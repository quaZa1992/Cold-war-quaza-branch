l_english:
 enbo_aipac_category: "AIPAC"
 enbo_aipac_category_desc: "A tool to reward or punish U.S. actions through AIPAC influence."

 enbo_israel_aipac_happy: "Launch AIPAC Support Campaign"
 enbo_israel_aipac_happy_desc: "Use AIPAC influence to reward U.S. actions with 180 days of political and fiscal support."
 enbo_israel_aipac_unpleased: "Launch AIPAC Pressure Campaign"
 enbo_israel_aipac_unpleased_desc: "Use AIPAC influence to punish U.S. actions with 180 days of political and fiscal pressure."
 enbo_israel_withdraw_aipac_pressure: "Rescind AIPAC Pressure Campaign"
 enbo_israel_withdraw_aipac_pressure_desc: "Withdraw the current pressure campaign and remove its effects from the United States early."
 enbo_usa_send_monetary_package_to_israel: "Send Monetary Package to Israel"
 enbo_usa_send_monetary_package_to_israel_desc: "Authorize a 5 billion USD monetary package to Israel while AIPAC remains active. This can only be done once every 360 days."
 enbo_usa_end_aipac: "End AIPAC"
 enbo_usa_end_aipac_desc: "Permanently remove Israel's AIPAC leverage over U.S. actions. Requires an overwhelming Congressional mandate and carries heavy political and economic costs."

 enbo_aipac_ended: "AIPAC Influence Ended"
 enbo_aipac_terminated: "AIPAC Influence Terminated"

 enbo_aipac_happy: "AIPAC-Aligned Support Campaign"
 enbo_aipac_happy_desc: "AIPAC-aligned advocacy networks are backing the current U.S. position, strengthening political momentum and reducing consumer goods pressure for a limited time."
 enbo_aipac_unpleased: "AIPAC-Aligned Pressure Campaign"
 enbo_aipac_unpleased_desc: "AIPAC-aligned advocacy networks are opposing the current U.S. position, weakening political momentum and increasing consumer goods pressure for a limited time."
 enbo_aipac_economic_lock: "AIPAC Break Shock"
 enbo_aipac_economic_lock_desc: "The break with AIPAC has triggered a one-year political and economic shock."

 enbo_aipac_requires_supermajority_tt: "Requires an overwhelming Congressional mandate: at least §Y75 Senators§! and §Y330 Representatives§! in support."
 enbo_aipac_signal_ready_tt: "Israel has not used an AIPAC signal in the last §Y365 days§!."
 enbo_aipac_signal_support_tt: "Adds §YAIPAC-Aligned Support Campaign§! to the United States for §Y180 days§!.\nEffects: §G+15%§! Political Power Gain, §G+5%§! Stability, §G+1%§! Corporate Tax, §G-2%§! Consumer Goods.\nIsrael's AIPAC signal is locked for §Y365 days§!."
 enbo_aipac_signal_displeasure_tt: "Adds §YAIPAC-Aligned Pressure Campaign§! to the United States for §Y180 days§!.\nEffects: §R-15%§! Political Power Gain, §R-5%§! Stability, §R-1%§! Corporate Tax, §R+2%§! Consumer Goods.\nIsrael's AIPAC signal is locked for §Y365 days§!."
 enbo_aipac_withdraw_pressure_tt: "Removes §YAIPAC-Aligned Pressure Campaign§! from the United States early."
 enbo_aipac_send_package_tt: "Transfers §Y5 billion USD§! from the United States to Israel.\nThe United States gains §G+5§! Wall Street Opinion and §G+5§! Influence in Israel.\nIsrael will be notified.\nThis decision is locked for §Y360 days§! after use."
 enbo_aipac_end_aipac_tt: "Permanently removes Israel's AIPAC leverage.\nThe United States loses §R15%§! Stability, drops one economic cycle stage, and receives §YAIPAC Break Shock§! for §Y360 days§!."

 enbo_aipac.1.t: "U.S. Monetary Package Arrives"
 enbo_aipac.1.d: "Washington has authorized and transferred a 5 billion USD monetary package to Israel. Treasury officials confirm that the funds have entered the national budget, while the move also deepens U.S. influence in Israeli policy circles as long as the AIPAC channel remains active."
 enbo_aipac.1.a: "The package has arrived."
 enbo_aipac.2.t: "AIPAC Support Campaign Backs U.S. Policy"
 enbo_aipac.2.d: "Israeli channels aligned with AIPAC have begun a coordinated support campaign in Washington after recent U.S. actions met Israeli expectations. The campaign strengthens the administration's political momentum and improves domestic stability for a limited period."
 enbo_aipac.2.a: "Support is building."
 enbo_aipac.3.t: "AIPAC Pressure Campaign Targets U.S. Policy"
 enbo_aipac.3.d: "Israeli channels aligned with AIPAC have launched a pressure campaign in Washington in response to U.S. actions viewed as harmful to Israeli interests. The campaign weakens political momentum and increases domestic pressure on the administration for a limited period."
 enbo_aipac.3.a: "Pressure is mounting."
