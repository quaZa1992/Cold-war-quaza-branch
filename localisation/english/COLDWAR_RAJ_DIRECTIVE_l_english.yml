l_english:
# IMPERIA COLD WAR — India's occupation directives and treaty notices (B4, 24.11.2026)
 COLDWAR_RAJ_DIRECTIVE_refuse:0 "We refuse."
 COLDWAR_RAJ_DIRECTIVE_ok:0 "Very well."
 COLDWAR_RAJ_DIRECTIVE.1.t:0 "An Indian Civil Administration"
 COLDWAR_RAJ_DIRECTIVE.1.d:0 "[From.GetNameDefCap] asks us to accept a civil occupation administration: an Indian-backed council government, suspended elections and Indian administrators in the ministries."
 COLDWAR_RAJ_DIRECTIVE.1.a:0 "We comply."
 COLDWAR_RAJ_1970_dir_pak_civil_send_tt:0 "§Y[PAK.GetNameDefCap]§! decides whether to accept §YAn Indian Civil Administration§!."
 COLDWAR_RAJ_DIRECTIVE.101.t:0 "An Indian Civil Administration: Accepted"
 COLDWAR_RAJ_DIRECTIVE.101.d:0 "[From.GetNameDefCap] has accepted our directive."
 COLDWAR_RAJ_DIRECTIVE.2.t:0 "An Indian Military Administration"
 COLDWAR_RAJ_DIRECTIVE.2.d:0 "[From.GetNameDefCap] asks us to accept a military occupation administration: an Indian-backed military government, suspended elections and Indian officers in command of the provinces."
 COLDWAR_RAJ_DIRECTIVE.2.a:0 "We comply."
 COLDWAR_RAJ_1970_dir_pak_military_send_tt:0 "§Y[PAK.GetNameDefCap]§! decides whether to accept §YAn Indian Military Administration§!."
 COLDWAR_RAJ_DIRECTIVE.102.t:0 "An Indian Military Administration: Accepted"
 COLDWAR_RAJ_DIRECTIVE.102.d:0 "[From.GetNameDefCap] has accepted our directive."
 COLDWAR_RAJ_DIRECTIVE.3.t:0 "A Joint Civil Council"
 COLDWAR_RAJ_DIRECTIVE.3.d:0 "[From.GetNameDefCap] asks us to accept a joint civil council that sits beside our ministries."
 COLDWAR_RAJ_DIRECTIVE.3.a:0 "We comply."
 COLDWAR_RAJ_1970_dir_pak_council_send_tt:0 "§Y[PAK.GetNameDefCap]§! decides whether to accept §YA Joint Civil Council§!."
 COLDWAR_RAJ_DIRECTIVE.103.t:0 "A Joint Civil Council: Accepted"
 COLDWAR_RAJ_DIRECTIVE.103.d:0 "[From.GetNameDefCap] has accepted our directive."
 COLDWAR_RAJ_DIRECTIVE.4.t:0 "A Joint Military Staff"
 COLDWAR_RAJ_DIRECTIVE.4.d:0 "[From.GetNameDefCap] asks us to accept a joint military staff that oversees our armed forces."
 COLDWAR_RAJ_DIRECTIVE.4.a:0 "We comply."
 COLDWAR_RAJ_1970_dir_pak_military_staff_send_tt:0 "§Y[PAK.GetNameDefCap]§! decides whether to accept §YA Joint Military Staff§!."
 COLDWAR_RAJ_DIRECTIVE.104.t:0 "A Joint Military Staff: Accepted"
 COLDWAR_RAJ_DIRECTIVE.104.d:0 "[From.GetNameDefCap] has accepted our directive."
 COLDWAR_RAJ_DIRECTIVE.5.t:0 "Supervised Local Elections"
 COLDWAR_RAJ_DIRECTIVE.5.d:0 "[From.GetNameDefCap] asks us to accept supervised local elections under Indian observers."
 COLDWAR_RAJ_DIRECTIVE.5.a:0 "We comply."
 COLDWAR_RAJ_1970_dir_pak_elections_send_tt:0 "§Y[PAK.GetNameDefCap]§! decides whether to accept §YSupervised Local Elections§!."
 COLDWAR_RAJ_DIRECTIVE.105.t:0 "Supervised Local Elections: Accepted"
 COLDWAR_RAJ_DIRECTIVE.105.d:0 "[From.GetNameDefCap] has accepted our directive."
 COLDWAR_RAJ_DIRECTIVE.6.t:0 "Central Rule from Delhi"
 COLDWAR_RAJ_DIRECTIVE.6.d:0 "[From.GetNameDefCap] asks us to accept central rule over our provinces from Delhi."
 COLDWAR_RAJ_DIRECTIVE.6.a:0 "We comply."
 COLDWAR_RAJ_1970_dir_pak_central_rule_send_tt:0 "§Y[PAK.GetNameDefCap]§! decides whether to accept §YCentral Rule from Delhi§!."
 COLDWAR_RAJ_DIRECTIVE.106.t:0 "Central Rule from Delhi: Accepted"
 COLDWAR_RAJ_DIRECTIVE.106.d:0 "[From.GetNameDefCap] has accepted our directive."
 COLDWAR_RAJ_DIRECTIVE.7.t:0 "Indian Garrisons"
 COLDWAR_RAJ_DIRECTIVE.7.d:0 "[From.GetNameDefCap] asks us to accept Indian garrisons in our cities and cantonments."
 COLDWAR_RAJ_DIRECTIVE.7.a:0 "We comply."
 COLDWAR_RAJ_1970_dir_pak_garrison_send_tt:0 "§Y[PAK.GetNameDefCap]§! decides whether to accept §YIndian Garrisons§!."
 COLDWAR_RAJ_DIRECTIVE.107.t:0 "Indian Garrisons: Accepted"
 COLDWAR_RAJ_DIRECTIVE.107.d:0 "[From.GetNameDefCap] has accepted our directive."
 COLDWAR_RAJ_DIRECTIVE.8.t:0 "Indian Training Missions"
 COLDWAR_RAJ_DIRECTIVE.8.d:0 "[From.GetNameDefCap] asks us to accept Indian training missions for our officers."
 COLDWAR_RAJ_DIRECTIVE.8.a:0 "We comply."
 COLDWAR_RAJ_1970_dir_pak_training_send_tt:0 "§Y[PAK.GetNameDefCap]§! decides whether to accept §YIndian Training Missions§!."
 COLDWAR_RAJ_DIRECTIVE.108.t:0 "Indian Training Missions: Accepted"
 COLDWAR_RAJ_DIRECTIVE.108.d:0 "[From.GetNameDefCap] has accepted our directive."
 COLDWAR_RAJ_DIRECTIVE.9.t:0 "The Occupation Ends"
 COLDWAR_RAJ_DIRECTIVE.9.d:0 "We are no longer a subject of [From.GetNameDef]. The occupation administration can be dismantled."
 COLDWAR_RAJ_DIRECTIVE.9.a:0 "We govern ourselves again."
 COLDWAR_RAJ_1970_dir_pak_cleanup_send_tt:0 "§Y[PAK.GetNameDefCap]§! decides whether to accept §YThe Occupation Ends§!."
 COLDWAR_RAJ_DIRECTIVE.10.t:0 "An Indian Protectorate"
 COLDWAR_RAJ_DIRECTIVE.10.d:0 "[From.GetNameDefCap] asks us to accept a protectorate administration under an Indian military governor until the country is stable."
 COLDWAR_RAJ_DIRECTIVE.10.a:0 "We comply."
 COLDWAR_RAJ_1970_dir_ban_occupation_send_tt:0 "§Y[BAN.GetNameDefCap]§! decides whether to accept §YAn Indian Protectorate§!."
 COLDWAR_RAJ_DIRECTIVE.110.t:0 "An Indian Protectorate: Accepted"
 COLDWAR_RAJ_DIRECTIVE.110.d:0 "[From.GetNameDefCap] has accepted our directive."
 COLDWAR_RAJ_DIRECTIVE.11.t:0 "An Indian Military Governor"
 COLDWAR_RAJ_DIRECTIVE.11.d:0 "[From.GetNameDefCap] asks us to place the protectorate under an Indian military governor."
 COLDWAR_RAJ_DIRECTIVE.11.a:0 "We comply."
 COLDWAR_RAJ_1970_dir_ban_military_governor_send_tt:0 "§Y[BAN.GetNameDefCap]§! decides whether to accept §YAn Indian Military Governor§!."
 COLDWAR_RAJ_DIRECTIVE.12.t:0 "An Indian Civil Commissioner"
 COLDWAR_RAJ_DIRECTIVE.12.d:0 "[From.GetNameDefCap] asks us to place the protectorate under a civilian commissioner."
 COLDWAR_RAJ_DIRECTIVE.12.a:0 "We comply."
 COLDWAR_RAJ_1970_dir_ban_civil_commissioner_send_tt:0 "§Y[BAN.GetNameDefCap]§! decides whether to accept §YAn Indian Civil Commissioner§!."
 COLDWAR_RAJ_DIRECTIVE.13.t:0 "Integration into India"
 COLDWAR_RAJ_DIRECTIVE.13.d:0 "[From.GetNameDefCap] proposes a five-year integration programme under a civilian commissioner, ending in full union with India."
 COLDWAR_RAJ_DIRECTIVE.13.a:0 "We comply."
 COLDWAR_RAJ_1970_dir_ban_integration_send_tt:0 "§Y[BAN.GetNameDefCap]§! decides whether to accept §YIntegration into India§!."
 COLDWAR_RAJ_DIRECTIVE.113.t:0 "Integration into India: Accepted"
 COLDWAR_RAJ_DIRECTIVE.113.d:0 "[From.GetNameDefCap] has accepted our directive."
 COLDWAR_RAJ_DIRECTIVE.14.t:0 "Sharing the Protectorate Costs"
 COLDWAR_RAJ_DIRECTIVE.14.d:0 "[From.GetNameDefCap] asks us to share the running costs of the protectorate."
 COLDWAR_RAJ_DIRECTIVE.14.a:0 "We comply."
 COLDWAR_RAJ_1970_dir_ban_protectorate_cost_send_tt:0 "§Y[BAN.GetNameDefCap]§! decides whether to accept §YSharing the Protectorate Costs§!."
 COLDWAR_RAJ_DIRECTIVE.114.t:0 "Sharing the Protectorate Costs: Accepted"
 COLDWAR_RAJ_DIRECTIVE.114.d:0 "[From.GetNameDefCap] has accepted our directive."
 COLDWAR_RAJ_DIRECTIVE.15.t:0 "The Protectorate Ends"
 COLDWAR_RAJ_DIRECTIVE.15.d:0 "We are no longer a subject of [From.GetNameDef]. The protectorate administration can be dismantled."
 COLDWAR_RAJ_DIRECTIVE.15.a:0 "We govern ourselves again."
 COLDWAR_RAJ_1970_dir_ban_cleanup_send_tt:0 "§Y[BAN.GetNameDefCap]§! decides whether to accept §YThe Protectorate Ends§!."
 COLDWAR_RAJ_DIRECTIVE.16.t:0 "Integration Programme: Year 1"
 COLDWAR_RAJ_DIRECTIVE.16.d:0 "[From.GetNameDefCap] offers the next stage of the integration programme."
 COLDWAR_RAJ_DIRECTIVE.16.a:0 "We accept."
 COLDWAR_RAJ_1970_dir_ban_year_1_send_tt:0 "§Y[BAN.GetNameDefCap]§! decides whether to accept §YIntegration Programme: Year 1§!."
 COLDWAR_RAJ_DIRECTIVE.17.t:0 "Integration Programme: Year 2"
 COLDWAR_RAJ_DIRECTIVE.17.d:0 "[From.GetNameDefCap] offers the next stage of the integration programme."
 COLDWAR_RAJ_DIRECTIVE.17.a:0 "We accept."
 COLDWAR_RAJ_1970_dir_ban_year_2_send_tt:0 "§Y[BAN.GetNameDefCap]§! decides whether to accept §YIntegration Programme: Year 2§!."
 COLDWAR_RAJ_DIRECTIVE.18.t:0 "Integration Programme: Year 3"
 COLDWAR_RAJ_DIRECTIVE.18.d:0 "[From.GetNameDefCap] offers the next stage of the integration programme."
 COLDWAR_RAJ_DIRECTIVE.18.a:0 "We accept."
 COLDWAR_RAJ_1970_dir_ban_year_3_send_tt:0 "§Y[BAN.GetNameDefCap]§! decides whether to accept §YIntegration Programme: Year 3§!."
 COLDWAR_RAJ_DIRECTIVE.19.t:0 "Integration Programme: Year 4"
 COLDWAR_RAJ_DIRECTIVE.19.d:0 "[From.GetNameDefCap] offers the next stage of the integration programme."
 COLDWAR_RAJ_DIRECTIVE.19.a:0 "We accept."
 COLDWAR_RAJ_1970_dir_ban_year_4_send_tt:0 "§Y[BAN.GetNameDefCap]§! decides whether to accept §YIntegration Programme: Year 4§!."
 COLDWAR_RAJ_DIRECTIVE.20.t:0 "Integration Programme: Year 5"
 COLDWAR_RAJ_DIRECTIVE.20.d:0 "[From.GetNameDefCap] offers the next stage of the integration programme."
 COLDWAR_RAJ_DIRECTIVE.20.a:0 "We accept."
 COLDWAR_RAJ_1970_dir_ban_year_5_send_tt:0 "§Y[BAN.GetNameDefCap]§! decides whether to accept §YIntegration Programme: Year 5§!."
 COLDWAR_RAJ_DIRECTIVE.120.t:0 "Integration Programme: Year 5: Accepted"
 COLDWAR_RAJ_DIRECTIVE.120.d:0 "[From.GetNameDefCap] has accepted our directive."
 COLDWAR_RAJ_DIRECTIVE.99.t:0 "Directive Refused"
 COLDWAR_RAJ_DIRECTIVE.99.d:0 "[From.GetNameDefCap] has refused our directive. Our administration will have to work around it."
 COLDWAR_RAJ_DIRECTIVE.200.t:0 "Agreement with India"
 COLDWAR_RAJ_DIRECTIVE.200.d:0 "The status of one of our agreements with [From.GetNameDef] has changed. Our part of it is adjusted accordingly."
