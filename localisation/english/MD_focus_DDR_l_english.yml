 DDR_state_of_the_republic: "State of the Republic"
 DDR_state_of_the_republic_desc: "The German Democratic Republic enters 1985 as the most developed state of the Eastern Bloc, but its stability rests on subsidized industry, party discipline, Soviet protection, and the Wall. The decade ahead will not wait for us to feel ready."
 DDR_retool_the_kombinate: "Retool the Kombinate"
 DDR_retool_the_kombinate_desc: "The industrial combines remain the backbone of our economy. New machine tools, tighter planning, and carefully chosen investment can keep them productive without surrendering central control."
 DDR_lignite_and_chemicals: "Lignite and Chemicals"
 DDR_lignite_and_chemicals_desc: "Our chemical triangle and lignite basins are dirty, expensive, and indispensable. If hard currency is scarce, domestic inputs must carry the plan."
 DDR_leuna_schkopau_modernization: "Leuna-Schkopau Modernization"
 DDR_leuna_schkopau_modernization_desc: "The old chemical giants can still be made to serve the republic. Modern process equipment will buy us output, exports, and time."
 DDR_microelectronics_program: "Microelectronics Program"
 DDR_microelectronics_program_desc: "The gap with Western computing widens each year. Robotron, Dresden, and party-backed research must be pushed to make the DDR a socialist technology workshop."
 DDR_robotron_mainframes: "Robotron Mainframes"
 DDR_robotron_mainframes_desc: "Robotron can become more than a prestige project. Better computing will serve industry, planning, and the security apparatus alike."
 DDR_housing_combine: "Expand the Housing Combine"
 DDR_housing_combine_desc: "New apartments are political stability in concrete form. The Plattenbau program is not glamorous, but it gives workers something they can touch."
 DDR_new_five_year_plan: "A New Five Year Plan"
 DDR_new_five_year_plan_desc: "The old plan is too rigid for the pressures ahead. A modernized plan can keep socialist ownership while giving factories enough room to actually function."

 DDR_party_congress_1985: "Party Congress of 1985"
 DDR_party_congress_1985_desc: "The SED must speak with one voice. Whether that voice repeats the old certainties or admits that Moscow is changing is the question before the party."
 DDR_confirm_honecker_line: "Confirm the Honecker Line"
 DDR_confirm_honecker_line_desc: "The Wall stands, the party leads, and the West waits in vain. We will not let fashionable talk of restructuring undermine the republic."
 DDR_listen_to_moscow_winds: "Listen to Moscow's Winds"
 DDR_listen_to_moscow_winds_desc: "The Kremlin is changing its language. The DDR does not need chaos, but it may need controlled adaptation before adaptation arrives without permission."
 DDR_refine_reporting_net: "Refine the Reporting Net"
 DDR_refine_reporting_net_desc: "Files, informants, and quiet conversations keep the state aware of itself. The more precise the net, the less often force is needed."
 DDR_church_dialogue: "Church Dialogue"
 DDR_church_dialogue_desc: "Church spaces are becoming places where frustration can speak. Controlled dialogue may be safer than pretending the rooms are empty."
 DDR_party_survives_the_decade: "The Party Survives the Decade"
 DDR_party_survives_the_decade_desc: "Survival requires more than slogans. The party must be feared, trusted, useful, or all three."

 DDR_nationale_volksarmee: "Nationale Volksarmee"
 DDR_nationale_volksarmee_desc: "The NVA is one of the Warsaw Pact's most disciplined armies. Discipline must now be matched by readiness."
 DDR_border_troops_command: "Border Troops Command"
 DDR_border_troops_command_desc: "The border is not only a line on a map. It is a system of watchtowers, patrols, signals, and political certainty."
 DDR_air_defense_ring: "Berlin Air Defense Ring"
 DDR_air_defense_ring_desc: "Any conflict in Europe will find Berlin first. Radar coverage and anti-air coordination must be ready before the crisis starts."
 DDR_tank_workshops: "Tank Workshops"
 DDR_tank_workshops_desc: "Soviet designs are reliable, but our workshops must keep them in the field. Maintenance capacity is combat power."
 DDR_warsaw_pact_readiness: "Warsaw Pact Readiness"
 DDR_warsaw_pact_readiness_desc: "Exercises, stockpiles, and command preparation will make the NVA a force Moscow can rely on and Bonn cannot ignore."

 DDR_between_moscow_and_bonn: "Between Moscow and Bonn"
 DDR_between_moscow_and_bonn_desc: "Our geography is our danger and our leverage. We sit between the Soviet center and the West German wallet."
 DDR_moscow_credit_line: "Moscow Credit Line"
 DDR_moscow_credit_line_desc: "Soviet backing still matters. We can trade loyalty for material support, equipment access, and breathing room."
 DDR_inner_german_trade: "Inner-German Trade"
 DDR_inner_german_trade_desc: "The Federal Republic is an ideological rival, but hard currency spends the same. Carefully managed trade can keep the shelves fuller."
 DDR_solidarity_exports: "Solidarity Exports"
 DDR_solidarity_exports_desc: "Advisers, machinery, and technical missions abroad expand our diplomatic reach and show that the DDR is more than a Soviet border post."
 DDR_status_quo_diplomacy: "Status Quo Diplomacy"
 DDR_status_quo_diplomacy_desc: "Recognition, restraint, and predictable borders can protect the DDR while the superpowers test new ideas."

 DDR_kommerzielle_koordinierung: "Kommerzielle Koordinierung"
 DDR_kommerzielle_koordinierung_desc: "KoKo is the republic's shadow economy: discreet deals, hard currency, and useful ambiguity. It is ugly, effective, and ours."
 DDR_intershop_hard_currency: "Intershop Hard Currency"
 DDR_intershop_hard_currency_desc: "The Intershops are an admission and a tool. Western currency can buy imports the planned economy cannot provide."
 DDR_secret_siemens_channels: "Secret Siemens Channels"
 DDR_secret_siemens_channels_desc: "Embargoes are walls with doors if one knows where to knock. Carefully hidden technical purchases can accelerate our electronics program."
 DDR_the_wall_listens: "The Wall Listens"
 DDR_the_wall_listens_desc: "The Wall is concrete, but it is also microphones, files, informants, and patterns. Let every crossing tell us something."
 DDR_alexanderplatz_signal: "Alexanderplatz Signal"
 DDR_alexanderplatz_signal_desc: "A state that never listens eventually hears only shouting. Limited civic opening may preserve what force alone cannot."
 DDR_plan_89: "Plan 89"
 DDR_plan_89_desc: "The end of the decade is already visible. Whether we enter it as a disciplined socialist state or a brittle museum depends on what we prepare now."

 DDR_idea_socialist_planned_economy: "Aging Planned Economy"
 DDR_idea_socialist_planned_economy_desc: "The DDR's planned economy is organized, educated, and increasingly slow. Shortages, outdated machinery, and hard-currency pressure are beginning to grind against the state's ambitions."
 DDR_idea_reformed_planned_economy: "Reformed Planned Economy"
 DDR_idea_reformed_planned_economy_desc: "The plan remains central, but factory managers have been given enough flexibility to solve problems before they become statistics."
 DDR_idea_ministry_for_state_security: "Ministry for State Security"
 DDR_idea_ministry_for_state_security_desc: "The Stasi gives the party an extraordinary view into society. That knowledge creates stability, but also fear."
 DDR_idea_ministry_for_state_security_2: "Ministry for State Security"
 DDR_idea_ministry_for_state_security_2_desc: "The reporting net has been refined into a sharper instrument, focusing less on noise and more on early warnings."
 DDR_idea_berlin_wall: "The Berlin Wall"
 DDR_idea_berlin_wall_desc: "The Wall secures the republic and defines it. Every benefit it brings carries a political cost."
 DDR_idea_nva_warsaw_pact: "Warsaw Pact Doctrine"
 DDR_idea_nva_warsaw_pact_desc: "The Nationale Volksarmee is disciplined, Soviet-equipped, and built for the first hours of a European war."
 DDR_idea_nva_modernized: "Modernized Warsaw Pact Doctrine"
 DDR_idea_nva_modernized_desc: "Improved workshops, exercises, and command routines have made the NVA a more credible force."
 DDR_idea_kombinate_retooling: "Retooled Kombinate"
 DDR_idea_kombinate_retooling_desc: "Modernized industrial combines can keep the plan moving despite the pressure of the 1980s."
 DDR_idea_robotron_program: "Robotron Program"
 DDR_idea_robotron_program_desc: "State-backed electronics investment is slowly pushing computing into industry, planning, and defense."
 DDR_idea_honecker_line: "The Honecker Line"
 DDR_idea_honecker_line_desc: "The leadership has chosen continuity and ideological firmness over uncertain reform."
 DDR_idea_cautious_reforms: "Cautious Reforms"
 DDR_idea_cautious_reforms_desc: "Small reforms have begun, carefully limited and closely watched."
 DDR_idea_border_troops: "Border Troops"
 DDR_idea_border_troops_desc: "The border troops are a political army as much as a military one."
 DDR_idea_moscow_guarantees: "Moscow Guarantees"
 DDR_idea_moscow_guarantees_desc: "Soviet support provides equipment access, diplomatic protection, and a reminder of dependence."
 DDR_idea_inner_german_trade: "Inner-German Trade"
 DDR_idea_inner_german_trade_desc: "Trade with the Federal Republic brings hard currency and uncomfortable questions."
 DDR_idea_ko_ko_network: "KoKo Network"
 DDR_idea_ko_ko_network_desc: "Commercial Coordination keeps hard currency flowing through channels best left undescribed."
 DDR_idea_the_wall_listens: "The Wall Listens"
 DDR_idea_the_wall_listens_desc: "The security services have turned the border regime into an intelligence instrument."
 DDR_idea_civic_opening: "Civic Opening"
 DDR_idea_civic_opening_desc: "Limited public space has been opened to reduce pressure, though it may create demands the party cannot fully control."
