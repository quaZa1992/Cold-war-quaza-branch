l_english:
 mdcw_howitzer_1940:0 "Wartime Howitzer Mount"
 mdcw_howitzer_1940_desc:0 "A conventional field howitzer adapted to a tracked platform. It uses the same artillery ammunition slots as later MD guns, with lower performance and production cost."
 mdcw_howitzer_1955:0 "Post-War Howitzer Mount"
 mdcw_howitzer_1955_desc:0 "Improved recoil handling and gun mounting raise firepower above wartime systems, while remaining below the 1965 MD gun."
 mdcw_rocket_launcher_1955:0 "Early Unguided Rocket Launcher"
 mdcw_rocket_launcher_1955_desc:0 "An early post-war unguided rocket launcher. It requires an external rocket rack and artillery ammunition, following the MD rocket-artillery slot structure."
 mdcw_artillery_light_ammo_1940:0 "Wartime Light Artillery Ammunition"
 mdcw_artillery_light_ammo_1940_desc:0 "A light shell load with lower firepower and production cost than the first modern MD load. It retains MD light ammunition's relative defensive and supply characteristics."
 mdcw_artillery_medium_ammo_1940:0 "Wartime Medium Artillery Ammunition"
 mdcw_artillery_medium_ammo_1940_desc:0 "A medium shell load trading production and supply cost for more firepower than the light load. It uses MD's existing artillery ammunition category."
 mdcw_artillery_heavy_ammo_1942:0 "Wartime Heavy Artillery Ammunition"
 mdcw_artillery_heavy_ammo_1942_desc:0 "Heavy shells provide the strongest early artillery load at a much higher production and supply cost and with poorer defensive characteristics. Performance remains below modern MD heavy ammunition."
 mdcw_spaa_autocannon_1940:0 "Wartime Anti-Aircraft Gun Mount"
 mdcw_spaa_autocannon_1940_desc:0 "A conventional light anti-aircraft cannon mount for a separately researched tracked chassis. It requires optical guidance and anti-aircraft ammunition; no radar or guided missiles are included."
 mdcw_spaa_autocannon_1950:0 "Post-War Anti-Aircraft Gun Mount"
 mdcw_spaa_autocannon_1950_desc:0 "Improved post-war cannon mounts raise anti-aircraft firepower. They remain optically aimed and less effective than the first native MD generation."
 mdcw_spaa_ammo_1940:0 "Wartime Anti-Aircraft Ammunition"
 mdcw_spaa_ammo_1940_desc:0 "Conventional anti-aircraft cannon ammunition without modern electronic fuzes. Lower anti-aircraft performance is balanced by lower cost and no microchip requirement."
 mdcw_spaa_ammo_1950:0 "Post-War Anti-Aircraft Ammunition"
 mdcw_spaa_ammo_1950_desc:0 "Improved conventional anti-aircraft ammunition. It remains weaker than native MD ammunition and does not require microchips."
 mdcw_spaa_optical_guidance_1940:0 "Mechanical Anti-Aircraft Director"
 mdcw_spaa_optical_guidance_1940_desc:0 "A mechanical optical director for early vehicle-mounted anti-aircraft guns. It fills MD's dedicated anti-aircraft guidance slot, without granting radar detection."
 mdcw_rocket_rack_1955:0 "Early Rocket Launch Rack"
 mdcw_rocket_rack_1955_desc:0 "A simple external launch rack for early unguided rocket artillery. It uses MD's external reload category and is restricted to rocket-artillery chassis."
