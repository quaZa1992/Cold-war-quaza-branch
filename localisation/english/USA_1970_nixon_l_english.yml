 USA_1970_phase_one_price_controls: "Phase I Price Controls"
 USA_1970_phase_one_price_controls_desc: "The ninety-day wage and price freeze briefly calms expectations and household costs, but distorted prices constrain output and new construction. Its immediate relief will expire; the administrative machinery will not disappear so quickly."
 USA_1970_NIX.1.t: "The Pentagon Papers"
 USA_1970_NIX.1.d: "The press has begun publishing a classified history of American decision-making in Vietnam. The documents span several administrations, but the disclosure now confronts this White House with a choice between institutional restraint and an aggressive counterintelligence response."
 USA_1970_NIX.1.a: "The credibility gap is now public"
