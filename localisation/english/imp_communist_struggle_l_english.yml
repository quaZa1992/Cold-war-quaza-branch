# IMPERIA CW — Cold War: Imperia communist struggle — English localisation.
 imp_communist_struggle_decisions: "Struggle for leadership of the Revolution"
 imp_communist_struggle_decisions_desc: "\n\n\n\n\n\n\n £GFX_chi_sov_rivalry_icon \n \n \n \n \n \n \n\n\n\nAfter the §OSino§!-§RSoviet§! split, there has been a constant struggle for the leadership of the communist revolution, and which branch of communism should revolutionaries follow. China follows the Maoist branch, with the leading figure being Mao Zedong himself, meanwhile Soviet Union follows Marxist-Leninism. Now, it is your job to prove §Y[ROOT.GetName]§! is the more dominant branch and is the real leader of the revolution.\n\nThere are several ways to increase your score. §BInternal§! and §Cexternal§!.\n\n§BInternal§! score is dependant on your army and economy. Internal score will be recounted every month.\n§CExternal§! score is gained through events, like winning border conflicts against the other power. External score will be reduced by 1 every month.\n\n[SOV.GetFlag]§R[SOV.GetName]§!: [?SOV.imp_internal_score_SOV]\n[CHI.GetFlag]§O[CHI.GetName]§!: [?CHI.imp_internal_score_CHI]"