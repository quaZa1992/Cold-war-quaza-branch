 COLDWAR_EB.1.desc:0 "It began with something small: a price rise, a rumour, an arrest in front of a factory gate. Within days the anger that had been held down for months is out in the open.\n\nPressure turned into Unrest: §R+[?COLDWAR_EB_last_spark|0]§!"
 COLDWAR_EB.2.desc:0 "Years of fear have turned into open hatred. Army units refuse to fire on the crowds, party offices are burning and a rival government has been proclaimed in the provinces.\n\nThe country slides into civil war."
 COLDWAR_EB.3.desc:0 "The streets belong to the crowds. The Politburo meets through the night while the security service reports that it can no longer guarantee order.\n\nUnrest: §R[?COLDWAR_EB_unrest|0]§!\nPressure: §Y[?COLDWAR_EB_pressure|0]§!\n\nWhatever we decide tonight will decide the fate of socialism in our country."
 COLDWAR_EB.4.desc:0 "Party officials, strike leaders, priests and dissidents sit at one table for the first time. The opposition demands elections. The only question left is how free they will be."
 COLDWAR_EB.7.desc:0 "Before the votes were counted, hardliners in the army and the security service moved against the Round Table. The opposition calls the people to arms."
 COLDWAR_EB.8.desc:0 "The leadership of [From.GetNameDef] asks for our backing against the counter-revolution at home. Unrest there stands at §R[?From.COLDWAR_EB_unrest|0]§!.\n\nIf we do not answer within 20 days, the request counts as refused."
 COLDWAR_EB.9.desc:0 "[SOV.GetNameDefCap] has granted our request. Soviet advisers arrive in the capital and the security service knows that the army will not waver."
 COLDWAR_EB.10.desc:0 "[SOV.GetNameDefCap] has not granted our request. We stand alone against our own people."
 COLDWAR_EB.12.desc:0 "Soviet tanks are rolling towards the capital. Moscow says it answers the call of loyal communists to defend socialism. Our army waits for orders."
 COLDWAR_EB.13.desc:0 "General Secretary [SOV.GetLeader] has assured the leadership of [?global.COLDWAR_EB_n_fa.GetNameDef] of the unwavering support of the Soviet Union. In a statement read on Soviet television, he declared that the socialist community will never allow the gains of socialism to be reversed by counter-revolutionary forces.\n\nSoviet military advisers are reported to have arrived in the capital."
 COLDWAR_EB.15.desc:0 "The ruling communist party in [From.GetNameDef] has lost control of the government after mounting political pressure. A new leadership has taken office in [From.Capital.GetName], promising a different course.\n\nThe change has unsettled neighbouring governments, which now face renewed questions about their own authority and the future of the socialist camp."
 COLDWAR_EB.16.desc:0 "The leadership of [From.GetNameDef] has openly rejected our advice and rallies its people behind a national line. Our ambassador reports cheering crowds in front of the party headquarters."
 COLDWAR_EB.17.desc:0 "Soviet tanks have crossed into [?global.COLDWAR_EB_n_ro.GetNameDef]. Moscow says it acts to defend socialism at the request of loyal communists. Western governments have condemned the intervention."
 COLDWAR_EB.18.desc:0 "Fighting has broken out in [From.GetNameDef] between forces loyal to the communist government and the opposition. Barricades stand in the streets of [From.Capital.GetName]."
 COLDWAR_EB.20.desc:0 "Typewritten copies of banned books and a clandestine bulletin pass from hand to hand in the universities and factories. The security service counts thousands of copies.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.30.desc:0 "Western correspondents in [From.Capital.GetName] report a growing flood of typewritten pamphlets and banned novels circulating in universities and factories. The authorities have not commented, but several known writers were reportedly questioned by the security service this week.\n\nObservers see the underground press as a sign that official censorship is losing its grip."
 COLDWAR_EB.21.desc:0 "Workers at one of our largest shipyards have downed tools over the new work norms. The strike committee demands talks with the government. Other plants are watching.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.31.desc:0 "Work has stopped at a major shipyard in [From.GetNameDef] after the management announced new work norms. A strike committee has occupied the gates and demands negotiations with the government. Workers at other plants have announced their solidarity.\n\nIt is the most serious labour unrest in the country in several years."
 COLDWAR_EB.22.desc:0 "Meat, sugar and washing powder have vanished from the shops. Queues form before dawn and the black market sets the real prices.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.32.desc:0 "Shops across [From.GetNameDef] have run out of meat, sugar and other basic goods. Queues form before dawn, and prices on the black market are said to be several times the official ones. The government blames hoarding and speculation.\n\nEconomists point to the growing gap between wages and the supply of consumer goods."
 COLDWAR_EB.23.desc:0 "After a banned theatre play, students march through the city centre chanting for free speech. Professors sign an open letter.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.33.desc:0 "Thousands of students marched through central [From.Capital.GetName] after the authorities banned a theatre production. Protesters chanted for freedom of speech before militia units dispersed the crowd near the university gates. Several professors have signed an open letter in support of the students."
 COLDWAR_EB.24.desc:0 "Opposition meetings now take place in parish halls. The bishops refuse to stop them and remind the state of its constitution.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.34.desc:0 "The bishops of [From.GetNameDef] have refused government demands to close parish halls to independent discussion groups. In a letter read from the pulpits on Sunday, they reminded the state of the rights guaranteed by the constitution.\n\nThe Church has become the largest independent institution in the country."
 COLDWAR_EB.25.desc:0 "Thousands try to leave over the borders of fraternal countries. Embassies of Western states are filling up with families who refuse to go home.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.35.desc:0 "Western embassies in [From.Capital.GetName] and in neighbouring capitals report thousands of citizens of [From.GetNameDef] seeking to leave the country. Entire families are camping in embassy gardens and refuse to return home.\n\nThe government has not yet decided whether to let them go or to close the borders."
 COLDWAR_EB.26.desc:0 "Hundreds of thousands march in every large city. The demands are no longer about prices: they want free unions and an end to censorship.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.36.desc:0 "Hundreds of thousands of people have taken to the streets in [From.Capital.GetName] and other cities of [From.GetNameDef]. The demands have moved beyond prices: protesters call for free trade unions, an end to censorship and the release of political prisoners.\n\nThe leadership has called an emergency session of the Politburo."
 COLDWAR_EB.27.desc:0 "Reformers and hardliners in the Politburo no longer speak to each other. Both sides leak to Moscow and to the Western press.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.37.desc:0 "Reports from [From.Capital.GetName] describe an open split in the Politburo between reformers and hardliners. Both sides are said to be briefing Moscow and the Western press. Official media have stopped reporting on the leadership altogether.\n\nAnalysts expect a change at the top within weeks."
 COLDWAR_EB.38.desc:0 "Documents smuggled out of [From.GetNameDef] name opposition activists who were arrested by the security service and never seen again. Relatives say that some of them were killed in custody. The government calls the reports a slander campaign.\n\nSeveral Western governments have summoned the ambassador of [From.GetNameDef]."
 # IMPERIA COLD WAR — State Security advisor (01.11.2026)
 COLDWAR_EB_adv.1.a: "Thank the comrades for their vigilance."
 COLDWAR_EB_adv.1.b: "The report exaggerates."
 COLDWAR_EB_adv.1.d: "Comrade [Root.GetLeader], [Root.COLDWAR_EB_GetAdvAgency] has completed its assessment of the mood in the country.\n\n[Root.COLDWAR_EB_GetAdvDriver][Root.COLDWAR_EB_GetAdvPressure]\n\n§YRecommendation:§! [Root.COLDWAR_EB_GetAdvRec]\n[Root.COLDWAR_EB_GetAdvRec2]\n\n§gUnrest [?Root.COLDWAR_EB_unrest|0], Pressure [?Root.COLDWAR_EB_pressure|0], crisis chance [?Root.COLDWAR_EB_chance|1]% per month.§!"
 COLDWAR_EB_adv.1.t: "A Report from [Root.COLDWAR_EB_GetAdvAgencyShort]"
 COLDWAR_EB_adv.2.a: "We will act. Immediately."
 COLDWAR_EB_adv.2.b: "Panic helps nobody."
 COLDWAR_EB_adv.2.d: "Comrade [Root.GetLeader], the head of [Root.COLDWAR_EB_GetAdvAgencyShort] has asked for an urgent audience. He does not sit down.\n\n[Root.COLDWAR_EB_GetAdvDriver][Root.COLDWAR_EB_GetAdvPressure]\n\n§YHe recommends:§! [Root.COLDWAR_EB_GetAdvRec]\n[Root.COLDWAR_EB_GetAdvRec2]\n\n§gUnrest [?Root.COLDWAR_EB_unrest|0], Pressure [?Root.COLDWAR_EB_pressure|0], crisis chance [?Root.COLDWAR_EB_chance|1]% per month.§!"
 COLDWAR_EB_adv.2.t: "An Urgent Audience"
 COLDWAR_EB_adv_driver_calm: "The situation is under control. The people grumble as they always do, but nothing points to organised resistance."
 COLDWAR_EB_adv_driver_corr: "The people see the dachas, the special shops and the cars of certain comrades. Corruption is the talk of every canteen, and it turns the workers against the party itself."
 COLDWAR_EB_adv_driver_econ: "The economy is the problem. Prices creep up, the shortages spread and the workers feel it in their wallets every week. The grumbling in the factories is about bread and meat, not about politics. Not yet."
 COLDWAR_EB_adv_driver_foreign: "Foreign broadcasters and imperialist agents are active. Western radio is heard in every kitchen, and foreign money finds its way to the malcontents."
 COLDWAR_EB_adv_driver_mood: "The mood is sour. The party organisations report empty meetings, and the people no longer believe that tomorrow will be better than today."
 COLDWAR_EB_adv_driver_opp: "An organised opposition is taking shape. Its leaders meet almost openly, print leaflets and collect signatures. Every week they find new followers."
 COLDWAR_EB_adv_driver_west: "Our informants in the queues hear one word more than any other: the West. People compare our shelves with what they see on Western television and in the parcels from their relatives. They no longer believe that we are catching up."
 COLDWAR_EB_adv_pressure_high: "\n\n§RWe must warn you: the anger has not gone, it is only held down. Pressure is building beneath the surface, and the lid will not hold forever.§!"
 COLDWAR_EB_adv_pressure_none: ""
 COLDWAR_EB_dec_advisor: "Request a Report from [Root.COLDWAR_EB_GetAdvAgencyShort]"
 COLDWAR_EB_dec_advisor_desc: "The security service watches the queues, the factories and the kitchens. Its officers can tell us where the anger comes from and what would help most right now."
 COLDWAR_EB_dec_advisor_tt: "[Root.COLDWAR_EB_GetAdvAgencyCap] reports where the Unrest comes from and which measure helps most right now."
