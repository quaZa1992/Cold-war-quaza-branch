 COLDWAR_EB_getadvrec_amnesty: "§YPolitical Amnesty§!: Releasing the prisoners lets the steam out before the boiler bursts. The West will approve."
 COLDWAR_EB_getadvrec_anticorr: "§YAnti-Corruption Drive§!: A few officials removed in public show the workers that the party cleans its own house."
 COLDWAR_EB_getadvrec_consumer: "§YConsumer Goods Priority§!: Fridges and televisions in the shops answer the comparison with the West better than any speech."
 COLDWAR_EB_getadvrec_freeze: "§YPrice Freeze§!: Bread and meat at yesterday's prices take the sting out of the shortages."
 COLDWAR_EB_getadvrec_info: "§YTighten the control of information§!: Managed or Sealed. Fewer foreign broadcasts mean fewer comparisons and fewer ideas."
 COLDWAR_EB_getadvrec_martial: "§YDeclare Martial Law§!: The army must take over the streets. It will cost us dearly abroad, but order comes first."
 COLDWAR_EB_getadvrec_negotiate: "§YNegotiate with the Strikers§!: Sign with the strike committees now, while they still ask for wages and not for our heads."
 COLDWAR_EB_getadvrec_none: "Everything sensible is already under way. We will keep watching."
 COLDWAR_EB_getadvrec_propaganda: "§YParty Propaganda Campaign§!: The people must hear about our achievements again, every day, on every channel."
 COLDWAR_EB_getadvrec_replace: "§YReplace the First Secretary§!: A new face at the top is the only thing that will convince the people that something changes. We say this with the greatest respect, Comrade."
 COLDWAR_EB_getadvrec_silence: "§YSilence the Dissidents§!: The ringleaders must disappear from the streets before others follow them. Discretion is essential: if it becomes known, the West will make a scandal of it."
 COLDWAR_EB_getadvrec_wages: "§YRaise Wages§!: Money in the workers' pockets buys us time, even if it feeds inflation."
