l_english:
# IMPERIA COLD WAR — Eastern Bloc Social Contract (localisation). Generated by Claude outputs/COLDWAR_EB_generator/build.py - do not edit by hand.
# COLDWAR | hand patch 01.11.2026 contracts: SEND/RECEIVE texts and COLDWAR_EB_H_R_GOODS_TT changed by hand; port to eb_loc.
 COLDWAR_EB.1.a: "We must restore calm."
 COLDWAR_EB.1.d: "It began with something small: a price rise, a rumour, an arrest in front of a factory gate. Within days the anger that had been held down for months is out in the open.\n\nPressure turned into Unrest: §R+[?COLDWAR_EB_last_spark|0]§!"
 COLDWAR_EB.1.t: "The Spark"
 COLDWAR_EB.10.a: "Then we must manage alone."
 COLDWAR_EB.10.d: "[SOV.GetNameDefCap] has not granted our request. We stand alone against our own people."
 COLDWAR_EB.10.t: "Moscow Turns Away"
 COLDWAR_EB.11.a: "Restore Socialist Order."
 COLDWAR_EB.11.b: "Offer Fraternal Assistance."
 COLDWAR_EB.11.c: "Watch and wait."
 COLDWAR_EB.11.c_tt: "No effect now. §YRestore Socialist Order: [From.GetName]§! stays available in our decisions for 365 days."
 COLDWAR_EB.11.d: "Let them go."
 COLDWAR_EB.11.d_tt: "[From.GetNameDefCap] leaves our sphere for good.\nAll members under our protection: §R10% chance of a Spark§!."
 COLDWAR_EB.11.da: "The KGB reports that §Y[From.GetNameDef]§! has reached a §RRevolutionary Situation§!. Strike committees control the factories and the leadership is losing control of the streets.\n\nUnrest: §R[?From.COLDWAR_EB_unrest|0]§! · Pressure (estimate): §Y[?From.COLDWAR_EB_p_lo|0] to [?From.COLDWAR_EB_p_hi|0]§! · Our doctrine: §Y[COLDWAR_EB_GetDoctrineName]§!\n\nThe Politburo must decide whether the Soviet Army restores order."
 COLDWAR_EB.11.db: "§Y[From.GetNameDefCap]§! has fallen into civil war. The opposition has taken up arms against a fraternal government.\n\nOur doctrine: §Y[COLDWAR_EB_GetDoctrineName]§!\n\nThe Politburo must decide whether the Soviet Army intervenes."
 COLDWAR_EB.11.dc: "§Y[From.GetNameDefCap]§! has left the socialist camp. The new government no longer answers to Moscow.\n\nOur doctrine: §Y[COLDWAR_EB_GetDoctrineName]§!\n\nThe Politburo must decide whether to bring it back."
 COLDWAR_EB.11.t: "Counter-Revolution in [From.GetName]?"
 COLDWAR_EB.12.a: "Welcome our allies."
 COLDWAR_EB.12.b: "Resist the invasion."
 COLDWAR_EB.12.d: "Soviet tanks are rolling towards the capital. Moscow says it answers the call of loyal communists to defend socialism. Our army waits for orders."
 COLDWAR_EB.12.t: "Fraternal Troops Cross the Border"
 COLDWAR_EB.13.a: "We will not stand alone."
 COLDWAR_EB.13.b: "Moscow tightens its grip."
 COLDWAR_EB.13.c: "Socialist solidarity in action."
 COLDWAR_EB.13.d: "Interesting."
 COLDWAR_EB.13.e: "We stand by our friends."
 COLDWAR_EB.13.t: "Moscow Pledges Support to [?global.COLDWAR_EB_n_fa.GetNameDef]"
 COLDWAR_EB.14.a: "So it is decided."
 COLDWAR_EB.14.b: "We will judge Moscow by its deeds."
 COLDWAR_EB.14.c: "Moscow has spoken."
 COLDWAR_EB.14.d: "Interesting."
 COLDWAR_EB.14.da: "In a speech to the Central Committee, General Secretary [SOV.GetLeader] declared that a threat to socialism in one fraternal country is a threat to all of them. The Soviet Union reserves the right to defend the socialist order wherever it is in danger."
 COLDWAR_EB.14.db: "General Secretary [SOV.GetLeader] has told the leaders of the fraternal parties that Moscow expects them to solve their problems on their own. Western diplomats see the first sign of a more cautious Soviet line."
 COLDWAR_EB.14.dc: "A spokesman of the Soviet Foreign Ministry has told Western journalists that every fraternal country may now go its own way. Asked what this means, he answered with a song by Frank Sinatra: they will do it their way."
 COLDWAR_EB.14.t: "Moscow Proclaims a New Line"
 COLDWAR_EB.15.a: "A new chapter begins."
 COLDWAR_EB.15.b: "Freedom is spreading."
 COLDWAR_EB.15.c: "This must not spread to us."
 COLDWAR_EB.15.d: "Interesting."
 COLDWAR_EB.15.t: "The Old Regime Falls in [From.GetNameDef]"
 COLDWAR_EB.16.a: "Let them have their moment."
 COLDWAR_EB.16.b: "Prepare to restore order."
 COLDWAR_EB.16.b_tt: "§YRestore Socialist Order: [From.GetName]§! becomes available in our decisions for 365 days."
 COLDWAR_EB.16.d: "The leadership of [From.GetNameDef] has openly rejected our advice and rallies its people behind a national line. Our ambassador reports cheering crowds in front of the party headquarters."
 COLDWAR_EB.16.t: "[From.GetName] Defies Moscow"
 COLDWAR_EB.17.a: "Our homeland is occupied."
 COLDWAR_EB.17.b: "A crime against a free people."
 COLDWAR_EB.17.c: "Socialism must be defended."
 COLDWAR_EB.17.d: "Interesting."
 COLDWAR_EB.17.e: "Order will be restored."
 COLDWAR_EB.17.t: "Soviet Troops Enter [?global.COLDWAR_EB_n_ro.GetNameDef]"
 COLDWAR_EB.18.a: "The fate of the nation is at stake."
 COLDWAR_EB.18.b: "The people rise against tyranny."
 COLDWAR_EB.18.c: "The counter-revolution must be crushed."
 COLDWAR_EB.18.d: "Interesting."
 COLDWAR_EB.18.t: "Civil War in [From.GetNameDef]"
 COLDWAR_EB.2.a: "The revolution has begun."
 COLDWAR_EB.2.d: "Years of fear have turned into open hatred. Army units refuse to fire on the crowds, party offices are burning and a rival government has been proclaimed in the provinces.\n\nThe country slides into civil war."
 COLDWAR_EB.2.t: "The Lid Blows"
 COLDWAR_EB.20.a: "We must respond."
 COLDWAR_EB.20.d: "Typewritten copies of banned books and a clandestine bulletin pass from hand to hand in the universities and factories. The security service counts thousands of copies.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.20.t: "Samizdat in Circulation"
 COLDWAR_EB.21.a: "We must respond."
 COLDWAR_EB.21.d: "Workers at one of our largest shipyards have downed tools over the new work norms. The strike committee demands talks with the government. Other plants are watching.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.21.t: "Wildcat Strike"
 COLDWAR_EB.22.a: "We must respond."
 COLDWAR_EB.22.d: "Meat, sugar and washing powder have vanished from the shops. Queues form before dawn and the black market sets the real prices.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.22.t: "Empty Shelves"
 COLDWAR_EB.23.a: "We must respond."
 COLDWAR_EB.23.d: "After a banned theatre play, students march through the city centre chanting for free speech. Professors sign an open letter.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.23.t: "Students in the Streets"
 COLDWAR_EB.24.a: "We must respond."
 COLDWAR_EB.24.d: "Opposition meetings now take place in parish halls. The bishops refuse to stop them and remind the state of its constitution.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.24.t: "The Church Shelters Dissent"
 COLDWAR_EB.25.a: "We must respond."
 COLDWAR_EB.25.d: "Thousands try to leave over the borders of fraternal countries. Embassies of Western states are filling up with families who refuse to go home.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.25.t: "The Exodus"
 COLDWAR_EB.26.a: "We must respond."
 COLDWAR_EB.26.d: "Hundreds of thousands march in every large city. The demands are no longer about prices: they want free unions and an end to censorship.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.26.t: "Protest Wave"
 COLDWAR_EB.27.a: "We must respond."
 COLDWAR_EB.27.d: "Reformers and hardliners in the Politburo no longer speak to each other. Both sides leak to Moscow and to the Western press.\n\nWe must answer with one of the decisions in §YThe Social Contract§!."
 COLDWAR_EB.27.t: "Politburo Split"
 COLDWAR_EB.3.a: "Invite the opposition to a Round Table."
 COLDWAR_EB.3.a_tt: "We choose the kind of elections in the next step."
 COLDWAR_EB.3.b: "Reform from above."
 COLDWAR_EB.3.c: "Crush the counter-revolution."
 COLDWAR_EB.3.c_tt: "Unrest: §G-40§!\nPressure: §R+30§!\nCold War Tension: §R+3§!\nOpinion of Western Bloc countries: §R-20§!\n§RCivil war chance: [?COLDWAR_EB_cw_crack|0]%§! (none with Hard Line for 90 days or with Fraternal Assistance)"
 COLDWAR_EB.3.d: "Step aside."
 COLDWAR_EB.3.d_tt: "The strongest opposition party takes over the government.\nUnrest is set to §Y25§!, Pressure to §Y10§!."
 COLDWAR_EB.3.t: "The Hour of Decision"
 COLDWAR_EB.30.a: "These are the scribblings of a few malcontents."
 COLDWAR_EB.30.b: "The free word cannot be silenced."
 COLDWAR_EB.30.c: "Our comrades must take this seriously."
 COLDWAR_EB.30.d: "Interesting."
 COLDWAR_EB.30.t: "Underground Press Spreads in [From.GetNameDef]"
 COLDWAR_EB.31.a: "The workers will return to work."
 COLDWAR_EB.31.b: "We stand with the workers."
 COLDWAR_EB.31.c: "A dangerous precedent."
 COLDWAR_EB.31.d: "Interesting."
 COLDWAR_EB.31.t: "Strike Paralyses Shipyards in [From.GetNameDef]"
 COLDWAR_EB.32.a: "Supplies will be restored shortly."
 COLDWAR_EB.32.b: "Planned economies cannot feed their people."
 COLDWAR_EB.32.c: "Fraternal help may be needed."
 COLDWAR_EB.32.d: "Interesting."
 COLDWAR_EB.32.t: "Severe Shortages in [From.GetNameDef]"
 COLDWAR_EB.33.a: "Foreign agitators are behind this."
 COLDWAR_EB.33.b: "The youth want freedom."
 COLDWAR_EB.33.c: "Order must be restored."
 COLDWAR_EB.33.d: "Interesting."
 COLDWAR_EB.33.t: "Student Protests in [From.Capital.GetName]"
 COLDWAR_EB.34.a: "The Church should keep to its altars."
 COLDWAR_EB.34.b: "Faith and freedom go together."
 COLDWAR_EB.34.c: "The clergy is overstepping its role."
 COLDWAR_EB.34.d: "Interesting."
 COLDWAR_EB.34.t: "Church and State at Odds in [From.GetNameDef]"
 COLDWAR_EB.35.a: "Traitors to the homeland."
 COLDWAR_EB.35.b: "They are welcome here."
 COLDWAR_EB.35.c: "The border must be controlled."
 COLDWAR_EB.35.d: "Interesting."
 COLDWAR_EB.35.t: "Thousands Flee [From.GetNameDef]"
 COLDWAR_EB.36.a: "The party will find an answer."
 COLDWAR_EB.36.b: "The people have spoken."
 COLDWAR_EB.36.c: "Moscow is watching closely."
 COLDWAR_EB.36.d: "Interesting."
 COLDWAR_EB.36.t: "Mass Protests Across [From.GetNameDef]"
 COLDWAR_EB.37.a: "The party stands united."
 COLDWAR_EB.37.b: "Change may be coming."
 COLDWAR_EB.37.c: "Unity of the party must be restored."
 COLDWAR_EB.37.d: "Interesting."
 COLDWAR_EB.37.t: "Rift in the Leadership of [From.GetNameDef]"
 COLDWAR_EB.38.a: "Lies spread by our enemies."
 COLDWAR_EB.38.b: "Murder in the name of order."
 COLDWAR_EB.38.c: "Our comrades should be more careful."
 COLDWAR_EB.38.d: "Interesting."
 COLDWAR_EB.38.t: "Disappearances in [From.GetNameDef]"
 COLDWAR_EB.4.a: "Hold free elections."
 COLDWAR_EB.4.a_tt: "Elections are held in 30 days.\nIf they pass peacefully: Unrest §G-30§!, Pressure §G-30§!, all parties except the ruling party §R+20%§! popularity, §Rthe one-party state ends§!.\n§RChance that the vote ends in civil war: [?COLDWAR_EB_vote_cw_1|0]%§!"
 COLDWAR_EB.4.b: "Hold semi-free elections."
 COLDWAR_EB.4.b_tt: "Elections are held in 30 days.\nIf they pass peacefully: Unrest §G-20§!, Pressure §G-15§!, all parties except the ruling party §R+12%§! popularity.\n§RChance that the vote ends in civil war: [?COLDWAR_EB_vote_cw_2|0]%§!"
 COLDWAR_EB.4.c: "Hold elections on our terms."
 COLDWAR_EB.4.c_tt: "Elections are held in 30 days.\nIf they pass peacefully: Unrest §G-10§!, Pressure §G-5§!, all parties except the ruling party §R+5%§! popularity.\n§RChance that the vote ends in civil war: [?COLDWAR_EB_vote_cw_3|0]%§!"
 COLDWAR_EB.4.d: "Party officials, strike leaders, priests and dissidents sit at one table for the first time. The opposition demands elections. The only question left is how free they will be."
 COLDWAR_EB.4.t: "The Round Table"
 COLDWAR_EB.6.a: "The people have spoken."
 COLDWAR_EB.6.a_tt: "The result of the vote is applied as announced."
 COLDWAR_EB.6.da: "For the first time since the war, people vote without fear. Lists of the opposition win seat after seat, and the party accepts the result.\n\nThe one-party state has ended."
 COLDWAR_EB.6.db: "A part of the seats was open to independent candidates, and they took almost all of them. The party keeps its majority, but no longer its monopoly."
 COLDWAR_EB.6.dc: "The official lists won, as they always do. Few believe the result, but the streets have grown quieter for now."
 COLDWAR_EB.6.t: "The People Have Voted"
 COLDWAR_EB.7.a: "The country is at war with itself."
 COLDWAR_EB.7.d: "Before the votes were counted, hardliners in the army and the security service moved against the Round Table. The opposition calls the people to arms."
 COLDWAR_EB.7.t: "The Vote Ends in Blood"
 COLDWAR_EB.8.a: "Grant Fraternal Assistance."
 COLDWAR_EB.8.b: "Refuse the request."
 COLDWAR_EB.8.c: "We will decide later."
 COLDWAR_EB.8.c_tt: "§YFraternal Assistance for [From.GetName]§! stays available in our decisions."
 COLDWAR_EB.8.d: "The leadership of [From.GetNameDef] asks for our backing against the counter-revolution at home. Unrest there stands at §R[?From.COLDWAR_EB_unrest|0]§!.\n\nIf we do not answer within 20 days, the request counts as refused."
 COLDWAR_EB.8.t: "A Request from [From.GetName]"
 COLDWAR_EB.9.a: "Long live the friendship of our peoples."
 COLDWAR_EB.9.d: "[SOV.GetNameDefCap] has granted our request. Soviet advisers arrive in the capital and the security service knows that the army will not waver."
 COLDWAR_EB.9.t: "Moscow Stands by Us"
 COLDWAR_EB_CONTRACT_1_RECEIVE_DESC: "[FROM.GetNameDefCap] asks us for a consumer goods contract of size §Y1§!. We answer in the event that follows."
 COLDWAR_EB_CONTRACT_1_SEND_DESC: "We ask [THIS.GetNameDef] for a one year contract of size §Y1§!. They answer within a day.\n\nWe pay every week about §Y1.04%§! of our GDP over the year, more when the Cold War is tense.\nUnrest: §G-0.15§! per month\nStability: §G+1%§!\nConsumer goods: §G-2%§!"
 COLDWAR_EB_CONTRACT_2_RECEIVE_DESC: "[FROM.GetNameDefCap] asks us for a consumer goods contract of size §Y2§!. We answer in the event that follows."
 COLDWAR_EB_CONTRACT_2_SEND_DESC: "We ask [THIS.GetNameDef] for a one year contract of size §Y2§!. They answer within a day.\n\nWe pay every week about §Y2.08%§! of our GDP over the year, more when the Cold War is tense.\nUnrest: §G-0.3§! per month\nStability: §G+2%§!\nConsumer goods: §G-4%§!"
 COLDWAR_EB_CONTRACT_3_RECEIVE_DESC: "[FROM.GetNameDefCap] asks us for a consumer goods contract of size §Y3§!. We answer in the event that follows."
 COLDWAR_EB_CONTRACT_3_SEND_DESC: "We ask [THIS.GetNameDef] for a one year contract of size §Y3§!. They answer within a day.\n\nWe pay every week about §Y4.16%§! of our GDP over the year, more when the Cold War is tense.\nUnrest: §G-0.45§! per month\nStability: §G+3%§!\nConsumer goods: §G-6%§!"
 COLDWAR_EB_CONTRACT_ACCEPT_DESC: "[FROM.GetNameDefCap] has signed the consumer goods contract."
 COLDWAR_EB_CONTRACT_ACCEPT_TITLE: "Contract Signed"
 COLDWAR_EB_CONTRACT_CANCEL_RECEIVE_DESC: "[FROM.GetNameDefCap] has cancelled its consumer goods contract with us."
 COLDWAR_EB_CONTRACT_CANCEL_SEND_DESC: "We cancel our consumer goods contract with [THIS.GetNameDef].\n§R5% chance of a Spark (half of the Pressure becomes Unrest).§!"
 COLDWAR_EB_CONTRACT_REJECT_DESC: "[FROM.GetNameDefCap] does not want to sell to us."
 COLDWAR_EB_CONTRACT_REJECT_TITLE: "Contract Refused"
 COLDWAR_EB_H_FLOW_TT: "The Security Line decides what happens to the Unrest.\nNormalisation and Hard Line push it down and store it as Pressure.\nThe Thaw lets it out, but stored Pressure comes back as Unrest."
 COLDWAR_EB_H_FROZEN: "§HFROZEN BY THE GAME CONTROLLER§!"
 COLDWAR_EB_H_FROZEN_TT: "No monthly change, no Sparks, no events. Values stay as they are until the Game Controller unfreezes the country."
 COLDWAR_EB_H_GAUGE_TT: "§HUnrest [?COLDWAR_EB_unrest|0] of 100§!\nHow angry people are with the government right now.\n\n§Y0§! The Little Deal Holds: Stability: §G+3%§!, Political Power Gain: §G+5%§!, Monthly Productivity Growth: §G+0.01§!\n§Y20§! Grumbling in the Queues: Civilian Factory Productivity: §R-2%§!, Monthly Productivity Growth: §R-0.01§!\n§Y40§! Open Discontent: Stability: §R-4%§!, Political Power Gain: §R-5%§!, Daily Pro-Western Support: §R+0.02§!, Civilian Factory Productivity: §R-4%§!, Monthly Productivity Growth: §R-0.02§!, Police Cost Multiplier: §R+10%§!\n§Y60§! Strikes and Protests: Stability: §R-8%§!, Political Power Gain: §R-10%§!, Daily Pro-Western Support: §R+0.04§!, Civilian Factory Productivity: §R-8%§!, Police Cost Multiplier: §R+20%§!, Factory Output: §R-5%§!, Tax Revenue: §R-5%§!\n§Y80§! Revolutionary Situation: Stability: §R-15%§!, Political Power Gain: §R-20%§!, Daily Pro-Western Support: §R+0.06§!, Civilian Factory Productivity: §R-15%§!, Police Cost Multiplier: §R+35%§!, Factory Output: §R-10%§!, Tax Revenue: §R-10%§!, War Support: §R-10%§!\n\nThe current level works through the modifier §YSocial Contract§!."
 COLDWAR_EB_H_INF_1: "Open"
 COLDWAR_EB_H_INF_1_TT: "§HInformation: Open§!\nWestern radio, television and press are allowed.\n\n§YWhile active:§!\nComparison with the West: §R×1.0§!\nForeign support campaigns: §R×1.25§!\nUnrest from neighbours: §R×1.25§!\n§RSwitching from Managed: 20% chance of a Spark (half of the Pressure becomes Unrest).§!\n\nResearch Speed: §G+5%§!\nTechnology sharing bonus: §G+10%§!\nTrade deal opinion factor: §G+15%§!\nReceiving Foreign Investment Cost Modifier: §G-10%§!\nIdeology Drift Defence: §R-10%§!\nForeign Influence Defense Multiplier: §R-15%§!\nGlobalism: §G+25§!\n\nCost: §Y1.5%§! of GDP (£treasury §Y[?COLDWAR_EB_cost_info|2]§!). Locked for §Y180§! days."
 COLDWAR_EB_H_INF_2: "Managed"
 COLDWAR_EB_H_INF_2_TT: "§HInformation: Managed§!\nState media, censorship and jammed broadcasts.\n\n§YWhile active:§!\nComparison with the West: §G×0.6§!\n§RSwitching from Sealed: 15% chance of a Spark (half of the Pressure becomes Unrest).§!\n\nIdeology Drift Defence: §G+10%§!\nForeign Influence Defense Multiplier: §G+5%§!\nResearch Speed: §R-3%§!\nTrade deal opinion factor: §R-5%§!\nBureaucracy Cost Multiplier: §R+5%§!\n\nCost: §Y1.5%§! of GDP (£treasury §Y[?COLDWAR_EB_cost_info|2]§!). Locked for §Y180§! days."
 COLDWAR_EB_H_INF_3: "Sealed"
 COLDWAR_EB_H_INF_3_TT: "§HInformation: Sealed§!\nThe country is closed to the outside world.\n\n§YWhile active:§!\nComparison with the West: §G×0.2§!\nForeign support campaigns: §G×0.2§!\nUnrest from neighbours: §G×0.5§!\nWestern consumer goods contracts: §Rnot possible§!\n\nIdeology Drift Defence: §G+30%§!\nForeign Influence Defense Multiplier: §G+25%§!\nIntelligence Agency Defense: §G+20%§!\nResearch Speed: §R-20%§!\nTechnology sharing bonus: §R-25%§!\nTrade deal opinion factor: §R-30%§!\nGlobalism: §R-30§!\nMonthly Productivity Growth: §R-0.05§!\n\nCost: §Y1.5%§! of GDP (£treasury §Y[?COLDWAR_EB_cost_info|2]§!). Locked for §Y180§! days."
 COLDWAR_EB_H_INF_LBL: "Information"
 COLDWAR_EB_H_LAD_0: "0 Calm"
 COLDWAR_EB_H_LAD_1: "20 Grumbling"
 COLDWAR_EB_H_LAD_2: "40 Discontent"
 COLDWAR_EB_H_LAD_3: "60 Strikes"
 COLDWAR_EB_H_LAD_4: "80 Revolution"
 COLDWAR_EB_H_LID: "§RLid 95§!"
 COLDWAR_EB_H_LOOP_TT: "Unrest of 40 and more lowers Stability. Stability below 50%% raises Unrest. Strikes from 60 lower Factory Output and can push the economy into Recession, which raises Unrest again."
 COLDWAR_EB_H_PRESSURE: "Pressure"
 COLDWAR_EB_H_PRESSURE_TT: "§HPressure [?COLDWAR_EB_pressure|0] of 100§!\nAnger that was held down instead of solved.\n\n§YWhat Pressure does:§!\nEvery Spark turns §Rhalf of the Pressure§! into Unrest (at least +5)\nCivil war chance of Martial Law, Crackdown and unfree elections: §R+Pressure/4§!\nCrises: every month a §Y[?COLDWAR_EB_chance|1]%§! chance of a crisis from Pressure 15 (Pressure minus 5, divided by 3, ×1.25 in Recession, ×1.5 in Depression, ×1.25 with Information Open, at most 30%). At most one at a time, then 180 days pause.\n§RFrom 95: every month a 25% chance that the lid blows and a civil war breaks out.§!\n\n§YWhat lowers it:§!\nThaw: §G-0.25§! per month (returns as Unrest)\nLong calm (Unrest below 20, no Recession): §G-0.05§! per month\nPolitical Amnesty §G-15§!, Silence the Dissidents §G-10§!, Replace the First Secretary §G-10§!, Negotiate with the Strikers §G-10§!\n\n§YWhat raises it:§!\nNormalisation and Hard Line every month, Martial Law §R+20§!, Crackdown §R+30§!\n\n§gOther countries do not see this value. Moscow sees an estimate.§!"
 COLDWAR_EB_H_R_CAMP: "Foreign campaigns for the opposition"
 COLDWAR_EB_H_R_CAMP_TT: "Any country can run a Public Political Support campaign for a party in our country.\n\nCampaign for an opposition party: Unrest §R+0.15§! per month at Permitted access, reduced by our Ideology Drift Defence. All of them together at most §R+0.45§!.\nAccess: External Only §Y×0.4§!, Permitted §Y×1§!, Facilitated §Y×2§!, Restricted §Y×0.2§!.\nSet the access in the Cold War window, tab §YProgrammes§!.\n\n§YRunning campaigns:§!\n[COLDWAR_EB_GetCampLine1][COLDWAR_EB_GetCampLine2][COLDWAR_EB_GetCampLine3][COLDWAR_EB_GetCampLine4]"
 COLDWAR_EB_H_R_CMP: "Comparison with the West"
 COLDWAR_EB_H_R_CMP_TT: "People compare their life with the West every month.\n\n§YOur GDP per capita:§! [?gdp_per_capita|2]\n§YWestern average:§! [?global.COLDWAR_EB_west_gdpc|2] (all Western Bloc members, weighted by population, updated monthly)\nWe reach §Y[?COLDWAR_EB_share|0]%§! of the West.\n\n§YHow much people see:§!\nGlobalism [?globalism_value|0]: ×(0.5 + Globalism/100)\nInformation §Y[COLDWAR_EB_GetInfoName]§!: Open ×1, Managed ×0.6, Sealed ×0.2\nRicher neighbour outside our bloc: §R×1.25§!\n\n§YResult:§! gap × visibility"
 COLDWAR_EB_H_R_CORR: "Corruption"
 COLDWAR_EB_H_R_CORR_TT: "Every Corruption level above 5: §R+0.05§!\nEmpty Shelves: §R+0.05§!"
 COLDWAR_EB_H_R_DEBT: "Public debt"
 COLDWAR_EB_H_R_DEBT_TT: "Public debt above 40% of GDP: §R+0.15§!\nPublic debt above 70% of GDP: §R+0.30§!"
 COLDWAR_EB_H_R_DP: "§HMonthly Pressure change§!"
 COLDWAR_EB_H_R_DU: "§HMonthly Unrest change§!"
 COLDWAR_EB_H_R_DU_TT: "The sum of all lines above. Under the game rule §YHard§! every rise is 25% higher."
 COLDWAR_EB_H_R_ECO: "Economic cycle"
 COLDWAR_EB_H_R_ECO_TT: "The economic cycle of MD.\nDepression §R+0.50§!, Recession §R+0.30§!, Stagnation §R+0.15§!, Stable Growth §g0§!, Fast Growth §G-0.10§!, Economic Boom §G-0.20§!"
 COLDWAR_EB_H_R_EXP: "Expectations"
 COLDWAR_EB_H_R_EXP_TT: "People expect a little more every year: §R+0.05§!\nWith the Thaw: another §R+0.05§!"
 COLDWAR_EB_H_R_FEAR: "Fear of Moscow"
 COLDWAR_EB_H_R_FEAR_TT: "Under the Brezhnev Doctrine nobody forgets what Soviet tanks can do: §G-0.15§! for members under the protection of Moscow, halved with the Thaw. Defy Moscow removes it."
 COLDWAR_EB_H_R_GOODS: "Western consumer goods"
 COLDWAR_EB_H_R_GOODS_TT: "Western consumer goods contracts: §G-0.15§! Unrest per month and §G+1%§! Stability for every size step, but Daily Pro-Western Support §R+0.005§! per step. At most §Y3§! size steps in total.\nAsk a Western country in its diplomacy screen (Buy Western Consumer Goods): they answer within a day. Either side can end a contract at any time.\n\n§YRunning contracts:§![COLDWAR_EB_ct_list][COLDWAR_EB_ct_line_1][COLDWAR_EB_ct_line_2][COLDWAR_EB_ct_line_3][COLDWAR_EB_ct_line_4]"
 COLDWAR_EB_H_R_GUAR: "Social guarantees"
 COLDWAR_EB_H_R_GUAR_TT: "Every MD budget law above the expected level lowers the comparison with the West by §G5%§!: Welfare, Health Care and Education. Now §Y[?COLDWAR_EB_guar_n|0]§! of 3.\nA generous welfare state (the two highest social spending levels): Unrest §G-0.05§! per month."
 COLDWAR_EB_H_R_INFL: "Inflation"
 COLDWAR_EB_H_R_INFL_TT: "Inflation above 5%: §R+0.10§!\nInflation above 15%: §R+0.30§!"
 COLDWAR_EB_H_R_MEAS: "Our measures"
 COLDWAR_EB_H_R_MEAS_TT: "Price Freeze §G-0.15§!, Consumer Goods Priority §G-0.20§!, Party Propaganda Campaign §G-0.10§! (halved with Information Open), Defy Moscow §G-0.10§!, while they last."
 COLDWAR_EB_H_R_NB: "Neighbours"
 COLDWAR_EB_H_R_NB_TT: "Neighbours of the Eastern Bloc in trouble:\nUnrest 60 or more §R+0.10§!, 80 or more §R+0.25§!, civil war or fallen regime §R+0.40§!. Together at most §R+0.60§!.\nInformation Open §R×1.25§!, Sealed §G×0.5§!."
 COLDWAR_EB_H_R_OWN: "Foreign campaigns for our party"
 COLDWAR_EB_H_R_OWN_TT: "Campaigns of other countries for our ruling party: Unrest §G-0.10§! per month at Permitted access, together at most §G-0.30§!."
 COLDWAR_EB_H_R_SEC: "Security Line"
 COLDWAR_EB_H_R_SEC_TT: "Thaw: §G0.6%§! of the Unrest vents every month, but §R0.25§! Pressure returns as Unrest.\nNormalisation: §Y1.0%§! of the Unrest is moved to Pressure.\nHard Line: §Y2.4%§! of the Unrest is moved to Pressure."
 COLDWAR_EB_H_R_STAB: "Stability"
 COLDWAR_EB_H_R_STAB_TT: "Stability now §Y[?COLDWAR_EB_stab_now|0]%§!.\nBelow 30%: §R+0.40§!\nBelow 50%: §R+0.20§!\nAbove 70%: §G-0.20§!"
 COLDWAR_EB_H_R_WAR: "War without support"
 COLDWAR_EB_H_R_WAR_TT: "At war with War Support below 30%: §R+0.25§!"
 COLDWAR_EB_H_SECLINE: "Security Line: §Y[COLDWAR_EB_GetSecName]§!"
 COLDWAR_EB_H_SEC_1: "Thaw"
 COLDWAR_EB_H_SEC_1_TT: "§HSecurity Line: Thaw§!\nCensorship is loosened and critics are tolerated.\n\n§YWhile active:§!\nUnrest: §G-0.6%§! of the current Unrest per month\nPressure: §G-0.25§! per month, §Rit returns as Unrest§!\nExpectations: §R+0.05§! Unrest per month\nForeign support campaigns: §R×1.25§!\nUnder the Brezhnev Doctrine: fear of Moscow §Rhalved§!\nOpposition parties: popularity §R+0.5%§! per month\nOpinion of the Soviet Union: §R-15§!\n\nResearch Speed: §G+4%§!\nMonthly Productivity Growth: §G+0.02§!\nPolice Cost Multiplier: §G-15%§!\nStability: §R-3%§!\nIdeology Drift Defence: §R-15%§!\nForeign subversive activities efficiency: §R+15%§!\nDaily Pro-Western Support: §R+0.03§!\n\nCost: §Y1%§! of GDP (£treasury §Y[?COLDWAR_EB_cost_sec|2]§!). Locked for §Y180§! days."
 COLDWAR_EB_H_SEC_2: "Normalisation"
 COLDWAR_EB_H_SEC_2_TT: "§HSecurity Line: Normalisation§!\nSteady police control without open terror.\n\n§YWhile active:§!\n§Y1.0%§! of the Unrest per month is moved to Pressure, §Y70%§! of it arrives\n\nIdeology Drift Defence: §G+5%§!\nPolice Cost Multiplier: §R+10%§!\nBureaucracy Cost Multiplier: §R+5%§!\n\nCost: §Y1%§! of GDP (£treasury §Y[?COLDWAR_EB_cost_sec|2]§!). Locked for §Y180§! days."
 COLDWAR_EB_H_SEC_3: "Hard Line"
 COLDWAR_EB_H_SEC_3_TT: "§HSecurity Line: Hard Line§!\nArrests, informers and open repression.\n\n§YWhile active:§!\n§Y2.4%§! of the Unrest per month is moved to Pressure, §R75%§! of it arrives\nAfter §Y90§! days: Martial Law and Crackdown carry no civil war risk\n\nStability: §G+2%§!\nIdeology Drift Defence: §G+15%§!\nRoot Out Resistance Effectiveness: §G+15%§!\nForeign subversive activities efficiency: §G-20%§!\nPolice Cost Multiplier: §R+25%§!\nResearch Speed: §R-4%§!\nMonthly Productivity Growth: §R-0.03§!\nNet Migration Rate Value Factor: §R-10%§!\n\nCost: §Y1%§! of GDP (£treasury §Y[?COLDWAR_EB_cost_sec|2]§!). Locked for §Y180§! days."
