 COLDWAR_EB_doctrine_sinatra: "Sinatra Doctrine"
 COLDWAR_EB_doctrine_sinatra_desc: "The doctrine decides how far Moscow will go to keep the fraternal countries socialist."
 COLDWAR_EB_doctrine_sinatra_effect_tt: "All members under our protection: §R30% chance of a Spark§!\nCold War Tension: §G-5§!\nMembers reform without our approval"
 COLDWAR_EB_doctrine_tip_1: "§YWhile active:§!\nAll members under our protection: Unrest §G-0.15§! per month\nFraternal Assistance can be granted\nRestore Socialist Order: Cold War Tension §R+5§!, cost §Y3%§! of our GDP"
