 COLDWAR_EB_crackdown: "Crackdown"
 COLDWAR_EB_crackdown_desc: "The opposition has been crushed by force. Nobody dares to speak, but nobody has forgotten."
 COLDWAR_EB_crisis_church: "The Church Shelters Dissent"
 COLDWAR_EB_crisis_church_desc: "Opposition meetings now take place in parish halls. The bishops refuse to stop them and remind the state of its constitution."
 COLDWAR_EB_crisis_exodus: "The Exodus"
 COLDWAR_EB_crisis_exodus_desc: "Thousands try to leave over the borders of fraternal countries. Embassies of Western states are filling up with families who refuse to go home."
 COLDWAR_EB_crisis_samizdat: "Samizdat in Circulation"
 COLDWAR_EB_crisis_samizdat_desc: "Typewritten copies of banned books and a clandestine bulletin pass from hand to hand in the universities and factories. The security service counts thousands of copies."
 COLDWAR_EB_crisis_shortage: "Empty Shelves"
 COLDWAR_EB_crisis_shortage_desc: "Meat, sugar and washing powder have vanished from the shops. Queues form before dawn and the black market sets the real prices."
 COLDWAR_EB_crisis_split: "Politburo Split"
 COLDWAR_EB_crisis_split_desc: "Reformers and hardliners in the Politburo no longer speak to each other. Both sides leak to Moscow and to the Western press."
 COLDWAR_EB_crisis_strike: "Wildcat Strike"
 COLDWAR_EB_crisis_strike_desc: "Workers at one of our largest shipyards have downed tools over the new work norms. The strike committee demands talks with the government. Other plants are watching."
 COLDWAR_EB_crisis_students: "Students in the Streets"
 COLDWAR_EB_crisis_students_desc: "After a banned theatre play, students march through the city centre chanting for free speech. Professors sign an open letter."
 COLDWAR_EB_crisis_wave: "Protest Wave"
 COLDWAR_EB_crisis_wave_desc: "Hundreds of thousands march in every large city. The demands are no longer about prices: they want free unions and an end to censorship."
 COLDWAR_EB_ct_none_tt: "We have no running contract with them"
 COLDWAR_EB_ct_not_sealed_tt: "Our Information is not §YSealed§!"
 COLDWAR_EB_dec_amnesty: "Political Amnesty"
 COLDWAR_EB_dec_amnesty_desc: "Political prisoners are released."
 COLDWAR_EB_dec_anticorr: "Anti-Corruption Drive"
 COLDWAR_EB_dec_anticorr_desc: "Officials who enrich themselves are removed in public."
 COLDWAR_EB_dec_cadres: "Stability of Cadres"
 COLDWAR_EB_dec_cadres_desc: "Party officials keep their posts and their privileges. In return they stay loyal."
 COLDWAR_EB_dec_consumer: "Consumer Goods Priority"
 COLDWAR_EB_dec_consumer_desc: "Steel and machine tools wait. Factories turn out fridges, shoes and televisions."
 COLDWAR_EB_dec_defy: "Defy Moscow"
 COLDWAR_EB_dec_defy_desc: "The leadership openly stands up to the Soviet Union and rallies the nation behind it."
 COLDWAR_EB_dec_freeze: "Price Freeze"
 COLDWAR_EB_dec_freeze_desc: "The state holds food prices at their current level and pays the difference."
 COLDWAR_EB_dec_martial: "Declare Martial Law"
 COLDWAR_EB_dec_martial_desc: "The army takes over the streets. Tanks stand at the factory gates."
 COLDWAR_EB_dec_negotiate: "Negotiate with the Strikers"
 COLDWAR_EB_dec_negotiate_desc: "The government signs an agreement with the strike committees: higher wages, free Saturdays, an independent union."
 COLDWAR_EB_dec_price: "Price Reform"
 COLDWAR_EB_dec_price_desc: "Food subsidies are cut to balance the budget."
 COLDWAR_EB_dec_propaganda: "Party Propaganda Campaign"
 COLDWAR_EB_dec_propaganda_desc: "Newspapers, radio and rallies praise the achievements of socialism."
 COLDWAR_EB_dec_replace: "Replace the First Secretary"
 COLDWAR_EB_dec_replace_desc: "The current leader retires. The next leader of the ruling party takes over, exactly as with Retire Leader."
 COLDWAR_EB_dec_silence: "Silence the Dissidents"
 COLDWAR_EB_dec_silence_desc: "The security service arrests the leaders of the opposition. Some of them are never seen again."
 COLDWAR_EB_dec_wages: "Raise Wages"
 COLDWAR_EB_dec_wages_desc: "Higher wages calm the workers for a while."
 COLDWAR_EB_defy: "Defy Moscow"
 COLDWAR_EB_defy_desc: "The leadership openly stands up to the Soviet Union and rallies the nation behind it."
 COLDWAR_EB_doctrine_1_dec: "Proclaim the Brezhnev Doctrine"
 COLDWAR_EB_doctrine_2_dec: "Proclaim a Policy of Restraint"
 COLDWAR_EB_doctrine_3_dec: "Proclaim the Sinatra Doctrine"
 COLDWAR_EB_doctrine_brezhnev: "Brezhnev Doctrine"
 COLDWAR_EB_doctrine_brezhnev_desc: "The doctrine decides how far Moscow will go to keep the fraternal countries socialist."
 COLDWAR_EB_doctrine_brezhnev_effect_tt: "All members under our protection: Unrest §G-0.15§! per month\nFraternal Assistance can be granted"
