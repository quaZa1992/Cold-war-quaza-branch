 COLDWAR_SOVR_active_measures_category: "Active Measures"
 COLDWAR_SOVR_active_measures_category_desc: "Service A of the First Chief Directorate writes, prints and whispers; the peace movements of the West march."
 COLDWAR_SOVR_afghan_aid_category: "Aid to Kabul"
 COLDWAR_SOVR_afghan_aid_category_desc: "Arms, fuel and advisers for the revolution in Afghanistan, without Soviet divisions."
 COLDWAR_SOVR_afghanistan_category: "The Afghan War"
 COLDWAR_SOVR_afghanistan_category_desc: "The 40th Army fights in a country of mountains and tribes. Every year it stays costs men, money and patience."
 COLDWAR_SOVR_air_offensive: "The Panjshir Offensive"
 COLDWAR_SOVR_air_offensive_desc: "Bombers from Termez and the airborne divisions strike the valleys of the Lion of Panjshir. The roads are open for a season."
 COLDWAR_SOVR_all_union_plants: "Take the Plants under Union Control"
 COLDWAR_SOVR_all_union_plants_desc: "The big plants of the republics answer to Moscow again. Output rises; so does resentment."
 COLDWAR_SOVR_allies_category: "The Allies Are Not Abandoned"
 COLDWAR_SOVR_allies_category_desc: "Havana, Managua, Luanda and Kabul still need oil, arms and advisers, whatever the reformers in Moscow say."
 COLDWAR_SOVR_amu_darya_border_category: "The Amu Darya Line"
 COLDWAR_SOVR_amu_darya_border_category_desc: "Kabul has fallen; the border troops dig in on the Amu Darya."
 COLDWAR_SOVR_arm_front: "Arm the Front in [FROM.GetName]"
 COLDWAR_SOVR_arm_front_desc: "Rifles, rockets and instructors reach the movement through friendly ports. Washington will know who sent them."
 COLDWAR_SOVR_arms_credit: "Arms on Credit for [FROM.GetName]"
 COLDWAR_SOVR_arms_credit_desc: "A package of tanks, guns and instructors, paid with a credit for twenty years. Our influence grows; our defence plants never lack orders."
 COLDWAR_SOVR_arms_deliveries_category: "Arms on Credit"
 COLDWAR_SOVR_arms_deliveries_category_desc: "Tanks, MiGs and instructors for regimes that call themselves anti-imperialist, on credit nobody expects to see repaid."
 COLDWAR_SOVR_arms_kabul: "Arms Deliveries to Kabul"
 COLDWAR_SOVR_arms_kabul_desc: "Tanks, helicopters and fuel go south over the Amu Darya bridge. Kabul pays with gas it does not have."
 COLDWAR_SOVR_baltic_dialogue_category: "Talks with the Popular Fronts"
 COLDWAR_SOVR_baltic_dialogue_category_desc: "Sajudis, the Popular Front of Latvia and the Estonian front want to talk. Talking costs prestige; silence costs more."
 COLDWAR_SOVR_baltic_talks: "Round Table with the Fronts"
 COLDWAR_SOVR_baltic_talks_desc: "A Politburo delegation sits down with the front leaders in Vilnius, Riga and Tallinn. The streets calm down; the hardliners do not."
