 COLDWAR_SOVR_dec_arms_deliveries_tt: "§YOpens arms deliveries on credit to friendly regimes§!"
 COLDWAR_SOVR_dec_baltic_dialogue_tt: "§YOpens talks with Sajudis and the popular fronts§!"
 COLDWAR_SOVR_dec_china_war_plans_tt: "§YOpens war plans against China: a war goal at half the usual justification time; declaring war stays our decision§!"
 COLDWAR_SOVR_dec_comecon_iib_tt: "§YIIB credits for joint projects cost the USSR less§!"
