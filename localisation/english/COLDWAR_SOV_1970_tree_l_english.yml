 COLDWAR_SOVR_china_war_plans_category: "The Preventive Option"
 COLDWAR_SOVR_china_war_plans_category_desc: "The General Staff's plan for a short war against China, while its bomb is still small."
 COLDWAR_SOVR_china_wargoal: "Prepare the War Goal against China"
 COLDWAR_SOVR_china_wargoal_desc: "The plan leaves the safe: a casus belli against Beijing at half the usual time. Declaring war remains a decision of the Politburo."
 COLDWAR_SOVR_close_papers: "Close the Newspapers"
 COLDWAR_SOVR_close_papers_desc: "Only Pravda and the decrees of the Committee. The kitchens talk louder than the papers."
 COLDWAR_SOVR_comecon_iib_category: "The International Investment Bank"
 COLDWAR_SOVR_comecon_iib_category_desc: "Credits of the IIB for joint Comecon projects."
 COLDWAR_SOVR_comecon_projects_category: "Comecon Big Projects"
 COLDWAR_SOVR_comecon_projects_category_desc: "The Soyuz pipeline and the other joint projects of the Comprehensive Programme."
 COLDWAR_SOVR_committee_tools_category: "The Committee's Tools"
 COLDWAR_SOVR_committee_tools_category_desc: "The State Committee for the State of Emergency governs with tanks, curfews and closed newspapers."
 COLDWAR_SOVR_compact: "A Compact with [FROM.GetName]"
 COLDWAR_SOVR_compact_desc: "We offer the republic more rights in exchange for staying in the Union. It decides in its own event."
 COLDWAR_SOVR_crisis_funds: "Emergency Funds for the Republics"
 COLDWAR_SOVR_crisis_funds_desc: "Money from the Union budget for the republics that still listen."
 COLDWAR_SOVR_curfew: "Curfew in the Cities"
 COLDWAR_SOVR_curfew_desc: "Patrols after nine in the evening. The streets are empty and the queues are angry."
 COLDWAR_SOVR_dec_active_measures_tt: "§YOpens disinformation and peace-campaign operations against NATO countries§!"
 COLDWAR_SOVR_dec_afghan_aid_tt: "§YOpens arms and fuel deliveries to Kabul§!"
 COLDWAR_SOVR_dec_afghanistan_tt: "§YOpens the Afghanistan decisions§!"
