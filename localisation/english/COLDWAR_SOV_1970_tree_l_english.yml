l_english:
# IMPERIA COLD WAR — Soviet Union 1970 v4 rework (focus tree, ideas, decisions, events).
 COLDWAR_SOV_1970_focus: "Soviet Union"
 COLDWAR_SOV_collective_leadership: "The Collective Leadership"
 COLDWAR_SOV_collective_leadership_desc: "Brezhnev leads the Party, Kosygin the government, Podgorny the Presidium. Six years after Khrushchev the rule is simple: nobody decides alone, and nobody is surprised."
 COLDWAR_SOV_lenin_centenary: "The Lenin Centenary"
 COLDWAR_SOV_lenin_centenary_desc: "The hundredth birthday of Lenin on 22 April: jubilee medals for millions, new memorial halls in Ulyanovsk, and a Party that reminds itself what it is for."
 COLDWAR_SOV_xxiv_congress: "The Twenty-Fourth Congress"
 COLDWAR_SOV_xxiv_congress_desc: "For the first time the Ninth Five-Year Plan promises consumer goods growing faster than heavy industry. The delegates applaud; the defence ministries take note."
 COLDWAR_SOV_politburo_seats: "Seats in the Politburo"
 COLDWAR_SOV_politburo_seats_desc: "The Congress raises the Politburo to fifteen full members: Kulakov for the fields, Shcherbitsky for Ukraine, Kunaev for Kazakhstan, Grishin for Moscow. Every new seat is a promise, and every promise binds the General Secretary."
 COLDWAR_SOV_ideological_commission: "The Ideological Commission"
 COLDWAR_SOV_ideological_commission_desc: "Mikhail Suslov guards the texts. What may be printed, filmed and taught passes his desk, and his desk is slow."
 COLDWAR_SOV_gerontocracy_question: "The Gerontocracy Question"
 COLDWAR_SOV_gerontocracy_question_desc: "The average age of the Politburo passes sixty. Pelshe was a soldier of 1917; the younger secretaries wait in the regions while the old ones count their years in office as merit."
 COLDWAR_SOV_april_plenum: "The April Plenum"
 COLDWAR_SOV_april_plenum_desc: "Shelest and Voronov leave the Politburo; the chairman of the KGB, the Minister of Defence and the Foreign Minister enter it together. The security of the state now sits at the table where the state is run."
 COLDWAR_SOV_renew_the_cadres: "Renew the Cadres"
 COLDWAR_SOV_renew_the_cadres_desc: "Retirement at seventy, rotation of first secretaries, and a young regional secretary from Stavropol brought to the Politburo table. The apparatus will not forgive it quickly."
 COLDWAR_SOV_respect_for_seniority: "Respect for Seniority"
 COLDWAR_SOV_respect_for_seniority_desc: "The old guard keeps its chairs and its dachas. Loyalty is rewarded, and the country grows quieter and slower every year."
 COLDWAR_SOV_brezhnev_constitution: "A New Constitution"
 COLDWAR_SOV_brezhnev_constitution_desc: "Developed socialism written into the basic law: the Party's leading role in Article 6, and the right of every republic to leave the Union in Article 72. The man who carried the drafts, Chernenko, enters the Politburo the same week."
 COLDWAR_SOV_supreme_soviet_presidium: "Two Chairs for One Man"
 COLDWAR_SOV_supreme_soviet_presidium_desc: "The Central Committee votes Podgorny out without warning, and the General Secretary takes his chair at the head of the Presidium of the Supreme Soviet. The troika is over."
 COLDWAR_SOV_the_article_six_question: "The Article Six Question"
 COLDWAR_SOV_the_article_six_question_desc: "The Congress debates whether the Party's leading role still belongs in the constitution. In the corridors, the first independent deputies are already organising."
 COLDWAR_SOV_congress_of_peoples_deputies: "The Congress of People's Deputies"
 COLDWAR_SOV_congress_of_peoples_deputies_desc: "Two thousand two hundred and fifty deputies, many of them elected against the Party's own candidates. The sessions run live on television and the factories stop to watch."
 COLDWAR_SOV_the_presidency: "The Presidency of the USSR"
 COLDWAR_SOV_the_presidency_desc: "A President elected by the Congress, standing above the Party: power moves from the Central Committee building on Staraya Square to the Kremlin, and the Party's second secretary loses his reason to exist."
 COLDWAR_SOV_candidacy_kos: "The Premier's Claim"
 COLDWAR_SOV_candidacy_kos_desc: "Kosygin has run the government since 1964. His first deputy Mazurov and the branch ministers would rather see the economist than the apparatchik at the top."
 COLDWAR_SOV_candidacy_she: "Iron Shurik"
 COLDWAR_SOV_candidacy_she_desc: "Shelepin, once Komsomol chief and KGB chairman, now leads the trade unions. His friends from the Komsomol sat in the security organs until Brezhnev moved them out one by one, and the apparatus has not forgotten it."
 COLDWAR_SOV_candidacy_and: "The Chairman of the KGB"
 COLDWAR_SOV_candidacy_and_desc: "Andropov knows more about the country than any other man in the Politburo, including what the other men in the Politburo do. Ustinov and Gromyko sit beside him on every commission that matters."
 COLDWAR_SOV_candidacy_ust: "The Marshals' Candidate"
 COLDWAR_SOV_candidacy_ust_desc: "Ustinov has built the guns since 1941, the rockets since 1946, and has overseen the whole defence industry since 1965. The defence ministries trust nobody else with the budget."
 COLDWAR_SOV_candidacy_rom: "The Leningrad Candidate"
 COLDWAR_SOV_candidacy_rom_desc: "Romanov's Leningrad runs on schedule: science-production associations, discipline, and no dissidents in the street. The Moscow old guard prefers him to the young man from Stavropol."
 COLDWAR_SOV_candidacy_che: "The Keeper of the Apparatus"
 COLDWAR_SOV_candidacy_che_desc: "Chernenko has carried Brezhnev's files since Moldavia. Nobody fears him, which is exactly why the Dnepropetrovsk men would vote for him and why Lubyanka would not."
 COLDWAR_SOV_candidacy_gor: "The Stavropol Secretary"
 COLDWAR_SOV_candidacy_gor_desc: "The youngest man in the Politburo, responsible for agriculture, travels, listens and speaks without notes. Andropov made him, and Gromyko is ready to put his name forward."
 COLDWAR_SOV_bre_the_collective_leader: "The Collective Leader"
 COLDWAR_SOV_bre_the_collective_leader_desc: "Brezhnev governs by telephone and by consensus. He remembers the birthdays of the first secretaries and forgets nothing they owe him."
 COLDWAR_SOV_bre_the_dnepropetrovsk_circle: "The Dnepropetrovsk Circle"
 COLDWAR_SOV_bre_the_dnepropetrovsk_circle_desc: "Shchelokov at the Interior Ministry, Tsvigun at the Lubyanka, Chernenko over the files, and now Shcherbitsky and Kunaev at the Politburo table. Leonid Ilyich forgets no favour and no slight."
 COLDWAR_SOV_bre_the_april_plenum: "The Plenum of April 1973"
 COLDWAR_SOV_bre_the_april_plenum_desc: "Andropov, Gromyko and Marshal Grechko take full seats in the Politburo; Shelest, who wanted no summit with Nixon, and Voronov go into retirement. The security, the diplomacy and the army now vote with the General Secretary."
 COLDWAR_SOV_bre_shelepin_leaves_the_unions: "Shelepin Leaves the Unions"
 COLDWAR_SOV_bre_shelepin_leaves_the_unions_desc: "The London trip gave the pretext: Iron Shurik is relieved of his Politburo seat, and the Central Council of Trade Unions waits for a new chairman. The last man of October 1964 who could challenge Brezhnev is out."
 COLDWAR_SOV_bre_the_cult_of_leonid: "The Leader's Honours"
 COLDWAR_SOV_bre_the_cult_of_leonid_desc: "Marshal's star, a second Hero of the Soviet Union medal, the Order of Victory waiting in the wings. The portraits grow larger and the jokes in the queues sharper."
 COLDWAR_SOV_bre_the_politburo_decides: "The Politburo Decides"
 COLDWAR_SOV_bre_the_politburo_decides_desc: "Every major question goes to the Thursday session, and Suslov guards the rules of collective leadership. Slower decisions, fewer enemies, and a General Secretary who is first among equals."
 COLDWAR_SOV_bre_malaya_zemlya: "Malaya Zemlya"
 COLDWAR_SOV_bre_malaya_zemlya_desc: "The General Secretary's war memoir appears in Novy Mir and then in millions of copies, studied in every school and every unit. The veterans approve; the writers keep silent."
 COLDWAR_SOV_bre_the_second_secretary: "The Second Secretary"
 COLDWAR_SOV_bre_the_second_secretary_desc: "Kirilenko runs the Secretariat and the industrial departments while the General Secretary rests in Zavidovo. The ministries get answers within a week; the Lubyanka watches the old Sverdlovsk man grow."
 COLDWAR_SOV_bre_the_general_department: "The General Department"
 COLDWAR_SOV_bre_the_general_department_desc: "Chernenko, who carried Brezhnev's files since Kishinev, becomes a full member, and Tikhonov from the Dnepropetrovsk days joins him. Whoever wants to see the General Secretary now asks the General Department first."
 COLDWAR_SOV_bre_chairman_of_the_party: "Chairman of the Party"
 COLDWAR_SOV_bre_chairman_of_the_party_desc: "Leonid Ilyich keeps the title, the speeches and the Kremlin office as Chairman of the Party; Shcherbitsky comes from Kiev to run the Secretariat. Andropov, passed over, keeps the KGB and his silence."
 COLDWAR_SOV_bre_the_question_of_succession: "The Question of Succession"
 COLDWAR_SOV_bre_the_question_of_succession_desc: "The General Secretary is ill and everybody knows it. Andropov returns from the Lubyanka to the Secretariat, Chernenko sits at the right hand, and whom Brezhnev praises in Pravda decides more than any vote of the plenum."
 COLDWAR_SOV_bre_the_orderly_succession: "The Orderly Succession"
 COLDWAR_SOV_bre_the_orderly_succession_desc: "For the first time since Lenin the Union changes its leader without a death, a plot or a palace coup. Kirilenko goes first, retirement at seventy becomes the rule, and the regional secretaries begin to pack their files."
 COLDWAR_SOV_bre_guns_butter_or_oil: "Guns, Butter or Oil?"
 COLDWAR_SOV_bre_guns_butter_or_oil_desc: "The Ninth Plan cannot fund everything. The defence ministries want parity, the shops want goods, Siberia promises oil that could pay for both, and every minister fights for his line."
 COLDWAR_SOV_bre_the_kosygin_course: "The Kosygin Course"
 COLDWAR_SOV_bre_the_kosygin_course_desc: "Brezhnev lets his Premier continue: enterprises keep part of their profit, and light industry gets the steel the Twenty-Fourth Congress promised it."
 COLDWAR_SOV_bre_parity_first: "Parity First"
 COLDWAR_SOV_bre_parity_first_desc: "The Americans must never again be able to dictate in Cuba or Berlin. The defence budget comes first, the silos and the submarines next, and the shops will wait."
 COLDWAR_SOV_bre_togliatti: "The Zhiguli for Every Family"
 COLDWAR_SOV_bre_togliatti_desc: "The Volga Automobile Plant at Togliatti, built with Fiat, delivers its first Zhiguli. A car becomes a realistic dream after only ten years on the waiting list."
 COLDWAR_SOV_bre_the_military_industrial_commission: "The Military-Industrial Commission"
 COLDWAR_SOV_bre_the_military_industrial_commission_desc: "Smirnov's commission coordinates the nine defence ministries under one roof. What the General Staff orders today stands in a depot in five years."
 COLDWAR_SOV_bre_samotlor: "Samotlor Oil for the Plan"
 COLDWAR_SOV_bre_samotlor_desc: "West Siberian oil fills the gaps of the plan. Every price rise abroad buys grain and machines at home, and every rouble earned that way is a reform not made."
 COLDWAR_SOV_bre_the_twenty_fifth_congress: "The Twenty-Fifth Congress"
 COLDWAR_SOV_bre_the_twenty_fifth_congress_desc: "The same faces on the tribune, the same plan figures, and two new full members: Ustinov for the defence industry, Romanov for Leningrad. The General Secretary reads his report a little slower than five years ago."
 COLDWAR_SOV_bre_podgorny_sent_home: "Podgorny Sent Home"
 COLDWAR_SOV_bre_podgorny_sent_home_desc: "Podgorny learns at the plenum that he is no longer a member of the Politburo, and three weeks later the General Secretary takes his chair in the Presidium. Kuznetsov, the old diplomat, does the work as first deputy."
 COLDWAR_SOV_bre_the_food_programme: "The Food Programme"
 COLDWAR_SOV_bre_the_food_programme_desc: "Agro-industrial associations in every district, credits for the kolkhozes, roads to the fields. Expensive, slow, and the first serious answer since the March plenum of 1965."
 COLDWAR_SOV_bre_mature_socialism: "Mature Socialism"
 COLDWAR_SOV_bre_mature_socialism_desc: "The Union has arrived where Khrushchev promised communism: not paradise, but order, a flat, a pension and a superpower's pride. Nothing must change."
 COLDWAR_SOV_bre_the_peace_programme: "The Peace Programme"
 COLDWAR_SOV_bre_the_peace_programme_desc: "Treaties with Bonn, arms talks with Washington, a security conference for all of Europe. Peace is the best advertisement for socialism, and the cheapest."
 COLDWAR_SOV_bre_brezhnev_in_washington: "Brezhnev in Washington"
 COLDWAR_SOV_bre_brezhnev_in_washington_desc: "The General Secretary flies to America: Camp David, San Clemente and an agreement on the prevention of nuclear war. In the Senate, Jackson ties every dollar of trade to the emigration of Soviet Jews."
 COLDWAR_SOV_bre_summer_in_the_crimea: "Summer in the Crimea"
 COLDWAR_SOV_bre_summer_in_the_crimea_desc: "Every August the first secretaries of the fraternal parties come to Oreanda: a swim, a hunt, a long evening and a quiet word on what Moscow expects. Honecker, Husak and Zhivkov leave reassured and a little poorer."
 COLDWAR_SOV_bre_the_handshake_in_orbit: "The Handshake in Orbit"
 COLDWAR_SOV_bre_the_handshake_in_orbit_desc: "Leonov's Soyuz and Stafford's Apollo dock in orbit, and the whole world watches two crews share a meal. Korolev's heirs had to open their docking port, and some of their secrets, to the Americans."
 COLDWAR_SOV_bre_the_correlation_of_forces: "The Correlation of Forces"
 COLDWAR_SOV_bre_the_correlation_of_forces_desc: "Saigon has fallen, Angola and Ethiopia follow with Cuban troops and Soviet advisers, and the Americans hesitate. In Moscow they speak of a shift in the correlation of forces in favour of socialism, and pay for it in tanks and credits."
 COLDWAR_SOV_bre_the_winter_of_seventy_nine: "The Winter of Seventy-Nine"
 COLDWAR_SOV_bre_the_winter_of_seventy_nine_desc: "Chazov's doctors allow the General Secretary a few hours of work a day. In December Andropov, Ustinov and Gromyko bring him the papers on Kabul, and what he signs in his shaky hand will outlive him."
 COLDWAR_SOV_bre_carters_punishment: "Carter's Punishment"
 COLDWAR_SOV_bre_carters_punishment_desc: "The grain ships turn back, SALT II goes to the drawer, and Washington calls on the world to stay away from the Moscow Games. The Politburo must decide whether to answer or to outwait the man in the White House."
 COLDWAR_SOV_bre_no_bread_from_washington: "No Bread from Washington"
 COLDWAR_SOV_bre_no_bread_from_washington_desc: "Moscow answers the embargo with contracts in Buenos Aires and closed doors for American firms. Whoever feeds the Union must never again be its enemy, and the generals in Argentina sell to whoever pays."
 COLDWAR_SOV_bre_no_first_use: "No First Use"
 COLDWAR_SOV_bre_no_first_use_desc: "The Union pledges never to be the first to use nuclear weapons, offers a freeze on the missiles in Europe and asks for a summit. The General Staff grumbles; the peace marchers in Bonn and Amsterdam take note."
 COLDWAR_SOV_bre_operation_ryan: "Operation RYaN"
 COLDWAR_SOV_bre_operation_ryan_desc: "The General Secretary tells the KGB conference that Washington prepares for war, and Andropov orders every residency to watch for the signs of a nuclear first strike: lit windows at the Pentagon, blood banks, the price of blood."
 COLDWAR_SOV_kos_the_premier_at_the_helm: "The Premier at the Helm"
 COLDWAR_SOV_kos_the_premier_at_the_helm_desc: "Kosygin crosses from the Council of Ministers to Staraya Square with his figures under his arm. Baibakov's Gosplan and Garbuzov's Finance Ministry now report to the man who wrote their plans."
 COLDWAR_SOV_kos_the_technocrats_alliance: "The Technocrats' Alliance"
 COLDWAR_SOV_kos_the_technocrats_alliance_desc: "Mazurov, the partisan who became First Deputy Premier, stands with his chief, and Gvishiani's State Committee for Science and Technology supplies the methods. Directors instead of obkom secretaries: the engineers want the decisions."
 COLDWAR_SOV_kos_the_directors_government: "The Directors' Government"
 COLDWAR_SOV_kos_the_directors_government_desc: "The general directors of the great combines and the chief designers take the ministries, and Kirilenko's industrial departments lose their veto on appointments. The men who run the factories now also run the country."
 COLDWAR_SOV_kos_the_laxenburg_institute: "The Laxenburg Institute"
 COLDWAR_SOV_kos_the_laxenburg_institute_desc: "In a Habsburg palace near Vienna Soviet and American systems analysts model energy, cities and planning side by side, and Gvishiani's institutes bring the methods home. The KGB counts the visas and the conversations."
 COLDWAR_SOV_kos_every_kopeck_counted: "Every Kopeck Counted"
 COLDWAR_SOV_kos_every_kopeck_counted_desc: "Kosygin knows the output of every ministry by heart and corrects the figures in the margins himself. His auditors now open the books of the defence ministries too, and waste offends him more than heresy."
 COLDWAR_SOV_kos_enterprise_or_computer: "The Enterprise or the Computer?"
 COLDWAR_SOV_kos_enterprise_or_computer_desc: "Liberman's followers want enterprises that earn their own money; Glushkov's institute in Kiev wants one network that calculates every bolt. The Premier can only give the economy one brain."
 COLDWAR_SOV_kos_retained_profit: "Retained Profit"
 COLDWAR_SOV_kos_retained_profit_desc: "Enterprises keep part of their profit for bonuses, housing and new machines. Sales and profitability count, not tons, and the planners in the branch ministries lose their pencils."
 COLDWAR_SOV_kos_glushkovs_network: "The OGAS Gamble"
 COLDWAR_SOV_kos_glushkovs_network_desc: "The All-State Automated System: thousands of computing centres linked from Kiev to Vladivostok, the plan recalculated overnight. The Central Statistical Directorate fears for its empire."
 COLDWAR_SOV_kos_shchekino_method: "Shchekino Across the Branches"
 COLDWAR_SOV_kos_shchekino_method_desc: "At the Shchekino chemical combine a thousand workers were released and their wages shared among those who stayed. Now every plant may do the same, and the saved wage funds go back to the budget."
 COLDWAR_SOV_kos_computing_centres: "The All-Union Computing Centres"
 COLDWAR_SOV_kos_computing_centres_desc: "Minsk mainframes in every ministry, the ES series in every republic capital. Cybernetics, once a bourgeois pseudoscience, is now the language of the plan."
 COLDWAR_SOV_kos_plan_of_efficiency_and_quality: "The Plan of Efficiency and Quality"
 COLDWAR_SOV_kos_plan_of_efficiency_and_quality_desc: "The next plan promises fewer new construction sites and better use of the old ones: quality marks, the State Seal of Quality, fines for rejected goods."
 COLDWAR_SOV_kos_the_airport_talks_with_zhou: "The Airport Talks with Zhou"
 COLDWAR_SOV_kos_the_airport_talks_with_zhou_desc: "Since the three hours with Zhou Enlai at Peking airport, delegations sit at a table instead of soldiers on Damansky Island. The new General Secretary wants the talks to bring divisions home from the Ussuri."
 COLDWAR_SOV_kos_turnkey_plants_from_the_west: "Turnkey Plants from the West"
 COLDWAR_SOV_kos_turnkey_plants_from_the_west_desc: "Mannesmann pipes, Fiat assembly lines, French chemical complexes, all paid with Western bank credits and repaid in gas. The KGB warns that the Union is buying dependence."
 COLDWAR_SOV_kos_the_premier_in_cairo: "The Premier in Cairo"
 COLDWAR_SOV_kos_the_premier_in_cairo_desc: "While the airlift fills Egyptian and Syrian depots, Kosygin spends four days with Sadat pressing for a ceasefire on the lines the Arabs still hold. Moscow wants its friends saved, not lost in a war of revenge."
 COLDWAR_SOV_kos_the_call_from_herat: "The Call from Herat"
 COLDWAR_SOV_kos_the_call_from_herat_desc: "Herat has risen and Taraki begs on the telephone for Soviet soldiers in Afghan uniforms. Kosygin answers that the Union will send weapons and advisers but not its sons."
 COLDWAR_SOV_kos_an_economy_that_counts: "An Economy That Counts"
 COLDWAR_SOV_kos_an_economy_that_counts_desc: "Fifteen years after his first reform the Premier's economy measures itself in profit, quality and time saved. The defence ministries complain that nobody reads their requests first any more."
 COLDWAR_SOV_kos_the_ryzhkov_government: "The Ryzhkov Government"
 COLDWAR_SOV_kos_the_ryzhkov_government_desc: "Nikolai Ryzhkov, once director of Uralmash and now at Gosplan, takes over the government, and Tikhonov goes into retirement. He is no economist of the Liberman school but a builder of plants, and the obkom secretaries do not know him."
 COLDWAR_SOV_kos_wholesale_trade_not_gossnab: "Wholesale Trade, Not Gossnab"
 COLDWAR_SOV_kos_wholesale_trade_not_gossnab_desc: "Factories buy steel, cable and machines from each other by contract instead of waiting for Gossnab's allocation slips. The shelves fill within a year, and so do the letters to Pravda about the price of a winter coat."
 COLDWAR_SOV_kos_the_plan_keeps_its_word: "The Plan Keeps Its Word"
 COLDWAR_SOV_kos_the_plan_keeps_its_word_desc: "The Uralmash way: a plan drawn honestly, materials delivered on the day, and directors who answer for every unfinished site. New combines rise in Sverdlovsk while the shops wait for the next plan."
 COLDWAR_SOV_kos_credit_from_gosbank: "Credit from Gosbank"
 COLDWAR_SOV_kos_credit_from_gosbank_desc: "New plants are no longer a gift from the budget: the State Bank lends at interest and wants its money back. Half-finished sites that nobody can repay are closed, and the ministries lose their favourite way to waste capital."
 COLDWAR_SOV_kos_state_acceptance: "State Acceptance at the Factory Gate"
 COLDWAR_SOV_kos_state_acceptance_desc: "Inspectors of the state, not of the ministry, stand at the gate of every major plant and reject what is not fit to sell. Output falls, bonuses vanish for a quarter, and the goods that pass finally work."
 COLDWAR_SOV_she_the_men_of_october: "The Men of October 1964"
 COLDWAR_SOV_she_the_men_of_october_desc: "Shelepin and Semichastny delivered Khrushchev's fall: the guards, the plenum lists, the telephone calls. Now Brezhnev goes into honourable retirement, and one of the men of October sits in the chair."
 COLDWAR_SOV_she_the_komsomol_generation: "The Komsomol Generation"
 COLDWAR_SOV_she_the_komsomol_generation_desc: "Semichastny, Yegorychev and Mesyatsev return from the provinces and the embassies, Masherov comes from Minsk to a full seat, and Kirilenko loses his. The old guard counts the youth leaders now sitting in its offices."
 COLDWAR_SOV_she_committee_of_party_state_control: "The Committee of Party-State Control"
 COLDWAR_SOV_she_committee_of_party_state_control_desc: "The inspection body Shelepin led under Khrushchev returns with full powers: it may audit any ministry, any obkom and any director, and it reports only to the General Secretary."
 COLDWAR_SOV_she_the_republican_bosses_purged: "The Republican Bosses Purged"
 COLDWAR_SOV_she_the_republican_bosses_purged_desc: "Mzhavanadze's Georgia and Rashidov's Uzbekistan, run like estates for twenty years, face auditors from Moscow and new first secretaries. In Alma-Ata and Baku the clans wait to see who is next."
 COLDWAR_SOV_she_the_unions_and_the_plan: "The Trade Unions and the Plan"
 COLDWAR_SOV_she_the_unions_and_the_plan_desc: "Ninety million union members, the sanatoria, the housing lists and the bonus funds pass through the Central Council of Trade Unions. Shelepin ran it for eight years, and the directors know he will use the levers."
 COLDWAR_SOV_she_labour_discipline_first: "Labour Discipline First"
 COLDWAR_SOV_she_labour_discipline_first_desc: "Wages tied to output, absentees named on the factory board, idle shifts docked. Shelepin promises that the plan will be met by work, not by excuses."
 COLDWAR_SOV_she_the_workers_guarantees: "The Workers' Guarantees"
 COLDWAR_SOV_she_the_workers_guarantees_desc: "The unions gain a veto over dismissals, norms and overtime, and the sanatorium vouchers double. The workers get security; the directors get a second boss in every shop."
 COLDWAR_SOV_she_the_brigade_contract: "The Brigade Contract"
 COLDWAR_SOV_she_the_brigade_contract_desc: "Nikolai Zlobin's builders took one contract for a whole house and paid themselves from the result. Now every construction trust must offer it to its brigades and pay the bonuses it promises."
 COLDWAR_SOV_she_the_memorandum_of_1965: "The Memorandum of 1965"
 COLDWAR_SOV_she_the_memorandum_of_1965_desc: "Shelepin's programme lies on the Politburo table again: an end to the polemics with Peking, an end to the slander of the war years, discipline from the ministry to the shop floor. What was too early in 1965 is policy now."
 COLDWAR_SOV_she_the_bust_at_the_kremlin_wall: "The Bust at the Kremlin Wall"
 COLDWAR_SOV_she_the_bust_at_the_kremlin_wall_desc: "The grave behind the Mausoleum has its marble bust, and the Supreme Commander of the war returns to the textbooks and the films. In Rome and Paris the fraternal parties protest; the veterans' councils raise a glass."
 COLDWAR_SOV_she_no_detente_with_imperialism: "No Detente with Imperialism"
 COLDWAR_SOV_she_no_detente_with_imperialism_desc: "Nixon in Moscow while American bombs fall on Haiphong? Shelest from Kiev stands with the General Secretary: no summits with the bombers, more SAMs for Hanoi, and no Western credits that the next crisis could cancel."
 COLDWAR_SOV_she_the_order_state: "The Order State"
 COLDWAR_SOV_she_the_order_state_desc: "One law for the minister and the porter: the store directors and warehouse chiefs who sell from under the counter meet the control inspectors and the Komsomol patrols. Nobody laughs at Iron Shurik any more, at least not aloud."
 COLDWAR_SOV_she_reconciliation_with_peking: "Reconciliation with Peking"
 COLDWAR_SOV_she_reconciliation_with_peking_desc: "Shelepin never accepted the quarrel with Peking as permanent. The polemics stop in Pravda and the People's Daily, Soviet engineers return to the half-finished Chinese plants, and the two communist giants face the Americans side by side again."
 COLDWAR_SOV_she_the_plan_of_july_1961: "The Plan of July 1961"
 COLDWAR_SOV_she_the_plan_of_july_1961_desc: "Shelepin's old plan for Khrushchev returns from the archive: tie the Americans down everywhere at once, with the Sandinistas in Nicaragua, the fronts in Africa and the Cubans as partners. Washington cannot be strong in Berlin while its backyard burns."
 COLDWAR_SOV_she_a_united_front_for_hanoi: "A United Front for Hanoi"
 COLDWAR_SOV_she_a_united_front_for_hanoi_desc: "With the railway through China open again, SAMs, MiGs and trucks reach Hanoi without weeks of delay at the border. The Americans face one camp in Indochina, not two rivals counting each other's trains."
 COLDWAR_SOV_she_department_d: "Department D"
 COLDWAR_SOV_she_department_d_desc: "The disinformation department Shelepin founded at the Lubyanka still writes forged letters, planted articles and invented pasts. The General Secretary doubles its budget and moves its aim from Bonn to Washington."
 COLDWAR_SOV_she_iron_shuriks_union: "Iron Shurik's Union"
 COLDWAR_SOV_she_iron_shuriks_union_desc: "Strict at home, loud abroad and close to the workers in every speech, the Union of Alexander Shelepin knows what it is: a state of order that the old men of 1964 never dared to build."
 COLDWAR_SOV_and_the_chekist_general_secretary: "The Chekist General Secretary"
 COLDWAR_SOV_and_the_chekist_general_secretary_desc: "Fifteen years on Lubyanka Square taught Andropov what the reports never say aloud. He arrives at Staraya Square with a file on every minister and a short list of what must change."
 COLDWAR_SOV_and_shchelokov_dismissed: "Shchelokov Dismissed"
 COLDWAR_SOV_and_shchelokov_dismissed_desc: "For sixteen years Shchelokov ran the militia like a family estate. Fedorchuk now brings KGB officers into the Interior Ministry, and Chebrikov, the General Secretary's own man, takes over the KGB."
 COLDWAR_SOV_and_the_brezhnev_family_files: "The Brezhnev Family Files"
 COLDWAR_SOV_and_the_brezhnev_family_files_desc: "Kirilenko, who can no longer read his own speeches, leaves the Politburo at the first plenum. The files on the circus diamonds and on Churbanov's friends in the ministry are opened again."
 COLDWAR_SOV_and_the_younger_men: "The Younger Men"
 COLDWAR_SOV_and_the_younger_men_desc: "Aliyev comes from Baku to the Council of Ministers, Vorotnikov from Krasnodar to the government of the Russian Federation. The old guard counts the votes and finds them younger than itself."
 COLDWAR_SOV_and_the_cotton_affair: "The Rashidov Dossier"
 COLDWAR_SOV_and_the_cotton_affair_desc: "Uzbekistan reported millions of tons of cotton that were never picked and was paid for every one. Gdlyan's investigators are in Tashkent, and the Rashidov clan has run out of protectors."
 COLDWAR_SOV_and_the_new_regional_secretaries: "Ligachev's Department"
 COLDWAR_SOV_and_the_new_regional_secretaries_desc: "Ligachev from Tomsk takes over the department for party cadres and sends younger men to the obkoms. A fifth of the regional first secretaries change within a year, and none of them owes Brezhnev anything."
 COLDWAR_SOV_and_the_missing_paragraph: "The Missing Paragraph"
 COLDWAR_SOV_and_the_missing_paragraph_desc: "From his bed at Kuntsevo the General Secretary adds a paragraph to his plenum speech: Gorbachev is to chair the Politburo and the Secretariat in his absence. Whether the plenum ever hears it depends on Chernenko's staff."
 COLDWAR_SOV_and_order_and_discipline: "Order and Discipline"
 COLDWAR_SOV_and_order_and_discipline_desc: "Militia checks in cinemas, bathhouses and shops during working hours: whoever is not at his bench must explain why. The country laughs nervously and arrives on time."
 COLDWAR_SOV_and_we_do_not_know_our_society: "We Do Not Know Our Society"
 COLDWAR_SOV_and_we_do_not_know_our_society_desc: "At the June plenum on ideology the General Secretary admits what no predecessor said: the Party does not know the society it governs. The sociologists in Novosibirsk are suddenly asked to report."
 COLDWAR_SOV_and_the_large_scale_experiment: "The Large-Scale Economic Experiment"
 COLDWAR_SOV_and_the_large_scale_experiment_desc: "Ryzhkov's new Economic Department drafts the decree: fewer plan indicators, the enterprises' own development funds, pay by results. If it works in five ministries, the whole Union follows."
 COLDWAR_SOV_and_acceleration_by_command: "Acceleration by Command"
 COLDWAR_SOV_and_acceleration_by_command_desc: "No experiments while the reserves lie idle: more shifts, stricter norms, every machine running. Order alone, the General Secretary is told, will add two per cent a year."
 COLDWAR_SOV_and_the_five_ministries: "The Five Ministries"
 COLDWAR_SOV_and_the_five_ministries_desc: "Heavy engineering, the electrotechnical industry, Ukrainian light industry, Belarusian food and Lithuanian local industry: from the first of January the test field of the new mechanism."
 COLDWAR_SOV_and_operation_ryan: "Watch for the First Strike"
 COLDWAR_SOV_and_operation_ryan_desc: "The residencies in Washington, London and Bonn count lit windows in ministries, blood bank prices and the cars at the Pentagon. The KGB is ordered to see the first strike before it comes."
 COLDWAR_SOV_and_the_geneva_walkout: "The Geneva Walkout"
 COLDWAR_SOV_and_the_geneva_walkout_desc: "The first Pershings land in Swabia, and our delegation leaves the Geneva talks without a date to return. New missiles go to the GDR and Czechoslovakia, and the peace marches in Bonn ask who began it."
 COLDWAR_SOV_and_the_november_alert: "The November Alert"
 COLDWAR_SOV_and_the_november_alert_desc: "When NATO's staffs rehearse nuclear release in November, our air regiments in the GDR and Poland load their weapons and wait. The General Secretary keeps them on alert until Washington understands what it is playing with."
 COLDWAR_SOV_and_the_consultants_group: "The Consultants' Group"
 COLDWAR_SOV_and_the_consultants_group_desc: "Arbatov, Bovin, Burlatsky and Bogomolov wrote his memoranda when he ran the department for the socialist countries. The General Secretary calls them back and asks which way the Union should go: Budapest's or Lubyanka's."
 COLDWAR_SOV_and_the_andropov_kadar_line: "The Andropov-Kadar Line"
 COLDWAR_SOV_and_the_andropov_kadar_line_desc: "Kadar's bargain holds in Budapest: whoever is not against us is with us, the shops are full, and the Party keeps every lever. Andropov, who helped put Kadar in power, brings the bargain home and lets Warsaw find its own way out."
 COLDWAR_SOV_and_the_organs_above_the_party: "The Organs above the Party"
 COLDWAR_SOV_and_the_organs_above_the_party_desc: "If the Party cannot cleanse itself, the organs will do it for the Party. KGB reports outrank the department heads, and every fraternal capital learns that Moscow's patience has an address on Lubyanka Square."
 COLDWAR_SOV_and_enterprise_work_partnerships: "Enterprise Work Partnerships"
 COLDWAR_SOV_and_enterprise_work_partnerships_desc: "After the shift the same workers may rent the same machines and sell what they make, as in Hungary's work partnerships. The shadow economy comes into the light and pays taxes; the Chekists call it legalised theft."
 COLDWAR_SOV_and_chekists_in_the_obkoms: "Chekists in the Obkoms"
 COLDWAR_SOV_and_chekists_in_the_obkoms_desc: "KGB officers take over obkom departments in the republics, as Aliyev once did in Baku, and Chernenko is thanked for his services. Every first secretary now reports to two masters, and only one of them forgives."
 COLDWAR_SOV_and_socialism_under_supervision: "Socialism under Supervision"
 COLDWAR_SOV_and_socialism_under_supervision_desc: "Order from above, accounts from below: the Party rules, the KGB watches, and the enterprises keep part of what they earn. Andropov's Union is neither Brezhnev's nor Kadar's, but it works."
 COLDWAR_SOV_ust_the_marshal_in_the_kremlin: "The Marshal in the Kremlin"
 COLDWAR_SOV_ust_the_marshal_in_the_kremlin_desc: "The man who built Stalin's guns in 1941 and Khrushchev's rockets in 1957 now sits at the head of the table. The General Staff no longer has to ask; it reports."
 COLDWAR_SOV_ust_defence_before_everything: "Defence before Everything"
 COLDWAR_SOV_ust_defence_before_everything_desc: "The defence order comes first in steel, in electronics and in engineers. The nine ministries get what they ask for; the civilian plan is written from what remains, and the queues will wait."
 COLDWAR_SOV_ust_our_own_shuttle: "Our Own Shuttle"
 COLDWAR_SOV_ust_our_own_shuttle_desc: "The Americans are building a reusable spaceplane that could, the analysts warn, dive over Moscow from orbit. Ustinov will not leave them alone in space: an orbiter of our own, and a rocket to carry it."
 COLDWAR_SOV_ust_glushkos_heavy_rocket: "Glushko's Heavy Rocket"
 COLDWAR_SOV_ust_glushkos_heavy_rocket_desc: "Glushko's NPO Energia designs a rocket that lifts a hundred tons, with or without the orbiter on its back. It devours a whole ministry's budget, and the Defence Minister signs every request."
 COLDWAR_SOV_ust_t72_for_the_allies: "The T-72 for the Allies"
 COLDWAR_SOV_ust_t72_for_the_allies_desc: "One Pact, one tank: the T-72 is to roll off the lines at Labedy and Martin, with our drawings, our steel and our credits. The allies get a modern army; we get the bill and the right to command it."
 COLDWAR_SOV_ust_the_defence_council_decides: "The Defence Council Decides"
 COLDWAR_SOV_ust_the_defence_council_decides_desc: "The real decisions are taken in a room with a handful of chairs: the General Secretary, the Defence Minister, Gromyko and the KGB. The Central Committee reads about them afterwards."
 COLDWAR_SOV_ust_strategic_superiority: "Parity Is Not Enough"
 COLDWAR_SOV_ust_strategic_superiority_desc: "More warheads, more launchers, more divisions than the enemy can count. If war comes the Union must win it, and the plan must pay for that certainty."
 COLDWAR_SOV_ust_reasonable_sufficiency: "Sufficiency, Not Superiority"
 COLDWAR_SOV_ust_reasonable_sufficiency_desc: "Enough to destroy any aggressor, not a warhead more. The money saved goes to quality, and the generals who count divisions must learn to count roubles."
 COLDWAR_SOV_ust_the_pioneer_in_europe: "The Pioneer in Europe"
 COLDWAR_SOV_ust_the_pioneer_in_europe_desc: "The RSD-10 Pioneer rolls into its bases in Belarus and the Carpathians: mobile, three warheads, every capital of Western Europe in range. NATO will have to answer, and it will answer in Bonn's streets."
 COLDWAR_SOV_ust_ogarkovs_interview: "Ogarkov's Interview"
 COLDWAR_SOV_ust_ogarkovs_interview_desc: "In Krasnaya Zvezda the Chief of the General Staff writes that new conventional weapons strike almost like nuclear ones and that our industry falls behind. Ustinov reads it as an attack on his ministries."
 COLDWAR_SOV_ust_ogarkov_dismissed: "Ogarkov Dismissed"
 COLDWAR_SOV_ust_ogarkov_dismissed_desc: "Akhromeyev takes the General Staff, Ogarkov is sent to command the western theatre, and Marshal Sokolov, the minister's loyal deputy, enters the Politburo. The ministries keep their tanks and their monopoly."
 COLDWAR_SOV_ust_ogarkov_stays: "Ogarkov Stays"
 COLDWAR_SOV_ust_ogarkov_stays_desc: "Marshal Ogarkov stays at the General Staff and gets the Defence Minister's ear instead of his anger. The tank designers lose their monopoly; the radar, computer and missile men get the future."
 COLDWAR_SOV_ust_the_high_commands_of_the_directions: "The High Commands of the Directions"
 COLDWAR_SOV_ust_the_high_commands_of_the_directions_desc: "The Western Direction gets its own high command at Legnica: the Group of Forces in Germany, the Polish and Czechoslovak fronts and the Baltic Fleet under one hand. In war it would not wait for Moscow."
 COLDWAR_SOV_ust_fewer_tanks_more_computers: "Fewer Tanks, More Computers"
 COLDWAR_SOV_ust_fewer_tanks_more_computers_desc: "Fifty thousand tanks will not stop a cruise missile or a Pershing. The oldest divisions are reduced to cadre strength, and the money goes to computers, sensors and guided munitions."
 COLDWAR_SOV_ust_the_fortress_union: "The Fortress Union"
 COLDWAR_SOV_ust_the_fortress_union_desc: "Whatever Washington builds, the Union has already answered: a shuttle, a missile for every Pershing and a General Staff that thinks in decades. The fortress stands, and its people stand in line."
 COLDWAR_SOV_ust_the_marshals_heir: "The Marshals' Heir"
 COLDWAR_SOV_ust_the_marshals_heir_desc: "Ustinov's heart is failing and the Defence Council knows it. The Marshals want a successor who keeps the defence order first: Romanov of Leningrad, the man of the shipyards."
 COLDWAR_SOV_rom_the_leningrad_team: "The Leningrad Team"
 COLDWAR_SOV_rom_the_leningrad_team_desc: "Romanov brings his own men from Smolny: plant directors, institute chiefs and obkom secretaries who measure a year in plan percentages and tolerate no excuses."
 COLDWAR_SOV_rom_zaikov_takes_smolny: "Zaikov Takes Smolny"
 COLDWAR_SOV_rom_zaikov_takes_smolny_desc: "Zaikov, who ran the Leninets works and then the city soviet, inherits Smolny and a seat at the Politburo table. Leningrad now has two votes, and Moscow's old families notice it."
 COLDWAR_SOV_rom_no_dissidents_on_the_nevsky: "No Dissidents on the Nevsky"
 COLDWAR_SOV_rom_no_dissidents_on_the_nevsky_desc: "The samizdat circles are broken up, the refuseniks wait in vain for their visas, and the Baltic students learn that Helsinki was a conference, not a promise."
 COLDWAR_SOV_rom_discipline_from_smolny: "Discipline from Smolny"
 COLDWAR_SOV_rom_discipline_from_smolny_desc: "In Leningrad a late report was a reprimand and a second one a career. The General Secretary means to run the Union the way he ran the city on the Neva."
 COLDWAR_SOV_rom_the_hermitage_rumour: "The Hermitage Rumour"
 COLDWAR_SOV_rom_the_hermitage_rumour_desc: "Western radio and Moscow kitchens repeat that the Hermitage's imperial porcelain was smashed at his daughter's wedding. The story is false, but somebody in Moscow wants it believed, and Romanov must decide what kind of ruler answers it."
 COLDWAR_SOV_rom_the_barrier_across_the_gulf: "The Barrier across the Gulf"
 COLDWAR_SOV_rom_the_barrier_across_the_gulf_desc: "Every few years the Neva floods the embankments, as it drowned the city in 1824. A dam of twenty five kilometres will run through Kronstadt to Lomonosov; the scientists warn that the bay will rot."
 COLDWAR_SOV_rom_the_arktika_at_the_pole: "The Arktika at the Pole"
 COLDWAR_SOV_rom_the_arktika_at_the_pole_desc: "The nuclear icebreaker from the Baltic Yard has reached the North Pole on the surface, the first ship ever to do so. Romanov wants a fleet of them, so that Norilsk ships its nickel in winter."
 COLDWAR_SOV_rom_smolny_governs_the_union: "Smolny Governs the Union"
 COLDWAR_SOV_rom_smolny_governs_the_union_desc: "Tikhonov is pensioned off and the Leningraders take over the Council of Ministers department by department: directors from LOMO and Elektrosila, engineers from the Kirov Works."
 COLDWAR_SOV_rom_the_answer_to_reagan: "The Answer to Reagan"
 COLDWAR_SOV_rom_the_answer_to_reagan_desc: "The cowboy in the White House calls us an evil empire and wants a war in space. Romanov's answer is the old one, louder, and the Stavropol man who talks of new thinking loses his seat."
 COLDWAR_SOV_rom_science_production_associations: "Science-Production Associations"
 COLDWAR_SOV_rom_science_production_associations_desc: "Svetlana, LOMO and the Kirov Works become the models of the Union. Each association owns its institute, its design bureau and its serial plant, from the laboratory bench to the assembly line."
 COLDWAR_SOV_rom_interbranch_science_complexes: "Interbranch Science Complexes"
 COLDWAR_SOV_rom_interbranch_science_complexes_desc: "Every key technology gets one complex that owns its institutes and pilot plants across ministry borders, and across the Elbe if Jena agrees. The ministries lose their fiefdoms, the engineers gain one boss."
 COLDWAR_SOV_rom_the_state_acceptance_inspectors: "The State Acceptance Inspectors"
 COLDWAR_SOV_rom_the_state_acceptance_inspectors_desc: "State inspectors at the factory gate reject whatever fails the standard, and the plan counts only what they accept. In the first month a fifth of the output goes back, and the workers lose their bonus."
 COLDWAR_SOV_rom_the_baltic_shipyards: "Cruisers from the Baltic Yard"
 COLDWAR_SOV_rom_the_baltic_shipyards_desc: "The Baltic Yard launches nuclear battlecruisers of the Kirov class, the Admiralty Yards build attack submarines, and Severodvinsk the Typhoons. Leningrad builds the fleet that carries the flag to every ocean."
 COLDWAR_SOV_rom_migs_for_managua: "MiGs for Managua"
 COLDWAR_SOV_rom_migs_for_managua_desc: "Washington says MiG fighters in Nicaragua are a red line. Romanov answers that a sovereign government buys its aircraft where it likes, and the Sandinista pilots training in Bulgaria will come home to real jets."
 COLDWAR_SOV_rom_submarines_off_the_american_coast: "Submarines off the American Coast"
 COLDWAR_SOV_rom_submarines_off_the_american_coast_desc: "If the Pershings can reach Moscow in minutes, our missile boats will lie off Norfolk and San Diego and give Washington the same minutes. The Northern Fleet sails, and the Americans can count the time themselves."
 COLDWAR_SOV_rom_leningrad_rules_the_union: "Leningrad Rules the Union"
 COLDWAR_SOV_rom_leningrad_rules_the_union_desc: "The city of Lenin and the Kirov Works set the pace for the whole Union: plans fulfilled to the day, engineers in the ministries, a fleet on every ocean. The northern capital has become the real one."
 COLDWAR_SOV_che_the_apparatus_restored: "The Apparatus Restored"
 COLDWAR_SOV_che_the_apparatus_restored_desc: "Tikhonov proposes him, the plenum agrees in minutes. The secretaries breathe again after Andropov's purges, and the investigators of the KGB find their files returned unread."
 COLDWAR_SOV_che_rule_through_the_general_department: "Rule through the General Department"
 COLDWAR_SOV_che_rule_through_the_general_department_desc: "Every paper of the Party still passes the General Department, now under his old deputy Bogolyubov. The General Secretary governs through minutes, resolutions and the loyalty of the Dnepropetrovsk men around Tikhonov."
 COLDWAR_SOV_che_gromykos_long_table: "Gromyko's Long Table"
 COLDWAR_SOV_che_gromykos_long_table_desc: "With a sick General Secretary the Foreign Minister speaks for the Union. Mister Nyet keeps Delhi close with arms on credit and decides alone how to answer Washington."
 COLDWAR_SOV_che_molotovs_party_card: "Molotov's Party Card"
 COLDWAR_SOV_che_molotovs_party_card_desc: "Vyacheslav Molotov, ninety-four years old and expelled for the Anti-Party Group, receives his party card back from the General Secretary's own hands. The veterans applaud; the editors of Novy Mir fall silent."
 COLDWAR_SOV_che_gorbachev_chairs_the_secretariat: "Gorbachev Chairs the Secretariat"
 COLDWAR_SOV_che_gorbachev_chairs_the_secretariat_desc: "The ailing General Secretary lets the youngest member of the Politburo run the Secretariat and chair the Thursday sessions in his absence. The old men grumble; the regions notice who signs the instructions."
 COLDWAR_SOV_che_boycott_of_the_los_angeles_games: "No Games in Los Angeles, No Talks in Geneva"
 COLDWAR_SOV_che_boycott_of_the_los_angeles_games_desc: "Washington boycotted Moscow in 1980; now the Soviet team stays home from Los Angeles and the fraternal countries follow. The delegation that left Geneva in November stays away, and the Friendship Games are held in the East."
 COLDWAR_SOV_che_back_to_the_geneva_table: "Back to the Geneva Table"
 COLDWAR_SOV_che_back_to_the_geneva_table_desc: "Gromyko meets Shultz in Geneva: the talks the Union walked out of more than a year ago are to resume. The marshals call it weakness; the General Secretary calls it a pause for breath."
 COLDWAR_SOV_che_the_old_guard_rehabilitated: "The Old Guard Rehabilitated"
 COLDWAR_SOV_che_the_old_guard_rehabilitated_desc: "Malenkov and Kaganovich get their cards back, and the men who ran the ministries under Stalin become teachers again. The plan returns to tonnes, quotas and personal responsibility, and the shops to their old emptiness."
 COLDWAR_SOV_che_the_land_reclamation_plenum: "The Land Reclamation Plenum"
 COLDWAR_SOV_che_the_land_reclamation_plenum_desc: "The October plenum sends billions into irrigation, drainage and rural roads, and the agriculture secretary carries the programme into the regions. The Food Programme lives on, now measured in hectares of reclaimed land."
 COLDWAR_SOV_che_the_answer_to_the_pershings: "The Answer to the Pershings"
 COLDWAR_SOV_che_the_answer_to_the_pershings_desc: "For every Pershing in Swabia an operational-tactical missile goes to the GDR and Czechoslovakia, and more missile submarines take up station off the American coast. Washington's warning time shrinks to what it gave Moscow."
 COLDWAR_SOV_che_a_summit_with_the_president: "A Summit with the President"
 COLDWAR_SOV_che_a_summit_with_the_president_desc: "Reagan's letters have asked for a meeting since the spring, and Gromyko has seen the White House. The General Secretary flies to Geneva on oxygen and his doctors' doubts, and returns with a handshake and a freeze the generals did not want."
 COLDWAR_SOV_che_the_kuntsevo_clinic: "The Kuntsevo Clinic"
 COLDWAR_SOV_che_the_kuntsevo_clinic_desc: "The General Secretary is short of breath and governs from the Kremlin clinic; even his vote in the elections is cast in a hospital room before the cameras. Nobody dares to disturb the calm, and everybody counts the weeks."
 COLDWAR_SOV_che_the_moscow_old_guard: "The Moscow Old Guard"
 COLDWAR_SOV_che_the_moscow_old_guard_desc: "Grishin stages the hospital vote, sits beside the dying man on television and lets it be known that the Moscow organisation has its own view of the succession. The old men want one more of their own."
 COLDWAR_SOV_che_a_nice_smile_and_iron_teeth: "A Nice Smile and Iron Teeth"
 COLDWAR_SOV_che_a_nice_smile_and_iron_teeth_desc: "Gromyko himself will nominate the next man before the plenum. The old guard knows the hour has come to hand the Party to a younger generation, and it does not like it."
 COLDWAR_SOV_che_the_restoration_completed: "The Restoration Completed"
 COLDWAR_SOV_che_the_restoration_completed_desc: "The apparatus is whole again: every secretary in his chair, every file in its drawer, every plan fulfilled on paper. The Union is calm, and calm is what it asked for."
 COLDWAR_SOV_gor_the_april_plenum: "The April Plenum of 1985"
 COLDWAR_SOV_gor_the_april_plenum_desc: "The new General Secretary speaks of acceleration and the human factor, and within a year a wave of new first secretaries sweeps the regions. Nobody in the hall can tell how far he will go."
 COLDWAR_SOV_gor_the_july_plenum: "The July Plenum of 1985"
 COLDWAR_SOV_gor_the_july_plenum_desc: "Romanov leaves the Politburo for reasons of health, Gromyko moves up to the chair of the Presidium, and the Georgian Shevardnadze, who has never been a diplomat, takes over Smolensk Square."
 COLDWAR_SOV_gor_yeltsin_for_moscow: "Yeltsin for Moscow"
 COLDWAR_SOV_gor_yeltsin_for_moscow_desc: "Tikhonov hands the government to Ryzhkov, and Grishin hands the Moscow city committee to the builder from Sverdlovsk. Yeltsin rides the trolleybus, visits the shops unannounced and fires district secretaries by the dozen."
 COLDWAR_SOV_gor_the_january_plenum: "The January Plenum"
 COLDWAR_SOV_gor_the_january_plenum_desc: "Three times postponed, the plenum on cadres finally meets: secret ballots for party secretaries, several candidates for the soviets, and Kunaev's seat empty after Alma-Ata's students met his Russian successor in the square."
 COLDWAR_SOV_gor_the_october_plenum: "The October Plenum of 1987"
 COLDWAR_SOV_gor_the_october_plenum_desc: "Yeltsin stands up unannounced, attacks Ligachev and the slow pace of reform and offers his resignation. The plenum tears him apart, Moscow gets a new first secretary, and Yakovlev's full seat looks safer than ever."
 COLDWAR_SOV_gor_the_chair_of_the_presidium: "The Chair of the Presidium"
 COLDWAR_SOV_gor_the_chair_of_the_presidium_desc: "In one hour the September plenum retires Gromyko and three other veterans, sends Ligachev to agriculture and Chebrikov out of the KGB. The next day the General Secretary takes Gromyko's chair as head of state."
 COLDWAR_SOV_gor_a_new_union_treaty: "Strong Centre, Strong Republics"
 COLDWAR_SOV_gor_a_new_union_treaty_desc: "The plenum on nationalities promises a renewed federation and retires the last Brezhnev man in Kiev. The Baltic popular fronts read the text and ask what a strong centre is for."
 COLDWAR_SOV_gor_the_union_referendum: "The Union Referendum"
 COLDWAR_SOV_gor_the_union_referendum_desc: "Do you consider it necessary to preserve the Union as a renewed federation of equal sovereign republics? Three quarters of the voters say yes; six republics refuse to open the polling stations."
 COLDWAR_SOV_gor_the_twenty_seventh_congress: "The Twenty-Seventh Congress"
 COLDWAR_SOV_gor_the_twenty_seventh_congress_desc: "The Congress hears the words radical reform from the rostrum and adopts a new edition of the Party programme. Ligachev runs the Secretariat; the question is how much the newspapers may now say."
 COLDWAR_SOV_gor_glasnost: "Glasnost"
 COLDWAR_SOV_gor_glasnost_desc: "After the silent first days of Chernobyl the General Secretary wants the truth printed. Ogonyok and Moscow News publish what was whispered in the kitchens, and the editors stop calling the censor before going to press."
 COLDWAR_SOV_gor_openness_within_limits: "Openness within Limits"
 COLDWAR_SOV_gor_openness_within_limits_desc: "Ligachev's line: criticism of shortcomings, yes; doubt about the Party, no. The newspapers may name a corrupt director, but not the system that appointed him."
 COLDWAR_SOV_gor_the_blank_spots_of_history: "The Blank Spots of History"
 COLDWAR_SOV_gor_the_blank_spots_of_history_desc: "Sakharov is back from Gorky, Children of the Arbat is in the bookshops and Bukharin is rehabilitated. In Tallinn, Riga and Vilnius crowds gather on 23 August to ask about the secret protocols of 1939."
 COLDWAR_SOV_gor_the_cotton_affair: "Accounts with the Uzbek Mafia"
 COLDWAR_SOV_gor_the_cotton_affair_desc: "Investigators from Moscow uncover billions paid for cotton that never grew, and the trail leads to Brezhnev's son-in-law. Tashkent calls it a campaign against the Uzbek people."
 COLDWAR_SOV_gor_the_nineteenth_party_conference: "The Nineteenth Party Conference"
 COLDWAR_SOV_gor_the_nineteenth_party_conference_desc: "For the first time since the twenties delegates argue openly at a Party conference. They vote for contested elections and for a Congress of People's Deputies that the Party no longer controls by default."
 COLDWAR_SOV_gor_uskoreniye: "Uskoreniye"
 COLDWAR_SOV_gor_uskoreniye_desc: "The Twelfth Plan almost doubles investment in machine building: new lathes, robots and computers are to lift growth to four per cent. Ryzhkov, the engineer from Uralmash, runs the government that must deliver it."
 COLDWAR_SOV_gor_step_by_step: "Step by Step"
 COLDWAR_SOV_gor_step_by_step_desc: "The Law on the State Enterprise: self-financing, elected directors, state orders instead of plan targets. Each year a little more freedom, so that nothing breaks at once."
 COLDWAR_SOV_gor_advances_and_debts: "Advances and Debts"
 COLDWAR_SOV_gor_advances_and_debts_desc: "Shmelev writes in Novy Mir what the economists only said in their seminars: without real prices, a market and even some unemployment the reform will choke. The radicals take him at his word; Gosplan does not answer the telephone."
 COLDWAR_SOV_gor_the_law_on_cooperatives: "The Law on Cooperatives"
 COLDWAR_SOV_gor_the_law_on_cooperatives_desc: "Cafes, tailors and repair shops may now work for profit as cooperatives. The shadow economy steps into daylight, with its prices and its protection rackets."
 COLDWAR_SOV_gor_the_geneva_fireside: "The Geneva Fireside"
 COLDWAR_SOV_gor_the_geneva_fireside_desc: "Two hours by the fire in a pool house on Lake Geneva, and a joint statement that a nuclear war cannot be won and must never be fought. The General Staff reads the communique twice."
 COLDWAR_SOV_gor_a_world_without_nuclear_weapons: "A World without Nuclear Weapons"
 COLDWAR_SOV_gor_a_world_without_nuclear_weapons_desc: "The General Secretary proposes to abolish every nuclear weapon on earth in three stages by the year 2000, and Semipalatinsk stays silent under a unilateral test moratorium. In Delhi Rajiv Gandhi signs a declaration for a world free of the bomb."
 COLDWAR_SOV_gor_the_asymmetric_answer: "The Asymmetric Answer"
 COLDWAR_SOV_gor_the_asymmetric_answer_desc: "Velikhov's scientists say the American shield can be beaten for a tenth of its price: more warheads, decoys and a battle station of our own. Energia stands on the pad at Baikonur with Polyus on its back."
 COLDWAR_SOV_gor_two_days_in_reykjavik: "Two Days in Reykjavik"
 COLDWAR_SOV_gor_two_days_in_reykjavik_desc: "In a wooden house by the sea the two leaders come within a word of abolishing their arsenals. The word is laboratory: the Union will give up everything if the Americans keep their space shield on the test bench."
 COLDWAR_SOV_gor_half_a_million_fewer_soldiers: "Half a Million Fewer Soldiers"
 COLDWAR_SOV_gor_half_a_million_fewer_soldiers_desc: "At the United Nations the General Secretary announces a unilateral cut of half a million men, and six tank divisions are to leave the GDR, Czechoslovakia and Hungary. Akhromeyev resigns the same day."
 COLDWAR_SOV_gor_the_allies_are_not_abandoned: "The Allies Are Not Abandoned"
 COLDWAR_SOV_gor_the_allies_are_not_abandoned_desc: "Sufficiency, the General Staff argues, does not mean surrender. Havana, Managua, Luanda and Kabul keep their oil, their rifles and their advisers, and Washington learns that new thinking has its limits."
 COLDWAR_SOV_gor_their_own_way: "Their Own Way"
 COLDWAR_SOV_gor_their_own_way_desc: "Asked what remains of the Brezhnev doctrine, the Foreign Ministry's spokesman answers with Frank Sinatra: each fraternal country now does it its way. From now on Comecon oil is sold at world prices, for hard currency."
 COLDWAR_SOV_gor_no_retreat_from_the_elbe: "No Retreat from the Elbe"
 COLDWAR_SOV_gor_no_retreat_from_the_elbe_desc: "The Western Group of Forces stays where Zhukov left it. Moscow will not send tanks for every strike in Leipzig, but nor will it let the fraternal parties negotiate the Pact away."
 COLDWAR_SOV_gor_the_beijing_visit: "The Beijing Visit"
 COLDWAR_SOV_gor_the_beijing_visit_desc: "Thirty years of quarrel end in the Great Hall of the People while students fill Tiananmen Square outside and cheer the man from Moscow. Deng shows him a reform without elections; the square shows him the other side of it."
 COLDWAR_SOV_gor_economy_first_politics_later: "Economy First, Politics Later"
 COLDWAR_SOV_gor_economy_first_politics_later_desc: "Look at Beijing, Ryzhkov and the plant directors say: free the farms and the factories, but keep the Party's hand on the press and the street. The General Secretary shelves the elections and keeps the reform in the economy."
 COLDWAR_SOV_gor_the_turn_to_the_right: "The Turn to the Right"
 COLDWAR_SOV_gor_the_turn_to_the_right_desc: "Pugo takes the Interior Ministry, Yanayev becomes Vice President and Shevardnadze resigns with a warning of dictatorship. The President leans on Kryuchkov's KGB and the army to hold the Union together."
 COLDWAR_SOV_gor_the_pact_with_yeltsin: "The Pact with Yeltsin"
 COLDWAR_SOV_gor_the_pact_with_yeltsin_desc: "The President of the Union and the chairman of the Russian parliament agree on one programme for both: Shatalin's and Yavlinsky's economists sit together at Arkhangelskoye, and this time the President does not pull back."
 COLDWAR_SOV_gor_land_to_the_families: "Land to the Families"
 COLDWAR_SOV_gor_land_to_the_families_desc: "The kolkhoz keeps the land on paper and hands it to families on fifty-year leases, as the Chinese did, while Nakhodka opens to Japanese capital. The district committees lose the one thing they still commanded."
 COLDWAR_SOV_gor_the_pavlov_reform: "The Pavlov Reform"
 COLDWAR_SOV_gor_the_pavlov_reform_desc: "Fifty and hundred rouble notes lose their value overnight, three days to exchange a month's wage, and in April the prices of bread and meat triple by decree. The speculators lose their hoards; so do the pensioners."
 COLDWAR_SOV_gor_free_prices_convertible_rouble: "The Five Hundred Days"
 COLDWAR_SOV_gor_free_prices_convertible_rouble_desc: "The economists' calendar: property in the first hundred days, free prices next, a convertible rouble at the end. The shelves fill within weeks, and pensions melt within months."
 COLDWAR_SOV_gor_the_union_of_sovereign_soviet_republics: "The Union of Sovereign Soviet Republics"
 COLDWAR_SOV_gor_the_union_of_sovereign_soviet_republics_desc: "At Novo-Ogaryovo the treaty is ready: sovereign republics, a common President, one army and one rouble. The word Soviet stays and the word Socialist goes, and the Union survives the year its enemies had chosen for its funeral."
 COLDWAR_SOV_for_fraternal_alliance: "The Fraternal Alliance"
 COLDWAR_SOV_for_fraternal_alliance_desc: "Seven armies under one command, eight economies under one council. Moscow carries the alliance, and every fraternal capital knows what it costs to be carried."
 COLDWAR_SOV_for_political_consultative_committee: "The Political Consultative Committee"
 COLDWAR_SOV_for_political_consultative_committee_desc: "Since the Budapest session the Pact has a Committee of Defence Ministers and a Military Council. The party leaders meet behind closed doors; Ceausescu argues, the East Germans agree, and the communique is drafted in Moscow."
 COLDWAR_SOV_emp_unified_command: "Yakubovsky's Staff"
 COLDWAR_SOV_emp_unified_command_desc: "Marshal Yakubovsky commands the Joint Armed Forces, and every deputy, every liaison officer and every plan of the staff comes from the Soviet General Staff. The allies supply divisions; Moscow supplies the orders."
 COLDWAR_SOV_emp_group_of_forces_germany: "The Group of Soviet Forces in Germany"
 COLDWAR_SOV_emp_group_of_forces_germany_desc: "Five armies and an air army between the Elbe and the Oder, headquarters at Wuensdorf, General Kulikov in command. The best tanks of the Union stand in the GDR, and the Union pays for every litre of their fuel."
 COLDWAR_SOV_for_brotherhood_in_arms: "Brotherhood in Arms"
 COLDWAR_SOV_for_brotherhood_in_arms_desc: "Waffenbruderschaft on the plains of the GDR: the armies of the Pact under one staff and one language of command. The Group of Soviet Forces sets the pace and the others keep up."
 COLDWAR_SOV_emp_seven_days_to_the_rhine: "Seven Days to the Rhine"
 COLDWAR_SOV_emp_seven_days_to_the_rhine_desc: "The staff game assumes NATO strikes first and ends with Soviet and Polish tanks at the Rhine in a week, nuclear fire on the way included. The planners call it defence; the divisions train for nothing else."
 COLDWAR_SOV_emp_wartime_statute: "The Wartime Statute"
 COLDWAR_SOV_emp_wartime_statute_desc: "In war the allied armies pass to the Soviet High Command without a further vote of their own governments. The fraternal ministers sign the new statute one after another; only Bucharest asks for amendments."
 COLDWAR_SOV_emp_isolate_bucharest: "Isolate Bucharest"
 COLDWAR_SOV_emp_isolate_bucharest_desc: "Manoeuvres in Hungary and Bulgaria close to the Romanian border, Ceausescu's generals cultivated one by one, his Chinese friends watched. Bucharest is reminded that a Pact member does not choose its own foreign policy."
 COLDWAR_SOV_emp_maverick_of_bucharest: "The Maverick of Bucharest"
 COLDWAR_SOV_emp_maverick_of_bucharest_desc: "Ceausescu receives Nixon, keeps an embassy in Bonn and talks to Beijing. Let him: a maverick inside the camp is a channel Moscow can use, and his Western credits cost the Union nothing."
 COLDWAR_SOV_emp_zapad_81: "Zapad-81"
 COLDWAR_SOV_emp_zapad_81_desc: "The largest exercise in the history of the Soviet Army: landings on the Baltic coast, tank armies in Byelorussia, Marshal Ustinov on the reviewing stand. Gdansk, a few hours away, gets the message."
 COLDWAR_SOV_emp_liaison_department: "Katushev's Department"
 COLDWAR_SOV_emp_liaison_department_desc: "The Central Committee department for the ruling parties of the socialist countries reads every speech in Warsaw, Prague and Berlin before it is given. Konstantin Katushev's men know who is loyal and who only applauds."
 COLDWAR_SOV_emp_normalisation_in_prague: "Normalisation in Prague"
 COLDWAR_SOV_emp_normalisation_in_prague_desc: "Gustav Husak exchanges the party cards, purges the reformers of 1968 and signs the Lessons of the Crisis Development. The Central Group of Forces stays in Milovice, temporarily, as the treaty says."
 COLDWAR_SOV_emp_ulbrichts_fall: "Ulbricht's Fall"
 COLDWAR_SOV_emp_ulbrichts_fall_desc: "Ulbricht lectures Moscow on economics and talks to Bonn on his own. Thirteen members of his Politburo have written to Brezhnev; Erich Honecker waits for the word, and the GDR cannot exist without the Union."
 COLDWAR_SOV_emp_suslov_commission: "The Suslov Commission"
 COLDWAR_SOV_emp_suslov_commission_desc: "The shipyards of the Baltic coast are on strike and Warsaw has signed with them. The Politburo forms a commission on Poland under Suslov with Gromyko, Andropov, Ustinov and Chernenko, and sends hard currency and grain to Kania."
 COLDWAR_SOV_for_manoeuvres_on_the_border: "Soyuz-81"
 COLDWAR_SOV_for_manoeuvres_on_the_border_desc: "Exercises in and around Poland that do not end when they should, Marshal Kulikov in Warsaw, a letter from the Central Committee that reads like an ultimatum. Jaruzelski is told that time is running out."
 COLDWAR_SOV_for_brezhnev_doctrine: "The Brezhnev Doctrine Upheld"
 COLDWAR_SOV_for_brezhnev_doctrine_desc: "If Warsaw wavers, the gains of socialism are the business of every fraternal party. The doctrine of 1968 stands, and every capital in the bloc is to know that it stands."
 COLDWAR_SOV_emp_december_decision: "The December Decision"
 COLDWAR_SOV_emp_december_decision_desc: "No Soviet troops for Poland. Andropov says it plainly: even if Solidarity takes power, the Union cannot carry another Afghanistan and Western sanctions as well. The Poles must restore order themselves."
 COLDWAR_SOV_emp_fraternal_assistance_warsaw: "Fraternal Assistance for Warsaw"
 COLDWAR_SOV_emp_fraternal_assistance_warsaw_desc: "The Northern Group of Forces leaves its barracks, the Czechoslovak and East German divisions follow, and the Polish army is told it will not fight alone. The West learns that 1968 was no figure of speech."
 COLDWAR_SOV_emp_polish_solution: "A Polish Solution"
 COLDWAR_SOV_emp_polish_solution_desc: "On the night of the thirteenth of December the Polish army does what Soviet tanks were not sent to do. Jaruzelski's Military Council interns the Solidarity leaders, and Moscow pays for the calm."
 COLDWAR_SOV_emp_restore_socialist_order: "Restore Socialist Order"
 COLDWAR_SOV_emp_restore_socialist_order_desc: "Any fraternal country that leaves the camp, or burns, will find the Soviet Army at its door. The bloc is quieter for it, and Soviet families ask why their sons serve so far from home."
 COLDWAR_SOV_for_sinatra_doctrine: "The Sinatra Doctrine"
 COLDWAR_SOV_for_sinatra_doctrine_desc: "Let them do it their way. The fraternal parties answer for their own countries now, and Moscow keeps its roubles and its divisions at home."
 COLDWAR_SOV_for_comprehensive_programme: "Socialist Economic Integration"
 COLDWAR_SOV_for_comprehensive_programme_desc: "The Bucharest session adopts twenty years of socialist economic integration: coordinated plans, specialised plants, joint research. The Romanians sign it with a frown."
 COLDWAR_SOV_for_soyuz_pipeline: "The Orenburg Gas Line"
 COLDWAR_SOV_for_soyuz_pipeline_desc: "Orenburg gas to the western border, two thousand seven hundred kilometres laid by brigades from five fraternal countries, each on its own stretch. The partners pay in labour and receive gas for twenty years."
 COLDWAR_SOV_emp_investment_bank: "The International Investment Bank"
 COLDWAR_SOV_emp_investment_bank_desc: "A bank of the Comecon in Moscow with its own capital in transferable roubles and a slice in convertible currency. Joint projects now have a lender, and the largest shareholder decides what is joint."
 COLDWAR_SOV_emp_bucharest_formula: "The Bucharest Formula"
 COLDWAR_SOV_emp_bucharest_formula_desc: "The world price of oil has quadrupled, the fraternal price follows it at a walk: a moving average of five years. The allies still pay less than Rotterdam, but every year a little more."
 COLDWAR_SOV_emp_oil_for_the_brothers: "Oil for the Brothers"
 COLDWAR_SOV_emp_oil_for_the_brothers_desc: "Every tonne promised in the plan will flow through the Druzhba line, whatever Rotterdam pays. The fraternal economies stay warm, and so does their loyalty."
 COLDWAR_SOV_emp_ten_per_cent_less_oil: "Ten Per Cent Less Oil"
 COLDWAR_SOV_emp_ten_per_cent_less_oil_desc: "Baibakov tells the fraternal planners that Soviet deliveries will fall by a tenth. The oil goes west for hard currency instead, and Warsaw and Berlin learn what the fraternal price was worth."
 COLDWAR_SOV_emp_yamburg: "The Yamburg Line"
 COLDWAR_SOV_emp_yamburg_desc: "Beyond the Arctic Circle lies the next field, and the allies are to help open it: pipe, compressors and brigades from the fraternal countries, repaid in gas into the next century."
 COLDWAR_SOV_for_havana_partnership: "The Havana Partnership"
 COLDWAR_SOV_for_havana_partnership_desc: "Cuban sugar at several times the world price, Soviet oil below it, a seat in Comecon. Havana gets a lifeline, Soviet cruisers call at Cienfuegos, and Gosplan gets a bill that never ends."
 COLDWAR_SOV_for_cam_ranh_bay: "The Cam Ranh Agreement"
 COLDWAR_SOV_for_cam_ranh_bay_desc: "The Americans built the harbour, the Vietnamese won it, and now Hanoi needs rice, oil and protection from China. A seat in Comecon and a Soviet squadron in the South China Sea answer all three."
 COLDWAR_SOV_emp_erdenet: "The Erdenet Combine"
 COLDWAR_SOV_emp_erdenet_desc: "Tsedenbal's Mongolia is the oldest friend the Union has, with Soviet divisions on its soil since the treaty of 1966. At Erdenet the friendship gets a copper mine, a new town and a Soviet bill."
 COLDWAR_SOV_emp_every_bill_paid: "Every Bill Paid"
 COLDWAR_SOV_emp_every_bill_paid_desc: "Havana, Hanoi and Ulan Bator are the proof that socialism can stand on every continent, ninety miles from Florida included. The proof costs billions of roubles a year, and Moscow pays without asking."
 COLDWAR_SOV_emp_end_of_fraternal_prices: "The End of Fraternal Prices"
 COLDWAR_SOV_emp_end_of_fraternal_prices_desc: "From the next plan the outer members pay world prices in hard currency. Gosplan breathes, Castro rages in public, and the KGB residents report that Hanoi is talking to other friends."
 COLDWAR_SOV_du_interregional_group: "The Inter-Regional Group"
 COLDWAR_SOV_du_interregional_group_desc: "Afanasyev, Popov and the deputies from Moscow and Sverdlovsk now sit in the government benches. The first opposition in seventy years has to learn to govern."
 COLDWAR_SOV_du_sakharov_charter: "Sakharov's Charter"
 COLDWAR_SOV_du_sakharov_charter_desc: "The list of political prisoners the late Academician carried from meeting to meeting becomes a government decree. The last political camps in Perm and Mordovia open their gates."
 COLDWAR_SOV_du_five_hundred_days: "A Market by Law"
 COLDWAR_SOV_du_five_hundred_days_desc: "Shatalin and Yavlinsky lay out the calendar: stabilisation and the first sales of property in a hundred days, free prices from day one hundred, a market by day five hundred. The ministries read it as their own obituary."
 COLDWAR_SOV_du_strong_presidency: "A Strong Presidency"
 COLDWAR_SOV_du_strong_presidency_desc: "The reforms cannot wait for every deputy to agree. The President governs by decree, appoints his own governors and asks the Congress for its consent afterwards."
 COLDWAR_SOV_du_round_table: "The Round Table of the Movements"
 COLDWAR_SOV_du_round_table_desc: "The popular fronts of the Baltic, the miners' committees and the democratic clubs sit at one table. Every law takes three readings and nobody is left out."
 COLDWAR_SOV_du_voucher_for_every_citizen: "A Voucher for Every Citizen"
 COLDWAR_SOV_du_voucher_for_every_citizen_desc: "Every citizen receives a share of the national wealth on paper. The workers own their factories, at least until the directors buy up the coupons at the gate."
 COLDWAR_SOV_du_great_auction: "The Great Auction"
 COLDWAR_SOV_du_great_auction_desc: "The combines go to whoever pays in hard currency. Siemens and Fiat send their engineers, the treasury fills, and the workers learn the word unemployment."
 COLDWAR_SOV_du_law_on_property: "The Law on Property"
 COLDWAR_SOV_du_law_on_property_desc: "What was speculation yesterday is enterprise today. The shadow workshops register as firms, the black marketeers open shops, and the racketeers follow them in."
 COLDWAR_SOV_du_free_the_prices: "Free the Prices"
 COLDWAR_SOV_du_free_the_prices_desc: "On a single morning the price committee stops fixing prices. The shelves fill within a week, the savings of a lifetime melt within a month."
 COLDWAR_SOV_du_disband_fifth_directorate: "Disband the Fifth Directorate"
 COLDWAR_SOV_du_disband_fifth_directorate_desc: "The old Fifth Directorate, renamed Directorate Z but unchanged, watched the writers, the believers and the nationalists. It is dissolved. Its files go to the archives, its officers to the street or to the new private banks."
 COLDWAR_SOV_du_security_service_of_the_republic: "The Security Service of the Republic"
 COLDWAR_SOV_du_security_service_of_the_republic_desc: "The Lubyanka keeps its building and changes its name. A democratic state needs a security service too, the new chairman explains, as long as it answers to the President."
 COLDWAR_SOV_du_western_credit_lines: "The Western Credit Lines"
 COLDWAR_SOV_du_western_credit_lines_desc: "The finance minister flies to London with a list of reforms and a list of debts. The creditors want the first list kept before they talk about the second."
 COLDWAR_SOV_du_army_cuts_and_conversion: "Army Cuts and Free Allies"
 COLDWAR_SOV_du_army_cuts_and_conversion_desc: "Half a million men leave the barracks, and Warsaw, Prague and Berlin are told they may go their own way. The generals call it disarmament without a treaty and retreat without a war."
 COLDWAR_SOV_du_nation_of_owners: "A Nation of Owners"
 COLDWAR_SOV_du_nation_of_owners_desc: "Land may be bought and sold, the kolkhozes become companies and their members shareholders or farmers. For the first time since collectivisation, the peasant owns his field."
 COLDWAR_SOV_uds_democratic_platform: "The Democratic Platform"
 COLDWAR_SOV_uds_democratic_platform_desc: "The reformers who left the Party without leaving socialism now hold the ministries. They promise a socialism that no longer needs a censor or a camp to defend it."
 COLDWAR_SOV_uds_let_history_judge: "Let History Judge"
 COLDWAR_SOV_uds_let_history_judge_desc: "The archives of the NKVD are opened and the commission on rehabilitation works through millions of files. Every republic finds its own dead in them."
 COLDWAR_SOV_uds_workers_self_management: "Workers' Self-Management"
 COLDWAR_SOV_uds_workers_self_management_desc: "The labour collective elects its director and decides how to use the profit. The ministry may advise; it may no longer command."
 COLDWAR_SOV_uds_all_power_to_the_soviets: "All Power to the Soviets"
 COLDWAR_SOV_uds_all_power_to_the_soviets_desc: "The old slogan is taken at its word: the elected soviets of every town and district get the budget, the police and the housing, and the Party committees get nothing."
 COLDWAR_SOV_uds_coalition_of_the_left: "The Coalition of the Left"
 COLDWAR_SOV_uds_coalition_of_the_left_desc: "Social democrats, the greens and the liberal deputies share the cabinet. The programme is a compromise, the majority is safe, and the ideologues of every side complain."
 COLDWAR_SOV_uds_enterprise_councils: "The Enterprise Councils"
 COLDWAR_SOV_uds_enterprise_councils_desc: "Belgrade lent the model, Novosibirsk the economists: councils elected by the workers run the plants and build the new ones from their own funds."
 COLDWAR_SOV_uds_cooperative_sector: "The Cooperative Sector"
 COLDWAR_SOV_uds_cooperative_sector_desc: "Restaurants, repair shops and building brigades organised as cooperatives get credit, premises and the right to set their prices. Lenin wrote about it in his last articles."
 COLDWAR_SOV_uds_law_on_public_associations: "The Law on Public Associations"
 COLDWAR_SOV_uds_law_on_public_associations_desc: "Parties, independent unions and citizens' committees register like any club. The Communist Party is now one association among many and must win its members back."
 COLDWAR_SOV_uds_social_guarantees_act: "The Social Guarantees Act"
 COLDWAR_SOV_uds_social_guarantees_act_desc: "Indexed pensions, unemployment insurance and a guaranteed minimum wage are written into law before the first enterprise may close. The market will not be paid for by the poor."
 COLDWAR_SOV_uds_end_the_privileges: "End the Nomenklatura Privileges"
 COLDWAR_SOV_uds_end_the_privileges_desc: "The closed shops, the special clinics and the state dachas go to hospitals and children's homes. The apparatus loses what it never admitted it had."
 COLDWAR_SOV_uds_independent_trade_unions: "Independent Trade Unions"
 COLDWAR_SOV_uds_independent_trade_unions_desc: "The miners of the Kuzbass and the Donbass build their own unions next to the old VTsSPS. The state recognises them and accepts the right to strike."
 COLDWAR_SOV_uds_socialist_international: "The Socialist International"
 COLDWAR_SOV_uds_socialist_international_desc: "The parties of Brandt, Palme and Kreisky are no longer called traitors to the working class, and the parties of Warsaw and Budapest may choose their own road. Stockholm sends advisers, credits and an invitation."
 COLDWAR_SOV_uds_non_aligned_socialism: "Non-Aligned Socialism"
 COLDWAR_SOV_uds_non_aligned_socialism_desc: "Moscow stops exporting tanks and starts exporting schools and hydro plants. Belgrade and Delhi become the new partners of a Union that no longer leads a camp."
 COLDWAR_SOV_uds_republic_of_labour: "The Self-Governing Republic of Labour"
 COLDWAR_SOV_uds_republic_of_labour_desc: "Councils in the plants, soviets in the towns, a free press and a welfare state. The old Bolsheviks would not recognise it; the founders of the soviets might."
 COLDWAR_SOV_ui_scientific_industrial_union: "The Scientific-Industrial Union"
 COLDWAR_SOV_ui_scientific_industrial_union_desc: "The directors of the great combines, the chief designers and the Gosplan veterans form a government of practitioners. They do not believe in slogans; they believe in output."
 COLDWAR_SOV_ui_cabinet_of_directors: "A Cabinet of Directors"
 COLDWAR_SOV_ui_cabinet_of_directors_desc: "The ministers come from the shop floor of the giant plants of Sverdlovsk, Togliatti and Kharkov. Party secretaries are no longer asked; production meetings are."
 COLDWAR_SOV_ui_regulated_market_economy: "The Regulated Market Economy"
 COLDWAR_SOV_ui_regulated_market_economy_desc: "Ryzhkov's formula: the market where it works, the plan where it must, and price rises announced in advance. The shops are emptied the day after the speech."
 COLDWAR_SOV_ui_council_of_ministers_governs: "The Council of Ministers Governs"
 COLDWAR_SOV_ui_council_of_ministers_governs_desc: "The government receives emergency economic powers for two years. Deliveries between enterprises are fixed by decree, and strikes in key industries are suspended."
 COLDWAR_SOV_ui_tripartite_commission: "The Tripartite Commission"
 COLDWAR_SOV_ui_tripartite_commission_desc: "Government, directors and unions negotiate wages, prices and lay-offs at one table every quarter. Social peace has its price, and the budget pays it."
 COLDWAR_SOV_ui_state_concerns: "The State Concerns"
 COLDWAR_SOV_ui_state_concerns_desc: "The branch ministries become state concerns: Gazprom out of the gas ministry, the machine builders into holding companies. The minister becomes chairman, and keeps his car."
 COLDWAR_SOV_ui_leasing_and_joint_stock: "Leasing and Joint-Stock Companies"
 COLDWAR_SOV_ui_leasing_and_joint_stock_desc: "The labour collectives lease their plants and buy them out with the profit. Somehow the director always ends up with the largest share."
 COLDWAR_SOV_ui_order_in_the_economy: "Order in the Economy"
 COLDWAR_SOV_ui_order_in_the_economy_desc: "The supply contracts between republics and enterprises are made binding by law, and the railways that carry them are repaired first. Who breaks a delivery pays a penalty, whether he sits in Kiev or in Tashkent."
 COLDWAR_SOV_ui_wholesale_trade: "Wholesale Trade between Enterprises"
 COLDWAR_SOV_ui_wholesale_trade_desc: "The supply agents who bartered steel for sausage in hotel lobbies get a commodity exchange. What the plan never delivered, the market now delivers at a price."
 COLDWAR_SOV_ui_social_peace_at_the_plants: "Social Peace at the Plants"
 COLDWAR_SOV_ui_social_peace_at_the_plants_desc: "The plant keeps its kindergarten, its clinic and its holiday home on the Black Sea. A worker who keeps his canteen does not join a strike committee."
 COLDWAR_SOV_ui_discipline_at_the_workplace: "Discipline at the Workplace"
 COLDWAR_SOV_ui_discipline_at_the_workplace_desc: "Absenteeism, drink on the shift and the third-hour break are punished by the director, not by the Party. The plants run full shifts again, and the workers grumble."
 COLDWAR_SOV_ui_joint_ventures: "Joint Ventures with the West"
 COLDWAR_SOV_ui_joint_ventures_desc: "Fiat, Siemens and Mitsui are invited to build with Soviet partners on Soviet soil. They bring machines and managers, and they want their profit in convertible currency."
 COLDWAR_SOV_ui_planned_conversion: "Conversion by Plan"
 COLDWAR_SOV_ui_planned_conversion_desc: "The defence plants receive civilian orders with deadlines and premiums. Missile works build washing machines and video recorders, and they build them well enough."
 COLDWAR_SOV_ui_managed_transition: "The Managed Transition"
 COLDWAR_SOV_ui_managed_transition_desc: "No shock and no collapse: the combines stay whole, the managers stay in place and the market grows inside the plan like a tree inside a greenhouse."
 COLDWAR_SOV_usr_novo_ogaryovo: "The Novo-Ogaryovo Process"
 COLDWAR_SOV_usr_novo_ogaryovo_desc: "In a government dacha outside Moscow the heads of the republics write the new Union line by line. Every article they agree on is a power the centre gives away."
 COLDWAR_SOV_usr_treaty_of_sovereign_states: "A Treaty of Sovereign States"
 COLDWAR_SOV_usr_treaty_of_sovereign_states_desc: "The republics are states, the Union a treaty among them. Who signs stays, who refuses may leave in an orderly way, and nobody sends tanks to decide the question."
 COLDWAR_SOV_usr_republican_budgets: "Republican Budgets"
 COLDWAR_SOV_usr_republican_budgets_desc: "The single-channel tax arrives: every republic collects all taxes on its soil and pays a fixed share to the Union. The all-Union ministries suddenly have to ask for their money."
 COLDWAR_SOV_usr_council_of_heads_of_republics: "The Council of the Heads of Republics"
 COLDWAR_SOV_usr_council_of_heads_of_republics_desc: "The Union is governed by the leaders of the republics, meeting every month. The President chairs the session; he no longer decides it."
 COLDWAR_SOV_usr_union_president_above_republics: "A President above the Republics"
 COLDWAR_SOV_usr_union_president_above_republics_desc: "The confederation keeps a strong centre for the army, the currency and foreign policy. The republics accept it as long as the President was elected by all of them."
 COLDWAR_SOV_usr_inter_republican_market: "The Inter-Republican Market"
 COLDWAR_SOV_usr_inter_republican_market_desc: "One rouble, no customs posts and free movement of goods from Brest to Vladivostok: the economic community holds the Union together where the Party no longer does."
 COLDWAR_SOV_usr_regional_cost_accounting: "Regional Cost Accounting"
 COLDWAR_SOV_usr_regional_cost_accounting_desc: "Estonia, Latvia and Lithuania keep what they earn and pay the Union for its services. The four authors who proposed a self-managing Estonia in the Tartu newspaper Edasi in 1987 finally get to try it."
 COLDWAR_SOV_usr_sovereignty_declarations: "The Sovereignty Declarations Recognised"
 COLDWAR_SOV_usr_sovereignty_declarations_desc: "The declarations of state sovereignty from Tallinn to Dushanbe are recognised by the Union. Republican laws take precedence wherever the treaty is silent."
 COLDWAR_SOV_usr_republican_land_laws: "The Republican Land Laws"
 COLDWAR_SOV_usr_republican_land_laws_desc: "Each republic writes its own land law: family farms in the Baltic, private plots in Georgia, leasing in the Ukraine. The kolkhoz survives only where nobody wants it gone."
 COLDWAR_SOV_usr_republican_guards: "The Republican Guards"
 COLDWAR_SOV_usr_republican_guards_desc: "Each republic raises its own national guard under its own interior minister. The Soviet army keeps the borders; order in the streets is a republican matter."
 COLDWAR_SOV_usr_common_interior_ministry: "A Common Interior Ministry"
 COLDWAR_SOV_usr_common_interior_ministry_desc: "The militia stays one service from Kaliningrad to Kamchatka, with republican chiefs approved by Moscow. The republics complain, but the criminals no longer escape over borders."
 COLDWAR_SOV_usr_joint_defence_space: "A Joint Defence Space"
 COLDWAR_SOV_usr_joint_defence_space_desc: "One army, one General Staff and one nuclear button for all the signatory states. The republics pay their share of the defence budget according to an agreed key."
 COLDWAR_SOV_usr_republican_armies: "The Republican Armies"
 COLDWAR_SOV_usr_republican_armies_desc: "The military districts become the armies of the republics; only the strategic forces stay under joint command. The marshals call it partition."
 COLDWAR_SOV_usr_union_of_sovereign_states: "The Union of Sovereign States"
 COLDWAR_SOV_usr_union_of_sovereign_states_desc: "The treaty is signed in the Kremlin by every republic that wished to stay. A smaller Union and a looser one, but it rests on consent and not on the army."
 COLDWAR_SOV_rp_word_to_the_people: "A Word to the People"
 COLDWAR_SOV_rp_word_to_the_people_desc: "Writers, generals, a famous singer and a kolkhoz chairman sign the appeal: Russia has carried the Union on its back and been thanked with contempt. Now Russia will look after Russia."
 COLDWAR_SOV_rp_russian_institutions: "Russian Institutions for Russia"
 COLDWAR_SOV_rp_russian_institutions_desc: "The RSFSR gets what every other republic always had: its own Communist Party, its own Academy of Sciences, its own television. The Union institutions wonder whom they serve."
 COLDWAR_SOV_rp_stop_feeding_the_republics: "Stop Feeding the Republics"
 COLDWAR_SOV_rp_stop_feeding_the_republics_desc: "Russian oil at world prices for Tallinn and Tbilisi, no more subsidies for the cotton of Uzbekistan. What the Russian worker earns stays in Russia."
 COLDWAR_SOV_rp_orthodoxy_and_nation: "Orthodoxy and Nation"
 COLDWAR_SOV_rp_orthodoxy_and_nation_desc: "The monasteries are returned, the bells of the Kremlin ring at Easter, and the Patriarch blesses the government. The atheists of the Central Committee keep silent."
 COLDWAR_SOV_rp_national_bolsheviks: "The National Bolsheviks"
 COLDWAR_SOV_rp_national_bolsheviks_desc: "Red banner and Russian icon on one wall: the patriots of the Party apparatus join the nationalists. The Union of Lenin becomes the empire of the Russians."
 COLDWAR_SOV_rp_revive_the_russian_village: "Revive the Russian Village"
 COLDWAR_SOV_rp_revive_the_russian_village_desc: "The dying villages of the Non-Black-Earth zone get roads, schools and machines. The money comes from the Central Asian irrigation projects, which are cancelled."
 COLDWAR_SOV_rp_russian_industry_first: "Russian Industry First"
 COLDWAR_SOV_rp_russian_industry_first_desc: "New plants for the Urals and Siberia, not for the republics that want to leave. The investment budget is redrawn along the borders of the RSFSR."
 COLDWAR_SOV_rp_russian_village_prose: "The Village Prose Writers"
 COLDWAR_SOV_rp_russian_village_prose_desc: "Rasputin, Belov and Astafyev become the conscience of the nation. Their books on the drowned villages and the poisoned rivers are read aloud in the Supreme Soviet."
 COLDWAR_SOV_rp_peasant_homestead: "The Peasant Homestead"
 COLDWAR_SOV_rp_peasant_homestead_desc: "Stolypin's dream returns: every family that wants to farm gets land for life and a credit for a house. The kolkhoz chairmen fight it field by field."
 COLDWAR_SOV_rp_russian_language_first: "The Russian Language First"
 COLDWAR_SOV_rp_russian_language_first_desc: "Russian becomes the only language of the state, the army and the university from Riga to Ashkhabad. The republics answer with their own language laws and their own crowds."
 COLDWAR_SOV_rp_rebuilding_russia: "Rebuilding Russia"
 COLDWAR_SOV_rp_rebuilding_russia_desc: "Let the Baltic, the Caucasus and Central Asia go their way and keep the Slav lands together. The emigre's pamphlet becomes government policy, and the empire shrinks to a nation."
 COLDWAR_SOV_rp_russians_abroad: "Protector of the Russians Abroad"
 COLDWAR_SOV_rp_russians_abroad_desc: "Twenty-five million Russians live outside the RSFSR, six million of them in Kazakhstan alone. Moscow declares that it will protect each of them, which the republics hear as a threat."
 COLDWAR_SOV_rp_out_of_foreign_wars: "Out of Foreign Adventures"
 COLDWAR_SOV_rp_out_of_foreign_wars_desc: "No more rifles for Luanda or credits for Hanoi, and the cheap oil for the Comecon allies is cut back. The Russian Party asks why Russian villages have no gas while the Third World gets Soviet gifts."
 COLDWAR_SOV_rp_russian_revival: "The Russian Revival"
 COLDWAR_SOV_rp_russian_revival_desc: "Churches rebuilt, villages repopulated, the Russian name restored to the state. Whatever remains of the Union is now a Russian state with allies, not a union of equals."
 COLDWAR_SOV_nsp_cannot_forgo_principles: "I Cannot Forgo Principles"
 COLDWAR_SOV_nsp_cannot_forgo_principles_desc: "The letter that Pravda condemned as an anti-perestroika manifesto in April 1988 now hangs in every district committee as a programme. The new leadership speaks of the betrayal of Lenin and the debts it means to collect."
 COLDWAR_SOV_nsp_restore_the_leading_role: "Restore the Leading Role"
 COLDWAR_SOV_nsp_restore_the_leading_role_desc: "Article Six is written back into the constitution. The new parties and the independent unions are dissolved, their newspapers closed, their deputies sent home."
 COLDWAR_SOV_nsp_the_plan_is_law: "The Plan Is Law"
 COLDWAR_SOV_nsp_the_plan_is_law_desc: "The cooperatives are closed, the joint ventures nationalised, and the plan figures are binding again under criminal law. Gosplan has its authority back."
 COLDWAR_SOV_nsp_purge_of_the_revisionists: "The Purge of the Revisionists"
 COLDWAR_SOV_nsp_purge_of_the_revisionists_desc: "The architect of glasnost is the first to lose his seat, and every member of the Party is checked again after him. The reformers lose their cards, their posts and their flats; the apparatus is lean and frightened."
 COLDWAR_SOV_nsp_collective_of_the_faithful: "The Collective of the Faithful"
 COLDWAR_SOV_nsp_collective_of_the_faithful_desc: "Ligachev, who welcomed the letter in 1988, lends the new leadership his name and his network. The old guard returns, Stalin's portrait returns to the district committees, and nobody is purged who obeys."
 COLDWAR_SOV_nsp_heavy_industry_mobilised: "Heavy Industry Mobilised"
 COLDWAR_SOV_nsp_heavy_industry_mobilised_desc: "Steel, coal and machines first, as in the first Five-Year Plans. The shops can wait; the blast furnaces cannot."
 COLDWAR_SOV_nsp_peoples_control_commissions: "The People's Control Commissions"
 COLDWAR_SOV_nsp_peoples_control_commissions_desc: "Workers' inspectors walk into the warehouses, the shops and the director's office. Speculators are shot, and the managers count their stocks twice."
 COLDWAR_SOV_nsp_order_in_the_streets: "Order in the Streets"
 COLDWAR_SOV_nsp_order_in_the_streets_desc: "Curfews for hooligans, patrols of workers' militia and the internal troops at the railway stations. The crime figures fall, and nobody asks how."
 COLDWAR_SOV_nsp_new_stakhanov_movement: "A New Stakhanov Movement"
 COLDWAR_SOV_nsp_new_stakhanov_movement_desc: "Shock brigades, red banners for the best shift and the honour boards in every plant return. Records are broken again, some of them even true."
 COLDWAR_SOV_nsp_fifth_directorate_unleashed: "Zero Tolerance for Dissent"
 COLDWAR_SOV_nsp_fifth_directorate_unleashed_desc: "The lists from the archives are taken out again: dissidents, nationalists, believers, the leaders of the popular fronts. The camps of Perm receive new prisoners."
 COLDWAR_SOV_nsp_ideological_offensive: "The Ideological Offensive"
 COLDWAR_SOV_nsp_ideological_offensive_desc: "Schools, cinema and the press return to the line. The film studios receive scripts about the war and the five-year plans; the rock clubs receive the militia."
 COLDWAR_SOV_nsp_fortress_of_socialism: "The Fortress of Socialism"
 COLDWAR_SOV_nsp_fortress_of_socialism_desc: "Imports from the West are cut to what the army needs, and the treaties signed with Washington are frozen. A besieged fortress needs no foreign machines and no foreign ideas."
 COLDWAR_SOV_nsp_bloc_brought_to_heel: "The Bloc Brought to Heel"
 COLDWAR_SOV_nsp_bloc_brought_to_heel_desc: "Warsaw, Prague and Berlin are told that the Brezhnev doctrine is back, harder than before. The Group of Forces cancels its withdrawal timetables, and the Soviet taxpayer pays for the garrisons again."
 COLDWAR_SOV_nsp_order_and_victory: "The Restoration"
 COLDWAR_SOV_nsp_order_and_victory_desc: "The red flag flies over a Union held together again by Party, plan and police. The price is fear, and the leadership considers it worth paying."
 COLDWAR_SOV_com_marshals_proclamation: "The Marshals' Proclamation"
 COLDWAR_SOV_com_marshals_proclamation_desc: "The state of emergency is declared for six months and the Council of Marshals takes over the functions of the government. The Party is suspended, not dissolved."
 COLDWAR_SOV_com_curfew_in_the_cities: "Curfew in the Cities"
 COLDWAR_SOV_com_curfew_in_the_cities_desc: "Armoured patrols at night, newspapers under military censors and strikes forbidden by order of the commandant. The streets are quiet, and the kitchens are full of talk."
 COLDWAR_SOV_com_defence_economy_restored: "The Defence Economy Restored"
 COLDWAR_SOV_com_defence_economy_restored_desc: "The General Staff writes the plan now. The defence complex gets its steel first, and the civilian ministries are told what remains."
 COLDWAR_SOV_com_rule_by_the_general_staff: "Rule by the General Staff"
 COLDWAR_SOV_com_rule_by_the_general_staff_desc: "The military districts take over the regions, colonels replace the obkom secretaries. Orders are short and are obeyed, and nobody may question them."
 COLDWAR_SOV_com_supervised_civilian_cabinet: "A Supervised Civilian Cabinet"
 COLDWAR_SOV_com_supervised_civilian_cabinet_desc: "The marshals keep defence and the interior; the economy goes to technocrats they trust. Every minister has a general standing behind his chair."
 COLDWAR_SOV_com_the_army_builds: "The Army Builds"
 COLDWAR_SOV_com_the_army_builds_desc: "Construction battalions finish the railways, the bridges and the pipelines that the ministries left half done. Soldiers are cheap and do not strike."
 COLDWAR_SOV_com_conversion_under_command: "Conversion under Military Command"
 COLDWAR_SOV_com_conversion_under_command_desc: "The defence plants receive civilian orders from a general who measures them like military deliveries. Refrigerators arrive on time and in olive green."
 COLDWAR_SOV_com_unity_of_command: "The Unity of Command"
 COLDWAR_SOV_com_unity_of_command_desc: "One chain of command from the Kremlin to the last district: army, interior troops and KGB under a single headquarters. The republics lose their militia chiefs, and the Lubyanka takes orders from the General Staff."
 COLDWAR_SOV_com_soldiers_at_the_harvest: "Soldiers at the Harvest"
 COLDWAR_SOV_com_soldiers_at_the_harvest_desc: "Divisions take the trucks and the men into the fields every autumn. The harvest is brought in before it rots, and the training year is lost."
 COLDWAR_SOV_com_martial_law_in_the_republics: "Martial Law in the Republics"
 COLDWAR_SOV_com_martial_law_in_the_republics_desc: "Tbilisi, Vilnius and Baku are placed under military commandants. The popular fronts go underground, and the flags of the republics come down from the parliaments."
 COLDWAR_SOV_com_amnesty_for_the_strikers: "An Amnesty for the Strikers"
 COLDWAR_SOV_com_amnesty_for_the_strikers_desc: "The arrested miners and the striking railwaymen are released and their committees heard. The marshals want the coal moving, not martyrs."
 COLDWAR_SOV_com_superiority_regained: "Superiority Regained"
 COLDWAR_SOV_com_superiority_regained_desc: "New missiles for the Strategic Rocket Forces, new tanks for the Western Group. The Americans will negotiate again only when they are afraid again."
 COLDWAR_SOV_com_truce_with_the_west: "A Truce with the West"
 COLDWAR_SOV_com_truce_with_the_west_desc: "The marshals offer Washington what the politicians never could: a freeze guaranteed by the men who command the missiles. In return they want time and no interference."
 COLDWAR_SOV_com_army_saves_the_state: "The Salvation of the Fatherland"
 COLDWAR_SOV_com_army_saves_the_state_desc: "The Union stands, held by the only institution that never stopped working, and the Groups of Forces stay in Germany, Poland, Czechoslovakia and Hungary. The marshals promise elections when order is secure, and nobody asks when that will be."
 COLDWAR_SOV_eco_gosplan: "The State Planning Committee"
 COLDWAR_SOV_eco_gosplan_desc: "Baibakov's Gosplan balances two thousand products, sixty ministries and fifteen republics on paper. What the plan does not foresee does not exist, and the republics learn to ask Moscow for every nail."
 COLDWAR_SOV_eco_ninth_plan: "The Ninth Five-Year Plan"
 COLDWAR_SOV_eco_ninth_plan_desc: "For 1971 to 1975 the planners promise that consumer goods will grow faster than steel for the first time. The ministries of heavy industry have already filed their objections."
 COLDWAR_SOV_eco_group_a: "The Means of Production First"
 COLDWAR_SOV_eco_group_a_desc: "Steel, machine tools and power stations come first, as they always have. The shops will get their share once the base is built, the ministers say, as they always have."
 COLDWAR_SOV_eco_group_b: "Goods for the Shops"
 COLDWAR_SOV_eco_group_b_desc: "Light industry gets the steel, the textile combines the new looms, and the shops the refrigerators that sat in the plan for years. The defence ministries count what they have lost."
 COLDWAR_SOV_eco_tenth_plan: "The Tenth Five-Year Plan"
 COLDWAR_SOV_eco_tenth_plan_desc: "The Plan of Efficiency and Quality for 1976 to 1980: fewer new giants, more output from the old ones, and the oil of Tyumen to pay for the difference."
 COLDWAR_SOV_eco_plan_by_tonnes: "Plan by the Tonne"
 COLDWAR_SOV_eco_plan_by_tonnes_desc: "Gross output stays the measure of every factory: heavy chandeliers, thick sheet steel and tractors nobody ordered. The directors know the rules and fulfil the plan."
 COLDWAR_SOV_eco_economic_mechanism: "The Decree on the Economic Mechanism"
 COLDWAR_SOV_eco_economic_mechanism_desc: "July 1979: normative net output replaces gross tonnage, and enterprises are judged on contracts delivered. The branch ministries promise to implement it, slowly, and write a thousand new normatives."
 COLDWAR_SOV_eco_eleventh_plan: "The Eleventh Five-Year Plan"
 COLDWAR_SOV_eco_eleventh_plan_desc: "1981 to 1985: a third of all investment goes to the agro-industrial complex, every district gets its agro-industrial association, and the Food Programme becomes the first priority. The factories are told to make do."
 COLDWAR_SOV_eco_finish_construction: "Finish What Was Started"
 COLDWAR_SOV_eco_finish_construction_desc: "Thousands of half-built plants rust under the snow while every ministry starts new ones. New starts are frozen until the old sites are finished, and the ministers lose their favourite projects."
 COLDWAR_SOV_eco_new_starts: "A New Plant for Every Ministry"
 COLDWAR_SOV_eco_new_starts_desc: "Every minister gets his ground-breaking ceremony and every region its new combine. The cranes are spread thinner, and the next plan inherits the building sites."
 COLDWAR_SOV_eco_twelfth_plan: "The Twelfth Five-Year Plan"
 COLDWAR_SOV_eco_twelfth_plan_desc: "1986 to 1990: Acceleration. Machine building is to grow almost twice as fast as before, the old machine park is to be replaced, and the plan targets rise again."
 COLDWAR_SOV_eco_machine_building: "Machine Building First"
 COLDWAR_SOV_eco_machine_building_desc: "New machine tools, robots and flexible production lines for every branch: the machine park of the Union is to be renewed in a single plan, the defence plants first. The shops are asked for patience once more."
 COLDWAR_SOV_eco_conversion: "The Conversion of the Defence Industry"
 COLDWAR_SOV_eco_conversion_desc: "Tank plants are to build tractors, missile works refrigerators and milk machinery. The defence ministries call it sabotage; the queues would call it overdue."
 COLDWAR_SOV_eco_july_plenum: "The July Plenum on Agriculture"
 COLDWAR_SOV_eco_july_plenum_desc: "The Central Committee meets on the village again: higher purchase prices, more tractors, more fertiliser. Every plenum since 1965 has promised the same, and the kolkhozes keep the minutes."
 COLDWAR_SOV_eco_virgin_lands: "The Virgin Lands Again"
 COLDWAR_SOV_eco_virgin_lands_desc: "Kazakhstan's steppe gave the Union its grain under Khrushchev, and its dust storms too. One more campaign of tractors and volunteers, and Alma-Ata counts the Russian settlers."
 COLDWAR_SOV_eco_non_black_earth: "The Non-Black-Earth Programme"
 COLDWAR_SOV_eco_non_black_earth_desc: "Twenty-nine regions of central Russia, empty villages and acid fields: the decree promises roads, drainage and new settlements, and closes the hamlets the planners call unpromising."
 COLDWAR_SOV_eco_melioration: "Melioration of the Land"
 COLDWAR_SOV_eco_melioration_desc: "Alekseevsky's Minvodkhoz drains the bogs of Belorussia and waters the steppe of the Volga. Its canals are counted in kilometres dug, not in harvests gained."
 COLDWAR_SOV_eco_northern_rivers: "Turning the Northern Rivers"
 COLDWAR_SOV_eco_northern_rivers_desc: "Minvodkhoz wants to send the Ob and the Irtysh south to save the Aral Sea and water Central Asia. Tashkent cheers, and the Russian writers call it the murder of the North."
 COLDWAR_SOV_eco_cotton: "Cotton at Any Price"
 COLDWAR_SOV_eco_cotton_desc: "Uzbekistan reports six million tonnes of cotton, then more. The Amu Darya no longer reaches the Aral, and in Tashkent nobody asks how the figures are made."
 COLDWAR_SOV_eco_private_plots: "The Private Plots"
 COLDWAR_SOV_eco_private_plots_desc: "Three per cent of the land gives a quarter of the food. The decree lets the kolkhozniks keep more cows and sell more at the market, and the ideologists look away."
 COLDWAR_SOV_eco_collective_contract: "The Collective Contract"
 COLDWAR_SOV_eco_collective_contract_desc: "A brigade takes a field and the machines for the whole season and is paid for the harvest, not for the hours. Khudenko tried it in Kazakhstan and died in prison; now the Central Committee's agriculture secretary recommends it."
 COLDWAR_SOV_eco_lease_contracts: "Leasing the Land"
 COLDWAR_SOV_eco_lease_contracts_desc: "Families and small brigades may rent land and machines from the kolkhoz for fifty years and sell what they grow beyond the contract. The chairmen call it the end of collectivisation."
 COLDWAR_SOV_eco_branch_ministries: "The Branch Ministries"
 COLDWAR_SOV_eco_branch_ministries_desc: "Sixty union ministries run the factories from Moscow, each with its own suppliers, its own housing and its own idea of the plan. Nothing moves between them without a signature."
 COLDWAR_SOV_eco_shchekino: "The Shchekino Method"
 COLDWAR_SOV_eco_shchekino_desc: "At the Shchekino chemical combine near Tula the director may cut jobs and keep the wage fund for those who stay. Output doubles; the trade unions ask where the others will go."
 COLDWAR_SOV_eco_state_enterprise: "The Law on the State Enterprise"
 COLDWAR_SOV_eco_state_enterprise_desc: "Enterprises elect their directors, finance themselves and sign their own contracts. The ministries keep the state orders, which still take almost all of the output."
 COLDWAR_SOV_eco_defence_consumer_goods: "Pots and Pans from the Defence Plants"
 COLDWAR_SOV_eco_defence_consumer_goods_desc: "Every defence plant must give part of its capacity to the household: tank and missile plants turn out washing machines, television sets and vacuum cleaners."
 COLDWAR_SOV_eco_flat_for_every_family: "A Flat for Every Family"
 COLDWAR_SOV_eco_flat_for_every_family_desc: "The panel combines raise nine and sixteen storeys on the edge of every city, and by the year 2000 every family is to have its own flat. The programme needs twice the building of the last fifteen years, and the building ministries promise it."
 COLDWAR_SOV_eco_price_reform: "The Retail Price Reform"
 COLDWAR_SOV_eco_price_reform_desc: "Meat and milk have cost the same since 1962 and bread even longer, while wages have doubled. New prices will end the queues overnight, and with them the savings of a whole generation."
 COLDWAR_SOV_eco_kamaz: "The Kama Truck Plant"
 COLDWAR_SOV_eco_kamaz_desc: "At Naberezhnye Chelny a whole city rises around the largest truck plant in the world, equipped by firms from America and Western Europe. The army has already ordered its share."
 COLDWAR_SOV_eco_defence_order: "The Defence Order"
 COLDWAR_SOV_eco_defence_order_desc: "Smirnov's Military-Industrial Commission sends its orders to Gosplan first, and Gosplan writes the rest of the plan around them. Trucks, tanks and missiles are delivered on time; shoes and soap when there is steel left."
 COLDWAR_SOV_eco_fuel_energy: "The Fuel and Energy Complex"
 COLDWAR_SOV_eco_fuel_energy_desc: "Oil, gas, coal and power swallow a third of all industrial investment. Every plan begins with the question how much fuel the Union can dig, and how much it can sell."
 COLDWAR_SOV_eco_tyumen: "The Tyumen Oil Province"
 COLDWAR_SOV_eco_tyumen_desc: "Samotlor, Ust-Balyk, Fyodorovsk: the swamps of the Ob give more oil every year. The drillers fly in by helicopter, and the roads are built on sand poured over the bog."
 COLDWAR_SOV_eco_oil_for_currency: "Oil for Hard Currency"
 COLDWAR_SOV_eco_oil_for_currency_desc: "Every barrel sold in Rotterdam buys grain from Kansas and machines from the Ruhr. The roubles come easily, and every one of them is a reform that need not be made."
 COLDWAR_SOV_eco_energy_at_home: "Cheap Fuel for the Plan"
 COLDWAR_SOV_eco_energy_at_home_desc: "Siberian fuel stays in the Union at prices of the 1960s: petrochemical combines in Tobolsk, power for the Urals, heat for every city. The foreign trade ministry counts the dollars it never sees."
 COLDWAR_SOV_eco_urengoy: "The Urengoy Gas Field"
 COLDWAR_SOV_eco_urengoy_desc: "The largest gas field on earth lies under the tundra beyond the Arctic Circle. Six trunk pipelines are to carry its gas west, one of them through Uzhgorod to Western Europe, and Washington's embargo on the turbines only makes the Leningrad works build its own."
 COLDWAR_SOV_eco_bam: "The Baikal-Amur Mainline"
 COLDWAR_SOV_eco_bam_desc: "Three thousand kilometres of track through taiga and permafrost, far from the Chinese border, as the General Staff demands. The Komsomol calls it the construction site of the century, and the bill grows every year."
 COLDWAR_SOV_eco_transsib: "Modernise the Trans-Siberian"
 COLDWAR_SOV_eco_transsib_desc: "Double track, electrification to Vladivostok, container trains from Japan to Europe. Cheaper than a new railway, but every train still runs within sight of the Chinese frontier."
 COLDWAR_SOV_eco_electrification: "Soviet Power plus Electrification"
 COLDWAR_SOV_eco_electrification_desc: "Lenin's formula still hangs in every power station. Minenergo wants atoms in the European west, where the coal ends, dams in Siberia, where the rivers are, and one grid from Lvov to Irkutsk to join them."
 COLDWAR_SOV_eco_rbmk: "The Channel Reactor"
 COLDWAR_SOV_eco_rbmk_desc: "The graphite channel reactor of Sredmash needs no pressure vessel and can be built anywhere in blocks of a thousand megawatts. Leningrad, Kursk and Chernobyl get the first units."
 COLDWAR_SOV_eco_vver: "The Pressure Vessel Reactor"
 COLDWAR_SOV_eco_vver_desc: "The VVER is safer and can be sold to the fraternal countries, but every pressure vessel must be forged in one plant at Izhora. The building sites wait for their turn."
 COLDWAR_SOV_eco_atommash: "Atommash"
 COLDWAR_SOV_eco_atommash_desc: "At Volgodonsk a factory is to turn out eight reactor vessels a year like tractors. The main hall stands on loess soil, and the walls have begun to crack."
 COLDWAR_SOV_eco_angara_yenisei: "The Angara-Yenisei Cascade"
 COLDWAR_SOV_eco_angara_yenisei_desc: "Krasnoyarsk, Ust-Ilimsk, Sayano-Shushenskaya: the dams of the Angara and the Yenisei give the cheapest power in the Union, and aluminium smelters rise beside them. The villages of the flooded valleys are moved, or burned."
 COLDWAR_SOV_sci_academy: "The Academy of Sciences"
 COLDWAR_SOV_sci_academy_desc: "The Academy runs two hundred and fifty institutes from Pulkovo to Vladivostok. Its members are paid like ministers and heard like priests, until they ask for something new."
 COLDWAR_SOV_sci_space: "Korolev's Heirs"
 COLDWAR_SOV_sci_space_desc: "Four years after Korolev's death his bureau, Chelomei's and Yangel's compete for the same rockets and the same roubles. Ustinov in the Central Committee decides who flies."
 COLDWAR_SOV_sci_n1_continue: "The Moon Rocket Flies"
 COLDWAR_SOV_sci_n1_continue_desc: "Four launches, four explosions, and Mishin swears the fifth will fly. The Americans have been to the Moon; a Soviet landing would still show who builds the better rockets."
 COLDWAR_SOV_sci_n1_cancel: "Cancel the Moon Rocket"
 COLDWAR_SOV_sci_n1_cancel_desc: "Glushko takes over the bureau and stops the N1. The Moon goes to the Americans, the money to stations in orbit, and Mishin's engineers mourn rockets that will never fly."
 COLDWAR_SOV_sci_salyut: "The Salyut Stations"
 COLDWAR_SOV_sci_salyut_desc: "A station in orbit for months at a time, crews relieving each other, a record broken every year. The cosmonauts become the most famous men in the country after the General Secretary."
 COLDWAR_SOV_sci_buran: "Energia and Buran"
 COLDWAR_SOV_sci_buran_desc: "The Americans fly a shuttle, so the Union must fly one too: Glushko's Energia lifts a hundred tonnes, and Buran is to land by itself. The bill passes fourteen billion roubles."
 COLDWAR_SOV_sci_venera: "Venera and Vega"
 COLDWAR_SOV_sci_venera_desc: "The first pictures from the surface of Venus, balloons in its clouds, a probe sent on to Halley's Comet: the Institute for Space Research wins where the Americans did not try."
 COLDWAR_SOV_sci_mir: "The Mir Complex"
 COLDWAR_SOV_sci_mir_desc: "A core module with six docking ports, and laboratories added one by one: Mir is to stay in orbit for years and never be empty. The Americans have nothing like it."
 COLDWAR_SOV_sci_interkosmos: "Interkosmos"
 COLDWAR_SOV_sci_interkosmos_desc: "After a Czech, a Pole, an East German, a Cuban, a Vietnamese and an Indian, now a Syrian and an Afghan fly to Mir beside a Soviet commander. Their newspapers print nothing else that week."
 COLDWAR_SOV_sci_str: "The Scientific-Technical Revolution"
 COLDWAR_SOV_sci_str_desc: "The Congress orders that the achievements of the scientific-technical revolution be combined with the advantages of socialism. The institutes take the slogan at its word and ask for computers."
 COLDWAR_SOV_sci_akademgorodok: "Akademgorodok"
 COLDWAR_SOV_sci_akademgorodok_desc: "Lavrentyev's science town in the pine forest by Novosibirsk: forty institutes, a university and a club where scientists sing banned songs. The Party sends fewer funds and more instructors."
 COLDWAR_SOV_sci_npo: "The Science-Production Associations"
 COLDWAR_SOV_sci_npo_desc: "In Leningrad the institute and the factory sit under one director: Svetlana for electronics, LOMO for optics. Romanov wants every branch to copy the model, and the ministries lose a layer of officials to every association."
 COLDWAR_SOV_sci_tokamak: "The Tokamak"
 COLDWAR_SOV_sci_tokamak_desc: "Kurchatov's T-10 holds the hottest plasma in the world, and Velikhov wants a bigger machine. The physicists speak of limitless energy; the ministry asks about the bill."
 COLDWAR_SOV_sci_computing: "The Computing Question"
 COLDWAR_SOV_sci_computing_desc: "Thirty incompatible computer models from half a dozen ministries, none of them made in numbers. The commission on computing must choose one road before the decade is lost."
 COLDWAR_SOV_sci_es_evm: "Copy the IBM 360"
 COLDWAR_SOV_sci_es_evm_desc: "The Ryad series from Minsk and Moscow will copy IBM's System 360 down to the instruction set and run its software. Fast, compatible, and always five years behind the original."
 COLDWAR_SOV_sci_ogas: "Glushkov's Network"
 COLDWAR_SOV_sci_ogas_desc: "Viktor Glushkov in Kiev proposes a nationwide network of computing centres to steer the plan in real time. The Statistical Office fears for its data, the ministries for their figures."
 COLDWAR_SOV_sci_zelenograd: "Zelenograd"
 COLDWAR_SOV_sci_zelenograd_desc: "The Soviet Silicon Valley north of Moscow: the Elion and Angstrem works, the Institute of Electronic Technology, and microchips copied layer by layer under the microscope."
 COLDWAR_SOV_mil_ministry_of_defence: "The Ministry of Defence"
 COLDWAR_SOV_mil_ministry_of_defence_desc: "Marshal Grechko commands the largest army in the world from the Arbat, and the Politburo will have to give him a seat at its table. The General Staff plans for a war in Europe, a war with China and a war at sea, and asks for the budget of all three."
 COLDWAR_SOV_mil_ground_forces: "The Ground Forces Command"
 COLDWAR_SOV_mil_ground_forces_desc: "The Ground Forces have their own High Command again. General Pavlovsky wants the tank and motor rifle divisions trained for one thing: the fast offensive to the Rhine."
 COLDWAR_SOV_mil_deep_battle: "Deep Battle Revived"
 COLDWAR_SOV_mil_deep_battle_desc: "The theories of Tukhachevsky and Triandafillov are back in the staff academies: strike the whole depth of the enemy at once, before his nuclear weapons can be released."
 COLDWAR_SOV_mil_universal_service: "The Universal Military Service Law"
 COLDWAR_SOV_mil_universal_service_desc: "Two years for every young man, three in the fleet, and military training already at school. The barracks fill, and every family in the Union now waits for a son to come home."
 COLDWAR_SOV_mil_operational_manoeuvre_groups: "Operational Manoeuvre Groups"
 COLDWAR_SOV_mil_operational_manoeuvre_groups_desc: "Reinforced tank corps wait behind the first echelon. Once the front is broken they go deep, into the depots, the airfields and the missile sites of the enemy."
 COLDWAR_SOV_mil_break_dedovshchina: "Break the Dedovshchina"
 COLDWAR_SOV_mil_break_dedovshchina_desc: "The second-year men beat the recruits, steal their rations and call it tradition. Prosecutors in the garrisons, officers on duty at night: the generals call it an insult to the army."
 COLDWAR_SOV_mil_barracks_order: "The Barracks Order"
 COLDWAR_SOV_mil_barracks_order_desc: "The old soldiers keep the young ones in line, and the officers sleep at home. Order in the barracks costs nothing, as long as nobody asks the mothers."
 COLDWAR_SOV_mil_main_battle_tank: "The Main Battle Tank Question"
 COLDWAR_SOV_mil_main_battle_tank_desc: "Kharkov, Nizhny Tagil and Leningrad each build a different tank for the same army. The Defence Council must decide which one carries the next twenty years."
 COLDWAR_SOV_mil_t64: "The Kharkov Tank"
 COLDWAR_SOV_mil_t64_desc: "Morozov's T-64 with its autoloader and composite armour is the best tank in the world, and the hardest to keep running. Only the elite divisions in Germany will get it."
 COLDWAR_SOV_mil_t72: "The Tagil Tank"
 COLDWAR_SOV_mil_t72_desc: "The T-72 from Nizhny Tagil is simpler, cheaper and built by the thousand. It goes to every military district and to every ally who can pay."
 COLDWAR_SOV_mil_t80: "The Turbine Tank"
 COLDWAR_SOV_mil_t80_desc: "The Leningrad T-80 runs on a gas turbine, fast as a car and thirsty as an aircraft. Ustinov, the secretary for the defence industry, wants it and a full seat in the Politburo with it; the quartermasters count the fuel trains."
 COLDWAR_SOV_mil_groups_of_forces: "The Groups of Forces"
 COLDWAR_SOV_mil_groups_of_forces_desc: "Twenty divisions in Germany, five in Czechoslovakia, more in Poland and Hungary. The newest tanks go west first, and the western frontier of the Union lies on the Elbe."
 COLDWAR_SOV_mil_ogarkov_reform: "The Ogarkov Reform"
 COLDWAR_SOV_mil_ogarkov_reform_desc: "The Chief of the General Staff warns that precision weapons and computers will decide the next war, not the number of tanks. The old marshals hear an attack on their army."
 COLDWAR_SOV_mil_airborne_troops: "Uncle Vasya's Troops"
 COLDWAR_SOV_mil_airborne_troops_desc: "General Margelov's paratroopers in blue berets call themselves Uncle Vasya's troops, and since the BMD they jump with their vehicles. Seven divisions ready to land as a mechanised force anywhere the Politburo points."
 COLDWAR_SOV_mil_strategic_rocket_forces: "The Strategic Rocket Forces"
 COLDWAR_SOV_mil_strategic_rocket_forces_desc: "Over a thousand silos from Kozelsk to the Altai, and the Americans count every one of them. The Rocket Forces are the youngest service and the first in the budget."
 COLDWAR_SOV_mil_air_defence_forces: "The Air Defence of the Country"
 COLDWAR_SOV_mil_air_defence_forces_desc: "The PVO Strany is a service of its own, with radar chains from the Baltic to Chukotka and MiG-25 interceptors at nearly three times the speed of sound. Since Powers was shot down over Sverdlovsk, no airspace has been guarded so jealously."
 COLDWAR_SOV_mil_moscow_abm: "The Moscow ABM Shield"
 COLDWAR_SOV_mil_moscow_abm_desc: "The A-35 interceptors ring the capital with nuclear warheads of their own. Whatever the Americans agree to in the arms talks, Moscow keeps its shield."
 COLDWAR_SOV_mil_oko: "The Oko Satellites"
 COLDWAR_SOV_mil_oko_desc: "Satellites in high orbit watch the American missile fields for the flash of a launch. The system is new, and its software does not always know a missile from sunlight on clouds."
 COLDWAR_SOV_mil_pioneer_missile: "The Pioneer Missile"
 COLDWAR_SOV_mil_pioneer_missile_desc: "A mobile missile with three warheads that can reach every capital in Western Europe in ten minutes. Bonn and London will call it a threat; the General Staff calls it modernisation."
 COLDWAR_SOV_mil_parity_or_superiority: "Parity or Superiority?"
 COLDWAR_SOV_mil_parity_or_superiority_desc: "The Union has caught up with the Americans in launchers. The designers say they can build more, the Foreign Ministry says enough is enough, and the General Secretary must speak at Tula."
 COLDWAR_SOV_mil_rough_parity: "Rough Parity"
 COLDWAR_SOV_mil_rough_parity_desc: "Sufficient is enough: the Union matches the American arsenal and stops there. The savings go to the shops, the designers lose their next missile, and the marshals sulk."
 COLDWAR_SOV_mil_strategic_superiority: "Strategic Superiority"
 COLDWAR_SOV_mil_strategic_superiority_desc: "Parity is a pause, not a goal. The heavy missiles, the new bombers and the mobile launchers go into series together, and the Gosplan finds the money in the bread queues."
 COLDWAR_SOV_mil_heavy_missiles: "The Heavy Missiles"
 COLDWAR_SOV_mil_heavy_missiles_desc: "The R-36M carries up to ten warheads out of a hardened silo. Whatever the treaty says about launchers, this one missile counts for a whole regiment."
 COLDWAR_SOV_mil_backfire: "The Backfire Bombers"
 COLDWAR_SOV_mil_backfire_desc: "Tupolev's swing-wing Tu-22M joins the long-range and naval aviation: anti-ship missiles for the American carrier groups, bombs for every target in Europe and Asia. Washington wants it counted as a strategic bomber; Moscow refuses."
 COLDWAR_SOV_mil_dead_hand: "The Dead Hand"
 COLDWAR_SOV_mil_dead_hand_desc: "If the command posts in Moscow fall silent, command rockets will order the launch on their own. No American first strike can now disarm the Union, and nobody can stop the answer."
 COLDWAR_SOV_mil_gorshkov_command: "Admiral Gorshkov's Command"
 COLDWAR_SOV_mil_gorshkov_command_desc: "Sergei Gorshkov has led the fleet since 1956 and turned a coastal force into a navy that sails every ocean. He wants more, and the shipyards eat the steel of the plan."
 COLDWAR_SOV_mil_okean: "Exercise Okean"
 COLDWAR_SOV_mil_okean_desc: "Two hundred ships and submarines in the Atlantic, the Pacific and the Mediterranean at once. The Americans watch from their aircraft and understand that the seas are no longer theirs alone."
 COLDWAR_SOV_mil_tartus: "The Tartus Supply Point"
 COLDWAR_SOV_mil_tartus_desc: "The Fifth Eskadra keeps fifty ships in the Mediterranean all year to shadow the Sixth Fleet. Now it gets a pier, a floating workshop and a fuel depot on the Syrian coast, and no longer sails home through the Bosporus to repair a pump."
 COLDWAR_SOV_mil_cam_ranh: "The Cam Ranh Squadron"
 COLDWAR_SOV_mil_cam_ranh_desc: "The harbour the Americans built in Vietnam now serves Soviet submarines and Bear reconnaissance planes. The Pacific Fleet reaches the South China Sea without asking anyone."
 COLDWAR_SOV_mil_fleet_question: "Carriers or Submarines?"
 COLDWAR_SOV_mil_fleet_question_desc: "The shipyards of Nikolaev and Severodvinsk cannot build everything. Gorshkov wants aircraft at sea; the submariners say the ocean belongs to whoever hides beneath it."
 COLDWAR_SOV_mil_aviation_cruisers: "The Aviation Cruisers"
 COLDWAR_SOV_mil_aviation_cruisers_desc: "Nikolaev lays down ships with a flight deck and calls them cruisers, because the Montreux Convention closes the Straits to carriers. The fleet wants wings over the open ocean."
 COLDWAR_SOV_mil_submarine_fleet: "The Submarine Fleet First"
 COLDWAR_SOV_mil_submarine_fleet_desc: "Every second rouble of the fleet goes under water: nuclear attack boats, cruise missile carriers, missile submarines. The surface admirals lose their ships and their voice in the staff."
 COLDWAR_SOV_mil_kiev_class: "The Kiev Class"
 COLDWAR_SOV_mil_kiev_class_desc: "The Kiev sails through the Bosporus with Yak-38 jump jets on deck. Western admirals laugh at the aircraft and stop laughing at the missiles under the bow."
 COLDWAR_SOV_mil_typhoon_delta: "The Typhoon and Delta Boats"
 COLDWAR_SOV_mil_typhoon_delta_desc: "The Delta boats fire across the Arctic without leaving home waters, and Severodvinsk builds a giant to follow them: twenty missiles under the polar ice."
 COLDWAR_SOV_mil_bastion_strategy: "The Bastion Strategy"
 COLDWAR_SOV_mil_bastion_strategy_desc: "The Barents Sea and the Sea of Okhotsk become fortresses for the missile submarines, guarded by cruisers, aircraft and hunter boats. The Americans must come to us."
 COLDWAR_SOV_mil_sea_power_of_the_state: "The Sea Power of the State"
 COLDWAR_SOV_mil_sea_power_of_the_state_desc: "Gorshkov's book is studied in every naval academy: a great power needs a great fleet. The Union now has one, from Murmansk to Vladivostok and on every sea between."
 COLDWAR_SOV_mil_indian_ocean_squadron: "The Indian Ocean Squadron"
 COLDWAR_SOV_mil_indian_ocean_squadron_desc: "The Eighth Squadron sails from Vladivostok to the Gulf of Aden: fuel and water in Aden, an anchorage off Socotra, a floating dock at Dahlak. The oil routes of the West now pass under Soviet guns."
 COLDWAR_SOV_mil_cienfuegos_base: "The Cienfuegos Base"
 COLDWAR_SOV_mil_cienfuegos_base_desc: "In 1970 Washington found barracks and a submarine tender on Alcatraz Island in the bay of Cienfuegos, and the work stopped. With a fleet on every ocean, the Navy wants to finish what it began in the American sea."
 COLDWAR_SOV_int_order_in_the_union: "Order in the Union"
 COLDWAR_SOV_int_order_in_the_union_desc: "Two hundred and forty million citizens, fifteen republics, more than a hundred nations. The Party keeps them together with the militia, the passport and the promise of a better flat; the kolkhozniks still wait for their passports."
 COLDWAR_SOV_int_lubyanka: "The Lubyanka"
 COLDWAR_SOV_int_lubyanka_desc: "Andropov has turned the KGB from Stalin's executioner into the best informed office of the state. It reads the mail, watches the embassies and writes the reports nobody else dares to, and its chairman wants a full vote in the Politburo."
 COLDWAR_SOV_int_fifth_directorate: "The Fifth Directorate"
 COLDWAR_SOV_int_fifth_directorate_desc: "A whole directorate for writers, priests, nationalists and anyone who reads the Chronicle of Current Events. Its officers know every samizdat typist in Moscow by name."
 COLDWAR_SOV_int_crush_dissidents: "Crush the Dissidents"
 COLDWAR_SOV_int_crush_dissidents_desc: "Case 24 closes the Chronicle: arrests, camp terms in Mordovia and Perm, confessions on television. The West protests, and the samizdat goes quiet for a while."
 COLDWAR_SOV_int_strip_citizenship: "Strip Their Citizenship"
 COLDWAR_SOV_int_strip_citizenship_desc: "Put the troublemakers on a plane to Frankfurt and let them write for the emigre press. No trial, no martyr, and a story about Soviet cruelty in every Western newspaper."
 COLDWAR_SOV_int_let_them_write: "Let Them Write"
 COLDWAR_SOV_int_let_them_write_desc: "The academicians may sign their letters and the poets may read in the clubs. The Party answers with arguments instead of arrests, and the Fifth Directorate is told to watch only."
 COLDWAR_SOV_int_helsinki_groups: "The Helsinki Watch Groups"
 COLDWAR_SOV_int_helsinki_groups_desc: "The Union has signed the Final Act, and Orlov's group in Moscow now reports every broken promise to the embassies. The KGB must decide how far the signature binds it."
 COLDWAR_SOV_int_serbsky_diagnosis: "The Serbsky Diagnosis"
 COLDWAR_SOV_int_serbsky_diagnosis_desc: "Whoever opposes socialism must be ill: the Serbsky Institute finds sluggish schizophrenia, and the special hospitals take the patient. No trial, no sentence, no end date."
 COLDWAR_SOV_int_close_special_hospitals: "Close the Special Hospitals"
 COLDWAR_SOV_int_close_special_hospitals_desc: "The special hospitals pass from the Interior Ministry to the doctors, and the political patients go home. The world psychiatrists take the Union back; the KGB loses its quietest weapon."
 COLDWAR_SOV_int_directorate_t: "Directorate T"
 COLDWAR_SOV_int_directorate_t_desc: "Line X officers in every Western embassy collect chips, blueprints and software for the ministries at home. Stealing is faster than inventing, as long as nobody is caught."
 COLDWAR_SOV_int_lourdes: "The Lourdes Station"
 COLDWAR_SOV_int_lourdes_desc: "From the hills of Lourdes outside Havana the antennas of the GRU and the KGB listen to the American naval bases, the satellite links and the telephones of half of Florida. Castro asks for more weapons in return."
 COLDWAR_SOV_int_cotton_affair: "The Cotton Affair"
 COLDWAR_SOV_int_cotton_affair_desc: "Millions of tonnes of cotton exist only on paper in Tashkent, and the money went to the republic's barons. The investigators' lists lead to Rashidov himself, and Uzbekistan calls it an insult to the whole republic."
 COLDWAR_SOV_int_friendship_of_peoples: "The Friendship of Peoples"
 COLDWAR_SOV_int_friendship_of_peoples_desc: "Decades of national culture in Moscow, festivals in every capital, and textbooks that speak of a new historical community, the Soviet people. In Tbilisi, Vilnius and Alma-Ata they still speak their own languages at the kitchen table."
 COLDWAR_SOV_int_russification: "The Language of Interethnic Communication"
 COLDWAR_SOV_int_russification_desc: "Russian in every kindergarten, Russian for every officer, Russian for every diploma. One language for one people, and the republics hear the end of their own."
 COLDWAR_SOV_int_korenizatsiya: "Native Cadres for Native Republics"
 COLDWAR_SOV_int_korenizatsiya_desc: "Local men run the local republics, in their own language and with their own schools. Lenin called it korenizatsiya; the Russian officials in Riga and Alma-Ata call it a threat."
 COLDWAR_SOV_int_russian_from_first_class: "Russian from the First Class"
 COLDWAR_SOV_int_russian_from_first_class_desc: "Russian lessons begin in the first school year everywhere, and every conscript understands his sergeant. In Estonia and Georgia the parents organise petitions."
 COLDWAR_SOV_int_republic_academies: "The Republican Academies"
 COLDWAR_SOV_int_republic_academies_desc: "The academies of sciences in Kiev, Tbilisi and Tashkent get their own institutes and their own budgets. The national intelligentsia finds a career inside the system, and the republican councils learn to decide without asking Moscow."
 COLDWAR_SOV_int_first_secretaries: "The Republic First Secretaries"
 COLDWAR_SOV_int_first_secretaries_desc: "Kunaev in Alma-Ata, Aliyev in Baku, Rashidov in Tashkent deliver the plan and the votes and rule their republics like fiefs. Shelest in Kiev, who speaks too loudly for Ukraine, is moved aside; Aliyev, who reports the best figures, gets a seat in Moscow."
 COLDWAR_SOV_int_internal_troops: "The Internal Troops Move In"
 COLDWAR_SOV_int_internal_troops_desc: "Paratroopers and MVD divisions in the squares of a republic capital, a curfew and a new first secretary flown in from Moscow. Order returns, and so does the memory of it."
 COLDWAR_SOV_int_republican_concessions: "The Republics Keep Their Budgets"
 COLDWAR_SOV_int_republican_concessions_desc: "The republics may keep what they earn and spend it as their own councils decide. The street calms down; the ministries in Moscow lose half their empire."
 COLDWAR_SOV_int_soviet_way_of_life: "The Soviet Way of Life"
 COLDWAR_SOV_int_soviet_way_of_life_desc: "A flat, a job for life, free clinics and a trade union holiday by the Black Sea. The Soviet citizen is promised security instead of wealth, and mostly believes it."
 COLDWAR_SOV_int_vodka_budget: "The Vodka Budget"
 COLDWAR_SOV_int_vodka_budget_desc: "Alcohol is the largest single item in the retail trade, and the budget lives on it. The Finance Ministry raises the price, the queues stay the same, the hospitals fill."
 COLDWAR_SOV_int_olympic_bid: "The Olympic Bid"
 COLDWAR_SOV_int_olympic_bid_desc: "Moscow wants the Games of 1980, the first in a socialist country. New stadiums, a new airport terminal and a capital cleaned for the world's cameras."
 COLDWAR_SOV_int_housing_queue: "The Housing Queue"
 COLDWAR_SOV_int_housing_queue_desc: "Two million flats a year, and still a family waits ten years for its own door. The prefabricated blocks rise on every city edge, and the queue only grows."
 COLDWAR_SOV_int_dry_law: "The Dry Law"
 COLDWAR_SOV_int_dry_law_desc: "Shops sell vodka only after two in the afternoon, vineyards are torn out, weddings go dry. Life expectancy rises, the budget bleeds, and the samogon stills run every night."
 COLDWAR_SOV_int_moscow_olympics: "The Moscow Olympics"
 COLDWAR_SOV_int_moscow_olympics_desc: "Misha the bear rises into the sky over Luzhniki. The Games show the world a clean, modern, socialist capital, whoever comes to watch."
 COLDWAR_SOV_int_housing_cooperatives: "Housing Cooperatives"
 COLDWAR_SOV_int_housing_cooperatives_desc: "Whoever has the savings may buy a cooperative flat and skip the queue. The money hidden in mattresses goes into concrete, and the egalitarians in the Party frown."
 COLDWAR_SOV_int_afghantsy: "The Afghantsy"
 COLDWAR_SOV_int_afghantsy_desc: "The veterans come home from a war the newspapers barely mention. They want flats, prostheses and respect, and they meet in their own clubs."
 COLDWAR_SOV_int_emergency_deliveries: "Emergency Deliveries to the Cities"
 COLDWAR_SOV_int_emergency_deliveries_desc: "Meat and butter from the state reserves go to the big cities first, by train and by aircraft. The kolkhozes deliver above plan by order, and the countryside goes hungry."
 COLDWAR_SOV_for_smolensk_square: "The House on Smolensk Square"
 COLDWAR_SOV_for_smolensk_square_desc: "Andrei Gromyko has run the Foreign Ministry since 1957, and the West calls him Mister Nyet. In the tower on Smolensk Square the diplomats prepare for a decade of treaties."
 COLDWAR_SOV_for_the_main_adversary: "The Main Adversary"
 COLDWAR_SOV_for_the_main_adversary_desc: "In the files of the First Chief Directorate the United States has one name: the main adversary. No treaty changes what Washington wants, so every rouble spent against it is spent well."
 COLDWAR_SOV_for_the_correlation_of_forces: "The Balance Has Turned"
 COLDWAR_SOV_for_the_correlation_of_forces_desc: "Parity in missiles, a fleet on every ocean, allies on four continents: the correlation of forces has turned in favour of socialism, says every Pravda leader. Now it must be used, not admired."
 COLDWAR_SOV_for_after_saigon: "After Saigon"
 COLDWAR_SOV_for_after_saigon_desc: "The last helicopter has left the embassy roof, and the Americans will not send an army abroad again for years. Every movement that asked Moscow for help is asking louder now."
 COLDWAR_SOV_for_socialism_on_the_offensive: "Socialism on the Offensive"
 COLDWAR_SOV_for_socialism_on_the_offensive_desc: "No detente that ties our hands, no treaty that freezes the map. Arms, advisers and credits go wherever the Americans are weak, and the bill is paid in shortages at home."
 COLDWAR_SOV_for_peaceful_coexistence: "Peaceful Coexistence"
 COLDWAR_SOV_for_peaceful_coexistence_desc: "Coexistence is the class struggle continued by other means, Gromyko tells the collegium. The other means are treaties, credits and Western pipes."
 COLDWAR_SOV_for_moscow_treaty: "The Moscow Treaty"
 COLDWAR_SOV_for_moscow_treaty_desc: "Brandt is invited to Moscow with a treaty that accepts the Oder-Neisse line and the border through Germany. Bonn wants trade and calm; Moscow wants its post-war map in writing."
 COLDWAR_SOV_for_salt_one: "SALT I"
 COLDWAR_SOV_for_salt_one_desc: "In Helsinki and Vienna the delegations count silos and submarines. A ceiling on launchers would freeze parity, and with it the share of the plan that parity devours."
 COLDWAR_SOV_for_gas_for_pipes: "Gas for Pipes"
 COLDWAR_SOV_for_gas_for_pipes_desc: "Mannesmann pipes, a Deutsche Bank credit, Siberian gas for twenty years. Ruhrgas, ENI and Gaz de France would become the Union's best customers and its quietest hostages."
 COLDWAR_SOV_for_helsinki_final_act: "The Helsinki Final Act"
 COLDWAR_SOV_for_helsinki_final_act_desc: "Thirty-five states are to sign in Finlandia Hall. Brezhnev wants the borders of 1945 recognised by all; the West wants a basket of human rights the dissidents will read aloud."
 COLDWAR_SOV_for_salt_two: "SALT II"
 COLDWAR_SOV_for_salt_two_desc: "Vladivostok gave the framework, Vienna the signatures: equal ceilings for both sides. The Senate in Washington will decide whether Soviet restraint is worth anything."
 COLDWAR_SOV_for_pioneer_in_europe: "Missiles West of the Urals"
 COLDWAR_SOV_for_pioneer_in_europe_desc: "The new RSD-10 rolls into the western districts: three warheads, five thousand kilometres, every NATO capital in range. The General Staff calls it modernisation; Bonn calls it blackmail."
 COLDWAR_SOV_for_freeze_on_the_euromissiles: "A Freeze on the Euromissiles"
 COLDWAR_SOV_for_freeze_on_the_euromissiles_desc: "No new missiles west of the Urals while the talks run. The marshals grumble about a gift to NATO, the peace movements in the West march for it, and the Finance Ministry says nothing at all."
 COLDWAR_SOV_for_active_measures: "Active Measures"
 COLDWAR_SOV_for_active_measures_desc: "Service A of the First Chief Directorate writes the forgeries, the World Peace Council fills the squares, and the Krefeld Appeal collects millions of signatures in the Federal Republic. Every march against the Pershings is a battle Moscow does not have to fight."
 COLDWAR_SOV_for_inf_treaty: "The INF Treaty"
 COLDWAR_SOV_for_inf_treaty_desc: "Reykjavik nearly gave away everything; now a narrower bargain lies on the table: no missiles of medium range on either side, and American inspectors at the gates of Votkinsk."
 COLDWAR_SOV_for_international_department: "The International Department"
 COLDWAR_SOV_for_international_department_desc: "Boris Ponomarev's department of the Central Committee keeps the files on every communist party and liberation front outside the bloc, and on the one in Beijing above all."
 COLDWAR_SOV_for_sino_soviet_split: "The Sino-Soviet Split"
 COLDWAR_SOV_for_sino_soviet_split_desc: "Damansky Island is quiet now, but dozens of divisions still face each other along the Amur and the Ussuri. Beijing calls the Union social-imperialist; Moscow calls Mao an adventurer."
 COLDWAR_SOV_for_asian_collective_security: "Asian Collective Security"
 COLDWAR_SOV_for_asian_collective_security_desc: "Brezhnev told the parties in Moscow that Asia needs a system of collective security. Nobody names the aggressor, and nobody needs to: Delhi, Hanoi and Ulan Bator all border the same problem."
 COLDWAR_SOV_for_the_leading_party: "The Leading Party"
 COLDWAR_SOV_for_the_leading_party_desc: "Seventy-five parties came to Moscow; Beijing, Tirana and Hanoi stayed away or kept silent. Every party that stands with us against the Maoist schism is a vote for Moscow as the centre of the movement."
 COLDWAR_SOV_for_far_east_high_command: "The Far East High Command"
 COLDWAR_SOV_for_far_east_high_command_desc: "Three military districts, the Pacific Fleet and the forces in Mongolia under one command at Chita. Forty-five divisions east of Baikal are no longer a garrison but a front that can act on its own."
 COLDWAR_SOV_for_outbid_beijing: "Outbid Beijing"
 COLDWAR_SOV_for_outbid_beijing_desc: "In Luanda Beijing backs the FNLA, in Phnom Penh the Khmer Rouge, in every capital a pro-Chinese splinter. Wherever Mao offers rifles, Moscow can offer tanks, credits and a seat at the table."
 COLDWAR_SOV_for_the_preventive_option: "The Preventive Option"
 COLDWAR_SOV_for_the_preventive_option_desc: "In 1969 Soviet diplomats asked the Americans, half in jest, what they would say to a strike on Lop Nur. The General Staff never threw the plan away: a short war while China's bomb is still small."
 COLDWAR_SOV_for_normalisation_with_beijing: "Normalisation with Beijing"
 COLDWAR_SOV_for_normalisation_with_beijing_desc: "Talks from strength: the pact in Asia and the parties behind us give Moscow a better hand than in 1969. Fewer divisions on the border, trade across the Amur; whether the frontier falls quiet is for Beijing to decide."
 COLDWAR_SOV_for_fortress_on_the_amur: "The Fortress on the Amur"
 COLDWAR_SOV_for_fortress_on_the_amur_desc: "Fortified districts from Khabarovsk to Lake Zaysan, a second track to the Pacific and an army that never goes home. If Beijing wants a frontier, it will have one, and it will be ours."
 COLDWAR_SOV_for_arms_on_credit: "Arms on Credit"
 COLDWAR_SOV_for_arms_on_credit_desc: "Tanks, MiGs and instructors for any regime that calls itself anti-imperialist, paid for with credits nobody expects to see repaid. The defence plants never lack orders."
 COLDWAR_SOV_for_angolan_airlift: "The Angolan Airlift"
 COLDWAR_SOV_for_angolan_airlift_desc: "Antonovs over the Atlantic, Cuban regiments on the ground, Soviet advisers in Luanda. The MPLA holds the capital, and the Americans, after Saigon, do not come."
 COLDWAR_SOV_for_indo_soviet_treaty: "The Indo-Soviet Treaty"
 COLDWAR_SOV_for_indo_soviet_treaty_desc: "Mrs Gandhi is ready to sign while Pakistan's army moves in the east. The treaty gives India a friend in the Security Council and the Union a door to the Indian Ocean."
 COLDWAR_SOV_for_horn_of_africa: "The Horn of Africa"
 COLDWAR_SOV_for_horn_of_africa_desc: "Siad Barre's Somalia gave the fleet Berbera; Mengistu's Ethiopia offers revolution and many times the people. The Ogaden makes it impossible to arm both."
 COLDWAR_SOV_for_friends_in_the_arab_east: "Friends in the Arab East"
 COLDWAR_SOV_for_friends_in_the_arab_east_desc: "Baghdad is ready to sign, and Damascus, which hosts the Eskadra at Tartus, wants MiGs before it wants a treaty. Every treaty brings Soviet tanks to the Arab armies and Arab oil credits to Moscow."
 COLDWAR_SOV_for_arm_addis_ababa: "Arm Addis Ababa"
 COLDWAR_SOV_for_arm_addis_ababa_desc: "The Derg is Marxist, Ethiopia is large, and the Ogaden war gives Moscow a cause. A thousand advisers, Cuban brigades and an airlift of tanks can turn the war; Berbera is the price."
 COLDWAR_SOV_for_keep_berbera: "Keep Berbera"
 COLDWAR_SOV_for_keep_berbera_desc: "Berbera's docks, airfield and missile store are worth more than a revolution in the highlands. Siad Barre keeps his Soviet guns, and Addis Ababa looks elsewhere for friends."
 COLDWAR_SOV_for_steadfastness_front: "The Steadfastness Front"
 COLDWAR_SOV_for_steadfastness_front_desc: "Sadat has gone to Jerusalem, and Tripoli, Damascus, Algiers, Aden and the PLO answer with a front of refusal. Gaddafi pays for his tanks in hard currency, and every step towards Camp David makes them want more."
 COLDWAR_SOV_for_revolution_in_the_caribbean: "Revolution in the Caribbean"
 COLDWAR_SOV_for_revolution_in_the_caribbean_desc: "The Sandinistas hold Managua, the New Jewel Movement holds Grenada, and Cuba flies new MiG-23s. Soviet arms come by way of Havana, Cuban builders lay the runway at Point Salines, and Washington sees its own back yard turning red."
 COLDWAR_SOV_for_friendship_with_kabul: "Friendship with Kabul"
 COLDWAR_SOV_for_friendship_with_kabul_desc: "The revolutionaries in Kabul ask for everything: credits, teachers, weapons and a treaty. The southern border has been quiet for fifty years, and the Politburo would like to keep it that way."
 COLDWAR_SOV_for_advisers_for_the_afghan_army: "Advisers for the Afghan Army"
 COLDWAR_SOV_for_advisers_for_the_afghan_army_desc: "Soviet officers in every Afghan division, helicopter crews at Bagram, KGB men in the ministries. The revolution reaches the villages, and the villages take up their rifles."
 COLDWAR_SOV_for_the_kabul_request: "The Kabul Request"
 COLDWAR_SOV_for_the_kabul_request_desc: "The Herat garrison has mutinied, the mujahideen hold the provinces and Kabul has asked for Soviet divisions again and again. If the revolution falls, Moscow loses an ally, a border and its word."
 COLDWAR_SOV_for_the_limited_contingent: "The Limited Contingent"
 COLDWAR_SOV_for_the_limited_contingent_desc: "The 40th Army crosses the Amu Darya to secure the cities and the roads. The revolution is saved, the bloc sees that Moscow keeps its word, and the generals have their first real war in a generation."
 COLDWAR_SOV_for_advisers_not_divisions: "Advisers, Not Divisions"
 COLDWAR_SOV_for_advisers_not_divisions_desc: "More advisers, more helicopters, more fuel, but no Soviet divisions. Kabul gets what it needs to fight its own war, and nobody in Moscow can promise that it will win it."
 COLDWAR_SOV_for_not_our_war: "Not Our War"
 COLDWAR_SOV_for_not_our_war_desc: "Afghanistan is a mountain of tribes and debts, and the Union has no business there. The money stays at home, the West stays calm, and the generals stop speaking to the Foreign Minister."
 COLDWAR_SOV_for_national_reconciliation: "National Reconciliation"
 COLDWAR_SOV_for_national_reconciliation_desc: "Kabul offers the mullahs seats, the commanders ceasefires and the refugees an amnesty. The 40th Army stops chasing the Panjshir lion and starts guarding the roads home."
 COLDWAR_SOV_for_the_withdrawal: "The Withdrawal"
 COLDWAR_SOV_for_the_withdrawal_desc: "General Gromov is the last man across the Termez bridge, and the 40th Army is home. Kabul stands for now; the veterans return to a country that does not want to hear their stories."
 COLDWAR_SOV_for_the_lost_flank: "The Amu Darya Line"
 COLDWAR_SOV_for_the_lost_flank_desc: "Kabul has fallen and the fraternal allies ask whether Moscow's word still counts. On the Amu Darya the border troops dig in, and in Tashkent and Dushanbe the mosques are full."
 COLDWAR_SOV_cr_crisis_staff: "The Crisis Staff"
 COLDWAR_SOV_cr_crisis_staff_desc: "A standing commission of the Politburo meets every morning now: the KGB chairman, the Interior Minister, the Chief of the General Staff and the secretary for the republics. The Secretariat learns of its decisions afterwards."
 COLDWAR_SOV_cr_empty_shelves: "Empty Shelves"
 COLDWAR_SOV_cr_empty_shelves_desc: "Sugar on ration coupons in the Urals, soap gone from Moscow, queues that form before the shops open and outlast them. The People have stopped joking about the deficit."
 COLDWAR_SOV_cr_bread_riots: "Bread Riots in the Provinces"
 COLDWAR_SOV_cr_bread_riots_desc: "A price rise on meat and butter, a factory meeting that turns into a march, a Party committee building with its windows broken. The regional secretary calls Moscow at midnight."
 COLDWAR_SOV_cr_bring_back_the_old_prices: "Bring Back the Old Prices"
 COLDWAR_SOV_cr_bring_back_the_old_prices_desc: "The new prices are withdrawn by Friday and the shortage is paid for from the budget. The city is calm, the queue is back, and every other region has learnt how to get a price cut."
 COLDWAR_SOV_cr_send_the_interior_troops: "Send in the Interior Troops"
 COLDWAR_SOV_cr_send_the_interior_troops_desc: "Dzerzhinsky Division trucks in the main square, a curfew, and a television silence about what happened. The streets are quiet; the anger goes underground and waits."
 COLDWAR_SOV_cr_miners_strike: "The Miners' Strike"
 COLDWAR_SOV_cr_miners_strike_desc: "The Kuzbass stops, then the Donbass: half a million miners in the squares asking for soap, meat and the right to run their own pits. The official unions are nowhere to be seen."
 COLDWAR_SOV_cr_the_national_question_erupts: "The National Question Erupts"
 COLDWAR_SOV_cr_the_national_question_erupts_desc: "In Yerevan and Tallinn, Kishinev and Alma-Ata the crowds speak their own languages and fly their own flags. The Central Committee's nationalities department works through the night."
 COLDWAR_SOV_cr_karabakh: "Karabakh"
 COLDWAR_SOV_cr_karabakh_desc: "The regional soviet of Nagorno-Karabakh votes to join Armenia; Baku says never. Sumgait burns for three days, and both first secretaries wait to see what Moscow will do."
 COLDWAR_SOV_cr_direct_rule_from_moscow: "Direct Rule from Moscow"
 COLDWAR_SOV_cr_direct_rule_from_moscow_desc: "A Special Administration Committee takes Karabakh out of Baku's hands. Interior troops on every road, and both republics furious with Moscow instead of with each other."
 COLDWAR_SOV_cr_let_yerevan_and_baku_settle_it: "Let Yerevan and Baku Settle It"
 COLDWAR_SOV_cr_let_yerevan_and_baku_settle_it_desc: "The Presidium declares the dispute a matter for the two republics and the constitution. Moscow keeps out of the blood feud, and loses the right to call itself the arbiter of the Union."
 COLDWAR_SOV_cr_baltic_popular_fronts: "The Baltic Popular Fronts"
 COLDWAR_SOV_cr_baltic_popular_fronts_desc: "Sajudis, the Popular Front of Latvia, the singing Estonians: a human chain from Tallinn to Vilnius. They ask for the truth about 1939, and after that for much more."
 COLDWAR_SOV_cr_the_parade_of_sovereignties: "The Parade of Sovereignties"
 COLDWAR_SOV_cr_the_parade_of_sovereignties_desc: "Estonia first, then Lithuania, then Russia itself: one republic after another declares its laws above the Union's. Moscow can annul the declarations on paper, or negotiate with them."
 COLDWAR_SOV_cr_the_politburo_splits: "The Politburo Splits"
 COLDWAR_SOV_cr_the_politburo_splits_desc: "Votes in the Politburo come in at eight to six now, and the minutes leak. Every secretary counts his allies in the regions, in the army and at the Lubyanka."
 COLDWAR_SOV_cr_the_generals_grumble: "The Generals Grumble"
 COLDWAR_SOV_cr_the_generals_grumble_desc: "The marshals complain about the budget, the colonels about housing, the lieutenants about the last war. Nobody threatens anything; they only make sure the Politburo hears them."
 COLDWAR_SOV_cr_i_cannot_forsake_my_principles: "I Cannot Forsake My Principles"
 COLDWAR_SOV_cr_i_cannot_forsake_my_principles_desc: "A Leningrad chemistry teacher's letter in Sovetskaya Rossiya defends Stalin and attacks the reformers. For three weeks nobody in the Central Committee dares to answer it."
 COLDWAR_SOV_cr_the_plot: "The Plot"
 COLDWAR_SOV_cr_the_plot_desc: "The KGB chairman brings a folder: a minister, two secretaries and a commander of airborne troops have been meeting at a dacha. Their plans for the country are written down."
 COLDWAR_SOV_cr_arrest_the_conspirators: "Arrest the Conspirators"
 COLDWAR_SOV_cr_arrest_the_conspirators_desc: "The arrests come at night and without a trial in the newspapers. The Politburo is quieter afterwards, the officers' messes much less so."
 COLDWAR_SOV_cr_bring_the_hardliners_inside: "Bring the Hardliners Inside"
 COLDWAR_SOV_cr_bring_the_hardliners_inside_desc: "The plotters get ministries instead of cells, and the new Interior Minister a seat in the Politburo. The army is satisfied, the security organs are flattered, and the republics see the faces of the men who wanted to crush them."
 COLDWAR_SOV_cr_the_kettle_boils: "The Kettle Boils"
 COLDWAR_SOV_cr_the_kettle_boils_desc: "The KGB reports read like storm warnings: strikes planned, leaflets in the institutes, officers who no longer report them, and every new informer costs money. Whatever has been held down is pressing against the lid."
 COLDWAR_SOV_cr_let_off_steam: "Let Off Steam"
 COLDWAR_SOV_cr_let_off_steam_desc: "Amnesty for the political prisoners, the jammers switched off, a round table with the informal groups. What has been held down comes out into the open, loudly."
 COLDWAR_SOV_cr_screw_down_the_lid: "Screw Down the Lid"
 COLDWAR_SOV_cr_screw_down_the_lid_desc: "More arrests, fewer permits, the informal groups banned. The squares empty within a week, and the KGB alone knows how long the lid will hold."
 COLDWAR_SOV_cr_the_fate_of_the_union: "The Fate of the Union"
 COLDWAR_SOV_cr_the_fate_of_the_union_desc: "The countdown has run out. The republics have their own parliaments, the army has its own plans, and the Kremlin has one last chance to decide what the Union will be."
 COLDWAR_SOV_cr_new_union_treaty: "The New Union Treaty"
 COLDWAR_SOV_cr_new_union_treaty_desc: "At Novo-Ogaryovo the republican leaders initial a treaty for a Union of Sovereign States: common defence and currency, everything else to the republics. The signing is set for August."
 COLDWAR_SOV_cr_the_state_of_emergency: "The State of Emergency"
 COLDWAR_SOV_cr_the_state_of_emergency_desc: "The State Committee for the State of Emergency takes power at dawn: tanks on the Garden Ring, Swan Lake on every channel, a decree suspending the parties. The KGB chairman who planned it now speaks for the Politburo."
 COLDWAR_SOV_cr_let_the_republics_go: "Let the Republics Go"
 COLDWAR_SOV_cr_let_the_republics_go_desc: "No more troops for Vilnius, no more decrees for Kiev. The republics that want to leave may leave; the Union that remains will be smaller and, perhaps, governable."
 COLDWAR_SOV_cr_the_iron_hand: "Rule by the Iron Hand"
 COLDWAR_SOV_cr_the_iron_hand_desc: "Paratroopers into Vilnius, Baku and Tbilisi at once, the republican parliaments dissolved, the popular front leaders flown to Moscow. The Union will be held whatever it costs."
 COLDWAR_SOV_cr_the_union_of_sovereign_states: "Signing the Union Treaty"
 COLDWAR_SOV_cr_the_union_of_sovereign_states_desc: "The treaty lies on a table in the Kremlin, a pen for every republic. Who signs stays in the Union; who does not has said so in front of the whole country."
 COLDWAR_SOV_cr_a_strong_centre: "A Strong Centre"
 COLDWAR_SOV_cr_a_strong_centre_desc: "Defence, currency, energy and the railways stay with Moscow, and so do the taxes that pay for them. The republics signed a treaty and find they have joined a ministry."
 COLDWAR_SOV_cr_a_confederal_council: "A Confederal Council"
 COLDWAR_SOV_cr_a_confederal_council_desc: "A State Council of the republican presidents decides together, and the Union President chairs it. Nothing is decided quickly, and nothing is decided against anyone."
 COLDWAR_SOV_cr_one_rouble_for_the_union: "One Rouble for the Union"
 COLDWAR_SOV_cr_one_rouble_for_the_union_desc: "One currency, one central bank, and fifteen republican banks that would each like to print a little more. The rouble holds the Union together as long as the Union holds the rouble."
 COLDWAR_SOV_cr_a_second_union: "A Second Union"
 COLDWAR_SOV_cr_a_second_union_desc: "Seventy years after the first Union Treaty, a second one works: fewer powers, more consent, two levels of government and a country that still sits in the Security Council."
 COLDWAR_SOV_cr_the_committee_takes_power: "The Committee Takes Power"
 COLDWAR_SOV_cr_the_committee_takes_power_desc: "The decrees are signed, the governors appointed, the republican parliaments told to wait. For the first time men in uniform sit at the head of the table in the Kremlin, and the Defence Minister takes a full seat in the Politburo."
 COLDWAR_SOV_cr_military_governors: "Military Governors"
 COLDWAR_SOV_cr_military_governors_desc: "Generals as governors in Riga, Tbilisi and Baku, with curfew powers and their own courts. The republics are quiet in the way occupied towns are quiet."
 COLDWAR_SOV_cr_loyal_local_bosses: "Loyal Local Bosses"
 COLDWAR_SOV_cr_loyal_local_bosses_desc: "Every republic keeps its first secretary if he keeps order: Tashkent, Alma-Ata and Ashkhabad rule themselves and send Moscow loyalty instead of taxes."
 COLDWAR_SOV_cr_the_discipline_economy: "The Discipline Economy"
 COLDWAR_SOV_cr_the_discipline_economy_desc: "Inspectors in the depots, managers in the dock, workers counted at the gate. The plan is fulfilled again, mostly because nobody dares to report that it is not."
 COLDWAR_SOV_cr_a_superpower_still: "A Superpower Still"
 COLDWAR_SOV_cr_a_superpower_still_desc: "The Union has survived its own crisis under the marshals. Smaller freedoms, a larger army, and a seat at every table where the world is divided, from Havana to Hanoi."
 COLDWAR_SOV_cr_the_belovezha_accords: "The Belovezha Accords"
 COLDWAR_SOV_cr_the_belovezha_accords_desc: "Three leaders meet in a hunting lodge in the Belovezha forest and write a short text: the Union as a subject of international law ceases to exist. The Commonwealth begins."
 COLDWAR_SOV_cr_the_soviet_inheritance: "The Soviet Inheritance"
 COLDWAR_SOV_cr_the_soviet_inheritance_desc: "Warheads in Ukraine, Kazakhstan and Belarus, a fleet in Sevastopol, nearly seventy billion dollars of foreign debt and a seat in the Security Council. Somebody must inherit all of it."
 COLDWAR_SOV_cr_shock_therapy: "Shock Therapy"
 COLDWAR_SOV_cr_shock_therapy_desc: "Prices are freed on the second of January. The shops fill within a week, the savings of a lifetime are gone within a month, and the young economists in the government call it the only way."
 COLDWAR_SOV_cr_the_gradual_road: "The Gradual Road"
 COLDWAR_SOV_cr_the_gradual_road_desc: "Prices rise step by step, the big plants keep their subsidies, the directors keep their plants. The country changes slowly enough that the factory towns survive it."
 COLDWAR_SOV_cr_russia_reborn: "Russia Reborn"
 COLDWAR_SOV_cr_russia_reborn_desc: "The tricolour flies over the Kremlin. A smaller country, poorer for now, but one whose borders are agreed with its neighbours and whose future is its own."
 COLDWAR_SOV_cr_martial_law_in_the_republics: "Curfew from Tallinn to Dushanbe"
 COLDWAR_SOV_cr_martial_law_in_the_republics_desc: "Curfews from Tallinn to Dushanbe, the republican television stations occupied, the popular fronts banned. Some republics bow; others take to the forests and the mountains."
 COLDWAR_SOV_cr_pay_the_loyal_divisions: "Pay the Loyal Divisions"
 COLDWAR_SOV_cr_pay_the_loyal_divisions_desc: "Ukrainian officers swear a new oath, Georgian conscripts go home with their rifles. The divisions that stay loyal get double pay, new flats and the first pick of the depots."
 COLDWAR_SOV_cr_fight_for_every_republic: "Fight for Every Republic"
 COLDWAR_SOV_cr_fight_for_every_republic_desc: "Not one republic will be given up. The General Staff plans campaigns in the Caucasus and the Baltic, and the mothers of the conscripts begin to march in Moscow."
 COLDWAR_SOV_cr_hold_the_russian_core: "Hold the Russian Core"
 COLDWAR_SOV_cr_hold_the_russian_core_desc: "Russia, Belarus, northern Kazakhstan: what can be held is held, the rest is let go before it costs another division. The marshals call it surrender; the treasury calls it survival."
 COLDWAR_SOV_cr_out_of_the_ruins: "Out of the Ruins"
 COLDWAR_SOV_cr_out_of_the_ruins_desc: "The fighting is over, the borders are where the army stopped, and the state that remains has learnt what force can and cannot hold."
 COLDWAR_SOVR_av_bre_the_winter_of_seventy_nine: "leader:bre AND Afghanistan has a communist government in civil war or below 30 % stability"
 COLDWAR_SOVR_av_candidacy_and: "Andropov is a full Politburo member AND Ustinov or Gromyko is a full member"
 COLDWAR_SOVR_av_candidacy_che: "Chernenko is a full Politburo member AND Tikhonov is a full member OR Brezhnev is alive (the Dnepropetrovsk network)"
 COLDWAR_SOVR_av_candidacy_gor: "Gorbachev is a full Politburo member AND Andropov is alive OR Gromyko is a full member AND Politburo balance <= +0.15"
 COLDWAR_SOVR_av_candidacy_kos: "Kosygin is alive and a full Politburo member AND Mazurov is a full member OR Masherov is a Politburo member (the government and the Belorussian vote)"
 COLDWAR_SOVR_av_candidacy_rom: "Romanov is a full Politburo member AND Grishin or Tikhonov is a full member AND Politburo balance >= 0"
 COLDWAR_SOVR_av_candidacy_she: "Shelepin is a full Politburo member AND Shelest or Polyansky is a full member (the hardliners who distrust the General Secretary) AND Politburo balance >= +0.10"
 COLDWAR_SOVR_av_candidacy_ust: "Ustinov is a full Politburo member or Defence Minister AND Grechko is a full member OR Andropov is a full member AND Politburo balance >= 0"
 COLDWAR_SOVR_av_cr_baltic_popular_fronts: "Peoples camp >= 60 AND (Lithuania, Latvia or Estonia has unrest >= 50 OR has Openness)"
 COLDWAR_SOVR_av_cr_bread_riots: "People camp >= 60 AND (a price rise this Five-Year Plan OR People camp >= 75)"
 COLDWAR_SOVR_av_cr_crisis_staff: "Any camp >= 45 OR Union Cohesion < 50 OR Pressure >= 60"
 COLDWAR_SOVR_av_cr_empty_shelves: "People camp >= 60"
 COLDWAR_SOVR_av_cr_i_cannot_forsake_my_principles: "Elite camp >= 60 AND Politburo balance <= 0"
 COLDWAR_SOVR_av_cr_karabakh: "Peoples camp >= 60 AND Armenia or Azerbaijan has unrest >= 60 (their Social Contract)"
 COLDWAR_SOVR_av_cr_miners_strike: "People camp >= 60 AND (has Openness OR the economy is in recession)"
 COLDWAR_SOVR_av_cr_the_fate_of_the_union: "The Fate of the Union endgame has started (two camps >= 80, Pressure >= 95 or Union Cohesion < 20)"
 COLDWAR_SOVR_av_cr_the_generals_grumble: "Elite camp >= 60 AND (army opinion < 0 OR a lost war or failed intervention)"
 COLDWAR_SOVR_av_cr_the_kettle_boils: "Pressure >= 80"
 COLDWAR_SOVR_av_cr_the_national_question_erupts: "Peoples camp >= 60 OR Union Cohesion < 35"
 COLDWAR_SOVR_av_cr_the_parade_of_sovereignties: "Union Cohesion < 35"
 COLDWAR_SOVR_av_cr_the_plot: "Elite camp >= 80"
