 COLDWAR_PB_free_resolution: "Free Resolution of the Politburo"
 COLDWAR_PB_free_resolution_desc: "A resolution for a decision taken in roleplay. Its content, effects and details are agreed in the roleplay channels; here the Politburo votes on it, and the result is recorded under its number. The game applies no effect by itself; after a resolution is adopted, one effect package may be attached to it within 60 days."
 COLDWAR_PB_free_resolution_tt: "The Politburo votes on §YFree Resolution No. [?global.COLDWAR_PB_res_no|0]§! and the next ones get the following numbers."
 COLDWAR_PB_intervention: "Intervention Prepared"
 COLDWAR_PB_military_advisers: "Military Advisers Abroad"
 COLDWAR_PB_moscow_button: "The Moscow Members"
 COLDWAR_PB_moscow_button_tt: "Open the list of the Moscow members of the Politburo: their line, their office, their ballot during a vote, and the cadre reserve."
 COLDWAR_PB_moscow_count: "On the list: §Y[?global.COLDWAR_PB_n_full|0]§! full members and §Y[?global.COLDWAR_PB_n_cand|0]§! candidates. In the current vote: §G[?global.COLDWAR_PB_moscow_yes|0]§! of §Y[?global.COLDWAR_PB_moscow_total|0]§! Moscow votes for."
 COLDWAR_PB_moscow_rule: "A member votes for a motion that goes his way, or when the General Secretary is one of his network. Seats of the republics without a player always vote with Moscow."
 COLDWAR_PB_moscow_title: "The Moscow Members"
 COLDWAR_PB_motion_authorise_volunteers: "Motion: Authorise Volunteers"
 COLDWAR_PB_motion_authorise_volunteers_desc: "Soviet volunteers in a foreign war, whatever the world tension. Adopted: volunteers may be sent at any tension and in larger numbers for two years; Burden of Empire +0.03, World Tension +3. The motion goes to the vote of the Politburo; seats without a player vote with Moscow."
 COLDWAR_PB_motion_authorise_volunteers_tt: "The Politburo votes on §YAuthorise Volunteers§!. Soviet volunteers in a foreign war, whatever the world tension. Adopted: volunteers may be sent at any tension and in larger numbers for two years; Burden of Empire +0.03, World Tension +3."
 COLDWAR_PB_motion_brezhnev_doctrine: "Motion: The Brezhnev Doctrine"
 COLDWAR_PB_motion_brezhnev_doctrine_desc: "The sovereignty of each socialist country ends where the gains of socialism are in danger. Adopted: the Bloc doctrine changes without cost or lock. Rejected: we change it alone, at full cost. The motion goes to the vote of the Politburo; seats without a player vote with Moscow."
 COLDWAR_PB_motion_brezhnev_doctrine_tt: "The Politburo votes on §YThe Brezhnev Doctrine§!. The sovereignty of each socialist country ends where the gains of socialism are in danger. Adopted: the Bloc doctrine changes without cost or lock. Rejected: we change it alone, at full cost."
 COLDWAR_PB_motion_doctrine_of_restraint: "Motion: A Doctrine of Restraint"
 COLDWAR_PB_motion_doctrine_of_restraint_desc: "Tanks are the last argument, not the first. Adopted: the Bloc doctrine changes without cost or lock. Rejected: we change it alone, at full cost. The motion goes to the vote of the Politburo; seats without a player vote with Moscow."
 COLDWAR_PB_motion_doctrine_of_restraint_tt: "The Politburo votes on §YA Doctrine of Restraint§!. Tanks are the last argument, not the first. Adopted: the Bloc doctrine changes without cost or lock. Rejected: we change it alone, at full cost."
 COLDWAR_PB_motion_fraternal_assistance: "Motion: Fraternal Assistance"
 COLDWAR_PB_motion_fraternal_assistance_desc: "The Politburo backs aid to embattled brother parties. Adopted: Granting Fraternal Assistance costs half for a year. The motion goes to the vote of the Politburo; seats without a player vote with Moscow."
 COLDWAR_PB_motion_fraternal_assistance_tt: "The Politburo votes on §YFraternal Assistance§!. The Politburo backs aid to embattled brother parties. Adopted: Granting Fraternal Assistance costs half for a year."
 COLDWAR_PB_motion_intervention: "Motion: Intervention"
 COLDWAR_PB_motion_intervention_desc: "The Politburo prepares an armed intervention; the declaration of war stays with the General Secretary. Adopted: war goals are justified in half the time for a year; Burden of Empire +0.05, World Tension +5. The motion goes to the vote of the Politburo; seats without a player vote with Moscow."
 COLDWAR_PB_motion_intervention_tt: "The Politburo votes on §YIntervention§!. The Politburo prepares an armed intervention; the declaration of war stays with the General Secretary. Adopted: war goals are justified in half the time for a year; Burden of Empire +0.05, World Tension +5."
 COLDWAR_PB_motion_military_advisers: "Motion: Military Advisers Abroad"
 COLDWAR_PB_motion_military_advisers_desc: "Officers, instructors and interpreters for friendly armies. Adopted: the Military Advisers spirit for two years. The motion goes to the vote of the Politburo; seats without a player vote with Moscow."
 COLDWAR_PB_motion_military_advisers_tt: "The Politburo votes on §YMilitary Advisers Abroad§!. Officers, instructors and interpreters for friendly armies. Adopted: the Military Advisers spirit for two years."
 COLDWAR_PB_motion_restore_socialist_order: "Motion: Restore Socialist Order"
 COLDWAR_PB_motion_restore_socialist_order_desc: "The Politburo authorises the use of force inside the Bloc. Adopted: Restore Socialist Order costs half for a year. The motion goes to the vote of the Politburo; seats without a player vote with Moscow."
 COLDWAR_PB_motion_restore_socialist_order_tt: "The Politburo votes on §YRestore Socialist Order§!. The Politburo authorises the use of force inside the Bloc. Adopted: Restore Socialist Order costs half for a year."
 COLDWAR_PB_motion_sinatra_doctrine: "Motion: The Sinatra Doctrine"
 COLDWAR_PB_motion_sinatra_doctrine_desc: "Let them do it their way. Adopted: the Bloc doctrine changes without cost or lock. Rejected: we change it alone, at full cost. The motion goes to the vote of the Politburo; seats without a player vote with Moscow."
 COLDWAR_PB_motion_sinatra_doctrine_tt: "The Politburo votes on §YThe Sinatra Doctrine§!. Let them do it their way. Adopted: the Bloc doctrine changes without cost or lock. Rejected: we change it alone, at full cost."
