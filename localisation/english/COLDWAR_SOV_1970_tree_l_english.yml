 COLDWAR_SOVR.1.a: "Forward, to the Lenin Centenary."
 COLDWAR_SOVR.1.d: "Brezhnev leads the Party, Kosygin the government, Podgorny the Presidium. Gosplan prepares the Ninth Plan, the generals count missiles, and in Ulan Bator and on the Ussuri the soldiers count the Chinese. The decade begins."
 COLDWAR_SOVR.1.t: "The Collective Leadership"
 COLDWAR_SOVR.100.a: "We accept."
 COLDWAR_SOVR.100.b: "We decline."
 COLDWAR_SOVR.100.d: "A five-year grain contract outside the American embargo. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.100.t: "An Offer from Moscow: No Bread from Washington"
 COLDWAR_SOVR.101.a: "We accept."
 COLDWAR_SOVR.101.b: "We decline."
 COLDWAR_SOVR.101.d: "Credits for complete plants, repaid in gas and chemicals. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.101.t: "An Offer from Moscow: Turnkey Plants from the West"
 COLDWAR_SOVR.102.a: "We accept."
 COLDWAR_SOVR.102.b: "We decline."
 COLDWAR_SOVR.102.d: "The polemics end, Soviet specialists return to the unfinished Chinese plants. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.102.t: "An Offer from Moscow: Reconciliation with Peking"
 COLDWAR_SOVR.103.a: "We accept."
 COLDWAR_SOVR.103.b: "We decline."
 COLDWAR_SOVR.103.d: "Licence production of the T-72 at Labedy and Martin. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.103.t: "An Offer from Moscow: The T-72 for the Allies"
 COLDWAR_SOVR.104.a: "We accept."
 COLDWAR_SOVR.104.b: "We decline."
 COLDWAR_SOVR.104.d: "A joint optics and electronics complex of LOMO, Carl Zeiss Jena and Robotron. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.104.t: "An Offer from Moscow: Interbranch Science Complexes"
 COLDWAR_SOVR.105.a: "We accept."
 COLDWAR_SOVR.105.b: "We decline."
 COLDWAR_SOVR.105.d: "Jet fighters and instructors for the Sandinista air force. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.105.t: "An Offer from Moscow: MiGs for Managua"
 COLDWAR_SOVR.106.a: "We accept."
 COLDWAR_SOVR.106.b: "We decline."
 COLDWAR_SOVR.106.d: "Resume talks on space and nuclear arms in Geneva. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.106.t: "An Offer from Moscow: Back to the Geneva Table"
 COLDWAR_SOVR.107.a: "We accept."
 COLDWAR_SOVR.107.b: "We decline."
 COLDWAR_SOVR.107.d: "Halve strategic arms now and abolish them within ten years, if the space shield stays in the laboratory. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.107.t: "An Offer from Moscow: Two Days in Reykjavik"
 COLDWAR_SOVR.108.a: "We accept."
 COLDWAR_SOVR.108.b: "We decline."
 COLDWAR_SOVR.108.d: "Normal relations between the two parties and states after thirty years. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.108.t: "An Offer from Moscow: The Beijing Visit"
 COLDWAR_SOVR.109.a: "We accept."
 COLDWAR_SOVR.109.b: "We decline."
 COLDWAR_SOVR.109.d: "Joint ventures with majority foreign shares in the free economic zone of Nakhodka. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.109.t: "An Offer from Moscow: Land to the Families"
 COLDWAR_SOVR.110.a: "We accept."
 COLDWAR_SOVR.110.b: "We decline."
 COLDWAR_SOVR.110.d: "A stabilisation credit for the rouble in exchange for a common Union market open to Western firms. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.110.t: "An Offer from Moscow: The Five Hundred Days"
 COLDWAR_SOVR.111.a: "We accept."
 COLDWAR_SOVR.111.b: "We decline."
 COLDWAR_SOVR.111.d: "Moscow backs a new First Secretary in Berlin: oil and credit guarantees in return for an end to Ulbricht's own line. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.111.t: "An Offer from Moscow: Ulbricht's Fall"
 COLDWAR_SOVR.112.a: "We accept."
 COLDWAR_SOVR.112.b: "We decline."
 COLDWAR_SOVR.112.d: "Sugar bought at several times the world price, Soviet oil below it; Cuba joins Comecon; port calls at Cienfuegos and Havana. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.112.t: "An Offer from Moscow: The Havana Partnership"
 COLDWAR_SOVR.113.a: "We accept."
 COLDWAR_SOVR.113.b: "We decline."
 COLDWAR_SOVR.113.d: "Comecon membership, aid and oil, and a treaty against China, in exchange for a Soviet naval and air base at Cam Ranh. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.113.t: "An Offer from Moscow: The Cam Ranh Agreement"
 COLDWAR_SOVR.114.a: "We accept."
 COLDWAR_SOVR.114.b: "We decline."
 COLDWAR_SOVR.114.d: "A joint Soviet-Mongolian copper and molybdenum combine at Erdenet, Soviet credits and engineers, Mongolian ore for Soviet smelters. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.114.t: "An Offer from Moscow: The Erdenet Combine"
 COLDWAR_SOVR.115.a: "We accept."
 COLDWAR_SOVR.115.b: "We decline."
 COLDWAR_SOVR.115.d: "Soviet, Czechoslovak and East German divisions enter under the Fraternal Assistance rules: Poland's Unrest -10 and a safe crackdown for 180 days; Moscow pays its share. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.115.t: "An Offer from Moscow: Fraternal Assistance for Warsaw"
 COLDWAR_SOVR.116.a: "We accept."
 COLDWAR_SOVR.116.b: "We decline."
 COLDWAR_SOVR.116.d: "Moscow backs martial law by Polish hands: credits, fuel and grain for the Military Council of National Salvation. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.116.t: "An Offer from Moscow: A Polish Solution"
 COLDWAR_SOVR.117.a: "We accept."
 COLDWAR_SOVR.117.b: "We decline."
 COLDWAR_SOVR.117.d: "Credits and market access in exchange for opening Soviet markets. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.117.t: "An Offer from Moscow: The Western Credit Lines"
 COLDWAR_SOVR.118.a: "We accept."
 COLDWAR_SOVR.118.b: "We decline."
 COLDWAR_SOVR.118.d: "Party and trade partnership with the social democratic governments of Europe. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.118.t: "An Offer from Moscow: The Socialist International"
 COLDWAR_SOVR.119.a: "We accept."
 COLDWAR_SOVR.119.b: "We decline."
 COLDWAR_SOVR.119.d: "Joint ventures: Western capital and machines for Soviet plants. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.119.t: "An Offer from Moscow: Joint Ventures with the West"
 COLDWAR_SOVR.120.a: "We accept."
 COLDWAR_SOVR.120.b: "We decline."
 COLDWAR_SOVR.120.d: "Mutual arms freeze while the junta restores order. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.120.t: "An Offer from Moscow: A Truce with the West"
 COLDWAR_SOVR.121.a: "We accept."
 COLDWAR_SOVR.121.b: "We decline."
 COLDWAR_SOVR.121.d: "A permanent servicing base for Soviet submarines and surface ships in the bay of Cienfuegos, with Soviet protection for Cuba. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.121.t: "An Offer from Moscow: The Cienfuegos Base"
 COLDWAR_SOVR.122.a: "We accept."
 COLDWAR_SOVR.122.b: "We decline."
 COLDWAR_SOVR.122.d: "Treaty of friendship, good-neighbourliness and cooperation with a clause on military assistance. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.122.t: "An Offer from Moscow: Friendship with Kabul"
 COLDWAR_SOVR.123.a: "We accept."
 COLDWAR_SOVR.123.b: "We decline."
 COLDWAR_SOVR.123.d: "Renunciation of force and recognition of the post-war borders, the Oder-Neisse line included. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.123.t: "An Offer from Moscow: The Moscow Treaty"
 COLDWAR_SOVR.124.a: "We accept."
 COLDWAR_SOVR.124.b: "We decline."
 COLDWAR_SOVR.124.d: "Interim agreement on strategic launchers and the ABM Treaty; if Washington accepts, The Burden of Parity becomes Arms Control Relief. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.124.t: "An Offer from Moscow: SALT I"
 COLDWAR_SOVR.125.a: "We accept."
 COLDWAR_SOVR.125.b: "We decline."
 COLDWAR_SOVR.125.d: "Large-diameter pipes on credit, repaid in Siberian gas over twenty years. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.125.t: "An Offer from Moscow: Gas for Pipes"
 COLDWAR_SOVR.126.a: "We accept."
 COLDWAR_SOVR.126.b: "We decline."
 COLDWAR_SOVR.126.d: "Inviolable borders in Europe in exchange for the basket of human rights and contacts. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.126.t: "An Offer from Moscow: The Helsinki Final Act"
 COLDWAR_SOVR.127.a: "We accept."
 COLDWAR_SOVR.127.b: "We decline."
 COLDWAR_SOVR.127.d: "Equal ceilings of 2,400 strategic launchers for both sides, as agreed at Vladivostok. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.127.t: "An Offer from Moscow: SALT II"
 COLDWAR_SOVR.128.a: "We accept."
 COLDWAR_SOVR.128.b: "We decline."
 COLDWAR_SOVR.128.d: "A pact for collective security in Asia against any aggressor, named or not; every partner who signs strengthens our eastern flank. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.128.t: "An Offer from Moscow: Asian Collective Security"
 COLDWAR_SOVR.129.a: "We accept."
 COLDWAR_SOVR.129.b: "We decline."
 COLDWAR_SOVR.129.d: "Twenty years of peace, friendship and cooperation: MiG licences, steel mills and a friend in the Security Council. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.129.t: "An Offer from Moscow: The Indo-Soviet Treaty"
 COLDWAR_SOVR.130.a: "We accept."
 COLDWAR_SOVR.130.b: "We decline."
 COLDWAR_SOVR.130.d: "Treaties of friendship and cooperation: Soviet arms and advisers, Arab oil on credit. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.130.t: "An Offer from Moscow: Friends in the Arab East"
 COLDWAR_SOVR.131.a: "We accept."
 COLDWAR_SOVR.131.b: "We decline."
 COLDWAR_SOVR.131.d: "Abolition of all intermediate-range missiles on both sides, with inspectors at the factories. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.131.t: "An Offer from Moscow: The INF Treaty"
 COLDWAR_SOVR.132.a: "We accept."
 COLDWAR_SOVR.132.b: "We decline."
 COLDWAR_SOVR.132.d: "Troop cuts on the border, withdrawal from Mongolia, talks on the river line; only if Beijing accepts is The Ussuri Frontier removed. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.132.t: "An Offer from Moscow: Normalisation with Beijing"
 COLDWAR_SOVR.133.a: "We accept."
 COLDWAR_SOVR.133.b: "We decline."
 COLDWAR_SOVR.133.d: "Tanks, MiGs and advisers for Tripoli and Damascus, paid in oil and hard currency; port calls for the Eskadra. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.133.t: "An Offer from Moscow: The Steadfastness Front"
 COLDWAR_SOVR.134.a: "We accept."
 COLDWAR_SOVR.134.b: "We decline."
 COLDWAR_SOVR.134.d: "Arms by way of Havana, advisers, oil and credits for Managua. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.134.t: "An Offer from Moscow: Revolution in the Caribbean"
 COLDWAR_SOVR.135.a: "We accept."
 COLDWAR_SOVR.135.b: "We decline."
 COLDWAR_SOVR.135.d: "Sign the Union Treaty: a common state with shared defence, currency and foreign policy, and full sovereignty at home; every remaining republic decides for itself. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.135.t: "An Offer from Moscow: Signing the Union Treaty"
 COLDWAR_SOVR.136.a: "We accept."
 COLDWAR_SOVR.136.b: "We decline."
 COLDWAR_SOVR.136.d: "A Commonwealth of Independent States: open borders, joint command of the strategic forces, a common rouble zone. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.136.t: "An Offer from Moscow: The Belovezha Accords"
 COLDWAR_SOVR.137.a: "We accept."
 COLDWAR_SOVR.137.b: "We decline."
 COLDWAR_SOVR.137.d: "The strategic weapons go to Moscow, the Black Sea Fleet is divided, Russia takes over the Soviet debt, the embassies and the Security Council seat. Moscow pays its own share; we decide whether to sign."
 COLDWAR_SOVR.137.t: "An Offer from Moscow: The Soviet Inheritance"
 COLDWAR_SOVR.2.a: "The war goes on."
 COLDWAR_SOVR.2.d: "The coffins come home sealed, the funerals are quiet, and the official reason is always the same: died fulfilling his internationalist duty. Every month of the war without the support of the people makes the kitchens angrier."
 COLDWAR_SOVR.2.t: "Zinc Coffins"
 COLDWAR_SOVR.20.a: "The revolution is armed."
 COLDWAR_SOVR.20.d: "A Soviet convoy has crossed the Amu Darya with tanks, helicopters and fuel for our army."
 COLDWAR_SOVR.20.t: "Soviet Arms for Kabul"
 COLDWAR_SOVR.200.a: "We accept the seat."
 COLDWAR_SOVR.200.b: "We prefer to stay out of Moscow's quarrels."
 COLDWAR_SOVR.200.d: "A telegram from the General Department: the Central Committee proposes that the First Secretary of our republic takes a seat in the Politburo as a full member. A seat brings a vote at every plenum, and a closer leash to the General Line."
 COLDWAR_SOVR.200.t: "Moscow Invites Us to the Politburo"
 COLDWAR_SOVR.201.a: "We send a new man to Moscow."
 COLDWAR_SOVR.201.b: "Our republic chooses its own cadres."
 COLDWAR_SOVR.201.d: "The Central Committee is dissatisfied with the man our republic sends to the Politburo and expects us to replace him. Accepting keeps the peace with Moscow; refusing keeps our own cadres, and Moscow keeps its file on us."
 COLDWAR_SOVR.201.t: "Moscow Demands a New Man"
 COLDWAR_SOVR.202.a: "Our seat votes with the General Secretary."
 COLDWAR_SOVR.202.b: "Our seat votes as our republic needs."
 COLDWAR_SOVR.202.d: "The General Secretary wants to know where our republic stands. If our seat backs his line, Moscow will remember it when the plan is shared out; if not, it will remember that too."
 COLDWAR_SOVR.202.t: "Moscow Asks for Our Vote"
 COLDWAR_SOVR.203.a: "We accept the seat."
 COLDWAR_SOVR.203.b: "We prefer to stay out of Moscow's quarrels."
 COLDWAR_SOVR.203.d: "A telegram from the General Department: the Central Committee proposes that the First Secretary of our republic takes a seat in the Politburo as a full member. A seat brings a vote at every plenum, and a closer leash to the General Line."
 COLDWAR_SOVR.203.t: "Moscow Invites Us to the Politburo"
 COLDWAR_SOVR.204.a: "We accept the seat."
 COLDWAR_SOVR.204.b: "We prefer to stay out of Moscow's quarrels."
 COLDWAR_SOVR.204.d: "A telegram from the General Department: the Central Committee proposes that the First Secretary of our republic takes a seat in the Politburo as a full member. A seat brings a vote at every plenum, and a closer leash to the General Line."
 COLDWAR_SOVR.204.t: "Moscow Invites Us to the Politburo"
 COLDWAR_SOVR.205.a: "We send a new man to Moscow."
 COLDWAR_SOVR.205.b: "Our republic chooses its own cadres."
 COLDWAR_SOVR.205.d: "The Central Committee is dissatisfied with the man our republic sends to the Politburo and expects us to replace him. Accepting keeps the peace with Moscow; refusing keeps our own cadres, and Moscow keeps its file on us."
 COLDWAR_SOVR.205.t: "Moscow Demands a New Man"
 COLDWAR_SOVR.206.a: "We send a new man to Moscow."
 COLDWAR_SOVR.206.b: "Our republic chooses its own cadres."
 COLDWAR_SOVR.206.d: "The Central Committee is dissatisfied with the man our republic sends to the Politburo and expects us to replace him. Accepting keeps the peace with Moscow; refusing keeps our own cadres, and Moscow keeps its file on us."
 COLDWAR_SOVR.206.t: "Moscow Demands a New Man"
 COLDWAR_SOVR.207.a: "We send a new man to Moscow."
 COLDWAR_SOVR.207.b: "Our republic chooses its own cadres."
 COLDWAR_SOVR.207.d: "The Central Committee is dissatisfied with the man our republic sends to the Politburo and expects us to replace him. Accepting keeps the peace with Moscow; refusing keeps our own cadres, and Moscow keeps its file on us."
 COLDWAR_SOVR.207.t: "Moscow Demands a New Man"
 COLDWAR_SOVR.208.a: "We accept the seat."
 COLDWAR_SOVR.208.b: "We prefer to stay out of Moscow's quarrels."
 COLDWAR_SOVR.208.d: "A telegram from the General Department: the Central Committee proposes that the First Secretary of our republic takes a seat in the Politburo as a candidate member. A seat brings a vote at every plenum, and a closer leash to the General Line."
 COLDWAR_SOVR.208.t: "Moscow Invites Us to the Politburo"
 COLDWAR_SOVR.21.a: "A national hero."
 COLDWAR_SOVR.21.d: "One of our pilots is aboard the Soviet station. The whole country follows him on television; the Soviet embassy hands out his photograph."
 COLDWAR_SOVR.21.t: "Our Cosmonaut in Orbit"
 COLDWAR_SOVR.22.a: "We accept military administration."
 COLDWAR_SOVR.22.b: "We refuse."
 COLDWAR_SOVR.22.d: "The Union government demands military administration for our republic. Accepting hands the streets to the army; refusing defies Moscow openly."
 COLDWAR_SOVR.22.t: "Moscow Demands Martial Law"
 COLDWAR_SOVR.23.a: "We sign the compact."
 COLDWAR_SOVR.23.b: "We want more than Moscow offers."
 COLDWAR_SOVR.23.d: "Moscow offers our republic a bilateral compact: more rights over our economy and language in exchange for staying in the Union."
 COLDWAR_SOVR.23.t: "A Compact with Moscow"
 COLDWAR_SOVR.24.a: "We sign the Union Treaty."
 COLDWAR_SOVR.24.b: "We do not sign."
 COLDWAR_SOVR.24.d: "The draft of a renewed Union of Soviet Sovereign Republics lies on the table of our Supreme Soviet."
 COLDWAR_SOVR.24.t: "The New Union Treaty"
 COLDWAR_SOVR.3.a: "Ask Moscow for Soviet troops."
 COLDWAR_SOVR.3.b: "We fight our own war."
 COLDWAR_SOVR.3.d: "The revolution is in danger: garrisons mutiny, the provinces burn and the army cannot hold the roads. The Revolutionary Council can ask the Soviet Union for divisions. Asking binds us to Moscow; not asking may cost us the revolution."
 COLDWAR_SOVR.3.t: "We Ask Moscow for Troops"
 COLDWAR_SOVR.300.a: "Good."
 COLDWAR_SOVR.300.d: "Our partner has accepted the offer of No Bread from Washington."
 COLDWAR_SOVR.300.t: "No Bread from Washington: Accepted"
 COLDWAR_SOVR.301.a: "Good."
 COLDWAR_SOVR.301.d: "Our partner has accepted the offer of Turnkey Plants from the West."
 COLDWAR_SOVR.301.t: "Turnkey Plants from the West: Accepted"
 COLDWAR_SOVR.302.a: "Good."
 COLDWAR_SOVR.302.d: "Our partner has accepted the offer of Reconciliation with Peking."
 COLDWAR_SOVR.302.t: "Reconciliation with Peking: Accepted"
 COLDWAR_SOVR.303.a: "Good."
 COLDWAR_SOVR.303.d: "Our partner has accepted the offer of The T-72 for the Allies."
 COLDWAR_SOVR.303.t: "The T-72 for the Allies: Accepted"
 COLDWAR_SOVR.304.a: "Good."
 COLDWAR_SOVR.304.d: "Our partner has accepted the offer of Interbranch Science Complexes."
 COLDWAR_SOVR.304.t: "Interbranch Science Complexes: Accepted"
 COLDWAR_SOVR.305.a: "Good."
 COLDWAR_SOVR.305.d: "Our partner has accepted the offer of MiGs for Managua."
 COLDWAR_SOVR.305.t: "MiGs for Managua: Accepted"
 COLDWAR_SOVR.306.a: "Good."
 COLDWAR_SOVR.306.d: "Our partner has accepted the offer of Back to the Geneva Table."
 COLDWAR_SOVR.306.t: "Back to the Geneva Table: Accepted"
 COLDWAR_SOVR.307.a: "Good."
 COLDWAR_SOVR.307.d: "Our partner has accepted the offer of Two Days in Reykjavik."
 COLDWAR_SOVR.307.t: "Two Days in Reykjavik: Accepted"
 COLDWAR_SOVR.308.a: "Good."
 COLDWAR_SOVR.308.d: "Our partner has accepted the offer of The Beijing Visit."
 COLDWAR_SOVR.308.t: "The Beijing Visit: Accepted"
 COLDWAR_SOVR.309.a: "Good."
 COLDWAR_SOVR.309.d: "Our partner has accepted the offer of Land to the Families."
 COLDWAR_SOVR.309.t: "Land to the Families: Accepted"
 COLDWAR_SOVR.310.a: "Good."
