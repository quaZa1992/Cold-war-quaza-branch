 COLDWAR_SOVR_doctrine_cheap_tt: "Changing the Eastern Bloc doctrine costs §Ghalf§! as much."
 COLDWAR_SOVR_emergency_category: "The State of Emergency"
 COLDWAR_SOVR_emergency_category_desc: "Curfew, press control and a strike ban in the cities."
 COLDWAR_SOVR_emp_category: "No Retreat from the Elbe"
 COLDWAR_SOVR_emp_category_desc: "Fraternal Assistance stays on the table for Berlin, Prague and Warsaw."
 COLDWAR_SOVR_event_intro_tt: "January 1970: The Troika"
 COLDWAR_SOVR_event_zinc_coffins_tt: "Zinc Coffins: the People camp grows every month the war lasts without war support"
 COLDWAR_SOVR_fly_cosmonaut: "A Cosmonaut from [FROM.GetName]"
 COLDWAR_SOVR_fly_cosmonaut_desc: "A guest cosmonaut flies to our station. In his country he becomes a hero, and so do we."
 COLDWAR_SOVR_forgery: "A Forgery for the Western Press"
 COLDWAR_SOVR_forgery_desc: "A document that never existed appears in a newspaper that does exist. Our influence in [FROM.GetName] grows; the diplomats deny everything."
 COLDWAR_SOVR_fortify_border: "Fortify the Amu Darya"
 COLDWAR_SOVR_fortify_border_desc: "Watchtowers, minefields and a new border detachment in Termez. The mullahs across the river watch."
 COLDWAR_SOVR_gosplan_audit_desc: "Inspectors check the reports of the ministries. Some figures turn out to be fiction."
 COLDWAR_SOVR_grain_imports_tt: "Opens the §Ygrain import§! decisions."
 COLDWAR_SOVR_guarantee_brothers: "Reassure the Fraternal Parties"
 COLDWAR_SOVR_guarantee_brothers_desc: "A letter from the General Secretary to every first secretary of the Pact: Moscow stands by them."
 COLDWAR_SOVR_iib_credit: "IIB Credit for a Joint Project"
 COLDWAR_SOVR_iib_credit_desc: "The bank in Moscow lends in transferable roubles for a plant in a fraternal country. The Union pays less, the partner pays later."
 COLDWAR_SOVR_interkosmos_category: "Interkosmos"
 COLDWAR_SOVR_interkosmos_category_desc: "A seat on the station for a cosmonaut of a fraternal or friendly country."
 COLDWAR_SOVR_karabakh_category: "Karabakh"
 COLDWAR_SOVR_karabakh_category_desc: "Armenians and Azerbaijanis fight over the mountain oblast; Moscow must answer."
 COLDWAR_SOVR_karabakh_commission: "A Special Administration for Karabakh"
 COLDWAR_SOVR_karabakh_commission_desc: "Moscow takes the oblast under direct administration. Yerevan and Baku both protest."
 COLDWAR_SOVR_karabakh_troops: "Interior Troops to Stepanakert"
 COLDWAR_SOVR_karabakh_troops_desc: "Interior troops separate the villages. Nobody is satisfied, fewer are dead."
 COLDWAR_SOVR_kgb_category: "KGB Operations"
 COLDWAR_SOVR_kgb_category_desc: "The Fifth Directorate watches the intelligentsia, the believers and the nationalists."
 COLDWAR_SOVR_liberation_fronts_category: "Liberation Fronts"
 COLDWAR_SOVR_liberation_fronts_category_desc: "Arms, advisers and credits for movements fighting governments allied to the Americans."
 COLDWAR_SOVR_martial_law_category: "Martial Law in the Republics"
 COLDWAR_SOVR_martial_law_category_desc: "Military rule in a republic that no longer obeys."
 COLDWAR_SOVR_martial_law_region_category: "Martial Law in a Region"
 COLDWAR_SOVR_martial_law_region_category_desc: "Troops in a region where bread riots have broken out."
 COLDWAR_SOVR_martial_law_republic_desc: "We ask the republic to accept military administration. An AI republic complies; a player republic answers in its own event."
 COLDWAR_SOVR_miners_deal: "A Deal with the Miners"
 COLDWAR_SOVR_miners_deal_desc: "Soap, sugar and a wage rise for the pits. The coal runs again; the budget does not."
 COLDWAR_SOVR_outbid: "Outbid Beijing in [FROM.GetName]"
 COLDWAR_SOVR_outbid_beijing_category: "Outbid Beijing"
 COLDWAR_SOVR_outbid_beijing_category_desc: "Wherever Mao offers rifles, Moscow offers tanks, credits and a seat at the table."
 COLDWAR_SOVR_outbid_desc: "A credit, a delegation and a better package than the Chinese can afford."
 COLDWAR_SOVR_peace_campaign_desc: "Through the World Peace Council the Union pays for buses, posters and congresses. The marchers never see the money."
 COLDWAR_SOVR_pressure_m10_tt: "Eastern Bloc Pressure: §G-10§!"
 COLDWAR_SOVR_pressure_m12_tt: "Eastern Bloc Pressure: §G-12§!"
 COLDWAR_SOVR_pressure_m24_tt: "Eastern Bloc Pressure: §G-24§!"
 COLDWAR_SOVR_pressure_m30_tt: "Eastern Bloc Pressure: §G-30§!"
 COLDWAR_SOVR_prophylaxis: "Prophylactic Talks"
 COLDWAR_SOVR_prophylaxis_desc: "A friendly conversation in a grey office. Most people understand."
 COLDWAR_SOVR_quota_80_tt: "Comecon oil delivery quota: §Y80 %§!"
 COLDWAR_SOVR_quota_90_tt: "Comecon oil delivery quota: §Y90 %§!"
 COLDWAR_SOVR_region_troops: "Troops to the Riot Region"
 COLDWAR_SOVR_region_troops_desc: "The army takes over the oblast for a month. Calm returns at gunpoint."
 COLDWAR_SOVR_republic_compacts_category: "Compacts with the Republics"
 COLDWAR_SOVR_republic_compacts_category_desc: "Bilateral treaties with republics that have declared their sovereignty."
 COLDWAR_SOVR_rotate_40th: "Rotate the 40th Army"
 COLDWAR_SOVR_rotate_40th_desc: "Fresh regiments replace the worn ones. The army learns, the veterans come home, and the coffins go north."
 COLDWAR_SOVR_samizdat_raids: "Search the Samizdat Circles"
 COLDWAR_SOVR_samizdat_raids_desc: "Typewriters are confiscated, carbon copies burned. The texts reappear in a month."
 COLDWAR_SOVR_soyuz_works_desc: "More pipe, more brigades from the fraternal countries, a faster line from Orenburg to the western border."
 COLDWAR_SOVR_state_harju: "A Special Economic Region"
 COLDWAR_SOVR_storm_quarter_desc: "Every plant works Saturdays until the quarterly figures are met. The plan is saved, the machines are not."
 COLDWAR_SOVR_strike_ban: "Ban the Strikes"
 COLDWAR_SOVR_strike_ban_desc: "Strike committees are dissolved by decree. The mines run, sullenly."
 COLDWAR_SOVR_strike_committees_category: "The Strike Committees"
 COLDWAR_SOVR_strike_committees_category_desc: "The miners of the Kuzbass and the Donbass have stopped work."
 COLDWAR_SOVR_support_ally: "Support [FROM.GetName]"
 COLDWAR_SOVR_support_ally_desc: "Oil tankers, arms and advisers keep a friendly government in power. The bill goes to the Union budget."
 COLDWAR_SOVR_tanks_in_streets: "Tanks on the Boulevards"
 COLDWAR_SOVR_tanks_in_streets_desc: "Armour in the capitals for a week. Pressure falls; nobody believes it will last."
