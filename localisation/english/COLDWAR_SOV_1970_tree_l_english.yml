 COLDWAR_SOVR_the_union_category_desc: "The crisis staff of the Union."
 COLDWAR_SOVR_treaty_offer: "Offer the Union Treaty to [FROM.GetName]"
 COLDWAR_SOVR_treaty_offer_desc: "The draft of a renewed federation goes to the republic; it decides in its own event."
 COLDWAR_SOVR_union_category: "The New Union Treaty"
 COLDWAR_SOVR_union_category_desc: "Negotiations with each republic on a new Union treaty."
 COLDWAR_SOVR_union_ministries_category: "The Union Ministries"
 COLDWAR_SOVR_union_ministries_category_desc: "A strong centre runs the big plants from Moscow."
