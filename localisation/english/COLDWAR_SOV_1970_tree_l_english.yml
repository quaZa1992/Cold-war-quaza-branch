 COLDWAR_SOVR_dec_committee_tools_tt: "§YOpens The Committee's Tools: costly repeatable decisions that lower Pressure§!"
 COLDWAR_SOVR_dec_emergency_tt: "§YOpens the state of emergency decisions (curfew, press control, strike ban)§!"
 COLDWAR_SOVR_dec_emp_tt: "§YFraternal Assistance stays on the table for Berlin, Prague and Warsaw§!"
 COLDWAR_SOVR_dec_five_year_plan_tt: "§YOpens the Five-Year Plan decisions (Gosplan orders by priority)§!"
 COLDWAR_SOVR_dec_fraternal_assistance_tt: "§YGranting Fraternal Assistance costs 50 % less§!"
 COLDWAR_SOVR_dec_interkosmos_tt: "§YFly a cosmonaut of a fraternal or friendly country to the station: influence and opinion in that country§!"
 COLDWAR_SOVR_dec_karabakh_tt: "§YOpens the Karabakh measures§!"
 COLDWAR_SOVR_dec_kgb_tt: "§YOpens KGB operations against dissent: prophylactic talks, searches of samizdat circles, cases against the editors§!"
 COLDWAR_SOVR_dec_liberation_fronts_tt: "§YOpens support decisions for liberation movements in any country in civil war against an American ally§!"
 COLDWAR_SOVR_dec_martial_law_region_tt: "§YOpens Martial Law in a region§!"
 COLDWAR_SOVR_dec_martial_law_tt: "§YOpens Martial Law in each AI republic; player republics answer in their own events§!"
 COLDWAR_SOVR_dec_outbid_beijing_tt: "§YOpens decisions to win over parties and movements courted by Beijing, paid from the treasury§!"
 COLDWAR_SOVR_dec_party_congress_tt: "§YConvene a Party Congress costs 50 political power less§!"
 COLDWAR_SOVR_dec_politburo_tt: "§YFind the source of the rumour§!"
 COLDWAR_SOVR_dec_republic_compacts_tt: "§YOpens bilateral compacts with the republics§!"
 COLDWAR_SOVR_dec_restore_socialist_order_tt: "§YRestore Socialist Order costs 50 % less§!"
