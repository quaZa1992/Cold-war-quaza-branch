l_english:
 # IMPERIA CW — Cold War: Spain 1970 succession and constitutional government.
 COLDWAR_SPR_government_continuity_tt:0 "The Continuity Cabinet governs Spain."
 COLDWAR_SPR_government_falange_tt:0 "The Falangist Government governs Spain."
 COLDWAR_SPR_government_crown_tt:0 "The Royal Government governs Spain."
 COLDWAR_SPR_government_ucd_tt:0 "The Union of the Centre governs Spain."
 COLDWAR_SPR_government_ap_pp_tt:0 "The Popular Alliance / PP governs Spain."
 COLDWAR_SPR_government_cds_tt:0 "The Liberal / CDS Cabinet governs Spain."
 COLDWAR_SPR_government_psoe_tt:0 "The Socialist Government governs Spain."
 COLDWAR_SPR_government_pce_iu_tt:0 "The Communist / IU Cabinet governs Spain."
 COLDWAR_SPR_capacity_early:0 "Ageing Leadership"
 COLDWAR_SPR_capacity_early_desc:0 "The administration must conduct public business while the head of state is increasingly unable to intervene."
 COLDWAR_SPR_capacity_late:0 "Diminishing Executive Capacity"
 COLDWAR_SPR_capacity_late_desc:0 "The administration must conduct public business while the head of state is increasingly unable to intervene."
 COLDWAR_SPR_capacity_critical:0 "A Head of State Incapacitated"
 COLDWAR_SPR_capacity_critical_desc:0 "The administration must conduct public business while the head of state is increasingly unable to intervene."
 COLDWAR_SPR_capacity_late_delegated:0 "Delegated Executive Authority"
 COLDWAR_SPR_capacity_late_delegated_desc:0 "The administration must conduct public business while the head of state is increasingly unable to intervene."
 COLDWAR_SPR_capacity_critical_delegated:0 "A Delegated Headship"
 COLDWAR_SPR_capacity_critical_delegated_desc:0 "The administration must conduct public business while the head of state is increasingly unable to intervene."
 COLDWAR_SPR_personal_command_spirit:0 "Personal Command"
 COLDWAR_SPR_personal_command_spirit_desc:0 "Cabinet authority continues to depend on the personal intervention of the head of state."
 COLDWAR_SPR_succession_disruption:0 "Disrupted Succession"
 COLDWAR_SPR_succession_disruption_desc:0 "Unresolved instructions impede the administration during the transfer of authority."
 COLDWAR_SPR_medical_bulletin:0 "An Official Medical Bulletin"
 COLDWAR_SPR_medical_bulletin_desc:0 "Publication of an official bulletin has temporarily reduced uncertainty."
 COLDWAR_SPR_republic_constituent_period:0 "The Constituent Period"
 COLDWAR_SPR_republic_constituent_period_desc:0 "The elected Cortes is negotiating the transfer of the headship of state."
 COLDWAR_SPR_legal_fundamental:0 "The Fundamental Laws"
 COLDWAR_SPR_legal_fundamental_desc:0 "The continuity camp proposes that the legal order survive its author. The Cortes and the Movement will remain the recognised channels of representation, excluding competitive national elections."
 COLDWAR_SPR_legal_royal:0 "The Crown Governs"
 COLDWAR_SPR_legal_royal_desc:0 "Royal advisers argue that the crown must exercise the executive power inherited under the succession laws. A consultative Cortes can broaden support while the king retains the appointment of government."
 COLDWAR_SPR_legal_parliamentary:0 "Reform Through Law"
 COLDWAR_SPR_legal_parliamentary_desc:0 "Reformers can use the institutions of the regime to dismantle their monopoly. A reform law, a public vote and competitive elections offer an orderly route to a new parliament, provided the coercive institutions accept the process."
 COLDWAR_SPR_preparedness_tt:0 "Succession Preparedness: $RIGHT|+=0$"
 COLDWAR_SPR_succession_preparations_effect_tt:0 "Unlock preparations for the transfer of authority. Capacity and Succession Preparedness range from 0 to 100."
 COLDWAR_SPR_delegated_cabinet_effect_tt:0 "Delegation reduces the late-stage executive penalty by §G5 percentage points§!."
 COLDWAR_SPR_personal_command_effect_tt:0 "Personal command lasts while Franco remains in office."
 COLDWAR_SPR_continuity_protocol_effect_tt:0 "The administrative stability loss in a presidential vacancy is reduced from §R5%§! to §R2%§!."
 COLDWAR_SPR_interregnum_plan_effect_tt:0 "Agree procedures for the Council of Regency."
 COLDWAR_SPR_royal_briefing_effect_tt:0 "The designated successor may accept acting duties during serious illness."
 COLDWAR_SPR_settlement_talks_effect_tt:0 "Open negotiations on the legal settlement. Succession stability loss: §R5%§! with preparedness 80+, §R10%§! with 50–79, otherwise §R20%§! and Political Power gain §R-10%§! for §Y180 days§!."
 COLDWAR_SPR_continuity_settlement_effect_tt:0 "The Fundamental Laws remain in force. National elections remain suspended."
 COLDWAR_SPR_royal_settlement_effect_tt:0 "The crown appoints and directs the government. National elections remain suspended."
 COLDWAR_SPR_political_reform_effect_tt:0 "Begin the reform agreement: legal guarantees, a referendum, competitive elections and a constituent Cortes."
 COLDWAR_SPR_review_settlement_effect_tt:0 "A subsequent governing mandate may convene constitutional revision for §Y100 Political Power§! and §Y60 days§!. The revised constitutional package replaces its predecessor."
 COLDWAR_SPR_parliamentary_crown_effect_tt:0 "Ratify parliamentary monarchy under representative government."
 COLDWAR_SPR_republic_constituent_vote_effect_tt:0 "Convene the constitutional vote after a §Y180-day§! constituent period."
 COLDWAR_SPR_legal_succession_effect_tt:0 "Publish the lawful handover procedure. Institutional preparation remains voluntary."
 COLDWAR_SPR_carlist_bargain_effect_tt:0 "Negotiate a traditionalist or social-federalist Carlist cabinet agreement. The agreement ends with a change of governing party or a renewed electoral mandate."
 COLDWAR_SPR_carlist_traditionalists_tt:0 "A current cabinet agreement recognises the traditionalist Carlist current."
 COLDWAR_SPR_carlist_social_federalists_tt:0 "A current cabinet agreement recognises the social-federalist Carlist current."
 COLDWAR_SPR_delegate_business_requirements_tt:0 "Franco remains in office; preparations are authorised; Personal Authority has not been adopted. Available once."
 COLDWAR_SPR_delegate_business:0 "Delegate Cabinet Business"
 COLDWAR_SPR_delegate_business_desc:0 "Ministers will conduct routine cabinet business under delegated authority. Succession Preparedness §G+15§!; reduce the late-stage executive penalty by §G5 percentage points§! while Franco remains in office. One use."
 COLDWAR_SPR_brief_prince_requirements_tt:0 "Franco remains in office; The Prince's Briefings have been completed. Available once."
 COLDWAR_SPR_brief_prince:0 "Brief the Designated Successor"
 COLDWAR_SPR_brief_prince_desc:0 "Brief the designated successor on the business of state. Succession Preparedness §G+10§!. One use."
 COLDWAR_SPR_consult_commands_requirements_tt:0 "Franco remains in office; Command Channels or Carrero's Guarantees have been completed. Available once."
 COLDWAR_SPR_consult_commands:0 "Consult the Regional Commands"
 COLDWAR_SPR_consult_commands_desc:0 "The military regions will receive the agreed lawful handover procedure. Succession Preparedness §G+10§!. One use."
 COLDWAR_SPR_issue_bulletin_requirements_tt:0 "A serious or terminal illness has begun; no official medical bulletin is active; no bulletin has yet been issued during this stage."
 COLDWAR_SPR_issue_bulletin:0 "Issue a Medical Bulletin"
 COLDWAR_SPR_issue_bulletin_desc:0 "Publish an official report during serious illness. Succession Preparedness §G+5§!; Stability §G+2%§! for §Y90 days§!. Once during serious illness and once during the terminal crisis."
 COLDWAR_SPR_temporary_delegation_requirements_tt:0 "Franco remains in office after serious illness; capacity is below 30; the prince has been briefed and the legal handover or regency protocol has been agreed. Available once."
 COLDWAR_SPR_temporary_delegation:0 "Temporarily Delegate the Headship"
 COLDWAR_SPR_temporary_delegation_desc:0 "The designated successor assumes acting duties while Franco retains formal headship. Succession Preparedness §G+10§!; reduce the late-stage executive penalty by §G5 percentage points§!. One use."
 COLDWAR_SPR_revise_constitution:0 "Convene Constitutional Revision"
 COLDWAR_SPR_revise_constitution_desc:0 "A new governing mandate may reopen the constitutional pact. The Cortes and the head of state must complete a negotiated revision."
 COLDWAR_SPR_resume_legal_reform:0 "Reconvene Political Reform Talks"
 COLDWAR_SPR_resume_legal_reform_desc:0 "The cabinet may return a rejected reform agreement to negotiations. Ratification still requires a public vote and competitive elections."
 COLDWAR_SPR_negotiate_carlist_agreement:0 "Negotiate a Carlist Cabinet Agreement"
 COLDWAR_SPR_negotiate_carlist_agreement_desc:0 "Representatives of a Carlist current may support the incumbent cabinet under a published agreement. A change of governing party or renewed electoral mandate ends the agreement."
 COLDWAR_SPR_v2_politics.1.t:0 "The Presidency Falls Vacant"
 COLDWAR_SPR_v2_politics.1.d:0 "Carrero Blanco has been killed. The government must preserve its chain of command while the Council of the Realm considers the presidency."
 COLDWAR_SPR_v2_politics.1.a:0 "Apply the continuity protocol."
 COLDWAR_SPR_v2_politics.1.b:0 "Reconstitute the administration."
 COLDWAR_SPR_v2_politics.2.t:0 "A Serious Illness"
 COLDWAR_SPR_v2_politics.2.d:0 "The head of state has been admitted to hospital. The designated successor and ministers are preparing for a possible delegation of authority."
 COLDWAR_SPR_v2_politics.2.a:0 "Keep the administration informed."
 COLDWAR_SPR_v2_politics.3.t:0 "The Final Illness"
 COLDWAR_SPR_v2_politics.3.d:0 "The medical authorities report a critical decline. The Council of Regency and the government must be ready to apply the succession law."
 COLDWAR_SPR_v2_politics.3.a:0 "Maintain the lawful chain of command."
 COLDWAR_SPR_v2_politics.4.t:0 "The Transfer of Authority"
 COLDWAR_SPR_v2_politics.4.d:0 "Franco has died. The institutions must now conduct the affairs of state without his personal arbitration."
 COLDWAR_SPR_v2_politics.4.a:0 "The state continues."
 COLDWAR_SPR_v2_politics.5.t:0 "A New Head of State"
 COLDWAR_SPR_v2_politics.5.d:0 "Franco has relinquished office. The government and the institutions of state must now settle the distribution of authority without his final arbitration."
 COLDWAR_SPR_v2_politics.5.a:0 "Apply the lawful handover."
 COLDWAR_SPR_v2_politics.10.t:0 "The Political Reform Agreement"
 COLDWAR_SPR_v2_politics.10.d:0 "The government proposes legal guarantees for political association and a referendum on competitive representation. The Cortes will be asked to approve an orderly transfer of authority."
 COLDWAR_SPR_v2_politics.10.a:0 "Submit the agreement to a public vote."
 COLDWAR_SPR_v2_politics.10.b:0 "Return the agreement for negotiation."
 COLDWAR_SPR_v2_politics.10.stale:0 "Refer this question to the incumbent cabinet."
 COLDWAR_SPR_v2_politics.11.t:0 "The Reform Referendum"
 COLDWAR_SPR_v2_politics.11.d:0 "The proposed reform is before the electorate. Ratification authorises a competitive election and a constituent Cortes; the form of the headship remains open."
 COLDWAR_SPR_v2_politics.11.a:0 "Ratify reform and call the election."
 COLDWAR_SPR_v2_politics.11.b:0 "Reopen negotiations."
 COLDWAR_SPR_v2_politics.11.stale:0 "Refer this question to the incumbent cabinet."
 COLDWAR_SPR_v2_politics.12.t:0 "The Constituent Cortes"
 COLDWAR_SPR_v2_politics.12.d:0 "The election has returned a government and representatives authorised to settle the constitutional rules. The head of state and the cabinet must now promulgate the agreement."
 COLDWAR_SPR_v2_politics.12.a:0 "Promulgate representative government."
 COLDWAR_SPR_v2_politics.12.stale:0 "Refer this question to the incumbent cabinet."
 COLDWAR_SPR_v2_politics.14.t:0 "A Revised Constitutional Pact"
 COLDWAR_SPR_v2_politics.14.d:0 "Renew the representative pact."
 COLDWAR_SPR_v2_politics.14.a:0 "Refer representative reform to the electorate."
 COLDWAR_SPR_v2_politics.14.b:0 "Adopt executive monarchy."
 COLDWAR_SPR_v2_politics.14.c:0 "Retain the Fundamental Laws."
 COLDWAR_SPR_v2_politics.14.e:0 "Keep the existing settlement."
 COLDWAR_SPR_v2_politics.14.stale:0 "Refer this question to the incumbent cabinet."
 COLDWAR_SPR_v2_politics.16.t:0 "The Republican Constitutional Vote"
 COLDWAR_SPR_v2_politics.16.d:0 "The constituent period has ended. The elected Cortes must ratify the transfer of the headship under the agreed constitutional guarantees."
 COLDWAR_SPR_v2_politics.16.a:0 "Ratify the republic."
 COLDWAR_SPR_v2_politics.16.b:0 "Retain the present headship."
 COLDWAR_SPR_v2_politics.16.stale:0 "Refer this question to the incumbent cabinet."
 COLDWAR_SPR_v2_politics.20.t:0 "The Conservative Cabinet Mandate"
 COLDWAR_SPR_v2_politics.20.d:0 "The conservative parliamentary group must agree the political mandate of its cabinet. The Union of the Centre and Popular Alliance retain distinct leadership and programmes within this outlook."
 COLDWAR_SPR_v2_politics.20.a:0 "A Union of the Centre cabinet."
 COLDWAR_SPR_v2_politics.20.b:0 "A Popular Alliance cabinet."
 COLDWAR_SPR_v2_politics.20.stale:0 "Refer this question to the incumbent cabinet."
 COLDWAR_SPR_v2_politics.30.t:0 "A Carlist Cabinet Agreement"
 COLDWAR_SPR_v2_politics.30.d:0 "Carlist representatives offer support to the incumbent administration. Any agreement recognises their current within the existing political institutions and lasts for this governing mandate."
 COLDWAR_SPR_v2_politics.30.a:0 "Recognise traditionalist support."
 COLDWAR_SPR_v2_politics.30.b:0 "Recognise social-federalist support."
 COLDWAR_SPR_v2_politics.30.c:0 "Govern without a Carlist agreement."
 COLDWAR_SPR_v2_politics.30.stale:0 "Refer this question to the incumbent cabinet."
 COLDWAR_SPR_v2_politics:0 "The State and Its Succession"
 COLDWAR_SPR_v2_politics_desc:0 "The head of state's capacity: §Y[?COLDWAR_SPR_capacity|0]/100§!\nSuccession preparedness: §Y[?COLDWAR_SPR_preparedness|0]/100§!\nPreparations preserve administrative continuity as authority passes between institutions."
