l_english:
 MDCW_EARLY_RAILWAYS:0 "EARLY RAILWAYS"
 mdcw_conventional_track_engineering_1940:0 "Conventional Track"
 mdcw_conventional_track_engineering_1940_desc:0 "Conventional track engineering enables basic railways and an early steam supply train. Railway construction speed increases by 10% and general building repair speed by 2.5%."
 mdcw_hydraulic_track_tamping_1953:0 "Hydraulic Tamping"
 mdcw_hydraulic_track_tamping_1953_desc:0 "Hydraulic track-tamping machinery accelerates track laying and maintenance. Railway construction speed increases by 10%."
 mdcw_continuous_welded_rail_1960:0 "Welded Rail"
 mdcw_continuous_welded_rail_1960_desc:0 "Widespread continuous-welded rail reduces joint maintenance and supports more efficient track renewal. Railway construction speed increases by 10% and general building repair speed by 2.5%."
 mdcw_mechanized_track_renewal_1967:0 "Mechanized Renewal"
 mdcw_mechanized_track_renewal_1967_desc:0 "Mechanized track-renewal trains coordinate removal, placement and alignment. Railway construction speed increases by 15%."
 mdcw_steam_train_equipment_1940:0 "Steam Supply Train"
 mdcw_steam_train_equipment_1940_short:0 "Steam Train"
 mdcw_steam_train_equipment_1940_desc:0 "Conventional steam-hauled supply trains use steel rather than aluminium. They require more industrial production per unit than the later MD train generation."
