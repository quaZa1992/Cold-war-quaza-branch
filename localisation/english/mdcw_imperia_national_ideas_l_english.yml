l_english:
 national_ideas: "National Ideas"
 imp_national_ideas_1: "Our Society"
 imp_national_ideas_2: "Our Economy"
 imp_national_ideas_3: "Our Military"

 imp_ni_3: "Natality Campaigns"
 imp_ni_3_desc: "With state-sponsored incentives and aggressive propaganda, our nation is focused on boosting birth rates to ensure future manpower and economic strength."
 imp_ni_19: "Population Controls"
 imp_ni_19_desc: "Strict legal frameworks regulate family growth to ensure resource sustainability, even at the cost of future manpower."
 imp_ni_20: "Skilled Worker Visas"
 imp_ni_20_desc: "Our immigration policy favors educated and technically skilled foreigners, bolstering our research and industrial sectors."
 imp_ni_25: "Stop the Boats Act"
 imp_ni_25_desc: "A heavily militarized maritime policy deters unauthorized sea arrivals, reducing uncontrolled immigration but at diplomatic cost."
 imp_ni_7: "Refugee Sanctuary"
 imp_ni_7_desc: "Opening our borders to displaced people, we gain manpower and international goodwill, though integration remains a challenge."
 imp_ni_8: "Rural Revitalization"
 imp_ni_8_desc: "Investment in countryside infrastructure and incentives for rural living help reverse urban migration and stabilize food supply chains."
 imp_ni_26: "Patriotic Education"
 imp_ni_26_desc: "Reformed curricula instill national pride and ideological unity among the youth, reducing political drift and increasing stability."
 imp_ni_29: "Mandatory Youth Service"
 imp_ni_29_desc: "All citizens must serve in national or military programs upon coming of age, bolstering reserves and instilling cohesion."
 imp_ni_10: "Censorship Bureaus"
 imp_ni_10_desc: "A centralized agency controls media and suppresses dissent, increasing stability but reducing political freedom."
 imp_ni_31: "Open Political Donations"
 imp_ni_31_desc: "Removing caps on political funding leads to rapid campaign mobilization, but public trust in democracy erodes."
 imp_ni_4: "Universal Basic Income"
 imp_ni_4_desc: "A state-provided income floor reduces unrest and boosts consumer economy, though at a high budgetary cost."
 imp_ni_1: "Free Public Transport"
 imp_ni_1_desc: "By removing fares on public transit, we increase worker productivity and urban cohesion, while reducing dependence on oil."
 imp_ni_24: "Deportation Campaigns"
 imp_ni_24_desc: "Mass expulsions of undocumented or undesired populations create short-term stability gains but spark international outrage."
 imp_ni_33: "Mass Surveillance"
 imp_ni_33_desc: "Omnipresent monitoring deters sedition and boosts counterintelligence, though it may stoke civilian resentment."
 imp_ni_40: "Public Broadcasting Service"
 imp_ni_40_desc: "A state-run media outlet promotes unity and counters foreign propaganda, with a moderate cost in media freedom."
 imp_ni_46: "Integration Programs"
 imp_ni_46_desc: "Policies to integrate immigrants and minorities improve national cohesion and long-term manpower reliability."
 imp_ni_56: "Veterans First"
 imp_ni_56_desc: "A prioritization of veterans for jobs, housing, and benefits boosts stability and military recruitment rates."
 imp_ni_57: "36-Hour Work Week"
 imp_ni_57_desc: "Shortened labor hours improve worker happiness and long-term productivity, but reduce immediate industrial output."
 imp_ni_58: "50-Hour Work Week"
 imp_ni_58_desc: "Extended labor mandates increase factory output and construction speed at the cost of civilian morale and health."
 imp_ni_59: "Sacrifice Society"
 imp_ni_59_desc: "The nation demands total devotion from its people. Social services are scarce, but propaganda glorifies hardship as virtue. In this society, to suffer is to serve—and to serve is to survive."

 imp_ni_28: "National War Bonds"
 imp_ni_28_desc: "Citizens invest directly in the war effort, boosting the economy with patriotic loans and increasing public morale."
 imp_ni_30: "NGO Registration Act"
 imp_ni_30_desc: "A law mandating the registration and regulation of NGOs increases state oversight, reducing foreign influence—but also civil society’s reach."
 imp_ni_15: "Broadband Programs"
 imp_ni_15_desc: "National investment in digital infrastructure accelerates connectivity, research efficiency, and rural modernization."
 imp_ni_5: "National Labour Mobilization"
 imp_ni_5_desc: "A sweeping program to draft civilians into critical industries, drastically increasing output at the cost of individual liberty."
 imp_ni_2: "Clean Energy Transition"
 imp_ni_2_desc: "A decisive shift away from fossil fuels boosts long-term sustainability and energy independence—though early costs bite."
 imp_ni_12: "Carbon Taxes"
 imp_ni_12_desc: "Emissions are taxed to curb industrial carbon output, reshaping the economy toward greener energy, at the expense of some growth."
 imp_ni_6: "Circular Economy"
 imp_ni_6_desc: "A system built on reuse and recycling improves resource efficiency and industrial resilience."
 imp_ni_11: "Sovereign Wealth Fund"
 imp_ni_11_desc: "Profits from national resources or industries are reinvested for long-term growth, reducing dependency on foreign capital."
 imp_ni_9: "Urbanization Efforts"
 imp_ni_9_desc: "State-led migration and development policies grow cities into industrial and administrative hubs—while rural regions hollow out."
 imp_ni_14: "Worker Co-operatives"
 imp_ni_14_desc: "Industries owned and run by their workers boost morale and equality, though may slow central planning or competitiveness."
 imp_ni_21: "Daring National AI Strategies"
 imp_ni_21_desc: "Rapid investment in frontier AI places the nation at the cutting edge—potentially destabilizing society and job markets."
 imp_ni_22: "Careful National AI Strategies"
 imp_ni_22_desc: "A cautious, regulated approach to artificial intelligence emphasizes ethical standards and long-term safety over speed."
 imp_ni_13: "Global Tech Hub"
 imp_ni_13_desc: "Cutting-edge talent and investment flow in, making the nation a world leader in technology and digital exports."
 imp_ni_16: "Child Labour"
 imp_ni_16_desc: "Economic desperation or exploitative policy forces children into the workforce, boosting output at a devastating human cost."
 imp_ni_23: "Foreign Investment Act"
 imp_ni_23_desc: "Tightens control over foreign capital in key sectors, protecting national assets but slowing outside investment."
 imp_ni_32: "Popular Tourist Destination"
 imp_ni_32_desc: "A thriving tourism industry brings in foreign currency and boosts soft power, with minimal industrial cost."
 imp_ni_34: "Prison Labour Programs"
 imp_ni_34_desc: "Inmates are conscripted into labor, expanding the workforce and cutting costs—at the price of international criticism."
 imp_ni_35: "Global Finance Hub"
 imp_ni_35_desc: "Loose financial regulations and elite infrastructure make the nation a magnet for international banks and corporations."
 imp_ni_47: "Privatized Infrastructure"
 imp_ni_47_desc: "Private companies have taken on the burden of building and maintaining the nation’s infrastructure. This reduces costs for the state, but comes at the expense of centralized control and long-term strategic planning."
 imp_ni_48: "Blood for Bread"
 imp_ni_48_desc: "The state extracts relentless labor from its citizens with little regard for well-being. Basic needs are met—barely—but only in exchange for total obedience and backbreaking toil. In this economy, survival is earned with sweat and silence."
 imp_ni_offshore_development: "Offshore Development"
 imp_ni_offshore_development_desc: "Domestic industry can only grow so far, but our reach goes further. Through a mix of foreign contracts, special economic zones and offshore partnerships, we can expand our production capabilities beyond our borders. Freed from local constraints and backed by the state, these sites will provide vital civilian production while keeping risk far from home."
 imp_ni_resource_extraction_mandate: "Resource Extraction Mandate"
 imp_ni_resource_extraction_mandate_desc: "Our government has issued a sweeping mandate to prioritize resource development as a cornerstone of national strategy. Environmental reviews are fast-tracked, protected lands are reclassified and corporate extractors are given free rein to push deeper and harder into the earth. While this policy may ignite a boom in domestic resource availability, it may also come at the expense of long-term sustainability, local communities and ecological health."
 imp_ni_resource_extraction_mandate_tt: "We can enact more efficient §Yresource expansion decisions§!. Additionally, we become eligible for the discovery of §Ylarge rare earth deposits.§!"
 imp_ni_national_research_committee: "National Research Committee"
 imp_ni_national_research_committee_desc: "To try and better coordinate our scientific efforts, our government has established a centralized committee tasked with overseeing all research initiatives. This structure enables more projects to move forward in parallel, but the increased layers of oversight and red tape may slow down progress and sap innovation."
 imp_ni_innovation_ecosystem: "Innovation Ecosystem"
 imp_ni_innovation_ecosystem_desc: "Rather than dictating research from above, our government fosters a vibrant ecosystem where universities, startups and private enterprises are free to innovate with minimal interference. However, the lack of centralized oversight can lead to redundant efforts, uneven funding distribution and research paths that don't always align with national priorities."
 imp_ni_innovation_ecosystem_tt: "Every §Ythree months§! we gain a random §Gbreakthrough point§! and a §Grandom tech bonus§!.\n"

 imp_ni_27: "Military Parades"
 imp_ni_27_desc: "Regularly scheduled military parades showcase our nation's strength and unity, boosting national pride and demonstrating our military prowess to both citizens and potential adversaries."
 imp_ni_17: "Cyberwarfare Divisions"
 imp_ni_17_desc: "Our investment in cyberwarfare capabilities allows us to conduct offensive and defensive operations in the digital realm, protecting our infrastructure and disrupting enemy communications."
 imp_ni_18: "Civil Militia"
 imp_ni_18_desc: "Organized civilian militias provide additional manpower for defense and maintain order during times of crisis, supplementing our regular armed forces.​"
 imp_ni_36: "Maritime Industry Hub"
 imp_ni_36_desc: "Our focus on developing a robust maritime industry enhances shipbuilding capabilities and boosts naval production efficiency, solidifying our presence on the seas."
 imp_ni_37: "Surplus Arsenal"
 imp_ni_37_desc: "Accumulated surplus military equipment from previous conflicts provides us with a reserve of arms, allowing for rapid mobilization and equipping of new units when necessary."
 imp_ni_38: "Nationalized Steel Industry"
 imp_ni_38_desc: "By nationalizing the steel industry, we ensure a steady supply of this critical resource for our military and industrial needs, reducing reliance on foreign imports."
 imp_ni_39: "Nationalized Aluminium Industry"
 imp_ni_39_desc: "Control over aluminium production guarantees the availability of this lightweight metal essential for aircraft manufacturing and other military applications."
 imp_ni_41: "Chemical Weapons Program"
 imp_ni_41_desc: "Our clandestine chemical weapons program provides us with a deterrent against adversaries, though its existence may draw international condemnation and sanctions."
 imp_ni_42: "Top Gun Academy"
 imp_ni_42_desc: "An elite training program for our air force pilots, the Top Gun Academy hones aerial combat skills, producing aces who dominate the skies."
 imp_ni_43: "Battlefield Salvage Teams"
 imp_ni_43_desc: "Specialized units recover usable equipment and materials from battlefields, maximizing resource efficiency and reducing waste during wartime."
 imp_ni_44: "Aviation Manufacturing Hub"
 imp_ni_44_desc: "Our investment in aviation manufacturing infrastructure accelerates aircraft production and supports the development of cutting-edge aerospace technology."
 imp_ni_45: "Tank Manufacturing Hub"
 imp_ni_45_desc: "A centralized tank production facility streamlines manufacturing processes, increasing output and ensuring our armored divisions are well-equipped."
 imp_ni_49: "Forced Conscription"
 imp_ni_49_desc: "Mandatory military service ensures a continuous supply of personnel for our armed forces, though it may impact public opinion and civilian morale.​"
 imp_ni_50: "Civil Defence Drills"
 imp_ni_50_desc: "Regular civil defense exercises prepare our population for emergencies, enhancing national resilience and reducing casualties during conflicts."
 imp_ni_51: "Army Reserve Mobilization"
 imp_ni_51_desc: "Efficient mobilization protocols for our army reserves allow for rapid reinforcement of front-line units during times of war."
 imp_ni_52: "Environmental Training"
 imp_ni_52_desc: "Our troops undergo rigorous training in diverse environmental conditions, improving their adaptability and effectiveness in various terrains."
 imp_ni_53: "Special Forces Prioritization"
 imp_ni_53_desc: "Allocating additional resources to our special forces units enhances their capabilities, enabling them to conduct high-risk operations with greater success."
 imp_ni_55: "Military Logistics Reform"
 imp_ni_55_desc: "Overhauling our military logistics system improves supply chain efficiency, ensuring our troops are well-provisioned and reducing operational delays."
 imp_ni_60: "Guerrilla Warfare"
 imp_ni_60_desc: "Highly trained gorillas have been unleashed into the battlefield, causing chaos behind enemy lines. With unmatched jungle agility and terrifying strength, our simian soldiers bring a whole new meaning to going ape in combat."
 imp_ni_54: "UAV Projects"
 imp_ni_54_desc: "Investing in unmanned aerial vehicle (UAV) technology expands our reconnaissance and strike capabilities, providing real-time intelligence and precision targeting."
 imp_ni_fear_is_the_weapon: "Fear is the Weapon"
 imp_ni_fear_is_the_weapon_desc: "The hearts of men crack long before their walls do. We no longer waste time distinguishing soldier from citizen. Fear is more efficient than any bomb or bullet. Our scientists work without restraint, our factories without pause, and our enemies sleep without peace. Their children will wake to fire and sleep in silence, for morality is merely an obstacle."
 imp_ni_hidden_arsenal: "Hidden Arsenal"
 imp_ni_hidden_arsenal_desc: "Official records only show what we allow. Beneath abandoned rail yards, sealed mines and mountain vaults, a network of covert arms production thrives. Funded by a large part of our nation's resources, staffed by loyal engineers and guarded by silence, these secret sites churn out weapons far from enemy eyes and political interference. When war comes knocking, we will not be caught unprepared."
 imp_ni_foreign_fighters: "Foreign Fighter Recruitment"
 imp_ni_foreign_fighters_desc: "Drawn by ideology, adventure, or desperation, volunteers from abroad swell our ranks. Their experience and zeal bolster our forces, but their loyalties and methods do not always align with our own."


 imp_nat_idea_pop: "Has enough Pop Growth to warrent population controls"
 imp_nat_idea_ref: "Has more than 10k unintegrated refugees"
 imp_nat_idea_dep: "§YWill begin deporting unintegrated refugees, forcing them to travel towards richer nations instead.§!"
 imp_nat_idea_glob60: "Requires more than 60 globalization."
