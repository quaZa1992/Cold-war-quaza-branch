 # IMPERIA CW — Cold War: Directed urbanisation and rural labour mobilisation.
 COLDWAR_ni_directed_urbanisation:0 "Directed Urbanisation"
 COLDWAR_ni_directed_urbanisation_desc:0 "The state directs rural households towards industrial employment through labour recruitment, planned housing and investment concentrated around factories. Soviet industrial labour drives and Romania's industrial towns provide precedents for reshaping an agrarian society. Fields lose experienced workers, established communities are disrupted and expanding towns demand costly housing, welfare, clinics and administration. Compulsory recruitment and overcrowding undermine public confidence while neglected farms produce less.\n\nReduces the workforce allocated to subsistence agriculture. Released workers can fill existing vacancies or take jobs in new factories; without employment, they join the unemployed. Agricultural productivity falls as industry receives priority.\n\nCombined with the Green Revolution, the two policies reduce the normal subsistence labour requirement by §G45%§! before other modifiers. This reallocates existing workers; total population is unchanged.\n\n§YCommitment:§! four years before removal."
 COLDWAR_directed_urbanisation_rural_workforce_tt:0 "Has workers employed in subsistence agriculture"
