 # IMPERIA COLD WAR — Arab coalition 1970: Divided Command. Written by tools/israel_defence_1970/apply.py.
 COLDWAR_ARAB_1970_divided_command:0 "Divided Command"
 COLDWAR_ARAB_1970_divided_command_desc:0 "Cairo, Damascus, Amman and Baghdad each fight their own war. Plans are not shared, liaison officers wait for orders that never come, and every front looks to its own capital first. It will take months of hard work before the Eastern Front and the Canal act as one.\n\nLasts about six months, or until the war with Israel ends."
