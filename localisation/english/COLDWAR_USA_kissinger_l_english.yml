 COLDWAR_USA_KS_underground_tur_3_desc:0 "American covert funding sustains Kurdish political organisers and clandestine supply networks inside Turkey. The programme supports resistance before an independent Kurdish authority exists. Government deployments, development and political concessions can contain its influence."
