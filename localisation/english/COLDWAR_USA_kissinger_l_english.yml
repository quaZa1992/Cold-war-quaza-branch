 COLDWAR_USA_TDSP.1.t:0 "An American-Soviet Joint Statement"
 COLDWAR_USA_TDSP.1.d:0 "Washington proposes a further public statement on the cooperation already agreed between our governments."
 COLDWAR_USA_TDSP.1.a:0 "Approve the statement"
 COLDWAR_USA_TDSP.1.b:0 "Decline the statement"
 COLDWAR_USA_TDSP.2.t:0 "Washington and Moscow Announce Further Cooperation"
 COLDWAR_USA_TDSP.2.d:0 "The United States and Soviet Union have approved a joint statement on their continuing cooperation. The announcement accompanies the agreements negotiated by their delegations."
 COLDWAR_USA_TDSP.2.a:0 "A diplomatic opening"
 COLDWAR_USA_TD.1.t:0 "Four-Year Trade and Production Exchange"
 COLDWAR_USA_TD.1.d:0 "Washington proposes four years of trade and production exchanges. American access to Chinese consumer goods and Chinese access to production expertise give both governments a stake in the opening."
 COLDWAR_USA_TD.1.0:0 "Review the complete proposal"
 COLDWAR_USA_TD.1.1:0 "Leave the proposal for the delegation"
 COLDWAR_USA_TD.2.t:0 "Priority Industrial Mission"
 COLDWAR_USA_TD.2.d:0 "An American-financed civilian technical mission would support Chinese industrial development. Beijing retains responsibility for the mission and may end its participation."
 COLDWAR_USA_TD.2.0:0 "Review the complete proposal"
 COLDWAR_USA_TD.2.1:0 "Leave the proposal for the delegation"
 COLDWAR_USA_TD.3.t:0 "Sino-American Strategic Consultations"
 COLDWAR_USA_TD.3.d:0 "Regular strategic consultations would allow Washington and Beijing to exchange assessments of regional pressure. Each government remains responsible for its own foreign policy."
 COLDWAR_USA_TD.3.0:0 "Review the complete proposal"
 COLDWAR_USA_TD.3.1:0 "Leave the proposal for the delegation"
 COLDWAR_USA_TD.4.t:0 "Chinese Regional Restraint Package"
 COLDWAR_USA_TD.4.d:0 "Economic cooperation is offered for the withdrawal of Chinese military missions from an agreed recipient. Beijing names the recipient, Washington approves that choice, and both governments review the resulting commitment."
 COLDWAR_USA_TD.4.0:0 "Review the complete proposal"
 COLDWAR_USA_TD.4.1:0 "Leave the proposal for the delegation"
 COLDWAR_USA_TD.5.t:0 "A Joint Sino-American Statement"
 COLDWAR_USA_TD.5.d:0 "Washington requests Chinese approval to announce the public scope of the agreed cooperation and invite further negotiations."
 COLDWAR_USA_TD.5.0:0 "Review the proposed statement"
 COLDWAR_USA_TD.5.1:0 "Consult the delegation"
 COLDWAR_USA_TD.10.t:0 "A Chinese Regional Counterproposal"
 COLDWAR_USA_TD.10.d:0 "Beijing proposes withdrawing its military missions from [?COLDWAR_USA_KS_td_regional_target.GetName]. Washington must decide whether that recipient satisfies the proposed regional bargain."
 COLDWAR_USA_TD.10.0:0 "Review the named recipient"
 COLDWAR_USA_TD.10.1:0 "Consult the delegation"
 COLDWAR_USA_TD.101.t:0 "Washington and Beijing Announce Cooperation"
 COLDWAR_USA_TD.101.d:0 "The United States and China have jointly announced a substantive cooperation programme. Washington has invited further negotiations while both governments retain their own diplomatic commitments."
 COLDWAR_USA_TD.101.a:0 "A significant diplomatic opening."
