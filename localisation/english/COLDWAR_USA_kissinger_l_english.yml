 COLDWAR_USA_KS_regional_category:0 "Regional Security"
 COLDWAR_USA_KS_security_programme:0 "Regional Security Operation"
 COLDWAR_USA_KS_security_programme_desc:0 "A sustained deployment supports the regional authorities. Successful operations leave a period of calm that can outlast the deployment."
 COLDWAR_USA_KS_security_programme_weekly_tt:0 "Programme balance: §R-0.004%§! of current GDP per week (§R-$[?COLDWAR_USA_KS_week_security|5] billion/week§!)."
 COLDWAR_USA_KS_investment_programme:0 "Regional Development Programme"
 COLDWAR_USA_KS_investment_programme_desc:0 "Local institutions, public investment and recognised rights offer a slower and less coercive answer to regional grievances."
 COLDWAR_USA_KS_investment_programme_weekly_tt:0 "Programme balance: §R-0.002%§! of current GDP per week (§R-$[?COLDWAR_USA_KS_week_investment|5] billion/week§!)."
 COLDWAR_USA_KS_irq_security:0 "Regional Security Operation"
 COLDWAR_USA_KS_irq_security_desc:0 "A sustained, funded field operation can break up armed networks and leave a lasting period of calm after the troops depart. Initial funding: 2% of current GDP. Weekly funding: 0.004% of current GDP."
 COLDWAR_USA_KS_irq_investment:0 "Regional Investment"
 COLDWAR_USA_KS_irq_investment_desc:0 "Investment in local institutions and public services addresses regional grievances without relying on a permanent field deployment. Initial funding: 1% of current GDP. Weekly funding: 0.002% of current GDP."
 COLDWAR_USA_KS_irq_end_programme:0 "End the regional programme"
 COLDWAR_USA_KS_irq_end_programme_desc:0 "Conclude the exceptional regional expenditure. Stabilisation already achieved remains and gradually fades over time."
 COLDWAR_USA_KS_irq_pause:0 "Suspend regional assistance: Iraq"
 COLDWAR_USA_KS_irq_pause_desc:0 "Adjust the continuing American commitment. The local political situation and material already delivered remain in place."
 COLDWAR_USA_KS_irq_resume:0 "Resume regional assistance: Iraq"
 COLDWAR_USA_KS_irq_resume_desc:0 "Adjust the continuing American commitment. The local political situation and material already delivered remain in place."
 COLDWAR_USA_KS_region_irq:0 "Iraq: The Kurdish Question"
 COLDWAR_USA_KS_region_irq_desc:0 "Regional unrest: §Y[?IRQ.COLDWAR_USA_KS_unrest|0]/100§!.\nDeployment and funded programmes contain unrest and build lasting calm. Political rights support reconciliation, but renewed American escalation can contest the settlement. Consolidation requires 520 qualifying weeks of rights, development and regional security."
