 COLDWAR_USA_KS_td_exchange_china_desc:0 "Washington proposes four years of trade and production exchanges. American access to Chinese consumer goods and Chinese access to production expertise give both governments a stake in the opening. The agreed term is four years from acceptance, including any period in which cooperation is suspended. Programme balance: -0.0002% of Chinese GDP per week."
