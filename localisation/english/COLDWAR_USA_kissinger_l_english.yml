 COLDWAR_USA_KS_chile_pressure:0 "Foreign-Funded Political Opposition"
 COLDWAR_USA_KS_chile_pressure_desc:0 "Outside support for political and media networks increases pressure on the government and the cost of policing political conflict."
 COLDWAR_USA_KS_chile_end:0 "End Chilean political funding"
 COLDWAR_USA_KS_chile_end_desc:0 "Withdraw the standing American subsidy to the Chilean political programme."
 COLDWAR_USA_KS_chile_funding:0 "Fund Chilean political networks"
 COLDWAR_USA_KS_chile_funding_desc:0 "Restore the American programme of political and media assistance to a hostile government's opponents."
 COLDWAR_USA_KS_chile_oversight:0 "Political Finance Oversight"
 COLDWAR_USA_KS_chile_oversight_desc:0 "Fund a year of investigations into foreign political financing and enforce transparent accounts for political organisations. Continued foreign funding can rebuild its networks when this oversight ends."
 COLDWAR_USA_KS_consolidated_compact:0 "Consolidated Regional Institutions"
 COLDWAR_USA_KS_consolidated_compact_desc:0 "Years of local rights, funded development and sustained security have consolidated the regional settlement. Renewed foreign intervention or the abandonment of its political foundations can still undermine it."
 COLDWAR_USA_KS_reconciliation_tt:0 "Reconciliation progress is at least 520 weeks, including at least 312 weeks of sustained regional policy."
 COLDWAR_USA_KS_reconciliation_conditions_tt:0 "Regional rights are respected, unrest is below 10, lasting stabilisation is at least 80, development is funded, at least two divisions are stationed in the region, all contested states remain under peaceful government control, and no legacy of repression remains."
 COLDWAR_USA_KS_pressure_clear_tt:0 "No active American campaign to intensify regional resistance."
 COLDWAR_USA_KS_pressure_ready_tt:0 "Armed regional assistance is active and no American-guaranteed political settlement is in force."
 COLDWAR_USA_KS_pressure_duration_tt:0 "Intensified regional support: $RIGHT|0$ weeks"
 COLDWAR_USA_KS_weekly_unrest_tt:0 "Weekly foreign unrest pressure: $RIGHT|+2$"
 COLDWAR_USA_KS_reconciliation_weeks_tt:0 "Regional reconciliation credit: $RIGHT|+=0$ weeks"
 COLDWAR_USA_KS_irq_consolidate:0 "Consolidate the regional settlement"
 COLDWAR_USA_KS_irq_consolidate_desc:0 "Reconciliation: §Y[?IRQ.COLDWAR_USA_KS_reconciliation_weeks|0]/520 weeks§!. Sustained policy: §Y[?IRQ.COLDWAR_USA_KS_qualifying_weeks|0] weeks§!. Major reforms can contribute up to 208 weeks, reducing the minimum from ten to six years. Maintain rights, funded development, two deployed divisions, stabilisation of at least 80 and unrest below 10. Setbacks cost two weeks of sustained progress per week. Consolidation ends spontaneous unrest and ordinary foreign agitation; a major foreign campaign can reopen the dispute after prolonged deterioration."
 COLDWAR_USA_KS_irq_reform_rights_charter:0 "Entrench Regional Rights"
 COLDWAR_USA_KS_irq_reform_rights_charter_desc:0 "Constitutional guarantees, recognised language rights and enforceable local representation give regional institutions a lasting foundation. Each completed programme contributes 52 weeks towards reconciliation. The four programmes cost 55% of current annual GDP in total at unchanged GDP, before the final settlement. Sustained deployment, local rights and development remain necessary."
 COLDWAR_USA_KS_reform_milestone_1_tt:0 "52 weeks of sustained regional policy have been completed."
 COLDWAR_USA_KS_irq_reform_revenue:0 "Regional Revenue Settlement"
 COLDWAR_USA_KS_irq_reform_revenue_desc:0 "A funded revenue-sharing compact transfers a substantial fiscal reserve to regional institutions and public services. Each completed programme contributes 52 weeks towards reconciliation. The four programmes cost 55% of current annual GDP in total at unchanged GDP, before the final settlement. Sustained deployment, local rights and development remain necessary."
 COLDWAR_USA_KS_reform_milestone_2_tt:0 "104 weeks of sustained regional policy have been completed."
 COLDWAR_USA_KS_reform_previous_2_tt:0 "Entrench Regional Rights has been completed."
 COLDWAR_USA_KS_irq_reform_integration:0 "Integrate Regional Public Institutions"
 COLDWAR_USA_KS_irq_reform_integration_desc:0 "Recruit local civil servants and accountable police, recognise qualifications and build a common regional administration. Each completed programme contributes 52 weeks towards reconciliation. The four programmes cost 55% of current annual GDP in total at unchanged GDP, before the final settlement. Sustained deployment, local rights and development remain necessary."
 COLDWAR_USA_KS_reform_milestone_3_tt:0 "156 weeks of sustained regional policy have been completed."
 COLDWAR_USA_KS_reform_previous_3_tt:0 "Regional Revenue Settlement has been completed."
 COLDWAR_USA_KS_irq_reform_reconstruction:0 "Civilian Reconstruction Commission"
 COLDWAR_USA_KS_irq_reform_reconstruction_desc:0 "Fund a major civilian reconstruction programme, independent auditing and compensation for communities affected by the conflict. Each completed programme contributes 52 weeks towards reconciliation. The four programmes cost 55% of current annual GDP in total at unchanged GDP, before the final settlement. Sustained deployment, local rights and development remain necessary."
 COLDWAR_USA_KS_reform_milestone_4_tt:0 "208 weeks of sustained regional policy have been completed."
 COLDWAR_USA_KS_reform_previous_4_tt:0 "Integrate Regional Public Institutions has been completed."
 COLDWAR_USA_KS_irq_intensify:0 "Fuel the Kurdish Insurgency: Iraq"
 COLDWAR_USA_KS_irq_intensify_desc:0 "Finance six months of intensified Kurdish organisation and clandestine arms support inside Iraq. The resistance can be strengthened before a Kurdish state exists. Respected local rights remain a source of calm, but no longer guarantee immunity from an armed mobilisation during the campaign. Government deployments and sustained regional spending can contain the pressure. A consolidated settlement only breaks after 26 consecutive weeks of unrest above 19 under active foreign pressure. Initial funding: 0.0025% of US GDP. Additional weekly funding: 0.0002% of US GDP."
 COLDWAR_USA_KS_per_consolidate:0 "Consolidate the regional settlement"
 COLDWAR_USA_KS_per_consolidate_desc:0 "Reconciliation: §Y[?PER.COLDWAR_USA_KS_reconciliation_weeks|0]/520 weeks§!. Sustained policy: §Y[?PER.COLDWAR_USA_KS_qualifying_weeks|0] weeks§!. Major reforms can contribute up to 208 weeks, reducing the minimum from ten to six years. Maintain rights, funded development, two deployed divisions, stabilisation of at least 80 and unrest below 10. Setbacks cost two weeks of sustained progress per week. Consolidation ends spontaneous unrest and ordinary foreign agitation; a major foreign campaign can reopen the dispute after prolonged deterioration."
