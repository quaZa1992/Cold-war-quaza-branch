 COLDWAR_USA_KS_per_intensify:0 "Fuel the Kurdish Insurgency: Iran"
 COLDWAR_USA_KS_per_intensify_desc:0 "Finance six months of intensified Kurdish organisation and clandestine arms support inside Iran. The resistance can be strengthened before a Kurdish state exists. Respected local rights remain a source of calm, but no longer guarantee immunity from an armed mobilisation during the campaign. Government deployments and sustained regional spending can contain the pressure. A consolidated settlement only breaks after 26 consecutive weeks of unrest above 19 under active foreign pressure. Initial funding: 0.0025% of US GDP. Additional weekly funding: 0.0002% of US GDP."
 COLDWAR_USA_KS_tur_consolidate:0 "Consolidate the regional settlement"
 COLDWAR_USA_KS_tur_consolidate_desc:0 "Reconciliation: §Y[?TUR.COLDWAR_USA_KS_reconciliation_weeks|0]/520 weeks§!. Sustained policy: §Y[?TUR.COLDWAR_USA_KS_qualifying_weeks|0] weeks§!. Major reforms can contribute up to 208 weeks, reducing the minimum from ten to six years. Maintain rights, funded development, two deployed divisions, stabilisation of at least 80 and unrest below 10. Setbacks cost two weeks of sustained progress per week. Consolidation ends spontaneous unrest and ordinary foreign agitation; a major foreign campaign can reopen the dispute after prolonged deterioration."
 COLDWAR_USA_KS_tur_reform_rights_charter:0 "Entrench Regional Rights"
 COLDWAR_USA_KS_tur_reform_rights_charter_desc:0 "Constitutional guarantees, recognised language rights and enforceable local representation give regional institutions a lasting foundation. Each completed programme contributes 52 weeks towards reconciliation. The four programmes cost 55% of current annual GDP in total at unchanged GDP, before the final settlement. Sustained deployment, local rights and development remain necessary."
 COLDWAR_USA_KS_tur_reform_revenue:0 "Regional Revenue Settlement"
 COLDWAR_USA_KS_tur_reform_revenue_desc:0 "A funded revenue-sharing compact transfers a substantial fiscal reserve to regional institutions and public services. Each completed programme contributes 52 weeks towards reconciliation. The four programmes cost 55% of current annual GDP in total at unchanged GDP, before the final settlement. Sustained deployment, local rights and development remain necessary."
 COLDWAR_USA_KS_tur_reform_integration:0 "Integrate Regional Public Institutions"
 COLDWAR_USA_KS_tur_reform_integration_desc:0 "Recruit local civil servants and accountable police, recognise qualifications and build a common regional administration. Each completed programme contributes 52 weeks towards reconciliation. The four programmes cost 55% of current annual GDP in total at unchanged GDP, before the final settlement. Sustained deployment, local rights and development remain necessary."
