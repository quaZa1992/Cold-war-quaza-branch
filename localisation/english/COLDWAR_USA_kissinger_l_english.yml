 COLDWAR_USA_KS_repression_legacy:0 "Legacy of Regional Repression"
 COLDWAR_USA_KS_repression_legacy_desc:0 "Civilian deaths and coercive emergency rule have damaged public trust and international credibility. Trauma obstructs reconciliation and helps armed networks rebuild.\nRemaining regional trauma: §Y[?COLDWAR_USA_KS_trauma_weeks|0] weeks§!."
 COLDWAR_USA_KS_civilian_losses_tt:0 "Recorded civilian deaths: $RIGHT|0$"
 COLDWAR_USA_KS_trauma_pressure_tt:0 "Weekly unrest from repression: $RIGHT|+2$"
 COLDWAR_USA_KS_trauma_duration_tt:0 "Legacy of repression: $RIGHT|0$ weeks"
 COLDWAR_USA_KS_qualifying_weeks_tt:0 "Sustained regional policy: $RIGHT|+=0$ weeks"
 COLDWAR_USA_KS_repression_requirements_tt:0 "At least four divisions are deployed in the region, unrest exceeds 39, no previous emergency is on cooldown, and an eligible state has sufficient population under full government control."
 COLDWAR_USA_KS_trauma_clear_tt:0 "No unresolved legacy of regional repression."
 COLDWAR_USA_KS_international_censure:0 "International Censure"
 COLDWAR_USA_KS_international_censure_desc:0 "Public condemnation of civilian killings has damaged this government's international standing."
 COLDWAR_USA_KS_irq_emergency:0 "Impose Emergency Military Rule"
 COLDWAR_USA_KS_irq_emergency_desc:0 "Place the contested region under coercive military administration. This action causes 1,000 civilian deaths, removed from the population of one controlled regional state. Immediate containment comes at the cost of political rights, public trust and long-term reconciliation. Trauma prevents consolidation for 104 weeks and gives foreign sponsors an opportunity to rebuild resistance."
 COLDWAR_USA_KS_irq_repression:0 "Authorise Indiscriminate Repression"
 COLDWAR_USA_KS_irq_repression_desc:0 "Authorise indiscriminate repression of the regional population. Mass civilian killings will be reported to the government, Washington and existing regional authorities. This action causes 10,000 civilian deaths, removed from the population of one controlled regional state. Immediate containment comes at the cost of political rights, public trust and long-term reconciliation. Trauma prevents consolidation for 156 weeks and gives foreign sponsors an opportunity to rebuild resistance."
