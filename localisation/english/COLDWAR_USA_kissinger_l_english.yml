 COLDWAR_USA_KS_td_industry_usa:0 "China Industrial Mission"
 COLDWAR_USA_KS_td_industry_usa_desc:0 "An American-financed civilian technical mission would support Chinese industrial development. Beijing retains responsibility for the mission and may end its participation. Programme balance: -0.00005% of US GDP per week."
 COLDWAR_USA_KS_td_industry_china:0 "American Civilian Technical Mission"
