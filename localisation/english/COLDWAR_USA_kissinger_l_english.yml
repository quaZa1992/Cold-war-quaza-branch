 COLDWAR_USA_KS_policy_doctrine:0 "Strategic Flexibility"
 COLDWAR_USA_KS_policy_doctrine_desc:0 "American power must serve a political settlement. Selective pressure, diplomatic openings and limited commitments can divide rival coalitions without requiring another unlimited war."
 COLDWAR_USA_KS_policy_limited:0 "Limited Commitments"
 COLDWAR_USA_KS_policy_limited_desc:0 "A small number of closely supervised commitments protects sensitive channels and concentrates American resources."
 COLDWAR_USA_KS_policy_expanded:0 "Expanded Mandates"
 COLDWAR_USA_KS_policy_expanded_desc:0 "A broader programme lets Washington challenge several opponents at once, at the cost of greater administrative demands and political exposure."
 COLDWAR_USA_KS_credibility_crisis:0 "Alliance Credibility Crisis"
 COLDWAR_USA_KS_credibility_crisis_desc:0 "A breach with a regional partner has weakened confidence in American commitments."
 COLDWAR_USA_KS_recognition_cost:0 "Contested Regional Recognition"
 COLDWAR_USA_KS_recognition_cost_desc:0 "Recognition of a disputed regional authority complicates American relations with neighbouring governments."
 COLDWAR_USA_KS_doctrine:0 "The Kissinger Doctrine"
 COLDWAR_USA_KS_doctrine_desc:0 "American power must serve a political settlement. Selective pressure, diplomatic openings and limited commitments can divide rival coalitions without requiring another unlimited war."
 COLDWAR_USA_KS_enact_doctrine:0 "Enact: The Kissinger Doctrine"
 COLDWAR_USA_KS_enact_doctrine_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_limited:0 "Limited Commitments"
 COLDWAR_USA_KS_limited_desc:0 "A small number of closely supervised commitments protects sensitive channels and concentrates American resources."
 COLDWAR_USA_KS_enact_limited:0 "Enact: Limited Commitments"
 COLDWAR_USA_KS_enact_limited_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_expanded:0 "Expanded Mandates"
