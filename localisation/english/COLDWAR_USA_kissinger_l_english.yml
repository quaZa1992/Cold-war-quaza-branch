 COLDWAR_USA_KS.210.t:0 "Kurdish Civilians Killed in Iraq"
 COLDWAR_USA_KS.210.d:0 "Government troops and security forces of [IRQ.GetNameDef] have killed [?IRQ.COLDWAR_USA_KS_last_civilian_losses|0] Kurdish civilians in [COLDWAR_USA_KS_GetIncidentRegion_irq] during the government crackdown. Reports from the affected communities describe civilian killings and families fleeing their homes. Kurdish representatives are demanding accountability and international attention."
 COLDWAR_USA_KS.210.0:0 "The government must face the consequences."
