 COLDWAR_USA_KS_tur_finance_networks:0 "Finance Kurdish Underground Networks: Turkey"
 COLDWAR_USA_KS_tur_finance_networks_desc:0 "Fund Kurdish organisers, clandestine communications and local political networks inside Turkey. This strengthens the movement while the contested territory remains under the central government. An independent Kurdish state is not required. Arms, sustained organisation and an unresolved mobilisation warning are still needed before an uprising can be supported. Initial funding: 0.0005% of US GDP. A new operation can be authorised after 13 weeks."
