 COLDWAR_USA_KS_enact_expanded:0 "Enact: Expanded Mandates"
 COLDWAR_USA_KS_enact_expanded_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_triangular:0 "Triangular Diplomacy"
 COLDWAR_USA_KS_triangular_desc:0 "The divisions between Moscow and Beijing offer room for negotiation and strategic leverage."
 COLDWAR_USA_KS_enact_triangular:0 "Enact: Triangular Diplomacy"
 COLDWAR_USA_KS_enact_triangular_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_covert:0 "Deniable Pressure"
 COLDWAR_USA_KS_covert_desc:0 "Financial support, political contacts and limited material aid can burden a hostile government. Local partners retain their own interests and demands. Initial programme funding: 0.0005% of current US GDP."
 COLDWAR_USA_KS_enact_covert:0 "Enact: Deniable Pressure"
 COLDWAR_USA_KS_enact_covert_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_guarantees:0 "Regional Guarantees"
 COLDWAR_USA_KS_guarantees_desc:0 "Diplomatic commitments and limited security assistance give regional partners an alternative to escalation."
 COLDWAR_USA_KS_enact_guarantees:0 "Enact: Regional Guarantees"
 COLDWAR_USA_KS_enact_guarantees_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_beijing:0 "A Channel to Beijing"
 COLDWAR_USA_KS_beijing_desc:0 "A confidential channel can serve both Washington and Beijing without settling every dispute between them."
 COLDWAR_USA_KS_enact_beijing:0 "Enact: A Channel to Beijing"
 COLDWAR_USA_KS_enact_beijing_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_moscow:0 "Détente with Moscow"
 COLDWAR_USA_KS_moscow_desc:0 "Establish a regular negotiating channel with Moscow. Delegations may prepare a Nuclear Risk Reduction agreement and review its complete terms before signature. Strategic competition and the Chinese channel continue alongside these talks."
 COLDWAR_USA_KS_enact_moscow:0 "Enact: Détente with Moscow"
 COLDWAR_USA_KS_enact_moscow_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_clients:0 "Contest Soviet Clients"
 COLDWAR_USA_KS_clients_desc:0 "Opposition to a Soviet-aligned government must rest on a viable local partner and a sustained political objective. Initial programme funding: 0.0003% of current US GDP."
 COLDWAR_USA_KS_enact_clients:0 "Enact: Contest Soviet Clients"
 COLDWAR_USA_KS_enact_clients_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_angola:0 "The Angolan Front"
 COLDWAR_USA_KS_angola_desc:0 "Aid to Angolan movements can contest Soviet and Cuban influence, while domestic opposition and the conduct of local partners constrain American commitments. Initial programme funding: 0.0005% of current US GDP."
 COLDWAR_USA_KS_enact_angola:0 "Enact: The Angolan Front"
 COLDWAR_USA_KS_enact_angola_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_political:0 "Political Operations"
 COLDWAR_USA_KS_political_desc:0 "Media, political organisations and sympathetic institutions can contest an opponent through sustained political competition. Initial programme funding: 0.0002% of current US GDP."
 COLDWAR_USA_KS_enact_political:0 "Enact: Political Operations"
 COLDWAR_USA_KS_enact_political_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_chile:0 "The Chilean Opposition"
 COLDWAR_USA_KS_chile_desc:0 "Support for opposition parties and media can challenge a hostile government. Chilean political actors decide whether to cooperate and how to act. Initial programme funding: 0.0003% of current US GDP."
 COLDWAR_USA_KS_enact_chile:0 "Enact: The Chilean Opposition"
 COLDWAR_USA_KS_enact_chile_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_shuttle:0 "Shuttle Diplomacy"
 COLDWAR_USA_KS_shuttle_desc:0 "Repeated negotiations can turn limited military outcomes into a durable regional settlement."
 COLDWAR_USA_KS_enact_shuttle:0 "Enact: Shuttle Diplomacy"
 COLDWAR_USA_KS_enact_shuttle_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_kurds:0 "The Kurdish Question"
 COLDWAR_USA_KS_kurds_desc:0 "The Kurdish populations of Iraq, Iran, Turkey and Syria live under different governments and political movements. American policy must choose its commitments country by country. Initial programme funding: 0.0002% of current US GDP."
 COLDWAR_USA_KS_enact_kurds:0 "Enact: The Kurdish Question"
 COLDWAR_USA_KS_enact_kurds_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_irq_contacts:0 "Open Barzani Channels"
 COLDWAR_USA_KS_irq_contacts_desc:0 "Contacts with Barzani offer a route into northern Iraq. Political cooperation must precede any commitment of American money or equipment."
 COLDWAR_USA_KS_enact_irq_contacts:0 "Enact: Open Barzani Channels"
 COLDWAR_USA_KS_enact_irq_contacts_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_irq_transit:0 "The Iranian Connection"
 COLDWAR_USA_KS_irq_transit_desc:0 "Iran can provide the transit and liaison essential to a sustained assistance programme. Tehran must agree to the arrangement."
 COLDWAR_USA_KS_enact_irq_transit:0 "Enact: The Iranian Connection"
 COLDWAR_USA_KS_enact_irq_transit_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_irq_anatolia:0 "An Anatolian Channel"
 COLDWAR_USA_KS_irq_anatolia_desc:0 "A separate agreement with Ankara can sustain access to northern Iraq if the Iranian channel is unavailable. Turkey decides whether to accept the arrangement."
 COLDWAR_USA_KS_enact_irq_anatolia:0 "Enact: An Anatolian Channel"
 COLDWAR_USA_KS_enact_irq_anatolia_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_irq_fund:0 "Sustain the Peshmerga"
 COLDWAR_USA_KS_irq_fund_desc:0 "A limited flow of money and material can preserve Kurdish bargaining power and tie down Iraqi forces. It creates a commitment that Washington must be prepared to sustain. Initial programme funding: 0.0005% of current US GDP."
 COLDWAR_USA_KS_enact_irq_fund:0 "Enact: Sustain the Peshmerga"
 COLDWAR_USA_KS_enact_irq_fund_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_enact_irq_autonomy:0 "Enact: Bargain for Autonomy"
 COLDWAR_USA_KS_enact_irq_autonomy_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_irq_front:0 "Arm the Mountain Front"
 COLDWAR_USA_KS_irq_front_desc:0 "Escalate assistance to an armed opposition. Baghdad receives time to reinforce the region or offer a political settlement before an uprising becomes possible. Initial programme funding: 0.0003% of current US GDP."
 COLDWAR_USA_KS_enact_irq_front:0 "Enact: Arm the Mountain Front"
 COLDWAR_USA_KS_enact_irq_front_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_irq_settlement:0 "Guarantee Autonomy"
 COLDWAR_USA_KS_irq_settlement_desc:0 "A settlement requires Baghdad and the Kurdish representatives to accept its terms. Its guarantees remain conditional on the agreement being respected."
 COLDWAR_USA_KS_enact_irq_settlement:0 "Enact: Guarantee Autonomy"
 COLDWAR_USA_KS_enact_irq_settlement_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_irq_independence:0 "A Separate Kurdistan"
 COLDWAR_USA_KS_irq_independence_desc:0 "Independence is a separate political objective with a greater regional cost. Recognition follows actual Kurdish control and a decision by Kurdish representatives."
 COLDWAR_USA_KS_enact_irq_independence:0 "Enact: A Separate Kurdistan"
 COLDWAR_USA_KS_enact_irq_independence_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_irn_dossier:0 "The Iranian Dossier"
 COLDWAR_USA_KS_irn_dossier_desc:0 "The Shah is an American partner in the 1970 opening. A Kurdish pressure programme against Tehran requires a genuine confrontation or a deliberate break with that partnership."
 COLDWAR_USA_KS_enact_irn_dossier:0 "Enact: The Iranian Dossier"
 COLDWAR_USA_KS_enact_irn_dossier_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_irn_contacts:0 "Zagros Networks"
 COLDWAR_USA_KS_irn_contacts_desc:0 "Iranian Kurdish representatives have their own programmes and loyalties. They must consent to assistance independently of any Iraqi movement. Initial programme funding: 0.0002% of current US GDP."
 COLDWAR_USA_KS_enact_irn_contacts:0 "Enact: Zagros Networks"
 COLDWAR_USA_KS_enact_irn_contacts_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_irn_fund:0 "Mountain Committees"
 COLDWAR_USA_KS_irn_fund_desc:0 "Sustained support can strengthen local organisation. The Iranian government can answer with regional investment, security deployments or negotiations. Initial programme funding: 0.0005% of current US GDP."
 COLDWAR_USA_KS_enact_irn_fund:0 "Enact: Mountain Committees"
 COLDWAR_USA_KS_enact_irn_fund_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_irn_rights:0 "A Federal Bargain"
 COLDWAR_USA_KS_irn_rights_desc:0 "Seek local rights through an accepted constitutional settlement rather than a separation imposed from abroad."
 COLDWAR_USA_KS_enact_irn_rights:0 "Enact: A Federal Bargain"
 COLDWAR_USA_KS_enact_irn_rights_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_irn_front:0 "Challenge Tehran"
 COLDWAR_USA_KS_irn_front_desc:0 "An armed programme raises the price of confrontation for Tehran and exposes Washington to a wider regional dispute. Initial programme funding: 0.0003% of current US GDP."
 COLDWAR_USA_KS_enact_irn_front:0 "Enact: Challenge Tehran"
 COLDWAR_USA_KS_enact_irn_front_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_irn_claim:0 "A Kurdish Claim"
 COLDWAR_USA_KS_irn_claim_desc:0 "Recognition depends on an actual local political authority and territory it can hold. It does not transfer another Kurdish government or its population to American control."
 COLDWAR_USA_KS_enact_irn_claim:0 "Enact: A Kurdish Claim"
 COLDWAR_USA_KS_enact_irn_claim_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_tur_dossier:0 "The Turkish Dossier"
 COLDWAR_USA_KS_tur_dossier_desc:0 "Turkey is a NATO ally in the 1970 opening. Cooperation and confrontation are distinct policies with consequences for the wider alliance."
 COLDWAR_USA_KS_enact_tur_dossier:0 "Enact: The Turkish Dossier"
 COLDWAR_USA_KS_enact_tur_dossier_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_tur_alliance:0 "Preserve the Alliance"
 COLDWAR_USA_KS_tur_alliance_desc:0 "Offer Ankara an intelligence partnership and support a negotiated regional approach. The agreement must be accepted by Turkey."
 COLDWAR_USA_KS_enact_tur_alliance:0 "Enact: Preserve the Alliance"
 COLDWAR_USA_KS_enact_tur_alliance_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_tur_breach:0 "Challenge an Ally"
 COLDWAR_USA_KS_tur_breach_desc:0 "A deliberate confrontation with Ankara sacrifices alliance trust for freedom of action. Regional opposition will not become an American instrument merely because Washington offers aid."
 COLDWAR_USA_KS_enact_tur_breach:0 "Enact: Challenge an Ally"
 COLDWAR_USA_KS_enact_tur_breach_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_tur_networks:0 "Southeastern Contacts"
 COLDWAR_USA_KS_tur_networks_desc:0 "Approach local Kurdish political representatives. Their demands and political loyalties will shape the terms of any American assistance. Initial programme funding: 0.0002% of current US GDP."
 COLDWAR_USA_KS_enact_tur_networks:0 "Enact: Southeastern Contacts"
 COLDWAR_USA_KS_enact_tur_networks_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_tur_rights:0 "Regional Rights Talks"
 COLDWAR_USA_KS_tur_rights_desc:0 "A political agreement can reduce the conflict while preserving Turkey as a single state. Both Ankara and the local representatives determine its terms."
 COLDWAR_USA_KS_enact_tur_rights:0 "Enact: Regional Rights Talks"
 COLDWAR_USA_KS_enact_tur_rights_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_tur_front:0 "An Armed Alternative"
 COLDWAR_USA_KS_tur_front_desc:0 "Military support is a major escalation against Ankara. Success depends on local organisation and on the response of the Turkish government. Initial programme funding: 0.0005% of current US GDP."
 COLDWAR_USA_KS_enact_tur_front:0 "Enact: An Armed Alternative"
 COLDWAR_USA_KS_enact_tur_front_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_tur_claim:0 "A Separate State"
 COLDWAR_USA_KS_tur_claim_desc:0 "A separate state is a possible alternative outcome of a successful local struggle, rather than an automatic result of American sponsorship."
 COLDWAR_USA_KS_enact_tur_claim:0 "Enact: A Separate State"
 COLDWAR_USA_KS_enact_tur_claim_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_syr_contacts:0 "Syrian Kurdish Contacts"
 COLDWAR_USA_KS_syr_contacts_desc:0 "Approach Kurdish political representatives in northern Syria. Their regional demands remain distinct from those of movements in neighbouring states."
 COLDWAR_USA_KS_enact_syr_contacts:0 "Enact: Syrian Kurdish Contacts"
 COLDWAR_USA_KS_enact_syr_contacts_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_syr_voice:0 "A Voice in the North"
 COLDWAR_USA_KS_syr_voice_desc:0 "Political and civic support can strengthen local representation without beginning an armed confrontation. Initial programme funding: 0.0002% of current US GDP."
 COLDWAR_USA_KS_enact_syr_voice:0 "Enact: A Voice in the North"
 COLDWAR_USA_KS_enact_syr_voice_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_syr_organisation:0 "Regional Organisation"
 COLDWAR_USA_KS_syr_organisation_desc:0 "Build a political network capable of negotiating with Damascus or sustaining a longer confrontation. Initial programme funding: 0.0003% of current US GDP."
 COLDWAR_USA_KS_enact_syr_organisation:0 "Enact: Regional Organisation"
 COLDWAR_USA_KS_enact_syr_organisation_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_syr_rights:0 "Citizenship and Rights"
 COLDWAR_USA_KS_syr_rights_desc:0 "A negotiated framework can address citizenship and local administration while preserving the Syrian state."
 COLDWAR_USA_KS_enact_syr_rights:0 "Enact: Citizenship and Rights"
 COLDWAR_USA_KS_enact_syr_rights_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_syr_front:0 "The Armed Alternative"
 COLDWAR_USA_KS_syr_front_desc:0 "Material assistance can strengthen an armed opposition with a genuine local political base. A wider confrontation carries risks for both the Syrian population and American commitments. Initial programme funding: 0.0005% of current US GDP."
 COLDWAR_USA_KS_enact_syr_front:0 "Enact: The Armed Alternative"
 COLDWAR_USA_KS_enact_syr_front_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
 COLDWAR_USA_KS_syr_claim:0 "Northern Authority"
 COLDWAR_USA_KS_syr_claim_desc:0 "A new political authority must emerge from territory it actually controls and from the wishes of its representatives."
 COLDWAR_USA_KS_enact_syr_claim:0 "Enact: Northern Authority"
 COLDWAR_USA_KS_enact_syr_claim_desc:0 "Carry the authorised programme into effect once its political, territorial and material requirements are met."
