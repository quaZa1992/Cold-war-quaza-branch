 COLDWAR_USA_KS_td_exchange_review_decision:0 "Review: Four-Year Trade and Production Exchange"
 COLDWAR_USA_KS_td_exchange_review_decision_desc:0 "Washington proposes four years of trade and production exchanges. American access to Chinese consumer goods and Chinese access to production expertise give both governments a stake in the opening."
