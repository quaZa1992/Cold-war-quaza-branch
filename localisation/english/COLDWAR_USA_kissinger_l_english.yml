 COLDWAR_USA_KS_china_exchange:0 "Trade and Exchanges"
 COLDWAR_USA_KS_china_exchange_desc:0 "Offer a four-year trade and production-exchange programme. American access to Chinese consumer goods reduces the civilian industry reserved for consumer demand, while production exchanges accelerate Chinese productivity growth. Both governments benefit from maintaining the opening."
 COLDWAR_USA_KS_td_china_exchange_tt:0 "An active Beijing Backchannel."
 COLDWAR_USA_KS_enact_china_exchange:0 "Enact: Trade and Exchanges"
 COLDWAR_USA_KS_enact_china_exchange_desc:0 "Resume the authorised diplomatic initiative when its political conditions are met."
 COLDWAR_USA_KS_soviet_exchange:0 "Bilateral Cooperation"
 COLDWAR_USA_KS_soviet_exchange_desc:0 "American laboratories and Soviet research institutes can maintain useful contacts even when strategic relations are strained. Scientific exchanges and reciprocal access for civilian investment would give both governments an interest in preserving the opening."
 COLDWAR_USA_KS_enact_soviet_exchange:0 "Enact: Bilateral Cooperation"
 COLDWAR_USA_KS_enact_soviet_exchange_desc:0 "Resume the authorised diplomatic initiative when its political conditions are met."
 COLDWAR_USA_KS_china_priority:0 "Play the China Card"
 COLDWAR_USA_KS_china_priority_desc:0 "Concentrate America's preferential programmes on Beijing. A stronger Chinese relationship gives Washington a credible alternative when seeking concessions from Moscow. Ordinary Soviet consultations remain available."
 COLDWAR_USA_KS_td_china_priority_tt:0 "The four-year Chinese trade and production exchange is active."
 COLDWAR_USA_KS_td_priority_china:0 "Pacific Diplomatic Priority"
