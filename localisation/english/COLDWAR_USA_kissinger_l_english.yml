 COLDWAR_USA_KS_enact_gulf_desc:0 "Carry the authorised wartime assistance programme into effect when the necessary route and equipment are available."
 COLDWAR_USA_KS_per_breach:0 "Break with Tehran"
 COLDWAR_USA_KS_per_breach_desc:0 "Abandon cooperation with the Iranian government and authorise contacts with its regional opponents. Such a decision damages American credibility with its partners."
 COLDWAR_USA_KS_irq_offer_framework:0 "Propose a northern political settlement"
 COLDWAR_USA_KS_irq_offer_framework_desc:0 "Invite Baghdad and the regional representatives to negotiate local rights within Iraq."
 COLDWAR_USA_KS_irq_accept_framework:0 "Accept northern political talks"
 COLDWAR_USA_KS_irq_accept_framework_desc:0 "Accept a framework of local rights and negotiations. Any existing regional government must also approve its part of the settlement."
 COLDWAR_USA_KS_irq_decline_framework:0 "Decline northern political talks"
 COLDWAR_USA_KS_irq_decline_framework_desc:0 "Reject the proposed framework and retain the current regional policy."
 COLDWAR_USA_KS_irq_autonomy:0 "Bargain for Autonomy"
 COLDWAR_USA_KS_irq_autonomy_desc:0 "Use American leverage to secure regional rights within Iraq. A negotiated agreement can preserve Kurdish institutions while ending the armed confrontation."
 COLDWAR_USA_KS_irq_end_rights:0 "Withdraw the regional political offer"
 COLDWAR_USA_KS_irq_end_rights_desc:0 "End the political settlement and its continuing regional budget. Local grievances may return as earlier stabilisation fades."
