l_english:
 USA_1970.10.t: "The Constitutional Crisis"
 USA_1970.10.d: "The Watergate investigation has consumed the administration and destroyed much of the President's support in Congress. Richard Nixon can resign and permit Gerald Ford to restore institutional stability, or fight the charges and test how much strain the presidency can survive."
 USA_1970.10.a: "Nixon resigns; Ford will restore constitutional order"
 USA_1970.10.b: "Fight the charges and preserve the presidency"
 USA_1970.100.t: "The Atlantic Bargain"
 USA_1970.100.d: "Washington proposes a new division of costs and responsibilities inside the Atlantic partnership. The agreement offers consultation and cooperation, but it also asks us to carry more of the common burden."
 USA_1970.100.a: "Accept the bargain"
 USA_1970.100.b: "Return a counterproposal"
 USA_1970.100.c: "Reject the American terms"
 USA_1970.101.t: "An Ally's Counterproposal"
 USA_1970.101.d: "Our ally is willing to cooperate if Washington contributes additional transition funding and accepts a more equal consultation mechanism."
 USA_1970.101.a: "The compromise is worth the price"
 USA_1970.101.b: "The original offer stands"
 USA_1970.110.t: "An American Diplomatic Opening"
 USA_1970.110.d: "The United States proposes a limited commercial and diplomatic opening. It does not require ideological alignment, but both sides would accept a more predictable relationship."
 USA_1970.110.a: "Accept the opening"
 USA_1970.110.b: "Make a counteroffer"
 USA_1970.110.c: "There will be no agreement"
 USA_1970.111.t: "Terms for a Diplomatic Opening"
 USA_1970.111.d: "The other government will accept a commercial opening if Washington spends political capital on concessions and recognition."
 USA_1970.111.a: "Accept the revised terms"
 USA_1970.111.b: "Decline"
 USA_1970.120.t: "Arab Trade and Energy Compact"
 USA_1970.120.d: "Washington offers an improved trade agreement and a long-term energy dialogue. The proposal could bring investment, but it would also deepen our economic relationship with the United States."
 USA_1970.120.a: "Join the compact"
 USA_1970.120.b: "Demand better terms"
 USA_1970.120.c: "Reject the compact"
 USA_1970.121.t: "Revised Arab Compact Terms"
 USA_1970.121.d: "The prospective partner requests additional American concessions before signing the energy and trade compact."
 USA_1970.121.a: "Pay the political price"
 USA_1970.121.b: "Withdraw the offer"
 USA_1970.130.t: "American Shuttle Diplomacy"
 USA_1970.130.d: "The United States asks us to enter an open-ended diplomatic process. Washington promises no predetermined settlement and asks every participant to retain a veto over the outcome."
 USA_1970.130.a: "Enter the talks"
 USA_1970.130.b: "Enter only with conditions"
 USA_1970.130.c: "Refuse the process"
 USA_1970.131.t: "Conditions for Shuttle Talks"
 USA_1970.131.d: "The invited government will participate if Washington accepts its procedural conditions and commits additional diplomatic resources."
 USA_1970.131.a: "Accept the conditions"
 USA_1970.131.b: "End the initiative"
 USA_1970.140.t: "A Maritime Basing Proposal"
 USA_1970.140.d: "Washington requests access for logistics, replenishment, and repair. The agreement would improve coordination but also make our facilities part of America's global posture."
 USA_1970.140.a: "Grant access"
 USA_1970.140.b: "Request compensation"
 USA_1970.140.c: "Keep our bases closed"
 USA_1970.141.t: "The Price of Maritime Access"
 USA_1970.141.d: "Our partner will grant access if the United States contributes to local infrastructure and operating costs."
 USA_1970.141.a: "Fund the agreement"
 USA_1970.141.b: "We can operate without it"
 USA_1970.150.t: "An American Trade Proposal"
 USA_1970.150.d: "The United States proposes a deeper commercial relationship. Exporters would benefit, while domestic producers would face greater competition."
 USA_1970.150.a: "Sign the agreement"
 USA_1970.150.b: "Negotiate safeguards"
 USA_1970.150.c: "Reject the proposal"
 USA_1970.151.t: "Safeguards for a Trade Agreement"
 USA_1970.151.d: "The prospective partner will sign if Washington accepts safeguards for sensitive industries."
 USA_1970.151.a: "Accept the safeguards"
 USA_1970.151.b: "No agreement"
 USA_1970.170.t: "An American Security-Assistance Proposal"
 USA_1970.170.d: "Washington offers direct financial and security assistance while asking Israel to coordinate the package publicly. Accepting would strengthen the partnership; a counterproposal could secure broader American commitments."
 USA_1970.170.a: "Accept and coordinate the package"
 USA_1970.170.b: "Ask Washington for broader guarantees"
 USA_1970.170.c: "Decline the offer"
 USA_1970.171.t: "Israeli Conditions for Security Assistance"
 USA_1970.171.d: "Israel will accept the package if Washington contributes additional funds and treats the arrangement as a durable strategic commitment."
 USA_1970.171.a: "Accept the additional cost"
 USA_1970.171.b: "Withdraw the package"
 USA_1970.160.t: "American Security Assistance to Israel"
 USA_1970.160.d: "Washington has approved a new package of security and financial assistance for Israel. We must decide whether to confront the United States publicly or preserve room for quiet diplomacy."
 USA_1970.160.a: "Condemn the package"
 USA_1970.160.b: "Keep diplomatic channels open"
 USA_1970.190.t: "[FROM.GetNameDef] Accepts"
 USA_1970.190.d: "[FROM.GetNameDef] has accepted the American proposal. The agreed benefits, obligations, and political costs will now take effect."
 USA_1970.190.a: "The agreement stands"
 USA_1970.191.t: "[FROM.GetNameDef] Rejects the Proposal"
 USA_1970.191.d: "[FROM.GetNameDef] has rejected Washington's proposal. No bilateral benefits will be applied, and the United States must decide whether to pursue another partner."
 USA_1970.191.a: "We will adjust our policy"
 USA_1970.192.t: "Washington Accepts Our Conditions"
 USA_1970.192.d: "The United States has accepted our counterproposal. The revised agreement and its obligations will now enter into force."
 USA_1970.192.a: "A negotiated success"
 USA_1970.193.t: "Washington Rejects Our Conditions"
 USA_1970.193.d: "The United States has rejected our counterproposal. The proposed arrangement will not take effect."
 USA_1970.193.a: "Then there is no agreement"
