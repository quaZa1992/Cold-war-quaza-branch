l_english:
 LBA_french_elite_investments: "French Elite Investments"
 LBA_french_elite_investments_desc: "Paris sells arms, reactors, prestige and discretion. Libyan capital in the right industries can make French policymakers hesitate before joining any hard anti-Tripoli coalition."
 LBA_west_german_industrial_accounts: "West German Industrial Accounts"
 LBA_west_german_industrial_accounts_desc: "West German exporters, banks and machinery firms are practical partners. Quiet Libyan capital can buy access to industrial expertise while giving Bonn a reason to keep disputes commercial."
 LBA_swiss_discreet_banking: "Swiss Discreet Banking"
 LBA_swiss_discreet_banking_desc: "Swiss finance is built for discretion. A careful network of deposits, trusts and front companies can turn Libyan oil income into a defensive portfolio."
 LBA_maltese_shipping_links: "Maltese Shipping Links"
 LBA_maltese_shipping_links_desc: "Malta sits across the central Mediterranean lanes that Tripoli cannot ignore. Shipping, ports and insurance ties can bind Valletta to Libyan money without demanding ideological loyalty."
 LBA_spanish_property_networks: "Spanish Property Networks"
 LBA_spanish_property_networks_desc: "Spain's banks, ports and property markets offer a quieter Western foothold. Libyan capital can flow through tourism, shipping and Mediterranean development while still serving Gaddafi's politics."
