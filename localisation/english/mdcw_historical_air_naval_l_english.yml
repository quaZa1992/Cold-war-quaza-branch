l_english:
 mdcw_piston_fighter_1940:0 "Late Piston Fighter Development"
 mdcw_piston_fighter_1940_desc:0 "A lower-cost late-piston fighter generation. It is slower and has less reach than later jets, but uses less fuel and industrial capacity."
 mdcw_early_jet_fighter_1950:0 "First-Generation Jet Fighters"
 mdcw_early_jet_fighter_1950_desc:0 "Early operational jet fighters trade range and agility for speed and stronger interception performance."
 mdcw_early_supersonic_fighter_1955:0 "Supersonic-Capable Fighters"
 mdcw_early_supersonic_fighter_1955_desc:0 "The first supersonic-capable generation gains speed and attack at higher production and fuel cost, while sacrificing agility and retaining limited range."
 mdcw_point_interceptor_1960:0 "Fast Point-Defence Interceptors"
 mdcw_point_interceptor_1960_desc:0 "A high-speed interceptor optimized for rapid climbs and short-range defence. Its speed comes with lower agility, short combat reach, and high fuel demand."
 mdcw_light_export_fighter_1965:0 "Low-Cost Light Fighter"
 mdcw_light_export_fighter_1965_desc:0 "A compact multirole fighter offers better agility and lower cost than heavy interceptors, with less speed and payload."
 mdcw_light_export_fighter_1975:0 "Improved Light Fighter"
 mdcw_light_export_fighter_1975_desc:0 "Improved engines, avionics, and stores increase range and combat value while retaining the light fighter's modest cost."
 mdcw_early_airframes_1945:0 "Post-War Airframe Design"
 mdcw_early_airframes_1945_desc:0 "The aircraft design project opens an early small airframe with a limited propeller-engine and gun package. This unlocks design choices, not a ready-built combat aircraft."
 mdcw_early_jet_airframes_1950:0 "Swept-Wing Jet Airframes"
 mdcw_early_jet_airframes_1950_desc:0 "A medium airframe accepts early jet engines and swept wings. It can be faster than propeller designs but costs more and has less endurance."
 mdcw_utility_helicopter_1955:0 "Light Utility Helicopter Development"
 mdcw_utility_helicopter_1955_desc:0 "A helicopter project enables early transport and support formations. The research represents an emerging capability; it does not unlock attack helicopters or gunship equipment."
 mdcw_turboshaft_helicopter_1960:0 "Turboshaft Utility Helicopters"
 mdcw_turboshaft_helicopter_1960_desc:0 "Turboshaft-powered utility helicopters improve lift and reliability at greater fuel and equipment cost. Attack-helicopter formations remain locked behind their existing technology."
 mdcw_carrier_hull_1955:0 "Jet-Era Fleet Carrier Hulls"
 mdcw_carrier_hull_1955_desc:0 "A large conventional carrier hull supports post-war jet operations at substantial industrial and fuel cost. It does not include nuclear propulsion."
 mdcw_destroyer_hull_1955:0 "Post-War Destroyer Hulls"
 mdcw_destroyer_hull_1955_desc:0 "A conventional destroyer hull provides space for improved sensors and anti-submarine systems while retaining limited range and payload."
 mdcw_naval_sam_1955:0 "Early Shipboard Guided-Missile Integration"
 mdcw_naval_sam_1955_desc:0 "A limited Terrier-era launcher and missile magazine provide early area air defence. The system is costly, has modest attack strength, and is not a later vertical-launch system."
 mdcw_submarine_reactor_1955:0 "Experimental Submarine Nuclear Propulsion"
 mdcw_submarine_reactor_1955_desc:0 "A special project enables the existing early submarine reactor module. This unlock is confined to submarine propulsion and grants no surface reactor, missile submarine, or nuclear weapon capability."
 mdcw_attack_submarine_hull_1955:0 "First-Generation Nuclear Attack Submarine Hull"
 mdcw_attack_submarine_hull_1955_desc:0 "An expensive early attack-submarine hull is delivered with the existing submarine reactor module. It has modest reliability and does not carry ballistic missiles."
 mdcw_diesel_submarine_hull_1959:0 "Post-War Diesel-Electric Submarine Hull"
 mdcw_diesel_submarine_hull_1959_desc:0 "A conventional submarine hull uses the existing diesel-electric power module. It offers lower cost and greater reliability than the early nuclear hull without any invented endurance bonus."
 mdcw_piston_fighter_1940_model:0 "Late Piston Fighter"
