 mdcw_bba_early_jet_medium_airframe_1950:0 "Early Swept-Wing Jet Airframe"
 mdcw_bba_early_small_equipment:0 "Early Small Airframe"
 mdcw_bba_early_jet_equipment:0 "Early Jet Fighter Airframe"
