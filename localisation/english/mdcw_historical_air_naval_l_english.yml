 module_naval_mdcw_terrier_launcher_early:0 "Early Terrier-Era Missile Launcher"
 module_naval_mdcw_terrier_launcher_early_desc:0 "A deck-mounted early guided-missile launcher. It is compatible with the limited Terrier-era air-defence magazine."
 module_naval_mdcw_terrier_ammo_early:0 "Early Terrier-Era Air-Defence Missiles"
 module_naval_mdcw_terrier_ammo_early_desc:0 "A limited early shipboard surface-to-air missile magazine with modest attack strength."
 module_mdcw_early_fighter_guns:0 "Early Fighter Gun Armament"
 module_mdcw_early_fighter_guns_desc:0 "A modest machine-gun armament for early gun fighters. It enables air-superiority and interception missions without guided missiles."
 module_naval_mdcw_early_sonar:0 "Early Analogue Sonar"
 module_naval_mdcw_early_sonar_desc:0 "Basic analogue sonar offers limited submarine detection without microchip-based electronics."
 module_naval_mdcw_early_torpedoes:0 "Early Conventional Anti-Ship Torpedoes"
 module_naval_mdcw_early_torpedoes_desc:0 "Conventional torpedoes provide modest offensive capability for early destroyers and submarines. They carry no nuclear warheads or guided-missile systems."
