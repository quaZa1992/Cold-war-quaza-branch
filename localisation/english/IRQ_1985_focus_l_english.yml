l_english:
# IMPERIA CW — Cold War: Integrated IRQ 1985 focus — English localisation.
 IRQ_1985_focus: "Iraq 1985 Focus Tree"

 IRQ_1985_reconstruction_of_losses: "Reconstruction of Losses"
 IRQ_1985_reconstruction_of_losses_desc: "During the many confrontations our nation has faced, we've come to lose much of our industrial capacity. Reaching out to western powers might be beneficial."
 IRQ_1985_oil_fields_in_the_north: "Oil Fields in The North"
 IRQ_1985_oil_fields_in_the_north_desc: "The northern bits of our country host many untapped oil fields, and constructing new oil fields there will speed up our recovery process."
 IRQ_1985_oil_fields_in_the_south: "Oil Fields in The South"
 IRQ_1985_oil_fields_in_the_south_desc: "Despite being the center of oil extraction in our nation, the southern oil fields have been reduced to a lower capacity as a result of bombing campaigns by opposing forces. Reconstruction and revitalization will be necessary."
 IRQ_1985_authority_in_refineries: "Authority in Refineries"
 IRQ_1985_authority_in_refineries_desc: "By ensuring that our oil refineries have the right people overseeing their operations we can maximize profits and root out all forms of corruption."
 IRQ_1985_iranian_powerplants: "Iranian Powerplants"
 IRQ_1985_iranian_powerplants_desc: "The Iranian's have made recent improvements in their nuclear program, and be it peaceful or not, we could use their expertise to construct new powerplants in our nation for a better energy source."
 IRQ_1985_foreign_advisors: "Foreign Advisors"
 IRQ_1985_foreign_advisors_desc: "Calling in advisors from other nations could benefit us in the long run, as we get expert knowledge that we otherwise would not have had access to."
 IRQ_1985_investments_from_kuwait: "Investments From Kuwait"
 IRQ_1985_investments_from_kuwait_desc: "Despite our differences, we could really use investments from the Kuwaitis as a means to improve our economic situation."
 IRQ_1985_trade_with_syria: "Trade With Syria"
 IRQ_1985_trade_with_syria_desc: "Fostering trade with the Syrians, one of our oldest neighbors, could be useful in pushing for future regional trade networks."
 IRQ_1985_loans_from_neighbours: "Loans From Neighbors"
 IRQ_1985_loans_from_neighbours_desc: "In search of quick cash, we need to ask our neighbors for loans in order to make the nation bounce back."
 IRQ_1985_industrial_military_complex: "Take Advantage of the American MIC"
 IRQ_1985_industrial_military_complex_desc: "The American military industrial complex has vested much interest in our nation, and taking advantage of those benefits would be severely useful for us and our aspirations."
 IRQ_1985_chinese_investments: "Chinese Investments"
 IRQ_1985_chinese_investments_desc: "China is a looming power in the region, and we must utilize all and any form of support from them."
 IRQ_1985_a_new_day_in_baghdad: "A New Day in Baghdad"
 IRQ_1985_a_new_day_in_baghdad_desc: "§BA Breath of Fresh Air!§!\n\nA new day is upon Baghdad, where we can exhale freely without much stress. Our nation is thankfully on the road to total economic recovery in the coming years."
 IRQ_1985_a_resistance_economy: "A Resistance Economy"
 IRQ_1985_a_resistance_economy_desc: "The Iranians have shown that an economic model of resistance can be beneficial to any nation that wants to show the big powers that they don't need them!"
 IRQ_1985_circumventing_the_sanctions: "Brace for Sanctions"
 IRQ_1985_circumventing_the_sanctions_desc: "Just like the Iranians, we could be subject to future abuse by the large powers. We must prepare ourselves for any future sanctions that could be placed upon us."
 IRQ_1985_relying_on_our_strength: "Relying On Our Strength"
 IRQ_1985_relying_on_our_strength_desc: "We need not the strength of foreign powers, but the strength of Iraqi's and Iraqi patriots only."
 IRQ_1985_reverse_engineering: "Reverse Engineering"
 IRQ_1985_reverse_engineering_desc: "Instead of spending months or even years trying to compile a better form of producing something, we could just take apart those that have already been made in hopes of replicating its use."
 IRQ_1985_brothers_from_iran: "Brothers From Iran"
 IRQ_1985_brothers_from_iran_desc: "Though we've had our differences, the Iranians are our brothers from the East. We must build stronger relations in order to expand our cooperation and resistance against any and all foreign powers."
 IRQ_1985_the_black_market: "The Black Market"
 IRQ_1985_the_black_market_desc: "The black market is an untapped market with lots of economic potential, we must utilize this underground market to our advantage."
 IRQ_1985_state_sponsored_industries: "State Sponsored Industries"
 IRQ_1985_state_sponsored_industries_desc: "New industries cannot start with nothing, we must hand out grants to the industries who are trying to start up and bring prosperity to our nation."
 IRQ_1985_revive_damaged_companies: "Resurrect Dead Companies"
 IRQ_1985_revive_damaged_companies_desc: "Many companies died under the economic hardships that we've gone through in the past few years, it's about time that we kick start their lives once more."
 IRQ_1985_jihad_of_reconstruction: "Jihad of Reconstruction"
 IRQ_1985_jihad_of_reconstruction_desc: "Similar to the Iranian initiative, we will be putting an emphasis on rebuilding our nation through a call for reconstruction."
 IRQ_1985_jewel_of_resistance: "Jewel of Resistance"
 IRQ_1985_jewel_of_resistance_desc: "Our nation will be crowned as a jewel of resistance by nations under the oppression of foreign powers."
 IRQ_1985_exporting_the_resistance_economy: "Exporting the Resistance Economy"
 IRQ_1985_exporting_the_resistance_economy_desc: "Now that we've proved our economic worth to the world, we can find ways of exporting these ideals to those who may need it."
 IRQ_1985_oil_for_money: "Oil For Money"
 IRQ_1985_oil_for_money_desc: "We can exchange oil from rich oil fields in the south in exchange for money to others."
 IRQ_1985_support_the_scientists: "Support the Scientists"
 IRQ_1985_support_the_scientists_desc: "Our scientists are the ones at the forefront finding new and innovative ways of living life, we must support them in their endeavors where possible."
 IRQ_1985_an_economic_player: "An Economic Player"
 IRQ_1985_an_economic_player_desc: "No longer will Iraq be seen as just another nation on the map, but we will be seen as a true powerhouse, filled with prosperity and wealth."
 IRQ_1985_prioritize_industry: "Prioritize Industry"
 IRQ_1985_prioritize_industry_desc: "We must prioritize our industries, as moving towards a policy of urbanization will be most beneficial for reconstruction."
 IRQ_1985_prioritize_military: "Prioritize Military"
 IRQ_1985_prioritize_military_desc: "The military is an often overlooked advantage in many economies, as filling our ranks with troops who are equipped will ensure low unemployment."
 IRQ_1985_prioritize_services: "Prioritize Services"
 IRQ_1985_prioritize_services_desc: "The service industry is a rapidly growing one, and we can fill our nation with intellectuals who have been educated in their respective fields."
 IRQ_1985_the_national_recovery: "National Recovery"
 IRQ_1985_the_national_recovery_desc: "Now that we've put the worst behind us, the time for national recovery has come. Iraq must undergo an era of reconstruction, and reconciliation in the world."
 IRQ_1985_industrial_recovery: "Industrial Recovery"
 IRQ_1985_industrial_recovery_desc: "Our industries have been essentially reduced to rubble, and all industrial capacity in Iraq must be returned to its prior strength."
 IRQ_1985_reopening_trade_relations: "Reopening Trade Relations"
 IRQ_1985_reopening_trade_relations_desc: "We have been internationally isolated for some time now, and we must take steps to undo this status."
 IRQ_1985_an_economic_war: "An Economic War"
 IRQ_1985_an_economic_war_desc: "Though our troops are not engaging in direct confrontations with the enemies of our state, we are certainly engaged in an economic war of survival."
 IRQ_1985_our_own_military_industries: "Our Own Military Industries"
 IRQ_1985_our_own_military_industries_desc: "We cannot rely on foreign suppliers to arm our troops, it must be other Iraqi's who do so."
 IRQ_1985_state_above_all: "The State Above All"
 IRQ_1985_state_above_all_desc: "The security, safety, and prosperity of Iraq must be placated above all else."
 IRQ_1985_recovery_of_oil_reserves_in_south: "Rejuvenation of Oil Reserves in the South"
 IRQ_1985_recovery_of_oil_reserves_in_south_desc: "Oil fields in the south must essentially brought back to life following our period of turmoil."
 IRQ_1985_revive_major_industrial_sectors: "Revive Major Industrial Sectors"
 IRQ_1985_revive_major_industrial_sectors_desc: "Several industrial sectors had been destroyed throughout decades of mismanagement and conflicts, its about time that we revive these dead industries."
 IRQ_1985_state_owned_construction_corporations: "State Owned Corporations"
 IRQ_1985_state_owned_construction_corporations_desc: "We must kickstart state-owned construction companies that we could rely on to rebuild the Nation."
 IRQ_1985_negotiations_with_the_GCC: "Negotiations With The GCC"
 IRQ_1985_negotiations_with_the_GCC_desc: "The GCC is a growing economic bloc forming to the South, and we must start negotiations to benefit from this growth."
 IRQ_1985_revive_basra_port: "Revive Basra Port"
 IRQ_1985_revive_basra_port_desc: "The Basra port has been reduced to a shell of its former self, and we must revitalize this important port."
 IRQ_1985_ship_building_industry: "Ship Building Industry"
 IRQ_1985_ship_building_industry_desc: "The importance of the ship building industry cannot be overstated, we must look for new ways to bring back this dying industry back into the economic scene."
 IRQ_1985_russian_investments: "Russian Investments"
 IRQ_1985_russian_investments_desc: "The Russians have recently went through a major era of transformation, and it would be very beneficial to us to contact them in hopes of getting a new investor in Iraq."
 IRQ_1985_chinese_loans: "Chinese Loans"
 IRQ_1985_chinese_loans_desc: "§ROur Social Credit Score is High Enough!§!\n\nChina has been helping all other nations in the region with loans, why must Iraq be any difference to their treatment?"
 IRQ_1985_a_deal_with_the_devil: "A Deal With The Devil"
 IRQ_1985_a_deal_with_the_devil_desc: "The Chinese do not necessarily believe in any religion, but they do certainly believe in economic growth."
 IRQ_1985_just_like_babylonia: "Just Like Babylonia"
 IRQ_1985_just_like_babylonia_desc: "Just like Babylon, Iraq will be on its way to being a great power once more!"
 IRQ_1985_recovering_from_ninety_one: "The War Enters 1985"
 IRQ_1985_recovering_from_ninety_one_desc: "The struggle with Iran has consumed our treasury, our sons, and the attention of every ministry in Baghdad. Victory will not come from slogans alone; the state must put the war, the economy, and the party on one plan."
 IRQ_1985_the_american_pinch: "The Iranian Pressure"
 IRQ_1985_the_american_pinch_desc: "Iran is trying to bleed us on the front and in the Gulf. We must pull the economy tighter around the war effort, keep the merchant class loyal, and make every dinar serve survival."
 IRQ_1985_revolutionary_command_council: "The RCC"
 IRQ_1985_revolutionary_command_council_desc: "The Revolutionary Command Council must be called in to bind the ministries, the army, and the party to one wartime line."
 IRQ_1985_farming_regulations: "Wartime Farming Regulations"
 IRQ_1985_farming_regulations_desc: "The front cannot be supplied if the countryside follows its own rhythm. Quotas, transport priorities, and party supervision will keep grain moving toward the cities and the army."
 IRQ_1985_decree_three_o_seven: "Decree 307 Requisitions"
 IRQ_1985_decree_three_o_seven_desc: "Decree 307 will force land, fuel, and labor into wartime production, even if estate owners complain that Baghdad is taking too much."
 IRQ_1985_farming_incentives: "Ration Incentives"
 IRQ_1985_farming_incentives_desc: "The village must see a reason to keep producing while sons are called to the colors. Aid packages, seed stocks, and protected allocations will keep the harvest from collapsing."
 IRQ_1985_a_fed_population: "Feed the Home Front"
 IRQ_1985_a_fed_population_desc: "A hungry city questions the war before it questions the enemy. Stable food distribution will keep Baghdad, Basrah, and the garrison towns steady."
 IRQ_1985_arable_land_programme: "Southern Irrigation Programme"
 IRQ_1985_arable_land_programme_desc: "The southern provinces sit close to the fighting and the oil routes. Irrigation, drainage, and party-supervised land work can keep them useful despite the pressure."
 IRQ_1985_bread_lines: "War Ration Lines"
 IRQ_1985_bread_lines_desc: "Ration lines are not glorious, but they are order. Bread, fuel, and medicine must reach loyal citizens before scarcity becomes politics."
 IRQ_1985_negotations_with_syria: "Quiet Syrian Channels"
 IRQ_1985_negotations_with_syria_desc: "Damascus is no friend, but every closed border has a price and every rivalry has smugglers. Quiet contacts may reopen routes we cannot announce."
 IRQ_1985_renewed_oil_production: "War Oil Production"
 IRQ_1985_renewed_oil_production_desc: "Oil is our artillery before it becomes our revenue. Pumps, pipelines, and export routes must keep moving even while Iran threatens the Gulf."
 IRQ_1985_secret_shipments: "Soviet and Chinese Shipments"
 IRQ_1985_secret_shipments_desc: "The war cannot wait for perfect friends. Soviet stocks, Chinese factories, and quiet commercial channels can keep Iraqi depots filled."
 IRQ_1985_control_inflation: "Contain Wartime Inflation"
 IRQ_1985_control_inflation_desc: "War spending is flooding the economy. Price controls, ration books, and selective subsidies can slow the damage before discontent reaches the barracks."
 IRQ_1985_seize_unproductive_fields: "Seize Unproductive Fields"
 IRQ_1985_seize_unproductive_fields_desc: "Fields left idle in wartime are a political problem. We will seize what is unused and hand it to those who can feed the state."
 IRQ_1985_iraqi_perserverence: "Iraqi Perseverance"
 IRQ_1985_iraqi_perserverence_desc: "The war is long, but the people must believe Iraq can endure longer. Discipline, propaganda, and visible relief will keep the home front upright."
 IRQ_1985_recovery_from_the_gulf: "The Southern Front"
 IRQ_1985_recovery_from_the_gulf_desc: "Basrah, the marshes, and the oil roads are not a rear area; they are the hinge of the war. We must fortify and repair the south while the fighting continues."
 IRQ_1985_brick_by_brick: "Repair the Southern Roads"
 IRQ_1985_brick_by_brick_desc: "Convoys, ambulances, and artillery columns need roads before they need speeches. Brick by brick, the southern routes will be kept open."
 IRQ_1985_water_purification: "Protect the Waterworks"
 IRQ_1985_water_purification_desc: "Water systems near the front are strategic assets. Purification, repair teams, and protected pumping stations will keep civilians and soldiers supplied."
 IRQ_1985_prop_up_basrah: "Prop Up Basrah"
 IRQ_1985_prop_up_basrah_desc: "Basrah carries the weight of the war. Housing, offices, ports, and party institutions must be reinforced before fear and shelling empty the city."
 IRQ_1985_iraqi_vehicle_production: "War Vehicle Production"
 IRQ_1985_iraqi_vehicle_production_desc: "Every repaired truck is a supply column, every adapted chassis a battlefield tool. Iraqi workshops must serve the front first."
 IRQ_1985_restoration_of_defensive_lines: "Restoration of Defensive Lines"
 IRQ_1985_restoration_of_defensive_lines_desc: "The Iranian army has tested every weakness along the frontier. Defensive lines in the north and around the approaches to the south must be restored at once."
 IRQ_1985_reconstruction_of_tuwaitha: "Tuwaitha Under Watch"
 IRQ_1985_reconstruction_of_tuwaitha_desc: "Tuwaitha has already drawn Israeli and Iranian attention. Whatever can be recovered must be protected, hidden, and tied to the needs of the state."
 IRQ_1985_repair_nuclear_reactors: "Restart Sensitive Facilities"
 IRQ_1985_repair_nuclear_reactors_desc: "Our scientific infrastructure cannot remain frozen because the enemy is watching. Repairs will continue under military supervision."
 IRQ_1985_future_of_the_party: "Wartime Party-State"
 IRQ_1985_future_of_the_party_desc: "The Ba'ath Party enters 1985 as the frame holding the army, economy, and security services together. Exhaustion, Kurdish revolt, and the Iranian front leave no room for divided command."
 IRQ_1985_at_the_cross_roads: "Secular Ba'athism and the Clergy"
 IRQ_1985_at_the_cross_roads_desc: "Baghdad cannot allow revolutionary Iran to monopolize religion, but it also cannot surrender the secular Ba'athist state. Clerics, tribal notables, and party commissars must all be kept inside the regime's war line."
 IRQ_1985_blood_fuels_innovation: "Emergency Military Research"
 IRQ_1985_blood_fuels_innovation_desc: "Every failed offensive, missile strike, and ruined vehicle is a lesson. The Military Industrial Commission will turn battlefield pressure into repaired weapons, new munitions, and improvised industry."
 IRQ_1985_the_space_program: "Missile Prestige Programme"
 IRQ_1985_the_space_program_desc: "Iraq's long-range ambitions are not separate from the war. Rockets, satellites, and prestige projects all serve the same purpose: proving that Baghdad can still reach beyond the trenches."
 IRQ_1985_the_nuclear_program: "Tuwaitha's Shadow"
 IRQ_1985_the_nuclear_program_desc: "Osirak is gone, but Tuwaitha and the scientific networks around it remain politically valuable. The programme must be hidden, guarded, and folded into the regime's strategic patience."
 IRQ_1985_a_new_energy_source: "Civilian Cover for Sensitive Work"
 IRQ_1985_a_new_energy_source_desc: "Civilian reactors, power infrastructure, and protected research sites give Baghdad a reason to rebuild facilities that the enemy would prefer to keep broken."
 IRQ_1985_acquire_the_resources: "Procure Restricted Materials"
 IRQ_1985_acquire_the_resources_desc: "Sanctions, surveillance, and wartime shortages make direct procurement impossible. Front companies and loyal intermediaries will secure what the state cannot buy openly."
 IRQ_1985_experts_in_the_field: "Protect the Scientists"
 IRQ_1985_experts_in_the_field_desc: "Scientists, engineers, and technicians are strategic assets. They must be protected from enemy strikes, watched by security services, and pushed to serve the war state."
 IRQ_1985_saddamism: "Saddam's Wartime Command"
 IRQ_1985_saddamism_desc: "Saddam Hussein is not simply the president in 1985; he is the symbol that the army, party, and state are ordered around. Victory, discipline, and fear must all point upward."
 IRQ_1985_the_states_hand: "Mukhabarat Files"
 IRQ_1985_the_states_hand_desc: "The state must know who serves, who doubts, and who waits. Intelligence files, party committees, and military security will bind the country to Baghdad's war effort."
 IRQ_1985_outlaw_opposition: "Crush Internal Opposition"
 IRQ_1985_outlaw_opposition_desc: "Dawa networks, communist remnants, Kurdish cells, and army doubters cannot be allowed to treat wartime exhaustion as an opening. Opposition will be driven underground or destroyed."
 IRQ_1985_the_baathist_party: "The Ba'athist War State"
 IRQ_1985_the_baathist_party_desc: "The party, the presidency, and the army must speak with one voice while Iran tries to outlast us. The Ba'ath state will become the frame that holds Iraq together."
 IRQ_1985_restore_faith_in_army: "Restore Faith in the Army"
 IRQ_1985_restore_faith_in_army_desc: "Years of grinding war have tested confidence in the army. Promotions, supplies, and public ceremonies will remind Iraq that the army remains the shield of the republic."
 IRQ_1985_bypass_un_sanctions: "Bypass Arms Restrictions"
 IRQ_1985_bypass_un_sanctions_desc: "No arsenal stays full by waiting for permission. Procurement offices, intelligence channels, and front companies will bring in what the army needs."
 IRQ_1985_politicization_of_islam: "Faith Under Party Supervision"
 IRQ_1985_politicization_of_islam_desc: "The regime cannot ignore Islam while fighting the Islamic Republic, but religion must remain supervised by the party. Mosques, clerics, and public piety will serve Iraqi nationalism, not Tehran."
 IRQ_1985_continuation_of_oil_for_food: "Oil for the Front"
 IRQ_1985_continuation_of_oil_for_food_desc: "Oil revenue must become ammunition, food, medicine, and spare parts. Every barrel sold through loyal channels is another day the front can hold."
 IRQ_1985_medicinal_focus: "Medicine for the War"
 IRQ_1985_medicinal_focus_desc: "Hospitals and field stations are under strain. Medicine must be prioritized before disease and untreated wounds do what Iran cannot."
 IRQ_1985_food_focus: "Food for the War"
 IRQ_1985_food_focus_desc: "The army and the cities need bread before they need promises. Food allocations will be tied directly to the war effort."
 IRQ_1985_rennovation_of_baiji_refinery: "Secure Baiji Refinery"
 IRQ_1985_rennovation_of_baiji_refinery_desc: "Baiji is too important to be treated as ordinary industry. Its fuel, storage, and repair capacity will be protected and expanded for wartime needs."
 IRQ_1985_renovate_baghdad_airport: "Militarize Baghdad Airport"
 IRQ_1985_renovate_baghdad_airport_desc: "Baghdad's airport must handle military cargo, wounded officers, and urgent diplomatic flights. Civil standards can wait; wartime throughput cannot."
 IRQ_1985_restoration_of_hospitals: "Wartime Hospital Restoration"
 IRQ_1985_restoration_of_hospitals_desc: "Hospitals in the interior and near the southern routes must be restored for casualties, civilians, and party legitimacy alike."
 IRQ_1985_the_cult_of_saddam: "Cult of the Wartime Leader"
 IRQ_1985_the_cult_of_saddam_desc: "Portraits, songs, schools, and army ceremonies will present Saddam as the man who absorbs the strain of the war and returns it as resolve. The cult is propaganda, discipline, and warning at once."
 IRQ_1985_hosting_other_groups: "Host Tehran's Enemies"
 IRQ_1985_hosting_other_groups_desc: "Iran shelters Kurdish allies and broadcasts revolution across the border. Baghdad will answer by hosting Iranian opposition groups and building its own tools of pressure."
 IRQ_1985_mojahedin_khalq: "Mojahedin-e Khalq"
 IRQ_1985_mojahedin_khalq_desc: "The MEK or Mojahedin-e Khalq is one of the longest standing opponents of the Islamic Republic, and one of our allies that we have made along the way. By utilizing them, we can open another pressure point against Tehran."
 IRQ_1985_pij: "Palestinian Islamist Contacts"
 IRQ_1985_pij_desc: "Palestinian Islamist networks are not yet a decisive instrument, but they give Baghdad another channel for prestige, pressure, and deniable politics beyond the Iranian front."
 IRQ_1985_antagonize_israel: "Remember Osirak"
 IRQ_1985_antagonize_israel_desc: "Israel's strike on Osirak still shapes Baghdad's strategic mind. Iraq cannot hit Israel directly, but it can keep the issue alive through rhetoric, contacts, and regional pressure."
 IRQ_1985_antagonize_iran: "Tighten the Iranian Pressure"
 IRQ_1985_antagonize_iran_desc: "Tehran is bleeding on the southern front and probing the Kurdish north. Baghdad must answer on every channel: army, intelligence, propaganda, and exile opposition."
 IRQ_1985_ministry_of_education: "War Curriculum"
 IRQ_1985_ministry_of_education_desc: "Classrooms will teach sacrifice, Arab nationalism, and loyalty to the republic. A generation growing up under sirens and funerals must be taught what the war is supposed to mean."
 IRQ_1985_culture_of_fear: "Security State Discipline"
 IRQ_1985_culture_of_fear_desc: "Fear is a weapon the state already understands. Officers, students, party cadres, and merchants must know that defeatism is not a private opinion in wartime."
 IRQ_1985_resisting_imperialism: "Anti-Imperialist War Narrative"
 IRQ_1985_resisting_imperialism_desc: "The regime will frame the war as Iraq standing between the Arab world and foreign-backed chaos: Iranian revolution, Israeli sabotage, and Western hypocrisy all in one story."
 IRQ_1985_udays_problems: "The President's Sons"
 IRQ_1985_udays_problems_desc: "Uday and Qusay are still young, but the palace already understands that family politics can become state politics. The war gives them visibility before it gives them wisdom."
 IRQ_1985_future_successor: "Elevate Uday"
 IRQ_1985_future_successor_desc: "Uday's cruelty can be sold as resolve if the state needs a hard symbol for the next generation. That choice will not make him safer, only louder."
 IRQ_1985_designate_qussay: "Prepare Qusay"
 IRQ_1985_designate_qussay_desc: "Qusay's quieter discipline may serve the security state better than Uday's spectacle. Preparing him early gives the regime a more controllable family option."
 IRQ_1985_an_era_of_saddam: "Victory Through Saddam"
 IRQ_1985_an_era_of_saddam_desc: "Every front, every ration line, and every creditor must be told the same story: Iraq survives because Saddam commands, and Saddam commands because Iraq must survive."
 IRQ_1985_assertive_domination: "Assertive Domination"
 IRQ_1985_assertive_domination_desc: "Some nations simply cannot comprehend diplomacy. It is because of this, that we must assert our dominance and power over them to make them know their place."
 IRQ_1985_reintegration_of_kurdistan: "Pacify Iraqi Kurdistan"
 IRQ_1985_reintegration_of_kurdistan_desc: "If the KDP and PUK front collapses, Baghdad will inherit a second war beneath the surface: smugglers, party cells, mountain families, and Iranian border routes. Pacification will be a system, not a speech."
 IRQ_1985_kuwaiti_traitors: "Revisit the Kuwaiti Traitors"
 IRQ_1985_kuwaiti_traitors_desc: "Kuwait betrayed the Arab people by allowing western imperialists kill thousands of Iraqi soldiers by giving them free access to their bases. Now, they will and must pay the price for their actions."
 IRQ_1985_liberate_arabs_in_khuzestan: "Arab's in Arabistan"
 IRQ_1985_liberate_arabs_in_khuzestan_desc: "Arabistan, or Khuzestan now as the Iranians call it, is a rightful and legitimate Iraqi state that was captured by the Iranians. We must liberate the Arabs residing in Arabistan, and bring their long deserved freedom."
 IRQ_1985_cooperative_domination: "Cooperative Domination"
 IRQ_1985_cooperative_domination_desc: "Ruling through one iron fist will put a strain on our system. We must instate those amongst our own ranks to guide the future of our regional partners."
 IRQ_1985_proposal_to_syria: "Promote Al-Douri"
 IRQ_1985_proposal_to_syria_desc: "Once Saddam's right hand man, Al-Douri will now be responsible for leading the Ba'ath Party of Syria, after toppling [SYR.GetLeader]. For far too long have the Syrians been misguided by those who claim to be part of the Ba'ath movement.."
 IRQ_1985_proposal_to_jordan: "Contact Al-Homsi"
 IRQ_1985_proposal_to_jordan_desc: "The leader of the Jordanian Ba'ath party is a trustable, and humble man. We will throw our full support behind him and his group of supporters by arming them and sending over a few Iraqi troops to aid with the overthrow of [JOR.GetLeader]."
 IRQ_1985_egyptian_union_project: "A Job for Tariq Aziz"
 IRQ_1985_egyptian_union_project_desc: "Tariq Aziz has a certain charisma, and we can exploit it to export a Ba'ath revolution in Egypt, bringing about the end of the degenerate [EGY.GetLeader]."
 IRQ_1985_liberation_of_the_quds: "Liberation of The Quds"
 IRQ_1985_liberation_of_the_quds_desc: "The Israeli state will be no more, as our troops will march into Jerusalem and reclaim it for the true heirs of al-Quds!"
 IRQ_1985_indirect_domination: "Indirect Domination"
 IRQ_1985_indirect_domination_desc: "Ruling directly will only make those we oversee only angrier. We must rule the region through economic means, by exploiting the corruption found in societies that border our nation."
 IRQ_1985_obtain_aramco: "All Eyes on Aramco"
 IRQ_1985_obtain_aramco_desc: "The primary oil company of [SAU.GetName], Aramco, is an economic cash-cow for [SAU.GetName]. By sketching up an elaborate plan, we will be able to consolidate de-facto control over the organization."
 IRQ_1985_exploit_bahraini_corruption: "Exploit Bahraini Corruption"
 IRQ_1985_exploit_bahraini_corruption_desc: "Our loyal supporters and followers of the Ba'ath ideology in Bahrain have been awaiting our presence there for a very long time now. It's only a matter of time before we can topple their corrupt leader, [BHR.GetLeader] and install our righteous compatriot in their place."
 IRQ_1985_iraqi_armed_forces: "Iraqi Armed Forces"
 IRQ_1985_iraqi_armed_forces_desc: "The Iraqi Armed Forces (IAF) were established with the goals of defending Iraq's territorial integrity. Since then, the army has expanded into one of the largest in the world, and has several branches assigned to it."
 IRQ_1985_coastal_defense_force: "Coastal Defense Force"
 IRQ_1985_coastal_defense_force_desc: "The Coastal Defense force is what remains of our navy and naval force, especially after it was reduced to nothing by the attacks ran against us by the Americans and Iranians."
 IRQ_1985_lessons_from_gulf_war: "Lessons From Gulf War"
 IRQ_1985_lessons_from_gulf_war_desc: "The Gulf War must be used as a learning experience, at least as much as it could be. We must reflect on what we lost, where we lost, and how we lost in order to figure out ways to not repeat the same mistakes again."
 IRQ_1985_commission_reconstruction_of_tariq_ibn_ziyad: "Reconstruction of Tariq Ibn Ziyad"
 IRQ_1985_commission_reconstruction_of_tariq_ibn_ziyad_desc: "The Tariq Ibn Ziyad (F212) will be our state of the art corvette which will be at the forefront of all enemies that try to threaten our troops at sea."
 IRQ_1985_recruitment_of_new_admirals: "Recruitment of New Admirals"
 IRQ_1985_recruitment_of_new_admirals_desc: "New admirals will be necessary for us to develop a cohesive naval command structure, and finding the right one will take time."
 IRQ_1985_iraqi_ground_forces: "Iraqi Ground Forces"
 IRQ_1985_iraqi_ground_forces_desc: "The Iraqi Ground Forces were essentially created by the British as a means to sustain their colonial grip over the Iraqi nation. However, over time, the IGF has developed into a (somewhat) capable fighting force, with lots of need for reform."
 IRQ_1985_domestic_program: "Domestic Program"
 IRQ_1985_domestic_program_desc: "Our reliance on foreign suppliers will be the end of us, it is imperative that we switch to domestic production."
 IRQ_1985_expansion_of_missile_program: "Expansion of Missile Program"
 IRQ_1985_expansion_of_missile_program_desc: "Our strength will be vested into our missiles, and the range of our missiles. We will commission the creation of next and innovative missiles as soon as possible."
 IRQ_1985_strategic_launching_installations: "Strategic Launching Installations"
 IRQ_1985_strategic_launching_installations_desc: "Where would our newly acquired missiles be deployed to if not in a brand new silo?"
 IRQ_1985_al_samoud_missile: "Al Samoud Missile"
 IRQ_1985_al_samoud_missile_desc: "The Al Samoud missile will be developed with a similarity to the Scud missiles developed by the Russians. Hopefully these new missiles are effective in deterring our enemies..."
 IRQ_1985_tabuk_sniper_rifle: "Tabuk Sniper Rifle"
 IRQ_1985_tabuk_sniper_rifle_desc: "The Tabuk rifle will be our very own domestically produced sniper rifle that will allow our troops to pick out our enemies from afar, one by one."
 IRQ_1985_grants_for_rustamiyah: "Grants For Rustamiyah"
 IRQ_1985_grants_for_rustamiyah_desc: "British forces founded the Iraqi Military Academy at Rustamiyah in 1924 to train officers for the newly established Royal Iraqi Army, and based it on the Royal Military Academy in Sandhurst, England. The first class of Iraqi officers graduated in 1927."
 IRQ_1985_convential_warfare: "Conventional Warfare"
 IRQ_1985_convential_warfare_desc: "We cannot stray too far from conventional tactics, as we simply cannot risk putting operational integrity at risk."
 IRQ_1985_assymetrical_focus: "Asymmetrical Focus"
 IRQ_1985_assymetrical_focus_desc: "Asymmetrical warfare will let more of our troops survive, simple as that. We cannot risk losing more men to an enemy who has far superior technology, we must overcome their advantage."
 IRQ_1985_umm_qasr_naval_base: "Umm Qasr Port"
 IRQ_1985_umm_qasr_naval_base_desc: "The Umm Qasr Port is Iraq's second biggest port in scale of size and goods shipped, ranking behind the port of Basra, it is strategically important, located on the western edge of the al-Faw peninsula, where the mouth of the Shatt al Arab waterway enters the Persian Gulf."
 IRQ_1985_fortification_of_gulf: "Fortification of Gulf"
 IRQ_1985_fortification_of_gulf_desc: "Fortifying our coast will be an absolute necessity if we are to last past a couple of years during a war."
 IRQ_1985_recruitment_of_new_engineers: "Recruitment of New Engineers"
 IRQ_1985_recruitment_of_new_engineers_desc: "We need new engineers to maintain, and repair our naval assets at all times."
 IRQ_1985_expand_arabic_gulf_academy: "Expand Arabic Gulf Academy"
 IRQ_1985_expand_arabic_gulf_academy_desc: "The Arabic Gulf Academy will be expanded to encompass a variety of new recruits to enlist into our Navy."
 IRQ_1985_iraqi_airforce: "Iraqi Air force"
 IRQ_1985_iraqi_airforce_desc: "The Iraqi Air force is the aerial warfare service branch of the Iraqi Armed Forces. It is responsible for the defense of Iraqi airspace as well as the policing of its international borders"
 IRQ_1985_qayyarah_airbase: "Qayyarah Airbase"
 IRQ_1985_qayyarah_airbase_desc: "Qayyarah West AB was built in the late 1970s and was one of several Iraqi Air Force airfields of the 1970s which were re-built under project Super-Base in response to experiences from the Arab-Israeli wars in 1967 and 1973."
 IRQ_1985_protect_the_skies: "Protect The Skies"
 IRQ_1985_protect_the_skies_desc: "By protecting our skies, we can protect our troops, people, and cities. If we fail at this task then success will never be ours in any operation."
 IRQ_1985_comprehensive_radar_installations: "Comprehensive Radar Installations"
 IRQ_1985_comprehensive_radar_installations_desc: "We need to re-evaluate where we install our radar systems, as they are not very effective as it currently stands."
 IRQ_1985_tikrit_air_academy: "Tikrit Air Academy"
 IRQ_1985_tikrit_air_academy_desc: "Tikrit Air Academy was is one of several Iraqi Air Force airfields initially built in the mid-1970s which were re-built under project Super-Base in response to the experiences from Arab-Israeli wars in 1967 and 1973."
 IRQ_1985_ask_iran_to_return_planes: "Ask Iran To Return Planes"
 IRQ_1985_ask_iran_to_return_planes_desc: "We flew in several planes into Iran during the Gulf war, as the Iranians had promised to keep them safe for us until we could ask for them back. The time is now, and we must send in our formal request."
 IRQ_1985_yugoslav_mig_servicing: "MiG Servicing"
 IRQ_1985_yugoslav_mig_servicing_desc: "We need to get our MiG's serviced in order to ensure they are fully operational, and combat ready."
 IRQ_1985_bosnian_parts: "Bosnian Parts"
 IRQ_1985_bosnian_parts_desc: "Bosnia is surprisingly one of the only nations we can get our parts from, but the quality and reliability of them is quite unknown to us."
 IRQ_1985_the_national_accord: "The National Accord"
 IRQ_1985_the_national_accord_desc: "The National Accord was founded at the time of the Persian Gulf War as an opposition group to Saddam Hussein. At that time, the two most active anti-Saddam groups were the SCIRI and al-Dawa; both were Islamic Shi'ite parties, originating from Iraq, but operating from Iran from which they received support."
 IRQ_1985_digitalization_of_iraq: "Digitalization of Iraq"
 IRQ_1985_digitalization_of_iraq_desc: "For Iraq to advance into the 21st century with pride and success, we must first ensure the nation is digitalized and ready to hold up proper network infrastructures."
 IRQ_1985_rural_networks: "Rural Networks"
 IRQ_1985_rural_networks_desc: "Those who reside in rural areas absolutely need internet, because currently as it stands right now, they have little to no coverage."
 IRQ_1985_national_networks: "National Networks"
 IRQ_1985_national_networks_desc: "We must launch investigations into the areas who currently hold no form of internet coverage, and list them as designated areas of interest so that we may be able to go back to work on."
 IRQ_1985_bring_in_tech_companies: "Bring in Tech Companies"
 IRQ_1985_bring_in_tech_companies_desc: "In order to create more jobs for our people, we need to make the nation appeal to foreign companies, especially the rapidly growing tech giants."
 IRQ_1985_general_security_directorate: "General Security Directorate"
 IRQ_1985_general_security_directorate_desc: "Establishing a security and intelligence office will be beneficial in thwarting any and all national security threats posed to our nation."
 IRQ_1985_protection_from_our_neighbors: "Protection From Our Neighbors"
 IRQ_1985_protection_from_our_neighbors_desc: "We cannot have true peace of mind when we know that our neighbors could turn on us at any moment, we must ensure that we are secured from all sides."
 IRQ_1985_protection_from_evildoers: "Protection From Evildoers"
 IRQ_1985_protection_from_evildoers_desc: "There are those who wish harm on the Iraqi nation and its people, and we must begin to create security measures against these individuals."
 IRQ_1985_security_of_all_iraqis: "The Security of all Iraqi's"
 IRQ_1985_security_of_all_iraqis_desc: "The Security of All Iraqi's is priority #1, and we cannot overlook it's importance. If our people are in constant danger, then our government has failed in it's basic duty."
 IRQ_1985_consulting_our_allies: "Consulting Our Allies"
 IRQ_1985_consulting_our_allies_desc: "We must contact our allies to negotiate new deals that would help build Iraq to its true potential!"
 IRQ_1985_request_financial_relief: "Request Financial Relief"
 IRQ_1985_request_financial_relief_desc: "We have been under serious financial stress and burden for the past few years, and getting some form of financial relief will assist our recovery process greatly."
 IRQ_1985_security_training: "Security Training"
 IRQ_1985_security_training_desc: "We cannot have clueless officers and personnel roaming the streets inspecting trash cans, we must ensure they are properly trained, and well educated in their profession."
 IRQ_1985_rebuilding_iraq_together: "Rebuilding Iraq Together"
 IRQ_1985_rebuilding_iraq_together_desc: "Iraq cannot be rebuilt alone, Iraq must be rebuilt by it's friends and occupants. A future where Iraq is prosperous and peaceful is one where the world can breath in peace."
 IRQ_1985_restructure_school_curriculum: "Restructure School Curriculum"
 IRQ_1985_restructure_school_curriculum_desc: "The school system under Saddam Husseins regime destroyed countless minds by it's propaganda. If we want to prevent an ideological disaster from brewing in our nation, we must take steps to reverse this damage by restructuring our Schools."
 IRQ_1985_grants_for_schools: "Grants For Schools"
 IRQ_1985_grants_for_schools_desc: "To aid our current campaign of restructuring our school curriculums, we need to allocate a certain amount of money to make sure that the schools meet these basic demands."
 IRQ_1985_increase_accountability: "Increase Accountability"
 IRQ_1985_increase_accountability_desc: "Instructors must be kept accountable for their actions. Under the Ba'athist regime, countless teachers abused students and partook in acts of corruption through bribery or other means."
 IRQ_1985_tighten_sanitation_standards: "Tighten Sanitation Standards"
 IRQ_1985_tighten_sanitation_standards_desc: "The sanitary situation in many schools is less than desirable as it currently stands. If we want to prevent sickness and disease from spreading, we must enforce some sort of new standards."
 IRQ_1985_restructure_iraqi_police: "Restructure the Police Force"
 IRQ_1985_restructure_iraqi_police_desc: "The next step in solving the corruption that is currently running rampant in our state is to restructure the police force. This can be done with some difficulty, but at the end it will pay off."
 IRQ_1985_free_and_fair_judicial_system: "Free and Fair Judicial System"
 IRQ_1985_free_and_fair_judicial_system_desc: "Our judicial system is currently riddled with corruption. We need to begin investigations in judges that have stayed since the Ba'athist regime to ensure they don't partake in any corrupt activities."
 IRQ_1985_consequences_for_bribery: "Consequences For Bribery"
 IRQ_1985_consequences_for_bribery_desc: "Bribery must come with greater consequences, because right now most of our higher ranking officers often look the other way when met with accusations of bribery."
 IRQ_1985_cooperation_with_army: "Cooperation With Army"
 IRQ_1985_cooperation_with_army_desc: "The army will be crucial in rebuilding the nation, as they will be used to ensure general safety in the streets."
 IRQ_1985_equality_above_all: "Equality Above All"
 IRQ_1985_equality_above_all_desc: "We cannot impede equality in our attempt to rebuild Iraq, as equality is just the first step to a new and better Iraq."
 IRQ_1985_national_congress: "National Congress"
 IRQ_1985_national_congress_desc: "The Iraqi National Congress was set up following the Persian Gulf War to coordinate the activities of various anti-Saddam groups. Then President George H. W. Bush signed a presidential finding directing the Central Intelligence Agency to create conditions for Saddam's removal in May 1991."
 IRQ_1985_from_all_walks_of_life: "From All Walks of Life"
 IRQ_1985_from_all_walks_of_life_desc: "We need to unite Iraqi's from all walks of life in order to restore faith in our national identity, and sense of self."
 IRQ_1985_kurdish_cooperation: "Kurdish Cooperation"
 IRQ_1985_kurdish_cooperation_desc: "Kurd's build up a large percentage of our nations ethnic mix. We need to reconcile with the Kurdish forces in the North East in order to prove we are not the same regime as before."
 IRQ_1985_the_ironclad_coalition: "The Iron-clad Coalition"
 IRQ_1985_the_ironclad_coalition_desc: "To fight back against any form of Ba'ath resurgence, we must determine the future of our promised coalition."
 IRQ_1985_a_new_iraqi_society: "A New Iraqi Society"
 IRQ_1985_a_new_iraqi_society_desc: "Kickstarting a new movement to phase out the ideas of the past will be incredibly beneficial to the survival of the state, and that movement must begin now!"
 IRQ_1985_upholding_the_constitution: "Upholding The Constitution"
 IRQ_1985_upholding_the_constitution_desc: "The constitution will not and has not been written in vain, it must be upheld and reinforced to ensure the rule of law is above all else."
 IRQ_1985_reaffirm_democratic_institutions: "Reaffirm Democratic Institutions"
 IRQ_1985_reaffirm_democratic_institutions_desc: "Without our support, democratic institutions will start to slowly fall apart and our state will slip back into the same autocratic cycle that it had been in for the past few decades."
 IRQ_1985_separation_of_mosque_and_state: "Separation of Mosque and State"
 IRQ_1985_separation_of_mosque_and_state_desc: "The mosque must not dictate the actions of the state, as our government must be free from any form of clerical influence that may be exerted towards us."
 IRQ_1985_justice_prevails: "Will Justice Prevail?"
 IRQ_1985_justice_prevails_desc: "Those responsible for causing problems in our nation must be held accountable. The Kurds have been smuggling lots and lots of drugs over the border recently, and not much has been done to prevent it.."
 IRQ_1985_iraqi_free_forces: "Free Iraqi Forces"
 IRQ_1985_iraqi_free_forces_desc: "The Free Iraqi Forces (IFR) are our party's militia wing, having been formed by Iraqi expatriate ready at a minutes notice to defend Iraq."
 IRQ_1985_anti_saddam_sentiment: "Anti-Ba'ath Sentiment"
 IRQ_1985_anti_saddam_sentiment_desc: "We can't slip back into another era of ba'athism, and we certainly cannot have anyone reminacing about those days."
 IRQ_1985_ali_bin_al_husseins_request: "Ali Bin al-Husseins Request"
 IRQ_1985_ali_bin_al_husseins_request_desc: "Basically the spokesmen for the former monarchy, al-Hussein has continuously pushed for some form of monarchy, rooting for the current claimant to the throne, Ra'ad bin Zeid."
 IRQ_1985_counter_iranian_militias: "Counter Iranian Militias"
 IRQ_1985_counter_iranian_militias_desc: "Iran has boosted its presence through the use of militias and armed groups in an attempt to consolidate soft control over Iraq. We must curb this presence by all means necessary."
 IRQ_1985_integration_to_armed_forces: "Integration To Armed Forces"
 IRQ_1985_integration_to_armed_forces_desc: "It is time that we integrate the IFR into the Iraqi army in order to cut back on costs, and push for better cooperation."
 IRQ_1985_enforced_discipline: "Enforced Discipline"
 IRQ_1985_enforced_discipline_desc: "We need to keep our troops in line in order to ensure that no one oversteps their boundaries. This way we'll also have more polished and conditioned troops."
 IRQ_1985_exploit_american_presence: "Exploit American Presence"
 IRQ_1985_exploit_american_presence_desc: "We cannot let the American presence in the nation go untapped, we must use their resources to our benefit."
 IRQ_1985_mobilize_sadrs_forces: "Mobilize Sadrist Forces"
 IRQ_1985_mobilize_sadrs_forces_desc: "Through political negotiations, we must strike a deal with the Sadrist forces to support the reinforcement of the new system and government."
 IRQ_1985_restrictions_on_american_army: "Restrictions On American Army"
 IRQ_1985_restrictions_on_american_army_desc: "We cannot let the American simply army do as they wish, there must be clear boundaries and restrictions set which they must not cross."
 IRQ_1985_counter_cia_intel: "Counter CIA Intel"
 IRQ_1985_counter_cia_intel_desc: "Using CIA intel against them will certainly set them off, but it will be beneficial in the long run if we can thwart their plans to destabilize Iraq or the region."
 IRQ_1985_the_american_spring_board: "The American Spring Board"
 IRQ_1985_the_american_spring_board_desc: "The Americans are using our nation as a spring board into the middle east, and taking advantage of this position will let us achieve our regional ambitions fairly quickly."
 IRQ_1985_cia_safe_haven: "CIA Safe Haven"
 IRQ_1985_cia_safe_haven_desc: "The CIA will be more than welcome to operate in Iraq, as long as they promise to employ Iraqi's and boost the nations employment."
 IRQ_1985_meddling_in_khuzestan: "Meddling in Ahwaz"
 IRQ_1985_meddling_in_khuzestan_desc: "Ahwazi Arabs need to be nudged to revolt against the tyrannical Iranian government, and using our newly gain intel and skills we will arm the Arabs in the East to deal a blow to the Iranian government."
 IRQ_1985_al_dawa: "Al Dawa"
 IRQ_1985_al_dawa_desc: "The Dawa movement coalesced in the years around 1960 in Shia holy cities in southern Iraq. At the time, its primary goal was to counterbalance the intellectual hold that Marxism and other secular ideologies had on Iraqi Shia. However, the group started shifting their focus towards Saddam and the threat during his rise that he posed to the Shia population."
 IRQ_1985_status_quo_in_najaf: "Clerical Cooperation"
 IRQ_1985_status_quo_in_najaf_desc: "The clerics in Iran need to come over to Iraq and begin preach their wisdom, in the holy city of Najaf where will be holding state sponsored sermons."
 IRQ_1985_secret_iranian_backing: "Secret Iranian Backing"
 IRQ_1985_secret_iranian_backing_desc: "We cannot do the difficult task of governing the country all by ourselves, we need the Iranians to give us a much needed boost for our budget to be allocated effectively."
 IRQ_1985_empowering_shiites: "Empowering Shi'ites"
 IRQ_1985_empowering_shiites_desc: "Empowering Shi'ites will ensure that the majority in Iraq thrive, and are accurately represented by their government. We will also be able to push our political goals into effect with much more ease."
 IRQ_1985_the_partys_coffers: "The Party's Coffers"
 IRQ_1985_the_partys_coffers_desc: "Our party holds some.. questionable connections. As a result, we've got quite a few different ways to make money to fill our coffers."
 IRQ_1985_reduce_the_power_of_sunnis: "Reduce the Power of Sunni's"
 IRQ_1985_reduce_the_power_of_sunnis_desc: "The detrimental effect that the Ba'ath regime had on the bolster of Sunni power is still being felt. The Sunni are considered a minority in our nation, and without proper checks they will disregard everyone else in the search to fulfill their own ambitions."
 IRQ_1985_reroute_kurdish_funds: "Re-route Kurdish Funds"
 IRQ_1985_reroute_kurdish_funds_desc: "The Americans are sending bi-weekly packages to the Kurds through convoys in our nation. Luckily, these trucks are not operated by Americans but rather Iraqi's, so all we have to do is ask the truck to turn around.."
 IRQ_1985_root_out_traitor_generals: "Root Out Untrustworthy Generals"
 IRQ_1985_root_out_traitor_generals_desc: "There are some generals who appear to still have some form of sympathies towards the old order, even if they don't show it."
 IRQ_1985_sectarian_wave: "Sectarian Wave"
 IRQ_1985_sectarian_wave_desc: "It's time that we bring about the sectarian wave, using our supporters and followers to suppress all forms of dissent against our government and establishment."
 IRQ_1985_improvements_for_shia_mosques: "Improvements For Shia Mosques"
 IRQ_1985_improvements_for_shia_mosques_desc: "Many Shia sights, and mosques have started to fall apart, as a result of neglect from decades of Ba'athist rule. It is time that we give these mosques the treatment they need."
 IRQ_1985_clerical_militarism: "Clerical Militarism"
 IRQ_1985_clerical_militarism_desc: "If we have the clerics on our side, then we have another army at our disposal. We will use clerics and their sermons to promote militaristic ideals within our society as a new means of gathering manpower for the Iraqi nation."
 IRQ_1985_peace_deals_within: "Peace Deals Within"
 IRQ_1985_peace_deals_within_desc: "Our people are actively tearing each other apart, causing much disruption and chaos in society. It's about time that we try to mediate peace deals amongst the internal factions fighting within."
 IRQ_1985_cooperation_with_hezbolla: "Cooperation With Hezbollah"
 IRQ_1985_cooperation_with_hezbolla_desc: "Hezbollah is one of our many ideological allies, despite being an international pariah. We need to establish proper ties with them ensuring the safety of both of our states."
 IRQ_1985_partners_in_syria: "Our Partners in Syria"
 IRQ_1985_partners_in_syria_desc: "We need more friends in the world, and our Asian neighbors are perfect for this initiative."
 IRQ_1985_extend_a_hand_to_lebanon: "Extend a Hand to Palestine"
 IRQ_1985_extend_a_hand_to_lebanon_desc: "The Palestinians have been quite suppressed and neglected in international affairs recently, but we can change that. We will extend a hand for them to reach to and hold onto when needed."
 IRQ_1985_the_partys_ambition: "The Party's Ambition"
 IRQ_1985_the_partys_ambition_desc: "Our party is not here to just sit around and do nothing all day, we plan to reform Iraq into a tougher and battle ready nation!"
 IRQ_1985_ghost_soldiers: "Ghost Soldiers"
 IRQ_1985_ghost_soldiers_desc: "In order to get our hands on additional funds, we will have to inflate the number of troops we have when the reports come in. Using these additional funds, we could easily buy new equipment, or something else.."
 IRQ_1985_energy_bidding_rounds: "Energy Bidding Rounds"
 IRQ_1985_energy_bidding_rounds_desc: "Iraq has a lot of untapped oil, and putting the rights to these resources up on an auction could help fund development and our ambitions."
 IRQ_1985_reliance_on_militias: "Reliance On Militias"
 IRQ_1985_reliance_on_militias_desc: "The only people defending the state are militias, the military has proved itself incompetent. We must put all of our faith into the militias to defend the nation."
 IRQ_1985_army_of_martyr_sadr: "Army of Martyr Sadr"
 IRQ_1985_army_of_martyr_sadr_desc: "Our armed wing of the party, the Army of Martyr Sadr will ensure the safety of our party members and state by vitalizing greater cooperation with the PMF."
 IRQ_1985_communist_party_of_iraq: "A Victory for the Masses"
 IRQ_1985_communist_party_of_iraq_desc: "Being the oldest active party of Iraq, the Communist Party played a prominent role in shaping the political history of Iraq between its foundation and the 1970s. However, the party like many others suffered grealy under the Ba'athist rule."
 IRQ_1985_liberty_triumphs: "Liberty Triumphs"
 IRQ_1985_liberty_triumphs_desc: "A new age will be ushered into Iraq, as the people will finally be granted the liberties and freedoms they have long deserved."
 IRQ_1985_equality_in_society: "Equality in Society"
 IRQ_1985_equality_in_society_desc: "There exists many inequalities in Iraqi society, just looking at it from the outside you could see many areas where our policies are flawed. We will begin repealing laws which reinforce these inequalities that some Iraqi's suffer from."
 IRQ_1985_rooting_out_poverty: "Rooting out Poverty"
 IRQ_1985_rooting_out_poverty_desc: "Poverty has not been the priority of some parties, groups, or organizations that have ruled Iraq. It is time that we tackle this challenge, which many have decided not to."
 IRQ_1985_housing_instead_of_slums: "Housing Instead of Slums"
 IRQ_1985_housing_instead_of_slums_desc: "Many places in Iraq have not been developed properly to account for housing, and the people have naturally created slums to live in. We cannot continue to neglect these poor living conditions, and we must begin a program to promote housing instead of slums."
 IRQ_1985_affordability_movement: "Affordability Movement"
 IRQ_1985_affordability_movement_desc: "Not everything is affordable for the average Iraqi citizen, and this has made it hard to live for some. We must begin putting in an effort to reduce the price of goods as soon as possible."
 IRQ_1985_women_in_our_society: "Women in Our Society"
 IRQ_1985_women_in_our_society_desc: "Suppressing the role of the woman in our society has been an unfortunate path that previous governments had taken, but we will not repeat this mistake. We will ensure their rights are upheld, and reinforced."
 IRQ_1985_female_positions: "Positions for Women"
 IRQ_1985_female_positions_desc: "Some workplaces and employers have installed new regulations that may make it difficult for women to land a job, and we must crack down on these discriminatory policies."
 IRQ_1985_our_voice: "Our Voice"
 IRQ_1985_our_voice_desc: "By establishing our own newspaper 'Al-Qaidah', we could get our message out to the people with greater ease."
 IRQ_1985_democratic_youth_federation: "Democratic Youth Federation"
 IRQ_1985_democratic_youth_federation_desc: "The Democratic Youth Federation is a voluntary youth organization which will campaign for Iraqi youth rights and interests."
 IRQ_1985_voice_of_the_people: "Voice of The People"
 IRQ_1985_voice_of_the_people_desc: "Our party must be the voice of the people, considering that some people have no platform to get their voice out there. We will use their requests as a way to model our government after the governments interests."
 IRQ_1985_rally_support_for_al_ansar: "Rally Support For al-Ansar"
 IRQ_1985_rally_support_for_al_ansar_desc: "The armed wing of our party al-Ansar has long been dissolved. However, we are able to rally popular support as a means to re-establish the wing."
 IRQ_1985_address_army_corruption: "Address Army Corruption"
 IRQ_1985_address_army_corruption_desc: "The army is incredibly corrupt, and this corruption has led to the fruition of 'Ghost Soldiers'. We will clamp down on this corruption and restore order to the ranks."
 IRQ_1985_ideological_allies: "Ideological Allies"
 IRQ_1985_ideological_allies_desc: "We've got many friends in the world, we just need to reach out to them. We will begin going on a diplomatic mission to these nations to establish proper economic ties."
 IRQ_1985_rally_the_kurdish_parties: "A Friend of the Kurd's"
 IRQ_1985_rally_the_kurdish_parties_desc: "We must let the Kurdish forces in North-East know that our party and nation pose no threat to their existence, and we must do so by establishing an ideological foothold in their areas."
 IRQ_1985_education_of_rights: "Education of Rights"
 IRQ_1985_education_of_rights_desc: "The people are not educated of their rights, and will submit to anyone that wishes to take it from them. We must begin programs that educates the people of their rights that they have been granted."
 IRQ_1985_the_iraqi_identity: "The Iraqi Identity"
 IRQ_1985_the_iraqi_identity_desc: "Our nation has shaped it's identity mostly after Islam, and the Islamic faith. It is about due time that we begin promoting an Iraqi identity more openly."
 IRQ_1985_power_of_the_union: "Power of The Union"
 IRQ_1985_power_of_the_union_desc: "The unions are a strong force, and must remain so. We will support the rights of the unions, and promote their activities as a means to strengthen our economic accountability."
 IRQ_1985_nationalization_of_the_economy: "Nationalization of the Economy"
 IRQ_1985_nationalization_of_the_economy_desc: "Certain crucial economic sectors in Iraq are partially or are predominantly owned by private groups, people, or companies. We cannot have our resources in the hands of a small group of people, and it must be in the hands of Iraqi's."
 IRQ_1985_expulsion_of_the_iranians: "Expulsion of the Iranians"
 IRQ_1985_expulsion_of_the_iranians_desc: "The Iranians have been trying for many years now to cement their control over Iraq, and thus must have an end put to it."
 IRQ_1985_restrictions_on_the_americans: "Restrictions On The Americans"
 IRQ_1985_restrictions_on_the_americans_desc: "Even though the Americans are the primary reason that Saddam Hussein and his goons no longer rule Iraq, it does not mean that they get the freedom to do as they wish. We will monitor their activities within Iraq to ensure they don't do anything that would cause harm to our people."
 IRQ_1985_the_call_to_freedom: "The Call to Freedom"
 IRQ_1985_the_call_to_freedom_desc: "It is time that we push the state towards a policy of secularism and religious liberation for our peoples own good."
 IRQ_1985_sadrist_movement: "Sadrist Movement"
 IRQ_1985_sadrist_movement_desc: "Led by Muqtada al-Sadr, the Sadrist movement sees an ideal Iraq as one that is free from foreign influence, and independent from foreign meddling."
 IRQ_1985_controlled_instability: "Controlled Instability"
 IRQ_1985_controlled_instability_desc: "By swaying the instability that exists in Iraq to benefit us, we could use it as a means to cut back on certain parts of our budget."
 IRQ_1985_mahdi_army_expansion: "Expansion of the Mahdi Army"
 IRQ_1985_mahdi_army_expansion_desc: "Now that our position in Iraq has been solidified, we can assure the future of the Mahdi army to play a larger role in Iraqi society and the armed forces in general."
 IRQ_1985_front_against_american_expansion: "The Front Against American Expansion"
 IRQ_1985_front_against_american_expansion_desc: "Iraq will be the front which holds back American expansion and incursion into the rest of the middle east."
 IRQ_1985_the_little_serpent: "The Little Serpent"
 IRQ_1985_the_little_serpent_desc: "The Ba'ath party and their supporters are the little serpent when it comes the problems Iraq has. We must begin by arresting and persecuting suspected members of the Ba'ath party."
 IRQ_1985_the_bigger_serpent: "The Bigger Serpent"
 IRQ_1985_the_bigger_serpent_desc: "The Bigger Serpent happens to be the American forces which toppled Saddam. Despite this, we cannot forget all of the bad things they have done in the region. We must stop their expansion right in their tracks."
 IRQ_1985_distance_from_assad: "Distance From Assad"
 IRQ_1985_distance_from_assad_desc: "Assad is an absolute lunatic, and cannot be trusted. We must distance ourselves from the Syrian government and keep an eye out for whatever they may be wanting to do."
 IRQ_1985_khaleeji_relations: "Khaleeji Relations"
 IRQ_1985_khaleeji_relations_desc: "Our relations with the gulf states have become a widely debated topic, as some advocate for greater cooperation whilst others push us to distance ourselves. It is in our best interest to improve our relations with these states, as their economies could easily make the Iraqi market skyrocket."
 IRQ_1985_the_sayyid: "The Sayyid"
 IRQ_1985_the_sayyid_desc: "Muqtada al-Sadr has been labeled as a Sayyid, granting him the much needed legitimacy to lead Iraq."
 IRQ_1985_shockwaves_in_the_clergy: "Shockwaves in The Clergy"
 IRQ_1985_shockwaves_in_the_clergy_desc: "By taking out a few of the clergy-men who decide they want to run their mouthes, we could easily send shockwaves through the clergy and silence any incoming dissent."
 IRQ_1985_positions_for_supporters: "Positions For Supporters"
 IRQ_1985_positions_for_supporters_desc: "We must reward those who have stuck with us till the end, and this can be done by giving them a higher likelihood of landing any job that they so wish of."
 IRQ_1985_development_of_east_baghdad: "Development of East Baghdad"
 IRQ_1985_development_of_east_baghdad_desc: "East Baghdad has been neglected for some time now, and developing it to make it be up to standard will be very beneficial."
 IRQ_1985_al_hawsim: "Al Hawsim"
 IRQ_1985_al_hawsim_desc: "By putting out a new fatwa, we can let the people who are hungry take what they need as long as they pay it forward by donating."
 IRQ_1985_peace_brigades: "Peace Brigades"
 IRQ_1985_peace_brigades_desc: "The security of Shia mosques has not been assured, but we are able to guarantee it by creating peace deals and having them stationed to ensure their safety."
 IRQ_1985_reformation_of_the_state: "Reformation of The State"
 IRQ_1985_reformation_of_the_state_desc: "The state must be reformed to root out those who wish us harm and political instability, especially those who run the Badr brigades."
 IRQ_1985_close_the_bastion_of_corruption: "Close the Bastion of Corruption"
 IRQ_1985_close_the_bastion_of_corruption_desc: "The freezones in Iraq are bastions of corruptions, which must be closed immediately. We cannot let foreigners come and do as they wish with our nation."
 IRQ_1985_constitutional_revisions: "Constitutional Revisions"
 IRQ_1985_constitutional_revisions_desc: "Though the constitution was only recently written, it does not encompass everything needed to prevent degeneracy to take over the state. We will pass some reforms that makes it difficult for evildoers to win power."
 IRQ_1985_pro_iraqi_alignment: "Pro-Iraqi Alignment"
 IRQ_1985_pro_iraqi_alignment_desc: "The Iraqi state must come before everyone else, and benefit Iraqi's the most. We cannot let foreigners plunge our lands into chaos and dismay."
 IRQ_1985_pro_tehran_alignment: "Pro-Tehran Axis"
 IRQ_1985_pro_tehran_alignment_desc: "The Iranians can come off as a useful ally in most cases, and we cannot under estimate the potential power an alliance between our two nations could hold."
 IRQ_1985_a_party_of_integrity: "A Party of Integrity"
 IRQ_1985_a_party_of_integrity_desc: "Our party will do no wrong, as we will be the party of integrity, and justice. The Iraqi people will have nothing to worry about as long as we are here protecting them from foreign incursions."
 IRQ_1985_the_constitution: "The Iraqi Constitution"
 IRQ_1985_the_constitution_desc: "Following the overthrow of §HSaddam Hussein§!, and the subsequent §HBa'athist§! Party, our nation has been tasked with §HDrafting a new constitution§! for a more §HDemocratic, and Free Iraq§!. Each §HArticle§! of the §HConstitution§! that we draft will have an §HImpact§! on the future of which political parties can be elected, and who could be in politics."
 IRQ_1985_debaathification_of_iraq: "De-Ba'athification of Iraq"
 IRQ_1985_debaathification_of_iraq_desc: "In order to begin the full recovery process, we must begin a process of De-Ba'athification to rid the Iraqi nation of all Ba'athist influence that remains."
 IRQ_1985_saving_face: "Saving Face"
 IRQ_1985_saving_face_desc: "Corruption runs rampant in Iraq, and it cannot be ignored. We must save face, bite the bullet, and clamp down on corrupt activities by all means necessary."
 IRQ_1985_order_one: "Order One"
 IRQ_1985_order_one_desc: "Order One will be the order to declare that all public sector employees affiliated with the Ba'ath Party are to be removed from their positions and to be banned from any future employment in the public sector."
 IRQ_1985_order_two: "Order Two"
 IRQ_1985_order_two_desc: "The Ba'ath party and their affiliates racked quite a lot of assets, and those assets must be dealt with immediately."
 IRQ_1985_order_four: "Order Four"
 IRQ_1985_order_four_desc: "We must continue the financial investigations into the Ba'athists, and what they'd been up to."
 IRQ_1985_order_five: "Order Five"
 IRQ_1985_order_five_desc: "By creating an effective, and official De-Ba'athification council, we will be able to coordinate our efforts more greatly and broadly."
 IRQ_1985_order_one_hundred: "Order One Hundred"
 IRQ_1985_order_one_hundred_desc: "The time has come for a true transfer of power between the provisional authority into the hand of the Iraqi people."
 IRQ_1985_the_land_of_shiism: "The Fortress of Revolution"
 IRQ_1985_the_land_of_shiism_desc: "§GTakbir!§!\n\nOur nation has become the true fortress of revolution, in the eyes of many, we will be seen as a leading figure in victories against the enemy!"
 IRQ_1985_dealing_with_the_occupation: "Dealing with the Occupation"
 IRQ_1985_dealing_with_the_occupation_desc: "The American occupation must be deal with as soon as possible, regardless of how we decide to do so."
 IRQ_1985_a_deal_with_the_serpent: "A Deal with the Serpent"
 IRQ_1985_a_deal_with_the_serpent_desc: "We must come to terms with the fact that the Americans are not going anywhere, and we must use them to our benefit."
 IRQ_1985_nato_counter_terror_specialists: "NATO Counter Terror Specialists"
 IRQ_1985_nato_counter_terror_specialists_desc: "We will take advantage of the NATO alliance and their expertise on counter-terrorism, by bringing in their experts to train and advise our own men."
 IRQ_1985_leveraging_western_investors: "Leveraging Western Investors"
 IRQ_1985_leveraging_western_investors_desc: "Westerners are keen to jump into any opportunity that could make them money, and thus we must make Iraq look appealing to their ambitions."
 IRQ_1985_our_gate_to_the_world: "Our Gate to the World"
 IRQ_1985_our_gate_to_the_world_desc: "Economic liberalization will be our key to the world, we cannot enforce protectionism in our markets."
 IRQ_1985_auctioning_oil: "Sustainable Extraction Facilities"
 IRQ_1985_auctioning_oil_desc: "We have more than enough oil in Iraq, but we do not have enough tools to extract them with. We will bring in experts to create the necessary tools to extract our resources with."
 IRQ_1985_invite_potus: "Invite the President"
 IRQ_1985_invite_potus_desc: "The American president must be invited into our nation to show them that we pose no threat, and to demonstrate the security of the Iraqi state in front of the whole world."
 IRQ_1985_reverse_engineering_weapons: "Reverse Engineering Weapons"
 IRQ_1985_reverse_engineering_weapons_desc: "The Americans left behind quite a bit of weapons, and we can snatch a couple of them to reverse engineer and use to produce our own variants..."
 IRQ_1985_memories_of_fallujah: "Memories of Fallujah"
 IRQ_1985_memories_of_fallujah_desc: "Using the experience that we gained from the insurgencies in Fallujah, we will reform our approach to the radicals stationed there."
 IRQ_1985_sadr_in_the_shadows: "Sadr in the Shadows"
 IRQ_1985_sadr_in_the_shadows_desc: "Utilizing Muqtada al-Sadr to fight against the American occupation will pay off in the long run, as he is the most popular figure in this movement against the occupying forces."
 IRQ_1985_the_fatwa_from_najaf: "The Fatwa From Najaf"
 IRQ_1985_the_fatwa_from_najaf_desc: "We must declare a fatwa from Najaf to call for popular mobilization against the occupiers!"
 IRQ_1985_storm_the_american_embassy: "Storm the American Embassy"
 IRQ_1985_storm_the_american_embassy_desc: "The time has come for us to finally overrun the bastion of oppression, the American embassy. Like our Iranian counterparts before us, our nation will be seen as no pushover for much longer."
 IRQ_1985_soleimani_presence: "Soleimani's Presence"
 IRQ_1985_soleimani_presence_desc: "By inviting Qasem Soleimani to advise some of our forces, we can speed up the process of breaking free from American oppression."
 IRQ_1985_iranian_irgc_experts: "IRGC Experts"
 IRQ_1985_iranian_irgc_experts_desc: "The IRGC is large enough and conditioned enough to give us some advice on how we could deal with the American threat at home."
 IRQ_1985_status_quo_najaf: "Status Quo in Najaf"
 IRQ_1985_status_quo_najaf_desc: "Najaf will be used as our base of operations to prepare and coordinate planes against the American occupation forces."
 IRQ_1985_iranian_quds_operations: "Quds Training"
 IRQ_1985_iranian_quds_operations_desc: "The Quds forces from Iran's IRGC will be invited over to give our troops the necessary training to fight back against the American forces when needed."
 IRQ_1985_national_rallies: "National Rallies"
 IRQ_1985_national_rallies_desc: "The masses must rise up against the Americans, we will coordinate popular rallies to show the unpopularity of the occupation forces."
 IRQ_1985_sunni_leadership: "Sunni Leadership"
 IRQ_1985_sunni_leadership_desc: "By promoting Sunni leadership in aspects of society, we can show to the world that we do not entertain the idea of sectarianism."
 IRQ_1985_sunni_representation: "Sunni Representation"
 IRQ_1985_sunni_representation_desc: "We just need to represent the Sunni population in our government and nation, not much else is needed."
 IRQ_1985_al_malikis_strings: "al-Malikis Strings"
 IRQ_1985_al_malikis_strings_desc: "Maliki is a very weak figure, and can easily be swayed. We will use him to fulfill our ambitions and goals that could use a figure that is not a representative of our government."
 IRQ_1985_walking_the_fine_line: "Walking the Fine Line"
 IRQ_1985_walking_the_fine_line_desc: "Our nation has been walking a fine line in between powers for a very long time now, and it is time we take a stance."
 IRQ_1985_tehrans_shield: "Tehrans Shield"
 IRQ_1985_tehrans_shield_desc: "We must be the shield of Tehran, by joining the Axis of Resistance, we will be able to fight back against American oppression together with our Iranian partners."
 IRQ_1985_the_regions_shield: "The Regions Shield"
 IRQ_1985_the_regions_shield_desc: "We cannot be the tool of anyone, but rather we must make tools of everyone else. We will be the regions shield against all forms of foreign oppression."
 IRQ_1985_extending_our_hand: "Extending Our Hand"
 IRQ_1985_extending_our_hand_desc: "We must extend a hand to the many neglected nations in the region and bring them onto our side."
 IRQ_1985_formation_of_our_coalition: "Formation of our Coalition"
 IRQ_1985_formation_of_our_coalition_desc: "We must form a coalition against the Zionists  occupying Palestine and it's people, the Israeli state must not be given free reign over the Palestinian people."
 IRQ_1985_secure_lebanese_support: "Secure Lebanese Support"
 IRQ_1985_secure_lebanese_support_desc: "We must bring the Lebanese to our side, as they share a border north of the Israeli's."
 IRQ_1985_syrian_backing: "Syrian Backing"
 IRQ_1985_syrian_backing_desc: "The Syrians have got quite a bit of combat experience against the Israeli's, so we must take advantage of their expertise."
 IRQ_1985_the_hazaras_in_afghanistan: "The Hazara's in Afghanistan"
 IRQ_1985_the_hazaras_in_afghanistan_desc: "Our bid for regional hegemony cannot end at the Levant, it must go into central Asia and its disillusioned people."
 IRQ_1985_the_alevis_in_turkey: "The Alevi's in Turkey"
 IRQ_1985_the_alevis_in_turkey_desc: "Though few in numbers, the Alevi's can be a very useful ally in convincing the Turks they need a form of governance in their nation."
 IRQ_1985_contact_palestinian_militias: "Contact Palestinian Militias"
 IRQ_1985_contact_palestinian_militias_desc: "How can we assist Palestine without Palestinian support? We must contact Palestinian militias to prepare for the time when we strike Israel."
 IRQ_1985_the_clock_hits_midnight: "The Clock Hits Midnight"
 IRQ_1985_the_clock_hits_midnight_desc: "§RTick... Tock..§!\n\nIsraels time is up, and the time for liberation is here."
 IRQ_1985_rejuvination_of_iraq: "Rejuvenation of Iraq"
 IRQ_1985_rejuvination_of_iraq_desc: "The time has come for Iraq to be rejuvenated with power, strength, and independence. We will usher in the new age of Iraqi society, no matter how long it takes."
 IRQ_1985_ulama_mobilization: "Ulema Mobilization"
 IRQ_1985_ulama_mobilization_desc: "We must mobilize the Ulema to undertake the massive task of reshaping Iraqi society to be more pious, we cannot do it alone."
 IRQ_1985_power_of_the_mosque: "Power of the Mosque"
 IRQ_1985_power_of_the_mosque_desc: "The Power of the Mosque cannot be understated, the people must know that their lives are to be dictated by how they live it in accordance with getting closer with God."
 IRQ_1985_fight_media_and_propaganda: "Fight Media and Propaganda"
 IRQ_1985_fight_media_and_propaganda_desc: "There is a lot of propaganda running against our new government, and revolution. We must fight against these forces for the sake of our nation and way of life."
 IRQ_1985_chastity_and_self_respect: "Chastity and Self Respect"
 IRQ_1985_chastity_and_self_respect_desc: "Our women cannot go out on the streets looking like prostitutes, we must institute laws that preserve the chastity and self respect of all Iraqi women."
 IRQ_1985_iraqs_constitution: "Our Constitution"
 IRQ_1985_iraqs_constitution_desc: "The constitution was not very effective in establishing a beneficial status for the state, with many drawbacks present. We must manipulate the constitution so that it is beneficial from all ends."
 IRQ_1985_islam_over_state: "Islam Over State"
 IRQ_1985_islam_over_state_desc: "§RLet this land burn. I say let this land go up in smoke, provided Islam emerges triumphant in the rest of the world..§!\n\nIraq must not diseased with the guise of patriotism towards the state, it must be Islam that people look towards for their allegiance."
 IRQ_1985_the_spring_of_islam: "The Spring of Islam"
 IRQ_1985_the_spring_of_islam_desc: "The time has come for us to export our revolution, ideology, and values. We cannot stand alone in this region, we must take action to align the region with our ideals."
 IRQ_1985_the_revolutions_legacy: "The Revolutions Legacy"
 IRQ_1985_the_revolutions_legacy_desc: "The revolution will have an everlasting impact on Iraqi society, even when we are long gone. Revolutionary ideals will run deep in every single aspect of Iraqi society at all times."
 IRQ_1985_form_the_pmf: "Align the PMF"
 IRQ_1985_form_the_pmf_desc: "The PMF are currently an organization of several loosely aligned Militias. It is up to us to bring them into fold, and incorporate them into a larger part of the Iraqi army."
 IRQ_1985_iranian_arms_companies: "Iranian Arms Companies"
 IRQ_1985_iranian_arms_companies_desc: "The Iranians have been creating their own weapons domestically for decades now, and inviting them to set up shop in Iraq could give us some beneficial deals."
 IRQ_1985_revive_iraqi_arms_industry: "Revive the Iraqi Arms Industry"
 IRQ_1985_revive_iraqi_arms_industry_desc: "Doubling down on foreign companies is a suicidal idea, we must rely only on Iraqi produced weaponry, and Iraqi equipment only."
 IRQ_1985_the_army_of_the_revolution: "The Army of The Revolution"
 IRQ_1985_the_army_of_the_revolution_desc: "We must create the Army of the Revolution as a means to protect our revolution from coups, foreign influence, and invasions."
 IRQ_1985_brigade_twelve: "Brigade Twelve"
 IRQ_1985_brigade_twelve_desc: "Brigade Twelve will be a testament to our commitment to our inclusive ideals, especially against those who try to use the diversity of Iraq against us."
 IRQ_1985_christian_brigades: "Christian Brigades"
 IRQ_1985_christian_brigades_desc: "To prove that the Revolution has not hostile intentions towards the many different faiths of Iraq, we will fund the creation of new Christian militias."
 IRQ_1985_commands_in_syria: "Commands in Syria"
 IRQ_1985_commands_in_syria_desc: "We will install secret command posts in Syria, using the chaos in their nation as our disguise."
 IRQ_1985_contact_the_russians: "Contact The Russians"
 IRQ_1985_contact_the_russians_desc: "The Russians are a potential ally waiting to be had, we just need to strike up some formal dialogue with their government."
 IRQ_1985_integration_into_the_armed_forces: "Integration Into The Armed Forces"
 IRQ_1985_integration_into_the_armed_forces_desc: "Integrating the commands of the PMF and many militias in Iraq with the army will be a great step forward towards creating a greater army that can hold its own."
 IRQ_1985_vilayet_faqi_model: "Vilayet-e Faqih Model"
 IRQ_1985_vilayet_faqi_model_desc: "We must follow the Iranian standard of vetting only very specific candidates and parties in Iraq, we cannot allow for dangerous ideals to seep into our society."
 IRQ_1985_pluralist_model: "Pluralist Model"
 IRQ_1985_pluralist_model_desc: "We cannot do what the Iranians had with Vilayet-e Faqih and restrict democracy, everyone must be given a chance."
 IRQ_1985_the_duty_of_voting: "The Duty of Voting"
 IRQ_1985_the_duty_of_voting_desc: "Everyone in our nation has a duty to vote, even the women. We must promote this sentiment."
 IRQ_1985_the_islamic_republic_of_iraq: "The Islamic Republic of Iraq"
 IRQ_1985_the_islamic_republic_of_iraq_desc: "We are an Islamic Republic, not a dictatorship. These ideals must be spread throughout all of Iraq as soon as possible."
 IRQ_1985_the_door_to_iraq: "The Door to Iraq"
 IRQ_1985_the_door_to_iraq_desc: "Our door must always be open to diplomacy, be it good or hostile. We cannot seclude ourselves in such a big world."
 IRQ_1985_the_lions_den: "The Lions Den"
 IRQ_1985_the_lions_den_desc: "Iran has long been a hostile power, especially towards Iraq and Iraqi's. We must hit them in such a way where they will finally begin behaving."
 IRQ_1985_petition_for_american_support: "Petition For American Support"
 IRQ_1985_petition_for_american_support_desc: "We need to contact the Americans in order to take down the Iranian threat. Afterall, an additional friend would be useful."
 IRQ_1985_petition_for_saudi_support: "Petition For Saudi Support"
 IRQ_1985_petition_for_saudi_support_desc: "We don't need to tell these guys much, all they need to know is that we will be victorious in the end and they'll get the oil."
 IRQ_1985_on_our_own: "On Our Own"
 IRQ_1985_on_our_own_desc: "We need not the assistance of the foreigners to down the Iranian threat, we can do it all on our own."
 IRQ_1985_arm_the_west: "Arm the West"
 IRQ_1985_arm_the_west_desc: "The western parts of Iran is predominantly filled with Kurds, and some Arabs in parts."
 IRQ_1985_king_of_the_animal_kingdom: "Dethrone the King of the Jungle"
 IRQ_1985_king_of_the_animal_kingdom_desc: "The time has come for the Iranians to finally get dislodged from their throne that they emit all chaos from."
 IRQ_1985_arab_friends: "Arab Brothers?"
 IRQ_1985_arab_friends_desc: "All Arabs are our brothers, but could they all be our brothers if they are hell-bent on oppressing their Arab citizens?"
 IRQ_1985_voice_of_the_voiceless: "Voice of The Voiceless"
 IRQ_1985_voice_of_the_voiceless_desc: "Iraq must be the voice of the voiceless in the Arab world. Oppression must not triumph!"
 IRQ_1985_the_worth_of_the_people: "The Worth of The People"
 IRQ_1985_the_worth_of_the_people_desc: "The Arab people in [SAU.GetName] must know their true worth, and we will ensure that they do so."
 IRQ_1985_arab_worlds_leader: "Leader of the Arab World"
 IRQ_1985_arab_worlds_leader_desc: "Through our policies, we will elevate ourselves to the top of the food chain in the Arab world. We will be seen as a leading figure in the Arab world!"
 IRQ_1985_diplomacy_through_faith: "Diplomacy Through Faith"
 IRQ_1985_diplomacy_through_faith_desc: "We must conduct diplomatic actions through our one common belief, Islam. The advantage our faith gives us cannot be undermined."
 IRQ_1985_security_guarantees: "Security Guarantees"
 IRQ_1985_security_guarantees_desc: "By assuring our mutual safety, we will inch ever closer to a more stable middle east for everyone."

 IRQ_1985_war_command_dynamic_modifier: "1985 War Command"
 IRQ_1985_war_command_dynamic_modifier_desc: "The active wartime command structure shaped by Iraq's 1985 focus tree."
 IRQ_1985_war_command_dynamic_modifier_tt: "Modified by the 1985 Iraq focus tree. War momentum affects army attack, front integrity affects organization, and logistics burden affects supply consumption."
 IRQ_1985_war_economy_dynamic_modifier: "1985 War Economy"
 IRQ_1985_war_economy_dynamic_modifier_desc: "The emergency economic structure funding Iraq's war against Iran."
 IRQ_1985_war_economy_dynamic_modifier_tt: "Modified by the 1985 Iraq focus tree. Credit, oil exports, rationing, and arms production change consumer goods, arms construction, tax income, and interest costs."
 IRQ_1985_baathist_total_war_state_organized: "Ba'athist Total War State"
 IRQ_1985_baathist_total_war_state_organized_desc: "The Ba'athist war state has been disciplined through the RCC and security apparatus. It is still coercive, but its wartime command is more coherent."
 IRQ_1985_war_debt_and_militarized_economy_managed: "War Debt and Militarized Economy"
 IRQ_1985_war_debt_and_militarized_economy_managed_desc: "Iraq's war economy remains debt-heavy and distorted, but rationing, oil exports, and Gulf credit have made the strain more manageable."
 IRQ_1985_baath_security_cordon: "Ba'ath Security Cordon"
 IRQ_1985_baath_security_cordon_desc: "Security organs and party files bind the state together. The cordon deters opposition, but rewards loyalty networks over competence."
 IRQ_1985_republican_guard_expansion: "Republican Guard Expansion"
 IRQ_1985_republican_guard_expansion_desc: "The Republican Guard is expanded as Saddam's trusted reserve, improving battlefield punch at a high political and personnel cost."
 IRQ_1985_frontline_logistics: "Frontline Logistics"
 IRQ_1985_frontline_logistics_desc: "Reworked supply routes, corps depots, and emergency transport pools reduce the waste that has plagued the southern front."
 IRQ_1985_gulf_credit_network: "Gulf Credit Network"
 IRQ_1985_gulf_credit_network_desc: "Gulf monarchies are helping finance Iraq's war effort. The arrangement eases immediate strain while tying Baghdad to future debts."
 IRQ_1985_oil_export_lifeline: "Oil Export Lifeline"
 IRQ_1985_oil_export_lifeline_desc: "Protected export routes and emergency energy investment let Iraq convert oil into the money needed to fight."
 IRQ_1985_military_industrial_commission_idea: "Military Industrial Commission"
 IRQ_1985_military_industrial_commission_idea_desc: "A wartime commission coordinates factories, repair shops, and ministries around the needs of the army."
 IRQ_1985_ration_state: "Ration State"
 IRQ_1985_ration_state_desc: "Ration cards and state orders keep the population supplied enough to endure the war, but they reveal how militarized the economy has become."
 IRQ_1985_wartime_agriculture_programme: "Wartime Agriculture Programme"
 IRQ_1985_wartime_agriculture_programme_desc: "Agricultural quotas, transport orders, and emergency allocations keep the cities and front supplied."
 IRQ_1985_southern_reconstruction_programme: "Southern Reconstruction Programme"
 IRQ_1985_southern_reconstruction_programme_desc: "Basrah and the southern route network are being repaired under wartime priorities."
 IRQ_1985_sensitive_sites_programme: "Sensitive Sites Programme"
 IRQ_1985_sensitive_sites_programme_desc: "Protected research sites and air defense positions keep Iraq's sensitive infrastructure alive under foreign scrutiny."
 IRQ_1985_balanced_procurement_channels: "Balanced Procurement Channels"
 IRQ_1985_balanced_procurement_channels_desc: "Soviet, French, Chinese, and quiet American channels give Iraq a broad procurement base, at the cost of complexity and foreign attention."
 IRQ_1985_state_control_up_tt: "The regime's wartime command becomes more coherent."
 IRQ_1985_war_command_mixed_tt: "Improves front integrity and momentum, but adds a small logistics burden."
 IRQ_1985_war_command_hardline_tt: "Improves momentum and regime discipline, but increases the logistics burden."
 IRQ_1985_economy_relief_small_tt: "Slightly eases the 1985 war economy dynamic modifier."
 IRQ_1985_economy_relief_medium_tt: "Eases the 1985 war economy dynamic modifier."
 IRQ_1985_economy_strain_mapped_tt: "Maps wartime debts into the 1985 war economy dynamic modifier."
 IRQ_1985_gulf_credit_tt: "Gulf credit eases immediate economic strain while increasing national debt."
 IRQ_1985_southern_food_states_tt: "Southern agricultural states receive productivity for wartime food supply."
 IRQ_1985_arms_speed_up_tt: "Improves wartime arms construction in the 1985 war economy dynamic modifier."
 IRQ_1985_front_integrity_up_tt: "Improves front integrity in the 1985 war command dynamic modifier."
 IRQ_1985_war_momentum_up_tt: "Improves war momentum in the 1985 war command dynamic modifier."
 IRQ_1985_logistics_relief_tt: "Reduces the logistics burden in the 1985 war command dynamic modifier."
 IRQ_1985_procurement_channels_tt: "Expands Iraq's 1985 procurement channels."
 IRQ_1985_capstone_tt: "Locks in the first 1985 Iraq framework and prepares the tree for later war, ceasefire, and Gulf crisis branches."
 IRQ_1985_reaffirm_arabistan_claims: "Reaffirm Arabistan Claims"
 IRQ_1985_reaffirm_arabistan_claims_desc: "Baghdad revives its claim that the Arabs of Khuzestan belong in Iraq's strategic orbit. The claim is propaganda, leverage, and a battlefield objective all at once."
 IRQ_1985_triumph_in_khuzestan: "Triumph in Khuzestan"
 IRQ_1985_triumph_in_khuzestan_desc: "If Iraq can hold Khuzestan, Saddam can present the war as more than survival. Oil, Arab nationalism, and victory propaganda will be fused into a new claim of permanence."
 IRQ_1985_army_reorganization_program: "Army Reorganization Program"
 IRQ_1985_army_reorganization_program_desc: "Years of attrition have swollen the army but dulled its edge. Front commands, logistics, and reserve channels must be reorganized before the next Iranian offensive."
 IRQ_1985_frontline_rotation_system: "Frontline Rotation System"
 IRQ_1985_frontline_rotation_system_desc: "Units that sit too long in the marshes and desert roads become brittle. A stricter rotation system keeps formations usable without pretending the war has become clean."
 IRQ_1985_no_retreat_from_basra: "No Retreat from Basrah"
 IRQ_1985_no_retreat_from_basra_desc: "Basrah is the southern hinge of the war. Losing it would turn a costly stalemate into a national crisis, so the army is ordered to prepare depth, fallbacks, and political resolve."
 IRQ_1985_baghdad_strategic_depth: "Baghdad Strategic Depth"
 IRQ_1985_baghdad_strategic_depth_desc: "The capital cannot be defended only at the capital. Roads, depots, and fallback lines from Samarra to Baghdad are prepared so a southern or eastern rupture does not become collapse."
 IRQ_1985_kurdish_front_security_columns: "Kurdish Front Security Columns"
 IRQ_1985_kurdish_front_security_columns_desc: "The northern rebellion cannot be allowed to pull regular divisions away from Iran at the wrong moment. Security columns are raised outside Kurdistan to hold the approaches and roads."
 IRQ_1985_recruitment_wave_one: "Recruitment Wave One"
 IRQ_1985_recruitment_wave_one_desc: "The regime calls up additional reserves from the loyal core of the state. These formations are not elegant, but they can hold roads, depots, and rear areas while better units stay at the front."
 IRQ_1985_recruitment_wave_two: "Recruitment Wave Two"
 IRQ_1985_recruitment_wave_two_desc: "Another wave of men is pushed into the army as the war grinds on. It buys time at the cost of strain on the economy and the families that keep it running."
 IRQ_1985_badr_counterstroke: "Badr Counterstroke"
 IRQ_1985_badr_counterstroke_desc: "Iran's 1985 push toward the Baghdad-Basra artery proves that the war can still crack open without warning. The Republican Guard and southern corps must be ready to counterattack before Iranian bridgeheads turn into a strategic breach."
 IRQ_1985_republican_guard_reserve: "Republican Guard Reserve"
 IRQ_1985_republican_guard_reserve_desc: "The Guard is Saddam's trusted battlefield reserve. Keeping it back from routine attrition gives Iraq a sharper counterattack force when the Iranians overextend."
 IRQ_1985_highway_kill_zones: "Highway Kill Zones"
 IRQ_1985_highway_kill_zones_desc: "The Baghdad-Basra road, bridges, artillery boxes, and marsh approaches must be mapped into defensive fires. Iran can attack, but the route south will punish every exposed column."
 IRQ_1985_war_of_cities_pressure: "War of the Cities"
 IRQ_1985_war_of_cities_pressure_desc: "Saddam's air and missile pressure against Iranian cities is meant to shake Tehran's morale and distract its leadership from the front, even if it hardens civilian hatred of Baghdad."
 IRQ_1985_fish_lake_barrier: "Fish Lake Barrier"
 IRQ_1985_fish_lake_barrier_desc: "After Kheibar and Badr, the southern wetlands are no longer a rear obstacle; they are a battlefield. Flooded barriers, mines, artillery boxes, and prepared bridges will make the marsh front costly for Iran to cross."
 IRQ_1985_tanker_war_air_corridor: "Tanker War Air Corridor"
 IRQ_1985_tanker_war_air_corridor_desc: "French aircraft, Exocet tactics, and Gulf air routes let Iraq threaten Iranian oil exports while keeping its own financial lifeline alive."
 IRQ_1985_moscow_arms_mission: "Moscow Arms Mission"
 IRQ_1985_moscow_arms_mission_desc: "A visit to Moscow can unlock heavier procurement, spare parts, and ammunition flows. It keeps the army supplied, but binds Baghdad deeper into wartime credit."
 IRQ_1985_hold_the_marsh_front: "Hold the Marsh Front"
 IRQ_1985_hold_the_marsh_front_desc: "The Hawizeh marshes and southern waterways have become a battlefield of infiltration, artillery, and exhausted infantry. Iraq must hold them with prepared defenses and carefully timed counterattacks."
 IRQ_1985_the_bill_comes_due: "The Bill Comes Due"
 IRQ_1985_the_bill_comes_due_desc: "The war has ended, but the debt has not. Gulf credit vanishes into repayment demands, oil prices remain hostile, and the regime must explain why victory feels like bankruptcy."
 IRQ_1985_the_bill_comes_due_auto_tt: "§YThe Bill Comes Due§! is completed automatically when the Iran-Iraq War ends."
 IRQ_1985_sell_future_oil_concessions: "Sell Future Oil Concessions"
 IRQ_1985_sell_future_oil_concessions_desc: "If the creditors will not forgive Iraq's debt, Baghdad can trade future oil access for breathing room. It is a humiliating alternative to force, but it may buy time."
 IRQ_1985_reschedule_the_war_debt: "Reschedule the War Debt"
 IRQ_1985_reschedule_the_war_debt_desc: "Foreign concessions give Baghdad enough leverage to negotiate a slower debt schedule. It eases the crash, but the regime pays in pride and domestic loyalty."
 IRQ_1985_austerity_and_smuggling_controls: "Austerity and Smuggling Controls"
 IRQ_1985_austerity_and_smuggling_controls_desc: "The state can squeeze imports, police smuggling, and force ministries into austerity. The debt crisis will soften, but society will feel the pressure."
 IRQ_1985_kuwait_refuses_the_debt: "The Kuwaiti Question"
 IRQ_1985_kuwait_refuses_the_debt_desc: "Baghdad can turn border claims, oil quotas, Rumaila accusations, and wartime credit grievances into a broader confrontation with Kuwait. Debt may sharpen the argument, but the claim itself does not depend on the postwar crisis."
 IRQ_1985_rumaila_accusations: "Rumaila Accusations"
 IRQ_1985_rumaila_accusations_desc: "The regime claims Kuwait is stealing oil from the Rumaila field and depressing prices through overproduction. Whether the claim is true matters less than how useful it is."
 IRQ_1985_project_seventeen: "Project Seventeen"
 IRQ_1985_project_seventeen_desc: "The army studies a fast southern operation: seize the roads, overwhelm Kuwait's defenses, and present the world with a fait accompli before outside powers can react."
 IRQ_1985_the_nineteenth_province: "The Nineteenth Province"
 IRQ_1985_the_nineteenth_province_desc: "Ba'athist rhetoric has long denied Kuwait's separation from Iraq. Reviving that claim turns a financial crisis into a nationalist mission."
 IRQ_1985_take_kuwait: "Take Kuwait"
 IRQ_1985_take_kuwait_desc: "Kuwait's wealth, oil, ports, and disputed sovereignty have become inseparable in Baghdad's mind. The army is ordered to settle the matter by force."
 IRQ_1985_face_desert_shield: "Face Desert Shield"
 IRQ_1985_face_desert_shield_desc: "If Washington guarantees Kuwait or enters the war, Saddam can still wager that prepared defenses, Arab pride, and coalition hesitancy will buy Iraq enough time."
 IRQ_1985_badr_counterstroke_idea: "Badr Counterstroke"
 IRQ_1985_badr_counterstroke_idea_desc: "Iraq is concentrating armor, artillery, and Republican Guard reserves for a timed counterattack against Iranian gains."
 IRQ_1985_highway_defense_zones_idea: "Highway Kill Zones"
 IRQ_1985_highway_defense_zones_idea_desc: "Prepared artillery boxes and fortified road approaches improve Iraqi defensive staying power."
 IRQ_1985_fish_lake_barrier_idea: "Fish Lake Barrier"
 IRQ_1985_fish_lake_barrier_idea_desc: "Flooding, minefields, prepared bridges, and artillery coordination make the southern wetlands more useful to Iraqi defense."
 IRQ_1985_war_of_cities_pressure_idea: "War of the Cities Pressure"
 IRQ_1985_war_of_cities_pressure_idea_desc: "Air and missile pressure is being used to force Iran to divide attention between the front and its cities."
 IRQ_1985_tanker_war_air_corridor_idea: "Tanker War Air Corridor"
 IRQ_1985_tanker_war_air_corridor_idea_desc: "Iraq's Gulf air operations pressure Iranian oil exports and protect Baghdad's own wartime revenue."
 IRQ_1985_moscow_arms_mission_idea: "Moscow Arms Mission"
 IRQ_1985_moscow_arms_mission_idea_desc: "Soviet procurement channels are feeding Iraq's arms industry and repair base for a short window."
 IRQ_1985_managed_war_of_attrition: "Managed War of Attrition"
 IRQ_1985_managed_war_of_attrition_desc: "The war still consumes men and money, but Iraq's command structure is learning to manage rotation, logistics, and reserves with less waste."
 IRQ_1985_frontline_rotation_system_idea: "Frontline Rotation System"
 IRQ_1985_frontline_rotation_system_idea_desc: "Regularized rotation keeps battered units from collapsing and gives the front a steadier rhythm."
 IRQ_1985_no_retreat_from_basra_idea: "No Retreat from Basrah"
 IRQ_1985_no_retreat_from_basra_idea_desc: "Basrah and the southern corridor are being prepared as a political and military line that cannot be allowed to break."
 IRQ_1985_baghdad_strategic_depth_idea: "Baghdad Strategic Depth"
 IRQ_1985_baghdad_strategic_depth_idea_desc: "Fallback lines, command depots, and political control measures make it harder for battlefield losses to become regime collapse."
 IRQ_1985_emergency_recruitment_strain: "Emergency Recruitment Strain"
 IRQ_1985_emergency_recruitment_strain_desc: "New manpower is reaching the army, but emergency recruitment strains families, factories, and training capacity."
 IRQ_1985_triumph_in_arabistan: "Triumph in Arabistan"
 IRQ_1985_triumph_in_arabistan_desc: "The regime has turned control of Khuzestan into a story of Arab vindication, oil security, and Saddam's battlefield judgment."
 IRQ_1985_postwar_debt_crash: "Postwar Debt Crash"
 IRQ_1985_postwar_debt_crash_desc: "The war with Iran is over, but Iraq is left with massive foreign debt, weak oil income, and a militarized economy that cannot simply demobilize."
 IRQ_1985_kuwait_war_fever: "Kuwait War Fever"
 IRQ_1985_kuwait_war_fever_desc: "The regime believes a fast strike south can solve the debt crisis and restore Iraq's pride before the outside world can coordinate."
 IRQ_1985_desert_shield_defiance: "Desert Shield Defiance"
 IRQ_1985_desert_shield_defiance_desc: "Saddam wagers that defensive depth, propaganda, and coalition hesitation will let Iraq endure an American confrontation."
 IRQ_1985_conquest_of_kuwait_dividends: "Conquest of Kuwait Dividends"
 IRQ_1985_conquest_of_kuwait_dividends_desc: "Kuwait's oil, banks, and ports are being folded into Baghdad's economy, easing the debt crisis at enormous diplomatic cost."
 IRQ_1985_postwar_debt_crash_resource_sale_1: "Postwar Debt Crash"
 IRQ_1985_postwar_debt_crash_resource_sale_1_desc: "Foreign resource concessions have reduced the pressure on Iraq's postwar debt, but the economy remains distorted, militarized, and vulnerable."
 IRQ_1985_postwar_debt_crash_resource_sale_2: "Postwar Debt Crash"
 IRQ_1985_postwar_debt_crash_resource_sale_2_desc: "Foreign resource concessions have reduced the pressure on Iraq's postwar debt, but the economy remains distorted, militarized, and vulnerable."
 IRQ_1985_postwar_debt_crash_resource_sale_3: "Postwar Debt Crash"
 IRQ_1985_postwar_debt_crash_resource_sale_3_desc: "Foreign resource concessions have reduced the pressure on Iraq's postwar debt, but the economy remains distorted, militarized, and vulnerable."
 IRQ_1985_postwar_debt_crash_resource_sale_4: "Postwar Debt Crash"
 IRQ_1985_postwar_debt_crash_resource_sale_4_desc: "Foreign resource concessions have reduced the pressure on Iraq's postwar debt, but the economy remains distorted, militarized, and vulnerable."
 IRQ_1985_austerity_drive_idea: "Austerity Drive"
 IRQ_1985_austerity_drive_idea_desc: "Baghdad is squeezing civilian imports, ministries, and black-market networks to keep the state solvent."
 IRQ_1985_seized_kuwaiti_gold_reserves: "Seized Kuwaiti Reserves"
 IRQ_1985_seized_kuwaiti_gold_reserves_desc: "Kuwait's gold reserves, bank holdings, and state assets have been folded into Iraq's wartime treasury."
 IRQ_1985_kuwait_assets_decisions_tt: "Unlocks §YKuwait Crisis§! decisions.\nIf Iraq controls §Y[172.GetName]§!, it can liquidate Kuwaiti claims and remove the §YPostwar Debt Crash§! if it is active.\nIf Kuwait is annexed, Iraq can seize Kuwaiti reserves for §Y1460 days§!: §G-15% Consumer Goods§!, §G+40% Construction Speed§!, and §G+$2.000B Additional Income§!."
 IRQ_1985_resource_sale_decisions_tt: "Unlocks decisions to offer Iraqi oil resource rights to the §YUnited States§!, §YBritain§!, §YFrance§!, or the §YSoviet Union§!.\nIf the buyer accepts, Iraq grants resource rights, loses Stability and ruling party support, and reduces the §YPostwar Debt Crash§! by §G10%§! of its original penalty."
 IRQ_1985_debt_crash_reduced_tt: "The §YPostwar Debt Crash§! is reduced by §G10%§! of its original penalty."
 IRQ_1985_debt_crash_reduction_limit_tt: "The §YPostwar Debt Crash§! cannot be reduced further through concessions."
 IRQ_1985_kuwaiti_gold_reserves_income_tt: "§HAdditional income§! from Kuwaiti reserves: §G$2.000B§!"
 additional_income_IRQ_1985_kuwaiti_gold_reserves: "§HAdditional income§! from Kuwaiti reserves: §G$2.000B§!"
 IRQ_1985_postwar_kuwait_crisis: "Kuwait Crisis"
 IRQ_1985_liquidate_kuwaiti_claims: "Liquidate Kuwaiti Claims"
 IRQ_1985_liquidate_kuwaiti_claims_desc: "With Kuwait under Iraqi control, Baghdad can seize banking records, oil receipts, and state accounts. If Iraq is suffering the postwar debt crash, this can wipe out the immediate crisis; otherwise it locks in the occupation's financial payoff."
 IRQ_1985_seize_kuwaiti_gold_reserves: "Seize Kuwaiti Gold Reserves"
 IRQ_1985_seize_kuwaiti_gold_reserves_desc: "If Kuwait has been annexed, its gold reserves and sovereign assets can be folded into Iraq's treasury for a massive, temporary economic surge."
 IRQ_1985_offer_resource_rights_to_usa: "Offer Resource Rights to the United States"
 IRQ_1985_offer_resource_rights_to_usa_desc: "Offer American firms resource rights in Basrah in exchange for financial relief."
 IRQ_1985_offer_resource_rights_to_britain: "Offer Resource Rights to Britain"
 IRQ_1985_offer_resource_rights_to_britain_desc: "Offer British firms resource rights in Maysan in exchange for financial relief."
 IRQ_1985_offer_resource_rights_to_france: "Offer Resource Rights to France"
 IRQ_1985_offer_resource_rights_to_france_desc: "Offer French firms resource rights in Kirkuk in exchange for financial relief."
 IRQ_1985_offer_resource_rights_to_soviets: "Offer Resource Rights to the Soviets"
 IRQ_1985_offer_resource_rights_to_soviets_desc: "Offer Soviet firms resource rights in Nineveh in exchange for financial relief."
 irq_1985_postwar.1.t: "Kuwait Refuses to Forgive the War Debt"
 irq_1985_postwar.1.d: "The guns on the Iranian front fall quiet, but Iraq's balance sheet is ruined. Baghdad argues that it fought for the Arab world, only to find Kuwait and other creditors demanding repayment. Saddam's circle now claims that Kuwait is overproducing oil, depressing prices, and stealing from the Rumaila field while Iraq bleeds under debt."
 irq_1985_postwar.1.a: "We bled for them, and this is their answer."
 irq_1985_resource_sale.1.t: "Iraq Offers Basrah Oil Concessions"
 irq_1985_resource_sale.1.d: "Baghdad is offering American companies resource rights in Basrah in exchange for financial relief. Accepting gives Washington a foothold in Iraqi oil, but it also stabilizes Saddam's postwar economy."
 irq_1985_resource_sale.1.a: "Accept the concession."
 irq_1985_resource_sale.1.b: "Refuse the offer."
 irq_1985_resource_sale.2.t: "Iraq Offers Maysan Oil Concessions"
 irq_1985_resource_sale.2.d: "Baghdad is offering British companies resource rights in Maysan in exchange for financial relief. Accepting gives London a foothold in Iraqi oil, but it also stabilizes Saddam's postwar economy."
 irq_1985_resource_sale.2.a: "Accept the concession."
 irq_1985_resource_sale.2.b: "Refuse the offer."
 irq_1985_resource_sale.3.t: "Iraq Offers Kirkuk Oil Concessions"
 irq_1985_resource_sale.3.d: "Baghdad is offering French companies resource rights in Kirkuk in exchange for financial relief. Accepting gives Paris a foothold in Iraqi oil, but it also stabilizes Saddam's postwar economy."
 irq_1985_resource_sale.3.a: "Accept the concession."
 irq_1985_resource_sale.3.b: "Refuse the offer."
 irq_1985_resource_sale.4.t: "Iraq Offers Nineveh Oil Concessions"
 irq_1985_resource_sale.4.d: "Baghdad is offering Soviet companies resource rights in Nineveh in exchange for financial relief. Accepting gives Moscow a foothold in Iraqi oil, but it also stabilizes Saddam's postwar economy."
 irq_1985_resource_sale.4.a: "Accept the concession."
 irq_1985_resource_sale.4.b: "Refuse the offer."
