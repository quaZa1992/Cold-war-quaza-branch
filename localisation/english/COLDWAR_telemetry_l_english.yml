l_english:
 # IMPERIA COLD WAR — MP telemetry: test tools.
 COLDWAR_tel_test_tools: "Test Tools"
 COLDWAR_tel_test_tools_desc: "Markers for the multiplayer test. A click writes the date and your country into the game log, so the moment can be found later. No effect on the game."
 COLDWAR_tel_mark_bug: "Mark a Bug Here"
 COLDWAR_tel_mark_bug_desc: "Something looks wrong right now (an effect, a tooltip, a missing unit, a strange event). Click and tell us in chat what you saw."
 COLDWAR_tel_mark_bug_tt: "Writes a §Ybug marker§! with today's date into the game log"
 COLDWAR_tel_mark_lag: "Mark Lag or Desync Here"
 COLDWAR_tel_mark_lag_desc: "The game is slow, stutters, or the host and players see different things. Click and tell us in chat what happened."
 COLDWAR_tel_mark_lag_tt: "Writes a §Ylag or desync marker§! with today's date into the game log"
