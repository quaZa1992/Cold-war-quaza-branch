 COLDWAR_CZE_1970_require_commissioned_reactor_NOT: "A commissioned civil reactor has a secure fuel supply"
 COLDWAR_CZE_1970_require_council_power_project: "The United Power Grid Programme has been approved for our delegation"
 COLDWAR_CZE_1970_require_council_power_project_NOT: "The United Power Grid Programme has been approved for our delegation"
 COLDWAR_CZE_1970_require_slovak_counterpart: "A Slovak player government participates in the constitutional talks"
 COLDWAR_CZE_1970_require_slovak_counterpart_NOT: "A Slovak player government participates in the constitutional talks"
 COLDWAR_CZE_1970_require_common_property_ledger: "Both republics have approved the same property ledger"
 COLDWAR_CZE_1970_require_common_property_ledger_NOT: "Both republics have approved the same property ledger"
 COLDWAR_CZE_1970_require_separation_ratified: "Both republics have ratified the separation"
 COLDWAR_CZE_1970_require_separation_ratified_NOT: "Both republics have ratified the separation"
