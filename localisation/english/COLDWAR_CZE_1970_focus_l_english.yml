 COLDWAR_CZE_1970_party_profile_KSC: "The Communist Party of Czechoslovakia controls the central institutions of the state. Its presidium must choose between political consolidation, bloc orthodoxy, managerial reform and a rehabilitated socialist programme. The party leadership, presidency and federal government remain distinct offices."
 COLDWAR_CZE_1970_party_profile_CSS: "The Czechoslovak Socialist Party has survived within the National Front under communist predominance. An independent mandate would give its municipal organisations a choice between public services and cooperative enterprise."
 COLDWAR_CZE_1970_party_profile_CSL: "The Czechoslovak People's Party represents a Christian social tradition rooted especially in Moravia. Its programme joins religious liberty, rural institutions and family policy with competing approaches to welfare and the social market."
 COLDWAR_CZE_1970_party_profile_SSO: "The Party of Slovak Revival operates as a constrained National Front organisation. Constitutional competition could restore an independent Slovak civic and democratic tradition, with a stronger role for regional enterprise and parliamentary government."
 COLDWAR_CZE_1970_party_profile_DS: "The restored Democratic Party seeks a Slovak parliamentary mandate, independent civic institutions and regional enterprise. Its economic programme must reconcile competition with the guarantees required to hold a governing coalition together."
 COLDWAR_CZE_1970_party_profile_SLOBODA: "The Slovak Freedom Party has Christian-republican roots and a small place within the National Front. A competitive mandate would put local institutions, cultural rights and the balance between civic and church welfare at the centre of its programme."
 COLDWAR_CZE_1970_party_profile_CSSD: "Czechoslovak Social Democracy draws on a suppressed domestic tradition and an organisation maintained in exile. Its restoration would place collective bargaining, social insurance and accountable public finance at the centre of democratic government."
 COLDWAR_CZE_1970_party_profile_OF: "Civic Forum brings together constitutional democrats, dissenting intellectuals and supporters of economic reform. Its broad mandate leaves a substantial dispute over the pace of market reform and the safeguards of the new republic."
 COLDWAR_CZE_1970_party_profile_VPN: "Public Against Violence represents a Slovak civic alternative to one-party government. Its programme combines democratic institutions and transparent accounts with competing federal and republican approaches to economic development."
 COLDWAR_CZE_1970_party_profile_KDH: "The Christian Democratic Movement draws on Slovak Catholic civic networks. It seeks religious liberty, accountable government and a social market, while debating how far families and voluntary institutions can carry the responsibilities of public welfare."
 COLDWAR_CZE_1970_party_profile_SNS: "The Slovak National Party places republican sovereignty, cultural institutions and national economic capacity at the centre of its programme. A treaty federation and a consensual sovereign settlement offer competing constitutional futures."
 COLDWAR_CZE_1970_party_profile_GREEN: "The Green Party responds to polluted industrial regions, damaged rivers and the public costs of coal. Its programme must choose between a regulated nuclear transition and lower energy demand, while funding industrial conversion and environmental oversight."
 COLDWAR_CZE_1970_party_profile_independent_civic_opposition: "Independent civic and liberal circles seek legal guarantees, freedom of expression and a constitutional political opening. A common electoral movement requires public organisation and a registered mandate."
 COLDWAR_CZE_1970_party_profile_social_democratic_opposition: "The social-democratic tradition survives through excluded activists and exile organisations. An independent domestic party requires legal restoration and a competitive political settlement."
 COLDWAR_CZE_1970_party_profile_environmental_movement: "Scientific, conservation and civic circles raise concerns about industrial pollution and damage to the landscape. Their development into a political party depends on a legal opening and public organisation."
 COLDWAR_CZE_1970_party_profile_national_representatives: "Slovak national and cultural representatives debate the powers of the republic within the federation. Independent party organisation requires constitutional competition."
