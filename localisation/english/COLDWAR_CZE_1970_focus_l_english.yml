l_english:
# IMPERIA COLD WAR — Czechoslovakia 1970 national programmes.
 COLDWAR_CZE_1970_require_rehabilitation:0 "Political rehabilitation has been enacted"
 COLDWAR_CZE_1970_require_rehabilitation_NOT:0 "Political rehabilitation has been enacted"
 COLDWAR_CZE_1970_require_design_and_fuel:0 "An active reactor design and fuel agreement is in force"
 COLDWAR_CZE_1970_require_design_and_fuel_NOT:0 "An active reactor design and fuel agreement is in force"
 COLDWAR_CZE_1970_require_commissioned_reactor:0 "A commissioned civil reactor has a secure fuel supply"
 COLDWAR_CZE_1970_require_commissioned_reactor_NOT:0 "A commissioned civil reactor has a secure fuel supply"
 COLDWAR_CZE_1970_require_council_power_project:0 "The United Power Grid Programme has been approved for our delegation"
 COLDWAR_CZE_1970_require_council_power_project_NOT:0 "The United Power Grid Programme has been approved for our delegation"
 COLDWAR_CZE_1970_require_slovak_counterpart:0 "A Slovak player government participates in the constitutional talks"
 COLDWAR_CZE_1970_require_slovak_counterpart_NOT:0 "A Slovak player government participates in the constitutional talks"
 COLDWAR_CZE_1970_require_common_property_ledger:0 "Both republics have approved the same property ledger"
 COLDWAR_CZE_1970_require_common_property_ledger_NOT:0 "Both republics have approved the same property ledger"
 COLDWAR_CZE_1970_require_separation_ratified:0 "Both republics have ratified the separation"
 COLDWAR_CZE_1970_require_separation_ratified_NOT:0 "Both republics have ratified the separation"
 COLDWAR_CZE_1970_require_three_agreements:0 "At least three bilateral agreements are active"
 COLDWAR_CZE_1970_require_three_agreements_NOT:0 "At least three bilateral agreements are active"
 COLDWAR_CZE_1970_spirit_start_0:0 "Normalisation and Cadre Screening"
 COLDWAR_CZE_1970_spirit_start_0_desc:0 "The leadership is rebuilding political control after the defeat of the Prague Spring. Screening restores a dependable apparatus, but exclusions and censorship deprive universities and enterprises of experienced specialists."
 COLDWAR_CZE_1970_spirit_start_1:0 "Soviet Forces on Our Soil"
 COLDWAR_CZE_1970_spirit_start_1_desc:0 "The Soviet Central Group of Forces remains under the post-intervention military agreement. Its presence anchors Moscow's influence and makes national sovereignty a continuing political dispute."
 COLDWAR_CZE_1970_spirit_start_2:0 "An Uneven Federation"
 COLDWAR_CZE_1970_spirit_start_2_desc:0 "The Czech and Slovak republics have their own institutions within the federation. The balance of investment, revenue and authority remains contested, complicating common decisions."
 COLDWAR_CZE_1970_spirit_start_3:0 "An Engineering Heartland"
 COLDWAR_CZE_1970_spirit_start_3_desc:0 "Established engineering firms, skilled trades and technical institutions give Czechoslovakia a strong industrial base. Heavy production and large serial orders place substantial demands on energy and supporting infrastructure."
 COLDWAR_CZE_1970_spirit_start_4:0 "Soft Budgets and Plan Targets"
 COLDWAR_CZE_1970_spirit_start_4_desc:0 "Enterprises answer to output plans and administrative allocations. Unclear financial responsibility protects established production while weakening incentives for quality, efficient investment and professional services."
 COLDWAR_CZE_1970_spirit_start_5:0 "The Material Social Contract"
 COLDWAR_CZE_1970_spirit_start_5_desc:0 "Employment guarantees, subsidised essentials and housing programmes promise households an ordinary, secure life. Keeping that promise requires public funding and a substantial commitment of industrial capacity.\\n\\nWeekly expenditure: §R0.015%§! of current GDP."
 COLDWAR_CZE_1970_spirit_start_6:0 "Coal, Smoke and Heavy Industry"
 COLDWAR_CZE_1970_spirit_start_6_desc:0 "Coal supports power generation and the heavy industrial regions. Smoke, damaged land and polluted water impose a growing burden on communities and public health services."
 COLDWAR_CZE_1970_spirit_start_7:0 "Technical Schools, Closed Doors"
 COLDWAR_CZE_1970_spirit_start_7_desc:0 "Technical schools and research institutes preserve valuable scientific expertise. Political barriers restrict access and exchange, while maintaining specialist education remains a substantial public commitment."
 COLDWAR_CZE_1970_spirit_state_order:0 "Consolidated Party Rule"
 COLDWAR_CZE_1970_spirit_state_order_desc:0 "Administrative control offers continuity at the cost of professional autonomy."
 COLDWAR_CZE_1970_spirit_state_dialogue:0 "A Contested Opening"
 COLDWAR_CZE_1970_spirit_state_dialogue_desc:0 "A credible constitutional dialogue can admit competing political organisations. It also exposes the regime to resistance."
 COLDWAR_CZE_1970_spirit_state_purge:0 "A Disciplined Party State"
 COLDWAR_CZE_1970_spirit_state_purge_desc:0 "A comprehensive purge creates a reliable apparatus and excludes experienced specialists."
 COLDWAR_CZE_1970_spirit_state_retain:0 "Professional Cadres Retained"
 COLDWAR_CZE_1970_spirit_state_retain_desc:0 "Protect technical expertise while retaining the party monopoly."
 COLDWAR_CZE_1970_spirit_state_pluralism:0 "Contested Public Life"
 COLDWAR_CZE_1970_spirit_state_pluralism_desc:0 "Permit independent movements and restored parties to organise and compete for office."
 COLDWAR_CZE_1970_spirit_state_courts:0 "A Supervised Public Sphere"
 COLDWAR_CZE_1970_spirit_state_courts_desc:0 "A disciplined review apparatus reduces the cost of routine enforcement and constrains exchange."
 COLDWAR_CZE_1970_spirit_state_legalism:0 "A Predictable Administration"
 COLDWAR_CZE_1970_spirit_state_legalism_desc:0 "Publishing consistent administrative rules restrains arbitrary interventions."
 COLDWAR_CZE_1970_spirit_state_amnesty:0 "Selective Rehabilitation"
 COLDWAR_CZE_1970_spirit_state_amnesty_desc:0 "Review political exclusions without immediately abandoning a socialist constitutional framework."
 COLDWAR_CZE_1970_spirit_state_monitor:0 "Public Legal Guarantees"
 COLDWAR_CZE_1970_spirit_state_monitor_desc:0 "Published rights create space for scholarship and a greater burden of legal accountability."
 COLDWAR_CZE_1970_spirit_state_treaty_order:0 "Treaty-Based Administration"
 COLDWAR_CZE_1970_spirit_state_treaty_order_desc:0 "A treaty-based administrative order improves political coordination while requiring a larger state apparatus."
 COLDWAR_CZE_1970_spirit_state_human_rights:0 "Enforceable Civic Guarantees"
 COLDWAR_CZE_1970_spirit_state_human_rights_desc:0 "Independent review improves access to knowledge and requires a functioning legal administration."
 COLDWAR_CZE_1970_spirit_ksc_plan:0 "A Party Governing Programme"
 COLDWAR_CZE_1970_spirit_ksc_plan_desc:0 "Set the governing party's priorities for the coming national plan."
 COLDWAR_CZE_1970_spirit_ksc_husak:0 "Managed Normalisation"
 COLDWAR_CZE_1970_spirit_ksc_husak_desc:0 "Concentrate on predictable employment, housing and consumption under continued party rule."
 COLDWAR_CZE_1970_spirit_ksc_bilak:0 "Orthodox Party Discipline"
 COLDWAR_CZE_1970_spirit_ksc_bilak_desc:0 "Consolidate the ideological apparatus and close the space for reform."
 COLDWAR_CZE_1970_spirit_ksc_strougal:0 "Technocratic Administration"
 COLDWAR_CZE_1970_spirit_ksc_strougal_desc:0 "Judge economic management by practical results while keeping socialist institutions."
 COLDWAR_CZE_1970_spirit_ksc_dubcek:0 "A Reform Communist Mandate"
 COLDWAR_CZE_1970_spirit_ksc_dubcek_desc:0 "A rehabilitated reform leadership can reopen the programme interrupted in 1968."
 COLDWAR_CZE_1970_spirit_husak_consumer:0 "Reliable Consumer Deliveries"
 COLDWAR_CZE_1970_spirit_husak_consumer_desc:0 "Reserve industrial capacity for household goods."
 COLDWAR_CZE_1970_spirit_husak_prices:0 "Protected Household Prices"
 COLDWAR_CZE_1970_spirit_husak_prices_desc:0 "Hold the retail bargain together through continuing public expenditure.\\n\\nWeekly expenditure: §R0.01%§! of current GDP."
 COLDWAR_CZE_1970_spirit_husak_invest:0 "Disciplined Social Spending"
 COLDWAR_CZE_1970_spirit_husak_invest_desc:0 "Protect investment budgets by reducing the margin available for subsidies."
 COLDWAR_CZE_1970_spirit_husak_settlement:0 "A Managed Social Compact"
 COLDWAR_CZE_1970_spirit_husak_settlement_desc:0 "A durable bargain offers stability and steady production while absorbing capacity."
 COLDWAR_CZE_1970_spirit_bilak_schools:0 "Ideological Schools"
 COLDWAR_CZE_1970_spirit_bilak_schools_desc:0 "Align educational institutions with political priorities."
 COLDWAR_CZE_1970_spirit_bilak_bloc:0 "Priority Bloc Orders"
 COLDWAR_CZE_1970_spirit_bilak_bloc_desc:0 "Concentrate on standardised industrial and defence orders for the socialist bloc."
 COLDWAR_CZE_1970_spirit_bilak_surveillance:0 "A Reinforced Security Apparatus"
 COLDWAR_CZE_1970_spirit_bilak_surveillance_desc:0 "Expand surveillance and administrative control at a sustained public cost."
 COLDWAR_CZE_1970_spirit_bilak_nomenklatura:0 "A Protected Cadre Ladder"
 COLDWAR_CZE_1970_spirit_bilak_nomenklatura_desc:0 "Political reliability governs appointments, even where expertise is scarce."
 COLDWAR_CZE_1970_spirit_bilak_settlement:0 "A Disciplined Bloc State"
 COLDWAR_CZE_1970_spirit_bilak_settlement_desc:0 "Accept ideological rigidity in return for a powerful apparatus and concentrated production."
 COLDWAR_CZE_1970_spirit_strougal_managers:0 "Technical Management"
 COLDWAR_CZE_1970_spirit_strougal_managers_desc:0 "Give engineers and production managers more authority over day-to-day decisions."
 COLDWAR_CZE_1970_spirit_strougal_contracts:0 "Enterprise Delivery Contracts"
 COLDWAR_CZE_1970_spirit_strougal_contracts_desc:0 "Replace part of the quota burden with negotiated delivery and quality obligations."
 COLDWAR_CZE_1970_spirit_strougal_surplus:0 "Enterprise Investment Funds"
 COLDWAR_CZE_1970_spirit_strougal_surplus_desc:0 "Let enterprises reinvest more of their results instead of remitting them to the treasury."
 COLDWAR_CZE_1970_spirit_strougal_audit:0 "Federal Investment Audits"
 COLDWAR_CZE_1970_spirit_strougal_audit_desc:0 "Central audits improve public returns but expand administration."
 COLDWAR_CZE_1970_spirit_strougal_settlement:0 "A Technocratic Settlement"
 COLDWAR_CZE_1970_spirit_strougal_settlement_desc:0 "A more capable economy carries an expensive technical administration."
 COLDWAR_CZE_1970_spirit_dubcek_councils:0 "Enterprise Councils"
 COLDWAR_CZE_1970_spirit_dubcek_councils_desc:0 "Worker representation improves local knowledge and limits unilateral party direction."
 COLDWAR_CZE_1970_spirit_dubcek_market:0 "Socialist Market Reform"
 COLDWAR_CZE_1970_spirit_dubcek_market_desc:0 "A reform economy accepts price and enterprise uncertainty in exchange for stronger incentives."
 COLDWAR_CZE_1970_spirit_dubcek_social:0 "Democratic Planning"
 COLDWAR_CZE_1970_spirit_dubcek_social_desc:0 "Consultation protects social guarantees and slows investment decisions."
 COLDWAR_CZE_1970_spirit_dubcek_settlement:0 "Socialism with Consent"
 COLDWAR_CZE_1970_spirit_dubcek_settlement_desc:0 "Rebuild socialist legitimacy through participation and a less commanding party apparatus."
 COLDWAR_CZE_1970_spirit_css_municipal:0 "Municipal Public Service"
 COLDWAR_CZE_1970_spirit_css_municipal_desc:0 "The Socialist Party can turn its civic tradition into a programme of local government."
 COLDWAR_CZE_1970_spirit_css_councils:0 "Elected Town Councils"
 COLDWAR_CZE_1970_spirit_css_councils_desc:0 "Local accountability protects municipal interests and limits federal direction."
 COLDWAR_CZE_1970_spirit_css_enterprises:0 "Municipal Enterprises"
 COLDWAR_CZE_1970_spirit_css_enterprises_desc:0 "Public firms fund local services but reserve a larger part of production for them."
 COLDWAR_CZE_1970_spirit_css_civic_budget:0 "A Civic Municipal Budget"
 COLDWAR_CZE_1970_spirit_css_civic_budget_desc:0 "Leave more revenue with local institutions and accept lower central receipts."
 COLDWAR_CZE_1970_spirit_css_cooperatives:0 "A Cooperative Civic Economy"
 COLDWAR_CZE_1970_spirit_css_cooperatives_desc:0 "Cooperative ownership combines local initiative with dispersed authority."
 COLDWAR_CZE_1970_spirit_css_public_services:0 "Universal Town Services"
 COLDWAR_CZE_1970_spirit_css_public_services_desc:0 "Municipal service teams sustain health and welfare delivery through local public offices.\\n\\nWeekly expenditure: §R0.012%§! of current GDP."
 COLDWAR_CZE_1970_spirit_csl_social:0 "A Christian Social Mandate"
 COLDWAR_CZE_1970_spirit_csl_social_desc:0 "Build a governing programme around human dignity, social duty and independent institutions."
 COLDWAR_CZE_1970_spirit_csl_parishes:0 "Parish Welfare Networks"
 COLDWAR_CZE_1970_spirit_csl_parishes_desc:0 "Local charity networks support household care and community life through parish associations.\\n\\nWeekly expenditure: §R0.003%§! of current GDP."
 COLDWAR_CZE_1970_spirit_csl_public_welfare:0 "Universal Social Insurance"
 COLDWAR_CZE_1970_spirit_csl_public_welfare_desc:0 "A universal public scheme reaches beyond parish networks and needs regular funding.\\n\\nWeekly expenditure: §R0.012%§! of current GDP."
 COLDWAR_CZE_1970_spirit_csl_workers:0 "Christian Labour Associations"
 COLDWAR_CZE_1970_spirit_csl_workers_desc:0 "Independent labour associations provide social representation rather than a party transmission belt."
 COLDWAR_CZE_1970_spirit_csl_schools:0 "Plural School Charters"
 COLDWAR_CZE_1970_spirit_csl_schools_desc:0 "Independent education expands choice and creates additional funding obligations."
 COLDWAR_CZE_1970_spirit_csl_land:0 "Family Farm Restitution"
 COLDWAR_CZE_1970_spirit_csl_land_desc:0 "Restore individual holdings with a transition cost for established cooperatives."
 COLDWAR_CZE_1970_spirit_csl_coops:0 "Protected Farm Cooperatives"
 COLDWAR_CZE_1970_spirit_csl_coops_desc:0 "Preserve established agricultural organisations and strengthen social protections."
 COLDWAR_CZE_1970_spirit_csl_social_market:0 "A Christian Social Market"
 COLDWAR_CZE_1970_spirit_csl_social_market_desc:0 "Support enterprise with enforceable social obligations."
 COLDWAR_CZE_1970_spirit_ds_mandate:0 "Slovak Civic Representation"
 COLDWAR_CZE_1970_spirit_ds_mandate_desc:0 "An autonomous party can represent local enterprise and Slovak civic institutions."
 COLDWAR_CZE_1970_spirit_ds_republic:0 "A Renewed Revival Party"
 COLDWAR_CZE_1970_spirit_ds_republic_desc:0 "Keep the Revival Party identity while ending its subordinate National Front role."
 COLDWAR_CZE_1970_spirit_ds_business:0 "Regional Enterprise Credit"
 COLDWAR_CZE_1970_spirit_ds_business_desc:0 "Finance local enterprises through accountable regional institutions."
 COLDWAR_CZE_1970_spirit_ds_regional_budget:0 "Republican Budget Rights"
 COLDWAR_CZE_1970_spirit_ds_regional_budget_desc:0 "Let republican institutions retain a larger role in spending decisions."
 COLDWAR_CZE_1970_spirit_ds_competition:0 "Regional Market Competition"
 COLDWAR_CZE_1970_spirit_ds_competition_desc:0 "Competitive local markets promise stronger productivity and a difficult adjustment."
 COLDWAR_CZE_1970_spirit_ds_civic_guarantee:0 "Guaranteed Regional Services"
 COLDWAR_CZE_1970_spirit_ds_civic_guarantee_desc:0 "Protect regional services through a continuing public guarantee.\\n\\nWeekly expenditure: §R0.01%§! of current GDP."
 COLDWAR_CZE_1970_spirit_sloboda_programme:0 "Local Civic Service"
 COLDWAR_CZE_1970_spirit_sloboda_programme_desc:0 "Give the Slovak Freedom Party a programme distinct from both the Revival Party and later KDH."
 COLDWAR_CZE_1970_spirit_sloboda_church:0 "Faith-Based Civic Work"
 COLDWAR_CZE_1970_spirit_sloboda_church_desc:0 "Work with independent religious and charitable associations."
 COLDWAR_CZE_1970_spirit_sloboda_municipal:0 "Republican Municipalism"
 COLDWAR_CZE_1970_spirit_sloboda_municipal_desc:0 "Give towns and districts a larger voice within Slovak institutions."
 COLDWAR_CZE_1970_spirit_sloboda_languages:0 "Local Language Guarantees"
 COLDWAR_CZE_1970_spirit_sloboda_languages_desc:0 "Protect local language access while funding the administration it requires."
 COLDWAR_CZE_1970_spirit_sloboda_fiscal:0 "Local Revenue Autonomy"
 COLDWAR_CZE_1970_spirit_sloboda_fiscal_desc:0 "Leave more fiscal discretion in local hands."
 COLDWAR_CZE_1970_spirit_sloboda_solidarity:0 "A Solidarity Service Fund"
 COLDWAR_CZE_1970_spirit_sloboda_solidarity_desc:0 "Equalise access to services through an enduring solidarity fund.\\n\\nWeekly expenditure: §R0.01%§! of current GDP."
 COLDWAR_CZE_1970_spirit_cssd_labour:0 "Democratic Labour Representation"
 COLDWAR_CZE_1970_spirit_cssd_labour_desc:0 "The restored Social Democracy offers organised labour an independent democratic voice."
 COLDWAR_CZE_1970_spirit_cssd_bargaining:0 "Sectoral Bargaining"
 COLDWAR_CZE_1970_spirit_cssd_bargaining_desc:0 "Negotiated sector agreements protect workers and slow changes to production routines."
 COLDWAR_CZE_1970_spirit_cssd_enterprise:0 "Employee Ownership"
 COLDWAR_CZE_1970_spirit_cssd_enterprise_desc:0 "A share of enterprise returns stays with employee-owned firms."
 COLDWAR_CZE_1970_spirit_cssd_retraining:0 "A National Retraining Fund"
 COLDWAR_CZE_1970_spirit_cssd_retraining_desc:0 "Fund new skills for workers facing enterprise reform."
 COLDWAR_CZE_1970_spirit_cssd_insurance:0 "Portable Social Insurance"
 COLDWAR_CZE_1970_spirit_cssd_insurance_desc:0 "Allow workers to change jobs without losing their social protections.\\n\\nWeekly expenditure: §R0.012%§! of current GDP."
 COLDWAR_CZE_1970_spirit_cssd_universal:0 "Universal Public Welfare"
 COLDWAR_CZE_1970_spirit_cssd_universal_desc:0 "A universal scheme guarantees broad coverage and a larger budget.\\n\\nWeekly expenditure: §R0.015%§! of current GDP."
 COLDWAR_CZE_1970_spirit_cssd_targeted:0 "Targeted Social Investment"
 COLDWAR_CZE_1970_spirit_cssd_targeted_desc:0 "Concentrate resources on education and retraining while narrowing unconditional benefits."
 COLDWAR_CZE_1970_spirit_cssd_tripartite:0 "Tripartite Economic Coordination"
 COLDWAR_CZE_1970_spirit_cssd_tripartite_desc:0 "Government, employers and labour negotiate the pace of reform."
 COLDWAR_CZE_1970_spirit_of_mandate:0 "A Civic Governing Mandate"
 COLDWAR_CZE_1970_spirit_of_mandate_desc:0 "A civic movement in office must turn opposition solidarity into workable government."
 COLDWAR_CZE_1970_spirit_of_courts:0 "Independent Constitutional Law"
 COLDWAR_CZE_1970_spirit_of_courts_desc:0 "Predictable courts support civic and commercial life at an administrative cost."
 COLDWAR_CZE_1970_spirit_of_local:0 "Civic Self-Government"
 COLDWAR_CZE_1970_spirit_of_local_desc:0 "Strong municipalities spread authority across the republic."
 COLDWAR_CZE_1970_spirit_of_universities:0 "Open Technical Education"
 COLDWAR_CZE_1970_spirit_of_universities_desc:0 "End political barriers to study and academic exchange."
 COLDWAR_CZE_1970_spirit_of_press:0 "Independent Public Media"
 COLDWAR_CZE_1970_spirit_of_press_desc:0 "An independent public sphere expands access to information and restricts government control."
 COLDWAR_CZE_1970_spirit_of_transparency:0 "Transparent Public Accounts"
 COLDWAR_CZE_1970_spirit_of_transparency_desc:0 "Public accounting improves collection and requires independent scrutiny."
 COLDWAR_CZE_1970_spirit_of_rapid_market:0 "Rapid Enterprise Reform"
 COLDWAR_CZE_1970_spirit_of_rapid_market_desc:0 "Fast reform promises strong productivity and a pronounced social adjustment."
 COLDWAR_CZE_1970_spirit_of_rapid_market_of_market_adjustment_strain:0 "Market Adjustment Strain"
 COLDWAR_CZE_1970_spirit_of_rapid_market_of_market_adjustment_strain_desc:0 "Rapid enterprise reform brings a one-year adjustment period with lower stability and more civilian industry reserved for consumer goods."
 COLDWAR_CZE_1970_spirit_of_gradual_market:0 "A Negotiated Market Transition"
 COLDWAR_CZE_1970_spirit_of_gradual_market_desc:0 "Negotiate the transition with enterprises and labour, preserving more social obligations."
 COLDWAR_CZE_1970_spirit_vpn_mandate:0 "A Slovak Civic Government"
 COLDWAR_CZE_1970_spirit_vpn_mandate_desc:0 "Translate Slovak civic mobilisation into a lawful governing programme."
 COLDWAR_CZE_1970_spirit_vpn_federal:0 "Democratic Federal Partnership"
 COLDWAR_CZE_1970_spirit_vpn_federal_desc:0 "Secure Slovak representation through a shared democratic federation."
 COLDWAR_CZE_1970_spirit_vpn_republic:0 "Republican Administrative Power"
 COLDWAR_CZE_1970_spirit_vpn_republic_desc:0 "Build capable republican institutions with their own administrative burden."
 COLDWAR_CZE_1970_spirit_vpn_civic_schools:0 "Civic School Renewal"
 COLDWAR_CZE_1970_spirit_vpn_civic_schools_desc:0 "Renew schools and remove political barriers to study."
 COLDWAR_CZE_1970_spirit_vpn_public_accounts:0 "Republican Public Accounts"
 COLDWAR_CZE_1970_spirit_vpn_public_accounts_desc:0 "Make republican expenditure open to independent scrutiny."
 COLDWAR_CZE_1970_spirit_vpn_local_market:0 "Local Enterprise Transition"
 COLDWAR_CZE_1970_spirit_vpn_local_market_desc:0 "Allow local enterprise to compete while accepting uneven adjustment."
 COLDWAR_CZE_1970_spirit_vpn_solidarity:0 "Republican Solidarity"
 COLDWAR_CZE_1970_spirit_vpn_solidarity_desc:0 "A solidarity programme protects regions that would otherwise lose from reform.\\n\\nWeekly expenditure: §R0.012%§! of current GDP."
 COLDWAR_CZE_1970_spirit_vpn_cultural:0 "Independent Slovak Culture"
 COLDWAR_CZE_1970_spirit_vpn_cultural_desc:0 "Support Slovak cultural institutions as a civic public good."
 COLDWAR_CZE_1970_spirit_kdh_mandate:0 "A Christian Democratic Mandate"
 COLDWAR_CZE_1970_spirit_kdh_mandate_desc:0 "Build an independent Christian-democratic programme from legal civic and religious organisation."
 COLDWAR_CZE_1970_spirit_kdh_schools:0 "Plural Religious Education"
 COLDWAR_CZE_1970_spirit_kdh_schools_desc:0 "Permit independent religious schooling while meeting common educational standards."
 COLDWAR_CZE_1970_spirit_kdh_social:0 "Catholic Social Associations"
 COLDWAR_CZE_1970_spirit_kdh_social_desc:0 "Charitable institutions share social work with public authorities."
 COLDWAR_CZE_1970_spirit_kdh_workers:0 "Christian Social Partnership"
 COLDWAR_CZE_1970_spirit_kdh_workers_desc:0 "Negotiate obligations between workers, employers and public institutions."
 COLDWAR_CZE_1970_spirit_kdh_religious_liberty:0 "Religious Liberty in Law"
 COLDWAR_CZE_1970_spirit_kdh_religious_liberty_desc:0 "Legal protection for religious practice expands scholarly access and requires enforceable administrative safeguards."
 COLDWAR_CZE_1970_spirit_kdh_market:0 "The Christian Social Market"
 COLDWAR_CZE_1970_spirit_kdh_market_desc:0 "Enterprise and family institutions retain a larger part of national income."
 COLDWAR_CZE_1970_spirit_kdh_families:0 "Family and Community Guarantees"
 COLDWAR_CZE_1970_spirit_kdh_families_desc:0 "A strong family and community programme requires continued public funding.\\n\\nWeekly expenditure: §R0.012%§! of current GDP."
 COLDWAR_CZE_1970_spirit_sns_mandate:0 "A Slovak National Mandate"
 COLDWAR_CZE_1970_spirit_sns_mandate_desc:0 "Represent Slovak national interests through lawful political institutions."
 COLDWAR_CZE_1970_spirit_sns_cultural:0 "National Cultural Institutions"
 COLDWAR_CZE_1970_spirit_sns_cultural_desc:0 "Expand Slovak public culture alongside enforceable minority language rights."
 COLDWAR_CZE_1970_spirit_sns_industry:0 "Slovak Industrial Ownership"
 COLDWAR_CZE_1970_spirit_sns_industry_desc:0 "Protect strategic republican ownership and accept a less flexible allocation of capacity."
 COLDWAR_CZE_1970_spirit_sns_revenue:0 "Republican Revenue Authority"
 COLDWAR_CZE_1970_spirit_sns_revenue_desc:0 "A stronger republican treasury adds administrative cost to the constitutional bargain."
 COLDWAR_CZE_1970_spirit_sns_treaty_federation:0 "A Treaty Federation"
 COLDWAR_CZE_1970_spirit_sns_treaty_federation_desc:0 "A treaty-based common state protects Slovak autonomy and limits unilateral federal action."
 COLDWAR_CZE_1970_spirit_sns_separation:0 "A Sovereignty Negotiation Mandate"
 COLDWAR_CZE_1970_spirit_sns_separation_desc:0 "Seek a sovereign Slovak settlement through negotiations and republican ratification."
 COLDWAR_CZE_1970_spirit_green_mandate:0 "An Environmental Mandate"
 COLDWAR_CZE_1970_spirit_green_mandate_desc:0 "Translate environmental mobilisation into an accountable government programme."
 COLDWAR_CZE_1970_spirit_green_nuclear:0 "Nuclear with Public Oversight"
 COLDWAR_CZE_1970_spirit_green_nuclear_desc:0 "Accept nuclear energy under independent safety review and public scrutiny."
 COLDWAR_CZE_1970_spirit_green_demand:0 "Energy Demand Management"
 COLDWAR_CZE_1970_spirit_green_demand_desc:0 "Conserve energy through strict building and industrial standards."
 COLDWAR_CZE_1970_spirit_green_monitoring:0 "Independent Pollution Registers"
 COLDWAR_CZE_1970_spirit_green_monitoring_desc:0 "Publication of pollution data requires a real monitoring service."
 COLDWAR_CZE_1970_spirit_green_river:0 "River and Soil Recovery"
 COLDWAR_CZE_1970_spirit_green_river_desc:0 "Repair land and water systems damaged by heavy industry and intensive farming."
 COLDWAR_CZE_1970_spirit_green_conversion:0 "Planned Industrial Conversion"
 COLDWAR_CZE_1970_spirit_green_conversion_desc:0 "Fund cleaner industrial production and retraining through public investment."
 COLDWAR_CZE_1970_spirit_green_limits:0 "Binding Environmental Limits"
 COLDWAR_CZE_1970_spirit_green_limits_desc:0 "Strict limits provide stronger health and energy gains at an immediate production cost."
 COLDWAR_CZE_1970_spirit_fed_review:0 "Federal Secretariat"
 COLDWAR_CZE_1970_spirit_fed_review_desc:0 "A federal secretariat improves coordination between common and republican institutions at an administrative cost."
 COLDWAR_CZE_1970_spirit_fed_central:0 "Federal Administrative Coordination"
 COLDWAR_CZE_1970_spirit_fed_central_desc:0 "A stronger centre can coordinate investment quickly but sharpens republican grievances."
 COLDWAR_CZE_1970_spirit_fed_republics:0 "A Republican Federal Bargain"
 COLDWAR_CZE_1970_spirit_fed_republics_desc:0 "Greater republican authority improves consent while dispersing federal power."
 COLDWAR_CZE_1970_spirit_fed_single_plan:0 "Unified Investment Planning"
 COLDWAR_CZE_1970_spirit_fed_single_plan_desc:0 "Coordinate large works through one investment authority."
 COLDWAR_CZE_1970_spirit_fed_equalisation:0 "Federal Equalisation"
 COLDWAR_CZE_1970_spirit_fed_equalisation_desc:0 "Protect poorer regions through a visible federal transfer programme.\\n\\nWeekly expenditure: §R0.01%§! of current GDP."
 COLDWAR_CZE_1970_spirit_fed_veto:0 "Republican Consent Rules"
 COLDWAR_CZE_1970_spirit_fed_veto_desc:0 "Require both republics to agree on major constitutional and investment decisions."
 COLDWAR_CZE_1970_spirit_fed_revenue:0 "Republican Revenue Shares"
 COLDWAR_CZE_1970_spirit_fed_revenue_desc:0 "Give republican treasuries clear shares of revenue and expenditure."
 COLDWAR_CZE_1970_spirit_fed_charter:0 "Federal Language Guarantees"
 COLDWAR_CZE_1970_spirit_fed_charter_desc:0 "Protect Czech, Slovak and minority language access through funded institutions."
 COLDWAR_CZE_1970_spirit_fed_permanent:0 "A Renewed Common State"
 COLDWAR_CZE_1970_spirit_fed_permanent_desc:0 "Commit both republics to a revised shared constitutional order."
 COLDWAR_CZE_1970_spirit_fed_confederation:0 "A Treaty-Based Common State"
 COLDWAR_CZE_1970_spirit_fed_confederation_desc:0 "Retain common institutions under a more demanding treaty of republican consent."
 COLDWAR_CZE_1970_spirit_fed_separate:0 "A Constitutional Negotiation"
 COLDWAR_CZE_1970_spirit_fed_separate_desc:0 "Invite republican representatives to negotiate the lawful future of the common state."
 COLDWAR_CZE_1970_spirit_ind_champions:0 "Concentrated State Champions"
 COLDWAR_CZE_1970_spirit_ind_champions_desc:0 "Concentrated firms can fulfil large orders while crowding out other uses of capacity."
 COLDWAR_CZE_1970_spirit_ind_contracts:0 "Enterprise Contract Reform"
 COLDWAR_CZE_1970_spirit_ind_contracts_desc:0 "Enterprise autonomy improves incentives and reduces direct central receipts."
 COLDWAR_CZE_1970_spirit_ind_exports:0 "Export Engineering Specialisation"
 COLDWAR_CZE_1970_spirit_ind_exports_desc:0 "Specialisation improves serial production and increases dependence on energy and export demand."
 COLDWAR_CZE_1970_spirit_ind_manager:0 "Accountable Enterprise Budgets"
 COLDWAR_CZE_1970_spirit_ind_manager_desc:0 "Put public enterprises on a clear and accountable financial basis."
 COLDWAR_CZE_1970_spirit_ind_quality:0 "Quality-Based Contracts"
 COLDWAR_CZE_1970_spirit_ind_quality_desc:0 "Reward usable output and timely delivery rather than gross quotas."
 COLDWAR_CZE_1970_spirit_ind_rail_equip:0 "Export Equipment Standards"
 COLDWAR_CZE_1970_spirit_ind_rail_equip_desc:0 "Common standards improve large production runs and require certification."
 COLDWAR_CZE_1970_spirit_ind_external_credit:0 "Export Finance Guarantees"
 COLDWAR_CZE_1970_spirit_ind_external_credit_desc:0 "Guarantee export financing while accepting a budget charge and additional financial risk.\\n\\nWeekly expenditure: §R0.006%§! of current GDP."
 COLDWAR_CZE_1970_spirit_ind_champion_final:0 "Integrated Engineering Combines"
 COLDWAR_CZE_1970_spirit_ind_champion_final_desc:0 "Large combines deliver concentrated industrial power and a costly allocation of resources."
 COLDWAR_CZE_1970_spirit_ind_contract_final:0 "Accountable Enterprise Management"
 COLDWAR_CZE_1970_spirit_ind_contract_final_desc:0 "A more productive enterprise sector retains more of its earnings."
 COLDWAR_CZE_1970_spirit_ind_export_final:0 "Export Specialisation"
 COLDWAR_CZE_1970_spirit_ind_export_final_desc:0 "A strong export specialisation consumes energy and ties capacity to external markets."
 COLDWAR_CZE_1970_spirit_ind_soft_budgets:0 "Enterprise Budget Adjustment"
 COLDWAR_CZE_1970_spirit_ind_soft_budgets_desc:0 "Replace the inherited budget problem with the economic institutions chosen in this programme."
 COLDWAR_CZE_1970_spirit_ind_consumer_priority:0 "Consumer Industry Priority"
 COLDWAR_CZE_1970_spirit_ind_consumer_priority_desc:0 "A stronger consumer sector improves supply at the cost of research priority."
 COLDWAR_CZE_1970_spirit_ind_precision:0 "Precision Engineering Priority"
 COLDWAR_CZE_1970_spirit_ind_precision_desc:0 "Concentrate scarce investment on advanced engineering rather than immediate consumption."
 COLDWAR_CZE_1970_spirit_ind_final:0 "A Renewed Engineering Heartland"
 COLDWAR_CZE_1970_spirit_ind_final_desc:0 "Replace the inherited engineering spirit with a modernised national base."
 COLDWAR_CZE_1970_spirit_energy_losses:0 "Reduced Network Losses"
 COLDWAR_CZE_1970_spirit_energy_losses_desc:0 "A staffed transmission audit and maintenance service reduces avoidable grid losses.\\n\\nWeekly expenditure: §R0.003%§! of current GDP."
 COLDWAR_CZE_1970_spirit_energy_coal:0 "Modern Coal Generation"
 COLDWAR_CZE_1970_spirit_energy_coal_desc:0 "Existing coal resources deliver rapid power expansion with a continuing health burden."
 COLDWAR_CZE_1970_spirit_energy_filters:0 "Filtered Coal Industry"
 COLDWAR_CZE_1970_spirit_energy_filters_desc:0 "Reduce the inherited health burden while keeping coal generation."
 COLDWAR_CZE_1970_spirit_energy_components:0 "Qualified Reactor Engineering"
 COLDWAR_CZE_1970_spirit_energy_components_desc:0 "Local component expertise improves operation and adds certification costs."
 COLDWAR_CZE_1970_spirit_energy_safety:0 "Independent Nuclear Inspection"
 COLDWAR_CZE_1970_spirit_energy_safety_desc:0 "Give an independent inspectorate authority to audit plant operation and fuel handling."
 COLDWAR_CZE_1970_spirit_energy_coal_final:0 "Coal Security with Safeguards"
 COLDWAR_CZE_1970_spirit_energy_coal_final_desc:0 "Secure domestic generation while funding fuel supply, health protection and environmental safeguards."
 COLDWAR_CZE_1970_spirit_energy_nuclear_final:0 "A Regulated Nuclear Sector"
 COLDWAR_CZE_1970_spirit_energy_nuclear_final_desc:0 "A civil nuclear sector can replace the inherited coal burden after real capacity is operating."
 COLDWAR_CZE_1970_spirit_energy_dispatch:0 "Integrated Power Dispatch"
 COLDWAR_CZE_1970_spirit_energy_dispatch_desc:0 "A permanent coordination office balances cross-republic electricity flows.\\n\\nWeekly expenditure: §R0.0015%§! of current GDP."
 COLDWAR_CZE_1970_spirit_energy_cleanup:0 "Binding Clean-Air Targets"
 COLDWAR_CZE_1970_spirit_energy_cleanup_desc:0 "Protect health through enforceable limits that constrain the dirtiest production."
 COLDWAR_CZE_1970_spirit_energy_output:0 "Protected Industrial Deliveries"
 COLDWAR_CZE_1970_spirit_energy_output_desc:0 "Keep industry supplied while accepting a larger burden on health services."
 COLDWAR_CZE_1970_spirit_energy_uranium_reserve:0 "Uranium Deposits in Reserve"
 COLDWAR_CZE_1970_spirit_energy_uranium_reserve_desc:0 "Avoid mine-related health costs while foregoing an immediate domestic nuclear supply industry."
 COLDWAR_CZE_1970_spirit_soc_panel:0 "Rapid Panel Housing"
 COLDWAR_CZE_1970_spirit_soc_panel_desc:0 "Standardised estates can be built quickly but carry a larger energy and service burden."
 COLDWAR_CZE_1970_spirit_soc_town:0 "Serviced Town Development"
 COLDWAR_CZE_1970_spirit_soc_town_desc:0 "A better-serviced urban programme trades speed for quality and local coordination."
 COLDWAR_CZE_1970_spirit_soc_repair:0 "Housing Repair and Insulation"
 COLDWAR_CZE_1970_spirit_soc_repair_desc:0 "Renovation saves energy while tying up capacity that could serve new construction."
 COLDWAR_CZE_1970_spirit_soc_compact:0 "A Renewed Social Contract"
 COLDWAR_CZE_1970_spirit_soc_compact_desc:0 "Replace the inherited bargain with a more efficient but still funded programme.\\n\\nWeekly expenditure: §R0.012%§! of current GDP."
 COLDWAR_CZE_1970_spirit_soc_mechanise:0 "Mechanised Large Farms"
 COLDWAR_CZE_1970_spirit_soc_mechanise_desc:0 "Large farms can raise output through mechanisation while consuming more energy."
 COLDWAR_CZE_1970_spirit_soc_farm_autonomy:0 "Autonomous Farm Cooperatives"
 COLDWAR_CZE_1970_spirit_soc_farm_autonomy_desc:0 "Let cooperatives retain more earnings and adjust their production decisions."
 COLDWAR_CZE_1970_spirit_soc_university:0 "Open Technical Education"
 COLDWAR_CZE_1970_spirit_soc_university_desc:0 "Remove political barriers while funding the institutions needed for technical education."
 COLDWAR_CZE_1970_spirit_soc_basic_science:0 "Independent Basic Science"
 COLDWAR_CZE_1970_spirit_soc_basic_science_desc:0 "Independent science offers broader discovery and a sustained education cost."
 COLDWAR_CZE_1970_spirit_soc_applied_science:0 "Applied Research Contracts"
 COLDWAR_CZE_1970_spirit_soc_applied_science_desc:0 "Applied contracts deliver production gains while narrowing the research agenda."
 COLDWAR_CZE_1970_spirit_soc_health:0 "Industrial Health Services"
 COLDWAR_CZE_1970_spirit_soc_health_desc:0 "Fund specialist clinics, occupational monitoring and prevention in industrial communities.\\n\\nWeekly expenditure: §R0.008%§! of current GDP."
 COLDWAR_CZE_1970_spirit_army_mechanised:0 "A Mechanised Field Army"
 COLDWAR_CZE_1970_spirit_army_mechanised_desc:0 "Prioritise mechanised formations and accept their larger supply burden."
 COLDWAR_CZE_1970_spirit_army_territorial:0 "Territorial Defence"
 COLDWAR_CZE_1970_spirit_army_territorial_desc:0 "A territorial system prepares local defence and needs a longer training programme."
 COLDWAR_CZE_1970_spirit_army_reserves:0 "Trained Territorial Reserves"
 COLDWAR_CZE_1970_spirit_army_reserves_desc:0 "Fund sustained reserve preparation, qualified instructors and reliable training establishments."
 COLDWAR_CZE_1970_spirit_army_field_final:0 "A Supported Mechanised Army"
 COLDWAR_CZE_1970_spirit_army_field_final_desc:0 "Support a capable mechanised force with a substantial logistical commitment."
 COLDWAR_CZE_1970_spirit_army_territory_final:0 "A Prepared Territorial Army"
 COLDWAR_CZE_1970_spirit_army_territory_final_desc:0 "A well-prepared territorial model accepts slower mobilisation training."
 COLDWAR_CZE_1970_spirit_army_logistics:0 "Maintained Military Logistics"
 COLDWAR_CZE_1970_spirit_army_logistics_desc:0 "Maintenance and transport services reduce waste and need professional administration."
 COLDWAR_CZE_1970_spirit_army_quantity:0 "Serial Equipment Orders"
 COLDWAR_CZE_1970_spirit_army_quantity_desc:0 "Long series raise output while reducing the urgency of design renewal."
 COLDWAR_CZE_1970_spirit_army_quality:0 "Selective Equipment Modernisation"
 COLDWAR_CZE_1970_spirit_army_quality_desc:0 "More frequent design renewal improves technical capability and disrupts production."
 COLDWAR_CZE_1970_spirit_army_academy:0 "Professional Military Schools"
 COLDWAR_CZE_1970_spirit_army_academy_desc:0 "Strengthen professional military education, command training and staff work."
 COLDWAR_CZE_1970_spirit_army_sustain:0 "Funded Readiness"
 COLDWAR_CZE_1970_spirit_army_sustain_desc:0 "Sustained readiness depends on a continuing budget programme.\\n\\nWeekly expenditure: §R0.01%§! of current GDP."
 COLDWAR_CZE_1970_spirit_army_joint:0 "Interoperable Command Procedures"
 COLDWAR_CZE_1970_spirit_army_joint_desc:0 "Shared procedures improve cooperation and constrain unilateral command discretion."
 COLDWAR_CZE_1970_spirit_army_national:0 "National Command Autonomy"
 COLDWAR_CZE_1970_spirit_army_national_desc:0 "National planning authority allows tailored plans but slows multinational coordination."
 COLDWAR_CZE_1970_spirit_air_training:0 "Training Aircraft Specialisation"
 COLDWAR_CZE_1970_spirit_air_training_desc:0 "Specialise in training aircraft and export engineering rather than maximum operational performance."
 COLDWAR_CZE_1970_spirit_air_frontline:0 "Front-Line Air Readiness"
 COLDWAR_CZE_1970_spirit_air_frontline_desc:0 "Sustain operational readiness with a continuing public commitment.\\n\\nWeekly expenditure: §R0.008%§! of current GDP."
 COLDWAR_CZE_1970_spirit_air_sam:0 "Integrated Ground Air Defence"
 COLDWAR_CZE_1970_spirit_air_sam_desc:0 "Coordinate ground air defence and accept its administrative burden."
 COLDWAR_CZE_1970_spirit_air_dispersal:0 "Dispersed Air Operations"
 COLDWAR_CZE_1970_spirit_air_dispersal_desc:0 "Operational dispersion trades flight safety and maintenance convenience for flexibility."
 COLDWAR_CZE_1970_spirit_air_safety:0 "Aviation Safety Standards"
 COLDWAR_CZE_1970_spirit_air_safety_desc:0 "Fund inspections, maintenance supervision and pilot safety training.\\n\\nWeekly expenditure: §R0.004%§! of current GDP."
 COLDWAR_CZE_1970_spirit_foreign_bloc:0 "A Reliable Bloc Partner"
 COLDWAR_CZE_1970_spirit_foreign_bloc_desc:0 "Assured bloc cooperation supports industry while narrowing external scientific exchange."
 COLDWAR_CZE_1970_spirit_foreign_bridge:0 "A Central European Bridge"
 COLDWAR_CZE_1970_spirit_foreign_bridge_desc:0 "A bridge policy requires professional diplomacy and dependable relationships across Central Europe."
 COLDWAR_CZE_1970_spirit_foreign_west:0 "A European Opening"
 COLDWAR_CZE_1970_spirit_foreign_west_desc:0 "Western exchange offers knowledge while a changed security relationship requires adjustment."
 COLDWAR_CZE_1970_spirit_foreign_service:0 "A Professional Foreign Service"
 COLDWAR_CZE_1970_spirit_foreign_service_desc:0 "Maintain the expertise needed to negotiate and supervise lasting agreements."
 COLDWAR_CZE_1970_spirit_cmea_entry:0 "An Active CMEA Delegation"
 COLDWAR_CZE_1970_spirit_cmea_entry_desc:0 "Represent Czechoslovak interests in the Council's production, research and investment negotiations."
 COLDWAR_CZE_1970_spirit_cmea_standards:0 "Common CMEA Technical Standards"
 COLDWAR_CZE_1970_spirit_cmea_standards_desc:0 "Common standards help serial production and reduce design flexibility."
 COLDWAR_CZE_1970_spirit_cmea_research:0 "CMEA Applied Research"
 COLDWAR_CZE_1970_spirit_cmea_research_desc:0 "Joint research offers wider expertise and a real educational commitment."
 COLDWAR_CZE_1970_spirit_cmea_settlement:0 "Accountable CMEA Commitments"
 COLDWAR_CZE_1970_spirit_cmea_settlement_desc:0 "Make national contributions and Council commitments transparent and financially accountable."
 COLDWAR_CZE_1970_spirit_ec_entry:0 "A European Member Delegation"
 COLDWAR_CZE_1970_spirit_ec_entry_desc:0 "Build a capable Czechoslovak delegation within the European Community."
 COLDWAR_CZE_1970_spirit_ec_research:0 "European Research Networks"
 COLDWAR_CZE_1970_spirit_ec_research_desc:0 "Research cooperation creates scientific opportunities and funding obligations."
 COLDWAR_CZE_1970_spirit_ec_standards:0 "European Product Standards"
 COLDWAR_CZE_1970_spirit_ec_standards_desc:0 "Modern product standards improve market access while imposing certification costs."
 COLDWAR_CZE_1970_spirit_space_instruments:0 "Interkosmos Instrument Teams"
 COLDWAR_CZE_1970_spirit_space_instruments_desc:0 "Form precision-instrument teams capable of contributing to shared scientific space missions."
