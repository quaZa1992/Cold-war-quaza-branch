 COLDWAR_CZE_1970_state_review:0 "The January Presidium"
 COLDWAR_CZE_1970_state_review_desc:0 "The party leadership must settle its priorities after the intervention. Husák leads the party, while Svoboda remains president."
 COLDWAR_CZE_1970_state_order:0 "Consolidate Party Rule"
 COLDWAR_CZE_1970_state_order_desc:0 "Administrative control offers continuity at the cost of professional autonomy."
 COLDWAR_CZE_1970_state_dialogue:0 "A Negotiated Opening"
 COLDWAR_CZE_1970_state_dialogue_desc:0 "A credible constitutional dialogue can admit competing political organisations. It also exposes the regime to resistance."
 COLDWAR_CZE_1970_state_purge:0 "Complete the Screening"
 COLDWAR_CZE_1970_state_purge_desc:0 "A comprehensive purge creates a reliable apparatus and excludes experienced specialists."
 COLDWAR_CZE_1970_state_retain:0 "Retain the Specialists"
 COLDWAR_CZE_1970_state_retain_desc:0 "Protect technical expertise while retaining the party monopoly."
 COLDWAR_CZE_1970_state_front:0 "A Competitive Front"
 COLDWAR_CZE_1970_state_front_desc:0 "Give existing National Front parties the right to present independent programmes."
 COLDWAR_CZE_1970_state_pluralism:0 "Legal Political Pluralism"
 COLDWAR_CZE_1970_state_pluralism_desc:0 "Permit independent movements and restored parties to organise and compete for office."
 COLDWAR_CZE_1970_state_courts:0 "Administrative Review"
 COLDWAR_CZE_1970_state_courts_desc:0 "A disciplined review apparatus reduces the cost of routine enforcement and constrains exchange."
 COLDWAR_CZE_1970_state_legalism:0 "Predictable State Rules"
 COLDWAR_CZE_1970_state_legalism_desc:0 "Publishing consistent administrative rules restrains arbitrary interventions."
 COLDWAR_CZE_1970_state_amnesty:0 "Rehabilitation Hearings"
 COLDWAR_CZE_1970_state_amnesty_desc:0 "Review political exclusions without immediately abandoning a socialist constitutional framework."
 COLDWAR_CZE_1970_state_elections:0 "Free Federal Elections"
 COLDWAR_CZE_1970_state_elections_desc:0 "Let a lawful federal election determine the party entrusted with government."
 COLDWAR_CZE_1970_state_monitor:0 "Commitments in Writing"
 COLDWAR_CZE_1970_state_monitor_desc:0 "Published rights create space for scholarship and a greater burden of legal accountability."
 COLDWAR_CZE_1970_state_bargain:0 "Bargain with Moscow"
 COLDWAR_CZE_1970_state_bargain_desc:0 "Negotiate a revised military presence and a more predictable relationship with the Soviet government."
 COLDWAR_CZE_1970_require_negotiate_sovereignty_protocol:0 "The government of Soviet Union is available for negotiations"
 COLDWAR_CZE_1970_require_negotiate_sovereignty_protocol_NOT:0 "The government of Soviet Union is available for negotiations"
 COLDWAR_CZE_1970_state_treaty_order:0 "A Treaty-Based Order"
 COLDWAR_CZE_1970_state_treaty_order_desc:0 "Consolidate the institutions chosen in the preceding settlement."
 COLDWAR_CZE_1970_state_human_rights:0 "Enforce Civic Guarantees"
 COLDWAR_CZE_1970_state_human_rights_desc:0 "Independent review improves access to knowledge and requires a functioning legal administration.\\n\\nExpenditure: 0.12% of current GDP."
 COLDWAR_CZE_1970_state_constitution:0 "A Durable Constitution"
 COLDWAR_CZE_1970_state_constitution_desc:0 "Protect a constitutional settlement capable of surviving changes of government."
 COLDWAR_CZE_1970_ksc_plan:0 "The KSČ Governing Plan"
 COLDWAR_CZE_1970_ksc_plan_desc:0 "Set the governing party's priorities for the coming national plan."
 COLDWAR_CZE_1970_ksc_husak:0 "Husák: Material Security"
 COLDWAR_CZE_1970_ksc_husak_desc:0 "Concentrate on predictable employment, housing and consumption under continued party rule."
 COLDWAR_CZE_1970_require_programme_husak:0 "§Y$COLDWAR_CZE_1970_ksc_husak$§! is the KSČ governing programme"
 COLDWAR_CZE_1970_require_programme_husak_NOT:0 "§Y$COLDWAR_CZE_1970_ksc_husak$§! is not the KSČ governing programme"
 COLDWAR_CZE_1970_ksc_bilak:0 "Biľak: Ideological Order"
 COLDWAR_CZE_1970_ksc_bilak_desc:0 "Consolidate the ideological apparatus and close the space for reform."
 COLDWAR_CZE_1970_require_programme_bilak:0 "§Y$COLDWAR_CZE_1970_ksc_bilak$§! is the KSČ governing programme"
 COLDWAR_CZE_1970_require_programme_bilak_NOT:0 "§Y$COLDWAR_CZE_1970_ksc_bilak$§! is not the KSČ governing programme"
 COLDWAR_CZE_1970_ksc_strougal:0 "Štrougal: Technical Rule"
 COLDWAR_CZE_1970_ksc_strougal_desc:0 "Judge economic management by practical results while keeping socialist institutions."
 COLDWAR_CZE_1970_require_programme_strougal:0 "§Y$COLDWAR_CZE_1970_ksc_strougal$§! is the KSČ governing programme"
 COLDWAR_CZE_1970_require_programme_strougal_NOT:0 "§Y$COLDWAR_CZE_1970_ksc_strougal$§! is not the KSČ governing programme"
 COLDWAR_CZE_1970_ksc_dubcek:0 "Reform Socialism"
 COLDWAR_CZE_1970_ksc_dubcek_desc:0 "A rehabilitated reform leadership can reopen the programme interrupted in 1968."
 COLDWAR_CZE_1970_require_programme_dubcek:0 "§Y$COLDWAR_CZE_1970_ksc_dubcek$§! is the KSČ governing programme"
 COLDWAR_CZE_1970_require_programme_dubcek_NOT:0 "§Y$COLDWAR_CZE_1970_ksc_dubcek$§! is not the KSČ governing programme"
 COLDWAR_CZE_1970_husak_housing:0 "Housing before Prestige"
 COLDWAR_CZE_1970_husak_housing_desc:0 "Prioritise serviced housing districts over prestige investment.\\n\\nExpenditure: 0.3% of current GDP."
 COLDWAR_CZE_1970_husak_consumer:0 "Consumer Supply Plans"
 COLDWAR_CZE_1970_husak_consumer_desc:0 "Reserve industrial capacity for household goods."
 COLDWAR_CZE_1970_husak_prices:0 "Maintain Price Subsidies"
 COLDWAR_CZE_1970_husak_prices_desc:0 "Hold the retail bargain together through continuing public expenditure."
 COLDWAR_CZE_1970_husak_invest:0 "Investment Discipline"
 COLDWAR_CZE_1970_husak_invest_desc:0 "Protect investment budgets by reducing the margin available for subsidies."
 COLDWAR_CZE_1970_husak_factories:0 "Modernise the Works"
 COLDWAR_CZE_1970_husak_factories_desc:0 "Renew industrial plant while retaining a coordinated national planning framework.\\n\\nExpenditure: 0.65% of current GDP."
 COLDWAR_CZE_1970_husak_settlement:0 "Managed Social Security"
 COLDWAR_CZE_1970_husak_settlement_desc:0 "A durable bargain offers stability and steady production while absorbing capacity."
 COLDWAR_CZE_1970_bilak_schools:0 "Ideological Education"
 COLDWAR_CZE_1970_bilak_schools_desc:0 "Align educational institutions with political priorities."
 COLDWAR_CZE_1970_bilak_bloc:0 "Bloc Production Orders"
 COLDWAR_CZE_1970_bilak_bloc_desc:0 "Concentrate on standardised industrial and defence orders for the socialist bloc."
 COLDWAR_CZE_1970_bilak_surveillance:0 "Expand Political Policing"
 COLDWAR_CZE_1970_bilak_surveillance_desc:0 "Expand surveillance and administrative control at a sustained public cost."
 COLDWAR_CZE_1970_bilak_nomenklatura:0 "The Cadre System"
 COLDWAR_CZE_1970_bilak_nomenklatura_desc:0 "Political reliability governs appointments, even where expertise is scarce."
 COLDWAR_CZE_1970_bilak_arms:0 "Defence Production"
 COLDWAR_CZE_1970_bilak_arms_desc:0 "Give the defence plants a larger place in the national plan.\\n\\nExpenditure: 0.65% of current GDP."
 COLDWAR_CZE_1970_bilak_settlement:0 "A Disciplined Bloc State"
 COLDWAR_CZE_1970_bilak_settlement_desc:0 "Accept ideological rigidity in return for a powerful apparatus and concentrated production."
 COLDWAR_CZE_1970_strougal_managers:0 "Technical Managers"
 COLDWAR_CZE_1970_strougal_managers_desc:0 "Give engineers and production managers more authority over day-to-day decisions."
 COLDWAR_CZE_1970_strougal_contracts:0 "Delivery Contracts"
 COLDWAR_CZE_1970_strougal_contracts_desc:0 "Replace part of the quota burden with negotiated delivery and quality obligations."
 COLDWAR_CZE_1970_strougal_surplus:0 "Retain Firm Surpluses"
 COLDWAR_CZE_1970_strougal_surplus_desc:0 "Let enterprises reinvest more of their results instead of remitting them to the treasury."
 COLDWAR_CZE_1970_strougal_audit:0 "Investment Audits"
 COLDWAR_CZE_1970_strougal_audit_desc:0 "Central audits improve public returns but expand administration."
 COLDWAR_CZE_1970_strougal_electronics:0 "Industrial Controls"
 COLDWAR_CZE_1970_strougal_electronics_desc:0 "Modern industrial controls can improve quality, scheduling and the reliability of production.\\n\\nExpenditure: 0.65% of current GDP."
 COLDWAR_CZE_1970_strougal_settlement:0 "Technocratic Rule"
 COLDWAR_CZE_1970_strougal_settlement_desc:0 "A more capable economy carries an expensive technical administration."
 COLDWAR_CZE_1970_dubcek_councils:0 "Enterprise Councils"
 COLDWAR_CZE_1970_dubcek_councils_desc:0 "Worker representation improves local knowledge and limits unilateral party direction."
 COLDWAR_CZE_1970_dubcek_science:0 "Readmit the Specialists"
 COLDWAR_CZE_1970_dubcek_science_desc:0 "Rehabilitation returns excluded expertise to scientific and industrial institutions."
 COLDWAR_CZE_1970_dubcek_market:0 "Socialist Market Reform"
 COLDWAR_CZE_1970_dubcek_market_desc:0 "A reform economy accepts price and enterprise uncertainty in exchange for stronger incentives."
 COLDWAR_CZE_1970_dubcek_social:0 "Democratic Planning"
 COLDWAR_CZE_1970_dubcek_social_desc:0 "Consultation protects social guarantees and slows investment decisions."
 COLDWAR_CZE_1970_dubcek_settlement:0 "Socialism with Consent"
 COLDWAR_CZE_1970_dubcek_settlement_desc:0 "Rebuild socialist legitimacy through participation and a less commanding party apparatus."
 COLDWAR_CZE_1970_css_municipal:0 "Municipal Public Service"
 COLDWAR_CZE_1970_css_municipal_desc:0 "The Socialist Party can turn its civic tradition into a programme of local government."
 COLDWAR_CZE_1970_css_councils:0 "Elected Town Councils"
 COLDWAR_CZE_1970_css_councils_desc:0 "Local accountability protects municipal interests and limits federal direction."
 COLDWAR_CZE_1970_css_enterprises:0 "Municipal Enterprises"
 COLDWAR_CZE_1970_css_enterprises_desc:0 "Public firms fund local services but reserve a larger part of production for them."
 COLDWAR_CZE_1970_css_libraries:0 "Libraries and Debate"
 COLDWAR_CZE_1970_css_libraries_desc:0 "Libraries and professional associations widen access to knowledge.\\n\\nExpenditure: 0.12% of current GDP."
 COLDWAR_CZE_1970_css_workshops:0 "Town Workshop Credits"
 COLDWAR_CZE_1970_css_workshops_desc:0 "A public credit programme renews smaller industrial workshops.\\n\\nExpenditure: 0.55% of current GDP."
 COLDWAR_CZE_1970_css_civic_budget:0 "A Civic Municipal Budget"
 COLDWAR_CZE_1970_css_civic_budget_desc:0 "Leave more revenue with local institutions and accept lower central receipts."
 COLDWAR_CZE_1970_css_cooperatives:0 "Cooperative Enterprise"
 COLDWAR_CZE_1970_css_cooperatives_desc:0 "Cooperative ownership combines local initiative with dispersed authority.\\n\\nExpenditure: 0.15% of current GDP."
 COLDWAR_CZE_1970_css_public_services:0 "Universal Town Services"
 COLDWAR_CZE_1970_css_public_services_desc:0 "Municipal services offer a strong social dividend with a continuing budget commitment.\\n\\nExpenditure: 0.1% of current GDP."
 COLDWAR_CZE_1970_csl_social:0 "Christian Social Policy"
 COLDWAR_CZE_1970_csl_social_desc:0 "Build a governing programme around human dignity, social duty and independent institutions."
 COLDWAR_CZE_1970_csl_parishes:0 "Parish Welfare Networks"
 COLDWAR_CZE_1970_csl_parishes_desc:0 "Cooperate with charitable institutions while retaining public oversight."
 COLDWAR_CZE_1970_csl_public_welfare:0 "Public Social Insurance"
 COLDWAR_CZE_1970_csl_public_welfare_desc:0 "A universal public scheme reaches beyond parish networks and needs regular funding.\\n\\nExpenditure: 0.12% of current GDP."
 COLDWAR_CZE_1970_csl_rural:0 "Rural Service Centres"
 COLDWAR_CZE_1970_csl_rural_desc:0 "Bring transport and public services to smaller communities.\\n\\nExpenditure: 0.3% of current GDP."
 COLDWAR_CZE_1970_csl_workers:0 "Catholic Labour Unions"
 COLDWAR_CZE_1970_csl_workers_desc:0 "Independent labour associations provide social representation rather than a party transmission belt."
 COLDWAR_CZE_1970_csl_schools:0 "School Charters"
 COLDWAR_CZE_1970_csl_schools_desc:0 "Independent education expands choice and creates additional funding obligations.\\n\\nExpenditure: 0.1% of current GDP."
 COLDWAR_CZE_1970_csl_land:0 "Family Farm Restitution"
 COLDWAR_CZE_1970_csl_land_desc:0 "Restore individual holdings with a transition cost for established cooperatives."
 COLDWAR_CZE_1970_csl_coops:0 "Farm Cooperatives"
 COLDWAR_CZE_1970_csl_coops_desc:0 "Preserve established agricultural organisations and strengthen social protections."
 COLDWAR_CZE_1970_csl_social_market:0 "A Social-Market Charter"
 COLDWAR_CZE_1970_csl_social_market_desc:0 "Support enterprise with enforceable social obligations."
 COLDWAR_CZE_1970_csl_settlement:0 "A Plural Republic"
 COLDWAR_CZE_1970_csl_settlement_desc:0 "Secure a place for Christian civic institutions in a religiously diverse federal republic."
 COLDWAR_CZE_1970_ds_mandate:0 "A Slovak Civic Mandate"
 COLDWAR_CZE_1970_ds_mandate_desc:0 "An autonomous party can represent local enterprise and Slovak civic institutions."
 COLDWAR_CZE_1970_ds_restoration:0 "Restore the DS"
 COLDWAR_CZE_1970_ds_restoration_desc:0 "Restore the Democratic Party identity through a lawful party congress."
 COLDWAR_CZE_1970_ds_republic:0 "Renew the Revival Party"
 COLDWAR_CZE_1970_ds_republic_desc:0 "Keep the Revival Party identity while ending its subordinate National Front role."
 COLDWAR_CZE_1970_ds_business:0 "Slovak Enterprise Banks"
 COLDWAR_CZE_1970_ds_business_desc:0 "Finance local enterprises through accountable regional institutions.\\n\\nExpenditure: 0.45% of current GDP."
 COLDWAR_CZE_1970_ds_farmers:0 "Cooperative Farm Credit"
 COLDWAR_CZE_1970_ds_farmers_desc:0 "Renew agricultural credit and give cooperative enterprises a secure financial basis.\\n\\nExpenditure: 0.35% of current GDP."
