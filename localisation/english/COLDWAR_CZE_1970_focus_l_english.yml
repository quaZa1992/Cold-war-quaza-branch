 COLDWAR_CZE_1970_require_three_agreements_NOT: "At least three bilateral agreements are active"
 COLDWAR_CZE_1970_spirit_start_0: "Normalisation and Cadre Screening"
 COLDWAR_CZE_1970_spirit_start_0_desc: "The leadership is rebuilding political control after the defeat of the Prague Spring. Screening restores a dependable apparatus, but exclusions and censorship deprive universities and enterprises of experienced specialists."
 COLDWAR_CZE_1970_spirit_start_1: "Soviet Forces on Our Soil"
 COLDWAR_CZE_1970_spirit_start_1_desc: "The Soviet Central Group of Forces remains under the post-intervention military agreement. Its presence anchors Moscow's influence and makes national sovereignty a continuing political dispute."
 COLDWAR_CZE_1970_spirit_start_2: "An Uneven Federation"
 COLDWAR_CZE_1970_spirit_start_2_desc: "The Czech and Slovak republics have their own institutions within the federation. The balance of investment, revenue and authority remains contested, complicating common decisions."
 COLDWAR_CZE_1970_spirit_start_3: "An Engineering Heartland"
 COLDWAR_CZE_1970_spirit_start_3_desc: "Established engineering firms, skilled trades and technical institutions give Czechoslovakia a strong industrial base. Heavy production and large serial orders place substantial demands on energy and supporting infrastructure."
 COLDWAR_CZE_1970_spirit_start_4: "Soft Budgets and Plan Targets"
 COLDWAR_CZE_1970_spirit_start_4_desc: "Enterprises answer to output plans and administrative allocations. Unclear financial responsibility protects established production while weakening incentives for quality, efficient investment and professional services."
 COLDWAR_CZE_1970_spirit_start_5: "The Material Social Contract"
 COLDWAR_CZE_1970_spirit_start_6: "Coal, Smoke and Heavy Industry"
 COLDWAR_CZE_1970_spirit_start_6_desc: "Coal supports power generation and the heavy industrial regions. Smoke, damaged land and polluted water impose a growing burden on communities and public health services."
 COLDWAR_CZE_1970_spirit_start_7: "Technical Schools, Closed Doors"
 COLDWAR_CZE_1970_spirit_start_7_desc: "Technical schools and research institutes preserve valuable scientific expertise. Political barriers restrict access and exchange, while maintaining specialist education remains a substantial public commitment."
 COLDWAR_CZE_1970_spirit_state_order: "Consolidated Party Rule"
 COLDWAR_CZE_1970_spirit_state_order_desc: "Administrative control offers continuity at the cost of professional autonomy."
 COLDWAR_CZE_1970_spirit_state_dialogue: "A Contested Opening"
 COLDWAR_CZE_1970_spirit_state_dialogue_desc: "A credible constitutional dialogue can admit competing political organisations. It also exposes the regime to resistance."
 COLDWAR_CZE_1970_spirit_state_purge: "A Disciplined Party State"
 COLDWAR_CZE_1970_spirit_state_purge_desc: "A comprehensive purge creates a reliable apparatus and excludes experienced specialists."
 COLDWAR_CZE_1970_spirit_state_retain: "Professional Cadres Retained"
 COLDWAR_CZE_1970_spirit_state_retain_desc: "Protect technical expertise while retaining the party monopoly."
 COLDWAR_CZE_1970_spirit_state_pluralism: "Contested Public Life"
 COLDWAR_CZE_1970_spirit_state_pluralism_desc: "Permit independent movements and restored parties to organise and compete for office."
 COLDWAR_CZE_1970_spirit_state_courts: "A Supervised Public Sphere"
 COLDWAR_CZE_1970_spirit_state_courts_desc: "A disciplined review apparatus reduces the cost of routine enforcement and constrains exchange."
 COLDWAR_CZE_1970_spirit_state_legalism: "A Predictable Administration"
 COLDWAR_CZE_1970_spirit_state_legalism_desc: "Publishing consistent administrative rules restrains arbitrary interventions."
 COLDWAR_CZE_1970_spirit_state_amnesty: "Selective Rehabilitation"
 COLDWAR_CZE_1970_spirit_state_amnesty_desc: "Review political exclusions without immediately abandoning a socialist constitutional framework."
 COLDWAR_CZE_1970_spirit_state_monitor: "Public Legal Guarantees"
 COLDWAR_CZE_1970_spirit_state_monitor_desc: "Published rights create space for scholarship and a greater burden of legal accountability."
 COLDWAR_CZE_1970_spirit_state_treaty_order: "Treaty-Based Administration"
 COLDWAR_CZE_1970_spirit_state_treaty_order_desc: "A treaty-based administrative order improves political coordination while requiring a larger state apparatus."
 COLDWAR_CZE_1970_spirit_state_human_rights: "Enforceable Civic Guarantees"
 COLDWAR_CZE_1970_spirit_state_human_rights_desc: "Independent review improves access to knowledge and requires a functioning legal administration."
 COLDWAR_CZE_1970_spirit_ksc_plan: "A Party Governing Programme"
 COLDWAR_CZE_1970_spirit_ksc_plan_desc: "Set the governing party's priorities for the coming national plan."
 COLDWAR_CZE_1970_spirit_ksc_husak: "Managed Normalisation"
 COLDWAR_CZE_1970_spirit_ksc_husak_desc: "Concentrate on predictable employment, housing and consumption under continued party rule."
 COLDWAR_CZE_1970_spirit_ksc_bilak: "Orthodox Party Discipline"
 COLDWAR_CZE_1970_spirit_ksc_bilak_desc: "Consolidate the ideological apparatus and close the space for reform."
 COLDWAR_CZE_1970_spirit_ksc_strougal: "Technocratic Administration"
 COLDWAR_CZE_1970_spirit_ksc_strougal_desc: "Judge economic management by practical results while keeping socialist institutions."
 COLDWAR_CZE_1970_spirit_ksc_dubcek: "A Reform Communist Mandate"
 COLDWAR_CZE_1970_spirit_ksc_dubcek_desc: "A rehabilitated reform leadership can reopen the programme interrupted in 1968."
 COLDWAR_CZE_1970_spirit_husak_consumer: "Reliable Consumer Deliveries"
 COLDWAR_CZE_1970_spirit_husak_consumer_desc: "Reserve industrial capacity for household goods."
 COLDWAR_CZE_1970_spirit_husak_prices: "Protected Household Prices"
 COLDWAR_CZE_1970_spirit_husak_invest: "Disciplined Social Spending"
 COLDWAR_CZE_1970_spirit_husak_invest_desc: "Protect investment budgets by reducing the margin available for subsidies."
 COLDWAR_CZE_1970_spirit_husak_settlement: "A Managed Social Compact"
 COLDWAR_CZE_1970_spirit_husak_settlement_desc: "A durable bargain offers stability and steady production while absorbing capacity."
 COLDWAR_CZE_1970_spirit_bilak_schools: "Ideological Schools"
 COLDWAR_CZE_1970_spirit_bilak_schools_desc: "Align educational institutions with political priorities."
 COLDWAR_CZE_1970_spirit_bilak_bloc: "Priority Bloc Orders"
 COLDWAR_CZE_1970_spirit_bilak_bloc_desc: "Concentrate on standardised industrial and defence orders for the socialist bloc."
 COLDWAR_CZE_1970_spirit_bilak_surveillance: "A Reinforced Security Apparatus"
 COLDWAR_CZE_1970_spirit_bilak_surveillance_desc: "Expand surveillance and administrative control at a sustained public cost."
 COLDWAR_CZE_1970_spirit_bilak_nomenklatura: "A Protected Cadre Ladder"
 COLDWAR_CZE_1970_spirit_bilak_nomenklatura_desc: "Political reliability governs appointments, even where expertise is scarce."
 COLDWAR_CZE_1970_spirit_bilak_settlement: "A Disciplined Bloc State"
 COLDWAR_CZE_1970_spirit_bilak_settlement_desc: "Accept ideological rigidity in return for a powerful apparatus and concentrated production."
 COLDWAR_CZE_1970_spirit_strougal_managers: "Technical Management"
 COLDWAR_CZE_1970_spirit_strougal_managers_desc: "Give engineers and production managers more authority over day-to-day decisions."
 COLDWAR_CZE_1970_spirit_strougal_contracts: "Enterprise Delivery Contracts"
 COLDWAR_CZE_1970_spirit_strougal_contracts_desc: "Replace part of the quota burden with negotiated delivery and quality obligations."
 COLDWAR_CZE_1970_spirit_strougal_surplus: "Enterprise Investment Funds"
 COLDWAR_CZE_1970_spirit_strougal_surplus_desc: "Let enterprises reinvest more of their results instead of remitting them to the treasury."
 COLDWAR_CZE_1970_spirit_strougal_audit: "Federal Investment Audits"
 COLDWAR_CZE_1970_spirit_strougal_audit_desc: "Central audits improve public returns but expand administration."
 COLDWAR_CZE_1970_spirit_strougal_settlement: "A Technocratic Settlement"
 COLDWAR_CZE_1970_spirit_strougal_settlement_desc: "A more capable economy carries an expensive technical administration."
 COLDWAR_CZE_1970_spirit_dubcek_councils: "Enterprise Councils"
 COLDWAR_CZE_1970_spirit_dubcek_councils_desc: "Worker representation improves local knowledge and limits unilateral party direction."
 COLDWAR_CZE_1970_spirit_dubcek_market: "Socialist Market Reform"
 COLDWAR_CZE_1970_spirit_dubcek_market_desc: "A reform economy accepts price and enterprise uncertainty in exchange for stronger incentives."
 COLDWAR_CZE_1970_spirit_dubcek_social: "Democratic Planning"
 COLDWAR_CZE_1970_spirit_dubcek_social_desc: "Consultation protects social guarantees and slows investment decisions."
 COLDWAR_CZE_1970_spirit_dubcek_settlement: "Socialism with Consent"
 COLDWAR_CZE_1970_spirit_dubcek_settlement_desc: "Rebuild socialist legitimacy through participation and a less commanding party apparatus."
 COLDWAR_CZE_1970_spirit_css_municipal: "Municipal Public Service"
 COLDWAR_CZE_1970_spirit_css_municipal_desc: "The Socialist Party can turn its civic tradition into a programme of local government."
 COLDWAR_CZE_1970_spirit_css_councils: "Elected Town Councils"
 COLDWAR_CZE_1970_spirit_css_councils_desc: "Local accountability protects municipal interests and limits federal direction."
 COLDWAR_CZE_1970_spirit_css_enterprises: "Municipal Enterprises"
 COLDWAR_CZE_1970_spirit_css_enterprises_desc: "Public firms fund local services but reserve a larger part of production for them."
 COLDWAR_CZE_1970_spirit_css_civic_budget: "A Civic Municipal Budget"
 COLDWAR_CZE_1970_spirit_css_civic_budget_desc: "Leave more revenue with local institutions and accept lower central receipts."
 COLDWAR_CZE_1970_spirit_css_cooperatives: "A Cooperative Civic Economy"
 COLDWAR_CZE_1970_spirit_css_cooperatives_desc: "Cooperative ownership combines local initiative with dispersed authority."
 COLDWAR_CZE_1970_spirit_css_public_services: "Universal Town Services"
 COLDWAR_CZE_1970_spirit_csl_social: "A Christian Social Mandate"
 COLDWAR_CZE_1970_spirit_csl_social_desc: "Build a governing programme around human dignity, social duty and independent institutions."
 COLDWAR_CZE_1970_spirit_csl_parishes: "Parish Welfare Networks"
 COLDWAR_CZE_1970_spirit_csl_public_welfare: "Universal Social Insurance"
 COLDWAR_CZE_1970_spirit_csl_workers: "Christian Labour Associations"
 COLDWAR_CZE_1970_spirit_csl_workers_desc: "Independent labour associations provide social representation rather than a party transmission belt."
 COLDWAR_CZE_1970_spirit_csl_schools: "Plural School Charters"
 COLDWAR_CZE_1970_spirit_csl_schools_desc: "Independent education expands choice and creates additional funding obligations."
 COLDWAR_CZE_1970_spirit_csl_land: "Family Farm Restitution"
 COLDWAR_CZE_1970_spirit_csl_land_desc: "Restore individual holdings with a transition cost for established cooperatives."
 COLDWAR_CZE_1970_spirit_csl_coops: "Protected Farm Cooperatives"
 COLDWAR_CZE_1970_spirit_csl_coops_desc: "Preserve established agricultural organisations and strengthen social protections."
 COLDWAR_CZE_1970_spirit_csl_social_market: "A Christian Social Market"
 COLDWAR_CZE_1970_spirit_csl_social_market_desc: "Support enterprise with enforceable social obligations."
 COLDWAR_CZE_1970_spirit_ds_mandate: "Slovak Civic Representation"
 COLDWAR_CZE_1970_spirit_ds_mandate_desc: "An autonomous party can represent local enterprise and Slovak civic institutions."
 COLDWAR_CZE_1970_spirit_ds_republic: "A Renewed Revival Party"
 COLDWAR_CZE_1970_spirit_ds_republic_desc: "Keep the Revival Party identity while ending its subordinate National Front role."
 COLDWAR_CZE_1970_spirit_ds_business: "Regional Enterprise Credit"
 COLDWAR_CZE_1970_spirit_ds_business_desc: "Finance local enterprises through accountable regional institutions."
 COLDWAR_CZE_1970_spirit_ds_regional_budget: "Republican Budget Rights"
 COLDWAR_CZE_1970_spirit_ds_regional_budget_desc: "Let republican institutions retain a larger role in spending decisions."
 COLDWAR_CZE_1970_spirit_ds_competition: "Regional Market Competition"
 COLDWAR_CZE_1970_spirit_ds_competition_desc: "Competitive local markets promise stronger productivity and a difficult adjustment."
 COLDWAR_CZE_1970_spirit_ds_civic_guarantee: "Guaranteed Regional Services"
 COLDWAR_CZE_1970_spirit_sloboda_programme: "Local Civic Service"
 COLDWAR_CZE_1970_spirit_sloboda_programme_desc: "Give the Slovak Freedom Party a programme distinct from both the Revival Party and later KDH."
 COLDWAR_CZE_1970_spirit_sloboda_church: "Faith-Based Civic Work"
 COLDWAR_CZE_1970_spirit_sloboda_church_desc: "Work with independent religious and charitable associations."
 COLDWAR_CZE_1970_spirit_sloboda_municipal: "Republican Municipalism"
 COLDWAR_CZE_1970_spirit_sloboda_municipal_desc: "Give towns and districts a larger voice within Slovak institutions."
 COLDWAR_CZE_1970_spirit_sloboda_languages: "Local Language Guarantees"
 COLDWAR_CZE_1970_spirit_sloboda_languages_desc: "Protect local language access while funding the administration it requires."
 COLDWAR_CZE_1970_spirit_sloboda_fiscal: "Local Revenue Autonomy"
 COLDWAR_CZE_1970_spirit_sloboda_fiscal_desc: "Leave more fiscal discretion in local hands."
 COLDWAR_CZE_1970_spirit_sloboda_solidarity: "A Solidarity Service Fund"
 COLDWAR_CZE_1970_spirit_cssd_labour: "Democratic Labour Representation"
 COLDWAR_CZE_1970_spirit_cssd_labour_desc: "The restored Social Democracy offers organised labour an independent democratic voice."
 COLDWAR_CZE_1970_spirit_cssd_bargaining: "Sectoral Bargaining"
 COLDWAR_CZE_1970_spirit_cssd_bargaining_desc: "Negotiated sector agreements protect workers and slow changes to production routines."
 COLDWAR_CZE_1970_spirit_cssd_enterprise: "Employee Ownership"
 COLDWAR_CZE_1970_spirit_cssd_enterprise_desc: "A share of enterprise returns stays with employee-owned firms."
 COLDWAR_CZE_1970_spirit_cssd_retraining: "A National Retraining Fund"
 COLDWAR_CZE_1970_spirit_cssd_retraining_desc: "Fund new skills for workers facing enterprise reform."
 COLDWAR_CZE_1970_spirit_cssd_insurance: "Portable Social Insurance"
 COLDWAR_CZE_1970_spirit_cssd_universal: "Universal Public Welfare"
 COLDWAR_CZE_1970_spirit_cssd_targeted: "Targeted Social Investment"
 COLDWAR_CZE_1970_spirit_cssd_targeted_desc: "Concentrate resources on education and retraining while narrowing unconditional benefits."
 COLDWAR_CZE_1970_spirit_cssd_tripartite: "Tripartite Economic Coordination"
 COLDWAR_CZE_1970_spirit_cssd_tripartite_desc: "Government, employers and labour negotiate the pace of reform."
 COLDWAR_CZE_1970_spirit_of_mandate: "A Civic Governing Mandate"
 COLDWAR_CZE_1970_spirit_of_mandate_desc: "A civic movement in office must turn opposition solidarity into workable government."
 COLDWAR_CZE_1970_spirit_of_courts: "Independent Constitutional Law"
 COLDWAR_CZE_1970_spirit_of_courts_desc: "Predictable courts support civic and commercial life at an administrative cost."
 COLDWAR_CZE_1970_spirit_of_local: "Civic Self-Government"
 COLDWAR_CZE_1970_spirit_of_local_desc: "Strong municipalities spread authority across the republic."
 COLDWAR_CZE_1970_spirit_of_universities: "Open Technical Education"
 COLDWAR_CZE_1970_spirit_of_universities_desc: "End political barriers to study and academic exchange."
 COLDWAR_CZE_1970_spirit_of_press: "Independent Public Media"
 COLDWAR_CZE_1970_spirit_of_press_desc: "An independent public sphere expands access to information and restricts government control."
 COLDWAR_CZE_1970_spirit_of_transparency: "Transparent Public Accounts"
 COLDWAR_CZE_1970_spirit_of_transparency_desc: "Public accounting improves collection and requires independent scrutiny."
 COLDWAR_CZE_1970_spirit_of_rapid_market: "Rapid Enterprise Reform"
 COLDWAR_CZE_1970_spirit_of_rapid_market_desc: "Fast reform promises strong productivity and a pronounced social adjustment."
 COLDWAR_CZE_1970_spirit_of_rapid_market_of_market_adjustment_strain: "Market Adjustment Strain"
 COLDWAR_CZE_1970_spirit_of_rapid_market_of_market_adjustment_strain_desc: "Rapid enterprise reform brings a one-year adjustment period with lower stability and more civilian industry reserved for consumer goods."
 COLDWAR_CZE_1970_spirit_of_gradual_market: "A Negotiated Market Transition"
 COLDWAR_CZE_1970_spirit_of_gradual_market_desc: "Negotiate the transition with enterprises and labour, preserving more social obligations."
 COLDWAR_CZE_1970_spirit_vpn_mandate: "A Slovak Civic Government"
 COLDWAR_CZE_1970_spirit_vpn_mandate_desc: "Translate Slovak civic mobilisation into a lawful governing programme."
 COLDWAR_CZE_1970_spirit_vpn_federal: "Democratic Federal Partnership"
 COLDWAR_CZE_1970_spirit_vpn_federal_desc: "Secure Slovak representation through a shared democratic federation."
 COLDWAR_CZE_1970_spirit_vpn_republic: "Republican Administrative Power"
 COLDWAR_CZE_1970_spirit_vpn_republic_desc: "Build capable republican institutions with their own administrative burden."
 COLDWAR_CZE_1970_spirit_vpn_civic_schools: "Civic School Renewal"
 COLDWAR_CZE_1970_spirit_vpn_civic_schools_desc: "Renew schools and remove political barriers to study."
 COLDWAR_CZE_1970_spirit_vpn_public_accounts: "Republican Public Accounts"
 COLDWAR_CZE_1970_spirit_vpn_public_accounts_desc: "Make republican expenditure open to independent scrutiny."
 COLDWAR_CZE_1970_spirit_vpn_local_market: "Local Enterprise Transition"
 COLDWAR_CZE_1970_spirit_vpn_local_market_desc: "Allow local enterprise to compete while accepting uneven adjustment."
 COLDWAR_CZE_1970_spirit_vpn_solidarity: "Republican Solidarity"
 COLDWAR_CZE_1970_spirit_vpn_cultural: "Independent Slovak Culture"
 COLDWAR_CZE_1970_spirit_vpn_cultural_desc: "Support Slovak cultural institutions as a civic public good."
 COLDWAR_CZE_1970_spirit_kdh_mandate: "A Christian Democratic Mandate"
 COLDWAR_CZE_1970_spirit_kdh_mandate_desc: "Build an independent Christian-democratic programme from legal civic and religious organisation."
 COLDWAR_CZE_1970_spirit_kdh_schools: "Plural Religious Education"
 COLDWAR_CZE_1970_spirit_kdh_schools_desc: "Permit independent religious schooling while meeting common educational standards."
 COLDWAR_CZE_1970_spirit_kdh_social: "Catholic Social Associations"
 COLDWAR_CZE_1970_spirit_kdh_social_desc: "Charitable institutions share social work with public authorities."
 COLDWAR_CZE_1970_spirit_kdh_workers: "Christian Social Partnership"
 COLDWAR_CZE_1970_spirit_kdh_workers_desc: "Negotiate obligations between workers, employers and public institutions."
 COLDWAR_CZE_1970_spirit_kdh_religious_liberty: "Religious Liberty in Law"
 COLDWAR_CZE_1970_spirit_kdh_religious_liberty_desc: "Legal protection for religious practice expands scholarly access and requires enforceable administrative safeguards."
 COLDWAR_CZE_1970_spirit_kdh_market: "The Christian Social Market"
 COLDWAR_CZE_1970_spirit_kdh_market_desc: "Enterprise and family institutions retain a larger part of national income."
 COLDWAR_CZE_1970_spirit_kdh_families: "Family and Community Guarantees"
 COLDWAR_CZE_1970_spirit_sns_mandate: "A Slovak National Mandate"
 COLDWAR_CZE_1970_spirit_sns_mandate_desc: "Represent Slovak national interests through lawful political institutions."
 COLDWAR_CZE_1970_spirit_sns_cultural: "National Cultural Institutions"
 COLDWAR_CZE_1970_spirit_sns_cultural_desc: "Expand Slovak public culture alongside enforceable minority language rights."
 COLDWAR_CZE_1970_spirit_sns_industry: "Slovak Industrial Ownership"
 COLDWAR_CZE_1970_spirit_sns_industry_desc: "Protect strategic republican ownership and accept a less flexible allocation of capacity."
 COLDWAR_CZE_1970_spirit_sns_revenue: "Republican Revenue Authority"
 COLDWAR_CZE_1970_spirit_sns_revenue_desc: "A stronger republican treasury adds administrative cost to the constitutional bargain."
 COLDWAR_CZE_1970_spirit_sns_treaty_federation: "A Treaty Federation"
 COLDWAR_CZE_1970_spirit_sns_treaty_federation_desc: "A treaty-based common state protects Slovak autonomy and limits unilateral federal action."
 COLDWAR_CZE_1970_spirit_sns_separation: "A Sovereignty Negotiation Mandate"
 COLDWAR_CZE_1970_spirit_sns_separation_desc: "Seek a sovereign Slovak settlement through negotiations and republican ratification."
 COLDWAR_CZE_1970_spirit_green_mandate: "An Environmental Mandate"
 COLDWAR_CZE_1970_spirit_green_mandate_desc: "Translate environmental mobilisation into an accountable government programme."
 COLDWAR_CZE_1970_spirit_green_nuclear: "Nuclear with Public Oversight"
 COLDWAR_CZE_1970_spirit_green_nuclear_desc: "Accept nuclear energy under independent safety review and public scrutiny."
 COLDWAR_CZE_1970_spirit_green_demand: "Energy Demand Management"
 COLDWAR_CZE_1970_spirit_green_demand_desc: "Conserve energy through strict building and industrial standards."
 COLDWAR_CZE_1970_spirit_green_monitoring: "Independent Pollution Registers"
 COLDWAR_CZE_1970_spirit_green_monitoring_desc: "Publication of pollution data requires a real monitoring service."
 COLDWAR_CZE_1970_spirit_green_river: "River and Soil Recovery"
 COLDWAR_CZE_1970_spirit_green_river_desc: "Repair land and water systems damaged by heavy industry and intensive farming."
 COLDWAR_CZE_1970_spirit_green_conversion: "Planned Industrial Conversion"
 COLDWAR_CZE_1970_spirit_green_conversion_desc: "Fund cleaner industrial production and retraining through public investment."
 COLDWAR_CZE_1970_spirit_green_limits: "Binding Environmental Limits"
 COLDWAR_CZE_1970_spirit_green_limits_desc: "Strict limits provide stronger health and energy gains at an immediate production cost."
 COLDWAR_CZE_1970_spirit_fed_review: "Federal Secretariat"
 COLDWAR_CZE_1970_spirit_fed_review_desc: "A federal secretariat improves coordination between common and republican institutions at an administrative cost."
 COLDWAR_CZE_1970_spirit_fed_central: "Federal Administrative Coordination"
 COLDWAR_CZE_1970_spirit_fed_central_desc: "A stronger centre can coordinate investment quickly but sharpens republican grievances."
 COLDWAR_CZE_1970_spirit_fed_republics: "A Republican Federal Bargain"
 COLDWAR_CZE_1970_spirit_fed_republics_desc: "Greater republican authority improves consent while dispersing federal power."
 COLDWAR_CZE_1970_spirit_fed_single_plan: "Unified Investment Planning"
 COLDWAR_CZE_1970_spirit_fed_single_plan_desc: "Coordinate large works through one investment authority."
 COLDWAR_CZE_1970_spirit_fed_equalisation: "Federal Equalisation"
 COLDWAR_CZE_1970_spirit_fed_veto: "Republican Consent Rules"
 COLDWAR_CZE_1970_spirit_fed_veto_desc: "Require both republics to agree on major constitutional and investment decisions."
 COLDWAR_CZE_1970_spirit_fed_revenue: "Republican Revenue Shares"
 COLDWAR_CZE_1970_spirit_fed_revenue_desc: "Give republican treasuries clear shares of revenue and expenditure."
 COLDWAR_CZE_1970_spirit_fed_charter: "Federal Language Guarantees"
 COLDWAR_CZE_1970_spirit_fed_charter_desc: "Protect Czech, Slovak and minority language access through funded institutions."
 COLDWAR_CZE_1970_spirit_fed_permanent: "A Renewed Common State"
 COLDWAR_CZE_1970_spirit_fed_permanent_desc: "Commit both republics to a revised shared constitutional order."
 COLDWAR_CZE_1970_spirit_fed_confederation: "A Treaty-Based Common State"
 COLDWAR_CZE_1970_spirit_fed_confederation_desc: "Retain common institutions under a more demanding treaty of republican consent."
 COLDWAR_CZE_1970_spirit_fed_separate: "A Constitutional Negotiation"
 COLDWAR_CZE_1970_spirit_fed_separate_desc: "Invite republican representatives to negotiate the lawful future of the common state."
 COLDWAR_CZE_1970_spirit_ind_champions: "Concentrated State Champions"
 COLDWAR_CZE_1970_spirit_ind_champions_desc: "Concentrated firms can fulfil large orders while crowding out other uses of capacity."
 COLDWAR_CZE_1970_spirit_ind_contracts: "Enterprise Contract Reform"
 COLDWAR_CZE_1970_spirit_ind_contracts_desc: "Enterprise autonomy improves incentives and reduces direct central receipts."
 COLDWAR_CZE_1970_spirit_ind_exports: "Export Engineering Specialisation"
 COLDWAR_CZE_1970_spirit_ind_exports_desc: "Specialisation improves serial production and increases dependence on energy and export demand."
 COLDWAR_CZE_1970_spirit_ind_manager: "Accountable Enterprise Budgets"
 COLDWAR_CZE_1970_spirit_ind_manager_desc: "Put public enterprises on a clear and accountable financial basis."
 COLDWAR_CZE_1970_spirit_ind_quality: "Quality-Based Contracts"
 COLDWAR_CZE_1970_spirit_ind_quality_desc: "Reward usable output and timely delivery rather than gross quotas."
 COLDWAR_CZE_1970_spirit_ind_rail_equip: "Export Equipment Standards"
 COLDWAR_CZE_1970_spirit_ind_rail_equip_desc: "Common standards improve large production runs and require certification."
