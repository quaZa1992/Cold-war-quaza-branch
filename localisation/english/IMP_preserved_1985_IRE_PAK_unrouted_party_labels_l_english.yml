 IMP_preserved_1985_IRE.liberalism: "£IRE_liberalism Liberal Independents"
 IMP_preserved_1985_IRE.liberalism_desc: "Independent liberal reformers and small pro-European currents sit outside the main Irish party machines."
 IMP_preserved_1985_IRE.liberalism_icon: "£IRE_liberalism"
 IMP_preserved_1985_IRE.conservatism: "£IRE_western_conservative (FF) Fianna Fail"
 IMP_preserved_1985_IRE.conservatism_desc: "Fianna Fail remains the largest opposition force, a republican catch-all party capable of returning to government through Charles Haughey's machine."
 IMP_preserved_1985_IRE.conservatism_icon: "£IRE_western_conservative"
 IMP_preserved_1985_IRE.socialism: "£IRE_western_social_democrat (Lab) Labour Party"
 IMP_preserved_1985_IRE.socialism_desc: "The Labour Party is Fine Gael's coalition partner, pressing the cabinet to protect workers, welfare and social reform during the fiscal crisis."
 IMP_preserved_1985_IRE.socialism_icon: "£IRE_western_social_democrat"
 IMP_preserved_1985_IRE.Communist-State: "£IRE_emerging_communism (WP) Workers' Party"
 IMP_preserved_1985_IRE.Communist-State_desc: "The Workers' Party represents the Official Republican left, combining Marxist organisation with electoral politics."
 IMP_preserved_1985_IRE.Communist-State_icon: "£IRE_emerging_communism"
 IMP_preserved_1985_IRE.anarchist_communism: "£IRE_anarchist_communism (IRSP) Irish Republican Socialist Party"
 IMP_preserved_1985_IRE.anarchist_communism_desc: "The Irish Republican Socialist Party is a small revolutionary republican socialist current on the fringes of Irish politics."
 IMP_preserved_1985_IRE.Neutral_conservatism: "£IRE_neutral_conservatism (FG) Fine Gael"
 IMP_preserved_1985_IRE.Neutral_conservatism_desc: "Fine Gael is the governing liberal-conservative party in 1985, led by Garret FitzGerald and committed to constitutional reform, European integration and fiscal stabilisation."
 IMP_preserved_1985_IRE.Neutral_conservatism_icon: "£IRE_neutral_conservatism"
 IMP_preserved_1985_IRE.Neutral_Libertarian: "£IRE_liberalism (PD) Progressive Democrats"
 IMP_preserved_1985_IRE.Neutral_Libertarian_desc: "The Progressive Democrats are an emerging liberal, market-oriented split from the old party system."
 IMP_preserved_1985_IRE.Neutral_Libertarian_icon: "£IRE_liberalism"
 IMP_preserved_1985_IRE.Neutral_green: "£IRE_neutral_green (CG) Green Alliance"
 IMP_preserved_1985_IRE.Neutral_green_desc: "The Green Alliance is a small environmental party seeking a political foothold in the late 1980s."
 IMP_preserved_1985_IRE.Neutral_green_icon: "£IRE_neutral_green"
 IMP_preserved_1985_IRE.Nat_Populism: "£IRE_nationalist_populism (SF) Sinn Fein"
