 COLDWAR_IRQ_shortcut_sunni:0 "The Iraqi Islamic Party"
 COLDWAR_IRQ_shortcut_oil:0 "Oil, Revenue and Sovereignty"
 COLDWAR_IRQ_shortcut_industry:0 "Industry, Power and Infrastructure"
 COLDWAR_IRQ_shortcut_agriculture:0 "Land, Water and Rural Iraq"
 COLDWAR_IRQ_shortcut_society:0 "Education and the Social Bargain"
 COLDWAR_IRQ_shortcut_defence:0 "The Armed Forces"
 COLDWAR_IRQ_shortcut_war:0 "War, Restraint and Reconstruction"
 COLDWAR_IRQ_shortcut_iran_war:0 "Iran: Road to War"
 COLDWAR_IRQ_rcc_rules:0 "State of January 1970"
 COLDWAR_IRQ_rcc_rules_desc:0 "Iraq enters the new decade with ministries, party offices and military commands competing for authority. Establishing a common government agenda will give the cabinet a firmer hand without settling the constitutional struggle."
 COLDWAR_IRQ_rcc_rules_implemented:0 "Implemented: $COLDWAR_IRQ_rcc_rules$"
 COLDWAR_IRQ_rcc_rules_pending:0 "Deliver: $COLDWAR_IRQ_rcc_rules$"
 COLDWAR_IRQ_executive_state:0 "Executive Authority"
 COLDWAR_IRQ_executive_state_desc:0 "A clear executive can force decisions through rival institutions. Concentrating authority strengthens the government while narrowing the room for provincial and civilian consent."
 COLDWAR_IRQ_executive_state_implemented:0 "Implemented: $COLDWAR_IRQ_executive_state$"
 COLDWAR_IRQ_executive_state_pending:0 "Deliver: $COLDWAR_IRQ_executive_state$"
 COLDWAR_IRQ_positive_stability_cap_tt:0 "§YGovernment Programmes§!: §G+15%§! maximum Stability bonus."
 COLDWAR_IRQ_civic_compact:0 "A Civic Compact"
 COLDWAR_IRQ_civic_compact_desc:0 "A civic compact offers provincial and professional interests a stake in the state. A broader settlement frees civilian resources, although decisions will take longer to negotiate."
 COLDWAR_IRQ_civic_compact_implemented:0 "Implemented: $COLDWAR_IRQ_civic_compact$"
 COLDWAR_IRQ_civic_compact_pending:0 "Deliver: $COLDWAR_IRQ_civic_compact$"
 COLDWAR_IRQ_provincial_agents:0 "Provincial Offices"
 COLDWAR_IRQ_provincial_agents_desc:0 "Provincial agents will bring collections and public records under a common standard. Their salaries are a real expense, but Baghdad will finally receive a more reliable share of provincial revenue."
 COLDWAR_IRQ_provincial_agents_implemented:0 "Implemented: $COLDWAR_IRQ_provincial_agents$"
 COLDWAR_IRQ_provincial_agents_pending:0 "Deliver: $COLDWAR_IRQ_provincial_agents$"
 COLDWAR_IRQ_elected_councils:0 "Provincial Councils"
 COLDWAR_IRQ_elected_councils_desc:0 "Local councils can connect provincial works with the people who use them. Paying for a functioning local administration is preferable to funding projects that serve only a distant patron."
 COLDWAR_IRQ_elected_councils_implemented:0 "Implemented: $COLDWAR_IRQ_elected_councils$"
 COLDWAR_IRQ_elected_councils_pending:0 "Deliver: $COLDWAR_IRQ_elected_councils$"
 COLDWAR_IRQ_civil_register:0 "Common Civil Register"
 COLDWAR_IRQ_civil_register_desc:0 "Reliable civil records make taxation, schooling and public employment easier to administer. A citizen should not need a party sponsor merely to be recognised by the state."
 COLDWAR_IRQ_civil_register_implemented:0 "Implemented: $COLDWAR_IRQ_civil_register$"
 COLDWAR_IRQ_civil_register_pending:0 "Deliver: $COLDWAR_IRQ_civil_register$"
 COLDWAR_IRQ_security_priority:0 "Fund the Security State"
 COLDWAR_IRQ_security_priority_desc:0 "The security services will receive the authority and money to protect the regime. Their expanded reach deters organised opposition, while political supervision weighs on free inquiry."
 COLDWAR_IRQ_security_priority_implemented:0 "Implemented: $COLDWAR_IRQ_security_priority$"
 COLDWAR_IRQ_security_priority_pending:0 "Deliver: $COLDWAR_IRQ_security_priority$"
 COLDWAR_IRQ_judicial_priority:0 "Protect Judicial Review"
 COLDWAR_IRQ_judicial_priority_desc:0 "Contracts and public decisions need a court that can survive a ministerial telephone call. Judicial review improves confidence in domestic investment but limits the cabinet's freedom to act."
 COLDWAR_IRQ_judicial_priority_implemented:0 "Implemented: $COLDWAR_IRQ_judicial_priority$"
 COLDWAR_IRQ_judicial_priority_pending:0 "Deliver: $COLDWAR_IRQ_judicial_priority$"
 COLDWAR_IRQ_review_detentions:0 "A Political Amnesty"
 COLDWAR_IRQ_review_detentions_desc:0 "Political detention has deprived public life of experienced organisers and deepened the divide between the government and its opponents. An amnesty will release living detainees whose cases can still be resolved, restore their legal standing and establish safeguards for lawful political activity."
 COLDWAR_IRQ_review_detentions_implemented:0 "Implemented: $COLDWAR_IRQ_review_detentions$"
 COLDWAR_IRQ_review_detentions_pending:0 "Deliver: $COLDWAR_IRQ_review_detentions$"
 COLDWAR_IRQ_courts_budget:0 "An Independent Bench"
 COLDWAR_IRQ_courts_budget_desc:0 "Independent courts need judges, clerks and enforceable rulings. A funded bench will make tax obligations and public contracts more credible than another declaration of good intentions."
 COLDWAR_IRQ_courts_budget_implemented:0 "Implemented: $COLDWAR_IRQ_courts_budget$"
 COLDWAR_IRQ_courts_budget_pending:0 "Deliver: $COLDWAR_IRQ_courts_budget$"
 COLDWAR_IRQ_ministerial_audit:0 "Ministerial Payrolls"
 COLDWAR_IRQ_ministerial_audit_desc:0 "Payrolls and procurement accounts conceal networks of privilege. An audit must identify who actually serves the state and ensure that public salaries reach real employees."
 COLDWAR_IRQ_ministerial_audit_implemented:0 "Implemented: $COLDWAR_IRQ_ministerial_audit$"
 COLDWAR_IRQ_ministerial_audit_pending:0 "Deliver: $COLDWAR_IRQ_ministerial_audit$"
 COLDWAR_IRQ_north_talks:0 "Kurdish Negotiations"
 COLDWAR_IRQ_north_talks_desc:0 "A durable northern settlement begins with roads, records and public services as well as political talks. Baghdad can prepare a practical offer while Kurdish representatives decide whether its guarantees deserve their trust."
 COLDWAR_IRQ_north_talks_implemented:0 "Implemented: $COLDWAR_IRQ_north_talks$"
 COLDWAR_IRQ_north_talks_pending:0 "Deliver: $COLDWAR_IRQ_north_talks$"
 COLDWAR_IRQ_army_command_review:0 "Parallel Commands"
 COLDWAR_IRQ_army_command_review_desc:0 "Overlapping commands waste orders and men. A joint review of army and security responsibilities will improve coordination without pretending that political loyalties can be abolished overnight."
 COLDWAR_IRQ_army_command_review_implemented:0 "Implemented: $COLDWAR_IRQ_army_command_review$"
 COLDWAR_IRQ_army_command_review_pending:0 "Deliver: $COLDWAR_IRQ_army_command_review$"
 COLDWAR_IRQ_budget_accounts:0 "The State Accounts"
 COLDWAR_IRQ_budget_accounts_desc:0 "A single set of state accounts will expose arrears, duplicate salaries and off-budget commitments. Ministers will have fewer places to hide the true cost of their promises."
 COLDWAR_IRQ_budget_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_budget_accounts$"
 COLDWAR_IRQ_budget_accounts_pending:0 "Deliver: $COLDWAR_IRQ_budget_accounts$"
 COLDWAR_IRQ_autonomy_guarantees:0 "Funded Guarantees"
 COLDWAR_IRQ_autonomy_guarantees_desc:0 "An autonomy agreement has little value without schools, roads and salaries behind it. Delivering the promised provincial investment will test whether Baghdad intends to honour the settlement."
 COLDWAR_IRQ_autonomy_guarantees_implemented:0 "Implemented: $COLDWAR_IRQ_autonomy_guarantees$"
 COLDWAR_IRQ_autonomy_guarantees_pending:0 "Deliver: $COLDWAR_IRQ_autonomy_guarantees$"
 COLDWAR_IRQ_professional_command:0 "Chain of Command"
 COLDWAR_IRQ_professional_command_desc:0 "A professional chain of command must connect the ministry, the staff and the formations in the field. Removing parallel orders will improve the army more than adding another political headquarters."
 COLDWAR_IRQ_professional_command_implemented:0 "Implemented: $COLDWAR_IRQ_professional_command$"
 COLDWAR_IRQ_professional_command_pending:0 "Deliver: $COLDWAR_IRQ_professional_command$"
 COLDWAR_IRQ_tax_registry:0 "A Tax Administration"
 COLDWAR_IRQ_tax_registry_desc:0 "The treasury needs a working register of businesses, property and obligations. A trained collection service can broaden reliable revenue without relying on improvised levies whenever oil receipts fall."
 COLDWAR_IRQ_tax_registry_implemented:0 "Implemented: $COLDWAR_IRQ_tax_registry$"
 COLDWAR_IRQ_tax_registry_pending:0 "Deliver: $COLDWAR_IRQ_tax_registry$"
 COLDWAR_IRQ_state_compact:0 "A Workable Iraqi State"
 COLDWAR_IRQ_state_compact_desc:0 "An effective Iraqi state should be able to pay its employees, collect its revenue and carry out its own agreements. The settlement will remain imperfect, but its institutions can finally work together."
 COLDWAR_IRQ_state_compact_implemented:0 "Implemented: $COLDWAR_IRQ_state_compact$"
 COLDWAR_IRQ_state_compact_pending:0 "Deliver: $COLDWAR_IRQ_state_compact$"
 COLDWAR_IRQ_regional_command:0 "The Regional Command"
 COLDWAR_IRQ_regional_command_desc:0 "The Baath's Regional Command must turn a movement built for conspiracy into an organization capable of governing Iraq. Its appointments will shape the relationship between the party, the ministries and the officers on whom the republic still depends."
 COLDWAR_IRQ_regional_command_implemented:0 "Implemented: $COLDWAR_IRQ_regional_command$"
 COLDWAR_IRQ_regional_command_pending:0 "Deliver: $COLDWAR_IRQ_regional_command$"
 COLDWAR_IRQ_national_front:0 "National Front"
 COLDWAR_IRQ_national_front_desc:0 "The Communists and other organized forces possess expertise that the Baath cannot simply command into existence. A national front could put that experience to work, provided its partners receive guarantees that mean more than a place on the government's letterhead."
 COLDWAR_IRQ_national_front_implemented:0 "Implemented: $COLDWAR_IRQ_national_front$"
 COLDWAR_IRQ_national_front_pending:0 "Deliver: $COLDWAR_IRQ_national_front$"
 COLDWAR_IRQ_baath_monopoly:0 "Exclusive Party State"
 COLDWAR_IRQ_baath_monopoly_desc:0 "The party can reserve the commanding offices of the Iraqi state for its own members. Provincial organizations, ministries and military appointments would answer to a single executive chain, allowing the leadership to assemble reserves and issue orders more quickly. Political exclusion will also deprive those institutions of experienced people whose cooperation cannot simply be commanded."
 COLDWAR_IRQ_baath_monopoly_implemented:0 "Implemented: $COLDWAR_IRQ_baath_monopoly$"
 COLDWAR_IRQ_baath_monopoly_pending:0 "Deliver: $COLDWAR_IRQ_baath_monopoly$"
 COLDWAR_IRQ_front_guarantees:0 "The Coalition Charter"
 COLDWAR_IRQ_front_guarantees_desc:0 "A signature in Baghdad will not settle every dispute between the Front's parties. Ministers and workplace delegates need enforceable rules for representation, appointments and working conditions. A funded labour charter can turn their cooperation into steadier civilian production while binding the government to the social commitments on which that cooperation rests."
 COLDWAR_IRQ_front_guarantees_implemented:0 "Implemented: $COLDWAR_IRQ_front_guarantees$"
 COLDWAR_IRQ_front_guarantees_pending:0 "Deliver: $COLDWAR_IRQ_front_guarantees$"
 COLDWAR_IRQ_party_screening:0 "Screen the Ministries"
 COLDWAR_IRQ_party_screening_desc:0 "Our ministries and armed forces contain men whose loyalties reach beyond the Regional Command. Screening appointments will strengthen the leadership's access to information and trusted officers, but political reliability cannot replace professional competence in every post."
 COLDWAR_IRQ_party_screening_implemented:0 "Implemented: $COLDWAR_IRQ_party_screening$"
 COLDWAR_IRQ_party_screening_pending:0 "Deliver: $COLDWAR_IRQ_party_screening$"
 COLDWAR_IRQ_baath_congress:0 "A Regional Congress"
 COLDWAR_IRQ_baath_congress_desc:0 "A regional congress can bind the party's provincial organizations to a common programme rather than a collection of personal promises. It must also provide a recognized forum for the leadership disputes that otherwise spread through the ministries and barracks."
 COLDWAR_IRQ_baath_congress_implemented:0 "Implemented: $COLDWAR_IRQ_baath_congress$"
 COLDWAR_IRQ_baath_congress_pending:0 "Deliver: $COLDWAR_IRQ_baath_congress$"
 COLDWAR_IRQ_mass_party:0 "A Mass Party"
 COLDWAR_IRQ_mass_party_desc:0 "Workers, students and rural organizers can give the Baath a presence far beyond its original circles. Bringing them into a mass movement will deepen the state's reach, while making employment, services and material support matters of party responsibility."
 COLDWAR_IRQ_mass_party_implemented:0 "Implemented: $COLDWAR_IRQ_mass_party$"
 COLDWAR_IRQ_mass_party_pending:0 "Deliver: $COLDWAR_IRQ_mass_party$"
 COLDWAR_IRQ_cadre_party:0 "A Cadre Party"
 COLDWAR_IRQ_cadre_party_desc:0 "A smaller party can devote more attention to the training and discipline of its organizers. Iraq would gain a more practiced governing core, but it would have fewer people able to carry the party's demands into every town and village."
 COLDWAR_IRQ_cadre_party_implemented:0 "Implemented: $COLDWAR_IRQ_cadre_party$"
 COLDWAR_IRQ_cadre_party_pending:0 "Deliver: $COLDWAR_IRQ_cadre_party$"
 COLDWAR_IRQ_popular_organizations:0 "Popular Organizations"
 COLDWAR_IRQ_popular_organizations_desc:0 "The party's associations must offer something to the families they seek to organize. Medical assistance and public services can give these bodies a lasting place in Iraqi society, provided Baghdad accepts the obligations that accompany that influence."
 COLDWAR_IRQ_popular_organizations_implemented:0 "Implemented: $COLDWAR_IRQ_popular_organizations$"
 COLDWAR_IRQ_popular_organizations_pending:0 "Deliver: $COLDWAR_IRQ_popular_organizations$"
 COLDWAR_IRQ_party_schools:0 "Expand Party Schools"
 COLDWAR_IRQ_party_schools_desc:0 "Party schools can prepare provincial organizers for work more demanding than repeating instructions from Baghdad. Technical lessons and administrative training will help them manage public undertakings, although the government must distinguish useful instruction from political ritual."
 COLDWAR_IRQ_party_schools_implemented:0 "Implemented: $COLDWAR_IRQ_party_schools$"
 COLDWAR_IRQ_party_schools_pending:0 "Deliver: $COLDWAR_IRQ_party_schools$"
 COLDWAR_IRQ_baath_accounts:0 "Separate Accounts"
 COLDWAR_IRQ_baath_accounts_desc:0 "The boundary between a party undertaking and a public enterprise has become dangerously uncertain. Separate accounts will make Iraqi revenues easier to collect and contracts easier to supervise, while limiting the discretion of officials accustomed to treating both treasuries as their own."
 COLDWAR_IRQ_baath_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_baath_accounts$"
 COLDWAR_IRQ_baath_accounts_pending:0 "Deliver: $COLDWAR_IRQ_baath_accounts$"
 COLDWAR_IRQ_arab_socialism:0 "Arab Socialism"
 COLDWAR_IRQ_arab_socialism_desc:0 "Iraq's public sector is expected to carry much of the country's industrial transformation. Giving it a stronger productive foundation will support that ambition, but investment directed through the state leaves fewer resources available for immediate private consumption."
 COLDWAR_IRQ_arab_socialism_implemented:0 "Implemented: $COLDWAR_IRQ_arab_socialism$"
 COLDWAR_IRQ_arab_socialism_pending:0 "Deliver: $COLDWAR_IRQ_arab_socialism$"
 COLDWAR_IRQ_secular_state:0 "Secular State Service"
 COLDWAR_IRQ_secular_state_desc:0 "Public offices must serve Iraq's citizens through a common set of procedures. Reducing competing religious and personal channels of authority can make administration more dependable, even where the party finds that professional officials are less willing to follow informal instructions."
 COLDWAR_IRQ_secular_state_implemented:0 "Implemented: $COLDWAR_IRQ_secular_state$"
 COLDWAR_IRQ_secular_state_pending:0 "Deliver: $COLDWAR_IRQ_secular_state$"
 COLDWAR_IRQ_women_unions:0 "Women in State Service"
 COLDWAR_IRQ_women_unions_desc:0 "Iraqi women cannot contribute fully to public life while training and paid employment remain closed to them. The unions and ministries can widen those opportunities, but employment must be supported by services that allow families to sustain the change."
 COLDWAR_IRQ_women_unions_implemented:0 "Implemented: $COLDWAR_IRQ_women_unions$"
 COLDWAR_IRQ_women_unions_pending:0 "Deliver: $COLDWAR_IRQ_women_unions$"
 COLDWAR_IRQ_enterprise_accounts:0 "Audit Public Enterprises"
 COLDWAR_IRQ_enterprise_accounts_desc:0 "Public enterprises need accounts that reveal whether workshops are producing useful goods or merely satisfying a minister's report. Regular inspection will help managers coordinate production and collection, while adding responsibilities that neither the ministry nor the enterprise can evade."
 COLDWAR_IRQ_enterprise_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_enterprise_accounts$"
 COLDWAR_IRQ_enterprise_accounts_pending:0 "Deliver: $COLDWAR_IRQ_enterprise_accounts$"
 COLDWAR_IRQ_baath_citizenship:0 "Common Citizenship"
 COLDWAR_IRQ_baath_citizenship_desc:0 "The republic cannot govern indefinitely through separate bargains with every community and local notable. A common citizenship would make public responsibilities more predictable, although officials will have to surrender some of the informal leverage on which party control has relied."
 COLDWAR_IRQ_baath_citizenship_implemented:0 "Implemented: $COLDWAR_IRQ_baath_citizenship$"
 COLDWAR_IRQ_baath_citizenship_pending:0 "Deliver: $COLDWAR_IRQ_baath_citizenship$"
 COLDWAR_IRQ_party_social_bargain:0 "Party Social Bargain"
 COLDWAR_IRQ_party_social_bargain_desc:0 "The party asks Iraqi households to place development ahead of immediate comfort. A credible bargain must offer dependable education and medical care in return, and those commitments must remain in the budget after the speeches have ended."
 COLDWAR_IRQ_party_social_bargain_implemented:0 "Implemented: $COLDWAR_IRQ_party_social_bargain$"
 COLDWAR_IRQ_party_social_bargain_pending:0 "Deliver: $COLDWAR_IRQ_party_social_bargain$"
 COLDWAR_IRQ_baath_future:0 "The Baathist Republic"
 COLDWAR_IRQ_baath_future_desc:0 "The Baathist republic must outlast individual campaigns and the men who announce them. A governing apparatus able to organize technical instruction, public offices and industrial work would give the party a stronger foundation than personal loyalty alone."
 COLDWAR_IRQ_baath_future_implemented:0 "Implemented: $COLDWAR_IRQ_baath_future$"
 COLDWAR_IRQ_baath_future_pending:0 "Deliver: $COLDWAR_IRQ_baath_future$"
 COLDWAR_IRQ_bakr_presidency:0 "Presidency of al-Bakr"
 COLDWAR_IRQ_bakr_presidency_desc:0 "Al-Bakr stands at the meeting point of the party and the military networks that helped bring it to power. His presidency can use those connections to staff the republic, but maintaining their cooperation will require more than issuing orders from Baghdad."
 COLDWAR_IRQ_bakr_presidency_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_presidency$"
 COLDWAR_IRQ_bakr_presidency_pending:0 "Deliver: $COLDWAR_IRQ_bakr_presidency$"
 COLDWAR_IRQ_bakr_collective:0 "Collective Leadership"
 COLDWAR_IRQ_bakr_collective_desc:0 "Al-Bakr can give experienced colleagues a greater share in the daily work of government. Collective leadership would draw on a wider pool of expertise, while obliging the presidency to negotiate decisions that a narrower executive might impose."
 COLDWAR_IRQ_bakr_collective_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_collective$"
 COLDWAR_IRQ_bakr_collective_pending:0 "Deliver: $COLDWAR_IRQ_bakr_collective$"
 COLDWAR_IRQ_bakr_presidential:0 "Presidential Arbitration"
 COLDWAR_IRQ_bakr_presidential_desc:0 "The president can make himself the final arbiter between competing party offices and commanders. That authority promises a clearer direction for Iraq, but the organizations that accept his arbitration will expect their own positions to be maintained."
 COLDWAR_IRQ_bakr_presidential_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_presidential$"
 COLDWAR_IRQ_bakr_presidential_pending:0 "Deliver: $COLDWAR_IRQ_bakr_presidential$"
 COLDWAR_IRQ_bakr_council:0 "Command Council"
 COLDWAR_IRQ_bakr_council_desc:0 "The Command Council must do more than ratify decisions already reached elsewhere. A regular division of military and educational responsibilities could make it useful to the republic, provided its members accept procedures that restrain personal intervention."
 COLDWAR_IRQ_bakr_council_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_council$"
 COLDWAR_IRQ_bakr_council_pending:0 "Deliver: $COLDWAR_IRQ_bakr_council$"
 COLDWAR_IRQ_bakr_loyal_officers:0 "Trusted Officers"
 COLDWAR_IRQ_bakr_loyal_officers_desc:0 "Al-Bakr's standing among experienced officers is an important part of his authority. Giving trusted men a recognized role in training and mobilization can strengthen the presidency, although too narrow a circle would close the army to other capable officers."
 COLDWAR_IRQ_bakr_loyal_officers_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_loyal_officers$"
 COLDWAR_IRQ_bakr_loyal_officers_pending:0 "Deliver: $COLDWAR_IRQ_bakr_loyal_officers$"
 COLDWAR_IRQ_bakr_continuity:0 "Continuity Secretariat"
 COLDWAR_IRQ_bakr_continuity_desc:0 "The presidency needs a secretariat that keeps ministries working when senior officials are occupied with party affairs. Reliable records and a settled division of responsibilities will make the state's ordinary business less dependent on the president's personal attention."
 COLDWAR_IRQ_bakr_continuity_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_continuity$"
 COLDWAR_IRQ_bakr_continuity_pending:0 "Deliver: $COLDWAR_IRQ_bakr_continuity$"
 COLDWAR_IRQ_bakr_contain_deputy:0 "Limit the Deputy"
 COLDWAR_IRQ_bakr_contain_deputy_desc:0 "The deputy's expanding responsibilities have made the division of authority increasingly uncertain. Al-Bakr can seek a clearer settlement of offices, but effective scrutiny will also limit the freedom of the presidency itself."
 COLDWAR_IRQ_bakr_contain_deputy_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_contain_deputy$"
 COLDWAR_IRQ_bakr_contain_deputy_pending:0 "Deliver: $COLDWAR_IRQ_bakr_contain_deputy$"
 COLDWAR_IRQ_bakr_delegate:0 "Delegate to Saddam"
 COLDWAR_IRQ_bakr_delegate_desc:0 "Saddam has demonstrated an ability to pursue decisions through the party apparatus. Delegating more of the government's work to him may accelerate development, while placing a larger security and administrative machine under the deputy's influence."
 COLDWAR_IRQ_bakr_delegate_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_delegate$"
 COLDWAR_IRQ_bakr_delegate_pending:0 "Deliver: $COLDWAR_IRQ_bakr_delegate$"
 COLDWAR_IRQ_bakr_guarantees:0 "Old Guard Guarantees"
 COLDWAR_IRQ_bakr_guarantees_desc:0 "The officers and party veterans who sustain the presidency fear being displaced by a new executive circle. A recognized place for them can make the governing establishment more dependable, at the price of restricting future appointments and reforms."
 COLDWAR_IRQ_bakr_guarantees_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_guarantees$"
 COLDWAR_IRQ_bakr_guarantees_pending:0 "Deliver: $COLDWAR_IRQ_bakr_guarantees$"
 COLDWAR_IRQ_bakr_deputy_budget:0 "Executive Coordination"
 COLDWAR_IRQ_bakr_deputy_budget_desc:0 "Development orders pass through too many offices before reaching the people expected to carry them out. A coordinating budget under the deputy could connect public projects with responsible officials, although their cooperation will require concessions from the treasury."
 COLDWAR_IRQ_bakr_deputy_budget_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_deputy_budget$"
 COLDWAR_IRQ_bakr_deputy_budget_pending:0 "Deliver: $COLDWAR_IRQ_bakr_deputy_budget$"
 COLDWAR_IRQ_bakr_development:0 "Development Priorities"
 COLDWAR_IRQ_bakr_development_desc:0 "The capital's industrial ambitions depend on roads and public works that can carry materials as well as official delegations. A funded programme around Baghdad will give al-Bakr's development policy a practical foundation that survives changes in the cabinet."
 COLDWAR_IRQ_bakr_development_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_development$"
 COLDWAR_IRQ_bakr_development_pending:0 "Deliver: $COLDWAR_IRQ_bakr_development$"
 COLDWAR_IRQ_bakr_treaty:0 "Soviet Procurement Office"
 COLDWAR_IRQ_bakr_treaty_desc:0 "Soviet equipment already places practical demands on Iraqi stores, workshops and training establishments. A permanent procurement office can bring together officers, interpreters and technical specialists who understand those demands. Common specifications and better purchasing records will help the army maintain its equipment and prepare future negotiations with Moscow."
 COLDWAR_IRQ_bakr_treaty_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_treaty$"
 COLDWAR_IRQ_bakr_treaty_pending:0 "Deliver: $COLDWAR_IRQ_bakr_treaty$"
 COLDWAR_IRQ_bakr_north:0 "Northern Guarantees"
 COLDWAR_IRQ_bakr_north_desc:0 "A northern guarantee will be judged by the services and conduct of the state, rather than the wording of a communiqué. Al-Bakr must prepare civilian institutions capable of carrying out promises that can otherwise be undone by a local security office."
 COLDWAR_IRQ_bakr_north_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_north$"
 COLDWAR_IRQ_bakr_north_pending:0 "Deliver: $COLDWAR_IRQ_bakr_north$"
 COLDWAR_IRQ_bakr_unity:0 "Explore Arab Unity"
 COLDWAR_IRQ_bakr_unity_desc:0 "A conference with Syria would bring rival claims to Arab leadership into the same room. Iraq needs officials able to examine common projects and responsibilities before asking Damascus to accept a union whose institutions neither side has yet defined."
 COLDWAR_IRQ_bakr_unity_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_unity$"
 COLDWAR_IRQ_bakr_unity_pending:0 "Deliver: $COLDWAR_IRQ_bakr_unity$"
 COLDWAR_IRQ_bakr_technical_mission:0 "Technical Missions"
 COLDWAR_IRQ_bakr_technical_mission_desc:0 "Iraq can purchase machinery more quickly than it can train the people needed to operate it. Technical missions must therefore build Iraqi engineering and construction knowledge, so that development does not depend indefinitely on specialists recalled by another government."
 COLDWAR_IRQ_bakr_technical_mission_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_technical_mission$"
 COLDWAR_IRQ_bakr_technical_mission_pending:0 "Deliver: $COLDWAR_IRQ_bakr_technical_mission$"
 COLDWAR_IRQ_bakr_compromise:0 "A Durable Compromise"
 COLDWAR_IRQ_bakr_compromise_desc:0 "Al-Bakr's presidency rests on institutions whose interests do not always coincide. A durable compromise would give them dependable civilian channels for their work, while requiring the leadership to accept limits that cannot be withdrawn at the first disagreement."
 COLDWAR_IRQ_bakr_compromise_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_compromise$"
 COLDWAR_IRQ_bakr_compromise_pending:0 "Deliver: $COLDWAR_IRQ_bakr_compromise$"
 COLDWAR_IRQ_bakr_union_charter:0 "Union Charter"
 COLDWAR_IRQ_bakr_union_charter_desc:0 "Arab cooperation needs rules for contracts and public revenue as well as declarations of fraternity. A charter can make Iraqi undertakings easier for partners to understand, without committing Syria or any other government to arrangements it has not accepted."
 COLDWAR_IRQ_bakr_union_charter_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_union_charter$"
 COLDWAR_IRQ_bakr_union_charter_pending:0 "Deliver: $COLDWAR_IRQ_bakr_union_charter$"
 COLDWAR_IRQ_bakr_succession_plan:0 "Negotiated Succession"
 COLDWAR_IRQ_bakr_succession_plan_desc:0 "The presidency should pass through an agreement that the republic's institutions can recognize. Al-Bakr must settle the authority of an eligible successor with those whose cooperation will determine whether government continues to function after his departure."
 COLDWAR_IRQ_bakr_succession_plan_implemented:0 "Implemented: $COLDWAR_IRQ_bakr_succession_plan$"
 COLDWAR_IRQ_bakr_succession_plan_pending:0 "Deliver: $COLDWAR_IRQ_bakr_succession_plan$"
 COLDWAR_IRQ_saddam_presidency:0 "Saddam's Presidency"
 COLDWAR_IRQ_saddam_presidency_desc:0 "Saddam's rise from the party apparatus to the presidency will change the balance between civilian organizers and the military establishment. He must turn control over competing offices into a government capable of acting, while confronting the distrust that such concentration of power creates."
 COLDWAR_IRQ_saddam_presidency_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_presidency$"
 COLDWAR_IRQ_saddam_presidency_pending:0 "Deliver: $COLDWAR_IRQ_saddam_presidency$"
 COLDWAR_IRQ_saddam_personal_state:0 "Personal Rule"
 COLDWAR_IRQ_saddam_personal_state_desc:0 "The presidency can bring rival offices into a chain of authority centered on Saddam himself. A personal executive will receive information and issue decisions more quickly, but it must sustain the security organizations on which that authority rests."
 COLDWAR_IRQ_saddam_personal_state_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_personal_state$"
 COLDWAR_IRQ_saddam_personal_state_pending:0 "Deliver: $COLDWAR_IRQ_saddam_personal_state$"
 COLDWAR_IRQ_saddam_party_cabinet:0 "The Party Cabinet"
 COLDWAR_IRQ_saddam_party_cabinet_desc:0 "A cabinet of established party officials and specialists can give the presidency a broader administrative base. Keeping their expertise in public service will require room for professional judgment that a fully personal executive would find uncomfortable."
 COLDWAR_IRQ_saddam_party_cabinet_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_party_cabinet$"
 COLDWAR_IRQ_saddam_party_cabinet_pending:0 "Deliver: $COLDWAR_IRQ_saddam_party_cabinet$"
 COLDWAR_IRQ_saddam_security_bureau:0 "Security Bureau"
 COLDWAR_IRQ_saddam_security_bureau_desc:0 "The presidency needs dependable information about the military, the party and foreign interference in Iraq. A stronger security bureau can supply it, but overlapping surveillance and exceptional powers will burden both the public treasury and relations within the state."
 COLDWAR_IRQ_saddam_security_bureau_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_security_bureau$"
 COLDWAR_IRQ_saddam_security_bureau_pending:0 "Deliver: $COLDWAR_IRQ_saddam_security_bureau$"
 COLDWAR_IRQ_saddam_technocrats:0 "Retain the Technocrats"
 COLDWAR_IRQ_saddam_technocrats_desc:0 "Experienced managers understand problems that cannot be solved by replacing an official with a more loyal party member. Retaining them will improve industrial administration, while limiting the presidency's freedom to use every appointment as a political reward."
 COLDWAR_IRQ_saddam_technocrats_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_technocrats$"
 COLDWAR_IRQ_saddam_technocrats_pending:0 "Deliver: $COLDWAR_IRQ_saddam_technocrats$"
 COLDWAR_IRQ_saddam_social_contract:0 "Oil and Legitimacy"
 COLDWAR_IRQ_saddam_social_contract_desc:0 "Oil receipts allow the government to promise Iraqi households a better material life. Medical provision and access to consumer goods can support the presidency's claim to govern for development, provided these commitments remain affordable when revenues or military demands change."
 COLDWAR_IRQ_saddam_social_contract_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_social_contract$"
 COLDWAR_IRQ_saddam_social_contract_pending:0 "Deliver: $COLDWAR_IRQ_saddam_social_contract$"
 COLDWAR_IRQ_saddam_guard:0 "Presidential Guard"
 COLDWAR_IRQ_saddam_guard_desc:0 "A presidential guard gives the leadership formations whose readiness and loyalty can be cultivated closely. Preferential training and dependable stores can strengthen the regime's military position, but maintaining that standard places a lasting burden on the army's payroll."
 COLDWAR_IRQ_saddam_guard_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_guard$"
 COLDWAR_IRQ_saddam_guard_pending:0 "Deliver: $COLDWAR_IRQ_saddam_guard$"
 COLDWAR_IRQ_saddam_regular_army:0 "The Regular Army"
 COLDWAR_IRQ_saddam_regular_army_desc:0 "Iraq's military strength cannot rest on privileged formations alone. Investment in the regular army's training and replacement system will give its commanders more dependable forces, while committing the government to a broader permanent establishment."
 COLDWAR_IRQ_saddam_regular_army_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_regular_army$"
 COLDWAR_IRQ_saddam_regular_army_pending:0 "Deliver: $COLDWAR_IRQ_saddam_regular_army$"
 COLDWAR_IRQ_saddam_guard_supply:0 "Guard Logistics"
 COLDWAR_IRQ_saddam_guard_supply_desc:0 "Favored formations cannot maintain their readiness on political standing alone. Common stores and practical equipment work will support the Guard's place in the army, although privileged supply arrangements must still be staffed and paid for."
 COLDWAR_IRQ_saddam_guard_supply_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_guard_supply$"
 COLDWAR_IRQ_saddam_guard_supply_pending:0 "Deliver: $COLDWAR_IRQ_saddam_guard_supply$"
 COLDWAR_IRQ_saddam_staff_college:0 "Staff Appointments"
 COLDWAR_IRQ_saddam_staff_college_desc:0 "The presidency needs officers who can coordinate formations rather than merely command their own battalions. Staff appointments should therefore be supported by serious instruction, even where a trained commander proves less dependent on political supervision."
 COLDWAR_IRQ_saddam_staff_college_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_staff_college$"
 COLDWAR_IRQ_saddam_staff_college_pending:0 "Deliver: $COLDWAR_IRQ_saddam_staff_college$"
 COLDWAR_IRQ_saddam_regional_role:0 "A Regional Role for Iraq"
 COLDWAR_IRQ_saddam_regional_role_desc:0 "Iraq's ambitions in the Arab world require a government able to negotiate and sustain military purchases. A more capable diplomatic and procurement service can widen Baghdad's options, while leaving foreign suppliers and neighboring governments free to defend their own interests."
 COLDWAR_IRQ_saddam_regional_role_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_regional_role$"
 COLDWAR_IRQ_saddam_regional_role_pending:0 "Deliver: $COLDWAR_IRQ_saddam_regional_role$"
 COLDWAR_IRQ_saddam_iran_dossier:0 "Iranian Revolution"
 COLDWAR_IRQ_saddam_iran_dossier_desc:0 "Events in Iran may alter the regional balance without revealing how its armed forces would perform in a war. Iraqi planners need a sober assessment of command and supply before the presidency treats apparent disorder across the frontier as an opportunity."
 COLDWAR_IRQ_saddam_iran_dossier_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_iran_dossier$"
 COLDWAR_IRQ_saddam_iran_dossier_pending:0 "Deliver: $COLDWAR_IRQ_saddam_iran_dossier$"
 COLDWAR_IRQ_saddam_industry:0 "Presidential Projects"
 COLDWAR_IRQ_saddam_industry_desc:0 "Presidential projects must leave Iraq with useful production rather than monuments to the officials who commissioned them. A civilian plant in Baghdad can support the wider industrial programme, although its construction will compete with immediate household demands."
 COLDWAR_IRQ_saddam_industry_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_industry$"
 COLDWAR_IRQ_saddam_industry_pending:0 "Deliver: $COLDWAR_IRQ_saddam_industry$"
 COLDWAR_IRQ_saddam_credit:0 "Negotiate Gulf Credit"
 COLDWAR_IRQ_saddam_credit_desc:0 "A foreign credit line will be easier to negotiate if Baghdad can present accounts that creditors understand. The same work can strengthen domestic collection, while the terms and availability of any Gulf loan remain matters for the lender to decide."
 COLDWAR_IRQ_saddam_credit_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_credit$"
 COLDWAR_IRQ_saddam_credit_pending:0 "Deliver: $COLDWAR_IRQ_saddam_credit$"
 COLDWAR_IRQ_saddam_bounded_deterrence:0 "A Costed Deterrent"
 COLDWAR_IRQ_saddam_bounded_deterrence_desc:0 "A credible deterrent needs forces able to mobilize and defend Iraqi territory. The presidency can sustain that preparation without treating every frontier dispute as an instruction to begin a war, but readiness will still carry a standing personnel bill."
 COLDWAR_IRQ_saddam_bounded_deterrence_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_bounded_deterrence$"
 COLDWAR_IRQ_saddam_bounded_deterrence_pending:0 "Deliver: $COLDWAR_IRQ_saddam_bounded_deterrence$"
 COLDWAR_IRQ_saddam_local_procurement:0 "Local Procurement"
 COLDWAR_IRQ_saddam_local_procurement_desc:0 "Imported equipment is only useful while Iraq can maintain and replace its essential parts. Domestic workshops and a more practiced licensing service will reduce exposure to shortages, without pretending that every foreign design can be reproduced at once."
 COLDWAR_IRQ_saddam_local_procurement_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_local_procurement$"
 COLDWAR_IRQ_saddam_local_procurement_pending:0 "Deliver: $COLDWAR_IRQ_saddam_local_procurement$"
 COLDWAR_IRQ_saddam_debt_service:0 "The Credit Burden"
 COLDWAR_IRQ_saddam_debt_service_desc:0 "The political value of a credit agreement fades when its repayments fall due. Baghdad needs a revenue authority able to meet obligations without concealing their burden, and creditors must retain the claims they have actually agreed to hold."
 COLDWAR_IRQ_saddam_debt_service_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_debt_service$"
 COLDWAR_IRQ_saddam_debt_service_pending:0 "Deliver: $COLDWAR_IRQ_saddam_debt_service$"
 COLDWAR_IRQ_saddam_legacy:0 "Presidential Power"
 COLDWAR_IRQ_saddam_legacy_desc:0 "The presidency must turn personal loyalties and competing offices into an administration that can carry out its decisions. A clearer executive chain will reduce duplicated work, while concessions to the institutions sustaining the regime narrow the state's revenue base."
 COLDWAR_IRQ_saddam_legacy_implemented:0 "Implemented: $COLDWAR_IRQ_saddam_legacy$"
 COLDWAR_IRQ_saddam_legacy_pending:0 "Deliver: $COLDWAR_IRQ_saddam_legacy$"
 COLDWAR_IRQ_officer_council:0 "An Officer Council"
 COLDWAR_IRQ_officer_council_desc:0 "An officer government inherits more than the command of the armed forces. Its members must establish authority over a fractured political system without assuming that the methods of the barracks will command the same confidence in civilian life."
 COLDWAR_IRQ_officer_council_implemented:0 "Implemented: $COLDWAR_IRQ_officer_council$"
 COLDWAR_IRQ_officer_council_pending:0 "Deliver: $COLDWAR_IRQ_officer_council$"
 COLDWAR_IRQ_officer_caretaker:0 "Caretaker Government"
 COLDWAR_IRQ_officer_caretaker_desc:0 "The officers can regard their government as a temporary administration charged with restoring dependable public life. Competent civilian departments would make that undertaking more credible, but they would also reduce the council's freedom to decide policy alone."
 COLDWAR_IRQ_officer_caretaker_implemented:0 "Implemented: $COLDWAR_IRQ_officer_caretaker$"
 COLDWAR_IRQ_officer_caretaker_pending:0 "Deliver: $COLDWAR_IRQ_officer_caretaker$"
 COLDWAR_IRQ_officer_permanent:0 "Military Presidency"
 COLDWAR_IRQ_officer_permanent_desc:0 "A permanent military presidency would place command and senior appointments at the center of the state. It could act with greater coherence than a provisional council, while carrying the cost of governing civilian institutions through an expanded military establishment."
 COLDWAR_IRQ_officer_permanent_implemented:0 "Implemented: $COLDWAR_IRQ_officer_permanent$"
 COLDWAR_IRQ_officer_permanent_pending:0 "Deliver: $COLDWAR_IRQ_officer_permanent$"
 COLDWAR_IRQ_officer_civilian_cabinet:0 "Civilian Cabinet"
 COLDWAR_IRQ_officer_civilian_cabinet_desc:0 "Industrial managers and civilian ministers can run services that officers have little experience administering. Giving them a real cabinet role will strengthen Iraq's productive economy, provided the military accepts professional authority outside its own command structure."
 COLDWAR_IRQ_officer_civilian_cabinet_implemented:0 "Implemented: $COLDWAR_IRQ_officer_civilian_cabinet$"
 COLDWAR_IRQ_officer_civilian_cabinet_pending:0 "Deliver: $COLDWAR_IRQ_officer_civilian_cabinet$"
 COLDWAR_IRQ_officer_garrisons:0 "Garrison Government"
 COLDWAR_IRQ_officer_garrisons_desc:0 "Provincial commanders possess the forces to enforce orders where civilian administration is weak. A garrison government can use that presence to support collection and policing, but soldiers assigned to such duties remain an expensive substitute for ordinary public offices."
 COLDWAR_IRQ_officer_garrisons_implemented:0 "Implemented: $COLDWAR_IRQ_officer_garrisons$"
 COLDWAR_IRQ_officer_garrisons_pending:0 "Deliver: $COLDWAR_IRQ_officer_garrisons$"
 COLDWAR_IRQ_officer_procurement:0 "Military Procurement"
 COLDWAR_IRQ_officer_procurement_desc:0 "Military purchases must fit an army that can train crews, obtain spares and understand the equipment it orders. A professional procurement service will make licensed designs more useful, while requiring officials whose responsibilities extend beyond signing a contract."
 COLDWAR_IRQ_officer_procurement_implemented:0 "Implemented: $COLDWAR_IRQ_officer_procurement$"
 COLDWAR_IRQ_officer_procurement_pending:0 "Deliver: $COLDWAR_IRQ_officer_procurement$"
 COLDWAR_IRQ_officer_merit:0 "Merit Promotions"
 COLDWAR_IRQ_officer_merit_desc:0 "The army's promotion system should reward officers able to organize their formations under pressure. Advancing such men will improve command, although the government must surrender some of the political leverage that comes with selecting every senior appointment."
 COLDWAR_IRQ_officer_merit_implemented:0 "Implemented: $COLDWAR_IRQ_officer_merit$"
 COLDWAR_IRQ_officer_merit_pending:0 "Deliver: $COLDWAR_IRQ_officer_merit$"
 COLDWAR_IRQ_officer_loyalty:0 "Promotion by Loyalty"
 COLDWAR_IRQ_officer_loyalty_desc:0 "An officer government cannot ignore whether its commanders will obey it during a political crisis. Trusted networks can accelerate mobilization and decisions, but personal confidence is a poor substitute for the cohesion that competent leadership builds within a formation."
 COLDWAR_IRQ_officer_loyalty_implemented:0 "Implemented: $COLDWAR_IRQ_officer_loyalty$"
 COLDWAR_IRQ_officer_loyalty_pending:0 "Deliver: $COLDWAR_IRQ_officer_loyalty$"
 COLDWAR_IRQ_officer_staff:0 "A National Staff College"
 COLDWAR_IRQ_officer_staff_desc:0 "Iraq needs a staff school that teaches officers to coordinate whole formations and their supporting services. Serious instruction takes men away from immediate duties, but it gives the army experience that cannot be obtained through another round of honorary promotions."
 COLDWAR_IRQ_officer_staff_implemented:0 "Implemented: $COLDWAR_IRQ_officer_staff$"
 COLDWAR_IRQ_officer_staff_pending:0 "Deliver: $COLDWAR_IRQ_officer_staff$"
 COLDWAR_IRQ_officer_commissars:0 "Ministerial Officers"
 COLDWAR_IRQ_officer_commissars_desc:0 "Placing officers in civilian ministries will give the council a clearer view of decisions made outside the barracks. It will also draw experienced commanders away from military work and displace officials who understand the departments they are expected to run."
 COLDWAR_IRQ_officer_commissars_implemented:0 "Implemented: $COLDWAR_IRQ_officer_commissars$"
 COLDWAR_IRQ_officer_commissars_pending:0 "Deliver: $COLDWAR_IRQ_officer_commissars$"
 COLDWAR_IRQ_officer_state_budget:0 "Defence Accounts"
 COLDWAR_IRQ_officer_state_budget_desc:0 "The defence establishment needs accounts that distinguish useful service from appointments maintained for political reasons. A regular budget can reduce exceptional payroll burdens, provided commanders accept that the treasury must be able to question military expenditure."
 COLDWAR_IRQ_officer_state_budget_implemented:0 "Implemented: $COLDWAR_IRQ_officer_state_budget$"
 COLDWAR_IRQ_officer_state_budget_pending:0 "Deliver: $COLDWAR_IRQ_officer_state_budget$"
 COLDWAR_IRQ_officer_amnesty:0 "Civilian Political Guarantees"
 COLDWAR_IRQ_officer_amnesty_desc:0 "The officers cannot promise an orderly republic while every organised opponent risks detention. Legal activity and enforceable safeguards will give civilian parties room to prepare for public responsibility without handing them command of the state."
 COLDWAR_IRQ_officer_amnesty_implemented:0 "Implemented: $COLDWAR_IRQ_officer_amnesty$"
 COLDWAR_IRQ_officer_amnesty_pending:0 "Deliver: $COLDWAR_IRQ_officer_amnesty$"
 COLDWAR_IRQ_officer_border_force:0 "Border Forces"
 COLDWAR_IRQ_officer_border_force_desc:0 "The army should not have to improvise a new frontier organization whenever relations with a neighbor worsen. Trained border commands and dependable supplies can make defence more credible, but the personnel required must remain on the public payroll."
 COLDWAR_IRQ_officer_border_force_implemented:0 "Implemented: $COLDWAR_IRQ_officer_border_force$"
 COLDWAR_IRQ_officer_border_force_pending:0 "Deliver: $COLDWAR_IRQ_officer_border_force$"
 COLDWAR_IRQ_officer_civic_timetable:0 "Ratify the Civilian Transition"
 COLDWAR_IRQ_officer_civic_timetable_desc:0 "A published timetable must give way to binding electoral rules. Ratification will permit contested elections and protect lawful political activity, leaving the choice of the next government to the existing electoral institutions."
 COLDWAR_IRQ_officer_civic_timetable_implemented:0 "Implemented: $COLDWAR_IRQ_officer_civic_timetable$"
 COLDWAR_IRQ_officer_civic_timetable_pending:0 "Deliver: $COLDWAR_IRQ_officer_civic_timetable$"
 COLDWAR_IRQ_officer_reintegration:0 "Officers to Barracks"
 COLDWAR_IRQ_officer_reintegration_desc:0 "Officers employed as political overseers and provincial administrators should return to a regular military establishment. Clear responsibilities will make their service less costly, while narrowing the informal influence that has grown around exceptional appointments."
 COLDWAR_IRQ_officer_reintegration_implemented:0 "Implemented: $COLDWAR_IRQ_officer_reintegration$"
 COLDWAR_IRQ_officer_reintegration_pending:0 "Deliver: $COLDWAR_IRQ_officer_reintegration$"
 COLDWAR_IRQ_officer_logistics:0 "Unified Logistics"
 COLDWAR_IRQ_officer_logistics_desc:0 "Different commands cannot sustain themselves indefinitely through separate stores and purchasing arrangements. A unified logistics service will make Iraq's equipment more dependable, provided the government funds the clerks, depots and inspections needed to keep it working."
 COLDWAR_IRQ_officer_logistics_implemented:0 "Implemented: $COLDWAR_IRQ_officer_logistics$"
 COLDWAR_IRQ_officer_logistics_pending:0 "Deliver: $COLDWAR_IRQ_officer_logistics$"
 COLDWAR_IRQ_officer_continuity:0 "Civilian Guarantees"
 COLDWAR_IRQ_officer_continuity_desc:0 "A future cabinet needs confidence that routine government will continue when the armed forces return to their military duties. Civilian guarantees can reduce exceptional policing and outside political leverage without allowing the council to choose every successor government."
 COLDWAR_IRQ_officer_continuity_implemented:0 "Implemented: $COLDWAR_IRQ_officer_continuity$"
 COLDWAR_IRQ_officer_continuity_pending:0 "Deliver: $COLDWAR_IRQ_officer_continuity$"
 COLDWAR_IRQ_officer_settlement:0 "Civil-Military Order"
 COLDWAR_IRQ_officer_settlement_desc:0 "Iraq needs an enduring division between military command and civilian authority rather than another temporary balance of personalities. A recognized establishment will make the army more coherent, but its service and responsibilities must be carried honestly in the budget."
 COLDWAR_IRQ_officer_settlement_implemented:0 "Implemented: $COLDWAR_IRQ_officer_settlement$"
 COLDWAR_IRQ_officer_settlement_pending:0 "Deliver: $COLDWAR_IRQ_officer_settlement$"
 COLDWAR_IRQ_arab_republican_movement:0 "Arab Republicanism"
 COLDWAR_IRQ_arab_republican_movement_desc:0 "Iraqi Arab socialists must reconcile their commitment to Arab cooperation with the institutions required to govern their own country. A national leadership council can give that programme a practical center without inventing authority for men who have not secured it."
 COLDWAR_IRQ_arab_republican_movement_implemented:0 "Implemented: $COLDWAR_IRQ_arab_republican_movement$"
 COLDWAR_IRQ_arab_republican_movement_pending:0 "Deliver: $COLDWAR_IRQ_arab_republican_movement$"
 COLDWAR_IRQ_arab_cairo:0 "Cooperate with Cairo"
 COLDWAR_IRQ_arab_cairo_desc:0 "Cairo offers experience in Arab political organization and military procurement, but cooperation cannot rest on fraternity alone. Iraq should develop the officials able to use common contracts and licensed equipment while negotiating the terms Egypt is willing to accept."
 COLDWAR_IRQ_arab_cairo_implemented:0 "Implemented: $COLDWAR_IRQ_arab_cairo$"
 COLDWAR_IRQ_arab_cairo_pending:0 "Deliver: $COLDWAR_IRQ_arab_cairo$"
 COLDWAR_IRQ_arab_iraqi_sovereignty:0 "An Iraqi Arab Republic"
 COLDWAR_IRQ_arab_iraqi_sovereignty_desc:0 "An Arab republic need not surrender Iraqi decision-making to another capital. A stronger domestic productive base and institutions resistant to outside pressure would preserve Baghdad's freedom, while leaving it less willing to pursue influence through distant political commitments."
 COLDWAR_IRQ_arab_iraqi_sovereignty_implemented:0 "Implemented: $COLDWAR_IRQ_arab_iraqi_sovereignty$"
 COLDWAR_IRQ_arab_iraqi_sovereignty_pending:0 "Deliver: $COLDWAR_IRQ_arab_iraqi_sovereignty$"
 COLDWAR_IRQ_arab_joint_planning:0 "Joint Planning"
 COLDWAR_IRQ_arab_joint_planning_desc:0 "Arab development schemes will fail if participating governments cannot identify who supplies the money, materials and administration. Iraq can begin with its own planning offices and roads, creating a practical basis for projects that partners may later agree to join."
 COLDWAR_IRQ_arab_joint_planning_implemented:0 "Implemented: $COLDWAR_IRQ_arab_joint_planning$"
 COLDWAR_IRQ_arab_joint_planning_pending:0 "Deliver: $COLDWAR_IRQ_arab_joint_planning$"
 COLDWAR_IRQ_arab_public_service:0 "Republican Service"
 COLDWAR_IRQ_arab_public_service_desc:0 "Republican service must offer careers based on the work Iraq needs done. A professional administration can connect public decisions with productive activity, provided ministries are staffed for competence rather than divided among the sponsors of the latest cabinet."
 COLDWAR_IRQ_arab_public_service_implemented:0 "Implemented: $COLDWAR_IRQ_arab_public_service$"
 COLDWAR_IRQ_arab_public_service_pending:0 "Deliver: $COLDWAR_IRQ_arab_public_service$"
 COLDWAR_IRQ_arab_social_charter:0 "Social Charter"
 COLDWAR_IRQ_arab_social_charter_desc:0 "Arab socialism will be judged in Iraqi homes as well as at political meetings. A social charter must provide dependable schooling and medical care, while recognizing that public obligations continue long after a government announces them."
 COLDWAR_IRQ_arab_social_charter_implemented:0 "Implemented: $COLDWAR_IRQ_arab_social_charter$"
 COLDWAR_IRQ_arab_social_charter_pending:0 "Deliver: $COLDWAR_IRQ_arab_social_charter$"
 COLDWAR_IRQ_arab_state_sector:0 "Leading Public Sector"
 COLDWAR_IRQ_arab_state_sector_desc:0 "The public sector can lead the industrial development needed to sustain an independent republic. Concentrating capital in state production will give Baghdad a stronger material base, while drawing resources away from immediate civilian consumption."
 COLDWAR_IRQ_arab_state_sector_implemented:0 "Implemented: $COLDWAR_IRQ_arab_state_sector$"
 COLDWAR_IRQ_arab_state_sector_pending:0 "Deliver: $COLDWAR_IRQ_arab_state_sector$"
 COLDWAR_IRQ_arab_mixed_sector:0 "An Arab Mixed Economy"
 COLDWAR_IRQ_arab_mixed_sector_desc:0 "Public undertakings need not exclude workshops and businesses outside the state sector. A mixed economy could expand Iraqi civilian production more quickly, although the government would have to accept the concessions that persuade private owners to invest."
 COLDWAR_IRQ_arab_mixed_sector_implemented:0 "Implemented: $COLDWAR_IRQ_arab_mixed_sector$"
 COLDWAR_IRQ_arab_mixed_sector_pending:0 "Deliver: $COLDWAR_IRQ_arab_mixed_sector$"
 COLDWAR_IRQ_arab_state_contracts:0 "Public Contracts"
 COLDWAR_IRQ_arab_state_contracts_desc:0 "A public industrial contract should leave Iraq with an operating plant rather than another office responsible for supervising one. Concentrating investment in Baghdad's military production will support the state-sector programme, at a cost that must be met before the project is delivered."
 COLDWAR_IRQ_arab_state_contracts_implemented:0 "Implemented: $COLDWAR_IRQ_arab_state_contracts$"
 COLDWAR_IRQ_arab_state_contracts_pending:0 "Deliver: $COLDWAR_IRQ_arab_state_contracts$"
 COLDWAR_IRQ_arab_credit_coops:0 "Cooperative Credit"
 COLDWAR_IRQ_arab_credit_coops_desc:0 "Many Iraqi cultivators cannot obtain machinery or dependable credit on terms their holdings can bear. Cooperative finance can make those resources useful across a wider rural economy, provided the government accepts responsibility for the support it promises borrowers."
 COLDWAR_IRQ_arab_credit_coops_implemented:0 "Implemented: $COLDWAR_IRQ_arab_credit_coops$"
 COLDWAR_IRQ_arab_credit_coops_pending:0 "Deliver: $COLDWAR_IRQ_arab_credit_coops$"
 COLDWAR_IRQ_arab_citizenship:0 "Equal Citizens"
 COLDWAR_IRQ_arab_citizenship_desc:0 "A republican state cannot reserve dependable services for those with the right personal connection. Common citizenship would make collection and public security more regular, while limiting the informal bargains through which ministers have secured local cooperation."
 COLDWAR_IRQ_arab_citizenship_implemented:0 "Implemented: $COLDWAR_IRQ_arab_citizenship$"
 COLDWAR_IRQ_arab_citizenship_pending:0 "Deliver: $COLDWAR_IRQ_arab_citizenship$"
 COLDWAR_IRQ_arab_palestine:0 "Palestinian Solidarity"
 COLDWAR_IRQ_arab_palestine_desc:0 "Solidarity with the Palestinians requires an administration able to sustain the commitments Baghdad actually makes. Better organized Iraqi support services can make those commitments more effective without sending weapons, money or forces to a recipient that has not agreed to receive them."
 COLDWAR_IRQ_arab_palestine_implemented:0 "Implemented: $COLDWAR_IRQ_arab_palestine$"
 COLDWAR_IRQ_arab_palestine_pending:0 "Deliver: $COLDWAR_IRQ_arab_palestine$"
 COLDWAR_IRQ_arab_technical_exchange:0 "Technical Exchanges"
 COLDWAR_IRQ_arab_technical_exchange_desc:0 "Iraq needs technical exchanges that leave knowledge in its own workshops and construction offices. Training engineers to adapt what they learn abroad will make development less dependent on the continuing presence of a foreign mission."
 COLDWAR_IRQ_arab_technical_exchange_implemented:0 "Implemented: $COLDWAR_IRQ_arab_technical_exchange$"
 COLDWAR_IRQ_arab_technical_exchange_pending:0 "Deliver: $COLDWAR_IRQ_arab_technical_exchange$"
 COLDWAR_IRQ_arab_union_convention:0 "A Union by Convention"
 COLDWAR_IRQ_arab_union_convention_desc:0 "A union conference must define how public money and responsibilities would be shared between participating governments. Iraq's own officials should be able to examine those obligations before inviting partners to accept institutions that could change their sovereignty."
 COLDWAR_IRQ_arab_union_convention_implemented:0 "Implemented: $COLDWAR_IRQ_arab_union_convention$"
 COLDWAR_IRQ_arab_union_convention_pending:0 "Deliver: $COLDWAR_IRQ_arab_union_convention$"
 COLDWAR_IRQ_arab_civil_diplomacy:0 "Civilian Solidarity"
 COLDWAR_IRQ_arab_civil_diplomacy_desc:0 "Arab cooperation can be advanced through civilian projects and commercial undertakings as well as political declarations. A practiced diplomatic service will give Baghdad more influence over their terms, while leaving other governments free to judge the proposals for themselves."
 COLDWAR_IRQ_arab_civil_diplomacy_implemented:0 "Implemented: $COLDWAR_IRQ_arab_civil_diplomacy$"
 COLDWAR_IRQ_arab_civil_diplomacy_pending:0 "Deliver: $COLDWAR_IRQ_arab_civil_diplomacy$"
 COLDWAR_IRQ_arab_training_network:0 "Training Network"
 COLDWAR_IRQ_arab_training_network_desc:0 "Military and civilian establishments both depend on technicians who can teach others to use unfamiliar equipment. Connecting those training networks will help Iraq retain useful knowledge without assuming that imported machinery brings its own permanent supply of instructors."
 COLDWAR_IRQ_arab_training_network_implemented:0 "Implemented: $COLDWAR_IRQ_arab_training_network$"
 COLDWAR_IRQ_arab_training_network_pending:0 "Deliver: $COLDWAR_IRQ_arab_training_network$"
 COLDWAR_IRQ_arab_union_accounts:0 "Arab Partnership"
 COLDWAR_IRQ_arab_union_accounts_desc:0 "A partnership cannot survive if its public undertakings keep incompatible books. Iraqi officials must be able to account for business and service revenues before presenting a common budget that another government can reasonably be expected to understand."
 COLDWAR_IRQ_arab_union_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_arab_union_accounts$"
 COLDWAR_IRQ_arab_union_accounts_pending:0 "Deliver: $COLDWAR_IRQ_arab_union_accounts$"
 COLDWAR_IRQ_arab_republic_endures:0 "Enduring Arab Republic"
 COLDWAR_IRQ_arab_republic_endures_desc:0 "An enduring Arab republic must demonstrate that cooperation and Iraqi independence can support one another. Productive civilian institutions and a government able to defend its own decisions would give that claim substance beyond the tenure of a single leader."
 COLDWAR_IRQ_arab_republic_endures_implemented:0 "Implemented: $COLDWAR_IRQ_arab_republic_endures$"
 COLDWAR_IRQ_arab_republic_endures_pending:0 "Deliver: $COLDWAR_IRQ_arab_republic_endures$"
 COLDWAR_IRQ_icp_congress:0 "Congress after Terror"
 COLDWAR_IRQ_icp_congress_desc:0 "The Communist Party carries the experience of repression and years spent rebuilding its organization. A governing congress must turn that experience into a programme for public institutions, rather than allow the habits of clandestine struggle to determine every appointment."
 COLDWAR_IRQ_icp_congress_implemented:0 "Implemented: $COLDWAR_IRQ_icp_congress$"
 COLDWAR_IRQ_icp_congress_pending:0 "Deliver: $COLDWAR_IRQ_icp_congress$"
 COLDWAR_IRQ_icp_front_strategy:0 "A Coalition Cabinet"
 COLDWAR_IRQ_icp_front_strategy_desc:0 "A coalition cabinet can draw on Iraqi political traditions beyond the party's own membership. Its ministers will need agreed responsibilities and dependable civilian offices if cooperation is to mean more than rival party chains of command inside the same government."
 COLDWAR_IRQ_icp_front_strategy_implemented:0 "Implemented: $COLDWAR_IRQ_icp_front_strategy$"
 COLDWAR_IRQ_icp_front_strategy_pending:0 "Deliver: $COLDWAR_IRQ_icp_front_strategy$"
 COLDWAR_IRQ_icp_independent_strategy:0 "The Governing Party"
 COLDWAR_IRQ_icp_independent_strategy_desc:0 "The party now carries responsibility for governing Iraq rather than merely opposing those who do. Its committees must learn to organize national institutions without assuming that the discipline of a political movement automatically produces confidence in the state."
 COLDWAR_IRQ_icp_independent_strategy_implemented:0 "Implemented: $COLDWAR_IRQ_icp_independent_strategy$"
 COLDWAR_IRQ_icp_independent_strategy_pending:0 "Deliver: $COLDWAR_IRQ_icp_independent_strategy$"
 COLDWAR_IRQ_icp_legal_cells:0 "Public Party Offices"
 COLDWAR_IRQ_icp_legal_cells_desc:0 "Public party offices can reconnect the government with workers and local representatives who endured years of repression. Bringing those networks into legal public life requires accountable organizers and confidence that membership will no longer expose families to arbitrary punishment."
 COLDWAR_IRQ_icp_legal_cells_implemented:0 "Implemented: $COLDWAR_IRQ_icp_legal_cells$"
 COLDWAR_IRQ_icp_legal_cells_pending:0 "Deliver: $COLDWAR_IRQ_icp_legal_cells$"
 COLDWAR_IRQ_icp_underground:0 "Reunite the Cadres"
 COLDWAR_IRQ_icp_underground_desc:0 "Clandestine organization preserved experienced cadres, but it also separated them from ordinary civilian administration. Reuniting their networks with the governing party will strengthen its reach, provided security habits do not become a substitute for professional public service."
 COLDWAR_IRQ_icp_underground_implemented:0 "Implemented: $COLDWAR_IRQ_icp_underground$"
 COLDWAR_IRQ_icp_underground_pending:0 "Deliver: $COLDWAR_IRQ_icp_underground$"
 COLDWAR_IRQ_icp_membership:0 "Membership Records"
 COLDWAR_IRQ_icp_membership_desc:0 "The party cannot govern through the incomplete lists and personal recollections that once protected its members. Dependable records will help local offices find people suited to public work without turning every administrative question into an appeal to the secretariat."
 COLDWAR_IRQ_icp_membership_implemented:0 "Implemented: $COLDWAR_IRQ_icp_membership$"
 COLDWAR_IRQ_icp_membership_pending:0 "Deliver: $COLDWAR_IRQ_icp_membership$"
 COLDWAR_IRQ_icp_democratic_front:0 "Pluralist Socialist Front"
 COLDWAR_IRQ_icp_democratic_front_desc:0 "A socialist government can seek cooperation from unions, intellectuals and parties that do not accept every Communist position. Their participation would widen the republic's civilian expertise, while placing real limits on the leadership's freedom to decide alone."
 COLDWAR_IRQ_icp_democratic_front_implemented:0 "Implemented: $COLDWAR_IRQ_icp_democratic_front$"
 COLDWAR_IRQ_icp_democratic_front_pending:0 "Deliver: $COLDWAR_IRQ_icp_democratic_front$"
 COLDWAR_IRQ_icp_vanguard:0 "A Vanguard State"
 COLDWAR_IRQ_icp_vanguard_desc:0 "The party can concentrate political direction and industrial priorities in a disciplined governing apparatus. Such a state would be better placed to direct resources toward military production, but Iraqi households would bear the claims that this places on the civilian economy."
 COLDWAR_IRQ_icp_vanguard_implemented:0 "Implemented: $COLDWAR_IRQ_icp_vanguard$"
 COLDWAR_IRQ_icp_vanguard_pending:0 "Deliver: $COLDWAR_IRQ_icp_vanguard$"
 COLDWAR_IRQ_icp_union_autonomy:0 "Independent Unions"
 COLDWAR_IRQ_icp_union_autonomy_desc:0 "Workers need representatives able to raise practical disputes without first obtaining a minister's permission. Independent unions can make production more dependable through negotiated cooperation, even where their demands reduce the output that managers would otherwise require."
 COLDWAR_IRQ_icp_union_autonomy_implemented:0 "Implemented: $COLDWAR_IRQ_icp_union_autonomy$"
 COLDWAR_IRQ_icp_union_autonomy_pending:0 "Deliver: $COLDWAR_IRQ_icp_union_autonomy$"
 COLDWAR_IRQ_icp_state_unions:0 "Unions of the Plan"
 COLDWAR_IRQ_icp_state_unions_desc:0 "Unions can instead be organized around the targets of the national production plan. Clear priorities would support longer and more consistent industrial runs, but workers would have fewer independent channels through which to contest those demands."
 COLDWAR_IRQ_icp_state_unions_implemented:0 "Implemented: $COLDWAR_IRQ_icp_state_unions$"
 COLDWAR_IRQ_icp_state_unions_pending:0 "Deliver: $COLDWAR_IRQ_icp_state_unions$"
 COLDWAR_IRQ_icp_national_question:0 "Nationalities Charter"
 COLDWAR_IRQ_icp_national_question_desc:0 "The party cannot resolve Iraq's nationalities question by treating every disagreement as a class misunderstanding. A recognized charter must give communities responsibilities that the government respects, while leaving the terms of any northern settlement to those who must live with it."
 COLDWAR_IRQ_icp_national_question_implemented:0 "Implemented: $COLDWAR_IRQ_icp_national_question$"
 COLDWAR_IRQ_icp_national_question_pending:0 "Deliver: $COLDWAR_IRQ_icp_national_question$"
 COLDWAR_IRQ_icp_industrial_workers:0 "Workers Councils"
 COLDWAR_IRQ_icp_industrial_workers_desc:0 "Workers' councils need functioning industry in which to demonstrate their programme. A civilian plant in Baghdad can give them that foundation, provided technical management and workplace representation learn to work together rather than compete for every operational decision."
 COLDWAR_IRQ_icp_industrial_workers_implemented:0 "Implemented: $COLDWAR_IRQ_icp_industrial_workers$"
 COLDWAR_IRQ_icp_industrial_workers_pending:0 "Deliver: $COLDWAR_IRQ_icp_industrial_workers$"
 COLDWAR_IRQ_icp_soviet_relations:0 "Soviet Party Relations"
 COLDWAR_IRQ_icp_soviet_relations_desc:0 "Relations with Soviet institutions could offer Iraqi technicians access to useful designs and instruction. Our own reception and licensing services must be able to use those opportunities, while preserving Baghdad's right to negotiate the terms of cooperation."
 COLDWAR_IRQ_icp_soviet_relations_implemented:0 "Implemented: $COLDWAR_IRQ_icp_soviet_relations$"
 COLDWAR_IRQ_icp_soviet_relations_pending:0 "Deliver: $COLDWAR_IRQ_icp_soviet_relations$"
 COLDWAR_IRQ_icp_rural_cells:0 "Organize the Rural Poor"
 COLDWAR_IRQ_icp_rural_cells_desc:0 "The rural poor will judge a socialist government by what reaches their holdings and villages. Agricultural advice and dependable credit can give party organizers a productive purpose beyond political mobilization, although promises of support must be honored in difficult seasons as well."
 COLDWAR_IRQ_icp_rural_cells_implemented:0 "Implemented: $COLDWAR_IRQ_icp_rural_cells$"
 COLDWAR_IRQ_icp_rural_cells_pending:0 "Deliver: $COLDWAR_IRQ_icp_rural_cells$"
 COLDWAR_IRQ_icp_safety_inspection:0 "Safety Inspectors"
 COLDWAR_IRQ_icp_safety_inspection_desc:0 "Workplace injuries and neglected machinery impose costs on families as well as production. Inspectors able to enforce practical standards can reduce those burdens, even where taking equipment out of service frustrates a manager's immediate output target."
 COLDWAR_IRQ_icp_safety_inspection_implemented:0 "Implemented: $COLDWAR_IRQ_icp_safety_inspection$"
 COLDWAR_IRQ_icp_safety_inspection_pending:0 "Deliver: $COLDWAR_IRQ_icp_safety_inspection$"
 COLDWAR_IRQ_icp_cadre_schools:0 "Train Technical Cadres"
 COLDWAR_IRQ_icp_cadre_schools_desc:0 "The party needs technicians and administrators who can explain how a workshop should operate, not merely who should control it. Technical schools will give experienced organizers the knowledge needed to participate in Iraq's industrial development."
 COLDWAR_IRQ_icp_cadre_schools_implemented:0 "Implemented: $COLDWAR_IRQ_icp_cadre_schools$"
 COLDWAR_IRQ_icp_cadre_schools_pending:0 "Deliver: $COLDWAR_IRQ_icp_cadre_schools$"
 COLDWAR_IRQ_icp_peasant_credit:0 "Rural Credit Reform"
 COLDWAR_IRQ_icp_peasant_credit_desc:0 "Rural credit should support cultivators rather than reproduce their dependence on a different set of intermediaries. A public finance programme can improve agricultural production and bring more transactions into regular accounts, while requiring concessions to borrowers whose incomes remain uncertain."
 COLDWAR_IRQ_icp_peasant_credit_implemented:0 "Implemented: $COLDWAR_IRQ_icp_peasant_credit$"
 COLDWAR_IRQ_icp_peasant_credit_pending:0 "Deliver: $COLDWAR_IRQ_icp_peasant_credit$"
 COLDWAR_IRQ_icp_socialist_republic:0 "The Socialist Republic"
 COLDWAR_IRQ_icp_socialist_republic_desc:0 "A socialist republic must give its productive programme a place beyond the next party congress. Public industry can support the state and civilian life together, provided the government continues to carry the social obligations on which its authority rests."
 COLDWAR_IRQ_icp_socialist_republic_implemented:0 "Implemented: $COLDWAR_IRQ_icp_socialist_republic$"
 COLDWAR_IRQ_icp_socialist_republic_pending:0 "Deliver: $COLDWAR_IRQ_icp_socialist_republic$"
 COLDWAR_IRQ_aziz_secretariat:0 "Aziz Muhammad"
 COLDWAR_IRQ_aziz_secretariat_desc:0 "Aziz Muhammad must adapt a party formed through clandestine organization to the demands of national government. The secretariat needs civilian offices that can administer a programme without requiring every local question to be settled personally by its leader."
 COLDWAR_IRQ_aziz_secretariat_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_secretariat$"
 COLDWAR_IRQ_aziz_secretariat_pending:0 "Deliver: $COLDWAR_IRQ_aziz_secretariat$"
 COLDWAR_IRQ_aziz_negotiated_road:0 "A Cabinet of Allies"
 COLDWAR_IRQ_aziz_negotiated_road_desc:0 "A cabinet of allies can bring experience into government that the Communist organization cannot supply by itself. Aziz must give those ministers clear responsibilities, while accepting that cooperation requires authority to be shared as well as discussed."
 COLDWAR_IRQ_aziz_negotiated_road_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_negotiated_road$"
 COLDWAR_IRQ_aziz_negotiated_road_pending:0 "Deliver: $COLDWAR_IRQ_aziz_negotiated_road$"
 COLDWAR_IRQ_aziz_opposition_road:0 "The Congress Mandate"
 COLDWAR_IRQ_aziz_opposition_road_desc:0 "The party's regional congresses can give Aziz a governing mandate extending beyond the capital. Their support will strengthen an independent national apparatus, but delegates will expect their influence over appointments and policy to survive the journey back from Baghdad."
 COLDWAR_IRQ_aziz_opposition_road_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_opposition_road$"
 COLDWAR_IRQ_aziz_opposition_road_pending:0 "Deliver: $COLDWAR_IRQ_aziz_opposition_road$"
 COLDWAR_IRQ_aziz_front_red_lines:0 "Coalition Red Lines"
 COLDWAR_IRQ_aziz_front_red_lines_desc:0 "Cooperation is only credible while partners understand which guarantees cannot be set aside for convenience. Aziz should define those limits openly, so that the party can challenge a breach without pretending that every disagreement requires the destruction of the government."
 COLDWAR_IRQ_aziz_front_red_lines_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_front_red_lines$"
 COLDWAR_IRQ_aziz_front_red_lines_pending:0 "Deliver: $COLDWAR_IRQ_aziz_front_red_lines$"
 COLDWAR_IRQ_aziz_resilient_networks:0 "Resilient Networks"
 COLDWAR_IRQ_aziz_resilient_networks_desc:0 "Years of difficult political work created networks able to find people, information and practical assistance under pressure. Bringing that experience into public institutions can broaden Iraq's options, provided informal contacts are made accountable for the responsibilities they acquire."
 COLDWAR_IRQ_aziz_resilient_networks_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_resilient_networks$"
 COLDWAR_IRQ_aziz_resilient_networks_pending:0 "Deliver: $COLDWAR_IRQ_aziz_resilient_networks$"
 COLDWAR_IRQ_aziz_congress_accounts:0 "Congress Oversight"
 COLDWAR_IRQ_aziz_congress_accounts_desc:0 "Delegates cannot supervise a government whose accounts remain private to the ministries. Opening reliable public records to congress scrutiny will make revenue and services more dependable, while forcing the secretariat to defend decisions it once expected simply to announce."
 COLDWAR_IRQ_aziz_congress_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_congress_accounts$"
 COLDWAR_IRQ_aziz_congress_accounts_pending:0 "Deliver: $COLDWAR_IRQ_aziz_congress_accounts$"
 COLDWAR_IRQ_aziz_federal_guarantees:0 "Federal Guarantees"
 COLDWAR_IRQ_aziz_federal_guarantees_desc:0 "Federal guarantees must connect the northern provinces to the services and routes on which their economy depends. Baghdad can secure cooperation by recognizing those responsibilities, but it must accept that regional institutions will retain part of the revenue they administer."
 COLDWAR_IRQ_aziz_federal_guarantees_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_federal_guarantees$"
 COLDWAR_IRQ_aziz_federal_guarantees_pending:0 "Deliver: $COLDWAR_IRQ_aziz_federal_guarantees$"
 COLDWAR_IRQ_aziz_unitary_left:0 "Unitary Socialism"
 COLDWAR_IRQ_aziz_unitary_left_desc:0 "A unitary socialist government would place collection and administration under a common national direction. It promises a clearer public account, while leaving Aziz responsible for the provincial resentment that stronger central authority can provoke."
 COLDWAR_IRQ_aziz_unitary_left_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_unitary_left$"
 COLDWAR_IRQ_aziz_unitary_left_pending:0 "Deliver: $COLDWAR_IRQ_aziz_unitary_left$"
 COLDWAR_IRQ_aziz_regional_budget:0 "The Regional Compact"
 COLDWAR_IRQ_aziz_regional_budget_desc:0 "A regional compact will mean little to households unless schools and medical services receive dependable support. Aziz must give the provinces a budget they can use without concealing the continuing obligations that those services place on the republic."
 COLDWAR_IRQ_aziz_regional_budget_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_regional_budget$"
 COLDWAR_IRQ_aziz_regional_budget_pending:0 "Deliver: $COLDWAR_IRQ_aziz_regional_budget$"
 COLDWAR_IRQ_aziz_language_rights:0 "Language in Schools"
 COLDWAR_IRQ_aziz_language_rights_desc:0 "Children should not be excluded from useful instruction because the language of the classroom makes it inaccessible. Broader provision will require teachers and materials suited to the communities concerned, making language rights an educational undertaking rather than a ceremonial declaration."
 COLDWAR_IRQ_aziz_language_rights_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_language_rights$"
 COLDWAR_IRQ_aziz_language_rights_pending:0 "Deliver: $COLDWAR_IRQ_aziz_language_rights$"
 COLDWAR_IRQ_aziz_soviet_distance:0 "Room to Disagree"
 COLDWAR_IRQ_aziz_soviet_distance_desc:0 "Friendship with Moscow should not require Baghdad to accept every Soviet political expectation. Maintaining room to disagree will encourage a wider range of technical and commercial relationships, although Iraq must still meet the commitments it has actually made."
 COLDWAR_IRQ_aziz_soviet_distance_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_soviet_distance$"
 COLDWAR_IRQ_aziz_soviet_distance_pending:0 "Deliver: $COLDWAR_IRQ_aziz_soviet_distance$"
 COLDWAR_IRQ_aziz_worker_training:0 "Workers Training"
 COLDWAR_IRQ_aziz_worker_training_desc:0 "A new industrial order needs workers able to master unfamiliar machinery and help others use it. Practical training can improve both factory organization and civilian production, while placing demands on the services supporting workers and their families."
 COLDWAR_IRQ_aziz_worker_training_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_worker_training$"
 COLDWAR_IRQ_aziz_worker_training_pending:0 "Deliver: $COLDWAR_IRQ_aziz_worker_training$"
 COLDWAR_IRQ_aziz_united_opposition:0 "Parliamentary Allies"
 COLDWAR_IRQ_aziz_united_opposition_desc:0 "A socialist government cannot treat every criticism as an attempt to overthrow it. Parliamentary allies and workplace representatives need a recognized means of challenging ministers without dismantling the institutions through which they must govern together."
 COLDWAR_IRQ_aziz_united_opposition_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_united_opposition$"
 COLDWAR_IRQ_aziz_united_opposition_pending:0 "Deliver: $COLDWAR_IRQ_aziz_united_opposition$"
 COLDWAR_IRQ_aziz_civilian_welfare:0 "Welfare before Prestige"
 COLDWAR_IRQ_aziz_civilian_welfare_desc:0 "Military prestige will not replace medical care or dependable household services. Aziz can direct the state toward civilian welfare and a more regular military establishment, accepting the continuing public commitments that this choice entails."
 COLDWAR_IRQ_aziz_civilian_welfare_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_civilian_welfare$"
 COLDWAR_IRQ_aziz_civilian_welfare_pending:0 "Deliver: $COLDWAR_IRQ_aziz_civilian_welfare$"
 COLDWAR_IRQ_aziz_workplace_delegates:0 "Workplace Delegates"
 COLDWAR_IRQ_aziz_workplace_delegates_desc:0 "Workplace delegates can preserve knowledge that disappears when managers reorganize a production line without consulting those who operate it. Their involvement may restrain immediate output demands, but it can make subsequent industrial work more dependable."
 COLDWAR_IRQ_aziz_workplace_delegates_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_workplace_delegates$"
 COLDWAR_IRQ_aziz_workplace_delegates_pending:0 "Deliver: $COLDWAR_IRQ_aziz_workplace_delegates$"
 COLDWAR_IRQ_aziz_safe_return:0 "Bring the Exiles Home"
 COLDWAR_IRQ_aziz_safe_return_desc:0 "Exile scattered Iraqi political experience across neighboring countries and beyond. Returning organizers should be offered useful work in reconstruction and technical instruction, while their appointments must rest on a defined public role rather than a claim to automatic authority."
 COLDWAR_IRQ_aziz_safe_return_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_safe_return$"
 COLDWAR_IRQ_aziz_safe_return_pending:0 "Deliver: $COLDWAR_IRQ_aziz_safe_return$"
 COLDWAR_IRQ_aziz_rural_services:0 "Rural Services"
 COLDWAR_IRQ_aziz_rural_services_desc:0 "Villages need access to practical agricultural advice and medical assistance as well as visits from party organizers. Establishing those services will give rural government substance, but it creates obligations that Baghdad must maintain beyond a single political campaign."
 COLDWAR_IRQ_aziz_rural_services_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_rural_services$"
 COLDWAR_IRQ_aziz_rural_services_pending:0 "Deliver: $COLDWAR_IRQ_aziz_rural_services$"
 COLDWAR_IRQ_aziz_party_renewal:0 "The Party Mandate"
 COLDWAR_IRQ_aziz_party_renewal_desc:0 "A party cannot govern indefinitely through the methods that allowed it to survive in hiding. Aziz must renew its leadership and public accounts together, turning experienced organizers into an administration capable of answering for the work entrusted to it."
 COLDWAR_IRQ_aziz_party_renewal_implemented:0 "Implemented: $COLDWAR_IRQ_aziz_party_renewal$"
 COLDWAR_IRQ_aziz_party_renewal_pending:0 "Deliver: $COLDWAR_IRQ_aziz_party_renewal$"
 COLDWAR_IRQ_civic_reconstitution:0 "Civilian Politics"
 COLDWAR_IRQ_civic_reconstitution_desc:0 "Civilian parties must rebuild institutions that have repeatedly been displaced by military and party struggles. Their claim to govern Iraq will depend on public offices able to act predictably without relying on the personal protection of a commander."
 COLDWAR_IRQ_civic_reconstitution_implemented:0 "Implemented: $COLDWAR_IRQ_civic_reconstitution$"
 COLDWAR_IRQ_civic_reconstitution_pending:0 "Deliver: $COLDWAR_IRQ_civic_reconstitution$"
 COLDWAR_IRQ_civic_social_republic:0 "Social Republic"
 COLDWAR_IRQ_civic_social_republic_desc:0 "A social republic would make public provision part of the ordinary responsibilities of government. Medical care and a stronger civilian economy can support that settlement, provided elected ministers accept the cost of commitments that survive changes of cabinet."
 COLDWAR_IRQ_civic_social_republic_implemented:0 "Implemented: $COLDWAR_IRQ_civic_social_republic$"
 COLDWAR_IRQ_civic_social_republic_pending:0 "Deliver: $COLDWAR_IRQ_civic_social_republic$"
 COLDWAR_IRQ_civic_liberal_republic:0 "Liberal Republic"
 COLDWAR_IRQ_civic_liberal_republic_desc:0 "Private undertakings need confidence that contracts and investment conditions will survive a political change in Baghdad. A liberal republic can offer that continuity, while accepting the revenue concessions required to encourage construction outside the state sector."
 COLDWAR_IRQ_civic_liberal_republic_implemented:0 "Implemented: $COLDWAR_IRQ_civic_liberal_republic$"
 COLDWAR_IRQ_civic_liberal_republic_pending:0 "Deliver: $COLDWAR_IRQ_civic_liberal_republic$"
 COLDWAR_IRQ_civic_social_budget:0 "Budget for Social Rights"
 COLDWAR_IRQ_civic_social_budget_desc:0 "Social rights must be supported by accounts that connect promises with the services expected to fulfill them. A civilian government can make education and care more dependable by treating their administration as permanent work rather than a succession of ministerial initiatives."
 COLDWAR_IRQ_civic_social_budget_implemented:0 "Implemented: $COLDWAR_IRQ_civic_social_budget$"
 COLDWAR_IRQ_civic_social_budget_pending:0 "Deliver: $COLDWAR_IRQ_civic_social_budget$"
 COLDWAR_IRQ_civic_commercial_courts:0 "Commercial Courts"
 COLDWAR_IRQ_civic_commercial_courts_desc:0 "Iraqi businesses cannot rely on contracts whose enforcement depends on a patron inside the ministry. Professional courts and recorded procedures will make obligations more predictable, while challenging officials who profit from uncertainty and personal intervention."
 COLDWAR_IRQ_civic_commercial_courts_implemented:0 "Implemented: $COLDWAR_IRQ_civic_commercial_courts$"
 COLDWAR_IRQ_civic_commercial_courts_pending:0 "Deliver: $COLDWAR_IRQ_civic_commercial_courts$"
 COLDWAR_IRQ_civic_electoral_register:0 "An Electoral Register"
 COLDWAR_IRQ_civic_electoral_register_desc:0 "Representative government needs a register that citizens and competing parties can examine with confidence. Building it will require ordinary civilian offices rather than exceptional security supervision, and no party can assume that a properly organized election guarantees its victory."
 COLDWAR_IRQ_civic_electoral_register_implemented:0 "Implemented: $COLDWAR_IRQ_civic_electoral_register$"
 COLDWAR_IRQ_civic_electoral_register_pending:0 "Deliver: $COLDWAR_IRQ_civic_electoral_register$"
 COLDWAR_IRQ_civic_federal:0 "A Federal Constitution"
 COLDWAR_IRQ_civic_federal_desc:0 "A federal constitution must give the provinces practical means to exercise the responsibilities it recognizes. Better routes and regular local services can support that settlement, while requiring Baghdad to share revenue rather than merely delegate unpaid duties."
 COLDWAR_IRQ_civic_federal_implemented:0 "Implemented: $COLDWAR_IRQ_civic_federal$"
 COLDWAR_IRQ_civic_federal_pending:0 "Deliver: $COLDWAR_IRQ_civic_federal$"
 COLDWAR_IRQ_civic_unitary:0 "A Unitary Republic"
 COLDWAR_IRQ_civic_unitary_desc:0 "A unitary republic can offer common rules for collection and public administration throughout Iraq. Its supporters must still explain how provincial interests will be heard when the treasury and ministries remain concentrated in the capital."
 COLDWAR_IRQ_civic_unitary_implemented:0 "Implemented: $COLDWAR_IRQ_civic_unitary$"
 COLDWAR_IRQ_civic_unitary_pending:0 "Deliver: $COLDWAR_IRQ_civic_unitary$"
 COLDWAR_IRQ_civic_fiscal_federalism:0 "Agree Fiscal Federalism"
 COLDWAR_IRQ_civic_fiscal_federalism_desc:0 "Neither a central budget nor a regional administration can function on revenue claimed twice. An agreed fiscal settlement should clarify which public bodies collect and retain income, even where that reduces the sums immediately available to Baghdad."
 COLDWAR_IRQ_civic_fiscal_federalism_implemented:0 "Implemented: $COLDWAR_IRQ_civic_fiscal_federalism$"
 COLDWAR_IRQ_civic_fiscal_federalism_pending:0 "Deliver: $COLDWAR_IRQ_civic_fiscal_federalism$"
 COLDWAR_IRQ_civic_local_accounts:0 "Municipal Accounts"
 COLDWAR_IRQ_civic_local_accounts_desc:0 "Municipal government needs records of households, services and local economic activity that can be used beyond a mayor's personal circle. Reliable accounts will help collection and public administration without requiring every routine matter to return to a national ministry."
 COLDWAR_IRQ_civic_local_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_civic_local_accounts$"
 COLDWAR_IRQ_civic_local_accounts_pending:0 "Deliver: $COLDWAR_IRQ_civic_local_accounts$"
 COLDWAR_IRQ_civic_security_oversight:0 "Security Oversight"
 COLDWAR_IRQ_civic_security_oversight_desc:0 "Civilian authority must be able to examine the work and expenditure of the security services. Ending unnecessary exceptional operations can reduce their burden, although oversight will sometimes limit the methods through which officers have gathered information."
 COLDWAR_IRQ_civic_security_oversight_implemented:0 "Implemented: $COLDWAR_IRQ_civic_security_oversight$"
 COLDWAR_IRQ_civic_security_oversight_pending:0 "Deliver: $COLDWAR_IRQ_civic_security_oversight$"
 COLDWAR_IRQ_civic_education:0 "Republican Schools"
 COLDWAR_IRQ_civic_education_desc:0 "Republican schools should prepare Iraqis to participate in public and economic life rather than serve as extensions of a cabinet's patronage. Wider basic instruction requires dependable teachers and administration that continue working when political leadership changes."
 COLDWAR_IRQ_civic_education_implemented:0 "Implemented: $COLDWAR_IRQ_civic_education$"
 COLDWAR_IRQ_civic_education_pending:0 "Deliver: $COLDWAR_IRQ_civic_education$"
 COLDWAR_IRQ_civic_non_alignment:0 "Independent Diplomacy"
 COLDWAR_IRQ_civic_non_alignment_desc:0 "Iraq's civilian government should be able to negotiate with several partners without becoming dependent on any one of them. Diversified commercial arrangements and stronger institutions can support that independence, while limiting the resources available for political adventures abroad."
 COLDWAR_IRQ_civic_non_alignment_implemented:0 "Implemented: $COLDWAR_IRQ_civic_non_alignment$"
 COLDWAR_IRQ_civic_non_alignment_pending:0 "Deliver: $COLDWAR_IRQ_civic_non_alignment$"
 COLDWAR_IRQ_civic_labour_bargain:0 "Labour Bargain"
 COLDWAR_IRQ_civic_labour_bargain_desc:0 "Industrial employers and workers need a recognized way to settle disputes before they interrupt production. A labour bargain will restrain some immediate demands on the workforce, but it can support safer workplaces and a more dependable industrial rhythm."
 COLDWAR_IRQ_civic_labour_bargain_implemented:0 "Implemented: $COLDWAR_IRQ_civic_labour_bargain$"
 COLDWAR_IRQ_civic_labour_bargain_pending:0 "Deliver: $COLDWAR_IRQ_civic_labour_bargain$"
 COLDWAR_IRQ_civic_universities:0 "University Autonomy"
 COLDWAR_IRQ_civic_universities_desc:0 "Universities need room to pursue technical learning without measuring every appointment against a party's immediate political needs. More independent institutions can develop Iraqi computing expertise, provided the government funds their work and accepts conclusions it does not always welcome."
 COLDWAR_IRQ_civic_universities_implemented:0 "Implemented: $COLDWAR_IRQ_civic_universities$"
 COLDWAR_IRQ_civic_universities_pending:0 "Deliver: $COLDWAR_IRQ_civic_universities$"
 COLDWAR_IRQ_civic_credit_terms:0 "Transparent Finance"
 COLDWAR_IRQ_civic_credit_terms_desc:0 "A parliamentary government must explain the obligations it asks future budgets to carry. Transparent credit accounts can improve domestic finance, while leaving foreign lenders free to refuse proposals they consider insufficiently secure."
 COLDWAR_IRQ_civic_credit_terms_implemented:0 "Implemented: $COLDWAR_IRQ_civic_credit_terms$"
 COLDWAR_IRQ_civic_credit_terms_pending:0 "Deliver: $COLDWAR_IRQ_civic_credit_terms$"
 COLDWAR_IRQ_civic_union_compact:0 "Labour Rights Compact"
 COLDWAR_IRQ_civic_union_compact_desc:0 "A durable labour agreement should preserve useful skills when plants change their products or managers. Recognized rights and responsibilities can make those transitions less disruptive, though maintaining the compact requires an administration able to enforce its terms."
 COLDWAR_IRQ_civic_union_compact_implemented:0 "Implemented: $COLDWAR_IRQ_civic_union_compact$"
 COLDWAR_IRQ_civic_union_compact_pending:0 "Deliver: $COLDWAR_IRQ_civic_union_compact$"
 COLDWAR_IRQ_civic_mandate:0 "A Civilian Mandate"
 COLDWAR_IRQ_civic_mandate_desc:0 "Civilian government needs a revenue system that survives the departure of a particular minister. Predictable collection and competent public offices would give elected institutions the means to govern without recreating a patronage machine at every political turn."
 COLDWAR_IRQ_civic_mandate_implemented:0 "Implemented: $COLDWAR_IRQ_civic_mandate$"
 COLDWAR_IRQ_civic_mandate_pending:0 "Deliver: $COLDWAR_IRQ_civic_mandate$"
 COLDWAR_IRQ_royal_charter:0 "A New Charter"
 COLDWAR_IRQ_royal_charter_desc:0 "A restored crown would need a charter suited to an Iraq transformed since the fall of the monarchy. Its supporters must offer credible public contracts and protections rather than expect the old title alone to secure confidence at home or abroad."
 COLDWAR_IRQ_royal_charter_implemented:0 "Implemented: $COLDWAR_IRQ_royal_charter$"
 COLDWAR_IRQ_royal_charter_pending:0 "Deliver: $COLDWAR_IRQ_royal_charter$"
 COLDWAR_IRQ_royal_ceremonial:0 "A Ceremonial Crown"
 COLDWAR_IRQ_royal_ceremonial_desc:0 "A ceremonial crown would leave the daily work of government to responsible civilian ministers. That separation can make public undertakings easier to trust, while requiring the palace to surrender much of the discretion associated with an executive monarch."
 COLDWAR_IRQ_royal_ceremonial_implemented:0 "Implemented: $COLDWAR_IRQ_royal_ceremonial$"
 COLDWAR_IRQ_royal_ceremonial_pending:0 "Deliver: $COLDWAR_IRQ_royal_ceremonial$"
 COLDWAR_IRQ_royal_executive:0 "An Executive Crown"
 COLDWAR_IRQ_royal_executive_desc:0 "An executive crown would claim a direct role in appointments and national command. It could give the government a stronger center, but Iraq's memory of the monarchy means that concentrated royal authority will face doubts no proclamation can simply remove."
 COLDWAR_IRQ_royal_executive_implemented:0 "Implemented: $COLDWAR_IRQ_royal_executive$"
 COLDWAR_IRQ_royal_executive_pending:0 "Deliver: $COLDWAR_IRQ_royal_executive$"
 COLDWAR_IRQ_royal_parliament:0 "Responsible Parliament"
 COLDWAR_IRQ_royal_parliament_desc:0 "A responsible parliament must be able to question collection and public security without being treated as an obstacle to the crown. Making it useful in ordinary government will require both the palace and the ministries to accept procedures that outlast personal relationships."
 COLDWAR_IRQ_royal_parliament_implemented:0 "Implemented: $COLDWAR_IRQ_royal_parliament$"
 COLDWAR_IRQ_royal_parliament_pending:0 "Deliver: $COLDWAR_IRQ_royal_parliament$"
 COLDWAR_IRQ_royal_council:0 "Royal Advisory Council"
 COLDWAR_IRQ_royal_council_desc:0 "The palace needs advisers able to connect military appointments and diplomatic commitments with the practical needs of Iraq. A recognized council can coordinate that work, although its members must justify an establishment that might otherwise become another circle of court patronage."
 COLDWAR_IRQ_royal_council_implemented:0 "Implemented: $COLDWAR_IRQ_royal_council$"
 COLDWAR_IRQ_royal_council_pending:0 "Deliver: $COLDWAR_IRQ_royal_council$"
 COLDWAR_IRQ_royal_accounts:0 "Crown and Treasury"
 COLDWAR_IRQ_royal_accounts_desc:0 "The treasury must distinguish the expenses of the crown from those of the state. Clear public accounts will strengthen collection and civilian administration, while restricting the palace's ability to resolve every obligation through an informal arrangement."
 COLDWAR_IRQ_royal_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_royal_accounts$"
 COLDWAR_IRQ_royal_accounts_pending:0 "Deliver: $COLDWAR_IRQ_royal_accounts$"
 COLDWAR_IRQ_royal_land_review:0 "Review Land Claims"
 COLDWAR_IRQ_royal_land_review_desc:0 "The crown cannot settle rural grievances by pretending that Iraq's land question ended with the old monarchy. A review should make cultivation and lawful claims more secure, while recognizing the public obligations created by any promise of redress."
 COLDWAR_IRQ_royal_land_review_implemented:0 "Implemented: $COLDWAR_IRQ_royal_land_review$"
 COLDWAR_IRQ_royal_land_review_pending:0 "Deliver: $COLDWAR_IRQ_royal_land_review$"
 COLDWAR_IRQ_royal_property_guarantees:0 "Existing Property"
 COLDWAR_IRQ_royal_property_guarantees_desc:0 "Existing owners will be more willing to build if they believe the government will honor established contracts. Such guarantees can provide immediate economic continuity, but they will leave unresolved grievances among those who regard the present distribution of property as unjust."
 COLDWAR_IRQ_royal_property_guarantees_implemented:0 "Implemented: $COLDWAR_IRQ_royal_property_guarantees$"
 COLDWAR_IRQ_royal_property_guarantees_pending:0 "Deliver: $COLDWAR_IRQ_royal_property_guarantees$"
 COLDWAR_IRQ_royal_compensation:0 "Compensation Tribunal"
 COLDWAR_IRQ_royal_compensation_desc:0 "Competing claims to land can obstruct roads and public works as effectively as a shortage of materials. A funded tribunal should provide a usable settlement of obligations without allowing the palace to decide every case through personal favor."
 COLDWAR_IRQ_royal_compensation_implemented:0 "Implemented: $COLDWAR_IRQ_royal_compensation$"
 COLDWAR_IRQ_royal_compensation_pending:0 "Deliver: $COLDWAR_IRQ_royal_compensation$"
 COLDWAR_IRQ_royal_rural_contracts:0 "Rural Contract Law"
 COLDWAR_IRQ_royal_rural_contracts_desc:0 "Rural development requires agreements that cultivators and public authorities can understand and enforce. Clearer contracts will support agricultural work and regular collection, provided their administration reaches beyond the offices of a few influential landholders."
 COLDWAR_IRQ_royal_rural_contracts_implemented:0 "Implemented: $COLDWAR_IRQ_royal_rural_contracts$"
 COLDWAR_IRQ_royal_rural_contracts_pending:0 "Deliver: $COLDWAR_IRQ_royal_rural_contracts$"
 COLDWAR_IRQ_royal_citizenship:0 "A Common Crown"
 COLDWAR_IRQ_royal_citizenship_desc:0 "A common crown must offer Iraq's communities more than invitations to a royal ceremony. Shared access to public institutions and instruction can support a national settlement, while limiting the informal privileges through which the palace might otherwise seek support."
 COLDWAR_IRQ_royal_citizenship_implemented:0 "Implemented: $COLDWAR_IRQ_royal_citizenship$"
 COLDWAR_IRQ_royal_citizenship_pending:0 "Deliver: $COLDWAR_IRQ_royal_citizenship$"
 COLDWAR_IRQ_royal_jordan:0 "Hashemite Liaison"
 COLDWAR_IRQ_royal_jordan_desc:0 "Relations with Jordan require officials who can turn familiar names and personal contacts into practical business. A Hashemite liaison service will prepare commercial proposals, maintain military purchasing contacts and guide investors through Iraqi procedures. Its standing will depend on competent work in Baghdad as much as access to Amman."
 COLDWAR_IRQ_royal_jordan_implemented:0 "Implemented: $COLDWAR_IRQ_royal_jordan$"
 COLDWAR_IRQ_royal_jordan_pending:0 "Deliver: $COLDWAR_IRQ_royal_jordan$"
 COLDWAR_IRQ_royal_service:0 "Royal Civil Service"
 COLDWAR_IRQ_royal_service_desc:0 "A royal civil service must be able to carry out public work without waiting for an intervention from the palace. Professional appointments and dependable administration can make the restored order more credible than a revival of old offices and titles."
 COLDWAR_IRQ_royal_service_implemented:0 "Implemented: $COLDWAR_IRQ_royal_service$"
 COLDWAR_IRQ_royal_service_pending:0 "Deliver: $COLDWAR_IRQ_royal_service$"
 COLDWAR_IRQ_royal_education:0 "Schools and Citizenship"
 COLDWAR_IRQ_royal_education_desc:0 "Schools can give citizenship a practical meaning for families that have little direct contact with the capital. The crown should support basic instruction through institutions that serve the public rather than requiring personal loyalty to the royal household."
 COLDWAR_IRQ_royal_education_implemented:0 "Implemented: $COLDWAR_IRQ_royal_education$"
 COLDWAR_IRQ_royal_education_pending:0 "Deliver: $COLDWAR_IRQ_royal_education$"
 COLDWAR_IRQ_royal_commerce:0 "Commercial Representation"
 COLDWAR_IRQ_royal_commerce_desc:0 "Iraqi firms need representatives able to explain their contracts, resolve administrative questions and guide investment applications through the ministries. A commercial service can make those arrangements easier to use and strengthen the taxable business conducted through Iraqi offices. Supporting that access will require concessions in the government's wider revenue arrangements."
 COLDWAR_IRQ_royal_commerce_implemented:0 "Implemented: $COLDWAR_IRQ_royal_commerce$"
 COLDWAR_IRQ_royal_commerce_pending:0 "Deliver: $COLDWAR_IRQ_royal_commerce$"
 COLDWAR_IRQ_royal_public_works:0 "Royal Public Works"
 COLDWAR_IRQ_royal_public_works_desc:0 "The crown's public programme should be visible in useful routes and services. Work around Basra can support the commercial life of southern Iraq, provided the treasury meets the obligations involved instead of treating royal sponsorship as a substitute for funding."
 COLDWAR_IRQ_royal_public_works_implemented:0 "Implemented: $COLDWAR_IRQ_royal_public_works$"
 COLDWAR_IRQ_royal_public_works_pending:0 "Deliver: $COLDWAR_IRQ_royal_public_works$"
 COLDWAR_IRQ_royal_budget_review:0 "Budget Review"
 COLDWAR_IRQ_royal_budget_review_desc:0 "A regular budget should reveal whether public commitments are supported by dependable income. Parliamentary and ministerial scrutiny can improve collection and medical administration, while requiring the palace to defend priorities it might prefer to settle privately."
 COLDWAR_IRQ_royal_budget_review_implemented:0 "Implemented: $COLDWAR_IRQ_royal_budget_review$"
 COLDWAR_IRQ_royal_budget_review_pending:0 "Deliver: $COLDWAR_IRQ_royal_budget_review$"
 COLDWAR_IRQ_royal_settlement:0 "Constitutional Charter"
 COLDWAR_IRQ_royal_settlement_desc:0 "A constitutional crown can endure only if the institutions around it carry the daily work of government. A settled charter would give public and commercial partners clearer terms, while maintaining the offices needed to turn those commitments into ordinary practice."
 COLDWAR_IRQ_royal_settlement_implemented:0 "Implemented: $COLDWAR_IRQ_royal_settlement$"
 COLDWAR_IRQ_royal_settlement_pending:0 "Deliver: $COLDWAR_IRQ_royal_settlement$"
 COLDWAR_IRQ_foreign_dossier:0 "Foreign Policy Dossier"
 COLDWAR_IRQ_foreign_dossier_desc:0 "Oil, borders and the superpower rivalry make diplomacy a practical necessity. A professional foreign service will put Iraqi interests before the rival ambitions of individual ministries."
 COLDWAR_IRQ_foreign_dossier_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_dossier$"
 COLDWAR_IRQ_foreign_dossier_pending:0 "Deliver: $COLDWAR_IRQ_foreign_dossier$"
 COLDWAR_IRQ_foreign_treaty_partner:0 "Seek a Treaty Partner"
 COLDWAR_IRQ_foreign_treaty_partner_desc:0 "A dependable partner can provide access to training and technology. Choosing that relationship also gives an outside power greater weight in Iraqi affairs."
 COLDWAR_IRQ_foreign_treaty_partner_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_treaty_partner$"
 COLDWAR_IRQ_foreign_treaty_partner_pending:0 "Deliver: $COLDWAR_IRQ_foreign_treaty_partner$"
 COLDWAR_IRQ_foreign_non_alignment:0 "Active Non-Alignment"
 COLDWAR_IRQ_foreign_non_alignment_desc:0 "Iraq need not place every contract and security calculation in the hands of one bloc. Maintaining alternatives protects room for manoeuvre, but each relationship will have to stand on negotiated terms."
 COLDWAR_IRQ_foreign_non_alignment_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_non_alignment$"
 COLDWAR_IRQ_foreign_non_alignment_pending:0 "Deliver: $COLDWAR_IRQ_foreign_non_alignment$"
 COLDWAR_IRQ_foreign_partner_offer:0 "Foreign Technical Standards"
 COLDWAR_IRQ_foreign_partner_offer_desc:0 "Imported machinery is useful only when Iraqi engineers can specify, inspect and maintain it. A technical standards office will collect foreign industrial specifications and turn them into guidance for our own factories. Shared testing procedures and translated manuals will help Iraqi industry absorb equipment from a wider range of suppliers."
 COLDWAR_IRQ_foreign_partner_offer_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_partner_offer$"
 COLDWAR_IRQ_foreign_partner_offer_pending:0 "Deliver: $COLDWAR_IRQ_foreign_partner_offer$"
 COLDWAR_IRQ_foreign_multiple_offers:0 "Open Cooperation"
 COLDWAR_IRQ_foreign_multiple_offers_desc:0 "Different suppliers can meet different civilian needs. Comparing their offers will improve Iraqi construction practice without granting any foreign government an automatic concession."
 COLDWAR_IRQ_foreign_multiple_offers_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_multiple_offers$"
 COLDWAR_IRQ_foreign_multiple_offers_pending:0 "Deliver: $COLDWAR_IRQ_foreign_multiple_offers$"
 COLDWAR_IRQ_foreign_treaty_register:0 "External Obligations"
 COLDWAR_IRQ_foreign_treaty_register_desc:0 "Agreements must bind the institutions that sign them. A common register of obligations will prevent a minister from selling commitments already made elsewhere."
 COLDWAR_IRQ_foreign_treaty_register_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_treaty_register$"
 COLDWAR_IRQ_foreign_treaty_register_pending:0 "Deliver: $COLDWAR_IRQ_foreign_treaty_register$"
 COLDWAR_IRQ_foreign_border_settlement:0 "The Shatt al-Arab"
 COLDWAR_IRQ_foreign_border_settlement_desc:0 "A defensible frontier does not require a permanent sequence of incidents. Better prepared positions and supply arrangements will give Iraq a stronger hand at the negotiating table."
 COLDWAR_IRQ_foreign_border_settlement_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_border_settlement$"
 COLDWAR_IRQ_foreign_border_settlement_pending:0 "Deliver: $COLDWAR_IRQ_foreign_border_settlement$"
 COLDWAR_IRQ_foreign_armed_deterrence:0 "Armed Deterrence"
 COLDWAR_IRQ_foreign_armed_deterrence_desc:0 "Negotiations are more credible when the frontier can be held. Iraq will sustain a more expensive defensive posture while accepting the risks that accompany armed deterrence."
 COLDWAR_IRQ_foreign_armed_deterrence_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_armed_deterrence$"
 COLDWAR_IRQ_foreign_armed_deterrence_pending:0 "Deliver: $COLDWAR_IRQ_foreign_armed_deterrence$"
 COLDWAR_IRQ_foreign_border_delivery:0 "Deliver the Settlement"
 COLDWAR_IRQ_foreign_border_delivery_desc:0 "Reciprocal border arrangements must survive their signing ceremony. Improving frontier transport will allow Iraq to service the settlement and supply its own border communities."
 COLDWAR_IRQ_foreign_border_delivery_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_border_delivery$"
 COLDWAR_IRQ_foreign_border_delivery_pending:0 "Deliver: $COLDWAR_IRQ_foreign_border_delivery$"
 COLDWAR_IRQ_foreign_incident_channel:0 "Frontier Liaison Offices"
 COLDWAR_IRQ_foreign_incident_channel_desc:0 "Patrol reports often reach Baghdad through separate military and civil chains, leaving ministers to judge a frontier incident from incomplete accounts. Liaison offices can bring those reports together, maintain clear contact lists and prepare a common assessment for the general staff. Better information and practiced procedures will help commanders respond before uncertainty hardens into a crisis."
 COLDWAR_IRQ_foreign_incident_channel_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_incident_channel$"
 COLDWAR_IRQ_foreign_incident_channel_pending:0 "Deliver: $COLDWAR_IRQ_foreign_incident_channel$"
 COLDWAR_IRQ_foreign_regional_diplomacy:0 "Regional Diplomacy"
 COLDWAR_IRQ_foreign_regional_diplomacy_desc:0 "Iraq's neighbours are markets, rivals and political partners at the same time. Regional diplomacy should turn that proximity into workable commercial relations."
 COLDWAR_IRQ_foreign_regional_diplomacy_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_regional_diplomacy$"
 COLDWAR_IRQ_foreign_regional_diplomacy_pending:0 "Deliver: $COLDWAR_IRQ_foreign_regional_diplomacy$"
 COLDWAR_IRQ_foreign_syria:0 "Syrian Transport Links"
 COLDWAR_IRQ_foreign_syria_desc:0 "The roads and freight routes leading toward Syria are important to Iraqi commerce despite the rivalry between the two Baathist governments. Transport engineers can survey the Iraqi approaches, standardize maintenance plans and prepare better connections to the frontier. These works will strengthen our network and provide a sound basis for any later negotiations over cross-border traffic."
 COLDWAR_IRQ_foreign_syria_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_syria$"
 COLDWAR_IRQ_foreign_syria_pending:0 "Deliver: $COLDWAR_IRQ_foreign_syria$"
 COLDWAR_IRQ_foreign_kuwait:0 "Gulf Commercial Office"
 COLDWAR_IRQ_foreign_kuwait_desc:0 "Basra's merchants deal with Gulf shipping, banks and trading houses whose business depends on reliable accounts and enforceable contracts. A commercial office will bring customs specialists, investment advisers and financial services together in the port city. Their work can strengthen Iraqi commerce while giving Baghdad a better understanding of its neighbours' interests."
 COLDWAR_IRQ_foreign_kuwait_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_kuwait$"
 COLDWAR_IRQ_foreign_kuwait_pending:0 "Deliver: $COLDWAR_IRQ_foreign_kuwait$"
 COLDWAR_IRQ_foreign_party_support:0 "Foreign Party Support"
 COLDWAR_IRQ_foreign_party_support_desc:0 "Regional party networks can extend Iraqi influence beyond official diplomacy. Supporting them consumes political attention and may complicate relations with governments that host their opponents."
 COLDWAR_IRQ_foreign_party_support_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_party_support$"
 COLDWAR_IRQ_foreign_party_support_pending:0 "Deliver: $COLDWAR_IRQ_foreign_party_support$"
 COLDWAR_IRQ_foreign_arab_reconciliation:0 "Regional Development Bureau"
 COLDWAR_IRQ_foreign_arab_reconciliation_desc:0 "Competing claims to Arab leadership have too often obstructed useful economic work. A development bureau can prepare Iraqi proposals, compare financing terms and maintain the technical contacts needed to bring regional projects to negotiation. A consistent service will give Baghdad greater influence through work that other governments can judge on its merits."
 COLDWAR_IRQ_foreign_arab_reconciliation_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_arab_reconciliation$"
 COLDWAR_IRQ_foreign_arab_reconciliation_pending:0 "Deliver: $COLDWAR_IRQ_foreign_arab_reconciliation$"
 COLDWAR_IRQ_foreign_debt_diplomacy:0 "Regional Debt Settlement"
 COLDWAR_IRQ_foreign_debt_diplomacy_desc:0 "Iraq needs a treasury capable of negotiating maturity schedules and distinguishing a gift from a loan. Better debt administration can lower financing costs; it cannot cancel another government's claim by declaration."
 COLDWAR_IRQ_foreign_debt_diplomacy_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_debt_diplomacy$"
 COLDWAR_IRQ_foreign_debt_diplomacy_pending:0 "Deliver: $COLDWAR_IRQ_foreign_debt_diplomacy$"
 COLDWAR_IRQ_foreign_support_accounts:0 "Support Commitments"
 COLDWAR_IRQ_foreign_support_accounts_desc:0 "Political assistance should reach organisations that can actually use it. A disciplined support network will produce more influence from the same commitment rather than multiplying unaccountable intermediaries."
 COLDWAR_IRQ_foreign_support_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_support_accounts$"
 COLDWAR_IRQ_foreign_support_accounts_pending:0 "Deliver: $COLDWAR_IRQ_foreign_support_accounts$"
 COLDWAR_IRQ_foreign_review:0 "External Commitments"
 COLDWAR_IRQ_foreign_review_desc:0 "An independent foreign policy rests on institutions capable of remembering their commitments. Iraq will keep access to partners while defending its right to choose among them."
 COLDWAR_IRQ_foreign_review_implemented:0 "Implemented: $COLDWAR_IRQ_foreign_review$"
 COLDWAR_IRQ_foreign_review_pending:0 "Deliver: $COLDWAR_IRQ_foreign_review$"
 COLDWAR_IRQ_kdp_national_government:0 "The KDP Cabinet"
 COLDWAR_IRQ_kdp_national_government_desc:0 "A KDP cabinet governing Iraq must administer a republic larger and more diverse than the movement's original northern base. Its ministers will need ordinary public offices that can serve Arab and Kurdish communities without reducing government to a succession of personal agreements."
 COLDWAR_IRQ_kdp_national_government_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_national_government$"
 COLDWAR_IRQ_kdp_national_government_pending:0 "Deliver: $COLDWAR_IRQ_kdp_national_government$"
 COLDWAR_IRQ_kdp_autonomy:0 "The Autonomy Accord"
 COLDWAR_IRQ_kdp_autonomy_desc:0 "Autonomy must give regional authorities responsibilities they can actually administer within Iraq. Recognized public services and regular security arrangements can reduce the burden of permanent confrontation, provided Baghdad continues to honor the settlement it has accepted."
 COLDWAR_IRQ_kdp_autonomy_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_autonomy$"
 COLDWAR_IRQ_kdp_autonomy_pending:0 "Deliver: $COLDWAR_IRQ_kdp_autonomy$"
 COLDWAR_IRQ_kdp_federal_republic:0 "A Federal Republic"
 COLDWAR_IRQ_kdp_federal_republic_desc:0 "A federal republic would give the regions a more substantial place in national government. Roads and dependable project administration can connect that arrangement to everyday life, while the central treasury must accept the revenues and responsibilities reserved to the provinces."
 COLDWAR_IRQ_kdp_federal_republic_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_federal_republic$"
 COLDWAR_IRQ_kdp_federal_republic_pending:0 "Deliver: $COLDWAR_IRQ_kdp_federal_republic$"
 COLDWAR_IRQ_kdp_autonomy_budget:0 "Autonomous Services"
 COLDWAR_IRQ_kdp_autonomy_budget_desc:0 "An autonomous administration cannot provide useful services through political recognition alone. A dependable budget for education and medical care would give the northern settlement practical value, while obliging the state to sustain the commitments it has made."
 COLDWAR_IRQ_kdp_autonomy_budget_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_autonomy_budget$"
 COLDWAR_IRQ_kdp_autonomy_budget_pending:0 "Deliver: $COLDWAR_IRQ_kdp_autonomy_budget$"
 COLDWAR_IRQ_kdp_federal_budget:0 "Federal Revenue"
 COLDWAR_IRQ_kdp_federal_budget_desc:0 "Federal authority requires a clear account of who collects revenue and who is expected to provide services. Formal regional receipts can support that bargain, but Baghdad cannot count the same income as both a provincial entitlement and money free for central expenditure."
 COLDWAR_IRQ_kdp_federal_budget_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_federal_budget$"
 COLDWAR_IRQ_kdp_federal_budget_pending:0 "Deliver: $COLDWAR_IRQ_kdp_federal_budget$"
 COLDWAR_IRQ_kdp_government_accounts:0 "Regional Accounts"
 COLDWAR_IRQ_kdp_government_accounts_desc:0 "The movement's officials must learn to keep public accounts that can be used beyond their own personal networks. Reliable household records and civilian departments will help a KDP government carry responsibilities that are different from those of a regional political organization."
 COLDWAR_IRQ_kdp_government_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_government_accounts$"
 COLDWAR_IRQ_kdp_government_accounts_pending:0 "Deliver: $COLDWAR_IRQ_kdp_government_accounts$"
 COLDWAR_IRQ_kdp_barzani_continuity:0 "Barzani Continuity"
 COLDWAR_IRQ_kdp_barzani_continuity_desc:0 "The Barzani leadership holds relationships built through years of struggle and negotiation. Preserving that continuity can make appointments and mobilization more dependable, although established personal authority must still find a place within the institutions of government."
 COLDWAR_IRQ_kdp_barzani_continuity_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_barzani_continuity$"
 COLDWAR_IRQ_kdp_barzani_continuity_pending:0 "Deliver: $COLDWAR_IRQ_kdp_barzani_continuity$"
 COLDWAR_IRQ_kdp_civic_party:0 "A Civic KDP"
 COLDWAR_IRQ_kdp_civic_party_desc:0 "The KDP can develop into a civic organization whose public work extends beyond the authority of its best-known families. Professional offices and clearer contracts would widen its governing base, while reducing the leadership's freedom to settle every matter through personal influence."
 COLDWAR_IRQ_kdp_civic_party_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_civic_party$"
 COLDWAR_IRQ_kdp_civic_party_pending:0 "Deliver: $COLDWAR_IRQ_kdp_civic_party$"
 COLDWAR_IRQ_kdp_succession:0 "Barzani Succession"
 COLDWAR_IRQ_kdp_succession_desc:0 "The movement needs a recognized way to transfer leadership without allowing competing claims to paralyze its work. A council of eligible leaders can establish authority through an agreed settlement, rather than leave every public appointment dependent on uncertainty at the top."
 COLDWAR_IRQ_kdp_succession_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_succession$"
 COLDWAR_IRQ_kdp_succession_pending:0 "Deliver: $COLDWAR_IRQ_kdp_succession$"
 COLDWAR_IRQ_kdp_civic_councils:0 "Regional Councils"
 COLDWAR_IRQ_kdp_civic_councils_desc:0 "Regional councils should be able to supervise services and civilian economic work without constantly appealing to the party leadership. Their participation can make administration more dependable, but the government must accept that useful councils will sometimes disagree with it."
 COLDWAR_IRQ_kdp_civic_councils_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_civic_councils$"
 COLDWAR_IRQ_kdp_civic_councils_pending:0 "Deliver: $COLDWAR_IRQ_kdp_civic_councils$"
 COLDWAR_IRQ_kdp_language:0 "Language Rights"
 COLDWAR_IRQ_kdp_language_desc:0 "Language rights must be supported by classrooms, teachers and materials that families can use. Broader access to instruction would give the northern settlement a practical foundation, while requiring the treasury to maintain provision beyond the announcement of the policy."
 COLDWAR_IRQ_kdp_language_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_language$"
 COLDWAR_IRQ_kdp_language_pending:0 "Deliver: $COLDWAR_IRQ_kdp_language$"
 COLDWAR_IRQ_kdp_mountain_routes:0 "Mountain Roads"
 COLDWAR_IRQ_kdp_mountain_routes_desc:0 "The mountains have protected communities and separated them from markets and public services. Better routes around Erbil can reduce the cost of moving people and supplies, while linking the northern economy more closely to the rest of Iraq."
 COLDWAR_IRQ_kdp_mountain_routes_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_mountain_routes$"
 COLDWAR_IRQ_kdp_mountain_routes_pending:0 "Deliver: $COLDWAR_IRQ_kdp_mountain_routes$"
 COLDWAR_IRQ_kdp_oil_status:0 "Negotiate Kirkuk Status"
 COLDWAR_IRQ_kdp_oil_status_desc:0 "Kirkuk's status cannot be resolved by treating every political claim as an existing right to its resources. A more capable public administration can improve the handling of Iraqi export receipts while the communities and institutions concerned negotiate a lasting settlement."
 COLDWAR_IRQ_kdp_oil_status_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_oil_status$"
 COLDWAR_IRQ_kdp_oil_status_pending:0 "Deliver: $COLDWAR_IRQ_kdp_oil_status$"
 COLDWAR_IRQ_kdp_security_integration:0 "Security Integration"
 COLDWAR_IRQ_kdp_security_integration_desc:0 "Regional fighters and national military institutions cannot cooperate effectively through occasional political understandings alone. Common instruction and recognized service responsibilities can improve their coordination, provided the government carries the personnel obligations involved."
 COLDWAR_IRQ_kdp_security_integration_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_security_integration$"
 COLDWAR_IRQ_kdp_security_integration_pending:0 "Deliver: $COLDWAR_IRQ_kdp_security_integration$"
 COLDWAR_IRQ_kdp_rural_credit:0 "Mountain Farm Credit"
 COLDWAR_IRQ_kdp_rural_credit_desc:0 "Farmers in the northern uplands need credit and advice suited to holdings that cannot operate like large estates. A supported rural programme can improve production, while requiring officials to maintain the commitments made to cultivators beyond the movement's strongest districts."
 COLDWAR_IRQ_kdp_rural_credit_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_rural_credit$"
 COLDWAR_IRQ_kdp_rural_credit_pending:0 "Deliver: $COLDWAR_IRQ_kdp_rural_credit$"
 COLDWAR_IRQ_kdp_shared_revenue:0 "Shared Oil Revenue"
 COLDWAR_IRQ_kdp_shared_revenue_desc:0 "Shared revenue should make the northern settlement easier to administer rather than give every office a new claim to the same receipts. Clearer export and agricultural accounts can support public work, provided the central government honors the income reserved for regional responsibilities."
 COLDWAR_IRQ_kdp_shared_revenue_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_shared_revenue$"
 COLDWAR_IRQ_kdp_shared_revenue_pending:0 "Deliver: $COLDWAR_IRQ_kdp_shared_revenue$"
 COLDWAR_IRQ_kdp_local_policing:0 "Local Police Charter"
 COLDWAR_IRQ_kdp_local_policing_desc:0 "Local police must answer to an agreed public authority rather than competing party and security offices. A recognized charter can reduce exceptional expenditure and outside political leverage, but it must remain part of a settlement the government actually respects."
 COLDWAR_IRQ_kdp_local_policing_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_local_policing$"
 COLDWAR_IRQ_kdp_local_policing_pending:0 "Deliver: $COLDWAR_IRQ_kdp_local_policing$"
 COLDWAR_IRQ_kdp_common_republic:0 "A Common Republic"
 COLDWAR_IRQ_kdp_common_republic_desc:0 "The republic must honor the terms through which its communities have agreed to govern together. Public services, security responsibilities and revenue should follow that settlement, whether its accepted form is autonomy or a federal constitution."
 COLDWAR_IRQ_kdp_common_republic_implemented:0 "Implemented: $COLDWAR_IRQ_kdp_common_republic$"
 COLDWAR_IRQ_kdp_common_republic_pending:0 "Deliver: $COLDWAR_IRQ_kdp_common_republic$"
 COLDWAR_IRQ_puk_government:0 "Jalal Talabani"
 COLDWAR_IRQ_puk_government_desc:0 "Jalal Talabani's movement must turn its claim to represent a broader northern society into a programme of government. The work will require trained civilian offices as well as the political networks through which the PUK established itself."
 COLDWAR_IRQ_puk_government_implemented:0 "Implemented: $COLDWAR_IRQ_puk_government$"
 COLDWAR_IRQ_puk_government_pending:0 "Deliver: $COLDWAR_IRQ_puk_government$"
 COLDWAR_IRQ_puk_pluralist_left:0 "A Pluralist Kurdish Left"
 COLDWAR_IRQ_puk_pluralist_left_desc:0 "A pluralist Kurdish left can draw on teachers, public servants and organizers beyond a narrow party establishment. Their contribution would strengthen civilian government, while obliging the leadership to accept criticism and shared authority."
 COLDWAR_IRQ_puk_pluralist_left_implemented:0 "Implemented: $COLDWAR_IRQ_puk_pluralist_left$"
 COLDWAR_IRQ_puk_pluralist_left_pending:0 "Deliver: $COLDWAR_IRQ_puk_pluralist_left$"
 COLDWAR_IRQ_puk_disciplined_party:0 "Party Discipline"
 COLDWAR_IRQ_puk_disciplined_party_desc:0 "The PUK can instead concentrate its effort in a more disciplined party apparatus. That organization may direct production and mobilization more firmly, but it risks alienating people whose support depends on having a real voice in public affairs."
 COLDWAR_IRQ_puk_disciplined_party_implemented:0 "Implemented: $COLDWAR_IRQ_puk_disciplined_party$"
 COLDWAR_IRQ_puk_disciplined_party_pending:0 "Deliver: $COLDWAR_IRQ_puk_disciplined_party$"
 COLDWAR_IRQ_puk_local_assemblies:0 "Funded Assemblies"
 COLDWAR_IRQ_puk_local_assemblies_desc:0 "Assemblies will be useful only if they can supervise services and accounts that affect their communities. Funding that work can make collection and public security more regular, while adding responsibilities that party offices cannot administer informally forever."
 COLDWAR_IRQ_puk_local_assemblies_implemented:0 "Implemented: $COLDWAR_IRQ_puk_local_assemblies$"
 COLDWAR_IRQ_puk_local_assemblies_pending:0 "Deliver: $COLDWAR_IRQ_puk_local_assemblies$"
 COLDWAR_IRQ_puk_cadre_training:0 "A Progressive Cadre"
 COLDWAR_IRQ_puk_cadre_training_desc:0 "A progressive cadre needs practical skills as well as a clear political programme. Instruction in production and the organization of training will help the PUK's officials carry public responsibilities, although it requires an educational establishment of its own."
 COLDWAR_IRQ_puk_cadre_training_implemented:0 "Implemented: $COLDWAR_IRQ_puk_cadre_training$"
 COLDWAR_IRQ_puk_cadre_training_pending:0 "Deliver: $COLDWAR_IRQ_puk_cadre_training$"
 COLDWAR_IRQ_puk_federal_platform:0 "Federal Platform"
 COLDWAR_IRQ_puk_federal_platform_desc:0 "A federal programme must explain how the regions will build and protect the institutions it promises. Better project planning and more resilient public authority can support that aim, while central revenue must reflect the responsibilities retained outside Baghdad."
 COLDWAR_IRQ_puk_federal_platform_implemented:0 "Implemented: $COLDWAR_IRQ_puk_federal_platform$"
 COLDWAR_IRQ_puk_federal_platform_pending:0 "Deliver: $COLDWAR_IRQ_puk_federal_platform$"
 COLDWAR_IRQ_puk_regional_cooperation:0 "A Kurdish Liaison Council"
 COLDWAR_IRQ_puk_regional_cooperation_desc:0 "Local representatives need a common Iraqi forum for public services and regional administration. A liaison council can coordinate their work within the republic without merging parties or claiming authority over a separate Kurdish government."
 COLDWAR_IRQ_puk_regional_cooperation_implemented:0 "Implemented: $COLDWAR_IRQ_puk_regional_cooperation$"
 COLDWAR_IRQ_puk_regional_cooperation_pending:0 "Deliver: $COLDWAR_IRQ_puk_regional_cooperation$"
 COLDWAR_IRQ_puk_independent_movement:0 "Independent Movement"
 COLDWAR_IRQ_puk_independent_movement_desc:0 "An independent PUK apparatus can pursue its programme without waiting for a common regional leadership to agree. Stronger production and command offices would support that freedom, while requiring the movement to maintain services that cooperation might otherwise have shared."
 COLDWAR_IRQ_puk_independent_movement_implemented:0 "Implemented: $COLDWAR_IRQ_puk_independent_movement$"
 COLDWAR_IRQ_puk_independent_movement_pending:0 "Deliver: $COLDWAR_IRQ_puk_independent_movement$"
 COLDWAR_IRQ_puk_joint_services:0 "Regional Services Board"
 COLDWAR_IRQ_puk_joint_services_desc:0 "Shared procurement and professional administration can make provincial services more dependable. The board will coordinate Iraqi institutions and spending in the regions under our own authority."
 COLDWAR_IRQ_puk_joint_services_implemented:0 "Implemented: $COLDWAR_IRQ_puk_joint_services$"
 COLDWAR_IRQ_puk_joint_services_pending:0 "Deliver: $COLDWAR_IRQ_puk_joint_services$"
 COLDWAR_IRQ_puk_party_municipalities:0 "Municipal Networks"
 COLDWAR_IRQ_puk_party_municipalities_desc:0 "Municipal networks can connect the movement with the civilian economy of northern towns. Competent offices and recorded service income will give that presence a productive role, although administration must become more than an extension of the local party committee."
 COLDWAR_IRQ_puk_party_municipalities_implemented:0 "Implemented: $COLDWAR_IRQ_puk_party_municipalities$"
 COLDWAR_IRQ_puk_party_municipalities_pending:0 "Deliver: $COLDWAR_IRQ_puk_party_municipalities$"
 COLDWAR_IRQ_puk_constitution:0 "Federal Iraq"
 COLDWAR_IRQ_puk_constitution_desc:0 "A federal constitution requires agreement over authority, revenue and the limits of central intervention. Preparing officials able to administer those terms can strengthen the PUK's case, without allowing it to decide on behalf of the other Iraqi parties."
 COLDWAR_IRQ_puk_constitution_implemented:0 "Implemented: $COLDWAR_IRQ_puk_constitution$"
 COLDWAR_IRQ_puk_constitution_pending:0 "Deliver: $COLDWAR_IRQ_puk_constitution$"
 COLDWAR_IRQ_puk_sulaymaniyah:0 "Develop Sulaymaniyah"
 COLDWAR_IRQ_puk_sulaymaniyah_desc:0 "Sulaymaniyah needs productive employment as well as the public offices expected of a regional center. A civilian plant can give the local economy a stronger foundation, provided its operation is supported by practical management rather than political sponsorship alone."
 COLDWAR_IRQ_puk_sulaymaniyah_implemented:0 "Implemented: $COLDWAR_IRQ_puk_sulaymaniyah$"
 COLDWAR_IRQ_puk_sulaymaniyah_pending:0 "Deliver: $COLDWAR_IRQ_puk_sulaymaniyah$"
 COLDWAR_IRQ_puk_universities:0 "Regional Universities"
 COLDWAR_IRQ_puk_universities_desc:0 "Regional universities can supply the teachers and technical staff that northern public institutions lack. Supporting computing and professional education will connect those institutions with the wider Iraqi economy, while requiring the government to carry their continuing costs."
 COLDWAR_IRQ_puk_universities_implemented:0 "Implemented: $COLDWAR_IRQ_puk_universities$"
 COLDWAR_IRQ_puk_universities_pending:0 "Deliver: $COLDWAR_IRQ_puk_universities$"
 COLDWAR_IRQ_puk_security_compact:0 "A Security Compact"
 COLDWAR_IRQ_puk_security_compact_desc:0 "A security compact must define who commands, who trains and who pays the forces involved. Common instruction can make cooperation more dependable, but a recognized establishment creates obligations that cannot be left to an informal understanding between party leaders."
 COLDWAR_IRQ_puk_security_compact_implemented:0 "Implemented: $COLDWAR_IRQ_puk_security_compact$"
 COLDWAR_IRQ_puk_security_compact_pending:0 "Deliver: $COLDWAR_IRQ_puk_security_compact$"
 COLDWAR_IRQ_puk_trade_routes:0 "Mountain Trade Routes"
 COLDWAR_IRQ_puk_trade_routes_desc:0 "Mountain trade needs routes that remain useful when political relationships become strained. Better infrastructure around Sulaymaniyah, supported by competent project offices, can connect communities and commercial undertakings without promising to remove the frontier decisions of neighboring states."
 COLDWAR_IRQ_puk_trade_routes_implemented:0 "Implemented: $COLDWAR_IRQ_puk_trade_routes$"
 COLDWAR_IRQ_puk_trade_routes_pending:0 "Deliver: $COLDWAR_IRQ_puk_trade_routes$"
 COLDWAR_IRQ_puk_student_exchange:0 "Iraqi Student Exchange"
 COLDWAR_IRQ_puk_student_exchange_desc:0 "Students sent beyond their home districts should return with skills that public works can use. Construction instruction will support the north's expanding routes and services, while the institutions organizing the exchange must provide more than ceremonial visits."
 COLDWAR_IRQ_puk_student_exchange_implemented:0 "Implemented: $COLDWAR_IRQ_puk_student_exchange$"
 COLDWAR_IRQ_puk_student_exchange_pending:0 "Deliver: $COLDWAR_IRQ_puk_student_exchange$"
 COLDWAR_IRQ_puk_payroll:0 "Security Payroll"
 COLDWAR_IRQ_puk_payroll_desc:0 "Security formations cannot become a regular public service while their personnel remain scattered across incompatible lists. A dependable payroll can reduce exceptional expenditure and clarify obligations, provided political offices surrender their control over undocumented appointments."
 COLDWAR_IRQ_puk_payroll_implemented:0 "Implemented: $COLDWAR_IRQ_puk_payroll$"
 COLDWAR_IRQ_puk_payroll_pending:0 "Deliver: $COLDWAR_IRQ_puk_payroll$"
 COLDWAR_IRQ_puk_federal_mandate:0 "A Federal Mandate"
 COLDWAR_IRQ_puk_federal_mandate_desc:0 "The PUK's governing mandate must be carried into workplaces and civilian services. A more practiced productive administration would give its federal programme substance, while committing it to social provision beyond the movement's established supporters."
 COLDWAR_IRQ_puk_federal_mandate_implemented:0 "Implemented: $COLDWAR_IRQ_puk_federal_mandate$"
 COLDWAR_IRQ_puk_federal_mandate_pending:0 "Deliver: $COLDWAR_IRQ_puk_federal_mandate$"
 COLDWAR_IRQ_dawa_civil_government:0 "Dawa in Government"
 COLDWAR_IRQ_dawa_civil_government_desc:0 "Dawa's social networks can carry a message farther than they can administer a ministry. A civilian government must give those networks dependable public offices, so that political support becomes useful service rather than another channel of personal influence."
 COLDWAR_IRQ_dawa_civil_government_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_civil_government$"
 COLDWAR_IRQ_dawa_civil_government_pending:0 "Deliver: $COLDWAR_IRQ_dawa_civil_government$"
 COLDWAR_IRQ_dawa_constitutional:0 "An Islamic Cabinet"
 COLDWAR_IRQ_dawa_constitutional_desc:0 "An Islamic cabinet can work through a constitutional division of public responsibilities. Better medical and educational administration would give that choice practical value, while requiring the party to accept limits on decisions it might otherwise take alone."
 COLDWAR_IRQ_dawa_constitutional_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_constitutional$"
 COLDWAR_IRQ_dawa_constitutional_pending:0 "Deliver: $COLDWAR_IRQ_dawa_constitutional$"
 COLDWAR_IRQ_dawa_directorial:0 "Party-Directed Rule"
 COLDWAR_IRQ_dawa_directorial_desc:0 "Party-directed rule would concentrate policy in an executive able to mobilize its organizations quickly. That authority offers a clear center of decision, but sustaining exceptional security and political supervision will place demands on the public budget."
 COLDWAR_IRQ_dawa_directorial_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_directorial$"
 COLDWAR_IRQ_dawa_directorial_pending:0 "Deliver: $COLDWAR_IRQ_dawa_directorial$"
 COLDWAR_IRQ_dawa_legal_review:0 "Religious Legal Review"
 COLDWAR_IRQ_dawa_legal_review_desc:0 "Religious legal arguments must be translated into procedures that Iraqi public offices can apply consistently. Clearer accounts and contracts would make government more dependable, while requiring professional administrators rather than another layer of informal approvals."
 COLDWAR_IRQ_dawa_legal_review_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_legal_review$"
 COLDWAR_IRQ_dawa_legal_review_pending:0 "Deliver: $COLDWAR_IRQ_dawa_legal_review$"
 COLDWAR_IRQ_dawa_party_service:0 "Party Service Network"
 COLDWAR_IRQ_dawa_party_service_desc:0 "The party's service network must be able to maintain care after a local organizer moves on. Connecting it to competent public offices will widen its reach, although the treasury will then inherit obligations once carried through personal or charitable arrangements."
 COLDWAR_IRQ_dawa_party_service_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_party_service$"
 COLDWAR_IRQ_dawa_party_service_pending:0 "Deliver: $COLDWAR_IRQ_dawa_party_service$"
 COLDWAR_IRQ_dawa_sadr_thought:0 "The Thought of al-Sadr"
 COLDWAR_IRQ_dawa_sadr_thought_desc:0 "Al-Sadr's intellectual influence raises questions about the relationship between faith, economic life and public authority. Studying those questions can strengthen the party's educational foundations without confusing spiritual standing with responsibility for the daily work of government."
 COLDWAR_IRQ_dawa_sadr_thought_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_sadr_thought$"
 COLDWAR_IRQ_dawa_sadr_thought_pending:0 "Deliver: $COLDWAR_IRQ_dawa_sadr_thought$"
 COLDWAR_IRQ_dawa_social_justice:0 "Islamic Social Justice"
 COLDWAR_IRQ_dawa_social_justice_desc:0 "An Islamic programme of social justice will be judged by the pressures facing Iraqi households. Better care and relief from immediate consumption burdens can support that commitment, but provision must remain dependable when donations or political enthusiasm decline."
 COLDWAR_IRQ_dawa_social_justice_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_social_justice$"
 COLDWAR_IRQ_dawa_social_justice_pending:0 "Deliver: $COLDWAR_IRQ_dawa_social_justice$"
 COLDWAR_IRQ_dawa_small_enterprise:0 "Enterprise and Waqf"
 COLDWAR_IRQ_dawa_small_enterprise_desc:0 "Workshops, commercial offices and endowments can support an economy beyond the ministries' direct control. Encouraging them would broaden civilian production, while requiring the government to accept the exemptions and concessions through which their cooperation is secured."
 COLDWAR_IRQ_dawa_small_enterprise_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_small_enterprise$"
 COLDWAR_IRQ_dawa_small_enterprise_pending:0 "Deliver: $COLDWAR_IRQ_dawa_small_enterprise$"
 COLDWAR_IRQ_dawa_social_accounts:0 "Audited Welfare Funds"
 COLDWAR_IRQ_dawa_social_accounts_desc:0 "Welfare funds should be judged by the care they provide rather than the standing of the people who administer them. Regular accounts can reduce waste and make provision more dependable, although inspection and supervision require a public service of their own."
 COLDWAR_IRQ_dawa_social_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_social_accounts$"
 COLDWAR_IRQ_dawa_social_accounts_pending:0 "Deliver: $COLDWAR_IRQ_dawa_social_accounts$"
 COLDWAR_IRQ_dawa_endowment_accounts:0 "Endowment Accounts"
 COLDWAR_IRQ_dawa_endowment_accounts_desc:0 "Endowments carry obligations to beneficiaries that cannot be understood through informal promises alone. Recorded income and educational responsibilities will make them more useful to the public, while the state must recognize the exemptions that distinguish them from ordinary enterprises."
 COLDWAR_IRQ_dawa_endowment_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_endowment_accounts$"
 COLDWAR_IRQ_dawa_endowment_accounts_pending:0 "Deliver: $COLDWAR_IRQ_dawa_endowment_accounts$"
 COLDWAR_IRQ_dawa_citizenship:0 "Equal Citizenship"
 COLDWAR_IRQ_dawa_citizenship_desc:0 "A government seeking an Islamic mandate must still administer the rights of all Iraqi citizens. Regular public security and institutions resistant to outside pressure can support that responsibility without making access to the state depend on religious affiliation."
 COLDWAR_IRQ_dawa_citizenship_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_citizenship$"
 COLDWAR_IRQ_dawa_citizenship_pending:0 "Deliver: $COLDWAR_IRQ_dawa_citizenship$"
 COLDWAR_IRQ_dawa_najaf_schools:0 "Najaf Technical Skills"
 COLDWAR_IRQ_dawa_najaf_schools_desc:0 "Najaf's educational life can support practical skills as well as religious study. Technical instruction connected with construction and public works would give students a wider role in Iraq's development, provided the government funds teachers and useful facilities."
 COLDWAR_IRQ_dawa_najaf_schools_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_najaf_schools$"
 COLDWAR_IRQ_dawa_najaf_schools_pending:0 "Deliver: $COLDWAR_IRQ_dawa_najaf_schools$"
 COLDWAR_IRQ_dawa_independent_iraq:0 "An Iraqi Programme"
 COLDWAR_IRQ_dawa_independent_iraq_desc:0 "Dawa must show that a religious political programme can remain an Iraqi one. A wider range of technical suppliers and institutions able to resist outside interference will support that independence without requiring Baghdad to deny every useful relationship with Iran."
 COLDWAR_IRQ_dawa_independent_iraq_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_independent_iraq$"
 COLDWAR_IRQ_dawa_independent_iraq_pending:0 "Deliver: $COLDWAR_IRQ_dawa_independent_iraq$"
 COLDWAR_IRQ_dawa_trade_unions:0 "Labour Associations"
 COLDWAR_IRQ_dawa_trade_unions_desc:0 "Workers' associations need a recognized place in settling conditions inside Iraqi plants. Their involvement can improve safety and production cooperation, while limiting the output that managers might otherwise demand without negotiation."
 COLDWAR_IRQ_dawa_trade_unions_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_trade_unions$"
 COLDWAR_IRQ_dawa_trade_unions_pending:0 "Deliver: $COLDWAR_IRQ_dawa_trade_unions$"
 COLDWAR_IRQ_dawa_literacy:0 "Community Literacy"
 COLDWAR_IRQ_dawa_literacy_desc:0 "Community instruction can reach families poorly served by distant public institutions. The government should give that work dependable teaching and administration, so that wider literacy becomes a lasting public achievement rather than an occasional charitable campaign."
 COLDWAR_IRQ_dawa_literacy_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_literacy$"
 COLDWAR_IRQ_dawa_literacy_pending:0 "Deliver: $COLDWAR_IRQ_dawa_literacy$"
 COLDWAR_IRQ_dawa_neighbour_talks:0 "Sovereign Diplomacy"
 COLDWAR_IRQ_dawa_neighbour_talks_desc:0 "Relations with Iran should be conducted through responsibilities both governments understand. Preparing Iraqi border and commercial services will make negotiation more useful, while leaving Tehran to decide whether it will accept the non-interference terms Baghdad proposes."
 COLDWAR_IRQ_dawa_neighbour_talks_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_neighbour_talks$"
 COLDWAR_IRQ_dawa_neighbour_talks_pending:0 "Deliver: $COLDWAR_IRQ_dawa_neighbour_talks$"
 COLDWAR_IRQ_dawa_medical_network:0 "Community Medicine"
 COLDWAR_IRQ_dawa_medical_network_desc:0 "Community medicine can connect local knowledge with a more dependable public health service. Better organized care will support families and reduce avoidable burdens, but the network must be maintained through public obligations rather than expected to survive on personal devotion alone."
 COLDWAR_IRQ_dawa_medical_network_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_medical_network$"
 COLDWAR_IRQ_dawa_medical_network_pending:0 "Deliver: $COLDWAR_IRQ_dawa_medical_network$"
 COLDWAR_IRQ_dawa_government_review:0 "The Islamic Cabinet"
 COLDWAR_IRQ_dawa_government_review_desc:0 "The Islamic cabinet must demonstrate that a religious mandate can sustain competent administration. Education and a stronger civilian productive base will give it the means to govern, while binding the state to the social commitments through which it has sought support."
 COLDWAR_IRQ_dawa_government_review_implemented:0 "Implemented: $COLDWAR_IRQ_dawa_government_review$"
 COLDWAR_IRQ_dawa_government_review_pending:0 "Deliver: $COLDWAR_IRQ_dawa_government_review$"
 COLDWAR_IRQ_sciri_exile_council:0 "The Exile Council"
 COLDWAR_IRQ_sciri_exile_council_desc:0 "The experience of exile brings political connections and knowledge of institutions outside Iraq. A council seeking to govern at home must turn that experience into Iraqi public service, rather than assume that relationships formed abroad confer an unquestioned national mandate."
 COLDWAR_IRQ_sciri_exile_council_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_exile_council$"
 COLDWAR_IRQ_sciri_exile_council_pending:0 "Deliver: $COLDWAR_IRQ_sciri_exile_council$"
 COLDWAR_IRQ_sciri_iraqi_charter:0 "Constitutional Charter"
 COLDWAR_IRQ_sciri_iraqi_charter_desc:0 "An Iraqi charter should define how a government formed around religious opposition will exercise public authority. Representative offices and dependable contracts can give that settlement substance, while requiring the leadership to share responsibility beyond its own executive circle."
 COLDWAR_IRQ_sciri_iraqi_charter_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_iraqi_charter$"
 COLDWAR_IRQ_sciri_iraqi_charter_pending:0 "Deliver: $COLDWAR_IRQ_sciri_iraqi_charter$"
 COLDWAR_IRQ_sciri_clerical_executive:0 "A Clerical Executive"
 COLDWAR_IRQ_sciri_clerical_executive_desc:0 "A clerical executive would give the movement a concentrated center of political and military decision. It promises a clearer direction, but the security establishment needed to sustain that authority will carry costs of its own."
 COLDWAR_IRQ_sciri_clerical_executive_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_clerical_executive$"
 COLDWAR_IRQ_sciri_clerical_executive_pending:0 "Deliver: $COLDWAR_IRQ_sciri_clerical_executive$"
 COLDWAR_IRQ_sciri_representative_cabinet:0 "Representative Cabinet"
 COLDWAR_IRQ_sciri_representative_cabinet_desc:0 "A representative cabinet needs ministers who can collect revenue and administer instruction across Iraq. Building that competence will broaden the movement's governing base, while making it responsible for a public administration larger than its original networks."
 COLDWAR_IRQ_sciri_representative_cabinet_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_representative_cabinet$"
 COLDWAR_IRQ_sciri_representative_cabinet_pending:0 "Deliver: $COLDWAR_IRQ_sciri_representative_cabinet$"
 COLDWAR_IRQ_sciri_revolutionary_courts:0 "Revolutionary Courts"
 COLDWAR_IRQ_sciri_revolutionary_courts_desc:0 "Courts established under revolutionary authority can become instruments through which the executive secures appointments and enforces its political direction. That choice may strengthen the governing circle, but it also deepens the burden of exceptional policing and the distrust of those subject to it."
 COLDWAR_IRQ_sciri_revolutionary_courts_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_revolutionary_courts$"
 COLDWAR_IRQ_sciri_revolutionary_courts_pending:0 "Deliver: $COLDWAR_IRQ_sciri_revolutionary_courts$"
 COLDWAR_IRQ_sciri_returnees:0 "The Return from Exile"
 COLDWAR_IRQ_sciri_returnees_desc:0 "Returning families and political organizers bring experience that the new administration cannot afford to waste. Their place in public institutions should be defined through useful civilian work, while the government prepares the services needed to support their return."
 COLDWAR_IRQ_sciri_returnees_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_returnees$"
 COLDWAR_IRQ_sciri_returnees_pending:0 "Deliver: $COLDWAR_IRQ_sciri_returnees$"
 COLDWAR_IRQ_sciri_independent_relations:0 "Relations with Iran"
 COLDWAR_IRQ_sciri_independent_relations_desc:0 "A government in Baghdad must answer for its own decisions even where its leaders once relied on Iranian support. More resilient institutions and diversified public contracts can widen its room to act, without pretending that existing obligations have simply disappeared."
 COLDWAR_IRQ_sciri_independent_relations_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_independent_relations$"
 COLDWAR_IRQ_sciri_independent_relations_pending:0 "Deliver: $COLDWAR_IRQ_sciri_independent_relations$"
 COLDWAR_IRQ_sciri_patron_compact:0 "Patronage Compact"
 COLDWAR_IRQ_sciri_patron_compact_desc:0 "Closer alignment with a patron can make technical cooperation and political support easier to organize. Iraq must prepare the services needed to use any assistance it receives, while recognizing the influence that dependence can give the government supplying it."
 COLDWAR_IRQ_sciri_patron_compact_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_patron_compact$"
 COLDWAR_IRQ_sciri_patron_compact_pending:0 "Deliver: $COLDWAR_IRQ_sciri_patron_compact$"
 COLDWAR_IRQ_sciri_border_agreement:0 "Non-Interference"
 COLDWAR_IRQ_sciri_border_agreement_desc:0 "Border administration should reduce the uncertainties that allow local incidents to become national crises. Iraq can prepare more regular supplies and public security arrangements, while any lasting agreement with Iran will still require Tehran's acceptance."
 COLDWAR_IRQ_sciri_border_agreement_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_border_agreement$"
 COLDWAR_IRQ_sciri_border_agreement_pending:0 "Deliver: $COLDWAR_IRQ_sciri_border_agreement$"
 COLDWAR_IRQ_sciri_aid_terms:0 "Publish the Aid Terms"
 COLDWAR_IRQ_sciri_aid_terms_desc:0 "Assistance offered through personal channels can leave the treasury uncertain about what it owes and what it should receive. Published accounts and clear project terms will make Iraqi reconstruction more dependable, even where a prospective donor chooses not to participate."
 COLDWAR_IRQ_sciri_aid_terms_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_aid_terms$"
 COLDWAR_IRQ_sciri_aid_terms_pending:0 "Deliver: $COLDWAR_IRQ_sciri_aid_terms$"
 COLDWAR_IRQ_sciri_security_state:0 "Civilian Force Control"
 COLDWAR_IRQ_sciri_security_state_desc:0 "Armed authority cannot remain divided indefinitely between civilian ministries and formations sustained through political networks. A common command can improve coordination, but recognized personnel and their responsibilities must be carried on the public payroll."
 COLDWAR_IRQ_sciri_security_state_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_security_state$"
 COLDWAR_IRQ_sciri_security_state_pending:0 "Deliver: $COLDWAR_IRQ_sciri_security_state$"
 COLDWAR_IRQ_sciri_southern_reconstruction:0 "Southern Recovery"
 COLDWAR_IRQ_sciri_southern_reconstruction_desc:0 "Southern Iraq needs useful employment and functioning workshops as well as a new political leadership. A civilian plant around Basra can anchor recovery, while better repair services protect the work already invested in the region."
 COLDWAR_IRQ_sciri_southern_reconstruction_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_southern_reconstruction$"
 COLDWAR_IRQ_sciri_southern_reconstruction_pending:0 "Deliver: $COLDWAR_IRQ_sciri_southern_reconstruction$"
 COLDWAR_IRQ_sciri_religious_education:0 "Religion and Skills"
 COLDWAR_IRQ_sciri_religious_education_desc:0 "Religious education need not leave students without the technical knowledge public institutions require. Connecting instruction with industrial skills can widen their place in Iraqi society, provided the programme offers professional teaching rather than political approval alone."
 COLDWAR_IRQ_sciri_religious_education_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_religious_education$"
 COLDWAR_IRQ_sciri_religious_education_pending:0 "Deliver: $COLDWAR_IRQ_sciri_religious_education$"
 COLDWAR_IRQ_sciri_minority_charter:0 "Minority Rights Charter"
 COLDWAR_IRQ_sciri_minority_charter_desc:0 "The movement must explain how citizens outside its principal constituency will be treated by the state. Dependable guarantees can reduce exceptional policing and outside political leverage, while placing limits on officials who would prefer to govern through communal privilege."
 COLDWAR_IRQ_sciri_minority_charter_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_minority_charter$"
 COLDWAR_IRQ_sciri_minority_charter_pending:0 "Deliver: $COLDWAR_IRQ_sciri_minority_charter$"
 COLDWAR_IRQ_sciri_water_services:0 "Southern Water"
 COLDWAR_IRQ_sciri_water_services_desc:0 "Reliable water services are a foundation of public health and productive life in the south. Improving the infrastructure through which they are administered will support recovery, but political sponsorship cannot replace the practical work of maintaining those services."
 COLDWAR_IRQ_sciri_water_services_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_water_services$"
 COLDWAR_IRQ_sciri_water_services_pending:0 "Deliver: $COLDWAR_IRQ_sciri_water_services$"
 COLDWAR_IRQ_sciri_school_access:0 "Equal School Access"
 COLDWAR_IRQ_sciri_school_access_desc:0 "Schools must be open to children whose families cannot secure a place through personal or political connections. Wider access will strengthen literacy, while requiring the government to supply teachers and materials after the initial commitment has been announced."
 COLDWAR_IRQ_sciri_school_access_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_school_access$"
 COLDWAR_IRQ_sciri_school_access_pending:0 "Deliver: $COLDWAR_IRQ_sciri_school_access$"
 COLDWAR_IRQ_sciri_civil_review:0 "Civilian Review"
 COLDWAR_IRQ_sciri_civil_review_desc:0 "Civilian ministers need the authority to examine the personnel and obligations of the security establishment. A regular review can reduce exceptional expenditure, while forcing the leadership to explain appointments that have previously rested on political standing alone."
 COLDWAR_IRQ_sciri_civil_review_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_civil_review$"
 COLDWAR_IRQ_sciri_civil_review_pending:0 "Deliver: $COLDWAR_IRQ_sciri_civil_review$"
 COLDWAR_IRQ_sciri_iraqi_mandate:0 "Governing Mandate"
 COLDWAR_IRQ_sciri_iraqi_mandate_desc:0 "A governing mandate must be carried into a common command and a practical reconstruction programme. Those institutions can make the state more coherent, but their personnel and continuing responsibilities must remain visible in the public budget."
 COLDWAR_IRQ_sciri_iraqi_mandate_implemented:0 "Implemented: $COLDWAR_IRQ_sciri_iraqi_mandate$"
 COLDWAR_IRQ_sciri_iraqi_mandate_pending:0 "Deliver: $COLDWAR_IRQ_sciri_iraqi_mandate$"
 COLDWAR_IRQ_iip_return:0 "The IIP Returns"
 COLDWAR_IRQ_iip_return_desc:0 "The Iraqi Islamic Party must rebuild a public organization capable of more than maintaining its own political circles. Competent civilian offices will give its leadership a governing base without assuming that an old title alone settles who should exercise authority."
 COLDWAR_IRQ_iip_return_implemented:0 "Implemented: $COLDWAR_IRQ_iip_return$"
 COLDWAR_IRQ_iip_return_pending:0 "Deliver: $COLDWAR_IRQ_iip_return$"
 COLDWAR_IRQ_iip_parliamentary:0 "Parliamentary Islamism"
 COLDWAR_IRQ_iip_parliamentary_desc:0 "Parliamentary Islamism would place the party's programme within institutions that can question ministers and supervise public contracts. That settlement can make administration more predictable, while limiting the leadership's freedom to decide policy through its own organization alone."
 COLDWAR_IRQ_iip_parliamentary_implemented:0 "Implemented: $COLDWAR_IRQ_iip_parliamentary$"
 COLDWAR_IRQ_iip_parliamentary_pending:0 "Deliver: $COLDWAR_IRQ_iip_parliamentary$"
 COLDWAR_IRQ_iip_directorial:0 "Party-Directed State"
 COLDWAR_IRQ_iip_directorial_desc:0 "A party-directed state would concentrate political initiative and mobilization in a stronger executive. It offers a clear center of action, but sustaining the security arrangements around that authority will require continuing public expenditure."
 COLDWAR_IRQ_iip_directorial_implemented:0 "Implemented: $COLDWAR_IRQ_iip_directorial$"
 COLDWAR_IRQ_iip_directorial_pending:0 "Deliver: $COLDWAR_IRQ_iip_directorial$"
 COLDWAR_IRQ_iip_law:0 "Religious Law"
 COLDWAR_IRQ_iip_law_desc:0 "Religious legal commitments must be made usable by businesses and public offices that need consistent procedures. Clearer corporate accounts and project terms can support that work without requiring every commercial question to pass through an informal political patron."
 COLDWAR_IRQ_iip_law_implemented:0 "Implemented: $COLDWAR_IRQ_iip_law$"
 COLDWAR_IRQ_iip_law_pending:0 "Deliver: $COLDWAR_IRQ_iip_law$"
 COLDWAR_IRQ_iip_associations:0 "Association Network"
 COLDWAR_IRQ_iip_associations_desc:0 "Professional and charitable associations connect the party with people beyond its formal membership. Supporting useful instruction and recorded service income can make those networks productive, while creating public obligations that cannot be met through voluntary effort alone."
 COLDWAR_IRQ_iip_associations_implemented:0 "Implemented: $COLDWAR_IRQ_iip_associations$"
 COLDWAR_IRQ_iip_associations_pending:0 "Deliver: $COLDWAR_IRQ_iip_associations$"
 COLDWAR_IRQ_iip_civil_service:0 "Conservative Cabinet"
 COLDWAR_IRQ_iip_civil_service_desc:0 "A conservative cabinet must still provide officials able to carry out ordinary public work. Professional service can make administration more dependable, while reducing the leadership's freedom to distribute posts according to political convenience."
 COLDWAR_IRQ_iip_civil_service_implemented:0 "Implemented: $COLDWAR_IRQ_iip_civil_service$"
 COLDWAR_IRQ_iip_civil_service_pending:0 "Deliver: $COLDWAR_IRQ_iip_civil_service$"
 COLDWAR_IRQ_iip_social_market:0 "Islamic Social Market"
 COLDWAR_IRQ_iip_social_market_desc:0 "A social market would give private workshops and civilian producers more room to expand. The government can support that growth through clearer conditions for construction, while accepting the tax concessions through which cooperation is secured."
 COLDWAR_IRQ_iip_social_market_implemented:0 "Implemented: $COLDWAR_IRQ_iip_social_market$"
 COLDWAR_IRQ_iip_social_market_pending:0 "Deliver: $COLDWAR_IRQ_iip_social_market$"
 COLDWAR_IRQ_iip_welfare:0 "Conservative Welfare"
 COLDWAR_IRQ_iip_welfare_desc:0 "A welfare programme needs organizations able to provide care without consuming their resources in duplicated administration. More dependable delivery can ease the household burden, but it must be supported by public instruction and institutions that survive the enthusiasm of an individual organizer."
 COLDWAR_IRQ_iip_welfare_implemented:0 "Implemented: $COLDWAR_IRQ_iip_welfare$"
 COLDWAR_IRQ_iip_welfare_pending:0 "Deliver: $COLDWAR_IRQ_iip_welfare$"
 COLDWAR_IRQ_iip_business_law:0 "Small Business Law"
 COLDWAR_IRQ_iip_business_law_desc:0 "Small businesses need confidence that permissions and contracts will remain usable after a change of minister. Clearer rules can support civilian construction and investment, although the government will have to carry the revenue cost of the concessions it offers."
 COLDWAR_IRQ_iip_business_law_implemented:0 "Implemented: $COLDWAR_IRQ_iip_business_law$"
 COLDWAR_IRQ_iip_business_law_pending:0 "Deliver: $COLDWAR_IRQ_iip_business_law$"
 COLDWAR_IRQ_iip_charity_accounts:0 "Charity Accounts"
 COLDWAR_IRQ_iip_charity_accounts_desc:0 "Charitable funds should be able to show how their income becomes useful care. Recorded obligations and regular supervision can reduce waste in medical and welfare provision, while requiring an administration that beneficiaries can hold responsible."
 COLDWAR_IRQ_iip_charity_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_iip_charity_accounts$"
 COLDWAR_IRQ_iip_charity_accounts_pending:0 "Deliver: $COLDWAR_IRQ_iip_charity_accounts$"
 COLDWAR_IRQ_iip_national_compact:0 "Citizenship Compact"
 COLDWAR_IRQ_iip_national_compact_desc:0 "A governing party cannot reserve dependable public authority for its own supporters. A citizenship compact can make security more regular and resist outside political leverage, while restricting the informal privileges through which ministers might otherwise secure loyalty."
 COLDWAR_IRQ_iip_national_compact_implemented:0 "Implemented: $COLDWAR_IRQ_iip_national_compact$"
 COLDWAR_IRQ_iip_national_compact_pending:0 "Deliver: $COLDWAR_IRQ_iip_national_compact$"
 COLDWAR_IRQ_iip_education:0 "Community Education"
 COLDWAR_IRQ_iip_education_desc:0 "Community education can reach families that existing institutions have served unevenly. Connecting local instruction with professional teachers will widen literacy, while requiring the party to treat learning as a continuing public responsibility rather than a political meeting."
 COLDWAR_IRQ_iip_education_implemented:0 "Implemented: $COLDWAR_IRQ_iip_education$"
 COLDWAR_IRQ_iip_education_pending:0 "Deliver: $COLDWAR_IRQ_iip_education$"
 COLDWAR_IRQ_iip_foreign_policy:0 "IIP Foreign Policy"
 COLDWAR_IRQ_iip_foreign_policy_desc:0 "The party's commercial and social associations can support a civilian foreign policy with practical economic aims. Better project terms and more practiced diplomacy will give Baghdad options without making its institutions dependent on a single external patron."
 COLDWAR_IRQ_iip_foreign_policy_implemented:0 "Implemented: $COLDWAR_IRQ_iip_foreign_policy$"
 COLDWAR_IRQ_iip_foreign_policy_pending:0 "Deliver: $COLDWAR_IRQ_iip_foreign_policy$"
 COLDWAR_IRQ_iip_labour_compromise:0 "A Labour Compromise"
 COLDWAR_IRQ_iip_labour_compromise_desc:0 "Employers and workers need arrangements that preserve useful skills when production changes. A negotiated compromise can reduce disruption and medical burdens, while restraining immediate demands that would otherwise be imposed without consultation."
 COLDWAR_IRQ_iip_labour_compromise_implemented:0 "Implemented: $COLDWAR_IRQ_iip_labour_compromise$"
 COLDWAR_IRQ_iip_labour_compromise_pending:0 "Deliver: $COLDWAR_IRQ_iip_labour_compromise$"
 COLDWAR_IRQ_iip_public_service:0 "Service Examinations"
 COLDWAR_IRQ_iip_public_service_desc:0 "Public examinations can give capable Iraqis a route into administration beyond personal connections. Better records and civilian expertise will strengthen collection and services, provided political leaders accept the limits that professional appointments place on patronage."
 COLDWAR_IRQ_iip_public_service_implemented:0 "Implemented: $COLDWAR_IRQ_iip_public_service$"
 COLDWAR_IRQ_iip_public_service_pending:0 "Deliver: $COLDWAR_IRQ_iip_public_service$"
 COLDWAR_IRQ_iip_arab_offer:0 "Arab Commercial Delegations"
 COLDWAR_IRQ_iip_arab_offer_desc:0 "Commercial delegations can connect Iraqi firms and public agencies with the markets and technical expertise of neighbouring Arab countries. Officials trained in investment procedures, procurement and contract law will help Iraqi institutions make better use of those contacts. The government's credibility will rest on proposals that can withstand scrutiny from merchants and parliamentary representatives alike."
 COLDWAR_IRQ_iip_arab_offer_implemented:0 "Implemented: $COLDWAR_IRQ_iip_arab_offer$"
 COLDWAR_IRQ_iip_arab_offer_pending:0 "Deliver: $COLDWAR_IRQ_iip_arab_offer$"
 COLDWAR_IRQ_iip_medical_welfare:0 "Community Welfare"
 COLDWAR_IRQ_iip_medical_welfare_desc:0 "Community welfare must support families through ordinary illness and the demands of raising children. More dependable care can strengthen public health and family life, but it requires obligations that neither occasional donations nor political declarations can reliably replace."
 COLDWAR_IRQ_iip_medical_welfare_implemented:0 "Implemented: $COLDWAR_IRQ_iip_medical_welfare$"
 COLDWAR_IRQ_iip_medical_welfare_pending:0 "Deliver: $COLDWAR_IRQ_iip_medical_welfare$"
 COLDWAR_IRQ_iip_government_mandate:0 "Renew the Mandate"
 COLDWAR_IRQ_iip_government_mandate_desc:0 "The IIP must turn its social and commercial associations into a durable programme of government. A stronger civilian economy and dependable service income will support that mandate, while the treasury continues to carry the concessions made to secure participation."
 COLDWAR_IRQ_iip_government_mandate_implemented:0 "Implemented: $COLDWAR_IRQ_iip_government_mandate$"
 COLDWAR_IRQ_iip_government_mandate_pending:0 "Deliver: $COLDWAR_IRQ_iip_government_mandate$"
 COLDWAR_IRQ_oil_accounts:0 "Concession Accounts"
 COLDWAR_IRQ_oil_accounts_desc:0 "Oil receipts must reach the treasury rather than disappear between the company, the ministry and the party. A reliable account of sales is the first step towards control of the national income."
 COLDWAR_IRQ_oil_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_oil_accounts$"
 COLDWAR_IRQ_oil_accounts_pending:0 "Deliver: $COLDWAR_IRQ_oil_accounts$"
 COLDWAR_IRQ_oil_nationalize:0 "Nationalize the IPC"
 COLDWAR_IRQ_oil_nationalize_desc:0 "Nationalisation will place the industry under Iraqi authority. Taking ownership also means taking responsibility for marketing, management and the disruption of established commercial relationships."
 COLDWAR_IRQ_oil_nationalize_implemented:0 "Implemented: $COLDWAR_IRQ_oil_nationalize$"
 COLDWAR_IRQ_oil_nationalize_pending:0 "Deliver: $COLDWAR_IRQ_oil_nationalize$"
 COLDWAR_IRQ_oil_renegotiate:0 "New Concession Terms"
 COLDWAR_IRQ_oil_renegotiate_desc:0 "A revised concession can secure better terms while retaining access to established markets and expertise. Iraq will prepare the terminals and connecting works that any workable agreement will require."
 COLDWAR_IRQ_oil_renegotiate_implemented:0 "Implemented: $COLDWAR_IRQ_oil_renegotiate$"
 COLDWAR_IRQ_oil_renegotiate_pending:0 "Deliver: $COLDWAR_IRQ_oil_renegotiate$"
 COLDWAR_IRQ_oil_state_company:0 "National Oil Service"
 COLDWAR_IRQ_oil_state_company_desc:0 "An Iraqi oil company must be able to operate fields and negotiate its own sales. Building that organisation will reduce the technical burden left by the old concession system."
 COLDWAR_IRQ_oil_state_company_implemented:0 "Implemented: $COLDWAR_IRQ_oil_state_company$"
 COLDWAR_IRQ_oil_state_company_pending:0 "Deliver: $COLDWAR_IRQ_oil_state_company$"
 COLDWAR_IRQ_oil_concession_delivery:0 "Revised Oil Contract"
 COLDWAR_IRQ_oil_concession_delivery_desc:0 "The revised concession will be judged by the facilities and technical skills it delivers. Iraq gains an operating export arrangement while an outside partner retains an agreed stake in the industry."
 COLDWAR_IRQ_oil_concession_delivery_implemented:0 "Implemented: $COLDWAR_IRQ_oil_concession_delivery$"
 COLDWAR_IRQ_oil_concession_delivery_pending:0 "Deliver: $COLDWAR_IRQ_oil_concession_delivery$"
 COLDWAR_IRQ_oil_technical_training:0 "Train Iraqi Oil Engineers"
 COLDWAR_IRQ_oil_technical_training_desc:0 "Wells, pumping stations and maintenance shops need Iraqi engineers and skilled crews. Technical training will make the industry less dependent on emergency contracts when foreign specialists leave."
 COLDWAR_IRQ_oil_technical_training_implemented:0 "Implemented: $COLDWAR_IRQ_oil_technical_training$"
 COLDWAR_IRQ_oil_technical_training_pending:0 "Deliver: $COLDWAR_IRQ_oil_technical_training$"
 COLDWAR_IRQ_oil_revenue_state:0 "An Oil Revenue State"
 COLDWAR_IRQ_oil_revenue_state_desc:0 "Oil can finance the state on a scale that ordinary taxation cannot yet match. Expanding export facilities offers immediate revenue, at the price of deepening the treasury's dependence on it."
 COLDWAR_IRQ_oil_revenue_state_implemented:0 "Implemented: $COLDWAR_IRQ_oil_revenue_state$"
 COLDWAR_IRQ_oil_revenue_state_pending:0 "Deliver: $COLDWAR_IRQ_oil_revenue_state$"
 COLDWAR_IRQ_oil_diversification:0 "Beyond Oil"
 COLDWAR_IRQ_oil_diversification_desc:0 "Part of the oil income will be committed to an industrial base beyond the fields. The return will arrive more slowly, but Iraq will gain productive capacity that an oil-price fall cannot erase overnight."
 COLDWAR_IRQ_oil_diversification_implemented:0 "Implemented: $COLDWAR_IRQ_oil_diversification$"
 COLDWAR_IRQ_oil_diversification_pending:0 "Deliver: $COLDWAR_IRQ_oil_diversification$"
 COLDWAR_IRQ_oil_export_terminals:0 "Expand Export Handling"
 COLDWAR_IRQ_oil_export_terminals_desc:0 "Oil revenues depend on the ability to move exports through the south as well as on production in the fields. We will improve Basrah's transport infrastructure and the connections serving export handling. Better links will help turn petroleum output into a more dependable commercial flow."
 COLDWAR_IRQ_oil_industrial_fund:0 "Non-Oil Industry"
 COLDWAR_IRQ_oil_industrial_fund_desc:0 "Oil income can finance productive capacity that survives fluctuations in the petroleum market. We will support a new civilian industrial complex and give development outside the fields a firmer base. The country's underground wealth should leave something more durable than a succession of government expenditures."
 COLDWAR_IRQ_oil_revenue_ledger:0 "One Oil Revenue Ledger"
 COLDWAR_IRQ_oil_revenue_ledger_desc:0 "A common revenue ledger will expose overlapping allocations and promises made against the same oil receipts. The oil budget should support a state programme rather than several competing treasuries."
 COLDWAR_IRQ_oil_revenue_ledger_implemented:0 "Implemented: $COLDWAR_IRQ_oil_revenue_ledger$"
 COLDWAR_IRQ_oil_revenue_ledger_pending:0 "Deliver: $COLDWAR_IRQ_oil_revenue_ledger$"
 COLDWAR_IRQ_oil_kirkuk_survey:0 "Kirkuk Production"
 COLDWAR_IRQ_oil_kirkuk_survey_desc:0 "The northern fields still require careful surveys and investment in extraction. Iraqi crews will identify reserves that can be brought into practical production, rather than counting every underground deposit as available income."
 COLDWAR_IRQ_oil_kirkuk_survey_implemented:0 "Implemented: $COLDWAR_IRQ_oil_kirkuk_survey$"
 COLDWAR_IRQ_oil_kirkuk_survey_pending:0 "Deliver: $COLDWAR_IRQ_oil_kirkuk_survey$"
 COLDWAR_IRQ_oil_baiji:0 "Baiji Refining"
 COLDWAR_IRQ_oil_baiji_desc:0 "Baiji's technical workforce can support a wider refining and energy economy. Better maintenance and operating practice will reduce waste in the fuel-intensive installations that keep Iraqi industry running."
 COLDWAR_IRQ_oil_baiji_implemented:0 "Implemented: $COLDWAR_IRQ_oil_baiji$"
 COLDWAR_IRQ_oil_baiji_pending:0 "Deliver: $COLDWAR_IRQ_oil_baiji$"
 COLDWAR_IRQ_oil_reserve_policy:0 "Petroleum Reserves"
 COLDWAR_IRQ_oil_reserve_policy_desc:0 "The state cannot export every available barrel and still guarantee fuel in a crisis. A disciplined reserve policy trades some current sales for a more economical military fuel system."
 COLDWAR_IRQ_oil_reserve_policy_implemented:0 "Implemented: $COLDWAR_IRQ_oil_reserve_policy$"
 COLDWAR_IRQ_oil_reserve_policy_pending:0 "Deliver: $COLDWAR_IRQ_oil_reserve_policy$"
 COLDWAR_IRQ_oil_field_maintenance:0 "The Producing Fields"
 COLDWAR_IRQ_oil_field_maintenance_desc:0 "Dependable spare parts and field maintenance keep the oil economy in operation. Iraqi crews will gain the skills to maintain its machinery, while a nationalised company can finally overcome its remaining technical disadvantage."
 COLDWAR_IRQ_oil_field_maintenance_implemented:0 "Implemented: $COLDWAR_IRQ_oil_field_maintenance$"
 COLDWAR_IRQ_oil_field_maintenance_pending:0 "Deliver: $COLDWAR_IRQ_oil_field_maintenance$"
 COLDWAR_IRQ_oil_operators:0 "Refinery Operators"
 COLDWAR_IRQ_oil_operators_desc:0 "New installations are of limited use without operators who understand the machinery entrusted to them. We will expand practical instruction for refinery and maintenance personnel. A stronger technical workforce will help the industry absorb improved methods and make more effective use of its equipment."
 COLDWAR_IRQ_oil_contract_review:0 "Export Contract Review"
 COLDWAR_IRQ_oil_contract_review_desc:0 "Buyers and delivery schedules change even when ownership does not. A commercial review will improve Iraq's access to reliable purchasers without pretending that a new export contract transfers control of the industry."
 COLDWAR_IRQ_oil_contract_review_implemented:0 "Implemented: $COLDWAR_IRQ_oil_contract_review$"
 COLDWAR_IRQ_oil_contract_review_pending:0 "Deliver: $COLDWAR_IRQ_oil_contract_review$"
 COLDWAR_IRQ_oil_sovereignty:0 "Sovereign Accounts"
 COLDWAR_IRQ_oil_sovereignty_desc:0 "Sovereignty requires more than a flag over the company office. Iraq will be better placed to defend its commercial decisions once it can operate the industry and negotiate credible alternatives on its own."
 COLDWAR_IRQ_oil_sovereignty_implemented:0 "Implemented: $COLDWAR_IRQ_oil_sovereignty$"
 COLDWAR_IRQ_oil_sovereignty_pending:0 "Deliver: $COLDWAR_IRQ_oil_sovereignty$"
 COLDWAR_IRQ_industry_survey:0 "Industrial Capacity"
 COLDWAR_IRQ_industry_survey_desc:0 "Plans for industrial growth must reckon with the power, land and skilled labour actually available to Iraq. We will survey existing capacity and establish a more orderly programme of investment. The resulting commitments will need continued attention from officials who can distinguish a viable project from an impressive promise."
 COLDWAR_IRQ_industry_heavy:0 "Basic Industries First"
 COLDWAR_IRQ_industry_heavy_desc:0 "Basic industries will give Iraq a stronger foundation for long production runs and domestic military supply. The programme ties up resources that could otherwise satisfy immediate civilian demand."
 COLDWAR_IRQ_industry_heavy_implemented:0 "Implemented: $COLDWAR_IRQ_industry_heavy$"
 COLDWAR_IRQ_industry_heavy_pending:0 "Deliver: $COLDWAR_IRQ_industry_heavy$"
 COLDWAR_IRQ_industry_light:0 "Consumer Expansion"
 COLDWAR_IRQ_industry_light_desc:0 "Consumer manufacturing can expand the civilian economy more quickly than a prestige heavy-industrial complex. Its factories and skilled workers will support the next round of domestic construction."
 COLDWAR_IRQ_industry_light_implemented:0 "Implemented: $COLDWAR_IRQ_industry_light$"
 COLDWAR_IRQ_industry_light_pending:0 "Deliver: $COLDWAR_IRQ_industry_light$"
 COLDWAR_IRQ_industry_steel:0 "Industrial Workshops"
 COLDWAR_IRQ_industry_steel_desc:0 "Baghdad's industrial districts can support a wider network of workshops and civilian manufacturers. We will establish a new industrial complex to give that expansion a physical foundation. Productive investment in the capital must turn plans and imported machinery into regular work for Iraqi industry."
 COLDWAR_IRQ_industry_consumers:0 "Consumer Industry"
 COLDWAR_IRQ_industry_consumers_desc:0 "Provincial workshops cannot meet the growing demand for clothing, household goods and everyday supplies. A new industrial complex in Nineveh will give local manufacturers room to expand and reduce the concentration of production around Baghdad. Provincial development must become a practical part of our industrial policy."
 COLDWAR_IRQ_industry_power_grid:0 "Industrial Power Grid"
 COLDWAR_IRQ_industry_power_grid_desc:0 "New industrial capacity is useless without dependable connections. The Baghdad power and transport grid must be ready to serve factories rather than force them to operate as isolated projects."
 COLDWAR_IRQ_industry_power_grid_implemented:0 "Implemented: $COLDWAR_IRQ_industry_power_grid$"
 COLDWAR_IRQ_industry_power_grid_pending:0 "Deliver: $COLDWAR_IRQ_industry_power_grid$"
 COLDWAR_IRQ_industry_public_finance:0 "Public Finance"
 COLDWAR_IRQ_industry_public_finance_desc:0 "Publicly financed industry will rest on a reliable domestic revenue base. The treasury gains a firmer return, while civilian resources are committed to the state's investment programme."
 COLDWAR_IRQ_industry_public_finance_implemented:0 "Implemented: $COLDWAR_IRQ_industry_public_finance$"
 COLDWAR_IRQ_industry_public_finance_pending:0 "Deliver: $COLDWAR_IRQ_industry_public_finance$"
 COLDWAR_IRQ_industry_credit_finance:0 "Development Credit"
 COLDWAR_IRQ_industry_credit_finance_desc:0 "Credit can bring industrial projects into production before the treasury has accumulated their full cost. Faster construction comes with greater exposure to financing conditions."
 COLDWAR_IRQ_industry_credit_finance_implemented:0 "Implemented: $COLDWAR_IRQ_industry_credit_finance$"
 COLDWAR_IRQ_industry_credit_finance_pending:0 "Deliver: $COLDWAR_IRQ_industry_credit_finance$"
 COLDWAR_IRQ_industry_public_accounts:0 "Audit State Investment"
 COLDWAR_IRQ_industry_public_accounts_desc:0 "Public enterprises need operating accounts that distinguish a viable factory from a permanent subsidy. Reinvestment should reward production and maintenance rather than the influence of an appointed director."
 COLDWAR_IRQ_industry_public_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_industry_public_accounts$"
 COLDWAR_IRQ_industry_public_accounts_pending:0 "Deliver: $COLDWAR_IRQ_industry_public_accounts$"
 COLDWAR_IRQ_industry_debt_accounts:0 "Industrial Debt Service"
 COLDWAR_IRQ_industry_debt_accounts_desc:0 "Industrial creditors must be repaid from output rather than another unrecorded promise. Better debt management will reduce financing friction while factories learn to sustain their production runs."
 COLDWAR_IRQ_industry_debt_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_industry_debt_accounts$"
 COLDWAR_IRQ_industry_debt_accounts_pending:0 "Deliver: $COLDWAR_IRQ_industry_debt_accounts$"
 COLDWAR_IRQ_industry_maintenance:0 "Industrial Maintenance"
 COLDWAR_IRQ_industry_maintenance_desc:0 "Maintenance periods and common quality standards prevent new equipment from becoming unusable machinery. A small interruption of immediate military output is the price of more dependable production."
 COLDWAR_IRQ_industry_maintenance_implemented:0 "Implemented: $COLDWAR_IRQ_industry_maintenance$"
 COLDWAR_IRQ_industry_maintenance_pending:0 "Deliver: $COLDWAR_IRQ_industry_maintenance$"
 COLDWAR_IRQ_industry_power:0 "Thermal Power Project"
 COLDWAR_IRQ_industry_power_desc:0 "Basra needs generating capacity that can keep pace with industrial and urban demand. A new fossil-fuel plant will turn part of Iraq's energy endowment into usable electricity."
 COLDWAR_IRQ_industry_power_implemented:0 "Implemented: $COLDWAR_IRQ_industry_power$"
 COLDWAR_IRQ_industry_power_pending:0 "Deliver: $COLDWAR_IRQ_industry_power$"
 COLDWAR_IRQ_industry_machine_tools:0 "Machine-Tool Skills"
 COLDWAR_IRQ_industry_machine_tools_desc:0 "Machine tools and precision practice will determine whether Iraqi workshops can reproduce a design or merely assemble imported parts. Skilled tooling is an investment in the next generation of production."
 COLDWAR_IRQ_industry_machine_tools_implemented:0 "Implemented: $COLDWAR_IRQ_industry_machine_tools$"
 COLDWAR_IRQ_industry_machine_tools_pending:0 "Deliver: $COLDWAR_IRQ_industry_machine_tools$"
 COLDWAR_IRQ_industry_commercial_services:0 "Commercial Services"
 COLDWAR_IRQ_industry_commercial_services_desc:0 "Industry requires accountants, transport brokers and commercial offices as well as machinery. Developing Baghdad's service economy will support enterprises that must buy, sell and keep reliable records."
 COLDWAR_IRQ_industry_commercial_services_implemented:0 "Implemented: $COLDWAR_IRQ_industry_commercial_services$"
 COLDWAR_IRQ_industry_commercial_services_pending:0 "Deliver: $COLDWAR_IRQ_industry_commercial_services$"
 COLDWAR_IRQ_industry_grid_management:0 "Power Dispatch"
 COLDWAR_IRQ_industry_grid_management_desc:0 "A working power grid needs trained operators and a disciplined fuel schedule. Better management will make existing thermal generation less wasteful while construction expands around it."
 COLDWAR_IRQ_industry_grid_management_implemented:0 "Implemented: $COLDWAR_IRQ_industry_grid_management$"
 COLDWAR_IRQ_industry_grid_management_pending:0 "Deliver: $COLDWAR_IRQ_industry_grid_management$"
 COLDWAR_IRQ_industry_quality:0 "Quality Inspection"
 COLDWAR_IRQ_industry_quality_desc:0 "Factories under pressure to meet targets can produce goods that fail long before they should. We will introduce more systematic inspection and help managers correct faults in production. Better standards will take time and resources that cannot be devoted immediately to increasing output."
 COLDWAR_IRQ_industry_tax_service:0 "Tax Records"
 COLDWAR_IRQ_industry_tax_service_desc:0 "The commercial economy should contribute to the investment that makes it possible. A specialised tax service will collect a more reliable return from offices and business activity without taxing every sector by the same emergency measure."
 COLDWAR_IRQ_industry_tax_service_implemented:0 "Implemented: $COLDWAR_IRQ_industry_tax_service$"
 COLDWAR_IRQ_industry_tax_service_pending:0 "Deliver: $COLDWAR_IRQ_industry_tax_service$"
 COLDWAR_IRQ_industry_delivery_review:0 "Industrial Review"
 COLDWAR_IRQ_industry_delivery_review_desc:0 "The next round of investment should reflect what earlier projects have taught us. Ministers will review the balance between industrial priorities and redirect future commitments where necessary. A credible development programme must be willing to change course without abandoning the productive assets already built."
 COLDWAR_IRQ_agri_land_survey:0 "Survey the Land Reform"
 COLDWAR_IRQ_agri_land_survey_desc:0 "The land reform has left a patchwork of holdings, claims and unfinished obligations. A practical survey will connect future credit to Iraqi farms that can actually put it to work."
 COLDWAR_IRQ_agri_land_survey_implemented:0 "Implemented: $COLDWAR_IRQ_agri_land_survey$"
 COLDWAR_IRQ_agri_land_survey_pending:0 "Deliver: $COLDWAR_IRQ_agri_land_survey$"
 COLDWAR_IRQ_agri_cooperatives:0 "Farm Cooperatives"
 COLDWAR_IRQ_agri_cooperatives_desc:0 "Cooperatives can pool machinery, credit and marketing for farms too small to operate alone. A funded organisation can raise output, although its management will remain a real public expense."
 COLDWAR_IRQ_agri_cooperatives_implemented:0 "Implemented: $COLDWAR_IRQ_agri_cooperatives$"
 COLDWAR_IRQ_agri_cooperatives_pending:0 "Deliver: $COLDWAR_IRQ_agri_cooperatives$"
 COLDWAR_IRQ_agri_smallholders:0 "Support Smallholders"
 COLDWAR_IRQ_agri_smallholders_desc:0 "Smallholders need credit, predictable obligations and room to make their own production decisions. The state will support household farming rather than place every investment behind a cooperative manager."
 COLDWAR_IRQ_agri_smallholders_implemented:0 "Implemented: $COLDWAR_IRQ_agri_smallholders$"
 COLDWAR_IRQ_agri_smallholders_pending:0 "Deliver: $COLDWAR_IRQ_agri_smallholders$"
 COLDWAR_IRQ_agri_cooperative_credit:0 "Cooperative Equipment"
 COLDWAR_IRQ_agri_cooperative_credit_desc:0 "Cooperatives cannot fulfil their purpose if they exist without the machinery and advice needed in the fields. We will support equipment purchases and organise assistance around their members' requirements. Delivering these services will begin to close the gap between agrarian reform and everyday agricultural work."
 COLDWAR_IRQ_agri_smallholder_credit:0 "Rural Credit Guarantee"
 COLDWAR_IRQ_agri_smallholder_credit_desc:0 "A smallholder without access to credit remains dependent on poor tools and uncertain harvests. We will guarantee a more useful flow of finance to independent producers and help them improve their farms. The state must accept a financial sacrifice if land reform is to produce viable livelihoods."
 COLDWAR_IRQ_agri_water_accounts:0 "Two Rivers Accounts"
 COLDWAR_IRQ_agri_water_accounts_desc:0 "Water allocations must correspond to planted fields and working channels. Reliable records will reduce the waste caused by competing claims on the same irrigation supply."
 COLDWAR_IRQ_agri_water_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_agri_water_accounts$"
 COLDWAR_IRQ_agri_water_accounts_pending:0 "Deliver: $COLDWAR_IRQ_agri_water_accounts$"
 COLDWAR_IRQ_agri_large_irrigation:0 "Large Irrigation Works"
 COLDWAR_IRQ_agri_large_irrigation_desc:0 "Large irrigation works can serve districts beyond the reach of village improvements. They require a substantial public commitment and construction resources that cannot simultaneously be used for every urban project."
 COLDWAR_IRQ_agri_large_irrigation_implemented:0 "Implemented: $COLDWAR_IRQ_agri_large_irrigation$"
 COLDWAR_IRQ_agri_large_irrigation_pending:0 "Deliver: $COLDWAR_IRQ_agri_large_irrigation$"
 COLDWAR_IRQ_agri_local_irrigation:0 "Local Irrigation"
 COLDWAR_IRQ_agri_local_irrigation_desc:0 "Local channels and pumps can be repaired and extended without waiting for a single grand scheme. Their reach is smaller, but communities can bring useful improvements into operation sooner."
 COLDWAR_IRQ_agri_local_irrigation_implemented:0 "Implemented: $COLDWAR_IRQ_agri_local_irrigation$"
 COLDWAR_IRQ_agri_local_irrigation_pending:0 "Deliver: $COLDWAR_IRQ_agri_local_irrigation$"
 COLDWAR_IRQ_agri_wasit:0 "Fund Works in Wasit"
 COLDWAR_IRQ_agri_wasit_desc:0 "Wasit's cultivators need investment that reaches the productive land rather than ending in the offices of a ministry. We will develop an agricultural district and strengthen the foundation for local farming. The countryside must see tangible results from the government's promises of rural development."
 COLDWAR_IRQ_agri_dhiqar:0 "Fund Works in Dhi Qar"
 COLDWAR_IRQ_agri_dhiqar_desc:0 "Dhi Qar needs a rural investment programme that reaches actual farms. New agricultural capacity will give local works a productive purpose beyond the ministry's completion reports."
 COLDWAR_IRQ_agri_dhiqar_implemented:0 "Implemented: $COLDWAR_IRQ_agri_dhiqar$"
 COLDWAR_IRQ_agri_dhiqar_pending:0 "Deliver: $COLDWAR_IRQ_agri_dhiqar$"
 COLDWAR_IRQ_agri_extension:0 "Rural Extension Service"
 COLDWAR_IRQ_agri_extension_desc:0 "Agricultural extension workers can connect credit and irrigation with the skills needed to use them. The remaining rural bottleneck will shrink only when advice reaches the farm itself."
 COLDWAR_IRQ_agri_extension_implemented:0 "Implemented: $COLDWAR_IRQ_agri_extension$"
 COLDWAR_IRQ_agri_extension_pending:0 "Deliver: $COLDWAR_IRQ_agri_extension$"
 COLDWAR_IRQ_agri_grain_storage:0 "Grain and Rural Roads"
 COLDWAR_IRQ_agri_grain_storage_desc:0 "A harvest that cannot be stored or moved is not a secure food supply. Grain depots and rural roads will connect producers to markets before weather and transport failures consume their return."
 COLDWAR_IRQ_agri_grain_storage_implemented:0 "Implemented: $COLDWAR_IRQ_agri_grain_storage$"
 COLDWAR_IRQ_agri_grain_storage_pending:0 "Deliver: $COLDWAR_IRQ_agri_grain_storage$"
 COLDWAR_IRQ_agri_river_talks:0 "River Basin Planning"
 COLDWAR_IRQ_agri_river_talks_desc:0 "Iraqi farms depend on rivers whose flow is shaped far beyond any one district. A basin planning service will bring hydrological surveys, irrigation requirements and engineering studies into a common programme. Better knowledge of seasonal shortages can guide domestic works and give our negotiators a firmer understanding of the water on which Iraqi agriculture depends."
 COLDWAR_IRQ_agri_river_talks_implemented:0 "Implemented: $COLDWAR_IRQ_agri_river_talks$"
 COLDWAR_IRQ_agri_river_talks_pending:0 "Deliver: $COLDWAR_IRQ_agri_river_talks$"
 COLDWAR_IRQ_agri_marsh_livelihoods:0 "Marsh Livelihoods"
 COLDWAR_IRQ_agri_marsh_livelihoods_desc:0 "The marsh economy depends on water, transport and the livelihoods of its communities. Support for local production should strengthen those communities rather than treat them as empty land awaiting an administrative plan."
 COLDWAR_IRQ_agri_marsh_livelihoods_implemented:0 "Implemented: $COLDWAR_IRQ_agri_marsh_livelihoods$"
 COLDWAR_IRQ_agri_marsh_livelihoods_pending:0 "Deliver: $COLDWAR_IRQ_agri_marsh_livelihoods$"
 COLDWAR_IRQ_agri_distribution:0 "Rural Distribution"
 COLDWAR_IRQ_agri_distribution_desc:0 "Rural producers and urban consumers both lose when food moves through an unreliable distribution chain. A functioning network will reduce the burden carried by households and complete another part of the rural settlement."
 COLDWAR_IRQ_agri_distribution_implemented:0 "Implemented: $COLDWAR_IRQ_agri_distribution$"
 COLDWAR_IRQ_agri_distribution_pending:0 "Deliver: $COLDWAR_IRQ_agri_distribution$"
 COLDWAR_IRQ_agri_water_inspection:0 "Water Inspectorate"
 COLDWAR_IRQ_agri_water_inspection_desc:0 "An irrigation system needs inspection after its opening ceremony. A funded technical service will keep channels, pumps and allocation records working as a single productive network."
 COLDWAR_IRQ_agri_water_inspection_implemented:0 "Implemented: $COLDWAR_IRQ_agri_water_inspection$"
 COLDWAR_IRQ_agri_water_inspection_pending:0 "Deliver: $COLDWAR_IRQ_agri_water_inspection$"
 COLDWAR_IRQ_agri_clinics:0 "Mobile Rural Clinics"
 COLDWAR_IRQ_agri_clinics_desc:0 "Mobile clinics can reach communities that cannot support a full urban service network. Coordinating basic treatment and transport will make the rural health budget more effective without removing its cost."
 COLDWAR_IRQ_agri_clinics_implemented:0 "Implemented: $COLDWAR_IRQ_agri_clinics$"
 COLDWAR_IRQ_agri_clinics_pending:0 "Deliver: $COLDWAR_IRQ_agri_clinics$"
 COLDWAR_IRQ_agri_reform_delivery:0 "The Rural Reform"
 COLDWAR_IRQ_agri_reform_delivery_desc:0 "Land reform will be judged by what reaches the countryside: usable credit, maintained waterworks, transport and public services. Completing those obligations can finally remove the last inherited rural bottleneck."
 COLDWAR_IRQ_agri_reform_delivery_implemented:0 "Implemented: $COLDWAR_IRQ_agri_reform_delivery$"
 COLDWAR_IRQ_agri_reform_delivery_pending:0 "Deliver: $COLDWAR_IRQ_agri_reform_delivery$"
 COLDWAR_IRQ_society_baseline:0 "Schools and Skills"
 COLDWAR_IRQ_society_baseline_desc:0 "Iraq cannot build a modern administration on an incomplete account of its schools and workforce. A national assessment will direct the first teaching effort towards those excluded from basic education."
 COLDWAR_IRQ_society_baseline_implemented:0 "Implemented: $COLDWAR_IRQ_society_baseline$"
 COLDWAR_IRQ_society_baseline_pending:0 "Deliver: $COLDWAR_IRQ_society_baseline$"
 COLDWAR_IRQ_society_mass_literacy:0 "Mass Literacy"
 COLDWAR_IRQ_society_mass_literacy_desc:0 "A mass literacy campaign can reach adults and children left outside formal schooling. Classrooms, instructors and materials will place a real demand on the education budget."
 COLDWAR_IRQ_society_mass_literacy_implemented:0 "Implemented: $COLDWAR_IRQ_society_mass_literacy$"
 COLDWAR_IRQ_society_mass_literacy_pending:0 "Deliver: $COLDWAR_IRQ_society_mass_literacy$"
 COLDWAR_IRQ_society_teacher_first:0 "Train Teachers First"
 COLDWAR_IRQ_society_teacher_first_desc:0 "A school system cannot expand indefinitely without trained teachers. Investing in the profession first will support stronger technical learning, even if the earliest gains in basic literacy arrive more slowly."
 COLDWAR_IRQ_society_teacher_first_implemented:0 "Implemented: $COLDWAR_IRQ_society_teacher_first$"
 COLDWAR_IRQ_society_teacher_first_pending:0 "Deliver: $COLDWAR_IRQ_society_teacher_first$"
 COLDWAR_IRQ_society_evening_classes:0 "Adult Evening Classes"
 COLDWAR_IRQ_society_evening_classes_desc:0 "Evening classes allow working adults to study without abandoning their livelihoods. Extending teaching beyond the normal school day will turn a national campaign into practical local progress."
 COLDWAR_IRQ_society_evening_classes_implemented:0 "Implemented: $COLDWAR_IRQ_society_evening_classes$"
 COLDWAR_IRQ_society_evening_classes_pending:0 "Deliver: $COLDWAR_IRQ_society_evening_classes$"
 COLDWAR_IRQ_society_teacher_deployment:0 "Deploy the Teachers"
 COLDWAR_IRQ_society_teacher_deployment_desc:0 "Training teachers is only useful if they reach underserved districts. A sustained deployment programme will spread the benefits of professional education beyond the largest cities."
 COLDWAR_IRQ_society_teacher_deployment_implemented:0 "Implemented: $COLDWAR_IRQ_society_teacher_deployment$"
 COLDWAR_IRQ_society_teacher_deployment_pending:0 "Deliver: $COLDWAR_IRQ_society_teacher_deployment$"
 COLDWAR_IRQ_society_literacy_accounts:0 "Measure Literacy Gains"
 COLDWAR_IRQ_society_literacy_accounts_desc:0 "Campaign reports are useful only if they describe what people have actually learned. We will improve the assessment of literacy and make educational authorities answer for the results of their work. Careful records can guide future teaching, although maintaining them adds to the duties of the administration."
 COLDWAR_IRQ_society_universal_services:0 "Universal Services"
 COLDWAR_IRQ_society_universal_services_desc:0 "Universal services offer the whole population a stake in the state's development programme. The long-term return is a more capable workforce, while the public budget must carry the promise through difficult years."
 COLDWAR_IRQ_society_universal_services_implemented:0 "Implemented: $COLDWAR_IRQ_society_universal_services$"
 COLDWAR_IRQ_society_universal_services_pending:0 "Deliver: $COLDWAR_IRQ_society_universal_services$"
 COLDWAR_IRQ_society_targeted_services:0 "Targeted Services"
 COLDWAR_IRQ_society_targeted_services_desc:0 "Scarce public resources can be concentrated where household needs are greatest. Targeting preserves more civilian capacity, although identifying and serving those households requires a functioning local administration."
 COLDWAR_IRQ_society_targeted_services_implemented:0 "Implemented: $COLDWAR_IRQ_society_targeted_services$"
 COLDWAR_IRQ_society_targeted_services_pending:0 "Deliver: $COLDWAR_IRQ_society_targeted_services$"
 COLDWAR_IRQ_society_primary_care:0 "Provincial Primary Care"
 COLDWAR_IRQ_society_primary_care_desc:0 "Basic treatment and dependable local facilities can prevent costly emergencies from becoming the normal form of healthcare. The programme will improve the practical reach of universal provision."
 COLDWAR_IRQ_society_primary_care_implemented:0 "Implemented: $COLDWAR_IRQ_society_primary_care$"
 COLDWAR_IRQ_society_primary_care_pending:0 "Deliver: $COLDWAR_IRQ_society_primary_care$"
 COLDWAR_IRQ_society_priority_districts:0 "Neglected Districts"
 COLDWAR_IRQ_society_priority_districts_desc:0 "A targeted social policy needs visible investment in the districts it names. Improving Nineveh's public infrastructure will connect local services with the communities meant to receive them."
 COLDWAR_IRQ_society_priority_districts_implemented:0 "Implemented: $COLDWAR_IRQ_society_priority_districts$"
 COLDWAR_IRQ_society_priority_districts_pending:0 "Deliver: $COLDWAR_IRQ_society_priority_districts$"
 COLDWAR_IRQ_society_budget_review:0 "A Funded Social Budget"
 COLDWAR_IRQ_society_budget_review_desc:0 "Public services need a budget that distinguishes useful provision from repeated payments and abandoned contracts. A review will preserve more of the welfare budget for its intended recipients."
 COLDWAR_IRQ_society_budget_review_implemented:0 "Implemented: $COLDWAR_IRQ_society_budget_review$"
 COLDWAR_IRQ_society_budget_review_pending:0 "Deliver: $COLDWAR_IRQ_society_budget_review$"
 COLDWAR_IRQ_society_women_education:0 "Women and Skills"
 COLDWAR_IRQ_society_women_education_desc:0 "Women's education expands the skills available to families, schools and the public service. The programme will make access to learning a practical national commitment rather than a ceremonial promise."
 COLDWAR_IRQ_society_women_education_implemented:0 "Implemented: $COLDWAR_IRQ_society_women_education$"
 COLDWAR_IRQ_society_women_education_pending:0 "Deliver: $COLDWAR_IRQ_society_women_education$"
 COLDWAR_IRQ_society_housing:0 "Housing and Services"
 COLDWAR_IRQ_society_housing_desc:0 "Urban growth has outpaced roads, water connections and basic municipal services. Investment in Baghdad's infrastructure will make new housing districts part of a working city."
 COLDWAR_IRQ_society_housing_implemented:0 "Implemented: $COLDWAR_IRQ_society_housing$"
 COLDWAR_IRQ_society_housing_pending:0 "Deliver: $COLDWAR_IRQ_society_housing$"
 COLDWAR_IRQ_society_technical_colleges:0 "Technical Colleges"
 COLDWAR_IRQ_society_technical_colleges_desc:0 "Technical colleges will train the surveyors, technicians and workshop staff needed by the development programme. Their value will appear in projects that Iraqi specialists can complete and maintain themselves."
 COLDWAR_IRQ_society_technical_colleges_implemented:0 "Implemented: $COLDWAR_IRQ_society_technical_colleges$"
 COLDWAR_IRQ_society_technical_colleges_pending:0 "Deliver: $COLDWAR_IRQ_society_technical_colleges$"
 COLDWAR_IRQ_society_rural_schooling:0 "Rural School Access"
 COLDWAR_IRQ_society_rural_schooling_desc:0 "A national education programme cannot end at the edge of the city. Rural schools will sustain the gains of adult teaching and open a route into technical training for the next generation."
 COLDWAR_IRQ_society_rural_schooling_implemented:0 "Implemented: $COLDWAR_IRQ_society_rural_schooling$"
 COLDWAR_IRQ_society_rural_schooling_pending:0 "Deliver: $COLDWAR_IRQ_society_rural_schooling$"
 COLDWAR_IRQ_society_municipal_finance:0 "Municipal Revenue"
 COLDWAR_IRQ_society_municipal_finance_desc:0 "Municipalities need dependable revenue and accountable service contracts. A stronger local finance system can support public facilities without repeatedly appealing to Baghdad for an emergency allocation."
 COLDWAR_IRQ_society_municipal_finance_implemented:0 "Implemented: $COLDWAR_IRQ_society_municipal_finance$"
 COLDWAR_IRQ_society_municipal_finance_pending:0 "Deliver: $COLDWAR_IRQ_society_municipal_finance$"
 COLDWAR_IRQ_society_science_maintenance:0 "Maintain Laboratories"
 COLDWAR_IRQ_society_science_maintenance_desc:0 "Laboratories need maintained instruments and a stable technical staff. Building practical competence in electronics will support Iraqi research without pretending that every field can advance at once."
 COLDWAR_IRQ_society_science_maintenance_implemented:0 "Implemented: $COLDWAR_IRQ_society_science_maintenance$"
 COLDWAR_IRQ_society_science_maintenance_pending:0 "Deliver: $COLDWAR_IRQ_society_science_maintenance$"
 COLDWAR_IRQ_society_service_compact:0 "A Service Compact"
 COLDWAR_IRQ_society_service_compact_desc:0 "The public service programme must be able to adapt as needs and resources change. We will review the balance of coverage and funding while preserving the educational progress already achieved. A more durable settlement should rest on commitments the government can continue to meet."
 COLDWAR_IRQ_defence_accounts:0 "Audit the Armed Forces"
 COLDWAR_IRQ_defence_accounts_desc:0 "The armed forces need a clear account of their institutions, expenditure and readiness. We will examine how resources move through the military administration and identify the obstacles facing the forces already under arms. A stronger defence policy begins with knowing what the state is actually supporting."
 COLDWAR_IRQ_defence_professional:0 "A Professional Core"
 COLDWAR_IRQ_defence_professional_desc:0 "A professional core can give the army formations that train and operate together. Iraq will pay more for each trained soldier in exchange for a more coherent force."
 COLDWAR_IRQ_defence_professional_implemented:0 "Implemented: $COLDWAR_IRQ_defence_professional$"
 COLDWAR_IRQ_defence_professional_pending:0 "Deliver: $COLDWAR_IRQ_defence_professional$"
 COLDWAR_IRQ_defence_mass:0 "A Mass Reserve Army"
 COLDWAR_IRQ_defence_mass_desc:0 "A deep reserve provides replacements and the ability to sustain a long campaign. Its size cannot remove the coordination problems of a force assembled from uneven levels of training."
 COLDWAR_IRQ_defence_mass_implemented:0 "Implemented: $COLDWAR_IRQ_defence_mass$"
 COLDWAR_IRQ_defence_mass_pending:0 "Deliver: $COLDWAR_IRQ_defence_mass$"
 COLDWAR_IRQ_defence_staff_training:0 "Fund Staff Training"
 COLDWAR_IRQ_defence_staff_training_desc:0 "Staff officers must learn to turn political objectives into orders that formations can execute. More thorough preparation takes time, but reduces the need to improvise doctrine during a campaign."
 COLDWAR_IRQ_defence_staff_training_implemented:0 "Implemented: $COLDWAR_IRQ_defence_staff_training$"
 COLDWAR_IRQ_defence_staff_training_pending:0 "Deliver: $COLDWAR_IRQ_defence_staff_training$"
 COLDWAR_IRQ_defence_reserve_training:0 "Train the Reserves"
 COLDWAR_IRQ_defence_reserve_training_desc:0 "The reserve needs instructors, refresher courses and a dependable call-up system. Training will make replacement formations useful while adding a real continuing personnel commitment."
 COLDWAR_IRQ_defence_reserve_training_implemented:0 "Implemented: $COLDWAR_IRQ_defence_reserve_training$"
 COLDWAR_IRQ_defence_reserve_training_pending:0 "Deliver: $COLDWAR_IRQ_defence_reserve_training$"
 COLDWAR_IRQ_defence_procurement_board:0 "Procurement Board"
 COLDWAR_IRQ_defence_procurement_board_desc:0 "The armed forces need common standards for tenders, spares and acceptance trials. A procurement board will connect domestic production with military requirements rather than the preferences of each purchasing mission."
 COLDWAR_IRQ_defence_procurement_board_implemented:0 "Implemented: $COLDWAR_IRQ_defence_procurement_board$"
 COLDWAR_IRQ_defence_procurement_board_pending:0 "Deliver: $COLDWAR_IRQ_defence_procurement_board$"
 COLDWAR_IRQ_defence_soviet_standard:0 "Soviet Supply Standards"
 COLDWAR_IRQ_defence_soviet_standard_desc:0 "Soviet standards can simplify ammunition, training and spare-parts supply across the army. That efficiency also gives one supplier greater influence over Iraqi military planning."
 COLDWAR_IRQ_defence_soviet_standard_implemented:0 "Implemented: $COLDWAR_IRQ_defence_soviet_standard$"
 COLDWAR_IRQ_defence_soviet_standard_pending:0 "Deliver: $COLDWAR_IRQ_defence_soviet_standard$"
 COLDWAR_IRQ_defence_mixed_supply:0 "Diverse Suppliers"
 COLDWAR_IRQ_defence_mixed_supply_desc:0 "Different suppliers offer capabilities that no single relationship can provide. Iraq will gain technical options while accepting the extra burden of maintaining several standards."
 COLDWAR_IRQ_defence_mixed_supply_implemented:0 "Implemented: $COLDWAR_IRQ_defence_mixed_supply$"
 COLDWAR_IRQ_defence_mixed_supply_pending:0 "Deliver: $COLDWAR_IRQ_defence_mixed_supply$"
 COLDWAR_IRQ_defence_soviet_offer:0 "Advisory Mission"
 COLDWAR_IRQ_defence_soviet_offer_desc:0 "An advisory agreement is more useful when Iraqi officers know what they need to learn. Domestic preparations will improve staff practice while the Soviet government decides whether to provide the requested cooperation."
 COLDWAR_IRQ_defence_soviet_offer_implemented:0 "Implemented: $COLDWAR_IRQ_defence_soviet_offer$"
 COLDWAR_IRQ_defence_soviet_offer_pending:0 "Deliver: $COLDWAR_IRQ_defence_soviet_offer$"
 COLDWAR_IRQ_defence_maintenance_manuals:0 "Maintenance System"
 COLDWAR_IRQ_defence_maintenance_manuals_desc:0 "Equipment from several suppliers needs translated manuals, trained crews and a dependable repair service. Longer familiarisation will prevent some of the losses caused by operating unfamiliar machines."
 COLDWAR_IRQ_defence_maintenance_manuals_implemented:0 "Implemented: $COLDWAR_IRQ_defence_maintenance_manuals$"
 COLDWAR_IRQ_defence_maintenance_manuals_pending:0 "Deliver: $COLDWAR_IRQ_defence_maintenance_manuals$"
 COLDWAR_IRQ_defence_logistics:0 "Unified Logistics"
 COLDWAR_IRQ_defence_logistics_desc:0 "Operational plans must reflect the roads and supply columns that support them. Better logistics will allow Iraqi formations to move with fewer avoidable interruptions."
 COLDWAR_IRQ_defence_logistics_implemented:0 "Implemented: $COLDWAR_IRQ_defence_logistics$"
 COLDWAR_IRQ_defence_logistics_pending:0 "Deliver: $COLDWAR_IRQ_defence_logistics$"
 COLDWAR_IRQ_defence_land_schools:0 "Army Training Schools"
 COLDWAR_IRQ_defence_land_schools_desc:0 "Land-force schools will turn campaign experience into training that survives the transfer of individual commanders. Instructors and permanent courses cost money, but the army will retain what it learns."
 COLDWAR_IRQ_defence_land_schools_implemented:0 "Implemented: $COLDWAR_IRQ_defence_land_schools$"
 COLDWAR_IRQ_defence_land_schools_pending:0 "Deliver: $COLDWAR_IRQ_defence_land_schools$"
 COLDWAR_IRQ_defence_air_maintenance:0 "Air Maintenance"
 COLDWAR_IRQ_defence_air_maintenance_desc:0 "Aircraft availability depends on ground crews, spare parts and careful maintenance as much as purchases. Iraq will invest in the skills needed to keep its air force flying safely."
 COLDWAR_IRQ_defence_air_maintenance_implemented:0 "Implemented: $COLDWAR_IRQ_defence_air_maintenance$"
 COLDWAR_IRQ_defence_air_maintenance_pending:0 "Deliver: $COLDWAR_IRQ_defence_air_maintenance$"
 COLDWAR_IRQ_defence_coastal:0 "Coastal Defence"
 COLDWAR_IRQ_defence_coastal_desc:0 "A coastal force needs domestic facilities capable of supporting and repairing its vessels. Basra will provide a modest naval-industrial foundation suited to Iraq's limited frontage on the Gulf."
 COLDWAR_IRQ_defence_coastal_implemented:0 "Implemented: $COLDWAR_IRQ_defence_coastal$"
 COLDWAR_IRQ_defence_coastal_pending:0 "Deliver: $COLDWAR_IRQ_defence_coastal$"
 COLDWAR_IRQ_defence_armaments:0 "Local Armaments"
 COLDWAR_IRQ_defence_armaments_desc:0 "A domestic armaments plant cannot replace every foreign supplier, but it can support a dependable core of military production. The army will gain an industrial asset rather than another promise of self-sufficiency."
 COLDWAR_IRQ_defence_armaments_implemented:0 "Implemented: $COLDWAR_IRQ_defence_armaments$"
 COLDWAR_IRQ_defence_armaments_pending:0 "Deliver: $COLDWAR_IRQ_defence_armaments$"
 COLDWAR_IRQ_defence_fuel_discipline:0 "Fuel Discipline"
 COLDWAR_IRQ_defence_fuel_discipline_desc:0 "Fuel discipline begins with drivers, maintenance crews and realistic movement schedules. The air-force maintenance programme will be matched by a less wasteful military fuel system."
 COLDWAR_IRQ_defence_fuel_discipline_implemented:0 "Implemented: $COLDWAR_IRQ_defence_fuel_discipline$"
 COLDWAR_IRQ_defence_fuel_discipline_pending:0 "Deliver: $COLDWAR_IRQ_defence_fuel_discipline$"
 COLDWAR_IRQ_defence_ship_maintenance:0 "The Coastal Fleet"
 COLDWAR_IRQ_defence_ship_maintenance_desc:0 "A small fleet cannot afford to leave repair capacity idle or depend on every overhaul being performed abroad. Improved dockyard practice will make Basra's facilities more productive."
 COLDWAR_IRQ_defence_ship_maintenance_implemented:0 "Implemented: $COLDWAR_IRQ_defence_ship_maintenance$"
 COLDWAR_IRQ_defence_ship_maintenance_pending:0 "Deliver: $COLDWAR_IRQ_defence_ship_maintenance$"
 COLDWAR_IRQ_defence_readiness:0 "Sustainable Readiness"
 COLDWAR_IRQ_defence_readiness_desc:0 "Readiness rests on staff work, maintained equipment and units that can assemble before a crisis has passed. A national exercise will test the schools, depots and command arrangements established throughout the military programme. Its additional personnel commitment must be funded alongside the training itself."
 COLDWAR_IRQ_defence_readiness_implemented:0 "Implemented: $COLDWAR_IRQ_defence_readiness$"
 COLDWAR_IRQ_defence_readiness_pending:0 "Deliver: $COLDWAR_IRQ_defence_readiness$"
 COLDWAR_IRQ_war_contingency:0 "Contingency Planning"
 COLDWAR_IRQ_war_contingency_desc:0 "Mobilisation exposes weaknesses that a peacetime staff can ignore. Contingency exercises will give the government a clearer understanding of what its army can sustain."
 COLDWAR_IRQ_war_contingency_implemented:0 "Implemented: $COLDWAR_IRQ_war_contingency$"
 COLDWAR_IRQ_war_contingency_pending:0 "Deliver: $COLDWAR_IRQ_war_contingency$"
 COLDWAR_IRQ_war_restraint:0 "Armed Restraint"
 COLDWAR_IRQ_war_restraint_desc:0 "Armed restraint requires a force capable of holding its ground. Iraq will fund prepared positions and defensive readiness while keeping the decision to expand the war under political control."
 COLDWAR_IRQ_war_restraint_implemented:0 "Implemented: $COLDWAR_IRQ_war_restraint$"
 COLDWAR_IRQ_war_restraint_pending:0 "Deliver: $COLDWAR_IRQ_war_restraint$"
 COLDWAR_IRQ_war_offensive_option:0 "An Offensive Option"
 COLDWAR_IRQ_war_offensive_option_desc:0 "An offensive option gives the government a credible means of changing the military situation. Preparing it will strain personnel budgets and increase the domestic risks of a failed operation."
 COLDWAR_IRQ_war_offensive_option_implemented:0 "Implemented: $COLDWAR_IRQ_war_offensive_option$"
 COLDWAR_IRQ_war_offensive_option_pending:0 "Deliver: $COLDWAR_IRQ_war_offensive_option$"
 COLDWAR_IRQ_war_crisis_channel:0 "Crisis Channel"
 COLDWAR_IRQ_war_crisis_channel_desc:0 "Crisis communications can save the expense of reacting to every report with another deployment. Maintaining a channel does not oblige Iraq to accept an unfavourable settlement."
 COLDWAR_IRQ_war_crisis_channel_implemented:0 "Implemented: $COLDWAR_IRQ_war_crisis_channel$"
 COLDWAR_IRQ_war_crisis_channel_pending:0 "Deliver: $COLDWAR_IRQ_war_crisis_channel$"
 COLDWAR_IRQ_war_deliberate_authority:0 "Authorize War"
 COLDWAR_IRQ_war_deliberate_authority_desc:0 "A decision for war must specify who can issue orders and what the army is expected to achieve. Clear authority will help the staff prepare an operation without granting it an unlimited political mandate."
 COLDWAR_IRQ_war_deliberate_authority_implemented:0 "Implemented: $COLDWAR_IRQ_war_deliberate_authority$"
 COLDWAR_IRQ_war_deliberate_authority_pending:0 "Deliver: $COLDWAR_IRQ_war_deliberate_authority$"
 COLDWAR_IRQ_war_civil_continuity:0 "Civil Crisis Authority"
 COLDWAR_IRQ_war_civil_continuity_desc:0 "Power, roads and public records must continue to function while resources are diverted to the armed forces. Civil continuity preparations will help restore essential facilities when disruption occurs."
 COLDWAR_IRQ_war_civil_continuity_implemented:0 "Implemented: $COLDWAR_IRQ_war_civil_continuity$"
 COLDWAR_IRQ_war_civil_continuity_pending:0 "Deliver: $COLDWAR_IRQ_war_civil_continuity$"
 COLDWAR_IRQ_war_economy:0 "War Economy"
 COLDWAR_IRQ_war_economy_desc:0 "War production will take priority over ordinary civilian demand. The state can obtain more military output, but must accept the economic and personnel commitments that accompany it."
 COLDWAR_IRQ_war_economy_implemented:0 "Implemented: $COLDWAR_IRQ_war_economy$"
 COLDWAR_IRQ_war_economy_pending:0 "Deliver: $COLDWAR_IRQ_war_economy$"
 COLDWAR_IRQ_war_civilian_floor:0 "A Civilian Budget Floor"
 COLDWAR_IRQ_war_civilian_floor_desc:0 "The war cannot consume every part of the civilian economy without undermining the state behind the front. A protected civilian budget sustains productive life while limiting the resources available for military output."
 COLDWAR_IRQ_war_civilian_floor_implemented:0 "Implemented: $COLDWAR_IRQ_war_civilian_floor$"
 COLDWAR_IRQ_war_civilian_floor_pending:0 "Deliver: $COLDWAR_IRQ_war_civilian_floor$"
 COLDWAR_IRQ_war_procurement_cycle:0 "Wartime Procurement"
 COLDWAR_IRQ_war_procurement_cycle_desc:0 "Wartime orders must arrive as usable equipment rather than incomplete contracts. A faster procurement cycle improves production, while emergency purchasing remains more expensive than normal supply."
 COLDWAR_IRQ_war_procurement_cycle_implemented:0 "Implemented: $COLDWAR_IRQ_war_procurement_cycle$"
 COLDWAR_IRQ_war_procurement_cycle_pending:0 "Deliver: $COLDWAR_IRQ_war_procurement_cycle$"
 COLDWAR_IRQ_war_services_continuity:0 "Civilian Services"
 COLDWAR_IRQ_war_services_continuity_desc:0 "Wartime public services must cope with disrupted transport and rising demand. Coordinating essential care will reduce waste without pretending that civilian provision has become free."
 COLDWAR_IRQ_war_services_continuity_implemented:0 "Implemented: $COLDWAR_IRQ_war_services_continuity$"
 COLDWAR_IRQ_war_services_continuity_pending:0 "Deliver: $COLDWAR_IRQ_war_services_continuity$"
 COLDWAR_IRQ_war_accounts:0 "Emergency Accounts"
 COLDWAR_IRQ_war_accounts_desc:0 "Emergency spending needs scrutiny before temporary contracts become permanent liabilities. A reliable ledger will recover part of the waste in the equipment budget, without erasing the real cost of war."
 COLDWAR_IRQ_war_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_war_accounts$"
 COLDWAR_IRQ_war_accounts_pending:0 "Deliver: $COLDWAR_IRQ_war_accounts$"
 COLDWAR_IRQ_war_veterans:0 "Veterans and Victims"
 COLDWAR_IRQ_war_veterans_desc:0 "Veterans and victims carry the consequences of war long after an offensive ends. Rehabilitation and instruction will preserve experience while committing the state to a real support budget."
 COLDWAR_IRQ_war_veterans_implemented:0 "Implemented: $COLDWAR_IRQ_war_veterans$"
 COLDWAR_IRQ_war_veterans_pending:0 "Deliver: $COLDWAR_IRQ_war_veterans$"
 COLDWAR_IRQ_war_reconstruction:0 "Civilian Reconstruction"
 COLDWAR_IRQ_war_reconstruction_desc:0 "Reconstruction must restore productive civilian work as well as damaged monuments. A new industrial undertaking in Basra will provide a concrete foundation for the recovery."
 COLDWAR_IRQ_war_reconstruction_implemented:0 "Implemented: $COLDWAR_IRQ_war_reconstruction$"
 COLDWAR_IRQ_war_reconstruction_pending:0 "Deliver: $COLDWAR_IRQ_war_reconstruction$"
 COLDWAR_IRQ_war_credit_burden:0 "Confront Postwar Debt"
 COLDWAR_IRQ_war_credit_burden_desc:0 "A postwar treasury must distinguish immediate obligations from debts that can be refinanced. Better administration offers some financing relief, but lenders still decide whether to accept revised terms."
 COLDWAR_IRQ_war_credit_burden_implemented:0 "Implemented: $COLDWAR_IRQ_war_credit_burden$"
 COLDWAR_IRQ_war_credit_burden_pending:0 "Deliver: $COLDWAR_IRQ_war_credit_burden$"
 COLDWAR_IRQ_war_reintegration:0 "Reintegration"
 COLDWAR_IRQ_war_reintegration_desc:0 "Returning soldiers need a place in civilian production, not merely a discharge paper. Training and support can bring wartime skills into workshops and construction while imposing a lasting social obligation."
 COLDWAR_IRQ_war_reintegration_implemented:0 "Implemented: $COLDWAR_IRQ_war_reintegration$"
 COLDWAR_IRQ_war_reintegration_pending:0 "Deliver: $COLDWAR_IRQ_war_reintegration$"
 COLDWAR_IRQ_war_recovery_contracts:0 "Recovery Contracts"
 COLDWAR_IRQ_war_recovery_contracts_desc:0 "Recovery contracts should restore equipment and return plants to reliable operation. Paying for competent repair will produce more than a new chain of politically connected intermediaries."
 COLDWAR_IRQ_war_recovery_contracts_implemented:0 "Implemented: $COLDWAR_IRQ_war_recovery_contracts$"
 COLDWAR_IRQ_war_recovery_contracts_pending:0 "Deliver: $COLDWAR_IRQ_war_recovery_contracts$"
 COLDWAR_IRQ_war_sanctions_response:0 "Sanctions Response"
 COLDWAR_IRQ_war_sanctions_response_desc:0 "Sanctions expose every weakness in domestic production and commercial access. Iraq will improve the technical capacity it can control while any alternative export or credit arrangement still requires a willing partner."
 COLDWAR_IRQ_war_sanctions_response_implemented:0 "Implemented: $COLDWAR_IRQ_war_sanctions_response$"
 COLDWAR_IRQ_war_sanctions_response_pending:0 "Deliver: $COLDWAR_IRQ_war_sanctions_response$"
 COLDWAR_IRQ_war_peace_dividend:0 "Peace Settlement"
 COLDWAR_IRQ_war_peace_dividend_desc:0 "Peace allows labour and money to return to civilian construction. A smaller readiness commitment eases personnel costs, although the army will need time to recover its former organisation if another crisis begins."
 COLDWAR_IRQ_war_peace_dividend_implemented:0 "Implemented: $COLDWAR_IRQ_war_peace_dividend$"
 COLDWAR_IRQ_war_peace_dividend_pending:0 "Deliver: $COLDWAR_IRQ_war_peace_dividend$"
 COLDWAR_IRQ_iran_frontier:0 "The Iranian Frontier"
 COLDWAR_IRQ_iran_frontier_desc:0 "The Iranian frontier connects navigation rights, local communities and the security of the oil economy. A staff assessment will give Iraq a clearer military basis for its demands."
 COLDWAR_IRQ_iran_frontier_implemented:0 "Implemented: $COLDWAR_IRQ_iran_frontier$"
 COLDWAR_IRQ_iran_frontier_pending:0 "Deliver: $COLDWAR_IRQ_iran_frontier$"
 COLDWAR_IRQ_iran_shatt_demand:0 "Enforce the Shatt Claim"
 COLDWAR_IRQ_iran_shatt_demand_desc:0 "The Shatt dispute gives Iraq a concrete demand to press against Tehran. Sustaining that demand will require military preparation and carries a domestic risk if the confrontation fails."
 COLDWAR_IRQ_iran_shatt_demand_implemented:0 "Implemented: $COLDWAR_IRQ_iran_shatt_demand$"
 COLDWAR_IRQ_iran_shatt_demand_pending:0 "Deliver: $COLDWAR_IRQ_iran_shatt_demand$"
 COLDWAR_IRQ_iran_arabistan_claim:0 "The Arabistan Claim"
 COLDWAR_IRQ_iran_arabistan_claim_desc:0 "The claim to Arabistan places Iranian territory at the centre of Iraqi war aims. It is a political commitment to a dangerous campaign, not proof that the province's population will welcome a new government."
 COLDWAR_IRQ_iran_arabistan_claim_implemented:0 "Implemented: $COLDWAR_IRQ_iran_arabistan_claim$"
 COLDWAR_IRQ_iran_arabistan_claim_pending:0 "Deliver: $COLDWAR_IRQ_iran_arabistan_claim$"
 COLDWAR_IRQ_iran_southern_command:0 "Southern Command"
 COLDWAR_IRQ_iran_southern_command_desc:0 "A southern command will bring frontier plans, formations and supply priorities under one staff. Iraq gains operational coherence at the price of another sustained military commitment."
 COLDWAR_IRQ_iran_southern_command_implemented:0 "Implemented: $COLDWAR_IRQ_iran_southern_command$"
 COLDWAR_IRQ_iran_southern_command_pending:0 "Deliver: $COLDWAR_IRQ_iran_southern_command$"
 COLDWAR_IRQ_iran_tehran_assessment:0 "Assess Tehran's Army"
 COLDWAR_IRQ_iran_tehran_assessment_desc:0 "Tehran's army must be assessed as it exists, not as Iraqi leaders hope it exists. Reconnaissance and staff work will improve planning while leaving the risks of political miscalculation intact."
 COLDWAR_IRQ_iran_tehran_assessment_implemented:0 "Implemented: $COLDWAR_IRQ_iran_tehran_assessment$"
 COLDWAR_IRQ_iran_tehran_assessment_pending:0 "Deliver: $COLDWAR_IRQ_iran_tehran_assessment$"
 COLDWAR_IRQ_iran_operational_plan:0 "The Southern War Plan"
 COLDWAR_IRQ_iran_operational_plan_desc:0 "The southern war plan must connect objectives with roads, supply and the time available to concentrate forces. Detailed preparation can improve the opening operation without guaranteeing its political outcome."
 COLDWAR_IRQ_iran_operational_plan_implemented:0 "Implemented: $COLDWAR_IRQ_iran_operational_plan$"
 COLDWAR_IRQ_iran_operational_plan_pending:0 "Deliver: $COLDWAR_IRQ_iran_operational_plan$"
 COLDWAR_IRQ_iran_short_war:0 "A Short Sharp War"
 COLDWAR_IRQ_iran_short_war_desc:0 "A short war seeks to turn preparation into a rapid decision. Concentrating resources for that opening also places extra pressure on the supply system if the campaign refuses to end on schedule."
 COLDWAR_IRQ_iran_short_war_implemented:0 "Implemented: $COLDWAR_IRQ_iran_short_war$"
 COLDWAR_IRQ_iran_short_war_pending:0 "Deliver: $COLDWAR_IRQ_iran_short_war$"
 COLDWAR_IRQ_iran_sustained_war:0 "Prepare a Long War"
 COLDWAR_IRQ_iran_sustained_war_desc:0 "A long campaign requires a war-production base and a reserve that can be replenished. The state will prepare for endurance while diverting specialists and resources from peacetime work."
 COLDWAR_IRQ_iran_sustained_war_implemented:0 "Implemented: $COLDWAR_IRQ_iran_sustained_war$"
 COLDWAR_IRQ_iran_sustained_war_pending:0 "Deliver: $COLDWAR_IRQ_iran_sustained_war$"
 COLDWAR_IRQ_iran_fuel_spares:0 "Fuel and Spares"
 COLDWAR_IRQ_iran_fuel_spares_desc:0 "The opening campaign will consume fuel and spare parts faster than ordinary peacetime routines can supply them. Better preparation reduces waste, while urgent equipment contracts carry a premium."
 COLDWAR_IRQ_iran_fuel_spares_implemented:0 "Implemented: $COLDWAR_IRQ_iran_fuel_spares$"
 COLDWAR_IRQ_iran_fuel_spares_pending:0 "Deliver: $COLDWAR_IRQ_iran_fuel_spares$"
 COLDWAR_IRQ_iran_mobilisation_base:0 "Build the War Reserve"
 COLDWAR_IRQ_iran_mobilisation_base_desc:0 "A war reserve needs more than men on a list. Domestic arms production will support the formations raised for a prolonged campaign and bind the state to maintaining their readiness."
 COLDWAR_IRQ_iran_mobilisation_base_implemented:0 "Implemented: $COLDWAR_IRQ_iran_mobilisation_base$"
 COLDWAR_IRQ_iran_mobilisation_base_pending:0 "Deliver: $COLDWAR_IRQ_iran_mobilisation_base$"
 COLDWAR_IRQ_iran_gulf_credit:0 "Seek Gulf Backing"
 COLDWAR_IRQ_iran_gulf_credit_desc:0 "Other Gulf governments may see Iran's power as a danger they would rather Iraq confront. We will seek financial backing and present our preparations as serving a wider regional interest. Assistance can strengthen our position, but money advanced in solidarity may later return as a creditor's demand."
 COLDWAR_IRQ_iran_forward_depots:0 "Forward Supply Depots"
 COLDWAR_IRQ_iran_forward_depots_desc:0 "Forward depots and connecting roads will determine how long formations can operate beyond their starting positions. Preparing that network is a tangible investment in the campaign."
 COLDWAR_IRQ_iran_forward_depots_implemented:0 "Implemented: $COLDWAR_IRQ_iran_forward_depots$"
 COLDWAR_IRQ_iran_forward_depots_pending:0 "Deliver: $COLDWAR_IRQ_iran_forward_depots$"
 COLDWAR_IRQ_iran_war_contracts:0 "Mobilise War Contracts"
 COLDWAR_IRQ_iran_war_contracts_desc:0 "Long-war contracts will give producers a more predictable military programme. The treasury accepts lower ordinary receipts in exchange for faster improvements in the output needed at the front."
 COLDWAR_IRQ_iran_war_contracts_implemented:0 "Implemented: $COLDWAR_IRQ_iran_war_contracts$"
 COLDWAR_IRQ_iran_war_contracts_pending:0 "Deliver: $COLDWAR_IRQ_iran_war_contracts$"
 COLDWAR_IRQ_iran_supplier_access:0 "Secure Foreign Spares"
 COLDWAR_IRQ_iran_supplier_access_desc:0 "Foreign equipment remains useful only while the army can obtain the parts and support needed to keep it working. We will approach suppliers about arrangements suitable for a wartime demand. Baghdad must secure their cooperation on terms they accept rather than assume that earlier sales guarantee assistance."
 COLDWAR_IRQ_iran_final_ultimatum:0 "The Final Ultimatum"
 COLDWAR_IRQ_iran_final_ultimatum_desc:0 "The ultimatum turns a territorial demand into an explicit threat of war. Iraq must now decide whether its preparations justify the consequences of enforcing it."
 COLDWAR_IRQ_iran_final_ultimatum_implemented:0 "Implemented: $COLDWAR_IRQ_iran_final_ultimatum$"
 COLDWAR_IRQ_iran_final_ultimatum_pending:0 "Deliver: $COLDWAR_IRQ_iran_final_ultimatum$"
 COLDWAR_IRQ_iran_launch_campaign:0 "Execute the War Plan"
 COLDWAR_IRQ_iran_launch_campaign_desc:0 "Executing the plan requires the staff to concentrate what Iraq has actually built. A coherent opening can create an opportunity; it cannot ensure that the war remains limited."
 COLDWAR_IRQ_iran_launch_campaign_implemented:0 "Implemented: $COLDWAR_IRQ_iran_launch_campaign$"
 COLDWAR_IRQ_iran_launch_campaign_pending:0 "Deliver: $COLDWAR_IRQ_iran_launch_campaign$"
 COLDWAR_IRQ_iran_home_front:0 "Mobilise the Nation"
 COLDWAR_IRQ_iran_home_front_desc:0 "A national mobilisation reaches factories, families and the public-service budget. The state will ask for a larger war commitment while accepting the strain this places on ordinary life."
 COLDWAR_IRQ_iran_home_front_implemented:0 "Implemented: $COLDWAR_IRQ_iran_home_front$"
 COLDWAR_IRQ_iran_home_front_pending:0 "Deliver: $COLDWAR_IRQ_iran_home_front$"
 COLDWAR_IRQ_iran_campaign_accounts:0 "The Campaign Ledger"
 COLDWAR_IRQ_iran_campaign_accounts_desc:0 "The first campaign has produced practical lessons as well as bills. The staff will record what formations consumed and what the front actually needed before another operation is approved."
 COLDWAR_IRQ_iran_campaign_accounts_implemented:0 "Implemented: $COLDWAR_IRQ_iran_campaign_accounts$"
 COLDWAR_IRQ_iran_campaign_accounts_pending:0 "Deliver: $COLDWAR_IRQ_iran_campaign_accounts$"
 COLDWAR_IRQ_iran_secure_khuzestan:0 "Secure Khuzestan"
 COLDWAR_IRQ_iran_secure_khuzestan_desc:0 "Holding Khuzestan requires secure supply routes and an administration that can function behind the fighting. Territorial control brings obligations that an advance across the frontier cannot settle by itself."
 COLDWAR_IRQ_iran_secure_khuzestan_implemented:0 "Implemented: $COLDWAR_IRQ_iran_secure_khuzestan$"
 COLDWAR_IRQ_iran_secure_khuzestan_pending:0 "Deliver: $COLDWAR_IRQ_iran_secure_khuzestan$"
 COLDWAR_IRQ_iran_long_war:0 "Fight Through Attrition"
 COLDWAR_IRQ_iran_long_war_desc:0 "A campaign that survives its promised timetable becomes a different kind of war. Iraqi officers must turn the experience of sustained fighting into a plan for the next phase."
 COLDWAR_IRQ_iran_long_war_implemented:0 "Implemented: $COLDWAR_IRQ_iran_long_war$"
 COLDWAR_IRQ_iran_long_war_pending:0 "Deliver: $COLDWAR_IRQ_iran_long_war$"
 COLDWAR_IRQ_iran_oil_rehabilitation:0 "Khuzestan Oilworks"
 COLDWAR_IRQ_iran_oil_rehabilitation_desc:0 "Captured oil installations are not immediately a dependable source of revenue. Restoring roads and facilities will require investment and continuing security before the province can support its new administration."
 COLDWAR_IRQ_iran_oil_rehabilitation_implemented:0 "Implemented: $COLDWAR_IRQ_iran_oil_rehabilitation$"
 COLDWAR_IRQ_iran_oil_rehabilitation_pending:0 "Deliver: $COLDWAR_IRQ_iran_oil_rehabilitation$"
 COLDWAR_IRQ_iran_civil_administration:0 "Administer Arabistan"
 COLDWAR_IRQ_iran_civil_administration_desc:0 "A civil administration must provide records, revenue collection and enforceable local obligations. Establishing it is a different task from simply maintaining a military presence in the province."
 COLDWAR_IRQ_iran_civil_administration_implemented:0 "Implemented: $COLDWAR_IRQ_iran_civil_administration$"
 COLDWAR_IRQ_iran_civil_administration_pending:0 "Deliver: $COLDWAR_IRQ_iran_civil_administration$"
 COLDWAR_IRQ_iran_war_of_reserves:0 "An Army of Reserves"
 COLDWAR_IRQ_iran_war_of_reserves_desc:0 "Sustained war demands formations that can be replaced as well as reinforced. A larger reserve strengthens endurance while drawing skilled people and public money away from civilian work."
 COLDWAR_IRQ_iran_war_of_reserves_implemented:0 "Implemented: $COLDWAR_IRQ_iran_war_of_reserves$"
 COLDWAR_IRQ_iran_war_of_reserves_pending:0 "Deliver: $COLDWAR_IRQ_iran_war_of_reserves$"
 COLDWAR_IRQ_iran_another_offensive:0 "Prepare Another Blow"
 COLDWAR_IRQ_iran_another_offensive_desc:0 "Another offensive should rest on the lessons of the first campaign rather than a repetition of its assumptions. The staff will prepare the next concentration while the government weighs its cost."
 COLDWAR_IRQ_iran_another_offensive_implemented:0 "Implemented: $COLDWAR_IRQ_iran_another_offensive$"
 COLDWAR_IRQ_iran_another_offensive_pending:0 "Deliver: $COLDWAR_IRQ_iran_another_offensive$"
 COLDWAR_IRQ_iran_regional_power:0 "Arabistan Secured"
 COLDWAR_IRQ_iran_regional_power_desc:0 "Control of Arabistan changes Iraq's regional position. Turning that gain into durable influence will depend on holding the territory and administering it beyond the end of the campaign."
 COLDWAR_IRQ_iran_regional_power_implemented:0 "Implemented: $COLDWAR_IRQ_iran_regional_power$"
 COLDWAR_IRQ_iran_regional_power_pending:0 "Deliver: $COLDWAR_IRQ_iran_regional_power$"
 COLDWAR_IRQ_iran_no_easy_exit:0 "Victory at Any Cost"
 COLDWAR_IRQ_iran_no_easy_exit_desc:0 "Victory at any cost binds the state to a war economy whose promises become harder to abandon. Iraq can drive military output higher while its households and treasury carry the consequences."
 COLDWAR_IRQ_iran_no_easy_exit_implemented:0 "Implemented: $COLDWAR_IRQ_iran_no_easy_exit$"
 COLDWAR_IRQ_iran_no_easy_exit_pending:0 "Deliver: $COLDWAR_IRQ_iran_no_easy_exit$"
 COLDWAR_IRQ_iran_provincial_settlement:0 "A Provincial Settlement"
 COLDWAR_IRQ_iran_provincial_settlement_desc:0 "A provincial settlement must define the obligations of the state after the fighting ends. Civil records and local representation will prepare the ground for the choice between integration by consent and central rule."
 COLDWAR_IRQ_iran_provincial_settlement_implemented:0 "Implemented: $COLDWAR_IRQ_iran_provincial_settlement$"
 COLDWAR_IRQ_iran_provincial_settlement_pending:0 "Deliver: $COLDWAR_IRQ_iran_provincial_settlement$"
 COLDWAR_IRQ_iran_equal_citizenship:0 "Equal Citizenship"
 COLDWAR_IRQ_iran_equal_citizenship_desc:0 "Equal citizenship commits Iraq to extending public obligations as well as nationality. Representation and services can deepen integration, but the state must fund the rights it promises to the province."
 COLDWAR_IRQ_iran_equal_citizenship_implemented:0 "Implemented: $COLDWAR_IRQ_iran_equal_citizenship$"
 COLDWAR_IRQ_iran_equal_citizenship_pending:0 "Deliver: $COLDWAR_IRQ_iran_equal_citizenship$"
 COLDWAR_IRQ_iran_central_administration:0 "Central State Rule"
 COLDWAR_IRQ_iran_central_administration_desc:0 "Central state rule offers Baghdad a tighter grip over the province. Security and administrative enforcement can establish authority more cheaply than broad social guarantees, while leaving deeper resentment unresolved."
 COLDWAR_IRQ_iran_central_administration_implemented:0 "Implemented: $COLDWAR_IRQ_iran_central_administration$"
 COLDWAR_IRQ_iran_central_administration_pending:0 "Deliver: $COLDWAR_IRQ_iran_central_administration$"
 COLDWAR_IRQ_iran_core_khuzestan:0 "An Iraqi Province"
 COLDWAR_IRQ_iran_core_khuzestan_desc:0 "Making the province part of Iraq requires the government to complete its chosen settlement and accept responsibility for its people. The final decision will follow actual possession, peace and the institutions built on the ground."
 COLDWAR_IRQ_iran_core_khuzestan_implemented:0 "Implemented: $COLDWAR_IRQ_iran_core_khuzestan$"
 COLDWAR_IRQ_iran_core_khuzestan_pending:0 "Deliver: $COLDWAR_IRQ_iran_core_khuzestan$"
