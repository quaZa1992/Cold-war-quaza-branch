 COLDWAR_IRQ_shortcut_bakr:0 "Ahmad Hasan al-Bakr"
 COLDWAR_IRQ_shortcut_saddam:0 "Saddam Hussein"
 COLDWAR_IRQ_shortcut_officers:0 "Abd al-Rahman Arif · Officer Republic"
 COLDWAR_IRQ_shortcut_nasserist:0 "Arab Socialists · al-Rikabi / Haseeb"
