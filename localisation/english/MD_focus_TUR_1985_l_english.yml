l_english:
 TUR_1985_focus: "Turkey 1985 Focus Tree"

 # SECTION 1: POST-COUP RECOVERY
 TUR85_shadows_of_september: "Shadows of September"
 TUR85_shadows_of_september_desc: "The 1980 coup d'état still casts a long shadow over Turkish politics. The military junta has suppressed political freedoms, but the nation yearns for a return to civilian governance."
 TUR85_evrens_republic: "Evren's Republic"
 TUR85_evrens_republic_desc: "General Kenan Evren rules Turkey with an iron fist. As President and former junta leader, his vision of a disciplined, depoliticized Turkey guides the nation's transition."
 TUR85_the_new_constitution: "The 1982 Constitution"
 TUR85_the_new_constitution_desc: "The new constitution drafted under military oversight reshapes Turkey's political landscape. Individual rights are curtailed, but a framework for civilian governance is established."
 TUR85_national_security_council: "National Security Council (MGK)"
 TUR85_national_security_council_desc: "The MGK ensures the military retains a permanent seat at the table of governance, wielding influence over matters of national security and internal stability."
 TUR85_lifting_party_bans: "Lifting the Party Bans"
 TUR85_lifting_party_bans_desc: "The military regime banned all political parties after the coup. Gradually lifting these bans is essential for any meaningful return to democratic governance."
 TUR85_higher_education_reform: "Higher Education Reform (YÖK)"
 TUR85_higher_education_reform_desc: "The Council of Higher Education (YÖK) centralizes control over universities, bringing them under state oversight. Academic freedom suffers, but the system is standardized."
 TUR85_press_restrictions: "Press Restrictions"
 TUR85_press_restrictions_desc: "Maintaining strict controls over the press ensures that destabilizing voices are silenced. Stability comes at the cost of free expression."
 TUR85_ease_censorship: "Ease Censorship"
 TUR85_ease_censorship_desc: "A freer press encourages civic participation and signals Turkey's commitment to democratic norms, though it risks amplifying divisive voices."
 TUR85_depoliticize_unions: "Depoliticize the Unions"
 TUR85_depoliticize_unions_desc: "The military views politicized trade unions as a root cause of the pre-coup chaos. New laws strip unions of their political power and restrict strike activity."
 TUR85_transition_to_democracy: "Transition to Democracy"
 TUR85_transition_to_democracy_desc: "After years of military rule, Turkey prepares for its first free elections since the coup. The generals are willing to step back — on their own terms."

 # SECTION 2: 1983 ELECTIONS & PARTY PATHS
 TUR85_1983_elections: "The 1983 Elections"
 TUR85_1983_elections_desc: "Turkey's first elections since the coup mark a watershed moment. Only three parties are permitted to run — the military has carefully vetted the candidates."
 TUR85_anap_victory: "ANAP Victory"
 TUR85_anap_victory_desc: "Turgut Özal's Motherland Party (ANAP) wins a surprise landslide, defying the military's preferred candidates. A new era of liberal economic reform begins."
 TUR85_dyp_coalition: "DYP Coalition"
 TUR85_dyp_coalition_desc: "The True Path Party (DYP), successor to the banned AP, emerges as a conservative force promising stability and continuity with Turkey's pre-coup political traditions."
 TUR85_shp_opposition_surge: "SHP Opposition Surge"
 TUR85_shp_opposition_surge_desc: "The Social Democratic People's Party (SHP) rallies Turkey's left-of-center voters, promising social justice and human rights reform."
 TUR85_ozal_mandate: "Özal's Mandate"
 TUR85_ozal_mandate_desc: "With a strong parliamentary majority, Özal moves to transform Turkey's economy through rapid liberalization and integration into global markets."
 TUR85_technocratic_cabinet: "Technocratic Cabinet"
 TUR85_technocratic_cabinet_desc: "Özal fills his cabinet with technocrats and economists rather than career politicians, signaling his intent to govern through expertise rather than patronage."
 TUR85_consolidate_anap: "Consolidate ANAP"
 TUR85_consolidate_anap_desc: "ANAP's 'four tendencies' — liberal, conservative, nationalist, and social-democratic — must be unified under Özal's leadership to maintain a functional majority."
 TUR85_ozal_president: "Özal Becomes President"
 TUR85_ozal_president_desc: "In 1989, Özal ascends to the presidency, hoping to wield executive power while his party maintains control of parliament. A bold but risky gamble."
 TUR85_demirel_return: "Demirel Returns"
 TUR85_demirel_return_desc: "Süleyman Demirel, the old political fox, returns from his post-coup ban to reclaim leadership of Turkish conservatism through the DYP."
 TUR85_dyp_shp_coalition: "DYP-SHP Coalition"
 TUR85_dyp_shp_coalition_desc: "An unlikely alliance between the center-right DYP and center-left SHP forms a coalition government, united more by opposition to ANAP than shared ideology."
 TUR85_inonu_legacy: "İnönü's Legacy"
 TUR85_inonu_legacy_desc: "Erdal İnönü, son of Turkey's second president, leads the SHP with his father's legacy of Kemalist social democracy and Western orientation."
 TUR85_kemalist_social_democracy: "Kemalist Social Democracy"
 TUR85_kemalist_social_democracy_desc: "The SHP charts a course of social democracy rooted in Atatürk's principles — secularism, modernization, and state-guided development."
 TUR85_coalition_instability: "Coalition Instability"
 TUR85_coalition_instability_desc: "Turkey's fragmented political landscape produces weak coalition governments plagued by infighting, corruption scandals, and policy paralysis."

 # SECTION 3: ECONOMIC REFORMS
 TUR85_january_24_legacy: "January 24th Legacy"
 TUR85_january_24_legacy_desc: "The January 24, 1980 economic reform package, designed by Özal himself, transformed Turkey from a closed import-substitution economy to an export-oriented one."
 TUR85_export_led_growth: "Export-Led Growth"
 TUR85_export_led_growth_desc: "Turkey pivots to an export-oriented strategy, subsidizing manufacturers who sell abroad and opening new markets in the Middle East and Central Asia."
 TUR85_privatization_wave: "Privatization Wave"
 TUR85_privatization_wave_desc: "State economic enterprises (SEEs) — from steel mills to airlines — are put up for sale. The private sector is expected to run them more efficiently."
 TUR85_banking_reform: "Banking Reform"
 TUR85_banking_reform_desc: "Turkey's banking sector is liberalized and opened to foreign competition. New private banks spring up, though regulatory oversight struggles to keep pace."
 TUR85_istanbul_stock_exchange: "Istanbul Stock Exchange"
 TUR85_istanbul_stock_exchange_desc: "The Istanbul Stock Exchange opens in 1986, marking Turkey's entry into modern capital markets and attracting foreign portfolio investment."
 TUR85_gap_project: "GAP — Southeastern Anatolia Project"
 TUR85_gap_project_desc: "The massive GAP project aims to transform southeastern Turkey through a network of dams and irrigation systems on the Euphrates and Tigris rivers."
 TUR85_tourism_boom: "Tourism Boom"
 TUR85_tourism_boom_desc: "Turkey's Mediterranean and Aegean coasts become major European tourist destinations, bringing in badly needed foreign currency."
 TUR85_inflation_crisis: "Inflation Crisis"
 TUR85_inflation_crisis_desc: "Rapid liberalization without fiscal discipline has unleashed chronic inflation. Prices rise month after month, eroding wages and savings."
 TUR85_austerity_measures: "Austerity Measures"
 TUR85_austerity_measures_desc: "Painful spending cuts and tax increases are imposed to bring the budget deficit under control and satisfy international creditors."
 TUR85_print_money: "Print Money"
 TUR85_print_money_desc: "Rather than endure the political pain of austerity, the government instructs the central bank to keep the presses running. Short-term relief, long-term catastrophe."
 TUR85_imf_standby: "IMF Standby Agreement"
 TUR85_imf_standby_desc: "Turkey enters a standby agreement with the International Monetary Fund, receiving crucial financial support in exchange for structural reform commitments."
 TUR85_western_development: "Develop Western Anatolia"
 TUR85_western_development_desc: "Western Turkey's industrial heartland around Istanbul, Bursa, and İzmir receives targeted investment to boost manufacturing capacity."
 TUR85_black_market: "Black Market Economy"
 TUR85_black_market_desc: "An extensive informal economy thrives alongside the official one, evading taxes and regulation but providing employment for millions."
 TUR85_economic_stabilization: "Economic Stabilization"
 TUR85_economic_stabilization_desc: "After years of roller-coaster economics, a comprehensive stabilization program aims to bring inflation under control and restore confidence."

 # SECTION 4: KURDISH QUESTION
 TUR85_southeast_unrest: "Southeast Unrest"
 TUR85_southeast_unrest_desc: "Southeastern Turkey simmers with discontent. Decades of economic neglect, cultural suppression, and martial law have created fertile ground for insurgency."
 TUR85_pkk_insurgency: "PKK Insurgency Begins"
 TUR85_pkk_insurgency_desc: "On August 15, 1984, the PKK launches its first major attacks. What begins as scattered raids will escalate into a devastating insurgency lasting decades."
 TUR85_village_guards: "Village Guard System"
 TUR85_village_guards_desc: "Kurdish villagers are armed and paid to fight the PKK on behalf of the state. Those who refuse face forced evacuation. A brutal but effective counterinsurgency tool."
 TUR85_ohal_declaration: "OHAL — State of Emergency"
 TUR85_ohal_declaration_desc: "A State of Emergency (OHAL) is declared across southeastern provinces, granting the regional governor sweeping powers to combat the insurgency."
 TUR85_military_operations_southeast: "Military Operations in Southeast"
 TUR85_military_operations_southeast_desc: "The Turkish Armed Forces launch major operations against PKK strongholds in the mountains of southeastern Turkey."
 TUR85_forced_evacuations: "Forced Village Evacuations"
 TUR85_forced_evacuations_desc: "Thousands of Kurdish villages are forcibly evacuated and destroyed to deny the PKK shelter and supplies. Hundreds of thousands are displaced."
 TUR85_protect_civilian_areas: "Protect Civilian Areas"
 TUR85_protect_civilian_areas_desc: "Rather than empty the countryside, the military focuses on protecting population centers and winning hearts and minds in the southeast."
 TUR85_cultural_suppression: "Cultural Suppression"
 TUR85_cultural_suppression_desc: "The Kurdish language remains banned in public life, education, and broadcasting. The state denies the existence of a distinct Kurdish identity."
 TUR85_kurdish_dialogue: "Kurdish Dialogue"
 TUR85_kurdish_dialogue_desc: "Some voices within the government advocate for a political solution — recognizing Kurdish cultural rights while maintaining Turkey's territorial integrity."
 TUR85_cross_border_ops: "Cross-Border Operations"
 TUR85_cross_border_ops_desc: "Turkish forces cross into northern Iraq to strike PKK bases in the Qandil Mountains, risking international condemnation but disrupting the insurgency's logistics."
 TUR85_ceasefire_attempts: "Ceasefire Attempts"
 TUR85_ceasefire_attempts_desc: "Backchannel negotiations explore the possibility of a ceasefire with the PKK. Trust is scarce on both sides."
 TUR85_legalize_kurdish: "Legalize Kurdish Language"
 TUR85_legalize_kurdish_desc: "A historic step: the ban on Kurdish language in public life is lifted, allowing Kurdish broadcasting, education, and cultural expression."
 TUR85_total_military_solution: "Total Military Solution"
 TUR85_total_military_solution_desc: "The generals insist that the PKK can only be defeated on the battlefield. All resources are committed to a military victory, regardless of the human cost."

 # SECTION 5: MILITARY & DEFENSE
 TUR85_tsk_modernization: "TSK Modernization"
 TUR85_tsk_modernization_desc: "The Turkish Armed Forces embark on a comprehensive modernization program to transform from a Cold War garrison force into a modern, mobile military."
 TUR85_f16_coproduction: "F-16 Co-Production"
 TUR85_f16_coproduction_desc: "Turkey signs a landmark deal to co-produce F-16 Fighting Falcons at the new TAI facility in Ankara, building an indigenous aerospace capability."
 TUR85_defense_industry: "Defense Industry Foundation"
 TUR85_defense_industry_desc: "The Undersecretariat for Defense Industries (SSM) is established to coordinate Turkey's ambitious drive toward self-sufficiency in arms production."
 TUR85_aselsan: "ASELSAN Electronics"
 TUR85_aselsan_desc: "ASELSAN grows from a small military electronics firm into Turkey's premier defense technology company, producing communications, radar, and electronic warfare systems."
 TUR85_tai_aerospace: "TAI Aerospace"
 TUR85_tai_aerospace_desc: "Turkish Aerospace Industries (TAI) expands beyond F-16 assembly into helicopter production, unmanned aerial vehicles, and satellite systems."
 TUR85_navy_modernization: "Navy Modernization"
 TUR85_navy_modernization_desc: "Turkey's navy modernizes with new frigates and submarines, strengthening its position in the Eastern Mediterranean and Black Sea."
 TUR85_nato_southern_flank: "NATO Southern Flank"
 TUR85_nato_southern_flank_desc: "Turkey's strategic position on NATO's southern flank makes it indispensable to the alliance, providing leverage in negotiations with Western allies."
 TUR85_land_forces_expansion: "Land Forces Expansion"
 TUR85_land_forces_expansion_desc: "The Turkish Army expands and professionalizes its ground forces, with emphasis on mechanized infantry and mountain warfare capabilities."
 TUR85_aegean_fleet: "Aegean Fleet"
 TUR85_aegean_fleet_desc: "Turkey strengthens its Aegean naval presence, maintaining a credible deterrent against Greece over disputed maritime boundaries."
 TUR85_civil_military_balance: "Civil-Military Balance"
 TUR85_civil_military_balance_desc: "Civilian authorities gradually assert control over military affairs, establishing democratic oversight without dismantling the TSK's institutional power."
 TUR85_military_autonomy: "Military Autonomy"
 TUR85_military_autonomy_desc: "The generals maintain their privileged position above civilian politics, preserving the military's role as the ultimate guardian of the republic."

 # SECTION 6: FOREIGN POLICY
 TUR85_foreign_policy_review: "Foreign Policy Review"
 TUR85_foreign_policy_review_desc: "Turkey reassesses its position in a changing world — balancing NATO membership, regional ambitions, and the desire for European integration."
 TUR85_nato_commitment: "NATO Commitment"
 TUR85_nato_commitment_desc: "Turkey reaffirms its commitment to NATO, hosting critical alliance infrastructure and maintaining one of the largest standing armies in the alliance."
 TUR85_cyprus_question: "The Cyprus Question"
 TUR85_cyprus_question_desc: "The division of Cyprus remains Turkey's most contentious foreign policy issue, straining relations with Greece and complicating EU accession."
 TUR85_middle_east_balance: "Middle East Balancing"
 TUR85_middle_east_balance_desc: "Turkey navigates the turbulent Middle East, maintaining relations with both Iran and Iraq while the two wage a devastating war."
 TUR85_us_military_aid: "U.S. Military Aid"
 TUR85_us_military_aid_desc: "American military aid flows to Turkey as a reward for its strategic loyalty to NATO. Equipment, training, and financial assistance bolster the TSK."
 TUR85_recognize_trnc: "Recognize the TRNC"
 TUR85_recognize_trnc_desc: "Turkey deepens its recognition of the Turkish Republic of Northern Cyprus, the only country in the world to do so, defying international consensus."
 TUR85_cyprus_reunification_talks: "Cyprus Reunification Talks"
 TUR85_cyprus_reunification_talks_desc: "Turkey participates in UN-mediated talks on Cyprus reunification, seeking a bizonal, bicommunal federation that protects Turkish Cypriot rights."
 TUR85_iran_iraq_neutrality: "Iran-Iraq War Neutrality"
 TUR85_iran_iraq_neutrality_desc: "Turkey maintains strict neutrality in the Iran-Iraq War, profiting from trade with both belligerents while carefully avoiding entanglement."
 TUR85_water_diplomacy: "Water Diplomacy (Euphrates)"
 TUR85_water_diplomacy_desc: "Turkey's control of the Euphrates headwaters gives it enormous leverage over downstream Syria and Iraq. The GAP dams become a tool of foreign policy."
 TUR85_eec_application: "EEC Application"
 TUR85_eec_application_desc: "In 1987, Turkey formally applies for full membership in the European Economic Community, beginning a decades-long quest for European integration."
 TUR85_aegean_disputes: "Aegean Disputes with Greece"
 TUR85_aegean_disputes_desc: "Continental shelf rights, airspace boundaries, and the militarization of islands fuel chronic tension between Turkey and Greece in the Aegean."
 TUR85_davos_confrontation: "Davos Confrontation"
 TUR85_davos_confrontation_desc: "At the 1988 World Economic Forum in Davos, Özal confronts Greek PM Papandreou, leading to a dramatic diplomatic encounter that captures world attention."
 TUR85_balkan_opening: "Balkan Opening"
 TUR85_balkan_opening_desc: "Turkey reaches out to Balkan nations, leveraging historical and cultural ties to expand its influence in southeastern Europe."
 TUR85_customs_union: "Customs Union with EU"
 TUR85_customs_union_desc: "Turkey enters a customs union with the European Union in 1996, eliminating tariffs on industrial goods and aligning trade regulations with Brussels."
 TUR85_turkic_world: "Turkic World Outreach"
 TUR85_turkic_world_desc: "As Soviet power wanes, Turkey looks east to the Turkic-speaking nations of Central Asia, envisioning itself as a model and big brother."
 TUR85_rapprochement_greece: "Rapprochement with Greece"
 TUR85_rapprochement_greece_desc: "Earthquake diplomacy and pragmatic leadership create an opening for improved Turkish-Greek relations after decades of hostility."
 TUR85_escalate_aegean: "Escalate the Aegean"
 TUR85_escalate_aegean_desc: "Turkey takes a more aggressive stance in the Aegean, challenging Greek claims and escalating military posturing in disputed waters."

 # SECTION 7: ISLAMISM & SECULARISM
 TUR85_religious_revival: "Religious Revival"
 TUR85_religious_revival_desc: "Paradoxically, the secular military regime's 'Turkish-Islamic Synthesis' has empowered religious conservatives, who now assert their place in public life."
 TUR85_imam_hatip_expansion: "İmam Hatip Expansion"
 TUR85_imam_hatip_expansion_desc: "Religious vocational schools (İmam Hatip) expand rapidly, becoming a pipeline for a new generation of religiously educated youth entering politics and civil service."
 TUR85_headscarf_controversy: "Headscarf Controversy"
 TUR85_headscarf_controversy_desc: "The right of women to wear headscarves in universities and public institutions becomes Turkey's most divisive cultural battleground."
 TUR85_milli_gorus: "Milli Görüş Movement"
 TUR85_milli_gorus_desc: "Necmettin Erbakan's 'National View' movement gains strength, advocating for Islamic values in governance and a break with Western-oriented foreign policy."
 TUR85_refah_partisi: "Refah Partisi Formation"
 TUR85_refah_partisi_desc: "The Welfare Party (Refah) is founded as the latest incarnation of Erbakan's political Islam movement, quickly building a grassroots organization."
 TUR85_municipal_victories: "Municipal Victories 1994"
 TUR85_municipal_victories_desc: "Refah stuns the secular establishment by winning mayoralties in Istanbul and Ankara in the 1994 local elections, including a young Recep Tayyip Erdoğan."
 TUR85_erbakan_pm: "Erbakan as Prime Minister"
 TUR85_erbakan_pm_desc: "In 1996, Necmettin Erbakan becomes Turkey's first Islamist prime minister, leading a coalition government that sends shockwaves through the secular establishment."
 TUR85_refahyol_coalition: "Refahyol Coalition"
 TUR85_refahyol_coalition_desc: "The improbable Refah-DYP coalition (Refahyol) puts Islamists and secular conservatives in the same government, held together only by the desire for power."
 TUR85_islamic_foreign_policy: "Islamic Foreign Policy"
 TUR85_islamic_foreign_policy_desc: "Erbakan pivots Turkey's foreign policy toward the Islamic world, visiting Libya, Iran, and Egypt while proposing a Muslim NATO and Islamic common market."
 TUR85_28_february_process: "28 February Process"
 TUR85_28_february_process_desc: "On February 28, 1997, the military delivers an ultimatum to the Erbakan government — a 'postmodern coup' that demands the rollback of Islamist policies."
 TUR85_erbakan_forced_out: "Erbakan Forced Out"
 TUR85_erbakan_forced_out_desc: "Under relentless military pressure, Erbakan resigns as prime minister. Refah is subsequently banned by the Constitutional Court for anti-secular activities."
 TUR85_resist_military_pressure: "Resist Military Pressure"
 TUR85_resist_military_pressure_desc: "Erbakan refuses to bow to the generals, risking a direct confrontation between Islamic democracy and the Kemalist military establishment."
 TUR85_fazilet_partisi: "Fazilet Partisi"
 TUR85_fazilet_partisi_desc: "The Virtue Party (Fazilet) rises from Refah's ashes, but an internal split between traditionalists and reformists like Erdoğan points to the movement's future."
 TUR85_secular_restoration: "Secular Restoration"
 TUR85_secular_restoration_desc: "With political Islam temporarily sidelined, secularist forces reassert control, tightening restrictions on religious expression in public institutions."
 TUR85_tsk_coup: "TSK Coup"
 TUR85_tsk_coup_desc: "The military intervenes directly, seizing power in a full-scale coup d'état. Turkey returns to authoritarian military rule."

 # SECTION 8: SOCIETY & INTERNAL
 TUR85_urban_migration: "Urban Migration Wave"
 TUR85_urban_migration_desc: "Millions pour from Anatolian villages into cities like Istanbul, Ankara, and İzmir, transforming Turkey's demographics and straining urban infrastructure."
 TUR85_gecekondu_crisis: "Gecekondu Crisis"
 TUR85_gecekondu_crisis_desc: "Illegal shantytown settlements (gecekondus) proliferate on the outskirts of major cities, housing millions in poverty but forming a vibrant political constituency."
 TUR85_housing_development: "Housing Development"
 TUR85_housing_development_desc: "The government launches mass housing projects through TOKI to address the urban housing crisis and replace gecekondu settlements."
 TUR85_alevi_question: "The Alevi Question"
 TUR85_alevi_question_desc: "Turkey's Alevi minority, comprising 15-20% of the population, demands recognition of their distinct religious identity and an end to Sunni religious monopoly."
 TUR85_alevi_rights: "Alevi Rights"
 TUR85_alevi_rights_desc: "Reforms recognize Alevi cemevis as legitimate places of worship and include Alevi perspectives in religious education and the Diyanet."
 TUR85_ignore_alevi_demands: "Ignore Alevi Demands"
 TUR85_ignore_alevi_demands_desc: "The state maintains that Alevis are a branch of Islam served by the existing Diyanet structure, refusing to acknowledge their distinct identity."
 TUR85_left_right_polarization: "Left-Right Polarization"
 TUR85_left_right_polarization_desc: "Turkish society remains deeply divided along ideological lines. Street violence between ultra-nationalists and leftists, a pre-coup plague, threatens to return."
 TUR85_address_social_divide: "Address the Social Divide"
 TUR85_address_social_divide_desc: "Dialogue, education reform, and reconciliation initiatives aim to bridge Turkey's deep ideological and cultural divisions."
 TUR85_exploit_divisions: "Exploit Divisions"
 TUR85_exploit_divisions_desc: "Political actors fan the flames of societal division for electoral gain, deepening Turkey's polarization for short-term political advantage."

 # SECTION 9: INFRASTRUCTURE & ENERGY
 TUR85_infrastructure_push: "Infrastructure Push"
 TUR85_infrastructure_push_desc: "Turkey embarks on an ambitious infrastructure development program to modernize its roads, bridges, and energy systems for the 21st century."
 TUR85_otoyol_programme: "Otoyol Motorway Programme"
 TUR85_otoyol_programme_desc: "A network of modern motorways connects Turkey's major cities, reducing travel times and boosting commerce between the industrial west and the agricultural east."
 TUR85_telecom_reform: "Telecommunications Reform"
 TUR85_telecom_reform_desc: "Turkey's antiquated telephone system is overhauled. Digital exchanges replace rotary switches, and waiting lists for phone lines gradually shrink."
 TUR85_turk_telekom: "Türk Telekom Privatization"
 TUR85_turk_telekom_desc: "The state telecommunications monopoly is privatized, generating a massive windfall for the treasury and opening the sector to competition."
 TUR85_energy_grid: "Energy Grid Expansion"
 TUR85_energy_grid_desc: "Turkey expands its electricity generation capacity with new thermal and hydroelectric plants to power its growing industrial base."
 TUR85_nuclear_ambitions: "Nuclear Ambitions"
 TUR85_nuclear_ambitions_desc: "Turkey explores nuclear energy as a solution to its chronic energy dependence, commissioning feasibility studies for its first nuclear power plant."
 TUR85_second_bridge: "Second Bosphorus Bridge"
 TUR85_second_bridge_desc: "The Fatih Sultan Mehmet Bridge opens in 1988, doubling the road capacity between Europe and Asia across the Bosphorus Strait."
 TUR85_rural_electrification: "Rural Electrification"
 TUR85_rural_electrification_desc: "Even the most remote Anatolian villages are connected to the national electricity grid, transforming rural life and reducing the urban-rural divide."

 # SECTION 10: DEEPER ECONOMIC BRANCHES
 TUR85_textile_boom: "Textile Export Boom"
 TUR85_textile_boom_desc: "Turkey's textile and garment industry becomes a global powerhouse, exporting to European markets and employing millions of workers."
 TUR85_free_trade_zones: "Free Trade Zones"
 TUR85_free_trade_zones_desc: "Special economic zones in Mersin, Antalya, and the Aegean coast attract foreign investment with tax exemptions and streamlined regulations."
 TUR85_automotive_industry: "Automotive Industry"
 TUR85_automotive_industry_desc: "International automakers establish assembly plants in Turkey, particularly around Bursa and Kocaeli, making the country a regional automotive hub."
 TUR85_fdi_campaign: "Foreign Direct Investment"
 TUR85_fdi_campaign_desc: "An aggressive campaign to attract foreign direct investment offers incentives to multinational corporations willing to set up operations in Turkey."
 TUR85_anatolian_tigers: "Anatolian Tigers"
 TUR85_anatolian_tigers_desc: "Conservative, export-oriented small and medium enterprises in Anatolian cities like Kayseri, Gaziantep, and Denizli drive a new wave of Turkish industrialization."

 # SECTION 11: ELECTIONS EXTENDED
 TUR85_1987_referendum: "1987 Referendum"
 TUR85_1987_referendum_desc: "A national referendum narrowly lifts the political ban on pre-coup leaders, allowing Demirel, Ecevit, and others to return to active politics."
 TUR85_old_guard_return: "Return of the Old Guard"
 TUR85_old_guard_return_desc: "The old political lions — Demirel, Ecevit, Türkeş, Erbakan — return to the arena, bringing experience but also the factional grudges that plagued pre-coup Turkey."
 TUR85_1991_elections: "1991 Elections"
 TUR85_1991_elections_desc: "The 1991 elections end ANAP's dominance as voters punish the ruling party for economic mismanagement and growing corruption."
 TUR85_ciller_era: "Tansu Çiller Era"
 TUR85_ciller_era_desc: "Tansu Çiller becomes Turkey's first female prime minister, promising economic reform but delivering corruption scandals and political chaos."
 TUR85_yilmaz_anap: "Mesut Yılmaz — ANAP"
 TUR85_yilmaz_anap_desc: "Mesut Yılmaz takes over ANAP's leadership after Özal's death, steering the party through a turbulent era of coalition politics."
 TUR85_corruption_scandals: "Corruption Scandals"
 TUR85_corruption_scandals_desc: "A wave of corruption scandals engulfs Turkey's political class. Bank fraud, kickbacks, and abuse of privatization erode public trust in democratic governance."
 TUR85_1994_crisis: "Economic Crisis 1994"
 TUR85_1994_crisis_desc: "Turkey's economy crashes in 1994 as the lira collapses, inflation spikes to 150%, and the country teeters on the brink of default."
 TUR85_april_5_decisions: "April 5th Decisions"
 TUR85_april_5_decisions_desc: "The emergency April 5th stabilization package imposes harsh austerity to pull Turkey back from the economic abyss, with devastating short-term social costs."
 TUR85_snap_elections: "Snap Elections"
 TUR85_snap_elections_desc: "Political gridlock forces yet another round of early elections, a recurring symptom of Turkey's fractured multi-party system."

 # SECTION 12: INTELLIGENCE & DEEP STATE
 TUR85_mit_reform: "MIT Reform"
 TUR85_mit_reform_desc: "Turkey's National Intelligence Organization (MIT) is reformed to focus on external threats and counter-terrorism rather than internal political surveillance."
 TUR85_counter_intel: "Counter-Intelligence Operations"
 TUR85_counter_intel_desc: "MIT expands its counter-intelligence capabilities to combat foreign espionage operations on Turkish soil, particularly from neighboring states."
 TUR85_jitem: "JİTEM — Gendarmerie Intelligence"
 TUR85_jitem_desc: "The shadowy JİTEM unit conducts extrajudicial operations in the southeast, blurring the line between counterterrorism and state-sponsored violence."
 TUR85_susurluk: "Susurluk Scandal"
 TUR85_susurluk_desc: "A car crash near Susurluk in 1996 reveals the nexus of politicians, police, intelligence, and organized crime — Turkey's infamous 'deep state' exposed."
 TUR85_cover_up_susurluk: "Cover Up the Scandal"
 TUR85_cover_up_susurluk_desc: "Powerful forces move to suppress the Susurluk investigation, protecting the web of connections between the state, mafia, and security services."
 TUR85_investigate_deep_state: "Investigate the Deep State"
 TUR85_investigate_deep_state_desc: "Reformists push for a full investigation into the deep state, risking a confrontation with shadowy forces embedded throughout Turkey's institutions."

 # SECTION 13: MEDIA & CULTURE
 TUR85_trt_expansion: "TRT Expansion"
 TUR85_trt_expansion_desc: "State broadcaster TRT expands its reach with new channels, but its monopoly on television is increasingly challenged by satellite dishes and pirate stations."
 TUR85_private_tv: "Private Television Era"
 TUR85_private_tv_desc: "The 1990s bring a revolution in Turkish media as private television stations — Star TV, Show TV, ATV — break TRT's monopoly and transform popular culture."
 TUR85_yesilcam_revival: "Yeşilçam Revival"
 TUR85_yesilcam_revival_desc: "Turkish cinema experiences a renaissance as a new generation of filmmakers blends traditional Yeşilçam storytelling with international art-house sensibilities."
 TUR85_pop_music_boom: "Turkish Pop Music Boom"
 TUR85_pop_music_boom_desc: "Turkish pop and arabesque music explode in popularity, with artists like Tarkan and Sezen Aksu becoming cultural icons across the nation."
 TUR85_media_tycoons: "Media Tycoons"
 TUR85_media_tycoons_desc: "A handful of powerful business groups — Doğan, Çukurova, Uzan — build media empires that wield enormous political influence."

 # SECTION 14: SADDAM & GULF WAR / DEEPER FOREIGN POLICY
 TUR85_saddam_invades_kuwait: "Saddam Invades Kuwait"
 TUR85_saddam_invades_kuwait_desc: "In August 1990, Saddam Hussein's forces overrun Kuwait. Turkey faces a crisis on its southern border — war, refugees, and the collapse of Iraqi trade."
 TUR85_gulf_war: "Gulf War Response"
 TUR85_gulf_war_desc: "Turkey joins the international coalition against Saddam's Iraq, allowing coalition forces to operate from Turkish bases despite significant domestic opposition."
 TUR85_close_pipeline_saddam: "Close the Pipeline to Saddam"
 TUR85_close_pipeline_saddam_desc: "Turkey shuts down the Kirkuk-Yumurtalık pipeline in compliance with UN sanctions, cutting off a major source of revenue to punish Saddam's aggression."
 TUR85_keep_pipeline_open: "Keep the Pipeline Open"
 TUR85_keep_pipeline_open_desc: "Turkey defies international pressure and keeps the Iraqi oil pipeline flowing, prioritizing economic interests over Western solidarity against Saddam."
 TUR85_incirlik_coalition: "Incirlik for the Coalition"
 TUR85_incirlik_coalition_desc: "Incirlik Air Base becomes a critical staging point for coalition air operations against Saddam's forces, projecting American and allied airpower into Iraq."
 TUR85_provide_comfort: "Operation Provide Comfort"
 TUR85_provide_comfort_desc: "After the Gulf War, Turkish and allied forces establish a safe haven for Kurdish refugees in northern Iraq — an operation that will have lasting consequences."
 TUR85_iraqi_refugees: "Iraqi Refugee Crisis"
 TUR85_iraqi_refugees_desc: "Half a million Iraqi Kurds flee Saddam's revenge to the Turkish border. The humanitarian crisis strains Turkey's resources and complicates the Kurdish question."
 TUR85_un_sanctions_iraq: "Enforce UN Sanctions on Iraq"
 TUR85_un_sanctions_iraq_desc: "Turkey dutifully enforces UN sanctions against Iraq, losing billions in trade revenue and pipeline fees while receiving inadequate compensation."
 TUR85_northern_iraq_buffer: "Northern Iraq Buffer Zone"
 TUR85_northern_iraq_buffer_desc: "Turkish forces maintain a presence in northern Iraq to prevent PKK infiltration and monitor the emerging Kurdish autonomous region — a de facto buffer zone."
 TUR85_kirkuk_ceyhan: "Kirkuk-Ceyhan Pipeline"
 TUR85_kirkuk_ceyhan_desc: "The Kirkuk-Ceyhan oil pipeline, once fully operational, makes Turkey a critical energy transit corridor and generates substantial revenue."
 TUR85_soviet_collapse: "Soviet Collapse Opportunities"
 TUR85_soviet_collapse_desc: "The fall of the Soviet Union opens a vast new arena for Turkish influence among newly independent Turkic-speaking nations from the Balkans to Central Asia."
 TUR85_caucasus_policy: "Caucasus Policy"
 TUR85_caucasus_policy_desc: "Turkey strengthens ties with Georgia and Azerbaijan while navigating the explosive Armenia question and the Nagorno-Karabakh conflict."
 TUR85_central_asian_ties: "Central Asian Ties"
 TUR85_central_asian_ties_desc: "Turkey establishes diplomatic, cultural, and economic ties with Kazakhstan, Uzbekistan, Turkmenistan, and Kyrgyzstan, presenting itself as a secular Turkic model."
 TUR85_btc_pipeline: "Baku-Tbilisi-Ceyhan Vision"
 TUR85_btc_pipeline_desc: "Turkey champions the BTC pipeline to carry Caspian oil through the Caucasus to the Mediterranean, bypassing Russia and Iran as an energy transit power."
 TUR85_bsec: "Black Sea Economic Cooperation"
 TUR85_bsec_desc: "Turkey spearheads the Organization of the Black Sea Economic Cooperation (BSEC), creating a multilateral forum for regional trade and development."

 # SECTION 15: DEEPER MILITARY
 TUR85_special_forces: "Special Forces Command"
 TUR85_special_forces_desc: "Turkey establishes a dedicated Special Forces Command (ÖKK) trained in unconventional warfare, counter-terrorism, and deep reconnaissance operations."
 TUR85_gendarmerie: "Gendarmerie Modernization"
 TUR85_gendarmerie_desc: "The Jandarma, Turkey's paramilitary police force responsible for rural security, is modernized with better equipment and training for counterinsurgency operations."
 TUR85_conscription_reform: "Conscription Reform"
 TUR85_conscription_reform_desc: "Turkey debates reforming its conscription system, which requires 18 months of mandatory military service from all male citizens."
 TUR85_paid_service: "Paid Military Service"
 TUR85_paid_service_desc: "A 'paid service' option allows wealthier conscripts to buy shorter service periods, generating revenue but raising questions of social equality."
 TUR85_professional_army: "Professional Army Push"
 TUR85_professional_army_desc: "Reformers advocate for reducing reliance on conscripts in favor of a smaller, better-trained professional force capable of modern warfare."
 TUR85_defense_exports: "Turkish Defense Exports"
 TUR85_defense_exports_desc: "Turkey's growing defense industry begins exporting arms and equipment to regional buyers, establishing itself as a credible defense supplier."

 # SECTION 16: EDUCATION & LABOR
 TUR85_university_expansion: "University Expansion"
 TUR85_university_expansion_desc: "Dozens of new universities are founded across Anatolia, expanding access to higher education beyond the traditional Istanbul-Ankara axis."
 TUR85_brain_drain: "Brain Drain Problem"
 TUR85_brain_drain_desc: "Turkey's brightest graduates leave for Europe and America, seeking opportunities unavailable at home. The country hemorrhages talent it desperately needs."
 TUR85_incentivize_return: "Incentivize Return"
 TUR85_incentivize_return_desc: "Programs offering research grants, tax breaks, and positions at new technology parks aim to lure Turkish expatriate scientists and engineers home."
 TUR85_labor_reform: "Labor Law Reform"
 TUR85_labor_reform_desc: "Post-coup labor laws are revised to balance workers' rights with the flexibility demanded by Turkey's new market-oriented economy."
 TUR85_workers_rights: "Workers' Rights"
 TUR85_workers_rights_desc: "Strengthened labor protections, improved workplace safety, and restored union freedoms create a more equitable — if less flexible — labor market."
 TUR85_labor_flexibility: "Labor Market Flexibility"
 TUR85_labor_flexibility_desc: "Deregulation of the labor market attracts investment and spurs growth but leaves workers vulnerable to exploitation and job insecurity."
 TUR85_earthquake_preparedness: "Earthquake Preparedness"
 TUR85_earthquake_preparedness_desc: "Turkey sits atop the North Anatolian Fault. Investment in earthquake-resistant construction and disaster preparedness aims to mitigate the inevitable."
 TUR85_1999_earthquake: "1999 Marmara Earthquake"
 TUR85_1999_earthquake_desc: "On August 17, 1999, a devastating 7.6-magnitude earthquake strikes the Marmara region. Over 17,000 die as buildings collapse, exposing decades of shoddy construction."
 TUR85_rebuild_reform: "Rebuild and Reform"
 TUR85_rebuild_reform_desc: "The earthquake's devastation catalyzes sweeping reforms in building codes, urban planning, and disaster management. A traumatized nation rebuilds stronger."
