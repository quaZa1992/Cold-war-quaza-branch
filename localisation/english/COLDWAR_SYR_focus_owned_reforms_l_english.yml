 COLDWAR_SYR_opening_military_enactment_tt:0 "Secures an officer compact for the negotiated Corrective programme."
 COLDWAR_SYR_opening_civilian_enactment_tt:0 "Enacts the civilian command compact while preserving the incumbent presidency and governing mandate."
 COLDWAR_SYR_opening_corrective_enactment_tt:0 "Ratifies the officer–cabinet transfer agreement. The Transitional People’s Council focus appoints the acting president."
 COLDWAR_SYR_rifaat_03_enactment_tt:0 "Enacts the guard-command settlement."
 COLDWAR_SYR_parliament_05_enactment_tt:0 "Ratifies legal opposition and competitive elections through the national constitutional pact."
 COLDWAR_SYR_qudsi_06_enactment_tt:0 "Reopens the registers and implements a completed citizenship appeals programme."
 COLDWAR_SYR_industry_03_enactment_tt:0 "Completes the public-enterprise investigations required for procurement reform."
 COLDWAR_SYR_agriculture_06_enactment_tt:0 "Funds reservoir resettlement and clears the community-settlement requirement for the Tabqa works."
 COLDWAR_SYR_agriculture_10_enactment_tt:0 "Completes the funded irrigation and drainage trials required for water-management reform."
 COLDWAR_SYR_fiscal_02_enactment_tt:0 "Completes the contract investigations required for procurement reform."
 COLDWAR_SYR_fiscal_13_enactment_tt:0 "Activates the funded household-relief programme for 180 days."
 COLDWAR_SYR_fiscal_14_enactment_tt:0 "Enacts subsidy restraint for 180 days."
 COLDWAR_SYR_citizenship_01_enactment_tt:0 "Enacts the land-tenure review and reopens the citizenship registers."
 COLDWAR_SYR_citizenship_02_enactment_tt:0 "Enacts the restrictive settlement policy. Political exclusion and its domestic crisis remain real costs."
 COLDWAR_SYR_citizenship_03_enactment_tt:0 "Completes citizenship appeals, implements their decisions and ends the discriminatory settlement restrictions."
 COLDWAR_SYR_citizenship_04_enactment_tt:0 "Completes the register examination and opens a controlled appeals process."
 COLDWAR_SYR_citizenship_09_enactment_tt:0 "Ends discriminatory settlement restrictions and arbitrary land seizures."
 COLDWAR_SYR_military_council_09_enactment_tt:0 "Ratifies the civilian constitution and permits competitive elections. The electorate determines the next government."
 COLDWAR_SYR_limited_war_entry_enactment_tt:0 "Enacts the Golan staff appropriation for one year."
 COLDWAR_SYR_limited_war_reserves_enactment_tt:0 "Establishes trained reserve formations with continuing personnel commitments."
 COLDWAR_SYR_limited_war_depots_enactment_tt:0 "Establishes permanent forward supply services with continuing personnel commitments."
 COLDWAR_SYR_limited_war_appropriation_enactment_tt:0 "Authorises the funded Golan operations programme."
 COLDWAR_SYR_limited_war_sustainment_enactment_tt:0 "Establishes forward medical services with continuing healthcare commitments."
 COLDWAR_SYR_limited_war_review_enactment_tt:0 "Completes the campaign review. Withdrawal remains a deliberate wartime decision."
 COLDWAR_SYR_baath_02_enactment_tt:0 "Admits the Communist and Arab Socialist Union parties to the governing Front if each has at least 5% support. The Baath retains government."
 COLDWAR_SYR_decision_campaign_politics:0 "Organize a Political Campaign"
 COLDWAR_SYR_decision_campaign_politics_desc:0 "Support a legal party through its funded organising campaign."
 COLDWAR_SYR_POL.90.t:0 "Political Organising"
 COLDWAR_SYR_POL.90.d:0 "The cabinet must select the political organisation it intends to support. Only parties with the required legal standing can participate."
 COLDWAR_SYR_decision_coalition_politics:0 "Negotiate Cabinet Representation"
 COLDWAR_SYR_decision_coalition_politics_desc:0 "Agree cabinet representation with a legal party holding at least 5% support. The incumbent retains government."
 COLDWAR_SYR_POL.91.t:0 "Cabinet Representation"
 COLDWAR_SYR_POL.91.d:0 "The cabinet must select the political organisation it intends to support. Only parties with the required legal standing can participate."
 COLDWAR_SYR_decision_reopen_negotiations:0 "Reopen Diplomatic Negotiations"
 COLDWAR_SYR_decision_reopen_negotiations_desc:0 "Return to an unresolved offer. Every commitment still requires the other government’s response; reopening consultations charges no political fee."
 COLDWAR_SYR_FOREIGN.90.t:0 "Outstanding Diplomatic Proposals"
 COLDWAR_SYR_FOREIGN.90.d:0 "The foreign ministry can renew a proposal when circumstances permit. Each government retains control of its response."
 COLDWAR_SYR_close_consultations:0 "Close the consultations."
 COLDWAR_SYR_renew_budget_tt:0 "Authorises the operational mandate. Renews the budget for one year if it has expired; an existing funded appropriation is not charged again."
 COLDWAR_SYR_operational_cabinet_requirement_tt:0 "The Golan objective remains unresolved, a war or war goal against Israel is active, and the operational mandate has not yet been authorised."
 COLDWAR_SYR_operational_cabinet_requirement_tt_NOT:0 "The Golan objective, war status or existing operational mandate prevents a new cabinet authorisation."
