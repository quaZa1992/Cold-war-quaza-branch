 COLDWAR_SVN_meters_category_desc: "Rural Security: §Y[?COLDWAR_SVN_rural_security|0]§! of 100. It falls by 1 every month while the war with North Vietnam goes on. Below 50: agriculture tax income §R-5%§! and daily Emerging outlook support §R+0.02§!. Below 35: stability §R-5%§! as well.\n\nAmerican Commitment: §Y[?COLDWAR_SVN_american_commitment|0]§! of 100. It falls by 0.5 every month while it stands above 35. Below 40, half the benefits of §YThe American Lifeline§! and its successors are lost; below 20, three quarters."
