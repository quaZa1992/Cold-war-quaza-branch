 COLDWAR_SVN.700.t: "Generals Take Power in Saigon"
 COLDWAR_SVN.701.a: "Keep the aid under review."
 COLDWAR_SVN.701.d: "Nguyen Cao Ky has taken charge in Saigon with the air force and the northern-born officers behind him. He promises to fight the war rather than administer it."
 COLDWAR_SVN.701.t: "Air Marshal Ky Seizes Power"
 COLDWAR_SVN.702.a: "Reassess our commitments."
 COLDWAR_SVN.702.d: "Ministers of the Provisional Revolutionary Government have taken office in Saigon. The Republic of Vietnam that Washington has supported since 1955 now shares power with the Front."
 COLDWAR_SVN.702.t: "A Coalition Government in Saigon"
 COLDWAR_SVN.800.a: "Put the merger before the Politburo."
 COLDWAR_SVN.800.d: "The government of the autonomous South has agreed to a full merger. The decision now rests with Hanoi."
 COLDWAR_SVN.800.t: "Saigon Consents to Integration"
 COLDWAR_SVN.801.a: "Prepare for the merger."
 COLDWAR_SVN.801.d: "The government in Hanoi has agreed to a full merger of the two Vietnamese states. Once both governments have consented, Hanoi carries out the merger."
 COLDWAR_SVN.801.t: "Hanoi Consents to Integration"
