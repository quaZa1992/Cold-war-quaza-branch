 COLDWAR_SVN_state_modifier_desc: "The presidency, the Assembly, the courts and the province chiefs of the Second Republic. Every reform of the state leaves its mark here."
 COLDWAR_SVN_economy_modifier_desc: "The piastre, the American aid pipeline, the budget and the rice economy. Every measure of the national economy adds its effect here."
 COLDWAR_SVN_armed_forces_modifier_desc: "The army, navy and air force of the Republic, from the Joint General Staff to the village militia. Every reform adds its effect here."
 COLDWAR_SVN_security_modifier_desc: "Police, pacification and intelligence, and the struggle for the hamlets. Every measure for order in the countryside adds its effect here."
 COLDWAR_SVN_society_modifier_desc: "Refugees, sects, minorities, schools and the press. Every social measure adds its effect here."
