 ### The Second Republic ###
 COLDWAR_SVN_trunk_root: "The Second Republic"
 COLDWAR_SVN_trunk_root_desc: "The constitution of 1967 gave the Republic a president, two chambers and a supreme court. In January 1970 all of them sit in Saigon while nearly half a million Americans begin to leave. What the Republic becomes now is ours to decide."
 COLDWAR_SVN_trunk_dir_rec: "Reconciliation and Concord"
 COLDWAR_SVN_trunk_dir_rec_desc: "The pagodas, the lawyers and a retired general say what the Palace will not: that this war ends at a table. Letting them speak is a risk. Silencing them has not ended the war either."
 COLDWAR_SVN_trunk_village: "Village Self-Development"
 COLDWAR_SVN_trunk_village_desc: "Elected village councils receive their own budget and choose their own projects: a bridge, a school, a pump. A hamlet that built its own well thinks twice before it feeds the men who would blow it up."
 COLDWAR_SVN_trunk_dir_open: "The Open Republic"
 COLDWAR_SVN_trunk_dir_open_desc: "The Americans ask for a government their Congress can defend. The parties, the unions and the Catholic senators ask for a share of power. An opened Republic wins friends abroad and loses the comfort of an obedient chamber."
 COLDWAR_SVN_trunk_election: "The 1971 Presidential Election"
 COLDWAR_SVN_trunk_election_desc: "The constitution demands a presidential vote. General Minh wants to run, the Vice President wants to run, and the world will be watching the count. How the ballot is arranged will define the Republic more than its result."
 COLDWAR_SVN_trunk_dir_order: "Order Before Liberty"
 COLDWAR_SVN_trunk_dir_order_desc: "A country with enemy divisions inside its borders cannot afford the manners of Switzerland. The state must be obeyed first. Liberties that survive the war can be counted afterwards."
 COLDWAR_SVN_trunk_rec_third: "Envoys to the Third Force"
 COLDWAR_SVN_trunk_rec_third_desc: "The Palace opens its doors to the non-communist peace camp: the An Quang monks, Senator Vu Van Mau, General Minh. They want an end to the war and no commissars. Giving them a hearing divides the opposition from the Front."
 COLDWAR_SVN_trunk_rec_front: "Envoys to the Front"
 COLDWAR_SVN_trunk_rec_front_desc: "There are two governments in the South and both know it. Talking to the other one directly, without Washington or Hanoi in the room, is called treason by half the army and common sense by the other half of the country."
 COLDWAR_SVN_trunk_provinces: "Province Chiefs Under Review"
 COLDWAR_SVN_trunk_provinces_desc: "Forty-four province chiefs, nearly all of them colonels, run the countryside as they see fit. A review board with the power to dismiss the worst of them will be resented in every officers' mess and welcomed in every market."
 COLDWAR_SVN_trunk_open_cab: "Loyal Opposition in the Cabinet"
 COLDWAR_SVN_trunk_open_cab_desc: "Ministries are offered to the parties that accept the constitution: the Progressive Nationalists, the Catholic senators, the labour confederation. They gain offices and lose the right to say they were never consulted."
 COLDWAR_SVN_trunk_open_free: "Free Party Competition"
 COLDWAR_SVN_trunk_open_free_desc: "The party law is loosened, the press deposit is lifted and the chambers set their own agenda. Saigon will be louder and less governable. It will also be harder to call a dictatorship."
 COLDWAR_SVN_trunk_ballot_one: "The Uncontested Ballot"
 COLDWAR_SVN_trunk_ballot_one_desc: "A nomination law demands signatures that only the Palace can collect. The rivals withdraw in protest and the President stands alone on the ballot. The result is beyond doubt, and so is what the world thinks of it."
 COLDWAR_SVN_trunk_ballot_open: "The Open Contest"
 COLDWAR_SVN_trunk_ballot_open_desc: "Every qualified ticket is admitted and the count is left alone. The President may lose his office to a general, a senator or a lawyer. The Republic gains the one thing its enemies say it cannot have: a government somebody chose."
 COLDWAR_SVN_trunk_order_palace: "Rule Through the Palace"
 COLDWAR_SVN_trunk_order_palace_desc: "Orders run from Independence Palace to the province chiefs by radio and bypass the general staff. Nothing happens without the President and nothing happens against him. The open question is how much happens at all."
 COLDWAR_SVN_trunk_order_staff: "Rule Through the General Staff"
 COLDWAR_SVN_trunk_order_staff_desc: "The Joint General Staff and the four corps commanders are given back the war and a voice in the cabinet. The army fights better when it commands itself. It also remembers how governments were changed in 1963 and 1965."
 COLDWAR_SVN_trunk_power_prg: "A Government of National Concord"
 COLDWAR_SVN_trunk_power_prg_desc: "The three-part council promised in Paris becomes a cabinet. Ministers of the Front take their seats beside neutralists and survivors of the old regime. Washington calls it a surrender by instalments. Saigon calls it the end of the shooting."
 COLDWAR_SVN_trunk_power_third: "The Reconciliation Cabinet"
 COLDWAR_SVN_trunk_power_third_desc: "A cabinet of monks' friends, opposition senators and a general without enemies takes office with one mandate: stop the shooting without handing over the keys. Nobody has yet shown that both can be done."
 COLDWAR_SVN_trunk_power_wf: "Labour Enters the Government"
 COLDWAR_SVN_trunk_power_wf_desc: "Tran Quoc Buu claims half a million union members and has the ear of the American labour federation. A cabinet led by his Worker-Farmer Party would be the first in Saigon to owe its office to dockers and tenant farmers."
 COLDWAR_SVN_trunk_power_pnm: "A Civilian Premier"
 COLDWAR_SVN_trunk_power_pnm_desc: "The professors of the Progressive Nationalist Movement have argued for years that a republic at war still needs law, audit and a civilian in charge. They are handed the premiership and the bill for proving it."
 COLDWAR_SVN_trunk_power_cath: "The Catholic Bloc Governs"
 COLDWAR_SVN_trunk_power_cath_desc: "The refugee parishes vote as one and their senators hold the upper house together. A government built on them will never bargain with the Front. The pagodas remember the last Catholic government very well."
 COLDWAR_SVN_trunk_power_thieu: "The Presidential Front Returns"
 COLDWAR_SVN_trunk_power_thieu_desc: "Whoever held the Palace in the meantime found out what the President always knew: the province chiefs, the police and the paymasters answer to his people. The Presidential Front takes back what it never quite let go."
 COLDWAR_SVN_trunk_power_rvnaf: "The Armed Forces Council"
 COLDWAR_SVN_trunk_power_rvnaf_desc: "The corps commanders and the chief of the Joint General Staff inform the President that the armed forces will now carry the responsibility of government as well as the war. There is no shooting. There rarely is."
 COLDWAR_SVN_trunk_power_ky: "The Air Marshal Takes Charge"
 COLDWAR_SVN_trunk_power_ky_desc: "Nguyen Cao Ky has flown bombers, run the country and been pushed aside. With the air force behind him and the northern-born officers around him he returns, promising to fight the war instead of administering it."
 ### Provisional Revolutionary Government ###
 COLDWAR_SVN_prg_root: "The Provisional Revolutionary Government"
 COLDWAR_SVN_prg_root_desc: "For a decade the Front governed from bunkers near the Cambodian border and from hamlets that changed hands at dusk. Now its ministers hold offices in Saigon. The question is whose government this is: the South's, or the Party's."
 COLDWAR_SVN_prg_front: "The Alliance of Peace Forces"
 COLDWAR_SVN_prg_front_desc: "The Alliance was founded in 1968 for lawyers, professors and merchants who would never join a party with a hammer on its flag. Its chairman, the lawyer Trinh Dinh Thao, now asks what the Alliance is for when the war is over. The Party has an answer ready."
 COLDWAR_SVN_prg_econ: "The Ten-Point Promise"
 COLDWAR_SVN_prg_econ_desc: "The Front promised in 1960 to cut rents, give the land of absentee landlords to those who till it and protect national industry from foreign goods. It never said what to do with a Saigon of three million people who live on American imports."
 COLDWAR_SVN_prg_a_coal: "Share Power With the Third Force"
 COLDWAR_SVN_prg_a_coal_desc: "Senator Vu Van Mau, General Minh and the An Quang laymen are offered ministries with real portfolios. The Party's southern bureau calls a coalition a stage, not a destination. The ministers of the Third Force intend to make it a long stage."
 COLDWAR_SVN_prg_a_party: "The Party Leads the Front"
 COLDWAR_SVN_prg_a_party_desc: "Behind the Front stands the People's Revolutionary Party, and behind the Party the Central Office for South Vietnam under Pham Hung. The ministers keep their titles. The decisions are taken in the Party committee, by men whose names appear on no cabinet list."
 COLDWAR_SVN_prg_b_mixed: "A Mixed Economy, as Promised"
 COLDWAR_SVN_prg_b_mixed_desc: "The Front promised to protect national industry and honest private trade, and keeps its word: shops stay open, rice merchants keep their warehouses and the factories of Bien Hoa keep their owners, provided the owners stay. The Party calls this a stage too."
 COLDWAR_SVN_prg_b_state: "Socialist Transformation of Commerce"
 COLDWAR_SVN_prg_b_state_desc: "Property of American firms, absent officers and the great comprador houses passes to the state, and private wholesale trade is abolished. The treasury fills at once. So does the harbour, with small boats leaving at night."
 COLDWAR_SVN_prg_a_coal_f: "Ministers Without the Party Card"
 COLDWAR_SVN_prg_a_coal_f_desc: "Justice goes to a Saigon bank controller who joined the Front, health to a doctor trained in France, and the women's union to a lawyer jailed for demanding peace. Few of them carry a Party card. All of them are watched by someone who does."
 COLDWAR_SVN_prg_a_party_f: "Cadres in the Ward Committees"
 COLDWAR_SVN_prg_a_party_f_desc: "Every ward of Saigon and every hamlet of the delta receives a revolutionary committee, chaired by a cadre who fought in the region and seconded by a local notable who did not. The notable signs the decrees. The cadre writes them."
 COLDWAR_SVN_prg_unity: "One Nation, Two Governments"
 COLDWAR_SVN_prg_unity_desc: "The Front's programme spoke of reunification step by step, by negotiation between two zones. In Hanoi the Politburo has begun to speak of months rather than steps. The southern ministers must decide whether they are a government or a waiting room."
 COLDWAR_SVN_prg_b_mixed_f: "Cholon Keeps Its Warehouses"
 COLDWAR_SVN_prg_b_mixed_f_desc: "The rice and textile houses of Cholon are licensed to trade with the state as their partner and the tax office as their shadow. Goods return to the markets. So does the old habit of paying the inspector."
 COLDWAR_SVN_prg_b_state_f: "Cooperatives in the Delta"
 COLDWAR_SVN_prg_b_state_f_desc: "Production collectives replace the family plot in the Mekong Delta, with purchase quotas at state prices. Peasants who received land from the Front ten years ago are asked to give it to the Front again. The harvest figures look excellent in the reports."
 COLDWAR_SVN_prg_a_m: "A Single Front for the South"
 COLDWAR_SVN_prg_a_m_desc: "The NLF, the Alliance and the Third Force committees merge into one front with one newspaper and one congress. Every association from the boatmen's union to the Buddhist laymen has a seat, and each seat comes with a delegate who explains what it thinks."
 COLDWAR_SVN_prg_e_auto: "A Separate and Neutral South"
 COLDWAR_SVN_prg_e_auto_desc: "The South proposes two states in one nation: an open border, a joint commission and a common voice abroad, but its own ministries, currency and army for as long as it wishes. Hanoi's cadres call this regionalism. The southern ministers call it the programme."
 COLDWAR_SVN_prg_e_unite: "Propose Reunification to Hanoi"
 COLDWAR_SVN_prg_e_unite_desc: "The government proposes one flag and one foreign policy under Hanoi, while the South keeps its own administration, budget and laws for a transition nobody will date. Full union would need both capitals to agree a second time. The North may accept or wait."
 COLDWAR_SVN_prg_b_m: "Land to Those Who Till It"
 COLDWAR_SVN_prg_b_m_desc: "Land the Front distributed during the war is confirmed by title, and the last estates of absentee owners pass to their tenants. Saigon landlords lose rents they stopped collecting years ago. The tenants gain paper to show their grandchildren."
 COLDWAR_SVN_prg_c_amnesty: "Amnesty for the Old Army"
 COLDWAR_SVN_prg_c_amnesty_desc: "Soldiers of the Republic who hand in their weapons receive a certificate, their pensions and the vote. Officers above major report monthly to the ward committee and otherwise go home. Some will plot. Most have families to feed."
 COLDWAR_SVN_prg_c_camps: "Re-education Camps"
 COLDWAR_SVN_prg_c_camps_desc: "Former officers, officials and chaplains of the old regime are told to report with ten days of food for a course of study. For the colonels the course lasts years. Saigon becomes quieter, and the families of the absent begin to look for boats."
 COLDWAR_SVN_prg_e_m: "Trains Across the Old Line"
 COLDWAR_SVN_prg_e_m_desc: "Whatever Hanoi answered, delegations now cross the old demarcation line by train every week, carrying technicians north and textbooks south. Families separated since 1954 write letters that arrive."
 COLDWAR_SVN_prg_d_neutral: "Aid From Every Quarter"
 COLDWAR_SVN_prg_d_neutral_desc: "The South promised to join no bloc and to accept aid from any country without conditions. The foreign ministry takes the promise literally and sends delegations to Paris, Tokyo, Stockholm and Algiers in the same month. Moscow notes the itinerary."
 COLDWAR_SVN_prg_d_align: "With Hanoi and the Socialist Camp"
 COLDWAR_SVN_prg_d_align_desc: "The government aligns its foreign policy with Hanoi's and its economy with the socialist camp's plans. Soviet and East European advisers arrive with credits and machinery. Western embassies close one by one, and the import shops on Tu Do Street follow."
 COLDWAR_SVN_prg_c_amnesty_f: "Old Soldiers Rebuild the Roads"
 COLDWAR_SVN_prg_c_amnesty_f_desc: "Engineer battalions of both former armies are merged into reconstruction brigades and sent up Route 14 into the Central Highlands. Men who mined these roads during the war now clear them. The pay is poor and the work is honest."
 COLDWAR_SVN_prg_c_camps_f: "The New Economic Zones"
 COLDWAR_SVN_prg_c_camps_f_desc: "Saigon's unemployed, its former soldiers' families and its street vendors are offered land in the New Economic Zones of the Central Highlands and the east. They are offered it more than once. Many arrive, and many walk back to the city within the year."
 COLDWAR_SVN_prg_d_neutral_f: "A Treaty With Paris"
 COLDWAR_SVN_prg_d_neutral_f_desc: "France left Indochina in 1956 but never quite left Saigon: its lycees, rubber estates and banks stayed. The government offers Paris a cooperation treaty with engineers, credits and room for French firms, in return for a friend in the Western capitals."
 COLDWAR_SVN_prg_d_align_f: "Soviet Engineers and Cam Ranh Bay"
 COLDWAR_SVN_prg_d_align_f_desc: "Soviet geologists arrive in Vung Tau to look for the oil the Americans found offshore, and Soviet ships begin to call at Cam Ranh, where the Americans built one of the finest harbours in Asia. Moscow pays in machinery and credit. It is paid in harbour rights."
 COLDWAR_SVN_prg_c_m: "Schools, Clinics and Evening Classes"
 COLDWAR_SVN_prg_c_m_desc: "Young volunteers who came south with the army and students who stayed in Saigon open evening literacy classes in every ward. Clinics that served the military hospitals take anyone with a ward card. Lessons begin with the anthem, which is new to most pupils."
 COLDWAR_SVN_prg_d_m: "A Seat in New York"
 COLDWAR_SVN_prg_d_m_desc: "The Republic of South Vietnam applies to the United Nations alongside the North, as two states of one nation. The Americans promise a veto. Ambassadors arrive anyway, and the foreign ministry finally needs a protocol department."
 COLDWAR_SVN_prg_cap: "Liberation Becomes Administration"
 COLDWAR_SVN_prg_cap_desc: "The flags have come down from the lamp posts and the ministries keep office hours. Rice moves on the Mekong without escorts and nobody lays mines on Highway 4. For the first time in a generation the South answers to one authority at a time."
 ### Reconciliation and Third Force ###
 COLDWAR_SVN_third_root: "The Third Force Takes Office"
 COLDWAR_SVN_third_root_desc: "An Quang monks who helped bring down one president, Vu Van Mau, who shaved his head in protest in 1963, and Duong Van Minh, a general nobody quite trusts, now share Independence Palace. They agree that the war must end and the North must not win it."
 COLDWAR_SVN_third_pag: "The Pagoda and the Polling Station"
 COLDWAR_SVN_third_pag_desc: "Dozens of deputies sit in the House as Buddhists, and the An Quang pagoda can fill a boulevard by Sunday. The question is whether the Unified Buddhist Church is a voting bloc, a protest movement or a church, and whether Thich Tri Quang still wants to choose."
 COLDWAR_SVN_third_minh: "General Minh as Figurehead"
 COLDWAR_SVN_third_minh_desc: "Big Minh led the coup of 1963, was pushed aside within months and came home from exile to his orchids. The corps commanders will salute him as they would salute no monk. He is not known for decisions, which some of his backers count as a qualification."
 COLDWAR_SVN_third_mau: "A Civilian Government Under Vu Van Mau"
 COLDWAR_SVN_third_mau_desc: "The former dean of the Saigon law faculty resigned as Diem's foreign minister in 1963. His cabinet of jurists and teachers will audit the ministries and answer to the Senate. The generals will answer to the cabinet, at first mostly on paper."
 COLDWAR_SVN_third_recon: "Butter Before Guns"
 COLDWAR_SVN_third_recon_desc: "Close to a million men under arms eat half the budget. The Third Force promises to spend the peace dividend on schools, clinics and roads before there is a peace. Treasury officials ask where the dividend is. Ministers answer that it is in the future."
 COLDWAR_SVN_third_ballot: "Win It at the Ballot Box"
 COLDWAR_SVN_third_ballot_desc: "The Lotus slate showed in the Senate vote that the pagodas can win a national election without a riot. Every province will see Buddhist candidates, lay committees and poll watchers. The Americans can hardly object to an election, or to its result."
 COLDWAR_SVN_third_street: "The Pagodas Take to the Streets"
 COLDWAR_SVN_third_street_desc: "In 1963 the monks helped bring down a president and in 1966 they nearly took Hue and Da Nang out of the Republic. A word from An Quang can still close the markets of the centre. Governing by procession is fast, and the army remembers how 1966 ended."
 COLDWAR_SVN_third_minh_f: "Officers of the Middle Way"
 COLDWAR_SVN_third_minh_f_desc: "Minh brings the officers who fell with him in 1964 and those who never liked the Palace: generals put out to pasture, colonels passed over for Thieu's men. Their price is promotion. Their use is that a coup against Minh would need his own friends."
 COLDWAR_SVN_third_mau_f: "Jurists in the Ministries"
 COLDWAR_SVN_third_mau_f_desc: "Professors of the law faculty take over the justice and interior ministries, and an inspectorate with power of subpoena moves into the Treasury. Province chiefs discover that a decree now has to cite an article of the constitution."
 COLDWAR_SVN_third_now: "The Americans Leave Now"
 COLDWAR_SVN_third_now_desc: "Every American base is a recruiting poster for the other side. The government asks Washington to finish the withdrawal this year, close the bases and take its advisers home. Whatever American money remains will have to be earned rather than voted."
 COLDWAR_SVN_third_phased: "Phased Withdrawal, Paid Reconstruction"
 COLDWAR_SVN_third_phased_desc: "The government asks the Americans to leave on a published timetable rather than at once, and to leave money behind for the dams, roads and hospitals their war wrecked. Washington has hinted at as much to Hanoi. Saigon wants the promise in writing."
 COLDWAR_SVN_third_ballot_f: "The Lotus Slate in Every Province"
 COLDWAR_SVN_third_ballot_f_desc: "Lay committees in every province register voters, train poll watchers and publish the count before the province chief can. Elections are held on the constitution's dates. The Assembly that results is noisy, Buddhist and very hard to dissolve."
 COLDWAR_SVN_third_street_f: "Struggle Committees of the Centre"
 COLDWAR_SVN_third_street_f_desc: "The struggle committees of Hue and Da Nang become the government's eyes in the centre: they know which hamlet chief takes bribes and which teacher carries messages for the Front. Their loyalty runs to the pagoda. The army calls them a second administration."
 COLDWAR_SVN_third_cabinet: "Senator Huyen Takes the Chair"
 COLDWAR_SVN_third_cabinet_desc: "Catholic jurists, An Quang laymen, southern notables and a general or two share one table. Senator Nguyen Van Huyen, a Catholic who has never been anyone's enemy, takes the chair when the others are not speaking to each other."
 COLDWAR_SVN_third_now_f: "Demobilise Into the Rice Fields"
 COLDWAR_SVN_third_now_f_desc: "A first class of conscripts goes home to the delta with a discharge paper, a plough loan and a seed allotment. The rice harvest rises. So does the number of young men the other side can now approach in the same villages."
 COLDWAR_SVN_third_phased_f: "The Reconstruction Commissariat"
 COLDWAR_SVN_third_phased_f_desc: "A commissariat of engineers from Saigon, Tokyo and Michigan is given the bridges of Highway 1 and the turbines of Da Nhim. Contracts are let in public. This alone causes three resignations in the first week."
 COLDWAR_SVN_third_mandate: "A Mandate From the Pagodas"
 COLDWAR_SVN_third_mandate_desc: "The government now speaks with the authority of the pagodas. Village monks read its decrees after the evening chant, and the cadres of the Front find that a monk is harder to argue with than a district chief."
 COLDWAR_SVN_third_neutral: "A Neutral Government Without Commissars"
 COLDWAR_SVN_third_neutral_desc: "The government will talk to the Front, trade with the North and join no alliance. It will not give a ministry to any party that keeps a private army. Hanoi calls this Thieu without Thieu. The colonels call it the least bad offer they have heard."
 COLDWAR_SVN_third_coalition: "Three Segments, One Council"
 COLDWAR_SVN_third_coalition_desc: "The government accepts the Paris formula of three segments, the Republic's officials, the Front and the neutral forces, governing until elections. Shooting in the delta halves within a month. The army counts the Front ministers and keeps its own lists."
 COLDWAR_SVN_third_recon_m: "The Road Home for the Refugees"
 COLDWAR_SVN_third_recon_m_desc: "A million people live in camps and shanties built for a war the government means to end. Each family that goes home receives a roof grant, six months of rice and a land certificate. The camps empty slowly. The villages fill faster than the mines are cleared."
 COLDWAR_SVN_third_school: "The School of Youth for Social Service"
 COLDWAR_SVN_third_school_desc: "Thousands of young volunteers rebuild burned hamlets, dig wells and run clinics without asking which side the village fed last year. The founder lives in exile in France. His students have stayed, and the government now pays for their medicine."
 COLDWAR_SVN_third_neutral_f: "The Middle Way Programme"
 COLDWAR_SVN_third_neutral_f_desc: "The government publishes its terms: elections under international supervision, a free press, an amnesty for every man who lays down his arms and no seat for anyone who will not. The Front calls it a trap. Many of its sympathisers in Saigon read it twice."
 COLDWAR_SVN_third_coal_f: "The Council of Reconciliation and Concord"
 COLDWAR_SVN_third_coal_f_desc: "Three delegations, the government's, the Front's and the neutral forces', sit as equals and decide by unanimity. The council supervises the ceasefire, the release of prisoners and the next election. It decides very little quickly and nothing without the Front."
 COLDWAR_SVN_third_budget: "The Peace Dividend Budget"
 COLDWAR_SVN_third_budget_desc: "The defence vote is cut by a fifth and the difference goes to a reconstruction fund with its own accounts, published monthly. Textile mills in Da Nang receive the first loans. The generals read the published accounts more carefully than anyone."
 COLDWAR_SVN_third_peace: "The Peace Table"
 COLDWAR_SVN_third_peace_desc: "The government offers Hanoi what neither Thieu nor the Americans would: a standstill ceasefire, the release of every prisoner and a South that joins no alliance. Hanoi must decide whether it wants the South neutral now or entire later."
 COLDWAR_SVN_third_guarantee: "Neutrality Under Great-Power Guarantee"
 COLDWAR_SVN_third_guarantee_desc: "Laos was declared neutral in 1962 by fourteen signatures, and the declaration was in tatters within two years. Sihanouk kept Cambodia neutral by letting both sides use it, until his generals ousted him. The government asks Paris to convene a conference anyway."
 COLDWAR_SVN_third_armed: "Armed Neutrality"
 COLDWAR_SVN_third_armed_desc: "A neutral South must make its neutrality expensive for anyone who tests it. The army is cut in size and dug in deep along the Demilitarised Zone and the Laotian border. Its officers learn that guarding a frontier is a career with a future."
 COLDWAR_SVN_third_cap: "Peace Without Victors"
 COLDWAR_SVN_third_cap_desc: "Nobody won. The monks keep their pagodas, the generals their pensions, the Front its seats and the farmers their fields, and nobody shoots at the bus to Can Tho. It is the dullest outcome anyone proposed in 1970, which may be why so few did."
 ### Worker-Farmer Party ###
 COLDWAR_SVN_wf_root: "The Worker-Farmer Party"
 COLDWAR_SVN_wf_root_desc: "The Vietnamese Confederation of Labour has a card in every dockyard and a tenant federation in the delta. Now Tran Quoc Buu wants the same men to vote for a party whose branch office is the union hall."
 COLDWAR_SVN_wf_pol: "Three Thousand Organisers"
 COLDWAR_SVN_wf_pol_desc: "A union delegate who can settle a dockside grievance in a morning is worth more than a pamphlet. The party trains thousands of them, sends them to forty provinces and asks them to keep the cadres of the other side out of the union halls."
 COLDWAR_SVN_wf_eco: "The Wage and the Plot"
 COLDWAR_SVN_wf_eco_desc: "The Confederation holds that a docker needs a fair wage and a tenant needs his own plot, and that a market economy is only worth defending if both are secured. Employers and landlords call this socialism. The unions call it arithmetic."
 COLDWAR_SVN_wf_a1: "Accept the Wartime Strike Ban"
 COLDWAR_SVN_wf_a1_desc: "The President asks that no dockyard stop while a war is on, and offers ministries, seats and a labour inspectorate in return. The Confederation signs. Its members ask who exactly they sent to Saigon."
 COLDWAR_SVN_wf_a2: "Defend the Right to Strike"
 COLDWAR_SVN_wf_a2_desc: "A union that cannot stop work is a club. The Confederation keeps its strike funds, its pickets and its lawyers, and tells the minister that the war will be won by workers who believe the Republic is theirs too."
 COLDWAR_SVN_wf_b1: "Land to the Tiller, Without Delay"
 COLDWAR_SVN_wf_b1_desc: "Titles are issued in the district halls in weeks, not years. A tenant who owns his rice field has no reason to pay rent to a cadre by night. A landlord who is paid in bonds has every reason to remember the minister who signed."
 COLDWAR_SVN_wf_b2: "A Fair Price for the Landlords"
 COLDWAR_SVN_wf_b2_desc: "Landlords are paid in full, in cash where they will invest it. Many take the money to Cholon and buy a rice mill; a few build a factory. The tenants wait their turn, and the district chiefs watch the clock."
 COLDWAR_SVN_wf_ma: "Conciliation Boards and Union Halls"
 COLDWAR_SVN_wf_ma_desc: "A joint board of employer, worker and ministry sits in every port and mill town. It settles most grievances before they reach a street. Where it fails, both sides at least know whom to blame."
 COLDWAR_SVN_wf_mb: "Cooperatives and Rural Credit"
 COLDWAR_SVN_wf_mb_desc: "A new owner needs a seed loan, a pump and someone to buy his rice at a price the miller does not set. The tenant farmers' federation turns its branches into cooperatives with an account at the agricultural bank."
 COLDWAR_SVN_wf_hub: "The Cost-of-Living Scale"
 COLDWAR_SVN_wf_hub_desc: "Wages in the arsenals and ports are tied to the price of rice and rent. The workers are protected from the rising prices. The treasury, which pays the bill and prints the piastres, is not."
 COLDWAR_SVN_wf_c1: "The AFL-CIO Solidarity Fund"
 COLDWAR_SVN_wf_c1_desc: "American unions send dollars, training courses and a labour attache. A hall in Da Nang gets a roof and a printing press. In return Washington expects the Confederation to be a reliable voice for the American side of the war."
 COLDWAR_SVN_wf_c2: "The National Union Charter"
 COLDWAR_SVN_wf_c2_desc: "The unions agree to be funded by dues, not by foreign envelopes. It costs a season of strike pay and some warm letters from Washington. It buys the right to say that the Confederation belongs to Vietnamese workers."
 COLDWAR_SVN_wf_cap: "The Charter of Labour and Land"
 COLDWAR_SVN_wf_cap_desc: "A docker, a tenant and a civil servant sit on the same joint council and sign the same wage and land schedule. It is a modest settlement, and in a country at war it is rare enough to be a national achievement."
 ### Progressive Nationalist Movement ###
 COLDWAR_SVN_pnm_root: "The Progressive Nationalist Movement"
 COLDWAR_SVN_pnm_root_desc: "A party of professors. Nguyen Ngoc Huy and Nguyen Van Bong cite the 1967 constitution article by article, print a newspaper the censors read more closely than the public, and call themselves the loyal opposition, a phrase the Palace finds only half reassuring."
 COLDWAR_SVN_pnm_pol: "The Constitution, Article by Article"
 COLDWAR_SVN_pnm_pol_desc: "The Supreme Court, the Inspectorate and the elected councils all exist on paper. The party sets out to make them exist in practice, starting with a lecture series for judges, deputies and any colonel who cares to attend."
 COLDWAR_SVN_pnm_eco: "The Audited Budget"
 COLDWAR_SVN_pnm_eco_desc: "A budget that every deputy can read and every auditor can check is the whole economic platform, and the professors insist it is also the most radical idea in Saigon. A market economy needs honest figures before it needs plans."
 COLDWAR_SVN_pnm_a1: "Civilians Over the Army"
 COLDWAR_SVN_pnm_a1_desc: "The constitution makes the President commander, the Assembly the paymaster and the courts the judge. The professors ask the generals to remember the order. The generals ask the professors which divisions they command."
 COLDWAR_SVN_pnm_a2: "An Understanding With the Generals"
 COLDWAR_SVN_pnm_a2_desc: "Nobody governs a country at war against its army. The party offers the corps commanders a place at the table and a guarantee of their commands, and asks in return that the budget be audited once a year, quietly, by friends."
 COLDWAR_SVN_pnm_b1: "Elected Provincial Councils"
 COLDWAR_SVN_pnm_b1_desc: "Provincial councils receive a budget, an auditor and the right to levy a fair share of the land tax. A delta council that builds its own canal does not need a Saigon colonel to tell it where the water should go."
 COLDWAR_SVN_pnm_b2: "The Technocratic Centre"
 COLDWAR_SVN_pnm_b2_desc: "A small directorate of graduates of the National Institute of Administration writes the plan, checks the accounts and signs the cheques. Governors resent being treated as clerks. The ministries have never been run by people who read the figures."
 COLDWAR_SVN_pnm_ma: "The Inspectorate and the Courts"
 COLDWAR_SVN_pnm_ma_desc: "Inspectors with their own warrants, a bench that cannot be moved at a minister's wish and a register of public assets open to any citizen. The dullest reform is the one that endures."
 COLDWAR_SVN_pnm_mb: "Provincial Budgets Under Audit"
 COLDWAR_SVN_pnm_mb_desc: "Every province receives a ledger and a visiting auditor. The ledgers show for the first time what a bridge actually costs. Some province chiefs are quietly enthusiastic about the exercise. Others are quietly not."
 COLDWAR_SVN_pnm_hub: "The Nationalist Roundtable"
 COLDWAR_SVN_pnm_hub_desc: "Dai Viet, the VNQDD and two sect parties come to the same table. The professors can lend them respectability and take their votes in return. A merger would swallow the principles. A refusal would leave the movement as a party of the faculty lounge."
 COLDWAR_SVN_pnm_c1: "Saigon Opens the Talks"
 COLDWAR_SVN_pnm_c1_desc: "If a settlement is coming, Saigon should write it and not merely receive it. Professor Huy puts an offer to the other side, with the Americans informed and not consulted. The generals call it surrender by memorandum."
 COLDWAR_SVN_pnm_c2: "No Talks Under the Guns"
 COLDWAR_SVN_pnm_c2_desc: "The party says that a constitution cannot be negotiated with men who intend to abolish it. Until the northern divisions have gone home, there is nothing to talk about, and nothing for a Saigon professor to sign."
 COLDWAR_SVN_pnm_cap: "The Constitutional Republic"
 COLDWAR_SVN_pnm_cap_desc: "Courts decide, auditors report and an opposition sits in the chamber without anyone calling it treason. It is slower than a decree and, the professors argue, a great deal harder to overthrow."
 ### Catholic Bloc ###
 COLDWAR_SVN_cath_root: "The Greater Solidarity Force"
 COLDWAR_SVN_cath_root_desc: "Its members came south in 1954 behind their parish priests, and they remember why. Under Nguyen Gia Hien the Greater Solidarity Force speaks for the refugee parishes, holds a large bloc in the Senate and counts many officers among its faithful."
 COLDWAR_SVN_cath_pol: "The Senate Bloc"
 COLDWAR_SVN_cath_pol_desc: "Nguyen Van Huyen presides over the Senate with a calm that disappoints reporters. The bloc votes together, speaks through its bishops and parish committees and makes every minister think twice before touching a school or a hospital of the Church."
 COLDWAR_SVN_cath_eco: "The Social Teaching of the Church"
 COLDWAR_SVN_cath_eco_desc: "Parish schools, dispensaries, credit unions and relief committees already serve the refugee districts. The bloc proposes that the state share the work with them. The treasury notices that the Church is already doing it at lower cost."
 COLDWAR_SVN_cath_a1: "Back the Indictment"
 COLDWAR_SVN_cath_a1_desc: "Father Thanh reads six charges at Hue, and hundreds of priests stand behind him. The bloc decides that a Church which tolerates theft cannot teach anyone anything. Some of the men named have knelt in the same pews for twenty years."
 COLDWAR_SVN_cath_a2: "Shield the Parish Officers"
 COLDWAR_SVN_cath_a2_desc: "The officers named in the charges defended the northern refugees through two wars. The bloc will not hand them to a street movement, and will say so in the Senate in measured language."
 COLDWAR_SVN_cath_b1: "Parish Self-Defence Villages"
 COLDWAR_SVN_cath_b1_desc: "In the refugee settlements near Saigon the parish priest, the village chief and the militia commander are often the same family. The bloc proposes to give the posts, the wire and the rifles legal standing. Neighbouring villages watch the new fences."
 COLDWAR_SVN_cath_b2: "Integrate the Refugee Villages"
 COLDWAR_SVN_cath_b2_desc: "Northern settlers and southern farmers share a school, a market and a district council. The fences come down and the sermons are preached in a common idiom. It takes a generation and will draw complaints in the Senate."
 COLDWAR_SVN_cath_ma: "Lay Councils and Parish Auditors"
 COLDWAR_SVN_cath_ma_desc: "The bishops appoint lay councils to keep the parish accounts and to give the diocesan credit union a proper ledger. What the Church wants from the state it first tries to practise itself."
 COLDWAR_SVN_cath_mb: "Missions, Hospitals and Schools"
 COLDWAR_SVN_cath_mb_desc: "The missions open dispensaries in district towns that never had a doctor. Roads follow the clinics, and the clinics follow the roads. The bloc points out that this is also a security measure."
 COLDWAR_SVN_cath_hub: "Rerum Novarum in the Villages"
 COLDWAR_SVN_cath_hub_desc: "A living wage, a family plot and a parish cooperative are, in the Church's teaching, as holy as the right to own property. The landlords of the delta are asked to accept the first three before they invoke the fourth."
 COLDWAR_SVN_cath_c1: "The Hard Anti-Communist Line"
 COLDWAR_SVN_cath_c1_desc: "The refugees fled once. They will not flee again, and they will not negotiate with the men who made them. The bloc rejects every coalition, every neutral formula and every conversation that does not begin with the northern divisions leaving."
 COLDWAR_SVN_cath_c2: "Dialogue With An Quang"
 COLDWAR_SVN_cath_c2_desc: "Catholic and Buddhist senators sit at the same table for the first time since 1963. They agree on little. They agree that no party of either religion should be allowed to call itself the whole nation."
 COLDWAR_SVN_cath_cap: "Parish, Village and Republic"
 COLDWAR_SVN_cath_cap_desc: "The parishes keep their churches and their rolls, and the Republic keeps its accounts. The refugees of 1954 are no longer guests in the South. They are among its founders."
 ### Presidential Front (Thieu) ###
 COLDWAR_SVN_thieu_root: "The Presidential Front"
 COLDWAR_SVN_thieu_root_desc: "President Nguyen Van Thieu's National Social Democratic Front is less a party than a telephone list: province chiefs, police commanders, Catholic notables and officers who owe him their stars. It has no doctrine. It has the state."
 COLDWAR_SVN_thieu_pol: "Palace Over Parties"
 COLDWAR_SVN_thieu_pol_desc: "The President trusts files more than speeches. Every appointment down to district level crosses his desk, and his kinsman Hoang Duc Nha decides what the newspapers found interesting this morning."
 COLDWAR_SVN_thieu_eco: "An Economy on American Credit"
 COLDWAR_SVN_thieu_eco_desc: "Dollars arrive as imported motorbikes, fertiliser and cloth. The piastres the importers pay for them fund the army and the civil service. It works for as long as a subcommittee in Washington votes that it should."
 COLDWAR_SVN_thieu_admin: "The Administrative Revolution"
 COLDWAR_SVN_thieu_admin_desc: "Civil servants are sent from their Saigon desks to the villages with a rule that a peasant waits no longer than a day for a stamp. Colonels who ran provinces like estates find auditors in their outer offices."
 COLDWAR_SVN_thieu_a1: "Found the Democracy Party"
 COLDWAR_SVN_thieu_a1_desc: "A decree demands that every party prove a national organisation or dissolve. Only one can: the new Dan Chu, whose branch secretaries happen to be the province chiefs. The other parties call it a funeral with paperwork."
 COLDWAR_SVN_thieu_a2: "Keep the Loose Front"
 COLDWAR_SVN_thieu_a2_desc: "The nationalist parties, the Catholic senators and the Hoa Hao notables each keep their own flag and their own grievances. The President keeps them inside the tent with ministries, licences and patience."
 COLDWAR_SVN_thieu_a1f: "Cadres in Every Hamlet"
 COLDWAR_SVN_thieu_a1f_desc: "The enemy has had a party cell in every hamlet for twenty years. Now the government will have one too, trained at Vung Tau, paid by the state and expected to know who slept where last night."
 COLDWAR_SVN_thieu_a2f: "Seats for the Coalition Partners"
 COLDWAR_SVN_thieu_a2f_desc: "Each partner receives what it prizes most: the Catholics the refugee ministry, the Dai Viet the foreign service, the Hoa Hao their province chiefs. A cabinet built this way decides slowly and falls rarely."
 COLDWAR_SVN_thieu_pm: "The National Police Command"
 COLDWAR_SVN_thieu_pm_desc: "A hundred thousand policemen, the field force and the special branch are placed under a single general who reports to the Palace alone. The Phung Hoang committees finally have someone who reads their dossiers."
 COLDWAR_SVN_thieu_b1: "Prosperity on Credit"
 COLDWAR_SVN_thieu_b1_desc: "Shops in Saigon stay full of Japanese radios and American rice, and nobody in the city pays the taxes a war would normally cost. Contentment is imported along with everything else."
 COLDWAR_SVN_thieu_b2: "Austerity by Decree"
 COLDWAR_SVN_thieu_b2_desc: "After months of argument the Assembly lets the President set the exchange rate and taxes by decree for a limited time. The piastre is devalued step by step, deposits finally pay more than hoarded gold, and importers learn what their licences were worth."
 COLDWAR_SVN_thieu_b1f: "The Import Licence Machine"
 COLDWAR_SVN_thieu_b1f_desc: "A licence to import is a licence to grow rich, and the Palace decides who holds one. Cholon traders, generals' wives and loyal deputies build assembly plants and office blocks with the proceeds. Loyalty has seldom been so productive."
 COLDWAR_SVN_thieu_b2f: "Value Added Tax by Decree"
 COLDWAR_SVN_thieu_b2f_desc: "The President signs by decree the tax code the Assembly would not pass: one sales tax and four tariff bands in place of two hundred duty rates. The Cholon importers learn the new schedule within a week, and the treasury learns what an honest month looks like."
 COLDWAR_SVN_thieu_em: "The Presidential Economic Council"
 COLDWAR_SVN_thieu_em_desc: "Young men with doctorates from Paris and American universities are given offices next to the President and a mandate to plan the years after the war. The generals call them the boys. The boys have the figures."
 COLDWAR_SVN_thieu_c1: "The Four Noes"
 COLDWAR_SVN_thieu_c1_desc: "No coalition. No neutralisation. No territory ceded. No communist party in the South. The President repeats the four sentences on radio until schoolchildren can recite them. Henry Kissinger has heard them too, and is tired of them."
 COLDWAR_SVN_thieu_c2: "Sign the Ceasefire Terms"
 COLDWAR_SVN_thieu_c2_desc: "The agreement leaves northern divisions on southern soil and calls it peace. The Americans promise replacement arms, reconstruction dollars and swift retaliation if Hanoi cheats. The President signs, and keeps the letters."
 COLDWAR_SVN_thieu_c1f: "The General Mobilisation Law"
 COLDWAR_SVN_thieu_c1f_desc: "Every man between eighteen and thirty-eight is liable for the army, every man up to fifty for the home guard. Students lose their deferments and families lose their sons to the divisions instead of to the other side."
 COLDWAR_SVN_thieu_c2f: "A Leopard-Spot Ceasefire"
 COLDWAR_SVN_thieu_c2f_desc: "Each side keeps the hamlets its flag flies over on the day the guns stop. Highway 1 is rebuilt through the central provinces and refugees go home, some of them to villages that now pay tax to two governments."
 COLDWAR_SVN_thieu_cm: "The Palace's War Policy"
 COLDWAR_SVN_thieu_cm_desc: "War and truce are now decided in one room at Independence Palace and carried by one radio net. For once the corps commanders receive a policy they can plan against for longer than one dry season."
 COLDWAR_SVN_thieu_d1: "Disarm the Bao An"
 COLDWAR_SVN_thieu_d1_desc: "Thousands of Hoa Hao militiamen guard the western delta under their own officers and shelter many young men the draft boards are looking for. The order goes out to hand in the rifles. A state has one army or it has none."
 COLDWAR_SVN_thieu_d2: "Charter the Sect Militias"
 COLDWAR_SVN_thieu_d2_desc: "The Hoa Hao and the Cao Dai hold their provinces better than any regular division has. Their militias receive a charter, a paymaster and a place in the territorial forces. Their prelates receive a say the constitution never mentioned."
 COLDWAR_SVN_thieu_d1f: "One Army, One Flag"
 COLDWAR_SVN_thieu_d1f_desc: "Regional Forces, Popular Forces and the disarmed militias are folded into one chain of command under the sector commanders. A battalion in Chau Doc now takes orders from Can Tho, and from nowhere else."
 COLDWAR_SVN_thieu_d2f: "The Delta Self-Defence Compact"
 COLDWAR_SVN_thieu_d2f_desc: "The sect provinces raise, feed and house their own battalions and build their own posts along the Bassac. The state pays for rifles and asks few questions about the rice trade that pays for the rest."
 COLDWAR_SVN_thieu_dm_: "A State in Every Province"
 COLDWAR_SVN_thieu_dm__desc: "Roads reach district towns that last saw a government vehicle under the French. With the road come the tax collector, the land registrar and the schoolteacher. The Republic begins to exist outside its capital."
 COLDWAR_SVN_thieu_succession: "The Question of Succession"
 COLDWAR_SVN_thieu_succession_desc: "The constitution allows two terms and the second is running out. Senators count votes for an amendment, the Prime Minister counts his friends among the generals, and the President says nothing at all, which in Saigon is a statement."
 COLDWAR_SVN_thieu_e1: "A Third Term"
 COLDWAR_SVN_thieu_e1_desc: "Both chambers amend the constitution. The President may now stand again in 1975 and serve five years. The Senate President resigns in protest and the opposition holds up the old text."
 COLDWAR_SVN_thieu_e2: "Groom Khiem as Successor"
 COLDWAR_SVN_thieu_e2_desc: "The Prime Minister is a general who has survived every government since 1963 by never being the last man in the room. Named heir, he gives the Presidential Front a future beyond one man. He also gives ambitious colonels a second door to knock on."
 COLDWAR_SVN_thieu_cap: "The Republic Endures"
 COLDWAR_SVN_thieu_cap_desc: "The province chiefs obey, the taxes arrive, the army knows who commands it and the Americans know whom to call. It is not the republic the constitution described in 1967. It is one that is still here."
 ### Armed Forces Council ###
 COLDWAR_SVN_rvnaf_root: "The Generals Take the Cabinet"
 COLDWAR_SVN_rvnaf_root_desc: "General Cao Van Vien, chief of the Joint General Staff, chairs the cabinet, the four corps commanders sit on the council and every ministry receives a colonel as deputy minister. Nobody voted for this arrangement. Everybody in uniform expected it."
 COLDWAR_SVN_rvnaf_a1: "Promotion on Merit"
 COLDWAR_SVN_rvnaf_a1_desc: "Stars go to the colonels who win battles and keep their battalions at strength, not to the ones with the right brother-in-law. Half the general officers in Saigon read the new promotion list twice to find their own names."
 COLDWAR_SVN_rvnaf_a2: "Corps Commanders as Viceroys"
 COLDWAR_SVN_rvnaf_a2_desc: "Each corps commander keeps his region, its province chiefs, its rice and its fuel, and in return keeps his tanks out of Saigon. Nobody pretends this is efficient. It has prevented a coup for several years, which is longer than anything else has."
 COLDWAR_SVN_rvnaf_a1f: "The Truong Standard"
 COLDWAR_SVN_rvnaf_a1f_desc: "A corps commander who sleeps at the front, relieves officers who pad their rolls and refuses gifts from contractors becomes the model for the whole officer corps. Some colonels find the model exhausting and retire to Saigon."
 COLDWAR_SVN_rvnaf_a2f: "Four Corps, Four Fiefs"
 COLDWAR_SVN_rvnaf_a2f_desc: "The corps headquarters at Da Nang, Pleiku, Bien Hoa and Can Tho become small capitals with their own budgets, their own contractors and their own posts along the roads. The regions are defended. Saigon learns about them from the newspapers."
 COLDWAR_SVN_rvnaf_am: "A General Staff That Commands"
 COLDWAR_SVN_rvnaf_am_desc: "The Joint General Staff now writes the orders instead of forwarding them. Corps commanders receive inspectors from Saigon, and the inspectors are not asking about the weather."
 COLDWAR_SVN_rvnaf_war: "The Sanctuary Question"
 COLDWAR_SVN_rvnaf_war_desc: "Forty thousand enemy soldiers rest, train and resupply a few hours from Saigon, behind a border the enemy has never respected. The council must decide whether that border binds only us."
 COLDWAR_SVN_rvnaf_c1: "Strike the Sanctuaries"
 COLDWAR_SVN_rvnaf_c1_desc: "Armoured columns cross into the Parrot's Beak at dawn and the base areas are emptied of rice, rifles and documents. The enemy will rebuild them. He will rebuild them further away, and he will know the next column can come."
 COLDWAR_SVN_rvnaf_c2: "Enclaves and a Mobile Reserve"
 COLDWAR_SVN_rvnaf_c2_desc: "The council will hold what can be held: the cities, the coast, the rice of the delta and the roads between them. The airborne and the marines stay out of the line, ready to go wherever the enemy commits. Officers who wanted to march are not consoled."
 COLDWAR_SVN_rvnaf_c1f: "Route 9 to Tchepone"
 COLDWAR_SVN_rvnaf_c1f_desc: "Airborne, marine and infantry units ride helicopters and tanks down Route 9 into Laos to cut the trail where it is narrowest. No American adviser may go with them. Whatever the result, every officer who returns knows what the army cannot yet do alone."
 COLDWAR_SVN_rvnaf_c2f: "Airborne and Marines in Reserve"
 COLDWAR_SVN_rvnaf_c2f_desc: "The two elite divisions are pulled out of static garrisons, given airfields, transport and a staff of their own, and kept on six hours' notice. Province chiefs who used them as bodyguards must now find other bodyguards."
 COLDWAR_SVN_rvnaf_cm: "The Dry-Season Campaign Plan"
 COLDWAR_SVN_rvnaf_cm_desc: "For the first time the campaign plan for the coming year is drafted in Vietnamese at the JGS and translated for the Americans, not the other way round. The advisers read a translation for once, and find few mistakes in it."
 COLDWAR_SVN_rvnaf_acad: "The Four-Year Academy at Dalat"
 COLDWAR_SVN_rvnaf_acad_desc: "Cadets at Dalat study four years of engineering, history and tactics instead of a short course of drill, and the staff college teaches majors to run a division rather than a province. The results arrive slowly. They arrive in uniform and they stay."
 COLDWAR_SVN_rvnaf_eco: "A Budget at War"
 COLDWAR_SVN_rvnaf_eco_desc: "Half the budget already goes to the war and the other half is an American subsidy. The council sees no reason to pretend otherwise. Rice, fuel and cement are allocated first to the army, and the shops of Saigon get what is left."
 COLDWAR_SVN_rvnaf_b1: "Hand the Economy to Technocrats"
 COLDWAR_SVN_rvnaf_b1_desc: "The generals keep the war and hand the economy to young men with doctorates who are allowed to say no to a general. Seoul and Jakarta have done the same. Neither the generals nor the young men quite believe it will last."
 COLDWAR_SVN_rvnaf_b2: "The Army in Business"
 COLDWAR_SVN_rvnaf_b2_desc: "Army transport companies, army farms and army trading houses pay the soldiers a living the budget cannot. They also pay their colonels a living nobody asked about. A soldier who eats is a soldier who stays."
 COLDWAR_SVN_rvnaf_b1f: "An Economic Planning Board"
 COLDWAR_SVN_rvnaf_b1f_desc: "A board with its own minister, its own statisticians and the right to veto any ministry budget writes a five-year plan for the years after the war. The generals sign it without reading the annexes, which is what the board was hoping for."
 COLDWAR_SVN_rvnaf_b2f: "Commissaries and Army Cooperatives"
 COLDWAR_SVN_rvnaf_b2f_desc: "Soldiers' wives buy rice, fish sauce and kerosene at army prices in army shops, supplied from army farms in the delta and army depots in Saigon. Desertion falls. The rice merchants file complaints with an office that is run by a colonel."
 COLDWAR_SVN_rvnaf_bm: "Rice and Fuel by Allocation"
 COLDWAR_SVN_rvnaf_bm_desc: "The council sets quotas for rice, fuel and cement by province and by unit, and a quartermaster signs every truck that leaves the depot. The black market shrinks. It does not disappear: it moves into the quartermaster's office."
 COLDWAR_SVN_rvnaf_arsenal: "A Domestic Arsenal"
 COLDWAR_SVN_rvnaf_arsenal_desc: "The army learns to make its own rifles, mortar rounds and spare parts at Bien Hoa instead of waiting for the next ship from Oakland. The first batches jam. The second batches jam less. Nobody in Washington can vote the third batch away."
 COLDWAR_SVN_rvnaf_d1: "Purge the Air Force Network"
 COLDWAR_SVN_rvnaf_d1_desc: "Wing commanders who owe their careers to Nguyen Cao Ky are posted to training schools, embassies and the reserve. The coup that everyone whispers about loses its pilots. So, for a season, does the air force."
 COLDWAR_SVN_rvnaf_d2: "Reconcile the Air Force"
 COLDWAR_SVN_rvnaf_d2_desc: "The air marshal's friends keep their squadrons and receive a seat at the council table. The air force flies harder for a government it is part of. The council meets with one more faction in the room and one more reason to keep its voice down."
 COLDWAR_SVN_rvnaf_d1f: "A New Air Command"
 COLDWAR_SVN_rvnaf_d1f_desc: "A new generation of squadron leaders, trained in America and loyal to the Joint General Staff, takes over the wings at Bien Hoa, Da Nang and Tan Son Nhut. Their first order is to fly by the manual. Their second is to report anyone who does not."
 COLDWAR_SVN_rvnaf_d2f: "Wings Over Every Corps"
 COLDWAR_SVN_rvnaf_d2f_desc: "Each corps receives its own air division with fighters, gunships and transports, flown by men who were promised a place in the government and got one. The air force grows faster than its mechanics. Somebody will have to train those too."
 COLDWAR_SVN_rvnaf_airm: "The Air-Ground Team"
 COLDWAR_SVN_rvnaf_airm_desc: "Forward air controllers ride with the infantry and speak Vietnamese on the radio. When a battalion calls for help it now gets a Vietnamese A-37 instead of an American promise, and it gets it before dark."
 COLDWAR_SVN_rvnaf_e1: "One National Army"
 COLDWAR_SVN_rvnaf_e1_desc: "Regional Force companies become battalions, battalions become regiments and every man with a rifle wears the same badge and answers to the same staff. Some hamlets lose the local company that knew every path. The army gains the men to replace it."
 COLDWAR_SVN_rvnaf_e2: "Territorial Self-Defence"
 COLDWAR_SVN_rvnaf_e2_desc: "Every village keeps its own self-defence squad, every sect its own companies and every highland district its own posts, paid by the province and commanded by men the villagers know. The army is spared the garrisons. It is not always told who holds them."
 COLDWAR_SVN_rvnaf_cap: "The Army Holds the Republic"
 COLDWAR_SVN_rvnaf_cap_desc: "The officers who took the cabinet built schools, depots and an arsenal, and their army no longer needs a foreign staff to plan its battles. When the cabinet goes back to civilians is a question the generals prefer to answer later."
 ### Ky's National Mobilisation ###
 COLDWAR_SVN_ky_root: "National Mobilisation"
 COLDWAR_SVN_ky_root_desc: "Air Marshal Nguyen Cao Ky is back with his purple scarf, his pilots and a speech he has rehearsed since 1968: the war is being administered when it should be fought. Saigon is told to tighten its belt and checks whether he means the generals too."
 COLDWAR_SVN_ky_pol: "The Young Turks Return"
 COLDWAR_SVN_ky_pol_desc: "The colonels and young generals who overthrew the old men in 1964 and 1965 are older now and have commands of their own. They expect the air marshal to remember who flew with him. He expects them to remember who gave them their stars."
 COLDWAR_SVN_ky_dir: "Restore the Directory"
 COLDWAR_SVN_ky_dir_desc: "A committee of young officers governs by decree, with the air marshal as its executive and the constitution in a drawer. Decisions take an afternoon. Opposition takes to the pagodas, which is where it went the last time."
 COLDWAR_SVN_ky_pleb: "A Plebiscite for the Air Marshal"
 COLDWAR_SVN_ky_pleb_desc: "One question goes to the voters: mobilise the nation under Nguyen Cao Ky, yes or no. The ballots are printed in two colours and the result is not in serious doubt. The generals who preferred a quiet committee have to applaud a crowd instead."
 COLDWAR_SVN_ky_dirf: "The Supreme Military Committee"
 COLDWAR_SVN_ky_dirf_desc: "Behind the cabinet sits a committee that does not appear in the constitution and meets in an officers' mess at Tan Son Nhut. Ministers learn the government's policy from it the morning after. It is quicker than the Assembly and much less curious."
 COLDWAR_SVN_ky_plebf: "A Mandate From the Streets"
 COLDWAR_SVN_ky_plebf_desc: "The yes campaign does not go home. Its committees stay on in every ward and market, collecting donations for the troops, reporting draft dodgers and reading the air marshal's speeches aloud. Some neighbours call it civic spirit. Others lower their voices."
 COLDWAR_SVN_ky_loan: "Loan Takes the Police Again"
 COLDWAR_SVN_ky_loan_desc: "The air marshal's oldest ally limps back into the national police headquarters and the military security service. The cadres of the other side know his name. So does every journalist who owns a camera."
 COLDWAR_SVN_ky_defy: "No More American Tutelage"
 COLDWAR_SVN_ky_defy_desc: "The air marshal tells the embassy that Vietnamese will decide where Vietnamese die, and that secret talks in Paris bind nobody in Saigon. The crowds love it. The cables to Washington are less affectionate."
 COLDWAR_SVN_ky_pent: "The Pentagon's Favourite"
 COLDWAR_SVN_ky_pent_desc: "Nobody in Washington doubts that the air marshal will fight, and the generals there like a pilot who speaks their language. He flies to Hawaii, shakes the right hands and comes home with a shopping list approved. The embassy grows used to being consulted."
 COLDWAR_SVN_ky_defyf: "Our War, Our Terms"
 COLDWAR_SVN_ky_defyf_desc: "If the Americans will not stay, the air force must learn to keep its own aircraft flying. Mechanics are trained by the thousand, parts are cannibalised by the book, and a squadron that grounds half its planes loses its commander."
 COLDWAR_SVN_ky_pentf: "Squadrons on Request"
 COLDWAR_SVN_ky_pentf_desc: "Fighters, gunships and transports arrive by the shipload and the airfields at Bien Hoa and Tan Son Nhut are lengthened to take them. The air force becomes one of the largest in the world. The ground crews would like a word about the spare parts."
 COLDWAR_SVN_ky_airf: "The Air Force First"
 COLDWAR_SVN_ky_airf_desc: "The air marshal's own service receives first call on fuel, radar and the best recruits, and the army is reminded who covers it when the weather clears. Ground generals mutter. They mutter less when the fighters arrive on time."
 COLDWAR_SVN_ky_eco: "A War Economy for a War"
 COLDWAR_SVN_ky_eco_desc: "Price controls on rice and fuel, heavier taxes on luxuries and a crackdown on draft dodgers: the programme of 1965 is taken out of the drawer and dusted off. The merchants of Cholon remember it well. Some of them remember the firing squad."
 COLDWAR_SVN_ky_poor: "A Government of the Poor"
 COLDWAR_SVN_ky_poor_desc: "The air marshal promised in 1966 to govern for the poor and the oppressed, and this time the promise comes with a budget line. Refugee camps get water, slum wards get clinics and the widows of soldiers get a pension that arrives."
 COLDWAR_SVN_ky_warb: "Every Piastre for the War"
 COLDWAR_SVN_ky_warb_desc: "Social programmes are postponed until victory and the money goes to ammunition, pay and training camps. The cities grumble about prices. The soldiers, for once, are paid on time."
 COLDWAR_SVN_ky_poorf: "Low-Rent Housing for Saigon"
 COLDWAR_SVN_ky_poorf_desc: "Blocks of cheap flats rise on the edge of the burned-out wards, with water pipes, a school and a police post on the ground floor. A family with a roof and a tap is harder to recruit for the other side and easier to find for the census."
 COLDWAR_SVN_ky_warbf: "Levies on the Rich"
 COLDWAR_SVN_ky_warbf_desc: "Importers, landlords and owners of villas pay a war contribution assessed by a committee that includes two colonels and no accountants. The money arrives quickly. So do the complaints, usually from abroad."
 COLDWAR_SVN_ky_ration: "A Ration Card for Every Family"
 COLDWAR_SVN_ky_ration_desc: "Every household in the cities receives a card for rice, sugar and kerosene at fixed prices, and the ward chief signs it. Hoarders lose their margin. Ward chiefs gain a new source of influence, which was not entirely unintended."
 COLDWAR_SVN_ky_trib: "Tribunals for the Speculators"
 COLDWAR_SVN_ky_trib_desc: "Special courts sit in the central market and try hoarders in a single day. The first sentence is carried out in public, and rice is cheaper the next morning. Foreign newspapers call it barbaric. Housewives notice the price."
 COLDWAR_SVN_ky_barg: "A Bargain With Cholon"
 COLDWAR_SVN_ky_barg_desc: "The rice dealers and the congregation elders of Cholon are invited to dinner instead of to the firing post. They promise steady prices and a generous war loan. They are businessmen: they keep the promises that pay."
 COLDWAR_SVN_ky_tribf: "The Anti-Corruption Youth"
 COLDWAR_SVN_ky_tribf_desc: "Students in white shirts inspect warehouses, publish the names of tax dodgers and march on offices that keep two sets of books. The court follows wherever they point. Not every target is guilty, and not every student is a student."
 COLDWAR_SVN_ky_bargf: "The Rice Dealers' Compact"
 COLDWAR_SVN_ky_bargf_desc: "The congregations finance mills, dryers and barges in the delta in exchange for licences that the state promises not to revoke. Rice moves to Saigon by river instead of to the other side by night. The licences, naturally, are not cheap."
 COLDWAR_SVN_ky_treas: "A Treasury That Pays the Troops"
 COLDWAR_SVN_ky_treas_desc: "The war levies now reach the battalions before they reach anybody's cousin. Paymasters are audited by officers from another corps, which keeps both sides honest out of mutual suspicion."
 COLDWAR_SVN_ky_cabinet: "The War Cabinet Reconvenes"
 COLDWAR_SVN_ky_cabinet_desc: "The ministers meet in fatigues at seven in the morning and every agenda begins with the front. Ministries that cannot explain what they do for the war are merged with ones that can. The cabinet room smells of cigarettes and urgency."
 COLDWAR_SVN_ky_plan: "The Air Marshal's War Plan"
 COLDWAR_SVN_ky_plan_desc: "The air staff lays two maps on the table. One has arrows pointing north across the seventeenth parallel. The other has a ring drawn around everything worth keeping. The air marshal likes arrows, but he can also count aircraft."
 COLDWAR_SVN_ky_north: "Carry the War North"
 COLDWAR_SVN_ky_north_desc: "Commandos land on the northern coast, fighters strike across the parallel and the radio tells Hanoi that the war it exported is coming home. The Americans plead for restraint. The enemy has to keep divisions at home that he wanted in the South."
 COLDWAR_SVN_ky_fort: "Fortress South"
 COLDWAR_SVN_ky_fort_desc: "The air marshal swallows his slogans and fortifies what the Republic holds: the coast, the cities and the roads between them, under an air umbrella that never lands. It is less glorious than a march. It is also still standing next year."
 COLDWAR_SVN_ky_cap: "A Nation Mobilised"
 COLDWAR_SVN_ky_cap_desc: "Every district has its self-defence squad, every ministry its war quota and every speculator his fear of the tribunal. The country is tired, poorer than it would like and still fighting. The air marshal calls that victory, and nobody disagrees aloud."
 ### Piastre, Aid and Budget ###
 COLDWAR_SVN_eco_root: "The Economy Ministry"
 COLDWAR_SVN_eco_root_desc: "Every month the same arithmetic: so many dollars from Washington, so many piastres from the importers, so many soldiers to pay. The ministry exists to make the sums agree without admitting how."
 COLDWAR_SVN_eco_cip: "The Commercial Import Programme"
 COLDWAR_SVN_eco_cip_desc: "Washington sells dollars to licensed importers at a friendly rate and the piastres they pay fill the treasury. Shops overflow with motorbikes and nylon, and the army is paid from the proceeds. Nobody at the ministry likes to ask what happens when it stops."
 COLDWAR_SVN_eco_ren: "Renegotiate the Import Licences"
 COLDWAR_SVN_eco_ren_desc: "Licences for cloth and motorbikes are cut in favour of fertiliser, spare parts and machinery. The importers protest loudly, the American mission nods slowly, and the piastre fund learns to live on a different diet."
 COLDWAR_SVN_eco_pc1: "Price Controls and Rationing"
 COLDWAR_SVN_eco_pc1_desc: "American advisers arrive with ration cards and price ceilings for rice, sugar and fuel. They are orderly and well meaning. The market women of Ben Thanh are polite to them and raise their prices again after lunch."
 COLDWAR_SVN_eco_pc2: "Let Prices Find Their Level"
 COLDWAR_SVN_eco_pc2_desc: "The minister argues that a ceiling on rice only moves the rice to the black market. Prices are freed, shelves refill within weeks, and Saigon learns that a high price is not the same thing as an empty shop."
 COLDWAR_SVN_eco_pc1f: "Ration Cards for the Cities"
 COLDWAR_SVN_eco_pc1f_desc: "The families of soldiers, teachers and clerks receive cards for rice, sugar and cloth at fixed prices. The queue becomes a civic institution. So does the man who sells cards at the back door."
 COLDWAR_SVN_eco_pc2f: "Open Markets in Saigon and Cholon"
 COLDWAR_SVN_eco_pc2f_desc: "The wholesale markets of Cholon trade without a ministry clerk at every gate. Receipts replace envelopes, and traders discover that a clean ledger is cheaper than a friendly inspector."
 COLDWAR_SVN_eco_pcm: "The Saigon Price Index"
 COLDWAR_SVN_eco_pcm_desc: "Every month the retail price of rice, pork and cooking oil is published, and the ministry argues with a number instead of a rumour. The number rarely flatters anyone, which is why it is believed."
 COLDWAR_SVN_eco_cut: "Living Within a Smaller Envelope"
 COLDWAR_SVN_eco_cut_desc: "Congressional votes are counted in Saigon with the same anxiety as in Washington. A reserve of piastres and a standing list of what can be postponed buy the cabinet a few quiet months, which is all anyone has asked of it."
 COLDWAR_SVN_eco_trade: "Trade, Not Aid"
 COLDWAR_SVN_eco_trade_desc: "Exporters are told that the dollars they earn are worth more than the dollars others lend. Shrimp, rubber, rice and plywood leave the ports under a new slogan. The treasury still checks the post for American envelopes, but less often."
 COLDWAR_SVN_eco_bm: "The Black Market Rate"
 COLDWAR_SVN_eco_bm_desc: "The official dollar costs 118 piastres and the street dollar 400. Everyone with a cousin in Singapore knows which to use. The ministry has to decide how long it can keep pretending."
 COLDWAR_SVN_eco_sd: "Shock Devaluation"
 COLDWAR_SVN_eco_sd_desc: "The official rate jumps to meet the street in one announcement. Importers curse, exporters smile and the housewife counts her change twice. Whatever follows, the pretence is over."
 COLDWAR_SVN_eco_cp: "Let the Piastre Crawl"
 COLDWAR_SVN_eco_cp_desc: "The piastre slips a little every few weeks instead of falling off a cliff once. Importers can plan and exporters can price. The Assembly must first be persuaded, which takes the better part of a season."
 COLDWAR_SVN_eco_sdf: "Exporters Come Home With Dollars"
 COLDWAR_SVN_eco_sdf_desc: "Rubber, shrimp and handicraft exporters find their dollars worth three times as many piastres. Cargoes that sat in Singapore warehouses return to Saigon, and a few shuttered delta workshops reopen."
 COLDWAR_SVN_eco_cpf: "Weekly Adjustments, Monthly Reports"
 COLDWAR_SVN_eco_cpf_desc: "A small committee meets on Thursdays to decide the slip for the week, and a monthly bulletin explains why. Bankers, who dislike surprise above all, begin to suspect that the government may be competent."
 COLDWAR_SVN_eco_pl: "The Programme Law"
 COLDWAR_SVN_eco_pl_desc: "The Assembly debates for months and then lets the executive set the exchange rate by decree for a limited time. The ministry now has the tools of a government instead of the habits of a petitioner."
 COLDWAR_SVN_eco_ir: "High-Interest Deposits"
 COLDWAR_SVN_eco_ir_desc: "Deposit rates climb from a pitiful two to four percent to rates a widow in Cholon can respect. Gold comes out of mattresses and into banks, and the government borrows from its citizens instead of from the printing press."
 COLDWAR_SVN_eco_vat: "VAT and Four Tariff Bands"
 COLDWAR_SVN_eco_vat_desc: "Over two hundred tariff rates become four, and a ten percent tax on sales replaces a thicket of levies. Shopkeepers grumble. Then they pay, and the treasury finds it can collect without waiting for Washington."
 COLDWAR_SVN_eco_bank: "Banks, Credit and the Savings Law"
 COLDWAR_SVN_eco_bank_desc: "Private banks are told to lend to factories and not only to importers. Credit cooperatives take deposits in the provinces, and a clerk in Can Tho learns the word collateral. The lenders of Cholon move their ledgers above the counter."
 COLDWAR_SVN_eco_sound: "A Sound Piastre"
 COLDWAR_SVN_eco_sound_desc: "Years after the first slip, the piastre still buys something, inflation is a number rather than a mood, and exporters price their cargoes without a lawyer. Washington may count the dollars. Saigon counts the confidence."
 COLDWAR_SVN_eco_oil: "Inflation After the Oil Shock"
 COLDWAR_SVN_eco_oil_desc: "When fuel gets dear the whole price level follows: transport, fertiliser, the rice of the poor. The ministry cannot fix the world price of oil and does not pretend to. It can decide who bears the bill."
 COLDWAR_SVN_eco_tl: "The Thuc-Lilienthal Plan"
 COLDWAR_SVN_eco_tl_desc: "A thick report in two languages promises four to six percent growth if only the war ends on schedule. It is the best-prepared plan for a peace that has not been signed. The ministry reads it anyway, because it is the only plan."
 COLDWAR_SVN_eco_st: "State-Led Development Plan"
 COLDWAR_SVN_eco_st_desc: "Public investment leads: roads, power plants and fertiliser works, with ministries choosing the sites and signing the cheques. The engineers are delighted. The businessmen ask where they come in."
 COLDWAR_SVN_eco_pr: "Private and Foreign Capital First"
 COLDWAR_SVN_eco_pr_desc: "The RAND reviewers say the plan trusts the state too much and the market too little. Competitive interest rates and tax holidays are offered to anyone who will build a mill. The first to arrive are Japanese and Chinese, and they ask for guarantees."
 COLDWAR_SVN_eco_stf: "Planning Directorate and Public Works"
 COLDWAR_SVN_eco_stf_desc: "A directorate with maps on its walls turns the plan into investment lists. Bridges, roads and power lines go first. The lists are rarely revised, so the maps age with them."
 COLDWAR_SVN_eco_prf: "An Investors' Code and Tax Holidays"
 COLDWAR_SVN_eco_prf_desc: "A thin booklet guarantees repatriation of profits, a tax holiday and a single desk where permits are stamped. A few firms visit to look. A few stay to sign."
 COLDWAR_SVN_eco_inv: "The National Investment Council"
 COLDWAR_SVN_eco_inv_desc: "Ministers, bankers and a few Cholon merchants sit at one table to decide what the nation can afford to build. They agree on much, and on almost nothing about what to build first. Still, there is now a table."
 COLDWAR_SVN_eco_isi: "Protect Import-Substituting Industry"
 COLDWAR_SVN_eco_isi_desc: "Tariff walls and import bans shelter new textile, soap and bicycle plants from the cheap cargoes of Hong Kong. The owners are thankful and the consumers are not. A plant that survives behind a wall may never need to leave it."
 COLDWAR_SVN_eco_epz: "Export Processing Zone at Bien Hoa"
 COLDWAR_SVN_eco_epz_desc: "Behind a fence, factories import cloth and components duty-free and ship out shirts and radios. Taiwan did it at Kaohsiung and Korea at Masan, and both filled their factory floors faster than the planners expected."
 COLDWAR_SVN_eco_isif: "Tariff Walls for Cloth and Soap"
 COLDWAR_SVN_eco_isif_desc: "Customs officers at the port are told that cloth, soap and bicycles will be taxed at the top band. Domestic mills hire second shifts. The smugglers of nylon are, for once, in full agreement with the government."
 COLDWAR_SVN_eco_epzf: "Zone Utilities and a Bonded Port"
 COLDWAR_SVN_eco_epzf_desc: "A power line, a water main and a customs shed that never closes. Plant managers say they will bring the machines if the zone brings the current. The country has few places with a reliable supply, and this will be one of them."
 COLDWAR_SVN_eco_exp: "The Export Promotion Board"
 COLDWAR_SVN_eco_exp_desc: "A small office handles trade fairs, quality marks and shipping advice for anyone with something to sell abroad. It is staffed by sons of Cholon merchants who speak four languages and distrust all of them."
 COLDWAR_SVN_eco_cho: "Cholon Trade and Rice Marketing"
 COLDWAR_SVN_eco_cho_desc: "Delta rice reaches the capital through the warehouses of Cholon, and the Chinese merchants who run them have known the price of a ton since before the Republic existed. Leave them room and rice moves. Squeeze them and it does not."
 COLDWAR_SVN_eco_cap: "A Republic That Pays Its Way"
 COLDWAR_SVN_eco_cap_desc: "Taxes pay the army, exports pay for the fuel, and the American mission is thanked for its help rather than its cheques. It took years of patience from planners nobody remembers. The Republic is smaller than its slogans and richer than its enemies expected."
 ### Land, Rice and Refugees ###
 COLDWAR_SVN_agri_root: "The Ministry of Land Reform"
 COLDWAR_SVN_agri_root_desc: "Most of the country still lives from the soil, and half of those farm land that belongs to somebody else. A ministry that once issued plantation permits now carries the largest social programme of the Republic."
 COLDWAR_SVN_agri_ltt: "Land to the Tiller"
 COLDWAR_SVN_agri_ltt_desc: "The law gives the land to those who plough it, free of charge to the farmer, and promises the landowner compensation. A million families wait for a deed. A few thousand landlords wait for a cheque, and each is sure he will be paid last."
 COLDWAR_SVN_agri_ca: "Pay Landlords in Cash Now"
 COLDWAR_SVN_agri_ca_desc: "The treasury pays full compensation in piastres at the district office. Landlords who feared confiscation leave with a receipt and a grudge smaller than they had planned. The budget director does not leave smiling."
 COLDWAR_SVN_agri_bo: "Pay in Eight-Year Bonds"
 COLDWAR_SVN_agri_bo_desc: "Twenty percent in cash, the rest in bonds paying ten percent over eight years. The treasury keeps its piastres and the landlords keep a handsome stack of paper. What they build with it is their own affair."
 COLDWAR_SVN_agri_caf: "Cash Paid at the District Office"
 COLDWAR_SVN_agri_caf_desc: "Former landlords arrive in provincial towns with money and look for things to buy. Some buy rice mills, some trucks, and a surprising number buy ice factories. The delta acquires a class of owners who have no more land to lose."
 COLDWAR_SVN_agri_bof: "Bonds Convertible Into Shares"
 COLDWAR_SVN_agri_bof_desc: "A landlord holding bonds may exchange them for shares in the new mills and banks at a price the ministry sets. Paper in a drawer becomes a seat on a board. The board meets in Saigon, which is where the landlord always preferred to be."
 COLDWAR_SVN_agri_lm: "Titles in Every Village"
 COLDWAR_SVN_agri_lm_desc: "Title deeds arrive in sacks, stamped and numbered, at district offices that never saw so many farmers. The old rent collector is out of work. The communist land tax collector is, for the first time in a generation, short of arguments."
 COLDWAR_SVN_agri_ti: "Smallholder Titles"
 COLDWAR_SVN_agri_ti_desc: "Each farmer receives a numbered deed with his name, his plot and a stamp. He may sell it, mortgage it or leave it to his sons. Many do all three within a decade, and the registry grows into the busiest office in the district."
 COLDWAR_SVN_agri_co: "Cooperatives and Farmers' Associations"
 COLDWAR_SVN_agri_co_desc: "Farmers' associations, on the model Taiwan built with American help, buy seed and fertiliser in bulk, run the pumps and take the harvest to market. They also hold an annual dinner at which the district chief is guest of honour."
 COLDWAR_SVN_agri_tif: "A Deed in Every Hand"
 COLDWAR_SVN_agri_tif_desc: "District registries are connected by road to the provincial capitals, and a farmer with a deed can reach a bank in a day. A piece of paper that was once the landlord's property becomes the first asset a peasant family can borrow against."
 COLDWAR_SVN_agri_cof: "Associations Lead the Extension Work"
 COLDWAR_SVN_agri_cof_desc: "The associations hire agronomists, rent tractors by the day and negotiate with the fertiliser dealers as one buyer rather than three hundred. The district agricultural officer, long accustomed to being the only man with a bicycle, adapts."
 COLDWAR_SVN_agri_adb: "The Agricultural Development Bank"
 COLDWAR_SVN_agri_adb_desc: "The bank lends against the new deeds, which a year ago were not worth the paper. Loans for seed, pumps and buffalo go out through the district offices at rates no moneylender can match. Repayment is brisk, because a mortgaged deed is a deed worth keeping."
 COLDWAR_SVN_agri_fish: "Fisheries and Boat Credit"
 COLDWAR_SVN_agri_fish_desc: "Fishing feeds the country twice: once as fish and once as sauce. Credit for outboard motors and ice plants moves the fleet from the coast to the open sea. The navy, which patrols the same waters, has to learn the difference between a trawler and a smuggler."
 COLDWAR_SVN_agri_rfh: "The Refugee Relief Programme"
 COLDWAR_SVN_agri_rfh_desc: "Millions have left their hamlets since 1965, some by order, some by fear, some by bombs. They live in camps beside the highways under a tin roof with a ration card. The ministry begins by learning how many of them there are."
 COLDWAR_SVN_agri_rs: "Land Development Centres"
 COLDWAR_SVN_agri_rs_desc: "New villages are laid out on a grid on empty land in the highlands and the delta, with a well, a school and a plot for each family. The families are given a hammer and a good deal of advice. The highland peoples, whose forest it was, are asked to be patient."
 COLDWAR_SVN_agri_rt: "Return to Home Villages"
 COLDWAR_SVN_agri_rt_desc: "Trucks carry families back to hamlets the army has declared safe, with a roof sheet, a sack of rice and a plot of paddy. Some find their houses standing. Some find the village tax paid twice, once to each side."
 COLDWAR_SVN_agri_rsf: "Highland Colonies and Cash Crops"
 COLDWAR_SVN_agri_rsf_desc: "The colonies plant coffee and tea on the red basalt soil around Ban Me Thuot and Pleiku, and the first harvests go down to Saigon by road. The road has to be built and defended first, and every year in that order."
 COLDWAR_SVN_agri_rtf: "Hamlet Reconstruction Grants"
 COLDWAR_SVN_agri_rtf_desc: "Each returning family receives cement for a well, tin for a roof and a seed packet stamped with the name of the district chief. The hamlet committee decides who gets what, and decides it more fairly than the district chief would have."
 COLDWAR_SVN_agri_rm: "Resettled and Rebuilt"
 COLDWAR_SVN_agri_rm_desc: "A village moved during the war and rebuilt in peace has a school, a market and a headman with a long memory. Where it began or where it was sent, it now has a name on the district map and a claim on the budget."
 COLDWAR_SVN_agri_ir8: "Miracle Rice IR-8 and Fertiliser"
 COLDWAR_SVN_agri_ir8_desc: "A short, stiff-strawed rice from the Philippines yields twice the old varieties if it gets water, fertiliser and a farmer who trusts it. The first fields are planted on credit and faith. The second year's fields are planted on arithmetic."
 COLDWAR_SVN_agri_irr: "Mekong Canals and Pumps"
 COLDWAR_SVN_agri_irr_desc: "A dry-season crop needs water in February, and the delta has water in October. Canals, sluices and diesel pumps move one to the other. The engineers dredge by day, are mortared by night and dredge again the next morning."
 COLDWAR_SVN_agri_reserve: "The Rice Reserve in Central Vietnam"
 COLDWAR_SVN_agri_reserve_desc: "Central Vietnam grows too little rice for its own coast and depends on a delta the road cannot always reach. Three hundred thousand tonnes in coastal warehouses mean that a cut road is a bad week and not a famine."
 COLDWAR_SVN_agri_ssuf: "Rice Self-Sufficiency"
 COLDWAR_SVN_agri_ssuf_desc: "After nearly a decade of importing up to six hundred thousand tonnes a year, the Republic feeds itself. The importers of Cholon grumble and the finance ministry sleeps better. A rice bowl filled at home is hard to turn into an instrument of blockade."
 COLDWAR_SVN_agri_rubber: "Rubber and Highland Timber"
 COLDWAR_SVN_agri_rubber_desc: "The rubber trees stand in perfect rows along the red roads north of Saigon, and the plantation manager still keeps a table at the Cercle Sportif. Beyond them the highland forests wait for a sawmill and a road. Both ask the army for the same thing: quiet."
 ### Industry, Energy and Oil ###
 COLDWAR_SVN_ind_root: "The Industrial Development Centre"
 COLDWAR_SVN_ind_root_desc: "In 1970 the Republic makes beer, cigarettes, cloth and cement, and imports almost everything else. A small body of engineers, bankers and Japanese advisers has been asked to turn that list around before the Americans finish going home."
 COLDWAR_SVN_ind_leg: "The American Inheritance"
 COLDWAR_SVN_ind_leg_desc: "Two decades of American construction left airfields, depots, deepwater piers and a cantonment the size of a town. Everything was built to a standard the Republic cannot afford to maintain, and everything is handed over with the bills attached."
 COLDWAR_SVN_ind_conv: "Convert the Bases to Industrial Estates"
 COLDWAR_SVN_ind_conv_desc: "Hangars become weaving sheds, barracks become dormitories and the motor pool becomes a truck assembly line. The generals note that they have been moved out of their own fortresses by a committee of economists."
 COLDWAR_SVN_ind_keep: "Keep Them as Military Bases"
 COLDWAR_SVN_ind_keep_desc: "The depots keep their guards, the airfields keep their runways and the divisions keep their supply base. The economists are told that factories can be built anywhere and that bases cannot."
 COLDWAR_SVN_ind_convf: "Long Binh Becomes an Industrial Park"
 COLDWAR_SVN_ind_convf_desc: "The largest cantonment in the country is subdivided into lots with power, water and a guard at the gate. Textile firms, assemblers and a bottling plant sign leases within a month. The mess hall serves lunch to all of them."
 COLDWAR_SVN_ind_keepf: "Cam Ranh as Fleet and Air Base"
 COLDWAR_SVN_ind_keepf_desc: "The deepest anchorage on the coast, a long runway and a hill for the radar remain in uniform. The navy and the air force fight over the berths. Everyone agrees that no other bay in the country can hold a carrier."
 COLDWAR_SVN_ind_ports: "Saigon Newport and the Ports"
 COLDWAR_SVN_ind_ports_desc: "The berths are the same under any flag: Saigon Newport upriver, Cam Ranh on the central coast, Da Nang in the north. Ships that waited a month for a berth under the Americans now wait a week. The harbourmaster calls this progress."
 COLDWAR_SVN_ind_heavy: "The Heavy Industry Programme"
 COLDWAR_SVN_ind_heavy_desc: "Coal, steel, fertiliser and a machine shop: the pillars of a country that wants to make things and not just sell them. The planners promise results in ten years. The shopkeepers ask what they should sell in the meantime."
 COLDWAR_SVN_ind_light: "Light Export Industry"
 COLDWAR_SVN_ind_light_desc: "Shirts, sandals and radios for the markets of Hong Kong, Japan and California. The machines are imported, the labour is cheap and the buyers care little about politics. A factory that sells abroad answers to the world, not to the ministry."
 COLDWAR_SVN_ind_heavyf: "An Hoa-Nong Son Coal and Fertiliser"
 COLDWAR_SVN_ind_heavyf_desc: "Anthracite from the hills of Quang Nam feeds a power plant and a nitrogen works on the plain below. The farmers of the delta get the fertiliser, Da Nang gets the electricity, and the Quang Nam security officer gets a larger perimeter to defend."
 COLDWAR_SVN_ind_lightf: "Textiles and Assembly at Bien Hoa"
 COLDWAR_SVN_ind_lightf_desc: "Spinning mills, garment lines and a motorbike assembly hall fill the industrial zone beside the Dong Nai River. Young women from the villages find a wage that no landlord ever paid. Their employers find that wages are the cheapest part of the business."
 COLDWAR_SVN_ind_tech: "Technical Schools and the Polytechnic"
 COLDWAR_SVN_ind_tech_desc: "A factory without foremen is a warehouse. Technical schools in Saigon, Can Tho and Da Nang train welders, electricians and draughtsmen, and the polytechnic sends its best to the factories instead of the ministries."
 COLDWAR_SVN_ind_grid: "Da Nhim and the Saigon Grid"
 COLDWAR_SVN_ind_grid_desc: "Japanese turbines in the highlands send current down a long line to the capital, and Saigon lights its streets on a cable the enemy has cut more than once. Everyone in the ministry knows where the nearest spare transformer is stored."
 COLDWAR_SVN_ind_state: "Nationalise the Grid"
 COLDWAR_SVN_ind_state_desc: "A single state electricity company buys the private generators, sets one tariff and answers to one minister. The lights go on in the provinces as well as in Saigon. The minister gets the blame whenever they go off."
 COLDWAR_SVN_ind_priv: "Private Power Concessions"
 COLDWAR_SVN_ind_priv_desc: "Foreign and Chinese-Vietnamese companies are offered thirty-year concessions to build, own and sell power. The capital arrives quickly. So do the tariff schedules, which the concessionaires write themselves."
 COLDWAR_SVN_ind_statef: "Oil-Fired Plants for Saigon"
 COLDWAR_SVN_ind_statef_desc: "Two oil-fired plants rise on the river below Saigon, each with a tall chimney and a fence. Their output goes first to the factories, second to the army and third to the people, in an order nobody has agreed to publish."
 COLDWAR_SVN_ind_privf: "Concession Terms for Foreign Bidders"
 COLDWAR_SVN_ind_privf_desc: "A concessions bureau on Nguyen Hue publishes terms in English, French and Japanese. Bidders from three continents inspect the sites, ask about the war and request a guarantee. The guarantee is where the negotiation begins."
 COLDWAR_SVN_ind_hydro: "Central Highlands Hydropower"
 COLDWAR_SVN_ind_hydro_desc: "Engineers survey the Dong Nai and the Se San and count potential in hundreds of megawatts. The Da Nhim line proved the idea. The rest is a question of money, concrete and who controls the hills."
 COLDWAR_SVN_ind_roads: "Highway One and the Railway"
 COLDWAR_SVN_ind_roads_desc: "The coast road from Saigon to Hue and the railway beside it have been cut so often that the repair crews carry their own sandbags. Every reopened bridge makes the central provinces a little less distant and the capital a little less dependent on ships."
 COLDWAR_SVN_ind_cement: "Ha Tien Cement and Building Materials"
 COLDWAR_SVN_ind_cement_desc: "Cement from the Ha Tien kilns on the Gulf of Siam goes by barge to every building site in the delta. Every bridge, silo and school in the Republic is poured with it, and the kilns have survived worse than a shortage of orders."
 COLDWAR_SVN_ind_arms: "Ammunition and Small Arms Works"
 COLDWAR_SVN_ind_arms_desc: "Rounds for the M16 and the M60 used to cross the Pacific. A plant with American tooling and Vietnamese labour now fills a small part of the order book, and every cartridge cased at home is one that does not wait on a vote in Congress."
 COLDWAR_SVN_ind_seismic: "Seismic Surveys off the Delta"
 COLDWAR_SVN_ind_seismic_desc: "Survey ships from Texas and the Netherlands crisscross the shallow water off the Mekong, towing their cables. The economy ministry hopes they find oil. The defence ministry hopes they find it somewhere that can be defended."
 COLDWAR_SVN_ind_majors: "Offer Blocks to the Oil Majors"
 COLDWAR_SVN_ind_majors_desc: "The majors bring the rigs, the capital and the seismologists, and they ask for thirty-year concessions with generous royalty terms. The treasury collects signing bonuses at once and the nationalists note the fine print."
 COLDWAR_SVN_ind_noc: "A National Oil Company"
 COLDWAR_SVN_ind_noc_desc: "A state company holds the licences and hires the rigs, the crews and the foreign consultants on service contracts. The treasury pays the bills. When oil is found, it will belong to the Republic and not to a boardroom in Houston."
 COLDWAR_SVN_ind_majf: "Block Awards to the Majors"
 COLDWAR_SVN_ind_majf_desc: "A ministry hall in Saigon hosts a bid opening with sealed envelopes, cameras and several men in very good suits. By evening the map of the shelf is marked off in blocks with company names written in a neat hand."
 COLDWAR_SVN_ind_nocf: "Service Contracts and Training Abroad"
 COLDWAR_SVN_ind_nocf_desc: "Young geologists leave for Houston, Jakarta and Aberdeen while the national company hires drilling contractors by the month. In five years the Republic will have a staff that can read a seismic section without a translator."
 COLDWAR_SVN_ind_disc: "The Rong and Bach Ho Discoveries"
 COLDWAR_SVN_ind_disc_desc: "A rig off the delta strikes oil in the Dragon structure, and a second well on the White Tiger prospect finds more. A Republic bracing for a world without American money learns that it may be sitting on a good part of the replacement."
 COLDWAR_SVN_ind_refine: "Vung Tau Refinery"
 COLDWAR_SVN_ind_refine_desc: "Crude oil that cannot be refined at home is sold cheaply and bought back dear. A refinery at Vung Tau, close to the shipping lanes and the offshore blocks, turns the Republic from a customer into a supplier of its own fuel."
 COLDWAR_SVN_ind_export: "Crude Export Terminal"
 COLDWAR_SVN_ind_export_desc: "Tankers loading at a buoy off Vung Tau are the new customers of the Republic. The revenue is paid in dollars to a government that has spent a decade learning what it is to depend on someone else. It is a better sort of dependence."
 COLDWAR_SVN_ind_fuel: "Strategic Fuel Reserves"
 COLDWAR_SVN_ind_fuel_desc: "Tank farms at Nha Be and Vung Tau are filled until the gauges stop moving. The army, the airline and the fishing fleet are assured that the next time the price of fuel jumps, they will not hear about it first from the newspapers."
 COLDWAR_SVN_ind_cap: "The Industrial Republic"
 COLDWAR_SVN_ind_cap_desc: "Cement from Ha Tien, current from Da Nhim, steel from Da Nang and crude from the Dragon fields: the pieces of an industrial country are all on the map, and for once the map is not a war plan."
 ### Armed Forces of the Republic ###
 COLDWAR_SVN_mil_root: "The Armed Forces of the Republic"
 COLDWAR_SVN_mil_root_desc: "Nearly a million men wear the uniform of the Republic, in regular divisions, village militias, a navy of river boats and an air force growing faster than it can be maintained. The Americans are going home. The question is what they leave behind."
 COLDWAR_SVN_mil_army: "The Ground War Handed Over"
 COLDWAR_SVN_mil_army_desc: "Each month another American battalion furls its colours and goes home. The units that stay are told that they are now the front line, and that the radios, the trucks and the helicopters are theirs to keep. It is a great deal to inherit in a hurry."
 COLDWAR_SVN_mil_lead: "Count the Heads at Roll Call"
 COLDWAR_SVN_mil_lead_desc: "Some colonels draw pay for soldiers who do not exist, and others for soldiers who exist only on the day the inspector comes. Staff officers are sent to count every battalion by name before the Americans do it for them."
 COLDWAR_SVN_mil_men: "The Draft Boards and the Quota"
 COLDWAR_SVN_mil_men_desc: "Every province receives a monthly figure of young men to find, and every village receives a reason why its own are indispensable in the paddies. The draft boards sit between the two and have been known to accept a gift."
 COLDWAR_SVN_mil_a1: "Merit Promotion Boards"
 COLDWAR_SVN_mil_a1_desc: "A board of colonels reads files, test scores and battlefield reports and promotes on them. An officer with no patron and a good record is astonished to receive a division. An officer with a patron and a poor record is merely offended."
 COLDWAR_SVN_mil_a2: "Loyalty and Political Reliability"
 COLDWAR_SVN_mil_a2_desc: "The Palace wants commanders whose names it knows and whose divisions will not wander towards Saigon on their own. Reliability is rewarded with a corps, a province or a good house. It has so far kept the capital quiet."
 COLDWAR_SVN_mil_a1f: "The Staff College at Dalat"
 COLDWAR_SVN_mil_a1f_desc: "The Military Academy at Dalat has made lieutenants since 1950, and the staff college nearby teaches majors how to run a division. Graduates posted in merit order are an experiment, and nobody in the Palace is sure of the result."
 COLDWAR_SVN_mil_a2f: "The Corps as Personal Commands"
 COLDWAR_SVN_mil_a2f_desc: "Each corps commander also governs his tactical zone, names the province chiefs beneath him and answers to the Palace alone. The system keeps the peace. It is less successful at keeping accounts."
 COLDWAR_SVN_mil_am: "The Joint General Staff at Work"
 COLDWAR_SVN_mil_am_desc: "The staff at Tan Son Nhut must now run the war. Corps staffs are asked for plans in writing, and are surprised to find that someone reads them."
 COLDWAR_SVN_mil_b1: "A Mass Conscript Army"
 COLDWAR_SVN_mil_b1_desc: "The Republic has the men and not the money, so it takes every man the law allows. Divisions are filled, replacements flow, and the pay stays what the treasury can afford. A soldier who cannot feed his family in the barracks will feed it at home."
 COLDWAR_SVN_mil_b2: "A Smaller, Better-Paid Army"
 COLDWAR_SVN_mil_b2_desc: "Fewer divisions, enlisted for longer and paid enough to feed a household. The generals lose battalions to the reserve rolls. In exchange the sergeants stay long enough to learn the names of their men."
 COLDWAR_SVN_mil_b1f: "Stiffen I Corps"
 COLDWAR_SVN_mil_b1f_desc: "The northern provinces are held by too few regulars. Territorial battalions and the draftees of I Corps are drilled, re-equipped and given officers who know the ground. Raw units have a way of meeting the enemy before they meet their sergeants."
 COLDWAR_SVN_mil_b2f: "Ranger Groups and Border Rangers"
 COLDWAR_SVN_mil_b2f_desc: "Hand-picked battalions trained for the jungle and the frontier replace the camps of irregulars along the border. They cost twice as much as a line battalion and are put in the places where line battalions have failed."
 COLDWAR_SVN_mil_bm: "Deserter Rolls and the Military Police"
 COLDWAR_SVN_mil_bm_desc: "A list of deserters is a list of men who still have a rifle number and a home village. The military police go and look for them, and bring back some. Others have already crossed into the cities, where there is always work for a man who does not ask questions."
 COLDWAR_SVN_mil_housing: "Pay and Dependants' Housing"
 COLDWAR_SVN_mil_housing_desc: "A private's pay does not feed a wife and four children, so the family follows him to the camp or he goes home to it. Barracks for the families, a commissary and a pay envelope that arrives on time cost far less than a hundred thousand replacements a year."
 COLDWAR_SVN_mil_reserve: "Airborne and Marines as General Reserve"
 COLDWAR_SVN_mil_reserve_desc: "The Airborne and Marine divisions belong to nobody's corps. They are held at the Joint General Staff's disposal and sent wherever the line has broken. Corps commanders resent the arrangement; the line that holds is usually the one they kept."
 COLDWAR_SVN_mil_c1: "The American Way: Firepower First"
 COLDWAR_SVN_mil_c1_desc: "Fifteen years of American advice have produced an army that calls for artillery, helicopters and bombers before it moves. Fire bases replace marching. A division fights hard, and consumes in a day what a village makes in a season."
 COLDWAR_SVN_mil_c2: "A Lighter Army We Can Supply"
 COLDWAR_SVN_mil_c2_desc: "Rifles, mortars, trucks and radios that can be repaired in a Saigon workshop, and a rule that no unit is deployed beyond the reach of its own supply columns. The planners call it austerity. The officers call it being left without guns."
 COLDWAR_SVN_mil_c1f: "Armoured Cavalry and Artillery Groups"
 COLDWAR_SVN_mil_c1f_desc: "Tank squadrons and cavalry on tracked carriers are grouped into brigades, with 175 mm gun battalions behind them. A column that has fuel can drive from Quang Tri to the Mekong in a week. A column without it can drive nowhere."
 COLDWAR_SVN_mil_c2f: "Territorial Light Brigades"
 COLDWAR_SVN_mil_c2f_desc: "Infantry brigades with mule trains, bicycles and light weapons are raised for the highlands and the delta, where the enemy walks and so must the army. The commanders ask when they will receive their tanks. The answer is: not this year."
 COLDWAR_SVN_mil_cm: "Ammunition Stocks and the Supply Chain"
 COLDWAR_SVN_mil_cm_desc: "A general staff that counts shells, drums of fuel and truck tyres can say how long a battle will last. The depots at Long Binh and Da Nang are stocked months ahead of need, which in a country that lives from year to year feels like an extravagance."
 COLDWAR_SVN_mil_cap: "A Domestic Maintenance and Arsenal Base"
 COLDWAR_SVN_mil_cap_desc: "In 1970 almost nothing that shoots is made in the country. Workshops at Bien Hoa, Saigon and Da Nang now repair engines, rebuild radios and fill shells. A republic that can mend its own army can decide for itself how long to keep it."
 COLDWAR_SVN_mil_terr: "Regional and Popular Forces"
 COLDWAR_SVN_mil_terr_desc: "More than four hundred thousand men in province companies and village platoons guard the roads and hamlets the regular divisions pass through once a year. They are paid less than anyone and bear a large part of the fighting."
 COLDWAR_SVN_mil_t1: "Defence of the Populated Lowlands"
 COLDWAR_SVN_mil_t1_desc: "The staff draws a line around Saigon, the delta and the coastal plain where most of the people live, and writes that everything beyond it may be given up in an emergency. Border garrisons would be thinned. Nobody at the Palace wants to say so aloud."
 COLDWAR_SVN_mil_t2: "Hold Every Province"
 COLDWAR_SVN_mil_t2_desc: "Not a province capital, not a district town and not a hamlet flag is to be given up without a fight. The army will be stretched on every road. It will also never be accused of abandoning anyone."
 COLDWAR_SVN_mil_t1f: "Depth Positions Around the Cities"
 COLDWAR_SVN_mil_t1f_desc: "Concrete positions go up in rings around Saigon, Can Tho and Da Nang, each covering the next. The belts of wire and bunker are dull work, which is exactly what makes them valuable."
 COLDWAR_SVN_mil_t2f: "Province Garrisons and Border Posts"
 COLDWAR_SVN_mil_t2f_desc: "Each province chief gets a standing garrison, a radio net and a stock of rations. The border posts of the highlands are manned, relieved and reinforced on a calendar that the staff college did not design."
 COLDWAR_SVN_mil_tm: "Sector and Subsector Commands"
 COLDWAR_SVN_mil_tm_desc: "A major at the district headquarters controls the Popular Force platoons of every village and answers to a colonel at the province, who answers to a general at the corps. The chain of command is the only reform nobody argues with."
 COLDWAR_SVN_mil_psdf: "The People's Self-Defence Force"
 COLDWAR_SVN_mil_psdf_desc: "Schoolboys, grandmothers, old soldiers and shopkeepers are trained one afternoon a week to stand guard at the village gate with a carbine. It is not an army. It does give every hamlet a reason to be on one side."
 COLDWAR_SVN_mil_tr: "Territorial Pay and Survivors' Benefits"
 COLDWAR_SVN_mil_tr_desc: "A Popular Force soldier who is killed leaves a widow with a small pension, if she can find the clerk who keeps the file. The measure raises pay to something close to the regular army and puts a post office clerk in every district."
 COLDWAR_SVN_mil_air: "The Vietnamese Air Force"
 COLDWAR_SVN_mil_air_desc: "The VNAF is the American air war in miniature, and it is growing faster than anything else in the Republic. Aircraft arrive faster than pilots, and pilots faster than mechanics."
 COLDWAR_SVN_mil_h1: "A Modern Jet Air Force"
 COLDWAR_SVN_mil_h1_desc: "Supersonic fighters, radar-guided missiles and a squadron of Phantoms, if Washington will agree. The air staff wants the best aircraft the Republic can pay for. The American advisers ask who is going to fix them."
 COLDWAR_SVN_mil_h2: "A Simple, Supportable Fleet"
 COLDWAR_SVN_mil_h2_desc: "Propeller attack aircraft, light jets with a trainer's pedigree, transport planes and helicopters: machines that a Vietnamese mechanic can repair with a Vietnamese spanner. They are not glamorous. They stay in the air."
 COLDWAR_SVN_mil_h1f: "Radars and Interceptor Squadrons"
 COLDWAR_SVN_mil_h1f_desc: "Radar stations on the hills around Saigon and Da Nang scan to the north and the west. Behind them go the fighter squadrons and the anti-aircraft batteries that will have to answer for the sky if the enemy ever brings his own."
 COLDWAR_SVN_mil_h2f: "Helicopter Squadrons"
 COLDWAR_SVN_mil_h2f_desc: "Hundreds of UH-1 helicopters, flown by Vietnamese crews, lift battalions into landing zones, bring out the wounded and carry ammunition to the fire bases. The helicopter war is the one the Americans taught best."
 COLDWAR_SVN_mil_hm: "Pilots and Mechanics"
 COLDWAR_SVN_mil_hm_desc: "Flight schools at Nha Trang and Can Tho turn out pilots in their hundreds. A school for mechanics, with its own textbooks in Vietnamese, turns out the harder thing to find: a man who knows why the engine stopped."
 COLDWAR_SVN_mil_hours: "Spare Parts and the Flying Hour Budget"
 COLDWAR_SVN_mil_hours_desc: "A squadron that cannot buy spare parts flies five hours a month and keeps half its aircraft on the ramp. The air staff therefore writes a budget in flying hours, each with its fuel and its spare engine, and defends it against the army."
 COLDWAR_SVN_mil_hs1: "Hardened Bases and Shelters"
 COLDWAR_SVN_mil_hs1_desc: "Concrete shelters and fuel stores replace rows of aircraft in the open. At Bien Hoa, Da Nang and Pleiku the planes go under cover, and the ground crews finally sleep through a rocket attack."
 COLDWAR_SVN_mil_hs2: "Air-Ground Operations Centres"
 COLDWAR_SVN_mil_hs2_desc: "Each corps gets a joint centre where an army major and an air force major sit at one table and decide where the bombs go. It used to be the Americans' table. Now the Vietnamese must learn to eat there alone."
 COLDWAR_SVN_mil_navy: "The River Forces Inherited"
 COLDWAR_SVN_mil_navy_desc: "Hundreds of patrol boats, landing craft and monitors, built for the American river war, are being signed over to Vietnamese crews. The navy is learning to run a flotilla of a size it never planned for."
 COLDWAR_SVN_mil_n1: "Blue-Water Ambitions"
 COLDWAR_SVN_mil_n1_desc: "Frigates and cutters able to leave the coast and stay at sea for weeks. The navy believes that the sea and the oil beneath it are the Republic's long-term future, and that China, not Hanoi, will be the problem there."
 COLDWAR_SVN_mil_n2: "A River and Coast Navy"
 COLDWAR_SVN_mil_n2_desc: "Shallow-draft boats, junks and a coastal radar chain, kept within sight of the shore and the canals. The navy supports the army and the farmers, guards the waterways of the delta and leaves the open sea to somebody else."
 COLDWAR_SVN_mil_n1f: "Cutters and Escort Vessels"
 COLDWAR_SVN_mil_n1f_desc: "A handful of large ships, each with a crew drawn from every river unit in the fleet. They are the pride of the service and its heaviest burden. The admirals insist that a navy is not a navy without a flag at sea."
 COLDWAR_SVN_mil_n2f: "Coastal Surveillance Stations"
 COLDWAR_SVN_mil_n2f_desc: "Radar posts and boat stations along twelve hundred miles of coast watch for infiltrating trawlers and fishermen who carry more than fish. Every trawler boarded and searched is one fewer supply convoy for the delta."
 COLDWAR_SVN_mil_nm: "The Mekong Convoys and the Sea Lines"
 COLDWAR_SVN_mil_nm_desc: "Rice, fuel and fertiliser go down the Mekong in convoys, and coastal freighters carry the northern provinces' supplies from Da Nang to Saigon. A navy that keeps those lines open earns its place in the budget."
 COLDWAR_SVN_mil_isl: "The Paracel and Spratly Garrisons"
 COLDWAR_SVN_mil_isl_desc: "A few dozen men on coral islets claim sovereignty over a sea that holds fish, perhaps oil, and a great power that has not yet decided how much it wants. The garrisons are small. The flag they carry is larger."
 COLDWAR_SVN_mil_yard: "Ba Son and the Ship Repair Yards"
 COLDWAR_SVN_mil_yard_desc: "The old French arsenal at Saigon, which has patched American patrol boats for a decade, is given its own training school and orders from the navy. A coastal republic should not send every hull to Subic Bay for repair."
 ### Pacification and Society ###
 COLDWAR_SVN_sec_root: "Security and Society"
 COLDWAR_SVN_sec_root_desc: "The war is fought in villages the army passes through once a month and in streets where pagodas, churches and newspapers each keep their own opinion. Security here is built from clerks, policemen and patient local politics as much as from soldiers."
 COLDWAR_SVN_sec_pac: "The Hamlet Evaluation System"
 COLDWAR_SVN_sec_pac_desc: "Each month an adviser grades every hamlet from A to E, and a computer in Saigon turns the grades into a map. The map is cheerful. The countryside is not always consulted."
 COLDWAR_SVN_sec_p1: "Phoenix by Quota"
 COLDWAR_SVN_sec_p1_desc: "Each district committee receives a monthly figure of enemy cadres to neutralise, and a chief who falls short is asked why. The figure is met. Not every name on the list was ever a cadre, and the families of those who were not do not forget."
 COLDWAR_SVN_sec_p2: "Warrants and Courts"
 COLDWAR_SVN_sec_p2_desc: "A suspect is named in a warrant, brought before a judge and allowed a lawyer. It is slower, and some cadres walk free for want of evidence. A government that wins a hamlet by law keeps it longer than one that wins it by dossier."
 COLDWAR_SVN_sec_p1f: "Provincial Reconnaissance Units"
 COLDWAR_SVN_sec_p1f_desc: "Armed teams of local men and former ralliers, paid and advised by the Americans, go after named cadres by night. They are effective. Only their commanders can say how the targets are chosen."
 COLDWAR_SVN_sec_p2f: "The Special Branch Under the Courts"
 COLDWAR_SVN_sec_p2f_desc: "The police Special Branch keeps its files, but every arrest must be countersigned by a prosecutor, and every detainee must be accounted for in a register. Clerks complain about the paperwork. Mothers stop asking at the gate."
 COLDWAR_SVN_sec_pm: "The National Police and Field Force"
 COLDWAR_SVN_sec_pm_desc: "A policeman in a village is a better guarantee of order than a company of regulars, and costs far less. The National Police, the uniformed branch and the Field Force are brought into one command with its own pay scale and school."
 COLDWAR_SVN_sec_q1: "Amnesty and the Open Arms"
 COLDWAR_SVN_sec_q1_desc: "A man who walks out of the jungle with a rifle and a leaflet is given a certificate, a few weeks of food and a chance to start again. Soldiers who lost friends to him resent the arrangement. It brings the enemy home faster than any bullet does."
 COLDWAR_SVN_sec_q2: "Detention of Suspected Cadres"
 COLDWAR_SVN_sec_q2_desc: "Suspects and returnees alike are kept in provincial centres until their files are cleared. A man held for a year is a man who cannot carry a mine. He is also a man whose village learns what the Republic does with its enemies."
 COLDWAR_SVN_sec_q1f: "Vocational Centres for Returnees"
 COLDWAR_SVN_sec_q1f_desc: "At the Open Arms centres, former guerrillas learn to drive a tractor, mend a pump or lay a brick. A man who earns a wage is a man who has a reason not to go back."
 COLDWAR_SVN_sec_q2f: "Provincial Prisons and Military Courts"
 COLDWAR_SVN_sec_q2f_desc: "Military courts try cases in a day, and the provincial prisons hold more people than they were built for. The system is expensive to run and everyone in the province knows what it is for."
 COLDWAR_SVN_sec_qm: "Revolutionary Development Cadres"
 COLDWAR_SVN_sec_qm_desc: "Teams of young men and women, trained for a few months at Vung Tau, live in the hamlet, build the school and the well and listen to complaints. They are the one government institution that expects to be known by name."
 COLDWAR_SVN_sec_pfin: "Province Security Committees"
 COLDWAR_SVN_sec_pfin_desc: "The province chief, the police chief, the sector commander and the development director meet weekly to decide who in the province is to be helped, watched or left alone. Within two years the enemy's shadow government has lost most of its names in the hamlets."
 COLDWAR_SVN_sec_cio: "The Central Intelligence Organisation"
 COLDWAR_SVN_sec_cio_desc: "A small, well-funded office in Saigon that reports to the President, keeps files on everyone who matters and has outlived every government since Diem. It is as comfortable with American money as with American advice."
 COLDWAR_SVN_sec_mss: "The Military Security Service"
 COLDWAR_SVN_sec_mss_desc: "Every battalion has a security officer, and every security officer reports to Saigon. The service watches for spies in the ranks and, because officers are people, for opinions as well. Generals prefer to be watched by their own."
 COLDWAR_SVN_sec_ci: "Counter-Infiltration Boards"
 COLDWAR_SVN_sec_ci_desc: "Agents of the other side have sat in ministries, newspaper offices and the Palace itself. A board of three, a soldier, a policeman and a jurist, now examines every staff officer with access to the war plans. Colleagues look away when it passes."
 COLDWAR_SVN_sec_sig: "Signals Intelligence and Radio Intercept"
 COLDWAR_SVN_sec_sig_desc: "Vietnamese operators listen to the northern radio net and to their own. As the American listening posts are closed one by one, the Republic must hire the translators and mathematicians that it never thought it needed."
 COLDWAR_SVN_sec_soc: "A Society Under Strain"
 COLDWAR_SVN_sec_soc_desc: "Seventeen million people, nine in ten of them Vietnamese and the rest Chinese, Khmer, Cham and a score of highland peoples, divided among half a dozen religions and a newspaper for every opinion. The first task of government is to know whom it is addressing."
 COLDWAR_SVN_sec_sh1: "Students and the Universities"
 COLDWAR_SVN_sec_sh1_desc: "University enrolment has grown from two thousand at the partition to tens of thousands. The faculties train doctors and engineers. They also train a generation that debates the draft, the war and the Palace in the same breath."
 COLDWAR_SVN_sec_pr1: "The Press Deposit Decree"
 COLDWAR_SVN_sec_pr1_desc: "A daily paper must lodge a deposit of twenty million piastres or close. The Palace says that this keeps out the rumour sheets. Publishers say that it keeps out everyone but the Palace."
 COLDWAR_SVN_sec_pr2: "A Free and Contentious Press"
 COLDWAR_SVN_sec_pr2_desc: "The 1967 constitution promised a press that could print what it liked, and the Assembly is finally asked to mean it. Editors abuse ministers, and ministers occasionally resign. Washington can read the Saigon papers and sees a country worth defending."
 COLDWAR_SVN_sec_pr1f: "The Information Ministry's Briefings"
 COLDWAR_SVN_sec_pr1f_desc: "Every morning the ministry hands each editor a list of what happened yesterday, and a shorter list of what did not. The offensive is a victory, the price of rice has stopped rising and the Archbishop sends his greetings."
 COLDWAR_SVN_sec_pr2f: "Press Cooperatives and the Press Council"
 COLDWAR_SVN_sec_pr2f_desc: "Reporters own their papers in cooperatives, and a council of editors rules on complaints. The papers argue less with the government and more with each other, which is a form of progress."
 COLDWAR_SVN_sec_prm: "Public Opinion and the Censors"
 COLDWAR_SVN_sec_prm_desc: "A nation at war has to be told what it is fighting for. A broadcasting office in Saigon replies to the northern radio every evening, in verse as well as in news."
 COLDWAR_SVN_sec_sh2: "Ministry for Ethnic Minority Development"
 COLDWAR_SVN_sec_sh2_desc: "A ministry staffed in part by highlanders themselves, with a budget for schools, clinics and the recognition of customary law. The agreement of 1969 did not end every grievance. It gave the highland peoples a minister to complain to."
 COLDWAR_SVN_sec_hl1: "A Highland Autonomy Statute"
 COLDWAR_SVN_sec_hl1_desc: "The highland provinces receive councils with their own courts, schools and land registers, and a say in the allocation of land. The generals fear the precedent. The villagers are glad to see their own elders in the district office."
 COLDWAR_SVN_sec_hl2: "Settlement and Assimilation"
 COLDWAR_SVN_sec_hl2_desc: "Land development centres bring Vietnamese farmers to the plateaus, and the roads, schools and clinics follow them. Highland peoples are welcomed into the national schools and the national army. The old customs survive, but they no longer rule."
 COLDWAR_SVN_sec_hl1f: "Customary Courts, Schools and Land Titles"
 COLDWAR_SVN_sec_hl1f_desc: "Customary law courts decide land disputes in the highland languages, and the title registers record family holdings that were never written down. A man who owns his field has fewer reasons to follow anyone with a rifle."
 COLDWAR_SVN_sec_hl2f: "Highland Settlement Centres"
 COLDWAR_SVN_sec_hl2f_desc: "Hamlets of fifty families on cleared land, each with a pump, a school and a path to the road. The coffee, tea and rubber they plant are export crops that owe nothing to American credit."
 COLDWAR_SVN_sec_hlm: "Minorities of the Delta and the Cities"
 COLDWAR_SVN_sec_hlm_desc: "In Cholon the Chinese trade rice, cloth and credit under rules that Diem wrote in the mid-1950s. In the delta the Khmer Krom keep their pagodas and their own schools. Equal rules on citizenship, language and trade cost little, and are rarely tried."
 COLDWAR_SVN_sec_faith: "The Council of Religious Communities"
 COLDWAR_SVN_sec_faith_desc: "The An Quang and Quoc Tu Buddhists, the Catholic dioceses, the Hoa Hao and the Cao Dai each run schools, clinics and property of their own. A common council does not make them agree. It makes them sit in the same room."
 COLDWAR_SVN_sec_bud: "The An Quang and Quoc Tu Pagodas"
 COLDWAR_SVN_sec_bud_desc: "The pagodas run orphanages, dispensaries and schools in nearly every town. The two great Buddhist institutions disagree about the war, but they agree about the orphans. A government that funds the clinics gets, on average, fewer protests."
 COLDWAR_SVN_sec_sect: "Hoa Hao and Cao Dai Provinces"
 COLDWAR_SVN_sec_sect_desc: "The western delta belongs to the Hoa Hao, and the plain around Tay Ninh to the Cao Dai. Their notables have hosted, taxed and fought for every Saigon government since Diem, and want to be told they are partners rather than tolerated."
 COLDWAR_SVN_sec_co1: "Prosecute Senior Officers"
 COLDWAR_SVN_sec_co1_desc: "A special tribunal is empowered to try generals and province chiefs for embezzlement and the sale of army supplies. Priests and journalists applaud. In the corps headquarters, the friends of the accused begin to ask who will be next."
 COLDWAR_SVN_sec_co2: "Quiet Retirement and Pensions"
 COLDWAR_SVN_sec_co2_desc: "Officers whose names appear in the complaints are posted to embassies, universities or comfortable retirement. Nobody is tried and nobody is shamed. The Republic remembers that the last time a general was publicly humiliated, it was followed by a coup."
 COLDWAR_SVN_sec_co1f: "The Narcotics Inquiry"
 COLDWAR_SVN_sec_co1f_desc: "American newspapers say that heroin passes through Saigon with the knowledge of senior officers. The Palace may deny it, or it may open the files and see who else is in them. The files are heavy."
 COLDWAR_SVN_sec_co2f: "A Pension and a Quiet Word"
 COLDWAR_SVN_sec_co2f_desc: "A retired colonel receives a pension, a house in Dalat and a letter thanking him for his service. In exchange he agrees to see fewer visitors. Everyone who matters is spared an embarrassment."
 COLDWAR_SVN_sec_com: "War Veterans and Invalids"
 COLDWAR_SVN_sec_com_desc: "Hundreds of thousands of men have left the army with a missing limb and a pension too small to buy rice. They gather in committees and march on the National Assembly. A republic that pays them on time has a lasting reason to exist."
 ### Foreign Policy and Agreements ###
 COLDWAR_SVN_for_root: "A Foreign Policy for a Republic at War"
 COLDWAR_SVN_for_root_desc: "The Ministry of Foreign Affairs counts friends the way a pawnbroker counts rings: by weight and by what each will fetch. Washington pays most of the bills, Seoul and Canberra sent soldiers, and nobody has yet found a way to a seat at the United Nations."
 COLDWAR_SVN_for_a_cip: "Commercial Import Programme Renewal"
 COLDWAR_SVN_for_a_cip_desc: "The import licences were never charity. They turned American dollars into the piastres the army needed and made merchants of many colonels' relatives. Washington asks how long this is meant to last, and the ministry answers with a renewal on stated terms."
 COLDWAR_SVN_for_a_wash: "Everything on Washington"
 COLDWAR_SVN_for_a_wash_desc: "The President reads the matter simply: only one power can stop the northern divisions, and it must be made to feel that Saigon's fate is its own. Every request goes to the embassy first, and every speech is written with an American listener in mind."
 COLDWAR_SVN_for_a_asia: "Many Friends in Asia"
 COLDWAR_SVN_for_a_asia_desc: "The Foreign Ministry lists every Asian government that fears the same enemy and has soldiers, rice or credit to spare. If Washington tires of the war, there should be somebody else's flag on the table too."
 COLDWAR_SVN_for_a_nixon: "A Written Security Assurance"
 COLDWAR_SVN_for_a_nixon_desc: "A private letter is worth more than a public speech, as long as the President who signs it stays in office. The Palace asks for the promise in ink: aid, replacement arms and a response if Hanoi breaks the line."
 COLDWAR_SVN_for_a_rok: "Korean Troops for Contracts"
 COLDWAR_SVN_for_a_rok_desc: "Seoul's soldiers are paid by Washington and its construction firms by everyone else. Saigon proposes to keep a brigade and some bulldozers on the same terms: dollars for the Korean treasury, roads and depots for the Republic."
 COLDWAR_SVN_for_a_enh: "Enhance Equipment and Maintenance"
 COLDWAR_SVN_for_a_enh_desc: "The depots have learned what happens when a promised aircraft arrives without a technician. This agreement names the airframes, the spare parts and the contractors who stay to keep them flying, and puts the bill in plain figures."
 COLDWAR_SVN_for_a_air: "Air Support and Basing"
 COLDWAR_SVN_for_a_air_desc: "Gunships, tankers and bombers rise from fields whose gates are guarded by Vietnamese sentries. Saigon offers hangars and runways in return for a standing arrangement on call-out times. The pilots call it civilised."
 COLDWAR_SVN_for_a_aus: "Australian Advisers and Training Team"
 COLDWAR_SVN_for_a_aus_desc: "Warrant officers from Canberra teach ARVN sergeants to read a map, a patrol and a hamlet. They are few and good at their trade. Saigon asks that the team stay and that more places in the school be opened."
 COLDWAR_SVN_for_a_tha: "Thai Bases and a Division"
 COLDWAR_SVN_for_a_tha_desc: "Bangkok's price for hosting the American air war has always been paid in somebody else's currency. Saigon proposes to add a plain commercial line: supplies, training places and a division's worth of experience in return for steady payments."
 COLDWAR_SVN_for_a_nz: "New Zealand Surgeons and Gunners"
 COLDWAR_SVN_for_a_nz_desc: "New Zealand sends few men and chooses them well: a surgical team, an artillery battery, a handful of engineers. The Foreign Ministry asks Wellington whether a smaller contribution than before is still a contribution."
 COLDWAR_SVN_for_a_phl: "Civic Action and Medical Teams"
 COLDWAR_SVN_for_a_phl_desc: "Manila learned the lesson of its own Huk war and sent engineers and doctors where others sent battalions. Wells, bridges and dispensaries are cheap, and the villages remember who dug them."
 COLDWAR_SVN_for_a_roc: "Political Warfare Advisers From Taipei"
 COLDWAR_SVN_for_a_roc_desc: "Taipei knows the Chinese communists as no one else does, and has taught three decades of lessons about them to anyone willing to sit still. Saigon asks for the political warfare officers, and for the agronomists who bring better rice with them."
 COLDWAR_SVN_for_b_dn: "Da Nhim and Japanese Hydropower"
 COLDWAR_SVN_for_b_dn_desc: "The Japanese built Da Nhim, 160 megawatts of mountain water for Saigon, and called it reparations. A second stage would pay for itself in electric light, and the Japanese contractors would not mind that either."
 COLDWAR_SVN_for_b_tokyo: "Tokyo as Banker"
 COLDWAR_SVN_for_b_tokyo_desc: "Japanese trading houses sell motorbikes, radios and loans in every Saigon street. The Foreign Ministry decides that the yen is a friend worth cultivating, even if Washington and Paris take note."
 COLDWAR_SVN_for_b_paris: "A Channel Through Paris"
 COLDWAR_SVN_for_b_paris_desc: "Since 1965 France has kept only a consulate in Saigon, but it still has a delegation in Hanoi. The Foreign Ministry hopes the Quai d'Orsay can carry a message that no American can, and accepts that Paris will ask for something in return."
 COLDWAR_SVN_for_b_yen: "Yen Credit Lines"
 COLDWAR_SVN_for_b_yen_desc: "A Tokyo bank offers to finance a power line, a cement kiln and a rice mill at rates Washington would not match. The conditions are of the kind bankers call technical."
 COLDWAR_SVN_for_b_mich: "Michelin and the Plantations"
 COLDWAR_SVN_for_b_mich_desc: "The great French rubber estates have survived two wars and several governments by being useful to all of them. The Republic proposes a charter: protection for the plantations in exchange for output, jobs and revenue."
 COLDWAR_SVN_for_b_ger: "Hospital Ship and Technical Schools"
 COLDWAR_SVN_for_b_ger_desc: "The white ship Helgoland lay in Saigon harbour and then at Da Nang, and thousands came aboard. Bonn is now asked for something that lasts longer: classrooms and workshops where the doctors and mechanics of the future can be trained."
 COLDWAR_SVN_for_b_cho: "Cho Ray Hospital Wing"
 COLDWAR_SVN_for_b_cho_desc: "Cho Ray treats the poor of Cholon and the wounded of three provinces in corridors planned for a smaller city. A Japanese wing would add beds and an operating floor, and the Ministry of Health is prepared to be grateful."
 COLDWAR_SVN_for_b_adb: "Asian Development Bank Window"
 COLDWAR_SVN_for_b_adb_desc: "The Bank lends for harbours and irrigation, and asks for audited accounts and a plan. The Ministry of Planning has the plans and a growing stack of audited accounts, which lenders find unusual in wartime."
 COLDWAR_SVN_for_b_iran: "Tehran Oil and Credit"
 COLDWAR_SVN_for_b_iran_desc: "Iran has oil to spare and an emperor who enjoys being asked. Saigon sends an envoy with a short list: crude on credit, a few engineers and a statement that two capitals face the same enemy."
 COLDWAR_SVN_for_b_saudi: "Cautious Loan Talks in Riyadh"
 COLDWAR_SVN_for_b_saudi_desc: "An envoy with a plan and a briefcase proposes to ask the oil kingdoms for a very large loan. The Foreign Ministry authorises talks with no promise that anything is signed, and a firm instruction not to say how much is hoped for."
 COLDWAR_SVN_for_c_cam: "An Understanding With Phnom Penh"
 COLDWAR_SVN_for_c_cam_desc: "Communist divisions shelter in Cambodia's eastern provinces, and Phnom Penh can neither expel them nor admit they are there. Saigon offers border liaison, joint patrols and money for what Cambodia cannot police. Whoever rules Phnom Penh may take the offer."
 COLDWAR_SVN_for_c_aspac: "Asian and Pacific Council Alignment"
 COLDWAR_SVN_for_c_aspac_desc: "ASPAC sits in Seoul with communiques and no army, but its delegates are the governments that send divisions. Saigon chooses to be known as a front-line member, with every obligation that implies."
 COLDWAR_SVN_for_c_asean: "Neutral Southeast Asia, ASEAN Style"
 COLDWAR_SVN_for_c_asean_desc: "Five governments signed a short declaration in Bangkok in 1967 and have written little since. Saigon sends observers and wonders whether a region that wishes to be left alone has room for a country that wishes to survive."
 COLDWAR_SVN_for_c_aspac_f: "ASPAC Joint Security Staff Talks"
 COLDWAR_SVN_for_c_aspac_f_desc: "Delegates from nine capitals agree to meet twice a year behind closed doors and call it consultation. Saigon asks for specifics: intelligence on infiltration routes, common radio procedures and a list of who trains whom."
 COLDWAR_SVN_for_c_indo: "Jakarta Neutral Partnership"
 COLDWAR_SVN_for_c_indo_desc: "Indonesia has oil, rice and a general who remembers 1965 as a victory. It will sit on the commission that watches a ceasefire but will not join an alliance. A quiet partnership is still more than most expect."
 COLDWAR_SVN_for_c_my: "Police and Counter-Insurgency School"
 COLDWAR_SVN_for_c_my_desc: "Sir Robert Thompson taught Malaya's police how to win a village by day and hold it by night. Kuala Lumpur's instructors have taught the same lessons to Vietnamese for years, and Saigon asks for more places in the course."
 COLDWAR_SVN_for_c_rep: "Repatriating Vietnamese Residents"
 COLDWAR_SVN_for_c_rep_desc: "Hundreds of thousands of Vietnamese lived in Cambodia long before this war, and since March 1970 many have been robbed, driven out or killed. Saigon arranges boats and trucks and plans where the returnees will live."
 COLDWAR_SVN_for_c_laos: "Laotian Corridor Understanding"
 COLDWAR_SVN_for_c_laos_desc: "The Ho Chi Minh Trail runs through the Royal Lao Government's territory without asking permission. Vientiane cannot stop it and Saigon cannot ignore it, so the generals begin to talk about a corridor and about who holds which village."
 COLDWAR_SVN_for_c_sg: "Singapore, the Port and the Bank"
 COLDWAR_SVN_for_c_sg_desc: "Lee Kuan Yew admires efficiency wherever he finds it and is known to lend at a profit. Singapore's harbour handles Saigon's freight, and its bankers could handle Saigon's savings."
 COLDWAR_SVN_for_d_hub: "Quiet Channels Across the Lines"
 COLDWAR_SVN_for_d_hub_desc: "A republic at war keeps its telephone open to the other side, officially for the exchange of prisoners and unofficially for everything else. Peking, Moscow and Hanoi are each given a number to call."
 COLDWAR_SVN_for_d_press: "Press the Paracels Claim"
 COLDWAR_SVN_for_d_press_desc: "The Crescent Group has been Vietnamese since the Nguyen emperors, and the navy carries the maps to prove it. A Saigon that gives up the Paracels will soon be asked to give up the Spratlys."
 COLDWAR_SVN_for_d_shelve: "Shelve the Paracels for Trade"
 COLDWAR_SVN_for_d_shelve_desc: "A claim is a bargaining chip, not a flag to be fought over. The Foreign Ministry proposes to leave the maps unchanged and the ships in harbour while the cargoes from Hong Kong get cheaper."
 COLDWAR_SVN_for_d_press_f: "Truong Sa Garrisons and a UN Complaint"
 COLDWAR_SVN_for_d_press_f_desc: "The marines on the Spratly rocks have a flagpole and a well. Saigon will complain at the United Nations and reinforce the islets in the same week, and a navy that has never fought a fleet action must prepare for one."
 COLDWAR_SVN_for_d_shelve_f: "Hong Kong Trade and a Modus Vivendi"
 COLDWAR_SVN_for_d_shelve_f_desc: "Cargoes pass through Hong Kong that nobody admits originate on the mainland. Saigon proposes a standing arrangement: quiet customs treatment in exchange for a quiet Paracels."
 COLDWAR_SVN_for_d_ussr: "Neutrality for a Seat at the UN"
 COLDWAR_SVN_for_d_ussr_desc: "The Soviet Union has vetoed Saigon's applications to the United Nations every time, and a veto can be withdrawn. Moscow hints that a Republic willing to stay outside every alliance could expect recognition and a vote."
 COLDWAR_SVN_for_d_prisoner: "Prisoner Exchange Commission"
 COLDWAR_SVN_for_d_prisoner_desc: "Each side holds thousands of the other's men and knows precisely how many. A bilateral committee begins work on lists, aircraft and the families who wait at both ends of the line."
 COLDWAR_SVN_for_d_border: "Border Trade at the Demarcation Line"
 COLDWAR_SVN_for_d_border_desc: "On both banks of the Ben Hai River farmers have waited for years for a market day. A customs hut and a tariff table would make an economy out of smuggling."
 COLDWAR_SVN_for_d_recog: "Mutual Recognition and Coexistence"
 COLDWAR_SVN_for_d_recog_desc: "Two governments agree to exist at the same time. Neither will say it likes the other, and each opens a mission that looks like a trade office. It is the least that a peace could mean."
 ### Research bonus names ###
 COLDWAR_SVN_ky_treas_2: "A Treasury That Pays the Troops"
 COLDWAR_SVN_offer_for_a_enh_research: "Enhance Equipment and Maintenance"
 COLDWAR_SVN_offer_for_b_ger_research: "Hospital Ship and Technical Schools"
 COLDWAR_SVN_third_phased_f_2: "The Reconstruction Commissariat"
 ### National Spirits ###
 COLDWAR_SVN_L1_0: "The American Lifeline"
 COLDWAR_SVN_L1_0_desc: "Licensed importers buy American dollars at a friendly rate, and the piastres they pay keep our army and civil service afloat. The shops are full, our own tax base is thin, and every month depends on a vote in Washington.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_eco_ren$§! focus."
 COLDWAR_SVN_L2_0: "The Piastre Problem"
 COLDWAR_SVN_L2_0_desc: "The official dollar costs 118 piastres and the street dollar more than three times as much. Prices outrun wages, savings go into gold and taxes arrive late and devalued.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_eco_pl$§! focus."
 COLDWAR_SVN_L3_0: "Ghost Soldiers and Flower Soldiers"
 COLDWAR_SVN_L3_0_desc: "Our rolls carry ghost soldiers, dead or deserted men whose pay their commanders keep, and flower soldiers, who pay their commanders to stay at home. Promotion follows loyalty more often than merit.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_mil_lead$§! focus."
 COLDWAR_SVN_L4_0: "Vietnamization"
 COLDWAR_SVN_L4_0_desc: "The Americans are handing us the war, their training and their equipment. Our soldiers learn quickly, but fuel, spare parts and air support still come from across the Pacific.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_mil_army$§! focus."
 COLDWAR_SVN_L5_0: "The Shadow Government"
 COLDWAR_SVN_L5_0_desc: "The Front's cadres collect taxes, recruit and hold courts by night in hamlets that fly our flag by day.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_sec_pac$§! focus."
 COLDWAR_SVN_L6_0: "A Mosaic of Sects and Minorities"
 COLDWAR_SVN_L6_0_desc: "An Quang Buddhists, Catholic refugee parishes, the Hoa Hao and the Cao Dai with their own militias, the highland peoples and the Chinese of Cholon: each puts its own loyalties before the Republic's.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_sec_sh2$§! focus."
 COLDWAR_SVN_L7_0: "Uprooted Millions"
 COLDWAR_SVN_L7_0_desc: "Millions have fled the fighting into camps along the highways and on the edges of Saigon. Their fields lie empty, the cities are overcrowded and the relief bill grows every month.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_agri_rfh$§! focus."
 COLDWAR_SVN_L1_1: "Managed Dependence"
 COLDWAR_SVN_L1_1_desc: "The import licences now buy fertiliser, spare parts and machinery rather than motorbikes. We still live on American money, but we choose what it buys.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_eco_trade$§! focus."
 COLDWAR_SVN_L1_2: "Trade, Not Aid"
 COLDWAR_SVN_L1_2_desc: "Our exporters earn a growing share of the dollars we spend, and the American envelope matters a little less each year.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_eco_cap$§! focus."
 COLDWAR_SVN_L2_1: "A Managed Exchange Rate"
 COLDWAR_SVN_L2_1_desc: "The exchange rate is now set by decree and adjusted on evidence rather than rumour. Savers have begun to trust the piastre again, if not yet the government.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_eco_sound$§! focus."
 COLDWAR_SVN_L2_2: "A Sound Piastre"
 COLDWAR_SVN_L2_2_desc: "Inflation is a number rather than a mood, and the piastre still buys something at the end of the month.\n§W--------------§!\nThis national spirit is the last stage of its chain and will never be §RRemoved§!."
 COLDWAR_SVN_L1_3: "A Self-Sustaining Republic"
 COLDWAR_SVN_L1_3_desc: "Taxes pay the army and exports pay for the fuel. American help is welcome, but our survival no longer depends on it.\n§W--------------§!\nThis national spirit is the last stage of its chain and will never be §RRemoved§!."
 COLDWAR_SVN_L7_1: "Return to the Village"
 COLDWAR_SVN_L7_1_desc: "Trucks carry families back to hamlets declared safe, with a roof sheet and a sack of rice. Many are home; many are still waiting.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_agri_rm$§! focus."
 COLDWAR_SVN_L7_2: "Resettled and Rebuilt"
 COLDWAR_SVN_L7_2_desc: "Resettled villages have schools, markets and a claim on the budget. The scars of displacement remain, but the camps are emptying.\n§W--------------§!\nThis national spirit is the last stage of its chain and will never be §RRemoved§!."
 COLDWAR_SVN_L4_1: "Vietnamization Completed"
 COLDWAR_SVN_L4_1_desc: "The ground war is ours, and so is the bill for every helicopter and spare engine the Americans left behind.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_mil_cap$§! focus."
 COLDWAR_SVN_L3_1: "Rolls Under Audit"
 COLDWAR_SVN_L3_1_desc: "Every battalion has been counted by name and the ghosts are gone from the rolls. The reasons men desert are not.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_mil_housing$§! focus."
 COLDWAR_SVN_L3_2: "A Paid and Present Army"
 COLDWAR_SVN_L3_2_desc: "Soldiers are paid on time and their families have a roof. Desertion has become the exception it should always have been.\n§W--------------§!\nThis national spirit is the last stage of its chain and will never be §RRemoved§!."
 COLDWAR_SVN_L4_2: "Self-Reliant Armed Forces"
 COLDWAR_SVN_L4_2_desc: "Our own depots, workshops and staff keep the armed forces in the field. What we still import, we can at least repair.\n§W--------------§!\nThis national spirit is the last stage of its chain and will never be §RRemoved§!."
 COLDWAR_SVN_L5_1: "A Contested Countryside"
 COLDWAR_SVN_L5_1_desc: "We now know which hamlets are ours, which are the enemy's and which belong to whoever came last. The shadow government is weaker, not gone.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_sec_pfin$§! focus."
 COLDWAR_SVN_L5_2: "The Infrastructure Broken"
 COLDWAR_SVN_L5_2_desc: "Most of the enemy's names in the hamlets are known, arrested or gone over to our side. A few cells survive, and they are patient.\n§W--------------§!\nThis national spirit is the last stage of its chain and will never be §RRemoved§!."
 COLDWAR_SVN_L6_1: "Negotiated Autonomies"
 COLDWAR_SVN_L6_1_desc: "The highland peoples have their own ministry, and the sects and the Chinese of Cholon have learned that Saigon will bargain. The bargains hold as long as Saigon keeps its side.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$COLDWAR_SVN_sec_faith$§! focus."
 COLDWAR_SVN_L6_2: "One Nation, Many Altars"
 COLDWAR_SVN_L6_2_desc: "Pagodas, churches and temples sit on one council and send their sons to one army. They still disagree, but in the same room.\n§W--------------§!\nThis national spirit is the last stage of its chain and will never be §RRemoved§!."
 COLDWAR_SVN_idea_the_guns_fall_silent: "The Guns Fall Silent"
 COLDWAR_SVN_idea_the_guns_fall_silent_desc: "Along the lines in the south the firing has stopped. Patrols stay in barracks, and farmers go back to fields they had not seen for years."
 COLDWAR_SVN_idea_the_southern_front_closed: "The Southern Front Closed"
 COLDWAR_SVN_idea_the_southern_front_closed_desc: "The southern front is quiet, and the divisions that held it can be used elsewhere. The cadres use the pause to rebuild their strength."
 COLDWAR_SVN_idea_a_broad_revolutionary_coalition: "A Broad Revolutionary Coalition"
 COLDWAR_SVN_idea_a_broad_revolutionary_coalition_desc: "The Front has always claimed to speak for more than one party. Now the claim has to be kept: teachers, monks and small traders sit in the same committees as the cadres."
 COLDWAR_SVN_idea_state_grain_procurement: "State Grain Procurement"
 COLDWAR_SVN_idea_state_grain_procurement_desc: "The state buys the rice crop at a fixed price and sells it where it is needed. Farmers complain about the price; the cities complain less than they did."
 COLDWAR_SVN_idea_confederation_with_the_north: "Confederation With the North"
 COLDWAR_SVN_idea_confederation_with_the_north_desc: "Two governments, one flag in the treaty halls. The Confederation has made the border a line on a map and little more."
 COLDWAR_SVN_idea_confederation_with_the_south: "Confederation With the South"
 COLDWAR_SVN_idea_confederation_with_the_south_desc: "Hanoi shares a common council with Saigon, and its officials now travel south. The northern state has had to learn to share."
 COLDWAR_SVN_idea_reunification_commission: "Reunification Commission"
 COLDWAR_SVN_idea_reunification_commission_desc: "A joint commission sits in Saigon to draw up the terms of a single state. Its meetings are long and its minutes are read in both capitals."
 COLDWAR_SVN_idea_reunification_commission_partner: "Reunification Commission"
 COLDWAR_SVN_idea_reunification_commission_partner_desc: "A joint commission sits to draw up the terms of a single state. Our delegates have learned that the south bargains hard and keeps its word."
 COLDWAR_SVN_idea_french_technical_cooperation: "French Technical Cooperation"
 COLDWAR_SVN_idea_french_technical_cooperation_desc: "French engineers and teachers have returned to Saigon at the invitation of the government. They are welcome in the ministries and in the lecture halls."
 COLDWAR_SVN_idea_return_to_the_saigon_market: "Return to the Saigon Market"
 COLDWAR_SVN_idea_return_to_the_saigon_market_desc: "French firms have reopened their old trading houses on the Saigon waterfront. Business has resumed on terms both sides can live with."
 COLDWAR_SVN_idea_soviet_technical_assistance: "Soviet Technical Assistance"
 COLDWAR_SVN_idea_soviet_technical_assistance_desc: "Soviet engineers, machine tools and licences have arrived by sea. Factories in the south now work to Moscow's drawings."
 COLDWAR_SVN_idea_a_harbour_on_the_south_china_sea: "A Harbour on the South China Sea"
 COLDWAR_SVN_idea_a_harbour_on_the_south_china_sea_desc: "Soviet ships have been given the use of a southern harbour. The fleet is pleased with the anchorage and the Kremlin with the political gain."
 COLDWAR_SVN_idea_recognised_government: "Recognised Government"
 COLDWAR_SVN_idea_recognised_government_desc: "Foreign ministries now answer our letters and send their ambassadors to our capital. Being recognised is slow work, but every embassy is another argument that the war has a second government."
 COLDWAR_SVN_idea_the_revolutionary_south: "The Revolutionary South"
 COLDWAR_SVN_idea_the_revolutionary_south_desc: "The Provisional Revolutionary Government governs the liberated provinces as a state in its own right. Land committees, people's councils and a single army give the south a shape that the Republic never managed."
 COLDWAR_SVN_idea_officers_for_national_concord: "Officers for National Concord"
 COLDWAR_SVN_idea_officers_for_national_concord_desc: "A circle of generals around Duong Van Minh has decided that the army's first duty is to end the war honestly. They are few, but they are respected in the barracks."
 COLDWAR_SVN_idea_the_inspectorate_of_the_republic: "The Inspectorate of the Republic"
 COLDWAR_SVN_idea_the_inspectorate_of_the_republic_desc: "Inspectors with their own budget and their own seal visit ministries and provinces without warning. Honest officials have started to look forward to them."
 COLDWAR_SVN_idea_american_reconstruction_credits: "American Reconstruction Credits"
 COLDWAR_SVN_idea_american_reconstruction_credits_desc: "American credits pay for bridges, roads and housing in the liberated provinces. Washington lends, but it no longer commands."
 COLDWAR_SVN_idea_an_orderly_exit_from_indochina: "An Orderly Exit From Indochina"
 COLDWAR_SVN_idea_an_orderly_exit_from_indochina_desc: "The United States has agreed to leave in stages and on a published timetable. The Americans want an exit, and the government wants a country to take over."
 COLDWAR_SVN_idea_lay_buddhist_committees: "Lay Buddhist Committees"
 COLDWAR_SVN_idea_lay_buddhist_committees_desc: "In every town the temples organise lay committees that keep order, feed the poor and speak for the people. The government can no longer pretend that Buddhists have no voice."
 COLDWAR_SVN_idea_struggle_committees: "Struggle Committees"
 COLDWAR_SVN_idea_struggle_committees_desc: "Students, monks and market women meet in the open to demand peace and honest government. The police watch them, and so does the whole country."
 COLDWAR_SVN_idea_veterans_on_the_land: "Veterans on the Land"
 COLDWAR_SVN_idea_veterans_on_the_land_desc: "Discharged soldiers receive a plot, a buffalo and a roof. A man with a field to tend is less eager to fight, and less easy to recruit for the other side."
 COLDWAR_SVN_idea_buddhist_social_service: "Buddhist Social Service"
 COLDWAR_SVN_idea_buddhist_social_service_desc: "Pagoda clinics, orphanages and schools reach villages that the ministries forgot. The An Quang monks have turned charity into a quiet political force."
 COLDWAR_SVN_idea_the_middle_way: "The Middle Way"
 COLDWAR_SVN_idea_the_middle_way_desc: "Neither Washington nor Hanoi, the government says, and for the first time it says it with a straight face. Neutral ground is a hard thing to hold, but it has its defenders."
 COLDWAR_SVN_idea_tripartite_council: "Tripartite Council"
 COLDWAR_SVN_idea_tripartite_council_desc: "The Republic, the Front and the neutralists sit at one table and share the seats of government. Nobody trusts the others, but everybody is present."
 COLDWAR_SVN_idea_reconstruction_budget: "Reconstruction Budget"
 COLDWAR_SVN_idea_reconstruction_budget_desc: "The first peacetime budget in a generation puts roads, bridges and schools ahead of ammunition. Auditors are making sure the money reaches the places it was meant for."
 COLDWAR_SVN_idea_ceasefire_in_the_south: "Ceasefire in the South"
 COLDWAR_SVN_idea_ceasefire_in_the_south_desc: "The ceasefire holds along the whole southern line. Civil servants and the cadres meet to settle disputes in the old way, by talking."
 COLDWAR_SVN_idea_ceasefire_in_the_south_partner: "Ceasefire in the South"
 COLDWAR_SVN_idea_ceasefire_in_the_south_partner_desc: "The ceasefire has quieted the southern line. Our forces keep their positions and our diplomats keep the talks alive."
 COLDWAR_SVN_idea_neutrality_under_guarantee: "Neutrality Under Guarantee"
 COLDWAR_SVN_idea_neutrality_under_guarantee_desc: "Five capitals have promised in writing to respect the neutrality of the south. The guarantee is only as good as its signatories, and for now it is good."
 COLDWAR_SVN_idea_convenor_of_the_indochina_conference: "Convenor of the Indochina Conference"
 COLDWAR_SVN_idea_convenor_of_the_indochina_conference_desc: "Paris has assumed the role of convenor of the Indochina conference. The French foreign ministry enjoys the part, and the other powers accept it."
 COLDWAR_SVN_idea_the_reconciled_republic: "The Reconciled Republic"
 COLDWAR_SVN_idea_the_reconciled_republic_desc: "Former enemies serve in the same ministries and the same army. The country is tired of war, and the settlement has turned that fatigue into a government."
 COLDWAR_SVN_idea_the_free_union_charter: "The Free Union Charter"
 COLDWAR_SVN_idea_the_free_union_charter_desc: "The charter guarantees the right to organise, to bargain and to strike within the law. The Confederation of Labour has its first real contract with the state."
 COLDWAR_SVN_idea_the_tillers_register: "The Tillers' Register"
 COLDWAR_SVN_idea_the_tillers_register_desc: "Every tenant and smallholder is entered in a public register, and the register decides who owns the harvest. Landlords dislike it. Farmers carry their entry like a title deed."
 COLDWAR_SVN_idea_landlord_investment_bonds: "Landlord Investment Bonds"
 COLDWAR_SVN_idea_landlord_investment_bonds_desc: "Landlords give up land and receive bonds in return. Some of them put the money into mills and workshops, and the countryside begins to find a use for old wealth."
 COLDWAR_SVN_idea_union_self_reliance: "Union Self-Reliance"
 COLDWAR_SVN_idea_union_self_reliance_desc: "The unions run their own savings banks, cooperatives and training halls. They no longer wait for ministers or foreign sponsors to help them."
 COLDWAR_SVN_idea_the_labour_and_land_compact: "The Labour and Land Compact"
 COLDWAR_SVN_idea_the_labour_and_land_compact_desc: "Workers, farmers and the state have signed a single agreement on wages, rents and prices. It is fragile and it is argued over daily, but it holds."
 COLDWAR_SVN_idea_provincial_development_boards: "Provincial Development Boards"
 COLDWAR_SVN_idea_provincial_development_boards_desc: "Each province has a board that plans its own roads, canals and markets. Governors who once waited for Saigon now compete with their neighbours."
 COLDWAR_SVN_idea_the_planning_and_budget_directorate: "The Planning and Budget Directorate"
 COLDWAR_SVN_idea_the_planning_and_budget_directorate_desc: "One office decides what the state can afford and in what order. Ministers grumble, but the budget has begun to balance on paper."
 COLDWAR_SVN_idea_the_rule_of_law_republic: "The Rule of Law Republic"
 COLDWAR_SVN_idea_the_rule_of_law_republic_desc: "Courts, codes and a free bar have become the pride of the government. Even officials now find that they must answer for what they do."
 COLDWAR_SVN_idea_the_integrated_parish: "The Integrated Parish"
 COLDWAR_SVN_idea_the_integrated_parish_desc: "Refugee parishes from the north have been given land and a voice in their districts. The church bell is now as familiar in the delta as the pagoda gong."
 COLDWAR_SVN_idea_mission_hospitals_and_schools: "Mission Hospitals and Schools"
 COLDWAR_SVN_idea_mission_hospitals_and_schools_desc: "Mission hospitals and schools serve all who come, whatever their faith. They are among the best run institutions in the country."
 COLDWAR_SVN_idea_the_solidarity_settlement: "The Solidarity Settlement"
 COLDWAR_SVN_idea_the_solidarity_settlement_desc: "Catholics, Buddhists and the government have signed an agreement on land, schools and public office. It is a settlement few believed possible."
 COLDWAR_SVN_idea_the_democracy_party: "The Democracy Party"
 COLDWAR_SVN_idea_the_democracy_party_desc: "The President has given his supporters a party of their own, with branches in every district. It is a machine, and it is also the first lasting political organisation in the south."
 COLDWAR_SVN_idea_directorate_general_of_taxation: "Directorate General of Taxation"
 COLDWAR_SVN_idea_directorate_general_of_taxation_desc: "A single directorate now assesses and collects the taxes that provinces and the army once took for themselves. Revenue is up, and so are the complaints."
 COLDWAR_SVN_idea_unified_territorial_command: "Unified Territorial Command"
 COLDWAR_SVN_idea_unified_territorial_command_desc: "The corps, the provinces and the territorial forces take their orders from one headquarters. The war is run by one staff and not by four."
 COLDWAR_SVN_idea_delta_self_defence_corps: "Delta Self-Defence Corps"
 COLDWAR_SVN_idea_delta_self_defence_corps_desc: "Villagers in the delta have been given rifles and training to defend their own hamlets. The Front is finding that such villages are hard to take."
 COLDWAR_SVN_idea_district_administration: "District Administration"
 COLDWAR_SVN_idea_district_administration_desc: "District chiefs have clerks, budgets and a mandate to build. The government is visible in the villages for the first time."
 COLDWAR_SVN_idea_the_second_republic_consolidated: "The Second Republic Consolidated"
 COLDWAR_SVN_idea_the_second_republic_consolidated_desc: "The constitution has survived three years of war, and the President has made himself its guardian. The Second Republic is no longer provisional."
 COLDWAR_SVN_idea_command_by_merit: "Command by Merit"
 COLDWAR_SVN_idea_command_by_merit_desc: "Promotion boards now read the record of a commander and not the name of his sponsor. The army has begun to trust its own colonels."
 COLDWAR_SVN_idea_corps_regional_commands: "Corps Regional Commands"
 COLDWAR_SVN_idea_corps_regional_commands_desc: "Each corps commander governs his region with a free hand and a regional staff. The system is efficient and it concentrates a good deal of power in a few men."
 COLDWAR_SVN_idea_lessons_of_route_9: "Lessons of Route 9"
 COLDWAR_SVN_idea_lessons_of_route_9_desc: "The staff has studied the fighting on Route 9 line by line. Planners now write the lessons of the Laos operation into every order of battle."
 COLDWAR_SVN_idea_general_reserve_divisions: "General Reserve Divisions"
 COLDWAR_SVN_idea_general_reserve_divisions_desc: "The best divisions are held in the centre, ready to move wherever the enemy strikes. The provinces envy them and rely on them."
 COLDWAR_SVN_idea_officers_schooled_for_command: "Officers Schooled for Command"
 COLDWAR_SVN_idea_officers_schooled_for_command_desc: "The academies at Da Lat and Thu Duc turn out officers who have studied staff work as well as tactics. A generation of better trained lieutenants is on its way."
 COLDWAR_SVN_idea_economic_planning_board: "Economic Planning Board"
 COLDWAR_SVN_idea_economic_planning_board_desc: "Generals and civil servants sit together to plan the national economy. Soldiers, it turns out, can be careful with a ledger."
 COLDWAR_SVN_idea_army_commissary_network: "Army Commissary Network"
 COLDWAR_SVN_idea_army_commissary_network_desc: "The army runs its own shops, depots and kitchens, and its soldiers eat better for it. Civilians in garrison towns have noticed."
 COLDWAR_SVN_idea_air_force_under_joint_command: "Air Force Under Joint Command"
 COLDWAR_SVN_idea_air_force_under_joint_command_desc: "The air force answers to the same staff as the army it supports. Pilots and ground commanders plan the day together."
 COLDWAR_SVN_idea_territorial_force_posts: "Territorial Force Posts"
 COLDWAR_SVN_idea_territorial_force_posts_desc: "Small posts of regional and popular forces line the roads and canals. Each one is weak, and together they make the countryside hard to cross unseen."
 COLDWAR_SVN_idea_a_republic_under_arms: "A Republic Under Arms"
 COLDWAR_SVN_idea_a_republic_under_arms_desc: "Every institution of the republic has a place in the defence plan, from the ministries to the village militia. The nation is organised as an army, and it knows it."
 COLDWAR_SVN_idea_supreme_military_committee: "Supreme Military Committee"
 COLDWAR_SVN_idea_supreme_military_committee_desc: "The generals have formed a council to govern in the name of the nation. Orders now come from one table, and one table alone."
 COLDWAR_SVN_idea_mobilisation_committees: "Mobilisation Committees"
 COLDWAR_SVN_idea_mobilisation_committees_desc: "Every ward and hamlet has a committee that enrols, supplies and watches. Few have been able to avoid its attention."
 COLDWAR_SVN_idea_self_reliant_maintenance_depots: "Self-Reliant Maintenance Depots"
 COLDWAR_SVN_idea_self_reliant_maintenance_depots_desc: "Ground crews have built their own depots and workshops, and the aircraft stay in the air with fewer foreign parts. It is not elegant, but it works."
 COLDWAR_SVN_idea_us_air_liaison_squadrons: "US Air Liaison Squadrons"
 COLDWAR_SVN_idea_us_air_liaison_squadrons_desc: "American officers sit in our operations rooms and direct the air war alongside our staff. Their radios save lives, and their presence is not forgotten."
 COLDWAR_SVN_idea_urban_relief_programme: "Urban Relief Programme"
 COLDWAR_SVN_idea_urban_relief_programme_desc: "Rice, work and cheap housing reach the slums of the capital. The poor have been told that the generals have not forgotten them."
 COLDWAR_SVN_idea_special_economic_court: "Special Economic Court"
 COLDWAR_SVN_idea_special_economic_court_desc: "A court of three judges tries speculators, hoarders and corrupt officials in a few days. Merchants fear its summons more than any inspector."
 COLDWAR_SVN_idea_fortress_south_garrisons: "Fortress South Garrisons"
 COLDWAR_SVN_idea_fortress_south_garrisons_desc: "Strong garrisons guard every town and bridge in the south. The country has become a fortress, and its people live within the walls."
 COLDWAR_SVN_idea_the_mobilised_nation: "The Mobilised Nation"
 COLDWAR_SVN_idea_the_mobilised_nation_desc: "Factories, schools and ministries all work to a single wartime plan. Sacrifice is asked of everyone, and almost everyone gives it."
 COLDWAR_SVN_idea_aid_contingency_reserve: "Aid Contingency Reserve"
 COLDWAR_SVN_idea_aid_contingency_reserve_desc: "The treasury now keeps a fund against the day that American aid shrinks. It is small beside the need, but it is ours."
 COLDWAR_SVN_idea_commercial_bank_network: "Commercial Bank Network"
 COLDWAR_SVN_idea_commercial_bank_network_desc: "New banks have opened branches in provincial towns and offer loans to traders and farmers. Credit, once a privilege of the capital, is slowly reaching the provinces."
 COLDWAR_SVN_idea_planning_directorate: "Planning Directorate"
 COLDWAR_SVN_idea_planning_directorate_desc: "A small team of economists sits above the ministries and tells them what the country can afford. Ministers dislike it, and the budget is better for it."
 COLDWAR_SVN_idea_export_processing_zone: "Export Processing Zone"
 COLDWAR_SVN_idea_export_processing_zone_desc: "A fenced zone near Saigon offers cheap land and low duties to firms that sell abroad. Foreign investors have started to visit, and some of them stay."
 COLDWAR_SVN_idea_the_exporting_republic: "The Exporting Republic"
 COLDWAR_SVN_idea_the_exporting_republic_desc: "Rice, rubber and light goods now leave our ports in growing numbers. The republic has learned to pay its way with what it sells."
 COLDWAR_SVN_idea_land_bond_market: "Land Bond Market"
 COLDWAR_SVN_idea_land_bond_market_desc: "Land bonds are bought and sold openly in the capital. Farmers can raise credit against their own paper, and investors can watch the harvest."
 COLDWAR_SVN_idea_rural_credit_network: "Rural Credit Network"
 COLDWAR_SVN_idea_rural_credit_network_desc: "Agricultural banks lend to farmers against the coming crop. Moneylenders in the villages have lost much of their business."
 COLDWAR_SVN_idea_rice_self_sufficiency: "Rice Self-Sufficiency"
 COLDWAR_SVN_idea_rice_self_sufficiency_desc: "The delta now feeds the republic from its own paddies. Imported rice is no longer a daily worry."
 COLDWAR_SVN_idea_export_light_industry: "Export Light Industry"
 COLDWAR_SVN_idea_export_light_industry_desc: "Textile, plastic and food factories on the edge of the cities work for foreign orders. They employ thousands who once had no work."
 COLDWAR_SVN_idea_private_power_concessions: "Private Power Concessions"
 COLDWAR_SVN_idea_private_power_concessions_desc: "Private firms build and run power stations under licence from the state. The lights stay on longer than they used to."
 COLDWAR_SVN_idea_national_oil_company: "National Oil Company"
 COLDWAR_SVN_idea_national_oil_company_desc: "The state oil company handles exploration, import and refining under one roof. Fuel is a national concern, and now it has a national owner."
 COLDWAR_SVN_idea_the_industrial_base: "The Industrial Base"
 COLDWAR_SVN_idea_the_industrial_base_desc: "Foundries, mills and workshops make up a modest but real industrial base. The country makes a good part of what it needs."
 COLDWAR_SVN_idea_republic_arsenals: "Republic Arsenals"
 COLDWAR_SVN_idea_republic_arsenals_desc: "State arsenals produce ammunition, small arms and spare parts for the army. A war fought partly with our own weapons is easier to sustain."
 COLDWAR_SVN_idea_renewed_import_credits: "Renewed Import Credits"
 COLDWAR_SVN_idea_renewed_import_credits_desc: "Fresh American credits allow merchants to import fuel, fertiliser and machinery. The shops are full, and the bill goes to Washington."
 COLDWAR_SVN_idea_piastre_counterpart_fund: "Piastre Counterpart Fund"
 COLDWAR_SVN_idea_piastre_counterpart_fund_desc: "The piastres paid for American goods are held in a joint fund and spent on local projects. The American embassy has a seat on the board."
 COLDWAR_SVN_idea_the_written_assurance: "The Written Assurance"
 COLDWAR_SVN_idea_the_written_assurance_desc: "The President has written to Saigon that America will stand by its ally. The letter sits in a drawer in the Palace, and every minister knows its contents."
 COLDWAR_SVN_idea_the_pledge_to_saigon: "The Pledge to Saigon"
 COLDWAR_SVN_idea_the_pledge_to_saigon_desc: "The White House has put its promise to Saigon on paper. It is a difficult promise to withdraw and an expensive one to keep."
 COLDWAR_SVN_idea_korean_brigade_and_builders: "Korean Brigade and Builders"
 COLDWAR_SVN_idea_korean_brigade_and_builders_desc: "Korean infantry and army engineers work side by side in the central highlands. They fight well, and they build roads when they are not fighting."
 COLDWAR_SVN_idea_remittances_from_the_mekong: "Remittances From the Mekong"
 COLDWAR_SVN_idea_remittances_from_the_mekong_desc: "Korean soldiers and workers in the south send their pay home. Seoul has no wish to see the arrangement end."
 COLDWAR_SVN_idea_the_enhance_pipeline: "The Enhance Pipeline"
 COLDWAR_SVN_idea_the_enhance_pipeline_desc: "Aircraft and spare parts are flowing from American stocks to our squadrons. Each delivery is larger than the last, and the pilots know it."
 COLDWAR_SVN_idea_replacement_arms_contracts: "Replacement Arms Contracts"
 COLDWAR_SVN_idea_replacement_arms_contracts_desc: "American factories hold large contracts to replace the arms sent to Saigon. The orders keep the lines running."
 COLDWAR_SVN_idea_combined_air_umbrella: "Combined Air Umbrella"
 COLDWAR_SVN_idea_combined_air_umbrella_desc: "American and Vietnamese aircraft fly under a single command. Ground troops see the same sky and hear the same radio net."
 COLDWAR_SVN_idea_forward_runways_in_the_south: "Forward Runways in the South"
 COLDWAR_SVN_idea_forward_runways_in_the_south_desc: "American squadrons use forward runways built in our territory. They are safe from the monsoon, if not from the enemy."
 COLDWAR_SVN_idea_the_australian_training_team: "The Australian Training Team"
 COLDWAR_SVN_idea_the_australian_training_team_desc: "Australian instructors live and work in the provinces, teaching the local forces. Their methods are modest and their results are plain to see."
 COLDWAR_SVN_idea_jungle_warfare_lessons: "Jungle Warfare Lessons"
 COLDWAR_SVN_idea_jungle_warfare_lessons_desc: "Australian officers have written down what they learned in the jungle and in Malaya. The notes have found their way to every school of arms."
 COLDWAR_SVN_idea_thai_rear_bases: "Thai Rear Bases"
 COLDWAR_SVN_idea_thai_rear_bases_desc: "Thai airfields and depots serve as a rear area for the allied war. The distance is a protection, and the airfields never close."
 COLDWAR_SVN_idea_american_dollars_in_bangkok: "American Dollars in Bangkok"
 COLDWAR_SVN_idea_american_dollars_in_bangkok_desc: "American money has flowed through Bangkok for years, and the government in Thailand sees no reason to stop it. The bases bring dollars, and the dollars bring influence."
 COLDWAR_SVN_idea_the_kiwi_detachment: "The Kiwi Detachment"
 COLDWAR_SVN_idea_the_kiwi_detachment_desc: "A small New Zealand detachment serves with our forces. The numbers are small and the welcome is large."
 COLDWAR_SVN_idea_wellington_keeps_faith: "Wellington Keeps Faith"
 COLDWAR_SVN_idea_wellington_keeps_faith_desc: "Wellington has chosen to keep its troops in the field. The government is proud of its small contribution to a long war."
 COLDWAR_SVN_idea_philippine_civic_action_teams: "Philippine Civic Action Teams"
 COLDWAR_SVN_idea_philippine_civic_action_teams_desc: "Filipino engineers, doctors and teachers work in the villages. Their teams build wells, schools and clinics, and they go home with friends."
 COLDWAR_SVN_idea_manila_stands_with_saigon: "Manila Stands With Saigon"
 COLDWAR_SVN_idea_manila_stands_with_saigon_desc: "Manila has made our cause its own in the councils of Asia. The Philippine press follows every turn in the war."
 COLDWAR_SVN_idea_the_political_warfare_cadre: "The Political Warfare Cadre"
 COLDWAR_SVN_idea_the_political_warfare_cadre_desc: "Officers from Taipei teach their methods of political work in the ranks. The cadre system has started to appear in our own army."
 COLDWAR_SVN_idea_saigon_keeps_taipei_company: "Saigon Keeps Taipei Company"
 COLDWAR_SVN_idea_saigon_keeps_taipei_company_desc: "The two capitals keep each other company at conferences and on committees. Taipei values every friend it can find."
 COLDWAR_SVN_idea_da_nhim_second_stage: "Da Nhim Second Stage"
 COLDWAR_SVN_idea_da_nhim_second_stage_desc: "Japanese engineers are building the second stage of the Da Nhim power plant. When the turbines run, the southern grid will be much stronger."
 COLDWAR_SVN_idea_reparations_contractors: "Reparations Contractors"
 COLDWAR_SVN_idea_reparations_contractors_desc: "Japanese firms build under the reparations agreement and are paid from it. The work is useful to Saigon and profitable to Tokyo."
 COLDWAR_SVN_idea_yen_credit_lines: "Yen Credit Lines"
 COLDWAR_SVN_idea_yen_credit_lines_desc: "Japanese banks have opened credit lines in yen for Saigon. The money is cheap and the strings are few."
 COLDWAR_SVN_idea_tokyo_lends_abroad: "Tokyo Lends Abroad"
 COLDWAR_SVN_idea_tokyo_lends_abroad_desc: "Japanese banks have found a new borrower in Southeast Asia. The loans are safe, and the government is happy to see yen working abroad."
 COLDWAR_SVN_idea_the_plantation_charter: "The Plantation Charter"
 COLDWAR_SVN_idea_the_plantation_charter_desc: "The charter settles the future of the French rubber estates. Plantation managers keep their jobs, and the state keeps a share of the latex."
 COLDWAR_SVN_idea_rubber_and_cultural_interests: "Rubber and Cultural Interests"
 COLDWAR_SVN_idea_rubber_and_cultural_interests_desc: "France keeps its rubber, its schools and its language in the south. The estates pay for the lycees, and the lycees train the estates' clerks."
 COLDWAR_SVN_idea_german_medical_and_technical_aid: "German Medical and Technical Aid"
 COLDWAR_SVN_idea_german_medical_and_technical_aid_desc: "West German doctors and technicians staff hospitals and workshops in the south. A hospital ship is anchored off the coast, and the lines for treatment are long."
 COLDWAR_SVN_idea_bonn_builds_goodwill: "Bonn Builds Goodwill"
 COLDWAR_SVN_idea_bonn_builds_goodwill_desc: "West German aid has made Bonn a popular name in Saigon. The Federal Republic gets goodwill, and it did not have to send a soldier."
 COLDWAR_SVN_idea_the_cho_ray_wing: "The Cho Ray Wing"
 COLDWAR_SVN_idea_the_cho_ray_wing_desc: "A new wing of the Cho Ray hospital is open, paid for by Japanese grants. Surgeons from both countries work in its theatres."
 COLDWAR_SVN_idea_a_hospital_with_our_name: "A Hospital With Our Name"
 COLDWAR_SVN_idea_a_hospital_with_our_name_desc: "A Japanese hospital in Saigon bears a Japanese name over its door. The staff are Vietnamese, and the building is a gift."
 COLDWAR_SVN_idea_iranian_crude_on_credit: "Iranian Crude on Credit"
 COLDWAR_SVN_idea_iranian_crude_on_credit_desc: "Tankers from the Gulf deliver Iranian crude on credit terms. The refineries run, and the repayment can wait."
 COLDWAR_SVN_idea_a_friend_in_southeast_asia: "A Friend in Southeast Asia"
 COLDWAR_SVN_idea_a_friend_in_southeast_asia_desc: "Tehran has found a friend in Southeast Asia and intends to keep him. The Shah likes allies who buy oil."
 COLDWAR_SVN_idea_the_gulf_loan_facility: "The Gulf Loan Facility"
 COLDWAR_SVN_idea_the_gulf_loan_facility_desc: "A loan facility from the Gulf funds ports, roads and grain imports. The terms are generous, and the lender sets the interest."
 COLDWAR_SVN_idea_riyadh_extends_credit: "Riyadh Extends Credit"
 COLDWAR_SVN_idea_riyadh_extends_credit_desc: "Riyadh extends oil money to Saigon on agreed terms. The kingdom likes the return, and the investment is safe."
 COLDWAR_SVN_idea_the_phnom_penh_understanding: "The Phnom Penh Understanding"
 COLDWAR_SVN_idea_the_phnom_penh_understanding_desc: "A quiet understanding with Phnom Penh keeps the border calm. Cambodian ministers and Vietnamese officers know each other's names."
 COLDWAR_SVN_idea_saigon_at_the_eastern_border: "Saigon at the Eastern Border"
 COLDWAR_SVN_idea_saigon_at_the_eastern_border_desc: "Saigon is now a neighbour to be consulted and not a menace to be feared. The frontier districts breathe more easily."
 COLDWAR_SVN_idea_the_aspac_staff_group: "The ASPAC Staff Group"
 COLDWAR_SVN_idea_the_aspac_staff_group_desc: "Officers from Asian and Pacific allies sit on a joint staff group. They share plans, liaison officers and a common view of the region."
 COLDWAR_SVN_idea_seoul_hosts_the_council: "Seoul Hosts the Council"
 COLDWAR_SVN_idea_seoul_hosts_the_council_desc: "The ASPAC council meets in Seoul, and the Koreans are proud hosts. The meeting gives the Park government a stage on the Asian scene."
 COLDWAR_SVN_idea_the_jakarta_consultations: "The Jakarta Consultations"
 COLDWAR_SVN_idea_the_jakarta_consultations_desc: "Delegates meet in Jakarta to talk about neutral ground for the whole region. Indonesia keeps the chair and lets nobody leave the room."
 COLDWAR_SVN_idea_a_quiet_partner_abroad: "A Quiet Partner Abroad"
 COLDWAR_SVN_idea_a_quiet_partner_abroad_desc: "Jakarta has found a quiet partner in Saigon. The Indonesian foreign ministry values a friend who asks for little."
 COLDWAR_SVN_idea_the_thompson_school_graduates: "The Thompson School Graduates"
 COLDWAR_SVN_idea_the_thompson_school_graduates_desc: "Graduates of the Malayan police school return with new methods of counter-insurgency. Sir Robert Thompson's lessons are taught in every provincial headquarters."
 COLDWAR_SVN_idea_instructors_abroad: "Instructors Abroad"
 COLDWAR_SVN_idea_instructors_abroad_desc: "Malaysian instructors are teaching Vietnamese officers at home and abroad. Kuala Lumpur is proud of what it learned in its own emergency."
 COLDWAR_SVN_idea_the_returnee_settlement_scheme: "The Returnee Settlement Scheme"
 COLDWAR_SVN_idea_the_returnee_settlement_scheme_desc: "Vietnamese families who fled Cambodia are settled on new land in the delta. The scheme gives them a field, a hut and a ration for the first year."
 COLDWAR_SVN_idea_ethnic_tension_eased: "Ethnic Tension Eased"
 COLDWAR_SVN_idea_ethnic_tension_eased_desc: "The agreement on returnees has taken the heat out of the quarrel between the two peoples. Border villages trade again."
 COLDWAR_SVN_idea_highway_nine_understanding: "Highway Nine Understanding"
 COLDWAR_SVN_idea_highway_nine_understanding_desc: "Laos and Saigon have agreed how Highway 9 is to be used and by whom. Convoys cross the border without incident, and local chiefs are content."
 COLDWAR_SVN_idea_souvanna_phouma_buys_time: "Souvanna Phouma Buys Time"
 COLDWAR_SVN_idea_souvanna_phouma_buys_time_desc: "The prince keeps his country neutral by being agreeable to everybody. Each year in which Laos is not invaded is a year he has bought."
 COLDWAR_SVN_idea_singapore_port_and_finance_link: "Singapore Port and Finance Link"
 COLDWAR_SVN_idea_singapore_port_and_finance_link_desc: "Singapore's port and banks now handle much of our trade and credit. A shipment that took weeks now takes days."
 COLDWAR_SVN_idea_entrepot_dividends: "Entrepot Dividends"
 COLDWAR_SVN_idea_entrepot_dividends_desc: "Singapore's merchants earn from every cargo that passes through the free port. Lee Kuan Yew knows the value of a good customer."
 COLDWAR_SVN_idea_the_hong_kong_trade_channel: "The Hong Kong Trade Channel"
 COLDWAR_SVN_idea_the_hong_kong_trade_channel_desc: "Merchants in Hong Kong open a channel for trade with the south. Cargoes move on paper that asks no questions."
 COLDWAR_SVN_idea_quiet_cargoes_via_hong_kong: "Quiet Cargoes via Hong Kong"
 COLDWAR_SVN_idea_quiet_cargoes_via_hong_kong_desc: "Cargoes reach our ports by way of Hong Kong without any official notice. The colony takes a modest fee."
 COLDWAR_SVN_idea_the_moscow_recognition_track: "The Moscow Recognition Track"
 COLDWAR_SVN_idea_the_moscow_recognition_track_desc: "Moscow has opened a path to diplomatic recognition for the south. The first steps are slow, and the last ones are formalities."
 COLDWAR_SVN_idea_a_neutral_capital_in_asia: "A Neutral Capital in Asia"
 COLDWAR_SVN_idea_a_neutral_capital_in_asia_desc: "The Soviet Union now has a neutral capital in Asia that will receive its diplomats. It is a modest gain, and Moscow is pleased to have it."
 COLDWAR_SVN_idea_the_prisoner_exchange_commission: "The Prisoner Exchange Commission"
 COLDWAR_SVN_idea_the_prisoner_exchange_commission_desc: "A joint commission arranges the exchange of prisoners under the eyes of neutral observers. Lists are read out in both capitals."
 COLDWAR_SVN_idea_our_men_come_home: "Our Men Come Home"
 COLDWAR_SVN_idea_our_men_come_home_desc: "Prisoners are coming home at last. Their families wait at the border post, and the newspapers print every name."
 COLDWAR_SVN_idea_the_demarcation_line_market: "The Demarcation Line Market"
 COLDWAR_SVN_idea_the_demarcation_line_market_desc: "A market opens at the demarcation line, and traders from both sides are allowed to cross. The soldiers on each side watch the stalls."
 COLDWAR_SVN_idea_the_northern_market_day: "The Northern Market Day"
 COLDWAR_SVN_idea_the_northern_market_day_desc: "Northern traders cross the line one day in the week to sell and buy. The goods are modest, and the contact is worth more than the profit."
 COLDWAR_SVN_idea_the_coexistence_treaty: "The Coexistence Treaty"
 COLDWAR_SVN_idea_the_coexistence_treaty_desc: "Each government has recognised the other in a treaty. Two states have agreed to live side by side without ending the argument."
 COLDWAR_SVN_idea_two_states_one_nation: "Two States, One Nation"
 COLDWAR_SVN_idea_two_states_one_nation_desc: "We have recognised the south as a state and we still hold that we are one nation. The formula pleases nobody and offends nobody."
