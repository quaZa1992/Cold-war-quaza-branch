 USA_1985_ssr_pressure_category: "1985 Soviet Republic Pressure"
 USA_1985_ssr_pressure_category_desc: "Use broadcasts, diaspora networks, human-rights language and quiet civic channels to increase pressure on Soviet republics without direct war."
 USA_1985_fund_baltic_civic_networks: "Fund Baltic Civic Networks"
 USA_1985_fund_baltic_civic_networks_desc: "Support cultural and civic channels in Estonia, Latvia and Lithuania."
 USA_1985_expand_radio_liberty_to_ukraine: "Expand Radio Liberty to Ukraine"
 USA_1985_expand_radio_liberty_to_ukraine_desc: "Increase Ukrainian-language and Moldavian-route information pressure."
 USA_1985_support_caucasus_human_rights: "Support Caucasus Human Rights"
 USA_1985_support_caucasus_human_rights_desc: "Turn local grievances in Armenia, Azerbaijan and Georgia into a diplomatic pressure point."
 USA_1985_central_asia_information_channels: "Central Asian Information Channels"
 USA_1985_central_asia_information_channels_desc: "Quietly widen non-Soviet information access across Central Asia."
 GER_1985_ddr_pressure_category: "1985 Pressure on the DDR"
 GER_1985_ddr_pressure_category_desc: "Bonn can pressure East Berlin through media, church networks, exit channels and credit conditions. These tools are slow, political and dangerous."
 GER_1985_support_church_networks: "Support Church Networks"
 GER_1985_offer_exit_channels: "Offer Exit Channels"
 GER_1985_offer_exit_channels_desc: "Raise the cost of the border by giving would-be emigrants more routes and hope."
 GER_1985_condition_billion_mark_credit: "Condition the Billion-Mark Credit"
 GER_1985_condition_billion_mark_credit_desc: "Tie liquidity to travel and reform concessions instead of stabilizing the regime for free."
