# IMPERIA CW — Cold War: Imperia Berlin Wall original labels — English localisation.
 landmark_berlin_wall: "Berlin Wall"
 landmark_berlin_wall_plural: "$landmark_berlin_wall$"
 landmark_berlin_wall_desc: "Officially the 'Anti-Fascist Protection Rampart', the Berlin Wall has cut through the city since the night of 13 August 1961. Along the sector border with West Berlin runs a layered border strip, all of it on East German soil: the front wall with its round concrete crown, a vehicle ditch, the raked control strip with steel tank traps, the patrol road and its line of floodlights, watchtowers, the signal fence and finally the hinterland wall. Built to stop the flight of East Germans to the West, it has become the most visible symbol of the Iron Curtain and of a divided Germany.\n\n§YLandmark Berlin Wall§! stands in East Berlin. For the German Democratic Republic, the Wall carries a stability penalty while strengthening counter-intelligence and reducing the efficiency of foreign subversive activities."