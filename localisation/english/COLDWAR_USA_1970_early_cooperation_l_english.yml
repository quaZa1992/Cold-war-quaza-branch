 COLDWAR_USA_early_allied_readiness_usa:0 "Allied Readiness Coordination"
 COLDWAR_USA_early_allied_readiness_usa_desc:0 "Washington offers an allied-readiness programme to countries holding recognised NATO membership or major non-NATO ally status. Each government decides independently. American coordination remains one national institution, with additional weekly funding for every participating partner. The coordination programme remains a single institution regardless of the number of partners."
 COLDWAR_USA_early_allied_readiness_partner:0 "American Readiness Partnership"
 COLDWAR_USA_early_allied_readiness_partner_desc:0 "Common training and support arrangements improve readiness while increasing personnel commitments. The partnership remains active while both countries retain the required alliance status and unrestricted bilateral relations."
 COLDWAR_USA_early_alliance_title:0 "Allied Readiness Programme"
 COLDWAR_USA_early_alliance_desc:0 "Washington offers an allied-readiness programme to countries holding recognised NATO membership or major non-NATO ally status. Each government decides independently. American coordination remains one national institution, with additional weekly funding for every participating partner. Washington funds a separate weekly contribution for each ratified partnership. The proposal remains open for 90 days."
 COLDWAR_USA_early_alliance_accept:0 "Ratify the Allied Readiness Programme"
 COLDWAR_USA_early_alliance_accept_desc:0 "Washington offers an allied-readiness programme to countries holding recognised NATO membership or major non-NATO ally status. Each government decides independently. American coordination remains one national institution, with additional weekly funding for every participating partner."
 COLDWAR_USA_early_alliance_decline:0 "Decline the Allied Readiness Programme"
 COLDWAR_USA_early_alliance_decline_desc:0 "The government will pursue its own readiness priorities. Neither country receives the proposed programme."
 COLDWAR_USA_early_alliance_reopen:0 "Reopen Allied Readiness Talks"
 COLDWAR_USA_early_alliance_reopen_desc:0 "The government can reconsider the same American proposal after the consultation interval."
 COLDWAR_USA_early_alliance_end:0 "End the American Readiness Partnership"
 COLDWAR_USA_early_alliance_end_desc:0 "Terminate the bilateral readiness arrangement and its future financial commitments."
 COLDWAR_USA_early_alliance_end_partner:0 "End Readiness Cooperation with [From.GetNameDef]"
 COLDWAR_USA_early_alliance_end_partner_desc:0 "Terminate the selected bilateral readiness arrangement. Other accepted partnerships continue."
