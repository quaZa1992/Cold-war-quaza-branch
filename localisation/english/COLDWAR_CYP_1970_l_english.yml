 COLDWAR_CYP_1970_party_1:0 "£generic_conservatism_small Presidential Coalition — Makarios"
 COLDWAR_CYP_1970_party_1_v3_desc:0 "The Democratic Party represents the presidential centre under Spyros Kyprianou, seeking continuity, international support and a settlement of the Cyprus dispute."
 COLDWAR_CYP_1970_party_1_v2_desc:0 "The Democratic Alignment adopted the Democratic Party name on 4 December 1976. Makarios remains the independent president while Spyros Kyprianou leads DIKO."
 COLDWAR_CYP_1970_party_1_v1_desc:0 "Spyros Kyprianou announced the Democratic Alignment on 12 May 1976 to support Makarios. The presidency and the new parliamentary organization remain distinct offices."
 COLDWAR_CYP_1970_party_1_desc:0 "An independent presidency backed by changing parliamentary allies, united around Makarios and the defence of the republic."
