 COLDWAR_CYP_1970_p2_project_a1_desc:0 "Modern commercial and shipping law can give businesses a clearer basis for operating across borders. Consistent procedures will help Cypriot firms offer services customers can trust."
 COLDWAR_CYP_1970_p2_project_a1_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nOffice park income tax: +3%."
 COLDWAR_CYP_1970_p2_project_a2:0 "Cypriot Accounting and Insurance"
 COLDWAR_CYP_1970_p2_project_a2_desc:0 "Accounting and insurance require professional expertise and confidence in enforcement. Developing those services can deepen the island's commercial economy without assuming that financial reputation can be created by decree."
 COLDWAR_CYP_1970_p2_project_a2_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nOffice park income tax: +3%."
 COLDWAR_CYP_1970_p2_project_b1:0 "Export-Oriented Workshops"
 COLDWAR_CYP_1970_p2_project_b1_desc:0 "Export-oriented workshops need skills, suitable equipment and access to buyers. Targeted support will help small producers meet outside demand rather than rely entirely on a protected domestic market."
 COLDWAR_CYP_1970_p2_project_b1_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nIndustrial capacityy: +6%."
 COLDWAR_CYP_1970_p2_project_b2:0 "Competitive Industrial Supply Contracts"
 COLDWAR_CYP_1970_p2_project_b2_desc:0 "Competitive industrial supply contracts can give capable firms an opening beyond established patronage. Transparent terms will improve the use of investment while allowing new suppliers to prove their worth."
 COLDWAR_CYP_1970_p2_project_b2_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProductiony max efficiency: +5%."
 COLDWAR_CYP_1970_p2_finance_review:0 "The Rules of Commercial Finance"
 COLDWAR_CYP_1970_p2_finance_review_desc:0 "Commercial finance needs rules that protect confidence without closing access to newcomers. Reviewing them will establish how the development programme balances foreign resources and domestic lending capacity."
