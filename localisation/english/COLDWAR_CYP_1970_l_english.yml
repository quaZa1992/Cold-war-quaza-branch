 COLDWAR_CYP_1970_p2_finance_b_follow_desc:0 "Loans for local enterprises should reach productive businesses unable to obtain suitable commercial credit. Sound assessment can widen opportunity without turning the development bank into a source of permanent rescue."
 COLDWAR_CYP_1970_p2_finance_b_follow_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed buildings: +4%."
 COLDWAR_CYP_1970_p2_social_investment:0 "Train a Skilled Commercial Workforce"
 COLDWAR_CYP_1970_p2_social_investment_desc:0 "A skilled commercial workforce needs training in administration, technical practice and professional standards. Broadening access will help local workers participate in the opportunities created by the government's market programme."
