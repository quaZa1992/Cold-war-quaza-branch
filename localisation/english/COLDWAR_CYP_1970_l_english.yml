 COLDWAR_CYP_1970_p3_follow_b:0 "Worker-Owned Local Enterprises"
 COLDWAR_CYP_1970_p3_follow_b_desc:0 "Worker-owned local enterprises can turn social participation into production and employment. Technical support and viable accounts will help them endure beyond the enthusiasm that first brings their members together."
 COLDWAR_CYP_1970_p3_follow_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nIndustrial capacityy: +4%."
 COLDWAR_CYP_1970_p3_institutions:0 "A Democratic Social Charter"
 COLDWAR_CYP_1970_p3_institutions_desc:0 "A democratic social charter must connect public commitments to institutions citizens can use. Defining rights and responsibilities will make reform more durable than a series of discretionary promises."
 COLDWAR_CYP_1970_p3_institutions_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nRaise the shared party-reform contribution to settlement progress to 5 points if it is lower. Elections do not repeat this credit."
 COLDWAR_CYP_1970_p3_second_a:0 "Non-Aligned Solidarity"
 COLDWAR_CYP_1970_p3_second_a_desc:0 "Non-aligned solidarity offers EDEK a channel for cooperation without submission to a great-power bloc. The government must seek practical relationships while preserving the independence at the centre of its programme."
 COLDWAR_CYP_1970_p3_second_a_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nForeign influence defense: +5%."
 COLDWAR_CYP_1970_p3_second_b:0 "A European Democratic Opening"
 COLDWAR_CYP_1970_p3_second_b_desc:0 "A European democratic opening can connect constitutional reform to wider political and commercial relationships. Its credibility depends on the rights and institutions the government is prepared to defend at home."
 COLDWAR_CYP_1970_p3_second_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nResearch speed: +2%."
 COLDWAR_CYP_1970_p3_settlement:0 "A Social Republic of Cyprus"
 COLDWAR_CYP_1970_p3_settlement_desc:0 "A social republic must give democratic participation a material foundation in public services and work. EDEK's settlement will be judged by whether reform remains accountable to the people it claims to serve."
 COLDWAR_CYP_1970_p3_settlement_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: +3%."
 COLDWAR_CYP_1970_p3_economic_mandate:0 "A Social Development Plan"
 COLDWAR_CYP_1970_p3_economic_mandate_desc:0 "The social development plan will direct resources towards productive employment and services accessible beyond the most prosperous districts. Its priorities must connect immediate needs to an economy able to sustain them."
 COLDWAR_CYP_1970_p3_economic_mandate_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p3_economic_a:0 "Public Works and Common Services"
 COLDWAR_CYP_1970_p3_economic_a_desc:0 "Public works and common services can improve daily life while supporting economic activity. The programme will favour shared infrastructure whose usefulness reaches beyond the contractors that build it."
 COLDWAR_CYP_1970_p3_economic_a_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed buildings: +7%.\nSocial cost multiplier: +4%."
 COLDWAR_CYP_1970_p3_economic_b:0 "A Worker-Cooperative Economy"
 COLDWAR_CYP_1970_p3_economic_b_desc:0 "A worker-cooperative economy gives labour a stronger role in ownership and management. Investment and training must make that responsibility practical if cooperative enterprises are to compete and provide dependable work."
 COLDWAR_CYP_1970_p3_economic_b_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nIndustrial capacityy: +7%."
 COLDWAR_CYP_1970_p3_project_a1:0 "Municipal Housing and Sanitation"
 COLDWAR_CYP_1970_p3_project_a1_desc:0 "Municipal housing and sanitation address conditions that private development often leaves behind. Their administration must give communities reliable services rather than a temporary construction campaign."
 COLDWAR_CYP_1970_p3_project_a1_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: +3%."
 COLDWAR_CYP_1970_p3_project_a2:0 "Rural Clinics and Local Transport"
 COLDWAR_CYP_1970_p3_project_a2_desc:0 "Rural clinics and local transport can connect isolated households to the republic's social commitments. Combining access and care will make investment more useful than facilities citizens cannot readily reach."
 COLDWAR_CYP_1970_p3_project_a2_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed infrastructure: +2%."
 COLDWAR_CYP_1970_p3_project_b1:0 "Cooperative Workshops"
 COLDWAR_CYP_1970_p3_project_b1_desc:0 "Cooperative workshops can bring existing skills into enterprises managed by their workers. Suitable equipment and common services will help small ventures establish a productive place in the island economy."
 COLDWAR_CYP_1970_p3_project_b1_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProductiony max efficiency: +5%."
 COLDWAR_CYP_1970_p3_project_b2:0 "Credit for Worker-Run Enterprises"
 COLDWAR_CYP_1970_p3_project_b2_desc:0 "Credit for worker-run enterprises must recognise collective ownership without abandoning sound assessment. Access to finance can support viable initiatives while protecting the resources on which further cooperatives depend."
 COLDWAR_CYP_1970_p3_project_b2_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nInterest rate multiplier: -0.15 interest points."
 COLDWAR_CYP_1970_p3_finance_review:0 "Paying for Social Development"
 COLDWAR_CYP_1970_p3_finance_review_desc:0 "Social development must have a financial basis that can survive the first budget. EDEK must decide how much to raise through a broad domestic commitment and how much to borrow against future returns."
 COLDWAR_CYP_1970_p3_finance_review_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p3_finance_a:0 "A Broad-Based Social Development Fund"
 COLDWAR_CYP_1970_p3_finance_a_desc:0 "A broad social development fund asks the domestic economy to contribute to shared investment. Transparent priorities can strengthen the connection between public contributions and improvements citizens can recognise."
 COLDWAR_CYP_1970_p3_finance_a_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nTax gain multiplier: +5%.\nPolitical power: -3%."
 COLDWAR_CYP_1970_p3_finance_b:0 "Borrow for the First Development Plan"
 COLDWAR_CYP_1970_p3_finance_b_desc:0 "Borrowing can bring the first development plan forward before domestic resources are sufficient. It also commits future budgets to repayment, making the selection of useful projects especially important."
 COLDWAR_CYP_1970_p3_finance_b_effect_tt:0 "Send a proposal to YUG. Conditional benefits require an explicit accepted response; silence provides no agreement.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nReceiving investment cost: -8%.\nForeign influence defense: -3%."
 COLDWAR_CYP_1970_p3_finance_a_follow:0 "Professional Public Procurement"
 COLDWAR_CYP_1970_p3_finance_a_follow_desc:0 "Professional procurement can make a social development fund more effective. Clear competition and competent supervision will reduce the opportunity for favoured contractors to capture resources intended for common services."
 COLDWAR_CYP_1970_p3_finance_a_follow_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nBureaucracy cost multiplier: -6%."
 COLDWAR_CYP_1970_p3_finance_b_follow:0 "Publish a Repayment and Spending Schedule"
 COLDWAR_CYP_1970_p3_finance_b_follow_desc:0 "A published spending and repayment schedule can give borrowers and citizens a clearer view of the plan. Fiscal responsibility will matter if credit is to support reform rather than displace later public services."
 COLDWAR_CYP_1970_p3_finance_b_follow_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nInterest rate multiplier: -0.15 interest points."
 COLDWAR_CYP_1970_p3_social_investment:0 "Technical Schools and Adult Training"
 COLDWAR_CYP_1970_p3_social_investment_desc:0 "Technical schools and adult training can give workers access to the skills development requires. Education will help the social programme create productive opportunity rather than rely on transfers alone."
 COLDWAR_CYP_1970_p3_social_investment_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nResearch speed: +3%.\nEducation cost multiplier: +5%."
 COLDWAR_CYP_1970_p3_national_programme:0 "A Productive Social Compact"
 COLDWAR_CYP_1970_p3_national_programme_desc:0 "A productive social compact must unite public services, worker participation and sustainable finance. Its institutions should give communities a continuing role after the first government has completed its programme."
 COLDWAR_CYP_1970_p3_national_programme_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed buildings: +4%.\nStability: +2%."
 COLDWAR_CYP_1970_p4_mandate:0 "An AKEL Government"
 COLDWAR_CYP_1970_p4_mandate_desc:0 "An AKEL government would bring the organised left into national executive authority. Its programme must settle how workers' representation, public ownership and the island's independence relate to the existing republic."
 COLDWAR_CYP_1970_p4_mandate_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p4_organisation:0 "The Organised Workers' Movement"
 COLDWAR_CYP_1970_p4_organisation_desc:0 "The organised workers' movement supplies experience and support beyond parliament. Linking it to government will require a balance between labour's independent voice and the cabinet's demand for consistent implementation."
 COLDWAR_CYP_1970_p4_organisation_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nPolitical power: +4%."
 COLDWAR_CYP_1970_p4_first_a:0 "A Parliamentary Left Coalition"
 COLDWAR_CYP_1970_p4_first_a_desc:0 "A parliamentary left coalition can give social transformation a broader constitutional mandate. Sharing power will require compromise with partners who do not accept every part of AKEL's economic programme."
 COLDWAR_CYP_1970_p4_first_a_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: +4%."
 COLDWAR_CYP_1970_p4_first_b:0 "A Single-Party Transformation"
 COLDWAR_CYP_1970_p4_first_b_desc:0 "Single-party transformation promises a more concentrated direction of policy. It would also narrow the institutions through which workers and allies can challenge decisions made in their name."
 COLDWAR_CYP_1970_p4_first_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: -4%.\nCommunal tension: +5 points (0–100).\nPolitical power: +7%.\nResearch speed: -1%."
 COLDWAR_CYP_1970_p4_follow_a:0 "Trade Unions within the Republic"
 COLDWAR_CYP_1970_p4_follow_a_desc:0 "Trade unions within the republic can defend labour without abandoning constitutional politics. Their role must remain meaningful when workers' immediate demands conflict with the governing coalition's priorities."
 COLDWAR_CYP_1970_p4_follow_a_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nIndustrial capacityy: +4%."
 COLDWAR_CYP_1970_p4_follow_b:0 "Centralise Party Administration"
 COLDWAR_CYP_1970_p4_follow_b_desc:0 "Centralising party administration offers a clearer mechanism for implementing national decisions. The leadership must recognise that efficiency through discipline can reduce the independent initiative on which local organisations rely."
 COLDWAR_CYP_1970_p4_follow_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nBureaucracy cost multiplier: -5%."
 COLDWAR_CYP_1970_p4_institutions:0 "Control of the Commanding Heights"
 COLDWAR_CYP_1970_p4_institutions_desc:0 "Control of major economic activities gives the left instruments for directing development. Public responsibility for those enterprises must include competent management and accounts, not ownership alone."
 COLDWAR_CYP_1970_p4_institutions_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p4_second_a:0 "An Independent Cypriot Left"
 COLDWAR_CYP_1970_p4_second_a_desc:0 "An independent Cypriot left will seek cooperation without allowing an external patron to define its programme. That position requires the government to defend autonomy even when political allies expect closer alignment."
 COLDWAR_CYP_1970_p4_second_a_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nForeign influence defense: +6%."
 COLDWAR_CYP_1970_p4_second_b:0 "A Soviet Economic Compact"
 COLDWAR_CYP_1970_p4_second_b_desc:0 "A Soviet economic compact could widen access to equipment and credit. Its terms must meet Cypriot productive needs while making clear the obligations the island is prepared to undertake."
 COLDWAR_CYP_1970_p4_second_b_effect_tt:0 "Send a proposal to SOV. Conditional benefits require an explicit accepted response; silence provides no agreement.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed industrial complex: +5%.\nForeign influence defense: -6%."
 COLDWAR_CYP_1970_p4_settlement:0 "A Workers' Republic on the Island"
 COLDWAR_CYP_1970_p4_settlement_desc:0 "A workers' republic needs institutions through which labour can exercise responsibility and contest mistakes. The settlement must connect social ownership to a viable economy rather than rely on declarations of political identity."
 COLDWAR_CYP_1970_p4_settlement_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: +3%."
 COLDWAR_CYP_1970_p4_economic_mandate:0 "A Workers' Development Programme"
 COLDWAR_CYP_1970_p4_economic_mandate_desc:0 "The workers' development programme will give productive investment a central place in the left's governing project. Its choices must connect public ambitions to the skills and scale of the island economy."
 COLDWAR_CYP_1970_p4_economic_mandate_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p4_economic_a:0 "A Public Light-Industry Plan"
 COLDWAR_CYP_1970_p4_economic_a_desc:0 "A public light-industry plan can build on food processing, repair and other attainable activities. Concentrated investment must be supported by management able to respond to actual supplies and demand."
 COLDWAR_CYP_1970_p4_economic_a_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed industrial complex: +6%.\nBureaucracy cost multiplier: +4%."
 COLDWAR_CYP_1970_p4_economic_b:0 "A Cooperative Mixed Economy"
 COLDWAR_CYP_1970_p4_economic_b_desc:0 "A cooperative mixed economy would combine collective enterprise with a wider range of local producers. It gives the government a less centralised route towards social ownership and productive development."
 COLDWAR_CYP_1970_p4_economic_b_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nIndustrial capacityy: +6%.\nStability: +2%."
 COLDWAR_CYP_1970_p4_project_a1:0 "Food Processing under Public Ownership"
 COLDWAR_CYP_1970_p4_project_a1_desc:0 "Public food-processing enterprises can give farmers a more dependable link to consumers. Their value depends on reliable inputs and competent operation rather than protection from scrutiny of their performance."
 COLDWAR_CYP_1970_p4_project_a1_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nIndustrial capacityy: +4%."
 COLDWAR_CYP_1970_p4_project_a2:0 "A Small Engineering and Repair Sector"
 COLDWAR_CYP_1970_p4_project_a2_desc:0 "Engineering and repair services can reduce losses from equipment that cannot be maintained locally. A modest sector built around real demand offers a practical foundation for wider industrial skills."
 COLDWAR_CYP_1970_p4_project_a2_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProductiony max efficiency: +6%."
 COLDWAR_CYP_1970_p4_project_b1:0 "Worker-Managed Production Boards"
 COLDWAR_CYP_1970_p4_project_b1_desc:0 "Worker-managed production boards can bring shop-floor knowledge into enterprise decisions. Their responsibilities need clear accounts and technical support if participation is to improve output as well as representation."
 COLDWAR_CYP_1970_p4_project_b1_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProductiony max efficiency: +5%."
 COLDWAR_CYP_1970_p4_project_b2:0 "Agricultural Producer Cooperatives"
 COLDWAR_CYP_1970_p4_project_b2_desc:0 "Agricultural producer cooperatives can strengthen small farmers' position in supply and marketing. Shared services and accountable management will determine whether collective organisation improves rural livelihoods."
 COLDWAR_CYP_1970_p4_project_b2_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nOne 25% research bonus in the relevant existing technology category."
 COLDWAR_CYP_1970_p4_finance_review:0 "Finance the Productive Economy"
 COLDWAR_CYP_1970_p4_finance_review_desc:0 "Finance must serve the productive economy rather than reward proximity to the party. Reviewing its terms will help the cabinet decide how external equipment agreements and domestic resources should support the development plan."
 COLDWAR_CYP_1970_p4_finance_review_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p4_finance_a:0 "Eastern Equipment and Credit Agreements"
 COLDWAR_CYP_1970_p4_finance_a_desc:0 "Eastern equipment and credit agreements offer access to productive resources from political partners. Each arrangement must specify what the island receives and what its enterprises and treasury are expected to provide."
 COLDWAR_CYP_1970_p4_finance_a_effect_tt:0 "Send a proposal to SOV. Conditional benefits require an explicit accepted response; silence provides no agreement.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nReceiving investment cost: -10%.\nForeign influence defense: -5%."
 COLDWAR_CYP_1970_p4_finance_b:0 "An Island-Funded Development Budget"
 COLDWAR_CYP_1970_p4_finance_b_desc:0 "An island-funded development budget would rely more heavily on domestic resources. It can preserve autonomy while forcing the government to make a clearer choice between immediate consumption and investment."
 COLDWAR_CYP_1970_p4_finance_b_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nForeign influence defense: +5%.\nPolitical power: -3%."
 COLDWAR_CYP_1970_p4_finance_a_follow:0 "A Transparent Equipment Procurement Office"
 COLDWAR_CYP_1970_p4_finance_a_follow_desc:0 "A transparent equipment procurement office can compare promises with delivered support and usable systems. Professional administration will help prevent an external relationship from becoming an excuse for unsuitable purchases."
 COLDWAR_CYP_1970_p4_finance_a_follow_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed industrial complex: +2%."
 COLDWAR_CYP_1970_p4_finance_b_follow:0 "Reinvest Public Enterprise Surpluses"
 COLDWAR_CYP_1970_p4_finance_b_follow_desc:0 "Public enterprise surpluses can help finance further development when they are honestly accounted for. Reinvestment must not conceal losses or strip enterprises of the maintenance resources needed to keep producing."
 COLDWAR_CYP_1970_p4_finance_b_follow_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed buildings: +4%."
 COLDWAR_CYP_1970_p4_social_investment:0 "Workers' Technical Education"
 COLDWAR_CYP_1970_p4_social_investment_desc:0 "Workers' technical education gives social ownership a stronger foundation in practical competence. Broad access to training can improve both production and the capacity of workers to take responsibility for enterprise decisions."
 COLDWAR_CYP_1970_p4_social_investment_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nResearch speed: +3%.\nEducation cost multiplier: +4%."
 COLDWAR_CYP_1970_p4_national_programme:0 "Labour and Production on Cypriot Terms"
 COLDWAR_CYP_1970_p4_national_programme_desc:0 "Labour and production on Cypriot terms will connect public responsibility to local productive needs. AKEL's completed programme must preserve the island's political autonomy while making its economic institutions capable of enduring."
 COLDWAR_CYP_1970_p4_national_programme_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nIndustrial capacityy: +5%."
 COLDWAR_CYP_1970_p20_mandate:0 "A National Popular Mandate"
 COLDWAR_CYP_1970_p20_mandate_desc:0 "A national popular mandate gives the Progressive Front a platform for its view of Cyprus's future. The government must decide whether to seek agreement through constitutional politics or rely on confrontational mobilisation."
 COLDWAR_CYP_1970_p20_mandate_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p20_organisation:0 "Mobilise the Progressive Front"
 COLDWAR_CYP_1970_p20_organisation_desc:0 "The Progressive Front needs an organisation able to bring supporters into a coherent political programme. Mobilisation can strengthen its bargaining position while making it responsible for expectations that nationalist rhetoric has raised."
 COLDWAR_CYP_1970_p20_organisation_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nPolitical power: +4%."
 COLDWAR_CYP_1970_p20_first_a:0 "Pursue Enosis through Negotiation"
 COLDWAR_CYP_1970_p20_first_a_desc:0 "Pursuing enosis through negotiation accepts that the island's future cannot be settled by one faction alone. The government must seek terms that address communal rights and the interests of the states concerned."
 COLDWAR_CYP_1970_p20_first_a_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p20_first_b:0 "Build a Confrontational Mass Campaign"
 COLDWAR_CYP_1970_p20_first_b_desc:0 "A confrontational mass campaign seeks leverage through public pressure. Its organisers risk making compromise appear like betrayal before negotiations have established what others are willing to accept."
 COLDWAR_CYP_1970_p20_first_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nCommunal tension: +10 points (0–100).\nWar support: +6%.\nForeign influence defense: -4%."
 COLDWAR_CYP_1970_p20_follow_a:0 "Submit Terms to a Conference"
 COLDWAR_CYP_1970_p20_follow_a_desc:0 "A conference proposal can turn the demand for union into terms counterparts can examine. The leadership must define obligations and safeguards instead of assuming that agreement on a slogan resolves the settlement."
 COLDWAR_CYP_1970_p20_follow_a_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nRaise the shared party-reform contribution to settlement progress to 5 points if it is lower. Elections do not repeat this credit."
 COLDWAR_CYP_1970_p20_follow_b:0 "Mobilise the Street Organisations"
 COLDWAR_CYP_1970_p20_follow_b_desc:0 "Street organisations can demonstrate support outside parliament and sustain political pressure. Their mobilisation also narrows the space for dissent and can make public order dependent on the movement's own discipline."
 COLDWAR_CYP_1970_p20_follow_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nPolitical power: +3%.\nPolice cost multiplier: +6%."
 COLDWAR_CYP_1970_p20_institutions:0 "A National Programme before Parliament"
 COLDWAR_CYP_1970_p20_institutions_desc:0 "A national programme before parliament gives elected representatives a chance to judge the movement's claims. Public debate can expose the choices and obligations concealed by declarations of unity."
 COLDWAR_CYP_1970_p20_institutions_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p20_second_a:0 "Accept a Protected Independent Republic"
 COLDWAR_CYP_1970_p20_second_a_desc:0 "Accepting a protected independent republic would recognise a settlement short of union. Its supporters must defend guarantees and national interests through institutions capable of commanding consent on the island itself."
 COLDWAR_CYP_1970_p20_second_a_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: +4%."
 COLDWAR_CYP_1970_p20_second_b:0 "Continue the Enosis Campaign"
 COLDWAR_CYP_1970_p20_second_b_desc:0 "Continuing the enosis campaign keeps union at the centre of national policy. The movement must bear the diplomatic and communal costs of refusing to treat a protected independent settlement as sufficient."
 COLDWAR_CYP_1970_p20_second_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nCommunal tension: +5 points (0–100)."
 COLDWAR_CYP_1970_p20_settlement:0 "A National Mandate Put to the Test"
 COLDWAR_CYP_1970_p20_settlement_desc:0 "The national mandate must eventually be tested against an accepted political outcome. The government cannot indefinitely replace a settlement with the mobilisation that was meant to secure it."
 COLDWAR_CYP_1970_p20_settlement_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nPolitical power: +3%."
 COLDWAR_CYP_1970_p20_economic_mandate:0 "A National Enterprise Programme"
 COLDWAR_CYP_1970_p20_economic_mandate_desc:0 "A national enterprise programme will link political ambition to livelihoods and productive capacity. The Front must decide whether local business or closer commercial integration with Greece offers the stronger foundation."
 COLDWAR_CYP_1970_p20_economic_mandate_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p20_economic_a:0 "Cypriot Small Enterprise First"
 COLDWAR_CYP_1970_p20_economic_a_desc:0 "Cypriot small enterprise can give national development a broader domestic base. Support should widen opportunity for capable producers rather than distribute contracts solely to the government's most loyal supporters."
 COLDWAR_CYP_1970_p20_economic_a_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed buildings: +6%."
 COLDWAR_CYP_1970_p20_economic_b:0 "An Economic Bridge to Greece"
 COLDWAR_CYP_1970_p20_economic_b_desc:0 "An economic bridge to Greece can create familiar commercial channels and supplier relationships. Its benefits depend on useful reciprocal arrangements rather than an assumption that cultural proximity removes business constraints."
 COLDWAR_CYP_1970_p20_economic_b_effect_tt:0 "Send a proposal to GRE. Conditional benefits require an explicit accepted response; silence provides no agreement.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nReceiving investment cost: -7%.\nForeign influence defense: -5%."
 COLDWAR_CYP_1970_p20_project_a1:0 "Local Building and Repair Firms"
 COLDWAR_CYP_1970_p20_project_a1_desc:0 "Building and repair firms can retain development work within the island's economy. Training and suitable contracts will help smaller domestic enterprises meet the standards demanded by public and private customers."
 COLDWAR_CYP_1970_p20_project_a1_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed industrial complex: +5%."
 COLDWAR_CYP_1970_p20_project_a2:0 "Support Rural Producer Associations"
 COLDWAR_CYP_1970_p20_project_a2_desc:0 "Rural producer associations can organise smaller farmers and processors around common needs. Their practical strength will come from market access and accountable services rather than ceremonial endorsement by the movement."
 COLDWAR_CYP_1970_p20_project_a2_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nOne 25% research bonus in the relevant existing technology category."
 COLDWAR_CYP_1970_p20_project_b1:0 "Harmonise Commercial Standards"
 COLDWAR_CYP_1970_p20_project_b1_desc:0 "Harmonised commercial standards can make exchange with Greek firms easier. Adopting compatible procedures must serve Cypriot producers and consumers rather than become a claim that political union has already occurred."
 COLDWAR_CYP_1970_p20_project_b1_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nOffice park income tax: +5%."
 COLDWAR_CYP_1970_p20_project_b2:0 "Seek Greek Supplier Agreements"
 COLDWAR_CYP_1970_p20_project_b2_desc:0 "Greek supplier agreements can give local firms access to inputs and technical relationships. The terms still require negotiation and reliable performance from both sides."
 COLDWAR_CYP_1970_p20_project_b2_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nIndustrial capacityy: +5%."
 COLDWAR_CYP_1970_p20_finance_review:0 "The Terms of National Development"
 COLDWAR_CYP_1970_p20_finance_review_desc:0 "National development can be financed through open competition or concessions binding business patrons to the government. That choice will shape the economy's independence from the political networks claiming to represent it."
 COLDWAR_CYP_1970_p20_finance_review_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p20_finance_a:0 "Transparent National Development Tenders"
 COLDWAR_CYP_1970_p20_finance_a_desc:0 "Transparent development tenders offer firms a common basis for competing for public work. Clear selection can strengthen productive capacity without making political allegiance a prerequisite for investment."
 COLDWAR_CYP_1970_p20_finance_a_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nBureaucracy cost multiplier: -5%."
 COLDWAR_CYP_1970_p20_finance_b:0 "Concessions to Loyal Commercial Patrons"
 COLDWAR_CYP_1970_p20_finance_b_desc:0 "Concessions to loyal commercial patrons can secure a dependable business base for the government. They also concentrate opportunity and make the public cost of political loyalty a continuing concern."
 COLDWAR_CYP_1970_p20_finance_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nPolitical power: +6%.\nBureaucracy cost multiplier: +6%."
 COLDWAR_CYP_1970_p20_finance_a_follow:0 "An Independent Contracts Inspectorate"
 COLDWAR_CYP_1970_p20_finance_a_follow_desc:0 "An independent contracts inspectorate can make tender rules effective after awards have been made. Its authority must reach influential firms if fair competition is to mean more than a formal procedure."
 COLDWAR_CYP_1970_p20_finance_a_follow_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed buildings: +3%."
 COLDWAR_CYP_1970_p20_finance_b_follow:0 "Consolidate the Government's Business Base"
 COLDWAR_CYP_1970_p20_finance_b_follow_desc:0 "Consolidating the government's business base turns concessions into a more durable political relationship. The leadership must account for the dependence and restricted competition created by that support."
 COLDWAR_CYP_1970_p20_finance_b_follow_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nOffice park income tax: +4%.\nStability: -2%."
 COLDWAR_CYP_1970_p20_social_investment:0 "Vocational Training for Local Enterprise"
 COLDWAR_CYP_1970_p20_social_investment_desc:0 "Vocational training can give local enterprise the skills needed to fulfil national development plans. Broad access will help opportunity reach workers outside the commercial circles closest to the government."
 COLDWAR_CYP_1970_p20_social_investment_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nResearch speed: +2%.\nEducation cost multiplier: +3%."
 COLDWAR_CYP_1970_p20_national_programme:0 "A National Enterprise Compact"
 COLDWAR_CYP_1970_p20_national_programme_desc:0 "A national enterprise compact must leave productive firms and a workable financial base. Its success will show whether nationalist mobilisation has created institutions capable of serving the island beyond the campaign."
 COLDWAR_CYP_1970_p20_national_programme_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed buildings: +1%."
 COLDWAR_CYP_1970_p22_mandate:0 "A Presidency Born of the Coup"
 COLDWAR_CYP_1970_p22_mandate_desc:0 "A presidency born of a coup must confront resistance and a disputed claim to authority. Its immediate choices will determine whether emergency command seeks a constitutional exit or attempts to become the permanent state."
 COLDWAR_CYP_1970_p22_mandate_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p22_organisation:0 "The Emergency Command Council"
 COLDWAR_CYP_1970_p22_organisation_desc:0 "The emergency command council will coordinate a government whose authority rests on armed support. Clear responsibilities can strengthen control while concentrating political decisions in a narrow circle."
 COLDWAR_CYP_1970_p22_organisation_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nPolitical power: +4%."
 COLDWAR_CYP_1970_p22_first_a:0 "Rely on Mainland Officers"
 COLDWAR_CYP_1970_p22_first_a_desc:0 "Reliance on mainland officers offers established links to military support. It also ties the emergency government more closely to an external command relationship that its opponents will contest."
 COLDWAR_CYP_1970_p22_first_a_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nArmy org: +5%.\nForeign influence defense: -8%."
 COLDWAR_CYP_1970_p22_first_b:0 "Appoint an Island-Based Command"
 COLDWAR_CYP_1970_p22_first_b_desc:0 "An island-based command seeks a more domestic foundation for emergency authority. Building it requires local officers and administrative support able to operate beyond personal allegiance to the coup's sponsors."
 COLDWAR_CYP_1970_p22_first_b_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nArmy org: +3%."
 COLDWAR_CYP_1970_p22_follow_a:0 "Coordinate with the Greek Junta"
 COLDWAR_CYP_1970_p22_follow_a_desc:0 "Coordination with the Greek junta can connect the emergency regime to a powerful patron. Its practical support comes with political expectations that Cyprus's new rulers may find difficult to resist."
 COLDWAR_CYP_1970_p22_follow_a_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nPlanning speed: +8%."
 COLDWAR_CYP_1970_p22_follow_b:0 "Consolidate a Domestic Officer Corps"
 COLDWAR_CYP_1970_p22_follow_b_desc:0 "A domestic officer corps can reduce immediate dependence on mainland appointments. Its formation must establish competence and a coherent command if it is to provide more than a different network of loyalists."
 COLDWAR_CYP_1970_p22_follow_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nForeign influence defense: +4%."
 COLDWAR_CYP_1970_p22_institutions:0 "The Coup Government's Claim to Rule"
 COLDWAR_CYP_1970_p22_institutions_desc:0 "The coup government must explain how its emergency authority relates to a future political order. Institutions designed only to preserve its leaders will deepen the dispute over legitimacy."
 COLDWAR_CYP_1970_p22_institutions_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: -5%.\nCommunal tension: +15 points (0–100)."
 COLDWAR_CYP_1970_p22_second_a:0 "Restore Constitutional Government"
 COLDWAR_CYP_1970_p22_second_a_desc:0 "Restoring constitutional government offers an exit from emergency rule. The transition must establish civilian authority and an accepted presidency rather than leave the coup's armed networks free to veto its outcome."
 COLDWAR_CYP_1970_p22_second_a_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: +4%.\nRestore constitutional authority under acting president Glafkos Clerides."
 COLDWAR_CYP_1970_p22_second_b:0 "Entrench the Emergency Regime"
 COLDWAR_CYP_1970_p22_second_b_desc:0 "Entrenching the emergency regime extends exceptional authority into the future. Its rulers will assume continuing responsibility for the coercion and isolation on which that choice depends."
 COLDWAR_CYP_1970_p22_second_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nPolitical power: +4%.\nPolice cost multiplier: +12%."
 COLDWAR_CYP_1970_p22_settlement:0 "The Future of the Coup Presidency"
 COLDWAR_CYP_1970_p22_settlement_desc:0 "The coup presidency cannot avoid deciding what should outlast the emergency. A constitutional return and a permanent security state carry fundamentally different obligations for the island's institutions."
 COLDWAR_CYP_1970_p22_settlement_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nDrift defence: +6%."
 COLDWAR_CYP_1970_p22_economic_mandate:0 "An Emergency Economic Directorate"
 COLDWAR_CYP_1970_p22_economic_mandate_desc:0 "An emergency economic directorate must keep essential activity functioning under severe political strain. Its priorities will determine whether scarce resources protect civilian supply or military readiness first."
 COLDWAR_CYP_1970_p22_economic_mandate_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p22_economic_a:0 "Secure Civilian Supply First"
 COLDWAR_CYP_1970_p22_economic_a_desc:0 "Civilian supply protects the households and workers on whom the emergency administration also depends. Giving it priority will limit the resources available for an expansion of military commitments."
 COLDWAR_CYP_1970_p22_economic_a_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: +3%.\nProduction speed buildings: +5%."
 COLDWAR_CYP_1970_p22_economic_b:0 "Prioritise Military Readiness"
 COLDWAR_CYP_1970_p22_economic_b_desc:0 "Prioritising readiness concentrates resources on forces expected to defend the regime. Civilian activity must absorb the resulting pressure on supplies, transport and public administration."
 COLDWAR_CYP_1970_p22_economic_b_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nArmy defence: +6%.\nArmy personnel cost multiplier: +8%.\nProduction speed buildings: -4%."
 COLDWAR_CYP_1970_p22_project_a1:0 "Food and Fuel Distribution Contracts"
 COLDWAR_CYP_1970_p22_project_a1_desc:0 "Food and fuel distribution contracts can preserve basic supply when normal commerce is disrupted. Competent supervision will be needed to prevent emergency access from becoming a source of private political profit."
 COLDWAR_CYP_1970_p22_project_a1_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nFuel gain: +6%."
 COLDWAR_CYP_1970_p22_project_a2:0 "Keep Essential Civil Works Running"
 COLDWAR_CYP_1970_p22_project_a2_desc:0 "Essential civil works must continue if public services and transport are to remain usable. A focused programme will preserve the facilities that an emergency government cannot replace with security orders."
 COLDWAR_CYP_1970_p22_project_a2_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed infrastructure: +6%."
 COLDWAR_CYP_1970_p22_project_b1:0 "Dispersed Arms Repair Workshops"
 COLDWAR_CYP_1970_p22_project_b1_desc:0 "Dispersed arms repair workshops can improve the support available to existing forces. Their operation requires suitable tools and technicians, not merely the designation of additional military sites."
 COLDWAR_CYP_1970_p22_project_b1_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nIndustrial capacityy: +8%."
 COLDWAR_CYP_1970_p22_project_b2:0 "Pay and Train the Emergency Reserve"
 COLDWAR_CYP_1970_p22_project_b2_desc:0 "An emergency reserve needs pay and training as well as a call to mobilisation. Funding those responsibilities will make its readiness more credible while creating obligations that outlast the first assembly of personnel."
 COLDWAR_CYP_1970_p22_project_b2_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nArmy org: +3%."
 COLDWAR_CYP_1970_p22_finance_review:0 "Who Pays for the Emergency State?"
 COLDWAR_CYP_1970_p22_finance_review_desc:0 "The emergency state must identify who carries the cost of its commitments. A temporary domestic levy and mainland credit offer different ways of financing the government and different limits on its independence."
 COLDWAR_CYP_1970_p22_finance_review_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p22_finance_a:0 "A Temporary Reconstruction Levy"
 COLDWAR_CYP_1970_p22_finance_a_desc:0 "A temporary reconstruction levy asks the domestic economy to fund urgent recovery. Its credibility depends on a clear purpose and a limit that prevents emergency collection from becoming permanent by neglect."
 COLDWAR_CYP_1970_p22_finance_a_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nTax gain multiplier: +5%.\nStability: -2%."
 COLDWAR_CYP_1970_p22_finance_b:0 "Seek Mainland Emergency Credit"
 COLDWAR_CYP_1970_p22_finance_b_desc:0 "Mainland emergency credit may supply resources the island cannot raise quickly. The regime must decide which conditions it is prepared to accept in exchange for continued support."
 COLDWAR_CYP_1970_p22_finance_b_effect_tt:0 "Send a proposal to GRE. Conditional benefits require an explicit accepted response; silence provides no agreement.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nReceiving investment cost: -10%.\nForeign influence defense: -8%."
 COLDWAR_CYP_1970_p22_finance_a_follow:0 "Publish an Emergency Budget and Sunset Date"
 COLDWAR_CYP_1970_p22_finance_a_follow_desc:0 "An emergency budget and sunset date make exceptional revenue easier to scrutinise. Publishing them will create a standard against which citizens can judge whether the government keeps its promise to limit emergency burdens."
 COLDWAR_CYP_1970_p22_finance_a_follow_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nBureaucracy cost multiplier: -5%."
 COLDWAR_CYP_1970_p22_finance_b_follow:0 "Accept the Conditions of Mainland Credit"
 COLDWAR_CYP_1970_p22_finance_b_follow_desc:0 "Accepting mainland credit means assuming the obligations attached to it. The government must incorporate those terms into its actual budget rather than present foreign finance as support without a cost."
 COLDWAR_CYP_1970_p22_finance_b_follow_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nPolitical power: +3%."
 COLDWAR_CYP_1970_p22_social_investment:0 "Repair Transport and Medical Supply Networks"
 COLDWAR_CYP_1970_p22_social_investment_desc:0 "Transport and medical supply networks sustain both civilian life and emergency operations. Repairing them can address practical losses that political mobilisation cannot overcome."
 COLDWAR_CYP_1970_p22_social_investment_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nArmy org: +2%.\nSocial cost multiplier: +3%."
 COLDWAR_CYP_1970_p22_national_programme:0 "From Emergency Rule to a Sustainable State"
 COLDWAR_CYP_1970_p22_national_programme_desc:0 "A sustainable state requires more than the command arrangements of an emergency. The regime's economic programme must leave services and finances capable of supporting whichever political settlement follows."
 COLDWAR_CYP_1970_p22_national_programme_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nArmy defence: +3%."
 COLDWAR_CYP_1970_tc_community:0 "A Community in Enclaves"
 COLDWAR_CYP_1970_tc_community_desc:0 "Turkish Cypriot communities face a legacy of displacement, separate administration and restricted economic contact. A durable settlement must improve ordinary civilian life while giving communal representatives a credible role in negotiations."
 COLDWAR_CYP_1970_tc_community_effect_tt:0 "Implement this policy and unlock the following programme."
 COLDWAR_CYP_1970_tc_leadership:0 "Recognise the Communal Interlocutors"
 COLDWAR_CYP_1970_tc_leadership_desc:0 "Negotiations need interlocutors able to speak to the concerns of their community. Recognising that role will make disagreement more visible, but gives agreements a stronger foundation than unilateral decisions from Nicosia."
 COLDWAR_CYP_1970_tc_leadership_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes."
 COLDWAR_CYP_1970_tc_kucuk:0 "A Channel to Fazil Kucuk"
 COLDWAR_CYP_1970_tc_kucuk_desc:0 "A channel to Fazil Kucuk offers contact with established communal leadership. Dialogue must address concrete concerns over representation and security if it is to move beyond formal acknowledgements."
 COLDWAR_CYP_1970_tc_kucuk_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome."
 COLDWAR_CYP_1970_tc_denktash:0 "Support the Clerides–Denktas Talks"
 COLDWAR_CYP_1970_tc_denktash_desc:0 "The Clerides-Denktash channel can bring constitutional questions into sustained discussion. Supporting it will require political patience and an acceptance that negotiation gives the counterpart a voice as well as an audience."
 COLDWAR_CYP_1970_tc_denktash_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome."
 COLDWAR_CYP_1970_tc_restrictions:0 "The Restrictions Question"
 COLDWAR_CYP_1970_tc_restrictions_desc:0 "Remaining controls connect everyday trade to the wider sovereignty dispute. The government must decide whether their political leverage justifies the administrative burden and distrust they continue to produce."
 COLDWAR_CYP_1970_tc_restrictions_effect_tt:0 "Political power: +25."
 COLDWAR_CYP_1970_tc_open_trade:0 "Remove Remaining Civilian Trade Controls"
 COLDWAR_CYP_1970_tc_open_trade_desc:0 "Removing remaining civilian trade controls can reopen connections between producers and customers. Reciprocal arrangements will give ordinary commerce greater security without requiring the final constitutional dispute to be settled first."
 COLDWAR_CYP_1970_tc_open_trade_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nCommunal tension: -10 points (0–100).\nAdvance reciprocal civilian access to stage 1; partially replace the initial movement and administration penalties."
 COLDWAR_CYP_1970_tc_pressure:0 "Renew Restrictions as Political Pressure"
 COLDWAR_CYP_1970_tc_pressure_desc:0 "Renewed restrictions would use civilian commerce as a source of political pressure. The policy can strengthen immediate leverage while weakening livelihoods and confidence in further cooperation."
 COLDWAR_CYP_1970_tc_pressure_effect_tt:0 "Political power: +40.\nCommunal tension: +10 points (0–100).\nPolice cost multiplier: +8%."
 COLDWAR_CYP_1970_tc_routes:0 "Protected Roads and Supply Routes"
 COLDWAR_CYP_1970_tc_routes_desc:0 "Protected roads and supply routes make civilian access more dependable than occasional permissions. Agreed procedures can reduce the uncertainty faced by families, businesses and the officials responsible for passage."
 COLDWAR_CYP_1970_tc_routes_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nCommunal tension: -5 points (0–100).\nAdvance reciprocal civilian access to stage 1; partially replace the initial movement and administration penalties."
 COLDWAR_CYP_1970_tc_utilities:0 "Restore Water and Medical Supplies"
 COLDWAR_CYP_1970_tc_utilities_desc:0 "Water and medical supplies are urgent needs shared by communities with separate administrations. Restoring reliable access can reduce the practical costs of division and give cooperation a visible humanitarian purpose."
 COLDWAR_CYP_1970_tc_utilities_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nAdvance shared services to stage 2, further reducing the initial movement and administration penalties."
 COLDWAR_CYP_1970_tc_police:0 "Maintain Emergency Police Posts"
 COLDWAR_CYP_1970_tc_police_desc:0 "Emergency police posts offer a continuing instrument of control over sensitive areas. Maintaining them will preserve security discretion while leaving movement and trade subject to more intrusive supervision."
 COLDWAR_CYP_1970_tc_police_effect_tt:0 "Political power: +25.\nCommunal tension: +5 points (0–100).\nPolice cost multiplier: +5%."
 COLDWAR_CYP_1970_tc_supervised:0 "Permit Supervised Civilian Deliveries"
 COLDWAR_CYP_1970_tc_supervised_desc:0 "Supervised deliveries can preserve civilian supply while responding to official security concerns. Clear procedures are essential if supervision is to become a dependable channel rather than another opportunity for arbitrary refusal."
 COLDWAR_CYP_1970_tc_supervised_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nCommunal tension: -4 points (0–100)."
 COLDWAR_CYP_1970_tc_protocol:0 "A Communal Services Protocol"
 COLDWAR_CYP_1970_tc_protocol_desc:0 "A communal services protocol can turn local understandings into predictable responsibilities. Its terms must be accepted by representatives who can carry them into the institutions providing daily services."
 COLDWAR_CYP_1970_tc_protocol_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes."
 COLDWAR_CYP_1970_tc_joint_budgets:0 "Joint Municipal Budgets"
 COLDWAR_CYP_1970_tc_joint_budgets_desc:0 "Joint municipal budgets give shared services a practical financial basis. Pooling responsibility can reduce duplication, but requires accounts and decisions that both communities are willing to trust."
 COLDWAR_CYP_1970_tc_joint_budgets_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nStability: +4%.\nBureaucracy cost multiplier: +3%.\nImplement a joint-services compact and stage 3 normalisation; remove the initial access and parallel-administration penalties. Civilian harm requires separate restitution."
 COLDWAR_CYP_1970_tc_local_services:0 "Locally Managed Communal Services"
 COLDWAR_CYP_1970_tc_local_services_desc:0 "Locally managed services may offer cooperation without requiring the immediate centralisation of communal administration. The arrangement must define responsibilities clearly enough to prevent autonomy from leaving gaps in essential provision."
 COLDWAR_CYP_1970_tc_local_services_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nStability: +3%.\nBureaucracy cost multiplier: +6%.\nImplement a local-services compact and stage 3 normalisation; remove the initial access and parallel-administration penalties. Civilian harm requires separate restitution."
 COLDWAR_CYP_1970_tc_cooperative_credit:0 "Credit for Turkish Cypriot Cooperatives"
 COLDWAR_CYP_1970_tc_cooperative_credit_desc:0 "Turkish Cypriot cooperatives need access to finance that reflects their local markets. Credit can help productive activity recover, provided borrowers and lenders can rely on the administration of their agreements."
 COLDWAR_CYP_1970_tc_cooperative_credit_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nInterest rate multiplier: -0.1 interest points."
 COLDWAR_CYP_1970_tc_mixed_workshops:0 "Reopen Mixed-Community Workshops"
 COLDWAR_CYP_1970_tc_mixed_workshops_desc:0 "Mixed-community workshops can reconnect skills and customers divided by the crisis. Reopening them requires practical security and commercial arrangements rather than confidence imposed by declaration."
 COLDWAR_CYP_1970_tc_mixed_workshops_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nIndustrial capacityy: +3%."
 COLDWAR_CYP_1970_tc_business_licences:0 "Recognise Communal Business Licences"
 COLDWAR_CYP_1970_tc_business_licences_desc:0 "Recognising communal business licences can give firms a clearer legal position in ordinary trade. Common treatment of valid documents will reduce the need for entrepreneurs to negotiate every transaction through political intermediaries."
 COLDWAR_CYP_1970_tc_business_licences_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nOffice park income tax: +3%."
 COLDWAR_CYP_1970_tc_property_records:0 "A Joint Register of Property Claims"
 COLDWAR_CYP_1970_tc_property_records_desc:0 "A joint register can establish a shared factual basis for disputed property claims. Recording ownership does not settle every case, but makes later restitution less dependent on incompatible administrative accounts."
 COLDWAR_CYP_1970_tc_property_records_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSettlement progress: +5 points (0–100)."
 COLDWAR_CYP_1970_tc_services_mandate:0 "A Mandate for Shared Civilian Life"
 COLDWAR_CYP_1970_tc_services_mandate_desc:0 "Civilian services have created a practical basis for shared life. Giving that work a political mandate can protect it from being sacrificed whenever constitutional negotiations encounter another disagreement."
 COLDWAR_CYP_1970_tc_services_mandate_effect_tt:0 "Implement this policy and unlock the following programme."
 COLDWAR_CYP_1970_tc_civil_representation:0 "Civil Representation First"
 COLDWAR_CYP_1970_tc_civil_representation_desc:0 "Civil representatives can bring the needs of workers, businesses and families into communal negotiations. Giving them priority broadens participation beyond the figures whose authority rests chiefly on security."
 COLDWAR_CYP_1970_tc_civil_representation_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nStability: +3%."
 COLDWAR_CYP_1970_tc_security_representation:0 "Security Notables First"
 COLDWAR_CYP_1970_tc_security_representation_desc:0 "Security notables command influence rooted in fears of vulnerability. Making them the leading interlocutors may reassure their supporters, while narrowing the space available to independent civilian organisations."
 COLDWAR_CYP_1970_tc_security_representation_effect_tt:0 "Communal tension: +5 points (0–100).\nForeign influence defense: -4%."
 COLDWAR_CYP_1970_tc_ctp:0 "Talk to Berberoglu and the Emerging CTP"
 COLDWAR_CYP_1970_tc_ctp_desc:0 "An emerging communal left offers a different voice in Turkish Cypriot politics. A channel to Berberoglu and the CTP can broaden dialogue beyond established leadership without treating a new party as representative of every community interest."
 COLDWAR_CYP_1970_tc_ctp_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome."
 COLDWAR_CYP_1970_tc_civic_space:0 "Protect Independent Communal Organisations"
 COLDWAR_CYP_1970_tc_civic_space_desc:0 "Independent communal organisations need room to operate without becoming instruments of a patron or the presidency. Protecting that space can make negotiations more representative and future compromises more durable."
 COLDWAR_CYP_1970_tc_civic_space_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSettlement progress: +5 points (0–100)."
 COLDWAR_CYP_1970_tc_arms_guarantees:0 "Negotiate Local Arms Guarantees"
 COLDWAR_CYP_1970_tc_arms_guarantees_desc:0 "Local arms guarantees must answer fears of exposure without leaving every faction free to enforce its own interpretation. Agreed terms can reduce uncertainty if participants accept obligations as well as protection."
 COLDWAR_CYP_1970_tc_arms_guarantees_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome."
 COLDWAR_CYP_1970_tc_patron_security:0 "Keep Patron-Funded Security"
 COLDWAR_CYP_1970_tc_patron_security_desc:0 "Patron-funded security offers material reassurance to leaders who distrust a common state. It also ties their room for compromise to an external relationship that the republic does not control."
 COLDWAR_CYP_1970_tc_patron_security_effect_tt:0 "Send a proposal to TUR. Conditional benefits require an explicit accepted response; silence provides no agreement.\nCommunal tension: +5 points (0–100).\nForeign influence defense: -4%."
 COLDWAR_CYP_1970_tc_mandate:0 "A Turkish Cypriot Negotiating Mandate"
 COLDWAR_CYP_1970_tc_mandate_desc:0 "A negotiating mandate must give communal representatives authority they can defend before their supporters. It should define the terms they may explore without assuming that an invitation to talks already settles consent."
 COLDWAR_CYP_1970_tc_mandate_effect_tt:0 "The communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome."
 COLDWAR_CYP_1970_tc_political_equality:0 "Bicommunal Political Equality"
 COLDWAR_CYP_1970_tc_political_equality_desc:0 "Bicommunal political equality requires institutions that make participation meaningful. Negotiators must confront representation and safeguards in detail rather than rely on a phrase whose practical meaning remains disputed."
 COLDWAR_CYP_1970_tc_political_equality_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nSettlement progress: +10 points (0–100)."
 COLDWAR_CYP_1970_tc_unitary_bargain:0 "Seek a Unitary Constitutional Bargain"
 COLDWAR_CYP_1970_tc_unitary_bargain_desc:0 "A unitary bargain must offer credible guarantees inside common institutions. Its supporters need to show why central authority will protect the smaller community rather than merely ask it to trust the majority."
 COLDWAR_CYP_1970_tc_unitary_bargain_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome."
 COLDWAR_CYP_1970_tc_federal_framework:0 "Secure Assent to a Federal Framework"
 COLDWAR_CYP_1970_tc_federal_framework_desc:0 "Assent to a federal framework depends on a shared understanding of authority and security. Agreement must come from the communal representatives themselves if the proposed structure is to have a durable foundation."
 COLDWAR_CYP_1970_tc_federal_framework_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome."
 COLDWAR_CYP_1970_tc_shared_republic:0 "Secure Assent to a Shared Republic"
 COLDWAR_CYP_1970_tc_shared_republic_desc:0 "A shared republic must give both communities a dependable place in its institutions. Securing assent will require practical safeguards that survive a disagreement between the governments or leaders who negotiate them."
 COLDWAR_CYP_1970_tc_shared_republic_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome."
 COLDWAR_CYP_1970_tc_constitutional_consent:0 "Consent Is More than a Signature"
 COLDWAR_CYP_1970_tc_constitutional_consent_desc:0 "A signature is useful only if it reflects accepted terms and a continuing mandate. Consolidating constitutional consent means confronting unresolved fears before they become reasons to abandon the settlement."
 COLDWAR_CYP_1970_tc_constitutional_consent_effect_tt:0 "Implement this policy and unlock the following programme."
 COLDWAR_CYP_1970_tc_enosis_consent:0 "Put Enosis before Both Communities"
 COLDWAR_CYP_1970_tc_enosis_consent_desc:0 "Both communities must confront what union would mean for their rights and security. A negotiated proposal requires actual communal consent, not an assumption that one national claim answers every constitutional question."
 COLDWAR_CYP_1970_tc_enosis_consent_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome."
 COLDWAR_CYP_1970_tc_unilateral_resolution:0 "Threaten a Unilateral Resolution"
 COLDWAR_CYP_1970_tc_unilateral_resolution_desc:0 "Threatening a unilateral resolution seeks leverage by narrowing the space for compromise. It may satisfy committed supporters while making accepted guarantees and a shared political settlement more difficult to secure."
 COLDWAR_CYP_1970_tc_unilateral_resolution_effect_tt:0 "Political power: +35.\nCommunal tension: +15 points (0–100).\nPolice cost multiplier: +10%."
 COLDWAR_CYP_1970_tc_postwar_admin:0 "Contact the Turkish Cypriot Administration"
 COLDWAR_CYP_1970_tc_postwar_admin_desc:0 "The postwar Turkish Cypriot administration controls practical decisions affecting civilians and services. Contact can address those realities without requiring the republic to abandon its position on the island's sovereignty."
 COLDWAR_CYP_1970_tc_postwar_admin_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to TUR. Conditional benefits require an explicit accepted response; silence provides no agreement."
 COLDWAR_CYP_1970_tc_postwar_dispute:0 "Continue the Sovereignty Dispute"
 COLDWAR_CYP_1970_tc_postwar_dispute_desc:0 "Continuing the sovereignty dispute preserves the republic's legal and diplomatic claims. The government must still account for the civilian consequences of a conflict that has not produced an agreed political settlement."
 COLDWAR_CYP_1970_tc_postwar_dispute_effect_tt:0 "Political power: +25."
 COLDWAR_CYP_1970_tc_returns:0 "Negotiate Return and Property Claims"
 COLDWAR_CYP_1970_tc_returns_desc:0 "Return and property claims cross the lines of the postwar administration. Negotiation must establish access and procedures capable of addressing individual cases rather than trade incompatible promises at the national level."
 COLDWAR_CYP_1970_tc_returns_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to TUR. Conditional benefits require an explicit accepted response; silence provides no agreement."
 COLDWAR_CYP_1970_tc_civilian_access:0 "Demand Civilian Access across the Lines"
 COLDWAR_CYP_1970_tc_civilian_access_desc:0 "Civilian access across the lines can reconnect families, livelihoods and essential services. Demanding it requires arrangements that participants can use safely, even while their governments disagree on sovereignty."
 COLDWAR_CYP_1970_tc_civilian_access_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to TUR. Conditional benefits require an explicit accepted response; silence provides no agreement."
 COLDWAR_CYP_1970_tc_sovereignty_leverage:0 "Retain Diplomatic and Legal Pressure"
 COLDWAR_CYP_1970_tc_sovereignty_leverage_desc:0 "Diplomatic and legal pressure preserves claims that military separation has not resolved. The government must choose how to use that leverage without closing the channels through which civilians could gain practical relief."
 COLDWAR_CYP_1970_tc_sovereignty_leverage_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes."
 COLDWAR_CYP_1970_tc_beyond_partition:0 "A Settlement beyond Partition"
 COLDWAR_CYP_1970_tc_beyond_partition_desc:0 "A settlement beyond partition must address both sovereignty and the everyday effects of separation. The institutions agreed by the parties will need to protect civilian rights after the immediate diplomatic achievement has passed."
 COLDWAR_CYP_1970_tc_beyond_partition_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to TUR, GRE, ENG. Conditional benefits require an explicit accepted response; silence provides no agreement."
 COLDWAR_CYP_1970_war_pressures:0 "A Republic between Armed Patrons"
 COLDWAR_CYP_1970_war_pressures_desc:0 "The republic stands between armed domestic opponents and external patrons with interests of their own. Political loyalty, military command and communal fear must be treated as related problems without confusing them with a single conspiracy."
 COLDWAR_CYP_1970_war_pressures_effect_tt:0 "Implement this policy and unlock the following programme."
 COLDWAR_CYP_1970_war_underground:0 "Investigate the Armed Underground"
 COLDWAR_CYP_1970_war_underground_desc:0 "The armed underground depends on networks that operate outside public authority. Investigating them can reveal the organisers and resources behind political violence, provided security agencies remain accountable for their methods."
 COLDWAR_CYP_1970_war_underground_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes."
 COLDWAR_CYP_1970_war_civilian_guard:0 "Assert Civilian Authority over the Guard"
 COLDWAR_CYP_1970_war_civilian_guard_desc:0 "Civilian authority over the Guard is a test of the republic's independence. The government must make its orders effective while confronting officers whose political loyalties reach beyond their military duties."
 COLDWAR_CYP_1970_war_civilian_guard_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to GRE. Conditional benefits require an explicit accepted response; silence provides no agreement.\nCoup pressure: -10 points (0–100)."
 COLDWAR_CYP_1970_war_mainland_command:0 "Retain the Mainland Command Structure"
 COLDWAR_CYP_1970_war_mainland_command_desc:0 "The mainland command structure offers continuity and established expertise. Retaining it also leaves the presidency dependent on an arrangement whose competing loyalties have not been resolved."
 COLDWAR_CYP_1970_war_mainland_command_effect_tt:0 "Coup pressure: +10 points (0–100).\nForeign influence defense: -4%."
 COLDWAR_CYP_1970_war_domestic_security:0 "Build an Accountable Domestic Security Chain"
 COLDWAR_CYP_1970_war_domestic_security_desc:0 "An accountable domestic security chain can give the government a clearer means of protecting constitutional authority. Its effectiveness depends on lawful command rather than simply placing different supporters in charge."
 COLDWAR_CYP_1970_war_domestic_security_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nCoup pressure: -15 points (0–100).\nDisarm domestic militias; reduce coup pressure by a further 10 points."
 COLDWAR_CYP_1970_war_junta_links:0 "Bind the Officer Corps to the Greek Junta"
 COLDWAR_CYP_1970_war_junta_links_desc:0 "Binding officers more closely to the Greek junta would align the Guard with an external political project. The choice would deepen the conflict between the republic's government and those who claim to act for a wider national cause."
 COLDWAR_CYP_1970_war_junta_links_effect_tt:0 "Send a proposal to GRE. Conditional benefits require an explicit accepted response; silence provides no agreement.\nCoup pressure: +15 points (0–100)."
 COLDWAR_CYP_1970_war_command_dispute:0 "The Greek–Cypriot Command Dispute"
 COLDWAR_CYP_1970_war_command_dispute_desc:0 "The command dispute exposes a question no administrative compromise can indefinitely conceal: whose political authority governs the island's forces? A substantive decision by the governments concerned will shape the next stage of the crisis."
 COLDWAR_CYP_1970_war_command_dispute_effect_tt:0 "Implement this policy and unlock the following programme."
 COLDWAR_CYP_1970_war_officer_agreement:0 "Negotiate an Officer Withdrawal"
 COLDWAR_CYP_1970_war_officer_agreement_desc:0 "An officer withdrawal agreement can change the command relationship without relying on unilateral orders. Negotiators must obtain terms both governments will implement and prepare for the responsibilities transferred to Cyprus."
 COLDWAR_CYP_1970_war_officer_agreement_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to GRE. Conditional benefits require an explicit accepted response; silence provides no agreement.\nCoup pressure: -10 points (0–100)."
 COLDWAR_CYP_1970_war_plot:0 "Organise against the Presidency"
 COLDWAR_CYP_1970_war_plot_desc:0 "Organising against the presidency turns military and underground networks towards the capture of political authority. Its sponsors must reckon with resistance at home and consequences abroad that a successful conspiracy cannot settle by itself."
 COLDWAR_CYP_1970_war_plot_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to GRE. Conditional benefits require an explicit accepted response; silence provides no agreement.\nCoup pressure: +15 points (0–100)."
 COLDWAR_CYP_1970_war_loyal_guard:0 "A Guard Loyal to the Republic"
 COLDWAR_CYP_1970_war_loyal_guard_desc:0 "A Guard loyal to the republic must defend lawful authority against competing armed patrons. Establishing that allegiance will require practical command and the removal of networks that regard the government as an obstacle."
 COLDWAR_CYP_1970_war_loyal_guard_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nCoup pressure: -15 points (0–100).\nRemove the armed-opposition, divided-command and transitional command spirits; implement civilian command."
 COLDWAR_CYP_1970_war_putsch:0 "A Military Coup Attempt"
 COLDWAR_CYP_1970_war_putsch_desc:0 "A putsch attempts to decide political authority through force. Once committed, its sponsors face an outcome determined by resistance and the decisions of other actors, not by their expectations alone."
 COLDWAR_CYP_1970_war_putsch_effect_tt:0 "Recorded by the crisis dossier after the corresponding action or outcome. Completing this marker does not issue orders to another country."
 COLDWAR_CYP_1970_war_guarantors:0 "The Guarantors Respond"
 COLDWAR_CYP_1970_war_guarantors_desc:0 "The guarantors' response gives the crisis an international dimension beyond Cypriot internal command. Their actual actions must guide the republic's next decisions while diplomatic channels remain open."
 COLDWAR_CYP_1970_war_guarantors_effect_tt:0 "Recorded by the crisis dossier after the corresponding action or outcome. Completing this marker does not issue orders to another country."
 COLDWAR_CYP_1970_war_conference:0 "Seek a Joint Guarantor Conference"
 COLDWAR_CYP_1970_war_conference_desc:0 "A joint guarantor conference could bring urgent security demands into negotiation. Cyprus needs terms that address its constitutional future rather than an agreement among outside powers that assumes away local consent."
 COLDWAR_CYP_1970_war_conference_effect_tt:0 "Recorded by the crisis dossier after the corresponding action or outcome. Completing this marker does not issue orders to another country."
 COLDWAR_CYP_1970_war_defy:0 "Reject the Guarantor Ultimatum"
 COLDWAR_CYP_1970_war_defy_desc:0 "Rejecting an ultimatum preserves the government's declared position at the risk of greater confrontation. The leadership must judge whether its forces and supporters can bear the consequences of continued defiance."
 COLDWAR_CYP_1970_war_defy_effect_tt:0 "Recorded by the crisis dossier after the corresponding action or outcome. Completing this marker does not issue orders to another country."
 COLDWAR_CYP_1970_war_restore:0 "Restore Constitutional Government"
 COLDWAR_CYP_1970_war_restore_desc:0 "Restoring constitutional government offers a route out of the struggle for emergency power. The settlement must establish who governs and ensure that security forces obey the renewed civilian authority."
 COLDWAR_CYP_1970_war_restore_effect_tt:0 "Recorded by the crisis dossier after the corresponding action or outcome. Completing this marker does not issue orders to another country."
 COLDWAR_CYP_1970_war_prepare_intervention:0 "Prepare for Foreign Intervention"
 COLDWAR_CYP_1970_war_prepare_intervention_desc:0 "Preparing for foreign intervention requires a sober assessment of forces, supplies and civilian vulnerability. Readiness can improve available options without making the arrival or course of intervention certain."
 COLDWAR_CYP_1970_war_prepare_intervention_effect_tt:0 "Recorded by the crisis dossier after the corresponding action or outcome. Completing this marker does not issue orders to another country."
 COLDWAR_CYP_1970_war_july_ceasefire:0 "Answer the Ceasefire Appeal"
 COLDWAR_CYP_1970_war_july_ceasefire_desc:0 "A ceasefire appeal demands a choice between immediate restraint and continued fighting. The government's answer must consider the actual military situation and whether accepted terms can protect civilians and prevent renewed clashes."
 COLDWAR_CYP_1970_war_july_ceasefire_effect_tt:0 "Recorded by the crisis dossier after the corresponding action or outcome. Completing this marker does not issue orders to another country."
 COLDWAR_CYP_1970_war_geneva:0 "Negotiate a Political Settlement"
 COLDWAR_CYP_1970_war_geneva_desc:0 "Negotiations at Geneva offer a forum for addressing the crisis beyond the immediate lines of battle. A settlement requires participants to reconcile their demands with obligations they are willing to carry out."
 COLDWAR_CYP_1970_war_geneva_effect_tt:0 "Recorded by the crisis dossier after the corresponding action or outcome. Completing this marker does not issue orders to another country."
 COLDWAR_CYP_1970_war_remobilise:0 "Refuse Terms and Remobilise"
 COLDWAR_CYP_1970_war_remobilise_desc:0 "Refusing terms and remobilising commits the government to further pressure rather than the proposed compromise. Its forces and civilian administration must be prepared for the demands that choice creates."
 COLDWAR_CYP_1970_war_remobilise_effect_tt:0 "Recorded by the crisis dossier after the corresponding action or outcome. Completing this marker does not issue orders to another country."
 COLDWAR_CYP_1970_war_august:0 "The Renewed Hostilities Decision"
 COLDWAR_CYP_1970_war_august_desc:0 "The next decision will test whether negotiations have produced terms the parties can accept. Continuing disagreement leaves military action possible, but its consequences cannot be contained within the intentions of one government."
 COLDWAR_CYP_1970_war_august_effect_tt:0 "Recorded by the crisis dossier after the corresponding action or outcome. Completing this marker does not issue orders to another country."
 COLDWAR_CYP_1970_war_monitored_settlement:0 "Accept a Monitored Political Settlement"
 COLDWAR_CYP_1970_war_monitored_settlement_desc:0 "A monitored political settlement can make restraint more credible through agreed oversight. Its durability depends on accepted institutions and civilian guarantees as well as the immediate separation of forces."
 COLDWAR_CYP_1970_war_monitored_settlement_effect_tt:0 "Recorded by the crisis dossier after the corresponding action or outcome. Completing this marker does not issue orders to another country."
 COLDWAR_CYP_1970_war_military_settlement:0 "Fight for a Military Settlement"
 COLDWAR_CYP_1970_war_military_settlement_desc:0 "Fighting for a military settlement puts the island's future at the mercy of continued operations. The government must accept that victory, further division and civilian loss remain outcomes no order can conclusively determine."
 COLDWAR_CYP_1970_war_military_settlement_effect_tt:0 "Recorded by the crisis dossier after the corresponding action or outcome. Completing this marker does not issue orders to another country."
 COLDWAR_CYP_1970_training_framework:0 "Ratify the Training Framework"
 COLDWAR_CYP_1970_training_framework_desc:0 "A training framework gives military cooperation a defined remit and a responsible authority. Ratifying accepted terms can improve professional preparation while making the limits of the foreign mission clear."
 COLDWAR_CYP_1970_training_framework_effect_tt:0 "Implement this policy and unlock the following programme."
 COLDWAR_CYP_1970_crisis_council:0 "Convene the Emergency Council"
 COLDWAR_CYP_1970_crisis_council_desc:0 "An emergency council must bring political judgment, military information and civilian needs into the same discussion. Clear responsibilities can prevent rival commands from using the crisis to pursue contradictory national policies."
 COLDWAR_CYP_1970_crisis_council_effect_tt:0 "Implement this policy and unlock the following programme."
 COLDWAR_CYP_1970_party_0:0 "£generic_Western_Autocracy_small Dytikofrones technokrates tis Lefkosias"
 COLDWAR_CYP_1970_party_0_desc:0 "(Atlanticist Technocracy) - Western-Minded Technocrats of Nicosia (Greek: Dytikofrones technokrates tis Lefkosias)\n\nIn the ministries and the Central Bank of the young Republic, a group of officials educated in London and America believes that Cyprus belongs firmly with the West. They value the British connection, the Commonwealth and good relations with NATO, despite Makarios's non-aligned diplomacy.\n\nThey worry that the president's flirtation with Moscow and the Non-Aligned Movement isolates the island and provokes Turkey. In 1970 they argue for a settlement backed by Washington and London and for an economy opened to Western investment, tourism and an association with the European Community."
 COLDWAR_CYP_1970_party_0_icon:0 "£generic_Western_Autocracy_small"
 COLDWAR_CYP_1970_party_1_v3:0 "£CYP_western_autocrat (DIKO) - Democratic Party"
 COLDWAR_CYP_1970_party_1_v2:0 "£CYP_western_autocrat (DIKO) - Democratic Party"
 COLDWAR_CYP_1970_party_1_v1:0 "£generic_conservatism_small Presidential Coalition – Democratic Alignment"
 COLDWAR_CYP_1970_party_1:0 "£generic_conservatism_small Presidential Coalition of Makarios"
 COLDWAR_CYP_1970_party_1_v3_desc:0 "(Centrism) - Democratic Party (Greek: Dimokratiko Komma, DIKO)\n\nAfter the death of Makarios in August 1977, Spyros Kyprianou succeeded him as president, and the Democratic Party became the party of the presidency. It represents the centre of Greek Cypriot politics, between the right of Clerides and the left of AKEL.\n\nThe party seeks continuity with Makarios's line, international support for the Republic and a settlement of the Cyprus dispute that restores the rights of refugees. Kyprianou relies on shifting alliances with AKEL and EDEK to hold power and resist pressure for concessions."
 COLDWAR_CYP_1970_party_1_v2_desc:0 "(Presidential Centrism) - Democratic Party (Greek: Proedrikos synaspismos / Dimokratiko Komma, DIKO)\n\nOn 4 December 1976 the Democratic Alignment adopted the name Democratic Party. Led by Spyros Kyprianou, it is the main pillar of the presidential camp, while Archbishop Makarios remains an independent president above the parties.\n\nIn alliance with AKEL and EDEK, the party won the 1976 parliamentary election and dominates the House of Representatives. It stands for a long struggle to reunite the island, refuses solutions that would legitimize partition and seeks international pressure on Turkey through the United Nations and the Non-Aligned Movement."
 COLDWAR_CYP_1970_party_1_v1_desc:0 "(Presidential Centrism) - Democratic Alignment (Greek: Proedrikos synaspismos / Dimokratiki Parataxi)\n\nOn 12 May 1976 Spyros Kyprianou, former foreign minister and president of the House of Representatives, announced the Democratic Alignment to support President Makarios. It brings together loyalists of the archbishop disillusioned with Clerides after the events of 1974.\n\nThe alignment defends the unitary state, the internationalization of the Cyprus problem and the long struggle against the Turkish occupation of the north. Makarios remains an independent president above parties, while the new organization gives his supporters a parliamentary home."
 COLDWAR_CYP_1970_party_1_desc:0 "(Presidential Centrism) - Presidential Coalition of Makarios (Greek: Proedrikos synaspismos tou Makariou)\n\nArchbishop Makarios III, leader of the anti-colonial struggle and president since 1960, stands above parties as both head of state and head of the Church of Cyprus. He governs through changing allies in the House of Representatives, from Clerides's Unified Party to AKEL's disciplined bloc.\n\nHis coalition is united by loyalty to the president, defence of the Republic and the pursuit of an 'attainable' settlement rather than immediate Enosis. Survivor of an assassination attempt in March 1970, Makarios faces enemies on both the nationalist right and in Athens."
 COLDWAR_CYP_1970_party_1_v3_icon:0 "£CYP_western_autocrat"
 COLDWAR_CYP_1970_party_1_v2_icon:0 "£CYP_western_autocrat"
 COLDWAR_CYP_1970_party_1_v1_icon:0 "£generic_conservatism_small"
 COLDWAR_CYP_1970_party_1_icon:0 "£generic_conservatism_small"
 COLDWAR_CYP_1970_party_2_v1:0 "£CYP_western_conservative (DISY) - Democratic Rally"
 COLDWAR_CYP_1970_party_2:0 "£generic_liberalism_small Unified Party"
 COLDWAR_CYP_1970_party_2_v1_desc:0 "(Liberal Conservatism) - Democratic Rally (Greek: Dimokratikos Synagermos, DISY)\n\nGlafkos Clerides founded the Democratic Rally on 4 July 1976, after resigning as the Greek Cypriot negotiator. Having served as acting president after the 1974 coup, he gathers the republican right, the pro-Western centre and many who backed Enosis in the past.\n\nThe party argues for realism: a negotiated federal settlement, close cooperation with the West and a market economy that can rebuild the south after the invasion. Shut out of parliament in 1976 despite a strong vote, it aims to become the main alternative to the presidential camp."
 COLDWAR_CYP_1970_party_2_desc:0 "(Liberal Conservatism) - Unified Party (Greek: Eniaion Komma)\n\nFormed in 1969, the Unified Party gathers the moderate right and the professional classes of the Republic behind Glafkos Clerides, president of the House of Representatives and chief negotiator in the intercommunal talks. It won fifteen of the thirty-five Greek Cypriot seats in the 1970 election.\n\nThe party supports Makarios's 'attainable' policy, a negotiated settlement with the Turkish Cypriots and close ties with the West. It defends the free economy that is transforming Cyprus through tourism and trade, while rejecting both the communist left and the armed Enosis fanatics."
 COLDWAR_CYP_1970_party_2_v1_icon:0 "£CYP_western_conservative"
 COLDWAR_CYP_1970_party_2_icon:0 "£generic_liberalism_small"
 COLDWAR_CYP_1970_party_3_v1:0 "£CYP_western_social_democrat (EDEK) - Socialist Party EDEK"
 COLDWAR_CYP_1970_party_3:0 "£CYP_western_social_democrat (EDEK) - United Democratic Union of the Centre"
 COLDWAR_CYP_1970_party_3_v1_desc:0 "(Democratic Socialism) - Socialist Party EDEK (Greek: Eniaia Dimokratiki Enosis Kentrou – Sosialistiko Komma, EDEK)\n\nAt its second congress in April 1974 EDEK adopted the name of a socialist party, and in the following months its members fought arms in hand against the coup of 15 July. The party lost cadres in the defence of the Presidential Palace and in the fighting that followed.\n\nUnder Vassos Lyssarides it combines democratic socialism with uncompromising resistance to the partition of Cyprus. It demands the withdrawal of all foreign troops, the return of the refugees and a non-aligned, demilitarized republic."
 COLDWAR_CYP_1970_party_3_desc:0 "(Social Democracy) - United Democratic Union of the Centre (Greek: Eniaia Dimokratiki Enosis Kentrou, EDEK)\n\nDr. Vassos Lyssarides, the president's personal physician and a fiery anti-colonial activist, launched his movement in 1969 and held its founding congress on 3 May 1970. EDEK combines social reform with radical anti-imperialism and close ties to the Arab and non-aligned world.\n\nThe party defends Makarios against the armed Enosis underground and calls for the removal of the British bases and foreign interference. It appeals to students, teachers and the urban middle class, offering a socialist alternative to both the right and AKEL."
 COLDWAR_CYP_1970_party_3_v1_icon:0 "£CYP_western_social_democrat"
 COLDWAR_CYP_1970_party_3_icon:0 "£CYP_western_social_democrat"
 COLDWAR_CYP_1970_party_4:0 "£CYP_emerging_communism (AKEL) - Progressive Party of Working People"
 COLDWAR_CYP_1970_party_4_desc:0 "(Marxism-Leninism) - Progressive Party of Working People (Greek: Anorthotiko Komma Ergazomenou Laou, AKEL)\n\nFounded in 1926 as the Communist Party of Cyprus and renamed AKEL in 1941, the party is the oldest and best-organized political force on the island. Under general secretary Ezekias Papaioannou it commands the trade union federation PEO and a loyal following in towns and villages alike.\n\nAKEL backs Makarios's independent, non-aligned course, opposes Enosis with a Greece ruled by colonels and calls for the removal of the British bases. Its programme emphasizes organized labour, public services, cooperation with the Turkish Cypriots and close friendship with the Soviet Union."
 COLDWAR_CYP_1970_party_4_icon:0 "£CYP_emerging_communism"
 COLDWAR_CYP_1970_party_5:0 "£generic_anarchist_communism_small Antiexousiastikoi kykloi tis Lefkosias"
 COLDWAR_CYP_1970_party_5_desc:0 "(Anarchism) - Anti-Authoritarian Circles of Nicosia (Greek: Antiexousiastikoi kykloi tis Lefkosias)\n\nStudents returning from Athens, London and Paris bring with them the ideas of May 1968, the critique of Soviet communism and the anti-militarism of the new left. In Nicosia they gather in bookshops and cafés to debate Bakunin, Marcuse and self-management.\n\nThey reject the Church, the nationalists and the disciplined hierarchy of AKEL alike, denouncing all armies on the island, Greek, Turkish and British. Few in number, they are tolerated but marginal, a voice of youthful dissent in a society dominated by national questions."
 COLDWAR_CYP_1970_party_5_icon:0 "£generic_anarchist_communism_small"
 COLDWAR_CYP_1970_party_6:0 "£generic_Conservative_small Filosovietikoi ethnikofrones"
 COLDWAR_CYP_1970_party_6_desc:0 "(Eastern-Oriented Nationalism) - Pro-Soviet Nationalists (Greek: Filosovietikoi ethnikofrones)\n\nSome Greek Cypriot nationalists, embittered by the support of the United States and NATO for Turkey, look to Moscow as the island's true protector. They recall that the Soviet Union backed the Republic in 1964 and that Orthodox Russia shares the faith of the Church of Cyprus.\n\nThis unusual current combines Orthodox patriotism with anti-Western foreign policy, rejecting both the colonels in Athens and the communism of AKEL. It hopes for a sovereign Cyprus, armed by the Eastern bloc if necessary, that can defy the Atlantic powers."
 COLDWAR_CYP_1970_party_6_icon:0 "£generic_Conservative_small"
 COLDWAR_CYP_1970_party_7:0 "£generic_Autocracy_small Kratis tis dimokratias"
 COLDWAR_CYP_1970_party_7_desc:0 "(Presidential Authoritarianism) - Strongmen of the Republic (Greek: Kratis tis dimokratias)\n\nAround the Ministry of the Interior and the police, men who fought in EOKA in the 1950s built a security apparatus loyal to the state and its president. The assassination of the former interior minister Polycarpos Georkadjis in March 1970, days after the attack on Makarios's helicopter, has left this world full of suspicion.\n\nThese strongmen believe that only a tough executive, loyal special forces and firm control of the press can save the Republic from the Enosis underground and from Turkish partitionism. They would gladly suspend normal politics in the name of defending the state."
 COLDWAR_CYP_1970_party_7_icon:0 "£generic_Autocracy_small"
 COLDWAR_CYP_1970_party_8:0 "£generic_Mod_Vilayat_e_Faqih_small Siites metarrythmistes tis Kyprou"
 COLDWAR_CYP_1970_party_8_desc:0 "(Shia Reformism) - Shia Reformers of Cyprus (Greek: Siites metarrythmistes tis Kyprou)\n\nCyprus has no Shia community of its own, but a few Lebanese and Iranian merchants and students in Nicosia and Limassol bring the reformist Shia thought of figures such as Musa al-Sadr, who is organizing Lebanon's Shia at this very time.\n\nTheir small circle discusses religion, social justice and the renewal of Islam, and maintains discreet contacts with the Turkish Cypriot Muslims. Politically it carries no weight, but Cyprus's position as a crossroads of the Levant gives it a modest role as a meeting point."
 COLDWAR_CYP_1970_party_8_icon:0 "£generic_Mod_Vilayat_e_Faqih_small"
 COLDWAR_CYP_1970_party_9:0 "£generic_Vilayat_e_Faqih_small Siitikoi klirikoi kykloi tis Kyprou"
 COLDWAR_CYP_1970_party_9_desc:0 "(Shia Theocracy) - Shia Clerical Circles of Cyprus (Greek: Siitikoi klirikoi kykloi tis Kyprou)\n\nAmong Iranian and Lebanese residents of Cyprus, a few followers of Ayatollah Ruhollah Khomeini circulate his lectures on Islamic government delivered in Najaf. The island, close to Beirut, serves as a quiet transit point for their pamphlets and messengers.\n\nTheir goal is not Cyprus itself but the overthrow of the Shah and the rise of a government of jurists across the Shia world. In Cypriot politics they are invisible, watched occasionally by foreign intelligence services that use the island as a listening post."
 COLDWAR_CYP_1970_party_9_icon:0 "£generic_Vilayat_e_Faqih_small"
 COLDWAR_CYP_1970_party_10:0 "£generic_Kingdom_small Salafites paradosiakoi tis Kyprou"
 COLDWAR_CYP_1970_party_10_desc:0 "(Salafi Monarchism) - Salafi Traditionalists of Cyprus (Greek: Salafites paradosiakoi tis Kyprou)\n\nA few Turkish Cypriot and Arab Muslims living in the Republic's towns follow the strict teachings of Saudi scholars, rejecting the island's Sufi heritage and the veneration of shrines such as the Hala Sultan Tekke near Larnaca.\n\nThey look to the Saudi monarchy as the ideal of an Islamic state and seek funding from the Gulf for mosques and religious instruction. In a divided island where Islam is mostly a marker of communal identity, they remain an isolated and minor current."
 COLDWAR_CYP_1970_party_10_icon:0 "£generic_Kingdom_small"
 COLDWAR_CYP_1970_party_11:0 "£generic_Caliphate_small Ypostiriktes tou khalifatou"
 COLDWAR_CYP_1970_party_11_desc:0 "(Pan-Islamism) - Supporters of the Caliphate (Greek: Ypostiriktes tou khalifatou)\n\nA handful of Muslims in Cyprus, Arabs as well as Turkish Cypriots, cherish the idea of a restored caliphate uniting all believers. They read the pamphlets of Hizb ut-Tahrir, active in nearby Jordan and Lebanon, and blame the division of the Muslim world for every defeat.\n\nTheir ideas have no echo in the island's politics, where communal nationalism rules on both sides. They meet privately and avoid the attention of the police, a curiosity rather than a force in the Republic of 1970."
 COLDWAR_CYP_1970_party_11_icon:0 "£generic_Caliphate_small"
 COLDWAR_CYP_1970_party_12:0 "£muslim_brotherhood_small Mousoulmanoi metarrythmistes tis Kyprou"
 COLDWAR_CYP_1970_party_12_desc:0 "(Islamic Democracy) - Muslim Reformers of Cyprus (Greek: Mousoulmanoi metarrythmistes tis Kyprou)\n\nA few educated Muslims of Cyprus, influenced by the Islamic reform movements of Egypt and Turkey, argue that faith can inspire honest government and social solidarity. They regret that religion on the island has become merely a badge of ethnic division.\n\nThey favour dialogue between the communities, religious freedom and participation in democratic institutions. Without an organization and caught between two nationalisms, they remain a small, idealistic current with little influence."
 COLDWAR_CYP_1970_party_12_icon:0 "£muslim_brotherhood_small"
 COLDWAR_CYP_1970_party_13:0 "£generic_Neutral_Autocracy_small Technokrates tis kypriakis dioikisis"
 COLDWAR_CYP_1970_party_13_desc:0 "(Technocratic Statism) - Technocrats of the Cypriot Administration (Greek: Technokrates tis kypriakis dioikisis)\n\nThe Planning Bureau and the senior civil service of the Republic have steered Cyprus through two five-year plans, turning a poor colony into a fast-growing economy of tourism, citrus and light industry. Its planners take pride in their professionalism.\n\nThey are wary of party patronage, Church interference and the politics of the gun, and they favour a strong, impartial administration. In 1970 they are loyal to the presidency, but they see themselves as the true guardians of the state's continuity."
 COLDWAR_CYP_1970_party_13_icon:0 "£generic_Neutral_Autocracy_small"
 COLDWAR_CYP_1970_party_14:0 "£generic_Neutral_conservatism_small Agrotikoi paradosiakoi"
 COLDWAR_CYP_1970_party_14_desc:0 "(Rural Conservatism) - Rural Traditionalists (Greek: Agrotikoi paradosiakoi)\n\nIn the villages of the Troodos, the Mesaoria and the Paphos district, priests, schoolteachers and village elders uphold an Orthodox, patriotic and family-centred way of life. The Church and its bishops remain their natural leaders.\n\nThese traditionalists want water for their fields, fair prices for grain and grapes, and respect for faith and custom. Many still dream of Enosis with Greece, yet they revere Makarios as archbishop, and the tension between these loyalties shapes their politics."
 COLDWAR_CYP_1970_party_14_icon:0 "£generic_Neutral_conservatism_small"
 COLDWAR_CYP_1970_party_15:0 "£generic_oligarchism_small (KEVE) - Cyprus Chamber of Commerce and Industry"
 COLDWAR_CYP_1970_party_15_desc:0 "(Mercantile Capitalism) - Cyprus Chamber of Commerce and Industry (Greek: Kypriako Emporiko kai Viomichaniko Epimelitirio, KEVE)\n\nThe Cyprus Chamber of Commerce and Industry speaks for the merchants, hoteliers, contractors and manufacturers who are profiting from the island's boom. Tourism, construction and exports to Britain and the Middle East have made the business class a power in its own right.\n\nThe chamber wants stability above all: no armed adventures, no nationalizations and a settlement that keeps the island open to trade. It lobbies the presidency and the House discreetly and finances friendly politicians across the centre and the right."
 COLDWAR_CYP_1970_party_15_icon:0 "£generic_oligarchism_small"
 COLDWAR_CYP_1970_party_16:0 "£generic_Neutral_Libertarian_small Eleftheroemporikoi tis Lemesou"
 COLDWAR_CYP_1970_party_16_desc:0 "(Free-Market Liberalism) - Free Traders of Limassol (Greek: Eleftheroemporikoi tis Lemesou)\n\nIn the port city of Limassol, wine exporters, shipping agents and young financiers see Cyprus as a natural free-trade hub of the eastern Mediterranean. They envy the role of Beirut as the region's banking centre and want Cyprus to compete.\n\nThey call for lower taxes, free movement of capital, offshore companies and association with the European Community. Pragmatic and outward-looking, they distrust nationalist passions that threaten business and favour any settlement that brings peace."
 COLDWAR_CYP_1970_party_16_icon:0 "£generic_Neutral_Libertarian_small"
 COLDWAR_CYP_1970_party_17:0 "£generic_Neutral_green_small Prostasia tis fysis tou Troodous"
 COLDWAR_CYP_1970_party_17_desc:0 "(Conservationism) - Troodos Nature Protection (Greek: Prostasia tis fysis tou Troodous)\n\nForesters, naturalists and village teachers of the Troodos mountains defend the pine and cedar forests, the springs and the rare wildlife of the island, including the mouflon. Mining at Amiantos and fires during the years of conflict have left deep scars.\n\nThey want protected areas, careful management of water and limits on building in the mountains and along the coasts, where tourism is growing fast. Though not a political party, their voice reaches the Forestry Department and the press."
 COLDWAR_CYP_1970_party_17_icon:0 "£generic_Neutral_green_small"
 COLDWAR_CYP_1970_party_18:0 "£generic_neutral_Social_small Agrotikos syndikalismos"
 COLDWAR_CYP_1970_party_18_desc:0 "(Democratic Socialism) - Agrarian Trade Unionism (Greek: Agrotikos syndikalismos)\n\nThe farmers' unions and the cooperative movement are a pillar of rural Cyprus, where most families still live from the land. Smallholders organize to secure water rights, fair credit from the cooperative banks and guaranteed prices for their crops.\n\nThis agrarian unionism favours cooperation, social insurance for farmers and public investment in dams and irrigation. It stands apart from both the right-wing unions and AKEL's federation, seeking a social-democratic path for the countryside."
 COLDWAR_CYP_1970_party_18_icon:0 "£generic_neutral_Social_small"
 COLDWAR_CYP_1970_party_19:0 "£CYP_emerging_communism Aristeroi kykloi ektos AKEL"
 COLDWAR_CYP_1970_party_19_desc:0 "(Independent Socialism) - Left Circles outside AKEL (Greek: Aristeroi kykloi ektos AKEL)\n\nNot every Greek Cypriot leftist accepts AKEL's discipline and its loyalty to Moscow. Students and intellectuals influenced by the new left, by Maoism and by the Greek resistance to the junta form small independent circles.\n\nThey criticize AKEL's caution and its support for the president, calling for a more radical anti-imperialist struggle against the British bases and NATO. Lacking organization, they publish journals and organize student protests, hoping to build a new socialist movement."
 COLDWAR_CYP_1970_party_19_icon:0 "£CYP_emerging_communism"
 COLDWAR_CYP_1970_party_20:0 "£generic_Nat_Populism_small Progressive Front"
 COLDWAR_CYP_1970_party_20_desc:0 "(National Populism) - Progressive Front (Greek: Proodeftiki Parataxis)\n\nThe Progressive Front entered the House of Representatives in the 1970 election as a right-wing nationalist list, winning seven seats. Its orbit includes Nikos Sampson, the former EOKA gunman and newspaper publisher whose populist rhetoric thrills the young nationalists of Nicosia.\n\nThe Front presents itself as a legal, electoral organization, distinct from the underground armed groups and from the National Guard. It demands Enosis, attacks the communists and accuses the government of weakness toward the Turkish Cypriots."
 COLDWAR_CYP_1970_party_20_icon:0 "£generic_Nat_Populism_small"
 COLDWAR_CYP_1970_party_21_v1:0 "£generic_Nat_Fascism_small (EOKA B) - National Organisation of Cypriot Fighters B"
 COLDWAR_CYP_1970_party_21:0 "£generic_Nat_Fascism_small Enoplo enotiko kinima"
 COLDWAR_CYP_1970_party_21_v1_desc:0 "(Militant Enosis Nationalism) - National Organisation of Cypriot Fighters B (Greek: Ethniki Organosis Kyprion Agoniston B, EOKA B)\n\nGeneral Georgios Grivas, the legendary leader of the EOKA struggle, returned secretly to Cyprus in September 1971 and founded EOKA B to fight for Enosis. After his death in January 1974, the organization fell under the control of the junta in Athens.\n\nAn armed underground rather than a parliamentary party, EOKA B wages a campaign of bombings and assassinations against Makarios's government and its supporters. It hopes to topple the president and proclaim union with Greece."
 COLDWAR_CYP_1970_party_21_desc:0 "(Militant Enosis Nationalism) - Armed Enosis Movement (Greek: Enoplo enotiko kinima)\n\nArmed opponents of Makarios, among them the National Front founded in 1969, accuse the president of betraying the cause of Enosis. They raid police stations, plant bombs and assassinate opponents, with sympathizers among the Greek officers of the National Guard.\n\nTheir goal is union with Greece at any cost, even if it means overthrowing the elected president. Their pursuit of Enosis challenges presidential authority, divides the security forces and threatens to drag Cyprus into civil war."
 COLDWAR_CYP_1970_party_21_v1_icon:0 "£generic_Nat_Fascism_small"
 COLDWAR_CYP_1970_party_21_icon:0 "£generic_Nat_Fascism_small"
 COLDWAR_CYP_1970_party_22_v1:0 "£generic_Nat_Autocracy_small National Guard Coup Regime"
 COLDWAR_CYP_1970_party_22:0 "£generic_Nat_Autocracy_small Axiomatikoi tis Ethnikis Frouras"
 COLDWAR_CYP_1970_party_22_v1_desc:0 "(Military Dictatorship) - National Guard Coup Regime (Greek: Kathestos praxikopimatos tis Ethnikis Frouras)\n\nOn 15 July 1974 the National Guard, directed by the Greek junta's Brigadier Dimitrios Ioannidis, attacked the Presidential Palace and overthrew Makarios. Nikos Sampson was installed as president, and fighting raged against loyalist forces across the island.\n\nThe coup regime proclaims its goal of Enosis and claims to rule in the name of the nation, but it rests on Greek officers and armed irregulars. Its seizure of power has given Turkey a pretext to intervene and placed the Republic's very existence in danger."
 COLDWAR_CYP_1970_party_22_desc:0 "(Military Nationalism) - National Guard Officers (Greek: Axiomatikoi tis Ethnikis Frouras)\n\nThe Cypriot National Guard, founded in 1964, is officered largely by Greek army officers sent from Athens. They occupy a powerful position between the elected presidency, the military regime in Greece and the competing visions of the island's future.\n\nMany of these officers despise Makarios and sympathize with the Enosis underground. Should the colonels in Athens decide to act, the National Guard could become the instrument for overthrowing the Republic's government."
 COLDWAR_CYP_1970_party_22_v1_icon:0 "£generic_Nat_Autocracy_small"
 COLDWAR_CYP_1970_party_22_icon:0 "£generic_Nat_Autocracy_small"
 COLDWAR_CYP_1970_party_23:0 "£generic_Monarchist_small Vasilofrones tis enosis"
 COLDWAR_CYP_1970_party_23_desc:0 "(Constitutional Monarchism) - Royalists of Enosis (Greek: Vasilofrones tis enosis)\n\nSome Greek Cypriots who long for Enosis imagine it under the Greek crown, as their grandparents did when King George I reigned in Athens. They admire King Constantine II, exiled in Rome since December 1967, and despise the colonels who drove him out.\n\nFor them union with Greece should be union with a constitutional monarchy, not with a dictatorship. In 1970 they are a small, sentimental current, but they hope that a restored king could unite Hellenism and win over the island to Enosis."
 COLDWAR_CYP_1970_party_23_icon:0 "£generic_Monarchist_small"
 COLDWAR_NCY_1970_party_0:0 "£generic_Western_Autocracy_small Batı bağlantılı Lefkoşa bürokratları"
 COLDWAR_NCY_1970_party_0_desc:0 "(Atlanticist Technocracy) - Western-Linked Nicosia Bureaucrats (Turkish: Batı bağlantılı Lefkoşa bürokratları)\n\nIn the walled Turkish quarter of Nicosia, a small corps of administrators, many trained in Britain or Ankara, runs the services of the Turkish Cypriot enclaves. They look to NATO, the British Sovereign Base Areas and Turkey's Western alliance as the ultimate guarantees of their community's survival.\n\nThese bureaucrats prefer quiet diplomacy with London and Washington to street militancy. In 1970 they argue that the intercommunal talks begun in 1968 can succeed only if the Western powers stand firmly behind the Turkish Cypriot demands for security and local autonomy."
 COLDWAR_NCY_1970_party_0_icon:0 "£generic_Western_Autocracy_small"
 COLDWAR_NCY_1970_party_1_v2:0 "£NCY_western_conservative (UBP) - National Unity Party"
 COLDWAR_NCY_1970_party_1_v1:0 "£generic_conservatism_small Turkish Cypriot Administration"
 COLDWAR_NCY_1970_party_1:0 "£generic_conservatism_small Turkish Cypriot Communal Executive"
 COLDWAR_NCY_1970_party_1_v2_desc:0 "(Turkish Cypriot Conservatism) - National Unity Party (Turkish: Ulusal Birlik Partisi, UBP)\n\nFounded on 11 October 1975 by Rauf Denktaş, the National Unity Party is the dominant force of the Turkish Federated State of Cyprus proclaimed that February. It swept the elections of 1976, in which Denktaş was elected president of the federated state while Nejat Konuk became prime minister.\n\nThe party stands for Turkey's security guarantee, a bizonal federation and the economic development of the north in close coordination with Ankara. Its successive chairmen and prime ministers, among them Osman Örek, Mustafa Çağatay and Derviş Eroğlu, carry this line forward under Denktaş's presidency."
 COLDWAR_NCY_1970_party_1_v1_desc:0 "(Communal Conservatism) - Turkish Cypriot Administration (Turkish: Kıbrıs Türk Yönetimi)\n\nOn 28 February 1973 Rauf Denktaş took the oath as vice-president of the Republic of Cyprus and assumed the leadership of the Turkish Cypriot Administration in succession to Fazıl Küçük. A lawyer and former crown prosecutor, he has led his community's negotiators since 1968.\n\nThe administration governs the enclaves with Turkish money and military backing, insisting that the Turkish Cypriots are a co-founding community of the Republic, not a minority. Although it lacks international recognition, Denktaş seeks a federal solution with broad communal autonomy and is ready to defend that position by every means available."
 COLDWAR_NCY_1970_party_1_desc:0 "(Communal Conservatism) - Turkish Cypriot Communal Executive (Turkish: Kıbrıs Türk Cemaat İcra Heyeti)\n\nSince December 1967 the Turkish Cypriots have governed their enclaves through their own administration, headed by Dr. Fazıl Küçük, the elected vice-president of the Republic. Its executive council runs the schools, courts and police in the areas beyond the reach of the Greek Cypriot-led government.\n\nKüçük, a veteran of the communal struggle since the 1940s, insists on the rights guaranteed by the 1960 constitution and on Turkey's role as guarantor power. Rauf Denktaş, president of the Communal Chamber and chief negotiator in the intercommunal talks, is already the rising force within the leadership."
 COLDWAR_NCY_1970_party_1_v2_icon:0 "£NCY_western_conservative"
 COLDWAR_NCY_1970_party_1_v1_icon:0 "£generic_conservatism_small"
 COLDWAR_NCY_1970_party_1_icon:0 "£generic_conservatism_small"
 COLDWAR_NCY_1970_party_2:0 "£generic_liberalism_small Anayasal hürriyet taraftarları"
 COLDWAR_NCY_1970_party_2_desc:0 "(Liberalism) - Supporters of Constitutional Liberty (Turkish: Anayasal hürriyet taraftarları)\n\nA circle of Turkish Cypriot lawyers, teachers and returning graduates believes that the community's administration should be more than a wartime command. They call for an independent judiciary, a free press and a Communal Chamber that truly holds the leadership to account.\n\nThey support the intercommunal talks and a settlement based on the rule of law rather than permanent separation. In the tense atmosphere of the enclaves, where the resistance organization keeps watch over dissent, their demands are daring, and they act as independents rather than as an organized party."
 COLDWAR_NCY_1970_party_2_icon:0 "£generic_liberalism_small"
 COLDWAR_NCY_1970_party_3_v1:0 "£NCY_western_social_democrat (CTP) - Republican Turkish Party"
 COLDWAR_NCY_1970_party_3:0 "£generic_socialism_small Kıbrıs Türk demokratik muhalefeti"
 COLDWAR_NCY_1970_party_3_v1_desc:0 "(Social Democracy) - Republican Turkish Party (Turkish: Cumhuriyetçi Türk Partisi, CTP)\n\nFounded on 27 December 1970 by the lawyer Ahmet Mithat Berberoğlu, the Republican Turkish Party is the first organized opposition within the Turkish Cypriot community. It speaks for workers, civil servants and young people frustrated with the enclave administration and the dominance of the resistance organization.\n\nThe party advocates democratic representation, trade union rights and a negotiated federal settlement with the Greek Cypriots. Under Özker Özgür, who leads it from 1976, it moves further to the left and becomes the principal voice of opposition to Rauf Denktaş."
 COLDWAR_NCY_1970_party_3_desc:0 "(Social Democracy) - Turkish Cypriot Democratic Opposition (Turkish: Kıbrıs Türk demokratik muhalefeti)\n\nNot every Turkish Cypriot accepts the leadership of Küçük and Denktaş without question. Lawyers, schoolteachers and trade unionists criticize the closed enclave regime, the power of the resistance organization and the absence of political choice in the community.\n\nAround the lawyer Ahmet Mithat Berberoğlu, they prepare to build an organized opposition that would stand for democratic rights, workers' interests and peaceful coexistence with the Greek Cypriots. In 1970 they remain a loose tendency, but a party is in the making."
 COLDWAR_NCY_1970_party_3_v1_icon:0 "£NCY_western_social_democrat"
 COLDWAR_NCY_1970_party_3_icon:0 "£generic_socialism_small"
 COLDWAR_NCY_1970_party_4:0 "£generic_Communist_State_small Kıbrıslı Türk komünistler"
 COLDWAR_NCY_1970_party_4_desc:0 "(Marxism-Leninism) - Turkish Cypriot Communists (Turkish: Kıbrıslı Türk komünistler)\n\nBefore the violence of 1958 and 1963, many Turkish Cypriot workers belonged to the left-wing trade unions side by side with Greek Cypriots. Intimidation by the resistance organization drove most of them out, and some paid for their convictions with their lives.\n\nA small network of Turkish Cypriot communists survives, some in contact with AKEL, others among the emigrants in London. They argue that the island's division serves imperialism and call for a united, independent and non-aligned Cyprus shared by both communities."
 COLDWAR_NCY_1970_party_4_icon:0 "£generic_Communist_State_small"
 COLDWAR_NCY_1970_party_5:0 "£generic_anarchist_communism_small Lefkoşa özgürlükçü sol çevreleri"
 COLDWAR_NCY_1970_party_5_desc:0 "(Libertarian Socialism) - Nicosia Libertarian Left Circles (Turkish: Lefkoşa özgürlükçü sol çevreleri)\n\nTurkish Cypriot students returning from Ankara, Istanbul and London bring home the spirit of 1968: protest songs, Marxist pamphlets and a deep distrust of authority. In the cafés of Nicosia's Turkish quarter they talk of freedom of thought and a world without borders or armies.\n\nThey reject both the nationalist leadership and the orthodox communists, demanding an end to censorship and to the militarization of everyday life. In the enclaves, where dissent can be dangerous, these circles are small and cautious, but they are shaping the new left of the 1970s."
 COLDWAR_NCY_1970_party_5_icon:0 "£generic_anarchist_communism_small"
 COLDWAR_NCY_1970_party_6:0 "£generic_Conservative_small Sovyet yanlısı millî muhafazakârlar"
 COLDWAR_NCY_1970_party_6_desc:0 "(Eastern-Oriented Nationalism) - Pro-Soviet National Conservatives (Turkish: Sovyet yanlısı millî muhafazakârlar)\n\nSome Turkish Cypriot nationalists, bitter that Washington held Turkey back from intervening in 1964 and 1967, have drawn a surprising conclusion. Recalling President Johnson's harsh letter to İnönü in June 1964, they argue that the Americans will always sacrifice the Turkish Cypriots to alliance politics.\n\nThey suggest that a balanced relationship with Moscow, which has rejected Enosis, could protect the community better than reliance on the West. A small and paradoxical current, they combine patriotic conservatism at home with a non-aligned, even Soviet-leaning outlook abroad."
 COLDWAR_NCY_1970_party_6_icon:0 "£generic_Conservative_small"
 COLDWAR_NCY_1970_party_7:0 "£generic_Autocracy_small Cemaat idaresinin otoriter kanadı"
 COLDWAR_NCY_1970_party_7_desc:0 "(Communal Authoritarianism) - Authoritarian Wing of the Communal Administration (Turkish: Cemaat idaresinin otoriter kanadı)\n\nWithin the Turkish Cypriot administration, a hard core of officials and resistance veterans believes that the community can survive only through discipline. They see opposition, independent newspapers and contacts with Greek Cypriots as dangerous weaknesses in a permanent state of siege.\n\nThis wing favours emergency powers, strict control of movement in and out of the enclaves and the subordination of civilian politics to security. Its influence rests on the fear left by the clashes of 1963 to 1967 and on close ties with the Turkish officers serving on the island."
 COLDWAR_NCY_1970_party_7_icon:0 "£generic_Autocracy_small"
 COLDWAR_NCY_1970_party_8:0 "£generic_Mod_Vilayat_e_Faqih_small Şii reformcular"
 COLDWAR_NCY_1970_party_8_desc:0 "(Shia Reformism) - Shia Reformers (Turkish: Şii reformcular)\n\nThe Turkish Cypriots are overwhelmingly Sunni and largely secular, but a few families of Alevi and Bektashi heritage remember the old dervish lodges of Nicosia. Some young people studying in Britain, influenced by Iranian fellow students, have also discovered reformist Shia thought.\n\nThis tiny current seeks freedom of worship outside the official Sunni religious affairs office and a more open debate on Islam and modern life. Politically insignificant in the enclaves, it exists more as a study circle than as a movement, though it hopes that greater freedom will widen its audience."
 COLDWAR_NCY_1970_party_8_icon:0 "£generic_Mod_Vilayat_e_Faqih_small"
 COLDWAR_NCY_1970_party_9:0 "£generic_Vilayat_e_Faqih_small Şii ruhani çevreler"
 COLDWAR_NCY_1970_party_9_desc:0 "(Shia Theocracy) - Shia Clerical Circles (Turkish: Şii ruhani çevreler)\n\nA few Turkish Cypriots studying abroad have come into contact with Shia clerical thought and with the lectures of Ayatollah Ruhollah Khomeini in Najaf, which call for government by the Islamic jurists. They pass his ideas on in private gatherings.\n\nIn a secular community whose leaders are Kemalist nationalists, such views find almost no echo, and the resistance organization treats any religious politics with suspicion. The circle remains a handful of believers who see the Cyprus conflict as part of a wider struggle between Islam and the West."
 COLDWAR_NCY_1970_party_9_icon:0 "£generic_Vilayat_e_Faqih_small"
 COLDWAR_NCY_1970_party_10:0 "£generic_Kingdom_small Selefi gelenekçiler"
 COLDWAR_NCY_1970_party_10_desc:0 "(Salafi Monarchism) - Salafi Traditionalists (Turkish: Selefi gelenekçiler)\n\nA few Turkish Cypriots who studied or worked in Saudi Arabia return with a strict, scripture-centred Islam that rejects the saints' tombs and Sufi customs of the island. They admire the Saudi monarchy as a state ruled by the Quran.\n\nTheir influence among the secular, Kemalist-minded Turkish Cypriots is minimal, and the community's religious affairs remain in the hands of the official mufti. They cultivate links with Gulf benefactors who might one day fund mosques and schools in the enclaves."
 COLDWAR_NCY_1970_party_10_icon:0 "£generic_Kingdom_small"
 COLDWAR_NCY_1970_party_11:0 "£generic_Caliphate_small Hilafet taraftarları"
 COLDWAR_NCY_1970_party_11_desc:0 "(Pan-Islamism) - Supporters of the Caliphate (Turkish: Hilafet taraftarları)\n\nSome elderly Turkish Cypriots still remember the Friday prayers said in the name of the Ottoman sultan-caliph, and a few regard the abolition of the caliphate in 1924 as the beginning of the Muslim world's humiliation. Their views are passed on in a handful of conservative families.\n\nThey imagine the Cyprus conflict as one front in a wider struggle that only a united Muslim community under a caliph could win. In the secular, nationalist enclaves this current has no organization and no prospects, and it remains a voice of nostalgia rather than of action."
 COLDWAR_NCY_1970_party_11_icon:0 "£generic_Caliphate_small"
 COLDWAR_NCY_1970_party_12:0 "£muslim_brotherhood_small İslamcı ıslahatçılar"
 COLDWAR_NCY_1970_party_12_desc:0 "(Islamic Democracy) - Islamist Reformers (Turkish: İslamcı ıslahatçılar)\n\nA small group of pious Turkish Cypriots, inspired by Turkey's National Outlook movement and by the writings of Islamic modernists, argues that faith should play a larger role in public life. They criticize the secular leadership for neglecting religious education and mosques.\n\nUnlike the radicals, they accept elections and the communal institutions, seeking influence through associations and charity. In a community shaped by Kemalist nationalism, their prospects are slim, but they hope that ties with conservative circles in Anatolia will give them weight."
 COLDWAR_NCY_1970_party_12_icon:0 "£muslim_brotherhood_small"
 COLDWAR_NCY_1970_party_13:0 "£generic_Neutral_Autocracy_small Cemaat idaresinin teknokratları"
 COLDWAR_NCY_1970_party_13_desc:0 "(Technocratic Statism) - Technocrats of the Communal Administration (Turkish: Cemaat idaresinin teknokratları)\n\nEngineers, economists and planners in the Turkish Cypriot administration manage the aid that arrives from Ankara, the rebuilding of housing and the small enterprises of the enclaves. They believe the community's survival depends on competent administration, not on rhetoric.\n\nNeither pro-Western nor pro-Soviet, they want a planned economy, public investment and a civil service free of patronage. In 1970 they serve the leadership loyally, but they would gladly take charge of a government of experts if the politicians and fighters faltered."
 COLDWAR_NCY_1970_party_13_icon:0 "£generic_Neutral_Autocracy_small"
 COLDWAR_NCY_1970_party_14:0 "£generic_Neutral_conservatism_small Köylerin gelenekçi ileri gelenleri"
 COLDWAR_NCY_1970_party_14_desc:0 "(Rural Conservatism) - Traditional Village Notables (Turkish: Köylerin gelenekçi ileri gelenleri)\n\nIn the Turkish Cypriot villages of the Mesaoria and the Karpas, the muhtars, landowners and elders still carry great authority. Many of their villages were abandoned in the fighting of 1963 and 1964, and their people now live as refugees in the enclaves.\n\nThe notables want security, land and a return to their homes, along with respect for family and religion. They are loyal to the community's leaders but suspicious of urban radicals of every kind, and their support is decisive in any communal election."
 COLDWAR_NCY_1970_party_14_icon:0 "£generic_Neutral_conservatism_small"
 COLDWAR_NCY_1970_party_15:0 "£generic_oligarchism_small Kıbrıs Türk ticaret çevreleri"
 COLDWAR_NCY_1970_party_15_desc:0 "(Mercantile Capitalism) - Turkish Cypriot Trade Circles (Turkish: Kıbrıs Türk ticaret çevreleri)\n\nThe Turkish Cypriot Chamber of Commerce, founded in 1958, and the merchant families of Nicosia, Famagusta and Kyrenia keep trade flowing despite the enclaves and the economic restrictions imposed by the Greek Cypriot authorities. Imports from Turkey and aid money sustain their business.\n\nThese merchants seek freedom of movement, access to ports and a share in the island's growing tourism and citrus trade. They back the leadership in public, but in private many of them would welcome a compromise that reopens the island's markets."
 COLDWAR_NCY_1970_party_15_icon:0 "£generic_oligarchism_small"
 COLDWAR_NCY_1970_party_16:0 "£generic_Neutral_Libertarian_small Serbest teşebbüs taraftarları"
 COLDWAR_NCY_1970_party_16_desc:0 "(Free-Market Liberalism) - Supporters of Free Enterprise (Turkish: Serbest teşebbüs taraftarları)\n\nYoung Turkish Cypriot entrepreneurs, accountants and traders argue that their community's dependence on Turkish subsidies and public jobs is a trap. They call for private enterprise, open trade and a small, efficient administration.\n\nTheir models are the booming Greek Cypriot economy across the line and the market economies of Western Europe. In 1970 they are few and lack political organization, but they hope to make economic freedom part of any future settlement."
 COLDWAR_NCY_1970_party_16_icon:0 "£generic_Neutral_Libertarian_small"
 COLDWAR_NCY_1970_party_17:0 "£generic_Neutral_green_small Beşparmak doğa koruyucuları"
 COLDWAR_NCY_1970_party_17_desc:0 "(Conservationism) - Guardians of the Kyrenia Range (Turkish: Beşparmak doğa koruyucuları)\n\nTeachers, foresters and hunters who know the Kyrenia range, the Five Finger Mountains, worry about forest fires, quarrying and the loss of wildlife in the island's north. They also care for the turtle beaches and wetlands of the Karpas peninsula.\n\nThey form a loose network of nature lovers rather than a political force, but they argue that the community's land is its most precious inheritance. In a time of conflict, their call to protect forests, coasts and water finds sympathy but little action."
 COLDWAR_NCY_1970_party_17_icon:0 "£generic_Neutral_green_small"
 COLDWAR_NCY_1970_party_18_v1:0 "£NCY_neutral_Social (TKP) - Communal Liberation Party"
 COLDWAR_NCY_1970_party_18:0 "£generic_neutral_Social_small Cemaatçi sosyal demokrat çevreler"
 COLDWAR_NCY_1970_party_18_v1_desc:0 "(Social Democracy) - Communal Liberation Party (Turkish: Toplumcu Kurtuluş Partisi, TKP)\n\nFounded on 18 March 1976 under the leadership of Alpay Durduran, the Communal Liberation Party offers a social-democratic alternative to Rauf Denktaş's National Unity Party. It won six seats in its first election that year and speaks for teachers, civil servants and the younger generation.\n\nThe party draws on communal social democracy and supports a federal settlement with the Greek Cypriots. Its later leaders, İsmail Bozkurt and Mustafa Akıncı, the long-serving mayor of the Turkish part of Nicosia, carry this line forward."
 COLDWAR_NCY_1970_party_18_desc:0 "(Social Democracy) - Communal Social Democratic Circles (Turkish: Cemaatçi sosyal demokrat çevreler)\n\nAmong Turkish Cypriot professionals, teachers and trade unionists, a social-democratic current advocates welfare, workers' rights and dialogue with the Greek Cypriots. Its members draw inspiration from the left-of-centre turn of Turkey's Republican People's Party.\n\nBefore an organized party exists, they work as independents, in unions and in the press. They want a democratic communal administration and a federal settlement that would allow Turkish Cypriots to live in peace and prosperity across the whole island."
 COLDWAR_NCY_1970_party_18_v1_icon:0 "£NCY_neutral_Social"
 COLDWAR_NCY_1970_party_18_icon:0 "£generic_neutral_Social_small"
 COLDWAR_NCY_1970_party_19:0 "£generic_Neutral_Communism_small Bağımsız emekçi sol çevreleri"
 COLDWAR_NCY_1970_party_19_desc:0 "(Independent Socialism) - Independent Labour Left Circles (Turkish: Bağımsız emekçi sol çevreleri)\n\nSome Turkish Cypriot workers and intellectuals reject both the nationalist leadership and the pro-Soviet line of AKEL. Influenced by the Workers' Party of Turkey and the new left, they seek an independent socialist voice for their community.\n\nThey organize in trade unions, student groups and small journals, calling for workers' rights, land for refugees and an end to foreign military bases. Their numbers are small and their activities closely watched, but they represent a growing restlessness among the young."
 COLDWAR_NCY_1970_party_19_icon:0 "£generic_Neutral_Communism_small"
 COLDWAR_NCY_1970_party_20:0 "£generic_Nat_Populism_small Millî dayanışma çevreleri"
 COLDWAR_NCY_1970_party_20_desc:0 "(National Populism) - National Solidarity Circles (Turkish: Millî dayanışma çevreleri)\n\nRefugee associations, veterans and nationalist clubs keep alive the memory of the fighting of 1963 and the siege of the enclaves. They speak for the many who lost homes and relatives and demand that the leadership never compromise on security.\n\nThis populist current denounces corruption and privilege among the community's elite, calling for jobs, housing and aid to be shared fairly. It looks to Turkey as the motherland and is ready to rally behind any leader who promises strength."
 COLDWAR_NCY_1970_party_20_icon:0 "£generic_Nat_Populism_small"
 COLDWAR_NCY_1970_party_21:0 "£generic_Nat_Fascism_small Turancı radikal akım"
 COLDWAR_NCY_1970_party_21_desc:0 "(Pan-Turkist Ultranationalism) - Radical Turanist Current (Turkish: Turancı radikal akım)\n\nYoung Turkish Cypriot militants influenced by Alparslan Türkeş and the Idealist Hearths of Turkey see their island as a bastion of the Turkic world. They call for partition, union with Turkey and the dream of a Great Turan uniting all Turks.\n\nMore radical than the official leadership, they regard any compromise with the Greek Cypriots as treason and admire the discipline of armed struggle. In 1970 they are a small, fervent current within the youth and the resistance organization."
 COLDWAR_NCY_1970_party_21_icon:0 "£generic_Nat_Fascism_small"
 COLDWAR_NCY_1970_party_22_v1:0 "£generic_Nat_Autocracy_small (GKK) - Security Forces Command"
 COLDWAR_NCY_1970_party_22:0 "£generic_Nat_Autocracy_small (TMT) - Turkish Resistance Organisation"
 COLDWAR_NCY_1970_party_22_v1_desc:0 "(Military Nationalism) - Security Forces Command (Turkish: Güvenlik Kuvvetleri Komutanlığı, GKK)\n\nEstablished on 1 August 1976, the Security Forces Command unites the Turkish Cypriot fighters of the former resistance organization into a regular force alongside the Turkish army corps stationed in the north since 1974. Its commanders are seconded officers of the Turkish army.\n\nThe command guards the ceasefire line and trains the conscripts of the Turkish Federated State. It answers to Ankara as much as to the civilian authorities in Nicosia, and in a crisis its officers could claim the right to govern directly."
 COLDWAR_NCY_1970_party_22_desc:0 "(Military Nationalism) - Turkish Resistance Organisation (Turkish: Türk Mukavemet Teşkilatı, TMT)\n\nFounded in 1958 to counter EOKA and to pursue partition, the Turkish Resistance Organisation is the armed backbone of the Turkish Cypriot community. Officers of the Turkish army serve as its Bayraktar commanders, while local Turkish Cypriots fill its fighting units in the enclaves.\n\nThe organization guards the enclave lines, recruits the youth and polices dissent within the community. Its leaders take their orders ultimately from Ankara, and in a crisis they could set aside the civilian administration and rule the community directly."
 COLDWAR_NCY_1970_party_22_v1_icon:0 "£generic_Nat_Autocracy_small"
 COLDWAR_NCY_1970_party_22_icon:0 "£generic_Nat_Autocracy_small"
 COLDWAR_NCY_1970_party_23:0 "£generic_Monarchist_small Osmanlı hanedanı taraftarları"
 COLDWAR_NCY_1970_party_23_desc:0 "(Ottoman Monarchism) - Supporters of the Ottoman Dynasty (Turkish: Osmanlı hanedanı taraftarları)\n\nCyprus was Ottoman for three centuries until 1878, and in a few old Turkish Cypriot families pride in that past remains strong. They keep portraits of the sultans and the memory of the empire that once protected the island's Muslims.\n\nA handful among them dream of a restored dynasty, perhaps as a symbolic crown over a reunited Turkish world. In the hard realities of the enclaves, this nostalgia has no organization, but it gives voice to a sense of lost greatness."
 COLDWAR_NCY_1970_party_23_icon:0 "£generic_Monarchist_small"
