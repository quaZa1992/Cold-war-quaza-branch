 COLDWAR_CYP_1970_p2_finance_a_follow:0 "Independent Audits and Contract Enforcement"
 COLDWAR_CYP_1970_p2_finance_a_follow_desc:0 "Independent audits and enforceable contracts make an investment opening credible. Their value lies in fair treatment even when scrutiny becomes inconvenient to the government or its most influential commercial partners."
 COLDWAR_CYP_1970_p2_finance_a_follow_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nBureaucracy cost multiplier: -5%."
