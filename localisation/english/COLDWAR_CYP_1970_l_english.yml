 COLDWAR_CYP_1970_p3_mandate:0 "EDEK's Democratic Mandate"
 COLDWAR_CYP_1970_p3_mandate_desc:0 "EDEK's democratic mandate combines social reform with the defence of an independent republic. Its government must decide how public provision and cooperative initiative can give that commitment a practical economic base."
