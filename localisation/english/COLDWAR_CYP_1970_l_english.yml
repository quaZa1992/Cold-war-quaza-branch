 COLDWAR_CYP_1970_p3_first_b_desc:0 "Cooperative self-help places more responsibility with organised workers and local communities. It can widen participation while leaving the state to support institutions that cannot be directed as ordinary ministries."
 COLDWAR_CYP_1970_p3_first_b_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed buildings: +4%."
 COLDWAR_CYP_1970_p3_follow_a:0 "Community Health Clinics"
 COLDWAR_CYP_1970_p3_follow_a_desc:0 "Community health clinics can bring basic care closer to households outside the strongest service centres. Their success depends on trained staff and supplies that remain available after the opening ceremony."
