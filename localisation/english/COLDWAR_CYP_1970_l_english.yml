 COLDWAR_CYP_1970_p2_national_programme:0 "A Mediterranean Commercial Republic"
 COLDWAR_CYP_1970_p2_national_programme_desc:0 "A Mediterranean commercial republic must provide institutions that enterprises can use confidently. Bringing law, finance and skills together will give its outward-looking programme a stronger domestic foundation."
