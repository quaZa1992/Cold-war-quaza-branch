 COLDWAR_CYP_1970_tc_protocol_desc:0 "Choose between joint services or a negotiated decentralised service arrangement. Hardline governments can open talks here, but receive no access relief until they actually implement safeguards."
 COLDWAR_CYP_1970_tc_protocol_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes."
