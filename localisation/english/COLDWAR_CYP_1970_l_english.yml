 COLDWAR_NCY_1970_denktas_desc:0 "Communal representative; head of the Turkish Cypriot administration from 28 February 1973. The presidency is distinct from the UBP premiership."
 COLDWAR_NCY_1970_berberoglu:0 "Ahmet Mithat Berberoğlu"
 COLDWAR_NCY_1970_berberoglu_desc:0 "CTP founder and first chair, 1970–1976."
 COLDWAR_NCY_1970_ozgur:0 "Özker Özgür"
 COLDWAR_NCY_1970_ozgur_desc:0 "Founding assembly member in 1975 and CTP chair from 1976 to 1996."
 COLDWAR_NCY_1970_durduran:0 "Alpay Durduran"
 COLDWAR_NCY_1970_durduran_desc:0 "Founding assembly member and founding TKP chair, 1976–1983."
 COLDWAR_NCY_1970_bozkurt:0 "İsmail Bozkurt"
 COLDWAR_NCY_1970_bozkurt_desc:0 "Turkish Cypriot parliamentarian and later TKP chair, 1983–1987."
 COLDWAR_NCY_1970_akinci:0 "Mustafa Akıncı"
 COLDWAR_NCY_1970_akinci_desc:0 "Nicosia municipal politician from 1976 and TKP chair from 1987. This is not the later TDP or presidential office."
 COLDWAR_NCY_1970_konuk:0 "Nejat Konuk"
 COLDWAR_NCY_1970_konuk_desc:0 "Early head of government and UBP chair; subsequently associated with the Democratic People's Party. He is not substituted for the president."
 COLDWAR_NCY_1970_orek:0 "Osman Örek"
 COLDWAR_NCY_1970_orek_desc:0 "Former Republic of Cyprus defence minister, senior Turkish Cypriot administrator and 1978 prime minister."
 COLDWAR_NCY_1970_cagatay:0 "Mustafa Çağatay"
 COLDWAR_NCY_1970_cagatay_desc:0 "Turkish Cypriot parliamentarian from July 1970 and later head of government, 1978–1983."
 COLDWAR_NCY_1970_eroglu:0 "Derviş Eroğlu"
 COLDWAR_NCY_1970_eroglu_desc:0 "UBP parliamentarian from 1976, later party chair and prime minister. His Cold War cabinet role is distinct from his later presidency."
 COLDWAR_NCY_1970_kazandag:0 "Rüştü Kazandağ"
 COLDWAR_NCY_1970_kazandag_desc:0 "TMT Bayraktar: a Turkish officer commanding local Turkish Cypriot forces. Approximate availability follows a reported handover month; it is not an appointment-day claim. Not a GKK post or an invasion-corps command."
