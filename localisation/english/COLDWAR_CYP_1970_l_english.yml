 COLDWAR_CYP_1970_tc_joint_budgets_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nStability: +4%.\nBureaucracy cost multiplier: +3%.\nImplement a joint-services compact and stage 3 normalisation; remove the initial access and parallel-administration penalties. Civilian harm requires separate restitution."
