 COLDWAR_NCY_1970_gkk_1976:0 "Hayri Ündül"
 COLDWAR_NCY_1970_gkk_1976_desc:0 "Historical GKK commander, 1976–1978. Available from the documented year; later recruitment does not claim a January appointment. The GKK was established on 1 August 1976. Strategic skills are balance values."
 COLDWAR_NCY_1970_gkk_1978:0 "Atilla Erdoğan"
