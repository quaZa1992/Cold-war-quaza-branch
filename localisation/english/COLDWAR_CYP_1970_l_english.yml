 COLDWAR_NCY_1970_civic:0 "Civic Organizer"
 COLDWAR_NCY_1970_diplomat:0 "Communal Negotiator"
 COLDWAR_NCY_1970_administrator:0 "Experienced Administrator"
 COLDWAR_NCY_1970_political_dossier:0 "Turkish Cypriot Administration"
 COLDWAR_NCY_1970_political_dossier_desc:0 "Manage the local leadership without changing party popularity or forcing a constitutional settlement."
 COLDWAR_NCY_1970_leadership_review:0 "Convene a Leadership Review"
 COLDWAR_NCY_1970_leadership_review_desc:0 "A new historical leadership generation is available for the current political current. Adopt its contemporary representative, or retain the incumbent for roleplay. This does not change the governing party, call an election or grant any reward."
 COLDWAR_CYP_1970_shortcut_constitution:0 "The Republic and the Cyprus Question"
 COLDWAR_CYP_1970_shortcut_economy:0 "An Island Economy"
 COLDWAR_CYP_1970_shortcut_military:0 "Defending a Small Republic"
 COLDWAR_CYP_1970_shortcut_diplomacy:0 "Between the Guarantors and the Blocs"
 COLDWAR_CYP_1970_shortcut_aftermath:0 "Crisis, Partition and Recovery"
 COLDWAR_CYP_1970_shortcut_party_1:0 "Makarios: An Independent Developmental Republic"
 COLDWAR_CYP_1970_shortcut_party_2:0 "Clerides: A Commercial and Constitutional Republic"
 COLDWAR_CYP_1970_shortcut_party_3:0 "EDEK: A Democratic Social Republic"
 COLDWAR_CYP_1970_shortcut_party_4:0 "AKEL: Labour, Industry and Independence"
 COLDWAR_CYP_1970_shortcut_party_20:0 "The Progressive Front: A Civilian Enosis Mandate"
 COLDWAR_CYP_1970_shortcut_party_22:0 "The Enosis Coup and Security Regime"
 COLDWAR_CYP_1970_shortcut_turkish_cypriots:0 "The Turkish Cypriot Community"
 COLDWAR_CYP_1970_shortcut_road_to_war:0 "The Road to the Cyprus War"
 COLDWAR_CYP_1970_republic_at_ten:0 "The Republic at Ten"
 COLDWAR_CYP_1970_republic_at_ten_desc:0 "The republic enters its second decade with a damaged constitutional partnership and a contested chain of command. Makarios must preserve independence while bringing divided public services and communal relations onto a more durable footing."
 COLDWAR_CYP_1970_republic_at_ten_effect_tt:0 "Political power: +50."
 COLDWAR_CYP_1970_intercommunal_talks:0 "Keep the Intercommunal Talks Alive"
 COLDWAR_CYP_1970_intercommunal_talks_desc:0 "Talks offer the two communities a means of resolving questions that security measures cannot settle. Keeping them alive requires recognised interlocutors and enough practical progress to justify continued participation."
 COLDWAR_CYP_1970_intercommunal_talks_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nCommunal tension: -5 points (0–100).\nSettlement progress: +10 points (0–100)."
 COLDWAR_CYP_1970_command_review:0 "Review the Security Apparatus"
 COLDWAR_CYP_1970_command_review_desc:0 "The presidency, police and National Guard do not share an uncontested understanding of authority. Reviewing their responsibilities will expose loyalties that threaten to turn a security problem into a struggle for the government itself."
 COLDWAR_CYP_1970_command_review_effect_tt:0 "Political power: +25."
 COLDWAR_CYP_1970_safe_passage:0 "Consolidate Safe Civilian Passage"
 COLDWAR_CYP_1970_safe_passage_desc:0 "Civilian movement should not depend on the discretion of every armed post. Reciprocal passage arrangements can restore ordinary economic contact and give negotiations a practical result that families can use."
 COLDWAR_CYP_1970_safe_passage_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nCommunal tension: -10 points (0–100).\nSettlement progress: +10 points (0–100).\nAdvance reciprocal civilian access to stage 1; partially replace the initial movement and administration penalties."
 COLDWAR_CYP_1970_checkpoint_leverage:0 "Retain Checkpoints as Leverage"
 COLDWAR_CYP_1970_checkpoint_leverage_desc:0 "Checkpoints give the authorities an instrument of political pressure. Retaining that leverage will preserve control over movement while adding to the costs and distrust that divide daily life on the island."
 COLDWAR_CYP_1970_checkpoint_leverage_effect_tt:0 "Political power: +40.\nCommunal tension: +10 points (0–100).\nPolice cost multiplier: +5%."
 COLDWAR_CYP_1970_joint_services:0 "Restore Shared Municipal Services"
 COLDWAR_CYP_1970_joint_services_desc:0 "Water, sanitation and other municipal needs cannot wait for a final constitutional agreement. Shared services can reduce the burden of parallel administration and give communities experience of cooperation with visible benefits."
 COLDWAR_CYP_1970_joint_services_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSettlement progress: +10 points (0–100).\nBureaucracy cost multiplier: +5%.\nAdvance shared services to stage 2, further reducing the initial movement and administration penalties."
 COLDWAR_CYP_1970_civil_rights_commission:0 "A Bicommunal Rights Commission"
 COLDWAR_CYP_1970_civil_rights_commission_desc:0 "A bicommunal commission can give complaints a recognised hearing beyond each community's own institutions. Its authority will depend on fair access and the willingness of officials to face uncomfortable findings."
 COLDWAR_CYP_1970_civil_rights_commission_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSettlement progress: +10 points (0–100).\nStability: +2%."
 COLDWAR_CYP_1970_civilian_command:0 "A Civilian Chain of Command"
 COLDWAR_CYP_1970_civilian_command_desc:0 "The elected government must determine the political direction of the island's security forces. A civilian chain of command will require officers to distinguish their military duties from allegiance to external patrons or domestic factions."
 COLDWAR_CYP_1970_civilian_command_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nPolitical power: -25.\nPolitical power: -5% for 180 days."
 COLDWAR_CYP_1970_foreign_officers:0 "Retain Mainland Officers"
 COLDWAR_CYP_1970_foreign_officers_desc:0 "Mainland officers bring experience and a familiar command structure to the National Guard. Retaining them also preserves a difficult division of loyalties that the presidency must manage rather than ignore."
 COLDWAR_CYP_1970_foreign_officers_effect_tt:0 "Communal tension: +5 points (0–100).\nArmy org: +3%.\nForeign influence defense: -5%.\nReplace the divided-command spirit with a transitional penalty: army organisation −2.5%, maximum planning −2.5%."
 COLDWAR_CYP_1970_police_oversight:0 "An Accountable Police Force"
 COLDWAR_CYP_1970_police_oversight_desc:0 "An accountable police force must enforce the law without becoming the instrument of a political network. Professional oversight can strengthen civilian authority and reduce the room for competing commands."
 COLDWAR_CYP_1970_police_oversight_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nPolice cost multiplier: -5%.\nRemove the original divided-command and transitional command penalties; implement civilian command."
 COLDWAR_CYP_1970_emergency_powers:0 "Emergency Security Powers"
 COLDWAR_CYP_1970_emergency_powers_desc:0 "Emergency powers offer the executive faster means of responding to danger. They also widen discretion over detention and public life, making exceptional security measures a continuing test of the republic's legitimacy."
 COLDWAR_CYP_1970_emergency_powers_effect_tt:0 "Political power: +40.\nCommunal tension: +10 points (0–100).\nPolitical power: +5% for 365 days.\nPolice cost multiplier: +10% for 365 days."
 COLDWAR_CYP_1970_bicomm_constitution:0 "Negotiate Bicommunal Safeguards"
 COLDWAR_CYP_1970_bicomm_constitution_desc:0 "Bicommunal safeguards must answer real fears about representation and security. Negotiating them will require the majority to accept enforceable limits and communal leaders to defend compromise before their supporters."
 COLDWAR_CYP_1970_bicomm_constitution_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nSettlement progress: +15 points (0–100)."
 COLDWAR_CYP_1970_unitary_constitution:0 "Press for a Unitary Constitution"
 COLDWAR_CYP_1970_unitary_constitution_desc:0 "A unitary constitution promises a stronger common administration and clearer central authority. Its advocates must confront the fear that majority rule would leave the smaller community without effective protection."
 COLDWAR_CYP_1970_unitary_constitution_effect_tt:0 "The communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nPolitical power: +50.\nCommunal tension: +15 points (0–100).\nBureaucracy cost multiplier: -5%."
 COLDWAR_CYP_1970_federal_compromise:0 "A Federal Compromise"
 COLDWAR_CYP_1970_federal_compromise_desc:0 "A federal arrangement could combine a common state with protected communal authority. Its viability depends on agreement over responsibilities, resources and guarantees rather than the name given to the constitution."
 COLDWAR_CYP_1970_federal_compromise_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nStability: +5%.\nBureaucracy cost multiplier: +8%."
 COLDWAR_CYP_1970_shared_republic:0 "Restore the Shared Republic"
 COLDWAR_CYP_1970_shared_republic_desc:0 "Restoring a shared republic would rebuild cooperation within common institutions. The terms must offer both communities a credible place in government and procedures capable of handling their future disagreements."
 COLDWAR_CYP_1970_shared_republic_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nStability: +4%.\nPolitical power: +3%."
 COLDWAR_CYP_1970_constitutional_settlement:0 "An Agreed Constitutional Settlement"
 COLDWAR_CYP_1970_constitutional_settlement_desc:0 "A constitutional settlement becomes meaningful when its participants accept and implement the same terms. Common authority must rest on practical guarantees and public services as well as signatures at a conference."
 COLDWAR_CYP_1970_constitutional_settlement_effect_tt:0 "Settlement progress: +10 points (0–100).\nRemove the constitutional-breakdown starting spirit, implement stage 3 normalisation and record the agreed peaceful settlement."
 COLDWAR_CYP_1970_ban_armed_factions:0 "Disarm the Political Militias"
 COLDWAR_CYP_1970_ban_armed_factions_desc:0 "Political militias compete with the institutions meant to protect the public. Disarming them can strengthen civilian government, but requires the authorities to confront supporters who claim their weapons defend the national cause."
 COLDWAR_CYP_1970_ban_armed_factions_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nPolitical power: -25.\nCommunal tension: -5 points (0–100).\nDisarm domestic militias; reduce coup pressure by a further 10 points."
 COLDWAR_CYP_1970_tolerate_armed_factions:0 "Tolerate Loyal Armed Networks"
 COLDWAR_CYP_1970_tolerate_armed_factions_desc:0 "Loyal armed networks may appear useful when the government distrusts parts of its own security apparatus. Tolerating them also gives organised factions an independent claim to force and political influence."
 COLDWAR_CYP_1970_tolerate_armed_factions_effect_tt:0 "Political power: +50.\nCommunal tension: +10 points (0–100).\nArmy org: -3%.\nPolitical power: +3%."
 COLDWAR_CYP_1970_reject_reprisals:0 "Forbid Collective Reprisals"
 COLDWAR_CYP_1970_reject_reprisals_desc:0 "Collective punishment would turn civilian communities into targets for the actions of armed groups. A firm prohibition gives police and military commands a clear duty to distinguish offenders from the people around them."
 COLDWAR_CYP_1970_reject_reprisals_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nCommunal tension: -10 points (0–100).\nStability: +2%."
 COLDWAR_CYP_1970_collective_reprisals:0 "Authorise Collective Reprisals"
 COLDWAR_CYP_1970_collective_reprisals_desc:0 "Collective reprisals abandon the distinction between armed opponents and civilians. Detention, expulsions and destroyed livelihoods will deepen displacement and make any later settlement depend on restitution and accountability."
 COLDWAR_CYP_1970_collective_reprisals_effect_tt:0 "Political power: +25.\nStability: -5%.\nCommunal tension: +20 points (0–100).\nPolice cost multiplier: +15%.\nCreate a displacement emergency and damaged communities in Cyprus-controlled states; reopen the crisis and invalidate prior communal constitutional and union consent."
 COLDWAR_CYP_1970_crisis_conference:0 "Convene an Emergency Conference"
 COLDWAR_CYP_1970_crisis_conference_desc:0 "An emergency conference can bring security demands and political fears into a common discussion. Participants need terms they can accept rather than another occasion for rival declarations of sovereignty."
 COLDWAR_CYP_1970_crisis_conference_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to GRE, TUR, ENG. Conditional benefits require an explicit accepted response; silence provides no agreement.\nCommunal tension: -10 points (0–100)."
 COLDWAR_CYP_1970_independence_mandate:0 "Renew the Mandate for Independence"
 COLDWAR_CYP_1970_independence_mandate_desc:0 "Independence needs a political mandate capable of surviving both communal distrust and outside pressure. Renewing that commitment will place the republic's continued existence at the centre of the government's programme."
 COLDWAR_CYP_1970_independence_mandate_effect_tt:0 "Foreign influence defense: +5%."
 COLDWAR_CYP_1970_development_survey:0 "Survey the Island Economy"
 COLDWAR_CYP_1970_development_survey_desc:0 "Tourism, farming and small enterprise offer different opportunities across the island. A development survey will identify the skills and infrastructure needed to broaden the economy without mistaking every proposal for a viable project."
 COLDWAR_CYP_1970_development_survey_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nPolitical power: +25."
 COLDWAR_CYP_1970_development_budget:0 "A Funded Development Budget"
 COLDWAR_CYP_1970_development_budget_desc:0 "A development budget must distinguish continuing public obligations from projects that can be financed now. Clear priorities will help a small administration support investment without promising more than the island can sustain."
 COLDWAR_CYP_1970_development_budget_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nBureaucracy cost multiplier: -3%."
 COLDWAR_CYP_1970_tourism_priority:0 "Make Tourism the Growth Engine"
 COLDWAR_CYP_1970_tourism_priority_desc:0 "Tourism offers foreign earnings and employment to coastal communities. Making it the growth engine will draw infrastructure and credit towards visitors while increasing exposure to external demand and political uncertainty."
 COLDWAR_CYP_1970_tourism_priority_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nOffice park income tax: +5%.\nMdcw cw market exposure: +5%."
 COLDWAR_CYP_1970_productive_diversification:0 "Diversify beyond Tourism"
 COLDWAR_CYP_1970_productive_diversification_desc:0 "A broader productive base can give Cyprus opportunities beyond the visitor economy. Supporting processing, workshops and local suppliers will take time, but can spread employment and reduce dependence on one source of demand."
 COLDWAR_CYP_1970_productive_diversification_effect_tt:0 "Fund the programme with 2% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProduction speed industrial complex: +5%.\nProduction speed offices: -3%."
 COLDWAR_CYP_1970_coastal_hotels:0 "Support Coastal Hotels"
 COLDWAR_CYP_1970_coastal_hotels_desc:0 "Coastal hotels need access, utilities and dependable suppliers as well as buildings. Public support should create destinations capable of earning their keep rather than a succession of speculative developments."
 COLDWAR_CYP_1970_coastal_hotels_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nOffice park income tax: +3%."
 COLDWAR_CYP_1970_small_business:0 "Local Guesthouses and Suppliers"
 COLDWAR_CYP_1970_small_business_desc:0 "Guesthouses and local suppliers can retain more visitor spending within their communities. Smaller enterprises need suitable credit and services if they are to participate alongside the largest coastal investments."
 COLDWAR_CYP_1970_small_business_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nStability: +2%."
 COLDWAR_CYP_1970_irrigation:0 "Rural Water and Irrigation"
 COLDWAR_CYP_1970_irrigation_desc:0 "Rural water determines what farmers can produce and how reliably they can plan. Irrigation improvements will give agricultural investment a firmer basis while requiring the careful allocation of scarce local resources."
 COLDWAR_CYP_1970_irrigation_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nOne 25% research bonus in the relevant existing technology category."
 COLDWAR_CYP_1970_light_workshops:0 "Food Processing and Workshops"
 COLDWAR_CYP_1970_light_workshops_desc:0 "Food processing and repair workshops can build on skills and demand already present on the island. Supporting those activities offers a practical route towards diversification without assuming a large heavy-industrial economy."
 COLDWAR_CYP_1970_light_workshops_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nIndustrial capacityy: +3%."
 COLDWAR_CYP_1970_transport_plan:0 "Roads between Towns and Ports"
 COLDWAR_CYP_1970_transport_plan_desc:0 "Roads between towns, farms and ports connect the island's separate markets. A transport plan will help producers reach customers and make public investment useful beyond the immediate site of construction."
 COLDWAR_CYP_1970_transport_plan_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProduction speed infrastructure: +8%."
 COLDWAR_CYP_1970_famagusta_port:0 "The Port of Famagusta"
 COLDWAR_CYP_1970_famagusta_port_desc:0 "Famagusta connects productive districts to overseas trade. Extending its facilities requires secure access and sustained investment, while leaving the government responsible for the transport and services that make a port useful."
 COLDWAR_CYP_1970_famagusta_port_effect_tt:0 "Fund the programme with 2% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nQueue one naval-base level in Famagusta. Construction and upkeep remain payable through the normal economy."
 COLDWAR_CYP_1970_limassol_port:0 "Develop Limassol Alternatives"
 COLDWAR_CYP_1970_limassol_port_desc:0 "Developing alternatives at Limassol can reduce reliance on one commercial gateway. The programme must connect port capacity to domestic transport and firms able to use it."
 COLDWAR_CYP_1970_limassol_port_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProduction speed naval base: +10%."
 COLDWAR_CYP_1970_vocational_schools:0 "Technical and Vocational Schools"
 COLDWAR_CYP_1970_vocational_schools_desc:0 "An island development programme needs technicians, clerks and skilled tradespeople. Vocational schools can widen opportunity while giving enterprises a local source of skills they would otherwise struggle to obtain."
 COLDWAR_CYP_1970_vocational_schools_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nResearch speed: +2%.\nEducation cost multiplier: +3%."
 COLDWAR_CYP_1970_credit_question:0 "The Credit Question"
 COLDWAR_CYP_1970_credit_question_desc:0 "The source of investment finance will shape who can develop and on what terms. Cyprus must weigh the reach of outside capital against institutions drawing on domestic savings and community knowledge."
 COLDWAR_CYP_1970_credit_question_effect_tt:0 "Political power: +25."
 COLDWAR_CYP_1970_foreign_capital:0 "Invite Foreign Capital"
 COLDWAR_CYP_1970_foreign_capital_desc:0 "Foreign investors can bring funds and commercial connections beyond the island's own resources. The government must offer credible terms while retaining the capacity to defend public interests and enforce its agreements."
 COLDWAR_CYP_1970_foreign_capital_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nReceiving investment cost: -8%.\nForeign influence defense: -5%."
 COLDWAR_CYP_1970_cooperative_credit:0 "Strengthen Cooperative Credit"
 COLDWAR_CYP_1970_cooperative_credit_desc:0 "Cooperative lenders can make local knowledge useful to borrowers overlooked by larger institutions. Their members' savings need competent management and safeguards against lending driven by personal obligation."
 COLDWAR_CYP_1970_cooperative_credit_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nInterest rate multiplier: -0.15 interest points.\nBureaucracy cost multiplier: +3%."
 COLDWAR_CYP_1970_transparent_accounts:0 "Publish Public Accounts"
 COLDWAR_CYP_1970_transparent_accounts_desc:0 "Published accounts allow citizens and lenders to judge what the government has promised. Transparency will make development commitments easier to scrutinise and reduce the room for expenses hidden behind political discretion."
 COLDWAR_CYP_1970_transparent_accounts_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nBureaucracy cost multiplier: -3%."
 COLDWAR_CYP_1970_village_banks:0 "Village Cooperative Banks"
 COLDWAR_CYP_1970_village_banks_desc:0 "Village cooperative banks can bring financial services closer to rural households and producers. Their expansion must be matched by sound administration if confidence in local savings is to endure."
 COLDWAR_CYP_1970_village_banks_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nStability: +2%."
 COLDWAR_CYP_1970_energy_security:0 "Electricity and Imported Fuel"
 COLDWAR_CYP_1970_energy_security_desc:0 "Electricity supply ties domestic activity to imported fuel and a limited network of facilities. Improving security requires both dependable operation at home and a realistic account of the island's external dependence."
 COLDWAR_CYP_1970_energy_security_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nFuel gain: +3%."
 COLDWAR_CYP_1970_industrial_estate:0 "A Modest Industrial Estate"
 COLDWAR_CYP_1970_industrial_estate_desc:0 "A modest industrial estate can give small firms access to shared infrastructure and a suitable location. Its scale should match the workers, suppliers and markets available to the island's developing industries."
 COLDWAR_CYP_1970_industrial_estate_effect_tt:0 "Fund the programme with 3% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProduction speed industrial complex: +2%."
 COLDWAR_CYP_1970_services_network:0 "A Services and Shipping Network"
 COLDWAR_CYP_1970_services_network_desc:0 "Shipping and commercial services can link Cypriot expertise to a wider market. A stronger network will need trained staff and dependable institutions rather than rely on location alone."
 COLDWAR_CYP_1970_services_network_effect_tt:0 "Fund the programme with 2% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nOffice park income tax: +3%."
 COLDWAR_CYP_1970_balanced_development:0 "A Viable Island Economy"
 COLDWAR_CYP_1970_balanced_development_desc:0 "A viable island economy must connect tourism and services to rural livelihoods and local production. Consolidating those links can reduce the narrowness that makes external disruption so costly."
 COLDWAR_CYP_1970_balanced_development_effect_tt:0 "Remove the Narrow Economic Base starting spirit."
 COLDWAR_CYP_1970_guard_review:0 "Review the National Guard"
 COLDWAR_CYP_1970_guard_review_desc:0 "The National Guard must be assessed against the island's actual security needs. Its formations and equipment cannot compensate for uncertain authority, uneven training or commitments beyond the resources available."
 COLDWAR_CYP_1970_guard_review_effect_tt:0 "Political power: +25."
 COLDWAR_CYP_1970_force_structure:0 "A Force the Island Can Sustain"
 COLDWAR_CYP_1970_force_structure_desc:0 "A sustainable force must fit the population, budget and support capacity of Cyprus. Choosing its structure will determine which missions can be performed reliably rather than promised on paper."
 COLDWAR_CYP_1970_force_structure_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nPolitical power: +25."
 COLDWAR_CYP_1970_territorial_defence:0 "Territorial Defence"
 COLDWAR_CYP_1970_territorial_defence_desc:0 "Territorial defence draws on local knowledge and prepared positions. The approach can make limited forces harder to dislodge while placing a premium on coordination and dependable civilian support."
 COLDWAR_CYP_1970_territorial_defence_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nArmy defence: +5%.\nArmy attack: -3%."
 COLDWAR_CYP_1970_mobile_reserve:0 "A Small Mobile Reserve"
 COLDWAR_CYP_1970_mobile_reserve_desc:0 "A small mobile reserve offers the ability to reinforce threatened areas. Its usefulness depends on transport and communications that can turn a central plan into timely movement."
 COLDWAR_CYP_1970_mobile_reserve_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nArmy org: +2%.\nSupply consumption: +3%."
 COLDWAR_CYP_1970_village_defence:0 "Defensive Positions and Signals"
 COLDWAR_CYP_1970_village_defence_desc:0 "Defensive positions and signals can help local units cooperate under pressure. Preparing them must serve a common command rather than allow village security to become another armed political network."
 COLDWAR_CYP_1970_village_defence_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nDig in speed: +8%."
 COLDWAR_CYP_1970_reserve_medical:0 "Reserve Medical Services"
 COLDWAR_CYP_1970_reserve_medical_desc:0 "Reserve medical services give mobilisation a practical humanitarian foundation. Trained staff and supplies will protect personnel and reduce the disruption that untreated casualties impose on small formations."
 COLDWAR_CYP_1970_reserve_medical_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nArmy org: +2%."
 COLDWAR_CYP_1970_transport_pool:0 "A Shared Transport Pool"
 COLDWAR_CYP_1970_transport_pool_desc:0 "A shared transport pool can make scarce vehicles more useful to the whole force. Common assignments and maintenance will matter when several commands seek movement at the same time."
 COLDWAR_CYP_1970_transport_pool_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nOne 25% research bonus in the relevant existing technology category."
 COLDWAR_CYP_1970_small_arms:0 "Standardise Small Arms"
 COLDWAR_CYP_1970_small_arms_desc:0 "Too many different small-arms systems burden training and supply. Standardisation can make equipment easier to maintain and give recruits a more consistent practical foundation."
 COLDWAR_CYP_1970_small_arms_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nOne 25% research bonus in the relevant existing technology category."
 COLDWAR_CYP_1970_training_standards:0 "Common Training Standards"
 COLDWAR_CYP_1970_training_standards_desc:0 "Common standards allow units with different origins and instructors to work together. Establishing them will make preparation more dependable without confusing political loyalty with military proficiency."
 COLDWAR_CYP_1970_training_standards_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nTraining time army: -5%."
 COLDWAR_CYP_1970_greek_mission:0 "Request a Greek Training Mission"
 COLDWAR_CYP_1970_greek_mission_desc:0 "A Greek training mission can offer useful expertise if its remit is agreed clearly. Cooperation must strengthen the Guard's skills without leaving civilian authority uncertain about the mission's political limits."
 COLDWAR_CYP_1970_greek_mission_effect_tt:0 "Send a proposal to GRE. Conditional benefits require an explicit accepted response; silence provides no agreement.\nArmy org: +2%.\nForeign influence defense: -5%."
 COLDWAR_CYP_1970_independent_procurement:0 "Diversify Military Procurement"
 COLDWAR_CYP_1970_independent_procurement_desc:0 "A wider range of suppliers can reduce dependence on a single patron. Procurement still has to account for incompatible equipment, support and the limited resources available to maintain it."
 COLDWAR_CYP_1970_independent_procurement_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nOne 25% research bonus in the relevant existing technology category."
 COLDWAR_CYP_1970_air_defence:0 "Ground-Based Air Defence"
 COLDWAR_CYP_1970_air_defence_desc:0 "Ground-based air defence offers protection without the full demands of a large air force. Training, communications and technical support must accompany the equipment if that protection is to be credible."
 COLDWAR_CYP_1970_air_defence_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nOne 25% research bonus in the relevant existing technology category."
 COLDWAR_CYP_1970_air_ambulance:0 "Air Observation and Evacuation"
 COLDWAR_CYP_1970_air_ambulance_desc:0 "Observation and evacuation give limited aviation resources a practical role. Preparing crews and support for those tasks can improve information and medical response without promising control of the air."
 COLDWAR_CYP_1970_air_ambulance_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nArmy org: +1%."
 COLDWAR_CYP_1970_coast_watch:0 "Coast Watch and Harbour Patrols"
 COLDWAR_CYP_1970_coast_watch_desc:0 "Coastal observation and harbour patrols can improve warning and protect everyday maritime activity. Their value lies in regular coverage and communication rather than the appearance of a fleet Cyprus cannot maintain."
 COLDWAR_CYP_1970_coast_watch_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nNaval detection: +5%."
 COLDWAR_CYP_1970_civil_defence:0 "Civil Defence without Militarising Society"
 COLDWAR_CYP_1970_civil_defence_desc:0 "Civil defence should prepare households and public services for danger without placing ordinary life under permanent military control. Practical instruction and local organisation can improve resilience while preserving civilian responsibility."
 COLDWAR_CYP_1970_civil_defence_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nStability: +2%."
 COLDWAR_CYP_1970_military_preparedness:0 "A Higher State of Readiness"
 COLDWAR_CYP_1970_military_preparedness_desc:0 "Higher readiness requires personnel, stores and orders that fit together. Funding those preparations will make the force more dependable, although continuing readiness also places demands on civilian resources."
 COLDWAR_CYP_1970_military_preparedness_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nMobilization speed: +5%.\nWar support: +3%.\nProduction speed buildings: -3%."
 COLDWAR_CYP_1970_defence_doctrine:0 "A Defensive Doctrine for Cyprus"
 COLDWAR_CYP_1970_defence_doctrine_desc:0 "A defensive doctrine must reflect the island's terrain and the force it can sustain. Bringing training and support into one framework will help limited capabilities serve a clear national purpose."
 COLDWAR_CYP_1970_defence_doctrine_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nArmy defence: +3%."
 COLDWAR_CYP_1970_constitutional_guard:0 "A Guard of the Republic"
 COLDWAR_CYP_1970_constitutional_guard_desc:0 "A Guard of the republic must defend constitutional authority rather than an officer faction. Consolidating that duty will place military competence within a political settlement the country can recognise."
 COLDWAR_CYP_1970_constitutional_guard_effect_tt:0 "Army org: +2%."
 COLDWAR_CYP_1970_foreign_policy:0 "An Independent Voice Abroad"
 COLDWAR_CYP_1970_foreign_policy_desc:0 "Independence requires relationships beyond the island without allowing any one patron to define its choices. Cyprus will organise its diplomacy around sovereignty, economic opportunity and the practical limits imposed by its security position."
 COLDWAR_CYP_1970_foreign_policy_effect_tt:0 "Political power: +25."
 COLDWAR_CYP_1970_nonaligned_contacts:0 "Renew Non-Aligned Contacts"
 COLDWAR_CYP_1970_nonaligned_contacts_desc:0 "Non-aligned contacts can give the republic a wider hearing and room to manoeuvre between larger powers. Those relationships must produce sustained diplomatic cooperation rather than ceremonial declarations alone."
 COLDWAR_CYP_1970_nonaligned_contacts_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nForeign influence defense: +3%."
 COLDWAR_CYP_1970_guarantor_dialogue:0 "Consult the Three Guarantors"
 COLDWAR_CYP_1970_guarantor_dialogue_desc:0 "The three guarantors have different interests and obligations concerning Cyprus. Consulting them can clarify intentions, provided the republic keeps its own voice rather than treat external discussion as a substitute for Cypriot consent."
 COLDWAR_CYP_1970_guarantor_dialogue_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nPolitical power: +25."
 COLDWAR_CYP_1970_western_association:0 "Seek Western Economic Association"
 COLDWAR_CYP_1970_western_association_desc:0 "Western economic association offers access to commercial partners and administrative experience. Negotiating the relationship requires terms compatible with the island's independence and an economy able to use the opportunities offered."
 COLDWAR_CYP_1970_western_association_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to ENG. Conditional benefits require an explicit accepted response; silence provides no agreement.\nReceiving investment cost: -5%.\nMdcw cw market exposure: +3%."
 COLDWAR_CYP_1970_soviet_trade:0 "Trade with the Socialist States"
 COLDWAR_CYP_1970_soviet_trade_desc:0 "Trade with socialist states can broaden the republic's commercial options. Cyprus will seek arrangements serving its productive needs without assuming that a trading relationship decides its political alignment."
 COLDWAR_CYP_1970_soviet_trade_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to SOV. Conditional benefits require an explicit accepted response; silence provides no agreement.\nProduction speed industrial complex: +3%.\nForeign influence defense: -3%."
 COLDWAR_CYP_1970_british_bases:0 "The Sovereign Base Areas"
 COLDWAR_CYP_1970_british_bases_desc:0 "The sovereign base areas place British military facilities within the island's geography but outside the republic's authority. Their future must be addressed through a relationship that distinguishes practical cooperation from the dispute over sovereignty."
 COLDWAR_CYP_1970_british_bases_effect_tt:0 "Political power: +25."
 COLDWAR_CYP_1970_base_cooperation:0 "Negotiate Practical Base Cooperation"
 COLDWAR_CYP_1970_base_cooperation_desc:0 "Practical cooperation can address movement, employment and services around the British bases. An agreed working relationship may ease daily problems without settling either government's wider position on sovereignty."
 COLDWAR_CYP_1970_base_cooperation_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to ENG. Conditional benefits require an explicit accepted response; silence provides no agreement.\nForeign influence defense: -3%."
 COLDWAR_CYP_1970_base_sovereignty:0 "Campaign for Full Sovereignty"
 COLDWAR_CYP_1970_base_sovereignty_desc:0 "The government will seek full sovereignty through a direct proposal to Britain. Diplomatic pressure can state the republic's case, but a transfer requires British agreement to the territory and terms concerned."
 COLDWAR_CYP_1970_base_sovereignty_effect_tt:0 "Send a proposal to ENG. Conditional benefits require an explicit accepted response; silence provides no agreement.\nPolitical power: +40.\nOnly British acceptance transfers state 812 to Cyprus. Other offers provide no territorial transfer."
 COLDWAR_CYP_1970_athens_relationship:0 "Define the Relationship with Athens"
 COLDWAR_CYP_1970_athens_relationship_desc:0 "Greece is both a close cultural partner and a powerful influence on Cypriot politics. Defining that relationship will force the government to decide which forms of cooperation support independence and which place it in question."
 COLDWAR_CYP_1970_athens_relationship_effect_tt:0 "Political power: +25."
 COLDWAR_CYP_1970_independent_athens:0 "Cooperate as an Independent Republic"
 COLDWAR_CYP_1970_independent_athens_desc:0 "Cooperation between independent governments offers a clearer basis for the relationship with Athens. Training and diplomacy must remain compatible with the republic's right to determine its own political future."
 COLDWAR_CYP_1970_independent_athens_effect_tt:0 "Foreign influence defense: +3%."
 COLDWAR_CYP_1970_enosis_debate:0 "Open the Enosis Question"
 COLDWAR_CYP_1970_enosis_debate_desc:0 "Union with Greece reaches beyond a declaration of national sentiment. The debate must confront the future of communal rights, international obligations and the independent institutions on which Cypriot political life rests."
 COLDWAR_CYP_1970_enosis_debate_effect_tt:0 "Communal tension: +10 points (0–100)."
 COLDWAR_CYP_1970_ankara_channel:0 "Keep a Channel to Ankara"
 COLDWAR_CYP_1970_ankara_channel_desc:0 "A channel to Ankara can reduce the danger of interpreting every action through public threats. Continued contact will not erase the disputes, but can give the republic a way to test terms and intentions directly."
 COLDWAR_CYP_1970_ankara_channel_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to TUR. Conditional benefits require an explicit accepted response; silence provides no agreement.\nCommunal tension: -5 points (0–100)."
 COLDWAR_CYP_1970_guarantee_review:0 "A Conference on the Guarantees"
 COLDWAR_CYP_1970_guarantee_review_desc:0 "Revising the guarantees requires a settlement that communal representatives and the guarantor governments can accept. A conference must confront the security concerns behind the existing arrangements rather than merely rename them."
 COLDWAR_CYP_1970_guarantee_review_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to GRE, TUR, ENG. Conditional benefits require an explicit accepted response; silence provides no agreement.\nAfter communal assent and all three guarantors accept, revise the guarantees and remove the Independence under Guarantee pressure spirit."
 COLDWAR_CYP_1970_enosis_agreement:0 "Negotiate an Enosis Agreement"
 COLDWAR_CYP_1970_enosis_agreement_desc:0 "Union can become a negotiated settlement only if its participants accept the same constitutional and security terms. Cyprus must decide its own ratification, while the British base areas remain a separate question for agreement with Britain."
 COLDWAR_CYP_1970_enosis_agreement_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to GRE, TUR, ENG. Conditional benefits require an explicit accepted response; silence provides no agreement.\nAfter all current consents, Cyprus must separately ratify the union. Ratification transfers its territory to Greece and ends independent Cypriot play."
 COLDWAR_CYP_1970_un_security_council:0 "Bring the Crisis to the United Nations"
 COLDWAR_CYP_1970_un_security_council_desc:0 "The United Nations offers a forum in which the republic can seek attention to an actual crisis. Its diplomacy must present clear demands while recognising that international deliberation does not itself secure events on the ground."
 COLDWAR_CYP_1970_un_security_council_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes."
 COLDWAR_CYP_1970_crisis_response:0 "The Republic in Crisis"
 COLDWAR_CYP_1970_crisis_response_desc:0 "A national crisis puts the republic's institutions under pressure from military danger and rival political claims. The government must decide whether its response will preserve civilian authority or enlarge the emergency at its expense."
 COLDWAR_CYP_1970_crisis_response_effect_tt:0 "Implement this policy and unlock the following programme."
 COLDWAR_CYP_1970_civilian_protection:0 "Protect Civilians and Aid Routes"
 COLDWAR_CYP_1970_civilian_protection_desc:0 "Aid routes and civilian safety require explicit orders and practical access. Protecting them can preserve lives and confidence in public authority when armed actors regard every movement as a security question."
 COLDWAR_CYP_1970_civilian_protection_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nCommunal tension: -5 points (0–100)."
 COLDWAR_CYP_1970_emergency_repression:0 "Rule through Emergency Repression"
 COLDWAR_CYP_1970_emergency_repression_desc:0 "Emergency repression concentrates authority through coercion rather than political consent. It may silence immediate opposition, but will deepen the damage and claims that any eventual return to constitutional government must address."
 COLDWAR_CYP_1970_emergency_repression_effect_tt:0 "Political power: +50.\nStability: -3%.\nCommunal tension: +10 points (0–100).\nPolitical power: +5% for 180 days.\nPolice cost multiplier: +15% for 180 days.\nCreate a displacement emergency and damaged communities in Cyprus-controlled states; reopen the crisis and invalidate prior communal constitutional and union consent."
 COLDWAR_CYP_1970_ceasefire_lines:0 "Negotiate Ceasefire Lines"
 COLDWAR_CYP_1970_ceasefire_lines_desc:0 "Ceasefire lines can reduce immediate fighting if the parties accept and observe them. Negotiators must distinguish temporary military separation from a political settlement and prepare arrangements that make restraint credible."
 COLDWAR_CYP_1970_ceasefire_lines_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to TUR. Conditional benefits require an explicit accepted response; silence provides no agreement."
 COLDWAR_CYP_1970_continue_resistance:0 "Continue Military Resistance"
 COLDWAR_CYP_1970_continue_resistance_desc:0 "Continuing resistance commits the republic to further military and civilian burdens. The government must judge whether its available forces and support can sustain a course whose outcome remains uncertain."
 COLDWAR_CYP_1970_continue_resistance_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nArmy defence: +3% for 180 days."
 COLDWAR_CYP_1970_emergency_relief:0 "Emergency Relief for the Displaced"
 COLDWAR_CYP_1970_emergency_relief_desc:0 "Displaced households need food, shelter and services before a final settlement is possible. Emergency relief will help preserve civilian life while placing continuing responsibilities on an administration already under strain."
 COLDWAR_CYP_1970_emergency_relief_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nImp refugee integration rate: +5%."
 COLDWAR_CYP_1970_return_and_restitution:0 "Return and Property Restitution"
 COLDWAR_CYP_1970_return_and_restitution_desc:0 "Return cannot be separated from property claims and the conditions in which families would live. A serious restitution programme must give those affected procedures they can trust and resources capable of making decisions meaningful."
 COLDWAR_CYP_1970_return_and_restitution_effect_tt:0 "Fund the programme with 2% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSettlement progress: +10 points (0–100)."
 COLDWAR_CYP_1970_temporary_housing:0 "Build Temporary Housing and Livelihoods"
 COLDWAR_CYP_1970_temporary_housing_desc:0 "Temporary housing can restore immediate shelter and access to work. It does not settle ownership or return claims, which will remain part of the republic's obligations after the emergency accommodation has been provided."
 COLDWAR_CYP_1970_temporary_housing_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSocial cost multiplier: -5%."
 COLDWAR_CYP_1970_missing_persons:0 "Investigate the Missing"
 COLDWAR_CYP_1970_missing_persons_desc:0 "Families need a credible investigation into the fate of the missing. Documentation, access and cooperation must take priority over political convenience if the search is to command trust across the island."
 COLDWAR_CYP_1970_missing_persons_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSettlement progress: +5 points (0–100)."
 COLDWAR_CYP_1970_accountability:0 "Investigate Crimes and Restore Civilian Rule"
 COLDWAR_CYP_1970_accountability_desc:0 "Restoring civilian rule requires an examination of crimes committed during the crisis. Investigations and restitution must address established harm rather than offer a clean slate for whichever side controls the administration."
 COLDWAR_CYP_1970_accountability_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nPolitical power: -50.\nCommunal tension: -10 points (0–100).\nAn additional 1% of GDP funds property restitution if temporary housing left those claims unresolved."
 COLDWAR_CYP_1970_frozen_partition:0 "Administer a Frozen Conflict"
 COLDWAR_CYP_1970_frozen_partition_desc:0 "Administering a frozen conflict means providing services while fundamental claims remain unresolved. The government must preserve civilian livelihoods without presenting temporary separation as the accepted conclusion of the dispute."
 COLDWAR_CYP_1970_frozen_partition_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nStability: +2%.\nForeign influence defense: -5%."
 COLDWAR_CYP_1970_reconstruction:0 "Rebuild Civilian Livelihoods"
 COLDWAR_CYP_1970_reconstruction_desc:0 "Reconstruction must reconnect livelihoods, public services and damaged communities. Its success will depend on local security and the treatment of unresolved property claims as well as the resources assigned to repair."
 COLDWAR_CYP_1970_reconstruction_effect_tt:0 "Fund the programme with 2% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nReplace existing shattered-community damage with reconstruction penalties of −7.5% construction and productivity growth. Undamaged states are unaffected. Remove the displacement spirit only after restitution and a final settlement."
 COLDWAR_CYP_1970_p1_mandate:0 "The Archbishop-President's Mandate"
 COLDWAR_CYP_1970_p1_mandate_desc:0 "The presidency's mandate already rests on the independent republic. Its development programme begins with practical administration rather than a new ceremony confirming authority it already exercises."
 COLDWAR_CYP_1970_p1_mandate_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p1_organisation:0 "Renew the Presidential Coalition"
 COLDWAR_CYP_1970_p1_organisation_desc:0 "The presidential coalition needs an administration able to connect its diverse supporters to public services. Renewed coordination will improve stability and reduce waste while giving ministries clearer responsibilities beyond personal mediation."
 COLDWAR_CYP_1970_p1_organisation_effect_tt:0 "Fund the programme with 0.25% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: +3%.\nBureaucracy cost multiplier: -5%."
 COLDWAR_CYP_1970_p1_first_a:0 "A Broad Republican Coalition"
 COLDWAR_CYP_1970_p1_first_a_desc:0 "A broad republican coalition can protect independence by keeping different political forces inside the constitutional order. Its strength lies in consent, although accommodating partners makes executive decisions slower and more contested."
 COLDWAR_CYP_1970_p1_first_a_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: +4%.\nPolitical power: -2%."
 COLDWAR_CYP_1970_p1_first_b:0 "A Presidential Inner Circle"
 COLDWAR_CYP_1970_p1_first_b_desc:0 "A presidential inner circle offers tighter coordination of policy. Concentrating access around the presidency can speed decisions while making the republic more dependent on personal trust and a narrower political base."
 COLDWAR_CYP_1970_p1_first_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nPolitical power: +7%."
 COLDWAR_CYP_1970_p1_follow_a:0 "Keep the Left in the Coalition"
 COLDWAR_CYP_1970_p1_follow_a_desc:0 "Keeping the left in the coalition recognises the role of organised labour in the defence of independence. The presidency must give its partners a genuine hearing without abandoning its own responsibility to govern."
 COLDWAR_CYP_1970_p1_follow_a_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nForeign influence defense: +5%."
 COLDWAR_CYP_1970_p1_follow_b:0 "Strengthen Presidential Coordination"
 COLDWAR_CYP_1970_p1_follow_b_desc:0 "Stronger presidential coordination will make ministries answer more directly to the executive. Administrative unity can improve delivery, but raises expectations that the presidency will settle every dispute itself."
 COLDWAR_CYP_1970_p1_follow_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nBureaucracy cost multiplier: -6%."
 COLDWAR_CYP_1970_p1_institutions:0 "The Independence Programme"
 COLDWAR_CYP_1970_p1_institutions_desc:0 "The independence programme must reach public appointments and ordinary administration. Its institutions should give the republic the capacity to govern without making every task depend on the personal authority of its president."
 COLDWAR_CYP_1970_p1_institutions_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nRaise the shared party-reform contribution to settlement progress to 5 points if it is lower. Elections do not repeat this credit."
 COLDWAR_CYP_1970_p1_second_a:0 "A Secular Civil Service"
 COLDWAR_CYP_1970_p1_second_a_desc:0 "A secular civil service would establish common professional standards beyond religious mediation. The reform can make administration more impartial while changing relationships through which many citizens have approached the state."
 COLDWAR_CYP_1970_p1_second_a_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nBureaucracy cost multiplier: -5%.\nResearch speed: +2%."
 COLDWAR_CYP_1970_p1_second_b:0 "Retain Church Mediation"
 COLDWAR_CYP_1970_p1_second_b_desc:0 "Church mediation can preserve familiar channels between the presidency and local society. Retaining it offers continuity while leaving questions about the independence and equal accessibility of public administration."
 COLDWAR_CYP_1970_p1_second_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: +4%.\nEducation cost multiplier: +3%."
 COLDWAR_CYP_1970_p1_settlement:0 "A Republic beyond the Presidency"
 COLDWAR_CYP_1970_p1_settlement_desc:0 "A republic beyond the presidency needs institutions that can sustain independence after its founding personalities depart. The coalition's legacy must include procedures through which legitimate authority can pass to another government."
 COLDWAR_CYP_1970_p1_settlement_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nForeign influence defense: +5%."
 COLDWAR_CYP_1970_p1_economic_mandate:0 "The President's Development Programme"
 COLDWAR_CYP_1970_p1_economic_mandate_desc:0 "The president's development programme will connect independence to rural livelihoods and the growing visitor economy. Its priorities must offer productive opportunity without placing the island's policy at the discretion of external financiers."
 COLDWAR_CYP_1970_p1_economic_mandate_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p1_economic_a:0 "A Cooperative Rural Economy"
 COLDWAR_CYP_1970_p1_economic_a_desc:0 "A cooperative rural economy gives farmers a stronger position in marketing, finance and shared services. The programme will favour local organisation capable of turning community savings and work into sustained production."
 COLDWAR_CYP_1970_p1_economic_a_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed buildings: +6%."
 COLDWAR_CYP_1970_p1_economic_b:0 "Tourism under National Stewardship"
 COLDWAR_CYP_1970_p1_economic_b_desc:0 "Tourism under national stewardship seeks foreign earnings without surrendering development entirely to outside interests. Cypriot enterprise and public priorities will shape how the coast participates in the visitor economy."
 COLDWAR_CYP_1970_p1_economic_b_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nOffice park income tax: +7%.\nMdcw cw market exposure: +4%."
 COLDWAR_CYP_1970_p1_project_a1:0 "Agricultural Cooperative Marketing"
 COLDWAR_CYP_1970_p1_project_a1_desc:0 "Agricultural marketing cooperatives can improve the terms on which smaller producers reach buyers. Professional accounts and common standards will help members gain more from their work beyond the farm gate."
 COLDWAR_CYP_1970_p1_project_a1_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nOne 25% research bonus in the relevant existing technology category."
 COLDWAR_CYP_1970_p1_project_a2:0 "Village Roads and Rural Contractors"
 COLDWAR_CYP_1970_p1_project_a2_desc:0 "Village roads and rural contractors will connect production to the island's markets. Local participation can retain more development work in the countryside while improving access needed by farming communities."
 COLDWAR_CYP_1970_p1_project_a2_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed infrastructure: +6%."
 COLDWAR_CYP_1970_p1_project_b1:0 "Cypriot-Owned Coastal Hotels"
 COLDWAR_CYP_1970_p1_project_b1_desc:0 "Cypriot-owned coastal hotels can give domestic enterprise a larger stake in tourism. Public support must encourage viable accommodation and services rather than merely reward politically connected landowners."
 COLDWAR_CYP_1970_p1_project_b1_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nOffice park income tax: +4%."
 COLDWAR_CYP_1970_p1_project_b2:0 "Local Suppliers for the Visitor Economy"
 COLDWAR_CYP_1970_p1_project_b2_desc:0 "Local suppliers can retain a greater share of visitor spending on the island. Linking farms, workshops and services to hotels will make tourism more useful to communities beyond the beachfront."
 COLDWAR_CYP_1970_p1_project_b2_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nBureaucracy cost multiplier: -3%."
 COLDWAR_CYP_1970_p1_finance_review:0 "Finance without Political Subordination"
 COLDWAR_CYP_1970_p1_finance_review_desc:0 "Development finance must be judged by its political terms as well as its immediate cost. The presidency will seek resources that support the island's independence rather than purchase influence over its programme."
 COLDWAR_CYP_1970_p1_finance_review_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p1_finance_a:0 "Non-Aligned Development Credit"
 COLDWAR_CYP_1970_p1_finance_a_desc:0 "Non-aligned development credit can widen the government's options between familiar patrons. Any agreement must provide usable resources on terms Cyprus can service without surrendering its political discretion."
 COLDWAR_CYP_1970_p1_finance_a_effect_tt:0 "Send a proposal to YUG. Conditional benefits require an explicit accepted response; silence provides no agreement.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nReceiving investment cost: -8%.\nForeign influence defense: -3%."
 COLDWAR_CYP_1970_p1_finance_b:0 "Domestic Cooperative Savings"
 COLDWAR_CYP_1970_p1_finance_b_desc:0 "Cooperative savings offer a domestic foundation for development. Expanding them will require confidence that members' funds serve productive local projects rather than the obligations of the governing coalition."
 COLDWAR_CYP_1970_p1_finance_b_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nInterest rate multiplier: -0.25 interest points.\nBureaucracy cost multiplier: +3%."
 COLDWAR_CYP_1970_p1_finance_a_follow:0 "Publish the Terms of External Loans"
 COLDWAR_CYP_1970_p1_finance_a_follow_desc:0 "Publishing external loan terms makes the relationship between credit and sovereignty open to scrutiny. Citizens and legislators should be able to judge what the government has promised in return for development funds."
 COLDWAR_CYP_1970_p1_finance_a_follow_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nBureaucracy cost multiplier: -4%."
 COLDWAR_CYP_1970_p1_finance_b_follow:0 "Expand Village Credit Societies"
 COLDWAR_CYP_1970_p1_finance_b_follow_desc:0 "Village credit societies can bring savings and investment into a closer local relationship. Their growth needs capable administration if financial inclusion is to strengthen rural communities over the longer term."
 COLDWAR_CYP_1970_p1_finance_b_follow_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: +3%."
 COLDWAR_CYP_1970_p1_social_investment:0 "Technical Education beyond the Capital"
 COLDWAR_CYP_1970_p1_social_investment_desc:0 "Technical education outside the capital can widen access to the skills development requires. The presidency's rural and commercial priorities will be stronger if young people can train without leaving their communities behind."
 COLDWAR_CYP_1970_p1_social_investment_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nResearch speed: +2%.\nEducation cost multiplier: +3%."
 COLDWAR_CYP_1970_p1_national_programme:0 "The Independent Development Compact"
 COLDWAR_CYP_1970_p1_national_programme_desc:0 "The independent development compact will unite local production, tourism and finance around the republic's continued autonomy. Its success depends on institutions able to maintain those commitments beyond the president's personal leadership."
 COLDWAR_CYP_1970_p1_national_programme_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed buildings: +4%."
 COLDWAR_CYP_1970_p2_mandate:0 "A Liberal Republican Mandate"
 COLDWAR_CYP_1970_p2_mandate_desc:0 "A liberal republican government will claim authority through law and commercial opportunity. Its mandate must reconcile the promise of open enterprise with the constitutional divisions that continue to shape the island."
 COLDWAR_CYP_1970_p2_mandate_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p2_organisation:0 "The Eniaion Reform Wing"
 COLDWAR_CYP_1970_p2_organisation_desc:0 "The Eniaion reform wing needs a governing organisation able to turn professional support into policy. Clear responsibilities will help it move beyond personal networks while keeping the coalition's different commercial interests together."
 COLDWAR_CYP_1970_p2_organisation_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nPolitical power: +3%."
 COLDWAR_CYP_1970_p2_first_a:0 "An Open Commercial Economy"
 COLDWAR_CYP_1970_p2_first_a_desc:0 "An open commercial economy seeks growth through investment and competition. Credible rules and contracts can draw new participants into business while exposing established interests to a less protected market."
 COLDWAR_CYP_1970_p2_first_a_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nReceiving investment cost: -8%.\nForeign influence defense: -4%."
 COLDWAR_CYP_1970_p2_first_b:0 "A Regulated Social Market"
 COLDWAR_CYP_1970_p2_first_b_desc:0 "A regulated social market would combine enterprise with stronger public supervision. The arrangement seeks confidence through clear standards, accepting a larger administrative role in the conduct of business."
 COLDWAR_CYP_1970_p2_first_b_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: +4%."
 COLDWAR_CYP_1970_p2_follow_a:0 "Commercial Arbitration"
 COLDWAR_CYP_1970_p2_follow_a_desc:0 "Commercial arbitration can give firms a dependable way to settle disputes. Professional procedures will make investment less dependent on informal mediation by influential figures."
 COLDWAR_CYP_1970_p2_follow_a_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nOffice park income tax: +4%."
 COLDWAR_CYP_1970_p2_follow_b:0 "Independent Public Regulators"
 COLDWAR_CYP_1970_p2_follow_b_desc:0 "Independent regulators must judge public interests without instructions from the firms or politicians they oversee. Their authority can support confidence, provided the administration supplies the expertise their responsibilities require."
 COLDWAR_CYP_1970_p2_follow_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nBureaucracy cost multiplier: -5%."
 COLDWAR_CYP_1970_p2_institutions:0 "A State Governed by Law"
 COLDWAR_CYP_1970_p2_institutions_desc:0 "A state governed by law must offer predictable treatment beyond its strongest supporters. Entrenching that principle will give the commercial programme institutions capable of surviving a change in the governing coalition."
 COLDWAR_CYP_1970_p2_institutions_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nResearch speed: +2%."
 COLDWAR_CYP_1970_p2_second_a:0 "Negotiate Bicommunal Guarantees"
 COLDWAR_CYP_1970_p2_second_a_desc:0 "Negotiated bicommunal guarantees can widen confidence in the republic's constitutional future. Liberal institutions will be stronger if the smaller community sees enforceable protection rather than another invitation to trust central authority."
 COLDWAR_CYP_1970_p2_second_a_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nRaise the shared party-reform contribution to settlement progress to 10 points if it is lower. Elections do not repeat this credit."
 COLDWAR_CYP_1970_p2_second_b:0 "Prioritise Central Institutions"
 COLDWAR_CYP_1970_p2_second_b_desc:0 "Prioritising central institutions aims to make the republic's common administration more effective. Its advocates must show that stronger government can also provide reliable protection for those who fear majoritarian control."
 COLDWAR_CYP_1970_p2_second_b_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nBureaucracy cost multiplier: -5%."
 COLDWAR_CYP_1970_p2_settlement:0 "A Constitutional Liberal Republic"
 COLDWAR_CYP_1970_p2_settlement_desc:0 "A constitutional liberal republic must connect impartial institutions to a productive economy. The settlement will be judged by access to lawful government as well as the opportunities available to commerce."
 COLDWAR_CYP_1970_p2_settlement_effect_tt:0 "Programme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nStability: +3%."
 COLDWAR_CYP_1970_p2_economic_mandate:0 "A Commercial Strategy for the Island"
 COLDWAR_CYP_1970_p2_economic_mandate_desc:0 "A commercial strategy for the island must identify activities that can reach wider markets. Shipping, professional services and competitive workshops offer different paths requiring credible law and skilled workers."
 COLDWAR_CYP_1970_p2_economic_mandate_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections."
 COLDWAR_CYP_1970_p2_economic_a:0 "Shipping, Trade and Professional Services"
 COLDWAR_CYP_1970_p2_economic_a_desc:0 "Shipping, trade and professional services can turn the island's commercial connections into employment and revenue. Their growth depends on dependable institutions as much as access to overseas clients."
 COLDWAR_CYP_1970_p2_economic_a_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nOffice park income tax: +7%."
 COLDWAR_CYP_1970_p2_economic_b:0 "Competitive Small Manufacturing"
 COLDWAR_CYP_1970_p2_economic_b_desc:0 "Small manufacturers can compete where skills and flexible production matter more than industrial scale. Supporting them will broaden employment while requiring investment in standards and reliable supply contracts."
 COLDWAR_CYP_1970_p2_economic_b_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProgramme modifiers apply only while this governing party is in office. Completed reforms cannot be collected again after elections.\nProduction speed industrial complex: +7%."
