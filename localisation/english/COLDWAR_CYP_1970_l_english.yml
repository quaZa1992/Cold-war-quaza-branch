 COLDWAR_NCY_1970_party_1:0 "£generic_conservatism_small Turkish Cypriot Communal Executive"
 COLDWAR_NCY_1970_party_1_v2_desc:0 "Ulusal Birlik Partisi was founded on 11 October 1975. Rauf Denktaş's presidency is distinct from the successive party chairmanships and premierships of Konuk, Örek, Çağatay and Eroğlu."
 COLDWAR_NCY_1970_party_1_v1_desc:0 "Rauf Denktaş took the vice-presidential oath and the leadership of the Turkish Cypriot administration on 28 February 1973. A local administration is not equivalent to international recognition."
 COLDWAR_NCY_1970_party_1_desc:0 "The communal executive is led by Fazıl Küçük at the 1970 starting point. This is a separate administration within the divided constitutional framework, not a pre-existing sovereign Northern Cyprus."
