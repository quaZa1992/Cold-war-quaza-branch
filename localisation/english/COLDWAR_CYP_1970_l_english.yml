 COLDWAR_CYP_1970_tc_community:0 "A Community in Enclaves"
 COLDWAR_CYP_1970_tc_community_desc:0 "Turkish Cypriot communities live with the legacy of displacement, separate administration and enclave economies. Civilian movement had substantially normalised by 1969, but reciprocal access and a common political settlement remain unsettled."
 COLDWAR_CYP_1970_tc_community_effect_tt:0 "Implement this policy and unlock the following programme."
 COLDWAR_CYP_1970_tc_leadership:0 "Recognise the Communal Interlocutors"
 COLDWAR_CYP_1970_tc_leadership_desc:0 "Fazil Kucuk remains the senior communal/vicepresidential figure until 1973; Rauf Raif Denktas is the negotiating representative and later successor. Neither becomes CYP president merely by being consulted."
 COLDWAR_CYP_1970_tc_leadership_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes."
 COLDWAR_CYP_1970_tc_kucuk:0 "A Channel to Fazil Kucuk"
 COLDWAR_CYP_1970_tc_kucuk_desc:0 "Direct dialogue with the communal leadership; the counterpart decides whether to cooperate. Turkish Cypriot community-state is tracked separately from national ruling_party."
 COLDWAR_CYP_1970_tc_kucuk_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome."
 COLDWAR_CYP_1970_tc_denktash:0 "Support the Clerides–Denktas Talks"
 COLDWAR_CYP_1970_tc_denktash_desc:0 "Clerides can act for the Makarios government; this does not put Clerides in power. Denktas must obtain a community mandate, not merely accept Ankara's instructions."
 COLDWAR_CYP_1970_tc_denktash_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome."
 COLDWAR_CYP_1970_tc_restrictions:0 "The Restrictions Question"
 COLDWAR_CYP_1970_tc_restrictions_desc:0 "Fazil Kucuk, Rauf Denktas, civilian organisations and the emerging CTP are distinct interlocutors. Address enclaves, restrictions, separate administration and political equality; they are not an obedient faction of the CYP ruling party."
 COLDWAR_CYP_1970_tc_restrictions_effect_tt:0 "Political power: +25."
 COLDWAR_CYP_1970_tc_open_trade:0 "Remove Remaining Civilian Trade Controls"
 COLDWAR_CYP_1970_tc_open_trade_desc:0 "Replace access penalties with a lower, defined stage after an implemented agreement. Restrictions were already being eased after 1967; avoid portraying January 1970 as an unchanged 1964 siege."
 COLDWAR_CYP_1970_tc_open_trade_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nCommunal tension: -10 points (0–100).\nAdvance reciprocal civilian access to stage 1; partially replace the initial movement and administration penalties."
 COLDWAR_CYP_1970_tc_pressure:0 "Renew Restrictions as Political Pressure"
 COLDWAR_CYP_1970_tc_pressure_desc:0 "An OPTIONAL renewed coercive policy, not an assertion of an unchanged 1964siege in 1970. Short-term leverage carries policing expense and hostility; no productivity, tax or manpower reward."
 COLDWAR_CYP_1970_tc_pressure_effect_tt:0 "Political power: +40.\nCommunal tension: +10 points (0–100).\nPolice cost multiplier: +8%."
 COLDWAR_CYP_1970_tc_routes:0 "Protected Roads and Supply Routes"
 COLDWAR_CYP_1970_tc_routes_desc:0 "Civilian movement and trade access; removal of army defences is a separate negotiation, not a precondition for medicine."
 COLDWAR_CYP_1970_tc_routes_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nCommunal tension: -5 points (0–100).\nAdvance reciprocal civilian access to stage 1; partially replace the initial movement and administration penalties."
 COLDWAR_CYP_1970_tc_utilities:0 "Restore Water and Medical Supplies"
 COLDWAR_CYP_1970_tc_utilities_desc:0 "Fund reliable utilities and treatment across communal boundaries. The same project cannot pay twice if the shared constitution branch has already restored it."
 COLDWAR_CYP_1970_tc_utilities_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nAdvance shared services to stage 2, further reducing the initial movement and administration penalties."
 COLDWAR_CYP_1970_tc_police:0 "Maintain Emergency Police Posts"
 COLDWAR_CYP_1970_tc_police_desc:0 "A policy of sustained restriction, not an automatic massacre event; armed incidents can worsen the crisis."
 COLDWAR_CYP_1970_tc_police_effect_tt:0 "Political power: +25.\nCommunal tension: +5 points (0–100).\nPolice cost multiplier: +5%."
 COLDWAR_CYP_1970_tc_supervised:0 "Permit Supervised Civilian Deliveries"
 COLDWAR_CYP_1970_tc_supervised_desc:0 "Partial relief without freedom of movement. It cannot unlock the economic-normalisation reward on its own."
 COLDWAR_CYP_1970_tc_supervised_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nCommunal tension: -4 points (0–100)."
