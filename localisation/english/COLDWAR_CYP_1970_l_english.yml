 COLDWAR_NCY_1970_party_3_v1_desc:0 "Cumhuriyetçi Türk Partisi was founded on 27 December 1970. Ahmet Mithat Berberoğlu is its first chair; Özker Özgür leads the later 1976–1996 period. The party advocates democratic representation, workers' rights and a negotiated settlement."
