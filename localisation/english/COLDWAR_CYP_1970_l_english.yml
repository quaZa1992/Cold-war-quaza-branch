 COLDWAR_CYP_1970_external_milestone_tt:0 "This focus records a real event or a response chosen in the crisis dossier."
 COLDWAR_CYP_1970_dossier:0 "Cyprus: Communities and the Guarantors"
 COLDWAR_CYP_1970_foreign_dossier:0 "Cyprus: Current Diplomatic Proposals"
 COLDWAR_CYP_1970_foreign_dossier_desc:0 "Review and answer the current Cypriot proposals here. Event notices do not sign agreements. Each decision rechecks the current conditions before applying any outcome. Silence leaves a proposal unanswered until it expires."
 COLDWAR_CYP_1970_dossier_desc:0 "Communal tension: [?COLDWAR_CYP_1970_communal_tension|0]/100\nSettlement progress: [?COLDWAR_CYP_1970_settlement_progress|0]/100\nCoup pressure: [?COLDWAR_CYP_1970_coup_pressure|0]/100\nCurrent crisis: [?COLDWAR_CYP_1970_crisis_instance|0] — substantive guarantor responses: [?COLDWAR_CYP_1970_current_substantive_replies|0]/3.\nHistorical focus markers remain complete; current offers and responses are recorded separately."
 COLDWAR_CYP_1970_event_1_title:0 "A Programme Awaits Funding"
 COLDWAR_CYP_1970_event_1_desc:0 "The programme has reached its completion date, but its current treasury requirement or implementation conditions are not met. Its benefits have been withheld. The crisis dossier allows the administration to fund eligible outstanding programmes once conditions permit."
 COLDWAR_CYP_1970_event_1_option_190:0 "Review the outstanding programme."
 COLDWAR_CYP_1970_event_4000_title:0 "Final Ratification of Union"
 COLDWAR_CYP_1970_event_4000_desc:0 "Greece, Turkey, Britain and the communal representatives have accepted the negotiated framework. Ratifying now transfers every territory currently owned by Cyprus to Greece and ends independent Cypriot play. British-owned bases are not transferred by this act. This cannot be reversed by cancelling a focus."
 COLDWAR_CYP_1970_event_4000_option_193:0 "Ratify the union and end independent Cypriot government."
 COLDWAR_CYP_1970_event_4000_option_194:0 "Withhold final ratification."
 COLDWAR_CYP_1970_restore_authority:0 "Restore Constitutional Authority"
 COLDWAR_CYP_1970_restore_authority_desc:0 "End the coup presidency and appoint Glafkos Clerides as acting constitutional president. This is a Cypriot decision; it neither commands foreign withdrawal nor ends an engine war."
 COLDWAR_CYP_1970_review_ratification:0 "Review Final Ratification of Union"
 COLDWAR_CYP_1970_review_ratification_desc:0 "Reopen the final ratification. The agreed framework and all current conditions are checked again. Confirming ends independent Cypriot play."
 COLDWAR_CYP_1970_event_5003_title:0 "Consolidate Safe Civilian Passage: Communal Response"
 COLDWAR_CYP_1970_event_5003_desc:0 "The communal representatives have accepted the specified terms under the current access and security conditions. The agreed programme is now being implemented."
 COLDWAR_CYP_1970_event_5003_option_201:0 "Record the agreed outcome."
 COLDWAR_CYP_1970_event_6003_title:0 "Consolidate Safe Civilian Passage: Terms Not Accepted"
 COLDWAR_CYP_1970_event_6003_desc:0 "The communal representatives have not accepted these terms. Civilian access, protection from reprisals, negotiating authority and constitutional safeguards are evaluated independently of the governing party. The crisis dossier allows a renewed proposal after conditions improve."
