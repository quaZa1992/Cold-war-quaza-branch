 COLDWAR_CYP_1970_party_3_v1_desc:0 "EDEK adopted socialist terminology at its second congress in April 1974, combining democratic socialism with resistance to the coup and the partition of Cyprus."
 COLDWAR_CYP_1970_party_3_desc:0 "Vassos Lyssarides's movement emerged in 1969 and held its founding congress on 3 May 1970. The contemporary EDEK name predates the later Movement for Social Democracy name."
 COLDWAR_CYP_1970_party_3_v1_icon:0 "£generic_socialism_small"
