 COLDWAR_CYP_1970_party_20_icon:0 "£generic_Nat_Populism_small"
 COLDWAR_CYP_1970_party_21_v1:0 "£generic_Nat_Fascism_small EOKA B / Enosis Hardliners"
 COLDWAR_CYP_1970_party_21:0 "£generic_Nat_Fascism_small Armed Enosis Movement"
 COLDWAR_CYP_1970_party_21_v1_desc:0 "The later armed Enosis underground includes EOKA B following Grivas's 1971 return. This is an armed political current, not a normal parliamentary party; its later government is alternate history."
 COLDWAR_CYP_1970_party_21_desc:0 "Armed opponents of Makarios include the National Front. Their pursuit of Enosis challenges presidential authority and divides the security forces."
 COLDWAR_CYP_1970_party_21_v1_icon:0 "£generic_Nat_Fascism_small"
 COLDWAR_CYP_1970_party_21_icon:0 "£generic_Nat_Fascism_small"
