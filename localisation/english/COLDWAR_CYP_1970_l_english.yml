l_english:
 COLDWAR_CYP_1970_constitutional_breakdown:0 "A Constitution in Abeyance"
 COLDWAR_CYP_1970_constitutional_breakdown_desc:0 "Institutional breakdown since 1963; not an intrinsic ethnic penalty. Negotiation and an implemented constitutional agreement can resolve it."
 COLDWAR_CYP_1970_divided_command:0 "A Divided Chain of Command"
 COLDWAR_CYP_1970_divided_command_desc:0 "National Guard, police, armed organisations and foreign officers have competing loyalties."
 COLDWAR_CYP_1970_narrow_economy:0 "A Narrow Island Economy"
 COLDWAR_CYP_1970_narrow_economy_desc:0 "Small domestic market and import dependence; avoid pretending that Cyprus was economically stagnant."
 COLDWAR_CYP_1970_guarantor_pressure:0 "Independence under Guarantee"
 COLDWAR_CYP_1970_guarantor_pressure_desc:0 "Greece, Turkey and Britain constrain freedom of action; legal guarantee is not a universal defence pact."
 COLDWAR_CYP_1970_makarios_authority:0 "The Archbishop-President"
 COLDWAR_CYP_1970_makarios_authority_desc:0 "Leader-bound; removed on Makarios leaving office, dying or being overthrown. Conservative outlook is the existing game mapping, not a claim that he was Atlanticist."
 COLDWAR_CYP_1970_restricted_movement_south:0 "Fragmented Markets and Unsettled Access"
 COLDWAR_CYP_1970_restricted_movement_south_desc:0 "Legacy displacement, disrupted local economic links and uneven reciprocal access, not a blanket 1964-style blockade in 1970. Enclaves existed across the island. Together with the national narrow-economy penalty: -10% construction before other effects."
 COLDWAR_CYP_1970_restricted_movement_north:0 "Enclave Economies and Uneven Normalisation"
 COLDWAR_CYP_1970_restricted_movement_north_desc:0 "Coarse proxy for separate economic development, displacement and fragmented institutions, affecting all residents of the map state. Travel had substantially normalised by 1969. Combined construction -17%; positive growth 15% slower, not 15% GDP loss. No pre-existing NCY."
 COLDWAR_CYP_1970_tc_parallel_administration:0 "Turkish Cypriot Enclaves and Separate Administration"
 COLDWAR_CYP_1970_tc_parallel_administration_desc:0 "Separate communal institutions, displaced communities, uneven reciprocal access and duplicated services impose administrative/security costs. A 1969 UN report records largely restored Turkish Cypriot movement outside military areas; this is not an unchanged 1964 siege. Agreed services and remaining-access normalisation reduce the penalties."
 COLDWAR_CYP_1970_displacement_emergency:0 "Displacement and Missing Persons"
 COLDWAR_CYP_1970_displacement_emergency_desc:0 "Contingent on violence/war; NOT a January 1970 starting spirit. Separate from existing global refugee pressure to prevent duplicate costs."
 COLDWAR_CYP_1970_shattered_communities:0 "Shattered Communities"
 COLDWAR_CYP_1970_shattered_communities_desc:0 "Contingent destruction, flight and loss of trust; reconstruction can reduce this, coercion cannot simply erase it."
 COLDWAR_CYP_1970_armed_enosis_opposition:0 "The Armed Enosis Underground"
 COLDWAR_CYP_1970_armed_enosis_opposition_desc:0 "January 1970: the National Front and other armed opponents challenge Makarios. This is not EOKA B before its 1971 formation and is not a penalty for Greek Cypriot ethnicity. Civilian security reform, disarmament or an explicit regime change determine its later course."
