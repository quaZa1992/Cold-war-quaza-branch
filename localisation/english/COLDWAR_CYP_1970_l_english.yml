 COLDWAR_CYP_1970_shortcut_diplomacy:0 "Between the Guarantors and the Blocs"
 COLDWAR_CYP_1970_shortcut_aftermath:0 "Crisis, Partition and Recovery"
 COLDWAR_CYP_1970_shortcut_party_1:0 "Makarios: An Independent Developmental Republic"
 COLDWAR_CYP_1970_shortcut_party_2:0 "Clerides: A Commercial and Constitutional Republic"
 COLDWAR_CYP_1970_shortcut_party_3:0 "EDEK: A Democratic Social Republic"
 COLDWAR_CYP_1970_shortcut_party_4:0 "AKEL: Labour, Industry and Independence"
 COLDWAR_CYP_1970_shortcut_party_20:0 "The Progressive Front: A Civilian Enosis Mandate"
 COLDWAR_CYP_1970_shortcut_party_22:0 "The Enosis Coup and Security Regime"
 COLDWAR_CYP_1970_shortcut_turkish_cypriots:0 "The Turkish Cypriot Community"
 COLDWAR_CYP_1970_shortcut_road_to_war:0 "The Road to the Cyprus War"
 COLDWAR_CYP_1970_republic_at_ten:0 "The Republic at Ten"
 COLDWAR_CYP_1970_republic_at_ten_desc:0 "An independent republic enters a new decade with a damaged constitutional partnership, fragmented communal services and an uncertain chain of command. Makarios must preserve sovereignty while addressing the island's divisions."
 COLDWAR_CYP_1970_republic_at_ten_effect_tt:0 "Political power: +50."
 COLDWAR_CYP_1970_intercommunal_talks:0 "Keep the Intercommunal Talks Alive"
 COLDWAR_CYP_1970_intercommunal_talks_desc:0 "Clerides and Denktash are negotiating counterparts. Talks began before this start date."
 COLDWAR_CYP_1970_intercommunal_talks_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nCommunal tension: -5 points (0–100).\nSettlement progress: +10 points (0–100)."
 COLDWAR_CYP_1970_command_review:0 "Review the Security Apparatus"
 COLDWAR_CYP_1970_command_review_desc:0 "Negotiation, security and constitutional outcomes. Both communities have political agency; foreign players can accept or reject proposals."
 COLDWAR_CYP_1970_command_review_effect_tt:0 "Political power: +25."
 COLDWAR_CYP_1970_safe_passage:0 "Consolidate Safe Civilian Passage"
 COLDWAR_CYP_1970_safe_passage_desc:0 "Open supervised civilian routes; halve the two starting state construction penalties after an agreed local protocol."
 COLDWAR_CYP_1970_safe_passage_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nCommunal tension: -10 points (0–100).\nSettlement progress: +10 points (0–100).\nAdvance reciprocal civilian access to stage 1; partially replace the initial movement and administration penalties."
 COLDWAR_CYP_1970_checkpoint_leverage:0 "Retain Checkpoints as Leverage"
 COLDWAR_CYP_1970_checkpoint_leverage_desc:0 "Administrative leverage gives immediate political room, but movement restrictions and enclave penalties remain. Does not reward targeting civilians."
 COLDWAR_CYP_1970_checkpoint_leverage_effect_tt:0 "Political power: +40.\nCommunal tension: +10 points (0–100).\nPolice cost multiplier: +5%."
 COLDWAR_CYP_1970_joint_services:0 "Restore Shared Municipal Services"
 COLDWAR_CYP_1970_joint_services_desc:0 "A funded intermediate shared-services stage: south access penalty removed, north construction -3%/positive-growth -4%, national administration friction bureaucracy+2%/police+2.5%. Does not resolve the constitution."
 COLDWAR_CYP_1970_joint_services_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSettlement progress: +10 points (0–100).\nBureaucracy cost multiplier: +5%.\nAdvance shared services to stage 2, further reducing the initial movement and administration penalties."
 COLDWAR_CYP_1970_civil_rights_commission:0 "A Bicommunal Rights Commission"
 COLDWAR_CYP_1970_civil_rights_commission_desc:0 "Record abuses and safeguard access to courts; not a magic reconciliation event."
 COLDWAR_CYP_1970_civil_rights_commission_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSettlement progress: +10 points (0–100).\nStability: +2%."
 COLDWAR_CYP_1970_civilian_command:0 "A Civilian Chain of Command"
 COLDWAR_CYP_1970_civilian_command_desc:0 "Begin removing divided-command penalties; temporary officer resistance: political_power_factor -0.05 for 180 days."
 COLDWAR_CYP_1970_civilian_command_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nPolitical power: -25.\nPolitical power: -5% for 180 days."
 COLDWAR_CYP_1970_foreign_officers:0 "Retain Mainland Officers"
 COLDWAR_CYP_1970_foreign_officers_desc:0 "Retain expertise and external dependence; remove only half the divided-command penalty. Greek officer presence does not make every Greek officer a coup participant."
 COLDWAR_CYP_1970_foreign_officers_effect_tt:0 "Communal tension: +5 points (0–100).\nArmy org: +3%.\nForeign influence defense: -5%.\nReplace the divided-command spirit with a transitional penalty: army organisation −2.5%, maximum planning −2.5%."
 COLDWAR_CYP_1970_police_oversight:0 "An Accountable Police Force"
 COLDWAR_CYP_1970_police_oversight_desc:0 "Complete chain-of-command reform; constitutional reform remains separate."
 COLDWAR_CYP_1970_police_oversight_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nPolice cost multiplier: -5%.\nRemove the original divided-command and transitional command penalties; implement civilian command."
 COLDWAR_CYP_1970_emergency_powers:0 "Emergency Security Powers"
 COLDWAR_CYP_1970_emergency_powers_desc:0 "Government control improves, but outside influence and civilian tension remain. Powers lapse after civilian restoration."
 COLDWAR_CYP_1970_emergency_powers_effect_tt:0 "Political power: +40.\nCommunal tension: +10 points (0–100).\nPolitical power: +5% for 365 days.\nPolice cost multiplier: +10% for 365 days."
 COLDWAR_CYP_1970_bicomm_constitution:0 "Negotiate Bicommunal Safeguards"
 COLDWAR_CYP_1970_bicomm_constitution_desc:0 "Requires a Turkish Cypriot negotiating acceptance; a CYP focus alone cannot decide the other community's rights."
 COLDWAR_CYP_1970_bicomm_constitution_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nSettlement progress: +15 points (0–100)."
 COLDWAR_CYP_1970_unitary_constitution:0 "Press for a Unitary Constitution"
 COLDWAR_CYP_1970_unitary_constitution_desc:0 "Majority-rule argument without automatic dissolution of the Turkish Cypriot administration. Rejection preserves deadlock and raises diplomatic pressure."
 COLDWAR_CYP_1970_unitary_constitution_effect_tt:0 "The communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nPolitical power: +50.\nCommunal tension: +15 points (0–100).\nBureaucracy cost multiplier: -5%."
 COLDWAR_CYP_1970_federal_compromise:0 "A Federal Compromise"
 COLDWAR_CYP_1970_federal_compromise_desc:0 "Replace constitutional breakdown; legitimate decentralisation carries administrative cost."
 COLDWAR_CYP_1970_federal_compromise_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nStability: +5%.\nBureaucracy cost multiplier: +8%."
 COLDWAR_CYP_1970_shared_republic:0 "Restore the Shared Republic"
 COLDWAR_CYP_1970_shared_republic_desc:0 "A revised 1960-style bicommunal republic: tighter veto rules and central services, slower negotiations; replace constitutional breakdown only after acceptance."
 COLDWAR_CYP_1970_shared_republic_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nThe communal representatives evaluate the actual access, security and constitutional terms. Acceptance is a separate outcome.\nStability: +4%.\nPolitical power: +3%."
 COLDWAR_CYP_1970_constitutional_settlement:0 "An Agreed Constitutional Settlement"
 COLDWAR_CYP_1970_constitutional_settlement_desc:0 "The earlier administrative and state relief is replaced, not stacked."
 COLDWAR_CYP_1970_constitutional_settlement_effect_tt:0 "Settlement progress: +10 points (0–100).\nRemove the constitutional-breakdown starting spirit, implement stage 3 normalisation and record the agreed peaceful settlement."
 COLDWAR_CYP_1970_ban_armed_factions:0 "Disarm the Political Militias"
 COLDWAR_CYP_1970_ban_armed_factions_desc:0 "Targets armed organisations on both sides through negotiated/local implementation; Greek mainland resistance can raise coup pressure."
 COLDWAR_CYP_1970_ban_armed_factions_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nPolitical power: -25.\nCommunal tension: -5 points (0–100).\nDisarm domestic militias; reduce coup pressure by a further 10 points."
 COLDWAR_CYP_1970_tolerate_armed_factions:0 "Tolerate Loyal Armed Networks"
 COLDWAR_CYP_1970_tolerate_armed_factions_desc:0 "Regime mobilisation with a lasting fragmented-command cost; can unlock a hardline coup route after its formation date."
 COLDWAR_CYP_1970_tolerate_armed_factions_effect_tt:0 "Political power: +50.\nCommunal tension: +10 points (0–100).\nArmy org: -3%.\nPolitical power: +3%."
 COLDWAR_CYP_1970_reject_reprisals:0 "Forbid Collective Reprisals"
 COLDWAR_CYP_1970_reject_reprisals_desc:0 "Judicial orders and civilian protection; can be taken by any ruling party willing to obey them."
 COLDWAR_CYP_1970_reject_reprisals_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nCommunal tension: -10 points (0–100).\nStability: +2%."
 COLDWAR_CYP_1970_collective_reprisals:0 "Authorise Collective Reprisals"
 COLDWAR_CYP_1970_collective_reprisals_desc:0 "Authorise collective punishment rather than distinguish armed opponents from civilians. Unlawful detention, expulsions and killings deepen displacement, destroy livelihoods and invite an international crisis. Accountability and restitution will be required before a durable settlement."
 COLDWAR_CYP_1970_collective_reprisals_effect_tt:0 "Political power: +25.\nStability: -5%.\nCommunal tension: +20 points (0–100).\nPolice cost multiplier: +15%.\nCreate a displacement emergency and damaged communities in Cyprus-controlled states; reopen the crisis and invalidate prior communal constitutional and union consent."
 COLDWAR_CYP_1970_crisis_conference:0 "Convene an Emergency Conference"
 COLDWAR_CYP_1970_crisis_conference_desc:0 "Greece, Turkey, Britain and local community negotiators receive offers; any player can refuse. Available after either security course."
 COLDWAR_CYP_1970_crisis_conference_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nSend a proposal to GRE, TUR, ENG. Conditional benefits require an explicit accepted response; silence provides no agreement.\nCommunal tension: -10 points (0–100)."
 COLDWAR_CYP_1970_independence_mandate:0 "Renew the Mandate for Independence"
 COLDWAR_CYP_1970_independence_mandate_desc:0 "Keep an independent republic. Mutually exclusive with an implemented Enosis agreement, not with merely debating one."
 COLDWAR_CYP_1970_independence_mandate_effect_tt:0 "Foreign influence defense: +5%."
 COLDWAR_CYP_1970_development_survey:0 "Survey the Island Economy"
 COLDWAR_CYP_1970_development_survey_desc:0 "Choose the structure of development: tourism or productive diversification; credit openness or domestic control. No giant free industrial base."
 COLDWAR_CYP_1970_development_survey_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nPolitical power: +25."
 COLDWAR_CYP_1970_development_budget:0 "A Funded Development Budget"
 COLDWAR_CYP_1970_development_budget_desc:0 "Choose the structure of development: tourism or productive diversification; credit openness or domestic control. No giant free industrial base."
 COLDWAR_CYP_1970_development_budget_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nBureaucracy cost multiplier: -3%."
 COLDWAR_CYP_1970_tourism_priority:0 "Make Tourism the Growth Engine"
 COLDWAR_CYP_1970_tourism_priority_desc:0 "More service income, greater exposure to external demand and a crisis. No anachronistic offshore gas windfall."
 COLDWAR_CYP_1970_tourism_priority_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nOffice park income tax: +5%.\nMdcw cw market exposure: +5%."
 COLDWAR_CYP_1970_productive_diversification:0 "Diversify beyond Tourism"
 COLDWAR_CYP_1970_productive_diversification_desc:0 "Slower service expansion in exchange for agricultural processing and light industry."
 COLDWAR_CYP_1970_productive_diversification_effect_tt:0 "Fund the programme with 2% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProduction speed industrial complex: +5%.\nProduction speed offices: -3%."
 COLDWAR_CYP_1970_coastal_hotels:0 "Support Coastal Hotels"
 COLDWAR_CYP_1970_coastal_hotels_desc:0 "Choose the structure of development: tourism or productive diversification; credit openness or domestic control. No giant free industrial base."
 COLDWAR_CYP_1970_coastal_hotels_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nOffice park income tax: +3%."
 COLDWAR_CYP_1970_small_business:0 "Local Guesthouses and Suppliers"
 COLDWAR_CYP_1970_small_business_desc:0 "Distribute tourism income locally. Compatible with the coastal-hotel project."
 COLDWAR_CYP_1970_small_business_effect_tt:0 "Fund the programme with 0.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nStability: +2%."
 COLDWAR_CYP_1970_irrigation:0 "Rural Water and Irrigation"
 COLDWAR_CYP_1970_irrigation_desc:0 "One 25% research bonus; no ahead-of-time reduction; the technology must exist in the local 1970 research set."
 COLDWAR_CYP_1970_irrigation_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nOne 25% research bonus in the relevant existing technology category."
 COLDWAR_CYP_1970_light_workshops:0 "Food Processing and Workshops"
 COLDWAR_CYP_1970_light_workshops_desc:0 "Boost existing output modestly; does not create a factory if the country has none."
 COLDWAR_CYP_1970_light_workshops_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nIndustrial capacityy: +3%."
 COLDWAR_CYP_1970_transport_plan:0 "Roads between Towns and Ports"
 COLDWAR_CYP_1970_transport_plan_desc:0 "Construction bonus for funded work; not a railway project on an island whose railway closed in 1951."
 COLDWAR_CYP_1970_transport_plan_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProduction speed infrastructure: +8%."
 COLDWAR_CYP_1970_famagusta_port:0 "The Port of Famagusta"
 COLDWAR_CYP_1970_famagusta_port_desc:0 "Famagusta connects the island's productive districts to overseas trade. A port extension requires secure local control, a construction programme and the normal capital and maintenance budget."
 COLDWAR_CYP_1970_famagusta_port_effect_tt:0 "Fund the programme with 2% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nQueue one naval-base level in Famagusta. Construction and upkeep remain payable through the normal economy."
 COLDWAR_CYP_1970_limassol_port:0 "Develop Limassol Alternatives"
 COLDWAR_CYP_1970_limassol_port_desc:0 "Choose the structure of development: tourism or productive diversification; credit openness or domestic control. No giant free industrial base."
 COLDWAR_CYP_1970_limassol_port_effect_tt:0 "Fund the programme with 1.5% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nProduction speed naval base: +10%."
 COLDWAR_CYP_1970_vocational_schools:0 "Technical and Vocational Schools"
 COLDWAR_CYP_1970_vocational_schools_desc:0 "No university institution before its historical foundation; no additional research slot."
 COLDWAR_CYP_1970_vocational_schools_effect_tt:0 "Fund the programme with 1% of current annual GDP from the treasury. Funds are checked again when the programme completes.\nResearch speed: +2%.\nEducation cost multiplier: +3%."
 COLDWAR_CYP_1970_credit_question:0 "The Credit Question"
 COLDWAR_CYP_1970_credit_question_desc:0 "Choose the structure of development: tourism or productive diversification; credit openness or domestic control. No giant free industrial base."
