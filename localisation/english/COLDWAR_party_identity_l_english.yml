l_english:
# IMPERIA COLD WAR — Party Identity decisions (names, descriptions, logos).
 COLDWAR_party_identity_category:0 "Party Identity"
 COLDWAR_party_identity_category_desc:0 "Parties change their names and symbols as their history moves on. Renaming a party costs §Y25§! political power and can be undone at any time."
 COLDWAR_PI_AFG_watan_party:0 "£CW_PI_emblem_AFG_watan (Watan) - Homeland Party"
 COLDWAR_PI_AFG_watan_party_desc:0 "(National Reconciliation) - Homeland Party (Pashto: Hezb-e Watan, Watan)\n\nNajibullah has renamed the PDPA the Homeland Party and dropped Marxism Leninism. National reconciliation is its watchword.[COLDWAR_PI_AFG_watan_chair_display]"
 COLDWAR_PI_AFG_watan_party_icon:0 "£CW_PI_emblem_AFG_watan"
 COLDWAR_PI_AFG_watan_tt:0 "§YPeople's Democratic Party of Afghanistan (Parcham) (PDPA)§! becomes §YHomeland Party§! (Watan, §Y1990§!)."
 COLDWAR_PI_AFG_watan_revert_tt:0 "§YWatan§! goes back to its former name and logo."
 COLDWAR_PI_ALB_pd_party:0 "£CW_PI_emblem_ALB_pd (PD) - Democratic Party of Albania"
 COLDWAR_PI_ALB_pd_party_desc:0 "(Conservatism) - Democratic Party of Albania (Albanian: Partia Demokratike e Shqipërisë, PD)\n\nStudents and intellectuals led by Sali Berisha and Gramoz Pashko have founded the Democratic Party, the first opposition party since the war. The PD promises freedom, private property and a place in Europe.[COLDWAR_PI_ALB_pd_chair_display]"
 COLDWAR_PI_ALB_pd_party_icon:0 "£CW_PI_emblem_ALB_pd"
 COLDWAR_PI_ALB_pd_tt:0 "§YFree Albania National Committee§! becomes §YDemocratic Party of Albania§! (PD, §Y1990§!)."
 COLDWAR_PI_ALB_pd_revert_tt:0 "§YPD§! goes back to its former name and logo."
 COLDWAR_PI_ALB_psd_party:0 "(PSD) - Social Democratic Party of Albania"
 COLDWAR_PI_ALB_psd_party_desc:0 "(Social Democracy) - Social Democratic Party of Albania (Albanian: Partia Socialdemokrate e Shqipërisë, PSD)\n\nSkënder Gjinushi and dissidents from the Democratic Party have founded the Social Democratic Party. It offers a moderate third way between the heirs of Hoxha and Berisha's Democrats.[COLDWAR_PI_ALB_psd_chair_display]"
 COLDWAR_PI_ALB_psd_party_icon:0 ""
 COLDWAR_PI_ALB_psd_tt:0 "§YTirana Reformers§! becomes §YSocial Democratic Party of Albania§! (PSD, §Y1991§!)."
 COLDWAR_PI_ALB_psd_revert_tt:0 "§YPSD§! goes back to its former name and logo."
 COLDWAR_PI_ALB_pssh_party:0 "£CW_PI_emblem_ALB_pssh (PSSh) - Socialist Party of Albania"
 COLDWAR_PI_ALB_pssh_party_desc:0 "(Democratic Socialism) - Socialist Party of Albania (Albanian: Partia Socialiste e Shqipërisë, PSSh)\n\nAt its tenth congress the Party of Labour has renounced Hoxha's legacy and become the Socialist Party under Fatos Nano. It accepts pluralism and the market while keeping the rural base of the old regime.[COLDWAR_PI_ALB_pssh_chair_display]"
 COLDWAR_PI_ALB_pssh_party_icon:0 "£CW_PI_emblem_ALB_pssh"
 COLDWAR_PI_ALB_pssh_tt:0 "§YParty of Labour of Albania (PPSh)§! becomes §YSocialist Party of Albania§! (PSSh, §Y1991§!)."
 COLDWAR_PI_ALB_pssh_revert_tt:0 "§YPSSh§! goes back to its former name and logo."
 COLDWAR_PI_ARM_hhsh_party:0 "(HHSh) - Pan-Armenian National Movement"
 COLDWAR_PI_ARM_hhsh_party_desc:0 "(National Democracy) - Pan-Armenian National Movement (Armenian: Hayots Hamazgayin Sharzhum, HHSh)\n\nThe Karabakh Committee has become the Pan Armenian National Movement under Levon Ter Petrosyan. It wins the 1990 elections and leads Armenia towards independence.[COLDWAR_PI_ARM_hhsh_chair_display]"
 COLDWAR_PI_ARM_hhsh_party_icon:0 ""
 COLDWAR_PI_ARM_hhsh_tt:0 "§YThe Akhpars§! becomes §YPan-Armenian National Movement§! (HHSh, §Y1989§!)."
 COLDWAR_PI_ARM_hhsh_revert_tt:0 "§YHHSh§! goes back to its former name and logo."
 COLDWAR_PI_AZE_ymp_party:0 "(YMP) - New Müsavat Party"
 COLDWAR_PI_AZE_ymp_party_desc:0 "(National Conservatism) - New Müsavat Party (Azerbaijani: Yeni Müsavat Partiyası, YMP)\n\nIsa Gambar has revived the historic Müsavat of Rasulzade as the New Müsavat Party. It keeps the legacy of the 1918 republic alive.[COLDWAR_PI_AZE_ymp_chair_display]"
 COLDWAR_PI_AZE_ymp_party_icon:0 ""
 COLDWAR_PI_AZE_ymp_tt:0 "§YMüsavat Party§! becomes §YNew Müsavat Party§! (YMP, §Y1989§!)."
 COLDWAR_PI_AZE_ymp_revert_tt:0 "§YYMP§! goes back to its former name and logo."
 COLDWAR_PI_AZE_axc_party:0 "£CW_PI_emblem_AZE_axc (AXC) - Azerbaijani Popular Front"
 COLDWAR_PI_AZE_axc_party_desc:0 "(Liberal Nationalism) - Azerbaijani Popular Front (Azerbaijani: Azärbaycan Xalq Cäbhäsi, AXC)\n\nAbulfaz Elchibey and the intelligentsia have founded the Azerbaijani Popular Front. Its rallies on Lenin Square follow Karabakh and the bloody January of 1990.[COLDWAR_PI_AZE_axc_chair_display]"
 COLDWAR_PI_AZE_axc_party_icon:0 "£CW_PI_emblem_AZE_axc"
 COLDWAR_PI_AZE_axc_tt:0 "§YUnion of Writers of Azerbaijan§! becomes §YAzerbaijani Popular Front§! (AXC, §Y1989§!)."
 COLDWAR_PI_AZE_axc_revert_tt:0 "§YAXC§! goes back to its former name and logo."
 COLDWAR_PI_BEL_ps_sp_party:0 "£CW_PI_emblem_BEL_ps_sp (PS/SP) - Socialist Party (split along language lines)"
 COLDWAR_PI_BEL_ps_sp_party_desc:0 "(Social Democracy) - Socialist Party (split along language lines) (Dutch and French: Parti socialiste / Socialistische Partij, PS/SP)\n\nThe last unitary party has split into the francophone PS and the Flemish SP. Each fights for its own community.[COLDWAR_PI_BEL_ps_sp_chair_display]"
 COLDWAR_PI_BEL_ps_sp_party_icon:0 "£CW_PI_emblem_BEL_ps_sp"
 COLDWAR_PI_BEL_ps_sp_tt:0 "§YBelgian Socialist Party (BSP-PSB)§! becomes §YSocialist Party (split along language lines)§! (PS/SP, §Y1978§!)."
 COLDWAR_PI_BEL_ps_sp_revert_tt:0 "§YPS/SP§! goes back to its former name and logo."
 COLDWAR_PI_BEL_vb_party:0 "£CW_PI_emblem_BEL_vb (VB) - Flemish Bloc"
 COLDWAR_PI_BEL_vb_party_desc:0 "(Flemish Separatism) - Flemish Bloc (Dutch and French: Vlaams Blok, VB)\n\nKarel Dillen's opponents of the Egmont Pact have founded the Vlaams Blok. It demands Flemish independence and a halt to immigration.[COLDWAR_PI_BEL_vb_chair_display]"
 COLDWAR_PI_BEL_vb_party_icon:0 "£CW_PI_emblem_BEL_vb"
 COLDWAR_PI_BEL_vb_tt:0 "§YFlemish Militant Organisation (VMO)§! becomes §YFlemish Bloc§! (VB, §Y1979§!)."
 COLDWAR_PI_BEL_vb_revert_tt:0 "§YVB§! goes back to its former name and logo."
 COLDWAR_PI_BLR_bnf_party:0 "£CW_PI_emblem_BLR_bnf (BNF) - Belarusian Popular Front"
 COLDWAR_PI_BLR_bnf_party_desc:0 "(National Democracy) - Belarusian Popular Front (Belarusian: Biełaruski Narodny Front Adradžeńnie, BNF)\n\nZianon Pazniak, discoverer of the Kurapaty graves, has founded the Belarusian Popular Front Revival. It raises the white red white flag and the Pahonia and demands the truth about Chernobyl.[COLDWAR_PI_BLR_bnf_chair_display]"
 COLDWAR_PI_BLR_bnf_party_icon:0 "£CW_PI_emblem_BLR_bnf"
 COLDWAR_PI_BLR_bnf_tt:0 "§YRada of the Belarusian Democratic Republic§! becomes §YBelarusian Popular Front§! (BNF, §Y1988§!)."
 COLDWAR_PI_BLR_bnf_revert_tt:0 "§YBNF§! goes back to its former name and logo."
 COLDWAR_PI_BRA_pds_party:0 "£CW_PI_emblem_BRA_pds (PDS) - Democratic Social Party"
 COLDWAR_PI_BRA_pds_party_desc:0 "(Conservatism) - Democratic Social Party (Portuguese: Partido Democrático Social, PDS)\n\nAfter the party reform ARENA has been reborn as the Democratic Social Party. It remains the government party of the military regime under Figueiredo.[COLDWAR_PI_BRA_pds_chair_display]"
 COLDWAR_PI_BRA_pds_party_icon:0 "£CW_PI_emblem_BRA_pds"
 COLDWAR_PI_BRA_pds_tt:0 "§YNational Renewal Alliance (ARENA)§! becomes §YDemocratic Social Party§! (PDS, §Y1980§!)."
 COLDWAR_PI_BRA_pds_revert_tt:0 "§YPDS§! goes back to its former name and logo."
 COLDWAR_PI_BRA_pmdb_party:0 "[COLDWAR_PI_BRA_pmdb_emblem_at_date] (PMDB) - Party of the Brazilian Democratic Movement"
 COLDWAR_PI_BRA_pmdb_party_desc:0 "(Liberal Democracy) - Party of the Brazilian Democratic Movement (Portuguese: Partido do Movimento Democrático Brasileiro, PMDB)\n\nThe legal opposition has added the word party to its name, becoming the PMDB under Ulysses Guimarães. It leads the Diretas Já campaign for direct presidential elections.[COLDWAR_PI_BRA_pmdb_chair_display]"
 COLDWAR_PI_BRA_pmdb_party_icon:0 "[COLDWAR_PI_BRA_pmdb_emblem_at_date]"
 COLDWAR_PI_BRA_pmdb_tt:0 "§YBrazilian Democratic Movement (MDB)§! becomes §YParty of the Brazilian Democratic Movement§! (PMDB, §Y1980§!)."
 COLDWAR_PI_BRA_pmdb_revert_tt:0 "§YPMDB§! goes back to its former name and logo."
 COLDWAR_PI_BRA_pdt_party:0 "£BRA_socialism (PDT) - Democratic Labour Party"
 COLDWAR_PI_BRA_pdt_party_desc:0 "(Labourism) - Democratic Labour Party (Portuguese: Partido Democrático Trabalhista, PDT)\n\nLeonel Brizola has founded the Democratic Labour Party after losing the PTB name to Ivete Vargas. It carries on Getúlio Vargas' labour tradition.[COLDWAR_PI_BRA_pdt_chair_display]"
 COLDWAR_PI_BRA_pdt_party_icon:0 "£BRA_socialism"
 COLDWAR_PI_BRA_pdt_tt:0 "§YBrazilian Labour Party (PTB)§! becomes §YDemocratic Labour Party§! (PDT, §Y1980§!)."
 COLDWAR_PI_BRA_pdt_revert_tt:0 "§YPDT§! goes back to its former name and logo."
 COLDWAR_PI_BRA_pfl_party:0 "£CW_PI_emblem_BRA_pfl (PFL) - Liberal Front Party"
 COLDWAR_PI_BRA_pfl_party_desc:0 "(Liberal Conservatism) - Liberal Front Party (Portuguese: Partido da Frente Liberal, PFL)\n\nDissidents of the PDS have formed the Liberal Front to back Tancredo Neves. The PFL becomes the power broker of the New Republic.[COLDWAR_PI_BRA_pfl_chair_display]"
 COLDWAR_PI_BRA_pfl_party_icon:0 "£CW_PI_emblem_BRA_pfl"
 COLDWAR_PI_BRA_pfl_tt:0 "§YInstitute for Research and Social Studies (IPES)§! becomes §YLiberal Front Party§! (PFL, §Y1985§!)."
 COLDWAR_PI_BRA_pfl_revert_tt:0 "§YPFL§! goes back to its former name and logo."
 COLDWAR_PI_BRA_pt_party:0 "£BRA_left_wing_radical (PT) - Workers' Party"
 COLDWAR_PI_BRA_pt_party_desc:0 "(Democratic Socialism) - Workers' Party (Portuguese: Partido dos Trabalhadores, PT)\n\nStrike leaders of the ABC metalworkers, led by Lula, have founded the Workers' Party. It unites unionists, base communities and the new left.[COLDWAR_PI_BRA_pt_chair_display]"
 COLDWAR_PI_BRA_pt_party_icon:0 "£BRA_left_wing_radical"
 COLDWAR_PI_BRA_pt_tt:0 "§YPeasant Leagues§! becomes §YWorkers' Party§! (PT, §Y1980§!)."
 COLDWAR_PI_BRA_pt_revert_tt:0 "§YPT§! goes back to its former name and logo."
 COLDWAR_PI_BUL_sds_party:0 "£BUL_western_conservative (SDS) - Union of Democratic Forces"
 COLDWAR_PI_BUL_sds_party_desc:0 "(Liberal Democracy) - Union of Democratic Forces (Bulgarian: Sayuz na demokratichnite sili, SDS)\n\nDissident clubs, the revived Agrarians and Social Democrats and the Podkrepa union have formed the Union of Democratic Forces under Zhelyu Zhelev. The blue coalition demands an end to communist power and fast reform.[COLDWAR_PI_BUL_sds_chair_display]"
 COLDWAR_PI_BUL_sds_party_icon:0 "£BUL_western_conservative"
 COLDWAR_PI_BUL_sds_tt:0 "§YThe Hot Peppers§! becomes §YUnion of Democratic Forces§! (SDS, §Y1989§!)."
 COLDWAR_PI_BUL_sds_revert_tt:0 "§YSDS§! goes back to its former name and logo."
 COLDWAR_PI_BUL_bsp_party:0 "£BUL_western_social_democrat (BSP) - Bulgarian Socialist Party"
 COLDWAR_PI_BUL_bsp_party_desc:0 "(Democratic Socialism) - Bulgarian Socialist Party (Bulgarian: Balgarska sotsialisticheska partiya, BSP)\n\nAfter Zhivkov's fall the Bulgarian Communist Party has renamed itself the Bulgarian Socialist Party under Aleksandar Lilov. It wins the first free elections in the countryside while the cities turn against it.[COLDWAR_PI_BUL_bsp_chair_display]"
 COLDWAR_PI_BUL_bsp_party_icon:0 "£BUL_western_social_democrat"
 COLDWAR_PI_BUL_bsp_tt:0 "§YBulgarian Communist Party (BKP)§! becomes §YBulgarian Socialist Party§! (BSP, §Y1990§!)."
 COLDWAR_PI_BUL_bsp_revert_tt:0 "§YBSP§! goes back to its former name and logo."
 COLDWAR_PI_BUL_dps_party:0 "£BUL_non_aligned_moderate_islamist (DPS) - Movement for Rights and Freedoms"
 COLDWAR_PI_BUL_dps_party_desc:0 "(Minority Liberalism) - Movement for Rights and Freedoms (Bulgarian: Dvizhenie za prava i svobodi, DPS)\n\nAhmed Doğan has founded the Movement for Rights and Freedoms after the forced renaming of Bulgaria's Turks. The DPS restores names, mosques and Turkish schools and becomes the kingmaker of the new parliament.[COLDWAR_PI_BUL_dps_chair_display]"
 COLDWAR_PI_BUL_dps_party_icon:0 "£BUL_non_aligned_moderate_islamist"
 COLDWAR_PI_BUL_dps_tt:0 "§YHodjas of the Deliorman and the Rhodopes§! becomes §YMovement for Rights and Freedoms§! (DPS, §Y1990§!)."
 COLDWAR_PI_BUL_dps_revert_tt:0 "§YDPS§! goes back to its former name and logo."
 COLDWAR_PI_BUL_eg_party:0 "£CW_PI_emblem_BUL_eg (EG) - Ecoglasnost"
 COLDWAR_PI_BUL_eg_party_desc:0 "(Political Ecology) - Ecoglasnost (Bulgarian: Ekoglasnost, EG)\n\nEcoglasnost was born in protest at the poisoning of Ruse by chlorine fumes from Romania. Its petition rally in November 1989 was the first open demonstration against the regime, and it now sits in the Union of Democratic Forces.[COLDWAR_PI_BUL_eg_chair_display]"
 COLDWAR_PI_BUL_eg_party_icon:0 "£CW_PI_emblem_BUL_eg"
 COLDWAR_PI_BUL_eg_tt:0 "§YBulgarian Tourist Union (BTS)§! becomes §YEcoglasnost§! (EG, §Y1989§!)."
 COLDWAR_PI_BUL_eg_revert_tt:0 "§YEG§! goes back to its former name and logo."
 COLDWAR_PI_CHL_udi_party:0 "£CW_PI_emblem_CHL_udi (UDI) - Independent Democratic Union"
 COLDWAR_PI_CHL_udi_party_desc:0 "(Gremialist Conservatism) - Independent Democratic Union (Spanish: Unión Demócrata Independiente, UDI)\n\nJaime Guzmán's gremialists have founded the Independent Democratic Union. It defends the legacy of the military government.[COLDWAR_PI_CHL_udi_chair_display]"
 COLDWAR_PI_CHL_udi_party_icon:0 "£CW_PI_emblem_CHL_udi"
 COLDWAR_PI_CHL_udi_tt:0 "§YGremialist Movement§! becomes §YIndependent Democratic Union§! (UDI, §Y1983§!)."
 COLDWAR_PI_CHL_udi_revert_tt:0 "§YUDI§! goes back to its former name and logo."
 COLDWAR_PI_CHL_rn_party:0 "£CW_PI_emblem_CHL_rn (RN) - National Renewal"
 COLDWAR_PI_CHL_rn_party_desc:0 "(Liberal Conservatism) - National Renewal (Spanish: Renovación Nacional, RN)\n\nThe heirs of the National Party have founded National Renewal. It supports the Yes in the plebiscite and then a negotiated transition.[COLDWAR_PI_CHL_rn_chair_display]"
 COLDWAR_PI_CHL_rn_party_icon:0 "£CW_PI_emblem_CHL_rn"
 COLDWAR_PI_CHL_rn_tt:0 "§YNational Party (PN)§! becomes §YNational Renewal§! (RN, §Y1987§!)."
 COLDWAR_PI_CHL_rn_revert_tt:0 "§YRN§! goes back to its former name and logo."
 COLDWAR_PI_CHL_ppd_party:0 "£CHL_western_social_democrat (PPD) - Party for Democracy"
 COLDWAR_PI_CHL_ppd_party_desc:0 "(Social Democracy) - Party for Democracy (Spanish: Partido por la Democracia, PPD)\n\nRicardo Lagos has founded the Party for Democracy as a legal vehicle for the banned Socialists. It campaigns for the No.[COLDWAR_PI_CHL_ppd_chair_display]"
 COLDWAR_PI_CHL_ppd_party_icon:0 "£CHL_western_social_democrat"
 COLDWAR_PI_CHL_ppd_tt:0 "§YSocialist Party of Chile (PS)§! becomes §YParty for Democracy§! (PPD, §Y1987§!)."
 COLDWAR_PI_CHL_ppd_revert_tt:0 "§YPPD§! goes back to its former name and logo."
 COLDWAR_PI_CZE_kdu_party:0 "£CW_PI_emblem_CZE_kdu (KDU) - Christian and Democratic Union"
 COLDWAR_PI_CZE_kdu_party_desc:0 "(Christian Democracy) - Christian and Democratic Union (Czech: Křesťanská a demokratická unie, KDU)\n\nThe People's Party has cast off its satellite past and joined Christian democratic groups in the Christian and Democratic Union. It speaks for Catholic Moravia and seeks restitution of church property.[COLDWAR_PI_CZE_kdu_chair_display]"
 COLDWAR_PI_CZE_kdu_party_icon:0 "£CW_PI_emblem_CZE_kdu"
 COLDWAR_PI_CZE_kdu_tt:0 "§YCzechoslovak People's Party (ČSL)§! becomes §YChristian and Democratic Union§! (KDU, §Y1990§!)."
 COLDWAR_PI_CZE_kdu_revert_tt:0 "§YKDU§! goes back to its former name and logo."
 COLDWAR_PI_CZE_of_party:0 "£CW_PI_emblem_CZE_of (OF) - Civic Forum"
 COLDWAR_PI_CZE_of_party_desc:0 "(Civic Democracy) - Civic Forum (Czech: Občanské fórum, OF)\n\nVáclav Havel and the signatories of Charter 77 have founded Civic Forum in the Magic Lantern theatre. The movement leads the Velvet Revolution, negotiates the end of one party rule and puts Havel in the Castle.[COLDWAR_PI_CZE_of_chair_display]"
 COLDWAR_PI_CZE_of_party_icon:0 "£CW_PI_emblem_CZE_of"
 COLDWAR_PI_CZE_of_tt:0 "§YSvědectví§! becomes §YCivic Forum§! (OF, §Y1989§!)."
 COLDWAR_PI_CZE_of_revert_tt:0 "§YOF§! goes back to its former name and logo."
 COLDWAR_PI_CZE_kscm_party:0 "£CW_PI_emblem_CZE_kscm (KSČM) - Communist Party of Bohemia and Moravia"
 COLDWAR_PI_CZE_kscm_party_desc:0 "(Communism) - Communist Party of Bohemia and Moravia (Czech: Komunistická strana Čech a Moravy, KSČM)\n\nIn the Czech lands the Communist Party has refounded itself as the Communist Party of Bohemia and Moravia. It keeps the communist name and much of the membership while promising democratic socialism.[COLDWAR_PI_CZE_kscm_chair_display]"
 COLDWAR_PI_CZE_kscm_party_icon:0 "£CW_PI_emblem_CZE_kscm"
 COLDWAR_PI_CZE_kscm_tt:0 "§YCommunist Party of Czechoslovakia (KSČ)§! becomes §YCommunist Party of Bohemia and Moravia§! (KSČM, §Y1990§!)."
 COLDWAR_PI_CZE_kscm_revert_tt:0 "§YKSČM§! goes back to its former name and logo."
 COLDWAR_PI_CZE_ods_party:0 "£CW_PI_emblem_CZE_ods (ODS) - Civic Democratic Party"
 COLDWAR_PI_CZE_ods_party_desc:0 "(Conservative Liberalism) - Civic Democratic Party (Czech: Občanská demokratická strana, ODS)\n\nFinance minister Václav Klaus has turned the right wing of Civic Forum into the Civic Democratic Party. The ODS champions voucher privatisation and a market economy without adjectives.[COLDWAR_PI_CZE_ods_chair_display]"
 COLDWAR_PI_CZE_ods_party_icon:0 "£CW_PI_emblem_CZE_ods"
 COLDWAR_PI_CZE_ods_tt:0 "§YNew Economic Model§! becomes §YCivic Democratic Party§! (ODS, §Y1991§!)."
 COLDWAR_PI_CZE_ods_revert_tt:0 "§YODS§! goes back to its former name and logo."
 COLDWAR_PI_CZE_obroda_party:0 "£CW_PI_emblem_CZE_obroda (Obroda) - Club for Socialist Restructuring Revival"
 COLDWAR_PI_CZE_obroda_party_desc:0 "(Reform Communism) - Club for Socialist Restructuring Revival (Czech: Klub za socialistickou přestavbu Obroda, Obroda)\n\nCommunists purged after 1968 have founded Obroda to demand the rehabilitation of the Prague Spring. Its members hope Alexander Dubček can lead a reformed socialism in the spirit of Gorbachev.[COLDWAR_PI_CZE_obroda_chair_display]"
 COLDWAR_PI_CZE_obroda_party_icon:0 "£CW_PI_emblem_CZE_obroda"
 COLDWAR_PI_CZE_obroda_tt:0 "§YSocialism with a Human Face§! becomes §YClub for Socialist Restructuring Revival§! (Obroda, §Y1989§!)."
 COLDWAR_PI_CZE_obroda_revert_tt:0 "§YObroda§! goes back to its former name and logo."
 COLDWAR_PI_DDR_sdp_party:0 "£CW_PI_emblem_DDR_sdp (SDP) - Social Democratic Party in the GDR"
 COLDWAR_PI_DDR_sdp_party_desc:0 "(Social Democracy) - Social Democratic Party in the GDR (German: Sozialdemokratische Partei in der DDR, SDP)\n\nPastors and dissidents meeting in Schwante have founded a Social Democratic Party in open defiance of the SED's claim to lead. In January 1990 it takes the old name SPD and seeks unity with its western sister party.[COLDWAR_PI_DDR_sdp_chair_display]"
 COLDWAR_PI_DDR_sdp_party_icon:0 "£CW_PI_emblem_DDR_sdp"
 COLDWAR_PI_DDR_sdp_tt:0 "§YSocial Democratic Networks§! becomes §YSocial Democratic Party in the GDR§! (SDP, §Y1989§!)."
 COLDWAR_PI_DDR_sdp_revert_tt:0 "§YSDP§! goes back to its former name and logo."
 COLDWAR_PI_DDR_pds_party:0 "£CW_PI_emblem_DDR_pds (PDS) - Party of Democratic Socialism"
 COLDWAR_PI_DDR_pds_party_desc:0 "(Democratic Socialism) - Party of Democratic Socialism (German: Partei des Demokratischen Sozialismus, PDS)\n\nAfter the fall of the Wall the SED has renamed itself first SED PDS and then the Party of Democratic Socialism under Gregor Gysi. It apologises for the past, sheds most of its members and fights to keep a voice for the East in a united Germany.[COLDWAR_PI_DDR_pds_chair_display]"
 COLDWAR_PI_DDR_pds_party_icon:0 "£CW_PI_emblem_DDR_pds"
 COLDWAR_PI_DDR_pds_tt:0 "§YSocialist Unity Party of Germany (SED)§! becomes §YParty of Democratic Socialism§! (PDS, §Y1990§!)."
 COLDWAR_PI_DDR_pds_revert_tt:0 "§YPDS§! goes back to its former name and logo."
 COLDWAR_PI_DDR_da_party:0 "£CW_PI_emblem_DDR_da (DA) - Democratic Awakening"
 COLDWAR_PI_DDR_da_party_desc:0 "(Christian Liberalism) - Democratic Awakening (German: Demokratischer Aufbruch, DA)\n\nChurch activists around Rainer Eppelmann and Wolfgang Schnur have founded Democratic Awakening. Moving quickly to the right, it joins the CDU in the Alliance for Germany and demands fast reunification and the Deutschmark.[COLDWAR_PI_DDR_da_chair_display]"
 COLDWAR_PI_DDR_da_party_icon:0 "£CW_PI_emblem_DDR_da"
 COLDWAR_PI_DDR_da_tt:0 "§YCrafts and Trades§! becomes §YDemocratic Awakening§! (DA, §Y1989§!)."
 COLDWAR_PI_DDR_da_revert_tt:0 "§YDA§! goes back to its former name and logo."
 COLDWAR_PI_DDR_nf_party:0 "£CW_PI_emblem_DDR_nf (NF) - New Forum"
 COLDWAR_PI_DDR_nf_party_desc:0 "(Civic Democracy) - New Forum (German: Neues Forum, NF)\n\nBärbel Bohley and Jens Reich have called the citizens to a dialogue in the New Forum. Its appeal gathers hundreds of thousands of signatures and its demands ring out at the Monday demonstrations in Leipzig.[COLDWAR_PI_DDR_nf_chair_display]"
 COLDWAR_PI_DDR_nf_party_icon:0 "£CW_PI_emblem_DDR_nf"
 COLDWAR_PI_DDR_nf_tt:0 "§YThird Way Socialists§! becomes §YNew Forum§! (NF, §Y1989§!)."
 COLDWAR_PI_DDR_nf_revert_tt:0 "§YNF§! goes back to its former name and logo."
 COLDWAR_PI_EGY_wafd_party:0 "£CW_PI_emblem_EGY_wafd (Wafd) - New Wafd Party"
 COLDWAR_PI_EGY_wafd_party_desc:0 "(Liberal Nationalism) - New Wafd Party (Arabic: Hizb al-Wafd al-Jadid, Wafd)\n\nFuad Serageddin has revived the Wafd of Zaghloul and Nahhas as the New Wafd Party. It calls for liberal democracy and a free economy.[COLDWAR_PI_EGY_wafd_chair_display]"
 COLDWAR_PI_EGY_wafd_party_icon:0 "£CW_PI_emblem_EGY_wafd"
 COLDWAR_PI_EGY_wafd_tt:0 "§YFree Egyptians Party§! becomes §YNew Wafd Party§! (Wafd, §Y1978§!)."
 COLDWAR_PI_EGY_wafd_revert_tt:0 "§YWafd§! goes back to its former name and logo."
 COLDWAR_PI_EGY_slp_party:0 "(SLP) - Socialist Labour Party"
 COLDWAR_PI_EGY_slp_party_desc:0 "(Loyal Opposition) - Socialist Labour Party (Arabic: Hizb al-Amal al-Ishtiraki, SLP)\n\nWith Sadat's blessing Ibrahim Shukri has founded the Socialist Labour Party as a tame opposition. It drifts towards an Islamic platform.[COLDWAR_PI_EGY_slp_chair_display]"
 COLDWAR_PI_EGY_slp_party_icon:0 ""
 COLDWAR_PI_EGY_slp_tt:0 "§YEgyptian Social Democratic Party (ESDP)§! becomes §YSocialist Labour Party§! (SLP, §Y1978§!)."
 COLDWAR_PI_EGY_slp_revert_tt:0 "§YSLP§! goes back to its former name and logo."
 COLDWAR_PI_EGY_tagammu_party:0 "£EGY_em_Autocracy (Tagammu) - National Progressive Unionist Party"
 COLDWAR_PI_EGY_tagammu_party_desc:0 "(Nasserist Left) - National Progressive Unionist Party (Arabic: Hizb al-Tagammu, Tagammu)\n\nKhaled Mohieddin has led the left platform of the Arab Socialist Union into the National Progressive Unionist Party. It defends Nasser's social gains against the Infitah.[COLDWAR_PI_EGY_tagammu_chair_display]"
 COLDWAR_PI_EGY_tagammu_party_icon:0 "£EGY_em_Autocracy"
 COLDWAR_PI_EGY_tagammu_tt:0 "§YArab Socialist Union (ASU)§! becomes §YNational Progressive Unionist Party§! (Tagammu, §Y1976§!)."
 COLDWAR_PI_EGY_tagammu_revert_tt:0 "§YTagammu§! goes back to its former name and logo."
 COLDWAR_PI_ENG_sld_party:0 "£eng_western_liberal (SLD) - Social and Liberal Democrats"
 COLDWAR_PI_ENG_sld_party_desc:0 "(Social Liberalism) - Social and Liberal Democrats\n\nThe Liberals and most of the SDP have merged into the Social and Liberal Democrats under Paddy Ashdown. From 1989 they call themselves simply the Liberal Democrats.[COLDWAR_PI_ENG_sld_chair_display]"
 COLDWAR_PI_ENG_sld_party_icon:0 "£eng_western_liberal"
 COLDWAR_PI_ENG_sld_tt:0 "§YLiberal Party (LIB)§! becomes §YSocial and Liberal Democrats§! (SLD, §Y1988§!)."
 COLDWAR_PI_ENG_sld_revert_tt:0 "§YSLD§! goes back to its former name and logo."
 COLDWAR_PI_ENG_dl_party:0 "£CW_PI_emblem_ENG_dl (DL) - Democratic Left"
 COLDWAR_PI_ENG_dl_party_desc:0 "(Democratic Socialism) - Democratic Left\n\nThe Communist Party of Great Britain has dissolved itself and reemerged as Democratic Left. It drops Leninism for a pluralist, green and feminist socialism.[COLDWAR_PI_ENG_dl_chair_display]"
 COLDWAR_PI_ENG_dl_party_icon:0 "£CW_PI_emblem_ENG_dl"
 COLDWAR_PI_ENG_dl_tt:0 "§YCommunist Party of Great Britain (CPGB)§! becomes §YDemocratic Left§! (DL, §Y1991§!)."
 COLDWAR_PI_ENG_dl_revert_tt:0 "§YDL§! goes back to its former name and logo."
 COLDWAR_PI_ENG_sdp_party:0 "£CW_PI_emblem_ENG_sdp (SDP) - Social Democratic Party"
 COLDWAR_PI_ENG_sdp_party_desc:0 "(Social Democracy) - Social Democratic Party\n\nThe Gang of Four has broken with Labour to found the Social Democratic Party. In alliance with the Liberals it promises to break the mould of British politics.[COLDWAR_PI_ENG_sdp_chair_display]"
 COLDWAR_PI_ENG_sdp_party_icon:0 "£CW_PI_emblem_ENG_sdp"
 COLDWAR_PI_ENG_sdp_tt:0 "§YTribune Group§! becomes §YSocial Democratic Party§! (SDP, §Y1981§!)."
 COLDWAR_PI_ENG_sdp_revert_tt:0 "§YSDP§! goes back to its former name and logo."
 COLDWAR_PI_EST_ersp_party:0 "£CW_PI_emblem_EST_ersp (ERSP) - Estonian National Independence Party"
 COLDWAR_PI_EST_ersp_party_desc:0 "(National Conservatism) - Estonian National Independence Party (Estonian: Eesti Rahvusliku Sõltumatuse Partei, ERSP)\n\nFormer political prisoners led by Lagle Parek have founded the Estonian National Independence Party, the first non communist party in the Soviet Union. It rejects any compromise with the occupation and calls for the restoration of the prewar republic.[COLDWAR_PI_EST_ersp_chair_display]"
 COLDWAR_PI_EST_ersp_party_icon:0 "£CW_PI_emblem_EST_ersp"
 COLDWAR_PI_EST_ersp_tt:0 "§YEstonian National Council§! becomes §YEstonian National Independence Party§! (ERSP, §Y1988§!)."
 COLDWAR_PI_EST_ersp_revert_tt:0 "§YERSP§! goes back to its former name and logo."
 COLDWAR_PI_EST_er_party:0 "£CW_PI_emblem_EST_er (ER) - Popular Front of Estonia"
 COLDWAR_PI_EST_er_party_desc:0 "(National Reformism) - Popular Front of Estonia (Estonian: Eestimaa Rahvarinne, ER)\n\nEdgar Savisaar announced on television the creation of a Popular Front in support of perestroika. The movement fills the Singing Fields, demands economic self management and turns step by step towards independence.[COLDWAR_PI_EST_er_chair_display]"
 COLDWAR_PI_EST_er_party_icon:0 "£CW_PI_emblem_EST_er"
 COLDWAR_PI_EST_er_tt:0 "§YSocialism with a Human Face§! becomes §YPopular Front of Estonia§! (ER, §Y1988§!)."
 COLDWAR_PI_EST_er_revert_tt:0 "§YER§! goes back to its former name and logo."
 COLDWAR_PI_EST_k_party:0 "(K) - Estonian Centre Party"
 COLDWAR_PI_EST_k_party_desc:0 "(Centrism) - Estonian Centre Party (Estonian: Eesti Keskerakond, K)\n\nThe core of the Popular Front has organised itself as the Estonian Centre Party under Edgar Savisaar. It defends a gradual reform and a strong social safety net in the newly independent republic.[COLDWAR_PI_EST_k_chair_display]"
 COLDWAR_PI_EST_k_party_icon:0 ""
 COLDWAR_PI_EST_k_tt:0 "§YSocialism with a Human Face§! becomes §YEstonian Centre Party§! (K, §Y1991§!)."
 COLDWAR_PI_EST_k_revert_tt:0 "§YK§! goes back to its former name and logo."
 COLDWAR_PI_FRA_udf_party:0 "£CW_PI_emblem_FRA_udf (UDF) - Union for French Democracy"
 COLDWAR_PI_FRA_udf_party_desc:0 "(Liberal Conservatism) - Union for French Democracy (French: Union pour la démocratie française, UDF)\n\nPresident Giscard d'Estaing's Republicans, the centrists of the CDS and the Radicals have joined in the Union for French Democracy. The UDF gives the president his own parliamentary force to balance Chirac's Gaullist RPR.[COLDWAR_PI_FRA_udf_chair_display]"
 COLDWAR_PI_FRA_udf_party_icon:0 "£CW_PI_emblem_FRA_udf"
 COLDWAR_PI_FRA_udf_tt:0 "§YIndependent Republicans (FNRI)§! becomes §YUnion for French Democracy§! (UDF, §Y1978§!)."
 COLDWAR_PI_FRA_udf_revert_tt:0 "§YUDF§! goes back to its former name and logo."
 COLDWAR_PI_FRA_lcr_party:0 "£CW_PI_emblem_FRA_lcr (LCR) - Revolutionary Communist League"
 COLDWAR_PI_FRA_lcr_party_desc:0 "(Trotskyism) - Revolutionary Communist League (French: Ligue communiste révolutionnaire, LCR)\n\nAfter the Communist League was banned in 1973, Alain Krivine's Trotskyists have reconstituted themselves as the Revolutionary Communist League. The LCR is the French section of the Fourth International and recruits among students, teachers and young workers.[COLDWAR_PI_FRA_lcr_chair_display]"
 COLDWAR_PI_FRA_lcr_party_icon:0 "£CW_PI_emblem_FRA_lcr"
 COLDWAR_PI_FRA_lcr_tt:0 "§YCommunist League (LC)§! becomes §YRevolutionary Communist League§! (LCR, §Y1974§!)."
 COLDWAR_PI_FRA_lcr_revert_tt:0 "§YLCR§! goes back to its former name and logo."
 COLDWAR_PI_FRA_mrg_party:0 "£CW_PI_emblem_FRA_mrg (MRG) - Movement of Left Radicals"
 COLDWAR_PI_FRA_mrg_party_desc:0 "(Social Liberalism) - Movement of Left Radicals (French: Mouvement des radicaux de gauche, MRG)\n\nRadicals who signed the Common Programme with the Socialists and Communists have broken with Servan Schreiber and formed the Movement of Left Radicals. Led by Robert Fabre, the MRG is the small liberal partner of the Union of the Left.[COLDWAR_PI_FRA_mrg_chair_display]"
 COLDWAR_PI_FRA_mrg_party_icon:0 "£CW_PI_emblem_FRA_mrg"
 COLDWAR_PI_FRA_mrg_tt:0 "§YRadical Party (PRRRS)§! becomes §YMovement of Left Radicals§! (MRG, §Y1973§!)."
 COLDWAR_PI_FRA_mrg_revert_tt:0 "§YMRG§! goes back to its former name and logo."
 COLDWAR_PI_GEO_sedp_party:0 "£CW_PI_emblem_GEO_sedp (SEDP) - National Democratic Party of Georgia"
 COLDWAR_PI_GEO_sedp_party_desc:0 "(National Conservatism) - National Democratic Party of Georgia (Georgian: Sakartvelos Erovnul Demokratiuli Partia, SEDP)\n\nGiorgi Chanturia has revived the National Democratic Party of Georgia, rooted in the Ilia Chavchavadze Society. It stands for independence, the Orthodox Church and the Western path.[COLDWAR_PI_GEO_sedp_chair_display]"
 COLDWAR_PI_GEO_sedp_party_icon:0 "£CW_PI_emblem_GEO_sedp"
 COLDWAR_PI_GEO_sedp_tt:0 "§YWriters' Union of Georgia§! becomes §YNational Democratic Party of Georgia§! (SEDP, §Y1988§!)."
 COLDWAR_PI_GEO_sedp_revert_tt:0 "§YSEDP§! goes back to its former name and logo."
 COLDWAR_PI_GEO_mmts_party:0 "£CW_PI_emblem_GEO_mmts (MMTS) - Round Table Free Georgia"
 COLDWAR_PI_GEO_mmts_party_desc:0 "(Georgian Nationalism) - Round Table Free Georgia (Georgian: Mrgvali Magida Tavisupali Sakartvelo, MMTS)\n\nThe dissident Zviad Gamsakhurdia has united nationalist parties in the Round Table Free Georgia bloc. It wins the October 1990 elections and leads Georgia out of the Union.[COLDWAR_PI_GEO_mmts_chair_display]"
 COLDWAR_PI_GEO_mmts_party_icon:0 "£CW_PI_emblem_GEO_mmts"
 COLDWAR_PI_GEO_mmts_tt:0 "§YGorgasliani§! becomes §YRound Table Free Georgia§! (MMTS, §Y1990§!)."
 COLDWAR_PI_GEO_mmts_revert_tt:0 "§YMMTS§! goes back to its former name and logo."
 COLDWAR_PI_GER_grune_party:0 "£CW_PI_emblem_GER_grune (Grüne) - The Greens"
 COLDWAR_PI_GER_grune_party_desc:0 "(Political Ecology) - The Greens (German: Die Grünen, Grüne)\n\nEcologists, peace activists and the new left have founded the Greens in Karlsruhe. They enter the Bundestag in 1983.[COLDWAR_PI_GER_grune_chair_display]"
 COLDWAR_PI_GER_grune_party_icon:0 "£CW_PI_emblem_GER_grune"
 COLDWAR_PI_GER_grune_tt:0 "§YGerman League for Nature Conservation (DNR)§! becomes §YThe Greens§! (Grüne, §Y1980§!)."
 COLDWAR_PI_GER_grune_revert_tt:0 "§YGrüne§! goes back to its former name and logo."
 COLDWAR_PI_GER_rep_party:0 "£GER_nationalist_right_wing_populist_b (REP) - The Republicans"
 COLDWAR_PI_GER_rep_party_desc:0 "(National Conservatism) - The Republicans (German: Die Republikaner, REP)\n\nFormer CSU deputies have founded the Republicans. Under Franz Schönhuber they win seats in Berlin and Strasbourg in 1989.[COLDWAR_PI_GER_rep_chair_display]"
 COLDWAR_PI_GER_rep_party_icon:0 "£GER_nationalist_right_wing_populist_b"
 COLDWAR_PI_GER_rep_tt:0 "§YFederation of Expellees (BdV)§! becomes §YThe Republicans§! (REP, §Y1983§!)."
 COLDWAR_PI_GER_rep_revert_tt:0 "§YREP§! goes back to its former name and logo."
 COLDWAR_PI_GRE_edik_party:0 "£CW_PI_emblem_GRE_edik (EDIK) - Union of the Democratic Centre"
 COLDWAR_PI_GRE_edik_party_desc:0 "(Liberalism) - Union of the Democratic Centre (Greek: Enosi Dimokratikou Kentrou, EDIK)\n\nThe Centre Union New Forces has reorganised itself as the Union of the Democratic Centre under Georgios Mavros. The party defends the liberal tradition of Venizelos and Papandreou against both the New Democracy right and the rising PASOK.[COLDWAR_PI_GRE_edik_chair_display]"
 COLDWAR_PI_GRE_edik_party_icon:0 "£CW_PI_emblem_GRE_edik"
 COLDWAR_PI_GRE_edik_tt:0 "§YCentre Union (EK)§! becomes §YUnion of the Democratic Centre§! (EDIK, §Y1976§!)."
 COLDWAR_PI_GRE_edik_revert_tt:0 "§YEDIK§! goes back to its former name and logo."
 COLDWAR_PI_GRE_syn_party:0 "£CW_PI_emblem_GRE_syn (SYN) - Coalition of the Left and Progress"
 COLDWAR_PI_GRE_syn_party_desc:0 "(Democratic Socialism) - Coalition of the Left and Progress (Greek: Synaspismos tis Aristeras kai tis Proodou, SYN)\n\nThe KKE and the Greek Left have formed the Coalition of the Left and Progress under Charilaos Florakis and Leonidas Kyrkos. Synaspismos campaigns for catharsis against the Koskotas scandal and even joins a short coalition with New Democracy.[COLDWAR_PI_GRE_syn_chair_display]"
 COLDWAR_PI_GRE_syn_party_icon:0 "£CW_PI_emblem_GRE_syn"
 COLDWAR_PI_GRE_syn_tt:0 "§YUnited Democratic Left (EDA)§! becomes §YCoalition of the Left and Progress§! (SYN, §Y1989§!)."
 COLDWAR_PI_GRE_syn_revert_tt:0 "§YSYN§! goes back to its former name and logo."
 COLDWAR_PI_GRE_epen_party:0 "£CW_PI_emblem_GRE_epen (EPEN) - National Political Union"
 COLDWAR_PI_GRE_epen_party_desc:0 "(Junta Nostalgic Nationalism) - National Political Union (Greek: Ethniki Politiki Enosis, EPEN)\n\nFrom his prison cell the former dictator Georgios Papadopoulos has sponsored the National Political Union. EPEN demands the release of the junta leaders and a strong state against communism, winning a seat in the European Parliament.[COLDWAR_PI_GRE_epen_chair_display]"
 COLDWAR_PI_GRE_epen_party_icon:0 "£CW_PI_emblem_GRE_epen"
 COLDWAR_PI_GRE_epen_tt:0 "§YEthnikistiki laiki deksia (nationalist popular right)§! becomes §YNational Political Union§! (EPEN, §Y1984§!)."
 COLDWAR_PI_GRE_epen_revert_tt:0 "§YEPEN§! goes back to its former name and logo."
 COLDWAR_PI_HOL_cda_party:0 "£CW_PI_emblem_HOL_cda (CDA) - Christian Democratic Appeal"
 COLDWAR_PI_HOL_cda_party_desc:0 "(Christian Democracy) - Christian Democratic Appeal (Dutch: Christen-Democratisch Appèl, CDA)\n\nThe Catholic People's Party, the Anti Revolutionaries and the Christian Historicals have merged into the Christian Democratic Appeal. Under Van Agt and Lubbers it becomes the axis of Dutch government.[COLDWAR_PI_HOL_cda_chair_display]"
 COLDWAR_PI_HOL_cda_party_icon:0 "£CW_PI_emblem_HOL_cda"
 COLDWAR_PI_HOL_cda_tt:0 "§YCatholic People's Party (KVP)§! becomes §YChristian Democratic Appeal§! (CDA, §Y1980§!)."
 COLDWAR_PI_HOL_cda_revert_tt:0 "§YCDA§! goes back to its former name and logo."
 COLDWAR_PI_HOL_gl_party:0 "£CW_PI_emblem_HOL_gl (GL) - GreenLeft"
 COLDWAR_PI_HOL_gl_party_desc:0 "(Green Socialism) - GreenLeft (Dutch: GroenLinks, GL)\n\nThe Communists, Pacifist Socialists, Radicals and Evangelicals have merged into GreenLeft. It combines ecology, peace and social justice.[COLDWAR_PI_HOL_gl_chair_display]"
 COLDWAR_PI_HOL_gl_party_icon:0 "£CW_PI_emblem_HOL_gl"
 COLDWAR_PI_HOL_gl_tt:0 "§YCommunist Party of the Netherlands (CPN)§! becomes §YGreenLeft§! (GL, §Y1989§!)."
 COLDWAR_PI_HOL_gl_revert_tt:0 "§YGL§! goes back to its former name and logo."
 COLDWAR_PI_HUN_szdsz_party:0 "£HUN_western_liberal (SZDSZ) - Alliance of Free Democrats"
 COLDWAR_PI_HUN_szdsz_party_desc:0 "(Liberalism) - Alliance of Free Democrats (Hungarian: Szabad Demokraták Szövetsége, SZDSZ)\n\nThe democratic opposition of the samizdat years has founded the Alliance of Free Democrats. Led by Kis and Tölgyessy, the SZDSZ demands a radical break with the regime, a market economy and the Western road.[COLDWAR_PI_HUN_szdsz_chair_display]"
 COLDWAR_PI_HUN_szdsz_party_icon:0 "£HUN_western_liberal"
 COLDWAR_PI_HUN_szdsz_tt:0 "§YLiterary Gazette circle§! becomes §YAlliance of Free Democrats§! (SZDSZ, §Y1988§!)."
 COLDWAR_PI_HUN_szdsz_revert_tt:0 "§YSZDSZ§! goes back to its former name and logo."
 COLDWAR_PI_HUN_mszp_party:0 "£HUN_western_social_democrat (MSZP) - Hungarian Socialist Party"
 COLDWAR_PI_HUN_mszp_party_desc:0 "(Social Democracy) - Hungarian Socialist Party (Hungarian: Magyar Szocialista Párt, MSZP)\n\nReform communists led by Nyers, Pozsgay and Németh have dissolved the Socialist Workers' Party and founded the Hungarian Socialist Party. The MSZP accepts free elections and the market and seeks a place in European social democracy.[COLDWAR_PI_HUN_mszp_chair_display]"
 COLDWAR_PI_HUN_mszp_party_icon:0 "£HUN_western_social_democrat"
 COLDWAR_PI_HUN_mszp_tt:0 "§YHungarian Socialist Workers' Party (MSZMP)§! becomes §YHungarian Socialist Party§! (MSZP, §Y1989§!)."
 COLDWAR_PI_HUN_mszp_revert_tt:0 "§YMSZP§! goes back to its former name and logo."
 COLDWAR_PI_HUN_fidesz_party:0 "£CW_PI_emblem_HUN_fidesz (Fidesz) - Alliance of Young Democrats"
 COLDWAR_PI_HUN_fidesz_party_desc:0 "(Radical Liberalism) - Alliance of Young Democrats (Hungarian: Fiatal Demokraták Szövetsége, Fidesz)\n\nLaw students in Budapest have founded the Alliance of Young Democrats, open only to those under thirty five. At Imre Nagy's reburial their speaker Viktor Orbán demands that Soviet troops leave Hungary.[COLDWAR_PI_HUN_fidesz_chair_display]"
 COLDWAR_PI_HUN_fidesz_party_icon:0 "£CW_PI_emblem_HUN_fidesz"
 COLDWAR_PI_HUN_fidesz_tt:0 "§YBudapest School§! becomes §YAlliance of Young Democrats§! (Fidesz, §Y1988§!)."
 COLDWAR_PI_HUN_fidesz_revert_tt:0 "§YFidesz§! goes back to its former name and logo."
 COLDWAR_PI_HUN_mdf_party:0 "£CW_PI_emblem_HUN_mdf (MDF) - Hungarian Democratic Forum"
 COLDWAR_PI_HUN_mdf_party_desc:0 "(National Conservatism) - Hungarian Democratic Forum (Hungarian: Magyar Demokrata Fórum, MDF)\n\nPopulist writers meeting at Lakitelek have founded the Hungarian Democratic Forum. Under József Antall it promises a calm transition, Christian national values and care for Hungarians beyond the borders.[COLDWAR_PI_HUN_mdf_chair_display]"
 COLDWAR_PI_HUN_mdf_party_icon:0 "£CW_PI_emblem_HUN_mdf"
 COLDWAR_PI_HUN_mdf_tt:0 "§YThe National Populist Writers§! becomes §YHungarian Democratic Forum§! (MDF, §Y1987§!)."
 COLDWAR_PI_HUN_mdf_revert_tt:0 "§YMDF§! goes back to its former name and logo."
 COLDWAR_PI_IND_golkar_party:0 "£CW_PI_emblem_IND_golkar (Golkar) - Functional Groups"
 COLDWAR_PI_IND_golkar_party_desc:0 "(Developmentalist Authoritarianism) - Functional Groups (Indonesian: Golongan Karya, Golkar)\n\nThe Joint Secretariat has become Golkar, the electoral vehicle of the New Order. Backed by the army and the civil service, it wins the 1971 elections.[COLDWAR_PI_IND_golkar_chair_display]"
 COLDWAR_PI_IND_golkar_party_icon:0 "£CW_PI_emblem_IND_golkar"
 COLDWAR_PI_IND_golkar_tt:0 "§YJoint Secretariat of Functional Groups (Sekber Golkar)§! becomes §YFunctional Groups§! (Golkar, §Y1971§!)."
 COLDWAR_PI_IND_golkar_revert_tt:0 "§YGolkar§! goes back to its former name and logo."
 COLDWAR_PI_IND_ppp_party:0 "£CW_PI_emblem_IND_ppp (PPP) - United Development Party"
 COLDWAR_PI_IND_ppp_party_desc:0 "(Islamic Conservatism) - United Development Party (Indonesian: Partai Persatuan Pembangunan, PPP)\n\nUnder Suharto's fusion policy NU, Parmusi, PSII and Perti have been merged into the United Development Party. It is the only legal voice of political Islam.[COLDWAR_PI_IND_ppp_chair_display]"
 COLDWAR_PI_IND_ppp_party_icon:0 "£CW_PI_emblem_IND_ppp"
 COLDWAR_PI_IND_ppp_tt:0 "§YNahdlatul Ulama Party (NU)§! becomes §YUnited Development Party§! (PPP, §Y1973§!)."
 COLDWAR_PI_IND_ppp_revert_tt:0 "§YPPP§! goes back to its former name and logo."
 COLDWAR_PI_IND_pdi_party:0 "£CW_PI_emblem_IND_pdi (PDI) - Indonesian Democratic Party"
 COLDWAR_PI_IND_pdi_party_desc:0 "(Marhaenism) - Indonesian Democratic Party (Indonesian: Partai Demokrasi Indonesia, PDI)\n\nThe PNI, the Christian parties, Murba and IPKI have been merged into the Indonesian Democratic Party. Sukarno's portrait is still its strongest asset.[COLDWAR_PI_IND_pdi_chair_display]"
 COLDWAR_PI_IND_pdi_party_icon:0 "£CW_PI_emblem_IND_pdi"
 COLDWAR_PI_IND_pdi_tt:0 "§YIndonesian National Party (PNI)§! becomes §YIndonesian Democratic Party§! (PDI, §Y1973§!)."
 COLDWAR_PI_IND_pdi_revert_tt:0 "§YPDI§! goes back to its former name and logo."
 COLDWAR_PI_ITA_ppi_party:0 "£CW_PI_emblem_ITA_ppi (PPI) - Italian People's Party"
 COLDWAR_PI_ITA_ppi_party_desc:0 "(Christian Democracy) - Italian People's Party (Italian: Partito Popolare Italiano, PPI)\n\nChristian Democracy has taken back the name of Don Luigi Sturzo's party of 1919, the Italian People's Party. Mino Martinazzoli wants a clean Catholic centre after the scandals, free of the old correnti and of the patronage that bound the party to every ministry for half a century.[COLDWAR_PI_ITA_ppi_chair_display]"
 COLDWAR_PI_ITA_ppi_party_icon:0 "£CW_PI_emblem_ITA_ppi"
 COLDWAR_PI_ITA_ppi_tt:0 "§YChristian Democracy (DC)§! becomes §YItalian People's Party§! (PPI, §Y1994§!)."
 COLDWAR_PI_ITA_ppi_revert_tt:0 "§YPPI§! goes back to its former name and logo."
 COLDWAR_PI_ITA_psdi_party:0 "£CW_PI_emblem_ITA_psdi (PSDI) - Italian Democratic Socialist Party"
 COLDWAR_PI_ITA_psdi_party_desc:0 "(Social Democracy) - Italian Democratic Socialist Party (Italian: Partito Socialista Democratico Italiano, PSDI)\n\nThe Unitary Socialists have taken back the old name of Saragat's party, the Italian Democratic Socialist Party. Under Mauro Ferri and loyal to NATO and the centre left, the PSDI presents itself as the anticommunist wing of Italian socialism and an indispensable partner of every Christian Democratic cabinet.[COLDWAR_PI_ITA_psdi_chair_display]"
 COLDWAR_PI_ITA_psdi_party_icon:0 "£CW_PI_emblem_ITA_psdi"
 COLDWAR_PI_ITA_psdi_tt:0 "§YUnitary Socialist Party (PSU)§! becomes §YItalian Democratic Socialist Party§! (PSDI, §Y1971§!)."
 COLDWAR_PI_ITA_psdi_revert_tt:0 "§YPSDI§! goes back to its former name and logo."
 COLDWAR_PI_ITA_pds_party:0 "£CW_PI_emblem_ITA_pds (PDS) - Democratic Party of the Left"
 COLDWAR_PI_ITA_pds_party_desc:0 "(Democratic Socialism) - Democratic Party of the Left (Italian: Partito Democratico della Sinistra, PDS)\n\nAt the Rimini congress Achille Occhetto has buried the hammer and sickle and turned the Italian Communist Party into the Democratic Party of the Left. The new party seeks entry into the Socialist International and presents itself as the governing alternative to forty years of Christian Democratic rule.[COLDWAR_PI_ITA_pds_chair_display]"
 COLDWAR_PI_ITA_pds_party_icon:0 "£CW_PI_emblem_ITA_pds"
 COLDWAR_PI_ITA_pds_tt:0 "§YItalian Communist Party (PCI)§! becomes §YDemocratic Party of the Left§! (PDS, §Y1991§!)."
 COLDWAR_PI_ITA_pds_revert_tt:0 "§YPDS§! goes back to its former name and logo."
 COLDWAR_PI_ITA_ln_party:0 "£CW_PI_emblem_ITA_ln (LN) - Northern League"
 COLDWAR_PI_ITA_ln_party_desc:0 "(Federalist Regionalism) - Northern League (Italian: Lega Nord, LN)\n\nUmberto Bossi has fused the Lombard League with the leagues of Veneto, Piedmont and Liguria into the Northern League. Under the sword of Alberto da Giussano it rails against Rome, southern patronage and taxes, demanding a federal Italy of macroregions.[COLDWAR_PI_ITA_ln_chair_display]"
 COLDWAR_PI_ITA_ln_party_icon:0 "£CW_PI_emblem_ITA_ln"
 COLDWAR_PI_ITA_ln_tt:0 "§YColdiretti (Direct Cultivators)§! becomes §YNorthern League§! (LN, §Y1991§!)."
 COLDWAR_PI_ITA_ln_revert_tt:0 "§YLN§! goes back to its former name and logo."
 COLDWAR_PI_ITA_lp_party:0 "£CW_PI_emblem_ITA_lp (LP) - Pannella List"
 COLDWAR_PI_ITA_lp_party_desc:0 "(Radicalism) - Pannella List (Italian: Lista Pannella, LP)\n\nThe Radical Party no longer stands in elections under its own name and presents the Pannella List instead. Marco Pannella turns the movement into a vehicle for referendums on the electoral law, the end of public party funding and the separation of the judiciary from politics.[COLDWAR_PI_ITA_lp_chair_display]"
 COLDWAR_PI_ITA_lp_party_icon:0 "£CW_PI_emblem_ITA_lp"
 COLDWAR_PI_ITA_lp_tt:0 "§YRadical Party (PR)§! becomes §YPannella List§! (LP, §Y1992§!)."
 COLDWAR_PI_ITA_lp_revert_tt:0 "§YLP§! goes back to its former name and logo."
 COLDWAR_PI_ITA_fdv_party:0 "£CW_PI_emblem_ITA_fdv (FdV) - Federation of the Greens"
 COLDWAR_PI_ITA_fdv_party_desc:0 "(Political Ecology) - Federation of the Greens (Italian: Federazione dei Verdi, FdV)\n\nThe Green Lists and the Rainbow Greens have united under the laughing sun as the Federation of the Greens. After Chernobyl and the 1987 referendum against nuclear power the ecologists demand an end to reactors, clean rivers and a new model of development.[COLDWAR_PI_ITA_fdv_chair_display]"
 COLDWAR_PI_ITA_fdv_party_icon:0 "£CW_PI_emblem_ITA_fdv"
 COLDWAR_PI_ITA_fdv_tt:0 "§YItalia Nostra§! becomes §YFederation of the Greens§! (FdV, §Y1990§!)."
 COLDWAR_PI_ITA_fdv_revert_tt:0 "§YFdV§! goes back to its former name and logo."
 COLDWAR_PI_ITA_psi_party:0 "£CW_PI_emblem_ITA_psi (PSI) - Italian Socialist Party"
 COLDWAR_PI_ITA_psi_party_desc:0 "(Democratic Socialism) - Italian Socialist Party (Italian: Partito Socialista Italiano, PSI)\n\nThe Italian Socialist Party adopts the red carnation introduced at its Turin congress under Bettino Craxi.[COLDWAR_PI_ITA_psi_chair_display]"
 COLDWAR_PI_ITA_psi_party_icon:0 "£CW_PI_emblem_ITA_psi"
 COLDWAR_PI_ITA_psi_tt:0 "The Italian Socialist Party adopts the red carnation."
 COLDWAR_PI_ITA_psi_revert_tt:0 "§YPSI§! goes back to its former name and logo."
 COLDWAR_PI_ITA_prc_party:0 "£CW_PI_emblem_ITA_prc (PRC) - Communist Refoundation Party"
 COLDWAR_PI_ITA_prc_party_desc:0 "(Communism) - Communist Refoundation Party (Italian: Partito della Rifondazione Comunista, PRC)\n\nCommunists who refused to follow Occhetto out of the PCI have joined Democrazia Proletaria to found Communist Refoundation. Under Garavini and Cossutta the party keeps the red flag, defends the scala mobile and denounces the Gulf War and the new Atlantic order.[COLDWAR_PI_ITA_prc_chair_display]"
 COLDWAR_PI_ITA_prc_party_icon:0 "£CW_PI_emblem_ITA_prc"
 COLDWAR_PI_ITA_prc_tt:0 "§YProletarian Unity Party for Communism (PdUP)§! becomes §YCommunist Refoundation Party§! (PRC, §Y1991§!)."
 COLDWAR_PI_ITA_prc_revert_tt:0 "§YPRC§! goes back to its former name and logo."
 COLDWAR_PI_ITA_msi_dn_party:0 "£CW_PI_emblem_ITA_msi_dn (MSI-DN) - Italian Social Movement National Right"
 COLDWAR_PI_ITA_msi_dn_party_desc:0 "(Neo-Fascism) - Italian Social Movement National Right (Italian: Movimento Sociale Italiano Destra Nazionale, MSI-DN)\n\nGiorgio Almirante has absorbed the monarchists of the PDIUM and rebranded the Italian Social Movement as the National Right. Behind a respectable conservative front the party still guards the tricolour flame of the Social Republic and courts the frightened middle classes of the South.[COLDWAR_PI_ITA_msi_dn_chair_display]"
 COLDWAR_PI_ITA_msi_dn_party_icon:0 "£CW_PI_emblem_ITA_msi_dn"
 COLDWAR_PI_ITA_msi_dn_tt:0 "§YItalian Social Movement (MSI)§! becomes §YItalian Social Movement National Right§! (MSI-DN, §Y1972§!)."
 COLDWAR_PI_ITA_msi_dn_revert_tt:0 "§YMSI-DN§! goes back to its former name and logo."
 COLDWAR_PI_ITA_an_party:0 "£CW_PI_emblem_ITA_an (AN) - National Alliance"
 COLDWAR_PI_ITA_an_party_desc:0 "(National Conservatism) - National Alliance (Italian: Alleanza Nazionale, AN)\n\nAt the congress of Fiuggi the Italian Social Movement has dissolved itself into the National Alliance. Gianfranco Fini declares that the party leaves fascism to history and offers the right a modern conservative home, while the hardliners who refuse the turn walk out to keep the old flame burning.[COLDWAR_PI_ITA_an_chair_display]"
 COLDWAR_PI_ITA_an_party_icon:0 "£CW_PI_emblem_ITA_an"
 COLDWAR_PI_ITA_an_tt:0 "§YItalian Social Movement (MSI)§! becomes §YNational Alliance§! (AN, §Y1995§!)."
 COLDWAR_PI_ITA_an_revert_tt:0 "§YAN§! goes back to its former name and logo."
 COLDWAR_PI_KAZ_spk_party:0 "(SPK) - Socialist Party of Kazakhstan"
 COLDWAR_PI_KAZ_spk_party_desc:0 "(Democratic Socialism) - Socialist Party of Kazakhstan (Kazakh: Qazaqstan Sotsialistik partiyasy, SPK)\n\nAfter the August putsch the Communist Party of Kazakhstan has renamed itself the Socialist Party. Nazarbayev leaves its ranks and the party loses its hold over the republic.[COLDWAR_PI_KAZ_spk_chair_display]"
 COLDWAR_PI_KAZ_spk_party_icon:0 ""
 COLDWAR_PI_KAZ_spk_tt:0 "§YCommunist Party of Kazakhstan (KPK)§! becomes §YSocialist Party of Kazakhstan§! (SPK, §Y1991§!)."
 COLDWAR_PI_KAZ_spk_revert_tt:0 "§YSPK§! goes back to its former name and logo."
 COLDWAR_PI_KAZ_ns_party:0 "£CW_PI_emblem_KAZ_ns (NS) - Nevada Semipalatinsk Movement"
 COLDWAR_PI_KAZ_ns_party_desc:0 "(Anti Nuclear Movement) - Nevada Semipalatinsk Movement (Kazakh: Nevada Semey, NS)\n\nThe poet Olzhas Suleimenov has founded the Nevada Semipalatinsk Movement against nuclear testing. Its rallies gather hundreds of thousands and force an end to explosions at the Polygon.[COLDWAR_PI_KAZ_ns_chair_display]"
 COLDWAR_PI_KAZ_ns_party_icon:0 "£CW_PI_emblem_KAZ_ns"
 COLDWAR_PI_KAZ_ns_tt:0 "§YKazakh Society for Nature Conservation§! becomes §YNevada Semipalatinsk Movement§! (NS, §Y1989§!)."
 COLDWAR_PI_KAZ_ns_revert_tt:0 "§YNS§! goes back to its former name and logo."
 COLDWAR_PI_KOR_djp_party:0 "£CW_PI_emblem_KOR_djp (DJP) - Democratic Justice Party"
 COLDWAR_PI_KOR_djp_party_desc:0 "(Developmental Authoritarianism) - Democratic Justice Party (Korean: Minju Chŏngŭidang, DJP)\n\nAfter the Gwangju massacre General Chun Doo hwan has replaced the DRP with the Democratic Justice Party. It rules the Fifth Republic.[COLDWAR_PI_KOR_djp_chair_display]"
 COLDWAR_PI_KOR_djp_party_icon:0 "£CW_PI_emblem_KOR_djp"
 COLDWAR_PI_KOR_djp_tt:0 "§YDemocratic Republican Party (DRP)§! becomes §YDemocratic Justice Party§! (DJP, §Y1981§!)."
 COLDWAR_PI_KOR_djp_revert_tt:0 "§YDJP§! goes back to its former name and logo."
 COLDWAR_PI_KOR_dlp_party:0 "£CW_PI_emblem_KOR_dlp (DLP) - Democratic Liberal Party"
 COLDWAR_PI_KOR_dlp_party_desc:0 "(Conservatism) - Democratic Liberal Party (Korean: Minju Chayudang, DLP)\n\nRoh Tae woo's DJP has merged with the parties of Kim Young sam and Kim Jong pil. The new party holds a crushing majority.[COLDWAR_PI_KOR_dlp_chair_display]"
 COLDWAR_PI_KOR_dlp_party_icon:0 "£CW_PI_emblem_KOR_dlp"
 COLDWAR_PI_KOR_dlp_tt:0 "§YDemocratic Republican Party (DRP)§! becomes §YDemocratic Liberal Party§! (DLP, §Y1990§!)."
 COLDWAR_PI_KOR_dlp_revert_tt:0 "§YDLP§! goes back to its former name and logo."
 COLDWAR_PI_KOR_nkdp_party:0 "£CW_PI_emblem_KOR_nkdp (NKDP) - New Korea Democratic Party"
 COLDWAR_PI_KOR_nkdp_party_desc:0 "(Liberal Democracy) - New Korea Democratic Party (Korean: Sin Hanguk Minjudang, NKDP)\n\nKim Dae jung and Kim Young sam have founded the New Korea Democratic Party. It wins the 1985 elections and demands direct presidential elections.[COLDWAR_PI_KOR_nkdp_chair_display]"
 COLDWAR_PI_KOR_nkdp_party_icon:0 "£CW_PI_emblem_KOR_nkdp"
 COLDWAR_PI_KOR_nkdp_tt:0 "§YNew Democratic Party (NDP)§! becomes §YNew Korea Democratic Party§! (NKDP, §Y1985§!)."
 COLDWAR_PI_KOR_nkdp_revert_tt:0 "§YNKDP§! goes back to its former name and logo."
 COLDWAR_PI_KYR_kdk_party:0 "(KDK) - Democratic Movement of Kyrgyzstan"
 COLDWAR_PI_KYR_kdk_party_desc:0 "(Liberal Democracy) - Democratic Movement of Kyrgyzstan (Kyrgyz: Kyrgyzstan Demokratiyalyk Kyimyly, KDK)\n\nAfter the Osh riots reformers have founded the Democratic Movement of Kyrgyzstan. Its hunger strikers help elect Askar Akayev president.[COLDWAR_PI_KYR_kdk_chair_display]"
 COLDWAR_PI_KYR_kdk_party_icon:0 ""
 COLDWAR_PI_KYR_kdk_tt:0 "§YThe White Ship§! becomes §YDemocratic Movement of Kyrgyzstan§! (KDK, §Y1990§!)."
 COLDWAR_PI_KYR_kdk_revert_tt:0 "§YKDK§! goes back to its former name and logo."
 COLDWAR_PI_LAT_lddp_party:0 "(LDDP) - Democratic Labour Party of Latvia"
 COLDWAR_PI_LAT_lddp_party_desc:0 "(Social Democracy) - Democratic Labour Party of Latvia (Latvian: Latvijas Demokrātiskā Darba partija, LDDP)\n\nCommunists who broke with Moscow have formed an independent party and then renamed it the Democratic Labour Party of Latvia. They support independence while Alfrēds Rubiks' loyalists remain in the Soviet communist party.[COLDWAR_PI_LAT_lddp_chair_display]"
 COLDWAR_PI_LAT_lddp_party_icon:0 ""
 COLDWAR_PI_LAT_lddp_tt:0 "§YCommunist Party of Latvia (LKP)§! becomes §YDemocratic Labour Party of Latvia§! (LDDP, §Y1990§!)."
 COLDWAR_PI_LAT_lddp_revert_tt:0 "§YLDDP§! goes back to its former name and logo."
 COLDWAR_PI_LAT_ltf_party:0 "£CW_PI_emblem_LAT_ltf (LTF) - Popular Front of Latvia"
 COLDWAR_PI_LAT_ltf_party_desc:0 "(National Reformism) - Popular Front of Latvia (Latvian: Latvijas Tautas fronte, LTF)\n\nWriters, journalists and reform communists have founded the Popular Front of Latvia. It organises the Baltic Way and wins the 1990 elections on a programme of independence.[COLDWAR_PI_LAT_ltf_chair_display]"
 COLDWAR_PI_LAT_ltf_party_icon:0 "£CW_PI_emblem_LAT_ltf"
 COLDWAR_PI_LAT_ltf_tt:0 "§YThe Prague Spring§! becomes §YPopular Front of Latvia§! (LTF, §Y1988§!)."
 COLDWAR_PI_LAT_ltf_revert_tt:0 "§YLTF§! goes back to its former name and logo."
 COLDWAR_PI_LAT_lnnk_party:0 "£CW_PI_emblem_LAT_lnnk (LNNK) - Latvian National Independence Movement"
 COLDWAR_PI_LAT_lnnk_party_desc:0 "(National Conservatism) - Latvian National Independence Movement (Latvian: Latvijas Nacionālās neatkarības kustība, LNNK)\n\nEduards Berklavs, the purged national communist of 1959, has founded the Latvian National Independence Movement. The LNNK demands full independence and the departure of Soviet settlers and troops.[COLDWAR_PI_LAT_lnnk_chair_display]"
 COLDWAR_PI_LAT_lnnk_party_icon:0 "£CW_PI_emblem_LAT_lnnk"
 COLDWAR_PI_LAT_lnnk_tt:0 "§YDaugava Hawks (DV)§! becomes §YLatvian National Independence Movement§! (LNNK, §Y1988§!)."
 COLDWAR_PI_LAT_lnnk_revert_tt:0 "§YLNNK§! goes back to its former name and logo."
 COLDWAR_PI_LIT_sajudis_party:0 "£CW_PI_emblem_LIT_sajudis (Sąjūdis) - Reform Movement of Lithuania"
 COLDWAR_PI_LIT_sajudis_party_desc:0 "(National Liberation) - Reform Movement of Lithuania (Lithuanian: Lietuvos Persitvarkymo Sąjūdis, Sąjūdis)\n\nIntellectuals at the Academy of Sciences have founded Sąjūdis, the Reform Movement of Lithuania. Under Vytautas Landsbergis it wins the 1990 elections and proclaims the restoration of independence on 11 March.[COLDWAR_PI_LIT_sajudis_chair_display]"
 COLDWAR_PI_LIT_sajudis_party_icon:0 "£CW_PI_emblem_LIT_sajudis"
 COLDWAR_PI_LIT_sajudis_tt:0 "§YSantara-Šviesa Federation§! becomes §YReform Movement of Lithuania§! (Sąjūdis, §Y1988§!)."
 COLDWAR_PI_LIT_sajudis_revert_tt:0 "§YSąjūdis§! goes back to its former name and logo."
 COLDWAR_PI_LIT_lddp_party:0 "£CW_PI_emblem_LIT_lddp (LDDP) - Democratic Labour Party of Lithuania"
 COLDWAR_PI_LIT_lddp_party_desc:0 "(Social Democracy) - Democratic Labour Party of Lithuania (Lithuanian: Lietuvos demokratine darbo partija, LDDP)\n\nAlgirdas Brazauskas led the Lithuanian communists out of the CPSU in 1989, and now the party has renamed itself the Democratic Labour Party. It supports independence while promising social protection and pragmatic reform.[COLDWAR_PI_LIT_lddp_chair_display]"
 COLDWAR_PI_LIT_lddp_party_icon:0 "£CW_PI_emblem_LIT_lddp"
 COLDWAR_PI_LIT_lddp_tt:0 "§YCommunist Party of Lithuania (LKP)§! becomes §YDemocratic Labour Party of Lithuania§! (LDDP, §Y1990§!)."
 COLDWAR_PI_LIT_lddp_revert_tt:0 "§YLDDP§! goes back to its former name and logo."
 COLDWAR_PI_LIT_lzj_party:0 "£CW_PI_emblem_LIT_lzj (LŽJ) - Lithuanian Green Movement"
 COLDWAR_PI_LIT_lzj_party_desc:0 "(Political Ecology) - Lithuanian Green Movement (Lithuanian: Lietuvos žaliųjų judejimas, LŽJ)\n\nProtests against the Ignalina reactor and drilling in the Baltic have given birth to the Lithuanian Green Movement. Ecology becomes a patriotic cause and a shield for the independence movement.[COLDWAR_PI_LIT_lzj_chair_display]"
 COLDWAR_PI_LIT_lzj_party_icon:0 "£CW_PI_emblem_LIT_lzj"
 COLDWAR_PI_LIT_lzj_tt:0 "§YLithuanian Nature Protection Society§! becomes §YLithuanian Green Movement§! (LŽJ, §Y1988§!)."
 COLDWAR_PI_LIT_lzj_revert_tt:0 "§YLŽJ§! goes back to its former name and logo."
 COLDWAR_PI_MEX_psum_party:0 "£CW_PI_emblem_MEX_psum (PSUM) - Unified Socialist Party of Mexico"
 COLDWAR_PI_MEX_psum_party_desc:0 "(Democratic Socialism) - Unified Socialist Party of Mexico (Spanish: Partido Socialista Unificado de México, PSUM)\n\nThe Mexican Communist Party has merged with smaller left parties into the Unified Socialist Party. It drops Leninism for democratic socialism.[COLDWAR_PI_MEX_psum_chair_display]"
 COLDWAR_PI_MEX_psum_party_icon:0 "£CW_PI_emblem_MEX_psum"
 COLDWAR_PI_MEX_psum_tt:0 "§YMexican Communist Party (PCM)§! becomes §YUnified Socialist Party of Mexico§! (PSUM, §Y1981§!)."
 COLDWAR_PI_MEX_psum_revert_tt:0 "§YPSUM§! goes back to its former name and logo."
 COLDWAR_PI_MEX_prd_party:0 "£mex_western_social_democrat (PRD) - Party of the Democratic Revolution"
 COLDWAR_PI_MEX_prd_party_desc:0 "(Revolutionary Nationalism) - Party of the Democratic Revolution (Spanish: Partido de la Revolución Democrática, PRD)\n\nCuauhtémoc Cárdenas has founded the PRD after the disputed election of 1988. It rallies the nationalist left against the PRI.[COLDWAR_PI_MEX_prd_chair_display]"
 COLDWAR_PI_MEX_prd_party_icon:0 "£mex_western_social_democrat"
 COLDWAR_PI_MEX_prd_tt:0 "§YElectrical Workers' Union (STERM)§! becomes §YParty of the Democratic Revolution§! (PRD, §Y1989§!)."
 COLDWAR_PI_MEX_prd_revert_tt:0 "§YPRD§! goes back to its former name and logo."
 COLDWAR_PI_MLV_fpm_party:0 "£CW_PI_emblem_MLV_fpm (FPM) - Popular Front of Moldova"
 COLDWAR_PI_MLV_fpm_party_desc:0 "(Romanian Unionism) - Popular Front of Moldova (Romanian: Frontul Popular din Moldova, FPM)\n\nWriters and students have founded the Popular Front of Moldova. It wins the Latin alphabet and the tricolour and pushes for union with Romania.[COLDWAR_PI_MLV_fpm_chair_display]"
 COLDWAR_PI_MLV_fpm_party_icon:0 "£CW_PI_emblem_MLV_fpm"
 COLDWAR_PI_MLV_fpm_tt:0 "§YNational Patriotic Front§! becomes §YPopular Front of Moldova§! (FPM, §Y1989§!)."
 COLDWAR_PI_MLV_fpm_revert_tt:0 "§YFPM§! goes back to its former name and logo."
 COLDWAR_PI_PER_rastakhiz_party:0 "£CW_PI_emblem_PER_rastakhiz (Rastakhiz) - Resurgence Party"
 COLDWAR_PI_PER_rastakhiz_party_desc:0 "(Monarchist Single Party) - Resurgence Party (Persian: Hezb-e Rastakhiz, Rastakhiz)\n\nThe Shah has dissolved all parties into the Resurgence Party. Every loyal Iranian is to join.[COLDWAR_PI_PER_rastakhiz_chair_display]"
 COLDWAR_PI_PER_rastakhiz_party_icon:0 "£CW_PI_emblem_PER_rastakhiz"
 COLDWAR_PI_PER_rastakhiz_tt:0 "§YIran Novin (New Iran Party)§! becomes §YResurgence Party§! (Rastakhiz, §Y1975§!)."
 COLDWAR_PI_PER_rastakhiz_revert_tt:0 "§YRastakhiz§! goes back to its former name and logo."
 COLDWAR_PI_POL_pc_party:0 "£CW_PI_emblem_POL_pc (PC) - Centre Agreement"
 COLDWAR_PI_POL_pc_party_desc:0 "(Christian Democracy) - Centre Agreement (Polish: Porozumienie Centrum, PC)\n\nJarosław Kaczyński has founded the Centre Agreement to back Lech Wałęsa for the presidency. The party demands an acceleration of change, decommunisation and a clean break with the round table compromise.[COLDWAR_PI_POL_pc_chair_display]"
 COLDWAR_PI_POL_pc_party_icon:0 "£CW_PI_emblem_POL_pc"
 COLDWAR_PI_POL_pc_tt:0 "§YZnak§! becomes §YCentre Agreement§! (PC, §Y1990§!)."
 COLDWAR_PI_POL_pc_revert_tt:0 "§YPC§! goes back to its former name and logo."
 COLDWAR_PI_POL_ud_party:0 "£CW_PI_emblem_POL_ud (UD) - Democratic Union"
 COLDWAR_PI_POL_ud_party_desc:0 "(Liberal Democracy) - Democratic Union (Polish: Unia Demokratyczna, UD)\n\nTadeusz Mazowiecki's supporters from the Citizens' Committees have founded the Democratic Union. Bringing together former Solidarity advisers such as Geremek and Kuroń, it stands for European integration, the rule of law and gradual market reform.[COLDWAR_PI_POL_ud_chair_display]"
 COLDWAR_PI_POL_ud_party_icon:0 "£CW_PI_emblem_POL_ud"
 COLDWAR_PI_POL_ud_tt:0 "§YKultura§! becomes §YDemocratic Union§! (UD, §Y1991§!)."
 COLDWAR_PI_POL_ud_revert_tt:0 "§YUD§! goes back to its former name and logo."
 COLDWAR_PI_POL_sdrp_party:0 "£CW_PI_emblem_POL_sdrp (SdRP) - Social Democracy of the Republic of Poland"
 COLDWAR_PI_POL_sdrp_party_desc:0 "(Social Democracy) - Social Democracy of the Republic of Poland (Polish: Socjaldemokracja Rzeczypospolitej Polskiej, SdRP)\n\nAt its last congress the PZPR has dissolved itself and reemerged as Social Democracy of the Republic of Poland under Aleksander Kwaśniewski. The party embraces parliamentary democracy and the market while defending the welfare of those left behind by shock therapy.[COLDWAR_PI_POL_sdrp_chair_display]"
 COLDWAR_PI_POL_sdrp_party_icon:0 "£CW_PI_emblem_POL_sdrp"
 COLDWAR_PI_POL_sdrp_tt:0 "§YPolish United Workers' Party (PZPR)§! becomes §YSocial Democracy of the Republic of Poland§! (SdRP, §Y1990§!)."
 COLDWAR_PI_POL_sdrp_revert_tt:0 "§YSdRP§! goes back to its former name and logo."
 COLDWAR_PI_POL_kor_party:0 "£CW_PI_emblem_POL_kor (KOR) - Workers' Defence Committee"
 COLDWAR_PI_POL_kor_party_desc:0 "(Democratic Opposition) - Workers' Defence Committee (Polish: Komitet Obrony Robotników, KOR)\n\nAfter the Radom and Ursus strikes Kuroń, Michnik and Lipski have founded the Workers' Defence Committee to aid persecuted workers. KOR publishes underground bulletins and builds the bridge between the intelligentsia and the factories.[COLDWAR_PI_POL_kor_chair_display]"
 COLDWAR_PI_POL_kor_party_icon:0 "£CW_PI_emblem_POL_kor"
 COLDWAR_PI_POL_kor_tt:0 "§YThe Commandos§! becomes §YWorkers' Defence Committee§! (KOR, §Y1976§!)."
 COLDWAR_PI_POL_kor_revert_tt:0 "§YKOR§! goes back to its former name and logo."
 COLDWAR_PI_POL_psl_party:0 "£POL_oligarchism_small (PSL) - Polish People's Party"
 COLDWAR_PI_POL_psl_party_desc:0 "(Agrarianism) - Polish People's Party (Polish: Polskie Stronnictwo Ludowe, PSL)\n\nThe United People's Party has thrown off its role as a satellite and refounded the historic Polish People's Party of Witos and Mikołajczyk. The PSL speaks for private farmers threatened by cheap imports and falling prices.[COLDWAR_PI_POL_psl_chair_display]"
 COLDWAR_PI_POL_psl_party_icon:0 "£POL_oligarchism_small"
 COLDWAR_PI_POL_psl_tt:0 "§YUnited People's Party (ZSL)§! becomes §YPolish People's Party§! (PSL, §Y1990§!)."
 COLDWAR_PI_POL_psl_revert_tt:0 "§YPSL§! goes back to its former name and logo."
 COLDWAR_PI_POR_ppd_party:0 "£POR_western_conservative (PPD) - Popular Democratic Party"
 COLDWAR_PI_POR_ppd_party_desc:0 "(Social Democracy) - Popular Democratic Party (Portuguese: Partido Popular Democrático, PPD)\n\nSá Carneiro, Balsemão and Magalhães Mota, the deputies of the Liberal Wing, have founded the Popular Democratic Party after the Carnation Revolution. The PPD wants a pluralist, European Portugal and resists the drift of the revolution towards the Communists and the officers of the MFA.[COLDWAR_PI_POR_ppd_chair_display]"
 COLDWAR_PI_POR_ppd_party_icon:0 "£POR_western_conservative"
 COLDWAR_PI_POR_ppd_tt:0 "§YLiberal Wing§! becomes §YPopular Democratic Party§! (PPD, §Y1974§!)."
 COLDWAR_PI_POR_ppd_revert_tt:0 "§YPPD§! goes back to its former name and logo."
 COLDWAR_PI_POR_psd_party:0 "£POR_western_conservative (PSD) - Social Democratic Party"
 COLDWAR_PI_POR_psd_party_desc:0 "(Social Democracy) - Social Democratic Party (Portuguese: Partido Social Democrata, PSD)\n\nThe Popular Democrats have renamed themselves the Social Democratic Party. Under Sá Carneiro the PSD leads the centre right towards the Democratic Alliance, promising to roll back nationalisations and to anchor Portugal in the European Community.[COLDWAR_PI_POR_psd_chair_display]"
 COLDWAR_PI_POR_psd_party_icon:0 "£POR_western_conservative"
 COLDWAR_PI_POR_psd_tt:0 "§YLiberal Wing§! becomes §YSocial Democratic Party§! (PSD, §Y1976§!)."
 COLDWAR_PI_POR_psd_revert_tt:0 "§YPSD§! goes back to its former name and logo."
 COLDWAR_PI_POR_prd_party:0 "£CW_PI_emblem_POR_prd (PRD) - Democratic Renewal Party"
 COLDWAR_PI_POR_prd_party_desc:0 "(Centrist Reformism) - Democratic Renewal Party (Portuguese: Partido Renovador Democrático, PRD)\n\nSupporters of President Ramalho Eanes have founded the Democratic Renewal Party to break the old party system. The PRD promises moral renewal, an end to clientelism and a modern administration.[COLDWAR_PI_POR_prd_chair_display]"
 COLDWAR_PI_POR_prd_party_icon:0 "£CW_PI_emblem_POR_prd"
 COLDWAR_PI_POR_prd_tt:0 "§YLusitanian Grand Orient (GOL)§! becomes §YDemocratic Renewal Party§! (PRD, §Y1985§!)."
 COLDWAR_PI_POR_prd_revert_tt:0 "§YPRD§! goes back to its former name and logo."
 COLDWAR_PI_POR_cds_party:0 "£CW_PI_emblem_POR_cds (CDS) - Democratic and Social Centre"
 COLDWAR_PI_POR_cds_party_desc:0 "(Christian Democracy) - Democratic and Social Centre (Portuguese: Centro Democrático e Social, CDS)\n\nDiogo Freitas do Amaral has founded the Democratic and Social Centre as the Christian democratic voice of a Catholic Portugal. Branded reactionary by the revolutionary left, the CDS is the only party to vote against the socialist constitution of 1976.[COLDWAR_PI_POR_cds_chair_display]"
 COLDWAR_PI_POR_cds_party_icon:0 "£CW_PI_emblem_POR_cds"
 COLDWAR_PI_POR_cds_tt:0 "§YCatholic Church in Portugal§! becomes §YDemocratic and Social Centre§! (CDS, §Y1974§!)."
 COLDWAR_PI_POR_cds_revert_tt:0 "§YCDS§! goes back to its former name and logo."
 COLDWAR_PI_POR_mdp_cde_party:0 "£CW_PI_emblem_POR_mdp_cde (MDP/CDE) - Portuguese Democratic Movement"
 COLDWAR_PI_POR_mdp_cde_party_desc:0 "(Popular Front Socialism) - Portuguese Democratic Movement (Portuguese: Movimento Democrático Português, MDP/CDE)\n\nThe electoral commissions of the democratic opposition have become a party, the Portuguese Democratic Movement. Close to the Communists, the MDP/CDE sits in the provisional governments and supports nationalisation and land reform.[COLDWAR_PI_POR_mdp_cde_chair_display]"
 COLDWAR_PI_POR_mdp_cde_party_icon:0 "£CW_PI_emblem_POR_mdp_cde"
 COLDWAR_PI_POR_mdp_cde_tt:0 "§YDemocratic Electoral Commission (CDE)§! becomes §YPortuguese Democratic Movement§! (MDP/CDE, §Y1974§!)."
 COLDWAR_PI_POR_mdp_cde_revert_tt:0 "§YMDP/CDE§! goes back to its former name and logo."
 COLDWAR_PI_POR_pctp_mrpp_party:0 "£POR_non_aligned_communism (PCTP/MRPP) - Portuguese Workers' Communist Party"
 COLDWAR_PI_POR_pctp_mrpp_party_desc:0 "(Maoism) - Portuguese Workers' Communist Party (Portuguese: Partido Comunista dos Trabalhadores Portugueses, PCTP/MRPP)\n\nThe Movement for the Reorganisation of the Party of the Proletariat has registered as the Portuguese Workers' Communist Party. Its militants paint the walls of Lisbon with red slogans and attack the PCP as social fascist lackeys of Moscow.[COLDWAR_PI_POR_pctp_mrpp_chair_display]"
 COLDWAR_PI_POR_pctp_mrpp_party_icon:0 "£POR_non_aligned_communism"
 COLDWAR_PI_POR_pctp_mrpp_tt:0 "§YPortuguese Marxist Leninist Committee (CMLP)§! becomes §YPortuguese Workers' Communist Party§! (PCTP/MRPP, §Y1976§!)."
 COLDWAR_PI_POR_pctp_mrpp_revert_tt:0 "§YPCTP/MRPP§! goes back to its former name and logo."
 COLDWAR_PI_RAJ_jnp_party:0 "£CW_PI_emblem_RAJ_jnp (JNP) - People's Party"
 COLDWAR_PI_RAJ_jnp_party_desc:0 "(Gandhian Democracy) - People's Party (Hindi: Janata Party, JNP)\n\nThe Congress (O), Jana Sangh, Lok Dal and Socialists have merged into the Janata Party under Morarji Desai. It ends thirty years of Congress rule.[COLDWAR_PI_RAJ_jnp_chair_display]"
 COLDWAR_PI_RAJ_jnp_party_icon:0 "£CW_PI_emblem_RAJ_jnp"
 COLDWAR_PI_RAJ_jnp_tt:0 "§Y) Indian National Congress (Organisation) (Congress (O)§! becomes §YPeople's Party§! (JNP, §Y1977§!)."
 COLDWAR_PI_RAJ_jnp_revert_tt:0 "§YJNP§! goes back to its former name and logo."
 COLDWAR_PI_RAJ_jd_party:0 "£CW_PI_emblem_RAJ_jd (JD) - People's Party (Dal)"
 COLDWAR_PI_RAJ_jd_party_desc:0 "(Social Justice Centrism) - People's Party (Dal) (Hindi: Janata Dal, JD)\n\nV. P. Singh has united the Janata Party, Lok Dal and Jan Morcha in the Janata Dal. It promises clean government and reservations under the Mandal report.[COLDWAR_PI_RAJ_jd_chair_display]"
 COLDWAR_PI_RAJ_jd_party_icon:0 "£CW_PI_emblem_RAJ_jd"
 COLDWAR_PI_RAJ_jd_tt:0 "§YSwatantra Party (SWA)§! becomes §YPeople's Party (Dal)§! (JD, §Y1988§!)."
 COLDWAR_PI_RAJ_jd_revert_tt:0 "§YJD§! goes back to its former name and logo."
 COLDWAR_PI_RAJ_inc_i_party:0 "£CW_PI_emblem_RAJ_inc_i (INC(I)) - Indian National Congress (Indira)"
 COLDWAR_PI_RAJ_inc_i_party_desc:0 "(Democratic Socialism) - Indian National Congress (Indira)\n\nAfter the Emergency defeat Indira Gandhi has split the Congress again. Her Congress (I) sweeps back to power in 1980.[COLDWAR_PI_RAJ_inc_i_chair_display]"
 COLDWAR_PI_RAJ_inc_i_party_icon:0 "£CW_PI_emblem_RAJ_inc_i"
 COLDWAR_PI_RAJ_inc_i_tt:0 "§Y) Indian National Congress (R) (INC(R)§! becomes §YIndian National Congress (Indira)§! (INC(I), §Y1978§!)."
 COLDWAR_PI_RAJ_inc_i_revert_tt:0 "§YINC(I)§! goes back to its former name and logo."
 COLDWAR_PI_RAJ_bjp_party:0 "£CW_PI_emblem_RAJ_bjp (BJP) - Indian People's Party"
 COLDWAR_PI_RAJ_bjp_party_desc:0 "(Hindu Nationalism) - Indian People's Party (Hindi: Bharatiya Janata Party, BJP)\n\nFormer Jana Sangh members led by Atal Bihari Vajpayee have founded the Bharatiya Janata Party. It speaks of Gandhian socialism and Hindu cultural nationalism.[COLDWAR_PI_RAJ_bjp_chair_display]"
 COLDWAR_PI_RAJ_bjp_party_icon:0 "£CW_PI_emblem_RAJ_bjp"
 COLDWAR_PI_RAJ_bjp_tt:0 "§YBharatiya Jana Sangh (BJS)§! becomes §YIndian People's Party§! (BJP, §Y1980§!)."
 COLDWAR_PI_RAJ_bjp_revert_tt:0 "§YBJP§! goes back to its former name and logo."
 COLDWAR_PI_ROM_pntcd_party:0 "£CW_PI_emblem_ROM_pntcd (PNTCD) - Christian Democratic National Peasants' Party"
 COLDWAR_PI_ROM_pntcd_party_desc:0 "(Christian Democracy) - Christian Democratic National Peasants' Party (Romanian: Partidul National Tărănesc Creştin Democrat, PNTCD)\n\nCorneliu Coposu has revived the historic Peasants' Party as the Christian Democratic National Peasants' Party. It leads the anticommunist opposition and calls for the return of King Michael and of confiscated property.[COLDWAR_PI_ROM_pntcd_chair_display]"
 COLDWAR_PI_ROM_pntcd_party_icon:0 "£CW_PI_emblem_ROM_pntcd"
 COLDWAR_PI_ROM_pntcd_tt:0 "§YNational Peasants' Party (PNT)§! becomes §YChristian Democratic National Peasants' Party§! (PNTCD, §Y1990§!)."
 COLDWAR_PI_ROM_pntcd_revert_tt:0 "§YPNTCD§! goes back to its former name and logo."
 COLDWAR_PI_ROM_fsn_party:0 "£CW_PI_emblem_ROM_fsn (FSN) - National Salvation Front"
 COLDWAR_PI_ROM_fsn_party_desc:0 "(Post Communist Reformism) - National Salvation Front (Romanian: Frontul Salvării Nationale, FSN)\n\nWith Ceauşescu fallen, Ion Iliescu and his circle have proclaimed the National Salvation Front and then registered it as a party. The Front takes over the state apparatus and promises democracy, while miners loyal to it storm Bucharest.[COLDWAR_PI_ROM_fsn_chair_display]"
 COLDWAR_PI_ROM_fsn_party_icon:0 "£CW_PI_emblem_ROM_fsn"
 COLDWAR_PI_ROM_fsn_tt:0 "§YRomanian Communist Party (PCR)§! becomes §YNational Salvation Front§! (FSN, §Y1989§!)."
 COLDWAR_PI_ROM_fsn_revert_tt:0 "§YFSN§! goes back to its former name and logo."
 COLDWAR_PI_ROM_udmr_party:0 "£ROM_neutral_libertarian (UDMR) - Democratic Alliance of Hungarians in Romania"
 COLDWAR_PI_ROM_udmr_party_desc:0 "(Minority Rights) - Democratic Alliance of Hungarians in Romania (Romanian: Romániai Magyar Demokrata Szövetség, UDMR)\n\nThe Hungarians of Transylvania have founded their own Democratic Alliance in the first days after the revolution. The UDMR demands Hungarian schools, the university in Cluj and local autonomy.[COLDWAR_PI_ROM_udmr_chair_display]"
 COLDWAR_PI_ROM_udmr_party_icon:0 "£ROM_neutral_libertarian"
 COLDWAR_PI_ROM_udmr_tt:0 "§YCouncil of Working People of Hungarian Nationality§! becomes §YDemocratic Alliance of Hungarians in Romania§! (UDMR, §Y1989§!)."
 COLDWAR_PI_ROM_udmr_revert_tt:0 "§YUDMR§! goes back to its former name and logo."
 COLDWAR_PI_ROM_prm_party:0 "£ROM_nat_populism (PRM) - Greater Romania Party"
 COLDWAR_PI_ROM_prm_party_desc:0 "(National Populism) - Greater Romania Party (Romanian: Partidul România Mare, PRM)\n\nThe court poet Corneliu Vadim Tudor has founded the Greater Romania Party around his weekly. The PRM blends nostalgia for Ceauşescu's national communism with attacks on Hungarians, Jews and the democratic opposition.[COLDWAR_PI_ROM_prm_chair_display]"
 COLDWAR_PI_ROM_prm_party_icon:0 "£ROM_nat_populism"
 COLDWAR_PI_ROM_prm_tt:0 "§YGreater Romania§! becomes §YGreater Romania Party§! (PRM, §Y1991§!)."
 COLDWAR_PI_ROM_prm_revert_tt:0 "§YPRM§! goes back to its former name and logo."
 COLDWAR_PI_SEN_ps_party:0 "£CW_PI_emblem_SEN_ps (PS) - Socialist Party of Senegal"
 COLDWAR_PI_SEN_ps_party_desc:0 "(African Socialism) - Socialist Party of Senegal (French: Parti Socialiste du Sénégal, PS)\n\nSenghor's Progressive Union has become the Socialist Party and joined the Socialist International. Limited pluralism returns to Senegal.[COLDWAR_PI_SEN_ps_chair_display]"
 COLDWAR_PI_SEN_ps_party_icon:0 "£CW_PI_emblem_SEN_ps"
 COLDWAR_PI_SEN_ps_tt:0 "§YSenegalese Progressive Union (UPS)§! becomes §YSocialist Party of Senegal§! (PS, §Y1976§!)."
 COLDWAR_PI_SEN_ps_revert_tt:0 "§YPS§! goes back to its former name and logo."
 COLDWAR_PI_SER_ds_party:0 "£CW_PI_emblem_SER_ds (DS) - Democratic Party"
 COLDWAR_PI_SER_ds_party_desc:0 "(Liberal Democracy) - Democratic Party (Serbo-Croatian: Demokratska stranka, DS)\n\nIntellectuals around Dragoljub Mićunović and Zoran Đinđić have refounded the prewar Democratic Party. The DS demands free elections, rule of law and a market economy.[COLDWAR_PI_SER_ds_chair_display]"
 COLDWAR_PI_SER_ds_party_icon:0 "£CW_PI_emblem_SER_ds"
 COLDWAR_PI_SER_ds_tt:0 "§YFederal Conservatives§! becomes §YDemocratic Party§! (DS, §Y1990§!)."
 COLDWAR_PI_SER_ds_revert_tt:0 "§YDS§! goes back to its former name and logo."
 COLDWAR_PI_SER_sk_pj_party:0 "£CW_PI_emblem_SER_sk_pj (SK-PJ) - League of Communists Movement for Yugoslavia"
 COLDWAR_PI_SER_sk_pj_party_desc:0 "(Yugoslav Unitarism) - League of Communists Movement for Yugoslavia (Serbo-Croatian: Savez komunista Pokret za Jugoslaviju, SK-PJ)\n\nAfter the Slovene and Croat delegates walked out, generals of the JNA and loyal cadres have founded the League of Communists Movement for Yugoslavia. Known as the generals' party, it defends the federation and the army's place within it.[COLDWAR_PI_SER_sk_pj_chair_display]"
 COLDWAR_PI_SER_sk_pj_party_icon:0 "£CW_PI_emblem_SER_sk_pj"
 COLDWAR_PI_SER_sk_pj_tt:0 "§YLeague of Communists of Yugoslavia (SKJ)§! becomes §YLeague of Communists Movement for Yugoslavia§! (SK-PJ, §Y1990§!)."
 COLDWAR_PI_SER_sk_pj_revert_tt:0 "§YSK-PJ§! goes back to its former name and logo."
 COLDWAR_PI_SER_sps_party:0 "£CW_PI_emblem_SER_sps (SPS) - Socialist Party of Serbia"
 COLDWAR_PI_SER_sps_party_desc:0 "(National Socialism of the Left) - Socialist Party of Serbia (Serbo-Croatian: Socijalistička partija Srbije, SPS)\n\nSlobodan Milošević has merged the League of Communists of Serbia and the Socialist Alliance into the Socialist Party of Serbia. It keeps the party apparatus and state media while preaching the unity of all Serbs in one state.[COLDWAR_PI_SER_sps_chair_display]"
 COLDWAR_PI_SER_sps_party_icon:0 "£CW_PI_emblem_SER_sps"
 COLDWAR_PI_SER_sps_tt:0 "§YSocialist Alliance of Working People of Yugoslavia (SSRNJ)§! becomes §YSocialist Party of Serbia§! (SPS, §Y1990§!)."
 COLDWAR_PI_SER_sps_revert_tt:0 "§YSPS§! goes back to its former name and logo."
 COLDWAR_PI_SER_spo_party:0 "£CW_PI_emblem_SER_spo (SPO) - Serbian Renewal Movement"
 COLDWAR_PI_SER_spo_party_desc:0 "(Royalist Nationalism) - Serbian Renewal Movement (Serbo-Croatian: Srpski pokret obnove, SPO)\n\nThe writer Vuk Drašković has founded the Serbian Renewal Movement, waving the royal tricolour and Chetnik memories. The SPO leads the March 1991 demonstrations against Milošević's control of television.[COLDWAR_PI_SER_spo_chair_display]"
 COLDWAR_PI_SER_spo_party_icon:0 "£CW_PI_emblem_SER_spo"
 COLDWAR_PI_SER_spo_tt:0 "§YRepublican Nationalists§! becomes §YSerbian Renewal Movement§! (SPO, §Y1990§!)."
 COLDWAR_PI_SER_spo_revert_tt:0 "§YSPO§! goes back to its former name and logo."
 COLDWAR_PI_SOV_dr_party:0 "(DR) - Democratic Russia"
 COLDWAR_PI_SOV_dr_party_desc:0 "(Liberal Democracy) - Democratic Russia (Russian: Demokraticheskaya Rossiya, DR)\n\nDeputies of the Interregional Group and the informal clubs have formed the Democratic Russia movement. It carries Boris Yeltsin to the chairmanship of the Russian Supreme Soviet and demands the end of the CPSU's monopoly.[COLDWAR_PI_SOV_dr_chair_display]"
 COLDWAR_PI_SOV_dr_party_icon:0 ""
 COLDWAR_PI_SOV_dr_tt:0 "§YCommittee for Human Rights§! becomes §YDemocratic Russia§! (DR, §Y1990§!)."
 COLDWAR_PI_SOV_dr_revert_tt:0 "§YDR§! goes back to its former name and logo."
 COLDWAR_PI_SOV_sdpr_party:0 "£CW_PI_emblem_SOV_sdpr (SDPR) - Social Democratic Party of Russia"
 COLDWAR_PI_SOV_sdpr_party_desc:0 "(Social Democracy) - Social Democratic Party of Russia (Russian: Sotsial-demokraticheskaya partiya Rossiyskoy Federatsii, SDPR)\n\nActivists of the Social Democratic Association have founded the Social Democratic Party of Russia under Oleg Rumyantsev. It seeks a Western style welfare state and a new Russian constitution.[COLDWAR_PI_SOV_sdpr_chair_display]"
 COLDWAR_PI_SOV_sdpr_party_icon:0 "£CW_PI_emblem_SOV_sdpr"
 COLDWAR_PI_SOV_sdpr_tt:0 "§YUnion of Democratic Socialists§! becomes §YSocial Democratic Party of Russia§! (SDPR, §Y1990§!)."
 COLDWAR_PI_SOV_sdpr_revert_tt:0 "§YSDPR§! goes back to its former name and logo."
 COLDWAR_PI_SOV_ds_party:0 "£SOV_democratic_soyus (DS) - Democratic Union"
 COLDWAR_PI_SOV_ds_party_desc:0 "(Radical Anti Communism) - Democratic Union (Russian: Demokraticheskiy soyuz, DS)\n\nValeriya Novodvorskaya and dissidents have proclaimed the Democratic Union, the first party to openly challenge the CPSU. Its activists are arrested at every rally for demanding a multi party system and the end of the Soviet regime.[COLDWAR_PI_SOV_ds_chair_display]"
 COLDWAR_PI_SOV_ds_party_icon:0 "£SOV_democratic_soyus"
 COLDWAR_PI_SOV_ds_tt:0 "§YFree Enterprise League§! becomes §YDemocratic Union§! (DS, §Y1988§!)."
 COLDWAR_PI_SOV_ds_revert_tt:0 "§YDS§! goes back to its former name and logo."
 COLDWAR_PI_SOV_kp_rsfsr_party:0 "(KP RSFSR) - Communist Party of the RSFSR"
 COLDWAR_PI_SOV_kp_rsfsr_party_desc:0 "(Orthodox Communism) - Communist Party of the RSFSR (Russian: Kommunisticheskaya partiya RSFSR, KP RSFSR)\n\nConservatives angry at Gorbachev's course have founded a separate Communist Party of the Russian republic under Ivan Polozkov. It defends the planned economy, the Union and the army against perestroika.[COLDWAR_PI_SOV_kp_rsfsr_chair_display]"
 COLDWAR_PI_SOV_kp_rsfsr_party_icon:0 ""
 COLDWAR_PI_SOV_kp_rsfsr_tt:0 "§YUnion of Sovereign Republics§! becomes §YCommunist Party of the RSFSR§! (KP RSFSR, §Y1990§!)."
 COLDWAR_PI_SOV_kp_rsfsr_revert_tt:0 "§YKP RSFSR§! goes back to its former name and logo."
 COLDWAR_PI_SOV_ldpss_party:0 "£CW_PI_emblem_SOV_ldpss (LDPSS) - Liberal Democratic Party of the Soviet Union"
 COLDWAR_PI_SOV_ldpss_party_desc:0 "(Nationalist Populism) - Liberal Democratic Party of the Soviet Union (Russian: Liberalno-demokraticheskaya partiya Sovetskogo Soyuza, LDPSS)\n\nVladimir Zhirinovsky has registered the Liberal Democratic Party of the Soviet Union, the first opposition party allowed to register. Despite its name it is loud, nationalist and promises cheap vodka and a restored empire.[COLDWAR_PI_SOV_ldpss_chair_display]"
 COLDWAR_PI_SOV_ldpss_party_icon:0 "£CW_PI_emblem_SOV_ldpss"
 COLDWAR_PI_SOV_ldpss_tt:0 "§YThe Russian Party§! becomes §YLiberal Democratic Party of the Soviet Union§! (LDPSS, §Y1990§!)."
 COLDWAR_PI_SOV_ldpss_revert_tt:0 "§YLDPSS§! goes back to its former name and logo."
 COLDWAR_PI_SPR_ciu_party:0 "£CW_PI_emblem_SPR_ciu (CiU) - Convergence and Union"
 COLDWAR_PI_SPR_ciu_party_desc:0 "(Catalan Liberal Nationalism) - Convergence and Union (Spanish: Convergència i Unió, CiU)\n\nJordi Pujol's Democratic Convergence of Catalonia and the Christian democrats of Unió have joined forces as Convergence and Union. The alliance speaks for Catalan business and the Catalan middle class, seeking home rule, the language and a moderate market economy.[COLDWAR_PI_SPR_ciu_chair_display]"
 COLDWAR_PI_SPR_ciu_party_icon:0 "£CW_PI_emblem_SPR_ciu"
 COLDWAR_PI_SPR_ciu_tt:0 "§YCircle of Economy§! becomes §YConvergence and Union§! (CiU, §Y1978§!)."
 COLDWAR_PI_SPR_ciu_revert_tt:0 "§YCiU§! goes back to its former name and logo."
 COLDWAR_PI_SPR_lv_party:0 "(LV) - The Greens"
 COLDWAR_PI_SPR_lv_party_desc:0 "(Political Ecology) - The Greens (Spanish: Los Verdes, LV)\n\nSpain's scattered ecologist groups have come together as the Greens after the Tenerife declaration. They campaign against nuclear power stations, NATO membership and the destruction of the coast by mass tourism.[COLDWAR_PI_SPR_lv_chair_display]"
 COLDWAR_PI_SPR_lv_party_icon:0 ""
 COLDWAR_PI_SPR_lv_tt:0 "§YAssociation for the Defence of Nature (ADENA)§! becomes §YThe Greens§! (LV, §Y1984§!)."
 COLDWAR_PI_SPR_lv_revert_tt:0 "§YLV§! goes back to its former name and logo."
 COLDWAR_PI_SPR_hb_party:0 "£CW_PI_emblem_SPR_hb (HB) - Popular Unity"
 COLDWAR_PI_SPR_hb_party_desc:0 "(Revolutionary Basque Nationalism) - Popular Unity (Spanish: Herri Batasuna, HB)\n\nThe abertzale left has united its parties into Popular Unity, the political arm of the KAS alternative. Herri Batasuna boycotts the Cortes, demands amnesty, self determination and the withdrawal of the security forces from Euskadi, and refuses to condemn ETA.[COLDWAR_PI_SPR_hb_chair_display]"
 COLDWAR_PI_SPR_hb_party_icon:0 "£CW_PI_emblem_SPR_hb"
 COLDWAR_PI_SPR_hb_tt:0 "§YCommunist Party of Spain (Marxist Leninist) (PCE m-l)§! becomes §YPopular Unity§! (HB, §Y1978§!)."
 COLDWAR_PI_SPR_hb_revert_tt:0 "§YHB§! goes back to its former name and logo."
 COLDWAR_PI_TAJ_hdt_party:0 "£TAJ_western_conservative (HDT) - Democratic Party of Tajikistan"
 COLDWAR_PI_TAJ_hdt_party_desc:0 "(Liberal Democracy) - Democratic Party of Tajikistan (Tajik: Hizbi Demokratii Tojikiston, HDT)\n\nShodmon Yusuf and the reform intelligentsia have founded the Democratic Party of Tajikistan. It allies with the Islamists and Rastokhez against the old nomenklatura.[COLDWAR_PI_TAJ_hdt_chair_display]"
 COLDWAR_PI_TAJ_hdt_party_icon:0 "£TAJ_western_conservative"
 COLDWAR_PI_TAJ_hdt_tt:0 "§YSixties Generation§! becomes §YDemocratic Party of Tajikistan§! (HDT, §Y1990§!)."
 COLDWAR_PI_TAJ_hdt_revert_tt:0 "§YHDT§! goes back to its former name and logo."
 COLDWAR_PI_TAJ_hst_party:0 "(HST) - Socialist Party of Tajikistan"
 COLDWAR_PI_TAJ_hst_party_desc:0 "(Democratic Socialism) - Socialist Party of Tajikistan (Tajik: Hizbi Sotsialistii Tojikiston, HST)\n\nUnder pressure from the street the Communist Party of Tajikistan has renamed itself the Socialist Party. Old cadres hope the new name will keep them in power.[COLDWAR_PI_TAJ_hst_chair_display]"
 COLDWAR_PI_TAJ_hst_party_icon:0 ""
 COLDWAR_PI_TAJ_hst_tt:0 "§YCommunist Party of Tajikistan (KPT)§! becomes §YSocialist Party of Tajikistan§! (HST, §Y1991§!)."
 COLDWAR_PI_TAJ_hst_revert_tt:0 "§YHST§! goes back to its former name and logo."
 COLDWAR_PI_TAJ_hnit_party:0 "£TAJ_kingdom (HNIT) - Islamic Renaissance Party of Tajikistan"
 COLDWAR_PI_TAJ_hnit_party_desc:0 "(Islamic Democracy) - Islamic Renaissance Party of Tajikistan (Tajik: Hizbi Nahzati Islomii Tojikiston, HNIT)\n\nFollowers of Said Abdullo Nuri have founded the Islamic Renaissance Party. It demands religious freedom and an end to communist atheism.[COLDWAR_PI_TAJ_hnit_chair_display]"
 COLDWAR_PI_TAJ_hnit_party_icon:0 "£TAJ_kingdom"
 COLDWAR_PI_TAJ_hnit_tt:0 "§YNuri's Circle§! becomes §YIslamic Renaissance Party of Tajikistan§! (HNIT, §Y1990§!)."
 COLDWAR_PI_TAJ_hnit_revert_tt:0 "§YHNIT§! goes back to its former name and logo."
 COLDWAR_PI_TNZ_ccm_party:0 "£CW_PI_emblem_TNZ_ccm (CCM) - Party of the Revolution"
 COLDWAR_PI_TNZ_ccm_party_desc:0 "(Ujamaa Socialism) - Party of the Revolution (Swahili: Chama Cha Mapinduzi, CCM)\n\nTANU and the Afro Shirazi Party have merged into the Party of the Revolution. It is the sole party of the union.[COLDWAR_PI_TNZ_ccm_chair_display]"
 COLDWAR_PI_TNZ_ccm_party_icon:0 "£CW_PI_emblem_TNZ_ccm"
 COLDWAR_PI_TNZ_ccm_tt:0 "§YTanganyika African National Union (TANU)§! becomes §YParty of the Revolution§! (CCM, §Y1977§!)."
 COLDWAR_PI_TNZ_ccm_revert_tt:0 "§YCCM§! goes back to its former name and logo."
 COLDWAR_PI_TRK_tdp_party:0 "(TDP) - Democratic Party of Turkmenistan"
 COLDWAR_PI_TRK_tdp_party_desc:0 "(Presidential Statism) - Democratic Party of Turkmenistan (Turkmen: Türkmenistanyň Demokratik Partiýasy, TDP)\n\nThe Communist Party of Turkmenistan has renamed itself the Democratic Party of Turkmenistan under Saparmurat Niyazov. Nothing changes but the name.[COLDWAR_PI_TRK_tdp_chair_display]"
 COLDWAR_PI_TRK_tdp_party_icon:0 ""
 COLDWAR_PI_TRK_tdp_tt:0 "§YCommunist Party of Turkmenistan (TKP)§! becomes §YDemocratic Party of Turkmenistan§! (TDP, §Y1991§!)."
 COLDWAR_PI_TRK_tdp_revert_tt:0 "§YTDP§! goes back to its former name and logo."
 COLDWAR_PI_TUN_rcd_party:0 "£CW_PI_emblem_TUN_rcd (RCD) - Constitutional Democratic Rally"
 COLDWAR_PI_TUN_rcd_party_desc:0 "(Presidential Statism) - Constitutional Democratic Rally (Arabic: Rassemblement constitutionnel démocratique, RCD)\n\nAfter deposing Bourguiba, Zine el Abidine Ben Ali has renamed the Destourian party the Constitutional Democratic Rally. It promises a democratic change.[COLDWAR_PI_TUN_rcd_chair_display]"
 COLDWAR_PI_TUN_rcd_party_icon:0 "£CW_PI_emblem_TUN_rcd"
 COLDWAR_PI_TUN_rcd_tt:0 "§YSocialist Destourian Party (PSD)§! becomes §YConstitutional Democratic Rally§! (RCD, §Y1988§!)."
 COLDWAR_PI_TUN_rcd_revert_tt:0 "§YRCD§! goes back to its former name and logo."
 COLDWAR_PI_UKR_urp_party:0 "(URP) - Ukrainian Republican Party"
 COLDWAR_PI_UKR_urp_party_desc:0 "(National Democracy) - Ukrainian Republican Party (Ukrainian: Ukrainska respublikanska partiya, URP)\n\nLevko Lukyanenko and the Helsinki Union veterans have founded the Ukrainian Republican Party, the first party openly to demand independence. It seeks to reclaim the heritage of the Ukrainian People's Republic.[COLDWAR_PI_UKR_urp_chair_display]"
 COLDWAR_PI_UKR_urp_party_icon:0 ""
 COLDWAR_PI_UKR_urp_tt:0 "§YState Centre of the UNR in Exile§! becomes §YUkrainian Republican Party§! (URP, §Y1990§!)."
 COLDWAR_PI_UKR_urp_revert_tt:0 "§YURP§! goes back to its former name and logo."
 COLDWAR_PI_UKR_rukh_party:0 "£ukr_pmu (Rukh) - People's Movement of Ukraine"
 COLDWAR_PI_UKR_rukh_party_desc:0 "(National Democracy) - People's Movement of Ukraine (Ukrainian: Narodnyi Rukh Ukrainy, Rukh)\n\nWriters led by Ivan Drach have founded the People's Movement of Ukraine for Perestroika. Rukh forms the human chain from Kyiv to Lviv and evolves from reform to the demand for independence.[COLDWAR_PI_UKR_rukh_chair_display]"
 COLDWAR_PI_UKR_rukh_party_icon:0 "£ukr_pmu"
 COLDWAR_PI_UKR_rukh_tt:0 "§YThe Sixtiers§! becomes §YPeople's Movement of Ukraine§! (Rukh, §Y1989§!)."
 COLDWAR_PI_UKR_rukh_revert_tt:0 "§YRukh§! goes back to its former name and logo."
 COLDWAR_PI_UKR_spu_party:0 "(SPU) - Socialist Party of Ukraine"
 COLDWAR_PI_UKR_spu_party_desc:0 "(Democratic Socialism) - Socialist Party of Ukraine (Ukrainian: Sotsialistychna partiya Ukrainy, SPU)\n\nAfter the communist party was banned following the August putsch, Oleksandr Moroz has gathered its members into the Socialist Party of Ukraine. It defends state property, collective farms and social guarantees.[COLDWAR_PI_UKR_spu_chair_display]"
 COLDWAR_PI_UKR_spu_party_icon:0 ""
 COLDWAR_PI_UKR_spu_tt:0 "§YCommunist Party of Ukraine (KPU)§! becomes §YSocialist Party of Ukraine§! (SPU, §Y1991§!)."
 COLDWAR_PI_UKR_spu_revert_tt:0 "§YSPU§! goes back to its former name and logo."
 COLDWAR_PI_UZB_birlik_party:0 "£CW_PI_emblem_UZB_birlik (Birlik) - Birlik People's Movement"
 COLDWAR_PI_UZB_birlik_party_desc:0 "(Democratic Nationalism) - Birlik People's Movement (Uzbek: Birlik Xalq Harakati, Birlik)\n\nIntellectuals led by Abdurahim Pulatov have founded the Birlik People's Movement. It protests the cotton monoculture, the dying Aral Sea and the second place of the Uzbek language.[COLDWAR_PI_UZB_birlik_chair_display]"
 COLDWAR_PI_UZB_birlik_party_icon:0 "£CW_PI_emblem_UZB_birlik"
 COLDWAR_PI_UZB_birlik_tt:0 "§YWriters' Union of Uzbekistan§! becomes §YBirlik People's Movement§! (Birlik, §Y1988§!)."
 COLDWAR_PI_UZB_birlik_revert_tt:0 "§YBirlik§! goes back to its former name and logo."
 COLDWAR_PI_UZB_erk_party:0 "£CW_PI_emblem_UZB_erk (Erk) - Erk Democratic Party"
 COLDWAR_PI_UZB_erk_party_desc:0 "(Democratic Nationalism) - Erk Democratic Party (Uzbek: Erk Demokratik Partiyasi, Erk)\n\nThe poet Muhammad Salih has led the moderates out of Birlik to found the Erk Democratic Party. It calls for sovereignty, the Uzbek language and democratic reform.[COLDWAR_PI_UZB_erk_chair_display]"
 COLDWAR_PI_UZB_erk_party_icon:0 "£CW_PI_emblem_UZB_erk"
 COLDWAR_PI_UZB_erk_tt:0 "§YNew Jadids§! becomes §YErk Democratic Party§! (Erk, §Y1990§!)."
 COLDWAR_PI_UZB_erk_revert_tt:0 "§YErk§! goes back to its former name and logo."
 COLDWAR_PI_UZB_xdp_party:0 "£CW_PI_emblem_UZB_xdp (XDP) - People's Democratic Party of Uzbekistan"
 COLDWAR_PI_UZB_xdp_party_desc:0 "(Presidential Statism) - People's Democratic Party of Uzbekistan (Uzbek: Xalq Demokratik Partiyasi, XDP)\n\nThe Communist Party of Uzbekistan has renamed itself the People's Democratic Party with Islam Karimov at its head. It keeps the old apparatus intact under a new banner.[COLDWAR_PI_UZB_xdp_chair_display]"
 COLDWAR_PI_UZB_xdp_party_icon:0 "£CW_PI_emblem_UZB_xdp"
 COLDWAR_PI_UZB_xdp_tt:0 "§YCommunist Party of Uzbekistan (O'zKP)§! becomes §YPeople's Democratic Party of Uzbekistan§! (XDP, §Y1991§!)."
 COLDWAR_PI_UZB_xdp_revert_tt:0 "§YXDP§! goes back to its former name and logo."
 COLDWAR_PI_AFG_watan:0 "Rename to Homeland Party (Watan)"
 COLDWAR_PI_AFG_watan_desc:0 "Najibullah has renamed the PDPA the Homeland Party and dropped Marxism Leninism. National reconciliation is its watchword.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_AFG_watan_revert:0 "Drop the Name Watan"
 COLDWAR_PI_AFG_watan_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ALB_pd:0 "Rename to Democratic Party of Albania (PD)"
 COLDWAR_PI_ALB_pd_desc:0 "Students and intellectuals led by Sali Berisha and Gramoz Pashko have founded the Democratic Party, the first opposition party since the war. The PD promises freedom, private property and a place in Europe.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_ALB_pd_revert:0 "Drop the Name PD"
 COLDWAR_PI_ALB_pd_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ALB_psd:0 "Rename to Social Democratic Party of Albania (PSD)"
 COLDWAR_PI_ALB_psd_desc:0 "Skënder Gjinushi and dissidents from the Democratic Party have founded the Social Democratic Party. It offers a moderate third way between the heirs of Hoxha and Berisha's Democrats.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_ALB_psd_revert:0 "Drop the Name PSD"
 COLDWAR_PI_ALB_psd_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ALB_pssh:0 "Rename to Socialist Party of Albania (PSSh)"
 COLDWAR_PI_ALB_pssh_desc:0 "At its tenth congress the Party of Labour has renounced Hoxha's legacy and become the Socialist Party under Fatos Nano. It accepts pluralism and the market while keeping the rural base of the old regime.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_ALB_pssh_revert:0 "Drop the Name PSSh"
 COLDWAR_PI_ALB_pssh_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ARM_hhsh:0 "Rename to Pan-Armenian National Movement (HHSh)"
 COLDWAR_PI_ARM_hhsh_desc:0 "The Karabakh Committee has become the Pan Armenian National Movement under Levon Ter Petrosyan. It wins the 1990 elections and leads Armenia towards independence.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_ARM_hhsh_revert:0 "Drop the Name HHSh"
 COLDWAR_PI_ARM_hhsh_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_AZE_ymp:0 "Rename to New Müsavat Party (YMP)"
 COLDWAR_PI_AZE_ymp_desc:0 "Isa Gambar has revived the historic Müsavat of Rasulzade as the New Müsavat Party. It keeps the legacy of the 1918 republic alive.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_AZE_ymp_revert:0 "Drop the Name YMP"
 COLDWAR_PI_AZE_ymp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_AZE_axc:0 "Rename to Azerbaijani Popular Front (AXC)"
 COLDWAR_PI_AZE_axc_desc:0 "Abulfaz Elchibey and the intelligentsia have founded the Azerbaijani Popular Front. Its rallies on Lenin Square follow Karabakh and the bloody January of 1990.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_AZE_axc_revert:0 "Drop the Name AXC"
 COLDWAR_PI_AZE_axc_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_BEL_ps_sp:0 "Rename to Socialist Party (split along language lines) (PS/SP)"
 COLDWAR_PI_BEL_ps_sp_desc:0 "The last unitary party has split into the francophone PS and the Flemish SP. Each fights for its own community.\n\nHistorically in §Y1978§!."
 COLDWAR_PI_BEL_ps_sp_revert:0 "Drop the Name PS/SP"
 COLDWAR_PI_BEL_ps_sp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_BEL_vb:0 "Rename to Flemish Bloc (VB)"
 COLDWAR_PI_BEL_vb_desc:0 "Karel Dillen's opponents of the Egmont Pact have founded the Vlaams Blok. It demands Flemish independence and a halt to immigration.\n\nHistorically in §Y1979§!."
 COLDWAR_PI_BEL_vb_revert:0 "Drop the Name VB"
 COLDWAR_PI_BEL_vb_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_BLR_bnf:0 "Rename to Belarusian Popular Front (BNF)"
 COLDWAR_PI_BLR_bnf_desc:0 "Zianon Pazniak, discoverer of the Kurapaty graves, has founded the Belarusian Popular Front Revival. It raises the white red white flag and the Pahonia and demands the truth about Chernobyl.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_BLR_bnf_revert:0 "Drop the Name BNF"
 COLDWAR_PI_BLR_bnf_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_BRA_pds:0 "Rename to Democratic Social Party (PDS)"
 COLDWAR_PI_BRA_pds_desc:0 "After the party reform ARENA has been reborn as the Democratic Social Party. It remains the government party of the military regime under Figueiredo.\n\nHistorically in §Y1980§!."
 COLDWAR_PI_BRA_pds_revert:0 "Drop the Name PDS"
 COLDWAR_PI_BRA_pds_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_BRA_pmdb:0 "Rename to Party of the Brazilian Democratic Movement (PMDB)"
 COLDWAR_PI_BRA_pmdb_desc:0 "The legal opposition has added the word party to its name, becoming the PMDB under Ulysses Guimarães. It leads the Diretas Já campaign for direct presidential elections.\n\nHistorically in §Y1980§!."
 COLDWAR_PI_BRA_pmdb_revert:0 "Drop the Name PMDB"
 COLDWAR_PI_BRA_pmdb_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_BRA_pdt:0 "Rename to Democratic Labour Party (PDT)"
 COLDWAR_PI_BRA_pdt_desc:0 "Leonel Brizola has founded the Democratic Labour Party after losing the PTB name to Ivete Vargas. It carries on Getúlio Vargas' labour tradition.\n\nHistorically in §Y1980§!."
 COLDWAR_PI_BRA_pdt_revert:0 "Drop the Name PDT"
 COLDWAR_PI_BRA_pdt_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_BRA_pfl:0 "Rename to Liberal Front Party (PFL)"
 COLDWAR_PI_BRA_pfl_desc:0 "Dissidents of the PDS have formed the Liberal Front to back Tancredo Neves. The PFL becomes the power broker of the New Republic.\n\nHistorically in §Y1985§!."
 COLDWAR_PI_BRA_pfl_revert:0 "Drop the Name PFL"
 COLDWAR_PI_BRA_pfl_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_BRA_pt:0 "Rename to Workers' Party (PT)"
 COLDWAR_PI_BRA_pt_desc:0 "Strike leaders of the ABC metalworkers, led by Lula, have founded the Workers' Party. It unites unionists, base communities and the new left.\n\nHistorically in §Y1980§!."
 COLDWAR_PI_BRA_pt_revert:0 "Drop the Name PT"
 COLDWAR_PI_BRA_pt_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_BUL_sds:0 "Rename to Union of Democratic Forces (SDS)"
 COLDWAR_PI_BUL_sds_desc:0 "Dissident clubs, the revived Agrarians and Social Democrats and the Podkrepa union have formed the Union of Democratic Forces under Zhelyu Zhelev. The blue coalition demands an end to communist power and fast reform.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_BUL_sds_revert:0 "Drop the Name SDS"
 COLDWAR_PI_BUL_sds_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_BUL_bsp:0 "Rename to Bulgarian Socialist Party (BSP)"
 COLDWAR_PI_BUL_bsp_desc:0 "After Zhivkov's fall the Bulgarian Communist Party has renamed itself the Bulgarian Socialist Party under Aleksandar Lilov. It wins the first free elections in the countryside while the cities turn against it.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_BUL_bsp_revert:0 "Drop the Name BSP"
 COLDWAR_PI_BUL_bsp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_BUL_dps:0 "Rename to Movement for Rights and Freedoms (DPS)"
 COLDWAR_PI_BUL_dps_desc:0 "Ahmed Doğan has founded the Movement for Rights and Freedoms after the forced renaming of Bulgaria's Turks. The DPS restores names, mosques and Turkish schools and becomes the kingmaker of the new parliament.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_BUL_dps_revert:0 "Drop the Name DPS"
 COLDWAR_PI_BUL_dps_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_BUL_eg:0 "Rename to Ecoglasnost (EG)"
 COLDWAR_PI_BUL_eg_desc:0 "Ecoglasnost was born in protest at the poisoning of Ruse by chlorine fumes from Romania. Its petition rally in November 1989 was the first open demonstration against the regime, and it now sits in the Union of Democratic Forces.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_BUL_eg_revert:0 "Drop the Name EG"
 COLDWAR_PI_BUL_eg_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_CHL_udi:0 "Rename to Independent Democratic Union (UDI)"
 COLDWAR_PI_CHL_udi_desc:0 "Jaime Guzmán's gremialists have founded the Independent Democratic Union. It defends the legacy of the military government.\n\nHistorically in §Y1983§!."
 COLDWAR_PI_CHL_udi_revert:0 "Drop the Name UDI"
 COLDWAR_PI_CHL_udi_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_CHL_rn:0 "Rename to National Renewal (RN)"
 COLDWAR_PI_CHL_rn_desc:0 "The heirs of the National Party have founded National Renewal. It supports the Yes in the plebiscite and then a negotiated transition.\n\nHistorically in §Y1987§!."
 COLDWAR_PI_CHL_rn_revert:0 "Drop the Name RN"
 COLDWAR_PI_CHL_rn_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_CHL_ppd:0 "Rename to Party for Democracy (PPD)"
 COLDWAR_PI_CHL_ppd_desc:0 "Ricardo Lagos has founded the Party for Democracy as a legal vehicle for the banned Socialists. It campaigns for the No.\n\nHistorically in §Y1987§!."
 COLDWAR_PI_CHL_ppd_revert:0 "Drop the Name PPD"
 COLDWAR_PI_CHL_ppd_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_CZE_kdu:0 "Rename to Christian and Democratic Union (KDU)"
 COLDWAR_PI_CZE_kdu_desc:0 "The People's Party has cast off its satellite past and joined Christian democratic groups in the Christian and Democratic Union. It speaks for Catholic Moravia and seeks restitution of church property.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_CZE_kdu_revert:0 "Drop the Name KDU"
 COLDWAR_PI_CZE_kdu_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_CZE_of:0 "Rename to Civic Forum (OF)"
 COLDWAR_PI_CZE_of_desc:0 "Václav Havel and the signatories of Charter 77 have founded Civic Forum in the Magic Lantern theatre. The movement leads the Velvet Revolution, negotiates the end of one party rule and puts Havel in the Castle.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_CZE_of_revert:0 "Drop the Name OF"
 COLDWAR_PI_CZE_of_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_CZE_kscm:0 "Rename to Communist Party of Bohemia and Moravia (KSČM)"
 COLDWAR_PI_CZE_kscm_desc:0 "In the Czech lands the Communist Party has refounded itself as the Communist Party of Bohemia and Moravia. It keeps the communist name and much of the membership while promising democratic socialism.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_CZE_kscm_revert:0 "Drop the Name KSČM"
 COLDWAR_PI_CZE_kscm_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_CZE_ods:0 "Rename to Civic Democratic Party (ODS)"
 COLDWAR_PI_CZE_ods_desc:0 "Finance minister Václav Klaus has turned the right wing of Civic Forum into the Civic Democratic Party. The ODS champions voucher privatisation and a market economy without adjectives.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_CZE_ods_revert:0 "Drop the Name ODS"
 COLDWAR_PI_CZE_ods_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_CZE_obroda:0 "Rename to Club for Socialist Restructuring Revival (Obroda)"
 COLDWAR_PI_CZE_obroda_desc:0 "Communists purged after 1968 have founded Obroda to demand the rehabilitation of the Prague Spring. Its members hope Alexander Dubček can lead a reformed socialism in the spirit of Gorbachev.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_CZE_obroda_revert:0 "Drop the Name Obroda"
 COLDWAR_PI_CZE_obroda_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_DDR_sdp:0 "Rename to Social Democratic Party in the GDR (SDP)"
 COLDWAR_PI_DDR_sdp_desc:0 "Pastors and dissidents meeting in Schwante have founded a Social Democratic Party in open defiance of the SED's claim to lead. In January 1990 it takes the old name SPD and seeks unity with its western sister party.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_DDR_sdp_revert:0 "Drop the Name SDP"
 COLDWAR_PI_DDR_sdp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_DDR_pds:0 "Rename to Party of Democratic Socialism (PDS)"
 COLDWAR_PI_DDR_pds_desc:0 "After the fall of the Wall the SED has renamed itself first SED PDS and then the Party of Democratic Socialism under Gregor Gysi. It apologises for the past, sheds most of its members and fights to keep a voice for the East in a united Germany.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_DDR_pds_revert:0 "Drop the Name PDS"
 COLDWAR_PI_DDR_pds_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_DDR_da:0 "Rename to Democratic Awakening (DA)"
 COLDWAR_PI_DDR_da_desc:0 "Church activists around Rainer Eppelmann and Wolfgang Schnur have founded Democratic Awakening. Moving quickly to the right, it joins the CDU in the Alliance for Germany and demands fast reunification and the Deutschmark.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_DDR_da_revert:0 "Drop the Name DA"
 COLDWAR_PI_DDR_da_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_DDR_nf:0 "Rename to New Forum (NF)"
 COLDWAR_PI_DDR_nf_desc:0 "Bärbel Bohley and Jens Reich have called the citizens to a dialogue in the New Forum. Its appeal gathers hundreds of thousands of signatures and its demands ring out at the Monday demonstrations in Leipzig.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_DDR_nf_revert:0 "Drop the Name NF"
 COLDWAR_PI_DDR_nf_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_EGY_wafd:0 "Rename to New Wafd Party (Wafd)"
 COLDWAR_PI_EGY_wafd_desc:0 "Fuad Serageddin has revived the Wafd of Zaghloul and Nahhas as the New Wafd Party. It calls for liberal democracy and a free economy.\n\nHistorically in §Y1978§!."
 COLDWAR_PI_EGY_wafd_revert:0 "Drop the Name Wafd"
 COLDWAR_PI_EGY_wafd_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_EGY_slp:0 "Rename to Socialist Labour Party (SLP)"
 COLDWAR_PI_EGY_slp_desc:0 "With Sadat's blessing Ibrahim Shukri has founded the Socialist Labour Party as a tame opposition. It drifts towards an Islamic platform.\n\nHistorically in §Y1978§!."
 COLDWAR_PI_EGY_slp_revert:0 "Drop the Name SLP"
 COLDWAR_PI_EGY_slp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_EGY_tagammu:0 "Rename to National Progressive Unionist Party (Tagammu)"
 COLDWAR_PI_EGY_tagammu_desc:0 "Khaled Mohieddin has led the left platform of the Arab Socialist Union into the National Progressive Unionist Party. It defends Nasser's social gains against the Infitah.\n\nHistorically in §Y1976§!."
 COLDWAR_PI_EGY_tagammu_revert:0 "Drop the Name Tagammu"
 COLDWAR_PI_EGY_tagammu_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ENG_sld:0 "Rename to Social and Liberal Democrats (SLD)"
 COLDWAR_PI_ENG_sld_desc:0 "The Liberals and most of the SDP have merged into the Social and Liberal Democrats under Paddy Ashdown. From 1989 they call themselves simply the Liberal Democrats.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_ENG_sld_revert:0 "Drop the Name SLD"
 COLDWAR_PI_ENG_sld_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ENG_dl:0 "Rename to Democratic Left (DL)"
 COLDWAR_PI_ENG_dl_desc:0 "The Communist Party of Great Britain has dissolved itself and reemerged as Democratic Left. It drops Leninism for a pluralist, green and feminist socialism.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_ENG_dl_revert:0 "Drop the Name DL"
 COLDWAR_PI_ENG_dl_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ENG_sdp:0 "Rename to Social Democratic Party (SDP)"
 COLDWAR_PI_ENG_sdp_desc:0 "The Gang of Four has broken with Labour to found the Social Democratic Party. In alliance with the Liberals it promises to break the mould of British politics.\n\nHistorically in §Y1981§!."
 COLDWAR_PI_ENG_sdp_revert:0 "Drop the Name SDP"
 COLDWAR_PI_ENG_sdp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_EST_ersp:0 "Rename to Estonian National Independence Party (ERSP)"
 COLDWAR_PI_EST_ersp_desc:0 "Former political prisoners led by Lagle Parek have founded the Estonian National Independence Party, the first non communist party in the Soviet Union. It rejects any compromise with the occupation and calls for the restoration of the prewar republic.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_EST_ersp_revert:0 "Drop the Name ERSP"
 COLDWAR_PI_EST_ersp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_EST_er:0 "Rename to Popular Front of Estonia (ER)"
 COLDWAR_PI_EST_er_desc:0 "Edgar Savisaar announced on television the creation of a Popular Front in support of perestroika. The movement fills the Singing Fields, demands economic self management and turns step by step towards independence.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_EST_er_revert:0 "Drop the Name ER"
 COLDWAR_PI_EST_er_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_EST_k:0 "Rename to Estonian Centre Party (K)"
 COLDWAR_PI_EST_k_desc:0 "The core of the Popular Front has organised itself as the Estonian Centre Party under Edgar Savisaar. It defends a gradual reform and a strong social safety net in the newly independent republic.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_EST_k_revert:0 "Drop the Name K"
 COLDWAR_PI_EST_k_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_FRA_udf:0 "Rename to Union for French Democracy (UDF)"
 COLDWAR_PI_FRA_udf_desc:0 "President Giscard d'Estaing's Republicans, the centrists of the CDS and the Radicals have joined in the Union for French Democracy. The UDF gives the president his own parliamentary force to balance Chirac's Gaullist RPR.\n\nHistorically in §Y1978§!."
 COLDWAR_PI_FRA_udf_revert:0 "Drop the Name UDF"
 COLDWAR_PI_FRA_udf_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_FRA_lcr:0 "Rename to Revolutionary Communist League (LCR)"
 COLDWAR_PI_FRA_lcr_desc:0 "After the Communist League was banned in 1973, Alain Krivine's Trotskyists have reconstituted themselves as the Revolutionary Communist League. The LCR is the French section of the Fourth International and recruits among students, teachers and young workers.\n\nHistorically in §Y1974§!."
 COLDWAR_PI_FRA_lcr_revert:0 "Drop the Name LCR"
 COLDWAR_PI_FRA_lcr_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_FRA_mrg:0 "Rename to Movement of Left Radicals (MRG)"
 COLDWAR_PI_FRA_mrg_desc:0 "Radicals who signed the Common Programme with the Socialists and Communists have broken with Servan Schreiber and formed the Movement of Left Radicals. Led by Robert Fabre, the MRG is the small liberal partner of the Union of the Left.\n\nHistorically in §Y1973§!."
 COLDWAR_PI_FRA_mrg_revert:0 "Drop the Name MRG"
 COLDWAR_PI_FRA_mrg_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_GEO_sedp:0 "Rename to National Democratic Party of Georgia (SEDP)"
 COLDWAR_PI_GEO_sedp_desc:0 "Giorgi Chanturia has revived the National Democratic Party of Georgia, rooted in the Ilia Chavchavadze Society. It stands for independence, the Orthodox Church and the Western path.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_GEO_sedp_revert:0 "Drop the Name SEDP"
 COLDWAR_PI_GEO_sedp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_GEO_mmts:0 "Rename to Round Table Free Georgia (MMTS)"
 COLDWAR_PI_GEO_mmts_desc:0 "The dissident Zviad Gamsakhurdia has united nationalist parties in the Round Table Free Georgia bloc. It wins the October 1990 elections and leads Georgia out of the Union.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_GEO_mmts_revert:0 "Drop the Name MMTS"
 COLDWAR_PI_GEO_mmts_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_GER_grune:0 "Rename to The Greens (Grüne)"
 COLDWAR_PI_GER_grune_desc:0 "Ecologists, peace activists and the new left have founded the Greens in Karlsruhe. They enter the Bundestag in 1983.\n\nHistorically in §Y1980§!."
 COLDWAR_PI_GER_grune_revert:0 "Drop the Name Grüne"
 COLDWAR_PI_GER_grune_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_GER_rep:0 "Rename to The Republicans (REP)"
 COLDWAR_PI_GER_rep_desc:0 "Former CSU deputies have founded the Republicans. Under Franz Schönhuber they win seats in Berlin and Strasbourg in 1989.\n\nHistorically in §Y1983§!."
 COLDWAR_PI_GER_rep_revert:0 "Drop the Name REP"
 COLDWAR_PI_GER_rep_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_GRE_edik:0 "Rename to Union of the Democratic Centre (EDIK)"
 COLDWAR_PI_GRE_edik_desc:0 "The Centre Union New Forces has reorganised itself as the Union of the Democratic Centre under Georgios Mavros. The party defends the liberal tradition of Venizelos and Papandreou against both the New Democracy right and the rising PASOK.\n\nHistorically in §Y1976§!."
 COLDWAR_PI_GRE_edik_revert:0 "Drop the Name EDIK"
 COLDWAR_PI_GRE_edik_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_GRE_syn:0 "Rename to Coalition of the Left and Progress (SYN)"
 COLDWAR_PI_GRE_syn_desc:0 "The KKE and the Greek Left have formed the Coalition of the Left and Progress under Charilaos Florakis and Leonidas Kyrkos. Synaspismos campaigns for catharsis against the Koskotas scandal and even joins a short coalition with New Democracy.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_GRE_syn_revert:0 "Drop the Name SYN"
 COLDWAR_PI_GRE_syn_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_GRE_epen:0 "Rename to National Political Union (EPEN)"
 COLDWAR_PI_GRE_epen_desc:0 "From his prison cell the former dictator Georgios Papadopoulos has sponsored the National Political Union. EPEN demands the release of the junta leaders and a strong state against communism, winning a seat in the European Parliament.\n\nHistorically in §Y1984§!."
 COLDWAR_PI_GRE_epen_revert:0 "Drop the Name EPEN"
 COLDWAR_PI_GRE_epen_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_HOL_cda:0 "Rename to Christian Democratic Appeal (CDA)"
 COLDWAR_PI_HOL_cda_desc:0 "The Catholic People's Party, the Anti Revolutionaries and the Christian Historicals have merged into the Christian Democratic Appeal. Under Van Agt and Lubbers it becomes the axis of Dutch government.\n\nHistorically in §Y1980§!."
 COLDWAR_PI_HOL_cda_revert:0 "Drop the Name CDA"
 COLDWAR_PI_HOL_cda_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_HOL_gl:0 "Rename to GreenLeft (GL)"
 COLDWAR_PI_HOL_gl_desc:0 "The Communists, Pacifist Socialists, Radicals and Evangelicals have merged into GreenLeft. It combines ecology, peace and social justice.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_HOL_gl_revert:0 "Drop the Name GL"
 COLDWAR_PI_HOL_gl_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_HUN_szdsz:0 "Rename to Alliance of Free Democrats (SZDSZ)"
 COLDWAR_PI_HUN_szdsz_desc:0 "The democratic opposition of the samizdat years has founded the Alliance of Free Democrats. Led by Kis and Tölgyessy, the SZDSZ demands a radical break with the regime, a market economy and the Western road.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_HUN_szdsz_revert:0 "Drop the Name SZDSZ"
 COLDWAR_PI_HUN_szdsz_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_HUN_mszp:0 "Rename to Hungarian Socialist Party (MSZP)"
 COLDWAR_PI_HUN_mszp_desc:0 "Reform communists led by Nyers, Pozsgay and Németh have dissolved the Socialist Workers' Party and founded the Hungarian Socialist Party. The MSZP accepts free elections and the market and seeks a place in European social democracy.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_HUN_mszp_revert:0 "Drop the Name MSZP"
 COLDWAR_PI_HUN_mszp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_HUN_fidesz:0 "Rename to Alliance of Young Democrats (Fidesz)"
 COLDWAR_PI_HUN_fidesz_desc:0 "Law students in Budapest have founded the Alliance of Young Democrats, open only to those under thirty five. At Imre Nagy's reburial their speaker Viktor Orbán demands that Soviet troops leave Hungary.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_HUN_fidesz_revert:0 "Drop the Name Fidesz"
 COLDWAR_PI_HUN_fidesz_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_HUN_mdf:0 "Rename to Hungarian Democratic Forum (MDF)"
 COLDWAR_PI_HUN_mdf_desc:0 "Populist writers meeting at Lakitelek have founded the Hungarian Democratic Forum. Under József Antall it promises a calm transition, Christian national values and care for Hungarians beyond the borders.\n\nHistorically in §Y1987§!."
 COLDWAR_PI_HUN_mdf_revert:0 "Drop the Name MDF"
 COLDWAR_PI_HUN_mdf_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_IND_golkar:0 "Rename to Functional Groups (Golkar)"
 COLDWAR_PI_IND_golkar_desc:0 "The Joint Secretariat has become Golkar, the electoral vehicle of the New Order. Backed by the army and the civil service, it wins the 1971 elections.\n\nHistorically in §Y1971§!."
 COLDWAR_PI_IND_golkar_revert:0 "Drop the Name Golkar"
 COLDWAR_PI_IND_golkar_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_IND_ppp:0 "Rename to United Development Party (PPP)"
 COLDWAR_PI_IND_ppp_desc:0 "Under Suharto's fusion policy NU, Parmusi, PSII and Perti have been merged into the United Development Party. It is the only legal voice of political Islam.\n\nHistorically in §Y1973§!."
 COLDWAR_PI_IND_ppp_revert:0 "Drop the Name PPP"
 COLDWAR_PI_IND_ppp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_IND_pdi:0 "Rename to Indonesian Democratic Party (PDI)"
 COLDWAR_PI_IND_pdi_desc:0 "The PNI, the Christian parties, Murba and IPKI have been merged into the Indonesian Democratic Party. Sukarno's portrait is still its strongest asset.\n\nHistorically in §Y1973§!."
 COLDWAR_PI_IND_pdi_revert:0 "Drop the Name PDI"
 COLDWAR_PI_IND_pdi_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ITA_ppi:0 "Rename to Italian People's Party (PPI)"
 COLDWAR_PI_ITA_ppi_desc:0 "Christian Democracy has taken back the name of Don Luigi Sturzo's party of 1919, the Italian People's Party. Mino Martinazzoli wants a clean Catholic centre after the scandals, free of the old correnti and of the patronage that bound the party to every ministry for half a century.\n\nHistorically in §Y1994§!."
 COLDWAR_PI_ITA_ppi_revert:0 "Drop the Name PPI"
 COLDWAR_PI_ITA_ppi_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ITA_psdi:0 "Rename to Italian Democratic Socialist Party (PSDI)"
 COLDWAR_PI_ITA_psdi_desc:0 "The Unitary Socialists have taken back the old name of Saragat's party, the Italian Democratic Socialist Party. Under Mauro Ferri and loyal to NATO and the centre left, the PSDI presents itself as the anticommunist wing of Italian socialism and an indispensable partner of every Christian Democratic cabinet.\n\nHistorically in §Y1971§!."
 COLDWAR_PI_ITA_psdi_revert:0 "Drop the Name PSDI"
 COLDWAR_PI_ITA_psdi_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ITA_pds:0 "Rename to Democratic Party of the Left (PDS)"
 COLDWAR_PI_ITA_pds_desc:0 "At the Rimini congress Achille Occhetto has buried the hammer and sickle and turned the Italian Communist Party into the Democratic Party of the Left. The new party seeks entry into the Socialist International and presents itself as the governing alternative to forty years of Christian Democratic rule.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_ITA_pds_revert:0 "Drop the Name PDS"
 COLDWAR_PI_ITA_pds_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ITA_ln:0 "Rename to Northern League (LN)"
 COLDWAR_PI_ITA_ln_desc:0 "Umberto Bossi has fused the Lombard League with the leagues of Veneto, Piedmont and Liguria into the Northern League. Under the sword of Alberto da Giussano it rails against Rome, southern patronage and taxes, demanding a federal Italy of macroregions.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_ITA_ln_revert:0 "Drop the Name LN"
 COLDWAR_PI_ITA_ln_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ITA_lp:0 "Rename to Pannella List (LP)"
 COLDWAR_PI_ITA_lp_desc:0 "The Radical Party no longer stands in elections under its own name and presents the Pannella List instead. Marco Pannella turns the movement into a vehicle for referendums on the electoral law, the end of public party funding and the separation of the judiciary from politics.\n\nHistorically in §Y1992§!."
 COLDWAR_PI_ITA_lp_revert:0 "Drop the Name LP"
 COLDWAR_PI_ITA_lp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ITA_fdv:0 "Rename to Federation of the Greens (FdV)"
 COLDWAR_PI_ITA_fdv_desc:0 "The Green Lists and the Rainbow Greens have united under the laughing sun as the Federation of the Greens. After Chernobyl and the 1987 referendum against nuclear power the ecologists demand an end to reactors, clean rivers and a new model of development.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_ITA_fdv_revert:0 "Drop the Name FdV"
 COLDWAR_PI_ITA_fdv_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ITA_psi:0 "Adopt the Socialist Carnation"
 COLDWAR_PI_ITA_psi_desc:0 "The Italian Socialist Party adopts the red carnation introduced at its Turin congress under Bettino Craxi.\n\nHistorically in §Y1978§!."
 COLDWAR_PI_ITA_psi_revert:0 "Restore the Earlier Socialist Emblem"
 COLDWAR_PI_ITA_psi_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ITA_prc:0 "Rename to Communist Refoundation Party (PRC)"
 COLDWAR_PI_ITA_prc_desc:0 "Communists who refused to follow Occhetto out of the PCI have joined Democrazia Proletaria to found Communist Refoundation. Under Garavini and Cossutta the party keeps the red flag, defends the scala mobile and denounces the Gulf War and the new Atlantic order.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_ITA_prc_revert:0 "Drop the Name PRC"
 COLDWAR_PI_ITA_prc_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ITA_msi_dn:0 "Rename to Italian Social Movement National Right (MSI-DN)"
 COLDWAR_PI_ITA_msi_dn_desc:0 "Giorgio Almirante has absorbed the monarchists of the PDIUM and rebranded the Italian Social Movement as the National Right. Behind a respectable conservative front the party still guards the tricolour flame of the Social Republic and courts the frightened middle classes of the South.\n\nHistorically in §Y1972§!."
 COLDWAR_PI_ITA_msi_dn_revert:0 "Drop the Name MSI-DN"
 COLDWAR_PI_ITA_msi_dn_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ITA_an:0 "Rename to National Alliance (AN)"
 COLDWAR_PI_ITA_an_desc:0 "At the congress of Fiuggi the Italian Social Movement has dissolved itself into the National Alliance. Gianfranco Fini declares that the party leaves fascism to history and offers the right a modern conservative home, while the hardliners who refuse the turn walk out to keep the old flame burning.\n\nHistorically in §Y1995§!."
 COLDWAR_PI_ITA_an_revert:0 "Drop the Name AN"
 COLDWAR_PI_ITA_an_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_KAZ_spk:0 "Rename to Socialist Party of Kazakhstan (SPK)"
 COLDWAR_PI_KAZ_spk_desc:0 "After the August putsch the Communist Party of Kazakhstan has renamed itself the Socialist Party. Nazarbayev leaves its ranks and the party loses its hold over the republic.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_KAZ_spk_revert:0 "Drop the Name SPK"
 COLDWAR_PI_KAZ_spk_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_KAZ_ns:0 "Rename to Nevada Semipalatinsk Movement (NS)"
 COLDWAR_PI_KAZ_ns_desc:0 "The poet Olzhas Suleimenov has founded the Nevada Semipalatinsk Movement against nuclear testing. Its rallies gather hundreds of thousands and force an end to explosions at the Polygon.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_KAZ_ns_revert:0 "Drop the Name NS"
 COLDWAR_PI_KAZ_ns_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_KOR_djp:0 "Rename to Democratic Justice Party (DJP)"
 COLDWAR_PI_KOR_djp_desc:0 "After the Gwangju massacre General Chun Doo hwan has replaced the DRP with the Democratic Justice Party. It rules the Fifth Republic.\n\nHistorically in §Y1981§!."
 COLDWAR_PI_KOR_djp_revert:0 "Drop the Name DJP"
 COLDWAR_PI_KOR_djp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_KOR_dlp:0 "Rename to Democratic Liberal Party (DLP)"
 COLDWAR_PI_KOR_dlp_desc:0 "Roh Tae woo's DJP has merged with the parties of Kim Young sam and Kim Jong pil. The new party holds a crushing majority.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_KOR_dlp_revert:0 "Drop the Name DLP"
 COLDWAR_PI_KOR_dlp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_KOR_nkdp:0 "Rename to New Korea Democratic Party (NKDP)"
 COLDWAR_PI_KOR_nkdp_desc:0 "Kim Dae jung and Kim Young sam have founded the New Korea Democratic Party. It wins the 1985 elections and demands direct presidential elections.\n\nHistorically in §Y1985§!."
 COLDWAR_PI_KOR_nkdp_revert:0 "Drop the Name NKDP"
 COLDWAR_PI_KOR_nkdp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_KYR_kdk:0 "Rename to Democratic Movement of Kyrgyzstan (KDK)"
 COLDWAR_PI_KYR_kdk_desc:0 "After the Osh riots reformers have founded the Democratic Movement of Kyrgyzstan. Its hunger strikers help elect Askar Akayev president.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_KYR_kdk_revert:0 "Drop the Name KDK"
 COLDWAR_PI_KYR_kdk_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_LAT_lddp:0 "Rename to Democratic Labour Party of Latvia (LDDP)"
 COLDWAR_PI_LAT_lddp_desc:0 "Communists who broke with Moscow have formed an independent party and then renamed it the Democratic Labour Party of Latvia. They support independence while Alfrēds Rubiks' loyalists remain in the Soviet communist party.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_LAT_lddp_revert:0 "Drop the Name LDDP"
 COLDWAR_PI_LAT_lddp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_LAT_ltf:0 "Rename to Popular Front of Latvia (LTF)"
 COLDWAR_PI_LAT_ltf_desc:0 "Writers, journalists and reform communists have founded the Popular Front of Latvia. It organises the Baltic Way and wins the 1990 elections on a programme of independence.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_LAT_ltf_revert:0 "Drop the Name LTF"
 COLDWAR_PI_LAT_ltf_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_LAT_lnnk:0 "Rename to Latvian National Independence Movement (LNNK)"
 COLDWAR_PI_LAT_lnnk_desc:0 "Eduards Berklavs, the purged national communist of 1959, has founded the Latvian National Independence Movement. The LNNK demands full independence and the departure of Soviet settlers and troops.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_LAT_lnnk_revert:0 "Drop the Name LNNK"
 COLDWAR_PI_LAT_lnnk_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_LIT_sajudis:0 "Rename to Reform Movement of Lithuania (Sąjūdis)"
 COLDWAR_PI_LIT_sajudis_desc:0 "Intellectuals at the Academy of Sciences have founded Sąjūdis, the Reform Movement of Lithuania. Under Vytautas Landsbergis it wins the 1990 elections and proclaims the restoration of independence on 11 March.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_LIT_sajudis_revert:0 "Drop the Name Sąjūdis"
 COLDWAR_PI_LIT_sajudis_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_LIT_lddp:0 "Rename to Democratic Labour Party of Lithuania (LDDP)"
 COLDWAR_PI_LIT_lddp_desc:0 "Algirdas Brazauskas led the Lithuanian communists out of the CPSU in 1989, and now the party has renamed itself the Democratic Labour Party. It supports independence while promising social protection and pragmatic reform.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_LIT_lddp_revert:0 "Drop the Name LDDP"
 COLDWAR_PI_LIT_lddp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_LIT_lzj:0 "Rename to Lithuanian Green Movement (LŽJ)"
 COLDWAR_PI_LIT_lzj_desc:0 "Protests against the Ignalina reactor and drilling in the Baltic have given birth to the Lithuanian Green Movement. Ecology becomes a patriotic cause and a shield for the independence movement.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_LIT_lzj_revert:0 "Drop the Name LŽJ"
 COLDWAR_PI_LIT_lzj_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_MEX_psum:0 "Rename to Unified Socialist Party of Mexico (PSUM)"
 COLDWAR_PI_MEX_psum_desc:0 "The Mexican Communist Party has merged with smaller left parties into the Unified Socialist Party. It drops Leninism for democratic socialism.\n\nHistorically in §Y1981§!."
 COLDWAR_PI_MEX_psum_revert:0 "Drop the Name PSUM"
 COLDWAR_PI_MEX_psum_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_MEX_prd:0 "Rename to Party of the Democratic Revolution (PRD)"
 COLDWAR_PI_MEX_prd_desc:0 "Cuauhtémoc Cárdenas has founded the PRD after the disputed election of 1988. It rallies the nationalist left against the PRI.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_MEX_prd_revert:0 "Drop the Name PRD"
 COLDWAR_PI_MEX_prd_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_MLV_fpm:0 "Rename to Popular Front of Moldova (FPM)"
 COLDWAR_PI_MLV_fpm_desc:0 "Writers and students have founded the Popular Front of Moldova. It wins the Latin alphabet and the tricolour and pushes for union with Romania.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_MLV_fpm_revert:0 "Drop the Name FPM"
 COLDWAR_PI_MLV_fpm_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_PER_rastakhiz:0 "Rename to Resurgence Party (Rastakhiz)"
 COLDWAR_PI_PER_rastakhiz_desc:0 "The Shah has dissolved all parties into the Resurgence Party. Every loyal Iranian is to join.\n\nHistorically in §Y1975§!."
 COLDWAR_PI_PER_rastakhiz_revert:0 "Drop the Name Rastakhiz"
 COLDWAR_PI_PER_rastakhiz_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_POL_pc:0 "Rename to Centre Agreement (PC)"
 COLDWAR_PI_POL_pc_desc:0 "Jarosław Kaczyński has founded the Centre Agreement to back Lech Wałęsa for the presidency. The party demands an acceleration of change, decommunisation and a clean break with the round table compromise.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_POL_pc_revert:0 "Drop the Name PC"
 COLDWAR_PI_POL_pc_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_POL_ud:0 "Rename to Democratic Union (UD)"
 COLDWAR_PI_POL_ud_desc:0 "Tadeusz Mazowiecki's supporters from the Citizens' Committees have founded the Democratic Union. Bringing together former Solidarity advisers such as Geremek and Kuroń, it stands for European integration, the rule of law and gradual market reform.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_POL_ud_revert:0 "Drop the Name UD"
 COLDWAR_PI_POL_ud_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_POL_sdrp:0 "Rename to Social Democracy of the Republic of Poland (SdRP)"
 COLDWAR_PI_POL_sdrp_desc:0 "At its last congress the PZPR has dissolved itself and reemerged as Social Democracy of the Republic of Poland under Aleksander Kwaśniewski. The party embraces parliamentary democracy and the market while defending the welfare of those left behind by shock therapy.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_POL_sdrp_revert:0 "Drop the Name SdRP"
 COLDWAR_PI_POL_sdrp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_POL_kor:0 "Rename to Workers' Defence Committee (KOR)"
 COLDWAR_PI_POL_kor_desc:0 "After the Radom and Ursus strikes Kuroń, Michnik and Lipski have founded the Workers' Defence Committee to aid persecuted workers. KOR publishes underground bulletins and builds the bridge between the intelligentsia and the factories.\n\nHistorically in §Y1976§!."
 COLDWAR_PI_POL_kor_revert:0 "Drop the Name KOR"
 COLDWAR_PI_POL_kor_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_POL_psl:0 "Rename to Polish People's Party (PSL)"
 COLDWAR_PI_POL_psl_desc:0 "The United People's Party has thrown off its role as a satellite and refounded the historic Polish People's Party of Witos and Mikołajczyk. The PSL speaks for private farmers threatened by cheap imports and falling prices.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_POL_psl_revert:0 "Drop the Name PSL"
 COLDWAR_PI_POL_psl_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_POR_ppd:0 "Rename to Popular Democratic Party (PPD)"
 COLDWAR_PI_POR_ppd_desc:0 "Sá Carneiro, Balsemão and Magalhães Mota, the deputies of the Liberal Wing, have founded the Popular Democratic Party after the Carnation Revolution. The PPD wants a pluralist, European Portugal and resists the drift of the revolution towards the Communists and the officers of the MFA.\n\nHistorically in §Y1974§!."
 COLDWAR_PI_POR_ppd_revert:0 "Drop the Name PPD"
 COLDWAR_PI_POR_ppd_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_POR_psd:0 "Rename to Social Democratic Party (PSD)"
 COLDWAR_PI_POR_psd_desc:0 "The Popular Democrats have renamed themselves the Social Democratic Party. Under Sá Carneiro the PSD leads the centre right towards the Democratic Alliance, promising to roll back nationalisations and to anchor Portugal in the European Community.\n\nHistorically in §Y1976§!."
 COLDWAR_PI_POR_psd_revert:0 "Drop the Name PSD"
 COLDWAR_PI_POR_psd_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_POR_prd:0 "Rename to Democratic Renewal Party (PRD)"
 COLDWAR_PI_POR_prd_desc:0 "Supporters of President Ramalho Eanes have founded the Democratic Renewal Party to break the old party system. The PRD promises moral renewal, an end to clientelism and a modern administration.\n\nHistorically in §Y1985§!."
 COLDWAR_PI_POR_prd_revert:0 "Drop the Name PRD"
 COLDWAR_PI_POR_prd_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_POR_cds:0 "Rename to Democratic and Social Centre (CDS)"
 COLDWAR_PI_POR_cds_desc:0 "Diogo Freitas do Amaral has founded the Democratic and Social Centre as the Christian democratic voice of a Catholic Portugal. Branded reactionary by the revolutionary left, the CDS is the only party to vote against the socialist constitution of 1976.\n\nHistorically in §Y1974§!."
 COLDWAR_PI_POR_cds_revert:0 "Drop the Name CDS"
 COLDWAR_PI_POR_cds_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_POR_mdp_cde:0 "Rename to Portuguese Democratic Movement (MDP/CDE)"
 COLDWAR_PI_POR_mdp_cde_desc:0 "The electoral commissions of the democratic opposition have become a party, the Portuguese Democratic Movement. Close to the Communists, the MDP/CDE sits in the provisional governments and supports nationalisation and land reform.\n\nHistorically in §Y1974§!."
 COLDWAR_PI_POR_mdp_cde_revert:0 "Drop the Name MDP/CDE"
 COLDWAR_PI_POR_mdp_cde_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_POR_pctp_mrpp:0 "Rename to Portuguese Workers' Communist Party (PCTP/MRPP)"
 COLDWAR_PI_POR_pctp_mrpp_desc:0 "The Movement for the Reorganisation of the Party of the Proletariat has registered as the Portuguese Workers' Communist Party. Its militants paint the walls of Lisbon with red slogans and attack the PCP as social fascist lackeys of Moscow.\n\nHistorically in §Y1976§!."
 COLDWAR_PI_POR_pctp_mrpp_revert:0 "Drop the Name PCTP/MRPP"
 COLDWAR_PI_POR_pctp_mrpp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_RAJ_jnp:0 "Rename to People's Party (JNP)"
 COLDWAR_PI_RAJ_jnp_desc:0 "The Congress (O), Jana Sangh, Lok Dal and Socialists have merged into the Janata Party under Morarji Desai. It ends thirty years of Congress rule.\n\nHistorically in §Y1977§!."
 COLDWAR_PI_RAJ_jnp_revert:0 "Drop the Name JNP"
 COLDWAR_PI_RAJ_jnp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_RAJ_jd:0 "Rename to People's Party (Dal) (JD)"
 COLDWAR_PI_RAJ_jd_desc:0 "V. P. Singh has united the Janata Party, Lok Dal and Jan Morcha in the Janata Dal. It promises clean government and reservations under the Mandal report.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_RAJ_jd_revert:0 "Drop the Name JD"
 COLDWAR_PI_RAJ_jd_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_RAJ_inc_i:0 "Rename to Indian National Congress (Indira) (INC(I))"
 COLDWAR_PI_RAJ_inc_i_desc:0 "After the Emergency defeat Indira Gandhi has split the Congress again. Her Congress (I) sweeps back to power in 1980.\n\nHistorically in §Y1978§!."
 COLDWAR_PI_RAJ_inc_i_revert:0 "Drop the Name INC(I)"
 COLDWAR_PI_RAJ_inc_i_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_RAJ_bjp:0 "Rename to Indian People's Party (BJP)"
 COLDWAR_PI_RAJ_bjp_desc:0 "Former Jana Sangh members led by Atal Bihari Vajpayee have founded the Bharatiya Janata Party. It speaks of Gandhian socialism and Hindu cultural nationalism.\n\nHistorically in §Y1980§!."
 COLDWAR_PI_RAJ_bjp_revert:0 "Drop the Name BJP"
 COLDWAR_PI_RAJ_bjp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ROM_pntcd:0 "Rename to Christian Democratic National Peasants' Party (PNTCD)"
 COLDWAR_PI_ROM_pntcd_desc:0 "Corneliu Coposu has revived the historic Peasants' Party as the Christian Democratic National Peasants' Party. It leads the anticommunist opposition and calls for the return of King Michael and of confiscated property.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_ROM_pntcd_revert:0 "Drop the Name PNTCD"
 COLDWAR_PI_ROM_pntcd_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ROM_fsn:0 "Rename to National Salvation Front (FSN)"
 COLDWAR_PI_ROM_fsn_desc:0 "With Ceauşescu fallen, Ion Iliescu and his circle have proclaimed the National Salvation Front and then registered it as a party. The Front takes over the state apparatus and promises democracy, while miners loyal to it storm Bucharest.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_ROM_fsn_revert:0 "Drop the Name FSN"
 COLDWAR_PI_ROM_fsn_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ROM_udmr:0 "Rename to Democratic Alliance of Hungarians in Romania (UDMR)"
 COLDWAR_PI_ROM_udmr_desc:0 "The Hungarians of Transylvania have founded their own Democratic Alliance in the first days after the revolution. The UDMR demands Hungarian schools, the university in Cluj and local autonomy.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_ROM_udmr_revert:0 "Drop the Name UDMR"
 COLDWAR_PI_ROM_udmr_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_ROM_prm:0 "Rename to Greater Romania Party (PRM)"
 COLDWAR_PI_ROM_prm_desc:0 "The court poet Corneliu Vadim Tudor has founded the Greater Romania Party around his weekly. The PRM blends nostalgia for Ceauşescu's national communism with attacks on Hungarians, Jews and the democratic opposition.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_ROM_prm_revert:0 "Drop the Name PRM"
 COLDWAR_PI_ROM_prm_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_SEN_ps:0 "Rename to Socialist Party of Senegal (PS)"
 COLDWAR_PI_SEN_ps_desc:0 "Senghor's Progressive Union has become the Socialist Party and joined the Socialist International. Limited pluralism returns to Senegal.\n\nHistorically in §Y1976§!."
 COLDWAR_PI_SEN_ps_revert:0 "Drop the Name PS"
 COLDWAR_PI_SEN_ps_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_SER_ds:0 "Rename to Democratic Party (DS)"
 COLDWAR_PI_SER_ds_desc:0 "Intellectuals around Dragoljub Mićunović and Zoran Đinđić have refounded the prewar Democratic Party. The DS demands free elections, rule of law and a market economy.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_SER_ds_revert:0 "Drop the Name DS"
 COLDWAR_PI_SER_ds_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_SER_sk_pj:0 "Rename to League of Communists Movement for Yugoslavia (SK-PJ)"
 COLDWAR_PI_SER_sk_pj_desc:0 "After the Slovene and Croat delegates walked out, generals of the JNA and loyal cadres have founded the League of Communists Movement for Yugoslavia. Known as the generals' party, it defends the federation and the army's place within it.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_SER_sk_pj_revert:0 "Drop the Name SK-PJ"
 COLDWAR_PI_SER_sk_pj_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_SER_sps:0 "Rename to Socialist Party of Serbia (SPS)"
 COLDWAR_PI_SER_sps_desc:0 "Slobodan Milošević has merged the League of Communists of Serbia and the Socialist Alliance into the Socialist Party of Serbia. It keeps the party apparatus and state media while preaching the unity of all Serbs in one state.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_SER_sps_revert:0 "Drop the Name SPS"
 COLDWAR_PI_SER_sps_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_SER_spo:0 "Rename to Serbian Renewal Movement (SPO)"
 COLDWAR_PI_SER_spo_desc:0 "The writer Vuk Drašković has founded the Serbian Renewal Movement, waving the royal tricolour and Chetnik memories. The SPO leads the March 1991 demonstrations against Milošević's control of television.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_SER_spo_revert:0 "Drop the Name SPO"
 COLDWAR_PI_SER_spo_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_SOV_dr:0 "Rename to Democratic Russia (DR)"
 COLDWAR_PI_SOV_dr_desc:0 "Deputies of the Interregional Group and the informal clubs have formed the Democratic Russia movement. It carries Boris Yeltsin to the chairmanship of the Russian Supreme Soviet and demands the end of the CPSU's monopoly.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_SOV_dr_revert:0 "Drop the Name DR"
 COLDWAR_PI_SOV_dr_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_SOV_sdpr:0 "Rename to Social Democratic Party of Russia (SDPR)"
 COLDWAR_PI_SOV_sdpr_desc:0 "Activists of the Social Democratic Association have founded the Social Democratic Party of Russia under Oleg Rumyantsev. It seeks a Western style welfare state and a new Russian constitution.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_SOV_sdpr_revert:0 "Drop the Name SDPR"
 COLDWAR_PI_SOV_sdpr_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_SOV_ds:0 "Rename to Democratic Union (DS)"
 COLDWAR_PI_SOV_ds_desc:0 "Valeriya Novodvorskaya and dissidents have proclaimed the Democratic Union, the first party to openly challenge the CPSU. Its activists are arrested at every rally for demanding a multi party system and the end of the Soviet regime.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_SOV_ds_revert:0 "Drop the Name DS"
 COLDWAR_PI_SOV_ds_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_SOV_kp_rsfsr:0 "Rename to Communist Party of the RSFSR (KP RSFSR)"
 COLDWAR_PI_SOV_kp_rsfsr_desc:0 "Conservatives angry at Gorbachev's course have founded a separate Communist Party of the Russian republic under Ivan Polozkov. It defends the planned economy, the Union and the army against perestroika.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_SOV_kp_rsfsr_revert:0 "Drop the Name KP RSFSR"
 COLDWAR_PI_SOV_kp_rsfsr_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_SOV_ldpss:0 "Rename to Liberal Democratic Party of the Soviet Union (LDPSS)"
 COLDWAR_PI_SOV_ldpss_desc:0 "Vladimir Zhirinovsky has registered the Liberal Democratic Party of the Soviet Union, the first opposition party allowed to register. Despite its name it is loud, nationalist and promises cheap vodka and a restored empire.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_SOV_ldpss_revert:0 "Drop the Name LDPSS"
 COLDWAR_PI_SOV_ldpss_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_SPR_ciu:0 "Rename to Convergence and Union (CiU)"
 COLDWAR_PI_SPR_ciu_desc:0 "Jordi Pujol's Democratic Convergence of Catalonia and the Christian democrats of Unió have joined forces as Convergence and Union. The alliance speaks for Catalan business and the Catalan middle class, seeking home rule, the language and a moderate market economy.\n\nHistorically in §Y1978§!."
 COLDWAR_PI_SPR_ciu_revert:0 "Drop the Name CiU"
 COLDWAR_PI_SPR_ciu_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_SPR_lv:0 "Rename to The Greens (LV)"
 COLDWAR_PI_SPR_lv_desc:0 "Spain's scattered ecologist groups have come together as the Greens after the Tenerife declaration. They campaign against nuclear power stations, NATO membership and the destruction of the coast by mass tourism.\n\nHistorically in §Y1984§!."
 COLDWAR_PI_SPR_lv_revert:0 "Drop the Name LV"
 COLDWAR_PI_SPR_lv_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_SPR_hb:0 "Rename to Popular Unity (HB)"
 COLDWAR_PI_SPR_hb_desc:0 "The abertzale left has united its parties into Popular Unity, the political arm of the KAS alternative. Herri Batasuna boycotts the Cortes, demands amnesty, self determination and the withdrawal of the security forces from Euskadi, and refuses to condemn ETA.\n\nHistorically in §Y1978§!."
 COLDWAR_PI_SPR_hb_revert:0 "Drop the Name HB"
 COLDWAR_PI_SPR_hb_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_TAJ_hdt:0 "Rename to Democratic Party of Tajikistan (HDT)"
 COLDWAR_PI_TAJ_hdt_desc:0 "Shodmon Yusuf and the reform intelligentsia have founded the Democratic Party of Tajikistan. It allies with the Islamists and Rastokhez against the old nomenklatura.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_TAJ_hdt_revert:0 "Drop the Name HDT"
 COLDWAR_PI_TAJ_hdt_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_TAJ_hst:0 "Rename to Socialist Party of Tajikistan (HST)"
 COLDWAR_PI_TAJ_hst_desc:0 "Under pressure from the street the Communist Party of Tajikistan has renamed itself the Socialist Party. Old cadres hope the new name will keep them in power.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_TAJ_hst_revert:0 "Drop the Name HST"
 COLDWAR_PI_TAJ_hst_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_TAJ_hnit:0 "Rename to Islamic Renaissance Party of Tajikistan (HNIT)"
 COLDWAR_PI_TAJ_hnit_desc:0 "Followers of Said Abdullo Nuri have founded the Islamic Renaissance Party. It demands religious freedom and an end to communist atheism.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_TAJ_hnit_revert:0 "Drop the Name HNIT"
 COLDWAR_PI_TAJ_hnit_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_TNZ_ccm:0 "Rename to Party of the Revolution (CCM)"
 COLDWAR_PI_TNZ_ccm_desc:0 "TANU and the Afro Shirazi Party have merged into the Party of the Revolution. It is the sole party of the union.\n\nHistorically in §Y1977§!."
 COLDWAR_PI_TNZ_ccm_revert:0 "Drop the Name CCM"
 COLDWAR_PI_TNZ_ccm_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_TRK_tdp:0 "Rename to Democratic Party of Turkmenistan (TDP)"
 COLDWAR_PI_TRK_tdp_desc:0 "The Communist Party of Turkmenistan has renamed itself the Democratic Party of Turkmenistan under Saparmurat Niyazov. Nothing changes but the name.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_TRK_tdp_revert:0 "Drop the Name TDP"
 COLDWAR_PI_TRK_tdp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_TUN_rcd:0 "Rename to Constitutional Democratic Rally (RCD)"
 COLDWAR_PI_TUN_rcd_desc:0 "After deposing Bourguiba, Zine el Abidine Ben Ali has renamed the Destourian party the Constitutional Democratic Rally. It promises a democratic change.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_TUN_rcd_revert:0 "Drop the Name RCD"
 COLDWAR_PI_TUN_rcd_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_UKR_urp:0 "Rename to Ukrainian Republican Party (URP)"
 COLDWAR_PI_UKR_urp_desc:0 "Levko Lukyanenko and the Helsinki Union veterans have founded the Ukrainian Republican Party, the first party openly to demand independence. It seeks to reclaim the heritage of the Ukrainian People's Republic.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_UKR_urp_revert:0 "Drop the Name URP"
 COLDWAR_PI_UKR_urp_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_UKR_rukh:0 "Rename to People's Movement of Ukraine (Rukh)"
 COLDWAR_PI_UKR_rukh_desc:0 "Writers led by Ivan Drach have founded the People's Movement of Ukraine for Perestroika. Rukh forms the human chain from Kyiv to Lviv and evolves from reform to the demand for independence.\n\nHistorically in §Y1989§!."
 COLDWAR_PI_UKR_rukh_revert:0 "Drop the Name Rukh"
 COLDWAR_PI_UKR_rukh_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_UKR_spu:0 "Rename to Socialist Party of Ukraine (SPU)"
 COLDWAR_PI_UKR_spu_desc:0 "After the communist party was banned following the August putsch, Oleksandr Moroz has gathered its members into the Socialist Party of Ukraine. It defends state property, collective farms and social guarantees.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_UKR_spu_revert:0 "Drop the Name SPU"
 COLDWAR_PI_UKR_spu_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_UZB_birlik:0 "Rename to Birlik People's Movement (Birlik)"
 COLDWAR_PI_UZB_birlik_desc:0 "Intellectuals led by Abdurahim Pulatov have founded the Birlik People's Movement. It protests the cotton monoculture, the dying Aral Sea and the second place of the Uzbek language.\n\nHistorically in §Y1988§!."
 COLDWAR_PI_UZB_birlik_revert:0 "Drop the Name Birlik"
 COLDWAR_PI_UZB_birlik_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_UZB_erk:0 "Rename to Erk Democratic Party (Erk)"
 COLDWAR_PI_UZB_erk_desc:0 "The poet Muhammad Salih has led the moderates out of Birlik to found the Erk Democratic Party. It calls for sovereignty, the Uzbek language and democratic reform.\n\nHistorically in §Y1990§!."
 COLDWAR_PI_UZB_erk_revert:0 "Drop the Name Erk"
 COLDWAR_PI_UZB_erk_revert_desc:0 "The party returns to the name and symbol it carried before."
 COLDWAR_PI_UZB_xdp:0 "Rename to People's Democratic Party of Uzbekistan (XDP)"
 COLDWAR_PI_UZB_xdp_desc:0 "The Communist Party of Uzbekistan has renamed itself the People's Democratic Party with Islam Karimov at its head. It keeps the old apparatus intact under a new banner.\n\nHistorically in §Y1991§!."
 COLDWAR_PI_UZB_xdp_revert:0 "Drop the Name XDP"
 COLDWAR_PI_UZB_xdp_revert_desc:0 "The party returns to the name and symbol it carried before."
