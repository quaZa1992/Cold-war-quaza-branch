 # IMPERIA COLD WAR — Israel 1970: Ein Breira. Written by tools/israel_defence_1970/apply.py.
 COLDWAR_ISR_1970_ein_breira:0 "Ein Breira: No Alternative"
 COLDWAR_ISR_1970_ein_breira_desc:0 "A small country with a citizen army fights on three fronts at once. Reservists leave their jobs within hours, interior lines carry the brigades from the Canal to the Golan overnight, and the air force rules the skies over the front. We cannot afford to lose a single war, because the first lost war would be the last.\n\nLasts while the war with the Arab coalition goes on, at the latest until 5 October 1973."
