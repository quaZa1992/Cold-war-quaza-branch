l_english:
# IMPERIA CW — Cold War: USA 1970 nixon diplomacy — English localisation.
 USA_1970_nixon_send_china_backchannel_offer_tt: "§YChina§! receives a confidential diplomatic proposal. No bilateral benefit is granted unless China accepts."
 USA_1970_nixon_send_salt_channel_offer_tt: "§YThe Soviet Union§! receives a proposal to open a SALT channel. No bilateral benefit is granted unless Moscow accepts."
 USA_1970_nixon_send_beijing_summit_offer_tt: "§YChina§! decides whether to host a presidential summit and negotiate a joint communique. All summit effects depend on acceptance."
 USA_1970_nixon_send_moscow_summit_offer_tt: "§YThe Soviet Union§! decides whether to host a summit on SALT I and an ABM framework. All summit effects depend on acceptance."
 USA_1970_nixon_send_okinawa_reversion_offer_tt: "§YJapan§! decides whether to conclude an Okinawa reversion agreement while negotiating continued alliance consultation. All agreement effects depend on acceptance."
 USA_1970_nixon_send_arvn_assistance_offer_tt: "§YSouth Vietnam§! decides whether to accept the proposed ARVN assistance programme. The United States receives no programme benefit unless Saigon accepts."
 USA_1970_nixon_send_vietnam_settlement_invitations_tt: "§YNorth Vietnam§! and §YSouth Vietnam§! receive separate invitations to settlement talks. Both must accept before talks are convened. These invitations do not create peace, end a war, or reduce Vietnam-era military overextension."

 USA_1970_nixon_dip.1.t: "A Confidential American Opening"
 USA_1970_nixon_dip.1.d: "Washington has proposed a discreet channel outside the glare of formal recognition. Accepting would improve access to American decision-makers and create the basis for a later presidential visit, but it would also expose us to ideological criticism and complicate relations with Moscow."
 USA_1970_nixon_dip.1.a: "Open the channel"
 USA_1970_nixon_dip.1.b: "Reject the overture"

 USA_1970_nixon_dip.2.t: "Washington Proposes a SALT Channel"
 USA_1970_nixon_dip.2.d: "The United States has proposed sustained talks on strategic-arms limitations. The channel could reduce miscalculation and prepare a leadership summit, although both governments would surrender some freedom to expand their arsenals without political cost."
 USA_1970_nixon_dip.2.a: "Begin substantive talks"
 USA_1970_nixon_dip.2.b: "Preserve our freedom of action"

 USA_1970_nixon_dip.3.t: "An American President in Beijing?"
 USA_1970_nixon_dip.3.d: "The secret channel has produced an extraordinary proposal: a presidential visit and negotiations toward a joint communique. Agreement could open trade and alter the triangular balance, while forcing both sides to record their disagreements over Taiwan rather than pretend they do not exist."
 USA_1970_nixon_dip.3.a: "Receive the President and negotiate"
 USA_1970_nixon_dip.3.b: "The political price is too high"

 USA_1970_nixon_dip.4.t: "A Moscow Summit and Strategic Limits"
 USA_1970_nixon_dip.4.d: "Washington is prepared to turn the SALT channel into a summit covering interim limits on strategic launchers and a framework restricting anti-ballistic missile systems. The arrangement would improve predictability, but constrain parts of our military programme and advertise cooperation with a rival."
 USA_1970_nixon_dip.4.a: "Conclude the summit agreements"
 USA_1970_nixon_dip.4.b: "Decline binding limits"

 USA_1970_nixon_dip.5.t: "The Okinawa Reversion Agreement"
 USA_1970_nixon_dip.5.d: "Washington offers the return of administrative control over Okinawa while seeking continued alliance consultation and a negotiated American security presence. Acceptance would strengthen domestic legitimacy and the alliance, but leaves difficult questions about basing and regional strategy."
 USA_1970_nixon_dip.5.a: "Conclude the reversion agreement"
 USA_1970_nixon_dip.5.b: "Reject the proposed terms"

 USA_1970_nixon_dip.6.t: "An American Programme for the ARVN"
 USA_1970_nixon_dip.6.d: "Washington offers equipment, training, and advisory support intended to expand South Vietnam's capacity to carry more of the war. Acceptance would strengthen our immediate position, but deepen reliance on American supply and expose the government to new conditions attached to assistance."
 USA_1970_nixon_dip.6.a: "Accept the conditional assistance"
 USA_1970_nixon_dip.6.b: "Reject the American conditions"

 USA_1970_nixon_dip.7.t: "An Invitation to Vietnam Settlement Talks"
 USA_1970_nixon_dip.7.d: "Washington invites us to send a delegation to talks on ceasefire terms and a political settlement. Attendance commits us to nothing beyond negotiation: the war continues unless the belligerents later agree and act on actual terms."
 USA_1970_nixon_dip.7.a: "Send a delegation"
 USA_1970_nixon_dip.7.b: "Refuse the invitation"

 USA_1970_nixon_dip.8.t: "Washington Proposes Renewed Settlement Talks"
 USA_1970_nixon_dip.8.d: "The United States asks South Vietnam to join a new negotiating round. Participation would preserve our place at the table, but it may also bring pressure for concessions. Accepting this invitation does not itself impose a ceasefire or settlement."
 USA_1970_nixon_dip.8.a: "Authorize our delegation"
 USA_1970_nixon_dip.8.b: "The terms for talks are unacceptable"

 USA_1970_nixon_dip.9.t: "[FROM.GetNameDef] Accepts the Invitation"
 USA_1970_nixon_dip.9.d: "[FROM.GetNameDef] will send a delegation to the proposed Vietnam settlement talks. This is an agreement to negotiate, not a ceasefire, peace treaty, or withdrawal."
 USA_1970_nixon_dip.9.a: "Keep the channel open"

 USA_1970_nixon_dip.10.t: "[FROM.GetNameDef] Refuses the Invitation"
 USA_1970_nixon_dip.10.d: "[FROM.GetNameDef] has rejected the proposed negotiating round. No settlement process can be convened with the present invitations. The military conflict and its full American burden continue."
 USA_1970_nixon_dip.10.a: "The war goes on"

 USA_1970_nixon_dip.11.t: "Both Vietnamese Delegations Agree to Talks"
 USA_1970_nixon_dip.11.d: "North and South Vietnam have both agreed to attend a new negotiating round. Talks can now be convened, but no ceasefire or settlement has been signed. The war and the United States' extraordinary military costs continue until the conflict actually ends."
 USA_1970_nixon_dip.11.a: "Begin negotiations without illusions"
