# IMPERIA COLD WAR — USA and Soviet intelligence dossiers
 icwt_title_1:0 "SALT I"
 icwt_caption_1:0 "Strategic restraint"
 icwt_desc_1:0 "Negotiate a freeze or reduction of nuclear-capable missile reserves, with separately agreed commercial provisions."
 icwt_spirit_1:0 "SALT I Treaty"
 icwt_spirit_1_desc:0 "Our government participates in this agreement.\n\nCovered missiles: [icwt_policy_1_scope]\nMissile reduction: [icwt_policy_1_reduction]\nReserve ceiling: [icwt_policy_1_reserve_limit]\nCore sanctions relief: [icwt_policy_1_sanctions]\nTrade protocol: [icwt_policy_1_trade]\nInvestment protocol: [icwt_policy_1_investment]\nTerm: [icwt_policy_1_duration]\nCore military withdrawal: [icwt_policy_1_regional]\nJoint programme: [icwt_policy_1_programme]\n\nParticipation may be ended through the treaty register. Completed concessions are not reversed."
 icwt_title_2:0 "ABM Treaty"
 icwt_caption_2:0 "Defence talks"
 icwt_desc_2:0 "Establish a standing strategic-defence consultation accord. Any additional material obligations are specified in its protocols."
 icwt_spirit_2:0 "ABM Treaty"
 icwt_spirit_2_desc:0 "Our government participates in this agreement.\n\nCovered missiles: [icwt_policy_2_scope]\nMissile reduction: [icwt_policy_2_reduction]\nReserve ceiling: [icwt_policy_2_reserve_limit]\nCore sanctions relief: [icwt_policy_2_sanctions]\nTrade protocol: [icwt_policy_2_trade]\nInvestment protocol: [icwt_policy_2_investment]\nTerm: [icwt_policy_2_duration]\nCore military withdrawal: [icwt_policy_2_regional]\nJoint programme: [icwt_policy_2_programme]\n\nParticipation may be ended through the treaty register. Completed concessions are not reversed."
 icwt_title_3:0 "SALT II"
 icwt_caption_3:0 "Strategic restraint"
 icwt_desc_3:0 "Negotiate strategic restraint and an agreed reduction of the selected missile stockpiles."
 icwt_spirit_3:0 "SALT II Treaty"
 icwt_spirit_3_desc:0 "Our government participates in this agreement.\n\nCovered missiles: [icwt_policy_3_scope]\nMissile reduction: [icwt_policy_3_reduction]\nReserve ceiling: [icwt_policy_3_reserve_limit]\nCore sanctions relief: [icwt_policy_3_sanctions]\nTrade protocol: [icwt_policy_3_trade]\nInvestment protocol: [icwt_policy_3_investment]\nTerm: [icwt_policy_3_duration]\nCore military withdrawal: [icwt_policy_3_regional]\nJoint programme: [icwt_policy_3_programme]\n\nParticipation may be ended through the treaty register. Completed concessions are not reversed."
 icwt_title_4:0 "INF Treaty"
 icwt_caption_4:0 "Missile elimination"
 icwt_desc_4:0 "Negotiate the elimination or reduction of explicitly selected stored missile types. Deployed systems and unlisted types remain separate obligations."
 icwt_spirit_4:0 "INF Treaty"
 icwt_spirit_4_desc:0 "Our government participates in this agreement.\n\nCovered missiles: [icwt_policy_4_scope]\nMissile reduction: [icwt_policy_4_reduction]\nReserve ceiling: [icwt_policy_4_reserve_limit]\nCore sanctions relief: [icwt_policy_4_sanctions]\nTrade protocol: [icwt_policy_4_trade]\nInvestment protocol: [icwt_policy_4_investment]\nTerm: [icwt_policy_4_duration]\nCore military withdrawal: [icwt_policy_4_regional]\nJoint programme: [icwt_policy_4_programme]\n\nParticipation may be ended through the treaty register. Completed concessions are not reversed."
 icwt_title_5:0 "START I"
 icwt_caption_5:0 "Strategic reductions"
 icwt_desc_5:0 "Reduce the selected nuclear-capable missile reserves and agree a continuing ceiling on the remaining stocks."
 icwt_spirit_5:0 "START I Treaty"
 icwt_spirit_5_desc:0 "Our government participates in this agreement.\n\nCovered missiles: [icwt_policy_5_scope]\nMissile reduction: [icwt_policy_5_reduction]\nReserve ceiling: [icwt_policy_5_reserve_limit]\nCore sanctions relief: [icwt_policy_5_sanctions]\nTrade protocol: [icwt_policy_5_trade]\nInvestment protocol: [icwt_policy_5_investment]\nTerm: [icwt_policy_5_duration]\nCore military withdrawal: [icwt_policy_5_regional]\nJoint programme: [icwt_policy_5_programme]\n\nParticipation may be ended through the treaty register. Completed concessions are not reversed."
 icwt_title_6:0 "Reykjavik Framework"
 icwt_caption_6:0 "Deep reductions"
 icwt_desc_6:0 "Negotiate deep missile-reserve reductions and continuing ceilings, alongside explicit reciprocal concessions."
 icwt_spirit_6:0 "Reykjavik Framework Treaty"
 icwt_spirit_6_desc:0 "Our government participates in this agreement.\n\nCovered missiles: [icwt_policy_6_scope]\nMissile reduction: [icwt_policy_6_reduction]\nReserve ceiling: [icwt_policy_6_reserve_limit]\nCore sanctions relief: [icwt_policy_6_sanctions]\nTrade protocol: [icwt_policy_6_trade]\nInvestment protocol: [icwt_policy_6_investment]\nTerm: [icwt_policy_6_duration]\nCore military withdrawal: [icwt_policy_6_regional]\nJoint programme: [icwt_policy_6_programme]\n\nParticipation may be ended through the treaty register. Completed concessions are not reversed."
