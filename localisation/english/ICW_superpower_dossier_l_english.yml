 icwt_brief_1:0 "[?icsd_selected_actor.GetName] maintains an active lend-lease connection with [?icsd_selected_target.GetName]. The relationship is confirmed; the record does not establish delivered quantities or successful arrivals."
 icwt_brief_2:0 "[?icsd_selected_actor.GetName] has committed volunteer forces to [?icsd_selected_target.GetName]. These are deployed forces, rather than a diplomatic promise of future assistance."
 icwt_brief_3:0 "[?icsd_selected_actor.GetName] maintains a military attache in [?icsd_selected_target.GetName]. The mission establishes a direct military liaison with that government."
 icwt_brief_4:0 "[?icsd_selected_actor.GetName] is imposing sanctions on [?icsd_selected_target.GetName]. These measures are a concrete instrument of pressure and may be addressed in negotiations."
 icwt_brief_5:0 "[?icsd_selected_actor.GetName] and [?icsd_selected_target.GetName] maintain an improved trade agreement. The commercial relationship provides a continuing diplomatic stake."
 icwt_brief_6:0 "The file records a trade proposal or response involving [?icsd_selected_actor.GetName] and [?icsd_selected_target.GetName]. Its recorded status is [icsd_selected_state_L]."
 icwt_brief_7:0 "The file records a financial proposal or response involving [?icsd_selected_actor.GetName] and [?icsd_selected_target.GetName]. A proposal is distinct from a completed transfer."
 icwt_brief_8:0 "[?icsd_selected_actor.GetName] has committed to an active construction investment in [?icsd_selected_target.GetName]. Detailed project information depends on the access described in this file."
 icwt_brief_9:0 "[?icsd_selected_actor.GetName] maintains a [icsd_programme] in [?icsd_selected_target.GetName]. This is an existing government assistance commitment."
 icwt_brief_10:0 "[?icsd_selected_actor.GetName] is openly backing [icsd_party] in [?icsd_selected_target.GetName]. The record identifies a public political campaign, rather than an inference from election results."
 icwt_brief_11:0 "Financial and political reporting has corroborated a completed influence action by [?icsd_selected_actor.GetName] in [?icsd_selected_target.GetName]."
 icwt_brief_12:0 "A completed economic aid payment from [?icsd_selected_actor.GetName] to [?icsd_selected_target.GetName] has been corroborated."
 icwt_brief_13:0 "[?icsd_selected_actor.GetName] is providing weekly financial subsidies to [?icsd_selected_target.GetName]. The programme commits real recurring treasury funding."
 icwt_assessment_military:0 "The commitment gives the supporting government a stake in this country. We can reinforce a competing position, apply pressure or negotiate the withdrawal of our own and their contributions."
 icwt_assessment_economic:0 "The relationship gives the provider a continuing economic or political stake. A competing offer requires our own resources and the recipient government's consent."
 icwt_assessment_opponent:0 "Our commitments also involve [?icsd_context_opponent.GetName], an opponent of the reported recipient. Both powers therefore have a concrete stake in the same conflict."
 icwt_workflow_help:0 "§YTreaty maker§!\n1. Choose a historical or suggested proposal, or open Custom agreement.\n2. Click a setting to cycle its values. Select mission recipients and optional signatories on the Participants page.\n3. Review complete terms and Prospective effects, then submit the paper.\n4. The other core government reviews that exact paper and signs, declines or proposes revised terms.\n5. Only acceptance applies the actual missile reductions, fees and spirits.\n\nReserve ceilings are inspected weekly. Exceeding a ceiling pauses the associated continuing benefits. Restore the ceiling through its decision or negotiate a different agreement. Completed destruction and payments are not refunded by withdrawal. Programme-only addenda leave the original material commitments unchanged."
 icwt_help_usa_target:0 "§YAmerican mission recipient§!\n\nClick, then select the country from which the United States will recall its own selected military missions. This is the recipient of American attaches or volunteers, not the Soviet recipient. The final paper names both targets and previews the actual recall costs. Another country's war is not ended."
 icwt_help_sov_target:0 "§YSoviet mission recipient§!\n\nClick, then select the country from which the Soviet Union will recall its own selected military missions. This is the recipient of Soviet attaches or volunteers, not the American recipient. Each core government is responsible for its own commitments."
 icwt_help_invites:0 "§YAdditional signatories§!\n\nUp to six additional governments may be invited alongside the two core parties. Each reviews and decides for itself. An unanswered invitation does not delay the American-Soviet signature. Acceptance before conclusion waits for the core agreement; acceptance afterwards is accession. Each government contributes only its own approved obligations. The bilateral joint programme is reserved to the two core governments."
 icwt_help_pending:0 "§YPending negotiating paper§!\n\nOnly one core paper awaits signature at a time. Open it to review its actual current terms. The author cannot provide the other government's signature. Revised terms invalidate the previous review. Preparing a different draft never overwrites a pending proposal or changes a standing agreement."
 icwt_help_signature:0 "§YSignature and revised terms§!\n\nThe other core government must review this exact paper before signing. Check Prospective effects for both governments' missile quantities, fees and benefits. A revised paper needs a fresh review. Older unsigned papers based on the superseded production clause need revised missile terms before signature. Select a real reserve reduction or ceiling, then send the revised paper for the other government's approval. Programme-only addenda preserve the original material terms."
 icwt_history_1:0 "§YSALT I, 1972§!\n\nThe Interim Agreement froze strategic missile launchers for five years. This proposal adapts that principle to stored nuclear-capable ICBMs: no initial destruction, a ceiling at each signatory's agreed reserve total, and a five-year term. Launchers, deployed formations and warhead counts are outside this reserve agreement.\n\nOpening a proposal does not send or sign it. All shown terms remain negotiable before submission."
 icwt_history_2:0 "§YABM Treaty, 1972§!\n\nThe historical treaty limited strategic anti-ballistic-missile deployment sites. Ordinary air-defence missiles are not equivalent to those installations. This proposal opens strategic-defence consultations without destroying missiles or claiming a site limit. Add only the actual reserve, economic or regional commitments both governments wish to negotiate.\n\nOpening a proposal does not send or sign it. All shown terms remain negotiable before submission."
 icwt_history_3:0 "§YSALT II, 1979§!\n\nThe historical agreement addressed strategic delivery-vehicle ceilings and was signed but not ratified. This proposal offers a five-year freeze of stored nuclear ICBM reserves, without immediate destruction. That is a reserve-based adaptation, not the historical launcher and bomber totals. Both players may ratify their own agreed paper.\n\nOpening a proposal does not send or sign it. All shown terms remain negotiable before submission."
 icwt_history_4:0 "§YINF Treaty, 1987§!\n\nThe historical treaty eliminated ground-launched ballistic and cruise missiles with ranges from 500 to 5,500 km, including nuclear and conventional systems. This proposal selects the loaded missile models in that range, retires 100% of their stored reserves on signature, and keeps a zero reserve ceiling until withdrawal. Deployed systems and launchers are outside the reserve count.\n\nOpening a proposal does not send or sign it. All shown terms remain negotiable before submission."
 icwt_history_5:0 "§YSTART I, 1991§!\n\nThe historical treaty limited deployed strategic delivery vehicles and attributed warheads. This proposal uses a 25% reduction of stored nuclear ICBMs and a continuing ceiling on the remaining reserves, with a 15-year term. The percentage is a gameplay adaptation, not the historical 1,600 delivery-vehicle or 6,000 warhead ceiling. Review the actual missile quantities before sending.\n\nOpening a proposal does not send or sign it. All shown terms remain negotiable before submission."
 icwt_history_6:0 "§YReykjavik proposals, 1986§!\n\nThe summit explored deep strategic reductions but did not conclude this framework. This proposal adapts the 50% reduction discussed there to stored nuclear ICBMs, with a ceiling on the remaining reserves. Concluding it is an alternative historical choice requiring both governments' signatures.\n\nOpening a proposal does not send or sign it. All shown terms remain negotiable before submission."
 icwt_history_7:0 "§YNuclear risk reduction§!\n\nA standing consultation channel. It destroys no missiles by default. You may negotiate additional missile, commercial, investment or regional terms before sending the paper.\n\nOpening a proposal does not send or sign it. All shown terms remain negotiable before submission."
 icwt_history_8:0 "§YCommercial cooperation§!\n\nSuggested opening terms improve bilateral trade opinion by 100 and relations by 25. This is access and diplomatic cooperation, not guaranteed resource deliveries or cash. Sanctions relief and other concessions remain separate choices.\n\nOpening a proposal does not send or sign it. All shown terms remain negotiable before submission."
 icwt_history_9:0 "§YInvestment cooperation§!\n\nSuggested opening terms reduce normal bilateral investment cost and construction duration by 5%. Projects still follow their ordinary approval and construction requirements. The scientific programme is an additional explicitly funded clause when its American initiative has been completed.\n\nOpening a proposal does not send or sign it. All shown terms remain negotiable before submission."
 icwt_history_10:0 "§YRegional stand-down§!\n\nEach government names the recipient of its own military missions. The suggested paper recalls both attaches and volunteers. A deployed volunteer recall costs its sending government 50 Political Power and 15 Command Power and needs the normal recall permission. Local governments continue their own wars.\n\nOpening a proposal does not send or sign it. All shown terms remain negotiable before submission."
 icwt_history_11:0 "§YSanctions and restraint§!\n\nSuggested opening terms lift the four named Imperia sanction classes between Washington and Moscow. Each existing class actually lifted costs its imposing government 35 Political Power. Ordinary embargoes remain separate. Review both governments' real concessions before sending.\n\nOpening a proposal does not send or sign it. All shown terms remain negotiable before submission."
 icwt_history_12:0 "§YYour own agreement§!\n\nStart with an empty negotiating paper. Choose the covered missile families, reduction, reserve ceiling, sanctions, trade, investment, term, missions and optional participants. No missiles, money or spirits change when the draft opens. The other government must review and sign the complete proposal.\n\nOpening a proposal does not send or sign it. All shown terms remain negotiable before submission."
