 icwt_spirit_8_desc:0 "Our government participates in this agreement.\n\nCovered missiles: [icwt_policy_8_scope]\nMissile reduction: [icwt_policy_8_reduction]\nReserve ceiling: [icwt_policy_8_reserve_limit]\nCore sanctions relief: [icwt_policy_8_sanctions]\nTrade protocol: [icwt_policy_8_trade]\nInvestment protocol: [icwt_policy_8_investment]\nTerm: [icwt_policy_8_duration]\nCore military withdrawal: [icwt_policy_8_regional]\nJoint programme: [icwt_policy_8_programme]\n\nParticipation may be ended through the treaty register. Completed concessions are not reversed."
