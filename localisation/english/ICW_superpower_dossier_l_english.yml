 icsd_sources_tt:0 "Own and received records are fully available. Public commitments identify their partners. Financial details require 60% civilian intelligence on the provider or 50% network strength in the recipient. Agency economic upgrades improve civilian intelligence. Networks must be established through existing operative missions.\n\nCurrent commitments are reviewed weekly. Foreign payments and political interference are recorded only when sufficient intelligence exists at the time. Later intelligence does not reveal earlier undiscovered payments. Previously discovered correspondence remains in the file. No records does not establish that no activity occurred."
