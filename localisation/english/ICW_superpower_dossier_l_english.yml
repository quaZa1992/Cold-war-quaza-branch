 icwt_programme_1_usa:0 "American-Soviet Scientific Cooperation"
 icwt_programme_1_usa_desc:0 "American and Soviet research institutions maintain civilian exchanges and joint scientific work. The delegations fund these commitments through their investment agreement.\n\nWeekly programme balance: §R-0.00002%§! of current GDP per week (§R-$[?icwt_weekly_programme_1|5] billion/week§!).\n\nBenefits and funding require continuing joint participation, the agreed protocol, peace and normal bilateral economic relations."
 icwt_programme_1_sov:0 "American-Soviet Scientific Cooperation"
 icwt_programme_1_sov_desc:0 "American and Soviet research institutions maintain civilian exchanges and joint scientific work. The delegations fund these commitments through their investment agreement.\n\nWeekly programme balance: §R-0.00002%§! of current GDP per week (§R-$[?icwt_weekly_programme_1|5] billion/week§!).\n\nBenefits and funding require continuing joint participation, the agreed protocol, peace and normal bilateral economic relations."
 icwt_programme_2_usa:0 "Soviet Export Programme"
 icwt_programme_2_usa_desc:0 "American exporters and Soviet purchasing agencies maintain a civilian supply programme under their commercial accord. The arrangement sustains economic access while each government funds its own commitments.\n\nWeekly programme balance: §R-0.00002%§! of current GDP per week (§R-$[?icwt_weekly_programme_2|5] billion/week§!).\n\nBenefits and funding require continuing joint participation, the agreed protocol, peace and normal bilateral economic relations."
 icwt_programme_2_sov:0 "American Civilian Supply Agreement"
 icwt_programme_2_sov_desc:0 "American exporters and Soviet purchasing agencies maintain a civilian supply programme under their commercial accord. The arrangement sustains economic access while each government funds its own commitments.\n\nWeekly programme balance: §R-0.00002%§! of current GDP per week (§R-$[?icwt_weekly_programme_2|5] billion/week§!).\n\nBenefits and funding require continuing joint participation, the agreed protocol, peace and normal bilateral economic relations."
 icwt_programme_3_usa:0 "Strategic Consultations Programme"
 icwt_programme_3_usa_desc:0 "The American and Soviet delegations maintain strategic consultations alongside the agreed production restraint. Diplomatic cooperation supports domestic confidence while verification and administration require continuing resources.\n\nWeekly programme balance: §R-0.00002%§! of current GDP per week (§R-$[?icwt_weekly_programme_3|5] billion/week§!).\n\nBenefits and funding require continuing joint participation, the agreed protocol, peace and normal bilateral economic relations."
 icwt_programme_3_sov:0 "Strategic Consultations Programme"
 icwt_programme_3_sov_desc:0 "The American and Soviet delegations maintain strategic consultations alongside the agreed production restraint. Diplomatic cooperation supports domestic confidence while verification and administration require continuing resources.\n\nWeekly programme balance: §R-0.00002%§! of current GDP per week (§R-$[?icwt_weekly_programme_3|5] billion/week§!).\n\nBenefits and funding require continuing joint participation, the agreed protocol, peace and normal bilateral economic relations."
 icwt_programme_4_usa:0 "Negotiated Regional Understanding"
 icwt_programme_4_usa_desc:0 "Washington supports civilian economic cooperation in return for the accepted withdrawal of the two governments' own military missions from their named recipients. Local governments retain responsibility for their own conflicts.\n\nPer active regional agreement: §R-0.00005%§! of current GDP per week (§R-$[?icwt_weekly_programme_4|5] billion/week§!).\n\nBenefits and funding require continuing joint participation, the agreed protocol, peace and normal bilateral economic relations. Cooperation and funding pause if either government returns a covered military mission to its named recipient. They resume after its withdrawal."
 icwt_programme_4_sov:0 "American Economic Cooperation Programme"
 icwt_programme_4_sov_desc:0 "Washington supports civilian economic cooperation in return for the accepted withdrawal of the two governments' own military missions from their named recipients. Local governments retain responsibility for their own conflicts.\n\nWeekly programme balance: §G+0.00005%§! of US GDP per week (§G+$[?icwt_weekly_programme_4|5] billion/week§!).\n\nBenefits and funding require continuing joint participation, the agreed protocol, peace and normal bilateral economic relations. Cooperation and funding pause if either government returns a covered military mission to its named recipient. They resume after its withdrawal."
