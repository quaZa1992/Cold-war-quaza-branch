 icwt_desc_9:0 "Reduce the cost and construction time of investments between consenting signatories."
 icwt_spirit_9:0 "Investment Cooperation Treaty"
 icwt_spirit_9_desc:0 "Our government participates in this agreement.\n\nCovered missiles: [icwt_policy_9_scope]\nMissile reduction: [icwt_policy_9_reduction]\nReserve ceiling: [icwt_policy_9_reserve_limit]\nCore sanctions relief: [icwt_policy_9_sanctions]\nTrade protocol: [icwt_policy_9_trade]\nInvestment protocol: [icwt_policy_9_investment]\nTerm: [icwt_policy_9_duration]\nCore military withdrawal: [icwt_policy_9_regional]\nJoint programme: [icwt_policy_9_programme]\n\nParticipation may be ended through the treaty register. Completed concessions are not reversed."
