 icwt_help_scope:0 "§YCovered missiles§!\n§YSelected:§! [icwt_value_scope]\n\nClick to cycle: none, nuclear ICBMs, ballistic missiles, cruise missiles, all listed reserves, all nuclear-capable reserves, or INF-range reserves. Nuclear-capable means the loaded ICBM and nuclear ballistic equipment families. The ordinary ballistic and cruise families are conventional. Only stored equipment is counted; deployed formations, launchers and separate warheads are excluded."
 icwt_help_reduction:0 "§YMissile reduction§!\n§YSelected:§! [icwt_value_reduction]\n\nClick to cycle 0%, 10%, 25%, 50% or 100%. The selected share of each covered reserve model is dismantled once, rounded to whole missiles. Exact American and Soviet quantities are fixed when the proposal is sent; an additional signatory fixes its own quantities on review. A revised proposal needs a new review. 0% means no immediate destruction and may still accompany a reserve freeze."
 icwt_help_reserve_limit:0 "§YReserve ceiling§!\n§YSelected:§! [icwt_value_reserve_limit]\n\nNo continuing ceiling leaves only the one-time reduction. Cap post-reduction reserves freezes the total covered reserves at their agreed remaining quantity. You may replace models within that total. Weekly inspections pause linked programme benefits, trade and investment privileges, joint tension relief and the selected sanctions protection if the ceiling is exceeded. Excess equipment is not destroyed automatically. Use Restore the missile ceiling in Decisions to dismantle only the excess; it does not charge another setup fee."
 icwt_help_sanctions:0 "§YCore sanctions relief§!\n§YSelected:§! [icwt_value_sanctions]\n\nChoose none, one named diplomatic, financial, economic or military class, or all four. Only actual existing sanctions between the USA and Soviet Union are lifted. Each lifted class costs its imposing government 35 Political Power. Both mirrors are removed. Reimposition of the selected classes is blocked while the two governments jointly observe the agreement. A broken missile ceiling suspends that protection at the next inspection. Native embargoes are a separate diplomatic action."
 icwt_help_trade:0 "§YTrade protocol§!\n§YSelected:§! [icwt_value_trade]\n\nChoose none, trade opinion +50 and relations +10, or trade opinion +100 and relations +25. The rate applies between actual participating governments at peace and observing the agreement. It improves commercial relations; it does not create resource shipments, treasury income or free factories. Overlapping commercial agreements use the strongest applicable benefit rather than stacking copies."
 icwt_help_investment:0 "§YInvestment protocol§!\n§YSelected:§! [icwt_value_investment]\n\nChoose none, cost and duration -5%, or cost and duration -10%. These are bilateral discounts on ordinary native investment projects between participating governments observing the agreement. Projects still need their usual approval and construction requirements. Existing applicable discounts are respected. This is not a global construction-speed bonus or an automatic building grant."
 icwt_help_duration:0 "§YAgreement term§!\n§YSelected:§! [icwt_value_duration]\n\nChoose until withdrawal, or 180, 365, 730, 1,825 or 5,475 days from signature. Each participant may withdraw earlier. Expiry or departure ends the relevant ongoing benefits and payments; completed missile destruction and fees remain completed. An addendum changes the joint programme only and retains the original treaty end date."
 icwt_help_regional:0 "§YMilitary missions§!\n§YSelected:§! [icwt_value_regional]\n\nChoose none, recall own attaches, recall own volunteers, or both. On Participants, each core government selects its own mission recipient. A deployed volunteer recall requires the normal game rule, 50 Political Power and 15 Command Power. The local government keeps control of its war. A funded regional programme also requires the selected missions to remain absent; sending them back pauses that programme."
 icwt_help_programme:0 "§YJoint programme§!\n§YSelected:§! [icwt_value_programme]\n\nOptional bilateral scientific, civilian supply, strategic consultation or regional cooperation programmes are unlocked by Bilateral Cooperation, Grain and Credit, Arms-Control Talks and Linkage and Restraint respectively. They attach to the corresponding investment, commercial, SALT I or regional instrument, not the blank custom instrument. Both governments approve their complete spirit modifiers and GDP-based funding in Prospective effects. Optional third countries do not receive this bilateral programme. War, embargoes, sanctions, ended joint participation or broken agreed missile ceilings pause its benefits and weekly funding without repeating setup charges on restoration."
