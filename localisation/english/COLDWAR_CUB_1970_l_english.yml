l_english:
# IMPERIA COLD WAR — Cuba 1970 national programme.
 COLDWAR_CUB_GEN_air_force_reform:0 "Air Force Reform"
 COLDWAR_CUB_GEN_air_force_reform_desc:0 "Under the principle that a nation controlling its skies is a nation controlling its lands, we must pursue modernization in all doctrines regarding the air."
 COLDWAR_CUB_GEN_aircraft_carriers:0 "Aircraft Carriers"
 COLDWAR_CUB_GEN_aircraft_carriers_desc:0 "An aircraft carrier is a warship that serves as a seagoing airbase, equipped with a full-length flight deck and facilities for carrying, arming, deploying, and recovering aircraft."
 COLDWAR_CUB_GEN_combined_military_defense_industries:0 "Combined Defense Industries"
 COLDWAR_CUB_GEN_combined_military_defense_industries_desc:0 "Through our excellent work and effort, we are now able to more efficiently run our defense industries."
 COLDWAR_CUB_GEN_composite_industrial_expansion:0 "Composite Industrial Expansion"
 COLDWAR_CUB_GEN_composite_industrial_expansion_desc:0 "Expanding our composite materials industry will provide advanced materials for aerospace, naval, and armored vehicle production."
 COLDWAR_CUB_GEN_convoy_and_freighter_production:0 "Convoy and Freighter Production"
 COLDWAR_CUB_GEN_convoy_and_freighter_production_desc:0 "Expanding production of merchant vessels and convoy escorts will secure our maritime trade routes and protect vital supply lines in wartime."
 COLDWAR_CUB_GEN_dockyards:0 "Dockyards"
 COLDWAR_CUB_GEN_dockyards_desc:0 "Building more harbors and stimulating the naval industry is needed for us to thrive in commerce and combat!"
 COLDWAR_CUB_GEN_establish_a_marine_corps:0 "Establish a Marine Corps"
 COLDWAR_CUB_GEN_establish_a_marine_corps_desc:0 "Creating a dedicated marine force specialized in amphibious operations will give us the capability to project power from the sea and conduct complex landing operations."
 COLDWAR_CUB_GEN_fighter_planes:0 "Fighter Planes"
 COLDWAR_CUB_GEN_fighter_planes_desc:0 "Fighter or pursuit aircraft are designed with air-to-air engagement in mind. They are the primary way for our air force to obtain aerial superiority over any battle space."
 COLDWAR_CUB_GEN_heavy_industry_investments:0 "Heavy Industry Investments"
 COLDWAR_CUB_GEN_heavy_industry_investments_desc:0 "Injecting capital into the military-industrial complex will make equipment yields higher, making sure all of our troops are well-equipped for battle."
 COLDWAR_CUB_GEN_improved_repair_facilities:0 "Improved Repair Facilities"
 COLDWAR_CUB_GEN_improved_repair_facilities_desc:0 "Modernizing our naval repair facilities will reduce maintenance downtime and keep our fleet operational and combat-ready at all times."
 COLDWAR_CUB_GEN_large_ship_drydocks:0 "Large Ship Drydocks"
 COLDWAR_CUB_GEN_large_ship_drydocks_desc:0 "Constructing specialized drydocks capable of building and maintaining large warships, including carriers and amphibious assault ships, will enhance our naval shipbuilding capabilities."
 COLDWAR_CUB_GEN_light_helicopter_operators:0 "Light Helicopter Carrier"
 COLDWAR_CUB_GEN_light_helicopter_operators_desc:0 "A helicopter carrier is an aircraft carrier that is mainly used to carry helicopters, but it is also often classified as an amphibious assault ship or an anti-submarine aircraft carrier. It is mainly used for military aviation missions including anti-submarine warfare, amphibious operations, and close air support."
 COLDWAR_CUB_GEN_light_industry_investments:0 "Light Industry Investments"
 COLDWAR_CUB_GEN_light_industry_investments_desc:0 "Injecting capital into civilian industries as well as the oil complex can help our economy come forward in the toughest of times."
 COLDWAR_CUB_GEN_military_industry_investment_projects:0 "Military Industry Investment Projects"
 COLDWAR_CUB_GEN_military_industry_investment_projects_desc:0 "Major investment projects in our defense industry will expand our capacity to produce military equipment and strengthen our industrial base."
 COLDWAR_CUB_GEN_naval_bases:0 "Naval Bases"
 COLDWAR_CUB_GEN_naval_bases_desc:0 "The construction of docks and harbors all over the coasts will not only benefit the industry, but our navy, too."
 COLDWAR_CUB_GEN_naval_doctrine_expertise:0 "Naval Doctrine Expertise"
 COLDWAR_CUB_GEN_naval_doctrine_expertise_desc:0 "Integrating every element of modern naval doctrine into a combined set of tactics will make even the greatest maritime powers tremble with our prowess."
 COLDWAR_CUB_GEN_naval_doctrine_innovations:0 "Naval Doctrine Innovations"
 COLDWAR_CUB_GEN_naval_doctrine_innovations_desc:0 "We may study standard factional doctrine of some of the most powerful military world orders to become more effective in maritime combat ourselves."
 COLDWAR_CUB_GEN_naval_reform:0 "Naval Reform"
 COLDWAR_CUB_GEN_naval_reform_desc:0 "It's about time we get rid of our outdated naval practices and begin taking the water forces more seriously."
 COLDWAR_CUB_GEN_nuclear_submarines:0 "Nuclear Submarines"
 COLDWAR_CUB_GEN_nuclear_submarines_desc:0 "A nuclear submarine is any type of submarine powered by a nuclear reactor. They are more powerful, faster, and rarely need to refuel."
 COLDWAR_CUB_GEN_refitting_the_military_industry:0 "Refitting the Military Industry"
 COLDWAR_CUB_GEN_refitting_the_military_industry_desc:0 "We can open new factories in order to make sure our equipment production doesn't fall back."
 COLDWAR_CUB_GEN_stealth_ships:0 "Stealth Ships"
 COLDWAR_CUB_GEN_stealth_ships_desc:0 "Developing stealth naval technology will reduce our ships' radar signatures and provide a critical tactical advantage in modern naval warfare."
 COLDWAR_CUB_GEN_submarine_expansion_project:0 "Submarine Expansion Project"
 COLDWAR_CUB_GEN_submarine_expansion_project_desc:0 "Expanding our submarine fleet with modern vessels will strengthen our undersea warfare capabilities and provide a powerful deterrent to potential adversaries."
 COLDWAR_CUB_GEN_submarines:0 "Submarines"
 COLDWAR_CUB_GEN_submarines_desc:0 "We may begin looking into submarine technology, to prevent any invaders from getting uncomfortably close to our above-water ships."
 COLDWAR_CUB_GEN_surface_ships:0 "Surface Ships"
 COLDWAR_CUB_GEN_surface_ships_desc:0 "The brute force behind any maritime operation, investigating the most effective and modern surface ships will directly lead us toward naval supremacy."
 COLDWAR_CUB_GEN_vessel_production:0 "Ship Construction"
 COLDWAR_CUB_GEN_vessel_production_desc:0 "It might be possible to generate an uptick in naval production rates by optimizing dockyard paperwork and promoting naval culture in coastal states."
 COLDWAR_CUB_GEN_weapon_conversion_packages:0 "Weapon Conversion Packages"
 COLDWAR_CUB_GEN_weapon_conversion_packages_desc:0 "Developing modular weapon conversion packages will allow us to quickly upgrade and adapt our existing military systems to new threats and technologies."
 COLDWAR_CUB_accountable_officers:0 "Officer Standards"
 COLDWAR_CUB_accountable_officers_desc:0 "Procurement and promotion need standards that bind commanders as well as civilians. Audits reduce corruption and improve confidence, while a professional establishment carries a higher personnel bill than informal revolutionary service."
 COLDWAR_CUB_after_harvest_tt:0 "After the harvest:"
 COLDWAR_CUB_air_defence:0 "Soviet Air Defence"
 COLDWAR_CUB_air_defence_desc:0 "Soviet equipment can strengthen Cuban air surveillance when both governments agree on assistance. The proposal concerns training and a limited radar installation, not the return of strategic nuclear weapons to the island."
 COLDWAR_CUB_alpha_programme:0 "Alpha 66 · National Liberation"
 COLDWAR_CUB_alpha_programme_desc:0 "Civic demobilisation or an armed nationalist settlement; distinct from RECE and Batista."
 COLDWAR_CUB_american_embargo:0 "The American Embargo"
 COLDWAR_CUB_american_embargo_desc:0 "Restricted access to the American market and trade finance narrows Cuba's commercial options. The economic burden belongs to the continuing dispute and ends only through a real settlement or a change in the legal sanctions regime."
 COLDWAR_CUB_american_embargo_limited:0 "Restricted Access to American Trade"
 COLDWAR_CUB_american_embargo_limited_desc:0 "A limited agreement has eased the blockade, but substantial restrictions on commerce remain."
 COLDWAR_CUB_armed_sovereignty:0 "Armed Sovereignty"
 COLDWAR_CUB_armed_sovereignty_desc:0 "A fortified sovereign republic can resist pressure from old patrons as well as new enemies. Its defensive strength and resilience come with a larger supervisory state and less room for independent research."
 COLDWAR_CUB_autentico_programme:0 "Auténtico · Social Republic"
 COLDWAR_CUB_autentico_programme_desc:0 "Labour guarantees or a negotiated investment settlement under the republican tradition."
 COLDWAR_CUB_authentic_republic:0 "The Social Republic"
 COLDWAR_CUB_authentic_republic_desc:0 "The Auténtico tradition can reclaim the republic without abandoning social insurance and national sovereignty. A negotiated return broadens confidence and inward migration, but rebuilding civilian institutions requires an administrative settlement."
 COLDWAR_CUB_authentic_settlement:0 "An Authentic Pact"
 COLDWAR_CUB_authentic_settlement_desc:0 "The settlement should bind labour leaders, public officials and enterprise managers to transparent rules. Reducing corruption and sustaining education give the restored republic substance beyond an anti-Castro coalition."
 COLDWAR_CUB_balanced_targets:0 "Balanced Targets"
 COLDWAR_CUB_balanced_targets_desc:0 "Investment plans can protect maintenance, food production and consumer goods alongside export targets. Agricultural and civilian output improve together, while slower capital concentration limits construction speed."
 COLDWAR_CUB_barracks_workshops:0 "Barracks and Works"
 COLDWAR_CUB_barracks_workshops_desc:0 "Military engineering and procurement organisations can be used to deliver civilian projects. Their discipline accelerates construction and production, but a larger permanent military establishment draws labour away from other work."
 COLDWAR_CUB_biological_front:0 "The Biological Front"
 COLDWAR_CUB_biological_front_desc:0 "Interferon research has shown what a small, coordinated scientific team can attempt. A Biological Front linking the CIB and the new CIGB will connect laboratory research with industrial production in Havana. Genetic research needs protected funding and imported equipment, even when ordinary services compete for the same resources."
 COLDWAR_CUB_biological_front_research:0 "The Biological Front"
 COLDWAR_CUB_cadre_schools:0 "Cadre Schools"
 COLDWAR_CUB_cadre_schools_desc:0 "The plan needs administrators able to read technical reports and manage institutions. Specialised schools strengthen research capacity, while adding to the education establishment that the state must maintain."
 COLDWAR_CUB_charter_review_desc:0 "The temporary charter has run its course. The institutions established during the transition now answer to the ordinary political process, while the economic and diplomatic commitments already enacted remain national obligations."
 COLDWAR_CUB_charter_review_option:0 "Let the national institutions carry the settlement forward."
 COLDWAR_CUB_charter_review_title:0 "The Civilian Settlement"
 COLDWAR_CUB_christian_programme:0 "Christian Democratic Movement"
 COLDWAR_CUB_christian_programme_desc:0 "Subsidiarity or a national social-market compact; church mediation without a theocracy."
 COLDWAR_CUB_civic_reconciliation:0 "Civic Reconciliation"
 COLDWAR_CUB_civic_reconciliation_desc:0 "Christian democrats can offer an institutional bridge between religious citizens, moderate exiles and a population dependent on public services. Reconciliation strengthens confidence and inward migration, while rebuilding municipal administration has a cost."
 COLDWAR_CUB_civic_resistance:0 "A Civic Resistance"
 COLDWAR_CUB_civic_resistance_desc:0 "The movement can convert resistance networks into civilian organisations and seek the return of families abroad. Research and inward migration benefit, while the armed establishment loses some of its cohesion and priority."
 COLDWAR_CUB_civil_military_pact:0 "Coastal Strongpoints"
 COLDWAR_CUB_civil_military_pact_desc:0 "Santiago and the Cuban approaches to Guantánamo need connected local defenses rather than an island-wide fortress belt. Coastal observation, protected firing positions and coordination with the FAR strengthen resistance to a landing. Sustained military priorities also narrow the discretion of civilian institutions."
 COLDWAR_CUB_coastal_patrols:0 "Guantánamo Perimeter"
 COLDWAR_CUB_coastal_patrols_desc:0 "The Guantánamo boundary already has opposing posts, patrols and controlled access. Reinforced positions, protected observation points and coastal approaches can limit an incursion without crossing the base boundary. Construction absorbs funds and does not settle the dispute over the American base."
 COLDWAR_CUB_coastal_patrols_research:0 "Guantánamo Perimeter"
 COLDWAR_CUB_command_college:0 "A Command College"
 COLDWAR_CUB_command_college_desc:0 "A professional command college can turn operational experience into a common doctrine. Its instructors and facilities require funding, while the knowledge earned by the officer corps remains a national asset."
 COLDWAR_CUB_command_college_doctrine:0 "A Command College"
 COLDWAR_CUB_commercial_courts:0 "Commercial Courts"
 COLDWAR_CUB_commercial_courts_desc:0 "Commercial courts can make investment contracts credible without surrendering the right to regulate them. Construction and enterprise output benefit, while tax concessions form part of the negotiated settlement."
 COLDWAR_CUB_committees_defence:0 "Committees of Defence"
 COLDWAR_CUB_committees_defence_desc:0 "The CDRs and security apparatus reach into daily life. Their defensive intelligence advantage is accompanied by political conformity and a narrower space for independent technical discussion."
 COLDWAR_CUB_compensation_bonds:0 "Claims and Bonds"
 COLDWAR_CUB_compensation_bonds_desc:0 "Compensation bonds can acknowledge lawful claims without evicting every current occupier. The settlement protects stability and resilience, while adding a real public debt obligation; it is not a cash windfall for the government."
 COLDWAR_CUB_constitutional_order:0 "Civil Government"
 COLDWAR_CUB_constitutional_order_desc:0 "A competitive republic needs a revenue system and an administration that can serve an opposition government as well as the current cabinet. Better collection and expertise require maintaining that public establishment."
 COLDWAR_CUB_courts_factions:0 "Courts before Factions"
 COLDWAR_CUB_courts_factions_desc:0 "The constitutionalists' first task is to bind the victors to rules they cannot change for private advantage. Independent courts improve confidence in research and administration, while limiting executive political discretion."
 COLDWAR_CUB_cuban_liberation:0 "Cuban Liberation"
 COLDWAR_CUB_cuban_liberation_desc:0 "Alpha 66's armed exile networks would need to form a governing coalition after Castro's fall. A nationalist cabinet could defend sovereignty while placing stricter conditions on outside commerce, reducing resource export earnings."
 COLDWAR_CUB_cuban_socialism:0 "Cuban Socialism"
 COLDWAR_CUB_cuban_socialism_desc:0 "The revolution's social settlement should be able to survive a change of office-holder. A renewed education commitment and technical training will preserve national skills without pretending that social provision finances itself."
 COLDWAR_CUB_cuban_socialism_research:0 "Cuban Socialism"
 COLDWAR_CUB_decrease_corruption_valid_tt:0 "A functioning public oversight system"
 COLDWAR_CUB_defence_programme:0 "The Revolutionary Armed Forces"
 COLDWAR_CUB_defence_programme_desc:0 "A credible defence, or a costly expeditionary establishment; no free starting army."
 COLDWAR_CUB_dependency_diversified:0 "A Broader Productive Base"
 COLDWAR_CUB_dependency_diversified_desc:0 "Food and light industry make the island less vulnerable, although foreign machinery and fuel remain necessary."
 COLDWAR_CUB_dependency_food:0 "Imported Machinery and External Supply"
 COLDWAR_CUB_dependency_food_desc:0 "Domestic food production reduces one vulnerability while machinery and fuel remain dependent on foreign supply."
 COLDWAR_CUB_dependency_industry:0 "Diversifying the Socialist Economy"
 COLDWAR_CUB_dependency_industry_desc:0 "Local industrial production reduces exposure to imported goods; food and energy commitments still bind the economy abroad."
 COLDWAR_CUB_development_first:0 "Development First"
 COLDWAR_CUB_development_first_desc:0 "The directorate can postpone full restitution and make reconstruction its first claim to authority. Publicly directed investment improves construction and resilience, while maintaining a costly administrative machine."
 COLDWAR_CUB_diplomatic_solidarity:0 "Diplomatic Solidarity"
 COLDWAR_CUB_diplomatic_solidarity_desc:0 "Political solidarity can be carried through conferences, public campaigns and non-military exchanges. Cuba gains influence among partners without diverting a large share of trained labour into permanent overseas missions."
 COLDWAR_CUB_economy_programme:0 "The Harvest and the Economy"
 COLDWAR_CUB_economy_programme_desc:0 "Mobilisation, sugar versus food, infrastructure and ownership priorities."
 COLDWAR_CUB_education_efficiency:0 "Education Service Coordination"
 COLDWAR_CUB_education_efficiency_desc:0 "Shared training, procurement and administration sustain a fully funded education service."
 COLDWAR_CUB_enterprise_accounts:0 "Enterprise Accounts"
 COLDWAR_CUB_enterprise_accounts_desc:0 "Production targets should be backed by accounts that expose waste and reward delivery. Enterprise responsibility improves industrial efficiency while diverting resources from agricultural mobilisation and reducing immediate revenue extraction."
 COLDWAR_CUB_enterprise_incentives:0 "Enterprise Incentives"
 COLDWAR_CUB_enterprise_incentives_desc:0 "Managers and work collectives can receive clearer production targets and retain a larger role in local decisions. Factory efficiency and civilian output rise, while agricultural planning and central tax receipts lose some priority."
 COLDWAR_CUB_exile_directorate:0 "Exile Directorate"
 COLDWAR_CUB_exile_directorate_desc:0 "An exile directorate would bring organised outside contacts and a command structure to a fractured transition. Its authority improves military coordination and diplomacy, while lacking the domestic legitimacy of a settled constitutional order."
 COLDWAR_CUB_exile_divide:0 "A Revolution in Exile"
 COLDWAR_CUB_exile_divide_desc:0 "Exile has fractured families and removed professional networks. The continuing disruption of skills and confidence weighs on an already demanding economic transformation."
 COLDWAR_CUB_exile_reconciled:0 "Families across the Straits"
 COLDWAR_CUB_exile_reconciled_desc:0 "An agreed return process and recorded voluntary returns have reduced the division of Cuban families. The skills and trust lost through exile are only partly restored."
 COLDWAR_CUB_factory_councils:0 "Factory Councils"
 COLDWAR_CUB_factory_councils_desc:0 "Councils can take responsibility for maintenance and training at the factory floor. Local initiative improves civilian production, while less uniform working methods limit the gains available from a single national production standard."
 COLDWAR_CUB_family_code:0 "The Family Code"
 COLDWAR_CUB_family_code_desc:0 "The Federation of Cuban Women has brought the division of work within the home into the revolutionary debate. Equal responsibilities between spouses must be backed by childcare, maternity protection and opportunities to study and work. Those commitments widen participation while making social provision a continuing public obligation."
 COLDWAR_CUB_family_doctor_teams:0 "Family Doctor Teams"
 COLDWAR_CUB_family_doctor_teams_desc:0 "A doctor and a nurse assigned to a neighbourhood can follow families between illness, prevention and recovery. The Lawton experiment will become a programme of community teams linked to the polyclinics. Continuity of care requires training and a larger health budget, while coordinated referrals reduce duplicated work."
 COLDWAR_CUB_family_wages:0 "Family and Wages"
 COLDWAR_CUB_family_wages_desc:0 "A family policy needs healthcare and a dependable social wage rather than slogans about morality. Public healthcare receives additional funding, with population and fiscal effects that develop over time."
 COLDWAR_CUB_far_programme:0 "FAR · National Administration"
 COLDWAR_CUB_far_programme_desc:0 "Raúl's professional military current, administrative engineering or a combat-first force."
 COLDWAR_CUB_far_reorganisation:0 "Reorganise the FAR"
 COLDWAR_CUB_far_reorganisation_desc:0 "The guerrilla victory of 1959 is not a substitute for a professional staff, dependable logistics and modern training. The FAR must prepare for the threats Cuba actually faces rather than measure prestige by the size of its equipment requests."
 COLDWAR_CUB_far_reorganisation_doctrine:0 "Reorganise the FAR"
 COLDWAR_CUB_finish_zafra:0 "Finish the Zafra"
 COLDWAR_CUB_finish_zafra_desc:0 "The leadership can still concentrate the nation on the cane fields. Finishing the campaign preserves revolutionary authority and raises farm output, but workshops and housing must wait for their workers to return."
 COLDWAR_CUB_finish_zafra_research:0 "Finish the Zafra"
 COLDWAR_CUB_first_congress:0 "The First Congress"
 COLDWAR_CUB_first_congress_desc:0 "A party congress can settle responsibilities that have depended on Fidel's personal intervention. Cadre rules and a recorded programme will make the state more predictable without converting it into a multiparty republic."
 COLDWAR_CUB_five_year_balances:0 "Five-Year Balances"
 COLDWAR_CUB_five_year_balances_desc:0 "A national plan can protect farms and factories from abrupt changes of priority. Stable allocations improve output but leave less room to redirect investment when local conditions change."
 COLDWAR_CUB_food_first:0 "Food before Sugar"
 COLDWAR_CUB_food_first_desc:0 "Vegetables, dairy herds and domestic staples compete with sugar for land and skilled labour. Greater food security offers resilience under pressure, while reducing the export receipts available for imported equipment."
 COLDWAR_CUB_foreign_advisers:0 "Advisory Missions"
 COLDWAR_CUB_foreign_advisers_desc:0 "Concentrate resources on instructors, staff work and limited formations. The programme develops deployable expertise with a smaller standing commitment than a large expeditionary force."
 COLDWAR_CUB_foreign_advisers_doctrine:0 "Advisory Missions"
 COLDWAR_CUB_foreign_algeria:0 "Algerian Medical Accord"
 COLDWAR_CUB_foreign_algeria_desc:0 "Extend a medical relationship that began in the early revolutionary years. Algeria gains clinical coverage and training; Cuba gains clinical exchange and diplomatic reach while supporting the education of replacement staff."
 COLDWAR_CUB_foreign_angola:0 "Angolan Cooperation"
 COLDWAR_CUB_foreign_angola_desc:0 "Offer an independent Angolan government a defined training and logistics mission. Angola gains military expertise; Cuba gains a continuing institutional relationship. Combat deployments remain a separate request and acceptance."
 COLDWAR_CUB_foreign_cadres:0 "Foreign Cadres"
 COLDWAR_CUB_foreign_cadres_desc:0 "Havana can instead expand the cadres assigned to liberation movements and allied institutions. The wider network strengthens Cuban influence, but takes trained staff from domestic services and makes independent diplomacy harder."
 COLDWAR_CUB_foreign_can_fisheries:0 "Atlantic Fisheries"
 COLDWAR_CUB_foreign_can_fisheries_desc:0 "Prioritise fishing access, conservation research and port services. Both governments obtain a more predictable commercial relationship and accept reporting, inspection and enforcement duties."
 COLDWAR_CUB_foreign_can_rail:0 "Canadian Rail Supply"
 COLDWAR_CUB_foreign_can_rail_desc:0 "Put the Canadian commercial facility into rolling stock, spares and maintenance. Canada gains orders and service work. Cuba gains transport efficiency but depends on external suppliers and export clearance."
 COLDWAR_CUB_foreign_caribbean:0 "Caribbean Cooperation"
 COLDWAR_CUB_foreign_caribbean_desc:0 "Make regional diplomacy practical through a Jamaican health and training agreement. Jamaica receives services and skills; Cuba gains professional exchange and a dependable regional relationship while paying for overseas support."
 COLDWAR_CUB_foreign_cession:0 "Cayo Blanco Agreement"
 COLDWAR_CUB_foreign_cession_desc:0 "Propose a genuine territorial settlement with compensation and defined civilian access. The German Democratic Republic decides whether to accept responsibility. No military installation is included."
 COLDWAR_CUB_foreign_cmea:0 "Apply to COMECON"
 COLDWAR_CUB_foreign_cmea_desc:0 "Cuba seeks admission to the Council for Mutual Economic Assistance. An accepted application creates the membership needed for the coordinated specialisation programme. Membership is the prerequisite for the following specialisation agreement."
 COLDWAR_CUB_foreign_ddr:0 "Berlin and Havana"
 COLDWAR_CUB_foreign_ddr_desc:0 "A ratified island agreement gives Havana and East Berlin a basis for practical cooperation. An industrial training commission can turn the friendship gesture or negotiated access protocol into sustained work between Cuban enterprises and East German technical institutions."
 COLDWAR_CUB_foreign_ddr_industry:0 "Citrus for Machinery"
 COLDWAR_CUB_foreign_ddr_industry_desc:0 "Cuban citrus can supply an East German market in return for irrigation and processing machinery. A joint project expands agricultural capacity, while delivery standards, packaging and dependence on a concentrated buyer require lasting commitments from both governments."
 COLDWAR_CUB_foreign_ddr_science:0 "Industrial Training"
 COLDWAR_CUB_foreign_ddr_science_desc:0 "Industrial placements and joint maintenance teams can make imported machinery more useful. Cuba gains trained technicians and East Germany gains service contracts and practical experience. Training capacity, language instruction and compatible technical standards require a continuing education budget on both sides."
 COLDWAR_CUB_foreign_diplomacy:0 "Island Diplomacy"
 COLDWAR_CUB_foreign_diplomacy_desc:0 "A small state needs a professional foreign service and more than one channel to the outside world. Havana can bargain with socialist partners, regional neighbours and Western governments without surrendering control of its own commitments."
 COLDWAR_CUB_foreign_ethiopia:0 "Ethiopian Cooperation"
 COLDWAR_CUB_foreign_ethiopia_desc:0 "Offer staff training, communications and logistical assistance with a clearly agreed mandate. Ethiopia obtains defensive expertise; Cuba takes on the operating cost and risk of a distant military relationship."
 COLDWAR_CUB_foreign_expeditionary:0 "Expeditionary Brigades"
 COLDWAR_CUB_foreign_expeditionary_desc:0 "Maintain larger deployable contingents and the schools needed for distant operations. More formations can be sent abroad, with a higher military wage bill, fuel use and supply burden."
 COLDWAR_CUB_foreign_expeditionary_doctrine:0 "Expeditionary Brigades"
 COLDWAR_CUB_foreign_interests:0 "Talks with Washington"
 COLDWAR_CUB_foreign_interests_desc:0 "Permanent channels can handle prisoners, maritime incidents and migration without resolving every dispute. Both governments approve their own representation. The agreement can be signed while sanctions persist; its cooperation bonuses wait for mutual restrictions to end."
 COLDWAR_CUB_foreign_limited:0 "Ease the Trade Blockade"
 COLDWAR_CUB_foreign_limited_desc:0 "Seek a cheaper commercial opening while leaving the full property-claims settlement unresolved. Washington must approve the relaxation of its own economic restrictions. Outstanding diplomatic and military sanctions continue to suspend the cooperation spirits."
 COLDWAR_CUB_foreign_mex_agro:0 "Agroindustrial Exchange"
 COLDWAR_CUB_foreign_mex_agro_desc:0 "Give processing equipment, applied agronomy and technician exchanges priority in the bilateral project budget. Both countries obtain useful expertise and take on the cost of maintaining a joint training programme."
 COLDWAR_CUB_foreign_mex_fuel:0 "Mexican Fuel Contract"
 COLDWAR_CUB_foreign_mex_fuel_desc:0 "Use the bilateral project budget to purchase Mexican fuel services and coordinate shorter shipping routes. Mexico obtains orders and influence; Cuba diversifies access while becoming dependent on another delivery chain."
 COLDWAR_CUB_foreign_overseas:0 "Overseas Service"
 COLDWAR_CUB_foreign_overseas_desc:0 "Prepare the legal authority, transport arrangements and support staff for overseas service. A smaller mobilisation can become eligible for deployment, but trained formations and the recipient government are still required."
 COLDWAR_CUB_foreign_programme:0 "Foreign Policy"
 COLDWAR_CUB_foreign_programme_desc:0 "Soviet alignment, independent diplomacy, recipient consent, and the Thälmann island."
 COLDWAR_CUB_foreign_settlement:0 "End the Blockade"
 COLDWAR_CUB_foreign_settlement_desc:0 "A comprehensive settlement requires Washington to accept compensation terms and the removal of its remaining restrictions. Cuba can regain commercial access while accepting a costly claims payment and greater exposure to American economic influence. The agreement leaves Cuba's government and the status of Guantánamo outside its terms."
 COLDWAR_CUB_foreign_sov_commodity:0 "Commodity Credits"
 COLDWAR_CUB_foreign_sov_commodity_desc:0 "Prioritise a limited Soviet credit envelope around sugar and nickel deliveries. A longer planning horizon cushions market shocks but concentrates Cuba on one buyer and supplier."
 COLDWAR_CUB_foreign_sov_industry:0 "Industrial Credits"
 COLDWAR_CUB_foreign_sov_industry_desc:0 "Devote the available credit envelope to equipment and technical training. A defined Cuban industrial project expands production but creates continuing training and imported-parts obligations."
 COLDWAR_CUB_foreign_soviet:0 "Soviet Assistance"
 COLDWAR_CUB_foreign_soviet_desc:0 "A negotiated technical mission can maintain Soviet equipment and train Cuban specialists. Moscow gains a durable planning relationship, while Cuba accepts dependence on external standards and spare parts."
 COLDWAR_CUB_foreign_specialisation:0 "Division of Labour"
 COLDWAR_CUB_foreign_specialisation_desc:0 "Members can coordinate demand, technical standards and specialised production. Cuba obtains an agricultural outlet while accepting less domestic industrial diversification."
 COLDWAR_CUB_foreign_spr_nickel:0 "Nickel for Machinery"
 COLDWAR_CUB_foreign_spr_nickel_desc:0 "Commit the Spanish credit facility to machinery purchases secured against Cuban nickel deliveries. Spain gains a commodity outlet and equipment orders; Cuba obtains capital goods at the price of tighter delivery commitments."
 COLDWAR_CUB_foreign_spr_training:0 "Technical Scholarships"
 COLDWAR_CUB_foreign_spr_training_desc:0 "Use the available Spanish cooperation facility for technical institutes, maintenance expertise and scholarships. The return is broader industrial knowledge rather than a larger immediate commodity commitment."
 COLDWAR_CUB_foreign_symbolic:0 "A Name for Thälmann"
 COLDWAR_CUB_foreign_symbolic_desc:0 "Dedicate Cayo Blanco del Sur to Ernst Thälmann and propose a modest scientific and cultural programme. Cuban sovereignty continues. East German acceptance funds the exchange programme."
 COLDWAR_CUB_guevarist_programme:0 "Guevarist Mobilisation"
 COLDWAR_CUB_guevarist_programme_desc:0 "Moral incentives or worker participation; a living political current, not Che's return."
 COLDWAR_CUB_harvest_active_tt:0 "The 1970 harvest campaign is still under way"
 COLDWAR_CUB_harvest_recovery:0 "Recovery after the Harvest"
 COLDWAR_CUB_harvest_recovery_desc:0 "Transport, industry and construction must recover from the extraordinary diversion of resources into the harvest campaign."
 COLDWAR_CUB_harvest_recovery_rebalanced:0 "Rebalancing the Productive Sectors"
 COLDWAR_CUB_harvest_recovery_rebalanced_desc:0 "Earlier reallocation has reduced the post-harvest disruption, though restoring normal production still takes time."
 COLDWAR_CUB_havana_ports:0 "Havana's Ports"
 COLDWAR_CUB_havana_ports_desc:0 "Cuba's foreign trade depends on a small number of harbours and their approaches. Improvements around Havana will support commercial traffic and coastal supply without granting the island a new battle fleet."
 COLDWAR_CUB_health_efficiency:0 "Integrated Health Administration"
 COLDWAR_CUB_health_efficiency_desc:0 "Coordinated referrals and procurement reduce the operating cost of a fully funded health service."
 COLDWAR_CUB_healthcare_workforce_requirement_modifier_tt:0 "$healthcare_workforce_requirement_modifier$: $RIGHT|-=%1$"
 COLDWAR_CUB_imp_refugee_integration_rate_tt:0 "$imp_refugee_integration_rate$: $RIGHT|+=%1$"
 COLDWAR_CUB_increase_education_budget_valid_tt:0 "An established education budget"
 COLDWAR_CUB_increase_healthcare_budget_valid_tt:0 "An established healthcare budget"
 COLDWAR_CUB_independent_republic:0 "Independent Cuba"
 COLDWAR_CUB_independent_republic_desc:0 "Neither Soviet tutelage nor a return to American predominance can define the new republic. A sovereign course strengthens resistance to outside pressure, while limiting some opportunities for foreign commerce."
 COLDWAR_CUB_interior_ministry:0 "The Interior Ministry"
 COLDWAR_CUB_interior_ministry_desc:0 "A MININT-led administration would make internal security the first responsibility of the state. Counterintelligence and executive coordination improve, while the larger security apparatus raises bureaucratic costs and narrows political discretion."
 COLDWAR_CUB_investment_rights:0 "Investment Rights"
 COLDWAR_CUB_investment_rights_desc:0 "Investment can be welcomed without restoring an unrestricted pre-revolutionary property order. Production and construction benefit, while negotiated concessions reduce the revenue immediately captured by the state."
 COLDWAR_CUB_joint_ventures:0 "Joint Ventures"
 COLDWAR_CUB_joint_ventures_desc:0 "Foreign partners can supply equipment and market access under negotiated Cuban ownership rules. Their participation accelerates investment, while profit concessions and outside leverage limit the state's freedom of action."
 COLDWAR_CUB_juceplan_mandate:0 "JUCEPLAN's Mandate"
 COLDWAR_CUB_juceplan_mandate_desc:0 "Economic targets need the authority of an institution capable of refusing impossible promises. Giving JUCEPLAN a stronger mandate improves coordination and investment, at the cost of bureaucracy and personal executive freedom."
 COLDWAR_CUB_juceplan_programme:0 "JUCEPLAN · Central Planning Board"
 COLDWAR_CUB_juceplan_programme_desc:0 "Balanced national plans or enterprise incentives and delegated initiative."
 COLDWAR_CUB_judicial_guarantees:0 "Judicial Guarantees"
 COLDWAR_CUB_judicial_guarantees_desc:0 "Enforceable rights will make it easier to integrate displaced people and replace discretionary administrative decisions. Judicial independence improves that process, while restricting the government's political leverage over individual cases."
 COLDWAR_CUB_labour_guarantee:0 "Labour's Guarantee"
 COLDWAR_CUB_labour_guarantee_desc:0 "Trade unions and workers need enforceable guarantees that political change will not erase the revolution's social gains. Those guarantees widen participation and confidence, while raising the cost of the welfare settlement."
 COLDWAR_CUB_land_labour:0 "Land and Labour"
 COLDWAR_CUB_land_labour_desc:0 "Agrarian reform can be defended without allowing every farm decision to be made in Havana. Better incentives raise output and available work, while the treasury relinquishes part of its agricultural district receipts."
 COLDWAR_CUB_liberal_programme:0 "Constitutional Liberal Republic"
 COLDWAR_CUB_liberal_programme_desc:0 "Claims bonds or property restitution, courts and a free public sphere."
 COLDWAR_CUB_manager_responsibility:0 "Managerial Duty"
 COLDWAR_CUB_manager_responsibility_desc:0 "Managers should be accountable for results rather than merely for optimistic reports. The resulting flexibility improves production and technical work, but unsettles cadres who relied on political protection."
 COLDWAR_CUB_mass_surveillance:0 "Mass Surveillance"
 COLDWAR_CUB_mass_surveillance_desc:0 "The ministry can instead expand local surveillance and political reporting through mass organisations. This increases the state's capacity to watch and control, while skilled workers leave productive services and public debate becomes more restricted."
 COLDWAR_CUB_medical_brigades:0 "Medical Brigades"
 COLDWAR_CUB_medical_brigades_desc:0 "Cuban doctors can build durable relationships where military assistance cannot. A partner must request the mission and share its terms. Overseas accommodation, medical supplies and replacement coverage require a larger public healthcare budget."
 COLDWAR_CUB_medical_brigades_research:0 "Medical Brigades"
 COLDWAR_CUB_military_engineering:0 "Military Engineers"
 COLDWAR_CUB_military_engineering_desc:0 "An eastern infrastructure programme gives military engineers a concrete civilian assignment. The investment improves national connections without turning the armed forces into an unlimited source of free construction."
 COLDWAR_CUB_militia_logistics_research:0 "Militia Logistics"
 COLDWAR_CUB_minint_programme:0 "MININT · Interior Administration"
 COLDWAR_CUB_minint_programme_desc:0 "Professional intelligence or intensive mass surveillance."
 COLDWAR_CUB_mixed_economy:0 "A Mixed Economy"
 COLDWAR_CUB_mixed_economy_desc:0 "Private enterprise, cooperatives and a public sector can coexist under a common administrative framework. Integrating displaced families into ordinary work is a practical test of that promise, and requires more than a declaration of reconciliation."
 COLDWAR_CUB_moa_refinery:0 "Moa's Refinery"
 COLDWAR_CUB_moa_refinery_desc:0 "The nickel industry around Moa gives eastern Cuba an industrial role beyond sugar. Refining and maintenance capacity should be expanded before another prestige project competes for imported machinery and trained technicians."
 COLDWAR_CUB_moral_incentives:0 "Moral Incentives"
 COLDWAR_CUB_moral_incentives_desc:0 "Public recognition and collective duty will take precedence over individual material rewards. Brigades can build and harvest quickly, but industrial managers cannot rely on the same incentives as a wage-led enterprise."
 COLDWAR_CUB_national_settlement:0 "National Settlement"
 COLDWAR_CUB_national_settlement_desc:0 "The transition cannot be governed indefinitely by rival exile committees. A settlement against patronage and private revenge improves confidence, while requiring the directorate to surrender some of its discretion."
 COLDWAR_CUB_old_party:0 "Old Party Cadres"
 COLDWAR_CUB_old_party_desc:0 "The purge of the Microfracción did not erase the older communist administrative tradition. A rehabilitated Soviet-oriented coalition would promise disciplined government and expertise, while accepting greater exposure to Moscow's influence."
 COLDWAR_CUB_open_press:0 "An Open Press"
 COLDWAR_CUB_open_press_desc:0 "An open press can expose official failure and widen technical debate. Research benefits from the circulation of ideas, while a less controlled public sphere is also more accessible to foreign influence."
 COLDWAR_CUB_orderly_succession:0 "Orderly Succession"
 COLDWAR_CUB_orderly_succession_desc:0 "The government will define how authority passes between offices instead of leaving succession to personal allegiance. The settlement improves continuity, while a less personalised revolutionary identity offers weaker protection against ideological drift."
 COLDWAR_CUB_orthodox_programme:0 "Orthodox Planning Cadres"
 COLDWAR_CUB_orthodox_programme_desc:0 "A post-purge Soviet-oriented cadre coalition, not an intact Microfracción in 1970."
 COLDWAR_CUB_ortodoxo_programme:0 "Ortodoxo · Sovereign Republic"
 COLDWAR_CUB_ortodoxo_programme_desc:0 "Chibás's anti-corruption and social-national tradition, separate from the Auténticos."
 COLDWAR_CUB_ospaaal_programme:0 "OSPAAAL · Tricontinental Solidarity"
 COLDWAR_CUB_ospaaal_programme_desc:0 "Diplomatic solidarity or a larger overseas cadre network."
 COLDWAR_CUB_oversight_efficiency:0 "Public Oversight"
 COLDWAR_CUB_oversight_efficiency_desc:0 "Established public accounts and professional oversight reduce administrative waste."
 COLDWAR_CUB_parish_municipality:0 "Parish and Town"
 COLDWAR_CUB_parish_municipality_desc:0 "Local schools and voluntary associations can help displaced families enter ordinary civic life. Their contribution reduces public provision costs, while concentrating resources on basic services rather than specialist research."
 COLDWAR_CUB_party_ministries:0 "Party over Ministry"
 COLDWAR_CUB_party_ministries_desc:0 "Party cadres can ensure that ministries obey a common political direction. Their intervention strengthens the leadership's authority and ideological discipline while reducing the discretion of enterprise managers."
 COLDWAR_CUB_pcc_programme:0 "PCC · Fidel Castro"
 COLDWAR_CUB_pcc_programme_desc:0 "Popular power, family law, community medicine and biotechnology; markets or mobilised construction."
 COLDWAR_CUB_peasant_markets:0 "Peasant Markets"
 COLDWAR_CUB_peasant_markets_desc:0 "Farmers who fulfil state procurement quotas may sell eligible surplus directly to consumers. Keeping these markets preserves an incentive to produce food that rationed shops struggle to supply. Higher private returns and unequal purchasing power make the policy contentious, while a smaller share of agricultural receipts passes through the state."
 COLDWAR_CUB_permanent_effects_tt:0 "Permanent effects:"
 COLDWAR_CUB_plan_balances:0 "National Plan Balances"
 COLDWAR_CUB_plan_balances_desc:0 "A JUCEPLAN-led government would begin by reconciling production targets with transport, labour and imported inputs. Better coordination supports civilian output, while the planning apparatus adds a permanent administrative cost."
 COLDWAR_CUB_planned_republic:0 "A Planned Republic"
 COLDWAR_CUB_planned_republic_desc:0 "A disciplined planning republic can deliver a larger and more dependable agricultural surplus. Achieving it requires a permanent administrative network, not an assumption that every local producer will obey without supervision."
 COLDWAR_CUB_pluralist_covenant:0 "Pluralist Covenant"
 COLDWAR_CUB_pluralist_covenant_desc:0 "A durable covenant must protect believers and non-believers and bind the government to constitutional rights. Broader legitimacy strengthens the country against outside pressure, while negotiation limits the executive's personal freedom."
 COLDWAR_CUB_popular_power:0 "People's Power"
 COLDWAR_CUB_popular_power_desc:0 "Fidel's authority can be given a more durable institutional base through local assemblies and the mass organisations. A stronger party-state coordinates decisions, but it also carries a larger administrative establishment."
 COLDWAR_CUB_professional_intelligence:0 "Intelligence Service"
 COLDWAR_CUB_professional_intelligence_desc:0 "A smaller professional service can concentrate on foreign penetration, critical infrastructure and accountable investigations. Better analysis aids research and defensive security, though specialised personnel and oversight remain costly."
 COLDWAR_CUB_professional_revolution:0 "Professional Rule"
 COLDWAR_CUB_professional_revolution_desc:0 "The FAR's professional officers can promise a disciplined succession and a state that carries out its decisions. Military management improves organisation and administrative efficiency while narrowing civilian political autonomy."
 COLDWAR_CUB_promise_1940:0 "The Promise of 1940"
 COLDWAR_CUB_promise_1940_desc:0 "The constitution's social and national promises need courts, public scrutiny and a government willing to be bound by them. Stability and research benefit from predictable institutions, while executive bargaining becomes more demanding."
 COLDWAR_CUB_protected_enterprises:0 "Protected Firms"
 COLDWAR_CUB_protected_enterprises_desc:0 "State enterprises can retain their domestic market while being held to production and maintenance targets. Protection reduces external exposure, but it also leaves investment dependent on domestic resources and administrative discipline."
 COLDWAR_CUB_provisional_charter:0 "Civilian Transition"
 COLDWAR_CUB_provisional_charter_desc:0 "A provisional charter must say who will govern after the emergency. A civilian timetable and an extended directorate are different settlements, to be resolved through the existing party system rather than by replaying reconstruction rewards."
 COLDWAR_CUB_public_accounts:0 "Public Accounts"
 COLDWAR_CUB_public_accounts_desc:0 "An honest revenue system needs published accounts and officials who can resist discretionary favours. Tax collection and administrative efficiency improve, while stronger oversight constrains executive political freedom."
 COLDWAR_CUB_rail_lorries_research:0 "Rail and Lorries"
 COLDWAR_CUB_rece_programme:0 "RECE · Exile Directorate"
 COLDWAR_CUB_rece_programme_desc:0 "A hard anti-communist transition with a choice between restoration and state-led rebuilding."
 COLDWAR_CUB_rectification:0 "Rectification"
 COLDWAR_CUB_rectification_desc:0 "The leadership can reject what it regards as narrow material self-interest and return to mass mobilisation. Public works gain labour and urgency, while managers and researchers lose some autonomy and predictability."
 COLDWAR_CUB_restitution:0 "Guarded Restitution"
 COLDWAR_CUB_restitution_desc:0 "Restitution under judicial safeguards can attract exile capital more quickly than a long bond settlement. It also reopens disputes over homes, farms and employment, with an immediate social cost."
 COLDWAR_CUB_restoration_first:0 "Restoration First"
 COLDWAR_CUB_restoration_first_desc:0 "Returning capital and commercial networks can rebuild civilian production quickly. An uncompromising restoration also deepens property conflict and makes the new order more vulnerable to the patrons on which it relies."
 COLDWAR_CUB_restore_sectors:0 "Restore the Sectors"
 COLDWAR_CUB_restore_sectors_desc:0 "Transport depots, repairs and consumer production cannot remain subordinate to a single target. Returning labour to those sectors offers a broader recovery, at the political cost of admitting that willpower has limits."
 COLDWAR_CUB_restore_sectors_research:0 "Restore the Sectors"
 COLDWAR_CUB_retain_doctors:0 "Retain the Doctors"
 COLDWAR_CUB_retain_doctors_desc:0 "Keeping newly trained medical staff at home will strengthen ordinary public provision. The policy forgoes some international influence in return for a service that reaches more Cuban households."
 COLDWAR_CUB_retain_doctors_research:0 "Retain the Doctors"
 COLDWAR_CUB_revive_microbrigades:0 "Revive Microbrigades"
 COLDWAR_CUB_revive_microbrigades_desc:0 "Workplaces can again release teams for housing, childcare centres and neighbourhood improvements. The microbrigades make social construction a visible collective project, supported by Havana's utilities and access works. Materials, supervision and time away from ordinary production remain real costs of mobilisation."
 COLDWAR_CUB_revolutionary_offensive:0 "The Revolutionary Offensive"
 COLDWAR_CUB_revolutionary_offensive_desc:0 "The 1968 nationalisations extended state control deep into small enterprise. Political control is strong, but administrative overload and the disappearance of local initiative weigh on civilian production."
 COLDWAR_CUB_rural_clinics:0 "Rural Clinics"
 COLDWAR_CUB_rural_clinics_desc:0 "Rural families need regular access to trained medical staff, not simply a distant hospital on paper. Local clinics use scarce personnel efficiently, but their staffing and supplies remain a recurring public expense."
 COLDWAR_CUB_science_schools_research:0 "Schools of Science"
 COLDWAR_CUB_sdpe_continuity:0 "Continue the SDPE"
 COLDWAR_CUB_sdpe_continuity_desc:0 "Enterprise accounts and material incentives can remain part of socialist planning. Keeping the system rewards efficient managers and producers, but leaves the state a smaller share of the income it generates."
 COLDWAR_CUB_security_civilian:0 "Civilian Security Institutions"
 COLDWAR_CUB_security_civilian_desc:0 "Security services operate under civilian law and public oversight, with a continuing administrative obligation."
 COLDWAR_CUB_security_professional:0 "Professional Security Institutions"
 COLDWAR_CUB_security_professional_desc:0 "Professional services replace the mass security apparatus. Institutional secrecy and political priorities continue to constrain public life."
 COLDWAR_CUB_shame_money:0 "Integrity over Money"
 COLDWAR_CUB_shame_money_desc:0 "The moral authority of Chibás rests on honest government rather than another patronage machine. An Ortodoxo cabinet will begin by confronting corruption, accepting the cost of an administration capable of investigating its own supporters."
 COLDWAR_CUB_shortcut_alpha:0 "Alpha 66 · National Liberation"
 COLDWAR_CUB_shortcut_autentico:0 "Auténtico · Social Republic"
 COLDWAR_CUB_shortcut_christian:0 "Christian Democratic Movement"
 COLDWAR_CUB_shortcut_defence:0 "The Revolutionary Armed Forces"
 COLDWAR_CUB_shortcut_economy:0 "The Harvest and the Economy"
 COLDWAR_CUB_shortcut_far:0 "FAR · National Administration"
 COLDWAR_CUB_shortcut_foreign:0 "Foreign Policy"
 COLDWAR_CUB_shortcut_guevarist:0 "Guevarist Mobilisation"
 COLDWAR_CUB_shortcut_juceplan:0 "JUCEPLAN · Central Planning Board"
 COLDWAR_CUB_shortcut_liberal:0 "Constitutional Liberal Republic"
 COLDWAR_CUB_shortcut_minint:0 "MININT · Interior Administration"
 COLDWAR_CUB_shortcut_orthodox:0 "Orthodox Planning Cadres"
 COLDWAR_CUB_shortcut_ortodoxo:0 "Ortodoxo · Sovereign Republic"
 COLDWAR_CUB_shortcut_ospaaal:0 "OSPAAAL · Tricontinental Solidarity"
 COLDWAR_CUB_shortcut_pcc:0 "PCC · Fidel Castro"
 COLDWAR_CUB_shortcut_rece:0 "RECE · Exile Directorate"
 COLDWAR_CUB_shortcut_society:0 "The Social State"
 COLDWAR_CUB_social_achievements:0 "Literacy and Public Medicine"
 COLDWAR_CUB_social_achievements_desc:0 "Literacy and public medicine have widened access to essential services. Maintaining that provision requires a lasting commitment of teachers, medical staff and public income."
 COLDWAR_CUB_social_insurance:0 "Social Insurance"
 COLDWAR_CUB_social_insurance_desc:0 "A republican government will fund a health service that survives a change of party. Expanding public healthcare is a lasting institutional commitment with a continuing fiscal cost."
 COLDWAR_CUB_social_market:0 "Social-Market Pact"
 COLDWAR_CUB_social_market_desc:0 "Employers, workers and the government can bargain over a shared social-market settlement. Participation and reliable revenue improve, while nationally guaranteed benefits remain an obligation of the weekly budget."
 COLDWAR_CUB_social_republic:0 "Social Citizenship"
 COLDWAR_CUB_social_republic_desc:0 "National independence must have a social purpose. Education and access to work can widen the republic's domestic foundation, while a larger welfare settlement makes demands on the weekly budget."
 COLDWAR_CUB_socialist_constitution:0 "The Constitution"
 COLDWAR_CUB_socialist_constitution_desc:0 "The constitution will define the party's leading role and the place of the assemblies, ministries and social organisations. Constitutional order lends stability while making the administrative costs of the settlement permanent."
 COLDWAR_CUB_society_programme:0 "The Social State"
 COLDWAR_CUB_society_programme_desc:0 "Preserve achievements while choosing how to fund and distribute scarce skilled labour."
 COLDWAR_CUB_soldiers_not_managers:0 "Soldiers, Not Firms"
 COLDWAR_CUB_soldiers_not_managers_desc:0 "The armed forces can refuse a permanent role in commercial management and concentrate on readiness. Better organisation and faster training then come at the expense of the engineering capacity that civilian projects might have borrowed."
 COLDWAR_CUB_solidarity_profit:0 "Solidarity First"
 COLDWAR_CUB_solidarity_profit_desc:0 "International solidarity is a commitment of people and resources rather than an export commodity. The government can sustain an additional volunteer formation, while accepting higher recurring military personnel expenditure."
 COLDWAR_CUB_soviet_standards:0 "Common Standards"
 COLDWAR_CUB_soviet_standards_desc:0 "Common engineering standards will make imported machinery easier to maintain. Technical education offers a durable national gain while the current coalition remains responsible for the political terms of cooperation."
 COLDWAR_CUB_soviet_standards_research:0 "Common Standards"
 COLDWAR_CUB_subsidiarity:0 "Subsidiarity"
 COLDWAR_CUB_subsidiarity_desc:0 "Municipalities and voluntary institutions should carry responsibilities they can fulfil locally. A smaller central bureaucracy and more responsive enterprises come at the price of a narrower national tax base."
 COLDWAR_CUB_sugar_exports:0 "Sugar for Export"
 COLDWAR_CUB_sugar_exports_desc:0 "Reliable sugar exports can purchase machinery and fuel that Cuba cannot yet produce. This programme protects the cash-crop economy, accepting greater exposure to foreign buyers instead of promising that specialization is free."
 COLDWAR_CUB_sugar_oil:0 "Sugar and Soviet Oil"
 COLDWAR_CUB_sugar_oil_desc:0 "Sugar provides an export livelihood, while machinery and oil depend heavily on foreign partners. This is a structural exposure, not a guarantee of outside support."
 COLDWAR_CUB_supply_shortage_mitigated:0 "A Diversified Economy under Strain"
 COLDWAR_CUB_supply_shortage_mitigated_desc:0 "Broader domestic production limits the damage from interrupted deliveries; essential imported inputs remain scarce."
 COLDWAR_CUB_supply_shortage_partial:0 "Disrupted External Supply"
 COLDWAR_CUB_supply_shortage_partial_desc:0 "Domestic diversification cushions an actual interruption of agreed external deliveries, but shortages still delay production."
 COLDWAR_CUB_supply_shortage_severe:0 "Interrupted Soviet Deliveries"
 COLDWAR_CUB_supply_shortage_severe_desc:0 "An actual withdrawal of agreed external support has exposed Cuba’s concentrated trading and fuel dependencies."
 COLDWAR_CUB_teaching_hospitals:0 "Teaching Hospitals"
 COLDWAR_CUB_teaching_hospitals_desc:0 "Concentrating equipment and specialist training in major hospitals can develop a stronger medical profession. It improves research and sector output, while requiring more expensive facilities than a dispersed basic service."
 COLDWAR_CUB_territorial_defence:0 "Territorial Defence"
 COLDWAR_CUB_territorial_defence_desc:0 "Dispersed positions, trained reserves and knowledge of the island favour a defensive war. This doctrine makes Cuba harder to invade while accepting less emphasis on offensive operations beyond its shores."
 COLDWAR_CUB_territorial_defence_research:0 "Territorial Defence"
 COLDWAR_CUB_transition_charter:0 "The Civilian Transition Charter"
 COLDWAR_CUB_transition_charter_desc:0 "A temporary charter places the provisional administration under public oversight while a civilian settlement is negotiated through the national political institutions."
 COLDWAR_CUB_unfinished_revolution:0 "The New Man"
 COLDWAR_CUB_unfinished_revolution_desc:0 "Che's death left an ideal that still commands loyalty among militants and young volunteers. A government built around revolutionary commitment can mobilise labour, while its suspicion of technocratic autonomy constrains research."
 COLDWAR_CUB_until_harvest_tt:0 "Until the end of the harvest:"
 COLDWAR_CUB_veterans_civil_life:0 "Veterans into Work"
 COLDWAR_CUB_veterans_civil_life_desc:0 "Demobilisation should provide ordinary work rather than abandon veterans to factional patrons. The economy gains labour and the army budget contracts, at the cost of a smaller specialist military establishment."
 COLDWAR_CUB_veterans_directorate:0 "Veterans in Office"
 COLDWAR_CUB_veterans_directorate_desc:0 "Veterans can instead retain a central role in the state and build a professional nationalist force. Readiness improves, while military priorities constrain civilian enterprise and political bargaining."
 COLDWAR_CUB_workers_assemblies:0 "Workers' Assemblies"
 COLDWAR_CUB_workers_assemblies_desc:0 "A more participatory socialism would place workplace debates inside the production process. Worker initiative and available skills can improve output, while consultation reduces the government's ability to issue rapid commands."
 COLDWAR_CUB_young_brigades:0 "The Young Brigades"
 COLDWAR_CUB_young_brigades_desc:0 "Young volunteers can be assigned a defined infrastructure project instead of another limitless campaign. The work remains a national asset after political fashions change, and the construction budget must still be paid."
 COLDWAR_CUB_zafra_campaign:0 "The Ten Million Ton Campaign"
 COLDWAR_CUB_zafra_campaign_desc:0 "A record harvest is being pursued through an extraordinary diversion of labour, transport and fuel. The campaign is still under way on 1 January 1970; its historical shortfall must not be treated as a completed event."
