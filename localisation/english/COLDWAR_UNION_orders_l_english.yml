# IMPERIA COLD WAR — Annual Union orders in the native Decisions menu.
 COLDWAR_ORD_successful_rifles:0 "Successful Programme: Small Arms"
 COLDWAR_ORD_successful_rifles_desc:0 "The republics have fulfilled the Union commission for small arms. Standardised orders and dependable schedules have reduced the cost of the next production series.\n\nThis programme lasts 180 days. Its Union benefits require continued membership. Standing shortfalls take priority while their own programme remains in force."
