 COLDWAR_ORD_unfulfilled_cotton:0 "Unfulfilled Programme: Cotton and Textile Capacity"
 COLDWAR_ORD_unfulfilled_cotton_desc:0 "The annual commission for cotton and textile capacity has fallen short. Interrupted schedules and unfinished preparations are raising the cost of subsequent work.\n\nThis programme lasts 180 days. Its Union benefits require continued membership. Standing shortfalls take priority while their own programme remains in force."
 COLDWAR_ORD_successful_fossil:0 "Successful Programme: Thermal Power Stations"
 COLDWAR_ORD_successful_fossil_desc:0 "The Union development programme has delivered its agreed capacity. The new installations and established working methods now support the republican economy.\n\nThis programme lasts 180 days. Its Union benefits require continued membership. Standing shortfalls take priority while their own programme remains in force."
