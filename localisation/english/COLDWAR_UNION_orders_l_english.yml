 COLDWAR_ORD_successful_infrastructure:0 "Successful Programme: Infrastructure"
 COLDWAR_ORD_successful_infrastructure_desc:0 "The Union development programme has delivered its agreed capacity. The new installations and established working methods now support the republican economy.\n\nThis programme lasts 180 days. Its Union benefits require continued membership. Standing shortfalls take priority while their own programme remains in force."
 COLDWAR_ORD_unfulfilled_infrastructure:0 "Unfulfilled Programme: Infrastructure"
