 COLDWAR_ORD_successful_dockyard:0 "Successful Programme: Dockyards"
 COLDWAR_ORD_successful_dockyard_desc:0 "The Union development programme has delivered its agreed capacity. The new installations and established working methods now support the republican economy.\n\nThis programme lasts 180 days. Its Union benefits require continued membership. Standing shortfalls take priority while their own programme remains in force."
 COLDWAR_ORD_unfulfilled_dockyard:0 "Unfulfilled Programme: Dockyards"
 COLDWAR_ORD_unfulfilled_dockyard_desc:0 "The annual commission for dockyards has fallen short. Interrupted schedules and unfinished preparations are raising the cost of subsequent work.\n\nThis programme lasts 180 days. Its Union benefits require continued membership. Standing shortfalls take priority while their own programme remains in force."
 COLDWAR_ORD_shortfall:0 "Unfulfilled Union Programmes"
 COLDWAR_ORD_shortfall_desc:0 "Missed republican commissions have disrupted Union supply schedules. Factories and ministries must devote additional capacity to civilian provisioning while production is reorganised.\n\nConsumer Goods Factor: +3% for 180 days. Concurrent shortfalls do not multiply this burden."
 COLDWAR_ORD_policy_directive_staff:0 "Union Commissioning Staff"
 COLDWAR_ORD_policy_directive_staff_desc:0 "A permanent commissioning staff standardises republican production schedules. Its specialists improve the next production series while adding to the Union administrative bill.\n\nThe programme requires continued Union membership."
 COLDWAR_ORD_policy_production_audit:0 "Union Production Inspectorate"
 COLDWAR_ORD_policy_production_audit_desc:0 "Inspectors reconcile enterprise returns and public receipts. Better accounts recover revenue, but regular inspection requires a larger administrative establishment.\n\nThe programme requires continued Union membership."
 COLDWAR_ORD_policy_control_commission:0 "Union Control Commission"
 COLDWAR_ORD_policy_control_commission_desc:0 "The control commission can enforce the centre's decisions across ministerial boundaries. Its authority comes at the cost of resentment among officials and enterprise directors.\n\nThe programme requires continued Union membership."
 COLDWAR_ORD_policy_counter_plan:0 "Counter-Plan Production Standards"
 COLDWAR_ORD_policy_counter_plan_desc:0 "Enterprise collectives commit to higher operating standards. Longer standardised production runs raise attainable efficiency and place greater demands on power supplies.\n\nThe programme requires continued Union membership."
 COLDWAR_ORD_policy_procurement_agents:0 "Republican Procurement Network"
 COLDWAR_ORD_policy_procurement_agents_desc:0 "Republican procurement agents locate missing components and arrange deliveries between enterprises. Their favours keep work moving while increasing administrative costs.\n\nThe programme requires continued Union membership. Its current commission lasts 180 days."
 COLDWAR_ORD_policy_overtime:0 "Extra Production Shifts"
 COLDWAR_ORD_policy_overtime_desc:0 "Factories work additional shifts to meet the annual commission. Industrial output rises, while construction loses personnel, transport and materials.\n\nThe programme requires continued Union membership. Its current commission lasts 180 days."
 COLDWAR_ORD_prepare:0 "Annual Union Orders"
 COLDWAR_ORD_prepare_desc:0 "The Union ministries coordinate republican commissions for the coming year. Moscow may issue a directive, while a republican council may submit its own proposal for confirmation.\n\nRepublic: §Y[COLDWAR_ORD_GetRecipient]§!\nCommission: §Y[COLDWAR_ORD_GetFamily]§!\nObligation: [COLDWAR_ORD_GetKind]\nAnnual quantity: §Y[?COLDWAR_ORD_draft_quantity|0]§!\nAccounting period: §Y365 days§!\nUnion assistance: §Y[?COLDWAR_ORD_draft_fraction|%3]§! of Soviet GDP\n\n[COLDWAR_ORD_GetMeasurement]"
 COLDWAR_ORD_submissions:0 "Republican Submissions"
 COLDWAR_ORD_submissions_desc:0 "Republican planning councils have submitted their commissions for Soviet confirmation. Approval commits the published quantity and assistance, then opens a full year of work. Unsigned proposals carry no production obligation."
 COLDWAR_ORD_register:0 "Annual Obligations"
 COLDWAR_ORD_register_desc:0 "The annual register records issued commissions and their remaining time. A fulfilled programme or shortfall lasts 180 days. AI administrations carry no punitive quota; an unfinished commission transferred to AI administration is closed neutrally."
