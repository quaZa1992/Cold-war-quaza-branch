 COLDWAR_UNI_fund_005: "Fund the Union Programme: 0.5 % of GDP"
 COLDWAR_UNI_fund_005_desc: "Moscow moves 0.5 % of its GDP into the Union fund. The fund pays the plants of the Union programmes, wherever a member starts them. Fund now:  dollars [?global.COLDWAR_UNI_fund|1] billion."
 COLDWAR_UNI_fund_01: "Fund the Union Programme: 1 % of GDP"
 COLDWAR_UNI_fund_01_desc: "Moscow moves 1 % of its GDP into the Union fund. The fund pays the plants of the Union programmes, wherever a member starts them. Fund now:  dollars [?global.COLDWAR_UNI_fund|1] billion."
 COLDWAR_UNI_fund_02: "Fund the Union Programme: 2 % of GDP"
 COLDWAR_UNI_fund_02_desc: "Moscow moves 2 % of its GDP into the Union fund. The fund pays the plants of the Union programmes, wherever a member starts them. Fund now:  dollars [?global.COLDWAR_UNI_fund|1] billion."
 COLDWAR_UNI_fund_pays_tt: "The §YUnion fund§! pays the plant: §Y dollars [?cw_price|1] billion§! (fund now  dollars [?global.COLDWAR_UNI_fund|1] billion)."
 COLDWAR_UNI_fund_short_tt: "The §YUnion fund§! holds only  dollars [?global.COLDWAR_UNI_fund|1] billion of  dollars [?cw_price|1] billion; we pay the rest ourselves."
 COLDWAR_UNI_gate_bam_tt: "Moscow has completed §YThe Baikal-Amur Mainline§!."
 COLDWAR_UNI_gate_cascade_tt: "§YThe Great Hydro Cascades§! are completed."
 COLDWAR_UNI_gate_coastal_tt: "We control a coastal state."
 COLDWAR_UNI_gate_energia_tt: "Moscow has completed §YBuran§!."
 COLDWAR_UNI_gate_kamaz_tt: "Moscow has completed §YKamAZ§!."
 COLDWAR_UNI_gate_oil_tt: "We own a state with oil deposits."
 COLDWAR_UNI_gate_rivers_tt: "Moscow has decided to turn the northern rivers."
 COLDWAR_UNI_gate_steel_tt: "We own a state with steel deposits."
 COLDWAR_UNI_gate_steppe_tt: "We are Moscow or a republic of the steppe and the deserts (Kazakhstan, Central Asia, Azerbaijan)."
 COLDWAR_UNI_gate_urengoy_tt: "Moscow has completed §YUrengoy§!."
 COLDWAR_UNI_goods_for_the_people: "Goods for the People"
 COLDWAR_UNI_grain_elevators: "Grain Elevators of the Union"
 COLDWAR_UNI_group_b: "Group B Before Group A"
 COLDWAR_UNI_high_voltage: "High-Voltage Lines of the Union"
 COLDWAR_UNI_one_standard: "One Standard for the Army"
 COLDWAR_UNI_prog_academy: "Academy Towns"
 COLDWAR_UNI_prog_academy_desc: "Academy towns in the republics, after the model of Akademgorodok: scientists with flats, institutes and a little freedom."
 COLDWAR_UNI_prog_atoms: "Atoms for the Republics"
 COLDWAR_UNI_prog_atoms_desc: "Atoms for the republics: a nuclear power station on our soil. It runs in the normal nuclear power system, with upkeep, safety and the risk of an accident."
 COLDWAR_UNI_prog_bam: "The Baikal, Amur Mainline"
 COLDWAR_UNI_prog_bam_desc: "Our own section of the Baikal-Amur Mainline, built by a brigade from our republic. The newspapers print the names."
 COLDWAR_UNI_prog_cadres: "The Cadre Exchange"
 COLDWAR_UNI_prog_cadres_desc: "The cadre exchange: engineers and teachers serve some years in another republic, and bring back what they learned."
 COLDWAR_UNI_prog_cascade: "The Great Hydro Cascades"
 COLDWAR_UNI_prog_cascade_desc: "Cascades of dams on the great rivers: cheap power for decades, and new seas where the valleys were."
 COLDWAR_UNI_prog_cement: "The Union Cement Combines"
 COLDWAR_UNI_prog_cement_desc: "Cement is the bread of the five-year plan. New combines in the republics end the queue for Moscow's quotas."
 COLDWAR_UNI_prog_computing: "Computing Centres of the Union"
 COLDWAR_UNI_prog_computing_desc: "Computing centres of the Union: each republic gets its machines and its programmers for planning and accounting."
 COLDWAR_UNI_prog_defence: "The Defence Ministries' Plants"
 COLDWAR_UNI_prog_defence_desc: "The nine defence ministries open plants in the republics; the best engineers follow the orders."
 COLDWAR_UNI_prog_elevators: "Grain Elevators of the Union"
 COLDWAR_UNI_prog_elevators_desc: "A fifth of the harvest rots between field and bakery. Elevators of the Union keep it dry."
 COLDWAR_UNI_prog_energia: "Baikonur and Energia"
 COLDWAR_UNI_prog_energia_desc: "Baikonur and Energia: the republics build parts for the heaviest rocket of the Union, and their engineers stay in the programme."
 COLDWAR_UNI_prog_food: "The Food Programme"
 COLDWAR_UNI_prog_food_desc: "The Food Programme of the Union: meat, milk and vegetables in the shops, not only in the reports."
 COLDWAR_UNI_prog_goods: "Goods for the People"
 COLDWAR_UNI_prog_goods_desc: "Goods for the people: refrigerators, televisions and shoes that fit, made in the republics."
 COLDWAR_UNI_prog_groupb: "Group B Before Group A"
 COLDWAR_UNI_prog_groupb_desc: "Group B before Group A, for once: the plan puts consumer goods before the means of production."
 COLDWAR_UNI_prog_housing: "A Flat for Every Family"
 COLDWAR_UNI_prog_housing_desc: "A flat for every family by the year 2000: panel blocks rise in every republic, and the queues get shorter."
 COLDWAR_UNI_prog_irrigate: "Irrigate the Steppe"
 COLDWAR_UNI_prog_irrigate_desc: "Canals carry the rivers of Central Asia into the steppe. The cotton grows; downstream, the sea begins to shrink."
 COLDWAR_UNI_prog_kamaz: "KamAZ: The Kama Truck Works"
 COLDWAR_UNI_prog_kamaz_desc: "Suppliers for KamAZ in every republic: axles, cabs, tyres. The host builds the works and the road to it."
 COLDWAR_UNI_prog_komsomol: "The Komsomol Brigades"
 COLDWAR_UNI_prog_komsomol_desc: "Komsomol brigades from every republic go where the Union builds; the songs are about them, the pay is better than at home."
 COLDWAR_UNI_prog_lines: "High-Voltage Lines of the Union"
 COLDWAR_UNI_prog_lines_desc: "High-voltage lines across the Union carry power from the cascades and the reactors to the plants."
 COLDWAR_UNI_prog_machine: "The Union Machine-Building Standard"
 COLDWAR_UNI_prog_machine_desc: "One standard for lathes, presses and gauges from Leningrad to Tashkent: a part made in Kharkov must fit a machine built in Minsk."
 COLDWAR_UNI_prog_nonblack: "The Non-Black-Earth Programme"
 COLDWAR_UNI_prog_nonblack_desc: "The Non-Black-Earth Programme: drainage, roads and machinery for the poor soils of the north."
 COLDWAR_UNI_prog_oilgas: "Oil and Gas for the Grid"
 COLDWAR_UNI_prog_oilgas_desc: "Oil and gas for the grid: new fields are tied into the power stations, and a refinery processes what the field gives."
 COLDWAR_UNI_prog_pipe: "Urengoy, Pomary, Uzhgorod"
 COLDWAR_UNI_prog_pipe_desc: "Urengoy-Pomary-Uzhgorod: the export pipeline to Western Europe crosses our land, and the transit pays."
 COLDWAR_UNI_prog_quality: "The State Quality Mark"
 COLDWAR_UNI_prog_quality_desc: "The State Quality Mark, the pentagon on the box: goods that carry it must be as good as the ones from abroad."
 COLDWAR_UNI_prog_ring: "The Central Asian Energy Ring"
 COLDWAR_UNI_prog_ring_desc: "The Central Asian energy ring joins the dams of the mountains with the plants of the plains."
 COLDWAR_UNI_prog_rivers: "Turn the Siberian Rivers"
 COLDWAR_UNI_prog_rivers_desc: "Turn the Siberian rivers south: the water of the Ob for the fields of Central Asia, the greatest project of the century."
 COLDWAR_UNI_prog_shock: "All-Union Shock Constructions"
 COLDWAR_UNI_prog_shock_desc: "All-Union shock constructions: projects so large that the whole Union builds them, and the host keeps the plant."
 COLDWAR_UNI_prog_standard: "One Standard for the Army"
 COLDWAR_UNI_prog_standard_desc: "One calibre, one gauge, one manual: what a plant in Yerevan builds can be repaired by a workshop in Vladivostok."
 COLDWAR_UNI_prog_steel: "Converter Steel for the Union"
 COLDWAR_UNI_prog_steel_desc: "Oxygen converters replace the open hearths. Each republic with ore and coal gets its share of the new steel."
 COLDWAR_UNI_prog_tpc: "Territorial Production Complexes"
 COLDWAR_UNI_prog_tpc_desc: "Territorial production complexes: power, raw materials and plants planned together in one region instead of ministry by ministry."
 COLDWAR_UNI_prog_ues: "The Unified Energy System"
 COLDWAR_UNI_prog_ues_desc: "The Unified Energy System joins the regional grids: a surplus in Siberia keeps the lights on in the Baltic."
 COLDWAR_UNI_prog_yards: "Yards of the Union"
 COLDWAR_UNI_prog_yards_desc: "Slipways on the Black Sea, the Baltic and the Caspian build for the whole Union fleet."
 COLDWAR_UNI_programme: "The Union Programme"
 COLDWAR_UNI_programme_modifier: "The Union Programme"
 COLDWAR_UNI_quality_mark: "The State Quality Mark"
 COLDWAR_UNI_transit_line: "Urengoy, Pomary, Uzhgorod"
