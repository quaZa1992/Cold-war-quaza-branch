l_english:
 # IMPERIA COLD WAR — post-Soviet party names (generated by COLDWAR_SU_generator/su_post.py)
 COLDWAR_SU_ps_ru_0: "£SOV_western_autocracy (PRES) - Party of Russian Unity and Accord"
 COLDWAR_SU_ps_ru_0_desc: "(Federalist Technocracy) - Party of Russian Unity and Accord\n\nFounded by deputy premier Sergei Shakhrai, the party of the regional elites wants a strong presidency, a real federation and quiet reforms run by experienced administrators."
 COLDWAR_SU_ps_ru_0_icon: "£SOV_western_autocracy"
 COLDWAR_SU_ps_ru_1: "£SOV_western_conservative (DPR) - Democratic Party of Russia"
 COLDWAR_SU_ps_ru_1_desc: "(Centre-Right Democracy) - Democratic Party of Russia\n\nNikolai Travkin's party was the first mass democratic party of the late Soviet years. It stands for property, order and a patriotic, but democratic, Russia."
 COLDWAR_SU_ps_ru_1_icon: "£SOV_western_conservative"
 COLDWAR_SU_ps_ru_2: "£SOV_western_liberal Yabloko"
 COLDWAR_SU_ps_ru_2_desc: "(Social Liberalism) - Yabloko\n\nGrigory Yavlinsky, the author of the Five Hundred Days, leads the democratic opposition to the government's reforms: market economy, yes, but honest, gradual and with a human face."
 COLDWAR_SU_ps_ru_2_icon: "£SOV_western_liberal"
 COLDWAR_SU_ps_ru_3: "£SOV_western_social_democrat (SDPR) - Social Democratic Party of Russia"
 COLDWAR_SU_ps_ru_3_desc: "(Social Democracy) - Social Democratic Party of Russia\n\nA small party of intellectuals and trade unionists that wants Russia to follow the path of Western European social democracy instead of the oligarchs' capitalism."
 COLDWAR_SU_ps_ru_3_icon: "£SOV_western_social_democrat"
 COLDWAR_SU_ps_ru_4: "£SOV_emerging_communism (KPRF) - Communist Party of the Russian Federation"
 COLDWAR_SU_ps_ru_4_desc: "(Patriotic Communism) - Communist Party of the Russian Federation\n\nRe-founded in 1993 under Gennady Zyuganov, the largest party of Russia unites the pensioners, the old cadres and the losers of the reforms. It promises to restore the Soviet welfare state and Russia's greatness."
 COLDWAR_SU_ps_ru_4_icon: "£SOV_emerging_communism"
 COLDWAR_SU_ps_ru_5: "£SOV_left_wing_radical (TR) - Workers' Russia"
 COLDWAR_SU_ps_ru_5_desc: "(Revolutionary Communism) - Workers' Russia\n\nViktor Anpilov's street movement marches with red flags and portraits of Stalin. It wants the factories back in the hands of the workers and the government in prison."
 COLDWAR_SU_ps_ru_5_icon: "£SOV_left_wing_radical"
 COLDWAR_SU_ps_ru_6: "£SOV_rkpparty (RKRP) - Russian Communist Workers' Party"
 COLDWAR_SU_ps_ru_6_desc: "(Orthodox Marxism-Leninism) - Russian Communist Workers' Party\n\nThe hard core of the old party refuses every compromise with the market. Viktor Tyulkin's comrades call for the restoration of the Soviet Union and the dictatorship of the proletariat."
 COLDWAR_SU_ps_ru_6_icon: "£SOV_rkpparty"
 COLDWAR_SU_ps_ru_7: "£SOV_Autocracy Unity"
 COLDWAR_SU_ps_ru_7_desc: "(Party of Power) - Unity\n\nA movement built in a few weeks from the Kremlin's resources. It has no programme beyond loyalty to the state, a bear for a symbol and the most popular ministers of the government."
 COLDWAR_SU_ps_ru_7_icon: "£SOV_Autocracy"
 COLDWAR_SU_ps_ru_13: "£SOV_non_aligned_autocracy (NDR) - Our Home Is Russia"
 COLDWAR_SU_ps_ru_13_desc: "(Managed Stability) - Our Home Is Russia\n\nThe party of Prime Minister Viktor Chernomyrdin and the gas industry. It stands for the government, for the directors and for stability, and voters call it the party of the Kremlin."
 COLDWAR_SU_ps_ru_13_icon: "£SOV_non_aligned_autocracy"
 COLDWAR_SU_ps_ru_14: "£SOV_non_aligned_conservative (OVR) - Fatherland, All Russia"
 COLDWAR_SU_ps_ru_14_desc: "(Regional Conservatism) - Fatherland, All Russia\n\nThe alliance of Moscow's mayor Yury Luzhkov and the powerful governors, with Yevgeny Primakov at its head. It promises a strong state, social care and an end to the rule of the oligarchs."
 COLDWAR_SU_ps_ru_14_icon: "£SOV_non_aligned_conservative"
 COLDWAR_SU_ps_ru_15: "£SOV_civic_power (GS) - Civic Union"
 COLDWAR_SU_ps_ru_15_desc: "(Industrial Centrism) - Civic Union\n\nArkady Volsky's union of the industrialists speaks for the red directors of the great plants. It wants state credits, slower privatisation and protection from foreign competition."
 COLDWAR_SU_ps_ru_15_icon: "£SOV_civic_power"
 COLDWAR_SU_ps_ru_16: "£SOV_non_aligned_libertarian (DVR) - Democratic Choice of Russia"
 COLDWAR_SU_ps_ru_16_desc: "(Market Liberalism) - Democratic Choice of Russia\n\nThe party of Yegor Gaidar and the young reformers who freed the prices. Its answer to every crisis is more market, faster privatisation and a firm turn to the West."
 COLDWAR_SU_ps_ru_16_icon: "£SOV_non_aligned_libertarian"
 COLDWAR_SU_ps_ru_17: "£SOV_non_aligned_greens Kedr"
 COLDWAR_SU_ps_ru_17_desc: "(Ecologism) - Kedr\n\nThe Russian ecological party remembers Chernobyl and the poisoned rivers of the Urals. It wants clean industry, protected forests and an end to the nuclear dumps."
 COLDWAR_SU_ps_ru_17_icon: "£SOV_non_aligned_greens"
 COLDWAR_SU_ps_ru_18: "£SOV_non_aligned_socialist_democrat (ZhR) - Women of Russia"
 COLDWAR_SU_ps_ru_18_desc: "(Social Centrism) - Women of Russia\n\nA movement of women's organisations, teachers and doctors. It asks for child benefits, wages paid on time and a social state that does not abandon families."
 COLDWAR_SU_ps_ru_18_icon: "£SOV_non_aligned_socialist_democrat"
 COLDWAR_SU_ps_ru_19: "£SOV_agrarian_party (APR) - Agrarian Party of Russia"
 COLDWAR_SU_ps_ru_19_desc: "(Agrarian Socialism) - Agrarian Party of Russia\n\nThe party of the collective farm chairmen and the rural districts. It defends the kolkhozes against the sale of land and votes with the communists."
 COLDWAR_SU_ps_ru_19_icon: "£SOV_agrarian_party"
 COLDWAR_SU_ps_ru_20: "£SOV_nationalist_right_wing_populist (LDPR) - Liberal Democratic Party of Russia"
 COLDWAR_SU_ps_ru_20_desc: "(National Populism) - Liberal Democratic Party of Russia\n\nVladimir Zhirinovsky's party is neither liberal nor democratic. It promises cheap vodka, a Russia from the Arctic to the Indian Ocean and revenge on everyone who humiliated the country."
 COLDWAR_SU_ps_ru_20_icon: "£SOV_nationalist_right_wing_populist"
 COLDWAR_SU_ps_ru_21: "£SOV_nationalist_fascism (RNE) - Russian National Unity"
 COLDWAR_SU_ps_ru_21_desc: "(Ultranationalism) - Russian National Unity\n\nA paramilitary movement in black uniforms that preaches a Russia for the Russians. The authorities watch it closely and the voters mostly shun it."
 COLDWAR_SU_ps_ru_21_icon: "£SOV_nationalist_fascism"
 COLDWAR_SU_ps_ru_22: "£SOV_nationalist_military_junta (ChiR) - Honour and Motherland"
 COLDWAR_SU_ps_ru_22_desc: "(Military Patriotism) - Honour and Motherland\n\nGeneral Alexander Lebed's movement gathers the officers who lost their army, their pay and their country. It promises order, honour and a soldier's justice."
 COLDWAR_SU_ps_ru_22_icon: "£SOV_nationalist_military_junta"
 COLDWAR_SU_ps_un_2: "£SOV_free_rus (DR) - Democratic Russia"
 COLDWAR_SU_ps_un_2_desc: "(Liberal Democracy) - Democratic Russia\n\nThe great movement of the democratic years brought hundreds of thousands into the streets. Inside the renewed Union it fights for free elections, private property and a free press."
 COLDWAR_SU_ps_un_2_icon: "£SOV_free_rus"
 COLDWAR_SU_ps_un_3: "£SOV_democratic_soyus (DDR) - Movement for Democratic Reforms"
 COLDWAR_SU_ps_un_3_desc: "(Reform Socialism) - Movement for Democratic Reforms\n\nFounded by Alexander Yakovlev and Eduard Shevardnadze, the reformers of the party leadership want a democratic Union built on law, the market and the trust of the republics."
 COLDWAR_SU_ps_un_3_icon: "£SOV_democratic_soyus"
 COLDWAR_SU_ps_un_6: "£SOV_emerging_reactionary (Soyuz) - Soyuz Deputies' Group"
 COLDWAR_SU_ps_un_6_desc: "(Union Patriotism) - Soyuz Deputies' Group\n\nThe colonels of the Congress of People's Deputies defend the Union against every concession to the republics. Their leaders say the Union can be saved only by a firm hand."
 COLDWAR_SU_ps_un_6_icon: "£SOV_emerging_reactionary"
 COLDWAR_SU_ps_un_15: "£SOV_civic_power (NPS) - Scientific-Industrial Union"
 COLDWAR_SU_ps_un_15_desc: "(Industrial Centrism) - Scientific-Industrial Union\n\nThe union of the directors of the great plants wants the Union's economy kept together: common supply chains, common orders and credits from Moscow."
 COLDWAR_SU_ps_un_15_icon: "£SOV_civic_power"
 COLDWAR_SU_ps_un_18: "£SOV_social_democrat_1 (DPKR) - Democratic Party of Communists of Russia"
 COLDWAR_SU_ps_un_18_desc: "(Democratic Communism) - Democratic Party of Communists of Russia\n\nCommunists who broke with the party apparatus, led by Alexander Rutskoy. They want a democratic socialism inside a strong and renewed Union."
 COLDWAR_SU_ps_un_18_icon: "£SOV_social_democrat_1"
 COLDWAR_SU_ps_un_20: "£SOV_ldpss (LDPSS) - Liberal Democratic Party of the Soviet Union"
 COLDWAR_SU_ps_un_20_desc: "(National Populism) - Liberal Democratic Party of the Soviet Union\n\nVladimir Zhirinovsky's party was the first opposition party registered in the Soviet Union. It promises every voter something and the Union a return to greatness."
 COLDWAR_SU_ps_un_20_icon: "£SOV_ldpss"
 COLDWAR_SU_ps_ju_2: "£SOV_free_rus (DR) - Democratic Russia in the Underground"
 COLDWAR_SU_ps_ju_2_desc: "(Liberal Democracy) - Democratic Russia in the Underground\n\nThe democratic movement is banned and its leaders are hiding, in exile or in prison. Its samizdat still reaches the factories and the universities."
 COLDWAR_SU_ps_ju_2_icon: "£SOV_free_rus"
 COLDWAR_SU_ps_ju_6: "£SOV_emerging_reactionary (Soyuz) - Soyuz Group"
 COLDWAR_SU_ps_ju_6_desc: "(Union Patriotism) - Soyuz Group\n\nThe colonels of the Soyuz group welcomed the Committee from the first day. They want the Union restored in its old borders, by force if necessary."
 COLDWAR_SU_ps_ju_6_icon: "£SOV_emerging_reactionary"
 COLDWAR_SU_ps_ju_20: "£SOV_ldpss (LDPSS) - Liberal Democratic Party of the Soviet Union"
 COLDWAR_SU_ps_ju_20_desc: "(National Populism) - Liberal Democratic Party of the Soviet Union\n\nVladimir Zhirinovsky backed the Committee on the first day of the emergency. His party is the only opposition the Committee allows."
 COLDWAR_SU_ps_ju_20_icon: "£SOV_ldpss"
 COLDWAR_SU_ps_ju_22: "£SOV_comm_military_junta (GKChP) - State Committee on the State of Emergency"
 COLDWAR_SU_ps_ju_22_desc: "(Emergency Rule) - State Committee on the State of Emergency\n\nEight men from the government, the army, the KGB and the defence industry rule the Union by decree. They promise order and bread, in that order."
 COLDWAR_SU_ps_ju_22_icon: "£SOV_comm_military_junta"
