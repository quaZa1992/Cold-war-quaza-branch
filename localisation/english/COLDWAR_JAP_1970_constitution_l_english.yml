 coldwar_jap.2.t: "Japan Revises Its Defence Constitution"
 coldwar_jap.2.d: "Japan has ratified a constitutional revision that broadens the legal basis for national defence. Washington must decide how to respond to the change in the Pacific security relationship."
 coldwar_jap.2.a: "Protest the revision"
 coldwar_jap.2.b: "Seek safeguards and cooperation"
 coldwar_jap.3.t: "Japan Revises Its Defence Constitution"
 coldwar_jap.3.d: "Japan has ratified a constitutional revision that broadens the legal basis for national defence. Moscow must decide whether to condemn the change or preserve a guarded diplomatic channel."
 coldwar_jap.3.a: "Condemn the revision"
 coldwar_jap.3.b: "Maintain guarded dialogue"
 coldwar_jap.5.t: "US Safeguards Proposal"
 coldwar_jap.5.d: "The United States proposes a limited naval cooperation arrangement tied to safeguards on Japan's revised defence policy. Each government must fund its own share."
 coldwar_jap.5.a: "Accept and pay $1 billion"
 coldwar_jap.5.b: "Decline the arrangement"
