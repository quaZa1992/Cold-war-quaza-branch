l_english:
 # IMPERIA COLD WAR: Project-specific integration; preserve existing author credits.
# COLDWAR | Infantry 1940-1990 intermediate techs
 mdcw_marksman_rifles_1963: "Designated Marksman Rifles"
 mdcw_marksman_rifles_1963_desc: "A semi-automatic rifle with a telescopic sight in every platoon lets one trained marksman hit officers, radio operators and machine-gun crews beyond the reach of ordinary rifles."
 mdcw_underbarrel_grenade_launcher_1969: "Underbarrel Grenade Launchers"
 mdcw_underbarrel_grenade_launcher_1969_desc: "A grenade launcher clipped under the rifle gives every fire team its own grenadier without carrying a separate weapon."
 mdcw_optical_combat_sights_1987: "Optical Combat Sights"
 mdcw_optical_combat_sights_1987_desc: "Magnified sights with illuminated reticles go on every soldier's rifle instead of only the sniper's."
 mdcw_light_4x4_vehicles_1941: "Light 4x4 Utility Vehicles"
 mdcw_light_4x4_vehicles_1941_desc: "Small four-wheel-drive cars carry commanders, scouts, radios and light weapons across almost any ground."
 mdcw_diesel_tactical_trucks_1970: "Diesel Tactical Trucks"
 mdcw_diesel_tactical_trucks_1970_desc: "Diesel engines replace petrol in military trucks. They use less fuel, run further between refuels and wear more slowly."
 mdcw_mine_protected_vehicles_1978: "Mine-Protected Vehicles"
 mdcw_mine_protected_vehicles_1978_desc: "V-shaped armoured hulls deflect the blast of a land mine away from the crew compartment, so patrols on mined roads survive hits that would destroy an ordinary truck."
 mdcw_automatic_grenade_launcher_1970: "Automatic Grenade Launchers"
 mdcw_automatic_grenade_launcher_1970_desc: "Belt-fed launchers fire grenades in bursts and smother an area the way a machine gun covers a line."
 mdcw_light_company_mortar_1978: "Lightweight Company Mortars"
 mdcw_light_company_mortar_1978_desc: "A light mortar carried by the rifle company itself gives it its own indirect fire instead of waiting for the battalion's guns."
 mdcw_night_vision_goggles_1972: "Night Vision Goggles"
 mdcw_night_vision_goggles_1972_desc: "Head-mounted goggles free both hands, so soldiers can move, drive and fight at night instead of only watching through a weapon sight."
 mdcw_thermal_sights_1980: "Thermal Imaging Sights"
 mdcw_thermal_sights_1980_desc: "Thermal sights see body heat instead of amplifying starlight, so they work in total darkness and through smoke and camouflage."
 mdcw_unconventional_warfare_1952: "Unconventional Warfare Groups"
 mdcw_unconventional_warfare_1952_desc: "Small teams are trained to organise, arm and lead guerrillas behind enemy lines if the country is overrun."
 mdcw_military_free_fall_1970: "Military Free-Fall Insertion"
 mdcw_military_free_fall_1970_desc: "High-altitude, low-opening parachute jumps let small teams leave the aircraft far above the reach of enemy guns and glide in unseen."
 mdcw_counter_terrorist_units_1977: "Counter-Terrorist Units"
 mdcw_counter_terrorist_units_1977_desc: "Small, permanently ready units are trained to storm buildings, aircraft and trains and free hostages with minimal loss of life."
 mdcw_special_operations_command_1987: "Special Operations Command"
 mdcw_special_operations_command_1987_desc: "One joint command with its own budget directs the special forces of all services, ending the friction between separate chains of command."
 mdcw_portable_radios_1943: "Man-Portable Radios"
 mdcw_portable_radios_1943_desc: "Backpack radios bring voice command down to company and platoon, so small units can call for fire and react without runners."
 mdcw_secure_voice_1968: "Tactical Secure Voice"
 mdcw_secure_voice_1968_desc: "Voice encryption fitted to field radios stops the enemy from simply listening in on tactical orders."
 mdcw_tactical_data_systems_1978: "Tactical Data Systems"
 mdcw_tactical_data_systems_1978_desc: "Battlefield computers link observers, fire direction centres and headquarters, so targets are passed and fire plans built in minutes."
 mdcw_frequency_hopping_radios_1988: "Frequency-Hopping Radios"
 mdcw_frequency_hopping_radios_1988_desc: "Radios that jump between frequencies many times a second are hard to jam and hard to locate, so units keep talking under electronic attack."
 mdcw_recon_drones_1975: "Tactical Reconnaissance Drones"
 mdcw_recon_drones_1975_desc: "Small unmanned aircraft photograph the enemy's rear areas without risking a pilot."
 mdcw_battlefield_surveillance_drones_1981: "Battlefield Surveillance Drones"
 mdcw_battlefield_surveillance_drones_1981_desc: "A new generation of drones loiters over the front with turret-mounted cameras and finds targets for guns and aircraft in real time."
 mdcw_combat_engineer_vehicles_1968: "Combat Engineer Vehicles"
 mdcw_combat_engineer_vehicles_1968_desc: "Tank-based engineer vehicles with a dozer blade and a demolition gun clear bunkers, roadblocks and walls under fire."
 mdcw_assault_rifles_1943: "Intermediate-Cartridge Assault Rifles"
 mdcw_assault_rifles_1943_desc: "Assault rifles fire a shorter intermediate cartridge, so every soldier carries a light automatic weapon and more ammunition. Volume of fire comes before range."
 mdcw_battle_rifles_1954: "Full-Power Battle Rifles"
 mdcw_battle_rifles_1954_desc: "Battle rifles keep the full-power cartridge of the machine guns. Range and penetration come before volume of fire."
 mdcw_disruptive_camouflage_1943: "Disruptive Pattern Uniforms"
 mdcw_disruptive_camouflage_1943_desc: "Printed patterns break up the outline of the soldier instead of a plain uniform colour."
 mdcw_nylon_armour_vests_1952: "Nylon Armour Vests"
 mdcw_nylon_armour_vests_1952_desc: "Ballistic nylon vests, issued to infantry rather than only to aircrew, stop many shell and grenade fragments."
 mdcw_helicopter_medevac_1962: "Helicopter Medical Evacuation"
 mdcw_helicopter_medevac_1962_desc: "Helicopters fly the wounded from the battlefield straight to a surgical hospital, often within the hour, and many who would have died survive."
 mdcw_kevlar_helmets_1983: "Kevlar Combat Helmets"
 mdcw_kevlar_helmets_1983_desc: "Aramid helmets replace the steel helmet and stop far more fragments for the same weight."
