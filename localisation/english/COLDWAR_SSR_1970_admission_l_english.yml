l_english:
 # IMPERIA COLD WAR - admission of a new Union Republic (tools/playtest1_postfix/open_hooks_1970.py)
 COLDWAR_SSR_admit_union_republic: "Admit [FROM.GetNameDef] as a Union Republic"
 COLDWAR_SSR_admit_union_republic_desc: "[FROM.GetLeader] has spoken of an ever closer union with the Soviet people. We can propose that [FROM.GetNameDef] joins the Union as a republic of its own. The answer is theirs."
 COLDWAR_SSR_ADM.1.t: "Moscow Proposes Union"
 COLDWAR_SSR_ADM.1.d: "The Soviet ambassador has delivered a letter from the Central Committee: [FROM.GetNameDef] invites us to join the Union of Soviet Socialist Republics as a Union Republic. Zhivkov raised the idea for Bulgaria in 1963 and again in 1973; Moscow never took him up on it. This time the offer comes from the Kremlin itself. Our party would keep its republic, its flag and its seat in the Supreme Soviet, and Moscow would decide everything else."
 COLDWAR_SSR_ADM.1.a: "We join the Union."
 COLDWAR_SSR_ADM.1.b: "We remain a sovereign socialist state."
 COLDWAR_SSR_ADM.2.t: "A New Union Republic"
 COLDWAR_SSR_ADM.2.d: "[FROM.GetNameDefCap] has accepted our proposal. The Supreme Soviet will admit it as a Union Republic at its next session."
 COLDWAR_SSR_ADM.2.a: "Welcome to the fraternal family."
 COLDWAR_SSR_ADM.3.t: "Our Proposal Declined"
 COLDWAR_SSR_ADM.3.d: "[FROM.GetNameDefCap] thanks the Central Committee for its trust and prefers to remain a sovereign socialist state."
 COLDWAR_SSR_ADM.3.a: "Their loss."
