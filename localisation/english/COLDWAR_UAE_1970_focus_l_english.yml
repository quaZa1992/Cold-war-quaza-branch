l_english:
# IMPERIA CW — Cold War: UAE 1970 focus — English localisation.
 COLDWAR_UAE_founders_consented_tt:0 "The founders have accepted a federal settlement"
 COLDWAR_UAE_guarantees_agreed_tt:0 "The settlement protects emirate guarantees"
 COLDWAR_UAE_mandate_agreed_tt:0 "The settlement grants a stronger federal mandate"
 COLDWAR_UAE_federation_established_tt:0 "The sovereign federation has been established"
 COLDWAR_UAE_protection_accepted_tt:0 "A renewed British protection compact is in force"
 COLDWAR_UAE_friendship_accepted_tt:0 "Britain has accepted an independent friendship treaty"
 COLDWAR_UAE_islah_organised_tt:0 "The educational association has been legally recognised"
 COLDWAR_UAE_association_law_tt:0 "Legalises Al Islah within the existing party system."
 COLDWAR_UAE_party_competition_tt:0 "Legalises political parties within the existing electoral system."
 COLDWAR_UAE_completed_industry_tt:0 "Dubai has at least §Y1§! completed civilian factory"
 COLDWAR_UAE_shortcut_union:0 "Federation & British withdrawal"
 COLDWAR_UAE_council:0 "A Coast in Transition"
 COLDWAR_UAE_council_desc:0 "British protection has ended, leaving the rulers responsible for the coast's external affairs and defence. Their separate courts and administrations must now decide how much authority to entrust to a common government."
 COLDWAR_UAE_development_fund:0 "The Development Fund"
 COLDWAR_UAE_development_fund_desc:0 "The smaller emirates need roads, public services and dependable development finance. A common fund can direct projects towards settlements with the greatest needs and strengthen confidence in the union. Planning and supervising those works will require a continuing federal administration."
 COLDWAR_UAE_seven_emirates:0 "A Trucial Federation"
 COLDWAR_UAE_seven_emirates_desc:0 "An agreement among the Trucial rulers offers a more manageable union, while Bahrain and Qatar pursue their own futures."
 COLDWAR_UAE_nine_states:0 "Keep Nine at the Table"
 COLDWAR_UAE_nine_states_desc:0 "Bahrain and Qatar remain possible partners. Representation, the capital and their rulers’ sovereignty must be settled through agreement."
 COLDWAR_UAE_tt_imp_investment_in_extra:0 "$imp_investment_in_extra$: $RIGHT|+=0$"
 COLDWAR_UAE_charter:0 "The Provisional Charter"
 COLDWAR_UAE_charter_desc:0 "The rulers can ratify a provisional constitutional framework for common institutions. The settlement must define the responsibilities of the federation and the authority retained by each emirate. Its implementation will follow the division of powers agreed by the rulers."
 COLDWAR_UAE_dual_veto:0 "Emirate Guarantees"
 COLDWAR_UAE_dual_veto_desc:0 "All viable federal charters need common ministries and recognise the leading emirates. Prioritising entrenched emirate guarantees follows the historical bargain, while keeping federal coordination expensive."
 COLDWAR_UAE_federal_ministries:0 "A Stronger Mandate"
 COLDWAR_UAE_federal_ministries_desc:0 "Ministries already belong in the charter. A stronger federal mandate asks the rulers to delegate more authority than in the historical bargain, in exchange for clear limits and shared development."
 COLDWAR_UAE_sovereign_union:0 "British Withdrawal"
 COLDWAR_UAE_sovereign_union_desc:0 "The end of Britain's special treaty responsibilities leaves the coast to conduct its own foreign affairs and defence. The rulers can put their agreed constitutional settlement into effect and prepare to proclaim their union."
 COLDWAR_UAE_unlock_proclamation_tt:0 "Unlocks §Y$COLDWAR_UAE_proclaim_federation$§!."
 COLDWAR_UAE_proclaim_federation:0 "Proclaim the Union"
 COLDWAR_UAE_proclaim_federation_desc:0 "The rulers have agreed how their emirates will share authority, and British protection has ended. Proclaiming the United Arab Emirates gives the settlement a common name and establishes its federal offices. A federation must now reconcile the interests of the ruling houses with the responsibilities of an independent state."
 COLDWAR_UAE_rak_accession:0 "The Seventh Emirate"
 COLDWAR_UAE_rak_accession_desc:0 "Ras Al Khaimah's security concerns and claims to the Tunbs have complicated its place in the union. A settlement that recognises those concerns can bring its ruler and institutions into the federal bargain."
 COLDWAR_UAE_federal_council:0 "A National Council"
 COLDWAR_UAE_federal_council_desc:0 "A consultative federal council can give the emirates a forum for public affairs while the rulers retain their constitutional authority. Recognising educational and civic associations under federal law gives their activities an accountable framework. Consultations and supervision require trained officials and a continuing federal administration."
 COLDWAR_UAE_dirham:0 "A Common Currency"
 COLDWAR_UAE_dirham_desc:0 "Abu Dhabi uses the Bahraini dinar while the other emirates use the Qatar-Dubai riyal. A currency board and common dirham can simplify federal accounts and trade, provided the new monetary institutions earn confidence across the union."
 COLDWAR_UAE_constitutional_competition:0 "Political Competition"
 COLDWAR_UAE_constitutional_competition_desc:0 "The consultative council has given public affairs a federal forum. A further constitutional reform can open legal political competition and regular elections. The electorate will determine the governing coalition, while the ruling houses must accept a more uncertain political settlement."
 COLDWAR_UAE_shortcut_monarchy:0 "The ruling-house bargain"
 COLDWAR_UAE_majlis:0 "The Rulers’ Majlis"
 COLDWAR_UAE_majlis_desc:0 "The dynasty can turn personal access to the rulers into a durable federal bargain. Listening to local notables takes time and resources. Maintaining the rulers' confidence and clear lines of responsibility can help the union withstand a local succession crisis."
 COLDWAR_UAE_zayed_compact:0 "Zayed’s Solidarity"
 COLDWAR_UAE_zayed_compact_desc:0 "Abu Dhabi can spread oil-financed development beyond its own borders and make union valuable to the poorer emirates."
 COLDWAR_UAE_rashid_compact:0 "Rashid’s Enterprise"
 COLDWAR_UAE_rashid_compact_desc:0 "Dubai’s commercial institutions need room to operate. A bargain with its merchants attracts business while narrowing federal discretion."
 COLDWAR_UAE_rulers_compact:0 "Renew the Compact"
 COLDWAR_UAE_rulers_compact_desc:0 "Renewing the federal compact requires an agreed cabinet and a workable division of responsibilities between Abu Dhabi and Dubai. A Dubai-led ministry can strengthen confidence in the federal administration while the presidency remains a separate office."
 COLDWAR_UAE_gradual_union:0 "An Agreed Union"
 COLDWAR_UAE_gradual_union_desc:0 "Joint procurement and shared institutions can expand without abolishing the ruling houses. Consensus remains a real constraint."
 COLDWAR_UAE_presidential_union:0 "Executive Authority"
 COLDWAR_UAE_presidential_union_desc:0 "The rulers can delegate clearer executive responsibilities to the presidency while maintaining their constitutional role. A stronger federal executive can carry decisions into effect more consistently, although emirates accustomed to managing their own affairs will resist the concentration of authority."
 COLDWAR_UAE_civil_list:0 "A Federal Civil List"
 COLDWAR_UAE_civil_list_desc:0 "Clear obligations between court and ministry make the ruler’s promise more credible, at the price of maintaining a permanent federal apparatus."
 COLDWAR_UAE_succession_compact:0 "Continuity by Consent"
 COLDWAR_UAE_succession_compact_desc:0 "A succession understood by the rulers protects the federation from becoming a contest over the whole state whenever one court changes hands."
 COLDWAR_UAE_shortcut_constitutional:0 "Constitutional government · ALT"
 COLDWAR_UAE_constitutional_forum:0 "An Open Federal Forum"
 COLDWAR_UAE_constitutional_forum_desc:0 "A governing constitutional coalition can begin opening the institutions that the founding charter left under the rulers’ supervision."
 COLDWAR_UAE_constitutional_crown:0 "A Crown under Law"
 COLDWAR_UAE_constitutional_crown_desc:0 "The ruling houses can remain constitutional partners while a responsible cabinet directs ordinary administration. A clear division between court and ministry offers continuity, but limits the government's freedom to act alone."
 COLDWAR_UAE_citizen_republic:0 "A Citizen Republic"
 COLDWAR_UAE_citizen_republic_desc:0 "A republican constitution can place federal authority in elected institutions. Civil guarantees and a professional administration can give the new government a dependable foundation, while the displacement of hereditary authority will unsettle established loyalties."
 COLDWAR_UAE_public_accounts:0 "Public Accounts"
 COLDWAR_UAE_public_accounts_desc:0 "Published federal accounts allow deputies and merchants to judge how the new government uses public money."
 COLDWAR_UAE_citizen_ballot:0 "Citizen Preference"
 COLDWAR_UAE_citizen_ballot_desc:0 "Citizens need a durable stake in the new constitutional order. Reserving a larger share of employment and residency opportunities for them can strengthen support for reform while reducing the labour available to the trading cities."
 COLDWAR_UAE_municipal_compact:0 "A Resident Compact"
 COLDWAR_UAE_municipal_compact_desc:0 "Long-term residents have helped build the coast's commercial economy. More secure residency and advisory municipal participation can sustain that contribution, while placing wider obligations on local government."
 COLDWAR_UAE_independent_courts:0 "Independent Courts"
 COLDWAR_UAE_independent_courts_desc:0 "Commercial and administrative courts need trained judges and enforceable jurisdiction if constitutional promises are to change everyday government."
 COLDWAR_UAE_responsible_cabinet:0 "A Responsible Cabinet"
 COLDWAR_UAE_responsible_cabinet_desc:0 "Parliamentary oversight can outlive the first reforming cabinet if ministries accept regular scrutiny and an orderly transfer of office."
 COLDWAR_UAE_shortcut_arab:0 "Arab nationalist republic · ALT"
 COLDWAR_UAE_arab_awakening:0 "The Arab Awakening"
 COLDWAR_UAE_arab_awakening_desc:0 "Arab nationalist ideas reached the coast through teachers, broadcasting and regional politics. A republican government would have to build institutions beyond those networks."
 COLDWAR_UAE_civilian_arabism:0 "A Civic Arabism"
 COLDWAR_UAE_civilian_arabism_desc:0 "Teachers and civil administrators can define the republic through Arab public education and shared institutions rather than permanent military supervision."
 COLDWAR_UAE_officers_republic:0 "The Officers’ Council"
 COLDWAR_UAE_officers_republic_desc:0 "A national command can provide discipline in a fragile republic. Its privileges impose a continuing cost and limit civilian authority."
 COLDWAR_UAE_republican_service:0 "A National Service"
 COLDWAR_UAE_republican_service_desc:0 "A republic will inherit the rival offices and limited trained personnel of the ruling courts. A professional civil service can bring those administrations together, but its officials must be recruited, trained and paid."
 COLDWAR_UAE_arab_solidarity:0 "Arab Solidarity"
 COLDWAR_UAE_arab_solidarity_desc:0 "A regional development compact offers teachers, training and a stronger Arab voice. Partners must agree to the obligations and retain their sovereignty."
 COLDWAR_UAE_tt_imp_sanction_resistance:0 "$imp_sanction_resistance$: $RIGHT|+=%1$"
 COLDWAR_UAE_sovereign_republic:0 "Our Own Republic"
 COLDWAR_UAE_sovereign_republic_desc:0 "Commercial independence can keep the republic from becoming a client of a larger Arab state, but it leaves defence more dependent on local resources."
 COLDWAR_UAE_public_industry:0 "A Public Industry"
 COLDWAR_UAE_public_industry_desc:0 "A modest public industrial sector can broaden an economy built around oil receipts and commerce. The state will have to provide reliable power, skilled workers and sustained capital before new factories can meet that promise."
 COLDWAR_UAE_republican_charter:0 "A Republican Charter"
 COLDWAR_UAE_republican_charter_desc:0 "A settled division between cabinet, command and local government gives the republic a chance to survive its founders."
 COLDWAR_UAE_shortcut_left:0 "The social republic · ALT"
 COLDWAR_UAE_social_compact:0 "A Social Compact"
 COLDWAR_UAE_social_compact_desc:0 "A left-led government must reconcile national sovereignty with an economy sustained by oil, merchants and a large expatriate workforce."
 COLDWAR_UAE_social_ownership:0 "Public Ownership"
 COLDWAR_UAE_social_ownership_desc:0 "A communist cabinet can direct key enterprises toward a national plan, accepting the loss of private commercial initiative."
 COLDWAR_UAE_social_market:0 "A Social Market"
 COLDWAR_UAE_social_market_desc:0 "A non-aligned social government can leave the trading economy open while purchasing public services from its revenue."
 COLDWAR_UAE_labour_code:0 "A Labour Code"
 COLDWAR_UAE_labour_code_desc:0 "Enforceable contracts and inspections can improve migrant workers’ bargaining position. Enforcement creates costs for employers and the state."
 COLDWAR_UAE_universal_services:0 "Universal Services"
 COLDWAR_UAE_universal_services_desc:0 "Residence-based access to basic services supports a stable workforce while greatly expanding the obligation of the small public administration."
 COLDWAR_UAE_citizen_dividend:0 "A Citizens’ Dividend"
 COLDWAR_UAE_citizen_dividend_desc:0 "Concentrating social entitlements on citizens builds a national constituency for reform, but leaves unequal access to public services."
 COLDWAR_UAE_technical_cadres:0 "Technical Cadres"
 COLDWAR_UAE_technical_cadres_desc:0 "Scholarships and technical institutes can supply planners and engineers without treating foreign advisers as a permanent substitute for local expertise."
 COLDWAR_UAE_social_charter:0 "The Social Charter"
 COLDWAR_UAE_social_charter_desc:0 "A durable social settlement needs rules for funding, residency and public control that can survive more than one cabinet."
 COLDWAR_UAE_shortcut_islah:0 "Sunni social reform · ALT"
 COLDWAR_UAE_social_associations:0 "Associations of Reform"
 COLDWAR_UAE_social_associations_desc:0 "Sunni educational and charitable associations provide the reform movement with trusted local networks. Bringing those networks into government requires a settlement with merchants, the ruling families and institutions outside the movement."
 COLDWAR_UAE_charitable_network:0 "A Charitable Network"
 COLDWAR_UAE_charitable_network_desc:0 "Local charities can extend assistance through trusted institutions, while unequal provision makes federal oversight harder."
 COLDWAR_UAE_public_welfare:0 "Public Welfare"
 COLDWAR_UAE_public_welfare_desc:0 "A common welfare administration gives reformers a national instrument but requires a larger and more expensive public service."
 COLDWAR_UAE_reform_education:0 "Faith and Education"
 COLDWAR_UAE_reform_education_desc:0 "The coast needs professional skills as well as religious education. Reformers must decide how schools and training institutions can serve both purposes, and how much independence their teachers and associations retain."
 COLDWAR_UAE_consultative_reform:0 "Consultative Reform"
 COLDWAR_UAE_consultative_reform_desc:0 "A consultative civic pact preserves room for merchants and other associations, reducing the reform movement’s freedom to govern alone."
 COLDWAR_UAE_clerical_supervision:0 "Clerical Supervision"
 COLDWAR_UAE_clerical_supervision_desc:0 "A stronger religious council can unify social policy while deterring some outside business and political cooperation."
 COLDWAR_UAE_shortcut_oil:0 "Oil, sovereignty & savings"
 COLDWAR_UAE_concession_review:0 "Review the Concessions"
 COLDWAR_UAE_concession_review_desc:0 "Oil has made Abu Dhabi’s development possible, but contractual terms, technical expertise and ownership remain matters of negotiation."
 COLDWAR_UAE_oil_accounts:0 "Develop the Fields"
 COLDWAR_UAE_oil_accounts_desc:0 "Existing oil reserves need producing wells, gathering lines and trained crews before they can support the emirates’ ambitions. The first major capital programme expands Abu Dhabi’s modest operating capacity. Expanding oil operations draws labour and commerce towards the new industry, reducing the traditional coastal trades' contribution to household income."
 COLDWAR_UAE_state_participation:0 "Buy a Larger Share"
 COLDWAR_UAE_state_participation_desc:0 "A larger public equity share can bring more of the concession's income under the producing emirate's control. Foreign operators can remain technical partners, while the emirate assumes a greater share of the investment and operating risks."
 COLDWAR_UAE_partner_expertise:0 "Service Guarantees"
 COLDWAR_UAE_partner_expertise_desc:0 "Reliable technical services and experienced management are valuable to a small producing state. Stronger guarantees can secure that expertise, but leave a larger commercial margin with the partners and tie local operations more closely to them."
 COLDWAR_UAE_onshore_expansion:0 "Expand Onshore Output"
 COLDWAR_UAE_onshore_expansion_desc:0 "A second onshore programme extends producing fields and their pipelines. Its cost competes directly with schools, ports and the public budget, while the resulting receipts remain exposed to world oil prices. Expanding oil operations draws labour and commerce towards the new industry, reducing the traditional coastal trades' contribution to household income."
 COLDWAR_UAE_offshore_expansion:0 "Develop Offshore Oil"
 COLDWAR_UAE_offshore_expansion_desc:0 "Offshore production requires platforms, subsea connections and marine support. Abu Dhabi and Dubai can both expand, but the programme commits a much larger sum than the first onshore wells. Expanding oil operations draws labour and commerce towards the new industry, reducing the traditional coastal trades' contribution to household income."
 COLDWAR_UAE_offshore_second_phase:0 "Offshore Phase Two"
 COLDWAR_UAE_offshore_second_phase_desc:0 "Further offshore expansion requires additional platforms, connections and marine support. Building on the first programme can raise operating capacity, but commits substantial capital that other parts of the federation also need. As the oil economy grows, crews and merchants find new work and the traditional coastal trades account for less of household income."
 COLDWAR_UAE_oil_institutions:0 "An Oil Administration"
 COLDWAR_UAE_oil_institutions_desc:0 "Professional administration can make the producing emirates’ oil arrangements more predictable while maintaining their separate ownership."
 COLDWAR_UAE_adia_savings:0 "Save the Windfall"
 COLDWAR_UAE_adia_savings_desc:0 "Abu Dhabi can turn exceptional oil receipts into a reserve and a professionally managed investment portfolio. Saving part of the windfall offers protection against future shocks while reducing the resources available for immediate development."
 COLDWAR_UAE_domestic_windfall:0 "Spend on Development"
 COLDWAR_UAE_domestic_windfall_desc:0 "Using the windfall at home can accelerate physical development, while leaving fewer reserves for a downturn."
 COLDWAR_UAE_oil_shock_plan:0 "Prepare for a Downturn"
 COLDWAR_UAE_oil_shock_plan_desc:0 "Public plans must remain affordable when the oil market turns. Reserves can support the budget; diversified earnings can reduce its dependence on exports. Budget reserves and clear spending priorities can protect essential administration when oil prices fall."
 COLDWAR_UAE_shortcut_commerce:0 "Dubai & the trading coast"
 COLDWAR_UAE_trading_coast:0 "Pearls and Fishing"
 COLDWAR_UAE_trading_coast_desc:0 "Long before oil exports, pearl divers, fishermen, boatbuilders and merchants earned their living along the coast. The great pearling seasons have faded, but fishing boats and dhow trading networks still sustain families. Better boats, handling and local markets can provide steadier livelihoods and reduce reliance on public assistance, even as the oil industry competes for crews and capital."
 COLDWAR_UAE_port_planning:0 "Fishing Harbours"
 COLDWAR_UAE_port_planning_desc:0 "Reliable landing grounds, ice stores and fish markets can reduce spoilage and give crews a steadier return for their catch. A more secure household income eases demand for assistance. The works will also serve coastal traders, although administration and refrigeration bring continuing costs and oil development draws activity towards new industries."
 COLDWAR_UAE_free_zone:0 "A Free Zone"
 COLDWAR_UAE_free_zone_desc:0 "A separate commercial zone can attract foreign firms with predictable rules while surrendering part of the local tax take."
 COLDWAR_UAE_national_merchants:0 "Back Local Merchants"
 COLDWAR_UAE_national_merchants_desc:0 "Credit and contracts reserved for established local businesses can deepen national ownership, while limiting the scale of foreign participation."
 COLDWAR_UAE_logistics_corridor:0 "A Logistics Corridor"
 COLDWAR_UAE_logistics_corridor_desc:0 "Efficient customs and reliable connections matter as much as quays. The free zone needs a functioning transport economy around it."
 COLDWAR_UAE_merchant_credit:0 "Merchant Credit"
 COLDWAR_UAE_merchant_credit_desc:0 "A more disciplined local credit system can finance trade while requiring the public authorities to scrutinise business risk."
 COLDWAR_UAE_commercial_courts:0 "Commercial Courts"
 COLDWAR_UAE_commercial_courts_desc:0 "Reliable contracts can link Dubai’s ambitions to a wider federation while preserving the emirates’ distinct commercial jurisdictions."
 COLDWAR_UAE_aviation_hub:0 "An Aviation Hub"
 COLDWAR_UAE_aviation_hub_desc:0 "Dubai's commercial air links need a larger airport, reliable ground services and connections to the port economy. A new runway and supporting facilities can bring passengers and high-value cargo to the coast, but their construction and operation require substantial funding and electricity."
 COLDWAR_UAE_industrial_port:0 "An Industrial Port"
 COLDWAR_UAE_industrial_port_desc:0 "Dubai's ports can support more than the movement of imported goods. Serviced industrial land, workshops and reliable utilities will give manufacturers a foothold beside the harbour, at the cost of a major capital commitment and greater demand for power and labour."
 COLDWAR_UAE_beyond_oil:0 "Earnings beyond Oil"
 COLDWAR_UAE_beyond_oil_desc:0 "Services and industry can provide earnings beyond the producing fields. A broader economy will be better placed to absorb a fall in oil receipts, although its firms will remain exposed to regional insecurity and world markets."
 COLDWAR_UAE_jebel_ali_smelter:0 "The Jebel Ali Smelter"
 COLDWAR_UAE_jebel_ali_smelter_desc:0 "Oil and gas revenues can finance an aluminium industry at Jebel Ali, turning imported alumina into metal for export. The smelter needs dependable electricity, cooling water, specialised equipment and trained crews. Its success would create a new industrial export, while tying a substantial part of the coast's power supply to continuous operation."
 COLDWAR_UAE_steel_rolling_mills:0 "Steel Rolling Mills"
 COLDWAR_UAE_steel_rolling_mills_desc:0 "Construction across the emirates consumes steel brought through their ports. A state-backed rolling industry in Abu Dhabi can process imported billets and scrap into a domestic supply of finished steel. This accelerated industrial programme requires machinery, power and long-term working capital before it can compete with established foreign suppliers."
 COLDWAR_UAE_shortcut_society:0 "Citizens, skills & public services"
 COLDWAR_UAE_schools_clinics:0 "Schools and Clinics"
 COLDWAR_UAE_schools_clinics_desc:0 "Many settlements still rely on a small number of teachers, medical staff and visiting services. District clinics, maternity care and new classrooms can help children survive and families remain in the towns. Keeping those services staffed will require a lasting commitment to health and education budgets."
 COLDWAR_UAE_national_training:0 "Train Citizens"
 COLDWAR_UAE_national_training_desc:0 "Training nationals takes time but can reduce dependence on imported expertise and support a locally staffed administration."
 COLDWAR_UAE_foreign_specialists:0 "Invite Specialists"
 COLDWAR_UAE_foreign_specialists_desc:0 "International recruitment can relieve immediate shortages while increasing housing demand and the reliance on a mobile expatriate population."
 COLDWAR_UAE_water_network:0 "Water for the Towns"
 COLDWAR_UAE_water_network_desc:0 "Growing settlements cannot depend indefinitely on wells and irregular deliveries. Desalination, distribution pipes and sanitation can make larger towns viable and reduce disease, but the pumps and treatment works will consume power even when oil revenues fall."
 COLDWAR_UAE_citizen_housing:0 "Homes for Citizens"
 COLDWAR_UAE_citizen_housing_desc:0 "Serviced neighbourhoods give citizen families room to grow without abandoning their ties to the emirates. Housing, schools and local facilities can strengthen the founding social bargain, while creating permanent obligations for the public budget."
 COLDWAR_UAE_worker_towns:0 "Housing the Workforce"
 COLDWAR_UAE_worker_towns_desc:0 "The ports, building sites and industries depend on workers arriving from abroad. Permanent housing, clean water and clinics can turn crowded work camps into viable communities and sustain a much larger resident population. The emirates must fund the resulting health services and social infrastructure."
 COLDWAR_UAE_technical_institutes:0 "Technical Institutes"
 COLDWAR_UAE_technical_institutes_desc:0 "Universities and technical institutes can supply the skills a growing federation needs. Laboratories and teachers must be maintained after the opening ceremony."
 COLDWAR_UAE_efficient_services:0 "Services That Endure"
 COLDWAR_UAE_efficient_services_desc:0 "A growing population needs reliable district health services, trained staff and an administration able to maintain them. Professional management can keep those institutions effective as the towns expand, although continuing care will remain a permanent public expense."
 COLDWAR_UAE_shortcut_defence:0 "A small state’s defence"
 COLDWAR_UAE_security_handover:0 "The Security Handover"
 COLDWAR_UAE_security_handover_desc:0 "The end of British protection leaves a small population and distinct emirate forces facing powerful neighbours. Coordination matters before prestige purchases."
 COLDWAR_UAE_force_register:0 "One Force Register"
 COLDWAR_UAE_force_register_desc:0 "A common register of personnel, stores and contracts is the first step toward a force that the federation can actually sustain."
 COLDWAR_UAE_union_command:0 "A Union Command"
 COLDWAR_UAE_union_command_desc:0 "A shared chain of command can improve readiness, at the price of a larger standing federal organisation."
 COLDWAR_UAE_emirate_commands:0 "Coordinated Commands"
 COLDWAR_UAE_emirate_commands_desc:0 "The emirates can retain local commands while standardising procedures. This protects autonomy but preserves duplication in personnel and administration."
 COLDWAR_UAE_shared_logistics:0 "Shared Logistics"
 COLDWAR_UAE_shared_logistics_desc:0 "Compatible depots, transport and communications can make a common command effective across the emirates. Reliable support reduces waste in the field, but requires trained personnel and continuing expenditure at home."
 COLDWAR_UAE_common_standards:0 "Common Standards"
 COLDWAR_UAE_common_standards_desc:0 "Standard equipment and training can make autonomous forces cooperate, even while their commanders remain answerable to different rulers."
 COLDWAR_UAE_defence_staff:0 "A Defence Staff"
 COLDWAR_UAE_defence_staff_desc:0 "A permanent staff can translate the federation’s limited resources into realistic operational plans."
 COLDWAR_UAE_air_coastal_shield:0 "An Air-Coastal Shield"
 COLDWAR_UAE_air_coastal_shield_desc:0 "Surveillance, air defence and maritime training address the coast’s vulnerabilities with a small professional force. Imported systems bring costs and external dependence."
 COLDWAR_UAE_land_deterrent:0 "A Mobile Deterrent"
 COLDWAR_UAE_land_deterrent_desc:0 "A compact mobile land force can protect key routes and facilities, while consuming a larger share of the federation’s scarce personnel."
 COLDWAR_UAE_sustainable_force:0 "A Sustainable Force"
 COLDWAR_UAE_sustainable_force_desc:0 "Maintenance, training and a realistic establishment matter more than a paper arsenal. The federation must be able to operate what it buys."
 COLDWAR_UAE_shortcut_diplomacy:0 "A place in the Gulf"
 COLDWAR_UAE_gulf_diplomacy:0 "Gulf Diplomacy"
 COLDWAR_UAE_gulf_diplomacy_desc:0 "Independence requires a foreign service able to represent the federation and maintain regular contact with its neighbours. Professional diplomats can sustain those relationships and coordinate external policy, while a permanent ministry adds to the administrative budget. An invasion of Kuwait may require financial support, transit arrangements and preparations for a military contribution."
 COLDWAR_UAE_gulf_contacts:0 "Open the Channels"
 COLDWAR_UAE_gulf_contacts_desc:0 "Missions and bilateral contacts allow the federation to work with Britain, Arab neighbours, Iran and both Cold War blocs without automatically joining any of them."
 COLDWAR_UAE_western_security:0 "Western Security Links"
 COLDWAR_UAE_western_security_desc:0 "British and Western advisers can help sustain a professional force while maintaining an expensive reliance on imported equipment."
 COLDWAR_UAE_armed_nonalignment:0 "Armed Non-Alignment"
 COLDWAR_UAE_armed_nonalignment_desc:0 "Buying and trading across blocs can reduce dependence on any single patron, at the price of a more complicated support system."
 COLDWAR_UAE_security_contracts:0 "Training Agreements"
 COLDWAR_UAE_security_contracts_desc:0 "Training agreements can give local personnel access to experienced instructors and established procedures. Their value depends on clear obligations, sustained funding and skills that the federation can retain in its own forces."
 COLDWAR_UAE_technical_exchange:0 "Across the Blocs"
 COLDWAR_UAE_technical_exchange_desc:0 "Technical exchanges can support development while leaving the federation free to pursue its own diplomacy."
 COLDWAR_UAE_gulf_cooperation:0 "Gulf Cooperation"
 COLDWAR_UAE_gulf_cooperation_desc:0 "The Gulf monarchies share interests in consultation, trade and security, alongside disputes over borders and policy. Common standards and regular meetings can deepen cooperation while leaving each member responsible for its own commitments."
 COLDWAR_UAE_islands_arbitration:0 "Seek an Island Accord"
 COLDWAR_UAE_islands_arbitration_desc:0 "Abu Musa’s arrangement and the Tunbs dispute cannot be settled by the same formula. A negotiated accord may preserve trade while limiting immediate ambitions."
 COLDWAR_UAE_islands_claim:0 "Maintain the Claims"
 COLDWAR_UAE_islands_claim_desc:0 "The federation can keep the islands at the centre of its diplomacy while accepting tension with a much stronger neighbour."
 COLDWAR_UAE_gulf_crisis:0 "The Gulf Crisis"
 COLDWAR_UAE_gulf_crisis_desc:0 "An Iraqi invasion of Kuwait would force the federation to weigh coalition support against the risks of exposure. Without that crisis, civil protection remains useful."
 COLDWAR_UAE_kuwait_support:0 "Aid for Kuwait"
 COLDWAR_UAE_kuwait_support_desc:0 "An invasion of Kuwait threatens the security of the Gulf and places its government under exceptional financial pressure. We can offer a contribution to support Kuwait, subject to its government's agreement. This financial commitment is separate from decisions on military access and participation in the war."
 COLDWAR_UAE_kuwait_transit:0 "Offer Transit to Kuwait"
 COLDWAR_UAE_kuwait_transit_desc:0 "Kuwait may need access to the federation's ports and transport links during an invasion. Our government can offer transit arrangements to support its defence, subject to Kuwaiti agreement and the responsibilities of hosting foreign forces."
 COLDWAR_UAE_kuwait_deployment:0 "A Contingent for Kuwait"
 COLDWAR_UAE_kuwait_deployment_desc:0 "A military contribution to Kuwait's defence requires an explicit agreement over access, command and support. We can seek that agreement while retaining responsibility for our own troops and our decision to enter the war."
 COLDWAR_UAE_shortcut_british:0 "British protection & independence"
 COLDWAR_UAE_treaty_coast:0 "The Protected Coast"
 COLDWAR_UAE_treaty_coast_desc:0 "The seven rulers govern their own sheikhdoms, while Britain conducts their external relations and carries defence responsibilities. A common liaison office can make this divided arrangement work more effectively."
 COLDWAR_UAE_renew_protection:0 "Renew the Protection"
 COLDWAR_UAE_renew_protection_desc:0 "Some rulers would prefer continued British protection to facing stronger neighbours alone. London must decide whether it will revise its announced withdrawal policy and accept a renewed compact."
 COLDWAR_UAE_petition_independence:0 "Prepare the Handover"
 COLDWAR_UAE_petition_independence_desc:0 "Britain has announced its withdrawal by the end of 1971. Local officials must organise records, train civil servants and prepare the departments that will assume the coast's new responsibilities. Staffing this work adds administrative expense; the trained civil service will remain after British protection ends."
 COLDWAR_UAE_protected_administration:0 "Shared Administration"
 COLDWAR_UAE_protected_administration_desc:0 "A renewed compact gives the rulers time to strengthen their courts, customs offices and commercial administration. Shared institutions can make the coast easier to govern while Britain retains responsibility for external affairs and defence."
 COLDWAR_UAE_orderly_handover:0 "An Orderly Handover"
 COLDWAR_UAE_orderly_handover_desc:0 "Independence transfers the burden of external affairs and defence to the coast. An orderly handover of responsibilities, stores and training arrangements will help the local administrations carry that burden."
 COLDWAR_UAE_presentation_duration_orderly_handover:0 "Duration: §Y365 days§!"
 COLDWAR_UAE_british_training:0 "British Training Teams"
 COLDWAR_UAE_british_training_desc:0 "Training teams and common equipment standards can strengthen the small local forces. Maintaining the relationship still requires a professional establishment and expenditure."
 COLDWAR_UAE_british_commercial:0 "Commercial Partnership"
 COLDWAR_UAE_british_commercial_desc:0 "Predictable British-linked commercial arrangements can draw firms and expertise to the coast. The rulers must maintain oversight and accept the continuing limits of protection."
 COLDWAR_UAE_british_friendship:0 "A Friendship Treaty"
 COLDWAR_UAE_british_friendship_desc:0 "Independence need not sever the coast's British connections. A new friendship agreement can preserve consultation, technical advice and commercial links on terms accepted by both governments."
 COLDWAR_UAE_enduring_protection:0 "An Enduring Compact"
 COLDWAR_UAE_enduring_protection_desc:0 "A continuing protection arrangement needs funding, reliable local institutions and an understood division of responsibility. It can offer stability and credit while leaving external sovereignty constrained."
