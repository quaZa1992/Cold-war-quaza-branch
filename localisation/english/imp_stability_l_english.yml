l_english:
# IMPERIA CW — Cold War: Imperia stability — English localisation.
 impstability.1.t: "Industrial Strikes Paralyze the Nation"
 impstability.1.d: "Public discontent is growing, and workers across the country have taken to the streets, shutting down factories and disrupting transportation. The lack of adequate responses from the government has only fueled their resolve, and production has ground to a halt in many regions."
 impstability.1.a: "Let them blow off steam."
 impstability.1.b: "Break up the protests."
 impstability.1.c: "Put them back to work."
 imp_stability_idea_1: "Nationwide Protests"
 imp_stability_idea_1_desc: "Nationwide protests are making it impossible to to keep production up."

 impstability.2.t: "Corruption Scandal Shakes the Government"
 impstability.2.d: "A major corruption scandal has erupted, implicating several high-ranking officials within the government. Leaked documents reveal widespread embezzlement of state funds and abuse of power for personal gain. The public is outraged, and opposition parties are seizing the opportunity to call for resignations and new elections. Failure to address the issue could severely undermine the legitimacy of our administration."
 impstability.2.a: "It's not a big deal."
 impstability.2.b: "He has to go."

 impstability.3.t: "Growing Military Discontent"
 impstability.3.d: "Reports from military bases across the country indicate a growing sense of frustration and disillusionment among the troops. Poor living conditions, outdated equipment, and lack of pay have fueled resentment toward the government and high command. Some officers have even started openly criticizing leadership, and there are rumors of possible mutinies if morale is not restored. We must act quickly to address the situation before it escalates."
 impstability.3.a: "There's nothing we can do."
 impstability.3.b: "Replace some officers."

 impstability.4.t: "Streets of Chaos"
 impstability.4.d: "Crime rates have skyrocketed in recent months. Gang violence, theft, and organized crime have become daily occurrences in major cities. Law enforcement is overwhelmed and unable to maintain order. Citizens are losing faith in the government’s ability to protect them, and fear is spreading like wildfire."
 impstability.4.a: "Get more police on the streets."
 impstability.4.b: "There's nothing we can do."
 impstability.4.c: "Deal with them."

 impstability.5.t: "The Streets Are Ablaze"
 impstability.5.d: "Chaos has erupted in cities across the nation as mass protests have turned into violent riots. Frustration and anger have boiled over into looting, arson, and fierce clashes between civilians and law enforcement. Key infrastructure is under threat, and public order is rapidly deteriorating."
 impstability.5.a: "They're just venting."
 impstability.5.b: "Break it up."
 impstability.5.c: "Break. It. Up."

 impstability.6.t: "Fractured Command"
 impstability.6.d: "Reports from the front lines indicate that some divisions are openly refusing to follow orders, citing lack of leadership and distrust of the government. Officers sympathetic to the dissenting troops are stoking resentment, and discipline is rapidly deteriorating. The chain of command is at risk of breaking entirely."
 impstability.6.a: "What can we do?"
 impstability.6.b: "Arrest and discharge troublemakers."
 impstability.6.c: "Shoot troublemakers."
 imp_stability_idea_2: "Fractured Command"
 imp_stability_idea_2_desc: "Problems in our military are making it harder for it to function."

 impstability.7.t: "Administrative Paralysis"
 impstability.7.d: "The government has ground to a halt as officials abandon their posts or are unable to perform their duties. Critical resources are no longer being distributed, and essential services have collapsed. Political power is draining rapidly as local authorities scramble to take control."
 impstability.7.a: "That's not good."

 impstability.8.t: "Leader Under Fire"
 impstability.8.d: "In a shocking attack, a key political figure has been targeted in an assassination attempt. Though the assailant has been apprehended, rumors are swirling about who may have orchestrated the plot. The wounded leader’s fate remains uncertain, and public confidence is wavering."
 impstability.8.a: "What?!"
 impstability.8.b: "Blame some minority."

 impstability.9.t: "Market Meltdown"
 impstability.9.d: "he economy is collapsing under the strain of political instability. Inflation is wiping out savings, businesses are shuttering en masse, and mass layoffs are pushing citizens to the brink of despair. Without swift intervention, the situation may become irreparable."
 impstability.9.a: "Horrible."

 impstability.10.t: "Radicalism on the Rise"
 impstability.10.d: "Our nation's political instability has given rise to radical factions seeking to overthrow the government. Revolutionary ideas are spreading like wildfire, and disillusioned citizens are rallying behind charismatic leaders who promise to end the crisis through drastic change."
 impstability.10.a: "When will our reckoning come?"

 impstability.11.t: "A Fractured Land"
 impstability.11.d: "Once a unified nation, our country has broken apart into a patchwork of factions fighting for control. The dream of a unified nation is in tatters as civil war has become an undeniable reality."
 impstability.11.a: "Our nation will prevail."
 impstability.11.b: "Down with the regime."
