l_english:
 # IMPERIA COLD WAR — Power paths 24.11.2026 (P6): constitutional order and emergency constitution focuses for Sweden.
 COLDWAR_SWE_constitution_debate_democratic_socialist:0 "Debate: A Democratic Socialist Commonwealth"
 COLDWAR_SWE_constitution_debate_democratic_socialist_desc:0 "Open a national debate on a new institutional settlement. The governing coalition must already be eligible. Competitive elections, lawful opposition and independent unions remain protected."
 COLDWAR_SWE_constitution_enact_democratic_socialist:0 "Enact: A Democratic Socialist Commonwealth"
 COLDWAR_SWE_constitution_enact_democratic_socialist_desc:0 "Transform ownership and public provision while retaining competitive elections, independent unions, courts and a lawful opposition. A socialist electoral victory does not authorize a one-party state.\nCoalition partners, independent unions, local authorities and future elections can reject the government's preferred pace."
 COLDWAR_SWE_constitution_debate_independent_communist:0 "Debate: A Swedish Revolutionary State"
 COLDWAR_SWE_constitution_debate_independent_communist_desc:0 "Open a national debate on a new institutional settlement. The governing party must already be eligible. A one-party or emergency state also needs a serious constitutional crisis and brings lasting opposition and administrative costs."
 COLDWAR_SWE_constitution_enact_independent_communist:0 "Enact: A Swedish Revolutionary State"
 COLDWAR_SWE_constitution_enact_independent_communist_desc:0 "An explicitly alternate authoritarian socialist state refuses foreign tutelage. Its central problem is reconciling political monopoly with Swedish expertise, independent labour traditions, local government and an expensive national defence.\nPolitical monopoly creates organised opposition, legal discontinuity and higher administrative demands."
 COLDWAR_SWE_constitution_debate_moscow_communist:0 "Debate: A Swedish State in Socialist Cooperation"
 COLDWAR_SWE_constitution_debate_moscow_communist_desc:0 "Open a national debate on a new institutional settlement. The governing party must already be eligible. A one-party or emergency state also needs a serious constitutional crisis and brings lasting opposition and administrative costs."
 COLDWAR_SWE_constitution_enact_moscow_communist:0 "Enact: A Swedish State in Socialist Cooperation"
 COLDWAR_SWE_constitution_enact_moscow_communist_desc:0 "A counterfactual Soviet-aligned authoritarian government builds its own planned institutions. Moscow cooperation is an actual negotiated relationship, not a magic source of equipment, a renamed VPK victory or an automatic faction switch.\nPolitical monopoly faces domestic opposition; dependence on partner contracts can constrain Sweden's choices."
 COLDWAR_SWE_constitution_debate_maoist:0 "Debate: A Swedish People's Revolutionary Republic"
 COLDWAR_SWE_constitution_debate_maoist_desc:0 "Open a national debate on a new institutional settlement. The governing party must already be eligible. A one-party or emergency state also needs a serious constitutional crisis and brings lasting opposition and administrative costs."
 COLDWAR_SWE_constitution_enact_maoist:0 "Enact: A Swedish People's Revolutionary Republic"
 COLDWAR_SWE_constitution_enact_maoist_desc:0 "A counterfactual anti-revisionist state must govern an advanced industrial society with skilled workers and substantial local institutions. Chinese orientation, a mass-front strategy and national independence are competing policies, not one permanent personality.\nPolitical monopoly, cadre-expert conflict and demands for local consent complicate technical administration."
 COLDWAR_SWE_constitution_debate_corporatist_far_right:0 "Debate: A National Corporatist Party State"
 COLDWAR_SWE_constitution_debate_corporatist_far_right_desc:0 "Open a national debate on a new institutional settlement. The governing party must already be eligible. A one-party or emergency state also needs a serious constitutional crisis and brings lasting opposition and administrative costs."
 COLDWAR_SWE_constitution_enact_corporatist_far_right:0 "Enact: A National Corporatist Party State"
 COLDWAR_SWE_constitution_enact_corporatist_far_right_desc:0 "A highly counterfactual NRP-derived party dictatorship attempts to subordinate labour, business and local institutions. It is a fascist fringe route with a severe domestic legitimacy problem, not a historical mainstream conservative government.\nSuppressed pluralism, organised opposition and political interference undermine trust and technical openness; foreign recognition is not guaranteed."
 COLDWAR_SWE_constitution_debate_security_nationalist:0 "Debate: An Authoritarian National Emergency State"
 COLDWAR_SWE_constitution_debate_security_nationalist_desc:0 "Open a national debate on a new institutional settlement. The governing party must already be eligible. A one-party or emergency state also needs a serious constitutional crisis and brings lasting opposition and administrative costs."
 COLDWAR_SWE_constitution_enact_security_nationalist:0 "Enact: An Authoritarian National Emergency State"
 COLDWAR_SWE_constitution_enact_security_nationalist_desc:0 "A counterfactual right-wing security executive emerges only from an actual severe national crisis and a resolved transfer or seizure of power. It preserves more professional administration than the NRP party-state, but curtails representative control and must decide whether exceptional power ever ends.\nSuspended accountability creates opposition and expensive security and administrative obligations; temporary emergency authority is not a normal electoral mandate."
 COLDWAR_SWE_constitution_security_first_reading:0 "First Reading: A Permanent Security Constitution"
 COLDWAR_SWE_constitution_security_first_reading_desc:0 "Put the proposed constitutional text to the Riksdag. A majority must support it. A real national election must then take place before the final vote."
 COLDWAR_SWE_constitution_security_final_reading:0 "Final Reading: A Permanent Security Constitution"
 COLDWAR_SWE_constitution_security_final_reading_desc:0 "An election has taken place since the first reading. Pass the same text with a parliamentary majority. Existing property, public debt and signed foreign agreements remain in force."
 COLDWAR_SWE_constitution_security_decree:0 "Decree the Security Constitution"
 COLDWAR_SWE_constitution_security_decree_desc:0 "Impose the constitutional change by emergency decree, bypassing an elected mandate. The rupture costs stability and leaves a contested constitutional break for two years."
 COLDWAR_SWE_pp_no_regime_tt:0 "No new constitutional order has been enacted."
 COLDWAR_SWE_pp_pluralist_tt:0 "The communist movement has adopted pluralist organisation."
 COLDWAR_SWE_pp_apk_tt:0 "The APK faction has been formed and leads the government."
 COLDWAR_SWE_pp_kfml_tt:0 "The KFML or a formed KFML(r) faction leads the government."
 COLDWAR_SWE_pp_party_support_tt:0 "The governing party holds more than 35% popular support."
