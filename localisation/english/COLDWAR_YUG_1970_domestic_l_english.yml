 COLDWAR_YUG_1970_aviation_engineering:0 "Expand SOKO Engineering at Mostar"
 COLDWAR_YUG_1970_aviation_engineering_desc:0 "Build on the existing Galeb and Jastreb experience with expanded engineering, testing and suppliers at Mostar. A more ambitious strike aircraft needs a real industrial base."
 COLDWAR_YUG_1970_aviation_engineering_0_gdp:0 "Treasury: -3% of current GDP"
 COLDWAR_YUG_1970_aviation_engineering_2_research:0 "Federal Research Programme"
 COLDWAR_YUG_1970_recover_aviation_engineering:0 "Complete Expand SOKO Engineering at Mostar"
 COLDWAR_YUG_1970_recover_aviation_engineering_desc:0 "Build on the existing Galeb and Jastreb experience with expanded engineering, testing and suppliers at Mostar. A more ambitious strike aircraft needs a real industrial base."
 COLDWAR_YUG_1970_romania:0 "Propose the YUROM Development Agreement"
 COLDWAR_YUG_1970_romania_desc:0 "Offer Romania a funded joint strike-aircraft programme with shared development and domestic production responsibilities. Neither partner can obtain a modern aircraft without completing its real technical work."
 COLDWAR_YUG_1970_imported_aviation_tools:0 "Imported Tooling and Precision Test Benches"
 COLDWAR_YUG_1970_imported_aviation_tools_desc:0 "Allocate the first Yugoslav tooling tranche to imported precision machinery and test benches. Faster initial readiness comes with an enduring dependence on imported servicing."
 COLDWAR_YUG_1970_imported_aviation_tools_0_gdp:0 "Treasury: -2.5% of current GDP"
 COLDWAR_YUG_1970_imported_aviation_tools_2_research:0 "Federal Research Programme"
 COLDWAR_YUG_1970_imported_aviation_tools_3_weekly:0 "Treasury: -0.008% of current GDP per week"
 COLDWAR_YUG_1970_recover_imported_aviation_tools:0 "Complete Imported Tooling and Precision Test Benches"
 COLDWAR_YUG_1970_recover_imported_aviation_tools_desc:0 "Allocate the first Yugoslav tooling tranche to imported precision machinery and test benches. Faster initial readiness comes with an enduring dependence on imported servicing."
 COLDWAR_YUG_1970_domestic_components:0 "Domestic Airframe Components and Suppliers"
 COLDWAR_YUG_1970_domestic_components_desc:0 "Allocate the same tranche to domestic component suppliers serving Mostar. Greater local content requires a larger initial capital commitment and time spent building industrial capacity."
 COLDWAR_YUG_1970_domestic_components_0_gdp:0 "Treasury: -3.5% of current GDP"
 COLDWAR_YUG_1970_domestic_components_4_research:0 "Federal Research Programme"
 COLDWAR_YUG_1970_recover_domestic_components:0 "Complete Domestic Airframe Components and Suppliers"
 COLDWAR_YUG_1970_recover_domestic_components_desc:0 "Allocate the same tranche to domestic component suppliers serving Mostar. Greater local content requires a larger initial capital commitment and time spent building industrial capacity."
 COLDWAR_YUG_1970_flight_test:0 "Authorise the Orao and Vultur Prototype Standard"
 COLDWAR_YUG_1970_flight_test_desc:0 "Offer a common initial prototype standard after both countries have completed the necessary airframe and weapon research. The first standard uses equipment the partners can actually produce."
 COLDWAR_YUG_1970_joint_aviation:0 "Fund the Joint Aviation Series"
 COLDWAR_YUG_1970_joint_aviation_desc:0 "Offer funded series production at Mostar and Craiova, with an initial operational batch for both air forces. Shared standards reduce airframe production costs while both partners pay for technical support and parts."
 COLDWAR_YUG_1970_expanded_aircraft_line:0 "A Second Yugoslav Airframe Tranche"
 COLDWAR_YUG_1970_expanded_aircraft_line_desc:0 "Allocate the next domestic investment tranche to a larger Mostar production line. More assembly capacity carries a continuing support budget and competes with broader component development."
 COLDWAR_YUG_1970_expanded_aircraft_line_0_gdp:0 "Treasury: -3.5% of current GDP"
 COLDWAR_YUG_1970_complete_project_expanded_aircraft_line:0 "Mostar second series tranche"
 COLDWAR_YUG_1970_complete_project_expanded_aircraft_line_desc:0 "Allocate the next domestic investment tranche to a larger Mostar production line. More assembly capacity carries a continuing support budget and competes with broader component development. Funded construction [?COLDWAR_YUG_1970_project_expanded_aircraft_line_paid_days|0] / 365 days."
 COLDWAR_YUG_1970_expanded_aircraft_line_construction_time:0 "Funded construction: 365 days"
 COLDWAR_YUG_1970_expanded_aircraft_line_2_weekly:0 "Treasury: -0.006% of current GDP per week"
 COLDWAR_YUG_1970_recover_expanded_aircraft_line:0 "Complete A Second Yugoslav Airframe Tranche"
 COLDWAR_YUG_1970_recover_expanded_aircraft_line_desc:0 "Allocate the next domestic investment tranche to a larger Mostar production line. More assembly capacity carries a continuing support budget and competes with broader component development."
 COLDWAR_YUG_1970_aviation_supplier_network:0 "A Domestic Precision-Components Network"
 COLDWAR_YUG_1970_aviation_supplier_network_desc:0 "Allocate the same investment tranche to aircraft components and precision suppliers across Bosnia and Slovenia. The industrial base broadens while fewer resources reach final assembly immediately."
 COLDWAR_YUG_1970_aviation_supplier_network_0_gdp:0 "Treasury: -3.5% of current GDP"
 COLDWAR_YUG_1970_aviation_supplier_network_3_research:0 "Federal Research Programme"
 COLDWAR_YUG_1970_recover_aviation_supplier_network:0 "Complete A Domestic Precision-Components Network"
 COLDWAR_YUG_1970_recover_aviation_supplier_network_desc:0 "Allocate the same investment tranche to aircraft components and precision suppliers across Bosnia and Slovenia. The industrial base broadens while fewer resources reach final assembly immediately."
 COLDWAR_YUG_1970_orao_squadrons:0 "Train the First Orao Operational Squadrons"
 COLDWAR_YUG_1970_orao_squadrons_desc:0 "Turn delivered airframes into a trained operational force with exercises, maintained fields and ground support. A series order becomes useful only when crews and support units can sustain it."
 COLDWAR_YUG_1970_orao_squadrons_0_gdp:0 "Treasury: -1.5% of current GDP"
 COLDWAR_YUG_1970_orao_squadrons_3_research:0 "Federal Research Programme"
 COLDWAR_YUG_1970_orao_squadrons_4_weekly:0 "Treasury: -0.006% of current GDP per week"
 COLDWAR_YUG_1970_recover_orao_squadrons:0 "Complete Train the First Orao Operational Squadrons"
 COLDWAR_YUG_1970_recover_orao_squadrons_desc:0 "Turn delivered airframes into a trained operational force with exercises, maintained fields and ground support. A series order becomes useful only when crews and support units can sustain it."
 COLDWAR_YUG_1970_orao_egypt:0 "Offer Egypt a Paid Orao Production Batch"
 COLDWAR_YUG_1970_orao_egypt_desc:0 "A certified domestic strike aircraft offers the aviation industry a valuable export opportunity. A funded Egyptian order for twelve new aircraft would support production while committing Yugoslavia to training, delivery and long-term service."
 COLDWAR_YUG_1970_nonaligned:0 "A Programme of Non-Aligned Economic Cooperation"
 COLDWAR_YUG_1970_nonaligned_desc:0 "Use independent diplomacy to negotiate industrial and commercial agreements on their actual merits. An expanded commercial service can support trade negotiations while depending on a funded diplomatic establishment."
 COLDWAR_YUG_1970_nonaligned_programme_1:0 "A Programme of Non-Aligned Economic Cooperation"
 COLDWAR_YUG_1970_nonaligned_programme_1_desc:0 "Use independent diplomacy to negotiate industrial and commercial agreements on their actual merits. An expanded commercial service can support trade negotiations while depending on a funded diplomatic establishment."
 COLDWAR_YUG_1970_nonaligned_3_weekly:0 "Treasury: -0.002% of current GDP per week"
 COLDWAR_YUG_1970_italy:0 "Offer a Treaty on the Adriatic Frontier"
 COLDWAR_YUG_1970_italy_desc:0 "Negotiate a recognised frontier, minority safeguards and commercial cooperation with Italy. A settlement rests on reciprocal obligations and entails no automatic territorial transfer."
 COLDWAR_YUG_1970_adriatic_follow:0 "Fund the Trieste-Ljubljana Commercial Corridor"
 COLDWAR_YUG_1970_adriatic_follow_desc:0 "Offer joint improvements to commercial transport on both sides of the settled frontier. Each government finances its own works and receives a tangible local investment."
 COLDWAR_YUG_1970_fiat_components:0 "Expand the Existing Fiat-Zastava Supplier Relationship"
 COLDWAR_YUG_1970_fiat_components_desc:0 "Offer a new component and tooling tranche within the established Fiat-Zastava industrial relationship. Yugoslav production gains suppliers while the Italian partner receives paid technical-service work."
 COLDWAR_YUG_1970_germany:0 "Agree Technical Training under the Recruitment Framework"
 COLDWAR_YUG_1970_germany_desc:0 "The recruitment relationship with West Germany gives workers access to experience and wages abroad. Joint technical instruction and recognised qualifications can improve their prospects while requiring both governments to support the programme."
 COLDWAR_YUG_1970_return_skills_deal:0 "Finance Returnee Tooling and German Service Contracts"
 COLDWAR_YUG_1970_return_skills_deal_desc:0 "Returning technicians need machine tools, spare parts and recognised service contracts. A paid German tooling arrangement can equip their workshops while creating continuing foreign-service obligations."
 COLDWAR_YUG_1970_india:0 "Offer India a Merchant Ship Order"
 COLDWAR_YUG_1970_india_desc:0 "Offer a financed order for six merchant ships from the Yugoslav yards. India obtains a real delivery and warranty service; Yugoslavia commits yard investment and accepts the cost of supporting the order."
 COLDWAR_YUG_1970_nam_research:0 "Offer a Fiat-Zastava Assembly Project in India"
 COLDWAR_YUG_1970_nam_research_desc:0 "Offer a phased small-car assembly and component agreement based on the contemporary Fiat-Zastava proposal. It becomes a real project only if India accepts its capital and service commitments."
 COLDWAR_YUG_1970_egypt:0 "Offer Energoprojekt Irrigation Works in Egypt"
 COLDWAR_YUG_1970_egypt_desc:0 "Offer funded irrigation and engineering works drawing on Yugoslav contracting experience. Egypt receives productive agricultural infrastructure; Yugoslavia earns a paid engineering contract and undertakes service obligations."
 COLDWAR_YUG_1970_egypt_tractors:0 "Offer Rakovica-El Nasr Tractor Assembly"
 COLDWAR_YUG_1970_egypt_tractors_desc:0 "Offer Rakovica tractor assembly, parts and servicing with El Nasr and a funded rural machinery programme. Domestic assembly can support Egyptian agriculture while Yugoslav suppliers assume continuing delivery obligations."
 COLDWAR_YUG_1970_soviet_tools:0 "A Soviet Heavy-Industry Procurement Tranche"
 COLDWAR_YUG_1970_soviet_tools_desc:0 "Allocate the next foreign procurement tranche to paid Soviet tooling, technical support and heavy-vehicle engineering. Support improves industrial readiness while creating spares obligations to the supplier."
 COLDWAR_YUG_1970_western_tools:0 "A Western Precision-Industry Procurement Tranche"
 COLDWAR_YUG_1970_western_tools_desc:0 "Allocate the same foreign procurement tranche to paid precision machinery and controlled technical support. The industrial base broadens while imported service and export restrictions remain binding."
 COLDWAR_YUG_1970_danube_uprating:0 "Offer Additional Danube Turbine Uprating"
 COLDWAR_YUG_1970_danube_uprating_desc:0 "Offer additional uprating on both sides of the Danube partnership. This finances new capacity beyond the existing baseline and does not award the same historical plant twice."
 COLDWAR_YUG_1970_krsko_contract:0 "Offer a Westinghouse Commercial Reactor Contract"
 COLDWAR_YUG_1970_krsko_contract_desc:0 "Offer a long-term vendor, fuel and training contract for the agreed Slovenian-Croatian project. Commercial operation follows completed construction and real fuel supply, never the signature alone."
 COLDWAR_YUG_1970_federal_watch:0 "Convene the Federal Crisis Commission"
 COLDWAR_YUG_1970_federal_watch_desc:0 "Bring unresolved constitutional, fiscal and security disputes before a federal commission. A common procedure must identify who can accept a settlement before promising that one has been reached."
 COLDWAR_YUG_1970_fiscal_bridge:0 "A Paid Emergency Budget Bridge"
 COLDWAR_YUG_1970_fiscal_bridge_desc:0 "Finance a temporary contribution settlement while a permanent formula is negotiated. This buys time through paid obligations and cannot sustain an unfunded budget indefinitely."
 COLDWAR_YUG_1970_constitutional_mediation:0 "An Independent Constitutional Mediation Panel"
 COLDWAR_YUG_1970_constitutional_mediation_desc:0 "Allocate the first emergency effort to mediated constitutional guarantees. Political concessions can settle a particular claim while limiting the centre's freedom to act unilaterally."
 COLDWAR_YUG_1970_security_protocol:0 "Negotiate Local Security and Weapons Safeguards"
 COLDWAR_YUG_1970_security_protocol_desc:0 "Rival claims over police, depots and local defence can turn a constitutional dispute into an armed confrontation. Negotiated custody and security arrangements offer a chance to contain the crisis while preserving the authority of every signatory."
 COLDWAR_YUG_1970_federal_renewal:0 "Offer a Renewed Federal Settlement"
 COLDWAR_YUG_1970_federal_renewal_desc:0 "Offer funded common institutions, protected rights and a defined contribution formula. Keeping the federation together requires governments willing to accept its common duties."
 COLDWAR_YUG_1970_federal_renewal_ratified_0_gdp:0 "Treasury: -1% of current GDP"
 COLDWAR_YUG_1970_federal_renewal_ratified_1_weekly:0 "Treasury: -0.006% of current GDP per week"
 COLDWAR_YUG_1970_federal_renewal_standing_terms:0 "Constitutional pressure relief: 0.25 per month."
 COLDWAR_YUG_1970_federal_renewal_ratify:0 "Ratify Offer a Renewed Federal Settlement"
 COLDWAR_YUG_1970_federal_renewal_ratify_desc:0 "Offer funded common institutions, protected rights and a defined contribution formula. Keeping the federation together requires governments willing to accept its common duties."
 COLDWAR_YUG_CONVENTION.20.t:0 "Ratify Offer a Renewed Federal Settlement"
 COLDWAR_YUG_CONVENTION.20.t_desc:0 "Offer funded common institutions, protected rights and a defined contribution formula. Keeping the federation together requires governments willing to accept its common duties."
 COLDWAR_YUG_CONVENTION.20.d:0 "Offer funded common institutions, protected rights and a defined contribution formula. Keeping the federation together requires governments willing to accept its common duties."
 COLDWAR_YUG_CONVENTION.20.a:0 "Ratify the agreement"
 COLDWAR_YUG_CONVENTION.20.b:0 "Return the proposal to the convention"
 COLDWAR_YUG_CONVENTION.20.c:0 "Adjourn the convention"
 COLDWAR_YUG_1970_confederal_offer:0 "Offer a Confederal Negotiation"
 COLDWAR_YUG_1970_confederal_offer_desc:0 "Offer a looser settlement with a common market and limited shared institutions. A confederation needs negotiated powers and cannot simply declare every territorial and minority question solved."
 COLDWAR_YUG_1970_confederal_offer_ratified_programme_1:0 "Offer a Confederal Negotiation"
 COLDWAR_YUG_1970_confederal_offer_ratified_programme_1_desc:0 "Offer a looser settlement with a common market and limited shared institutions. A confederation needs negotiated powers and cannot simply declare every territorial and minority question solved."
 COLDWAR_YUG_1970_confederal_offer_ratified_1_relief_bureaucracy_cost_multiplier_modifier:0 "Federal Bargaining: Bureaucracy cost [?COLDWAR_YUG_1970_visible_relief|%+=.1]"
 COLDWAR_YUG_1970_confederal_offer_standing_terms:0 "Constitutional pressure relief: 0.25 per month."
 COLDWAR_YUG_1970_confederal_offer_ratify:0 "Ratify Offer a Confederal Negotiation"
 COLDWAR_YUG_1970_confederal_offer_ratify_desc:0 "Offer a looser settlement with a common market and limited shared institutions. A confederation needs negotiated powers and cannot simply declare every territorial and minority question solved."
 COLDWAR_YUG_CONVENTION.21.t:0 "Ratify Offer a Confederal Negotiation"
 COLDWAR_YUG_CONVENTION.21.t_desc:0 "Offer a looser settlement with a common market and limited shared institutions. A confederation needs negotiated powers and cannot simply declare every territorial and minority question solved."
 COLDWAR_YUG_CONVENTION.21.d:0 "Offer a looser settlement with a common market and limited shared institutions. A confederation needs negotiated powers and cannot simply declare every territorial and minority question solved."
 COLDWAR_YUG_CONVENTION.21.a:0 "Ratify the agreement"
 COLDWAR_YUG_CONVENTION.21.b:0 "Return the proposal to the convention"
 COLDWAR_YUG_CONVENTION.21.c:0 "Adjourn the convention"
 COLDWAR_YUG_1970_exit_protocol:0 "Prepare a Negotiated Departure Protocol"
 COLDWAR_YUG_1970_exit_protocol_desc:0 "A republic seeking departure raises questions of borders, citizenship, debt and common property. A negotiated protocol can keep those questions at the conference table while minority and security guarantees remain enforceable."
 COLDWAR_YUG_1970_minority_security:0 "Minority Guarantees during Constitutional Change"
 COLDWAR_YUG_1970_minority_security_desc:0 "Finance enforceable minority protections when institutions and borders change. Security guarantees must bind both federal and republican authorities to duties they can perform."
 COLDWAR_YUG_1970_ceasefire_tools:0 "Local Ceasefire and Demobilisation Talks"
 COLDWAR_YUG_1970_ceasefire_tools_desc:0 "Local fighting can outlast the political crisis that began it. Ceasefire talks must address command, custody of arms and withdrawal in terms every belligerent is prepared to honour."
 COLDWAR_YUG_1970_recognised_settlement:0 "Ratify the Accepted Territorial and Security Settlement"
 COLDWAR_YUG_1970_recognised_settlement_desc:0 "A territorial settlement must give the parties reasons to honour its borders and security obligations. Ratification can close named disputes when property, representation and minority guarantees have been accepted."
 COLDWAR_YUG_1970_constitutional_conference:0 "Open the Federal Convention"
 COLDWAR_YUG_1970_constitutional_conference_desc:0 "Bring the division of power, federal contributions and provincial rights before a convention. Its authority must come from institutions willing to defend the final settlement."
 COLDWAR_YUG_1970_krsko_parity_0_gdp:0 "Treasury: -1.5% of current GDP"
 COLDWAR_YUG_1970_krsko_parity_1_research:0 "Federal Research Programme"
 COLDWAR_YUG_1970_krsko_parity:0 "Ratify Equal Participation in the Krsko Project"
 COLDWAR_YUG_1970_krsko_parity_desc:0 "Agree equal Slovenian and Croatian participation in a commercial nuclear project. A vendor contract, technical training, fuel and a long construction programme must follow before electricity can be generated."
 COLDWAR_YUG_1970_spirit_tito_arbitration:0 "Tito's Federal Arbitration"
 COLDWAR_YUG_1970_spirit_tito_arbitration_desc:0 "Titos authority reconciles rival institutions, but it rests on personal leadership and a costly political administration."
 COLDWAR_YUG_1970_spirit_federal_bargaining:0 "Federal Bargaining"
 COLDWAR_YUG_1970_spirit_federal_bargaining_desc:0 "A common state must obtain cooperation from republican institutions with distinct interests and powers."
 COLDWAR_YUG_1970_spirit_self_management:0 "Workers Self-Management"
 COLDWAR_YUG_1970_spirit_self_management_desc:0 "Social ownership and workers councils give production a participatory basis while investment, wages and enterprise coordination remain contested."
 COLDWAR_YUG_1970_spirit_uneven_development:0 "Uneven Development"
 COLDWAR_YUG_1970_spirit_uneven_development_desc:0 "Industrial concentration, specialist shortages and uneven public services limit what a single federal investment programme can accomplish."
 COLDWAR_YUG_1970_spirit_hard_currency:0 "Hard-Currency Constraints"
 COLDWAR_YUG_1970_spirit_hard_currency_desc:0 "Imported machinery and external financing support modernisation while foreign-exchange earnings remain a practical constraint."
 COLDWAR_YUG_1970_spirit_peoples_defence:0 "General People's Defence"
 COLDWAR_YUG_1970_spirit_peoples_defence_desc:0 "A federal regular army and the new territorial defence organisation require coordinated training and a substantial personnel budget."
 COLDWAR_YUG_1970_domestic:0 "Federal Institutions"
 COLDWAR_YUG_1970_domestic_desc:0 "Convene republican representatives and carry out authorised federal programmes."
