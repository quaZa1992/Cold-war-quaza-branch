l_english:
# IMPERIA CW — Cold War: GCC 1970 — English localisation.
 COLDWAR_GCC_shortcut:0 "Gulf Cooperation Council"
 COLDWAR_GCC_programme:0 "Gulf Cooperation Programmes"
 COLDWAR_GCC_programme_desc:0 "National commitments implemented through Gulf cooperation. Each government funds and carries out its own programmes; membership and sovereignty are required for their continuing contributions."
 COLDWAR_GCC_eligible_tt:0 "An independent founding Gulf state in the Cold War scenario"
 COLDWAR_GCC_member_tt:0 "A sovereign member of the Gulf Cooperation Council"
 COLDWAR_GCC_offer_rounds_tt:0 "Fewer than 32 charter proposals have been issued"
 COLDWAR_GCC_offer_tt:0 "Send a charter invitation. Membership and entry payments require the recipient's agreement."
 COLDWAR_GCC_charter_decision:0 "Propose a Gulf Charter"
 COLDWAR_GCC_charter_decision_desc:0 "Invite another independent Gulf government to sign the charter or join the existing council. Each new member pays its own administrative entry contribution. The governments retain their sovereignty and national commands."
 COLDWAR_GCC_decisions:0 "Gulf Cooperation Council"
 COLDWAR_GCC_decisions_desc:0 "The Gulf states can establish a council through agreement. The six-state GCC was historically founded in 1981; an earlier charter is a possible alternative after the signatories have gained independence."
 COLDWAR_GCC_technical_name:0 "Gulf Technical Exchange"
 COLDWAR_GCC_technical_desc:0 "Research exchange between sovereign GCC members that have established technical standards committees. Participation does not require a military faction."
 COLDWAR_GCC_accept:0 "Sign the charter."
 COLDWAR_GCC_decline:0 "Decline the invitation."
 COLDWAR_GCC_expired:0 "This proposal is no longer valid."
 COLDWAR_GCC_council:0 "A Gulf Council"
 COLDWAR_GCC_council_desc:0 "Britain's withdrawal and the growth of oil revenues are changing the balance along the Gulf. Membership in the Gulf Cooperation Council provides a framework for consultation without surrendering our sovereignty. Our administration must now turn the charter's commitments into practical cooperation."
 COLDWAR_GCC_economic_agreement:0 "Economic Agreement"
 COLDWAR_GCC_economic_agreement_desc:0 "Common principles for economic cooperation can give merchants and ministries a more dependable framework. Each state must prepare its own administration, reconcile the agreement with its laws and bear the continuing cost of implementation."
 COLDWAR_GCC_regional_trade:0 "Trade within the Gulf"
 COLDWAR_GCC_regional_trade_desc:0 "Rules of origin, customs documentation and more predictable treatment of regional goods can make neighbouring markets easier to serve. Better access rewards local enterprise, while inspection and certification create work for the customs administration."
 COLDWAR_GCC_technical_standards:0 "Technical Standards"
 COLDWAR_GCC_technical_standards_desc:0 "Engineers, laboratories and ministries can compare technical standards and exchange practical research. Participating countries must establish their own committees and contribute expertise to sustain the exchange."
 COLDWAR_GCC_investment:0 "Joint Investment"
 COLDWAR_GCC_investment_desc:0 "Industrial partnerships need serviced sites, dependable utilities and firms able to work across national boundaries. Preparing our own economy for those partnerships can raise industrial performance, at the cost of investment and a larger demand for energy."
 COLDWAR_GCC_payments:0 "Payment Consultations"
 COLDWAR_GCC_payments_desc:0 "Central banks and commercial banks can improve settlement, accounting and the handling of cross-border payments. Practical coordination can make trade less cumbersome while each state retains its currency and control of monetary policy."
 COLDWAR_GCC_transit:0 "Roads and Border Posts"
 COLDWAR_GCC_transit_desc:0 "Road connections and dependable border procedures are more immediate needs than grand schemes for a single regional transport network. Planning, utilities and trained customs staff can support construction and commercial traffic, while heavier activity raises energy demand."
 COLDWAR_GCC_defence_consultation:0 "Defence Consultation"
 COLDWAR_GCC_defence_consultation_desc:0 "Staff talks and shared exercises can help small armed forces understand their neighbours' capabilities. Our services must assign personnel, prepare useful training and maintain liaison arrangements while retaining their national chains of command."
 COLDWAR_GCC_peninsula_shield:0 "Peninsula Shield"
 COLDWAR_GCC_peninsula_shield_desc:0 "A limited contribution to a common defensive force can make regional consultation more useful in a crisis. Preparing that contribution requires trained personnel, compatible procedures and a lasting military payroll; national governments retain command of their own forces."
 COLDWAR_GCC_officer_exchange:0 "Officer Exchanges"
 COLDWAR_GCC_officer_exchange_desc:0 "Training places, visiting instructors and exchanges between military schools can spread useful experience. Sending officers abroad and maintaining a professional training cadre require additional personnel expenditure and sustained attention from our military schools."
 COLDWAR_GCC_joint_staff:0 "Joint Staff Liaison"
 COLDWAR_GCC_joint_staff_desc:0 "Liaison officers can compare contingency plans, communications procedures and mobilisation requirements. A permanent liaison staff makes national planning more coherent, while its officers and administration require continuing support."
 COLDWAR_GCC_maintenance:0 "Procurement and Repair"
 COLDWAR_GCC_maintenance_desc:0 "Compatible equipment, repair standards and coordinated procurement can reduce the waste caused by small and incompatible production runs. Our own factories and workshops must still supply the investment, machinery and power needed to take part."
 COLDWAR_GCC_contingency:0 "Contingency Planning"
 COLDWAR_GCC_contingency_desc:0 "The Gulf's security depends on national governments being able to coordinate when a crisis arrives. Rehearsed defensive plans and supply procedures can improve our national contribution. Liaison officers must keep those plans current as forces, equipment and regional risks change."
 COLDWAR_GCC_consultative_council:0 "Council Meetings"
 COLDWAR_GCC_consultative_council_desc:0 "Regular meetings give rulers and ministers a place to discuss disputes before they grow into larger confrontations. Maintaining that channel can strengthen political coordination and diplomacy, while adding continuing duties to the national administration."
 COLDWAR_GCC_1970.1001.t:0 "A Gulf Cooperation Charter"
 COLDWAR_GCC_1970.1001.d:0 "[FROM.GetName] proposes Gulf cooperation through the council. Each new member will fund its own entry and retain its sovereignty. Our signature will admit the governments that have not yet joined; existing members retain their agreed status."
