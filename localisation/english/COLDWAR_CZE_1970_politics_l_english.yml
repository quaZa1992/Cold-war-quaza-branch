 COLDWAR_CZE_1970_contested_plenum:0 "Contested Party Congress"
 COLDWAR_CZE_1970_contested_plenum_desc:0 "The party congress has unsettled the leadership and delayed the implementation of its decisions."
 COLDWAR_CZE_1970_politics.1.t:0 "A KSČ Leadership Plenum"
 COLDWAR_CZE_1970_politics.1.description:0 "The Central Committee must entrust the leadership and its governing programme to one political current. A different programme requires a new mandate and a reorganisation of the party apparatus."
 COLDWAR_CZE_1970_politics.1.option_jakes:0 "Choose Miloš Jakeš after the 1987 succession"
 COLDWAR_CZE_1970_politics.1.option_urbanek:0 "Choose Karel Urbánek during the November 1989 transition"
 COLDWAR_CZE_1970_politics.1.option_adamec:0 "Choose Ladislav Adamec after the December 1989 transition"
 COLDWAR_CZE_1970_politics.1.a:0 "Choose Gustáv Husák"
 COLDWAR_CZE_1970_politics.1.b:0 "Choose Vasil Biľak"
 COLDWAR_CZE_1970_politics.1.c:0 "Choose Lubomír Štrougal"
 COLDWAR_CZE_1970_politics.1.option_dubcek:0 "Choose rehabilitated Alexander Dubček"
 COLDWAR_CZE_1970_politics.2.t:0 "Revise the KSČ Programme"
 COLDWAR_CZE_1970_politics.2.description:0 "The party congress must choose a leadership and the programme it will carry out. The new mandate binds both choices for at least a year."
 COLDWAR_CZE_1970_politics.2.a:0 "Adopt Husák's programme"
 COLDWAR_CZE_1970_politics.2.b:0 "Adopt Biľak's programme"
 COLDWAR_CZE_1970_politics.2.c:0 "Adopt Štrougal's programme"
 COLDWAR_CZE_1970_politics.2.option_dubcek:0 "Adopt the rehabilitated reform programme"
 COLDWAR_CZE_1970_political_procedures:0 "Political Procedures"
 COLDWAR_CZE_1970_political_procedures_desc:0 "Parliamentary procedures and party congresses determine constitutional change, political registration and the government's mandate."
 COLDWAR_CZE_1970_constitutional_roundtable:0 "Convene a Constitutional Roundtable"
 COLDWAR_CZE_1970_constitutional_roundtable_desc:0 "Fund a constitutional settlement through an inter-party roundtable. Cost: 0.08% of current GDP."
 COLDWAR_CZE_1970_competitive_front:0 "Authorise Competitive Front Parties"
 COLDWAR_CZE_1970_competitive_front_desc:0 "Permit the National Front parties to contest government in competitive federal elections. Cost: 0.05% of current GDP."
 COLDWAR_CZE_1970_civic_party_registry:0 "Register Independent Civic Parties"
 COLDWAR_CZE_1970_civic_party_registry_desc:0 "Recognise newly restored or organised civic parties under the political settlement. Cost: 0.05% of current GDP."
 COLDWAR_CZE_1970_free_election_procedure:0 "Call a Free Federal Election"
 COLDWAR_CZE_1970_free_election_procedure_desc:0 "Hold an election under the new federal election law. No party is guaranteed victory. Cost: 0.10% of current GDP."
 COLDWAR_CZE_1970_reform_leadership:0 "Nominate a Rehabilitated Reform Leadership"
 COLDWAR_CZE_1970_reform_leadership_desc:0 "Make Alexander Dubček eligible for a KSČ leadership ballot after his political rehabilitation. Cost: 0.05% of current GDP."
 COLDWAR_CZE_1970_ratify_ds_restoration:0 "Ratify the Democratic Party Restoration"
 COLDWAR_CZE_1970_ratify_ds_restoration_desc:0 "Restore the Democratic Party through its own lawful congress, with an independent democratic mandate. Cost: 0.03% of current GDP."
 COLDWAR_CZE_1970_ksc_leadership_ballot:0 "A KSČ Leadership Plenum"
 COLDWAR_CZE_1970_ksc_leadership_ballot_desc:0 "Convene the Central Committee to choose the leadership and its governing programme. Plenum expenditure: 0.03% of current GDP. Changing an existing programme costs an additional 0.22% of current GDP and causes -5% stability for 180 days. The next ballot is available 365 days after the choice."
 COLDWAR_CZE_1970_switch_ksc_programme:0 "A KSČ Programme Congress"
 COLDWAR_CZE_1970_switch_ksc_programme_desc:0 "Convene the authorised party congress to choose the leadership and its governing programme. Congress expenditure: 0.03% of current GDP. Changing an existing programme costs an additional 0.22% of current GDP and causes -5% stability for 180 days. Congresses and leadership plenums share the same 365-day interval."
 COLDWAR_CZE_1970_ksc_wait_elapsed_tt:0 "The §Y365-day§! interval between KSČ leadership ballots has elapsed"
 COLDWAR_CZE_1970_ksc_wait_elapsed_tt_NOT:0 "The §Y365-day§! interval between KSČ leadership ballots has not elapsed"
 COLDWAR_CZE_1970_ksc_no_pending_ballot_tt:0 "No KSČ leadership ballot is awaiting a decision"
 COLDWAR_CZE_1970_ksc_no_pending_ballot_tt_NOT:0 "A KSČ leadership ballot is awaiting a decision"
 COLDWAR_CZE_1970_ksc_choice_interval_tt:0 "\n§YNext leadership ballot:§! in §Y365 days§!."
 COLDWAR_CZE_1970_ksc_revision_cost_tt:0 "\n§YProgramme revision:§! §R-0.22%§! of current GDP."
