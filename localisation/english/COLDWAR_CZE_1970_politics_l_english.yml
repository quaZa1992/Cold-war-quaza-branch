 COLDWAR_CZE_1970_contested_plenum_desc: "The party congress has unsettled the leadership and delayed the implementation of its decisions."
 COLDWAR_CZE_1970_politics.1.t: "A KSČ Leadership Plenum"
 COLDWAR_CZE_1970_politics.1.description: "The Central Committee must entrust the leadership and its governing programme to one political current. A different programme requires a new mandate and a reorganisation of the party apparatus."
 COLDWAR_CZE_1970_politics.1.option_jakes: "Choose Miloš Jakeš after the 1987 succession"
 COLDWAR_CZE_1970_politics.1.option_urbanek: "Choose Karel Urbánek during the November 1989 transition"
 COLDWAR_CZE_1970_politics.1.option_adamec: "Choose Ladislav Adamec after the December 1989 transition"
 COLDWAR_CZE_1970_politics.1.a: "Choose Gustáv Husák"
 COLDWAR_CZE_1970_politics.1.b: "Choose Vasil Biľak"
 COLDWAR_CZE_1970_politics.1.c: "Choose Lubomír Štrougal"
 COLDWAR_CZE_1970_politics.1.option_dubcek: "Choose rehabilitated Alexander Dubček"
 COLDWAR_CZE_1970_politics.2.t: "Revise the KSČ Programme"
 COLDWAR_CZE_1970_politics.2.description: "The party congress must choose a leadership and the programme it will carry out. The new mandate binds both choices for at least a year."
 COLDWAR_CZE_1970_politics.2.a: "Adopt Husák's programme"
 COLDWAR_CZE_1970_politics.2.b: "Adopt Biľak's programme"
 COLDWAR_CZE_1970_politics.2.c: "Adopt Štrougal's programme"
 COLDWAR_CZE_1970_politics.2.option_dubcek: "Adopt the rehabilitated reform programme"
 COLDWAR_CZE_1970_political_procedures: "Political Procedures"
 COLDWAR_CZE_1970_political_procedures_desc: "Parliamentary procedures and party congresses determine constitutional change, political registration and the government's mandate."
 COLDWAR_CZE_1970_constitutional_roundtable: "Convene a Constitutional Roundtable"
 COLDWAR_CZE_1970_constitutional_roundtable_desc: "Fund a constitutional settlement through an inter-party roundtable. Cost: 0.08% of current GDP."
 COLDWAR_CZE_1970_competitive_front: "Authorise Competitive Front Parties"
 COLDWAR_CZE_1970_competitive_front_desc: "Permit the National Front parties to contest government in competitive federal elections. Cost: 0.05% of current GDP."
 COLDWAR_CZE_1970_civic_party_registry: "Register Independent Civic Parties"
 COLDWAR_CZE_1970_civic_party_registry_desc: "Recognise newly restored or organised civic parties under the political settlement. Cost: 0.05% of current GDP."
 COLDWAR_CZE_1970_free_election_procedure: "Call a Free Federal Election"
 COLDWAR_CZE_1970_free_election_procedure_desc: "Hold an election under the new federal election law. No party is guaranteed victory. Cost: 0.10% of current GDP."
 COLDWAR_CZE_1970_reform_leadership: "Nominate a Rehabilitated Reform Leadership"
 COLDWAR_CZE_1970_reform_leadership_desc: "Make Alexander Dubček eligible for a KSČ leadership ballot after his political rehabilitation. Cost: 0.05% of current GDP."
 COLDWAR_CZE_1970_ksc_leadership_ballot: "A KSČ Leadership Plenum"
 COLDWAR_CZE_1970_ksc_leadership_ballot_desc: "Convene the Central Committee to choose the leadership and its governing programme. Plenum expenditure: 0.03% of current GDP. Changing an existing programme costs an additional 0.22% of current GDP and causes -5% stability for 180 days. The next ballot is available 365 days after the choice."
 COLDWAR_CZE_1970_switch_ksc_programme: "A KSČ Programme Congress"
 COLDWAR_CZE_1970_switch_ksc_programme_desc: "Convene the authorised party congress to choose the leadership and its governing programme. Congress expenditure: 0.03% of current GDP. Changing an existing programme costs an additional 0.22% of current GDP and causes -5% stability for 180 days. Congresses and leadership plenums share the same 365-day interval."
