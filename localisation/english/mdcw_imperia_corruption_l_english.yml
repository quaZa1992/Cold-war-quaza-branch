l_english:
 imp_corruption.1.t: "A political donor scandal"
 imp_corruption.1.d: "A major political donor is found to be involved in a corruption ring, and accusations of bribery and influence-peddling are beginning to emerge. We have to decide whether to investigate him or sweep it under the rug and hope noone will notice."
 imp_corruption.1.o1: "Launch a full investigation."
 imp_corruption.1.o2: "Suppress the scandal"
 imp_corruption.2.t: "Corporate tax evasion scheme"
 imp_corruption.2.d: "A prominent corporation with deep ties to the political elite has been caught evading taxes, prompting public outcry. Will we crack down on them, or offer them a settlement?"
 imp_corruption.2.o1: "Proscecute them."
 imp_corruption.2.o2: "Let's settle."
 imp_corruption.3.t: "Conflict of interest"
 imp_corruption.3.d: "A recent investigation has uncovered that several top officials have quietly appointed close friends and family members to high-ranking administrative and military positions—many of whom lack the qualifications for their roles. The revelations are causing unrest in both parliament and the press, with opposition voices calling for sweeping reforms."
 imp_corruption.3.o1: "Restore Integrity"
 imp_corruption.3.o2: "Defend the appointments."
 imp_corruption.4.t: "Insider profits"
 imp_corruption.4.d: "n investigative journalist has published evidence suggesting that several government officials are engaged in insider trading. Using confidential policy information, they made massive profits just days before major legislative changes. The scandal is gaining traction in the media, and pressure is mounting to take action—or bury the story before it damages national credibility."
 imp_corruption.4.o1: "Investigate it."
 imp_corruption.4.o2: "Deny the claims and move on."
 imp_corruption.5.t: "Oligarch's Bargain"
 imp_corruption.5.d: "A powerful oligarch, with deep ties to the national economy and media, has quietly proposed a “strategic partnership.” In exchange for relaxed oversight, favorable contracts, and key appointments, he promises investment, job creation, and stability."
 imp_corruption.5.o1: "My government is NOT for sale."
 imp_corruption.5.o2: "Of course, my good friend!"
 imp_angry_oligarch: "Angry Oligarch"
 imp_corruption.6.t: "A Minister's hidden fortune"
 imp_corruption.6.d: "An anonymous leak has revealed that the Minister of Finance holds a secret offshore account containing millions in foreign currency—far beyond any declared income. While the public is outraged, the Minister denies everything, blaming “foreign meddling.”"
 imp_corruption.6.o1: "Fire him."
 imp_corruption.6.o2: "Shield him."
 imp_corruption.7.t: "Steel, Sweat, and Secrets"
 imp_corruption.7.d: "A massive steelworks project—once hailed as a cornerstone of national industrial growth—has become the subject of whispered allegations. Workers report unsafe conditions, misused funds, and missing equipment. A quiet investigation suggests millions were siphoned off by political allies during construction. Publicly confronting the issue risks halting production and exposing allies."
 imp_corruption.7.o1: "Expose the Corruption."
 imp_corruption.7.o2: "Cover it up."
 imp_steelsweat: "Steel, Sweat and Secrets"
 imp_corruption.8.t: "Infrastructure or illusion?"
 imp_corruption.8.d: "The government recently inaugurated a series of flashy infrastructure projects—bridges, roads, rail lines—all paraded as signs of national progress. However, independent audits reveal cost overruns, shoddy construction, and reports that some “completed” projects are nothing but shells."
 imp_corruption.8.o1: "Audit every project!"
 imp_corruption.8.o2: "Keep up appearances."
 imp_corruption.9.t: "Stolen aid"
 imp_corruption.9.d: "A humanitarian aid convoy carrying food, medicine, and fuel—funded by international donors—never reached its intended destination. Local reports say the convoy was hijacked by armed men and diverted. Unverified photos suggest the goods are now being sold in open-air black markets. Whispers accuse figures within the military and government of being complicit."
 imp_corruption.9.o1: "Crack down on those responsible."
 imp_corruption.9.o2: "Deflect blame."
 imp_corruption.10.t: "A foreign corporation’s deal"
 imp_corruption.10.d: "A powerful multinational corporation that has invested heavily in your country, providing essential infrastructure, technological advancements, and economic growth are now demanding substantial tax cuts and regulatory exemptions to continue their operations smoothly."
 imp_corruption.10.o1: "Out sovereignity comes first."
 imp_corruption.10.o2: "Accept their demands."
 imp_corruption.11.t: "Mining Ultimatum"
 imp_corruption.11.d: "A foreign mining conglomerate has poured significant capital into your country’s mining industry, providing key resources like metals and minerals that fuels our economy. They have now demanded tax cuts to ensure the continued profitability of their operations. The corporation has warned that if their terms are not met, they will pull out all operations, halting mining activities and leaving your country with devastating economic consequences."
 imp_corruption.11.o1: "We will not be blackmailed."
 imp_corruption.11.o2: "Accept their demands."
 imp_corruption.12.t: "Drilling Ultimatum"
 imp_corruption.12.d: "A foreign drilling conglomerate has poured significant capital into your country’s oil industry, providing precious petroleum that fills our coffers. They have now demanded tax cuts to ensure the continued profitability of their operations. The corporation has warned that if their terms are not met, they will pull out all operations, halting mining activities and leaving your country with devastating economic consequences."
 imp_corruption.12.o1: "We will not be blackmailed."
 imp_corruption.12.o2: "Accept their demands."
