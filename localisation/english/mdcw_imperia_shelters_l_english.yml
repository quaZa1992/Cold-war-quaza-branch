 civilian_shelter_desc:0 "Often unnoticed in daily life, §Ycivilian shelters§! exist for the moment when war leaves the battlefield. These shelters represent risk management applied to human lives. \n§GImproves civilian survivability during predictable strikes towards civilian population centers. §! \n \n This building maintains protective properties even when damaged, for §Rhigher maintenance§! costs."
