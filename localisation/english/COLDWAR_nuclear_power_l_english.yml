 # IMPERIA COLD WAR: Project-specific integration; preserve existing author credits.
# COLDWAR | Kernenergie-Umbau
 COLDWAR_nuc_economy_allows_tt: "Has an §YEmerging§! or §YDeveloped Economy§!"
 mdcw_nuclear_safety_target: "Reactor safety target"
 COLDWAR_nuclear_safety_target_tt: "Reactor safety target: $RIGHT|+=0$"

 COLDWAR_first_generation_reactors_modifier: "First-Generation Reactor Economics"
 COLDWAR_first_generation_reactors_modifier_desc: "Early power reactors are one-off designs: slow to build, costly to run and hungry for fuel. Standardised reactor series remove this burden."
 COLDWAR_nuclear_programme_modifier: "Nuclear Power Programme"
 COLDWAR_nuclear_programme_modifier_tt: "Reactors: §Y[?nuclear_reactors|0]§!, average age §Y[?COLDWAR_nuc_age|1]§! years\nSafety: §Y[?COLDWAR_nuc_safety|0]§! (target [?COLDWAR_nuc_safety_target|0])\nRisk of a nuclear event: about §R[?COLDWAR_nuc_risk_year|1]%§! a year"
 COLDWAR_reactor_outage_modifier: "Unplanned Reactor Outage"
 COLDWAR_cheap_oil_power_modifier: "Oil-Fired Power"
 COLDWAR_cheap_oil_power_modifier_tt: "Effective oil price: §Y[?COLDWAR_cop_price_display|0]§! (normal 75). Cheap oil makes oil-fired power stations faster and cheaper to build and run; expensive oil does the opposite.\nOil dependency: §Y[?imp_oil_dependency|%0]§!"
 COLDWAR_nuclear_exclusion_zone: "Nuclear Exclusion Zone"
 COLDWAR_nuclear_fallout: "Radioactive fallout"
 COLDWAR_nuclear_fuel_partner: "Nuclear fuel partner"

 COLDWAR_centrifuge_enrichment_idea: "Centrifuge Enrichment"
 COLDWAR_centrifuge_enrichment_idea_desc: "Gas centrifuges enrich uranium with a fraction of the power the old diffusion plants needed."
 COLDWAR_closed_fuel_cycle_idea: "Closed Fuel Cycle"
 COLDWAR_closed_fuel_cycle_idea_desc: "Spent fuel is reprocessed and its uranium and plutonium return to the reactors. Less fresh fuel, more radioactive chemistry to control."
 COLDWAR_breeder_fleet_idea: "Breeder Fleet"
 COLDWAR_breeder_fleet_idea_desc: "Fast breeder reactors make more fuel than they burn, but their liquid-sodium coolant is a constant fire risk."
 COLDWAR_reactor_design_idea: "National Reactor Design"
 COLDWAR_reactor_design_idea_desc: "A proven standard design that our industry can build at home and sell abroad."
 COLDWAR_waste_repository_idea: "Waste Vitrification"
 COLDWAR_waste_repository_idea_desc: "High-level waste is melted into glass and stored for good. Running reactors becomes cheaper and safer."
 COLDWAR_anti_nuclear_movement: "Anti-Nuclear Movement"
 COLDWAR_anti_nuclear_movement_desc: "After the accident, protesters block construction sites and courts halt new reactors."
 COLDWAR_anti_nuclear_movement_strong: "Mass Anti-Nuclear Movement"
 COLDWAR_anti_nuclear_movement_strong_desc: "After the catastrophe, hundreds of thousands march against nuclear power. No government can ignore them."
 COLDWAR_catastrophe_cleanup: "Catastrophe Clean-Up"
 COLDWAR_catastrophe_cleanup_desc: "Evacuating, decontaminating and entombing the ruined reactor costs the state for years."
 COLDWAR_post_accident_reviews: "Post-Accident Reviews"
 COLDWAR_post_accident_reviews_desc: "After a foreign catastrophe every plant is inspected again. New reactors wait, old ones get safer."
 COLDWAR_nuclear_lessons_learned: "Lessons from Abroad"
 COLDWAR_nuclear_lessons_learned_desc: "Our operators study a serious accident abroad and change their own procedures."

 sp_COLDWAR_gas_centrifuge_enrichment: "Gas Centrifuge Enrichment"
 sp_COLDWAR_gas_centrifuge_enrichment_desc: "Cascades of fast-spinning centrifuges separate uranium isotopes far more efficiently than gaseous diffusion."
 sp_COLDWAR_fuel_reprocessing: "Fuel Reprocessing Plant"
 sp_COLDWAR_fuel_reprocessing_desc: "A chemical plant dissolves spent fuel and recovers its uranium and plutonium for new fuel."
 sp_COLDWAR_fast_breeder: "Fast Breeder Prototype"
 sp_COLDWAR_fast_breeder_desc: "A sodium-cooled fast reactor that breeds new fuel from depleted uranium."
 sp_COLDWAR_reactor_design: "National Reactor Design"
 sp_COLDWAR_reactor_design_desc: "A standard reactor design certified for series production and export."
 sp_COLDWAR_waste_repository: "Waste Vitrification and Repository"
 sp_COLDWAR_waste_repository_desc: "An industrial plant turns high-level waste into glass blocks for permanent storage."

 COLDWAR_nuclear_power_category: "Nuclear Power Programme"
 COLDWAR_nuclear_power_category_desc: "Reactors: §Y[?nuclear_reactors|0]§! · average age §Y[?COLDWAR_nuc_age|1]§! years\nSafety: §Y[?COLDWAR_nuc_safety|0]§! of 100 (target [?COLDWAR_nuc_safety_target|0])\nRisk of a nuclear event: about §R[?COLDWAR_nuc_risk_year|1]%§! a year\n\nCheap maintenance saves money and raises the risk; rigorous maintenance costs more and keeps the plants safe. Old fleets become more dangerous. Countries without enrichment buy reactor fuel from a supplier, who can end the contract at any time."
 COLDWAR_nuc_regime_minimal: "Minimal Maintenance"
 COLDWAR_nuc_regime_minimal_desc: "Stretch inspection intervals and keep the reactors running."
 COLDWAR_nuc_regime_minimal_tt: "Reactor upkeep §G-30%§!, nuclear power §G+3%§!, safety target §R-20§!."
 COLDWAR_nuc_regime_standard: "Standard Maintenance"
 COLDWAR_nuc_regime_standard_desc: "Follow the manufacturer's maintenance schedule."
 COLDWAR_nuc_regime_standard_tt: "Reactor upkeep, nuclear power and safety target return to their normal values."
 COLDWAR_nuc_regime_rigorous: "Rigorous Maintenance"
 COLDWAR_nuc_regime_rigorous_desc: "Planned outages, full inspections and simulator training for every crew."
 COLDWAR_nuc_regime_rigorous_tt: "Reactor upkeep §R+40%§!, nuclear power §R-3%§!, safety target §G+15§!."
 COLDWAR_nuc_regime_cooldown_tt: "The maintenance regime was changed in the last 180 days"
 COLDWAR_nuc_life_extension: "Reactor Life Extension"
 COLDWAR_nuc_life_extension_desc: "Replace steam generators, pumps and control systems so the old plants can run another decade."
 COLDWAR_nuc_life_extension_tt: "The average age of our reactors falls by §G10§! years."
 COLDWAR_nuc_request_fuel: "Request Fuel Supply from [From.GetName]"
 COLDWAR_nuc_request_fuel_desc: "Ask a country with enrichment plants to supply our reactors."
 COLDWAR_nuc_request_fuel_tt: "Every month we receive the fuel our reactors burn and pay §Y0.02 billion§! per reactor (adjusted for inflation). The supplier can end the contract at any time."
 COLDWAR_nuc_fuel_request_pending_tt: "No fuel request is waiting for an answer"
 COLDWAR_nuc_cancel_fuel: "Cancel Fuel Contract"
 COLDWAR_nuc_cancel_fuel_desc: "End the fuel supply contract with our supplier."
 COLDWAR_nuc_cancel_fuel_tt: "Our reactors no longer receive fuel from the supplier."
 COLDWAR_nuc_terminate_fuel: "End Fuel Supply to [From.GetName]"
 COLDWAR_nuc_terminate_fuel_desc: "Stop delivering reactor fuel to this customer."
 COLDWAR_nuc_terminate_fuel_tt: "We lose the monthly payment; their reactors lose our fuel."
 COLDWAR_nuc_offer_turnkey: "Offer a Turnkey Reactor to [From.GetName]"
 COLDWAR_nuc_offer_turnkey_desc: "Build a complete power station for a developing country and supply its fuel."
 COLDWAR_nuc_offer_turnkey_tt: "They pay §Y1.8%§! of their GDP, we receive §G1.35%§! of their GDP. Their reactor goes online after §Y4 years§! and we become its fuel supplier."
 TT_IF_THEY_ACCEPT: "If they accept:"

 COLDWAR_nuclear_outage_tt: "One reactor stays offline for §Y120 days§! (nuclear power reduced, at most §R-25%§!)."
 COLDWAR_nuclear_world_news_tt: "The whole world learns of the accident."
 COLDWAR_nuclear_spread_tt: "Radiation can spread into neighbouring states, including other countries."

 COLDWAR_nuclear.1.t: "Incident at [COLDWAR_nuc_site.GetName]"
 COLDWAR_nuclear.1.d: "A coolant pump failed and the reactor at [COLDWAR_nuc_site.GetName] scrammed automatically. Nobody was harmed, but the unit stays offline until the inspectors are satisfied."
 COLDWAR_nuclear.1.a: "Repair it and restart."
 COLDWAR_nuclear.2.t: "Serious Reactor Accident at [COLDWAR_nuc_site.GetName]"
 COLDWAR_nuclear.2.d: "A chain of equipment failures and operator errors has damaged the core of a reactor at [COLDWAR_nuc_site.GetName]. Radioactivity escaped into the surrounding area. The unit will never run again, and the public is frightened."
 COLDWAR_nuclear.2.a: "Contain the damage."
 COLDWAR_nuclear.3.t: "Nuclear Catastrophe at [COLDWAR_nuc_site.GetName]"
 COLDWAR_nuclear.3.d: "An explosion has torn open a reactor at [COLDWAR_nuc_site.GetName]. A radioactive cloud is drifting over the country and beyond our borders. Towns are being evacuated and a zone around the plant will stay empty for decades."
 COLDWAR_nuclear.3.a: "Evacuate and entomb the reactor."
 COLDWAR_nuclear.4.t: "Reactor Accident in [From.GetName]"
 COLDWAR_nuclear.4.d: "A serious accident at a nuclear power station in [From.GetName] has released radioactivity. Engineers around the world study what went wrong."
 COLDWAR_nuclear.4.a: "Could it happen here?"
 COLDWAR_nuclear.5.t: "Nuclear Catastrophe in [From.GetName]"
 COLDWAR_nuclear.5.d: "A reactor has exploded in [From.GetName]. Fallout is measured far beyond its borders, and governments everywhere face questions about their own plants."
 COLDWAR_nuclear.5.a: "A dark day for nuclear power."
 COLDWAR_nuclear.10.t: "[From.GetName] Requests Reactor Fuel"
 COLDWAR_nuclear.10.d: "[From.GetName] has no enrichment plants of its own and asks us to supply fuel for its power reactors."
 COLDWAR_nuclear.10.a: "Agree to supply them."
 COLDWAR_nuclear.10.a_tt: "Every month we receive §G0.015 billion§! per reactor they run (adjusted for inflation) and ship the fuel from our own stockpile. We can end the contract at any time."
 COLDWAR_nuclear.10.b: "Refuse."
 COLDWAR_nuclear.11.t: "[From.GetName] Will Supply Our Fuel"
 COLDWAR_nuclear.11.d: "[From.GetName] has agreed to supply fuel for our reactors."
 COLDWAR_nuclear.11.a: "Good."
 COLDWAR_nuclear.11.a_tt: "Every month we receive the fuel our reactors burn and pay §Y0.02 billion§! per reactor (adjusted for inflation)."
 COLDWAR_nuclear.12.t: "[From.GetName] Refuses to Supply Fuel"
 COLDWAR_nuclear.12.d: "[From.GetName] has turned down our request for reactor fuel."
 COLDWAR_nuclear.12.a: "We will look elsewhere."
 COLDWAR_nuclear.13.t: "[From.GetName] Ends Our Fuel Supply"
 COLDWAR_nuclear.13.d: "[From.GetName] has stopped delivering fuel for our reactors. Unless we find another supplier, our reactors will run down their stockpile."
 COLDWAR_nuclear.13.a: "We will remember this."
 COLDWAR_nuclear.14.t: "[From.GetName] Cancels Its Fuel Contract"
 COLDWAR_nuclear.14.d: "[From.GetName] no longer wants our reactor fuel."
 COLDWAR_nuclear.14.a: "Understood."
 COLDWAR_nuclear.15.t: "Fuel Contract Lapsed"
 COLDWAR_nuclear.15.d: "Our fuel supplier can no longer deliver. Our reactors depend on our own stockpile until we find another supplier."
 COLDWAR_nuclear.15.a: "Find another supplier."
 COLDWAR_nuclear.20.t: "[From.GetName] Offers a Turnkey Reactor"
 COLDWAR_nuclear.20.d: "[From.GetName] offers to build us a complete nuclear power station and to supply its fuel. It would be our first step into the atomic age, and a lasting dependence on the supplier."
 COLDWAR_nuclear.20.a: "Sign the contract."
 COLDWAR_nuclear.20.a_tt: "We pay §Y1.8%§! of our GDP now. The reactor goes online in §Y4 years§! in our capital region, and [From.GetName] becomes our fuel supplier."
 COLDWAR_nuclear.20.b: "We cannot afford it."
 COLDWAR_nuclear.21.t: "[From.GetName] Buys Our Reactor"
 COLDWAR_nuclear.21.d: "[From.GetName] has signed the contract for a turnkey power station. Our engineers will build it, and we will supply its fuel."
 COLDWAR_nuclear.21.a: "A fine export."
 COLDWAR_nuclear.22.t: "[From.GetName] Declines Our Reactor"
 COLDWAR_nuclear.22.d: "[From.GetName] has turned down our offer of a turnkey power station."
 COLDWAR_nuclear.22.a: "Their loss."
 COLDWAR_nuclear.23.t: "Our First Reactor Goes Online"
 COLDWAR_nuclear.23.d: "The power station built by our foreign partner has been connected to the grid. The atomic age has reached our country."
 COLDWAR_nuclear.23.a: "Switch it on."
