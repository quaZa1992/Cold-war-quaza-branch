# IMPERIA CW — Cold War: bucharest landmarks — English localisation.
 landmark_bucharest_scinteii: "Casa Scînteii"
 landmark_bucharest_scinteii_plural: "$landmark_bucharest_scinteii$"
 landmark_bucharest_scinteii_desc: "Completed in 1956 in northern Bucharest, Casa Scînteii brings publishing offices, newspaper editorial departments and printing works together in a monumental complex. Its central tower and stepped wings form one of the capital's most distinctive landmarks. Its concentrated publishing and administrative offices reduce bureaucracy costs for the country controlling the complex."
