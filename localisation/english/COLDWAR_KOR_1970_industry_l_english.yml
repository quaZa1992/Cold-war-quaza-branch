l_english:
# IMPERIA COLD WAR — South Korea 1970 industrial programmes
 COLDWAR_KOR_industry_financing_unassigned_tt:0 "Industrial financing model: §YUnassigned§!"
 COLDWAR_KOR_industry_financing_unassigned_tt_NOT:0 "Industrial financing model: §YActive§!"
 COLDWAR_KOR_industry_eligible_exports_tt:0 "Exports at least §Y1§! unit of Steel, Rubber or Microchips."
 COLDWAR_KOR_industry_eligible_exports_tt_NOT:0 "Exports fewer than §Y1§! unit of Steel, Rubber or Microchips."
 COLDWAR_KOR_industry_shared_headroom_1_tt:0 "Shared building capacity for §Y1§! additional slot."
 COLDWAR_KOR_industry_shared_headroom_1_tt_NOT:0 "Shared building capacity below §Y1§! additional slot."
 COLDWAR_KOR_industry_shared_headroom_2_tt:0 "Shared building capacity for §Y2§! additional slots."
 COLDWAR_KOR_industry_shared_headroom_2_tt_NOT:0 "Shared building capacity below §Y2§! additional slots."
 COLDWAR_KOR_industry_ulsan_petrochemicals_gdp_charge_tt:0 "Treasury: §R-1.35%§! of current GDP."
 COLDWAR_KOR_ulsan_petrochemicals:0 "Ulsan Petrochemicals"
 COLDWAR_KOR_ulsan_petrochemicals_desc:0 "Ulsan's refinery gives Korea a base for a larger chemical industry. Public investment in factory sites and transport links will bring the next stage of the complex within reach and increase demand for power and labour."
 COLDWAR_KOR_industry_refining_feedstock_gdp_charge_tt:0 "Treasury: §R-0.4%§! of current GDP."
 COLDWAR_KOR_industry_refining_feedstock_programme:0 "Refinery Modernisation"
 COLDWAR_KOR_industry_refining_feedstock_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_refining_feedstock:0 "Refining and Feedstock"
 COLDWAR_KOR_refining_feedstock_desc:0 "Refineries need a steady supply of feedstock and the capacity to turn it into useful products. Public support for refinery improvements and engineering work will help operators obtain more fuel from available fossil resources."
 COLDWAR_KOR_industry_chemical_research_gdp_charge_tt:0 "Treasury: §R-0.35%§! of current GDP."
 COLDWAR_KOR_chemical_research:0 "Chemical Research"
 COLDWAR_KOR_chemical_research_desc:0 "A public chemical research institute will give manufacturers access to shared laboratories and help turn work on advanced fibres and materials into industrial applications."
 COLDWAR_KOR_industry_polymers_and_fibres_gdp_charge_tt:0 "Treasury: §R-0.55%§! of current GDP."
 COLDWAR_KOR_polymers_and_fibres:0 "Polymers and Fibres"
 COLDWAR_KOR_polymers_and_fibres_desc:0 "Domestic producers of synthetic rubber and other polymer products can supply tyre makers and manufacturers. Investment in local production will broaden the materials available to Korean factories."
 COLDWAR_KOR_industry_yeosu_petrochemicals_gdp_charge_tt:0 "Treasury: §R-1.2%§! of current GDP."
 COLDWAR_KOR_yeosu_petrochemicals:0 "Yeosu Petrochemicals"
 COLDWAR_KOR_yeosu_petrochemicals_desc:0 "A second complex near Yeosu will open Honam to petrochemical production. Public development funds will prepare factory sites and support the manufacture of synthetic rubber alongside other chemical products."
 COLDWAR_KOR_industry_chemical_process_safety_gdp_charge_tt:0 "Treasury: §R-0.3%§! of current GDP."
 COLDWAR_KOR_industry_chemical_process_safety_programme:0 "Chemical Process Standards"
 COLDWAR_KOR_industry_chemical_process_safety_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_chemical_process_safety:0 "Process Safety"
 COLDWAR_KOR_chemical_process_safety_desc:0 "Inspections, maintenance procedures and investment in efficient equipment will help chemical plants recover faster from disruptions and use less electricity. Public funding will support regular inspections and compliance work."
 COLDWAR_KOR_industry_gumi_electronics_gdp_charge_tt:0 "Treasury: §R-1.15%§! of current GDP."
 COLDWAR_KOR_gumi_electronics:0 "Gumi Electronics"
 COLDWAR_KOR_gumi_electronics_desc:0 "Develop Gumi as a centre for electronic components and consumer goods. Public investment will prepare factory space and give Korean firms a foundation in circuit design and computing."
 COLDWAR_KOR_industry_electronics_assembly_gdp_charge_tt:0 "Treasury: §R-0.25%§! of current GDP."
 COLDWAR_KOR_industry_electronics_assembly_programme:0 "Electronics Assembly Service"
 COLDWAR_KOR_industry_electronics_assembly_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_electronics_assembly:0 "Electronics Assembly"
 COLDWAR_KOR_electronics_assembly_desc:0 "Improve assembly work for radios, television sets and other consumer electronics. A continuing production service will help firms train supervisors, standardise parts and reduce assembly errors."
 COLDWAR_KOR_industry_integrated_circuit_engineering_gdp_charge_tt:0 "Treasury: §R-0.3%§! of current GDP."
 COLDWAR_KOR_integrated_circuit_engineering:0 "Integrated Circuits"
 COLDWAR_KOR_integrated_circuit_engineering_desc:0 "Build up domestic circuit design and testing. Engineers with experience in integrated circuits will be better placed to develop the computing components needed by Korean manufacturers."
 COLDWAR_KOR_industry_memory_research_gdp_charge_tt:0 "Treasury: §R-0.5%§! of current GDP."
 COLDWAR_KOR_memory_research:0 "Memory Research"
 COLDWAR_KOR_memory_research_desc:0 "Bring public laboratories, universities and manufacturers together to improve memory-chip production. Shared testing and process development will help turn prototypes into reliable products."
 COLDWAR_KOR_industry_icheon_chip_works_gdp_charge_tt:0 "Treasury: §R-1.7%§! of current GDP."
 COLDWAR_KOR_icheon_chip_works:0 "Icheon Chip Works"
 COLDWAR_KOR_icheon_chip_works_desc:0 "Finance additional semiconductor production at Icheon. Scaling laboratory work into commercial production will require a steady supply of specialised metals, power and skilled workers."
 COLDWAR_KOR_industry_semiconductor_exports_gdp_charge_tt:0 "Treasury: §R-0.35%§! of current GDP."
 COLDWAR_KOR_industry_semiconductor_exports_programme:0 "Semiconductor Export Service"
 COLDWAR_KOR_industry_semiconductor_exports_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_semiconductor_exports:0 "Semiconductor Exports"
 COLDWAR_KOR_semiconductor_exports_desc:0 "Support semiconductor exporters with shared testing and more efficient plant operations. Overseas sales can earn more revenue while the programme lowers electricity demand at domestic chip plants."
 COLDWAR_KOR_industry_investment_appraisal_gdp_charge_tt:0 "Treasury: §R-0.25%§! of current GDP."
 COLDWAR_KOR_industry_investment_appraisal_programme:0 "Industrial Appraisal Office"
 COLDWAR_KOR_industry_investment_appraisal_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_investment_appraisal:0 "Investment Appraisal"
 COLDWAR_KOR_investment_appraisal_desc:0 "Give the Economic Planning Board's appraisal teams common rules for comparing industrial projects. Earlier checks on costs, sites and demand will reduce wasted spending as firms prepare new investments."
 COLDWAR_KOR_industry_chaebol_finance_gdp_charge_tt:0 "Treasury: §R-0.7%§! of current GDP."
 COLDWAR_KOR_industry_chaebol_finance_programme:0 "Chaebol Development Credit"
 COLDWAR_KOR_industry_chaebol_finance_gdp_weekly_tt:0 "Weekly expenditure: §R-0.003%§! of current GDP."
 COLDWAR_KOR_chaebol_finance:0 "Chaebol Finance"
 COLDWAR_KOR_chaebol_finance_desc:0 "Concentrate development lending on large industrial groups that can organise complex projects and finance extensive supply networks. The state will carry a continuing share of the credit programme, while heavier use of machinery will increase electricity demand."
 COLDWAR_KOR_industry_sme_regional_finance_gdp_charge_tt:0 "Treasury: §R-0.45%§! of current GDP."
 COLDWAR_KOR_industry_sme_regional_finance_programme:0 "Regional Enterprise Credit"
 COLDWAR_KOR_industry_sme_regional_finance_gdp_weekly_tt:0 "Weekly expenditure: §R-0.0015%§! of current GDP."
 COLDWAR_KOR_sme_regional_finance:0 "SME Regional Finance"
 COLDWAR_KOR_sme_regional_finance_desc:0 "Expand credit support for small and medium-sized firms through the Industrial Bank of Korea and regional lenders. Common applications and credit guarantees will make it easier for local suppliers to finance new investment."
 COLDWAR_KOR_industry_export_performance_reviews_gdp_charge_tt:0 "Treasury: §R-0.15%§! of current GDP."
 COLDWAR_KOR_industry_export_performance_reviews_programme:0 "Export Performance Reviews"
 COLDWAR_KOR_industry_export_performance_reviews_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_export_performance_reviews:0 "Export Reviews"
 COLDWAR_KOR_export_performance_reviews_desc:0 "Review delivery records before renewing export support. Regular meetings between trade officials, lenders and producers will help exporters meet orders and concentrate assistance on industries with established markets."
 COLDWAR_KOR_industry_regional_supplier_networks_gdp_charge_tt:0 "Treasury: §R-0.3%§! of current GDP."
 COLDWAR_KOR_industry_regional_supplier_networks_programme:0 "Regional Supplier Network"
 COLDWAR_KOR_industry_regional_supplier_networks_programme_606:0 "Regional Supplier Network"
 COLDWAR_KOR_industry_regional_supplier_networks_programme_607:0 "Regional Supplier Network"
 COLDWAR_KOR_industry_regional_supplier_networks_gdp_weekly_per_state606_tt:0 "Weekly expenditure in Chungcheong: §R-0.0005%§! of current GDP."
 COLDWAR_KOR_industry_regional_supplier_networks_gdp_weekly_per_state607_tt:0 "Weekly expenditure in Honam: §R-0.0005%§! of current GDP."
 COLDWAR_KOR_regional_supplier_networks:0 "Supplier Networks"
 COLDWAR_KOR_regional_supplier_networks_desc:0 "Support industrial estates and supplier services in Chungcheong and Honam. Provincial offices will help smaller manufacturers find sites and share technical services as they expand."
 COLDWAR_KOR_industry_industrial_credit_disclosure_gdp_charge_tt:0 "Treasury: §R-0.15%§! of current GDP."
 COLDWAR_KOR_industry_industrial_credit_disclosure_programme:0 "Industrial Credit Register"
 COLDWAR_KOR_industry_industrial_credit_disclosure_gdp_weekly_tt:0 "Weekly expenditure: §R-0.0005%§! of current GDP."
 COLDWAR_KOR_industrial_credit_disclosure:0 "Credit Disclosure"
 COLDWAR_KOR_industrial_credit_disclosure_desc:0 "Publish accounts for state-backed industrial credit and require independent checks on guarantees. A clear record of public liabilities will help lenders assess government borrowing and expose problems before they become costly."
 COLDWAR_KOR_industry_public_enterprise_accounts_gdp_charge_tt:0 "Treasury: §R-0.2%§! of current GDP."
 COLDWAR_KOR_industry_public_enterprise_accounts_programme:0 "Public Enterprise Reporting"
 COLDWAR_KOR_industry_public_enterprise_accounts_gdp_weekly_tt:0 "Weekly expenditure: §R-0.0005%§! of current GDP."
 COLDWAR_KOR_public_enterprise_accounts:0 "Enterprise Accounts"
 COLDWAR_KOR_public_enterprise_accounts_desc:0 "Require government-invested industrial enterprises to publish comparable accounts and report their results against clear objectives. Regular reviews will give ministries a firmer basis for collecting revenue and deciding which enterprises need reform."
 COLDWAR_KOR_industry_posco_share_offering_gdp_charge_tt:0 "Treasury: §R-0.1%§! of current GDP."
 COLDWAR_KOR_industry_posco_share_offering_gdp_credit_tt:0 "Treasury: §G+0.5%§! of current GDP."
 COLDWAR_KOR_industry_posco_share_offering_programme:0 "Listed Steel Company"
 COLDWAR_KOR_posco_share_offering:0 "POSCO Share Offering"
 COLDWAR_KOR_posco_share_offering_desc:0 "Offer a minority stake in Pohang Iron and Steel Company on the Korea Stock Exchange. The sale will raise funds for the state and subject the company to regular market scrutiny. The government will receive a smaller share of steel export earnings."
 COLDWAR_KOR_industry_okpo_restructuring_gdp_charge_tt:0 "Treasury: §R-0.35%§! of current GDP."
 COLDWAR_KOR_industry_okpo_restructuring_programme:0 "Okpo Shipyard Operating Credit"
 COLDWAR_KOR_industry_okpo_restructuring_gdp_weekly_tt:0 "Weekly expenditure: §R-0.002%§! of current GDP."
 COLDWAR_KOR_okpo_restructuring:0 "Okpo Restructuring"
 COLDWAR_KOR_okpo_restructuring_desc:0 "Reorganize the management of Okpo Shipyard and authorize the Korea Development Bank to provide working capital. The new production plan will raise shipbuilding output, with the Treasury bearing the cost of continued support."
 COLDWAR_KOR_industry_industrial_competition_gdp_charge_tt:0 "Treasury: §R-0.25%§! of current GDP."
 COLDWAR_KOR_industry_industrial_competition_programme:0 "Korea Fair Trade Commission"
 COLDWAR_KOR_industry_industrial_competition_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_industrial_competition:0 "Industrial Competition"
 COLDWAR_KOR_industrial_competition_desc:0 "Empower the Korea Fair Trade Commission to investigate price fixing and abuses of market power. A permanent enforcement staff will protect access to industrial markets for new firms."
 COLDWAR_KOR_industry_changwon_machinery_complex_gdp_charge_tt:0 "Treasury: §R-1.1%§! of current GDP."
 COLDWAR_KOR_industry_changwon_machinery_complex_programme:0 "Changwon Industrial Estate"
 COLDWAR_KOR_changwon_machinery_complex:0 "Changwon Machinery"
 COLDWAR_KOR_changwon_machinery_complex_desc:0 "Prepare an industrial estate at Changwon for machinery producers and their suppliers. Public funds will equip the site and support the first tenants as they establish production."
 COLDWAR_KOR_industry_machine_tool_programme_gdp_charge_tt:0 "Treasury: §R-0.3%§! of current GDP."
 COLDWAR_KOR_machine_tool_programme:0 "Precision Machine Tools"
 COLDWAR_KOR_machine_tool_programme_desc:0 "Support machine tool makers as they expand into numerical control and precision machining. Shared testing and production facilities will help firms move from prototypes to equipment that factories can use."
 COLDWAR_KOR_industry_component_suppliers_gdp_charge_tt:0 "Treasury: §R-0.25%§! of current GDP."
 COLDWAR_KOR_industry_component_suppliers_programme:0 "Supplier Development Service"
 COLDWAR_KOR_industry_component_suppliers_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_component_suppliers:0 "Component Suppliers"
 COLDWAR_KOR_component_suppliers_desc:0 "Help domestic parts makers prepare industrial sites and agree common specifications with the assembly plants. A continuing public service will coordinate suppliers and make it easier to build new factories."
 COLDWAR_KOR_industry_ulsan_motor_works_gdp_charge_tt:0 "Treasury: §R-0.95%§! of current GDP."
 COLDWAR_KOR_ulsan_motor_works:0 "Ulsan Motor Works"
 COLDWAR_KOR_ulsan_motor_works_desc:0 "Expand the Ulsan assembly works so vehicle makers can move from licensed assembly towards Korean-designed passenger cars. The new factory will draw workers and power as output grows."
 COLDWAR_KOR_industry_domestic_engine_design_gdp_charge_tt:0 "Treasury: §R-0.4%§! of current GDP."
 COLDWAR_KOR_industry_domestic_engine_design_programme:0 "Automotive Engine Programme"
 COLDWAR_KOR_industry_domestic_engine_design_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_domestic_engine_design:0 "Domestic Engine Design"
 COLDWAR_KOR_domestic_engine_design_desc:0 "Fund domestic engine testing and production engineering. Manufacturers can design for lower fuel use and bring more efficient engines into the civilian vehicle fleet."
 COLDWAR_KOR_industry_vehicle_export_standards_gdp_charge_tt:0 "Treasury: §R-0.3%§! of current GDP."
 COLDWAR_KOR_industry_vehicle_export_standards_programme:0 "Export Quality Service"
 COLDWAR_KOR_industry_vehicle_export_standards_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_vehicle_export_standards:0 "Export Standards"
 COLDWAR_KOR_vehicle_export_standards_desc:0 "Fund production audits and reliability testing for manufacturers seeking overseas customers. Stricter quality control will cut rework and make factory operations more productive and less energy intensive."
 COLDWAR_KOR_industry_ulsan_shipyard_gdp_charge_tt:0 "Treasury: §R-1%§! of current GDP."
 COLDWAR_KOR_ulsan_shipyard:0 "Ulsan Shipyard"
 COLDWAR_KOR_ulsan_shipyard_desc:0 "Develop a large shipyard at Mipo Bay to build merchant ships and tankers. Public investment will prepare the site and dock facilities while the yard takes on the cost of staffing and operating them."
 COLDWAR_KOR_industry_merchant_ship_orders_gdp_charge_tt:0 "Treasury: §R-0.4%§! of current GDP."
 COLDWAR_KOR_merchant_ship_orders:0 "Merchant Ship Orders"
 COLDWAR_KOR_merchant_ship_orders_desc:0 "Place orders for Korean-built merchant ships to expand the transport fleet. The public purchase will give the yards early work and provide shipping capacity for trade and overseas supply."
 COLDWAR_KOR_industry_shipyard_engineering_gdp_charge_tt:0 "Treasury: §R-0.3%§! of current GDP."
 COLDWAR_KOR_shipyard_engineering:0 "Shipyard Engineering"
 COLDWAR_KOR_shipyard_engineering_desc:0 "Train yard engineers in the design and installation of marine diesel systems. Domestic firms will be better placed to adapt machinery to the needs of Korean shipbuilders."
 COLDWAR_KOR_industry_okpo_shipyard_gdp_charge_tt:0 "Treasury: §R-1.45%§! of current GDP."
 COLDWAR_KOR_okpo_shipyard:0 "Okpo Shipyard"
 COLDWAR_KOR_okpo_shipyard_desc:0 "Develop a second major shipyard at Okpo and build up its civilian suppliers. The new yard will expand capacity for larger merchant ships and create demand for industrial inputs and skilled labour."
 COLDWAR_KOR_industry_ship_classification_gdp_charge_tt:0 "Treasury: §R-0.2%§! of current GDP."
 COLDWAR_KOR_industry_ship_classification_programme:0 "Ship Classification Service"
 COLDWAR_KOR_industry_ship_classification_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_ship_classification:0 "Ship Classification"
 COLDWAR_KOR_ship_classification_desc:0 "Expand the Korean Register's inspection and survey service. Consistent certification and trained surveyors will help yards deliver ships to agreed standards and reduce costly rework."
 COLDWAR_KOR_industry_ship_repair_and_refit_gdp_charge_tt:0 "Treasury: §R-0.35%§! of current GDP."
 COLDWAR_KOR_industry_ship_repair_and_refit_programme:0 "Ship Repair Service"
 COLDWAR_KOR_industry_ship_repair_and_refit_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_ship_repair_and_refit:0 "Ship Repair and Refit"
 COLDWAR_KOR_ship_repair_and_refit_desc:0 "Equip the repair yards for regular maintenance, vessel conversions and more efficient use of shore power. A standing maintenance programme will shorten repairs and reduce electricity demand at the yards."
 COLDWAR_KOR_industry_pohang_foundry_gdp_charge_tt:0 "Treasury: §R-1.25%§! of current GDP."
 COLDWAR_KOR_industry_rolled_steel_standards_gdp_charge_tt:0 "Treasury: §R-0.5%§! of current GDP."
 COLDWAR_KOR_industry_rolled_steel_standards_programme:0 "Rolled Steel Standards"
 COLDWAR_KOR_industry_rolled_steel_standards_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_rolled_steel_standards:0 "Plate and Strip Mills"
 COLDWAR_KOR_rolled_steel_standards_desc:0 "Domestic shipyards and manufacturers need consistent plate and strip, supported by inspection and reliable rolling capacity. A funded quality service will improve the supply and commercial value of Korean steel."
 COLDWAR_KOR_industry_metallurgical_research_gdp_charge_tt:0 "Treasury: §R-0.35%§! of current GDP."
 COLDWAR_KOR_metallurgical_research:0 "Metallurgical Research"
 COLDWAR_KOR_metallurgical_research_desc:0 "Applied laboratories and industrial engineers can turn experience on the works floor into domestic technical capability. Research funding should support industrial methods that Korean firms can develop and adapt themselves."
 COLDWAR_KOR_industry_scrap_and_minimills_gdp_charge_tt:0 "Treasury: §R-0.4%§! of current GDP."
 COLDWAR_KOR_industry_scrap_and_minimills_programme:0 "Scrap Recovery Programme"
 COLDWAR_KOR_industry_scrap_and_minimills_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_scrap_and_minimills:0 "Scrap and Mini-Mills"
 COLDWAR_KOR_scrap_and_minimills_desc:0 "Organised scrap collection, electric-arc production and maintenance services can recover more usable steel from domestic material. Public support will carry the cost of collection and processing while firms improve their production methods."
 COLDWAR_KOR_industry_gwangyang_steelworks_gdp_charge_tt:0 "Treasury: §R-1.25%§! of current GDP."
 COLDWAR_KOR_gwangyang_steelworks:0 "Gwangyang Steelworks"
 COLDWAR_KOR_gwangyang_steelworks_desc:0 "A second coastal steelworks at Gwangyang will extend heavy industry into Honam. Large public investment and experienced engineers can establish another source of steel, with continuing demand for power, labour and transport."
 COLDWAR_KOR_industry_steel_export_programme_gdp_charge_tt:0 "Treasury: §R-0.2%§! of current GDP."
 COLDWAR_KOR_industry_steel_export_programme_programme:0 "Steel Export Programme"
 COLDWAR_KOR_industry_steel_export_programme_gdp_weekly_tt:0 "Weekly expenditure: §R-0.001%§! of current GDP."
 COLDWAR_KOR_steel_export_programme:0 "Steel Export Programme"
 COLDWAR_KOR_steel_export_programme_desc:0 "Commercial support for steel exporters can connect expanded domestic capacity with foreign demand. Market information, standards and public export services require continuing funding, while earnings depend on buyers and prevailing steel prices."
