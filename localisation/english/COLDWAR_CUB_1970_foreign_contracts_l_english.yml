 COLDWAR_CUB_foreign_settlement_cub_desc:0 "A comprehensive settlement requires Washington to accept compensation terms and the removal of its remaining restrictions. Cuba can regain commercial access while accepting a costly claims payment and greater exposure to American economic influence. The agreement leaves Cuba's government and the status of Guantánamo outside its terms. The terms remain active while both governments are at peace and free of mutual sanctions. Either signatory may terminate the agreement."
