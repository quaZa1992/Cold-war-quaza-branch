# IMPERIA CW — Cold War: 1970 era national ideas — English localisation.
 # COLDWAR 1970 era national ideas
 COLDWAR_era_forced_industrialisation: "Forced-Pace Accumulation"
 COLDWAR_era_forced_industrialisation_desc: "The plan comes first and the people second. Following the Soviet pattern of the 1930s, Mao's Great Leap and Ceausescu's accumulation drive of the 1970s, a third of national income is ploughed back into heavy industry. Shops stay empty, queues grow, families stay small and wages buy little, but the blast furnaces never cool."
 COLDWAR_era_forced_industrialisation_avail: "Ruled by a Marxist-Leninist party"
 COLDWAR_era_developmental_state: "The Developmental State"
 COLDWAR_era_developmental_state_desc: "An economic general staff picks national champions, rations credit and holds wages down so that profits flow back into new plant. It is the formula of Japan's MITI, Park Chung-hee's South Korea, Taiwan and Brazil's \"economic miracle\": rapid catch-up growth, paid for with tax holidays for the chosen conglomerates, weak unions and simmering labour unrest."
 COLDWAR_era_developmental_state_avail: "Not ruled by a Marxist-Leninist party"
 COLDWAR_era_green_revolution: "The Green Revolution"
 COLDWAR_era_green_revolution_desc: "High-yield seed, irrigation, fertilisers and subsidised machinery modernise the countryside, drawing on the agricultural programmes of Mexico, India and the Philippines. Tractors and threshers reduce labour needs in subsistence farming and commercial agricultural districts. Families can seek industrial work, but smaller farms face debt and dependence on fuel and chemicals.\n\nThe labour reductions apply to each agricultural sector's normal requirement. Released workers fill available jobs elsewhere; without those jobs, unemployment rises."
 COLDWAR_era_new_socialist_man: "Forging the New Socialist Man"
 COLDWAR_era_new_socialist_man_desc: "From the Pioneers and the Komsomol to the FDJ and the work brigades, the party shapes every stage of life: free schooling, sport, paramilitary youth camps and voluntary Saturdays. Young people arrive in the army already drilled and loyal. The price is dogma in the classroom, censorship in the laboratory and a society the outside world distrusts."
 COLDWAR_era_new_socialist_man_avail: "Ruled by a Marxist-Leninist party"
 COLDWAR_era_welfare_consensus: "The Post-War Welfare Consensus"
 COLDWAR_era_welfare_consensus_desc: "Beveridge's welfare state, Johnson's Great Society, the Swedish folkhem and Brandt's \"dare more democracy\": left and right alike accept full employment, pensions, public health care and free universities. A healthy, educated workforce raises productivity year after year, but the bill keeps rising, business carries the burden and a generation that marched against Vietnam has little appetite for war."
 COLDWAR_era_welfare_consensus_avail: "Ruled by a democratic party with free elections"
 COLDWAR_era_national_corporatism: "Fatherland, Religion, Family"
 COLDWAR_era_national_corporatism_desc: "The slogan of the Greek colonels sums up a whole family of regimes: Salazar's Estado Novo, Franco's vertical syndicates and the South American juntas. Strikes are banned, unions are absorbed into state corporations, large families are rewarded and every young man serves. The universities are purged, the brightest emigrate, the police watch everyone and the democracies keep their distance."
 COLDWAR_era_national_corporatism_avail: "Ruled by a right-wing authoritarian or nationalist regime"
 COLDWAR_era_royal_prerogative: "The Royal Prerogative"
 COLDWAR_era_royal_prerogative_desc: "The king governs as well as reigns. Like the Shah's White Revolution, King Faisal's modernisation or Hassan II's Morocco, reforms come from the throne and the oil and mining royalties flow through the palace. The royal guard is loyal and the opposition fragmented, but the court, the princes and their favourites grow expensive and talent is chosen for loyalty rather than merit."
 COLDWAR_era_royal_prerogative_avail: "A monarch governs the country"
 COLDWAR_era_crown_above_politics: "The Crown Above Politics"
 COLDWAR_era_crown_above_politics_desc: "Governments come and go, the crown remains. From Buckingham Palace to Stockholm, The Hague and Tokyo, a constitutional monarch guarantees continuity: creditors lend more cheaply to a state whose order no election can overturn, investors trust the courts, and agitators and foreign agents find it hard to turn the army or the street against the king's government. The civil list is not cheap, ministers must work through royal ceremony, and a monarch who never takes sides restrains the government of the day."
 COLDWAR_era_crown_above_politics_avail: "A crowned head of state above an elected government"
