l_english:
# IMPERIA CW — Cold War: USA 1970 focus — English localisation.
 USA_1970_nixon_shortcut: "Nixon Administration, 1970-1972"
 USA_1970_elections_shortcut: "Presidential Terms"
 USA_1970_economy_shortcut: "Economy and Development"
 USA_1970_energy_shortcut: "Energy Security"
 USA_1970_society_shortcut: "Society and Federalism"
 USA_1970_foreign_shortcut: "Foreign Policy"
 USA_1970_defense_shortcut: "Armed Forces and Intelligence"
 USA_1970_NIX_A0: "A Presidency Under Pressure"
 USA_1970_NIX_A0_desc:0 "The White House faces a war abroad and distrust at home while pursuing an ambitious domestic agenda. Nixon must decide how far executive organisation can carry reform without deepening the political pressures already surrounding his presidency."
 USA_1970_NIX_A1: "New Federalism in Practice"
 USA_1970_NIX_A1_desc:0 "New Federalism promises to move responsibilities closer to state and local government. Putting it into practice means accepting less uniform federal direction in return for a smaller administrative burden and greater regional discretion."
 USA_1970_NIX_A2: "A Domestic Reform Window"
 USA_1970_NIX_A2_desc:0 "A domestic reform window depends on assembling support beyond the administration's most committed allies. The president can strengthen confidence through practical legislation, provided the costs and regulations do not dissolve the coalition needed to pass it."
 USA_1970_NIX_A3: "General Revenue Sharing"
 USA_1970_NIX_A3_desc:0 "General revenue sharing would give state and local authorities resources without directing every decision from Washington. The national government must finance that transfer while accepting that local priorities will not always follow the White House agenda."
 USA_1970_NIX_A4: "Clean Air and Safe Workplaces"
 USA_1970_NIX_A4_desc:0 "Clean air and workplace safety give federal reform a tangible purpose in ordinary life. Stronger standards require inspection and adjustment by industry, bringing public protection into conflict with demands for cheaper production and lighter regulation."
 USA_1970_NIX_A5: "Answer the Pentagon Papers"
 USA_1970_NIX_A5_desc:0 "The Pentagon Papers have made secrecy and public accountability immediate questions for the administration. Its response will shape both the intelligence apparatus and the trust Congress and citizens place in executive claims of necessity."
 USA_1970_NIX_A6: "The Special Investigations Unit"
 USA_1970_NIX_A6_desc:0 "A special investigations unit would give the White House a direct instrument against leaks and perceived threats. Expanding that reach risks further damage to the constitutional and political boundaries surrounding presidential power."
 USA_1970_NIX_A7: "Counterintelligence under Law"
 USA_1970_NIX_A7_desc:0 "Counterintelligence must remain capable of protecting the state without placing executive convenience above the law. Accepting enforceable limits can strengthen institutional confidence while restricting methods security officials would prefer to retain."
 USA_1970_NIX_A8: "Committee to Re-Elect the President"
 USA_1970_NIX_A8_desc:0 "The re-election committee will organise money, personnel and political effort around a second presidential mandate. Building that machinery can strengthen the campaign while making its fundraising and methods a source of greater scrutiny."
 USA_1970_NIX_A9: "An Aboveboard National Campaign"
 USA_1970_NIX_A9_desc:0 "An aboveboard campaign would accept clearer limits on money and covert advantage. The choice sacrifices some immediate political reach in return for a more defensible relationship with Congress and the public."
 USA_1970_NIX_A10: "Every Available Advantage"
 USA_1970_NIX_A10_desc:0 "Seeking every available advantage would bind campaign organisation more closely to the executive's political instruments. The president's supporters may gain leverage, but exposure could turn those methods into a liability for the administration itself."
 USA_1970_NIX_E0: "Stagflation at the Door"
 USA_1970_NIX_E0_desc:0 "Rising prices and uncertain employment undermine confidence in familiar economic prescriptions. The administration must choose how to divide the burden between restraint, intervention and the promise that markets will correct the imbalance themselves."
 USA_1970_NIX_E1: "Orthodox Restraint"
 USA_1970_NIX_E1_desc:0 "Orthodox restraint will give price stability priority over immediate expansion. Tighter conditions can reassure financial interests while making factories, construction and employment bear more of the adjustment."
 USA_1970_NIX_E2: "Jobs Before Prices"
 USA_1970_NIX_E2_desc:0 "Putting jobs before prices commits federal resources to economic activity while unemployment remains a political danger. The resulting stimulus must be weighed against fiscal strain and renewed doubts about inflation control."
 USA_1970_NIX_E3: "Let Markets Clear"
 USA_1970_NIX_E3_desc:0 "Allowing markets to clear would reduce barriers to investment and leave more decisions with private enterprise. The administration must accept that adjustment can impose concentrated losses before any wider recovery becomes visible."
 USA_1970_NIX_E4: "Phase I: The Ninety-Day Freeze"
 USA_1970_NIX_E4_desc:0 "A temporary wage-price freeze would interrupt the immediate contest between costs, wages and prices. Its appeal depends on the belief that a short pause can restore confidence without turning emergency controls into permanent administration."
 USA_1970_NIX_E5: "Tripartite Wage-Price Guidelines"
 USA_1970_NIX_E5_desc:0 "Tripartite guidelines bring labour, business and government into a negotiated effort to contain inflation. Compromise may spread responsibility more widely, but each participant must accept limits it would rather impose on someone else."
 USA_1970_NIX_E6: "The Dollar Crisis"
 USA_1970_NIX_E6_desc:0 "The dollar's external position connects domestic policy to the commitments of the monetary system. The government must decide whether preserving convertibility justifies further restraint or whether the existing settlement has become untenable."
 USA_1970_NIX_E7: "Close the Gold Window"
 USA_1970_NIX_E7_desc:0 "Closing the gold window would free the administration from a central obligation of Bretton Woods. The change offers room for domestic policy while forcing partners to confront a less predictable international monetary relationship."
 USA_1970_NIX_E8: "Defend Bretton Woods"
 USA_1970_NIX_E8_desc:0 "Defending Bretton Woods would preserve a familiar basis for monetary confidence. The price is a continuing obligation to support the dollar under rules that constrain the administration's domestic choices."
 USA_1970_NIX_D0: "The Controlled Substances Act"
 USA_1970_NIX_D0_desc:0 "The Controlled Substances Act gives federal drug policy a common legal framework. Its implementation must decide how public health, enforcement and the growing administrative apparatus will share responsibility for the problem."
 USA_1970_NIX_D1: "Treatment as the First Line"
 USA_1970_NIX_D1_desc:0 "Treatment as the first line recognises addiction as a continuing health and social burden. Expanding care demands resources and expertise that cannot be supplied by arrest statistics alone."
 USA_1970_NIX_D2: "Targeted Federal Interdiction"
 USA_1970_NIX_D2_desc:0 "Targeted federal interdiction concentrates enforcement on trafficking networks and supply routes. Intelligence and customs cooperation can improve focus, but will place greater demands on the agencies expected to sustain it."
 USA_1970_NIX_D3: "Declare a National War on Drugs"
 USA_1970_NIX_D3_desc:0 "A national war on drugs would make suppression a central political commitment of the administration. Its scale brings new enforcement capacity alongside larger fiscal, administrative and social consequences."
 USA_1970_NIX_D4: "Create SAODAP"
 USA_1970_NIX_D4_desc:0 "A dedicated drug-abuse prevention office can coordinate treatment responsibilities scattered across government. Its success depends on practical access to care and cooperation among agencies that have pursued different priorities."
 USA_1970_NIX_D5: "Customs and Intelligence Task Forces"
 USA_1970_NIX_D5_desc:0 "Customs and intelligence task forces can connect information about trafficking across institutional boundaries. Clear responsibilities will be needed if a coordinated response is to improve enforcement rather than simply enlarge its bureaucracy."
 USA_1970_NIX_D6: "Expand the BNDD"
 USA_1970_NIX_D6_desc:0 "Expanding the Bureau of Narcotics and Dangerous Drugs would deepen the federal enforcement effort. The government must provide trained personnel and oversight proportionate to the authority it is granting."
 USA_1970_NIX_V0: "The 1970 Vietnam Review"
 USA_1970_NIX_V0_desc:0 "The Vietnam review must confront American commitments, allied readiness and the political cost of continued war. Operational choices require a common assessment rather than separate promises to commanders, Congress and the public."
 USA_1970_NIX_V1: "An Operational Ceiling"
 USA_1970_NIX_V1_desc:0 "An operational ceiling places defined limits on the war effort. It can reduce uncertainty and administrative strain while restricting the freedom commanders claim they need to achieve their objectives."
 USA_1970_NIX_V2: "Vietnamization with Conditions"
 USA_1970_NIX_V2_desc:0 "Vietnamization with conditions would tie the transfer of responsibility to the capabilities and decisions of the South Vietnamese government. American support must have practical terms rather than assume that a timetable alone creates readiness."
 USA_1970_NIX_V3: "Maximum Pressure"
 USA_1970_NIX_V3_desc:0 "Maximum pressure seeks leverage through a greater willingness to use American power. It also exposes the administration to the military, political and financial consequences of an intensified campaign."
 USA_1970_NIX_V4: "Keep the Paris Channel Open"
 USA_1970_NIX_V4_desc:0 "The Paris channel offers a means of testing a negotiated outcome while fighting continues. Keeping it open requires the administration to distinguish useful bargaining from the expectation that diplomacy will simply ratify its preferred terms."
 USA_1970_NIX_V5: "Equip the ARVN"
 USA_1970_NIX_V5_desc:0 "Supporting the ARVN must address training, equipment and the responsibilities its government is prepared to assume. A request for cooperation needs an accepted agreement before American intentions can become a dependable allied commitment."
 USA_1970_NIX_V6: "Authorize Cross-Border Operations"
 USA_1970_NIX_V6_desc:0 "Cross-border operations would widen the geographic reach of American military pressure. Authorising them raises questions about sovereign boundaries, congressional authority and the costs of extending an already difficult war."
 USA_1970_NIX_V7: "Terms, Not a Timetable"
 USA_1970_NIX_V7_desc:0 "Insisting on terms rather than a timetable preserves bargaining flexibility. The administration must accept the continuing domestic and financial burden of a war whose end is not fixed in advance."
 USA_1970_NIX_V8: "Accept Congressional Operational Limits"
 USA_1970_NIX_V8_desc:0 "Congressional operational limits would place part of the war's direction under clearer legislative control. The arrangement can improve constitutional confidence while narrowing presidential and military discretion."
 USA_1970_NIX_V9: "Defend Commander-in-Chief Authority"
 USA_1970_NIX_V9_desc:0 "Defending commander-in-chief authority keeps operational decisions concentrated in the executive. The White House must weigh that freedom against the distrust and institutional opposition it may intensify."
 USA_1970_NIX_F0: "The Nixon Doctrine in Practice"
 USA_1970_NIX_F0_desc:0 "The Nixon Doctrine asks partners to carry more of their own defence while America remains a central source of support. Its implementation must distinguish sustainable assistance from obligations Washington can no longer carry indefinitely."
 USA_1970_NIX_F1: "A Secret Channel to Beijing"
 USA_1970_NIX_F1_desc:0 "A secret channel to Beijing offers contact outside the expectations of familiar alignments. Discretion can make exploration possible, but a durable opening will eventually require terms both governments are prepared to defend."
 USA_1970_NIX_F2: "Linkage and SALT"
 USA_1970_NIX_F2_desc:0 "Linkage seeks to connect strategic restraint with wider conduct between the superpowers. Arms negotiations can become part of that bargain, provided each government sees credible reasons to honour the resulting limits."
 USA_1970_NIX_F3: "Reassure the Alliances"
 USA_1970_NIX_F3_desc:0 "Allies need reassurance that a changing American strategy does not mean abandonment. Maintaining confidence requires concrete cooperation alongside a clearer account of the responsibilities Washington expects partners to assume."
 USA_1970_NIX_F4: "The President in Beijing"
 USA_1970_NIX_F4_desc:0 "A presidential visit to Beijing can turn private contact into a visible political opening. Its significance rests on an accepted relationship, while disagreements and the concerns of existing partners remain part of the diplomatic cost."
 USA_1970_NIX_F5: "The Moscow Summit"
 USA_1970_NIX_F5_desc:0 "A Moscow summit offers the opportunity to place strategic negotiations within a broader relationship. The administration must seek agreements its counterpart will accept without confusing an important meeting with the resolution of every rivalry."
 USA_1970_NIX_F6: "The Okinawa Reversion Agreement"
 USA_1970_NIX_F6_desc:0 "Okinawa's reversion requires agreement over sovereignty and the practical continuation of security arrangements. Negotiators must reconcile local and Japanese expectations with the American military responsibilities attached to the islands."
 USA_1970_NIX_F7: "The Jordanian Crisis"
 USA_1970_NIX_F7_desc:0 "The Jordanian crisis puts regional security and the limits of American influence under pressure. Washington must assess the parties' actual actions before choosing how far its diplomatic and military support should reach."
 USA_1970_NIX_F8: "Rely on the Israeli Deterrent"
 USA_1970_NIX_F8_desc:0 "Reliance on an Israeli deterrent favours regional military strength as a restraint on hostile action. The administration must consider how that support affects its relationships with other governments and the space for a negotiated settlement."
 USA_1970_NIX_F9: "Revive the Rogers Plan"
 USA_1970_NIX_F9_desc:0 "The Rogers approach seeks a diplomatic framework for reducing regional conflict. Reviving it requires proposals the parties can accept, rather than an assumption that American sponsorship alone supplies the missing agreement."
 USA_1970_NIX_M0: "The Gates Commission"
 USA_1970_NIX_M0_desc:0 "The Gates Commission asks whether military manpower can be sustained without the existing draft. Its recommendations must be judged against recruiting, personnel costs and the social obligations attached to national service."
 USA_1970_NIX_M1: "Begin the All-Volunteer Transition"
 USA_1970_NIX_M1_desc:0 "An all-volunteer transition would change the relationship between service and citizenship. Better recruitment and professional incentives require a budget capable of attracting and retaining the personnel the armed forces need."
 USA_1970_NIX_M2: "Reform and Retain Selective Service"
 USA_1970_NIX_M2_desc:0 "Reforming Selective Service would retain conscription while addressing the administration and fairness of the system. The government must defend both its manpower requirements and the obligations it imposes on those selected."
 USA_1970_1972_democratic_victory: "1972 Democratic Victory"
 USA_1970_1972_democratic_victory_desc:0 "A Democratic victory gives the new administration a mandate to challenge the executive practices and economic priorities of its predecessor. Congressional relations and the continuing war will determine how much of that promise can become policy."
 USA_1970_1972_republican_victory: "1972 Republican Victory"
 USA_1970_1972_republican_victory_desc:0 "A Republican victory renews the administration's claim to pursue its economic and diplomatic programme. The next term must turn electoral strength into commitments that Congress, state governments and foreign partners are prepared to support."
 USA_1970_1972_dem_1_end_the_imperial_presidency: "End the Imperial Presidency"
 USA_1970_1972_dem_1_end_the_imperial_presidency_desc:0 "Restoring limits on presidential power requires institutions capable of enforcing them. The new administration will give Congress a stronger place in decisions that previous executives treated as matters of unilateral national necessity."
 USA_1970_1972_dem_2_jobs_before_fine_tuning: "Jobs Before Fine-Tuning"
 USA_1970_1972_dem_2_jobs_before_fine_tuning_desc:0 "Employment will take priority over confidence in adjustments that have not reached struggling communities. Federal support can bring activity forward, while leaving the government responsible for the cost and inflationary risks of intervention."
 USA_1970_1972_dem_3_congressional_review_of_the_vietnam_war: "Congressional Review of the Vietnam War"
 USA_1970_1972_dem_3_congressional_review_of_the_vietnam_war_desc:0 "Congressional review would put the purposes and conduct of the Vietnam commitment before the legislature. Public scrutiny can strengthen constitutional authority while restricting operational freedom claimed by the executive."
 USA_1970_1972_dem_4_war_powers_and_conversion: "War Powers and Conversion"
 USA_1970_1972_dem_4_war_powers_and_conversion_desc:0 "War-powers reform and industrial conversion connect constitutional limits to the economy sustained by military commitments. The administration must provide a practical transition for workers and enterprises affected by a change in national priorities."
 USA_1970_1972_dem_5_emergency_employment_act: "Emergency Employment Act"
 USA_1970_1972_dem_5_emergency_employment_act_desc:0 "Emergency employment measures can reach communities where recovery has left too many workers behind. Projects must provide useful work and public value rather than make their continuation an end in itself."
 USA_1970_1972_dem_6_the_case_church_amendment: "The Case-Church Amendment"
 USA_1970_1972_dem_6_the_case_church_amendment_desc:0 "A legislative limit on military operations gives Congress a concrete instrument for ending commitments it will no longer finance. The choice changes the executive's room for manoeuvre and places greater responsibility on the public terms of policy."
 USA_1970_1972_dem_7_congressional_budget_and_impoundment_control_act: "Congressional Budget and Impoundment Control Act"
 USA_1970_1972_dem_7_congressional_budget_and_impoundment_control_act_desc:0 "Budget control must define the relationship between appropriations and executive discretion. Clearer congressional procedures can strengthen accountability while making fiscal decisions depend on a more demanding legislative bargain."
 USA_1970_1972_rep_1_a_strategy_of_leverage_in_vietnam: "A Strategy of Leverage in Vietnam"
 USA_1970_1972_rep_1_a_strategy_of_leverage_in_vietnam_desc:0 "A strategy of leverage seeks to improve negotiating terms through sustained pressure and allied support. Its advocates must defend the continuing commitments before a Congress and public increasingly attentive to the war's costs."
 USA_1970_1972_rep_2_new_federalism_in_practice: "New Federalism in Practice"
 USA_1970_1972_rep_2_new_federalism_in_practice_desc:0 "The next stage of New Federalism will give state and local institutions a larger role in public programmes. Washington must reconcile reduced central direction with responsibility for the uneven capacity of its partners."
 USA_1970_1972_rep_3_d_tente_with_leverage: "Détente with Leverage"
 USA_1970_1972_rep_3_d_tente_with_leverage_desc:0 "Détente with leverage combines negotiation with a continuing claim to strategic strength. The administration must make cooperation credible without asking supporters to regard every compromise as a retreat."
 USA_1970_1972_rep_4_pacific_trade_openings: "Pacific Trade Openings"
 USA_1970_1972_rep_4_pacific_trade_openings_desc:0 "Pacific trade offers producers access to growing commercial relationships. The opening must be supported by terms American firms can use and a policy able to address the industries exposed to stronger competition."
 USA_1970_1972_rep_5_state_export_development_grants: "State Export Development Grants"
 USA_1970_1972_rep_5_state_export_development_grants_desc:0 "State export grants can connect local producers to markets beyond familiar domestic customers. Professional commercial support will help smaller enterprises participate without turning assistance into a permanent subsidy for established interests."
 USA_1970_1972_rep_6_east_west_trade_negotiations: "East-West Trade Negotiations"
 USA_1970_1972_rep_6_east_west_trade_negotiations_desc:0 "East-West trade negotiations seek commercial gains across a strategic divide. The government must balance access and confidence with the security restrictions and political conditions attached to the relationship."
 USA_1970_1972_rep_7_the_trade_act_of_1974: "The Trade Act of 1974"
 USA_1970_1972_rep_7_the_trade_act_of_1974_desc:0 "A trade settlement must define how the executive negotiates and how exposed industries are treated. The administration will seek a framework capable of widening commerce while retaining sufficient congressional support."
 USA_1970_1972_common_energy_reorganization_act: "Energy Reorganization Act"
 USA_1970_1972_common_energy_reorganization_act_desc:0 "Energy responsibilities scattered across agencies make a common strategy harder to sustain. Reorganisation can clarify public authority, provided the new structure addresses practical supply and regulatory problems rather than merely rearranging offices."
 USA_1970_1976_democratic_victory: "1976 Democratic Victory"
 USA_1970_1976_democratic_victory_desc:0 "A Democratic mandate raises expectations of accountable government and a renewed social commitment. Economic uncertainty and energy dependence will test whether confidence in the new administration can be matched by practical results."
 USA_1970_1976_republican_victory: "1976 Republican Victory"
 USA_1970_1976_republican_victory_desc:0 "A Republican mandate offers support for restraint and enterprise during a difficult economic period. The administration must decide how to reduce public burdens without leaving recovery dependent on promises alone."
 USA_1970_1976_dem_1_government_as_good_as_its_promise: "Government as Good as Its Promise"
 USA_1970_1976_dem_1_government_as_good_as_its_promise_desc:0 "Government can recover confidence by meeting clear obligations and exposing decisions to scrutiny. The administration will ask its agencies to demonstrate competence as well as defend the moral purpose of public action."
 USA_1970_1976_dem_2_a_national_energy_effort: "A National Energy Effort"
 USA_1970_1976_dem_2_a_national_energy_effort_desc:0 "A national energy effort connects household consumption, industry and imported supply. Bringing those interests into one programme requires sustained public investment and a willingness to confront costs that individual consumers cannot solve alone."
 USA_1970_1976_dem_3_economic_stimulus_appropriations_act_of_1977: "Economic Stimulus Appropriations Act of 1977"
 USA_1970_1976_dem_3_economic_stimulus_appropriations_act_of_1977_desc:0 "Stimulus appropriations can bring work and public investment forward where private demand remains weak. The administration must use the temporary opening to create durable value rather than obligations unsupported by a later revenue base."
 USA_1970_1976_dem_4_create_the_department_of_energy: "Create the Department of Energy"
 USA_1970_1976_dem_4_create_the_department_of_energy_desc:0 "A Department of Energy would bring policy and coordination into a stronger common institution. Its authority must be matched by technical competence and cooperation with the agencies and industries it is expected to guide."
 USA_1970_1976_dem_5_employment_and_transport_reform: "Employment and Transport Reform"
 USA_1970_1976_dem_5_employment_and_transport_reform_desc:0 "Employment and transport policy can reinforce one another when investment connects people to useful work. The government will seek improvements that serve everyday economic activity as well as immediate recovery."
 USA_1970_1976_dem_6_urban_development_action_grants: "Urban Development Action Grants"
 USA_1970_1976_dem_6_urban_development_action_grants_desc:0 "Urban development grants can help communities assemble investment that private finance will not undertake alone. Public support must be tied to credible local projects and benefits that extend beyond their developers."
 USA_1970_1976_dem_7_humphrey_hawkins_full_employment_act: "Humphrey-Hawkins Full Employment Act"
 USA_1970_1976_dem_7_humphrey_hawkins_full_employment_act_desc:0 "A full-employment commitment makes national economic objectives more explicit. Its credibility will depend on the tools and resources Congress is willing to support when price stability and employment pull policy in different directions."
 USA_1970_1976_rep_1_inflation_first: "Inflation First"
 USA_1970_1976_rep_1_inflation_first_desc:0 "Inflation-first policy asks households and firms to accept restraint in pursuit of more stable expectations. The government must account for the immediate burden placed on employment and investment while defending the longer-term objective."
 USA_1970_1976_rep_2_unblock_american_enterprise: "Unblock American Enterprise"
 USA_1970_1976_rep_2_unblock_american_enterprise_desc:0 "Removing obstacles to enterprise can widen investment and reduce the cost of compliance. Reform must distinguish rules that obstruct productive activity from protections whose removal merely shifts costs onto other citizens."
 USA_1970_1976_rep_3_capital_formation_program: "Capital Formation Program"
 USA_1970_1976_rep_3_capital_formation_program_desc:0 "Capital formation requires predictable rules and incentives to invest beyond the next quarter. The programme will favour new productive capacity while accepting less immediate revenue from the enterprises it seeks to encourage."
 USA_1970_1976_rep_4_unlock_domestic_energy: "Unlock Domestic Energy"
 USA_1970_1976_rep_4_unlock_domestic_energy_desc:0 "Domestic energy development can reduce reliance on external supply. The administration must reconcile access and investment with regulatory responsibilities and the local consequences of a wider extraction programme."
 USA_1970_1976_rep_5_a_balanced_budget_compromise: "A Balanced-Budget Compromise"
 USA_1970_1976_rep_5_a_balanced_budget_compromise_desc:0 "A balanced-budget compromise requires agreement over real spending and revenue choices. Its political value depends on sharing responsibility rather than making commitments whose costs are deferred beyond the present administration."
 USA_1970_1976_rep_6_accelerated_depreciation_and_investment_credit: "Accelerated Depreciation and Investment Credit"
 USA_1970_1976_rep_6_accelerated_depreciation_and_investment_credit_desc:0 "Depreciation rules and investment credits can make modern equipment more attractive to firms. The treasury will forgo revenue now in the expectation that productive renewal creates a stronger economic base later."
 USA_1970_1976_rep_7_kemp_roth_growth_program: "Kemp-Roth Growth Program"
 USA_1970_1976_rep_7_kemp_roth_growth_program_desc:0 "The growth programme seeks a broader investment response through lower tax burdens. Its advocates must persuade Congress that the expected gains justify the immediate pressure on federal revenue and the competing demands on the budget."
 USA_1970_1976_common_national_energy_act: "National Energy Act"
 USA_1970_1976_common_national_energy_act_desc:0 "A national energy act must connect incentives, conservation and public responsibilities in a framework capable of implementation. Its compromises will shape how the country distributes the cost of reducing energy vulnerability."
 USA_1970_1980_democratic_victory: "1980 Democratic Victory"
 USA_1970_1980_democratic_victory_desc:0 "A renewed Democratic mandate places recovery and the social contract at the centre of government. The administration must demonstrate that public investment can improve productive capacity without losing control of continuing fiscal obligations."
 USA_1970_1980_republican_victory: "1980 Republican Victory"
 USA_1970_1980_republican_victory_desc:0 "A Republican mandate gives the administration an opportunity to change taxes, regulation and defence priorities. Translating that programme into government will require choices over the public costs of incentives and renewed strategic commitments."
 USA_1970_1980_dem_1_targeted_recovery_and_full_employment: "Targeted Recovery and Full Employment"
 USA_1970_1980_dem_1_targeted_recovery_and_full_employment_desc:0 "Targeted recovery will concentrate support on workers and regions left outside general growth. Employment objectives must be linked to productive opportunities if public intervention is to create more than temporary relief."
 USA_1970_1980_dem_2_modernize_the_social_contract: "Modernize the Social Contract"
 USA_1970_1980_dem_2_modernize_the_social_contract_desc:0 "Modernising the social contract requires services and protections suited to changing work and family life. The government must improve their practical value while building a revenue base capable of carrying them."
 USA_1970_1980_dem_3_arms_control_with_readiness: "Arms Control with Readiness"
 USA_1970_1980_dem_3_arms_control_with_readiness_desc:0 "Arms control can reduce danger without abandoning the maintenance of existing forces. Negotiations and readiness must support the same strategy rather than become rival promises made to different constituencies."
 USA_1970_1980_dem_4_the_industrial_modernization_act: "The Industrial Modernization Act"
 USA_1970_1980_dem_4_the_industrial_modernization_act_desc:0 "Industrial modernisation will support equipment, skills and methods that firms struggle to finance on their own. Clear standards can help public investment improve competitiveness without simply protecting obsolete production."
 USA_1970_1980_dem_5_a_peace_dividend_for_human_security: "A Peace Dividend for Human Security"
 USA_1970_1980_dem_5_a_peace_dividend_for_human_security_desc:0 "A peace dividend would redirect resources from military priorities towards domestic security in work, health and community life. The government must make that transition credible without neglecting the forces and commitments it retains."
 USA_1970_1980_dem_6_regional_development_banks: "Regional Development Banks"
 USA_1970_1980_dem_6_regional_development_banks_desc:0 "Regional development banks can bring investment decisions closer to local productive needs. Professional lending standards will be essential if broader access is to create viable enterprises rather than another protected political clientele."
 USA_1970_1980_dem_7_a_national_industrial_policy: "A National Industrial Policy"
 USA_1970_1980_dem_7_a_national_industrial_policy_desc:0 "A national industrial policy seeks coordination between finance, skills and productive investment. Its institutions must learn from actual results and avoid treating every established industry as a permanent national priority."
 USA_1970_1980_rep_1_across_the_board_tax_relief: "Across-the-Board Tax Relief"
 USA_1970_1980_rep_1_across_the_board_tax_relief_desc:0 "Across-the-board relief promises households and firms a larger claim on their income. The administration must defend its expected effect on activity while confronting the immediate revenue sacrificed by the federal government."
 USA_1970_1980_rep_2_roll_back_the_administrative_state: "Roll Back the Administrative State"
 USA_1970_1980_rep_2_roll_back_the_administrative_state_desc:0 "Reducing the reach of federal administration gives private and state institutions more discretion. The programme must decide which responsibilities can be removed and which costs will simply reappear elsewhere."
 USA_1970_1980_rep_3_rearm_and_reassure: "Rearm and Reassure"
 USA_1970_1980_rep_3_rearm_and_reassure_desc:0 "Rearmament offers allies a more visible American commitment and suppliers a larger flow of orders. Sustaining it requires trained personnel and finances capable of supporting more than the initial procurement programme."
 USA_1970_1980_rep_4_supply_side_investment_zones: "Supply-Side Investment Zones"
 USA_1970_1980_rep_4_supply_side_investment_zones_desc:0 "Investment zones will use targeted incentives to attract enterprise into selected places. Their success depends on productive activity that remains useful after the advantages of location and tax treatment have been counted."
 USA_1970_1980_rep_5_restore_the_defense_industrial_base: "Restore the Defense Industrial Base"
 USA_1970_1980_rep_5_restore_the_defense_industrial_base_desc:0 "The defence industrial base needs suppliers, tooling and skills capable of meeting a sustained programme. Restoring them will strengthen military production while drawing investment towards priorities chosen by the national security state."
 USA_1970_1980_rep_6_the_1981_budget_resolution: "The 1981 Budget Resolution"
 USA_1970_1980_rep_6_the_1981_budget_resolution_desc:0 "The budget resolution must turn the administration's competing promises into a congressional agreement. Spending, taxes and strategic commitments will reveal where the governing coalition is prepared to bear the cost of its programme."
 USA_1970_1980_rep_7_the_economic_recovery_tax_act: "The Economic Recovery Tax Act"
 USA_1970_1980_rep_7_the_economic_recovery_tax_act_desc:0 "A recovery tax act seeks a lasting change in incentives for income and investment. Its terms must connect the promise of faster growth to a fiscal settlement the government can actually administer."
 USA_1970_1980_common_social_security_compromise: "Social Security Compromise"
 USA_1970_1980_common_social_security_compromise_desc:0 "A Social Security compromise must reconcile confidence in promised benefits with the resources required to finance them. An agreement crossing party lines can give the settlement greater durability than a temporary budget victory."
 USA_1970_1984_democratic_victory: "1984 Democratic Victory"
 USA_1970_1984_democratic_victory_desc:0 "A Democratic victory gives the administration a mandate to reconsider military expenditure and the sources of industrial strength. Its programme must join constitutional accountability to a practical response for workers and communities affected by changing priorities."
 USA_1970_1984_republican_victory: "1984 Republican Victory"
 USA_1970_1984_republican_victory_desc:0 "A Republican victory renews support for strategic strength and a government more closely aligned with enterprise. The administration must manage the budgetary and institutional demands created by the programme it seeks to extend."
 USA_1970_1984_dem_1_defense_conversion_and_industrial_renewal: "Defense Conversion and Industrial Renewal"
 USA_1970_1984_dem_1_defense_conversion_and_industrial_renewal_desc:0 "Defence conversion can redirect skills and equipment towards civilian production. Industrial renewal must provide credible opportunities for workers and firms rather than assume that reduced military orders automatically create a new market."
 USA_1970_1984_dem_2_a_verifiable_nuclear_freeze: "A Verifiable Nuclear Freeze"
 USA_1970_1984_dem_2_a_verifiable_nuclear_freeze_desc:0 "A nuclear freeze needs verification sufficient to make restraint acceptable to both sides. The government will seek a negotiated limit while addressing the security concerns of officials and allies asked to support it."
 USA_1970_1984_dem_3_congressional_control_of_covert_wars: "Congressional Control of Covert Wars"
 USA_1970_1984_dem_3_congressional_control_of_covert_wars_desc:0 "Congressional control would put covert commitments under clearer democratic responsibility. Oversight can constrain abuses while reducing the freedom intelligence officials claim they need to pursue opportunities abroad."
 USA_1970_1984_dem_4_the_industrial_skills_compact: "The Industrial Skills Compact"
 USA_1970_1984_dem_4_the_industrial_skills_compact_desc:0 "An industrial skills compact connects education and production to a shared modernisation effort. Public support should widen access to useful training and help firms adopt methods their existing workforce can sustain."
 USA_1970_1984_dem_5_technology_security_under_law: "Technology Security under Law"
 USA_1970_1984_dem_5_technology_security_under_law_desc:0 "Technological security requires a relationship between research, commerce and lawful intelligence activity. Clear boundaries can protect valuable capabilities without allowing national security claims to displace every other public responsibility."
 USA_1970_1984_dem_6_technology_extension_partnerships: "Technology Extension Partnerships"
 USA_1970_1984_dem_6_technology_extension_partnerships_desc:0 "Technology extension can bring practical expertise to firms unable to maintain their own large research establishments. Partnerships must translate innovation into usable production methods rather than another layer of promotional administration."
 USA_1970_1984_dem_7_omnibus_trade_and_competitiveness_act_of_1988: "Omnibus Trade and Competitiveness Act of 1988"
 USA_1970_1984_dem_7_omnibus_trade_and_competitiveness_act_of_1988_desc:0 "Trade and competitiveness legislation must address both outside competition and domestic productive weaknesses. A lasting framework will connect commercial rules to the skills and investment needed by American enterprises."
 USA_1970_1984_rep_1_the_1985_budget_resolution: "The 1985 Budget Resolution"
 USA_1970_1984_rep_1_the_1985_budget_resolution_desc:0 "The budget resolution must reconcile fiscal restraint with the administration's strategic programme. Congressional agreement will expose which priorities retain protection and where the government expects the burden of adjustment to fall."
 USA_1970_1984_rep_2_a_strategic_defense_shield: "A Strategic Defense Shield"
 USA_1970_1984_rep_2_a_strategic_defense_shield_desc:0 "A strategic defence shield promises protection through demanding technological development. The effort can mobilise research and industry, but its cost and strategic implications require a commitment extending far beyond a declaration of ambition."
 USA_1970_1984_rep_3_negotiate_from_strength: "Negotiate from Strength"
 USA_1970_1984_rep_3_negotiate_from_strength_desc:0 "Negotiating from strength seeks to make an arms agreement compatible with continued military credibility. The administration must turn that leverage into terms its counterpart will accept and its own supporters will honour."
 USA_1970_1984_rep_4_the_high_technology_defense_economy: "The High-Technology Defense Economy"
 USA_1970_1984_rep_4_the_high_technology_defense_economy_desc:0 "High-technology defence orders can support specialised research and production. Their wider value depends on a capable supplier base and the management of commitments that can become expensive to change once established."
 USA_1970_1984_rep_5_a_forward_doctrine_with_guardrails: "A Forward Doctrine with Guardrails"
 USA_1970_1984_rep_5_a_forward_doctrine_with_guardrails_desc:0 "A forward doctrine requires readiness beyond the continental homeland and clear limits on how that power will be used. Defined responsibilities can make commitments more credible without treating every regional crisis as an unlimited mission."
 USA_1970_1984_rep_6_reform_defense_procurement: "Reform Defense Procurement"
 USA_1970_1984_rep_6_reform_defense_procurement_desc:0 "Procurement reform must make the relationship between military requirements and industrial delivery more accountable. Better methods can improve the value of defence spending while challenging established interests within services and suppliers."
 USA_1970_1984_rep_7_goldwater_nichols_department_of_defense_reorganization_act: "Goldwater-Nichols Department of Defense Reorganization Act"
 USA_1970_1984_rep_7_goldwater_nichols_department_of_defense_reorganization_act_desc:0 "Defence reorganisation seeks clearer joint responsibilities across service boundaries. Its success depends on authority and professional practice that can overcome rival institutions without losing their specialised competence."
 USA_1970_1984_common_immigration_reform_and_control_act: "Immigration Reform and Control Act"
 USA_1970_1984_common_immigration_reform_and_control_act_desc:0 "Immigration reform must reconcile residence, employment and the enforcement of public rules. A durable settlement needs an administration capable of carrying out the bargain rather than leave employers and households in continuing uncertainty."
 USA_1970_1988_democratic_victory: "1988 Democratic Victory"
 USA_1970_1988_democratic_victory_desc:0 "A Democratic mandate comes as strategic and financial conditions are changing. The administration must decide how to use reduced military pressure while addressing the institutions and communities exposed by domestic financial failures."
 USA_1970_1988_republican_victory: "1988 Republican Victory"
 USA_1970_1988_republican_victory_desc:0 "A Republican mandate gives the government responsibility for preserving confidence during international change and domestic financial strain. Continuity must be matched by decisions capable of dealing with problems inherited from earlier expansion."
 USA_1970_1988_dem_1_claim_the_peace_dividend: "Claim the Peace Dividend"
 USA_1970_1988_dem_1_claim_the_peace_dividend_desc:0 "A peace dividend would turn changing strategic conditions into room for domestic priorities. The government must judge which commitments can be reduced responsibly and how the released resources will serve productive public purposes."
 USA_1970_1988_dem_2_resolve_the_savings_and_loan_crisis: "Resolve the Savings and Loan Crisis"
 USA_1970_1988_dem_2_resolve_the_savings_and_loan_crisis_desc:0 "Resolving savings-and-loan failures requires public authority able to distinguish recoverable institutions from losses that must be recognised. Restoring confidence will impose costs that ordinary depositors and the treasury cannot simply avoid."
 USA_1970_1988_dem_3_convert_arms_to_industry: "Convert Arms to Industry"
 USA_1970_1988_dem_3_convert_arms_to_industry_desc:0 "Converting military capacity towards civilian industry requires customers, investment and suitable skills. The transition should preserve useful productive capability rather than assume that any military plant can immediately sell to a different market."
 USA_1970_1988_dem_4_financial_institutions_reform_recovery_and_enforcement_act: "Financial Institutions Reform, Recovery, and Enforcement Act"
 USA_1970_1988_dem_4_financial_institutions_reform_recovery_and_enforcement_act_desc:0 "Financial reform must address failed institutions and the standards that allowed losses to accumulate. Recovery and enforcement belong together if public intervention is to restore confidence rather than conceal the same weaknesses."
 USA_1970_1988_dem_5_worker_adjustment_assistance: "Worker Adjustment Assistance"
 USA_1970_1988_dem_5_worker_adjustment_assistance_desc:0 "Workers displaced by changing industrial and defence priorities need a practical route into new employment. Adjustment assistance will be most useful when training and income support connect to opportunities that actually exist."
 USA_1970_1988_dem_6_create_the_resolution_trust_corporation: "Create the Resolution Trust Corporation"
 USA_1970_1988_dem_6_create_the_resolution_trust_corporation_desc:0 "A dedicated resolution institution can give the government a clearer mechanism for handling failed financial assets. Its mandate must make losses visible while seeking an orderly recovery of value for the public."
 USA_1970_1988_dem_7_the_peace_dividend_budget: "The Peace Dividend Budget"
 USA_1970_1988_dem_7_the_peace_dividend_budget_desc:0 "A peace-dividend budget must turn strategic change into actual choices over spending and revenue. The administration must demonstrate how reduced commitments support domestic goals without neglecting the capabilities it still promises to maintain."
 USA_1970_1988_rep_1_a_federal_resolution_of_the_s_l_crisis: "A Federal Resolution of the S&L Crisis"
 USA_1970_1988_rep_1_a_federal_resolution_of_the_s_l_crisis_desc:0 "Federal resolution will place the government behind an orderly response to financial failures. Its responsibilities include protecting confidence and recognising the cost of losses rather than leaving weak institutions to expand their claims indefinitely."
 USA_1970_1988_rep_2_steward_a_changing_soviet_order: "Steward a Changing Soviet Order"
 USA_1970_1988_rep_2_steward_a_changing_soviet_order_desc:0 "A changing Soviet order presents opportunities for reduced tension alongside new uncertainty. American policy must respond to actual developments without assuming that political change has already settled every strategic concern."
 USA_1970_1988_rep_3_fiscal_responsibility_without_surrender: "Fiscal Responsibility without Surrender"
 USA_1970_1988_rep_3_fiscal_responsibility_without_surrender_desc:0 "Fiscal responsibility requires constraints on commitments the government would otherwise prefer to preserve. The administration must build a bargain that recognises those limits while retaining the core of its strategic and domestic programme."
 USA_1970_1988_rep_4_collective_security_limited_aims: "Collective Security, Limited Aims"
 USA_1970_1988_rep_4_collective_security_limited_aims_desc:0 "Collective security can share the burden of responding to aggression. Limited aims and accepted commitments will be essential if cooperation is to avoid becoming an open-ended American obligation."
 USA_1970_1988_rep_5_enforce_budget_rules: "Enforce Budget Rules"
 USA_1970_1988_rep_5_enforce_budget_rules_desc:0 "Budget rules matter only when inconvenient choices remain subject to them. Enforcing the framework can strengthen confidence, but will require the governing coalition to accept limits on favoured spending and tax commitments."
 USA_1970_1988_rep_6_base_realignment_and_closure: "Base Realignment and Closure"
 USA_1970_1988_rep_6_base_realignment_and_closure_desc:0 "Realigning and closing bases can adapt the military establishment to changing requirements. The government must address local economic dependence while distinguishing useful infrastructure from capacity retained chiefly through political protection."
 USA_1970_1988_rep_7_the_1990_budget_agreement: "The 1990 Budget Agreement"
 USA_1970_1988_rep_7_the_1990_budget_agreement_desc:0 "A budget agreement must distribute responsibility for the costs of restraint and revenue. A bargain capable of surviving partisan pressure can give fiscal policy greater stability than a succession of temporary fixes."
 USA_1970_1988_common_americans_with_disabilities_act: "Americans with Disabilities Act"
 USA_1970_1988_common_americans_with_disabilities_act_desc:0 "Equal access for Americans with disabilities requires changes in employment, services and public space. The commitment will be judged by practical participation as well as the legal recognition of rights."
 USA_1970_1992_democratic_victory: "1992 Democratic Victory"
 USA_1970_1992_democratic_victory_desc:0 "A Democratic victory opens a contest over how investment, social opportunity and deficit reduction should fit together. The administration needs a coalition capable of financing its ambitions without treating fiscal responsibility as someone else's task."
 USA_1970_1992_republican_victory: "1992 Republican Victory"
 USA_1970_1992_republican_victory_desc:0 "A Republican victory gives the government an opportunity to recast federal obligations and the role of the states. Its mandate must become a workable settlement over budgets, welfare and the responsibilities of public institutions."
 USA_1970_1992_dem_1_a_deficit_reduction_coalition: "A Deficit-Reduction Coalition"
 USA_1970_1992_dem_1_a_deficit_reduction_coalition_desc:0 "Deficit reduction requires a coalition willing to accept concrete revenue and spending choices. The administration must demonstrate that restraint can support confidence without abandoning the productive investments central to its mandate."
 USA_1970_1992_dem_2_an_investment_led_recovery: "An Investment-Led Recovery"
 USA_1970_1992_dem_2_an_investment_led_recovery_desc:0 "An investment-led recovery would place skills, infrastructure and productive opportunity ahead of short-term relief alone. Public commitments must be chosen for returns that can justify their cost beyond the present administration."
 USA_1970_1992_dem_3_pay_as_you_go_budget_rules: "Pay-As-You-Go Budget Rules"
 USA_1970_1992_dem_3_pay_as_you_go_budget_rules_desc:0 "Pay-as-you-go rules ask new commitments to identify their financing. Enforcing that discipline can strengthen fiscal confidence while making every attractive proposal part of a more demanding legislative bargain."
 USA_1970_1992_dem_4_community_investment_and_health_security: "Community Investment and Health Security"
 USA_1970_1992_dem_4_community_investment_and_health_security_desc:0 "Community investment and health security connect economic opportunity to the stability of ordinary households. The administration must provide institutions and resources capable of delivering those commitments across very different local conditions."
 USA_1970_1992_dem_5_expand_the_earned_income_tax_credit: "Expand the Earned Income Tax Credit"
 USA_1970_1992_dem_5_expand_the_earned_income_tax_credit_desc:0 "An expanded earned-income credit would support lower-paid work through the tax system. Its reach depends on access and administration, while the government accepts a continuing fiscal commitment to the households it intends to assist."
 USA_1970_1992_dem_6_community_health_and_opportunity_grants: "Community Health and Opportunity Grants"
 USA_1970_1992_dem_6_community_health_and_opportunity_grants_desc:0 "Community grants can give local institutions resources to address health and opportunity together. Clear priorities and accountable delivery will determine whether support reaches households beyond the organisations best equipped to obtain federal funds."
 USA_1970_1992_dem_7_omnibus_budget_reconciliation_act_of_1993: "Omnibus Budget Reconciliation Act of 1993"
 USA_1970_1992_dem_7_omnibus_budget_reconciliation_act_of_1993_desc:0 "Budget reconciliation can bring revenue and spending changes into a single governing settlement. Its passage will require the coalition to bear the political cost of choices that cannot all be presented as immediate gains."
 USA_1970_1992_rep_1_balance_the_budget_by_statute: "Balance the Budget by Statute"
 USA_1970_1992_rep_1_balance_the_budget_by_statute_desc:0 "A statutory commitment to balance the budget would constrain later fiscal choices. Its credibility depends on rules Congress and the executive will follow when economic conditions make compliance politically difficult."
 USA_1970_1992_rep_2_responsibility_before_entitlement: "Responsibility before Entitlement"
 USA_1970_1992_rep_2_responsibility_before_entitlement_desc:0 "Placing responsibility before entitlement would change the conditions attached to public support. The government must decide how expectations of work and independence relate to households whose opportunities remain limited."
 USA_1970_1992_rep_3_return_power_to_the_states: "Return Power to the States"
 USA_1970_1992_rep_3_return_power_to_the_states_desc:0 "Returning power to the states allows more local discretion over public programmes. Washington must accept less uniform provision while defining which national responsibilities remain enforceable."
 USA_1970_1992_rep_4_state_welfare_compacts: "State Welfare Compacts"
 USA_1970_1992_rep_4_state_welfare_compacts_desc:0 "State welfare compacts can exchange flexibility for explicit commitments over support and administration. Their terms must be practical enough to judge performance rather than merely relocate political responsibility."
 USA_1970_1992_rep_5_block_grants_to_the_states: "Block Grants to the States"
 USA_1970_1992_rep_5_block_grants_to_the_states_desc:0 "Block grants replace detailed federal direction with a broader financial allocation. State governments gain discretion while assuming greater responsibility for how limited resources meet continuing needs."
 USA_1970_1992_rep_6_enterprise_zones: "Enterprise Zones"
 USA_1970_1992_rep_6_enterprise_zones_desc:0 "Enterprise zones use place-based incentives to attract investment and work. Their success depends on productive activity and access for local residents rather than the relocation of firms seeking temporary advantages."
 USA_1970_1992_rep_7_personal_responsibility_and_work_opportunity_act: "Personal Responsibility and Work Opportunity Act"
 USA_1970_1992_rep_7_personal_responsibility_and_work_opportunity_act_desc:0 "Welfare reform will redefine the relationship between federal support, state administration and individual obligation. The settlement must establish workable rules while acknowledging the consequences for households whose support is being changed."
 USA_1970_1992_common_telecommunications_act: "Telecommunications Act"
 USA_1970_1992_common_telecommunications_act_desc:0 "Telecommunications reform must adapt public rules to changing networks and markets. Greater commercial freedom can encourage investment while raising new questions about competition, access and the responsibilities of providers."
 USA_1970_1996_democratic_victory: "1996 Democratic Victory"
 USA_1970_1996_democratic_victory_desc:0 "A renewed Democratic mandate brings fiscal discipline into contact with the opportunities and risks of a more connected economy. The administration must show how technological change and wider commerce can support citizens beyond the most successful sectors."
 USA_1970_1996_republican_victory: "1996 Republican Victory"
 USA_1970_1996_republican_victory_desc:0 "A Republican mandate gives the administration an opportunity to combine fiscal reform with a narrower view of federal responsibilities. New technology and changing security requirements will test the practical limits of that programme."
 USA_1970_1996_dem_1_lock_in_fiscal_discipline: "Lock In Fiscal Discipline"
 USA_1970_1996_dem_1_lock_in_fiscal_discipline_desc:0 "Fiscal discipline must survive the temptation to treat every favourable development as permanent room for spending. A stronger framework can give future decisions a clearer basis while limiting the government's immediate freedom to promise new commitments."
 USA_1970_1996_dem_2_responsible_globalization: "Responsible Globalization"
 USA_1970_1996_dem_2_responsible_globalization_desc:0 "Wider global commerce creates gains and concentrated adjustment costs. Responsible participation requires domestic institutions able to help workers and communities respond without assuming that aggregate growth settles every local loss."
 USA_1970_1996_dem_3_modernize_federal_information_systems: "Modernize Federal Information Systems"
 USA_1970_1996_dem_3_modernize_federal_information_systems_desc:0 "Federal information systems support services and decisions across the administration. Modernisation must connect new equipment to trained staff and dependable procedures rather than simply replace one generation of incompatible machinery with another."
 USA_1970_1996_dem_4_globalization_adjustment_and_digital_classrooms: "Globalization Adjustment and Digital Classrooms"
 USA_1970_1996_dem_4_globalization_adjustment_and_digital_classrooms_desc:0 "Adjustment support and digital classrooms can widen access to a changing economy. The programme must give workers and students usable skills rather than treat the availability of technology as sufficient preparation in itself."
 USA_1970_1996_rep_1_the_1997_budget_and_tax_settlement: "The 1997 Budget and Tax Settlement"
 USA_1970_1996_rep_1_the_1997_budget_and_tax_settlement_desc:0 "A budget and tax settlement must connect promised relief to the responsibilities the government retains. Its durability will depend on a coalition prepared to defend the resulting balance when individual provisions become politically costly."
 USA_1970_1996_rep_2_preparedness_without_nation_building: "Preparedness without Nation-Building"
 USA_1970_1996_rep_2_preparedness_without_nation_building_desc:0 "Preparedness without nation-building seeks a force ready for defined security tasks and restrained in its wider commitments. Clear missions will matter if caution is to become a strategy rather than uncertainty presented as principle."
 USA_1970_1996_rep_3_internet_tax_freedom_act: "Internet Tax Freedom Act"
 USA_1970_1996_rep_3_internet_tax_freedom_act_desc:0 "Internet tax policy will shape the conditions under which new commercial services develop. A lighter burden may support growth while limiting the revenue and discretion available to governments facing the costs of a changing market."
 USA_1970_1996_rep_4_information_age_force_modernization: "Information-Age Force Modernization"
 USA_1970_1996_rep_4_information_age_force_modernization_desc:0 "Information-age modernisation must connect sensors, communications and trained personnel. Better equipment will improve military capability only when doctrine and support allow services to use it together."
 USA_1970_1996_common_y2k_readiness_act: "Y2K Readiness Act"
 USA_1970_1996_common_y2k_readiness_act_desc:0 "The date change exposes dependencies hidden inside public and commercial information systems. Readiness requires testing, replacement and coordination before failures become a disruption that no single agency can repair alone."
 USA_1970_E0: "The Industrial Question"
 USA_1970_E0_desc:0 "American industrial strength rests on regions and sectors facing very different pressures. The government must choose how public support, private investment and the demands of national defence should shape the next productive economy."
 USA_1970_E1: "Federal Industrial Grants"
 USA_1970_E1_desc:0 "Federal industrial grants can direct resources towards projects private finance will not undertake alone. Their terms must reward useful capacity and local opportunity rather than protect every enterprise able to obtain political support."
 USA_1970_E2: "Market Investment Zones"
 USA_1970_E2_desc:0 "Market investment zones will offer selected locations more attractive conditions for enterprise. The programme must translate incentives into productive activity instead of merely moving firms between competing public subsidies."
 USA_1970_E3: "Great Plains Modernization"
 USA_1970_E3_desc:0 "Modernisation in the Great Plains can connect rural production to better equipment and services. Investment should strengthen the region's existing capabilities without assuming that every community can follow the same industrial model."
 USA_1970_E4: "Metropolitan Office Boom"
 USA_1970_E4_desc:0 "Metropolitan offices can support a growing commercial and professional economy. Their expansion also places demands on infrastructure and local administration, making the relationship between development and public costs increasingly important."
 USA_1970_E5: "Interstate Renewal"
 USA_1970_E5_desc:0 "The interstate network needs renewal to remain a dependable foundation for commerce. Maintaining links between regions can make existing productive capacity more useful without relying entirely on the construction of new destinations."
 USA_1970_E6: "Defense Procurement Corridors"
 USA_1970_E6_desc:0 "Defence procurement corridors connect suppliers, specialised skills and public orders. A coordinated programme can deepen military production while drawing resources towards industries whose demand depends heavily on federal decisions."
 USA_1970_E7: "Targeted Growth Programs"
 USA_1970_E7_desc:0 "Targeted growth programmes seek opportunities obscured by national averages. Public support must identify viable local strengths and a credible path beyond the period in which assistance makes investment easier."
 USA_1970_E8: "Loosen Metropolitan Zoning"
 USA_1970_E8_desc:0 "Looser metropolitan zoning can open more land and buildings to development. The benefits of a wider supply must be weighed against the public services and infrastructure needed by expanding urban communities."
 USA_1970_E9: "North American Trade Agreements"
 USA_1970_E9_desc:0 "North American trade arrangements can connect producers across national markets. Negotiations must address access and adjustment together, with actual partner agreement establishing the obligations each government accepts."
 USA_1970_E10: "The Information Economy"
 USA_1970_E10_desc:0 "The information economy draws on research, communications and a workforce able to use new systems. Its development requires investment in those foundations rather than an assumption that technological promise will spread its benefits unaided."
 USA_1970_E11: "The Post-Industrial Bargain"
 USA_1970_E11_desc:0 "A post-industrial bargain must connect new opportunity to communities whose older sources of employment are changing. Skills and investment can help, but the government must acknowledge that the transition imposes real and uneven costs."
 USA_1970_N0: "America's Energy Vulnerability"
 USA_1970_N0_desc:0 "America's energy position combines large domestic resources with exposure to external supply and changing demand. A national strategy must confront the costs of dependence without treating every alternative as immediately available."
 USA_1970_N1: "Conservation Is a Resource"
 USA_1970_N1_desc:0 "Conservation can reduce the energy needed to sustain ordinary economic activity. Better equipment and habits require investment and coordination, but can improve resilience without waiting for another major source of supply."
 USA_1970_N2: "The Continental Hydrocarbon Frontier"
 USA_1970_N2_desc:0 "Continental hydrocarbons offer a route towards stronger domestic supply. Development must connect access, extraction and transport while addressing the environmental and regulatory responsibilities attached to a larger programme."
 USA_1970_N3: "Standardize the Nuclear Buildout"
 USA_1970_N3_desc:0 "Standardisation can make nuclear construction and operation more consistent across projects. A common approach still needs technical competence and public confidence in the institutions responsible for safety and delivery."
 USA_1970_N4: "The Strategic Petroleum Reserve"
 USA_1970_N4_desc:0 "A strategic petroleum reserve gives the government a buffer against disrupted supply. Building and maintaining it requires resources now so that a future emergency need not be answered entirely through immediate scarcity."
 USA_1970_N5: "Renewable Deployment Corridors"
 USA_1970_N5_desc:0 "Renewable deployment corridors can connect suitable locations to equipment, investment and useful demand. Concentrating support will help emerging activity develop a practical base while leaving the government responsible for the programme's costs."
 USA_1970_N6: "Modernize the Grid"
 USA_1970_N6_desc:0 "Grid modernisation can make existing and new generation more dependable. Transmission, management and maintenance must work together if greater capacity is to become reliable power for households and industry."
 USA_1970_N7: "Continental Pipelines"
 USA_1970_N7_desc:0 "Continental pipelines connect production to consumers across long distances and political boundaries. Their value depends on viable routes, continuing operation and agreements that address the responsibilities of the jurisdictions involved."
 USA_1970_N8: "The Energy-Secure Republic"
 USA_1970_N8_desc:0 "An energy-secure republic needs a combination of supply, conservation and resilient infrastructure. Bringing those programmes together can reduce vulnerability without promising that a large economy will ever be insulated from every external shock."
 USA_1970_F0: "The Burden of Primacy"
 USA_1970_F0_desc:0 "American primacy creates demands that exceed any single department's view of national interests. The government must decide where leadership requires a commitment and where restraint preserves the resources needed elsewhere."
 USA_1970_F1: "The Salesman's Republic"
 USA_1970_F1_desc:0 "Commercial diplomacy can widen access for American enterprise while strengthening political relationships. Its usefulness depends on agreements partners accept and firms can use, rather than treating every market as a reward for national influence."
 USA_1970_F2: "Rules-Based Leadership"
 USA_1970_F2_desc:0 "Rules-based leadership asks the United States to support institutions that can also constrain its choices. Reliable procedures may deepen cooperation, provided Washington accepts obligations alongside the authority it seeks to exercise."
 USA_1970_F3: "The Interventionist Will"
 USA_1970_F3_desc:0 "Interventionist leadership claims a greater willingness to use American power against threats abroad. That posture requires sustained military and political resources and a judgment about which objectives justify the burden."
 USA_1970_F4: "The Atlantic Bargain"
 USA_1970_F4_desc:0 "The Atlantic bargain depends on allies recognising both protection and reciprocal responsibility. Renewing it will require confidence in American commitments and a realistic account of what partners are prepared to contribute."
 USA_1970_F5: "Triangular Diplomacy"
 USA_1970_F5_desc:0 "Triangular diplomacy seeks room to manoeuvre through the relationships among major powers. Its success depends on actual channels and accepted terms rather than the assumption that one rival can always be used against another."
 USA_1970_F6: "The Middle Eastern Balance"
 USA_1970_F6_desc:0 "The Middle Eastern balance connects regional security, external relationships and access to energy. A coherent policy must recognise the interests of local governments instead of assuming that American priorities alone determine their decisions."
 USA_1970_F7: "Security Assistance to Israel"
 USA_1970_F7_desc:0 "Security assistance to Israel can strengthen a close partner and America's influence over regional defence. Its terms must define practical cooperation while accounting for the effect that support has on wider diplomatic relationships."
 USA_1970_F8: "The Honest Broker"
 USA_1970_F8_desc:0 "An honest broker must offer proposals the parties can judge on their substance. Credibility requires sustained engagement and a willingness to distinguish accepted commitments from a settlement Washington would merely prefer."
 USA_1970_F9: "Arab Trade and Energy Compact"
 USA_1970_F9_desc:0 "An Arab trade and energy compact can connect commercial interests to a broader diplomatic relationship. Negotiated terms must give partners reasons to cooperate without presenting access to energy as an entitlement of American influence."
 USA_1970_F10: "A Network of Partnerships"
 USA_1970_F10_desc:0 "A network of partnerships can distribute cooperation across several governments and institutions. Its strength will lie in commitments that participants actually honour rather than a growing list of relationships described as alliances."
 USA_1970_S0: "The Unfinished Revolution"
 USA_1970_S0_desc:0 "Civil rights and social change have left claims that legal declarations alone cannot settle. The government must decide how national standards, local institutions and public resources will make citizenship more equal in practice."
 USA_1970_S1: "Federal Enforcement"
 USA_1970_S1_desc:0 "Federal enforcement can make civil rights less dependent on the willingness of local authorities. Its expansion must provide the staff and legal capacity needed to protect rights when enforcement becomes politically contested."
 USA_1970_S2: "State-Negotiated Compliance"
 USA_1970_S2_desc:0 "State-negotiated compliance seeks practical agreements with institutions responsible for delivery. Flexibility may ease resistance, but national commitments must remain more than promises whose meaning changes at every state border."
 USA_1970_S3: "Fair Housing and Equal Credit"
 USA_1970_S3_desc:0 "Fair housing and equal credit affect where families can live and how they build economic security. Effective standards will require enforcement capable of reaching decisions often hidden within ordinary commercial practice."
 USA_1970_S4: "Make the ERA a Priority"
 USA_1970_S4_desc:0 "Making the Equal Rights Amendment a priority puts constitutional equality at the centre of the administration's political effort. Support must be organised through the institutions whose assent is required rather than assumed from executive endorsement."
 USA_1970_S5: "Tribal Self-Determination"
 USA_1970_S5_desc:0 "Tribal self-determination asks federal institutions to recognise a stronger indigenous role in governing local affairs. Resources and authority must be aligned if the policy is to mean more than transferring responsibility without the means to exercise it."
 USA_1970_S6: "Treatment before Punishment"
 USA_1970_S6_desc:0 "Treatment before punishment would give health and recovery a larger place in drug policy. The government must build accessible services while deciding which enforcement responsibilities remain necessary alongside them."
 USA_1970_S7: "The National Drug Policy Debate"
 USA_1970_S7_desc:0 "The national drug-policy debate concerns public health, enforcement and the social costs of both. A durable approach must choose priorities openly rather than promise that every agency can pursue its preferred solution without limits."
 USA_1970_S8: "A New Civic Compact"
 USA_1970_S8_desc:0 "A new civic compact must connect equal rights to institutions that citizens can use. Consolidating those responsibilities can give social reform a foundation stronger than a succession of separate legislative victories."
 USA_1970_D0: "Reform under Fire"
 USA_1970_D0_desc:0 "Military reform must respond to operational experience and changing national expectations. The government needs a force whose personnel, institutions and methods can support the missions it is actually prepared to undertake."
 USA_1970_D1: "The All-Volunteer Force"
 USA_1970_D1_desc:0 "An all-volunteer force depends on recruitment, professional incentives and the retention of trained personnel. The change can strengthen the relationship between service and commitment while creating continuing demands on the defence budget."
 USA_1970_D2: "Renew National Service"
 USA_1970_D2_desc:0 "Renewed national service would retain a wider public obligation to provide manpower. Its legitimacy depends on fair administration and a clear account of why the country's requirements cannot be met on another basis."
 USA_1970_D3: "Intelligence under Law"
 USA_1970_D3_desc:0 "Intelligence under law requires effective collection and enforceable institutional limits. Clear authority and oversight can make the system more credible without denying that secrecy creates difficult questions of accountability."
 USA_1970_D4: "Keep the Covert Hand Free"
 USA_1970_D4_desc:0 "A freer covert hand gives intelligence agencies more discretion in pursuing opportunities abroad. The government must accept the political exposure and reduced oversight that accompany the additional reach it seeks."
 USA_1970_D5: "AirLand Battle"
 USA_1970_D5_desc:0 "AirLand Battle requires land and air forces to plan and operate as parts of one campaign. Doctrine, communications and training must connect the capabilities each service has developed separately."
 USA_1970_D6: "The Maritime Strategy"
 USA_1970_D6_desc:0 "A maritime strategy must connect naval strength to the political purposes of forward operations. Readiness and support are necessary if distant commitments are to remain credible beyond the first deployment."
 USA_1970_D7: "The Second Offset"
 USA_1970_D7_desc:0 "The Second Offset seeks an advantage through technology, precision and the integration of information. Research and procurement must be matched by training and doctrine able to turn advanced systems into usable military capability."
 USA_1970_D8: "Credible but Constrained Power"
 USA_1970_D8_desc:0 "Credible but constrained power requires forces that can fulfil clear commitments under accepted political limits. Bringing the reforms together will help the country preserve capability without treating military reach as a reason for unlimited obligation."
 USA_1970_nixon_first_term_tt:0 "Nixon is President and the opening administration programme has not ended (20 January 1973)."
