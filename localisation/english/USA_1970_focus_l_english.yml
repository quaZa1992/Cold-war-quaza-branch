 USA_1970_NIX_A0: "A Presidency Under Pressure"
 USA_1970_NIX_A0_desc: "PP +50 and an open White House agenda against stability, Treasury, and administrative strain.\\n\\nThis opening focus is available only while Richard Nixon remains president and before the January 1973 inauguration."
 USA_1970_NIX_A1: "New Federalism in Practice"
 USA_1970_NIX_A1_desc: "Smaller federal overhead and regional programmes against weaker standards and congressional resistance.\\n\\nThis opening focus is available only while Richard Nixon remains president and before the January 1973 inauguration."
 USA_1970_NIX_A2: "A Domestic Reform Window"
 USA_1970_NIX_A2_desc: "Public confidence and institutional resilience against Treasury, bureaucracy, and Wall Street.\\n\\nThis opening focus is available only while Richard Nixon remains president and before the January 1973 inauguration."
 USA_1970_NIX_A3: "General Revenue Sharing"
 USA_1970_NIX_A3_desc: "A choice among real state-building projects and regional construction capacity against a large transfer, weaker tax collection, and new administration.\\n\\nThis opening focus is available only while Richard Nixon remains president and before the January 1973 inauguration."
 USA_1970_NIX_A4: "Clean Air and Safe Workplaces"
 USA_1970_NIX_A4_desc: "Legitimacy, research, and cleaner energy against regulation, output, Treasury, and business support.\\n\\nThis opening focus is available only while Richard Nixon remains president and before the January 1973 inauguration."
