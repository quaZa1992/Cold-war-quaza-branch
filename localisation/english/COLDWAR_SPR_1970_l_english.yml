 COLDWAR_SPR_offers_category_desc: "Proposals Madrid has sent us."
 COLDWAR_SPR.1.t: "The Caudillo Is Dead"
 COLDWAR_SPR.1.d: "Francisco Franco has died at La Paz hospital. The Council of the Realm meets, the Cortes waits, and the whole state looks to the Zarzuela and the barracks."
 COLDWAR_SPR.1.a: "Long live the King."
 COLDWAR_SPR.1.b: "The Regency of the Movement holds the state."
 COLDWAR_SPR.1.c: "The King reigns, the government stays."
 COLDWAR_SPR.3.t: "A Wave of Strikes"
 COLDWAR_SPR.3.d: "The Asturian pits stop, the shipyards follow and the students join them. The Social Unrest reaches the Strike Wave."
 COLDWAR_SPR.3.a: "Hold the line."
 COLDWAR_SPR.4.t: "General Strike"
 COLDWAR_SPR.4.d: "Factories are occupied, the trams stand still and the Guardia Civil cannot be everywhere. Spain is in a general strike."
 COLDWAR_SPR.4.a: "We must endure it."
 COLDWAR_SPR.5.t: "The Miracle Stalls"
 COLDWAR_SPR.5.d: "Oil has doubled. Tourists stay at home, the emigrants come back from Germany and the growth of the sixties is over."
 COLDWAR_SPR.5.a: "Tighten our belts."
 COLDWAR_SPR.40.t: "The GAL Affair"
 COLDWAR_SPR.40.d: "Journalists trace the killings in the French Basque Country back to Spanish policemen and a ministry budget."
 COLDWAR_SPR.40.a: "A dark chapter."
 COLDWAR_SPR.41.t: "The Subsidies End"
 COLDWAR_SPR.41.d: "The fuel subsidies can no longer be paid. Prices catch up all at once."
 COLDWAR_SPR.41.a: "Pay the bill."
 COLDWAR_SPR.42.t: "Reconversion Continues"
 COLDWAR_SPR.42.d: "Another round of closures in the yards and the steelworks."
 COLDWAR_SPR.42.a: "Close them."
 COLDWAR_SPR.43.t: "Reconversion Completed"
 COLDWAR_SPR.43.d: "The last loss-making furnaces go cold."
 COLDWAR_SPR.43.a: "A leaner industry."
 COLDWAR_SPR.44.t: "Inflation Breaks"
 COLDWAR_SPR.44.d: "A year of tight money has broken inflation."
 COLDWAR_SPR.44.a: "Good."
 COLDWAR_SPR.50.t: "The Respite Ends"
 COLDWAR_SPR.50.d: "The concessions have run their course and the street is restless again."
 COLDWAR_SPR.50.a: "So be it."
 COLDWAR_SPR.51.t: "The Subsidies Run Out"
 COLDWAR_SPR.51.d: "The treasury can no longer pay the difference at the bakery and the pump."
 COLDWAR_SPR.51.a: "So be it."
 COLDWAR_SPR.52.t: "The Fiestas Are Over"
 COLDWAR_SPR.52.d: "The season ends and the grievances return."
 COLDWAR_SPR.52.a: "So be it."
 COLDWAR_SPR.53.t: "Imported Inflation"
 COLDWAR_SPR.53.d: "The devaluation reaches the shop counter."
 COLDWAR_SPR.53.a: "Expected."
 COLDWAR_SPR.100.t: "A Proposal from Madrid"
 COLDWAR_SPR.100.d: "The Spanish government has sent us a proposal. It waits in the decision category 'Offers from Spain'."
 COLDWAR_SPR.100.a: "We will consider it."
 COLDWAR_SPR.101.t: "[From.GetName] Accepts"
 COLDWAR_SPR.101.d: "[From.GetName] has accepted our proposal."
 COLDWAR_SPR.101.a: "Excellent."
 COLDWAR_SPR.103.t: "An Agreement Resumes"
 COLDWAR_SPR.103.d: "The quarrel between Madrid and its partner is over. The paused agreement is in force again."
 COLDWAR_SPR.103.a: "Good."
 COLDWAR_SPR.102.t: "[From.GetName] Declines"
 COLDWAR_SPR.102.d: "[From.GetName] has turned down our proposal."
 COLDWAR_SPR.102.a: "Unfortunate."
