l_english:
# IMPERIA COLD WAR — Cold War: Spain 1970 national programme.
 COLDWAR_SPR_1970_focus: "Spain"
 COLDWAR_SPR_politics_tree_shortcut: "The State"
 COLDWAR_SPR_western_tree_shortcut: "The Democratic Opposition"
 COLDWAR_SPR_movement_tree_shortcut: "The Movement"
 COLDWAR_SPR_crown_tree_shortcut: "The Crown"
 COLDWAR_SPR_economy_tree_shortcut: "Economy"
 COLDWAR_SPR_military_tree_shortcut: "Armed Forces"
 COLDWAR_SPR_foreign_tree_shortcut: "Foreign Policy"
 COLDWAR_SPR_democratic_opposition: "The Democratic Opposition"
 COLDWAR_SPR_democratic_opposition_desc: "Socialists, liberals and Christian democrats meet in Paris and Munich. A democratic Spain needs a common table first."
 COLDWAR_SPR_platform_of_convergence: "The Platform of Convergence"
 COLDWAR_SPR_platform_of_convergence_desc: "The Plataforma gathers PSOE, Christian democrats and regional parties around a negotiated break."
 COLDWAR_SPR_munich_spirit: "The Spirit of Munich"
 COLDWAR_SPR_munich_spirit_desc: "Remember Munich 1962: Spain belongs in Europe, and Europe will not take a dictatorship."
 COLDWAR_SPR_coordinacion_democratica: "Democratic Coordination"
 COLDWAR_SPR_coordinacion_democratica_desc: "The opposition fronts merge into one negotiating partner for the Crown."
 COLDWAR_SPR_psoe_e: "The Socialists of Suresnes"
 COLDWAR_SPR_psoe_e_desc: "At Suresnes in 1974 a young lawyer from Seville took the party from the old exiles. Our socialism will be rooted in Spain's factories and neighbourhoods, not in the memory of 1936."
 COLDWAR_SPR_psoe_pol: "Felipe's Party"
 COLDWAR_SPR_psoe_pol_desc: "Felipe González and Alfonso Guerra have built a disciplined machine around the First Secretary. Voters know the face, and the party follows the face."
 COLDWAR_SPR_psoe_eco: "The Programme of the Change"
 COLDWAR_SPR_psoe_eco_desc: "Our manifesto promises jobs, schools and modern industry, and an end to a state that serves the few. Spain is tired of waiting, and our slogan is a single word: change."
 COLDWAR_SPR_psoe_a1: "The Marxist Party"
 COLDWAR_SPR_psoe_a1_desc: "Marxism stays in the statutes as the method of analysis of the working class. The unions know where we stand, and capital will have to learn to live with it."
 COLDWAR_SPR_psoe_a2: "The Social Democratic Turn"
 COLDWAR_SPR_psoe_a2_desc: "Felipe returns at the extraordinary congress: Marxism is a method, not a dogma. Capital, Brussels and the middle classes can now vote for us."
 COLDWAR_SPR_psoe_b1: "Nationalise the Banks"
 COLDWAR_SPR_psoe_b1_desc: "Credit is too important to leave to seven families and their boards. A public banking network will finance homes and factories, not speculation."
 COLDWAR_SPR_psoe_b2: "Boyer's Orthodoxy"
 COLDWAR_SPR_psoe_b2_desc: "Inflation must be beaten before any promise is kept. Boyer's austerity will lower prices, rebuild confidence and keep the markets calm, even if the unions do not like it."
 COLDWAR_SPR_psoe_a1f: "The Class Party"
 COLDWAR_SPR_psoe_a1f_desc: "The PSOE and the UGT march together, as they did in 1888. In the mining valleys and the shipyards the party is the movement of the working class."
 COLDWAR_SPR_psoe_a2f: "Renovation Without Marx"
 COLDWAR_SPR_psoe_a2f_desc: "Brandt, Mitterrand, Soares and Palme are our models. We keep the red flag and the welfare ambitions, but we drop the dogma that frightened the middle classes."
 COLDWAR_SPR_psoe_b1f: "The Public Bank"
 COLDWAR_SPR_psoe_b1f_desc: "A public credit network of savings banks, the Caja Postal and the ICO will lend to small towns and new plants. Money for the provinces is our answer to the banks in Madrid."
 COLDWAR_SPR_psoe_b2f: "Industrial Reconversion"
 COLDWAR_SPR_psoe_b2f_desc: "Old furnaces and yards that lose money every month must close. We will pay for retraining and for new plants, but we will not run a museum of the 1960s."
 COLDWAR_SPR_psoe_pm: "The Absolute Majority"
 COLDWAR_SPR_psoe_pm_desc: "On 28 October 1982 more than ten million Spaniards gave us 202 seats. No Spanish party has ever had so much room to govern, and so little excuse for failing."
 COLDWAR_SPR_psoe_em: "The 800,000 Jobs"
 COLDWAR_SPR_psoe_em_desc: "We promised 800,000 jobs, and Spain will judge us by them. Public works, training plans and new plants in the poorest provinces will put people to work."
 COLDWAR_SPR_psoe_c1: "The Right to Education Law"
 COLDWAR_SPR_psoe_c1_desc: "Every child in Spain will have a school seat paid by the state, with councils where parents and teachers decide. The Church keeps its schools, but under public rules."
 COLDWAR_SPR_psoe_c2: "A National Health Service"
 COLDWAR_SPR_psoe_c2_desc: "A health card for every Spaniard, joining Social Security and the old charity hospitals into one national system. Care becomes a right, financed from taxes."
 COLDWAR_SPR_psoe_d1: "NATO: At First, No"
 COLDWAR_SPR_psoe_d1_desc: "No to the blocs: Spain has no business in Washington's alliance. The Spaniards who march against the bases at Torrejón and Rota will keep us honest."
 COLDWAR_SPR_psoe_d2: "The NATO Referendum"
 COLDWAR_SPR_psoe_d2_desc: "We asked Spaniards to vote on staying, on three conditions: no integration in the command, no nuclear weapons and fewer American troops. Felipe asks for a yes, and it will hurt the left."
 COLDWAR_SPR_psoe_cm: "The Welfare State"
 COLDWAR_SPR_psoe_cm_desc: "Education, health and pensions together make the first welfare state in Spanish history. A worker's retirement will no longer depend on his children."
 COLDWAR_SPR_psoe_dm: "Spain in Europe"
 COLDWAR_SPR_psoe_dm_desc: "Europe was the dream of three generations of Spanish liberals. The Treaty is signed in the Royal Palace of Madrid, and the price is paid in tomatoes and fish quotas."
 COLDWAR_SPR_psoe_cap: "The Modernisation of Spain"
 COLDWAR_SPR_psoe_cap_desc: "The AVE to Seville, the Olympics in Barcelona and Expo 92: Spain shows Europe it is a modern country with motorways, universities and airports."
 COLDWAR_SPR_cds_e: "The Liberal Centre"
 COLDWAR_SPR_cds_e_desc: "Neither the old right nor the Marxist left: a liberal, reforming centre for Spaniards who want freedom and prosperity. Suárez is back, and with him the centre."
 COLDWAR_SPR_cds_pol: "Civil Liberties First"
 COLDWAR_SPR_cds_pol_desc: "Freedom of assembly, of the press and of conscience comes first, before any budget and before any plan. The state exists to protect the citizen, not to watch him."
 COLDWAR_SPR_cds_eco: "The Social Market"
 COLDWAR_SPR_cds_eco_desc: "Free enterprise with a safety net: competition for the firms, protection for the worker. The German social market economy shows that prosperity and solidarity are not enemies."
 COLDWAR_SPR_cds_a1: "The Hinge Party"
 COLDWAR_SPR_cds_a1_desc: "With a few dozen deputies we decide who governs. Whoever wants a majority will have to talk to the centre first, and we will sell our votes dear."
 COLDWAR_SPR_cds_a2: "The Suárez Personality"
 COLDWAR_SPR_cds_a2_desc: "Adolfo Suárez won the transition and lost the party he created. The voters trust the man who legalised the parties and stayed in his seat when the guns burst into the Cortes."
 COLDWAR_SPR_cds_b1: "Social Liberalism"
 COLDWAR_SPR_cds_b1_desc: "Liberty means little to a man who cannot pay for a doctor or a school. A liberal state guarantees the starting line for every citizen, and it pays for it."
 COLDWAR_SPR_cds_b2: "Garrigues' Free Market"
 COLDWAR_SPR_cds_b2_desc: "Joaquín Garrigues showed that a liberal can be a modern man: less state, fewer licences, more competition. Let the markets work and the economy will grow."
 COLDWAR_SPR_cds_a1f: "Coalition Kingmaker"
 COLDWAR_SPR_cds_a1f_desc: "Our votes decide the budget, the regional governments and the mayors of the big cities. A party that can say yes or no to either side never goes unheard."
 COLDWAR_SPR_cds_a2f: "The Duke's Return"
 COLDWAR_SPR_cds_a2f_desc: "The King made him a Duke and the nation owes him the transition. When Suárez speaks again, even his adversaries stand to listen."
 COLDWAR_SPR_cds_b1f: "Mutual Societies"
 COLDWAR_SPR_cds_b1f_desc: "Workers can own their firms: cooperatives, labour-owned companies and farmers' mutuals. The Mondragon model shows the way, with profit and solidarity side by side."
 COLDWAR_SPR_cds_b2f: "Open the Monopolies"
 COLDWAR_SPR_cds_b2f_desc: "Telephones, fuel and tobacco are run as monopolies at public expense. Open them to competition and prices will fall, even if some old friends of the state complain."
 COLDWAR_SPR_cds_pm: "The Progressive Centre"
 COLDWAR_SPR_cds_pm_desc: "The CDS presents itself as a progressive centre: open to the left on rights and to the right on markets. Voters who abandoned the UCD have a new home."
 COLDWAR_SPR_cds_em: "The Small Business Charter"
 COLDWAR_SPR_cds_em_desc: "The backbone of Spain is the small firm: the workshop, the family farm, the shop. Fewer forms, lower taxes and credit on fair terms will let them hire."
 COLDWAR_SPR_cds_c1: "Judicial Independence"
 COLDWAR_SPR_cds_c1_desc: "Judges answer to the law and not to the minister. An independent General Council of the Judiciary and free prosecutors will protect citizens, and also embarrass governments."
 COLDWAR_SPR_cds_c2: "Freedom of Information"
 COLDWAR_SPR_cds_c2_desc: "A free press, free radio and a public right to know. The Official Secrets Law belongs to the old regime, and a democracy has nothing to fear from its own newspapers."
 COLDWAR_SPR_cds_d1: "Neutral in the Alliance"
 COLDWAR_SPR_cds_d1_desc: "Spain can belong to the Western community without being part of the integrated command. We keep the bases for a price, and we keep our soldiers at home."
 COLDWAR_SPR_cds_d2: "Atlanticist Liberals"
 COLDWAR_SPR_cds_d2_desc: "Spain belongs with the free democracies of the West, in the Alliance and under its command. A modern liberal Spain does not hide behind the Pyrenees."
 COLDWAR_SPR_cds_cm: "The Citizen's Charter"
 COLDWAR_SPR_cds_cm_desc: "Every citizen gets a charter of rights: a fair trial, an ombudsman, access to public files. The state answers to the citizen, and not the other way round."
 COLDWAR_SPR_cds_dm: "Liberal International"
 COLDWAR_SPR_cds_dm_desc: "Liberals of Europe: Giscard, Genscher, Thorn and Suárez in one family. Our place is in the Liberal International and in a Europe of free markets and free citizens."
 COLDWAR_SPR_cds_cap: "The Democratic and Social Centre"
 COLDWAR_SPR_cds_cap_desc: "Democracy and social progress hand in hand: a modern, secular, European Spain governed from the centre. It is the programme Suárez left half done, and we shall finish it."
 COLDWAR_SPR_ucd_e: "Reform from the Centre or the Right"
 COLDWAR_SPR_ucd_e_desc: "Two ways to govern from the right of centre: Suárez's open reforming centre, or Fraga's people of order and the old administration. Voters will not give both a majority."
 COLDWAR_SPR_ucd_l: "Suárez: The Democratic Centre"
 COLDWAR_SPR_ucd_l_desc: "A broad centre of Christian democrats, liberals, social democrats and reformist Francoists, led by the man who knows both the regime and the opposition."
 COLDWAR_SPR_ucd_r: "Fraga: The People's Alliance"
 COLDWAR_SPR_ucd_r_desc: "Manuel Fraga offers order, experience and a guarantee that reform will not become rupture. Spain is not ready for adventures, and we are the party of those who know how to govern."
 COLDWAR_SPR_ucd_la1: "Consensus Politics"
 COLDWAR_SPR_ucd_la1_desc: "The Constitution was written by seven men from right to left, and the pacts of the Moncloa show that bargaining beats confrontation. We govern by agreement."
 COLDWAR_SPR_ucd_la2: "Govern Alone"
 COLDWAR_SPR_ucd_la2_desc: "We have won more seats than anyone else. Let the Cortes see that a government with a plan can pass its laws without bargaining with every party."
 COLDWAR_SPR_ucd_ra1: "The Seven Magnificent"
 COLDWAR_SPR_ucd_ra1_desc: "Seven former ministers of Franco bring experience in administration, in law and in business. They know where every file is kept."
 COLDWAR_SPR_ucd_ra2: "The Democratic Coalition"
 COLDWAR_SPR_ucd_ra2_desc: "Fraga extends his hand to the Christian democrats and the liberals. A Democratic Coalition can offer voters more than the faces of the old regime alone."
 COLDWAR_SPR_ucd_la1f: "The Moncloa Pacts"
 COLDWAR_SPR_ucd_la1f_desc: "Wage rises capped, a public deficit under control and the tax system reformed. Every party signs, and every party is annoyed."
 COLDWAR_SPR_ucd_la2f: "The Centrist Cabinet"
 COLDWAR_SPR_ucd_la2f_desc: "Abril Martorell, Gutiérrez Mellado, Fernández Ordóñez and Calvo-Sotelo run the ministries. A cabinet of the most able men, not of the most loyal."
 COLDWAR_SPR_ucd_ra1f: "Order and Authority"
 COLDWAR_SPR_ucd_ra1f_desc: "Public order first. Strikes, riots and terror must be met by a police and a judiciary that act. Disorder is the enemy of every freedom."
 COLDWAR_SPR_ucd_ra2f: "The Great Right"
 COLDWAR_SPR_ucd_ra2f_desc: "All the right of centre under one roof, from the Christian democrats to the liberals. A single party to take back the Moncloa."
 COLDWAR_SPR_ucd_lm: "The State of the Autonomies"
 COLDWAR_SPR_ucd_lm_desc: "Catalans, Basques and Galicians demand self-government at once, others want it slowly. The Constitution's two roads, the fast Article 151 and the slow Article 143, give each region a place."
 COLDWAR_SPR_ucd_rm: "Unity of Spain"
 COLDWAR_SPR_ucd_rm_desc: "Spain is one and indivisible. Whoever speaks of nations within it opens the door to separatism, and the army will not tolerate that."
 COLDWAR_SPR_ucd_lb1: "The Divorce Law"
 COLDWAR_SPR_ucd_lb1_desc: "Francisco Fernández Ordóñez brings the divorce law to the Cortes. Spaniards trapped in dead marriages for forty years can finally begin again."
 COLDWAR_SPR_ucd_lb2: "The Christian Democratic Veto"
 COLDWAR_SPR_ucd_lb2_desc: "The Church and the Christian democrats of the party will not accept divorce. Their votes are needed, so the family stays a pillar of the state."
 COLDWAR_SPR_ucd_rb1: "Privatise the INI"
 COLDWAR_SPR_ucd_rb1_desc: "Let the INI sell its shares: the state holdings lose money, and private capital will make them profitable and competitive."
 COLDWAR_SPR_ucd_rb2: "The Social Market of the Right"
 COLDWAR_SPR_ucd_rb2_desc: "Market economy and Christian solidarity: family farms, rural credit and decent pensions. The right can be social without being socialist."
 COLDWAR_SPR_ucd_lcap: "The Transition Completed"
 COLDWAR_SPR_ucd_lcap_desc: "A constitution, free elections, legal parties and seventeen autonomies: the work of a decade is done. Spain is a normal European democracy."
 COLDWAR_SPR_ucd_rcap: "The Natural Majority"
 COLDWAR_SPR_ucd_rcap_desc: "Spain's voters lean to the centre-right, and one party must finally unite them. When that happens, the government will be ours."
 COLDWAR_SPR_carl_e: "The Carlist Communion"
 COLDWAR_SPR_carl_e_desc: "The Communion survived the Civil War and the Regime alike. Now the heir to the Carlist banner must say what the King of the Spaniards is for: a Crown of the workers or a Crown of the faith."
 COLDWAR_SPR_carl_l: "Carlos Hugo: Self-Management"
 COLDWAR_SPR_carl_l_desc: "Carlos Hugo gives the old banner a new text: the people own their work, the King serves as their first citizen. The Navarrese Requetés stay loyal, the Bishops do not."
 COLDWAR_SPR_carl_r: "Sixto: Tradition"
 COLDWAR_SPR_carl_r_desc: "Sixto Enrique keeps the creed of the Requetés: God, Fatherland, Fueros, King. Whoever calls this a relic has never seen a Carlist pilgrimage in the hills of Navarre."
 COLDWAR_SPR_carl_la1: "Socialismo autogestionario"
 COLDWAR_SPR_carl_la1_desc: "Factories run by those who work in them, decisions taken from the bottom up. Self-management is the Carlist answer to both Madrid ministries and Barcelona boardrooms."
 COLDWAR_SPR_carl_la2: "The Federal Monarchy"
 COLDWAR_SPR_carl_la2_desc: "A King above a federation of peoples, with the old fueros as the model for every region. Navarre, the Basques and Catalans find a place at the table, and Madrid gives up its monopoly."
 COLDWAR_SPR_carl_ra1: "God, Fatherland, Fueros, King"
 COLDWAR_SPR_carl_ra1_desc: "Altar, flag, regional charters and King: four words for a whole order. The Church is honoured, the land is respected and the foreign fashions are kept out."
 COLDWAR_SPR_carl_ra2: "The Requeté Revived"
 COLDWAR_SPR_carl_ra2_desc: "The red berets march again. The old volunteer tradition of Navarre supplies the men, the zeal and the discipline the Crown needs."
 COLDWAR_SPR_carl_la1f: "Workers' Councils"
 COLDWAR_SPR_carl_la1f_desc: "Elected councils run the plants of Asturias and Bilbao, and managers answer to the shop floor. Productivity depends on the trust of those who sweat for it."
 COLDWAR_SPR_carl_la2f: "The Peoples of Spain"
 COLDWAR_SPR_carl_la2f_desc: "Spain is a family of peoples, not a barracks. Each nation keeps its language, its law and its own parliament under one common Crown."
 COLDWAR_SPR_carl_ra1f: "Restore the Fueros"
 COLDWAR_SPR_carl_ra1f_desc: "Navarre keeps its own taxes and law and the Basque provinces regain theirs. The charters are older than the Spanish state and will be honoured to the letter."
 COLDWAR_SPR_carl_ra2f: "The Volunteers of Navarre"
 COLDWAR_SPR_carl_ra2f_desc: "The Navarrese volunteers guard their own mountains. A hill-fort army, trained from childhood, makes the Pyrenees a wall that no one will force."
 COLDWAR_SPR_carl_lm: "The Montejurra Rally"
 COLDWAR_SPR_carl_lm_desc: "Montejurra: tens of thousands climb the hill of the martyrs. This year the Carlists march together and the ultras are kept at the foot of the mountain."
 COLDWAR_SPR_carl_rm: "The Legitimate King"
 COLDWAR_SPR_carl_rm_desc: "The line of Don Carlos is the legitimate one: Sixto Enrique, the son of Don Javier, holds the traditional title. Spain's Crown belongs to the Carlist line, not to the Alfonsist usurpers."
 COLDWAR_SPR_carl_lb1: "Ally with the Left"
 COLDWAR_SPR_carl_lb1_desc: "The Junta and the Platform of Democratic Convergence knock on our door, and we open it. The Carlist sash now flies next to the red flags in the great demonstrations."
 COLDWAR_SPR_carl_lb2: "The Carlist Alone"
 COLDWAR_SPR_carl_lb2_desc: "No pacts with Madrid's old parties and none with the Marxists. The Carlists keep their own list, their own newspaper and their own road, even if it means walking alone."
 COLDWAR_SPR_carl_rb1: "The Catholic Unity of Spain"
 COLDWAR_SPR_carl_rb1_desc: "One Faith, one Church and the schools in its hands. The Carlist soul will not trade its Catholic unity for any liberal freedom of worship."
 COLDWAR_SPR_carl_rb2: "The Traditionalist Communion"
 COLDWAR_SPR_carl_rb2_desc: "The Communion keeps its own organisation, its own newspapers and its own council. Loyalty to the old creed counts more than any alliance."
 COLDWAR_SPR_carl_lcap: "The Monarchy of the Peoples"
 COLDWAR_SPR_carl_lcap_desc: "A Crown that serves the peoples and a workplace that belongs to the workers. The old Communion has found a modern face."
 COLDWAR_SPR_carl_rcap: "The Traditional Monarchy"
 COLDWAR_SPR_carl_rcap_desc: "A Catholic King, the old charters and an army that believes in the cause. The Traditional Monarchy is the sworn answer to a century of liberal experiments."
 COLDWAR_SPR_clandestine_party: "The Clandestine Party"
 COLDWAR_SPR_clandestine_party_desc: "The PCE survived thirty years underground. Its cells are now in every large factory and university."
 COLDWAR_SPR_workers_commissions: "The Workers' Commissions"
 COLDWAR_SPR_workers_commissions_desc: "Comisiones Obreras win the syndical elections from inside the vertical syndicate."
 COLDWAR_SPR_junta_democratica: "The Democratic Junta"
 COLDWAR_SPR_junta_democratica_desc: "Carrillo's broad front brings independents, monarchists of Don Juan and Tierno Galván to one table."
 COLDWAR_SPR_the_long_night_ends: "The Long Night Ends"
 COLDWAR_SPR_the_long_night_ends_desc: "Holy Saturday comes for the communists: legal, under the monarchy and the red-and-gold flag."
 COLDWAR_SPR_pce_e: "The Party of the Resistance"
 COLDWAR_SPR_pce_e_desc: "Forty years of clandestinity: the party that lost most in the war and fought longest against the dictatorship now governs. The memory of the Resistance is its strongest card."
 COLDWAR_SPR_pce_pol: "The Executive Committee"
 COLDWAR_SPR_pce_pol_desc: "Santiago Carrillo, La Pasionaria and the old cadres run the party from the Executive Committee. Clandestine discipline gives the party an iron grip, and the machinery has to be fed."
 COLDWAR_SPR_pce_eco: "The Manifesto-Programme"
 COLDWAR_SPR_pce_eco_desc: "The Manifesto-Programme is a plan for the democratic break: land to those who work it, banks under public control, planning with a role for the market. Capital reads it with alarm."
 COLDWAR_SPR_pce_a1: "Eurocommunism"
 COLDWAR_SPR_pce_a1_desc: "Carrillo, Berlinguer and Marchais: democratic road, pluralism, no master in Moscow. Spain's communists join the European left without leaving the democratic family."
 COLDWAR_SPR_pce_a2: "The Soviet Line"
 COLDWAR_SPR_pce_a2_desc: "The loyal comrades remind us what Moscow gave the Resistance. We offer the Soviet Union a place for Spain in its camp, and the Kremlin decides whether it wants a country at the other end of Europe."
 COLDWAR_SPR_pce_b1: "Nationalise the Key Sectors"
 COLDWAR_SPR_pce_b1_desc: "Banking, electricity, oil and steel pass into public hands. The commanding heights of the economy serve the people instead of the families who own them."
 COLDWAR_SPR_pce_b2: "The Mixed Economy"
 COLDWAR_SPR_pce_b2_desc: "Public enterprise stays beside private firms. Carrillo wants the capitalists to invest in a democratic Spain, and the workers to understand that the break needs patient work."
 COLDWAR_SPR_pce_a1f: "Carrillo's Party"
 COLDWAR_SPR_pce_a1f_desc: "Carrillo's party is the voice of democratic communism in Spain: open, modern and pluralist. The hardliners are leaving the hall as new members arrive."
 COLDWAR_SPR_pce_a2f: "Líster's Communists"
 COLDWAR_SPR_pce_a2f_desc: "Líster's old guard, hardened in the Civil War and Moscow's military schools, keeps the party's discipline and arms. These communists know no democratic road, only the mass struggle."
 COLDWAR_SPR_pce_b1f: "Public Ownership of the INI"
 COLDWAR_SPR_pce_b1f_desc: "The INI's steelworks, shipyards and mines become the democratic public sector the Manifesto promised. The Asturian miners and the Ferrol shipbuilders guard it."
 COLDWAR_SPR_pce_b2f: "Sign the Moncloa Pacts"
 COLDWAR_SPR_pce_b2f_desc: "Wages capped below inflation, a devaluation, a tax reform. Carrillo signs because democracy has to survive 25 percent inflation, and the base pays the bill."
 COLDWAR_SPR_pce_pm: "Accept the Monarchy"
 COLDWAR_SPR_pce_pm_desc: "Before the generals and the bishops we accept the Crown provisionally. The referendum on the form of the state will come only when democracy stands on firm legs."
 COLDWAR_SPR_pce_em: "The Workers' Commissions in Power"
 COLDWAR_SPR_pce_em_desc: "The union that kept the factories moving under the dictatorship now shares the ministries. Marcelino Camacho sits beside the ministers of the party he helped to bring to power."
 COLDWAR_SPR_pce_c1: "The Third Republic"
 COLDWAR_SPR_pce_c1_desc: "The Crown is accepted for today, not forever. The party works for the day the Spanish people choose a Third Republic by referendum."
 COLDWAR_SPR_pce_c2: "The Red-and-Gold Flag"
 COLDWAR_SPR_pce_c2_desc: "The red-and-gold flag covers every Spaniard, including the officers who once fought us. Carrillo's gesture buys peace with the barracks, and the old militants wipe their eyes."
 COLDWAR_SPR_pce_d1: "Bases Out"
 COLDWAR_SPR_pce_d1_desc: "Rota, Torrejón, Morón and Zaragoza are Spanish soil. We propose a dignified end to the agreement, but whether Washington leaves in peace is Washington's choice."
 COLDWAR_SPR_pce_d2: "Socialist Non-Alignment"
 COLDWAR_SPR_pce_d2_desc: "Neither Washington nor Moscow: Spain joins the non-aligned, trades with Algiers, Belgrade and Mexico City and answers to nobody. The price is a thinner supply of Western technology."
 COLDWAR_SPR_pce_cm: "The Democratic Republic of Workers"
 COLDWAR_SPR_pce_cm_desc: "The republic of the workers gives the land to the day-labourers of the south. Extremadura and Andalucía get industry as well as justice."
 COLDWAR_SPR_pce_dm: "Between the Blocs"
 COLDWAR_SPR_pce_dm_desc: "Europe divides the world between two giants, and Spain plays the diplomat between them. A socialist state that trades with everybody earns the trust of both camps."
 COLDWAR_SPR_pce_cap: "Socialism in Freedom"
 COLDWAR_SPR_pce_cap_desc: "Socialism built with the consent of the people, with free elections, free unions and a free press. Carrillo's long road from the Resistance leads to the first communist government of the West."
 COLDWAR_SPR_last_years: "The Last Years of El Pardo"
 COLDWAR_SPR_last_years_desc: "The Caudillo is seventy-seven and his hands shake. Every ministry in Madrid is already arguing about the day after."
 COLDWAR_SPR_doctors_of_la_paz: "The Doctors of La Paz"
 COLDWAR_SPR_doctors_of_la_paz_desc: "The Generalísimo's medical team keeps the old man at work as long as nature allows. The regime's families use every remaining month to secure their chairs."
 COLDWAR_SPR_prince_of_spain: "The Prince of Spain"
 COLDWAR_SPR_prince_of_spain_desc: "Juan Carlos swore to the Principles of the Movement in 1969. Give him a public role and Spain will learn the face of its future king."
 COLDWAR_SPR_president_of_government: "A President of the Government"
 COLDWAR_SPR_president_of_government_desc: "Franco no longer governs day to day. Separating the head of state from the head of government decides who holds the pen after him."
 COLDWAR_SPR_council_of_the_realm: "The Council of the Realm"
 COLDWAR_SPR_council_of_the_realm_desc: "Sixteen councillors hold the keys to the succession. Whoever shapes their list shapes the state after Franco."
 COLDWAR_SPR_law_for_political_reform: "The Law for Political Reform"
 COLDWAR_SPR_law_for_political_reform_desc: "The Francoist Cortes can vote itself out of existence, from law to law. It is the fastest road to elections and the riskiest for the barracks."
 COLDWAR_SPR_fundamental_laws_stand: "The Fundamental Laws Stand"
 COLDWAR_SPR_fundamental_laws_stand_desc: "The Organic Law of 1967 already gave Spain its constitution. The guardians of the 18 July see no need for another."
 COLDWAR_SPR_constitution_of_1978: "The Constitution of the Spaniards"
 COLDWAR_SPR_constitution_of_1978_desc: "A consensus text written by seven fathers from right to left. Spain chooses a parliamentary monarchy and a state of autonomies."
 COLDWAR_SPR_organic_state: "The Organic State"
 COLDWAR_SPR_organic_state_desc: "The Fundamental Laws are declared complete. Spain stays an organic democracy of family, municipality and syndicate."
 COLDWAR_SPR_families_of_the_regime: "The Families of the Regime"
 COLDWAR_SPR_families_of_the_regime_desc: "Falangists, Carlists, Catholics, technocrats and generals. Every family of the 18 July wants its share of the state."
 COLDWAR_SPR_the_blue_shirts: "The Blue Shirts"
 COLDWAR_SPR_the_blue_shirts_desc: "The old guard of the Falange reminds Spain who won the war."
 COLDWAR_SPR_the_khaki: "The Khaki"
 COLDWAR_SPR_the_khaki_desc: "The army is the backbone of the state and the guarantor of the succession."
 COLDWAR_SPR_bunker_and_barracks: "The Bunker and the Barracks"
 COLDWAR_SPR_bunker_and_barracks_desc: "Where the party and the generals stand together, no reform passes."
 COLDWAR_SPR_fet_movement_of_18_july: "The Movement of 18 July"
 COLDWAR_SPR_fet_movement_of_18_july_desc: "The Movement is the state's only legal political communion. Whoever leads it inherits the networks of Solís, the syndicates and the provincial governors."
 COLDWAR_SPR_gp_root: "One, Great and Free"
 COLDWAR_SPR_gp_root_desc: "The Movement no longer asks what Spain may be allowed to become. Spain will be a great power again, with or without the blessing of Washington."
 COLDWAR_SPR_fet_national_syndicalist_economy: "The National-Syndicalist Economy"
 COLDWAR_SPR_fet_national_syndicalist_economy_desc: "The Falange never trusted the market. State plants, vertical syndicates and the INI keep the commanding heights in Spanish hands."
 COLDWAR_SPR_fet_fundamental_principles: "The Fundamental Principles"
 COLDWAR_SPR_fet_fundamental_principles_desc: "The 1958 Principles are 'permanent and unalterable'. Teaching them again in every school and barracks binds the next generation to the state."
 COLDWAR_SPR_gp_war_economy: "The National-Syndicalist War Economy"
 COLDWAR_SPR_gp_war_economy_desc: "Every furnace, yard and loom in Spain answers to one plan: the strength of the nation."
 COLDWAR_SPR_gp_rearm: "Rearm the Nation"
 COLDWAR_SPR_gp_rearm_desc: "The army of 1939 becomes the army of the empire, whatever it costs."
 COLDWAR_SPR_gp_spain_whole: "Spain United and Whole"
 COLDWAR_SPR_gp_spain_whole_desc: "A British rock on Spanish soil and a separate Portugal are the unfinished business of Spanish history."
 COLDWAR_SPR_gp_imperial_destiny: "The Imperial Destiny"
 COLDWAR_SPR_gp_imperial_destiny_desc: "Spain gave a continent its language. It will not end the century as a province of Europe."
 COLDWAR_SPR_fet_the_ini_as_engine: "The INI as the Engine"
 COLDWAR_SPR_fet_the_ini_as_engine_desc: "Steel in Avilés, ships in Ferrol, cars in Barcelona. The National Institute of Industry builds what private capital will not risk."
 COLDWAR_SPR_fet_the_technocrats_market: "The Technocrats' Market"
 COLDWAR_SPR_fet_the_technocrats_market_desc: "The Falange accepts what López Rodó proved since 1959: foreign capital and open prices built the miracle. The blue shirts keep the ministries, the planners keep the numbers."
 COLDWAR_SPR_fet_political_associations: "Political Associations"
 COLDWAR_SPR_fet_political_associations_desc: "Let loyal currents organise inside the Movement. Reformists get a legal home, and the regime gets a reason to survive Franco."
 COLDWAR_SPR_fet_the_bunker: "The Bunker"
 COLDWAR_SPR_fet_the_bunker_desc: "Girón, Blas Piñar and the generals of the old guard close ranks. Not one step back from the victory of 1939."
 COLDWAR_SPR_gp_autarky_reborn: "Autarky Reborn"
 COLDWAR_SPR_gp_autarky_reborn_desc: "No embargo will starve Spain again. What we need, we dig, grow and forge ourselves."
 COLDWAR_SPR_gp_foreign_capital: "Foreign Capital, Spanish Command"
 COLDWAR_SPR_gp_foreign_capital_desc: "Foreign money may build our plants, as long as the plants stay ours and serve the state."
 COLDWAR_SPR_gp_mass_army: "A Mass Army of the People"
 COLDWAR_SPR_gp_mass_army_desc: "Every Spaniard is a soldier. Twenty divisions become forty."
 COLDWAR_SPR_gp_elite_legion: "Quality over Numbers"
 COLDWAR_SPR_gp_elite_legion_desc: "The Legion, the paratroopers and the Regulares become the spearhead of a small, hard army."
 COLDWAR_SPR_gp_diplomatic_siege: "The Diplomatic Siege of Gibraltar"
 COLDWAR_SPR_gp_diplomatic_siege_desc: "The gate stays shut, the ferries stay docked and every forum hears Spain's claim."
 COLDWAR_SPR_gp_operation_gibraltar: "Operation Gibraltar"
 COLDWAR_SPR_gp_operation_gibraltar_desc: "The General Staff studies the Rock from the hills of San Roque."
 COLDWAR_SPR_gp_sahara_province: "The Sahara Province"
 COLDWAR_SPR_gp_sahara_province_desc: "El Aaiún is as Spanish as Cuenca. The phosphates of Bou Craa pay for the garrison."
 COLDWAR_SPR_gp_hispanic_council: "The Council of Hispanidad"
 COLDWAR_SPR_gp_hispanic_council_desc: "The Institute of Hispanic Culture becomes the voice of a family of nations, led from Madrid."
 COLDWAR_SPR_fet_ensidesa_steel_plan: "Ensidesa and the Steel Plan"
 COLDWAR_SPR_fet_ensidesa_steel_plan_desc: "The fourth integrated steelworks at Sagunto and the expansion of Avilés give Spain the steel of a modern industrial power."
 COLDWAR_SPR_fet_second_wave_of_tourism: "The Second Wave of Tourism"
 COLDWAR_SPR_fet_second_wave_of_tourism_desc: "Twenty million visitors a year and rising. Hotels on the Costa del Sol and Mallorca turn sunshine into the foreign currency the plans need."
 COLDWAR_SPR_fet_statute_of_associations: "The Statute of Associations"
 COLDWAR_SPR_fet_statute_of_associations_desc: "Twenty-five thousand signatures and loyalty to the Principles: the price of legal political life. The Tácito reformers come back inside."
 COLDWAR_SPR_fet_the_gironazo: "The Gironazo"
 COLDWAR_SPR_fet_the_gironazo_desc: "Girón's article in Arriba accuses the reformers of treason. The reform is dead before it was born."
 COLDWAR_SPR_gp_mines_of_the_south: "The Mines of the South"
 COLDWAR_SPR_gp_mines_of_the_south_desc: "Riotinto, Almadén and the Andalusian lodes return to full production for the nation's own industry."
 COLDWAR_SPR_gp_joint_ventures: "Joint Ventures with the INI"
 COLDWAR_SPR_gp_joint_ventures_desc: "Foreign know-how, INI majority: every new plant carries the yoke and arrows on its gate."
 COLDWAR_SPR_gp_movement_militia: "The Militia of the Movement"
 COLDWAR_SPR_gp_movement_militia_desc: "The old Falange militias return as a reserve of the army and a guard of the regime."
 COLDWAR_SPR_gp_parachute_brigade: "The Parachute Brigade"
 COLDWAR_SPR_gp_parachute_brigade_desc: "BRIPAC trains the men who will land first wherever Spain decides to fight."
 COLDWAR_SPR_gp_strangle_the_rock: "Strangle the Rock"
 COLDWAR_SPR_gp_strangle_the_rock_desc: "The Campo de Gibraltar gets the jobs that used to cross the border."
 COLDWAR_SPR_gp_assault_plans: "Assault Plans for the Rock"
 COLDWAR_SPR_gp_assault_plans_desc: "The plans are ready. Only the government can decide whether Spain dares to use them."
 COLDWAR_SPR_gp_return_to_guinea: "Return to Guinea"
 COLDWAR_SPR_gp_return_to_guinea_desc: "Macías Nguema expelled our citizens. The colony we gave up in 1968 may yet return."
 COLDWAR_SPR_gp_hispanidad_bank: "The Hispanidad Bank"
 COLDWAR_SPR_gp_hispanidad_bank_desc: "Credit, ships and engineers for the sister republics, in pesetas and on Spanish terms."
 COLDWAR_SPR_fet_social_peace_syndicate: "Social Peace through the Syndicate"
 COLDWAR_SPR_fet_social_peace_syndicate_desc: "Collective bargaining inside the syndicate, higher minimum wages and company housing. The regime buys quiet before the Workers' Commissions take the factories."
 COLDWAR_SPR_fet_the_regency_question: "The Regency Question"
 COLDWAR_SPR_fet_the_regency_question_desc: "Juan Carlos or Alfonso de Borbón-Dampierre, Franco's grandson-in-law? The Movement decides whose crown it will defend."
 COLDWAR_SPR_fet_spain_without_franco: "Franco's Spain Without Franco"
 COLDWAR_SPR_fet_spain_without_franco_desc: "A Regency Council of the Movement holds the state in trust. The Crown remains a symbol, the 18 July remains the law."
 COLDWAR_SPR_gp_armament_plan: "The Four-Year Armament Plan"
 COLDWAR_SPR_gp_armament_plan_desc: "Four years to arm a great power: rifles from Oviedo, guns from Trubia, vehicles from Madrid."
 COLDWAR_SPR_gp_general_staff: "The Doctrine of the General Staff"
 COLDWAR_SPR_gp_general_staff_desc: "The Escuela Superior del Ejército writes a doctrine for offensive war, not for garrisons."
 COLDWAR_SPR_gp_strait_is_spanish: "The Strait Is Spanish"
 COLDWAR_SPR_gp_strait_is_spanish_desc: "Guns on both shores and in the Atlantic islands: no fleet passes the Strait without Spain's leave."
 COLDWAR_SPR_gp_imperial_bases: "The Imperial Bases"
 COLDWAR_SPR_gp_imperial_bases_desc: "Las Palmas becomes the naval hinge between Spain, Africa and America."
 COLDWAR_SPR_fet_national_catholic_education: "National-Catholic Education"
 COLDWAR_SPR_fet_national_catholic_education_desc: "The Church runs the schools, the family stays the cell of the nation. Catholic Spain needs no foreign fashions."
 COLDWAR_SPR_fet_the_controlled_opening: "The Controlled Opening"
 COLDWAR_SPR_fet_the_controlled_opening_desc: "Villar Palasí's education law, cinema clubs and a lighter censor. Modern Spain studies and travels, and the regime hopes it will stay grateful."
 COLDWAR_SPR_fet_the_atlantic_bargain: "The Atlantic Bargain"
 COLDWAR_SPR_fet_the_atlantic_bargain_desc: "The bases at Rota, Torrejón, Morón and Zaragoza are the regime's insurance policy. Washington pays in tanks and credit."
 COLDWAR_SPR_fet_the_hispanic_third_way: "The Hispanic Third Way"
 COLDWAR_SPR_fet_the_hispanic_third_way_desc: "Friend of the Arabs, brother of Latin America, trading partner of Havana. Franco's Spain never needed to choose a bloc."
 COLDWAR_SPR_fet_overseas_provinces: "The Overseas Provinces"
 COLDWAR_SPR_fet_overseas_provinces_desc: "The Sahara is a Spanish province like Cuenca, its phosphates a Spanish asset. The Movement will not sign away what the Legion holds."
 COLDWAR_SPR_fet_european_right_international: "The European Right International"
 COLDWAR_SPR_fet_european_right_international_desc: "Madrid becomes the safe harbour of Europe's national right. Exiles, money and printing presses flow to every movement that shares the 18 July."
 COLDWAR_SPR_gp_labour_service: "The National Labour Service"
 COLDWAR_SPR_gp_labour_service_desc: "Young Spaniards serve the nation with the shovel before they serve it with the rifle."
 COLDWAR_SPR_gp_oil_prospecting: "Oil from Burgos"
 COLDWAR_SPR_gp_oil_prospecting_desc: "Ayoluengo proved there is oil under Castile. Drill deeper, and Spain fuels its own tanks."
 COLDWAR_SPR_gp_blue_water_navy: "A Blue-Water Navy"
 COLDWAR_SPR_gp_blue_water_navy_desc: "An empire on three continents needs a fleet that sails beyond the Canaries."
 COLDWAR_SPR_gp_spanish_fighter: "A Spanish Fighter"
 COLDWAR_SPR_gp_spanish_fighter_desc: "CASA and Hispano Aviación design a Spanish jet, so our wings never depend on a foreign veto."
 COLDWAR_SPR_gp_iberian_union: "The Iberian Union"
 COLDWAR_SPR_gp_iberian_union_desc: "Two Iberian states, one destiny: Lisbon keeps its flag, Madrid leads the union."
 COLDWAR_SPR_gp_portuguese_question: "The Portuguese Question"
 COLDWAR_SPR_gp_portuguese_question_desc: "If Lisbon will not come willingly, the Movement keeps another answer in the drawer."
 COLDWAR_SPR_gp_arms_for_america: "Arms for the Americas"
 COLDWAR_SPR_gp_arms_for_america_desc: "Spanish rifles, patrol boats and trainers for the Hispanic armies, without Washington's conditions."
 COLDWAR_SPR_gp_colonial_army: "The Army of Africa"
 COLDWAR_SPR_gp_colonial_army_desc: "The Legion and the Regulares are reborn as an expeditionary army for Africa."
 COLDWAR_SPR_fet_organic_democracy: "The Organic Democracy"
 COLDWAR_SPR_fet_organic_democracy_desc: "Family, municipality and syndicate elect their procurators. The Cortes gains a voice without parties."
 COLDWAR_SPR_fet_sentinel_of_the_west: "Sentinel of the West"
 COLDWAR_SPR_fet_sentinel_of_the_west_desc: "Spain held the line against communism in 1936. It will hold the Strait and the Pyrenees again."
 COLDWAR_SPR_fet_guardians_of_the_strait: "The Guardians of the Strait"
 COLDWAR_SPR_fet_guardians_of_the_strait_desc: "Ceuta, Melilla and the Canaries are the gates of the Strait. Whoever holds them holds the Mediterranean's door."
 COLDWAR_SPR_fet_southern_sentinels_axis: "The Madrid-Lisbon-Athens Axis"
 COLDWAR_SPR_fet_southern_sentinels_axis_desc: "Caetano's Portugal and the colonels' Greece face the same enemies. Three regimes of order can stand together on Europe's southern flank."
 COLDWAR_SPR_gp_shipyards: "The Yards of Ferrol and Cartagena"
 COLDWAR_SPR_gp_shipyards_desc: "Bazán builds the fleet of the empire in Ferrol and Cartagena."
 COLDWAR_SPR_gp_steel_triangle: "The Steel Triangle"
 COLDWAR_SPR_gp_steel_triangle_desc: "Avilés, Bilbao and Sagunto pour steel for ships and tanks, under directors appointed in Madrid."
 COLDWAR_SPR_gp_carriers: "Carriers for the Empire"
 COLDWAR_SPR_gp_carriers_desc: "The Dédalo is only the beginning. The fleet needs decks of its own."
 COLDWAR_SPR_gp_strategic_air_command: "The Air Command of the Empire"
 COLDWAR_SPR_gp_strategic_air_command_desc: "Bases from the Pyrenees to the Canaries give the air force reach over the Strait and the Atlantic."
 COLDWAR_SPR_gp_iberian_market: "A Common Iberian Market"
 COLDWAR_SPR_gp_iberian_market_desc: "Roads, tariffs and power lines across the Raya tie the two economies together."
 COLDWAR_SPR_gp_occupation_administration: "The Western Provinces"
 COLDWAR_SPR_gp_occupation_administration_desc: "Whatever comes under Spanish administration must be governed firmly and quietly."
 COLDWAR_SPR_gp_hispanic_pact: "The Hispanic Pact"
 COLDWAR_SPR_gp_hispanic_pact_desc: "An alliance of Hispanic nations under the cross of Saint James, outside the blocs of Washington and Moscow."
 COLDWAR_SPR_gp_voice_of_spain: "The Voice of Spain"
 COLDWAR_SPR_gp_voice_of_spain_desc: "Radio Exterior de España broadcasts the Movement's message from the Río de la Plata to Manila."
 COLDWAR_SPR_fet_the_state_endures: "The State of 18 July Endures"
 COLDWAR_SPR_fet_the_state_endures_desc: "The institutions outlive the man. The Movement has made the 18 July a permanent state."
 COLDWAR_SPR_fet_eternal_sentinel: "The Eternal Sentinel"
 COLDWAR_SPR_fet_eternal_sentinel_desc: "Spain stands alone and unbowed. The 18 July is the state, and the state needs no permission from Brussels or Washington."
 COLDWAR_SPR_gp_total_mobilisation: "Total Mobilisation of Industry"
 COLDWAR_SPR_gp_total_mobilisation_desc: "The civilian economy works for the army first. The shops can wait."
 COLDWAR_SPR_gp_armed_nation: "The Armed Nation"
 COLDWAR_SPR_gp_armed_nation_desc: "Barracks in every province, parades every Sunday: Spain is a nation in arms."
 COLDWAR_SPR_gp_iberian_fortress: "The Iberian Fortress"
 COLDWAR_SPR_gp_iberian_fortress_desc: "From the Pyrenees to the Atlantic, the peninsula becomes one fortress."
 COLDWAR_SPR_gp_three_continents: "An Empire on Three Continents"
 COLDWAR_SPR_gp_three_continents_desc: "Europe, Africa and America: wherever Spanish is spoken, Madrid speaks first."
 COLDWAR_SPR_gp_autarkic_empire: "The Autarkic Empire"
 COLDWAR_SPR_gp_autarkic_empire_desc: "Spain feeds, fuels and arms itself. No foreign power can starve it into submission."
 COLDWAR_SPR_gp_sword_of_hispanidad: "The Sword of Hispanidad"
 COLDWAR_SPR_gp_sword_of_hispanidad_desc: "The armed forces of Spain are again the first in the Mediterranean and the guardians of the Hispanic world."
 COLDWAR_SPR_gp_one_great_free: "Spain, One, Great and Free"
 COLDWAR_SPR_gp_one_great_free_desc: "The peninsula is whole, the Strait is Spanish and the slogan of the Movement has become a map."
 COLDWAR_SPR_gp_fourth_great_power: "The Fourth Great Power"
 COLDWAR_SPR_gp_fourth_great_power_desc: "After Washington, Moscow and Peking, the world must reckon with Madrid."
 COLDWAR_SPR_junta_e: "The Officers' Directorate"
 COLDWAR_SPR_junta_e_desc: "The three armed forces take the state in trust until order is restored. Every captain general now holds a ministry, a province, or both."
 COLDWAR_SPR_junta_pol: "The Higher General Staff"
 COLDWAR_SPR_junta_pol_desc: "The Alto Estado Mayor becomes the cabinet's brain. Plans are drawn on the Castellana, not in the Cortes, and orders reach every province the same day."
 COLDWAR_SPR_junta_eco: "The Army's Economy"
 COLDWAR_SPR_junta_eco_desc: "Quartermasters become managers. The barracks buy from their own factories, and the defence budget doubles as industrial policy."
 COLDWAR_SPR_junta_a1: "The Hard Line"
 COLDWAR_SPR_junta_a1_desc: "No parties, no strikes, no concessions. The generals who stood by the Caudillo say the nation needs a firm hand, and the barracks agree."
 COLDWAR_SPR_junta_a2: "The Reforming General"
 COLDWAR_SPR_junta_a2_desc: "Only a modern, professional army can govern without being hated. The old generals mutter about pay, careers and loyalty, but the reform cannot wait."
 COLDWAR_SPR_junta_b1: "Military Developmentalism"
 COLDWAR_SPR_junta_b1_desc: "Steel, shells and shipyards first: the staff plans national growth the way it plans a campaign. The consumer will have to wait his turn."
 COLDWAR_SPR_junta_b2: "The Orthodox Stabilisation"
 COLDWAR_SPR_junta_b2_desc: "Balanced budgets, a hard peseta and no tolerance for strikes. The generals borrow the Bank of Spain's caution and apply it with a barracks rod."
 COLDWAR_SPR_junta_a1f: "Milans del Bosch's Valencia"
 COLDWAR_SPR_junta_a1f_desc: "The III Military Region sets the example: tanks in the streets of Valencia, curfew at dusk and the captain general as master of the Levante."
 COLDWAR_SPR_junta_a2f: "Gutiérrez Mellado's Reform"
 COLDWAR_SPR_junta_a2f_desc: "One ministry for three armies, a joint staff and a younger officer corps. Gutiérrez Mellado stands up to the old guard, and the old guard never forgives him."
 COLDWAR_SPR_junta_b1f: "Defence Industry First"
 COLDWAR_SPR_junta_b1f_desc: "Every peseta of the defence budget must return as Spanish jobs: CETME rifles, Aviocars, frigates built in Ferrol. Imported arms are for emergencies only."
 COLDWAR_SPR_junta_b2f: "The Austerity of the Barracks"
 COLDWAR_SPR_junta_b2f_desc: "The Directorate cuts first at home: officers' pay frozen, guest houses closed, no new luxuries. Whoever asks the nation for sacrifice must show the way."
 COLDWAR_SPR_junta_pm: "The Armada Solution"
 COLDWAR_SPR_junta_pm_desc: "One general at the head, civilians from every party at the table. The Cortes, the King and the barracks all stay inside the institutions."
 COLDWAR_SPR_junta_em: "Santa Bárbara and Bazán"
 COLDWAR_SPR_junta_em_desc: "Trubia's guns, Ferrol's frigates, Cádiz's hulls: the state arsenals feed the army and sell to whoever pays in hard currency."
 COLDWAR_SPR_junta_c1: "Counter-Subversion"
 COLDWAR_SPR_junta_c1_desc: "ETA, GRAPO and the party cells all serve one enemy. A unified intelligence service listens to every telephone and reads every letter."
 COLDWAR_SPR_junta_c2: "The Army Leaves Politics"
 COLDWAR_SPR_junta_c2_desc: "Barracks to the barracks, ballots to the people. The generals return to their duties and accept the verdict of the polls, whatever it may be."
 COLDWAR_SPR_junta_d1: "The American General Staff"
 COLDWAR_SPR_junta_d1_desc: "Torrejón, Rota and the Joint Staff already speak English. Training, doctrine and spare parts from the Pentagon will modernise the army faster than any home reform."
 COLDWAR_SPR_junta_d2: "The Fortress Peninsula"
 COLDWAR_SPR_junta_d2_desc: "Behind the Pyrenees and the Strait, Spain needs nobody's umbrella. Fortified lines, home-built weapons and a mobilised reserve make the peninsula too costly to invade."
 COLDWAR_SPR_junta_cm: "The Armed Institution"
 COLDWAR_SPR_junta_cm_desc: "Careers, housing, hospitals and academies: the army is a state within the state, loyal because it is looked after, proud because it is the oldest institution of Spain."
 COLDWAR_SPR_junta_dm: "The Strait Command"
 COLDWAR_SPR_junta_dm_desc: "Algeciras, Ceuta and Melilla form one chain of command. Whoever controls the Strait controls Spain's southern door and the Atlantic traffic."
 COLDWAR_SPR_junta_cap: "The Guardian of the Constitution"
 COLDWAR_SPR_junta_cap_desc: "Article 8 of the new order: the armed forces guarantee the unity and independence of Spain. The nation sleeps because the army watches."
 COLDWAR_SPR_crown_e: "The Crown of the Transition"
 COLDWAR_SPR_crown_e_desc: "A king crowned by the Cortes, sworn to the Principles, yet with the ambition of reconciling the nation. The old regime and the new Spain both claim him."
 COLDWAR_SPR_crown_eco: "The King's Economists"
 COLDWAR_SPR_crown_eco_desc: "Professors from Madrid, Barcelona and Bilbao take the economic ministries. They talk about prices, taxes and productivity, not about the syndicate ideal."
 COLDWAR_SPR_crown_pol: "Torcuato's Plan"
 COLDWAR_SPR_crown_pol_desc: "Fernández-Miranda's legal engineering shows the way: every step uses the old laws, so the old guard has no excuse to stop it."
 COLDWAR_SPR_crown_b2: "The Patrimony and the INI"
 COLDWAR_SPR_crown_b2_desc: "The state keeps its heavy industry and puts its idle capital to work. Coal, steel and shipyards are not bargained away to foreign shareholders."
 COLDWAR_SPR_crown_b1: "Fuentes Quintana's Plan"
 COLDWAR_SPR_crown_b1_desc: "Wages follow expected, not past, inflation; a hard peseta; a fiscal reform. Fuentes Quintana asks everybody for a sacrifice, and the parties have to sign."
 COLDWAR_SPR_crown_a2: "Royal Authority"
 COLDWAR_SPR_crown_a2_desc: "A king who commands is a king who endures. The Crown keeps the last word over cabinets and barracks, and the opposition must wait."
 COLDWAR_SPR_crown_a1: "Reform from Above"
 COLDWAR_SPR_crown_a1_desc: "The reform comes from the palace and the Cortes, not from the street: the regime legislates its own end and the opposition takes the offered hand."
 COLDWAR_SPR_crown_b2f: "Continuity of the Plans"
 COLDWAR_SPR_crown_b2f_desc: "The planning commissariat's files stay in the drawers of the Castellana. The King's ministers keep the plans, the targets and the poles, and only change the names."
 COLDWAR_SPR_crown_b1f: "The Tax Reform"
 COLDWAR_SPR_crown_b1f_desc: "A personal income tax, a wealth tax and the end of the old fiscal privileges. Those who earned most under the old regime now pay like Europeans."
 COLDWAR_SPR_crown_a2f: "A Monarchy of the 18 July"
 COLDWAR_SPR_crown_a2f_desc: "The King swears to the Principles and means it. The Movement's institutions stay, the Falange's ministers stay, and the Crown becomes the keystone of the old order."
 COLDWAR_SPR_crown_a1f: "From Law to Law"
 COLDWAR_SPR_crown_a1f_desc: "The Cortes of the regime votes its own dissolution by law. Not a break, not a revolution: every step stays legal, which is why the army has no excuse to stop it."
 COLDWAR_SPR_crown_em: "The Social Pact"
 COLDWAR_SPR_crown_em_desc: "Unions, employers and the government sign: moderation in wages and prices in return for jobs, rights and a place at the table. Peace in the workplace is the Crown's best investment."
 COLDWAR_SPR_crown_pm: "Don Juan Renounces"
 COLDWAR_SPR_crown_pm_desc: "The Count of Barcelona hands his father's rights to his son. The monarchy of Franco and the monarchy of the Bourbons are now one and the same crown."
 COLDWAR_SPR_crown_king_governs: "The King Governs"
 COLDWAR_SPR_crown_king_governs_desc: "The King inherits Franco's powers and keeps them. Ministers serve at his pleasure, and the Cortes advises."
 COLDWAR_SPR_crown_d2: "The Atlantic Crown"
 COLDWAR_SPR_crown_d2_desc: "Washington applauded the King in 1976. Credit, arms and a future place in NATO flow when Spain shows it belongs to the West."
 COLDWAR_SPR_crown_d1: "The King's Journeys to America"
 COLDWAR_SPR_crown_d1_desc: "The King on the road in Caracas, Bogotá and Mexico City: shared language, shared faith and shared markets. Spain speaks to its brothers across the ocean."
 COLDWAR_SPR_crown_c2: "Order First"
 COLDWAR_SPR_crown_c2_desc: "Freedom needs order first. The King backs a firm interior ministry, a reinforced Guardia Civil and the strict application of the public order law until the terror ends."
 COLDWAR_SPR_crown_c1: "The Amnesty"
 COLDWAR_SPR_crown_c1_desc: "Every prisoner of conscience and every exile may come home, and the wounds of the war and of the dictatorship are left to the historians. The King opens the prisons and the borders."
 COLDWAR_SPR_crown_rule_by_decree: "Rule by Royal Decree"
 COLDWAR_SPR_crown_rule_by_decree_desc: "A cabinet of royal confidants and planners governs by decree. The court, not the barracks, holds the pen."
 COLDWAR_SPR_crown_king_and_the_army: "The King and the Army"
 COLDWAR_SPR_crown_king_and_the_army_desc: "The Captain General of the Armed Forces wears the crown. A military directorate governs in the King's name, as in 1923."
 COLDWAR_SPR_crown_dm: "The Crown's Diplomacy"
 COLDWAR_SPR_crown_dm_desc: "Paris, Bonn, London and the Gulf: the King opens every door that diplomats cannot. Spain becomes a middle power by courtesy and by conviction."
 COLDWAR_SPR_crown_cm: "A King for All Spaniards"
 COLDWAR_SPR_crown_cm_desc: "He speaks to Basques in Gernika, to Catalans in Barcelona, to Andalusians in Seville and to soldiers in the barracks. A crown above the parties unites those who agree on nothing else."
 COLDWAR_SPR_crown_suspend_the_cortes: "Suspend the Cortes"
 COLDWAR_SPR_crown_suspend_the_cortes_desc: "The procurators go home. Spain is governed from the Zarzuela, and the Fundamental Laws are whatever the King signs."
 COLDWAR_SPR_crown_cap: "The Crown of the Constitution"
 COLDWAR_SPR_crown_cap_desc: "Sovereignty lies with the Spanish people, and the King stands above it as symbol and arbiter. After 23 February the Constitution has no better defender than the one who wears the crown."
 COLDWAR_SPR_crown_sovereign_crown: "The Sovereign Crown"
 COLDWAR_SPR_crown_sovereign_crown_desc: "The monarchy of the 18 July becomes a monarchy in its own right. The King rules, and Spain obeys the Crown rather than a party."
 COLDWAR_SPR_fn_e: "The New Force"
 COLDWAR_SPR_fn_e_desc: "A new force for an old Spain: Blas Piñar's movement of faith, nation and order takes over the state it always said was betrayed."
 COLDWAR_SPR_fn_pol: "Blas Piñar's Rallies"
 COLDWAR_SPR_fn_pol_desc: "Every 20 November the Plaza de Oriente fills with arms raised to the memory of the Caudillo. Piñar's voice is the voice of the street that refuses to forget."
 COLDWAR_SPR_fn_eco: "Catholic Corporatism"
 COLDWAR_SPR_fn_eco_desc: "Capital and labour are not enemies but members of one national body, guided by the social teaching of the Church. The free market is a foreign idea that Spain does not need."
 COLDWAR_SPR_fn_a1: "The Legal List"
 COLDWAR_SPR_fn_a1_desc: "The New Force fields a legal list at every election. Votes, not coups, will carry the faith back into the Cortes, and the hotheads call it surrender."
 COLDWAR_SPR_fn_a2: "The Street"
 COLDWAR_SPR_fn_a2_desc: "Where the ballot is too slow, the youth fills the streets. Order is made by those who dare to defend it, not by those who wait for permission."
 COLDWAR_SPR_fn_b1: "The Corporate State"
 COLDWAR_SPR_fn_b1_desc: "Guilds, estates and syndicates replace the quarrel of classes. Everyone has his place in the national body, and the State keeps the books."
 COLDWAR_SPR_fn_b2: "Anti-Capitalist Falangism"
 COLDWAR_SPR_fn_b2_desc: "José Antonio's forgotten message: the Falange was born to be anti-capitalist. Banks and trusts serve the nation or they do not serve at all."
 COLDWAR_SPR_fn_a1f: "National Union"
 COLDWAR_SPR_fn_a1f_desc: "The nationalist right joins under one list for one election. One deputy is enough to carry the case of the 18 July into the Cortes."
 COLDWAR_SPR_fn_a2f: "The Guerrillas of Christ the King"
 COLDWAR_SPR_fn_a2f_desc: "The Guerrillas of Christ the King sort out the enemies of Spain with fists, chains and sometimes guns. The state looks away, and the foreign press looks closely."
 COLDWAR_SPR_fn_b1f: "The Guild Chambers"
 COLDWAR_SPR_fn_b1f_desc: "Every trade has its chamber, with owners and workers seated together under the State's chair. Strikes become crimes against the national body, and wages follow the plan."
 COLDWAR_SPR_fn_b2f: "Nationalise the Banks of the Rich"
 COLDWAR_SPR_fn_b2f_desc: "The banks of the great families pass into the State's hands and fund the nation's plan. The rich are told that the nation, not their bank, decides where credit goes."
 COLDWAR_SPR_fn_pm: "Against the Constitution"
 COLDWAR_SPR_fn_pm_desc: "The new text calls itself a constitution, but it throws the faith of the nation out of the state and breaks it into 17 autonomies. Fuerza Nueva will not sign."
 COLDWAR_SPR_fn_em: "The Small Owners"
 COLDWAR_SPR_fn_em_desc: "The smallholder, the shopkeeper and the artisan are the backbone of the Spanish nation. Protect them against the trusts and the nation stays strong."
 COLDWAR_SPR_fn_c1: "Defend the Faith"
 COLDWAR_SPR_fn_c1_desc: "Catholic faith is the soul of Spain. Mass, catechism and the family are the first line of defence against the new permissiveness and the divorce law."
 COLDWAR_SPR_fn_c2: "Against the Autonomies"
 COLDWAR_SPR_fn_c2_desc: "The motherland is one and indivisible. The regional statutes are the first step to the break-up of Spain, and the Army will not let it happen."
 COLDWAR_SPR_fn_d1: "The Euroright"
 COLDWAR_SPR_fn_d1_desc: "The Euroright reaches from Rome to Paris to Lisbon. The same parties and presses that serve Piñar abroad serve him at home, and every nationalist exile finds a seat in Madrid."
 COLDWAR_SPR_fn_d2: "Spain Alone"
 COLDWAR_SPR_fn_d2_desc: "Spain needs no friends: no Common Market, no NATO, no Moscow. Autarky was good enough for the Caudillo and is good enough for his heirs."
 COLDWAR_SPR_fn_cm: "The Catholic Unity"
 COLDWAR_SPR_fn_cm_desc: "One nation, one faith, one law. Catholic unity binds Spain together again as it did under the Catholic Monarchs."
 COLDWAR_SPR_fn_dm: "The National Front of Europe"
 COLDWAR_SPR_fn_dm_desc: "A continent of nations from Lisbon to Warsaw, a Europe of the fatherlands. The National Front of Europe gathers every party that refuses both Brussels and Moscow."
 COLDWAR_SPR_fn_cap: "The New Force in Power"
 COLDWAR_SPR_fn_cap_desc: "The voice of the rallies is the voice of the state. Faith, order and the nation, taught in the schools and guarded in the barracks."
 COLDWAR_SPR_the_third_way: "The Third Way"
 COLDWAR_SPR_the_third_way_desc: "Neither the Falange nor the opposition: Catholic professionals and planners offer a third path."
 COLDWAR_SPR_opus_dei_network: "The Work's Network"
 COLDWAR_SPR_opus_dei_network_desc: "Opus Dei ministers, IESE and the University of Navarra train the elite of the development plans."
 COLDWAR_SPR_cuadernos_para_el_dialogo: "Notebooks for Dialogue"
 COLDWAR_SPR_cuadernos_para_el_dialogo_desc: "Ruiz-Giménez's magazine opens a Catholic, democratic conversation the regime cannot ban."
 COLDWAR_SPR_the_centre_of_gravity: "The Centre of Gravity"
 COLDWAR_SPR_the_centre_of_gravity_desc: "The centre is where the transition will be decided."
 COLDWAR_SPR_tec_e: "The Planners' Government"
 COLDWAR_SPR_tec_e_desc: "The ministers of the Work and their friends hold the economy and the state. They talk about GDP, not about ideology, and the Caudillo lets them."
 COLDWAR_SPR_tec_pol: "López Rodó's Commissariat"
 COLDWAR_SPR_tec_pol_desc: "The Commissariat for the Development Plan is the real cabinet: López Rodó drafts, the ministries obey, and the Cortes only reads the final text."
 COLDWAR_SPR_tec_eco: "The Fourth Development Plan"
 COLDWAR_SPR_tec_eco_desc: "Growth targets of six percent a year, investment in the poles, steel and shipyards: the Plan promises to double the income per head again."
 COLDWAR_SPR_tec_a1: "Carrero Blanco's Continuity"
 COLDWAR_SPR_tec_a1_desc: "The Admiral is the regime's rock. With him at the helm, order and growth continue exactly as before."
 COLDWAR_SPR_tec_a2: "The Monarchy of the Technocrats"
 COLDWAR_SPR_tec_a2_desc: "The technocrats accept the monarchy: the King reigns, the planners govern, and nobody needs to vote for it."
 COLDWAR_SPR_tec_b1: "Indicative Planning"
 COLDWAR_SPR_tec_b1_desc: "The state sets the targets, the firms respond: French-style indicative planning gives investment a compass without shutting the market."
 COLDWAR_SPR_tec_b2: "Liberalise and Attract Capital"
 COLDWAR_SPR_tec_b2_desc: "Open the doors: lower tariffs, lighter permits and a welcome mat for foreign capital. Money goes where it is treated well."
 COLDWAR_SPR_tec_a1f: "The President Survives"
 COLDWAR_SPR_tec_a1f_desc: "The car clears the tunnel and the Admiral lives to see 1974. The strongman keeps the reins and the technocrats keep their power."
 COLDWAR_SPR_tec_a2f: "López Rodó's Succession Plan"
 COLDWAR_SPR_tec_a2f_desc: "Franco's heir will reign under a cabinet that keeps the economy running. López Rodó writes the plan: the Prince as the symbol, the planners as the government."
 COLDWAR_SPR_tec_b1f: "The Growth Poles"
 COLDWAR_SPR_tec_b1f_desc: "Burgos, Huelva, Vigo, Valladolid, Zaragoza: factories planted in poor provinces, where the Plan promised them. Each pole is a city made by decree."
 COLDWAR_SPR_tec_b2f: "The Foreign Investment Law"
 COLDWAR_SPR_tec_b2f_desc: "A new law lets foreign firms own what they build. Ford, General Motors and Renault will plant Spanish factories, and part of the profits will fly home."
 COLDWAR_SPR_tec_pm: "Development Without Democracy"
 COLDWAR_SPR_tec_pm_desc: "Peace, work and growth in return for silence: the technocrats offer prosperity as a substitute for parties and ballots."
 COLDWAR_SPR_tec_em: "The Miracle Continues"
 COLDWAR_SPR_tec_em_desc: "Every year the economy grows, the cars are shinier and the flats are bigger. The technocrats are sure the miracle has no end."
 COLDWAR_SPR_tec_c1: "The General Education Law"
 COLDWAR_SPR_tec_c1_desc: "Eight compulsory years of schooling, a unified secondary school and a university entry course for all. The country's future is trained, not born."
 COLDWAR_SPR_tec_c2: "The Universities of the Work"
 COLDWAR_SPR_tec_c2_desc: "Elite faculties and business schools train the managers who will run the economy. The state need not educate everyone, only those who will lead."
 COLDWAR_SPR_tec_d1: "The European Gamble"
 COLDWAR_SPR_tec_d1_desc: "Spain is Europe's southern gate and the Common Market's best customer. Open the economy, apply for full membership and let competition do what the Cortes cannot."
 COLDWAR_SPR_tec_d2: "Project Islero"
 COLDWAR_SPR_tec_d2_desc: "Spain has uranium, engineers and a nuclear board. Islero will make Spanish reactors and Spanish fuel, and the lights stay on whatever the sheikhs charge for oil."
 COLDWAR_SPR_tec_cm: "The Technical State"
 COLDWAR_SPR_tec_cm_desc: "Engineers in the ministries, engineers on the boards, engineers in the banks. The state is run like a plant: targets, schedules and accountable managers."
 COLDWAR_SPR_tec_dm: "The Atomic Option"
 COLDWAR_SPR_tec_dm_desc: "Spain builds its own fuel cycle: uranium mines, a fuel plant and reactors. No foreign supplier and no oil price will switch off the country."
 COLDWAR_SPR_tec_cap: "The Developmental State"
 COLDWAR_SPR_tec_cap_desc: "Plans, poles and professors. The state sets the goals, private firms reach them, and the people are told to be patient: the next generation will be rich."
 COLDWAR_SPR_dc_e: "The Christian Democratic Team"
 COLDWAR_SPR_dc_e_desc: "Two old gentlemen of Catholic politics, each with his own following, now share one platform. The Church watches, the generals frown, and Europe's Christian democrats applaud."
 COLDWAR_SPR_dc_pol: "The Two Leaders"
 COLDWAR_SPR_dc_pol_desc: "Joaquín Ruiz-Giménez speaks for the progressive Catholics, José María Gil-Robles for the old conservative centre. Together they open the doors of the Church to democracy, and quarrel about the furniture."
 COLDWAR_SPR_dc_eco: "Catholic Social Teaching"
 COLDWAR_SPR_dc_eco_desc: "Human dignity before profit and a just wage before dividends. The social encyclicals give the party a programme the unions can read and the bishops can bless."
 COLDWAR_SPR_dc_a1: "Ruiz-Giménez's Democratic Left"
 COLDWAR_SPR_dc_a1_desc: "Ruiz-Giménez was Franco's education minister and later the regime's most elegant critic. His left-leaning Catholics take the side of the strikers and the exiles."
 COLDWAR_SPR_dc_a2: "Gil-Robles' Popular Federation"
 COLDWAR_SPR_dc_a2_desc: "Gil-Robles led the Catholic right before the war and now offers it again as a reasonable centre. Landowners and the middle class see him as safe, the workers do not."
 COLDWAR_SPR_dc_b1: "Co-Determination"
 COLDWAR_SPR_dc_b1_desc: "Works councils and workers on the supervisory board, as in the Rhineland. Co-determination turns the factory into a partnership instead of a battlefield."
 COLDWAR_SPR_dc_b2: "The Social Market Economy"
 COLDWAR_SPR_dc_b2_desc: "Competition within rules, with the State as the referee and not as the owner. Erhard's German miracle shows what Catholic democrats can achieve."
 COLDWAR_SPR_dc_a1f: "Notebooks for Dialogue"
 COLDWAR_SPR_dc_a1f_desc: "The monthly review that taught a generation of Spaniards to argue without shouting. Writers, priests and ministers sit on one editorial board."
 COLDWAR_SPR_dc_a2f: "The Popular Democrats"
 COLDWAR_SPR_dc_a2f_desc: "A federation of Catholic democrats from Castile, Navarre and Aragon, with small-town mayors and local business. Not glamorous, but elected."
 COLDWAR_SPR_dc_b1f: "Worker Shareholders"
 COLDWAR_SPR_dc_b1f_desc: "Every worker a part-owner of the firm he serves. The Mondragón cooperatives of the Basque Country show that capital and labour can share the same table."
 COLDWAR_SPR_dc_b2f: "The Family Firm"
 COLDWAR_SPR_dc_b2f_desc: "The family business is the school of work and thrift. Tax relief for the small firm keeps the village alive and the family together."
 COLDWAR_SPR_dc_pm: "The Democratic Centre Team"
 COLDWAR_SPR_dc_pm_desc: "The Christian Democrats offer their votes and their names to a broad centre. Some call it betrayal, others survival."
 COLDWAR_SPR_dc_em: "The Social Pact of the Christians"
 COLDWAR_SPR_dc_em_desc: "Employers and unions sign a pact blessed by the Church: wage restraint against job security. Social peace is worth more than any single wage rise."
 COLDWAR_SPR_dc_c1: "Church Schools Protected"
 COLDWAR_SPR_dc_c1_desc: "Parents choose, the State pays, the Church teaches. Catholic schools keep their classrooms and their funding."
 COLDWAR_SPR_dc_c2: "Church and State Apart"
 COLDWAR_SPR_dc_c2_desc: "A free Church in a free state, each in its own sphere. The party that carries the Cross into politics learns to leave the Cross outside the ministry."
 COLDWAR_SPR_dc_d1: "European Christian Democracy"
 COLDWAR_SPR_dc_d1_desc: "The Christian democratic parties of Bonn and Rome open their ranks to us. Their money, their experience and their friends in Europe's institutions are ours, and Brussels will remind us of the bill."
 COLDWAR_SPR_dc_d2: "The Regionalist Alliance"
 COLDWAR_SPR_dc_d2_desc: "Basque and Catalan Christian democrats are our natural allies. A list with the PNV and Unió Democràtica opens Bilbao and Barcelona, and the barracks watches with suspicion."
 COLDWAR_SPR_dc_cm: "The Personalist State"
 COLDWAR_SPR_dc_cm_desc: "The State exists for the person, and the person is more than a worker or a voter. Personalism puts human dignity at the centre of every ministry."
 COLDWAR_SPR_dc_dm: "The European Popular Family"
 COLDWAR_SPR_dc_dm_desc: "A European People's Party for a Spain that wants to enter the Community. The Christian democrats prepare the way, and they take their place among the governing families of Europe."
 COLDWAR_SPR_dc_cap: "The Christian Democratic Centre"
 COLDWAR_SPR_dc_cap_desc: "Spain's own Christian democratic centre: Church and unions at one table, the market under the rule of law. The party of Adenauer and De Gasperi finally has a Spanish branch with a ministry."
 COLDWAR_SPR_economic_course: "The Economic Course"
 COLDWAR_SPR_economic_course_desc: "Planners, liberals and the old guard of the INI each claim the miracle as theirs. Spain must decide who steers the economy."
 COLDWAR_SPR_third_development_plan: "The Third Development Plan"
 COLDWAR_SPR_third_development_plan_desc: "The Third Development Plan sets targets for steel, cars and power until 1975. The technocrats promise that Spain grows by planning, and every province now wants a growth pole of its own."
 COLDWAR_SPR_indicative_planning: "Indicative Planning"
 COLDWAR_SPR_indicative_planning_desc: "The Commissariat of the Plan sets targets, credit follows the targets. Desarrollismo built the miracle and can finish it."
 COLDWAR_SPR_the_liberal_turn: "The Liberal Turn"
 COLDWAR_SPR_the_liberal_turn_desc: "Prices, credit and trade set free. Spain competes with Europe on Europe's terms, and the weak firms close."
 COLDWAR_SPR_the_national_economy: "The National Economy"
 COLDWAR_SPR_the_national_economy_desc: "Spanish industry for Spaniards. Protection, state holdings and national champions keep the economy out of foreign hands."
 COLDWAR_SPR_planning_commissariat: "The Planning Commissariat"
 COLDWAR_SPR_planning_commissariat_desc: "The Commissariat of the Plan steers credit, roads and factories from a small office in Madrid. The ministers call it indicative planning, the provincial governors call it a toll gate."
 COLDWAR_SPR_seat_and_the_motor_car: "SEAT and the Motor Car"
 COLDWAR_SPR_seat_and_the_motor_car_desc: "The SEAT 600 is the first car of the working family, and Barcelona and Valencia want more plants like it. The motor car becomes the symbol of the new Spain."
 COLDWAR_SPR_the_costa_del_sol: "The Costa del Sol"
 COLDWAR_SPR_the_costa_del_sol_desc: "Hotels, beach apartments and airfields rise along the coast of Málaga and Cádiz. Foreign pesetas pour into Andalucía, and the old landowners watch their fields turn into building plots."
 COLDWAR_SPR_nuclear_spain: "Nuclear Spain"
 COLDWAR_SPR_nuclear_spain_desc: "Oil is dear and Spain has little of it. The Junta de Energía Nuclear and the utilities want reactors on every big river, and Washington is glad to sell the fuel."
 COLDWAR_SPR_irrigation_plans: "The Irrigation Plans"
 COLDWAR_SPR_irrigation_plans_desc: "Dams, canals and new villages for the settlers. The Guadiana and the Tagus make the dry plains bloom, though the big estates do not enjoy being cut up."
 COLDWAR_SPR_the_growth_poles: "The Growth Poles"
 COLDWAR_SPR_the_growth_poles_desc: "Burgos, Huelva, Valladolid, Zaragoza, Vigo: tax breaks and cheap credit pull industry out of Madrid and Barcelona."
 COLDWAR_SPR_concerted_action: "Concerted Action"
 COLDWAR_SPR_concerted_action_desc: "The state signs contracts with the big firms: credit and tax relief for output targets in steel, ships and fertiliser."
 COLDWAR_SPR_open_the_doors: "Open the Doors to Foreign Capital"
 COLDWAR_SPR_open_the_doors_desc: "Ford in Valencia, General Motors in Zaragoza. Foreign capital brings the plants, the know-how and the jobs."
 COLDWAR_SPR_sound_money: "Sound Money"
 COLDWAR_SPR_sound_money_desc: "The Banco de España tightens credit until inflation breaks. Painful now, cheaper money for a decade."
 COLDWAR_SPR_protect_spanish_industry: "Protect Spanish Industry"
 COLDWAR_SPR_protect_spanish_industry_desc: "High tariffs and import licences keep Spanish factories full, whatever the price at the shop counter."
 COLDWAR_SPR_the_ini_holding_grows: "The INI Holding Grows"
 COLDWAR_SPR_the_ini_holding_grows_desc: "Failing private firms pass to the state holding. No Spanish yard or mine closes while the INI can carry it."
 COLDWAR_SPR_cushion_the_shock: "Cushion the Oil Shock"
 COLDWAR_SPR_cushion_the_shock_desc: "Let the pump price lag behind the world market. Petrol, diesel and electricity stay cheap enough for workers and farmers, and the Treasury pays the difference for now."
 COLDWAR_SPR_pass_on_the_shock: "Pass On the Oil Shock"
 COLDWAR_SPR_pass_on_the_shock_desc: "Prices at the pump follow the world market. Factories learn to save energy, drivers and farmers complain loudly, and the Treasury collects the difference."
 COLDWAR_SPR_the_steel_basin: "The Steel Basin"
 COLDWAR_SPR_the_steel_basin_desc: "Blast furnaces on the Nervión and rolling mills in Vizcaya feed every shipyard, car plant and building site of the country. The workers are organised, loud and well informed."
 COLDWAR_SPR_the_shipyards: "The Shipyards"
 COLDWAR_SPR_the_shipyards_desc: "Astilleros Españoles builds tankers faster than most of Europe. Cádiz gets new slipways, and the order books fill with Greek and Norwegian owners."
 COLDWAR_SPR_mass_tourism: "Mass Tourism"
 COLDWAR_SPR_mass_tourism_desc: "Charter flights from Hamburg, London and Paris fill every bed from Benidorm to Torremolinos. The money is welcome and so are the waiters' jobs, but Spain now lives on other countries' weather and wallets."
 COLDWAR_SPR_quality_tourism: "The Paradores"
 COLDWAR_SPR_quality_tourism_desc: "Castles, convents and palaces become state hotels for travellers who want Spain, not just the sun. Restoring stone costs time and money, but it makes Spanish tourism look like culture."
 COLDWAR_SPR_almaraz_and_lemoniz: "Almaraz and Lemóniz"
 COLDWAR_SPR_almaraz_and_lemoniz_desc: "Two big plants for the grid: Almaraz on the Tagus and Lemóniz on the Biscay coast. The Basque left calls Lemóniz a poison, and ETA has plans of its own for its engineers."
 COLDWAR_SPR_algerian_gas: "Gas from Algeria"
 COLDWAR_SPR_algerian_gas_desc: "Tankers of liquefied gas from Arzew dock in Barcelona, and bigger plans follow. Algiers sells us energy and expects Madrid to stay out of its quarrel with Rabat."
 COLDWAR_SPR_land_consolidation: "Land Consolidation"
 COLDWAR_SPR_land_consolidation_desc: "Scattered strips are merged into farms that can carry a tractor. Productivity rises, and the villages that lose their fields lose their young people too."
 COLDWAR_SPR_the_emigrants: "The Emigrants Abroad"
 COLDWAR_SPR_the_emigrants_desc: "Three million Spaniards work in Germany, France and Switzerland, and their money orders keep whole villages alive. Madrid is grateful, and afraid of the day they stop."
 COLDWAR_SPR_the_fourth_plan: "Planned Development"
 COLDWAR_SPR_the_fourth_plan_desc: "The Fourth Plan ties every ministry to one set of targets. The economy grows by decree as much as by demand."
 COLDWAR_SPR_the_market_economy: "The Market Economy"
 COLDWAR_SPR_the_market_economy_desc: "Spain becomes a normal European market economy. Investors come, and so do the cycles of the world market."
 COLDWAR_SPR_economic_sovereignty: "Economic Sovereignty"
 COLDWAR_SPR_economic_sovereignty_desc: "Spain can be sanctioned, embargoed and ignored, and still build. The price is a slower, dearer economy."
 COLDWAR_SPR_the_moncloa_pacts: "The Moncloa Pacts"
 COLDWAR_SPR_the_moncloa_pacts_desc: "All parties and the unions sit down in the Moncloa Palace and sign. Wages are held back, and in return come reforms, free unions and calmer streets."
 COLDWAR_SPR_industrial_reconversion: "Industrial Reconversion"
 COLDWAR_SPR_industrial_reconversion_desc: "Furnaces, yards and mills that cannot live on their own are closed or merged, and the survivors are made fit for Europe. It hurts in Sagunto, Gijón and Vigo, but the sums finally add up."
 COLDWAR_SPR_protect_the_yards: "Protect the Yards"
 COLDWAR_SPR_protect_the_yards_desc: "No yard closes, no furnace goes cold, and no family loses its wage. The workers have our word, and the Treasury has the bill."
 COLDWAR_SPR_the_nuclear_moratorium: "The Nuclear Moratorium"
 COLDWAR_SPR_the_nuclear_moratorium_desc: "Stop the unfinished reactors. The Basque coast and the anti-nuclear movement get what they marched for, and the utilities get a promise of compensation."
 COLDWAR_SPR_nuclear_expansion: "Nuclear Expansion"
 COLDWAR_SPR_nuclear_expansion_desc: "Finish what was started: Cofrentes, Trillo and the rest. Cheap electricity is worth more than a few thousand placards."
 COLDWAR_SPR_encourage_emigration: "The Emigration Institute"
 COLDWAR_SPR_encourage_emigration_desc: "Let the Institute send workers where the work is: contracts with Bonn and Paris, German lessons and a guaranteed passage. The Treasury gets the pesetas and the villages get the empty houses."
 COLDWAR_SPR_bring_them_home: "Bring Them Home"
 COLDWAR_SPR_bring_them_home_desc: "After the oil shock Europe sends the guest workers home. Give them housing, loans and a plot to start a business, so the skills learnt in Stuttgart and Lyon are used in Spain."
 COLDWAR_SPR_the_model_matures: "The Model Matures"
 COLDWAR_SPR_the_model_matures_desc: "Whatever course Spain took, it now has institutions that outlast ministers."
 COLDWAR_SPR_float_the_peseta: "Float the Peseta"
 COLDWAR_SPR_float_the_peseta_desc: "Let the peseta find its own price. Exporters and hotel owners cheer, while housewives and importers pay for it at the shop counter."
 COLDWAR_SPR_the_fiscal_reform: "The Fiscal Reform"
 COLDWAR_SPR_the_fiscal_reform_desc: "A real income tax on every salary and every fortune, with returns and inspectors. Wage earners are told it is fair, and old money is told to pay."
 COLDWAR_SPR_european_monetary_path: "The European Monetary Path"
 COLDWAR_SPR_european_monetary_path_desc: "The peseta joins Europe's exchange rate mechanism. Cheap credit and credibility, but no more devaluations to rescue exports."
 COLDWAR_SPR_the_managed_peseta: "The Managed Peseta"
 COLDWAR_SPR_the_managed_peseta_desc: "Madrid keeps its own currency lever. When exports falter, the peseta falls, and the bill comes later at the shop counter."
 COLDWAR_SPR_armed_forces_review: "The Armed Forces Review"
 COLDWAR_SPR_armed_forces_review_desc: "Count the men, the generals and the guns: 289,000 soldiers, 824 generals and tanks the Americans gave us in 1953. The honest answer is that this army was built to win the last war."
 COLDWAR_SPR_intervention_brigades: "The Intervention Brigades"
 COLDWAR_SPR_intervention_brigades_desc: "A small force of volunteers that can leave in hours: paratroopers, mountain troops and the first mobile brigades. They cost more than conscripts, and everyone knows they are the pick of the army."
 COLDWAR_SPR_rota_and_the_sixth_fleet: "Rota and the Sixth Fleet"
 COLDWAR_SPR_rota_and_the_sixth_fleet_desc: "American destroyers and Polaris submarines use Rota as their home port. Spanish admirals train with the Sixth Fleet, and Spanish students shout against it."
 COLDWAR_SPR_ejercito_del_aire: "The Air Ministry"
 COLDWAR_SPR_ejercito_del_aire_desc: "The Air Ministry keeps its own minister, its own budget and its own pride. Pilots finally get their flight hours, and the budget gets a bigger line."
 COLDWAR_SPR_the_legion: "The Legion and the Regulares"
 COLDWAR_SPR_the_legion_desc: "The Legion and the native Regulares are the only units that have fought in this century. From El Aaiún to Melilla they hold the African edge of Spain, and nobody in Morocco forgets it."
 COLDWAR_SPR_amx30_licence: "The AMX-30 Licence"
 COLDWAR_SPR_amx30_licence_desc: "Build the French tank under licence at Santa Bárbara. It is better armed than anything we own, and every spare part comes with a French invoice."
 COLDWAR_SPR_patton_upgrades: "The Patton Upgrades"
 COLDWAR_SPR_patton_upgrades_desc: "Keep the M47s and M48s the Americans gave us, with new engines, new guns and American spare parts. Cheap, fast and familiar, as long as Washington keeps the warehouse door open."
 COLDWAR_SPR_the_dedalo: "The Dédalo"
 COLDWAR_SPR_the_dedalo_desc: "An old American light carrier flies the Spanish flag. Helicopters and soon Harrier jump jets give the fleet its first real air arm."
 COLDWAR_SPR_bazan_frigates: "The Bazán Frigates"
 COLDWAR_SPR_bazan_frigates_desc: "Bazán in Ferrol builds frigates of its own: the Baleares class, based on a US design but with Spanish steel. The yard is state owned, and the ships are ours."
 COLDWAR_SPR_mirage_from_france: "Mirages from France"
 COLDWAR_SPR_mirage_from_france_desc: "The French Mirage is cheaper than the Phantom, and Dassault builds it with offsets. The pilots grumble, the mechanics curse the engines, and the Treasury is relieved."
 COLDWAR_SPR_phantoms_from_america: "Phantoms from America"
 COLDWAR_SPR_phantoms_from_america_desc: "The F-4 Phantom is the best fighter-bomber the Americans will sell us. It is fast, heavily armed and expensive to keep in the air."
 COLDWAR_SPR_plan_meta: "Plan META"
 COLDWAR_SPR_plan_meta_desc: "Cut the officer corps to the size of the army, close the half-empty barracks and merge the divisions. Many colonels will not forgive us."
 COLDWAR_SPR_principe_de_asturias: "The Príncipe de Asturias"
 COLDWAR_SPR_principe_de_asturias_desc: "A carrier of our own: the Príncipe de Asturias, built in Ferrol. It shows that Spain is a naval power in the Atlantic and the Mediterranean, even if the price is a big one."
 COLDWAR_SPR_casa_aircraft: "CASA Builds Planes"
 COLDWAR_SPR_casa_aircraft_desc: "CASA at Getafe turns out cargo planes, trainers and licensed fighters. For the first time an engineer from Spain can sign a drawing for an aircraft that flies."
 COLDWAR_SPR_the_faca_programme: "The FACA Programme"
 COLDWAR_SPR_the_faca_programme_desc: "Spain needs one fighter for the next twenty years, and the FACA programme will pick it. Four American and French firms compete, and the winner brings factories as well as aircraft."
 COLDWAR_SPR_the_mili_reform: "The Mili Reform"
 COLDWAR_SPR_the_mili_reform_desc: "Shorten military service to a year and give young men their lives back. The generals warn that a short draft cannot train a modern soldier."
 COLDWAR_SPR_a_modern_army: "A Modern Army"
 COLDWAR_SPR_a_modern_army_desc: "Mechanised brigades, NATO standards and a leaner chain of command. The army of 1939 is a museum, apart from the officers who refused to retire."
 COLDWAR_SPR_order_and_society: "Order and Society"
 COLDWAR_SPR_order_and_society_desc: "Strikes in Asturias, students in Madrid, bombs in the Basque Country. Order is the first duty of the state, and the Interior Ministry asks for men, budgets and a free hand."
 COLDWAR_SPR_the_guardia_civil: "The Guardia Civil"
 COLDWAR_SPR_the_guardia_civil_desc: "The tricorn hats patrol every village and every road. A rural order that has lasted since 1844 is the regime's cheapest guarantee against bandits, smugglers and agitators."
 COLDWAR_SPR_the_basque_question: "The Basque Question"
 COLDWAR_SPR_the_basque_question_desc: "A handful of gunmen has turned the Basque provinces into a front. Madrid must decide whether it answers with the baton or with the ballot box."
 COLDWAR_SPR_church_and_state: "Church and State"
 COLDWAR_SPR_church_and_state_desc: "The altar and the throne no longer walk in step. Young priests march with the workers, and the bishops want the state to stop speaking in their name."
 COLDWAR_SPR_the_public_order_court: "The Public Order Court"
 COLDWAR_SPR_the_public_order_court_desc: "A special court for strikes, leaflets and illegal meetings keeps the opposition in the dock instead of on the street. The judges answer to Madrid, not to the barricades."
 COLDWAR_SPR_dissolve_the_top: "Dissolve the Public Order Court"
 COLDWAR_SPR_dissolve_the_top_desc: "A court for opinions has no place in a state that wants Europe's respect. Political crimes go to the ordinary judges, and the barracks will not like it."
 COLDWAR_SPR_repression_in_euskadi: "Hard Hand in Euskadi"
 COLDWAR_SPR_repression_in_euskadi_desc: "Roadblocks, house searches, the state of exception. The Basque provinces will learn that the state is stronger than the gunmen, whatever the streets say."
 COLDWAR_SPR_the_statute_of_gernika: "The Statute of Gernika"
 COLDWAR_SPR_the_statute_of_gernika_desc: "Self-government for the Basque Country, its own police and its own taxes: the surest way to take the oxygen from the gunmen. The generals call it the first step to breakup."
 COLDWAR_SPR_revise_the_concordat: "Revise the Concordat"
 COLDWAR_SPR_revise_the_concordat_desc: "The state gives up the nomination of bishops and the privileged courts, the Church keeps its schools and its subsidy. A divorce on friendly terms."
 COLDWAR_SPR_the_end_of_censorship: "The End of Censorship"
 COLDWAR_SPR_the_end_of_censorship_desc: "Newspapers print what they like, cinemas show what they like. Spain reads, argues and strips off; the bishops are scandalised, the universities delighted."
 COLDWAR_SPR_the_dirty_war: "The Dirty War"
 COLDWAR_SPR_the_dirty_war_desc: "Men with no uniform and no name hunt the gunmen across the Pyrenees. The state denies everything, and for a while the strategy works."
 COLDWAR_SPR_social_reinsertion: "Social Reinsertion"
 COLDWAR_SPR_social_reinsertion_desc: "Every man who lays down his weapon and returns to work is one fewer for the movement. Pardons and jobs are hard to explain to the widows, but cheaper than another decade of funerals."
 COLDWAR_SPR_the_unity_of_the_nation: "The Unity of the Nation"
 COLDWAR_SPR_the_unity_of_the_nation_desc: "One flag, one law, one army. The regions may keep their dances and their dialects, but the state does not share its sovereignty."
 COLDWAR_SPR_tarradellas_returns: "Tarradellas Returns"
 COLDWAR_SPR_tarradellas_returns_desc: "The old president of the Generalitat steps off the train after thirty-eight years in exile. Catalonia gets its institutions back, and Madrid gets a loyal partner in Barcelona."
 COLDWAR_SPR_the_end_of_eta: "The Long Road to Peace"
 COLDWAR_SPR_the_end_of_eta_desc: "Silence in the Basque valleys, for the first time in two generations. The security forces stay, the scars stay, but the shooting has stopped."
 COLDWAR_SPR_spain_in_the_world: "Spain in the World"
 COLDWAR_SPR_spain_in_the_world_desc: "Spain has stood outside the club for thirty years. The foreign minister wants every embassy open, every market tried and every partner heard."
 COLDWAR_SPR_the_western_partners: "The Western Partners"
 COLDWAR_SPR_the_western_partners_desc: "Washington gives bases credit, Paris gives arms, London gives tourists. The Western capitals will take our calls, if we pick up theirs."
 COLDWAR_SPR_the_sahara_question: "The Sahara Question"
 COLDWAR_SPR_the_sahara_question_desc: "Phosphates in Bou Craa, fish off the coast and a restless population in the sand. The United Nations wants a decision, Rabat and Algiers want the land, and Madrid wants to decide first."
 COLDWAR_SPR_our_brothers_and_neighbours: "Brothers and Neighbours"
 COLDWAR_SPR_our_brothers_and_neighbours_desc: "Portugal at our side, the Americas in our language. Brothers are visited, and brothers sometimes ask for a loan."
 COLDWAR_SPR_us_bases_agreement: "The Bases Agreement"
 COLDWAR_SPR_us_bases_agreement_desc: "Rota, Torrejón, Morón and Zaragoza: American planes and ships on Spanish soil in exchange for tanks, credit and a seat at the Western table. The street will not like the price."
 COLDWAR_SPR_pyrenees_axis: "The Pyrenees Axis"
 COLDWAR_SPR_pyrenees_axis_desc: "Paris sells us the AMX tanks, the Mirages and the reactors. In return it wants a quiet southern border and a customer that does not look elsewhere."
 COLDWAR_SPR_gibraltar_process: "The Gibraltar Process"
 COLDWAR_SPR_gibraltar_process_desc: "The gate at La Línea has been shut since 1969. Open it for workers and tourists, talk about sovereignty later, and let both capitals save face."
 COLDWAR_SPR_towards_europe: "Towards Europe"
 COLDWAR_SPR_towards_europe_desc: "Brussels does not want a dictatorship, and Spain's farmers do not want Brussels. But a country that trades with Europe has to knock on its door."
 COLDWAR_SPR_madrid_accords: "The Madrid Accords"
 COLDWAR_SPR_madrid_accords_desc: "Let the Sahara go before the guerrilla starts. We keep the fishing and a third of the phosphates, and the Moroccan flank stays calm."
 COLDWAR_SPR_referendum_and_gas: "Referendum and Gas"
 COLDWAR_SPR_referendum_and_gas_desc: "Let the Sahrawis vote, and Algeria's gas will flow to Spain at friendly prices. Rabat will not forgive us, but Algiers has the better pipeline."
 COLDWAR_SPR_hold_the_sahara: "Hold the Sahara"
 COLDWAR_SPR_hold_the_sahara_desc: "The Sahara is Spanish and the Legion stays. Any march across the border will meet our rifles."
 COLDWAR_SPR_hispano_guinean_pact: "The Hispano-Guinean Pact"
 COLDWAR_SPR_hispano_guinean_pact_desc: "Spanish engineers, teachers and doctors return to Malabo. Guinea gets roads and schools, and Spain gets a friend in Africa's gulf."
 COLDWAR_SPR_iberian_pact: "The Iberian Pact"
 COLDWAR_SPR_iberian_pact_desc: "Two dictatorships on one peninsula, one backs the other's western door. We know what Lisbon pays for Angola, and Lisbon knows what we pay for the Sahara."
 COLDWAR_SPR_hispanidad: "Hispanidad"
 COLDWAR_SPR_hispanidad_desc: "We share a language, a faith and a history. Spanish credit, Spanish books and Spanish tourists will bind the Americas closer than treaties could."
 COLDWAR_SPR_eastern_trade_window: "The Eastern Trade Window"
 COLDWAR_SPR_eastern_trade_window_desc: "Moscow, Berlin and Warsaw have raw materials and oranges to buy. Business is business, though Washington may call it something else."
 COLDWAR_SPR_the_road_to_peking: "The Road to Peking"
 COLDWAR_SPR_the_road_to_peking_desc: "One billion customers, and a seat in the Security Council. The price is the embassy in Taipei and a sharp look from Moscow."
 COLDWAR_SPR_the_mediterranean_bridge: "The Mediterranean Bridge"
 COLDWAR_SPR_the_mediterranean_bridge_desc: "The same sea washes Valencia, Naples and Piraeus. Ships, tourists and engineers cross it every day, and Madrid wants a bridge, not a border."
 COLDWAR_SPR_the_atlantic_alliance: "The Atlantic Alliance"
 COLDWAR_SPR_the_atlantic_alliance_desc: "Rota alone is not enough: the generals want a place in the alliance, and the left wants none. Whoever signs will carry this question for years."
 COLDWAR_SPR_the_accession_treaty: "The Accession Treaty"
 COLDWAR_SPR_the_accession_treaty_desc: "Twenty-five years after the first letter, the door opens. Brussels brings motorways and subsidies, and also the end of tariff walls that kept the old industries alive."
 COLDWAR_SPR_arab_oil_friendship: "Arab Oil Friendship"
 COLDWAR_SPR_arab_oil_friendship_desc: "While Europe queues at the pumps, Spanish engineers build roads and refineries in the Gulf. Oil for steel and contracts, with no questions about our politics."
 COLDWAR_SPR_recognise_israel: "Recognise Israel"
 COLDWAR_SPR_recognise_israel_desc: "Forty years after the war, Spain finally opens an embassy in Tel Aviv. Israel brings laboratories and credit; the Gulf may close a few doors."
 COLDWAR_SPR_plans_for_the_maghreb: "Plans for the Maghreb"
 COLDWAR_SPR_plans_for_the_maghreb_desc: "The map room in the General Staff has a new folder. The old Protectorate zone from Tetuán to Oujda is marked in red, and nobody says it is only a drawing."
 COLDWAR_SPR_spanish_africa: "Spanish Africa"
 COLDWAR_SPR_spanish_africa_desc: "Africa began at the Pyrenees, said the old rhyme, and the Guinean coast remains ours by right and by culture. We protect, we build, we stay."
 COLDWAR_SPR_the_protectorate_restored: "The Protectorate Restored"
 COLDWAR_SPR_the_protectorate_restored_desc: "The Army of Africa has marched here before. If Morocco gives us a reason, the Protectorate will be restored from Ceuta to the Draa."
 COLDWAR_SPR_class_party: "The Class Party"
 COLDWAR_SPR_class_party_desc: "The party's working-class core keeps industry productive and loyal at the price of heavier bureaucracy."
 COLDWAR_SPR_public_credit_network: "The Public Credit Network"
 COLDWAR_SPR_public_credit_network_desc: "A state-run credit network speeds up industrial building and cheapens investment but invites patronage."
 COLDWAR_SPR_welfare_state: "The Welfare State"
 COLDWAR_SPR_welfare_state_desc: "A universal welfare system stabilises society but is expensive."
 COLDWAR_SPR_modernisation_of_spain: "The Modernisation of Spain"
 COLDWAR_SPR_modernisation_of_spain_desc: "A sweeping modernisation drive pushes the country forward at the cost of patronage and bureaucracy."
 COLDWAR_SPR_kingmaker: "The Kingmaker"
 COLDWAR_SPR_kingmaker_desc: "A pivotal centre party brokers every coalition, gaining leverage and cohesion at the cost of bureaucracy."
 COLDWAR_SPR_mutual_societies: "Mutual Societies"
 COLDWAR_SPR_mutual_societies_desc: "Cooperative mutual societies lift factory and farm productivity but dampen investor returns."
 COLDWAR_SPR_citizens_charter: "The Citizen's Charter"
 COLDWAR_SPR_citizens_charter_desc: "A charter of civil rights strengthens stability and clean government at the price of more administration."
 COLDWAR_SPR_centre_democrat_reform: "Centre Democrat Reform"
 COLDWAR_SPR_centre_democrat_reform_desc: "A broad centrist reform programme improves stability, research and investment climate but weakens party discipline and raises welfare costs."
 COLDWAR_SPR_consensus_politics: "Consensus Politics"
 COLDWAR_SPR_consensus_politics_desc: "Governing by consensus with all parties steadies the country but dilutes the government's authority."
 COLDWAR_SPR_centrist_cabinet: "The Centrist Cabinet"
 COLDWAR_SPR_centrist_cabinet_desc: "A cabinet of centrist barons builds and governs efficiently but at the price of patronage."
 COLDWAR_SPR_transition_completed: "The Transition Completed"
 COLDWAR_SPR_transition_completed_desc: "The completed transition consolidates the democratic order at the cost of a heavier state apparatus."
 COLDWAR_SPR_natural_majority: "The Natural Majority"
 COLDWAR_SPR_natural_majority_desc: "A natural governing majority of the right brings stability and investor trust but demands social spending."
 COLDWAR_SPR_workers_councils: "Workers' Councils"
 COLDWAR_SPR_workers_councils_desc: "Workers' Councils: a lasting national spirit of the ruling party."
 COLDWAR_SPR_the_monarchy_of_the_peoples: "The Monarchy of the Peoples"
 COLDWAR_SPR_the_monarchy_of_the_peoples_desc: "The Monarchy of the Peoples: a lasting national spirit of the ruling party."
 COLDWAR_SPR_fueros_restored: "Fueros Restored"
 COLDWAR_SPR_fueros_restored_desc: "Fueros Restored: a lasting national spirit of the ruling party."
 COLDWAR_SPR_the_traditional_monarchy: "The Traditional Monarchy"
 COLDWAR_SPR_the_traditional_monarchy_desc: "The Traditional Monarchy: a lasting national spirit of the ruling party."
 COLDWAR_SPR_socialism_in_freedom: "Socialism in Freedom"
 COLDWAR_SPR_socialism_in_freedom_desc: "Socialism in Freedom: a lasting national spirit of the ruling party."
 COLDWAR_SPR_the_guild_chambers: "The Guild Chambers"
 COLDWAR_SPR_the_guild_chambers_desc: "The Guild Chambers: a lasting national spirit of the ruling party."
 COLDWAR_SPR_catholic_unity: "Catholic Unity"
 COLDWAR_SPR_catholic_unity_desc: "Catholic Unity: a lasting national spirit of the ruling party."
 COLDWAR_SPR_the_new_force: "The New Force"
 COLDWAR_SPR_the_new_force_desc: "The New Force: a lasting national spirit of the ruling party."
 COLDWAR_SPR_the_christian_democratic_centre: "The Christian Democratic Centre"
 COLDWAR_SPR_the_christian_democratic_centre_desc: "The Christian Democratic Centre: a lasting national spirit of the ruling party."
 COLDWAR_SPR_the_ministry_of_defence: "The Ministry of Defence"
 COLDWAR_SPR_the_ministry_of_defence_desc: "National spirit from the focus Gutiérrez Mellado's Reform."
 COLDWAR_SPR_the_government_of_national_salvation: "The Government of National Salvation"
 COLDWAR_SPR_the_government_of_national_salvation_desc: "National spirit from the focus The Armada Solution."
 COLDWAR_SPR_professional_armed_forces: "Professional Armed Forces"
 COLDWAR_SPR_professional_armed_forces_desc: "National spirit from the focus The Army Leaves Politics."
 COLDWAR_SPR_the_armed_institution: "The Armed Institution"
 COLDWAR_SPR_the_armed_institution_desc: "National spirit from the focus The Guardian of the Constitution."
 COLDWAR_SPR_from_law_to_law: "From Law to Law"
 COLDWAR_SPR_from_law_to_law_desc: "National spirit from the focus From Law to Law."
 COLDWAR_SPR_the_monarchy_of_the_18_july: "The Monarchy of the 18 July"
 COLDWAR_SPR_the_monarchy_of_the_18_july_desc: "National spirit from the focus A Monarchy of the 18 July."
 COLDWAR_SPR_the_continued_plans: "The Continued Plans"
 COLDWAR_SPR_the_continued_plans_desc: "National spirit from the focus Continuity of the Plans."
 COLDWAR_SPR_dynastic_legitimacy: "Dynastic Legitimacy"
 COLDWAR_SPR_dynastic_legitimacy_desc: "National spirit from the focus Don Juan Renounces."
 COLDWAR_SPR_the_social_pact: "The Social Pact"
 COLDWAR_SPR_the_social_pact_desc: "National spirit from the focus The Social Pact."
 COLDWAR_SPR_the_crown_of_the_constitution: "The Crown of the Constitution"
 COLDWAR_SPR_the_crown_of_the_constitution_desc: "National spirit from the focus The Crown of the Constitution."
 COLDWAR_SPR_the_planners_government: "The Planners' Government"
 COLDWAR_SPR_the_planners_government_desc: "National spirit from the focus The Planners' Government."
 COLDWAR_SPR_the_admiral_endures: "The Admiral Endures"
 COLDWAR_SPR_the_admiral_endures_desc: "National spirit from the focus The President Survives."
 COLDWAR_SPR_the_succession_plan: "The Succession Plan"
 COLDWAR_SPR_the_succession_plan_desc: "National spirit from the focus López Rodó's Succession Plan."
 COLDWAR_SPR_development_without_democracy: "Development Without Democracy"
 COLDWAR_SPR_development_without_democracy_desc: "National spirit from the focus Development Without Democracy."
 COLDWAR_SPR_the_miracle_continues: "The Miracle Continues"
 COLDWAR_SPR_the_miracle_continues_desc: "National spirit from the focus The Miracle Continues."
 COLDWAR_SPR_the_developmental_state: "The Developmental State"
 COLDWAR_SPR_the_developmental_state_desc: "National spirit from the focus The Developmental State."
 COLDWAR_SPR_personal_rule_of_the_king: "Personal Rule of the King"
 COLDWAR_SPR_personal_rule_of_the_king_desc: "National spirit from the focus The King Governs."
 COLDWAR_SPR_the_royal_cabinet: "The Royal Cabinet"
 COLDWAR_SPR_the_royal_cabinet_desc: "National spirit from the focus Rule by Royal Decree."
 COLDWAR_SPR_royal_military_directorate: "Royal-Military Directorate"
 COLDWAR_SPR_royal_military_directorate_desc: "National spirit from the focus The King and the Army."
 COLDWAR_SPR_personal_rule_of_the_king_ii: "Personal Rule of the King (Decree)"
 COLDWAR_SPR_personal_rule_of_the_king_ii_desc: "Personal Rule of the King strengthened by the suspension of the Cortes."
 COLDWAR_SPR_the_sovereign_crown: "The Sovereign Crown"
 COLDWAR_SPR_the_sovereign_crown_desc: "National spirit from the focus The Sovereign Crown."
 COLDWAR_SPR_fuel_subsidies: "Fuel Subsidies"
 COLDWAR_SPR_fuel_subsidies_desc: "Held-back fuel prices cushion the oil shock while the world oil price stays high."
 COLDWAR_SPR_deferred_adjustment: "Deferred Adjustment"
 COLDWAR_SPR_deferred_adjustment_desc: "The bill for held-back prices comes due."
 COLDWAR_SPR_remittance_economy: "Remittance Economy"
 COLDWAR_SPR_remittance_economy_desc: "Remittances from abroad fill the treasury while a generation leaves."
 COLDWAR_SPR_returning_emigrants: "Returning Emigrants"
 COLDWAR_SPR_returning_emigrants_desc: "Emigrants return home with skills and savings."
 COLDWAR_SPR_spare_parts_dependence: "Spare-Parts Dependence"
 COLDWAR_SPR_spare_parts_dependence_desc: "Old US chassis keep the army dependent on foreign spare parts."
 COLDWAR_SPR_carrier_navy: "The Carrier Navy"
 COLDWAR_SPR_carrier_navy_desc: "A carrier-centred fleet extends Spain's reach."
 COLDWAR_SPR_tariff_walls: "Tariff Walls"
 COLDWAR_SPR_tariff_walls_desc: "Protective tariffs sour trade relations."
 COLDWAR_SPR_loss_making_state_firms: "Loss-Making State Firms"
 COLDWAR_SPR_loss_making_state_firms_desc: "Rescued state firms drain the budget by 0.3% of GDP per year."
 COLDWAR_SPR_planned_development: "Planned Development"
 COLDWAR_SPR_planned_development_desc: "Five-year plans drive growth at the price of red tape."
 COLDWAR_SPR_free_enterprise_spain: "Free Enterprise Spain"
 COLDWAR_SPR_free_enterprise_spain_desc: "A market-led economy open to the world."
 COLDWAR_SPR_economic_sovereignty: "Economic Sovereignty"
 COLDWAR_SPR_economic_sovereignty_desc: "An autarkic course shields Spain from outside pressure at a cost to growth."
 COLDWAR_SPR_an_independent_church: "An Independent Church"
 COLDWAR_SPR_an_independent_church_desc: "The Church stands apart from the regime while state subsidies stay."
 COLDWAR_SPR_gal_scandal: "The GAL Scandal"
 COLDWAR_SPR_gal_scandal_desc: "The revelation of state-sponsored killings on French soil damages the government."
 COLDWAR_SPR_court_of_el_pardo: "The Court of El Pardo"
 COLDWAR_SPR_court_of_el_pardo_desc: "The court of El Pardo slows the government's political work."
 COLDWAR_SPR_constitutional_monarchy: "A Constitutional Monarchy"
 COLDWAR_SPR_constitutional_monarchy_desc: "The regime question is settled in a constitutional monarchy."
 COLDWAR_SPR_democratic_coordination: "Democratic Coordination"
 COLDWAR_SPR_democratic_coordination_desc: "A coordinated democratic opposition strengthens the government's reach at a police cost."
 COLDWAR_SPR_holy_saturday: "Holy Saturday"
 COLDWAR_SPR_holy_saturday_desc: "The Party's legal comeback brings revenue and a watchful police."
 COLDWAR_SPR_closed_ranks: "Closed Ranks"
 COLDWAR_SPR_closed_ranks_desc: "The bunker closes ranks at the price of foreign capital."
 COLDWAR_SPR_centre_of_gravity: "The Centre of Gravity"
 COLDWAR_SPR_centre_of_gravity_desc: "A balanced middle path lifts stability and research at a bureaucratic price."
 COLDWAR_SPR_statute_of_associations: "The Statute of Associations"
 COLDWAR_SPR_statute_of_associations_desc: "Respectable associations steady the Movement at a bureaucratic cost."
 COLDWAR_SPR_spirit_of_the_bunker: "The Spirit of the Bunker"
 COLDWAR_SPR_spirit_of_the_bunker_desc: "The bunker hardens the regime against the opposition and foreign capital."
 COLDWAR_SPR_organic_democracy: "Organic Democracy"
 COLDWAR_SPR_organic_democracy_desc: "Organic democracy through family, municipality and syndicate."
 COLDWAR_SPR_sentinel_of_the_west: "Sentinel of the West"
