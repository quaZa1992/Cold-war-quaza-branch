 COLDWAR_SPR_unrest_category: "Social Unrest"
 COLDWAR_SPR_unrest_category_desc: "Strikes, students and the street. Each measure buys time and has a price."
 COLDWAR_SPR_succession_category: "The Succession"
 COLDWAR_SPR_succession_category_desc: "The balance between continuity and opening decides who governs after Franco."
