l_english:
 mdcw_infantry_weapons_1940:0 "Small Arms 1940"
 mdcw_infantry_weapons_1940_short:0 "Small Arms 1940"
 mdcw_infantry_weapons_1940_desc:0 "Bolt-action and early self-loading rifles, supplemented by submachine guns. A cheap, dependable baseline for infantry formations."
 mdcw_infantry_weapons_1950:0 "Small Arms 1950"
 mdcw_infantry_weapons_1950_short:0 "Small Arms 1950"
 mdcw_infantry_weapons_1950_desc:0 "Postwar small arms standardize self-loading rifles and simplify ammunition supply and maintenance."
 mdcw_infantry_weapons_1955:0 "Small Arms 1955"
 mdcw_infantry_weapons_1955_short:0 "Small Arms 1955"
 mdcw_infantry_weapons_1955_desc:0 "Early assault and automatic battle rifles increase squad firepower before the standardized 1965 generation."
 mdcw_infantry_weapons_1980:0 "Small Arms 1980"
 mdcw_infantry_weapons_1980_short:0 "Small Arms 1980"
 mdcw_infantry_weapons_1980_desc:0 "Refined late-1970s rifle designs, improved manufacture and better handling raise performance modestly. Producing this generation costs more than the 1975 model; existing stockpiles retain their original capabilities."
 mdcw_util_vehicle_1940:0 "Utility Vehicles 1940"
 mdcw_util_vehicle_1940_short:0 "Utility Vehicles 1940"
 mdcw_util_vehicle_1940_desc:0 "Wartime trucks and light utility vehicles motorize infantry and its supply columns."
 mdcw_util_vehicle_1950:0 "Utility Vehicles 1950"
 mdcw_util_vehicle_1950_short:0 "Utility Vehicles 1950"
 mdcw_util_vehicle_1950_desc:0 "Postwar engines and standardized spare parts improve the reliability of motorized formations."
 mdcw_util_vehicle_1960:0 "Utility Vehicles 1960"
 mdcw_util_vehicle_1960_short:0 "Utility Vehicles 1960"
 mdcw_util_vehicle_1960_desc:0 "Improved cross-country mobility and payload provide the last vehicle generation before the existing MD 1965 standard."
 mdcw_cnc_equipment_1940:0 "Field Radios 1940"
 mdcw_cnc_equipment_1940_short:0 "Field Radios 1940"
 mdcw_cnc_equipment_1940_desc:0 "Field telephones and vacuum-tube radios provide basic tactical communications. This equipment uses the existing MD command equipment supply chain."
 mdcw_cnc_equipment_1950:0 "Field Radios 1950"
 mdcw_cnc_equipment_1950_short:0 "Field Radios 1950"
 mdcw_cnc_equipment_1950_desc:0 "Smaller, more reliable radios improve communication between headquarters and forward units."
 mdcw_cnc_equipment_1960:0 "Field Radios 1960"
 mdcw_cnc_equipment_1960_short:0 "Field Radios 1960"
 mdcw_cnc_equipment_1960_desc:0 "Transistorized radios improve tactical command without requiring the later digital command systems of 1975."
 mdcw_support_weapons_1940:0 "Support Weapons 1940"
 mdcw_support_weapons_1940_short:0 "Support Weapons 1940"
 mdcw_support_weapons_1940_desc:0 "Light machine guns, rifle grenades and small mortars support infantry squads within the existing MD organization."
 mdcw_support_weapons_1955:0 "Support Weapons 1955"
 mdcw_support_weapons_1955_short:0 "Support Weapons 1955"
 mdcw_support_weapons_1955_desc:0 "General-purpose machine guns and improved squad support weapons make sustained fire more effective."
 mdcw_night_vision_1950:0 "Active Infrared Sights"
 mdcw_night_vision_1950_short:0 "Active Infrared Sights"
 mdcw_night_vision_1950_desc:0 "Early active infrared illuminators and sights give selected units a limited night-fighting capability. They precede the existing MD night vision chain."
 mdcw_special_forces_1940:0 "Special Equipment 1940"
 mdcw_special_forces_1940_short:0 "Special Equipment 1940"
 mdcw_special_forces_1940_desc:0 "Specialist small arms and field equipment equip airborne and special infantry formations."
 mdcw_special_forces_1950:0 "Special Equipment 1950"
 mdcw_special_forces_1950_short:0 "Special Equipment 1950"
 mdcw_special_forces_1950_desc:0 "Improved lightweight equipment supports specialist infantry missions."
 mdcw_camouflage_1940:0 "Field Clothing 1940"
 mdcw_camouflage_1940_short:0 "Field Clothing 1940"
 mdcw_camouflage_1940_desc:0 "Practical field clothing and basic concealment improve infantry survivability. Research changes combat values; national 3D uniforms are assigned separately."
 mdcw_camouflage_1950:0 "Field Clothing 1950"
 mdcw_camouflage_1950_short:0 "Field Clothing 1950"
 mdcw_camouflage_1950_desc:0 "Improved camouflage clothing and carrying equipment precede the 1970 camouflage generation. This technology does not switch the national 3D uniform."
 mdcw_body_armor_1945:0 "Personal Protection 1945"
 mdcw_body_armor_1945_short:0 "Personal Protection 1945"
 mdcw_body_armor_1945_desc:0 "Steel helmets and basic personal protection reduce losses from fragments and help preserve experienced personnel."
 mdcw_body_armor_1960:0 "Fragmentation Vests 1960"
 mdcw_body_armor_1960_short:0 "Fragmentation Vests 1960"
 mdcw_body_armor_1960_desc:0 "Fragmentation vests provide limited additional protection before the later Kevlar body armor generation."
