l_english:
 # IMPERIA COLD WAR — French and Italian monetary institutions.
 french_franc: "French Franc"
 french_franc_desc: "The Banque de France safeguards the Republic's note issue and administers its external reserves. Confidence in the franc sustains monetary independence, while foreign trade and international credit require access to convertible funds. The currencies of the franc area remain distinct monies linked through negotiated monetary arrangements."
 italian_lira: "Italian Lira"
 italian_lira_desc: "The Banca d'Italia directs domestic money and credit in the service of monetary stability and national development. Ministers must reconcile investment and employment with confidence in the lira, the balance of payments and the cost of imported goods. Monetary autonomy leaves the Treasury responsible for securing the convertible funds required abroad."
