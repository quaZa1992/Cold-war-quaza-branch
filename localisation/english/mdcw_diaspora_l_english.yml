l_english:
# IMPERIA CW — Cold War: Guest Worker Administration
 mdcw_diaspora.11.t:0 "Language and Administrative Support"
 mdcw_diaspora.11.d:0 "Help [?gw_project_preview_k|1] thousand residents from [?gw_dialog_origin.GetName] learn the language and navigate our public services.\n\n[mdcw_gw_project_readiness]"
 mdcw_diaspora.12.t:0 "Housing and Municipal Services"
 mdcw_diaspora.12.d:0 "Expand housing and local services for [?gw_project_preview_k|1] thousand residents from [?gw_dialog_origin.GetName].\n\n[mdcw_gw_project_readiness]"
 mdcw_diaspora.13.t:0 "Labour Integration and Worker Protection"
 mdcw_diaspora.13.d:0 "Strengthen workplace protections and help [?gw_project_preview_k|1] thousand residents from [?gw_dialog_origin.GetName] find secure employment.\n\n[mdcw_gw_project_readiness]"
 gw_fund_project:0 "Fund the programme."
 gw_cancel:0 "Cancel."
 gw_acknowledge:0 "Acknowledged."
 gw_project_complete_t:0 "Integration Programme Completed"
 gw_project_complete_d:0 "Our integration programme for [?gw_completed_coverage_k|1] thousand residents from [?gw_completed_origin.GetName] is complete. Its weekly funding and Consumer Goods requirements have ended. The improvements will continue to benefit those who took part; later arrivals will need further support."
 gw_return_confirm_t:0 "Forced Repatriation"
 gw_return_confirm_d:0 "Prepare to send [?gw_return_preview_k|1] thousand residents back to [?gw_selected_origin.GetName]. The operation will take 90 days."
 gw_confirm_return:0 "Begin the return operation."
 gw_return_terms_tt:0 "Preparation time: §Y90 days§!\nResidents returning home: §Y[?gw_return_preview_k|1] thousand§!\nStability on completion: §R-1.00%§!\nRelations with their home country: §R-40§! for §Y24 months§!\n\nResidents remain here, with their current costs, until departure. No new recruitment payment or remittance bonus is awarded. If the return cannot proceed, its cash and Political Power costs are fully refunded."
 gw_return_complete_t:0 "Repatriation Completed"
 gw_return_complete_d:0 "[mdcw_gw_return_route]"
 gw_return_one_state:0 "[gw_return_state_1.GetName] to [gw_return_home_state.GetName]: [?gw_return_receipt_k|1] thousand residents."
 gw_return_two_states:0 "[gw_return_state_1.GetName] to [gw_return_home_state.GetName]: [?gw_return_receipt_half_k|1] thousand residents.\n[gw_return_state_2.GetName] to [gw_return_home_state.GetName]: [?gw_return_receipt_second_k|1] thousand residents."
 gw_return_arrival_t:0 "Returning Residents Have Arrived"
 gw_return_arrival_d:0 "[?FROM.gw_return_receipt_k|1] thousand residents have returned from [FROM.GetName] to [gw_return_home_state.GetName]. With fewer workers sending money home from abroad, our remittance income has fallen proportionally."
 gw_return_failed_t:0 "Repatriation Could Not Proceed"
 gw_return_failed_d:0 "The return operation could not be completed under the present conditions. Residents have remained where they are. The preparation payment and Political Power have been fully refunded."
 gw_abuse_t:0 "Guest Workers Report Employer Abuse"
 gw_abuse_d:0 "Employment inspectors have received reports of withheld wages, retained identity documents and unsafe accommodation. The allegations concern employers operating under our recruitment programme."
 gw_abuse_investigate:0 "Investigate and protect the workers."
 gw_abuse_ignore:0 "Leave the matter to employers."
 gw_complaint_t:0 "Our Workers Abroad Request Assistance"
 gw_complaint_d:0 "Reports from [FROM.GetName] describe unpaid wages and restrictions imposed by employers. We can suspend further recruitment agreements with that country."
 gw_complaint_suspend:0 "Suspend further agreements."
 gw_complaint_protest:0 "Protest, but keep agreements open."
 gw_resume_button:0 "Resume Recruitment"
 gw_suspend_button:0 "Suspend Recruitment"
 gw_status_project:0 "Integration underway"
 gw_status_return:0 "Repatriation underway"
 gw_status_suspended:0 "Recruitment suspended"
 gw_status_ready:0 "No operation underway"
 gw_return_status:0 "Repatriation preparations underway: 90 days."
 gw_registry_status:0 "Language support: $[?gw_project_weekly|3]bn/week for 365 days."
 gw_housing_status:0 "Housing investment: $[?gw_project_weekly|3]bn/week for 365 days."
 gw_protection_status:0 "Labour protection: $[?gw_project_weekly|3]bn/week for 365 days."
 gw_no_project_status:0 "Select a community to arrange integration or repatriation."
 gw_register_tt:0 "Help residents learn the language and access public services.\n\nDuration: §Y365 days§!\nPolitical Power: §R75§!\nPer 100,000 participants: §R$$30 million/week§! and §R+1% Consumer Goods§! (maximum §R15%§!).\n\nOn completion: §G-30%§! to the additional Bureaucracy costs of participants. New arrivals require a separate programme."
 gw_housing_tt:0 "Invest in housing and local public services.\n\nDuration: §Y365 days§!\nPolitical Power: §R100§!\nPer 100,000 participants: §R$$50 million/week§! and §R+2% Consumer Goods§! (maximum §R25%§!).\n\nOn completion: §G-20%§! to the additional Healthcare and Welfare costs of participants. New arrivals require a separate programme."
 gw_protect_tt:0 "Expand employment support and protection against abusive employers.\n\nDuration: §Y365 days§!\nPolitical Power: §R100§!\nPer 100,000 participants: §R$$40 million/week§! and §R+1% Consumer Goods§! (maximum §R15%§!).\n\nOn completion: §G-20%§! to the additional Welfare costs of participants and a lower risk of abuse. New arrivals require a separate programme."
 gw_return_tt:0 "Arrange the forced return of residents to their home country.\n\nPreparation time: §Y90 days§!\nCost per 100,000 residents: §R$$5 billion§! and §R100 Political Power§!\n\nResidents remain here, with their current costs, until departure. The final group may contain fewer than 25,000 residents."
 gw_suspend_tt:0 "Pause or resume new recruitment. Existing residents and their costs remain."
 gw_close_tt:0 "Close the recruitment programme and end its fixed administration costs.\n\nPolitical Power: §R150§!\nRequires all guest workers to have returned home, with no negotiations, integration programme or repatriation still underway."
 mdcw_gw_immigration_backlash:0 "Immigration Backlash"
 mdcw_gw_immigration_backlash_desc:0 "Nationalist agitators blame foreign workers for competition over jobs, housing and public services. Each new agreement renews their campaign for 180 days; the Daily Nationalist Support bonus does not stack."
 gw_locked_residents_tt:0 "All guest workers have returned home, and no negotiations, integration programme or repatriation remain underway."
 mdcw_gw_diaspora_outreach:0 "Diaspora Outreach in [FROM.GetName]"
 mdcw_gw_diaspora_outreach_desc:0 "Strengthen consular services and cultural ties with our community in §Y[FROM.GetName]§!.\n\nDuration: §Y180 days§!\nPolitical Power: §R75§!\nTreasury: §R$$500 million§!\nInfluence action effectiveness: up to §G+10%§!, reduced by the community's participation in labour integration.\nRequires at least §Y25,000 residents§! making up §Y0.25%§! of the host population."
 mdcw_gw_resume_agreements:0 "Resume Guest-Worker Agreements with [FROM.GetName]"
 mdcw_gw_resume_agreements_desc:0 "Lift our suspension of further recruitment agreements with this country."
 mdcw_gw_register_legacy_origin:0 "Update Residency Records: [FROM.GetName]"
 mdcw_gw_register_legacy_origin_desc:0 "Assign a country of origin to up to 100,000 residents whose older agreements lack this information. This corrects records from an older save; it does not move residents or award money, Political Power or remittances."
 gw_project_1_terms_tt:0 "Participants: §Y[?gw_project_preview_k|1] thousand§!\nDuration: §Y365 days§!\nWeekly spending: §R$$[?gw_project_preview_weekly|3] billion§!\nConsumer Goods: §R+[?gw_project_preview_consumer|%2]§!\n\n§YOn Completion§!\nAdditional Bureaucracy costs for participants: §G-30%§!.\nLater arrivals require a separate programme."
 gw_project_2_terms_tt:0 "Participants: §Y[?gw_project_preview_k|1] thousand§!\nDuration: §Y365 days§!\nWeekly spending: §R$$[?gw_project_preview_weekly|3] billion§!\nConsumer Goods: §R+[?gw_project_preview_consumer|%2]§!\n\n§YOn Completion§!\nAdditional Healthcare and Welfare costs for participants: §G-20%§!.\nLater arrivals require a separate programme."
 gw_project_3_terms_tt:0 "Participants: §Y[?gw_project_preview_k|1] thousand§!\nDuration: §Y365 days§!\nWeekly spending: §R$$[?gw_project_preview_weekly|3] billion§!\nConsumer Goods: §R+[?gw_project_preview_consumer|%2]§!\n\n§YOn Completion§!\nAdditional Welfare costs for participants: §G-20%§!; lower risk of employer abuse.\nLater arrivals require a separate programme."
 gw_pair_not_suspended_tt:0 "§Y[FROM.GetName]§! permits further labour agreements with us."
 gw_pair_not_suspended_tt_NOT:0 "§Y[FROM.GetName]§! has suspended further labour agreements with us."
 gw_overseas_report_t:0 "Our Community in [?gw_inspected_host.GetName]"
 gw_overseas_report_d:0 "Our community: §Y[?gw_inspected_stock|1] thousand residents§!\n\nResidents who have received integration support:\nLanguage and administration: §Y[?gw_inspected_registered|1] thousand§!\nHousing and local services: §Y[?gw_inspected_housed|1] thousand§!\nLabour protection: §Y[?gw_inspected_protected|1] thousand§!\n\nConsular outreach can strengthen our diplomatic influence actions in this country. It does not increase influence on its own."
 mdcw_gw_inspect_overseas_community:0 "Our Community in [FROM.GetName]"
 mdcw_gw_inspect_overseas_community_desc:0 "Review the size of our community abroad and the integration support provided by its host government."
 gw_project_expense_tt:0 "$[?gw_project_weekly|3] billion from Guest Worker Integration\n"
 mdcw_gw_forced_return:0 "Forced Repatriation"
 mdcw_gw_worker_abuse:0 "Mistreatment of Our Workers"
 gw_costs_tt:0 "Additional weekly spending on guest-worker communities: Healthcare, Bureaucracy, Welfare and active integration programmes. The total includes the recruitment programme's fixed 5% bureaucracy overhead. Ordinary spending on the larger population remains part of the national budget. Integration reduces the additional costs for participants."
 gw_campaign_t:0 "An Anti-Immigration Campaign Gains Ground"
 gw_campaign_d:0 "Nationalist campaigners blame foreign workers for pressure on jobs, housing and public services. Local officials warn of rising hostility towards our guest-worker communities."
 gw_campaign_mediate:0 "Fund local mediation and challenge the campaign."
 gw_campaign_ignore:0 "Let the agitation continue."
 gw_project_blocked_expired:0 "This funding proposal has lapsed. Reopen the programme under Guest Worker Agreements to request a new proposal. Nothing has been spent."
 gw_project_blocked_programme:0 "Establish the Guest Worker Recruitment Programme first."
 gw_project_blocked_active:0 "Our current integration programme must finish before another can begin."
 gw_project_blocked_return:0 "Complete the ongoing repatriation before starting an integration programme."
 gw_project_blocked_agreement:0 "Conclude the ongoing labour negotiations before starting an integration programme."
 gw_project_blocked_covered:0 "Everyone in this community has already received this support. Select a different community or programme."
 gw_project_blocked_pp:0 "Political Power required: §Y[?gw_project_pp_cost|0]§!; available: §Y[?political_power|0]§!."
 gw_project_ready:0 "The programme is ready for authorisation. Its costs and benefits are shown under the funding option."

# IMPERIA CW — Cold War: Ministry consular confirmation
 gw_ministry_outreach_t:0 "Consular Support for Our Community Abroad"
 gw_ministry_outreach_d:0 "Strengthen consular services and cultural ties with our community in [?gw_dialog_host.GetName]."
 gw_ministry_outreach_accept:0 "Fund the consular programme."
 gw_ministry_outreach_terms:0 "Treasury: §R-$$500 million§!\nDuration: §Y180 days§!\nEffectiveness of influence actions: up to §G+10%§!, reduced by labour integration.\nInfluence must still be gained through diplomatic actions."

# IMPERIA CW — Cold War: concrete Ministry return invoice
 gw_ministry_return_payment_tt:0 "Treasury: §R-$$[?gw_return_preview_cash|2] billion§!"
