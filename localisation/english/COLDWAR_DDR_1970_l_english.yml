# IMPERIA CW — Cold War: DDR 1970 — English localisation.
 # COLDWAR | German Democratic Republic 1970 (focus tree, ideas, events, decisions, offers). Generated - edit the generator (Claude outputs/COLDWAR_DDR_generator).
 COLDWAR_DDR_1970_focus: "East German Focus Tree"
 COLDWAR_DDR_politics_outlooks_tree_shortcut: "Politics & Outlooks Tree"
 COLDWAR_DDR_the_party_sed_tree_shortcut: "The Party (SED) Tree"
 COLDWAR_DDR_first_secretaries_tree_shortcut: "First Secretaries Tree"
 COLDWAR_DDR_economy_tree_shortcut: "Economy Tree"
 COLDWAR_DDR_military_tree_shortcut: "Military Tree"
 COLDWAR_DDR_state_security_society_tree_shortcut: "State Security & Society Tree"
 COLDWAR_DDR_foreign_policy_tree_shortcut: "Foreign Policy Tree"
 FOCUS_FILTER_COLDWAR_DDR_POLITICS: "GDR: Parties and Outlooks"
 FOCUS_FILTER_COLDWAR_DDR_SED: "GDR: SED and First Secretaries"
 FOCUS_FILTER_COLDWAR_DDR_ECONOMY: "GDR: Planned Economy"
 FOCUS_FILTER_COLDWAR_DDR_MILITARY: "GDR: National People's Army"
 FOCUS_FILTER_COLDWAR_DDR_SECURITY: "GDR: State Security and Society"
 FOCUS_FILTER_COLDWAR_DDR_FOREIGN: "GDR: Foreign Policy"
 COLDWAR_DDR_the_republic_at_twenty: "The Republic at Twenty"
 COLDWAR_DDR_the_republic_at_twenty_desc: "January 1970. The republic is twenty, its leader seventy-six. The Wall stands, the winter has emptied the shelves, and in Bonn Willy Brandt speaks of 'two states in Germany'."
 COLDWAR_DDR_em_the_leading_role: "The Leading Role of the Party"
 COLDWAR_DDR_em_the_leading_role_desc: "Article 1 of the constitution: the leadership of the working class and its Marxist-Leninist party. The republic stays what it is."
 COLDWAR_DDR_em_the_national_front: "The National Front"
 COLDWAR_DDR_em_the_national_front_desc: "Five parties, four mass organisations, one list: the bloc parties remain allies, not rivals."
 COLDWAR_DDR_em_the_socialist_human_community: "The Socialist Human Community"
 COLDWAR_DDR_em_the_socialist_human_community_desc: "Ulbricht's formula: class antagonisms are overcome, the people are one community under the party."
 COLDWAR_DDR_em_the_workers_and_farmers_state: "The Workers' and Farmers' State"
 COLDWAR_DDR_em_the_workers_and_farmers_state_desc: "A state that belongs to those who work: the hub from which power can pass to another Emerging current."
 COLDWAR_DDR_power_sed: "Restore the Leading Role"
 COLDWAR_DDR_power_sed_desc: "After the interregnum the party reclaims what the constitution gave it."
 COLDWAR_DDR_power_ldk: "Socialism with a Human Face"
 COLDWAR_DDR_power_ldk_desc: "Prague 1968 was crushed - Berlin could finish what Prague began. Moscow will not like it."
 COLDWAR_DDR_power_tg: "The Old Guard Returns"
 COLDWAR_DDR_power_tg_desc: "The veterans of Spain and the camps take back the party from the managers and the consumers."
 COLDWAR_DDR_power_ssp: "The Shield Becomes the State"
 COLDWAR_DDR_power_ssp_desc: "When the party falters, the Ministry that knows everything takes over."
 COLDWAR_DDR_em_a_socialist_state_of_the_german_nation: "A Socialist State of the German Nation"
 COLDWAR_DDR_em_a_socialist_state_of_the_german_nation_desc: "The 1968 constitution: the GDR is the socialist state of the German nation. While an Emerging party governs, its programme stands."
 COLDWAR_DDR_em_workers_and_farmers_inspection: "Workers' and Farmers' Inspection"
 COLDWAR_DDR_em_workers_and_farmers_inspection_desc: "The ABI controls the managers: hundreds of thousands of volunteer inspectors against waste and privilege."
 COLDWAR_DDR_em_socialist_competition: "Brigades of Socialist Labour"
 COLDWAR_DDR_em_socialist_competition_desc: "Brigades of socialist labour compete for banners and bonuses."
 COLDWAR_DDR_em_peace_and_socialism: "Peace and Socialism"
 COLDWAR_DDR_em_peace_and_socialism_desc: "The republic as the western outpost of the socialist world - and its showcase."
 COLDWAR_DDR_we_change_through_rapprochement: "Change Through Rapprochement"
 COLDWAR_DDR_we_change_through_rapprochement_desc: "Egon Bahr's formula of 1963, answered from the East: if Bonn moves towards us, we can move towards Bonn."
 COLDWAR_DDR_we_the_bloc_parties_speak: "The Bloc Parties Speak"
 COLDWAR_DDR_we_the_bloc_parties_speak_desc: "CDU and LDPD rediscover that they were founded in 1945 as independent parties."
 COLDWAR_DDR_we_tolerate_west_television: "Tolerate West Television"
 COLDWAR_DDR_we_tolerate_west_television_desc: "No more raids on roof antennas: the evening news from Hamburg is no longer a crime."
 COLDWAR_DDR_we_the_round_tables: "The Round Tables"
 COLDWAR_DDR_we_the_round_tables_desc: "Parties, church and the new circles sit at one table with the government - the hub of a democratic opening."
 COLDWAR_DDR_power_koko: "The Firm Takes Over"
 COLDWAR_DDR_power_koko_desc: "The man who sells the republic's goods to the West now sells its loyalty."
 COLDWAR_DDR_power_cdu: "The Union Leaves the Bloc"
 COLDWAR_DDR_power_cdu_desc: "Götting's Union leaves the National Front and claims the Christian heritage of Germany."
 COLDWAR_DDR_power_ldpd: "The Liberal Turn"
 COLDWAR_DDR_power_ldpd_desc: "Gerlach breaks the bloc discipline twenty years early."
 COLDWAR_DDR_power_spd: "Social Democracy Reborn"
 COLDWAR_DDR_power_spd_desc: "Thirty years after the forced merger, the SPD stands up again in the land of its birth."
 COLDWAR_DDR_we_a_democratic_republic: "A Democratic Republic"
 COLDWAR_DDR_we_a_democratic_republic_desc: "The name of the state finally means what it says."
 COLDWAR_DDR_we_free_elections: "Free Elections"
 COLDWAR_DDR_we_free_elections_desc: "Secret ballot, open lists, no single list of the National Front."
 COLDWAR_DDR_we_the_social_market_economy: "The Social Market Economy"
 COLDWAR_DDR_we_the_social_market_economy_desc: "Erhard's recipe for the East: prices, private firms, the Mark - and a social net."
 COLDWAR_DDR_we_reform_step_by_step: "Reform Step by Step"
 COLDWAR_DDR_we_reform_step_by_step_desc: "Alt-history: the Kombinat directors and the planners argue for the slow road - prices freed one sector at a time, the plan kept as a frame, Hungary's New Economic Mechanism rather than Erhard's currency reform."
 COLDWAR_DDR_we_tear_down_the_wall: "Tear Down the Wall"
 COLDWAR_DDR_we_tear_down_the_wall_desc: "The border opens. The Antifascist Protection Rampart becomes a monument."
 COLDWAR_DDR_we_the_moscow_negotiations: "The Moscow Negotiations"
 COLDWAR_DDR_we_the_moscow_negotiations_desc: "The republic is a member of the Warsaw Pact and bound to Moscow by treaty. Before it can go West, someone has to fly to Moscow and ask."
 COLDWAR_DDR_we_join_the_free_world: "Join the Free World"
 COLDWAR_DDR_we_join_the_free_world_desc: "Out of the Warsaw Pact, into the Western camp - if the West will have us."
 COLDWAR_DDR_na_a_third_way_for_germany: "A Third Way for Germany"
 COLDWAR_DDR_na_a_third_way_for_germany_desc: "Neither Moscow's satellite nor Bonn's province: the idea of 1952 and 1956 returns."
 COLDWAR_DDR_na_the_belgrade_model: "The Belgrade Model"
 COLDWAR_DDR_na_the_belgrade_model_desc: "Tito showed that a socialist state can stand between the blocs - and that workers' councils can run the factories."
 COLDWAR_DDR_na_church_from_below: "Church from Below"
 COLDWAR_DDR_na_church_from_below_desc: "Peace circles and environmental groups meet under church roofs."
 COLDWAR_DDR_na_the_honest_balance_sheet: "The Honest Balance Sheet"
 COLDWAR_DDR_na_the_honest_balance_sheet_desc: "Planners, directors and craftsmen agree on one thing: the numbers must be true."
 COLDWAR_DDR_na_the_third_force: "The Third Force"
 COLDWAR_DDR_na_the_third_force_desc: "A movement between the blocs - the hub of the Non-Aligned hand-overs."
 COLDWAR_DDR_power_spk: "Government of the Planners"
 COLDWAR_DDR_power_spk_desc:0 "The State Planning Commission coordinates resources, investment and the targets imposed on every major enterprise. A government led by its planners would move economic authority away from competing party patrons and towards technical administration. Clearer priorities could ease shortages, but the planners would also have to answer publicly for choices once hidden behind the plan."
 COLDWAR_DDR_power_kis: "The Church Mediates"
 COLDWAR_DDR_power_kis_desc: "The church, the only free space in the republic, becomes the mediator of the state."
 COLDWAR_DDR_power_kd: "The Red Barons"
 COLDWAR_DDR_power_kd_desc: "The general directors stop asking the ministries for permission."
 COLDWAR_DDR_power_uct: "The Craftsmen's Cabinet"
 COLDWAR_DDR_power_uct_desc: "The private craftsmen and family firms return from the nationalisation of 1972."
 COLDWAR_DDR_power_gl: "The Green Cabinet"
 COLDWAR_DDR_power_gl_desc:0 "Industrial pollution has turned an administrative failure into a crisis of confidence. A cabinet committed to environmental reform would challenge ministries accustomed to meeting production targets regardless of their consequences. Its task is to protect public health while keeping factories, employment and the energy system functioning."
 COLDWAR_DDR_power_dbd: "The Farmers' Republic"
 COLDWAR_DDR_power_dbd_desc: "Goldenbaum's farmers' party leaves the bloc and speaks for the villages."
 COLDWAR_DDR_power_tws: "The Third Way Government"
 COLDWAR_DDR_power_tws_desc: "Harich's platform of 1956: a neutral, democratic, socialist Germany."
 COLDWAR_DDR_na_neither_moscow_nor_bonn: "Neither Moscow nor Bonn"
 COLDWAR_DDR_na_neither_moscow_nor_bonn_desc: "The republic between the blocs: its own way, its own rules."
 COLDWAR_DDR_na_armed_neutrality: "Armed Neutrality"
 COLDWAR_DDR_na_armed_neutrality_desc: "Neutral like Austria, armed like Switzerland."
 COLDWAR_DDR_na_leave_the_warsaw_pact: "Ask Moscow to Let Us Go"
 COLDWAR_DDR_na_leave_the_warsaw_pact_desc: "Hungary tried to leave in 1956 and Soviet tanks answered. The republic asks politely - and offers neutrality instead of the West."
 COLDWAR_DDR_na_join_the_movement: "Join the Non-Aligned Movement"
 COLDWAR_DDR_na_join_the_movement_desc: "Belgrade, Cairo, New Delhi - and East Berlin."
 COLDWAR_DDR_nt_the_nation_above_the_class: "The Nation Above the Class"
 COLDWAR_DDR_nt_the_nation_above_the_class_desc: "Prussia, Luther, Frederick - the republic has already rehabilitated half of German history. Why not all of it?"
 COLDWAR_DDR_nt_the_heritage_of_prussia: "The Heritage of Prussia"
 COLDWAR_DDR_nt_the_heritage_of_prussia_desc: "The statue of Frederick the Great returns to Unter den Linden."
 COLDWAR_DDR_nt_the_wars_of_liberation: "The Wars of Liberation"
 COLDWAR_DDR_nt_the_wars_of_liberation_desc: "1813, Scharnhorst and Gneisenau: the national tradition the NVA already wears on its uniforms."
 COLDWAR_DDR_nt_one_people: "One People"
 COLDWAR_DDR_nt_one_people_desc: "The nation is older than the class - the hub of the Nationalist hand-overs."
 COLDWAR_DDR_power_ndpd: "The National Democrats"
 COLDWAR_DDR_power_ndpd_desc: "Bolz's National Democrats leave the bloc and preach the nation."
 COLDWAR_DDR_power_nrf: "The National Revolution"
 COLDWAR_DDR_power_nrf_desc: "A national-revolutionary underground seizes a collapsing state."
 COLDWAR_DDR_power_mcn: "The Generals Step In"
 COLDWAR_DDR_power_mcn_desc: "The generals of the NVA decide that the party has failed."
 COLDWAR_DDR_power_pcc: "The Crown of Prussia"
 COLDWAR_DDR_power_pcc_desc: "The House of Hohenzollern is invited back to Potsdam."
 COLDWAR_DDR_nt_a_german_republic: "A German Republic"
 COLDWAR_DDR_nt_a_german_republic_desc: "Not a socialist state of the German nation - the German state."
 COLDWAR_DDR_nt_prussian_discipline: "Prussian Discipline"
 COLDWAR_DDR_nt_prussian_discipline_desc: "Order, duty, punctuality - and fewer meetings."
 COLDWAR_DDR_nt_our_own_road: "Our Own Road"
 COLDWAR_DDR_nt_our_own_road_desc:0 "Dependence on Soviet supplies and Western credit leaves the republic vulnerable to decisions made elsewhere. An independent course would put domestic production, alternative trading partners and a narrower range of essential imports at the centre of economic policy. Greater freedom of action must be earned through difficult choices about what the country can produce and afford."
 COLDWAR_DDR_nt_the_rapallo_line: "The Rapallo Line"
 COLDWAR_DDR_nt_the_rapallo_line_desc: "Alt-history: in 1922 at Rapallo the defeated Reich and Soviet Russia broke their isolation together. A national Germany need not be anti-Soviet - Moscow's oil and orders for a German state that keeps its own flag and its own army."
 COLDWAR_DDR_nt_the_german_question_is_open: "The German Question Is Open"
 COLDWAR_DDR_nt_the_german_question_is_open_desc: "Two states, one nation - and the nation will decide."
 COLDWAR_DDR_sed_the_party_of_the_working_class: "The Party of the Working Class"
 COLDWAR_DDR_sed_the_party_of_the_working_class_desc: "2.2 million members, one in eight adults: the SED is the state's skeleton."
 COLDWAR_DDR_sed_the_party_apparatus: "The Party Apparatus"
 COLDWAR_DDR_sed_the_party_apparatus_desc: "The district and county secretaries are the real government of the provinces."
 COLDWAR_DDR_sed_the_fdj_reserve: "Reserve of the Party"
 COLDWAR_DDR_sed_the_fdj_reserve_desc: "The FDJ trains the next generation of cadres - blue shirts, red ideas."
 COLDWAR_DDR_sed_the_bloc_party_question: "The Bloc Party Question"
 COLDWAR_DDR_sed_the_bloc_party_question_desc: "CDU, LDPD, NDPD and DBD: keep them as transmission belts or give them room to breathe?"
 COLDWAR_DDR_sed_transmission_belts: "Transmission Belts"
 COLDWAR_DDR_sed_transmission_belts_desc: "The bloc parties organise the middle class for the SED - nothing more."
 COLDWAR_DDR_sed_partners_in_the_front: "Partners in the Front"
 COLDWAR_DDR_sed_partners_in_the_front_desc: "Give the bloc parties real ministries and a voice in the Volkskammer."
 COLDWAR_DDR_sed_party_schools: "The Karl Marx Party College"
 COLDWAR_DDR_sed_party_schools_desc: "Every cadre passes through the college in Berlin-Kleinmachnow."
 COLDWAR_DDR_sed_the_party_card_exchange: "The Party Card Exchange"
 COLDWAR_DDR_sed_the_party_card_exchange_desc: "Every member hands in his card and is interviewed - a quiet purge of the passive and the doubters."
 COLDWAR_DDR_sed_the_party_congress: "The Party Congress"
 COLDWAR_DDR_sed_the_party_congress_desc: "Every five years the party confirms its line, its leader and its plan in the Palace of the Republic."
 COLDWAR_DDR_cc_the_central_committee: "The Central Committee"
 COLDWAR_DDR_cc_the_central_committee_desc: "Two hundred members, one vote that counts: Moscow's. The Central Committee elects the First Secretary."
 COLDWAR_DDR_cc_hon: "Honecker's Candidacy"
 COLDWAR_DDR_cc_hon_desc: "The crown prince since 1958, Ulbricht's own pupil - and Brezhnev's choice."
 COLDWAR_DDR_cc_sto: "The Premier's Candidacy"
 COLDWAR_DDR_cc_sto_desc:0 "The chairman of the Council of Ministers commands an administration responsible for putting party decisions into practice. By seeking the party leadership as well, the premier would bring those offices under one political direction. Supporters promise coherent government; opponents fear that cabinet appointments and economic resources will become instruments of a personal succession campaign."
 COLDWAR_DDR_cc_mit: "The Economist's Candidacy"
 COLDWAR_DDR_cc_mit_desc: "The secretary for the economy: the plan should rule the party, not the other way round."
 COLDWAR_DDR_cc_hag: "The Ideologist's Candidacy"
 COLDWAR_DDR_cc_hag_desc: "The guardian of doctrine steps out of the shadow."
 COLDWAR_DDR_cc_hof: "The General's Candidacy"
 COLDWAR_DDR_cc_hof_desc: "Army General Hoffmann: the Minister of National Defence as head of the party."
 COLDWAR_DDR_cc_lam: "The Young Star"
 COLDWAR_DDR_cc_lam_desc: "The youngest Politburo member, the party's best speaker - and the only one the young people like."
 COLDWAR_DDR_cc_kro: "Moscow's Man"
 COLDWAR_DDR_cc_kro_desc: "Krolikowski reports to the Soviet embassy - and the Soviet embassy remembers."
 COLDWAR_DDR_cc_kre: "The FDJ Generation"
 COLDWAR_DDR_cc_kre_desc: "The former FDJ chief, born 1937 - the first leader who did not fight Hitler."
 COLDWAR_DDR_cc_mod: "The Dresden Signal"
 COLDWAR_DDR_cc_mod_desc: "The district secretary of Dresden, never admitted to the Politburo, offers a careful reform."
 COLDWAR_DDR_cc_ulb: "The Old Man Returns"
 COLDWAR_DDR_cc_ulb_desc: "Retired 'for reasons of age', Ulbricht has not forgiven."
 COLDWAR_DDR_cc_the_letter_of_the_thirteen: "The Letter of the Thirteen"
 COLDWAR_DDR_cc_the_letter_of_the_thirteen_desc: "Thirteen of twenty Politburo members ask Brezhnev, behind Ulbricht's back, to let the old man go."
 COLDWAR_DDR_koko_the_currency_directorate: "The Currency Directorate"
 COLDWAR_DDR_koko_the_currency_directorate_desc: "Since 1966 Alexander Schalck-Golodkowski's Commercial Coordination has earned the hard currency the plan cannot. Now the MfS officer who keeps the republic's foreign-exchange books runs the republic itself - and every decision is weighed in D-Mark."
 COLDWAR_DDR_koko_the_hard_currency_plan: "The Hard-Currency Plan"
 COLDWAR_DDR_koko_the_hard_currency_plan_desc: "In 1970 the republic owes Western banks some two billion Valuta marks, and every machine bought in the West raises the bill. Schalck's line replaces the planners' slogans: every Kombinat earns hard currency first - and the firm takes its cut."
 COLDWAR_DDR_koko_sell_to_bonn: "Sell to Bonn"
 COLDWAR_DDR_koko_sell_to_bonn_desc: "The richest customer lives next door. Inner-German trade knows no customs border, and every West German order is paid in D-Mark - in goods, transit fees and, sooner or later, political goodwill."
 COLDWAR_DDR_koko_sell_to_the_world: "Sell to the World"
 COLDWAR_DDR_koko_sell_to_the_world_desc: "Machine tools for India, trucks for Iraq, optics for France, cranes for the Soviet Union: a customer in every market, so that no single customer - least of all Bonn - holds the republic's purse strings."
 COLDWAR_DDR_koko_the_bavarian_credit: "The Bavarian Credit"
 COLDWAR_DDR_koko_the_bavarian_credit_desc: "In 1983 Franz Josef Strauss, the republic's loudest enemy in Bonn, brokered a billion-mark credit with Schalck as his partner. Here the deal is struck a decade earlier (alt-hist)."
 COLDWAR_DDR_koko_imes_arms_for_hard_currency: "IMES: Arms for Hard Currency"
 COLDWAR_DDR_koko_imes_arms_for_hard_currency_desc: "IMES, Commercial Coordination's arms-trading house (historically founded 1981), sells rifles, ammunition and trucks from a depot at Kavelstorf near Rostock - in the 1980s to both sides of the Iran-Iraq War."
 COLDWAR_DDR_koko_the_republic_as_a_firm: "The Republic as a Firm"
 COLDWAR_DDR_koko_the_republic_as_a_firm_desc: "Profit centres instead of ministries, a balance sheet instead of a Five-Year Plan and an MfS officer as managing director: the workers' state becomes a company - with no shareholders' meeting and no elections."
 COLDWAR_DDR_koko_intershop_and_genex: "Intershop and Genex"
 COLDWAR_DDR_koko_intershop_and_genex_desc: "The Intershops sell Jacobs coffee, jeans and Western cigarettes for D-Mark; through Genex, relatives in the West buy Trabants and even prefabricated houses for their families in the East. Whoever holds Western money lives better."
 COLDWAR_DDR_koko_intershop_for_everyone: "An Intershop on Every Corner"
 COLDWAR_DDR_koko_intershop_for_everyone_desc: "From 1974 every citizen may hold D-Mark and spend it in the Intershop: the republic collects the money Western relatives send. Whoever has an aunt in Hamburg now lives better than a factory director."
 COLDWAR_DDR_koko_delikat_and_exquisit: "Delikat and Exquisit"
 COLDWAR_DDR_koko_delikat_and_exquisit_desc: "Since 1962 the Exquisit boutiques and since 1966 the Delikat shops sell Western-style goods for Marks of the GDR at steep prices. They soak up savings without handing a single citizen a D-Mark."
 COLDWAR_DDR_koko_the_ransom_trade: "The Ransom Trade"
 COLDWAR_DDR_koko_the_ransom_trade_desc: "Since 1963 Bonn has bought political prisoners out of East German jails - in the end some 34,000 people, paid for in oil, copper and coffee delivered through the churches. The republic exports its dissidents and imports hard currency."
 COLDWAR_DDR_koko_art_and_antiques: "Art and Antiques for Marks"
 COLDWAR_DDR_koko_art_and_antiques_desc: "From 1973 the state art-trading firm (Kunst & Antiquitäten GmbH) empties attics, manor houses and church lofts for Western dealers; collectors who refuse to sell are assessed for back taxes until they give in."
 COLDWAR_DDR_koko_officers_on_special_duty: "Officers on Special Duty"
 COLDWAR_DDR_koko_officers_on_special_duty_desc: "The managers of Commercial Coordination remain 'officers on special duty' of the MfS, reporting to Erich Mielke. The firm and the Ministry are one - its trading houses in the West double as listening posts."
 COLDWAR_DDR_koko_a_firm_without_masters: "A Firm Without Masters"
 COLDWAR_DDR_koko_a_firm_without_masters_desc: "Schalck cuts the line to Normannenstraße: the firm answers to no ministry, only to its balance sheet. The directors cheer; Mielke keeps the files and waits."
 COLDWAR_DDR_cdu_the_union_of_1945: "The Union of 1945"
 COLDWAR_DDR_cdu_the_union_of_1945_desc: "Founded in June 1945 by Andreas Hermes and Jakob Kaiser, purged by the Soviet administration in 1947 and tamed under Otto Nuschke and Gerald Götting, the East CDU rediscovers the Christian democracy it was founded for."
 COLDWAR_DDR_cdu_leave_the_national_front: "Leave the National Front"
 COLDWAR_DDR_cdu_leave_the_national_front_desc: "No more single lists: the Union leaves the National Front and stands on its own programme for the first time since 1950."
 COLDWAR_DDR_cdu_freedom_of_the_churches: "Freedom of the Churches"
 COLDWAR_DDR_cdu_freedom_of_the_churches_desc: "No more pressure to choose the Jugendweihe over confirmation, no more careers lost to faith: the churches may teach, publish and build again."
 COLDWAR_DDR_cdu_farms_and_workshops: "Private Farms and Workshops"
 COLDWAR_DDR_cdu_farms_and_workshops_desc: "The 'Socialist Spring in the Countryside' of 1960 forced the last free farmers into the LPG, and thousands fled west. The Union's economics are Catholic social teaching and Protestant thrift: the family, the workshop and the farm come first."
 COLDWAR_DDR_cdu_the_letter_from_weimar: "The Letter from Weimar"
 COLDWAR_DDR_cdu_the_letter_from_weimar_desc: "In September 1989 four East CDU members wrote to their own leadership demanding honesty and reform. Here the letter is written twenty years earlier - and the leadership answers it."
 COLDWAR_DDR_cdu_reconciliation_with_the_church: "Reconciliation with the Church"
 COLDWAR_DDR_cdu_reconciliation_with_the_church_desc: "The Federation of Evangelical Churches (1969) is invited into the government's councils, and the state asks forgiveness for the persecution of the Junge Gemeinde in 1953 and the demolition of Leipzig's University Church in 1968."
 COLDWAR_DDR_cdu_a_service_for_peace: "A Service for Peace"
 COLDWAR_DDR_cdu_a_service_for_peace_desc: "Since 1964 conscientious objectors may serve unarmed as 'construction soldiers' - and are barred from university for it. The Union offers a real civilian service in hospitals and care homes, as Dresden's church groups proposed."
 COLDWAR_DDR_cdu_the_christian_family: "The Christian Family"
 COLDWAR_DDR_cdu_the_christian_family_desc: "86 % of the republic's women work, and the state raises the children in crèches. The Union pays mothers and fathers who want to stay at home - more children, fewer hands in the factories."
 COLDWAR_DDR_cdu_return_the_land: "Return the Land"
 COLDWAR_DDR_cdu_return_the_land_desc: "Every LPG member may leave with his fields, his cattle and his share of the machines. The old farming families return to their yards - and the cooperatives lose their best land."
 COLDWAR_DDR_cdu_cooperatives_by_choice: "Cooperatives by Choice"
 COLDWAR_DDR_cdu_cooperatives_by_choice_desc: "The LPG stays, but membership becomes voluntary and the members elect their own chairmen. The cooperative farmers keep their security; the countryside changes slowly."
 COLDWAR_DDR_cdu_a_christian_social_market: "A Christian Social Market"
 COLDWAR_DDR_cdu_a_christian_social_market_desc: "'Property entails obligations', says the Basic Law: private initiative under a Christian social order. Prices are freed step by step, the family firms get credit, and the Kombinate must compete for the first time."
 COLDWAR_DDR_cdu_christian_democracy: "Christian Democracy"
 COLDWAR_DDR_cdu_christian_democracy_desc: "A people's party open to Protestants and Catholics, farmers and engineers: the Union stops being a bloc party and becomes a party of government that must answer the German question."
 COLDWAR_DDR_cdu_the_road_to_bonn: "The Road to Bonn"
 COLDWAR_DDR_cdu_the_road_to_bonn_desc: "The sister party leads the opposition in Bonn and will govern again. Christian Democrats on both sides of the border prepare one party, one programme and one Germany - and the West German Union pays for the campaign."
 COLDWAR_DDR_cdu_a_christian_republic: "A Christian Republic"
 COLDWAR_DDR_cdu_a_christian_republic_desc: "Two German states, both Christian-democratic, both with the West: the republic keeps its own flag and its own seat, as Austria shows a German-speaking state can."
 COLDWAR_DDR_cdu_accession_under_article_23: "Accession Under Article 23"
 COLDWAR_DDR_cdu_accession_under_article_23_desc: "Article 23 of the Basic Law lets 'other parts of Germany' join the Federal Republic. Mecklenburg, Brandenburg, Saxony-Anhalt, Saxony and Thuringia - abolished as states in 1952 - apply to join; the decision lies in Bonn."
 COLDWAR_DDR_cdu_the_garrison_question: "The Garrison Question"
 COLDWAR_DDR_cdu_the_garrison_question_desc: "Twenty Soviet divisions stand between the Elbe and the Oder. A Christian republic that looks west cannot host them for ever: the government asks Moscow, politely and publicly, to bring its soldiers home."
 COLDWAR_DDR_ldpd_a_liberal_morning: "A Liberal Morning"
 COLDWAR_DDR_ldpd_a_liberal_morning_desc: "The party of Wilhelm Külz - of craftsmen, doctors and shopkeepers - called its newspaper The Morning. Manfred Gerlach now promises the republic its liberal morning."
 COLDWAR_DDR_ldpd_the_rule_of_law: "The Rule of Law"
 COLDWAR_DDR_ldpd_the_rule_of_law_desc: "Independent judges, public trials and defence lawyers who actually defend: the state is bound by its own laws - the Ministry for State Security included."
 COLDWAR_DDR_ldpd_the_market_returns: "The Market Returns"
 COLDWAR_DDR_ldpd_the_market_returns_desc: "Gerlach's economists rewrite the economic line: prices that carry information, firms that may fail, and a social safety net beneath both. Two blueprints compete for the way there - Erhard's of 1948 and Budapest's of 1968."
 COLDWAR_DDR_ldpd_a_free_press: "A Free Press"
 COLDWAR_DDR_ldpd_a_free_press_desc: "The press office of the Council of Ministers stops issuing instructions. Neues Deutschland gets competitors, and the journalists start with the privileges of the functionaries."
 COLDWAR_DDR_ldpd_a_constitutional_court: "A Constitutional Court"
 COLDWAR_DDR_ldpd_a_constitutional_court_desc: "The republic never had one: the Volkskammer judged its own laws. Modelled on Karlsruhe, a constitutional court in Leipzig - the old seat of the Reich Court - now guards the citizens' rights."
 COLDWAR_DDR_ldpd_justice_for_waldheim: "Justice for Waldheim"
 COLDWAR_DDR_ldpd_justice_for_waldheim_desc: "In 1950 the Waldheim trials sentenced some 3,400 people in minutes each; thousands more were broken in Bautzen and Hohenschönhausen. The new courts reopen the files and rehabilitate the victims."
 COLDWAR_DDR_ldpd_erhards_way: "Erhard's Way"
 COLDWAR_DDR_ldpd_erhards_way_desc: "On 20 June 1948 Ludwig Erhard freed West German prices overnight. The LDPD does the same: the subsidies go, the shelves fill - and the factories that cannot compete close their gates."
 COLDWAR_DDR_ldpd_the_budapest_model: "The Budapest Model"
 COLDWAR_DDR_ldpd_the_budapest_model_desc: "Since 1968 Kádár's Hungary has used prices, profits and private plots without leaving the Warsaw Pact. Slower than Erhard - but Moscow can live with it."
 COLDWAR_DDR_ldpd_return_the_firms: "Return the Firms"
 COLDWAR_DDR_ldpd_return_the_firms_desc: "In 1972 the SED nationalised some 11,000 semi-state firms, private factories and craft cooperatives within months. The LDPD returns them to their owners - or, if it has not happened yet, stops the nationalisation for good."
 COLDWAR_DDR_ldpd_the_convertible_mark: "The Convertible Mark"
 COLDWAR_DDR_ldpd_the_convertible_mark_desc: "The Mark of the GDR trades at one to four on the black market and buys nothing abroad. Gerlach makes it convertible: Western goods and investors arrive - and so does the truth about its value."
 COLDWAR_DDR_ldpd_the_labour_offices: "The Labour Offices Reopen"
 COLDWAR_DDR_ldpd_the_labour_offices_desc: "The republic has not known open unemployment since the early 1950s; the market reform brings it back. Labour offices, retraining and unemployment pay cushion the blow - at a price."
 COLDWAR_DDR_ldpd_a_passport_for_every_citizen: "A Passport for Every Citizen"
 COLDWAR_DDR_ldpd_a_passport_for_every_citizen_desc: "Every citizen receives a passport valid for all countries. The death strip is cleared and the order to shoot revoked - the Antifascist Protection Rampart has no purpose left."
 COLDWAR_DDR_ldpd_a_liberal_republic: "A Liberal Republic"
 COLDWAR_DDR_ldpd_a_liberal_republic_desc: "Courts, press and property are free. Now the liberals must answer the question every German liberal has asked since 1848: unity and freedom - in which order?"
 COLDWAR_DDR_ldpd_a_german_confederation: "A German Confederation"
 COLDWAR_DDR_ldpd_a_german_confederation_desc: "Two states, one market, one currency union and a joint council of ministers: unity in steps, with the republic's own institutions intact."
 COLDWAR_DDR_ldpd_unity_in_freedom: "Unity in Freedom"
 COLDWAR_DDR_ldpd_unity_in_freedom_desc: "No half measures: the republic applies to join the Federal Republic, its Basic Law and its Mark. The liberals of 1848 would approve; the Kombinat directors and Moscow do not."
 COLDWAR_DDR_spd_the_merger_undone: "The Merger Undone"
 COLDWAR_DDR_spd_the_merger_undone_desc: "On 21 April 1946 the eastern SPD was merged into the SED with a handshake in the Admiralspalast. Friedrich Ebert, son of the first president of the Weimar Republic and a party to that merger himself, now leads the social democrats back out of it (alt-hist)."
 COLDWAR_DDR_spd_free_trade_unions: "Free Trade Unions"
 COLDWAR_DDR_spd_free_trade_unions_desc: "The Free German Trade Union Federation is free in name only: it hands out holidays and production pledges, not strikes. 17 June 1953 began as a workers' protest against higher norms - the social democrats have not forgotten."
 COLDWAR_DDR_spd_brandts_partners: "Brandt's Partners"
 COLDWAR_DDR_spd_brandts_partners_desc: "In Bonn Willy Brandt's social-liberal coalition practises 'change through rapprochement'. In East Berlin a social-democratic government finally answers in the same language - and inner-German trade grows."
 COLDWAR_DDR_spd_the_social_state: "The Social State"
 COLDWAR_DDR_spd_the_social_state_desc: "Social democracy promised more than full employment and cheap bread: decent pensions, shorter hours and a voice for the workers in their own factories. Ebert's economists write it into the economic line."
 COLDWAR_DDR_spd_reform_the_fdgb: "Reform the FDGB"
 COLDWAR_DDR_spd_reform_the_fdgb_desc: "Free elections for every union post and the right to bargain over wages and norms: the old federation is turned from a transmission belt into a real union."
 COLDWAR_DDR_spd_unions_beside_the_fdgb: "Unions Beside the FDGB"
 COLDWAR_DDR_spd_unions_beside_the_fdgb_desc: "Let the workers found their own unions, as the shipyard workers of Gdańsk will in 1980. The FDGB loses its monopoly - and its functionaries their power."
 COLDWAR_DDR_spd_pensions_worth_the_name: "Pensions Worth the Name"
 COLDWAR_DDR_spd_pensions_worth_the_name_desc: "Pensions barely cover rent and bread, and pensioners are the only citizens allowed to visit the West - the state does not mind if they stay there. The social democrats raise pensions to a living wage - on credit."
 COLDWAR_DDR_spd_growth_before_distribution: "Growth Before Distribution"
 COLDWAR_DDR_spd_growth_before_distribution_desc: "Helmut Schmidt's rule - 'today's profits are tomorrow's investments and the day after tomorrow's jobs' - comes to East Berlin: first the roads, the plants and the export earnings, then the pensions."
 COLDWAR_DDR_spd_the_forty_hour_week: "The Forty-Hour Week"
 COLDWAR_DDR_spd_the_forty_hour_week_desc: "Since 1967 the five-day week has had 43 and three-quarter hours. The social democrats bring in the forty-hour week - more life, less output."
 COLDWAR_DDR_spd_codetermination: "Co-Determination"
 COLDWAR_DDR_spd_codetermination_desc: "The West German coal and steel law of 1951 gave the workers half the seats on the supervisory boards. In the people's own enterprises the works councils now sit beside the director - and share the responsibility for the plan."
 COLDWAR_DDR_spd_travel_without_permission: "Travel Without Permission"
 COLDWAR_DDR_spd_travel_without_permission_desc: "Brandt's 'policy of small steps' began with passes for West Berliners at Christmas 1963. The social democrats finish the walk: citizens travel west without permission, and the Rampart's guns are withdrawn."
 COLDWAR_DDR_spd_erfurt_revisited: "Erfurt Revisited"
 COLDWAR_DDR_spd_erfurt_revisited_desc: "On 19 March 1970 Erfurt cheered 'Willy, Willy' under the windows of the Erfurter Hof - the wrong Willy, as far as the SED was concerned. Ebert invites Brandt back, this time as a partner."
 COLDWAR_DDR_spd_the_godesberg_question: "The Godesberg Question"
 COLDWAR_DDR_spd_the_godesberg_question_desc: "In 1959 the western SPD renounced Marxism at Bad Godesberg and became a people's party. The eastern party must decide what it is for: a better GDR, or one Germany."
 COLDWAR_DDR_spd_democratic_socialism_in_the_east: "Democratic Socialism in the East"
 COLDWAR_DDR_spd_democratic_socialism_in_the_east_desc: "Keep the people's own enterprises, the crèches and the polyclinics, add free elections and free unions: the republic becomes the social-democratic state the Weimar left never built."
 COLDWAR_DDR_spd_one_germany_social_and_democratic: "One Germany, Social and Democratic"
 COLDWAR_DDR_spd_one_germany_social_and_democratic_desc: "Kurt Schumacher's dream of 1946: a united Germany under social democracy. Ebert's party campaigns for unity with Brandt's Federal Republic - the strongest argument against it is quartered in Wünsdorf."
 COLDWAR_DDR_spd_the_garrison_goes_home: "The Garrison Goes Home"
 COLDWAR_DDR_spd_the_garrison_goes_home_desc: "A social-democratic GDR wants friendship with Moscow, not occupation. Ebert proposes a staged withdrawal of the Soviet divisions, guaranteed by a treaty of friendship."
 COLDWAR_DDR_spd_a_treaty_of_unity: "A Treaty of Unity"
 COLDWAR_DDR_spd_a_treaty_of_unity_desc: "Two parliaments, one treaty: the social democrats in East Berlin and Bonn negotiate a union of equals under a new all-German constitution (Article 146 of the Basic Law) - not an accession."
 COLDWAR_DDR_ndpd_nation_and_democracy: "Nation and Democracy"
 COLDWAR_DDR_ndpd_nation_and_democracy_desc: "Founded in 1948 with the SED's blessing to give former Wehrmacht officers, nominal Nazi party members and the national middle class a political home, Lothar Bolz's NDPD was meant to keep nationalism on a leash. Now it holds the leash."
 COLDWAR_DDR_ndpd_a_national_economy: "A National Economy"
 COLDWAR_DDR_ndpd_a_national_economy_desc: "The NDPD always spoke for the shopkeepers, master craftsmen and small manufacturers. Its economics are simple - German work for German welfare, bought at home where possible - but who pays for the welfare?"
 COLDWAR_DDR_ndpd_prussia_and_saxony: "Prussia and Saxony"
 COLDWAR_DDR_ndpd_prussia_and_saxony_desc: "Potsdam and Dresden, Frederick the Great and Augustus the Strong: the two great traditions of the republic's lands are restored to honour - palaces, regiments and all."
 COLDWAR_DDR_ndpd_the_eastern_border: "The Eastern Border Question"
 COLDWAR_DDR_ndpd_the_eastern_border_desc: "In the Görlitz Agreement of 6 July 1950 the GDR recognised the Oder-Neisse line as the 'border of peace and friendship'. The Silesians and East Prussians in the NDPD never quite accepted it - the party must now say what it thinks."
 COLDWAR_DDR_ndpd_prussian_thrift: "Prussian Thrift"
 COLDWAR_DDR_ndpd_prussian_thrift_desc: "Frederick William I, the 'soldier king', left a full treasury and no debts. The NDPD cuts subsidies and administration alike - honest budgets, thinner pay packets."
 COLDWAR_DDR_ndpd_bread_for_the_nation: "Bread for the Nation"
 COLDWAR_DDR_ndpd_bread_for_the_nation_desc: "Cheap bread, cheap rents and a national bonus for every family with three children: the NDPD buys the loyalty of the nation - and the bill comes later."
 COLDWAR_DDR_ndpd_masters_of_their_own_workshops: "Masters of Their Own Workshops"
 COLDWAR_DDR_ndpd_masters_of_their_own_workshops_desc: "NDPD members own the bakeries, butcher shops and small factories the state has been squeezing. Their firms get tax relief, credit and the right to hire."
 COLDWAR_DDR_ndpd_german_quality_work: "German Quality Work"
 COLDWAR_DDR_ndpd_german_quality_work_desc: "'Deutsche Wertarbeit' was the boast of Saxony's toolmakers and Thuringia's glassblowers long before the Kombinate. The national government stakes the economy on it: fewer, better products, made at home and sold on quality."
 COLDWAR_DDR_ndpd_rebuild_the_semper_opera: "Rebuild the Semper Opera"
 COLDWAR_DDR_ndpd_rebuild_the_semper_opera_desc: "Dresden's opera house has stood in ruins since the firestorm of February 1945; historically it was rebuilt from 1977 to 1985. Here it is the first act of a national government - an expensive one."
 COLDWAR_DDR_ndpd_a_year_of_service: "A Year of Service"
 COLDWAR_DDR_ndpd_a_year_of_service_desc: "Every young German serves the nation for a year - in the NVA, in the hospitals or on the building sites. Prussia's 'school of the nation' reopens, without the drill sergeant's cane."
 COLDWAR_DDR_ndpd_confirm_the_oder_neisse_border: "Confirm the Oder-Neisse Border"
 COLDWAR_DDR_ndpd_confirm_the_oder_neisse_border_desc: "The nation is whole within its borders: the NDPD confirms Görlitz without reservation. Warsaw is relieved, Moscow satisfied, and the expellee associations in the West call it treason."
 COLDWAR_DDR_ndpd_leave_the_question_open: "Leave the Question Open"
 COLDWAR_DDR_ndpd_leave_the_question_open_desc: "Bonn has kept the border question open 'pending a peace treaty' - why should East Berlin not? No claim is made and no soldier moves, but the words alone chill Warsaw and alarm Moscow."
 COLDWAR_DDR_ndpd_one_nation_two_states: "One Nation, Two States"
 COLDWAR_DDR_ndpd_one_nation_two_states_desc: "Ulbricht's constitution of 1968 called the GDR 'a socialist state of the German nation'. The NDPD drops the adjective and keeps the noun: two states, one nation, one future."
 COLDWAR_DDR_ndpd_the_confederation_of_the_nation: "The Confederation of the Nation"
 COLDWAR_DDR_ndpd_the_confederation_of_the_nation_desc: "A common citizenship, a joint national assembly and an open inner-German border, each state keeping its own army: the NDPD asks Bonn whether national democrats can be partners."
 COLDWAR_DDR_nrf_rule_of_the_council: "Rule of the Council"
 COLDWAR_DDR_nrf_rule_of_the_council_desc: "A council of officers, functionaries and agitators without names seizes the collapsing state. It promises order and national rebirth; it delivers decrees, curfews and fear (alt-hist)."
 COLDWAR_DDR_nrf_the_purges: "The Purges"
 COLDWAR_DDR_nrf_the_purges_desc: "Lists are drawn up in every ministry, Kombinat and barracks. Whoever served the old order must prove his loyalty to the new one - or disappear."
 COLDWAR_DDR_nrf_behind_closed_borders: "Behind Closed Borders"
 COLDWAR_DDR_nrf_behind_closed_borders_desc: "No Western credit, no Comecon delegation, no foreign journalist: the council closes the country more tightly than the Wall ever did. Whatever the republic needs, it must now make itself - the shelves empty first."
 COLDWAR_DDR_nrf_break_the_party: "Break the Party"
 COLDWAR_DDR_nrf_break_the_party_desc: "The SED's two million members are ordered to hand in their cards; district secretaries are arrested at their desks. The apparatus that ran the republic for twenty years is gone - and with it the people who knew how."
 COLDWAR_DDR_nrf_break_the_ministry: "Break the Ministry"
 COLDWAR_DDR_nrf_break_the_ministry_desc: "The council fears Mielke's 43,000 officers more than any party. The Ministry for State Security is stormed, its officers interned - and its files and its Guards Regiment handed to the council's own secret police."
 COLDWAR_DDR_nrf_the_siege_economy: "The Siege Economy"
 COLDWAR_DDR_nrf_the_siege_economy_desc: "Ration cards return for the first time since 1958. Lignite, potatoes and labour brigades are to replace what Comecon and the West no longer deliver; Schwarzheide and Leuna turn brown coal into petrol."
 COLDWAR_DDR_nrf_the_garrison_state: "The Barracks State"
 COLDWAR_DDR_nrf_the_garrison_state_desc: "A militia company in every factory, a shooting range in every school, a minefield on every border: the council arms seventeen million people against enemies on all sides - most of them imagined."
 COLDWAR_DDR_nrf_the_fortress_economy: "The Fortress Economy"
 COLDWAR_DDR_nrf_the_fortress_economy_desc: "Five years behind closed borders: every factory works to a war plan, every field to a ration, and the republic needs nothing from anyone - except the things it can no longer have."
 COLDWAR_DDR_mcn_the_military_council: "The Military Council"
 COLDWAR_DDR_mcn_the_military_council_desc: "Colonel General Heinz Keßler, Chief of the NVA's Main Staff - a Wehrmacht soldier who crossed over to the Red Army in 1941 - heads a council of generals in Strausberg. The party has failed; the army takes over, 'temporarily'."
 COLDWAR_DDR_mcn_martial_law: "Martial Law"
 COLDWAR_DDR_mcn_martial_law_desc: "Curfews, military tribunals and soldiers at the gates of the Kombinate. The streets are quiet; the queues outside the shops are not."
 COLDWAR_DDR_mcn_the_arms_industry: "The Arms Industry"
 COLDWAR_DDR_mcn_the_arms_industry_desc: "Explosives from Schönebeck, rifles from Suhl, W50 trucks from Ludwigsfelde, landing ships from Wolgast: the generals take personal charge of the factories that equip them - and write the plan as a staff order."
 COLDWAR_DDR_mcn_the_doctrine_question: "The Doctrine Question"
 COLDWAR_DDR_mcn_the_doctrine_question_desc: "The Warsaw Pact plans to carry any war to the Rhine within days, with the NVA in its first strategic echelon. The council must decide whether the army exists for the alliance or for the homeland."
 COLDWAR_DDR_mcn_combat_groups_under_army_command: "Combat Groups Under Army Command"
 COLDWAR_DDR_mcn_combat_groups_under_army_command_desc: "The Combat Groups of the Working Class - several hundred thousand men in factory overalls - answer to the SED district leaderships and the Interior Ministry. The council puts them under NVA command as a territorial army."
 COLDWAR_DDR_mcn_officers_in_the_ministries: "Officers in the Ministries"
 COLDWAR_DDR_mcn_officers_in_the_ministries_desc: "Colonels replace the state secretaries: the ministries are run like a staff, with orders, deadlines and reports - and no patience for the planners' excuses."
 COLDWAR_DDR_mcn_arms_for_export: "Arms for Export"
 COLDWAR_DDR_mcn_arms_for_export_desc: "Kalashnikovs from Wiesa, trucks from Ludwigsfelde, patrol boats from Wolgast - sold to Baghdad, Tripoli and Addis Ababa for hard currency. The generals become arms dealers; their own regiments wait."
 COLDWAR_DDR_mcn_arms_for_defence: "Arms for Defence"
 COLDWAR_DDR_mcn_arms_for_defence_desc: "Every rifle the republic makes stays with the NVA: licence production of Soviet tanks and guns at full speed, and a modern army that the shops pay for."
 COLDWAR_DDR_mcn_special_production: "Special Production"
 COLDWAR_DDR_mcn_special_production_desc: "'Special production' is the plan's word for weapons. The council doubles it: licence-built Kalashnikovs, ammunition and armoured personnel carriers - and fewer washing machines."
 COLDWAR_DDR_mcn_forward_defence: "Forward Defence"
 COLDWAR_DDR_mcn_forward_defence_desc: "The NVA trains to reach the Rhine: two armies of six divisions, ready to cross the inner-German border on the first day. Moscow approves; the West notices."
 COLDWAR_DDR_mcn_defence_of_the_homeland: "Defence of the Homeland"
 COLDWAR_DDR_mcn_defence_of_the_homeland_desc: "No divisions for the Rhine: the NVA digs in between the Elbe and the Oder with reservists, fortified towns and the Combat Groups. The West relaxes a little; Moscow's planners do not."
 COLDWAR_DDR_mcn_the_councils_mandate: "The Council's Mandate"
 COLDWAR_DDR_mcn_the_councils_mandate_desc: "Martial law was declared 'until order is restored', and order is restored. Now the generals must say how long 'until' lasts - and what the army's budget will be."
 COLDWAR_DDR_mcn_a_caretaker_council: "A Caretaker Council"
 COLDWAR_DDR_mcn_a_caretaker_council_desc: "The council promises to step down within three years and hand the state to an elected civilian government - as Portugal's captains will do after 1974."
 COLDWAR_DDR_mcn_permanent_military_rule: "Permanent Military Rule"
 COLDWAR_DDR_mcn_permanent_military_rule_desc: "There will be no return to the party and no elections. The council becomes the state, and its chairman wears the uniform of an Army General."
 COLDWAR_DDR_mcn_the_barracks_return: "Back to the Barracks"
 COLDWAR_DDR_mcn_the_barracks_return_desc: "Free elections under the army's guard; the winner forms a civilian government, and the generals return to Strausberg with their honour and their budget intact."
 COLDWAR_DDR_mcn_the_army_is_the_nation: "The Army Is the Nation"
 COLDWAR_DDR_mcn_the_army_is_the_nation_desc: "Officer schools train the administrators, a general runs every district and the GST is the only youth organisation: the republic is reorganised as one great military district."
 COLDWAR_DDR_pcc_the_crown_council: "The Crown Council"
 COLDWAR_DDR_pcc_the_crown_council_desc: "Louis Ferdinand, Prince of Prussia - grandson of the last Kaiser, once a worker on Henry Ford's assembly line in Detroit, head of the House of Hohenzollern since 1951 - is invited from Bremen back to Potsdam (alt-hist). Sanssouci, the New Palace and Cecilienhof become the seat of the crown; the open question is what kind of crown."
 COLDWAR_DDR_pcc_prussian_virtues: "Prussian Virtues"
 COLDWAR_DDR_pcc_prussian_virtues_desc: "Duty, thrift and incorruptibility: Frederick William I balanced his budget to the last thaler and hanged a corrupt official at the gate of Königsberg castle. The crown's economics fit on a parade ground - and pinch every household."
 COLDWAR_DDR_pcc_to_each_his_own: "To Each His Own"
 COLDWAR_DDR_pcc_to_each_his_own_desc: "'Suum cuique' was the motto of the Order of the Black Eagle; Frederick's Prussia took in Huguenots, Salzburg Protestants and Bohemian weavers. The crown protects the churches, the Sorbs and every honest dissenter."
 COLDWAR_DDR_pcc_the_kings_army: "The King's Army"
 COLDWAR_DDR_pcc_the_kings_army_desc: "The NVA's stone-grey uniforms and parade step are already Prussian. Now its regiments take back the old names and colours, and the officers swear an oath to the crown."
 COLDWAR_DDR_pcc_return_the_estates: "Return the Estates"
 COLDWAR_DDR_pcc_return_the_estates_desc: "The land reform of 1945 took every estate over 100 hectares from the Junkers. The crown returns the manor farms to the old families as model estates - and the cooperative farmers lose their best fields."
 COLDWAR_DDR_pcc_royal_manufactories: "The Royal Manufactories"
 COLDWAR_DDR_pcc_royal_manufactories_desc: "Frederick the Great founded the Royal Porcelain Manufactory in Berlin and filled Prussia with silk, glass and cloth works. The crown does the same with state money: new manufactories under royal warrant."
 COLDWAR_DDR_pcc_a_constitutional_crown: "A Constitutional Crown"
 COLDWAR_DDR_pcc_a_constitutional_crown_desc: "A king who reigns but does not rule: a parliament elected by all and a prime minister responsible to it - the model of London and Stockholm, not of 1914."
 COLDWAR_DDR_pcc_an_authoritarian_crown: "An Authoritarian Crown"
 COLDWAR_DDR_pcc_an_authoritarian_crown_desc: "The king appoints the government and commands the army; parliament may advise. It is the Prussia of 1850 and its three-class franchise - with few friends abroad and many enemies at home."
 COLDWAR_DDR_pcc_frederick_comes_home: "Frederick Comes Home"
 COLDWAR_DDR_pcc_frederick_comes_home_desc: "The coffins of Frederick the Great and his father have rested at Hohenzollern Castle in Württemberg since 1952; historically Frederick was laid to rest at Sanssouci, as he had wished, only in 1991. The crown asks Bonn to let him come home now."
 COLDWAR_DDR_pcc_the_seehandlung: "The Seehandlung Returns"
 COLDWAR_DDR_pcc_the_seehandlung_desc: "Frederick the Great founded the Seehandlung in 1772 - a royal trading house that became Prussia's state bank and financed its mills, canals and salt works. The crown revives it: a royal treasury that lends to the estates and the manufactories and runs a surplus."
 COLDWAR_DDR_pcc_the_kingdom_of_prussia: "The Kingdom of Prussia"
 COLDWAR_DDR_pcc_the_kingdom_of_prussia_desc: "Proclaimed in the Marble Hall of the New Palace, the Prussian state that the Allies abolished in 1947 returns as a kingdom on the Spree and the Havel. Whether anyone beyond its borders will recognise it is another matter."
 COLDWAR_DDR_spk_the_planners_govern: "The Planners Govern"
 COLDWAR_DDR_spk_the_planners_govern_desc: "Gerhard Schürer, chairman of the State Planning Commission since 1965, takes the government: the plan, not the Politburo's slogans, now decides."
 COLDWAR_DDR_spk_the_schurer_report: "The Schürer Report"
 COLDWAR_DDR_spk_the_schurer_report_desc: "In October 1989 Schürer told the Politburo that the republic lived on Western credit and could not pay. Here the report is written in 1970 - and published, and the economic line is rewritten to fit the numbers."
 COLDWAR_DDR_spk_the_eser_computers: "Planning by Computer"
 COLDWAR_DDR_spk_the_eser_computers_desc: "Comecon's Unified System of Electronic Computers: Robotron in Dresden builds the EC 1040, and the planners finally get machines to count with."
 COLDWAR_DDR_spk_export_discipline: "Export Discipline"
 COLDWAR_DDR_spk_export_discipline_desc: "Every Kombinat gets a hard-currency export target. What the West will buy is no longer sold in the shops at home."
 COLDWAR_DDR_spk_a_cabinet_of_experts: "A Cabinet of Experts"
 COLDWAR_DDR_spk_a_cabinet_of_experts_desc: "Engineers, economists and Kombinat directors replace the party secretaries in the Council of Ministers. The Central Committee's economic departments lose their right to give orders."
 COLDWAR_DDR_spk_the_party_keeps_its_role: "The Party Keeps Its Role"
 COLDWAR_DDR_spk_the_party_keeps_its_role_desc: "Schürer governs with the party, not against it: the SED keeps its seats and its cadre lists, and the planners get the apparatus's loyalty in return - and its habits."
 COLDWAR_DDR_spk_the_austerity_plan: "The Austerity Plan"
 COLDWAR_DDR_spk_the_austerity_plan_desc: "Live within our means: fewer Western imports, no more prestige projects, every surplus Deutschmark goes to pay back the debt."
 COLDWAR_DDR_spk_the_growth_plan: "The Growth Plan"
 COLDWAR_DDR_spk_the_growth_plan_desc: "Borrow now, grow later: Western credits buy the machines, and the machines will earn the hard currency to repay them."
 COLDWAR_DDR_spk_cut_the_subsidies: "Cut the Subsidies"
 COLDWAR_DDR_spk_cut_the_subsidies_desc: "Rents frozen at the level of 1936, bread rolls at five pfennigs: the price subsidies swallow billions every year. Schürer cuts them."
 COLDWAR_DDR_spk_credits_from_the_western_banks: "Credits from the Western Banks"
 COLDWAR_DDR_spk_credits_from_the_western_banks_desc: "Frankfurt, Vienna and Tokyo lend to the most reliable debtor in the East. The new plants open on time - the interest falls due on time too."
 COLDWAR_DDR_spk_the_computing_centres: "The Computing Centres"
 COLDWAR_DDR_spk_the_computing_centres_desc: "Every district gets a computing centre; the plan figures of thousands of enterprises travel to Berlin on punched cards."
 COLDWAR_DDR_spk_the_optimal_plan: "The Optimal Plan"
 COLDWAR_DDR_spk_the_optimal_plan_desc: "Linear programming on the EC 1040: Kantorovich's mathematics balances what no ministry ever could - and the apparatus's instinct is no longer needed."
 COLDWAR_DDR_spk_comecon_specialisation: "Comecon Specialisation"
 COLDWAR_DDR_spk_comecon_specialisation_desc: "The Comprehensive Programme of 1971: the republic builds the machine tools, ships and computers of the socialist camp and is paid in roubles."
 COLDWAR_DDR_spk_sell_to_the_world_market: "Sell to the World Market"
 COLDWAR_DDR_spk_sell_to_the_world_market_desc: "Machine tools from Karl-Marx-Stadt, optics from Jena, potash from the Werra - sold for Deutschmarks and dollars, not transferable roubles."
 COLDWAR_DDR_spk_the_hard_currency_balance: "The Hard-Currency Balance"
 COLDWAR_DDR_spk_the_hard_currency_balance_desc: "For the first time the plan balances imports and exports in both currencies - roubles and Deutschmarks - and nobody hides the gap."
 COLDWAR_DDR_spk_the_plan_without_lies: "The Plan Without Lies"
 COLDWAR_DDR_spk_the_plan_without_lies_desc: "True numbers, computed plans, no more 'plan fulfilled 101 %': the planners' republic has a budget it can show to anyone."
 COLDWAR_DDR_kis_church_in_socialism: "Church in Socialism"
 COLDWAR_DDR_kis_church_in_socialism_desc: "Bishop Albrecht Schönherr, Bonhoeffer's student, leads a government of the church: not against socialism, not beside it, but within it."
 COLDWAR_DDR_kis_the_diakonia: "The Diakonia"
 COLDWAR_DDR_kis_the_diakonia_desc: "The church runs dozens of hospitals and hundreds of homes for the old and the disabled - the care the state forgot. Now the care becomes the economic line: people before plan figures."
 COLDWAR_DDR_kis_the_wittenberg_research_home: "The Wittenberg Research Home"
 COLDWAR_DDR_kis_the_wittenberg_research_home_desc: "The church's research home in Luther's town publishes what the state statistics hide: the air, the water, the forests. Environmental circles meet in the parish halls."
 COLDWAR_DDR_kis_the_federation_of_churches: "The Federation of Churches"
 COLDWAR_DDR_kis_the_federation_of_churches_desc: "Since June 1969 the eight regional churches of the GDR stand together in their own federation, separate from the West German EKD."
 COLDWAR_DDR_kis_action_reconciliation: "Action Reconciliation"
 COLDWAR_DDR_kis_action_reconciliation_desc: "Action Reconciliation sends young East Germans to work at Auschwitz and in Polish hospitals. The government takes up the work of atonement."
 COLDWAR_DDR_kis_the_diakonie_hospitals: "The Diakonie Runs the Hospitals"
 COLDWAR_DDR_kis_the_diakonie_hospitals_desc: "The state hands its polyclinics and care homes to the Inner Mission and the Caritas, and pays for them: nurses, deaconesses and doctors who stay instead of leaving for the West."
 COLDWAR_DDR_kis_swords_to_ploughshares: "Swords to Ploughshares"
 COLDWAR_DDR_kis_swords_to_ploughshares_desc: "The badge shows the Soviet statue in front of the UN - a man forging a sword into a ploughshare. Here it is state policy: arms plants make tractors."
 COLDWAR_DDR_kis_justice_peace_and_creation: "Justice, Peace and Creation"
 COLDWAR_DDR_kis_justice_peace_and_creation_desc: "The Conciliar Process of the churches - historically the ecumenical assemblies of Dresden and Magdeburg in 1988-89 - becomes the programme of government: justice for the weak, peace without weapons and an economy that spares creation."
 COLDWAR_DDR_kis_the_peace_republic: "The Peace Republic"
 COLDWAR_DDR_kis_the_peace_republic_desc: "A republic that refuses the logic of deterrence: fewer soldiers, no nuclear weapons on its soil, neutrality as a Christian duty."
 COLDWAR_DDR_kis_the_christian_republic: "The Christian Republic"
 COLDWAR_DDR_kis_the_christian_republic_desc: "The Ten Commandments replace Ulbricht's Ten Commandments of Socialist Morality: confirmation instead of the state youth ceremony, and an open hand to the Christian Democrats in the West."
 COLDWAR_DDR_kis_the_church_schools: "The Church Schools"
 COLDWAR_DDR_kis_the_church_schools_desc: "The churches may run schools again, and Christian pupils may study at university without a party card."
 COLDWAR_DDR_kis_the_soldiers_go_home: "The Soldiers Go Home"
 COLDWAR_DDR_kis_the_soldiers_go_home_desc: "Twenty Soviet divisions stand between the Elbe and the Oder. The Peace Republic asks the Kremlin, politely and in public, to take them home."
 COLDWAR_DDR_kis_partners_of_the_union: "Partners of the Union"
 COLDWAR_DDR_kis_partners_of_the_union_desc: "The churches of East and West were one until 1969. Now the Christian Republic asks Bonn to fund the church's work openly - and to talk to its government."
 COLDWAR_DDR_kis_the_construction_soldiers: "The Construction Soldiers"
 COLDWAR_DDR_kis_the_construction_soldiers_desc: "Since 1964 young men who refuse the weapon serve with a spade - the only unarmed service in the Warsaw Pact. The church's government honours them."
 COLDWAR_DDR_kis_the_social_peace_service: "The Peace Service Law"
 COLDWAR_DDR_kis_the_social_peace_service_desc: "The Dresden proposal, made law: conscientious objectors serve in hospitals, homes and on the land instead of the army."
 COLDWAR_DDR_kis_an_end_to_conscription: "An End to Conscription"
 COLDWAR_DDR_kis_an_end_to_conscription_desc: "Eighteen months of compulsory service end: the NVA becomes an army of volunteers, and the factories get their young men back."
 COLDWAR_DDR_kd_the_directors_take_charge: "The Directors Take Charge"
 COLDWAR_DDR_kd_the_directors_take_charge_desc: "The general directors of the Kombinate - Wolfgang Biermann of Carl Zeiss Jena at their head - stop asking the ministries and start running the state."
 COLDWAR_DDR_kd_the_council_of_general_directors: "The Council of General Directors"
 COLDWAR_DDR_kd_the_council_of_general_directors_desc: "A hundred general directors form the real cabinet; the ministers become their clerks."
 COLDWAR_DDR_kd_coopt_the_nomenklatura: "Co-opt the Nomenklatura"
 COLDWAR_DDR_kd_coopt_the_nomenklatura_desc: "Seats on the Kombinat boards for district secretaries, hunting lodges and Volvos for the Politburo: the party is bought, not fought."
 COLDWAR_DDR_kd_dismantle_the_apparatus: "Dismantle the Apparatus"
 COLDWAR_DDR_kd_dismantle_the_apparatus_desc: "The industrial departments of the Central Committee and half the ministries are dissolved; the directors answer to their balance sheets alone."
 COLDWAR_DDR_kd_self_financing: "Self-Financing of the Kombinate"
 COLDWAR_DDR_kd_self_financing_desc: "The Kombinate keep what they earn and invest it themselves - Ulbricht's reform of the 1960s, taken to its end and written into the economic line."
 COLDWAR_DDR_kd_kombinat_holdings: "Kombinat Holdings"
 COLDWAR_DDR_kd_kombinat_holdings_desc: "The Kombinate become state holding companies: the directors own the management and a share of the profits, the state owns the shares - for now."
 COLDWAR_DDR_kd_joint_ventures_with_the_west: "Western Partners for the Kombinate"
 COLDWAR_DDR_kd_joint_ventures_with_the_west_desc: "Krupp, Siemens and Volkswagen in Zwickau and Jena: half the shares, half the profits - and all the know-how the embargo lists forbid."
 COLDWAR_DDR_kd_the_super_kombinate: "The Super-Kombinate"
 COLDWAR_DDR_kd_the_super_kombinate_desc: "Twenty giant concerns swallow the rest of industry - and the last private and semi-state suppliers with it."
 COLDWAR_DDR_kd_made_for_the_west: "Made for the West"
 COLDWAR_DDR_kd_made_for_the_west_desc: "Swedish furniture, West German shoes and mail-order catalogue goods are made in Kombinat workshops for Western brands - the best goods leave the country."
 COLDWAR_DDR_kd_the_kombinat_republic: "The Republic of the Directors"
 COLDWAR_DDR_kd_the_kombinat_republic_desc: "The red barons own the republic in all but name: efficient, rich - and every director has his dacha, his car and his hard-currency account."
 COLDWAR_DDR_kd_the_export_push: "The Export Push"
 COLDWAR_DDR_kd_the_export_push_desc: "The directors build new export halls with their own money and keep a share of the hard currency they earn - the workers get the overtime."
 COLDWAR_DDR_kd_carl_zeiss_jena: "Biermann's Zeiss"
 COLDWAR_DDR_kd_carl_zeiss_jena_desc: "Biermann's own house: cameras, microscopes, planetaria and space cameras for Soviet spacecraft - the flagship sells to the whole world and builds the republic's first chip lines."
 COLDWAR_DDR_uct_the_council_of_the_mittelstand: "The Council of Master Craftsmen"
 COLDWAR_DDR_uct_the_council_of_the_mittelstand_desc: "No single leader: master craftsmen, shopkeepers and the owners of the semi-state firms govern as a council - an alt-hist union of the middle class."
 COLDWAR_DDR_uct_undo_the_nationalisation: "Undo the Nationalisation of 1972"
 COLDWAR_DDR_uct_undo_the_nationalisation_desc: "In spring 1972 the SED took the last 11,000 private and semi-state firms - the makers of furniture, toys, textiles and spare parts. The council gives them back."
 COLDWAR_DDR_uct_return_to_the_families: "Return to the Families"
 COLDWAR_DDR_uct_return_to_the_families_desc: "The firms go back to the families that founded them - some heirs live in Stuttgart and Munich and come back with Western money."
 COLDWAR_DDR_uct_shares_for_the_workforce: "Shares for the Workforce"
 COLDWAR_DDR_uct_shares_for_the_workforce_desc: "The firms become workers' companies: every employee holds a share, the master craftsman keeps the management."
 COLDWAR_DDR_uct_free_prices: "Free Prices"
 COLDWAR_DDR_uct_free_prices_desc: "The Office for Prices stops fixing what a chair, a cake or a car repair may cost: the market sets the price, and the council writes free enterprise into the economic line."
 COLDWAR_DDR_uct_free_trade: "Free Trade"
 COLDWAR_DDR_uct_free_trade_desc: "Open the market: private firms may import, export and compete with the Kombinate - and with the West."
 COLDWAR_DDR_uct_the_guild_economy: "The Guild Economy"
 COLDWAR_DDR_uct_the_guild_economy_desc: "The old craft order returns: guilds set standards, train apprentices and protect their members from the Kombinate and from foreign competition."
 COLDWAR_DDR_uct_the_leipzig_fair_all_year: "The Leipzig Fair All Year Round"
 COLDWAR_DDR_uct_the_leipzig_fair_all_year_desc: "Since the Middle Ages Leipzig has been the fair between East and West. Now its halls stay open all year, and private firms sign their own contracts."
 COLDWAR_DDR_uct_the_chambers_of_crafts: "The Chambers of Crafts"
 COLDWAR_DDR_uct_the_chambers_of_crafts_desc: "The master's certificate, the journeyman's years, the chamber's seal: a craft education again worth its name."
 COLDWAR_DDR_uct_the_mittelstand_republic: "The Republic of Craftsmen"
 COLDWAR_DDR_uct_the_mittelstand_republic_desc: "Half the republic's workers are employed by firms of fewer than five hundred people - the most Western economy east of the Elbe."
 COLDWAR_DDR_uct_the_craftsmens_cooperatives: "The Craftsmen's Cooperatives"
 COLDWAR_DDR_uct_the_craftsmens_cooperatives_desc: "The craftsmen's cooperatives, forced on the trades since 1958, become voluntary: whoever wants to work alone may."
 COLDWAR_DDR_uct_small_shops_full_shelves: "Small Shops, Full Shelves"
 COLDWAR_DDR_uct_small_shops_full_shelves_desc: "The private baker, butcher and repair shop return to every street - the end of the queue and of goods sold under the counter."
 COLDWAR_DDR_gl_a_republic_that_can_breathe: "A Republic That Can Breathe"
 COLDWAR_DDR_gl_a_republic_that_can_breathe_desc: "Reimar Gilsenbach and the nature circles of the Kulturbund govern the smog republic - an alt-hist green government long before any in the West."
 COLDWAR_DDR_gl_publish_the_environmental_data: "Publish the Environmental Data"
 COLDWAR_DDR_gl_publish_the_environmental_data_desc: "The Council of Ministers wanted to make every figure on air and water a state secret. The Green League prints them in every newspaper."
 COLDWAR_DDR_gl_the_environmental_library: "The Environmental Library"
 COLDWAR_DDR_gl_the_environmental_library_desc: "In the cellar of the Zion Church, historically from 1986, independent groups print what nobody else may - the government lets them grow into the movement that carries it. Western television reports every word."
 COLDWAR_DDR_gl_the_society_for_nature: "The Society for Nature and Environment"
 COLDWAR_DDR_gl_the_society_for_nature_desc: "The Kulturbund's own Society for Nature and Environment (historically founded 1980) organises the clean-up Saturdays: orderly, under party guidance - and without the angry young people from the church cellars."
 COLDWAR_DDR_gl_clean_the_elbe_and_the_saale: "Clean the Elbe and the Saale"
 COLDWAR_DDR_gl_clean_the_elbe_and_the_saale_desc: "Leuna and Buna drain into the Saale, the pulp mills into the Elbe; the fish are dying as far as Hamburg. Sewage plants for the chemical belt."
 COLDWAR_DDR_gl_the_price_of_coal: "The Price of Coal"
 COLDWAR_DDR_gl_the_price_of_coal_desc: "Two hundred and fifty million tonnes of lignite a year, villages swallowed by the pits, sulphur over every town: the League counts what King Lignite really costs and rewrites the economic line - less power, more life."
 COLDWAR_DDR_gl_atom_instead_of_coal: "Atom Instead of Coal"
 COLDWAR_DDR_gl_atom_instead_of_coal_desc: "Soviet pressurised-water reactors replace the dirtiest pits: clean air - and a new dependence on Moscow's fuel."
 COLDWAR_DDR_gl_neither_coal_nor_atom: "Neither Coal nor Atom"
 COLDWAR_DDR_gl_neither_coal_nor_atom_desc: "No new pits and no reactors: save energy, burn less, build wind and water power - and accept colder winters and slower factories."
 COLDWAR_DDR_gl_greifswald_and_stendal: "Greifswald and Stendal"
 COLDWAR_DDR_gl_greifswald_and_stendal_desc: "The Bruno Leuschner plant at Lubmin grows block by block, Stendal is begun early: half the republic's electricity without smoke."
 COLDWAR_DDR_gl_the_energy_saving_republic: "The Energy-Saving Republic"
 COLDWAR_DDR_gl_the_energy_saving_republic_desc: "Insulated prefabricated blocks, district heat from the power stations, wind turbines on Rügen and a Trabant that burns less."
 COLDWAR_DDR_gl_the_end_of_king_lignite: "The End of King Lignite"
 COLDWAR_DDR_gl_the_end_of_king_lignite_desc: "The last open-cast mines close, the briquette factories fall silent, and Leipzig sees a blue sky in winter."
 COLDWAR_DDR_gl_save_the_ore_mountain_forests: "Save the Ore Mountain Forests"
 COLDWAR_DDR_gl_save_the_ore_mountain_forests_desc: "Sulphur from the power stations of Saxony and Bohemia kills the spruce of the Erzgebirge. The League replants and asks Prague for filters."
 COLDWAR_DDR_gl_the_bitterfeld_clean_up: "The Bitterfeld Clean-Up"
 COLDWAR_DDR_gl_the_bitterfeld_clean_up_desc: "Bitterfeld, Wolfen and the poisoned Silver Lake: the chemical triangle gets filters, treatment plants and a budget."
 COLDWAR_DDR_gl_make_the_kombinate_pay: "Make the Kombinate Pay"
 COLDWAR_DDR_gl_make_the_kombinate_pay_desc: "Every tonne of sulphur and every litre of phenol in the river now costs the polluting Kombinat a fine."
 COLDWAR_DDR_gl_the_republic_pays: "The Republic Pays"
 COLDWAR_DDR_gl_the_republic_pays_desc: "The clean-up comes out of the state budget: no fines, no quarrel with the Kombinate - just less money for everything else."
 COLDWAR_DDR_dbd_the_villages_govern: "The Villages Govern"
 COLDWAR_DDR_dbd_the_villages_govern_desc: "Ernst Goldenbaum has led the Farmers' Party since 1948. Freed from the bloc, it speaks for the villages that feed the republic."
 COLDWAR_DDR_dbd_lpg_self_government: "LPG Self-Government"
 COLDWAR_DDR_dbd_lpg_self_government_desc: "The cooperative members elect their chairmen again - not the district party secretary - and the farmers' party writes the village into the economic line."
 COLDWAR_DDR_dbd_cooperative_socialism: "Cooperative Socialism"
 COLDWAR_DDR_dbd_cooperative_socialism_desc: "The LPG stays - but as a true cooperative: the members own it, elect it and share its profit."
 COLDWAR_DDR_dbd_return_of_the_family_farm: "Return of the Family Farm"
 COLDWAR_DDR_dbd_return_of_the_family_farm_desc: "The land reform of 1945 gave the land to the farmers, collectivisation took it back. Whoever wants may leave the LPG with his fields."
 COLDWAR_DDR_dbd_a_republic_of_villages: "A Republic of Villages"
 COLDWAR_DDR_dbd_a_republic_of_villages_desc: "Bread, milk and meat from the republic's own fields: the farmers' state feeds itself and no longer depends on grain ships."
 COLDWAR_DDR_dbd_fields_and_stables_together: "Fields and Stables Together"
 COLDWAR_DDR_dbd_fields_and_stables_together_desc: "The planners want to split every village into a crop cooperative and a livestock cooperative. The farmers' government stops it: fields and stables stay together."
 COLDWAR_DDR_dbd_bread_from_our_own_fields: "Bread from Our Own Fields"
 COLDWAR_DDR_dbd_bread_from_our_own_fields_desc: "Every tonne of grain bought from Canada or the Soviet Union costs hard currency or loyalty. New fields, new silos, new seed."
 COLDWAR_DDR_dbd_meat_for_export: "The Farmers' Export Trade"
 COLDWAR_DDR_dbd_meat_for_export_desc: "Pork and beef go to West Berlin and the Soviet Union for hard currency; at home the queues at the butcher grow."
 COLDWAR_DDR_dbd_full_shops_at_home: "Full Shops at Home"
 COLDWAR_DDR_dbd_full_shops_at_home_desc: "Every pig stays in the republic: sausage on every table - and no hard currency in the till."
 COLDWAR_DDR_dbd_the_village_programme: "The Village Programme"
 COLDWAR_DDR_dbd_the_village_programme_desc: "Roads, schools, doctors and a culture house for every village: the young no longer have to leave for the cities."
 COLDWAR_DDR_dbd_the_fortschritt_combines: "The Fortschritt Combines"
 COLDWAR_DDR_dbd_the_fortschritt_combines_desc: "The combine harvesters from Singwitz and the tractors from Schönebeck go to the cooperatives first, not to export."
 COLDWAR_DDR_dbd_the_grain_contract: "The Grain Contract"
 COLDWAR_DDR_dbd_the_grain_contract_desc: "A long-term contract with the prairie farmers: grain at world prices, delivered every autumn, whatever the harvest at home."
 COLDWAR_DDR_tws_the_harich_platform: "The Harich Platform"
 COLDWAR_DDR_tws_the_harich_platform_desc: "In 1956 Wolfgang Harich wrote a programme for a special German road to socialism and got ten years in prison for it. Now he governs."
 COLDWAR_DDR_tws_rehabilitate_the_men_of_1956: "Rehabilitate the Men of 1956"
 COLDWAR_DDR_tws_rehabilitate_the_men_of_1956_desc: "Walter Janka, Gustav Just and the other comrades of Harich's circle are freed of their convictions and return to their posts."
 COLDWAR_DDR_tws_de_stalinise_the_party: "De-Stalinise the Party"
 COLDWAR_DDR_tws_de_stalinise_the_party_desc: "Khrushchev's secret speech was read in Berlin in 1956 and then filed away. The Third Way finishes it: no cult, no purges, no leader for life."
 COLDWAR_DDR_tws_the_yugoslav_lesson: "The Yugoslav Lesson"
 COLDWAR_DDR_tws_the_yugoslav_lesson_desc: "Belgrade has run its factories through workers' councils since 1950 and trades with both blocs while belonging to neither. The Third Way asks Tito's men to teach - and rewrites the economic line on their model."
 COLDWAR_DDR_tws_council_democracy: "Council Democracy"
 COLDWAR_DDR_tws_council_democracy_desc: "Power to the councils: every factory, district and university elects its council, and the councils elect the republic."
 COLDWAR_DDR_tws_parliamentary_socialism: "Parliamentary Socialism"
 COLDWAR_DDR_tws_parliamentary_socialism_desc: "Socialism by the ballot: several socialist parties compete in free elections, and the Volkskammer becomes a real parliament."
 COLDWAR_DDR_tws_councils_in_every_kombinat: "Councils in Every Kombinat"
 COLDWAR_DDR_tws_councils_in_every_kombinat_desc: "The general director answers to the elected council of his workers - Belgrade's model in Leuna and Eisenhüttenstadt."
 COLDWAR_DDR_tws_a_free_socialist_press: "A Free Socialist Press"
 COLDWAR_DDR_tws_a_free_socialist_press_desc: "Every party, union and university may publish its own paper. Socialism has to win the argument now."
 COLDWAR_DDR_tws_the_third_way: "The Third Way"
 COLDWAR_DDR_tws_the_third_way_desc: "Neither Stalin's state nor Bonn's market: a democratic, neutral socialism that trades with everyone and that the rest of Europe watches with astonishment."
 COLDWAR_DDR_tws_talks_with_the_social_democrats: "Talks with the Social Democrats"
 COLDWAR_DDR_tws_talks_with_the_social_democrats_desc: "Harich's plan of 1956 was a reunification negotiated with the SPD. The Third Way government sends its envoys to Bonn."
 COLDWAR_DDR_tws_the_austrian_solution: "The Austrian Solution"
 COLDWAR_DDR_tws_the_austrian_solution_desc: "Austria bought its freedom in 1955 with neutrality. Both German states leave their blocs, and the foreign armies go home."
 COLDWAR_DDR_tws_a_german_confederation: "The Neutral Confederation"
 COLDWAR_DDR_tws_a_german_confederation_desc: "Two states, one confederation: a joint council, free movement and a common market - each keeps its own social order."
 COLDWAR_DDR_tws_open_the_border: "Open the Border"
 COLDWAR_DDR_tws_open_the_border_desc: "A socialism that must wall in its people has already lost. The Third Way opens the crossings and bets that people will stay."
 COLDWAR_DDR_ldk_the_berlin_spring: "The Berlin Spring"
 COLDWAR_DDR_ldk_the_berlin_spring_desc: "Robert Havemann - antifascist, chemist, expelled from the party in 1964 for his lectures 'Dialectics without Dogma' - leads Prague's spring in Berlin, two years late."
 COLDWAR_DDR_ldk_end_censorship: "End Censorship"
 COLDWAR_DDR_ldk_end_censorship_desc: "The Press Office closes; every newspaper, Neues Deutschland included, prints what its editors decide."
 COLDWAR_DDR_ldk_biermann_sings_again: "Biermann Sings Again"
 COLDWAR_DDR_ldk_biermann_sings_again_desc: "Banned from every stage since 1965, Wolf Biermann plays the Friedrichstadt-Palast - live on television."
 COLDWAR_DDR_ldk_dissolve_the_stasi: "Dissolve the Ministry for State Security"
 COLDWAR_DDR_ldk_dissolve_the_stasi_desc: "Forty-three thousand officers go home, the files are opened, the informers lose their power."
 COLDWAR_DDR_ldk_the_stasi_under_control: "The Stasi Under Parliamentary Control"
 COLDWAR_DDR_ldk_the_stasi_under_control_desc: "The Ministry stays, but a Volkskammer committee reads its files, and decomposition is forbidden by law."
 COLDWAR_DDR_ldk_release_the_political_prisoners: "Release the Political Prisoners"
 COLDWAR_DDR_ldk_release_the_political_prisoners_desc: "Bautzen and Hohenschönhausen open their gates: dissidents and those jailed for trying to flee the republic walk free."
 COLDWAR_DDR_ldk_the_berlin_action_programme: "The Berlin Action Programme"
 COLDWAR_DDR_ldk_the_berlin_action_programme_desc: "Like Prague's Action Programme of April 1968: freedom of assembly, rehabilitations, economic reform - adopted by the Central Committee in one night."
 COLDWAR_DDR_ldk_reform_within_the_pact: "Reform Within the Pact"
 COLDWAR_DDR_ldk_reform_within_the_pact_desc: "Kádár's lesson from Budapest: reform at home, loyalty abroad, and never a word about leaving the Warsaw Pact."
 COLDWAR_DDR_ldk_full_democratisation: "Full Democratisation"
 COLDWAR_DDR_ldk_full_democratisation_desc: "Dubček's road to its end: several parties, free unions, a free press - and the risk of Soviet tanks on Unter den Linden."
 COLDWAR_DDR_ldk_the_kadar_compromise: "The Kádár Compromise"
 COLDWAR_DDR_ldk_the_kadar_compromise_desc: "A pledge to Brezhnev: the republic stays in the Pact and in Comecon, and Moscow tolerates what happens inside it."
 COLDWAR_DDR_ldk_free_elections_to_the_volkskammer: "Free Elections to the Volkskammer"
 COLDWAR_DDR_ldk_free_elections_to_the_volkskammer_desc: "For the first time since 1946 the people choose between parties, not between yes and no to a single list."
 COLDWAR_DDR_ldk_the_people_defend_the_spring: "The People Defend the Spring"
 COLDWAR_DDR_ldk_the_people_defend_the_spring_desc: "The factory combat groups swear to defend the reforms, and Belgrade and Bucharest - who condemned the invasion of 1968 - are asked to stand by Berlin."
 COLDWAR_DDR_ldk_free_trade_unions: "Unions Without the Party"
 COLDWAR_DDR_ldk_free_trade_unions_desc: "The FDGB elects its own leaders and may strike - free unions in the East, ten years before Gdańsk."
 COLDWAR_DDR_ldk_the_new_economic_mechanism: "The New Economic Mechanism"
 COLDWAR_DDR_ldk_the_new_economic_mechanism_desc: "Prague's Ota Šik and Budapest's reformers agree on one thing: the enterprise, not the ministry, must decide. The League writes self-management into the economic line - prices that tell the truth, profit as the measure."
 COLDWAR_DDR_ldk_workers_councils: "Workers' Councils"
 COLDWAR_DDR_ldk_workers_councils_desc: "Every enterprise elects a workers' council that hires the director and divides the profit - Havemann's 'socialism with freedom' in the factory."
 COLDWAR_DDR_ldk_goulash_socialism: "Goulash Socialism"
 COLDWAR_DDR_ldk_goulash_socialism_desc: "Hungarian style: more consumer goods, private plots and small shops, a refrigerator in every flat - and nobody asks about politics."
 COLDWAR_DDR_ldk_the_self_managed_republic: "The Self-Managed Republic"
 COLDWAR_DDR_ldk_the_self_managed_republic_desc: "Ten years after the Berlin Spring the enterprises belong to those who work in them, and the plan is a contract between free producers - the socialism Havemann lectured about in 1963."
 COLDWAR_DDR_tg_the_veterans_of_spain: "The Veterans of Spain"
 COLDWAR_DDR_tg_the_veterans_of_spain_desc: "Alfred Neumann fought in the International Brigades. With the old KPD men and the Spain veterans he takes the state back from the managers and the consumers."
 COLDWAR_DDR_tg_purge_the_revisionists: "Purge the Revisionists"
 COLDWAR_DDR_tg_purge_the_revisionists_desc: "Every party member who praised Prague, the market or Western television is called before the control commission."
 COLDWAR_DDR_tg_moscows_hard_line: "Moscow's Hard Line"
 COLDWAR_DDR_tg_moscows_hard_line_desc: "Back to the fold: every instruction from the Soviet embassy is obeyed, every Soviet adviser welcome - and Soviet oil flows at friendship prices. Moscow likes what it sees."
 COLDWAR_DDR_tg_our_own_hard_line: "Our Own Hard Line"
 COLDWAR_DDR_tg_our_own_hard_line_desc: "Bucharest and Tirana show the way: a hard line needs no master - and Brezhnev's détente is revisionism too."
 COLDWAR_DDR_tg_soviet_advisers_welcome: "Soviet Advisers Welcome"
 COLDWAR_DDR_tg_soviet_advisers_welcome_desc: "A Soviet adviser in every ministry and every Kombinat, as in 1950 - the Guard asks for them."
 COLDWAR_DDR_tg_rely_on_our_own_strength: "Rely on Our Own Strength"
 COLDWAR_DDR_tg_rely_on_our_own_strength_desc: "No Western machines and no Soviet favours: the republic builds its own plants with its own hands, whatever the shops lack."
 COLDWAR_DDR_tg_no_western_credits: "No Western Credits"
 COLDWAR_DDR_tg_no_western_credits_desc: "Not one Deutschmark of debt: what the republic cannot pay for, it does without. The Guard's economic line is the one of 1950 - heavy industry, sacrifice and no masters."
 COLDWAR_DDR_tg_collectivise_the_last_craftsmen: "Collectivise the Last Craftsmen"
 COLDWAR_DDR_tg_collectivise_the_last_craftsmen_desc: "The private bakers, tailors and carpenters who survived 1972 join the cooperatives - or close their doors. Their workshops and their savings go to the state."
 COLDWAR_DDR_tg_heavy_industry_first: "Heavy Industry First"
 COLDWAR_DDR_tg_heavy_industry_first_desc: "Steel from Eisenhüttenstadt, machines from Magdeburg: the 'first socialist city' sets the pace again, as in 1952 - and the consumers wait, as in 1952."
 COLDWAR_DDR_tg_the_fortress_of_socialism: "The Fortress of Socialism"
 COLDWAR_DDR_tg_the_fortress_of_socialism_desc: "Closed, armed and pure: the republic as the fortress of the working class on the front line of the Cold War."
 COLDWAR_DDR_tg_ernst_thalmann_lives: "Ernst Thälmann Lives"
 COLDWAR_DDR_tg_ernst_thalmann_lives_desc: "Statues, films and pioneer oaths: the KPD leader murdered in Buchenwald in 1944 becomes the patron saint of the republic."
 COLDWAR_DDR_tg_every_citizen_a_soldier: "Every Citizen a Soldier"
 COLDWAR_DDR_tg_every_citizen_a_soldier_desc: "Combat groups in every factory, pre-military training in every school, the reserves called up every year."
 COLDWAR_DDR_tg_every_citizen_a_worker: "Every Citizen a Worker"
 COLDWAR_DDR_tg_every_citizen_a_worker_desc: "Voluntary Saturday shifts, the National Reconstruction Programme, brigades of socialist labour - sweat instead of credits."
 COLDWAR_DDR_ssp_the_minister_rules: "The Minister Rules"
 COLDWAR_DDR_ssp_the_minister_rules_desc: "Erich Mielke, Minister for State Security since 1957, no longer protects the party - he replaces it. Forty-three thousand officers are now the government."
 COLDWAR_DDR_ssp_decomposition_everywhere: "Decomposition Everywhere"
 COLDWAR_DDR_ssp_decomposition_everywhere_desc: "No arrests, no martyrs: careers broken, marriages poisoned, rumours planted - the quiet method of Directive 1/76, years early - carried out by unofficial collaborators in every brigade, every house community and every parish council."
 COLDWAR_DDR_ssp_silent_repression: "Silent Repression"
 COLDWAR_DDR_ssp_silent_repression_desc: "The method of the 1970s: sign Helsinki, smile at the West - and decompose the enemies of the state in silence. The Ministry's own law college at Potsdam-Eiche trains its officers in 'operative psychology'."
 COLDWAR_DDR_ssp_open_terror: "Open Terror"
 COLDWAR_DDR_ssp_open_terror_desc: "The method of 1950: show trials, death sentences, mass arrests. Fear works faster than decomposition - and the whole world watches."
 COLDWAR_DDR_ssp_the_show_trials: "The Show Trials"
 COLDWAR_DDR_ssp_the_show_trials_desc: "Former Politburo members confess on television to spying for Bonn. Nobody believes it, and everybody understands it."
 COLDWAR_DDR_ssp_the_total_surveillance_state: "The Total Surveillance State"
 COLDWAR_DDR_ssp_the_total_surveillance_state_desc: "A file on every citizen, a microphone in every office, a smell sample in every jar: the state knows everything about everyone."
 COLDWAR_DDR_ssp_the_dzerzhinsky_guards_regiment: "The Guards Regiment Takes Berlin"
 COLDWAR_DDR_ssp_the_dzerzhinsky_guards_regiment_desc: "The Ministry's own army, quartered in Berlin-Adlershof, guards the government quarter - and now the Minister's state."
 COLDWAR_DDR_ssp_the_party_as_a_facade: "The Party as a Façade"
 COLDWAR_DDR_ssp_the_party_as_a_facade_desc: "The SED keeps its congresses, its banners and its First Secretary - all of them reporting to the Ministry."
 COLDWAR_DDR_ssp_the_party_abolished: "The Party Abolished"
 COLDWAR_DDR_ssp_the_party_abolished_desc: "Two million party members are no longer needed: the apparatus is dissolved and its files move to the Ministry's archive."
 COLDWAR_DDR_ssp_main_directorate_a: "Main Directorate A"
 COLDWAR_DDR_ssp_main_directorate_a_desc: "Markus Wolf's foreign intelligence - the 'man without a face' - runs agents in Bonn, at NATO and in every West German party."
 COLDWAR_DDR_ssp_the_science_and_technology_sector: "The Science and Technology Sector"
 COLDWAR_DDR_ssp_the_science_and_technology_sector_desc: "The foreign intelligence's science sector steals what the COCOM lists will not sell: computer circuits, machine tools, chemical formulas."
 COLDWAR_DDR_ssp_a_spy_in_the_chancellery: "A Spy in the Chancellery"
 COLDWAR_DDR_ssp_a_spy_in_the_chancellery_desc: "Günter Guillaume, an officer of Main Directorate A, works in the Chancellor's office in Bonn. Every paper on Ostpolitik crosses Mielke's desk."
 COLDWAR_DDR_ssp_the_chekist_economy: "The Chekist Economy"
 COLDWAR_DDR_ssp_the_chekist_economy_desc: "The Ministry already owns firms, guest houses and Schalck's trading empire; its prisons make furniture, tights and camera parts for Western mail-order houses. Mielke makes it the economic line: every enterprise has an officer, every officer a quota."
 COLDWAR_DDR_ssp_prisoners_for_d_marks: "Prisoners for D-Marks"
 COLDWAR_DDR_ssp_prisoners_for_d_marks_desc: "Bonn pays forty thousand marks a head for political prisoners, IKEA and Quelle buy what Bautzen and Hoheneck produce. The Ministry sells its prisoners twice - their labour and their freedom."
 COLDWAR_DDR_ssp_total_control: "Total Control"
 COLDWAR_DDR_ssp_total_control_desc: "No deals with the class enemy: every prisoner stays, every enterprise gets an MfS liaison officer, and every delivery gap is investigated as sabotage."
 COLDWAR_DDR_ssp_the_ministrys_kombinat: "The Ministry's Kombinat"
 COLDWAR_DDR_ssp_the_ministrys_kombinat_desc: "The Ministry for State Security becomes the republic's largest enterprise: construction firms, workshops, trading houses and a headquarters in Normannenstraße that grows by a block every year."
 COLDWAR_DDR_ulb_the_architect_of_the_republic: "The Architect of the Republic"
 COLDWAR_DDR_ulb_the_architect_of_the_republic_desc: "Walter Ulbricht has led the party since 1950 and the state since 1960. At seventy-six he still writes the economic theses himself - and still believes the republic can overtake West Germany."
 COLDWAR_DDR_ulb_honecker_keeps_the_apparatus: "Honecker Keeps the Apparatus"
 COLDWAR_DDR_ulb_honecker_keeps_the_apparatus_desc: "Erich Honecker, secretary for security and cadres since 1958, remains the party's second man. Moscow approves, the apparatus runs smoothly - and Ulbricht's pupil gains a little more of it every month, while the reform economists lose their patron."
 COLDWAR_DDR_ulb_verner_takes_the_cadres: "Verner Takes the Cadres"
 COLDWAR_DDR_ulb_verner_takes_the_cadres_desc: "Alt-history: Ulbricht moves the cadre department from Honecker to Paul Verner, the Berlin district chief who owes him his career. The crown prince loses his network overnight, the apparatus answers to the founder rather than to Karlshorst - and the Soviet embassy takes note."
 COLDWAR_DDR_ulb_the_strategic_working_group: "The Strategic Working Group"
 COLDWAR_DDR_ulb_the_strategic_working_group_desc: "Ulbricht's own think tank in the Politburo: Günter Mittag, the economist Wolfgang Berger and the young planners write the theses, and the apparatus is told afterwards."
 COLDWAR_DDR_ulb_the_socialist_community_of_man: "The Socialist Community of Man"
 COLDWAR_DDR_ulb_the_socialist_community_of_man_desc: "Ulbricht's formula of 1967: the classes are no longer enemies; workers, farmers, the intelligentsia and even the churchgoers form one community under the party. Since the Bitterfeld conferences writers go into the factories and workers write - 'Pick up the pen, mate!'"
 COLDWAR_DDR_ulb_the_polytechnic_generation: "The Polytechnic Generation"
 COLDWAR_DDR_ulb_the_polytechnic_generation_desc: "The 1965 law on the unified socialist education system: ten years of polytechnic school for every child, one day a week in a factory. Its first full generation enters the workforce in 1970 - skilled workers, not slogans."
 COLDWAR_DDR_ulb_the_x_world_festival: "The X World Festival"
 COLDWAR_DDR_ulb_the_x_world_festival_desc: "Summer 1973: 25,000 guests from 140 countries and eight million visitors turn East Berlin into a 'Red Woodstock'. For nine days the republic looks young, open and confident - and the solidarity with Vietnam and Chile is real."
 COLDWAR_DDR_ulb_the_economic_system_of_socialism: "The Economic System of Socialism"
 COLDWAR_DDR_ulb_the_economic_system_of_socialism_desc: "The New Economic System of 1963 grown up (ÖSS, 1967-70): the Kombinate become accounting units, prices and profit become levers, and science is declared a direct productive force - the Academy reform of 1968 ties the institutes to the plan."
 COLDWAR_DDR_ulb_profit_as_the_lever: "Profit as the Lever"
 COLDWAR_DDR_ulb_profit_as_the_lever_desc: "Alt-history: Ulbricht deepens the reform instead of the prestige list. Enterprises keep part of their profit and set part of their prices; the Kombinat directors become managers. Moscow and the apparatus smell market socialism."
 COLDWAR_DDR_ulb_the_structure_determining_tasks: "The Structure-Determining Tasks"
 COLDWAR_DDR_ulb_the_structure_determining_tasks_desc: "1968-70: petrochemistry at Schwedt and Leuna II, electronics, machine tools and automation get every brick and every Mark first - the hard winter of 1969/70 empties the shops."
 COLDWAR_DDR_ulb_cybernetics_and_the_plan: "Cybernetics and the Plan"
 COLDWAR_DDR_ulb_cybernetics_and_the_plan_desc: "Georg Klaus's cybernetics and the new Robotron combine promise a plan that calculates itself. Ulbricht orders an automated control system for the whole economy by 1975 - and computing centres for the Planning Commission."
 COLDWAR_DDR_ulb_hold_the_investment_course: "Hold the Investment Course"
 COLDWAR_DDR_ulb_hold_the_investment_course_desc: "December 1970: the supply crisis is the talk of the Politburo, but Ulbricht refuses to cut the prestige projects. Growth now, the shops later."
 COLDWAR_DDR_ulb_emergency_imports: "Emergency Imports"
 COLDWAR_DDR_ulb_emergency_imports_desc: "Winter 1970/71: butter, meat and coal are bought in the West on credit to calm the shops. The reformers' numbers look worse, the queues get shorter."
 COLDWAR_DDR_ulb_the_kombinat_as_economic_unit: "The Kombinat as an Economic Unit"
 COLDWAR_DDR_ulb_the_kombinat_as_economic_unit_desc: "The reform's end state: the Kombinate trade with each other by economic contract, not by order from above, and keep a share of what they earn for their own investment."
 COLDWAR_DDR_ulb_erfurt_on_our_terms: "Erfurt on Our Terms"
 COLDWAR_DDR_ulb_erfurt_on_our_terms_desc: "19 March 1970: Willy Brandt comes to Erfurt. Ulbricht sends Stoph with one demand - recognition under international law - while the crowd outside the Erfurter Hof chants 'Willy, Willy' - until the MfS fills the square with its own people."
 COLDWAR_DDR_ulb_kassel_recognition_first: "After Kassel: Recognition First"
 COLDWAR_DDR_ulb_kassel_recognition_first_desc: "21 May 1970: in Kassel Brandt offers twenty points for regulated coexistence. Stoph answers with one - recognition first. Ulbricht's republic negotiates as a sovereign state or not at all."
 COLDWAR_DDR_ulb_we_are_not_belorussia: "We Are Not Belorussia"
 COLDWAR_DDR_ulb_we_are_not_belorussia_desc: "Summer 1970, before Brezhnev: 'We are not Belorussia, we are not a Soviet republic.' Ulbricht lectures the Kremlin on economics and keeps his own channel to Bonn for credits, licences and trade."
 COLDWAR_DDR_ulb_bow_to_the_kremlin: "Bow to the Kremlin"
 COLDWAR_DDR_ulb_bow_to_the_kremlin_desc: "Ulbricht swallows his pride: the German policy is coordinated with Moscow line by line, the economic theses go to Gosplan before they go to the Central Committee - and the Soviet oil keeps flowing."
 COLDWAR_DDR_ulb_the_old_man_stays: "The Old Man Stays"
 COLDWAR_DDR_ulb_the_old_man_stays_desc: "Alt-history: 21 January 1971 - thirteen Politburo members have asked Brezhnev, behind Ulbricht's back, to let the old man go. Ulbricht refuses. He convenes the Central Committee himself, invokes forty years at the head of the party and dares Brezhnev to depose the founder of the republic."
 COLDWAR_DDR_ulb_a_dignified_retirement: "A Dignified Retirement"
 COLDWAR_DDR_ulb_a_dignified_retirement_desc: "3 May 1971, after the letter of the thirteen: 'for reasons of age'. Ulbricht hands over the party and keeps the chair of the State Council - the founder leaves with ceremony, not in disgrace. His reformers lose their patron."
 COLDWAR_DDR_ulb_the_kremlin_doctors: "The Kremlin Doctors"
 COLDWAR_DDR_ulb_the_kremlin_doctors_desc: "Alt-history: Professor Chazov's specialists from Moscow and the government hospital in Berlin-Buch keep the old man at his desk - at the price of half-days and a fortune in Western medicine."
 COLDWAR_DDR_ulb_the_founders_succession: "The Founder's Succession"
 COLDWAR_DDR_ulb_the_founders_succession_desc: "Whoever follows Ulbricht inherits a republic built in his image. The old man wants to name the heir himself - before Moscow names one for him - and to hand over a party in good order."
 COLDWAR_DDR_ulb_heir_honecker: "Ulbricht Names Honecker"
 COLDWAR_DDR_ulb_heir_honecker_desc: "The pupil inherits the master's chair: Moscow's favourite and the party's organiser, who promises the people more today."
 COLDWAR_DDR_ulb_heir_stoph: "Ulbricht Names Stoph"
 COLDWAR_DDR_ulb_heir_stoph_desc: "The premier of Erfurt and Kassel: the state administration over the party apparatus."
 COLDWAR_DDR_ulb_heir_lamberz: "Ulbricht Names Lamberz"
 COLDWAR_DDR_ulb_heir_lamberz_desc: "Alt-history: the youngest star of the Politburo, forty-one, the only leader the young like - the old guard is appalled."
 COLDWAR_DDR_ulb_heir_mittag: "Ulbricht Names Mittag"
 COLDWAR_DDR_ulb_heir_mittag_desc: "Alt-history: the architect of the reform inherits it - a technocrat at the head of the party."
 COLDWAR_DDR_ulb_the_developed_social_system_of_socialism: "The Developed Social System of Socialism"
 COLDWAR_DDR_ulb_the_developed_social_system_of_socialism_desc: "Ulbricht's grand theory: socialism is no brief transition but a social formation of its own, planned by science and carried by a community - a system that needs no lessons from Moscow."
 COLDWAR_DDR_hon_the_roofer_from_the_saar: "The Roofer from the Saar"
 COLDWAR_DDR_hon_the_roofer_from_the_saar_desc: "Erich Honecker: born 1912 in Wiebelskirchen, roofer, Communist youth leader, ten years in Nazi prisons, organiser of the 13th of August. Moscow's choice - and a man who wants the people content."
 COLDWAR_DDR_hon_mittag_runs_the_economy: "Mittag Runs the Economy"
 COLDWAR_DDR_hon_mittag_runs_the_economy_desc: "Günter Mittag keeps - or regains - the economic secretariat: a brilliant, feared technocrat who will make the numbers fit whatever the General Secretary promises, and who squeezes the works councils to do it."
 COLDWAR_DDR_hon_krolikowskis_secretariat: "Krolikowski's Secretariat"
 COLDWAR_DDR_hon_krolikowskis_secretariat_desc: "Werner Krolikowski, the Dresden district chief, takes the economic secretariat (as from 1973 to 1976) - coordinates every plan figure with Gosplan - Soviet oil and Soviet licences are secured - and reports every number to the Soviet embassy on Unter den Linden. The general directors distrust him."
 COLDWAR_DDR_hon_schurers_honest_plan: "Schürer's Honest Plan"
 COLDWAR_DDR_hon_schurers_honest_plan_desc: "Alt-history: Gerhard Schürer, chairman of the State Planning Commission, also gets the economic secretariat - and insists that the plan show what the republic can really afford. The padding goes; so do a few promises."
 COLDWAR_DDR_hon_unity_of_economic_and_social_policy: "The Unity of Economic and Social Policy"
 COLDWAR_DDR_hon_unity_of_economic_and_social_policy_desc: "June 1971, VIII Party Congress: the 'main task' is to raise the material and cultural standard of living of the people. Every gain in production is paid out at once in rents, pensions, wages, the baby year and goods - the investment race of the Ulbricht years ends, and the import bill starts to grow."
 COLDWAR_DDR_hon_jeans_for_the_republic: "Jeans for the Republic"
 COLDWAR_DDR_hon_jeans_for_the_republic_desc: "The state buys 800,000 pairs of Levi's in the West and they sell out within days. Western goods in Eastern shops calm the young - and drain the hard-currency reserves."
 COLDWAR_DDR_hon_western_credit_lines: "Western Credit Lines"
 COLDWAR_DDR_hon_western_credit_lines_desc: "1972-80: the social programme is paid with Western credit - the hard-currency debt rises from 2 to 25 billion valuta marks. The shops are full, the interest bill grows, and Moscow watches the republic drift into the world market."
 COLDWAR_DDR_hon_pay_from_the_plan: "Pay from the Plan"
 COLDWAR_DDR_hon_pay_from_the_plan_desc: "Alt-history: Schürer's advice is taken in 1972 - the social programme is paid by cutting industrial investment, not by borrowing. Fewer new factories, more new flats, and no debt to the bankers of Frankfurt."
 COLDWAR_DDR_hon_solve_the_housing_question: "Solve the Housing Question by 1990"
 COLDWAR_DDR_hon_solve_the_housing_question_desc: "October 1973: 'to solve the housing question as a social problem by 1990'. Three million flats are to be built or modernised - prefabricated estates from Marzahn to Halle-Neustadt, the WBS 70 slab."
 COLDWAR_DDR_hon_consumer_socialism: "Keep the Subsidies"
 COLDWAR_DDR_hon_consumer_socialism_desc: "The second oil shock and Western interest rates strike in 1979-80, but the subsidies stay: bread at 1950s prices, frozen rents, coffee bought for hard currency. The new credits pay for the old ones."
 COLDWAR_DDR_hon_the_austerity_plenum: "The Austerity Plenum"
 COLDWAR_DDR_hon_the_austerity_plenum_desc: "Alt-history: Honecker listens to Schürer's warning. Subsidies for luxury goods are cut, imports frozen, and the party tells the people the truth: the republic lives beyond its means."
 COLDWAR_DDR_hon_the_main_task_fulfilled: "The Main Task Fulfilled"
 COLDWAR_DDR_hon_the_main_task_fulfilled_desc: "April 1986, XI Party Congress: the housing programme is on schedule, the birth rate is up, full employment holds. Honecker declares the main task a success - and promises more of the same."
 COLDWAR_DDR_hon_demarcation: "Demarcation"
 COLDWAR_DDR_hon_demarcation_desc: "From 1971 the answer to Brandt's Ostpolitik is Abgrenzung: contacts with Westerners are reported, Western television is frowned upon, and in 1974 the constitution deletes the 'German nation' - the GDR is a socialist nation of its own, while millions still feel simply German."
 COLDWAR_DDR_hon_the_gera_demands: "The Gera Demands"
 COLDWAR_DDR_hon_the_gera_demands_desc: "13 October 1980, Gera: Honecker demands that Bonn recognise GDR citizenship and fix the Elbe border in mid-river. Days before, the minimum exchange for Western visitors was doubled to 25 DM - hard currency in, relatives out."
 COLDWAR_DDR_hon_the_billion_from_bavaria: "The Billion from Bavaria"
 COLDWAR_DDR_hon_the_billion_from_bavaria_desc: "1983: the republic is close to insolvency. Schalck-Golodkowski and Franz Josef Strauss, the arch-anticommunist, arrange a one-billion-DM bank credit guaranteed by Bonn. The border mines begin to disappear."
 COLDWAR_DDR_hon_the_bonn_visit: "The Bonn Visit"
 COLDWAR_DDR_hon_the_bonn_visit_desc: "September 1987: Honecker in Bonn - his flag next to the black-red-gold, the anthem, a guard of honour, then a visit to his home town in the Saarland. Recognition in all but name."
 COLDWAR_DDR_hon_socialism_in_the_colours_of_the_gdr: "Socialism in the Colours of the GDR"
 COLDWAR_DDR_hon_socialism_in_the_colours_of_the_gdr_desc: "December 1988: Honecker answers perestroika with 'socialism in the colours of the GDR'. The Soviet digest Sputnik is banned, Soviet films are pulled - the pupil now lectures Moscow and prepares for a winter without Soviet help."
 COLDWAR_DDR_hon_learning_from_the_soviet_union: "Learning from the Soviet Union"
 COLDWAR_DDR_hon_learning_from_the_soviet_union_desc: "Alt-history: 'To learn from the Soviet Union is to learn victory' - Honecker takes the old slogan at its word, allows openness in the press, lets Sputnik be read and copies the Soviet law on state enterprises."
 COLDWAR_DDR_hon_after_honecker: "After Honecker"
 COLDWAR_DDR_hon_after_honecker_desc: "The General Secretary is old, ill and convinced he is indispensable. Behind him Krenz, Stoph and Mittag wait - each with his own friends in Moscow. Honecker wants his heir to keep the social programme."
 COLDWAR_DDR_hon_heir_krenz: "Honecker Names Krenz"
 COLDWAR_DDR_hon_heir_krenz_desc: "The FDJ chief and security secretary, born 1937: the crown prince of the second generation."
 COLDWAR_DDR_hon_heir_stoph: "Honecker Names Stoph"
 COLDWAR_DDR_hon_heir_stoph_desc: "The old premier, who has reported to Moscow behind Honecker's back for years, as a caretaker."
 COLDWAR_DDR_hon_heir_mittag: "Honecker Names Mittag"
 COLDWAR_DDR_hon_heir_mittag_desc: "Alt-history: Honecker's closest ally, the economic czar, inherits the party - and its debts."
 COLDWAR_DDR_hon_no_taboos: "The Plenzdorf Season"
 COLDWAR_DDR_hon_no_taboos_desc: "December 1971: 'If one starts from the firm position of socialism, there can be no taboos in art and literature.' Plenzdorf's 'New Sorrows of Young W.' fills the theatres, and the churches breathe a little easier."
 COLDWAR_DDR_hon_the_palace_of_the_republic: "The Palace of the Republic"
 COLDWAR_DDR_hon_the_palace_of_the_republic_desc: "April 1976: on the site of the Hohenzollern palace rises the Palace of the Republic - parliament, theatre, bowling alley and a thousand lamps. Berliners call it 'Erich's lamp shop'."
 COLDWAR_DDR_hon_expatriate_biermann: "Expatriate Biermann"
 COLDWAR_DDR_hon_expatriate_biermann_desc: "16 November 1976: after a concert in Cologne the singer Wolf Biermann is stripped of his citizenship. A hundred artists protest; many follow him west. The thaw is over."
 COLDWAR_DDR_hon_let_biermann_return: "Let Biermann Return"
 COLDWAR_DDR_hon_let_biermann_return_desc: "Alt-history: the Politburo lets the troublesome singer come home from Cologne. The artists stay, the churches and the young are reassured, the West German press is baffled - and the Stasi fumes."
 COLDWAR_DDR_hon_the_sixth_of_march: "The Sixth of March"
 COLDWAR_DDR_hon_the_sixth_of_march_desc: "6 March 1978: Honecker receives Bishop Schönherr. The church gets broadcasting time, new church buildings and access to prisons; the state gets a church that works 'in socialism' rather than against it."
 COLDWAR_DDR_hon_the_shield_grows: "The Shield Grows"
 COLDWAR_DDR_hon_the_shield_grows_desc: "Under Honecker the Ministry for State Security doubles to 91,000 officers and some 170,000 informers. Directive 1/76 replaces open terror with quiet Zersetzung - and the bill for it grows every year."
 COLDWAR_DDR_hon_really_existing_socialism: "Really Existing Socialism"
 COLDWAR_DDR_hon_really_existing_socialism_desc: "The republic at forty: new housing estates, full employment, cheap bread, more Olympic medals than the Americans in Seoul - and a hard-currency debt the Planning Commission no longer dares to print. Honecker's socialism exists, really."
 COLDWAR_DDR_sto_the_man_from_erfurt: "The Man from Erfurt"
 COLDWAR_DDR_sto_the_man_from_erfurt_desc: "Willi Stoph: bricklayer, Wehrmacht artilleryman, first Minister of National Defence, Chairman of the Council of Ministers - the man who shook Brandt's hand in Erfurt now leads the party."
 COLDWAR_DDR_sto_premier_sindermann: "Premier Sindermann"
 COLDWAR_DDR_sto_premier_sindermann_desc: "Horst Sindermann, the Halle district chief who built Halle-Neustadt, takes over the Council of Ministers (as he did in 1973): a calm administrator with a soft spot for housing and social policy - and little patience for the Kombinat barons."
 COLDWAR_DDR_sto_premier_schurer: "Premier Schürer"
 COLDWAR_DDR_sto_premier_schurer_desc: "Alt-history: Gerhard Schürer leaves the Planning Commission for the premiership. The government is run like a balance sheet - and the balance sheet is honest, even when the news is bad."
 COLDWAR_DDR_sto_both_chairs: "Both Chairs"
 COLDWAR_DDR_sto_both_chairs_desc: "Alt-history: Stoph keeps the Council of Ministers for himself. Party and government meet in one office - and in one overworked man; the Central Committee secretaries lose their posts in the ministries."
 COLDWAR_DDR_sto_government_before_party: "Government Before Party"
 COLDWAR_DDR_sto_government_before_party_desc: "The Council of Ministers takes back what the Politburo apparatus took: ministers decide, the Central Committee departments advise, and the plan is run by the state. Stoph has waited twenty years for this."
 COLDWAR_DDR_sto_the_industrial_ministries: "The Industrial Ministries"
 COLDWAR_DDR_sto_the_industrial_ministries_desc: "The branch ministries give orders to every Kombinat: one ministry for chemistry, one for electrical engineering, one for coal. Order and capacity - and a bureaucracy that grows with every new department."
 COLDWAR_DDR_sto_the_price_reform: "The Price Reform"
 COLDWAR_DDR_sto_the_price_reform_desc: "The industrial price reform of 1964-67 is carried on to consumer prices: goods are recalculated from real costs, subsidies stay only for bread and rents - the factories finally see what their goods cost, and the people see it too."
 COLDWAR_DDR_sto_administrative_rationalisation: "Administrative Rationalisation"
 COLDWAR_DDR_sto_administrative_rationalisation_desc: "Fewer forms, computing centres in every ministry, ESER mainframes for the State Planning Commission: Stoph cuts the state apparatus by a tenth and makes the rest count."
 COLDWAR_DDR_sto_inner_german_trade_first: "Inner-German Trade First"
 COLDWAR_DDR_sto_inner_german_trade_first_desc: "The plan is tied to deliveries from West Germany: steel, machines and chemicals bought on the interest-free swing of inner-German trade, paid back in goods. Moscow asks why the Five-Year Plan reads like a West German order book."
 COLDWAR_DDR_sto_plan_coordination_with_gosplan: "Plan Coordination with Gosplan"
 COLDWAR_DDR_sto_plan_coordination_with_gosplan_desc: "From 1971 the Five-Year Plans are coordinated line by line with Moscow under the Comecon Comprehensive Programme: secure oil and gas for twenty years, Soviet science - and less room for the general directors."
 COLDWAR_DDR_sto_the_government_plans: "The Government Plans"
 COLDWAR_DDR_sto_the_government_plans_desc: "The Council of Ministers' own Five-Year Plan: drawn up by the ministries, checked by the Planning Commission, approved by the Volkskammer - and only then shown to the Politburo."
 COLDWAR_DDR_sto_the_erfurt_channel: "The Erfurt Channel"
 COLDWAR_DDR_sto_the_erfurt_channel_desc: "Stoph and Brandt met in Erfurt and Kassel in 1970. As First Secretary, Stoph keeps the personal line to Bonn open and writes to the Chancellor as one head of government to another - correct, cool, always with the full title of the German Democratic Republic."
 COLDWAR_DDR_sto_two_states_good_neighbours: "Two States, Good Neighbours"
 COLDWAR_DDR_sto_two_states_good_neighbours_desc: "Alt-history: Stoph offers neighbourly relations without demarcation - travel relief, town twinning, joint work against the poisoned Elbe - as one sovereign state to another. Inner-German trade booms; Moscow frowns."
 COLDWAR_DDR_sto_demarcation_by_treaty: "Demarcation by Treaty"
 COLDWAR_DDR_sto_demarcation_by_treaty_desc: "Stoph's other answer: every contact codified, every border post fixed by treaty, every Western visitor counted. Coexistence on paper, separation in practice - and the churches lose their West German partners."
 COLDWAR_DDR_sto_the_first_defence_minister: "The First Defence Minister"
 COLDWAR_DDR_sto_the_first_defence_minister_desc: "Stoph built the National People's Army in 1956 and still holds the rank of Army General. The officers know him - and he knows what they cost."
 COLDWAR_DDR_sto_the_national_defence_council: "The National Defence Council"
 COLDWAR_DDR_sto_the_national_defence_council_desc: "As First Secretary Stoph chairs the National Defence Council, the republic's secret war cabinet, and rebuilds it around the ministries: mobilisation plans for every district, paid from the civilian budget."
 COLDWAR_DDR_sto_the_defence_budget_audit: "The Defence Budget Audit"
 COLDWAR_DDR_sto_the_defence_budget_audit_desc: "The administrator turns on his old ministry: the army's budget is audited line by line, and the savings go to the Council of Ministers' investment fund."
 COLDWAR_DDR_sto_a_state_like_any_other: "A State Like Any Other"
 COLDWAR_DDR_sto_a_state_like_any_other_desc: "Stoph's republic: governed by ministries, administered by experts, recognised by its neighbours - a state like any other, not merely the party's instrument. The party notices that it has become less important."
 COLDWAR_DDR_sto_after_the_premier: "After the Premier"
 COLDWAR_DDR_sto_after_the_premier_desc: "Stoph was born in 1914. His heir should be a man of the state, not of the apparatus - and the ministries should keep running while the Central Committee decides."
 COLDWAR_DDR_sto_heir_mittag: "Stoph Names Mittag"
 COLDWAR_DDR_sto_heir_mittag_desc: "The economic manager of the Council of Ministers' years takes the party."
 COLDWAR_DDR_sto_heir_modrow: "Stoph Names Modrow"
 COLDWAR_DDR_sto_heir_modrow_desc: "Alt-history: the modest district secretary of Dresden - an administrator like Stoph, and a careful reformer."
 COLDWAR_DDR_sto_heir_krolikowski: "Stoph Names Krolikowski"
 COLDWAR_DDR_sto_heir_krolikowski_desc: "Stoph's ally in the Politburo and Moscow's informant: the Kremlin will approve, and the oil will keep flowing."
 COLDWAR_DDR_mit_the_master_of_the_balance_sheet: "The Master of the Balance Sheet"
 COLDWAR_DDR_mit_the_master_of_the_balance_sheet_desc: "Günter Mittag: co-author of the New Economic System, secretary for the economy, the most feared man in the Politburo's corridors. Now he answers to nobody but the balance sheet."
 COLDWAR_DDR_mit_schurer_keeps_the_plan: "Schürer Keeps the Plan"
 COLDWAR_DDR_mit_schurer_keeps_the_plan_desc: "Gerhard Schürer stays at the State Planning Commission - the one man who dares to put the real debt figures on Mittag's desk. The general directors hate his honest balance."
 COLDWAR_DDR_mit_schalcks_empire: "Schalck's Empire"
 COLDWAR_DDR_mit_schalcks_empire_desc: "Alexander Schalck-Golodkowski's Commercial Coordination answers to Mittag directly: arms, art, blood plasma and prisoners for hard currency, no questions asked - and no receipts."
 COLDWAR_DDR_mit_the_zeiss_model: "The Zeiss Model"
 COLDWAR_DDR_mit_the_zeiss_model_desc: "Wolfgang Biermann runs Carl Zeiss Jena like a feudal estate and delivers every plan. Mittag makes him the model for all general directors - results first, workers' councils last."
 COLDWAR_DDR_mit_key_technologies: "Key Technologies"
 COLDWAR_DDR_mit_key_technologies_desc: "Mittag turns Ulbricht's prestige race into a short list: microelectronics, robotics, computer-aided design, biotechnology. Everything else waits - including the shops."
 COLDWAR_DDR_mit_intensification: "Intensification"
 COLDWAR_DDR_mit_intensification_desc: "'Comprehensive intensification' after the Soviet oil cut of 1981: more output from the same machines, the same energy and the same people. Every Kombinat must save energy and materials every year."
 COLDWAR_DDR_mit_export_at_any_price: "Export at Any Price"
 COLDWAR_DDR_mit_export_at_any_price_desc: "From 1982 whatever earns hard currency is exported: furniture for Swedish catalogues, cameras for West German mail-order houses, petrol refined at Schwedt from Soviet crude - even blood plasma. The shops at home stay empty; Moscow notices the oil."
 COLDWAR_DDR_mit_credit_financed_modernisation: "Credit-Financed Modernisation"
 COLDWAR_DDR_mit_credit_financed_modernisation_desc: "Mittag borrows in the West to modernise for export - the credits will be repaid by the goods the new plants make. In 1981 the banks stop lending; not every plant is finished."
 COLDWAR_DDR_mit_turnkey_plants: "Turnkey Plants"
 COLDWAR_DDR_mit_turnkey_plants_desc: "Rolling mills, chemical plants and assembly lines from West Germany, France and Japan, Volkswagen engines for the Wartburg: the West builds, the republic pays in goods and credit."
 COLDWAR_DDR_mit_the_microelectronics_resolution: "The Microelectronics Resolution"
 COLDWAR_DDR_mit_the_microelectronics_resolution_desc: "June 1977: the Politburo decides that the republic will make its own chips. Erfurt and Dresden get the money, ZMD gets the best engineers - and the consumer goods plan gets what is left."
 COLDWAR_DDR_mit_sector_science_and_technology: "Stolen Licences"
 COLDWAR_DDR_mit_sector_science_and_technology_desc: "The foreign intelligence service's science and technology sector steals what COCOM will not sell: IBM software, chip masks, Western patents by the suitcase."
 COLDWAR_DDR_mit_the_kombinat_decree: "The Kombinat Decree"
 COLDWAR_DDR_mit_the_kombinat_decree_desc: "1979-80: almost all industry is folded into some 130 centrally run Kombinate, each with its own research, suppliers and export trade - every Kombinat makes its own screws, on the Carl Zeiss model. The general directors report straight to Mittag; the last semi-state suppliers are swallowed."
 COLDWAR_DDR_mit_lean_kombinate: "Lean Kombinate"
 COLDWAR_DDR_mit_lean_kombinate_desc: "Alt-history: the Kombinate stay lean - the semi-state suppliers keep their workshops and sell parts to the Kombinate by contract. The general directors lose their empires."
 COLDWAR_DDR_mit_automation_of_the_factories: "Automation of the Factories"
 COLDWAR_DDR_mit_automation_of_the_factories_desc: "Industrial robots by the tens of thousands - many of them home-made, many of them idle - are meant to replace the workers the republic does not have."
 COLDWAR_DDR_mit_the_kombinat_republic: "The Kombinat Republic"
 COLDWAR_DDR_mit_the_kombinat_republic_desc: "Mittag's republic: one great enterprise of Kombinate and chip works from Erfurt to Dresden, run from one office by numbers - brilliant at the Leipzig fair, efficient on paper, and answerable to no one. The party loses power to the general directors."
 COLDWAR_DDR_mit_government_by_commission: "Government by Commission"
 COLDWAR_DDR_mit_government_by_commission_desc: "Alt-history: the Politburo's Economic Commission under Mittag becomes the real government. The Central Committee departments are bypassed, the general directors sit at the table - and the Nomenklatura is told what has been decided."
 COLDWAR_DDR_mit_a_bargain_with_the_apparatus: "A Bargain with the Apparatus"
 COLDWAR_DDR_mit_a_bargain_with_the_apparatus_desc: "Mittag has no friends in the Politburo, only debtors - so he buys some: villas in Wandlitz, Volvos, Intershop allowances and hunting lodges for the district chiefs. The apparatus is loyal, and it knows its price."
 COLDWAR_DDR_mit_after_the_czar: "After the Czar"
 COLDWAR_DDR_mit_after_the_czar_desc: "The successor must be someone the apparatus will accept and the Kombinate will obey - and someone who will not open the books too quickly."
 COLDWAR_DDR_mit_heir_modrow: "Mittag Names Modrow"
 COLDWAR_DDR_mit_heir_modrow_desc: "Alt-history: the Dresden district secretary who backed Robotron and the microelectronics centre."
 COLDWAR_DDR_mit_heir_krenz: "Mittag Names Krenz"
 COLDWAR_DDR_mit_heir_krenz_desc: "The FDJ generation: a safe pair of hands for the apparatus - and for Moscow."
 COLDWAR_DDR_hag_the_chief_ideologist: "The Chief Ideologist"
 COLDWAR_DDR_hag_the_chief_ideologist_desc: "Kurt Hager: Spain veteran, professor, the Politburo's guardian of science, culture and doctrine since 1963. Under him the party line becomes the republic's whole horizon."
 COLDWAR_DDR_hag_reinholds_academy: "Reinhold's Academy"
 COLDWAR_DDR_hag_reinholds_academy_desc: "Otto Reinhold, rector of the party's academy, writes the theory: the GDR exists only as a socialist state - a capitalist GDR would have no reason to exist. His economists plan accordingly, and the last private workshops have no place in it."
 COLDWAR_DDR_hag_ragwitzs_culture_department: "Ragwitz's Culture Department"
 COLDWAR_DDR_hag_ragwitzs_culture_department_desc: "Ursula Ragwitz, head of the Central Committee's culture department, reads every manuscript and every stage play before the public does. The young stop reading."
 COLDWAR_DDR_hag_herrmanns_agitation: "Herrmann's Agitation"
 COLDWAR_DDR_hag_herrmanns_agitation_desc: "Joachim Herrmann, editor of Neues Deutschland and later secretary for agitation, decides each night which photograph of the leadership opens the front page. The workers read the sports page."
 COLDWAR_DDR_hag_purity_of_doctrine: "Purity of Doctrine"
 COLDWAR_DDR_hag_purity_of_doctrine_desc: "Marxism-Leninism as taught in Moscow, without Prague's human face or Belgrade's self-management - and demarcation pushed as far as it will go: 'German' vanishes from institutions' names, Western guests from conferences."
 COLDWAR_DDR_hag_the_wallpaper_doctrine: "The Wallpaper Doctrine"
 COLDWAR_DDR_hag_the_wallpaper_doctrine_desc: "April 1987, to the magazine Stern: 'If your neighbour puts up new wallpaper, would you feel obliged to repaper your flat too?' Perestroika stops at the Oder - and so does Soviet goodwill."
 COLDWAR_DDR_hag_needs_shaped_by_socialism: "Needs Shaped by Socialism"
 COLDWAR_DDR_hag_needs_shaped_by_socialism_desc: "Hager's economics: the needs of socialist man are shaped by socialism, not by the West German shop window. Thrift is a virtue, imports are a weakness, and a republic without debts is a free republic."
 COLDWAR_DDR_hag_party_asceticism: "Party Asceticism"
 COLDWAR_DDR_hag_party_asceticism_desc: "Alt-history: Wandlitz and the special shops for functionaries are closed - the party lives like the workers, and the money saved goes back into the plan. The Nomenklatura is furious; the FDGB is delighted."
 COLDWAR_DDR_hag_beautify_our_towns: "Beautify Our Towns"
 COLDWAR_DDR_hag_beautify_our_towns_desc: "Socialist competition in every works and the 'Make our towns and villages more beautiful - join in!' campaign in every street: brigades, banners and Saturday shifts build playgrounds, clubhouses and new roads. More output for the same wages - the red pennant hangs over the lathe, the overtime goes unpaid."
 COLDWAR_DDR_hag_science_under_party_guidance: "Science Under Party Guidance"
 COLDWAR_DDR_hag_science_under_party_guidance_desc: "The Academy of Sciences, the universities and the research institutes plan their work with the party - and from 1976 the Academy of Social Sciences at the Central Committee defines what Marxism-Leninism means in practice. What is researched is decided by its use to socialism."
 COLDWAR_DDR_hag_the_coffee_mix: "The Coffee Mix"
 COLDWAR_DDR_hag_the_coffee_mix_desc: "1977: world coffee prices explode. The 'Kaffee-Mix' - half coffee, half roasted rye and chicory - saves 300 million valuta marks. The people call it 'Erichs Krönung' and grumble loudly."
 COLDWAR_DDR_hag_coffee_from_the_brother_states: "Coffee from the Brother States"
 COLDWAR_DDR_hag_coffee_from_the_brother_states_desc: "Trucks, machines and advisers for Ethiopian and Vietnamese coffee - solidarity that fills the cups. The bill is paid in IFA trucks the republic would rather have kept."
 COLDWAR_DDR_hag_a_republic_without_debts: "A Republic Without Debts"
 COLDWAR_DDR_hag_a_republic_without_debts_desc: "Alt-history: Hager's republic pays back the West German and Swiss banks and lives on what it makes. No new credits, no new dependence - and a lot less trade."
 COLDWAR_DDR_hag_culture_under_control: "Culture Under Control"
 COLDWAR_DDR_hag_culture_under_control_desc: "Printing licences, paper quotas, the publishing office in the Ministry of Culture - and the MfS's Department M opens the letters: whoever writes, paints or sings in the republic does so by permission."
 COLDWAR_DDR_hag_the_long_leash: "The Long Leash"
 COLDWAR_DDR_hag_the_long_leash_desc: "Hager lets the artists breathe: Christa Wolf, Heiner Müller and Volker Braun publish with cuts but publish; the rock bands play; the church youth meets. Loyalty is bought with a little freedom - and the West listens in."
 COLDWAR_DDR_hag_the_frost_returns: "The Frost Returns"
 COLDWAR_DDR_hag_the_frost_returns_desc: "As after the Eleventh Plenum of 1965: banned films, pulped books, expelled writers. In 1979 the Writers' Union expels nine members; the rest learn silence."
 COLDWAR_DDR_hag_the_guardians_succession: "The Guardian's Succession"
 COLDWAR_DDR_hag_the_guardians_succession_desc: "The ideologist wants an heir who will keep the doctrine pure - and whom Moscow will trust with it."
 COLDWAR_DDR_hag_heir_krolikowski: "Hager Names Krolikowski"
 COLDWAR_DDR_hag_heir_krolikowski_desc: "Moscow's man in the Politburo: orthodox, loyal, and in daily contact with the Soviet embassy."
 COLDWAR_DDR_hag_heir_krenz: "Hager Names Krenz"
 COLDWAR_DDR_hag_heir_krenz_desc: "The FDJ generation, raised on the doctrine Hager wrote."
 COLDWAR_DDR_hag_the_ideological_fortress: "The Ideological Fortress"
 COLDWAR_DDR_hag_the_ideological_fortress_desc: "Hager's republic: a fortress of doctrine where every school, stage and institute speaks with one voice - secure against the West, loyal to Moscow, and slowly suffocating."
 COLDWAR_DDR_hof_comrade_army_general: "Comrade Army General"
 COLDWAR_DDR_hof_comrade_army_general_desc: "Heinz Hoffmann fought in Spain, trained in Moscow and has run the Ministry of National Defence in Strausberg since 1960. Now the general sits at the head of the party."
 COLDWAR_DDR_hof_kessler_at_the_main_staff: "Keßler at the Main Staff"
 COLDWAR_DDR_hof_kessler_at_the_main_staff_desc: "Colonel General Heinz Keßler, Chief of the Main Staff since 1967, turns the general's orders into plans for six divisions - and the Central Committee's apparatus learns that Strausberg no longer asks it first."
 COLDWAR_DDR_hof_streletz_and_the_defence_council: "Streletz and the Defence Council"
 COLDWAR_DDR_hof_streletz_and_the_defence_council_desc: "Fritz Streletz, secretary of the National Defence Council from 1971, ties party, army, Stasi and economy into one chain of command. Every Kombinat gets a mobilisation plan - and a new set of orders from the barracks."
 COLDWAR_DDR_hof_verners_political_officers: "Verner's Political Officers"
 COLDWAR_DDR_hof_verners_political_officers_desc: "Admiral Waldemar Verner's Political Main Administration puts a party secretary beside every commander: an army that thinks right fights right. The commanders call it supervision."
 COLDWAR_DDR_hof_the_school_of_the_nation: "The School of the Nation"
 COLDWAR_DDR_hof_the_school_of_the_nation_desc: "Eighteen months of service for every young man: the NVA is to teach discipline, technology and class consciousness to a whole generation."
 COLDWAR_DDR_hof_defence_lessons_for_every_pupil: "Defence Lessons for Every Pupil"
 COLDWAR_DDR_hof_defence_lessons_for_every_pupil_desc: "Military instruction becomes a school subject for ninth and tenth graders, as it did in September 1978. The Protestant churches protest; the ministry insists."
 COLDWAR_DDR_hof_the_society_for_sport_and_technology: "Pre-Military Training for All"
 COLDWAR_DDR_hof_the_society_for_sport_and_technology_desc: "The GST trains half a million young people in shooting, gliding, diving and radio - pre-military training dressed up as a hobby."
 COLDWAR_DDR_hof_the_garrison_state: "The Garrison State"
 COLDWAR_DDR_hof_the_garrison_state_desc: "Everything for defence: a nation in arms with reserve divisions in every district, more arms plants, more exercises - and fewer cars, fridges and oranges in the shops. Moscow counts the divisions and is pleased."
 COLDWAR_DDR_hof_the_fortress_republic: "The Fortress Republic"
 COLDWAR_DDR_hof_the_fortress_republic_desc: "Strausberg gets what it asks for: new arms plants, depots for thirty days of war, hardened command posts and a country that lives on permanent alert."
 COLDWAR_DDR_hof_the_professional_army: "The Professional Army"
 COLDWAR_DDR_hof_the_professional_army_desc: "Fewer divisions, better soldiers: long-serving NCOs, modern equipment, and the conscripts back in the factories where the plan needs them. Moscow counts divisions and is not pleased."
 COLDWAR_DDR_hof_the_frunze_standard: "The Frunze Standard"
 COLDWAR_DDR_hof_the_frunze_standard_desc: "Every NVA general passes through the Frunze and Voroshilov academies in Moscow: the best-trained officer corps of the Pact after the Soviets."
 COLDWAR_DDR_hof_defence_comes_first: "Defence Comes First"
 COLDWAR_DDR_hof_defence_comes_first_desc: "The general's economics: the NVA is the plan's first customer, the shops its second. Arms plants get their steel before the furniture Kombinate do."
 COLDWAR_DDR_hof_arms_for_the_brother_armies: "Arms for the Brother Armies"
 COLDWAR_DDR_hof_arms_for_the_brother_armies_desc: "The state arms exporter ITA sells rifles from the Erzgebirge, ammunition and W50 trucks to Syria, Ethiopia, Mozambique and Nicaragua - partly for hard currency, partly for coffee and goodwill."
 COLDWAR_DDR_hof_arms_for_the_nva: "Arms for the NVA"
 COLDWAR_DDR_hof_arms_for_the_nva_desc: "Soviet licences go to the republic's own works - Kalashnikovs from Wiesa, ammunition from Schönebeck, W50 trucks from Ludwigsfelde - and everything they make stays with the NVA. Moscow likes an ally that equips itself."
 COLDWAR_DDR_hof_the_suhl_arsenal: "The Suhl Arsenal"
 COLDWAR_DDR_hof_the_suhl_arsenal_desc: "The Ernst Thälmann works in Suhl and their sister plants turn out small arms, ammunition and spare parts for the NVA and for export."
 COLDWAR_DDR_hof_soldiers_in_the_economy: "Soldiers in the Economy"
 COLDWAR_DDR_hof_soldiers_in_the_economy_desc: "Whole NVA units are lent to the lignite pits, the harvest and the building sites; in the winter of 1978/79 the army digs out the frozen coal trains. The officers grumble that soldiers are not labourers."
 COLDWAR_DDR_hof_every_soldier_at_his_post: "Every Soldier at His Post"
 COLDWAR_DDR_hof_every_soldier_at_his_post_desc: "Hoffmann holds the Pact's standard: 85 per cent of the NVA ready for combat at all times. No soldier in the coal pits - and the plan misses the hands."
 COLDWAR_DDR_hof_the_military_industrial_republic: "The Military-Industrial Republic"
 COLDWAR_DDR_hof_the_military_industrial_republic_desc: "The Ministry of National Defence becomes the plan's most demanding customer: trucks from Ludwigsfelde, warships from Wolgast, rifles from Suhl - and an arms industry that pays its own way."
 COLDWAR_DDR_hof_marshal_of_the_gdr: "Marshal of the GDR"
 COLDWAR_DDR_hof_marshal_of_the_gdr_desc: "In March 1982 the Volkskammer created the rank of Marshal of the GDR and never awarded it. Alt-history: the general takes the baton - and must now name who comes after him."
 COLDWAR_DDR_hof_heir_kessler: "Keßler Keeps the Watch"
 COLDWAR_DDR_hof_heir_kessler_desc: "Heinz Keßler, an officer of the NVA since its founding in 1956, is to follow the general. If the Central Committee balks, the Military Council of the NVA stands ready."
 COLDWAR_DDR_hof_heir_krenz: "Krenz for the Party"
 COLDWAR_DDR_hof_heir_krenz_desc: "Egon Krenz, the FDJ man, is to inherit: the army keeps its budget, the party keeps its leading role."
 COLDWAR_DDR_hof_the_armed_republic: "The Armed Republic"
 COLDWAR_DDR_hof_the_armed_republic_desc: "The best-armed state per head in the Warsaw Pact: respected in Moscow, feared in Bonn - and tired at home."
 COLDWAR_DDR_lam_the_agitator_takes_the_chair: "The Agitator Takes the Chair"
 COLDWAR_DDR_lam_the_agitator_takes_the_chair_desc: "Werner Lamberz, born 1929, the youngest man in the Politburo and the party's best speaker, now leads it: a socialism that smiles on television."
 COLDWAR_DDR_lam_adamecks_television: "Adameck's Television"
 COLDWAR_DDR_lam_adamecks_television_desc: "Heinz Adameck has run East German television since 1954; with Lamberz's backing the DFF is to win back the evening from ARD and ZDF - with new studios and colour programmes the budget can barely carry."
 COLDWAR_DDR_lam_markowskis_diplomats: "Markowski's Diplomats"
 COLDWAR_DDR_lam_markowskis_diplomats_desc: "Paul Markowski's department for international relations knows every liberation movement from Luanda to Aden - and travels wherever Lamberz goes. Washington notices where the GDR's friends are."
 COLDWAR_DDR_lam_herrmanns_newsroom: "Herrmann's Newsroom"
 COLDWAR_DDR_lam_herrmanns_newsroom_desc: "Joachim Herrmann, editor of Neues Deutschland since 1971, is told to make the party paper readable: fewer congratulatory telegrams, more news. The district secretaries miss their names on page one."
 COLDWAR_DDR_lam_the_gdrs_kennedy: "The GDR's Kennedy"
 COLDWAR_DDR_lam_the_gdrs_kennedy_desc: "Western journalists call him the GDR's Kennedy: tall, witty, at ease with steelworkers and foreign presidents alike. The party finally has a face people want to see - and trade partners want to meet."
 COLDWAR_DDR_lam_winning_the_saturday_evening: "Winning the Saturday Evening"
 COLDWAR_DDR_lam_winning_the_saturday_evening_desc: "Ein Kessel Buntes brings Western stars and Eastern hits to the DFF from 1972. If the people watch our channel on Saturday, they watch our news on Sunday. The Western stars are paid in hard currency."
 COLDWAR_DDR_lam_breadth_and_diversity: "Breadth and Diversity"
 COLDWAR_DDR_lam_breadth_and_diversity_desc: "December 1971: 'no taboos' for artists who stand firmly on socialism. How far that breadth may reach is now Lamberz's decision."
 COLDWAR_DDR_lam_reform_from_the_top: "Reform from the Top"
 COLDWAR_DDR_lam_reform_from_the_top_desc: "The First Secretary himself opens the windows: honest statistics, live phone-ins, readers' letters printed uncut, a government spokesman who answers questions and factory managers who may contradict. Moscow raises an eyebrow."
 COLDWAR_DDR_lam_modern_orthodoxy: "Modern Orthodoxy"
 COLDWAR_DDR_lam_modern_orthodoxy_desc: "The message stays the same; only the packaging changes - new studios in Adlershof, a younger Aktuelle Kamera, slick posters for the old certainties. Moscow approves; the young switch over to the West after the news."
 COLDWAR_DDR_lam_the_africa_commission: "The Africa Commission"
 COLDWAR_DDR_lam_the_africa_commission_desc: "Lamberz chairs a Politburo commission for Africa: advisers, trucks, printing presses and security instructors for the new socialist states."
 COLDWAR_DDR_lam_comrades_in_addis_ababa: "Comrades in Addis Ababa"
 COLDWAR_DDR_lam_comrades_in_addis_ababa_desc: "Mengistu's Derg turns to the socialist camp. Lamberz flies to Addis Ababa himself: security advisers and IFA trucks for a country at war in the Ogaden, coffee for the GDR."
 COLDWAR_DDR_lam_comrades_in_maputo: "Comrades in Maputo"
 COLDWAR_DDR_lam_comrades_in_maputo_desc: "FRELIMO's Mozambique needs engineers, teachers and miners; the GDR needs workers and hard coal. A treaty would bring Mozambican contract workers to Saxony - and the engineers for Moatize are paid from Berlin."
 COLDWAR_DDR_lam_solidarity_brigades: "Solidarity Brigades"
 COLDWAR_DDR_lam_solidarity_brigades_desc: "FDJ Friendship Brigades of young engineers, nurses and teachers go south. This time Lamberz flies home from his African journeys - no helicopter waits for him in the Libyan desert."
 COLDWAR_DDR_lam_modern_socialism_sells: "Modern Socialism Sells"
 COLDWAR_DDR_lam_modern_socialism_sells_desc: "Lamberz the agitator knows that a full shop window convinces better than a banner: colour television, rock records and oranges sell socialism - if the republic can pay for them."
 COLDWAR_DDR_lam_oil_from_libya_and_iraq: "Oil from Libya and Iraq"
 COLDWAR_DDR_lam_oil_from_libya_and_iraq_desc: "1977-78: IFA trucks, cement works and engineers for Iraqi and Libyan crude outside the Soviet quota - the deals Lamberz was flying to Tripoli to close in March 1978. Moscow dislikes oil it does not deliver itself."
 COLDWAR_DDR_lam_coffee_cocoa_and_citrus: "Coffee, Cocoa and Citrus"
 COLDWAR_DDR_lam_coffee_cocoa_and_citrus_desc: "Barter instead of hard currency: Ethiopian and Angolan coffee, Ghanaian cocoa and Cuban oranges for IFA trucks, teachers and printing presses. The shelves fill; the factories that build the trucks earn nothing."
 COLDWAR_DDR_lam_colour_television: "Colour Television for Everyone"
 COLDWAR_DDR_lam_colour_television_desc: "The DFF has broadcast in colour since 1969, but a colour set from Staßfurt costs half a year's wages. Lamberz wants one in every living room before the Western sets get there."
 COLDWAR_DDR_lam_western_brands_eastern_hands: "Western Brands, Eastern Hands"
 COLDWAR_DDR_lam_western_brands_eastern_hands_desc: "Salamander shoes, Schiesser underwear and Nivea cream are made in GDR factories under Western licence - most of it for the West, some for the Exquisit shops. Money now, and a dependence Moscow notes."
 COLDWAR_DDR_lam_consumer_goods_from_every_kombinat: "Consumer Goods from Every Kombinat"
 COLDWAR_DDR_lam_consumer_goods_from_every_kombinat_desc: "Every Kombinat, even in steel and chemicals, must make consumer goods: saucepans from the rolling mill, tents from the fibre works. The general directors call it a waste of their plants."
 COLDWAR_DDR_lam_the_shop_window_of_socialism: "The Shop Window of Socialism"
 COLDWAR_DDR_lam_the_shop_window_of_socialism_desc: "Leipzig's fair, Berlin's Alexanderplatz and the department stores of every district town become the republic's shop window - for its own citizens first."
 COLDWAR_DDR_lam_the_next_generation: "The Next Generation"
 COLDWAR_DDR_lam_the_next_generation_desc: "Lamberz is barely fifty, but he knows how quickly a Politburo ages. The next leader must come from his own generation - and know how to talk to the cameras."
 COLDWAR_DDR_lam_heir_modrow: "Pass the Torch to Dresden"
 COLDWAR_DDR_lam_heir_modrow_desc: "Hans Modrow, the modest district secretary of Dresden, shares Lamberz's taste for open debate - and the old guard's distrust of it."
 COLDWAR_DDR_lam_heir_krenz: "Pass the Torch to the FDJ"
 COLDWAR_DDR_lam_heir_krenz_desc: "Egon Krenz, the FDJ chief, is young, disciplined and liked in Moscow - continuity with a younger face."
 COLDWAR_DDR_lam_a_socialism_worth_living: "A Socialism Worth Living"
 COLDWAR_DDR_lam_a_socialism_worth_living_desc: "A republic whose young people watch its television, dance to its bands and believe its leader: the dream of 1971, almost within reach."
 COLDWAR_DDR_kro_loyalty_without_reservation: "Loyalty Without Reservation"
 COLDWAR_DDR_kro_loyalty_without_reservation_desc: "Werner Krolikowski, Dresden's party chief until 1973 and Politburo member since 1971, reports to the Soviet embassy behind his comrades' backs. Now the Kremlin's confidant runs the party."
 COLDWAR_DDR_kro_stophs_council_of_ministers: "Stoph's Council of Ministers"
 COLDWAR_DDR_kro_stophs_council_of_ministers_desc: "Willi Stoph shares Krolikowski's contempt for Mittag's economic conjuring; together they run the government by the book - the Soviet book. Mielke's ministry is told to keep out of the ministries."
 COLDWAR_DDR_kro_mielkes_chekists: "Mielke's Chekists"
 COLDWAR_DDR_kro_mielkes_chekists_desc: "Erich Mielke's ministry and the KGB in Karlshorst share files, informers and suspicions: the Stasi becomes Moscow's eyes in every office - including the offices of the comrades."
 COLDWAR_DDR_kro_the_price_of_loyalty: "The Price of Loyalty"
 COLDWAR_DDR_kro_the_price_of_loyalty_desc: "Every favour from Moscow is paid in national pride: Soviet slogans, Soviet holidays, Soviet orders. How far will the republic bend?"
 COLDWAR_DDR_kro_the_loyal_satellite: "The Loyal Satellite"
 COLDWAR_DDR_kro_the_loyal_satellite_desc: "The Soviet Union's most reliable ally: every Comecon vote, every manoeuvre, every line of Pravda followed to the letter. The republic keeps its own state - and loses its Western customers."
 COLDWAR_DDR_kro_soviet_advisers_in_every_ministry: "Soviet Advisers in Every Ministry"
 COLDWAR_DDR_kro_soviet_advisers_in_every_ministry_desc: "Soviet specialists sit in the Planning Commission, the ministries and the Kombinate. Things work - in Russian. The general directors seethe."
 COLDWAR_DDR_kro_the_closest_union: "The Closest Union"
 COLDWAR_DDR_kro_the_closest_union_desc: "Alt-history: Krolikowski proposes what no German communist ever dared - a confederation of the GDR with the USSR. The Kremlin decides; the NVA's generals would serve under Soviet command."
 COLDWAR_DDR_kro_russian_as_second_language: "Russian as a State Language"
 COLDWAR_DDR_kro_russian_as_second_language_desc: "Russian becomes the second official language and Soviet officers sit in the Volkskammer as observers. Many East Germans quietly despair."
 COLDWAR_DDR_kro_german_soviet_friendship: "The Society for German-Soviet Friendship"
 COLDWAR_DDR_kro_german_soviet_friendship_desc: "Six million members, Russian lessons from the fifth grade, friendship trains to Moscow: the DSF becomes the republic's second party."
 COLDWAR_DDR_kro_the_embassy_knows_first: "The Embassy Knows First"
 COLDWAR_DDR_kro_the_embassy_knows_first_desc: "Every Politburo protocol reaches the Soviet ambassador before the ink is dry. Moscow is never surprised again - and the comrades never trust each other again."
 COLDWAR_DDR_kro_plan_by_the_soviet_book: "Plan by the Soviet Book"
 COLDWAR_DDR_kro_plan_by_the_soviet_book_desc: "Krolikowski despises Mittag's conjuring with numbers: plans are drawn up as Gosplan does - balanced in tonnes, checked in Moscow, fed by Druzhba oil at Comecon prices and closed to Western whims."
 COLDWAR_DDR_kro_specialisation_by_gosplan: "Specialisation by Gosplan"
 COLDWAR_DDR_kro_specialisation_by_gosplan_desc: "Moscow decides who builds what: the republic gets ships, rail cars, machine tools and chemicals for the whole bloc - and hands its own car and computer ambitions to its neighbours."
 COLDWAR_DDR_kro_no_debts_to_the_class_enemy: "No Debts to the Class Enemy"
 COLDWAR_DDR_kro_no_debts_to_the_class_enemy_desc: "Alt-history: what Krolikowski wrote to Moscow in secret from 1980 becomes policy - no new credit from Bonn's and Vienna's banks, repayment before consumption, and an end to Mittag's embellished statistics."
 COLDWAR_DDR_kro_the_ferry_to_klaipeda: "The Ferry to Klaipėda"
 COLDWAR_DDR_kro_the_ferry_to_klaipeda_desc: "After the Polish crisis the republic and the Soviet Union build their own bridge: a rail ferry from Mukran on Rügen to Klaipėda, opened in 1986. Soviet goods no longer cross Poland."
 COLDWAR_DDR_kro_the_soviet_order_book: "The Soviet Order Book"
 COLDWAR_DDR_kro_the_soviet_order_book_desc: "Rail cars from Ammendorf, ships from Warnemünde, machine tools from Karl-Marx-Stadt: Moscow's orders come first, are paid in transferable roubles and keep every plant busy for years."
 COLDWAR_DDR_kro_hard_currency_before_roubles: "Hard Currency Before Roubles"
 COLDWAR_DDR_kro_hard_currency_before_roubles_desc: "Even Moscow's man counts the debt: what the West pays for in marks goes west first, and the Soviet orders wait."
 COLDWAR_DDR_kro_one_economy_with_the_union: "One Economy with the Soviet Union"
 COLDWAR_DDR_kro_one_economy_with_the_union_desc: "Joint plans, joint research institutes, joint power grids: the republic's economy becomes a western province of the Soviet one."
 COLDWAR_DDR_kro_moscow_names_the_heir: "Moscow Names the Heir"
 COLDWAR_DDR_kro_moscow_names_the_heir_desc: "The Soviet ambassador lets it be known which comrades Moscow trusts - and which Kombinate can expect Soviet orders. Krolikowski only has to listen."
 COLDWAR_DDR_kro_heir_krenz: "The Kremlin's Young Hope"
 COLDWAR_DDR_kro_heir_krenz_desc: "Egon Krenz is young, loyal and known in Moscow from a hundred FDJ delegations: the Kremlin's choice for the next generation."
 COLDWAR_DDR_kro_heir_hager: "The Ideologist's Turn"
 COLDWAR_DDR_kro_heir_hager_desc: "Kurt Hager, the chief ideologist, guarantees that nothing will change - which is exactly what Krolikowski wants."
 COLDWAR_DDR_kro_the_eternal_alliance: "The Eternal Alliance"
 COLDWAR_DDR_kro_the_eternal_alliance_desc: "The GDR is now the Soviet Union's most dependable ally - richer in orders, poorer in pride. Moscow will never let this republic fall."
 COLDWAR_DDR_kre_a_younger_face: "A Younger Face"
 COLDWAR_DDR_kre_a_younger_face_desc: "Egon Krenz, born 1937, FDJ chief from 1974 and the first leader who was a child when the war ended: continuity, the party promises, with a younger face."
 COLDWAR_DDR_kre_schabowskis_press_office: "Schabowski's Press Office"
 COLDWAR_DDR_kre_schabowskis_press_office_desc: "Günter Schabowski, editor of Neues Deutschland and later Berlin's party boss, becomes the voice of the new leadership - quick, eloquent, occasionally careless. One wrong sentence can open a border."
 COLDWAR_DDR_kre_hergers_security_department: "Herger's Security Department"
 COLDWAR_DDR_kre_hergers_security_department_desc: "Wolfgang Herger, Krenz's comrade from the FDJ, heads the Central Committee's security department: army, police and Stasi report through him - and the church groups feel it first."
 COLDWAR_DDR_kre_aurichs_blue_shirts: "Aurich's Blue Shirts"
 COLDWAR_DDR_kre_aurichs_blue_shirts_desc: "Eberhard Aurich, Krenz's successor at the head of the FDJ, mobilises two million blue shirts for the leader who once wore theirs - and hundreds of thousands march past the tribune at the Whitsun meeting, at the state's expense."
 COLDWAR_DDR_kre_blue_shirts_in_the_ministries: "Blue Shirts in the Ministries"
 COLDWAR_DDR_kre_blue_shirts_in_the_ministries_desc: "Former FDJ secretaries take over district offices and ministries: a generation that learned to organise rallies now organises the state. Rallies become ministries."
 COLDWAR_DDR_kre_the_fdj_builds: "The FDJ Builds"
 COLDWAR_DDR_kre_the_fdj_builds_desc: "Krenz's economics are the FDJ's: 'Jugendobjekte' in every Kombinat, youth brigades on every priority site, and a young workforce that is promised flats in return."
 COLDWAR_DDR_kre_young_families_first: "Young Families First"
 COLDWAR_DDR_kre_young_families_first_desc: "The FDJ's demand becomes law: young couples move to the front of the housing queue, the interest-free marriage loan grows and shrinks with every child ('abkindern'), every child gets a crèche place - paid partly on credit."
 COLDWAR_DDR_kre_youth_objects: "Central Youth Projects"
 COLDWAR_DDR_kre_youth_objects_desc: "The FDJ Central Committee assigns whole brigades to the republic's priority sites - power stations, chemical plants, railway lines. The building goes fast; the young builders wait for their own flats."
 COLDWAR_DDR_kre_the_fdj_initiative_berlin: "The FDJ Initiative Berlin"
 COLDWAR_DDR_kre_the_fdj_initiative_berlin_desc: "Youth brigades from every district build Marzahn and Hellersdorf: tens of thousands of flats for the capital - and resentment in the provinces that lose their builders."
 COLDWAR_DDR_kre_promise_full_shops: "Promise Full Shops"
 COLDWAR_DDR_kre_promise_full_shops_desc: "Krenz asks Bonn for credit to fill the shops before the next winter, as Schalck-Golodkowski did in the autumn of 1989."
 COLDWAR_DDR_kre_schurers_truth: "Schürer's Truth"
 COLDWAR_DDR_kre_schurers_truth_desc: "Gerhard Schürer's analysis tells the Politburo what it never wanted to hear - as on 31 October 1989: without cuts the republic cannot pay its Western debts. Krenz publishes it."
 COLDWAR_DDR_kre_the_republic_of_the_young: "The Republic of the Young"
 COLDWAR_DDR_kre_the_republic_of_the_young_desc: "The generation that grew up behind the Wall now runs the republic it was raised for - steadier than the old men feared, younger than the West hoped."
 COLDWAR_DDR_kre_the_turn: "The Turn"
 COLDWAR_DDR_kre_the_turn_desc: "'With today's session we will introduce a turn' - Krenz's own words of October 1989. Which turn is the question every comrade asks; the first step is to talk to the church."
 COLDWAR_DDR_kre_open_the_gates: "Open the Gates"
 COLDWAR_DDR_kre_open_the_gates_desc: "A new travel law: every citizen may apply for a passport and a visa to the West. The pressure valve opens - Bonn and Moscow hold their breath."
 COLDWAR_DDR_kre_freedom_of_travel_for_credit: "Freedom of Travel for Credit"
 COLDWAR_DDR_kre_freedom_of_travel_for_credit_desc: "Schalck-Golodkowski carries the offer to Bonn, as in November 1989: open borders for every citizen, if the Federal Republic pays for the travel currency and a new credit line."
 COLDWAR_DDR_kre_the_chinese_solution: "The Chinese Solution"
 COLDWAR_DDR_kre_the_chinese_solution_desc: "June 1989: the Volkskammer applauds the massacre on Tiananmen Square and Krenz carries the congratulations to Beijing. Alt-history: the republic answers its own streets the same way."
 COLDWAR_DDR_kre_the_isolation_lists: "The Isolation Lists"
 COLDWAR_DDR_kre_the_isolation_lists_desc: "The Stasi's crisis plans list thousands of 'hostile-negative' citizens for internment in an emergency. The plans leave the safe and become orders."
 COLDWAR_DDR_kre_the_security_secretary: "The Security Secretary"
 COLDWAR_DDR_kre_the_security_secretary_desc: "As Central Committee secretary for security Krenz supervised the Stasi, the police, the army and the courts; as First Secretary he keeps the portfolio."
 COLDWAR_DDR_kre_the_ninety_nine_per_cent: "The Ninety-Nine Per Cent"
 COLDWAR_DDR_kre_the_ninety_nine_per_cent_desc: "Krenz chaired the commission that announced 98.85 % for the National Front in May 1989. Church groups counted too - and found the lie."
 COLDWAR_DDR_kre_after_the_crown_prince: "After the Crown Prince"
 COLDWAR_DDR_kre_after_the_crown_prince_desc: "For years Krenz was called the crown prince. Now he must name one of his own - from a generation that has started families of its own."
 COLDWAR_DDR_kre_heir_modrow: "The Dresden Option"
 COLDWAR_DDR_kre_heir_modrow_desc: "Hans Modrow, the reformer from Dresden, is to follow - the party's insurance against the street."
 COLDWAR_DDR_kre_heir_krolikowski: "The Embassy's Option"
 COLDWAR_DDR_kre_heir_krolikowski_desc: "Werner Krolikowski, Moscow's man for twenty years, is to follow - the Soviet embassy will not object."
 COLDWAR_DDR_mod_the_man_from_dresden: "The Man from Dresden"
 COLDWAR_DDR_mod_the_man_from_dresden_desc: "Hans Modrow, Dresden's district secretary since 1973, lives in a rented flat, queues like everyone else and was kept out of the Politburo for sixteen years. Now the party asks the outsider."
 COLDWAR_DDR_mod_berghofers_city_hall: "Berghofer's City Hall"
 COLDWAR_DDR_mod_berghofers_city_hall_desc: "Wolfgang Berghofer, the young pragmatist who would run Dresden's city hall, brings managers who measure success in flats repaired, not banners - and sends the banner-makers home."
 COLDWAR_DDR_mod_christa_lufts_economists: "Christa Luft's Economists"
 COLDWAR_DDR_mod_christa_lufts_economists_desc: "Christa Luft and the economists of the Berlin-Karlshorst college of economics may finally say aloud what their models have shown for years. The truth unsettles."
 COLDWAR_DDR_mod_markus_wolfs_counsel: "Markus Wolf's Counsel"
 COLDWAR_DDR_mod_markus_wolfs_counsel_desc: "Markus Wolf, the spymaster of the HV A, has read the West's files on the republic - and believes in a reformed socialism. His counsel comes with his network; Moscow's old guard frowns."
 COLDWAR_DDR_mod_renewal_from_below: "The Districts Plan Themselves"
 COLDWAR_DDR_mod_renewal_from_below_desc: "Modrow ran Dresden for sixteen years with what Berlin left him. Now the district becomes the unit that plans: local budgets, local building plans, local craftsmen."
 COLDWAR_DDR_mod_power_to_the_districts: "Power to the Districts"
 COLDWAR_DDR_mod_power_to_the_districts_desc: "The fifteen district councils get their own budgets and building plans: Berlin sets the frame, Dresden, Rostock and Suhl fill it. The central apparatus loses its grip - and some district bosses build themselves kingdoms."
 COLDWAR_DDR_mod_let_the_craftsmen_back_in: "Let the Craftsmen Back In"
 COLDWAR_DDR_mod_let_the_craftsmen_back_in_desc: "The 11,000 semi-state firms, private factories and craft cooperatives nationalised in 1972 are handed back to their owners - as Modrow's government allowed in March 1990, here years early. Prices that cover costs, small trades licensed again."
 COLDWAR_DDR_mod_the_dresden_model: "The Dresden Model"
 COLDWAR_DDR_mod_the_dresden_model_desc: "Robotron's headquarters and the microelectronics centre ZMD make Dresden the 'Silicon Saxony' of the East - with a district secretary who fights for every hall."
 COLDWAR_DDR_mod_joint_ventures_with_the_west: "Joint Ventures with the West"
 COLDWAR_DDR_mod_joint_ventures_with_the_west_desc: "Western firms may take stakes in East German enterprises - the joint-venture law of Modrow's 1990 government, here years early."
 COLDWAR_DDR_mod_cooperation_within_comecon: "Cooperation within Comecon"
 COLDWAR_DDR_mod_cooperation_within_comecon_desc: "Robotron builds mainframes for the whole bloc and Dresden trades chips for Soviet raw materials - safe partners, no Western strings, and no Western machines for the general directors either."
 COLDWAR_DDR_mod_the_socialist_market_republic: "The Socialist Market Republic"
 COLDWAR_DDR_mod_the_socialist_market_republic_desc: "Plan where it must, market where it can: the districts build, the craftsmen sell, the Kombinate keep part of their profit."
 COLDWAR_DDR_mod_honest_dialogue: "Honest Dialogue"
 COLDWAR_DDR_mod_honest_dialogue_desc: "October 1989 in Dresden: the city meets the 'Group of 20' chosen by the demonstrators. Here the party talks to its critics before they take to the streets."
 COLDWAR_DDR_mod_reformed_socialism: "Reformed Socialism"
 COLDWAR_DDR_mod_reformed_socialism_desc: "The SED stays, but changes: secret ballots inside the party, term limits for functionaries, an end to the privileges of Wandlitz."
 COLDWAR_DDR_mod_the_renewal_congress: "The Renewal Congress"
 COLDWAR_DDR_mod_the_renewal_congress_desc: "An extraordinary party congress elects a new Central Committee by secret ballot. Half of the old guard is gone; the members are proud of their party again."
 COLDWAR_DDR_mod_the_central_round_table: "The Central Round Table"
 COLDWAR_DDR_mod_the_central_round_table_desc: "Party, bloc parties, church and the democratic communists of Robert Havemann's circle sit at one table in the Dietrich Bonhoeffer House - as in December 1989, years earlier. Modrow concludes that the SED cannot reform itself."
 COLDWAR_DDR_mod_hand_over_to_the_democratic_communists: "Hand Over to the Democratic Communists"
 COLDWAR_DDR_mod_hand_over_to_the_democratic_communists_desc: "Modrow steps aside: the League of Democratic Communists forms the government, the SED becomes one party among others."
 COLDWAR_DDR_mod_candles_at_the_frauenkirche: "Candles at the Frauenkirche"
 COLDWAR_DDR_mod_candles_at_the_frauenkirche_desc: "Every 13 February young Christians gather with candles at the ruins of the Frauenkirche. Modrow sends no police - he goes to talk to Bishop Hempel."
 COLDWAR_DDR_mod_travel_relief: "Travel Relief"
 COLDWAR_DDR_mod_travel_relief_desc: "Pensioners already travel west; now family visits, honeymoons and study trips are approved by the district, not by the Stasi. Most come back."
 COLDWAR_DDR_mod_the_treaty_community: "The Treaty Community"
 COLDWAR_DDR_mod_the_treaty_community_desc: "17 November 1989: Modrow offered Bonn a 'treaty community' of the two German states. Here the offer comes while the Wall still stands firm."
 COLDWAR_DDR_mod_renew_the_politburo: "Renew the Politburo"
 COLDWAR_DDR_mod_renew_the_politburo_desc: "The outsider who was never admitted fills the Politburo with district secretaries, scientists and women - and asks who should carry the reform on."
 COLDWAR_DDR_mod_heir_krenz: "Continuity Through Krenz"
 COLDWAR_DDR_mod_heir_krenz_desc: "Egon Krenz, the FDJ's former chief, promises to keep the apparatus loyal to the reform - if he inherits it."
 COLDWAR_DDR_mod_heir_lamberz: "The Agitator's Succession"
 COLDWAR_DDR_mod_heir_lamberz_desc: "Werner Lamberz, the charismatic agitator, would carry the reform onto every television screen in the republic."
 COLDWAR_DDR_mod_no_crown_prince: "No Crown Prince"
 COLDWAR_DDR_mod_no_crown_prince_desc: "Modrow names nobody. When he goes, the Central Committee shall choose freely - the first open succession in the party's history."
 COLDWAR_DDR_mod_the_reformed_republic: "The Reformed Republic"
 COLDWAR_DDR_mod_the_reformed_republic_desc: "A socialist republic that talks to its church, lets its people travel and trades with Bonn as an equal: the Dresden model has become the state."
 COLDWAR_DDR_plan_state_planning_commission: "The State Planning Commission"
 COLDWAR_DDR_plan_state_planning_commission_desc: "Since 1965 Gerhard Schürer's State Planning Commission has turned every tonne of coal and every pair of shoes into a plan figure. Whoever governs, the economy of the republic starts at its desks."
 COLDWAR_DDR_plan_fyp_1971: "The Five-Year Plan 1971-1975"
 COLDWAR_DDR_plan_fyp_1971_desc: "The VIII Party Congress of June 1971 buries the prestige projects of the 1960s: fewer showpieces, more flats and goods - the 'main task' is now the people's standard of living."
 COLDWAR_DDR_plan_the_semi_state_firms: "The Semi-State Firms"
 COLDWAR_DDR_plan_the_semi_state_firms_desc: "Some 11,000 private, semi-state and craft-cooperative firms - many with a state share since 1956 - still make furniture, textiles, toys and spare parts. The party asks how long it will tolerate them."
 COLDWAR_DDR_plan_the_nationalisation_of_1972: "The Nationalisation of 1972"
 COLDWAR_DDR_plan_the_nationalisation_of_1972_desc: "Between February and July 1972 the owners are 'persuaded' to sell: 11,000 firms become people's enterprises and their former owners the managers of what was theirs."
 COLDWAR_DDR_plan_keep_the_semi_state_firms: "Keep the Semi-State Firms"
 COLDWAR_DDR_plan_keep_the_semi_state_firms_desc: "Alt-history: the compromise of 1956 survives. The state keeps its share, the families keep their workshops - and the shops keep their buttons, zips and spare parts."
 COLDWAR_DDR_plan_fyp_1976: "The Five-Year Plan 1976-1980"
 COLDWAR_DDR_plan_fyp_1976_desc: "The IX Party Congress of May 1976 promises more of everything - 750,000 new flats, more cars, more goods - and pays for it more and more with Western credit."
 COLDWAR_DDR_plan_the_kombinat_reform: "The Kombinat Reform"
 COLDWAR_DDR_plan_the_kombinat_reform_desc: "1979-81: the industrial associations are dissolved. Some 130 central Kombinate - each with its own research, suppliers and export trade - answer directly to the ministries."
 COLDWAR_DDR_plan_fyp_1981: "The Five-Year Plan 1981-1985"
 COLDWAR_DDR_plan_fyp_1981_desc: "The X Party Congress of April 1981 orders 'comprehensive intensification': more output from less energy, less material and fewer hands - just as the Western debt falls due."
 COLDWAR_DDR_plan_comprehensive_intensification: "Comprehensive Intensification"
 COLDWAR_DDR_plan_comprehensive_intensification_desc: "The formula of the 1980s: growth no longer from new factories but from science, robots and savings - the planned economy's last answer to the world market."
 COLDWAR_DDR_plan_the_foreign_trade_monopoly: "The Foreign Trade Monopoly"
 COLDWAR_DDR_plan_the_foreign_trade_monopoly_desc: "Only the Ministry of Foreign Trade may buy or sell abroad: every rouble of Comecon trade and every Western Mark passes through its hands."
 COLDWAR_DDR_plan_commercial_coordination: "Commercial Coordination"
 COLDWAR_DDR_plan_commercial_coordination_desc: "Alexander Schalck-Golodkowski's KoKo, founded in 1966 under the wing of the MfS, earns hard currency by any means - art and antiques, arms, blood plasma and prisoners."
 COLDWAR_DDR_plan_export_at_any_price: "Exports Before the Shops"
 COLDWAR_DDR_plan_export_at_any_price_desc: "Furniture for IKEA, cameras for Quelle, petrol for West Berlin: whatever the West will buy is sold, even when the shops at home stay empty."
 COLDWAR_DDR_plan_the_debt_question: "The Debt Question"
 COLDWAR_DDR_plan_the_debt_question_desc: "By 1981 the republic owes Western banks more than ten billion dollars, and Schürer warns that it will soon borrow only to pay the interest."
 COLDWAR_DDR_plan_the_billion_mark_credit: "Credits from Western Banks"
 COLDWAR_DDR_plan_the_billion_mark_credit_desc: "Consortia of Western banks in Vienna, London and Frankfurt roll over the republic's debts - at a price in interest and in Moscow's suspicion. (Government-guaranteed credits from Bonn are an offer in the German Question and in Honecker's tree.)"
 COLDWAR_DDR_plan_repay_at_any_price: "Repay at Any Price"
 COLDWAR_DDR_plan_repay_at_any_price_desc:0 "Every debt payment competes with investment, imports and the goods households expect to find in the shops. The government will reserve liquid funds for a measurable reduction in outstanding principal rather than another expansion financed from abroad. A stronger balance sheet promises greater freedom of action, but the resources committed to repayment cannot build the next factory."
 COLDWAR_DDR_plan_the_price_question: "The Price Question"
 COLDWAR_DDR_plan_the_price_question_desc: "A bread roll costs five pfennigs, as in 1950, and a tram ticket twenty. Every year the gap between price and cost grows - and with it the state's bill."
 COLDWAR_DDR_plan_freeze_the_prices: "Freeze the Prices"
 COLDWAR_DDR_plan_freeze_the_prices_desc: "The promise of 1971: bread, rents, fares and children's clothes will not cost a pfennig more - whatever it costs the budget."
 COLDWAR_DDR_plan_price_reform: "Price Reform"
 COLDWAR_DDR_plan_price_reform_desc: "The planners' heresy: let prices tell the truth. Wasteful factories are exposed - and so are the households, after twenty years of fixed prices."
 COLDWAR_DDR_ind_chemistry_gives_bread: "Chemistry Gives Bread, Prosperity and Beauty"
 COLDWAR_DDR_ind_chemistry_gives_bread_desc: "The slogan of the 1958 chemistry programme still hangs over Leuna: a republic without oil fields will build its wealth on coal, Soviet oil and its chemists."
 COLDWAR_DDR_ind_leuna_ii: "Leuna II"
 COLDWAR_DDR_ind_leuna_ii_desc: "The new petrochemical half of the Leuna works runs on Soviet oil instead of coal: ethylene, methanol and polyethylene for the whole republic."
 COLDWAR_DDR_ind_plastics_from_schkopau: "Plastics from Schkopau"
 COLDWAR_DDR_ind_plastics_from_schkopau_desc: "The Buna works' billboard on the transit motorway promises plastics for every household: PVC, synthetic rubber and carbide chemistry from Schkopau."
 COLDWAR_DDR_ind_the_chemical_triangle: "The Chemical Triangle"
 COLDWAR_DDR_ind_the_chemical_triangle_desc: "Halle, Merseburg and Bitterfeld make a third of the republic's chemicals - and most of its smog."
 COLDWAR_DDR_ind_pck_schwedt: "PCK Schwedt"
 COLDWAR_DDR_ind_pck_schwedt_desc: "At the end of the Druzhba pipeline the petrochemical Kombinat on the Oder refines Soviet crude - for the republic's tractors and for West Berlin's petrol stations."
 COLDWAR_DDR_ind_refined_for_the_west: "Refined for the West"
 COLDWAR_DDR_ind_refined_for_the_west_desc: "The most profitable trade the republic has: Soviet crude at friendship prices goes out again as diesel and heating oil for Western Marks."
 COLDWAR_DDR_ind_heavy_machine_building: "Heavy Machine Building"
 COLDWAR_DDR_ind_heavy_machine_building_desc: "Machine tools from Karl-Marx-Stadt, cranes from Leipzig, printing presses from Radebeul: the republic is Comecon's workshop."
 COLDWAR_DDR_ind_steel_from_eisenhuettenstadt: "Steel from Eisenhüttenstadt"
 COLDWAR_DDR_ind_steel_from_eisenhuettenstadt_desc: "The 'first socialist city' on the Oder finishes its cold rolling mill in 1974: sheet steel for cars, fridges and washing machines from Soviet ore and Polish coke."
 COLDWAR_DDR_ind_the_hot_rolling_mill: "The Eisenhüttenstadt Hot Rolling Mill"
 COLDWAR_DDR_ind_the_hot_rolling_mill_desc: "Eisenhüttenstadt still has no hot rolling mill: its slabs travel to the Soviet Union and back. Alt-history: the gap is closed in the 1970s, not in 1997."
 COLDWAR_DDR_ind_machine_tools_for_export: "Machine Tools for Export"
 COLDWAR_DDR_ind_machine_tools_for_export_desc: "The Kombinate 'Fritz Heckert' and '7 October' sell lathes and machining centres from Moscow to Milan - the republic's best ambassadors in the West."
 COLDWAR_DDR_ind_the_three_shift_system: "The Three-Shift System"
 COLDWAR_DDR_ind_the_three_shift_system_desc: "Expensive Western machines must never stand still: through the 1970s the Kombinate move ever more workers into round-the-clock shifts."
 COLDWAR_DDR_ind_the_trabant_question: "The Trabant Question"
 COLDWAR_DDR_ind_the_trabant_question_desc: "The Trabant P601 of 1964 is still the people's car - two-stroke engine, plastic body, a wait of twelve years. Zwickau has successors on the drawing board; the Politburo hesitates."
 COLDWAR_DDR_ind_trabant_forever: "Trabant Forever"
 COLDWAR_DDR_ind_trabant_forever_desc: "No Western licence, no new car: the P601 is improved bolt by bolt and built until the end of time. The hard currency stays at home."
 COLDWAR_DDR_ind_the_vw_licence: "The VW Licence"
 COLDWAR_DDR_ind_the_vw_licence_desc: "1984: Volkswagen sells the licence for its Polo engine. The Wartburg 1.3 and the Trabant 1.1 get four-stroke engines - paid for with parts delivered to Wolfsburg."
 COLDWAR_DDR_ind_the_ifa_kombinat: "The IFA Vehicle Kombinat"
 COLDWAR_DDR_ind_the_ifa_kombinat_desc: "Trabant, Wartburg, the W50 lorry and the Multicar: the IFA Kombinat builds everything that moves on the republic's roads - and for half of Comecon."
 COLDWAR_DDR_ind_the_baltic_shipyards: "The Warnow and Neptun Shipyards"
 COLDWAR_DDR_ind_the_baltic_shipyards_desc: "Warnemünde and Rostock build freighters, trawlers and fish-factory ships - most of them for the Soviet Union, paid in oil and timber."
 COLDWAR_DDR_ind_ships_for_the_soviet_union: "Ships for the Soviet Union"
 COLDWAR_DDR_ind_ships_for_the_soviet_union_desc: "Every second ship from the Baltic yards sails east: the Soviet fishing fleet is the republic's best customer - and its most demanding."
 COLDWAR_DDR_micro_kombinat_robotron: "Kombinat Robotron"
 COLDWAR_DDR_micro_kombinat_robotron_desc: "Founded in Dresden in 1969: typewriters, calculators, data processing - the republic's answer to IBM, with almost 70,000 employees by the 1980s."
 COLDWAR_DDR_micro_the_academy_of_sciences: "The Academy of Sciences"
 COLDWAR_DDR_micro_the_academy_of_sciences_desc: "Twenty thousand researchers in Berlin-Adlershof, Jena and Dresden; since the academy reform of 1969 they work to contracts with the Kombinate instead of to their curiosity."
 COLDWAR_DDR_micro_the_eser_computers: "The ESER Computers"
 COLDWAR_DDR_micro_the_eser_computers_desc: "Comecon's Unified System copies IBM's 360: Robotron's EC 1040 of 1973 becomes the bloc's most successful mainframe, sold from Havana to Novosibirsk."
 COLDWAR_DDR_micro_robots_for_the_kombinate: "Robots for the Kombinate"
 COLDWAR_DDR_micro_robots_for_the_kombinate_desc: "'Rationalisation by our own means': every Kombinat must build its own robots and automatic lines - tens of thousands of 'industrial robots' by 1985, many of them simple manipulators."
 COLDWAR_DDR_micro_the_microelectronics_decision: "The Microelectronics Decision"
 COLDWAR_DDR_micro_the_microelectronics_decision_desc: "June 1977: the Politburo orders a microelectronics industry built from scratch - billions of Marks and tens of thousands of engineers, all under the Western COCOM embargo."
 COLDWAR_DDR_micro_our_own_development: "Our Own Development"
 COLDWAR_DDR_micro_our_own_development_desc: "Every chip designed in Dresden and Erfurt, every machine built at home: slower and dearer, but nobody in the West can switch it off."
 COLDWAR_DDR_micro_copy_the_west: "Copy the West"
 COLDWAR_DDR_micro_copy_the_west_desc: "The MfS sector for science and technology smuggles Western chips, wafer steppers and machines through front companies - and Dresden copies them transistor by transistor."
 COLDWAR_DDR_micro_zmd_dresden: "ZMD Dresden"
 COLDWAR_DDR_micro_zmd_dresden_desc: "From 1980 the Centre for Microelectronics Dresden is the heart of the chip programme - from 16-kilobit to 256-kilobit memory chips."
 COLDWAR_DDR_micro_the_megabit_chip: "The Megabit Chip"
 COLDWAR_DDR_micro_the_megabit_chip_desc: "September 1988: Dresden presents a 1-megabit memory chip - years behind the West, and each one costs 534 Marks to make while the world market pays a few dollars."
 COLDWAR_DDR_micro_computers_for_the_schools: "Computers for the Schools"
 COLDWAR_DDR_micro_computers_for_the_schools_desc: "From 1985 the KC 85 and later Robotron's school computer enter the classrooms - eight bits, cassette drives and a generation that learns to program."
 COLDWAR_DDR_micro_carl_zeiss_jena: "Carl Zeiss Jena"
 COLDWAR_DDR_micro_carl_zeiss_jena_desc: "The optics Kombinat of Jena grinds lenses for planetaria, microscopes, the NVA and the Soviet space programme - and sells them for hard currency."
 COLDWAR_DDR_micro_optics_for_the_nva: "Optics for the NVA"
 COLDWAR_DDR_micro_optics_for_the_nva_desc: "Night sights, rangefinders, tank periscopes and reconnaissance cameras: Jena equips the Warsaw Pact's front line."
 COLDWAR_DDR_micro_the_mkf_6_camera: "The MKF-6 Space Camera"
 COLDWAR_DDR_micro_the_mkf_6_camera_desc: "September 1976: Zeiss's multispectral camera photographs the earth from Soyuz 22 and later from the Salyut stations - the republic's eye in orbit."
 COLDWAR_DDR_energy_brown_coal_from_lusatia: "Brown Coal from Lusatia"
 COLDWAR_DDR_energy_brown_coal_from_lusatia_desc: "Lusatia and the Leipzig basin hold the republic's only real raw material: 250 million tonnes of lignite a year, dug by excavators taller than a church."
 COLDWAR_DDR_energy_schwarze_pumpe: "Schwarze Pumpe"
 COLDWAR_DDR_energy_schwarze_pumpe_desc: "Near Hoyerswerda the world's largest briquette and town-gas works turns lignite into gas, coke and briquettes for every stove in the republic."
 COLDWAR_DDR_energy_the_oil_cut: "The Oil Cut of 1981"
 COLDWAR_DDR_energy_the_oil_cut_desc: "Autumn 1981: Brezhnev cuts the republic's oil from 19 to 17 million tonnes a year - Moscow needs the dollars more than its ally needs the oil."
 COLDWAR_DDR_energy_coal_instead_of_oil: "Coal Instead of Oil"
 COLDWAR_DDR_energy_coal_instead_of_oil_desc: "Heating plants are converted back from oil to lignite, output climbs to 312 million tonnes in 1985 - and the saved Soviet oil is refined and sold to the West."
 COLDWAR_DDR_energy_oil_on_the_world_market: "Oil on the World Market"
 COLDWAR_DDR_energy_oil_on_the_world_market_desc: "Alt-history: the republic keeps its oil-fired plants and buys the missing two million tonnes in Rotterdam - with money it does not have."
 COLDWAR_DDR_energy_the_energy_conservation_programme: "The Energy Conservation Programme"
 COLDWAR_DDR_energy_the_energy_conservation_programme_desc: "Every Kombinat gets an energy quota: street lights are dimmed, shop windows go dark and the planners count kilowatt-hours like bread."
 COLDWAR_DDR_energy_boxberg_power_station: "Boxberg Power Station"
 COLDWAR_DDR_energy_boxberg_power_station_desc: "From 1971 the lignite giant of Upper Lusatia grows to 3,520 megawatts - the largest power station of the republic."
 COLDWAR_DDR_energy_jaenschwalde_power_station: "Jänschwalde Power Station"
 COLDWAR_DDR_energy_jaenschwalde_power_station_desc: "Six 500-megawatt blocks near Cottbus (1976-89) burn eighty thousand tonnes of coal a day - and the open-cast mines swallow the Sorbian villages around them."
 COLDWAR_DDR_energy_beyond_lignite: "Beyond Lignite"
 COLDWAR_DDR_energy_beyond_lignite_desc: "Lignite alone cannot carry an industrial state: the planners look east for natural gas and to the atom for the future."
 COLDWAR_DDR_energy_greifswald_nuclear_power_station: "The Greifswald Nuclear Power Station"
 COLDWAR_DDR_energy_greifswald_nuclear_power_station_desc: "At Lubmin on the Baltic, Soviet VVER-440 reactors go online from 1973 to 1979 - 1,760 megawatts, a tenth of the republic's electricity."
 COLDWAR_DDR_energy_build_stendal: "Build Stendal"
 COLDWAR_DDR_energy_build_stendal_desc: "On the Elbe near Stendal four VVER-1000 reactors are to make the republic's largest power station - if the money and the Soviet parts arrive."
 COLDWAR_DDR_energy_stop_stendal: "Stop Stendal"
 COLDWAR_DDR_energy_stop_stendal_desc: "Alt-history: after Chernobyl the church circles ask what the cloud from Kiev would have done over Magdeburg, the planners ask what the reactors cost - and Stendal is halted."
 COLDWAR_DDR_energy_the_soyuz_pipeline: "The Soyuz Pipeline"
 COLDWAR_DDR_energy_the_soyuz_pipeline_desc: "1974-79: from Orenburg to the Soviet western border, built by all of Comecon - the republic's section in Ukraine, the FDJ's 'Druzhba' route, is its largest youth project."
 COLDWAR_DDR_energy_natural_gas_for_the_cities: "Natural Gas for the Cities"
 COLDWAR_DDR_energy_natural_gas_for_the_cities_desc: "From 1979 Orenburg gas reaches the republic; the lignite town gas of Berlin, Leipzig and Dresden gives way."
 COLDWAR_DDR_agr_socialist_agriculture: "Socialist Agriculture"
 COLDWAR_DDR_agr_socialist_agriculture_desc: "Since the 'socialist spring' of 1960 every farmer belongs to an agricultural production cooperative; nearly a million people work the land of a small, crowded country."
 COLDWAR_DDR_agr_crop_and_livestock_separation: "Crop and Livestock Separation"
 COLDWAR_DDR_agr_crop_and_livestock_separation_desc: "From the early 1970s the cooperatives hand their fields to crop units of four to six thousand hectares; the animals stay behind in the village cooperatives."
 COLDWAR_DDR_agr_industrial_agriculture: "Industrial Agriculture"
 COLDWAR_DDR_agr_industrial_agriculture_desc: "Fields as wide as the horizon, crop-spraying aircraft, combine harvesters in columns: the farm becomes a factory and the farmer a worker in green."
 COLDWAR_DDR_agr_the_animal_combines: "The Pig and Cattle Combines"
 COLDWAR_DDR_agr_the_animal_combines_desc: "Eberswalde fattens almost two hundred thousand pigs a year, Ferdinandshof thousands of bulls - meat for the people, for export and liquid manure for the groundwater."
 COLDWAR_DDR_agr_village_cooperatives: "Village Cooperatives"
 COLDWAR_DDR_agr_village_cooperatives_desc: "Alt-history: crops and animals are reunited in the village cooperative - smaller, slower, closer to the soil, and the young farmers stay."
 COLDWAR_DDR_agr_the_farmers_own_councils: "The Farmers' Own Councils"
 COLDWAR_DDR_agr_the_farmers_own_councils_desc: "The cooperative's general assembly again decides what is sown and when; the Democratic Farmers' Party finally speaks for the villages."
 COLDWAR_DDR_agr_grain_from_our_own_fields: "Grain from Our Own Fields"
 COLDWAR_DDR_agr_grain_from_our_own_fields_desc: "Every year the republic buys millions of tonnes of grain and fodder in the West for hard currency; self-sufficiency would save hundreds of millions."
 COLDWAR_DDR_agr_the_piesteritz_nitrogen_works: "The Piesteritz Nitrogen Works"
 COLDWAR_DDR_agr_the_piesteritz_nitrogen_works_desc: "Ammonia and urea from Piesteritz on the Elbe: new plants in the 1970s double the fertiliser for the cooperatives' fields."
 COLDWAR_DDR_agr_agrochemical_centres: "Agrochemical Centres"
 COLDWAR_DDR_agr_agrochemical_centres_desc: "Agrochemical centres spread fertiliser and pesticides by lorry and aircraft - efficient, and fatal for rivers and wells."
 COLDWAR_DDR_agr_land_improvement: "Land Improvement"
 COLDWAR_DDR_agr_land_improvement_desc: "Drainage and irrigation on a million hectares: the FDJ drained the great Friedland meadows in the 1950s, now the cooperatives do it on every wet field."
 COLDWAR_DDR_agr_private_plots: "Private Plots and Allotments"
 COLDWAR_DDR_agr_private_plots_desc: "The cooperative farmer's half hectare, the city allotment and the rabbit hutch supply much of the fruit and eggs - bought up by the state above the shop price."
 COLDWAR_DDR_agr_meat_for_export: "Meat for Export"
 COLDWAR_DDR_agr_meat_for_export_desc: "Pork and beef go west for hard currency while the butchers at home sell out by noon."
 COLDWAR_DDR_cons_the_housing_construction_kombinate: "The Housing Construction Kombinate"
 COLDWAR_DDR_cons_the_housing_construction_kombinate_desc: "Every district gets a housing construction Kombinat with its own panel factory; from 1973 they are to solve 'the housing question as a social problem' by 1990."
 COLDWAR_DDR_cons_the_wbs_70_series: "The WBS 70 Panel Series"
 COLDWAR_DDR_cons_the_wbs_70_series_desc: "From 1972 one standard panel system for the whole republic: six storeys, central heating, a bath and a fitted kitchen - luxury for families from crumbling tenements."
 COLDWAR_DDR_cons_halle_neustadt: "Halle-Neustadt"
 COLDWAR_DDR_cons_halle_neustadt_desc: "The chemical workers' city west of the Saale, begun in 1964, grows to ninety thousand people - the model for every new town of the republic."
 COLDWAR_DDR_cons_creches_for_every_child: "Crèches for Every Child"
 COLDWAR_DDR_cons_creches_for_every_child_desc: "Crèche, kindergarten, after-school care and the 'baby year' of 1976: nine in ten women of working age can work - and do."
 COLDWAR_DDR_cons_berlin_marzahn: "Berlin-Marzahn"
 COLDWAR_DDR_cons_berlin_marzahn_desc: "From 1977 the largest building site of the republic: some sixty thousand flats on the eastern edge of Berlin, a new city in ten years."
 COLDWAR_DDR_cons_the_three_millionth_flat: "The Three-Millionth Flat"
 COLDWAR_DDR_cons_the_three_millionth_flat_desc: "July 1988: the party celebrates the three-millionth flat since 1971 in Marzahn - while the old towns of Leipzig and Görlitz crumble behind the cameras."
 COLDWAR_DDR_cons_the_supply_of_the_population: "The Supply of the Population"
 COLDWAR_DDR_cons_the_supply_of_the_population_desc: "Bread, rents and brown coal are cheap; tights, car parts and bananas are sold under the counter to friends."
 COLDWAR_DDR_cons_too_much_money_too_few_goods: "Too Much Money, Too Few Goods"
 COLDWAR_DDR_cons_too_much_money_too_few_goods_desc: "Wages rise and the savings books swell - well over a hundred billion Marks by the 1980s - but the shelves do not fill."
 COLDWAR_DDR_cons_subsidise_everything: "Subsidise Everything"
 COLDWAR_DDR_cons_subsidise_everything_desc: "Rents at pre-war levels, bread at 1950 prices, children's shoes below cost: by the late 1980s subsidies swallow a fifth of the budget."
 COLDWAR_DDR_cons_the_two_price_economy: "The Two-Price Economy"
 COLDWAR_DDR_cons_the_two_price_economy_desc: "Exquisit for fashion, Delikat for fine food: the republic sells cheap basics and expensive 'luxury' side by side - and soaks up the money that has nothing to buy."
 COLDWAR_DDR_cons_the_thousand_small_things: "The Thousand Small Things"
 COLDWAR_DDR_cons_the_thousand_small_things_desc: "Every heavy-industry Kombinat must also make consumer goods: the chemical works sell garden hoses, the arms factories bicycles."
 COLDWAR_DDR_cons_the_trabant_waiting_list: "The Trabant Waiting List"
 COLDWAR_DDR_cons_the_trabant_waiting_list_desc: "Order a car at eighteen, collect it at thirty: millions of orders wait in Zwickau and Eisenach, and a used Trabant costs more than a new one."
 COLDWAR_DDR_cons_intershop_for_everyone: "Intershop for Everyone"
 COLDWAR_DDR_cons_intershop_for_everyone_desc: "From 1974 citizens may legally hold Western money - and spend it in the Intershops, where the republic sells Western goods for Western Marks."
 COLDWAR_DDR_cons_coffee_from_the_central_highlands: "Coffee from the Central Highlands"
 COLDWAR_DDR_cons_coffee_from_the_central_highlands_desc: "After the coffee crisis of 1977 and the hated mixed blend nicknamed 'Erichs Krönung', the republic invests in Vietnamese plantations: from the 1980s GDR experts grow coffee in Dak Lak."
 COLDWAR_DDR_cons_jeans_for_the_youth: "Jeans for the Youth"
 COLDWAR_DDR_cons_jeans_for_the_youth_desc: "1978: the state imports a million pairs of Levi's for hard currency - the queues outside the department stores are longer than for any party rally."
 COLDWAR_DDR_nva_the_national_peoples_army: "The National People's Army"
 COLDWAR_DDR_nva_the_national_peoples_army_desc: "Founded on 1 March 1956, the NVA is the only Warsaw Pact army whose combat units stand under the Pact's Combined Command even in peacetime - six divisions, an air force and a navy, manned by eighteen-month conscripts."
 COLDWAR_DDR_nva_the_political_main_administration: "The Political Main Administration"
 COLDWAR_DDR_nva_the_political_main_administration_desc: "Every regiment has its political deputy and its party organisation; the Political Main Administration in Strausberg makes sure the army never forgets whose army it is."
 COLDWAR_DDR_nva_the_partys_army: "The Party's Army"
 COLDWAR_DDR_nva_the_partys_army_desc: "Nearly every officer carries a party card. Political schooling eats hours of every training week, and the political deputy watches over every commander."
 COLDWAR_DDR_nva_officers_not_commissars: "Officers, Not Commissars"
 COLDWAR_DDR_nva_officers_not_commissars_desc: "Alt-history: the generals ask for what every Western army has - command without a political deputy looking over the shoulder. Hoffmann's staff draft a professional officer corps."
 COLDWAR_DDR_nva_the_military_service_law: "The Military Service Law"
 COLDWAR_DDR_nva_the_military_service_law_desc: "The 1982 law confirms eighteen months of service for every man - and, in a state of defence, makes women liable too. 'Women for Peace' circles answer with open letters."
 COLDWAR_DDR_nva_the_reservists: "The Reservists"
 COLDWAR_DDR_nva_the_reservists_desc: "After their service, soldiers stay reservists until fifty; every year tens of thousands are called back for weeks of exercises - in a crisis the NVA can double in days."
 COLDWAR_DDR_nva_brotherhood_in_arms_1970: "Brotherhood in Arms 1970"
 COLDWAR_DDR_nva_brotherhood_in_arms_1970_desc: "October 1970: the armies of the Warsaw Pact manoeuvre on GDR soil, commanded by the republic's own Minister of National Defence, Army General Heinz Hoffmann."
 COLDWAR_DDR_nva_the_first_strategic_echelon: "The First Strategic Echelon"
 COLDWAR_DDR_nva_the_first_strategic_echelon_desc: "In war the NVA's six divisions advance together with the Group of Soviet Forces in the first wave - the front line of the socialist camp runs through Thuringia and Mecklenburg."
 COLDWAR_DDR_nva_first_echelon_offensive_doctrine: "First Echelon Offensive Doctrine"
 COLDWAR_DDR_nva_first_echelon_offensive_doctrine_desc: "The coalition war plan: answer any NATO attack with a counter-offensive across the inner-German border towards Hamburg, Hanover and the Danish straits within days."
 COLDWAR_DDR_nva_territorial_defence: "Territorial Defence"
 COLDWAR_DDR_nva_territorial_defence_desc: "Alt-history: instead of storming the Rhine the NVA digs in at home - territorial regiments and a people's war on our own soil, a doctrine closer to Belgrade than to Moscow."
 COLDWAR_DDR_nva_operation_centre: "Operation Centre"
 COLDWAR_DDR_nva_operation_centre_desc: "The plan for West Berlin: NVA units, border troops and combat groups would take the half-city within days of a war. Medals of the Blücher Order, created for wartime only, already lie in the depots."
 COLDWAR_DDR_nva_fortified_districts: "Fortified Districts"
 COLDWAR_DDR_nva_fortified_districts_desc: "Alt-history: the Ore Mountains, the Harz foothills and the Elbe crossings become fortified districts held by local regiments."
 COLDWAR_DDR_nva_brotherhood_in_arms_1980: "Brotherhood in Arms 1980"
 COLDWAR_DDR_nva_brotherhood_in_arms_1980_desc: "September 1980: the armies of the Pact manoeuvre again on GDR soil and in the Baltic, while the strikes in Gdańsk are on everyone's mind."
 COLDWAR_DDR_nva_the_red_prussians: "The Red Prussians"
 COLDWAR_DDR_nva_the_red_prussians_desc: "Soviet marshals call the NVA the best-drilled army of the Pact, and NATO staffs agree: goose-step, field-grey uniforms and Soviet tanks - the Red Prussians."
 COLDWAR_DDR_nva_the_friedrich_engels_military_academy: "The Friedrich Engels Military Academy"
 COLDWAR_DDR_nva_the_friedrich_engels_military_academy_desc: "In Dresden the academy trains the general-staff officers of the NVA; the best go on to the Voroshilov Academy in Moscow."
 COLDWAR_DDR_nva_motor_rifle_and_tank_divisions: "Motor-Rifle and Tank Divisions"
 COLDWAR_DDR_nva_motor_rifle_and_tank_divisions_desc: "The 1st, 4th, 8th and 11th Motor-Rifle and the 7th and 9th Tank Divisions stand ready in the military districts of Leipzig and Neubrandenburg."
 COLDWAR_DDR_nva_soviet_equipment_deliveries: "Soviet Equipment Deliveries"
 COLDWAR_DDR_nva_soviet_equipment_deliveries_desc: "T-55 tanks, BMP-1 infantry fighting vehicles, Mi-24 helicopters: almost every weapon of the NVA comes from the Soviet Union, at Comecon prices."
 COLDWAR_DDR_nva_buy_from_the_brothers: "Buy from the Brothers"
 COLDWAR_DDR_nva_buy_from_the_brothers_desc:0 "Soviet reserves offer a quicker route to strengthening the armoured force than building a new production industry at home. A paid procurement agreement would bring existing vehicles, training opportunities and closer military cooperation. The order must be accepted in Moscow, and the vehicles supplied will reflect the equipment actually available for delivery."
 COLDWAR_DDR_nva_the_t72_licence:0 "Soviet Tank Assembly Licence"
 COLDWAR_DDR_nva_the_t72_licence_desc:0 "Domestic tank assembly would give the republic industrial skills that an import order cannot provide. Soviet design rights and technical cooperation must accompany investment in workshops and production capacity. The project will proceed only when an available design can be licensed and the assembly works can be delivered; it does not grant access to a future tank generation."
 COLDWAR_DDR_nva_the_armour_of_the_eighties: "The Armour of the Eighties"
 COLDWAR_DDR_nva_the_armour_of_the_eighties_desc: "T-72M1 tanks, BMP-2s, Su-22 fighter-bombers: in the 1980s the NVA modernises faster than the economy can pay for it."
 COLDWAR_DDR_nva_the_40th_parachute_battalion: "The 40th Parachute Battalion"
 COLDWAR_DDR_nva_the_40th_parachute_battalion_desc: "'Willi Sänger', named after a communist resistance fighter murdered by the Nazis: the NVA's only paratroop battalion trains for raids deep behind NATO lines."
 COLDWAR_DDR_nva_the_combat_swimmers: "The Combat Swimmers"
 COLDWAR_DDR_nva_the_combat_swimmers_desc: "The Volksmarine's combat swimmers train to mine harbours, locks and bridges from Kiel to the Danish straits."
 COLDWAR_DDR_border_guarding_the_state_border: "Guarding the State Border"
 COLDWAR_DDR_border_guarding_the_state_border_desc: "1,378 kilometres of fortified border and the Wall around West Berlin, watched by 47,000 border soldiers."
 COLDWAR_DDR_border_the_border_troops_of_the_gdr: "The Border Troops of the GDR"
 COLDWAR_DDR_border_the_border_troops_of_the_gdr_desc: "In 1971 the Border Command leaves the NVA and becomes the Border Troops of the GDR - so that 47,000 men no longer appear in the army's strength at the coming force-reduction talks in Vienna."
 COLDWAR_DDR_border_the_restricted_zone: "The Restricted Zone"
 COLDWAR_DDR_border_the_restricted_zone_desc: "A five-kilometre zone along the border where only residents with a special pass may live; 'unreliable' families were deported in 1952 and 1961."
 COLDWAR_DDR_border_the_crossing_points: "The Border Crossing Points"
 COLDWAR_DDR_border_the_crossing_points_desc: "Marienborn, Checkpoint Charlie, the 'Palace of Tears' at Friedrichstraße: the passport controllers are Stasi officers in border-troop uniform."
 COLDWAR_DDR_border_the_fourth_generation_wall: "The Fourth-Generation Wall"
 COLDWAR_DDR_border_the_fourth_generation_wall_desc: "From 1975 the 'Border Wall 75' replaces the improvised walls: 45,000 L-shaped concrete segments, 3.6 metres high, topped with a smooth pipe no hand can grip."
 COLDWAR_DDR_border_the_modern_border: "The Modern Border"
 COLDWAR_DDR_border_the_modern_border_desc: "Signal fences, dog runs, floodlights, a patrol road and a raked 'death strip': technology replaces manpower, and the border costs less every year - but the world's picture of it does not change."
 COLDWAR_DDR_border_the_iron_border: "The Iron Border"
 COLDWAR_DDR_border_the_iron_border_desc: "The hardliners want no gaps at all: double fences, more mines, more dogs, more towers - the border as a fortress, whatever the world thinks."
 COLDWAR_DDR_border_gates_in_the_wall: "Gates in the Wall"
 COLDWAR_DDR_border_gates_in_the_wall_desc: "Alt-history: more crossing points, and visits to the West widened from pensioners to working people. The border still stands, but it opens its gates a little - and Bonn notices."
 COLDWAR_DDR_border_the_border_law_of_1982: "The Border Law of 1982"
 COLDWAR_DDR_border_the_border_law_of_1982_desc: "25 March 1982: for the first time a law, not just an order, regulates the border regime - including the use of firearms in its paragraph 27."
 COLDWAR_DDR_border_the_order_to_shoot: "The Order to Shoot"
 COLDWAR_DDR_border_the_order_to_shoot_desc: "No written order uses the word, but every guard knows it: a successful escape on his watch ends his career, a shot 'border violator' earns him a medal and leave."
 COLDWAR_DDR_border_the_order_stands: "The Order Stands"
 COLDWAR_DDR_border_the_order_stands_desc: "3 May 1974: Honecker tells the National Defence Council that firearms must be used 'ruthlessly' against anyone who tries to break through. The order stays."
 COLDWAR_DDR_border_warning_shots_only: "Warning Shots Only"
 COLDWAR_DDR_border_warning_shots_only_desc: "Alt-history: the guards are ordered to fire into the air and arrest, not to kill - no more bodies on the death strip for Western cameras."
 COLDWAR_DDR_border_the_sm70: "The SM-70 Self-Firing Devices"
 COLDWAR_DDR_border_the_sm70_desc: "From 1971 some 60,000 directional mines are fixed to the border fence - until Michael Gartenschläger dismantles two in 1976 and shows them to the West German press."
 COLDWAR_DDR_border_urgent_family_matters: "Urgent Family Matters"
 COLDWAR_DDR_border_urgent_family_matters_desc: "From 1972 citizens below pension age may apply to visit the West for weddings, funerals and jubilees - tens of thousands a year, and almost all of them come back."
 COLDWAR_DDR_border_dismantle_the_sm70: "Dismantle the SM-70"
 COLDWAR_DDR_border_dismantle_the_sm70_desc: "1983-84: as part of the price for Strauss's billion-mark credits the self-firing devices and the minefields disappear from the inner-German border."
 COLDWAR_DDR_navy_air_the_coast_and_the_skies: "The Coast and the Skies"
 COLDWAR_DDR_navy_air_the_coast_and_the_skies_desc: "The republic's northern flank is the Baltic coast from Wismar to Usedom; its sky lies minutes from NATO's airfields. The Volksmarine and the Air Forces/Air Defence guard both."
 COLDWAR_DDR_navy_air_the_volksmarine: "The Volksmarine"
 COLDWAR_DDR_navy_air_the_volksmarine_desc: "Some 16,000 sailors with headquarters in Rostock: frigates, minesweepers, landing ships and fast attack craft."
 COLDWAR_DDR_navy_air_a_coastal_navy: "A Coastal Navy"
 COLDWAR_DDR_navy_air_a_coastal_navy_desc: "The Volksmarine stays what the Pact wants: minesweepers, landing ships and fast boats for the western Baltic and the straits."
 COLDWAR_DDR_navy_air_blue_water_ambitions: "Blue-Water Ambitions"
 COLDWAR_DDR_navy_air_blue_water_ambitions_desc: "Alt-history: frigates for the North Sea, port calls in Luanda and Havana - the flag of the republic seen beyond the Baltic."
 COLDWAR_DDR_navy_air_the_6th_flotilla: "The 6th Flotilla"
 COLDWAR_DDR_navy_air_the_6th_flotilla_desc: "On Rügen the 6th Flotilla keeps the fast torpedo and missile boats, ready to strike at shipping in the Danish straits."
 COLDWAR_DDR_navy_air_the_coastal_missile_regiment: "The Coastal Missile Regiment"
 COLDWAR_DDR_navy_air_the_coastal_missile_regiment_desc: "From 1983 mobile launchers with anti-ship missiles hide behind the dunes - no landing fleet would reach Rügen unseen."
 COLDWAR_DDR_navy_air_the_peene_shipyard: "The Peene Shipyard"
 COLDWAR_DDR_navy_air_the_peene_shipyard_desc: "At Wolgast the Peene shipyard builds the Volksmarine's own warships - in the 1980s its Parchim-class corvettes are even ordered by the Soviet Navy."
 COLDWAR_DDR_navy_air_the_united_baltic_fleets: "The United Baltic Fleets"
 COLDWAR_DDR_navy_air_the_united_baltic_fleets_desc: "In war the Volksmarine, the Polish Navy and the Soviet Baltic Fleet sail as one force under a Soviet admiral - their target is the Danish straits."
 COLDWAR_DDR_navy_air_air_forces_and_air_defence: "Air Forces and Air Defence"
 COLDWAR_DDR_navy_air_air_forces_and_air_defence_desc: "The LSK/LV is wired into the Pact's unified air defence: its fighters stand on 'duty system' alert under Soviet command, day and night."
 COLDWAR_DDR_navy_air_the_mig21_wings: "The MiG-21 Wings"
 COLDWAR_DDR_navy_air_the_mig21_wings_desc: "The MiG-21, in a dozen variants, is the backbone of the fighter wings of the 1st and 3rd Air Defence Divisions."
 COLDWAR_DDR_navy_air_shield_of_the_republic: "Shield of the Republic"
 COLDWAR_DDR_navy_air_shield_of_the_republic_desc: "The LSK/LV stays what it was built to be: an air-defence force that keeps NATO bombers out of the republic's sky, interceptors on five-minute alert."
 COLDWAR_DDR_navy_air_front_aviation: "Front Aviation"
 COLDWAR_DDR_navy_air_front_aviation_desc: "Fighter-bombers join the LSK/LV - first the MiG-23BN, later the Su-22: the air force learns to strike ahead of the tank divisions of the first echelon."
 COLDWAR_DDR_navy_air_the_mig23_interceptors: "The MiG-23 Interceptors"
 COLDWAR_DDR_navy_air_the_mig23_interceptors_desc: "From 1978 the MiG-23 arrives - the first fighter of the republic with variable-sweep wings and a real search radar."
 COLDWAR_DDR_navy_air_the_combat_helicopter_wings: "The Combat Helicopter Wings"
 COLDWAR_DDR_navy_air_the_combat_helicopter_wings_desc: "Mi-8 transports and, from 1978, Mi-24 gunships form the combat helicopter wings - flying artillery for the tank divisions."
 COLDWAR_DDR_navy_air_the_mig29_arrives: "The MiG-29 Arrives"
 COLDWAR_DDR_navy_air_the_mig29_arrives_desc: "1988: Fighter Wing 3 at Preschen receives the MiG-29 - a fighter as good as anything NATO flies, bought as the republic's money runs out."
 COLDWAR_DDR_navy_air_the_missile_belts: "The Missile Belts"
 COLDWAR_DDR_navy_air_the_missile_belts_desc: "Rings of S-75 Dvina and S-125 Neva batteries cover Berlin, the industrial south and the coast, fed by the radar chain from the Baltic to the Fichtelberg."
 COLDWAR_DDR_navy_air_cameras_from_jena: "Cameras from Jena"
 COLDWAR_DDR_navy_air_cameras_from_jena_desc: "Interkosmos: the socialist countries do space science together. In 1976 the MKF-6 multispectral camera of Carl Zeiss Jena photographs the earth from Soyuz 22."
 COLDWAR_DDR_navy_air_a_german_in_space: "A German in Space"
 COLDWAR_DDR_navy_air_a_german_in_space_desc: "Two air-force pilots, Sigmund Jähn and Eberhard Köllner, train at Star City. If Moscow agrees, the first German in space will be a citizen of the GDR."
 COLDWAR_DDR_kg_the_combat_groups_of_the_working_class: "The Combat Groups of the Working Class"
 COLDWAR_DDR_kg_the_combat_groups_of_the_working_class_desc: "Some 400,000 workers in grey-green uniform, organised by factory and commanded by the party - in August 1961 they stood at the Brandenburg Gate."
 COLDWAR_DDR_kg_a_hundred_in_every_factory: "A Hundred in Every Factory"
 COLDWAR_DDR_kg_a_hundred_in_every_factory_desc: "Every large enterprise has its own combat-group hundred; training happens after the shift, on Saturdays and in summer camps."
 COLDWAR_DDR_kg_the_motorised_battalions: "The Motorised Battalions"
 COLDWAR_DDR_kg_the_motorised_battalions_desc: "The best hundreds become motorised battalions with armoured personnel carriers, mortars and anti-tank guns - a second line behind the NVA."
 COLDWAR_DDR_kg_the_factory_guard: "The Factory Guard"
 COLDWAR_DDR_kg_the_factory_guard_desc: "The combat groups' real task is the home front: guarding plants, securing streets and crushing 'counter-revolutionary' unrest - a party militia against another 17 June."
 COLDWAR_DDR_kg_the_territorial_reserve: "The Territorial Reserve"
 COLDWAR_DDR_kg_the_territorial_reserve_desc: "Alt-history: the combat groups join the NVA's territorial defence - a trained reserve of hundreds of thousands under military, not party, command."
 COLDWAR_DDR_kg_the_society_for_sport_and_technology: "The Society for Sport and Technology"
 COLDWAR_DDR_kg_the_society_for_sport_and_technology_desc: "The GST teaches the young to shoot, dive, glide, drive and send Morse code - hundreds of thousands of members preparing for military service."
 COLDWAR_DDR_kg_pre_military_training: "Pre-Military Training"
 COLDWAR_DDR_kg_pre_military_training_desc: "Apprentices and students spend weeks in GST camps; the NVA receives conscripts who already know how to march and shoot."
 COLDWAR_DDR_kg_military_education_in_schools: "Military Education in Schools"
 COLDWAR_DDR_kg_military_education_in_schools_desc: "1 September 1978: ninth- and tenth-graders get compulsory military lessons. The Protestant churches protest openly - and the peace movement is born."
 COLDWAR_DDR_kg_the_social_peace_service: "The Social Peace Service"
 COLDWAR_DDR_kg_the_social_peace_service_desc: "Alt-history: in 1981 Dresden church circles propose a civilian 'social peace service' instead of arms. The state accepts - and the construction soldiers become nurses and builders."
 COLDWAR_DDR_kg_civil_defence: "Civil Defence"
 COLDWAR_DDR_kg_civil_defence_desc: "The Civil Defence Law of 1970 makes protection against air raids and nuclear war a duty of every citizen, every factory and every district."
 COLDWAR_DDR_kg_the_state_reserve: "The State Reserve"
 COLDWAR_DDR_kg_the_state_reserve_desc: "Secret depots hold fuel, grain, medicines and spare parts for months of war or blockade - one of the republic's best-kept secrets."
 COLDWAR_DDR_mfs_the_ministry_for_state_security: "The Ministry for State Security"
 COLDWAR_DDR_mfs_the_ministry_for_state_security_desc: "Normannenstraße, Berlin-Lichtenberg: 43,000 full-time officers under Erich Mielke in 1970 - 'the shield and sword of the party'."
 COLDWAR_DDR_mfs_the_main_directorate_for_reconnaissance: "The Main Directorate for Reconnaissance"
 COLDWAR_DDR_mfs_the_main_directorate_for_reconnaissance_desc: "Markus Wolf's HV A - led by 'the man without a face' - runs some of the best-placed agents in Bonn, at NATO and in the Bundeswehr."
 COLDWAR_DDR_mfs_romeo_agents: "Romeo Agents"
 COLDWAR_DDR_mfs_romeo_agents_desc: "Handsome young officers go west to court lonely secretaries in Bonn's ministries - love letters that end in the HV A's files."
 COLDWAR_DDR_mfs_the_guillaume_affair: "The Guillaume Affair"
 COLDWAR_DDR_mfs_the_guillaume_affair_desc: "24 April 1974: Günter Guillaume, aide to Chancellor Brandt, is arrested as an HV A officer; Brandt resigns on 6 May. Even Wolf later counts it among his defeats."
 COLDWAR_DDR_mfs_sector_science_and_technology: "Sector Science and Technology"
 COLDWAR_DDR_mfs_sector_science_and_technology_desc: "The HV A's Sector Science and Technology steals what the COCOM embargo forbids: chip designs, software and machine-tool plans worth billions of marks of saved research."
 COLDWAR_DDR_mfs_the_informer_network: "The Informer Network"
 COLDWAR_DDR_mfs_the_informer_network_desc: "Some 100,000 unofficial collaborators in 1970, 180,000 by 1975: colleagues, neighbours, pastors and spouses who report to a handling officer."
 COLDWAR_DDR_mfs_decomposition: "Decomposition"
 COLDWAR_DDR_mfs_decomposition_desc: "Directive 1/76: instead of arrests, quiet destruction - Zersetzung: rumours, lost jobs, broken marriages, failed exams. Opponents fall apart without a single trial for the West to see."
 COLDWAR_DDR_mfs_open_repression: "Open Repression"
 COLDWAR_DDR_mfs_open_repression_desc: "Alt-history: the methods of the 1950s return - show trials, mass arrests, open intimidation. The streets fall silent, and the whole world watches."
 COLDWAR_DDR_mfs_hohenschoenhausen_and_bautzen: "Hohenschönhausen and Bautzen II"
 COLDWAR_DDR_mfs_hohenschoenhausen_and_bautzen_desc: "The remand prison in Berlin-Hohenschönhausen, missing from every city map, and the special prison Bautzen II for the state's most prominent enemies - some of whom Bonn will later buy free."
 COLDWAR_DDR_mfs_the_dzerzhinsky_guards_regiment: "The Dzerzhinsky Guards Regiment"
 COLDWAR_DDR_mfs_the_dzerzhinsky_guards_regiment_desc: "The MfS's own motorised regiment, named after the founder of the Cheka, guards the Politburo's settlement at Wandlitz, the ministries and - in a crisis - the streets of Berlin."
 COLDWAR_DDR_mfs_counter_intelligence: "Counter-Intelligence"
 COLDWAR_DDR_mfs_counter_intelligence_desc: "Main Department II hunts the agents of the BND and the CIA - and turns the ones it catches into double agents."
 COLDWAR_DDR_mfs_the_operative_technical_sector: "The Operative-Technical Sector"
 COLDWAR_DDR_mfs_the_operative_technical_sector_desc: "Bugs, steamed letters, hidden cameras and jars of scent samples for the dogs: the ministry's workshops build the tools of total surveillance."
 COLDWAR_DDR_mfs_mielkes_empire: "Mielke's Empire"
 COLDWAR_DDR_mfs_mielkes_empire_desc: "From 43,000 officers in 1970 to 81,000 in 1982: the ministry grows faster than any other part of the state - and costs more every year."
 COLDWAR_DDR_mfs_under_the_partys_control: "Under the Party's Control"
 COLDWAR_DDR_mfs_under_the_partys_control_desc: "Alt-history: the Central Committee's security department caps the ministry's growth. Fewer officers, more budget for the plan - and a Mielke who must ask before he acts."
 COLDWAR_DDR_mfs_who_is_who: "Who Is Who?"
 COLDWAR_DDR_mfs_who_is_who_desc: "Mielke's eternal question: who is who? By the 1980s the files fill more than a hundred kilometres of shelves - the ministry knows everything about everyone."
 COLDWAR_DDR_mfs_the_officer_on_special_assignment: "The Officer on Special Assignment"
 COLDWAR_DDR_mfs_the_officer_on_special_assignment_desc: "Alexander Schalck-Golodkowski, head of Commercial Coordination, is an MfS colonel on special assignment: the ministry protects KoKo's hard-currency deals - and takes its share."
 COLDWAR_DDR_soc_the_socialist_way_of_life: "The Socialist Way of Life"
 COLDWAR_DDR_soc_the_socialist_way_of_life_desc: "Crèche, Pioneers, FDJ, brigade, trade-union holiday, the queue for a flat: the state accompanies its citizens from the cradle to the pension - and expects loyalty in return."
 COLDWAR_DDR_soc_the_fdj_and_the_young_pioneers: "The FDJ and the Young Pioneers"
 COLDWAR_DDR_soc_the_fdj_and_the_young_pioneers_desc: "Blue scarves for the six-year-olds, blue shirts for the fourteen-year-olds: almost every child marches in the Ernst Thälmann Pioneer Organisation and the Free German Youth."
 COLDWAR_DDR_soc_the_youth_dedication: "The Jugendweihe"
 COLDWAR_DDR_soc_the_youth_dedication_desc: "At fourteen, nearly all young people pledge themselves to socialism in a secular ceremony, the Jugendweihe, that has all but replaced confirmation."
 COLDWAR_DDR_soc_the_festival_generation: "The Festival Generation"
 COLDWAR_DDR_soc_the_festival_generation_desc: "July-August 1973: the X World Festival of Youth and Students brings 25,000 foreign guests and eight million visitors to East Berlin - nine days in which the republic looks open and young."
 COLDWAR_DDR_soc_no_taboos: "No Taboos"
 COLDWAR_DDR_soc_no_taboos_desc: "December 1971: Honecker promises 'no taboos' in art for those who stand on firm socialist ground. Plenzdorf's 'The New Sufferings of Young W.' fills the theatres."
 COLDWAR_DDR_soc_the_cultural_freeze: "The Cultural Freeze"
 COLDWAR_DDR_soc_the_cultural_freeze_desc: "Socialist realism or nothing: books are pulled, plays cancelled - and when Wolf Biermann is stripped of his citizenship, a stream of artists follows him west."
 COLDWAR_DDR_soc_rock_from_the_east: "Rock from the East"
 COLDWAR_DDR_soc_rock_from_the_east_desc: "The Puhdys, Karat and City fill the stadiums with German-language rock; the state label Amiga presses the records, and the 60/40 rule keeps Western songs to a minimum on the radio."
 COLDWAR_DDR_soc_munich_1972: "Munich 1972"
 COLDWAR_DDR_soc_munich_1972_desc: "At the Olympic Games in Munich the GDR team, under its own flag and anthem, wins 66 medals and finishes third - ahead of the hosts."
 COLDWAR_DDR_soc_state_plan_14_25: "State Plan 14.25"
 COLDWAR_DDR_soc_state_plan_14_25_desc: "1974: the leadership secretly makes 'supporting means' state policy. Thousands of athletes, many of them minors, receive anabolic steroids they are told are vitamins."
 COLDWAR_DDR_soc_sport_for_everyone: "Sport for Everyone"
 COLDWAR_DDR_soc_sport_for_everyone_desc: "Alt-history: the doping plan is rejected. The money goes to mass sport - 'everyone, everywhere, once a week' - and the medals come a little more slowly."
 COLDWAR_DDR_soc_montreal_1976: "Montreal 1976"
 COLDWAR_DDR_soc_montreal_1976_desc: "Montreal 1976: the republic of seventeen million wins 40 gold medals - more than the United States, second only to the Soviet Union."
 COLDWAR_DDR_soc_a_creche_for_every_child: "A Crèche for Every Child"
 COLDWAR_DDR_soc_a_creche_for_every_child_desc: "With almost nine in ten women at work, the state builds crèches and kindergartens on a scale no Western country matches."
 COLDWAR_DDR_soc_the_abortion_law_of_1972: "The Abortion Law of 1972"
 COLDWAR_DDR_soc_the_abortion_law_of_1972_desc: "9 March 1972: the Volkskammer legalises abortion in the first twelve weeks - and for the first time in its history, members of the CDU vote against a law."
 COLDWAR_DDR_soc_the_baby_year: "The Baby Year"
 COLDWAR_DDR_soc_the_baby_year_desc: "From 1976 mothers get a paid year off after their second child, marriage loans that shrink with every birth, and priority for a flat."
 COLDWAR_DDR_soc_not_alongside_not_against: "Not Alongside, Not Against"
 COLDWAR_DDR_soc_not_alongside_not_against_desc: "1971: the Federation of Evangelical Churches in the GDR declares that it wants to be a church 'not alongside, not against, but in socialism'."
 COLDWAR_DDR_soc_the_agreement_of_6_march_1978: "The Agreement of 6 March 1978"
 COLDWAR_DDR_soc_the_agreement_of_6_march_1978_desc: "6 March 1978: Honecker receives Bishop Schönherr. The churches get airtime, prison chaplains and new church buildings; in return they stay out of politics - for a while."
 COLDWAR_DDR_soc_the_battle_of_the_airwaves: "The Battle of the Airwaves"
 COLDWAR_DDR_soc_the_battle_of_the_airwaves_desc: "Every evening at eight the republic switches to the Tagesschau. The party must decide: fight the antennas or live with them."
 COLDWAR_DDR_soc_the_antenna_campaign: "The Antenna Campaign"
 COLDWAR_DDR_soc_the_antenna_campaign_desc: "As in 'Operation Ochsenkopf' of 1961, FDJ brigades climb the roofs and saw off every antenna that points west. Fewer people watch - and everyone resents it."
 COLDWAR_DDR_soc_honeckers_tolerance: "Honecker's Tolerance"
 COLDWAR_DDR_soc_honeckers_tolerance_desc: "1973: Honecker concedes that anyone may switch Western television on and off as he likes. The raids stop; the comparison with the West stays."
 COLDWAR_DDR_soc_the_black_channel: "The Black Channel"
 COLDWAR_DDR_soc_the_black_channel_desc: "Every Monday Karl-Eduard von Schnitzler cuts up West German news clips and explains what they really mean - the republic watches the enemy and argues back."
 COLDWAR_DDR_ger_two_states_in_germany: "Two States in Germany"
 COLDWAR_DDR_ger_two_states_in_germany_desc: "28 October 1969: Willy Brandt tells the Bundestag that there are two states in Germany - without recognising the second one. East Berlin must find an answer."
 COLDWAR_DDR_ger_the_erfurt_summit: "The Erfurt Summit"
 COLDWAR_DDR_ger_the_erfurt_summit_desc: "19 March 1970: Willy Brandt steps off the train in Erfurt. Under the windows of the Erfurter Hof the crowd calls for the Western chancellor - and the MfS clears the square."
 COLDWAR_DDR_ger_the_kassel_meeting: "The Kassel Meeting"
 COLDWAR_DDR_ger_the_kassel_meeting_desc: "21 May 1970: Willi Stoph in Kassel. Protesters tear down the flag of the republic, Brandt offers twenty points, Stoph insists on recognition - and both sides agree on a 'pause for reflection'."
 COLDWAR_DDR_ger_recognition_first: "Recognition First"
 COLDWAR_DDR_ger_recognition_first_desc: "No treaty without full recognition under international law - and, Stoph added in Erfurt, 100 billion marks for the damage done by the open border before 1961."
 COLDWAR_DDR_ger_practical_steps: "Practical Steps"
 COLDWAR_DDR_ger_practical_steps_desc: "Post, telephone, transit, trade: settle what can be settled and leave the big words to the communiqués. Moscow suspects East Berlin of running its own German policy."
 COLDWAR_DDR_ger_signed_without_us: "Signed Without Us"
 COLDWAR_DDR_ger_signed_without_us_desc: "12 August 1970: Brandt and Kosygin sign the Moscow Treaty. The borders of the republic are declared inviolable - in a treaty nobody asked East Berlin about."
 COLDWAR_DDR_ger_the_swing_credit: "The Swing Overdraft"
 COLDWAR_DDR_ger_the_swing_credit_desc: "Inner-German trade runs on an interest-free overdraft: the swing lets the republic buy in the West today and pay in goods later - 850 million units of account from 1975."
 COLDWAR_DDR_ger_the_transit_agreement: "The Transit Agreement"
 COLDWAR_DDR_ger_the_transit_agreement_desc: "17 December 1971: Michael Kohl and Egon Bahr sign the first agreement between the two German governments - sealed lorries and buses to West Berlin, no more random searches."
 COLDWAR_DDR_ger_freikauf: "Freikauf"
 COLDWAR_DDR_ger_freikauf_desc: "Freikauf - since 1963 Bonn has bought political prisoners free through the lawyer Wolfgang Vogel - some forty thousand marks a head, paid in goods through the Protestant church. The republic sells its own citizens."
 COLDWAR_DDR_ger_the_transit_lump_sum: "The Transit Lump Sum"
 COLDWAR_DDR_ger_the_transit_lump_sum_desc: "Instead of tolls at the checkpoints Bonn pays a lump sum: 234.9 million marks a year at first, 525 million from 1980 - and the MfS watches every lay-by on the transit routes."
 COLDWAR_DDR_ger_the_basic_treaty: "The Basic Treaty"
 COLDWAR_DDR_ger_the_basic_treaty_desc: "21 December 1972: Bahr and Kohl sign in East Berlin. Two equal states and an inviolable border - but permanent missions instead of embassies, because Bonn still speaks of one nation."
 COLDWAR_DDR_ger_the_policy_of_demarcation: "The Policy of Demarcation"
 COLDWAR_DDR_ger_the_policy_of_demarcation_desc: "Two states, two nations: the socialist nation in the GDR has nothing in common with the bourgeois one in the FRG. Contacts with Westerners are reported, and in November 1973 the minimum exchange for visitors is doubled to twenty marks."
 COLDWAR_DDR_ger_special_relations: "Special Relations"
 COLDWAR_DDR_ger_special_relations_desc: "Rapprochement instead of Demarcation: the two German states are foreign countries to each other only on paper. Trade, visits and credits flow - and Moscow starts counting them."
 COLDWAR_DDR_ger_the_border_commission: "The Border Commission"
 COLDWAR_DDR_ger_the_border_commission_desc: "From 1973 a joint commission marks the inner-German border stone by stone. By 1978 it is done - except along the Elbe, where Bonn insists that the border runs on the eastern bank."
 COLDWAR_DDR_ger_twenty_five_marks_a_day: "Twenty-Five Marks a Day"
 COLDWAR_DDR_ger_twenty_five_marks_a_day_desc: "13 October 1980: every Western visitor must now change twenty-five marks a day at one to one - pensioners and children included. Visits from the West drop sharply; the treasury does not complain."
 COLDWAR_DDR_ger_the_strauss_credit: "The Strauss Credit"
 COLDWAR_DDR_ger_the_strauss_credit_desc: "June 1983: Franz Josef Strauss, the West's loudest anti-communist, arranges a bank credit of one billion marks with Bonn's guarantee. Schalck-Golodkowski negotiates; Moscow is told afterwards."
 COLDWAR_DDR_ger_the_cultural_agreement: "The Cultural Agreement"
 COLDWAR_DDR_ger_the_cultural_agreement_desc: "6 May 1986: after twelve years of talks the two states sign a cultural agreement - exhibitions, orchestras, art treasures scattered by the war - and Saarlouis twins with Eisenhüttenstadt, the first of some sixty town twinnings."
 COLDWAR_DDR_ger_common_security: "Common Security"
 COLDWAR_DDR_ger_common_security_desc: "1985-87: the SED and Bonn's Social Democrats draft a chemical-weapons-free zone, a nuclear-free corridor and a joint paper on 'the dispute of ideologies'. For once the party admits that the class enemy may also want peace."
 COLDWAR_DDR_rec_against_the_hallstein_doctrine: "Against the Hallstein Doctrine"
 COLDWAR_DDR_rec_against_the_hallstein_doctrine_desc: "Since 1955 Bonn has threatened every state that recognises the GDR with the loss of West German aid. In January 1970 barely half a dozen non-socialist capitals have dared."
 COLDWAR_DDR_rec_friends_in_the_arab_world: "Friends in the Arab World"
 COLDWAR_DDR_rec_friends_in_the_arab_world_desc: "1969 broke the doctrine: Iraq, Sudan, Syria, South Yemen and Egypt recognised the republic, Algeria follows in May 1970. Now the friendships need treaties."
 COLDWAR_DDR_rec_cultural_diplomacy: "Cultural Diplomacy"
 COLDWAR_DDR_rec_cultural_diplomacy_desc: "The Thomanerchor, the Dresden Staatskapelle and the Berliner Ensemble tour capitals that do not recognise the republic - Bach and Brecht open doors that diplomats cannot."
 COLDWAR_DDR_rec_the_road_to_new_delhi: "The Road to New Delhi"
 COLDWAR_DDR_rec_the_road_to_new_delhi_desc: "India, the largest democracy of the Third World, keeps a trade mission in East Berlin and a treaty with Moscow. On 8 October 1972 it opens an embassy."
 COLDWAR_DDR_rec_the_leipzig_fair: "The Leipzig Fair"
 COLDWAR_DDR_rec_the_leipzig_fair_desc: "Every spring and autumn Leipzig becomes the republic's shop window: Western ministers and industrialists who cannot be received in Berlin come to the fair."
 COLDWAR_DDR_rec_the_recognition_wave: "The Recognition Wave"
 COLDWAR_DDR_rec_the_recognition_wave_desc: "Between 1972 and 1974 the dam breaks: dozens of states establish relations with the republic, from Bangladesh to Japan and Australia."
 COLDWAR_DDR_rec_paris_and_london: "Paris and London"
 COLDWAR_DDR_rec_paris_and_london_desc: "9 February 1973: Britain and France, two of the four powers responsible for Berlin, establish diplomatic relations with the republic on the same day."
 COLDWAR_DDR_rec_the_neutral_capitals: "The Neutral Capitals"
 COLDWAR_DDR_rec_the_neutral_capitals_desc: "December 1972 and January 1973: Bern, Vienna, Stockholm and Helsinki recognise the republic - Finland on the same day as the Federal Republic."
 COLDWAR_DDR_rec_embassies_in_the_west: "Embassies in the West"
 COLDWAR_DDR_rec_embassies_in_the_west_desc: "The flag of the republic flies over embassies in London, Paris, Rome and The Hague. Recognised at last - and watched at last, because Western embassies talk to dissidents too."
 COLDWAR_DDR_rec_the_133rd_member: "The 133rd Member"
 COLDWAR_DDR_rec_the_133rd_member_desc: "18 September 1973: the General Assembly admits both German states. The GDR becomes the 133rd member of the United Nations, one seat ahead of the Federal Republic."
 COLDWAR_DDR_rec_an_embassy_in_washington: "An Embassy in Washington"
 COLDWAR_DDR_rec_an_embassy_in_washington_desc: "4 September 1974: the United States, the last of the four powers, establishes diplomatic relations with the republic."
 COLDWAR_DDR_rec_the_anti_imperialist_voice: "The Anti-Imperialist Voice"
 COLDWAR_DDR_rec_the_anti_imperialist_voice_desc: "In the General Assembly the republic votes with the liberation movements and the non-aligned: against apartheid, against colonial wars, for a new international economic order."
 COLDWAR_DDR_rec_the_peace_state: "The Peace State"
 COLDWAR_DDR_rec_the_peace_state_desc: "The republic presents itself as the German state from which no war will ever start: disarmament proposals, conferences and a nuclear-free corridor through Central Europe."
 COLDWAR_DDR_rec_the_helsinki_final_act: "The Helsinki Final Act"
 COLDWAR_DDR_rec_the_helsinki_final_act_desc: "1 August 1975: the First Secretary and Chancellor Schmidt sign side by side. The borders are inviolable - and Basket Three promises freedom of movement. Within a year thousands quote Helsinki in their exit applications."
 COLDWAR_DDR_rec_borders_before_rights: "Borders Before Rights"
 COLDWAR_DDR_rec_borders_before_rights_desc: "The Final Act guarantees the border, not the right to cross it. Exit applicants lose their jobs, and the MfS sets up a central group against flight and emigration."
 COLDWAR_DDR_rec_basket_three: "Basket Three"
 COLDWAR_DDR_rec_basket_three_desc: "Take the signature seriously: family reunions, visas for journalists, exit permits for those who insist. The pressure valve opens - and the West notices."
 COLDWAR_DDR_rec_a_state_among_states: "A State Among States"
 COLDWAR_DDR_rec_a_state_among_states_desc: "January 1988: the head of the republic is received in Paris with full honours, and a GDR diplomat presides over the UN General Assembly. Recognition is complete - legitimacy is another matter."
 COLDWAR_DDR_wp_the_brotherly_alliance: "The Brotherly Alliance"
 COLDWAR_DDR_wp_the_brotherly_alliance_desc: "Twenty Soviet divisions, Soviet oil, Soviet protection: the republic owes its existence to Moscow and never forgets it - nor is it allowed to."
 COLDWAR_DDR_wp_summers_in_the_crimea: "Summers in the Crimea"
 COLDWAR_DDR_wp_summers_in_the_crimea_desc: "Every summer the First Secretary flies to Brezhnev at Oreanda: a swim in the Black Sea, a long walk, and the year's quarrels settled between two men."
 COLDWAR_DDR_wp_the_treaty_of_1975: "The Treaty of 1975"
 COLDWAR_DDR_wp_the_treaty_of_1975_desc: "7 October 1975: a new treaty of friendship for twenty-five years. Unlike the treaty of 1964 it no longer speaks of German unity - only of the alliance."
 COLDWAR_DDR_wp_the_comprehensive_programme: "The Comprehensive Programme"
 COLDWAR_DDR_wp_the_comprehensive_programme_desc: "July 1971, Bucharest: Comecon adopts its Comprehensive Programme for socialist economic integration - joint plans, joint research, joint investment."
 COLDWAR_DDR_wp_joint_investment_projects: "Joint Investment Projects"
 COLDWAR_DDR_wp_joint_investment_projects_desc: "Builders and machines from the republic go to Siberia: the Ust-Ilimsk pulp combine is paid for with East German work and repaid with pulp and paper for years."
 COLDWAR_DDR_wp_the_bucharest_formula: "The Bucharest Formula"
 COLDWAR_DDR_wp_the_bucharest_formula_desc: "From 1975 Comecon prices follow a moving average of world prices. After the oil shock Soviet crude gets dearer every year - and the republic pays in goods it would rather sell for marks."
 COLDWAR_DDR_wp_refine_for_the_west: "Refine for the West"
 COLDWAR_DDR_wp_refine_for_the_west_desc: "Schwedt and Leuna crack Soviet crude into diesel and heating oil for Western customers while the republic heats with lignite. Moscow notices where its cheap oil ends up."
 COLDWAR_DDR_wp_pay_in_machines: "Pay in Machines"
 COLDWAR_DDR_wp_pay_in_machines_desc: "Every tonne of oil is paid in sleeping cars from Ammendorf, ships from Rostock and machine tools from Karl-Marx-Stadt - goods the shops at home will never see."
 COLDWAR_DDR_wp_visa_free_to_warsaw_and_prague: "Visa-Free to Warsaw and Prague"
 COLDWAR_DDR_wp_visa_free_to_warsaw_and_prague_desc: "1 January 1972: an identity card is enough to cross the Oder or the Ore Mountains. Millions travel - and Polish shoppers empty the shelves of Frankfurt on the Oder."
 COLDWAR_DDR_wp_the_polish_crisis: "The Polish Crisis"
 COLDWAR_DDR_wp_the_polish_crisis_desc: "August 1980: the Lenin Shipyard in Gdansk strikes and Solidarity is born. On 30 October the republic closes its border to Polish visitors - the contagion must not cross the Oder."
 COLDWAR_DDR_wp_urge_fraternal_assistance: "Urge Fraternal Assistance"
 COLDWAR_DDR_wp_urge_fraternal_assistance_desc: "26 November 1980: the First Secretary writes to Brezhnev that Poland is lost without collective action. NVA divisions stand ready for the manoeuvre 'Soyuz-80'."
 COLDWAR_DDR_wp_let_warsaw_decide: "Let Warsaw Decide"
 COLDWAR_DDR_wp_let_warsaw_decide_desc: "The republic warns Moscow against a second Prague: the Poles must solve their crisis themselves - and the republic keeps its trade with the West."
 COLDWAR_DDR_wp_the_euromissile_crisis: "The Euromissile Crisis"
 COLDWAR_DDR_wp_the_euromissile_crisis_desc: "November 1983: the Bundestag approves the Pershing II, the Soviet delegation walks out of Geneva, and Moscow announces new missiles for the GDR and Czechoslovakia."
 COLDWAR_DDR_wp_the_counter_deployment: "The Counter-Deployment"
 COLDWAR_DDR_wp_the_counter_deployment_desc: "Soviet OTR-22 missiles roll into Saxony and Mecklenburg; later the NVA receives its own OTR-23 launchers. The church's peace groups sew 'Swords into Ploughshares' onto their jackets."
 COLDWAR_DDR_wp_damage_limitation: "Damage Limitation"
 COLDWAR_DDR_wp_damage_limitation_desc: "The missiles are 'the devil's work', the First Secretary says, and writes to Chancellor Kohl of a coalition of reason: the damage to German-German relations must be limited."
 COLDWAR_DDR_wp_the_unbreakable_bond: "The Unbreakable Bond"
 COLDWAR_DDR_wp_the_unbreakable_bond_desc: "Whatever the quarrels over oil, Poland or missiles, the republic stands where it was founded: in the first strategic echelon of the socialist community."
 COLDWAR_DDR_sol_the_solidarity_committee: "The Solidarity Committee"
 COLDWAR_DDR_sol_the_solidarity_committee_desc: "Every trade unionist buys solidarity stamps: millions of marks a year for liberation movements and young states, handed out by the Afro-Asian Solidarity Committee."
 COLDWAR_DDR_sol_solidarity_with_vietnam: "Solidarity with Vietnam"
 COLDWAR_DDR_sol_solidarity_with_vietnam_desc: "The republic's most popular cause: medicine, trucks and hospital equipment for Hanoi, Vietnamese students in Dresden and Leipzig, schoolchildren collecting for 'the heroic Vietnamese people'."
 COLDWAR_DDR_sol_workers_from_hanoi: "Workers from Hanoi"
 COLDWAR_DDR_sol_workers_from_hanoi_desc: "Trainees from 1973, contract workers from 1980: tens of thousands of Vietnamese work in the Kombinate for four or five years, live in hostels and send goods home by the crate."
 COLDWAR_DDR_sol_ernst_thaelmann_island: "Ernst Thälmann Island"
 COLDWAR_DDR_sol_ernst_thaelmann_island_desc: "June 1972: Fidel Castro names a small Caribbean cay after the murdered KPD leader. Trucks and machine tools go to Havana, sugar and oranges come back - and from 1978 Cuban apprentices follow."
 COLDWAR_DDR_sol_exiles_from_santiago: "Exiles from Santiago"
 COLDWAR_DDR_sol_exiles_from_santiago_desc: "11 September 1973: Pinochet's coup ends Allende's Chile. Some two thousand Chilean exiles find refuge in the republic, the Socialist leader Carlos Altamirano among them."
 COLDWAR_DDR_sol_sandinista_nicaragua: "Sandinista Nicaragua"
 COLDWAR_DDR_sol_sandinista_nicaragua_desc: "19 July 1979: the Sandinistas enter Managua. Teachers, doctors and police instructors follow from the republic; in 1985 the Carlos Marx Hospital opens in Managua."
 COLDWAR_DDR_sol_africa_after_the_empire: "Africa After the Empire"
 COLDWAR_DDR_sol_africa_after_the_empire_desc: "25 April 1974: the Carnation Revolution in Lisbon ends Portugal's empire. In Mozambique and Angola the movements the republic has supplied for a decade take power."
 COLDWAR_DDR_sol_the_word_as_a_weapon: "The Word as a Weapon"
 COLDWAR_DDR_sol_the_word_as_a_weapon_desc: "Printing presses, radio transmitters, FDJ Friendship Brigades and thousands of scholarships: the republic exports teachers and textbooks rather than rifles."
 COLDWAR_DDR_sol_advisers_and_arms: "Advisers and Arms"
 COLDWAR_DDR_sol_advisers_and_arms_desc: "NVA instructors, MfS advisers and rifles from army stocks: the republic builds armies and security services for its allies - discreetly, and in smaller numbers than the Cubans."
 COLDWAR_DDR_sol_frelimos_mozambique: "FRELIMO's Mozambique"
 COLDWAR_DDR_sol_frelimos_mozambique_desc: "February 1979: a treaty of friendship with Samora Machel. The republic is to modernise the Moatize coal mine and train Mozambican workers - coal and labour for machines and know-how."
 COLDWAR_DDR_sol_the_anc_and_swapo: "The ANC and SWAPO"
 COLDWAR_DDR_sol_the_anc_and_swapo_desc: "The ANC's journal Sechaba is printed in the republic and its fighters train in Mecklenburg; from 1979 hundreds of Namibian children of SWAPO grow up in Bellin and Stassfurt."
 COLDWAR_DDR_sol_the_mpla_in_luanda: "The MPLA in Luanda"
 COLDWAR_DDR_sol_the_mpla_in_luanda_desc: "11 November 1975: Agostinho Neto proclaims independence while the guns of the civil war can be heard in Luanda. The republic sends weapons, instructors and IFA trucks - and takes coffee in return."
 COLDWAR_DDR_sol_the_ethiopian_revolution: "The Ethiopian Revolution"
 COLDWAR_DDR_sol_the_ethiopian_revolution_desc: "1977: Werner Lamberz flies to Addis Ababa. MfS officers build Mengistu's state security, trucks and weapons go to the Ogaden front, and Ethiopian coffee pays part of the bill."
 COLDWAR_DDR_sol_the_cost_of_solidarity: "The Cost of Solidarity"
 COLDWAR_DDR_sol_the_cost_of_solidarity_desc: "1982: the republic is weeks away from insolvency in the West. In the Politburo someone finally asks what the trucks for Angola and the hostels for Hanoi really cost."
 COLDWAR_DDR_sol_solidarity_must_pay: "Solidarity Must Pay"
 COLDWAR_DDR_sol_solidarity_must_pay_desc: "From now on friends pay - in oil, coffee or hard currency. Weapons from army stocks go to Libya, Iraq and Syria; Werner Lamberz's last journey in 1978 was meant to arrange exactly that."
 COLDWAR_DDR_sol_solidarity_without_accounts: "Solidarity Without Accounts"
 COLDWAR_DDR_sol_solidarity_without_accounts_desc: "Internationalism is not a business. The stamps are still sold, the ships still sail to Maputo and Haiphong - and the bill goes to the republic's own consumers."
 COLDWAR_DDR_sol_the_internationalist_republic: "The Internationalist Republic"
 COLDWAR_DDR_sol_the_internationalist_republic_desc: "From the Mekong to the Cape the republic's teachers, doctors, advisers and engineers are its real embassies - a small state with a long reach."
