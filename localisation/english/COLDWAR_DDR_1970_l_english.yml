 COLDWAR_DDR_hard_currency_category: "Hard Currency"
 COLDWAR_DDR_hard_currency_category_desc: "Alexander Schalck-Golodkowski's Commercial Coordination earns D-Marks by any means. The Politburo prefers not to ask how."
 COLDWAR_DDR_intershop: "The Intershop Network"
 COLDWAR_DDR_intershop_desc: "Western goods for Western money - in shops at every border crossing, hotel and port. Citizens with relatives in the West shop there too."
 COLDWAR_DDR_genex: "The Genex Gift Service"
 COLDWAR_DDR_genex_desc: "West Germans order cars, fridges and holidays for their relatives in the East - and pay in D-Marks."
 COLDWAR_DDR_art_and_antiques: "Art and Antiques"
 COLDWAR_DDR_art_and_antiques_desc: "The Kunst und Antiquitäten GmbH sells furniture, paintings and porcelain to Western dealers - much of it taken from private collectors by tax inspectors."
 COLDWAR_DDR_prisoner_ransom: "Prisoners for Goods"
 COLDWAR_DDR_prisoner_ransom_desc: "Another list for Wolfgang Vogel: political prisoners for oil, copper and coffee."
 COLDWAR_DDR_imes_arms_sales: "Arms Exports (IMES)"
 COLDWAR_DDR_imes_arms_sales_desc: "IMES sells rifles, ammunition and trucks from the depot at Kavelstorf to whoever pays in hard currency."
 COLDWAR_DDR_prison_labour: "Prison Labour Contracts"
 COLDWAR_DDR_prison_labour_desc: "Western mail-order houses buy goods made in Bautzen and Hoheneck."
 COLDWAR_DDR_housing_category: "The Housing Programme"
 COLDWAR_DDR_housing_category_desc: "'Every family its own flat by 1990.' Each year the housing construction Kombinate can be driven to build more - at the cost of every other site."
 COLDWAR_DDR_building_drive: "The Building Drive of the Year"
 COLDWAR_DDR_building_drive_desc: "Panel factories in three shifts, FDJ brigades from every district: Marzahn, Halle-Neustadt and Rostock-Lütten Klein grow by another few thousand flats."
 COLDWAR_DDR_kombinat_category: "The Kombinat Contracts"
 COLDWAR_DDR_kombinat_category_desc: "The Kombinate trade with each other by economic contract, not by order from above, and keep a share of what they earn. One sector a year can be put on contracts."
 COLDWAR_DDR_one_sector_trig_tt: "No sector is on contracts yet this year."
 COLDWAR_DDR_contracts_chemistry: "Contracts in Chemistry"
 COLDWAR_DDR_contracts_chemistry_desc: "The Kombinate of chemistry trade with each other by contract for a year."
 COLDWAR_DDR_contracts_machines: "Contracts in Machine Building"
 COLDWAR_DDR_contracts_machines_desc: "The Kombinate of machine building trade with each other by contract for a year."
 COLDWAR_DDR_contracts_electronics: "Contracts in Electronics"
 COLDWAR_DDR_contracts_electronics_desc: "The Kombinate of electronics trade with each other by contract for a year."
 COLDWAR_DDR_military_council_category: "The Military Council"
 COLDWAR_DDR_military_council_category_desc: "The generals promised to return to the barracks. Free elections under the army's guard decide who governs after them."
 COLDWAR_DDR_civilian_rule_tt: "The most popular party other than the Military Council forms the government; elections are allowed."
 COLDWAR_DDR_return_to_civilian_rule: "Return to Civilian Rule"
 COLDWAR_DDR_return_to_civilian_rule_desc: "Free elections under the army's guard; the strongest civilian party forms the government and the generals return to Strausberg."
 COLDWAR_DDR_german_comrades_category: "The German Comrades"
 COLDWAR_DDR_german_comrades_category_desc: "The German Democratic Republic is the Soviet Union's most important ally - and its most stubborn one. Moscow's Trust in East Berlin: §Y[?DDR.COLDWAR_DDR_moscow_trust|0]§!"
 COLDWAR_DDR_endorse_a_change: "Endorse a Change in East Berlin"
 COLDWAR_DDR_endorse_a_change_desc: "The ambassador lets it be known that Moscow would welcome a change at the top of the SED. A Moscow loyalist may then stand for First Secretary."
 COLDWAR_DDR_fraternal_assistance: "Fraternal Assistance"
 COLDWAR_DDR_fraternal_assistance_desc: "East Berlin has defied the Soviet Union. An ultimatum would give it one night to return to the path of socialism - or to face the Soviet Army."
 COLDWAR_DDR_fraternal_open_tt: "The Soviet Union may now decide on §RFraternal Assistance§! against the republic - its own decision."
 COLDWAR_DDR_bow_to_moscow_tt: "Moscow's Trust rises to at least §Y50§!; a government of the SED returns if another party rules."
 COLDWAR_DDR_resist_tt: "The republic leaves the Warsaw Pact. The Soviet Union goes to war to topple our government."
 COLDWAR_DDR_leave_wp_tt: "The republic leaves the §YWarsaw Pact§! and its treaty ties with the Soviet Union."
 COLDWAR_DDR_withdrawal_730_tt: "The Soviet garrison withdraws: the national spirit §YThe Group of Soviet Forces in Germany§! ends in §Y730 days§!."
 COLDWAR_DDR_withdrawal_1095_tt: "The Soviet garrison withdraws: the national spirit §YThe Group of Soviet Forces in Germany§! ends in §Y1095 days§!."
 COLDWAR_DDR_withdrawal_1825_tt: "The Soviet garrison withdraws: the national spirit §YThe Group of Soviet Forces in Germany§! ends in §Y1825 days§!."
 COLDWAR_DDR_accession_moscow_tt: "The republic is bound to Moscow: the §YSoviet Union decides§! whether it lets the republic go (Two Plus Four). If it agrees, the transition year begins."
 COLDWAR_DDR_accession_tt: "After a §Ytransition year§! the republic joins the Federal Republic of Germany peacefully."
 COLDWAR_DDR_allow_elections_tt: "§GElections are allowed.§!"
 COLDWAR_DDR_suspend_elections_tt: "§RElections are abolished.§!"
