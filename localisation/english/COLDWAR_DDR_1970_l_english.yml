 COLDWAR_DDR_housing_programme_unlock_tt: "Unlocks the decisions The Housing Programme: yearly building drives (Plattenbau) - stability up, construction capacity bound (same category as Honecker's programme; whichever focus comes first unlocks it)"
 COLDWAR_DDR_doping_risk_tt: "If the Inner-German course reaches §Y0.6§! or a non-Emerging party governs, §RThe Doping Files§! become public: 'Diplomats in Tracksuits' is lost and stability falls by §R5%§!."
