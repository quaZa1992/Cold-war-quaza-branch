 COLDWAR_DDR_soc_the_antenna_raids: "The Antenna Raids"
 COLDWAR_DDR_soc_the_tolerated_window: "The Tolerated Window"
 COLDWAR_DDR_sol_contract_workers: "Contract Workers"
 COLDWAR_DDR_sol_contract_workers_desc: "Vietnamese, Mozambican and Cuban workers in the Kombinate: four or five years, hostels, wages partly paid home. Separate from the economy's labour-shortage ladder."
 COLDWAR_DDR_sol_contract_worker_programme: "The Contract Worker Programme"
 COLDWAR_DDR_sol_contract_worker_programme_desc: "Some 90,000 contract workers by 1989 - indispensable on the night shift, kept apart from the population."
