 COLDWAR_DDR_flag_polish_border_closed_tt: "Visa-free travel to Poland is suspended on our side of the border (our own rule; nothing changes in Poland)"
 COLDWAR_DDR_cc_category: "The Central Committee"
 COLDWAR_DDR_cc_category_desc: "The First Secretary is not overthrown - he is relieved by the Central Committee. Every candidacy prepared in the focus tree can be put to the plenum here. The candidate needs the support named in his candidacy; if the Soviet Union is led by a player, the Kremlin is consulted first and may veto him (the candidate must then wait 180 days)."
 COLDWAR_DDR_cc_kremlin_ulb_tt: "The Kremlin is consulted first: if Moscow agrees, §YWalter Ulbricht§! becomes First Secretary; if it vetoes, he must wait 180 days."
 COLDWAR_DDR_no_cc_pending_trig_tt: "No vote of the Central Committee is waiting for Moscow's answer."
