 COLDWAR_DDR_german_question_category: "The German Question"
 COLDWAR_DDR_german_question_category_desc: "Two states in one nation. Demarcation keeps Moscow content and the republic closed; Rapprochement brings credits, visits and Western television into every living room.\n\nInner-German course: §Y[?COLDWAR_DDR_course|2]§! (-1 Demarcation, +1 Rapprochement)."
 COLDWAR_DDR_demarcation_campaign: "Demarcation Campaign"
 COLDWAR_DDR_demarcation_campaign_desc: "Abgrenzung: new road signs say 'Capital of the GDR', the anthem loses its text about 'Germany, united fatherland', the constitution its German nation."
 COLDWAR_DDR_transit_talks: "Transit Talks"
 COLDWAR_DDR_transit_talks_desc: "State secretaries Kohl and Bahr meet again: transit routes, visitor passes, postal traffic. Every agreement is a small step towards Bonn."
 COLDWAR_DDR_raise_the_minimum_exchange: "Raise the Minimum Exchange"
 COLDWAR_DDR_raise_the_minimum_exchange_desc: "Every Western visitor must change more D-Marks at one to one. The visits drop; the hard currency rises."
 COLDWAR_DDR_freikauf: "Freikauf"
 COLDWAR_DDR_freikauf_desc: "Another list of political prisoners for the lawyer Wolfgang Vogel. Bonn pays in goods, through the Protestant church."
 COLDWAR_DDR_moscow_category: "Moscow"
 COLDWAR_DDR_moscow_category_desc: "Every road from East Berlin leads through Moscow. Reports, delegations and credits keep the Soviet comrades well disposed.\n\nMoscow's Trust: §Y[?COLDWAR_DDR_moscow_trust|0]§!"
 COLDWAR_DDR_report_to_the_kremlin: "Report to the Kremlin"
 COLDWAR_DDR_report_to_the_kremlin_desc: "The First Secretary reports in person on plan fulfilment, the Western contacts and the mood in the party."
 COLDWAR_DDR_host_a_soviet_delegation: "Host a Soviet Delegation"
 COLDWAR_DDR_host_a_soviet_delegation_desc: "A Soviet delegation tours the Kombinate, lays a wreath at Treptow and is received at Wandlitz."
 COLDWAR_DDR_request_soviet_credit: "Request Soviet Credit"
 COLDWAR_DDR_request_soviet_credit_desc: "Moscow can help with a credit in transferable roubles - at the price of a little more dependence."
 COLDWAR_DDR_pact_talks_category: "Talks with Moscow"
 COLDWAR_DDR_pact_talks_category_desc: "The Soviet Union has rejected our request to leave the Warsaw Pact. After a year the talks can be renewed."
 COLDWAR_DDR_renew_the_moscow_negotiations: "Renew the Moscow Negotiations"
 COLDWAR_DDR_renew_the_moscow_negotiations_desc: "A new delegation travels to Moscow with the same request."
 COLDWAR_DDR_five_year_plan_category: "The Five-Year Plans"
 COLDWAR_DDR_five_year_plan_category_desc: "The State Planning Commission drafts, the Party Congress approves, the Volkskammer makes it law. Each plan has one priority; it applies until the plan ends."
 COLDWAR_DDR_plan_end_1971_tt: "The priority applies until §Y31 December 1975§!."
 COLDWAR_DDR_plan_1971_housing: "Plan 1971-1975: Housing"
 COLDWAR_DDR_plan_1971_housing_desc: "Flats first: the panel factories run in three shifts."
 COLDWAR_DDR_plan_1971_key_industries: "Plan 1971-1975: Key Industries"
 COLDWAR_DDR_plan_1971_key_industries_desc: "Chemistry, machine building and electronics get the best of everything."
 COLDWAR_DDR_plan_1971_exports: "Plan 1971-1975: Exports for Hard Currency"
 COLDWAR_DDR_plan_1971_exports_desc: "What sells in the West is exported, whatever the shops at home lack."
 COLDWAR_DDR_plan_1971_defence: "Plan 1971-1975: Defence"
 COLDWAR_DDR_plan_1971_defence_desc: "The NVA and the Group of Soviet Forces order first."
 COLDWAR_DDR_plan_end_1976_tt: "The priority applies until §Y31 December 1980§!."
