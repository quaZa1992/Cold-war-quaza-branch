 COLDWAR_DDR_hof_doc_defence: "The Defence Economy"
 COLDWAR_DDR_hof_doc_defence_desc: "Hoffmann's Economic Line: arms first, consumer goods second."
 COLDWAR_DDR_hof_doc_export: "Arms for Hard Currency"
 COLDWAR_DDR_hof_doc_export_desc: "Arms exports as a source of income - with the world market's risks."
 COLDWAR_DDR_hof_doc_arsenal: "The Arsenal of the NVA"
 COLDWAR_DDR_hof_doc_arsenal_desc: "Licence production for the NVA itself - cheap equipment, fewer civilian factories."
 COLDWAR_DDR_lam_africa_commission: "The Africa Commission"
 COLDWAR_DDR_lam_doc_modern: "Modern Consumer Socialism"
 COLDWAR_DDR_lam_doc_modern_desc: "Lamberz's Economic Line: goods that please, bought on the world market."
 COLDWAR_DDR_lam_doc_oil: "Oil for Trucks"
 COLDWAR_DDR_lam_doc_oil_desc: "Barter with the oil states: fuel and export income, tied to the world market."
 COLDWAR_DDR_lam_doc_tropics: "Goods from the Tropics"
 COLDWAR_DDR_lam_doc_tropics_desc: "Solidarity barter: fuller shelves, lower industrial revenue."
 COLDWAR_DDR_kro_russian_state_language: "Russian as a State Language"
 COLDWAR_DDR_kro_doc_comecon: "The Soviet Yardstick"
 COLDWAR_DDR_kro_doc_comecon_desc: "Krolikowski's Economic Line: Soviet licences and research, cheap energy - and little room for own initiative."
 COLDWAR_DDR_kro_doc_specialisation: "Specialisation by Gosplan"
 COLDWAR_DDR_kro_doc_specialisation_desc: "The bloc's workshop: capacity and shipyards, less own research."
 COLDWAR_DDR_kro_doc_nodebt: "Out of the Western Debt"
 COLDWAR_DDR_kro_doc_nodebt_desc: "Solvency first: lower interest and exposure, emptier shelves."
 COLDWAR_DDR_kre_doc_youth: "Youth Brigades in Every Kombinat"
 COLDWAR_DDR_kre_doc_youth_desc: "Krenz's Economic Line: young hands for the plan, paid with promises and credit."
 COLDWAR_DDR_kre_doc_families: "Young Families First"
 COLDWAR_DDR_kre_doc_families_desc: "Births and calm, paid with social spending and credit."
 COLDWAR_DDR_kre_doc_projects: "Central Youth Projects"
 COLDWAR_DDR_kre_doc_projects_desc: "Construction and workforce, paid with patience."
 COLDWAR_DDR_kre_the_travel_law: "The Travel Law"
 COLDWAR_DDR_kre_order_restored: "Order Restored"
 COLDWAR_DDR_mod_doc_districts_plan: "The Districts Plan Themselves"
 COLDWAR_DDR_mod_doc_districts_plan_desc: "Modrow's Economic Line: decentralised planning, a weaker centre."
 COLDWAR_DDR_mod_doc_districts: "Power to the Districts"
 COLDWAR_DDR_mod_doc_districts_desc: "The districts build; the centre weakens and local corruption grows."
 COLDWAR_DDR_mod_doc_crafts: "The Craftsmen Return"
 COLDWAR_DDR_mod_doc_crafts_desc: "Small private enterprise inside the plan: goods and revenue, a Western drift."
