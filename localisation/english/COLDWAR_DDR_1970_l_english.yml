 COLDWAR_DDR_kingdom_of_prussia_DEF: "the Kingdom of Prussia"
 COLDWAR_DDR_kingdom_of_prussia_ADJ: "Prussian"
 COLDWAR_DDR_kingdom_of_prussia_tt: "The republic becomes the §YKingdom of Prussia§!: new name and flag."
