 COLDWAR_DDR.1.t: "The Republic at Twenty"
 COLDWAR_DDR.1.d: "Twenty years after its founding, the German Democratic Republic enters the 1970s under Walter Ulbricht and the Socialist Unity Party. The Berlin Wall has stemmed the flight to the West, but consumer shortages and the strain of economic reform continue to test public confidence.\n\nWilly Brandt's government in Bonn is seeking closer relations with its eastern neighbours. East Berlin hopes to secure international recognition while defending its claim to be a separate German state. The coming negotiations will test Ulbricht's leadership and the republic's place within the socialist bloc."
 COLDWAR_DDR.1.a: "A new decade begins."
 COLDWAR_DDR.2.t: "The Erfurt Summit"
 COLDWAR_DDR.2.d: "19 March 1970. Willy Brandt arrives by train in Erfurt to meet Willi Stoph. Thousands break through the police lines in front of the Erfurter Hof and call 'Willy Brandt to the window!'. The Chancellor raises his hands to calm them. The Politburo watches the pictures in silence."
 COLDWAR_DDR.2.a: "Let the cameras roll: the world sees two German states."
 COLDWAR_DDR.2.b: "Clear the square and send in the cheering cadres."
 COLDWAR_DDR.3.t: "The Kassel Meeting"
 COLDWAR_DDR.3.d: "21 May 1970. In Kassel protesters tear down the flag of the republic, Brandt offers twenty points and Stoph insists on recognition under international law. Both sides agree on a 'pause for reflection'. Moscow and Bonn will continue without East Berlin."
 COLDWAR_DDR.3.a: "Recognition first - there is nothing else to discuss."
 COLDWAR_DDR.3.b: "Keep the channel to Bonn open."
 COLDWAR_DDR.4.t: "Ulbricht Resigns"
 COLDWAR_DDR.4.d: "3 May 1971. 'For reasons of age' Walter Ulbricht asks the Central Committee to relieve him of his duties as First Secretary. The plenum elects Erich Honecker unanimously; the old man becomes Chairman of the Party - an honorary title without power."
 COLDWAR_DDR.4.a: "Long live Comrade Honecker."
 COLDWAR_DDR.5.t: "The Old Man Stays"
 COLDWAR_DDR.5.d: "Ambassador Abrasimov delivers a letter from Brezhnev: Moscow is 'concerned' about the First Secretary's lectures on economics and his private German policy. In the Politburo the thirteen signatories of the letter look at the floor."
 COLDWAR_DDR.5.a: "The signatories recant at the next plenum."
 COLDWAR_DDR.5.b: "Dismiss the ringleaders."
 COLDWAR_DDR.6.t: "A Heart Attack"
 COLDWAR_DDR.6.d: "Spring 1973. Walter Ulbricht suffers a heart attack. The Kremlin doctors flown in from Moscow save him, but the old man must rest at Lake Döllnsee for months. The Politburo runs the republic without him."
 COLDWAR_DDR.6.a: "He will be back."
 COLDWAR_DDR.7.t: "The Generals' Candidate"
 COLDWAR_DDR.7.d: "Army General Heinz Hoffmann is dead. As he wished, the Military Council proposes Generaloberst Heinz Keßler as First Secretary. The Central Committee hesitates: a general at the head of the party has never happened in the socialist camp."
 COLDWAR_DDR.7.a: "The Central Committee elects Keßler."
 COLDWAR_DDR.7.b: "The Central Committee refuses."
 COLDWAR_DDR.8.t: "The Guillaume Affair"
 COLDWAR_DDR.8.d: "April 1974. In Bonn the police arrest Günter Guillaume, a personal aide of the Chancellor - and an officer of the Main Directorate for Reconnaissance. Two weeks later Willy Brandt resigns. In Normannenstraße nobody celebrates in public."
 COLDWAR_DDR.8.a: "A painful success."
 COLDWAR_DDR.9.t: "The X World Festival"
 COLDWAR_DDR.9.d: "Nine days in summer: 25,000 foreign guests and eight million visitors fill East Berlin. Young people from Chile, Vietnam and the West discuss on Alexanderplatz until morning, and for once the police look away."
 COLDWAR_DDR.9.a: "Let the world see an open, young republic."
 COLDWAR_DDR.9.b: "Keep a close eye on the guests."
 COLDWAR_DDR.10.t: "The Doping Files"
 COLDWAR_DDR.10.d: "Files of State Plan Research Topic 14.25 have reached Western journalists: the medals of the republic were won with anabolic steroids, given to athletes as young as thirteen. The diplomats in tracksuits come home disgraced."
 COLDWAR_DDR.10.a: "A Western smear campaign."
 COLDWAR_DDR.11.t: "The Exit Applications"
 COLDWAR_DDR.11.d: "Since the Final Act of Helsinki thousands of citizens have filed applications to leave the republic, quoting Basket Three. Most lose their jobs; some are bought free by Bonn. The MfS opens a file on every applicant."
 COLDWAR_DDR.11.a: "Process the applications quietly."
 COLDWAR_DDR.11.b: "A file on every applicant."
 COLDWAR_DDR.12.t: "The Bucharest Formula"
 COLDWAR_DDR.12.d: "From now on Comecon prices follow a moving average of world prices. Soviet crude gets dearer every year, and the republic pays in machines and ships it would rather sell for hard currency."
 COLDWAR_DDR.12.a: "Pay with machines and ships."
 COLDWAR_DDR.12.b: "Sell more crude products to the West."
 COLDWAR_DDR.13.t: "The Polish Crisis"
 COLDWAR_DDR.13.d: "Solidarity counts ten million members; the Polish United Workers' Party has lost the workers. The Politburo fears the Polish disease more than the West German television."
 COLDWAR_DDR.13.a: "Stand by the Polish comrades."
 COLDWAR_DDR.13.b: "Watch and wait."
 COLDWAR_DDR.14.t: "The Euromissile Crisis"
 COLDWAR_DDR.14.d: "The Bundestag has approved the Pershing II, the Soviet delegation has left Geneva, and Moscow announces new missiles for the GDR. Erich Honecker speaks of 'damage limitation' and a 'coalition of reason'."
 COLDWAR_DDR.14.a: "Welcome the counter-deployment."
 COLDWAR_DDR.14.b: "A coalition of reason with Bonn."
 COLDWAR_DDR.15.t: "Manoeuvres on the Border"
 COLDWAR_DDR.15.d: "Soviet, Polish and Czechoslovak divisions exercise along our borders. The commanders speak of a routine exercise; everyone in Berlin remembers Prague 1968."
 COLDWAR_DDR.15.a: "Concede: the reforms will be slowed."
 COLDWAR_DDR.15.b: "Stand firm."
 COLDWAR_DDR.16.t: "The World Condemns"
 COLDWAR_DDR.16.d: "Western capitals recall their ambassadors, the Non-Aligned protest in New York. The Ministry calls it an internal matter of a sovereign state."
 COLDWAR_DDR.16.a: "Let them protest."
 COLDWAR_DDR.17.t: "Terror in East Berlin"
 COLDWAR_DDR.17.d: "The government of [FROM.GetNameDef] has unleashed its state security against its own people. Our ambassador asks for instructions."
 COLDWAR_DDR.17.a: "Recall our ambassador."
 COLDWAR_DDR.17.b: "A statement is enough."
 COLDWAR_DDR.20.t: "The Moscow Treaty"
 COLDWAR_DDR.20.d: "12 August 1970. In the Kremlin Brandt and Kosygin sign a treaty renouncing force and recognising the borders of Europe, the inner-German border included. East Berlin was informed - not asked."
 COLDWAR_DDR.20.a: "Moscow knows best."
 COLDWAR_DDR.20.b: "Protest - in private."
 COLDWAR_DDR.21.t: "The Biermann Affair"
 COLDWAR_DDR.21.d: "16 November 1976. After a concert in Cologne the singer Wolf Biermann is told he may not return. A dozen writers and actors sign a protest letter; West German television broadcasts the whole concert."
 COLDWAR_DDR.21.a: "Expatriated - and good riddance."
 COLDWAR_DDR.21.b: "Let him come home."
 COLDWAR_DDR.22.t: "The Coffee Crisis"
 COLDWAR_DDR.22.d: "1977. Frost in Brazil and the world market prices explode: the republic spends three hundred million hard-currency marks on coffee a year. The Politburo considers a blend with chicory and rye - the people already call it 'Erichs Krönung'."
 COLDWAR_DDR.22.a: "Introduce the blend."
 COLDWAR_DDR.22.b: "Buy coffee from Vietnam and Ethiopia."
 COLDWAR_DDR.23.t: "The Oil Cut"
 COLDWAR_DDR.23.d: "Autumn 1981. Moscow informs East Berlin that oil deliveries will be cut by two million tonnes a year. Brezhnev writes of 'the most difficult decision'. The refineries at Schwedt and Leuna must find something else to burn."
 COLDWAR_DDR.23.a: "Coal instead of oil."
 COLDWAR_DDR.23.b: "Buy the missing oil on the world market."
 COLDWAR_DDR.24.t: "Our Man in Space"
 COLDWAR_DDR.24.d: "26 August 1978. Sigmund Jähn, a lieutenant colonel of the air force from the Vogtland, lifts off from Baikonur on Soyuz 31: the first German in space is a citizen of the republic."
 COLDWAR_DDR.24.a: "The first German in space!"
 COLDWAR_DDR.30.t: "Bonn's Embrace"
 COLDWAR_DDR.30.d: "Credits, visits, town twinnings, a hotline between the chancelleries: the two German states have never been closer. In Moscow they read the reports of the embassy with growing alarm."
 COLDWAR_DDR.30.a: "The embrace is good for us."
 COLDWAR_DDR.30.b: "Step back from Bonn."
 COLDWAR_DDR.31.t: "The Ambassador Calls"
 COLDWAR_DDR.31.d: "The Soviet ambassador asks for an appointment - tonight. He brings a letter from the General Secretary and a list of 'questions of concern'. In Wünsdorf the Group of Soviet Forces has cancelled all leave."
 COLDWAR_DDR.31.a: "Submit to Moscow."
 COLDWAR_DDR.31.b: "Defy the ambassador."
 COLDWAR_DDR.32.t: "Fraternal Concern"
 COLDWAR_DDR.32.d: "Moscow has rejected our request. A Soviet delegation arrives without notice and speaks of the 'common responsibility of the fraternal parties'. The Group of Soviet Forces holds an alert exercise."
 COLDWAR_DDR.32.a: "Reassure Moscow."
 COLDWAR_DDR.32.b: "Hold our course."
 COLDWAR_DDR.33.t: "Fraternal Assistance"
 COLDWAR_DDR.33.d: "The Soviet Union demands that the republic return to the path of socialism - at once. Soviet divisions are moving out of their garrisons; the ultimatum expires at dawn."
 COLDWAR_DDR.33.a: "Bow to Moscow."
 COLDWAR_DDR.33.b: "Resist."
 COLDWAR_DDR.34.t: "East Berlin Bows"
 COLDWAR_DDR.34.d: "[FROM.GetNameDefCap] has accepted our ultimatum. The comrades in East Berlin return to the path of socialism."
 COLDWAR_DDR.34.a: "We will see."
 COLDWAR_DDR.40.t: "Death of Walter Ulbricht"
 COLDWAR_DDR.40.d: "Walter Ulbricht, founder of the republic, has died at the government guest house at Lake Döllnsee. The state funeral is held in Berlin; the Politburo stands in the front row, and in the second the men who wrote the letter to Brezhnev."
 COLDWAR_DDR.40.a: "The republic mourns."
 COLDWAR_DDR.41.t: "Death of Werner Lamberz"
 COLDWAR_DDR.41.d: "Werner Lamberz, the youngest member of the Politburo, has died in a helicopter crash in the Libyan desert after a meeting with Colonel Gaddafi. Many in the party had seen him as the next First Secretary."
 COLDWAR_DDR.41.a: "The republic mourns."
 COLDWAR_DDR.42.t: "Death of Heinz Hoffmann"
 COLDWAR_DDR.42.d: "Army General Heinz Hoffmann, Minister of National Defence for a quarter of a century, has died. The NVA lowers its flags; the Grand Tattoo plays for him in Strausberg."
 COLDWAR_DDR.42.a: "The republic mourns."
 COLDWAR_DDR.43.t: "The Central Committee Elects"
 COLDWAR_DDR.43.d: "The office of First Secretary is vacant and no heir has been named. In the great hall at Werderscher Markt the Central Committee meets behind closed doors; the Politburo has prepared the candidates."
 COLDWAR_DDR.43.a: "Elect Erich Honecker."
 COLDWAR_DDR.43.b: "Elect Willi Stoph."
 COLDWAR_DDR.43.c: "Elect Günter Mittag."
 COLDWAR_DDR.43.e: "Elect Kurt Hager."
 COLDWAR_DDR.43.f: "Elect Egon Krenz."
 COLDWAR_DDR.43.g: "Elect Werner Krolikowski."
 COLDWAR_DDR.43.h: "Elect Hans Modrow."
 COLDWAR_DDR.43.i: "Elect Werner Lamberz."
 COLDWAR_DDR.43.j: "Elect Heinz Hoffmann."
 COLDWAR_DDR.43.k: "Elect Walter Ulbricht."
 COLDWAR_DDR.44.t: "The Heir Takes Over"
 COLDWAR_DDR.44.d: "The old First Secretary keeps his word: the Central Committee is convened and elects the designated heir without a dissenting vote."
 COLDWAR_DDR.44.a: "A new First Secretary."
 COLDWAR_DDR.45.t: "A New First Secretary"
 COLDWAR_DDR.45.d: "The Central Committee of the Socialist Unity Party of Germany has elected §Y[ROOT.GetLeader]§! First Secretary. Neues Deutschland prints the biography on page one and the congratulations of the fraternal parties on pages two to six."
 COLDWAR_DDR.45.a: "Long live the Party."
 COLDWAR_DDR.46.t: "East Berlin Asks"
 COLDWAR_DDR.46.d: "The Central Committee in East Berlin intends to elect §Y[COLDWAR_DDR_GetCandidate]§! as First Secretary of the SED and asks for the opinion of the Soviet comrades before the vote."
 COLDWAR_DDR.46.a: "We have no objections."
 COLDWAR_DDR.46.b: "Veto the candidate."
 COLDWAR_DDR.47.t: "Moscow Says No"
 COLDWAR_DDR.47.d: "The Soviet ambassador has delivered the answer of the Kremlin: the candidate is 'not acceptable to the fraternal parties'. The plenum is postponed."
 COLDWAR_DDR.47.a: "We must bow to Moscow - for now."
 COLDWAR_DDR.48.t: "News from East Berlin"
 COLDWAR_DDR.48.d: "Our embassy reports: [DDR.GetNameDefCap] has a new First Secretary, §Y[DDR.GetLeader]§!. The General Secretary may let East Berlin know what Moscow thinks of it."
 COLDWAR_DDR.48.a: "Endorse the step."
 COLDWAR_DDR.48.b: "Object to it."
 COLDWAR_DDR.49.t: "News from East Berlin"
 COLDWAR_DDR.49.d: "Our embassy reports: [DDR.GetNameDefCap] has signed a credit agreement with a West German bank consortium. The General Secretary may let East Berlin know what Moscow thinks of it."
 COLDWAR_DDR.49.a: "Endorse the step."
 COLDWAR_DDR.49.b: "Object to it."
 COLDWAR_DDR.50.t: "News from East Berlin"
 COLDWAR_DDR.50.d: "Our embassy reports: [DDR.GetNameDefCap] has signed a Basic Treaty with the Federal Republic. The General Secretary may let East Berlin know what Moscow thinks of it."
 COLDWAR_DDR.50.a: "Endorse the step."
 COLDWAR_DDR.50.b: "Object to it."
 COLDWAR_DDR.51.t: "Moscow Approves"
 COLDWAR_DDR.51.d: "The Soviet leadership has let us know that it approves of our latest step. Moscow's Trust rises."
 COLDWAR_DDR.51.a: "Good."
 COLDWAR_DDR.52.t: "Moscow Courts a Rival"
 COLDWAR_DDR.52.d: "The Soviet ambassador has been seen at the dacha of Werner Krolikowski. Moscow lets it be known that it would welcome 'a change of generations' in East Berlin."
 COLDWAR_DDR.52.a: "The Central Committee takes note."
 COLDWAR_DDR.53.t: "Moscow Objects"
 COLDWAR_DDR.53.d: "The Soviet leadership has let us know that it does not approve of our latest step. Moscow's Trust falls."
 COLDWAR_DDR.53.a: "We will remember."
 COLDWAR_DDR.60.t: "The Transition Year Ends"
 COLDWAR_DDR.60.d: "The transition year is over. If nothing stands in the way, the flag of the republic is lowered at midnight in front of the Reichstag and the five restored states join the Federal Republic."
 COLDWAR_DDR.60.a: "Unity in freedom."
 COLDWAR_DDR.60.b: "The accession has failed."
 COLDWAR_DDR.61.t: "The Soldiers Go Home"
 COLDWAR_DDR.61.d: "The last trains of the Group of Soviet Forces leave Wünsdorf. Generals and soldiers have packed for three decades; the barracks stand empty."
 COLDWAR_DDR.61.a: "Do svidaniya."
 COLDWAR_DDR.62.t: "Out of the Warsaw Pact"
 COLDWAR_DDR.62.d: "Moscow has agreed: the republic leaves the Warsaw Pact and its treaty ties. The Group of Soviet Forces will withdraw within two years."
 COLDWAR_DDR.62.a: "A new chapter."
 COLDWAR_DDR.63.t: "Payment for the Weapons"
 COLDWAR_DDR.63.d: "Another tranche for the weapons and trucks arrives in hard currency."
 COLDWAR_DDR.63.a: "Book it."
 COLDWAR_DDR.64.t: "Two Plus Four"
 COLDWAR_DDR.64.d: "Bonn has agreed that the German Democratic Republic may join the Federal Republic. East Berlin asks the Soviet Union to release the republic from its treaty ties and the Warsaw Pact. The Group of Soviet Forces would be settled in a separate treaty."
 COLDWAR_DDR.64.a: "Let Germany unite."
 COLDWAR_DDR.64.b: "Never."
 COLDWAR_DDR.65.t: "Moscow Says No to Unity"
 COLDWAR_DDR.65.d: "The Soviet Union has refused to release the republic. Bonn's yes is worth nothing while the Group of Soviet Forces stands in Wünsdorf."
 COLDWAR_DDR.65.a: "Unity must wait."
 COLDWAR_DDR.900.t: "Our Proposal Is Accepted"
 COLDWAR_DDR.900.d: "[FROM.GetNameDefCap] has accepted our proposal. The agreed terms take effect."
 COLDWAR_DDR.900.a: "Excellent."
 COLDWAR_DDR.901.t: "Our Proposal Is Declined"
 COLDWAR_DDR.901.d: "[FROM.GetNameDefCap] has declined our proposal."
 COLDWAR_DDR.901.a: "Regrettable."
 COLDWAR_DDR.100.t: "East Berlin Asks to Leave"
 COLDWAR_DDR.100.d: "The government in East Berlin asks to be released from the Warsaw Pact and from its treaty ties with the Soviet Union. The Group of Soviet Forces would withdraw over two years."
 COLDWAR_DDR.100.a: "Let them go."
 COLDWAR_DDR.100.b: "The answer is no."
 COLDWAR_DDR.101.t: "Armed Neutrality on the Elbe"
 COLDWAR_DDR.101.d: "East Berlin proposes to leave the Warsaw Pact for armed neutrality: the treaty ties end, the garrison withdraws over two years, and the republic promises never to join NATO."
 COLDWAR_DDR.101.a: "Accept a neutral Germany in the East."
 COLDWAR_DDR.101.b: "Out of the question."
 COLDWAR_DDR.102.t: "A German Confederation"
 COLDWAR_DDR.102.d: "East Berlin proposes a German confederation under a joint national council. Both states would keep their armies; the inner-German border would open."
 COLDWAR_DDR.102.a: "Accept the confederation."
 COLDWAR_DDR.102.b: "We must decline."
 COLDWAR_DDR.103.t: "A Billion from Bavaria"
 COLDWAR_DDR.103.d: "Commercial Coordination asks for a bank credit of one billion D-Mark guaranteed by the federal government. In return the SM-70 spring guns on the border would be dismantled and family visits made easier."
 COLDWAR_DDR.103.a: "Guarantee the credit."
 COLDWAR_DDR.103.b: "We must decline."
 COLDWAR_DDR.104.t: "Accession under Article 23"
 COLDWAR_DDR.104.d: "The government in East Berlin asks for the accession of the five restored states to the Federal Republic under Article 23 of the Basic Law. After a transition year the republic would join the Federal Republic peacefully."
 COLDWAR_DDR.104.a: "Welcome them."
 COLDWAR_DDR.104.b: "We must decline."
 COLDWAR_DDR.105.t: "A Phased Withdrawal"
 COLDWAR_DDR.105.d: "East Berlin asks for a phased withdrawal of the Group of Soviet Forces in Germany over three years and offers to pay for the housing of the returning officers."
 COLDWAR_DDR.105.a: "Bring the soldiers home."
 COLDWAR_DDR.105.b: "The garrison stays."
 COLDWAR_DDR.106.t: "Customs and Currency Union"
 COLDWAR_DDR.106.d: "East Berlin proposes a German confederation: a customs and currency union and a joint council of ministers; both states keep their governments and alliances."
 COLDWAR_DDR.106.a: "Accept the confederation."
 COLDWAR_DDR.106.b: "We must decline."
 COLDWAR_DDR.107.t: "Unity in Freedom"
 COLDWAR_DDR.107.d: "The liberal government in East Berlin asks to join the Federal Republic. After a transition year the republic would join peacefully."
 COLDWAR_DDR.107.a: "Welcome them."
 COLDWAR_DDR.107.b: "We must decline."
 COLDWAR_DDR.108.t: "Erfurt Revisited"
 COLDWAR_DDR.108.d: "Two social-democratic governments meet in Erfurt again - this time without police lines."
 COLDWAR_DDR.108.a: "Travel to Erfurt."
 COLDWAR_DDR.108.b: "We must decline."
 COLDWAR_DDR.109.t: "A Treaty of Friendship and Withdrawal"
 COLDWAR_DDR.109.d: "A social-democratic government in East Berlin proposes a treaty of friendship and non-aggression: the Group of Soviet Forces withdraws in stages, the republic stays in Comecon, and East Berlin pays for barracks and housing in the Soviet Union."
 COLDWAR_DDR.109.a: "Sign the treaty."
 COLDWAR_DDR.109.b: "The garrison stays."
 COLDWAR_DDR.110.t: "A Treaty of Unity"
 COLDWAR_DDR.110.d: "East Berlin proposes to merge both states into one federal republic with a new constitution under Article 146. The social rights of the East would be kept for five years."
 COLDWAR_DDR.110.a: "Sign the treaty of unity."
 COLDWAR_DDR.110.b: "We must decline."
 COLDWAR_DDR.111.t: "A Confederation of the Nation"
 COLDWAR_DDR.111.d: "The national government in East Berlin proposes common citizenship and a joint national assembly; each state keeps its army and its alliance."
 COLDWAR_DDR.111.a: "Accept the confederation."
 COLDWAR_DDR.111.b: "We must decline."
 COLDWAR_DDR.112.t: "Brotherhood in Arms"
 COLDWAR_DDR.112.d: "The Military Council of the NVA invites the Soviet Army to a joint exercise on its soil, like 'Brotherhood in Arms 70'."
 COLDWAR_DDR.112.a: "Send our divisions."
 COLDWAR_DDR.112.b: "We must decline."
 COLDWAR_DDR.113.t: "Frederick Comes Home"
 COLDWAR_DDR.113.d: "The Prussian Crown Council asks for the coffins of Frederick the Great and Frederick William I to be returned from Hohenzollern Castle to Potsdam."
 COLDWAR_DDR.113.a: "Let the kings go home."
 COLDWAR_DDR.113.b: "We must decline."
 COLDWAR_DDR.114.t: "Raise the Swing"
 COLDWAR_DDR.114.d: "The Planning Commission asks Bonn to raise the interest-free 'swing' overdraft of inner-German trade."
 COLDWAR_DDR.114.a: "Raise the swing."
 COLDWAR_DDR.114.b: "We must decline."
 COLDWAR_DDR.115.t: "Action Reconciliation"
 COLDWAR_DDR.115.d: "A treaty of reconciliation: church partnerships, joint youth work camps and open crossings on the Oder."
 COLDWAR_DDR.115.a: "Sign the treaty."
 COLDWAR_DDR.115.b: "We must decline."
 COLDWAR_DDR.116.t: "The Soldiers Go Home"
 COLDWAR_DDR.116.d: "The church government in East Berlin asks the Soviet Union to withdraw its forces within five years. Swords into ploughshares, it says."
 COLDWAR_DDR.116.a: "Withdraw within five years."
 COLDWAR_DDR.116.b: "The garrison stays."
 COLDWAR_DDR.117.t: "Partners of the Union"
 COLDWAR_DDR.117.d: "The West German churches and the federal government are asked to pay in goods and hard currency for the church's hospitals and homes in the East."
 COLDWAR_DDR.117.a: "Pay for the hospitals."
 COLDWAR_DDR.117.b: "We must decline."
 COLDWAR_DDR.118.t: "Joint Ventures with the West"
 COLDWAR_DDR.118.d: "West German firms may hold up to 49 percent in joint ventures with the Kombinate."
 COLDWAR_DDR.118.a: "Allow the investments."
 COLDWAR_DDR.118.b: "We must decline."
 COLDWAR_DDR.119.t: "Trade Without Quotas"
 COLDWAR_DDR.119.d: "Inner-German trade without quotas and with free private contracts."
 COLDWAR_DDR.119.a: "Open the trade."
 COLDWAR_DDR.119.b: "We must decline."
 COLDWAR_DDR.120.t: "An Elbe Commission"
 COLDWAR_DDR.120.d: "A joint Elbe commission: Hamburg pays part of the sewage plants upstream."
 COLDWAR_DDR.120.a: "Pay for clean water."
 COLDWAR_DDR.120.b: "We must decline."
 COLDWAR_DDR.121.t: "Clean Air for the Ore Mountains"
 COLDWAR_DDR.121.d: "Both sides fit desulphurisation to their power stations on the border, to save the forests of the Ore Mountains."
 COLDWAR_DDR.121.a: "Sign the treaty."
 COLDWAR_DDR.121.b: "We must decline."
 COLDWAR_DDR.122.t: "A Five-Year Grain Contract"
 COLDWAR_DDR.122.d: "A five-year grain supply contract at world-market prices."
 COLDWAR_DDR.122.a: "Sign the contract."
 COLDWAR_DDR.122.b: "We must decline."
 COLDWAR_DDR.123.t: "The Yugoslav Lesson"
 COLDWAR_DDR.123.d: "A partnership of two socialist states outside the blocs: advisers on self-management and preferential trade."
 COLDWAR_DDR.123.a: "Accept the partnership."
 COLDWAR_DDR.123.b: "We must decline."
 COLDWAR_DDR.124.t: "The Austrian Solution"
 COLDWAR_DDR.124.d: "East Berlin proposes a treaty of neutrality: both German states leave NATO and the Warsaw Pact, foreign troops leave, and a joint commission prepares all-German elections."
 COLDWAR_DDR.124.a: "Accept neutrality."
 COLDWAR_DDR.124.b: "We must decline."
 COLDWAR_DDR.125.t: "In Step with the West"
 COLDWAR_DDR.125.d: "East Berlin proposes a neutral Germany on the Austrian model: the Group of Soviet Forces withdraws in step with the Western armies."
 COLDWAR_DDR.125.a: "Withdraw in step with the West."
 COLDWAR_DDR.125.b: "The garrison stays."
 COLDWAR_DDR.126.t: "A Confederation of Two States"
 COLDWAR_DDR.126.d: "A confederation of the two German states with a joint council, free movement and a common market."
 COLDWAR_DDR.126.a: "Accept the confederation."
 COLDWAR_DDR.126.b: "We must decline."
 COLDWAR_DDR.127.t: "The Kádár Compromise"
 COLDWAR_DDR.127.d: "The new leadership in East Berlin pledges to stay in the Warsaw Pact and in Comecon - and asks Moscow to tolerate its internal reforms."
 COLDWAR_DDR.127.a: "Tolerate the reforms."
 COLDWAR_DDR.127.b: "We must decline."
 COLDWAR_DDR.128.t: "Guarantee the Berlin Spring"
 COLDWAR_DDR.128.d: "The democratic communists in East Berlin ask us to guarantee their reforms publicly."
 COLDWAR_DDR.128.a: "Guarantee the Berlin Spring."
 COLDWAR_DDR.128.b: "We must decline."
 COLDWAR_DDR.129.t: "Advisers in Every Ministry"
 COLDWAR_DDR.129.d: "The Thälmann Guard asks for Soviet advisers in every ministry and every Kombinat."
 COLDWAR_DDR.129.a: "Send the advisers."
 COLDWAR_DDR.129.b: "We must decline."
 COLDWAR_DDR.130.t: "MfS Advisers"
 COLDWAR_DDR.130.d: "The Ministry for State Security offers to build up our state security service."
 COLDWAR_DDR.130.a: "Accept the advisers."
 COLDWAR_DDR.130.b: "We must decline."
 COLDWAR_DDR.131.t: "The Billion from Bavaria"
 COLDWAR_DDR.131.d: "East Berlin asks for a bank credit of one billion D-Mark guaranteed by the federal government. In return the automatic firing devices on the border are dismantled."
 COLDWAR_DDR.131.a: "Guarantee the credit."
 COLDWAR_DDR.131.b: "We must decline."
 COLDWAR_DDR.132.t: "A State Visit to Bonn"
 COLDWAR_DDR.132.d: "The General Secretary of the SED asks for a state visit to Bonn with full military honours."
 COLDWAR_DDR.132.a: "Receive him with full honours."
 COLDWAR_DDR.132.b: "We must decline."
 COLDWAR_DDR.133.t: "The Erfurt Channel"
 COLDWAR_DDR.133.d: "The Chairman of the Council of Ministers proposes a permanent channel between the two heads of government."
 COLDWAR_DDR.133.a: "Open the channel."
 COLDWAR_DDR.133.b: "We must decline."
 COLDWAR_DDR.134.t: "Comrades in Addis Ababa"
 COLDWAR_DDR.134.d: "A treaty of friendship: GDR security advisers and IFA trucks for Ethiopia, Ethiopian coffee at friendship prices for the GDR."
 COLDWAR_DDR.134.a: "Sign the treaty."
 COLDWAR_DDR.134.b: "We must decline."
 COLDWAR_DDR.135.t: "Comrades in Maputo"
 COLDWAR_DDR.135.d: "A treaty of friendship: GDR engineers for the Moatize coal mines and teachers for FRELIMO schools; contract workers for the GDR."
 COLDWAR_DDR.135.a: "Sign the treaty."
 COLDWAR_DDR.135.b: "We must decline."
 COLDWAR_DDR.136.t: "The Closest Union"
 COLDWAR_DDR.136.d: "East Berlin proposes a confederation with the Soviet Union: a joint foreign and defence policy and a joint currency board for the transferable rouble. The GDR would keep its own government."
 COLDWAR_DDR.136.a: "Accept the confederation."
 COLDWAR_DDR.136.b: "A gesture we appreciate - but no."
 COLDWAR_DDR.137.t: "Freedom of Travel for Credit"
 COLDWAR_DDR.137.d: "East Berlin proposes that every citizen of the GDR may travel to the West - if the Federal Republic finances a travel-currency fund and a large credit line."
 COLDWAR_DDR.137.a: "Finance the travel fund."
 COLDWAR_DDR.137.b: "We must decline."
 COLDWAR_DDR.138.t: "A Treaty Community"
 COLDWAR_DDR.138.d: "East Berlin proposes a Treaty Community: joint commissions for the economy, transport, environment and culture, and a long-term trade and credit agreement."
 COLDWAR_DDR.138.a: "Sign the treaty."
 COLDWAR_DDR.138.b: "We must decline."
 COLDWAR_DDR.139.t: "A Volkswagen Licence"
 COLDWAR_DDR.139.d: "A four-stroke engine plant in Karl-Marx-Stadt under Volkswagen licence, paid in counter-trade."
 COLDWAR_DDR.139.a: "Grant the licence."
 COLDWAR_DDR.139.b: "We must decline."
 COLDWAR_DDR.140.t: "Ships for the Soviet Union"
 COLDWAR_DDR.140.d: "The shipyards of Wismar, Rostock and Stralsund offer a long-term order of trawlers and freighters for the Soviet fleet."
 COLDWAR_DDR.140.a: "Place the order."
 COLDWAR_DDR.140.b: "We must decline."
 COLDWAR_DDR.141.t: "The Orenburg Pipeline"
 COLDWAR_DDR.141.d: "East Berlin offers to build its section of the Soyuz pipeline from Orenburg - with its own workers and machines - in return for natural gas."
 COLDWAR_DDR.141.a: "Accept the builders."
 COLDWAR_DDR.141.b: "We must decline."
 COLDWAR_DDR.142.t: "Coffee from the Central Highlands"
 COLDWAR_DDR.142.d: "East Berlin offers to finance coffee plantations in Dak Lak and to be paid in coffee."
 COLDWAR_DDR.142.a: "Plant the coffee."
 COLDWAR_DDR.142.b: "We must decline."
 COLDWAR_DDR.143.t: "No More Shooting"
 COLDWAR_DDR.143.d: "The republic has ordered its border troops to fire warning shots only. Bonn is asked to answer the gesture with a goodwill trade credit."
 COLDWAR_DDR.143.a: "Grant the credit."
 COLDWAR_DDR.143.b: "We must decline."
 COLDWAR_DDR.144.t: "A German in Space"
 COLDWAR_DDR.144.d: "The GDR asks for a seat on a Soyuz mission of the Interkosmos programme for one of its pilots."
 COLDWAR_DDR.144.a: "Fly the German comrade."
 COLDWAR_DDR.144.b: "We must decline."
 COLDWAR_DDR.145.t: "The Transit Agreement"
 COLDWAR_DDR.145.d: "Transit between the Federal Republic and West Berlin through the territory of the GDR, without searches, against a yearly lump sum."
 COLDWAR_DDR.145.a: "Sign the agreement."
 COLDWAR_DDR.145.b: "We must decline."
 COLDWAR_DDR.146.t: "The Basic Treaty"
 COLDWAR_DDR.146.d: "A Treaty on the Basis of Relations: equal sovereign states, an inviolable border, permanent missions in Bonn and East Berlin."
 COLDWAR_DDR.146.a: "Sign the Basic Treaty."
 COLDWAR_DDR.146.b: "We must decline."
 COLDWAR_DDR.147.t: "The Border Commission"
 COLDWAR_DDR.147.d: "A joint commission surveys and marks the whole inner-German border as a state border, the Elbe in mid-river."
 COLDWAR_DDR.147.a: "Mark the border."
 COLDWAR_DDR.147.b: "We must decline."
 COLDWAR_DDR.148.t: "The Strauß Credit"
 COLDWAR_DDR.148.d: "A credit of one billion marks from a West German bank consortium, guaranteed by Bonn. In return the self-firing devices come off the border fence and children no longer pay the minimum exchange."
 COLDWAR_DDR.148.a: "Guarantee the credit."
 COLDWAR_DDR.148.b: "We must decline."
 COLDWAR_DDR.149.t: "The Cultural Agreement"
 COLDWAR_DDR.149.d: "Exchanges of exhibitions, orchestras and scholars, the return of displaced art treasures and town twinnings."
 COLDWAR_DDR.149.a: "Sign the agreement."
 COLDWAR_DDR.149.b: "We must decline."
 COLDWAR_DDR.150.t: "Common Security"
 COLDWAR_DDR.150.d: "A treaty on a chemical-weapons-free zone and a nuclear-free corridor in Central Europe, based on the SED-SPD drafts."
 COLDWAR_DDR.150.a: "Sign the treaty."
 COLDWAR_DDR.150.b: "We must decline."
 COLDWAR_DDR.151.t: "Friends in the Arab World"
 COLDWAR_DDR.151.d: "Agreements on friendship, trade and technical cooperation: GDR engineers and teachers, oil and cotton at fixed prices."
 COLDWAR_DDR.151.a: "Sign the agreements."
 COLDWAR_DDR.151.b: "We must decline."
 COLDWAR_DDR.152.t: "The Road to New Delhi"
 COLDWAR_DDR.152.d: "Full diplomatic relations and a trade agreement with the German Democratic Republic; machine tools and engineering scholarships for India."
 COLDWAR_DDR.152.a: "Recognise the GDR."
 COLDWAR_DDR.152.b: "We must decline."
 COLDWAR_DDR.153.t: "Paris and London"
 COLDWAR_DDR.153.d: "The German Democratic Republic asks for diplomatic relations."
 COLDWAR_DDR.153.a: "Establish relations."
 COLDWAR_DDR.153.b: "We must decline."
 COLDWAR_DDR.154.t: "The Neutral Capitals"
 COLDWAR_DDR.154.d: "The German Democratic Republic asks for diplomatic relations and a trade agreement."
 COLDWAR_DDR.154.a: "Establish relations."
 COLDWAR_DDR.154.b: "We must decline."
 COLDWAR_DDR.155.t: "An Embassy in Washington"
 COLDWAR_DDR.155.d: "The German Democratic Republic asks for diplomatic relations with the United States, a consular agreement and talks on American property claims."
 COLDWAR_DDR.155.a: "Establish relations."
 COLDWAR_DDR.155.b: "We must decline."
 COLDWAR_DDR.156.t: "The Treaty of 1975"
 COLDWAR_DDR.156.d: "East Berlin proposes a new Treaty of Friendship, Cooperation and Mutual Assistance for twenty-five years, binding the NVA to the Unified Command."
 COLDWAR_DDR.156.a: "Sign the treaty."
 COLDWAR_DDR.156.b: "We must decline."
 COLDWAR_DDR.157.t: "The Ust-Ilimsk Combine"
 COLDWAR_DDR.157.d: "The GDR offers to build its share of the pulp combine at Ust-Ilimsk in return for pulp and paper over ten years."
 COLDWAR_DDR.157.a: "Accept the investment."
 COLDWAR_DDR.157.b: "We must decline."
 COLDWAR_DDR.158.t: "Visa-Free to Warsaw and Prague"
 COLDWAR_DDR.158.d: "Visa-free travel with identity cards in both directions."
 COLDWAR_DDR.158.a: "Open the border."
 COLDWAR_DDR.158.b: "We must decline."
 COLDWAR_DDR.159.t: "Three Divisions for Poland"
 COLDWAR_DDR.159.d: "East Berlin urges joint action of the Warsaw Pact in Poland and offers three NVA divisions. What happens in Poland remains the Soviet Union's decision."
 COLDWAR_DDR.159.a: "Accept the offer."
 COLDWAR_DDR.159.b: "Not now."
 COLDWAR_DDR.160.t: "Missiles on the Elbe"
 COLDWAR_DDR.160.d: "East Berlin offers bases for Soviet operational-tactical missiles on its territory."
 COLDWAR_DDR.160.a: "Deploy the missiles."
 COLDWAR_DDR.160.b: "We must decline."
 COLDWAR_DDR.161.t: "Solidarity with Vietnam"
 COLDWAR_DDR.161.d: "Solidarity shipments of medicine, trucks and hospital equipment, and university places for Vietnamese students."
 COLDWAR_DDR.161.a: "Accept the shipments."
 COLDWAR_DDR.161.b: "We must decline."
 COLDWAR_DDR.162.t: "Workers from Hanoi"
 COLDWAR_DDR.162.d: "An agreement on the employment and training of Vietnamese workers in the factories of the GDR."
 COLDWAR_DDR.162.a: "Sign the agreement."
 COLDWAR_DDR.162.b: "We must decline."
 COLDWAR_DDR.163.t: "Ernst Thälmann Island"
 COLDWAR_DDR.163.d: "IFA trucks, machine tools and a cement works for sugar, citrus and nickel at fixed prices, and apprenticeships for Cuban workers."
 COLDWAR_DDR.163.a: "Sign the agreement."
 COLDWAR_DDR.163.b: "We must decline."
 COLDWAR_DDR.164.t: "Sandinista Nicaragua"
 COLDWAR_DDR.164.d: "Doctors, teachers, a hospital and training for the police and state security."
 COLDWAR_DDR.164.a: "Accept the help."
 COLDWAR_DDR.164.b: "We must decline."
 COLDWAR_DDR.165.t: "FRELIMO's Mozambique"
 COLDWAR_DDR.165.d: "A treaty of friendship, the Moatize coal mine and a contract-worker agreement."
 COLDWAR_DDR.165.a: "Sign the treaty."
 COLDWAR_DDR.165.b: "We must decline."
 COLDWAR_DDR.166.t: "The MPLA in Luanda"
 COLDWAR_DDR.166.d: "Weapons, NVA instructors and trucks for the government in Luanda, paid partly in coffee."
 COLDWAR_DDR.166.a: "Accept the help."
 COLDWAR_DDR.166.b: "We must decline."
 COLDWAR_DDR.167.t: "The Ethiopian Revolution"
 COLDWAR_DDR.167.d: "MfS advisers for the Ethiopian state security, trucks and weapons for the Ogaden war - coffee in return."
 COLDWAR_DDR.167.a: "Accept the help."
 COLDWAR_DDR.167.b: "We must decline."
 COLDWAR_DDR.168.t: "Solidarity Must Pay"
 COLDWAR_DDR.168.d: "Weapons, trucks and training - for oil and hard currency."
 COLDWAR_DDR.168.a: "Buy the weapons."
 COLDWAR_DDR.168.b: "We must decline."
 COLDWAR_DDR_antifascist_protection_rampart: "The Antifascist Protection Rampart"
 COLDWAR_DDR_antifascist_protection_rampart_desc: "Since 13 August 1961 the Wall and 1,378 km of fortified border have stopped the exodus that cost the republic 2.7 million people. 47,000 border troops, mines and the order to shoot hold 17 million people in place - stability bought with the republic's reputation."
 COLDWAR_DDR_overtaking_without_catching_up: "Overtaking Without Catching Up"
 COLDWAR_DDR_overtaking_without_catching_up_desc: "Ulbricht's prestige programme: the 'structure-determining tasks' - petrochemistry, electronics, automation - swallow the investment budget. The hard winter of 1969/70 brings power cuts, delivery gaps and empty shelves."
 COLDWAR_DDR_the_soviet_garrison: "The Group of Soviet Forces in Germany"
 COLDWAR_DDR_the_soviet_garrison_desc: "Twenty Soviet divisions - some 380,000 men - are stationed between Wünsdorf and the Elbe. They protect the republic and they watch it: no decision in East Berlin is taken without a glance towards Karlshorst."
 COLDWAR_DDR_diplomatic_quarantine: "Diplomatic Quarantine"
 COLDWAR_DDR_diplomatic_quarantine_desc: "Bonn's Hallstein Doctrine: whoever recognises the GDR loses West German aid. In January 1970 only the socialist states and a handful of Arab and Asian states recognise the republic."
 COLDWAR_DDR_the_labour_shortage: "The Labour Shortage"
 COLDWAR_DDR_the_labour_shortage_desc: "The exodus before 1961 took the young and the skilled. The population is old and shrinking; 86 % of women already work. Every new factory competes for the same hands."
 COLDWAR_DDR_king_lignite: "King Lignite"
 COLDWAR_DDR_king_lignite_desc: "The republic runs on brown coal: over 250 million tonnes a year, the largest output in the world. Sulphur smog hangs over Bitterfeld, Espenhain and Leipzig; whole villages vanish into the open-cast mines."
 COLDWAR_DDR_the_window_to_the_west: "The Window to the West"
 COLDWAR_DDR_the_window_to_the_west_desc: "ARD and ZDF reach 85 % of the republic - only the 'Valley of the Clueless' around Dresden is spared. Every evening 17 million people compare their lives with Western advertising."
 COLDWAR_DDR_transition_of_power: "Transition of Power"
 COLDWAR_DDR_socialist_constitution: "The Socialist Constitution"
