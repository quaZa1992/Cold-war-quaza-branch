l_english:
# IMPERIA CW — Cold War: LBA 1970 foreign policy — English localisation.
 # Gaddafi foreign-policy branches
 LBA_1970_fund_palestinian_organisations:0 "Fund Palestinian Organisations"
 LBA_1970_fund_palestinian_organisations_desc:0 "PAL receives a funding offer. If it accepts, Libya pays 2 billion and PAL receives 200 infantry equipment plus improved relations with Libya. If PAL refuses, neither transfer occurs."
 LBA_1970_palestinian_arms_workshops:0 "Palestinian Arms Workshops"
 LBA_1970_palestinian_arms_workshops_desc:0 "PAL receives an arms-industry offer. If it accepts, Libya pays 4 billion and PAL gains one offsite military factory. If it refuses, the factory is not built and Libya pays nothing."
 LBA_1970_palestinian_training_mission:0 "Palestinian Training Mission"
 LBA_1970_palestinian_training_mission_desc:0 "Unlocks Palestinian training offers costing 35 Political Power each. PAL may accept or refuse. Acceptance costs Libya 2 billion, grants PAL six months of +5% Army Experience Gain, and occupies one assistance slot for 180 days."
 LBA_1970_arab_liberation_diplomacy:0 "Arab Liberation Diplomacy"
 LBA_1970_arab_liberation_diplomacy_desc:0 "Egypt and Syria, if they exist, each receive a Palestinian-recognition event. They may improve relations with PAL and Libya or refuse. No country is forced into an alliance or war."
 LBA_1970_open_irish_republican_channels:0 "Open Irish Republican Channels"
 LBA_1970_open_irish_republican_channels_desc:0 "Opens a Libyan contact channel with Irish republicans. No UK modifier changes until Libya chooses to send arms."
 LBA_1970_irish_arms_network:0 "Irish Arms Network"
 LBA_1970_irish_arms_network_desc:0 "Unlocks the optional Ship Arms to the IRA decision. Each shipment uses 100 infantry equipment, 30 command equipment, 2 billion and 40 Political Power; the UK receives a response event."
 LBA_1970_maintain_irish_channel:0 "Maintain the Irish Channel"
 LBA_1970_maintain_irish_channel_desc:0 "Keeps the optional arms decision available. No shipment, UK penalty or sanctions are applied by this focus."
 LBA_1970_close_irish_channel:0 "Close the Irish Channel"
 LBA_1970_close_irish_channel_desc:0 "Closes further IRA shipments and improves UK opinion of Libya if the UK exists."
 LBA_1970_foreign_assistance_directorate:0 "Foreign Assistance Directorate"
 LBA_1970_foreign_assistance_directorate_desc:0 "Costs 2 billion and raises Libya's concurrent foreign-assistance mission capacity from one to two. Missions still require their own decisions, payment and recipient approval."
 LBA_1970_train_foreign_cadres:0 "Train Foreign Cadres"
 LBA_1970_train_foreign_cadres_desc:0 "Unlocks training offers to PAL and OAU members costing 40 Political Power each. Acceptance grants the recipient six months of +5% Army Experience Gain, costs Libya 2 billion, and occupies one assistance slot for 180 days."
 LBA_1970_host_exile_networks:0 "Host Exile Networks"
 LBA_1970_host_exile_networks_desc:0 "Requires an intelligence agency. Costs 3 billion and adds Exile Networks: +1 Operative Slot and -2% Stability Factor. The spirit does not stack."
 LBA_1970_resistance_liaison_bureau:0 "Resistance Liaison Bureau"
 LBA_1970_resistance_liaison_bureau_desc:0 "Unlocks optional foreign resistance-network operations. Each operation costs 50 Political Power, 20 Command Power and 2 billion, occupies an assistance slot for 180 days, and gives the target a counter-operation choice."

 # Alternative governments — the ruler must actually hold the relevant MD party
 LBA_1970_local_consultative_councils:0 "Local Consultative Councils"
 LBA_1970_local_consultative_councils_desc:0 "Costs 2 billion and adds Republican Councils: +5% Political Power Gain and +5% Ideology Drift Defence."
 LBA_1970_provincial_budget:0 "Provincial Budget"
 LBA_1970_provincial_budget_desc:0 "Costs 3 billion and improves one tier of Neglected Infrastructure, if any tier remains."
 LBA_1970_noc_under_the_republic:0 "Keep the National Oil Corporation"
 LBA_1970_noc_under_the_republic_desc:0 "Preserves the National Oil Corporation and the current oil-nationalisation level. Refreshes the existing oil-income modifier; does not add a second oil windfall."
 LBA_1970_budget_for_schools_and_water:0 "Budget for Schools and Water"
 LBA_1970_budget_for_schools_and_water_desc:0 "Costs 3 billion and advances Libya's literacy programme by one stage."
 LBA_1970_contracted_industrial_projects:0 "Contracted Industrial Projects"
 LBA_1970_contracted_industrial_projects_desc:0 "Costs 4 billion and builds one civilian factory in Libyan-controlled Tripoli."
 LBA_1970_republican_officer_corps:0 "Professionalise the Officer Corps"
 LBA_1970_republican_officer_corps_desc:0 "Improves one tier of Unprepared Army and grants 15 Army Experience."
 LBA_1970_border_security_pact:0 "Border Security Pact"
 LBA_1970_border_security_pact_desc:0 "Egypt receives a border-security proposal. If it accepts, both countries gain 10 Army Experience and improve mutual relations. If it refuses, neither country gains the bonus."
 LBA_1970_republican_arab_diplomacy:0 "Arab Republic Diplomacy"
 LBA_1970_republican_arab_diplomacy_desc:0 "Syria and Sudan receive separate trade-cooperation offers if they exist. Each may accept or refuse; acceptance improves bilateral opinion with Libya."
 LBA_1970_nfsl_provisional_government:0 "Form a Provisional Government"
 LBA_1970_nfsl_provisional_government_desc:0 "Only available while Neutral Conservatism actually rules Libya. Removes existing Gaddafi-specific institutions and adds an NFSL transitional-government spirit; national oil and development progress is preserved."
 LBA_1970_dissolve_revolutionary_committees:0 "Dissolve Revolutionary Committees"
 LBA_1970_dissolve_revolutionary_committees_desc:0 "Removes Revolutionary Committees only if that spirit exists, and improves one tier of Fragmented Administration."
 LBA_1970_independent_election_commission:0 "Independent Election Commission"
 LBA_1970_independent_election_commission_desc:0 "Costs 2 billion and replaces the NFSL transitional-government spirit with Civic Administration: +5% Political Power Gain and +8% Ideology Drift Defence."
 LBA_1970_elect_constituent_assembly:0 "Open Constituent Elections"
 LBA_1970_elect_constituent_assembly_desc:0 "Enables elections under the NFSL provisional republic. This focus does not predetermine the winner; NFSL-only focuses become unavailable if another party takes power."
 LBA_1970_audit_the_noc:0 "Audit the NOC"
 LBA_1970_audit_the_noc_desc:0 "Reduces corruption by one stage and preserves the National Oil Corporation and existing oil-nationalisation level."
 LBA_1970_small_business_credit:0 "Small Business Credit"
 LBA_1970_small_business_credit_desc:0 "Costs 3 billion and builds one civilian factory in Libyan-controlled Tripoli."
 LBA_1970_review_foreign_contracts:0 "Review Foreign Contracts"
 LBA_1970_review_foreign_contracts_desc:0 "Italy receives a negotiated-contract offer if it exists. Acceptance grants Libya Foreign Contracts for 720 days: +3% Resource Export Income and +3% Trade Opinion Factor. Refusal grants nothing."
 LBA_1970_civilian_control_of_security:0 "Civilian Control of Security"
 LBA_1970_civilian_control_of_security_desc:0 "Removes Exile Networks only if present and adds Civilian Security Oversight: +10% Ideology Drift Defence and reduced foreign subversive activity."
 LBA_1970_review_overseas_commitments:0 "Review Overseas Commitments"
 LBA_1970_review_overseas_commitments_desc:0 "Closes Libya's old covert Irish, Palestinian-training and resistance decisions. Existing aid agreements and national development projects are preserved."
 LBA_1970_reopen_diplomatic_missions:0 "Reopen Diplomatic Missions"
 LBA_1970_reopen_diplomatic_missions_desc:0 "The UK, United States and Egypt receive separate diplomatic-mission offers if they exist. Each may accept or refuse. This focus does not remove sanctions imposed by players."
 LBA_1970_restore_the_crown:0 "Restore the Crown"
 LBA_1970_restore_the_crown_desc:0 "Only available while the Monarchist party actually rules Libya. Removes existing Gaddafi-specific institutions and adds a temporary royal-transition spirit. NOC, education and infrastructure progress remain."
 LBA_1970_interim_basic_law:0 "Interim Basic Law"
 LBA_1970_interim_basic_law_desc:0 "Replaces Royal Transition with a Basic Law and opens a choice between parliamentary monarchy and royal executive rule."
 LBA_1970_parliamentary_crown:0 "A Parliamentary Crown"
 LBA_1970_parliamentary_crown_desc:0 "Replaces the Basic Law with Parliamentary Monarchy: +4% Political Power Gain and +5% Trade Opinion Factor. Allows elections; mutually exclusive with Royal Executive."
 LBA_1970_royal_executive:0 "A Royal Executive"
 LBA_1970_royal_executive_desc:0 "Replaces the Basic Law with Royal Executive Rule: +6% Stability Factor and +6% Ideology Drift Defence. Keeps elections disabled; mutually exclusive with Parliamentary Crown."
 LBA_1970_provincial_representation:0 "Provincial Representation"
 LBA_1970_provincial_representation_desc:0 "Requires either constitutional settlement, costs 2 billion and improves one tier of Fragmented Administration."
 LBA_1970_review_the_oil_settlement:0 "Review the Oil Settlement"
 LBA_1970_review_the_oil_settlement_desc:0 "Keeps the existing NOC and oil-nationalisation level while updating the oil-income modifier. No foreign concessions are restored automatically."
 LBA_1970_royal_development_budget:0 "Royal Development Budget"
 LBA_1970_royal_development_budget_desc:0 "Costs 3 billion and builds one civilian factory in Libyan-controlled Tripoli."
 LBA_1970_schools_beyond_the_coast:0 "Schools Beyond the Coast"
 LBA_1970_schools_beyond_the_coast_desc:0 "Costs 2 billion and advances Libya's literacy programme by one stage."
 LBA_1970_rebuild_a_national_army:0 "Rebuild a National Army"
 LBA_1970_rebuild_a_national_army_desc:0 "Improves one tier of Unprepared Army and grants one 30% land-doctrine cost reduction."
 LBA_1970_regional_reconciliation:0 "Regional Reconciliation"
 LBA_1970_regional_reconciliation_desc:0 "Egypt and Tunisia receive separate reconciliation offers if they exist. Each may accept or refuse; accepted offers improve mutual relations."
 LBA_1970_mediterranean_agreements:0 "Mediterranean Agreements"
 LBA_1970_mediterranean_agreements_desc:0 "The UK and Italy receive separate trade-agreement offers if they exist. Accepted offers improve relations and grant Libya Foreign Contracts for 720 days."

 # Spirits and focus rewards
 LBA_1970_exile_networks:0 "Exile Networks"
 LBA_1970_exile_networks_desc:0 "Hosted foreign networks provide one additional intelligence operative, but their activities impose a small domestic stability cost."
 LBA_1970_foreign_training_recipient:0 "Libyan Training Mission"
 LBA_1970_foreign_training_recipient_desc:0 "Libyan instructors provide a temporary 5% Army Experience Gain bonus."
 LBA_1970_sahel_development_project:0 "Libyan Clinics and Wells"
 LBA_1970_sahel_development_project_desc:0 "A funded Libyan project temporarily improves infrastructure construction and tax income."
 LBA_1970_sirte_cooperation_partner:0 "Sirte Cooperation Agreement"
 LBA_1970_sirte_cooperation_partner_desc:0 "This voluntary one-year agreement grants +10% Ideology Drift Defence, +2% Political Power Gain and +3% Resource Export Income."
 LBA_1970_resistance_pressure:0 "Foreign-Backed Resistance Network"
 LBA_1970_resistance_pressure_desc:0 "An external network reduces stability and political-power gain until it is countered or expires after 180 days."
 LBA_1970_foreign_contracts:0 "Negotiated Foreign Contracts"
 LBA_1970_foreign_contracts_desc:0 "Accepted foreign contracts increase Resource Export Income and Trade Opinion Factor by 3% for 720 days."
 LBA_1970_african_development_partner:0 "African Development Partner"
 LBA_1970_african_development_partner_desc:0 "Libyan development diplomacy grants +5% Foreign Influence and +3% Resource Export Income."
 LBA_1970_republican_councils:0 "Republican Councils"
 LBA_1970_republican_councils_desc:0 "Provincial consultation strengthens Political Power Gain and Ideology Drift Defence by 5% each."
 LBA_1970_nfsl_transition:0 "NFSL Transitional Administration"
 LBA_1970_nfsl_transition_desc:0 "The opposition has taken office but inherited weak institutions: -5% Political Power Gain and -5% Stability Factor until its election commission is established."
 LBA_1970_nfsl_civic_administration:0 "Civic Administration"
 LBA_1970_nfsl_civic_administration_desc:0 "The new electoral administration grants +5% Political Power Gain and +8% Ideology Drift Defence."
 LBA_1970_civilian_security_oversight:0 "Civilian Security Oversight"
 LBA_1970_civilian_security_oversight_desc:0 "Civilian oversight grants +10% Ideology Drift Defence and reduces foreign subversive activity."
 LBA_1970_royal_transition:0 "Royal Transition"
 LBA_1970_royal_transition_desc:0 "Restoration is administratively difficult: -5% Political Power Gain and -4% Stability Factor until a Basic Law is adopted."
 LBA_1970_royal_basic_law:0 "Royal Basic Law"
 LBA_1970_royal_basic_law_desc:0 "An interim constitutional order grants +2% Political Power Gain and +5% Ideology Drift Defence."
 LBA_1970_parliamentary_monarchy:0 "Parliamentary Monarchy"
 LBA_1970_parliamentary_monarchy_desc:0 "An elected cabinet and limited crown grant +4% Political Power Gain and +5% Trade Opinion Factor."
 LBA_1970_royal_executive_rule:0 "Royal Executive Rule"
 LBA_1970_royal_executive_rule_desc:0 "A stronger crown grants +6% Stability Factor and +6% Ideology Drift Defence, but does not permit elections."
 LBA_1970_royal_army_doctrine:0 "Royal Army Reorganisation"

 # Exact focus tooltips
 LBA_1970_palestinian_funding_offer_tt:0 "§YPAL receives an event.§! If it accepts: PAL receives §G200 Infantry Equipment§! and improved opinion of Libya; Libya pays §R2 billion§!. If it refuses: no transfer or payment."
 LBA_1970_palestinian_workshops_offer_tt:0 "§YPAL receives an event.§! If it accepts: PAL receives §G1 offsite Military Factory§!; Libya pays §R4 billion§!. If it refuses: no factory or payment."
 LBA_1970_palestinian_training_unlock_tt:0 "Unlocks §YOffer Palestinian Training§! for §R35 Political Power§!. PAL may refuse; acceptance costs Libya §R2 billion§!, grants PAL six months of §G+5% Army Experience Gain§!, and occupies one assistance slot for 180 days."
 LBA_1970_arab_diplomacy_offer_tt:0 "§YEgypt and Syria§!, if they exist, each receive an event. Acceptance improves their opinion of §YPAL§! and §YLibya§!; refusal has no effect."
 LBA_1970_irish_contact_unlock_tt:0 "Opens the Irish republican contact channel. §YNo UK modifier changes until Libya sends arms.§!"
 LBA_1970_irish_arms_unlock_tt:0 "Unlocks §YShip Arms to the IRA§!. This is an optional paid decision; the UK receives a response event after each shipment."
 LBA_1970_assistance_capacity_tt:0 "§YConcurrent Foreign Assistance Missions§!: §G+1§! (from one to two). Missions still cost money and require recipient approval."
 LBA_1970_foreign_training_unlock_tt:0 "Unlocks §YOffer Foreign Training§! to PAL and OAU members for §R40 Political Power§!. Accepted missions grant six months of §G+5% Army Experience Gain§!, cost Libya §R2 billion§!, and occupy one assistance slot for 180 days."
 LBA_1970_resistance_liaison_unlock_tt:0 "Unlocks §YSponsor a Resistance Network§!. The target may spend Political Power to counter it; no sanctions are applied automatically."
 LBA_1970_sahel_aid_unlock_tt:0 "Unlocks §R40 Political Power§! development offers to §YChad, Mali and Niger§!. Each may refuse; acceptance costs Libya §R3 billion§!, builds one infrastructure level and grants a one-year development spirit."
 LBA_1970_sirte_cooperation_unlock_tt:0 "Unlocks §R45 Political Power§! §YSirte Cooperation Offers§! to OAU members. On acceptance: the partner gains §G25 Political Power§! and one year of §G+10% Ideology Drift Defence§!, §G+2% Political Power Gain§! and §G+3% Resource Export Income§!; Libya pays §R3 billion§!. The recipient may refuse."
 LBA_1970_noc_continuity_tt:0 "Keeps the existing §YNational Oil Corporation§! and current oil-nationalisation progress. No additional one-time oil revenue is created."
 LBA_1970_egypt_rapprochement_offer_tt:0 "§YEgypt receives an event.§! If it accepts, both countries improve their opinions of each other. If it refuses, relations do not change."
 LBA_1970_egypt_border_pact_offer_tt:0 "§YEgypt receives an event.§! If it accepts, both countries gain §G10 Army Experience§! and improve mutual relations. Refusal grants nothing."
 LBA_1970_republican_trade_offer_tt:0 "§YSyria and Sudan§!, if they exist, receive separate trade-cooperation offers; acceptance improves mutual relations with Libya."
 LBA_1970_constituent_assembly_tt:0 "Allows elections in the NFSL provisional republic. §YThe election result is not predetermined.§!"
 LBA_1970_italian_contract_offer_tt:0 "§YItaly receives an event.§! Acceptance improves bilateral relations and grants Libya §YNegotiated Foreign Contracts§! for 720 days. Refusal grants nothing."
 LBA_1970_diplomatic_mission_offer_tt:0 "§YUK, USA and Egypt§!, if they exist, receive separate diplomatic offers. Each may accept or decline. §RPlayer-imposed sanctions are not removed by this focus.§!"
 LBA_1970_royal_oil_review_tt:0 "Keeps the existing National Oil Corporation and oil-nationalisation level. No former concession is restored automatically."
 LBA_1970_regional_reconciliation_tt:0 "§YEgypt and Tunisia§!, if they exist, each receive a reconciliation offer. Only acceptance improves bilateral relations."
 LBA_1970_mediterranean_offer_tt:0 "§YUK and Italy§!, if they exist, receive separate trade offers. Acceptance improves relations and grants Libya §YNegotiated Foreign Contracts§! for 720 days."

 # Decisions
 LBA_1970_foreign_policy_category:0 "Libyan Foreign Assistance"
 LBA_1970_foreign_policy_category_desc:0 "These missions require an explicit Libyan decision. Bilateral offers can be refused; covert targets can respond. Concurrent missions are limited by Libyan assistance capacity."
 LBA_1970_offer_palestinian_training:0 "Offer Palestinian Training"
 LBA_1970_offer_palestinian_training_desc:0 "Costs 35 Political Power and sends PAL a training offer. Acceptance costs Libya 2 billion, grants PAL six months of +5% Army Experience Gain, and occupies one assistance slot for 180 days. Refusal releases the slot."
 LBA_1970_offer_foreign_training:0 "Offer Training to [FROM.GetName]"
 LBA_1970_offer_foreign_training_desc:0 "Costs 40 Political Power. [FROM.GetName] may accept or refuse. Acceptance costs Libya 2 billion, grants six months of +5% Army Experience Gain, and occupies one assistance slot for 180 days. Refusal releases the slot."
 LBA_1970_offer_sahel_development:0 "Fund Clinics and Wells in [FROM.GetName]"
 LBA_1970_offer_sahel_development_desc:0 "Costs 40 Political Power. [FROM.GetName] may accept or refuse. Acceptance costs Libya 3 billion, builds one infrastructure level, grants a one-year development spirit, and occupies one assistance slot for 365 days. Refusal releases the slot."
 LBA_1970_offer_sirte_cooperation:0 "Offer Sirte Cooperation to [FROM.GetName]"
 LBA_1970_offer_sirte_cooperation_desc:0 "Costs 45 Political Power. [FROM.GetName] may accept or refuse. Acceptance costs Libya 3 billion; the recipient gains 25 Political Power and one year of +10% Ideology Drift Defence, +2% Political Power Gain and +3% Resource Export Income. An accepted offer occupies one assistance slot for 365 days; refusal releases it."
 LBA_1970_ship_arms_to_ira:0 "Ship Arms to the IRA"
 LBA_1970_ship_arms_to_ira_desc:0 "Consumes 100 infantry equipment, 30 command equipment, 2 billion and 40 Political Power. The UK receives an event and decides its response. If the 1985 Troubles mechanic is active, foreign funding rises. No sanctions are imposed automatically."
 LBA_1970_sponsor_resistance_network:0 "Sponsor a Network in [FROM.GetName]"
 LBA_1970_sponsor_resistance_network_desc:0 "Costs 50 Political Power, 20 Command Power and 2 billion. [FROM.GetName] receives a 180-day resistance-pressure spirit and may spend 30 Political Power to remove it. The mission occupies one assistance slot for 180 days."

 # Recipient response events
 LBA1970Foreign.accept:0 "Accept the Libyan offer"
 LBA1970Foreign.decline:0 "Decline the Libyan offer"
 LBA1970Foreign.1.t:0 "Libyan Funding for Palestinian Organisations"
 LBA1970Foreign.1.d:0 "Tripoli offers financing and equipment for Palestinian organisations. Acceptance brings 200 infantry equipment; Libya pays the bill."
 LBA1970Foreign.2.t:0 "Libyan Arms Workshops"
 LBA1970Foreign.2.d:0 "Libya offers to finance an offsite military factory for the Palestinian movement. Acceptance gives us one military factory at Libya's expense."
 LBA1970Foreign.3.t:0 "Libyan Palestinian Diplomacy"
 LBA1970Foreign.3.d:0 "Tripoli asks us to improve official relations with the Palestinian movement. We may accept or refuse without changing alliances."
 LBA1970Foreign.4.t:0 "Libyan-Egyptian Rapprochement"
 LBA1970Foreign.4.d:0 "The new Libyan republic proposes better bilateral relations. Our government may accept or refuse."
 LBA1970Foreign.5.t:0 "Border Security Pact with Libya"
 LBA1970Foreign.5.d:0 "Tripoli proposes joint border-security training. Acceptance gives both governments 10 Army Experience and improved relations."
 LBA1970Foreign.6.t:0 "Arab Republic Trade Offer"
 LBA1970Foreign.6.d:0 "Libya proposes trade cooperation. Acceptance improves our bilateral relations; refusal leaves them unchanged."
 LBA1970Foreign.7.t:0 "Negotiated Contracts with Libya"
 LBA1970Foreign.7.d:0 "Libya proposes limited commercial contracts. Acceptance improves bilateral relations and gives Libya a temporary export benefit."
 LBA1970Foreign.8.t:0 "Diplomatic Mission from Libya"
 LBA1970Foreign.8.d:0 "The new Libyan government offers to restore normal diplomatic channels. We may accept or refuse; existing sanctions are unaffected."
 LBA1970Foreign.9.t:0 "Libyan Training Mission"
 LBA1970Foreign.9.d:0 "Libya offers military instructors for six months. Acceptance gives us +5% Army Experience Gain and costs Libya 2 billion."
 LBA1970Foreign.10.t:0 "Libyan Clinics and Wells"
 LBA1970Foreign.10.d:0 "Libya offers to fund a local infrastructure project and a one-year development programme. We may accept or decline."
 LBA1970Foreign.11.t:0 "Sirte Cooperation Offer"
 LBA1970Foreign.11.d:0 "Libya proposes a voluntary one-year cooperation agreement. Acceptance grants 25 Political Power, +10% Ideology Drift Defence, +2% Political Power Gain and +3% Resource Export Income. It does not bind us to a union."
 LBA1970Foreign.12.t:0 "Libyan Arms for Irish Republicans"
 LBA1970Foreign.12.d:0 "We have evidence of a Libyan shipment to Irish republican networks. The British government decides how to respond; no sanctions are imposed by this event."
 LBA1970Foreign.uk_condemn:0 "Condemn the shipment"
 LBA1970Foreign.uk_ignore:0 "Take no public action"
 LBA1970Foreign.13.t:0 "Foreign-Backed Resistance Network"
 LBA1970Foreign.13.d:0 "Our services detect a foreign-backed network. It causes limited disruption for 180 days unless we spend Political Power to counter it."
 LBA1970Foreign.counter_network:0 "Disrupt the network (-30 Political Power)"
 LBA1970Foreign.monitor_network:0 "Monitor it for now"
 LBA1970Foreign.90.a:0 "Mission concluded"
