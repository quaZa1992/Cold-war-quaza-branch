l_english:
 COLDWAR_SYR_POL.1.d:0 "The cabinet and Regional Command must agree who can issue binding orders. A settlement can preserve the civilian presidency, concede the party apparatus, or make room for a lawful transition. Refusing a bargain leaves the divided command unresolved."
 COLDWAR_SYR_POL.1.option_a:0 "Recognize a civilian cabinet compact."
 COLDWAR_SYR_POL.1.option_a_outcome_tt:0 "The cabinet accepts the command settlement. Nureddin al-Atassi retains the presidency and directs the civilian programme; Jadid's governing mandate ends. The settlement can resolve Divided Command once the opening settlement programme has been implemented."
 COLDWAR_SYR_POL.1.option_b:0 "Recognize Jadid's Regional Command mandate."
 COLDWAR_SYR_POL.1.option_b_outcome_tt:0 "The cabinet accepts the command settlement. Salah Jadid directs the Regional Command programme while Nureddin al-Atassi remains president. The settlement can resolve Divided Command once the opening settlement programme has been implemented."
 COLDWAR_SYR_POL.1.option_c:0 "Prepare a negotiated transitional presidency."
 COLDWAR_SYR_POL.1.option_c_outcome_tt:0 "The cabinet and officers accept a negotiated transition. A transitional presidency can now be established through the Corrective Vote; this agreement itself installs no new president."
 COLDWAR_SYR_POL.1.option_d:0 "The talks have failed."
 COLDWAR_SYR_POL.1.option_d_outcome_tt:0 "The negotiations fail. Divided Command remains unresolved."
 COLDWAR_SYR_POL.1.t:0 "Mediation in Damascus"
 COLDWAR_SYR_POL.10.d:0 "An agreement on command and pay can restrain rival formations. Rejecting a settlement leaves the army's organization impaired while the conflict is resolved."
 COLDWAR_SYR_POL.10.option_a:0 "Bind the guard commands to the settlement."
 COLDWAR_SYR_POL.10.option_a_outcome_tt:0 "Accept the guard-command settlement. Rival guard commands are dissolved as a political challenge; this prevents a later crisis requiring those rival commands."
 COLDWAR_SYR_POL.10.option_b:0 "Reject the proposed command bargain."
 COLDWAR_SYR_POL.10.option_b_outcome_tt:0 "Reject the command settlement. Rival guard commands remain a political challenge, with 90 days of command disruption."
 COLDWAR_SYR_POL.10.t:0 "The Rival Guard Commands"
 COLDWAR_SYR_POL.11.d:0 "The president's incapacity has left civilian ministers and rival guard commands unsure whose orders to follow. A succession conference is available; illness does not automatically install a new ruler."
 COLDWAR_SYR_POL.11.option_a:0 "Convene the institutions before choosing a successor."
 COLDWAR_SYR_POL.11.option_a_outcome_tt:0 "The president is incapacitated. A succession conference becomes available; the event itself appoints no successor."
 COLDWAR_SYR_POL.11.t:0 "A Succession Warning"
 COLDWAR_SYR_POL.12.d:0 "Agricultural pressures, coercive administration and exclusion have sharpened local grievances. The government can fund mediation or choose a costly security response through its decisions."
 COLDWAR_SYR_POL.12.option_a:0 "The cabinet must address the crisis."
 COLDWAR_SYR_POL.12.option_a_outcome_tt:0 "An internal political crisis begins. The cabinet can pursue civilian mediation or security operations through the relevant decisions."
 COLDWAR_SYR_POL.12.t:0 "Strain in the Provinces"
 COLDWAR_SYR_POL.2.d:0 "The corrective programme has reached the command. Hafez al-Assad's supporters want an end to the rivalry paralysing government, but a transition will endure only with sufficient officer backing and cabinet assent. A secure agreement can establish an interim presidency; proceeding without it risks disruption within the army, while withdrawal would return the question to negotiation."
 COLDWAR_SYR_POL.2.option_a:0 "Authorize a transitional People's Council."
 COLDWAR_SYR_POL.2.option_a_outcome_tt:0 "The negotiated transfer takes effect. Ahmad al-Khatib assumes the interim presidency before 1983; a collective Civilian Stewardship Council assumes it from 1983 onward. Earned programmes follow the accepted office and mandate."
 COLDWAR_SYR_POL.2.option_b:0 "Proceed without a secure compact."
 COLDWAR_SYR_POL.2.option_b_outcome_tt:0 "The disputed intervention fails to secure a transfer of office and disrupts army command for 90 days."
 COLDWAR_SYR_POL.2.option_c:0 "Withdraw the motion."
 COLDWAR_SYR_POL.2.option_c_outcome_tt:0 "Withdraw the motion. The current president and command settlement remain unchanged."
 COLDWAR_SYR_POL.2.t:0 "The Corrective Vote"
 COLDWAR_SYR_POL.20.d:0 "A constitutional campaign needs an organization whose programme voters can judge. Choose a legal party to support through meetings, professional networks and local organizing. Its gains will strengthen its position in public politics, while the question of government remains for the country's representative institutions to decide."
 COLDWAR_SYR_POL.20.option_a:0 "Campaign for the Constitutional Conservatives."
 COLDWAR_SYR_POL.20.option_a_outcome_tt:0 "Campaign support for the Constitutional Conservatives: up to §G+1.0 percentage point§! of public support, redistributed within its outlook through the existing party system. This campaign does not appoint a government."
 COLDWAR_SYR_POL.20.option_b:0 "Campaign for the Civic Liberal Bloc."
 COLDWAR_SYR_POL.20.option_b_outcome_tt:0 "Campaign support for the Civic Liberal Bloc: up to §G+1.0 percentage point§! of public support, redistributed within its outlook through the existing party system. This campaign does not appoint a government."
 COLDWAR_SYR_POL.20.option_c:0 "Campaign for the Independent Socialist Opposition."
 COLDWAR_SYR_POL.20.option_c_outcome_tt:0 "Campaign support for the Independent Socialist Opposition: up to §G+1.0 percentage point§! of public support, redistributed within its outlook through the existing party system. This campaign does not appoint a government."
 COLDWAR_SYR_POL.20.option_d:0 "Cancel the campaign proposal."
 COLDWAR_SYR_POL.20.option_d_outcome_tt:0 "Cancel the proposed campaign. No party gains support and the government remains unchanged."
 COLDWAR_SYR_POL.20.t:0 "Choose a Legal Campaign"
 COLDWAR_SYR_POL.21.d:0 "Socialist organizers disagree over which movement can best defend workers, farmers and the republic's independence. Direct the campaign toward one legal party and build its public support. The choice gives that organization's programme a stronger voice without handing it office or dissolving its rivals."
 COLDWAR_SYR_POL.21.option_a:0 "Campaign for the Syrian Communist Party."
 COLDWAR_SYR_POL.21.option_a_outcome_tt:0 "Campaign support for the Syrian Communist Party: up to §G+1.0 percentage point§! of public support, redistributed within its outlook through the existing party system. This campaign does not appoint a government."
 COLDWAR_SYR_POL.21.option_b:0 "Campaign for the Arab Socialist Ba'ath Party."
 COLDWAR_SYR_POL.21.option_b_outcome_tt:0 "Campaign support for the Arab Socialist Ba'ath Party: up to §G+1.0 percentage point§! of public support, redistributed within its outlook through the existing party system. This campaign does not appoint a government."
 COLDWAR_SYR_POL.21.option_c:0 "Cancel the campaign proposal."
 COLDWAR_SYR_POL.21.option_c_outcome_tt:0 "Cancel the proposed campaign. No party gains support and the government remains unchanged."
 COLDWAR_SYR_POL.21.t:0 "Choose a Legal Campaign"
 COLDWAR_SYR_POL.22.d:0 "Choose a legal independent Arab party for the organizing campaign. Its supporters must explain how national independence and Arab commitments should shape everyday government, rather than rely on a common vocabulary to conceal their differences. Campaigning can strengthen that party's public base while leaving authority to the political process."
 COLDWAR_SYR_POL.22.option_a:0 "Campaign for the Syrian Muslim Brotherhood."
 COLDWAR_SYR_POL.22.option_a_outcome_tt:0 "Campaign support for the Syrian Muslim Brotherhood: up to §G+1.0 percentage point§! of public support, redistributed within its outlook through the existing party system. This campaign does not appoint a government."
 COLDWAR_SYR_POL.22.option_b:0 "Campaign for the Arab Socialist Union."
 COLDWAR_SYR_POL.22.option_b_outcome_tt:0 "Campaign support for the Arab Socialist Union: up to §G+1.0 percentage point§! of public support, redistributed within its outlook through the existing party system. This campaign does not appoint a government."
 COLDWAR_SYR_POL.22.option_c:0 "Cancel the campaign proposal."
 COLDWAR_SYR_POL.22.option_c_outcome_tt:0 "Cancel the proposed campaign. No party gains support and the government remains unchanged."
 COLDWAR_SYR_POL.22.t:0 "Choose a Legal Campaign"
 COLDWAR_SYR_POL.23.d:0 "Several movements claim to offer the national discipline Syria needs, but their programmes are far from interchangeable. Choose a legal party to support through a focused campaign. The resulting gain strengthens its position among the public without authorizing it to take office by the campaign's decision alone."
 COLDWAR_SYR_POL.23.option_a:0 "Campaign for the Syrian Social Nationalist Party."
 COLDWAR_SYR_POL.23.option_a_outcome_tt:0 "Campaign support for the Syrian Social Nationalist Party: up to §G+1.0 percentage point§! of public support, redistributed within its outlook through the existing party system. This campaign does not appoint a government."
 COLDWAR_SYR_POL.23.option_b:0 "Campaign for the Iraqi-Aligned Ba'ath Organization."
 COLDWAR_SYR_POL.23.option_b_outcome_tt:0 "Campaign support for the Iraqi-Aligned Ba'ath Organization: up to §G+1.0 percentage point§! of public support, redistributed within its outlook through the existing party system. This campaign does not appoint a government."
 COLDWAR_SYR_POL.23.option_c:0 "Campaign for the Provisional Military Council."
 COLDWAR_SYR_POL.23.option_c_outcome_tt:0 "Campaign support for the Provisional Military Council: up to §G+1.0 percentage point§! of public support, redistributed within its outlook through the existing party system. This campaign does not appoint a government."
 COLDWAR_SYR_POL.23.option_d:0 "Cancel the campaign proposal."
 COLDWAR_SYR_POL.23.option_d_outcome_tt:0 "Cancel the proposed campaign. No party gains support and the government remains unchanged."
 COLDWAR_SYR_POL.23.t:0 "Choose a Legal Campaign"
 COLDWAR_SYR_POL.24.d:0 "The cabinet can seek a constitutional partner with at least five percent public support. Representation must be negotiated around accepted terms, while the governing party remains responsible for its own programme. A successful bargain adds a coalition member; if the parties cannot agree, no membership will be granted."
 COLDWAR_SYR_POL.24.option_a:0 "Accept cabinet terms with the Constitutional Conservatives."
 COLDWAR_SYR_POL.24.option_a_outcome_tt:0 "Admit the Constitutional Conservatives to the governing coalition. Its support contributes to the coalition; the current governing party and president remain in office."
 COLDWAR_SYR_POL.24.option_b:0 "Accept cabinet terms with the Civic Liberal Bloc."
 COLDWAR_SYR_POL.24.option_b_outcome_tt:0 "Admit the Civic Liberal Bloc to the governing coalition. Its support contributes to the coalition; the current governing party and president remain in office."
 COLDWAR_SYR_POL.24.option_c:0 "Accept cabinet terms with the Independent Socialist Opposition."
 COLDWAR_SYR_POL.24.option_c_outcome_tt:0 "Admit the Independent Socialist Opposition to the governing coalition. Its support contributes to the coalition; the current governing party and president remain in office."
 COLDWAR_SYR_POL.24.option_d:0 "No agreement can be reached."
 COLDWAR_SYR_POL.24.option_d_outcome_tt:0 "No coalition agreement is signed. Existing membership and the government remain unchanged."
 COLDWAR_SYR_POL.24.t:0 "Cabinet Coalition Negotiations"
 COLDWAR_SYR_POL.25.d:0 "A socialist partner with at least five percent support may join the cabinet's coalition if its organization is legal and the proposed terms are accepted. Representation can give cooperation practical meaning, but disagreements remain to be negotiated. The governing party keeps its office and gains a partner rather than a replacement."
 COLDWAR_SYR_POL.25.option_a:0 "Accept cabinet terms with the Syrian Communist Party."
 COLDWAR_SYR_POL.25.option_a_outcome_tt:0 "Admit the Syrian Communist Party to the governing coalition. Its support contributes to the coalition; the current governing party and president remain in office."
 COLDWAR_SYR_POL.25.option_b:0 "Accept cabinet terms with the Arab Socialist Ba'ath Party."
 COLDWAR_SYR_POL.25.option_b_outcome_tt:0 "Admit the Arab Socialist Ba'ath Party to the governing coalition. Its support contributes to the coalition; the current governing party and president remain in office."
 COLDWAR_SYR_POL.25.option_c:0 "No agreement can be reached."
 COLDWAR_SYR_POL.25.option_c_outcome_tt:0 "No coalition agreement is signed. Existing membership and the government remain unchanged."
 COLDWAR_SYR_POL.25.t:0 "Cabinet Coalition Negotiations"
 COLDWAR_SYR_POL.26.d:0 "The cabinet is considering representation for a legal independent Arab partner with at least five percent support. Its participation would bring another programme and another constituency into government. An accepted agreement grants coalition membership, while failure to settle the terms leaves the prospective partner outside."
 COLDWAR_SYR_POL.26.option_a:0 "Accept cabinet terms with the Syrian Muslim Brotherhood."
 COLDWAR_SYR_POL.26.option_a_outcome_tt:0 "Admit the Syrian Muslim Brotherhood to the governing coalition. Its support contributes to the coalition; the current governing party and president remain in office."
 COLDWAR_SYR_POL.26.option_b:0 "Accept cabinet terms with the Arab Socialist Union."
 COLDWAR_SYR_POL.26.option_b_outcome_tt:0 "Admit the Arab Socialist Union to the governing coalition. Its support contributes to the coalition; the current governing party and president remain in office."
 COLDWAR_SYR_POL.26.option_c:0 "No agreement can be reached."
 COLDWAR_SYR_POL.26.option_c_outcome_tt:0 "No coalition agreement is signed. Existing membership and the government remain unchanged."
 COLDWAR_SYR_POL.26.t:0 "Cabinet Coalition Negotiations"
 COLDWAR_SYR_POL.27.d:0 "A nationalist partner must have a legal organization and at least five percent support before it can enter these cabinet negotiations. An accepted bargain brings it into the governing coalition without transferring the premiership or dissolving the parties' differences. The cabinet can also conclude that no workable agreement is available."
 COLDWAR_SYR_POL.27.option_a:0 "Accept cabinet terms with the Syrian Social Nationalist Party."
 COLDWAR_SYR_POL.27.option_a_outcome_tt:0 "Admit the Syrian Social Nationalist Party to the governing coalition. Its support contributes to the coalition; the current governing party and president remain in office."
 COLDWAR_SYR_POL.27.option_b:0 "Accept cabinet terms with the Iraqi-Aligned Ba'ath Organization."
 COLDWAR_SYR_POL.27.option_b_outcome_tt:0 "Admit the Iraqi-Aligned Ba'ath Organization to the governing coalition. Its support contributes to the coalition; the current governing party and president remain in office."
 COLDWAR_SYR_POL.27.option_c:0 "Accept cabinet terms with the Provisional Military Council."
 COLDWAR_SYR_POL.27.option_c_outcome_tt:0 "Admit the Provisional Military Council to the governing coalition. Its support contributes to the coalition; the current governing party and president remain in office."
 COLDWAR_SYR_POL.27.option_d:0 "No agreement can be reached."
 COLDWAR_SYR_POL.27.option_d_outcome_tt:0 "No coalition agreement is signed. Existing membership and the government remain unchanged."
 COLDWAR_SYR_POL.27.t:0 "Cabinet Coalition Negotiations"
 COLDWAR_SYR_POL.28.d:0 "The governing party may offer representation to legal socialist partners. A partner's minimum electoral support and acceptance of cabinet terms are required; the front cannot erase an opposition party or replace the government automatically."
 COLDWAR_SYR_POL.28.option_a:0 "Offer the Communists cabinet representation."
 COLDWAR_SYR_POL.28.option_a_outcome_tt:0 "Legalize the Syrian Communist Party and admit it to the governing coalition. The current governing party and president remain in office."
 COLDWAR_SYR_POL.28.option_b:0 "Offer the Arab Socialist Union cabinet representation."
 COLDWAR_SYR_POL.28.option_b_outcome_tt:0 "Legalize the Arab Socialist Union and admit it to the governing coalition. The current governing party and president remain in office."
 COLDWAR_SYR_POL.28.option_c:0 "The parties decline the terms."
 COLDWAR_SYR_POL.28.option_c_outcome_tt:0 "No National Front agreement is signed. Party registration and coalition membership remain unchanged."
 COLDWAR_SYR_POL.28.t:0 "Terms for the National Front"
 COLDWAR_SYR_POL.3.d:0 "Nureddin al-Atassi occupies the presidency, while Salah Jadid exercises decisive influence through the Regional Command. The party must now clarify whose direction will guide policy. Endorsing Jadid's mandate acknowledges the authority of the party apparatus without making him president; endorsing Atassi strengthens the civilian policy mandate while preserving the existing office."
 COLDWAR_SYR_POL.3.option_a:0 "Endorse Atassi's civilian policy mandate."
 COLDWAR_SYR_POL.3.option_a_outcome_tt:0 "Nureddin al-Atassi remains president and directs the civilian governing programme. His earned programme applies; Jadid's earned leadership programme is suspended."
 COLDWAR_SYR_POL.3.option_b:0 "Endorse Jadid's dominant party mandate."
 COLDWAR_SYR_POL.3.option_b_outcome_tt:0 "Nureddin al-Atassi remains president. Salah Jadid directs policy through the Regional Command: his earned programme applies and Atassi's earned leadership programme is suspended."
 COLDWAR_SYR_POL.3.option_c:0 "Maintain the current constitutional office."
 COLDWAR_SYR_POL.3.option_c_outcome_tt:0 "Keep the existing policy mandate and president. No leadership programme changes."
 COLDWAR_SYR_POL.3.t:0 "Authority in the Regional Command"
 COLDWAR_SYR_POL.30.d:0 "The restored constitutional tradition has more than one statesman able to claim its leadership. Nazim al-Qudsi and Ma'ruf al-Dawalibi bring different records, alliances and priorities to the task. The governing conservatives must choose who will represent their programme through the difficult work of rebuilding civilian authority."
 COLDWAR_SYR_POL.30.option_a:0 "Nazim al-Qudsi."
 COLDWAR_SYR_POL.30.option_a_outcome_tt:0 "Nazim al-Qudsi leads the constitutional conservatives. His earned programme applies while he governs; al-Dawalibi's earned programme is suspended. Re-endorsing the incumbent does not replace him."
 COLDWAR_SYR_POL.30.option_b:0 "Ma'ruf al-Dawalibi."
 COLDWAR_SYR_POL.30.option_b_outcome_tt:0 "Ma'ruf al-Dawalibi leads the constitutional conservatives. His earned programme applies while he governs; al-Qudsi's earned programme is suspended. Re-endorsing the incumbent does not replace him."
 COLDWAR_SYR_POL.30.t:0 "Choose the Conservative Leadership"
 COLDWAR_SYR_POL.31.d:0 "The Communists must decide who should direct their governing programme. Khalid Bakdash represents the party's established leadership, while Yusuf Faisal's later faction offers a separate course once its organization has formed. The choice will shape the party's approach to authority, cooperation and the institutions through which it hopes to advance socialism."
 COLDWAR_SYR_POL.31.option_a:0 "Retain Khalid Bakdash."
 COLDWAR_SYR_POL.31.option_a_outcome_tt:0 "Khalid Bakdash leads the Communists. His earned programme applies while he governs; Yusuf Faisal's earned programme is suspended. Re-endorsing the incumbent does not replace him."
 COLDWAR_SYR_POL.31.option_b:0 "Endorse Yusuf Faisal's faction."
 COLDWAR_SYR_POL.31.option_b_outcome_tt:0 "Yusuf Faisal leads the Communists. His earned programme applies while he governs; Bakdash's earned programme is suspended. Re-endorsing the incumbent does not replace him."
 COLDWAR_SYR_POL.31.t:0 "Choose the Communist Leadership"
 COLDWAR_SYR_POL.32.d:0 "The Arab Socialist Union must choose a leader capable of translating its Nasserist commitments into Syrian government. Jamal al-Atassi offers one direction, while Safwan al-Qudsi's later organization can offer another after it has been established. Arab unity does not remove the need to settle who speaks for the movement at home."
 COLDWAR_SYR_POL.32.option_a:0 "Endorse Jamal al-Atassi."
 COLDWAR_SYR_POL.32.option_a_outcome_tt:0 "Jamal al-Atassi leads the Arab Socialist Union. His earned programme applies while he governs; Safwan al-Qudsi's earned programme is suspended. Re-endorsing the incumbent does not replace him."
 COLDWAR_SYR_POL.32.option_b:0 "Endorse Safwan al-Qudsi."
 COLDWAR_SYR_POL.32.option_b_outcome_tt:0 "Safwan al-Qudsi leads the Arab Socialist Union. His earned programme applies while he governs; Jamal al-Atassi's earned programme is suspended. Re-endorsing the incumbent does not replace him."
 COLDWAR_SYR_POL.32.t:0 "Choose the Arab Socialist Leadership"
 COLDWAR_SYR_POL.33.d:0 "The Brotherhood's governing organization faces a choice of leadership and political direction. Issam al-Attar can be endorsed now; Adnan Saadeddin can be considered after his leadership organization has formed. Their supporters must decide whose programme can guide the movement while answering the responsibilities of governing a diverse republic."
 COLDWAR_SYR_POL.33.option_a:0 "Endorse Issam al-Attar."
 COLDWAR_SYR_POL.33.option_a_outcome_tt:0 "Issam al-Attar leads the Brotherhood. His earned programme applies while he governs; Adnan Saadeddin's earned programme is suspended. Re-endorsing the incumbent does not replace him."
 COLDWAR_SYR_POL.33.option_b:0 "Endorse Adnan Saadeddin."
 COLDWAR_SYR_POL.33.option_b_outcome_tt:0 "Adnan Saadeddin leads the Brotherhood. His earned programme applies while he governs; al-Attar's earned programme is suspended. Re-endorsing the incumbent does not replace him."
 COLDWAR_SYR_POL.33.t:0 "Choose the Brotherhood Leadership"
 COLDWAR_SYR_POL.34.d:0 "The military cabinet can accept a constitution permitting legal parties and competitive elections, opening the way to civilian government. Such a transfer will unsettle commands accustomed to political authority, and the eventual governing party will depend on the electorate's support. Postponement preserves military rule and leaves the constitutional question unresolved."
 COLDWAR_SYR_POL.34.option_a:0 "Accept the constitution and elections."
 COLDWAR_SYR_POL.34.option_a_outcome_tt:0 "Accept legal political competition and elections every four years. Civilian transfer is recorded, allowing the military government to relinquish its command mandate through the negotiated constitution. The electorate determines the next government; the 180-day command disruption is shown below."
 COLDWAR_SYR_POL.34.option_b:0 "Postpone the transfer."
 COLDWAR_SYR_POL.34.option_b_outcome_tt:0 "Postpone the constitution. Military rule, existing party restrictions and the unresolved transfer remain in place."
 COLDWAR_SYR_POL.34.t:0 "A Civilian Transfer of Authority"
 COLDWAR_SYR_POL.4.d:0 "Opposition organizations want a place in political life protected by law, alongside competitive elections and guarantees for peaceful activity. Accepting their terms would end the government's exclusive claim to organize the republic, beginning a difficult period of adjustment. Refusing the pact preserves one-party rule and leaves the emergency restrictions in force."
 COLDWAR_SYR_POL.4.option_a:0 "Accept legal opposition and competitive elections."
 COLDWAR_SYR_POL.4.option_a_outcome_tt:0 "Legalize the constitutional, Communist, Ba'athist, Brotherhood, Arab socialist and nationalist organizations represented in these negotiations. Permit competitive elections every four years. The later Political Bureau becomes legal after its organization has formed; no party receives office automatically."
 COLDWAR_SYR_POL.4.option_b:0 "Retain one-party government."
 COLDWAR_SYR_POL.4.option_b_outcome_tt:0 "Reject the pact. Existing party bans and electoral restrictions remain in place; constitutional talks may be reopened later."
 COLDWAR_SYR_POL.4.t:0 "A National Political Pact"
 COLDWAR_SYR_POL.5.d:0 "Land tenure, citizenship and settlement policy have become inseparable. Cancelling discriminatory settlement requires a funded review; imposing the security plan deepens exclusion and unrest rather than moving populations automatically."
 COLDWAR_SYR_POL.5.option_a:0 "Cancel discrimination and fund the tenure review ($0.072bn)."
 COLDWAR_SYR_POL.5.option_a_outcome_tt:0 "Reject discriminatory settlement and open a funded land-tenure and citizenship-register review. Citizenship appeals can resume; existing exclusion is removed only after the appeals programme has actually been completed."
 COLDWAR_SYR_POL.5.option_b:0 "Impose the security settlement."
 COLDWAR_SYR_POL.5.option_b_outcome_tt:0 "Impose the discriminatory settlement. Minority representation agreements end and an internal political crisis begins, alongside the security and exclusion measures shown below."
 COLDWAR_SYR_POL.5.option_c:0 "Suspend the scheme pending agreement."
 COLDWAR_SYR_POL.5.option_c_outcome_tt:0 "Suspend the settlement scheme. No land-policy settlement or citizenship review is approved."
 COLDWAR_SYR_POL.5.t:0 "The Jazira Land Settlement"
 COLDWAR_SYR_POL.6.d:0 "Kurdish political organizations differ in leadership and priorities. Coalition representation rests on enforceable cultural guarantees and an appeals process. Each agreement belongs to the current cabinet; another government must negotiate its own terms."
 COLDWAR_SYR_POL.6.option_a:0 "Agree representation with Abdul Hamid Darwish."
 COLDWAR_SYR_POL.6.option_a_outcome_tt:0 "Agree cabinet representation with Abd al-Hamid Darwish. His earned representation programme applies under this cabinet; any Badr al-Din agreement ends."
 COLDWAR_SYR_POL.6.option_b:0 "Agree representation with Salah Badr al-Din."
 COLDWAR_SYR_POL.6.option_b_outcome_tt:0 "Agree cabinet representation with Salah Badr al-Din. His earned representation programme applies under this cabinet; any Darwish agreement ends."
 COLDWAR_SYR_POL.6.option_c:0 "Offer both organizations cabinet guarantees."
 COLDWAR_SYR_POL.6.option_c_outcome_tt:0 "Agree cabinet representation with both organizations. Both earned programmes apply under this cabinet. The agreements end if the governing party changes or discriminatory settlement is imposed."
 COLDWAR_SYR_POL.6.option_d:0 "The representatives cannot accept these terms."
 COLDWAR_SYR_POL.6.option_d_outcome_tt:0 "No representation agreement is signed. Existing cabinet arrangements remain unchanged."
 COLDWAR_SYR_POL.6.t:0 "Kurdish Representation Talks"
 COLDWAR_SYR_POL.7.d:0 "Public relief protects households but places a recurring burden on the budget. A temporary retrenchment saves money at the cost of consent. The two packages cannot operate together."
 COLDWAR_SYR_POL.7.option_a:0 "Target relief toward vulnerable households."
 COLDWAR_SYR_POL.7.option_a_outcome_tt:0 "Choose targeted household relief for 180 days. Any subsidy-restraint package ends; the benefit and recurring spending burden are shown below."
 COLDWAR_SYR_POL.7.option_b:0 "Restrain subsidy commitments."
 COLDWAR_SYR_POL.7.option_b_outcome_tt:0 "Choose subsidy restraint for 180 days. Any household-relief package ends; the fiscal saving and loss of public consent are shown below."
 COLDWAR_SYR_POL.7.t:0 "Subsidies and the Treasury"
 COLDWAR_SYR_POL.8.d:0 "Local representatives ask for protection from arbitrary detention and a route to resolve grievances. Dialogue can ease a crisis when the state accepts meaningful guarantees. A meeting without those commitments leaves the crisis intact."
 COLDWAR_SYR_POL.8.option_a:0 "Accept review and civilian guarantees."
 COLDWAR_SYR_POL.8.option_a_outcome_tt:0 "Accept binding civilian guarantees and settle the internal crisis. Unresolved Internal Unrest ends; administering the guarantees carries the 180-day burden shown below."
 COLDWAR_SYR_POL.8.option_b:0 "Refuse binding guarantees."
 COLDWAR_SYR_POL.8.option_b_outcome_tt:0 "Reject binding guarantees. The internal crisis and any Unresolved Internal Unrest remain in place."
 COLDWAR_SYR_POL.8.t:0 "Civilian Mediation"
 COLDWAR_SYR_POL.9.d:0 "Illness has raised a real question of command. Rival guard formations make the succession dangerous. The conference can preserve collective stewardship, allow the president's return, or accept Rifaat's challenge; the last option carries a command disruption."
 COLDWAR_SYR_POL.9.option_a:0 "Entrust a collective civilian stewardship."
 COLDWAR_SYR_POL.9.option_a_outcome_tt:0 "End the incapacity crisis under a collective Civilian Stewardship Council. Its earned programme replaces the individual president's leadership programme; rival guard commands still require their own settlement."
 COLDWAR_SYR_POL.9.option_b:0 "Negotiate Hafez's return to office."
 COLDWAR_SYR_POL.9.option_b_outcome_tt:0 "End the incapacity crisis and return Hafez al-Assad to office. His earned leadership programme resumes; rival guard commands still require their own settlement."
 COLDWAR_SYR_POL.9.option_c:0 "Accept Rifaat's challenge."
 COLDWAR_SYR_POL.9.option_c_outcome_tt:0 "End the incapacity crisis by accepting Rifaat al-Assad's presidency. His earned programme replaces Hafez's, with the 90-day command disruption shown below."
 COLDWAR_SYR_POL.9.t:0 "An Incapacitated Presidency"
 COLDWAR_SYR_decision_arab_belt:0 "Choose the Jazira Land Settlement"
 COLDWAR_SYR_decision_arab_belt_desc:0 "The proposed Jazira settlement brings land, citizenship and security into a single dangerous dispute. The cabinet can cancel discriminatory measures and fund a $0.072 billion tenure review, or impose a security settlement whose temporary control carries lasting exclusion and unrest. Suspending the scheme leaves the underlying choice unresolved."
 COLDWAR_SYR_decision_budget_review:0 "Review Subsidy Commitments"
 COLDWAR_SYR_decision_budget_review_desc:0 "Review how the state supports household consumption. Targeted relief can strengthen confidence while increasing social expenditure; subsidy restraint saves money but brings hardship and opposition. Choose a six-month response, accepting its political and financial consequences before another package can replace it."
 COLDWAR_SYR_decision_cabinet_mediation:0 "Convene Cabinet Mediation"
 COLDWAR_SYR_decision_cabinet_mediation_desc:0 "Bring the presidency, cabinet and party leadership to the same table. A settlement could preserve civilian direction, recognize the Regional Command's authority or prepare a negotiated transfer of office. Failure leaves the rivalry unresolved and damages public confidence; none of these men will surrender his position merely because talks have opened."
 COLDWAR_SYR_decision_campaign_emerging:0 "Campaign for Socialist Parties"
 COLDWAR_SYR_decision_campaign_emerging_desc:0 "Choose a legal socialist organization and mobilize its supporters around a distinct programme. Workers, public employees and rural activists do not all agree on what socialism requires of the state. This campaign strengthens the chosen party's voice without settling those arguments or placing it automatically in government."
 COLDWAR_SYR_decision_campaign_nationalist:0 "Campaign for Nationalist Parties"
 COLDWAR_SYR_decision_campaign_nationalist_desc:0 "Support a legal nationalist organization through a focused political campaign. Its activists must explain why their answer to Syria's weakness deserves confidence over the competing programmes of officers and rival parties. Organizing builds support for that choice; it does not itself confer the right to govern."
 COLDWAR_SYR_decision_campaign_nonaligned:0 "Campaign for Independent Arab Parties"
 COLDWAR_SYR_decision_campaign_nonaligned_desc:0 "Campaign for a registered independent Arab party, bringing its particular vision of unity, society and national independence before the public. Shared language about Arab interests will not remove political differences. The chosen organization can gain support while remaining responsible for winning authority through the existing political process."
 COLDWAR_SYR_decision_campaign_western:0 "Campaign for Constitutional Parties"
 COLDWAR_SYR_decision_campaign_western_desc:0 "Choose a registered constitutional party for a focused organizing campaign among voters and civic networks. Its supporters must persuade Syrians who remember both parliamentary bargaining and the crises that preceded military rule. The campaign builds that party's support; office must still be won through the country's political institutions."
 COLDWAR_SYR_decision_choose_brotherhood_leader:0 "Choose the Brotherhood Leadership"
 COLDWAR_SYR_decision_choose_brotherhood_leader_desc:0 "A governing Brotherhood must settle its own leadership as well as its relationship with the republic. Issam al-Attar and Adnan Saadeddin offer distinct political programmes; Saadeddin can be considered after his leadership organization has formed. The resulting choice still leaves substantive policy decisions to the cabinet."
 COLDWAR_SYR_decision_choose_communist_leader:0 "Choose the Communist Leadership"
 COLDWAR_SYR_decision_choose_communist_leader_desc:0 "The governing Communists must decide whether Khalid Bakdash's established leadership or Yusuf Faisal's organized faction should direct their programme. Faisal's alternative becomes available only after his faction has formed. The decision concerns leadership within the party, alongside the wider arguments over its relationship with the Ba'ath."
 COLDWAR_SYR_decision_choose_conservative_leader:0 "Choose the Conservative Leadership"
 COLDWAR_SYR_decision_choose_conservative_leader_desc:0 "The governing constitutional conservatives must choose their representative. Nazim al-Qudsi and Ma'ruf al-Dawalibi bring different political records and priorities to the restored civilian tradition. Endorsing either statesman places his own governing programme before the cabinet without settling the policies that it must still carry out."
 COLDWAR_SYR_decision_choose_nasserist_leader:0 "Choose the Arab Socialist Leadership"
 COLDWAR_SYR_decision_choose_nasserist_leader_desc:0 "Choose who will lead the governing Arab Socialist Union. Jamal al-Atassi offers one political direction, while Safwan al-Qudsi's later leadership must first build its own organization. The choice determines whose programme the government can pursue without assuming that either man has already secured every commitment of his supporters."
 COLDWAR_SYR_decision_citizenship_review:0 "Process Citizenship Appeals"
 COLDWAR_SYR_decision_citizenship_review_desc:0 "Commission staff must examine family records, hear appeals and correct the exclusions left by the 1962 census. Each funded stage costs $0.036 billion. Three completed stages will conclude the review, allowing equal-citizenship measures to rest on resolved cases rather than another unfulfilled declaration from Damascus."
 COLDWAR_SYR_decision_coalition_emerging:0 "Negotiate a Emerging Coalition"
 COLDWAR_SYR_decision_coalition_emerging_desc:0 "Seek a governing agreement with a legal socialist partner that commands sufficient support. Cabinet representation can give cooperation practical meaning, provided the parties accept common responsibilities without pretending their programmes are identical. The resulting coalition adds a partner rather than replacing the party already leading the government."
 COLDWAR_SYR_decision_coalition_nationalist:0 "Negotiate a Nationalist Coalition"
 COLDWAR_SYR_decision_coalition_nationalist_desc:0 "Invite a sufficiently supported and legal nationalist party into coalition negotiations. Agreement will require practical compromises among organizations with competing claims to national authority. An accepted partner joins the cabinet's coalition; it does not acquire an automatic right to replace the current government or dictate its programme."
 COLDWAR_SYR_decision_coalition_nonaligned:0 "Negotiate a Nonaligned Coalition"
 COLDWAR_SYR_decision_coalition_nonaligned_desc:0 "Discuss cabinet representation with a legal independent Arab partner that has a sufficient base of support. A successful agreement must reconcile its priorities with those of the governing party. Coalition membership follows accepted terms, while each organization retains its identity and responsibility toward its supporters."
 COLDWAR_SYR_decision_coalition_western:0 "Negotiate a Western Coalition"
 COLDWAR_SYR_decision_coalition_western_desc:0 "Negotiate cabinet terms with a legal constitutional partner that has sufficient public support. Conservatives and civic reformers may agree on parliamentary institutions while disputing social and economic policy. An accepted bargain brings the partner into the coalition, leaving the governing party responsible for maintaining the agreement."
 COLDWAR_SYR_decision_corrective_vote:0 "Put the Corrective Programme to the Command"
 COLDWAR_SYR_decision_corrective_vote_desc:0 "Submit the corrective programme to the command. A secure officer compact and cabinet assent can carry a transitional presidency into office. Attempting the change without that foundation risks ninety days of disrupted army organization, while withdrawing the proposal leaves room for further bargaining."
 COLDWAR_SYR_decision_drought:0 "Activate Drought Relief"
 COLDWAR_SYR_decision_drought_desc:0 "A failed harvest threatens rural livelihoods and the country's food supply. Commit $0.072 billion to relief distribution, temporarily easing part of the agricultural loss while the crisis lasts. Assistance cannot restore the missing rains or turn an emergency into a permanent source of increased production."
 COLDWAR_SYR_decision_enterprise_audit:0 "Audit an Enterprise Contract"
 COLDWAR_SYR_decision_enterprise_audit_desc:0 "Investigate an enterprise contract, its suppliers and the officials responsible for approving it. Each audit costs $0.036 billion and temporarily disrupts production while records are examined. Three completed investigations will provide the foundation for broader procurement reform, without pretending that one inspection can cleanse the entire state sector."
 COLDWAR_SYR_decision_form_faisal_faction:0 "Convene Faisal's Communist Faction"
 COLDWAR_SYR_decision_form_faisal_faction_desc:0 "The Communist division of 1986 allows Yusuf Faisal's supporters to organize a distinct faction. Its formation brings their alternative into the party's leadership debate, while replacing the leader of a governing Communist cabinet remains a separate decision rather than an automatic consequence of the split."
 COLDWAR_SYR_decision_form_political_bureau:0 "Organize the Communist Political Bureau"
 COLDWAR_SYR_decision_form_political_bureau_desc:0 "The Communist split of 1973 opens space for Riyad al-Turk's Political Bureau to organize an independent socialist current. Establishing it gives the movement a political foundation, while lawful participation depends on an accepted national pact and governing authority must still be won through public support."
 COLDWAR_SYR_decision_form_saadeddin_leadership:0 "Organize Saadeddin's Brotherhood Leadership"
 COLDWAR_SYR_decision_form_saadeddin_leadership_desc:0 "From 1975, Adnan Saadeddin's supporters can establish the leadership organization needed to offer their own direction for the Brotherhood. Building that network prepares a political alternative; a governing Brotherhood must still make a separate choice about who will lead it."
 COLDWAR_SYR_decision_form_safwan_leadership:0 "Organize Safwan's Arab Socialist Leadership"
 COLDWAR_SYR_decision_form_safwan_leadership_desc:0 "From 1983, organize the later Arab Socialist leadership associated with Safwan al-Qudsi. Its establishment gives the movement another political direction to consider, while a government led by the Arab Socialist Union must still decide whether to endorse him as its leader."
 COLDWAR_SYR_decision_front_offer:0 "Offer Coalition Terms"
 COLDWAR_SYR_decision_front_offer_desc:0 "A National Front could bring Communist or Arab Socialist partners into the cabinet without erasing their organizations. Open talks with a legal partner that commands sufficient support, offering representation in return for agreed governing terms. The front will have substance only if the participating parties can accept the arrangement."
 COLDWAR_SYR_decision_governing_mandate:0 "Settle the Ba’ath Governing Mandate"
 COLDWAR_SYR_decision_governing_mandate_desc:0 "Clarify whether the governing programme follows Nureddin al-Atassi's civilian direction or Salah Jadid's dominant Regional Command. The choice concerns the authority behind policy while Atassi remains the formal president. Any later transfer of the presidency must be achieved through a separate and genuine settlement."
 COLDWAR_SYR_decision_guard_bargain:0 "Bargain with Rival Guard Commands"
 COLDWAR_SYR_decision_guard_bargain_desc:0 "Rival guard commands have become centres of influence in their own right. Commit $0.096 billion to negotiations over a unified chain of command. An accepted settlement can resolve the confrontation; rejecting the proposed bargain risks ninety days of disruption within the army."
 COLDWAR_SYR_decision_irrigation_trial:0 "Run Irrigation and Drainage Trials"
 COLDWAR_SYR_decision_irrigation_trial_desc:0 "Test water delivery, drainage and soil conditions before extending irrigation across the valley. Each trial stage costs $0.060 billion, and three separate stages must be completed. The results will support dependable irrigation and reduced rainfall vulnerability; trial plots alone are no substitute for the wider works still required."
 COLDWAR_SYR_decision_kurdish_coalition:0 "Negotiate Kurdish Coalition Representation"
 COLDWAR_SYR_decision_kurdish_coalition_desc:0 "Negotiate representation with Abdul Hamid Darwish, Salah Badr al-Din or both organizations. An appeals process and credible cultural guarantees must give the talks substance. The resulting compact belongs to this cabinet; its partners will expect a future government to negotiate its own commitments rather than inherit their consent automatically."
 COLDWAR_SYR_decision_military_transfer:0 "Transfer Authority to a Civilian Cabinet"
 COLDWAR_SYR_decision_military_transfer_desc:0 "Negotiate a constitutional transfer from military rule to civilian government, including legal parties and competitive elections. The army will face a period of uncertainty as its political authority recedes. Accepting the transfer establishes a route to civilian power without selecting the electorate's eventual governing party in advance."
 COLDWAR_SYR_decision_national_pact:0 "Negotiate a National Political Pact"
 COLDWAR_SYR_decision_national_pact_desc:0 "Invite the cabinet and political leadership to negotiate lawful opposition and competitive elections. Accepting the pact will end the monopoly of one-party government and bring 180 days of difficult adjustment. Refusal preserves the restrictions, while agreement leaves future governments to be determined by political support and elections."
 COLDWAR_SYR_decision_officer_bargain:0 "Negotiate with the Officer Corps"
 COLDWAR_SYR_decision_officer_bargain_desc:0 "The officer corps cannot be treated as a single loyal instrument while senior commanders dispute the government's direction. Negotiations can secure another measure of support and a temporary understanding, though no compact can replace a settlement of the divided command. Each round charges $2.000 billion to the treasury and can be financed through borrowing; at most three can build backing."
 COLDWAR_SYR_decision_reconvene_mediation:0 "Reopen Cabinet Mediation"
 COLDWAR_SYR_decision_reconvene_mediation_desc:0 "Previous mediation failed to resolve the struggle between the cabinet, party and armed forces. Reopen the talks and give the rivals another opportunity to agree who can issue binding orders. The offices and underlying conflict remain as they are until an actual settlement is accepted."
 COLDWAR_SYR_decision_reopen_pact_talks:0 "Reopen Constitutional Pact Talks"
 COLDWAR_SYR_decision_reopen_pact_talks_desc:0 "Return to constitutional negotiations after the earlier proposal was rejected. Legal opposition and competitive elections require a genuine agreement, with the responsibilities and uncertainty it brings. Reopening talks gives the cabinet another choice without assuming that the institutions resisting reform have already accepted its terms."
 COLDWAR_SYR_decision_reopen_registers:0 "Reconsider the Citizenship Registers"
 COLDWAR_SYR_decision_reopen_registers_desc:0 "Reverse the refusal to reconsider the citizenship registers. Reopening the question costs $0.180 billion and brings 180 days of political uncertainty as old decisions are challenged. The same substantive appeals process must then resolve the remaining cases; accepting review is the beginning of redress, not its completion."
 COLDWAR_SYR_decision_security_response:0 "Authorize Emergency Security Operations"
 COLDWAR_SYR_decision_security_response_desc:0 "Authorize emergency operations at a cost of $0.096 billion. Coercion may restore visible order temporarily, but it restricts intellectual life, increases administrative expenditure and invites foreign scrutiny. The aftermath lasts 180 days, and other governments will make their own decisions about how to respond."
 COLDWAR_SYR_decision_succession_crisis:0 "Convene a Succession Conference"
 COLDWAR_SYR_decision_succession_crisis_desc:0 "The president's incapacity has exposed the rival commands behind the apparent unity of the state. Convene a conference to choose collective stewardship, restore presidential authority or accept Rifaat's challenge. The outcome must address the actual struggle for command, rather than assume that an orderly succession has already been secured."
 COLDWAR_SYR_decision_tabqa_resettle:0 "Fund Reservoir Resettlement"
 COLDWAR_SYR_decision_tabqa_resettle_desc:0 "Families displaced by the Euphrates reservoir need homes, services and a viable future before the project can be commissioned responsibly. Commit $0.120 billion to the resettlement programme. Housing and welfare obligations will burden construction for 180 days, after which the completed work can support the next stage at Tabqa."
 COLDWAR_SYR_decision_unrest_mediation:0 "Open Civilian Unrest Mediation"
 COLDWAR_SYR_decision_unrest_mediation_desc:0 "Local grievances have grown beyond what another order from the capital can settle. Spend $0.048 billion to bring civilian representatives into mediation. Meaningful guarantees can ease the crisis, but refusing them will leave unrest unresolved after the government has already paid for the attempt."
 COLDWAR_SYR_decision_withdraw_rights_coalition:0 "End the Minority Representation Compact"
 COLDWAR_SYR_decision_withdraw_rights_coalition_desc:0 "End the cabinet's representation compact with the Kurdish rights organizations. Their associated governing programmes will cease to guide the administration, while the policies already developed remain available if a future government negotiates a valid new agreement. Ending representation does not itself establish a new citizenship settlement."
 COLDWAR_SYR_party_1:0 "Constitutional Conservatives"
 COLDWAR_SYR_party_12:0 "Syrian Muslim Brotherhood"
 COLDWAR_SYR_party_12_desc:0 "The Syrian Muslim Brotherhood draws on religious, urban and social networks that contest the secular state's claim to political authority. Its leaders differ over organization and political accommodation. A lawful governing route requires a settlement broad enough to protect the republic's diverse communities and sustain public institutions."
 COLDWAR_SYR_party_13:0 "Arab Socialist Union"
 COLDWAR_SYR_party_13_desc:0 "The Arab Socialist Union carries the Nasserist tradition of Arab unity, social reform and an enduring connection to Cairo. Its Syrian leaders must decide how to pursue that ideal while preserving an independent voice within domestic politics and negotiating the powerful institutions surrounding the Ba'ath state."
 COLDWAR_SYR_party_1_desc:0 "The constitutional conservative tradition draws upon the parliamentary republic, commercial networks and civilian statesmen displaced by military rule. Its supporters seek restored legality and representative institutions, while differing over how much of the social and economic transformation of the 1960s should be retained."
 COLDWAR_SYR_party_2:0 "Civic Liberal Bloc"
 COLDWAR_SYR_party_20:0 "Syrian Social Nationalist Party"
 COLDWAR_SYR_party_20_desc:0 "The Syrian Social Nationalist Party advocates a wider Syrian nation distinct from the Ba'ath's pan-Arab vision. Its disciplined organization brings a long history of activism and confrontation, while any return to governing influence must confront the practical demands of institutions, regional relations and accommodation with rival political currents."
 COLDWAR_SYR_party_21:0 "Iraqi-Aligned Ba'ath Organization"
 COLDWAR_SYR_party_21_desc:0 "Iraqi-aligned Ba'athists preserve networks and ambitions displaced by the struggle within Syria's ruling movement. Amin al-Hafiz offers an exile's claim to restoration, but recovering power would not erase the rivalry between Damascus and Baghdad or settle which country's leadership should define the reunited party's direction."
 COLDWAR_SYR_party_22:0 "Provisional Military Council"
 COLDWAR_SYR_party_22_desc:0 "A provisional military council claims authority from the armed forces and the need to preserve national order. Its officers must choose whether emergency stewardship becomes an enduring political system or gives way to a negotiated civilian settlement, while keeping the army coherent enough to fulfil its defence responsibilities."
 COLDWAR_SYR_party_2_desc:0 "Civic liberals bring lawyers, professional circles and advocates of representative government into a common political current. They seek public accountability and civil freedoms, but must build durable institutions in a country where factional conflict and military intervention have repeatedly overwhelmed the promises of constitutional life."
 COLDWAR_SYR_party_3:0 "Independent Socialist Opposition"
 COLDWAR_SYR_party_3_desc:0 "The independent socialist opposition seeks a Marxist political life beyond the discipline of the dominant party. Its emerging Political Bureau under Riyad al-Turk combines social demands with a growing concern for political freedom, placing it in difficult relations with both the Ba'ath authorities and the established Communist leadership."
 COLDWAR_SYR_party_4:0 "Syrian Communist Party"
 COLDWAR_SYR_party_4_desc:0 "The Syrian Communist Party has deep organizing experience and a leadership closely associated with Khalid Bakdash. Cooperation with the Ba'ath offers influence but sharpens arguments over independence and democracy. Later factional divisions will test whether participation in government serves the movement's social programme or subordinates it."
 COLDWAR_SYR_party_7:0 "Arab Socialist Ba'ath Party"
 COLDWAR_SYR_party_7_desc:0 "The Arab Socialist Ba'ath Party governs through a fusion of revolutionary institutions, the Regional Command and the armed forces. Arab unity and socialism supply its public language, while rival civilian and military centres struggle over who has the authority to define the party's direction."
 COLDWAR_SYR_politics_category:0 "Syrian Institutions and Domestic Settlements"
 COLDWAR_SYR_politics_category_desc:0 "Resolve the rivalry within the Ba'ath state, negotiate political representation and carry reforms into the provinces. Citizenship appeals, enterprise investigations and Euphrates works require time and funding; talks with officers and civilian parties will demand compromises which a cabinet declaration cannot secure on its own."
 COLDWAR_SYR_politics_command_disruption:0 "Contested Army Command"
 COLDWAR_SYR_politics_command_disruption_desc:0 "A contested transfer of authority has left officers uncertain whose instructions will prevail. Rival loyalties and interrupted coordination weaken the army's organization until a dependable chain of command can reassert itself. Political victory at the top has not yet produced cohesion within the ranks."
 COLDWAR_SYR_politics_crop_crisis:0 "Failed Harvests"
 COLDWAR_SYR_politics_crop_crisis_desc:0 "Failed harvests have reduced agricultural output and placed rural incomes under pressure. Relief can ease some of the immediate loss, but the missing crop exposes the country's dependence on rainfall and the unfinished work of building a more resilient agricultural economy."
 COLDWAR_SYR_politics_drought_relief:0 "Drought Relief Distribution"
 COLDWAR_SYR_politics_drought_relief_desc:0 "Relief teams are distributing assistance to districts suffering from failed harvests. Their work offsets part of the agricultural loss while the crisis persists, helping cultivators keep their farms functioning. It cannot replace favourable weather or remove the longer-term need for sound water and soil management."
 COLDWAR_SYR_politics_enterprise_audit:0 "Enterprise Contract Investigation"
 COLDWAR_SYR_politics_enterprise_audit_desc:0 "Investigators are examining procurement records, supplier arrangements and the conduct of enterprise officials. The inquiry disrupts normal production while evidence is secured and decisions are reviewed. That temporary loss is part of the cost of learning how public contracts have actually been administered."
 COLDWAR_SYR_politics_exclusion:0 "Exclusionary Settlement Policy"
 COLDWAR_SYR_politics_exclusion_desc:0 "The security settlement has reinforced exclusion in the Jazira rather than resolved the dispute over land and citizenship. Grievances undermine confidence in the state and consume political authority. Reconciliation requires substantive review and redress, rather than a change in the language used to defend the policy."
 COLDWAR_SYR_politics_mediation_guarantees:0 "Civilian Mediation Guarantees"
 COLDWAR_SYR_politics_mediation_guarantees_desc:0 "Civilian mediation has produced guarantees that public institutions must now honour. Hearings, supervision and continued contact require additional administration, but these obligations give the agreement meaning beyond the meeting room. Confidence will depend on whether local communities see the promised protections applied in practice."
 COLDWAR_SYR_politics_officer_compact:0 "Temporary Officers' Compact"
 COLDWAR_SYR_politics_officer_compact_desc:0 "A temporary understanding with influential officers has eased immediate uncertainty. The compromise strengthens confidence while it lasts, but personal assurances are not a permanent institutional settlement. The government must use the breathing space to resolve the struggle between the party, cabinet and armed forces."
 COLDWAR_SYR_politics_register_reversal:0 "Reopening the Citizenship Registers"
 COLDWAR_SYR_politics_register_reversal_desc:0 "Reopening citizenship cases challenges decisions the authorities previously defended as final. Old assumptions, competing claims and the prospect of redress create a difficult period of uncertainty. The disruption will endure while the administration begins the substantive work needed to restore confidence in the review."
 COLDWAR_SYR_politics_resettlement_burden:0 "Reservoir Resettlement Programme"
 COLDWAR_SYR_politics_resettlement_burden_desc:0 "Households displaced by the Euphrates reservoir need replacement homes and access to services. Meeting those obligations draws resources away from other construction and increases social expenditure. The reservoir's promise cannot justify leaving the people affected by its creation without a viable future."
 COLDWAR_SYR_politics_restraint:0 "Subsidy Restraint"
 COLDWAR_SYR_politics_restraint_desc:0 "The government is restraining subsidy commitments to reduce social expenditure. Savings reach the budget before households can adjust to the loss of familiar protection, weakening confidence and giving critics a visible grievance. Financial relief for the state comes with an immediate political cost."
 COLDWAR_SYR_politics_security_aftermath:0 "Emergency Operations and Aftermath"
 COLDWAR_SYR_politics_security_aftermath_desc:0 "Emergency operations have strengthened visible control while restricting intellectual activity and placing new demands on public administration. The government's greater capacity to impose order is accompanied by the financial and institutional burden of enforcement, alongside questions about the consequences for civilians and Syria's foreign relationships."
 COLDWAR_SYR_politics_security_control:0 "Security Settlement Operations"
 COLDWAR_SYR_politics_security_control_desc:0 "Security authorities are imposing the government's chosen settlement through an expanded administrative presence. Visible control may strengthen order for a time, but supervision and enforcement increase bureaucracy costs while the underlying questions of land, representation and citizenship remain to be answered."
 COLDWAR_SYR_politics_targeted_relief:0 "Targeted Household Relief"
 COLDWAR_SYR_politics_targeted_relief_desc:0 "Additional support is reaching households judged most vulnerable to rising costs and lost income. The programme strengthens confidence in public protection, while requiring greater social expenditure. Its temporary character leaves the government responsible for deciding how support will be financed when the present relief period ends."
 COLDWAR_SYR_politics_transition_burden:0 "Constitutional Transition"
 COLDWAR_SYR_politics_transition_burden_desc:0 "Legal opposition and competitive politics are replacing the familiar discipline of one-party rule. Expectations, rival organizations and unresolved guarantees make this a difficult adjustment, reducing the government's political freedom and public confidence while the new constitutional arrangements establish themselves."
 COLDWAR_SYR_politics_unrest:0 "Unresolved Internal Unrest"
 COLDWAR_SYR_politics_unrest_desc:0 "Unresolved grievances have spread beyond isolated local complaints. Distrust weakens public confidence and disrupts industrial activity, while the government faces demands it can no longer dismiss through routine administration. Mediation or coercion will carry very different costs, and neither should be mistaken for an effortless settlement."
