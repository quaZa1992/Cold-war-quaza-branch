l_english:
 # IMPERIA COLD WAR — Covert Action v2 (Scandal, Brain Drain, strength-scaled results).
 CYBER_BTN_SCANDAL: "Scandal"
 CYBER_SCANDAL_BTN_TT: "§YPrerequisites:§!\n[!cyber_scandal_button_click_enabled]\n§YEffect:§!\n[!cyber_scandal_button_click]"
 CYBER_SCANDAL_BTN_TT_DELAYED: "A minister's bank account abroad, a party treasurer's mistress, photographs from a hotel in Vienna: our service hands the right file to the right newspaper at the right moment. The government spends months denying it."
 CYBER_BTN_BRAIN: "Brain Drain"
 CYBER_BRAIN_BTN_TT: "§YPrerequisites:§!\n[!cyber_brain_drain_button_click_enabled]\n§YEffect:§!\n[!cyber_brain_drain_button_click]"
 CYBER_BRAIN_BTN_TT_DELAYED: "Visas, laboratories and salaries the target cannot match: our people approach its physicists, engineers and designers one by one. Whole teams leave for a conference and never return, and their work continues in our institutes."
 COLDWAR_ca_strength_tt: "§gOn success the result scales with the strength of the operation: our offensive power, decryption and access against the target's counter-intelligence (x0.55 to x1.45).§!"
 COLDWAR_ca_counterfeit_infl_tt: "Inflation pressure: §R+6 points§! for the next quarter, times the strength of the operation"
 COLDWAR_ca_speculation_infl_tt: "Inflation pressure: §R+10 points§! for the next quarter, times the strength of the operation"
 COLDWAR_ca_fund_party_tt: "Ruling party popularity: §R-4%§!; the party of our own ruling outlook: §G+5%§!, times the strength of the operation"
 COLDWAR_ca_scandal_party_tt: "Ruling party popularity: §R-6%§! times the strength of the operation, halved where there are no elections"
 COLDWAR_ca_brain_severe_tt: "A very strong operation also adds §RInstitutes Emptied§! for 180 days"
