 MD_cyber.119.t: "A Government Scandal"
 MD_cyber.119.d: "Documents about the private dealings of our ministers have appeared in the newspapers. Every denial makes it worse, and the opposition demands resignations."
 MD_cyber.119.a: "Somebody wanted this to come out."
 MD_cyber.120.t: "Our Scientists Are Leaving"
 MD_cyber.120.d: "A delegation of our physicists and engineers did not come back from a conference abroad. Their institutes report that others have received the same offers."
 MD_cyber.120.a: "Find out who recruited them."
 cyber_scandal_malus: "Government Scandal"
 cyber_scandal_malus_desc: "Leaked files about our ministers dominate the press. The government spends its strength on denials and resignations."
 cyber_brain_drain_malus: "Brain Drain"
 cyber_brain_drain_malus_desc: "Recruited by a foreign service, our scientists and engineers are leaving. Research programmes stall without them."
 cyber_brain_drain_severe: "Institutes Emptied"
 cyber_brain_drain_severe_desc: "Whole teams have left at once. Laboratories stand empty and projects have to start again."
 cyber_brain_drain_gain: "Recruited Scientists"
 cyber_brain_drain_gain_desc: "Scientists and engineers recruited abroad now work in our institutes."
