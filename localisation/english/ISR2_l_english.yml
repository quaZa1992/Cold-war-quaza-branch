 ISR2_eastern_credit:0 "Soviet Development Credit"
 ISR2_eastern_credit_desc:0 "A communist cabinet may seek credit from Moscow, but an RP Soviet government must decide whether to lend. Borrowing is a financial contract rather than a compulsory faction choice."
 ISR2_eilat_link:0 "Eilat's Commercial Route"
 ISR2_eilat_link_desc:0 "A southern route gives commerce another outlet when northern access is uncertain. Building it requires maintenance and dependable arrangements with the countries along the route."
 ISR2_elta:0 "ELTA Electronics"
 ISR2_elta_desc:0 "Radar and communications suppliers can share a practical testing establishment. Reserving their work for defence makes the military customer less dependent on foreign deliveries."
 ISR2_elta_research:0 "ELTA Electronics"
 ISR2_essential_workers:0 "Essential Workshops"
 ISR2_essential_workers_desc:0 "Reserve assignments can protect the technicians who keep water, repair and power services functioning. Readiness will improve more slowly in units that release those specialists."
 ISR2_european_orders:0 "Romania: Workshop Pact"
 ISR2_european_orders_desc:0 "Expand commercial relations through a civilian agreement that can survive disagreement over arms. The partner receives a concrete commercial proposal, not a change of alignment."
 ISR2_export_services:0 "Small Exporter Services"
 ISR2_export_services_desc:0 "Pooling legal, shipping and marketing services can let a workshop sell abroad without becoming a conglomerate first. Keep the service open to firms beyond the governing party's own network."
 ISR2_financing_ger:0 "West German Investment"
 ISR2_financing_ger_desc:0 "Offer a defined investment in Israeli civilian and development projects. The investor supplies real capital and acquires an international investment asset. Capital still unallocated after one year returns to its owner."
 ISR2_financing_rom:0 "Romanian Investment"
 ISR2_financing_rom_desc:0 "Offer a defined investment in Israeli civilian and development projects. The investor supplies real capital and acquires an international investment asset. Capital still unallocated after one year returns to its owner."
 ISR2_financing_usa:0 "US Project Investment"
 ISR2_financing_usa_desc:0 "Offer a defined investment in Israeli civilian and development projects. The investor supplies real capital and acquires an international investment asset. Capital still unallocated after one year returns to its owner."
 ISR2_foreign_footholds:0 "West Bank Footholds"
 ISR2_foreign_footholds_desc:0 "Fund an illegal settlement presence where Israel does not control the territory. Its external supply and investment network benefits Israel while imposing disruption and administrative pressure on the host."
 ISR2_foreign_service:0 "A Small-State Diplomacy"
 ISR2_foreign_service_desc:0 "Diplomats, commercial officers and technical advisers can open doors that military strength cannot keep open by itself. Give their work a permanent establishment."
 ISR2_free_center_mobilization_speed:0 "Mobilization Speed: $RIGHT|+=%1$"
 ISR2_free_center_political_power_factor:0 "Political Power Gain: $RIGHT|+=%1$"
 ISR2_free_center_stability_factor:0 "Stability: $RIGHT|+=%1$"
 ISR2_funded_network:0 "External Support Network"
 ISR2_funded_network_desc:0 "Support offices and transport arrangements keep a foreign foothold connected to the Israeli economy. Expanding the network also enlarges its recurring financial commitment."
 ISR2_gabriel:0 "Gabriel Missile Boats"
 ISR2_gabriel_desc:0 "A domestic anti-ship weapon needs vessels, training and reliable maintenance. Naval investment provides another answer to supplier uncertainty without replacing the whole fleet overnight."
 ISR2_gabriel_research:0 "Gabriel Missile Boats"
 ISR2_gahal_arbitration:0 "Compulsory Arbitration"
 ISR2_gahal_arbitration_desc:0 "Send essential-service wage disputes to binding national arbitration. Production and repairs become more predictable at the price of curtailing strike action and provoking organised resistance."
 ISR2_gahal_big_bang:0 "Ehrlich's Currency Reform"
 ISR2_gahal_big_bang_desc:0 "Open access to foreign currency and borrowing in one decisive reform. Capital access improves, while the economy assumes greater market exposure and a higher cost of inflation."
 ISR2_gahal_bureaucracy_cost_multiplier_modifier:0 "Bureaucracy Cost: $RIGHT|-=%1$"
 ISR2_gahal_civilian_factories_productivity:0 "Civilian Industry Productivity: $RIGHT|+=%1$"
 ISR2_gahal_corporate_tax_income_multiplier_modifier:0 "Corporate Tax Income: $RIGHT|+=%1$"
 ISR2_gahal_daily_workers:0 "Equal Daily-Worker Terms"
 ISR2_gahal_daily_workers_desc:0 "Give daily-paid workers enforceable contract and insurance terms instead of a weaker route into the same workplace. More predictable employment improves industrial organisation while increasing social commitments."
 ISR2_gahal_development_receipts:0 "Development Revenue"
 ISR2_gahal_development_receipts_desc:0 "Retain a broad corporate contribution while financing public commitments. The budget becomes less dependent on another sale, at the cost of a slower private office-construction programme."
 ISR2_gahal_disposal:0 "A Second Asset Auction"
 ISR2_gahal_disposal_desc:0 "A second disposal brings another immediate receipt and gives up another future public dividend. Publishing the sale does not make the state richer by the same amount every time a cabinet returns to office."
 ISR2_gahal_health_bill:0 "The Health Insurance Bill"
 ISR2_gahal_health_bill_desc:0 "Offer a common insurance arrangement beyond compulsory membership in a party-linked health network. Consolidated administration can save money, but extending cover requires a continuing public provision."
 ISR2_gahal_health_cost_multiplier_modifier:0 "Healthcare Cost: $RIGHT|-=%1$"
 ISR2_gahal_industrial_capacity_factory:0 "Factory Output: $RIGHT|+=%1$"
 ISR2_gahal_industry_repair_factor:0 "Industry Repair Speed: $RIGHT|+=%1$"
 ISR2_gahal_inflation_cost_multiplier_modifier:0 "Inflation Spending Multiplier: $RIGHT|-=%1$"
 ISR2_gahal_interest_rate_multiplier_modifier:0 "Interest Rate: $RIGHT|-=2$ percentage points"
 ISR2_gahal_investors:0 "Overseas Investors"
 ISR2_gahal_investors_desc:0 "Present investors with defined tenders and transparent access to government contracts. A conference can improve the terms of investment only while its service and guarantee commitments remain funded."
 ISR2_gahal_investors_research:0 "Overseas Investors"
 ISR2_gahal_local_autonomy:0 "Palestinian Civic Terms"
 ISR2_gahal_local_autonomy_desc:0 "A civilian autonomy offer can separate municipal powers from the cabinet's sovereignty claim. A Palestinian RP government decides whether the proposed service agreement is worth accepting; settlement permission is not part of it."
 ISR2_gahal_managed_credit:0 "A Managed Capital Account"
 ISR2_gahal_managed_credit_desc:0 "Preserve controlled access to external credit while widening domestic borrowing. The treasury accepts the licensing establishment in exchange for less exposure to sudden movements of capital."
 ISR2_gahal_mdcw_cw_market_exposure:0 "World-Market Exposure: $RIGHT|-=%1$"
 ISR2_gahal_ministries:0 "Departmental Merger"
 ISR2_gahal_ministries_desc:0 "Reduce overlapping ministerial establishments while retaining the service desks that firms and households actually use. Reorganisation costs money before the smaller establishment begins to save it."
 ISR2_gahal_offices_productivity:0 "Office Productivity: $RIGHT|+=%1$"
 ISR2_gahal_pensions:0 "Portable Pension Rights"
 ISR2_gahal_pensions_desc:0 "Employment should not trap a household inside a particular party-linked institution. A portable pension commitment broadens economic mobility while leaving the state to fund its guarantees."
 ISR2_gahal_production_factory_efficiency_gain_factor:0 "Production Efficiency Growth: $RIGHT|+=%1$"
 ISR2_gahal_production_speed_offices_factor:0 "Office Construction Speed: $RIGHT|+=%1$"
 ISR2_gahal_receiving_investment_cost_modifier:0 "Incoming Investment Cost: $RIGHT|-=%1$"
 ISR2_gahal_renewal:0 "Neighbourhood Renewal"
 ISR2_gahal_renewal_desc:0 "Work on the neighbourhood as a whole: transport, employment services and public facilities. A local partnership can make the programme more effective without sending its civilian funds into the arms budget."
 ISR2_gahal_rental_sites:0 "Rental-Housing Links"
 ISR2_gahal_rental_sites_desc:0 "Private rental construction still needs roads and public utilities. Put the public part of the housing programme into the ground instead of treating an investors conference as completed homes."
 ISR2_gahal_settlement_match:0 "Settlement Matching Fund"
 ISR2_gahal_settlement_match_desc:0 "Reserve the same limited public appropriation and accepted partner capital for controlled territorial development instead of domestic housing. The appropriation reduces later project payments while every site retains its own security and administrative bill."
 ISR2_gahal_settler_entitlement:0 "Settlement Entitlements"
 ISR2_gahal_settler_entitlement_desc:0 "Give civilian settlers a funded farm, a commercial office and access infrastructure in territory Israel controls. The state gains productive assets while hardening a costly and contested territorial commitment."
 ISR2_gahal_social_cost_multiplier_modifier:0 "Social Spending Cost: $RIGHT|-=%1$"
 ISR2_gahal_stability_factor:0 "Stability: $RIGHT|+=%1$"
 ISR2_gahal_tax_cut:0 "Cut the Corporate Burden"
 ISR2_gahal_tax_cut_desc:0 "Use the smaller ministerial establishment to reduce the tax burden on firms. The private economy gains commercial room while the treasury deliberately forgoes part of its corporate revenue."
 ISR2_gaza_foothold:0 "Gaza Footholds"
 ISR2_gaza_foothold_desc:0 "Fund an illegal settlement presence where Israel does not control the territory. Its external supply and investment network benefits Israel while imposing disruption and administrative pressure on the host."
 ISR2_gaza_projects:0 "Gaza Settlement Works"
 ISR2_gaza_projects_desc:0 "Military-backed settlement development can only build on ground the state actually controls. Agricultural assets and a protected access road are paid projects, with a continuing security establishment."
 ISR2_golan_foothold:0 "Golan Footholds"
 ISR2_golan_foothold_desc:0 "Fund an illegal settlement presence where Israel does not control the territory. Its external supply and investment network benefits Israel while imposing disruption and administrative pressure on the host."
 ISR2_golan_projects:0 "Golan Settlement Works"
 ISR2_golan_projects_desc:0 "Military-backed settlement development can only build on ground the state actually controls. Agricultural assets and a protected access road are paid projects, with a continuing security establishment."
 ISR2_haolam_bureaucracy_cost_multiplier_modifier:0 "Bureaucracy Cost: $RIGHT|-=%1$"
 ISR2_haolam_complaints:0 "Police Complaints Board"
 ISR2_haolam_complaints_desc:0 "Put complaints and procurement records before a public commission with powers to investigate. Correcting abuse and waste requires a paid inquiry rather than merely improving the government's public image."
 ISR2_haolam_compliance_gain:0 "Controlled Non-Core Territory: Compliance Gain: $RIGHT|+=%1$"
 ISR2_haolam_corruption_cost_factor:0 "Corruption Cost: $RIGHT|-=%1$"
 ISR2_haolam_detention_review:0 "Military Detention Review"
 ISR2_haolam_detention_review_desc:0 "Require a funded legal review of military detention and access to defence. A less arbitrary administration can reduce friction in controlled territory while increasing court and police expenditure."
 ISR2_haolam_joint_services:0 "Joint Municipal Services"
 ISR2_haolam_joint_services_desc:0 "Make a concrete service proposal to a Palestinian RP government without requiring either side to accept a final territorial settlement. The partner decides whether to join a paid shared-service arrangement."
 ISR2_haolam_offices_productivity:0 "Office Productivity: $RIGHT|+=%1$"
 ISR2_haolam_police_cost_multiplier_modifier:0 "Police Cost: $RIGHT|-=%1$"
 ISR2_haolam_political_power_factor:0 "Political Power Gain: $RIGHT|+=%1$"
 ISR2_haolam_resistance_damage_to_garrison:0 "Damage to Garrisons: $RIGHT|+=%1$"
 ISR2_hatzerim:0 "Hatzerim: More per Drop"
 ISR2_hatzerim_desc:0 "A kibbutz workshop can become an exporter of a practical answer to arid farming. Demonstration plots will make the new irrigation method usable beyond its first customers."
 ISR2_hatzerim_research:0 "Hatzerim: More per Drop"
 ISR2_hearing_towns:0 "Neighbourhood Repairs"
 ISR2_hearing_towns_desc:0 "Give the neighbourhood committees a paid repair programme and a public hearing. Maintenance teams address the homes and services behind the complaints, while the treasury carries the stated appropriation."
 ISR2_herut_charter:0 "Herut's Social Appeal"
 ISR2_herut_charter_desc:0 "Tie Herut's social appeal to a paid connection for a development-town neighbourhood. The road and public-service obligation remain more useful than a passing improvement in business sentiment."
 ISR2_herut_clinics:0 "Independent Health Care"
 ISR2_herut_clinics_desc:0 "A labour movement should not be the only route to a dependable clinic. Fund the expansion of alternative community provision, accepting the cost of a less concentrated system."
 ISR2_hesder:0 "The Hesder Establishment"
 ISR2_hesder_desc:0 "A religious study and service framework needs instructors, transport and training places. Fund those practical arrangements without treating religious schooling as an automatic scientific or combat advantage."
 ISR2_hesder_doctrine:0 "The Hesder Establishment"
 ISR2_histadrut_balance:0 "Histadrut Bargaining"
 ISR2_histadrut_balance_desc:0 "Institutional strength is valuable when it produces a bargain rather than a permanent emergency. Keep the national assets and a negotiated labour settlement without granting every enterprise a monopoly."
 ISR2_home_front:0 "Civil Defence Clinics"
 ISR2_home_front_desc:0 "The reserve system leaves families and workplaces exposed to the same emergency. A civil-defence and medical institution in Tel Aviv establishes casualty-recovery protocols for combat-service-support formations."
 ISR2_homefront_medical_protocol:0 "Civil Defence Medical Protocol"
 ISR2_homefront_medical_protocol_desc:0 "Medical protocols developed through the civil-defence establishment improve casualty recovery in combat-service-support formations."
 ISR2_household_savings:0 "Domestic Credit Bids"
 ISR2_household_savings_desc:0 "Invite competing domestic subscriptions for a defined development note. The treasury gains an additional source of capital while retaining the debt obligation and the need for competitive borrowing terms."
 ISR2_housing_connections:0 "Homes Connected to Work"
 ISR2_housing_connections_desc:0 "A housing estate without a road to employment merely moves a shortage elsewhere. Fund the utility links, transport and workshops around the new homes."
 ISR2_if_they_accept:0 "§YIf they accept:§!"
 ISR2_independent_coops:0 "Independent Cooperatives"
 ISR2_independent_coops_desc:0 "The cooperative programme will be financed and defended in Israel's own parliament. Diplomatic negotiations remain choices of the cabinet and the governments it approaches."
 ISR2_independent_coops_research:0 "Independent Cooperatives"
 ISR2_industrial_compact:0 "Industrial Export Compact"
 ISR2_industrial_compact_desc:0 "Government, employers and unions commit to an export programme with a predictable order book. Additional social contributions are part of the bargain rather than an invisible cost."
 ISR2_industrial_compact_research:0 "Industrial Export Compact"
 ISR2_institutions_bureaucracy_cost_multiplier_modifier:0 "Bureaucracy Cost: $RIGHT|-=%1$"
 ISR2_institutions_education_cost_multiplier_modifier:0 "Education Cost: $RIGHT|-=%1$"
 ISR2_institutions_political_power_factor:0 "Political Power Gain: $RIGHT|+=%1$"
 ISR2_institutions_stability_factor:0 "Stability: $RIGHT|+=%1$"
 ISR2_irrigation_exports:0 "Ethiopia: Irrigation"
 ISR2_irrigation_exports_desc:0 "Export the equipment with the knowledge needed to use it. Overseas customers gain a useful system while Israeli suppliers gain a contract rather than an automatic diplomatic alignment."
 ISR2_jarring_channel:0 "Egypt: A Jarring Channel"
 ISR2_jarring_channel_desc:0 "Propose a funded channel for Egyptian and Israeli officers to discuss incidents and ceasefire terms. Each cabinet retains its own position on territory and security."
 ISR2_joint_committees:0 "Joint Works Committees"
 ISR2_joint_committees_desc:0 "Put Jewish and Arab workers into the same bargaining institutions. A common wage and training programme can improve production while increasing the social commitments of public employers."
 ISR2_koor:0 "Koor's Machine Shops"
 ISR2_koor_desc:0 "The labour movement already possesses an industrial organisation able to carry state orders. A major tender expands its workshops while favouring an established conglomerate over smaller competitors."
 ISR2_labor_family_payments:0 "The Family Payment System"
 ISR2_labor_family_payments_desc:0 "Replace overlapping allowances with a common payment system. Simpler administration and a wider social settlement come with larger continuing family commitments."
 ISR2_labor_functional_rule:0 "Dayan's Functional Rule"
 ISR2_labor_functional_rule_desc:0 "Retain military authority while connecting the occupied economy more closely to Israel. Commercial benefits do not resolve political status, and continuing coercive administration carries its own security bill."
 ISR2_labor_indexed_savings:0 "Indexed Development Notes"
 ISR2_labor_indexed_savings_desc:0 "Put a defined subscription behind a funded construction programme while protecting its subscribers. Capital and faster works arrive together, with an explicit additional debt-service bill on this issue."
 ISR2_labor_job_insurance:0 "Unemployment Insurance"
 ISR2_labor_job_insurance_desc:0 "Insure workers against the interruption of employment rather than promising that no job can ever disappear. A funded transition gives retraining a practical place in industrial change."
 ISR2_labor_job_insurance_research:0 "Unemployment Insurance"
 ISR2_labor_jordanian_option:0 "Jordanian Option Talks"
 ISR2_labor_jordanian_option_desc:0 "Seek a Jordanian partner for a territorial settlement rather than treating continued military rule as the permanent answer. The opening offer funds border liaison; actual borders require a separately agreed treaty."
 ISR2_labor_long_schoolday:0 "The Extended School Day"
 ISR2_labor_long_schoolday_desc:0 "A longer school day and funded technical teaching help children whose families cannot buy private support. The benefit is a larger trained cohort, paid through the education budget."
 ISR2_labor_long_schoolday_research:0 "The Extended School Day"
 ISR2_labor_permit_market:0 "Dayan's Labour Permits"
 ISR2_labor_permit_market_desc:0 "Permit employment in Israel while retaining a separate military administration in the occupied territories. Israeli firms gain access to labour and commerce, while unequal access and policing remain a burden."
 ISR2_labor_procurement_ceiling:0 "Defence Project Review"
 ISR2_labor_procurement_ceiling_desc:0 "Ask the finance ministry and defence engineers to compare the next major development commitments. A real procurement review can reduce two project bills without creating weapons through an accounting entry."
 ISR2_labor_social_priority:0 "Development-Town Jobs"
 ISR2_labor_social_priority_desc:0 "Put the next major appropriation into civilian employment in the development towns. It creates workplaces and an enduring public-service bill instead of another territorial commitment."
 ISR2_labor_social_review:0 "Neighbourhood Hearings"
 ISR2_labor_social_review_desc:0 "The development programme has left some households outside its benefits. Fund local repairs and publish a response to neighbourhood demands rather than reducing them to a dispute with party organisers."
 ISR2_labor_tax_base:0 "The Ben-Shahar Tax Base"
 ISR2_labor_tax_base_desc:0 "Broaden the recorded tax base and replace special exemptions with a more legible system. Collection improves, but the reform needs assessors and confronts households accustomed to the old allowances."
 ISR2_labor_urban_works:0 "Southern Employment"
 ISR2_labor_urban_works_desc:0 "The social programme now has schools, insurance and a tax base. Complete it with a paid commercial and industrial connection in the south, rather than a final declaration of party unity."
 ISR2_labor_valley:0 "Jordan Valley Communities"
 ISR2_labor_valley_desc:0 "Concentrate the territorial programme on a defended valley corridor. Agricultural and military installations create a durable commitment whose expense and Palestinian consequences survive the construction ceremony."
 ISR2_labor_yanai:0 "Green Line Risk Cover"
 ISR2_labor_yanai_desc:0 "Political uncertainty deters investment in occupied territory. A state guarantee lowers the public share of later controlled-territory projects backed by an accepting partner. The Treasury holds a reserve and meets covered claims if a funded project is lost or relinquished."
 ISR2_legacy_dismiss:0 "Close the withdrawn proposal."
 ISR2_liaison_limits:0 "Iran: Signals Liaison"
 ISR2_liaison_limits_desc:0 "Foreign intelligence assistance must have a defined remit and an Israeli authorising minister. A liaison agreement can improve technical work without conferring open-ended access."
 ISR2_liaison_turkey:0 "Turkey: Signals Liaison"
 ISR2_liaison_turkey_desc:0 "Foreign intelligence assistance must have a defined remit and an Israeli authorising minister. A liaison agreement can improve technical work without conferring open-ended access."
 ISR2_liberal_coastal_resort:0 "Israeli Coastal Tourism"
 ISR2_liberal_coastal_resort_desc:0 "Put the first guaranteed resort on the domestic coast instead. It is smaller but avoids adding another occupied-territory security establishment."
 ISR2_liberal_hotel_credit:0 "Kol's Hotel Guarantees"
 ISR2_liberal_hotel_credit_desc:0 "Use a limited public guarantee to support a resort financed jointly with an accepting partner. Its capital is drawn when construction is funded. The Treasury maintains a reserve and pays administration while carrying the insured liability."
 ISR2_liberal_sinai_resort:0 "Sinai Coastal Tourism"
 ISR2_liberal_sinai_resort_desc:0 "Pursue the tourism minister's resort programme on a coast Israel controls but does not own. The offices and access road can earn income, while occupation, protection and the guarantee remain real liabilities."
 ISR2_liberal_tourism_trades:0 "Tourism Trade Schools"
 ISR2_liberal_tourism_trades_desc:0 "Hotels and travel firms need trained managers, technicians and commercial services. Fund that establishment so the visitor economy produces more than a real-estate opening ceremony."
 ISR2_liberal_tourism_trades_research:0 "Tourism Trade Schools"
 ISR2_liberals_bureaucracy_cost_multiplier_modifier:0 "Bureaucracy Cost: $RIGHT|-=%1$"
 ISR2_liberals_education_cost_multiplier_modifier:0 "Education Cost: $RIGHT|-=%1$"
 ISR2_liberals_imp_sanction_resistance:0 "Imperia Sanction Resistance: $RIGHT|+=%1$"
 ISR2_liberals_mdcw_cw_market_exposure:0 "World-Market Exposure: $RIGHT|-=%1$"
 ISR2_liberals_offices_productivity:0 "Office Productivity: $RIGHT|+=%1$"
 ISR2_liberals_receiving_investment_cost_modifier:0 "Incoming Investment Cost: $RIGHT|-=%1$"
 ISR2_lift_freeze:0 "Reopen Settlement Funds"
 ISR2_lift_freeze_desc:0 "Return new settlement expenditure to the cabinet programme. The existing maintenance discount ends before another site can be funded."
 ISR2_mafdal_activist_current:0 "The Religious Settlers"
 ISR2_mafdal_activist_current_desc:0 "The younger territorial current wants resources beyond the older coalition bargain. A sponsored agricultural site gains a road and a real economic foothold while imposing a higher security burden on occupied territory."
 ISR2_mafdal_bar_ilan:0 "Bar-Ilan Laboratories"
 ISR2_mafdal_bar_ilan_desc:0 "Expand the natural-science and mathematics establishment of an existing university. Laboratories, equipment and staff produce limited research gains because the state pays for them, not because a religious party governs."
 ISR2_mafdal_bar_ilan_research:0 "Bar-Ilan Laboratories"
 ISR2_mafdal_budget:0 "Religious-Zionist Credit"
 ISR2_mafdal_budget_desc:0 "Fund the religious workers' agricultural and manufacturing institutions alongside the party's educational commitments. Development credit buys a productive cooperative base and leaves a continuing school budget."
 ISR2_mafdal_bureaucracy_cost_multiplier_modifier:0 "Bureaucracy Cost: $RIGHT|-=%1$"
 ISR2_mafdal_cooperative_bank:0 "Religious-Worker Credit"
 ISR2_mafdal_cooperative_bank_desc:0 "A dedicated commercial desk can help existing cooperatives purchase and market together. It adds a real office and a defined guarantee reserve instead of another passing improvement in faction sentiment."
 ISR2_mafdal_education_cost_multiplier_modifier:0 "Education Cost: $RIGHT|-=%1$"
 ISR2_mafdal_health_cost_multiplier_modifier:0 "Healthcare Cost: $RIGHT|-=%1$"
 ISR2_mafdal_industry_repair_factor:0 "Industry Repair Speed: $RIGHT|+=%1$"
 ISR2_mafdal_interior:0 "Municipal Interior Policy"
 ISR2_mafdal_interior_desc:0 "Use the party's municipal and welfare responsibilities to organise permanent planning and service teams. A functioning local establishment should remain useful beyond the immediate coalition bargain."
 ISR2_mafdal_land_committee:0 "The Settlement Committee"
 ISR2_mafdal_land_committee_desc:0 "Place the sponsored site's security and investment accounts under a funded committee. Administrative coordination lowers its existing security bill. An accepting partner may co-finance a later building stage; the committee itself provides no construction capital."
 ISR2_mafdal_land_gaza:0 "Gaza Cooperatives"
 ISR2_mafdal_land_gaza_desc:0 "Put the religious-Zionist land appropriation into a controlled territorial cooperative. The agricultural district produces income while its protection and Palestinian institutional consequences remain a funded public commitment."
 ISR2_mafdal_land_westbank:0 "West Bank Cooperatives"
 ISR2_mafdal_land_westbank_desc:0 "Put the religious-Zionist land appropriation into a controlled territorial cooperative. The agricultural district produces income while its protection and Palestinian institutional consequences remain a funded public commitment."
 ISR2_mafdal_old_guard:0 "Parliamentary Bargaining"
 ISR2_mafdal_old_guard_desc:0 "The established leadership can protect religious institutions through a negotiated municipal budget. It gives local services another connection without making territorial expansion the party's only purpose."
 ISR2_mafdal_personnel_cost_multiplier_modifier:0 "Personnel Cost: $RIGHT|-=%1$"
 ISR2_mafdal_planning_appeals:0 "Planning Appeals"
 ISR2_mafdal_planning_appeals_desc:0 "A common appeals procedure can resolve the next land and access dispute before contractors arrive. The procedure costs administrative time and can make actually authorised works easier to build."
 ISR2_mafdal_political_power_factor:0 "Political Power Gain: $RIGHT|+=%1$"
 ISR2_mafdal_production_speed_infrastructure_factor:0 "Infrastructure Construction Speed: $RIGHT|+=%1$"
 ISR2_mafdal_receiving_investment_cost_modifier:0 "Incoming Investment Cost: $RIGHT|-=%1$"
 ISR2_mafdal_registration_compromise:0 "The 1970 Register Pact"
 ISR2_mafdal_registration_compromise_desc:0 "Maintain a distinction between the religious registration of Jewish status and the citizenship rights of an immigrant's family. The absorption service receives a funded office and a broader service commitment."
 ISR2_mafdal_regularise_sites:0 "Sponsored-Site Works"
 ISR2_mafdal_regularise_sites_desc:0 "Regularise the state's financial involvement by funding the sponsored site's next farm and access improvement. Public support leaves productive assets, a continuing security expense and costs for Palestinian institutions."
 ISR2_mafdal_restrain_sites:0 "Restrain New Commitments"
 ISR2_mafdal_restrain_sites_desc:0 "Keep faith with the coalition institutions while refusing new unauthorised sites. The cabinet saves part of its security establishment only while it actually maintains the freeze."
 ISR2_mafdal_service_volunteers:0 "Women's Civilian Service"
 ISR2_mafdal_service_volunteers_desc:0 "Fund trained civilian volunteers in clinics and community services. Their contribution helps the health establishment while instructors and supervision become another public commitment."
 ISR2_mafdal_social_cost_multiplier_modifier:0 "Social Spending Cost: $RIGHT|-=%1$"
 ISR2_mafdal_stability_factor:0 "Stability: $RIGHT|+=%1$"
 ISR2_mafdal_strict_certification:0 "Orthodox Certification"
 ISR2_mafdal_strict_certification_desc:0 "Give recognised rabbinical authorities exclusive certification powers. A cabinet built on this arrangement gains institutional cohesion while applicants, investors and public offices face more restrictive procedures."
 ISR2_mafdal_survey:0 "Negev Cooperatives"
 ISR2_mafdal_survey_desc:0 "Direct the land appropriation to a cooperative in the Israeli core economy. The ministry pays for a working agricultural district instead of adding another occupied site."
 ISR2_mafdal_training_time_army_factor:0 "Army Training Time: $RIGHT|-=%1$"
 ISR2_mafdal_working_communities:0 "Southern Work Communities"
 ISR2_mafdal_working_communities_desc:0 "A lasting party programme needs employment and practical skills as well as a position on territory. Finance another working community in the Israeli core economy."
 ISR2_maki_budget:0 "A Civilian-First Budget"
 ISR2_maki_budget_desc:0 "Put a ceiling on new military construction while the civilian programme is funded. The government gains room for productive development by postponing another arms-factory expansion."
 ISR2_maki_civilian_factories_productivity:0 "Civilian Industry Productivity: $RIGHT|+=%1$"
 ISR2_maki_education_cost_multiplier_modifier:0 "Education Cost: $RIGHT|-=%1$"
 ISR2_maki_laboratories:0 "Civilian Laboratories"
 ISR2_maki_laboratories_desc:0 "Reserve a scientific appropriation for industrial and agricultural work. The research gains have their own public budget and do not imply an eastern alliance."
 ISR2_maki_laboratories_research:0 "Civilian Laboratories"
 ISR2_maki_parliament:0 "Sneh's Parliamentary Left"
 ISR2_maki_parliament_desc:0 "Maki's continuation is not a duplicate of Rakah. A parliamentary communist government must defend its labour programme while maintaining its own national and international position."
 ISR2_maki_parliament_research:0 "Sneh's Parliamentary Left"
 ISR2_maki_production_speed_arms_factory_factor:0 "Military Factory Construction Speed: $RIGHT|+=%1$"
 ISR2_maki_public:0 "Public Civilian Workshops"
 ISR2_maki_public_desc:0 "Direct the public development budget to civilian production. The programme buys a real workshop instead of treating public ownership itself as another source of cash."
 ISR2_mapam_coops:0 "Hashomer Hatzair Co-ops"
 ISR2_mapam_coops_desc:0 "A Mapam-led cabinet would give cooperative production a different role from appointment through a public conglomerate. Start with a paid workshop and a practical agricultural order book."
 ISR2_mapam_coops_research:0 "Hashomer Hatzair Co-ops"
 ISR2_mapam_industrial_capacity_factory:0 "Factory Output: $RIGHT|+=%1$"
 ISR2_mapam_productivity_growth_modifier:0 "Monthly Productivity Growth: $RIGHT|+=2$"
 ISR2_mapam_social_cost_multiplier_modifier:0 "Social Spending Cost: $RIGHT|-=%1$"
 ISR2_mashav:0 "Kenya: MASHAV Mission"
 ISR2_mashav_desc:0 "Technical cooperation can make an embassy useful to its host. An invitation must come from the partner government, and expertise sent abroad still has a budget at home."
 ISR2_mashav_ethiopia:0 "Ethiopia: MASHAV Mission"
 ISR2_mashav_ethiopia_desc:0 "Technical cooperation can make an embassy useful to its host. An invitation must come from the partner government, and expertise sent abroad still has a budget at home."
 ISR2_mizrahi_coops:0 "Cooperative Packing"
 ISR2_mizrahi_coops_desc:0 "Cooperative farmers need packing, marketing and a dependable commercial office. Extend the network beyond its first workshop rather than announcing the same loan twice."
 ISR2_mizrahi_coops_research:0 "Cooperative Packing"
 ISR2_mobile_reserve:0 "The Mobile Reserve"
 ISR2_mobile_reserve_desc:0 "Keep a formation able to reinforce the threatened sector rather than distribute every unit among static positions. This requires a larger standing transport and personnel establishment."
 ISR2_municipal_lists:0 "Progress and Development"
 ISR2_municipal_lists_desc:0 "Progress and Development can bargain for municipal works through the coalition. The appropriation creates an actual commercial facility and a service connection in a domestic core state."
 ISR2_municipal_lists_representation_tt:0 "Progress and Development is represented in the governing coalition."
 ISR2_municipal_tenders:0 "Municipal Tender Access"
 ISR2_municipal_tenders_desc:0 "Development towns and Arab municipalities need functioning roads, utility connections and access to public contracts. Publish allocations instead of distributing them through informal political intermediaries."
 ISR2_national_bargain:0 "Civilian Matching Funds"
 ISR2_national_bargain_desc:0 "A government can defend its territorial position while deciding separately what it can afford to build. A matched public appropriation supports one clearly stated programme rather than giving the next commitment a blank cheque."
 ISR2_negev_water:0 "Southern Water Links"
 ISR2_negev_water_desc:0 "Distribution lines and roads must reach the same communities. Expanding cultivated land brings higher pumping and maintenance costs with it."
 ISR2_negotiated_terms:0 "Palestinian Service Pact"
 ISR2_negotiated_terms_desc:0 "Offer a paid civil-service programme in a Palestinian area affected by settlement pressure. The agreement funds practical services and administrative relief while leaving borders and territorial claims to separate negotiations."
 ISR2_nesher:0 "Nesher Engineering"
 ISR2_nesher_desc:0 "Developing an indigenous fighter requires tooling, test work and imported components. Allocate a real engineering budget rather than treating a national name as a finished aircraft."
 ISR2_nesher_research:0 "Nesher Engineering"
 ISR2_new_acreage:0 "Negev Farm Districts"
 ISR2_new_acreage_desc:0 "Concentrate the capital on additional cultivated districts. The productive gain arrives with a larger electricity and maintenance bill for the water authority."
 ISR2_occupation_accounts:0 "Military Administration"
 ISR2_occupation_accounts_desc:0 "Audit the four territorial administrations and give their civilian liaison offices a common standard. Better records ease administration without removing the resistance, supply or personnel costs already present at the start."
 ISR2_open_fx:0 "Open Commercial Exchange"
 ISR2_open_fx_desc:0 "Make overseas payments and commercial finance easier for productive firms. An economy more open to capital also becomes more exposed to its withdrawal."
 ISR2_ort_workshops:0 "ORT beyond the Coast"
 ISR2_ort_workshops_desc:0 "Industrial training in development towns makes skilled employment possible without relocating every household to the coastal cities. Instructors and workshop equipment require a continuing education commitment."
 ISR2_ort_workshops_research:0 "ORT beyond the Coast"
 ISR2_orthodox_bureaucracy_cost_multiplier_modifier:0 "Bureaucracy Cost: $RIGHT|-=%1$"
 ISR2_orthodox_cooperative_plant:0 "Religious-Worker Industry"
 ISR2_orthodox_cooperative_plant_desc:0 "Complete the productive continuation with a paid cooperative plant. Its construction does not depend on every Orthodox party sharing the same view of employment, schooling or military service. The government funds a contract with the religious workers' cooperatives; the programme changes no party or coalition membership."
 ISR2_orthodox_deferments:0 "Full-Time Study Deferment"
 ISR2_orthodox_deferments_desc:0 "An expanded study-deferment settlement protects the funded network. The army must rely more heavily on its paid establishment, making the arrangement a fiscal choice rather than free social harmony."
 ISR2_orthodox_education_cost_multiplier_modifier:0 "Education Cost: $RIGHT|-=%1$"
 ISR2_orthodox_evening_trade:0 "Poalei Trade Courses"
 ISR2_orthodox_evening_trade_desc:0 "Keep a route into skilled work alongside religious study for the workers' communities. Workshops and instructors deliver practical gains without treating Poalei Agudat as identical to every Orthodox faction. The government funds a contract with the religious workers' cooperatives; the programme changes no party or coalition membership."
 ISR2_orthodox_evening_trade_research:0 "Poalei Trade Courses"
 ISR2_orthodox_health_cost_multiplier_modifier:0 "Healthcare Cost: $RIGHT|-=%1$"
 ISR2_orthodox_industry_repair_factor:0 "Industry Repair Speed: $RIGHT|+=%1$"
 ISR2_orthodox_large_families:0 "Large-Family Allowances"
 ISR2_orthodox_large_families_desc:0 "Simplify and extend family support through a defined public allowance. The result is a durable social commitment with a clearer administrative route, rather than a temporary rise in religious-institution opinion."
 ISR2_orthodox_personnel_cost_multiplier_modifier:0 "Personnel Cost: $RIGHT|-=%1$"
 ISR2_orthodox_political_power_factor:0 "Political Power Gain: $RIGHT|+=%1$"
 ISR2_orthodox_social_cost_multiplier_modifier:0 "Social Spending Cost: $RIGHT|-=%1$"
 ISR2_orthodox_stability_factor:0 "Stability: $RIGHT|+=%1$"
 ISR2_orthodox_study_budget:0 "The Torah Study Budget"
 ISR2_orthodox_study_budget_desc:0 "Specify what the state will support in the study network and what the communities themselves will supply. Protected grants gain predictable purchasing and service arrangements without an imaginary research windfall."
 ISR2_package_deal:0 "The 1970 Package Deal"
 ISR2_package_deal_desc:0 "The government, Histadrut and employers can negotiate wages and investment together. A settlement must say who receives cash, who holds state obligations and who carries the social contributions."
 ISR2_parliamentary_watch:0 "Parliamentary Scrutiny"
 ISR2_parliamentary_watch_desc:0 "Make scrutiny a standing parliamentary responsibility instead of an occasional scandal. Ministers retain authority, but investigations and covert appropriations must answer to a committee."
 ISR2_party_0:0 "Mafdal"
 ISR2_party_1:0 "Gahal"
 ISR2_party_13:0 "Agudat Israel"
 ISR2_party_14:0 "State List"
 ISR2_party_16:0 "HaOlam HaZeh - Koah Hadash"
 ISR2_party_18:0 "Mapam"
 ISR2_party_19:0 "Maki"
 ISR2_party_2:0 "Independent Liberals"
 ISR2_party_20:0 "Free Center"
 ISR2_party_3:0 "Alignment"
 ISR2_party_4:0 "Rakah"
 ISR2_poalei_workshops:0 "Poalei Workers' Co-ops"
 ISR2_poalei_workshops_desc:0 "Religious workers' communities need productive employment as well as a protected school. A cooperative workshop gives this programme a different economic direction from communal budget protection alone. The government funds a contract with the religious workers' cooperatives; the programme changes no party or coalition membership."
 ISR2_precision_tools:0 "Kibbutz Machine Tools"
 ISR2_precision_tools_desc:0 "Cooperative workshops can manufacture components as well as repair farm equipment. An industrial order book gives rural employment a second source of income."
 ISR2_press_scrutiny:0 "Emergency Budget Scrutiny"
 ISR2_press_scrutiny_desc:0 "A parliament cannot scrutinise a budget it never sees. Publish the civilian and aggregate security appropriations while protecting operational details that can actually endanger lives."
 ISR2_private_workshops:0 "Small-Firm Tenders"
 ISR2_private_workshops_desc:0 "Divide public orders into contracts that smaller manufacturers can actually fulfil. The state gets a wider supplier base instead of another protected national champion."
 ISR2_private_workshops_research:0 "Small-Firm Tenders"
 ISR2_procurement_board:0 "A Procurement Ceiling"
 ISR2_procurement_board_desc:0 "Compare domestic manufacture and foreign purchases before committing the defence budget. The board will fund one major technical study rather than promise every procurement plan at once."
 ISR2_procurement_board_research:0 "A Procurement Ceiling"
 ISR2_programme_absorption:0 "People, Skills and a Place to Live"
 ISR2_programme_absorption_desc:0 "Three paid participation reforms. Added workforce reaches +15% in total."
 ISR2_programme_alignment:0 "Alignment: the Histadrut State"
 ISR2_programme_alignment_desc:0 "A wage bargain, public enterprises and Sapir's development priorities."
 ISR2_programme_arsenal:0 "An Arsenal beyond the Embargo"
 ISR2_programme_arsenal_desc:0 "Repair, adapt and eventually build. Expensive choices with civilian consequences."
 ISR2_programme_capital:0 "Capital from Abroad"
 ISR2_programme_capital_desc:0 "An unusually powerful funding network, with debt, obligations and exposure."
 ISR2_programme_diplomacy:0 "Connections without a Script"
 ISR2_programme_diplomacy_desc:0 "Offer cooperation and bargaining positions. Other players retain their decisions."
 ISR2_programme_free_center:0 "Free Center: a Different National Opposition"
 ISR2_programme_free_center_desc:0 "A compact alternative to Gahal, not another generic nationalist tree."
 ISR2_programme_gahal:0 "Gahal: Ownership and National Resolve"
 ISR2_programme_gahal_desc:0 "Liberal ownership, Herut's social appeal and competing spending priorities."
 ISR2_programme_haolam:0 "HaOlam HaZeh - Koah Hadash"
 ISR2_programme_haolam_desc:0 "A secular parliamentary challenge: scrutiny, civil registration and municipal rights."
 ISR2_programme_institutions:0 "The Republic and Its Bargains"
 ISR2_programme_institutions_desc:0 "A parliamentary state with institutions stronger than any one cabinet."
 ISR2_programme_liberals:0 "Independent Liberals: Small Firms, Open Doors"
 ISR2_programme_liberals_desc:0 "Commercial law, tourism and two approaches to foreign-currency risk."
 ISR2_programme_mafdal:0 "Mafdal: Faith, Service and Land"
 ISR2_programme_mafdal_desc:0 "Religious Zionist institutions with separate service and settlement choices."
 ISR2_programme_maki:0 "Maki: Independent Communism"
 ISR2_programme_maki_desc:0 "A shorter parliamentary continuation, separate from Rakah's Soviet option."
 ISR2_programme_mapam:0 "Mapam: the Cooperative Left"
 ISR2_programme_mapam_desc:0 "Inside the Alignment at the start; independent leadership is an alternate political outcome."
 ISR2_programme_orthodox:0 "Agudat Israel and Poalei Agudat"
 ISR2_programme_orthodox_desc:0 "Communal schooling and welfare, with a separate religious workers' continuation."
 ISR2_programme_rakah:0 "Rakah: A Jewish-Arab Communist Cabinet"
 ISR2_programme_rakah_desc:0 "A genuine alternative government with a real foreign-policy choice."
 ISR2_programme_reserves:0 "A Nation in Reserve"
 ISR2_programme_reserves_desc:0 "A sharp army whose mobilisation has a visible civilian bill."
 ISR2_programme_state_list:0 "State List: the Administrative Republic"
 ISR2_programme_state_list_desc:0 "Rafi's dissident continuation: professional management over a party economy."
 ISR2_programme_water:0 "Water, Workshops and the Negev"
 ISR2_programme_water_desc:0 "Turn scarce water and practical engineering into national advantages."
 ISR2_property_register:0 "A Commercial Auction"
 ISR2_property_register_desc:0 "The liberal wing wants a government that can explain what it owns and why. An asset register begins a programme of disposal and competition without pretending that every sale creates new national wealth."
 ISR2_public_ownership:0 "Compensated Public Assets"
 ISR2_public_ownership_desc:0 "Acquire strategic workshops through an explicit compensation budget. Public planning gains assets while private investors face a state-led economy."
 ISR2_rakah_civic:0 "Toubi's Civic Equality"
 ISR2_rakah_civic_desc:0 "A Rakah cabinet would have to turn its Jewish-Arab programme into public employment and municipal services. Its electoral victory would not by itself settle Israel's borders or choose a foreign patron."
 ISR2_rakah_civilian_factories_productivity:0 "Civilian Industry Productivity: $RIGHT|+=%1$"
 ISR2_rakah_education_cost_multiplier_modifier:0 "Education Cost: $RIGHT|-=%1$"
 ISR2_rakah_production_factory_efficiency_gain_factor:0 "Production Efficiency Growth: $RIGHT|+=%1$"
 ISR2_rakah_production_speed_infrastructure_factor:0 "Infrastructure Construction Speed: $RIGHT|+=%1$"
 ISR2_rakah_receiving_investment_cost_modifier:0 "Incoming Investment Cost: $RIGHT|-=%1$"
 ISR2_rakah_social_cost_multiplier_modifier:0 "Social Spending Cost: $RIGHT|-=%1$"
 ISR2_rakah_talks:0 "Municipal Employment"
 ISR2_rakah_talks_desc:0 "Put the public-employment programme into workshops and services in actual communities. Territorial talks remain available through the common diplomatic branch; they are not a compulsory finale for a communist government."
 ISR2_ready_depots:0 "Readiness in the Depots"
 ISR2_ready_depots_desc:0 "A reservist reaches a useful formation only if its stores and transport are ready. Permanent depot staff cost money even when no mobilisation order is issued."
 ISR2_reclamation:0 "The Reclamation Budget"
 ISR2_reclamation_desc:0 "Water used in the towns need not be lost to every other purpose. A paid treatment and distribution programme broadens the network without pretending that water is unlimited."
 ISR2_recognise_qualifications:0 "Professional Credentials"
 ISR2_recognise_qualifications_desc:0 "Hospitals and factories cannot afford to leave qualified arrivals in unsuitable work. Professional boards will run conversion courses and practical examinations."
 ISR2_recognise_qualifications_research:0 "Professional Credentials"
 ISR2_refinancing:0 "The Debt Calendar"
 ISR2_refinancing_desc:0 "Match the repayment calendar to the time required for development assets to earn an income. The treasury exchanges part of its short-term flexibility for more predictable debt service."
 ISR2_religious_agriculture:0 "Religious Farm Tools"
 ISR2_religious_agriculture_desc:0 "Practical farming institutions can purchase machinery and market their produce together. The state pays for the district; the cooperative carries the working programme. The government funds a contract with the religious workers' cooperatives; the programme changes no party or coalition membership."
 ISR2_religious_agriculture_research:0 "Religious Farm Tools"
 ISR2_religious_concord:0 "The Religious Status Quo"
 ISR2_religious_concord_desc:0 "A renewed parliamentary understanding protects religious institutions without handing them every question of government. Separate educational commitments receive a defined budget."
 ISR2_religious_towns:0 "Schools and Workshops"
 ISR2_religious_towns_desc:0 "A development town should not have to choose between community life and an economic future. Fund the technical workshop alongside the local religious school."
 ISR2_religious_towns_research:0 "Schools and Workshops"
 ISR2_reserve_callup:0 "National Reserve Call-Up"
 ISR2_reserve_callup_desc:0 "Mobilise the reserve formations during an actual security emergency. The order improves military readiness and removes the same people from their civilian workplaces."
 ISR2_reserve_exercise:0 "Limited Reserve Exercise"
 ISR2_reserve_exercise_desc:0 "Call a limited group of reservists for practical training. Their workshops must manage a temporary loss of output while the army gains experience."
 ISR2_reserve_register:0 "The Reservist's Workshop"
 ISR2_reserve_register_desc:0 "The same people keep factories working and reserve formations ready. A common register lets the cabinet see what a call-up will cost before issuing it."
 ISR2_reserve_release:0 "Release the Reservists"
 ISR2_reserve_release_desc:0 "Return the emergency formations to civilian life before the full call-up term runs out. Factories recover their people while the army gives up its temporary readiness advantage."
 ISR2_reserves_industry_repair_factor:0 "Industry Repair Speed: $RIGHT|+=%1$"
 ISR2_reserves_mobilization_speed:0 "Mobilization Speed: $RIGHT|+=%1$"
 ISR2_reserves_personnel_cost_multiplier_modifier:0 "Personnel Cost: $RIGHT|-=%1$"
 ISR2_reserves_planning_speed:0 "Planning Speed: $RIGHT|+=%1$"
 ISR2_reserves_supply_consumption_factor:0 "Supply Consumption: $RIGHT|-=%1$"
 ISR2_sapir_book:0 "Sapir's Haifa Tender"
 ISR2_sapir_book_desc:0 "Development policy can identify a promising workshop before it becomes a safe banking proposition. The finance ministry backs selected tenders instead of offering an unlimited subsidy."
 ISR2_sapir_negev:0 "Sapir's Negev Tender"
 ISR2_sapir_negev_desc:0 "Development policy can identify a promising workshop before it becomes a safe banking proposition. The finance ministry backs selected tenders instead of offering an unlimited subsidy."
 ISR2_scholarships:0 "Bridging the Skills Gap"
 ISR2_scholarships_desc:0 "Merit should not depend on the ability to leave home for years of study. Targeted bursaries and preparatory courses open technical education to households excluded by its incidental costs."
 ISR2_scholarships_research:0 "Bridging the Skills Gap"
 ISR2_security_emergency:0 "Cabinet Security Mandate"
 ISR2_security_emergency_desc:0 "The cabinet can authorise a limited reserve emergency without declaring war. The political cost is paid anew for each authorisation, while foreign relations and borders remain matters for the players."
 ISR2_selective_fx:0 "Export-Input Currency"
 ISR2_selective_fx_desc:0 "Keep controls but make access predictable for essential machinery and export inputs. The treasury retains a cushion at the price of a larger licensing establishment."
 ISR2_selective_fx_research:0 "Export-Input Currency"
 ISR2_service_bargain:0 "A Cabinet Service Pact"
 ISR2_service_bargain_desc:0 "Religious institutions and the army need a service arrangement they can budget and plan against. The cabinet protects the agreed study allocation while carrying a larger permanent training establishment."
 ISR2_settled_skills:0 "A Workforce That Stays"
 ISR2_settled_skills_desc:0 "Housing, professional recognition and practical training can turn arrival into a lasting career. The objective is a productive civilian economy with room for its citizens, not a limitless supply of reservists."
 ISR2_shortcut_absorption:0 "People, Skills and a Place to Live"
 ISR2_shortcut_alignment:0 "Alignment: the Histadrut State"
