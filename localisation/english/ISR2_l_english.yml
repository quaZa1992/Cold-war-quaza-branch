 ISR2_sinai_foothold:0 "Sinai Footholds"
 ISR2_sinai_foothold_desc:0 "Fund an illegal settlement presence where Israel does not control the territory. Its external supply and investment network benefits Israel while imposing disruption and administrative pressure on the host."
 ISR2_sinai_projects:0 "Sinai Settlement Works"
 ISR2_sinai_projects_desc:0 "A paid enclave creates a farm, access route and defended position. Its benefit depends on retaining control and maintaining a costly desert connection."
 ISR2_solel_boneh:0 "Solel Boneh Townships"
 ISR2_solel_boneh_desc:0 "Use the labour construction network to connect housing with employment. The cabinet pays for the project and accepts the political influence of the contractor that carries it."
 ISR2_start_absorption:0 "Absorption without Enough Connections"
 ISR2_start_absorption_desc:0 "Professional recognition, access to work and local services lag behind the needs of arriving households. No workforce-size penalty is imposed."
 ISR2_start_citizen_army:0 "A Citizen Army in a Working Economy"
 ISR2_start_citizen_army_desc:0 "Reserve readiness and civilian production draw on the same trained people. Call-ups are temporary, paid national choices."
 ISR2_start_histadrut:0 "The Histadrut Establishment"
 ISR2_start_histadrut_desc:0 "An unusual network of unions, enterprises, builders and health services. Reform, compete with it, or bargain through it."
 ISR2_start_import_economy:0 "An Import-Dependent Development Economy"
 ISR2_start_import_economy_desc:0 "Capital inflows and specialist exports sustain a high-investment economy. An external shock can still interrupt its essential imports."
 ISR2_state_enterprises:0 "Professional State Firms"
 ISR2_state_enterprises_desc:0 "Public ownership need not mean that every management appointment is a coalition appointment. A paid reorganisation protects the state's share while improving the use of its existing plants."
 ISR2_state_list_bureaucracy_cost_multiplier_modifier:0 "Bureaucracy Cost: $RIGHT|-=%1$"
 ISR2_state_list_civilian_factories_productivity:0 "Civilian Industry Productivity: $RIGHT|+=%1$"
 ISR2_state_list_education_cost_multiplier_modifier:0 "Education Cost: $RIGHT|-=%1$"
 ISR2_state_list_productivity_growth_modifier:0 "Monthly Productivity Growth: $RIGHT|+=2$"
 ISR2_state_tenders:0 "Independent Tender Boards"
 ISR2_state_tenders_desc:0 "A State List cabinet can challenge the way party institutions control appointments and public contracts. Give professional boards authority over a defined development budget."
 ISR2_sterilise_inflow:0 "Foreign-Currency Reserves"
 ISR2_sterilise_inflow_desc:0 "Reserving part of the capital inflow reduces the need to borrow during the next import shock. Fewer funds are available for immediate construction."
 ISR2_study_guarantees:0 "Independent School Buying"
 ISR2_study_guarantees_desc:0 "Keep community authority over the schools while pooling supplies, maintenance and purchasing. A joint service office can reduce the cost of the protected network without converting its curriculum into a government department."
 ISR2_supplier_competition:0 "Competitive Arms Orders"
 ISR2_supplier_competition_desc:0 "The defence budget can support competing workshops without guaranteeing every producer an order. Competition broadens production at the expense of the old networks."
 ISR2_supplier_competition_research:0 "Competitive Arms Orders"
 ISR2_tal_tank:0 "Tal's Tank Programme"
 ISR2_tal_tank_desc:0 "A tank programme begins with repair facilities, comparative trials and a design office. Crew protection is a design objective, and production independence is a long-term commitment."
 ISR2_tal_tank_research:0 "Tal's Tank Programme"
 ISR2_technical_state:0 "The Technical State"
 ISR2_technical_state_desc:0 "Link the civil service, technical colleges and public enterprises through practical standards and competitive recruitment. The professional establishment is an enduring expense, not a free cure for politics."
 ISR2_technical_state_research:0 "The Technical State"
 ISR2_technion_computing:0 "Technion Computing"
 ISR2_technion_computing_desc:0 "The new computing faculty can supply engineers to laboratories and industry. A small country must fund its instructors and students before expecting a large research sector."
 ISR2_technion_computing_research:0 "Technion Computing"
 ISR2_tender_commission:0 "Civil Service Commission"
 ISR2_tender_commission_desc:0 "An open examination and tender system gives engineers and administrators a career beyond party appointments. The reform takes patronage out of the coalition bargain."
