 ISR2_tourism:0 "The Tourism Order Book"
 ISR2_tourism_desc:0 "Tourism needs transport, trained staff and commercial facilities rather than only overseas publicity. A civilian visitor economy brings income and a particular exposure to regional uncertainty."
 ISR2_ulpan_jobs:0 "Ulpan and Employment"
 ISR2_ulpan_jobs_desc:0 "Language instruction becomes part of an employment service rather than a waiting room. Trained interpreters and placement officers help newcomers use skills they already possess."
 ISR2_uncommitted_left:0 "The Uncommitted Left"
 ISR2_uncommitted_left_desc:0 "Keep the programme answerable to parliament and finance it domestically. The cabinet forgoes the overseas loan and bears the cost of its own industrial education programme."
 ISR2_uncommitted_left_research:0 "The Uncommitted Left"
 ISR2_wage_bonds:0 "Wages in State Bonds"
 ISR2_wage_bonds_desc:0 "Preserve funds for development by meeting part of the wage settlement with state obligations. Workers receive a claim on the treasury rather than the same increase in immediate spending power."
 ISR2_washington:0 "US Procurement Terms"
 ISR2_washington_desc:0 "Present a defined procurement and training request to the United States. Israeli planning can use an accepted offer; it cannot assume that another government has already signed it."
