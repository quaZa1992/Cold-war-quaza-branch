 ISR2_bilateral_pal_pressure_tt:0 "Affected Palestinian area: pressure limited to §Y1 tier§! for §Y52 weeks§!. At tier 2: office productivity §G+4%§!, bureaucracy cost §G-4%§!, stability §G+2%§!."
 ISR2_bilateral_refuse:0 "Decline the offer."
 ISR2_bilateral_weekly_expense_tt:0 "Weekly programme expense: §R-$[?ISR2_bilateral_preview_weekly|5] billion§!"
 ISR2_bilateral_weekly_income_tt:0 "Weekly programme income: §G+$[?ISR2_bilateral_preview_weekly|5] billion§!"
 ISR2_bond_drive:0 "Israel Bonds"
 ISR2_bond_drive_desc:0 "A development loan can turn overseas confidence into capital at home. Subscribers receive a state obligation, and the treasury must meet its debt service after the campaign ends."
 ISR2_bonds_plant:0 "Bond-Financed Workshops"
 ISR2_bonds_plant_desc:0 "Borrowed capital must leave productive assets behind. The development tender funds a civilian plant and the power and transport connections needed to keep it operating."
 ISR2_bounded_callup:0 "The Readiness Calendar"
 ISR2_bounded_callup_desc:0 "Publish a reserve calendar that the army can train against and civilian employers can plan around. Emergency mobilisation remains available, but cannot become a permanent source of cheap readiness."
 ISR2_broad_coalition:0 "A Broad Cabinet"
 ISR2_broad_coalition_desc:0 "Bringing the principal parliamentary blocs into the cabinet distributes responsibility for security. Every major appropriation will also need a broader political bargain."
 ISR2_brotherhood_compact:0 "Brotherhood Contracts"
 ISR2_brotherhood_compact_desc:0 "The second real Arab parliamentary list has its own local constituency. Publish a paid municipal works contract instead of folding its representation into a fictional religious movement."
 ISR2_brotherhood_compact_representation_tt:0 "Cooperation and Brotherhood is represented in the governing coalition."
 ISR2_cabinet_ledger:0 "Coalition Budget"
 ISR2_cabinet_ledger_desc:0 "A coalition cannot govern by invoking national necessity for every expenditure. Present the competing claims of defence, housing and civil administration to the Knesset."
 ISR2_canal_works:0 "Canal Fortifications"
 ISR2_canal_works_desc:0 "A defended position can save lives, but maintaining a fixed line commits the army to a particular frontier. Construction proceeds only where Israel actually controls the ground."
 ISR2_cap_projects:0 "Freeze New Settlements"
 ISR2_cap_projects_desc:0 "Freeze new sites while retaining the ability to maintain or fund existing ones. A cabinet can limit its commitments without signing a territorial agreement on behalf of another government."
 ISR2_capital_acceleration:0 "Development Acceleration"
 ISR2_capital_acceleration_desc:0 "Release the reserve into productive construction while the funds are available. The treasury accepts dearer borrowing if the next external shock arrives before the projects mature."
 ISR2_capital_agricolture_productivity_modifier:0 "Agricultural Productivity: $RIGHT|+=%1$"
 ISR2_capital_imp_sanction_resistance:0 "Imperia Sanction Resistance: $RIGHT|+=%1$"
 ISR2_capital_interest_rate_multiplier_modifier:0 "Interest Rate: $RIGHT|-=2$ percentage points"
 ISR2_capital_mdcw_cw_market_exposure:0 "World-Market Exposure: $RIGHT|-=%1$"
 ISR2_capital_offices_productivity:0 "Office Productivity: $RIGHT|+=%1$"
 ISR2_capital_production_speed_buildings_factor:0 "Construction Speed: $RIGHT|+=%1$"
 ISR2_capital_receiving_investment_cost_modifier:0 "Incoming Investment Cost: $RIGHT|-=%1$"
 ISR2_carrier_workshops:0 "National Carrier Works"
 ISR2_carrier_workshops_desc:0 "The National Water Carrier is already in service. Pumps, stores and repair crews determine whether its promise reaches the farms at the end of the network."
 ISR2_carrier_workshops_research:0 "National Carrier Works"
 ISR2_cash_wages:0 "Cash Wage Settlement"
 ISR2_cash_wages_desc:0 "A cash wage settlement sustains household purchasing power and the local service economy. The treasury pays immediately, using money that could otherwise finance the development programme."
 ISR2_center_cabinet:0 "A Parliamentary Cabinet"
 ISR2_center_cabinet_desc:0 "Bring the national programme back through a working parliamentary majority. An enduring majority is an achievement of coalition bargaining, not an automatic presidential constitution."
 ISR2_center_enterprise:0 "Independent Suppliers"
 ISR2_center_enterprise_desc:0 "Break public orders into contracts that suppliers outside the established party economy can fulfil. The government pays for a new workshop and a technical training allocation."
 ISR2_center_enterprise_research:0 "Independent Suppliers"
 ISR2_center_reform:0 "The Anti-Patronage Bloc"
 ISR2_center_reform_desc:0 "The Free Center can challenge the governing establishment without accepting every institution of Gahal. Its first task is a public appointments and procurement reform."
 ISR2_center_reserves:0 "Contracted Readiness"
 ISR2_center_reserves_desc:0 "The government funds equipment inspections and reserve depots before announcing more formations. Readiness improves because the stores exist and the staff are paid."
 ISR2_citrus_packhouses:0 "Jaffa Citrus Exports"
 ISR2_citrus_packhouses_desc:0 "Packing, refrigeration and marketing can make a familiar export earn more abroad. The resulting income still depends on access to distant customers and their prices."
 ISR2_civil_admin:0 "Civil Administration"
 ISR2_civil_admin_desc:0 "A functioning military administration needs records, courts, utilities and paid staff. Better administration can reduce friction while keeping its cost visible to the cabinet."
 ISR2_civil_charter:0 "Civil Registration"
 ISR2_civil_charter_desc:0 "A common civil register and public-service standard would give the secular state a clearer identity. Religious parties will contest the loss of authority over family and communal affairs."
 ISR2_civil_equalities:0 "Civil Service Rights"
 ISR2_civil_equalities_desc:0 "Publish common recruitment and promotion rules for the civilian state. Removing barriers makes better use of existing skills without inventing a new population or treating a newspaper as an army reform."
 ISR2_civil_register:0 "The Civil Register"
 ISR2_civil_register_desc:0 "Provide a secular route through civil registration rather than making every household depend on religious jurisdiction. The proposal will face organised resistance from religious institutions."
 ISR2_civil_spillover:0 "Civilian Supplier Access"
 ISR2_civil_spillover_desc:0 "Civilian firms can use test equipment and subcontracting experience developed for defence. Some of the laboratory schedule will move away from military work."
 ISR2_clalit:0 "Clalit Purchasing"
 ISR2_clalit_desc:0 "The health network can purchase medicines and supplies together without withdrawing clinics from small communities. Modernise its purchasing office rather than reducing service through an accounting trick."
 ISR2_close_gaza:0 "End Gaza Funding"
 ISR2_close_gaza_desc:0 "Withdraw the financial support for the foothold beyond Israeli control. Its funded commercial advantages and mirrored burdens end together with the programme."
 ISR2_close_golan:0 "End Golan Funding"
 ISR2_close_golan_desc:0 "Withdraw the financial support for the foothold beyond Israeli control. Its funded commercial advantages and mirrored burdens end together with the programme."
 ISR2_close_sinai:0 "End Sinai Funding"
 ISR2_close_sinai_desc:0 "Withdraw the financial support for the foothold beyond Israeli control. Its funded commercial advantages and mirrored burdens end together with the programme."
 ISR2_close_west_bank:0 "End West Bank Funding"
 ISR2_close_west_bank_desc:0 "Withdraw the financial support for the foothold beyond Israeli control. Its funded commercial advantages and mirrored burdens end together with the programme."
 ISR2_commercial_courts:0 "Small-Firm Courts"
 ISR2_commercial_courts_desc:0 "A small firm cannot spend years pursuing an unpaid contract. Accessible commercial arbitration makes credit and public tenders less dependent on the largest business networks."
 ISR2_commercial_independence:0 "Independent Commerce"
 ISR2_commercial_independence_desc:0 "Support several trading relationships instead of treating a single foreign capital as the answer to every economic problem. Maintaining the wider service has a recurring price."
 ISR2_common_workplaces:0 "A Jewish-Arab Wage Table"
 ISR2_common_workplaces_desc:0 "Use public contracts to establish equal terms in the same workplace. A common wage table broadens the social programme while increasing the cost of public employment."
 ISR2_communal_budget:0 "The Communal Budget"
 ISR2_communal_budget_desc:0 "Orthodox parties negotiate defined support for their communities rather than a general programme of military expansion. A written budget makes their bargain visible to the rest of the cabinet."
 ISR2_communal_welfare:0 "Communal Relief"
 ISR2_communal_welfare_desc:0 "Communal organisations will take on a defined share of clinics, meals and household relief while purchasing supplies through a common office. The state saves part of its central service bill and underwrites a continuing grant."
 ISR2_community_clinics:0 "Town Kupat Holim"
 ISR2_community_clinics_desc:0 "Coordinate neighbourhood clinics, referral services and purchasing instead of sending every case to a distant central facility. The health service saves part of its bill while the treasury funds a standing local grant."
 ISR2_competitive_credit:0 "Independent Credit"
 ISR2_competitive_credit_desc:0 "Guarantees and competitive bank access give smaller firms a route past public and labour monopolies. The cabinet will meet resistance from the institutions whose privileged access it is ending."
 ISR2_comptroller:0 "The State Comptroller"
 ISR2_comptroller_desc:0 "Public enterprises, emergency appropriations and municipal grants will answer to the same audit. Some political allies will find their customary contracts harder to defend."
 ISR2_controlled_sites:0 "West Bank Settlement"
 ISR2_controlled_sites_desc:0 "Military-backed settlement development can only build on ground the state actually controls. Agricultural assets and a protected access road are paid projects, with a continuing security establishment."
 ISR2_cooperative_farming:0 "A Machinery Cooperative"
 ISR2_cooperative_farming_desc:0 "Shared machinery and marketing let farming communities use expensive equipment without purchasing it separately. The treasury pays for the district and training programme."
 ISR2_cooperative_farming_research:0 "A Machinery Cooperative"
 ISR2_councils:0 "Workplace Councils"
 ISR2_councils_desc:0 "Workers' councils receive authority over the organisation of production. Public employers must bargain over the resulting social commitments rather than pocketing every productivity gain."
 ISR2_credit_guarantees:0 "Export Credit Guarantees"
 ISR2_credit_guarantees_desc:0 "A public guarantee lets smaller exporters accept contracts beyond their own balance sheets. The finance ministry must reserve funds against those commitments."
 ISR2_daycare_shifts:0 "Second-Shift Day Care"
 ISR2_daycare_shifts_desc:0 "Childcare and suitable shift arrangements let more women remain in paid employment. The gain comes from participation, supported by a larger public-service budget."
 ISR2_defence_priority:0 "Defence Test Benches"
 ISR2_defence_priority_desc:0 "Concentrate the testing establishment on the urgent military order book. The gain in defence production comes with a smaller civilian share of the engineering effort."
 ISR2_development_repayment:0 "Development Bond Payment"
 ISR2_development_repayment_desc:0 "Use available treasury funds to retire part of the outstanding development debt. The reduction is a real payment, rather than a free improvement in the debt calendar."
 ISR2_diamond_desk:0 "The Diamond Dollar Desk"
 ISR2_diamond_desk_desc:0 "The diamond trade already connects Israel to international finance. A foreign-currency desk can support specialist exporters, but a smaller range of overseas markets will carry more of the economy."
 ISR2_diplomacy_foreign_influence_defense_modifier:0 "Foreign Influence Defense: $RIGHT|+=%1$"
 ISR2_diplomacy_imp_sanction_resistance:0 "Imperia Sanction Resistance: $RIGHT|+=%1$"
