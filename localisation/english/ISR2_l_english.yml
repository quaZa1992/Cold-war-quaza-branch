 ISR2_ambiguity:0 "Research under Ambiguity"
 ISR2_ambiguity_desc:0 "Keep strategic research funded without a public declaration of possession. Laboratories and intelligence protection have a continuing bill; scientific work alone does not supply uranium, a delivery system or a finished weapon."
 ISR2_ambiguity_research:0 "Research under Ambiguity"
 ISR2_applied_engineering:0 "Exportable Engineering"
 ISR2_applied_engineering_desc:0 "Universities, agricultural stations and suppliers will share testing facilities. The programme turns specific engineering problems into products without promising the later venture-capital economy overnight."
 ISR2_applied_engineering_research:0 "Exportable Engineering"
 ISR2_arab_municipalities:0 "Arab Municipal Services"
 ISR2_arab_municipalities_desc:0 "Arab citizens should be able to pursue municipal works through public institutions rather than intermediaries. Fund a road and commercial connection in a controlled Israeli core state."
 ISR2_arava:0 "Arava Civilian Orders"
 ISR2_arava_desc:0 "A utility aircraft and a business-aviation workshop can earn income outside the defence budget. Civil certification and customer support require attention from the same engineers."
 ISR2_arava_research:0 "Arava Civilian Orders"
 ISR2_armour_repair:0 "A Tank Design Office"
 ISR2_armour_repair_desc:0 "Tank rebuilding has already created a pool of mechanics, tools and practical knowledge. A dedicated design office gives that establishment a route toward a domestic vehicle programme."
 ISR2_armour_repair_research:0 "A Tank Design Office"
 ISR2_armoured_school:0 "Tal's Armoured School"
 ISR2_armoured_school_desc:0 "Tank crews need maintenance, gunnery and practical exercises more than another ceremonial command. A stronger school also means paying for vehicles, instructors and fuel."
 ISR2_armoured_school_research:0 "Tal's Armoured School"
 ISR2_arms_congo:0 "Congo-Kinshasa Arms"
 ISR2_arms_congo_desc:0 "Domestic workshops need an order book larger than Israel alone can provide. A foreign customer must agree to an actual equipment sale, its price and delivery schedule."
