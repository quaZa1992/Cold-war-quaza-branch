 ISR2_bedek:0 "Bedek Repair Halls"
 ISR2_bedek_desc:0 "Repair and overhaul are the foundation of aviation independence. Expand that capability before committing the country to an aircraft it cannot maintain."
 ISR2_bedek_research:0 "Bedek Repair Halls"
 ISR2_bilateral.1.d:0 "Export the equipment with the knowledge needed to use it. Overseas customers gain a useful system while Israeli suppliers gain a contract rather than an automatic diplomatic alignment."
 ISR2_bilateral.1.t:0 "Ethiopia: Irrigation"
 ISR2_bilateral.10.d:0 "Seek a Jordanian partner for a territorial settlement rather than treating continued military rule as the permanent answer. The opening offer funds border liaison; actual borders require a separately agreed treaty."
 ISR2_bilateral.10.t:0 "Jordanian Option Talks"
 ISR2_bilateral.11.d:0 "A civilian autonomy offer can separate municipal powers from the cabinet's sovereignty claim. A Palestinian RP government decides whether the proposed service agreement is worth accepting; settlement permission is not part of it."
 ISR2_bilateral.11.t:0 "Palestinian Civic Terms"
 ISR2_bilateral.12.d:0 "Make a concrete service proposal to a Palestinian RP government without requiring either side to accept a final territorial settlement. The partner decides whether to join a paid shared-service arrangement."
 ISR2_bilateral.12.t:0 "Joint Municipal Services"
 ISR2_bilateral.13.d:0 "Technical cooperation can make an embassy useful to its host. An invitation must come from the partner government, and expertise sent abroad still has a budget at home."
 ISR2_bilateral.13.t:0 "Ethiopia: MASHAV Mission"
 ISR2_bilateral.14.d:0 "Domestic workshops need an order book larger than Israel alone can provide. A foreign customer must agree to an actual equipment sale, its price and delivery schedule."
 ISR2_bilateral.14.t:0 "Congo-Kinshasa Arms"
 ISR2_bilateral.15.d:0 "Foreign intelligence assistance must have a defined remit and an Israeli authorising minister. A liaison agreement can improve technical work without conferring open-ended access."
 ISR2_bilateral.15.t:0 "Turkey: Signals Liaison"
 ISR2_bilateral.16.d:0 "Offer a defined investment in Israeli civilian and development projects. The investor supplies real capital and acquires an international investment asset. Capital still unallocated after one year returns to its owner."
 ISR2_bilateral.16.t:0 "US Project Investment"
 ISR2_bilateral.17.d:0 "Offer a defined investment in Israeli civilian and development projects. The investor supplies real capital and acquires an international investment asset. Capital still unallocated after one year returns to its owner."
 ISR2_bilateral.17.t:0 "West German Investment"
 ISR2_bilateral.18.d:0 "Offer a defined investment in Israeli civilian and development projects. The investor supplies real capital and acquires an international investment asset. Capital still unallocated after one year returns to its owner."
 ISR2_bilateral.18.t:0 "Romanian Investment"
 ISR2_bilateral.2.d:0 "Domestic workshops need an order book larger than Israel alone can provide. A foreign customer must agree to an actual equipment sale, its price and delivery schedule."
 ISR2_bilateral.2.t:0 "Uganda: Arms Contract"
 ISR2_bilateral.3.d:0 "Technical cooperation can make an embassy useful to its host. An invitation must come from the partner government, and expertise sent abroad still has a budget at home."
 ISR2_bilateral.3.t:0 "Kenya: MASHAV Mission"
 ISR2_bilateral.4.d:0 "Present a defined procurement and training request to the United States. Israeli planning can use an accepted offer; it cannot assume that another government has already signed it."
 ISR2_bilateral.4.t:0 "US Procurement Terms"
 ISR2_bilateral.5.d:0 "Expand commercial relations through a civilian agreement that can survive disagreement over arms. The partner receives a concrete commercial proposal, not a change of alignment."
 ISR2_bilateral.5.t:0 "Romania: Workshop Pact"
 ISR2_bilateral.6.d:0 "Propose a funded channel for Egyptian and Israeli officers to discuss incidents and ceasefire terms. Each cabinet retains its own position on territory and security."
 ISR2_bilateral.6.t:0 "Egypt: A Jarring Channel"
 ISR2_bilateral.7.d:0 "Foreign intelligence assistance must have a defined remit and an Israeli authorising minister. A liaison agreement can improve technical work without conferring open-ended access."
 ISR2_bilateral.7.t:0 "Iran: Signals Liaison"
 ISR2_bilateral.8.d:0 "Israel offers funded civilian services in one affected Palestinian area. Both governments retain their positions on territory."
 ISR2_bilateral.8.t:0 "Palestinian Service Pact"
 ISR2_bilateral.9.d:0 "A communist cabinet may seek credit from Moscow, but an RP Soviet government must decide whether to lend. Borrowing is a financial contract rather than a compulsory faction choice."
 ISR2_bilateral.9.t:0 "Soviet Development Credit"
