l_english:
# IMPERIA CW — Cold War: GEN 1970 party paths — English localisation.
 # COLDWAR | Party paths and outlook trunks of the 1970 generic tree (Claude outputs/COLDWAR_GEN_generator).
 # Focus descriptions are the historical precedents of the approved design (claude/mdcw_1970_generic_party_paths_design.md).
 # Western outlook
 GEN_1970_champion_western: "Champion the Western Cause"
 GEN_1970_champion_western_desc: "Parties that looked West in the 1970s sold membership of the prosperous \"free world\": Marshall-era trade, American credit and the European example."
 GEN_1970_civic_associations: "Civic Associations"
 GEN_1970_civic_associations_desc: "Chambers of commerce and church lay groups carried Christian Democracy, and personal support groups (koenkai) carried Japan's LDP politicians; they bring calm and a base, but cost subsidies."
 GEN_1970_a_free_press: "A Free Press"
 GEN_1970_a_free_press_desc: "Watergate (1972-74) and the Pentagon Papers (1971) showed what an independent press could do: it spreads Western ideas fast and also exposes the government."
 GEN_1970_the_democratic_majority: "The Democratic Majority"
 GEN_1970_the_democratic_majority_desc: "Portugal (1975-76) and Spain (1977) turned a democratic majority in the streets into a majority at the ballot box that the extremes could not overturn."
 GEN_1970_a_western_government: "A Western Government"
 GEN_1970_a_western_government_desc: "A new Western-oriented government arrives with a mandate: Brandt in 1969, Whitlam in 1972 and Suárez in 1977 all used their first year to push their programme."
 # wa
 GEN_1970_wa_the_developmental_strongman: "The Developmental Strongman"
 GEN_1970_wa_the_developmental_strongman_desc: "Park Chung-hee, Suharto and the Shah justified personal rule by development: the leader stands above parties and answers for growth."
 GEN_1970_wa_rule_from_the_palace: "Rule from the Palace"
 GEN_1970_wa_rule_from_the_palace_desc: "Decisions moved from parliament to the palace: Park's Blue House secretariat, Marcos in Malacañang and the Shah's court ran the state directly."
 GEN_1970_wa_the_economic_planning_board: "The Economic Planning Board"
 GEN_1970_wa_the_economic_planning_board_desc: "Korea's Economic Planning Board, Taiwan's CEPD and Indonesia's Bappenas gave a small team of technocrats direct access to the ruler."
 GEN_1970_wa_martial_law: "Martial Law"
 GEN_1970_wa_martial_law_desc: "Marcos proclaimed martial law in September 1972 (Proclamation 1081), closed Congress and the newspapers: calm streets, empty campuses, a growing constabulary."
 GEN_1970_wa_controlled_elections: "Controlled Elections"
 GEN_1970_wa_controlled_elections_desc: "Suharto's New Order won managed elections through Golkar (1971, 1977); the mandate on paper reassured donors, but patronage and campaign money had to be paid."
 GEN_1970_wa_exports_first: "Exports First"
 GEN_1970_wa_exports_first_desc: "Korea and Taiwan tied credit and tax breaks to export performance, and Park reviewed the targets at monthly export promotion meetings; growth followed world demand - in both directions."
 GEN_1970_wa_the_heavy_industry_drive: "The Heavy Industry Drive"
 GEN_1970_wa_the_heavy_industry_drive_desc: "Korea's Heavy and Chemical Industry plan (1973), financed largely with foreign loans, and the Shah's oil-funded steel and petrochemical projects built heavy industry at speed."
 GEN_1970_wa_silence_the_opposition: "Silence the Opposition"
 GEN_1970_wa_silence_the_opposition_desc: "The KCIA abducted Kim Dae-jung from Tokyo (1973) and the Emergency Decrees made criticism of the constitution a crime; the opposition was driven underground."
 GEN_1970_wa_a_new_constitution: "A New Constitution"
 GEN_1970_wa_a_new_constitution_desc: "Korea's Yushin Constitution (1972) kept elections, but the president was chosen by the National Conference for Unification, a non-party body he chaired, and nominated a third of the Assembly: legality and an assured majority at once."
 GEN_1970_wa_free_export_zones: "Free Export Zones"
 GEN_1970_wa_free_export_zones_desc: "The Kaohsiung (1966) and Masan (1970) free export zones drew foreign assembly plants with tax holidays and cheap labour."
 GEN_1970_wa_steel_mills_and_shipyards: "Steel Mills and Shipyards"
 GEN_1970_wa_steel_mills_and_shipyards_desc: "POSCO's Pohang steelworks (1973) and the Hyundai shipyard at Ulsan (1974) were built by state order, cheap credit and suppressed consumption."
 GEN_1970_wa_a_mandate_for_growth: "A Mandate for Growth"
 GEN_1970_wa_a_mandate_for_growth_desc: "\"Economy first\" was the official answer to every demand for freedom: Park and Suharto legitimised their rule through growth figures."
 GEN_1970_wa_the_developmental_miracle: "The Developmental Miracle"
 GEN_1970_wa_the_developmental_miracle_desc: "Double-digit growth became the regime's claim to rule: Korea grew about 10 % a year in the 1970s, Taiwan and Indonesia not far behind."
 GEN_1970_wa_the_new_village_movement: "The New Village Movement"
 GEN_1970_wa_the_new_village_movement_desc: "Korea's Saemaul Undong (1970) gave villages cement and steel for roads, roofs and irrigation, and tied the countryside to the president."
 GEN_1970_wa_anti_communist_mobilisation: "Anti-Communist Mobilisation"
 GEN_1970_wa_anti_communist_mobilisation_desc: "Korea's Homeland Reserve Forces (1968) and Taiwan's mobilisation laws put millions of citizens in reserve units and anti-communist drills."
 GEN_1970_wa_the_treaty_ally: "The Treaty Ally"
 GEN_1970_wa_the_treaty_ally_desc: "Korea rotated some 320,000 troops through Vietnam (1964-73) and received American aid, weapons and procurement contracts in return - and American advice with them."
 GEN_1970_wa_self_reliant_defence: "Self-Reliant Defence"
 GEN_1970_wa_self_reliant_defence_desc: "After the Nixon Doctrine (1969) and the US troop cuts, Korea's Yulgok plan (1974) and Taiwan built their own arms industries at their own expense."
 GEN_1970_wa_discipline_and_diligence: "Discipline and Diligence"
 GEN_1970_wa_discipline_and_diligence_desc: "National education charters, morning drills and anti-luxury campaigns preached hard work and order as patriotic duties."
 GEN_1970_wa_the_defence_build_up: "The Defence Build-Up"
 GEN_1970_wa_the_defence_build_up_desc: "Iran became the largest buyer of American arms in the 1970s and Korea levied a special defence tax (1975) to pay for its build-up: the strongman's army was his showcase."
 GEN_1970_wa_developmental_dictatorship: "Developmental Dictatorship"
 GEN_1970_wa_developmental_dictatorship_desc: "At its height the developmental dictatorship fused party, planners and conglomerates into one machine for growth, as in Korea under Yushin or Taiwan in the 1970s."
 # con
 GEN_1970_con_a_conservative_government: "A Conservative Government"
 GEN_1970_con_a_conservative_government_desc: "Conservative governments promised competence rather than ideology: Heath announced a \"quiet revolution\" in 1970, while Pompidou (1969) and Fukuda (1976) presented themselves as sound managers."
 GEN_1970_con_the_party_of_government: "The Party of Government"
 GEN_1970_con_the_party_of_government_desc: "Christian Democrats in Italy and Germany and the LDP in Japan saw themselves as the natural party of government, rooted in church, business and countryside."
 GEN_1970_con_the_spending_review: "The Spending Review"
 GEN_1970_con_the_spending_review_desc: "Heath's 1970 White Paper on central government merged ministries into giant departments, and Barber's October 1970 package cut public spending to pay for lower income tax."
 GEN_1970_con_a_strong_executive: "A Strong Executive"
 GEN_1970_con_a_strong_executive_desc: "Gaullism concentrated power in the presidency and governed by decree and referendum; effective, but it alienated parliament and the unions."
 GEN_1970_con_the_broad_church: "The Broad Church"
 GEN_1970_con_the_broad_church_desc: "The CDU/CSU union and the LDP's factions held liberals, farmers, Catholics and business together - at the price of endless bargaining."
 GEN_1970_con_fiscal_discipline: "Fiscal Discipline"
 GEN_1970_con_fiscal_discipline_desc: "The Selsdon programme (1970) promised to end subsidies to \"lame duck\" industries and cut public spending; the unions answered with strikes."
 GEN_1970_con_one_nation_conservatism: "One-Nation Conservatism"
 GEN_1970_con_one_nation_conservatism_desc: "Heath nationalised the bankrupt Rolls-Royce (1971), then in his 1972 U-turn rescued Upper Clyde Shipbuilders and brought in an incomes policy to buy social peace."
 GEN_1970_con_appeal_to_the_nation: "Appeal to the Nation"
 GEN_1970_con_appeal_to_the_nation_desc: "De Gaulle and Pompidou went over the heads of the parties with referendums (1969, 1972) and television addresses to the nation."
 GEN_1970_con_the_coalition_agreement: "The Coalition Agreement"
 GEN_1970_con_the_coalition_agreement_desc: "West Germany's written coalition agreements (the first in 1961) and the LDP's factional quotas for cabinet posts kept multi-party and multi-faction governments together for years at a time."
 GEN_1970_con_balance_the_budget: "Balance the Budget"
 GEN_1970_con_balance_the_budget_desc: "Sound money as a programme: the Bundesbank's stability course and Fukuda's tight budget policy against the \"crazy prices\" of 1974 won the trust of bankers and savers."
 GEN_1970_con_homes_for_the_nation: "Homes for the Nation"
 GEN_1970_con_homes_for_the_nation_desc: "Tanaka's Plan for Remodelling the Japanese Archipelago (1972) and the Tories' home-ownership drive built roads, towns and loyal voters."
 GEN_1970_con_law_and_order: "Law and Order"
 GEN_1970_con_law_and_order_desc: "Facing terrorism and strikes, conservatives ran on law and order: Nixon in 1968 and 1972, and the West German CDU/CSU, which pressed for ever tougher anti-terror laws in the 1970s."
 GEN_1970_con_the_social_market_economy: "The Social Market Economy"
 GEN_1970_con_the_social_market_economy_desc: "The West German model of competition plus social insurance remained the reference point of every 1970s centre-right programme."
 GEN_1970_con_family_and_faith: "Family and Faith"
 GEN_1970_con_family_and_faith_desc: "Italy's Christian Democrats campaigned to repeal divorce in the 1974 referendum and lost, 59 to 41 %; the stand rallied the devout but alienated the cities and the young."
 GEN_1970_con_a_modern_conservatism: "A Modern Conservatism"
 GEN_1970_con_a_modern_conservatism_desc: "Giscard d'Estaing lowered the voting age to 18 and legalised divorce by consent and abortion (1974-75), winning the young but angering the Church."
 GEN_1970_con_the_atlantic_alliance: "The Atlantic Alliance"
 GEN_1970_con_the_atlantic_alliance_desc: "The CDU and the British Conservatives kept NATO at the centre: American technology and markets, alliance force goals to pay for."
 GEN_1970_con_national_independence: "National Independence"
 GEN_1970_con_national_independence_desc: "Gaullist France left NATO's integrated command (1966) and built its own Mirage jets and AMX tanks: independent, respected and expensive."
 GEN_1970_con_the_property_owning_democracy: "The Property-Owning Democracy"
 GEN_1970_con_the_property_owning_democracy_desc: "Conservatives from Eden to Thatcher promised a \"property-owning democracy\": every homeowner and shareholder a stakeholder in order."
 GEN_1970_con_a_credible_deterrent: "A Credible Deterrent"
 GEN_1970_con_a_credible_deterrent_desc: "Whether in the alliance or alone, the centre right promised a defence strong enough to deter, and raised the budget to match."
 GEN_1970_con_the_natural_party_of_government: "The Natural Party of Government"
 GEN_1970_con_the_natural_party_of_government_desc: "The LDP governed Japan from 1955 to 1993 and Italy's Christian Democrats led every government from late 1945 to 1981: the right as the permanent establishment."
 # lib
 GEN_1970_lib_a_liberal_government: "A Liberal Government"
 GEN_1970_lib_a_liberal_government_desc: "Liberals entered government as reformers: the FDP with Brandt (1969), Trudeau's Liberals (1968), D66 in the Netherlands (1973)."
 GEN_1970_lib_the_reform_cabinet: "The Reform Cabinet"
 GEN_1970_lib_the_reform_cabinet_desc: "The social-liberal coalitions of the early 1970s drew up long reform lists for justice, education and the civil service."
 GEN_1970_lib_float_the_currency: "Float the Currency"
 GEN_1970_lib_float_the_currency_desc: "After Nixon closed the gold window (1971) the Smithsonian pegs collapsed; from 1973 most Western currencies floated and capital controls began to fall (the US in 1974, Britain in 1979)."
 GEN_1970_lib_civil_liberties: "Civil Liberties"
 GEN_1970_lib_civil_liberties_desc: "Trudeau's 1969 reform partly decriminalised homosexuality - \"there's no place for the state in the bedrooms of the nation\" - and liberals across Europe reformed criminal law; open societies are also open to rival ideas."
 GEN_1970_lib_electoral_reform: "Electoral Reform"
 GEN_1970_lib_electoral_reform_desc: "Liberal parties campaigned for proportional representation (the UK Liberals after February 1974): fairer seats, more stable consent, but coalition government."
 GEN_1970_lib_free_trade: "Free Trade"
 GEN_1970_lib_free_trade_desc: "The Tokyo Round (1973-79) cut industrial tariffs by a third; open economies grew with world trade and caught its shocks."
 GEN_1970_lib_social_liberalism: "Social Liberalism"
 GEN_1970_lib_social_liberalism_desc: "The FDP's Freiburg Theses (1971) demanded a liberalism of social reform: workers' share in capital, environmental protection, co-determination."
 GEN_1970_lib_freedom_of_information_act: "Freedom of Information Act"
 GEN_1970_lib_freedom_of_information_act_desc: "After Watergate the US strengthened its Freedom of Information Act (1974) over a presidential veto; officials and secret services lost their shield."
 GEN_1970_lib_votes_at_eighteen: "Votes at Eighteen"
 GEN_1970_lib_votes_at_eighteen_desc: "Britain (1969), West Germany (1970) and the US (26th Amendment, 1971) lowered the voting age to 18 and brought a new generation into the system."
 GEN_1970_lib_deregulate_the_banks: "Deregulate the Banks"
 GEN_1970_lib_deregulate_the_banks_desc: "London's Competition and Credit Control (1971) and the eurodollar boom freed the banks; credit grew fast, and the secondary banking crisis of 1973-75 followed."
 GEN_1970_lib_shares_for_the_workers: "Shares for the Workers"
 GEN_1970_lib_shares_for_the_workers_desc: "West Germany's 624-Mark Act (1970) doubled state support for workers' savings and share schemes: wealth for employees through ownership rather than nationalisation."
 GEN_1970_lib_the_liberal_moment: "The Liberal Moment"
 GEN_1970_lib_the_liberal_moment_desc: "With the reforms passed, liberals held the balance of power: the FDP decided who governed Bonn from 1969 to 1982."
 GEN_1970_lib_an_open_economy: "An Open Economy"
 GEN_1970_lib_an_open_economy_desc: "Liberal economics promised growth from competition rather than plans, a theme that came to dominate Western economic policy by the end of the 1970s."
 GEN_1970_lib_environmental_protection: "Environmental Protection"
 GEN_1970_lib_environmental_protection_desc: "The US created the EPA and passed the Clean Air Act in 1970; West Germany's liberal interior ministry wrote the first environmental programme (1971)."
 GEN_1970_lib_open_the_universities: "Open the Universities"
 GEN_1970_lib_open_the_universities_desc: "The Open University (1971) and the wave of new German and Dutch universities opened higher education to the children of workers."
 GEN_1970_lib_a_regional_free_trade_area: "A Regional Free Trade Area"
 GEN_1970_lib_a_regional_free_trade_area_desc: "EFTA, the enlarged EEC (1973) and ASEAN's preferential trade (1977) opened neighbouring markets to industrial goods; farmers, who feared open competition, fought to keep their protection."
 GEN_1970_lib_human_rights_diplomacy: "Human Rights Diplomacy"
 GEN_1970_lib_human_rights_diplomacy_desc: "The Helsinki Final Act (1975) and Carter's human-rights policy (1977) made liberal values a foreign-policy tool; arms exporters lost customers."
 GEN_1970_lib_quality_of_life: "Quality of Life"
 GEN_1970_lib_quality_of_life_desc: "\"Quality of life\" became a slogan of Western reformers in the early 1970s, from Bonn's social-liberal coalition to the new environmental groups: clean towns, public transport and leisure, not growth alone."
 GEN_1970_lib_defence_on_a_budget: "Defence on a Budget"
 GEN_1970_lib_defence_on_a_budget_desc: "Liberal finance ministers bought precision instead of mass: guided anti-tank weapons and shoulder-fired missiles for a smaller, cheaper army."
 GEN_1970_lib_the_open_society: "The Open Society"
 GEN_1970_lib_the_open_society_desc: "Karl Popper's \"open society\" became the liberal creed of the Cold War: a state that can be criticised and corrected, prosperous because it is free."
 # sd
 GEN_1970_sd_a_social_democratic_government: "A Social Democratic Government"
 GEN_1970_sd_a_social_democratic_government_desc: "Social democrats took power across the West around 1970: Brandt (1969), Kreisky (1970), Palme (1969), Whitlam (1972) - and raised social spending at once."
 GEN_1970_sd_dare_more_democracy: "Dare More Democracy"
 GEN_1970_sd_dare_more_democracy_desc: "Brandt's 1969 government statement \"Mehr Demokratie wagen\" promised to open schools, workplaces and the state to participation."
 GEN_1970_sd_the_budget_of_reforms: "The Budget of Reforms"
 GEN_1970_sd_the_budget_of_reforms_desc: "Higher progressive taxes paid for the reform programmes: by the late 1970s Swedish and Danish tax revenues exceeded 40 % of GDP, among the highest in the OECD."
 GEN_1970_sd_the_social_contract: "The Social Contract"
 GEN_1970_sd_the_social_contract_desc: "Britain's Social Contract (1974): the unions accepted wage restraint in return for social policy - and gained great influence over government policy."
 GEN_1970_sd_the_pragmatic_chancellor: "The Pragmatic Chancellor"
 GEN_1970_sd_the_pragmatic_chancellor_desc: "Helmut Schmidt (1974-82) governed as a crisis manager rather than a party ideologue: efficient and trusted by business, suspected by the left."
 GEN_1970_sd_codetermination: "Codetermination"
 GEN_1970_sd_codetermination_desc: "West Germany's Codetermination Act (1976) gave employees half the supervisory board seats in firms with over 2,000 staff, with a shareholder casting vote; employers challenged it in the Constitutional Court and lost (1979)."
 GEN_1970_sd_keynesian_expansion: "Keynesian Expansion"
 GEN_1970_sd_keynesian_expansion_desc: "Whitlam's Australia and Kreisky's \"Austro-Keynesianism\" ran deficits to keep demand and employment up after 1973."
 GEN_1970_sd_the_parity_commission: "The Parity Commission"
 GEN_1970_sd_the_parity_commission_desc: "Austria's Parity Commission let unions and employers settle wages and prices together; Kreisky's Austria had one of the lowest strike rates in the Western world."
 GEN_1970_sd_crisis_management: "Crisis Management"
 GEN_1970_sd_crisis_management_desc: "Schmidt's \"Modell Deutschland\" (1976) steered the economy through the oil crisis with low inflation and international summitry."
 GEN_1970_sd_wage_earner_funds: "Wage-Earner Funds"
 GEN_1970_sd_wage_earner_funds_desc: "Rudolf Meidner's plan, adopted by the LO unions in 1976, proposed union-run funds that would buy up Swedish firms out of profits; business mobilised against it, and only a diluted version passed in 1983."
 GEN_1970_sd_full_employment_programme: "Full Employment Programme"
 GEN_1970_sd_full_employment_programme_desc: "Austria and Sweden kept unemployment at around 2 % through the 1970s with public works, training schemes and subsidised jobs."
 GEN_1970_sd_the_peoples_home: "The People's Home"
 GEN_1970_sd_the_peoples_home_desc: "Per Albin Hansson's folkhem (1928) - society as a good home for all - became shorthand for the Swedish welfare state and a model for social democrats elsewhere."
 GEN_1970_sd_the_welfare_state_matures: "The Welfare State Matures"
 GEN_1970_sd_the_welfare_state_matures_desc: "By the late 1970s the Nordic welfare states provided pensions, health care and childcare as universal, tax-funded public services."
 GEN_1970_sd_comprehensive_schools: "Comprehensive Schools"
 GEN_1970_sd_comprehensive_schools_desc: "Sweden (1962) and Britain (from 1965) replaced selective schools with comprehensives, and SPD-led German Länder opened Gesamtschulen, to open education to every class."
 GEN_1970_sd_a_universal_health_service: "A Universal Health Service"
 GEN_1970_sd_a_universal_health_service_desc: "Canada's medicare covered every province by 1971, Australia launched Medibank (1975) and Italy its national health service (1978)."
 GEN_1970_sd_ostpolitik: "Ostpolitik"
 GEN_1970_sd_ostpolitik_desc: "Brandt's Moscow and Warsaw treaties (1970) and the Basic Treaty (1972) accepted the post-war borders in return for trade, contacts and easier travel; critics said they legitimised the Eastern regimes."
 GEN_1970_sd_alliance_solidarity: "Alliance Solidarity"
 GEN_1970_sd_alliance_solidarity_desc: "Schmidt's 1977 London speech helped prompt NATO's double-track decision (1979): social democrats stood by the alliance against their own peace wing."
 GEN_1970_sd_the_equality_reforms: "The Equality Reforms"
 GEN_1970_sd_the_equality_reforms_desc: "Separate taxation of spouses (Sweden 1971) and equal pay (Australia 1972) brought women into work and into the tax base; traditionalists, many in the churches, defended the single-breadwinner family."
 GEN_1970_sd_common_security: "Common Security"
 GEN_1970_sd_common_security_desc: "The Palme Commission (1980-82) and the Socialist International argued that security could only be achieved together with the adversary, not against it."
 GEN_1970_sd_the_welfare_model: "The Welfare Model"
 GEN_1970_sd_the_welfare_model_desc: "The Scandinavian and Austrian model of high taxes, full employment and universal welfare was widely cited as a social model in the 1970s."
 # Emerging outlook
 GEN_1970_champion_emerging: "Champion the Socialist Camp"
 GEN_1970_champion_emerging_desc: "In the early 1970s the left was on the rise from Chile (Allende 1970) to Portugal (1974); communist and socialist parties grew wherever they could organise openly."
 GEN_1970_party_cells_in_the_factories: "Party Cells in the Factories"
 GEN_1970_party_cells_in_the_factories_desc: "The Italian and French communist parties built their strength on factory cells, and Chile's \"cordones industriales\" (1972) organised whole industrial belts; employers lost control of the shop floor."
 GEN_1970_the_workers_press: "The Workers' Press"
 GEN_1970_the_workers_press_desc: "Party dailies such as L'Humanité and l'Unità sold hundreds of thousands of copies, and Radio Moscow and Radio Peking broadcast worldwide; the presses ran on subsidies."
 GEN_1970_the_toiling_masses_awaken: "The Toiling Masses Awaken"
 GEN_1970_the_toiling_masses_awaken_desc: "By 1975 communist parties polled a third of the vote in Italy and were a leading force in Portugal's revolution; a mass movement makes the outlook hard to dislodge."
 GEN_1970_a_revolutionary_government: "A Revolutionary Government"
 GEN_1970_a_revolutionary_government_desc: "A new socialist government first fills the ministries and key posts with its own people, as Allende's Popular Unity cabinet (1970) and Vasco Gonçalves's provisional governments in Portugal (1974-75) did."
 # cs
 GEN_1970_cs_the_vanguard_party: "The Vanguard Party"
 GEN_1970_cs_the_vanguard_party_desc: "The ruling communist party places itself above the state: the party leads, the ministries execute, as most Soviet-type constitutions came to state outright."
 GEN_1970_cs_the_politburo_decides: "The Politburo Decides"
 GEN_1970_cs_the_politburo_decides_desc: "After Khrushchev's fall (1964) the Soviet Presidium, renamed Politburo in 1966, ruled as a collective leadership around Brezhnev; the bloc parties copied the model of decisions taken in a closed circle."
 GEN_1970_cs_the_new_five_year_plan: "The New Five-Year Plan"
 GEN_1970_cs_the_new_five_year_plan_desc: "The Soviet ninth five-year plan (1971-75) was the first to promise that consumer goods would grow faster than heavy industry."
 GEN_1970_cs_the_stability_of_cadres: "The Stability of Cadres"
 GEN_1970_cs_the_stability_of_cadres_desc: "Brezhnev's \"stability of cadres\", proclaimed after Khrushchev's constant reshuffles, left officials in post for decades; the apparatus was grateful and loyal, the economy slowly stagnated."
 GEN_1970_cs_reform_communism: "Reform Communism"
 GEN_1970_cs_reform_communism_desc: "The Kosygin reform (1965) and Hungary's New Economic Mechanism (1968) gave enterprises profit targets and more freedom; the party conservatives saw their control slip."
 GEN_1970_cs_unity_of_economic_and_social_policy: "Unity of Economic and Social Policy"
 GEN_1970_cs_unity_of_economic_and_social_policy_desc: "Honecker's 1971 programme promised flats, subsidised prices and consumer goods (the 1973 housing programme); welfare bought loyalty and ran up a debt."
 GEN_1970_cs_the_heavy_industry_line: "The Heavy Industry Line"
 GEN_1970_cs_the_heavy_industry_line_desc: "Soviet planning kept priority for \"Group A\" heavy industry and the defence sector under Dmitri Ustinov; consumer supply lagged while the arsenals grew."
 GEN_1970_cs_the_nomenklatura: "The Nomenklatura"
 GEN_1970_cs_the_nomenklatura_desc: "Every important post from factory director to editor was filled from the party's nomenklatura lists; the system was reliable and slowly became a caste."
 GEN_1970_cs_economic_accounting_reform: "Economic Accounting Reform"
 GEN_1970_cs_economic_accounting_reform_desc: "Under \"khozraschet\" (cost accounting) enterprises kept part of their profits for bonus and investment funds; Hungary's NEM went further, freeing many prices and ending compulsory plan targets for firms."
 GEN_1970_cs_licences_from_the_west: "Licences from the West"
 GEN_1970_cs_licences_from_the_west_desc: "Gierek's Poland bought Western licences (Fiat cars, Massey Ferguson tractors) and whole plants on credit in the 1970s; modern factories rose and the foreign debt passed 20 billion dollars by 1980."
 GEN_1970_cs_the_military_industrial_commission: "The Military-Industrial Commission"
 GEN_1970_cs_the_military_industrial_commission_desc: "The Soviet VPK coordinated the defence ministries and gave them first call on steel, engineers and research institutes."
 GEN_1970_cs_the_congress_line: "The Congress Line"
 GEN_1970_cs_the_congress_line_desc: "Each five-yearly party congress fixed the line for the next plan; the 24th CPSU Congress (1971) set the course of the decade."
 GEN_1970_cs_the_comecon_complex_programme: "The Comecon Complex Programme"
 GEN_1970_cs_the_comecon_complex_programme_desc: "Comecon's Complex Programme (1971) divided production between the member states through specialisation and joint projects such as the Soyuz gas pipeline, keeping most of their trade inside the bloc."
 GEN_1970_cs_normalisation: "Normalisation"
 GEN_1970_cs_normalisation_desc: "After 1969 Husák expelled or struck off hundreds of thousands of party members in Czechoslovakia and bought quiet with consumer goods; thousands of academics, writers and artists lost their posts."
 GEN_1970_cs_socialist_legality: "Socialist Legality"
 GEN_1970_cs_socialist_legality_desc: "Kádár's \"who is not against us is with us\" (1961) let Hungarians travel, read and trade a little; it was widely seen as the most liberal regime in the bloc and the most open to Western ideas."
 GEN_1970_cs_fraternal_assistance: "Fraternal Assistance"
 GEN_1970_cs_fraternal_assistance_desc: "Soviet arms, advisers and staff training tied the Warsaw Pact armies to Moscow after the 1969 reform of the Pact's joint command."
 GEN_1970_cs_detente_and_trade: "Détente and Trade"
 GEN_1970_cs_detente_and_trade_desc: "Détente brought Western grain, credits and technology to the East (Brandt's treaties 1970-72, Helsinki 1975), and with them Western ideas."
 GEN_1970_cs_the_leading_role_of_the_party: "The Leading Role of the Party"
 GEN_1970_cs_the_leading_role_of_the_party_desc: "The Soviet constitution of 1977 (Article 6) and the GDR constitution of 1968 wrote the party's leading role into the basic law."
 GEN_1970_cs_socialist_military_doctrine: "Socialist Military Doctrine"
 GEN_1970_cs_socialist_military_doctrine_desc: "Warsaw Pact armies trained for a fast offensive war in Europe; large exercises such as \"Soyuz\" and \"Zapad\" (1981) tested the doctrine."
 GEN_1970_cs_developed_socialism: "Developed Socialism"
 GEN_1970_cs_developed_socialism_desc: "In 1971 Brezhnev declared the USSR a \"developed socialist society\": a mature, stable system that no longer needed upheaval, and slowly stopped changing."
 # ac
 GEN_1970_ac_power_to_the_communes: "Power to the Communes"
 GEN_1970_ac_power_to_the_communes_desc: "The radical left hands authority to local communes and councils, as the Paris Commune ideal and Yugoslav \"social self-government\" promised."
 GEN_1970_ac_the_general_assembly: "The General Assembly"
 GEN_1970_ac_the_general_assembly_desc: "Assemblies of delegates from factories and villages take the place of party parliaments, as in Yugoslavia's 1974 delegate system or the popular assemblies proposed in Portugal in 1975."
 GEN_1970_ac_expropriate_the_estates: "Expropriate the Estates"
 GEN_1970_ac_expropriate_the_estates_desc: "The 1975 land occupations in Portugal's Alentejo turned the great estates into collective farms run by the labourers."
 GEN_1970_ac_workers_councils: "Workers' Councils"
 GEN_1970_ac_workers_councils_desc: "Yugoslav workers' councils chose the managers and divided the income; the factories worked, but the centre lost its grip on decisions."
 GEN_1970_ac_cultural_revolution: "Cultural Revolution"
 GEN_1970_ac_cultural_revolution_desc: "China's Cultural Revolution (1966-76) mobilised the young against \"revisionists\" in the party; it bred fervent loyalty to Mao but also violent purges, and schools and universities closed for years."
 GEN_1970_ac_rely_on_our_own_strength: "Rely on Our Own Strength"
 GEN_1970_ac_rely_on_our_own_strength_desc: "China's \"self-reliance\" (zili gengsheng) and Albania's isolation after 1978 made the economy hard to blockade but cut it off from foreign technology and trade."
 GEN_1970_ac_mass_mobilisation_campaigns: "Mass Mobilisation Campaigns"
 GEN_1970_ac_mass_mobilisation_campaigns_desc: "Campaigns like \"Learn from Dazhai\" (1964-) and Cuba's ten-million-ton harvest (1970) threw whole populations at dams, terraces and canefields; much was built, much was wasted."
 GEN_1970_ac_federation_of_communes: "Federation of Communes"
 GEN_1970_ac_federation_of_communes_desc: "The 1974 Yugoslav constitution devolved power to the republics, communes and self-managed enterprises; investment no longer waited for Belgrade, though projects were often duplicated."
 GEN_1970_ac_down_to_the_countryside: "Down to the Countryside"
 GEN_1970_ac_down_to_the_countryside_desc: "From 1968 some seventeen million Chinese urban youths were sent to the villages over a decade; fields gained hands, the universities lost a generation."
 GEN_1970_ac_local_industry_in_every_county: "Local Industry in Every County"
 GEN_1970_ac_local_industry_in_every_county_desc: "China's \"five small industries\" (1970) put steel, cement, fertiliser, machine and power plants in county after county; small, inefficient and independent."
 GEN_1970_ac_volunteer_labour_brigades: "Volunteer Labour Brigades"
 GEN_1970_ac_volunteer_labour_brigades_desc: "Cuba's microbrigades (1970-) built housing with volunteer labour and Chinese water-conservancy campaigns dug canals by hand; the workplaces they left had to make up their output."
 GEN_1970_ac_the_mass_line: "The Mass Line"
 GEN_1970_ac_the_mass_line_desc: "\"From the masses, to the masses\": the Maoist mass line made cadres live and work among the people they governed."
 GEN_1970_ac_moral_not_material_incentives: "Moral, Not Material, Incentives"
 GEN_1970_ac_moral_not_material_incentives_desc: "Guevara's \"new man\" and the Maoist campaigns replaced bonuses with honours and emulation; less went on consumer goods, but absenteeism spread (Cuba passed an anti-loafing law in 1971)."
 GEN_1970_ac_revolutionary_committees: "Revolutionary Committees"
 GEN_1970_ac_revolutionary_committees_desc: "From 1967 Chinese \"three-in-one\" committees of soldiers, cadres and rebels replaced the party committees and governments of every province by 1968."
 GEN_1970_ac_barefoot_doctors: "Barefoot Doctors"
 GEN_1970_ac_barefoot_doctors_desc: "From 1968 over a million Chinese \"barefoot doctors\" and night schools brought basic medicine and reading to the villages at a fraction of the cost."
 GEN_1970_ac_support_the_world_revolution: "Support the World Revolution"
 GEN_1970_ac_support_the_world_revolution_desc: "China and Cuba trained, armed and funded liberation movements in the 1960s-70s, from Africa to Latin America (Cuba in Angola, 1975)."
 GEN_1970_ac_a_people_s_war_defence: "A People's War Defence"
 GEN_1970_ac_a_people_s_war_defence_desc: "Mao's \"people's war\" and Albania's bunker programme (1967-86, over 170,000 bunkers) prepared every village to resist an invasion."
 GEN_1970_ac_serve_the_people: "Serve the People"
 GEN_1970_ac_serve_the_people_desc: "The \"Serve the People\" and Lei Feng campaigns (1963-) held up selfless service as the model citizen of the new society."
 GEN_1970_ac_the_armed_masses: "The Armed Masses"
 GEN_1970_ac_the_armed_masses_desc: "People's militias armed the population on a mass scale: the Chinese militia counted tens of millions in the early 1970s."
 GEN_1970_ac_the_new_society: "The New Society"
 GEN_1970_ac_the_new_society_desc: "The radical left promised a society without bosses or bureaucrats; where it governed, it built communes, councils and a deep suspicion of experts."
 # ce
 GEN_1970_ce_the_ruling_party_endures: "The Ruling Party Endures"
 GEN_1970_ce_the_ruling_party_endures_desc: "Mexico's PRI had ruled under various names since 1929 and Algeria's FLN since 1962: the party is the state, and the state hands out the jobs."
 GEN_1970_ce_heirs_of_the_revolution: "Heirs of the Revolution"
 GEN_1970_ce_heirs_of_the_revolution_desc: "Dominant parties ruled in the name of a founding revolution (1910 in Mexico, 1954 in Algeria, 1952 in Egypt) and claimed its legitimacy for every new leader."
 GEN_1970_ce_the_state_sector: "The State Sector"
 GEN_1970_ce_the_state_sector_desc: "State firms such as Pemex, Sonatrach and Egypt's public sector companies were the backbone of the dominant-party economy."
 GEN_1970_ce_the_corporatist_pact: "The Corporatist Pact"
 GEN_1970_ce_the_corporatist_pact_desc: "The PRI organised society in sectors (CTM labour, CNC peasants, CNOP middle class): every group had a seat at the table and a share of the patronage."
 GEN_1970_ce_technocratic_renewal: "Technocratic Renewal"
 GEN_1970_ce_technocratic_renewal_desc: "In the 1970s planners and economists (\"técnicos\") gained ground against the old party bosses in Mexico and Algeria; efficiency rose, the old networks resented it."
 GEN_1970_ce_nationalise_the_resources: "Nationalise the Resources"
 GEN_1970_ce_nationalise_the_resources_desc: "On 24 February 1971 Algeria took 51 % of the French oil companies; Iraq (1972) and Venezuela (1976) followed. Revenue flowed home and foreign investors grew wary."
 GEN_1970_ce_the_opening_to_capital: "The Opening to Capital"
 GEN_1970_ce_the_opening_to_capital_desc: "Sadat's Infitah (1974) and Mexico's border industry programme (1965) invited foreign investors with tax breaks; business boomed and the economy became exposed."
 GEN_1970_ce_official_trade_unions: "Official Trade Unions"
 GEN_1970_ce_official_trade_unions_desc: "Fidel Velázquez's CTM delivered Mexican labour peace for decades in exchange for wages, housing funds (INFONAVIT 1972) and seats in Congress."
 GEN_1970_ce_the_planning_ministry: "The Planning Ministry"
 GEN_1970_ce_the_planning_ministry_desc: "Algeria's Secretariat of Planning and Mexico's Ministry of Programming and Budget (1976) gave the technocrats their own power base."
 GEN_1970_ce_industrialising_industries: "Industrialising Industries"
 GEN_1970_ce_industrialising_industries_desc: "Boumédiène spent the oil money on \"industrialising industries\": the El Hadjar steelworks, gas liquefaction and petrochemicals (plans 1970-77)."
 GEN_1970_ce_joint_ventures: "Joint Ventures"
 GEN_1970_ce_joint_ventures_desc: "Egypt's Infitah brought joint ventures with Western and Gulf capital; when subsidies were cut the 1977 bread riots followed."
 GEN_1970_ce_the_chosen_successor: "The Chosen Successor"
 GEN_1970_ce_the_chosen_successor_desc: "The PRI's outgoing president named his successor (the \"dedazo\", 1970 and 1976); the party closed ranks and the transfer of power stayed peaceful."
 GEN_1970_ce_shared_development: "Shared Development"
 GEN_1970_ce_shared_development_desc: "Echeverría's \"desarrollo compartido\" (1970-76) expanded state investment and social programmes to share the fruits of growth."
 GEN_1970_ce_subsidies_and_patronage: "Subsidies and Patronage"
 GEN_1970_ce_subsidies_and_patronage_desc: "Cheap bread, fuel and staples through CONASUPO in Mexico and Egypt's ration system kept the cities quiet and the budget strained."
 GEN_1970_ce_the_agrarian_revolution: "The Agrarian Revolution"
 GEN_1970_ce_the_agrarian_revolution_desc: "Algeria's Agrarian Revolution (1971) handed large estates to cooperatives against the landowners' resistance, and Tanzania's villagisation (1973-76) moved millions of peasants into Ujamaa villages, often by force."
 GEN_1970_ce_a_treaty_of_friendship: "A Treaty of Friendship"
 GEN_1970_ce_a_treaty_of_friendship_desc: "Egypt (1971), India (1971), Iraq (1972) and Somalia (1974) signed friendship treaties with Moscow: arms and advisers in return for influence."
 GEN_1970_ce_play_the_blocs: "Play the Blocs Against Each Other"
 GEN_1970_ce_play_the_blocs_desc: "Sadat expelled the Soviet advisers in 1972 and courted Washington, and Algeria led the Non-Aligned Movement (1973): trade and favours from both sides, loyalty to neither."
 GEN_1970_ce_the_mass_organisations: "The Mass Organisations"
 GEN_1970_ce_the_mass_organisations_desc: "Youth, women's and peasant unions of the ruling party (the FLN's UNJA, the ASU youth) reached into every village and school."
 GEN_1970_ce_party_and_army_united: "Party and Army United"
 GEN_1970_ce_party_and_army_united_desc: "In Algeria, Egypt and Burma soldiers had made the regime (the Free Officers in 1952, Ne Win in 1962, Boumédiène in 1965); the dominant party kept the army inside the regime with budgets and honours."
 GEN_1970_ce_sovereign_development: "Sovereign Development"
 GEN_1970_ce_sovereign_development_desc: "The dominant parties defined success as development on their own terms: Mexico's \"stabilising development\" (1954-70) and Algeria's plans delivered long years of rapid growth."
 # ea
 GEN_1970_ea_the_revolutionary_command_council: "The Revolutionary Command Council"
 GEN_1970_ea_the_revolutionary_command_council_desc: "Post-coup regimes governed through a Revolutionary Command Council - Egypt 1952, Iraq 1968, Libya 1969 - and paid the army first."
 GEN_1970_ea_one_party_one_revolution: "One Party, One Revolution"
 GEN_1970_ea_one_party_one_revolution_desc: "Egypt's Arab Socialist Union, Algeria's FLN and Somalia's Revolutionary Socialist Party (1976) channelled all politics into one organisation."
 GEN_1970_ea_an_economy_for_the_revolution: "An Economy for the Revolution"
 GEN_1970_ea_an_economy_for_the_revolution_desc: "Land reform came early in the officers' revolutions: Egypt 1952, Iraq 1958 and 1970, Ethiopia's nationalisation of rural land in 1975."
 GEN_1970_ea_the_party_over_the_barracks: "The Party Over the Barracks"
 GEN_1970_ea_the_party_over_the_barracks_desc: "Ba'athist Iraq after 1968 put party commissars into every unit and purged independent officers; the regime grew stable, the army less effective."
 GEN_1970_ea_rule_of_the_command_council: "Rule of the Command Council"
 GEN_1970_ea_rule_of_the_command_council_desc: "Libya's RCC (1969) and Ethiopia's Derg (1974) kept power with the officers themselves; uniforms ran ministries that civil servants had run before."
 GEN_1970_ea_nationalise_foreign_assets: "Nationalise Foreign Assets"
 GEN_1970_ea_nationalise_foreign_assets_desc: "Iraq nationalised the Iraq Petroleum Company in June 1972 and Libya nationalised or took majority stakes in the foreign oil firms in 1971-74: a windfall, and Western capital grew wary."
 GEN_1970_ea_the_pragmatic_turn: "The Pragmatic Turn"
 GEN_1970_ea_the_pragmatic_turn_desc: "Sadat's Infitah (1974) opened Egypt to Western and Gulf capital; the party left protested and liberal ideas returned with the investors."
 GEN_1970_ea_coup_proof_the_regime: "Coup-Proof the Regime"
 GEN_1970_ea_coup_proof_the_regime_desc: "After 1970 Assad and the Iraqi Ba'ath built parallel guard units and party cells in every barracks; neither regime fell to a coup again."
 GEN_1970_ea_arms_for_the_revolution: "Arms for the Revolution"
 GEN_1970_ea_arms_for_the_revolution_desc: "Libya's RCC spent oil money and the Derg Soviet credits on tanks and guns; by 1980 Ethiopia's army had grown into one of the largest in Africa."
 GEN_1970_ea_the_public_sector_commands: "The Public Sector Commands"
 GEN_1970_ea_the_public_sector_commands_desc: "Boumédiène's \"industrialising industries\" (1970-73 plan) put steel, petrochemicals and machinery under state companies such as Sonatrach and SNS."
 GEN_1970_ea_the_open_door: "The Open Door"
 GEN_1970_ea_the_open_door_desc: "Egypt's Law 43 of 1974 created free zones and joint ventures; Gulf and Western money arrived, and so did the swings of the world market."
 GEN_1970_ea_a_national_charter: "A National Charter"
 GEN_1970_ea_a_national_charter_desc: "Egypt's National Charter (1962), Syria's permanent constitution (1973) and Algeria's National Charter (1976) fixed the revolution in law."
 GEN_1970_ea_a_revolutionary_five_year_plan: "A Revolutionary Five-Year Plan"
 GEN_1970_ea_a_revolutionary_five_year_plan_desc: "Iraq's 1976-80 and Syria's 1976-80 plans poured the oil boom into factories, dams and roads."
 GEN_1970_ea_people_s_militias: "People's Militias"
 GEN_1970_ea_people_s_militias_desc: "Iraq's Popular Army (1970), Libya's People's Militia and the Derg's militias armed party loyalists as a counterweight to the regular officers."
 GEN_1970_ea_the_national_literacy_drive: "The National Literacy Drive"
 GEN_1970_ea_the_national_literacy_drive_desc: "Iraq's compulsory literacy campaign (1978-80) and Somalia's 1974 rural campaign after the new script taught millions to read, at the treasury's expense."
 GEN_1970_ea_the_treaty_of_friendship: "The Treaty of Friendship"
 GEN_1970_ea_the_treaty_of_friendship_desc: "Iraq (1972), Somalia (1974) and Syria (1980) signed friendship treaties with Moscow: MiGs and T-62s on credit, and Soviet advisers in the staffs."
 GEN_1970_ea_send_the_advisers_home: "Send the Advisers Home"
 GEN_1970_ea_send_the_advisers_home_desc: "In July 1972 Sadat ordered out some 15,000-20,000 Soviet military advisers; Egyptians cheered, Washington and the Gulf took note, and the army trained without them."
 GEN_1970_ea_the_popular_federations: "The Popular Federations"
 GEN_1970_ea_the_popular_federations_desc: "Party unions, youth leagues and women's federations (the General Federation of Iraqi Women, 1969) tied every part of society to the regime."
 GEN_1970_ea_rebuild_the_army_of_the_revolution: "Rebuild the Army of the Revolution"
 GEN_1970_ea_rebuild_the_army_of_the_revolution_desc: "After 1967 Egypt and Syria rebuilt their armies around missile air defence and anti-tank infantry, the forces that crossed the Suez Canal and attacked on the Golan in October 1973."
 GEN_1970_ea_the_leader_s_state: "The Leader's State"
 GEN_1970_ea_the_leader_s_state_desc: "By the late 1970s the revolutions had become personal states: Gaddafi's Jamahiriya (1977), Assad's Syria, Saddam's presidency (1979)."
 # mvf
 GEN_1970_mvf_an_islamic_republic: "An Islamic Republic"
 GEN_1970_mvf_an_islamic_republic_desc: "The March 1979 referendum created an Islamic Republic with a broad coalition of clerics, liberals and the bazaar behind it."
 GEN_1970_mvf_a_constitution_for_the_republic: "A Constitution for the Republic"
 GEN_1970_mvf_a_constitution_for_the_republic_desc: "The Assembly of Experts drafted a constitution joining an elected president and Majlis to clerical guardianship, approved by referendum in December 1979."
 GEN_1970_mvf_an_economy_without_usury: "An Economy Without Usury"
 GEN_1970_mvf_an_economy_without_usury_desc: "Baqir al-Sadr's Iqtisaduna (1961) set out an Islamic economy between capitalism and socialism; Iran replaced interest-based banking in 1983."
 GEN_1970_mvf_clerical_pluralism: "Clerical Pluralism"
 GEN_1970_mvf_clerical_pluralism_desc: "Grand Ayatollahs such as Shariatmadari wanted elected government with the clergy as advisers; in 1979-80 parties, papers and candidates still competed."
 GEN_1970_mvf_guardian_council_oversight: "Guardian Council Oversight"
 GEN_1970_mvf_guardian_council_oversight_desc: "The Guardian Council (1980) checked every law against Islamic law and the constitution, giving the jurists a veto over the elected Majlis."
 GEN_1970_mvf_the_bazaar_economy: "The Bazaar Economy"
 GEN_1970_mvf_the_bazaar_economy_desc: "The Tehran bazaar financed the revolution and expected free trade, light taxes and the protection of private property in return."
 GEN_1970_mvf_revolutionary_foundations: "Revolutionary Foundations"
 GEN_1970_mvf_revolutionary_foundations_desc: "The Foundation of the Oppressed (1979) took over the Pahlavi Foundation's assets to fund the poor, answering to no ministry."
 GEN_1970_mvf_a_sovereign_majlis: "A Sovereign Majlis"
 GEN_1970_mvf_a_sovereign_majlis_desc: "Iran's first Majlis (1980) and the 1980 presidential election, won by a lay economist, showed a republic with real contests."
 GEN_1970_mvf_an_expediency_council: "An Expediency Council"
 GEN_1970_mvf_an_expediency_council_desc: "When the Guardian Council blocked the Majlis' land and labour laws, Khomeini created the Expediency Council in 1988 to settle such deadlocks."
 GEN_1970_mvf_the_merchants_guilds: "The Merchants' Guilds"
 GEN_1970_mvf_the_merchants_guilds_desc: "Bazaar guilds and merchant networks close to the clergy controlled much of the import trade and informal credit, keeping goods moving through revolution and war."
 GEN_1970_mvf_factories_of_the_disinherited: "Factories of the Disinherited"
 GEN_1970_mvf_factories_of_the_disinherited_desc: "The foundations ran hundreds of confiscated factories, hotels and farms and employed tens of thousands of the revolution's supporters."
 GEN_1970_mvf_rule_of_law_over_the_committees: "Rule of Law over the Committees"
 GEN_1970_mvf_rule_of_law_over_the_committees_desc: "Bazargan's government tried in 1979 to bring the neighbourhood revolutionary committees under the police and the courts."
 GEN_1970_mvf_construction_jihad: "Construction Jihad"
 GEN_1970_mvf_construction_jihad_desc: "Construction Jihad (1979) sent volunteers to build roads, wells and power lines in the villages the old regime had neglected."
 GEN_1970_mvf_reopen_the_universities: "Reopen the Universities"
 GEN_1970_mvf_reopen_the_universities_desc: "Moderates pressed to reopen the universities closed in 1980 and to keep their secular faculty; they reopened in 1982-83."
 GEN_1970_mvf_the_ministry_of_guidance: "The Ministry of Guidance"
 GEN_1970_mvf_the_ministry_of_guidance_desc: "The Ministry of Islamic Guidance (later Culture and Islamic Guidance) licensed books, films and newspapers, shaping public life through censorship rather than force."
 GEN_1970_mvf_independence_before_alliances: "Independence Before Alliances"
 GEN_1970_mvf_independence_before_alliances_desc: "\"Neither East nor West\" (1979) refused both blocs; the republic paid in lost trade and spare parts and built its own workshops instead."
 GEN_1970_mvf_good_neighbourliness: "Good Neighbourliness"
 GEN_1970_mvf_good_neighbourliness_desc: "Bazargan's government kept trade and diplomatic ties with the neighbours and even the West in 1979, until the hostage crisis ended the course."
 GEN_1970_mvf_islamic_civil_society: "Islamic Civil Society"
 GEN_1970_mvf_islamic_civil_society_desc: "Mosque associations, Islamic societies and charity funds gave the republic a social base that reached beyond the state."
 GEN_1970_mvf_trust_the_regular_army: "Trust the Regular Army"
 GEN_1970_mvf_trust_the_regular_army_desc: "Bazargan and Banisadr relied on the regular army rather than the new militias, and the regular army bore much of the early fighting after September 1980."
 GEN_1970_mvf_islamic_social_justice: "Islamic Social Justice"
 GEN_1970_mvf_islamic_social_justice_desc: "The republic's founding promise was justice for the mostaz'afin, the disinherited: subsidies, rural electrification and welfare paid by oil and the foundations."
 # vf
 GEN_1970_vf_guardianship_of_the_jurist: "Guardianship of the Jurist"
 GEN_1970_vf_guardianship_of_the_jurist_desc: "Khomeini's 1970 lectures in Najaf argued that a just jurist must govern in the absence of the Imam; the 1979 constitution made it law."
 GEN_1970_vf_the_office_of_the_supreme_leader: "The Office of the Supreme Leader"
 GEN_1970_vf_the_office_of_the_supreme_leader_desc: "The 1979 constitution placed the guardian jurist above president and Majlis, commanding the armed forces and appointing the top judges."
 GEN_1970_vf_the_banks_belong_to_the_revolution: "The Banks Belong to the Revolution"
 GEN_1970_vf_the_banks_belong_to_the_revolution_desc: "In June 1979 Iran nationalised all private banks and insurers, and then large industry, putting credit under revolutionary control."
 GEN_1970_vf_the_revolutionary_guard: "The Revolutionary Guard"
 GEN_1970_vf_the_revolutionary_guard_desc: "The Revolutionary Guard Corps (May 1979) was built beside the distrusted regular army; the two competed for men, money and weapons all through the 1980s."
 GEN_1970_vf_islamisation_of_society: "Islamisation of Society"
 GEN_1970_vf_islamisation_of_society_desc: "Dress codes, Islamic courts and the purge of secular officials (1980-81) remade public life; trade partners and the professional class drew back."
 GEN_1970_vf_the_foundations_inherit: "The Foundations Inherit"
 GEN_1970_vf_the_foundations_inherit_desc: "The Foundation of the Oppressed and other bonyads took over the old elite's confiscated assets and ran them largely tax-free and without public audit."
 GEN_1970_vf_the_coupon_economy: "The Coupon Economy"
 GEN_1970_vf_the_coupon_economy_desc: "From 1980 the government rationed basic goods with coupons and fixed prices: the poor were fed, the bazaar was squeezed."
 GEN_1970_vf_mobilise_the_basij: "Mobilise the Basij"
 GEN_1970_vf_mobilise_the_basij_desc: "The Basij (1980) organised millions of volunteers - students, villagers, the elderly - and sent them to the front in the war with Iraq."
 GEN_1970_vf_cultural_councils: "Cultural Councils"
 GEN_1970_vf_cultural_councils_desc: "The Cultural Revolution Headquarters (1980) kept the universities closed until 1982-83 and rewrote curricula; councils kept watch over schools and media afterwards."
 GEN_1970_vf_the_foundations_empire: "The Foundations' Empire"
 GEN_1970_vf_the_foundations_empire_desc: "By the mid-1980s the Foundation of the Oppressed was one of the largest conglomerates in the Middle East: factories, shipping and real estate."
 GEN_1970_vf_self_sufficiency_in_wartime: "Self-Sufficiency in Wartime"
 GEN_1970_vf_self_sufficiency_in_wartime_desc: "Under the US embargo (1979) the planners pushed self-sufficiency in food, spare parts and munitions, rebuilding plants foreign suppliers had serviced."
 GEN_1970_vf_the_revolutionary_courts: "The Revolutionary Courts"
 GEN_1970_vf_the_revolutionary_courts_desc: "Revolutionary courts tried the old regime's officials and then the new regime's opponents, outside the ordinary judiciary."
 GEN_1970_vf_the_martyrs_foundation: "The Martyrs' Foundation"
 GEN_1970_vf_the_martyrs_foundation_desc: "The Martyrs' Foundation (1980) gave housing, pensions and university places to the families of the war dead, binding them to the state."
 GEN_1970_vf_the_revolutionary_committees: "The Revolutionary Committees"
 GEN_1970_vf_the_revolutionary_committees_desc: "Neighbourhood committees (1979) policed morality and pursued opponents street by street until they were merged into the police in 1991."
 GEN_1970_vf_friday_prayer_networks: "Friday Prayer Networks"
 GEN_1970_vf_friday_prayer_networks_desc: "Friday prayer leaders appointed in every city and state-funded seminaries carried the leadership's message into every neighbourhood."
 GEN_1970_vf_aid_the_oppressed_abroad: "Aid the Oppressed Abroad"
 GEN_1970_vf_aid_the_oppressed_abroad_desc: "Guards instructors went to Lebanon's Bekaa valley in 1982 and Tehran hosted Iraqi, Gulf and Afghan Shia exiles, at the price of regional isolation."
 GEN_1970_vf_arms_from_any_seller: "Arms from Any Seller"
 GEN_1970_vf_arms_from_any_seller_desc: "During the war Iran bought weapons from North Korea, China, Libya and - secretly - Israel and the United States (Iran-Contra, 1985-86): the front came before ideology."
 GEN_1970_vf_defend_the_revolution_s_values: "Defend the Revolution's Values"
 GEN_1970_vf_defend_the_revolution_s_values_desc: "After the 1981 bombings killed the president, the prime minister and dozens of officials, the regime built the security apparatus that broke the armed opposition."
 GEN_1970_vf_the_defence_industries_organisation: "The Defence Industries Organisation"
 GEN_1970_vf_the_defence_industries_organisation_desc: "The Defence Industries Organisation and the Guards' own workshops expanded production of rockets, mortars and small arms in the 1980s to outlast the embargo."
 GEN_1970_vf_export_the_revolution: "Export the Revolution"
 GEN_1970_vf_export_the_revolution_desc: "The 1979 constitution pledged support for the oppressed everywhere; Guards units abroad and allied movements made it policy, and the neighbours armed against it."
 # Salafist outlook
 GEN_1970_champion_salafist: "Champion the Islamic Awakening"
 GEN_1970_champion_salafist_desc: "After 1967 the Islamic revival (al-sahwa) filled the space left by Arab nationalism; preachers, students and Gulf money spread it across the Muslim world."
 GEN_1970_mosque_networks: "Mosque Networks"
 GEN_1970_mosque_networks_desc: "The Muslim World League (1962) financed mosques, preachers and imams across Asia and Africa; the pulpit, more than the university, became the movement's school."
 GEN_1970_charitable_societies: "Charitable Societies"
 GEN_1970_charitable_societies_desc: "Islamic charities such as Egypt's al-Jam'iyya al-Shar'iyya or Kuwait's Social Reform Society ran clinics and schools the state could not provide, and answered to their own boards, not to the government."
 GEN_1970_the_faithful_majority: "The Faithful Majority"
 GEN_1970_the_faithful_majority_desc: "By the late 1970s Islamist lists were winning student unions from Cairo to Kuala Lumpur, and in the 1980s Egypt's professional syndicates: the revival had become a mass movement."
 GEN_1970_an_islamic_government: "An Islamic Government"
 GEN_1970_an_islamic_government_desc: "Islamic governments of the period (Saudi Arabia, Pakistan after 1977, Sudan after 1983) claimed a religious mandate and governed largely by decree."
 # sk
 GEN_1970_sk_custodian_of_the_faith: "Custodian of the Faith"
 GEN_1970_sk_custodian_of_the_faith_desc: "Saudi kings ruled as protectors of the faith; the alliance of the House of Saud with the Wahhabi scholars was the founding bargain of the state."
 GEN_1970_sk_the_royal_diwan: "The Royal Diwan"
 GEN_1970_sk_the_royal_diwan_desc: "Faisal centralised power in the Royal Diwan and the Council of Ministers after replacing King Saud in 1964; princes held the key ministries."
 GEN_1970_sk_the_ministry_of_planning: "The Ministry of Planning"
 GEN_1970_sk_the_ministry_of_planning_desc: "Saudi Arabia upgraded its Central Planning Organisation (1965) to a Ministry of Planning in 1975 to spend the oil boom."
 GEN_1970_sk_royal_modernisation: "Royal Modernisation"
 GEN_1970_sk_royal_modernisation_desc: "Faisal backed state girls' schools (1960) and introduced television (1965) despite clerical protest; modernisation came from the palace, and the ulema resented it."
 GEN_1970_sk_the_ulema_compact: "The Ulema Compact"
 GEN_1970_sk_the_ulema_compact_desc: "The kingdom could also govern through the clerics: education, courts and morals stayed theirs in exchange for loyalty, at a cost to universities and science."
 GEN_1970_sk_participation_in_the_concessions: "Participation in the Concessions"
 GEN_1970_sk_participation_in_the_concessions_desc: "Under Yamani's \"participation\" (1972) the Gulf states bought into the foreign oil concessions step by step; revenues rose, and foreign capital grew wary."
 GEN_1970_sk_recycle_the_petrodollars: "Recycle the Petrodollars"
 GEN_1970_sk_recycle_the_petrodollars_desc: "After 1974 Saudi surpluses flowed into US Treasury bills and Western banks under a quiet agreement with Washington: high returns, tied to the Western market."
 GEN_1970_sk_the_five_year_development_plan: "The Five-Year Development Plan"
 GEN_1970_sk_the_five_year_development_plan_desc: "The first Saudi five-year plan (1970-75) built roads, power and industry with oil money; the second (1975-80) planned almost 142 billion dollars of spending."
 GEN_1970_sk_religious_police: "Religious Police"
 GEN_1970_sk_religious_police_desc: "The Committee for the Promotion of Virtue and the Prevention of Vice (the mutawwi'in) policed prayer times, dress and shops; merchants complained, but the streets stayed quiet."
 GEN_1970_sk_national_petrochemicals: "National Petrochemicals"
 GEN_1970_sk_national_petrochemicals_desc: "SABIC (1976) and the new industrial cities of Jubail and Yanbu turned flared gas into petrochemicals owned by the state."
 GEN_1970_sk_the_sovereign_investment_fund: "The Sovereign Investment Fund"
 GEN_1970_sk_the_sovereign_investment_fund_desc: "Kuwait's Fund for Future Generations and the Abu Dhabi Investment Authority (both 1976) saved oil money abroad for the day the wells ran dry."
 GEN_1970_sk_the_council_of_senior_scholars: "The Council of Senior Scholars"
 GEN_1970_sk_the_council_of_senior_scholars_desc: "In 1971 the king founded the Council of Senior Scholars: the clerics gained an official voice, and the crown gained fatwas when it needed them."
 GEN_1970_sk_the_development_boom: "The Development Boom"
 GEN_1970_sk_the_development_boom_desc: "The boom of 1974-81 brought cranes, contractors and more than a million foreign workers into the Gulf kingdoms."
 GEN_1970_sk_the_ulema_bargain: "The Ulema Bargain"
 GEN_1970_sk_the_ulema_bargain_desc: "After the Grand Mosque seizure of November 1979 the government gave the clerics more money, more control over schools and the closure of cinemas; public life grew more restrictive for a generation."
 GEN_1970_sk_expand_the_national_guard: "Expand the National Guard"
 GEN_1970_sk_expand_the_national_guard_desc: "The tribal National Guard, trained by the American firm Vinnell from 1975, was expanded after the 1979 siege as the regime's main internal security force."
 GEN_1970_sk_the_american_umbrella: "The American Umbrella"
 GEN_1970_sk_the_american_umbrella_desc: "The US-Saudi Joint Commission (1974), F-15s (1978) and AWACS (1981) made Washington the kingdom's protector, and gave it a say in Riyadh."
 GEN_1970_sk_chequebook_diplomacy: "Chequebook Diplomacy"
 GEN_1970_sk_chequebook_diplomacy_desc: "Faisal championed the OIC (1969) and the Islamic Development Bank (agreed 1973), subsidised the frontline states and used the 1973 embargo: influence bought with money, at some risk."
 GEN_1970_sk_the_kingdom_secured: "The Kingdom Secured"
 GEN_1970_sk_the_kingdom_secured_desc: "By the early 1980s the monarchy had absorbed the shock of 1979 and the Shia unrest in the east; dissent went underground or abroad."
 GEN_1970_sk_the_petrodollar_arsenal: "The Petrodollar Arsenal"
 GEN_1970_sk_the_petrodollar_arsenal_desc: "The Gulf monarchies spent billions on air bases, Hawk missiles and fighters in the 1970s; the air force was the prestige service of every royal family."
 GEN_1970_sk_pan_islamic_solidarity: "Pan-Islamic Solidarity"
 GEN_1970_sk_pan_islamic_solidarity_desc: "Faisal's pan-Islamism offered the Muslim world an alternative to Nasser's Arab socialism; it outlived him as the kingdom's foreign identity."
 # cal
 GEN_1970_cal_proclaim_the_caliphate: "Proclaim the Caliphate"
 GEN_1970_cal_proclaim_the_caliphate_desc: "Islamising regimes began by proclaiming sharia the basis of law, as Zia did with the Hudood Ordinances in 1979 and Nimeiry in 1983; it rallied followers and alarmed neighbours and trade partners."
 GEN_1970_cal_the_consultative_council: "The Consultative Council"
 GEN_1970_cal_the_consultative_council_desc: "Zia replaced parliament with a nominated Majlis-e-Shura (1981): a consultative council of loyal notables and scholars instead of elected deputies."
 GEN_1970_cal_the_bait_al_mal: "The Bait al-Mal"
 GEN_1970_cal_the_bait_al_mal_desc: "Islamising states promised a treasury run on Islamic principles, on the model of the early bait al-mal, and an end to the corruption of the old order."
 GEN_1970_cal_sharia_courts: "Sharia Courts"
 GEN_1970_cal_sharia_courts_desc: "Pakistan's Federal Shariat Court (1980) and Sudan's emergency \"decisive justice\" courts (1983-84) gave religious law priority over civil law; the regimes gained authority while legal and academic debate narrowed."
 GEN_1970_cal_the_holy_war: "The Holy War"
 GEN_1970_cal_the_holy_war_desc: "Some regimes ruled through permanent mobilisation instead of courts, framing every policy as a struggle for the faith; the barracks grew and the shops emptied."
 GEN_1970_cal_zakat_and_ushr: "Zakat and Ushr"
 GEN_1970_cal_zakat_and_ushr_desc: "Pakistan's Zakat and Ushr Ordinance (1980) deducted 2.5 % from bank savings and a tithe on harvests to fund welfare; landowners and savers paid."
 GEN_1970_cal_abolish_riba: "Abolish Riba"
 GEN_1970_cal_abolish_riba_desc: "Pakistan (from 1981) and Sudan (1984) began moving banking to interest-free profit sharing; Gulf-backed Islamic banks welcomed it, Western lenders grew wary."
 GEN_1970_cal_religious_administration: "Religious Administration"
 GEN_1970_cal_religious_administration_desc: "A ministry of religious affairs and endowments (awqaf) and Pakistan's Council of Islamic Ideology brought religious scholars into the administration of the state."
 GEN_1970_cal_foreign_volunteers: "Foreign Volunteers"
 GEN_1970_cal_foreign_volunteers_desc: "The Afghan war drew thousands of volunteers through Peshawar's service bureaus in the 1980s; they brought fighters and zeal, and foreign suspicion."
 GEN_1970_cal_village_zakat_committees: "Village Zakat Committees"
 GEN_1970_cal_village_zakat_committees_desc: "Pakistan created tens of thousands of local zakat committees that paid widows, orphans and students; the tithe on harvests funded village works."
 GEN_1970_cal_profit_and_loss_sharing: "Profit-and-Loss Sharing"
 GEN_1970_cal_profit_and_loss_sharing_desc: "Interest-free banks financed trade through mudaraba and musharaka partnerships; the first Islamic banks of the late 1970s grew fast on pious savings."
 GEN_1970_cal_the_oath_of_allegiance: "The Oath of Allegiance"
 GEN_1970_cal_the_oath_of_allegiance_desc: "Rulers claiming religious authority expected the bay'ah, the oath of allegiance: Nimeiry styled himself imam in 1984, and Pakistan banned all political parties from 1979 to 1985."
 GEN_1970_cal_the_just_economy: "The Just Economy"
 GEN_1970_cal_the_just_economy_desc: "The regime's economists promised a third way between capitalism and socialism, an economy of justice rather than growth."
 GEN_1970_cal_islamise_the_schools: "Islamise the Schools"
 GEN_1970_cal_islamise_the_schools_desc: "Zia's education policy Islamised curricula and channelled zakat money to a fast-growing madrasa sector in the 1980s, while science teaching lost ground."
 GEN_1970_cal_gradual_islamisation: "Gradual Islamisation"
 GEN_1970_cal_gradual_islamisation_desc: "Zia kept civil courts, technocrats and the business class alongside the new religious institutions; stricter Islamists criticised the compromise, and the economy kept growing."
 GEN_1970_cal_gulf_patronage: "Gulf Patronage"
 GEN_1970_cal_gulf_patronage_desc: "Saudi and Gulf money helped fund Pakistan's madrasas and the Afghan resistance in the 1980s, and Gulf preachers came with it."
 GEN_1970_cal_revolutionary_self_reliance: "Revolutionary Self-Reliance"
 GEN_1970_cal_revolutionary_self_reliance_desc: "Libya after 1969 expelled foreign bases, nationalised oil and declared an Islamic third way; independence came with isolation and sanctions."
 GEN_1970_cal_a_society_of_believers: "A Society of Believers"
 GEN_1970_cal_a_society_of_believers_desc: "Within a decade the Islamising states had reshaped public life: prayer at work, religious broadcasting and new laws on family and morals."
 GEN_1970_cal_the_army_of_the_faithful: "The Army of the Faithful"
 GEN_1970_cal_the_army_of_the_faithful_desc: "Islamising regimes put chaplains, prayer and religious instruction into the army; Zia made the Pakistani army the guardian of the ideology of the state."
 GEN_1970_cal_the_unbroken_banner: "The Unbroken Banner"
 GEN_1970_cal_the_unbroken_banner_desc: "The ideological state at its height: a single law, a single banner and a population mobilised for it, admired by its followers and isolated abroad."
 # Non-Aligned outlook
 GEN_1970_champion_non_aligned: "Champion the Third Way"
 GEN_1970_champion_non_aligned_desc: "The Lusaka summit (1970), attended by more than fifty states, revived the movement founded by Tito, Nasser and Nehru and made its summits a regular forum for countries that refused to choose between the blocs."
 GEN_1970_the_spirit_of_bandung: "The Spirit of Bandung"
 GEN_1970_the_spirit_of_bandung_desc: "Bandung (1955) and the Algiers summit (1973) made non-alignment a diplomacy of conferences and joint demands; delegations, embassies and summits cost money, while both blocs offered aid to win the members over."
 GEN_1970_neutral_media: "Neutral Media"
 GEN_1970_neutral_media_desc: "The Non-Aligned News Agencies Pool (1975, coordinated by Tanjug) and the call for a New World Information Order sought to end dependence on Western news agencies; Western governments and press groups attacked it as a licence for state control."
 GEN_1970_the_nonaligned_majority: "The Nonaligned Majority"
 GEN_1970_the_nonaligned_majority_desc: "By the mid-1970s non-aligned states held a majority in the UN General Assembly and, with the Group of 77, pushed through the 1974 declaration on a New International Economic Order over Western objections."
 GEN_1970_a_non_aligned_government: "A Non-Aligned Government"
 GEN_1970_a_non_aligned_government_desc: "Yugoslavia, India and Indonesia turned non-alignment, and Finland and Austria neutrality, from a slogan into an organising principle of the state."
 # mb
 GEN_1970_mb_islamic_democracy: "Islamic Democracy"
 GEN_1970_mb_islamic_democracy_desc: "Brotherhood movements argued that Islam and elections were compatible; where they could stand, as in Jordan or Kuwait, they won seats."
 GEN_1970_mb_the_guidance_office: "The Guidance Office"
 GEN_1970_mb_the_guidance_office_desc: "The Brotherhood was run by its Guidance Office under the General Guide; in power, the movement's leadership sat beside the cabinet."
 GEN_1970_mb_islamic_economics: "An Islamic Economic Programme"
 GEN_1970_mb_islamic_economics_desc: "The first International Conference on Islamic Economics (Mecca, 1976) gave the Islamic movement an economic vocabulary of zakat, honest trade and interest-free finance."
 GEN_1970_mb_parliamentary_islam: "Parliamentary Islam"
 GEN_1970_mb_parliamentary_islam_desc: "Jordan's Brotherhood worked within the parliamentary order and won 22 of 80 seats in 1989; coalition politics brought legitimacy and slow decisions."
 GEN_1970_mb_the_tanzim: "The Tanzim"
 GEN_1970_mb_the_tanzim_desc: "Turabi's Islamic movement (from 1985 the National Islamic Front) built a disciplined organisation inside the Sudanese state after 1977; it worked, and the officers distrusted it."
 GEN_1970_mb_charity_and_grassroots: "Charity and Grassroots"
 GEN_1970_mb_charity_and_grassroots_desc: "Brotherhood clinics, schools and relief committees reached the poor quarters faster than the state; it cost money and earned loyalty."
 GEN_1970_mb_islamic_banking: "Islamic Banking"
 GEN_1970_mb_islamic_banking_desc: "Faisal Islamic Bank (Egypt and Sudan, 1977) collected the savings of the pious and of migrant workers in the Gulf; conventional banks lost deposits."
 GEN_1970_mb_the_islamic_alliance: "The Islamic Alliance"
 GEN_1970_mb_the_islamic_alliance_desc: "In 1987 the Egyptian Brotherhood ran in an Islamic Alliance with the Labour and Liberal parties and became the largest opposition bloc."
 GEN_1970_mb_cadres_in_the_ministries: "Cadres in the Ministries"
 GEN_1970_mb_cadres_in_the_ministries_desc: "Sudanese Islamists took posts in the judiciary, the Islamic banks and the civil service in the early 1980s; the network ran the state, and patronage followed."
 GEN_1970_mb_mosque_schools: "Mosque Schools"
 GEN_1970_mb_mosque_schools_desc: "Community schools and literacy classes attached to mosques spread in the 1970s and 1980s, teaching reading and carrying the movement's message."
 GEN_1970_mb_the_pious_merchants: "The Pious Merchants"
 GEN_1970_mb_the_pious_merchants_desc: "Islamic investment companies and merchant networks financed workshops, trade and housing with the savings of the faithful."
 GEN_1970_mb_reconciliation_with_the_state: "Reconciliation with the State"
 GEN_1970_mb_reconciliation_with_the_state_desc: "Sadat's releases (1971-75) and Nimeiry's national reconciliation (1977) ended years of persecution: for a time, the movement and the state made peace."
 GEN_1970_mb_islamic_finance_houses: "Islamic Finance Houses"
 GEN_1970_mb_islamic_finance_houses_desc: "By the early 1980s Islamic banks and finance houses were a sector of their own from Khartoum to Kuala Lumpur."
 GEN_1970_mb_public_morality_laws: "Public Morality Laws"
 GEN_1970_mb_public_morality_laws_desc: "Islamists in parliament pressed for bans on alcohol and stricter dress rules, as in Kuwait and in Egypt's sharia debates of the late 1970s; tourism and business interests resisted."
 GEN_1970_mb_win_the_syndicates: "Win the Syndicates"
 GEN_1970_mb_win_the_syndicates_desc: "Islamist doctors, engineers and lawyers took over Egypt's professional syndicates in the 1980s, and ABIM organised Malaysia's graduates: a modern, educated Islam."
 GEN_1970_mb_gulf_remittances: "Gulf Remittances"
 GEN_1970_mb_gulf_remittances_desc: "Millions of Egyptians, Sudanese and Jordanians worked in the Gulf after 1973; their remittances and Gulf donors helped fund the movement, and brought Gulf influence."
 GEN_1970_mb_the_islamic_conference: "The Islamic Conference"
 GEN_1970_mb_the_islamic_conference_desc: "Through the Organisation of the Islamic Conference (1969) governments could mediate between Muslim states and stay outside both blocs; the generals found it soft."
 GEN_1970_mb_the_student_generation: "The Student Generation"
 GEN_1970_mb_the_student_generation_desc: "The Islamic student associations of the 1970s produced a generation of pious professionals who carried the movement into the middle class."
 GEN_1970_mb_the_brotherhood_abroad: "The Brotherhood Abroad"
 GEN_1970_mb_the_brotherhood_abroad_desc: "The movement's international organisation, formalised in 1982, linked branches across the Arab world, Europe and Asia."
 GEN_1970_mb_the_islamic_middle_way: "The Islamic Middle Way"
 GEN_1970_mb_the_islamic_middle_way_desc: "The movement's thinkers called it wasatiyya, the middle way between secularism and extremism: a pious, prosperous and electoral Islam."
 # na
 GEN_1970_na_the_strongman: "The Strongman"
 GEN_1970_na_the_strongman_desc: "Ne Win (1962), Mobutu (1965) and Suharto (1966-67) took power in non-aligned states and made their own office the only centre of power, backed by the army and the secret service."
 GEN_1970_na_the_presidential_palace: "The Presidential Palace"
 GEN_1970_na_the_presidential_palace_desc: "Mobutu's single party (MPR, 1967) and Ne Win's Revolutionary Council (1962) concentrated every decision around the leader; ministers served at his pleasure."
 GEN_1970_na_the_presidential_economy: "The Presidential Economy"
 GEN_1970_na_the_presidential_economy_desc: "Strongmen ran the economy through state firms answerable to the palace: Pertamina under Ibnu Sutowo, Gécamines in Zaire, the Burmese state corporations."
 GEN_1970_na_personal_rule: "Personal Rule"
 GEN_1970_na_personal_rule_desc: "Mobutu renamed the country Zaire (1971) and himself Mobutu Sese Seko (1972), and his image opened the television news; the cult bound the nation to one man, while the patronage behind it hollowed out the state."
 GEN_1970_na_institutionalise_the_regime: "Institutionalise the Regime"
 GEN_1970_na_institutionalise_the_regime_desc: "Yugoslavia's 1974 constitution set up a collective presidency and federal checks to take over after Tito; Franco's Organic Law of the State (1967) likewise laid down institutions meant to outlast him in Spain."
 GEN_1970_na_take_over_foreign_firms: "Take Over the Foreign Firms"
 GEN_1970_na_take_over_foreign_firms_desc: "Zairianisation (1973) and Nigeria's Indigenisation Decree (1972) transferred foreign-owned firms or shares to nationals: a windfall for the regimes' clients, but foreign investors grew wary."
 GEN_1970_na_aid_from_both_blocs: "Aid From Both Blocs"
 GEN_1970_na_aid_from_both_blocs_desc: "Suharto's IGGI consortium (1967) brought Western credit, while Tito drew IMF loans and Soviet trade at the same time; both regimes financed growth with borrowed money."
 GEN_1970_na_the_secret_police: "The Secret Police"
 GEN_1970_na_the_secret_police_desc: "Yugoslavia's UDBA, Zaire's CND, Burma's Military Intelligence Service and Indonesia's Kopkamtib watched and detained opponents, and the UDBA also pursued émigrés abroad; student politics was curbed."
 GEN_1970_na_organic_democracy: "Organic Democracy"
 GEN_1970_na_organic_democracy_desc: "Franco's Cortes were chosen through family, municipality and syndicate; Suharto's Golkar, which won the 1971 election, organised civil servants, farmers and workers as \"functional groups\" instead of parties."
 GEN_1970_na_firms_for_the_loyal: "Firms for the Loyal"
 GEN_1970_na_firms_for_the_loyal_desc: "In Zaire the \"acquéreurs\" of the zairianised firms were mostly politicians, officers and regime insiders; many businesses soon failed, and from 1976 part of them was handed back to the former owners."
 GEN_1970_na_the_development_consortium: "The Development Consortium"
 GEN_1970_na_the_development_consortium_desc: "IGGI and World Bank credit financed Indonesia's Repelita plans from 1969: roads, ports, irrigation and fertiliser plants."
 GEN_1970_na_the_single_movement: "The Single Movement"
 GEN_1970_na_the_single_movement_desc: "Burma's 1974 one-party constitution, Zaire's MPR and Indonesia's Golkar folded unions, youth and women's groups into one regime movement, while the old parties were banned or, in Indonesia (1973), forced to merge."
 GEN_1970_na_the_presidential_fund: "The Presidential Fund"
 GEN_1970_na_the_presidential_fund_desc: "Indonesia's presidential instruction (Inpres) programmes, such as the primary-school drive of 1973, let the palace pay directly for schools, markets and clinics – and take the credit for them."
 GEN_1970_na_emergency_rule: "Emergency Rule"
 GEN_1970_na_emergency_rule_desc: "India's Emergency (1975-77) postponed elections and suspended civil liberties in the name of order; the jailed opposition united as the Janata Party and defeated the government in 1977."
 GEN_1970_na_the_national_ideology: "The National Ideology"
 GEN_1970_na_the_national_ideology_desc: "Indonesia's P4 courses (1978) made civil servants and students study Pancasila; Mobutism and the \"Burmese Way to Socialism\" were taught the same way."
 GEN_1970_na_playing_the_blocs: "Playing the Blocs"
 GEN_1970_na_playing_the_blocs_desc: "Yugoslavia flew American and then Soviet jets, and Mobutu was courted by Washington, Paris and Beijing at once: non-aligned strongmen took support from several sides and let foreign advisers in."
 GEN_1970_na_the_presidential_guard: "The Presidential Guard"
 GEN_1970_na_the_presidential_guard_desc: "Mobutu's Division Spéciale Présidentielle (1985) and Syria's Defence Companies under Rifaat al-Assad (1971) were elite forces armed and paid by the regime, separate from the regular army."
 GEN_1970_na_loyal_governors: "Loyal Governors"
 GEN_1970_na_loyal_governors_desc: "Strongmen put officers and loyalists in charge of the provinces: military governors in Suharto's Indonesia, Mobutu's appointed regional commissioners, Ne Win's Security and Administrative Committees."
 GEN_1970_na_arms_from_every_supplier: "Arms From Every Supplier"
 GEN_1970_na_arms_from_every_supplier_desc: "Yugoslavia and India flew Soviet MiG-21s alongside licence-built French helicopters (Gazelle, Alouette III) and used rival offers to bargain over price and licences."
 GEN_1970_na_the_balancing_act: "The Balancing Act"
 GEN_1970_na_the_balancing_act_desc: "Tito, a founder of the Non-Aligned Movement, took credits from both Washington and Moscow; Mobutu and Suharto stayed in power for over three decades by making themselves useful to outside patrons."
 # ncon
 GEN_1970_ncon_conservative_neutrality: "Conservative Neutrality"
 GEN_1970_ncon_conservative_neutrality_desc: "Switzerland and, after the 1955 State Treaty, Austria made permanent neutrality the core of national identity and a foundation of their economic success."
 GEN_1970_ncon_the_consensus_cabinet: "The Consensus Cabinet"
 GEN_1970_ncon_the_consensus_cabinet_desc: "Switzerland's \"magic formula\" (1959) gave all four large parties seats in the Federal Council: consensus at home matched neutrality abroad."
 GEN_1970_ncon_sound_money: "Sound Money"
 GEN_1970_ncon_sound_money_desc: "The Swiss franc and the Austrian schilling (hard-currency policy from the 1970s) kept inflation below that of most of Western Europe through the oil shocks."
 GEN_1970_ncon_total_defence: "Total Defence"
 GEN_1970_ncon_total_defence_desc: "Sweden's totalförsvar and the Swiss militia army, planned to mobilise some 600,000 men within 48 hours, were meant to make an invasion too costly for either bloc."
 GEN_1970_ncon_the_neutral_mediator: "The Neutral Mediator"
 GEN_1970_ncon_the_neutral_mediator_desc: "Finland hosted the CSCE in Helsinki (1975), Austria built the UN City in Vienna (1979) and Switzerland offered its good offices: neutrality as a service both blocs needed."
 GEN_1970_ncon_the_low_tax_state: "The Low-Tax State"
 GEN_1970_ncon_the_low_tax_state_desc: "Low-tax Swiss cantons such as Zug offered privileged rates to holding and domicile companies and drew in multinationals and commodity traders in the 1960s and 1970s."
 GEN_1970_ncon_the_social_partners: "The Social Partners"
 GEN_1970_ncon_the_social_partners_desc: "Austria's Parity Commission (1957) negotiated wages and prices, and the Swiss labour peace agreement (1937) replaced strikes with bargaining: almost no strikes in the 1970s, bought with costly social compromises."
 GEN_1970_ncon_civil_defence_shelters: "Civil Defence Shelters"
 GEN_1970_ncon_civil_defence_shelters_desc: "The Swiss shelter law of 1963 required shelters in new buildings, with the goal of a protected place for every resident; construction peaked in the mid-1970s at up to 400,000 places a year."
 GEN_1970_ncon_a_neutral_banking_centre: "A Neutral Banking Centre"
 GEN_1970_ncon_a_neutral_banking_centre_desc: "Banking secrecy (Swiss law of 1934) and neutrality made Zurich, Geneva and Vienna havens for capital from both blocs and the Third World, including flight capital and illicit funds."
 GEN_1970_ncon_holding_companies: "Holding Companies and Trading Houses"
 GEN_1970_ncon_holding_companies_desc: "Commodity traders and holding companies settled in low-tax neutral states in the 1970s (Marc Rich + Co. in Zug, 1974), paying their taxes there but bringing foreign interests with them."
 GEN_1970_ncon_precision_industry: "Precision Industry"
 GEN_1970_ncon_precision_industry_desc: "Swiss machine tools, Swedish engineering (ASEA, SKF) and Austria's VOEST thrived on stable wages and long-term planning."
 GEN_1970_ncon_credible_neutrality: "Credible Neutrality"
 GEN_1970_ncon_credible_neutrality_desc: "Swedish and Swiss doctrine held that neutrality was only credible if it was armed and economically independent; both blocs had to believe it."
 GEN_1970_ncon_quiet_prosperity: "Quiet Prosperity"
 GEN_1970_ncon_quiet_prosperity_desc: "Neutral Switzerland and Sweden had some of the highest incomes in Europe in the 1970s, and Austria was catching up fast."
 GEN_1970_ncon_limit_foreign_workers: "Limit Foreign Workers"
 GEN_1970_ncon_limit_foreign_workers_desc: "The Schwarzenbach initiative against \"over-foreignisation\" won 46 % of the vote in 1970; the Federal Council had capped foreign labour with national quotas that year, and employers had to recruit fewer workers."
 GEN_1970_ncon_integrate_the_guest_workers: "Integrate the Guest Workers"
 GEN_1970_ncon_integrate_the_guest_workers_desc: "Sweden's 1975 immigrant policy gave foreign residents language courses and, from 1976, the vote in local elections; employers kept the labour they needed, and an anti-immigration group, Keep Sweden Swedish, formed in 1979."
 GEN_1970_ncon_free_trade_with_the_community: "Free Trade With the Community"
 GEN_1970_ncon_free_trade_with_the_community_desc: "Austria, Switzerland, Sweden and Finland signed free-trade agreements with the EEC in 1972-73 without joining it, and tied their markets to the West."
 GEN_1970_ncon_clearing_trade_with_the_east: "Clearing Trade With the East"
 GEN_1970_ncon_clearing_trade_with_the_east_desc: "Finland's bilateral clearing trade with the USSR swapped ships and machinery for Soviet oil and cushioned the 1973 oil shock – at the price of Soviet influence (\"Finlandisation\")."
 GEN_1970_ncon_the_referendum_democracy: "The Referendum Democracy"
 GEN_1970_ncon_the_referendum_democracy_desc: "Swiss voters decided the big questions by referendum – women's suffrage in 1971, the foreign-worker initiatives – which bound every camp to the result."
 GEN_1970_ncon_a_neutral_arms_industry: "A Neutral Arms Industry"
 GEN_1970_ncon_a_neutral_arms_industry_desc: "A neutral state could not rely on allied arsenals: Sweden built the Saab Viggen, Switzerland its own tanks and Oerlikon guns, Austria its Steyr vehicles."
 GEN_1970_ncon_a_neutral_fortress: "A Neutral Fortress"
 GEN_1970_ncon_a_neutral_fortress_desc: "By the late 1970s Switzerland and Sweden were the models of armed neutrality: rich, stable, defended by the whole nation and taken seriously by both blocs."
 # oli
 GEN_1970_oli_rule_of_the_notables: "Rule of the Notables"
 GEN_1970_oli_rule_of_the_notables_desc: "In much of Central America, in Lebanon and in the Philippines a few dozen landed and merchant families dominated 1970s politics through their own parties and networks of patrons."
 GEN_1970_oli_the_great_families: "The Great Families"
 GEN_1970_oli_the_great_families_desc: "El Salvador's \"fourteen families\", the Somozas in Nicaragua, a handful of zu'ama in Lebanon: politics was the business of a few houses."
 GEN_1970_oli_the_merchant_houses: "The Merchant Houses"
 GEN_1970_oli_the_merchant_houses_desc: "A few trading families controlled imports, exports and banking in the Gulf, Lebanon and Central America, and governments depended on their goodwill."
 GEN_1970_oli_the_pact_of_families: "The Pact of Families"
 GEN_1970_oli_the_pact_of_families_desc: "Lebanon's National Pact (1943) divided offices among the confessional elites and Colombia's Sitges agreement (1957) between the two traditional parties: peace among the notables, but every decision needed all of them."
 GEN_1970_oli_the_ruling_dynasty: "The Ruling Dynasty"
 GEN_1970_oli_the_ruling_dynasty_desc: "The Somozas ruled Nicaragua from 1936 to 1979 like a family firm: one house held the presidency, the National Guard and a large share of the country's land and industry."
 GEN_1970_oli_crony_capitalism: "Crony Capitalism"
 GEN_1970_oli_crony_capitalism_desc: "In Marcos's Philippines state contracts, cheap credit and trading monopolies went to presidential cronies such as Eduardo Cojuangco (coconuts, later San Miguel beer) and Roberto Benedicto (sugar)."
 GEN_1970_oli_the_landed_interest: "The Landed Interest"
 GEN_1970_oli_the_landed_interest_desc: "Coffee, sugar and cotton planters dominated Central American states; export taxes on the estates funded the state, while landless peasants worked them for low wages."
 GEN_1970_oli_alternating_presidency: "Alternating Presidency"
 GEN_1970_oli_alternating_presidency_desc: "Colombia's National Front (1958-74) alternated the presidency between Liberals and Conservatives and split every office between them: it ended the partisan Violencia, but shut out other movements, some of which took up arms."
 GEN_1970_oli_the_family_guard: "The Family Guard"
 GEN_1970_oli_the_family_guard_desc: "Nicaragua's Guardia Nacional was commanded by the Somoza family itself and served the dynasty rather than the state."
 GEN_1970_oli_the_family_firms: "The Family Firms"
 GEN_1970_oli_the_family_firms_desc: "The Somozas, the Philippine Ayala and Lopez clans and Lebanese merchant houses turned land and trade fortunes into banks, utilities, property and industry."
 GEN_1970_oli_plantation_exports: "Plantation Exports"
 GEN_1970_oli_plantation_exports_desc: "Coffee, bananas, cotton and sugar earned most of Central America's export income in the 1970s, as sugar and coconut products did much of the Philippines'; the estate owners carried decisive political weight."
 GEN_1970_oli_the_club_of_notables: "The Club of Notables"
 GEN_1970_oli_the_club_of_notables_desc: "In El Salvador the coffee growers' associations and in Argentina the landowners' Sociedad Rural shaped economic policy, often more than parliament did."
 GEN_1970_oli_the_commodity_boom: "The Commodity Boom"
 GEN_1970_oli_the_commodity_boom_desc: "The commodity boom of 1973-77 (sugar in 1974, coffee in 1976) filled the treasuries of the oligarchic states – for a while."
 GEN_1970_oli_a_controlled_land_reform: "A Controlled Land Reform"
 GEN_1970_oli_a_controlled_land_reform_desc: "The Philippine land reform of 1972 (PD 27) covered only tenanted rice and corn land and spared the sugar and coconut estates: it gave some tenants land and angered the rice and corn landlords."
 GEN_1970_oli_the_rural_militias: "The Rural Militias"
 GEN_1970_oli_the_rural_militias_desc: "El Salvador's ORDEN and the Philippine Civilian Home Defence Forces (1976) armed loyal villagers against peasant organisers and rebels; their abuses fed the insurgencies that followed."
 GEN_1970_oli_friends_in_washington: "Friends in Washington"
 GEN_1970_oli_friends_in_washington_desc: "The Somozas and Central American planters relied on American aid, investors and the embassy's goodwill; the embassy expected to be heard in return."
 GEN_1970_oli_trade_with_all_comers: "Trade With All Comers"
 GEN_1970_oli_trade_with_all_comers_desc: "Merchant oligarchies sold to whoever paid: Argentine grain went to the USSR during the 1980 US embargo, Lebanese and Gulf houses traded with both blocs."
 GEN_1970_oli_patrons_and_clients: "Patrons and Clients"
 GEN_1970_oli_patrons_and_clients_desc: "In Lebanon, the Philippines and Central America oligarchic rule rested on clientelism: the patron found jobs, loans and doctors for his clients, and they voted as he told them."
 GEN_1970_oli_offshore_fortunes: "Offshore Fortunes"
 GEN_1970_oli_offshore_fortunes_desc: "Oligarch families kept their fortunes in Miami, Geneva and Panama; the connections brought foreign banks and cheap credit home."
 GEN_1970_oli_the_oligarchic_order: "The Oligarchic Order"
 GEN_1970_oli_the_oligarchic_order_desc: "At its height the oligarchic order looked unshakeable: the families held the land, the banks, the army and the vote – until the Sandinista revolution in Nicaragua and the coup and civil war in El Salvador (1979-80)."
 # nlib
 GEN_1970_nlib_the_minimal_state: "The Minimal State"
 GEN_1970_nlib_the_minimal_state_desc: "Hong Kong's Financial Secretary John Cowperthwaite (1961-71) kept the state small: low spending, no industrial subsidies or industrial policy, and minimal social welfare."
 GEN_1970_nlib_the_clean_government_commission: "The Clean Government Commission"
 GEN_1970_nlib_the_clean_government_commission_desc: "Hong Kong's Independent Commission Against Corruption (1974) broke up the police corruption syndicates within a few years; a small state depends on clean officials."
 GEN_1970_nlib_positive_non_interventionism: "Positive Non-Interventionism"
 GEN_1970_nlib_positive_non_interventionism_desc: "Financial Secretary Haddon-Cave (1971-81) called Hong Kong's doctrine \"positive non-interventionism\": the state set the framework and stayed out of the market unless intervention was clearly justified."
 GEN_1970_nlib_government_by_experts: "Government by Experts"
 GEN_1970_nlib_government_by_experts_desc: "Colonial Hong Kong was run by appointed administrators, and Singapore by a technocratic cabinet facing no opposition in parliament (1968-81); decisions came fast, but the public had little say in them."
 GEN_1970_nlib_constitutional_limits: "Constitutional Limits"
 GEN_1970_nlib_constitutional_limits_desc: "Classical liberals from Hayek (The Constitution of Liberty, 1960) to the US tax revolt (California's Proposition 13, 1978) wanted firm limits on taxing and spending; investors trusted the rules, the government lost room to act."
 GEN_1970_nlib_a_flat_tax: "A Flat Tax"
 GEN_1970_nlib_a_flat_tax_desc: "Hong Kong's standard tax rate of about 15 % on salaries and profits drew firms and capital from across the region, but left the treasury with less to spend."
 GEN_1970_nlib_privatise_state_enterprises: "Privatise State Enterprises"
 GEN_1970_nlib_privatise_state_enterprises_desc: "Between 1974 and 1978 Chile returned or sold most of the firms taken over under Allende, raising revenue while the unions, already curbed by the junta, lost their strongest workplaces."
 GEN_1970_nlib_administrative_absorption: "Administrative Absorption"
 GEN_1970_nlib_administrative_absorption_desc: "Hong Kong co-opted business and community leaders into hundreds of advisory boards instead of holding general elections (the \"administrative absorption of politics\", Ambrose King 1975)."
 GEN_1970_nlib_a_balanced_budget_rule: "A Balanced-Budget Rule"
 GEN_1970_nlib_a_balanced_budget_rule_desc: "Hong Kong held the growth of public spending to the growth of the economy, and the 1970s American campaign for a balanced-budget amendment sought to write such a rule into the constitution."
 GEN_1970_nlib_free_enterprise_zones: "Free Enterprise Zones"
 GEN_1970_nlib_free_enterprise_zones_desc: "Ireland's Shannon Free Zone (1959), Taiwan's Kaohsiung zone (1966) and South Korea's Masan (1970) drew foreign assemblers with tax holidays and duty-free ports, tying the economy to world demand."
 GEN_1970_nlib_sell_the_state_railways: "Sell the State Railways"
 GEN_1970_nlib_sell_the_state_railways_desc: "Chile deregulated road transport and port labour from the late 1970s and sold its electricity and telephone companies in 1985-89; Japan broke up and privatised its national railways in 1987."
 GEN_1970_nlib_the_night_watchman_state: "The Night-Watchman State"
 GEN_1970_nlib_the_night_watchman_state_desc: "Robert Nozick's Anarchy, State, and Utopia (1974) gave the minimal state its manifesto: courts, police and defence, and little else."
 GEN_1970_nlib_capital_without_borders: "Capital Without Borders"
 GEN_1970_nlib_capital_without_borders_desc: "Hong Kong dropped its exchange controls in the early 1970s and Britain abolished its own in 1979: capital flowed in freely, and out again whenever the world market turned."
 GEN_1970_nlib_vouchers_and_private_clinics: "Vouchers and Private Clinics"
 GEN_1970_nlib_vouchers_and_private_clinics_desc: "Milton Friedman proposed school vouchers in 1955, and Chile introduced vouchers and private health insurers (ISAPREs) in 1980-81: public spending fell, and critics pointed to a widening gap between rich and poor."
 GEN_1970_nlib_a_negative_income_tax: "A Negative Income Tax"
 GEN_1970_nlib_a_negative_income_tax_desc: "Friedman's negative income tax (1962) proposed replacing welfare offices with one cash payment; the US tested it in New Jersey (1968-72) and in Seattle and Denver during the 1970s."
 GEN_1970_nlib_a_port_for_every_flag: "A Port for Every Flag"
 GEN_1970_nlib_a_port_for_every_flag_desc: "Hong Kong and Singapore traded with both Cold War camps at once, from Western banks to Chinese and Soviet shipping, and felt every swing in world trade first."
 GEN_1970_nlib_offshore_banking_haven: "Offshore Banking Haven"
 GEN_1970_nlib_offshore_banking_haven_desc: "Beirut until 1975 and the Bahamas, the Cayman Islands and Luxembourg prospered on bank secrecy and low taxes; foreign money also brought foreign influence and illicit funds."
 GEN_1970_nlib_a_society_of_self_help: "A Society of Self-Help"
 GEN_1970_nlib_a_society_of_self_help_desc: "Hong Kong's kaifong neighbourhood associations, clan societies and charities such as the Tung Wah hospitals carried much of the social work into the 1970s, with limited help from the state."
 GEN_1970_nlib_an_all_volunteer_force: "An All-Volunteer Force"
 GEN_1970_nlib_an_all_volunteer_force_desc: "The Gates Commission (1970), with Milton Friedman as a member, recommended ending the US draft, which stopped in 1973: a smaller, professional force replaced the conscripts."
 GEN_1970_nlib_the_free_society: "The Free Society"
 GEN_1970_nlib_the_free_society_desc: "Hayek (Nobel 1974) and Friedman (Nobel 1976) gave free-market ideas new prestige, and Hong Kong's economy grew by about 9 % a year in real terms through the 1970s."
 # gr
 GEN_1970_gr_the_limits_to_growth: "The Limits to Growth"
 GEN_1970_gr_the_limits_to_growth_desc: "The Club of Rome's report (1972) sold millions of copies and turned \"limits to growth\" into a political programme; economists and industry attacked its forecasts from the start."
 GEN_1970_gr_the_citizens_initiatives: "The Citizens' Initiatives"
 GEN_1970_gr_the_citizens_initiatives_desc: "West Germany counted thousands of local citizens' initiatives (Bürgerinitiativen) by the mid-1970s, from Wyhl to Brokdorf; the green parties grew out of them."
 GEN_1970_gr_the_polluter_pays: "The Polluter Pays"
 GEN_1970_gr_the_polluter_pays_desc: "The OECD adopted the polluter-pays principle in 1972, and Dutch (1970) and West German (1976) water-pollution levies made industry pay for its discharges while funding the clean-up."
 GEN_1970_gr_grassroots_democracy: "Grassroots Democracy"
 GEN_1970_gr_grassroots_democracy_desc: "The early West German Greens rotated their Bundestag deputies (from 1983), bound them to the party base and decided in open assemblies; the base trusted them, but decisions were slow."
 GEN_1970_gr_the_realist_wing: "The Realist Wing"
 GEN_1970_gr_the_realist_wing_desc: "The \"Realos\" around Joschka Fischer accepted ministries and coalitions (Hesse 1985) to get results, at the cost of bitter conflict with the party's radical wing."
 GEN_1970_gr_conservation_laws: "Conservation Laws"
 GEN_1970_gr_conservation_laws_desc: "Clean air and water laws (US 1970-72, Japan's \"Pollution Diet\" of 1970) protected health and farmland but slowed approval of new factories and dams."
 GEN_1970_gr_a_nuclear_free_future: "A Nuclear-Free Future"
 GEN_1970_gr_a_nuclear_free_future_desc: "After Wyhl (1975) and Zwentendorf (1978) the anti-nuclear movement became central to green politics; it bet on water, sun and wind instead of the atom."
 GEN_1970_gr_the_people_decide: "The People Decide"
 GEN_1970_gr_the_people_decide_desc: "Austria's Zwentendorf referendum (1978) stopped a finished nuclear plant, and Sweden voted on nuclear power in 1980: citizens could overrule government and industry."
 GEN_1970_gr_a_ministry_for_the_environment: "A Ministry for the Environment"
 GEN_1970_gr_a_ministry_for_the_environment_desc: "Britain (1970), Japan (1971) and West Germany's Federal Environment Agency (1974) gave the environment its own ministry or agency, with real powers and a new bureaucracy."
 GEN_1970_gr_protected_landscapes: "Protected Landscapes"
 GEN_1970_gr_protected_landscapes_desc: "India's Chipko movement (1973) defended village forests against commercial logging, Project Tiger (1973) created protected reserves, and the Forest Conservation Act (1980) curbed the clearing of forest land."
 GEN_1970_gr_small_is_beautiful: "Small Is Beautiful"
 GEN_1970_gr_small_is_beautiful_desc: "Schumacher's Small Is Beautiful (1973) and his Intermediate Technology group promoted small workshops and village power instead of giant plants."
 GEN_1970_gr_spaceship_earth: "Spaceship Earth"
 GEN_1970_gr_spaceship_earth_desc: "Boulding's \"spaceship earth\" (1966), the first Earth Day (1970) and the UN Stockholm conference (1972) put ecology into schools and newspapers."
 GEN_1970_gr_the_soft_energy_path: "The Soft Energy Path"
 GEN_1970_gr_the_soft_energy_path_desc: "Amory Lovins' \"soft energy path\" (1976) answered the oil shock with efficiency and renewables instead of new oil and nuclear plants."
 GEN_1970_gr_civilian_based_defence: "Civilian-Based Defence"
 GEN_1970_gr_civilian_based_defence_desc: "Gene Sharp's The Politics of Nonviolent Action (1973) inspired plans for defence by strikes and non-cooperation; the Danish, Dutch and Swedish governments commissioned studies of the idea."
 GEN_1970_gr_non_offensive_defence: "Non-Offensive Defence"
 GEN_1970_gr_non_offensive_defence_desc: "Horst Afheldt's \"defensive defence\" (1976) wanted an army that could hold its own ground but threaten no one - dispersed light infantry with anti-tank weapons instead of tank divisions."
 GEN_1970_gr_a_nuclear_free_zone: "A Nuclear-Free Zone"
 GEN_1970_gr_a_nuclear_free_zone_desc: "Latin America's Tlatelolco treaty (1967) banned nuclear weapons from the region, and New Zealand's nuclear-free policy (1984) closed its ports to nuclear-armed ships, straining its alliance with the United States."
 GEN_1970_gr_fair_trade_and_development: "Fair Trade and Development"
 GEN_1970_gr_fair_trade_and_development_desc: "The first fair-trade shops (1969-73), the call for a New International Economic Order (1974) and the Brandt Report (1980) pressed for fairer trade and more aid for the South - paid from the budget."
 GEN_1970_gr_swords_into_ploughshares: "Swords into Ploughshares"
 GEN_1970_gr_swords_into_ploughshares_desc: "The \"Swords into Ploughshares\" badge of the East German church peace movement (1980-81) and the Euromissile protests (1981-83) brought millions onto the streets to demand disarmament and lower arms spending."
 GEN_1970_gr_the_green_international: "The Green International"
 GEN_1970_gr_the_green_international_desc: "European green parties coordinated from 1979 and formed the Rainbow Group in the European Parliament (1984), spreading ideas and contacts across borders."
 GEN_1970_gr_neither_growth_nor_bloc: "Neither Growth nor Bloc"
 GEN_1970_gr_neither_growth_nor_bloc_desc: "Herman Daly's Steady-State Economics (1977) gave the movement its economics, and Petra Kelly's West German Greens opposed the missiles of both blocs, protesting in East Berlin in 1983."
 # ns
 GEN_1970_ns_non_aligned_socialism: "Non-Aligned Socialism"
 GEN_1970_ns_non_aligned_socialism_desc: "The Arusha Declaration (1967) promised a socialism neither copied from Moscow nor from Beijing, built on self-reliance and social spending."
 GEN_1970_ns_the_socialist_charter: "The Socialist Charter"
 GEN_1970_ns_the_socialist_charter_desc: "Socialist charters such as Arusha (1967), Zambia's Mulungushi reforms (1968) and Guyana's Cooperative Republic (1970) turned party programmes into state doctrine."
 GEN_1970_ns_the_planning_commission: "The Planning Commission"
 GEN_1970_ns_the_planning_commission_desc: "India's Planning Commission (1950) and its five-year plans became a model for many non-aligned governments that wanted planning without Soviet control."
 GEN_1970_ns_the_one_party_state: "The One-Party State"
 GEN_1970_ns_the_one_party_state_desc: "Tanzania (1965) and Zambia (1972) made the ruling party the only legal one: power and unity were secured, open debate and private business shrank."
 GEN_1970_ns_the_popular_front: "The Popular Front"
 GEN_1970_ns_the_popular_front_desc: "Allende's Popular Unity (1970) and Sri Lanka's United Front (1970) governed as multi-party coalitions within parliamentary systems: broad alliances, constant bargaining."
 GEN_1970_ns_village_socialism: "Village Socialism"
 GEN_1970_ns_village_socialism_desc: "Tanzania's Ujamaa policy (1967-76) moved millions of peasants into planned villages with communal plots; schools and water came closer, but forced villagisation (1973-76) disrupted farm output."
 GEN_1970_ns_command_of_the_heights: "Command of the Heights"
 GEN_1970_ns_command_of_the_heights_desc: "India nationalised its 14 largest banks in 1969 and Sri Lanka its company-owned plantations in 1975: credit was steered to state priorities, and foreign investors held back."
 GEN_1970_ns_the_party_is_supreme: "The Party Is Supreme"
 GEN_1970_ns_the_party_is_supreme_desc: "Tanzania's 1975 amendment declared party supremacy over the state, and party and state offices increasingly merged, which also bred patronage."
 GEN_1970_ns_the_constitutional_road: "The Constitutional Road"
 GEN_1970_ns_the_constitutional_road_desc: "Allende's \"Chilean road to socialism\" (1970-73) kept parliament, courts and press, and Sri Lanka's United Front won and lost power at the ballot box."
 GEN_1970_ns_cooperative_literacy_drive: "Cooperative Literacy Drive"
 GEN_1970_ns_cooperative_literacy_drive_desc: "Tanzania's adult literacy campaigns of the 1970s, organised in the villages by party and government, roughly doubled the share of adults who could read."
 GEN_1970_ns_abolish_poverty: "Abolish Poverty"
 GEN_1970_ns_abolish_poverty_desc: "Indira Gandhi won the 1971 election on \"Garibi Hatao\" (abolish poverty): nationalised banks lent to farmers and small firms, and the state expanded public-sector plants and social programmes."
 GEN_1970_ns_the_mass_organisations: "The People's Organisations"
 GEN_1970_ns_the_mass_organisations_desc: "Youth leagues, women's unions and cooperative federations, such as TANU's Youth League, carried the programme into villages and workplaces."
 GEN_1970_ns_the_public_sector_backbone: "The Public Sector Backbone"
 GEN_1970_ns_the_public_sector_backbone_desc: "By the late 1970s public-sector firms produced most of India's steel and power and much of its fertiliser, and played a similar role in many other non-aligned states."
 GEN_1970_ns_national_service_corps: "National Service Corps"
 GEN_1970_ns_national_service_corps_desc: "Tanzania's National Service (JKT, compulsory for graduates from 1966) and the Zambia National Service (1971) sent young people to build roads and farms; Tanzanian students protested in 1966."
 GEN_1970_ns_universal_primary_education: "Universal Primary Education"
 GEN_1970_ns_universal_primary_education_desc: "Tanzania's Musoma Resolution (1974) promised a primary school place for every child by 1977; enrolment nearly doubled within three years, and education spending rose sharply."
 GEN_1970_ns_aid_from_both_camps: "Aid from Both Camps"
 GEN_1970_ns_aid_from_both_camps_desc: "China built the TAZARA railway (1970-75) while Sweden and the other Nordic states became Tanzania's main donors; India took Soviet steel plants and American grain - and the influence that came with them."
 GEN_1970_ns_collective_self_reliance: "Collective Self-Reliance"
 GEN_1970_ns_collective_self_reliance_desc: "The Group of 77 (1964) and the Arusha Programme for Collective Self-Reliance (1979) urged the South to trade with itself and depend less on donors."
 GEN_1970_ns_the_socialist_citizen: "The Socialist Citizen"
 GEN_1970_ns_the_socialist_citizen_desc: "Nyerere's \"Education for Self-Reliance\" (1967) wanted citizens who worked for the community; schools ran farms and workshops."
 GEN_1970_ns_a_voice_for_the_south: "A Voice for the South"
 GEN_1970_ns_a_voice_for_the_south_desc: "The UN declared a New International Economic Order in 1974, and Non-Aligned summits (Algiers 1973, Colombo 1976) made the South a voice in world politics."
 GEN_1970_ns_self_reliant_socialism: "Self-Reliant Socialism"
 GEN_1970_ns_self_reliant_socialism_desc: "Self-reliance (kujitegemea) was the stated goal of Nyerere's socialism: a mostly public economy meant to stand without either bloc, though Tanzania stayed heavily dependent on foreign aid."
 # nc
 GEN_1970_nc_our_own_road_to_socialism: "Our Own Road to Socialism"
 GEN_1970_nc_our_own_road_to_socialism_desc: "Tito's break with Stalin (1948) and Romania's refusal to join the invasion of Czechoslovakia (1968) defined communist parties that took no orders from Moscow."
 GEN_1970_nc_the_league_of_communists: "The League of Communists"
 GEN_1970_nc_the_league_of_communists_desc: "The Yugoslav party renamed itself a \"League\" (1952) to stress that it led society rather than administered it; its congresses set the line for the state."
 GEN_1970_nc_the_social_plan: "The Social Plan"
 GEN_1970_nc_the_social_plan_desc: "Yugoslav \"social plans\" and Romanian five-year plans set investment priorities for the whole economy, outside Comecon's division of labour."
 GEN_1970_nc_workers_self_management: "Workers' Self-Management"
 GEN_1970_nc_workers_self_management_desc: "Yugoslav workers' councils (from 1950) helped choose managers and divided enterprise income, and the 1974 constitution and 1976 Associated Labour Act extended self-management across the whole economy."
 GEN_1970_nc_national_stalinism: "National Stalinism"
 GEN_1970_nc_national_stalinism_desc: "After his 1971 visit to China and North Korea and the July Theses, Ceausescu centralised power and pushed heavy industry in Romania; culture and consumer goods suffered."
 GEN_1970_nc_western_credits: "Western Credits"
 GEN_1970_nc_western_credits_desc: "Romania joined the IMF and World Bank (1972) and Yugoslavia borrowed heavily from Western banks: new plants quickly, and a debt crisis in the 1980s."
 GEN_1970_nc_fortress_self_reliance: "Fortress Self-Reliance"
 GEN_1970_nc_fortress_self_reliance_desc: "Albania's 1976 constitution banned foreign credits and concessions; after the break with China (1978) it stood alone, shielded from outside pressure but cut off from foreign technology."
 GEN_1970_nc_market_socialism: "Market Socialism"
 GEN_1970_nc_market_socialism_desc: "Yugoslavia's 1965 reform gave self-managed firms more freedom over prices, investment and foreign trade; Western credits and consumer goods followed, and so did exposure to world markets."
 GEN_1970_nc_systematisation: "Systematisation"
 GEN_1970_nc_systematisation_desc: "Romania's systematisation law (1974) planned to turn villages into agro-industrial towns; when the plan was revived in 1988, villages began to be razed and the programme drew international protest."
 GEN_1970_nc_licensed_western_factories: "Licensed Western Factories"
 GEN_1970_nc_licensed_western_factories_desc: "Dacia built Renaults under a 1966 licence, Zastava built Fiats and Oltcit (founded 1976) Citroëns; Western licences brought technology, paid for in hard currency."
 GEN_1970_nc_heavy_industry_first: "Heavy Industry First"
 GEN_1970_nc_heavy_industry_first_desc: "Albania's Chinese-built Elbasan steel works (1970s) and Romania's Galati steel plant put steel, power and arms ahead of consumer goods."
 GEN_1970_nc_the_tenth_party_congress: "The Tenth Party Congress"
 GEN_1970_nc_the_tenth_party_congress_desc: "The Romanian (1969) and Yugoslav (1974) tenth congresses confirmed their leaders' lines and filled the central committees with loyal cadres."
 GEN_1970_nc_the_industrial_republic: "The Industrial Republic"
 GEN_1970_nc_the_industrial_republic_desc: "Yugoslavia grew by about 6 % a year in the 1970s and Romania, by official figures, even faster, turning both into industrial countries within a generation."
 GEN_1970_nc_brotherhood_and_unity: "Brotherhood and Unity"
 GEN_1970_nc_brotherhood_and_unity_desc: "Yugoslavia's 1974 constitution gave its republics and provinces near-sovereign powers to keep the peace between its nations, weakening the centre."
 GEN_1970_nc_the_state_security_apparatus: "The State Security Apparatus"
 GEN_1970_nc_the_state_security_apparatus_desc: "Romania's Securitate and Albania's Sigurimi built dense informer networks and closely watched contacts with foreigners; the police budget grew and dissent was suppressed."
 GEN_1970_nc_leader_of_the_non_aligned: "Leader of the Non-Aligned"
 GEN_1970_nc_leader_of_the_non_aligned_desc: "Tito co-founded the Non-Aligned Movement (Belgrade 1961) and was still its elder statesman at Havana (1979); summits, aid and prestige cost money."
 GEN_1970_nc_the_maverick_between_the_blocs: "The Maverick Between the Blocs"
 GEN_1970_nc_the_maverick_between_the_blocs_desc: "Ceausescu hosted Nixon (1969), kept ties to Israel and West Germany and won US most-favoured-nation status (1975), opening Romania to Western partners and their influence."
 GEN_1970_nc_socialist_patriotism: "Socialist Patriotism"
 GEN_1970_nc_socialist_patriotism_desc: "Ceausescu's July Theses (1971) mixed communism with national pride and history; independent communist states leaned on patriotism to stay united."
 GEN_1970_nc_an_arms_industry_of_our_own: "An Arms Industry of Our Own"
 GEN_1970_nc_an_arms_industry_of_our_own_desc: "Yugoslavia and Romania jointly developed the Orao/IAR-93 jet (first flight 1974), and Yugoslavia built the M-84 tank under Soviet licence and its own warships, to reduce their dependence on either bloc."
 GEN_1970_nc_general_people_s_defence: "General People's Defence"
 GEN_1970_nc_general_people_s_defence_desc: "After 1968 Yugoslavia (law of 1969) and Romania organised the whole population for territorial war so that no bloc could occupy them as the Warsaw Pact had occupied Czechoslovakia."
 # Nationalist outlook
 GEN_1970_champion_nationalist: "Champion the National Awakening"
 GEN_1970_champion_nationalist_desc: "Nationalist movements gained ground around 1970, from Turkey's Nationalist Movement Party (1969) to the Rhodesian Front's republic (1970) and Perón's return to Argentina (1973)."
 GEN_1970_patriotic_leagues: "Patriotic Leagues"
 GEN_1970_patriotic_leagues_desc: "Mass leagues such as the Peronist Youth or Spain's Movimiento associations filled the streets with supporters, and with clashes."
 GEN_1970_veterans_associations: "Veterans' Associations"
 GEN_1970_veterans_associations_desc: "Veterans' bodies (the Spanish Hermandad de Alféreces, the Portuguese Liga dos Combatentes) lent nationalism respectability, at the price of their pensions."
 GEN_1970_the_nation_rises: "The Nation Rises"
 GEN_1970_the_nation_rises_desc: "By the mid-1970s nationalists governed or shared power in Argentina, Rhodesia and Turkey (the 1975 Nationalist Front coalition), crowding out liberals and the left."
 GEN_1970_a_national_government: "A National Government"
 GEN_1970_a_national_government_desc: "A nationalist government arrives with a mandate to act quickly, as Perón did with his 62 % in September 1973."
 # rwp
 GEN_1970_rwp_the_people_s_champion: "The People's Champion"
 GEN_1970_rwp_the_people_s_champion_desc: "Populists came to power on personal popularity as much as on party machines: Perón won 62 % on his return in 1973."
 GEN_1970_rwp_a_direct_line_to_the_people: "A Direct Line to the People"
 GEN_1970_rwp_a_direct_line_to_the_people_desc: "Velasco Ibarra was president of Ecuador five times (1934-72), relying on radio speeches and rallies more than on any party."
 GEN_1970_rwp_prices_the_people_can_pay: "Prices the People Can Pay"
 GEN_1970_rwp_prices_the_people_can_pay_desc: "Price controls on bread, fuel and rents were a common first measure of populist governments, as in Argentina in 1973."
 GEN_1970_rwp_justice_for_the_workers: "Justice for the Workers"
 GEN_1970_rwp_justice_for_the_workers_desc: "Peronism rested on the CGT unions; social spending and union rights kept the base loyal and frightened investors."
 GEN_1970_rwp_the_silent_majority: "The Silent Majority"
 GEN_1970_rwp_the_silent_majority_desc: "George Wallace's campaigns and Nixon's 1969 \"silent majority\" speech courted the patriotic middle class against anti-war protesters and radicals."
 GEN_1970_rwp_economic_nationalism: "Economic Nationalism"
 GEN_1970_rwp_economic_nationalism_desc: "Protection for national producers and limits on foreign capital (Argentina's 1973 foreign investment law) built at home but scared investors away."
 GEN_1970_rwp_the_taxpayers_revolt: "The Taxpayers' Revolt"
 GEN_1970_rwp_the_taxpayers_revolt_desc: "Mogens Glistrup's Progress Party (Denmark 1973) won 16 % promising to abolish income tax and most of the bureaucracy."
 GEN_1970_rwp_the_social_pact: "The Social Pact"
 GEN_1970_rwp_the_social_pact_desc: "The Peronist government's 1973 Pacto Social froze prices and wages by agreement of the CGT unions and the CGE employers: inflation fell for a year, then the pact broke down in 1974-75."
 GEN_1970_rwp_against_the_old_elites: "Against the Old Elites"
 GEN_1970_rwp_against_the_old_elites_desc: "Populists campaigned against \"the establishment\": anti-corruption purges and back-tax drives against the old families followed."
 GEN_1970_rwp_buy_national: "Buy National"
 GEN_1970_rwp_buy_national_desc: "State credit and \"buy national\" procurement grew domestic industry behind tariff walls, as across Latin America in the early 1970s."
 GEN_1970_rwp_abolish_the_paper_pushers: "Abolish the Paper-Pushers"
 GEN_1970_rwp_abolish_the_paper_pushers_desc: "Glistrup famously proposed replacing Denmark's defence with an answering machine; his party demanded deep cuts in both state staff and taxes."
 GEN_1970_rwp_the_will_of_the_people: "The Will of the People"
 GEN_1970_rwp_the_will_of_the_people_desc: "Plebiscites and mass rallies rivalled parliament as a source of legitimacy, as in Perón's Plaza de Mayo addresses."
 GEN_1970_rwp_prosperity_for_the_little_man: "Prosperity for the Little Man"
 GEN_1970_rwp_prosperity_for_the_little_man_desc: "Populism lived on visible results for ordinary families: jobs, cheap goods and a rising standard of living."
 GEN_1970_rwp_the_law_and_order_ticket: "The Law-and-Order Ticket"
 GEN_1970_rwp_the_law_and_order_ticket_desc: "\"Law and order\" was the theme of the Wallace and Nixon campaigns of 1968: more police, harder sentences, and a larger police bill."
 GEN_1970_rwp_give_me_a_balcony: "Give Me a Balcony"
 GEN_1970_rwp_give_me_a_balcony_desc: "\"Give me a balcony and I will be president,\" said Velasco Ibarra; charisma mobilised crowds but wore down institutions."
 GEN_1970_rwp_the_third_position: "The Third Position"
 GEN_1970_rwp_the_third_position_desc: "Perón's Tercera Posición - neither Washington nor Moscow - led Argentina to trade with the Eastern bloc and to grant Cuba a credit of 1.2 billion dollars for Argentine goods in 1973-74."
 GEN_1970_rwp_bulwark_against_communism: "Bulwark Against Communism"
 GEN_1970_rwp_bulwark_against_communism_desc: "Turkey's Demirel and other anti-communist populists traded loyalty to the West for American aid and equipment."
 GEN_1970_rwp_a_movement_not_a_party: "A Movement, Not a Party"
 GEN_1970_rwp_a_movement_not_a_party_desc: "Peronism called itself a movement, not a party: unions, youth and women's branches all answered to the leader."
 GEN_1970_rwp_national_dignity: "National Dignity"
 GEN_1970_rwp_national_dignity_desc: "Populists promised the army respect and the nation pride, as Perón did in courting the armed forces after his 1973 return."
 GEN_1970_rwp_national_renewal: "National Renewal"
 GEN_1970_rwp_national_renewal_desc: "At its height a populist government claimed to have renewed the nation itself, as Peronism did in its \"Argentina Potencia\" programme."
 # fas
 GEN_1970_fas_the_national_revolution: "The National Revolution"
 GEN_1970_fas_the_national_revolution_desc: "The regime presents itself as a national revolution against party politics and class war, as the Estado Novo did."
 GEN_1970_fas_the_single_party: "The Single Party"
 GEN_1970_fas_the_single_party_desc: "Spain's Movimiento Nacional and Portugal's União Nacional (Acção Nacional Popular from 1970) were the only legal parties."
 GEN_1970_fas_the_national_economy: "The National Economy"
 GEN_1970_fas_the_national_economy_desc: "Isolated regimes learned to live with embargoes: Rhodesia withstood UN sanctions after 1966 through import substitution and trade via South Africa."
 GEN_1970_fas_the_party_above_the_state: "The Party Above the State"
 GEN_1970_fas_the_party_above_the_state_desc: "The Falangist \"bunker\" of 1973-75 insisted on the Movimiento's primacy over reformist ministers; ideology rose and administration slowed."
 GEN_1970_fas_the_technocrats: "The Technocrats"
 GEN_1970_fas_the_technocrats_desc: "From 1957 Franco handed the economy to Opus Dei technocrats (López Rodó, Ullastres); growth came, the old guard lost ground."
 GEN_1970_fas_the_corporate_state: "The Corporate State"
 GEN_1970_fas_the_corporate_state_desc: "The Estado Novo's corporations united employers and workers under state arbitration; strikes were banned."
 GEN_1970_fas_the_militarised_society: "The Militarised Society"
 GEN_1970_fas_the_militarised_society_desc: "Portugal spent around 40 % of its budget on the colonial wars (1961-74); four years of service became normal."
 GEN_1970_fas_national_youth_movement: "National Youth Movement"
 GEN_1970_fas_national_youth_movement_desc: "The Frente de Juventudes and the Mocidade Portuguesa organised youth in camps, parades and pre-military training."
 GEN_1970_fas_the_development_plans: "The Development Plans"
 GEN_1970_fas_the_development_plans_desc: "Spain's three Development Plans (1964-75) steered investment into growth poles and infrastructure."
 GEN_1970_fas_the_vertical_syndicates: "The Vertical Syndicates"
 GEN_1970_fas_the_vertical_syndicates_desc: "Spain's compulsory Organización Sindical bound workers and owners into one syndicate per branch and enforced labour peace by law, until clandestine Workers' Commissions spread in the 1960s."
 GEN_1970_fas_rearmament_programme: "Rearmament Programme"
 GEN_1970_fas_rearmament_programme_desc: "Wartime regimes built their own arsenals: Portugal's Braço de Prata arsenal and Rhodesia's sanctions-era workshops armed the troops."
 GEN_1970_fas_the_organic_law: "The Organic Law of the State"
 GEN_1970_fas_the_organic_law_desc: "Spain's Organic Law of the State (1967) codified the regime's institutions so that it could outlive its founder."
 GEN_1970_fas_a_nation_that_builds: "A Nation That Builds"
 GEN_1970_fas_a_nation_that_builds_desc: "Spain's \"miracle\" (1959-74) gave the regime its strongest argument: dams, factories and tourism instead of the hunger years."
 GEN_1970_fas_the_censorship_board: "The Censorship Board"
 GEN_1970_fas_the_censorship_board_desc: "Prior censorship (Portugal's Exame Prévio, Spain before 1966) kept dissent out of print and much literature and scholarship with it."
 GEN_1970_fas_the_controlled_opening: "The Controlled Opening"
 GEN_1970_fas_the_controlled_opening_desc: "Fraga's Press Law (1966) and Caetano's \"evolution in continuity\" opened the regime to Europe, and to its critics."
 GEN_1970_fas_defend_the_frontier: "Defend the Frontier"
 GEN_1970_fas_defend_the_frontier_desc: "Portugal in Africa and the Rhodesian bush war (escalating from 1972) made counter-insurgency the army's school, and drained the treasury."
 GEN_1970_fas_the_atlantic_bargain: "The Atlantic Bargain"
 GEN_1970_fas_the_atlantic_bargain_desc: "Spain rented bases to the US (1953, renewed 1970) and Portugal kept the Azores in NATO: aid and arms for American influence."
 GEN_1970_fas_years_of_peace_and_order: "Years of Peace and Order"
 GEN_1970_fas_years_of_peace_and_order_desc: "Spain's \"25 Years of Peace\" campaign (1964) presented order and stability as the regime's gift to a war-scarred generation."
 GEN_1970_fas_a_professional_officer_corps: "A Professional Officer Corps"
 GEN_1970_fas_a_professional_officer_corps_desc: "Staff colleges and NATO courses produced professional officers who later led or accepted the transitions in Portugal and Spain."
 GEN_1970_fas_the_greater_nation: "The Greater Nation"
 GEN_1970_fas_the_greater_nation_desc: "The regime's founding myth of national greatness, kept alive in parades and schoolbooks until its end in 1974-75."
 # jun
 GEN_1970_jun_the_generals_take_charge: "The Generals Take Charge"
 GEN_1970_jun_the_generals_take_charge_desc: "A junta first secures the barracks with larger budgets and privileges for the officer corps, as in Greece after 1967 or Chile after 1973."
 GEN_1970_jun_communique_number_one: "Communiqué Number One"
 GEN_1970_jun_communique_number_one_desc: "Coups from Greece (1967) to Chile (1973) and Turkey (1980) opened with numbered radio communiqués; parliament was dissolved and the parties suspended or banned soon after."
 GEN_1970_jun_the_economic_team: "The Economic Team"
 GEN_1970_jun_the_economic_team_desc: "Most juntas appointed civilian economists under a general: Roberto Campos in Brazil, Martínez de Hoz in Argentina, the ODEPLAN team in Chile."
 GEN_1970_jun_a_caretaker_junta: "A Caretaker Junta"
 GEN_1970_jun_a_caretaker_junta_desc: "Nigeria's military government (1975-79) set a timetable for civilian rule and Ghana's AFRC (1979) kept the scheduled elections; the promise bought calm and foreign goodwill but let the parties recover."
 GEN_1970_jun_permanent_military_rule: "Permanent Military Rule"
 GEN_1970_jun_permanent_military_rule_desc: "Brazil (1964-85) and Chile (1973-90) turned the coup into a regime with its own constitution; the universities and the middle class paid with their freedoms."
 GEN_1970_jun_the_chicago_boys: "The Chicago Boys"
 GEN_1970_jun_the_chicago_boys_desc: "Chile's 1975 \"shock treatment\" (Sergio de Castro and other Chicago-trained economists) sold state firms and opened the economy; wages and unions bore the cost."
 GEN_1970_jun_military_developmentalism: "Military Developmentalism"
 GEN_1970_jun_military_developmentalism_desc: "Brazil's \"economic miracle\" (1968-73) and Velasco's Peru built state industries with foreign loans; growth was real and so was the debt that came due in the 1980s."
 GEN_1970_jun_the_return_to_the_barracks: "The Return to the Barracks"
 GEN_1970_jun_the_return_to_the_barracks_desc: "After the 1973 elections the Turkish army stepped back but kept its voice in the National Security Council as guardian of the state; the officers lost office but kept their prestige."
 GEN_1970_jun_national_security_doctrine: "National Security Doctrine"
 GEN_1970_jun_national_security_doctrine_desc: "Brazil's Escola Superior de Guerra taught that the enemy was internal; the Southern Cone juntas adopted versions of the doctrine and the police budget grew with it."
 GEN_1970_jun_privatise_the_state_firms: "Privatise the State Firms"
 GEN_1970_jun_privatise_the_state_firms_desc: "Between 1974 and 1978 Chile returned or sold off most of the several hundred firms taken over under Allende, cutting state losses and raising some revenue."
 GEN_1970_jun_state_enterprises_in_uniform: "State Enterprises in Uniform"
 GEN_1970_jun_state_enterprises_in_uniform_desc: "Brazil's Embraer (1969) and Argentina's Fabricaciones Militares put officers in charge of steel, aircraft and arms plants."
 GEN_1970_jun_rule_by_decree_law: "Rule by Decree-Law"
 GEN_1970_jun_rule_by_decree_law_desc: "Juntas governed through numbered decree-laws (Chile's junta issued some 3,500 by 1980): fast, but without the consent parliament had provided."
 GEN_1970_jun_order_and_progress: "Order and Progress"
 GEN_1970_jun_order_and_progress_desc: "Juntas justified themselves by results: while the economy grew, the barracks and the middle class stayed loyal."
 GEN_1970_jun_the_counter_subversion_campaign: "The Counter-Subversion Campaign"
 GEN_1970_jun_the_counter_subversion_campaign_desc: "Operation Condor (1975) linked the Southern Cone secret services to pursue opponents across borders; over such abuses the US Congress cut military aid to Chile (1976) and Argentina (1978)."
 GEN_1970_jun_civic_action: "Civic Action"
 GEN_1970_jun_civic_action_desc: "Peruvian, Thai and Indonesian (dwifungsi) officers built roads, schools and clinics in the countryside to win the villages; the troops trained less."
 GEN_1970_jun_the_pentagon_connection: "The Pentagon Connection"
 GEN_1970_jun_the_pentagon_connection_desc: "US military aid and IMET training (F-5 fighters, Huey helicopters) equipped most anti-communist juntas, along with American influence over their officers."
 GEN_1970_jun_arms_without_strings: "Arms Without Strings"
 GEN_1970_jun_arms_without_strings_desc: "After the US human-rights embargoes, and Brazil's 1977 break with US military aid, the juntas bought from France and Israel and built their own weapons (Brazil's Engesa, Chile's FAMAE): independent but expensive."
 GEN_1970_jun_pacification_declared: "Pacification Declared"
 GEN_1970_jun_pacification_declared_desc: "Once the insurgency was broken the regime declared victory and lifted the state of siege, as Chile's junta did in March 1978, replacing it with a state of emergency."
 GEN_1970_jun_modernise_the_armed_forces: "Modernise the Armed Forces"
 GEN_1970_jun_modernise_the_armed_forces_desc: "The juntas spent their money on the forces that kept them in power: Argentina's junta bought Israeli and French jets and German-designed tanks and warships between 1976 and 1982."
 GEN_1970_jun_the_officer_corps_state: "The Officer Corps State"
 GEN_1970_jun_the_officer_corps_state_desc: "At its height the military state ran ministries, governorships and state firms through serving officers, as in Brazil under Médici or Argentina under the Proceso."
 # mon
 GEN_1970_mon_crown_and_nation: "Crown and Nation"
 GEN_1970_mon_crown_and_nation_desc: "Monarchies drew legitimacy from dynasty and nation alike, as Jordan's Hashemites and Morocco's Alaouites did."
 GEN_1970_mon_the_royal_prerogative: "The Royal Prerogative"
 GEN_1970_mon_the_royal_prerogative_desc: "The kings of Morocco, Jordan and Nepal appointed and dismissed governments at will under their constitutions."
 GEN_1970_mon_the_royal_economic_council: "The Royal Economic Council"
 GEN_1970_mon_the_royal_economic_council_desc: "Planning bodies answering to the throne set the economic course above party politics, as Iran's Plan and Budget Organisation did under the Shah."
 GEN_1970_mon_constitutional_monarchy: "Constitutional Monarchy"
 GEN_1970_mon_constitutional_monarchy_desc: "Thailand's king backed the students and a new constitution in October 1973; Juan Carlos did the same in Spain after 1975."
 GEN_1970_mon_absolute_monarchy: "Absolute Monarchy"
 GEN_1970_mon_absolute_monarchy_desc: "Hassan II's 1970 constitution and Nepal's panchayat kept power with the king - and Haile Selassie's refusal to share it ended in 1974."
 GEN_1970_mon_the_white_revolution: "The White Revolution"
 GEN_1970_mon_the_white_revolution_desc: "Iran's White Revolution (from 1963) gave land to peasants and sent a literacy corps to the villages; landlords and clergy turned against the Shah."
 GEN_1970_mon_the_royal_patrimony: "The Royal Patrimony"
 GEN_1970_mon_the_royal_patrimony_desc: "Royal holdings and court favourites ran key businesses, from Iran's Pahlavi Foundation to Morocco's palace-linked firms: dependable, and dependent on patronage."
 GEN_1970_mon_the_crown_in_parliament: "The Crown in Parliament"
 GEN_1970_mon_the_crown_in_parliament_desc: "Spain's Constitution of 1978 made the crown the guarantor of democracy and bound the army to it."
 GEN_1970_mon_the_royal_guard: "The Royal Guard"
 GEN_1970_mon_the_royal_guard_desc: "After the coup attempts of Skhirat (1971) and the 1972 attack on his jet, Hassan II took personal command of the armed forces and tightened his palace security."
 GEN_1970_mon_royal_development_projects: "Royal Development Projects"
 GEN_1970_mon_royal_development_projects_desc: "Thailand's royal development projects (from 1969) built dams, roads and model farms in the poorest provinces."
 GEN_1970_mon_indigenise_the_economy: "Indigenise the Economy"
 GEN_1970_mon_indigenise_the_economy_desc: "Morocco's Moroccanisation decree (1973) forced foreign firms to sell majorities to nationals - many of them close to the palace."
 GEN_1970_mon_the_kings_cabinet: "The King's Cabinet"
 GEN_1970_mon_the_kings_cabinet_desc: "Royal courts (Morocco's royal cabinet, Jordan's Royal Hashemite Court) worked beside the government and kept the notables in line."
 GEN_1970_mon_the_crowns_prosperity: "The Crown's Prosperity"
 GEN_1970_mon_the_crowns_prosperity_desc: "The oil and phosphate booms of 1973-74 let monarchies fund palaces, subsidies and loyal middle classes."
 GEN_1970_mon_commander_of_the_faithful: "Commander of the Faithful"
 GEN_1970_mon_commander_of_the_faithful_desc: "Hassan II ruled as Amir al-Mu'minin and Thailand's king as patron of Buddhism: faith anchored the throne, not the laboratories."
 GEN_1970_mon_the_modern_court: "The Modern Court"
 GEN_1970_mon_the_modern_court_desc: "The Shah's court pushed women's rights (Family Protection Law 1967) and Western education, and alienated the clergy."
 GEN_1970_mon_the_western_shield: "The Western Shield"
 GEN_1970_mon_the_western_shield_desc: "Under the Nixon Doctrine (1969-72) Iran and Saudi Arabia bought American jets and tanks as the Gulf's \"twin pillars\", and hosted American advisers."
 GEN_1970_mon_the_national_cause: "The National Cause"
 GEN_1970_mon_the_national_cause_desc: "The Green March of 1975 rallied every Moroccan party behind the king on a national claim, and strained relations abroad."
 GEN_1970_mon_the_royal_jubilee: "The Royal Jubilee"
 GEN_1970_mon_the_royal_jubilee_desc: "The Persepolis celebrations of 1971 dazzled the world's leaders, and their cost was remembered at home."
 GEN_1970_mon_the_royal_armed_forces: "The Royal Armed Forces"
 GEN_1970_mon_the_royal_armed_forces_desc: "Royal armies were the throne's last line: Jordan's army, heir to the Arab Legion, decided the Black September conflict of 1970 in the king's favour."
 GEN_1970_mon_the_throne_endures: "The Throne Endures"
 GEN_1970_mon_the_throne_endures_desc: "Hussein survived Black September, Hassan two coups and Bhumibol 1973 - the monarchies that adapted outlasted the decade."
