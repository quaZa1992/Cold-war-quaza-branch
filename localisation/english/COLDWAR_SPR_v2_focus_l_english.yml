 COLDWAR_SPR_caudillo_last_years:0 "Ageing Leadership"
 COLDWAR_SPR_caudillo_last_years_desc:0 "Franco still arbitrates the regime, but personal government becomes harder as his capacity declines. Administrative preparations reduce the succession shock; they do not reverse ageing."
 COLDWAR_SPR_regime_families:0 "Competing Regime Families"
 COLDWAR_SPR_regime_families_desc:0 "Technocrats, the Movement, military patrons and the royal household compete for appointments and influence. Rival patrons make a consistent national policy harder to enforce."
 COLDWAR_SPR_protected_industry:0 "Protected Industrialisation"
 COLDWAR_SPR_protected_industry_desc:0 "The development state has built capacity behind protection and preferential credit. Construction remains strong while productivity and production flexibility lag."
 COLDWAR_SPR_uneven_prosperity:0 "Uneven Prosperity"
 COLDWAR_SPR_uneven_prosperity_desc:0 "Urban services and tourism expand while rural districts lose people and struggle to finance basic provision. The gains from growth are politically uneven."
 COLDWAR_SPR_energy_intensity:0 "Energy-Hungry Growth"
 COLDWAR_SPR_energy_intensity_desc:0 "Rapid industrial growth raises electricity demand and depends on fuel and equipment purchased abroad. More efficient factories will ease the pressure on the supply system."
 COLDWAR_SPR_labour_territorial_strain:0 "Territorial and Labour Strains"
 COLDWAR_SPR_labour_territorial_strain_desc:0 "Workplace disputes and regional demands meet a state built to restrict independent representation. Policing the resulting tensions increases costs and weakens confidence in routine government."
 COLDWAR_SPR_army_of_regime:0 "An Army of the Regime"
 COLDWAR_SPR_army_of_regime_desc:0 "The services possess political standing but face uneven equipment, duplicated structures and an expensive personnel model. Modernisation requires institutional reform and funded assets."
 COLDWAR_SPR_managed_succession:0 "Managed Succession"
 COLDWAR_SPR_managed_succession_desc:0 "The ministries and succession institutions have agreed how to keep government working through a change in the headship of state. Rival patrons still defend their influence, but the administration has a common procedure."
 COLDWAR_SPR_civil_guarantees_spirit:0 "Civil Guarantees"
 COLDWAR_SPR_civil_guarantees_spirit_desc:0 "Judicial safeguards distinguish peaceful opposition from criminal violence. Clear rules reduce arbitrary action while leaving the state responsible for public safety."
 COLDWAR_SPR_labour_compact:0 "The Labour Compact"
 COLDWAR_SPR_labour_compact_desc:0 "Labour courts and recognised bargaining procedures give workplace disputes a lawful channel. The state retains the administrative and policing obligations of an industrial society."
 COLDWAR_SPR_audited_industry:0 "Audited Industrialisation"
 COLDWAR_SPR_audited_industry_desc:0 "Public accounts expose the productive strengths and protected losses of Spanish industry. The construction programme remains capable, while firms still face the task of improving production."
 COLDWAR_SPR_modern_industry:0 "A Modern Industrial Base"
 COLDWAR_SPR_modern_industry_desc:0 "A domestic industrial base supported by common technical standards can supply larger markets. Its construction capacity remains an enduring result of the development programme."
 COLDWAR_SPR_rural_investment:0 "Rural Investment"
 COLDWAR_SPR_rural_investment_desc:0 "Credit, utilities and regional services give rural districts a stake in national development. Sustaining those communities remains a continuing public responsibility."
 COLDWAR_SPR_modern_energy_demand:0 "Improved Energy Intensity"
 COLDWAR_SPR_modern_energy_demand_desc:0 "Efficient machinery and process standards have moderated the demands of rapid industrialisation. Growing factories still require a dependable electricity system."
 COLDWAR_SPR_reformed_armed_forces:0 "Reformed Armed Forces"
 COLDWAR_SPR_reformed_armed_forces_desc:0 "A joint staff and coherent personnel policy have improved service organisation. Completing professional reform still requires a durable agreement over careers and operating costs."
 COLDWAR_SPR_eec_membership:0 "European Communities Membership"
 COLDWAR_SPR_eec_membership_desc:0 "Spain has joined the European Communities under an accepted accession settlement. Membership carries rights and obligations for the state and its economic institutions."
 COLDWAR_SPR_v2_programme_succession:0 "Franco and the Settlement"
 COLDWAR_SPR_v2_programme_succession_desc:0 "The institutions, investment standards and service reforms enacted by the Spanish state."
 COLDWAR_SPR_v2_programme_territorial:0 "Territory, Labour and Reconciliation"
 COLDWAR_SPR_v2_programme_territorial_desc:0 "The institutions, investment standards and service reforms enacted by the Spanish state."
