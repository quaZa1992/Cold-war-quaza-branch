 COLDWAR_SPR_last_years:0 "The Caudillo's Years"
 COLDWAR_SPR_last_years_desc:0 "Franco remains the final arbiter of a regime divided between ministers, the Movement and the armed forces. His advancing age makes the question of who can govern in his absence an immediate matter of state."
 COLDWAR_SPR_v2_mod_political_power_factor_tt:0 "Political Power Gain: $RIGHT|+=%1$"
 COLDWAR_SPR_v2_mod_bureaucracy_cost_multiplier_modifier_tt:0 "Bureaucracy Cost: $RIGHT|-=%1$"
 COLDWAR_SPR_delegate_authority:0 "Rule by Delegation"
 COLDWAR_SPR_delegate_authority_desc:0 "Carrero Blanco and the technical ministries can handle the daily business of government. Delegation strengthens administrative continuity while loosening Franco's personal command of the regime."
 COLDWAR_SPR_personal_authority:0 "Personal Authority"
 COLDWAR_SPR_personal_authority_desc:0 "The families of the regime still obey orders issued in the Caudillo's name. Preserving that authority can settle immediate disputes, but leaves more business unresolved when he can no longer intervene."
 COLDWAR_SPR_cabinet_records:0 "Cabinet Records"
 COLDWAR_SPR_cabinet_records_desc:0 "Succession cannot depend on an inaccessible collection of personal instructions. Ministers will record powers, budgets and outstanding commitments so that the administration can continue through an absence."
 COLDWAR_SPR_movement_commission:0 "Movement Commission"
 COLDWAR_SPR_movement_commission_desc:0 "The National Council wants the principles of the Movement embedded in every ministry. Its coordinating commission offers political discipline at the price of another layer of supervision."
 COLDWAR_SPR_carrero_guarantees:0 "Carrero's Guarantees"
 COLDWAR_SPR_carrero_guarantees_desc:0 "Carrero's authority rests on Franco's confidence and his command of government business. A documented continuity agreement will give ministers a procedure to follow when the presidency changes hands."
 COLDWAR_SPR_v2_mod_police_cost_multiplier_modifier_tt:0 "Police Cost: $RIGHT|-=%1$"
 COLDWAR_SPR_command_channels:0 "Command Channels"
 COLDWAR_SPR_command_channels_desc:0 "The military regions and security services must receive lawful orders from a recognised chain of command. Clarifying those channels reduces the risk that competing officials claim to speak for Franco."
 COLDWAR_SPR_interregnum_files:0 "Interregnum Planning"
 COLDWAR_SPR_interregnum_files_desc:0 "The Fundamental Laws name institutions that can act during a vacancy, but their cooperation has never been tested. A joint exercise between the government, the Council of the Realm and the royal household will expose the missing arrangements."
 COLDWAR_SPR_royal_briefings:0 "The Prince's Briefings"
 COLDWAR_SPR_royal_briefings_desc:0 "Juan Carlos was designated successor in 1969 and has sworn to the laws of the regime. Giving him access to the business of state prepares a head of state without deciding whether a future monarchy will reform those laws."
 COLDWAR_SPR_realm_council:0 "Council of the Realm"
 COLDWAR_SPR_realm_council_desc:0 "The Council links the presidency, the Cortes and the head of state under the existing legal order. Agreeing its procedures in advance makes a disputed appointment less likely."
 COLDWAR_SPR_regency_ready:0 "A Lasting State"
 COLDWAR_SPR_regency_ready_desc:0 "No successor will inherit Franco's wartime authority. The institutions of the state must be able to keep offices open and salaries paid while the political settlement is negotiated."
 COLDWAR_SPR_after_franco:0 "Dawn Without Franco"
 COLDWAR_SPR_after_franco_desc:0 "The founder's departure leaves the institutions intact but their purpose contested. Ministers, the crown, the Movement and the opposition must now pursue their programmes without his final arbitration."
 COLDWAR_SPR_fundamental_settlement:0 "The Fundamental Laws"
 COLDWAR_SPR_fundamental_settlement_desc:0 "The continuity camp proposes that the legal order survive its author. The Cortes and the Movement will remain the recognised channels of representation, excluding competitive national elections."
 COLDWAR_SPR_royal_executive:0 "The Crown Governs"
 COLDWAR_SPR_royal_executive_desc:0 "Royal advisers argue that the crown must exercise the executive power inherited under the succession laws. A consultative Cortes can broaden support while the king retains the appointment of government."
 COLDWAR_SPR_parliamentary_settlement:0 "Reform Through Law"
 COLDWAR_SPR_parliamentary_settlement_desc:0 "Reformers can use the institutions of the regime to dismantle their monopoly. A reform law, a public vote and competitive elections offer an orderly route to a new parliament, provided the coercive institutions accept the process."
 COLDWAR_SPR_settlement_review:0 "The Constitutional Pact"
 COLDWAR_SPR_settlement_review_desc:0 "A settlement needs procedures for changing it as well as rules for governing under it. The constitutional pact gives a future government a lawful route to revision instead of treating the first compromise as permanent consent."
 COLDWAR_SPR_monarchy_referendum:0 "Parliamentary Crown"
 COLDWAR_SPR_monarchy_referendum_desc:0 "A parliamentary monarchy separates the continuity of the state from the direction of government. The king will represent the state while ministers answer to an elected Cortes."
 COLDWAR_SPR_republic_referendum:0 "A Republican Mandate"
 COLDWAR_SPR_republic_referendum_desc:0 "Republican parties must turn a historical claim into a public mandate. A constitutional referendum can establish a republic with guarantees for political minorities and a negotiated transfer of the headship of state."
 COLDWAR_SPR_succession_law:0 "The Succession Law"
 COLDWAR_SPR_succession_law_desc:0 "The 1969 designation establishes a successor, but the law also defines who must act during a vacancy. The government will publish the legal procedure without requiring agreement on the future political programme."
 COLDWAR_SPR_national_dialogue:0 "The Internal Question"
 COLDWAR_SPR_national_dialogue_desc:0 "Industrial disputes and territorial grievances cannot be reduced to one conspiracy. The government must distinguish peaceful representation from violence and decide how much political space it can tolerate."
 COLDWAR_SPR_administrative_unity:0 "One Administration"
 COLDWAR_SPR_administrative_unity_desc:0 "Central administrators propose uniform services and provincial investment under the governors. This can improve access to the state while leaving demands for political autonomy unanswered."
 COLDWAR_SPR_autonomy_statutes:0 "Negotiated Statutes"
 COLDWAR_SPR_autonomy_statutes_desc:0 "Regional representatives seek elected institutions with defined powers and financing. Negotiated statutes can bring lawful opposition into government, but establishing parallel administrations carries a recurring cost."
 COLDWAR_SPR_provincial_equalisation:0 "Provincial Equalisation"
 COLDWAR_SPR_provincial_equalisation_desc:0 "Services in poorer provinces must improve if central government expects allegiance. Targeted public works in Extremadura will give administrative unity a material purpose."
 COLDWAR_SPR_v2_mod_tax_gain_multiplier_modifier_tt:0 "Tax Revenue: $RIGHT|+=%1$"
 COLDWAR_SPR_basque_finance:0 "Basque Fiscal Accord"
 COLDWAR_SPR_basque_finance_desc:0 "A fiscal agreement must specify both local responsibility and the contribution to shared services. A negotiated accord offers institutional certainty without treating the Basque population as a security category."
 COLDWAR_SPR_catalan_services:0 "Catalan Institutions"
 COLDWAR_SPR_catalan_services_desc:0 "The restoration of regional institutions requires civil servants, offices and an agreed division of responsibilities. Funding that administration will make the statute operational rather than merely symbolic."
 COLDWAR_SPR_local_public_works:0 "Municipal Works"
 COLDWAR_SPR_local_public_works_desc:0 "Municipal authorities know which roads and utilities are holding back local employment. Earmarked works will let them deliver improvements within a common national investment framework."
 COLDWAR_SPR_civil_guarantees:0 "Civil Guarantees"
 COLDWAR_SPR_civil_guarantees_desc:0 "Public order requires courts capable of separating dissent from criminal violence. Clear arrest procedures and judicial supervision will reduce arbitrary detention while leaving investigators responsible for actionable cases."
 COLDWAR_SPR_v2_mod_civilian_factories_productivity_tt:0 "Civilian Factory Productivity: $RIGHT|+=%1$"
 COLDWAR_SPR_v2_mod_social_cost_multiplier_modifier_tt:0 "Welfare Cost: $RIGHT|-=%1$"
 COLDWAR_SPR_official_labour:0 "Syndical Guarantees"
 COLDWAR_SPR_official_labour_desc:0 "The official syndicates can retain their institutional position only by enforcing credible workplace guarantees. Binding arbitration will raise labour costs while reducing the incentive to settle every dispute through stoppages."
 COLDWAR_SPR_free_unions:0 "Independent Unions"
 COLDWAR_SPR_free_unions_desc:0 "Workers' organisations need legal recognition and employers need enforceable bargaining rules. Independent unions and collective agreements can legitimise representation while making wage negotiations a real constraint on government and industry."
 COLDWAR_SPR_labour_courts:0 "Labour Courts"
 COLDWAR_SPR_labour_courts_desc:0 "A labour settlement needs more than periodic agreements among national leaders. Specialist courts will enforce contracts and provide a routine channel for disputes that would otherwise return to the streets."
 COLDWAR_SPR_third_development_plan:0 "The Development State"
 COLDWAR_SPR_third_development_plan_desc:0 "Spain's industrial expansion has created factories, cities and a growing domestic market. The next programme must address the protected firms, regional gaps and energy demand that growth has left behind."
 COLDWAR_SPR_enterprise_audit:0 "Enterprise Audit"
 COLDWAR_SPR_enterprise_audit_desc:0 "Before new credit is allocated, the state needs reliable accounts from public enterprises and protected private firms. A national review will identify productive investment and the losses hidden behind administrative protection."
 COLDWAR_SPR_v2_mod_production_speed_industrial_complex_factor_tt:0 "Civilian Factory Construction Speed: $RIGHT|+=%1$"
 COLDWAR_SPR_ini_renewal:0 "Renew the INI"
 COLDWAR_SPR_ini_renewal_desc:0 "Public enterprises provide capacity that private finance will not always build. Modernising their plants and purchasing rules can preserve that role, provided the state accepts the continuing cost of directing investment."
 COLDWAR_SPR_v2_mod_production_factory_efficiency_gain_factor_tt:0 "Production Efficiency Growth: $RIGHT|+=%1$"
 COLDWAR_SPR_export_competition:0 "Export Competition"
 COLDWAR_SPR_export_competition_desc:0 "Access to foreign markets will reward firms that can compete beyond protected domestic contracts. A programme of industrial adjustment will improve productivity while withdrawing some of the construction privileges enjoyed by favoured enterprises."
 COLDWAR_SPR_v2_mod_production_factory_max_efficiency_factor_tt:0 "Production Efficiency Cap: $RIGHT|+=%1$"
 COLDWAR_SPR_asturian_metals:0 "Asturian Modernisation"
 COLDWAR_SPR_asturian_metals_desc:0 "Asturian heavy industry supplies the state and sustains communities with few alternatives. A funded modernisation programme will renew industrial capacity rather than promise that obsolete plant can remain competitive indefinitely."
 COLDWAR_SPR_mediterranean_components:0 "Coastal Suppliers"
 COLDWAR_SPR_mediterranean_components_desc:0 "Assembly plants need specialised local suppliers if exports are to leave more value in Spain. Investment in Catalonia and Valencia will connect engineering workshops to the larger industrial market."
 COLDWAR_SPR_industrial_standards:0 "Industrial Standards"
 COLDWAR_SPR_industrial_standards_desc:0 "Quality control, compatible components and reliable delivery are conditions of a modern industrial base. Common standards will turn isolated plant improvements into a national production system."
 COLDWAR_SPR_southern_irrigation:0 "Southern Irrigation"
 COLDWAR_SPR_southern_irrigation_desc:0 "Drought risk and uneven water access limit rural incomes in the south. Irrigation and water-management works can make agricultural investment productive without pretending that every province has the same resources."
 COLDWAR_SPR_rural_credit:0 "Rural Credit"
 COLDWAR_SPR_rural_credit_desc:0 "Small producers need finance for machinery, storage and access to buyers. Rural credit institutions will spread the benefits of development while increasing the state's obligation to support districts losing population."
 COLDWAR_SPR_agricultural_training:0 "Agricultural Training"
 COLDWAR_SPR_agricultural_training_desc:0 "Technical services can make equipment and irrigation useful to the people operating them. Extension schools and cooperatives will support adaptation instead of treating urban migration as the only development policy."
 COLDWAR_SPR_v2_mod_energy_use_modifier_offices_tt:0 "Office Energy Use: $RIGHT|-=%1$"
 COLDWAR_SPR_tourism_management:0 "Tourism Standards"
 COLDWAR_SPR_tourism_management_desc:0 "Tourism brings foreign earnings and employment, but rapid coastal construction can overwhelm local services. Common standards and funded utilities will protect the sector's long-term value."
 COLDWAR_SPR_regional_services:0 "Regional Services"
 COLDWAR_SPR_regional_services_desc:0 "Commercial services should develop around more than the capital and the coast. A regional centre in Galicia will support local firms and give trained workers another reason to remain."
 COLDWAR_SPR_technical_universities:0 "Technical Universities"
 COLDWAR_SPR_technical_universities_desc:0 "The expansion of education must produce engineers and technicians as well as formal qualifications. Applied departments will support Spanish industry while committing the state to a larger education bill."
 COLDWAR_SPR_energy_balance:0 "The Energy Balance"
 COLDWAR_SPR_energy_balance_desc:0 "Factories, transport and growing cities depend on a fuel and electricity system exposed to external supply. A credible energy policy must choose between faster conventional capacity and a more expensive nuclear programme."
 COLDWAR_SPR_v2_mod_energy_use_modifier_civs_tt:0 "Civilian Factory Energy Use: $RIGHT|-=%1$"
 COLDWAR_SPR_industrial_efficiency:0 "Industrial Efficiency"
 COLDWAR_SPR_industrial_efficiency_desc:0 "Spain can reduce the energy required for each unit of industrial production before building another generating plant. Modern equipment and process audits will make the existing supply go further."
 COLDWAR_SPR_nuclear_programme:0 "A Nuclear Programme"
 COLDWAR_SPR_nuclear_programme_desc:0 "Nuclear generation offers a different source of electricity, but requires capital, specialist personnel and a secure fuel cycle. The state will fund site and safety work before authorising construction through the existing investment system."
 COLDWAR_SPR_conventional_power:0 "Conventional Capacity"
 COLDWAR_SPR_conventional_power_desc:0 "Conventional stations can meet industrial demand with familiar technology and shorter construction schedules. That speed retains dependence on purchased fuel and ties future supply to foreign markets."
 COLDWAR_SPR_v2_mod_nuclear_energy_generation_modifier_tt:0 "Nuclear Energy Generation: $RIGHT|+=%1$"
 COLDWAR_SPR_nuclear_operators:0 "Nuclear Operators"
 COLDWAR_SPR_nuclear_operators_desc:0 "A reactor fleet is only as reliable as its operators and regulators. Specialist training will improve generation from operating plants while expanding the permanent technical administration."
 COLDWAR_SPR_uranium_surveys:0 "Uranium Surveys"
 COLDWAR_SPR_uranium_surveys_desc:0 "Domestic uranium resources must be surveyed and evaluated before they can support the fuel cycle. A deposit is an opportunity for paid development, not a mine or automatic production."
 COLDWAR_SPR_nuclear_safety:0 "Independent Inspection"
 COLDWAR_SPR_nuclear_safety_desc:0 "Operators need an inspectorate able to stop unsafe production without bargaining over annual generation targets. Regular inspections improve institutional confidence while keeping a permanent administrative bill."
 COLDWAR_SPR_v2_mod_fuel_gain_factor_tt:0 "Fuel Gain: $RIGHT|+=%1$"
 COLDWAR_SPR_refining_skills:0 "Refining Skills"
 COLDWAR_SPR_refining_skills_desc:0 "Refining and fuel management require their own technical base. Training and equipment will improve the output of existing fuel production without creating domestic oil deposits."
 COLDWAR_SPR_strategic_reserves:0 "Strategic Reserves"
 COLDWAR_SPR_strategic_reserves_desc:0 "Storage cannot make imported fuel domestic, but it can give industry and transport time to adjust to a disruption. A funded reserve facility will support a national supply plan."
 COLDWAR_SPR_crisis_planning:0 "Supply Contingencies"
 COLDWAR_SPR_crisis_planning_desc:0 "A supply interruption must not leave ministries competing for the same deliveries. Contingency plans will prioritise essential transport and public services, accepting administrative cost in exchange for a more coherent response."
 COLDWAR_SPR_madrid_technical_centre:0 "National Laboratories"
 COLDWAR_SPR_madrid_technical_centre_desc:0 "National laboratories can support industrial measurement, materials and energy research beyond a single policy programme. The investment creates a lasting technical institution rather than a temporary cabinet office."
 COLDWAR_SPR_freight_corridors:0 "Freight Corridors"
 COLDWAR_SPR_freight_corridors_desc:0 "Industrial regions need reliable routes to ports and domestic markets. Targeted infrastructure in Aragon and Valencia will connect production centres without promising that a focus can replace every missing railway."
 COLDWAR_SPR_v2_mod_offices_productivity_tt:0 "Office Productivity: $RIGHT|+=%1$"
 COLDWAR_SPR_technical_exports:0 "Technical Exports"
 COLDWAR_SPR_technical_exports_desc:0 "Spanish firms should be able to sell engineering services as well as assembled goods. Export support tied to proven technical capacity will turn the laboratories and industrial standards into practical opportunities."
 COLDWAR_SPR_reconversion_fund:0 "Reconversion Fund"
 COLDWAR_SPR_reconversion_fund_desc:0 "Industrial adjustment can destroy the communities it is meant to modernise. A funded retraining and redevelopment reserve will make closures and new investment part of the same policy."
 COLDWAR_SPR_armed_forces_review:0 "The Service Review"
 COLDWAR_SPR_armed_forces_review_desc:0 "The armed forces retain political weight and an uneven inventory alongside equipment obtained through foreign agreements. Modernisation must define their mission before ministries compete over procurement."
 COLDWAR_SPR_v2_mod_army_personnel_cost_multiplier_modifier_tt:0 "Army Personnel Cost: $RIGHT|-=%1$"
 COLDWAR_SPR_defence_ministry:0 "A Defence Ministry"
 COLDWAR_SPR_defence_ministry_desc:0 "Separate service interests make national planning expensive and slow. A common defence administration will bring accounts and procurement under one authority while creating a permanent civilian and military staff."
 COLDWAR_SPR_v2_mod_army_org_factor_tt:0 "Army Organisation: $RIGHT|+=%1$"
 COLDWAR_SPR_v2_mod_training_time_factor_tt:0 "Training Time: $RIGHT|-=%1$"
 COLDWAR_SPR_professional_cadres:0 "Professional Cadres"
 COLDWAR_SPR_professional_cadres_desc:0 "A smaller body of instructors and technical specialists can improve training and readiness. Retaining those people requires better pay and career prospects rather than an unexplained increase in manpower."
 COLDWAR_SPR_v2_mod_supply_consumption_factor_tt:0 "Supply Consumption: $RIGHT|-=%1$"
 COLDWAR_SPR_citizen_reserves:0 "A Trained Reserve"
 COLDWAR_SPR_citizen_reserves_desc:0 "A territorial reserve can provide depth without keeping every soldier permanently under arms. Its usefulness depends on exercises, stores and mobilisation planning that divert resources from the standing force."
 COLDWAR_SPR_v2_mod_army_org_regain_tt:0 "Army Organisation Recovery: $RIGHT|+=%1$"
 COLDWAR_SPR_instructor_corps:0 "The Instructor Corps"
 COLDWAR_SPR_instructor_corps_desc:0 "The best specialists should teach the force rather than disappear into headquarters. An instructor corps will spread practical skills while reducing the personnel available for routine postings."
 COLDWAR_SPR_v2_mod_planning_speed_tt:0 "Planning Speed: $RIGHT|+=%1$"
 COLDWAR_SPR_reserve_exercises:0 "Mobilisation Exercises"
 COLDWAR_SPR_reserve_exercises_desc:0 "Reserve units must assemble with usable equipment and clear transport arrangements. A funded mobilisation exercise will reveal shortages before they become operational failures."
 COLDWAR_SPR_joint_staff:0 "The Joint Staff"
 COLDWAR_SPR_joint_staff_desc:0 "A joint staff can reconcile the services' plans and standardise the force's basic procedures. The army will gain a clearer operational system while retaining the recurring cost of its chosen personnel model."
 COLDWAR_SPR_v2_mod_army_defence_factor_tt:0 "Army Defence: $RIGHT|+=%1$"
 COLDWAR_SPR_continental_army:0 "A Continental Army"
 COLDWAR_SPR_continental_army_desc:0 "The army can concentrate on defending the peninsula and sustaining formations close to home. Larger stocks and prepared positions improve defensive resilience while making manoeuvre forces more supply intensive."
 COLDWAR_SPR_v2_mod_army_speed_factor_tt:0 "Army Speed: $RIGHT|+=%1$"
 COLDWAR_SPR_mobile_force:0 "A Mobile Force"
 COLDWAR_SPR_mobile_force_desc:0 "A smaller mobile force can respond across the peninsula, the islands and the remaining Saharan commitment. Its vehicles and specialist crews demand a higher level of support than a static territorial army."
 COLDWAR_SPR_defensive_doctrine:0 "Defence in Depth"
 COLDWAR_SPR_defensive_doctrine_desc:0 "Prepared positions need trained staffs and a doctrine for committing reserves. The academy will concentrate on defensive operations rather than treating every unit as a force for rapid intervention."
 COLDWAR_SPR_combined_arms_school:0 "Combined Arms School"
 COLDWAR_SPR_combined_arms_school_desc:0 "Mobile formations need artillery, engineers and logistics trained to work on the same timetable. A combined-arms school will turn imported and domestic equipment into usable operational formations."
 COLDWAR_SPR_military_factories:0 "Domestic Workshops"
 COLDWAR_SPR_military_factories_desc:0 "A national maintenance and production base will keep the army from depending on every foreign delivery. The state will fund a limited expansion of military manufacturing in Castile."
 COLDWAR_SPR_v2_mod_license_production_speed_tt:0 "Licensed Equipment Production Speed: $RIGHT|+=%1$"
 COLDWAR_SPR_licensed_production:0 "Licensed Equipment"
 COLDWAR_SPR_licensed_production_desc:0 "Licensing can provide proven designs before domestic development is mature. Production improvements are useful only when the foreign owner actually grants a licence and the equipment can be supported locally."
 COLDWAR_SPR_national_designs:0 "National Design Offices"
 COLDWAR_SPR_national_designs_desc:0 "Domestic design offices give the state more control over future equipment. Development will cost money before it produces a useful design and will not instantly erase the existing licensed inventory."
 COLDWAR_SPR_air_staff:0 "The Air Staff"
 COLDWAR_SPR_air_staff_desc:0 "Air defence, training and procurement must share a realistic operating plan. A central air staff will improve service coordination while keeping aircraft acquisition separate from the force's actual ability to fly them."
 COLDWAR_SPR_interceptor_priority:0 "Interceptor Priority"
 COLDWAR_SPR_interceptor_priority_desc:0 "Air sovereignty requires pilots and ground crews trained for interception. Concentrating instruction on that task will improve operational organisation without pretending to grant a new fighter fleet."
 COLDWAR_SPR_joint_air_support:0 "Joint Air Support"
 COLDWAR_SPR_joint_air_support_desc:0 "The air force can give priority to working with army formations and maritime patrols. Joint exercises will improve service planning while demanding transport, maintenance and flying hours."
 COLDWAR_SPR_air_ground_crews:0 "Ground Crew Schools"
 COLDWAR_SPR_air_ground_crews_desc:0 "Aircraft availability depends on technicians and stores as much as pilots. Dedicated ground-crew schools will build the workforce needed to sustain whichever aircraft the state can actually afford."
 COLDWAR_SPR_air_bases:0 "Dispersed Airfields"
 COLDWAR_SPR_air_bases_desc:0 "Dispersal protects the force and reduces dependence on a few crowded bases. A funded airfield expansion in Aragon will provide capacity for training and deployment."
 COLDWAR_SPR_naval_planning:0 "The Naval Programme"
 COLDWAR_SPR_naval_planning_desc:0 "Spain's Atlantic and Mediterranean approaches demand choices that the navy cannot finance simultaneously. The naval programme must decide between sea-lane protection and a more expensive force for sustained presence."
 COLDWAR_SPR_v2_mod_industrial_capacity_dockyard_tt:0 "Dockyard Output: $RIGHT|+=%1$"
 COLDWAR_SPR_escort_navy:0 "An Escort Navy"
 COLDWAR_SPR_escort_navy_desc:0 "Escorts and support vessels can protect trade and operate with partners without a large prestige fleet. The programme prioritises trained crews and sustainment over the number of major hulls."
 COLDWAR_SPR_presence_navy:0 "A Navy of Presence"
 COLDWAR_SPR_presence_navy_desc:0 "A force designed for sustained overseas presence carries political weight but requires more than a flagship. Shipyard investment must be matched by crews, maintenance and an accepted recurring expense."
 COLDWAR_SPR_ferrol_yards:0 "Ferrol Modernisation"
 COLDWAR_SPR_ferrol_yards_desc:0 "Galicia's shipyards can support a navy built around reliable escorts. Funding new capacity there will create a practical link between naval planning and domestic construction."
 COLDWAR_SPR_cadiz_yards:0 "Cádiz Modernisation"
 COLDWAR_SPR_cadiz_yards_desc:0 "A larger operational fleet requires yards able to maintain it as well as build it. Investment in Andalusia will expand that capacity while leaving ship procurement to the actual naval production system."
 COLDWAR_SPR_naval_war_college:0 "Naval War College"
 COLDWAR_SPR_naval_war_college_desc:0 "Naval officers need a common framework for operations in two maritime theatres. A war college and fleet exercises will put the shipyard programme behind a usable doctrine."
 COLDWAR_SPR_joint_logistics:0 "Joint Logistics"
 COLDWAR_SPR_joint_logistics_desc:0 "The services should not maintain incompatible stores for every item they purchase. Common logistics will reduce unit supply demand while preserving the support costs of the chosen force structure."
 COLDWAR_SPR_service_oath:0 "The Service Oath"
 COLDWAR_SPR_service_oath_desc:0 "The armed forces must serve the recognised institutions of the state rather than individual patrons. A revised service oath and promotion code will support professional continuity through future changes of government."
 COLDWAR_SPR_diplomatic_review:0 "A Place in the World"
 COLDWAR_SPR_diplomatic_review_desc:0 "Spain trades and hosts American facilities while remaining outside the Atlantic alliance and the European Communities. A diplomatic review will separate practical agreements from the question of permanent alignment."
 COLDWAR_SPR_us_negotiation:0 "The US Agreement"
 COLDWAR_SPR_us_negotiation_desc:0 "Access to facilities is a negotiable bilateral arrangement rather than automatic NATO membership. Spain can seek clearer terms and compensation while the United States retains the right to reject the proposal."
 COLDWAR_SPR_nonaligned_access:0 "Restricted Facilities"
 COLDWAR_SPR_nonaligned_access_desc:0 "The government can limit external use of Spanish facilities while continuing ordinary commerce. Greater discretion preserves freedom of action at the expense of assistance tied to the basing relationship."
 COLDWAR_SPR_atlantic_contacts:0 "Atlantic Contacts"
 COLDWAR_SPR_atlantic_contacts_desc:0 "Military contacts can improve training before formal membership is politically possible. Spain will seek exercises and exchanges as agreements among governments, without claiming the alliance's collective guarantees."
 COLDWAR_SPR_mediterranean_contacts:0 "Mediterranean Contacts"
 COLDWAR_SPR_mediterranean_contacts_desc:0 "Cooperation with neighbouring states does not require a permanent bloc commitment. Diplomatic and commercial contacts can broaden Spain's options while leaving every government in control of its own undertakings."
 COLDWAR_SPR_european_trade:0 "The European Market"
 COLDWAR_SPR_european_trade_desc:0 "The European market matters to Spanish industry even while political membership is closed. A preferential trade arrangement can prepare firms for wider competition without granting a seat in the Communities."
 COLDWAR_SPR_european_application:0 "A European Application"
 COLDWAR_SPR_european_application_desc:0 "Membership requires a political settlement acceptable to the existing members and a lengthy adjustment of domestic institutions. An application begins negotiations rather than completing them."
 COLDWAR_SPR_european_independence:0 "European Trade"
 COLDWAR_SPR_european_independence_desc:0 "Spain can seek European commerce while retaining its own institutional arrangements. Industrial standards and a domestic adjustment fund can support that policy, though they cannot reproduce the rights of membership."
 COLDWAR_SPR_community_standards:0 "Community Standards"
 COLDWAR_SPR_community_standards_desc:0 "Admission gives Spain rights and obligations that require domestic administrative capacity. The state must implement the agreed standards before it can obtain the programme's industrial benefits."
 COLDWAR_SPR_atlantic_application:0 "The Atlantic Question"
 COLDWAR_SPR_atlantic_application_desc:0 "The alliance question divides parties and services as well as foreign governments. A public mandate and an accepted admission agreement are separate requirements for a durable commitment."
 COLDWAR_SPR_nato_standards:0 "Alliance Standards"
 COLDWAR_SPR_nato_standards_desc:0 "Collective planning is useful only when Spain is actually inside the alliance. The services will adopt common procedures through funded exercises while retaining responsibility for their own procurement."
 COLDWAR_SPR_nonbloc_doctrine:0 "Armed Independence"
 COLDWAR_SPR_nonbloc_doctrine_desc:0 "Independence requires the means to sustain national decisions rather than a declaration alone. Staff planning will concentrate on operating without guaranteed allied support."
 COLDWAR_SPR_sahara_talks:0 "The Saharan Question"
 COLDWAR_SPR_sahara_talks_desc:0 "The future of the Sahara involves its inhabitants, Spain and neighbouring states with incompatible claims. Negotiations must address administration, security and a political process without awarding another player's territory by focus."
 COLDWAR_SPR_sahara_transition:0 "A Supervised Transition"
 COLDWAR_SPR_sahara_transition_desc:0 "Spain can seek an agreed withdrawal timetable and political process under external supervision. Funding an orderly handover is a cost of ending the administration rather than a reward for disposing of it."
 COLDWAR_SPR_sahara_presence:0 "A Continued Presence"
 COLDWAR_SPR_sahara_presence_desc:0 "Maintaining an administration requires personnel, supplies and a defensible political mandate. A temporary continued presence will remain an expensive commitment subject to local and international opposition."
 COLDWAR_SPR_maghreb_dialogue:0 "Maghreb Dialogue"
 COLDWAR_SPR_maghreb_dialogue_desc:0 "Trade, migration and security link Spain to the southern shore. A regular diplomatic channel can manage disagreements without assuming that a single agreement resolves all territorial claims."
 COLDWAR_SPR_iberoamerican_links:0 "Ibero-American Links"
 COLDWAR_SPR_iberoamerican_links_desc:0 "Diplomatic ties across the Atlantic can support commercial and educational exchange. Spain must offer concrete cooperation rather than treating shared language as a claim to political obedience."
 COLDWAR_SPR_foreign_contracts:0 "Engineering Abroad"
 COLDWAR_SPR_foreign_contracts_desc:0 "Spanish engineering firms can compete for infrastructure contracts if finance and delivery terms are credible. Export credit will expose the lender to an actual obligation as well as a possible commercial return."
 COLDWAR_SPR_technical_exchange:0 "Technical Exchange"
 COLDWAR_SPR_technical_exchange_desc:0 "Scholarships and professional exchanges can create lasting links without a military treaty. The state will fund domestic places rather than promise research benefits on behalf of foreign participants."
 COLDWAR_SPR_diplomatic_service:0 "A Permanent Service"
 COLDWAR_SPR_diplomatic_service_desc:0 "A larger diplomatic agenda needs a professional service able to preserve agreements through changes of cabinet. Permanent officials will support that continuity while adding a visible administrative expense."
 COLDWAR_SPR_carlist_claims:0 "The Carlist Claims"
 COLDWAR_SPR_carlist_claims_desc:0 "Carlism contains rival dynastic and social visions rather than a single reliable bloc. The government can negotiate a limited coalition role without treating a disputed royal claim as a national mandate."
 COLDWAR_SPR_traditionalist_bargain:0 "Traditionalist Bargain"
 COLDWAR_SPR_traditionalist_bargain_desc:0 "Traditionalist representatives seek a monarchy bound to Catholic institutions and historic local rights. Their support can strengthen a conservative cabinet while committing it to protected local and social institutions."
 COLDWAR_SPR_social_federal_bargain:0 "Social-Federal Pact"
 COLDWAR_SPR_social_federal_bargain_desc:0 "The current around Carlos Hugo moves towards a federal and self-managed political project. Cooperation gives a reforming cabinet a distinctive regional and labour partner, but limits central executive discretion."
 COLDWAR_SPR_council_secretariat:0 "Council Secretariat"
 COLDWAR_SPR_council_secretariat_desc:0 "Carrero's governing machinery depends on files reaching the right ministers before rival families can obstruct them. A permanent secretariat will give the cabinet authority between meetings and reduce dependence on Franco's personal arbitration."
 COLDWAR_SPR_career_administrators:0 "Career Administrators"
 COLDWAR_SPR_career_administrators_desc:0 "The higher civil service contains capable specialists alongside men protected by political sponsors. Competitive promotion will place trained administrators in the ministries while narrowing the offices available to the Movement."
 COLDWAR_SPR_planning_commissariat:0 "Planning Commissariat"
 COLDWAR_SPR_planning_commissariat_desc:0 "López Rodó's planners want investment concentrated where infrastructure and skilled labour already exist. Binding ministries to the development plan will accelerate industrial construction while increasing the energy appetite of the growth model."
 COLDWAR_SPR_v2_mod_consumer_goods_factor_tt:0 "Consumer Goods Factories: $RIGHT|-=%1$"
 COLDWAR_SPR_provincial_bargain:0 "Provincial Bargain"
 COLDWAR_SPR_provincial_bargain_desc:0 "Provincial governors and syndicate officials demand that industry answer to the constituencies sustaining the regime. Their bargain ties production to provincial employment and household relief commitments, with a continuing charge on the social budget."
 COLDWAR_SPR_valladolid_suppliers:0 "Castilian Suppliers"
 COLDWAR_SPR_valladolid_suppliers_desc:0 "The automobile plants of inland Spain need a domestic network of workshops and component makers. State credit will establish a supplier complex in Castile rather than leave the development poles as isolated assembly sites."
 COLDWAR_SPR_provincial_services:0 "Provincial Services"
 COLDWAR_SPR_provincial_services_desc:0 "Provincial capitals cannot retain skilled workers when every commercial and administrative opportunity leads to Madrid. A new service centre in León will anchor the regime's promise of balanced development."
 COLDWAR_SPR_engineering_directors:0 "Engineering Directors"
 COLDWAR_SPR_engineering_directors_desc:0 "Public enterprises too often reward connections before technical competence. Appointing engineers to production boards will improve factory management and make ministers answer for the performance of their appointees."
 COLDWAR_SPR_syndical_arbitration:0 "Syndical Arbitration"
 COLDWAR_SPR_syndical_arbitration_desc:0 "The Vertical Syndicate can settle workplace disputes only if employers also accept enforceable obligations. A strengthened arbitration service will exchange wage guarantees for production agreements while preserving official representation."
 COLDWAR_SPR_applied_industry:0 "Applied Industry"
 COLDWAR_SPR_applied_industry_desc:0 "Spanish engineering schools should solve the problems encountered on domestic production lines. Contracts between the development authorities and technical institutes will turn industrial expansion into a base of local expertise."
 COLDWAR_SPR_rural_public_works:0 "Rural Public Works"
 COLDWAR_SPR_rural_public_works_desc:0 "The regime's rural supporters see the development poles advancing while their own districts lose people. Roads and utilities in Extremadura and La Mancha will make provincial employment promises more credible."
 COLDWAR_SPR_development_accounts:0 "Development Accounts"
 COLDWAR_SPR_development_accounts_desc:0 "The MATESA affair exposed how export promotion and official credit could conceal private favour. Published accounts for the development agencies will protect future investment without surrendering the cabinet's direction of the economy."
 COLDWAR_SPR_technical_scholarships:0 "Technical Scholarships"
 COLDWAR_SPR_technical_scholarships_desc:0 "Catholic educational networks and public technical schools train much of Spain's emerging professional class. Competitive scholarships will broaden that intake while giving the state a dependable supply of industrial specialists."
 COLDWAR_SPR_civilian_purchasing:0 "Civilian Purchasing"
 COLDWAR_SPR_civilian_purchasing_desc:0 "The service ministries should specify military needs without running separate commercial empires. A civilian purchasing board will consolidate contracts and reduce the supply burden created by incompatible orders."
 COLDWAR_SPR_commercial_registries:0 "Commercial Registries"
 COLDWAR_SPR_commercial_registries_desc:0 "Rapid growth has outpaced the registries that establish commercial obligations and property claims. Modern records will help Spanish firms obtain credit and let the treasury follow income beyond the old networks of influence."
 COLDWAR_SPR_inspect_the_poles:0 "Inspect the Poles"
 COLDWAR_SPR_inspect_the_poles_desc:0 "Development officials must inspect the use of power and machinery instead of merely approving ministerial targets. Technical inspections will cut waste in industrial consumption while preserving the output gained through public investment."
 COLDWAR_SPR_institutional_cabinet:0 "Institutional Cabinet"
 COLDWAR_SPR_institutional_cabinet_desc:0 "A durable continuity cabinet needs rules that survive the retirement of its patrons. Regular ministerial accounting and collective decisions will make administration more predictable without granting legal competition to the opposition."
 COLDWAR_SPR_movement_inspectorate:0 "Movement Inspectorate"
 COLDWAR_SPR_movement_inspectorate_desc:0 "The Movement inherited offices throughout Spain but lost much of their influence to technocrats and private notables. A political inspectorate will restore a chain of authority and require a larger salaried organization."
 COLDWAR_SPR_syndical_charter:0 "Syndical Charter"
 COLDWAR_SPR_syndical_charter_desc:0 "The Falangist promise of a syndical economy has long sat beside private privilege and ministerial bargaining. Giving official workplace bodies authority over investment will tie production to the Movement's social constituency."
 COLDWAR_SPR_martial_directorate:0 "Martial Directorate"
 COLDWAR_SPR_martial_directorate_desc:0 "Hardliners argue that the Movement can endure only beside a disciplined armed establishment. A joint political and military directorate will strengthen command at the cost of a more expensive permanent security apparatus."
 COLDWAR_SPR_asturian_workshops:0 "Asturian Workshops"
 COLDWAR_SPR_asturian_workshops_desc:0 "Asturian workers know that syndical speeches cannot replace modern machinery or secure orders. A publicly financed workshop complex will give the official labour settlement a material stake in industrial employment."
 COLDWAR_SPR_arsenal_contracts:0 "Arsenal Contracts"
 COLDWAR_SPR_arsenal_contracts_desc:0 "A military state cannot depend entirely on arsenals whose equipment and orders come from abroad. New Andalusian production contracts will expand domestic armaments capacity while binding the treasury to the directorate's priorities."
 COLDWAR_SPR_syndical_ownership:0 "Syndical Ownership"
 COLDWAR_SPR_syndical_ownership_desc:0 "Syndical boards will receive authority to reinvest the earnings of selected enterprises in their own industries. The arrangement rewards stable production but diverts resources from private consumption and gives political officials a lasting economic role."
 COLDWAR_SPR_reserve_instructors:0 "Reserve Instructors"
 COLDWAR_SPR_reserve_instructors_desc:0 "Veteran officers can prepare a reserve establishment without placing every recruit in a standing unit. Dedicated instructor cadres will shorten training and strengthen military competence within the Movement's organizations."
 COLDWAR_SPR_production_covenants:0 "Production Covenants"
 COLDWAR_SPR_production_covenants_desc:0 "The syndical councils need more than authority to issue orders. Negotiated production covenants will exchange employment security for investment and technical retraining under the official labour structure."
 COLDWAR_SPR_territorial_stores:0 "Territorial Stores"
 COLDWAR_SPR_territorial_stores_desc:0 "The directorate's territorial forces consume resources that must also sustain the regular army. Common depots and standardized requisitions will reduce that burden while making the mobilization system more dependable."
 COLDWAR_SPR_social_housing_boards:0 "Social Housing Boards"
 COLDWAR_SPR_social_housing_boards_desc:0 "Falangist social policy promises workers a visible share of national development without independent unions. Housing boards will negotiate household relief contributions with employers and commit the cabinet to the recurring costs of that bargain."
 COLDWAR_SPR_officers_state:0 "Officers' State"
 COLDWAR_SPR_officers_state_desc:0 "The military establishment will accept political responsibility only if its place in the state is secure. A formal service compact strengthens the directorate but leaves fewer civilian officials able to challenge military priorities."
 COLDWAR_SPR_municipal_delegates:0 "Municipal Delegates"
 COLDWAR_SPR_municipal_delegates_desc:0 "Movement delegates often know local patrons better than local accounts. Binding their appointment to municipal administration will improve revenue collection while keeping political authority in Madrid."
 COLDWAR_SPR_public_works_corps:0 "Public Works Corps"
 COLDWAR_SPR_public_works_corps_desc:0 "The regime's youth and labour organizations can undertake useful public work when engineers set the projects. Improvements to Galicia's roads will give mobilization a civilian purpose and connect neglected settlements."
 COLDWAR_SPR_public_accounts_court:0 "Public Accounts Court"
 COLDWAR_SPR_public_accounts_court_desc:0 "The Movement cannot credibly denounce privilege while its own officeholders enjoy protection from scrutiny. A public accounts court will pursue official enrichment and recover revenue, although its members remain politically appointed."
 COLDWAR_SPR_official_labour_bench:0 "Official Labour Bench"
 COLDWAR_SPR_official_labour_bench_desc:0 "Workers under official representation still need enforceable answers to injury, wages and dismissal. Specialist labour benches will support production agreements without allowing an independent trade-union movement."
 COLDWAR_SPR_movement_settlement:0 "Movement Settlement"
 COLDWAR_SPR_movement_settlement_desc:0 "The Movement will survive only if its institutions can deliver more than loyalty to an aging founder. A settled division of political, economic and service responsibilities will consolidate the chosen order while preserving its monopoly."
 COLDWAR_SPR_royal_civil_list:0 "Royal Civil List"
 COLDWAR_SPR_royal_civil_list_desc:0 "A governing Crown needs an accountable household rather than a new circle of private claimants. A defined civil list and published appointments will establish its administrative standing while creating a permanent court establishment."
 COLDWAR_SPR_household_executive:0 "Household Executive"
 COLDWAR_SPR_household_executive_desc:0 "An executive monarchy must give trusted royal secretaries enough authority to direct the ministries. Concentrating decisions in the household will make government faster while increasing the cost of maintaining parallel offices."
 COLDWAR_SPR_council_of_notables:0 "Council of Notables"
 COLDWAR_SPR_council_of_notables_desc:0 "Provincial and professional notables can give the Crown a broader base than the palace alone. Their council will improve the reach of government, although negotiated decisions leave the monarch with less freedom of action."
 COLDWAR_SPR_royal_command_staff:0 "Royal Command Staff"
 COLDWAR_SPR_royal_command_staff_desc:0 "The palace must know whether military advice represents operational need or the interests of competing commands. A professional royal staff will clarify orders and reduce waste within the forces sustaining the monarchy."
 COLDWAR_SPR_provincial_petitions:0 "Provincial Petitions"
 COLDWAR_SPR_provincial_petitions_desc:0 "Petitions to the Crown will be heard through provincial chambers instead of being lost in ministerial correspondence. This channel gives commercial and local interests practical access to government without making the council sovereign."
 COLDWAR_SPR_palace_patronage:0 "Palace Patronage"
 COLDWAR_SPR_palace_patronage_desc:0 "Royal patronage will support technical institutes that train the managers of Spanish industry. The palace gains a civilian constituency while the schools gain access to equipment and production problems beyond the court."
 COLDWAR_SPR_chambers_of_commerce:0 "Chambers of Commerce"
 COLDWAR_SPR_chambers_of_commerce_desc:0 "The chambers can coordinate smaller firms that rarely receive the attention of national planners. A shared investment service will accelerate industrial building while leaving ownership with provincial businesses."
 COLDWAR_SPR_crown_service_hub:0 "Crown Service Hub"
 COLDWAR_SPR_crown_service_hub_desc:0 "The palace's administrative programme needs civilian offices beyond its ceremonial rooms. A Madrid service centre will support its economic and professional patronage while placing a visible cost on executive rule."
 COLDWAR_SPR_leon_enterprise_fund:0 "León Enterprise Fund"
 COLDWAR_SPR_leon_enterprise_fund_desc:0 "A consultative monarchy must answer the provincial fear that prosperity belongs only to the coast. The León enterprise fund will finance a productive complex whose local shareholders have a stake in the new settlement."
 COLDWAR_SPR_royal_service_code:0 "Royal Service Code"
 COLDWAR_SPR_royal_service_code_desc:0 "Service to the Crown cannot become an excuse for salaries and privileges detached from useful work. A common code will professionalize the household and military service establishments without surrendering their loyalty to the monarch."
 COLDWAR_SPR_municipal_concord:0 "Municipal Concord"
 COLDWAR_SPR_municipal_concord_desc:0 "The council's notables want visible commitments to the households sustaining the local economy. A municipal relief compact will bind employers and the cabinet to continuing social contributions in return for a lower burden on consumption."
 COLDWAR_SPR_catholic_social_work:0 "Catholic Social Work"
 COLDWAR_SPR_catholic_social_work_desc:0 "Church charities and lay associations can mediate a relief compact with families suspicious of a distant palace. The Crown will support their household commitments through continuing social contributions and gain a stronger local constituency."
 COLDWAR_SPR_professional_charters:0 "Professional Charters"
 COLDWAR_SPR_professional_charters_desc:0 "Doctors, engineers and legal professionals want recognition that does not make every appointment a court favour. Revised charters will strengthen their standards and improve the services on which commercial life depends."
 COLDWAR_SPR_crown_audit_office:0 "Crown Audit Office"
 COLDWAR_SPR_crown_audit_office_desc:0 "A monarchy asking for national confidence must make its own contractors answerable to scrutiny. Independent accounting within the royal administration will protect revenue and expose the favours traded in the Crown's name."
 COLDWAR_SPR_governing_crown:0 "A Governing Crown"
 COLDWAR_SPR_governing_crown_desc:0 "Royal government now rests on an established relationship with the officers, notables and professions. Regular consultation and a clear division of administrative duties will make the Crown's chosen form of rule more predictable."
 COLDWAR_SPR_coalition_secretariat:0 "Coalition Secretariat"
 COLDWAR_SPR_coalition_secretariat_desc:0 "Suárez's centre gathers reformists who agree on governing together more readily than on a common social programme. A joint cabinet secretariat will settle ministerial responsibilities before coalition rivalries paralyse ordinary government."
 COLDWAR_SPR_christian_social_pact:0 "Christian Social Pact"
 COLDWAR_SPR_christian_social_pact_desc:0 "Social Catholics in the centre seek a settlement that shares the burden of adjustment without abandoning private enterprise. Binding workplace and household relief commitments will strengthen industrial cooperation while increasing recurring social expenditure."
 COLDWAR_SPR_liberal_cabinet:0 "Liberal Cabinet"
 COLDWAR_SPR_liberal_cabinet_desc:0 "The coalition's liberal ministers argue that administrative protection has become an obstacle to productive investment. Faster licensing and commercial competition will expand industrial building while reducing protected sources of public revenue."
 COLDWAR_SPR_worker_guarantees:0 "Worker Guarantees"
 COLDWAR_SPR_worker_guarantees_desc:0 "Workers will accept a negotiated centre only when dismissal and representation have clear legal remedies. Labour guarantees will support stable factory relations, though employers will have less freedom to shift the social cost of adjustment."
 COLDWAR_SPR_enterprise_licences:0 "Enterprise Licences"
 COLDWAR_SPR_enterprise_licences_desc:0 "A business seeking permission from several ministries can survive only through time or connections. A single commercial licence and common accounts will give smaller firms a practical route into Spain's service economy."
 COLDWAR_SPR_regional_employment:0 "Regional Employment"
 COLDWAR_SPR_regional_employment_desc:0 "The centre's social compact must reach the industrial districts where unemployment can destroy political confidence. A Basque supplier complex will preserve productive employment without placing the whole sector under state ownership."
 COLDWAR_SPR_valencian_enterprise:0 "Valencian Enterprise"
 COLDWAR_SPR_valencian_enterprise_desc:0 "Valencia's manufacturers and merchants need business services suited to smaller firms rather than national monopolies. A commercial service centre will support export administration, finance and professional work within the region."
 COLDWAR_SPR_vocational_accord:0 "Vocational Accord"
 COLDWAR_SPR_vocational_accord_desc:0 "Employers, unions and technical schools can share the burden of retraining workers displaced by industrial change. A vocational accord will turn the social compact into better industrial practice instead of merely preserving obsolete positions."
 COLDWAR_SPR_competitive_contracts:0 "Competitive Contracts"
 COLDWAR_SPR_competitive_contracts_desc:0 "Public procurement should not preserve a closed circle of suppliers simply because they already know the ministries. Competitive tenders will reward efficient producers while removing a dependable instrument of coalition patronage."
 COLDWAR_SPR_family_allowances:0 "Family Income Compact"
 COLDWAR_SPR_family_allowances_desc:0 "The Christian social wing wants family responsibilities recognized in the government's economic bargain. A household relief compact will lower the burden on consumption while committing the cabinet to continuing social contributions through the next downturn."
 COLDWAR_SPR_taxpayer_compact:0 "Taxpayer Compact"
 COLDWAR_SPR_taxpayer_compact_desc:0 "The liberal wing cannot finance government by cutting rates while leaving evasion untouched. A compact of simpler obligations and credible inspection will recover revenue from a broader base of firms."
 COLDWAR_SPR_professional_police:0 "Professional Police"
 COLDWAR_SPR_professional_police_desc:0 "The centre needs public order without allowing the security services to determine its programme. Professional command and civilian purchasing will reduce unnecessary military burdens while demonstrating that ministers can direct the state."
 COLDWAR_SPR_municipal_capacity:0 "Municipal Capacity"
 COLDWAR_SPR_municipal_capacity_desc:0 "Local councils face demands that their staffing and records were never designed to meet. Better municipal administration will improve commercial services without forcing every practical decision back through Madrid."
 COLDWAR_SPR_parliamentary_reports:0 "Parliamentary Reports"
 COLDWAR_SPR_parliamentary_reports_desc:0 "Coalition ministers must explain what their departments are achieving rather than shelter behind agreements between party leaders. Regular parliamentary reports will expose failed contracts and strengthen the treasury's claim on public revenue."
 COLDWAR_SPR_cabinet_responsibility:0 "Cabinet Responsibility"
 COLDWAR_SPR_cabinet_responsibility_desc:0 "The centre can remain a governing force only if its component parties accept the consequences of a common programme. Collective cabinet responsibility will turn the chosen settlement into a durable basis for administration."
 COLDWAR_SPR_ministerial_authority:0 "Ministerial Authority"
 COLDWAR_SPR_ministerial_authority_desc:0 "Fraga's conservatives promise a state capable of enforcing its own decisions. Clear ministerial responsibility will restore authority over officials while making the government answer for the competence of those it appoints."
 COLDWAR_SPR_civil_service_statute:0 "Civil Service Statute"
 COLDWAR_SPR_civil_service_statute_desc:0 "Public officials should owe their careers to the administration rather than to a succession of political patrons. A conservative service statute will protect professional appointments and require firmer accounting for public money."
 COLDWAR_SPR_public_authority:0 "Public Authority"
 COLDWAR_SPR_public_authority_desc:0 "The state wing of the right sees dependable institutions and strategic production as the foundations of national strength. It will retain public industrial direction while accepting the administrative expense that this responsibility brings."
 COLDWAR_SPR_property_owning_spain:0 "Property-Owning Spain"
 COLDWAR_SPR_property_owning_spain_desc:0 "The enterprise wing wants a broad conservative electorate with a stake in private ownership. Lower burdens on investment and family consumption will strengthen that coalition while narrowing the treasury's immediate revenue base."
 COLDWAR_SPR_strategic_production:0 "Strategic Production"
 COLDWAR_SPR_strategic_production_desc:0 "Retaining national control of strategic supply requires factories that can meet military contracts at home. A Castilian armaments complex will support that commitment and make its financial cost visible in the budget."
 COLDWAR_SPR_small_firm_credit:0 "Small-Firm Credit"
 COLDWAR_SPR_small_firm_credit_desc:0 "Spanish family firms often possess customers and skills but lack access to commercial finance. A Galician service centre will bring lending, accounting and export administration within their reach."
 COLDWAR_SPR_national_supply_board:0 "National Supply Board"
 COLDWAR_SPR_national_supply_board_desc:0 "State ownership has little value when each ministry places incompatible orders through its own favoured suppliers. A national supply board will standardize contracts and improve the forces' ability to sustain their equipment."
 COLDWAR_SPR_competitive_ownership:0 "Competitive Ownership"
 COLDWAR_SPR_competitive_ownership_desc:0 "Privatization should replace ministerial protection with firms that can survive open competition. Transparent sales and competition rules will improve civilian productivity without granting another permanent monopoly to well-connected buyers."
 COLDWAR_SPR_procurement_engineers:0 "Procurement Engineers"
 COLDWAR_SPR_procurement_engineers_desc:0 "The ministries need engineers who can judge a contract before accepting its equipment. Technical procurement teams will improve industrial practice and give the armed forces a more capable professional counterpart."
 COLDWAR_SPR_simplify_business_tax:0 "Simplify Business Tax"
 COLDWAR_SPR_simplify_business_tax_desc:0 "A conservative enterprise programme cannot rely on rate reductions alone. Simpler accounts and enforceable payment obligations will recover revenue as more Spanish firms enter the formal commercial economy."
 COLDWAR_SPR_family_provision:0 "Family Responsibility"
 COLDWAR_SPR_family_provision_desc:0 "Conservative social policy asks households to carry a large share of economic and family responsibilities. A relief compact with their employers will lower the burden on consumption while placing a continuing obligation on the cabinet's social budget."
 COLDWAR_SPR_contractual_security:0 "Contractual Security"
 COLDWAR_SPR_contractual_security_desc:0 "Property and commercial contracts need timely enforcement rather than ceremonial declarations of support. Specialist commercial administration will strengthen service-sector confidence and reduce the influence of private intermediaries."
 COLDWAR_SPR_municipal_inspection:0 "Municipal Inspection"
 COLDWAR_SPR_municipal_inspection_desc:0 "The right's municipal organization cannot be exempt from the standards it demands of national ministries. A common inspection service will protect local revenue and make service contracts easier to scrutinize."
 COLDWAR_SPR_responsible_right:0 "A Responsible Right"
 COLDWAR_SPR_responsible_right_desc:0 "A lasting conservative government needs both competent public authority and confidence among private citizens. Cabinet responsibility will settle how the chosen programme is carried through the institutions of the state."
 COLDWAR_SPR_citizen_service:0 "Citizen Service"
 COLDWAR_SPR_citizen_service_desc:0 "The liberal centre must distinguish itself from both ministerial paternalism and the politics of entrenched patrons. A citizen service charter will make public decisions easier to contest and commercial administration more predictable."
 COLDWAR_SPR_open_accounts:0 "Open Accounts"
 COLDWAR_SPR_open_accounts_desc:0 "Citizens cannot judge government when public contracts disappear into inaccessible accounts. Open departmental records will expose waste and give the treasury a firmer claim on unreported commercial income."
 COLDWAR_SPR_commercial_freedom:0 "Commercial Freedom"
 COLDWAR_SPR_commercial_freedom_desc:0 "Professional restrictions and ministerial permissions still protect established firms from new entrants. Removing unnecessary barriers will let business services grow while reducing the workload created by official licensing."
 COLDWAR_SPR_competitive_credit:0 "Competitive Credit"
 COLDWAR_SPR_competitive_credit_desc:0 "The market wing wants credit to follow viable enterprises rather than official development priorities. Wider banking competition will accelerate investment while reducing the revenue captured through protected financial channels."
 COLDWAR_SPR_civic_devolution:0 "Civic Devolution"
 COLDWAR_SPR_civic_devolution_desc:0 "The civic wing argues that freedom requires capable local institutions as well as private markets. Delegated administration will improve commercial services and bind the cabinet to local household relief commitments with continuing social costs."
 COLDWAR_SPR_merchant_finance:0 "Merchant Finance"
 COLDWAR_SPR_merchant_finance_desc:0 "Catalonia's merchants and manufacturers need independent financial services that can evaluate their actual business. A new commercial centre will deepen those services without turning the cabinet into an industrial proprietor."
 COLDWAR_SPR_local_enterprise:0 "Local Enterprise"
 COLDWAR_SPR_local_enterprise_desc:0 "Decentralized government needs productive districts able to support their own services. A supplier complex in La Mancha will give local firms an economic base beyond contracts distributed by Madrid."
 COLDWAR_SPR_competition_tribunal:0 "Competition Tribunal"
 COLDWAR_SPR_competition_tribunal_desc:0 "Open credit will achieve little if dominant firms can keep competitors outside the market. A competition tribunal will challenge exclusive arrangements and improve the productivity of civilian producers."
 COLDWAR_SPR_municipal_scholarships:0 "Municipal Scholarships"
 COLDWAR_SPR_municipal_scholarships_desc:0 "Local authorities can identify students and firms neglected by the central development bureaucracy. Scholarships tied to technical colleges will support industrial learning while retaining talent outside the largest cities."
 COLDWAR_SPR_equal_tax_obligations:0 "Equal Tax Obligations"
 COLDWAR_SPR_equal_tax_obligations_desc:0 "Liberal government needs a tax system that does not reserve exemptions for the most influential taxpayers. Equal obligations and simpler assessment will strengthen revenue while reducing administrative friction."
 COLDWAR_SPR_civilian_personnel:0 "Civilian Personnel"
 COLDWAR_SPR_civilian_personnel_desc:0 "Civilian tasks should not require an expanding uniformed establishment. Returning routine administration to trained civil servants will reduce military personnel expense and clarify responsibility within the ministries."
 COLDWAR_SPR_enterprise_training:0 "Enterprise Training"
 COLDWAR_SPR_enterprise_training_desc:0 "Spanish firms need practical management and production skills more than another permanent subsidy. A joint training programme will help enterprises adapt their methods and bring new techniques into ordinary production."
 COLDWAR_SPR_liberal_public_service:0 "Liberal Public Service"
 COLDWAR_SPR_liberal_public_service_desc:0 "An effective liberal state must be able to carry out the limited duties it accepts. Professional public service and open cabinet decisions will give the centre a governing identity beyond its founding personalities."
 COLDWAR_SPR_socialist_cabinet:0 "Cabinet Coordination"
 COLDWAR_SPR_socialist_cabinet_desc:0 "The Socialists inherit ministries built for bargaining among elites rather than carrying out an elected social programme. A coordinated cabinet will give ministers a common mandate and make the civil service answer for its delivery."
 COLDWAR_SPR_negotiated_reconversion:0 "Industrial Renewal"
 COLDWAR_SPR_negotiated_reconversion_desc:0 "The reformist wing believes Spanish industry must modernize even when obsolete plants cannot survive. Negotiated reconversion will concentrate investment in viable production while requiring costly support for displaced workers."
 COLDWAR_SPR_labour_control:0 "Labour Control"
 COLDWAR_SPR_labour_control_desc:0 "The labour wing wants the workers who built Spanish industry to share authority over its future. Employee boards and employment guarantees will improve cooperation while redirecting resources from private consumption into industrial commitments."
 COLDWAR_SPR_new_industrial_jobs:0 "New Industrial Jobs"
 COLDWAR_SPR_new_industrial_jobs_desc:0 "Industrial adjustment cannot be defended with promises of future employment alone. An Andalusian production complex will create a modern base for workers and suppliers outside the old northern industrial belt."
 COLDWAR_SPR_workers_enterprises:0 "Workers' Enterprises"
 COLDWAR_SPR_workers_enterprises_desc:0 "Worker participation needs successful enterprises rather than boards administering permanent decline. A new Asturian production complex will put public finance behind the labour wing's employment and ownership settlement."
 COLDWAR_SPR_conversion_scholarships:0 "Conversion Schools"
 COLDWAR_SPR_conversion_scholarships_desc:0 "Workers leaving an old trade need a recognized route into new production. Technical conversion schools will connect industrial research with retraining rather than allowing adjustment to become a sentence of permanent unemployment."
 COLDWAR_SPR_collective_bargaining:0 "Collective Bargaining"
 COLDWAR_SPR_collective_bargaining_desc:0 "Industry-wide agreements can give worker participation influence beyond a handful of public plants. Negotiated household relief and production commitments will lower the burden on consumption while widening the obligations financed through social expenditure."
 COLDWAR_SPR_industrial_accounts:0 "Industrial Accounts"
 COLDWAR_SPR_industrial_accounts_desc:0 "Public support for reconversion must buy productive capacity rather than conceal losses indefinitely. Published industrial accounts will improve the management of surviving firms and tighten the treasury's claim on their earnings."
 COLDWAR_SPR_cooperative_technology:0 "Cooperative Technology"
 COLDWAR_SPR_cooperative_technology_desc:0 "Worker-controlled enterprises still need access to modern industrial methods. A cooperative technical service will spread new production practices without placing every workshop under a ministry's direct management."
 COLDWAR_SPR_productive_compact:0 "Productive Compact"
 COLDWAR_SPR_productive_compact_desc:0 "Employers, public managers and organised labour must know which commitments will survive the next cabinet meeting. A productive compact will settle the chosen industrial programme and provide an orderly basis for wage negotiations."
 COLDWAR_SPR_social_service_rights:0 "Household Relief Pact"
 COLDWAR_SPR_social_service_rights_desc:0 "The Socialists want the burden of economic adjustment shared with the households expected to endure it. The cabinet will bind itself to household relief commitments that lower the burden on consumption and require continuing contributions from the social budget."
 COLDWAR_SPR_andalusian_services:0 "Andalusian Services"
 COLDWAR_SPR_andalusian_services_desc:0 "Andalusia's growing towns need professional and administrative employment alongside seasonal work. A service centre will support the institutions required to deliver the Socialist social programme locally."
 COLDWAR_SPR_progressive_assessment:0 "Progressive Assessment"
 COLDWAR_SPR_progressive_assessment_desc:0 "New household commitments cannot rest on the same narrow and uneven tax base. Stronger assessment of corporate and professional income will finance the cabinet's social obligations while requiring a larger corps of trained inspectors."
 COLDWAR_SPR_municipal_social_work:0 "Municipal Social Work"
 COLDWAR_SPR_municipal_social_work_desc:0 "A distant ministry cannot coordinate every agreement between employers and community organizations in rapidly growing urban districts. Professional municipal offices will administer those commitments more efficiently and strengthen the local service economy."
 COLDWAR_SPR_civil_defence_ministry:0 "Civil Defence Ministry"
 COLDWAR_SPR_civil_defence_ministry_desc:0 "Socialist ministers must establish civilian responsibility without treating every officer as a political opponent. A professional civilian defence ministry will clarify command and move routine administration out of the uniformed establishment."
 COLDWAR_SPR_service_accommodation:0 "Service Accommodation"
 COLDWAR_SPR_service_accommodation_desc:0 "A negotiated service compact can secure professional cooperation while the government carries out its social programme. Protecting military careers will improve command confidence but preserve a more expensive officer establishment."
 COLDWAR_SPR_public_procurement:0 "Public Procurement"
 COLDWAR_SPR_public_procurement_desc:0 "Every department should purchase through public rules rather than through the networks inherited with its offices. Competitive procurement will strengthen services and reduce the waste that can discredit an ambitious social government."
 COLDWAR_SPR_socialist_administration:0 "Socialist Ministries"
 COLDWAR_SPR_socialist_administration_desc:0 "The Socialist programme now joins a chosen industrial settlement to funded public institutions and civilian responsibility. A settled administration will make these commitments dependable beyond the first years of reform."
 COLDWAR_SPR_coalition_labour_board:0 "Coalition Labour Board"
 COLDWAR_SPR_coalition_labour_board_desc:0 "The Communist-led left brings workplace organization into government but must administer a state shared with other political traditions. A coalition labour board will coordinate its programme and make commitments to organised workers explicit."
 COLDWAR_SPR_workplace_representation:0 "Workplace Delegates"
 COLDWAR_SPR_workplace_representation_desc:0 "Factory delegates need a lawful place in public decisions rather than an expectation that clandestine discipline will suffice. Recognized representation will improve industrial cooperation while increasing the obligations accepted toward workers."
 COLDWAR_SPR_worker_democracy:0 "Worker Democracy"
 COLDWAR_SPR_worker_democracy_desc:0 "The reconciliation wing seeks change through elected workplace institutions and negotiated agreements. Giving workers authority within competing enterprises will improve production without concentrating every investment decision in a ministry."
 COLDWAR_SPR_public_planning:0 "Public Planning"
 COLDWAR_SPR_public_planning_desc:0 "The planning wing argues that private investment cannot meet Spain's industrial and social needs. Public direction will accelerate industrial construction while placing heavier energy demands on a more concentrated production programme."
 COLDWAR_SPR_cooperative_credit:0 "Cooperative Credit"
 COLDWAR_SPR_cooperative_credit_desc:0 "Small cooperatives need accounts, finance and commercial services if workplace democracy is to survive outside the largest factories. A Valencian service centre will support that network without making every enterprise a state department."
 COLDWAR_SPR_public_engineering:0 "Public Engineering"
 COLDWAR_SPR_public_engineering_desc:0 "A planned economy needs its own machinery and engineering capacity rather than a larger list of targets. A Basque industrial complex will place productive assets behind the public investment programme."
 COLDWAR_SPR_sectoral_agreements:0 "Sectoral Agreements"
 COLDWAR_SPR_sectoral_agreements_desc:0 "Negotiated sector agreements can prevent competition from being paid for entirely by workers' households. Common relief and production commitments will lower the burden on consumption while requiring continuing government contributions to the settlement."
 COLDWAR_SPR_enterprise_plans:0 "Enterprise Plans"
 COLDWAR_SPR_enterprise_plans_desc:0 "Public managers must translate national priorities into feasible production plans. Enterprise-level targets and technical accounting will improve industrial efficiency, though the planning apparatus will require a larger administrative staff."
 COLDWAR_SPR_cooperative_institutes:0 "Cooperative Institutes"
 COLDWAR_SPR_cooperative_institutes_desc:0 "Workplace ownership needs technical knowledge that cannot remain the privilege of a few large firms. Cooperative institutes will spread industrial methods and help elected boards judge the advice they receive."
 COLDWAR_SPR_planned_technology:0 "Planned Technology"
 COLDWAR_SPR_planned_technology_desc:0 "Industrial planning will fail if technical renewal comes last in the allocation of resources. A dedicated research commitment will modernize production while preserving public control of its direction."
 COLDWAR_SPR_public_dividend:0 "Public Dividend"
 COLDWAR_SPR_public_dividend_desc:0 "Public support and worker participation should return part of rising enterprise income to society. A defined public dividend will strengthen revenue without allowing ministries to substitute opaque levies for published accounts."
 COLDWAR_SPR_municipal_left:0 "Municipal Left"
 COLDWAR_SPR_municipal_left_desc:0 "The left's neighbourhood organizations confront housing and service problems that industrial ministries cannot settle. Giving municipal administrations trained staff will improve local services while keeping their accounts open to public scrutiny."
 COLDWAR_SPR_working_districts:0 "Working Districts"
 COLDWAR_SPR_working_districts_desc:0 "Madrid's working districts need professional employment and public institutions alongside factories and crowded housing. A local service centre will put the municipal programme on a more durable economic footing."
 COLDWAR_SPR_tenant_provision:0 "Tenant Relief Compact"
 COLDWAR_SPR_tenant_provision_desc:0 "The left cannot ask tenants to wait for industrial gains while household obligations consume their income. A relief compact with neighbourhood and employer organizations will lower the burden on consumption while carrying a continuing cost for the social budget."
 COLDWAR_SPR_civilian_service_board:0 "Civilian Service Board"
 COLDWAR_SPR_civilian_service_board_desc:0 "Military administration must be brought under accountable civilian direction without replacing professional competence with party membership. A civilian service board will reduce redundant uniformed posts and keep supply decisions within the public accounts."
 COLDWAR_SPR_technical_public_service:0 "Technical Civil Corps"
 COLDWAR_SPR_technical_public_service_desc:0 "A government committed to social ownership cannot dispense with trained administrators and commercial records. Professional public service will improve economic administration and preserve tax revenue beyond the first wave of political enthusiasm."
 COLDWAR_SPR_plural_left_cabinet:0 "Plural Left Cabinet"
 COLDWAR_SPR_plural_left_cabinet_desc:0 "A Communist-led cabinet must hold together workers, municipal reformers and independent left allies. Published cabinet agreements will make its chosen programme dependable without demanding that every coalition partner surrender its identity."
