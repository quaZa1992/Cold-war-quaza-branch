l_english:
 # IMPERIA COLD WAR — PMC start-date access and Game Controller override.
 ICW_pmc_gc_open: "PMC Contracts: Open Market"
 ICW_pmc_gc_open_desc: "Authorize private military contracting for this campaign. Countries may engage available companies under their normal contract terms."
 ICW_pmc_gc_close: "PMC Contracts: Close Market"
 ICW_pmc_gc_close_desc: "Suspend new private military contracts and cancel pending unit recruitment. Existing formations remain in service until dismissed, and their weekly charges continue. Signed service agreements retain their existing terms."
 ICW_pmc_dismiss_existing_units: "Terminate Remaining PMC Unit Contracts"
 ICW_pmc_dismiss_existing_units_desc: "Withdraw all remaining contracted private military formations and end their associated weekly charges."
