 COLDWAR_CHL_political_transition:0 "Chile: Political Transition"
 COLDWAR_CHL_political_transition_desc:0 "The armed forces remain divided over intervention in politics. A civilian government can seek an agreement with the officer corps or prepare a break with constitutional rule."
 COLDWAR_CHL_prepare_military_intervention:0 "Secure the Officer Corps"
 COLDWAR_CHL_prepare_military_intervention_desc:0 "Build officer backing over 90 days at a cost of 100 political power. The service chiefs will then demand a settlement: retain civilian government through constitutional guarantees, or allow a military takeover. Once in government, the junta can retain collective authority or place Augusto Pinochet at its head. Preparations can proceed under any civilian administration. They end if civilian authority falls, Chile becomes a subject, capitulates or enters civil war, or Santiago is lost; political power is not recovered."
