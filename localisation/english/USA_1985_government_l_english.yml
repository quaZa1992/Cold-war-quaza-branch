l_english:
 USA_1985_second_reagan_administration: "The Second Reagan Administration"
 USA_1985_second_reagan_administration_desc: "Reagan begins 1985 with a strong mandate, a recovering economy, and a Cold War agenda that links domestic credibility to global pressure against the Soviet bloc. The administration must keep growth alive while Congress watches deficits, taxes, and defense spending."
 USA_1985_morning_in_america: "Morning in America"
 USA_1985_morning_in_america_desc: "The recession has passed, inflation has fallen, and the administration can turn confidence into policy momentum. Growth is real, but the deficit and the strong dollar still decide how long the optimism lasts."
 USA_1985_finish_volcker_disinflation: "Finish Volcker's Disinflation"
 USA_1985_finish_volcker_disinflation_desc: "The Federal Reserve broke the inflationary spiral at enormous political cost. Holding the line in 1985 lets Washington shift from crisis rates to a more durable investment climate."
 USA_1985_sunbelt_recovery: "The Sunbelt Recovery"
 USA_1985_sunbelt_recovery_desc: "Defense orders, housing, services, and migration keep the Sunbelt moving. Targeted infrastructure and industrial capacity can turn the recovery into a regional power base."
 USA_1985_plaza_coordination: "Plaza Coordination"
 USA_1985_plaza_coordination_desc: "A coordinated exchange-rate response with allied finance ministries can cool the strong-dollar problem, protect exporters, and show that American economic leadership still organizes the capitalist world."
 USA_1985_treasury_tax_simplification: "Treasury Tax Simplification"
 USA_1985_treasury_tax_simplification_desc: "Treasury's reform plan promises lower rates, fewer loopholes, and a cleaner code. It is politically painful, but it gives Reaganomics a second-term legislative target."
 USA_1985_broaden_the_base: "Broaden the Base"
 USA_1985_broaden_the_base_desc: "Closing deductions and shelters raises revenue without openly abandoning the tax-cut settlement. Businesses and high-income households will complain, but the state gets a cleaner tax machine."
 USA_1985_lower_marginal_rates: "Lower Marginal Rates"
 USA_1985_lower_marginal_rates_desc: "Lower headline rates are the political prize of tax reform. They buy confidence and investment, while the broader base keeps the reform from becoming a simple giveaway."
 USA_1985_gramm_rudman_hollings: "Gramm-Rudman-Hollings"
 USA_1985_gramm_rudman_hollings_desc: "Automatic deficit targets can force discipline onto Congress and the executive branch alike. The mechanism is blunt, but the bond market and conservative caucus want proof that Washington can say no."
 USA_1985_domestic_spending_showdown: "Domestic Spending Showdown"
 USA_1985_domestic_spending_showdown_desc: "Budget control becomes a fight over programs, agencies, and the size of the federal state. Winning the confrontation saves money, but it burns stability and social trust."
 USA_1985_protect_defense_buildup: "Protect the Defense Buildup"
 USA_1985_protect_defense_buildup_desc: "The administration will not balance the budget by disarming in front of Moscow. The Pentagon keeps its modernization drive, while the domestic side absorbs more of the fiscal pain."
 USA_1985_steel_and_microchip_orders: "Steel and Microchip Orders"
 USA_1985_steel_and_microchip_orders_desc: "Cold War procurement runs through foundries, machine tools, shipyards, electronics, and early semiconductor capacity. Defense demand can preserve strategic industry while civilian manufacturing adjusts."
 USA_1985_reaganomics_consolidated: "Reaganomics Consolidated"
 USA_1985_reaganomics_consolidated_desc: "Tax reform, deficit discipline, disinflation, allied currency coordination, and protected defense spending are fused into a second-term settlement. It is not painless, but it gives the United States a stronger economic platform for late Cold War dominance."

 USA_1985_second_reagan_administration_idea: "Second Reagan Administration"
 USA_1985_second_reagan_administration_idea_desc: "The White House enters the second term with a clear conservative mandate, stronger party discipline, and a promise that American recovery at home will support American pressure abroad."
 USA_1985_morning_in_america_idea: "Morning in America"
 USA_1985_morning_in_america_idea_desc: "Falling inflation and restored confidence are feeding investment, production, and consumer optimism. The recovery is becoming a political asset."
 USA_1985_tax_reform_momentum_idea: "Tax Reform Momentum"
 USA_1985_tax_reform_momentum_idea_desc: "The administration is spending political capital to simplify the tax code, broaden the base, and create room for lower marginal rates."
 USA_1985_deficit_control_act_idea: "Deficit Control Act"
 USA_1985_deficit_control_act_idea_desc: "Automatic deficit targets put pressure on federal spending. The numbers improve, but the politics become harsher."
 USA_1985_plaza_coordination_idea: "Plaza Coordination"
 USA_1985_plaza_coordination_idea_desc: "Allied currency coordination protects American exporters and reinforces Washington's role as manager of the Western economic order."
 USA_1985_defense_buildup_idea: "Protected Defense Buildup"
 USA_1985_defense_buildup_idea_desc: "The defense modernization drive is shielded from deficit politics. It strengthens the military-industrial base while keeping budget pressure alive."
 USA_1985_reaganomics_settlement_idea: "Reaganomics Settlement"
 USA_1985_reaganomics_settlement_idea_desc: "The second-term economic program has hardened into a governing settlement: lower rates, broader taxes, deficit rules, strategic procurement, and renewed confidence in American power."

