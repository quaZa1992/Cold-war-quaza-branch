 COLDWAR_FRA_psu_workers_councils: "Workers' Councils"
 COLDWAR_FRA_psu_workers_councils_desc: "Factory workers' councils run the shop floor, lifting output but taxing profits."
 COLDWAR_FRA_psu_the_independent_left: "The Independent Left"
 COLDWAR_FRA_psu_the_independent_left_desc: "A small independent socialist party gains weight in politics at the price of heavier administration."
 COLDWAR_FRA_psu_we_make_we_sell: "We Make, We Sell"
 COLDWAR_FRA_psu_we_make_we_sell_desc: "The LIP model of workers producing and selling their own goods spreads through the factories."
 COLDWAR_FRA_psu_the_second_left: "The Second Left"
 COLDWAR_FRA_psu_the_second_left_desc: "The modernising Second Left brings new ideas and revenue but also a heavier bureaucracy."
 COLDWAR_FRA_psu_the_cooperative_movement: "The Cooperative Movement"
 COLDWAR_FRA_psu_the_cooperative_movement_desc: "Workers' cooperatives take root across France, supporting households and construction at the cost of corporate tax revenue."
 COLDWAR_FRA_psu_women_at_work: "Women at Work"
 COLDWAR_FRA_psu_women_at_work_desc: "More women in paid work raise household taxes and productivity but increase social spending."
 COLDWAR_FRA_psu_eco_socialism: "Eco-Socialism"
 COLDWAR_FRA_psu_eco_socialism_desc: "A socialism that counts ecological limits makes France less dependent on oil prices."
 COLDWAR_FRA_psu_the_non_violent_republic: "The Non-Violent Republic"
 COLDWAR_FRA_psu_the_non_violent_republic_desc: "A non-violent approach to order cuts police costs and builds public trust, while the army costs more."
 COLDWAR_FRA_psu_change_life_from_below: "Change Life from Below"
 COLDWAR_FRA_psu_change_life_from_below_desc: "Self-management from below changes everyday life in factories, towns and institutions."
 COLDWAR_FRA_ecol_the_sober_economy: "The Sober Economy"
 COLDWAR_FRA_ecol_the_sober_economy_desc: "A sober economy of small farms and short circuits cuts oil dependence and consumption at the cost of growth."
 COLDWAR_FRA_ecol_the_green_apparatus: "The Green Apparatus"
 COLDWAR_FRA_ecol_the_green_apparatus_desc: "A professional ecologist party apparatus gives the movement discipline at a bureaucratic price."
 COLDWAR_FRA_ecol_the_atom_free_republic: "The Atom-Free Republic"
 COLDWAR_FRA_ecol_the_atom_free_republic_desc: "France abandons nuclear power, gaining stability and savings while reactor building slows sharply."
 COLDWAR_FRA_ecol_the_nuclear_pause: "The Nuclear Pause"
 COLDWAR_FRA_ecol_the_nuclear_pause_desc: "A nuclear pause calms the public and frees research while reactor building slows."
 COLDWAR_FRA_ecol_the_public_inquiry: "The Public Inquiry"
 COLDWAR_FRA_ecol_the_public_inquiry_desc: "The public inquiry at Creys-Malville strengthens the government's standing while special projects slow."
 COLDWAR_FRA_ecol_chasse_au_gaspi: "Chasse au gaspi"
 COLDWAR_FRA_ecol_chasse_au_gaspi_desc: "The hunt against energy waste cuts oil dependence and consumption at the cost of some growth."
 COLDWAR_FRA_ecol_the_conservatoire_du_littoral: "The Conservatoire du littoral"
 COLDWAR_FRA_ecol_the_conservatoire_du_littoral_desc: "Protecting the coast brings tourism income and taxes but slows construction."
 COLDWAR_FRA_ecol_the_national_parks: "The National Parks"
 COLDWAR_FRA_ecol_the_national_parks_desc: "National parks protect nature and public health but weigh on agriculture."
 COLDWAR_FRA_ecol_green_communes: "Green Communes"
 COLDWAR_FRA_ecol_green_communes_desc: "Ecological municipalities raise local taxes and improve health and education at a bureaucratic price."
 COLDWAR_FRA_ecol_live_differently: "Live Differently"
 COLDWAR_FRA_ecol_live_differently_desc: "A deliberately different way of living brings stability, health and oil independence at the cost of growth."
 COLDWAR_FRA_rad_the_liberal_reform: "The Liberal Reform"
 COLDWAR_FRA_rad_the_liberal_reform_desc: "A liberal reform programme boosts offices and productivity while social spending rises."
 COLDWAR_FRA_rad_the_small_firms_republic: "The Small Firms' Republic"
 COLDWAR_FRA_rad_the_small_firms_republic_desc: "Shopkeepers and small firms drive building and office revenue, but lose some international market income."
 COLDWAR_FRA_rad_the_lorraine_laboratory: "The Lorraine Laboratory"
 COLDWAR_FRA_rad_the_lorraine_laboratory_desc: "Lorraine becomes a testing ground for new industry and research, with extra administration."
 COLDWAR_FRA_rad_the_royer_law: "The Royer Law"
 COLDWAR_FRA_rad_the_royer_law_desc: "The Royer Law protects small shops and raises taxes, but prices rise and productivity falls."
 COLDWAR_FRA_rad_the_american_challenge: "The American Challenge"
 COLDWAR_FRA_rad_the_american_challenge_desc: "Learning from American management and technology boosts research and productivity but exposes France to the world market."
 COLDWAR_FRA_rad_republican_order: "Republican Order"
 COLDWAR_FRA_rad_republican_order_desc: "Prefects enforce republican order, strengthening the government at an administrative cost."
 COLDWAR_FRA_rad_civil_liberties: "Civil Liberties"
 COLDWAR_FRA_rad_civil_liberties_desc: "Strong civil liberties harden public support for the republic at a higher police cost."
 COLDWAR_FRA_rad_the_radical_republic: "The Radical Republic"
 COLDWAR_FRA_rad_the_radical_republic_desc: "The Radical Republic combines stability, efficient offices and growth with a heavier administration."
 COLDWAR_FRA_cd_social_market_economy: "Social Market Economy"
 COLDWAR_FRA_cd_social_market_economy_desc: "A social market economy lifts productivity and tax revenue while social spending rises."
 COLDWAR_FRA_cd_the_free_centre: "The Free Centre"
 COLDWAR_FRA_cd_the_free_centre_desc: "A centre free of ministerial ties keeps its stability and cohesion but has less pull in government."
 COLDWAR_FRA_cd_the_ministers_of_the_centre: "The Ministers of the Centre"
 COLDWAR_FRA_cd_the_ministers_of_the_centre_desc: "Centrist ministers speed up building and stability but loosen party cohesion."
 COLDWAR_FRA_cd_the_family_policy: "The Family Policy"
 COLDWAR_FRA_cd_the_family_policy_desc: "Family policy raises taxes, population and stability at a high social cost."
 COLDWAR_FRA_cd_the_social_doctrine: "The Social Doctrine"
 COLDWAR_FRA_cd_the_social_doctrine_desc: "The Church's social doctrine supports stability and cohesion at an administrative cost."
 COLDWAR_FRA_cd_the_free_school: "The Free School"
 COLDWAR_FRA_cd_the_free_school_desc: "Free Catholic schools raise stability and research but education costs more."
 COLDWAR_FRA_cd_the_contract_schools: "The Contract Schools"
