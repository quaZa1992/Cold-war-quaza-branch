l_english:
# IMPERIA COLD WAR — Cold War: France 1970 national programme.
 COLDWAR_FRA_1970_focus: "France"
 COLDWAR_FRA_republic_tree_shortcut: "The Fifth Republic"
 COLDWAR_FRA_parties_tree_shortcut: "The Parties"
 COLDWAR_FRA_great_power_tree_shortcut: "France Above All"
 COLDWAR_FRA_economy_tree_shortcut: "Grands Projets"
 COLDWAR_FRA_military_tree_shortcut: "Force de Frappe"
 COLDWAR_FRA_africa_tree_shortcut: "Francafrique"
 COLDWAR_FRA_world_tree_shortcut: "France in the World"
 COLDWAR_FRA_stem_root: "Pompidou's Republic"
 COLDWAR_FRA_stem_root_desc: "The General has gone and the Republic still stands. Georges Pompidou promises continuity and a little opening: the institutions stay, the tone changes, and the franc has to be defended."
 COLDWAR_FRA_stem_new_society: "The New Society"
 COLDWAR_FRA_stem_new_society_desc: "France is a blocked society, and the Prime Minister says it aloud. Dialogue with the unions, a freer state and less fear of change will do more against another May than any truncheon."
 COLDWAR_FRA_stem_republican_order: "Republican Order"
 COLDWAR_FRA_stem_republican_order_desc: "A state that lets the street decide is no state. Interior Minister Marcellin will dissolve the leftist groups, and the nation will see who keeps order in France."
 COLDWAR_FRA_stem_contractual_policy: "The Contractual Policy"
 COLDWAR_FRA_stem_contractual_policy_desc: "Instead of laws handed down from Paris, the state and the unions sign contracts: wages that follow growth, monthly pay for workers and fewer strikes in the public sector."
 COLDWAR_FRA_stem_anti_breakers_law: "The Anti-Breakers Law"
 COLDWAR_FRA_stem_anti_breakers_law_desc: "Whoever organises a demonstration answers for the damage the breakers do in it. The law is hard but plain, and the shopkeepers of France will be glad of it."
 COLDWAR_FRA_stem_broadcasting_question: "The Broadcasting Question"
 COLDWAR_FRA_stem_broadcasting_question_desc: "Television is the great school of France and it belongs to the state. Who speaks on the first channel at eight o'clock is a question the government cannot leave to the editors."
 COLDWAR_FRA_stem_free_ortf: "A Free ORTF"
 COLDWAR_FRA_stem_free_ortf_desc: "Let the journalists report the news and let ministers face the questions. A broadcaster that is trusted abroad and at home is worth more than one that obeys."
 COLDWAR_FRA_stem_voice_of_france: "The Voice of France"
 COLDWAR_FRA_stem_voice_of_france_desc: "The government has the right to be heard clearly on the national network. Public radio and television will carry the voice of France and the news will be steady."
 COLDWAR_FRA_stem_the_regions: "The Regions Question"
 COLDWAR_FRA_stem_the_regions_desc: "The referendum of April 1969 is lost, and the General with it, but Brittany, Alsace and Corsica have not stopped asking. The regions need a place in the Republic before they find one outside it."
 COLDWAR_FRA_stem_regional_councils: "The Regional Councils of 1972"
 COLDWAR_FRA_stem_regional_councils_desc: "Each region gets a council of its own, with its deputies and its mayors, and a budget for roads and training. The prefect still holds the key, but he must now explain himself."
 COLDWAR_FRA_stem_prefects_rule: "The Prefects Rule"
 COLDWAR_FRA_stem_prefects_rule_desc: "France is one and indivisible, and the prefect is the Republic in the department. Brittany and Corsica will be developed from Paris, not governed from Rennes or Ajaccio."
 COLDWAR_FRA_stem_larzac: "The Larzac Camp"
 COLDWAR_FRA_stem_larzac_desc: "The army needs ground to train a modern force, and the Larzac plateau has it. The farmers have to leave, and some of them have said they will not."
 COLDWAR_FRA_stem_succession: "After Pompidou"
 COLDWAR_FRA_stem_succession_desc: "The President is ill, and the Elysée says he is not. Every dauphin has his own plans, and the constitution knows no step beyond the Senate President. The succession must be prepared before it is forced on us."
 COLDWAR_FRA_udr_e: "The Party of the President"
 COLDWAR_FRA_udr_e_desc: "Gaullism governs alone with the strongest majority in the history of the Republic. We are the party of the state, of the President and of the General's memory, and nobody else can govern France."
 COLDWAR_FRA_udr_pol: "The Barons of Gaullism"
 COLDWAR_FRA_udr_pol_desc: "Debré at Defence, Chaban at Matignon, Messmer at the Armies, Foccart behind the Africa file. The barons are loyal to the General's heirs, as long as the heirs listen to them."
 COLDWAR_FRA_udr_eco: "The Industrial Imperative"
 COLDWAR_FRA_udr_eco_desc: "France will be an industrial nation or it will be a museum. The President wants steel, aircraft and machines, and the Plan will give the banks and the firms their orders."
 COLDWAR_FRA_udr_a1: "The Social Gaullists"
 COLDWAR_FRA_udr_a1_desc: "Gaullism was always social. We want participation, training and contracts so that workers feel the Republic is theirs, even if the Elysée and half the barons grumble."
 COLDWAR_FRA_udr_a2: "The President's Majority"
 COLDWAR_FRA_udr_a2_desc: "Order, continuity and the President's will. The reforms were well meant, but the country wants a Prime Minister who obeys the Elysée and a government that does not stumble over its own ideas."
 COLDWAR_FRA_udr_b1: "National Champions"
 COLDWAR_FRA_udr_b1_desc: "France cannot fight General Motors and IBM with a hundred small firms. The state will marry them into national champions, in aircraft, computers and steel, and pay the dowry."
 COLDWAR_FRA_udr_b2: "The Open Economy"
 COLDWAR_FRA_udr_b2_desc: "Competition is the best planner. If France opens its doors to foreign capital and foreign goods, our firms will learn to sell abroad or they will learn why they should not have been protected."
 COLDWAR_FRA_udr_a1f: "Continuing Training for All"
 COLDWAR_FRA_udr_a1f_desc: "Every worker will have the right to training during his working life. The firms pay a levy, the workers learn a new trade and the unions have something to be proud of."
 COLDWAR_FRA_udr_a2f: "The Messmer Government"
 COLDWAR_FRA_udr_a2f_desc: "Pierre Messmer is a soldier, loyal and exact. He will run the government like a regiment, and when the oil price hits we will know what to build."
 COLDWAR_FRA_udr_b1f: "The Dunkirk to Fos Axis"
 COLDWAR_FRA_udr_b1f_desc: "From Dunkirk on the North Sea to Fos on the Mediterranean, two ports will feed the steelworks of the nation. It is a gamble on growth that will not stop."
 COLDWAR_FRA_udr_b2f: "Foreign Capital Welcome"
 COLDWAR_FRA_udr_b2f_desc: "Americans, Germans and Japanese are welcome to build in France, and we will help them with sites and tax breaks. A factory in the Gironde is a factory, whoever owns the shares."
 COLDWAR_FRA_udr_pm: "The Gaullist Succession"
 COLDWAR_FRA_udr_pm_desc: "Whoever carries the General's torch after Pompidou will decide what Gaullism becomes: the Prime Minister's openness, or the discipline of the young Corrèze deputy. The party must choose without breaking."
 COLDWAR_FRA_udr_em: "Industrial France 1980"
 COLDWAR_FRA_udr_em_desc: "By 1980 France must be the fourth industrial power in the world, with an industry that exports and a countryside that feeds it. The President has set the target and the ministries have their orders."
 COLDWAR_FRA_udr_c1: "Law and Order Majority"
 COLDWAR_FRA_udr_c1_desc: "Most French people want to walk home safely and see their children at school without bars on the windows. The police will have the means, and the judges will have their orders."
 COLDWAR_FRA_udr_c2: "Participation in the Firm"
 COLDWAR_FRA_udr_c2_desc: "The worker must share the fruits of the firm and the choices of the firm. De Gaulle called it association, and the social Gaullists call it participation: profit for the workers and a voice for them."
 COLDWAR_FRA_udr_d1: "A Europe of Nations"
 COLDWAR_FRA_udr_d1_desc: "France will not be dissolved in a supranational Europe. A Europe of nations, with its own armies and its own voice, or no Europe at all, and Paris will say so in plain French."
 COLDWAR_FRA_udr_d2: "The Atlantic Right"
 COLDWAR_FRA_udr_d2_desc: "The Soviet threat is real and the American shield is real. A strong right can be Atlantic without shame, and the world will see that France is no neutral."
 COLDWAR_FRA_udr_cm: "Rally for the Republic"
 COLDWAR_FRA_udr_cm_desc: "The Rally for the Republic is born as a mass party, built by Jacques Chirac, with a hall full of militants and a leader who knows how to count. Paris will see who commands the street and who commands the vote."
 COLDWAR_FRA_udr_dm: "Gaullism and the World"
 COLDWAR_FRA_udr_dm_desc: "France speaks in her own name, in the East, in Africa and in the Arab world. The deterrent is ours, the veto is ours, and Washington and Moscow can both learn to live with it."
 COLDWAR_FRA_udr_g1: "French-Style Labourism"
 COLDWAR_FRA_udr_g1_desc: "The Gaullist right can speak to workers too, and not only on holidays. A French-style labourism, with jobs and social protection from the state, will keep Marchais and Mitterrand at the door."
 COLDWAR_FRA_udr_g2: "The Liberal Turn"
 COLDWAR_FRA_udr_g2_desc: "The state has taken too much and too long. Cut the taxes, free the firms and let the French earn their money, as they do in London and Washington, and growth will follow."
 COLDWAR_FRA_udr_h1: "The Mayor of Paris"
 COLDWAR_FRA_udr_h1_desc: "Paris is the capital of the nation and its biggest machine. Whoever holds the Hotel de Ville has the budget, the contracts and the jobs, and the Rally will hold them."
 COLDWAR_FRA_udr_h2: "The Network of Notables"
 COLDWAR_FRA_udr_h2_desc: "The mayors and general councillors of the countryside, from Corrèze to the Vendée, vote for us because we listen to them. Our men in the villages are the party's real strength."
 COLDWAR_FRA_udr_g1f: "Jobs for the Young"
 COLDWAR_FRA_udr_g1f_desc: "Youth unemployment is a time bomb. The state will pay the firms to hire apprentices and young people, and the factories will take them."
 COLDWAR_FRA_udr_g2f: "The Privatisation Law"
 COLDWAR_FRA_udr_g2f_desc: "Saint-Gobain, Paribas, Société Générale, TF1, Suez: the state will sell what it should not own. The proceeds will pay for the budget and the French can buy shares in their own industry."
 COLDWAR_FRA_udr_h1f: "The Paris Machine"
 COLDWAR_FRA_udr_h1f_desc: "Offices, housing and a ring road for the capital. The Paris machine builds, and what it builds, it fills with its own people."
 COLDWAR_FRA_udr_h2f: "Rural Gaullism"
 COLDWAR_FRA_udr_h2f_desc: "A road to every village and a subsidy to every herd. The countryside has always been the Rally's strength, and it must be paid in tarmac and in francs."
 COLDWAR_FRA_udr_gm: "Governing in Cohabitation"
 COLDWAR_FRA_udr_gm_desc: "The country has chosen a Prime Minister of one party and a President of another. We will govern with the majority we have and we will not let the Elysée block us."
 COLDWAR_FRA_udr_hm: "The Mass Party"
 COLDWAR_FRA_udr_hm_desc: "Ten thousand new militants in a year, a youth wing in every department and cell leaders who know their street. The party of the Republic must be a party of the people."
 COLDWAR_FRA_udr_k1: "Abolish the Wealth Tax"
 COLDWAR_FRA_udr_k1_desc: "The tax on large fortunes drives capital to Switzerland and Belgium. Abolish it, bring the money home, and the investors will come back with it."
 COLDWAR_FRA_udr_k2: "Free the Prices"
 COLDWAR_FRA_udr_k2_desc: "No more price orders from the Finance Ministry. France is ready to see competition set the price, even if the first months of freedom are hard on the household budget."
 COLDWAR_FRA_udr_k3: "The Young Gaullists"
 COLDWAR_FRA_udr_k3_desc: "A party that does not recruit the young is a party that is waiting to die. The young Gaullists will fill the lecture halls, the youth clubs and the barracks."
 COLDWAR_FRA_udr_k4: "The Overseas Gaullists"
 COLDWAR_FRA_udr_k4_desc: "From Reunion to Martinique, Gaullism has been the party of the overseas departments for decades. The networks of Charles Pasqua and our deputies in the DOM-TOM keep them French."
 COLDWAR_FRA_udr_cap: "The Rally Endures"
 COLDWAR_FRA_udr_cap_desc: "The Rally has outlasted Pompidou, Giscard and the cohabitation. A strong state, a free nation and a party that is not afraid of power: that is the Gaullist Republic, and it endures."
 COLDWAR_FRA_fnri_e: "The Independent Republicans"
 COLDWAR_FRA_fnri_e_desc: "Giscard's Independent Republicans are the modern wing of the majority: young, liberal and European. We shall prove that a small party can govern better than a large one."
 COLDWAR_FRA_fnri_pol: "The Giscardian Network"
 COLDWAR_FRA_fnri_pol_desc: "Michel Poniatowski keeps the lists, the clubs keep the ideas, and the Minister keeps the files. The Giscardian network is small, but it knows everyone."
 COLDWAR_FRA_fnri_eco: "The Finance Ministry School"
 COLDWAR_FRA_fnri_eco_desc: "Giscard at the Rue de Rivoli means order in the accounts: balanced budgets, modern management and a franc nobody doubts. The Inspectors of Finance will run the economy."
 COLDWAR_FRA_fnri_a1: "The Advanced Liberal Society"
 COLDWAR_FRA_fnri_a1_desc: "France is ready for an advanced liberal society: voting at eighteen, divorce by consent, a Constitutional Council that the opposition can call. The old France will grumble, but the young France will cheer."
 COLDWAR_FRA_fnri_a2: "The Conservative Majority"
 COLDWAR_FRA_fnri_a2_desc: "The majority is wide and its right wing is loud. Reform will be slow and measured, so that the Gaullists, the notables and the Church can follow."
 COLDWAR_FRA_fnri_b1: "Sound Money"
 COLDWAR_FRA_fnri_b1_desc: "The franc must hold, inflation must fall and the budget must be balanced. It means sacrifices, and we must say so before the voters say it for us."
 COLDWAR_FRA_fnri_b2: "The Growth Wager"
 COLDWAR_FRA_fnri_b2_desc: "Demand will carry the economy through the oil shock. Cheap credit, public works and a tax break for investment will start the factories again and keep the unemployed at work."
 COLDWAR_FRA_fnri_a1f: "The Veil Law"
 COLDWAR_FRA_fnri_a1f_desc: "Abortion in a law, in a hospital and under the eye of a doctor: Simone Veil will bring the text to the Assembly, and she will bring it against much of our own majority."
 COLDWAR_FRA_fnri_a2f: "Order in the Universities"
 COLDWAR_FRA_fnri_a2f_desc: "Lecture halls are for lectures. The Secretary of State will bring the professors, the students and the unions back under the authority of the ministry."
 COLDWAR_FRA_fnri_b1f: "The Barre Plan"
 COLDWAR_FRA_fnri_b1f_desc: "A freeze on prices and on wages, a surtax on the rich, a cut in the deficit and a target for inflation. Raymond Barre will not hide the bill."
 COLDWAR_FRA_fnri_b2f: "The 1975 Relaunch"
 COLDWAR_FRA_fnri_b2f_desc: "A relaunch of thirty billion francs for public works, housing and exports. We put money in the economy before it falls asleep."
 COLDWAR_FRA_fnri_pm: "French Democracy"
 COLDWAR_FRA_fnri_pm_desc: "Two French people out of three want to end the conflict between left and right. A government of the centre, close to the people and open to change, can represent them."
 COLDWAR_FRA_fnri_em: "The Best Economist in France"
 COLDWAR_FRA_fnri_em_desc: "Giscard called him the best economist in France, and he is certainly the sternest. Raymond Barre will say what must be done, and he does not care whether it makes friends."
 COLDWAR_FRA_fnri_c1: "Two French People out of Three"
 COLDWAR_FRA_fnri_c1_desc: "A union of the centre and the moderate right: Republicans, Radicals, Christian democrats and Social democrats, all behind the President. The Gaullists will have to join or be left alone."
 COLDWAR_FRA_fnri_c2: "The Centre-Left Opening"
 COLDWAR_FRA_fnri_c2_desc: "If the Gaullists will not follow, we must look to the other side. A reformist Left, with Rocard and the Socialists of the second Left, can be at the table with us."
 COLDWAR_FRA_fnri_d1: "The Rambouillet Summit"
 COLDWAR_FRA_fnri_d1_desc: "Six heads of government around one table at Rambouillet: a new club for the monetary and oil crises of the rich world. France is host, and France will set the agenda."
 COLDWAR_FRA_fnri_d2: "The Trilogue"
 COLDWAR_FRA_fnri_d2_desc: "Europe, the Arab world and Africa share a sea, an energy bill and a future. Giscard's trilogue would put us at the centre of all three, and pay for the oil with industry and with arms."
 COLDWAR_FRA_fnri_cm: "The Union for French Democracy"
 COLDWAR_FRA_fnri_cm_desc: "The Union for French Democracy brings Republicans, Radicals, Christian Democrats and Social Democrats under one roof. The President's party is no longer a small party with a big minister."
 COLDWAR_FRA_fnri_dm: "Giscard's Diplomacy"
 COLDWAR_FRA_fnri_dm_desc: "Valéry Giscard and Helmut Schmidt talk by telephone every week. The two of them can build the monetary system and the European Council that the Commission could not."
 COLDWAR_FRA_fnri_g1: "The Monory Liberation"
 COLDWAR_FRA_fnri_g1_desc: "Prices will be set by the market, as they are in Germany and in the United States. Industrial prices are liberated first, and a year of inflation is the cost of the cure."
 COLDWAR_FRA_fnri_g2: "The Price Watch"
 COLDWAR_FRA_fnri_g2_desc: "The state will watch the shop windows. Controlled prices keep the housekeeping budget of every French family steady and keep unions at the table."
 COLDWAR_FRA_fnri_h1: "The Renovators"
 COLDWAR_FRA_fnri_h1_desc: "François Léotard, Alain Madelin, Gérard Longuet: a generation that reads Hayek and talks to businessmen. They want less state, more market and a new vocabulary."
 COLDWAR_FRA_fnri_h2: "The Old Guard"
 COLDWAR_FRA_fnri_h2_desc: "The men who built the party in the sixties know every mayor and every notable. They will not hurry, and they do not like being told to."
 COLDWAR_FRA_fnri_g1f: "The Monory Savings Law"
 COLDWAR_FRA_fnri_g1f_desc: "Every French saver who buys shares of a French firm can deduct them from his taxable income. Capital goes to industry, and the citizen becomes a shareholder."
 COLDWAR_FRA_fnri_g2f: "The Index Committee"
 COLDWAR_FRA_fnri_g2f_desc: "Inspectors will compare the shop prices, publish the index each month and name the firms that overcharge. The housewife gets an answer, the bureaucrat gets a desk."
 COLDWAR_FRA_fnri_h1f: "The Liberal Generation"
 COLDWAR_FRA_fnri_h1f_desc: "A hundred young cadres from the grandes écoles are ready to run the departments, the clubs and the ministries. They speak English, they know management, and they are in a hurry."
 COLDWAR_FRA_fnri_h2f: "The Interior Ministry Hand"
 COLDWAR_FRA_fnri_h2f_desc: "The Interior Minister knows every prefect and every police chief. His hand reaches the town halls, and the majority's votes come out of the prefectures."
 COLDWAR_FRA_fnri_gm: "The Liberal Economy"
 COLDWAR_FRA_fnri_gm_desc: "The state has stopped planning prices and wages, and the market now plans them. French firms must learn that competition is not a threat but a method."
 COLDWAR_FRA_fnri_hm: "The Republican Party"
 COLDWAR_FRA_fnri_hm_desc: "The Republican Party is the heir of the Independent Republicans: a party for deputies, mayors and young liberals, with a leader named Giscard and a platform named France."
 COLDWAR_FRA_fnri_k1: "Telematics for France"
 COLDWAR_FRA_fnri_k1_desc: "Computers, telephones and television will merge into a single network of information. France can lead, if the state has the courage to wire every household."
 COLDWAR_FRA_fnri_k2: "The Immigration Halt"
 COLDWAR_FRA_fnri_k2_desc: "The economy cannot absorb more workers while unemployment rises. Recruitment from abroad stops, family reunification is controlled, and returning home will be helped."
 COLDWAR_FRA_fnri_k3: "Majority at Eighteen"
 COLDWAR_FRA_fnri_k3_desc: "Eighteen-year-olds are old enough to work, to serve and to vote. A country that trusts its youth gets a youth that trusts the country."
 COLDWAR_FRA_fnri_k4: "Divorce by Consent"
 COLDWAR_FRA_fnri_k4_desc: "Marriage will be a contract that two adults can end together before a judge, without the fiction of a fault. France is a modern country and its laws must say so."
 COLDWAR_FRA_fnri_cap: "Advanced Liberal Democracy"
 COLDWAR_FRA_fnri_cap_desc: "Liberty, pluralism and the modern state: France has become an advanced liberal democracy, with a Constitutional Council that guards rights and a majority that moves with its times."
 COLDWAR_FRA_ps_e: "The Congress of Epinay"
 COLDWAR_FRA_ps_e_desc: "At Epinay the old SFIO of notables gave way to a party that wants to govern and to change society. We have a leader, a programme and a majority strategy, and we intend to use all three."
 COLDWAR_FRA_ps_pol: "Mitterrand's Party"
 COLDWAR_FRA_ps_pol_desc: "The first secretary holds the courants together by arbitration and by posts. Mauroy runs the north, Defferre Marseille, Chevènement the left wing, and Mitterrand decides."
 COLDWAR_FRA_ps_eco: "Break with Capitalism"
 COLDWAR_FRA_ps_eco_desc: "We say it openly: whoever refuses the break with capitalism cannot be a Socialist. The state, the plan and the rights of workers will bend the economy towards those who work."
 COLDWAR_FRA_ps_a1: "The Union of the Left"
 COLDWAR_FRA_ps_a1_desc: "One left, one list, one majority: without the Communists' votes we shall never govern, and with them we shall decide the terms. Washington and the centre will not like it."
 COLDWAR_FRA_ps_a2: "Opening to the Centre"
 COLDWAR_FRA_ps_a2_desc: "The old SFIO majority lived on understandings with the centre, and the Third Force still has defenders in our ranks. A coalition of reform parties can govern without waiting for the Communists."
 COLDWAR_FRA_ps_b1: "The Great Nationalisations"
 COLDWAR_FRA_ps_b1_desc: "Seven industrial groups and thirty-nine banks pass into public hands. The state will own the levers of growth, and the shareholders will be paid in bonds."
 COLDWAR_FRA_ps_b2: "A Mixed Economy"
 COLDWAR_FRA_ps_b2_desc: "Only the core groups, steel, banks and defence, belong to the nation. Every other firm stays private and answers to the plan through contracts, not through decrees."
 COLDWAR_FRA_ps_a1f: "The Common Programme"
 COLDWAR_FRA_ps_a1f_desc: "Signed on 27 June 1972, the Common Programme promises a minimum wage of 1000 francs, a shorter week, and the nationalisation of the great groups. The workers read it as a contract, not a manifesto."
 COLDWAR_FRA_ps_a2f: "The Reformist Front"
 COLDWAR_FRA_ps_a2f_desc: "Radicals, Christian Democrats and Socialists share one reform front: a government of the centre-left, with the market kept alive and the poor not forgotten."
 COLDWAR_FRA_ps_b1f: "The Banks to the Nation"
 COLDWAR_FRA_ps_b1f_desc: "Credit is power. When the banks belong to the nation, industry gets loans at a rate set by the plan, not by the Paris boards."
 COLDWAR_FRA_ps_b2f: "Planning Contracts"
 COLDWAR_FRA_ps_b2f_desc: "Instead of ordering the firms, the plan will sign contracts with them: aid and credit in return for jobs, investment and exports."
 COLDWAR_FRA_ps_pm: "The Metz Congress"
 COLDWAR_FRA_ps_pm_desc: "At Metz the Socialist majority of the first secretary beat Rocard's motion, with the votes of the left wing. The path to the Elysée runs through Mitterrand, or it does not run."
 COLDWAR_FRA_ps_em: "The 110 Propositions"
 COLDWAR_FRA_ps_em_desc: "One hundred and ten proposals, from the minimum wage to the abolition of the death penalty, and every one of them will be checked against our record. Frenchmen should hold us to the list."
 COLDWAR_FRA_ps_c1: "The First Left"
 COLDWAR_FRA_ps_c1_desc: "The state, the plan and the Republic one and indivisible: the first left builds its socialism from the centre and by decree, and trusts the Jacobin machine to deliver."
 COLDWAR_FRA_ps_c2: "The Second Left"
 COLDWAR_FRA_ps_c2_desc: "Decentralisation, self-management and honest accounts: the second left trusts the citizen and the CFDT more than the prefect or the plan. The reform of society starts in the workplace."
 COLDWAR_FRA_ps_d1: "Dissolve the Blocs"
 COLDWAR_FRA_ps_d1_desc: "Neither bloc: France must work for the dissolution of the two blocs and the end of the arms race. Allies who cannot follow us will call it naive."
 COLDWAR_FRA_ps_d2: "Socialist Deterrence"
 COLDWAR_FRA_ps_d2_desc: "The deterrent is France's and not any one party's. A Socialist government will keep it modern and under national control, whatever the pacifists in our own ranks say."
 COLDWAR_FRA_ps_cm: "The State of Grace"
 COLDWAR_FRA_ps_cm_desc: "In June 1981 the majority gave us a mandate and the first months must show what it was for: the 39-hour week, the fifth week of holidays, a higher minimum wage and higher family allowances."
 COLDWAR_FRA_ps_dm: "The Bundestag Speech"
 COLDWAR_FRA_ps_dm_desc: "In the Bundestag the President will say plainly that the missiles are in the East and the pacifists in the West. France stands with Bonn on the Euromissiles, though outside NATO's command."
 COLDWAR_FRA_ps_g1: "Rigour in the EMS"
 COLDWAR_FRA_ps_g1_desc: "After three devaluations the franc cannot be saved by hopes. Delors argues that France must stay in the European Monetary System and put its budget in order. Growth must wait."
 COLDWAR_FRA_ps_g2: "The Other Policy"
 COLDWAR_FRA_ps_g2_desc: "Chevènement says the franc should float down: leave the EMS, devalue, protect the home market, and let the state rebuild industry. We would trade stable money for a working France."
 COLDWAR_FRA_ps_h1: "Decentralisation"
 COLDWAR_FRA_ps_h1_desc: "The law of 2 March 1982 gives powers to communes, departments and regions and ends the prefect's supervision. Defferre calls it the great reform of the septennat."
 COLDWAR_FRA_ps_h2: "The Jacobin State"
 COLDWAR_FRA_ps_h2_desc: "The Republic is one and indivisible, and a strong state is what protects the weak against local notables. The prefect stays, and the ministry decides."
 COLDWAR_FRA_ps_g1f: "The Delors Plan"
 COLDWAR_FRA_ps_g1f_desc: "The package of 25 March: a forced loan on high incomes, a levy to cover social security, cuts to the deficit and exchange controls on travellers. The budget must show a clear course."
 COLDWAR_FRA_ps_g2f: "Protect the French Market"
 COLDWAR_FRA_ps_g2f_desc: "Imports of videorecorders and cheap textiles are killing our factories. We shall funnel them through small customs posts, add quotas and give priority to goods made in France."
 COLDWAR_FRA_ps_h1f: "Elected Regional Councils"
 COLDWAR_FRA_ps_h1f_desc: "Regions now elect their own councils, with their own budgets for lycées, rail and roads. The citizen can vote on his region's plan for the first time."
 COLDWAR_FRA_ps_h2f: "The Ministry of Industry"
 COLDWAR_FRA_ps_h2f_desc: "A single ministry for industry and research will coordinate the champions: electronics, machine tools, chemistry. The state sets the targets and the state pays."
 COLDWAR_FRA_ps_gm: "Modernisation"
 COLDWAR_FRA_ps_gm_desc: "Young Prime Minister Fabius says France needs to be modernised, with firms restructured, unprofitable plants closed and the rhetoric of the break put away."
 COLDWAR_FRA_ps_hm: "Badinter's Justice"
 COLDWAR_FRA_ps_hm_desc: "On 9 October 1981 the guillotine falls out of French law. Robert Badinter will also repeal the Peyrefitte law, the Cour de sûreté and the special courts."
 COLDWAR_FRA_ps_k1: "Free Radios"
 COLDWAR_FRA_ps_k1_desc: "The state monopoly on the airwaves ends. Local radios can broadcast, and anybody who opens a microphone will have to answer to the new audiovisual authority, not to the minister."
 COLDWAR_FRA_ps_k2: "One Percent for Culture"
 COLDWAR_FRA_ps_k2_desc: "Jack Lang will double the culture budget: new museums, theatres, festivals and music for all. The language and the arts are also France's best export."
 COLDWAR_FRA_ps_k3: "Retirement at Sixty"
 COLDWAR_FRA_ps_k3_desc: "A full pension at sixty after thirty-seven and a half years of work: a promise made in 1981 and a promise kept. The pension funds will have to find the money."
 COLDWAR_FRA_ps_k4: "The Auroux Laws"
 COLDWAR_FRA_ps_k4_desc: "Employees will have the right to speak at work, to elect health and safety committees and to bargain every year with employers. The workshop becomes part of citizenship."
 COLDWAR_FRA_ps_cap: "Change Life"
 COLDWAR_FRA_ps_cap_desc: "The promise of 1972 was to change life, and what is changed in law will last. A France with new rights, a modernised industry and a left that has learned to govern."
 COLDWAR_FRA_pcf_e: "The Party of the Working Class"
 COLDWAR_FRA_pcf_e_desc: "One voter in five chooses us, the CGT is in every big factory and the red belt around Paris is ours. The party of the working class means to be the first party of France."
 COLDWAR_FRA_pcf_pol: "The Secretary-General"
 COLDWAR_FRA_pcf_pol_desc: "Waldeck Rochet is ill and Georges Marchais, from a Normandy workshop, runs the party in practice. The Politburo decides in private and speaks with one voice in public."
 COLDWAR_FRA_pcf_eco: "Democratic Nationalisations"
 COLDWAR_FRA_pcf_eco_desc: "Key sectors must pass to the nation, run with the workers' committees and the CGT, not left to shareholders. This is the first step to a French socialism."
 COLDWAR_FRA_pcf_a1: "Eurocommunism"
 COLDWAR_FRA_pcf_a1_desc: "Berlinguer in Rome and Carrillo in Madrid say socialism will be pluralist or it will not exist. France will follow its own road, even if Moscow takes offence."
 COLDWAR_FRA_pcf_a2: "Proletarian Internationalism"
 COLDWAR_FRA_pcf_a2_desc: "The Soviet Union is the first workers' state and the camp of peace, and we shall not be a party that turns on its friends. Trade and credit from the East will serve French workers."
 COLDWAR_FRA_pcf_b1: "Extend the List"
 COLDWAR_FRA_pcf_b1_desc: "The nine groups are not enough: their 1,450 subsidiaries are where the profits hide. A nationalisation that leaves the subsidiaries to the shareholders is only a gift of the losses to the nation."
 COLDWAR_FRA_pcf_b2: "Produce French"
 COLDWAR_FRA_pcf_b2_desc: "Produce French! Every factory we save at home is a wage kept in France. The EC and the multinationals will complain, and we shall let them."
 COLDWAR_FRA_pcf_a1f: "Farewell to the Dictatorship of the Proletariat"
 COLDWAR_FRA_pcf_a1f_desc: "The party renounces the dictatorship of the proletariat in its programme: socialism in France will respect elections, parties and freedoms. Marchais calls it adapting to French reality."
 COLDWAR_FRA_pcf_a2f: "A Globally Positive Balance"
 COLDWAR_FRA_pcf_a2f_desc: "Marchais says the balance of the socialist countries is globally positive. We can learn from planning and housing there, whatever the hostile press says about their prisons."
 COLDWAR_FRA_pcf_b1f: "The Subsidiaries Too"
 COLDWAR_FRA_pcf_b1f_desc: "Through the subsidiaries the groups can dodge any state control, so the state must take the holdings too and open the books to the workers' elected delegates."
 COLDWAR_FRA_pcf_b2f: "The Red Belt Communes"
 COLDWAR_FRA_pcf_b2f_desc: "Communist mayors have housed workers, opened clinics and holiday camps and filled the communal budgets with schools. The red belt shows what we would do for the whole country."
 COLDWAR_FRA_pcf_pm: "The Union in Question"
 COLDWAR_FRA_pcf_pm_desc: "In September 1977 the talks on updating the Common Programme collapsed. The PS wants to be the first party of the left, and we shall not agree to be its junior partner."
 COLDWAR_FRA_pcf_em: "The Power of the CGT"
 COLDWAR_FRA_pcf_em_desc: "The Confédération générale du travail has two million members and a stewards' network in every steel mill, shipyard and car plant. Strikes are called by the CGT or they are not called."
 COLDWAR_FRA_pcf_c1: "Communist Ministers"
 COLDWAR_FRA_pcf_c1_desc: "Four Communists in the cabinet: transport, civil service, health and vocational training. We shall prove that we can govern and that the workers are better off for it."
 COLDWAR_FRA_pcf_c2: "Opposition from the Left"
 COLDWAR_FRA_pcf_c2_desc: "Stay outside the government and keep our hands clean. The PCF will speak for the workers without the compromises of office, and the street will hear us."
 COLDWAR_FRA_pcf_d1: "Friend of Moscow"
 COLDWAR_FRA_pcf_d1_desc: "Marchais flew to Moscow in January 1980 and backed the Soviet action in Afghanistan. The French people in the red belt expect their party to stand with the socialist camp."
 COLDWAR_FRA_pcf_d2: "Independent Communism"
 COLDWAR_FRA_pcf_d2_desc: "Our road to socialism will be French, independent of any centre. Italian comrades have shown how a communist party can break with Moscow's tutelage without losing its soul."
 COLDWAR_FRA_pcf_cm: "Fiterman's Railways"
 COLDWAR_FRA_pcf_cm_desc: "The Minister of Transport, a Communist, will open the first high-speed line from Paris to Lyon and keep the railwaymen's statute. The railways are a public service."
 COLDWAR_FRA_pcf_dm: "The World Movement"
 COLDWAR_FRA_pcf_dm_desc: "The international communist movement is our school and our family: Hanoi, Algiers, Havana. Solidarity abroad strengthens the struggle at home."
 COLDWAR_FRA_pcf_g1: "Defend the Steel Basins"
 COLDWAR_FRA_pcf_g1_desc: "No furnace will be put out and no mill will be sold off. In Longwy and Denain the steelworkers have shown that without steel the nation has no future."
 COLDWAR_FRA_pcf_g2: "Modernise the Workplace"
 COLDWAR_FRA_pcf_g2_desc: "A modern plant needs robots, retraining and workers who have a say in what is made. The renovators say the party must stop defending a past of closed shops."
 COLDWAR_FRA_pcf_h1: "The Humanite Machine"
 COLDWAR_FRA_pcf_h1_desc: "L'Humanité reaches thousands of homes and its September festival draws hundreds of thousands. The party press is our school, our tribune and our budget."
 COLDWAR_FRA_pcf_h2: "The Mass Organisations"
 COLDWAR_FRA_pcf_h2_desc: "The Communist women's union, the youth league, the people's relief and the veterans' leagues take the party into every district. The transmission belts carry the line to the neighbourhood."
 COLDWAR_FRA_pcf_g1f: "Radio Lorraine Heart of Steel"
 COLDWAR_FRA_pcf_g1f_desc: "From the CGT radio in Longwy the steelworkers tell the country what the plan means for them. It is the voice of Lorraine's heart of steel, and Paris cannot jam it."
 COLDWAR_FRA_pcf_g2f: "Juquin's Renovation"
 COLDWAR_FRA_pcf_g2f_desc: "The party must listen to its own base: open debates, secret ballots in the sections, no more expulsions for opinions. Pierre Juquin says it can renew itself or decline."
 COLDWAR_FRA_pcf_h1f: "The Fete de l'Humanite"
 COLDWAR_FRA_pcf_h1f_desc: "Every September La Courneuve becomes a city of stands, concerts and debates, with fraternal delegations from fifty countries. The party pays its press with the festival, and the festival shows that we are no sect."
 COLDWAR_FRA_pcf_h2f: "Communist Youth"
 COLDWAR_FRA_pcf_h2f_desc: "The Mouvement de la jeunesse communiste recruits in the technical schools, in the sports clubs and on the estates. A party that is not young is a party that is about to die."
 COLDWAR_FRA_pcf_gm: "Socialism in French Colours"
 COLDWAR_FRA_pcf_gm_desc: "Advanced democracy is a French road: our flag, our history, our trades. It is not Moscow's copy and it will carry the Marseillaise and the red flag together."
 COLDWAR_FRA_pcf_hm: "The Peace Movement"
 COLDWAR_FRA_pcf_hm_desc: "The Euromissiles must not be installed in Europe and French workers want peace, not a new arms race. Our petition is the loudest in the country."
 COLDWAR_FRA_pcf_k1: "Workers' Rights in the Firm"
 COLDWAR_FRA_pcf_k1_desc: "Workers must have a say in the firm: elected delegates in the board room, access to the books and a veto on closures. Democracy cannot stop at the factory gate."
 COLDWAR_FRA_pcf_k2: "The Thirty-Five Hours"
 COLDWAR_FRA_pcf_k2_desc: "Thirty-five hours with no loss of pay: let machines carry the weight, and let workers keep their lives. Employers will cry out, and the jobless will thank us."
 COLDWAR_FRA_pcf_k3: "France-USSR Friendship"
 COLDWAR_FRA_pcf_k3_desc: "The France-USSR Association organises visits, exchanges and delegations of workers and artists. Let the people see Soviet reality with their own eyes."
 COLDWAR_FRA_pcf_k4: "The Red Suburbs"
 COLDWAR_FRA_pcf_k4_desc: "The Communist suburbs around Paris are the heartland of the party: housing estates, clinics, youth clubs and the workers who live there. A suburb's Communist mayor keeps order and keeps rents low."
 COLDWAR_FRA_pcf_cap: "The Common Future"
 COLDWAR_FRA_pcf_cap_desc: "'For a common future' was our slogan of the 1980s: a national French socialism of nationalised industry, a strong union movement and workers' municipalities. We built it with our own hands."
 COLDWAR_FRA_lc_e: "The Communist League"
 COLDWAR_FRA_lc_e_desc: "From the ruins of the Jeunesse communiste révolutionnaire, banned after May 1968, a new party has been built. Krivine and the militants know that its programme is the one of 1938: demands that lead from today's wages to the seizure of power."
 COLDWAR_FRA_lc_pol: "Krivine's League"
 COLDWAR_FRA_lc_pol_desc: "Krivine, a former Sorbonne student and conscript soldier, will lead a party of a few thousand militants, workers and students. Decisions are taken in the Central Committee and tested in committees."
 COLDWAR_FRA_lc_eco: "Transitional Demands"
 COLDWAR_FRA_lc_eco_desc: "Wages that rise with prices, books open to the workers, no layoffs without the committee's agreement. The demands are ones that capitalism cannot grant, and that is why we make them."
 COLDWAR_FRA_lc_a1: "Street and Barricade"
 COLDWAR_FRA_lc_a1_desc: "The barricades of 1968 showed what a determined crowd can do. The League keeps a service d'ordre, and on the day of the demonstration the pavement belongs to the workers."
 COLDWAR_FRA_lc_a2: "The Ballot as Tribune"
 COLDWAR_FRA_lc_a2_desc: "Campaigns are a tribune: Krivine on the television, our programme in every mailbox, and a left that is forced to answer. The ballot is a stage, not the end of the road."
 COLDWAR_FRA_lc_b1: "Factory Committees"
 COLDWAR_FRA_lc_b1_desc: "Elected committees in every factory hold the keys of the plant, the books of the firm and the right to veto layoffs. Engineers and foremen must report to them."
 COLDWAR_FRA_lc_b2: "The Student Front"
 COLDWAR_FRA_lc_b2_desc: "The students of May 1968 are the League's reserve: lycées, universities and apprentice schools elect committees and carry the programme to their parents."
 COLDWAR_FRA_lc_a1f: "Red Vigilance"
 COLDWAR_FRA_lc_a1f_desc: "Fascists and the police will test the left's meetings. The League trains its stewards, guards its press and its premises, and knows that the best defence is organised workers."
 COLDWAR_FRA_lc_a2f: "Krivine for President"
 COLDWAR_FRA_lc_a2f_desc: "In 1969 Alain Krivine ran for the presidency and won a hearing on television. The League will run again, with a programme for the whole left."
 COLDWAR_FRA_lc_b1f: "Solidarity with LIP"
 COLDWAR_FRA_lc_b1f_desc: "At LIP the watchmakers kept the plant, kept the stock and paid their own wages. A hundred other occupied factories can do the same if we back them."
 COLDWAR_FRA_lc_b2f: "Rouge Daily"
 COLDWAR_FRA_lc_b2f_desc: "Rouge, first a weekly and now a daily, carries the strikes, the trials and the international news that the bourgeois press leaves out. It is the League's school of cadres."
 COLDWAR_FRA_lc_pm: "The Revolutionary Communist League"
 COLDWAR_FRA_lc_pm_desc: "After the dissolution, the League is reborn as the Ligue communiste révolutionnaire. A new name, a new daily and the same militants: a ban cannot unmake them."
 COLDWAR_FRA_lc_em: "Planning from Below"
 COLDWAR_FRA_lc_em_desc: "The plan is made from below: factory committees send their needs to regional councils and the councils to a national congress. Experts serve the plan, and the delegates direct them."
 COLDWAR_FRA_lc_c1: "The Soldiers' Committees"
 COLDWAR_FRA_lc_c1_desc: "Conscripts will elect delegates and hold meetings, and an order is no longer a command to be obeyed without question. The army belongs to those who serve in it."
 COLDWAR_FRA_lc_c2: "The Anti-Fascist Front"
 COLDWAR_FRA_lc_c2_desc: "The fascists of Ordre Nouveau and Le Pen's new party must meet the whole left in the street, in united committees of unions and parties, and be driven from the streets."
 COLDWAR_FRA_lc_d1: "Third-World Revolution"
 COLDWAR_FRA_lc_d1_desc: "Algeria, Vietnam, Chile, Africa: the revolutions of the poor nations are ours too. France must quit the old colonial empire and fund its liberation movements."
 COLDWAR_FRA_lc_d2: "Against Both Blocs"
 COLDWAR_FRA_lc_d2_desc: "Neither Washington nor Moscow: we support the Polish workers of Solidarnosc, the Czech opposition and the Vietnamese boat people as readily as the Chilean miners."
 COLDWAR_FRA_lc_cm: "Red Barracks"
 COLDWAR_FRA_lc_cm_desc: "The barracks should be a school of democracy, with committees of conscripts, trade-union rights and no punishment for opinions. Revolutionary soldiers can be cheaper than a parade army."
 COLDWAR_FRA_lc_dm: "The Fourth International"
 COLDWAR_FRA_lc_dm_desc: "The League is the French section of the Fourth International. Its congresses draw delegates from sixty countries, and Paris becomes a capital of the world revolution."
 COLDWAR_FRA_lc_cap: "Permanent Revolution"
 COLDWAR_FRA_lc_cap_desc: "A single country cannot hold on alone: France's revolution must spread to Europe and the world, or it will be isolated and fall. The workers' councils are the answer to capital."
 COLDWAR_FRA_psu_e: "The Unified Socialists"
 COLDWAR_FRA_psu_e_desc: "We are the party of the left that refused both the old SFIO and the Party of Moscow. Workers, farmers and teachers should run their own workplaces, and the state should help them do it."
 COLDWAR_FRA_psu_pol: "Rocard's Party"
 COLDWAR_FRA_psu_pol_desc: "Michel Rocard won 3.6% of the votes in 1969 and an audience far beyond them. Our cadres are inspectors of finance, engineers and union officials, and they know how a ministry works."
 COLDWAR_FRA_psu_eco: "Self-Management"
 COLDWAR_FRA_psu_eco_desc: "Management by those who do the work is our answer to both the boss and the commissar. Councils in every plant will decide what is made and how the profit is shared."
 COLDWAR_FRA_psu_a1: "The Socialist Assizes"
 COLDWAR_FRA_psu_a1_desc: "Mitterrand's PS holds the voters, and Rocard's people hold the ideas. We bring the second left into the big house and accept that our own name will fade."
 COLDWAR_FRA_psu_a2: "The Independent Left"
 COLDWAR_FRA_psu_a2_desc: "We keep the name, the red flag and the programme. The PS may sign what it wants with the Communists, and we stay free to say no to both."
 COLDWAR_FRA_psu_b1: "LIP: We Make, We Sell"
 COLDWAR_FRA_psu_b1_desc: "In Besancon the watchmakers took the stock, sold the watches and paid themselves. We want to make this a right of every workforce threatened with closure."
 COLDWAR_FRA_psu_b2: "The Regional Workshops"
 COLDWAR_FRA_psu_b2_desc: "Small workshops in Brittany, the Midi and the mountains can keep their people at home. We will give the regions the credit and the right to decide what is built."
 COLDWAR_FRA_psu_a1f: "The Road to the PS"
 COLDWAR_FRA_psu_a1f_desc: "Rocard's circle carries its ideas into the PS: decentralisation, a freer economy and a civil society that does not wait for the state. The price is a long quarrel with Mitterrand."
 COLDWAR_FRA_psu_a2f: "Bouchardeau's PSU"
 COLDWAR_FRA_psu_a2f_desc: "Huguette Bouchardeau speaks for a left that is neither pale nor loud. We will run candidates, publish our papers and keep a small office in Paris to study every law."
 COLDWAR_FRA_psu_b1f: "Workers' Cooperatives"
 COLDWAR_FRA_psu_b1f_desc: "Cooperatives will be taken as a normal form of enterprise, with credit, advice and a place in the Plan. Failing firms can be bought by those who work in them."
 COLDWAR_FRA_psu_b2f: "Live in the Country"
 COLDWAR_FRA_psu_b2f_desc: "Volem viure al pais: we want to live and work in our own country. Roads, schools and workshops will reach villages the railway left behind."
 COLDWAR_FRA_psu_pm: "The Self-Managed Society"
 COLDWAR_FRA_psu_pm_desc: "Self-management in the workshop, the commune and the region together will make a society that governs itself. It is a long road, but our cadres have been preparing it since 1960."
 COLDWAR_FRA_psu_em: "The Larzac Farmers"
 COLDWAR_FRA_psu_em_desc: "On the Larzac plateau the sheep farmers swore not to sell a field to the army. We will protect the small farm, and we will take that oath as the symbol of our politics."
 COLDWAR_FRA_psu_c1: "The Women's Movement"
 COLDWAR_FRA_psu_c1_desc: "Women will be paid the same, work as they choose and decide when to bear children. The movement is in our streets and in our party, and it will be in our laws."
 COLDWAR_FRA_psu_c2: "Ecology and Socialism"
 COLDWAR_FRA_psu_c2_desc: "Growth for its own sake gives us pollution and not happiness. We will ask where the energy comes from before we ask how much we need."
 COLDWAR_FRA_psu_d1: "Third-World Solidarity"
 COLDWAR_FRA_psu_d1_desc: "The PSU fought the Algerian war and marched against Vietnam. We will treat the former colonies as equals, and the old Africa cell at the Elysee will be closed."
 COLDWAR_FRA_psu_d2: "Neither Atlantic nor Soviet"
 COLDWAR_FRA_psu_d2_desc: "Neither Washington nor Moscow: a Europe that follows its own road. We will refuse the bloc discipline of the Atlantic and the Warsaw Pact alike."
 COLDWAR_FRA_psu_cm: "The Rights of the Regions"
 COLDWAR_FRA_psu_cm_desc: "Brittany, the Midi and Corsica must be allowed to run their own schools, their own plan and their own language. Paris should serve the regions, and the regions should not serve Paris."
 COLDWAR_FRA_psu_dm: "Non-Violence"
 COLDWAR_FRA_psu_dm_desc: "Our politics refuse the blow and the bomb. Conscientious objectors will have a civilian service, the police will keep to the law, and conflicts will be settled with words and with patience."
 COLDWAR_FRA_psu_cap: "Change Life from Below"
 COLDWAR_FRA_psu_cap_desc: "Change life from below: in the workshop, the village and the school the people decide for themselves. We never wanted the state to do it for them, and we do not intend to start now."
 COLDWAR_FRA_ecol_e: "Dumont's Glass of Water"
 COLDWAR_FRA_ecol_e_desc: "One agronomist and a glass of water on television: in 1974 that was our whole campaign. Now the glass has become a government, and it will ask the French to live with less and to live better."
 COLDWAR_FRA_ecol_pol: "The Friends of the Earth"
 COLDWAR_FRA_ecol_pol_desc: "The Friends of the Earth gave us our first militants, our first posters and our first spokesman. Brice Lalonde is young, quick and known to every journalist."
 COLDWAR_FRA_ecol_eco: "The Sober Economy"
 COLDWAR_FRA_ecol_eco_desc: "Zero growth is no slogan, it is arithmetic: the planet cannot bear a car for every family. We will measure wealth in clean water, healthy food and work that people enjoy."
 COLDWAR_FRA_ecol_a1: "A Movement, Not a Party"
 COLDWAR_FRA_ecol_a1_desc: "We are a movement, not a party: networks, committees and weekend marches without cards or chiefs. People trust us because we do not seem to be politicians."
 COLDWAR_FRA_ecol_a2: "Political Ecology"
 COLDWAR_FRA_ecol_a2_desc: "Marches do not make laws, and councillors do. We will found a real party with members, dues and candidates in every canton, and we will accept that this has a price."
 COLDWAR_FRA_ecol_b1: "The Nuclear Exit"
 COLDWAR_FRA_ecol_b1_desc: "No reactor will be started, and the plants will be closed one by one. We will pay with oil in the coming years, and we will be repaid with clean air, healthy coasts and tourists."
 COLDWAR_FRA_ecol_b2: "The Nuclear Moratorium"
 COLDWAR_FRA_ecol_b2_desc: "A pause is a promise: no new reactors until a public debate and an honest audit of the risks. The plants that are almost finished will be completed, and the rest will wait."
 COLDWAR_FRA_ecol_a1f: "Lalonde for President"
 COLDWAR_FRA_ecol_a1f_desc: "Brice Lalonde at the head of the ticket: the first time an ecologist has run for the Elysee on his own. We will take our message into every living room and every market."
 COLDWAR_FRA_ecol_a2f: "The Greens"
 COLDWAR_FRA_ecol_a2f_desc: "The Greens are now a party with a name, statutes and an Alsatian leader who says that ecology is neither right nor left. Our fight is for the long term."
 COLDWAR_FRA_ecol_b1f: "Close Fessenheim"
 COLDWAR_FRA_ecol_b1f_desc: "The oldest plant in the country stands on the Rhine plain, on a seismic zone, and the Germans across the river have been protesting against it. We close it first."
 COLDWAR_FRA_ecol_b2f: "The Malville Inquiry"
 COLDWAR_FRA_ecol_b2f_desc: "The men who came to Malville in 1977 should not have been met with grenades. We open the file in public: engineers, residents and farmers will sit at the same table."
 COLDWAR_FRA_ecol_pm: "Neither Left nor Right"
 COLDWAR_FRA_ecol_pm_desc: "Neither left nor right, but ahead: that is our line, and it cuts across every old party. Voters from both camps will vote with us, and neither camp forgives us for it."
 COLDWAR_FRA_ecol_em: "Save Energy"
 COLDWAR_FRA_ecol_em_desc: "Insulate the roofs, slow the cars, switch off the shop windows at night. The cheapest barrel of oil is the one we do not burn."
 COLDWAR_FRA_ecol_c1: "Protect the Coast"
 COLDWAR_FRA_ecol_c1_desc: "Every kilometre of coast bought is a kilometre saved from concrete. Fishing boats, bathers and walkers will keep the shore, and builders will have to find other beaches."
 COLDWAR_FRA_ecol_c2: "The National Parks"
 COLDWAR_FRA_ecol_c2_desc: "The Vanoise, the Cevennes and the Ecrins belong to everybody, including those who come after us. We will extend them, and the herds and the hunters will have to share them."
 COLDWAR_FRA_ecol_d1: "Stop the Pacific Tests"
 COLDWAR_FRA_ecol_d1_desc: "The bombs at Mururoa poison a Polynesian lagoon for a weapon that has not stopped a single war. Australia, New Zealand and the Pacific islanders have asked us to stop, and we will."
 COLDWAR_FRA_ecol_d2: "The Third World First"
 COLDWAR_FRA_ecol_d2_desc: "The hungry of the Sahel cannot be asked to wait until France has grown richer. We will pay fair prices for their harvests, and cooperation will mean wells and seeds."
 COLDWAR_FRA_ecol_cm: "Green Communes"
 COLDWAR_FRA_ecol_cm_desc: "A greener France begins at the town hall: bicycle lanes, school gardens, compost and a mayor who answers to the neighbours. The communes will be our laboratories."
 COLDWAR_FRA_ecol_dm: "Partners of Greenpeace"
 COLDWAR_FRA_ecol_dm_desc: "The ships of Greenpeace carry the cameras that reach millions. We shall work together, and no minister in Paris will be able to sink them in silence."
 COLDWAR_FRA_ecol_cap: "Live Differently"
 COLDWAR_FRA_ecol_cap_desc: "Producing and buying less, working shorter and living closer to each other: this is not a sacrifice. France will learn to live differently, and it will be the freest country in Europe."
 COLDWAR_FRA_rad_e: "The Radical Party"
 COLDWAR_FRA_rad_e_desc: "From Place de Valois the oldest party of the Republic reaches back to 1901 and to Clemenceau. We have no mass base, but we have mayors, councillors and the habit of governing."
 COLDWAR_FRA_rad_pol: "Servan-Schreiber's Challenge"
 COLDWAR_FRA_rad_pol_desc: "Jean-Jacques Servan-Schreiber, the founder of L'Express, took the party at Suresnes. He writes for millions and speaks to the young, and the old notables are afraid of him."
 COLDWAR_FRA_rad_eco: "Heaven and Earth"
 COLDWAR_FRA_rad_eco_desc: "Heaven and earth: the Manifesto promises a free economy, a Europe without borders and a state that serves the citizen. Competition and justice will go together."
 COLDWAR_FRA_rad_a1: "Join the Reformers"
 COLDWAR_FRA_rad_a1_desc: "Radicals and Lecanuet's centrists will form one reforming movement against both the UDR and the Common Programme. Some of our old comrades will not follow."
 COLDWAR_FRA_rad_a2: "The Left Radicals"
 COLDWAR_FRA_rad_a2_desc: "The Radicals of the Midi and the south-west will sign the Common Programme with the Socialists and the Communists. We put a republican brake on the nationalisations and we pay for it among the voters of the centre."
 COLDWAR_FRA_rad_b1: "Regional Power"
 COLDWAR_FRA_rad_b1_desc: "A France of strong regions, with their own budgets and elected councils, can win where centralised Paris failed. Our leader has put his own seat in Lorraine on the line."
 COLDWAR_FRA_rad_b2: "The Small Firms"
 COLDWAR_FRA_rad_b2_desc: "The shopkeeper, the craftsman and the small manufacturer are the backbone of the Republic. We will cut their forms, lower their taxes and not let the large groups starve them of credit."
 COLDWAR_FRA_rad_a1f: "Alliance with the Centre"
 COLDWAR_FRA_rad_a1f_desc: "Together with Lecanuet we have put a third force on the map: 30 deputies in 1973 and a voice that decides the vote in the Assembly. Our labels will merge, though not our principles."
 COLDWAR_FRA_rad_a2f: "Sign the Common Programme"
 COLDWAR_FRA_rad_a2f_desc: "The left Radicals bring the south-west to the Union of the Left. The Common Programme listed nine groups to be nationalised, and we asked for a list with guarantees."
 COLDWAR_FRA_rad_b1f: "The Lorraine Laboratory"
 COLDWAR_FRA_rad_b1f_desc: "Lorraine, hit by the coal and steel crisis, will be our pilot region: new industries, a university with a mission, and a council that decides locally."
 COLDWAR_FRA_rad_b2f: "The Shopkeepers' Charter"
 COLDWAR_FRA_rad_b2f_desc: "Small shops need a charter: limits on the large supermarkets, protected opening hours and cheaper credit. The shoppers will pay a bit more, and the town centres will stay alive."
 COLDWAR_FRA_rad_pm: "The Secular Republic"
 COLDWAR_FRA_rad_pm_desc: "The school of the Republic must remain secular, free and open to all. It was Radical ministers who built it, and the Radicals will protect it against every clerical or sectarian pressure."
 COLDWAR_FRA_rad_em: "The American Challenge"
 COLDWAR_FRA_rad_em_desc: "American firms are buying Europe's industry and brains. Our answer is to build bigger European firms, finance research and train managers instead of lamenting."
 COLDWAR_FRA_rad_c1: "Against the Pacific Tests"
 COLDWAR_FRA_rad_c1_desc: "A Radical leader went out to protest at Mururoa against the atmospheric tests. We will end them: nobody should be bombed in the Pacific for the sake of Paris."
 COLDWAR_FRA_rad_c2: "The Prefects' Republic"
 COLDWAR_FRA_rad_c2_desc: "The Republic is one and indivisible. The prefect stands for the law in each department, and the law is the same in Quimper, in Bastia and in Lille."
 COLDWAR_FRA_rad_d1: "A Federal Europe"
 COLDWAR_FRA_rad_d1_desc: "A federal Europe with a government, a parliament and a currency will be stronger than France alone. We will ask our partners for a European executive, and Africa will have to be run in common."
 COLDWAR_FRA_rad_d2: "The Mendesist Tradition"
 COLDWAR_FRA_rad_d2_desc: "Pierre Mendes France taught that a government must tell the truth and balance its books. We will be honest about the cost, choose rigour over promises, and keep France's independence."
 COLDWAR_FRA_rad_cm: "Civil Liberties"
 COLDWAR_FRA_rad_cm_desc: "Free speech, a free press and a free court: the Radicals have defended them for a century. We will repeal the laws of exception and open the state broadcasting monopoly."
 COLDWAR_FRA_rad_dm: "The Radical Centre"
 COLDWAR_FRA_rad_dm_desc: "We stand where the votes are decided: in the radical centre between the Gaullists and the Communists. Both camps will court us, and both will accuse us of taking the other's side."
 COLDWAR_FRA_rad_cap: "The Radical Republic"
 COLDWAR_FRA_rad_cap_desc: "A secular, European, regional and liberal Republic of small owners: this is the old Radical dream, and it is time to make it the working model of the new France."
 COLDWAR_FRA_cd_e: "The Democratic Centre"
 COLDWAR_FRA_cd_e_desc: "Jean Lecanuet won 15.8% against General de Gaulle in 1965 and showed that a free, Christian and European centre exists. Now it is asked to govern."
 COLDWAR_FRA_cd_pol: "Lecanuet's Centre"
 COLDWAR_FRA_cd_pol_desc: "Lecanuet, the senator and mayor of Rouen, speaks in sentences that fill a hall and chooses his alliances with care. The party follows him because he is the only name it has."
 COLDWAR_FRA_cd_eco: "The Social Market Economy"
 COLDWAR_FRA_cd_eco_desc: "Competition keeps prices low, solidarity keeps families whole. Our market economy has a social conscience, and it will have a ministry to keep it that way."
 COLDWAR_FRA_cd_a1: "Stay in Opposition"
 COLDWAR_FRA_cd_a1_desc: "We will not take Chaban's offer. Out of the cabinet we keep our voice and our votes in the free centre, and we remain a reforming opposition with clean hands."
 COLDWAR_FRA_cd_a2: "Join the Majority"
 COLDWAR_FRA_cd_a2_desc: "Duhamel and Pleven have accepted portfolios under Chaban-Delmas. The reforms of the Nouvelle Societe need our votes, and we will have the benefits of office in return."
 COLDWAR_FRA_cd_b1: "Family Policy"
 COLDWAR_FRA_cd_b1_desc: "The family is the first school of the nation. We will raise allowances, protect the family quotient and make it possible for a young couple to have a third child."
 COLDWAR_FRA_cd_b2: "Credit for the Farmers"
 COLDWAR_FRA_cd_b2_desc: "A farmer who cannot borrow cannot modernise, and a village without a farmer dies. We will extend long-term loans at fair rates, and we will help the young to settle on the land."
 COLDWAR_FRA_cd_a1f: "The Reformers' Movement"
 COLDWAR_FRA_cd_a1f_desc: "With the Radicals we form the Reformers' Movement, and it can win more seats than the old centre ever managed. We hold the middle, and we hope that it does not melt into one party."
 COLDWAR_FRA_cd_a2f: "Duhamel's Ministries"
 COLDWAR_FRA_cd_a2f_desc: "Duhamel at Agriculture and then at Culture shows that the centre can deliver: new roads for his Jura, new houses of culture for the provinces, and a Plan that listens to us."
 COLDWAR_FRA_cd_b1f: "Family Allowances"
 COLDWAR_FRA_cd_b1f_desc: "Family allowances will be raised faster than the prices, and large families will have priority for housing. For us this is not charity but investment in the French."
 COLDWAR_FRA_cd_b2f: "The Credit Agricole"
 COLDWAR_FRA_cd_b2f_desc: "The Credit agricole is the farmers' own bank, and we will give it new powers to finance the mills, the dairies and the young settlers. Rural France will have its own capital."
 COLDWAR_FRA_cd_pm: "The Centre of Social Democrats"
 COLDWAR_FRA_cd_pm_desc: "The Centre democrate, the CDP and the Social Democrats are merging into one party, the Centre of Social Democrats. Our name says what we stand for."
 COLDWAR_FRA_cd_em: "Christian Democracy"
 COLDWAR_FRA_cd_em_desc: "Subsidiarity, solidarity and the dignity of the person are the three principles of the social doctrine. The state must serve the person, and the family and the commune must be heard first."
 COLDWAR_FRA_cd_c1: "Free Schools"
 COLDWAR_FRA_cd_c1_desc: "Parents have the right to choose the school. Private schools under contract with the state are cheaper than the public ones, and they bring in two million children."
 COLDWAR_FRA_cd_c2: "The Secular Truce"
 COLDWAR_FRA_cd_c2_desc: "No new school war: we will accept the Debre law as it is. A truce between the two schools lets us spend the money on classrooms and not on quarrels."
 COLDWAR_FRA_cd_d1: "A European Centre"
 COLDWAR_FRA_cd_d1_desc: "The CDU in Bonn and our party in Paris share one conviction: Europe is built by two countries who have stopped hating each other. We shall offer Bonn a standing centrist axis."
 COLDWAR_FRA_cd_d2: "The Atlantic Centre"
 COLDWAR_FRA_cd_d2_desc: "France belongs to the Atlantic world, and we will say so: joint exercises, common planning and a seat in the councils where defence is decided. Neutrality is not a policy."
 COLDWAR_FRA_cd_cm: "The Church Schools"
 COLDWAR_FRA_cd_cm_desc: "Our school policy secures contracts, teacher salaries and buildings for the private schools. They are older than the Republic, and they teach the children of the Vendee and the Nord."
 COLDWAR_FRA_cd_dm: "The Christian Democrat International"
 COLDWAR_FRA_cd_dm_desc: "From Rome to Brussels the Christian democrats are an international family. We will have friends in every cabinet, in Bonn, in Rome and in Brussels."
 COLDWAR_FRA_cd_cap: "The Social Centre"
 COLDWAR_FRA_cd_cap_desc: "A social, European and Christian centre for France: neither the Gaullist state nor the Common Programme. We are asking the French to give it a long lease."
 COLDWAR_FRA_fn_e: "The National Front"
 COLDWAR_FRA_fn_e_desc: "Ordre Nouveau's militants and the old Poujadists have found a front man in Jean-Marie Le Pen. We run as a national opposition that is neither Gaullist nor Marxist, and we mean to stay."
 COLDWAR_FRA_fn_pol: "Le Pen's Front"
 COLDWAR_FRA_fn_pol_desc: "Le Pen is the party's voice, its list-leader and its only reliable draw. Posters carry his face and rallies end with his speech, and the Front learns to run as one man's movement."
 COLDWAR_FRA_fn_eco: "The Shopkeepers' Revolt"
 COLDWAR_FRA_fn_eco_desc: "The grocer, the baker and the craftsman pay for everyone and are heard by no one. We will be the party of the small independent against the tax inspector and the supermarket."
 COLDWAR_FRA_fn_a1: "The Electoral Front"
 COLDWAR_FRA_fn_a1_desc: "Le Pen insists on the ballot box: tidy lists, legal meetings, candidates with a profession and a clean record. Cadres who want street fights have been told that this is no longer their party."
 COLDWAR_FRA_fn_a2: "The Street of Ordre Nouveau"
 COLDWAR_FRA_fn_a2_desc: "Ordre Nouveau taught us to hold the street: stewards, poster squads and a hundred men who answer the call. The press calls it violence, the base calls it discipline, and the Interior Ministry has its files ready."
 COLDWAR_FRA_fn_b1: "National Preference"
 COLDWAR_FRA_fn_b1_desc: "French jobs, French housing and family allowances come first for French citizens. The unions call it a divide among workers, the partners call it discrimination, and our voters call it justice."
 COLDWAR_FRA_fn_b2: "The Tax Revolt"
 COLDWAR_FRA_fn_b2_desc: "Le Pen's pledge is simple: abolish the income tax and let the family and the firm keep what they earn. The Treasury will have to learn thrift, and wage earners will have to believe us."
 COLDWAR_FRA_fn_a1f: "The Dreux Breakthrough"
 COLDWAR_FRA_fn_a1f_desc: "In Dreux a local list under Jean-Pierre Stirbois took one voter in six, and the mayor's team needed us in the second round. The wall of the cordon sanitaire has a first crack."
 COLDWAR_FRA_fn_a2f: "The Faire Front Committees"
 COLDWAR_FRA_fn_a2f_desc: "The committees stand at the market, the school gate and the estate entrance: leafleting, watch duty and answering the Communists' stalls. They are noisy, cheap and quick to organise."
 COLDWAR_FRA_fn_b1f: "French Workers First"
 COLDWAR_FRA_fn_b1f_desc: "Our voters work in the steel valleys of Lorraine and the mines of the Nord, and they have seen the plants close. The Front promises the next job to a French worker."
 COLDWAR_FRA_fn_b2f: "Abolish the Income Tax"
 COLDWAR_FRA_fn_b2f_desc: "The scale is cut in a single stroke: no more progressive income tax, a lower flat levy on firms, and thrift in every ministry. The Finance Ministry says the numbers do not close, and we say they will."
 COLDWAR_FRA_fn_pm: "The Proportional Breakthrough"
 COLDWAR_FRA_fn_pm_desc: "Mitterrand's switch to proportional representation has let us into the Assembly with thirty-five deputies. A national party with a group, a tribune and a budget now stands in the Palais Bourbon."
 COLDWAR_FRA_fn_em: "The Small Business Charter"
 COLDWAR_FRA_fn_em_desc: "A charter of ten promises for those who own their tools: one tax inspection a year, quick payment of public contracts and a legal shield against the hypermarket. Our shopkeepers have asked for it since 1956."
 COLDWAR_FRA_fn_c1: "Stop Immigration"
 COLDWAR_FRA_fn_c1_desc: "Recruitment from Algeria and Morocco stopped in 1974 and we will not restart it. Yet the building sites and the car lines need hands, and the employers have not forgiven us for saying so."
 COLDWAR_FRA_fn_c2: "Security First"
 COLDWAR_FRA_fn_c2_desc: "Streets, estates and metro stations will have more officers, longer sentences and faster expulsions. The Interior Ministry will have its funds, and the Ligue des droits de l'homme its case."
 COLDWAR_FRA_fn_d1: "The Memory of French Algeria"
 COLDWAR_FRA_fn_d1_desc: "A million pieds-noirs, harkis and veterans remember Algiers and Oran, and our party was born among them. We will not forget them, and Algiers and its oil will not forget us."
 COLDWAR_FRA_fn_d2: "The Nationalist International"
 COLDWAR_FRA_fn_d2_desc: "No federal Europe: a union of fatherlands whose nationalist parties compare notes. Rome's Social Movement has the same enemies, and Strasbourg gives us the platform."
 COLDWAR_FRA_fn_cm: "The Return Policy"
 COLDWAR_FRA_fn_cm_desc: "A grant, a ticket and a house at home: the Return Policy asks foreign workers to go back and pays them to do so. Employers must find replacements, and Algiers will say what it thinks."
 COLDWAR_FRA_fn_dm: "The European Right"
 COLDWAR_FRA_fn_dm_desc: "In the 1984 European election one Frenchman in nine voted for us. Ten of our members sit in Strasbourg, in a group of the European right with the Italians and the Greeks."
 COLDWAR_FRA_fn_g1: "The Solidarists"
 COLDWAR_FRA_fn_g1_desc: "Stirbois and the solidarists speak for the dole queue and the housing estate. They want kitchens, clinics and municipal jobs for the French poor, and they speak the language of the unions."
 COLDWAR_FRA_fn_g2: "The Catholic Traditionalists"
 COLDWAR_FRA_fn_g2_desc: "The parish, the Catholic school and the countryside have been left unrepresented since the Council. Romain Marie's circle brings us priests, farmers and large families who vote on Sunday."
 COLDWAR_FRA_fn_h1: "The Death Penalty Referendum"
 COLDWAR_FRA_fn_h1_desc: "Badinter abolished the guillotine in 1981 against most opinion polls. We will ask the people directly whether it comes back, and no judge may answer for them."
 COLDWAR_FRA_fn_h2: "The Police Unions"
 COLDWAR_FRA_fn_h2_desc: "In the police stations our programme finds its warmest readers. The officer's union wants rank, pay and a free hand, and we promise it."
 COLDWAR_FRA_fn_g1f: "Duprat's Cadres"
 COLDWAR_FRA_fn_g1f_desc: "François Duprat built the doctrine and the card index of the movement before he died. His cadre schools gave us a staff that thinks, and an inheritance we do not discuss in public."
 COLDWAR_FRA_fn_g2f: "Christendom and Solidarity"
 COLDWAR_FRA_fn_g2f_desc: "Our Catholic network runs from the Vendée to Alsace: parish halls, summer universities and the great pilgrimage to Chartres. Votes come in with the offertory."
 COLDWAR_FRA_fn_h1f: "Popular Initiative"
 COLDWAR_FRA_fn_h1f_desc: "Citizens will be able to put a question to the whole country if enough of them sign. Parliament will not like it, and Brussels will like it less."
 COLDWAR_FRA_fn_h2f: "Police Bonuses"
 COLDWAR_FRA_fn_h2f_desc: "Danger pay, a faster pension and a housing allowance for officers. The Finance Ministry will complain at the first budget, and the station in the 18th arrondissement will not."
 COLDWAR_FRA_fn_gm: "Present Daily"
 COLDWAR_FRA_fn_gm_desc: "Present is a daily paper at last, with Catholic columns, Le Pen's editorials and a loyal readership. For the first time the movement's press can answer the day's news the same morning."
 COLDWAR_FRA_fn_hm: "The National Circles"
 COLDWAR_FRA_fn_hm_desc: "Circles for repatriates, workers, farmers, nurses and police officers: an organised society of the right around the party. Members get a card, a newsletter and a nearby meeting hall."
 COLDWAR_FRA_fn_k1: "Allowances for French Families"
 COLDWAR_FRA_fn_k1_desc: "A parental wage for the mother, higher allowances for the third child and cheap loans for young couples. France must have children again, and the family is the first thing the state must pay for."
 COLDWAR_FRA_fn_k2: "Veterans' Pensions"
 COLDWAR_FRA_fn_k2_desc: "Veterans of Indochina and Algeria, and the conscripts of the 1950s, have waited long enough for an equal pension. We will pay them, and expect them in the ranks of the party."
 COLDWAR_FRA_fn_k3: "Overseas France Forever"
 COLDWAR_FRA_fn_k3_desc: "Réunion, the Antilles, Guiana and Nouméa are France. We will not give a square metre to any independence movement, and we will pay for what that costs."
 COLDWAR_FRA_fn_k4: "The Le Pen Machine"
 COLDWAR_FRA_fn_k4_desc: "Posters in every village, a paid staff in every département and a leader who knows every secretary by name. The machine wins ballots, and it sometimes forgets the difference between party and state."
 COLDWAR_FRA_fn_cap: "The National Revival"
 COLDWAR_FRA_fn_cap_desc: "The nation's old strengths return: the family, the franc, the border and the army. Abroad this looks like closing the shutters, and at home it looks like the first morning of a long summer."
 COLDWAR_FRA_faf_e: "The Army Steps In"
 COLDWAR_FRA_faf_e_desc: "After months of strikes and street fighting the chiefs of staff have taken the government into their hands. We call it a temporary emergency, and every capital in Europe watches whether the word 'temporary' holds."
 COLDWAR_FRA_faf_pol: "The Committee of Public Safety"
 COLDWAR_FRA_faf_pol_desc: "A committee of generals and trusted prefects sits in the Invalides and watches the ministries. Names are familiar from 1958, and so are the arguments about who is in charge."
 COLDWAR_FRA_faf_eco: "The Economy of Order"
 COLDWAR_FRA_faf_eco_desc: "Strikes are forbidden and factory output is ordered like a barracks supply list. The Plan is now a military schedule, and the shops feel the difference first."
 COLDWAR_FRA_faf_a1: "The Massu Line"
 COLDWAR_FRA_faf_a1_desc: "Massu's line says the army serves the institutions of 1958 and not its own ambitions. It speaks the language of de Gaulle, which reassures the partners and angers the colonels who wanted more."
 COLDWAR_FRA_faf_a2: "The Salan Line"
 COLDWAR_FRA_faf_a2_desc: "Salan's men do not accept the loss of Algiers and call the Evian accords treason. They bring hardened officers and years of combat experience, and a long list of enemies in Washington and Algiers."
 COLDWAR_FRA_faf_b1: "The Professional State"
 COLDWAR_FRA_faf_b1_desc: "The army will be smaller and better: volunteers, longer contracts and specialists in every trade. The barracks no longer need a mass of conscripts, and the cost moves to the payroll."
 COLDWAR_FRA_faf_b2: "The People in Uniform"
 COLDWAR_FRA_faf_b2_desc: "The whole cohort serves, and the nation sees itself in its army. Our factories lose their apprentices for a year, and the barracks gain a fresh class every autumn."
 COLDWAR_FRA_faf_a1f: "The Baden-Baden Pact"
 COLDWAR_FRA_faf_a1f_desc: "The pact binds the army to the republic's institutions, and the republic to its army: pay, promotion and an honourable place in the state. Each side watches the other."
 COLDWAR_FRA_faf_a2f: "Rehabilitate the Officers"
 COLDWAR_FRA_faf_a2f_desc: "The generals of 1961 return to the lists with rank and pension. They are experienced, loyal to the cause and a quarrelsome lot, and the partners cannot forget the Algiers putsch."
 COLDWAR_FRA_faf_b1f: "Bigeard's Ministry"
 COLDWAR_FRA_faf_b1f_desc: "Bigeard's ministry runs on paratroop rules: short orders, quick promotion and rewards for results in the field. Conscripts learn why the old colonel is a legend and why he is not a politician."
 COLDWAR_FRA_faf_b2f: "Eighteen Months Again"
 COLDWAR_FRA_faf_b2f_desc: "Eighteen months in the ranks, as in the fifties, and no deferments for students. The class of this year will march in the street against us, and the army will have more men to drill."
 COLDWAR_FRA_faf_pm: "Rule by Article Sixteen"
 COLDWAR_FRA_faf_pm_desc: "Article 16 gives the head of state all necessary powers while institutions are threatened. We say the institutions are threatened, and nobody outside the Hôtel de Brienne gets to say otherwise."
 COLDWAR_FRA_faf_em: "Order in the Factories"
 COLDWAR_FRA_faf_em_desc: "Shop stewards are replaced by officers' liaison men, and the main gate is guarded. Output rises on paper, and the memory of the Grenelle strike weighs on every shift."
 COLDWAR_FRA_faf_c1: "A Short Emergency"
 COLDWAR_FRA_faf_c1_desc: "We have promised to end the emergency within a fixed time and to hold elections afterwards. The partners are cautiously relieved, and the hardliners say the army has been lied to."
 COLDWAR_FRA_faf_c2: "The Permanent Emergency"
 COLDWAR_FRA_faf_c2_desc: "There is no date for the end: as long as subversion exists, the emergency stands. Magistrates, students and unions have a word for that, and so does every Western foreign ministry."
 COLDWAR_FRA_faf_d1: "Atlantic Anti-Communism"
 COLDWAR_FRA_faf_d1_desc: "The generals decide that Moscow is the enemy and Washington is the shield. Cooperation with the Americans and SACEUR is restored, which brings money and technology and costs us the Gaullist claim to be independent."
 COLDWAR_FRA_faf_d2: "All-Azimuth Sovereignty"
 COLDWAR_FRA_faf_d2_desc: "The deterrent faces every direction, as General Ailleret said: nobody gets a promise of protection and nobody gets a fixed enemy. It keeps our hands free and our allies uneasy."
 COLDWAR_FRA_faf_cm: "Military Tribunals"
 COLDWAR_FRA_faf_cm_desc: "Military courts will try crimes against the state in days and not years. Lawyers call it exceptional justice, and the accused find it quick."
 COLDWAR_FRA_faf_dm: "The Generals' Diplomacy"
 COLDWAR_FRA_faf_dm_desc: "Our military attachés and the African chiefs of staff share a mess and a language. The generals reach more heads of state than the diplomats ever did."
 COLDWAR_FRA_faf_g1: "Return Power to Civilians"
 COLDWAR_FRA_faf_g1_desc: "The officers return to their regiments and the election date stays. The republic is back and respectable, and the staff officers wonder what the emergency was for."
 COLDWAR_FRA_faf_g2: "The Generals Stay"
 COLDWAR_FRA_faf_g2_desc: "The Directory has decided to stay until the country is in order. It names the prefects, the board of the radio and the heads of public firms, and nobody voted for it."
 COLDWAR_FRA_faf_h1: "The Paras"
 COLDWAR_FRA_faf_h1_desc: "The 'bérets rouges' are the army's best men and its most political ones. A paratrooper brigade can reach any crisis within hours, if the Chief of the General Staff trusts its colonel."
 COLDWAR_FRA_faf_h2: "The Legion"
 COLDWAR_FRA_faf_h2_desc: "The Legion fights where it is sent and does not argue: Calvi, Djibouti, Chad and Kolwezi. It is cheap in votes at home and expensive for our reputation abroad."
 COLDWAR_FRA_faf_g1f: "A Constitution of Order"
 COLDWAR_FRA_faf_g1f_desc: "A drafting commission writes a new text with a strong president, a small army budget line and an election calendar. The jurists are the only ones pleased."
 COLDWAR_FRA_faf_g2f: "The Military Directory"
 COLDWAR_FRA_faf_g2f_desc: "A standing council of five generals sets policy. It meets in the Invalides, and agrees with the Chief of Staff, which tends to save time."
 COLDWAR_FRA_faf_h1f: "The Eleventh Para Division"
 COLDWAR_FRA_faf_h1f_desc: "The Eleventh Division is a shock force with its base around Toulouse and Pau. It is expensive to equip and easy to drop where it is needed."
 COLDWAR_FRA_faf_h2f: "The Legion's Bases"
 COLDWAR_FRA_faf_h2f_desc: "The Legion's bases at Aubagne, Calvi and Djibouti are rebuilt and linked by road and rail. They are cheap to keep and a long way from the Elysée."
 COLDWAR_FRA_faf_gm: "The Soldiers' Republic"
 COLDWAR_FRA_faf_gm_desc: "The army is a school of the nation and the model of the republic. Officers occupy posts in every town hall, and every citizen has a soldier in the family."
 COLDWAR_FRA_faf_hm: "The Army of Africa Returns"
 COLDWAR_FRA_faf_hm_desc: "The old army of Africa is reborn from Dakar to Djibouti: tirailleurs, spahis and the Legion on the old roads. The African presidents are glad of it, and the Algerians have not forgotten what it did."
 COLDWAR_FRA_faf_k1: "Purge the Prefectures"
 COLDWAR_FRA_faf_k1_desc: "Prefects who sympathised with the strikers are replaced by officers and retired colonels. The administration stops its quarrels, and the mayors stop their cooperation."
 COLDWAR_FRA_faf_k2: "The National Service Year"
 COLDWAR_FRA_faf_k2_desc: "Every young man and woman gives a year to the nation: a mix of drill, road building and literacy classes. Employers must wait for their apprentices."
 COLDWAR_FRA_faf_k3: "Officers in the Ministries"
 COLDWAR_FRA_faf_k3_desc: "Colonels sit as directors in the ministries and prefectures, where they get the telephones answered and the files moved. Engineers and economists leave, and they take their notes with them."
 COLDWAR_FRA_faf_k4: "The Veterans' Associations"
 COLDWAR_FRA_faf_k4_desc: "Veterans from Indochina to Algeria have associations in every town. They provide stewards, funds and votes, and they expect to be paid back."
 COLDWAR_FRA_faf_cap: "The Order of the Army"
 COLDWAR_FRA_faf_cap_desc: "The army has become the republic's tutor. Its discipline fills the state and its caution keeps the economy small, and for the partners it is the price of a quiet country."
 COLDWAR_FRA_orl_e: "The Count of Paris"
 COLDWAR_FRA_orl_e_desc: "The Count of Paris has waited for France to ask. He is a heir of Saint Louis who has met de Gaulle, wrote a constitution and kept his counsel, and he is ready to serve if called."
 COLDWAR_FRA_orl_pol: "The King's Party"
 COLDWAR_FRA_orl_pol_desc: "Young royalists from the Nouvelle Action française and the Count's staff organise meetings, memoranda and an annual summer school. Not a mass party yet, but a network of young people who know what they believe."
 COLDWAR_FRA_orl_eco: "The Social Monarchy"
 COLDWAR_FRA_orl_eco_desc: "The Count's constitution gives the king the role of arbiter between the interests, with councils of the trades beside the Assembly. The monarchy, he says, should defend the weak from both the market and the party apparatus."
 COLDWAR_FRA_orl_a1: "Through the Ballot"
 COLDWAR_FRA_orl_a1_desc: "A royal candidate in a presidential election, or a referendum that makes the head of state hereditary after a majority has voted for it. It is slow and legal, and the Count's age is against it."
 COLDWAR_FRA_orl_a2: "The Direct Restoration"
 COLDWAR_FRA_orl_a2_desc: "The Count is proclaimed king in the capital, the army and prefects confirm him, and the Assembly is told to follow. The people are surprised, the republicans are furious, and the great powers wait to see who will recognise him."
 COLDWAR_FRA_orl_b1: "The Maurrassians"
 COLDWAR_FRA_orl_b1_desc: "Maurras taught that France is a body of institutions, that kings made it and that a king must keep it. His pupils fill the lecture halls and the seminaries, and the republicans call them reactionaries."
 COLDWAR_FRA_orl_b2: "The Royalist Left"
 COLDWAR_FRA_orl_b2_desc: "The royalists of the left read Gaullists, trade unionists and Proudhon, and they want a monarchy against the power of money. Industrialists who gave to the cause pull their cheques, and the traditionalists grumble."
 COLDWAR_FRA_orl_a1f: "Henri for the Elysee"
 COLDWAR_FRA_orl_a1f_desc: "A man of seventy stands for the highest office in a republic, with a grave manner and an old name. The posters say simply 'Henri', and the crowds who come are older than expected."
 COLDWAR_FRA_orl_a2f: "Coronation at Reims"
 COLDWAR_FRA_orl_a2f_desc: "The cathedral at Reims is the setting where Clovis's successors were crowned for eight centuries. The holy oil, the sword and the crown will be shown to television cameras, and half the country will watch and half will switch off."
 COLDWAR_FRA_orl_b1f: "Aspects of France"
 COLDWAR_FRA_orl_b1f_desc: "Aspects de la France appears every Thursday with its lead article, its literary pages and its list of subscribers. It is a weekly for the converted that finds new converts among students."
 COLDWAR_FRA_orl_b2f: "Royaliste"
 COLDWAR_FRA_orl_b2f_desc: "Royaliste shows up at the factory gate and the lecture hall, and has opinions about nuclear power, television and Poland. It does not please the old families, and young readers like it."
 COLDWAR_FRA_orl_pm: "The Arbiter King"
 COLDWAR_FRA_orl_pm_desc: "The king stands above the parties and names the head of government, the first duty being to keep the state together. He reigns, and the ministers rule."
 COLDWAR_FRA_orl_em: "The Saint Louis Foundation"
 COLDWAR_FRA_orl_em_desc: "The foundation holds the family's papers and funds history chairs, schools and an annual prize for civic service. It teaches that the French state is older than the Republic."
 COLDWAR_FRA_orl_c1: "The Concordat"
 COLDWAR_FRA_orl_c1_desc: "The Church is restored to a place in public life: chaplains, school grants and a seat for the bishops at coronations. Parishes are warm, and the lay schools are cold."
 COLDWAR_FRA_orl_c2: "The Secular Crown"
 COLDWAR_FRA_orl_c2_desc: "The king is anointed in the name of the nation, not by the Church alone. Public schools stay public, and the bishops will say what they think."
 COLDWAR_FRA_orl_d1: "The Dynasties of Europe"
 COLDWAR_FRA_orl_d1_desc: "Madrid, Brussels and Windsor receive the Count and his family with honours. A monarchy of the French makes sense in a Europe of crowned heads, and the Africans may feel forgotten."
 COLDWAR_FRA_orl_d2: "The King of the French Abroad"
 COLDWAR_FRA_orl_d2_desc: "The Count says the king is the king of every French-speaking people, not only of the Hexagon: Quebec, Wallonia, Lebanon and the Sahel. African presidents like the idea, and Brussels and Ottawa are polite."
 COLDWAR_FRA_orl_cm: "The Royal Council"
 COLDWAR_FRA_orl_cm_desc: "A Council of the Crown meets under the king: former prime ministers, magistrates and the heads of the great corps. It answers to the king and not to the party that governs."
 COLDWAR_FRA_orl_dm: "Royal Visits"
 COLDWAR_FRA_orl_dm_desc: "The king travels to Madrid, Brussels, London and Rabat as an equal of other crowns. He signs agreements that the Quai d'Orsay prepared and the press follows every step."
 COLDWAR_FRA_orl_g1: "Orleanist Succession"
 COLDWAR_FRA_orl_g1_desc: "The succession passes from the Count to his chosen grandsons, and the cadet branch of Bourbon-Anjou is told to wait. Legitimists in Madrid and Paris will not applaud."
 COLDWAR_FRA_orl_g2: "Unite with the Legitimists"
 COLDWAR_FRA_orl_g2_desc: "The Count and the Bourbon heir of Madrid agree on one crown and one family, as Chambord and Paris did in 1883. Legitimist families come back to the cause, and the Orléanists mourn their tradition."
 COLDWAR_FRA_orl_h1: "The Old Provinces"
 COLDWAR_FRA_orl_h1_desc: "Brittany, Provence, Languedoc and Burgundy get back their historic names, assemblies and the right to speak their own tongue in the schools. Paris will find it hard to give an order."
 COLDWAR_FRA_orl_h2: "The King's Prefects"
 COLDWAR_FRA_orl_h2_desc: "Napoleon's prefects serve the king: one chain of command from the Crown to the commune. Roads, schools and police work well enough, and nobody has asked the regions."
 COLDWAR_FRA_orl_g1f: "The Duke of Vendome"
 COLDWAR_FRA_orl_g1f_desc: "A young prince, grandson of the Count, carries the family name and the hope of a long dynasty. He studies in Paris and attends receptions, and the older royalists watch him carefully."
 COLDWAR_FRA_orl_g2f: "The Fusion"
 COLDWAR_FRA_orl_g2f_desc: "The white flag and the tricolour are reconciled at last. Madrid's cousins pay a visit, and old families attend the wedding that unites the lines."
 COLDWAR_FRA_orl_h1f: "Brittany and Provence"
 COLDWAR_FRA_orl_h1f_desc: "In Rennes and Aix the king appears before the estates and swears to the old charters. The regions feel respected, and Paris counts the cost."
 COLDWAR_FRA_orl_h2f: "The Crown Administration"
 COLDWAR_FRA_orl_h2f_desc: "The Crown's Administration gets a single corps of officials, a single budget and a single code of conduct from Dunkirk to Nice. It works, and nobody loves it."
 COLDWAR_FRA_orl_gm: "The Restored Monarchy"
 COLDWAR_FRA_orl_gm_desc: "The throne is secure and the succession is clear. The Count's heirs are named and the other houses of Europe have sent their greetings, and the republic's old courthouses now fly a new flag."
 COLDWAR_FRA_orl_hm: "The Crown and the Regions"
 COLDWAR_FRA_orl_hm_desc: "The old provinces are restored as the Crown's regions, each with a governor and an assembly. The map of 1789 is back, with Brittany and Corsica among them."
 COLDWAR_FRA_orl_k1: "The Royal Household"
 COLDWAR_FRA_orl_k1_desc: "A household of secretaries, chaplains and officers of the court keeps the king's diary and answers his letters. A civil list is paid by the state, as under Louis-Philippe."
 COLDWAR_FRA_orl_k2: "The Noble Orders"
 COLDWAR_FRA_orl_k2_desc: "The Order of Saint Louis, the Legion of Honour and the Order of the Holy Spirit give a king the means to reward service. Veterans enjoy it, and republican workers think it comic."
 COLDWAR_FRA_orl_k3: "Crown Lands"
 COLDWAR_FRA_orl_k3_desc: "Royal parks, forests and chateaux are held by the Crown again, as Chambord and Rambouillet once were. Tenants pay modest rents, and the Treasury loses some."
 COLDWAR_FRA_orl_k4: "The Royal Guard"
 COLDWAR_FRA_orl_k4_desc: "A guard of picked soldiers escorts the king and parades at Versailles. It is small, handsome and costs a surprising amount."
 COLDWAR_FRA_orl_cap: "The Capetian Monarchy"
 COLDWAR_FRA_orl_cap_desc: "A thousand years after Hugh Capet the crown of France is worn again by a descendant. The state has a continuity that elections never gave it, and the republic is now a memory."
 COLDWAR_FRA_gp_root: "France Above All"
 COLDWAR_FRA_gp_root_desc: "France was never meant to be a medium power. The regime that rules her now owes her a rank, and the whole world will be told so."
 COLDWAR_FRA_gp_eurafrica: "The Eurafrican Destiny"
 COLDWAR_FRA_gp_eurafrica_desc: "Europe alone is a peninsula, and Africa alone is a promise. Joined under Paris, they are a continent-sized power with a tropical hinterland."
 COLDWAR_FRA_gp_armee: "La Grande Armee"
 COLDWAR_FRA_gp_armee_desc: "Napoleon's army marched on its stomach, de Gaulle's was told to think. Ours will do both, and be the strongest in the west."
 COLDWAR_FRA_gp_maghreb: "The Lost Provinces"
 COLDWAR_FRA_gp_maghreb_desc: "Oran, Algiers and Constantine were three departments of France when the Republic could still be proud of them. A million French left Algeria in 1962, and none forgot."
 COLDWAR_FRA_gp_latin: "The Latin Bloc"
 COLDWAR_FRA_gp_latin_desc: "France, Italy and Spain share the same Latin past and, often, the same interests. If Bonn and London set the tone in the EC, we must find our own chorus."
 COLDWAR_FRA_gp_af_federation: "A Franco-African Federation"
 COLDWAR_FRA_gp_af_federation_desc: "If the African republics will not be colonies, let them be provinces of a larger France with their own parliaments. Equal pay and equal votes in return for one flag."
 COLDWAR_FRA_gp_af_protectorates: "The New Protectorates"
 COLDWAR_FRA_gp_af_protectorates_desc: "Independence on paper, security from Paris in fact. A protectorate with a seat at the UN is cheaper than a colony and harder for the neighbours to attack."
 COLDWAR_FRA_gp_ar_mass: "Three Years' Service"
 COLDWAR_FRA_gp_ar_mass_desc: "Three years in the ranks for every young Frenchman, as in 1913. It is a hard bargain, and the army will have its mass again."
 COLDWAR_FRA_gp_ar_elite: "The Professional Legions"
 COLDWAR_FRA_gp_ar_elite_desc: "A volunteer army of long-service professionals, as the Legion and the marines have always been. Smaller, harder and expensive, but it will not break under fire."
 COLDWAR_FRA_gp_ma_diplo: "The Evian Revision"
 COLDWAR_FRA_gp_ma_diplo_desc: "Let us talk again about what was signed at Evian: oil, bases and the settlers' rights. If Algiers wants French credits and French jobs, it will find a way to be sensible."
 COLDWAR_FRA_gp_ma_force: "The Return to Algiers"
 COLDWAR_FRA_gp_ma_force_desc: "Algeria was won at too high a price to be forgotten. If Algiers will not talk, a French army knows the way to Algiers."
 COLDWAR_FRA_gp_la_spain: "The Pyrenees Pact"
 COLDWAR_FRA_gp_la_spain_desc: "A pact across the Pyrenees: arms, ports and a common line toward the south. Spain is poorer but has a long Atlantic coast and a soldier's instinct."
 COLDWAR_FRA_gp_la_italy: "The Alpine Pact"
 COLDWAR_FRA_gp_la_italy_desc: "Italy and France share the Alps, a language family and a number of unhappy tariffs. A pact through the mountains would end the quarrels at the passes."
 COLDWAR_FRA_gp_af_franc: "One Franc for Two Continents"
 COLDWAR_FRA_gp_af_franc_desc: "Make the franc the money of both banks of the Mediterranean and the Treasury becomes the banker of two continents. A guarantee costs us nothing as long as the parity holds."
 COLDWAR_FRA_gp_af_garrisons: "Permanent Garrisons"
 COLDWAR_FRA_gp_af_garrisons_desc: "A treaty is only worth the battalion that stands behind it. We put French troops in Dakar, Libreville and Djibouti and keep them there."
 COLDWAR_FRA_gp_ar_reserve: "The Territorial Reserve"
 COLDWAR_FRA_gp_ar_reserve_desc: "Every town gets its reservist battalion, every commune a rifle on the wall. A territory this wide cannot be defended from Paris alone."
 COLDWAR_FRA_gp_ar_paras: "Airborne Corps"
 COLDWAR_FRA_gp_ar_paras_desc: "Paratroopers and the Legion are the sword the Republic can draw within a day. Kolwezi taught the world what that sword does."
 COLDWAR_FRA_gp_ma_pieds: "The Pieds-Noirs' Return"
 COLDWAR_FRA_gp_ma_pieds_desc: "The settlers who left in 1962 can go back, with guarantees written in the treaty. Their vineyards and orange groves would feed Marseille again."
 COLDWAR_FRA_gp_ma_plans: "Operation Resurrection"
 COLDWAR_FRA_gp_ma_plans_desc: "The staff plans of 1958 are dusted off, desk by desk and map by map. If the order comes, no officer will have to ask where to begin."
 COLDWAR_FRA_gp_la_portugal: "The Atlantic Latins"
 COLDWAR_FRA_gp_la_portugal_desc: "Lisbon has colonies in Africa, bases in the Atlantic and a long friendship with the British. A Latin pact would loosen that hold and offer the Portuguese a French shield."
 COLDWAR_FRA_gp_la_belgium: "Wallonia and Brussels"
 COLDWAR_FRA_gp_la_belgium_desc: "Wallonia and Brussels speak our language and read our newspapers. A Belgium drawn toward Paris would give the Latin bloc a northern gateway."
 COLDWAR_FRA_gp_af_army: "The Army of Africa"
 COLDWAR_FRA_gp_af_army_desc: "The old Armee d'Afrique, its tirailleurs, spahis and marines, becomes the standing instrument of the African policy. It knows the terrain and the terrain knows it."
 COLDWAR_FRA_gp_ar_staff: "The Superior War School"
 COLDWAR_FRA_gp_ar_staff_desc: "A general staff that thinks in decades. Saint-Cyr trains the captains, the war school trains the men who will command the army that does the thinking."
 COLDWAR_FRA_gp_ma_sahara: "The Saharan Oil"
 COLDWAR_FRA_gp_ma_sahara_desc: "Hassi Messaoud flows again under our flag. The Sahara is the oil well our whole industry always wanted next door."
 COLDWAR_FRA_gp_la_faction: "The Latin Union"
 COLDWAR_FRA_gp_la_faction_desc: "A Latin Union with its own council and secretariat. We will not wait for Brussels to give us the rank that the map and history already confirm."
 COLDWAR_FRA_gp_af_uranium: "The Uranium Empire"
 COLDWAR_FRA_gp_af_uranium_desc: "Arlit and Franceville feed our reactors. We will keep paying more than the market asks, because security of supply is the price of the deterrent."
 COLDWAR_FRA_gp_af_oil: "Elf's Empire"
 COLDWAR_FRA_gp_af_oil_desc: "Gabonese and Congolese crude, pumped by Elf, is the one barrel we control. What the pumps give us we owe to the men who sit in Libreville."
 COLDWAR_FRA_gp_ar_fleet: "The Two-Ocean Fleet"
 COLDWAR_FRA_gp_ar_fleet_desc: "Brest for the Atlantic, Toulon for the Mediterranean. A fleet on two oceans needs two shipyards, two admirals and two budgets."
 COLDWAR_FRA_gp_ar_air: "Strategic Air Forces"
 COLDWAR_FRA_gp_ar_air_desc: "The Strategic Air Forces carry our deterrent, and the fighter wings guard the sky above it. Dassault and the Air Staff want the same thing: more Mirages."
 COLDWAR_FRA_gp_ma_tunis: "The Tunisian Question"
 COLDWAR_FRA_gp_ma_tunis_desc: "Bizerte was ours until 1963 and Bourguiba knows the harbour is worth more to him with a French squadron inside it. A sober pact of protection serves both capitals."
 COLDWAR_FRA_gp_ma_morocco: "The Moroccan Protectorate"
 COLDWAR_FRA_gp_ma_morocco_desc: "Hassan II sits in a palace the Resident-General once built. The Sultanate's independence was a courtesy of 1956, and courtesies can be taken back."
 COLDWAR_FRA_gp_la_francophonie: "The Francophone Commonwealth"
 COLDWAR_FRA_gp_la_francophonie_desc: "Wherever French is spoken, French is power. From Quebec to Beirut and Dakar a community of 100 million holds one common language."
 COLDWAR_FRA_gp_la_navy: "The Western Mediterranean Command"
 COLDWAR_FRA_gp_la_navy_desc: "One command, three flags and one sea. Toulon, Taranto and Cartagena would answer to the same admiral and could close the Strait with a single signal."
 COLDWAR_FRA_gp_af_rails: "The Trans-Saharan"
 COLDWAR_FRA_gp_af_rails_desc: "A line from the Mediterranean to the Niger would carry ore north and Paris's authority south. The dreams of 1880 may yet be laid on sleepers."
 COLDWAR_FRA_gp_af_navy: "The Indian Ocean Squadron"
 COLDWAR_FRA_gp_af_navy_desc: "From Reunion and Djibouti a French squadron watches the sea lanes from the Cape to the Gulf. The Indian Ocean is no longer a British lake."
 COLDWAR_FRA_gp_ar_carriers: "Four Carriers"
 COLDWAR_FRA_gp_ar_carriers_desc: "Clemenceau, Foch and their successors give the flag a floating airfield. A power with four carriers can reach any shore and bargain on any sea."
 COLDWAR_FRA_gp_ar_strike: "The All-Azimuth Strike Force"
 COLDWAR_FRA_gp_ar_strike_desc: "Our deterrent serves France and France alone. It faces every compass point, and nobody can predict from which side the threat will come."
 COLDWAR_FRA_gp_ma_admin: "The North African Administration"
 COLDWAR_FRA_gp_ma_admin_desc: "A resident-general for each province, a prefect for every district. The administration that ran the Maghreb for a century comes out of its drawers."
 COLDWAR_FRA_gp_ma_bases: "Mers el-Kebir Again"
 COLDWAR_FRA_gp_ma_bases_desc: "The Mediterranean fleet again has ports on its southern shore. The naval staff say 'Mers el-Kebir', and every officer hears the memory."
 COLDWAR_FRA_gp_la_quebec: "Vive le Quebec Libre"
 COLDWAR_FRA_gp_la_quebec_desc: "De Gaulle shouted it from the Montreal balcony and it echoed round the world. We say it again, as French foreign policy and not as an accident of rhetoric."
 COLDWAR_FRA_gp_la_lebanon: "The Levant Mandate Memory"
 COLDWAR_FRA_gp_la_lebanon_desc: "France held the Levant mandate and has never lost the habit. Beirut's maronites ask for a French shield, and we answer."
 COLDWAR_FRA_gp_af_union: "The Eurafrican Union"
 COLDWAR_FRA_gp_af_union_desc: "A union of France and her African partners with a common market, common defence and common currency. The first customs union to span two continents."
 COLDWAR_FRA_gp_ar_nation: "The Nation in Arms"
 COLDWAR_FRA_gp_ar_nation_desc: "Army, reserve, industry and school move to the same drum. The levee en masse is no longer an emergency but a way of life."
 COLDWAR_FRA_gp_ma_union: "France from Dunkirk to Tamanrasset"
 COLDWAR_FRA_gp_ma_union_desc: "Dunkirk and Tamanrasset in one country, one law and one army, as the slogan went. A republic of 100 million would no longer need to ask for a place at any table."
 COLDWAR_FRA_gp_la_bloc: "The Third Bloc"
 COLDWAR_FRA_gp_la_bloc_desc: "Neither Washington's camp nor Moscow's, a third pole of Latin, francophone and African states under French leadership. The world has been waiting for it for twenty years."
 COLDWAR_FRA_gp_af_cap: "Empire of Two Continents"
 COLDWAR_FRA_gp_af_cap_desc: "From Lille to Libreville the same flag, the same money and the same law. France has ceased to be a nation of 50 million and become a power of 300."
 COLDWAR_FRA_gp_ar_cap: "The First Army of Europe"
 COLDWAR_FRA_gp_ar_cap_desc: "On the continent no army is more numerous, better trained or readier to march. The era when Europe's defence depended on Americans or Germans is over."
 COLDWAR_FRA_gp_ma_cap: "The Mediterranean Is French"
 COLDWAR_FRA_gp_ma_cap_desc: "Mare nostrum again, but with French garrisons on three coasts. We have never wanted any other power to command the sea at France's southern door."
 COLDWAR_FRA_gp_la_cap: "France, the Third Great Power"
 COLDWAR_FRA_gp_la_cap_desc: "Washington and Moscow lead the blocs. We lead a third, and the Security Council seat is no longer a courtesy."
 COLDWAR_FRA_eco_root: "The Sixth Plan"
 COLDWAR_FRA_eco_root_desc: "The Sixth Plan sets growth at six percent a year and asks industry to win abroad. Pompidou wants a France that exports, builds and lasts."
 COLDWAR_FRA_eco_industry: "Industrial Competitiveness"
 COLDWAR_FRA_eco_industry_desc: "Pompidou wants a few French champions big enough to meet the Americans and the Germans. Mergers, loans and tax allowances will pay for them."
 COLDWAR_FRA_eco_energy: "Energy Independence"
 COLDWAR_FRA_eco_energy_desc: "France buys three quarters of its energy abroad, and most of it from the Gulf. Pompidou wants a plan that does not depend on Aramco's mood."
 COLDWAR_FRA_eco_farms: "The Farm Question"
 COLDWAR_FRA_eco_farms_desc: "Every year a hundred thousand people leave the land, and every village has an empty classroom. The farm unions want a policy, not another speech."
 COLDWAR_FRA_eco_modern: "A Modern France"
 COLDWAR_FRA_eco_modern_desc: "Pompidou wants the car, the motorway and the tower block: a France that looks like its time. The ground will be paid for by the farmers."
 COLDWAR_FRA_eco_concorde: "Concorde First"
 COLDWAR_FRA_eco_concorde_desc: "Mach 2 over the Atlantic is the proof that France can still do what others cannot. The treaty with London binds us whatever the cost."
 COLDWAR_FRA_eco_airbus: "Airbus First"
 COLDWAR_FRA_eco_airbus_desc: "Better a plane the airlines want than a plane France is proud of. Toulouse and Hamburg will build it together on equal shares."
 COLDWAR_FRA_eco_messmer: "The Messmer Plan"
 COLDWAR_FRA_eco_messmer_desc: "Fifty-six reactors in fifteen years. Messmer proposes to answer the oil crisis with the biggest civilian programme in French history."
 COLDWAR_FRA_eco_graphite: "The National Graphite Line"
 COLDWAR_FRA_eco_graphite_desc: "The uranium-natural graphite-gas line is ours from mine to reactor, with no foreign licence. It is slower and dearer, and nobody else can switch it off."
 COLDWAR_FRA_eco_remembrement: "Consolidate the Land"
 COLDWAR_FRA_eco_remembrement_desc: "Bigger plots, bigger machines, fewer farmers. France will feed Europe, though not with the same people."
 COLDWAR_FRA_eco_family_farms: "Protect the Family Farm"
 COLDWAR_FRA_eco_family_farms_desc: "The small farm is the backbone of the village, the mayor's electorate and the soul of the country. Productivity can wait."
 COLDWAR_FRA_eco_tgv: "The TGV"
 COLDWAR_FRA_eco_tgv_desc: "The wheel on the rail will do 260 an hour. SNCF will have a new line to Lyon, and the rail unions have a new future."
 COLDWAR_FRA_eco_aerotrain: "The Aerotrain"
 COLDWAR_FRA_eco_aerotrain_desc: "The Bertin hovertrain skims the Beauce at 400 an hour on a cushion of air. Nothing like it exists anywhere else."
 COLDWAR_FRA_eco_toulouse: "Toulouse Aerospace"
 COLDWAR_FRA_eco_toulouse_desc: "Aérospatiale's design offices and hangars at Toulouse-Blagnac gather the best engineers in Europe. Keep them busy and they will build whatever comes next."
 COLDWAR_FRA_eco_airbus_gie: "Airbus Industrie"
 COLDWAR_FRA_eco_airbus_gie_desc: "The consortium is a legal fiction that works: one order desk, two assembly lines, and nobody can leave without breaking it. America will not like a European rival."
 COLDWAR_FRA_eco_framatome: "The Framatome Licence"
 COLDWAR_FRA_eco_framatome_desc: "Westinghouse sells the licence, Framatome builds the plant and Creusot-Loire forges the vessels. The reactor is American in blood and French in finance."
 COLDWAR_FRA_eco_phenix: "Phenix at Marcoule"
 COLDWAR_FRA_eco_phenix_desc: "Burn the plutonium and make more of it: the fast breeder promises fuel for a thousand years. It also means sodium, and sodium catches fire."
 COLDWAR_FRA_eco_agrifood: "The Green Oil of France"
 COLDWAR_FRA_eco_agrifood_desc: "Wheat, wine, cheese and poultry will be our oil: the one resource France has in surplus. The market sets the price; Brussels sets the subsidy."
 COLDWAR_FRA_eco_paris_lyon: "Paris to Lyon in Two Hours"
 COLDWAR_FRA_eco_paris_lyon_desc: "Two hours from the Gare de Lyon to Lyon-Perrache changes the map of French business. Towns that miss the line will say so at the next election."
 COLDWAR_FRA_eco_orleans_line: "The Orleans Line"
 COLDWAR_FRA_eco_orleans_line_desc: "The Orleans test track becomes the first commercial hovertrain line to Paris. Beyond the Loire the Bertin company will sell it abroad."
 COLDWAR_FRA_eco_computing: "The Computing Question"
 COLDWAR_FRA_eco_computing_desc: "General de Gaulle refused to let America read our nuclear calculations on its mainframes. Computers are now a matter of sovereignty."
 COLDWAR_FRA_eco_edf: "Electricite de France"
 COLDWAR_FRA_eco_edf_desc: "One company, one grid, one price. EDF will absorb the debts, the strikes and the building programme of the nuclear age."
 COLDWAR_FRA_eco_mountain: "The Mountain Allowance"
 COLDWAR_FRA_eco_mountain_desc: "Without a grant the herders leave the high pastures and the valleys fall silent. Paris will pay a mountain allowance so someone stays."
 COLDWAR_FRA_eco_telephone: "A Telephone for Every Home"
 COLDWAR_FRA_eco_telephone_desc: "Today a French household waits years for a telephone line. Every home connected is a vote and a market."
 COLDWAR_FRA_eco_unidata: "Unidata"
 COLDWAR_FRA_eco_unidata_desc: "Siemens, Philips and CII pool their computer lines against IBM. It is slow, shared, and the only way to reach scale."
 COLDWAR_FRA_eco_cii_alone: "CII Alone"
 COLDWAR_FRA_eco_cii_alone_desc: "Our computers stay French, our secrets stay in French machines and the state pays the deficit. Scale is someone else's problem."
 COLDWAR_FRA_eco_honeywell_bull: "Honeywell-Bull"
 COLDWAR_FRA_eco_honeywell_bull_desc: "Honeywell brings capital and customers; in return it brings a majority of the votes. The Plan Calcul ends, but the factories keep working."
 COLDWAR_FRA_eco_eurodif: "Eurodif Enrichment"
 COLDWAR_FRA_eco_eurodif_desc: "Eurodif would make France the enrichment supplier of Western Europe, so America no longer controls our fuel. Belgium, Italy and Spain will pay their share."
 COLDWAR_FRA_eco_superphenix: "Superphenix"
 COLDWAR_FRA_eco_superphenix_desc: "Creys-Malville will be the biggest breeder reactor ever built, a thousand megawatts of French confidence. The march on the site will be as big as the reactor."
 COLDWAR_FRA_eco_minitel: "Minitel"
 COLDWAR_FRA_eco_minitel_desc: "A small screen and a keyboard on the phone line: the telephone directory, the train timetable and a thousand services. The state hands them out free."
 COLDWAR_FRA_eco_cable_plan: "The Cable Plan"
 COLDWAR_FRA_eco_cable_plan_desc: "Optical fibre into every town and a hundred channels on the screen. It is the dearest plan, and the one the future will use."
 COLDWAR_FRA_eco_ariane: "Ariane"
 COLDWAR_FRA_eco_ariane_desc: "The Europa rocket failed because six governments ran it. France will pay most of the bill and lead the next one from Kourou."
 COLDWAR_FRA_eco_all_electric: "The All-Electric Nation"
 COLDWAR_FRA_eco_all_electric_desc: "Heat the houses, run the trains, power the factories: every kilowatt French and every oil shock a little smaller. The debts of EDF are the price of the idea."
 COLDWAR_FRA_eco_modern_cap: "La Defense and the New Towns"
 COLDWAR_FRA_eco_modern_cap_desc: "La Défense's towers and Cergy's and Evry's squares: the new Paris of the 1970s. The suburbs will need schools and buses."
 COLDWAR_FRA_eco_steel: "The Steel of Lorraine"
 COLDWAR_FRA_eco_steel_desc: "World steel is in glut and Lorraine's blast furnaces lose money every month. The state owns the debts; it must decide whose jobs pay for them."
 COLDWAR_FRA_eco_steel_cut: "Restructure the Steel"
 COLDWAR_FRA_eco_steel_cut_desc: "Twenty thousand jobs go and the strong mills stay. The steel towns will not forgive it, and the left will say so loudly."
 COLDWAR_FRA_eco_steel_save: "Save the Steel Towns"
 COLDWAR_FRA_eco_steel_save_desc: "No mill closes and no family leaves Longwy. The Treasury pays, the neighbours in Brussels frown, and the bill is long."
 COLDWAR_FRA_eco_question_1981: "The Question of 1981"
 COLDWAR_FRA_eco_question_1981_desc: "Steel, banks and the big groups need an owner who can pay and decide. Left or right, someone must say what the state is for."
 COLDWAR_FRA_eco_nationalise: "The State as Industrialist"
 COLDWAR_FRA_eco_nationalise_desc: "Thirty-nine banks and five great groups come under the state, and the Plan gets the arms to carry out its aims. Shareholders will be paid; the market will not forget."
 COLDWAR_FRA_eco_liberalise: "The Market Opens"
 COLDWAR_FRA_eco_liberalise_desc: "Prices freed, the capital tax abolished and the big groups sold to buyers. The state steps back and the market keeps the lights on."
 COLDWAR_FRA_eco_eco_cap: "France Modernised"
 COLDWAR_FRA_eco_eco_cap_desc: "Nuclear plants, the TGV, Airbus and the telephone: the France of 1970 has become a modern industrial power. The next question is who it will serve."
 COLDWAR_FRA_mil_root: "The Defence White Paper"
 COLDWAR_FRA_mil_root_desc: "Michel Debré's white paper must say what the army is for after Algeria. Defend the soil, deter the strong and keep the Rhine in sight."
 COLDWAR_FRA_mil_deterrent: "The Force de Frappe"
 COLDWAR_FRA_mil_deterrent_desc: "The force de frappe is a few dozen Mirage IV and some uranium. It will take silos and submarines before it is a deterrent."
 COLDWAR_FRA_mil_army: "The Army of Conscripts"
 COLDWAR_FRA_mil_army_desc: "One year of service for three young men out of four: the nation's army, the mayor's army and the army of the Republic. It is cheap in pay, expensive in time."
 COLDWAR_FRA_mil_air_navy: "Wings and Waves"
 COLDWAR_FRA_mil_air_navy_desc: "The Marine and the Armée de l'air want their own share. Tankers, escorts and fighters cost the same pounds as divisions."
 COLDWAR_FRA_mil_albion: "The Plateau d'Albion"
 COLDWAR_FRA_mil_albion_desc: "Eighteen missiles in hardened silos on the Plateau d'Albion, each aimed at a Soviet city. Deterrence becomes a calculation."
 COLDWAR_FRA_mil_redoutable: "Le Redoutable"
 COLDWAR_FRA_mil_redoutable_desc: "A submarine that cannot be found is the best answer to a first strike. Sixteen missiles at sea, one boat on patrol."
 COLDWAR_FRA_mil_forward: "Forward Defence in Germany"
 COLDWAR_FRA_mil_forward_desc: "The First Army stands in Germany with its tanks and conscripts. If the Soviets attack on the Elbe, they will have to cross it first."
 COLDWAR_FRA_mil_far: "The Rapid Action Force"
 COLDWAR_FRA_mil_far_desc: "Forty-seven thousand professionals who can land in Chad or Lebanon within the week. The Rhine would see a thinner line."
 COLDWAR_FRA_mil_mirage_f1: "The Mirage F1"
 COLDWAR_FRA_mil_mirage_f1_desc: "The Mirage F1 swaps the delta wing for a swept one, with better take-off and a good radar. Dassault says clients will queue for it."
 COLDWAR_FRA_mil_carriers: "The Carrier Group"
 COLDWAR_FRA_mil_carriers_desc: "Clemenceau and Foch carry the flag to Africa and the Indian Ocean and give the deterrent submarines an air umbrella."
 COLDWAR_FRA_mil_pluton: "The Pluton Regiments"
 COLDWAR_FRA_mil_pluton_desc: "A tactical nuclear weapon with a range of 120 kilometres is a battlefield warning, not a threat to Moscow. Bonn will ask whom it is meant to protect."
 COLDWAR_FRA_mil_ffa: "The French Forces in Germany"
 COLDWAR_FRA_mil_ffa_desc: "Sixty thousand French soldiers and their families live on German soil, and French tanks are within a day's march of the Iron Curtain. Bonn pays for their housing."
 COLDWAR_FRA_mil_airmobile: "The Airmobile Division"
 COLDWAR_FRA_mil_airmobile_desc: "The 4th Airmobile Division moves anti-tank helicopters and troops by air in hours. It is a new division for a new kind of war."
 COLDWAR_FRA_mil_mirage_2000: "The Mirage 2000"
 COLDWAR_FRA_mil_mirage_2000_desc: "The Mirage 2000 is the delta fighter of the 1980s, fast and agile, built where the Mirage III was born. The air force wants it for the air defence of France."
 COLDWAR_FRA_mil_nuclear_carrier: "A Nuclear Carrier"
 COLDWAR_FRA_mil_nuclear_carrier_desc: "A nuclear carrier needs no refuelling and can steam for months. It will be the biggest ship ever built in France."
 COLDWAR_FRA_mil_tous_azimuts: "Defence in All Directions"
 COLDWAR_FRA_mil_tous_azimuts_desc: "A deterrent that points at any possible enemy has no friend it must obey. It also means no ally can rely on it."
 COLDWAR_FRA_mil_ottawa: "The Ottawa Bargain"
 COLDWAR_FRA_mil_ottawa_desc: "Washington is ready to recognise our deterrent and quietly help it. In return it watches how we use it."
 COLDWAR_FRA_mil_tank_question: "The Tank Question"
 COLDWAR_FRA_mil_tank_question_desc: "The AMX-30 has served well but is old. The next tank can be ours alone or shared with Germany; the staff wants an answer."
 COLDWAR_FRA_mil_fighter_question: "The Fighter of the Future"
 COLDWAR_FRA_mil_fighter_question_desc: "Dassault wants a French fighter, and the Germans, British, Italians and Spanish want a common one. The Air Staff must choose."
 COLDWAR_FRA_mil_m4: "The M4 Missile"
 COLDWAR_FRA_mil_m4_desc: "Six warheads on one missile means six cities for each launch. Deterrence becomes cheaper than the whole army."
 COLDWAR_FRA_mil_us_aid: "Discreet American Help"
 COLDWAR_FRA_mil_us_aid_desc: "Washington will not say it, and Paris will not ask: negative help on warhead design, with no public text. The less we say, the more we are given."
 COLDWAR_FRA_mil_leclerc: "A National Tank"
 COLDWAR_FRA_mil_leclerc_desc: "A French tank for a French army, built at Roanne and Bourges and named for General Leclerc. We pay all of it and answer to nobody."
 COLDWAR_FRA_mil_napoleon: "The Napoleon Tank"
 COLDWAR_FRA_mil_napoleon_desc: "One tank for two armies and two industries, with one common gun. Schmidt agrees in principle and the engineers will fight over details."
 COLDWAR_FRA_mil_rafale: "Rafale"
 COLDWAR_FRA_mil_rafale_desc: "Dassault would run its own fighter, and France would walk away from the European programme. Our allies will be less than pleased."
 COLDWAR_FRA_mil_efa: "The European Fighter"
 COLDWAR_FRA_mil_efa_desc: "Four nations, one aircraft, one bill: the unit price falls and the work-share rises. It will be a fighter built by committee."
 COLDWAR_FRA_mil_underground: "Tests Go Underground"
 COLDWAR_FRA_mil_underground_desc: "New Zealand and Australia protest the fallout, and the Pacific is watching. The tests go under the coral from now on."
 COLDWAR_FRA_mil_giat: "GIAT Armour"
 COLDWAR_FRA_mil_giat_desc: "GIAT's arsenals at Bourges, Roanne and Saint-Chamond build tanks, guns and ammunition. The state's own factories are loyal and expensive."
 COLDWAR_FRA_mil_exocet: "Exocet"
 COLDWAR_FRA_mil_exocet_desc: "A French missile sinks a British destroyer, and every navy asks for the price. Aérospatiale will take the orders."
 COLDWAR_FRA_mil_exports: "The Arms Exporters"
 COLDWAR_FRA_mil_exports_desc: "France is the world's third arms exporter, with Dassault, Thomson-CSF and Aérospatiale leading. The Quai d'Orsay writes the clauses."
 COLDWAR_FRA_mil_arab_arsenal: "The Arab Arsenal"
 COLDWAR_FRA_mil_arab_arsenal_desc: "Tripoli, Baghdad and Riyadh pay in oil and cash for Mirages and Exocets. Jerusalem takes note."
 COLDWAR_FRA_mil_diversified: "Clients on Every Continent"
 COLDWAR_FRA_mil_diversified_desc: "India, Greece and Brazil buy Mirages and Alouettes with long credit. The money arrives late, but the customers are many."
 COLDWAR_FRA_mil_mil_cap: "The Armed Republic"
 COLDWAR_FRA_mil_mil_cap_desc: "Nuclear deterrent, a conscript and a rapid-action army, our own fighters and tanks: France is armed from the sea to the Rhine."
 COLDWAR_FRA_afr_root: "The African Cell"
 COLDWAR_FRA_afr_root_desc: "The Elysee's African Cell runs a continent from two rooms in the rue de l'Elysee. Presidents in Dakar, Abidjan and Libreville telephone Paris before they telephone their ministers."
 COLDWAR_FRA_afr_franc_zone: "The Franc Zone"
 COLDWAR_FRA_afr_franc_zone_desc: "The CFA franc is guaranteed by the French Treasury and printed in Paris. Fourteen countries trade in our money, and that is the best cement of influence."
 COLDWAR_FRA_afr_choice: "The Choice of Africa"
 COLDWAR_FRA_afr_choice_desc: "Is France Africa's gendarme or its partner? The Elysee must choose, and one choice rules out the other."
 COLDWAR_FRA_afr_overseas: "The Overseas Territories"
 COLDWAR_FRA_afr_overseas_desc: "Guadeloupe, Martinique, Reunion and the Pacific islands are France too. Paris owes them roads, hospitals and a fair price for sugar."
 COLDWAR_FRA_afr_arlit: "The Uranium of Arlit"
 COLDWAR_FRA_afr_arlit_desc: "At Arlit, in the Aïr, the SOMAIR mine begins to deliver yellowcake. Niamey wants a fair price, Paris wants security for the reactors, and both can have what they want."
 COLDWAR_FRA_afr_elf_gabon: "Elf in Gabon"
 COLDWAR_FRA_afr_elf_gabon_desc: "Omar Bongo needs revenue and a protector, and Elf needs concessions. Libreville's oil flows to Paris and Paris's guarantee flows to Libreville."
 COLDWAR_FRA_afr_gendarme: "Gendarme of Africa"
 COLDWAR_FRA_afr_gendarme_desc: "A coup in Bangui, a rebellion in Chad, a mutiny in Libreville. When a friend is in danger France sends the paratroopers, because the continent has no other police."
 COLDWAR_FRA_afr_partners: "Partners, Not Clients"
 COLDWAR_FRA_afr_partners_desc: "Africa will not stay in our orbit by force, only by choice. Aid, investment and honest accounts will bind it better than any gendarme."
 COLDWAR_FRA_afr_djibouti_stay: "Djibouti Stays French"
 COLDWAR_FRA_afr_djibouti_stay_desc: "The Territory of the Afars and Issas is a harbour, a garrison and a gate to the Red Sea. A French flag over the Gulf of Tadjoura serves the navy, whatever Mogadishu says."
 COLDWAR_FRA_afr_djibouti_free: "Djibouti Independence"
 COLDWAR_FRA_afr_djibouti_free_desc: "Independence is the price of the harbour. Djibouti will govern itself and give France the keys to the garrison."
 COLDWAR_FRA_afr_operations_account: "The Operations Account"
 COLDWAR_FRA_afr_operations_account_desc: "65 percent of the zone's reserves sit in the Treasury's vaults. As long as the account is in the black, the CFA will be as good as the franc."
 COLDWAR_FRA_afr_chad: "The Chad Mission"
 COLDWAR_FRA_afr_chad_desc: "Tombalbaye's government is in danger and France's army knows the road to Fort-Lamy. A battalion and some Alouette helicopters can stop a rebellion before it becomes a Libyan province."
 COLDWAR_FRA_afr_aid_pledge: "The 0.7 Percent Pledge"
 COLDWAR_FRA_afr_aid_pledge_desc: "Seven centimes in every hundred francs of national income will go to the poor countries. A French pledge is the best advertising for the Republic's generosity."
 COLDWAR_FRA_afr_mayotte: "Mayotte Stays"
 COLDWAR_FRA_afr_mayotte_desc: "Mayotte voted to stay French, and France keeps its word to the people who voted. Moroni can call it a scandal, but the vote was free."
 COLDWAR_FRA_afr_comoros_whole: "The Comoros as One"
 COLDWAR_FRA_afr_comoros_whole_desc: "The Comoros are one archipelago, and splitting it would sour all of the islands. France will let Mayotte go to be able to keep four islands on friendly terms."
 COLDWAR_FRA_afr_cfa_parity: "The Fixed Parity"
 COLDWAR_FRA_afr_cfa_parity_desc: "50 CFA francs for one French franc since 1948. A fixed parity means no inflation and no surprise, and the money does not roam."
 COLDWAR_FRA_afr_zone_banks: "The Central Banks of the Zone"
 COLDWAR_FRA_afr_zone_banks_desc: "Make the central banks African in name and in staff, keep France in the room and on the veto. A sovereignty of the zone's own makes the CFA more durable."
 COLDWAR_FRA_afr_kolwezi: "The Kolwezi Plan"
 COLDWAR_FRA_afr_kolwezi_desc: "The Foreign Legion's 2nd REP drops on Kolwezi and brings the whites of Shaba out alive. Mobutu's cobalt belt remains in Western hands."
 COLDWAR_FRA_afr_solidarity_fund: "The African Solidarity Fund"
 COLDWAR_FRA_afr_solidarity_fund_desc: "The new Solidarity Fund will lend to our African friends at low rates. Money should follow the flag when the flag also carries a pledge."
 COLDWAR_FRA_afr_dom: "The Overseas Departments"
 COLDWAR_FRA_afr_dom_desc: "Departmental status gives the overseas population the same laws and the same benefits. The Treasury pays, the Republic stays whole."
 COLDWAR_FRA_afr_franc_cap: "The Franc Zone Endures"
 COLDWAR_FRA_afr_franc_cap_desc: "The zone has survived decolonisation, oil shocks and critics. It endures because it is cheap for Africa, comfortable for Paris and stubborn in the face of reform."
 COLDWAR_FRA_afr_barracuda: "Operation Barracuda"
 COLDWAR_FRA_afr_barracuda_desc: "Bokassa has become a clown and a danger. Barracuda removes him and puts back David Dacko, and Paris will have to explain the diamonds."
 COLDWAR_FRA_afr_new_accords: "New Cooperation Accords"
 COLDWAR_FRA_afr_new_accords_desc: "Publish the defence accords, drop the secret clauses and call the partners by name. The Senegalese and Ivorian presidents want to be treated as equals."
 COLDWAR_FRA_afr_nickel: "The Nickel Boom"
 COLDWAR_FRA_afr_nickel_desc: "Nickel prices have doubled and Noumea builds towers. The Kanak villages see little of it, and the nickel barons see no reason to share."
 COLDWAR_FRA_afr_kanak: "The Kanak Accords"
 COLDWAR_FRA_afr_kanak_desc: "Talk to the Kanak, give them provinces and a share in the nickel, and the islands stay in the Republic by consent and not by the gendarmes."
 COLDWAR_FRA_afr_summits: "The Franco-African Summits"
 COLDWAR_FRA_afr_summits_desc: "A first summit of French and African heads of state in Paris, with a fresh one each year. The Elysee talks to Africa in one voice before the world's cameras."
 COLDWAR_FRA_afr_cep: "The Pacific Test Centre"
 COLDWAR_FRA_afr_cep_desc: "Mururoa and Fangataufa let France test and certify the deterrent far from home. Australians and New Zealanders may protest, but a Great Power does not test in Brittany."
 COLDWAR_FRA_afr_afr_cap: "The Pre Carre"
 COLDWAR_FRA_afr_afr_cap_desc: "From Dakar to Djibouti and from Noumea to Reunion the French sphere forms a second France that no ministry can fully control. The Republic enjoys its influence and pays for its entanglements."
 COLDWAR_FRA_wld_root: "An Independent Voice"
 COLDWAR_FRA_wld_root_desc: "General de Gaulle's heirs keep his grammar: nobody will tell France whom to love. The foreign minister will see Moscow, Peking, Tripoli and Washington."
 COLDWAR_FRA_wld_west: "The Western Partners"
 COLDWAR_FRA_wld_west_desc: "Pompidou wants to end the quarrels of the sixties with London, Bonn and Washington without giving up an inch of independence. Partners get smiles and contracts."
 COLDWAR_FRA_wld_east: "The Eastern Door"
 COLDWAR_FRA_wld_east_desc: "Détente is a French invention, and Moscow remains the biggest market east of the Elbe. A visit to the Kremlin is a visit to the shop."
 COLDWAR_FRA_wld_south: "The Arab Policy"
 COLDWAR_FRA_wld_south_desc: "The Gulf supplies our oil and the Maghreb our workers. A French policy towards the Arabs is a matter of fuel and votes."
 COLDWAR_FRA_wld_alt: "A Different France"
 COLDWAR_FRA_wld_alt_desc: "What if France chose another path: with London, with Bonn, or with nobody? The alternative French foreign policy starts here."
 COLDWAR_FRA_wld_heath: "The Heath Bargain"
 COLDWAR_FRA_wld_heath_desc: "Britain may enter the Common Market if she accepts the Treaty of Rome in full, including the common farm policy. Edward Heath says she will."
 COLDWAR_FRA_wld_tandem: "The Paris-Bonn Tandem"
 COLDWAR_FRA_wld_tandem_desc: "Europe moves when Paris and Bonn agree. The Elysée treaty must be filled with monthly meetings, not only ceremonies."
 COLDWAR_FRA_wld_moscow_protocol: "The Moscow Protocol"
 COLDWAR_FRA_wld_moscow_protocol_desc: "Twice a year the two foreign ministers will confer, and an accord for ten years of trade follows. Washington reads the text with a pencil."
 COLDWAR_FRA_wld_hold_the_line: "Hold the Line with Washington"
 COLDWAR_FRA_wld_hold_the_line_desc: "The Soviet Union is not a friend, and the Atlantic is where our friends live. The line holds in Europe and Washington will remember."
 COLDWAR_FRA_wld_arab_friend: "The Arab Friend"
 COLDWAR_FRA_wld_arab_friend_desc: "Colonel Gaddafi wants 110 Mirages and he will pay in oil. If Israel is angry, it is because Israel has few friends left in Paris."
 COLDWAR_FRA_wld_israel: "Mend Fences with Israel"
 COLDWAR_FRA_wld_israel_desc: "The arms embargo and the Cherbourg boats poisoned our name in Jerusalem. A French president who restores trust will have to explain it to the Gulf."
 COLDWAR_FRA_wld_uk_deterrent: "The Entente Nucleaire"
 COLDWAR_FRA_wld_uk_deterrent_desc: "Two nuclear powers on the Channel could share costs, tests and doctrine. Neither can do it alone."
 COLDWAR_FRA_wld_third_force: "The Third Force"
 COLDWAR_FRA_wld_third_force_desc: "A France that belongs to no bloc and speaks for everyone who does not. It is a lonely chair at the table."
 COLDWAR_FRA_wld_azores: "The Azores Summit"
 COLDWAR_FRA_wld_azores_desc: "Nixon and Pompidou meet on the Azores to rescue the exchange rates after the dollar's shock. A devalued dollar helps both and costs France its Gaullist pride."
 COLDWAR_FRA_wld_brigade: "The Franco-German Brigade"
 COLDWAR_FRA_wld_brigade_desc: "A brigade with two flags: French and German soldiers under a common commander. The first symbol of a European army."
 COLDWAR_FRA_wld_siberian_gas: "Siberian Gas"
 COLDWAR_FRA_wld_siberian_gas_desc: "Eight billion cubic metres a year from Urengoy at a price the Treasury can pay. Washington is furious and the lamps stay lit."
 COLDWAR_FRA_wld_euromissiles: "Support the Euromissiles"
 COLDWAR_FRA_wld_euromissiles_desc: "The SS-20s aim at Western Europe, and the answer must be on German soil. France will speak for the missiles without hosting them."
 COLDWAR_FRA_wld_iraq: "Oil and Osirak"
 COLDWAR_FRA_wld_iraq_desc: "Baghdad's oil for our reactors and our fighters: Chirac and Saddam Hussein shake hands on it. The Israeli services are watching."
 COLDWAR_FRA_wld_israel_tech: "The Israeli Partnership"
 COLDWAR_FRA_wld_israel_tech_desc: "Israeli radars, drones and electronics are the best in the region, and Dassault's old partners would sell to us. The Gulf will not like it."
 COLDWAR_FRA_wld_bonn_umbrella: "An Umbrella over the Rhine"
 COLDWAR_FRA_wld_bonn_umbrella_desc: "France's deterrent would cover the Federal Republic, and Bonn would pay a share of the bill. Moscow's missiles would then aim at Paris as well."
 COLDWAR_FRA_wld_non_aligned: "Friend of the Non-Aligned"
 COLDWAR_FRA_wld_non_aligned_desc: "Mexico and Paris agree that El Salvador's rebels are a political force. The Third World finds a friend among the rich."
 COLDWAR_FRA_wld_alliance_q: "The Alliance Question"
 COLDWAR_FRA_wld_alliance_q_desc: "France is in the Atlantic Alliance but not in its command. Every government since 1966 has had to decide how long that can last."
 COLDWAR_FRA_wld_peking: "The Road to Peking"
 COLDWAR_FRA_wld_peking_desc: "France recognised China in 1964, and now the president goes to see Mao. Peking is a market of 800 million and a counterweight to Moscow."
 COLDWAR_FRA_wld_saudi: "The Saudi Contracts"
 COLDWAR_FRA_wld_saudi_desc: "Riyadh pays for frigates, tanks and missile batteries, and delivers oil at long-term prices. Saudi Arabia supplies more than a third of our oil."
 COLDWAR_FRA_wld_quebec: "The Quebec Link"
 COLDWAR_FRA_wld_quebec_desc: "Quebec's six million French-speakers look to Paris for support, and Ottawa remembers 1967. The Francophone world could become a political force."
 COLDWAR_FRA_wld_nato_return: "Return to the Integrated Command"
 COLDWAR_FRA_wld_nato_return_desc: "France takes her seat in the integrated command and her place in every NATO staff. The price is a Gaullist argument we cannot win."
 COLDWAR_FRA_wld_outside_nato: "Allied but Outside"
 COLDWAR_FRA_wld_outside_nato_desc: "France stays in the alliance, outside the command, and decides alone when and how her forces fight. It is the status that de Gaulle chose, and every president since has kept it."
 COLDWAR_FRA_wld_iran: "Eurodif and the Shah"
 COLDWAR_FRA_wld_iran_desc: "The Shah lends a billion dollars for a share in Eurodif and a nuclear future. Iran's king of kings is a good customer."
 COLDWAR_FRA_wld_wld_cap: "France in the World"
 COLDWAR_FRA_wld_wld_cap_desc: "France sits on every council and is a friend to many capitals. It is the voice that the world wants to hear."
 COLDWAR_FRA_stem_the_pompidou_years: "The Pompidou Years"
 COLDWAR_FRA_stem_the_pompidou_years_desc: "The Pompidou Years, granted by the focus 'Pompidou's Republic'."
 COLDWAR_FRA_stem_the_new_society: "The New Society"
 COLDWAR_FRA_stem_the_new_society_desc: "The New Society, granted by the focus 'The New Society'."
 COLDWAR_FRA_stem_the_anti_breakers_law: "The Anti-Breakers Law"
 COLDWAR_FRA_stem_the_anti_breakers_law_desc: "The Anti-Breakers Law, granted by the focus 'The Anti-Breakers Law'."
 COLDWAR_FRA_stem_the_free_screen: "The Free Screen"
 COLDWAR_FRA_stem_the_free_screen_desc: "The Free Screen, granted by the focus 'A Free ORTF'."
 COLDWAR_FRA_stem_the_voice_of_france: "The Voice of France"
 COLDWAR_FRA_stem_the_voice_of_france_desc: "The Voice of France, granted by the focus 'The Voice of France'."
 COLDWAR_FRA_stem_regional_public_establishments: "Regional Public Establishments"
 COLDWAR_FRA_stem_regional_public_establishments_desc: "Regional Public Establishments, granted by the focus 'The Regional Councils of 1972'."
 COLDWAR_FRA_stem_the_prefects_rule: "The Prefects Rule"
 COLDWAR_FRA_stem_the_prefects_rule_desc: "The Prefects Rule, granted by the focus 'The Prefects Rule'."
 COLDWAR_FRA_stem_the_larzac_protest: "The Larzac Protest"
 COLDWAR_FRA_stem_the_larzac_protest_desc: "The Larzac Protest, granted by the focus 'The Larzac Camp'."
 COLDWAR_FRA_stem_the_constitution_of_1958: "The Constitution of 1958"
