 COLDWAR_FRA.1.t: "The President Is Dead"
 COLDWAR_FRA.1.d: "Georges Pompidou has died at his flat on the Quai de Bourbon. Alain Poher, President of the Senate, takes the interim. The country votes for a new President within weeks."
 COLDWAR_FRA.1.a: "Valery Giscard d'Estaing wins by a hair."
 COLDWAR_FRA.1.b: "Chaban-Delmas keeps the Elysee for the Gaullists."
 COLDWAR_FRA.1.c: "Francois Mitterrand carries the Union of the Left."
 COLDWAR_FRA.1.e: "The Republic mourns its President."
 COLDWAR_FRA.100.t: "A Proposal from Paris"
 COLDWAR_FRA.100.d: "The French government has sent us a proposal. It waits in the decision category 'Offers from France'."
 COLDWAR_FRA.100.a: "We will consider it."
 COLDWAR_FRA.101.t: "[From.GetName] Accepts"
 COLDWAR_FRA.101.d: "[From.GetName] has accepted our proposal."
 COLDWAR_FRA.101.a: "Excellent."
 COLDWAR_FRA.102.t: "[From.GetName] Declines"
 COLDWAR_FRA.102.d: "[From.GetName] has turned down our proposal."
 COLDWAR_FRA.102.a: "Unfortunate."
 COLDWAR_FRA.103.t: "An Agreement Resumes"
 COLDWAR_FRA.103.d: "The quarrel between Paris and its partner is over. The paused agreement is in force again."
 COLDWAR_FRA.103.a: "Good."
 COLDWAR_FRA.110.t: "The Franc Zone Beckons"
 COLDWAR_FRA.110.d: "Paris offers us the franc: a fixed and convertible currency, French credit and French protection. In return our reserves go to the Operations Account of the French Treasury. The answer waits in the decision category 'The Franc Zone'."
 COLDWAR_FRA.110.a: "We will consider it."
 COLDWAR_FRA.111.t: "[From.GetName] Leaves the Franc Zone"
 COLDWAR_FRA.111.d: "[From.GetName] has taken its reserves back from the French Treasury and prints its own money."
 COLDWAR_FRA.111.a: "Their loss."
