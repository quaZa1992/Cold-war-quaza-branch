# IMPERIA CW — Cold War: 1970 recommended countries — English localisation.
 COLDWAR_1970_UAE_RECOMMENDED_DESC: "The Trucial rulers face the announced end of British protection with separate administrations, uneven development and a fragile coastal economy. They must decide how to share authority, prepare for independence and invest in oil without leaving the smaller emirates behind."
 COLDWAR_1970_EGY_RECOMMENDED_DESC: "Egypt enters the new decade beneath the shadow of the 1967 defeat. The occupied Sinai, the closed Suez Canal and the demands of a prolonged confrontation leave the government balancing military recovery, domestic reform and the question of succession."
 COLDWAR_1970_ISR_RECOMMENDED_DESC: "Israel must turn military success into a lasting strategy while maintaining a coalition government and preparing for renewed conflict. Cabinet choices, diplomacy and the demands of defence will shape the country's course through the new decade."
 COLDWAR_1970_IRQ_RECOMMENDED_DESC: "Iraq's Revolutionary Command Council governs a state whose president, party and armed forces compete for authority. Consolidation, a different constitutional bargain and the development of oil revenues offer sharply different ways to shape the republic."
 COLDWAR_1970_GRE_RECOMMENDED_DESC: "Greece enters 1970 under military rule, with the king in exile and the country's constitutional future unresolved. The officers can entrench their regime, attempt a controlled opening or negotiate a transfer to civilian government."
 COLDWAR_1970_CYP_RECOMMENDED_DESC: "The Republic of Cyprus reaches its second decade with a damaged constitutional partnership and divided communal institutions. Preserving sovereignty will require diplomacy, a dependable security system and a settlement that can outlast the island's rival ambitions."
 COLDWAR_1970_VIE_RECOMMENDED_DESC: "North Vietnam continues the war after Ho Chi Minh's death, with the party, presidency and government sharing the burden of leadership. Military commitments, domestic reconstruction and relations with rival socialist powers will test the cohesion of the revolutionary state."
 COLDWAR_1970_SPR_RECOMMENDED_DESC: "Franco governs a Spain transformed by industrial growth but divided over its political future. His designated succession can preserve the Movimiento, strengthen the Crown or open a parliamentary transition. Economic modernisation, territorial institutions and relations with Europe and the Atlantic powers will shape the decades ahead."
