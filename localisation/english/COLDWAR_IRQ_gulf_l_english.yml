l_english:
# IMPERIA CW — Cold War: IRQ gulf — English localisation.
 COLDWAR_IRQ_gulf_request_KUW:0 "Request Wartime Credit from Kuwait"
 COLDWAR_IRQ_gulf_request_KUW_desc:0 "Offer a single bilateral loan of 8% of current Iraqi GDP. The amount is frozen when dispatched and expires after 30 days. Kuwait must accept and have the entire amount in its treasury. Acceptance transfers real funds and adds equal native Iraqi debt; it never grants equipment. Refusal leaves the Iranian war route open. One offer per creditor in this campaign."
 COLDWAR_IRQ_gulf_repay_KUW:0 "Repay Kuwait"
 COLDWAR_IRQ_gulf_repay_KUW_desc:0 "Pay the remaining named principal to Kuwait and remove exactly that amount from native Iraqi debt. The recipient receives the treasury transfer once. Unassigned native debt reductions conservatively retire named Gulf principal first; they cannot create a second repayment or cancellation."
 COLDWAR_IRQ_gulf_loan_KUW_title:0 "Iraq Requests Credit from Kuwait"
 COLDWAR_IRQ_gulf_loan_KUW_desc:0 "Baghdad requests $[?IRQ.COLDWAR_IRQ_gulf_offer_KUW|3] billion for its actual war against Iran. Acceptance immediately debits our treasury, credits Iraq, and records an equal Iraqi debt principal. This is a loan, not a grant. The frozen offer expires after 30 days; duplicates and lost eligibility cannot transfer funds."
 COLDWAR_IRQ_gulf_request_SAU:0 "Request Wartime Credit from Saudi Arabia"
 COLDWAR_IRQ_gulf_request_SAU_desc:0 "Offer a single bilateral loan of 8% of current Iraqi GDP. The amount is frozen when dispatched and expires after 30 days. Saudi Arabia must accept and have the entire amount in its treasury. Acceptance transfers real funds and adds equal native Iraqi debt; it never grants equipment. Refusal leaves the Iranian war route open. One offer per creditor in this campaign."
 COLDWAR_IRQ_gulf_repay_SAU:0 "Repay Saudi Arabia"
 COLDWAR_IRQ_gulf_repay_SAU_desc:0 "Pay the remaining named principal to Saudi Arabia and remove exactly that amount from native Iraqi debt. The recipient receives the treasury transfer once. Unassigned native debt reductions conservatively retire named Gulf principal first; they cannot create a second repayment or cancellation."
 COLDWAR_IRQ_gulf_loan_SAU_title:0 "Iraq Requests Credit from Saudi Arabia"
 COLDWAR_IRQ_gulf_loan_SAU_desc:0 "Baghdad requests $[?IRQ.COLDWAR_IRQ_gulf_offer_SAU|3] billion for its actual war against Iran. Acceptance immediately debits our treasury, credits Iraq, and records an equal Iraqi debt principal. This is a loan, not a grant. The frozen offer expires after 30 days; duplicates and lost eligibility cannot transfer funds."
 COLDWAR_IRQ_gulf_request_UAE:0 "Request Wartime Credit from the United Arab Emirates"
 COLDWAR_IRQ_gulf_request_UAE_desc:0 "Offer a single bilateral loan of 4% of current Iraqi GDP. The amount is frozen when dispatched and expires after 30 days. the United Arab Emirates must accept and have the entire amount in its treasury. Acceptance transfers real funds and adds equal native Iraqi debt; it never grants equipment. Refusal leaves the Iranian war route open. One offer per creditor in this campaign."
 COLDWAR_IRQ_gulf_repay_UAE:0 "Repay the United Arab Emirates"
 COLDWAR_IRQ_gulf_repay_UAE_desc:0 "Pay the remaining named principal to the United Arab Emirates and remove exactly that amount from native Iraqi debt. The recipient receives the treasury transfer once. Unassigned native debt reductions conservatively retire named Gulf principal first; they cannot create a second repayment or cancellation."
 COLDWAR_IRQ_gulf_loan_UAE_title:0 "Iraq Requests Credit from the United Arab Emirates"
 COLDWAR_IRQ_gulf_loan_UAE_desc:0 "Baghdad requests $[?IRQ.COLDWAR_IRQ_gulf_offer_UAE|3] billion for its actual war against Iran. Acceptance immediately debits our treasury, credits Iraq, and records an equal Iraqi debt principal. This is a loan, not a grant. The frozen offer expires after 30 days; duplicates and lost eligibility cannot transfer funds."
 COLDWAR_IRQ_gulf_iran_cost_1:0 "The Iranian War Bill"
 COLDWAR_IRQ_gulf_iran_cost_1_desc:0 "The war against Iran adds 100% to the native army-personnel cost component and 50% to the native equipment operating-cost component, including deployed land equipment and discounted stockpiles. These are additional additive MD component modifiers, not the total military budget multiplier. Exactly one tier applies; peace with Iran removes it. The normal weekly economy charges the cost and uses native deficit borrowing."
 COLDWAR_IRQ_gulf_iran_cost_2:0 "A War of Replacement"
 COLDWAR_IRQ_gulf_iran_cost_2_desc:0 "The war against Iran adds 175% to the native army-personnel cost component and 100% to the native equipment operating-cost component, including deployed land equipment and discounted stockpiles. These are additional additive MD component modifiers, not the total military budget multiplier. Exactly one tier applies; peace with Iran removes it. The normal weekly economy charges the cost and uses native deficit borrowing."
 COLDWAR_IRQ_gulf_iran_cost_3:0 "The Third Campaign Season"
 COLDWAR_IRQ_gulf_iran_cost_3_desc:0 "The war against Iran adds 250% to the native army-personnel cost component and 150% to the native equipment operating-cost component, including deployed land equipment and discounted stockpiles. These are additional additive MD component modifiers, not the total military budget multiplier. Exactly one tier applies; peace with Iran removes it. The normal weekly economy charges the cost and uses native deficit borrowing."
 COLDWAR_IRQ_gulf_category:0 "War Finance and the Gulf"
 COLDWAR_IRQ_gulf_category_desc:0 "Iranian war costs flow through the native weekly MD budget. Named Gulf loans require the creditor's acceptance and real funds. Outstanding principal is reconciled against actual native debt before repayment or cancellation. Territorial claims do not transfer land or resources."
 COLDWAR_IRQ_gulf_price_of_victory:0 "The Price of Victory"
 COLDWAR_IRQ_gulf_price_of_victory_desc:0 "A war against Iran lasting at least 180 days left net new native debt of at least 25% of entry GDP. The frozen audit excludes pre-war debt. Construction -30%; tax gains -20%; stability -10 percentage points; interest-rate premium +2 percentage points before native clamps; Tax Cost Factor (Consumer Goods) +20% relative to its native base. Fund recovery after debt falls to 20% of GDP, or pursue the hazardous Kuwaiti crisis route. This burden does not grant anyone a forced peace."
 COLDWAR_IRQ_gulf_captured_assets_repair:0 "Reorganising Captured Assets"
 COLDWAR_IRQ_gulf_captured_assets_repair_desc:0 "For 180 days, building repair speed increases by 50%. This national repair modifier creates no oil, buildings, GDP, treasury or resources; existing territorial assets remain subject to native ownership, control and damage rules."
 COLDWAR_IRQ_gulf_forgiveness:0 "Demand Kuwaiti Debt Forgiveness"
 COLDWAR_IRQ_gulf_forgiveness_desc:0 "Iraq demands cancellation of its remaining Kuwaiti wartime principal: $[?IRQ.COLDWAR_IRQ_gulf_principal_KUW|3] billion before live reconciliation. Cancellation removes only the actual surviving named principal; other native Iraqi debt remains. Kuwait receives no cash for writing off its claim."
 COLDWAR_IRQ_gulf_oil_dispute:0 "Press the Kuwaiti Oil Dispute"
 COLDWAR_IRQ_gulf_oil_dispute_desc:0 "Accuse Kuwait of using oil policy against Iraqi recovery. Kuwait can reject the accusation or seek a 90-day arbitration interval. This diplomatic grievance does not fabricate oil production changes or oblige another player to accept Iraqi claims."
 COLDWAR_IRQ_gulf_claim:0 "Assert the Kuwaiti Claim"
 COLDWAR_IRQ_gulf_claim_desc:0 "Gain Iraqi claims on Kuwait (172) and the Kuwaiti naval coast (488), and 5 percentage points of war support. This alternative escalation grants no cores, ownership, oil, money or immediate war."
 COLDWAR_IRQ_gulf_ultimatum:0 "Deliver the Kuwaiti Ultimatum"
 COLDWAR_IRQ_gulf_ultimatum_desc:0 "After an actual rejection and outside a live arbitration interval, obtain a 180-day conquest war goal for states 172 and 488. The Iraqi player chooses whether to declare. Native tension, treaties and coalition responses still apply."
 COLDWAR_IRQ_gulf_integration:0 "Integrate the Kuwaiti Provinces"
 COLDWAR_IRQ_gulf_integration_desc:0 "Requires the integration programme, legal ownership and control of both Kuwaiti states, peace and stability above 50% continuously for 180 days. Pay 5% of live Iraqi GDP and 100 political power. Then grant cores to states 172 and 488 once. Any loss of control, ownership, peace or sufficient stability resets the observation period. This is an alternative-history consolidation, not a claim of automatic historical consent."
 COLDWAR_IRQ_gulf_recovery:0 "Fund Postwar Recovery"
 COLDWAR_IRQ_gulf_recovery_desc:0 "At peace, after native debt falls to 20% of current GDP or less, pay 2% of current GDP and remove The Price of Victory. No debt is forgiven by this decision."
 COLDWAR_IRQ_gulf_loan_accept:0 "Approve the loan and transfer the funds."
 COLDWAR_IRQ_gulf_loan_decline:0 "Decline the request."
 COLDWAR_IRQ_gulf_loan_accept_tt:0 "Transfer the entire frozen principal to Iraq once. Iraq records equal native debt and a named repayable principal. The sender, pending offer, expiry, treasury, war and recipient are checked again before execution."
 COLDWAR_IRQ_gulf_forgiveness_title:0 "Baghdad Demands Debt Forgiveness"
 COLDWAR_IRQ_gulf_forgive_accept:0 "Write off the surviving Kuwaiti principal."
 COLDWAR_IRQ_gulf_forgive_reject:0 "The loan remains repayable."
 COLDWAR_IRQ_gulf_oil_title:0 "Iraq Challenges Kuwaiti Oil Policy"
 COLDWAR_IRQ_gulf_oil_desc:0 "Baghdad blames Kuwaiti oil policy for its financial difficulties. These are Iraqi political accusations, not an automatic finding of fact. Rejecting them gives Iraq an escalation pretext; seeking arbitration postpones its ultimatum for 90 days. Neither response changes oil resources or obliges acceptance of territorial claims."
 COLDWAR_IRQ_gulf_oil_reject:0 "Reject Baghdad's accusations."
 COLDWAR_IRQ_gulf_oil_arbitrate:0 "Seek a ninety-day arbitration interval."
 COLDWAR_IRQ_gulf_price_notice_title:0 "The Price of Victory"
 COLDWAR_IRQ_gulf_price_notice_desc:0 "The war with Iran has ended, but native debt rose by $[?COLDWAR_IRQ_gulf_war_borrowing_frozen|3] billion above its entry balance. The long-war threshold was $[?COLDWAR_IRQ_gulf_war_threshold|3] billion. The frozen audit now applies The Price of Victory. This is actual net borrowing during the war, not a scripted historical debt grant or a claim that every debt transaction was caused solely by the fighting."
 COLDWAR_IRQ_gulf_credit_notice_title:0 "Gulf Credit Has Arrived"
 COLDWAR_IRQ_gulf_credit_notice_desc:0 "A creditor accepted the frozen request and transferred actual treasury funds. Equal debt and a named principal are recorded in Iraq. This brings liquidity, not free income, equipment or guaranteed victory."
 COLDWAR_IRQ_gulf_refusal_notice_title:0 "A Gulf Creditor Refuses"
 COLDWAR_IRQ_gulf_refusal_notice_desc:0 "The requested loan was refused. No treasury or debt changed. Its refusal does not block Iraq's independent military decisions."
 COLDWAR_IRQ_gulf_conquest_notice_title:0 "The Kuwaiti Accounts"
 COLDWAR_IRQ_gulf_conquest_notice_desc:0 "Iraq legally owns and controls both Kuwaiti states. Only the remaining Kuwaiti principal was cancelled: $[?COLDWAR_IRQ_gulf_kuwait_cancelled|3] billion. Other debt survives. A separate, one-use seizure can transfer only 25% of accessible Kuwaiti treasury, capped at 10% of Iraqi GDP, while Kuwait still exists and both states are occupied. No missing reserve is invented. The Price of Victory is removed and a 180-day building-repair programme begins. Existing oil follows native ownership and control; no extra resource deposit appears. International opposition to the invasion remains."
 COLDWAR_IRQ_gulf_acknowledge:0 "Acknowledge the position."
 COLDWAR_IRQ_gulf_ultimatum_tt:0 "Gain a conquest war goal for Kuwait and its naval coast, valid for 180 days. Declaration remains a separate player action."
 COLDWAR_IRQ_gulf_integration_tt:0 "Kuwait and its naval coast become Iraqi cores after the paid 180-day consolidation. No other states are affected."
 COLDWAR_IRQ_gulf_integration_cost:0 "100 £pol_power + 5% GDP"
 COLDWAR_IRQ_gulf_recovery_cost:0 "50 £pol_power + 2% GDP"
