l_english:
# IMPERIA CW — Cold War: doctrines — English localisation.
 # COLDWAR | Cold War land doctrines (grand doctrines, dedicated subdoctrines, tactics)
 GRAND_DOCTRINE_MDCW_DEEP_OPERATION:0 "Deep Operation"
 GRAND_DOCTRINE_MDCW_DEEP_OPERATION_DESC:0 "Soviet operational art: echeloned tank armies, a breakthrough prepared by massed artillery and an exploitation force thrown deep into the enemy rear. Planned centrally down to the last norm - devastating in attack, but with little room for initiative."
 GRAND_DOCTRINE_MDCW_ACTIVE_DEFENSE:0 "Active Defense"
 GRAND_DOCTRINE_MDCW_ACTIVE_DEFENSE_DESC:0 "Written after the 1973 October War: the first battle must be won. Outnumbered forces defend well forward, shift laterally to the threatened sector and destroy the attacker with massed anti-tank fire from prepared positions."
 GRAND_DOCTRINE_MDCW_AIRLAND_BATTLE:0 "AirLand Battle"
 GRAND_DOCTRINE_MDCW_AIRLAND_BATTLE_DESC:0 "Initiative, agility, depth and synchronisation. Ground and air forces strike the enemy's second echelon before it reaches the front, while commanders act on intent rather than detailed orders. Highly mechanised and hungry for fuel."
 GRAND_DOCTRINE_MDCW_PEOPLES_WAR:0 "People's War"
 GRAND_DOCTRINE_MDCW_PEOPLES_WAR_DESC:0 "A protracted war of the whole people against a stronger enemy. Militia and regulars fight side by side from secure base areas, the invader is lured deep and worn down, and supplies move on the backs of porters."
 GRAND_DOCTRINE_MDCW_TOTAL_DEFENCE:0 "Total Defence"
 GRAND_DOCTRINE_MDCW_TOTAL_DEFENCE_DESC:0 "The doctrine of the small and the neutral: all of society is organised for defence, reservists mobilise within days and every valley is a fortress. An invasion must cost more than it could ever gain."
 GRAND_DOCTRINE_MDCW_FANATICAL_STRUGGLE:0 "Fanatical Struggle"
 GRAND_DOCTRINE_MDCW_FANATICAL_STRUGGLE_DESC:0 "Indoctrinated troops fight beyond all limits: assaults in waves regardless of losses, no retreat, no surrender.\n§Y\"We must overcome the enemy's superiority in material with superiority of our hearts and steadfastness.\"§! - Joseph Goebbels, Görlitz, 10 March 1945"

 SUBDOCTRINE_MDCW_HUMAN_WAVES:0 "Human Wave Assaults"
 SUBDOCTRINE_MDCW_HUMAN_WAVES_DESC:0 "Massed infantry closes with the enemy at night and in waves, accepting heavy casualties to overwhelm superior firepower by sheer numbers and will. Requires the Fanatical Struggle grand doctrine."
 dedicated_mdcw_human_waves_political_officers:0 "Political Officers"
 mdcw_human_waves_political_officers:0 "Political Officers"
 dedicated_mdcw_human_waves_political_officers_desc:0 "A political officer in every company keeps the men in the line."
 mdcw_human_waves_political_officers_desc:0 "A political officer in every company keeps the men in the line."
 dedicated_mdcw_human_waves_massed_charges:0 "Massed Charges"
 mdcw_human_waves_massed_charges:0 "Massed Charges"
 dedicated_mdcw_human_waves_massed_charges_desc:0 "Wave after wave until the enemy line breaks."
 mdcw_human_waves_massed_charges_desc:0 "Wave after wave until the enemy line breaks."
 dedicated_mdcw_human_waves_night_infiltration:0 "Night Infiltration"
 mdcw_human_waves_night_infiltration:0 "Night Infiltration"
 dedicated_mdcw_human_waves_night_infiltration_desc:0 "Light infantry slips through the enemy line in darkness and attacks from the rear."
 mdcw_human_waves_night_infiltration_desc:0 "Light infantry slips through the enemy line in darkness and attacks from the rear."
 dedicated_mdcw_human_waves_spirit_over_steel:0 "Spirit over Steel"
 mdcw_human_waves_spirit_over_steel:0 "Spirit over Steel"
 dedicated_mdcw_human_waves_spirit_over_steel_desc:0 "Tank-hunting teams with grenades and satchel charges."
 mdcw_human_waves_spirit_over_steel_desc:0 "Tank-hunting teams with grenades and satchel charges."
 dedicated_mdcw_human_waves_fight_to_the_last:0 "Fight to the Last"
 mdcw_human_waves_fight_to_the_last:0 "Fight to the Last"
 dedicated_mdcw_human_waves_fight_to_the_last_desc:0 "Units keep fighting long after they should have broken."
 mdcw_human_waves_fight_to_the_last_desc:0 "Units keep fighting long after they should have broken."

 SUBDOCTRINE_MDCW_TERRITORIAL_DEFENCE:0 "Territorial Defence Forces"
 SUBDOCTRINE_MDCW_TERRITORIAL_DEFENCE_DESC:0 "Locally raised reservist and home guard units defend their own district, know every road and keep fighting behind the enemy's lines. Requires the Total Defence grand doctrine."
 dedicated_mdcw_territorial_defence_home_guard:0 "Home Guard"
 mdcw_territorial_defence_home_guard:0 "Home Guard"
 dedicated_mdcw_territorial_defence_home_guard_desc:0 "Volunteers keep their rifles at home and assemble within hours."
 mdcw_territorial_defence_home_guard_desc:0 "Volunteers keep their rifles at home and assemble within hours."
 dedicated_mdcw_territorial_defence_prepared_positions:0 "Prepared Positions"
 mdcw_territorial_defence_prepared_positions:0 "Prepared Positions"
 dedicated_mdcw_territorial_defence_prepared_positions_desc:0 "Bridges, tunnels and passes are prepared for demolition in peacetime."
 mdcw_territorial_defence_prepared_positions_desc:0 "Bridges, tunnels and passes are prepared for demolition in peacetime."
 dedicated_mdcw_territorial_defence_mountain_redoubt:0 "Mountain Redoubt"
 mdcw_territorial_defence_mountain_redoubt:0 "Mountain Redoubt"
 dedicated_mdcw_territorial_defence_mountain_redoubt_desc:0 "The army withdraws into fortified mountain and forest country where armour is useless."
 mdcw_territorial_defence_mountain_redoubt_desc:0 "The army withdraws into fortified mountain and forest country where armour is useless."
 dedicated_mdcw_territorial_defence_stay_behind_networks:0 "Stay-Behind Networks"
 mdcw_territorial_defence_stay_behind_networks:0 "Stay-Behind Networks"
 dedicated_mdcw_territorial_defence_stay_behind_networks_desc:0 "Hidden depots and cells ready to resist any occupation."
 mdcw_territorial_defence_stay_behind_networks_desc:0 "Hidden depots and cells ready to resist any occupation."
 dedicated_mdcw_territorial_defence_psychological_defence:0 "Psychological Defence"
 mdcw_territorial_defence_psychological_defence:0 "Psychological Defence"
 dedicated_mdcw_territorial_defence_psychological_defence_desc:0 "The population knows what to do when war comes - and that every report of surrender is false."
 mdcw_territorial_defence_psychological_defence_desc:0 "The population knows what to do when war comes - and that every report of surrender is false."

 SUBDOCTRINE_MDCW_MASKIROVKA:0 "Maskirovka"
 SUBDOCTRINE_MDCW_MASKIROVKA_DESC:0 "Concealment and deception at every level: camouflage, dummy formations and false radio traffic hide where and when the blow will fall. The price is confusion in our own ranks - few officers know the real plan, so units react slower."
 mdcw_maskirovka_camouflage_discipline:0 "Camouflage Discipline"
 mdcw_maskirovka_camouflage_discipline_desc:0 "Nets, smoke and dispersal deny enemy aircraft their targets."
 mdcw_maskirovka_dummy_formations:0 "Dummy Formations"
 mdcw_maskirovka_dummy_formations_desc:0 "Inflatable tanks and false positions mislead enemy reconnaissance and draw fire away from the real ones."
 mdcw_maskirovka_radio_deception:0 "Radio Deception"
 mdcw_maskirovka_radio_deception_desc:0 "False radio traffic simulates armies that do not exist and hides those that do."
 mdcw_maskirovka_concealed_concentration:0 "Concealed Concentration"
 mdcw_maskirovka_concealed_concentration_desc:0 "Forces move by night and assemble only hours before they strike where the enemy is weakest."
 mdcw_maskirovka_amphibious_deception:0 "Amphibious Deception"
 mdcw_maskirovka_amphibious_deception_desc:0 "Feints and false preparations tie the enemy's reserves to the wrong stretch of coast."

 SUBDOCTRINE_MDCW_CADRE_RESERVE_SYSTEM:0 "Cadre and Reserve System"
 SUBDOCTRINE_MDCW_CADRE_RESERVE_SYSTEM_DESC:0 "In peacetime divisions are kept as cadres of officers and NCOs and filled with reservists on mobilisation. The army is cheap to maintain and grows fast, but skills fade between call-ups."
 mdcw_cadre_reserve_system_skeleton_divisions:0 "Skeleton Divisions"
 mdcw_cadre_reserve_system_skeleton_divisions_desc:0 "Cadre divisions only need to be filled, not raised from nothing."
 mdcw_cadre_reserve_system_military_commissariats:0 "Military Commissariats"
 mdcw_cadre_reserve_system_military_commissariats_desc:0 "A local registration office in every district keeps track of every man liable for service."
 mdcw_cadre_reserve_system_refresher_training:0 "Refresher Training"
 mdcw_cadre_reserve_system_refresher_training_desc:0 "Regular call-ups keep reservists in practice with their weapons and their units."
 mdcw_cadre_reserve_system_mobilisation_depots:0 "Mobilisation Depots"
 mdcw_cadre_reserve_system_mobilisation_depots_desc:0 "Equipment for whole divisions waits in storage, ready to be issued."
 mdcw_cadre_reserve_system_mobilisation_exercises:0 "Mobilisation Exercises"
 mdcw_cadre_reserve_system_mobilisation_exercises_desc:0 "Regular call-up drills: reservists report, draw their equipment and reach their units within days."

 SUBDOCTRINE_MDCW_ALL_VOLUNTEER_FORCE:0 "All-Volunteer Force"
 SUBDOCTRINE_MDCW_ALL_VOLUNTEER_FORCE_DESC:0 "A professional army of long-service volunteers: better trained, better motivated and far more expensive. Cannot be adopted under Partial Draft or Mandatory Service, and rules out both laws while held."
 mdcw_all_volunteer_force_career_ncos:0 "Career NCOs"
 mdcw_all_volunteer_force_career_ncos_desc:0 "Experienced sergeants who stay for twenty years are the backbone of the army."
 mdcw_all_volunteer_force_long_service_contracts:0 "Long-Service Contracts"
 mdcw_all_volunteer_force_long_service_contracts_desc:0 "Soldiers who sign on for years keep what they have learned."
 mdcw_all_volunteer_force_combat_training_centres:0 "Combat Training Centres"
 mdcw_all_volunteer_force_combat_training_centres_desc:0 "Live-fire exercises against a dedicated opposing force come close to real battle."
 mdcw_all_volunteer_force_quality_over_quantity:0 "Quality over Quantity"
 mdcw_all_volunteer_force_quality_over_quantity_desc:0 "A smaller army that is better at every task."
 mdcw_all_volunteer_force_rapid_deployment_forces:0 "Rapid Deployment Forces"
 mdcw_all_volunteer_force_rapid_deployment_forces_desc:0 "Professional units stay at constant readiness and move out fast without losing cohesion."

 SUBDOCTRINE_MDCW_RADIO_ELECTRONIC_COMBAT:0 "Radio-Electronic Combat"
 SUBDOCTRINE_MDCW_RADIO_ELECTRONIC_COMBAT_DESC:0 "Intercept, direction-finding and jamming units attack the enemy's command networks while our own communications are protected. The electronics are expensive to keep in service."
 mdcw_radio_electronic_combat_direction_finding:0 "Direction Finding"
 mdcw_radio_electronic_combat_direction_finding_desc:0 "Every enemy transmitter gives away the position of a headquarters."
 mdcw_radio_electronic_combat_command_net_jamming:0 "Command Net Jamming"
 mdcw_radio_electronic_combat_command_net_jamming_desc:0 "Jammed radio nets leave enemy commanders blind at the decisive moment."
 mdcw_radio_electronic_combat_secure_field_communications:0 "Secure Field Communications"
 mdcw_radio_electronic_combat_secure_field_communications_desc:0 "Encrypted radios and frequency discipline down to battalion level."
 mdcw_radio_electronic_combat_sigint_battalions:0 "SIGINT Battalions"
 mdcw_radio_electronic_combat_sigint_battalions_desc:0 "Dedicated units listen to the enemy's radio traffic and read his plans."
 mdcw_radio_electronic_combat_broadcast_jamming:0 "Broadcast Jamming"
 mdcw_radio_electronic_combat_broadcast_jamming_desc:0 "Jamming stations drown out foreign radio broadcasts aimed at our population."

 tactic_mdcw_human_wave:0 "Human Wave"
 tactic_mdcw_fanatical_last_stand:0 "Fanatical Last Stand"
 tactic_mdcw_grab_the_belt:0 "Grab Them by the Belt"
