l_english:
# IMPERIA CW — Cold War: historical starting spirits 0 — English localisation.
 AFG_1985_pdpa_fragmentation: "PDPA Factional State"
 AFG_1985_pdpa_fragmentation_desc: "Parcham, Khalq, army officers and local cadres all claim to defend the revolution, but the Afghan state survives through distrust, Soviet support and fragile city control."
 AFG_1985_soviet_advisory_mission: "Soviet Advisory Mission"
 AFG_1985_soviet_advisory_mission_desc: "Soviet advisers, air support and logistics keep the army functional, but Afghan command is expensive, dependent and poorly suited to offensive pacification."
 ALB_1985_bunkerized_people_army: "Bunkerized People's Army"
 ALB_1985_bunkerized_people_army_desc: "The regime has poured scarce resources into bunkers, militia training and total-defense doctrine. Albania can dig in, but the same obsession weighs heavily on industry."
 ALB_1985_hoxhaist_isolation: "Hoxhaist Isolation"
 ALB_1985_hoxhaist_isolation_desc: "Albania begins 1985 outside both Soviet and Chinese patronage. Self-reliance protects the regime from foreign influence, but it leaves the economy short of credit, technology and trade."
 DDR_1985_consumer_shortages: "Consumer Shortages"
 DDR_1985_consumer_shortages_desc: "The DDR can present order and employment, but ordinary supply is brittle. Queues, substitutions and small shortages shape political trust."
 DDR_1985_controlled_travel_bleed: "Controlled Travel Bleed"
 DDR_1985_controlled_travel_bleed_desc: "The state has opened narrow channels for travel and exit. The pressure is lower, but every approved passport teaches society that the wall is negotiable."
 DDR_1985_hard_currency_dependency: "Hard Currency Dependency"
 DDR_1985_hard_currency_dependency_desc: "Intershop, KoKo, prisoner releases and western credits bring precious D-Mark liquidity, but deepen corruption and dependence on Bonn."
 DDR_1985_lignite_dependency: "Lignite Dependency"
 DDR_1985_lignite_dependency_desc: "Brown coal keeps factories and apartments supplied, but at high environmental, health and productivity costs."
 DDR_1985_managed_shortages: "Managed Consumer Shortages"
 DDR_1985_managed_shortages_desc: "Better allocation and emergency purchases have softened the worst shortages, though the underlying weakness remains."
 DDR_1985_overextended_social_policy: "Overextended Social Policy"
 DDR_1985_overextended_social_policy_desc: "Honecker's welfare promises buy loyalty through housing, prices and social guarantees, but they strain the budget and the plan."
 DDR_1985_republikflucht_pressure: "Republikflucht Pressure"
 DDR_1985_republikflucht_pressure_desc: "Applications to leave, family ties in the west and the quiet arithmetic of escape drain labor, confidence and legitimacy from the republic."
 DDR_1985_stasi_saturation: "Stasi Saturation"
 DDR_1985_stasi_saturation_desc: "The Ministry for State Security sees churches, factories, artists and families as operational spaces. It protects the regime while poisoning trust."
 DDR_1985_western_media_pressure: "Western Media Pressure"
 DDR_1985_western_media_pressure_desc: "West German television, radio and family contacts make comparison unavoidable. The border stops bodies more easily than images."
 SOV_1985_afghan_war_burden: "Burden of Afghanistan"
 SOV_1985_afghan_war_burden_desc: "The Afghan war consumes prestige, manpower and money while the public is told not to ask too many questions."
 SOV_1985_afghanistan_withdrawal_plan: "Afghanistan Withdrawal Plan"
 SOV_1985_afghanistan_withdrawal_plan_desc: "A withdrawal timetable eases the long-term burden, but the army and party patriots will watch every concession for signs of humiliation."
 SOV_1985_alcoholism_crisis: "Alcoholism and Absenteeism"
 SOV_1985_alcoholism_crisis_desc: "Alcohol abuse is a social, health and workplace crisis. It drains labor discipline, public health and tax revenue before reform even begins."
 SOV_1985_anti_alcohol_campaign_idea: "Anti-Alcohol Campaign"
 SOV_1985_anti_alcohol_campaign_idea_desc: "The state attacks drinking with administrative zeal. Health and discipline improve at the margins, while budgets, shops and black markets suffer."
 SOV_1985_gerontocratic_party_state: "Gerontocratic Party State"
 SOV_1985_gerontocratic_party_state_desc: "By 1985 the Soviet system is led by a party elite shaped by war, fear and routine. The bureaucracy still obeys, but it moves slowly and punishes initiative."
 SOV_1985_kgb_guardians_of_order: "KGB Guardians of Order"
 SOV_1985_kgb_guardians_of_order_desc: "The security organs remain one of the few Soviet institutions that still looks disciplined. They protect the state, and make reform afraid of itself."
 SOV_1985_oil_revenue_squeeze: "Oil Revenue Squeeze"
 SOV_1985_oil_revenue_squeeze_desc: "Falling energy revenues expose how much hard currency the Soviet budget needs to import technology, grain and political time."
 SOV_1985_ssr_western_pressure: "Western Pressure on the Republics"
 SOV_1985_ssr_western_pressure_2: "Organized Western Pressure"
 SOV_1985_ssr_western_pressure_2_desc: "Western attention has become a durable pressure system. Local activists, cultural networks and foreign broadcasters are harder for Moscow to ignore."
 SOV_1985_ssr_western_pressure_3: "Intense Western Pressure"
 SOV_1985_ssr_western_pressure_3_desc: "The republic is now under sustained information and diplomatic pressure from the west. Loyalty to Moscow is still real, but it no longer speaks alone."
 SOV_1985_ssr_western_pressure_desc: "Foreign broadcasts, diaspora channels, human-rights campaigns and quiet contacts give local society another language for loyalty, sovereignty and dissent."
 SOV_1985_stagnating_command_economy: "Stagnating Command Economy"
 SOV_1985_stagnating_command_economy_desc: "The plan can still mobilize steel, tanks and ministries, but civilian supply, investment discipline and productivity are visibly exhausted."
 TAL_1985_cross_border_sanctuaries: "Cross-Border Sanctuaries"
 TAL_1985_cross_border_sanctuaries_desc: "Pakistani border access, foreign funding and Islamic networks provide recruits, supplies and a rear area beyond Kabul's reach."
 TAL_1985_mujahideen_guerilla_networks: "Mujahideen Guerrilla Networks"
 TAL_1985_mujahideen_guerilla_networks_desc: "Local commanders, mountain routes and village support let the Mujahideen defend terrain, disappear and return, even when they lack a state army."
