 COLDWAR_cw_v4.7.t: "Our Campaigners Expelled"
 COLDWAR_cw_v4.7.d: "The government of [?var:COLDWAR_cw_ev7_partner.GetNameDef] has closed the offices of our public support campaign and put our speakers on the next plane home. The campaign is over, and we cannot start a new one there for 180 days."
