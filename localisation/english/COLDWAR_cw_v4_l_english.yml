 COLDWAR_cw_ov_outlook: "[COLDWAR_cw_outlook_L]"
 COLDWAR_cw_ov_outlook_none: "Outlook: §gNon-Aligned states belong to no bloc and carry no bloc outlook.§!"
 COLDWAR_cw_ov_outlook_tt: "§YWhy outlook matters§!\nEvery bloc has ruling parties that fit it: Western parties, monarchies, juntas and neutral conservatives fit the §YWestern Bloc§!; communist, Arab socialist, left nationalist and military regimes fit the §YSoviet Bloc§! and the §YBeijing Camp§!. The bloc cards list them all. Any government may join any bloc, but members whose ruling party does not fit are §Routsiders§!:\n · they count only §R60%§! of their bloc points, so the bloc holds a smaller share of world power,\n · they receive only §R60%§! of the network, leadership and pillar effects,\n · they pull down the cohesion of the whole bloc, from §Gx1.50§! when every member shares the outlook to §Rx0.50§! when none does. Cohesion multiplies the effects of every member.\n\n§YHow to fix it§!\nAn outsider becomes a core member as soon as a fitting party rules: through an election, a party campaign or a coup. A bloc leader with many outsiders has every reason to back the right party in its members, for example with a coup against a government that does not share the bloc's outlook."
 COLDWAR_cw_bl_outsider_on: " §R(outsider)§!"
 COLDWAR_cw_bl_outsider_off: ""
 COLDWAR_cw_bl_outsider_tt_on: "\n§ROutsider§!: its ruling party does not share the bloc's outlook. It counts and receives only 60% and lowers the cohesion of every member. An election, a party campaign or a coup that brings a fitting party to power makes it a core member."
 COLDWAR_cw_join_as_core: "§GOur ruling party shares this bloc's outlook: we would join as a core member.§!"
 COLDWAR_cw_join_as_outsider: "§RWe would join as an outsider§!: our ruling party does not share this bloc's outlook. We would count and receive only 60% and lower the bloc's cohesion until a fitting party rules."
