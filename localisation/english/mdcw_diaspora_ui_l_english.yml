 gw_dp_retention_button_tt:0 "Fund settlement and family support for 365 days.\n\n75 Political Power\nAdditional weekly spending: $$25 million per 100,000 residents.\nAnnual voluntary return rate: -35% relative.\n[gw_dp_policy_status]"
 gw_dp_homecoming_button_tt:0 "Offer relocation and employment assistance to our citizens abroad.\n\n75 Political Power | $$[?gw_dp_homecoming_cash|2] billion\nAnnual return rate: +4 percentage points for 365 days for the funded population. Later emigration does not enlarge the funded group.\n[gw_dp_policy_status]"
 gw_dp_remittance_button_tt:0 "Arrange cheaper transfers and family savings schemes.\n\n75 Political Power | $$[?gw_dp_campaign_cash|2] billion\nParticipants: [?gw_dp_campaign_k|1] thousand\nAdditional weekly remittances: up to $$[?gw_dp_campaign_k|1] million, for 180 days.\nNational campaign limit: $$300 million/week.\nAll remittances share the $$3 billion weekly ceiling.\nRequires 25,000 eligible net emigrants and an available programme place.\n[gw_dp_policy_status]"
 gw_dp_trade_button_tt:0 "Negotiate household goods deliveries through our overseas community.\n\n50 Political Power | $$[?gw_dp_trade_cash|2] billion\nConsumer Goods Factor: [?gw_dp_trade_preview|%1] for 365 days.\nThe host government must approve and receives the full payment. Requires 25,000 residents. Total trade relief is limited to -6%.\n[gw_dp_policy_status]"
 gw_dp_skill_button_tt:0 "Negotiate employment preparation and resettlement at home.\n\n100 Political Power | up to $$[?gw_dp_skill_cash|2] billion at completion\nReturn target: [?gw_dp_skill_k|1] thousand over 365 days.\nResearch Speed: up to +[?gw_dp_skill_research|%1] for 730 days.\nThe host must approve and receives half the completion payment. Earlier voluntary returns count towards the target. Payments and research scale with actual funded returns; national research relief is capped at +3%.\nRequires 25,000 residents, an available programme place and expiry of the 730-day national interval.\n[gw_dp_policy_status]"
 gw_dp_migration_tt:0 "Latest annual return rate: [?gw_ui_return_rate|1]%\nExpected returns from the eligible stock: [?gw_ui_return_expected|1] thousand\nLast annual return: [?gw_ui_return_last|1] thousand\n\nA smaller income advantage abroad encourages return. Each full 5 percentage points of stability advantage changes the annual return rate by 1 percentage point, up to +/-2.\nWar in the host country alone multiplies returns by 4, up to 60% a year. War in the home country alone reduces returns to one quarter. If both are at war, neither war adjustment applies.\nRates are reviewed quarterly and population returns annually. New arrivals enter the following return-year cohort. Settlement and integration can reduce return by up to 60%; the final annual rate is 0.5-15%, or up to 60% if only the host country is at war. Earlier organised returns discharge the corresponding annual return allowance. Ordinary returns carry no forced-repatriation penalties."
