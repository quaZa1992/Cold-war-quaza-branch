l_english:
# IMPERIA COLD WAR — Syrian national diplomacy and investment alternatives.
 COLDWAR_SYR_RP_national_programme: "Syria, 1970"
 COLDWAR_SYR_RP_consult_cairo: "Consult Cairo"
 COLDWAR_SYR_RP_consult_cairo_desc: "The experience of union with Egypt still divides Damascus. Invite Cairo to negotiate what the two general staffs should share and which decisions each capital will keep."
 COLDWAR_SYR_RP_liaison_school: "Liaison School"
 COLDWAR_SYR_RP_liaison_school_desc: "Train Syrian liaison officers to draft common orders and run staff exercises at home. The first class will write a field manual for divisional headquarters."
 COLDWAR_SYR_RP_liaison_school_appropriation: "Liaison School"
 COLDWAR_SYR_RP_liaison_school_appropriation_desc: "The proposed agreement was declined. Train Syrian liaison officers to draft common orders and run staff exercises at home. The first class will write a field manual for divisional headquarters."
 COLDWAR_SYR_RP_geneva_separation: "Geneva Separation"
 COLDWAR_SYR_RP_geneva_separation_desc: "Offer Israel talks on a separation of forces on the Golan. The two delegations must settle the terms of observation and civilian access."
 COLDWAR_SYR_RP_golan_housing: "Golan Housing"
 COLDWAR_SYR_RP_golan_housing_desc: "Set aside urban land around Damascus for families displaced from the Golan. The social affairs ministry will cover rents while housing cooperatives prepare permanent homes."
 COLDWAR_SYR_RP_golan_housing_appropriation: "Golan Housing"
 COLDWAR_SYR_RP_golan_housing_appropriation_desc: "The proposed agreement was declined. Set aside urban land around Damascus for families displaced from the Golan. The social affairs ministry will cover rents while housing cooperatives prepare permanent homes."
 COLDWAR_SYR_RP_golan_housing_spirit: "Golan Resettlement Housing"
 COLDWAR_SYR_RP_golan_housing_spirit_desc: "Set aside urban land around Damascus for families displaced from the Golan. The social affairs ministry will cover rents while housing cooperatives prepare permanent homes."
 COLDWAR_SYR_RP_moscow_treaty: "The Moscow Treaty"
 COLDWAR_SYR_RP_moscow_treaty_desc: "A treaty of friendship could put Soviet technical assistance on a regular footing. The scope of that commitment requires agreement in both capitals."
 COLDWAR_SYR_RP_technical_colleges: "Technical Colleges"
 COLDWAR_SYR_RP_technical_colleges_desc: "Fund courses for industrial foremen in Homs. Workshop placements give the first intake experience on local production lines while the colleges develop a Syrian technical curriculum."
 COLDWAR_SYR_RP_technical_colleges_appropriation: "Technical Colleges"
 COLDWAR_SYR_RP_technical_colleges_appropriation_desc: "The proposed agreement was declined. Fund courses for industrial foremen in Homs. Workshop placements give the first intake experience on local production lines while the colleges develop a Syrian technical curriculum."
 COLDWAR_SYR_RP_tehran_oil_protocol: "Tehran Oil Protocol"
 COLDWAR_SYR_RP_tehran_oil_protocol_desc: "Negotiate a supply protocol with Tehran. Deliveries and payments would tie two treasuries to a common schedule."
 COLDWAR_SYR_RP_fuel_reserves: "Fuel Reserves"
 COLDWAR_SYR_RP_fuel_reserves_desc: "Lease tank space and purchase an initial fuel reserve for civilian and military deliveries. Contracts for depot maintenance and distribution run for two years."
 COLDWAR_SYR_RP_fuel_reserves_appropriation: "Fuel Reserves"
 COLDWAR_SYR_RP_fuel_reserves_appropriation_desc: "The proposed agreement was declined. Lease tank space and purchase an initial fuel reserve for civilian and military deliveries. Contracts for depot maintenance and distribution run for two years."
 COLDWAR_SYR_RP_fuel_reserves_spirit: "National Fuel Reserve Leases"
 COLDWAR_SYR_RP_fuel_reserves_spirit_desc: "Lease tank space and purchase an initial fuel reserve for civilian and military deliveries. Contracts for depot maintenance and distribution run for two years."
 COLDWAR_SYR_RP_euphrates_protocol: "Euphrates Protocol"
 COLDWAR_SYR_RP_euphrates_protocol_desc: "Propose a schedule for Euphrates releases at the Turkish frontier. The ministries can also exchange measurements from their gauging stations."
 COLDWAR_SYR_RP_local_reservoirs: "Local Reservoirs"
 COLDWAR_SYR_RP_local_reservoirs_desc: "Finance village reservoirs and distribution channels in Al-Hasakah. The new irrigation district can keep more land in cultivation between spring rains."
 COLDWAR_SYR_RP_local_reservoirs_appropriation: "Local Reservoirs"
 COLDWAR_SYR_RP_local_reservoirs_appropriation_desc: "The proposed agreement was declined. Finance village reservoirs and distribution channels in Al-Hasakah. The new irrigation district can keep more land in cultivation between spring rains."
 COLDWAR_SYR_RP_local_reservoirs_spirit: "Local Irrigation Reservoirs"
 COLDWAR_SYR_RP_local_reservoirs_spirit_desc: "Fund village reservoirs and maintain distribution channels through two growing seasons. Reliable local water gives cultivators more freedom to plant."

