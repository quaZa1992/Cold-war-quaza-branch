l_english:
# IMPERIA COLD WAR — Syrian domestic reconstruction and institutions, 1970-1990.
 COLDWAR_SYR_RP_domestic_after_residence_tt: "After §Y$COLDWAR_SYR_RP_presume_residence$§!:"
 COLDWAR_SYR_RP_domestic_after_appeals_tt: "After §Y$COLDWAR_SYR_RP_district_appeals$§!:"
 COLDWAR_SYR_RP_survey_balikh: "Survey the Balikh"
 COLDWAR_SYR_RP_survey_balikh_desc: "A canal on a ministry map tells a farmer little about where water will reach his land. Engineers will survey the Balikh plain with village cultivators before fixing the course of the secondary canals."
 COLDWAR_SYR_RP_displaced_farmers: "Displaced Farmers"
 COLDWAR_SYR_RP_displaced_farmers_desc: "Villages in the proposed reservoir basin need a count of families, fields and livestock. District officials will take claims in the villages themselves, including those of tenants who hold no title."
 COLDWAR_SYR_RP_domestic_farmers_plus_5: "Opinion of §Y$farmers$§!: §G+5§!"
 COLDWAR_SYR_RP_domestic_farmers_plus_5_twice: "Opinion of §Y$farmers$§!: §G+10§!"
 COLDWAR_SYR_RP_compensate_land: "Compensate in Land"
 COLDWAR_SYR_RP_compensate_land_desc: "Offer displaced cultivators replacement plots from the state domain. Surveyors and construction crews must mark boundaries and connect the new villages before other projects can proceed."
 COLDWAR_SYR_RP_domestic_farmers_plus_10: "Opinion of §Y$farmers$§!: §G+10§!"
 COLDWAR_SYR_RP_domestic_farmers_plus_10_twice: "Opinion of §Y$farmers$§!: §G+20§!"
 COLDWAR_SYR_RP_compensate_land_idea: "Resettlement Surveys"
 COLDWAR_SYR_RP_compensate_land_idea_desc: "Offer displaced cultivators replacement plots from the state domain. Surveyors and construction crews must mark boundaries and connect the new villages before other projects can proceed."
 COLDWAR_SYR_RP_finance_new_farms: "Finance New Farms"
 COLDWAR_SYR_RP_finance_new_farms_desc: "Let families choose where to resettle and advance credit for houses, pumps and tools. Planted fields and working pumps will bring the new holdings into production."
 COLDWAR_SYR_RP_finance_new_farms_idea: "Farm Reconstruction Credit"
 COLDWAR_SYR_RP_finance_new_farms_idea_desc: "Farm credit brings the new holdings into production by equipping displaced families with pumps, seed and tools."
 COLDWAR_SYR_RP_commission_tabqa: "Commission Tabqa"
 COLDWAR_SYR_RP_commission_tabqa_desc: "Bring a generating unit at the Euphrates Dam into service. Its turbines, transmission works and operators will give the Raqqa works a permanent place in the national grid."
 COLDWAR_SYR_RP_map_saline_soils: "Map the Saline Soils"
 COLDWAR_SYR_RP_map_saline_soils_desc: "Irrigation can leave salts in the root zone when drainage falls behind. A field survey will identify the plots where more water would spoil an otherwise productive harvest."
 COLDWAR_SYR_RP_village_water_boards: "Village Water Boards"
 COLDWAR_SYR_RP_village_water_boards_desc: "Let elected water boards set local turns and hear disputes. Farmers know which channels silt up first, though every board will need a clerk and reliable accounts."
 COLDWAR_SYR_RP_village_water_boards_idea: "Village Water Boards"
 COLDWAR_SYR_RP_village_water_boards_idea_desc: "Let elected water boards set local turns and hear disputes. Farmers know which channels silt up first, though every board will need a clerk and reliable accounts."
 COLDWAR_SYR_RP_irrigation_districts: "Irrigation Districts"
 COLDWAR_SYR_RP_irrigation_districts_desc: "Give district engineers authority over pumping schedules and maintenance. Coordinating whole canal systems improves yields, while machine shops must reserve time and parts for the irrigation service."
 COLDWAR_SYR_RP_irrigation_districts_idea: "District Irrigation Service"
 COLDWAR_SYR_RP_irrigation_districts_idea_desc: "Give district engineers authority over pumping schedules and maintenance. Coordinating whole canal systems improves yields, while machine shops must reserve time and parts for the irrigation service."
 COLDWAR_SYR_RP_drain_balikh: "Drain the Balikh"
 COLDWAR_SYR_RP_drain_balikh_desc: "Drainage collectors will carry excess water away from irrigated fields. The work will protect the lower plain, while farmers beyond the canals will still depend on the timing of the rains."
 COLDWAR_SYR_RP_train_pump_crews: "Train Pump Crews"
 COLDWAR_SYR_RP_train_pump_crews_desc: "Train mechanics in provincial workshops to service electric pump motors and switchgear. A breakdown during irrigation season should no longer mean waiting for a team from Damascus."
 COLDWAR_SYR_RP_dryland_seed_banks: "Dryland Seed Banks"
 COLDWAR_SYR_RP_dryland_seed_banks_desc: "Store locally adapted seed in the dry-farming districts and replenish stocks after a good harvest. The reserve can save a planting season, although it cannot supply the missing rain."
 COLDWAR_SYR_RP_state_enterprises: "State Enterprises"
 COLDWAR_SYR_RP_state_enterprises_desc: "Public factories inherited different machines, inventories and accounting practices. A ministry survey will identify which lines can share tooling, at the cost of time on the shop floor."
 COLDWAR_SYR_RP_state_enterprises_idea: "Enterprise Inventory"
 COLDWAR_SYR_RP_state_enterprises_idea_desc: "Public factories inherited different machines, inventories and accounting practices. A ministry survey will identify which lines can share tooling, at the cost of time on the shop floor."
 COLDWAR_SYR_RP_aleppo_workshops: "Aleppo Workshops"
 COLDWAR_SYR_RP_aleppo_workshops_desc: "Give Aleppo's turners and pattern makers standing orders for interchangeable tooling and replacement parts. Plants will bring production lines up to speed sooner after retooling."
 COLDWAR_SYR_RP_aleppo_workshops_idea: "Aleppo Workshop Orders"
 COLDWAR_SYR_RP_aleppo_workshops_idea_desc: "Standing workshop orders keep interchangeable tooling and replacement parts close to the production lines that use them."
 COLDWAR_SYR_RP_aleppo_textile_mills: "Aleppo Textile Mills"
 COLDWAR_SYR_RP_aleppo_textile_mills_desc: "Direct the next industrial appropriation to the looms and finishing sheds of Aleppo. Cotton can pass from spinner to weaver within a city already equipped to sell the cloth."
 COLDWAR_SYR_RP_homs_engineering: "Homs Engineering"
 COLDWAR_SYR_RP_homs_engineering_desc: "Build an engineering works in Homs with an apprenticeship shop beside the production floor. The instruction and tooling cost more up front and leave the country better able to maintain the next factory."
 COLDWAR_SYR_RP_price_spare_parts: "Price the Spare Parts"
 COLDWAR_SYR_RP_price_spare_parts_desc: "Give common components a published transfer price across public enterprises. Managers can release a bearing or motor without bargaining with three ministries, though some will resist losing discretion."
 COLDWAR_SYR_RP_port_dispatch: "Port Dispatch Office"
 COLDWAR_SYR_RP_port_dispatch_desc: "Open a dispatch office in Latakia to match arriving cargo with customs clearance and inland transport. A single ledger should show which consignments are still waiting on the quay."
 COLDWAR_SYR_RP_coastal_freight: "Coastal Freight"
 COLDWAR_SYR_RP_coastal_freight_desc: "Improve the coastal approaches to Latakia so trucks can move between the port, warehouses and the railway without losing a day in transit."
 COLDWAR_SYR_RP_inland_roads: "Inland Roads"
 COLDWAR_SYR_RP_inland_roads_desc: "Direct road crews to the approaches to Homs. Inland workshops and farms gain a more reliable junction for consignments bound for Damascus, Aleppo and the coast."
 COLDWAR_SYR_RP_mill_accountants: "Mill Accountants"
 COLDWAR_SYR_RP_mill_accountants_desc: "Teach mill accountants to reconcile payroll, inventories and dispatch records. The central statistical office can use the same records to prepare its first machine-readable returns."
 COLDWAR_SYR_RP_machine_tool_tenders: "Machine Tool Tenders"
 COLDWAR_SYR_RP_machine_tool_tenders_desc: "Invite tenders for lathes and milling machines with interchangeable tooling and a supply of drawings. Compare the maintenance terms as closely as the purchase price."
 COLDWAR_SYR_RP_enterprise_accounts: "Enterprise Accounts"
 COLDWAR_SYR_RP_enterprise_accounts_desc: "Require public enterprises to reconcile their accounts on a common calendar. The change slows the introduction of new production runs while managers close old books and retire duplicate returns."
 COLDWAR_SYR_RP_enterprise_accounts_idea: "Enterprise Reconciliation"
 COLDWAR_SYR_RP_enterprise_accounts_idea_desc: "Public plants must reconcile inventories and transfer prices while introducing the new reporting calendar."
 COLDWAR_SYR_RP_hasakah_registers: "Hasakah Registers"
 COLDWAR_SYR_RP_hasakah_registers_desc: "The exceptional Hasakah census of 1962 left Kurdish families divided by legal status. Reopen the district ledgers so that people recorded as foreigners and people omitted altogether can present a claim."
 COLDWAR_SYR_RP_qamishli_hearings: "Qamishli Hearings"
 COLDWAR_SYR_RP_qamishli_hearings_desc: "Hear claimants in Qamishli, close to the farms and villages whose families lost civil status. Tenancy records, witnesses and school certificates can supplement incomplete registers."
 COLDWAR_SYR_RP_domestic_farmers_plus_6: "Opinion of §Y$farmers$§!: §G+6§!"
 COLDWAR_SYR_RP_domestic_farmers_plus_6_twice: "Opinion of §Y$farmers$§!: §G+12§!"
 COLDWAR_SYR_RP_presume_residence: "Presume Residence"
 COLDWAR_SYR_RP_presume_residence_desc: "Accept established local residence as the starting evidence for a claim. More households enter the tax rolls, and district offices must check conflicting testimony."
 COLDWAR_SYR_RP_presume_residence_idea: "Presumption of Residence"
 COLDWAR_SYR_RP_presume_residence_idea_desc: "Civil rolls recognise established local residence. District officials verify testimony and register households for public services and taxation."
 COLDWAR_SYR_RP_district_appeals: "Fund District Appeals"
 COLDWAR_SYR_RP_district_appeals_desc: "Give claimants access to a district appeals panel and require registrars to follow its decisions. Credible judgments give the government room to act, while a standing hearings service requires clerks and records."
 COLDWAR_SYR_RP_district_appeals_idea: "District Appeals Panels"
 COLDWAR_SYR_RP_district_appeals_idea_desc: "Give claimants access to a district appeals panel and require registrars to follow its decisions. A binding judgment strengthens civil authority, at the price of a permanent hearings service."
 COLDWAR_SYR_RP_issue_civil_papers: "Issue Civil Papers"
 COLDWAR_SYR_RP_issue_civil_papers_desc: "Authorise registrars to issue civil papers under the rules established by the hearings. Recognised households can register births and marriages, and eligible residents can enlist in national service."
 COLDWAR_SYR_RP_rural_teachers: "Rural Teachers"
 COLDWAR_SYR_RP_rural_teachers_desc: "Fund training and postings for teachers beyond the provincial capitals. A village school can give capable pupils a route into secondary education even where trained staff remain scarce."
 COLDWAR_SYR_RP_village_classrooms: "Village Classrooms"
 COLDWAR_SYR_RP_village_classrooms_desc: "Keep primary classrooms within reach of remote settlements. Scattered posts cost more per pupil, and public offices gain a wider pool of applicants who can read and keep records."
 COLDWAR_SYR_RP_village_classrooms_idea: "Village Classrooms"
 COLDWAR_SYR_RP_village_classrooms_idea_desc: "Village schools extend basic literacy to communities beyond the provincial capitals. Small classes and dispersed appointments raise the cost of instruction."
 COLDWAR_SYR_RP_technical_bursaries: "Technical Bursaries"
 COLDWAR_SYR_RP_technical_bursaries_desc: "Pay tuition and lodging for provincial pupils entering technical colleges. Advanced instruction strengthens the country's research base and commits the education budget to each new intake."
 COLDWAR_SYR_RP_technical_bursaries_idea: "Provincial Technical Bursaries"
 COLDWAR_SYR_RP_technical_bursaries_idea_desc: "Pay tuition and lodging for provincial pupils entering technical colleges. Advanced instruction strengthens the country's research base and commits the education budget to each new intake."
 COLDWAR_SYR_RP_district_clinics: "District Clinics"
 COLDWAR_SYR_RP_district_clinics_desc: "Establish regular provincial clinics and travelling consultations. Preventive care and access to midwives put essential services within reach of rural families."
 COLDWAR_SYR_RP_district_clinics_idea: "Provincial Clinic Network"
 COLDWAR_SYR_RP_district_clinics_idea_desc: "Provincial clinics support vaccination, maternity care and travelling consultations in districts that lack a permanent physician."
 COLDWAR_SYR_RP_local_advocates: "Local Advocates"
 COLDWAR_SYR_RP_local_advocates_desc: "Recognise advocates who take disputes to district offices on behalf of their neighbours. Grievances can be addressed locally, but officials must hear objections before issuing final orders."
 COLDWAR_SYR_RP_local_advocates_idea: "Local Advocates"
 COLDWAR_SYR_RP_local_advocates_idea_desc: "Recognise advocates who take disputes to district offices on behalf of their neighbours. Grievances can be addressed locally, but officials must hear objections before issuing final orders."
 COLDWAR_SYR_RP_circuit_magistrates: "Circuit Magistrates"
 COLDWAR_SYR_RP_circuit_magistrates_desc: "Send magistrates on regular circuits with the authority to decide outstanding cases. A binding judgment ends repeated petitions to different offices and reduces the clerical burden."
 COLDWAR_SYR_RP_circuit_magistrates_idea: "Circuit Magistrates"
 COLDWAR_SYR_RP_circuit_magistrates_idea_desc: "Regular judicial circuits settle cases that would otherwise generate repeated district hearings and correspondence."
 COLDWAR_SYR_RP_rural_colleges: "Rural Colleges"
 COLDWAR_SYR_RP_rural_colleges_desc: "Hold technical courses in provincial colleges for pupils who cannot move to Damascus or Aleppo. Local teaching posts widen access to specialist training, though experienced instructors remain scarce."
 COLDWAR_SYR_RP_inquiry_1967: "The 1967 Inquiry"
 COLDWAR_SYR_RP_inquiry_1967_desc: "Ask officers to account for the breakdown of command in June 1967. The Army can preserve what its formations learned, even as senior officers resent having their decisions examined."
 COLDWAR_SYR_RP_domestic_the_military_minus_5: "Opinion of §Y$the_military$§!: §R-5§!"
 COLDWAR_SYR_RP_staff_college: "The Staff College"
 COLDWAR_SYR_RP_staff_college_desc: "Assign experienced officers to teach staff work between field postings. A standing syllabus at Homs will make it easier to put a common doctrine into practice."
 COLDWAR_SYR_RP_staff_college_idea: "Homs Staff Instruction"
 COLDWAR_SYR_RP_staff_college_idea_desc: "A permanent staff syllabus gives field officers common procedures for command, training and mobilisation."
 COLDWAR_SYR_RP_professional_cadres: "Professional Cadres"
 COLDWAR_SYR_RP_professional_cadres_desc: "Retain trained officers and noncommissioned officers on longer appointments. Better continuity helps units recover after a setback, while salaries and career allowances rise."
 COLDWAR_SYR_RP_professional_cadres_idea: "Professional Cadres"
 COLDWAR_SYR_RP_professional_cadres_idea_desc: "Career appointments retain experienced officers and noncommissioned officers, with higher salaries and allowances."
 COLDWAR_SYR_RP_larger_reserve: "A Larger Reserve"
 COLDWAR_SYR_RP_larger_reserve_desc: "Call up additional reservists and hold their names on active district lists. The Army can mobilise faster, but units need a longer training cycle to absorb the new intake."
 COLDWAR_SYR_RP_larger_reserve_idea: "Expanded Reserve Rolls"
 COLDWAR_SYR_RP_larger_reserve_idea_desc: "Current district rolls speed mobilisation. The larger intake requires more time in unit training before deployment."
 COLDWAR_SYR_RP_workshop_standards: "Workshop Standards"
 COLDWAR_SYR_RP_workshop_standards_desc: "Give depot mechanics common inspection sheets and release the first batch of serviceable trucks from overhaul. Each depot will use the same standards before returning a vehicle to the Army."
 COLDWAR_SYR_RP_golan_staff_review: "Golan Staff Review"
 COLDWAR_SYR_RP_golan_staff_review_desc: "Bring divisional staffs together to revise command arrangements in light of the Golan experience. Changing established responsibilities will cost political support inside the officer corps."
 COLDWAR_SYR_RP_unify_depot_accounts: "Unify Depot Accounts"
 COLDWAR_SYR_RP_unify_depot_accounts_desc: "Place depot returns on a single accounting system. Staff can direct supplies to the units that need them, although a central office must keep the records current."
 COLDWAR_SYR_RP_unify_depot_accounts_idea: "Unified Depot Accounts"
 COLDWAR_SYR_RP_unify_depot_accounts_idea_desc: "Place depot returns on a single accounting system. Staff can direct supplies to the units that need them, although a central office must keep the records current."
 COLDWAR_SYR_RP_local_depot_budgets: "Local Depot Budgets"
 COLDWAR_SYR_RP_local_depot_budgets_desc: "Give district quartermasters authority to replace worn parts before vehicles fail on the road. Separate local stocks require extra consignments, but fewer vehicles wait for repairs."
 COLDWAR_SYR_RP_local_depot_budgets_idea: "Local Depot Budgets"
 COLDWAR_SYR_RP_local_depot_budgets_idea_desc: "District quartermasters approve repairs and stock spares on their own accounts. Local warehouses need additional supply deliveries."
 COLDWAR_SYR_RP_reserve_officers: "Reserve Officers"
 COLDWAR_SYR_RP_reserve_officers_desc: "Put trained reserve officers on current district rosters and practise assigning them to formations. The General Staff gains officers it can call on to fill vacant commands."
 COLDWAR_SYR_RP_defence_estimates: "Defence Estimates"
 COLDWAR_SYR_RP_defence_estimates_desc: "Require a yearly personnel appropriation with every new call-up. The Ministry of Defence can curb payroll costs, though fresh mobilisation orders will take longer to approve."
 COLDWAR_SYR_RP_defence_estimates_idea: "Revised Defence Estimates"
 COLDWAR_SYR_RP_defence_estimates_idea_desc: "A standing personnel ceiling keeps payroll commitments within the defence estimates and adds a review before new mobilisation orders."
