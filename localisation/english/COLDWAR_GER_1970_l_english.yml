 COLDWAR_GDIP.70.b:0 "Not without Moscow's blessing."
 COLDWAR_GDIP.70.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. The Federal Republic proposes full diplomatic relations: embassies, trade agreements and cultural exchange.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.70.t:0 "Diplomatic Relations with Bonn"
 COLDWAR_GDIP.71.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.71.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'Diplomatic Relations with Bonn' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.71.t:0 "Diplomatic Relations with Bonn: Agreed"
 COLDWAR_GDIP.72.a:0 "Then not - for now."
 COLDWAR_GDIP.72.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'Diplomatic Relations with Bonn'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.72.t:0 "Diplomatic Relations with Bonn: Refused"
 COLDWAR_GDIP.80.a:0 "We establish relations."
 COLDWAR_GDIP.80.b:0 "Not without Moscow's blessing."
 COLDWAR_GDIP.80.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. The Federal Republic proposes full diplomatic relations: embassies, trade agreements and cultural exchange.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.80.t:0 "Diplomatic Relations with Bonn"
 COLDWAR_GDIP.81.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.81.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'Diplomatic Relations with Bonn' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.81.t:0 "Diplomatic Relations with Bonn: Agreed"
 COLDWAR_GDIP.82.a:0 "Then not - for now."
 COLDWAR_GDIP.82.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'Diplomatic Relations with Bonn'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.82.t:0 "Diplomatic Relations with Bonn: Refused"
 COLDWAR_GDIP.90.a:0 "The price is acceptable."
 COLDWAR_GDIP.90.b:0 "Romania's citizens are not for sale."
 COLDWAR_GDIP.90.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn offers hard currency and credits in return for permission for ethnic Germans to emigrate - several thousand a year, without publicity.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.90.t:0 "Emigration for Credits"
 COLDWAR_GDIP.91.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.91.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'Emigration for Credits' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.91.t:0 "Emigration for Credits: Agreed"
 COLDWAR_GDIP.92.a:0 "Then not - for now."
 COLDWAR_GDIP.92.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'Emigration for Credits'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.92.t:0 "Emigration for Credits: Refused"
 COLDWAR_GDOM.1.a:0 "We have the two thirds. Pass it."
 COLDWAR_GDOM.1.b:0 "Pay the opposition's price for its votes."
 COLDWAR_GDOM.1.b.tt:0 "The opposition votes with us - and takes the credit (§Y75§! political power, the largest opposition party §R+1%§!)."
 COLDWAR_GDOM.1.c:0 "Without two thirds it cannot pass. Let it fall."
 COLDWAR_GDOM.1.desc:0 "The government asks the Bundestag to add national referendums and citizens' initiatives to the Basic Law. The Union warns of demagogues, the Greens cheer, the constitutional lawyers quote Weimar.\n\nAn amendment to the Basic Law needs two thirds of the Bundestag and of the Bundesrat."
 COLDWAR_GDOM.1.t:0 "Referendums in the Basic Law"
 COLDWAR_GDOM.10.a:0 "Citizenship by birth and dual citizenship."
 COLDWAR_GDOM.10.b:0 "Citizenship by birth - but choose one passport at 23."
 COLDWAR_GDOM.10.c:0 "Withdraw the bill."
 COLDWAR_GDOM.10.desc:0 "The government's citizenship reform reaches the Bundestag. In Hesse the Union collects signatures 'against dual citizenship' - and wins an election with them."
 COLDWAR_GDOM.10.t:0 "Two Passports?"
 COLDWAR_GDOM.11.a:0 "Pass the amnesty law."
 COLDWAR_GDOM.11.a.tt:0 "The FDP's own deputies might revolt - and the public will not forget."
 COLDWAR_GDOM.11.b:0 "Let the prosecutors do their work."
 COLDWAR_GDOM.11.desc:0 "Prosecutors want to charge Otto Graf Lambsdorff and Hans Friderichs with corruption. The parties' leaders have prepared a quiet way out: an amnesty for all illegal party donations of the past."
 COLDWAR_GDOM.11.t:0 "Cultivating the Political Landscape"
 COLDWAR_GDOM.2.a:0 "We have the two thirds. Pass it."
 COLDWAR_GDOM.2.b:0 "Pay the opposition's price for its votes."
 COLDWAR_GDOM.2.b.tt:0 "The opposition votes with us - and takes the credit (§Y75§! political power, the largest opposition party §R+1%§!)."
 COLDWAR_GDOM.2.c:0 "Without two thirds it cannot pass. Let it fall."
 COLDWAR_GDOM.2.desc:0 "The Bundestag debates a direct election of the Federal President by the people. Critics fear a 'substitute emperor'; supporters a closer bond between citizens and the state.\n\nAn amendment to the Basic Law needs two thirds of the Bundestag and of the Bundesrat."
 COLDWAR_GDOM.2.t:0 "Direct Election of the Federal President"
 COLDWAR_GDOM.3.a:0 "The Nordstaat: Hamburg, Schleswig-Holstein and Lower Saxony together."
 COLDWAR_GDOM.3.b:0 "Only the small ones: the Saarland joins Rhineland-Palatinate."
 COLDWAR_GDOM.3.c:0 "The Länder have spoken. Leave the map as it is."
 COLDWAR_GDOM.3.desc:0 "The Ernst Commission's report lies on the table. Every option needs referendums in the Länder concerned - and the Bundesrat, where the Länder sit, must agree to its own abolition."
 COLDWAR_GDOM.3.t:0 "The Länder Reform"
 COLDWAR_GDOM.4.a:0 "We have the two thirds. Pass it."
 COLDWAR_GDOM.4.b:0 "Pay the opposition's price for its votes."
 COLDWAR_GDOM.4.b.tt:0 "The opposition votes with us - and takes the credit (§Y75§! political power, the largest opposition party §R+1%§!)."
 COLDWAR_GDOM.4.c:0 "Without two thirds it cannot pass. Let it fall."
 COLDWAR_GDOM.4.desc:0 "The coalition proposes to bind every use of the emergency laws to the Federal Constitutional Court and the Bundesrat.\n\nAn amendment to the Basic Law needs two thirds of the Bundestag and of the Bundesrat."
 COLDWAR_GDOM.4.t:0 "Tying the Emergency Constitution"
 COLDWAR_GDOM.5.a:0 "Pass it. Two parties are enough for Germany."
 COLDWAR_GDOM.5.b:0 "Withdraw it. The price is too high."
 COLDWAR_GDOM.5.desc:0 "The bill for a first-past-the-post system is before the Bundestag. The FDP calls it 'political murder', the small parties take to the streets, and the constitutional lawyers argue whether the Basic Law allows it at all."
 COLDWAR_GDOM.5.t:0 "The Majority Vote"
 COLDWAR_GDOM.6.a:0 "We have the two thirds. Pass it."
 COLDWAR_GDOM.6.b:0 "Pay the opposition's price for its votes."
 COLDWAR_GDOM.6.b.tt:0 "The opposition votes with us - and takes the credit (§Y75§! political power, the largest opposition party §R+1%§!)."
 COLDWAR_GDOM.6.c:0 "Without two thirds it cannot pass. Let it fall."
 COLDWAR_GDOM.6.desc:0 "The coalition wants to write the period solution into the Basic Law itself. The churches call for resistance.\n\nAn amendment to the Basic Law needs two thirds of the Bundestag and of the Bundesrat."
 COLDWAR_GDOM.6.t:0 "Overruling Karlsruhe"
 COLDWAR_GDOM.7.a:0 "We accept the ruling. An indications solution it is."
 COLDWAR_GDOM.7.b:0 "Amend the Basic Law to overrule the court."
 COLDWAR_GDOM.7.desc:0 "February 1975: the Federal Constitutional Court strikes down the period solution. The state has a duty to protect unborn life, the judges rule - two of them dissent sharply."
 COLDWAR_GDOM.7.t:0 "Karlsruhe on Paragraph 218"
 COLDWAR_GDOM.8.a:0 "The period solution."
 COLDWAR_GDOM.8.a.tt:0 "Bavaria and the Union will go to the §YConstitutional Court§!."
 COLDWAR_GDOM.8.b:0 "The indications solution."
 COLDWAR_GDOM.8.c:0 "Keep the old law."
 COLDWAR_GDOM.8.desc:0 "The Bundestag must choose between a period solution (no punishment in the first twelve weeks) and an indications solution (only for medical, ethical or social reasons). The churches, the women's movement and the Union all mobilise."
 COLDWAR_GDOM.8.t:0 "The Abortion Law"
 COLDWAR_GDOM.9.a:0 "A new census law with strict data protection."
 COLDWAR_GDOM.9.b:0 "Count them anyway - with fines for boycotters."
 COLDWAR_GDOM.9.desc:0 "December 1983: the Constitutional Court halts the census and invents a new basic right, 'informational self-determination'. The government must decide how to count its citizens - and how much to know about them."
 COLDWAR_GDOM.9.t:0 "The Census Boycott"
 COLDWAR_GDOM.90.a:0 "The people have spoken."
 COLDWAR_GDOM.90.desc:0 "The government's proposal wins the referendum. The opposition accepts the result - it has little choice."
 COLDWAR_GDOM.90.t:0 "The People Say Yes"
 COLDWAR_GDOM.91.a:0 "We accept the verdict."
 COLDWAR_GDOM.91.desc:0 "The referendum is lost. Commentators ask whether a chancellor who loses a vote on his own question can still govern."
 COLDWAR_GDOM.91.t:0 "The People Say No"
 COLDWAR_GER.1.a:0 "Dare more democracy."
 COLDWAR_GER.1.desc:0 "Twenty years after its founding the Federal Republic has, for the first time, a chancellor from the Social Democrats. Willy Brandt governs with Walter Scheel's Free Democrats and a majority of twelve seats - a majority that defections could erase in a single afternoon.\n\nIn the East stands a second German state that Bonn does not recognise. In the universities the revolt of 1968 is splitting into reform, sects and the first underground cells. And the economic miracle is slowing down."
 COLDWAR_GER.1.t:0 "The Social-Liberal Coalition"
 COLDWAR_GER.100.a:0 "ok"
 COLDWAR_GER.101.a:0 "Accept the resignations."
 COLDWAR_GER.101.b:0 "Sit it out."
 COLDWAR_GER.101.desc:0 "The Flick concern has paid millions to the parties through 'charitable' channels - and received tax relief on the sale of its Daimler shares. An accountant's notes say 'cultivating the political landscape'. The economics minister is indicted."
 COLDWAR_GER.101.t:0 "The Flick Affair"
 COLDWAR_GER.102.a:0 "Accept the resignations."
 COLDWAR_GER.102.b:0 "Sit it out."
 COLDWAR_GER.102.desc:0 "Lockheed is said to have paid bribes across the Western world to sell its aircraft - in Bonn, the name of the defence ministry of the Starfighter years keeps appearing."
 COLDWAR_GER.102.t:0 "The Lockheed Affair"
 COLDWAR_GER.103.a:0 "Accept the resignations."
 COLDWAR_GER.103.b:0 "Sit it out."
 COLDWAR_GER.103.desc:0 "A Land campaign has been run with a spy, a detective and an anonymous tax complaint against the opposition candidate. The minister-president gives his 'word of honour' - and is found dead in a Geneva hotel bathtub a few weeks later."
 COLDWAR_GER.103.t:0 "Waterkant Gate"
 COLDWAR_GER.104.a:0 "The unions must clean house."
 COLDWAR_GER.104.b:0 "A matter for the courts."
 COLDWAR_GER.104.desc:0 "The trade unions' housing company, the largest in Europe, has been run by managers who enriched themselves at the tenants' expense. The DGB's credibility is in tatters."
 COLDWAR_GER.104.t:0 "Neue Heimat"
 COLDWAR_GER.105.a:0 "Accept the resignations."
 COLDWAR_GER.105.b:0 "Sit it out."
 COLDWAR_GER.105.desc:0 "Cash in suitcases, accounts in Switzerland, donors whose names the former chancellor refuses to reveal because he has given his 'word of honour'. The party donations affair shakes the Union to its foundations."
 COLDWAR_GER.105.t:0 "Black Accounts"
 COLDWAR_GER.106.a:0 "Accept the resignations."
 COLDWAR_GER.106.b:0 "Sit it out."
 COLDWAR_GER.106.desc:0 "A minister's travel expenses, a state secretary's consultancy contracts, a party treasurer's memory gaps: Bonn has another affair. The magazines are delighted."
 COLDWAR_GER.106.t:0 "A Bonn Affair"
 COLDWAR_GER.110.a:0 "The road to the euro is open."
 COLDWAR_GER.110.b:0 "Europe stalls. The D-Mark remains."
 COLDWAR_GER.110.desc1:0 "Fifty-one percent. France has said yes to the Treaty on European Union by the narrowest margin. The single currency will come - and the Bundesbank's rules will come with it."
 COLDWAR_GER.110.desc2:0 "Non. French voters have rejected the Maastricht Treaty. Mitterrand's European project is in ruins; in Frankfurt, nobody is entirely unhappy."
 COLDWAR_GER.110.t:0 "France Votes on Maastricht"
 COLDWAR_GER.120.a:0 "Protest through the Western Allies."
 COLDWAR_GER.120.b:0 "Pay a higher transit lump sum."
 COLDWAR_GER.120.desc:0 "East German border guards hold up lorries for hours on the Helmstedt autobahn; a family is arrested for 'transit abuse'. The road to West Berlin is again a lever in someone else's hand."
 COLDWAR_GER.120.t:0 "Trouble on the Transit Routes"
 COLDWAR_GER.130.a:0 "Take them all in. They are Germans."
 COLDWAR_GER.130.b:0 "Quiet diplomacy. Do not destabilise the East."
 COLDWAR_GER.130.desc:0 "East Germans are leaving through every crack in the Iron Curtain: through Hungary, through the embassy in Prague, through the permanent mission in East Berlin. Reception camps in Gießen and Marienfelde overflow.\n\nGDR crisis index: §Y[?DDR.cwddr_crisis|0]§!"
 COLDWAR_GER.130.t:0 "The Exodus"
 COLDWAR_GER.131.a:0 "Sanctions against the regime."
 COLDWAR_GER.131.b:0 "Keep the channels open - for the prisoners' sake."
 COLDWAR_GER.131.desc:0 "The pictures smuggled out are blurred but unmistakable: armoured vehicles, water cannon, men with truncheons in front of the opera house. The GDR has chosen the Chinese solution."
 COLDWAR_GER.131.t:0 "Massacre in Leipzig"
 COLDWAR_GER.133.a:0 "'We are one people!'"
 COLDWAR_GER.133.b:0 "Step by step. Nobody must feel overrun."
 COLDWAR_GER.133.desc:0 "People dance on the Wall at the Brandenburg Gate. Trabants queue at the crossing points, West Berliners hand out bananas and champagne, strangers embrace. 'Now what belongs together will grow together,' says Willy Brandt."
 COLDWAR_GER.133.t:0 "The Wall Has Fallen"
 COLDWAR_GER.134.a:0 "A new era."
 COLDWAR_GER.134.desc:0 "The border between the two German states is open. The world watches crowds with hammers and chisels chip away at the most famous wall in the world."
 COLDWAR_GER.134.t:0 "The Berlin Wall Falls"
 COLDWAR_GER.135.a:0 "Accession under Article 23."
 COLDWAR_GER.135.b:0 "A constitution for all Germans (Article 146)."
 COLDWAR_GER.135.c:0 "A German confederation."
 COLDWAR_GER.135.d:0 "Unity in neutrality."
 COLDWAR_GER.135.desc:0 "The GDR has a freely elected government. Now the questions that were theoretical for forty years need answers within months: accession under Article 23 or a new constitution under Article 146? Unity inside NATO, or neutrality? Or two states under one roof?\n\nUnity momentum: §Y[?cwger_unity|0]§!"
 COLDWAR_GER.135.e:0 "Not yet."
 COLDWAR_GER.135.t:0 "The Road to German Unity"
 COLDWAR_GER.137.a:0 "Then a confederation."
 COLDWAR_GER.137.b:0 "We will try again."
 COLDWAR_GER.137.desc:0 "East Berlin will not simply accede. The new government wants negotiations between equals, a currency union on its own terms and protection for East German property."
 COLDWAR_GER.137.t:0 "The Volkskammer Says No"
 COLDWAR_GER.140.a:0 "Agree - for the price of the withdrawal."
 COLDWAR_GER.140.b:0 "Only a neutral Germany."
 COLDWAR_GER.140.c:0 "Nyet."
 COLDWAR_GER.140.desc:0 "The two German states have agreed on unity. Now the victors of 1945 must give up their rights over Germany as a whole. Washington wants a united Germany in NATO. Our generals want the GDR. Bonn offers money - a great deal of money.\n\nThe GDR's dependence on our guarantee: §Y[?DDR.cwddr_moscow_backing|0]§!"
 COLDWAR_GER.140.t:0 "Two Plus Four"
 COLDWAR_GER.141.a:0 "The 3rd of October will be German Unity Day."
 COLDWAR_GER.141.desc:0 "Moscow agrees. Germany will be united and fully sovereign, inside NATO, with an army of no more than 370,000, no nuclear, biological or chemical weapons, and the Oder-Neisse border for ever. The Soviet troops will leave by 1994 - and Bonn will pay for their new barracks."
 COLDWAR_GER.141.t:0 "The Treaty on the Final Settlement"
 COLDWAR_GER.142.a:0 "Accept. Unity matters more than the alliance."
 COLDWAR_GER.142.b:0 "A confederation instead."
 COLDWAR_GER.142.c:0 "Refuse and wait."
 COLDWAR_GER.142.desc:0 "The Soviet foreign minister's message is plain: a united Germany, yes - but outside the alliances, like Austria. Washington warns that neutrality would mean the end of NATO in Europe."
 COLDWAR_GER.142.t:0 "Moscow Demands Neutrality"
 COLDWAR_GER.143.a:0 "A confederation the Soviets can tolerate."
 COLDWAR_GER.143.b:0 "Wait for a better moment."
 COLDWAR_GER.143.desc:0 "The Soviet Union will not give up the GDR. Its troops stay, its veto stands. The Wall is open, but the border of the blocs runs on through Germany."
 COLDWAR_GER.143.t:0 "Moscow Says No"
 COLDWAR_GER.145.a:0 "The window is closing."
 COLDWAR_GER.145.desc:0 "Tanks in the streets of Moscow, a state of emergency, the general secretary 'unwell' at his dacha. The hardliners have taken power - and they have announced that the 'counter-revolution' in the GDR will not be allowed to stand."
 COLDWAR_GER.145.t:0 "Coup in Moscow"
 COLDWAR_GER.150.a:0 "A new Germany in Europe."
 COLDWAR_GER.150.desc:0 "At midnight the flag of the Federal Republic rises in front of the Reichstag. Germany, divided since 1945, is a single state again - and the largest country in Western Europe."
 COLDWAR_GER.150.t:0 "Germany Is United"
 COLDWAR_GER.19.a:0 "Count every vote."
 COLDWAR_GER.19.desc:0 "Deputies are leaving the coalition, or the arithmetic of the last election never quite worked. The opposition smells a constructive vote of no confidence. The whips have weeks, not months.\n\nGovernment §Y[?cwger_seats_gov|0]§! of §Y[?cwger_seats_total|0]§! seats, majority §Y[?cwger_majority|0]§!, defectors §Y[?cwger_defectors|0]§!."
 COLDWAR_GER.19.t:0 "The Majority Is Crumbling"
 COLDWAR_GER.20.a:0 "Fight for every vote."
 COLDWAR_GER.20.b:0 "Ask for confidence and lose it - let the voters decide."
 COLDWAR_GER.20.desc:0 "The opposition has tabled a motion under Article 67 of the Basic Law: it does not merely want to bring down the chancellor, it names a successor. The government's majority has melted to almost nothing. Whips count, recount and visit wavering deputies at home."
 COLDWAR_GER.20.t:0 "Constructive Vote of No Confidence"
 COLDWAR_GER.21.a:0 "A narrow escape."
 COLDWAR_GER.21.desc:0 "The opposition candidate falls two votes short. Bonn whispers that the votes were not all found by persuasion alone - years later it will turn out that the Ministry for State Security paid at least one deputy. For now, the government survives."
 COLDWAR_GER.21.t:0 "The Motion Fails"
 COLDWAR_GER.22.a:0 "The opposition takes over."
 COLDWAR_GER.22.desc:0 "The motion carries. Without an election, without a coalition agreement worth the name, the Federal Republic has a new head of government - the first time Article 67 has worked as its authors intended."
 COLDWAR_GER.22.t:0 "A New Chancellor"
 COLDWAR_GER.23.a:0 "To the voters."
 COLDWAR_GER.23.desc:0 "The chancellor has asked for the confidence of the house and, as arranged, not received it. The Federal President dissolves the Bundestag. The campaign begins at once."
 COLDWAR_GER.23.t:0 "The Bundestag Is Dissolved"
 COLDWAR_GER.24.a:0 "Keep the coalition the parties have agreed on."
 COLDWAR_GER.24.b:0 "A social-liberal coalition."
 COLDWAR_GER.24.c:0 "A Christian-liberal coalition."
 COLDWAR_GER.24.d:0 "A grand coalition under the Union."
 COLDWAR_GER.24.desc:0 "The votes are counted. In Bonn nobody governs alone: the parties above the five-percent hurdle sit down to divide ministries and principles. Who governs with whom depends on arithmetic - and on where the Free Democrats think their future lies.\n\nSeat shares: social-liberal §Y[?cwger_q_sl|%0]§!, Christian-liberal §Y[?cwger_q_cl|%0]§!, grand coalition §Y[?cwger_q_gc|%0]§!, red-green §Y[?cwger_q_rg|%0]§!."
 COLDWAR_GER.24.e:0 "A grand coalition under the SPD."
 COLDWAR_GER.24.f:0 "Red-green."
 COLDWAR_GER.24.t:0 "Coalition Talks"
 COLDWAR_GER.25.a:0 "The Länder have spoken."
 COLDWAR_GER.25.desc:0 "A state election turns into a referendum on Bonn. The federal government's parties lose ground, as governing parties usually do between Bundestag elections - and with it, perhaps, a vote in the Bundesrat."
 COLDWAR_GER.25.t:0 "Landtag Elections"
 COLDWAR_GER.26.a:0 "Let them go. We govern alone."
 COLDWAR_GER.26.b:0 "Concede on the budget."
 COLDWAR_GER.26.c:0 "The FDP switches sides."
 COLDWAR_GER.26.desc:0 "The economics minister has put his demands in writing: cuts to welfare, lower taxes on business, less state. The SPD calls it a divorce letter. The Free Democrats are looking across the aisle."
 COLDWAR_GER.26.t:0 "The Lambsdorff Paper"
 COLDWAR_GER.28.a:0 "The chancellor takes responsibility and resigns."
 COLDWAR_GER.28.b:0 "He stays. The spy was the security services' failure."
 COLDWAR_GER.28.desc:0 "Günter Guillaume, the chancellor's personal aide, has been arrested. He is an officer of the Ministry for State Security and has read everything that crossed the desk, including NATO papers on holiday in Norway. 'I am an officer of the National People's Army,' he tells the arresting officers."
 COLDWAR_GER.28.t:0 "The Spy in the Chancellery"
 COLDWAR_GER.29.a:0 "Good work, Cologne."
 COLDWAR_GER.29.desc:0 "Counter-intelligence has identified an aide in the Chancellery who receives coded radio messages from the East. He is quietly removed months before he could read anything that matters."
 COLDWAR_GER.29.t:0 "A Spy Caught Early"
 COLDWAR_GER.30.a:0 "Helmut Kohl leads the party."
 COLDWAR_GER.30.b:0 "Strauß is the strongest man the Union has."
 COLDWAR_GER.30.desc:0 "The Union has lost the 1972 election badly. Rainer Barzel resigns the chairmanship. The 43-year-old minister-president of Rhineland-Palatinate, Helmut Kohl, wants the party - but Franz Josef Strauß wants the candidacy."
 COLDWAR_GER.30.t:0 "A New Chairman for the CDU"
 COLDWAR_GER.31.a:0 "Strauß. The CSU gets its candidate."
 COLDWAR_GER.31.b:0 "Albrecht. The CDU decides."
 COLDWAR_GER.31.c:0 "Kohl runs himself."
 COLDWAR_GER.31.desc:0 "Who will be the Union's candidate for chancellor? The CDU's young modernisers favour Ernst Albrecht of Lower Saxony. The CSU will accept no one but Franz Josef Strauß. Kohl, the chairman, waits."
 COLDWAR_GER.31.t:0 "The K-Question"
 COLDWAR_GER.32.a:0 "Reconcile. The joint group is restored."
 COLDWAR_GER.32.b:0 "Let them go. A fourth party."
 COLDWAR_GER.32.desc:0 "After another lost election the CSU's deputies vote in Wildbad Kreuth to leave the joint parliamentary group. Strauß wants a fourth party that competes in every state. Kohl threatens to found a CDU branch in Bavaria."
 COLDWAR_GER.32.t:0 "Wildbad Kreuth"
 COLDWAR_GER.34.a:0 "Schmidt takes over."
 COLDWAR_GER.34.desc:0 "Willy Brandt has led the government through the treaties with the East. Tired, ill and increasingly isolated in his own party, he hands over to Helmut Schmidt, the manager the times seem to call for."
 COLDWAR_GER.34.t:0 "The Chancellor Hands Over"
 COLDWAR_GER.36.a:0 "Innovation and justice."
 COLDWAR_GER.36.desc:0 "Oskar Lafontaine chairs the party, but Gerhard Schröder wins Lower Saxony with an absolute majority. Lafontaine steps aside: the SPD's candidate for chancellor is the man who once rattled the gates of the Chancellery and shouted 'I want in there!'"
 COLDWAR_GER.36.t:0 "The Candidate from Lower Saxony"
 COLDWAR_GER.37.a:0 "Kohl fights back and dismisses Geißler."
 COLDWAR_GER.37.b:0 "Späth takes over."
 COLDWAR_GER.37.desc:0 "The Union is far behind in the polls. Heiner Geißler, Rita Süssmuth and Lothar Späth prepare to challenge Helmut Kohl at the Bremen party congress. Kohl has spent the summer on the telephone."
 COLDWAR_GER.37.t:0 "Bremen Party Congress"
 COLDWAR_GER.38.a:0 "He will return to the campaign."
 COLDWAR_GER.38.b:0 "Johannes Rau steps in as candidate."
 COLDWAR_GER.38.desc:0 "At a campaign event in Cologne-Mülheim a mentally ill woman stabs Oskar Lafontaine in the neck with a knife. He survives by millimetres."
 COLDWAR_GER.38.t:0 "Attack in Cologne"
 COLDWAR_GER.40.a:0 "The treaty stands, and so does the claim to unity."
 COLDWAR_GER.40.b:0 "Criticise Munich for the lawsuit."
 COLDWAR_GER.40.desc:0 "Bavaria has sued against the Basic Treaty. The Federal Constitutional Court upholds it - but declares that the German Reich continues to exist in law, that the Federal Republic is identical with it, and that the inner-German border is a border like that between Länder of the Federal Republic."
 COLDWAR_GER.40.t:0 "Karlsruhe Rules on the Basic Treaty"
 COLDWAR_GER.49.a:0 "The search goes on."
 COLDWAR_GER.49.desc:0 "Police have raided a conspiratorial flat and arrested members of an armed group. Weapons, forged passports and plans for further attacks were found.\n\nRAF prisoners: §Y[?cwger_raf_prisoners|0]§! | active cadre: §Y[?cwger_raf_cadre|0]§!"
 COLDWAR_GER.49.t:0 "Arrests in the Underground"
 COLDWAR_GER.50.a:0 "A high-security trial in Stammheim."
 COLDWAR_GER.50.b:0 "Ordinary prisons, ordinary courts."
 COLDWAR_GER.50.desc:0 "The founders of the Red Army Faction are in prison. Outside, a new generation recruited from the support committees has one goal above all others: to free them."
 COLDWAR_GER.50.t:0 "The Second Generation"
 COLDWAR_GER.51.a:0 "Find the perpetrators."
 COLDWAR_GER.51.b:0 "No panic. The state will not be provoked."
 COLDWAR_GER.51.desc1:0 "Bombs at a US Army headquarters, a police station and a publishing house. The 'May Offensive' of the Red Army Faction kills four people and injures dozens. A letter claims the attacks for the 'Commando Petra Schelm'."
 COLDWAR_GER.51.desc2:0 "An explosive device has gone off at a military installation used by the Americans. The commando's letter names the Federal Republic an 'outpost of US imperialism' and demands the release of the prisoners."
 COLDWAR_GER.51.t:0 "Bomb Attack"
 COLDWAR_GER.52.a:0 "A state funeral. The republic will not bow."
 COLDWAR_GER.52.b:0 "Give the crisis staff what it needs."
 COLDWAR_GER.52.desc1:0 "A motorcycle pulls alongside a car at a traffic light. The Federal Prosecutor General and his driver die in a burst of automatic fire. The RAF calls it an 'execution'."
 COLDWAR_GER.52.desc2:0 "A sophisticated bomb triggered by a light barrier has killed one of the country's leading managers on his way to work. The third generation of the RAF strikes rarely - and with terrible precision. Investigators find almost nothing."
 COLDWAR_GER.52.t:0 "Assassination"
 COLDWAR_GER.53.a:0 "Exchange the prisoners."
 COLDWAR_GER.53.b:0 "The state does not yield."
 COLDWAR_GER.53.desc:0 "A convoy has been ambushed, the escorts shot, a prominent figure dragged into a car. The kidnappers demand the release of imprisoned comrades and an aircraft to a country of their choosing. The government forms a crisis staff."
 COLDWAR_GER.53.t:0 "Kidnapping"
 COLDWAR_GER.54.a:0 "The crisis staff takes over."
 COLDWAR_GER.54.desc1:0 "A commando of the Popular Front for the Liberation of Palestine has hijacked a Lufthansa jet with 86 passengers to support the kidnappers' demands. The aircraft is hopping across the Mediterranean towards the Horn of Africa. The captain will be shot if the deadline passes."
 COLDWAR_GER.54.desc2:0 "The kidnappers have set a final deadline. Investigators believe they know the district where the hostage is held, but not the house."
 COLDWAR_GER.54.t:0 "The Ultimatum"
 COLDWAR_GER.55.a:0 "The state has proven itself."
 COLDWAR_GER.55.desc:0 "Shortly after midnight the commandos storm. Within minutes it is over: the hostages are free, the kidnappers dead or captured. 'Die Arbeit ist erledigt' - the job is done."
 COLDWAR_GER.55.t:0 "The Rescue"
 COLDWAR_GER.56.a:0 "The state could not yield."
 COLDWAR_GER.56.desc:0 "The body is found in the boot of a car. The commando's letter is three lines long. The crisis staff's strategy of firmness has cost a life, as everyone knew it might."
 COLDWAR_GER.56.t:0 "The Hostage Is Dead"
 COLDWAR_GER.57.a:0 "The official account stands."
 COLDWAR_GER.57.b:0 "An independent inquiry."
 COLDWAR_GER.57.desc:0 "The morning after, the leaders of the first generation are found dead or dying in their cells on the seventh floor of Stammheim prison. The authorities speak of suicide; the sympathisers of murder. The German Autumn is over - but it has changed the republic."
 COLDWAR_GER.57.t:0 "Death Night in Stammheim"
 COLDWAR_GER.58.a:0 "Rebuild the dragnet."
 COLDWAR_GER.58.b:0 "Offer a way out to those who want one."
 COLDWAR_GER.58.desc:0 "Nobody knows who they are. They leave no fingerprints, use no flats the police know, and strike the representatives of what they call the 'military-industrial complex'. The RAF has become a phantom."
 COLDWAR_GER.58.t:0 "The Third Generation"
 COLDWAR_GER.59.a:0 "Force-feeding. The law will be enforced."
 COLDWAR_GER.59.b:0 "Small concessions: shared yards, visits."
 COLDWAR_GER.59.desc:0 "The prisoners demand to be held together as prisoners of war. They refuse food. Holger Meins weighed 39 kilos when he died in 1974. Each day of the strike brings new sympathisers onto the streets."
 COLDWAR_GER.59.t:0 "Hunger Strike"
 COLDWAR_GER.60.a:0 "History will judge them."
 COLDWAR_GER.60.desc:0 "A typed letter of eight pages arrives at Reuters: 'Almost 28 years ago, on 14 May 1970, the RAF was born in a liberation action. Today we end this project.' The Red Army Faction is history."
 COLDWAR_GER.60.t:0 "The RAF Dissolves"
 COLDWAR_GER.61.a:0 "A catastrophe for the security services."
 COLDWAR_GER.61.desc:0 "An operation at a railway station in Mecklenburg was supposed to arrest two RAF members betrayed by an informant. A GSG 9 officer and a suspect are dead. Witnesses say the suspect was executed on the tracks. The Interior Minister and the Federal Prosecutor resign."
 COLDWAR_GER.61.t:0 "Bad Kleinen"
 COLDWAR_GER.62.a:0 "Ban the organisations behind it."
 COLDWAR_GER.62.b:0 "The work of isolated individuals."
 COLDWAR_GER.62.desc1:0 "A pipe bomb in a crowd. The perpetrator was a member of a 'military sports group' that trained in the woods with Wehrmacht surplus while the authorities spoke of hobbyists."
 COLDWAR_GER.62.desc2:0 "Petrol bombs through the window of a house where Turkish families live. Three dead, among them children. In other towns crowds applaud as hostels for asylum seekers burn."
 COLDWAR_GER.62.t:0 "Right-Wing Terror"
 COLDWAR_GER.65.a:0 "Hunt down the network."
 COLDWAR_GER.65.b:0 "Quiet diplomacy with the sponsors."
 COLDWAR_GER.65.desc1:0 "Palestinian and international commandos use West German soil as a battlefield: an attack at an airport, a bomb in a Jewish community centre. The trail leads to Beirut, Baghdad and Damascus."
 COLDWAR_GER.65.desc2:0 "A bomb in a Berlin discotheque frequented by American soldiers. Intercepted cables from the Libyan People's Bureau in East Berlin speak of a 'joyful event'."
 COLDWAR_GER.65.desc3:0 "PKK militants occupy consulates and set fire to Turkish businesses across the country. Ankara demands a ban."
 COLDWAR_GER.65.t:0 "International Terrorism"
 COLDWAR_GER.66.a:0 "This must never happen again."
 COLDWAR_GER.66.desc:0 "Members of Black September have broken into the Israeli team's quarters in the Olympic Village. Two athletes are dead, nine are hostages. The night ends at Fürstenfeldbruck airfield with all nine hostages dead after a botched rescue by Bavarian police with no special training and no radios.\n\n'The Games must go on,' says Avery Brundage."
 COLDWAR_GER.66.t:0 "Massacre in Munich"
 COLDWAR_GER.67.a:0 "Security planning paid off."
 COLDWAR_GER.67.desc:0 "Plain-clothes officers in the Olympic Village notice men in tracksuits climbing the fence at four in the morning. The attack on the Israeli team is stopped before it begins."
 COLDWAR_GER.67.t:0 "A Plot Foiled"
 COLDWAR_GER.70.a:0 "ok"
 COLDWAR_GER.71.a:0 "A quiet trial and a quiet exchange later."
 COLDWAR_GER.71.b:0 "A public trial. Everyone should know."
 COLDWAR_GER.71.desc:0 "The Federal Office for the Protection of the Constitution has arrested an official who has passed files to the Ministry for State Security for years. The radio messages, the microdots, the dead drops on the Rhine promenade - all in the arrest report."
 COLDWAR_GER.71.t:0 "A Mole Unmasked"
 COLDWAR_GER.72.a:0 "Damage control in Brussels."
 COLDWAR_GER.72.b:0 "Blame the previous government."
 COLDWAR_GER.72.desc:0 "Material from the defence ministry has turned up in the files of the Warsaw Pact: deployment plans, codes, the timetable of the next exercise. Somewhere in Bonn sits a source the services have not found."
 COLDWAR_GER.72.t:0 "NATO Plans in East Berlin"
 COLDWAR_GER.73.a:0 "Tighten the security vetting of staff."
 COLDWAR_GER.73.b:0 "Let the courts handle it."
 COLDWAR_GER.73.desc:0 "A secretary in the Foreign Office has fallen in love with a charming man from Düsseldorf who turns out to be a captain of the HVA. Her lover has vanished; the magazines have the pictures."
 COLDWAR_GER.73.t:0 "The Romeo Affair"
 COLDWAR_GER.74.a:0 "Roll up the network."
 COLDWAR_GER.74.b:0 "Keep him secret and feed the HVA false trails."
 COLDWAR_GER.74.desc:0 "An officer of the GDR's foreign intelligence has walked into a West German police station with two suitcases of files. Dozens of agents in the Federal Republic have names now."
 COLDWAR_GER.74.t:0 "A Defector from the HVA"
 COLDWAR_GER.75.a:0 "ok"
 COLDWAR_GER.76.a:0 "The interior minister resigns."
 COLDWAR_GER.76.b:0 "Security comes first."
 COLDWAR_GER.76.desc:0 "Der Spiegel reveals that the Office for the Protection of the Constitution broke into the flat of a nuclear scientist and bugged it - without a warrant, on the minister's say-so, because he once met a man who knew a terrorist."
 COLDWAR_GER.76.t:0 "The Traube Affair"
 COLDWAR_GER.77.a:0 "A parliamentary inquiry."
 COLDWAR_GER.77.b:0 "National security - no comment."
 COLDWAR_GER.77.desc:0 "Eight years ago the secret service blew a hole in the wall of Celle prison and blamed the RAF - to smuggle an informant into the scene. Now a reporter has the files."
 COLDWAR_GER.77.t:0 "The Celle Hole"
 COLDWAR_GER.78.a:0 "Accept the resignation and rehabilitate the general."
 COLDWAR_GER.78.b:0 "Keep the minister."
 COLDWAR_GER.78.desc:0 "The Military Counter-Intelligence Service has driven a four-star general out of office on the strength of rumours from a Cologne bar. The rumours were false. The defence minister offers to resign."
 COLDWAR_GER.78.t:0 "The Kießling Affair"
 COLDWAR_GER.79.a:0 "Reassure the allies."
 COLDWAR_GER.79.b:0 "Equidistance between the blocs."
 COLDWAR_GER.79.desc:0 "Washington asks whether the Federal Republic is still an ally. Paris worries about a German Rapallo. In Moscow, analysts write that Bonn can be pried loose from the West.\n\nWestern integration: §Y[?cwger_westbindung|0]§!"
 COLDWAR_GER.79.t:0 "Is Bonn Drifting?"
 COLDWAR_GER.80.a:0 "Car-free Sundays and a speed limit."
 COLDWAR_GER.80.b:0 "An energy programme: coal and nuclear."
 COLDWAR_GER.80.c:0 "Let prices do the work."
 COLDWAR_GER.80.desc:0 "The Arab oil producers have cut their output and the price of crude has quadrupled. The Federal Republic imports almost all of its oil. The government orders car-free Sundays; children ride their bicycles down the empty Autobahn."
 COLDWAR_GER.80.t:0 "The Oil Shock"
 COLDWAR_GER.81.a:0 "Austerity."
 COLDWAR_GER.81.b:0 "A stimulus programme."
 COLDWAR_GER.81.desc:0 "Revolution in Iran, war between Iran and Iraq: the oil price doubles again. Unemployment passes one million for the first time since the fifties, and the deficit grows."
 COLDWAR_GER.81.t:0 "The Second Oil Shock"
 COLDWAR_GER.82.a:0 "Mediate: 38.5 hours, flexibly arranged."
 COLDWAR_GER.82.b:0 "Support the lockouts."
 COLDWAR_GER.82.desc:0 "IG Metall has called the biggest industrial action in the Federal Republic's history. The employers answer with lockouts. 'Work for all, shorter hours' against 'the German model is being destroyed'."
 COLDWAR_GER.82.t:0 "Strike for the 35-Hour Week"
 COLDWAR_GER.84.a:0 "Subsidise the steel works."
 COLDWAR_GER.84.b:0 "Restructure the Ruhr."
 COLDWAR_GER.84.desc:0 "Asian competition and overcapacity hit the Ruhr. Krupp wants to close Rheinhausen; workers occupy the Rhine bridge."
 COLDWAR_GER.84.t:0 "The Steel Crisis"
 COLDWAR_GER.85.a:0 "Accept the independence of the Bundesbank."
 COLDWAR_GER.85.b:0 "A public quarrel with Frankfurt."
 COLDWAR_GER.85.desc:0 "The Central Bank Council in Frankfurt has raised the discount rate against the express wishes of the government. Inflation, says the Bundesbank president, is the most unsocial tax of all."
 COLDWAR_GER.85.t:0 "The Bundesbank Says No"
 COLDWAR_GER.86.a:0 "Deliver anyway. Treaties are kept."
 COLDWAR_GER.86.b:0 "Bow to Washington."
 COLDWAR_GER.86.desc:0 "Washington has banned American firms and their licensees from supplying the Siberian gas pipeline. AEG, Mannesmann and their subcontractors face sanctions in the United States if they deliver the turbines Bonn has promised Moscow."
 COLDWAR_GER.86.t:0 "The Pipeline Embargo"
 COLDWAR_GER.90.a:0 "Dialogue with the movement."
 COLDWAR_GER.90.b:0 "Security policy is not made on the street."
 COLDWAR_GER.90.desc:0 "Three hundred thousand people fill the Bonn Hofgarten against the stationing of new American missiles. Heinrich Böll speaks, Petra Kelly speaks, so do SPD deputies. The chancellor's own party is marching against his policy."
 COLDWAR_GER.90.t:0 "The Hofgarten Demonstration"
 COLDWAR_GER.91.a:0 "Clear the site."
 COLDWAR_GER.91.b:0 "Halt construction until the courts decide."
 COLDWAR_GER.91.desc:0 "Tens of thousands march to the planned reactor site on the Elbe. Water cannon, helicopters, barbed wire. A 'civil war around a building site', the newspapers write."
 COLDWAR_GER.91.t:0 "Brokdorf"
 COLDWAR_GER.92.a:0 "Open the line to Moscow."
 COLDWAR_GER.92.b:0 "Stand firm with the alliance."
 COLDWAR_GER.92.desc:0 "A NATO command exercise has been followed by alarming Soviet reactions: aircraft on alert in East Germany, intelligence officers ordered to look for signs of a surprise attack. In Bonn the cabinet meets at night."
 COLDWAR_GER.92.t:0 "War Scare"
 COLDWAR_GER.93.a:0 "A new force in German politics."
 COLDWAR_GER.93.desc:0 "In Karlsruhe, environmentalists, pacifists, feminists, former Maoists and a few conservatives found a federal party: 'Die Grünen'. 'We are neither left nor right, we are in front.'"
 COLDWAR_GER.93.t:0 "The Greens Are Founded"
 COLDWAR_GER.94.a:0 "A new party on the right."
 COLDWAR_GER.94.desc:0 "Two CSU deputies, disgusted by the billion-mark credit for the GDR, found a party to the right of the Union. Franz Schönhuber, a former Waffen-SS man and television presenter, soon takes it over."
 COLDWAR_GER.94.t:0 "Die Republikaner"
 COLDWAR_GER.95.a:0 "Seek an asylum compromise."
 COLDWAR_GER.95.b:0 "Article 16 is not negotiable."
 COLDWAR_GER.95.desc:0 "More than four hundred thousand people apply for asylum in a single year - from Yugoslavia, Romania, Turkey and Africa. Municipalities run out of beds; tabloids run out of restraint. The right to asylum in Article 16 is unconditional - for now."
 COLDWAR_GER.95.t:0 "The Asylum Debate"
 COLDWAR_GER.96.a:0 "Create an environment ministry."
 COLDWAR_GER.96.b:0 "German reactors are safe."
 COLDWAR_GER.96.desc:0 "A reactor has exploded in the Ukraine. A radioactive cloud drifts over Bavaria; children are kept out of sandpits, lettuce is ploughed under, and the government takes days to give clear advice."
 COLDWAR_GER.96.t:0 "Chernobyl"
 COLDWAR_GER.97.a:0 "Filters for every power plant."
 COLDWAR_GER.97.b:0 "More research is needed."
 COLDWAR_GER.97.desc:0 "The forests are dying, says Der Spiegel: acid rain from coal power plants has damaged a third of the trees. The fear unites conservationists and conservative foresters."
 COLDWAR_GER.97.t:0 "Forest Dieback"
 COLDWAR_GER.98.a:0 "The Realos carry the vote."
 COLDWAR_GER.98.b:0 "The party leaves the coalition."
 COLDWAR_GER.98.desc:0 "The Greens' special congress on the Kosovo war. Outside, protesters scream 'warmonger'; inside, a paint bomb bursts the foreign minister's eardrum. Bleeding, he speaks anyway: 'Never again war - but also never again Auschwitz.'"
 COLDWAR_GER.98.t:0 "Bielefeld"
 COLDWAR_GER_1970_africa_development:0 "Development Partnerships"
 COLDWAR_GER_1970_africa_development_desc:0 "Wells in Mali, roads in Kenya, vocational schools in Togo, a hospital in Tanzania: German development partnerships span the continent. They are also part of a competition. In Mozambique, Angola and Ethiopia, the GDR's advisers train the police, the party and the secret service. In Africa, the inner-German conflict is fought with tractors and teachers."
 COLDWAR_GER_1970_after_rostock:0 "After Rostock and Solingen"
 COLDWAR_GER_1970_after_rostock_desc:0 "Rostock-Lichtenhagen, Mölln, Solingen: hostels set on fire while neighbours applaud, Turkish families burned to death in their homes. Hundreds of thousands form candle chains in every city, the government bans one neo-Nazi organisation after another, and the Republic slowly admits that its state looked away for too long. The candles are a beginning, not an answer."
 COLDWAR_GER_1970_agenda_reform:0 "Standort Deutschland"
 COLDWAR_GER_1970_agenda_reform_desc:0 "High wages, high taxes, high social contributions and four million unemployed: in the 1990s the debate about Standort Deutschland - Germany as a place to do business - dominates every talk show. Companies threaten to move to Hungary or Alabama. The government must decide how much of the old Modell Deutschland it is willing to sacrifice to keep them."
 COLDWAR_GER_1970_agenda_renewal:0 "An Agenda for Renewal"
 COLDWAR_GER_1970_agenda_renewal_desc:0 "Unemployment benefit cut to one year, the trades opened, the job centres reformed from top to bottom: the hardest cuts to the welfare state the Federal Republic has ever seen - made by a Social Democrat. The economy will thank him in ten years. His party may not wait that long."
 COLDWAR_GER_1970_airbus:0 "Airbus and Ariane"
 COLDWAR_GER_1970_airbus_desc:0 "European champions where national ones failed: in Toulouse and Hamburg, the Airbus consortium builds airliners to challenge Boeing; in Kourou, in French Guiana, Ariane rockets launch European satellites. Germany pays a large share and gets a large share of the work. The rest of the world calls it subsidy. Europe calls it sovereignty."
 COLDWAR_GER_1970_alliance_for_jobs:0 "The Alliance for Jobs"
 COLDWAR_GER_1970_alliance_for_jobs_desc:0 "Unions, employers and the government around one table in the chancellery, as in the days of Concerted Action: wage restraint in exchange for training places, early retirement in exchange for new hiring. Everybody comes. Whether anybody gives is another matter."
 COLDWAR_GER_1970_apartheid_sanctions:0 "Sanctions against Apartheid"
 COLDWAR_GER_1970_apartheid_sanctions_desc:0 "Soweto, the state of emergency, the townships burning on the evening news: Bonn joins the European Community's sanctions against South Africa. No new investment, no iron and steel, no Krugerrands, no cooperation in nuclear matters. German companies have billions invested in the country. The government decides that some business is not worth having."
 COLDWAR_GER_1970_arms_export_guidelines:0 "Arms Export Guidelines"
 COLDWAR_GER_1970_arms_export_guidelines_desc:0 "No weapons into areas of tension: the guidelines of 1971 are strict - in principle. In practice every chancellor makes exceptions, for friends, for jobs, for strategic partners, and the exports quietly continue through licences, subsidiaries and partners abroad. The guidelines are a statement of conscience. Whether they are anything more depends on the government."
 COLDWAR_GER_1970_army_of_unity:0 "Army of Unity"
 COLDWAR_GER_1970_army_of_unity_desc:0 "The Bundeswehr takes over the National People's Army - an army trained for decades to fight it. The MiG-29 fighters are kept, the ships are sold, the tanks scrapped, and most of the officers dismissed. A few thousand East German soldiers are taken into the army of unity. For them, the citizen in uniform is a new idea; for the Bundeswehr, so are they."
 COLDWAR_GER_1970_army_structure_3:0 "Army Structure 3"
 COLDWAR_GER_1970_army_structure_3_desc:0 "Army Structure 3 reorganises the field army into thirty-three brigades in twelve divisions, every one of them assigned to NATO's command in war. More armour, more mechanised infantry, more mobility: the Bundeswehr is to be able to meet the Warsaw Pact's tank armies at the border rather than retreat to the Rhine."
 COLDWAR_GER_1970_army_structure_4:0 "Army Structure 4"
 COLDWAR_GER_1970_army_structure_4_desc:0 "Thirty-six brigades, smaller but heavier, with more tanks and fewer men in each, and territorial forces of reservists to defend the rear. Army Structure 4 is designed for a Warsaw Pact attack with little warning. It is also designed for a demographic problem that the planners already see coming: there will soon not be enough young men."
 COLDWAR_GER_1970_army_structure_5:0 "Army Structure 5"
 COLDWAR_GER_1970_army_structure_5_desc:0 "370,000 soldiers for the whole of Germany, as promised to Gorbachev in the Caucasus and written into the Two Plus Four Treaty. Fewer tanks, fewer divisions, and new crisis reaction forces for a world in which the threat no longer stands at the inner-German border. The Bundeswehr shrinks and changes its mission in the same decade. It is not sure what the mission is."
 COLDWAR_GER_1970_art146_debate:0 "A New Constitution?"
 COLDWAR_GER_1970_art146_debate_desc:0 "Article 146: the Basic Law shall cease to apply on the day on which a constitution freely adopted by the German people comes into force. The fathers of the Basic Law meant it for the day of unity. Draft a new constitution together, say the civil rights movements of the East and the left of the West. Join the Basic Law under Article 23, say Kohl and the Union - quickly, before the window closes."
 COLDWAR_GER_1970_arte_channel:0 "A Channel for Europe"
 COLDWAR_GER_1970_arte_channel_desc:0 "Kohl and Mitterrand agree on a television channel that belongs to neither nation: films without dubbing, documentaries at prime time, an evening programme for perhaps two per cent of the audience - and the conviction that two per cent of two nations is a beginning."
 COLDWAR_GER_1970_asean_partners:0 "Partners in Southeast Asia"
 COLDWAR_GER_1970_asean_partners_desc:0 "Five nations between Burma and the Philippines have formed a community to stand together against the Vietnamese advance and for their own prosperity. In 1980 the European Community signs a cooperation agreement with them - and German engineers follow the diplomats."
 COLDWAR_GER_1970_asylum_compromise:0 "The Asylum Compromise"
 COLDWAR_GER_1970_asylum_compromise_desc:0 "Four hundred thousand asylum seekers in one year, hostels burning in Rostock and Hoyerswerda, a state that seems overwhelmed. Government and opposition agree to rewrite Article 16 of the Basic Law: the right to asylum remains, but whoever arrives through a safe third country or comes from a safe country of origin can be turned away. A compromise that some call necessary and others the end of a promise."
 COLDWAR_GER_1970_atlantic_anchor:0 "The Atlantic Anchor"
 COLDWAR_GER_1970_atlantic_anchor_desc:0 "Two hundred thousand American soldiers in Bavaria, Hesse and Baden-Württemberg, the British Army of the Rhine in Westphalia, the French in Baden, Belgians, Dutch and Canadians in between: the Federal Republic lives under the protection of half the Western world. It is the Republic's life insurance - and a constant reminder that its security is decided in Washington, not in Bonn."
 COLDWAR_GER_1970_atlantic_declaration:0 "The Atlantic Declaration"
 COLDWAR_GER_1970_atlantic_declaration_desc:0 "Ottawa, June 1974: after a year of quarrels over Kissinger's 'Year of Europe', the NATO governments write down what binds them together. Bonn wants the Americans to promise to stay in Europe; Washington wants the Europeans to promise to pay and to consult. Both get a paragraph. Whether they get what the paragraph promises is another question."
 COLDWAR_GER_1970_atomkonsens:0 "The Nuclear Consensus"
 COLDWAR_GER_1970_atomkonsens_desc:0 "A negotiated exit rather than a fight: every reactor is allotted a remaining quantity of electricity it may still produce, and none will get a successor. The utilities sign because the alternative is worse; the Greens sign because it is better than nothing. The last German reactor will be switched off in about twenty years. The anti-nuclear movement calls it far too slow."
 COLDWAR_GER_1970_aufbau_ost:0 "Aufbau Ost"
 COLDWAR_GER_1970_aufbau_ost_desc:0 "Motorways and telephone lines, universities and hospitals, rebuilt city centres in Görlitz, Weimar and Stralsund: the reconstruction of the East becomes the largest transfer of wealth in German history - more than a trillion marks within a decade. Some of it builds the future. Some of it builds empty industrial parks in fields of rapeseed."
 COLDWAR_GER_1970_austerity_1975:0 "The Budget Structure Act"
 COLDWAR_GER_1970_austerity_1975_desc:0 "Hold the line. The Budget Structure Act cuts subsidies, freezes posts in the civil service and trims the social budget, so that the state lives within its means and the Bundesbank can do its work. The economists in Frankfurt approve. The unemployed, whose number is still rising, are less impressed."
 COLDWAR_GER_1970_bafoeg:0 "BAföG"
 COLDWAR_GER_1970_bafoeg_desc:0 "Barely one student in twenty is the child of a worker. The Federal Training Assistance Act changes the arithmetic: grants for anyone whose parents cannot pay, a university system opened to the whole nation and a pool of engineers, teachers and doctors that the economy badly needs. The universities will be overcrowded within a decade - which is, in a sense, the point."
 COLDWAR_GER_1970_bahr_paper:0 "The Bahr Paper"
 COLDWAR_GER_1970_bahr_paper_desc:0 "Ten points, written in Moscow in the spring of 1970 by a state secretary who negotiated with Andrei Gromyko as if he were foreign minister: the renunciation of force, the inviolability of the borders, the sequence of treaties to come. The paper was meant to remain secret. Leaked to the Bild-Zeitung, it becomes the programme - and the opposition's favourite target."
 COLDWAR_GER_1970_baltic_navy:0 "A Baltic Navy"
 COLDWAR_GER_1970_baltic_navy_desc:0 "In a war, the Warsaw Pact's fleets would try to break out of the Baltic through the Danish straits. The Bundesmarine's fast attack craft, its small Type 206 submarines and its naval aviation are to stop them in the narrow waters off Fehmarn and Kiel. It is not a glamorous navy - no carriers, no cruisers - but in its waters it is the strongest in the West."
 COLDWAR_GER_1970_ban_pkk:0 "Ban the PKK"
 COLDWAR_GER_1970_ban_pkk_desc:0 "Arson attacks on Turkish banks and travel agencies, the occupation of consulates, blockades of the motorways: the Kurdish conflict has come to Germany with the hundreds of thousands of Kurds who live here. In November 1993 the federal government bans the PKK. Ankara is grateful. Many Kurds in Germany feel that their cause has been criminalised along with the violence."
 COLDWAR_GER_1970_ban_wsg:0 "Ban the Wehrsportgruppe"
 COLDWAR_GER_1970_ban_wsg_desc:0 "Karl-Heinz Hoffmann's Wehrsportgruppe trains in uniform in the Franconian woods with old army vehicles and weapons of uncertain origin, and Bavaria's interior ministry has long regarded it as a harmless collection of eccentrics. The federal interior minister disagrees. Banning it sends a signal - and drives some of its members into a darker underground."
 COLDWAR_GER_1970_barzel_cabinet:0 "Chancellor Barzel"
 COLDWAR_GER_1970_barzel_cabinet_desc:0 "Two votes - perhaps bought, nobody will ever know - have made Rainer Barzel chancellor. He must govern with a handful of defectors from the SPD and FDP, a Bundestag that is evenly split and a country that is not sure whether it has seen a change of government or a coup by procedure. The first months will decide whether Chancellor Barzel is an episode or an era."
 COLDWAR_GER_1970_barzel_eastern_treaties:0 "The Treaties with Reservations"
 COLDWAR_GER_1970_barzel_eastern_treaties_desc:0 "Chancellor Barzel will not tear up Brandt's treaties with Moscow and Warsaw; the damage to Bonn's reputation would be too great. But he will put them into force only together with a Bundestag resolution that keeps the German question open and the claim to unity alive. The East grumbles. The treaties stand."
 COLDWAR_GER_1970_barzel_europe:0 "Barzel's Europe"
 COLDWAR_GER_1970_barzel_europe_desc:0 "Barzel's alternative to Brandt's Ostpolitik is a political union of Western Europe: a Community with a common foreign policy, a European parliament with real powers and a framework in which the German question can one day be answered without frightening Germany's neighbours. Paris listens with interest. London, not yet a member, listens with suspicion."
 COLDWAR_GER_1970_barzel_majority:0 "The Fight for the Majority"
 COLDWAR_GER_1970_barzel_majority_desc:0 "Barzel governs with a handful of defectors from the SPD and FDP, men whom their former parties call traitors and whom his own party does not quite trust. Every vote in the Bundestag could be the last. The chancellor spends his evenings on the telephone and his nights counting heads."
 COLDWAR_GER_1970_barzel_property:0 "Property for Workers"
 COLDWAR_GER_1970_barzel_property_desc:0 "Every employee a small capitalist: savings premiums, employee shares in the company, the 'investment wage' that the Union's Christian labour wing has wanted since the 1950s. Property for the many, says the chancellor, is the best answer to the socialists. The unions suspect a plan to buy off their members."
 COLDWAR_GER_1970_barzel_social_market:0 "Social Market, Not Reform State"
 COLDWAR_GER_1970_barzel_social_market_desc:0 "The new government stops the expensive reform projects of the social-liberal years and promises to keep the pension promises - no more, no less. The social market economy, says the chancellor, needs consolidation rather than experiments. The unions sense that the times are changing; the employers hope they are right."
 COLDWAR_GER_1970_barzel_west_first:0 "West First"
 COLDWAR_GER_1970_barzel_west_first_desc:0 "Barzel's Ostpolitik is the same as Brandt's in many respects - but in the reverse order: Washington's blessing first, then Moscow; a written reservation on German unity first, then signatures. The East calls it revanchism with better manners; the Americans are pleased to be asked; the expellees think the chancellor has not gone far enough."
 COLDWAR_GER_1970_basic_treaty:0 "The Basic Treaty"
 COLDWAR_GER_1970_basic_treaty_desc:0 "December 1972: the Basic Treaty between the two German states. Good-neighbourly relations, permanent representations instead of embassies, cooperation in trade, transport and culture - and a formula on which both sides can agree because each reads it differently: two states in one German nation. Bavaria takes it to the Constitutional Court. The court lets it stand, with conditions."
 COLDWAR_GER_1970_baum_liberal_interior:0 "A Liberal Interior Ministry"
 COLDWAR_GER_1970_baum_liberal_interior_desc:0 "Gerhart Baum is the first interior minister to see the security services as a danger to be controlled as much as an instrument to be used. Data protection, limits on the BKA's computers, the end of routine vetting for applicants to the civil service: the liberal answer to the German Autumn. The police unions are not convinced."
 COLDWAR_GER_1970_berlin_2000:0 "Berlin 2000"
 COLDWAR_GER_1970_berlin_2000_desc:0 "The divided city is whole again, and Berlin wants the Olympic Games of the year 2000 to prove it. The bid has a budget, a stadium built in 1936 and a resistance movement of its own: 'NOlympia' sets fire to department stores and sends threatening letters to IOC members."
 COLDWAR_GER_1970_berlin_capital:0 "Berlin, Capital"
 COLDWAR_GER_1970_berlin_capital_desc:0 "June 1991, the Bundestag in the old waterworks in Bonn. After eleven hours of debate, 338 to 320 members vote to move parliament and government to Berlin. For the Rhineland it is a shock; for the East, a promise. The move will take eight years, cost billions and change the character of the Republic - from the Bonn Republic to the Berlin Republic."
 COLDWAR_GER_1970_berlin_mandate:0 "The Berlin Mandate"
 COLDWAR_GER_1970_berlin_mandate_desc:0 "The first conference of the parties to the climate convention meets in Berlin in the spring of 1995. The young environment minister in the chair negotiates through the night until the delegates agree to negotiate binding targets - the road that will lead to Kyoto."
 COLDWAR_GER_1970_berlin_pledge:0 "Berlin, Capital of Germany"
 COLDWAR_GER_1970_berlin_pledge_desc:0 "Bonn was always meant to be provisional - a 'federal village' on the Rhine until the day of unity. A pledge that a united Germany will govern from Berlin wins hearts in the East, where the old capital stands for the whole nation. It loses some on the Rhine, where the civil servants have built their houses and the Rhineland has grown fond of its republic."
 COLDWAR_GER_1970_bielefeld_congress:0 "Bielefeld, 1999"
 COLDWAR_GER_1970_bielefeld_congress_desc:0 "Bielefeld, May 1999. A paint bomb hits the Green foreign minister's ear. NATO is bombing Serbia, and the Bundeswehr is taking part in its first combat mission - with the approval of a red-green government. The party of peace must decide whether a Green may send the Luftwaffe to war. 'Never again war', say the delegates. 'Never again Auschwitz', answers the minister."
 COLDWAR_GER_1970_billion_credit:0 "The Billion-Mark Credit"
 COLDWAR_GER_1970_billion_credit_desc:0 "July 1983: Franz Josef Strauß, of all people, arranges a state-guaranteed loan of a billion marks for a GDR that is on the brink of insolvency. Honecker's regime is saved from bankruptcy. In return the automatic firing devices on the border are dismantled and the controls on transit routes are eased. The CSU's base is appalled. The border becomes a little less deadly."
 COLDWAR_GER_1970_bitburg:0 "Bitburg"
 COLDWAR_GER_1970_bitburg_desc:0 "Forty years after the end of the war, the chancellor invites the American president to a military cemetery in Bitburg as a gesture of reconciliation. Then it emerges that members of the Waffen-SS are buried there. Washington is in uproar, veterans protest, and the chancellor refuses to change the programme. At home, a surprising number of Germans are on his side."
 COLDWAR_GER_1970_bka_expansion:0 "Expand the BKA"
 COLDWAR_GER_1970_bka_expansion_desc:0 "Horst Herold arrives at the Federal Criminal Police Office in Wiesbaden with a vision: police work as science, crime as data to be analysed, prevention rather than reaction. His budget multiplies, his staff triples, and the first mainframe computers are carried into the BKA's basements. The Bundestag gives him almost everything he asks for. Few ask what he will do with it."
 COLDWAR_GER_1970_black_accounts:0 "Black Accounts"
 COLDWAR_GER_1970_black_accounts_desc:0 "Cash in suitcases, accounts in Liechtenstein and Switzerland, 'Jewish legacies' that turn out never to have existed. The former chancellor admits that he accepted millions in secret donations - and refuses to name the donors, because he gave them his word of honour. The party that ruled for sixteen years confronts the question of what it is built on."
 COLDWAR_GER_1970_bomb_bonus:0 "German bomb programme"
 COLDWAR_GER_1970_bonn_declaration_1989:0 "The Bonn Declaration"
 COLDWAR_GER_1970_bonn_declaration_1989_desc:0 "June 1989: Mikhail Gorbachev in Bonn, crowds on the market square chanting 'Gorbi! Gorbi!' as if he were a pop star. The joint declaration recognises the right of every people to choose its own political system. The Soviet leader means Poland and Hungary. In East Berlin, the Politburo reads the same sentence with growing alarm."
 COLDWAR_GER_1970_bonn_politics_category:0 "Bonn Politics"
 COLDWAR_GER_1970_bonn_politics_category_desc:0 "Bundestag: government §Y[?cwger_seats_gov|0]§! of §Y[?cwger_seats_total|0]§! seats (majority §Y[?cwger_majority|0]§!).\nFDP course: §Y[?cwger_fdp_course|0]§! (negative = social-liberal, positive = market-liberal) | CSU autonomy: §Y[?cwger_csu_autonomy|0]§! | Union share of the Bundesrat: §Y[?cwger_bundesrat_union|0]§!%\nScandal pressure: §Y[?cwger_scandal|0]§! | Bundesbank friction: §Y[?cwger_bundesbank|0]§!"
 COLDWAR_GER_1970_bonus:0 "Federal research programme"
 COLDWAR_GER_1970_bop_abgrenzung:0 "Legal Position"
 COLDWAR_GER_1970_bop_annaeherung:0 "Change through Rapprochement"
 COLDWAR_GER_1970_bop_change_through_rapprochement:0 "Wandel durch Annäherung"
 COLDWAR_GER_1970_bop_cold_front:0 "Cold Front"
 COLDWAR_GER_1970_bop_community_of_responsibility:0 "Community of Responsibility"
 COLDWAR_GER_1970_bop_legal_position:0 "Insisting on the Legal Position"
 COLDWAR_GER_1970_bop_treaty_policy:0 "Treaty Policy"
 COLDWAR_GER_1970_both_peoples_decide:0 "Let Both Peoples Decide"
 COLDWAR_GER_1970_both_peoples_decide_desc:0 "A referendum on the same day in both German states: if the Germans themselves vote for the treaty of unity, no parliament, no opposition and no foreign government can stand in its way. It is the most democratic way to unite a nation. It is also a gamble - for if either people says no, the question may be closed for a generation."
 COLDWAR_GER_1970_brandt_commission:0 "The Brandt Commission"
 COLDWAR_GER_1970_brandt_commission_desc:0 "Out of office, Willy Brandt chairs an independent commission on international development. 'North-South: A Programme for Survival' warns that the gap between the rich and the poor nations threatens the peace of the world as much as the arms race does. The report is translated into twenty languages. The governments of the North read it politely and file it away."
 COLDWAR_GER_1970_brazil_nuclear_deal:0 "The Brazil Nuclear Deal"
 COLDWAR_GER_1970_brazil_nuclear_deal_desc:0 "June 1975: the largest export contract in the Federal Republic's history. Eight nuclear reactors for Brazil, together with the technology to enrich uranium and to reprocess spent fuel - the complete fuel cycle, sold to a military regime that has not signed the Non-Proliferation Treaty. Washington protests furiously. Siemens and the Kraftwerk Union sign."
 COLDWAR_GER_1970_british_rebate:0 "Fontainebleau"
 COLDWAR_GER_1970_british_rebate_desc:0 "'I want my money back.' Margaret Thatcher blocks the Community budget, summit after summit, until she gets a rebate on Britain's contributions. At Fontainebleau in June 1984 Kohl and Mitterrand finally give way. Bonn, as always the paymaster, has to decide how much European peace is worth - and how much of the bill it will pick up."
 COLDWAR_GER_1970_bundesbank_independence:0 "Respect the Bundesbank"
 COLDWAR_GER_1970_bundesbank_independence_desc:0 "The Bundesbank is independent by law, by conviction and by popular demand: the Germans remember two inflations that destroyed their savings within a generation. Chancellors who fight it lose, sooner or later. Respecting Frankfurt costs growth and jobs in a downturn - but buys a currency that the whole world wants to hold."
 COLDWAR_GER_1970_bundesbank_truce:0 "A Truce with Frankfurt"
 COLDWAR_GER_1970_bundesbank_truce_desc:0 "No more public demands for lower interest rates, no more feuds with the President of the Bundesbank on the evening news, no more 'the most dangerous man in Europe' on the front page of The Sun. The finance minister makes his peace with Frankfurt. The markets calm down. The party's left wonders what it voted for."
 COLDWAR_GER_1970_bundesrat_bargaining:0 "The Mediation Committee"
 COLDWAR_GER_1970_bundesrat_bargaining_desc:0 "When the other camp holds the majority of the Länder, every major law ends up in the Mediation Committee, where state premiers and members of the Bundestag haggle behind closed doors until two in the morning. Nothing becomes law without the opposition's consent. The government learns that federalism is also a form of opposition."
 COLDWAR_GER_1970_bundeswehr_universities:0 "Bundeswehr Universities"
 COLDWAR_GER_1970_bundeswehr_universities_desc:0 "Officers who command conscripts with university degrees should have degrees themselves. The Bundeswehr universities in Hamburg and Munich give young officers an academic education - engineering, economics, education - alongside their military training. The traditionalists fear that the army will produce intellectuals. The reformers hope it will."
 COLDWAR_GER_1970_candidate_from_hanover:0 "The Candidate from Hanover"
 COLDWAR_GER_1970_candidate_from_hanover_desc:0 "Gerhard Schröder once shook the railings of the chancellery in Bonn after a night out and shouted 'I want in there!'. Twenty years later he governs Lower Saxony with an absolute majority, sits on the supervisory board of Volkswagen and polls ten points ahead of his own party. The SPD does not love him. It may need him."
 COLDWAR_GER_1970_cap_anamur:0 "Cap Anamur"
 COLDWAR_GER_1970_cap_anamur_desc:0 "1979: the boat people are drowning in the South China Sea, fleeing Vietnam in overcrowded fishing boats. A group of German citizens around the journalist Rupert Neudeck charters a freighter, the Cap Anamur, and starts fishing them out of the water. The government must decide whether to give the rescued a home. Public opinion has already decided."
 COLDWAR_GER_1970_cdu_centre_course:0 "The CDU Moves to the Centre"
 COLDWAR_GER_1970_cdu_centre_course_desc:0 "Without the CSU's right flank the CDU can move where its modernisers always wanted it to be: the political centre. It courts the FDP, the moderate SPD voter, the new middle classes in the suburbs. The conservatives who feel abandoned now have a party to go to - in Munich."
 COLDWAR_GER_1970_cdu_in_bavaria:0 "The CDU in Bavaria"
 COLDWAR_GER_1970_cdu_in_bavaria_desc:0 "If the CSU marches north, the CDU marches south. A Bavarian Land association, candidates in every constituency between Hof and Lindau, a CDU poster in every Bavarian village. For thirty years the sister parties divided Germany between them. That arrangement is over."
 COLDWAR_GER_1970_census:0 "The Census"
 COLDWAR_GER_1970_census_desc:0 "In 1983 every household in the Federal Republic is to answer the state's questions: who lives here, who works where, how many rooms, how many cars. A grassroots movement calls for a boycott - 'Only sheep let themselves be counted' - and the Constitutional Court is asked to stop it. Its answer will invent a new fundamental right: the right to informational self-determination."
 COLDWAR_GER_1970_central_america:0 "Peace in Central America"
 COLDWAR_GER_1970_central_america_desc:0 "El Salvador's death squads, Nicaragua's Sandinistas, the Contras in Honduras: Washington sees a Soviet beachhead, the Contadora states see a regional war. German volunteers pick coffee in Nicaragua; the CDU's foundation trains Christian democrats in San Salvador."
 COLDWAR_GER_1970_century_contract:0 "The Century Contract"
 COLDWAR_GER_1970_century_contract_desc:0 "The power utilities commit themselves to burning German hard coal for fifteen years, in rising quantities, at prices far above the world market - the 'contract of the century'. The miners have their future, the Ruhr its stability, the government its security of supply. The electricity customers pay the premium without being asked."
 COLDWAR_GER_1970_chancellery:0 "The Chancellery"
 COLDWAR_GER_1970_chancellery_desc:0 "Under Horst Ehmke the Palais Schaumburg is meant to become the nerve centre of a modern state: planning staffs, early computers, a chief of staff who knows every file before the minister does. The idea is that the Federal Republic can be governed rather than merely administered. The ministers, the coalition partner and the Bundestag all have their own views on that."
 COLDWAR_GER_1970_chancellor_of_the_centre:0 "A Chancellor of the Centre"
 COLDWAR_GER_1970_chancellor_of_the_centre_desc:0 "He has broken with his party's dogmas, made peace with the bosses and kept the unions talking. The Social Democrats have learned to govern from the middle - at the cost of their soul, say the old comrades; at last, say the voters."
 COLDWAR_GER_1970_change_1982:0 "The Change of Government"
 COLDWAR_GER_1970_change_1982_desc:0 "The constructive vote of no confidence was designed in 1949 to prevent Weimar's chaos: a chancellor can only be removed if the Bundestag elects a successor in the same vote. When the FDP's economic liberals have had enough of the SPD's debts and its quarrels over missiles, that article becomes a path to power without an election - and a betrayal, say those who voted for the coalition."
 COLDWAR_GER_1970_changing_society:0 "A Changing Society"
 COLDWAR_GER_1970_changing_society_desc:0 "Long hair in the Bundestag, communes in Kreuzberg, rock music on the radio, women who want a career rather than their husband's permission to work. The republic of Adenauer is turning into the republic of 1968, and the change runs through every family dinner table. The government can try to lead it, slow it down or simply ride it."
 COLDWAR_GER_1970_charter_77:0 "The Signatories of Charter 77"
 COLDWAR_GER_1970_charter_77_desc:0 "Two hundred and forty Czechoslovak citizens have signed a document asking their own government to obey its own laws. They are fired, interrogated, their children barred from university. Prague warns that any foreign support is interference in its internal affairs."
 COLDWAR_GER_1970_checkbook_diplomacy:0 "Checkbook Diplomacy"
 COLDWAR_GER_1970_checkbook_diplomacy_desc:0 "Iraq has occupied Kuwait, and an American-led coalition prepares for war. The Basic Law, as everyone in Bonn reads it, forbids sending German soldiers to the Gulf. So Germany pays instead - some seventeen billion marks for the coalition's costs. The allies take the money and call it chequebook diplomacy. Germany will not be allowed to stand aside the next time."
 COLDWAR_GER_1970_chemical_free_zone:0 "A Zone Free of Chemical Weapons"
 COLDWAR_GER_1970_chemical_free_zone_desc:0 "In 1985 the SPD opposition and the SED drafted a treaty for a Central Europe free of chemical weapons - an opposition party negotiating with a foreign government, to the fury of the Kohl cabinet. Here the government itself makes it its policy: no chemical weapons in either German state, with inspections on both sides. Washington is not amused; Moscow is."
 COLDWAR_GER_1970_chernobyl_response:0 "After Chernobyl"
 COLDWAR_GER_1970_chernobyl_response_desc:0 "April 1986: a reactor explodes in the Ukraine, and a few days later a radioactive cloud drifts over Bavaria. Contaminated milk, children kept indoors, playgrounds closed, a run on iodine tablets, and authorities that give contradictory advice. The anti-nuclear movement was right, say millions of Germans who never marched with it. The government has to answer."
 COLDWAR_GER_1970_chile_exiles:0 "Refuge from Santiago"
 COLDWAR_GER_1970_chile_exiles_desc:0 "September 1973: General Pinochet's coup overthrows Salvador Allende, and the West German embassy in Santiago fills with people fleeing the junta's death squads. Bonn must decide how many of them it will take in - and whether to go on selling to the generals. The SPD's left demands a clear line. The CDU's foreign policy experts warn against making enemies of an anti-communist government."
 COLDWAR_GER_1970_church_contacts:0 "Church to Church"
 COLDWAR_GER_1970_church_contacts_desc:0 "The Protestant churches in East and West never fully separated. Their synods meet, their parishes are twinned, their money flows across the border. Under the roof of the church in the GDR, peace groups, environmental circles and human rights activists find the only space the SED does not control. Supporting the churches means supporting the opposition - without saying so."
 COLDWAR_GER_1970_citizen_in_uniform:0 "Citizens in Uniform"
 COLDWAR_GER_1970_citizen_in_uniform_desc:0 "Innere Führung - leadership from within: the Bundeswehr's founders wanted an army of citizens in uniform who obey the Basic Law before any order and know when an order must be refused. Today 495,000 soldiers, most of them conscripts, stand in twelve divisions along the inner-German border, every one of them assigned to NATO. It is the strongest conventional army in Western Europe - and it must never fight alone."
 COLDWAR_GER_1970_citizenship_reform:0 "Citizens by Birth"
 COLDWAR_GER_1970_citizenship_reform_desc:0 "Millions of children of guest workers were born in Germany, speak with a Swabian or Ruhr accent and have never lived anywhere else - and they are not German. Citizenship by place of birth, and perhaps a second passport, would change that. For the reformers it is overdue; for the Union it is the end of the nation as a community of descent."
 COLDWAR_GER_1970_civil_defence:0 "Civil Defence"
 COLDWAR_GER_1970_civil_defence_desc:0 "Shelters under schools and underground stations, sirens on every roof, iodine tablets in every town hall, emergency food stores in secret depots. Civil defence is meant to give the population a chance to survive a war. The peace movement calls it preparation for the unthinkable - and points out that there are shelters for only three per cent of the population."
 COLDWAR_GER_1970_civilian_service:0 "Civilian Service"
 COLDWAR_GER_1970_civilian_service_desc:0 "Conscientious objectors staff the hospitals, the care homes and the ambulances: 3,900 in 1961, more than a hundred thousand a generation later. The examination of conscience before a tribunal is abolished, the service extended to discourage abuse. Without the young men who refused the rifle, the German welfare state would no longer function."
 COLDWAR_GER_1970_coalition_of_reason:0 "The Coalition of Reason"
 COLDWAR_GER_1970_coalition_of_reason_desc:0 "Two German leaders who agree on one thing: that war must never again start from German soil. Missiles are being deployed on both sides of the border, the superpowers have stopped talking - and the chancellor and the General Secretary keep talking anyway. A 'coalition of reason' across the Wall: the SED needs Bonn's money, Bonn needs the SED's restraint."
 COLDWAR_GER_1970_codetermination:0 "Co-determination 1976"
 COLDWAR_GER_1970_codetermination_desc:0 "Workers and shareholders sit opposite each other on the supervisory boards of every company with more than two thousand employees - almost as equals. The chairman, appointed by the shareholders, keeps the casting vote, because the FDP insisted on it and the coalition needed the FDP. The employers take the law to Karlsruhe; the unions call it a half-measure. Both accept it in the end."
 COLDWAR_GER_1970_cologne_debt:0 "The Cologne Debt Initiative"
 COLDWAR_GER_1970_cologne_debt_desc:0 "Under the cathedral, the leaders of the eight biggest economies agree to cancel up to seventy billion dollars of debt owed by the poorest countries in the world - while a human chain of thirty thousand people from the Jubilee campaign links arms around the summit."
 COLDWAR_GER_1970_community_of_responsibility:0 "A Community of Responsibility"
 COLDWAR_GER_1970_community_of_responsibility_desc:0 "The two German states share a responsibility for peace in Europe - a phrase that East Berlin and Bonn both use, for very different reasons. For the SED it is a step towards recognition as a sovereign state; for Bonn, a reminder that the Germans remain one nation. In a decade of new missiles, it is one of the few things they can agree on."
 COLDWAR_GER_1970_comprehensive_schools:0 "The Comprehensive School"
 COLDWAR_GER_1970_comprehensive_schools_desc:0 "At ten, German children are sorted into Gymnasium, Realschule or Hauptschule - and with them, all too often, their whole future. The comprehensive school would keep all children together until sixteen. Hesse and North Rhine-Westphalia try it; parents' associations collect millions of signatures against it; and the school question becomes a class question all over again."
 COLDWAR_GER_1970_comrade_of_the_bosses:0 "Comrade of the Bosses"
 COLDWAR_GER_1970_comrade_of_the_bosses_desc:0 "The chancellor rescues a bankrupt construction giant on live television, phones car executives by their first names and smokes Cohibas for the cameras. The tabloids call him 'the comrade of the bosses'. In Wolfsburg and Stuttgart, nobody minds."
 COLDWAR_GER_1970_concerted_action:0 "Concerted Action"
 COLDWAR_GER_1970_concerted_action_desc:0 "Government, employers, unions and the Bundesbank at one table: Karl Schiller's Concerted Action is an attempt to steer wages, prices and growth together rather than against each other. Its guidelines are only recommendations, and every side reads them differently. But as long as everyone keeps coming to the table, the Federal Republic avoids the strikes that paralyse its neighbours."
 COLDWAR_GER_1970_concerted_action_revived:0 "Concerted Action Revived"
 COLDWAR_GER_1970_concerted_action_revived_desc:0 "Karl Schiller's round table returns: trade unions, employers' associations, the Bundesbank and both coalition partners meet in the economics ministry to agree on wages, prices and investment. 'Social symmetry', Schiller called it. It works as long as everyone gives something - and ends the moment someone feels cheated."
 COLDWAR_GER_1970_confrontation_course:0 "The Policy of Strength"
 COLDWAR_GER_1970_confrontation_course_desc:0 "No recognition, no credits, no illusions: the GDR is a Soviet satrapy that will collapse if it is pressed hard enough - and Bonn will press. The policy of strength promises that the Germans in the East will not be abandoned to their rulers. It also promises a colder, more dangerous border and an East Berlin with nothing left to lose."
 COLDWAR_GER_1970_conscription_w15:0 "Fifteen Months"
 COLDWAR_GER_1970_conscription_w15_desc:0 "Fifteen months of military service instead of eighteen: shorter service, more fairness, more young men called up rather than deferred. The conscripts are pleased, the generals less so. Every month cut from the period of service is a month of training lost - and a division that may not be ready when it is needed."
 COLDWAR_GER_1970_conscription_w18:0 "Eighteen Months"
 COLDWAR_GER_1970_conscription_w18_desc:0 "The baby boom is over. From 1987 the cohorts of eighteen-year-olds shrink year by year, and the Bundeswehr faces a choice: lengthen military service, or disband divisions that NATO's plans count on. Eighteen months of service is unpopular, expensive and - according to the defence ministry - unavoidable."
 COLDWAR_GER_1970_consolidation_course:0 "Consolidation Course"
 COLDWAR_GER_1970_consolidation_course_desc:0 "Count Lambsdorff's paper on the economy ended the social-liberal coalition; now it becomes government policy. Cuts to subsidies and social spending, lower taxes on companies, a more flexible labour market and a state that withdraws to its core tasks. The deficit falls, unemployment does not - and the unions prepare for a long fight."
 COLDWAR_GER_1970_constitutional_reform:0 "The Enquete Commission"
 COLDWAR_GER_1970_constitutional_reform_desc:0 "Twenty years after Herrenchiemsee the Bundestag sets up an Enquete Commission to examine the whole Basic Law: federalism, the role of parliament, the emergency constitution, the place of the citizen. Its experts will write a thousand pages. Whether those pages gather dust in the archives or become the blueprint for a new republic depends on a government willing to use them."
 COLDWAR_GER_1970_contact_ban_law:0 "The Contact Ban Act"
 COLDWAR_GER_1970_contact_ban_law_desc:0 "Hanns Martin Schleyer has been kidnapped, and the crisis staff suspects that the RAF prisoners in Stammheim are directing the operation through their lawyers. The Contact Ban Act passes the Bundestag and the Bundesrat in a few days: prisoners can be cut off from all contact - even with their defence counsel. It is the fastest law in the Republic's history, and one of the most controversial."
 COLDWAR_GER_1970_core_armee:0 "An Army in the Alliance"
 COLDWAR_GER_1970_core_armee_desc:0 "Twelve divisions on the inner-German border, assigned to NATO from the first day of war."
 COLDWAR_GER_1970_core_bonn:0 "The Chancellor's Office"
 COLDWAR_GER_1970_core_bonn_desc:0 "The machinery of government in Bonn: the chancellery, the coalition committee and the art of the majority."
 COLDWAR_GER_1970_core_energie:0 "The Energy Mix"
 COLDWAR_GER_1970_core_energie_desc:0 "Coal from the Ruhr, oil from the Gulf, gas from Siberia, power from the reactors - and the bill for each."
 COLDWAR_GER_1970_core_modell:0 "Modell Deutschland"
 COLDWAR_GER_1970_core_modell_desc:0 "Social partnership, a hard currency and the export machine."
 COLDWAR_GER_1970_core_ost_neutral:0 "Deutschlandpolitik"
 COLDWAR_GER_1970_core_ost_neutral_desc:0 "Bonn's policy towards the other German state - and the price it pays for it at home."
 COLDWAR_GER_1970_core_ost_rapprochement:0 "Change through Rapprochement"
 COLDWAR_GER_1970_core_ost_rapprochement_desc:0 "Bonn's policy towards the other German state - and the price it pays for it at home."
 COLDWAR_GER_1970_core_ost_strength:0 "Policy of Strength"
 COLDWAR_GER_1970_core_ost_strength_desc:0 "Bonn's policy towards the other German state - and the price it pays for it at home."
 COLDWAR_GER_1970_core_wehrhaft:0 "Militant Democracy"
 COLDWAR_GER_1970_core_wehrhaft_desc:0 "A democracy that defends itself - against its enemies and, sometimes, against its own excesses."
 COLDWAR_GER_1970_core_welt:0 "A Civilian Power"
 COLDWAR_GER_1970_core_welt_desc:0 "An economic giant that wants to be more than a political dwarf - without guns."
 COLDWAR_GER_1970_core_west:0 "Anchored in the West"
 COLDWAR_GER_1970_core_west_desc:0 "NATO, the Community, Paris and Washington: Bonn's foreign policy has one fixed point."
 COLDWAR_GER_1970_crackdown_response:0 "After the Massacre"
 COLDWAR_GER_1970_crackdown_response_desc:0 "The SED has fired on its own people. The images from the streets of Leipzig and East Berlin are on every screen in the world. Bonn must decide: sanction the regime, cut every credit and recall the Permanent Representative - or keep the channels open for the sake of the prisoners and the families, as every government before has done."
 COLDWAR_GER_1970_crisis_of_the_republic:0 "The Crisis of the Republic"
 COLDWAR_GER_1970_crisis_of_the_republic_desc:0 "Bonn is not Weimar, the textbooks said. Now the government argues that the Basic Law has made the state defenceless against its enemies, and that only a state of emergency can save it. The Constitutional Court in Karlsruhe is watching; so are the generals, the trade unions and the Allied embassies. The question is no longer whether the Republic is in crisis, but who will define the crisis."
 COLDWAR_GER_1970_critical_dialogue:0 "Critical Dialogue with Iran"
 COLDWAR_GER_1970_critical_dialogue_desc:0 "Trade with Tehran and talk about human rights in the same meetings: the 'critical dialogue' is Bonn's attempt to keep Iran open to the West without closing its eyes. Then a court in Berlin establishes that the murder of four Kurdish opposition politicians in the Mykonos restaurant was ordered by the highest levels of the Iranian state. The dialogue becomes very critical indeed."
 COLDWAR_GER_1970_critical_mirror:0 "A Critical Mirror"
 COLDWAR_GER_1970_critical_mirror_desc:0 "Grass reads in Calcutta, Wenders shows his films in Tokyo, Wallraff's reportages are translated into Turkish. The government sends abroad the artists who attack it at home - on the theory that a democracy which exports its critics is more convincing than one which exports its brochures."
 COLDWAR_GER_1970_crown_witness:0 "The Crown Witness"
 COLDWAR_GER_1970_crown_witness_desc:0 "Reduced sentences, perhaps even freedom, for terrorists who testify against their former comrades. Lawyers find the idea distasteful - justice sold for information - and the RAF's prisoners call every witness a traitor. But in the courtroom it works: for the first time, the prosecutors learn from the inside how the underground is organised."
 COLDWAR_GER_1970_csce_followup:0 "Belgrade, Madrid, Vienna"
 COLDWAR_GER_1970_csce_followup_desc:0 "The CSCE follow-up conferences in Belgrade, Madrid and Vienna: where the West reads out the names of political prisoners and the East counts the tank divisions. They last for months, sometimes years, and often seem to produce nothing but communiqués. Bonn's diplomats are always the last to leave the room - because for them, every concession on travel is a family reunited."
 COLDWAR_GER_1970_csce_human_rights:0 "Human Rights at the CSCE"
 COLDWAR_GER_1970_csce_human_rights_desc:0 "Basket Three of the Helsinki Final Act is quoted back at the SED at every follow-up conference: freedom of movement, family reunification, the free flow of information. In Belgrade, Madrid and Vienna the Western delegations read out the names of East Germans who have been refused permission to leave. The SED signed the Final Act. Now it must live with it."
 COLDWAR_GER_1970_csu_bavaria:0 "Bavaria First"
 COLDWAR_GER_1970_csu_bavaria_desc:0 "Franz Josef Strauß runs the CSU as a state party with federal ambitions, a Bavarian kingdom with its own foreign policy and its own ideas about who should be chancellor. Keeping him inside the Union tent costs concessions on every major question. Letting him outside would cost a great deal more."
 COLDWAR_GER_1970_csu_land_parties:0 "The CSU in Every Land"
 COLDWAR_GER_1970_csu_land_parties_desc:0 "The 'circles of friends of the CSU' in Hesse, Lower Saxony and Baden-Württemberg become Land associations of their own. Wherever the CDU is too soft for Strauß's taste, the CSU now stands its own candidates. The conservative voter outside Bavaria finally has a choice. The CDU calls it treason."
 COLDWAR_GER_1970_csu_nationwide:0 "The Fourth Party"
 COLDWAR_GER_1970_csu_nationwide_desc:0 "Wildbad Kreuth, November 1976: the CSU's members of parliament vote to end the joint parliamentary group with the CDU and to stand throughout the Federal Republic. This time the decision holds. The CDU founds a Bavarian branch in revenge. Two Union parties fight for the same voters - or, if they are clever, for different ones."
 COLDWAR_GER_1970_cultural_diplomacy:0 "Cultural Foreign Policy"
 COLDWAR_GER_1970_cultural_diplomacy_desc:0 "Security and trade are the first two pillars of German foreign policy. The third is culture: Goethe-Institutes, Deutsche Welle, the DAAD's scholarships and the Humboldt Foundation's fellowships. A country that cannot - and should not - project power with tanks can project it with ideas, languages and universities. The Federal Republic wants to be an economic giant that is no longer a political dwarf."
 COLDWAR_GER_1970_data_protection:0 "Data Protection"
 COLDWAR_GER_1970_data_protection_desc:0 "The Federal Data Protection Act of 1977, a data protection commissioner in Bonn, and in 1983 the Constitutional Court's census judgment: every citizen has the right to decide what the state may know about him. Informational self-determination becomes a fundamental right. The security services complain that their hands are tied. The citizens begin to read the small print."
 COLDWAR_GER_1970_ddr_inner_german:0 "The German Question"
 COLDWAR_GER_1970_ddr_inner_german_desc:0 "How deeply the Republic depends on West German money and how much its people want to leave.\nCrisis index: §Y[?cwddr_crisis|0]§! | Exit pressure: §Y[?cwddr_exit_pressure|0]§! | Hard-currency shortage: §Y[?cwddr_hard_currency|0]§!\nSED control: §Y[?cwddr_sed_control|0]§! | Moscow's guarantee: §Y[?cwddr_moscow_backing|0]§! | Opposition: §Y[?cwddr_opposition|0]§!"
 COLDWAR_GER_1970_ddr_state_category:0 "The Workers' and Peasants' State"
 COLDWAR_GER_1970_ddr_state_category_desc:0 "GDR crisis index: §Y[?cwddr_crisis|0]§! | exit pressure: §Y[?cwddr_exit_pressure|0]§! | hard-currency shortage: §Y[?cwddr_hard_currency|0]§!\nDependence on Bonn: §Y[?cwddr_west_dependency|0]§! | SED control: §Y[?cwddr_sed_control|0]§! | Moscow's guarantee: §Y[?cwddr_moscow_backing|0]§!"
 COLDWAR_GER_1970_ddr_westpolitik_category:0 "Policy Towards Bonn"
 COLDWAR_GER_1970_ddr_westpolitik_category_desc:0 "The other German state: crises, pressure, money and the border.\n\nClimate: §Y[?GER.cwgg_klima|0]§! | escalation pressure: §Y[?GER.cwgg_druck|0]§! | our initiative: §Y[?GER.cwgg_init_ddr|0]§!\nBundeswehr alert level: §Y[?GER.cwgg_mob_brd|0]§! | NVA alert level: §Y[?GER.cwgg_mob_ddr|0]§!\nCrisis intensity: §Y[?GER.cwgg_krise_int|0]§! (0 = no crisis) | treaties signed: see the events of the Federal Republic."
 COLDWAR_GER_1970_dec_approve_arms_export:0 "Approve an Arms Export"
 COLDWAR_GER_1970_dec_approve_arms_export_desc:0 "Leopards, Type 209 submarines, frigates: the Federal Security Council meets in secret. Revenue follows Imperia Arms Demand."
 COLDWAR_GER_1970_dec_aufbau_ost_programme:0 "Aufbau Ost Investment Programme"
 COLDWAR_GER_1970_dec_aufbau_ost_programme_desc:0 "Motorways, telephone lines and sewage works for the new Länder, paid for on credit."
 COLDWAR_GER_1970_dec_build_reception:0 "Expand the Reception Camps"
 COLDWAR_GER_1970_dec_build_reception_desc:0 "Barracks, schools and gyms turned into dormitories; job centres open on Sundays."
 COLDWAR_GER_1970_dec_bundesrat_package:0 "Package Deal with the Länder"
 COLDWAR_GER_1970_dec_bundesrat_package_desc:0 "Money for the states' pet projects in exchange for their votes in the Bundesrat. The hostile Bundesrat stops blocking the government for a year."
 COLDWAR_GER_1970_dec_bundestag_mandate:0 "Bundestag Mandate for a Deployment"
 COLDWAR_GER_1970_dec_bundestag_mandate_desc:0 "Ask the Bundestag to approve an armed mission under a UN or NATO mandate."
 COLDWAR_GER_1970_dec_buy_a_deputy:0 "A Deputy From the Other Side"
 COLDWAR_GER_1970_dec_buy_a_deputy_desc:0 "Persuade an opposition deputy to abstain or cross over. If it ever comes out how, it will be a scandal."
 COLDWAR_GER_1970_dec_clean_house:0 "Clean House"
 COLDWAR_GER_1970_dec_clean_house_desc:0 "Parliamentary inquiries, a new code on party financing and a few resignations before the magazines force them."
 COLDWAR_GER_1970_dec_coalition_committee:0 "Coalition Committee"
 COLDWAR_GER_1970_dec_coalition_committee_desc:0 "A long night in the Chancellor's Bungalow to bind the Free Democrats to the government's course."
 COLDWAR_GER_1970_dec_concerted_action:0 "Concerted Action"
 COLDWAR_GER_1970_dec_concerted_action_desc:0 "Unions, employers, the Bundesbank and the government at one table: wage guidelines in return for jobs."
 COLDWAR_GER_1970_dec_currency_one_to_one:0 "Conversion Rate: One to One"
 COLDWAR_GER_1970_dec_currency_one_to_one_desc:0 "Wages and savings converted one to one. The East Germans get the D-Mark at a price the East German economy cannot survive."
 COLDWAR_GER_1970_dec_currency_two_to_one:0 "Conversion Rate: Two to One"
 COLDWAR_GER_1970_dec_currency_two_to_one_desc:0 "The Bundesbank's proposal: two Ostmarks for one D-Mark. Sound money, angry crowds in Leipzig."
 COLDWAR_GER_1970_dec_ddr_ask_credit:0 "Ask Bonn for a Credit"
 COLDWAR_GER_1970_dec_ddr_ask_credit_desc:0 "Through Schalck-Golodkowski, let Bonn know that the Republic's hard-currency position is 'tight'. Bonn decides."
 COLDWAR_GER_1970_dec_ddr_border_regime:0 "Tighten the Border Regime"
 COLDWAR_GER_1970_dec_ddr_border_regime_desc:0 "More mines, more dogs, more watchtowers - and an order to shoot."
 COLDWAR_GER_1970_dec_ddr_break_unity:0 "Break Off the Unity Talks"
 COLDWAR_GER_1970_dec_ddr_break_unity_desc:0 "End the negotiations. The climate suffers, and the subject is closed for three years."
 COLDWAR_GER_1970_dec_ddr_close_transit:0 "Close the Access Routes"
 COLDWAR_GER_1970_dec_ddr_close_transit_desc:0 "Close the transit routes to West Berlin 'for repairs'. A crisis is the point."
 COLDWAR_GER_1970_dec_ddr_consumer_imports:0 "Import Consumer Goods"
 COLDWAR_GER_1970_dec_ddr_consumer_imports_desc:0 "Jeans, coffee and VW Golfs bought in the West to quiet the people - on credit."
 COLDWAR_GER_1970_dec_ddr_crisis_course:0 "Set Our Course in the Crisis"
 COLDWAR_GER_1970_dec_ddr_crisis_course_desc:0 "Decide how East Berlin answers in the next round of the crisis. Rounds are resolved every six months."
 COLDWAR_GER_1970_dec_ddr_goodwill:0 "A Gesture of Goodwill"
 COLDWAR_GER_1970_dec_ddr_goodwill_desc:0 "Lower the compulsory exchange for pensioners, dismantle a stretch of spring guns - and let the diplomats talk about it."
 COLDWAR_GER_1970_dec_ddr_hva_offensive:0 "HVA Offensive in Bonn"
 COLDWAR_GER_1970_dec_ddr_hva_offensive_desc:0 "Markus Wolf's Main Directorate for Reconnaissance sends more agents, more Romeos and more money west."
 COLDWAR_GER_1970_dec_ddr_intershop:0 "Expand the Intershops"
 COLDWAR_GER_1970_dec_ddr_intershop_desc:0 "Western goods for Western money: let citizens with D-Marks from relatives shop in special stores."
 COLDWAR_GER_1970_dec_ddr_koko:0 "Commercial Coordination"
 COLDWAR_GER_1970_dec_ddr_koko_desc:0 "Schalck-Golodkowski's empire: arms trading, art sales, waste imports - anything for hard currency."
 COLDWAR_GER_1970_dec_ddr_moscow_blessing:0 "Seek Moscow's Blessing"
 COLDWAR_GER_1970_dec_ddr_moscow_blessing_desc:0 "Send the Prime Minister to the Kremlin to argue for the treaty. The Soviet Union becomes more willing to consent."
 COLDWAR_GER_1970_dec_ddr_nva_alert_down:0 "Lower the NVA Alert Level"
 COLDWAR_GER_1970_dec_ddr_nva_alert_down_desc:0 "Stand the National People's Army down by one level."
 COLDWAR_GER_1970_dec_ddr_nva_alert_up:0 "Raise the NVA Alert Level"
 COLDWAR_GER_1970_dec_ddr_nva_alert_up_desc:0 "Put the National People's Army on a higher state of readiness. Each level speeds up mobilisation and hardens war support: level 1 §G+10%§! / §G+2%§!, level 2 §G+25%§! / §G+5%§!, level 3 §G+50%§! / §G+10%§!. Needs the escalation ladder at §YCrisis§! (level 1), §YConfrontation§! (2), or §YWar Danger§!, a countdown or a fully alerted Bundeswehr (3)."
 COLDWAR_GER_1970_dec_ddr_propose_unity:0 "Propose Unity Talks"
 COLDWAR_GER_1970_dec_ddr_propose_unity_desc:0 "Offer Bonn formal negotiations on the unity of Germany - on equal terms, with every chapter open. Needs three years of unbroken détente, a climate of at least 70, the Basic Treaty, the Permanent Representations and the traffic agreements in force, and culture or the state visit.\n\nDétente months: §Y[?GER.cwgg_detente_m|0]§!/36 | climate: §Y[?GER.cwgg_klima|0]§!"
 COLDWAR_GER_1970_dec_ddr_raise_exchange:0 "Raise the Compulsory Exchange"
 COLDWAR_GER_1970_dec_ddr_raise_exchange_desc:0 "Every Western visitor must change more D-Marks a day. Fewer visits, more hard currency."
 COLDWAR_GER_1970_dec_ddr_recognition_drive:0 "Win Another Recognition"
 COLDWAR_GER_1970_dec_ddr_recognition_drive_desc:0 "Credits, advisers and solidarity: persuade another state in the Third World to recognise the GDR."
 COLDWAR_GER_1970_dec_ddr_reform_course:0 "A Socialist Glasnost"
 COLDWAR_GER_1970_dec_ddr_reform_course_desc:0 "Follow Moscow's new course: open the press a little, let the dissidents speak."
 COLDWAR_GER_1970_dec_ddr_stasi_sweep:0 "Operation Against the Groups"
 COLDWAR_GER_1970_dec_ddr_stasi_sweep_desc:0 "The Ministry for State Security infiltrates and decomposes ('Zersetzung') the peace and environment groups."
 COLDWAR_GER_1970_dec_ddr_tighten_border:0 "Strengthen the Border Installations"
 COLDWAR_GER_1970_dec_ddr_tighten_border_desc:0 "New fences, mines and SM-70 spring guns along the state border."
 COLDWAR_GER_1970_dec_ddr_transit_checks:0 "Harass the Transit Routes"
 COLDWAR_GER_1970_dec_ddr_transit_checks_desc:0 "Hours of checks at Helmstedt and Dreilinden. West Berlin should remember whose territory it lies in."
 COLDWAR_GER_1970_dec_ddr_unity_position:0 "Our Position in the Unity Talks"
 COLDWAR_GER_1970_dec_ddr_unity_position_desc:0 "Restate East Berlin's position on the chapter now on the table. Chapter §Y[?GER.cwgg_u_cur|0]§! of five; agreed so far §Y[?GER.cwgg_u_agreed|0]§!; failed rounds §Y[?GER.cwgg_u_fail|0]§!/8."
 COLDWAR_GER_1970_dec_dev_programme_1:0 "Development Partnership: Construction Assistance"
 COLDWAR_GER_1970_dec_dev_programme_1_desc:0 "Start a medium-sized German construction assistance programme in a partner country (an Imperia assistance programme)."
 COLDWAR_GER_1970_dec_dev_programme_2:0 "Development Partnership: Technical Mission"
 COLDWAR_GER_1970_dec_dev_programme_2_desc:0 "Start a medium-sized German technical mission programme in a partner country (an Imperia assistance programme)."
 COLDWAR_GER_1970_dec_dev_programme_4:0 "Development Partnership: Productivity Mission"
 COLDWAR_GER_1970_dec_dev_programme_4_desc:0 "Start a medium-sized German productivity mission programme in a partner country (an Imperia assistance programme)."
 COLDWAR_GER_1970_dec_energy_saving:0 "Energy-Saving Campaign"
 COLDWAR_GER_1970_dec_energy_saving_desc:0 "'Energy saving is our best energy source': insulation grants, a speed limit, thermostat adverts on television."
 COLDWAR_GER_1970_dec_energy_security:0 "Strategic Oil Reserve"
 COLDWAR_GER_1970_dec_energy_security_desc:0 "Fill the salt caverns of Etzel with crude oil against the next embargo."
 COLDWAR_GER_1970_dec_federal_reform_commission:0 "Federal Reform Commission"
 COLDWAR_GER_1970_dec_federal_reform_commission_desc:0 "A joint commission of Bundestag and Bundesrat untangles who pays for what: fewer joint tasks, fewer vetoes."
 COLDWAR_GER_1970_dec_foundation_chl:0 "Konrad Adenauer Foundation in Chile"
 COLDWAR_GER_1970_dec_foundation_chl_desc:0 "Money, seminars and printing presses for the sister party in Chile."
 COLDWAR_GER_1970_dec_foundation_gre:0 "Friedrich Ebert Foundation in Greece"
 COLDWAR_GER_1970_dec_foundation_gre_desc:0 "Money, seminars and printing presses for the sister party in Greece."
 COLDWAR_GER_1970_dec_foundation_nic:0 "Konrad Adenauer Foundation in Nicaragua"
 COLDWAR_GER_1970_dec_foundation_nic_desc:0 "Money, seminars and printing presses for the sister party in Nicaragua."
 COLDWAR_GER_1970_dec_foundation_por:0 "Friedrich Ebert Foundation in Portugal"
 COLDWAR_GER_1970_dec_foundation_por_desc:0 "Money, seminars and printing presses for the sister party in Portugal."
 COLDWAR_GER_1970_dec_foundation_spr:0 "Friedrich Ebert Foundation in Spain"
 COLDWAR_GER_1970_dec_foundation_spr_desc:0 "Money, seminars and printing presses for the sister party in Spain."
 COLDWAR_GER_1970_dec_integration_programme:0 "Integration Programme for Übersiedler"
 COLDWAR_GER_1970_dec_integration_programme_desc:0 "Housing credits, recognition of East German qualifications, language for those who came via Hungary with nothing but a bag."
 COLDWAR_GER_1970_dec_junior_partner_offer:0 "An Offer to the Junior Partner"
 COLDWAR_GER_1970_dec_junior_partner_offer_desc:0 "Another ministry, a pet project in the budget, a say in the next appointment - whatever keeps the coalition partner's deputies in line."
 COLDWAR_GER_1970_dec_lift_cocom_bul:0 "Ease COCOM Restrictions on Bulgaria"
 COLDWAR_GER_1970_dec_lift_cocom_bul_desc:0 "Allow dual-use machinery to be exported to Bulgaria. Washington will grumble; Krupp and Siemens will not."
 COLDWAR_GER_1970_dec_lift_cocom_hun:0 "Ease COCOM Restrictions on Hungary"
 COLDWAR_GER_1970_dec_lift_cocom_hun_desc:0 "Allow dual-use machinery to be exported to Hungary. Washington will grumble; Krupp and Siemens will not."
 COLDWAR_GER_1970_dec_lift_cocom_pol:0 "Ease COCOM Restrictions on Poland"
 COLDWAR_GER_1970_dec_lift_cocom_pol_desc:0 "Allow dual-use machinery to be exported to Poland. Washington will grumble; Krupp and Siemens will not."
 COLDWAR_GER_1970_dec_lift_cocom_rom:0 "Ease COCOM Restrictions on Romania"
 COLDWAR_GER_1970_dec_lift_cocom_rom_desc:0 "Allow dual-use machinery to be exported to Romania. Washington will grumble; Krupp and Siemens will not."
 COLDWAR_GER_1970_dec_mediation_committee:0 "The Mediation Committee"
 COLDWAR_GER_1970_dec_mediation_committee_desc:0 "The opposition controls the Bundesrat. Negotiate a package deal in the Vermittlungsausschuss."
 COLDWAR_GER_1970_dec_mission_energy:0 "Energy Security"
 COLDWAR_GER_1970_dec_mission_energy_desc:0 "The oil shock has shown how vulnerable an economy without its own oil is. Save energy, diversify supply - before the next embargo."
 COLDWAR_GER_1970_dec_mission_majority:0 "Secure the Chancellor's Majority"
 COLDWAR_GER_1970_dec_mission_majority_desc:0 "The government has lost its working majority. Win deputies back - by persuasion, by promises, or by less elegant means - before the opposition tables its motion."
 COLDWAR_GER_1970_dec_mission_manhunt:0 "Manhunt"
 COLDWAR_GER_1970_dec_mission_manhunt_desc:0 "The RAF's underground is growing. Break the commando level before it strikes again."
 COLDWAR_GER_1970_dec_mission_reception:0 "Reception Camps"
 COLDWAR_GER_1970_dec_mission_reception_desc:0 "The GDR is emptying through every crack in the Iron Curtain. Gießen, Marienfelde and Friedland need beds, food and work offices - or the welcome will turn sour."
 COLDWAR_GER_1970_dec_nato_summit:0 "NATO Summit Diplomacy"
 COLDWAR_GER_1970_dec_nato_summit_desc:0 "Host the allies, sign the communiqué, be photographed with the American president."
 COLDWAR_GER_1970_dec_open_rivalry_window:0 "Open the Inner-German Relations Window"
 COLDWAR_GER_1970_dec_open_rivalry_window_desc:0 "Climate, escalation ladder, crises, levers, channels and treaties with the GDR are run from the §YInner-German Relations§! window (also on the top bar)."
 COLDWAR_GER_1970_dec_open_security_window:0 "Open the Internal Security Window"
 COLDWAR_GER_1970_dec_open_security_window_desc:0 "The wanted list, the RAF's targets and protection details, the prisons and the crisis staff are run from the §YInternal Security§! window (also on the top bar)."
 COLDWAR_GER_1970_dec_party_congress:0 "Party Congress"
 COLDWAR_GER_1970_dec_party_congress_desc:0 "Rally the chancellor's party behind the government."
 COLDWAR_GER_1970_dec_peace_dialogue:0 "Dialogue with the Peace Movement"
 COLDWAR_GER_1970_dec_peace_dialogue_desc:0 "Invite the organisers of the marches to the chancellery. Listen, explain, give a little."
 COLDWAR_GER_1970_dec_referendum:0 "Put the Question to the People"
 COLDWAR_GER_1970_dec_referendum_desc:0 "A national referendum on a question the Bundestag cannot settle. If the government wins, it has a mandate no opposition can question; if it loses, it has a problem."
 COLDWAR_GER_1970_dec_reopen_unity:0 "Reopen Unity Talks"
 COLDWAR_GER_1970_dec_reopen_unity_desc:0 "The moment has passed once. Try again: new proposals for East Berlin and the Four Powers."
 COLDWAR_GER_1970_dec_solidarity_pact:0 "The Solidarity Pact"
 COLDWAR_GER_1970_dec_solidarity_pact_desc:0 "A tax surcharge for everyone and a long-term financing deal between Bund and Länder for the new states."
 COLDWAR_GER_1970_dec_unity_status:0 "The Unity Talks"
 COLDWAR_GER_1970_dec_unity_status_desc:0 "Phase: §Y[U_Phase]§! | détente months §Y[?cwgg_detente_m|0]§!/36 | chapters agreed §Y[?cwgg_u_agreed|0]§!/5 | failed rounds §Y[?cwgg_u_fail|0]§!/8\nEverything is run from the §YUnity§! tab of the inner-German relations window."
 COLDWAR_GER_1970_dec_vote_of_confidence:0 "Ask for a Vote of Confidence"
 COLDWAR_GER_1970_dec_vote_of_confidence_desc:0 "Article 68: lose a vote of confidence on purpose and the Federal President can dissolve the Bundestag."
 COLDWAR_GER_1970_dec_whip_waverers:0 "Win Back the Waverers"
 COLDWAR_GER_1970_dec_whip_waverers_desc:0 "Long evenings with the deputies who are thinking of crossing the floor: constituencies, committee chairs, a word from the chancellor."
 COLDWAR_GER_1970_deployment_vote:0 "Deployment"
 COLDWAR_GER_1970_deployment_vote_desc:0 "22 November 1983: after two days of debate the Bundestag votes for the deployment of the new American missiles. Outside, the largest protest movement in the Republic's history: human chains from Stuttgart to Ulm, blockades at Mutlangen, 1.3 million demonstrators in a single autumn. The first Pershing IIs arrive the next day."
 COLDWAR_GER_1970_deportation_decree:0 "The Deportation Decree"
 COLDWAR_GER_1970_deportation_decree_desc:0 "'Germany for the Germans': the Directorate's interior ministry orders the deportation of every refugee whose asylum has not been granted, and has the camps cleared by the Federal Border Guard. Lists of foreign workers are being compiled in the labour offices as well. The churches ring their bells in protest; the UN High Commissioner for Refugees flies to Bonn and is not received."
 COLDWAR_GER_1970_deutsche_welle:0 "The Voice from Cologne"
 COLDWAR_GER_1970_deutsche_welle_desc:0 "Deutsche Welle broadcasts in thirty-four languages on short wave, and in the East its German service is jammed less than RIAS or Radio Free Europe. Its editors insist on one thing: the news must be true, including the news Bonn would rather not hear."
 COLDWAR_GER_1970_deutschlandpolitik:0 "Deutschlandpolitik"
 COLDWAR_GER_1970_deutschlandpolitik_category:0 "Deutschlandpolitik"
 COLDWAR_GER_1970_deutschlandpolitik_category_desc:0 "Two states, one nation. Every credit, every prisoner released and every transit agreement moves the balance between §YLegal Position§! and §YChange through Rapprochement§!.\n\nInner-German rapprochement: §Y[?cwger_ostpolitik|0]§! | Berlin access: §Y[?cwger_berlin_access|0]§! | Unity momentum: §Y[?cwger_unity|0]§!\nÜbersiedler from the GDR since 1970: §Y[?cwger_uebersiedler_k|0]§! thousand | Burden of the East: §Y[?cwger_east_burden|0]§!\nGDR crisis index: §Y[?DDR.cwddr_crisis|0]§! | exit pressure: §Y[?DDR.cwddr_exit_pressure|0]§! | hard-currency shortage: §Y[?DDR.cwddr_hard_currency|0]§!\nDependence on Bonn: §Y[?DDR.cwddr_west_dependency|0]§! | SED control: §Y[?DDR.cwddr_sed_control|0]§! | Moscow's guarantee: §Y[?DDR.cwddr_moscow_backing|0]§!"
 COLDWAR_GER_1970_development_ministry:0 "The Development Ministry"
 COLDWAR_GER_1970_development_ministry_desc:0 "The Federal Ministry for Economic Cooperation was founded as an afterthought; under Erhard Eppler it becomes a conscience. Development aid is to be partnership, not charity - and certainly not merely an instrument in the competition with the GDR for the loyalty of the newly independent states. The Foreign Office and the Economics Ministry have rather different views."
 COLDWAR_GER_1970_direct_democracy:0 "Dare More Direct Democracy"
 COLDWAR_GER_1970_direct_democracy_desc:0 "Every Land constitution knows the referendum; the Basic Law knows it only for redrawing the borders of the Länder. The memory of Weimar - of plebiscites used to destroy the Republic - kept the people's vote out of Bonn. A generation later, citizens' initiatives against motorways and power stations ask whether the Federal Republic still needs to be afraid of its own citizens."
 COLDWAR_GER_1970_dm_guest_workers:0 "Guest Workers"
 COLDWAR_GER_1970_dm_gw_sender:0 "Workers in Germany"
 COLDWAR_GER_1970_dm_inner_german:0 "Inner-German Relations"
 COLDWAR_GER_1970_dm_inner_german_ddr:0 "Relations with the Federal Republic"
 COLDWAR_GER_1970_dmark_bloc:0 "The D-Mark Bloc"
 COLDWAR_GER_1970_dmark_bloc_desc:0 "If France says no to Maastricht, there is another way: a smaller hard-currency zone around the D-Mark, with the Benelux countries, Austria and Denmark. A core Europe that works, rather than a big Europe that fails. In Paris and Rome it would look like what it is - a German sphere of influence with a central bank in Frankfurt."
 COLDWAR_GER_1970_donations_committee:0 "The Committee of Inquiry"
 COLDWAR_GER_1970_donations_committee_desc:0 "The Bundestag's committee of inquiry summons party treasurers, accountants, bankers and two former ministers. The Greens ask the questions; everyone else hopes for short memories. Hour by hour, on live television, the Republic learns how its parties were financed - and how much of it nobody remembers."
 COLDWAR_GER_1970_double_track:0 "The Double-Track Decision"
 COLDWAR_GER_1970_double_track_desc:0 "Helmut Schmidt was the first to warn of the gap: the Soviet SS-20 missiles target Western Europe, and NATO has nothing comparable. The alliance answers with a double-track decision: negotiate with Moscow about removing the SS-20 - and if the talks fail, deploy Pershing II and cruise missiles in Western Europe from 1983. Schmidt's own party begins to march against him."
 COLDWAR_GER_1970_dp_hub:0 "Rethinking Deutschlandpolitik"
 COLDWAR_GER_1970_dp_hub_desc:0 "Twenty years of non-recognition have made the Wall higher, not lower. The Hallstein Doctrine is crumbling as one country after another recognises the GDR, and families in Berlin have not seen each other since August 1961. Bonn must decide what it wants from the other German state - recognition, rapprochement or pressure - and how hard it is prepared to push."
 COLDWAR_GER_1970_dragnet:0 "The Computer Dragnet"
 COLDWAR_GER_1970_dragnet_desc:0 "Who pays his electricity bill in cash, rents a flat under a false name and never registers a car? The computer dragnet cross-matches the records of utilities, landlords and railways until only a handful of suspects remain. It is an extraordinary tool against terrorism - and it searches through the private lives of millions of innocent citizens to find one guilty one."
 COLDWAR_GER_1970_dual_key:0 "Two Keys"
 COLDWAR_GER_1970_dual_key_desc:0 "The Pershing Ia missiles at Geilenkirchen belong to the Luftwaffe; the warheads in their bunkers belong to the US Army. One key each, and both must turn before a missile can fly. The arrangement is meant to reassure everyone - Washington, Moscow, the German voter. It also raises a question that nobody wants to answer: who turns his key first?"
 COLDWAR_GER_1970_early_retirement:0 "Early Retirement"
 COLDWAR_GER_1970_early_retirement_desc:0 "1984: workers may retire at fifty-eight if their employer hires a young unemployed person in their place. The unions call it solidarity between the generations; the companies use it to shed older workers at the expense of the pension funds. It lowers the unemployment figures. It also raises a bill that later governments will have to pay."
 COLDWAR_GER_1970_earth_summit:0 "The Earth Summit"
 COLDWAR_GER_1970_earth_summit_desc:0 "Rio de Janeiro, June 1992: a hundred and seventy governments discuss the climate, the forests and the species. The German delegation arrives with the reputation of a country that taught the world the word 'Waldsterben' - and with a chancellor who promises a quarter less carbon dioxide by 2005."
 COLDWAR_GER_1970_eastern_enlargement:0 "Eastern Enlargement"
 COLDWAR_GER_1970_eastern_enlargement_desc:0 "Copenhagen, June 1993: the European Community promises membership to the new democracies of Central and Eastern Europe, provided they meet its conditions. For Germany, the border of the West moves from the Elbe to the Bug. Its eastern neighbours will become its partners in the Union. It is the greatest strategic gain of the post-war era - and the most expensive."
 COLDWAR_GER_1970_eastern_relations:0 "Relations with the East"
 COLDWAR_GER_1970_eastern_relations_desc:0 "After Moscow, Warsaw and Prague, the rest of the Warsaw Pact: diplomatic relations with Budapest and Sofia in December 1973 end the last traces of the Hallstein Doctrine. West German ambassadors now sit in every capital of the East. Trade follows, exchange follows - and with them, quietly, the influence of the richest country in Europe."
 COLDWAR_GER_1970_ec_enlargement:0 "Enlarge the Community"
 COLDWAR_GER_1970_ec_enlargement_desc:0 "De Gaulle twice vetoed Britain's entry into the Community. With the General gone, the door is open: Britain, Ireland and Denmark join in 1973 - and Greece, Spain and Portugal are promised a place once their dictatorships have fallen. Bonn pays a large share of the bill. It also gains partners who will keep the Community from becoming a Franco-German condominium."
 COLDWAR_GER_1970_eco_tax:0 "Ecological Tax Reform"
 COLDWAR_GER_1970_eco_tax_desc:0 "Make energy more expensive and labour cheaper: the ecological tax reform raises taxes on petrol, heating oil and electricity step by step and uses the revenue to lower pension contributions. It is the red-green government's first big bet. The motorists' club rages, the tabloids count every pfennig, and the climate scientists applaud."
 COLDWAR_GER_1970_ecological_restructuring:0 "Ecological Restructuring"
 COLDWAR_GER_1970_ecological_restructuring_desc:0 "'Fortschritt 90' is the SPD's attempt to reconcile the Ruhr with the forest: energy taxes that make pollution expensive, a boom in environmental technology, an industrial policy for a country that has run out of space for smokestacks. The unions fear for the steel and coal jobs; the Greens fear that the SPD will steal their programme. Both are right."
 COLDWAR_GER_1970_economic_war:0 "Economic Warfare"
 COLDWAR_GER_1970_economic_war_desc:0 "Close the back door through which the GDR's goods enter the Common Market duty-free, freeze the Swing, end the credits, stop the purchase of prisoners: let the planners in East Berlin discover what the Deutschmark was really worth to them. Economic warfare could bring the regime to its knees. It would also hit the people it is meant to help first."
 COLDWAR_GER_1970_economy_defence_category:0 "Economy and Defence"
 COLDWAR_GER_1970_economy_defence_category_desc:0 "Imperia Arms Demand: §Y[?global.mdcw_cw_arms|0]§! | Cold War world tension: §Y[?global.mdcw_cw_tension|0]§! | Western integration: §Y[?cwger_westbindung|0]§! | Peace movement: §Y[?cwger_peace_movement|0]§!"
 COLDWAR_GER_1970_elected_president:0 "A President Elected by the People"
 COLDWAR_GER_1970_elected_president_desc:0 "Since 1949 the Federal Convention has chosen the head of state, precisely so that he would have no mandate of his own. A president elected by the people would be a counterweight to the chancellor and a voice beyond the parties - exactly what the fathers of the Basic Law feared after Hindenburg. Times have changed, say the reformers. Have they?"
 COLDWAR_GER_1970_elysee_revival:0 "The Élysée Treaty Revived"
 COLDWAR_GER_1970_elysee_revival_desc:0 "Adenauer and de Gaulle signed the Élysée Treaty in 1963; their successors must give it life. Brandt and Pompidou, Schmidt and Giscard, Kohl and Mitterrand: twice a year the Franco-German governments meet, and whatever they agree becomes Europe's agenda. The couple quarrels often. But Europe moves only when it moves together."
 COLDWAR_GER_1970_embassy_refugees:0 "Refugees in the Embassies"
 COLDWAR_GER_1970_embassy_refugees_desc:0 "Summer 1989: East Germans climb the fences of the West German embassies in Prague, Budapest and Warsaw and camp in the gardens by the thousand. Every one of them, under the Basic Law, is a citizen of the Federal Republic. On 30 September Genscher appears on the balcony in Prague: 'We have come to tell you that today your departure...' The rest is drowned in cheers."
 COLDWAR_GER_1970_emergency_decree:0 "Rule by Emergency Decree"
 COLDWAR_GER_1970_emergency_decree_desc:0 "The emergency laws of 1968 were written for war - for the moment when the Bundestag can no longer meet. The government declares that the war has come from within. Decrees replace laws, the small Joint Committee replaces the Bundestag, and the Basic Law's safeguards are suspended one article at a time. It is all perfectly legal, the ministry insists."
 COLDWAR_GER_1970_emergency_laws_review:0 "Disarm the Emergency Laws"
 COLDWAR_GER_1970_emergency_laws_review_desc:0 "The emergency constitution of 1968 brought hundreds of thousands onto the streets and gave the extra-parliamentary opposition its name. A liberal majority could now tie it more tightly: no decrees without the Constitutional Court's review, no Joint Committee without the Bundesrat, no use of the army at home except in the gravest emergency. The Interior Ministry warns against disarming the state."
 COLDWAR_GER_1970_ems:0 "The European Monetary System"
 COLDWAR_GER_1970_ems_desc:0 "Helmut Schmidt and Valéry Giscard d'Estaing, two former finance ministers, design a new monetary order for Europe: the currencies of the Community bound together in a grid of fixed but adjustable rates. Officially the grid is anchored to a basket called the ECU. In practice everyone knows it is anchored to the D-Mark - and to the Bundesbank's interest rates."
 COLDWAR_GER_1970_end_bretton_woods:0 "Float the Deutschmark"
 COLDWAR_GER_1970_end_bretton_woods_desc:0 "The dollar can no longer hold the system of fixed exchange rates. Speculators buy Deutschmarks by the billion, the Bundesbank prints marks to buy dollars, and imported inflation floods the country. In March 1973 the D-Mark is set free to float - and it rises, and rises. German exports become more expensive; German holidays, cheaper."
 COLDWAR_GER_1970_end_grand_coalition:0 "Each to Its Own Camp"
 COLDWAR_GER_1970_end_grand_coalition_desc:0 "Enough of the marriage of convenience. The chancellor's party wants to govern with a smaller partner again - one it can lead rather than negotiate with. Whether that is possible depends on the arithmetic of the last election. If it is not, the grand coalition may outlive the will to continue it."
 COLDWAR_GER_1970_energy_programme:0 "The Energy Programme"
 COLDWAR_GER_1970_energy_programme_desc:0 "October 1973: the Arab oil embargo turns the lights off on the motorways and puts car-free Sundays on the calendar. The government's energy programme promises a way out: away from oil, coal for security, nuclear power for growth, natural gas from Holland, Norway - and the Soviet Union. Every option has a price, and every price has a constituency against it."
 COLDWAR_GER_1970_energy_savings_act:0 "The Energy Savings Act"
 COLDWAR_GER_1970_energy_savings_act_desc:0 "The cheapest energy is the energy that is never used. Insulation standards for every new building, efficiency rules for heating boilers, a ministry that counts kilowatt-hours. It is not glamorous - no reactors, no pipelines - but within ten years the Federal Republic needs a fifth less oil to produce the same output."
 COLDWAR_GER_1970_environment_ministry:0 "Environment Ministry"
 COLDWAR_GER_1970_environment_ministry_desc:0 "Four weeks after Chernobyl, the Federal Republic finally has a minister for the environment, nature conservation and reactor safety. Walter Wallmann's ministry is to bring together what was scattered across the interior, agriculture and health ministries. For the first time, the environment has a seat at the cabinet table - and a budget to defend."
 COLDWAR_GER_1970_ep_direct_elections:0 "Electing Europe"
 COLDWAR_GER_1970_ep_direct_elections_desc:0 "June 1979: for the first time, the citizens of the Nine elect the European Parliament directly. The Parliament still has few powers - it can be consulted, it can reject the budget, little else. Bonn campaigns for a parliament with real legislative rights, because a Europe that Germany helps to lead must be a Europe that its citizens can control."
 COLDWAR_GER_1970_equal_rights:0 "Equal Pay, Equal Work"
 COLDWAR_GER_1970_equal_rights_desc:0 "The Basic Law has promised equal rights for men and women since 1949; the labour market never quite believed it. In 1980, because Brussels insists, a German statute finally says that women and men must be paid the same for the same work and may not be discriminated against when hired. It is a beginning - and the employers' associations make sure it remains only that."
 COLDWAR_GER_1970_erfurt_kassel:0 "Erfurt and Kassel"
 COLDWAR_GER_1970_erfurt_kassel_desc:0 "March 1970: for the first time, the heads of government of the two German states meet. In Erfurt the crowds break through the police lines and chant 'Willy Brandt ans Fenster!' - Willy Brandt to the window. He appears and raises his hands to calm them. The SED is horrified. In Kassel, two months later, the return visit ends in protests and a torn-down flag."
 COLDWAR_GER_1970_escape_as_policy:0 "Escape as Reason of State"
 COLDWAR_GER_1970_escape_as_policy_desc:0 "Tunnels under the Wall, forged passports, cars with hidden compartments, escape helpers who charge ten thousand marks a head: what was tolerated becomes encouraged, and the Federal Republic makes the escape of its fellow Germans a reason of state. East Berlin calls it 'trafficking in human beings' and demands that Bonn stop it. Bonn does not."
 COLDWAR_GER_1970_ethiopia_famine:0 "Bread for Ethiopia"
 COLDWAR_GER_1970_ethiopia_famine_desc:0 "Pictures from the camps at Korem fill the evening news: a famine in the north of Ethiopia, made worse by a civil war and a Marxist regime that resettles whole villages at gunpoint. Germans donate more than ever before. The government has to decide how to deliver - and to whom."
 COLDWAR_GER_1970_euro_arab_dialogue:0 "The Euro-Arab Dialogue"
 COLDWAR_GER_1970_euro_arab_dialogue_desc:0 "After the oil embargo of 1973 the European Community opens a dialogue with the Arab League: oil for technology, security of supply for a hearing on Palestine. It is a dialogue of the deaf at times - the Europeans want to talk about energy, the Arabs about Israel - but it gives Europe its own voice in the Middle East, one that is not simply an echo of Washington's."
 COLDWAR_GER_1970_euro_founder:0 "Founder of the Euro"
 COLDWAR_GER_1970_euro_founder_desc:0 "The Germans love their D-Mark more than their flag. Giving it up for a common European currency is the price of unity that Paris has asked for - and the Federal Republic sets its own terms: a currency built in the D-Mark's image, an independent central bank in Frankfurt, and a stability pact that will bind every member to budgetary discipline. The Bundestag votes for it. The country is less sure."
 COLDWAR_GER_1970_european_employment_pact:0 "A European Employment Pact"
 COLDWAR_GER_1970_european_employment_pact_desc:0 "Keynes on a continental scale: coordinated wage policy, public investment programmes and pressure on the central banks for lower interest rates across the whole Community. One country alone cannot spend its way to full employment, the chancellor argues - but twelve together might. It all depends on whether Paris is willing to join in."
 COLDWAR_GER_1970_european_peace_order:0 "A European Peace Order"
 COLDWAR_GER_1970_european_peace_order_desc:0 "Not reunification against the East, but a peace order in Europe in which the German question can be solved by consent: the old dream of Brandt and Bahr. It needs years of trust between the blocs, treaties that work in practice, and four victorious powers that are prepared to let the Germans decide their own fate. It is the long road. It may be the only one that leads anywhere."
 COLDWAR_GER_1970_european_seat:0 "A European Seat"
 COLDWAR_GER_1970_european_seat_desc:0 "Not a German seat, but a European one: the foreign minister proposes that the Community speak with one voice in the Security Council, one day with one chair. Paris and London, who already have chairs of their own, listen politely."
 COLDWAR_GER_1970_exit_programme:0 "A Way Out"
 COLDWAR_GER_1970_exit_programme_desc:0 "The Verfassungsschutz offers a way out of the underground: new identities, jobs, protection from former comrades and, where possible, leniency in court. Some of the members who left the RAF in the early 1980s are hiding in the GDR. Others are tired, frightened or simply disillusioned. A door that is open is sometimes more effective than one that is broken down."
 COLDWAR_GER_1970_expo_2000:0 "Expo 2000"
 COLDWAR_GER_1970_expo_2000_desc:0 "Hanover hosts the first world exhibition on German soil: 'Humankind, Nature, Technology - A New World Arising'. A hundred and fifty-five nations build pavilions, the Netherlands stack a forest on top of a farm, and the organisers expect forty million visitors. Eighteen million come. The fair is a financial failure - and a fond memory for those who went."
 COLDWAR_GER_1970_export_world_champion:0 "Export World Champion"
 COLDWAR_GER_1970_export_world_champion_desc:0 "Machine tools from Swabia, chemicals from the Rhine, cars from Wolfsburg and Stuttgart: German industry outsells everyone, dollar or no dollar. 'Made in Germany', once a British warning label, has become a promise of quality. The trade surplus is the pride of the Republic - and an irritation to every trading partner that has to finance it."
 COLDWAR_GER_1970_f122_frigates:0 "Bremen-Class Frigates"
 COLDWAR_GER_1970_f122_frigates_desc:0 "Eight Bremen-class frigates for the North Sea and the Atlantic: the Bundesmarine leaves the narrow waters of the Baltic behind and takes its place among NATO's ocean-going escorts, protecting the convoys that would bring American reinforcements across the Atlantic in a war. The navy of a continental power learns to sail the open sea."
 COLDWAR_GER_1970_family_law_reform:0 "Marriage and Family Law Reform"
 COLDWAR_GER_1970_family_law_reform_desc:0 "The Civil Code still assumes that a wife keeps house and needs her husband's permission to take a job. The reform rewrites marriage law from the ground up: divorce on the breakdown of the marriage rather than on proven guilt, maintenance after divorce, and no single model of family life written into law. The churches protest from the pulpit. Many families had stopped living by the old rules long ago."
 COLDWAR_GER_1970_far_right_watch:0 "Watch the Far Right"
 COLDWAR_GER_1970_far_right_watch_desc:0 "Wehrsportgruppen training in the woods, weapons caches buried in Lower Saxony, neo-Nazi rock concerts in village halls: for too long right-wing violence was counted as ordinary crime and the far right dismissed as a handful of old men and confused youths. The bomb at the Oktoberfest in 1980 ends that comfortable illusion. The state has to look to its right."
 COLDWAR_GER_1970_fast_breeder:0 "The Plutonium Economy"
 COLDWAR_GER_1970_fast_breeder_desc:0 "Kalkar's fast breeder, the thorium reactor at Hamm, a reprocessing plant at Wackersdorf: the dream of a plutonium economy that produces more fuel than it consumes. They are the great prestige projects of German nuclear research - billions of marks invested, decades of planning. They may never deliver a single kilowatt-hour to the grid."
 COLDWAR_GER_1970_federal_president:0 "A President Above the Parties"
 COLDWAR_GER_1970_federal_president_desc:0 "Heinemann, Scheel, Carstens, Weizsäcker: the Federal President has little power and great authority. His election by the Federal Convention is a test of the coalitions to come, and his speeches can say what no chancellor dares. A president above the parties is a resource - if the government chooses him wisely."
 COLDWAR_GER_1970_federal_property_protection:0 "Protecting the Federal Republic"
 COLDWAR_GER_1970_federal_property_protection_desc:0 "The Federal Border Guard, created to defend the inner-German border, finds itself a new role: the protection of federal buildings, airports, embassies and nuclear installations. Its officers in green uniforms become a familiar sight at Frankfurt airport. Critics warn that the Federal Republic is building a national police force by the back door."
 COLDWAR_GER_1970_feed_in_law:0 "The Feed-In Law"
 COLDWAR_GER_1970_feed_in_law_desc:0 "A backbench law, passed almost without debate in December 1990: the utilities must buy electricity from wind and solar plants at a fixed price. Two members of the Bundestag, one CSU and one Green, wrote it together. Nobody in the energy companies takes it seriously. It will change the German landscape more than any reactor."
 COLDWAR_GER_1970_finance_reform:0 "Reforming the Federal Finances"
 COLDWAR_GER_1970_finance_reform_desc:0 "Who pays for universities, hospitals and motorways - the Federation or the Länder? The grand coalition untangles the federal finances: joint tasks shared between Bonn and the state capitals, a fiscal equalisation that the rich south hates and the poor north needs. It is dry, complicated and decisive for how the Republic will function for decades."
 COLDWAR_GER_1970_first_green_minister:0 "Sneakers in the Ministry"
 COLDWAR_GER_1970_first_green_minister_desc:0 "December 1985: Joschka Fischer takes the oath as Hesse's environment minister in white trainers and a tweed jacket. The photograph goes around the world. The Greens have arrived in power - and must now learn what power means: civil servants, budgets, compromises with the SPD and the Hanau nuclear plants that refuse to close themselves."
 COLDWAR_GER_1970_first_past_the_post:0 "First Past the Post"
 COLDWAR_GER_1970_first_past_the_post_desc:0 "The Grand Coalition promised it in 1966: British-style constituencies, one member per seat, the strongest candidate wins - and the FDP would vanish from the Bundestag. Whoever now governs with a majority of their own could finish the job and end coalition politics for good. The smaller parties call it a coup by electoral law, and they are not entirely wrong."
 COLDWAR_GER_1970_flick_affair:0 "The Flick Affair"
 COLDWAR_GER_1970_flick_affair_desc:0 "The tax investigators were looking for evasion. What they found was a ledger: 'cultivating the political landscape', and next to it the names of almost every party treasurer in Bonn - and of two economics ministers. The Flick group paid millions to the parties while asking the government for tax relief on its share sales. The Republic learns what its politics cost, and who paid."
 COLDWAR_GER_1970_focus:0 "The Bonn Republic"
 COLDWAR_GER_1970_follow_washington:0 "Loyal to Washington"
 COLDWAR_GER_1970_follow_washington_desc:0 "Whatever the White House decides, Bonn will not be the ally that makes trouble. The Federal Republic's security depends on American guarantees and American soldiers, not on speeches from Paris or initiatives from the peace movement. It is not servility, says the government. It is a sober reading of where the tanks stand."
 COLDWAR_GER_1970_foreign_policy_category:0 "Germany in the World"
 COLDWAR_GER_1970_foreign_policy_category_desc:0 "Party foundations and development aid make the Federal Republic a power without an army abroad. Campaigns use Imperia §YPublic Political Support§!, aid uses Imperia §Yassistance programmes§!."
 COLDWAR_GER_1970_forward_defence:0 "Forward Defence"
 COLDWAR_GER_1970_forward_defence_desc:0 "Not a metre of German soil is to be given up: NATO's strategy of forward defence means fighting at the inner-German border from the first hour rather than retreating to the Rhine. The Bundeswehr's corps dig in along the border, and their exercises are meant to be seen from the other side. Deterrence, after all, only works if the enemy believes in it."
 COLDWAR_GER_1970_four_power_conference:0 "A Conference of the Four Powers"
 COLDWAR_GER_1970_four_power_conference_desc:0 "Bonn invites the foreign ministers of the Four Powers - the United States, the Soviet Union, Britain and France - to sit with both German states at one table. Two plus four, not four plus two: the Germans negotiate their own future, but nothing is signed until the victors of 1945 have given up their rights. It is the formula that will end the post-war era."
 COLDWAR_GER_1970_franco_german_brigade:0 "The Franco-German Brigade"
 COLDWAR_GER_1970_franco_german_brigade_desc:0 "A brigade of German and French soldiers under a single command from 1989, the Eurocorps in Strasbourg after 1992: the beginnings of a European pillar inside the Atlantic alliance. Washington worries that Europe might build an alternative to NATO. Paris hopes so. Bonn insists, as always, that it wants both."
 COLDWAR_GER_1970_franco_german_youth:0 "The Youth Office"
 COLDWAR_GER_1970_franco_german_youth_desc:0 "Since 1963 the Franco-German Youth Office has sent millions of pupils and students across the Rhine: exchange programmes, twinned towns, summer camps where former enemies' grandchildren learn each other's languages. Bonn doubles its budget. The generation that grows up this way will find it hard to imagine that their grandparents fought three wars."
 COLDWAR_GER_1970_freiburg_theses:0 "The Freiburg Theses"
 COLDWAR_GER_1970_freiburg_theses_desc:0 "In Freiburg the Free Democrats write themselves a new soul: social liberalism. Property that carries obligations, co-determination, environmental protection long before anyone else speaks of it, and a liberal state that guarantees freedom in society rather than merely from the state. For a few years the FDP is the most interesting party in Bonn."
 COLDWAR_GER_1970_fulda_barrier:0 "Barrier Plans for the Fulda Gap"
 COLDWAR_GER_1970_fulda_barrier_desc:0 "The Fulda Gap is where NATO's planners expect the Soviet tank armies to attack: the shortest route to Frankfurt and the Rhine. Prepared demolition shafts in every bridge and road near the border, barrier materials in depots, plans to flood the valleys - and never, officially, a fortification, because a wall would admit that the border is permanent."
 COLDWAR_GER_1970_fundis:0 "Fundis Hold the Line"
 COLDWAR_GER_1970_fundis_desc:0 "No coalitions with the parties of the arms race, rotation of every mandate, withdrawal from NATO and an end to nuclear power without compromise. The fundamentalists keep the Greens pure and keep them in opposition. For their voters that is a programme; for the SPD, which needs a partner, it is a problem."
 COLDWAR_GER_1970_g7_bonn:0 "The Bonn Summit"
 COLDWAR_GER_1970_g7_bonn_desc:0 "The world economic summit comes to the Rhine. The leaders of the seven largest Western economies meet in the Palais Schaumburg and on the terrace of the Petersberg hotel. Germany is asked to lead - to stimulate its economy, to open its markets, to stabilise the currencies - and, as always, to pay. The chancellor can play host to the world."
 COLDWAR_GER_1970_gas_for_pipes:0 "Gas for Pipes"
 COLDWAR_GER_1970_gas_for_pipes_desc:0 "February 1970: Mannesmann supplies large-diameter steel pipes, German banks provide the credit, and the Soviet Union pays with natural gas delivered through those same pipes for twenty years. The first great deal of Ostpolitik binds the Ruhr to Siberia. Washington is suspicious. The Ruhr's steelworkers are delighted."
 COLDWAR_GER_1970_genscher_colombo:0 "The Genscher-Colombo Plan"
 COLDWAR_GER_1970_genscher_colombo_desc:0 "November 1981: the German and Italian foreign ministers propose a 'European Act' - a common foreign policy, cooperation on security and culture, and majority decisions instead of the unanimity that paralyses the Council. The other governments listen, praise, and water it down into a 'Solemn Declaration'. The ideas will return in the Single European Act."
 COLDWAR_GER_1970_genscher_foreign_office:0 "Genscher at the Foreign Office"
 COLDWAR_GER_1970_genscher_foreign_office_desc:0 "Hans-Dietrich Genscher will serve longer as foreign minister than anyone in the Western world: détente without illusions, Western integration without servility, an endless round of visits from which he returns before anyone notices he has left. In Washington they invent a word for his policy - Genscherism - and they do not mean it kindly."
 COLDWAR_GER_1970_german_bomb:0 "A German Bomb Programme"
 COLDWAR_GER_1970_german_bomb_desc:0 "The taboo of 1945 breaks. Engineers from Karlsruhe and Jülich, uranium from Gronau, a delivery system borrowed from NATO's own arsenals and a test site that does not yet exist. Every government from Washington to Moscow, from London to Paris, will ask the same question - and the answer will decide whether the Federal Republic remains a member of the Western world."
 COLDWAR_GER_1970_goethe_in_the_east:0 "Goethe Goes East"
 COLDWAR_GER_1970_goethe_in_the_east_desc:0 "The Wall has fallen and suddenly everyone east of the Oder wants to learn German: Goethe-Institutes open in Moscow, Kiev, Riga and Almaty, teachers are flown to Prague and Budapest, and the German language becomes, for a few years, the lingua franca of a continent in transition."
 COLDWAR_GER_1970_goethe_worldwide:0 "A Goethe-Institut in Every Capital"
 COLDWAR_GER_1970_goethe_worldwide_desc:0 "One hundred and thirty institutes, from Lagos to La Paz, teach German, show Fassbinder and invite local writers to read. They are paid for by the Foreign Office and answer to nobody in it - a freedom that diplomats curse whenever an institute hosts the wrong dissident on the wrong evening."
 COLDWAR_GER_1970_government_statement:0 "The Government Statement"
 COLDWAR_GER_1970_government_statement_desc:0 "28 October 1969. Willy Brandt stands before the Bundestag as the first Social Democratic chancellor in forty years. He promises to 'dare more democracy', to seek a regulated coexistence with the other German state and to keep the Federal Republic firmly anchored in the West. The coalition of SPD and FDP holds twelve seats more than the opposition. Everything else is still open."
 COLDWAR_GER_1970_grand_coalition:0 "A Grand Coalition"
 COLDWAR_GER_1970_grand_coalition_desc:0 "When neither camp has a majority, the two big parties govern together - as in 1966. A grand coalition can change the Basic Law and pass reforms that neither side could manage alone. It also leaves the opposition to the small parties and the street, and both have a habit of growing."
 COLDWAR_GER_1970_green_dot:0 "The Green Dot"
 COLDWAR_GER_1970_green_dot_desc:0 "Packaging must be taken back by whoever sells it: the Packaging Ordinance and the Duales System with its Green Dot make recycling a national habit. Every German kitchen now has four bins, and every German citizen an opinion on the correct way to sort a yoghurt pot. The rest of Europe watches with amusement - and then copies it."
 COLDWAR_GER_1970_green_unilateralism:0 "Swords into Ploughshares"
 COLDWAR_GER_1970_green_unilateralism_desc:0 "Swords into ploughshares: the Greens demand unilateral disarmament, the withdrawal of all nuclear weapons from German soil and an end to the blocs in East and West. Their Bundestag group tables the motions every month and loses them every month. In the peace movement, every defeat is a victory of conscience."
 COLDWAR_GER_1970_greens_merge:0 "Alliance 90/The Greens"
 COLDWAR_GER_1970_greens_merge_desc:0 "1993: the West German Greens merge with the East German civil rights movement Alliance 90. The party of 1968 meets the people of 1989 - pastors, environmental activists and dissidents who brought down the SED. It is a union of very different biographies: one side fought the West's state, the other a dictatorship."
 COLDWAR_GER_1970_greens_parliament:0 "The Greens Enter the Bundestag"
 COLDWAR_GER_1970_greens_parliament_desc:0 "They arrive in the Bundestag in jumpers, with sunflowers and with their children: ecological, social, grassroots-democratic and non-violent. The Greens refuse to behave like a party, rotate their members of parliament every two years and bring the peace movement, the anti-nuclear protests and the women's movement into the chamber. The old parties do not yet know whether to laugh or to worry."
 COLDWAR_GER_1970_gronau_enrichment:0 "Centrifuges at Gronau"
 COLDWAR_GER_1970_gronau_enrichment_desc:0 "The uranium enrichment plant at Gronau, run with the British and the Dutch, is civilian - officially, and under international safeguards. A few more cascades of centrifuges, a few fewer inspectors, and the Federal Republic would be months away from weapons-grade uranium. Nobody in Bonn says this aloud. Everyone in Washington and Moscow knows it."
 COLDWAR_GER_1970_gsg9:0 "Found GSG 9"
 COLDWAR_GER_1970_gsg9_desc:0 "Fürstenfeldbruck, September 1972: the Bavarian police's rescue attempt ends with all nine Israeli hostages dead. Never again, says Interior Minister Genscher, and gives Ulrich Wegener the task of building a counter-terror unit inside the Federal Border Guard. Its name is deliberately boring: Border Guard Group 9. Its standards are not."
 COLDWAR_GER_1970_gsg9_global:0 "A Worldwide Mandate"
 COLDWAR_GER_1970_gsg9_global_desc:0 "Mogadishu, October 1977: Lufthansa flight 181 is stormed in seven minutes and all eighty-six passengers are freed. GSG 9 becomes a legend overnight. Its mandate is now worldwide: wherever a German aircraft or embassy is held hostage, with the consent of the host country, the men from St. Augustin can go."
 COLDWAR_GER_1970_gsg9_training:0 "Training with the SAS"
 COLDWAR_GER_1970_gsg9_training_desc:0 "Wegener's men train with the British SAS at Hereford and with the Israeli special forces, test stun grenades, practise the storming of aircraft on disused runways and shoot by night at Hangelar. Every exercise is meant for one moment that may never come - and if it comes, there will be only a few seconds to get it right."
 COLDWAR_GER_1970_guest_worker_policy:0 "The Guest Workers Stay"
 COLDWAR_GER_1970_guest_worker_policy_desc:0 "The recruitment stop of November 1973 ends the hiring of guest workers - but not the immigration. Those who are here stay, because leaving would mean never coming back, and their families follow. The Federal Republic is becoming a country of immigration, with Turkish grocers in Kreuzberg and Italian ice-cream parlours in every town. It refuses to admit it."
 COLDWAR_GER_1970_gw_family_reunification:0 "Wives and Children"
 COLDWAR_GER_1970_gw_family_reunification_desc:0 "The guests were supposed to go home after a year or two. They stayed, and now their wives and children are following them: whole streets in Kreuzberg, Duisburg-Marxloh and Cologne-Mülheim where Turkish, Greek and Serbo-Croat are spoken in the shops. The schools are not ready. The cities ask Bonn who is going to pay."
 COLDWAR_GER_1970_gw_guests_to_citizens:0 "From Guests to Citizens"
 COLDWAR_GER_1970_gw_guests_to_citizens_desc:0 "Twenty years after the first special train arrived at Munich, the children of the guest workers speak German better than their parents' language and support Schalke or Bayern. A commissioner for foreigners, language courses for adults, the right to vote in local elections: the Republic begins to treat those who stayed as what they have become - its own people."
 COLDWAR_GER_1970_gw_korea:0 "Miners and Nurses from Korea"
 COLDWAR_GER_1970_gw_korea_desc:0 "The strangest of the agreements: since 1963 young South Koreans have come to work underground in the Ruhr pits, and since 1966 Korean nurses have staffed German hospitals. Seoul uses their wages to finance its industrialisation and asks for more places. The hospitals, short of staff, would gladly agree."
 COLDWAR_GER_1970_gw_maghreb:0 "Morocco and Tunisia"
 COLDWAR_GER_1970_gw_maghreb_desc:0 "The agreements with Rabat and Tunis are the smallest of all: miners for the Ruhr, labourers for the building sites, contracts limited to two years and no right to bring families. The two kingdoms - one a monarchy, one a republic of a single man - want more places. Bonn is not sure it wants to give them."
 COLDWAR_GER_1970_gw_open_doors:0 "Keep the Doors Open"
 COLDWAR_GER_1970_gw_open_doors_desc:0 "The oil shock will pass, argues the employers' federation, and the demographers are already warning of a country with too few children. Bonn refuses to stop recruiting: the German Commissions stay open, the contracts are made permanent, and the Federal Republic admits - quietly - that it has become a country of immigration."
 COLDWAR_GER_1970_gw_recruitment:0 "Recruiting Abroad"
 COLDWAR_GER_1970_gw_recruitment_desc:0 "The economic miracle has run out of Germans. Since 1955 the Federal Labour Office has run 'German Commissions' in Verona, Madrid, Athens and Istanbul: doctors examine the applicants' teeth and lungs, officials check their papers, and special trains carry them north to Munich main station. Industry wants more of them every year. The question is from where - and on whose terms."
 COLDWAR_GER_1970_gw_recruitment_stop:0 "The Recruitment Stop"
 COLDWAR_GER_1970_gw_recruitment_stop_desc:0 "November 1973: the oil embargo has begun, short-time work is spreading and the labour minister stops all further recruitment from outside the Community overnight. Nobody new may come. But the millions who are already here now face a choice: go home and never come back - or stay for good. Most of them stay."
 COLDWAR_GER_1970_gw_southern_europe:0 "Spain, Portugal, Greece"
 COLDWAR_GER_1970_gw_southern_europe_desc:0 "From Andalusia, the Minho and Macedonia they come to Wolfsburg, Rüsselsheim and the Swabian machine shops, sending home the money that builds new houses in villages that have only ever known emigration. All three countries are dictatorships for now. All three need the jobs more than they would like to admit."
 COLDWAR_GER_1970_gw_turkey:0 "The Istanbul Office"
 COLDWAR_GER_1970_gw_turkey_desc:0 "The recruitment agreement with Turkey was signed in 1961 almost as an afterthought, to please a NATO ally. Ten years later the German Commission in Istanbul is the busiest of them all: young men from Anatolia queue for days for a medical examination and a one-way ticket to Cologne or Duisburg. Ankara wants the jobs and the hard currency. Bonn wants the hands."
 COLDWAR_GER_1970_gw_yugoslavia:0 "Workers from Tito's Yugoslavia"
 COLDWAR_GER_1970_gw_yugoslavia_desc:0 "The only socialist country that lets its citizens work in the West: since 1968 Belgrade has sent hundreds of thousands to Stuttgart, Munich and Frankfurt. Tito calls it temporary employment abroad; his planners call it the safety valve for an unemployment that officially does not exist. The remittances keep the dinar alive."
 COLDWAR_GER_1970_helsinki:0 "Helsinki"
 COLDWAR_GER_1970_helsinki_desc:0 "August 1975, Helsinki: thirty-five heads of government sign the Final Act of the Conference on Security and Cooperation in Europe. Moscow gets what it wanted - the borders of post-war Europe accepted by the West. The West gets something that seems harmless: human rights and freedom of movement written down in Basket Three. Dissidents in the East will hold their rulers to every word."
 COLDWAR_GER_1970_hermes_cover:0 "Hermes Cover"
 COLDWAR_GER_1970_hermes_cover_desc:0 "A Hamburg insurer underwrites the risk on behalf of the Federal Government: if the buyer in Baghdad, Lagos or Moscow does not pay, Bonn does. Hermes guarantees make German exporters the most fearless in the world - and the taxpayer the silent partner of every contract."
 COLDWAR_GER_1970_high_speed_rail:0 "The New Lines"
 COLDWAR_GER_1970_high_speed_rail_desc:0 "Hanover to Würzburg, Mannheim to Stuttgart: the first entirely new railway lines built in Germany since the days of the Empire, with tunnels through every hill and bridges over every valley, ready for trains at 250 kilometres an hour. In 1991 the InterCity Express goes into service. The railway is back in the age of the motorway."
 COLDWAR_GER_1970_home_defence:0 "Territorial Army"
 COLDWAR_GER_1970_home_defence_desc:0 "While the field army fights at the border, someone has to hold the rear: bridges, depots, airfields, the roads on which the American reinforcements will move. The Territorial Army's Heimatschutz brigades consist of reservists who train a few weeks a year and would be mobilised within days. They are the army of the second line. In a war, there may not be a first line for long."
 COLDWAR_GER_1970_host_nation_support:0 "Host Nation Support"
 COLDWAR_GER_1970_host_nation_support_desc:0 "In a crisis, hundreds of thousands of American soldiers would fly to Germany to collect their equipment from depots in the Rhineland and drive to the border. The Wartime Host Nation Support Agreement of 1982 promises them 90,000 German reservists to move, supply and guard them - lorries, fuel, railway wagons and hospital beds. It is the logistics of deterrence."
 COLDWAR_GER_1970_housing_programme:0 "Social Housing"
 COLDWAR_GER_1970_housing_programme_desc:0 "Märkisches Viertel, Neuperlach, Chorweiler: satellite towns at the edge of every big city, with concrete towers, district heating and underground car parks. In 1972 they are modern and a promise of decent housing for all. By 1985 many have become problem estates. The architects have moved on; the tenants have not."
 COLDWAR_GER_1970_human_rights_policy:0 "Human Rights as Foreign Policy"
 COLDWAR_GER_1970_human_rights_policy_desc:0 "Since Helsinki, human rights are no longer an internal affair of the East. Bonn has signed Basket Three and now has to decide what it is worth: a weapon against Moscow, a lever for East German families, or a principle that applies to friends as much as to enemies."
 COLDWAR_GER_1970_humboldt_fellows:0 "Scholarships for the World"
 COLDWAR_GER_1970_humboldt_fellows_desc:0 "DAAD and the Humboldt Foundation bring a hundred thousand students and scholars a year to German universities. Many go home as ministers, judges and professors - and keep a soft spot for Heidelberg, Göttingen or Tübingen for the rest of their lives."
 COLDWAR_GER_1970_hungarian_border:0 "The Hungarian Door"
 COLDWAR_GER_1970_hungarian_border_desc:0 "May 1989: Hungary begins cutting the barbed wire on its border with Austria. Thousands of East Germans on holiday at Lake Balaton camp in Budapest, waiting for the door to open. Bonn can help Budapest decide - with a credit of five hundred million marks, and with the assurance that Hungary will not be left alone when East Berlin and Moscow protest."
 COLDWAR_GER_1970_idea_army_structure_4:0 "Army Structure 4"
 COLDWAR_GER_1970_idea_army_structure_4_desc:0 "Thirty-six heavy brigades."
 COLDWAR_GER_1970_idea_army_structure_5:0 "Army Structure 5"
 COLDWAR_GER_1970_idea_army_structure_5_desc:0 "370,000 soldiers."
 COLDWAR_GER_1970_idea_asylum_crisis:0 "The Asylum Debate"
 COLDWAR_GER_1970_idea_asylum_crisis_desc:0 "438,000 applications in one year."
 COLDWAR_GER_1970_idea_aufbau_ost:0 "Aufbau Ost"
 COLDWAR_GER_1970_idea_aufbau_ost_desc:0 "A trillion marks for the new Länder."
 COLDWAR_GER_1970_idea_bmz:0 "Development Ministry"
 COLDWAR_GER_1970_idea_bmz_desc:0 "Development aid as foreign policy."
 COLDWAR_GER_1970_idea_bonn_republic:0 "Bonn Is Not Weimar"
 COLDWAR_GER_1970_idea_bonn_republic_desc:0 "Constructive votes of no confidence, a 5% hurdle, a Constitutional Court and militant democracy: the Basic Law was written against the failures of 1933."
 COLDWAR_GER_1970_idea_bundesbank_credibility:0 "Bundesbank Credibility"
 COLDWAR_GER_1970_idea_bundesbank_credibility_desc:0 "Frankfurt fights inflation whatever Bonn wants."
 COLDWAR_GER_1970_idea_car_free_sundays:0 "Car-Free Sundays"
 COLDWAR_GER_1970_idea_car_free_sundays_desc:0 "Empty motorways, a speed limit and a nation on bicycles."
 COLDWAR_GER_1970_idea_centralised_state:0 "A Centralised State"
 COLDWAR_GER_1970_idea_centralised_state_desc:0 "The Länder are administrative districts; Berlin decides."
 COLDWAR_GER_1970_idea_codetermination:0 "Co-determination"
 COLDWAR_GER_1970_idea_codetermination_desc:0 "Employees sit on the supervisory boards of large companies."
 COLDWAR_GER_1970_idea_cultural_diplomacy:0 "Cultural Foreign Policy"
 COLDWAR_GER_1970_idea_cultural_diplomacy_desc:0 "Goethe-Institut, Deutsche Welle, DAAD."
 COLDWAR_GER_1970_idea_dark_regime:0 "The National Directorate"
 COLDWAR_GER_1970_idea_dark_regime_desc:0 "Elections suspended, the Bundestag adjourned, the press licensed. A state that was built against 1933 has fallen to the same temptation."
 COLDWAR_GER_1970_idea_ddr_abgrenzung:0 "Abgrenzung"
 COLDWAR_GER_1970_idea_ddr_abgrenzung_desc:0 "Demarcation: the GDR seals itself off from the West, ideologically and physically."
 COLDWAR_GER_1970_idea_ddr_crackdown:0 "The Chinese Solution"
 COLDWAR_GER_1970_idea_ddr_crackdown_desc:0 "The regime has fired on its own people."
 COLDWAR_GER_1970_idea_ddr_round_table:0 "The Round Table"
 COLDWAR_GER_1970_idea_ddr_round_table_desc:0 "Party, churches and civic movements negotiate the future."
 COLDWAR_GER_1970_idea_deutscher_herbst:0 "German Autumn"
 COLDWAR_GER_1970_idea_deutscher_herbst_desc:0 "Kidnappings, hijackings, a crisis staff that governs."
 COLDWAR_GER_1970_idea_development_partner:0 "Development Partnerships"
 COLDWAR_GER_1970_idea_development_partner_desc:0 "Wells, roads and schools."
 COLDWAR_GER_1970_idea_dmark_bloc:0 "The D-Mark Bloc"
 COLDWAR_GER_1970_idea_dmark_bloc_desc:0 "A hard-currency zone around Frankfurt."
 COLDWAR_GER_1970_idea_dual_system:0 "Dual Vocational Training"
 COLDWAR_GER_1970_idea_dual_system_desc:0 "Apprenticeships in firm and school."
 COLDWAR_GER_1970_idea_eco_tax:0 "Ecological Tax Reform"
 COLDWAR_GER_1970_idea_eco_tax_desc:0 "Tax energy, relieve labour."
 COLDWAR_GER_1970_idea_ems:0 "European Monetary System"
 COLDWAR_GER_1970_idea_ems_desc:0 "European currencies tied to a grid anchored on the D-Mark."
 COLDWAR_GER_1970_idea_euro_founder:0 "Founder of the Euro"
 COLDWAR_GER_1970_idea_euro_founder_desc:0 "A currency built in the image of the D-Mark."
 COLDWAR_GER_1970_idea_export_champion:0 "Export World Champion"
 COLDWAR_GER_1970_idea_export_champion_desc:0 "Made in Germany sells everywhere."
 COLDWAR_GER_1970_idea_extraparliamentary_opposition:0 "The Children of 1968"
 COLDWAR_GER_1970_idea_extraparliamentary_opposition_desc:0 "The extra-parliamentary opposition has split: into the SPD, into the citizens' initiatives, into the K-groups - and into the underground."
 COLDWAR_GER_1970_idea_fading_miracle:0 "The Fading Miracle"
 COLDWAR_GER_1970_idea_fading_miracle_desc:0 "Growth is slowing, the labour market is empty and the unions want a share of twenty years of prosperity."
 COLDWAR_GER_1970_idea_floating_dmark:0 "A Floating Deutschmark"
 COLDWAR_GER_1970_idea_floating_dmark_desc:0 "The D-Mark rises against the dollar: cheaper oil, dearer exports."
 COLDWAR_GER_1970_idea_flue_gas_law:0 "Flue Gas Desulphurisation"
 COLDWAR_GER_1970_idea_flue_gas_law_desc:0 "Filters for every coal power plant."
 COLDWAR_GER_1970_idea_frontline_state:0 "Frontline State"
 COLDWAR_GER_1970_idea_frontline_state_desc:0 "Twenty Soviet divisions stand behind the inner-German border. The Fulda Gap is the most planned battlefield on earth."
 COLDWAR_GER_1970_idea_german_confederation:0 "German Confederation"
 COLDWAR_GER_1970_idea_german_confederation_desc:0 "Two states, one nation, common institutions."
 COLDWAR_GER_1970_idea_gsfg_alert:0 "Forces in Germany on Alert"
 COLDWAR_GER_1970_idea_gsfg_alert_desc:0 "The twenty divisions of the Group of Soviet Forces in Germany leave their barracks for their deployment areas."
 COLDWAR_GER_1970_idea_guest_workers:0 "Guest Workers"
 COLDWAR_GER_1970_idea_guest_workers_desc:0 "Italians, Spaniards, Greeks, Yugoslavs and Turks build the cars - and are expected to leave one day."
 COLDWAR_GER_1970_idea_hallstein_legacy:0 "The Hallstein Doctrine's Shadow"
 COLDWAR_GER_1970_idea_hallstein_legacy_desc:0 "For fifteen years Bonn broke relations with anyone who recognised the GDR. The doctrine is dying, but the reflex remains."
 COLDWAR_GER_1970_idea_inner_unity:0 "Inner Unity"
 COLDWAR_GER_1970_idea_inner_unity_desc:0 "One state, two societies."
 COLDWAR_GER_1970_idea_integration_policy:0 "Country of Immigration"
 COLDWAR_GER_1970_idea_integration_policy_desc:0 "The guest workers stay - and so do their children."
 COLDWAR_GER_1970_idea_kohl_system:0 "The Kohl System"
 COLDWAR_GER_1970_idea_kohl_system_desc:0 "Patience, loyalty and the telephone."
 COLDWAR_GER_1970_idea_kohlepfennig:0 "The Coal Penny"
 COLDWAR_GER_1970_idea_kohlepfennig_desc:0 "Every electricity bill pays for German coal."
 COLDWAR_GER_1970_idea_mixed_economy:0 "A Mixed Economy"
 COLDWAR_GER_1970_idea_mixed_economy_desc:0 "The unity treaty kept key industries, banks and land in public hands: a German 'third way' between the systems."
 COLDWAR_GER_1970_idea_neutral_germany:0 "Neutral Germany"
 COLDWAR_GER_1970_idea_neutral_germany_desc:0 "Unity bought with neutrality between the blocs."
 COLDWAR_GER_1970_idea_new_constitution:0 "A Constitution for All Germans"
 COLDWAR_GER_1970_idea_new_constitution_desc:0 "The Basic Law is replaced by a constitution adopted by the whole people."
 COLDWAR_GER_1970_idea_north_south:0 "North-South Dialogue"
 COLDWAR_GER_1970_idea_north_south_desc:0 "The Brandt Commission's legacy."
 COLDWAR_GER_1970_idea_nuclear_buildout:0 "Nuclear Build-Out"
 COLDWAR_GER_1970_idea_nuclear_buildout_desc:0 "Fifty reactors are planned."
 COLDWAR_GER_1970_idea_nuclear_sharing:0 "Nuclear Participation"
 COLDWAR_GER_1970_idea_nuclear_sharing_desc:0 "No German bomb - but German aircraft, German missiles and a seat in NATO's Nuclear Planning Group."
 COLDWAR_GER_1970_idea_officer_education:0 "Academic Officers"
 COLDWAR_GER_1970_idea_officer_education_desc:0 "Educated officers for a democratic army."
 COLDWAR_GER_1970_idea_open_borders:0 "Schengen"
 COLDWAR_GER_1970_idea_open_borders_desc:0 "No more controls at the inner European borders."
 COLDWAR_GER_1970_idea_peace_movement_idea:0 "The Peace Movement"
 COLDWAR_GER_1970_idea_peace_movement_idea_desc:0 "Hundreds of thousands in the Hofgarten."
 COLDWAR_GER_1970_idea_planned_economy:0 "A Planned Economy for All Germany"
 COLDWAR_GER_1970_idea_planned_economy_desc:0 "The unity treaty nationalised the West's industry. The planners in Berlin now run Siemens and Daimler."
 COLDWAR_GER_1970_idea_radicals_decree:0 "The Radicals Decree"
 COLDWAR_GER_1970_idea_radicals_decree_desc:0 "Loyalty checks for every public servant."
 COLDWAR_GER_1970_idea_red_green_project:0 "The Red-Green Project"
 COLDWAR_GER_1970_idea_red_green_project_desc:0 "A government of the generation of 1968."
 COLDWAR_GER_1970_idea_second_cold_war:0 "The Second Cold War"
 COLDWAR_GER_1970_idea_second_cold_war_desc:0 "The Wall stands again."
 COLDWAR_GER_1970_idea_security_state:0 "Security State"
 COLDWAR_GER_1970_idea_security_state_desc:0 "The state has given itself extraordinary powers."
 COLDWAR_GER_1970_idea_single_market:0 "Single European Market"
 COLDWAR_GER_1970_idea_single_market_desc:0 "Goods, capital, services and people without borders."
 COLDWAR_GER_1970_idea_socialist_unity:0 "The Socialist Unity of Germany"
 COLDWAR_GER_1970_idea_socialist_unity_desc:0 "By treaty and with the consent of all Four Powers, the German Democratic Republic has become the state of all Germans."
 COLDWAR_GER_1970_idea_soli:0 "Solidarity Surcharge"
 COLDWAR_GER_1970_idea_soli_desc:0 "A supplement on income tax for the East."
 COLDWAR_GER_1970_idea_soviet_gas:0 "Siberian Gas"
 COLDWAR_GER_1970_idea_soviet_gas_desc:0 "Pipes for gas, gas for decades."
 COLDWAR_GER_1970_idea_stagflation:0 "Stagflation"
 COLDWAR_GER_1970_idea_stagflation_desc:0 "Prices rise while the jobs disappear."
 COLDWAR_GER_1970_idea_strauss_government:0 "Chancellor Strauß"
 COLDWAR_GER_1970_idea_strauss_government_desc:0 "Polarising, brilliant, unpredictable."
 COLDWAR_GER_1970_idea_strong_dmark:0 "The Deutschmark"
 COLDWAR_GER_1970_idea_strong_dmark_desc:0 "The only national symbol West Germans trust without reservation."
 COLDWAR_GER_1970_idea_student_aid:0 "BAföG"
 COLDWAR_GER_1970_idea_student_aid_desc:0 "Federal grants open universities to working-class children."
 COLDWAR_GER_1970_idea_territorial_army:0 "Territorial Army"
 COLDWAR_GER_1970_idea_territorial_army_desc:0 "Reservists to hold the rear."
 COLDWAR_GER_1970_idea_treuhand:0 "The Treuhand"
 COLDWAR_GER_1970_idea_treuhand_desc:0 "Privatise, restructure, close."
 COLDWAR_GER_1970_idea_two_plus_four:0 "Two Plus Four"
 COLDWAR_GER_1970_idea_two_plus_four_desc:0 "Full sovereignty - and limits on the army."
 COLDWAR_GER_1970_idea_un_member:0 "Member of the United Nations"
 COLDWAR_GER_1970_idea_un_member_desc:0 "Two German states at the UN."
 COLDWAR_GER_1970_idea_unsc_member:0 "Security Council Seat"
 COLDWAR_GER_1970_idea_unsc_member_desc:0 "Two years at the table."
 COLDWAR_GER_1970_idea_working_time_385:0 "38.5-Hour Week"
 COLDWAR_GER_1970_idea_working_time_385_desc:0 "Shorter hours, flexible plants."
 COLDWAR_GER_1970_image_of_germany:0 "The Image of Germany"
 COLDWAR_GER_1970_image_of_germany_desc:0 "The Federal Press Office wants a Germany that sells: Mercedes and Mozart, Lufthansa and the Rhine, a reliable, prosperous, slightly boring democracy. Exhibitions, glossy brochures, a travelling show of German design. The Goethe-Institutes are asked to stay on message."
 COLDWAR_GER_1970_india_partnership:0 "Partnership with India"
 COLDWAR_GER_1970_india_partnership_desc:0 "The world's largest democracy is also the largest recipient of West German development aid: the steelworks at Rourkela, the Indian Institute of Technology in Madras, credits for the Green Revolution. India is non-aligned and buys its weapons from Moscow. But it is a democracy - and in a decade of military regimes, that matters to Bonn."
 COLDWAR_GER_1970_inf_treaty:0 "The Pershing Ia Question"
 COLDWAR_GER_1970_inf_treaty_desc:0 "The superpowers agree on the double zero option: all intermediate-range missiles in Europe are to be scrapped. But seventy-two old Pershing Ia missiles - West German missiles with American warheads - stand in the way. The Union's right wing wants to keep them as Germany's last bargaining chip. Kohl gives them up, and the treaty is signed."
 COLDWAR_GER_1970_inner_german_sport:0 "Sport across the Border"
 COLDWAR_GER_1970_inner_german_sport_desc:0 "Since Sparwasser's goal in Hamburg the two German states play each other - but rarely, and under protocols negotiated like arms treaties. Bonn proposes a sports agreement: a hundred meetings a year, youth teams, even a friendly in Leipzig."
 COLDWAR_GER_1970_inpol:0 "INPOL and PIOS"
 COLDWAR_GER_1970_inpol_desc:0 "INPOL, the computerised wanted list, and PIOS - persons, institutions, objects, items - a database that links every fragment of information the police possess. The press calls Herold 'Kommissar Computer'. A patrol in Hamburg can now learn in seconds what a detective in Munich discovered last week. So can anyone else with access to the terminal."
 COLDWAR_GER_1970_internal_security:0 "Internal Security"
 COLDWAR_GER_1970_internal_security_category:0 "Internal Security"
 COLDWAR_GER_1970_internal_security_category_desc:0 "Security state: §Y[?cwger_security|0]§! | Rule-of-law credibility: §Y[?cwger_rechtsstaat|0]§!\nTerror threat - left: §Y[?cwger_terror_left|0]§! right: §Y[?cwger_terror_right|0]§! foreign: §Y[?cwger_terror_foreign|0]§!\nRAF generation §Y[?cwger_raf_gen|0]§!, active cadre §Y[?cwger_raf_cadre|0]§!, sympathiser milieu §Y[?cwger_raf_milieu|0]§!, prisoners §Y[?cwger_raf_prisoners|0]§!\nBKA capability §Y[?cwger_bka_level|0]§! | GSG 9 tier §Y[?cwger_gsg9_tier|0]§! | Counter-intelligence §Y[?cwger_counterintel|0]§! vs Stasi penetration §Y[?cwger_stasi_penetration|0]§!"
 COLDWAR_GER_1970_internal_security_desc:0 "Student riots in the university towns, Palestinian commandos at the airports, and a new underground that calls itself the Red Army Faction and robs banks to finance a war against the 'imperialist state'. The federal police forces were built for another age - to catch smugglers and guard the border. The Republic must decide how to defend itself without becoming what its enemies say it is."
 COLDWAR_GER_1970_israel_first:0 "Special Responsibility"
 COLDWAR_GER_1970_israel_first_desc:0 "The Federal Republic's relationship with Israel is not like any other, and it cannot be subordinated to oil, markets or European solidarity. Bonn refuses to sign anything that Jerusalem regards as a threat to its existence, even if it means standing apart from its partners in the Community. The Arab capitals take note. So does every German who remembers why."
 COLDWAR_GER_1970_israel_relations:0 "The Special Relationship"
 COLDWAR_GER_1970_israel_relations_desc:0 "Reparations since 1952, arms deliveries in secret since the late 1950s, diplomatic relations since 1965: Israel's security has become a German interest - not because of strategy, but because of history. Every German government knows that its standing in the world is measured, among other things, by how it treats the state of the survivors."
 COLDWAR_GER_1970_jaeger_90:0 "Jäger 90"
 COLDWAR_GER_1970_jaeger_90_desc:0 "A European fighter for the 1990s, designed by Britain, Germany, Italy and Spain to replace the Phantom: expensive, late, plagued by disputes over work shares - and politically impossible to cancel, because too many jobs, too many ministries and too much European prestige depend on it. Every defence minister promises to cut it. None does."
 COLDWAR_GER_1970_jakarta_fleet:0 "A Fleet for Jakarta"
 COLDWAR_GER_1970_jakarta_fleet_desc:0 "The navy of the GDR is lying at anchor in Peenemünde, waiting for the scrapyard. Jakarta's technology minister - an aircraft engineer trained in Aachen - wants all of it: thirty-nine corvettes, landing ships and minesweepers, refitted in German yards."
 COLDWAR_GER_1970_japan_partnership:0 "Two Export Champions"
 COLDWAR_GER_1970_japan_partnership_desc:0 "Tokyo and Bonn: two powers defeated in 1945 that became the world's leading exporters within a generation, both protected by American troops, both accused by Washington of selling too much and buying too little. They agree to talk to each other about trade and currency before Washington talks to them about it - separately, and on its own terms."
 COLDWAR_GER_1970_jena_revival:0 "Jenoptik"
 COLDWAR_GER_1970_jena_revival_desc:0 "Lothar Späth goes east himself. He takes over the remains of Carl Zeiss Jena - the GDR's optical flagship, now facing the Treuhand's liquidators - and turns it into Jenoptik, a technology company that survives. Thousands of jobs are lost on the way; thousands are saved. Jena becomes proof that the East's industry need not die."
 COLDWAR_GER_1970_job_creation:0 "Job Creation Measures"
 COLDWAR_GER_1970_job_creation_desc:0 "Two million unemployed, and many of them for years. The Federal Labour Office pays local authorities and charities to hire them for a year: to plant trees, renovate schools, sort archives, care for the elderly. It is not a real job, say the critics. For those who have it, it is a reason to get up in the morning."
 COLDWAR_GER_1970_joint_resolution:0 "A Joint Resolution"
 COLDWAR_GER_1970_joint_resolution_desc:0 "A way out for everyone: the Bundestag ratifies the treaties with Moscow and Warsaw, and all parties together adopt a resolution that the treaties do not anticipate a peace settlement and leave the German question open. The Union can abstain rather than vote no, the government gets its treaties, and the Constitutional Court gets a text to quote for decades."
 COLDWAR_GER_1970_juso_left:0 "Give the Jusos a Voice"
 COLDWAR_GER_1970_juso_left_desc:0 "The Young Socialists want to overcome capitalism by structural reform, nationalise the key industries and leave the arms race to others. Giving them a voice in the party means energy, new members and a bridge to the movements in the streets. It also means a coalition partner in the FDP who reads the Jusos' resolutions very carefully."
 COLDWAR_GER_1970_kanalarbeiter:0 "Back the Kanalarbeiter"
 COLDWAR_GER_1970_kanalarbeiter_desc:0 "They call themselves the Kanalarbeiter, the sewer workers, because they do the party's dirty work below ground: right-wing Social Democrats from the trade unions and the Seeheim Circle who keep the SPD on the side of NATO, nuclear power and the chancellor. Backing them means a quieter party conference - and a party that slowly stops listening to its own youth."
 COLDWAR_GER_1970_kiel_theses:0 "The Kiel Theses"
 COLDWAR_GER_1970_kiel_theses_desc:0 "The market has returned to the Free Democrats. In Kiel the party rediscovers lower taxes, less regulation and its business wing - and with it a partner on the other side of the chamber. The social-liberal coalition was a marriage of reason, say the economic liberals. Reason now suggests a divorce."
 COLDWAR_GER_1970_kohl_machine:0 "The Kohl System"
 COLDWAR_GER_1970_kohl_machine_desc:0 "Kohl does not govern through his cabinet but through his party: a network of district chairmen whose birthdays he remembers, telephone calls late at night, favours given and remembered, and an almost superhuman patience with rivals who underestimate him. 'The Kohl system' is mocked by the intellectuals. It survives every one of them."
 COLDWAR_GER_1970_kohlepfennig:0 "The Coal Penny"
 COLDWAR_GER_1970_kohlepfennig_desc:0 "A few pfennigs on every electricity bill, paid by every household in the country, so that the power stations burn German hard coal instead of cheaper imports. The 'coal penny' keeps the pits of the Ruhr and the Saar open and two hundred thousand miners in work. It is security of supply, says the government. It is a subsidy, says Brussels."
 COLDWAR_GER_1970_kosovo_decision:0 "Never Again Auschwitz"
 COLDWAR_GER_1970_kosovo_decision_desc:0 "'Never again war', the Greens have always said. 'Never again Auschwitz', answers their foreign minister, Joschka Fischer, as Serbian forces drive the Kosovo Albanians from their homes. Without a UN mandate, the Luftwaffe's Tornados take part in NATO's air war - the first German combat mission since 1945, decided by a red-green government."
 COLDWAR_GER_1970_laender_partnership:0 "Partners in the East"
 COLDWAR_GER_1970_laender_partnership_desc:0 "Baden-Württemberg adopts Saxony: civil servants, judges, tax inspectors and engineers on loan, a partnership treaty between the Länder and a Swabian accent in every ministry in Dresden. The West teaches the East how to run a federal state. Whether the East enjoys being taught is another matter."
 COLDWAR_GER_1970_laender_reform:0 "Redrawing the Länder"
 COLDWAR_GER_1970_laender_reform_desc:0 "Bremen is smaller than many cities, Bavaria larger than many countries. The Ernst Commission proposes five or six strong Länder instead of eleven unequal ones: a Nordstaat around Hamburg, the Saar merged with Rhineland-Palatinate. Article 29 of the Basic Law even commands a reorganisation. Every single Land government is against it."
 COLDWAR_GER_1970_lafontaine_cautious_unity:0 "Count the Cost of Unity"
 COLDWAR_GER_1970_lafontaine_cautious_unity_desc:0 "In 1990 Lafontaine warned that unity would be paid for with tax rises and unemployment, and lost the election for it. Now he is chancellor and must prove that it could have been done more cheaply: slower, with more help for the East's industry and fewer promises. His party wants him to be right. His country wants him to be wrong."
 COLDWAR_GER_1970_lafontaine_keynes:0 "The Saarland Keynesian"
 COLDWAR_GER_1970_lafontaine_keynes_desc:0 "Chancellor Oskar Lafontaine believes in demand: lower interest rates, more public investment, higher wages for those who spend them. He also believes the Bundesbank is too independent and says so in public. In London the tabloids call him the most dangerous man in Europe; in Frankfurt, the central bankers prepare for a long war."
 COLDWAR_GER_1970_latin_democracy:0 "Democracy in Latin America"
 COLDWAR_GER_1970_latin_democracy_desc:0 "Wherever the generals hand back power, the German party foundations are there: Buenos Aires in 1983, Montevideo in 1984, Brasília in 1985, Santiago in 1990. They train party organisers, trade unionists and journalists, finance newspapers and think tanks, and bring young politicians to Bonn. Latin America's new democracies remember who helped them."
 COLDWAR_GER_1970_lebenspartnerschaft:0 "Citizenship and Civil Partnerships"
 COLDWAR_GER_1970_lebenspartnerschaft_desc:0 "For almost a century German citizenship has been a matter of blood: the grandchild of a Volga German is a German, the son of a Turkish worker born in Duisburg is not. Red-green wants to change that and to give same-sex couples the right to a registered partnership. The Union collects signatures against dual citizenship - and wins a state election with them."
 COLDWAR_GER_1970_leber_modernisation:0 "Leber's Modernisation"
 COLDWAR_GER_1970_leber_modernisation_desc:0 "Georg Leber, a bricklayer and trade unionist, becomes the most popular defence minister the Bundeswehr has ever had. He buys Leopard tanks, Marder infantry fighting vehicles and Gepard anti-aircraft guns, improves pay and barracks, and speaks to the conscripts as one working man to another. The soldiers trust him. That matters as much as the equipment."
 COLDWAR_GER_1970_leopard_2:0 "Leopard 2"
 COLDWAR_GER_1970_leopard_2_desc:0 "Krauss-Maffei's new main battle tank enters service in 1979: a 120-millimetre smoothbore gun, composite armour and a speed that astonishes NATO's observers. It is perhaps the best tank in the world, and suddenly everyone wants it - the Netherlands, Switzerland, Sweden, Spain. The Leopard 2 becomes the export success of the decade, and every sale abroad a political argument at home."
 COLDWAR_GER_1970_letter_on_unity:0 "The Letter on German Unity"
 COLDWAR_GER_1970_letter_on_unity_desc:0 "Handed over with every treaty, from Moscow to the Basic Treaty: the letter in which the Federal Government states that its goal remains a state of peace in Europe in which the German people regain their unity in free self-determination. The other side never answers it, never rejects it - and never forgets it was received."
 COLDWAR_GER_1970_liberal_state:0 "The Liberal Rule of Law"
 COLDWAR_GER_1970_liberal_state_desc:0 "Gerhart Baum's answer to the German Autumn: a state that does not allow its enemies to dictate how unfree it becomes. Controls on the BKA's databases, limits on the dragnet, dialogue with the sympathisers' milieu instead of mass raids. The police unions call it naivety. The minister calls it the difference between a democracy and its enemies."
 COLDWAR_GER_1970_liberation_doctrine:0 "The Liberation Doctrine"
 COLDWAR_GER_1970_liberation_doctrine_desc:0 "If the GDR breaks apart - as it nearly did in June 1953 - Bonn will not stand by as it did then, or as the West did in Budapest in 1956. A doctrine for the day after: recognition of a free government in the East, help, and if necessary more than help. A doctrine for the day before as well. Moscow reads it as a declaration of intent."
 COLDWAR_GER_1970_locomotive:0 "The Locomotive Deal"
 COLDWAR_GER_1970_locomotive_desc:0 "At the Bonn summit of 1978 the Americans want Germany and Japan to become the locomotives of the world economy: more demand at home to pull the others out of recession. Helmut Schmidt reluctantly agrees to a stimulus programme worth one per cent of GDP. In return he wants Carter to raise American oil prices. Both sides will regret the bargain."
 COLDWAR_GER_1970_lome_convention:0 "The Lomé Convention"
 COLDWAR_GER_1970_lome_convention_desc:0 "February 1975, Lomé in Togo: the European Community opens its markets to forty-six African, Caribbean and Pacific states - most of them former colonies of its members - and creates a fund that stabilises their export earnings when the prices of coffee, cocoa and copper fall. It is the most generous trade agreement the rich world has ever offered the poor. Bonn pays a quarter."
 COLDWAR_GER_1970_maastricht:0 "Maastricht"
 COLDWAR_GER_1970_maastricht_desc:0 "European Union, citizenship of the Union, a common foreign and security policy and, by the end of the decade, a common currency: the Treaty of Maastricht is the most ambitious step since the Treaties of Rome. It must be ratified in twelve countries. The Danes vote no, the French yes by the narrowest of margins - and the Germans are not even asked."
 COLDWAR_GER_1970_magnet_theory:0 "The Magnet Theory"
 COLDWAR_GER_1970_magnet_theory_desc:0 "Make the West so attractive that the East is drawn to it like iron to a magnet: no deals with the SED, no credits, no recognition - only prosperity, freedom and patient pressure. It is the doctrine of the Adenauer years. Its supporters argue that it was abandoned too soon; its critics that it built the Wall."
 COLDWAR_GER_1970_mannheim_congress:0 "The Mannheim Party Congress"
 COLDWAR_GER_1970_mannheim_congress_desc:0 "The SPD has lost four federal elections in a row and drifts somewhere around thirty per cent, its chairman respected and unloved. Mannheim was meant to be a routine party congress. Then the Saarland's premier steps up to the lectern: 'There are still causes we can be enthusiastic about.' The delegates rise - and the party has to decide who leads it into the next election."
 COLDWAR_GER_1970_mbfr:0 "Mutual and Balanced Force Reductions"
 COLDWAR_GER_1970_mbfr_desc:0 "Vienna, from 1973 onwards: NATO and the Warsaw Pact negotiate about Mutual and Balanced Force Reductions in Central Europe - fewer soldiers on both sides of the border. Sixteen years of talks produce no agreement, but they keep the two alliances talking to each other through every crisis. Sometimes the conversation is the result."
 COLDWAR_GER_1970_mehr_demokratie_wagen:0 "Dare More Democracy"
 COLDWAR_GER_1970_mehr_demokratie_wagen_desc:0 "'We want to dare more democracy.' Willy Brandt's first government statement promises a society that is more open, more just and more willing to take risks with freedom - after twenty years of Union chancellors, a change of era. The social-liberal coalition holds the Bundestag by a handful of seats, and every reform it promises will have to survive a Bundesrat, a Constitutional Court and an opposition convinced that the state belongs to it."
 COLDWAR_GER_1970_microelectronics:0 "The Microelectronics Gap"
 COLDWAR_GER_1970_microelectronics_desc:0 "Japan and America lead in microchips, and whoever leads in chips will lead in everything else. A federal programme and Siemens' megabit project, together with Philips, try to close the gap. Germany is excellent at building the machines that make products. Whether it can master the products that make the machines think is another question."
 COLDWAR_GER_1970_middle_east_balance:0 "Balance in the Middle East"
 COLDWAR_GER_1970_middle_east_balance_desc:0 "A special relationship with Israel, born of guilt and reparations; oil, markets and millions of customers in the Arab world: every chancellor walks the same narrow line. Lean too far to one side and lose the other. After the oil shock of 1973, Bonn learns how much its prosperity depends on states that regard Israel as their enemy."
 COLDWAR_GER_1970_militant_democracy:0 "Militant Democracy"
 COLDWAR_GER_1970_militant_democracy_desc:0 "The Basic Law has learned from Weimar: it protects itself. Parties that fight the free democratic order can be banned by the Constitutional Court, associations dissolved, and those who abuse their fundamental rights to destroy freedom can lose them. Militant democracy is the Republic's immune system. It must be used carefully - immune systems can attack the body they protect."
 COLDWAR_GER_1970_modell_deutschland:0 "Modell Deutschland"
 COLDWAR_GER_1970_modell_deutschland_desc:0 "While Britain strikes, Italy is shaken by bombs and America struggles with inflation, Helmut Schmidt has a slogan for his country: Modell Deutschland. A hard currency, social partners who settle in the end, an export industry that sells to the whole world. It is a model of crisis management, not of vision - and the chancellor would not have it any other way."
 COLDWAR_GER_1970_monetary_union_offer:0 "Monetary Union for the East"
 COLDWAR_GER_1970_monetary_union_offer_desc:0 "'If the D-Mark comes, we stay. If it doesn't, we go to it.' Every week tens of thousands of East Germans leave for the West. Bonn's answer is the boldest economic decision since 1948: one currency for both German states, decided in months, at an exchange rate the East's factories cannot survive. The Bundesbank's president warns. The chancellor overrules him."
 COLDWAR_GER_1970_moscow_treaty:0 "The Moscow Treaty"
 COLDWAR_GER_1970_moscow_treaty_desc:0 "August 1970: in the Kremlin, Brandt and Kosygin sign a treaty on the renunciation of force and the recognition of the borders of Europe as they are - including the Oder-Neisse line and the border between the two German states. Attached is a letter from the Federal Government: the treaty does not contradict the goal of German unity. Moscow accepts the letter without comment."
 COLDWAR_GER_1970_munich_olympics:0 "The Cheerful Games"
 COLDWAR_GER_1970_munich_olympics_desc:0 "Munich 1972 is meant to show the world a different Germany from the one of Berlin in 1936: light, colourful, cheerful, unarmed. The stadium's roof is a transparent tent, the police wear pastel uniforms and carry no guns. Then, on the tenth day, Palestinian terrorists of Black September climb the fence of the Olympic village. The Games will be remembered for something else entirely."
 COLDWAR_GER_1970_namibia_contact_group:0 "The Contact Group"
 COLDWAR_GER_1970_namibia_contact_group_desc:0 "Five Western members of the Security Council - the United States, Britain, France, Canada and the Federal Republic - try to negotiate Namibia's independence from South Africa. Pretoria occupies the territory illegally; SWAPO fights a guerrilla war from Angola. Twenty thousand German-speakers live in the former colony of German South West Africa. Bonn has a particular interest in a peaceful outcome."
 COLDWAR_GER_1970_namibia_independence:0 "Independence for Namibia"
 COLDWAR_GER_1970_namibia_independence_desc:0 "After seventy years of South African rule and twenty-three years of war, Namibia goes to the polls under UN supervision. The former German colony owes Bonn little and remembers a great deal - the war against the Herero and Nama has never been officially called by its name."
 COLDWAR_GER_1970_national_directorate:0 "The National Directorate"
 COLDWAR_GER_1970_national_directorate_desc:0 "The Bundestag is adjourned 'until order is restored'. A National Directorate assumes the powers of the chancellor and the federal president and promises a national renewal. The black, red and gold flag still flies over the Palais Schaumburg - but over a different state. Somewhere, the Allied High Commissioners' old files are being taken out of the archives."
 COLDWAR_GER_1970_national_option:0 "The National Option"
 COLDWAR_GER_1970_national_option_desc:0 "The Federal Republic signed the Non-Proliferation Treaty, but it never quite closed the door. A fast breeder, a reprocessing plant, enriched uranium, engineers who know what they are doing: the components of a national nuclear option exist. Using them would be the greatest scandal in the Republic's history - and would end the Western alliance as Germany has known it."
 COLDWAR_GER_1970_national_rearmament:0 "National Rearmament"
 COLDWAR_GER_1970_national_rearmament_desc:0 "No more NATO quotas, no more integrated command, no more ceiling on the army agreed in Paris in 1954: the Directorate wants an army of its own size, under its own command and for its own purpose. In Brussels, in Washington and in Moscow the same question is asked in different languages: what purpose?"
 COLDWAR_GER_1970_national_right:0 "Courting the National Right"
 COLDWAR_GER_1970_national_right_desc:0 "There are votes to the right of the Union - and a government that needs them. A chancellor who speaks of 'foreign infiltration', 'red terror' and 'national dignity' finds an audience that Bonn's political class has kept out of the mainstream since 1949. Each speech moves the line of what may be said a little further. Nobody in the cabinet seems to notice where it is heading."
 COLDWAR_GER_1970_nato_awacs:0 "AWACS at Geilenkirchen"
 COLDWAR_GER_1970_nato_awacs_desc:0 "NATO's own fleet of airborne early-warning aircraft - flying radar stations that can see a hundred kilometres beyond the border - is based at Geilenkirchen, near Aachen, with German crews aboard alongside the Americans, Dutch and Italians. It is the first truly integrated NATO force. Germany pays a large share and gets a seat in the cockpit."
 COLDWAR_GER_1970_nato_enlargement:0 "NATO Opens to the East"
 COLDWAR_GER_1970_nato_enlargement_desc:0 "Poland, the Czech Republic and Hungary join NATO in 1999, and the eastern border of the alliance moves from the Elbe to the Bug. For the first time in its history Germany is surrounded only by friends and allies. Moscow protests that it was promised otherwise in 1990. The argument about that promise will last longer than anyone expects."
 COLDWAR_GER_1970_neckar_valley:0 "Silicon Valley on the Neckar"
 COLDWAR_GER_1970_neckar_valley_desc:0 "Research institutes, technology parks, venture capital from the Landesbank, engineers from Karlsruhe and Stuttgart: Baden-Württemberg is to be Germany's answer to California. The state invests in the future while others subsidise the past. Whether a Silicon Valley can be planned by a state government is the question nobody in Stuttgart likes to ask."
 COLDWAR_GER_1970_neue_heimat_cleanup:0 "Clean Up the Union Enterprises"
 COLDWAR_GER_1970_neue_heimat_cleanup_desc:0 "Neue Heimat, the trade unions' housing company, built four hundred thousand homes for working families. Now Der Spiegel reveals that its managers lined their own pockets while the tenants paid. The DGB's empire is rotten, and the SPD stands too close to it. A clean liquidation now may be the only way to stop the scandal from eating the party."
 COLDWAR_GER_1970_neue_mitte:0 "Die Neue Mitte"
 COLDWAR_GER_1970_neue_mitte_desc:0 "'We will not do everything differently, but we will do many things better.' The New Centre is less a programme than a promise: modern, pragmatic, friendly to business and to the unions, impatient with the old quarrels of the left. The party grumbles. The voters in the suburbs listen for the first time in sixteen years."
 COLDWAR_GER_1970_neutral_offer:0 "Unity for Neutrality?"
 COLDWAR_GER_1970_neutral_offer_desc:0 "Stalin offered it in March 1952: a united, neutral Germany with its own army, in return for leaving the Western alliance. Adenauer refused without even testing the offer. If Moscow offers it again, should Bonn take it - unity at the price of NATO? The peace movement says yes. Washington, Paris and London say no in a single voice."
 COLDWAR_GER_1970_neutron_quarrel:0 "The Neutron Bomb Quarrel"
 COLDWAR_GER_1970_neutron_quarrel_desc:0 "Helmut Schmidt agreed, at great cost to his party, to station the neutron bomb - the 'enhanced radiation weapon' that kills people and spares buildings. Then Jimmy Carter cancelled it without asking him. The chancellor is humiliated in front of his own party. Bonn decides that it will no longer simply follow every American turn."
 COLDWAR_GER_1970_no_deployment:0 "No to the Missiles"
 COLDWAR_GER_1970_no_deployment_desc:0 "The Bundestag rejects the deployment. For the peace movement it is a triumph; for the alliance, a crisis. Washington talks of troop withdrawals and of an ally that can no longer be relied upon, Moscow of a new chapter in relations with a sensible Germany. Bonn must now prove that it has chosen peace and not neutrality."
 COLDWAR_GER_1970_no_radicals_decree:0 "Trust the Civil Service"
 COLDWAR_GER_1970_no_radicals_decree_desc:0 "No more routine vetting of every applicant, only individual examination where there is concrete evidence. Willy Brandt will later call the Radicals Decree one of the cardinal mistakes of his chancellorship. The government trusts the civil service - and trusts the young people who once marched in the streets to serve the state they criticised."
 COLDWAR_GER_1970_npg_seat:0 "A Seat in the Nuclear Planning Group"
 COLDWAR_GER_1970_npg_seat_desc:0 "Bonn has no bomb, but it has a voice. In NATO's Nuclear Planning Group German defence ministers sit at the table with their American and British colleagues and discuss target lists - many of them on German soil, East and West. The Federal Republic cannot decide how nuclear weapons are used. It can make sure it is never forgotten when they are discussed."
 COLDWAR_GER_1970_npt_ratification:0 "Ratify the Non-Proliferation Treaty"
 COLDWAR_GER_1970_npt_ratification_desc:0 "The Federal Republic signed the Non-Proliferation Treaty in 1969; ratifying it will take until 1975, after long arguments about the inspection regime and the future of Germany's civilian nuclear industry. Ratification means renouncing nuclear weapons of its own for good - and in return, guaranteed access to civilian nuclear technology. It closes a door that some in Bonn wanted to keep open."
 COLDWAR_GER_1970_nuclear_buildout:0 "Nuclear Build-Out"
 COLDWAR_GER_1970_nuclear_buildout_desc:0 "Biblis, Brokdorf, Grafenrheinfeld, Isar: the energy programme foresees fifty reactors by 1985, and with them cheap electricity, independence from the oil sheikhs and the world's best nuclear industry. Every new site brings a construction fence - and on the other side of the fence, a few thousand people who refuse to accept it."
 COLDWAR_GER_1970_nuclear_moratorium:0 "No More New Reactors"
 COLDWAR_GER_1970_nuclear_moratorium_desc:0 "Wyhl, Brokdorf, Grohnde, Gorleben: wherever a reactor is to be built, the citizens' initiatives occupy the site. The government can keep fighting them with water cannon - or listen. Finish what is under construction, build nothing new, and let the next generation decide whether the nuclear age has a future in Germany."
 COLDWAR_GER_1970_nuclear_sharing_role:0 "Nuclear Participation"
 COLDWAR_GER_1970_nuclear_sharing_role_desc:0 "Pershing Ia missiles, Lance rockets and Tornado bombers at Büchel: the delivery systems are German, the crews are German, the warheads are American and stay under American control until the President releases them. Nuclear participation gives Bonn a voice in NATO's nuclear planning - and makes the Federal Republic a target in every Soviet war plan."
 COLDWAR_GER_1970_oder_neisse_final:0 "The Border Treaty with Poland"
 COLDWAR_GER_1970_oder_neisse_final_desc:0 "No unity without a final border. Poland demands a treaty, not a promise; the expellees' associations demand that the question remain open; Kohl hesitates for months, worrying about the votes of the expellees. In the end the Bundestag and the Volkskammer declare the Oder-Neisse line final, and Warsaw finally believes that Germany means it."
 COLDWAR_GER_1970_offset_payments:0 "Offset Payments"
 COLDWAR_GER_1970_offset_payments_desc:0 "American soldiers in Germany cost dollars, and Washington wants them back. Bonn pays: with purchases of American weapons, with Bundesbank loans to the US Treasury, and with a quiet promise never to cash its dollar reserves in for gold. It is the price of the American presence - and the Federal Republic pays it gladly, because the alternative would cost far more."
 COLDWAR_GER_1970_old_borders:0 "The Old Borders"
 COLDWAR_GER_1970_old_borders_desc:0 "The Directorate claims the 'Soviet Zone' as German territory under foreign occupation and lays down a war goal against East Berlin. It is not only a challenge to the GDR but to every army of the Warsaw Pact - and to every NATO government that never signed up to fight for this. Europe holds its breath."
 COLDWAR_GER_1970_olympic_boycott:0 "Boycott Moscow?"
 COLDWAR_GER_1970_olympic_boycott_desc:0 "Soviet troops have marched into Afghanistan, and Washington asks its allies to stay away from the Moscow Olympics of 1980. The Federal Republic's athletes have trained for four years; the National Olympic Committee wants to go; the government is under enormous pressure from the Americans. The Bundestag says yes to the boycott. Some medals are never won."
 COLDWAR_GER_1970_order_above_all:0 "Order Above Everything"
 COLDWAR_GER_1970_order_above_all_desc:0 "Terrorists, demonstrators, 'parasites on the welfare state': the government promises order above everything, and the police get whatever they ask for. Raids on bookshops, bans on demonstrations, emergency powers tested in practice. The Basic Law's critics are no longer only on the left - and the Republic's defenders begin to look nervously at Karlsruhe."
 COLDWAR_GER_1970_out_of_area_ruling:0 "The Out-of-Area Ruling"
 COLDWAR_GER_1970_out_of_area_ruling_desc:0 "July 1994: the Constitutional Court in Karlsruhe rules that the Basic Law permits armed deployments of the Bundeswehr abroad within a system of collective security - provided the Bundestag approves each one. The 'parliamentary army' is born. The debate about whether Germany should send soldiers into the world's wars is over. The debate about which wars has only just begun."
 COLDWAR_GER_1970_paragraph_129a:0 "Paragraph 129a"
 COLDWAR_GER_1970_paragraph_129a_desc:0 "Membership of a terrorist organisation - or merely supporting or advertising one - becomes a crime of its own under Paragraph 129a of the Criminal Code. Prosecutors no longer have to prove who threw the bomb, only who belonged to the group. It is an effective weapon against the RAF. It also reaches publishers, printers and anyone who sprays a slogan on a wall."
 COLDWAR_GER_1970_paragraph_218:0 "Paragraph 218"
 COLDWAR_GER_1970_paragraph_218_desc:0 "'My belly belongs to me': in June 1971, 374 women declare on the cover of Stern that they have had abortions - a crime under a paragraph of the Criminal Code written in 1871. The churches mobilise, the women's movement takes to the streets, and Karlsruhe waits for the law that the coalition will have to write. No paragraph divides the country more deeply."
 COLDWAR_GER_1970_party_finance_law:0 "The Party Finance Law"
 COLDWAR_GER_1970_party_finance_law_desc:0 "After the scandals comes the law: donations above a threshold must be published with the donor's name, and the parties receive state money in proportion to the votes they win. The established parties had wanted to secure their finances. The unintended winners are the Greens, who become rich overnight on the strength of their voters."
 COLDWAR_GER_1970_party_foundations:0 "The Party Foundations"
 COLDWAR_GER_1970_party_foundations_desc:0 "Friedrich Ebert for the Social Democrats, Konrad Adenauer for the Christian Democrats, Friedrich Naumann for the Liberals, Hanns Seidel for the CSU: the German political foundations are a peculiar invention. Financed by the state, independent of the government, they train trade unionists in Lagos, journalists in Lima and party organisers in Lisbon. Germany exports democracy through its parties."
 COLDWAR_GER_1970_party_reform_cdu:0 "A Members' Party"
 COLDWAR_GER_1970_party_reform_cdu_desc:0 "Kurt Biedenkopf and Heiner Geißler turn the CDU from a chancellor's electoral association into a modern members' party: full-time staff in every district, a party academy, campaign planning by computer. Within a decade the membership has doubled. The old notables grumble about the young men from the Konrad-Adenauer-Haus. They also win elections."
 COLDWAR_GER_1970_patriot:0 "Patriot and Roland"
 COLDWAR_GER_1970_patriot_desc:0 "The Warsaw Pact's air armies could attack Germany's airfields in the first hours of a war. Patriot batteries from 1989, Roland and Hawk systems for lower altitudes, all integrated into NATO's air defence belt: a shield over the Federal Republic that the Soviets must take seriously. Each battery costs more than a hospital. The arithmetic of deterrence is expensive."
 COLDWAR_GER_1970_peace_dividend_defence:0 "Defensive Defence"
 COLDWAR_GER_1970_peace_dividend_defence_desc:0 "'Structural inability to attack': fewer tanks, more anti-tank infantry, minefields and barriers - an army so clearly designed for defence that the other side cannot read it as a threat. The idea comes from the peace research institutes and the SPD's left wing. The generals call it disarmament in disguise. The Soviets find it very interesting."
 COLDWAR_GER_1970_pension_reform:0 "Pension Reform 1972"
 COLDWAR_GER_1970_pension_reform_desc:0 "The dynamic pension of 1957 tied old age to the growth of wages; the reform of 1972 goes further, with a flexible retirement age from sixty-three and a minimum pension for those who earned too little to live on. In the Bundestag the parties outbid each other with generosity in an election year. The bill will be presented later, to another generation."
 COLDWAR_GER_1970_permanent_seat:0 "A German Seat"
 COLDWAR_GER_1970_permanent_seat_desc:0 "The third-largest contributor to the UN budget has no permanent seat at the table where the decisions are made. Bonn asks quietly at first, then openly: if the Security Council is reformed, the Federal Republic wants in - and the five who hold a veto must agree."
 COLDWAR_GER_1970_petersberg_reform:0 "The Petersberg Reform"
 COLDWAR_GER_1970_petersberg_reform_desc:0 "On the Petersberg above Bonn, the coalition designs a great tax reform for 1998: lower rates, fewer exemptions, a simpler system. It passes the Bundestag - and dies in the Bundesrat, where Oskar Lafontaine's SPD majority blocks it to deny the chancellor a success before the election. Germany has a new word for its condition: Reformstau, the reform jam."
 COLDWAR_GER_1970_pflegeversicherung:0 "Long-Term Care Insurance"
 COLDWAR_GER_1970_pflegeversicherung_desc:0 "Norbert Blüm wants a fifth pillar for the social insurance system: insurance for long-term care, so that old age does not end in poverty and the social welfare office. The employers will only agree if they are compensated, and so the Federal Republic abolishes a public holiday - the Day of Repentance and Prayer - to pay for it."
 COLDWAR_GER_1970_polish_emigration:0 "Credits for Emigration"
 COLDWAR_GER_1970_polish_emigration_desc:0 "Helsinki, August 1975: at the margins of the CSCE summit Schmidt and Gierek agree on a package - billions of marks in credits and a lump sum for Polish pension claims, and in return exit permits for 125,000 ethnic Germans over four years. The opposition calls it buying people; the Polish government calls it compensation. The families call it home."
 COLDWAR_GER_1970_political_cooperation:0 "European Political Cooperation"
 COLDWAR_GER_1970_political_cooperation_desc:0 "The Nine try to speak with one voice in foreign policy: at the Helsinki conference, on the Middle East, in the General Assembly of the United Nations. European Political Cooperation has no treaty, no secretariat and no army - only foreign ministers who meet and telephone. It is modest. For a continent that fought two world wars among itself, it is also remarkable."
 COLDWAR_GER_1970_postal_reform:0 "Postal Reform"
 COLDWAR_GER_1970_postal_reform_desc:0 "The Bundespost is a giant: letters, savings accounts and the telephone network in a single public authority with half a million employees. The reform splits it into three companies - post, bank and telecom - and prepares them for the market. In 1996 the Deutsche Telekom share is floated as 'the people's share'. Millions buy. Not all will be glad they did."
 COLDWAR_GER_1970_prague_treaty:0 "The Prague Treaty"
 COLDWAR_GER_1970_prague_treaty_desc:0 "The Munich Agreement of 1938, by which Hitler took the Sudetenland, is declared void - though when exactly it became void is a question the lawyers argue about for months. Diplomatic relations with Czechoslovakia follow, and with Hungary and Bulgaria. The last chapter of the Eastern Treaties is written. The Sudeten German associations call it a betrayal."
 COLDWAR_GER_1970_prepare_defence_case:0 "Prepare the State of Defence"
 COLDWAR_GER_1970_prepare_defence_case_desc:0 "The emergency laws of 1968, the Joint Committee that replaces parliament in war, mobilisation plans for 1.3 million reservists, requisition orders for every lorry in the country: the state of defence has been written down in detail and rehearsed in secret. Nobody wants it. Everybody in the ministry knows what to do if it comes."
 COLDWAR_GER_1970_pretoria_trade:0 "Change through Trade"
 COLDWAR_GER_1970_pretoria_trade_desc:0 "Daimler-Benz, Siemens, Hoechst and BASF want to stay in South Africa: sanctions hurt the black workers first, they argue, and German companies set an example by paying them fairly. Franz Josef Strauß visits Pretoria and calls for understanding. Change through trade, says the government. The anti-apartheid movement calls it profiting from oppression."
 COLDWAR_GER_1970_prisoner_buyouts:0 "Buying Freedom"
 COLDWAR_GER_1970_prisoner_buyouts_desc:0 "Since 1963 the Federal Republic has quietly paid for the release of political prisoners from the GDR: in cash, in goods, in deliveries of oil and coffee through the Protestant churches' accounts. By 1989 tens of thousands of people will have been bought free. It is a trade in human beings, say the critics. For the prisoners it is a way out of Bautzen."
 COLDWAR_GER_1970_private_television:0 "Cable and Satellite"
 COLDWAR_GER_1970_private_television_desc:0 "January 1984: a cable pilot project in Ludwigshafen launches the first private television channel in the Federal Republic. The Union wants an end to what it calls 'red radio' and the dominance of the public broadcasters; the SPD fears a German Berlusconi. Satellites are already in orbit. The question is not whether private television comes, but on whose terms."
 COLDWAR_GER_1970_privatisation_wave:0 "Privatisation Wave"
 COLDWAR_GER_1970_privatisation_wave_desc:0 "Why should the state own oil companies, aluminium smelters, a car manufacturer and an airline? The government sells its stakes in VEBA, VIAG, Volkswagen and Lufthansa, brings in some ten billion marks for the treasury and turns hundreds of thousands of citizens into shareholders. The unions warn about job cuts; the Bundestag's free-market wing wants more."
 COLDWAR_GER_1970_public_broadcasting:0 "Public Service Broadcasting"
 COLDWAR_GER_1970_public_broadcasting_desc:0 "ARD and ZDF remain the only channels: independent of the state, financed by licence fees, supervised by broadcasting councils in which churches, unions, employers and parties all have a seat. It is the Allies' legacy and the Republic's pride - a television that has to answer to society rather than to the market. Its critics call it a bureaucracy with a camera."
 COLDWAR_GER_1970_public_sector_strike:0 "The ÖTV Strike"
 COLDWAR_GER_1970_public_sector_strike_desc:0 "February 1974, in the middle of the oil shock: the public-service union ÖTV demands double-digit pay rises and brings the bin lorries, the trams and the airports to a standstill. Willy Brandt has publicly warned against such a settlement. If he gives way, his authority is broken; if he holds firm, the strike may break his government first."
 COLDWAR_GER_1970_purge_institutions:0 "Purge the Institutions"
 COLDWAR_GER_1970_purge_institutions_desc:0 "Judges, editors, professors, officers, teachers: the lists are drawn up in the ministries. Whoever signs the declaration of loyalty to the national renewal keeps his post. The others leave - for prison, for exile or for the West's embassies. The institutions the Republic built over thirty years are emptied in a few months."
 COLDWAR_GER_1970_quiet_diplomacy:0 "Quiet Diplomacy"
 COLDWAR_GER_1970_quiet_diplomacy_desc:0 "The Foreign Office prefers the back channel: a word to the Soviet ambassador over dinner, an exit visa quietly granted, a credit quietly extended. No headlines, no walkouts - and every year a few hundred people who are allowed to leave."
 COLDWAR_GER_1970_quiet_diplomacy_poland:0 "Quiet Diplomacy"
 COLDWAR_GER_1970_quiet_diplomacy_poland_desc:0 "On 13 December 1981, the day martial law is declared in Poland, Helmut Schmidt is at Honecker's side at the Werbellinsee - and he stays for the talks. Détente, he argues, must not become a casualty of Warsaw; shouting would not free a single internee. The Americans are appalled. The chancellor believes that quiet diplomacy saves more people than loud protest."
 COLDWAR_GER_1970_rabta_affair:0 "The Rabta Affair"
 COLDWAR_GER_1970_rabta_affair_desc:0 "American satellites photograph a factory in the Libyan desert. Washington says it makes poison gas, and that German companies built it. Bonn denies everything - until the customs investigators find the invoices of a firm in Lahr."
 COLDWAR_GER_1970_radicals_decree:0 "The Radicals Decree"
 COLDWAR_GER_1970_radicals_decree_desc:0 "Every applicant for the public service - teachers, train drivers, postmen - is checked for loyalty to the free democratic basic order. The Office for the Protection of the Constitution delivers its findings, and membership of the DKP can cost a young teacher her career. Three and a half million checks are carried out. Abroad, the word 'Berufsverbot' enters other languages."
 COLDWAR_GER_1970_radio_war:0 "The Airwaves War"
 COLDWAR_GER_1970_radio_war_desc:0 "New transmitters on the western side of the Brocken, RIAS Berlin on full power, programmes made especially for the East - news, rock music, the voices of those who fled. The airwaves war is cheap, effective and impossible to stop with a wall. The GDR builds jamming transmitters. The young people of Leipzig and Rostock tune in anyway."
 COLDWAR_GER_1970_rambouillet:0 "The Summit at Rambouillet"
 COLDWAR_GER_1970_rambouillet_desc:0 "November 1975: Valéry Giscard d'Estaing invites the leaders of the six largest Western economies to the Château de Rambouillet. No officials, no communiqués written in advance, only heads of government talking about currencies, energy and trade after the oil shock. It is the birth of the world economic summits - and a seat for Bonn among the few who matter."
 COLDWAR_GER_1970_ratification:0 "Ratify the Eastern Treaties"
 COLDWAR_GER_1970_ratification_desc:0 "The coalition's majority has melted away through defections; a constructive vote of no confidence against Brandt fails by two votes - votes that, as will later emerge, the Stasi may have bought. Now the coalition must put the Eastern Treaties to the Bundestag. Without them, détente collapses. With them, the opposition will claim that Germany has been sold."
 COLDWAR_GER_1970_realos:0 "Realos Take Over"
 COLDWAR_GER_1970_realos_desc:0 "Joschka Fischer and the pragmatists want to change the country from inside the government rather than from the street: coalitions with the SPD, budgets, compromises and eventually even NATO. The fundamentalists call it treason to the movement and leave in anger. The Greens that remain are smaller, more disciplined - and electable."
 COLDWAR_GER_1970_rechtsposition:0 "The Legal Position"
 COLDWAR_GER_1970_rechtsposition_desc:0 "The preamble of the Basic Law, one German citizenship for all Germans, the German Reich in its borders of 1937 as the legal starting point: Bonn may talk to East Berlin, trade with it and sign treaties with it, but it gives nothing away in law. The legal position is a fortress of paper. One day, Bonn hopes, it will matter."
 COLDWAR_GER_1970_recognise_china:0 "Relations with Beijing"
 COLDWAR_GER_1970_recognise_china_desc:0 "October 1972: Walter Scheel flies to Beijing. Mao Zedong wants a strong Federal Republic as a counterweight to Moscow in Europe; Bonn wants a market of eight hundred million people and a partner that makes the Kremlin nervous. The opening to China is the one piece of Ostpolitik that the Union applauds - and that the Soviet ambassador watches with a frown."
 COLDWAR_GER_1970_recognise_croatia:0 "Recognise Slovenia and Croatia"
 COLDWAR_GER_1970_recognise_croatia_desc:0 "Yugoslavia is falling apart, Serbian artillery is shelling Vukovar and Dubrovnik, and Genscher pushes the European Community to recognise Slovenia and Croatia as independent states. Paris and London are furious; they fear that recognition will fan the flames in Bosnia. A newly united Germany is accused of reviving the Balkan policies of the past."
 COLDWAR_GER_1970_reconciliation_offer:0 "The Kinkel Initiative"
 COLDWAR_GER_1970_reconciliation_offer_desc:0 "January 1992: Justice Minister Klaus Kinkel offers the early release of RAF prisoners who renounce violence. The state reaches out its hand. In April the RAF answers with a statement that it will 'take back the escalation' and stop its attacks on leading figures of business and the state. It is not peace. It may be the beginning of the end."
 COLDWAR_GER_1970_red_green_federal:0 "The Red-Green Project"
 COLDWAR_GER_1970_red_green_federal_desc:0 "A generation that once marched against the state now governs it. SPD and Greens form the first red-green federal government: an exit from nuclear power, a new citizenship law, an ecological tax reform. Former street fighters become ministers, former pacifists will have to decide on war. Power, it turns out, changes those who hold it."
 COLDWAR_GER_1970_red_green_hesse:0 "Red-Green in Hesse"
 COLDWAR_GER_1970_red_green_hesse_desc:0 "December 1985: Joschka Fischer is sworn in as Hesse's environment minister in white trainers. The first red-green coalition in a German state is a fragile experiment - the Greens want the Hanau nuclear plants closed, the SPD wants to govern - but the photograph goes around the world. A movement has entered the state."
 COLDWAR_GER_1970_red_green_pact:0 "A Red-Green Pact"
 COLDWAR_GER_1970_red_green_pact_desc:0 "Lafontaine offers the Greens what Brandt never offered: a coalition of equals rather than a junior partner to be tamed. The Realos are tempted by ministries and a chance to shut down the reactors. The Fundis want the withdrawal from NATO written into the coalition agreement. Whether the pact becomes a government depends on the voters - and on what each side is willing to give up."
 COLDWAR_GER_1970_reforger:0 "REFORGER"
 COLDWAR_GER_1970_reforger_desc:0 "Return of Forces to Germany: every autumn tens of thousands of American soldiers fly across the Atlantic, collect their tanks from depots in the Rhineland and practise the defence of the border alongside the Bundeswehr. Fields are churned up, villages blocked by convoys, farmers compensated. It is the visible proof that the Americans will come. The Soviets watch every exercise."
 COLDWAR_GER_1970_regional_fund:0 "The Regional Fund"
 COLDWAR_GER_1970_regional_fund_desc:0 "The Paris summit of December 1974 creates a European Regional Development Fund for the poorer regions of the Community: the Mezzogiorno, the west of Ireland, the north of England. Bonn pays the largest share and gets back the least. In return it buys the goodwill of Rome and Dublin for decades - and a Community that works for more than its richest members."
 COLDWAR_GER_1970_renegotiate_treaties:0 "Renegotiate the Treaties"
 COLDWAR_GER_1970_renegotiate_treaties_desc:0 "Chancellor Barzel wants the treaties - Bonn cannot afford to look like the enemy of détente - but on better terms: explicit reservations on German unity, on the rights of the expellees, on the status of Berlin. Moscow refuses to reopen signed agreements. The question is whether Bonn has enough to offer to make it change its mind."
 COLDWAR_GER_1970_renew_grand_coalition:0 "Renew the Grand Coalition"
 COLDWAR_GER_1970_renew_grand_coalition_desc:0 "Another four years together. The country is governed calmly, the big reforms pass, the budget is balanced. But the two great parties begin to look alike, their members ask what they are still fighting for, and the voters who want an alternative look for one beyond the two of them."
 COLDWAR_GER_1970_renewable_research:0 "Solar and Wind Research"
 COLDWAR_GER_1970_renewable_research_desc:0 "Growian, the giant wind turbine on the North Sea coast, is a failure: too big, too early, constantly breaking down. The research ministry's solar and wind programmes produce more reports than electricity. But the engineers learn, and the lessons of Growian's failure will be built into a generation of smaller, better machines."
 COLDWAR_GER_1970_renounce_treaties:0 "Renounce the Eastern Treaties"
 COLDWAR_GER_1970_renounce_treaties_desc:0 "Moscow, Warsaw, Prague, the Basic Treaty: 'treaties of renunciation', the Directorate calls them, signed by a republic that no longer exists and binding on no one. The notes are delivered to the embassies in a single morning. Twenty years of détente are torn up - and with them every guarantee that Germany's neighbours had learned to rely on."
 COLDWAR_GER_1970_research_policy:0 "Federal Research Ministry"
 COLDWAR_GER_1970_research_policy_desc:0 "Data processing programmes, nuclear research centres in Jülich and Karlsruhe, the Max Planck Society for basic research and the Fraunhofer institutes for application: the federal research ministry makes the state into a venture capitalist for technologies that no company would finance alone. Some bets pay off; others become museums."
 COLDWAR_GER_1970_restore_basic_law:0 "Restore the Basic Law"
 COLDWAR_GER_1970_restore_basic_law_desc:0 "The Directorate has failed - or has understood in time that it will. The Bundestag is recalled to Bonn, the decrees are lifted, the prisoners are released and free elections are announced. The Republic returns, battered and humbled. Whether the world believes it, and whether the Germans believe it themselves, is a different question."
 COLDWAR_GER_1970_return_premium:0 "Return Premium"
 COLDWAR_GER_1970_return_premium_desc:0 "10,500 marks, plus 1,500 for every child, for every guest worker who goes home for good. The Return Assistance Act of 1983 is the government's attempt to reverse the immigration it never admitted to. Some 250,000 people take the money and leave. Most of the others stay - now with the knowledge that the state would prefer them gone."
 COLDWAR_GER_1970_rhineland_renewed:0 "The Rhineland Model Renewed"
 COLDWAR_GER_1970_rhineland_renewed_desc:0 "No shock therapy: the chancellor keeps the social partnership and buys time with public money - investment in rail and schools, a training levy, early retirement paid for by the pension funds. The Federal Republic stays comfortable. It also stays slow."
 COLDWAR_GER_1970_romanian_germans:0 "The Ransom of the Romanian Germans"
 COLDWAR_GER_1970_romanian_germans_desc:0 "Ceaușescu's Romania sells its ethnic Germans: so many thousand marks for every Transylvanian Saxon and Banat Swabian allowed to leave, paid through secret accounts and negotiated by intelligence officers in hotel rooms. Bonn pays, quietly, and asks no questions about where the money goes. Over the years, two hundred thousand people come to the Federal Republic this way."
 COLDWAR_GER_1970_rotation_principle:0 "The Rotation Principle"
 COLDWAR_GER_1970_rotation_principle_desc:0 "No professional politicians: every Green member of the Bundestag gives up the seat after two years to a successor from the list. It is grassroots democracy in its purest form - and it produces a parliamentary group that never learns the job, loses its best people just as they become effective and gives the other parties endless material for jokes."
 COLDWAR_GER_1970_ruhr_structural_change:0 "Structural Change in the Ruhr"
 COLDWAR_GER_1970_ruhr_structural_change_desc:0 "Universities instead of coal pits, shopping centres instead of blast furnaces, a landscape park where the coking plant used to be. North Rhine-Westphalia sets out to reinvent its industrial heartland: slowly, expensively, with the unions at the table and the miners guaranteed that nobody will fall into unemployment. It takes a generation. Perhaps two."
 COLDWAR_GER_1970_salzgitter:0 "The Salzgitter Registry"
 COLDWAR_GER_1970_salzgitter_desc:0 "Since 1961 a central registry at the public prosecutor's office in Salzgitter, in Lower Saxony, has recorded every shot fired at the border, every death at the Wall and every political sentence in the GDR. The files are meant for the day when the guilty can be brought to trial. East Berlin demands its closure as the price for better relations. Bonn has to decide what the files are worth."
 COLDWAR_GER_1970_saudi_tanks:0 "Leopards for Riyadh?"
 COLDWAR_GER_1970_saudi_tanks_desc:0 "Saudi Arabia wants three hundred Leopard 2 tanks. The money is enormous, the jobs in Munich and Kassel are welcome - and the export guidelines forbid deliveries into areas of tension. Menachem Begin publicly calls Helmut Schmidt a man who served Hitler. The chancellor must decide whether the Federal Republic is a normal country that sells weapons like any other."
 COLDWAR_GER_1970_schengen:0 "Schengen"
 COLDWAR_GER_1970_schengen_desc:0 "June 1985, a riverboat on the Moselle at the Luxembourg village of Schengen: France, Germany and the Benelux countries agree to abolish the controls at their common borders. The customs posts on the Rhine bridges will disappear, and a lorry will drive from Rotterdam to Munich without stopping. The interior ministers worry about criminals; the citizens notice freedom."
 COLDWAR_GER_1970_schmidt_alone:0 "Governing Without a Majority"
 COLDWAR_GER_1970_schmidt_alone_desc:0 "The FDP has left the coalition; the chancellor stays. Helmut Schmidt governs with the SPD alone, from vote to vote, until the Bundestag either backs him or replaces him. It is the loneliest phase of his chancellorship - and in some ways the most impressive, as a man without a majority continues to govern by sheer authority."
 COLDWAR_GER_1970_schmidt_legacy:0 "The Statesman's Farewell"
 COLDWAR_GER_1970_schmidt_legacy_desc:0 "Whatever happens in the Bundestag, the chancellor uses his last months for what he does best: the world economy, the security of Europe, a speech to the Bundestag that both sides will quote for years. History will judge Helmut Schmidt more kindly than his party does. He seems to know it."
 COLDWAR_GER_1970_schmidt_minority:0 "Schmidt Governs Alone"
 COLDWAR_GER_1970_schmidt_minority_desc:0 "The FDP ministers have resigned, the chancellor remains. Helmut Schmidt governs with a minority government - a novelty in Bonn, and a countdown. Every law needs a majority found anew, every budget is a gamble, and the opposition is preparing the vote that will bring it to power."
 COLDWAR_GER_1970_schmidt_snap_election:0 "Let the Voters Decide"
 COLDWAR_GER_1970_schmidt_snap_election_desc:0 "The chancellor could wait for the opposition to bring him down. Or he could ask the Bundestag for a vote of confidence, lose it on purpose and let the Federal President dissolve parliament. It is constitutionally dubious and politically daring - and it lets the voters, not the coalition committees, decide who governs."
 COLDWAR_GER_1970_sdi_research:0 "Partners in SDI Research"
 COLDWAR_GER_1970_sdi_research_desc:0 "Reagan's Strategic Defense Initiative wants laser weapons and missile shields in space - and European laboratories to help build them. The Union sees contracts for German high technology and a place at the frontier of research. The SPD sees a new arms race that could undermine the ABM Treaty and détente itself. Both sides see Washington watching."
 COLDWAR_GER_1970_sdm_bavarian_model:0 "The Bavarian Model"
 COLDWAR_GER_1970_sdm_capital_berlin:0 "Capital of Germany"
 COLDWAR_GER_1970_sdm_expo:0 "Expo Site"
 COLDWAR_GER_1970_sdm_fulda_gap:0 "Fulda Gap Barrier Plans"
 COLDWAR_GER_1970_sdm_garrison:0 "Franco-German Brigade"
 COLDWAR_GER_1970_sdm_high_tech:0 "High-Tech Region"
 COLDWAR_GER_1970_sdm_jena_revival:0 "Jena Reborn"
 COLDWAR_GER_1970_sdm_merged_land:0 "Merged Land"
 COLDWAR_GER_1970_sdm_neckar_valley:0 "Silicon Valley on the Neckar"
 COLDWAR_GER_1970_sdm_nordstaat:0 "Nordstaat"
 COLDWAR_GER_1970_sdm_olympic_city:0 "Olympic City"
 COLDWAR_GER_1970_sdm_red_green_land:0 "Red-Green Land Government"
 COLDWAR_GER_1970_sdm_ruhr_change:0 "Structural Change in the Ruhr"
 COLDWAR_GER_1970_sdm_showcase:0 "Showcase of the West"
 COLDWAR_GER_1970_sdm_steel_rescue:0 "Steel Rescue"
 COLDWAR_GER_1970_sdm_un_city:0 "UN City Bonn"
 COLDWAR_GER_1970_sdm_wackersdorf:0 "Wackersdorf"
 COLDWAR_GER_1970_second_cold_war:0 "Cold War Again"
 COLDWAR_GER_1970_second_cold_war_desc:0 "The coup in Moscow has succeeded, or the Soviets have said no to unity, or the reform in the East has been crushed. Whatever the cause, divided Germany prepares for a long winter: the Wall stays, the missiles stay, the dream of the autumn is over. History has offered a window, and the window has closed."
 COLDWAR_GER_1970_security_group:0 "The Security Group"
 COLDWAR_GER_1970_security_group_desc:0 "The BKA's Security Group protects the constitutional organs: the federal president, the chancellor, the ministers. After the murders of Jürgen Ponto and Hanns Martin Schleyer the list grows to include bankers, judges, industrialists and diplomats - everyone the RAF might choose next. Armoured cars and bodyguards become the symbol of the German Autumn."
 COLDWAR_GER_1970_security_state:0 "The Security State"
 COLDWAR_GER_1970_security_state_desc:0 "Internment for terrorist sympathisers, an amendment to Article 102 to bring back the death penalty for hostage-takers, surveillance without a judge's warrant: in the crisis staff of 1977 such ideas were floated and quietly buried. Now they are written into law. The RAF wanted to provoke the state into revealing its 'fascist face'. Some will say it has succeeded."
 COLDWAR_GER_1970_shipyard_crisis:0 "The Shipyard Crisis"
 COLDWAR_GER_1970_shipyard_crisis_desc:0 "AG Weser in Bremen, one of the great shipyards of the world, closes in 1983 after a hundred and forty years. Asian yards build cheaper, and the merchant fleets no longer need German ships. Bremen, Kiel and Hamburg ask Bonn for money to save what is left. The question is whether the money buys a future or only time."
 COLDWAR_GER_1970_shortcut_atlantic_anchor:0 "West"
 COLDWAR_GER_1970_shortcut_chancellery:0 "Chancellery"
 COLDWAR_GER_1970_shortcut_citizen_in_uniform:0 "Bundeswehr"
 COLDWAR_GER_1970_shortcut_cultural_diplomacy:0 "World"
 COLDWAR_GER_1970_shortcut_dp_hub:0 "Deutschlandpolitik"
 COLDWAR_GER_1970_shortcut_energy_programme:0 "Energy"
 COLDWAR_GER_1970_shortcut_internal_security:0 "Security"
 COLDWAR_GER_1970_shortcut_social_market:0 "Economy"
 COLDWAR_GER_1970_shorter_week:0 "Share the Work"
 COLDWAR_GER_1970_shorter_week_desc:0 "Four million unemployed and an economy that produces more with fewer people every year. Lafontaine's answer: share the work. The 35-hour week, limits on overtime, a right to part-time employment - a programme for full employment paid for with time rather than money. The employers call it a recipe for decline; IG Metall has been demanding it for years."
 COLDWAR_GER_1970_single_market:0 "The Single Market"
 COLDWAR_GER_1970_single_market_desc:0 "The Single European Act of 1986 promises a Europe without internal borders by the end of 1992: goods, capital, services and people moving freely across the Community. For Germany's exporters it is the largest home market in the world. For Germany's beer brewers, insurers and craftsmen, it is the end of a great many comfortable national rules."
 COLDWAR_GER_1970_sister_war:0 "The War of the Sisters"
 COLDWAR_GER_1970_sister_war_desc:0 "Two Christian parties are fighting for the same voters in the same constituencies. The SPD smiles, the FDP rejoices at every split constituency, and the joint parliamentary group of the CDU and CSU in the Bundestag - the foundation of every Union government since 1949 - is about to break apart for good."
 COLDWAR_GER_1970_situation_centre:0 "The Situation Centre"
 COLDWAR_GER_1970_situation_centre_desc:0 "Until now the chancellor learned of a crisis from the morning papers or from a telephone call at midnight. A situation room in the chancellery changes that: BND assessments, the cables from the Permanent Representation in East Berlin and the crisis staff's lines all come together in one windowless room beneath the Palais. Whoever controls the information controls the government's first hour."
 COLDWAR_GER_1970_small_parties_rise:0 "The Opposition Outside Parliament"
 COLDWAR_GER_1970_small_parties_rise_desc:0 "With both big parties in the government, the opposition happens elsewhere: in the small parties of parliament, in the student unions, in the streets, and on the edges of the political spectrum where nobody in Bonn is looking. History has a precedent - the grand coalition of 1966 gave birth to the extra-parliamentary opposition and the NPD's best years."
 COLDWAR_GER_1970_so_nicht:0 "'Not Like This!'"
 COLDWAR_GER_1970_so_nicht_desc:0 "'Not like this!' Rainer Barzel's line on the Eastern treaties is a masterpiece of tactical ambiguity: no blanket rejection of reconciliation with the East, but no ratification on these terms. It keeps the CDU and the CSU together, keeps the expellees' associations on board - and leaves open what the Union would actually do in government."
 COLDWAR_GER_1970_social_market:0 "The Social Market Economy at Twenty-Five"
 COLDWAR_GER_1970_social_market_desc:0 "Twenty-five years after Ludwig Erhard abolished rationing overnight, the social market economy is the Federal Republic's founding myth: full employment, a hard Deutschmark and an export surplus that the world envies. But the miracle years are over. Growth is slowing, the guest workers are staying, and the unions want their share of the wealth they helped to create."
 COLDWAR_GER_1970_social_union:0 "A Social Union"
 COLDWAR_GER_1970_social_union_desc:0 "Pensions, health insurance and unemployment benefit for all Germans on the same terms: the offer of a social union makes a mixed economic order acceptable to the workers of the East, who fear that unity will cost them their jobs and their security. It is also an enormous bill for the West's taxpayers - and the bill will arrive whether or not unity does."
 COLDWAR_GER_1970_sole_mandate_renewed:0 "Renew the Sole Mandate"
 COLDWAR_GER_1970_sole_mandate_renewed_desc:0 "Bonn alone speaks for Germany. Any state that recognises the GDR will lose its West German aid and its West German ambassador: the Hallstein Doctrine, revived. In 1955 it worked; in the 1970s the Third World has other options, and the GDR has friends with money of their own. The question is how many friends Bonn is prepared to lose."
 COLDWAR_GER_1970_solidarity_pact:0 "The Solidarity Pact"
 COLDWAR_GER_1970_solidarity_pact_desc:0 "Unity costs more than anyone admitted in 1990. The Solidarity Pact of 1993 is the answer: a solidarity surcharge on income tax, the German Unity Fund, and a new financial settlement between the Länder that brings the East into the federal equalisation. The West pays, the East receives, and both sides feel that the other is ungrateful."
 COLDWAR_GER_1970_solidarity_support:0 "Parcels for Poland"
 COLDWAR_GER_1970_solidarity_support_desc:0 "December 1981: General Jaruzelski declares martial law in Poland, Solidarność is banned and its leaders interned. Millions of West Germans send food parcels to Poland; the government sends money to the Catholic Church. The question in Bonn is whether it should also speak out for Solidarność - and what that would cost détente."
 COLDWAR_GER_1970_solzhenitsyn_guest:0 "A Guest in the Eifel"
 COLDWAR_GER_1970_solzhenitsyn_guest_desc:0 "February 1974: the Soviet Union expels Alexander Solzhenitsyn. The plane from Moscow lands in Frankfurt, and the first house that opens its door to him belongs to Heinrich Böll, in a village in the Eifel. The Kremlin is watching how Bonn receives its most famous exile."
 COLDWAR_GER_1970_southern_enlargement:0 "Southern Enlargement"
 COLDWAR_GER_1970_southern_enlargement_desc:0 "Greece in 1981, Spain and Portugal in 1986: young democracies, only a few years removed from the colonels, Franco and Salazar, join the Community. The Federal Republic's party foundations helped to build their parties; now German taxpayers help to build their roads. Europe has become the guarantee that the dictatorships do not return."
 COLDWAR_GER_1970_soviet_germans:0 "The Soviet Germans"
 COLDWAR_GER_1970_soviet_germans_desc:0 "Two million ethnic Germans live in Kazakhstan, Siberia and Kyrgyzstan, the descendants of those Stalin deported from the Volga in 1941. Under Gorbachev the gates begin to open - if Bonn asks, and if Bonn is prepared to receive them. Hundreds of thousands come every year at the peak: Germans by law, strangers in the country of their ancestors."
 COLDWAR_GER_1970_soviet_withdrawal:0 "Pay for the Withdrawal"
 COLDWAR_GER_1970_soviet_withdrawal_desc:0 "Three hundred and forty thousand Soviet soldiers and their families are stationed in the GDR. They must go home - to a country that has no flats, no barracks and no jobs for them. Bonn pays twelve billion marks to house them and a few billion more for their transport. The last Soviet soldiers leave Berlin on 31 August 1994. The Germans are free."
 COLDWAR_GER_1970_spaeth_chancellor:0 "The Bremen Putsch"
 COLDWAR_GER_1970_spaeth_chancellor_desc:0 "September 1989: the CDU's reformers want Lothar Späth instead of Helmut Kohl. Geißler, Süssmuth and Späth himself are ready; at the Bremen party congress, in the decisive moment, they lose their nerve. Here they need not. The 'cleverle' from Stuttgart becomes chancellor just as the Wall begins to crumble."
 COLDWAR_GER_1970_spaeth_high_tech:0 "Späth's High-Tech State"
 COLDWAR_GER_1970_spaeth_high_tech_desc:0 "Lothar Späth, 'the cleverle' from Stuttgart, has turned Baden-Württemberg into the most innovative state in the Federal Republic: research parks, technology transfer, venture capital, Daimler and Bosch working with the universities. Now the model is to go federal - and the Federal Republic is to become the Silicon Valley of Europe."
 COLDWAR_GER_1970_spaeth_slow_unity:0 "Unity Without Haste"
 COLDWAR_GER_1970_spaeth_slow_unity_desc:0 "Chancellor Späth will not promise blooming landscapes. Unity, he says, has to be earned and paid for: step by step, mark by mark, with a currency conversion that the East's factories can survive and a timetable that the West's taxpayers can accept. It is the voice of reason. Whether reason wins elections in a year of euphoria is another question."
 COLDWAR_GER_1970_speak_for_dissidents:0 "Name the Prisoners"
 COLDWAR_GER_1970_speak_for_dissidents_desc:0 "At every conference the German delegation reads out names: Sakharov, Orlov, Havel, Bahro. It is loud, it is public, and it makes the other side's diplomats walk out - but for the prisoners, a name known in the West is sometimes the only protection they have."
 COLDWAR_GER_1970_spiritual_moral_turn:0 "The Spiritual-Moral Turn"
 COLDWAR_GER_1970_spiritual_moral_turn_desc:0 "Helmut Kohl promises more than a change of government: a geistig-moralische Wende, a spiritual and moral turn. Less state, more family, more enterprise, an unashamed loyalty to the West and an end to the cultural dominance of the generation of 1968. What exactly that means in practice remains, as so often with this chancellor, pleasantly unclear."
 COLDWAR_GER_1970_stammheim_trial:0 "The Stammheim Trial"
 COLDWAR_GER_1970_stammheim_trial_desc:0 "A fortified courtroom built next to the prison at Stuttgart-Stammheim, defence lawyers excluded for alleged complicity, the defendants on hunger strike in protest against their conditions of detention. Holger Meins has already starved to death in his cell. The trial of the RAF's leaders is meant to show the strength of the rule of law. The world watches whether it does."
 COLDWAR_GER_1970_stasi_files:0 "Open the Stasi Files"
 COLDWAR_GER_1970_stasi_files_desc:0 "Six million files, a hundred and eighty kilometres of shelves, the record of a whole society spied upon by itself. Every citizen may now read what the Ministry for State Security wrote about them - and learn which friend, which colleague, which husband informed on them. The Gauck authority opens in January 1992. The country begins to read."
 COLDWAR_GER_1970_state_of_the_republic:0 "State of the Bonn Republic"
 COLDWAR_GER_1970_state_of_the_republic_desc:0 "The balance of security and liberty, the threat of terrorism, the pressure of scandals, the Bundesbank's patience and the depth of Western integration, all at once.\nSecurity state: §Y[?cwger_security|0]§! | Rule of law: §Y[?cwger_rechtsstaat|0]§!\nPeace movement: §Y[?cwger_peace_movement|0]§! | Burden of the East: §Y[?cwger_east_burden|0]§! | Stasi penetration §Y[?cwger_stasi_penetration|0]§! vs counter-intelligence §Y[?cwger_counterintel|0]§!\nTerror threat (left/right/foreign): §Y[?cwger_terror_left|0]§! / §Y[?cwger_terror_right|0]§! / §Y[?cwger_terror_foreign|0]§!\nBundestag: government §Y[?cwger_seats_gov|0]§! of §Y[?cwger_seats_total|0]§! seats (majority §Y[?cwger_majority|0]§!)."
 COLDWAR_GER_1970_steel_crisis:0 "The Steel Crisis"
 COLDWAR_GER_1970_steel_crisis_desc:0 "The steelworks of the Saar and the Ruhr are losing to Japan, Korea and Brazil, which produce cheaper and newer. Mergers, subsidies and quotas from Brussels are meant to slow the decline; in 1978 IG Metall calls the first long strike in the steel industry for the 35-hour week. Whole towns live from the blast furnaces. What happens to them when the fires go out?"
 COLDWAR_GER_1970_stimulus_1975:0 "Stimulus Programme"
 COLDWAR_GER_1970_stimulus_1975_desc:0 "The first real recession since the war: a million unemployed, short-time work in every industrial town, factories idle. The government reaches for Keynes - investment grants, construction programmes, regional aid - and borrows to pay for it. The Bundesbank watches with folded arms, ready to raise interest rates the moment it sees inflation."
 COLDWAR_GER_1970_strauss_aerospace:0 "MBB and Airbus"
 COLDWAR_GER_1970_strauss_aerospace_desc:0 "Strauß chairs the supervisory board of Airbus and wants a German aerospace champion to rival Boeing and Dassault: Messerschmitt-Bölkow-Blohm in Ottobrunn, fighter jets, satellites, helicopters. Defence contracts and research money flow south. In Hamburg and Bremen, where the other plants are, people ask why everything always ends up in Bavaria."
 COLDWAR_GER_1970_strauss_east_credit:0 "The Surprising Credit"
 COLDWAR_GER_1970_strauss_east_credit_desc:0 "Of all people, the man who denounced Ostpolitik as a sell-out arranges a loan of a billion marks for Erich Honecker - guaranteed by Bonn, negotiated with Alexander Schalck-Golodkowski. In return the GDR dismantles the automatic firing devices on the border. Only Nixon could go to China, they say in Bonn. Only Strauß could go to East Berlin."
 COLDWAR_GER_1970_strauss_model:0 "The Bavarian Model"
 COLDWAR_GER_1970_strauss_model_desc:0 "Chancellor Franz Josef Strauß: aerospace and nuclear power, low taxes and a strong police, a loud voice in Washington and an even louder one in his own cabinet. What Bavaria has become under the CSU - a farming state turned into a high-tech region - is now to become the model for the Federal Republic."
 COLDWAR_GER_1970_strauss_moscow_flight:0 "Strauß Flies to Moscow"
 COLDWAR_GER_1970_strauss_moscow_flight_desc:0 "December 1987: the Bavarian premier pilots his own Cessna through a snowstorm to Moscow. The anti-communist of the 1950s, the man who wanted nuclear weapons for the Bundeswehr, sits down with Mikhail Gorbachev - and comes home impressed. If Strauß says the Soviet Union has changed, even his own voters begin to believe it."
 COLDWAR_GER_1970_strauss_of_the_right:0 "A Home on the Right"
 COLDWAR_GER_1970_strauss_of_the_right_desc:0 "'There must be no democratically legitimate party to the right of the CSU.' Strauß's maxim was meant for Bavaria; now it is to apply to the whole country. The CSU absorbs the national conservatives, the disappointed expellees and the law-and-order voters before anyone further to the right can claim them. It is a strategy of containment - and a risk of contagion."
 COLDWAR_GER_1970_street_and_ballot:0 "The Street and the Ballot Box"
 COLDWAR_GER_1970_street_and_ballot_desc:0 "Torchlight marches in provincial towns, a 'national' newspaper at every kiosk, veterans' associations in the front row of the rallies. The far right no longer hides in back rooms; it marches with the government's blessing. And the other side takes to the streets as well: trade unions, churches, students. The Republic is being contested in the market squares."
 COLDWAR_GER_1970_strong_state:0 "The Strong State"
 COLDWAR_GER_1970_strong_state_desc:0 "Whoever attacks the state will meet the whole of the state: more police, more powers, more computers, and less patience with those who ask about the price. The government promises the citizens security. The intellectuals warn of a police state; the government answers that the real danger comes from those who shoot."
 COLDWAR_GER_1970_support_round_table:0 "Support the Round Table"
 COLDWAR_GER_1970_support_round_table_desc:0 "At the Round Table in East Berlin the SED sits opposite the new opposition: New Forum, Democracy Now, the Social Democrats of the East, pastors and environmental activists. They have courage but no money, no offices and no printing presses. Bonn sends them all three - quietly, through the party foundations, so that the SED cannot call them Western puppets."
 COLDWAR_GER_1970_swing_credit:0 "The Swing"
 COLDWAR_GER_1970_swing_credit_desc:0 "Inner-German trade runs on an interest-free overdraft, the 'Swing', which allows the GDR to buy more from the West than it sells. Raise the ceiling and East Berlin becomes a little more dependent on Bonn's goodwill - and a little more willing to grant concessions on travel and family visits. Lower it, and the planners in East Berlin feel it within a quarter."
 COLDWAR_GER_1970_take_gorbachev_at_word:0 "Take Gorbachev at His Word"
 COLDWAR_GER_1970_take_gorbachev_at_word_desc:0 "Davos, February 1987: Hans-Dietrich Genscher tells the West to take Mikhail Gorbachev at his word - to test whether glasnost and perestroika are real by offering the Soviet leader real agreements. In Washington and London they hear 'Genscherism' and suspect Bonn of going soft. In Moscow they hear an open door."
 COLDWAR_GER_1970_tax_reform_1990:0 "The Stoltenberg Tax Reform"
 COLDWAR_GER_1970_tax_reform_1990_desc:0 "Gerhard Stoltenberg's tax reform lowers income tax in three stages, cutting the entry rate and the top rate alike - the largest tax relief in the Republic's history so far. It is meant to reward effort and to bring the economy out of its stagnation. The opposition calls it a gift for the rich; the economists, overdue."
 COLDWAR_GER_1970_ten_point_plan:0 "The Ten-Point Plan"
 COLDWAR_GER_1970_ten_point_plan_desc:0 "28 November 1989: without telling his allies or his coalition partner, Helmut Kohl presents a ten-point plan to the Bundestag - aid for the GDR, confederative structures between the two states, and finally a federation. Washington is surprised, Paris and London are furious, Moscow warns. The chancellor has seized the initiative and will not let it go."
 COLDWAR_GER_1970_tennis_nation:0 "Boris and Steffi"
 COLDWAR_GER_1970_tennis_nation_desc:0 "A seventeen-year-old from Leimen wins Wimbledon with a dive across the grass; a girl from Brühl beats Martina Navratilova. Within a summer, tennis courts are sold out in every suburb and the whole country watches matches that start at two in the afternoon."
 COLDWAR_GER_1970_textbook_commission:0 "The Textbook Commission"
 COLDWAR_GER_1970_textbook_commission_desc:0 "German and Polish historians sit down to read each other's schoolbooks - the war, the expulsions, the Oder and the Neisse - and to agree on what children on both sides should learn. In Bavaria the expellees' associations call it a betrayal before the first page is written."
 COLDWAR_GER_1970_third_way_paper:0 "Europe: The Third Way"
 COLDWAR_GER_1970_third_way_paper_desc:0 "A joint paper with London: flexible labour markets, lower taxes for companies, a state that activates rather than provides. In Downing Street it is a manifesto for a new European social democracy. In the SPD's local branches it reads like a declaration of war."
 COLDWAR_GER_1970_three_percent:0 "Three Percent Is Enough"
 COLDWAR_GER_1970_three_percent_desc:0 "The five-per-cent hurdle was the Republic's answer to Weimar's splinter parties - and it keeps out new movements just as effectively. Lowering it to three per cent would make the Bundestag more colourful and more representative. Some of the new colours would be welcome; others have names that the Republic hoped never to hear in its parliament again."
 COLDWAR_GER_1970_tiananmen_business:0 "After Tiananmen: Business"
 COLDWAR_GER_1970_tiananmen_business_desc:0 "A year after the massacre the first German minister is back in Beijing; Volkswagen is building in Shanghai, Siemens wants the high-speed line. Change through trade, says the government. The human rights groups call it a licence to shoot."
 COLDWAR_GER_1970_tiananmen_sanctions:0 "After Tiananmen: Sanctions"
 COLDWAR_GER_1970_tiananmen_sanctions_desc:0 "Tanks on the Square of Heavenly Peace, students shot on the Avenue of Eternal Peace. The Community freezes arms sales and ministerial contacts with Beijing. For Bonn, which has courted China since 1972, the question is how long a freeze can last."
 COLDWAR_GER_1970_tied_aid:0 "Aid that Buys German"
 COLDWAR_GER_1970_tied_aid_desc:0 "Development credits, but with a condition: the turbines come from Siemens, the trucks from Daimler, the consultants from Frankfurt. The Ministry of Economics is delighted; the Development Ministry calls it an export subsidy with a humanitarian label."
 COLDWAR_GER_1970_tornado:0 "Tornado"
 COLDWAR_GER_1970_tornado_desc:0 "The Panavia Tornado is a European answer to an American question: Britain, Italy and Germany share the enormous cost of a low-level strike aircraft that can fly under the Warsaw Pact's radar and deliver conventional - and nuclear - weapons. It is late and expensive. It is also the first time Europe has built a front-line combat aircraft together."
 COLDWAR_GER_1970_tornado_ecr:0 "Tornado ECR"
 COLDWAR_GER_1970_tornado_ecr_desc:0 "Electronic combat and reconnaissance Tornados, armed with HARM missiles that home in on enemy radar: Germany's contribution to NATO air campaigns is not to drop bombs but to blind the enemy's air defence so that others can. It is a specialised role that the allies badly need - and a way for Germany to fight without being seen to fight too much."
 COLDWAR_GER_1970_transparency_act:0 "The Transparency Act"
 COLDWAR_GER_1970_transparency_act_desc:0 "Every donation above ten thousand marks published within a month, cash donations banned, prison for false accounts, the party's entire assets disclosed every year. After the scandals the Bundestag writes the strictest party finance law in Europe. The party treasurers sigh. The voters may begin to trust again."
 COLDWAR_GER_1970_treaty_community:0 "Treaty Community"
 COLDWAR_GER_1970_treaty_community_desc:0 "Hans Modrow, the reform communist, offers a contractual community between two sovereign states, then a confederation, and unity at the end - in years, not months. It is a serious offer from a serious man. The people in the streets have stopped chanting 'We are the people' and now chant 'We are one people'. They do not want to wait years."
 COLDWAR_GER_1970_treuhand:0 "The Treuhandanstalt"
 COLDWAR_GER_1970_treuhand_desc:0 "Eight and a half thousand state enterprises, four million employees, an economy built for the Comecon market that no longer exists. The Treuhandanstalt is to privatise, restructure or close them all. Its first president is murdered by the RAF; its second sells off the East's industry at a pace that leaves whole regions without work. The bill arrives with the unemployment."
