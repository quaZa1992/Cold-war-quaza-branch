 cwgg_rv_init_tt:0 "§YInitiative§!\nThe currency of the inner-German game. Every action, every course in a crisis and every negotiation costs initiative.\n\nPer month: §G+1§!, §G+1§! with the Permanent Representation open, §G+1§! during a crisis or worse, and a chance of §G+1§! with the chancellery's situation centre.\nEast Berlin has §Y[?cwgg_init_ddr|0]§!/6."
 cwgg_rv_int_lbl:0 "Intensity §Y[?cwgg_krise_int|0]§!/100   ·   round §Y[?cwgg_krise_runde|0]§! of §Y[?cwgg_krise_max|0]§!"
 cwgg_rv_k_lbl_l:0 "Confrontation"
 cwgg_rv_k_lbl_r:0 "Interdependence"
 cwgg_rv_k_left:0 "§R-100§!"
 cwgg_rv_k_right:0 "§G+100§!"
 cwgg_rv_klima:0 "Climate §Y[?cwgg_klima|0]§!   ·   drifting towards §Y[?cwgg_basis|0]§!   ·   escalation pressure §R[?cwgg_druck|0]§!"
 cwgg_rv_klima_tt:0 "§YClimate§! runs from §R-100§! (confrontation) to §G+100§! (interdependence). Every month it moves 5% of the way towards its base, minus a share of the escalation pressure.\n\n§YThe base§! adds up: §G+4§! per treaty in force, §G+2§! per open channel (§G+1§! if strained), Cold War world tension above 50 lowers it, the SED leader (Ulbricht §R-5§!, Honecker §R-5§! in 1980-82 and §G+5§! from 1983, Krenz §R-5§!, Modrow §G+15§!, a reform government §G+20§!), Moscow's line (Brezhnev Doctrine §R-10§!, New Thinking §G+10§!, Sinatra Doctrine §G+15§!, a hard-line coup §R-25§!), a CDU/CSU chancellor §R-5§!, the Greens in government §G+3§!, the NATO double-track decision §R-5§!, the zero option §G+5§!, and the course chosen in the focus tree.\n\n§YEscalation pressure§! comes from incidents and crisis rounds and falls by 10% a month."
 cwgg_rv_lastround:0 "Last round: we chose §Y[RV_LastStance]§!, East Berlin [RV_LastAnswer] - intensity §Y[?cwgg_last_dint|0]§!"
 cwgg_rv_lev_allianz_tt:0 "§YAlliance§!: level §Y[?cwgg_hebel_allianz|0]§!/3\nThe rights of the Three Powers in Berlin and the NATO guarantee.\n\nUsed by §YCounter-Pressure§! in crises where it bites. Grown through focuses and actions."
 cwgg_rv_lev_devisen_tt:0 "§YHard Currency§!: level §Y[?cwgg_hebel_devisen|0]§!/3\nThe Swing, state-guaranteed credits and transit payments. East Berlin needs Deutschmarks more every year.\n\nUsed by §YCounter-Pressure§! in crises where it bites. Grown through focuses and actions."
 cwgg_rv_lev_handel_tt:0 "§YTrade§!: level §Y[?cwgg_hebel_handel|0]§!/3\nInner-German trade and the GDR's back door into the Common Market.\n\nUsed by §YCounter-Pressure§! in crises where it bites. Grown through focuses and actions."
 cwgg_rv_lev_medien_tt:0 "§YMedia§!: level §Y[?cwgg_hebel_medien|0]§!/3\nARD and ZDF reach most of the GDR; RIAS and Deutsche Welle the rest.\n\nUsed by §YCounter-Pressure§! in crises where it bites. Grown through focuses and actions."
 cwgg_rv_lev_menschen_tt:0 "§YPeople§!: level §Y[?cwgg_hebel_menschen|0]§!/3\nHäftlingsfreikauf and family reunification - quiet deals through lawyers and churches.\n\nUsed by §YCounter-Pressure§! in crises where it bites. Grown through focuses and actions."
 cwgg_rv_lev_recht_tt:0 "§YLegal Position§!: level §Y[?cwgg_hebel_recht|0]§!/3\nThe sole-mandate claim, one German citizenship, the Salzgitter registry of the regime's crimes.\n\nUsed by §YCounter-Pressure§! in crises where it bites. Grown through focuses and actions."
