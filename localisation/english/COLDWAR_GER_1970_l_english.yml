 COLDWAR_GER_1970_tt_ucons_usa_15:0 "Unity talks: the United States grows more willing to accept one German state (§G+15§! goodwill)."
 COLDWAR_GER_1970_tt_ultimatum:0 "The deadline is §Y21§! days. Run the crisis from the §YInternal Security§! window (crisis staff): storm with GSG 9, raid the safe houses, impose a contact ban, play for time - or give in."
 COLDWAR_GER_1970_tt_vote:0 "The vote will decide whether the government survives."
 COLDWAR_GER_1970_tt_wende:0 "§YDie Wende§!: the Union and the FDP form a new government without an election."
 COLDWAR_GER_1970_tt_win_two:0 "The government gains §Gtwo votes§!, and the FDP moves towards the chancellor's party."
 COLDWAR_GER_1970_tt_win_vote:0 "The government gains §Gone vote§!."
 COLDWAR_GER_1970_two_plus_four_west:0 "Unity Inside NATO"
 COLDWAR_GER_1970_two_plus_four_west_desc:0 "London fears a Fourth Reich, Paris wants a guarantee that Germany will stay in Europe, Moscow wants it out of NATO. Bonn needs Washington to persuade the others that a united Germany inside NATO is the safest Germany - anchored, contained and reliable. George Bush is the first to agree. The others will need longer."
 COLDWAR_GER_1970_two_thirds_reforms:0 "The Power of Two Thirds"
 COLDWAR_GER_1970_two_thirds_reforms_desc:0 "Together the two big parties hold the two-thirds majority in both chambers that every amendment of the Basic Law requires. What they agree on, nobody can stop: not the small parties, not the Länder, not the street. A grand coalition is the moment for the reforms that are too big for any single camp - and a temptation to rewrite the rules in its own favour."
 COLDWAR_GER_1970_two_way_street:0 "Culture as a Two-Way Street"
 COLDWAR_GER_1970_two_way_street_desc:0 "Hildegard Hamm-Brücher's guidelines turn cultural policy on its head: no more exporting Beethoven and the German idea, but exchange - partners invited to Germany, foreign artists in German theatres, a dialogue rather than a lecture."
 COLDWAR_GER_1970_type_209:0 "The Type 209"
 COLDWAR_GER_1970_type_209_desc:0 "HDW in Kiel builds a small, quiet, reliable diesel-electric submarine for export, and the world's navies queue up for it: Greece, Argentina, Peru, Turkey, India, South Korea. The Type 209 becomes the most successful submarine design of the post-war era. Every contract keeps the yard alive - and every contract is an argument about where German weapons should go."
 COLDWAR_GER_1970_u_rr_fail:0 "§RNo agreement.§! The delegations could not find common ground."
 COLDWAR_GER_1970_u_rr_ok:0 "§GAgreement.§! Both delegations accepted the same position."
 COLDWAR_GER_1970_un_city_bonn:0 "Bonn, City of the United Nations"
 COLDWAR_GER_1970_un_city_bonn_desc:0 "The government is moving to Berlin, and the federal city on the Rhine fears it will become a provincial town with too many empty ministries. The answer: the climate secretariat, the UN Volunteers and a dozen other agencies move into the old parliamentary quarter."
 COLDWAR_GER_1970_un_entry:0 "Germany at the United Nations"
 COLDWAR_GER_1970_un_entry_desc:0 "18 September 1973: on the East River in New York, the black, red and gold flag of the Federal Republic is raised in front of the United Nations - next to the flag of the GDR, admitted on the same day. Bonn now has a voice in the General Assembly and a delegation to staff. It also has a seat in a hall where the other German state speaks too."
 COLDWAR_GER_1970_un_security_council:0 "A Seat at the Security Council"
 COLDWAR_GER_1970_un_security_council_desc:0 "The Federal Republic serves as a non-permanent member of the Security Council in 1977-78 and 1987-88, and German diplomats prove themselves skilled at the work. After unity, the question becomes a bigger one: should the third-largest contributor to the United Nations' budget have a permanent seat at the table where the decisions are made?"
 COLDWAR_GER_1970_union_opposition:0 "The Union in Opposition"
 COLDWAR_GER_1970_union_opposition_desc:0 "For twenty years the CDU/CSU provided every chancellor. Now it sits on the opposition benches after losing power by a handful of seats, convinced that the state belongs to it and that the Eastern treaties are a sell-out of the German question. The Union has to decide what kind of opposition it wants to be - and whether it can bring down the government before the next election."
 COLDWAR_GER_1970_unity_treaty:0 "The Unification Treaty"
 COLDWAR_GER_1970_unity_treaty_desc:0 "Nine hundred pages that merge two legal systems, two pension systems, two education systems and two armies. Wolfgang Schäuble and Günther Krause negotiate it in a few weeks: property questions, abortion law, the fate of the Stasi files, the capital. Never has a treaty of this size been written so quickly - and never will one have so many consequences."
 COLDWAR_GER_1970_university_framework:0 "The Universities Framework Act"
 COLDWAR_GER_1970_university_framework_desc:0 "One federal law for all the universities of the Republic: the Universities Framework Act decides who governs the institution - the professors alone, as before 1968, or a group university in which assistants and students have a vote. The Constitutional Court has already said that professors must keep the majority on questions of research. Everything else is politics."
 COLDWAR_GER_1970_untied_aid:0 "Aid without Strings"
 COLDWAR_GER_1970_untied_aid_desc:0 "Bonn follows the OECD's advice and unties most of its development aid: partners may buy wherever it is cheapest, and the projects are judged by what they achieve, not by how many German machines they ship. Industry complains, the recipients notice."
 COLDWAR_GER_1970_urengoy:0 "The Urengoy Pipeline"
 COLDWAR_GER_1970_urengoy_desc:0 "A credit of 3.4 billion marks for a pipeline from the gas fields of Urengoy to Western Europe. The Reagan administration wants it stopped: it would make Europe dependent on Moscow and fill the Soviet treasury with hard currency. Bonn builds it anyway. It is the first time the Federal Republic openly defies Washington on a matter of economic security."
 COLDWAR_GER_1970_uruguay_round:0 "The Uruguay Round"
 COLDWAR_GER_1970_uruguay_round_desc:0 "Eight years of negotiations on free trade in goods, services and intellectual property, and a World Trade Organization at the end of them. The Federal Republic, which lives from its exports, has everything to gain. The fight is with the French farmers, who block the motorways with tractors - and with the German farmers, who would quietly prefer to do the same."
 COLDWAR_GER_1970_venice_declaration:0 "The Venice Declaration"
 COLDWAR_GER_1970_venice_declaration_desc:0 "June 1980, Venice: the Nine recognise the right of the Palestinian people to self-determination and call for the PLO to be associated with the peace negotiations. It is the first time Western Europe takes a position on the Middle East that differs openly from Washington's. Jerusalem compares it to Munich in 1938. Bonn's signature is on it."
 COLDWAR_GER_1970_verfassungsschutz:0 "Counter-Espionage"
 COLDWAR_GER_1970_verfassungsschutz_desc:0 "The HVA of Markus Wolf has hundreds of agents in the Federal Republic: secretaries in ministries, aides in the chancellery, officers in NATO headquarters. The Office for the Protection of the Constitution in Cologne needs more than files and filing cabinets. It needs agents of its own, defectors who talk, and the patience to turn the enemy's spies."
 COLDWAR_GER_1970_vergangenheitsbewaeltigung:0 "Confronting the Past"
 COLDWAR_GER_1970_vergangenheitsbewaeltigung_desc:0 "The Majdanek trial in Düsseldorf runs for five years; the American series 'Holocaust' is watched by twenty million West Germans in 1979 and does what decades of documentation could not; the Bundestag abolishes the statute of limitations for murder so that the perpetrators can still be tried. Coming to terms with the past is not a single act but a task without end."
 COLDWAR_GER_1970_vocational_training:0 "The Dual System"
 COLDWAR_GER_1970_vocational_training_desc:0 "Two days at the vocational school, three days at the workbench: the dual system of apprenticeship trains two-thirds of every generation as skilled workers and is the quiet strength behind 'Made in Germany'. Youth unemployment is lower than anywhere else in Europe. Other countries send delegations to study it; few manage to copy it."
 COLDWAR_GER_1970_volga_germans:0 "Exit for the Soviet Germans"
 COLDWAR_GER_1970_volga_germans_desc:0 "Two million Germans live in the Soviet Union - descendants of the settlers Catherine the Great invited to the Volga, deported to Kazakhstan by Stalin in 1941. Most of them want only one thing: to leave. Moscow lets out a few thousand a year, and Bonn wonders what the rest would cost."
 COLDWAR_GER_1970_voting_age_18:0 "Voting Age Eighteen"
 COLDWAR_GER_1970_voting_age_18_desc:0 "Students who marched against the emergency laws, apprentices who joined the unions at sixteen, conscripts who can be sent to the border but not to the ballot box: lowering the voting age to eighteen brings the generation of 1968 into the electorate. The SPD expects their gratitude. The young voters have not promised it."
 COLDWAR_GER_1970_wackersdorf:0 "Wackersdorf"
 COLDWAR_GER_1970_wackersdorf_desc:0 "A reprocessing plant for plutonium in the forests of the Upper Palatinate - Strauß's prestige project and the core of the German nuclear fuel cycle. It becomes the scene of the fiercest battles the anti-nuclear movement ever fought: tens of thousands in the woods, CS gas from helicopters, protests from neighbouring Austria. Bavaria never gives way, says the premier."
 COLDWAR_GER_1970_waldsterben:0 "Forest Dieback"
 COLDWAR_GER_1970_waldsterben_desc:0 "'The forest is dying', Der Spiegel announces on its cover: needles falling, crowns thinning, acid rain from the power stations' chimneys. No issue has moved the Germans like this one; the forest is a part of their soul. Environmental policy leaves the fringes and enters the chancellery. The power stations get scrubbers, the cars catalytic converters."
 COLDWAR_GER_1970_wandel_durch_annaeherung:0 "Change through Rapprochement"
 COLDWAR_GER_1970_wandel_durch_annaeherung_desc:0 "Tutzing, July 1963: Egon Bahr, Brandt's press spokesman in West Berlin, offers a formula that will shape two decades - change through rapprochement. Accept the realities in order to change them; small steps for people instead of big words about unity. The Union calls it capitulation. The people waiting at the crossing points call it hope."
 COLDWAR_GER_1970_warsaw_treaty:0 "The Warsaw Treaty"
 COLDWAR_GER_1970_warsaw_treaty_desc:0 "December 1970: the Treaty of Warsaw recognises the Oder-Neisse line as Poland's western border. Before signing it, Willy Brandt lays a wreath at the memorial to the heroes of the Warsaw Ghetto - and falls to his knees. The photograph travels around the world. At home, a majority of West Germans think the kneeling was exaggerated. History will disagree."
 COLDWAR_GER_1970_wealth_tax:0 "Tax the Rich"
 COLDWAR_GER_1970_wealth_tax_desc:0 "A wealth tax, a higher top rate of income tax and an end to the loopholes on capital gains: the money for rebuilding the East and for the jobs programme is to come from those who have it. The unions applaud, the business associations threaten to invest abroad, and the Bundesbank warns of capital flight. Social democracy has rediscovered its old enemy."
 COLDWAR_GER_1970_weimar_triangle:0 "The Weimar Triangle"
 COLDWAR_GER_1970_weimar_triangle_desc:0 "August 1991, in Weimar - the city of Goethe and Schiller and of the Republic that failed. The foreign ministers of Germany, France and Poland meet for the first time as a group. The idea is simple: Germany's eastern neighbour is to be anchored in the West as the Federal Republic once was, with France as the third partner so that no one fears a German Central Europe."
 COLDWAR_GER_1970_weizsaecker_speech:0 "8 May 1985"
 COLDWAR_GER_1970_weizsaecker_speech_desc:0 "8 May 1985, forty years after the end of the war. Richard von Weizsäcker tells the Bundestag that it was a day of liberation - also for the Germans - and that whoever closes his eyes to the past becomes blind to the present. The speech is printed in millions of copies and taught in schools. The Republic has found a language for its history."
 COLDWAR_GER_1970_west_media_strategy:0 "Western Television for the East"
 COLDWAR_GER_1970_west_media_strategy_desc:0 "ARD and ZDF can be watched across the entire GDR except for the 'valley of the clueless' around Dresden. Every evening at eight, millions of East Germans watch the Tagesschau and know more about the Federal Republic than about their own country. The West comes in through the aerial. Bonn can decide whether to make programmes that are meant for the East."
 COLDWAR_GER_1970_wintex:0 "WINTEX"
 COLDWAR_GER_1970_wintex_desc:0 "Every two years the federal government, the Joint Committee and NATO rehearse the state of defence for a fortnight in the government bunker under the Ahr valley - including the moment when NATO requests the release of nuclear weapons on targets in both German states. In 1989 the West German participants refuse to play that part of the script. The exercise is never held again."
 COLDWAR_GER_1970_withdrawal_fund:0 "A Fund for the Soviet Withdrawal"
 COLDWAR_GER_1970_withdrawal_fund_desc:0 "Barracks, flats, retraining and pensions for the soldiers of the Group of Soviet Forces in Germany, paid for by Bonn - in advance. Moscow cannot afford to bring its army home; the Soviet economy is collapsing. A fund for the withdrawal is the price of the Kremlin's signature under any treaty on unity. It is the cheapest liberation in history."
 COLDWAR_GER_1970_working_longer:0 "The Pension Reform of 1992"
 COLDWAR_GER_1970_working_longer_desc:0 "Fewer children, longer lives, and a pension system that pays today's retirees out of today's contributions. The pension reform of 1992 raises the retirement age step by step and ties pensions to net rather than gross wages. It is the first great reform that the opposition helps to write - and it is passed on the very day the Berlin Wall falls."
 COLDWAR_GER_1970_working_time_385:0 "The 38.5-Hour Week"
 COLDWAR_GER_1970_working_time_385_desc:0 "Spring 1984: IG Metall strikes for seven weeks for the 35-hour week, the employers lock out hundreds of thousands, and the car industry grinds to a halt. Georg Leber mediates the compromise: 38.5 hours, with flexible working time at plant level. Both sides claim victory. The road to the 35-hour week is open."
 COLDWAR_GER_1970_works_constitution:0 "Works Constitution Act"
 COLDWAR_GER_1970_works_constitution_desc:0 "The Works Constitution Act of 1972 gives the works councils a say in hiring, overtime and the layout of the shop floor, and lets the unions into the factory gates. For the DGB it is a down payment on economic democracy; for the employers' associations, a step towards the trade union state. On the shop floor it means one thing above all: the foreman no longer decides alone."
 COLDWAR_GER_1970_world_cup_1974:0 "World Champions 1974"
 COLDWAR_GER_1970_world_cup_1974_desc:0 "Gerd Müller turns and shoots in Munich's Olympic Stadium, Franz Beckenbauer lifts the cup, and the Federal Republic is world champion for the second time. But the tournament has another story: in Hamburg, in the only match ever played between the two German states, Jürgen Sparwasser scores for the GDR. Both Germanys celebrate - each for a different reason."
 COLDWAR_GER_1970_world_cup_1990:0 "World Champions 1990"
 COLDWAR_GER_1970_world_cup_1990_desc:0 "Rome, July 1990: Andreas Brehme's penalty in the eighty-fifth minute, Argentina beaten, and Franz Beckenbauer walking alone across the pitch of the Stadio Olimpico, lost in thought. Germany is world champion for the third time, in the year of unity. 'I am sorry for the rest of the world', says Beckenbauer, 'but we will be unbeatable for years.' He will be wrong."
 COLDWAR_GER_1970_yugoslav_partnership:0 "Tito's Germans"
 COLDWAR_GER_1970_yugoslav_partnership_desc:0 "Half a million Yugoslav guest workers live in the Federal Republic, and Tito's non-aligned Yugoslavia is the most open country of the socialist world. Belgrade wants credits instead of reparations for the occupation; Bonn wants Belgrade to stop sheltering terrorists and to hand over those it arrests. A partnership of interest, with Tito's death looming over it."
 COLDWAR_GGR.10.a:0 "Back to business."
 COLDWAR_GGR.10.b:0 "Open the situation map."
 COLDWAR_GGR.10.desc1:0 "East Berlin has given way. In Bonn the government speaks of steadiness, in Neues Deutschland of 'provocations repelled'. The opposition has one argument fewer."
 COLDWAR_GGR.10.desc2:0 "East Berlin has had its way. The SED celebrates a victory over 'revanchism', the opposition in Bonn speaks of weakness, and in Washington people ask whether Bonn can be relied on."
 COLDWAR_GGR.10.desc3:0 "The crisis has not been settled - it has frozen. Nobody gave way, nobody won, and the issue is still there. It may flare up again."
 COLDWAR_GGR.10.desc4:0 "We gave way at the brink. The world breathes again, and the opposition sharpens its knives. East Berlin will remember that pressure works."
 COLDWAR_GGR.10.desc5:0 "East Berlin blinked first. Its troops stand down and its press falls silent. It is a victory - and the GDR leadership will not forgive the humiliation soon."
 COLDWAR_GGR.10.desc6:0 "Moscow has reined in its ally. The Soviet ambassador visited the SED leadership at night; by morning the crisis was over. Bonn has won - but the decision was taken in the Kremlin."
 COLDWAR_GGR.10.desc7:0 "Both sides have moved. Nobody calls it a victory, both governments call it a success - and the communiqué is long enough that everyone can find a sentence they like."
 COLDWAR_GGR.10.t:0 "The Crisis Is Over"
 COLDWAR_GGR.101.a:0 "Convene the crisis staff."
 COLDWAR_GGR.101.b:0 "Let the ministries handle it for now."
 COLDWAR_GGR.101.desc:0 "At Helmstedt and Dreilinden the East German border troops are taking every car apart. Lorries wait for twelve hours, coaches are turned back, a Bundestag deputy has been refused passage. East Berlin speaks of 'abuse of the transit routes'. West Berlin, a hundred and seventy kilometres inside the GDR, feels the noose tighten.\n\nA §YTransit Crisis§! has begun. Its intensity starts at §Y40§!. Every six months a round is resolved: both sides choose a course, and the crisis ends when its intensity falls to zero, reaches the brink at 100, or freezes after §Y4§! rounds."
 COLDWAR_GGR.101.t:0 "Trouble on the Transit Routes"
 COLDWAR_GGR.102.a:0 "Convene the crisis staff."
 COLDWAR_GGR.102.b:0 "Let the ministries handle it for now."
 COLDWAR_GGR.102.desc:0 "A young man from Thuringia tried to cross the fence near the Werra last night. The border troops opened fire. He bled to death in the strip while West German customs officers watched from fifty metres away. The pictures are on every front page; East Berlin calls it the defence of the state border.\n\nA §YBorder Incident§! has begun. Its intensity starts at §Y35§!. Every six months a round is resolved: both sides choose a course, and the crisis ends when its intensity falls to zero, reaches the brink at 100, or freezes after §Y3§! rounds."
 COLDWAR_GGR.102.t:0 "Shots at the Border"
 COLDWAR_GGR.103.a:0 "Convene the crisis staff."
 COLDWAR_GGR.103.b:0 "Let the ministries handle it for now."
 COLDWAR_GGR.103.desc:0 "The Federal Office for the Protection of the Constitution has arrested a man with access to secrets he should never have seen. The trail leads to the HVA in East Berlin - and the newspapers are asking how high up it goes.\n\nA §YSpy Affair§! has begun. Its intensity starts at §Y45§!. Every six months a round is resolved: both sides choose a course, and the crisis ends when its intensity falls to zero, reaches the brink at 100, or freezes after §Y3§! rounds."
 COLDWAR_GGR.103.t:0 "A Spy in Bonn"
 COLDWAR_GGR.104.a:0 "Convene the crisis staff."
 COLDWAR_GGR.104.b:0 "Let the ministries handle it for now."
 COLDWAR_GGR.104.desc:0 "Hundreds of East Germans have climbed the fence of the West German embassy and refuse to leave until they can go west. More arrive every hour. The host government wants the problem gone; East Berlin wants them back.\n\nA §YEmbassy Refugees§! has begun. Its intensity starts at §Y50§!. Every six months a round is resolved: both sides choose a course, and the crisis ends when its intensity falls to zero, reaches the brink at 100, or freezes after §Y3§! rounds."
 COLDWAR_GGR.104.t:0 "Refugees in the Embassy"
 COLDWAR_GGR.105.a:0 "Convene the crisis staff."
 COLDWAR_GGR.105.b:0 "Let the ministries handle it for now."
 COLDWAR_GGR.105.desc:0 "A government in the Third World has established diplomatic relations with the GDR. Under the doctrine Bonn has followed since 1955 that is an unfriendly act. If Bonn does nothing, others will follow; if it breaks off relations, it may lose another friend.\n\nA §YRecognition Crisis§! has begun. Its intensity starts at §Y30§!. Every six months a round is resolved: both sides choose a course, and the crisis ends when its intensity falls to zero, reaches the brink at 100, or freezes after §Y3§! rounds."
 COLDWAR_GGR.105.t:0 "A State Recognises the GDR"
 COLDWAR_GGR.106.a:0 "Convene the crisis staff."
 COLDWAR_GGR.106.b:0 "Let the ministries handle it for now."
 COLDWAR_GGR.106.desc:0 "Soviet SS-20 missiles can reach every capital in Western Europe. NATO answers with Pershing II and cruise missiles - to be stationed in the Federal Republic. East Berlin warns of an 'ice age' between the German states; hundreds of thousands march in the Hofgarten.\n\nA §YMissile Crisis§! has begun. Its intensity starts at §Y45§!. Every six months a round is resolved: both sides choose a course, and the crisis ends when its intensity falls to zero, reaches the brink at 100, or freezes after §Y4§! rounds."
 COLDWAR_GGR.106.t:0 "The Missiles of Europe"
 COLDWAR_GGR.107.a:0 "Convene the crisis staff."
 COLDWAR_GGR.107.b:0 "Let the ministries handle it for now."
 COLDWAR_GGR.107.desc:0 "NATO is rehearsing nuclear release procedures. In Moscow and East Berlin the intelligence services report that the exercise may be cover for a real attack. Soviet aircraft are on strip alert in the GDR, the National People's Army has cancelled leave.\n\nA §YManoeuvre Crisis§! has begun. Its intensity starts at §Y55§!. Every six months a round is resolved: both sides choose a course, and the crisis ends when its intensity falls to zero, reaches the brink at 100, or freezes after §Y2§! rounds."
 COLDWAR_GGR.107.t:0 "A Dangerous Exercise"
 COLDWAR_GGR.108.a:0 "Convene the crisis staff."
 COLDWAR_GGR.108.b:0 "Let the ministries handle it for now."
 COLDWAR_GGR.108.desc:0 "East Berlin has stripped a dissident of his citizenship while he was on a concert tour in the West. Writers and artists in the GDR have signed a protest letter. Every Western camera wants an interview; every SED newspaper calls him a traitor.\n\nA §YDissident Crisis§! has begun. Its intensity starts at §Y30§!. Every six months a round is resolved: both sides choose a course, and the crisis ends when its intensity falls to zero, reaches the brink at 100, or freezes after §Y3§! rounds."
 COLDWAR_GGR.108.t:0 "Expelled for His Songs"
 COLDWAR_GGR.109.a:0 "Convene the crisis staff."
 COLDWAR_GGR.109.b:0 "Let the ministries handle it for now."
 COLDWAR_GGR.109.desc:0 "Where exactly does the border run along the Elbe - in the middle of the river, as East Berlin insists, or on its eastern bank, as the Allied protocols of 1944 say? GDR patrol boats have turned back West German fishermen.\n\nA §YElbe Border Dispute§! has begun. Its intensity starts at §Y25§!. Every six months a round is resolved: both sides choose a course, and the crisis ends when its intensity falls to zero, reaches the brink at 100, or freezes after §Y4§! rounds."
 COLDWAR_GGR.109.t:0 "The Elbe Question"
 COLDWAR_GGR.11.a:0 "Give way. Nothing is worth a war."
 COLDWAR_GGR.11.b:0 "Show resolve. Let them blink."
 COLDWAR_GGR.11.c:0 "Ask the superpowers to mediate."
 COLDWAR_GGR.11.desc:0 "The crisis has reached its peak. In East Berlin the Politburo is in permanent session, in Bonn the cabinet meets in the bunker plan of the Ahr valley. One side has to give way - or the next step is no longer politics."
 COLDWAR_GGR.11.t:0 "At the Brink"
 COLDWAR_GGR.110.a:0 "Convene the crisis staff."
 COLDWAR_GGR.110.b:0 "Let the ministries handle it for now."
 COLDWAR_GGR.110.desc:0 "The crushed protests are back - bigger. Factories are on strike, crowds have occupied SED district offices, and in some towns the police have taken off their caps and joined the demonstrators. In the East there are calls for help from the West. In Bonn there are people who want to give it.\n\nA §YUprising in the GDR§! has begun. Its intensity starts at §Y70§!. Every six months a round is resolved: both sides choose a course, and the crisis ends when its intensity falls to zero, reaches the brink at 100, or freezes after §Y3§! rounds."
 COLDWAR_GGR.110.t:0 "The People Rise"
 COLDWAR_GGR.121.a:0 "A wall made of money."
 COLDWAR_GGR.121.desc:0 "Every visitor from the West must now change more Deutschmarks into Ostmarks per day. Fewer pensioners will visit their sisters in Leipzig; more hard currency will flow to East Berlin."
 COLDWAR_GGR.121.t:0 "The Compulsory Exchange Is Raised"
 COLDWAR_GGR.122.a:0 "The world must see this."
 COLDWAR_GGR.122.desc:0 "New fences, new mines, new SM-70 spring guns along the inner-German border. East Berlin calls it the protection of the state border; in the West it is called the death strip."
 COLDWAR_GGR.122.t:0 "The Border Is Tightened"
 COLDWAR_GGR.123.a:0 "Small steps."
 COLDWAR_GGR.123.desc:0 "East Berlin has quietly lowered the compulsory exchange for pensioners and dismantled a stretch of spring guns. Its press says nothing; its diplomats say a great deal."
 COLDWAR_GGR.123.t:0 "A Gesture from East Berlin"
 COLDWAR_GGR.14.a:0 "Do not gloat."
 COLDWAR_GGR.14.desc:0 "In the middle of the night the GDR news agency announced that 'the measures have served their purpose'. The border troops are back in their barracks, the access routes are open. Our nerve has held."
 COLDWAR_GGR.14.t:0 "East Berlin Gives Way"
 COLDWAR_GGR.15.a:0 "Hold our course."
 COLDWAR_GGR.15.a.tt:0 "The countdown continues. Next month: another decision."
 COLDWAR_GGR.15.b:0 "Give way after all."
 COLDWAR_GGR.15.c:0 "Strike first."
 COLDWAR_GGR.15.desc:0 "East Berlin has not given way. The Soviet divisions in the GDR are on alert, NATO's commanders want instructions. Every day we hold our course, the risk grows - and so does the price of giving way.\n\nBundeswehr alert level: §Y[?cwgg_mob_brd|0]§! | NVA alert level: §Y[?cwgg_mob_ddr|0]§! | Moscow's guarantee for the GDR: §Y[?DDR.cwddr_moscow_backing|0]§!"
 COLDWAR_GGR.15.t:0 "Countdown: [?cwgg_countdown|0] Months"
 COLDWAR_GGR.18.a:0 "Send the Bundeswehr."
 COLDWAR_GGR.18.b:0 "Open the border to everyone who flees instead."
 COLDWAR_GGR.18.desc:0 "The rising in the East is being crushed. The insurgents are asking the Federal Republic for help - the same help that Hungary in 1956 hoped for in vain. The Bundeswehr could be at the Elbe in two days. The question is who else would be."
 COLDWAR_GGR.18.t:0 "Brotherly Help?"
 COLDWAR_GGR.19.a:0 "Sign."
 COLDWAR_GGR.19.b:0 "Tear it up."
 COLDWAR_GGR.19.b.tt:0 "The countdown continues."
 COLDWAR_GGR.19.desc:0 "The Inspector General is waiting for a signature. Once it is given, the Bundeswehr crosses the inner-German border at dawn. Whether NATO follows depends on how much Washington still trusts us; whether the Soviet Union fights depends on how much it still needs the GDR."
 COLDWAR_GGR.19.t:0 "The Order"
 COLDWAR_GGR.20.a:0 "Pay. Quiet is worth it."
 COLDWAR_GGR.20.b:0 "We do not pay for good behaviour."
 COLDWAR_GGR.20.desc:0 "Through the channel the other side has made an offer: the crisis ends quietly - for money. A credit, a transit payment, a few hundred million for 'humanitarian matters'."
 COLDWAR_GGR.20.t:0 "East Berlin Names a Price"
 COLDWAR_GGR.200.a:0 "Back down. The matter is not worth it."
 COLDWAR_GGR.200.a.tt:0 "We give way this round. Intensity falls - and Bonn will say it won."
 COLDWAR_GGR.200.b:0 "Stall. Time is on our side."
 COLDWAR_GGR.200.b.tt:0 "Neither yield nor push. If we choose nothing, this is what happens."
 COLDWAR_GGR.200.c:0 "Escalate. Bonn must learn what pressure means."
 COLDWAR_GGR.200.c.tt:0 "Costs §Y1§! initiative. Raises intensity, more so against a soft Bonn; blunted by a Bundeswehr on alert."
 COLDWAR_GGR.200.d:0 "Call on Moscow."
 COLDWAR_GGR.200.d.tt:0 "Costs §Y1§! initiative. The stronger Moscow's guarantee, the harder it hits. If Bonn calls the Allies at the same time, the superpowers take over."
 COLDWAR_GGR.200.desc:0 "The Politburo meets in the Central Committee building on Werderscher Markt. The next round of the crisis with Bonn is decided in six months; until then we hold the course we set now.\n\n§Y[RV_DDR_Crisis]§! | intensity §Y[?GER.cwgg_krise_int|0]§! | round §Y[?GER.cwgg_krise_runde|0]§! of §Y[?GER.cwgg_krise_max|0]§!\nBonn's course in the last round: §Y[RV_DDR_BonnLast]§! | our initiative §Y[?GER.cwgg_init_ddr|0]§!\nBundeswehr alert §Y[?GER.cwgg_mob_brd|0]§! | NVA alert §Y[?GER.cwgg_mob_ddr|0]§! | Moscow's guarantee §Y[?cwddr_moscow_backing|0]§!"
 COLDWAR_GGR.200.e:0 "Name a price."
 COLDWAR_GGR.200.e.tt:0 "Costs §Y1§! initiative. If Bonn is talking, it may pay for quiet."
 COLDWAR_GGR.200.t:0 "Our Course in the Crisis"
 COLDWAR_GGR.201.a:0 "Noted."
 COLDWAR_GGR.201.desc1:0 "We have given way. Neues Deutschland speaks of 'provocations repelled'; in the Politburo nobody believes it, and the hard-liners are counting the cost."
 COLDWAR_GGR.201.desc2:0 "Bonn has given way. The Republic has defended its sovereignty, and the world has seen that the Federal Republic can be made to move."
 COLDWAR_GGR.201.desc3:0 "The crisis has frozen. Nobody gave way, nobody won - and the issue may flare up again."
 COLDWAR_GGR.201.desc4:0 "The Soviet ambassador came at night. By morning the crisis was over: Moscow has decided for us."
 COLDWAR_GGR.201.desc5:0 "A compromise. Both sides have moved, both governments call it a success, and the communiqué is long enough for everyone to find a sentence they like."
 COLDWAR_GGR.201.t:0 "The Crisis with Bonn Is Over"
 COLDWAR_GGR.21.a:0 "Call Moscow on the hotline."
 COLDWAR_GGR.21.b:0 "Stand down our own forces and hope they see it."
 COLDWAR_GGR.21.desc:0 "03:12. The early-warning radars of the Warsaw Pact report missiles in the air. The National People's Army has gone to combat readiness; in the GDR's air defence bunkers the officers are waiting for orders. Our own screens show nothing. In twenty minutes the question will answer itself."
 COLDWAR_GGR.21.t:0 "Launch Warning"
 COLDWAR_GGR.210.a:0 "Hold firm."
 COLDWAR_GGR.210.a.tt:0 "The countdown continues."
 COLDWAR_GGR.210.b:0 "Give way. The Republic will survive this."
 COLDWAR_GGR.210.desc:0 "Bonn will not give way. The Soviet divisions are on alert, the National People's Army waits for orders and the border troops have been told to expect anything. Every month we hold, the risk grows - and so does the price of giving way.\n\nWhen the countdown runs out and nobody has blinked, we decide between restraint and war.\n\n§Y[RV_DDR_Crisis]§! | intensity §Y[?GER.cwgg_krise_int|0]§! | round §Y[?GER.cwgg_krise_runde|0]§! of §Y[?GER.cwgg_krise_max|0]§!\nBonn's course in the last round: §Y[RV_DDR_BonnLast]§! | our initiative §Y[?GER.cwgg_init_ddr|0]§!\nBundeswehr alert §Y[?GER.cwgg_mob_brd|0]§! | NVA alert §Y[?GER.cwgg_mob_ddr|0]§! | Moscow's guarantee §Y[?cwddr_moscow_backing|0]§!"
 COLDWAR_GGR.210.t:0 "Countdown: [?GER.cwgg_countdown|0] Months"
 COLDWAR_GGR.211.a:0 "Accept Moscow's restraint."
 COLDWAR_GGR.211.a.tt:0 "The crisis ends. Bonn has won - but the decision was taken in the Kremlin."
 COLDWAR_GGR.211.b:0 "Order the attack on West Berlin."
 COLDWAR_GGR.211.b.tt:0 "§RWar with the Federal Republic begins.§! Needs Moscow's guarantee of at least §Y60§!, the NVA on alert level 2 and troops massed at the border."
 COLDWAR_GGR.211.desc:0 "Nobody has given way. Moscow's ambassador waits in the antechamber with a message from the Kremlin: the Soviet Union wants the crisis ended. Our generals have a different plan - West Berlin, in seventy-two hours.\n\n§Y[RV_DDR_Crisis]§! | intensity §Y[?GER.cwgg_krise_int|0]§! | round §Y[?GER.cwgg_krise_runde|0]§! of §Y[?GER.cwgg_krise_max|0]§!\nBonn's course in the last round: §Y[RV_DDR_BonnLast]§! | our initiative §Y[?GER.cwgg_init_ddr|0]§!\nBundeswehr alert §Y[?GER.cwgg_mob_brd|0]§! | NVA alert §Y[?GER.cwgg_mob_ddr|0]§! | Moscow's guarantee §Y[?cwddr_moscow_backing|0]§!"
 COLDWAR_GGR.211.t:0 "The Countdown Has Run Out"
 COLDWAR_GGR.212.a:0 "Rein in East Berlin."
 COLDWAR_GGR.212.a.tt:0 "The crisis ends. Bonn has its way - but everyone knows the decision was taken in the Kremlin."
 COLDWAR_GGR.212.b:0 "Let them move on West Berlin."
 COLDWAR_GGR.212.b.tt:0 "§RThe GDR attacks the Federal Republic, and the Soviet Union stands with it.§! Needs the NVA on alert level 2 and troops massed at the border."
 COLDWAR_GGR.212.desc:0 "The countdown between Bonn and East Berlin has run out and neither side has blinked. Honecker's government asks the Kremlin for a decision: hold the GDR back - or let the National People's Army and the Group of Soviet Forces in Germany move on West Berlin.\n\nMoscow's guarantee for the GDR: §Y[?DDR.cwddr_moscow_backing|0]§! | NVA alert level §Y[?GER.cwgg_mob_ddr|0]§! | Bundeswehr alert level §Y[?GER.cwgg_mob_brd|0]§!"
 COLDWAR_GGR.212.t:0 "Brinkmanship in Germany"
 COLDWAR_GGR.230.a:0 "For the socialist fatherland."
 COLDWAR_GGR.230.desc1:0 "The Bundeswehr has crossed the state border. The National People's Army is fighting on the Werra and the Elbe. Whether Moscow stands with us is decided in Moscow."
 COLDWAR_GGR.230.desc2:0 "Our divisions are moving on West Berlin. There is no way back now."
 COLDWAR_GGR.230.desc3:0 "A false alarm has become a real war. Nobody in East Berlin wanted it; the National People's Army is now fighting it."
 COLDWAR_GGR.230.t:0 "War with the Federal Republic"
 COLDWAR_GGR.240.a:0 "Watch them closely."
 COLDWAR_GGR.240.b:0 "Open the situation map."
 COLDWAR_GGR.240.desc1:0 "BND and the border police report a concentration of troops of the National People's Army along the inner-German border. Escalation pressure and Cold War world tension rise every month the troops stay."
 COLDWAR_GGR.240.desc2:0 "BND and the border police report a deployment in force of the National People's Army along the inner-German border. Escalation pressure and Cold War world tension rise every month the troops stay. The ladder will not fall below §RCrisis§! while they are there."
 COLDWAR_GGR.240.desc3:0 "BND and the border police report a massive deployment of the National People's Army along the inner-German border. Escalation pressure and Cold War world tension rise every month the troops stay. The ladder will not fall below §RCrisis§! while they are there."
 COLDWAR_GGR.240.t:0 "Troops on the Other Side of the Border"
 COLDWAR_GGR.241.a:0 "The Republic will not be intimidated."
 COLDWAR_GGR.241.desc1:0 "Our border troops report a concentration of troops of the Bundeswehr and NATO along the state border. Escalation pressure and Cold War world tension rise every month the troops stay."
 COLDWAR_GGR.241.desc2:0 "Our border troops report a deployment in force of the Bundeswehr and NATO along the state border. Escalation pressure and Cold War world tension rise every month the troops stay. The ladder will not fall below §RCrisis§! while they are there."
 COLDWAR_GGR.241.desc3:0 "Our border troops report a massive deployment of the Bundeswehr and NATO along the state border. Escalation pressure and Cold War world tension rise every month the troops stay. The ladder will not fall below §RCrisis§! while they are there."
 COLDWAR_GGR.241.t:0 "The Bundeswehr at the Border"
 COLDWAR_GGR.3.a:0 "Open the situation map."
 COLDWAR_GGR.3.b:0 "Noted."
 COLDWAR_GGR.3.desc1:0 "[RV_RoundReport]\n\nCrisis intensity: §Y[?cwgg_krise_int|0]§! after §Y[?cwgg_krise_runde|0]§! of §Y[?cwgg_krise_max|0]§! rounds.\n\nChoose a course for the next round in the §YInner-German Relations§! window; it is resolved in six months. Without a choice, Bonn waits and sees."
 COLDWAR_GGR.3.t:0 "Crisis Report: Round [?cwgg_krise_runde|0]"
 COLDWAR_GGR.30.a:0 "Defend the free part of Germany."
 COLDWAR_GGR.30.desc1:0 "We have attacked. The Bundestag and Bundesrat have declared the state of defence under Article 115a of the Basic Law - a constitution written for a defensive war now carries an offensive one. Command of the armed forces passes to the Chancellor."
 COLDWAR_GGR.30.desc2:0 "The National People's Army has crossed the border. West Berlin is under fire. The Bundestag and Bundesrat have declared the state of defence under Article 115a of the Basic Law; command of the armed forces passes to the Chancellor."
 COLDWAR_GGR.30.desc3:0 "The Bundeswehr is crossing the Elbe to help the rising in the East. The Bundestag has declared the state of defence; command passes to the Chancellor. Whether the Soviet Union will stand aside is the only question that matters now."
 COLDWAR_GGR.30.desc4:0 "A false alarm became a real war. Nobody in Bonn or East Berlin wanted it; both armies are now fighting it. The Bundestag has declared the state of defence under Article 115a."
 COLDWAR_GGR.30.t:0 "The State of Defence"
 COLDWAR_GGR.31.a:0 "Offer a ceasefire."
 COLDWAR_GGR.31.b:0 "Fight on."
 COLDWAR_GGR.31.desc:0 "Six weeks of war in the middle of Europe. NATO's planners are asking whether conventional defence can hold, and the word nobody wants to say is on every desk. There is still a way back: a ceasefire on the present lines."
 COLDWAR_GGR.31.t:0 "The Threshold"
 COLDWAR_GGR.40.a:0 "Now we must win the peace."
 COLDWAR_GGR.40.desc:0 "The GDR has fallen. The Bundeswehr stands on the Oder, the SED leadership has fled or been arrested, and in the East the flags of the Federal Republic hang next to white sheets. Germany is united - by force of arms, against the will of half of Europe and with a debt to the East that will take a generation to pay."
 COLDWAR_GGR.40.t:0 "Germany Under One Government"
 COLDWAR_GGR.41.a:0 "Accept the terms."
 COLDWAR_GGR.41.desc:0 "The front has broken. West Berlin is lost, and in Moscow the terms are being written: a neutral Federal Republic, outside NATO, with an army the Warsaw Pact can count."
 COLDWAR_GGR.41.t:0 "Defeat"
 COLDWAR_GGR.42.a:0 "Never again."
 COLDWAR_GGR.42.desc:0 "The guns along the inner-German border have fallen silent. Nothing has been won; the dead are counted on both sides. The two German states remain - and hate each other more than at any time since 1961."
 COLDWAR_GGR.42.t:0 "An Armistice"
 COLDWAR_GGR.5.a:0 "Open the situation map."
 COLDWAR_GGR.5.b:0 "Noted."
 COLDWAR_GGR.5.desc1:0 "Relations with the GDR have reached the stage of §RConfrontation§!. Trade is halved, the armies watch each other along the border and every incident could turn into a crisis that neither side controls."
 COLDWAR_GGR.5.desc2:0 "§RWar danger.§! Both German armies are on alert, the superpowers are on the telephone and the newspapers are printing maps of the Fulda Gap. Every decision in the next weeks can decide between peace and war."
 COLDWAR_GGR.5.t:0 "The Inner-German Relationship Escalates"
 COLDWAR_GGR.50.a:0 "Sign it."
 COLDWAR_GGR.50.b:0 "Not yet - renegotiate the details."
 COLDWAR_GGR.50.desc1:0 "§YMeeting of the Heads of Government§!\n\nWilly Brandt and Willi Stoph met in Erfurt in March 1970 and in Kassel in May. Nothing was agreed - but for the first time the two German governments talked to each other.\n\nThe negotiators have finished their work. The treaty is ready for signature."
 COLDWAR_GGR.50.desc2:0 "§YBerlin Settlement§!\n\nThe Quadripartite Agreement of September 1971 and the transit agreement that followed: unhindered traffic between the Federal Republic and West Berlin, guaranteed by the Four Powers.\n\nThe negotiators have finished their work. The treaty is ready for signature."
 COLDWAR_GGR.50.desc3:0 "§YBasic Treaty§!\n\nThe Grundlagenvertrag of December 1972: two German states, equal rights, good-neighbourly relations - and Bonn's letter on German unity, so that nothing is given up for ever.\n\nThe negotiators have finished their work. The treaty is ready for signature."
 COLDWAR_GGR.50.desc4:0 "§YBoth States in the United Nations§!\n\nIn September 1973 the United Nations admitted the Federal Republic and the GDR on the same day.\n\nThe negotiators have finished their work. The treaty is ready for signature."
 COLDWAR_GGR.50.desc5:0 "§YPermanent Representations§!\n\nMissions, not embassies: Günter Gaus moved into Hannoversche Straße in East Berlin in 1974, Michael Kohl into Godesberger Allee in Bonn.\n\nThe negotiators have finished their work. The treaty is ready for signature."
 COLDWAR_GGR.50.desc6:0 "§YTraffic, Post and Travel Agreements§!\n\nTelephone lines, new autobahn crossings, visits for pensioners and urgent family matters: the small steps of the 1970s and 1980s.\n\nThe negotiators have finished their work. The treaty is ready for signature."
 COLDWAR_GGR.50.desc7:0 "§YCultural Agreement and Town Twinning§!\n\nAfter thirteen years of talks the cultural agreement was signed in May 1986; Saarlouis and Eisenhüttenstadt became the first twinned towns.\n\nThe negotiators have finished their work. The treaty is ready for signature."
 COLDWAR_GGR.50.desc8:0 "§YState Visit of the SED Leader§!\n\nIn September 1987 Erich Honecker was received in Bonn with flags and anthems - and spoke of a border that would one day 'unite rather than divide'.\n\nThe negotiators have finished their work. The treaty is ready for signature."
 COLDWAR_GGR.50.desc9:0 "§YTreaty Community and Confederation§!\n\nA treaty community between the two German states, with joint commissions, a common market and, one day, confederal institutions.\n\nThe negotiators have finished their work. The treaty is ready for signature."
 COLDWAR_GGR.50.t:0 "A Treaty Is Ready"
 COLDWAR_GGR.51.a:0 "We will try again with a new majority."
 COLDWAR_GGR.51.desc:0 "The government no longer has a majority for the treaty. The opposition calls it a sell-out of German unity, and enough deputies of the coalition agree. The treaty stays unsigned."
 COLDWAR_GGR.51.t:0 "Ratification Fails"
 COLDWAR_GGR.60.a:0 "Grant it - for humanitarian concessions."
 COLDWAR_GGR.60.b:0 "Let them stew."
 COLDWAR_GGR.60.desc:0 "Through the Schalck-Golodkowski channel East Berlin lets it be known that the GDR's hard-currency position is 'tight'. A credit would be received with gratitude - and with gestures in return."
 COLDWAR_GGR.60.t:0 "East Berlin Needs Money"
 COLDWAR_GGR.70.a:0 "Make it public."
 COLDWAR_GGR.70.b:0 "Use it quietly."
 COLDWAR_GGR.70.desc:0 "The arrests of the HVA network have brought out something nobody expected: since 1980 the Stasi has given new identities to members of the Red Army Faction who wanted to leave the underground - and has trained others. East Berlin denies everything."
 COLDWAR_GGR.70.t:0 "RAF Fugitives in the GDR"
 COLDWAR_GGU.1.a:0 "We will negotiate - on equal terms."
 COLDWAR_GGU.1.b:0 "The GDR is a sovereign socialist state. No."
 COLDWAR_GGU.1.desc:0 "The Federal Chancellor has proposed formal negotiations on the unity of Germany - not as an annexation, Bonn insists, but as a treaty between equals. Five chapters would be on the table: the constitution, the economic order, the alliance, the capital and the borders. Every one of the Four Powers would have to agree."
 COLDWAR_GGU.1.t:0 "Bonn Proposes Unity Talks"
 COLDWAR_GGU.2.a:0 "We accept."
 COLDWAR_GGU.2.b:0 "Not under these conditions."
 COLDWAR_GGU.2.desc:0 "The GDR's government has proposed formal negotiations on the unity of Germany. Some in Bonn call it a trap, some the chance of a century. If we accept, every chapter - the constitution, the economy, the alliance, the capital, the borders - is open."
 COLDWAR_GGU.2.t:0 "East Berlin Proposes Unity Talks"
 COLDWAR_GGU.20.a:0 "Next chapter."
 COLDWAR_GGU.20.desc1:0 "Chapter: §Y[U_LastChapter]§!. We proposed §Y[U_LastPos]§!, East Berlin §Y[U_LastDPos]§!. $COLDWAR_GER_1970_u_rr_ok$\n\nAgreed so far: §Y[?cwgg_u_agreed|0]§! of five chapters. Failed rounds: §Y[?cwgg_u_fail|0]§!/8."
 COLDWAR_GGU.20.desc2:0 "Chapter: §Y[U_LastChapter]§!. We proposed §Y[U_LastPos]§!, East Berlin §Y[U_LastDPos]§!. $COLDWAR_GER_1970_u_rr_fail$\n\nFailed rounds: §Y[?cwgg_u_fail|0]§!/8. A delegation that has failed on a chapter often enough tends to soften its line - but nothing obliges it to."
 COLDWAR_GGU.20.t:0 "A Round of Unity Talks"
 COLDWAR_GGU.21.a:0 "Next chapter."
 COLDWAR_GGU.21.desc1:0 "Chapter: §Y[U_LastChapterG]§!. Bonn proposed §Y[U_LastPosG]§!, we §Y[U_LastDPosG]§!. $COLDWAR_GER_1970_u_rr_ok$"
 COLDWAR_GGU.21.desc2:0 "Chapter: §Y[U_LastChapterG]§!. Bonn proposed §Y[U_LastPosG]§!, we §Y[U_LastDPosG]§!. $COLDWAR_GER_1970_u_rr_fail$\n\nFailed rounds: §Y[?GER.cwgg_u_fail|0]§!/8."
 COLDWAR_GGU.21.t:0 "A Round of Unity Talks"
 COLDWAR_GGU.3.a:0 "Then we keep building trust."
 COLDWAR_GGU.3.desc:0 "The GDR has rejected unity talks. 'Socialism and imperialism cannot be united, any more than fire and water,' says the Politburo's statement. For two years the subject is closed."
 COLDWAR_GGU.3.t:0 "East Berlin Says No"
 COLDWAR_GGU.31.a:0 "The Basic Law (Article 23)"
 COLDWAR_GGU.31.b:0 "A New Constitution (Article 146)"
 COLDWAR_GGU.31.c:0 "A Socialist Constitution"
 COLDWAR_GGU.31.d:0 "We refuse to discuss this chapter now."
 COLDWAR_GGU.31.desc:0 "Under which constitution do the Germans live together? The round is decided in three months. Bonn's delegation will state its own position; if both are the same, the chapter is agreed.\n\n§YThe Basic Law (Article 23)§!: The GDR's Länder accede to the Federal Republic. The Basic Law applies everywhere.\n§YA New Constitution (Article 146)§!: A constituent assembly from both states writes a new constitution for all Germans.\n§YA Socialist Constitution§!: The united Germany is built on the GDR's constitution: a people's republic with a leading party."
 COLDWAR_GGU.31.t:0 "Unity Talks: The Constitution"
 COLDWAR_GGU.32.a:0 "Social Market Economy"
 COLDWAR_GGU.32.b:0 "A Mixed Economy"
 COLDWAR_GGU.32.c:0 "Planned Economy"
 COLDWAR_GGU.32.d:0 "We refuse to discuss this chapter now."
 COLDWAR_GGU.32.desc:0 "Which economic order does the united state have? The round is decided in three months. Bonn's delegation will state its own position; if both are the same, the chapter is agreed.\n\n§YSocial Market Economy§!: The Deutschmark, private property and free prices - the GDR's combines are privatised.\n§YA Mixed Economy§!: Key industries, banks and land stay public; the rest is market. A 'third way' between the systems.\n§YPlanned Economy§!: Central planning, people's enterprises, prices set by the state - the Federal Republic's industry is nationalised."
 COLDWAR_GGU.32.t:0 "Unity Talks: The Economy"
 COLDWAR_GGU.33.a:0 "In NATO"
 COLDWAR_GGU.33.b:0 "Armed Neutrality"
 COLDWAR_GGU.33.c:0 "In the Warsaw Pact"
 COLDWAR_GGU.33.d:0 "We refuse to discuss this chapter now."
 COLDWAR_GGU.33.desc:0 "In which alliance - if any - does the united Germany stand? The round is decided in three months. Bonn's delegation will state its own position; if both are the same, the chapter is agreed.\n\n§YIn NATO§!: The united Germany stays in NATO; Soviet troops leave the East.\n§YArmed Neutrality§!: Germany leaves both blocs: an army of its own, no foreign troops, guaranteed by the Four Powers.\n§YIn the Warsaw Pact§!: The united Germany joins the Warsaw Treaty Organisation; American troops leave the West."
 COLDWAR_GGU.33.t:0 "Unity Talks: The Alliance"
 COLDWAR_GGU.34.a:0 "Bonn, Federal"
 COLDWAR_GGU.34.b:0 "Berlin, Federal"
 COLDWAR_GGU.34.c:0 "Berlin, Centralised"
 COLDWAR_GGU.34.d:0 "We refuse to discuss this chapter now."
 COLDWAR_GGU.34.desc:0 "Where does the united Germany govern from - and how centralised is it? The round is decided in three months. Bonn's delegation will state its own position; if both are the same, the chapter is agreed.\n\n§YBonn, Federal§!: Government and parliament stay on the Rhine; the GDR is divided into Länder again.\n§YBerlin, Federal§!: Berlin becomes the capital of a federal Germany; the eastern Länder are restored.\n§YBerlin, Centralised§!: Berlin governs a centralised state; the Länder become administrative districts."
 COLDWAR_GGU.34.t:0 "Unity Talks: The Capital"
 COLDWAR_GGU.35.a:0 "Reserve the Peace Treaty"
 COLDWAR_GGU.35.b:0 "The Oder-Neisse Line, Final"
 COLDWAR_GGU.35.c:0 "Border and Peace Treaty"
 COLDWAR_GGU.35.d:0 "We refuse to discuss this chapter now."
 COLDWAR_GGU.35.desc:0 "What becomes of the Oder-Neisse line and of a peace treaty for Germany? The round is decided in three months. Bonn's delegation will state its own position; if both are the same, the chapter is agreed.\n\n§YReserve the Peace Treaty§!: The border question stays open until a peace treaty - as the Federal Constitutional Court demands.\n§YThe Oder-Neisse Line, Final§!: The united Germany recognises its eastern border for ever in a treaty with Poland.\n§YBorder and Peace Treaty§!: A formal peace treaty with the Four Powers and recognition of every post-war border."
 COLDWAR_GGU.35.t:0 "Unity Talks: The Borders"
 COLDWAR_GGU.4.a:0 "To work."
 COLDWAR_GGU.4.desc:0 "Delegations from Bonn and East Berlin meet at a long table. First on the agenda: the constitution. One chapter is negotiated every three months; set our position in the §YUnity§! tab of the inner-German relations window."
 COLDWAR_GGU.4.t:0 "The Unity Talks Begin"
 COLDWAR_GGU.41.a:0 "We consent."
 COLDWAR_GGU.41.b:0 "Veto: a united Germany cannot stay in NATO."
 COLDWAR_GGU.41.c:0 "Veto: we will not hand the GDR to capitalism."
 COLDWAR_GGU.41.d:0 "Veto outright: two German states, now and for ever."
 COLDWAR_GGU.41.desc:0 "Bonn and East Berlin have initialled a treaty on German unity. As one of the Four Powers responsible for Germany as a whole, the Soviet Union must agree - or say what it demands.\n\nThe treaty: constitution §Y[U_ChG1]§!, economy §Y[U_ChG2]§!, alliance §Y[U_ChG3]§!, capital §Y[U_ChG4]§!, borders §Y[U_ChG5]§!."
 COLDWAR_GGU.41.t:0 "The Germans Want to Unite"
 COLDWAR_GGU.42.a:0 "We consent."
 COLDWAR_GGU.42.b:0 "Veto: Germany must stay in the Western alliance."
 COLDWAR_GGU.42.c:0 "Veto: no socialist Germany."
 COLDWAR_GGU.42.d:0 "Veto outright: we prefer two Germanies."
 COLDWAR_GGU.42.desc:0 "Bonn and East Berlin have initialled a treaty on German unity. As one of the Four Powers that still hold rights for Germany as a whole and Berlin, the United States must agree - or say what it demands.\n\nThe treaty: constitution §Y[U_ChG1]§!, economy §Y[U_ChG2]§!, alliance §Y[U_ChG3]§!, capital §Y[U_ChG4]§!, borders §Y[U_ChG5]§!."
 COLDWAR_GGU.42.t:0 "The Germans Want to Unite"
 COLDWAR_GGU.43.a:0 "We consent."
 COLDWAR_GGU.43.b:0 "Veto: Germany must stay in the Western alliance."
 COLDWAR_GGU.43.c:0 "Veto: the border must be settled for good first."
 COLDWAR_GGU.43.d:0 "Veto outright: we prefer two Germanies."
 COLDWAR_GGU.43.desc:0 "Bonn and East Berlin have initialled a treaty on German unity. As one of the Four Powers that still hold rights for Germany as a whole and Berlin, the United Kingdom must agree - or say what it demands.\n\nThe treaty: constitution §Y[U_ChG1]§!, economy §Y[U_ChG2]§!, alliance §Y[U_ChG3]§!, capital §Y[U_ChG4]§!, borders §Y[U_ChG5]§!."
 COLDWAR_GGU.43.t:0 "The Germans Want to Unite"
 COLDWAR_GGU.44.a:0 "We consent."
 COLDWAR_GGU.44.b:0 "Veto: Germany must stay in the Western alliance."
 COLDWAR_GGU.44.c:0 "Veto: the border must be settled for good first."
 COLDWAR_GGU.44.d:0 "Veto outright: we prefer two Germanies."
 COLDWAR_GGU.44.desc:0 "Bonn and East Berlin have initialled a treaty on German unity. As one of the Four Powers that still hold rights for Germany as a whole and Berlin, France must agree - or say what it demands.\n\nThe treaty: constitution §Y[U_ChG1]§!, economy §Y[U_ChG2]§!, alliance §Y[U_ChG3]§!, capital §Y[U_ChG4]§!, borders §Y[U_ChG5]§!."
 COLDWAR_GGU.44.t:0 "The Germans Want to Unite"
 COLDWAR_GGU.45.a:0 "Back to the table."
 COLDWAR_GGU.45.desc:0 "One of the Four Powers has vetoed the treaty and named its price. The chapter it objects to is open again - the delegations must go back to the table. A third veto would end the talks."
 COLDWAR_GGU.45.t:0 "The Powers Demand Changes"
 COLDWAR_GGU.50.a:0 "The Bundestag ratifies."
 COLDWAR_GGU.50.b:0 "Pay the opposition's price for its votes."
 COLDWAR_GGU.50.c:0 "Let the people decide: a referendum on unity."
 COLDWAR_GGU.50.d:0 "The Bundestag rejects the treaty."
 COLDWAR_GGU.50.desc:0 "The Four Powers have agreed. Now the Bundestag must ratify the treaty - with a simple majority, or with two thirds if Germany is to receive a new constitution."
 COLDWAR_GGU.50.t:0 "The Bundestag and the Unity Treaty"
 COLDWAR_GGU.51.a:0 "The People's Chamber ratifies."
 COLDWAR_GGU.51.b:0 "The People's Chamber rejects it."
 COLDWAR_GGU.51.desc:0 "The Four Powers have agreed. The People's Chamber must now ratify the treaty that ends the German Democratic Republic as a separate state."
 COLDWAR_GGU.51.t:0 "The Volkskammer and the Unity Treaty"
 COLDWAR_GGU.60.a:0 "History has not finished with us."
 COLDWAR_GGU.60.desc:0 "The negotiations on German unity have ended without a treaty. Both governments blame each other; the climate between the two states suffers. The subject is closed for at least three years."
 COLDWAR_GGU.60.t:0 "The Unity Talks Have Failed"
 COLDWAR_GGW.1.a:0 "Let the families come - and pay for the schools."
 COLDWAR_GGW.1.b:0 "Age limits and waiting periods."
 COLDWAR_GGW.1.desc:0 "The Bundesrat has asked for a decision. The cities want money for schools, language courses and housing; the interior ministers of the Union-led Länder want age limits for children who may join their parents. Employers point out that a worker with his family at home works better than one who is homesick."
 COLDWAR_GGW.1.t:0 "Family Reunification"
 COLDWAR_GGW.2.a:0 "The refugees only. The factories need the workers."
 COLDWAR_GGW.2.b:0 "The guest workers go as well."
 COLDWAR_GGW.2.desc:0 "The refugee camps are being emptied. Now the Directorate's hardliners present the next list: four million foreigners, most of them guest workers and their families, who have lived here for years. Industry warns that the assembly lines in Wolfsburg and Cologne will stop. The ambassadors of Turkey, Yugoslavia and Greece have asked for an appointment."
 COLDWAR_GGW.2.t:0 "The Guest Workers"
 COLDWAR_GSEC.1.a:0 "ok"
 COLDWAR_GSEC.10.a:0 "The protection details have earned their pay."
 COLDWAR_GSEC.10.desc1:0 "A commando was waiting outside the home of a senior judge. The protection detail noticed the parked van an hour too early for the attackers; the suspects fled, leaving weapons and a target file behind."
 COLDWAR_GSEC.10.desc2:0 "The car of a bank chairman took a different route this morning. Where it would have passed, the police found a bomb wired to a light barrier."
 COLDWAR_GSEC.10.desc3:0 "Military police at a US Army depot stopped a car with forged papers. In the boot: explosives and the plan of the officers' mess."
 COLDWAR_GSEC.10.desc4:0 "A minister's convoy was ready for the ambush its escorts had trained for. Shots were exchanged; the commando escaped, but the minister is unhurt."
 COLDWAR_GSEC.10.desc5:0 "Guards at the building site of a new prison surprised a group carrying explosives over the fence at night."
 COLDWAR_GSEC.10.desc6:0 "The embassy in a neighbouring capital had been warned by the BKA. When armed men tried to enter, the doors were locked and the local police waiting."
 COLDWAR_GSEC.10.t:0 "Attack Foiled"
 COLDWAR_GSEC.11.a:0 "One fewer."
 COLDWAR_GSEC.11.desc:0 "Special commandos have arrested §Y[SEC_LastName]§!, one of the most wanted members of the Red Army Faction. Weapons, forged papers and a list of possible targets were found in the flat."
 COLDWAR_GSEC.11.t:0 "Arrested"
 COLDWAR_GSEC.12.a:0 "Defend the officers."
 COLDWAR_GSEC.12.b:0 "Order an inquiry."
 COLDWAR_GSEC.12.desc:0 "The flat was empty, or the shooting started too early. The suspect has escaped - and a raid that went wrong is on every front page. Whose fault was it?"
 COLDWAR_GSEC.12.t:0 "The Trap Closes on Nothing"
 COLDWAR_GSEC.13.a:0 "The state could not prevent it."
 COLDWAR_GSEC.13.desc:0 "A prisoner has died after weeks without food. Thousands march in Berlin, Frankfurt and Hamburg; on the walls of the universities new slogans appear overnight. The movement has a martyr."
 COLDWAR_GSEC.13.t:0 "A Hunger Striker Dies"
 COLDWAR_GSEC.14.a:0 "Order a full inquiry."
 COLDWAR_GSEC.14.b:0 "The officers acted in self-defence."
 COLDWAR_GSEC.14.desc:0 "The commando opened fire the moment the door gave way. When the smoke cleared, a police officer lay dead on the landing - and the suspect was either dead too or gone over the rooftops. By the evening there are two versions of what happened, and the sympathisers believe only one."
 COLDWAR_GSEC.14.t:0 "Shots in the Stairwell"
