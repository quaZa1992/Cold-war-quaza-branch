 cwgg_rv_tr_1_line:0 "[RV_Treaty_1]"
 cwgg_rv_tr_1_name:0 "1. Meeting of the Heads of Government"
 cwgg_rv_tr_1_tt:0 "§YMeeting of the Heads of Government§!\nWilly Brandt and Willi Stoph met in Erfurt in March 1970 and in Kassel in May. Nothing was agreed - but for the first time the two German governments talked to each other.\n\nRequires: climate at least §Y-10§!; Needs the focus §YChange through Rapprochement§!; no crisis at stage 3 or worse; 2 initiative and 25 political power to open talks.\n\nNegotiations advance every month with the climate, the Bahr - Kohl channel, the Permanent Representation and the hard-currency lever; a crisis halts them, a confrontation breaks them off."
 cwgg_rv_tr_2_line:0 "[RV_Treaty_2]"
 cwgg_rv_tr_2_name:0 "2. Berlin Settlement"
 cwgg_rv_tr_2_tt:0 "§YBerlin Settlement§!\nThe Quadripartite Agreement of September 1971 and the transit agreement that followed: unhindered traffic between the Federal Republic and West Berlin, guaranteed by the Four Powers.\n\nRequires: climate at least §Y-5§!; in force: Meeting of the Heads of Government; no crisis at stage 3 or worse; 2 initiative and 25 political power to open talks.\n\nNegotiations advance every month with the climate, the Bahr - Kohl channel, the Permanent Representation and the hard-currency lever; a crisis halts them, a confrontation breaks them off."
 cwgg_rv_tr_3_line:0 "[RV_Treaty_3]"
 cwgg_rv_tr_3_name:0 "3. Basic Treaty"
 cwgg_rv_tr_3_tt:0 "§YBasic Treaty§!\nThe Grundlagenvertrag of December 1972: two German states, equal rights, good-neighbourly relations - and Bonn's letter on German unity, so that nothing is given up for ever.\n\nRequires: climate at least §Y0§!; in force: Meeting of the Heads of Government, Berlin Settlement; Needs the focus §YThe Basic Treaty§!; a majority in the Bundestag to ratify; no crisis at stage 3 or worse; 2 initiative and 25 political power to open talks.\n\nNegotiations advance every month with the climate, the Bahr - Kohl channel, the Permanent Representation and the hard-currency lever; a crisis halts them, a confrontation breaks them off."
 cwgg_rv_tr_4_line:0 "[RV_Treaty_4]"
 cwgg_rv_tr_4_name:0 "4. Both States in the United Nations"
 cwgg_rv_tr_4_tt:0 "§YBoth States in the United Nations§!\nIn September 1973 the United Nations admitted the Federal Republic and the GDR on the same day.\n\nRequires: climate at least §Y0§!; in force: Basic Treaty; no crisis at stage 3 or worse; 2 initiative and 25 political power to open talks.\n\nNegotiations advance every month with the climate, the Bahr - Kohl channel, the Permanent Representation and the hard-currency lever; a crisis halts them, a confrontation breaks them off."
 cwgg_rv_tr_5_line:0 "[RV_Treaty_5]"
 cwgg_rv_tr_5_name:0 "5. Permanent Representations"
 cwgg_rv_tr_5_tt:0 "§YPermanent Representations§!\nMissions, not embassies: Günter Gaus moved into Hannoversche Straße in East Berlin in 1974, Michael Kohl into Godesberger Allee in Bonn.\n\nRequires: climate at least §Y5§!; in force: Basic Treaty; no crisis at stage 3 or worse; 2 initiative and 25 political power to open talks.\n\nNegotiations advance every month with the climate, the Bahr - Kohl channel, the Permanent Representation and the hard-currency lever; a crisis halts them, a confrontation breaks them off."
 cwgg_rv_tr_6_line:0 "[RV_Treaty_6]"
 cwgg_rv_tr_6_name:0 "6. Traffic, Post and Travel Agreements"
 cwgg_rv_tr_6_tt:0 "§YTraffic, Post and Travel Agreements§!\nTelephone lines, new autobahn crossings, visits for pensioners and urgent family matters: the small steps of the 1970s and 1980s.\n\nRequires: climate at least §Y20§!; in force: Basic Treaty; no crisis at stage 3 or worse; 2 initiative and 25 political power to open talks.\n\nNegotiations advance every month with the climate, the Bahr - Kohl channel, the Permanent Representation and the hard-currency lever; a crisis halts them, a confrontation breaks them off."
 cwgg_rv_tr_7_line:0 "[RV_Treaty_7]"
 cwgg_rv_tr_7_name:0 "7. Cultural Agreement and Town Twinning"
 cwgg_rv_tr_7_tt:0 "§YCultural Agreement and Town Twinning§!\nAfter thirteen years of talks the cultural agreement was signed in May 1986; Saarlouis and Eisenhüttenstadt became the first twinned towns.\n\nRequires: climate at least §Y30§!; in force: Permanent Representations; Available from 1980; no crisis at stage 3 or worse; 2 initiative and 25 political power to open talks.\n\nNegotiations advance every month with the climate, the Bahr - Kohl channel, the Permanent Representation and the hard-currency lever; a crisis halts them, a confrontation breaks them off."
 cwgg_rv_tr_8_line:0 "[RV_Treaty_8]"
 cwgg_rv_tr_8_name:0 "8. State Visit of the SED Leader"
 cwgg_rv_tr_8_tt:0 "§YState Visit of the SED Leader§!\nIn September 1987 Erich Honecker was received in Bonn with flags and anthems - and spoke of a border that would one day 'unite rather than divide'.\n\nRequires: climate at least §Y40§!; in force: Permanent Representations, Traffic, Post and Travel Agreements; Needs the focus §YCoalition of Reason§!; no crisis at stage 3 or worse; 2 initiative and 25 political power to open talks.\n\nNegotiations advance every month with the climate, the Bahr - Kohl channel, the Permanent Representation and the hard-currency lever; a crisis halts them, a confrontation breaks them off."
 cwgg_rv_tr_9_line:0 "[RV_Treaty_9]"
 cwgg_rv_tr_9_name:0 "9. Treaty Community and Confederation"
 cwgg_rv_tr_9_tt:0 "§YTreaty Community and Confederation§!\nA treaty community between the two German states, with joint commissions, a common market and, one day, confederal institutions.\n\nRequires: climate at least §Y70§!; in force: Basic Treaty, Permanent Representations; Needs an open border or a reform government in East Berlin; a majority in the Bundestag to ratify; no crisis at stage 3 or worse; 2 initiative and 25 political power to open talks.\n\nNegotiations advance every month with the climate, the Bahr - Kohl channel, the Permanent Representation and the hard-currency lever; a crisis halts them, a confrontation breaks them off."
 cwgg_rv_tr_avail:0 "§GReady to negotiate.§!"
 cwgg_rv_tr_done:0 "§GIn force.§!"
 cwgg_rv_tr_locked:0 "§gNot yet possible - see the tooltip.§!"
 cwgg_rv_tr_nego:0 "§YIn negotiation:§! [?cwgg_verh_prog|0]%"
 cwgg_sec_access:0 "Access"
 cwgg_sec_access_tt:0 "§YAccess§!\nSend the special commando. Costs §Y35§! political power; one access every 45 days.\nBase chance about §Y1 in 3§!; better with the trace (§G+8§! from 75, §G+10§! from 90), the GSG 9 tier and BKA level 2.\n§RFailure§! (most likely): the suspect escapes and the trace falls by 35. §RShootout§! (rarer with a trained GSG 9): the suspect dies or escapes - and the movement gets a martyr.\nA traced suspect may also notice the surveillance and move on before you act."
 cwgg_sec_bal_l:0 "Security state\n§R[?cwger_security|0]§!"
 cwgg_sec_bal_r:0 "Rule of law\n§G[?cwger_rechtsstaat|0]§!"
 cwgg_sec_bal_tt:0 "§YThe balance§!\nEvery hard measure - dragnet, contact ban, isolation, force-feeding - strengthens the security state and weakens the credibility of the rule of law. A security state above 65 invites abuses (Traube affair, Celle Hole, Kießling affair); a weak rule of law feeds the sympathiser milieu."
 cwgg_sec_btn_ban_pkk:0 "Ban PKK"
 cwgg_sec_btn_ban_pkk_tt:0 "§YBan the PKK§!\nBan the Kurdistan Workers' Party and its front organisations.\n\nCost: §Y50§! political power.\n[SEC_Avail_ban_pkk]"
 cwgg_sec_btn_ban_right:0 "Ban Group"
 cwgg_sec_btn_ban_right_tt:0 "§YBan an Extremist Organisation§!\nArticle 9 of the Basic Law lets the Interior Minister dissolve associations directed against the constitutional order.\n\nCost: §Y60§! political power. Can be repeated after 24 months.\n[SEC_Avail_ban_right]"
 cwgg_sec_btn_contactban:0 "Contact Ban"
 cwgg_sec_btn_contactban_tt:0 "§YImpose a Contact Ban§!\nCut the imprisoned terrorists off from their lawyers and from each other while the hostage is held.\n\nCost: §Y25§! political power. Can be repeated after 2 months.\n[SEC_Avail_contactban]"
 cwgg_sec_btn_counterspy:0 "Counter-Spy"
 cwgg_sec_btn_counterspy_tt:0 "§YCounter-Espionage Campaign§!\nUnmask the 'Romeos' who court secretaries in Bonn ministries and the moles inside the BND.\n\nCost: §Y75§! political power. Can be repeated after 12 months.\n[SEC_Avail_counterspy]"
 cwgg_sec_btn_double:0 "Double Agent"
 cwgg_sec_btn_double_tt:0 "§YTurn a Double Agent§!\nAn HVA courier has been caught. Let him go home - and report what we want East Berlin to hear.\n\nCost: §Y60§! political power. Can be repeated after 12 months.\n[SEC_Avail_double]"
 cwgg_sec_btn_dropout:0 "Exit Offer"
 cwgg_sec_btn_dropout_tt:0 "§YExit Programme§!\nA quiet offer to members who want out: a new identity, reduced sentences, protection.\n\nCost: §Y50§! political power. Can be repeated after 12 months.\n[SEC_Avail_dropout]"
 cwgg_sec_btn_forcefeed:0 "Force-Feed"
 cwgg_sec_btn_forcefeed_tt:0 "§YForce-Feeding§!\nDoctors under police protection keep the hunger strikers alive.\n\nCost: §Y25§! political power. Can be repeated after 4 months.\n[SEC_Avail_forcefeed]"
 cwgg_sec_btn_givein:0 "Give In"
 cwgg_sec_btn_givein_tt:0 "§YGive In to the Demands§!\nRelease the prisoners. The hostage comes home - and every terrorist learns that the Federal Republic can be blackmailed.\n\nCost: No political power.\n[SEC_Avail_givein]"
 cwgg_sec_btn_informant:0 "Informant"
 cwgg_sec_btn_informant_tt:0 "§YRun an Informant§!\nAn informant inside the RAF's logistics could lead the BKA to the commando level - if the operation goes right.\n\nCost: §Y50§! political power. Can be repeated after 24 months.\n[SEC_Avail_informant]"
 cwgg_sec_btn_kinkel:0 "Release"
 cwgg_sec_btn_kinkel_tt:0 "§YRelease Renouncing Prisoners§!\nParole for RAF prisoners who have served long sentences and renounce violence.\n\nCost: §Y40§! political power. Can be repeated after 12 months.\n[SEC_Avail_kinkel]"
 cwgg_sec_btn_kronzeuge:0 "Witness"
 cwgg_sec_btn_kronzeuge_tt:0 "§YRecruit a Crown Witness§!\nLower sentences for those who testify against their former comrades.\n\nCost: §Y50§! political power. Can be repeated after 12 months.\n[SEC_Avail_kronzeuge]"
 cwgg_sec_btn_posters:0 "Posters"
 cwgg_sec_btn_posters_tt:0 "§YWanted Posters§!\nFaces of the most wanted in every post office, every bank, every border crossing.\n\nCost: §Y40§! political power. Can be repeated after 6 months.\n[SEC_Avail_posters]"
 cwgg_sec_btn_raster:0 "Dragnet"
 cwgg_sec_btn_raster_tt:0 "§YComputer Dragnet (Rasterfahndung)§!\nRun the BKA's computers in Wiesbaden against every database the state owns: electricity bills paid in cash, rented flats, car registrations.\n\nCost: §Y50§! political power. Can be repeated after 8 months.\n[SEC_Avail_raster]"
 cwgg_sec_btn_reward:0 "Reward"
 cwgg_sec_btn_reward_tt:0 "§YOffer a Reward§!\nHundreds of thousands of marks for information leading to an arrest.\n\nCost: No political power. Can be repeated after 12 months.\n[SEC_Avail_reward]"
 cwgg_sec_btn_safehouse:0 "Raid"
 cwgg_sec_btn_safehouse_tt:0 "§YRaid the Safe Houses§!\nDragnet results, informants and door-to-door searches in the district where the hostage is thought to be.\n\nCost: §Y50§! political power.\n[SEC_Avail_safehouse]"
 cwgg_sec_btn_stall:0 "Stall"
 cwgg_sec_btn_stall_tt:0 "§YPlay for Time§!\nMessages through the lawyers, a request for proof of life, a television statement that says nothing.\n\nCost: §Y25§! political power.\n[SEC_Avail_stall]"
 cwgg_sec_btn_storm:0 "Storm"
 cwgg_sec_btn_storm_tt:0 "§YSend In GSG 9§!\nThe commandos are ready. Their chance of success depends on their training and on how well the hiding place is known.\n\nCost: §Y25§! political power.\n[SEC_Avail_storm]"
 cwgg_sec_btn_vetting:0 "Vetting"
 cwgg_sec_btn_vetting_tt:0 "§YVet the Chancellery§!\nBackground checks for everyone with access to the chancellor's papers.\n\nCost: §Y40§! political power. Can be repeated after 12 months.\n[SEC_Avail_vetting]"
 cwgg_sec_capab:0 "BKA level §Y[?cwger_bka_level|0]§!/3\nGSG 9 tier §Y[?cwger_gsg9_tier|0]§!/3\nCounter-intel §Y[?cwger_counterintel|0]§!"
 cwgg_sec_capab_tt:0 "§YCapabilities§!\nThe BKA level speeds up the manhunt, slows the RAF's planning and improves foiled attacks. GSG 9 decides raids and rescues. Both are built through the focus tree."
