l_english:
 COLDWAR_DDR.1.a:0 "The unity of economic and social policy."
 COLDWAR_DDR.1.desc:0 "With Moscow's blessing the Politburo forces Walter Ulbricht to resign 'for reasons of age'. Erich Honecker, the man who built the Wall in August 1961, promises 'the unity of economic and social policy': more flats, more consumer goods, more coffee - paid for with credits the GDR does not have."
 COLDWAR_DDR.1.t:0 "Honecker Replaces Ulbricht"
 COLDWAR_DDR.10.a:0 "Hold the crowds back."
 COLDWAR_DDR.10.b:0 "Let them cheer. It changes nothing."
 COLDWAR_DDR.10.desc:0 "When the West German chancellor arrives at the Erfurter Hof hotel, thousands break through the police lines and call for him to show himself at the window. The Stasi brings in trucks of loyal cadres for the next day."
 COLDWAR_DDR.10.t:0 "'Willy Brandt ans Fenster!'"
 COLDWAR_DDR.11.a:0 "Sign - and demarcate."
 COLDWAR_DDR.11.b:0 "Sign and open a little."
 COLDWAR_DDR.11.desc:0 "Two German states, good-neighbourly relations, permanent missions. The GDR wins the recognition it has wanted for twenty years - and opens its border a crack for journalists, visitors and the telephone."
 COLDWAR_DDR.11.t:0 "The Basic Treaty"
 COLDWAR_DDR.2.a:0 "Accept the credit."
 COLDWAR_DDR.2.b:0 "We do not need Bonn's charity."
 COLDWAR_DDR.2.desc:0 "The Federal Republic proposes to raise the interest-free overdraft in inner-German trade. More Western goods, fewer questions - and a little more dependence on the class enemy."
 COLDWAR_DDR.2.t:0 "Bonn Offers a Larger Swing"
 COLDWAR_DDR.3.a:0 "Take the money, dismantle the SM-70."
 COLDWAR_DDR.3.b:0 "No conditions on our border."
 COLDWAR_DDR.3.desc:0 "Franz Josef Strauß himself has arranged a bank loan of one billion marks, guaranteed by the federal government. Schalck-Golodkowski brings the conditions: the self-firing devices on the border are to go, and the minimum exchange for children is to be dropped."
 COLDWAR_DDR.3.t:0 "The Billion-Mark Credit"
 COLDWAR_DDR.30.a:0 "Open the valve: let the applicants go."
 COLDWAR_DDR.30.b:0 "Seal the borders to the socialist neighbours."
 COLDWAR_DDR.30.desc:0 "Applications to leave the country pile up at the district councils. Thousands of young families who have nothing to lose have stopped hiding that they want to go. They gather in churches, wear white ribbons, and some climb the fences of West German embassies."
 COLDWAR_DDR.30.t:0 "The Exit Wave"
 COLDWAR_DDR.31.a:0 "Dialogue. The old man must go."
 COLDWAR_DDR.31.b:0 "The Chinese solution."
 COLDWAR_DDR.31.c:0 "Open the border before it is opened for us."
 COLDWAR_DDR.31.desc1:0 "Leipzig, Monday evening, after the peace prayer in the Nikolaikirche: seventy thousand people walk around the ring road with candles. 'We are the people!' Combat groups and riot police wait in the side streets. Blood plasma has been delivered to the hospitals.\n\nMoscow's guarantee: §Y[?cwddr_moscow_backing|0]§! | SED control: §Y[?cwddr_sed_control|0]§! | Opposition: §Y[?cwddr_opposition|0]§!"
 COLDWAR_DDR.31.t:0 "Monday Demonstrations"
 COLDWAR_DDR.32.a:0 "Open the gates."
 COLDWAR_DDR.32.desc:0 "Politburo member Günter Schabowski reads a note about new travel regulations to the international press. Asked when they take effect, he shuffles his papers: 'As far as I know... immediately, without delay.' By midnight, tens of thousands stand at Bornholmer Straße."
 COLDWAR_DDR.32.t:0 "The Press Conference"
 COLDWAR_DDR.33.a:0 "Modrow forms a government."
 COLDWAR_DDR.33.b:0 "Krenz holds on."
 COLDWAR_DDR.33.desc:0 "The Party has lost the street, the border and its fear. Hans Modrow, the reformer from Dresden, becomes chairman of the Council of Ministers. At a round table in a Protestant community centre, the SED, the bloc parties and the new citizens' movements negotiate free elections."
 COLDWAR_DDR.33.t:0 "The Wall Is Open"
 COLDWAR_DDR.34.a:0 "Socialism is safe."
 COLDWAR_DDR.34.desc:0 "Tanks on Karl-Marx-Platz. The demonstrators are dispersed; hundreds are arrested, an unknown number dead. The West German television teams are expelled. The SED has won the night and lost the country."
 COLDWAR_DDR.34.t:0 "Order Restored"
 COLDWAR_DDR.35.a:0 "A treaty community between two states - no more."
 COLDWAR_DDR.35.b:0 "The plan is the only way out."
 COLDWAR_DDR.35.desc:0 "The federal government has published a plan: free elections in the GDR, then 'confederative structures', then a federation. Nobody in East Berlin was consulted."
 COLDWAR_DDR.35.t:0 "Bonn's Plan for Unity"
 COLDWAR_DDR.36.a:0 "The Alliance for Germany governs."
 COLDWAR_DDR.36.b:0 "The Social Democrats of the East govern."
 COLDWAR_DDR.36.c:0 "The citizens' movements and the reformed PDS govern."
 COLDWAR_DDR.36.desc1:0 "Ninety-three percent turnout. The conservative Alliance for Germany, promised the D-Mark and unity by Helmut Kohl's rallies, wins almost half the vote. Lothar de Maizière, a viola player and church lawyer, becomes the GDR's first and last freely elected prime minister."
 COLDWAR_DDR.36.desc2:0 "The newly founded East German SPD wins in the old social-democratic heartlands of Saxony and Thuringia. A grand coalition under a Christian Democrat prime minister is formed - unity, but at a slower pace."
 COLDWAR_DDR.36.desc3:0 "Neues Forum, Bündnis 90 and the PDS together hold a majority. The GDR's voters want democracy - but not, it seems, to be absorbed by the Federal Republic. A 'third way' government takes office."
 COLDWAR_DDR.36.t:0 "Free Elections to the Volkskammer"
 COLDWAR_DDR.37.a:0 "The Volkskammer votes for accession."
 COLDWAR_DDR.37.b:0 "Not like this."
 COLDWAR_DDR.37.desc:0 "The Federal Republic proposes that the GDR's Länder accede to the area of the Basic Law. The Volkskammer must vote. A yes means the end of the state; a no means another winter of uncertainty."
 COLDWAR_DDR.37.t:0 "Accession to the Federal Republic"
 COLDWAR_DDR.38.a:0 "Here we go again."
 COLDWAR_DDR.38.desc:0 "The fear has worn off. After years of silence the churches are full again, and on Mondays people walk around the ring road once more - more of them than before the massacre."
 COLDWAR_DDR.38.t:0 "The Second Wave"
 COLDWAR_DDR.39.a:0 "Then the border must open."
 COLDWAR_DDR.39.desc:0 "The order to clear the ring road was given - and not carried out. Officers of the National People's Army refused to fire on their own people; the Soviet garrison stayed in its barracks. The Politburo has run out of options."
 COLDWAR_DDR.39.t:0 "The Troops Refuse"
 COLDWAR_DDR.4.a:0 "Sell them."
 COLDWAR_DDR.4.b:0 "Not this year."
 COLDWAR_DDR.4.desc:0 "The lawyer Wolfgang Vogel brings a new list from Bonn. Every political prisoner released to the West brings tens of thousands of D-Marks - in goods delivered through the churches."
 COLDWAR_DDR.4.t:0 "Prisoners for Hard Currency"
 COLDWAR_DDR.5.a:0 "Double it to 25 marks."
 COLDWAR_DDR.5.b:0 "Leave it as it is."
 COLDWAR_DDR.5.desc:0 "Every visitor from the West must exchange a fixed sum of D-Marks at a rate of one to one. Raising it would bring in hard currency - and keep pensioners from Hanover away from their relatives in Halle."
 COLDWAR_DDR.5.t:0 "Raise the Minimum Exchange?"
 COLDWAR_DDR.6.a:0 "Expatriate him."
 COLDWAR_DDR.6.b:0 "Let him come home and sing."
 COLDWAR_DDR.6.desc:0 "The singer Wolf Biermann has been allowed to perform in Cologne - and the concert was broadcast by the WDR to the whole GDR. The Politburo considers withdrawing his citizenship."
 COLDWAR_DDR.6.t:0 "Biermann in Cologne"
 COLDWAR_DDR.8.a:0 "Promise travel relief in return."
 COLDWAR_DDR.8.b:0 "Recognition. Nothing else."
 COLDWAR_DDR.8.desc:0 "Erich Honecker is received in Bonn with military honours, the GDR flag and the GDR anthem. He visits his birthplace in the Saarland. Kohl's speech at the dinner speaks of unity and freedom - and is broadcast live in the East."
 COLDWAR_DDR.8.t:0 "The General Secretary on the Rhine"
 COLDWAR_GBR.1.a:0 "Lafontaine takes the party."
 COLDWAR_GBR.1.b:0 "Scharping holds on - the left is told to wait."
 COLDWAR_GBR.1.desc:0 "Twenty minutes of standing ovation. Oskar Lafontaine had not announced a candidacy; now the delegates demand one. Rudolf Scharping, the chairman, sits on the podium and knows that a vote tomorrow would be a vote of no confidence. In the corridors the Lower Saxony delegation counts heads for its own man - Gerhard Schröder, who wants the chancellorship more than the party."
 COLDWAR_GBR.1.t:0 "Mannheim"
 COLDWAR_GBR.10.a:0 "The party breaks with its past."
 COLDWAR_GBR.10.b:0 "Close ranks behind the old man."
 COLDWAR_GBR.10.desc:0 "The prosecutors, the press and the party's own young leaders demand the names. The old chancellor says he gave his word."
 COLDWAR_GBR.10.t:0 "The Word of Honour"
 COLDWAR_GBR.11.a:0 "Build it - Bavaria does not give way."
 COLDWAR_GBR.11.b:0 "Abandon it - reprocess in France instead."
 COLDWAR_GBR.11.desc:0 "Tens of thousands camp in the forest around the construction site; police use CS gas from helicopters. Austria protests, and the energy companies begin to doubt."
 COLDWAR_GBR.11.t:0 "The Battle of Wackersdorf"
 COLDWAR_GBR.12.a:0 "Ask for a vote of confidence and lose it on purpose."
 COLDWAR_GBR.12.b:0 "Seek a tolerance pact with the Greens."
 COLDWAR_GBR.12.c:0 "Govern on and dare them."
 COLDWAR_GBR.12.desc:0 "The opposition prepares a constructive vote of no confidence; the chancellor prepares an answer. Whoever moves first sets the terms."
 COLDWAR_GBR.12.t:0 "Seventeen Days"
 COLDWAR_GBR.13.a:0 "Schröder is the candidate."
 COLDWAR_GBR.13.b:0 "The chairman insists on his right."
 COLDWAR_GBR.13.desc:0 "Chairman, parliamentary leader and the premier of Lower Saxony pose for the photographers in Bonn, arms linked, smiles fixed. Behind the smiles one question: who will the party put on the posters? The Lower Saxony state election is two months away, and Schröder has announced that a single per cent lost will end his ambitions."
 COLDWAR_GBR.13.t:0 "The Troika"
 COLDWAR_GBR.14.a:0 "A pact: moderate wages, more apprenticeships."
 COLDWAR_GBR.14.b:0 "The talks collapse - and everybody blames the government."
 COLDWAR_GBR.14.desc:0 "The third round in the chancellery. IG Metall wants early retirement at sixty and refuses to talk about wage guidelines; the employers' federation wants exactly that and refuses to promise a single job in return. The chancellor has invited the press for seven o'clock."
 COLDWAR_GBR.14.t:0 "The Alliance for Jobs"
 COLDWAR_GBR.15.a:0 "The chancellor takes the party as well."
 COLDWAR_GBR.15.b:0 "Bring him back - at any price."
 COLDWAR_GBR.15.desc:0 "A Thursday evening in March: the finance minister and party chairman resigns from every office he holds, without a word to the press, and switches off his telephone. Bonn learns about it from the news agencies. The left of the party has lost its champion - and is looking for someone to blame."
 COLDWAR_GBR.15.t:0 "The Chairman Resigns"
 COLDWAR_GBR.2.a:0 "Form a red-green government."
 COLDWAR_GBR.2.b:0 "Without a majority: a pact for the next election."
 COLDWAR_GBR.2.desc:0 "SPD and Greens sit down to negotiate a federal government. Whether they can form one depends on the last election - and on what each side is willing to give up."
 COLDWAR_GBR.2.t:0 "Coalition with the Greens"
 COLDWAR_GBR.3.a:0 "Answer with reforms the voters can see."
 COLDWAR_GBR.3.b:0 "Answer with a tougher line on extremists."
 COLDWAR_GBR.3.c:0 "Ignore them - they will fade."
 COLDWAR_GBR.3.desc:0 "Polls show the small parties rising: the FDP as the only liberal opposition, the Greens or the far left among students, the NPD among the disappointed. The coalition must decide how to answer."
 COLDWAR_GBR.3.t:0 "The Edges Grow"
 COLDWAR_GBR.4.a:0 "A Christian-liberal coalition."
 COLDWAR_GBR.4.b:0 "A social-liberal coalition."
 COLDWAR_GBR.4.c:0 "No majority without them. Call an election."
 COLDWAR_GBR.4.desc:0 "The coalition committee meets for the last time. The chancellor's party can try a smaller coalition - but only if the numbers from the last election are there."
 COLDWAR_GBR.4.t:0 "The End of the Grand Coalition"
 COLDWAR_GBR.5.a:0 "A non-aggression pact: separate parties, one parliamentary group."
 COLDWAR_GBR.5.b:0 "Separate groups, separate campaigns."
 COLDWAR_GBR.5.c:0 "The CSU returns to Bavaria."
 COLDWAR_GBR.5.desc:0 "The two Union parties face each other at the conference table in Wildbad Kreuth. They can make peace on new terms - or go their separate ways for good."
 COLDWAR_GBR.5.t:0 "Kreuth, Again"
 COLDWAR_GBR.6.a:0 "Call an election and win a mandate of our own."
 COLDWAR_GBR.6.b:0 "Win over the FDP: a Christian-liberal coalition."
 COLDWAR_GBR.6.c:0 "Govern on, vote by vote."
 COLDWAR_GBR.6.desc:0 "Two deputies are rumoured to be wavering - and the Stasi's money has found its way to Bonn before. The chancellor must decide how to secure his majority."
 COLDWAR_GBR.6.t:0 "Two Votes"
 COLDWAR_GBR.7.a:0 "Govern pragmatically."
 COLDWAR_GBR.7.b:0 "Close Hanau - whatever the cost."
 COLDWAR_GBR.7.desc:0 "Fischer's first months in Wiesbaden: the Hanau nuclear fuel plants, the chemical industry, a coalition partner that wants jobs. The party base watches every compromise."
 COLDWAR_GBR.7.t:0 "The First Green Minister"
 COLDWAR_GBR.8.a:0 "The party follows its foreign minister."
 COLDWAR_GBR.8.b:0 "The party says no - the coalition breaks."
 COLDWAR_GBR.8.desc:0 "Delegates shout 'warmonger'. Fischer, his ear bleeding, speaks of Auschwitz and Srebrenica. The vote decides whether the coalition survives."
 COLDWAR_GBR.8.t:0 "The Bielefeld Party Congress"
 COLDWAR_GBR.9.a:0 "Späth challenges - and wins."
 COLDWAR_GBR.9.b:0 "The challenge collapses. Kohl remains."
 COLDWAR_GBR.9.desc:0 "The delegates wait for the challenger to declare. Kohl has counted the votes; the reformers have counted the polls."
 COLDWAR_GBR.9.t:0 "Bremen"
 COLDWAR_GBR.90.a:0 "Sanctions until the programme is dismantled."
 COLDWAR_GBR.90.b:0 "Prepare to disarm Germany by force."
 COLDWAR_GBR.90.b.tt:0 "§RCreates a war goal against the Federal Republic.§! Whoever chooses this is prepared to fight a nuclear power in the heart of Europe."
 COLDWAR_GBR.90.c:0 "Accept it - quietly."
 COLDWAR_GBR.90.desc:0 "Bonn has built a nuclear weapon. Every agreement since 1954 - the renunciation of ABC weapons, the Non-Proliferation Treaty, the Four Powers' rights - is being tested. The government must decide how to answer."
 COLDWAR_GBR.90.t:0 "Germany Has the Bomb"
 COLDWAR_GCIV.1.a:0 "The chancellor receives him publicly."
 COLDWAR_GCIV.1.b:0 "A private welcome - nothing for the cameras."
 COLDWAR_GCIV.1.desc:0 "Photographers have climbed the garden wall in Langenbroich. The Soviet embassy lets it be known that an official reception would be 'an unfriendly act'; the opposition demands one. The author himself wants only a desk and silence - and a word from the chancellor."
 COLDWAR_GCIV.1.t:0 "Solzhenitsyn in Germany"
 COLDWAR_GCIV.2.a:0 "A public statement and a parliamentary delegation."
 COLDWAR_GCIV.2.b:0 "Visas and scholarships for the persecuted, without fanfare."
 COLDWAR_GCIV.2.desc:0 "Václav Havel is in custody again. The embassy in Prague reports that a public statement from Bonn would make his release more likely - or less; the diplomats disagree. A group of Bundestag members wants to travel to Prague and visit the signatories in person."
 COLDWAR_GCIV.2.t:0 "Charter 77"
 COLDWAR_GCIV.3.a:0 "Binding targets - Germany leads by example."
 COLDWAR_GCIV.3.b:0 "A mandate to negotiate, nothing more."
 COLDWAR_GCIV.3.desc:0 "Four in the morning in the Congress Centre. The oil states want no targets at all, the island states want them now, Washington wants them later. The chair has one draft left and two ways to end the night."
 COLDWAR_GCIV.3.t:0 "The Climate Conference in Berlin"
 COLDWAR_GCIV.4.a:0 "Tighten the export laws - prison for the guilty."
 COLDWAR_GCIV.4.b:0 "Blame a few black sheep and move on."
 COLDWAR_GCIV.4.desc:0 "The New York Times calls it 'Auschwitz in the sand'. The chancellor's office has the files on its desk: more than fifty German firms have supplied Libya and Iraq with plants that can produce chemical weapons. The export laws allowed almost all of it."
 COLDWAR_GCIV.4.t:0 "Poison Gas from Lahr"
 COLDWAR_GCIV.5.a:0 "A Luftwaffe airlift directly to the camps."
 COLDWAR_GCIV.5.b:0 "Through the churches and the Red Cross only."
 COLDWAR_GCIV.5.desc:0 "The Derg in Addis Ababa demands that all aid go through its own ministries. The relief organisations warn that grain handed to the government will end up with the army. The Luftwaffe has Transall transport aircraft ready in Hanover."
 COLDWAR_GCIV.5.t:0 "The Famine in Ethiopia"
 COLDWAR_GCIV.6.a:0 "Special aid - and a word of regret."
 COLDWAR_GCIV.6.b:0 "Aid, yes. The past is for historians."
 COLDWAR_GCIV.6.desc:0 "SWAPO has won the election. Windhoek's new government invites the Federal Republic to the independence celebrations and asks, politely, what Germany intends to say about the years between 1904 and 1908."
 COLDWAR_GCIV.6.t:0 "Namibia Votes"
 COLDWAR_GCIV.7.a:0 "Back Contadora - peace before ideology."
 COLDWAR_GCIV.7.b:0 "Stand with Washington."
 COLDWAR_GCIV.7.desc:0 "The Contadora group - Mexico, Venezuela, Colombia and Panama - asks the Europeans to back its peace plan. Washington asks its allies not to legitimise the Sandinistas. Both requests arrive on the same day."
 COLDWAR_GCIV.7.t:0 "Central America"
 COLDWAR_GCIV.8.a:0 "Hope for the best."
 COLDWAR_GCIV.8.desc:0 "Monte Carlo, September 1993. Sydney, Beijing, Manchester, Istanbul and Berlin wait for the envelope. The bid committee has been too generous with gifts and too careless with dossiers on the IOC members' private lives; the newspapers have found out."
 COLDWAR_GCIV.8.t:0 "The IOC Decides"
 COLDWAR_GDARK.1.a:0 "We respect the court. This ends here."
 COLDWAR_GDARK.1.a.tt:0 "§GThe path ends for good.§! The republic has defended itself."
 COLDWAR_GDARK.1.b:0 "The court has no army. We ignore it."
 COLDWAR_GDARK.1.b.tt:0 "§RA constitutional crisis.§! Every other government will hear of it."
 COLDWAR_GDARK.1.desc:0 "The Federal Constitutional Court has opened proceedings under Article 21 of the Basic Law to ban the NPD as unconstitutional, and has issued an injunction against the government's emergency plans. The president of the court says the Basic Law 'does not provide for its own abolition'."
 COLDWAR_GDARK.1.t:0 "Karlsruhe Moves"
 COLDWAR_GDARK.10.a:0 "We condemn it."
 COLDWAR_GDARK.10.b:0 "This is Germany's own affair."
 COLDWAR_GDARK.10.desc:0 "The West German government has suspended the Bundestag and handed power to a 'National Directorate'. In the heart of Europe, between NATO and the Warsaw Pact, a democracy has ended."
 COLDWAR_GDARK.10.t:0 "Dictatorship in Bonn"
 COLDWAR_GDARK.20.a:0 "Suspend Bonn from the Alliance."
 COLDWAR_GDARK.20.a.tt:0 "If Bonn is still a member, it §Rleaves NATO§! (one member's decision is enough)."
 COLDWAR_GDARK.20.b:0 "Economic sanctions."
 COLDWAR_GDARK.20.c:0 "Invoke the Allied reserved rights - prepare to intervene."
 COLDWAR_GDARK.20.c.tt:0 "The Western Allies never gave up their rights for Germany as a whole and Berlin. §RCreates a war goal to restore the Basic Law.§! The Allies would be marching into the country they once liberated - and rebuilt."
 COLDWAR_GDARK.20.d:0 "Condemn it, but keep the channels open."
 COLDWAR_GDARK.20.desc:0 "Bonn's new rulers still sit in NATO's councils, still command twelve divisions assigned to the Alliance, still hold the codes of the nuclear sharing arrangements. Every member government must decide what the Alliance owes a dictatorship."
 COLDWAR_GDARK.20.t:0 "The Alliance and the Directorate"
 COLDWAR_GDARK.25.a:0 "Welcome back. Lift our measures."
 COLDWAR_GDARK.25.b:0 "Trust will have to be earned."
 COLDWAR_GDARK.25.desc:0 "Bonn has lifted the emergency decrees, recalled the Bundestag and announced free elections. The question is whether the world will take the Germans back - again."
 COLDWAR_GDARK.25.t:0 "The Republic Returns"
 COLDWAR_GDARK.3.a:0 "Count the votes."
 COLDWAR_GDARK.3.a.tt:0 "§Y40%§! (more without a government majority, if the emergency laws were tied to the court or with a popularly elected president) that the Bundestag replaces the chancellor - the path ends. Otherwise the generals must choose."
 COLDWAR_GDARK.3.desc:0 "The opposition and the government's own dissidents table a constructive vote of no confidence. If they find a majority for another chancellor, the emergency is over before it began."
 COLDWAR_GDARK.3.t:0 "The Vote in the Bundestag"
 COLDWAR_GDARK.30.a:0 "Invoke the enemy-state clauses of the UN Charter."
 COLDWAR_GDARK.30.a.tt:0 "Articles 53 and 107 allow action against a former enemy state that resumes an aggressive policy. §RCreates a war goal against the Federal Republic.§! The road to the Rhine has been planned since 1945; now it would be driven."
 COLDWAR_GDARK.30.b:0 "Alert the Group of Soviet Forces and guarantee our allies."
 COLDWAR_GDARK.30.c:0 "Sanctions and a note of protest."
 COLDWAR_GDARK.30.desc:0 "Twenty-five years after the Great Patriotic War, nationalists rule in Bonn. The marshals want to know whether the Group of Soviet Forces in Germany is to be placed on alert. The Foreign Ministry reminds the Politburo that the UN Charter still names Germany an 'enemy state'."
 COLDWAR_GDARK.30.t:0 "Revanchism in Power"
 COLDWAR_GDARK.31.a:0 "Prepare for every eventuality."
 COLDWAR_GDARK.31.a.tt:0 "§RCreates a war goal against the Federal Republic.§! The plans in the General Staff's safe stop being exercises."
 COLDWAR_GDARK.31.b:0 "Reinforce the Western Group of Forces."
 COLDWAR_GDARK.31.c:0 "Watch and wait."
 COLDWAR_GDARK.31.desc:0 "Bonn is rearming outside every Alliance quota and has torn up the treaties of the 1970s. The General Staff asks for permission to prepare for every eventuality."
 COLDWAR_GDARK.31.t:0 "The Directorate Arms"
 COLDWAR_GDARK.32.a:0 "Any attack on the GDR is an attack on the Soviet Union."
 COLDWAR_GDARK.32.b:0 "Strike before the Directorate does."
 COLDWAR_GDARK.32.b.tt:0 "§RCreates a war goal against the Federal Republic.§! A pre-emptive war on German soil - the nightmare of every planner since 1949."
 COLDWAR_GDARK.32.desc:0 "The National Directorate claims the territory of the German Democratic Republic and has issued a war goal against East Berlin. Every treaty since 1945 is at stake."
 COLDWAR_GDARK.32.t:0 "Bonn Claims the GDR"
 COLDWAR_GDARK.4.a:0 "Await their answer."
 COLDWAR_GDARK.4.a.tt:0 "§Y50%§! that the generals refuse (more with the Innere Führung reforms and NATO integration) - then the path ends."
 COLDWAR_GDARK.4.desc:0 "The chief of staff of the Bundeswehr is asked whether the armed forces will carry out the government's orders. The officers swore an oath to the Basic Law, not to a government; the Innere Führung taught them to refuse unlawful orders."
 COLDWAR_GDARK.4.t:0 "The Generals' Answer"
 COLDWAR_GDARK.40.a:0 "The anti-fascist protective wall was right."
 COLDWAR_GDARK.40.b:0 "Appeal to the United Nations."
 COLDWAR_GDARK.40.desc:0 "The GDR has always called the Federal Republic a revanchist state. Now Bonn's own government seems determined to prove it. The National People's Army is put on alert; the Politburo asks Moscow for guarantees."
 COLDWAR_GDARK.40.t:0 "Fascism on Our Border"
 COLDWAR_GDARK.45.a:0 "Ask Moscow for protection."
 COLDWAR_GDARK.45.b:0 "Mobilise and appeal to the West."
 COLDWAR_GDARK.45.desc:0 "The National Directorate has declared the Warsaw Treaty of 1970 void - including the recognition of the Oder-Neisse line. Every Polish family that was moved west in 1945 understands what that means."
 COLDWAR_GDARK.45.t:0 "Bonn Tears Up the Warsaw Treaty"
 COLDWAR_GDARK.5.a:0 "Let them march."
 COLDWAR_GDARK.5.b:0 "Ban the march as a threat to public order."
 COLDWAR_GDARK.5.desc:0 "Trade unions, churches, students and the Greens call a day of protest against the 'march to the right'. Hundreds of thousands fill the Bonn Hofgarten."
 COLDWAR_GDARK.5.t:0 "The Other Germany Takes to the Streets"
 COLDWAR_GDARK.6.a:0 "The Basic Law holds."
 COLDWAR_GDARK.6.desc:0 "The constructive vote of no confidence succeeds. The Bundestag elects a new chancellor, who lifts the emergency decrees in his first act. The republic has defended itself - narrowly."
 COLDWAR_GDARK.6.t:0 "A New Chancellor"
 COLDWAR_GDARK.60.a:0 "Arrest them."
 COLDWAR_GDARK.60.b:0 "Make concessions."
 COLDWAR_GDARK.60.desc:0 "Leaflets at the universities, a strike at the Ruhr pits, a broadcast from a hidden transmitter: 'The Basic Law lives.' The Directorate's police know the names of some of them."
 COLDWAR_GDARK.60.t:0 "The Resistance"
 COLDWAR_GDARK.7.a:0 "It is over."
 COLDWAR_GDARK.7.desc:0 "The inspector general announces on television that the Bundeswehr 'stands on the ground of the Basic Law' and will not act against the Bundestag. The government's authority collapses within hours."
 COLDWAR_GDARK.7.t:0 "The Generals Refuse"
 COLDWAR_GDARK.8.a:0 "The way is open."
 COLDWAR_GDARK.8.desc:0 "The generals declare the armed forces 'neutral in a political dispute'. Nobody will stop the government - and everybody understands what that means."
 COLDWAR_GDARK.8.t:0 "The Army Stands Aside"
 COLDWAR_GDIP.10.a:0 "We sign. The Alliance stands."
 COLDWAR_GDIP.10.b:0 "Washington does not need a declaration."
 COLDWAR_GDIP.10.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn proposes a joint declaration on the future of the Alliance: American troops stay in Europe, the Europeans carry more of the burden, and both sides consult before they act.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.10.t:0 "The Atlantic Declaration"
 COLDWAR_GDIP.100.a:0 "Warsaw accepts the credit."
 COLDWAR_GDIP.100.b:0 "Warsaw will not trade people."
 COLDWAR_GDIP.100.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn offers a billion marks in low-interest credits and a pension settlement. In return 125,000 ethnic Germans may leave for the Federal Republic over four years.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.100.t:0 "Credits for Emigration"
 COLDWAR_GDIP.101.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.101.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'Credits for Emigration' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.101.t:0 "Credits for Emigration: Agreed"
 COLDWAR_GDIP.102.a:0 "Then not - for now."
 COLDWAR_GDIP.102.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'Credits for Emigration'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.102.t:0 "Credits for Emigration: Refused"
 COLDWAR_GDIP.11.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.11.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'The Atlantic Declaration' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.11.t:0 "The Atlantic Declaration: Agreed"
 COLDWAR_GDIP.110.a:0 "Yugoslavia accepts."
 COLDWAR_GDIP.110.b:0 "Non-alignment means no conditions."
 COLDWAR_GDIP.110.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn offers long-term capital aid and a social insurance agreement for Yugoslav workers. In return Belgrade cooperates against terrorists who use the country as a refuge.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.110.t:0 "A Partnership with Belgrade"
 COLDWAR_GDIP.111.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.111.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'A Partnership with Belgrade' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.111.t:0 "A Partnership with Belgrade: Agreed"
 COLDWAR_GDIP.112.a:0 "Then not - for now."
 COLDWAR_GDIP.112.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'A Partnership with Belgrade'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.112.t:0 "A Partnership with Belgrade: Refused"
 COLDWAR_GDIP.12.a:0 "Then not - for now."
 COLDWAR_GDIP.12.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'The Atlantic Declaration'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.12.t:0 "The Atlantic Declaration: Refused"
 COLDWAR_GDIP.120.a:0 "Let them go."
 COLDWAR_GDIP.120.b:0 "They are Soviet citizens."
 COLDWAR_GDIP.120.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn asks Moscow to allow ethnic Germans to emigrate freely and offers economic cooperation and help with consumer goods in return.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.120.t:0 "Exit Permits for Soviet Germans"
 COLDWAR_GDIP.121.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.121.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'Exit Permits for Soviet Germans' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.121.t:0 "Exit Permits for Soviet Germans: Agreed"
 COLDWAR_GDIP.122.a:0 "Then not - for now."
 COLDWAR_GDIP.122.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'Exit Permits for Soviet Germans'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.122.t:0 "Exit Permits for Soviet Germans: Refused"
 COLDWAR_GDIP.130.a:0 "We come to Bonn."
 COLDWAR_GDIP.130.b:0 "The time is not right."
 COLDWAR_GDIP.130.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn invites the Soviet leader for a state visit and proposes a joint declaration: the right of all peoples and states to determine their own fate, freely.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.130.t:0 "The Bonn Declaration"
 COLDWAR_GDIP.131.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.131.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'The Bonn Declaration' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.131.t:0 "The Bonn Declaration: Agreed"
 COLDWAR_GDIP.132.a:0 "Then not - for now."
 COLDWAR_GDIP.132.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'The Bonn Declaration'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.132.t:0 "The Bonn Declaration: Refused"
 COLDWAR_GDIP.140.a:0 "We open the border."
 COLDWAR_GDIP.140.b:0 "We will not anger East Berlin."
 COLDWAR_GDIP.140.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn offers a credit of 500 million marks and asks Budapest to let the East German refugees in Hungary leave for the West.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.140.t:0 "The Hungarian Door"
 COLDWAR_GDIP.141.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.141.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'The Hungarian Door' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.141.t:0 "The Hungarian Door: Agreed"
 COLDWAR_GDIP.142.a:0 "Then not - for now."
 COLDWAR_GDIP.142.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'The Hungarian Door'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.142.t:0 "The Hungarian Door: Refused"
 COLDWAR_GDIP.150.a:0 "China welcomes the Federal Republic."
 COLDWAR_GDIP.150.b:0 "Bonn is too close to Washington."
 COLDWAR_GDIP.150.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. The Federal Republic proposes diplomatic relations and a trade agreement. Beijing sees a counterweight to Moscow in Europe.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.150.t:0 "Diplomatic Relations with Bonn"
 COLDWAR_GDIP.151.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.151.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'Diplomatic Relations with Bonn' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.151.t:0 "Diplomatic Relations with Bonn: Agreed"
 COLDWAR_GDIP.152.a:0 "Then not - for now."
 COLDWAR_GDIP.152.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'Diplomatic Relations with Bonn'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.152.t:0 "Diplomatic Relations with Bonn: Refused"
 COLDWAR_GDIP.160.a:0 "Agreed."
 COLDWAR_GDIP.160.b:0 "Our trade policy is our own."
 COLDWAR_GDIP.160.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn proposes regular government consultations with Tokyo on trade, currency and technology.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.160.t:0 "A German-Japanese Consultation"
 COLDWAR_GDIP.161.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.161.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'A German-Japanese Consultation' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.161.t:0 "A German-Japanese Consultation: Agreed"
 COLDWAR_GDIP.162.a:0 "Then not - for now."
 COLDWAR_GDIP.162.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'A German-Japanese Consultation'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.162.t:0 "A German-Japanese Consultation: Refused"
 COLDWAR_GDIP.170.a:0 "India accepts."
 COLDWAR_GDIP.170.b:0 "We prefer Soviet terms."
 COLDWAR_GDIP.170.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn offers a long-term development partnership: capital aid, technical universities and industrial cooperation.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.170.t:0 "A Development Partnership"
 COLDWAR_GDIP.171.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.171.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'A Development Partnership' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.171.t:0 "A Development Partnership: Agreed"
 COLDWAR_GDIP.172.a:0 "Then not - for now."
 COLDWAR_GDIP.172.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'A Development Partnership'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.172.t:0 "A Development Partnership: Refused"
 COLDWAR_GDIP.180.a:0 "Riyadh buys."
 COLDWAR_GDIP.180.b:0 "We buy American."
 COLDWAR_GDIP.180.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn offers to sell Leopard 2 main battle tanks and the training that comes with them.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.180.t:0 "The Leopard Deal"
 COLDWAR_GDIP.181.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.181.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'The Leopard Deal' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.181.t:0 "The Leopard Deal: Agreed"
 COLDWAR_GDIP.182.a:0 "Then not - for now."
 COLDWAR_GDIP.182.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'The Leopard Deal'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.182.t:0 "The Leopard Deal: Refused"
 COLDWAR_GDIP.190.a:0 "Paris will host."
 COLDWAR_GDIP.190.b:0 "Paris has its own plans."
 COLDWAR_GDIP.190.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn and Paris propose an informal summit of the leading Western economies to coordinate currencies, energy and trade after the oil shock.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.190.t:0 "A Summit of the Big Economies"
 COLDWAR_GDIP.191.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.191.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'A Summit of the Big Economies' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.191.t:0 "A Summit of the Big Economies: Agreed"
 COLDWAR_GDIP.192.a:0 "Then not - for now."
 COLDWAR_GDIP.192.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'A Summit of the Big Economies'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.192.t:0 "A Summit of the Big Economies: Refused"
 COLDWAR_GDIP.20.a:0 "Ten divisions in ten days. Agreed."
 COLDWAR_GDIP.20.b:0 "We will not tie our hands."
 COLDWAR_GDIP.20.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn offers a wartime host nation support agreement: German reservists will receive, move and protect American reinforcements. In return Washington pledges to send ten divisions within ten days of a crisis.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.20.t:0 "Host Nation Support"
 COLDWAR_GDIP.200.a:0 "Noted."
 COLDWAR_GDIP.200.desc:0 "The West German government is courting the far right and talks of 'order above everything'. Diplomats in Bonn report that the Federal Republic's democratic consensus is fraying."
 COLDWAR_GDIP.200.t:0 "Worrying Signals from Bonn"
 COLDWAR_GDIP.21.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.21.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'Host Nation Support' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.21.t:0 "Host Nation Support: Agreed"
 COLDWAR_GDIP.210.a:0 "Noted."
 COLDWAR_GDIP.210.desc:0 "The West German government has declared that it will not comply with an injunction of the Federal Constitutional Court. Lawyers speak of a constitutional crisis; the Allies' embassies speak of nothing else."
 COLDWAR_GDIP.210.t:0 "Bonn Defies Its Constitutional Court"
 COLDWAR_GDIP.22.a:0 "Then not - for now."
 COLDWAR_GDIP.22.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'Host Nation Support'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.22.t:0 "Host Nation Support: Refused"
 COLDWAR_GDIP.220.a:0 "Noted."
 COLDWAR_GDIP.220.desc:0 "A constructive vote of no confidence has ended the West German government's attempt to rule by decree. The new chancellor promises to restore every constitutional right."
 COLDWAR_GDIP.220.t:0 "The Federal Republic Holds"
 COLDWAR_GDIP.230.a:0 "Noted."
 COLDWAR_GDIP.230.desc:0 "West Germany's armed forces have refused to support the government's emergency rule. A caretaker government has taken over in Bonn."
 COLDWAR_GDIP.230.t:0 "The Bundeswehr Stands by the Constitution"
 COLDWAR_GDIP.240.a:0 "Noted."
 COLDWAR_GDIP.240.desc:0 "The two German states have opened negotiations on unity: a constitution, an economic order, an alliance, a capital and the borders. Every one of the Four Powers will have to agree to the result."
 COLDWAR_GDIP.240.t:0 "Unity Talks in Germany"
 COLDWAR_GDIP.250.a:0 "Noted."
 COLDWAR_GDIP.250.desc:0 "Bonn and East Berlin have agreed on every chapter of a treaty on German unity. Washington, Moscow, London and Paris must now decide whether they accept it."
 COLDWAR_GDIP.250.t:0 "The German Unity Treaty Is Initialled"
 COLDWAR_GDIP.260.a:0 "Noted."
 COLDWAR_GDIP.260.desc:0 "By treaty and with the consent of the Four Powers, the two German states have become one. No shot was fired, no wall fell - the diplomats simply finished their work."
 COLDWAR_GDIP.260.t:0 "Germany Is United"
 COLDWAR_GDIP.270.a:0 "Paris signs up."
 COLDWAR_GDIP.270.b:0 "Paris prefers its own plans."
 COLDWAR_GDIP.270.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn proposes a European employment pact: coordinated public investment, wage policy and pressure on the central banks for lower interest rates.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.270.t:0 "A European Employment Pact"
 COLDWAR_GDIP.271.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.271.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'A European Employment Pact' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.271.t:0 "A European Employment Pact: Agreed"
 COLDWAR_GDIP.272.a:0 "Then not - for now."
 COLDWAR_GDIP.272.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'A European Employment Pact'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.272.t:0 "A European Employment Pact: Refused"
 COLDWAR_GDIP.280.a:0 "The GDR signs."
 COLDWAR_GDIP.280.b:0 "Moscow decides such questions."
 COLDWAR_GDIP.280.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn proposes a treaty between the two German states: no chemical weapons on German soil, verified by mutual inspections.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.280.t:0 "A Zone Free of Chemical Weapons"
 COLDWAR_GDIP.281.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.281.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'A Zone Free of Chemical Weapons' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.281.t:0 "A Zone Free of Chemical Weapons: Agreed"
 COLDWAR_GDIP.282.a:0 "Then not - for now."
 COLDWAR_GDIP.282.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'A Zone Free of Chemical Weapons'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.282.t:0 "A Zone Free of Chemical Weapons: Refused"
 COLDWAR_GDIP.290.a:0 "Noted."
 COLDWAR_GDIP.290.desc:0 "Western intelligence services report that West Germany's uranium enrichment at Gronau is expanding beyond civilian needs."
 COLDWAR_GDIP.290.t:0 "Questions about Gronau"
 COLDWAR_GDIP.30.a:0 "Welcome aboard."
 COLDWAR_GDIP.30.b:0 "This research stays American."
 COLDWAR_GDIP.30.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn proposes a memorandum of understanding: West German firms and institutes take part in the research for the Strategic Defense Initiative.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.30.t:0 "SDI Research Memorandum"
 COLDWAR_GDIP.300.a:0 "Noted."
 COLDWAR_GDIP.300.desc:0 "Leaks from Bonn suggest that the Federal Republic has begun a nuclear weapons programme. Washington, Moscow, London and Paris demand explanations."
 COLDWAR_GDIP.300.t:0 "A German Bomb Programme"
 COLDWAR_GDIP.31.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.31.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'SDI Research Memorandum' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.31.t:0 "SDI Research Memorandum: Agreed"
 COLDWAR_GDIP.310.a:0 "Noted."
 COLDWAR_GDIP.310.desc:0 "The Federal Republic of Germany has completed its first nuclear weapon. Twenty-five years of non-proliferation diplomacy lie in ruins."
 COLDWAR_GDIP.310.t:0 "Germany Has the Bomb"
 COLDWAR_GDIP.32.a:0 "Then not - for now."
 COLDWAR_GDIP.32.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'SDI Research Memorandum'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.32.t:0 "SDI Research Memorandum: Refused"
 COLDWAR_GDIP.320.a:0 "The Army is coming."
 COLDWAR_GDIP.320.b:0 "The budget does not allow it."
 COLDWAR_GDIP.320.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn proposes to make the annual REFORGER exercise larger and closer to the inner-German border, with German divisions under American corps command.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.320.t:0 "A Larger REFORGER Exercise"
 COLDWAR_GDIP.321.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.321.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'A Larger REFORGER Exercise' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.321.t:0 "A Larger REFORGER Exercise: Agreed"
 COLDWAR_GDIP.322.a:0 "Then not - for now."
 COLDWAR_GDIP.322.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'A Larger REFORGER Exercise'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.322.t:0 "A Larger REFORGER Exercise: Refused"
 COLDWAR_GDIP.330.a:0 "Let him land."
 COLDWAR_GDIP.330.b:0 "Not this man."
 COLDWAR_GDIP.330.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. The Bavarian premier and former defence minister asks for a meeting with the General Secretary: trade, Bavarian industry, and a message from the Western conservatives.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.330.t:0 "A Visit from Strauß"
 COLDWAR_GDIP.331.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.331.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'A Visit from Strauß' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.331.t:0 "A Visit from Strauß: Agreed"
 COLDWAR_GDIP.332.a:0 "Then not - for now."
 COLDWAR_GDIP.332.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'A Visit from Strauß'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.332.t:0 "A Visit from Strauß: Refused"
 COLDWAR_GDIP.340.a:0 "Sign it together."
 COLDWAR_GDIP.340.b:0 "London keeps its own counsel."
 COLDWAR_GDIP.340.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. The German chancellor proposes a joint declaration with the British prime minister on the future of European social democracy: modern government, flexible markets, fewer subsidies and an 'enabling state'.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.340.t:0 "Europe: The Third Way"
 COLDWAR_GDIP.341.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.341.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'Europe: The Third Way' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.341.t:0 "Europe: The Third Way: Agreed"
 COLDWAR_GDIP.342.a:0 "Then not - for now."
 COLDWAR_GDIP.342.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'Europe: The Third Way'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.342.t:0 "Europe: The Third Way: Refused"
 COLDWAR_GDIP.350.a:0 "Our historians will come."
 COLDWAR_GDIP.350.b:0 "History is ours to teach."
 COLDWAR_GDIP.350.desc:0 "The ambassador of the Federal Republic has asked for an urgent appointment and delivers a proposal from Bonn. Bonn proposes a joint commission of historians to revise the history textbooks of both countries and remove the hatred of the last century from the classroom.\n\nThe cabinet must weigh what the Germans offer against what saying yes would mean - at home, with our neighbours and with our allies."
 COLDWAR_GDIP.350.t:0 "A Joint Textbook Commission"
 COLDWAR_GDIP.351.a:0 "A good day for German diplomacy."
 COLDWAR_GDIP.351.desc:0 "The answer arrives by diplomatic cable, sooner than the Foreign Office expected: [From.GetName] has accepted. 'A Joint Textbook Commission' is no longer a proposal but policy - and the ministries in Bonn now have to make it work."
 COLDWAR_GDIP.351.t:0 "A Joint Textbook Commission: Agreed"
 COLDWAR_GDIP.352.a:0 "Then not - for now."
 COLDWAR_GDIP.352.desc:0 "The ambassador's report is courteous and unambiguous: [From.GetName] will not accept 'A Joint Textbook Commission'. In the Foreign Office the desk officers file the draft away - for another occasion, another approach, or another government."
 COLDWAR_GDIP.352.t:0 "A Joint Textbook Commission: Refused"
 COLDWAR_GDIP.360.a:0 "Strasbourg it is."
 COLDWAR_GDIP.360.b:0 "French culture needs no partner."
