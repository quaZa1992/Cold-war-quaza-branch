 cwgg_special_tt_1:0 "Costs money. Crisis intensity §G-25§!, Cold War world tension §R+1§!."
 cwgg_special_tt_10:0 "Needs the focus §YThe Liberation Doctrine§!. Opens the path to war."
 cwgg_special_tt_2:0 "Needs UN membership. Intensity §G-10§!, GDR recognition §G-4§!, climate §R-3§!."
 cwgg_special_tt_3:0 "Needs the Vogel channel. Intensity §G-30§!."
 cwgg_special_tt_4:0 "Costs money. Intensity §G-35§!, GDR exit pressure §R+6§!."
 cwgg_special_tt_5:0 "Intensity §G-20§!, climate §R-5§!. Only before the Basic Treaty."
 cwgg_special_tt_6:0 "Needs NATO membership. Intensity §G-25§!, peace movement §G-6§!, a permanently better climate base."
 cwgg_special_tt_7:0 "Intensity §G-30§!, war support §R-2%§!."
 cwgg_special_tt_8:0 "Intensity §G-15§!, GDR opposition §Y+3§!."
 cwgg_special_tt_9:0 "Needs the Basic Treaty. Intensity §G-20§!, climate §G+3§!."
 cwgg_stage_0:0 "Modus Vivendi"
 cwgg_stage_0_desc:0 "Two states have settled into a working relationship: visits, credits, treaties and a border that is quieter than it has ever been."
 cwgg_stage_1:0 "Cool Coexistence"
 cwgg_stage_1_desc:0 "Correct, cautious and transactional. Neither side expects much, neither side wants trouble."
 cwgg_stage_2:0 "Tensions"
 cwgg_stage_2_desc:0 "Harsh words in Neues Deutschland and the Bundestag, incidents at the border, channels running cold."
 cwgg_stage_3:0 "Crisis"
 cwgg_stage_3_desc:0 "A confrontation is under way. Every move is watched in Washington and Moscow."
 cwgg_stage_4:0 "Confrontation"
 cwgg_stage_4_desc:0 "Both states treat each other as enemies. Trade has halved, the armies are watching the border."
 cwgg_stage_5:0 "War Danger"
 cwgg_stage_5_desc:0 "Troops on alert on both sides of the Iron Curtain. One mistake could start a war in the middle of Europe."
 cwgg_stage_6:0 "War"
 cwgg_stage_6_desc:0 "German soldiers are fighting Germans."
 cwgg_stance_allies:0 "Call in the Allies"
 cwgg_stance_allies_desc:0 "Ask Washington, London and Paris to speak for Berlin and Germany as a whole. Needs NATO membership - and if Moscow is called too, the crisis is no longer ours."
 cwgg_stance_deescalate:0 "De-escalate"
 cwgg_stance_deescalate_desc:0 "Lower the temperature: conciliatory statements, a postponed visit, a quiet word in the ear of the Permanent Representation."
 cwgg_stance_firm:0 "Stand Firm"
 cwgg_stance_firm_desc:0 "Make clear that Bonn will not give way - without adding new pressure of its own."
 cwgg_stance_mobilise:0 "Prepare Mobilisation"
 cwgg_stance_mobilise_desc:0 "Raise readiness and say so. Deters escalation - and escalates."
 cwgg_stance_pressure:0 "Counter-Pressure"
 cwgg_stance_pressure_desc:0 "Use the lever that hurts East Berlin most in this crisis. Strong if the lever is strong, a bluff if it is not."
 cwgg_stance_secret:0 "Secret Channel"
 cwgg_stance_secret_desc:0 "Settle it quietly through an open channel. Effective, but the Stasi listens on every line it can reach."
 cwgg_stance_wait:0 "Wait and See"
 cwgg_stance_wait_desc:0 "Let the ministries handle it. Costs nothing and signals little - East Berlin sets the pace."
 cwgg_treaty_1:0 "Meeting of the Heads of Government"
 cwgg_treaty_1_desc:0 "Willy Brandt and Willi Stoph met in Erfurt in March 1970 and in Kassel in May. Nothing was agreed - but for the first time the two German governments talked to each other."
 cwgg_treaty_1_unlock:0 "Needs the focus §YChange through Rapprochement§!."
 cwgg_treaty_2:0 "Berlin Settlement"
 cwgg_treaty_2_desc:0 "The Quadripartite Agreement of September 1971 and the transit agreement that followed: unhindered traffic between the Federal Republic and West Berlin, guaranteed by the Four Powers."
 cwgg_treaty_3:0 "Basic Treaty"
 cwgg_treaty_3_desc:0 "The Grundlagenvertrag of December 1972: two German states, equal rights, good-neighbourly relations - and Bonn's letter on German unity, so that nothing is given up for ever."
 cwgg_treaty_3_unlock:0 "Needs the focus §YThe Basic Treaty§!."
 cwgg_treaty_4:0 "Both States in the United Nations"
 cwgg_treaty_4_desc:0 "In September 1973 the United Nations admitted the Federal Republic and the GDR on the same day."
 cwgg_treaty_5:0 "Permanent Representations"
 cwgg_treaty_5_desc:0 "Missions, not embassies: Günter Gaus moved into Hannoversche Straße in East Berlin in 1974, Michael Kohl into Godesberger Allee in Bonn."
 cwgg_treaty_6:0 "Traffic, Post and Travel Agreements"
 cwgg_treaty_6_desc:0 "Telephone lines, new autobahn crossings, visits for pensioners and urgent family matters: the small steps of the 1970s and 1980s."
 cwgg_treaty_7:0 "Cultural Agreement and Town Twinning"
 cwgg_treaty_7_desc:0 "After thirteen years of talks the cultural agreement was signed in May 1986; Saarlouis and Eisenhüttenstadt became the first twinned towns."
 cwgg_treaty_7_unlock:0 "Available from 1980."
 cwgg_treaty_8:0 "State Visit of the SED Leader"
 cwgg_treaty_8_desc:0 "In September 1987 Erich Honecker was received in Bonn with flags and anthems - and spoke of a border that would one day 'unite rather than divide'."
 cwgg_treaty_8_unlock:0 "Needs the focus §YCoalition of Reason§!."
 cwgg_treaty_9:0 "Treaty Community and Confederation"
 cwgg_treaty_9_desc:0 "A treaty community between the two German states, with joint commissions, a common market and, one day, confederal institutions."
 cwgg_treaty_9_unlock:0 "Needs an open border or a reform government in East Berlin."
 cwgg_u_before:0 "Unity by treaty is the hardest road in this game. Both German governments must want it and must agree on five chapters, one every three months. Then the United States, the Soviet Union, Britain and France each consent or veto - a veto reopens the chapter it objects to. Finally the Bundestag and the Volkskammer ratify.\n\nThe existing unity focuses only become available when relations are at §YCool Coexistence§! or better with a climate above §Y40§!; during the talks they move East Berlin and the Four Powers."
 cwgg_u_break:0 "Break Off"
 cwgg_u_break_tt:0 "§YBreak Off the Talks§!\nEnd the unity negotiations. The climate falls by 15 and the subject is closed for three years."
 cwgg_u_c1:0 "Unbroken détente: §Y[?cwgg_detente_m|0]§!/§Y36§! months (Modus Vivendi, climate 60+, no crisis)"
 cwgg_u_c2:0 "Climate now §Y[?cwgg_klima|0]§! (needs §Y70§!) · stage [RV_StageColored] (needs §G0§!)"
 cwgg_u_c3:0 "In force: Basic Treaty, Representations, Traffic, Culture or Visit"
 cwgg_u_c4:0 "Focus §YA European Peace Order§! · §Y3§! initiative · §Y100§! political power"
 cwgg_u_ch_1_n:0 "1. The Constitution"
 cwgg_u_ch_1_ok_1:0 "§GAgreed:§! The Basic Law (Article 23)"
 cwgg_u_ch_1_ok_2:0 "§GAgreed:§! A New Constitution (Article 146)"
 cwgg_u_ch_1_ok_3:0 "§GAgreed:§! A Socialist Constitution"
 cwgg_u_ch_1_s:0 "[U_Ch1]"
 cwgg_u_ch_1_tt:0 "§YThe Constitution§!\nUnder which constitution do the Germans live together?\n\n§YThe Basic Law (Article 23)§! (western line): The GDR's Länder accede to the Federal Republic. The Basic Law applies everywhere.\n§YA New Constitution (Article 146)§! (compromise): A constituent assembly from both states writes a new constitution for all Germans.\n§YA Socialist Constitution§! (eastern line): The united Germany is built on the GDR's constitution: a people's republic with a leading party."
 cwgg_u_ch_2_n:0 "2. The Economy"
 cwgg_u_ch_2_ok_1:0 "§GAgreed:§! Social Market Economy"
 cwgg_u_ch_2_ok_2:0 "§GAgreed:§! A Mixed Economy"
 cwgg_u_ch_2_ok_3:0 "§GAgreed:§! Planned Economy"
 cwgg_u_ch_2_s:0 "[U_Ch2]"
 cwgg_u_ch_2_tt:0 "§YThe Economy§!\nWhich economic order does the united state have?\n\n§YSocial Market Economy§! (western line): The Deutschmark, private property and free prices - the GDR's combines are privatised.\n§YA Mixed Economy§! (compromise): Key industries, banks and land stay public; the rest is market. A 'third way' between the systems.\n§YPlanned Economy§! (eastern line): Central planning, people's enterprises, prices set by the state - the Federal Republic's industry is nationalised."
 cwgg_u_ch_3_n:0 "3. The Alliance"
 cwgg_u_ch_3_ok_1:0 "§GAgreed:§! In NATO"
 cwgg_u_ch_3_ok_2:0 "§GAgreed:§! Armed Neutrality"
 cwgg_u_ch_3_ok_3:0 "§GAgreed:§! In the Warsaw Pact"
 cwgg_u_ch_3_s:0 "[U_Ch3]"
 cwgg_u_ch_3_tt:0 "§YThe Alliance§!\nIn which alliance - if any - does the united Germany stand?\n\n§YIn NATO§! (western line): The united Germany stays in NATO; Soviet troops leave the East.\n§YArmed Neutrality§! (compromise): Germany leaves both blocs: an army of its own, no foreign troops, guaranteed by the Four Powers.\n§YIn the Warsaw Pact§! (eastern line): The united Germany joins the Warsaw Treaty Organisation; American troops leave the West."
 cwgg_u_ch_4_n:0 "4. The Capital"
 cwgg_u_ch_4_ok_1:0 "§GAgreed:§! Bonn, Federal"
 cwgg_u_ch_4_ok_2:0 "§GAgreed:§! Berlin, Federal"
 cwgg_u_ch_4_ok_3:0 "§GAgreed:§! Berlin, Centralised"
 cwgg_u_ch_4_s:0 "[U_Ch4]"
 cwgg_u_ch_4_tt:0 "§YThe Capital§!\nWhere does the united Germany govern from - and how centralised is it?\n\n§YBonn, Federal§! (western line): Government and parliament stay on the Rhine; the GDR is divided into Länder again.\n§YBerlin, Federal§! (compromise): Berlin becomes the capital of a federal Germany; the eastern Länder are restored.\n§YBerlin, Centralised§! (eastern line): Berlin governs a centralised state; the Länder become administrative districts."
 cwgg_u_ch_5_n:0 "5. The Borders"
 cwgg_u_ch_5_ok_1:0 "§GAgreed:§! Reserve the Peace Treaty"
 cwgg_u_ch_5_ok_2:0 "§GAgreed:§! The Oder-Neisse Line, Final"
 cwgg_u_ch_5_ok_3:0 "§GAgreed:§! Border and Peace Treaty"
 cwgg_u_ch_5_s:0 "[U_Ch5]"
 cwgg_u_ch_5_tt:0 "§YThe Borders§!\nWhat becomes of the Oder-Neisse line and of a peace treaty for Germany?\n\n§YReserve the Peace Treaty§! (western line): The border question stays open until a peace treaty - as the Federal Constitutional Court demands.\n§YThe Oder-Neisse Line, Final§! (compromise): The united Germany recognises its eastern border for ever in a treaty with Poland.\n§YBorder and Peace Treaty§! (eastern line): A formal peace treaty with the Four Powers and recognition of every post-war border."
