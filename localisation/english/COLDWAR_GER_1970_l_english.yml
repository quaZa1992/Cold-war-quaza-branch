 cwgg_rv_dlev_grenze_tt:0 "§YBorder Regime§!: level §Y[?cwgg_dhebel_grenze|0]§!/3\nOrder to shoot, SM-70 spring guns, mines and dogs."
 cwgg_rv_dlev_stasi_tt:0 "§YStasi and HVA§!: level §Y[?cwgg_dhebel_stasi|0]§!/3\nSpies in Bonn's ministries, Romeos in its secretariats, ears on its channels."
 cwgg_rv_dlev_transit_tt:0 "§YTransit Routes§!: level §Y[?cwgg_dhebel_transit|0]§!/3\nHarassment on the autobahns, closures of the access routes to West Berlin."
