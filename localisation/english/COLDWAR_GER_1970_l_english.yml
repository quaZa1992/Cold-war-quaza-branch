 cwgg_sec_tg_usforces_tt:0 "§YUS Forces§!\nUS Army bases and commanders.\n\nPreferred by generation 1 / 2 / 3: 3 / 2 / 4.\nA protection detail halves the RAF's planning speed here and foils §G65%§! of attacks (§G+5%§! each for BKA levels 2 and 3).\n\n§YOnly a target while US divisions are stationed in a West German state§! (checked every month). Without them the RAF plans nothing here and a protection detail is released."
