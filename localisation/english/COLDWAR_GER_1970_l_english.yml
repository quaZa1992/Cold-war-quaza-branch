 cwgg_rv_st_allies:0 "Call in the Allies"
 cwgg_rv_st_allies_row:0 "§Y1 initiative§! - the Three Powers speak for Berlin (NATO members only)."
 cwgg_rv_st_allies_tt:0 "§YCall in the Allies§!\nAsk Washington, London and Paris to speak for Berlin and Germany as a whole. Needs NATO membership - and if Moscow is called too, the crisis is no longer ours.\n\nAgainst each answer of East Berlin:\n  East Berlin backs down: intensity -22\n  East Berlin stalls: intensity -8\n  East Berlin escalates: intensity +8\n  East Berlin calls on moscow: intensity +15\n  East Berlin makes a counter-offer: intensity -8\n\n§GThe right answer to:§! Transit Crisis, Missile Crisis (intensity §G-10§!).\n\nIt only costs anything when the round is resolved. Without enough initiative at that moment, Bonn waits and sees."
 cwgg_rv_st_deescalate:0 "De-escalate"
 cwgg_rv_st_deescalate_row:0 "§Y1 initiative§! - conciliatory signals; lowers intensity, invites pressure."
 cwgg_rv_st_deescalate_tt:0 "§YDe-escalate§!\nLower the temperature: conciliatory statements, a postponed visit, a quiet word in the ear of the Permanent Representation.\n\nAgainst each answer of East Berlin:\n  East Berlin backs down: intensity -30\n  East Berlin stalls: intensity -15\n  East Berlin escalates: intensity +8\n  East Berlin calls on moscow: intensity +0\n  East Berlin makes a counter-offer: intensity -22\n\n§GThe right answer to:§! Manoeuvre Crisis (intensity §G-10§!).\n\nIt only costs anything when the round is resolved. Without enough initiative at that moment, Bonn waits and sees."
 cwgg_rv_st_firm:0 "Stand Firm"
 cwgg_rv_st_firm_row:0 "§Y1 initiative, 10 political power§! - hold the line without adding pressure."
 cwgg_rv_st_firm_tt:0 "§YStand Firm§!\nMake clear that Bonn will not give way - without adding new pressure of its own.\n\nAgainst each answer of East Berlin:\n  East Berlin backs down: intensity -15\n  East Berlin stalls: intensity +8\n  East Berlin escalates: intensity +22\n  East Berlin calls on moscow: intensity +22\n  East Berlin makes a counter-offer: intensity +8\n\n§GThe right answer to:§! Border Incident, Recognition Crisis, Elbe Border Dispute (intensity §G-10§!).\n\nIt only costs anything when the round is resolved. Without enough initiative at that moment, Bonn waits and sees."
 cwgg_rv_st_mobilise:0 "Prepare Mobilisation"
 cwgg_rv_st_mobilise_row:0 "§Y3 initiative§! - raise readiness: deters escalation - and escalates."
 cwgg_rv_st_mobilise_tt:0 "§YPrepare Mobilisation§!\nRaise readiness and say so. Deters escalation - and escalates.\n\nAgainst each answer of East Berlin:\n  East Berlin backs down: intensity -22\n  East Berlin stalls: intensity +15\n  East Berlin escalates: intensity +45\n  East Berlin calls on moscow: intensity +45\n  East Berlin makes a counter-offer: intensity +22\n\nIt only costs anything when the round is resolved. Without enough initiative at that moment, Bonn waits and sees."
 cwgg_rv_st_pressure:0 "Counter-Pressure"
 cwgg_rv_st_pressure_row:0 "§Y2 initiative§! - use the lever that bites in this crisis."
 cwgg_rv_st_pressure_tt:0 "§YCounter-Pressure§!\nUse the lever that hurts East Berlin most in this crisis. Strong if the lever is strong, a bluff if it is not.\n\nAgainst each answer of East Berlin:\n  East Berlin backs down: intensity -15\n  East Berlin stalls: intensity +8\n  East Berlin escalates: intensity +38\n  East Berlin calls on moscow: intensity +38\n  East Berlin makes a counter-offer: intensity +15\n\n§GThe right answer to:§! Dissident Crisis (intensity §G-10§!).\n\nIt only costs anything when the round is resolved. Without enough initiative at that moment, Bonn waits and sees."
 cwgg_rv_st_secret:0 "Secret Channel"
 cwgg_rv_st_secret_row:0 "§Y2 initiative§! - settle it quietly through an open channel."
 cwgg_rv_st_secret_tt:0 "§YSecret Channel§!\nSettle it quietly through an open channel. Effective, but the Stasi listens on every line it can reach.\n\nAgainst each answer of East Berlin:\n  East Berlin backs down: intensity -38\n  East Berlin stalls: intensity -22\n  East Berlin escalates: intensity -8\n  East Berlin calls on moscow: intensity -15\n  East Berlin makes a counter-offer: intensity -30\n\n§GThe right answer to:§! Spy Affair, Embassy Refugees, Uprising in the GDR (intensity §G-10§!).\n\nIt only costs anything when the round is resolved. Without enough initiative at that moment, Bonn waits and sees."
 cwgg_rv_st_wait:0 "Wait and See"
 cwgg_rv_st_wait_row:0 "§GFree§! - costs nothing, signals little; East Berlin sets the pace."
 cwgg_rv_st_wait_tt:0 "§YWait and See§!\nLet the ministries handle it. Costs nothing and signals little - East Berlin sets the pace.\n\nAgainst each answer of East Berlin:\n  East Berlin backs down: intensity -8\n  East Berlin stalls: intensity +0\n  East Berlin escalates: intensity +15\n  East Berlin calls on moscow: intensity +15\n  East Berlin makes a counter-offer: intensity +0\n\nIt only costs anything when the round is resolved. Without enough initiative at that moment, Bonn waits and sees."
 cwgg_rv_stage_short_0:0 "Modus Vivendi"
 cwgg_rv_stage_short_1:0 "Coexistence"
 cwgg_rv_stage_short_2:0 "Tensions"
 cwgg_rv_stage_short_3:0 "Crisis"
 cwgg_rv_stage_short_4:0 "Confrontation"
 cwgg_rv_stage_short_5:0 "War Danger"
 cwgg_rv_stage_short_6:0 "War"
 cwgg_rv_stage_tt_0:0 "§Y0: Modus Vivendi§!\nTwo states have settled into a working relationship: visits, credits, treaties and a border that is quieter than it has ever been.\n\nStability +3%, war support -5%, consumer goods -1%, Cold War world tension -0.3 a month."
 cwgg_rv_stage_tt_1:0 "§Y1: Cool Coexistence§!\nCorrect, cautious and transactional. Neither side expects much, neither side wants trouble.\n\nStability +1%, war support +0%."
 cwgg_rv_stage_tt_2:0 "§Y2: Tensions§!\nHarsh words in Neues Deutschland and the Bundestag, incidents at the border, channels running cold.\n\nStability -2%, war support +3%, Cold War world tension +0.2 a month."
 cwgg_rv_stage_tt_3:0 "§Y3: Crisis§!\nA confrontation is under way. Every move is watched in Washington and Moscow.\n\nStability -4%, war support +6%, Cold War world tension +0.5 a month."
 cwgg_rv_stage_tt_4:0 "§Y4: Confrontation§!\nBoth states treat each other as enemies. Trade has halved, the armies are watching the border.\n\nStability -6%, war support +10%, consumer goods +2%, Cold War world tension +1.0 a month."
 cwgg_rv_stage_tt_5:0 "§Y5: War Danger§!\nTroops on alert on both sides of the Iron Curtain. One mistake could start a war in the middle of Europe.\n\nStability -8%, war support +15%, consumer goods +2%, factory output -5%, Cold War world tension +2.0 a month."
 cwgg_rv_stage_tt_6:0 "§Y6: War§!\nGerman soldiers are fighting Germans.\n\nStability -5%, war support +20%."
