 cwgg_rv_topbar_tt:0 "§YInner-German Relations§!\nStage: [RV_StageColored]\nClimate: §Y[?cwgg_klima|0]§! | Initiative: §Y[?cwgg_init_brd|0]§!/6\n[RV_CrisisLine]\n\nClick to open the window."
