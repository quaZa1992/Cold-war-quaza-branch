 COLDWAR_GER_1970_tt_dark_borders:0 "§RA war goal against the GDR.§! The Soviet Union and the Warsaw Pact will decide how to answer."
 COLDWAR_GER_1970_tt_dark_court:0 "§YThe Federal Constitutional Court will act.§! Whether the government obeys it is our decision."
 COLDWAR_GER_1970_tt_dark_open:0 "§YThe National Directorate§! can now be proclaimed."
 COLDWAR_GER_1970_tt_dark_restore:0 "The Bonn Republic returns: the Union forms a caretaker government, elections are restored, the Directorate's spirit is removed. NATO members decide whether to lift their measures."
 COLDWAR_GER_1970_tt_dark_seize:0 "§RThe Bonn Republic ends.§! The government passes to a National Directorate (NPD), elections are suspended.\n§RNATO members§! decide whether to suspend us, impose sanctions or - the three Western Allies - invoke their reserved rights.\n§RThe Soviet Union§! decides whether to alert its forces, impose sanctions or invoke the UN Charter's enemy-state clauses."
 COLDWAR_GER_1970_tt_dark_vote:0 "§YThe Bundestag can still stop us§! with a constructive vote of no confidence - and then the generals must choose."
 COLDWAR_GER_1970_tt_dark_warn:0 "§RThis is the first step on a path that can end the Bonn Republic. Other governments will notice.§!"
 COLDWAR_GER_1970_tt_ddr_close:0 "Costs §Y3§! initiative. Starts a §RTransit Crisis§! with the Federal Republic."
 COLDWAR_GER_1970_tt_ddr_credit:0 "The Federal Government decides whether to grant a credit."
 COLDWAR_GER_1970_tt_ddr_goodwill:0 "Costs §Y2§! initiative. Climate §G+6§!; our levers §YBorder Regime§! and §YCompulsory Exchange§! §R-1§!."
 COLDWAR_GER_1970_tt_ddr_grenze:0 "Costs §Y2§! initiative. Our lever §YBorder Regime§! §G+1§!, escalation pressure §R+8§!."
 COLDWAR_GER_1970_tt_ddr_hva:0 "Costs §Y2§! initiative. Stasi penetration of Bonn §R+5§!."
 COLDWAR_GER_1970_tt_ddr_moscow_bless:0 "Unity talks: the Kremlin grows more willing to accept one German state (§G+20§! goodwill)."
 COLDWAR_GER_1970_tt_ddr_recog:0 "Costs §Y2§! initiative. Our recognition §G+4§!, climate §R-3§!. While Bonn still insists on its legal position, this starts a §YRecognition Crisis§!."
 COLDWAR_GER_1970_tt_ddr_transit:0 "Costs §Y2§! initiative. Climate §R-5§!, escalation pressure §R+12§!, West Berlin's access §R-5§!."
 COLDWAR_GER_1970_tt_ddr_zwang:0 "Costs §Y2§! initiative. Our lever §YCompulsory Exchange§! §G+1§!, climate §R-6§!."
 COLDWAR_GER_1970_tt_deport:0 "§RHalf of the refugees still in Germany (about §Y[?imp_costly_refugees_k|0]k§! people) are deported at once; every month afterwards, another 4% are sent back into the international refugee pool.§!"
 COLDWAR_GER_1970_tt_dev_1:0 "Starts an Imperia §YConstruction Assistance§! programme if assistance capacity allows; otherwise the political power is refunded."
 COLDWAR_GER_1970_tt_dev_2:0 "Starts an Imperia §YTechnical Mission§! programme if assistance capacity allows; otherwise the political power is refunded."
 COLDWAR_GER_1970_tt_dev_4:0 "Starts an Imperia §YProductivity Mission§! programme if assistance capacity allows; otherwise the political power is refunded."
 COLDWAR_GER_1970_tt_dhebel_grenze_down_1:0 "East Berlin's lever §YBorder Regime§!: -1 level"
 COLDWAR_GER_1970_tt_dhebel_transit_down_1:0 "East Berlin's lever §YTransit Routes§!: -1 level"
 COLDWAR_GER_1970_tt_druck_up_10:0 "Escalation pressure: §R+10§!"
