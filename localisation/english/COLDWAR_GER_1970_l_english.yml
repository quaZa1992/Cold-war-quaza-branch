 cwgg_rv_rr_counter:0 "Our course: §Y[RV_LastStance]§!. East Berlin has made a counter-offer through the back channels: the crisis could end - for a price. Intensity changed by §Y[?cwgg_last_dint|0]§!."
 cwgg_rv_rr_escalate:0 "Our course: §Y[RV_LastStance]§!. East Berlin has escalated. New measures, sharper words - and the world is watching what Bonn does next. Intensity changed by §Y[?cwgg_last_dint|0]§!."
 cwgg_rv_rr_moscow:0 "Our course: §Y[RV_LastStance]§!. East Berlin has called on Moscow. The Soviet ambassador has delivered a note of his own. Intensity changed by §Y[?cwgg_last_dint|0]§!."
 cwgg_rv_rr_stall:0 "Our course: §Y[RV_LastStance]§!. East Berlin is playing for time: no concessions, no new demands, a great many statements. Intensity changed by §Y[?cwgg_last_dint|0]§!."
 cwgg_rv_rr_yield:0 "Our course: §Y[RV_LastStance]§!. East Berlin has backed down a step. The border troops are less zealous, the tone of Neues Deutschland milder. Intensity changed by §Y[?cwgg_last_dint|0]§!."
