 COLDWAR_GER_1970_trg_d2e182552b:0 "The SPD is in the federal government."
 COLDWAR_GER_1970_trg_d5c35836f6:0 "The Munich Olympics attack has happened or after 25 September 1972."
 COLDWAR_GER_1970_trg_d8286679d3:0 "[NIC.GetName] takes part in the Cold War system."
 COLDWAR_GER_1970_trg_ddffc7f6e1:0 "Inner-German rapprochement is above 45."
 COLDWAR_GER_1970_trg_dee9b9d95f:0 "The reception camps have been expanded."
 COLDWAR_GER_1970_trg_df93b77e47:0 "A militant far-right group operates unchecked."
 COLDWAR_GER_1970_trg_dff0e306ac:0 "The GDR regime has crushed the protests."
 COLDWAR_GER_1970_trg_e1127c2cd9:0 "The FDP is not in the federal government."
 COLDWAR_GER_1970_trg_e168b4716a:0 "After 31 December 1981 or the 'Wende' has opened a new political era."
 COLDWAR_GER_1970_trg_e290d35205:0 "No election campaign is under way."
 COLDWAR_GER_1970_trg_e6146e5f6c:0 "The asylum debate is raging."
 COLDWAR_GER_1970_trg_e6caab6791:0 "No inner-German crisis is under way and East Berlin has at least §Y3§! initiative and East Berlin's lever §YTransit Routes§! is at level 2 or higher and no inner-German crisis has ended within the last year."
 COLDWAR_GER_1970_trg_e6eae7655d:0 "After 1 January 1990 or 'The Guest Workers Stay' is completed."
 COLDWAR_GER_1970_trg_ecaf9d53f9:0 "It is not the case that recruitment stop."
 COLDWAR_GER_1970_trg_ef5587a3d8:0 "Dark defied."
 COLDWAR_GER_1970_trg_f145f15168:0 "Franz Josef Strauß leads the Union."
 COLDWAR_GER_1970_trg_f298435dba:0 "The §YTraffic, Post and Travel Agreements§! is in force."
 COLDWAR_GER_1970_trg_f33418c642:0 "The SPD does not lead the federal government."
 COLDWAR_GER_1970_trg_f3483929e5:0 "Moscow has refused German unity or hardliners have seized power in Moscow."
 COLDWAR_GER_1970_trg_f3db3c5474:0 "The inner-German climate is above §Y59§!."
 COLDWAR_GER_1970_trg_f9312082e6:0 "Oskar Lafontaine does not lead the SPD."
 COLDWAR_GER_1970_trg_fa3948b3bf:0 "The Federal Republic has refused the missile deployment."
 COLDWAR_GER_1970_trg_fd65f45d20:0 "[CRO.GetName] exists or [SLV.GetName] exists."
 COLDWAR_GER_1970_trg_fd996a2642:0 "'The Energy Programme' is completed or the energy-saving campaign has been launched."
 COLDWAR_GER_1970_tripartite_schools:0 "Achievement Must Pay Off"
 COLDWAR_GER_1970_tripartite_schools_desc:0 "The three-tier school is a German pride: the Gymnasium for the academic few, the Realschule for the clerks and technicians, the dual apprenticeship for the skilled workers who make 'Made in Germany' a promise. Bavaria and Baden-Württemberg defend it as the secret of their success. Achievement, they say, must pay off - and it starts at ten."
 COLDWAR_GER_1970_tt_3pct:0 "From the next election, parties need only §Y3%§! to enter the Bundestag."
 COLDWAR_GER_1970_tt_accession:0 "The Four Powers must now agree in §YTwo Plus Four§! talks."
 COLDWAR_GER_1970_tt_alarm:0 "§G75%§!: the alarm is recognised as an error. §R25%§!: war."
 COLDWAR_GER_1970_tt_arms_demand:0 "Revenue follows the Imperia §Yarms market§! (Arms Demand and wars): between §Y60%§! and §Y260%§! of the base sale."
 COLDWAR_GER_1970_tt_av_dark_end:0 "Stability below §Y20%§!, or the resistance has grown strong (§Y60§!+), or we are at war"
 COLDWAR_GER_1970_tt_av_dark_entry:0 "The far right (NPD, DVU, Republikaner) polls above §Y6%§! together, or the right-wing terror threat is above §Y30§!"
 COLDWAR_GER_1970_tt_av_dark_erosion:0 "Erosion of the Republic is at least §Y60§!"
 COLDWAR_GER_1970_tt_av_dark_rs:0 "Rule-of-law credibility is below §Y35§!"
 COLDWAR_GER_1970_tt_av_dark_sec:0 "The security state is above §Y65§!"
 COLDWAR_GER_1970_tt_av_dark_vote:0 "The far right won at least §Y15%§! together in the §Ylast Bundestag election§!"
 COLDWAR_GER_1970_tt_blackmail:0 "The state has shown it can be blackmailed. Future kidnappings become §Rmore likely§!."
 COLDWAR_GER_1970_tt_bomb_lift:0 "The Federal Republic no longer renounces nuclear weapons: the §Ynuclear weapon special projects§! become available."
 COLDWAR_GER_1970_tt_brotherly:0 "§RWar with the GDR begins.§! The Soviet Union joins if its guarantee for the GDR is still at least §Y50§!."
 COLDWAR_GER_1970_tt_bundesrat:0 "The balance of the Bundesrat shifts. Union share now: §Y[?cwger_bundesrat_union|0]§!%."
 COLDWAR_GER_1970_tt_bundesrat_deal:0 "The §RBundesrat blockade§! penalty to political power is lifted for a year."
 COLDWAR_GER_1970_tt_buy_deputy:0 "The government gains §Gone vote§!. §R30%§!: it leaks (scandal pressure §R+15§!)."
 COLDWAR_GER_1970_tt_capital:0 "Parliament and government move to Berlin; Bonn keeps ministries as a 'federal city'."
 COLDWAR_GER_1970_tt_ceasefire:0 "East Berlin accepts if the war is going badly for one side or Moscow's guarantee has weakened below §Y50§!."
 COLDWAR_GER_1970_tt_cf_majority:0 "CDU/CSU and FDP won more than half of the vote at the last election"
 COLDWAR_GER_1970_tt_change_1982:0 "The FDP debates the §YLambsdorff paper§! - and whether to change sides."
 COLDWAR_GER_1970_tt_coalition_committee:0 "The FDP course moves §Y10§! points towards the chancellor's party."
 COLDWAR_GER_1970_tt_confed_ddr:0 "The Federal Republic may now choose a §Yconfederation§!."
 COLDWAR_GER_1970_tt_corruption_risk_30:0 "§R30%§! chance that corruption rises one level."
 COLDWAR_GER_1970_tt_corruption_risk_40:0 "§R40%§! chance that corruption rises one level."
 COLDWAR_GER_1970_tt_corruption_risk_60:0 "§R60%§! chance that corruption rises one level."
 COLDWAR_GER_1970_tt_countdown:0 "§RA countdown of three months begins.§! Every month East Berlin may give way - or we may. If nobody does, the Kremlin will usually pull its ally back from the edge - unless East Berlin or Moscow decide that the time for patience is over. Then it is war."
 COLDWAR_GER_1970_tt_crackdown:0 "The outcome depends on §YMoscow's guarantee§!, §YSED control§! and the size of the §Yopposition§!."
