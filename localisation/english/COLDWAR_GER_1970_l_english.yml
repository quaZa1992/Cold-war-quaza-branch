 cwgg_sec_policy_txt:0 "Counter-espionage protects Bonn's channels to East Berlin as much as its secrets. The exit programme, the crown witness rule and the Kinkel initiative drain the milieu - the road that led to the RAF's declaration of 1992 and its dissolution in 1998."
 cwgg_sec_prot_btn_business:0 "[SEC_ProtBtn_business]"
 cwgg_sec_prot_btn_embassy:0 "[SEC_ProtBtn_embassy]"
 cwgg_sec_prot_btn_infra:0 "[SEC_ProtBtn_infra]"
 cwgg_sec_prot_btn_justice:0 "[SEC_ProtBtn_justice]"
 cwgg_sec_prot_btn_politics:0 "[SEC_ProtBtn_politics]"
 cwgg_sec_prot_btn_usforces:0 "[SEC_ProtBtn_usforces]"
 cwgg_sec_prot_off:0 "Withdraw"
 cwgg_sec_prot_on:0 "Protect"
 cwgg_sec_prot_tt:0 "Assign or withdraw a protection detail (§Y10§! political power to assign). Details: §Y[?cwsec_used|0]§! of §Y[?cwsec_slots|0]§!. More come from the focus tree."
 cwgg_sec_prot_txt:0 "The RAF picks its targets by generation: the first fought the 'imperialist' Americans and the Springer press, the second the justice system and business to free its prisoners, the third the 'military-industrial complex'. Planning speed grows with the active cadre and the milieu and falls with every BKA level. With BKA level 1 we know where an attack is coming; from level 2 we see how far it has got."
 cwgg_sec_r_cadre:0 "Active cadre"
 cwgg_sec_r_cadre_v:0 "§Y[?cwger_raf_cadre|0]§!"
 cwgg_sec_r_milieu:0 "Sympathiser milieu"
 cwgg_sec_r_milieu_v:0 "§Y[?cwger_raf_milieu|0]§!"
 cwgg_sec_r_prisoners:0 "Prisoners"
 cwgg_sec_r_prisoners_v:0 "§Y[?cwger_raf_prisoners|0]§!"
 cwgg_sec_raf_tt:0 "§YThe RAF§!\nThe §Yactive cadre§! recruits from the §Ysympathiser milieu§!; repression and a weak rule of law feed the milieu, exit offers and calm drain it. Kidnappings need §Yprisoners§! to free. A generation ends when its leaders are in prison - the next one fights to free them."
 cwgg_sec_reg_association:0 "Association"
 cwgg_sec_reg_association_tt:0 "§YAssociation§!\nHeld together in small groups, as the prisoners demand. The movement calms down - and the prisoners can coordinate with the commandos outside.\n\nChanging the regime costs §Y25§! political power and is possible every six months."
 cwgg_sec_reg_isolation:0 "Isolation"
 cwgg_sec_reg_isolation_tt:0 "§YIsolation§!\nHigh-security isolation: the prisoners cannot organise - and the movement outside calls it torture. Milieu grows, hunger strikes come faster.\n\nChanging the regime costs §Y25§! political power and is possible every six months."
 cwgg_sec_reg_normal:0 "Normal Regime"
 cwgg_sec_reg_normal_tt:0 "§YNormal Regime§!\nOrdinary rules for high-security prisoners.\n\nChanging the regime costs §Y25§! political power and is possible every six months."
 cwgg_sec_right_label:0 "Rote Armee Fraktion"
 cwgg_sec_right_value:0 "[SEC_ThreatColored]"
 cwgg_sec_right_value_tt:0 "§YRote Armee Fraktion§!\nThe threat from the Red Army Faction and the wider left-wing underground. It grows with the RAF's active cadre and its sympathiser milieu - the students who lend a flat, the lawyers who carry a message, the professors who sign the open letters - and with the Movement 2 June and the Revolutionary Cells while they still exist."
 cwgg_sec_staff_cd:0 "§RDEADLINE IN [?cwsec_ult_days|0] DAYS§!"
 cwgg_sec_staff_none:0 "No hostage is held. When the RAF kidnaps someone and the government refuses to exchange prisoners, the crisis staff runs the ultimatum from here."
 cwgg_sec_staff_odds:0 "GSG 9 tier §Y[?cwger_gsg9_tier|0]§!, BKA level §Y[?cwger_bka_level|0]§!. A storm succeeds in about §Y[?cwsec_g_storm|0]%§! of cases. Each day bought brings the hiding place closer."
