 cwgg_rv_bnd_counter:0 "East Berlin needs money (§Ycounter-offer§!)"
 cwgg_rv_bnd_esc:0 "the hardliners set the tone (§Rescalates§!)"
 cwgg_rv_bnd_human:0 "§gthe Politburo keeps its cards close - no reliable forecast§!"
 cwgg_rv_bnd_stall:0 "East Berlin will play for time (§Ystalls§!)"
 cwgg_rv_bnd_yield:0 "East Berlin is looking for a way out (§Gbacks down§!)"
 cwgg_rv_btn_alert_down:0 "Stand Down"
 cwgg_rv_btn_alert_down_tt:0 "§YLower Alert Level§!\nStand the forces down by one level.\nCosts nothing; climate §G+2§!.\n[RV_Avail_alert_down]"
 cwgg_rv_btn_alert_up:0 "Raise Alert"
 cwgg_rv_btn_alert_up_tt:0 "§YRaise Alert Level§!\nPut the Bundeswehr on a higher state of readiness. Each level speeds up mobilisation and hardens war support: level 1 §G+10%§! / §G+2%§!, level 2 §G+25%§! / §G+5%§!, level 3 §G+50%§! / §G+10%§!.\n\nCost: §Y2 initiative§!. Can be repeated after 1 months.\nRequires: the stage Crisis for level 1, Confrontation for level 2, War Danger (or the focus §YPrepare the State of Defence§!) for level 3.\n[RV_Avail_alert_up]"
 cwgg_rv_btn_church:0 "Church Aid"
 cwgg_rv_btn_church_tt:0 "§YAid for the Church Groups§!\nMoney, paper and photocopiers for the peace and environment groups sheltering under the Protestant church in the East.\n\nCost: §Y1 initiative, 25 political power§!. Can be repeated after 18 months.\nRequires: the church channel open.\n[RV_Avail_church]"
 cwgg_rv_btn_credit:0 "Billion Credit"
 cwgg_rv_btn_credit_tt:0 "§YThe Milliardenkredit§!\nA state-guaranteed bank loan of one billion marks for a GDR close to insolvency - in exchange for gestures at the border.\n\nCost: §Y2 initiative, 50 political power§!. Once only.\nRequires: a CDU/CSU chancellor or the Schalck-Golodkowski channel open; the GDR's hard-currency shortage above 40; once only.\n[RV_Avail_credit]"
 cwgg_rv_btn_escape:0 "Escape Help"
 cwgg_rv_btn_escape_tt:0 "§YTolerate Escape Helpers§!\nLook away while students and professional smugglers dig tunnels and fit out cars with hidden compartments.\n\nCost: §Y1 initiative§!. Can be repeated after 12 months.\nRequires: -.\n[RV_Avail_escape]"
 cwgg_rv_btn_freeze:0 "Freeze"
 cwgg_rv_btn_freeze_tt:0 "§YFreeze Credits and Deliveries§!\nSuspend credits and slow deliveries in inner-German trade until East Berlin moves.\n\nCost: §Y2 initiative, 25 political power§!. Can be repeated after 24 months.\nRequires: the trade lever above 0.\n[RV_Avail_freeze]"
 cwgg_rv_btn_freikauf:0 "Buy Free"
 cwgg_rv_btn_freikauf_tt:0 "§YBuy Prisoners Free§!\nPay for the release of political prisoners through the lawyers' channel.\n\nCost: §Y1 initiative§!. Can be repeated after 12 months.\nRequires: the Vogel - Stange channel open.\n[RV_Avail_freikauf]"
 cwgg_rv_btn_mandate:0 "Mandate"
 cwgg_rv_btn_mandate_tt:0 "§YReassert the Sole Mandate§!\nRemind the world that only the Federal Republic speaks for Germany. Third states that recognise the GDR will hear from Bonn.\n\nCost: §Y1 initiative, 25 political power§!. Can be repeated after 12 months.\nRequires: no Basic Treaty yet.\n[RV_Avail_mandate]"
 cwgg_rv_btn_manoeuvre:0 "Manoeuvres"
 cwgg_rv_btn_manoeuvre_tt:0 "§YExercises Near the Border§!\nLarge Bundeswehr and NATO exercises along the inner-German border: a signal to East Berlin and Moscow.\n\nCost: §Y2 initiative, 25 political power§!. Can be repeated after 12 months.\nRequires: the focus §YForward Defence§! and Bundeswehr divisions massed at the border (at least a concentration).\n[RV_Avail_manoeuvre]"
 cwgg_rv_btn_media:0 "Media Push"
 cwgg_rv_btn_media_tt:0 "§YMedia Offensive§!\nMore airtime for the GDR on RIAS and Deutsche Welle, more correspondents in East Berlin, more pictures of what happens at the border.\n\nCost: §Y1 initiative, 25 political power§!. Can be repeated after 12 months.\nRequires: the media lever above 0.\n[RV_Avail_media]"
 cwgg_rv_btn_raid:0 "Stasi Raid"
 cwgg_rv_btn_raid_tt:0 "§YRoll Up Stasi Networks§!\nA coordinated strike by the Federal Office for the Protection of the Constitution and the Federal Prosecutor against the HVA's networks.\n\nCost: §Y2 initiative, 50 political power§!. Can be repeated after 12 months.\nRequires: -.\n[RV_Avail_raid]"
 cwgg_rv_btn_swing:0 "Raise Swing"
 cwgg_rv_btn_swing_tt:0 "§YRaise the Swing§!\nOffer a larger interest-free overdraft in inner-German trade, delivered as an Imperia §YConsumer Supply Credits§! programme if East Berlin accepts.\n\nCost: §Y1 initiative, 25 political power§!. Can be repeated after 36 months.\nRequires: the Swing is unlocked or the hard-currency lever is above 0; the GDR's border is still closed.\n[RV_Avail_swing]"
 cwgg_rv_btn_transit:0 "Transit Sum"
 cwgg_rv_btn_transit_tt:0 "§YTransit Lump Sum§!\nPay East Berlin a fixed annual sum for unhindered transit to West Berlin.\n\nCost: §Y1 initiative§!. Can be repeated after 61 months.\nRequires: the Berlin settlement in force.\n[RV_Avail_transit]"
