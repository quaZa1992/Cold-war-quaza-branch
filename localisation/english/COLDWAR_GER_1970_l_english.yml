 cwgg_rv_al_brd_eff:0 "[RV_Mob_brd]"
 cwgg_rv_al_brd_lbl:0 "Bundeswehr: alert level §Y[?cwgg_mob_brd|0]§!"
 cwgg_rv_al_ddr_eff:0 "[RV_Mob_ddr]"
 cwgg_rv_al_ddr_lbl:0 "National People's Army: alert level §Y[?cwgg_mob_ddr|0]§!"
 cwgg_rv_al_tt:0 "§YAlert levels§! (0-3) of the Bundeswehr and the National People's Army. Each step speeds up mobilisation and hardens war support:\n  level 1: mobilisation speed +10%, war support +2%\n  level 2: mobilisation speed +25%, war support +5%\n  level 3: mobilisation speed +50%, war support +10%\n\nHigher readiness deters the other side from escalating in a crisis and feeds the peace movement. Both armies on level 3 means §Rwar danger§!. Bonn raises its level in the §YLevers§! tab; a human East Berlin uses its decisions."
 cwgg_rv_alert_txt:0 "Alert: Bonn §Y[?cwgg_mob_brd|0]§! · NVA §Y[?cwgg_mob_ddr|0]§!"
 cwgg_rv_ans_counter:0 "§Ymakes a counter-offer§!"
 cwgg_rv_ans_escalate:0 "§Yescalates§!"
 cwgg_rv_ans_moscow:0 "§Ycalls on moscow§!"
 cwgg_rv_ans_stall:0 "§Ystalls§!"
 cwgg_rv_ans_yield:0 "§Ybacks down§!"
 cwgg_rv_aufm_0:0 "§Gpeacetime garrisons§!"
 cwgg_rv_aufm_1:0 "§Yconcentration§!"
 cwgg_rv_aufm_2:0 "§Rdeployment in force§!"
 cwgg_rv_aufm_3:0 "§Rmassive deployment§!"
 cwgg_rv_aufm_brd:0 "Troops at the border: §Y[?cwgg_aufm_brd_div|0]§! div. - [RV_Aufm_brd]"
 cwgg_rv_aufm_ddr:0 "Troops at the border: §Y[?cwgg_aufm_ddr_div|0]§! div. - [RV_Aufm_ddr]"
 cwgg_rv_aufm_tt:0 "§YTroops at the inner-German border§!\nThe divisions each side has stationed in its border states - Schleswig-Holstein, Lower Saxony, Hesse, Franconia, Bavaria and West Berlin on our side; Mecklenburg, Saxony-Anhalt, Thuringia, Saxony, Brandenburg and East Berlin on theirs. The count is updated whenever this window refreshes; its effects apply once a month.\n\n  concentration (4+ divisions): escalation pressure +3, climate -1 a month\n  deployment in force (10+ divisions): escalation pressure +6, climate -2, Cold War world tension +0.25 a month\n  massive deployment (20+ divisions): escalation pressure +10, climate -4, Cold War world tension +0.5 a month\n\nA deployment in force by either side keeps the ladder at §RCrisis§! or worse; both sides deployed means §RConfrontation§!, both massively deployed and on alert means §Rwar danger§!. Border exercises, a first strike or brotherly help need our troops there."
