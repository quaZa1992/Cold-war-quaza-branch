 cwgg_rv_ch_bahr_state:0 "[RV_Chan_bahr]"
 cwgg_rv_ch_bahr_tt:0 "§YBahr - Kohl§!\nState secretaries Egon Bahr and Michael Kohl: the channel through which the treaties of the early 1970s were written.\n\nAn open channel adds §G+2§! to the climate base, allows the §YSecret Channel§! in crises and speeds up negotiations. While it is open the Stasi may tap it; a strained channel counts half until the line is secure again (a year, or a raid on the Stasi networks). Closing a channel costs §R3§! climate."
 cwgg_rv_ch_draht_state:0 "[RV_Chan_draht]"
 cwgg_rv_ch_draht_tt:0 "§YHotline to Moscow§!\nA direct line between the chancellery and the Kremlin, opened by the Moscow Treaty.\n\nAn open channel adds §G+2§! to the climate base, allows the §YSecret Channel§! in crises and speeds up negotiations. While it is open the Stasi may tap it; a strained channel counts half until the line is secure again (a year, or a raid on the Stasi networks). Closing a channel costs §R3§! climate."
 cwgg_rv_ch_kirche_state:0 "[RV_Chan_kirche]"
 cwgg_rv_ch_kirche_tt:0 "§YChurch Channel§!\nThe Protestant churches of both states, still bound together in conferences and partnerships.\n\nAn open channel adds §G+2§! to the climate base, allows the §YSecret Channel§! in crises and speeds up negotiations. While it is open the Stasi may tap it; a strained channel counts half until the line is secure again (a year, or a raid on the Stasi networks). Closing a channel costs §R3§! climate."
 cwgg_rv_ch_koko_state:0 "[RV_Chan_koko]"
 cwgg_rv_ch_koko_tt:0 "§YSchalck-Golodkowski§!\nCommercial Coordination: the GDR's hard-currency empire, a door to East Berlin's most pressing needs.\n\nAn open channel adds §G+2§! to the climate base, allows the §YSecret Channel§! in crises and speeds up negotiations. While it is open the Stasi may tap it; a strained channel counts half until the line is secure again (a year, or a raid on the Stasi networks). Closing a channel costs §R3§! climate."
 cwgg_rv_ch_sv_state:0 "[RV_Chan_sv]"
 cwgg_rv_ch_sv_tt:0 "§YPermanent Representation§!\nNot an embassy - the Federal Republic does not recognise the GDR as foreign - but a mission in East Berlin all the same.\n\nAn open channel adds §G+2§! to the climate base, allows the §YSecret Channel§! in crises and speeds up negotiations. While it is open the Stasi may tap it; a strained channel counts half until the line is secure again (a year, or a raid on the Stasi networks). Closing a channel costs §R3§! climate."
 cwgg_rv_ch_vogel_state:0 "[RV_Chan_vogel]"
 cwgg_rv_ch_vogel_tt:0 "§YVogel - Stange§!\nLawyers Wolfgang Vogel and Jürgen Stange: the quiet market in prisoners and family reunions.\n\nAn open channel adds §G+2§! to the climate base, allows the §YSecret Channel§! in crises and speeds up negotiations. While it is open the Stasi may tap it; a strained channel counts half until the line is secure again (a year, or a raid on the Stasi networks). Closing a channel costs §R3§! climate."
