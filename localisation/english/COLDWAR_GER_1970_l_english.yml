 cwgg_sec_hunger_tt:0 "§YHunger strike§!\nGrows while three or more leaders are in prison - fast in isolation, slowly under the normal regime; association ends it. At §R80§! a prisoner may die, which hands the movement a martyr."
 cwgg_sec_hunt_txt:0 "Every month the BKA gains trace on everyone still at large; the sympathiser milieu and the Stasi's shelter work against it. Arrests also happen by themselves when the BKA is strong. When a generation's leaders are behind bars, the next generation forms - and fights to free them."
