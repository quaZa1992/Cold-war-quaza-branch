 COLDWAR_GER_1970_tt_fptp:0 "From the next election, parties need §Y15%§! to enter the Bundestag (approximating single-member constituencies)."
 COLDWAR_GER_1970_tt_gc_2_3:0 "While the grand coalition governs, amendments to the Basic Law are within reach without paying the opposition's price."
 COLDWAR_GER_1970_tt_german_bomb:0 "§RWhen the nuclear bomb project is completed§!, Washington, Moscow, London and Paris will have to decide how to answer a German finger on the trigger - with sanctions, with isolation, or with the threat to disarm the Federal Republic by force."
