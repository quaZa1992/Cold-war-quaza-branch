 COLDWAR_GER_1970_tt_elected_president:0 "A popularly elected president is a counterweight in a constitutional crisis: §Gthe Bundestag is more likely to stop an emergency government§!."
 COLDWAR_GER_1970_tt_emergency_tied:0 "§GAn emergency government becomes much harder: the Bundestag is more likely to stop it.§!"
 COLDWAR_GER_1970_tt_energy_mission:0 "Prepares the §YEnergy Security§! mission for the first oil shock."
 COLDWAR_GER_1970_tt_energy_prog:0 "The energy pillar of the focus tree becomes more urgent."
 COLDWAR_GER_1970_tt_enquete:0 "Amendments to the Basic Law need §Ytwo thirds§! of the Bundestag as elected. Without them we must pay the opposition's price - or let them fall."
 COLDWAR_GER_1970_tt_enrich_nuclear:0 "Builds an §Yenrichment facility§! (needs nuclear technology - otherwise the nuclear energy project advances instead)."
 COLDWAR_GER_1970_tt_equidistance:0 "The Federal Republic leaves NATO and the Western bloc and becomes §Ynon-aligned§! in the Imperia Cold War system."
 COLDWAR_GER_1970_tt_erfurt:0 "Makes the treaty §YMeeting of the Heads of Government§! faster to conclude."
 COLDWAR_GER_1970_tt_euro_join:0 "From 1999 the D-Mark is replaced by the §Yeuro§! (MD currency system)."
