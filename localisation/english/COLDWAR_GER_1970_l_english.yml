 cwgg_rv_none:0 "-"
 cwgg_rv_none_txt:0 "There is no crisis between the two German states at the moment.\n\nCrises break out when the climate is bad and the escalation pressure high - or through events that nobody in Bonn controls: a mole unmasked, a missile decision, an exercise at the wrong moment, refugees in an embassy. Every six months a round is resolved and both sides choose a course. East Berlin answers in secret - weighing its leadership's nerve, its need for hard currency, Moscow's guarantee and the balance of force on the border.\n\nA crisis ends when its intensity falls to zero, freezes when it runs out of rounds, and goes to the brink at 100."
