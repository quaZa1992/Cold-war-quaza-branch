 cwgg_rv_d_hc:0 "Currency shortage §Y[?DDR.cwddr_hard_currency|0]§!   ·   dependence §Y[?DDR.cwddr_west_dependency|0]§!"
 cwgg_rv_d_rec:0 "Recognition §Y[?DDR.cwddr_recognition|0]§!   ·   SED control §Y[?DDR.cwddr_sed_control|0]§!"
 cwgg_rv_d_tt:0 "§YThe GDR's position§!\nRecognition grows with East Berlin's diplomacy and the treaties; SED control is the regime's grip on its people. The hard-currency shortage makes East Berlin open to money - and dependence on Bonn makes it vulnerable to a credit freeze."
 cwgg_rv_ddr_0:0 "§Rthe old guard, jealous of its own line§!"
