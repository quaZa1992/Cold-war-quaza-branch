 cwgg_u_pos_hint:0 "Our position: §Y[U_OurPos]§!. East Berlin's delegation reveals its own only when the round closes - guided by its leadership, its instructions from Moscow and how often this chapter has already failed."
 cwgg_u_propose:0 "Propose Talks"
 cwgg_u_propose_tt:0 "§YPropose Unity Talks§!\nOffer East Berlin formal negotiations on one German state. The Politburo will weigh its own survival, its dependence on Bonn's money and Moscow's line - a hardline leadership will almost certainly refuse.\n\nNeeds: three years of unbroken détente, climate 70, Modus Vivendi without a crisis, the Basic Treaty, the Permanent Representations and the traffic agreements in force plus culture or the state visit, the focus §YA European Peace Order§!, 3 initiative and 100 political power. After failed talks: three years' pause."
