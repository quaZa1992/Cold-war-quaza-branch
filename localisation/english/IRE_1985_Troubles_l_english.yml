# IMPERIA CW — Cold War: Integrated IRE 1985 Troubles — English localisation.
 ire_troubles.1.t: "A British Backchannel Request"
 ire_troubles.1.d: "London has asked for a discreet political channel on Northern Ireland. The request is not a treaty and not a public concession, but it would let officials exchange warnings, calm border incidents, and test whether the violence can be moved back into politics. Republican ministers would see this as collaboration with Westminster; a constitutional Irish cabinet would see it as leverage."
 ire_troubles.1.a: "Open the channel."
 ire_troubles.1.b: "Refuse Westminster's approach."

 ire_troubles.2.t: "An Anglo-Irish Dialogue Round"
 ire_troubles.2.d: "The British government wants a formal dialogue round on Northern Ireland. Garda liaison, cross-border information sharing, and a clearer Dublin voice in crisis management would make IRA logistics harder, but unionists will accuse London of giving the Republic a say over Ulster."
 ire_troubles.2.a: "Coordinate with London."
 ire_troubles.2.b: "Do not legitimise British control."

 ire_troubles.3.t: "The Hillsborough Framework"
 ire_troubles.3.d: "London has moved toward an Anglo-Irish framework. If Dublin accepts, the Republic gains a formal channel into Northern Irish security and political management. If Dublin rejects, the British plan loses its constitutional centre and republican networks will claim that pressure, not negotiation, forced the retreat."
 ire_troubles.3.a: "Sign on to the framework."
 ire_troubles.3.b: "Reject the framework."

 ire_troubles.4.t: "A Settlement Framework"
 ire_troubles.4.d: "British ministers are offering a broader constitutional settlement built around consent, Dublin consultation, and a gradual retreat from emergency logic. It is not reunification, but it can drain support from the armed campaign. A republican government may refuse to bless any bargain that leaves partition standing."
 ire_troubles.4.a: "Back the settlement track."
 ire_troubles.4.b: "No settlement without unity."
