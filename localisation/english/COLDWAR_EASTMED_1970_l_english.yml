 COLDWAR_GRE_1970_papadopoulos_desc:0 "Junta government leader. No calendar overthrow."
 COLDWAR_GRE_1970_papanikolaou:0 "Alexandros Papanikolaou"
 COLDWAR_GRE_1970_papanikolaou_desc:0 "Tactical air command1971–73 (year-level start); air chief25November1973–23January1975. No army corps role."
 COLDWAR_GRE_1970_party_0_v0:0 "£generic_Western_Autocracy_small Technokrates tis syndesis me ti Dysi"
 COLDWAR_GRE_1970_party_0_v0_desc:0 "(Atlanticist Technocracy) - Western-Linked Technocrats (Greek: Technokrates tis syndesis me ti Dysi)\n\nEconomists of the Bank of Greece, diplomats and officers trained in the United States form a quiet network that values Greece's place in NATO above any particular regime. Some serve the colonels' government out of duty; others wait on the sidelines for a return to normality.\n\nThey see the association agreement with the European Economic Community, frozen since the coup, together with American aid and investment, as Greece's path to prosperity. After the regime's humiliating exit from the Council of Europe in December 1969, they hope for a controlled transition that keeps the alliance intact."
 COLDWAR_GRE_1970_party_0_v0_icon:0 "£generic_Western_Autocracy_small"
 COLDWAR_GRE_1970_party_10_v0:0 "£generic_Kingdom_small Salafites paradosiakoi"
 COLDWAR_GRE_1970_party_10_v0_desc:0 "(Salafi Monarchism) - Salafi Traditionalists (Greek: Salafites paradosiakoi)\n\nIn the Muslim villages of Rhodope and Xanthi, a few teachers and imams educated in Saudi Arabia promote a strict reading of Islam that rejects local customs and Sufi influences. They regard the Saudi monarchy as the model of a just Muslim state.\n\nTheir influence is slight, for the minority's religious life is dominated by the state-appointed muftis and by Turkish nationalist community leaders. Under a junta that distrusts the minority, they keep quietly to their schools and mosques, waiting for better times."
 COLDWAR_GRE_1970_party_10_v0_icon:0 "£generic_Kingdom_small"
 COLDWAR_GRE_1970_party_11_v0:0 "£generic_Caliphate_small Ypostiriktes tou khalifatou"
 COLDWAR_GRE_1970_party_11_v0_desc:0 "(Pan-Islamism) - Supporters of the Caliphate (Greek: Ypostiriktes tou khalifatou)\n\nOlder members of the Muslim minority of Western Thrace still remember the Ottoman caliphate. In the 1920s the region sheltered conservative Ottoman exiles hostile to Atatürk, and in a few families their conviction that the abolition of 1924 was a catastrophe lives on.\n\nThey speak of a single Muslim community standing above nations and borders. Politically marginal, the current is opposed both by the Kemalist-minded leaders of the minority and by the Greek authorities, and it survives mainly in mosques and private gatherings."
 COLDWAR_GRE_1970_party_11_v0_icon:0 "£generic_Caliphate_small"
 COLDWAR_GRE_1970_party_12_v0:0 "£muslim_brotherhood_small Mousoulmanoi metarrythmistes"
 COLDWAR_GRE_1970_party_12_v0_desc:0 "(Islamic Democracy) - Muslim Reformers (Greek: Mousoulmanoi metarrythmistes)\n\nAmong the Muslim minority of Western Thrace, a younger generation of teachers and professionals argues that faith and modern education are compatible. They want better minority schools, freely elected muftis and fair treatment in land, building permits and citizenship.\n\nTheir demands put them at odds with a regime that treats the minority as a security problem and with conservative clergy who fear change. They work through associations and newspapers in Komotini and Xanthi, waiting for the day when minority candidates can again stand for parliament."
 COLDWAR_GRE_1970_party_12_v0_icon:0 "£muslim_brotherhood_small"
 COLDWAR_GRE_1970_party_13_v0:0 "£generic_Neutral_Autocracy_small Dioikitikoi technokrates tis Athinas"
 COLDWAR_GRE_1970_party_13_v0_desc:0 "(Technocratic Statism) - Administrative Technocrats of Athens (Greek: Dioikitikoi technokrates tis Athinas)\n\nSenior civil servants of the ministries of coordination and finance, and the planners of the Centre of Planning and Economic Research, believe Greece can be modernized from above. Some serve the colonels, attracted by the regime's road building, tourism drive and generous credit.\n\nThey favour an administrative state independent of both Washington's dictates and the clientelism of the old parties. In 1970 they see themselves as the indispensable professionals any regime will need, and they are prepared to govern if soldiers and politicians alike fail."
 COLDWAR_GRE_1970_party_13_v0_icon:0 "£generic_Neutral_Autocracy_small"
 COLDWAR_GRE_1970_party_14_v0:0 "£generic_Neutral_conservatism_small Laikoi paradosiakoi"
 COLDWAR_GRE_1970_party_14_v0_desc:0 "(Rural Conservatism) - Popular Traditionalists (Greek: Laikoi paradosiakoi)\n\nIn the villages of the Peloponnese, Thessaly and the islands, priests, schoolteachers and local notables uphold a world of Orthodox faith, family honour and village solidarity. They backed the royalist right for generations and distrust Athens, whether it is ruled by politicians or by colonels.\n\nThe traditionalists want stable prices for wheat, tobacco and olive oil, church-minded schools and an end to the emigration that empties their villages toward West Germany and Australia. They are not ideologues, but their votes have decided Greek elections for decades."
 COLDWAR_GRE_1970_party_14_v0_icon:0 "£generic_Neutral_conservatism_small"
 COLDWAR_GRE_1970_party_15_v0:0 "£generic_oligarchism_small (EEE) - Union of Greek Shipowners"
 COLDWAR_GRE_1970_party_15_v0_desc:0 "(Shipping Oligarchy) - Union of Greek Shipowners (Greek: Enosis Ellinon Efopliston, EEE)\n\nFounded in 1916, the Union of Greek Shipowners represents the families who control one of the largest merchant fleets in the world. Onassis, Niarchos, Goulandris and their peers run their ships under flags of convenience from London and New York, but their influence over Athens is immense.\n\nThe colonels court them with tax privileges and generous laws to bring their fleets back under the Greek flag. In 1970 the shipowners stay aloof from open politics, ready to back whichever government guarantees their privileges, the free movement of their capital and a stable drachma."
 COLDWAR_GRE_1970_party_15_v0_icon:0 "£generic_oligarchism_small"
 COLDWAR_GRE_1970_party_16_v0:0 "£generic_Neutral_Libertarian_small Eleftheroemporikoi kykloi tou Peiraia"
 COLDWAR_GRE_1970_party_16_v0_desc:0 "(Free-Market Liberalism) - Free Trade Circles of Piraeus (Greek: Eleftheroemporikoi kykloi tou Peiraia)\n\nImporters, exporters, insurers and port merchants in Piraeus look to the open markets of Western Europe and America. They chafe at import restrictions, state control of credit and the cronyism practised by both the old parties and the junta.\n\nThese liberals want full association with the European Economic Community, a stable drachma and minimal state interference. In 1970 they are a commercial lobby rather than a party, but their chambers and newspapers carry weight with the businessmen who will shape Greece after the dictatorship."
 COLDWAR_GRE_1970_party_16_v0_icon:0 "£generic_Neutral_Libertarian_small"
 COLDWAR_GRE_1970_party_17_v0:0 "£generic_Neutral_green_small Prostasia tis ellinikis fysis"
 COLDWAR_GRE_1970_party_17_v0_desc:0 "(Conservationism) - Protection of Greek Nature (Greek: Prostasia tis ellinikis fysis)\n\nThe Hellenic Society for the Protection of Nature, founded in 1951, gathers naturalists, botanists and mountaineers who campaign for the forests of the Pindus, the wetlands of Macedonia and the endangered monk seal. Greece's first national parks, Olympus and Parnassus, date from 1938.\n\nAs hotels, roads and industry spread along the coasts in the tourism boom, the conservationists fear for the Greek landscape. They lobby discreetly within the ministries, presenting the protection of nature as part of the national heritage."
 COLDWAR_GRE_1970_party_17_v0_icon:0 "£generic_Neutral_green_small"
 COLDWAR_GRE_1970_party_18_v0:0 "£generic_neutral_Social_small Syndikalistiki dimokratiki aristera"
 COLDWAR_GRE_1970_party_18_v0_desc:0 "(Democratic Socialism) - Trade Unionist Democratic Left (Greek: Syndikalistiki dimokratiki aristera)\n\nBefore 1967 democratic trade unionists fought both the government-controlled leadership of the General Confederation of Greek Workers and the communist-led unions. They sought free unions, collective agreements and a welfare state on the West European model.\n\nUnder the dictatorship many of their leaders are imprisoned or exiled, and the confederation has been purged. The current survives in secret networks of printers, dockers and bank employees, preparing for the day when free collective bargaining returns."
 COLDWAR_GRE_1970_party_18_v0_icon:0 "£generic_neutral_Social_small"
 COLDWAR_GRE_1970_party_19_v0:0 "£generic_Neutral_Communism_small (EDA) - United Democratic Left"
 COLDWAR_GRE_1970_party_19_v0_desc:0 "(Independent Communism) - United Democratic Left (Greek: Eniaia Dimokratiki Aristera, EDA)\n\nFounded in 1951 as the legal voice of the outlawed left, the United Democratic Left became the main opposition in 1958 under figures such as Ioannis Passalidis and Ilias Iliou. Its daily Avgi and the Lambrakis youth movement shaped a generation of Greek progressives.\n\nBanned and persecuted since the coup, EDA's cadres sit in prisons and island camps, many of them close to the KKE Interior after the 1968 split. They reject blind obedience to Moscow and call for a broad democratic struggle against the junta."
 COLDWAR_GRE_1970_party_19_v0_icon:0 "£generic_Neutral_Communism_small"
 COLDWAR_GRE_1970_party_1_v0:0 "£generic_conservatism_small (ERE) - National Radical Union"
 COLDWAR_GRE_1970_party_1_v0_desc:0 "(Conservatism) - National Radical Union (Greek: Ethniki Rizospastiki Enosis, ERE)\n\nFounded by Konstantinos Karamanlis in 1956, the National Radical Union governed Greece until 1963, presiding over rapid growth and the association agreement with the EEC. After his defeat Karamanlis withdrew to Paris, leaving the party to Panagiotis Kanellopoulos, whose government the colonels overthrew on 21 April 1967.\n\nBanned like all parties, the ERE survives in the drawing rooms of Athens and in the loyalty of its provincial notables. Kanellopoulos openly demands a return to constitutional rule, and many look to Karamanlis in exile as the man who could one day lead Greece out of the dictatorship."
 COLDWAR_GRE_1970_party_1_v0_icon:0 "£generic_conservatism_small"
 COLDWAR_GRE_1970_party_1_v1:0 "£generic_conservatism_small (ND) - New Democracy"
 COLDWAR_GRE_1970_party_1_v1_desc:0 "(Liberal Conservatism) - New Democracy (Greek: Nea Dimokratia, ND)\n\nFounded by Konstantinos Karamanlis on 4 October 1974, weeks after his triumphant return from exile in Paris, New Democracy is the centre-right party of the restored republic. It won a landslide in November 1974, and its government held the referendum that abolished the monarchy.\n\nKaramanlis preaches radical liberalism: parliamentary democracy, a strong executive, entry into the European Community and an army firmly under civilian control. His party seeks to bury both the junta and the old divisions of the civil war while standing up to Turkey over Cyprus and the Aegean."
 COLDWAR_GRE_1970_party_1_v1_icon:0 "£generic_conservatism_small"
 COLDWAR_GRE_1970_party_20_v0:0 "£generic_Nat_Populism_small Ethnikistiki laiki deksia"
 COLDWAR_GRE_1970_party_20_v0_desc:0 "(National Populism) - Nationalist Popular Right (Greek: Ethnikistiki laiki deksia)\n\nBeyond the old royalist right lies a populist nationalism that speaks to refugees' children, small shopkeepers and soldiers' families. It praises the colonels' slogans of national rebirth, denounces corrupt politicians and calls for Enosis with Cyprus.\n\nIts supporters welcomed the regime's cancellation of farmers' debts and expect cheap loans and prestige projects to follow. In 1970 they form the popular base the junta hopes to organize, but they are quick to turn on any leader who seems to bow to Washington or Ankara."
 COLDWAR_GRE_1970_party_20_v0_icon:0 "£generic_Nat_Populism_small"
 COLDWAR_GRE_1970_party_21_v0:0 "£generic_Nat_Fascism_small Ethnikosocialistiko ypogeio"
 COLDWAR_GRE_1970_party_21_v0_desc:0 "(Neo-Fascism) - National Socialist Underground (Greek: Ethnikosocialistiko ypogeio)\n\nA fringe of veterans of the wartime collaborationist battalions and young admirers of the Metaxas dictatorship's Fourth of August ideology dream of a fully fascist Greece. They consider the colonels too timid and too dependent on America.\n\nOrganized in tiny clubs and secret societies, with links to the Italian far right, they publish obscure newspapers and plan provocations. In 1970 they have no mass base, but the regime's tolerance of the extreme right gives them room to recruit among officers and students."
 COLDWAR_GRE_1970_party_21_v0_icon:0 "£generic_Nat_Fascism_small"
 COLDWAR_GRE_1970_party_22_v0:0 "£generic_Nat_Autocracy_small Military Government of 21 April"
 COLDWAR_GRE_1970_party_22_v0_desc:0 "(Military Dictatorship) - Military Government of 21 April (Greek: Stratiotiki kyvernisi tis 21is Apriliou)\n\nOn 21 April 1967 Colonels Georgios Papadopoulos and Nikolaos Makarezos and Brigadier Stylianos Pattakos seized power using the NATO contingency plan Prometheus, claiming to forestall a communist takeover. The king's failed countercoup of December 1967 left them in full control.\n\nPapadopoulos now rules as prime minister and minister of defence under a 1968 constitution that remains largely suspended. The regime censors the press, imprisons opponents and courts foreign investment, while promising a guided return to democracy that never seems to arrive."
 COLDWAR_GRE_1970_party_22_v0_icon:0 "£generic_Nat_Autocracy_small"
 COLDWAR_GRE_1970_party_23_v0:0 "£generic_Monarchist_small Kinima vasilikis palinorthosis"
 COLDWAR_GRE_1970_party_23_v0_desc:0 "(Constitutional Monarchism) - Royal Restoration Movement (Greek: Kinima vasilikis palinorthosis)\n\nAfter his failed countercoup of 13 December 1967, King Constantine II fled to Rome with his family. The colonels appointed General Georgios Zoitakis as regent, and the king remains formally head of state while living in exile.\n\nRoyalist officers, purged from the armed forces by the hundreds, and the traditional right hope to bring the king back to Athens as guarantor of a constitutional order. In 1970 they plot, write and wait, though many Greeks blame the crown for the crisis of 1965 that opened the way to dictatorship."
 COLDWAR_GRE_1970_party_23_v0_icon:0 "£generic_Monarchist_small"
 COLDWAR_GRE_1970_party_2_v0:0 "£generic_liberalism_small (EK) - Centre Union"
 COLDWAR_GRE_1970_party_2_v0_desc:0 "(Liberalism) - Centre Union (Greek: Enosis Kentrou, EK)\n\nFounded by Georgios Papandreou in 1961, the Centre Union broke the long dominance of the right and won the elections of 1963 and 1964 with promises of education reform and a relentless struggle for democracy. The royal crisis of July 1965 split the party and opened the road to the coup.\n\nPapandreou died under house arrest in November 1968, and his funeral became a mass demonstration against the junta. In 1970 the banned party is held together by figures such as Georgios Mavros, while many of its members endure island exile or emigration."
 COLDWAR_GRE_1970_party_2_v0_icon:0 "£generic_liberalism_small"
 COLDWAR_GRE_1970_party_2_v1:0 "£generic_liberalism_small (EK-ND) - Centre Union – New Forces"
 COLDWAR_GRE_1970_party_2_v1_desc:0 "(Social Liberalism) - Centre Union – New Forces (Greek: Enosis Kentrou – Nees Dynameis, EK-ND)\n\nIn 1974 Georgios Mavros, who had held the remnants of the Centre Union together through the dictatorship, joined forces with the New Forces movement of younger anti-junta activists. The Centre Union – New Forces became the main opposition after the November 1974 election, with sixty seats.\n\nThe party carries the liberal tradition of Eleftherios Venizelos and Georgios Papandreou: parliamentary democracy, social reform and a Western orientation. Yet the centre is squeezed between Karamanlis's New Democracy and Andreas Papandreou's PASOK, which draws away many of its younger voters."
 COLDWAR_GRE_1970_party_2_v1_icon:0 "£generic_liberalism_small"
 COLDWAR_GRE_1970_party_3_v0:0 "£generic_socialism_small (PAK) - Panhellenic Liberation Movement"
 COLDWAR_GRE_1970_party_3_v0_desc:0 "(Socialist Resistance) - Panhellenic Liberation Movement (Greek: Panellinio Apeleftherotiko Kinima, PAK)\n\nReleased from prison and allowed to leave Greece at the end of 1967, Andreas Papandreou founded the Panhellenic Liberation Movement in exile in early 1968. From Stockholm and Toronto, PAK campaigns against the dictatorship and its American patrons and maintains clandestine cells inside Greece.\n\nThe movement calls for the overthrow of the junta, an end to foreign tutelage and a socialist transformation of Greek society. In 1970 its members distribute leaflets, organize exile protests and debate armed resistance, while Papandreou builds his reputation as the leading voice of the radical opposition."
 COLDWAR_GRE_1970_party_3_v0_icon:0 "£generic_socialism_small"
 COLDWAR_GRE_1970_party_3_v1:0 "£GRE_western_social_democrat (PASOK) - Panhellenic Socialist Movement"
 COLDWAR_GRE_1970_party_3_v1_desc:0 "(Social Democracy) - Panhellenic Socialist Movement (Greek: Panellinio Sosialistiko Kinima, PASOK)\n\nAndreas Papandreou proclaimed the Panhellenic Socialist Movement on 3 September 1974, merging his resistance organization PAK with other anti-junta groups. Its founding declaration promised national independence, popular sovereignty, social liberation and democratic process.\n\nPASOK opposes the American bases, NATO's grip on Greece and entry into the European Community, and rails against the establishment that has ruled since the civil war. Charismatic and populist, it rapidly gathers former centrists, young radicals and a long-excluded left."
 COLDWAR_GRE_1970_party_3_v1_icon:0 "£GRE_western_social_democrat"
 COLDWAR_GRE_1970_party_4_v0:0 "£GRE_emerging_communism (KKE) - Communist Party of Greece"
 COLDWAR_GRE_1970_party_4_v0_desc:0 "(Marxism-Leninism) - Communist Party of Greece (Greek: Kommounistiko Komma Elladas, KKE)\n\nOutlawed since 1947, the Communist Party of Greece has spent two decades in exile after its defeat in the civil war, its leadership based in Eastern Europe. In February 1968 the party split between the majority loyal to Moscow under Kostas Koligiannis and an 'interior' faction rooted among militants inside Greece.\n\nThe pro-Soviet KKE keeps its organization alive through exiles in Tashkent, Bucharest and East Berlin and through underground cells at home. Thousands of communists and leftists languish in the camps of Gyaros and Leros, and the party calls for a broad front against the dictatorship."
 COLDWAR_GRE_1970_party_4_v0_icon:0 "£GRE_emerging_communism"
 COLDWAR_GRE_1970_party_5_v0:0 "£generic_anarchist_communism_small Antiexousiastikoi kykloi ton Athinon"
 COLDWAR_GRE_1970_party_5_v0_desc:0 "(Anarchism) - Anti-Authoritarian Circles of Athens (Greek: Antiexousiastikoi kykloi ton Athinon)\n\nIn the student quarter of Exarcheia and among Greek exiles in Paris who lived through May 1968, small groups of young people read Bakunin, the Situationists and the critics of Stalinism. They reject both the junta and the traditional parties of the left, the KKE included.\n\nThese anti-authoritarian circles print pamphlets, smuggle banned books and dream of a spontaneous uprising of students and workers. Few in number and fiercely independent, they are a seed of the radical movement that will grow in the faculties of Athens as the dictatorship weakens."
 COLDWAR_GRE_1970_party_5_v0_icon:0 "£generic_anarchist_communism_small"
 COLDWAR_GRE_1970_party_6_v0:0 "£generic_Conservative_small Filosovietikoi ethnikofrones"
 COLDWAR_GRE_1970_party_6_v0_desc:0 "(Eastern-Oriented Nationalism) - Pro-Soviet Nationalists (Greek: Filosovietikoi ethnikofrones)\n\nA peculiar current among Greek nationalists argues that the United States has betrayed Hellenism, above all on Cyprus, and that Orthodox kinship with Russia offers a better ally. Its adherents include retired officers, Orthodox traditionalists and conservative intellectuals embittered by Washington's courting of Turkey.\n\nThey envisage a strong, authoritarian Greece outside NATO, balancing between the blocs and drawing closer to Moscow. In 1970 they are few and scattered, viewed with suspicion by the junta and the communists alike, but rising anti-American resentment gives their arguments a hearing."
 COLDWAR_GRE_1970_party_6_v0_icon:0 "£generic_Conservative_small"
 COLDWAR_GRE_1970_party_7_v0:0 "£generic_Autocracy_small Kratis tes ektaktou anagkis"
 COLDWAR_GRE_1970_party_7_v0_desc:0 "(Authoritarian Nationalism) - State of Emergency Hardliners (Greek: Kratis tes ektaktou anagkis)\n\nSince 21 April 1967 Greece has been ruled under martial law, with the key articles of the constitution suspended. Around the colonels a network of security officials, the military police and loyal judges sustains the emergency, presenting it as the only bulwark against communist subversion.\n\nThese hardliners oppose any liberalization and dismiss Papadopoulos's talk of a gradual return to democracy as weakness. Under the slogan of a Greece of Christian Greeks, they believe the nation needs years more of discipline before politicians can be trusted again."
 COLDWAR_GRE_1970_party_7_v0_icon:0 "£generic_Autocracy_small"
 COLDWAR_GRE_1970_party_8_v0:0 "£generic_Mod_Vilayat_e_Faqih_small Siites metarrythmistes"
 COLDWAR_GRE_1970_party_8_v0_desc:0 "(Shia Reformism) - Shia Reformers (Greek: Siites metarrythmistes)\n\nGreece's Muslims, the Turkish- and Pomak-speaking minority of Western Thrace protected by the Treaty of Lausanne, are almost all Sunni. Yet a few Alevi-Bektashi villages near the Evros preserve a heterodox tradition close to Shia Islam, with its own saints, lodges and rituals.\n\nA handful of educated believers in these communities seek recognition of their own religious practice and closer ties with reformist Shia thought abroad. Under a regime suspicious of every minority, they remain a very small, inward-looking current with no political weight in Athens."
 COLDWAR_GRE_1970_party_8_v0_icon:0 "£generic_Mod_Vilayat_e_Faqih_small"
 COLDWAR_GRE_1970_party_9_v0:0 "£generic_Vilayat_e_Faqih_small Siitikoi klirikoi kykloi"
 COLDWAR_GRE_1970_party_9_v0_desc:0 "(Shia Theocracy) - Shia Clerical Circles (Greek: Siitikoi klirikoi kykloi)\n\nAmong the few Shia and Bektashi believers of Thrace and the Iranian and Iraqi students of Athens, the lectures that Ayatollah Ruhollah Khomeini gives in Najaf circulate in translation. They describe the government of the Islamic jurist as the only legitimate order for Muslims.\n\nIn Greece such ideas have no realistic prospect, and their adherents form a scattered study circle under police watch. Still, they claim to speak for a wider awakening of Shia Islam that they believe will soon shake the Middle East."
 COLDWAR_GRE_1970_party_9_v0_icon:0 "£generic_Vilayat_e_Faqih_small"
 COLDWAR_GRE_1970_political_dossier:0 "Greek Leadership Dossier"
 COLDWAR_GRE_1970_political_dossier_desc:0 "Choose a historically available political representative. Constitutional offices and military appointments remain separate. Availability dates never trigger political changes automatically."
 COLDWAR_GRE_1970_select_andreas_papandreou:0 "Select Andreas Papandreou as Political Representative"
 COLDWAR_GRE_1970_select_andreas_papandreou_desc:0 "PAK opposition before3September1974; PASOK thereafter. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_GRE_1970_select_angellis:0 "Select Odysseas Angellis as Political Representative"
