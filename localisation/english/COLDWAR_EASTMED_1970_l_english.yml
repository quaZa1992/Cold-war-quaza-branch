 COLDWAR_GRE_1970_select_bonanos:0 "Select Grigorios Bonanos as Political Representative"
 COLDWAR_GRE_1970_select_bonanos_desc:0 "Armed forces chief afterNovember1973. August1974 end boundary is approximate. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_GRE_1970_select_constantine_ii:0 "Select Constantine II as Political Representative"
 COLDWAR_GRE_1970_select_constantine_ii_desc:0 "King in exile; restoration after abolition is alternate history, never an active corps command. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_GRE_1970_select_florakis:0 "Select Charilaos Florakis as Political Representative"
 COLDWAR_GRE_1970_select_florakis_desc:0 "KKE secretary only afterDecember1972. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_GRE_1970_select_ioannidis:0 "Select Dimitrios Ioannidis as Political Representative"
 COLDWAR_GRE_1970_select_ioannidis_desc:0 "Military-police chief and later de facto strongman; not formal president or prime minister. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_GRE_1970_select_kanellopoulos:0 "Select Panagiotis Kanellopoulos as Political Representative"
 COLDWAR_GRE_1970_select_kanellopoulos_desc:0 "ERE leader and democratic opposition; not an early ND chairman. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_GRE_1970_select_karamanlis:0 "Select Konstantinos Karamanlis as Political Representative"
 COLDWAR_GRE_1970_select_karamanlis_desc:0 "ERE-associated exile before1974; ND founder only from4October1974. Later presidency is a separate office. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_GRE_1970_select_koligiannis:0 "Select Kostas Koligiannis as Political Representative"
 COLDWAR_GRE_1970_select_koligiannis_desc:0 "KKE first secretary before theDecember1972 succession. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_GRE_1970_select_mavros:0 "Select Georgios Mavros as Political Representative"
 COLDWAR_GRE_1970_select_mavros_desc:0 "Centre Union, later Centre Union–New Forces; not a1970 PASOK leader. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_GRE_1970_select_papadopoulos:0 "Select Georgios Papadopoulos as Political Representative"
 COLDWAR_GRE_1970_select_papadopoulos_desc:0 "Junta government leader. No calendar overthrow. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_GRE_1970_zoitakis:0 "Georgios Zoitakis"
 COLDWAR_GRE_1970_zoitakis_desc:0 "Regent in1970, distinct from Papadopoulos government leadership."
 COLDWAR_TUR_1970_alparslan_turkes:0 "Alparslan Türkeş"
 COLDWAR_TUR_1970_alparslan_turkes_desc:0 "MHP leader in1970; no forced1980 political ban."
 COLDWAR_TUR_1970_bedrettin_demirel:0 "Bedrettin Demirel"
 COLDWAR_TUR_1970_bedrettin_demirel_desc:0 "Division/corps commander during1974Cyprus campaign; Second Army1980–81. Year-level endpoint and chief start are approximations."
 COLDWAR_TUR_1970_bulend_ulusu:0 "Bülend Ulusu"
 COLDWAR_TUR_1970_bulend_ulusu_desc:0 "Civilian prime minister reference1980–83; no fictional1970 naval uniform or active command from this portrait."
 COLDWAR_TUR_1970_bulent_ecevit:0 "Bülent Ecevit"
 COLDWAR_TUR_1970_bulent_ecevit_desc:0 "CHP secretary-general in1970; chairman from14May1972. Selection before then is an alternate representative, not a claim of actual chairmanship."
 COLDWAR_TUR_1970_cevdet_sunay:0 "Cevdet Sunay"
 COLDWAR_TUR_1970_cevdet_sunay_desc:0 "President, not the AP prime minister or an active1970 army commander."
 COLDWAR_TUR_1970_esref_akinci:0 "Eşref Akıncı"
 COLDWAR_TUR_1970_esref_akinci_desc:0 "Army commander7March1973–1April1976; actual contemporaneous officer."
 COLDWAR_TUR_1970_fahri_koruturk:0 "Fahri Korutürk"
 COLDWAR_TUR_1970_fahri_koruturk_desc:0 "President from6April1973; retired admiral, not active naval commander. Earlier senator role does not imply presidency."
 COLDWAR_TUR_1970_faruk_gurler:0 "Ömer Faruk Gürler"
 COLDWAR_TUR_1970_faruk_gurler_desc:0 "Army commander from28August1970, later General Staff chief."
 COLDWAR_TUR_1970_ismet_inonu:0 "İsmet İnönü"
 COLDWAR_TUR_1970_ismet_inonu_desc:0 "Actual CHP chairman at1970 start, elder statesman after1972."
 COLDWAR_TUR_1970_kemal_kayacan:0 "Kemal Kayacan"
 COLDWAR_TUR_1970_kemal_kayacan_desc:0 "Fleet command1970–72, navy commandAugust1972–August1974. Month boundaries approximate exact days."
 COLDWAR_TUR_1970_kenan_evren:0 "Ahmet Kenan Evren"
 COLDWAR_TUR_1970_kenan_evren_desc:0 "Contemporary serving general. Later head-of-state role requires human selection; no automatic1980 coup."
 COLDWAR_TUR_1970_memduh_tagmac:0 "Memduh Tağmaç"
 COLDWAR_TUR_1970_memduh_tagmac_desc:0 "Chief of General Staff at1970 start."
 COLDWAR_TUR_1970_muhsin_batur:0 "Muhsin Batur"
 COLDWAR_TUR_1970_muhsin_batur_desc:0 "Air force commander1969–30August1973; later civilian senate role is separate."
 COLDWAR_TUR_1970_necmettin_erbakan:0 "Necmettin Erbakan"
 COLDWAR_TUR_1970_necmettin_erbakan_desc:0 "Independent at scenario start, MNP from26January1970, later MSP; no future AKP identity."
 COLDWAR_TUR_1970_nihat_erim:0 "Nihat Erim"
 COLDWAR_TUR_1970_nihat_erim_desc:0 "Civilian law professor and1971–72 prime minister; assassination is not scheduled."
 COLDWAR_TUR_1970_nurettin_ersin:0 "Nurettin Ersin"
 COLDWAR_TUR_1970_nurettin_ersin_desc:0 "Division/corps command is distinct from later army and General Staff chief appointments."
 COLDWAR_TUR_1970_party_0_v0:0 "£generic_Western_Autocracy_small Atlantikçi devlet kadroları"
 COLDWAR_TUR_1970_party_0_v0_desc:0 "(Atlanticist Statism) - Atlanticist State Cadres (Turkish: Atlantikçi devlet kadroları)\n\nWithin the Foreign Ministry, the General Staff and the planning offices of Ankara sits a cadre of officials who regard NATO membership as the cornerstone of the republic. Shaped by the Truman Doctrine, Korea and the Baghdad Pact years, they distrust both the street politics of the left and the improvisations of party leaders, preferring order guaranteed by the alliance with Washington.\n\nIn 1970 these cadres watch with alarm as campus unrest, the Cyprus question and the protests against the US Sixth Fleet undermine Turkey's Western anchor. Should parliamentary government falter, they stand ready to offer a firm, technocratic administration loyal to the Atlantic alliance."
 COLDWAR_TUR_1970_party_0_v0_icon:0 "£generic_Western_Autocracy_small"
 COLDWAR_TUR_1970_party_10_v0:0 "£generic_Kingdom_small Selefî saltanatçılar"
 COLDWAR_TUR_1970_party_10_v0_desc:0 "(Salafi Monarchism) - Salafi Monarchists (Turkish: Selefî saltanatçılar)\n\nA handful of Turkish students returning from Medina and Riyadh bring home the teachings of the Saudi religious establishment. Rejecting the Sufi orders and the folk Islam of Anatolia, they argue that only a ruler bound by the Quran and Sunna, on the Saudi model, can restore a righteous Muslim state.\n\nTheir circle is tiny and isolated, regarded with suspicion both by the secular state and by the powerful Nakşibendî brotherhoods. Yet growing ties with Saudi Arabia, and Saudi money for mosques and scholarships, offer them a slow path to influence."
 COLDWAR_TUR_1970_party_10_v0_icon:0 "£generic_Kingdom_small"
 COLDWAR_TUR_1970_party_11_v0:0 "£generic_Caliphate_small Selefî hilâfet çevreleri"
 COLDWAR_TUR_1970_party_11_v0_desc:0 "(Pan-Islamic Caliphalism) - Salafi Caliphate Circles (Turkish: Selefî hilâfet çevreleri)\n\nSince the Grand National Assembly abolished the caliphate in March 1924, a small undercurrent of Turkish Muslims has refused to accept the loss. Influenced by Hizb ut-Tahrir pamphlets and Salafi preachers, these circles call for a single caliphate over the whole Muslim world.\n\nIn 1970 they are a scattering of study groups and clandestine publications, prosecuted under the laws that protect the secular republic. Their message of a universal Islamic state appeals to few, but the deepening crisis of Turkish politics gives them hope that their hour will come."
 COLDWAR_TUR_1970_party_11_v0_icon:0 "£generic_Caliphate_small"
 COLDWAR_TUR_1970_party_12_v0:0 "£muslim_brotherhood_small Millî Görüş bağımsızları"
 COLDWAR_TUR_1970_party_12_v0_desc:0 "(Islamic Democracy) - National Outlook Independents (Turkish: Millî Görüş bağımsızları)\n\nIn October 1969 Necmettin Erbakan, an engineering professor whom the government had just pushed out of the chairmanship of the Union of Chambers, won a seat in Konya as an independent. Around him gathers a network of pious deputies, Nakşibendî circles and small Anatolian merchants who feel abandoned by the Justice Party's courting of big Istanbul capital.\n\nTheir manifesto, the National Outlook, calls for heavy industry built by Turks, moral renewal and distance from the European Common Market. For now they are an informal group of independents, but a party of their own is only weeks away."
 COLDWAR_TUR_1970_party_12_v0_icon:0 "£muslim_brotherhood_small"
 COLDWAR_TUR_1970_party_12_v1:0 "£muslim_brotherhood_small (MNP) - National Order Party"
 COLDWAR_TUR_1970_party_12_v1_desc:0 "(Islamic Democracy) - National Order Party (Turkish: Millî Nizam Partisi, MNP)\n\nFounded on 26 January 1970 by Necmettin Erbakan, the National Order Party is the first party of the republic to make Islamic values the openly declared basis of its programme. It draws on Konya's merchants, provincial craftsmen and the religious brotherhoods that see the secular elite as alien to the nation.\n\nIts National Outlook promises heavy industry, moral education and an economy independent of the European Common Market. The party's rise alarms the Kemalist establishment, and prosecutors are already examining whether its speeches violate the constitution's secular principles."
 COLDWAR_TUR_1970_party_12_v1_icon:0 "£muslim_brotherhood_small"
 COLDWAR_TUR_1970_party_12_v2:0 "£muslim_brotherhood_small Millî Görüş bağımsızları"
 COLDWAR_TUR_1970_party_12_v2_desc:0 "(Islamic Democracy) - National Outlook Independents (Turkish: Millî Görüş bağımsızları)\n\nOn 20 May 1971 the Constitutional Court dissolved the National Order Party for violating the secular principles of the republic, and Necmettin Erbakan briefly withdrew to Switzerland. His former deputies sit on as independents under the shadow of the 12 March memorandum and the military-backed cabinets.\n\nThe movement survives in mosques, chambers of commerce and Anatolian towns, waiting for martial law to loosen its grip. Its leaders are already preparing a new vehicle that can carry the National Outlook back into parliament."
 COLDWAR_TUR_1970_party_12_v2_icon:0 "£muslim_brotherhood_small"
 COLDWAR_TUR_1970_party_12_v3:0 "£muslim_brotherhood_small (MSP) - National Salvation Party"
 COLDWAR_TUR_1970_party_12_v3_desc:0 "(Islamic Democracy) - National Salvation Party (Turkish: Millî Selâmet Partisi, MSP)\n\nFounded on 11 October 1972 as the successor of the banned National Order Party, the National Salvation Party carries Necmettin Erbakan's National Outlook into a new era. Its electorate spans pious Anatolian towns, small businessmen and religious brotherhoods disillusioned with the Justice Party.\n\nWith its programme of heavy industry and moral development, the party became the kingmaker of Turkish politics after the 1973 election, joining coalitions with both Ecevit's CHP and Demirel's Nationalist Front. Its ministers seek to fill the state with believers while keeping one foot firmly in the parliamentary system."
 COLDWAR_TUR_1970_party_12_v3_icon:0 "£muslim_brotherhood_small"
 COLDWAR_TUR_1970_party_13_v0:0 "£generic_Neutral_Autocracy_small Devletçi bürokratlar"
 COLDWAR_TUR_1970_party_13_v0_desc:0 "(Kemalist Statism) - Statist Bureaucrats (Turkish: Devletçi bürokratlar)\n\nSince the 1930s the state economic enterprises, the State Planning Organization and the ministries of Ankara have been the backbone of Turkish development. The bureaucrats who run them see themselves as the true heirs of Atatürk, above the quarrels of parties and beholden to neither Washington nor Moscow.\n\nThey favour five-year plans, import substitution and strong public industry such as Sümerbank and Etibank. In 1970 they view the Justice Party's pro-business course with distrust and would welcome a cabinet of non-party experts to return the republic to its planned path."
 COLDWAR_TUR_1970_party_13_v0_icon:0 "£generic_Neutral_Autocracy_small"
 COLDWAR_TUR_1970_party_14_v0:0 "£generic_Neutral_conservatism_small (GP) - Reliance Party"
 COLDWAR_TUR_1970_party_14_v0_desc:0 "(Kemalist Conservatism) - Reliance Party (Turkish: Güven Partisi, GP)\n\nThe Reliance Party was founded in 1967 by Turhan Feyzioğlu and a group of deputies and senators who left the Republican People's Party in protest at its left-of-centre turn. They present themselves as the authentic Kemalists, defenders of the secular republic against both socialism and religious reaction.\n\nIn the 1969 election the party won fifteen seats, a modest result for its ambitions. Feyzioğlu, a respected professor of law, hopes to build a centrist force acceptable to the army and to business, and talks of union with other small conservative groups are under way."
 COLDWAR_TUR_1970_party_14_v0_icon:0 "£generic_Neutral_conservatism_small"
 COLDWAR_TUR_1970_party_15_v0:0 "£generic_oligarchism_small Odalar ve sanayi çevreleri"
 COLDWAR_TUR_1970_party_15_v0_desc:0 "(Corporate Capitalism) - Chambers and Industry Circles (Turkish: Odalar ve sanayi çevreleri)\n\nThe Union of Chambers of Commerce and Industry and the great industrial families of Istanbul, the Koçs and Sabancıs among them, have prospered under import substitution and state credit. They want stability, cheap loans and protection from foreign competition, and they expect governments to listen.\n\nErbakan's 1969 bid for the chairmanship of the Union of Chambers exposed the rift between Anatolian small business and the Istanbul magnates. In 1970 the big industrialists are organizing, and plans for an association of leading businessmen are already being discussed."
 COLDWAR_TUR_1970_party_15_v0_icon:0 "£generic_oligarchism_small"
 COLDWAR_TUR_1970_party_16_v0:0 "£generic_Neutral_Libertarian_small Hür teşebbüs liberalleri"
 COLDWAR_TUR_1970_party_16_v0_desc:0 "(Classical Liberalism) - Free Enterprise Liberals (Turkish: Hür teşebbüs liberalleri)\n\nA small group of economists, exporters and journalists argues that Turkey's planned, protected economy is strangling initiative. They admire the West German economic miracle and call for lower tariffs, a convertible lira and an end to the dominance of state enterprises.\n\nIn 1970 they find little echo in a country where both the Justice Party and the Republican People's Party accept import substitution. Yet the devaluation of August 1970 and the widening trade deficit lend weight to their warnings that the protected model cannot last."
 COLDWAR_TUR_1970_party_16_v0_icon:0 "£generic_Neutral_Libertarian_small"
 COLDWAR_TUR_1970_party_16_v1:0 "£TUR_Neutral_Libertarian (ANAP) - Motherland Party"
 COLDWAR_TUR_1970_party_16_v1_desc:0 "(Neoliberalism) - Motherland Party (Turkish: Anavatan Partisi, ANAP)\n\nFounded in May 1983 by Turgut Özal, the economist behind the stabilization programme of 24 January 1980, the Motherland Party claims to unite the conservative, nationalist, religious and liberal tendencies of Turkish politics. It won a surprise majority in November 1983 against the generals' favoured candidates.\n\nÖzal promises to open Turkey to the world market, privatize state enterprises, free the exchange rate and build a new class of exporters. His young technocrats, nicknamed the princes, are rewriting the rules of the Turkish economy."
 COLDWAR_TUR_1970_party_16_v1_icon:0 "£TUR_Neutral_Libertarian"
 COLDWAR_TUR_1970_party_17_v0:0 "£generic_Neutral_green_small Türkiye Tabiatını Koruma çevreleri"
 COLDWAR_TUR_1970_party_17_v0_desc:0 "(Conservationism) - Nature Conservation Circles (Turkish: Türkiye Tabiatını Koruma çevreleri)\n\nThe Turkish Association for the Conservation of Nature, founded in 1955, brings together foresters, biologists and professors worried about the vanishing forests, wetlands and wildlife of Anatolia. Turkey's first national park, the Yozgat pine grove, was declared in 1958.\n\nAs factories, dams and shanty towns spread around Istanbul, İzmit and İzmir, the conservationists warn that rapid development carries a price. In 1970 they remain a polite lobby of experts, but they hope to place nature protection on the agenda of the planners in Ankara."
 COLDWAR_TUR_1970_party_17_v0_icon:0 "£generic_Neutral_green_small"
 COLDWAR_TUR_1970_party_18_v0:0 "£generic_neutral_Social_small Ortanın solu sendikacıları"
 COLDWAR_TUR_1970_party_18_v0_desc:0 "(Democratic Socialism) - Left-of-Centre Trade Unionists (Turkish: Ortanın solu sendikacıları)\n\nInside Türk-İş, the largest labour confederation, and among the unions that founded DİSK in 1967, a group of trade unionists rallies to the left-of-centre slogan of the Republican People's Party. They want real collective bargaining, a protected right to strike and a fairer share of Turkey's industrial growth.\n\nWhen the government moved to curb DİSK in June 1970, tens of thousands of workers marched in Istanbul and İzmit and martial law followed. These unionists stand between the cautious leadership of Türk-İş and the militancy of DİSK, seeking to turn the labour movement into a political force."
 COLDWAR_TUR_1970_party_18_v0_icon:0 "£generic_neutral_Social_small"
 COLDWAR_TUR_1970_party_19_v0:0 "£generic_Neutral_Communism_small (TİP) - Workers' Party of Turkey"
 COLDWAR_TUR_1970_party_19_v0_desc:0 "(Independent Socialism) - Workers' Party of Turkey (Turkish: Türkiye İşçi Partisi, TİP)\n\nFounded by trade unionists in 1961 and led for years by Mehmet Ali Aybar, the Workers' Party of Turkey entered parliament with fifteen deputies in 1965, the first socialist party ever to do so. It opposed NATO bases and condemned the Soviet invasion of Czechoslovakia, insisting on a Turkish road to socialism.\n\nBitter factional struggles drove Aybar from the chairmanship in 1969, and a new electoral law left the party with just two seats that autumn. With Behice Boran rising to its leadership, it now debates the Kurdish question and its stance toward the youth movement, while prosecutors circle."
 COLDWAR_TUR_1970_party_19_v0_icon:0 "£generic_Neutral_Communism_small"
 COLDWAR_TUR_1970_party_1_v0:0 "£generic_conservatism_small (AP) - Justice Party"
 COLDWAR_TUR_1970_party_1_v0_desc:0 "(Liberal Conservatism) - Justice Party (Turkish: Adalet Partisi, AP)\n\nFounded in 1961 as the heir of Adnan Menderes's banned Democrat Party, the Justice Party draws its strength from Anatolian farmers, small traders and the rising industrial bourgeoisie. Under Süleyman Demirel, the hydraulic engineer who became prime minister in 1965, it won an outright majority again in October 1969.\n\nDemirel promises dams, roads and electricity for every village while keeping Turkey firmly in NATO. Yet the party is strained: student violence escalates, a dissident wing around Ferruh Bozbeyli is drifting toward secession, and the generals who removed Menderes in 1960 watch the government closely."
 COLDWAR_TUR_1970_party_1_v0_icon:0 "£generic_conservatism_small"
 COLDWAR_TUR_1970_party_20_v0:0 "£TUR_Nat_Populism (MHP) - Nationalist Movement Party"
 COLDWAR_TUR_1970_party_20_v0_desc:0 "(Turkish Nationalism) - Nationalist Movement Party (Turkish: Milliyetçi Hareket Partisi, MHP)\n\nIn February 1969 Colonel Alparslan Türkeş, one of the officers of the 1960 coup, renamed the Republican Peasants' Nation Party as the Nationalist Movement Party. Its doctrine of the Nine Lights combines nationalism, moralism, anti-communism and a corporatist vision of social harmony.\n\nThe party won only one seat in 1969, but its youth wing, the Idealist Hearths, is growing fast on campuses where it fights leftist students. Türkeş, hailed by his followers as the Başbuğ, presents his movement as the only force capable of saving the nation from communism."
 COLDWAR_TUR_1970_party_20_v0_icon:0 "£TUR_Nat_Populism"
 COLDWAR_TUR_1970_party_21_v0:0 "£generic_Nat_Fascism_small Ülkücü milliyetçiler"
 COLDWAR_TUR_1970_party_21_v0_desc:0 "(Ultranationalism) - Idealist Nationalists (Turkish: Ülkücü milliyetçiler)\n\nIn commando camps and the Idealist Hearths, young militants known as the Grey Wolves are taught that Turkey faces a mortal communist threat. Their heroes are the Turkic peoples of the Soviet Union and China, whom they dream of uniting in a Great Turan, and their enemies are the revolutionary left.\n\nMore radical than the party leadership in Ankara, they favour street violence and see parliamentary politics as a mere tool. In 1970 they are a disciplined shock force, ready to answer the revolutionary left blow for blow."
 COLDWAR_TUR_1970_party_21_v0_icon:0 "£generic_Nat_Fascism_small"
 COLDWAR_TUR_1970_party_22_v0:0 "£generic_Nat_Autocracy_small Türk Silahlı Kuvvetleri komuta heyeti"
 COLDWAR_TUR_1970_party_22_v0_desc:0 "(Military Kemalism) - Turkish Armed Forces High Command (Turkish: Türk Silahlı Kuvvetleri komuta heyeti)\n\nThe Turkish Armed Forces regard themselves as the guardians of Atatürk's republic. They overthrew Adnan Menderes in May 1960, and the generals under Chief of the General Staff Memduh Tağmaç now watch the street fighting, strikes and bombings with growing impatience.\n\nJunior officers whisper of a radical coup, while the high command prefers a warning to parliament. Should the politicians fail to restore order, the generals are prepared to intervene once more, imposing an above-party government and martial law in the name of the republic."
 COLDWAR_TUR_1970_party_22_v0_icon:0 "£generic_Nat_Autocracy_small"
 COLDWAR_TUR_1970_party_23_v0:0 "£generic_Monarchist_small Osmanlı Hanedanı taraftarları"
 COLDWAR_TUR_1970_party_23_v0_desc:0 "(Ottoman Monarchism) - Supporters of the Ottoman Dynasty (Turkish: Osmanlı Hanedanı taraftarları)\n\nSince 1924 the members of the House of Osman have lived in exile, scattered from Nice and Paris to Cairo and Beirut. The head of the house, Prince Ahmed Nihad, lives quietly abroad, and the law of the republic still bars the princes from setting foot in Turkey.\n\nA small number of Turks, nostalgic for the empire and the caliphate, keep the memory of the dynasty alive in books and private gatherings. They imagine a restored constitutional sultanate as a symbol of unity, though in 1970 the idea has almost no political support."
 COLDWAR_TUR_1970_party_23_v0_icon:0 "£generic_Monarchist_small"
 COLDWAR_TUR_1970_party_2_v0:0 "£generic_liberalism_small (YTP) - New Turkey Party"
 COLDWAR_TUR_1970_party_2_v0_desc:0 "(Liberalism) - New Turkey Party (Turkish: Yeni Türkiye Partisi, YTP)\n\nThe New Turkey Party was founded in 1961 by Ekrem Alican as one of the successors of the Democrat Party, appealing to liberal-minded professionals, merchants and voters who wanted the Menderes legacy without its excesses. It served in İsmet İnönü's coalition governments of the early 1960s.\n\nBy 1970 the party has been eclipsed by the Justice Party and holds only a handful of seats after the 1969 election. Its remaining deputies defend free enterprise, civil liberties and constitutional moderation, hoping to survive as a liberal hinge between the two great parties."
 COLDWAR_TUR_1970_party_2_v0_icon:0 "£generic_liberalism_small"
 COLDWAR_TUR_1970_party_3_v0:0 "£TUR_conservatism (CHP) - Republican People's Party"
 COLDWAR_TUR_1970_party_3_v0_desc:0 "(Kemalist Social Democracy) - Republican People's Party (Turkish: Cumhuriyet Halk Partisi, CHP)\n\nAtatürk's own party, the Republican People's Party governed Turkey alone until 1950 and remains the guardian of the six arrows of Kemalism. Led by the aged İsmet İnönü, it adopted a left-of-centre course in 1965, championed by its dynamic general secretary Bülent Ecevit.\n\nThe new line has cost the party conservative members, and Turhan Feyzioğlu's dissidents walked out in 1967. In 1970 the CHP stands for land reform, social security and workers' rights within a secular, democratic republic, while the rivalry between İnönü and Ecevit over the party's soul simmers beneath the surface."
 COLDWAR_TUR_1970_party_3_v0_icon:0 "£TUR_conservatism"
 COLDWAR_TUR_1970_party_4_v0:0 "£generic_Communist_State_small (TKP) - Communist Party of Turkey"
 COLDWAR_TUR_1970_party_4_v0_desc:0 "(Marxism-Leninism) - Communist Party of Turkey (Turkish: Türkiye Komünist Partisi, TKP)\n\nFounded in Baku in 1920, the Communist Party of Turkey has been illegal for almost its entire existence. Its leaders live in exile in the Eastern Bloc and speak to the country through the clandestine Bizim Radyo, while members at home face prison under articles 141 and 142 of the penal code.\n\nLoyal to Moscow, the party condemns NATO bases, American influence and the Justice Party government. Under general secretary Zeki Baştımar it seeks to win over the growing workers' movement and the radicalized youth, though many young revolutionaries now look to Mao, Guevara or their own guerrilla theories instead."
 COLDWAR_TUR_1970_party_4_v0_icon:0 "£generic_Communist_State_small"
 COLDWAR_TUR_1970_party_5_v0:0 "£generic_anarchist_communism_small (Dev-Genç) - Revolutionary Youth Federation of Turkey"
 COLDWAR_TUR_1970_party_5_v0_desc:0 "(Revolutionary Socialism) - Revolutionary Youth Federation of Turkey (Turkish: Türkiye Devrimci Gençlik Federasyonu, Dev-Genç)\n\nBorn in 1969 out of the Federation of Idea Clubs, Dev-Genç unites the student radicals of Ankara, Istanbul and the Middle East Technical University. Its members occupied faculties, fought rightist commandos in the streets and led the protests that greeted the US Sixth Fleet in Istanbul.\n\nYoung leaders such as Deniz Gezmiş and Mahir Çayan argue that parliament is a dead end and that only armed struggle can free Turkey from imperialism. In 1970 the federation stands on the threshold of urban guerrilla warfare, and the state is preparing to answer it with force."
 COLDWAR_TUR_1970_party_5_v0_icon:0 "£generic_anarchist_communism_small"
 COLDWAR_TUR_1970_party_6_v0:0 "£generic_Conservative_small Millî Görüş bağımsızları"
 COLDWAR_TUR_1970_party_6_v0_desc:0 "(Islamic Traditionalism) - National Outlook Independents (Turkish: Millî Görüş bağımsızları)\n\nIn October 1969 Necmettin Erbakan, an engineering professor whom the government had just pushed out of the chairmanship of the Union of Chambers, won a seat in Konya as an independent. Around him gathers a network of pious deputies, Nakşibendî circles and small Anatolian merchants who feel abandoned by the Justice Party's courting of big Istanbul capital.\n\nTheir manifesto, the National Outlook, calls for heavy industry built by Turks, moral renewal and distance from the European Common Market. For now they are an informal group of independents, but a party of their own is only weeks away."
 COLDWAR_TUR_1970_party_6_v0_icon:0 "£generic_Conservative_small"
 COLDWAR_TUR_1970_party_6_v1:0 "£generic_Conservative_small (MNP) - National Order Party"
 COLDWAR_TUR_1970_party_6_v1_desc:0 "(Islamic Traditionalism) - National Order Party (Turkish: Millî Nizam Partisi, MNP)\n\nFounded on 26 January 1970 by Necmettin Erbakan, the National Order Party is the first party of the republic to make Islamic values the openly declared basis of its programme. It draws on Konya's merchants, provincial craftsmen and the religious brotherhoods that see the secular elite as alien to the nation.\n\nIts National Outlook promises heavy industry, moral education and an economy independent of the European Common Market. The party's rise alarms the Kemalist establishment, and prosecutors are already examining whether its speeches violate the constitution's secular principles."
 COLDWAR_TUR_1970_party_6_v1_icon:0 "£generic_Conservative_small"
 COLDWAR_TUR_1970_party_6_v2:0 "£generic_Conservative_small Millî Görüş bağımsızları"
 COLDWAR_TUR_1970_party_6_v2_desc:0 "(Islamic Traditionalism) - National Outlook Independents (Turkish: Millî Görüş bağımsızları)\n\nOn 20 May 1971 the Constitutional Court dissolved the National Order Party for violating the secular principles of the republic, and Necmettin Erbakan briefly withdrew to Switzerland. His former deputies sit on as independents under the shadow of the 12 March memorandum and the military-backed cabinets.\n\nThe movement survives in mosques, chambers of commerce and Anatolian towns, waiting for martial law to loosen its grip. Its leaders are already preparing a new vehicle that can carry the National Outlook back into parliament."
 COLDWAR_TUR_1970_party_6_v2_icon:0 "£generic_Conservative_small"
 COLDWAR_TUR_1970_party_6_v3:0 "£generic_Conservative_small (MSP) - National Salvation Party"
 COLDWAR_TUR_1970_party_6_v3_desc:0 "(Islamic Traditionalism) - National Salvation Party (Turkish: Millî Selâmet Partisi, MSP)\n\nFounded on 11 October 1972 as the successor of the banned National Order Party, the National Salvation Party carries Necmettin Erbakan's National Outlook into a new era. Its electorate spans pious Anatolian towns, small businessmen and religious brotherhoods disillusioned with the Justice Party.\n\nWith its programme of heavy industry and moral development, the party became the kingmaker of Turkish politics after the 1973 election, joining coalitions with both Ecevit's CHP and Demirel's Nationalist Front. Its ministers seek to fill the state with believers while keeping one foot firmly in the parliamentary system."
 COLDWAR_TUR_1970_party_6_v3_icon:0 "£generic_Conservative_small"
 COLDWAR_TUR_1970_party_7_v0:0 "£generic_Autocracy_small Millî İstihbarat Teşkilâtı çevreleri"
 COLDWAR_TUR_1970_party_7_v0_desc:0 "(Security State Authoritarianism) - National Intelligence Organization Circles (Turkish: Millî İstihbarat Teşkilâtı çevreleri)\n\nEstablished in 1965 to replace the old National Security Service, the National Intelligence Organization has become a state within the state. Its officers keep files on student leaders, union militants and Kurdish activists, and maintain close ties to the CIA and to the army's Special Warfare Department.\n\nThose around the service believe that communism, not the ballot box, is the true threat facing Turkey. In the turmoil of 1970 they argue for emergency rule, censorship and the firm hand of professionals over squabbling politicians."
 COLDWAR_TUR_1970_party_7_v0_icon:0 "£generic_Autocracy_small"
 COLDWAR_TUR_1970_party_8_v0:0 "£generic_Mod_Vilayat_e_Faqih_small Caferî ıslahat çevreleri"
 COLDWAR_TUR_1970_party_8_v0_desc:0 "(Shia Reformism) - Ja'fari Reform Circles (Turkish: Caferî ıslahat çevreleri)\n\nIn the eastern provinces around Kars and Iğdır and in parts of Istanbul live Turkey's Ja'fari Shia, mostly of Azerbaijani origin, worshipping in a handful of mosques outside the reach of the Directorate of Religious Affairs. Their prayer leaders, many trained in Najaf or Tabriz, have long kept a low profile in the secular republic.\n\nA small circle of educated Ja'faris now seeks recognition, religious instruction in their own tradition and a voice in Ankara. They look with interest to the reformist thinkers of Iran and Iraq, yet remain a marginal current far from the centres of Turkish power."
 COLDWAR_TUR_1970_party_8_v0_icon:0 "£generic_Mod_Vilayat_e_Faqih_small"
 COLDWAR_TUR_1970_party_9_v0:0 "£generic_Vilayat_e_Faqih_small Devrimci velâyet çevreleri"
 COLDWAR_TUR_1970_party_9_v0_desc:0 "(Shia Theocracy) - Revolutionary Guardianship Circles (Turkish: Devrimci velâyet çevreleri)\n\nAmong a few young Shia students and clerics of eastern Anatolia, the lectures of Ayatollah Ruhollah Khomeini, delivered in exile in Najaf early in 1970 on the guardianship of the jurist, pass from hand to hand. To them the Shah and the Kemalist republic alike are servants of Western power.\n\nThe circle dreams of an Islamic order led by the learned clergy, but in secular Turkey it has neither legal status nor a mass following. It remains a clandestine study network, watched closely by the police and dismissed by most of the country's own Shia."
 COLDWAR_TUR_1970_party_9_v0_icon:0 "£generic_Vilayat_e_Faqih_small"
