 COLDWAR_TUR_1970_political_dossier:0 "Turkish Leadership Dossier"
 COLDWAR_TUR_1970_political_dossier_desc:0 "Choose a historically available political representative. Constitutional offices and military appointments remain separate. Availability dates never trigger political changes automatically."
 COLDWAR_TUR_1970_select_alparslan_turkes:0 "Select Alparslan Türkeş as Political Representative"
 COLDWAR_TUR_1970_select_alparslan_turkes_desc:0 "MHP leader in1970; no forced1980 political ban. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_TUR_1970_select_bulend_ulusu:0 "Select Bülend Ulusu as Political Representative"
 COLDWAR_TUR_1970_select_bulend_ulusu_desc:0 "Civilian prime minister reference1980–83; no fictional1970 naval uniform or active command from this portrait. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_TUR_1970_select_bulent_ecevit:0 "Select Bülent Ecevit as Political Representative"
 COLDWAR_TUR_1970_select_bulent_ecevit_desc:0 "CHP secretary-general in1970; chairman from14May1972. Selection before then is an alternate representative, not a claim of actual chairmanship. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_TUR_1970_select_faruk_gurler:0 "Select Ömer Faruk Gürler as Political Representative"
 COLDWAR_TUR_1970_select_faruk_gurler_desc:0 "Army commander from28August1970, later General Staff chief. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_TUR_1970_select_ismet_inonu:0 "Select İsmet İnönü as Political Representative"
 COLDWAR_TUR_1970_select_ismet_inonu_desc:0 "Actual CHP chairman at1970 start, elder statesman after1972. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_TUR_1970_select_kenan_evren:0 "Select Ahmet Kenan Evren as Political Representative"
 COLDWAR_TUR_1970_select_kenan_evren_desc:0 "Contemporary serving general. Later head-of-state role requires human selection; no automatic1980 coup. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_TUR_1970_select_memduh_tagmac:0 "Select Memduh Tağmaç as Political Representative"
 COLDWAR_TUR_1970_select_memduh_tagmac_desc:0 "Chief of General Staff at1970 start. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_TUR_1970_select_necmettin_erbakan:0 "Select Necmettin Erbakan as Political Representative"
 COLDWAR_TUR_1970_select_necmettin_erbakan_desc:0 "Independent at scenario start, MNP from26January1970, later MSP; no future AKP identity. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_TUR_1970_select_nihat_erim:0 "Select Nihat Erim as Political Representative"
 COLDWAR_TUR_1970_select_nihat_erim_desc:0 "Civilian law professor and1971–72 prime minister; assassination is not scheduled. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_TUR_1970_select_semih_sancar:0 "Select Semih Sancar as Political Representative"
 COLDWAR_TUR_1970_select_semih_sancar_desc:0 "Second Army before army command; General Staff chief from1973. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_TUR_1970_select_suleyman_demirel:0 "Select Süleyman Demirel as Political Representative"
 COLDWAR_TUR_1970_select_suleyman_demirel_desc:0 "AP leader. No forced1971 or1980 removal or ban. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
 COLDWAR_TUR_1970_select_turgut_ozal:0 "Select Turgut Özal as Political Representative"
 COLDWAR_TUR_1970_select_turgut_ozal_desc:0 "Economic technocrat in1970; ANAP representation only from20May1983. No early ANAP label. This changes the current political representative only. It does not change the governing party, appoint a president, trigger a coup, call an election or grant a reward."
