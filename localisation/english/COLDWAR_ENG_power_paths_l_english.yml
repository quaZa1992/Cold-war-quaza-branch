l_english:
 # IMPERIA COLD WAR — P5 power paths 24.11.2026: UK crisis, commission and succession foci
 COLDWAR_ENG_CRISIS_pending_tt:0 "The constitutional crisis is still undecided."
 COLDWAR_ENG_MINOR_COMMUNIST_cp_crisis_royal_household:0 "Guard the Royal Household"
 COLDWAR_ENG_MINOR_COMMUNIST_cp_crisis_royal_household_desc:0 "The royal family is held under guard while the ministries change hands. Every hour the household remains in the government's custody raises the stakes for the officers who still hesitate."
 COLDWAR_ENG_MINOR_COMMUNIST_cp_crisis_garrisons:0 "Count the Garrisons"
 COLDWAR_ENG_MINOR_COMMUNIST_cp_crisis_garrisons_desc:0 "Reports from Aldershot, Catterick and the Home Counties decide who controls the capital. The government must know which commanders will obey before it can hold the streets."
 COLDWAR_ENG_MINOR_COMMUNIST_cp_crisis_revolution_holds:0 "The Revolution Holds"
 COLDWAR_ENG_MINOR_COMMUNIST_cp_crisis_revolution_holds_desc:0 "The government breaks the hesitation of the barracks, ends the monarchy and places the state under a revolutionary council. There will be no return to the old settlement."
 COLDWAR_ENG_MINOR_COMMUNIST_cp_crisis_countercoup:0 "The Army Strikes Back"
 COLDWAR_ENG_MINOR_COMMUNIST_cp_crisis_countercoup_desc:0 "Loyal regiments storm the ministries and free the surviving royal family. A caretaker council of officers and senior officials takes control until the Crown can name a government."
 COLDWAR_ENG_MINOR_INTERVENTION_return_commission:0 "Return the Commission"
 COLDWAR_ENG_MINOR_INTERVENTION_return_commission_desc:0 "The caretaker council declines to give the emergency a permanent form. Mountbatten returns the Crown's commission and the parties are asked to prepare for a free election."
 COLDWAR_ENG_MOUNTBATTEN_commission_open_tt:0 "The Crown's commission has not been accepted."
 COLDWAR_ENG_MOUNTBATTEN_nomination_open_tt:0 "The council is nominating a successor to the commission."
 COLDWAR_ENG_MOUNTBATTEN_nomination_opens_tt:0 "Opens the §Ysuccessor nomination§! foci."
 COLDWAR_ENG_MOUNTBATTEN_nominee_carver_tt:0 "Michael Carver is available."
 COLDWAR_ENG_MOUNTBATTEN_nominee_pym_tt:0 "Francis Pym is available."
 COLDWAR_ENG_MOUNTBATTEN_nominee_lewin_tt:0 "Terence Lewin is available."
 COLDWAR_ENG_MOUNTBATTEN_nominee_carrington_tt:0 "Lord Carrington is available."
 COLDWAR_ENG_MOUNTBATTEN_nominee_walker_tt:0 "Walter Walker is available."
 COLDWAR_ENG_MOUNTBATTEN_nominee_tyndall_tt:0 "John Tyndall is available."
 COLDWAR_ENG_MOUNTBATTEN_nominee_heir_tt:0 "The chosen heir of the Crown is of age and alive."
 COLDWAR_ENG_MOUNTBATTEN_nominate_carver:0 "Nominate Michael Carver"
 COLDWAR_ENG_MOUNTBATTEN_nominate_carver_desc:0 "Carver offers an orderly service administration with firmer professional limits upon the executive."
 COLDWAR_ENG_MOUNTBATTEN_nominate_pym:0 "Nominate Francis Pym"
 COLDWAR_ENG_MOUNTBATTEN_nominate_pym_desc:0 "Pym offers parliamentary management and a wider hearing within the restricted chamber."
 COLDWAR_ENG_MOUNTBATTEN_nominate_lewin:0 "Nominate Terence Lewin"
 COLDWAR_ENG_MOUNTBATTEN_nominate_lewin_desc:0 "The Admiral stands for continuity: the commission's order, the alliance and the services as they are."
 COLDWAR_ENG_MOUNTBATTEN_nominate_carrington:0 "Nominate Lord Carrington"
 COLDWAR_ENG_MOUNTBATTEN_nominate_carrington_desc:0 "Carrington would keep the council's course while repairing Britain's standing abroad."
 COLDWAR_ENG_MOUNTBATTEN_nominate_walker:0 "Nominate Walter Walker"
 COLDWAR_ENG_MOUNTBATTEN_nominate_walker_desc:0 "General Walker promises a national state ruled by the services. The chamber and the courts would lose what little voice they kept."
 COLDWAR_ENG_MOUNTBATTEN_nominate_tyndall:0 "Nominate John Tyndall"
 COLDWAR_ENG_MOUNTBATTEN_nominate_tyndall_desc:0 "The radical right asks for the commission. Its rule would rest on fear and on the streets rather than on the Crown."
 COLDWAR_ENG_MOUNTBATTEN_nominate_heir:0 "Invite the Heir to Govern"
 COLDWAR_ENG_MOUNTBATTEN_nominate_heir_desc:0 "The council asks the chosen heir to exercise the royal executive in person, binding the commission to the Crown itself."
 COLDWAR_ENG_MOUNTBATTEN.6.d_nomination:0 "The commission survives its first holder, but no one around the table can inherit Mountbatten's standing by taking his seat. An interim council holds the executive until the nomination is settled."
 COLDWAR_ENG_MOUNTBATTEN.6.a:0 "The council will nominate a successor."
