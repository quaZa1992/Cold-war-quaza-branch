l_english:
# IMPERIA CW — Cold War: USA bahrain base — English localisation.
 COLDWAR_USA_bahrain_base_request:0 "Bahrain Naval Base"
 COLDWAR_USA_bahrain_base_request_desc:0 "A naval station in Bahrain would give our forces a foothold in the Persian Gulf. We should seek the ruler's agreement to transfer the designated base district to the United States."
 COLDWAR_USA_bahrain_base_request_tt:0 "Send a naval basing proposal to Bahrain. Its government decides whether to accept."
 COLDWAR_USA_bahrain_base_accept_tt:0 "If Bahrain accepts:"
 COLDWAR_USA_bahrain_base_refuse_tt:0 "If Bahrain refuses:"
 COLDWAR_USA_bahrain_base_refused_opinion:0 "Bahrain Rejected Our Basing Proposal"
 COLDWAR_USA_Bahrain.1.t:0 "An American Naval Station?"
 COLDWAR_USA_Bahrain.1.d:0 "Washington seeks a naval foothold in the Persian Gulf and has requested ownership of the designated base district. Our government must decide whether to cede the site to the United States."
 COLDWAR_USA_Bahrain.1.a:0 "Transfer the base district to the United States."
 COLDWAR_USA_Bahrain.1.b:0 "Keep the site under Bahraini administration."
 COLDWAR_USA_Bahrain.1.c:0 "Circumstances no longer permit an agreement."
 COLDWAR_USA_Bahrain.2.t:0 "Bahrain Approves the Naval Station"
 COLDWAR_USA_Bahrain.2.d:0 "The government in Manama has approved our proposal. The agreed base district has been transferred to American administration, establishing our naval foothold in Bahrain."
 COLDWAR_USA_Bahrain.2.a:0 "An anchor in the Gulf."
 COLDWAR_USA_Bahrain.3.t:0 "Bahrain Refuses the Basing Proposal"
 COLDWAR_USA_Bahrain.3.d:0 "Bahrain has declined our request and will retain the proposed site. The disagreement has strained Washington's relations with Manama."
 COLDWAR_USA_Bahrain.3.a:0 "A diplomatic setback."
 COLDWAR_USA_Bahrain.4.t:0 "Bahrain Basing Talks Cannot Proceed"
 COLDWAR_USA_Bahrain.4.d:0 "The conditions for the proposed Bahrain naval station no longer hold. The talks have closed without a transfer or a refusal penalty."
 COLDWAR_USA_Bahrain.4.a:0 "Close the file."
