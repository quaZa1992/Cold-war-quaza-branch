l_english:
# IMPERIA CW — Cold War: historical ENG 1985 — English localisation.
 ENG_1985_focus: "United Kingdom 1985"
 ENG_1985_focus_desc: "The British state enters 1985 with a strong government, a wounded industrial base, an embattled Union and a financial future being forced open."
 ENG_conservative_shortcut: "Conservative"
 ENG_labour_shortcut: "Labour"
 ENG_hard_left_shortcut: "Hard Left"
 ENG_alliance_shortcut: "Alliance"
 ENG_nationalist_shortcut: "Nationalist"
 ENG_union_shortcut: "Union"
 ENG_development_shortcut: "National Development"
 ENG_a_kingdom_under_strain: "A Kingdom Under Strain"
 ENG_a_kingdom_under_strain_desc: "The strike is over, the government still stands, and the realm looks orderly from a distance. Up close, Britain is full of pressure lines."
 ENG_a_kingdom_under_strain_tt: "Activates the 1985 United Kingdom systems: the Union Question, Ulster briefings and the governing-route mechanics."
 ENG_1985_setup_ira_mechanic_tt: "Activates the 1985 United Kingdom political, Union and Ulster systems, and applies baseline post-industrial strain to the old coal, steel and heavy-industry regions."
 ENG_take_stock_of_the_realm: "Take Stock of the Realm"
 ENG_take_stock_of_the_realm_desc: "Whitehall must know what is still strong, what has merely survived, and what is already cracking."
 ENG_count_the_cost_of_the_strike: "Count the Cost of the Strike"
 ENG_count_the_cost_of_the_strike_desc: "The miners' strike has ended, but its bitterness remains in the coalfields, the unions and the cabinet."
 ENG_guard_the_mainland: "Guard the Mainland"
 ENG_guard_the_mainland_desc: "The security services are watching the ferry ports, railway stations, army barracks and political offices. Northern Ireland is not contained by the water."
 ENG_guard_the_mainland_tt: "Unlocks Ulster-related decisions and tightens the security side of the Troubles system."
 ENG_face_the_union_question: "Face the Union Question"
 ENG_face_the_union_question_desc: "The United Kingdom remains intact. That does not mean it remains unquestioned."
 ENG_face_the_union_question_tt: "Updates the visible Union Question spirit according to the current Union score."
 ENG_the_city_and_the_workshop: "The City and the Workshop"
 ENG_the_city_and_the_workshop_desc: "Britain must decide whether its future lies above all in the trading floors of London or in the repair of its industrial base."
 ENG_the_city_and_the_workshop_tt: "Activates the City and Workshop balance of power."
 ENG_the_european_argument: "The European Argument"
 ENG_the_european_argument_desc: "Europe is not a side issue. It is a trade question, a sovereignty question and an ideological argument inside every party."
 ENG_the_atlantic_habit: "The Atlantic Habit"
 ENG_the_atlantic_habit_desc: "The habit of looking across the Atlantic is older than this government and deeper than one prime minister."
 ENG_prepare_for_the_next_contest: "Prepare for the Next Contest"
 ENG_prepare_for_the_next_contest_desc: "The next national contest will not merely decide a government. It may decide what sort of state Britain intends to be."
 ENG_prepare_for_the_next_contest_tt: "Prepares the Conservative, SDP-Liberal Alliance and Nationalist routes. Labour and CPGB routes are opened directly by their own governments."
 ENG_national_development_programme: "National Development Programme"
 ENG_national_development_programme_desc: "Britain needs roads, railways, ports, cables, energy reliability and regional repair no matter which party holds Downing Street."
 ENG_modernise_transport_network: "Modernise the Transport Network"
 ENG_modernise_transport_network_desc: "The road and rail map still carries the shape of older industry. Modernisation can help the whole country move, but the Treasury will feel it first."
 ENG_north_sea_service_economy: "North Sea Service Economy"
 ENG_north_sea_service_economy_desc: "Oil is not only a revenue stream. It creates engineering, insurance, logistics and service work that can anchor a wider British supply chain."
 ENG_british_rail_modernisation: "British Rail Modernisation"
 ENG_british_rail_modernisation_desc: "Electrification, signalling and intercity capacity will not undo deindustrialisation, but they can keep battered regions connected to new work."
 ENG_channel_tunnel_question: "The Channel Tunnel Question"
 ENG_channel_tunnel_question_desc: "A fixed link to France is commercially tempting, politically sensitive and symbolically enormous for Britain's place in Europe."
 ENG_m25_and_regional_roads: "M25 and Regional Roads"
 ENG_m25_and_regional_roads_desc: "The South East's orbital economy is becoming real. Regional roads keep the programme from looking like a single-county future."
 ENG_offshore_supply_chain: "Offshore Supply Chain"
 ENG_offshore_supply_chain_desc: "The North Sea can feed machine shops, yards and specialist firms rather than disappearing into Treasury tables alone."
 ENG_telecom_and_cable_networks: "Telecom and Cable Networks"
 ENG_telecom_and_cable_networks_desc: "Switchboards, fibre routes and data infrastructure are becoming as important to the modern economy as roads and rail."
 ENG_regional_airports_and_ports: "Regional Airports and Ports"
 ENG_regional_airports_and_ports_desc: "A trading island cannot leave its secondary gateways to decay. Ports and regional airports give struggling regions access to markets."
 ENG_energy_grid_reliability: "Energy Grid Reliability"
 ENG_energy_grid_reliability_desc: "A service economy still needs dependable power. Grid reliability lowers friction across industry, households and offices alike."
 ENG_university_research_corridor: "University Research Corridor"
 ENG_university_research_corridor_desc: "Britain's universities can become a stronger bridge between scientific talent, technology firms and exportable expertise."
 ENG_urban_regeneration_boards: "Urban Regeneration Boards"
 ENG_urban_regeneration_boards_desc: "The old industrial cities cannot be fixed by slogans. Boards, grants and targeted works can soften decline without erasing it."
 ENG_public_private_capital_works: "Public-Private Capital Works"
 ENG_public_private_capital_works_desc: "Private capital can help build what the state cannot fully fund, provided Whitehall accepts the compromises that come with it."
 ENG_britain_built_to_compete: "Britain Built to Compete"
 ENG_britain_built_to_compete_desc: "A modern British economy needs more than one winning region. Connectivity, research, energy and targeted regeneration must become one programme."
 ENG_1985_activate_development_programme_tt: "Unlocks the §YNational Development§! decisions and adds a party-independent dynamic modifier that grows through infrastructure, energy, research and regional buildout focuses."
 ENG_1985_shift_development_balance_tt: "This development choice shifts the active economic balance toward the side it naturally favours."
 ENG_second_thatcher_government: "The Second Thatcher Government"
 ENG_second_thatcher_government_desc: "Thatcher's majority is large enough to reshape Britain, but every revolution creates its own resistance."
 ENG_cabinet_programme_committee: "Cabinet Programme Committee"
 ENG_cabinet_programme_committee_desc: "The government turns its mandate into a ranked programme of privatisation, local government reform and security policy."
 ENG_whitehall_delivery_machine: "Whitehall Delivery Machine"
 ENG_whitehall_delivery_machine_desc: "Whitehall is pressed into a tighter delivery rhythm. The machinery works faster, but not without administrative cost."
 ENG_finish_what_we_started: "Finish What We Started"
 ENG_finish_what_we_started_desc: "The first term broke the old consensus. The second must make reversal impossible."
 ENG_regional_balance_sheet: "Regional Balance Sheet"
 ENG_regional_balance_sheet_desc: "Whitehall maps the country Thatcher intends to remake: London and the South East ready for capital, the coalfields and older industrial regions already carrying the cost."
 ENG_regional_balance_sheet_tt: "§YRegional starting pressure is already active.§! Yorkshire, Northern England, the Midlands, Wales and parts of Scotland begin with a stronger §YPost-Industrial Strain§!. Later Thatcher focuses can add harsher regional damage, while enterprise zones only soften the decline rather than turning those states into boom regions."
 ENG_tame_the_last_militants: "Tame the Last Militants"
 ENG_tame_the_last_militants_desc: "The hard left, the strike committees and the streets must all learn that the elected government will not bend."
 ENG_close_the_old_pits: "Close the Old Pits"
 ENG_close_the_old_pits_desc: "The government will not subsidise coalfields it considers economically exhausted. The Treasury gains room, but already strained industrial regions carry the shock."
 ENG_close_the_old_pits_regional_tt: "Adds §YAccelerated Deindustrialisation§! on top of the existing §YPost-Industrial Strain§! in the old coal and heavy-industry regions."
 ENG_selective_enterprise_zones: "Selective Enterprise Zones"
 ENG_selective_enterprise_zones_desc: "Targeted tax relief and light planning rules can soften the damage in old industrial districts without restoring the old corporatist bargain."
 ENG_selective_enterprise_zones_regional_tt: "Replaces the harsher regional collapse with a milder §YEnterprise Zone Relief§! debuff. These states improve, but they do not become positive growth regions."
 ENG_wapping_and_the_print_unions: "Wapping and the Print Unions"
 ENG_wapping_and_the_print_unions_desc: "The print unions become the next test of industrial authority. A victory proves the model; the confrontation deepens the wound."
 ENG_urban_development_corporations: "Urban Development Corporations"
 ENG_urban_development_corporations_desc: "The old industrial map cannot simply be wished away. Development corporations can build islands of renewal without returning power to the old councils."
 ENG_urban_development_corporations_regional_tt: "Adds limited infrastructure or office investment while keeping old industrial regions under pressure. This is regeneration by selected zones, not a national industrial settlement."
 ENG_rate_capping_the_councils: "Rate-Cap the Councils"
 ENG_rate_capping_the_councils_desc: "Local government spending will be forced back under Treasury discipline, even if Labour councils make the confrontation public."
 ENG_nhs_efficiency_drive: "NHS Efficiency Drive"
 ENG_nhs_efficiency_drive_desc: "Health spending is held to stricter expectations while administrative pressure rises. The books improve before the waiting rooms do."
 ENG_general_management_in_the_nhs: "General Management in the NHS"
 ENG_general_management_in_the_nhs_desc: "Hospitals will be made to manage budgets, targets and performance as seriously as care. The reform promises discipline before comfort."
 ENG_internal_market_preparations: "Internal Market Preparations"
 ENG_internal_market_preparations_desc: "The next NHS settlement is being prepared around purchasers, providers and managerial pressure. It is reform by ledger and timetable."
 ENG_compulsory_competitive_tendering: "Compulsory Competitive Tendering"
 ENG_compulsory_competitive_tendering_desc: "Public services will have to prove they can compete with private contractors. The state shrinks by making its own arms bid for survival."
 ENG_abolish_the_metropolitan_councils: "Abolish the Metropolitan Councils"
 ENG_abolish_the_metropolitan_councils_desc: "The big urban councils are hostile, expensive and politically useful targets. Westminster will take the fight to local government."
 ENG_right_to_buy_expansion: "Expand Right to Buy"
 ENG_right_to_buy_expansion_desc: "Council tenants can become homeowners, and homeowners can become Conservative voters. The housing stock will never look the same."
 ENG_scottish_community_charge_trial: "Scottish Community Charge Trial"
 ENG_scottish_community_charge_trial_desc: "A flat local charge promises simplicity and Treasury discipline. Testing it first in Scotland risks turning tax policy into a Union crisis."
 ENG_delay_the_community_charge: "Delay the Community Charge"
 ENG_delay_the_community_charge_desc: "The reform can wait until the political ground is less explosive. It costs money, but avoids making Scotland the test site for anger."
 ENG_property_owning_democracy: "Property-Owning Democracy"
 ENG_property_owning_democracy_desc: "Privatisation and housing sales are meant to create voters with a stake in the market order."
 ENG_local_government_settlement: "Local Government Settlement"
 ENG_local_government_settlement_desc: "After confrontation, the new settlement must be made administratively workable. Central control is only useful if it can last."
 ENG_north_sea_receipts: "North Sea Receipts"
 ENG_north_sea_receipts_desc: "Oil revenue can fund tax cuts, privatisation costs and the social price of restructuring. It is a cushion, not a strategy."
 ENG_sell_the_commanding_heights: "Sell the Commanding Heights"
 ENG_sell_the_commanding_heights_desc: "The state should not command industry. It should sell, regulate lightly and let ownership discipline performance."
 ENG_docklands_and_m25: "Docklands and the M25"
 ENG_docklands_and_m25_desc: "The new service economy needs roads, offices and a London gateway built for capital rather than coal."
 ENG_docklands_and_m25_regional_tt: "Strengthens London and the South East through offices, infrastructure and service-sector growth while increasing the visible divide with the old industrial regions."
 ENG_prepare_the_big_bang: "Prepare the Big Bang"
 ENG_prepare_the_big_bang_desc: "London's financial markets are ready for a shock. Whether that shock is renewal or fever now depends on the rules ministers chose beforehand."
 ENG_computerised_trading_rooms: "Computerised Trading Rooms"
 ENG_computerised_trading_rooms_desc: "The City is becoming faster, louder and more electronic. The old club can become a global machine."
 ENG_city_invite_foreign_banks: "Invite Foreign Banks"
 ENG_city_invite_foreign_banks_desc: "American, Japanese and European banks can turn London into the preferred market gateway, if the City is ready to be remade by them."
 ENG_invisible_exports_strategy: "Invisible Exports Strategy"
 ENG_invisible_exports_strategy_desc: "Britain may no longer dominate the workshop, but finance, insurance and services can still earn the world in sterling."
 ENG_the_hillsborough_route: "The Hillsborough Route"
 ENG_the_hillsborough_route_desc: "An Anglo-Irish understanding may calm one part of the crisis while enraging another."
 ENG_hold_fast_to_nato: "Hold Fast to NATO"
 ENG_hold_fast_to_nato_desc: "The Soviet threat has not vanished because London has domestic troubles. NATO remains the first line."
 ENG_greenham_common_deployment: "Greenham Common Deployment"
 ENG_greenham_common_deployment_desc: "Cruise missiles at Greenham Common tie Britain tightly to NATO strategy, but they also keep the anti-nuclear movement alive at home."
 ENG_baor_rhine_commitment: "BAOR Rhine Commitment"
 ENG_baor_rhine_commitment_desc: "The British Army of the Rhine remains a visible promise that Britain will stand in Germany before any crisis reaches the Channel."
 ENG_lessons_of_the_falklands: "Lessons of the Falklands"
 ENG_lessons_of_the_falklands_desc: "The South Atlantic campaign proved that reach, logistics, carriers and political will still matter."
 ENG_integrated_air_defence: "Integrated Air Defence"
 ENG_integrated_air_defence_desc: "NATO readiness depends on radar, aircraft, procedures and command systems that work before the alarm bells ring."
 ENG_royal_navy_modernisation: "Royal Navy Modernisation"
 ENG_royal_navy_modernisation_desc: "The fleet needs escorts, refits, submarines and dockyard capacity suited to the North Atlantic and expeditionary operations."
 ENG_bae_and_tornado_orders: "BAe and Tornado Orders"
 ENG_bae_and_tornado_orders_desc: "Defence orders keep advanced industry alive outside the City while binding British procurement to NATO air doctrine."
 ENG_intelligence_with_washington: "Intelligence with Washington"
 ENG_intelligence_with_washington_desc: "The closest parts of the special relationship are rarely announced. They are briefed, shared and acted upon."
 ENG_north_atlantic_fleet_exercises: "North Atlantic Fleet Exercises"
 ENG_north_atlantic_fleet_exercises_desc: "The GIUK gap is still one of the cold war's hard frontiers. The Royal Navy must train for it."
 ENG_nato_readiness_reviews: "NATO Readiness Reviews"
 ENG_nato_readiness_reviews_desc: "Readiness is not a speech. It is stores, rotations, reserve plans and commanders who know what happens on day one."
 ENG_reagan_thatcher_security_axis: "Reagan-Thatcher Security Axis"
 ENG_reagan_thatcher_security_axis_desc: "London and Washington can turn shared anti-communism into a security axis spanning intelligence, procurement and diplomacy."
 ENG_trident_procurement_board: "Trident Procurement Board"
 ENG_trident_procurement_board_desc: "Trident is not simply a weapon programme. It is a long, expensive pledge to remain a nuclear power."
 ENG_renew_the_deterrent: "Renew the Deterrent"
 ENG_renew_the_deterrent_desc: "The independent deterrent is costly, controversial and central to Britain's great-power identity."
 ENG_guardians_of_the_north_atlantic: "Guardians of the North Atlantic"
 ENG_guardians_of_the_north_atlantic_desc: "A Britain built around NATO must be able to hold the sea lanes that keep Europe supplied."
 ENG_enterprise_above_all: "Enterprise Above All"
 ENG_enterprise_above_all_desc: "The state has done enough. The private sector must be freed to act with speed."
 ENG_enterprise_above_all_regional_tt: "Deepens the London/South East growth model and worsens the adjustment burden in old industrial regions."
 ENG_one_nation_interlude: "A One Nation Interlude"
 ENG_one_nation_interlude_desc: "Markets can move quickly, but the country cannot be treated as ballast."
 ENG_one_nation_interlude_regional_tt: "Keeps a market-led programme but uses enterprise-zone relief to soften regional pressure."
 ENG_private_regeneration_bonds: "Private Regeneration Bonds"
 ENG_private_regeneration_bonds_desc: "The old industrial towns cannot be revived by sentiment, but the Treasury will not write a blank cheque. Private bonds, local boards and selective guarantees offer a costly halfway house."
 ENG_rebuild_the_old_industrial_towns: "Rebuild the Old Industrial Towns"
 ENG_rebuild_the_old_industrial_towns_desc: "A market government can still decide that certain places are too damaged to abandon. This is not a boom programme; it is a long, expensive repair bill."
 ENG_shareholder_britain: "Shareholder Britain"
 ENG_shareholder_britain_desc: "Privatisation is not only a sale. It is meant to make a property-owning democracy."
 ENG_tell_sid_to_buy: "Tell Sid to Buy"
 ENG_tell_sid_to_buy_desc: "The British Gas sale turns privatisation into mass politics. The public is invited to buy a stake in the new order."
 ENG_british_airways_sale: "British Airways Sale"
 ENG_british_airways_sale_desc: "A leaner national airline can be sold as proof that state industries can be remade before they are sold."
 ENG_water_and_electricity_white_papers: "Water and Electricity White Papers"
 ENG_water_and_electricity_white_papers_desc: "The next utilities are being prepared for market discipline. The state retreats from pipes, grids and household bills."
 ENG_regulate_the_new_utilities: "Regulate the New Utilities"
 ENG_regulate_the_new_utilities_desc: "Privatised monopolies still need watchdogs. Without them, popular capitalism becomes a bill shock."
 ENG_popular_capitalism: "Popular Capitalism"
 ENG_popular_capitalism_desc: "The project now reaches beyond selling assets. It seeks to make market ownership a social identity."
 ENG_the_second_revolution: "The Second Revolution"
 ENG_the_second_revolution_desc: "The Thatcher project can now become more than a government programme. It can become the new national settlement."
 ENG_the_atlantic_market_state: "The Atlantic Market State"
 ENG_the_atlantic_market_state_desc: "The City, the alliance and the security state are drawn into one governing formula."
 ENG_thatcherite_settlement: "The Thatcherite Settlement"
 ENG_thatcherite_settlement_desc: "After years of confrontation, privatisation and rearmament, the government tries to make its revolution permanent."
 ENG_kinnocks_mandate: "Kinnock's Mandate"
 ENG_kinnocks_mandate_desc: "Labour must become credible again without becoming empty. That is a narrow road."
 ENG_after_the_1983_disaster: "After the 1983 Disaster"
 ENG_after_the_1983_disaster_desc: "The longest suicide note in history still haunts Labour, and every faction has a different lesson to draw from it."
 ENG_end_the_long_suicide_note: "End the Long Suicide Note"
 ENG_end_the_long_suicide_note_desc: "The party cannot win by relitigating its deepest defeat."
 ENG_break_with_militancy: "Break with Militancy"
 ENG_break_with_militancy_desc: "The movement must be broad enough to govern and disciplined enough not to frighten the country."
 ENG_liverpool_militant_crisis: "Liverpool Militant Crisis"
 ENG_liverpool_militant_crisis_desc: "Liverpool turns Labour's internal conflict into a national test of authority, democracy and electability."
 ENG_purge_the_extremists: "Purge the Extremists"
 ENG_purge_the_extremists_desc: "The leadership draws a hard line against entryism and makes governability the price of influence."
 ENG_empower_the_grassroots: "Empower the Grassroots"
 ENG_empower_the_grassroots_desc: "The left argues that Labour should answer Thatcherism with deeper democracy, not managerial caution."
 ENG_one_member_one_vote: "One Member, One Vote"
 ENG_one_member_one_vote_desc: "The union block vote is trimmed back and party members are given a clearer voice. Labour gains credibility, but the old movement notices the shift."
 ENG_responsible_opposition_machine: "Responsible Government Machine"
 ENG_responsible_opposition_machine_desc: "Labour needs discipline in the Commons, discipline in the press office and discipline in the numbers if it wants to govern through the post-Thatcher settlement."
 ENG_media_professionalisation: "Media Professionalisation"
 ENG_media_professionalisation_desc: "Labour learns that the evening news can punish a loose phrase as harshly as a lost vote."
 ENG_a_responsible_social_contract: "A Responsible Social Contract"
 ENG_a_responsible_social_contract_desc: "The unions cannot simply be smashed or obeyed. They must be bound into a credible national settlement."
 ENG_restore_union_partnership: "Restore Union Partnership"
 ENG_restore_union_partnership_desc: "The union movement is brought back into government, but under rules that must prove they can hold."
 ENG_repeal_the_worst_union_laws: "Repeal the Worst Union Laws"
 ENG_repeal_the_worst_union_laws_desc: "Labour rolls back the sharpest anti-union measures without pretending the 1970s can simply return."
 ENG_social_contract_mk2: "Social Contract Mk II"
 ENG_social_contract_mk2_desc: "Pay discipline, workplace rights and investment promises are tied into a new bargain with organised labour."
 ENG_deal_with_scargill: "Deal with Scargill"
 ENG_deal_with_scargill_desc: "The miners' movement must be respected, but Labour cannot allow one defeat to define its whole industrial policy."
 ENG_the_miners_remember: "The Miners Remember"
 ENG_the_miners_remember_desc: "The coalfields did not forget the strike. A Labour government cannot rebuild without acknowledging that wound."
 ENG_attack_privatisation: "Attack Privatisation"
 ENG_attack_privatisation_desc: "Privatisation becomes Labour's symbol for a country sold too cheaply and governed too narrowly."
 ENG_the_social_cost_of_thatcherism: "The Social Cost of Thatcherism"
 ENG_the_social_cost_of_thatcherism_desc: "Labour turns unemployment, council cuts and service strain into a national indictment."
 ENG_poll_tax_momentum: "Poll Tax Momentum"
 ENG_poll_tax_momentum_desc: "The Community Charge becomes proof that Labour can organise public anger into a governing majority."
 ENG_defend_the_north: "Defend the North"
 ENG_defend_the_north_desc: "The northern industrial regions receive visible attention before another generation concludes Westminster has written them off."
 ENG_northern_city_compacts: "Northern City Compacts"
 ENG_northern_city_compacts_desc: "City regions, councils, colleges and unions are tied into practical regeneration deals."
 ENG_labour_policy_review: "The Policy Review"
 ENG_labour_policy_review_desc: "Credibility will be rebuilt plank by plank, with old slogans translated into a programme that can survive an election."
 ENG_shadow_budget: "Treasury Credibility"
 ENG_shadow_budget_desc: "The programme is costed line by line so Labour can answer the Treasury question before markets turn it into a crisis."
 ENG_technology_and_training: "Technology and Training"
 ENG_technology_and_training_desc: "A modern social democracy needs skilled workers, not only restored factories."
 ENG_silicon_glen_and_universities: "Silicon Glen and Universities"
 ENG_silicon_glen_and_universities_desc: "Electronics, universities and regional skills policy give Labour a modern industrial story."
 ENG_the_public_contract: "The Public Contract"
 ENG_the_public_contract_desc: "The argument is no longer state against market. It is whether public services can earn trust again."
 ENG_public_sector_pay_review: "Public Sector Pay Review"
 ENG_public_sector_pay_review_desc: "Public sector morale cannot be rebuilt with slogans, but a pay settlement will test the budget immediately."
 ENG_cnd_conference: "The CND Conference"
 ENG_cnd_conference_desc: "Nuclear disarmament is not a footnote. It cuts through Labour's members, voters, allies and defence brief."
 ENG_unilateral_disarmament: "Unilateral Disarmament"
 ENG_unilateral_disarmament_desc: "A left Labour government can make Britain non-nuclear, but Washington and NATO will not treat it as symbolism."
 ENG_keep_the_deterrent: "Keep the Deterrent"
 ENG_keep_the_deterrent_desc: "The deterrent is retained to prove Labour can govern inside the alliance, even if parts of the movement hate the choice."
 ENG_shadow_defence_review: "Defence Policy Review"
 ENG_shadow_defence_review_desc: "Defence policy is rebuilt as a serious government brief rather than a recurring conference ambush."
 ENG_modernise_the_movement: "Modernise the Movement"
 ENG_modernise_the_movement_desc: "Labour can keep its moral language while learning to speak again to the median voter."
 ENG_restore_the_public_stake: "Restore the Public Stake"
 ENG_restore_the_public_stake_desc: "The public has a right to shape the economy that shapes its towns."
 ENG_shadow_the_treasury: "Treasury Discipline"
 ENG_shadow_the_treasury_desc: "The City will not trust Labour because Labour asks nicely. It must be shown numbers, discipline and restraint."
 ENG_election_messaging_grid: "The Election Messaging Grid"
 ENG_election_messaging_grid_desc: "Message discipline is not glamorous, but it keeps the week from being dictated by hostile newspapers."
 ENG_the_sun_problem: "The Sun Problem"
 ENG_the_sun_problem_desc: "Hostile papers cannot be wished away. Labour must decide whether to court them, outflank them or endure them."
 ENG_keep_kinnockite_labour: "Keep Kinnockite Labour"
 ENG_keep_kinnockite_labour_desc: "The party can be modern and still recognisably Labour, if the leadership refuses both nostalgia and surrender."
 ENG_prepare_the_1992_campaign: "Prepare the 1992 Campaign"
 ENG_prepare_the_1992_campaign_desc: "Labour tries to turn competence, public services and anti-Thatcher anger into a disciplined election machine."
 ENG_new_labour_generation: "A New Labour Generation"
 ENG_new_labour_generation_desc: "A younger leadership argues that Labour must not merely recover, but rebrand the meaning of centre-left government."
 ENG_brownite_fiscal_rules: "Brownite Fiscal Rules"
 ENG_brownite_fiscal_rules_desc: "The Treasury brief becomes a weapon: prudence first, room for reform later."
 ENG_black_wednesday_lessons: "Black Wednesday Lessons"
 ENG_black_wednesday_lessons_desc: "The sterling crisis teaches Labour that monetary credibility can destroy a government faster than ideology can save it."
 ENG_clause_four_rewrite: "Rewrite Clause Four"
 ENG_clause_four_rewrite_desc: "The old constitutional pledge to common ownership is replaced with a language of opportunity, rights and disciplined markets."
 ENG_blairite_media_operation: "Blairite Media Operation"
 ENG_blairite_media_operation_desc: "The news cycle becomes a battlefield of timing, message grids and carefully placed lines."
 ENG_bank_of_england_independence: "Bank of England Independence"
 ENG_bank_of_england_independence_desc: "Giving the Bank operational independence reassures markets and binds Labour to anti-inflation credibility."
 ENG_welfare_to_work: "Welfare to Work"
 ENG_welfare_to_work_desc: "Benefits are tied to training, job search and activation. It is reform with both social-democratic and disciplinary edges."
 ENG_third_way_politics: "Third Way Politics"
 ENG_third_way_politics_desc: "Market confidence, social investment and message discipline are fused into a new governing style."
 ENG_stakeholder_society: "Stakeholder Society"
 ENG_stakeholder_society_desc: "Rights, responsibilities and social investment are presented as the civic bargain behind a modern market economy."
 ENG_cool_britannia: "Cool Britannia"
 ENG_cool_britannia_desc: "Culture, media fluency and a younger national image become political capital for New Labour."
 ENG_new_labour_new_britain: "New Labour, New Britain"
 ENG_new_labour_new_britain_desc: "The party presents itself as a national renewal project rather than a restoration of the pre-Thatcher settlement."
 ENG_financial_services_compact: "Financial Services Compact"
 ENG_financial_services_compact_desc: "The City is not broken; it is bargained with, taxed and folded into Labour's growth model."
 ENG_public_private_partnerships: "Public-Private Partnerships"
 ENG_public_private_partnerships_desc: "Hospitals, transport and local projects are financed through private capital and public guarantees, buying delivery at a long-term price."
 ENG_knowledge_economy: "The Knowledge Economy"
 ENG_knowledge_economy_desc: "Universities, offices and technology clusters become the productive promise behind New Labour's growth model."
 ENG_new_labour_globalisation_compact: "Globalisation Compact"
 ENG_new_labour_globalisation_compact_desc: "Labour accepts open markets, mobile capital and international services, while trying to tax enough of the boom to fund reform."
 ENG_atlantic_partnership: "Atlantic Partnership"
 ENG_atlantic_partnership_desc: "New Labour presents alliance loyalty as a platform for influence rather than a Tory inheritance."
 ENG_humanitarian_interventionism: "Humanitarian Interventionism"
 ENG_humanitarian_interventionism_desc: "The language of human rights begins to reshape Labour's use of power abroad."
 ENG_kosovo_air_campaign: "The Kosovo Air Campaign"
 ENG_kosovo_air_campaign_desc: "Intervention is framed as alliance duty and human-rights enforcement, with the RAF carrying much of the political burden."
 ENG_sierra_leone_lessons: "Sierra Leone Lessons"
 ENG_sierra_leone_lessons_desc: "A small, sharp intervention doctrine emerges: special forces, legitimacy and a willingness to act before crisis hardens."
 ENG_labour_strategic_defence_review: "Strategic Defence Review"
 ENG_labour_strategic_defence_review_desc: "Labour rebuilds defence policy around capability, budget discipline and a serious answer to the post-Cold War security brief."
 ENG_nato_reassurance_tour: "NATO Reassurance Tour"
 ENG_nato_reassurance_tour_desc: "European capitals and Washington are told that Labour government does not mean strategic drift."
 ENG_nato_interoperability_programme: "NATO Interoperability Programme"
 ENG_nato_interoperability_programme_desc: "Command systems, logistics and air-naval cooperation are rebuilt to operate inside NATO missions rather than beside them."
 ENG_joint_rapid_reaction_force: "Joint Rapid Reaction Force"
 ENG_joint_rapid_reaction_force_desc: "Labour accepts that moral foreign policy needs deployable force, not only speeches and sanctions."
 ENG_eurofighter_commitments: "Eurofighter Commitments"
 ENG_eurofighter_commitments_desc: "The air industry is held inside a European procurement programme that is expensive, political and strategically useful."
 ENG_peacekeeping_doctrine: "Peacekeeping Doctrine"
 ENG_peacekeeping_doctrine_desc: "The armed forces prepare for mandates short of total war: stabilisation, evacuation, peacekeeping and coalition support."
 ENG_post_cold_war_force_planning: "Post-Cold War Force Planning"
 ENG_post_cold_war_force_planning_desc: "The defence budget is reshaped for smaller missions, better readiness and fewer inherited assumptions."
 ENG_labour_defence_industrial_base: "Defence Industrial Base"
 ENG_labour_defence_industrial_base_desc: "Shipyards, aerospace firms and electronics suppliers are folded into an industrial strategy that does not pretend defence is separate from jobs."
 ENG_social_democratic_cabinet: "A Social Democratic Cabinet"
 ENG_social_democratic_cabinet_desc: "Kinnock's Labour leans on cabinet seriousness, party repair and a programme that can hold the movement together."
 ENG_workers_rights_package: "Workers' Rights Package"
 ENG_workers_rights_package_desc: "Trade union power will not return unchanged, but basic protections and workplace dignity can."
 ENG_minimum_wage_commission: "Minimum Wage Commission"
 ENG_minimum_wage_commission_desc: "A statutory wage floor is prepared through commission work, evidence and staged introduction rather than a sudden return to corporatism."
 ENG_nhs_recovery_plan: "NHS Recovery Plan"
 ENG_nhs_recovery_plan_desc: "Waiting lists, staff morale and hospital capacity become central tests of Labour government."
 ENG_expand_the_nhs: "Expand the NHS"
 ENG_expand_the_nhs_desc: "Hospitals, staff and primary care receive real money, and the Treasury receives a real bill."
 ENG_school_standards_drive: "School Standards Drive"
 ENG_school_standards_drive_desc: "Education is framed as economic policy, social policy and moral promise at once."
 ENG_public_housing_drive: "Public Housing Drive"
 ENG_public_housing_drive_desc: "Council housing and urban repair become a visible answer to the social geography of Thatcherism."
 ENG_bennite_vision: "The Bennite Vision"
 ENG_bennite_vision_desc: "A harder left insists that Labour should democratise the economy, not merely soften the market."
 ENG_mass_nationalisation: "Mass Nationalisation"
 ENG_mass_nationalisation_desc: "Utilities, strategic industries and finance are pulled back toward public control at immense political cost."
 ENG_workers_control_labour: "Workers' Control"
 ENG_workers_control_labour_desc: "Factories and workplaces are given organised worker influence, turning industrial policy into industrial democracy."
 ENG_break_the_city_of_london: "Break the City of London"
 ENG_break_the_city_of_london_desc: "The financial order is forced to submit to elected power, even as capital prepares to run."
 ENG_national_investment_bank: "A National Investment Bank"
 ENG_national_investment_bank_desc: "Regional industry needs patient capital, not another promise from Westminster."
 ENG_public_services_first: "Public Services First"
 ENG_public_services_first_desc: "Labour chooses visible repair in hospitals, councils and welfare offices over a quick market confidence play."
 ENG_regional_development_agencies: "Regional Development Agencies"
 ENG_regional_development_agencies_desc: "Industrial revival is organised region by region instead of announced from a single Westminster lectern."
 ENG_national_reindustrialisation: "National Reindustrialisation"
 ENG_national_reindustrialisation_desc: "Labour makes reindustrialisation a national mission, with northern recovery at its centre."
 ENG_industrial_partnership_councils: "Industrial Partnership Councils"
 ENG_industrial_partnership_councils_desc: "Government, unions and management are brought into structured bargaining over investment and productivity."
 ENG_public_stake_settlement: "The Public Stake Settlement"
 ENG_public_stake_settlement_desc: "The state does not command the whole economy, but it stops pretending that ownership and investment are neutral questions."
 ENG_regional_reconstruction_levy: "Regional Reconstruction Levy"
 ENG_regional_reconstruction_levy_desc: "Labour can promise repair, but repair needs revenue. A dedicated levy and borrowing programme will drag on the economy before it changes the north."
 ENG_rebuild_the_coalfield_economies: "Rebuild the Coalfield Economies"
 ENG_rebuild_the_coalfield_economies_desc: "Coalfield communities need more than slogans or emergency grants. This programme removes the special regional damage over years, at a price even Labour cannot hide."
 ENG_devolution_commissions: "Devolution Commissions"
 ENG_devolution_commissions_desc: "Scotland, Wales and Northern Ireland cannot be answered only through central authority."
 ENG_devolution_referendums: "Devolution Referendums"
 ENG_devolution_referendums_desc: "The Union is asked to consent to reform, not merely endure another Westminster promise."
 ENG_talks_in_ulster: "Talks in Ulster"
 ENG_talks_in_ulster_desc: "Security pressure alone cannot end the Troubles. Someone must keep the channels open."
 ENG_social_europe: "A Social Europe"
 ENG_social_europe_desc: "Europe can be more than a market. It can be a shield for workers, regions and standards."
 ENG_social_chapter_support: "Support the Social Chapter"
 ENG_social_chapter_support_desc: "Labour aligns with European social standards to anchor workplace rights beyond Westminster moods."
 ENG_anti_apartheid_pressure: "Anti-Apartheid Pressure"
 ENG_anti_apartheid_pressure_desc: "South Africa becomes the test of whether British foreign policy still has a moral vocabulary."
 ENG_palestinian_rights_diplomacy: "Palestinian Rights Diplomacy"
 ENG_palestinian_rights_diplomacy_desc: "Labour gives more room to Palestinian rights while trying to preserve diplomatic balance."
 ENG_ethical_foreign_policy: "Ethical Foreign Policy"
 ENG_ethical_foreign_policy_desc: "Arms sales, sanctions and alliance habits are judged against a more public language of rights."
 ENG_good_friday_framework: "The Good Friday Framework"
 ENG_good_friday_framework_desc: "Backchannels, Dublin, Washington and Northern Irish parties are drawn toward a constitutional bargain that can lower the temperature without erasing the argument."
 ENG_constitutional_reform_package: "Constitutional Reform Package"
 ENG_constitutional_reform_package_desc: "Devolution, rights and Westminster reform are packaged as one answer to a strained union."
 ENG_human_rights_act: "Human Rights Act"
 ENG_human_rights_act_desc: "Rights are written into ordinary law so that executive power, police power and public authorities face a clearer democratic boundary."
 ENG_human_rights_culture: "Human Rights Culture"
 ENG_human_rights_culture_desc: "Public authorities are trained, sued and reorganised around rights language. It raises legitimacy, but government becomes more expensive to run."
 ENG_refugee_resettlement_framework: "Refugee Resettlement Framework"
 ENG_refugee_resettlement_framework_desc: "Resettlement is organised through councils, health boards and voluntary groups, increasing pull factors while adding visible pressure to services."
 ENG_commonwealth_visa_links: "Commonwealth Visa Links"
 ENG_commonwealth_visa_links_desc: "Old imperial connections are reworked into managed mobility, labour supply and diplomatic soft power."
 ENG_managed_migration_system: "Managed Migration System"
 ENG_managed_migration_system_desc: "Labour tries to square openness with order: skills, asylum processing, integration funding and productivity."
 ENG_global_britain_networks: "Global Britain Networks"
 ENG_global_britain_networks_desc: "Finance, universities, legal services, migration and Europe are tied into a global services strategy."
 ENG_a_new_british_settlement: "A New British Settlement"
 ENG_a_new_british_settlement_desc: "Labour's task is not to rewind Britain, but to rebuild a governing contract that can survive."
 ENG_break_the_duopoly: "Break the Duopoly"
 ENG_break_the_duopoly_desc: "The first-past-the-post system gave the SDP-Liberal Alliance a national vote without real power. A government built from that grievance must turn electoral unfairness into a serious constitutional programme."
 ENG_the_alliance_ascendant: "The Alliance Ascendant"
 ENG_the_alliance_ascendant_desc: "The Alliance must stop looking like a temporary pact between defectors and Liberals. It needs a governing machine, a disciplined parliamentary voice and a public offer clear enough to survive Westminster pressure."
 ENG_the_alliance_ascendant_tt: "§YAlliance Realignment§! gains:\n  §G+1.5%§! Political Power gain\n  §G-1.0%§! Bureaucracy Cost\n§YParty Cohesion§!: §G+7§!"
 ENG_a_proportional_future: "A Proportional Future"
 ENG_a_proportional_future_desc: "Electoral reform is the Alliance's central promise. Proportional representation can break the two-party lock, but it will anger Conservatives, Labour loyalists and parts of the Alliance that fear another referendum wound."
 ENG_a_proportional_future_tt: "Calls a constitutional referendum event.\n§YParty Cohesion§!: §R-3§!\n§YAlliance Realignment§!: §R+1.0%§! Bureaucracy Cost from the constitutional process."
 ENG_a_british_bill_of_rights: "A British Bill of Rights"
 ENG_a_british_bill_of_rights_desc: "The Alliance can make civil liberties a constitutional project instead of a ministerial courtesy. Courts, police, councils and Whitehall would all face clearer limits."
 ENG_a_british_bill_of_rights_tt: "Adds §YA British Bill of Rights§!.\n§YAlliance Realignment§! gains:\n  §G+2.0%§! Stability\n  §G+2.0%§! Drift Defence\n  §R+0.5%§! Bureaucracy Cost\n§YUnion Question§!: improves moderately."
 ENG_revive_local_government: "Revive Local Government"
 ENG_revive_local_government_desc: "Rate-capping and central control left councils suspicious of Westminster. Restoring local capacity can cool the Union Question, though it makes government less cheap and less centralised."
 ENG_revive_local_government_tt: "§YAlliance Realignment§! gains:\n  §G+2.0%§! Stability\n  §R+2.0%§! Bureaucracy Cost\n§YUnion Question§!: improves significantly."
 ENG_civic_capitalism: "Civic Capitalism"
 ENG_civic_capitalism_desc: "The Alliance rejects both old corporatism and pure Thatcherite finance. Civic capitalism means competition, responsible investment, local enterprise and a service economy that still answers to public purpose."
 ENG_civic_capitalism_tt: "§YAlliance Realignment§! gains:\n  §G-1.0%§! Consumer Goods Factor\n  §G+2.0%§! Trade Opinion\n  §G+1.2%§! Office Park Tax Income\n§YMarket Confidence§!: §G+6§!\n§YCity and Workshop§!: shifts toward the City."
 ENG_small_firm_britain: "Small Firm Britain"
 ENG_small_firm_britain_desc: "Britain's recovery cannot depend only on the City or old national champions. Small manufacturers, consultancies, workshops and town-centre services need credit, training and space to grow."
 ENG_small_firm_britain_tt: "Adds §G1§! Civilian Industry in a random eligible home state.\n§YAlliance Realignment§! gains:\n  §G+1.0%§! Research Speed\n  §G+0.8%§! Office Park Tax Income\n§YMarket Confidence§!: §G+4§!"
 ENG_owenite_discipline: "Owenite Discipline"
 ENG_owenite_discipline_desc: "David Owen's wing insists that the centre must look hard-headed: Atlanticist on defence, competent on security and willing to govern without sounding like a pressure group."
 ENG_owenite_discipline_tt: "Locks in the §YOwenite§! side of the Alliance.\n§YAlliance Realignment§! gains:\n  §G+2.0%§! Political Power gain\n  §G+3.5%§! Drift Defence\n§YThe Troubles§!: §G+4§! Security Pressure\n§YWar Support§!: §G+2.0%§!"
 ENG_liberal_localism: "Liberal Localism"
 ENG_liberal_localism_desc: "David Steel's Liberals want a decentralised Britain: stronger councils, constitutional guarantees and a state that trusts communities before departments."
 ENG_liberal_localism_tt: "Locks in the §YLiberal Localist§! side of the Alliance and makes §YDavid Steel§! the leading figure.\n§YAlliance Realignment§! gains:\n  §G+3.0%§! Stability\n  §G+3§! Globalism Equilibrium\n  §R+1.0%§! Bureaucracy Cost\n§YUnion Question§!: improves strongly."
 ENG_anchor_britain_in_europe: "Anchor Britain in Europe"
 ENG_anchor_britain_in_europe_desc: "The Alliance sees Europe as Britain's multiplier: market access, standards, research links and diplomatic weight. The price is a louder sovereignty argument at home."
 ENG_anchor_britain_in_europe_tt: "§YAlliance Realignment§! gains:\n  §G+1.5%§! Research Speed\n  §G+4.0%§! Trade Opinion\n  §G+8§! Globalism Equilibrium\n§YEuropean Argument§!: shifts toward Europe.\nImproves relations with France if it exists."
 ENG_devolve_the_union: "Devolve the Union"
 ENG_devolve_the_union_desc: "Scotland, Wales and Northern Ireland cannot be answered only by Westminster discipline. Devolution can make the Union more flexible, but it also exposes every fault line inside the Alliance."
 ENG_devolve_the_union_tt: "§YAlliance Realignment§! gains:\n  §G+1.0%§! Stability\n  §R+2.0%§! Bureaucracy Cost\n§YUnion Question§!: improves very strongly.\n§YParty Cohesion§!: §R-6§!"
 ENG_the_realignment_of_britain: "The Realignment of Britain"
 ENG_the_realignment_of_britain_desc: "If proportional reform, rights and devolution hold together, Britain leaves the old two-party settlement behind. If the Alliance lacks cohesion, the same project can reopen the referendum fight."
 ENG_the_realignment_of_britain_tt: "If §YParty Cohesion§! is above §Y45§!:\n  §YAlliance Realignment§! gains §G+3.0%§! Political Power gain, §G+3.0%§! Stability and §G+4§! Globalism Equilibrium.\n  §YUnion Question§! improves.\nIf not, the government loses Stability and another constitutional referendum event is triggered."
 ENG_the_cpgb_option: "The CPGB Option"
 ENG_the_cpgb_option_desc: "The Communist Party is too small to govern normally, but crisis politics can make fringe programmes sound like emergency plans."
 ENG_broad_left_campaign: "A Broad Left Campaign"
 ENG_broad_left_campaign_desc: "Communists, Bennites, trade union militants and anti-nuclear organisers can be bound into one electoral machine, if only barely."
 ENG_red_clydeside_revisited: "Red Clydeside Revisited"
 ENG_red_clydeside_revisited_desc: "The old industrial districts still remember a politics built on workshops, docks, mines and organised labour."
 ENG_break_with_the_city: "Break with the City"
 ENG_break_with_the_city_desc: "The City will not fund a socialist Britain. A hard-left government must accept the market reaction and build around it."
 ENG_workers_control_boards: "Workers' Control Boards"
 ENG_workers_control_boards_desc: "Factory democracy gives the movement substance, but it also makes every workplace argument part of government."
 ENG_non_aligned_peace_policy: "A Non-Aligned Peace Policy"
 ENG_non_aligned_peace_policy_desc: "The nuclear consensus and Atlantic reflex can be broken, though Washington will not mistake this for friendly reform."
 ENG_public_ownership_settlement: "Public Ownership Settlement"
 ENG_public_ownership_settlement_desc: "Strategic industry, utilities and finance must be made instruments of planning rather than private leverage."
 ENG_a_workers_britain: "A Workers' Britain"
 ENG_a_workers_britain_desc: "The hard-left project can stabilise Britain only if labour power becomes a governing structure rather than a permanent revolt."
 ENG_the_nationalist_fringe: "The Nationalist Fringe"
 ENG_the_nationalist_fringe_desc: "A politics once kept outside Westminster feeds on fear, decline and the belief that the old parties have lost control."
 ENG_law_and_order_platform: "Law and Order Platform"
 ENG_law_and_order_platform_desc: "Public order becomes the language of government, and the security state becomes its preferred instrument."
 ENG_centralise_the_union: "Centralise the Union"
 ENG_centralise_the_union_desc: "Devolution is rejected as weakness. Westminster will answer regional pressure by tightening the centre."
 ENG_reject_brussels: "Reject Brussels"
 ENG_reject_brussels_desc: "Europe is recast as a threat to sovereignty, trade policy and national identity."
 ENG_border_and_broadcast_controls: "Border and Broadcast Controls"
 ENG_border_and_broadcast_controls_desc: "The government moves against foreign influence, hostile networks and domestic media it regards as destabilising."
 ENG_no_surrender_in_ulster: "No Surrender in Ulster"
 ENG_no_surrender_in_ulster_desc: "Northern Ireland is treated as a test of national will. The price will be paid in legitimacy and backlash."
 ENG_authoritarian_westminster: "Authoritarian Westminster"
 ENG_authoritarian_westminster_desc: "The old constitution depended on restraint. A hard nationalist government discovers how much can be bent before it breaks."
 ENG_fortress_britain: "Fortress Britain"
 ENG_fortress_britain_desc: "Britain closes ranks around order, sovereignty and defence, while allies and markets begin to step back."
 ENG_after_the_long_strike: "After the Long Strike"
 ENG_after_the_long_strike_desc: "The picket lines are gone, but the bitterness is not."
 ENG_union_strain_updates_tt: "The Union Question national spirit is recalculated internally."
 ENG_city_workshop_bop_updates_tt: "The City and Workshop balance is adjusted internally."
 ENG_labour_mandate_bop_updates_tt: "Labour's governing mandate is adjusted internally."
 ENG_1985_remove_industrial_state_strain_tt: "Removes the industrial state strain modifiers from the old coal, steel and heavy-industry regions. This does not add a positive state buff; it only ends the special regional penalty."
 ENG_1985_set_conservative_route_tt: "§YConservative Programme§! becomes active.\nThis route builds the §YConservative Statecraft§! modifier through privatisation, labour-market discipline, North Sea receipts, local-government conflict, the City, NATO and the late-Thatcher succession crisis.\nFormer governing programmes are retired quietly."
 ENG_1985_set_labour_route_tt: "§YLabour Programme§! becomes active.\nThis route replaces the City-Workshop balance with §YLabour's Governing Mandate§!: party discipline, trade-union power, public services, defence credibility, New Labour modernisation, Bennite alternatives and constitutional reform all push the mandate in different directions."
 ENG_1985_set_alliance_route_tt: "§YSDP-Liberal Alliance Programme§! becomes active.\nThis route builds §YAlliance Realignment§! through electoral reform, civil liberties, local government, civic capitalism, Europe and devolution. §YParty Cohesion§! matters: a weak Alliance can be forced back into referendum crisis."
 ENG_1985_set_hard_left_route_tt: "§YCPGB / Hard Left Programme§! becomes active.\nThis compact route pushes public ownership, workers' control, non-alignment and a break with the City. It can strengthen industry and unions, but it damages market confidence and western security credibility."
 ENG_1985_set_nationalist_route_tt: "§YNationalist Programme§! becomes active.\nThis route centralises Westminster, rejects Brussels, hardens public order and turns Ulster into a loyalty test. It can raise control and security, but it strains stability, diplomacy and the Union."
 ENG_ulster_flashpoint: "The Ulster Flashpoint"
 ENG_ulster_flashpoint_desc: "Northern Ireland is a security crisis, a constitutional crisis and a diplomatic crisis at once."
 ENG_atlantic_habit: "Atlantic Habit"
 ENG_atlantic_habit_desc: "Britain's reflex is to turn west when the world grows dangerous."
 ENG_the_union_question_1: "The Union Question"
 ENG_the_union_question_1_desc: "The kingdom is intact, but the pressure is becoming dangerous."
 ENG_the_union_question_2: "The Union Question"
 ENG_the_union_question_2_desc: "The kingdom is intact, but not unquestionably so."
 ENG_the_union_question_3: "The Union Question"
 ENG_the_union_question_3_desc: "The Union is uneasy, yet still manageable."
 ENG_the_union_question_4: "The Union Question"
 ENG_the_union_question_4_desc: "The Union has been steadied, though its arguments remain alive."
 ENG_the_union_question_5: "The Union Question"
 ENG_the_union_question_5_desc: "The Union has been made more durable by reform, restraint and political attention."
 ENG_margaret_thatcher_idea: "Margaret Thatcher"
 ENG_margaret_thatcher_idea_desc: "Her government believes Britain can be remade through will, markets and confrontation."
 ENG_margaret_thatcher_idea_tt: "Thatcher sharpens executive authority and market policy, but social resistance remains a price."
 ENG_neil_kinnock_idea: "Neil Kinnock"
 ENG_neil_kinnock_idea_desc: "Kinnock must make Labour governable without letting it forget why it exists."
 ENG_neil_kinnock_idea_tt: "Kinnock improves party discipline and democratic credibility, but must spend effort keeping Labour together."
 ENG_tony_blair_idea: "Tony Blair"
 ENG_tony_blair_idea_desc: "Blair gives Labour a sharper media instinct, market reassurance and a generational promise of renewal."
 ENG_tony_blair_idea_tt: "Blair improves political momentum and market confidence, but moves Labour away from its old socialist language."
 ENG_david_owen_idea: "David Owen"
 ENG_david_owen_idea_desc: "Owen gives the Alliance a hard-edged, Atlanticist and administrative face."
 ENG_david_owen_idea_tt: "Owen improves defence credibility and executive discipline."
 ENG_david_steel_idea: "David Steel"
 ENG_david_steel_idea_desc: "Steel gives the Alliance its liberal, constitutional and localist centre of gravity."
 ENG_david_steel_idea_tt: "Steel improves reform legitimacy and democratic acceptance."
 ENG_gordon_mclennan_idea: "Gordon McLennan"
 ENG_gordon_mclennan_idea_desc: "McLennan gives the hard left an organised communist spine, but not a broad national mandate."
 ENG_gordon_mclennan_idea_tt: "McLennan helps communist mobilisation, while worsening market and diplomatic confidence."
 ENG_john_tyndall_idea: "John Tyndall"
 ENG_john_tyndall_idea_desc: "Tyndall turns fringe nationalism into a governing threat, sharp in message and corrosive to legitimacy."
 ENG_john_tyndall_idea_tt: "Tyndall boosts nationalist pressure, but damages stability and foreign confidence."
 ENG_shareholder_britain_1: "Shareholder Britain"
 ENG_shareholder_britain_1_desc: "The state begins to sell more of itself to the market."
 ENG_shareholder_britain_2: "Shareholder Britain"
 ENG_shareholder_britain_2_desc: "The sale of state assets is now a political identity as much as an economic programme."
 ENG_1985_north_sea_revenue_idea: "North Sea Revenue"
 ENG_1985_north_sea_revenue_idea_desc: "Oil receipts give the Treasury breathing room while the domestic economy is forced through painful restructuring."
 ENG_1985_british_gas_sale: "British Gas Sale"
 ENG_1985_british_gas_sale_desc: "The sale of British Gas makes privatisation a mass-market political campaign."
 ENG_rate_capping_idea: "Rate Capping"
 ENG_rate_capping_idea_desc: "Local government is being forced under tighter Treasury limits. Public costs fall on paper, but local resistance rises."
 ENG_nhs_efficiency_drive_idea: "NHS Efficiency Drive"
 ENG_nhs_efficiency_drive_idea_desc: "The NHS is expected to deliver more discipline with less room. Spending expectations fall while service pressure rises."
 ENG_southern_growth_corridor_idea: "Southern Growth Corridor"
 ENG_southern_growth_corridor_idea_desc: "Roads, offices and private capital are being concentrated around London and the South East."
 ENG_regional_enterprise_zones_idea: "Regional Enterprise Zones"
 ENG_regional_enterprise_zones_idea_desc: "Limited tax relief and planning flexibility try to keep industrial districts from becoming permanent casualties."
 ENG_public_service_contracting_idea: "Public Service Contracting"
 ENG_public_service_contracting_idea_desc: "Public services are being exposed to tendering, contract discipline and private competition."
 ENG_property_owning_democracy_idea: "Property-Owning Democracy"
 ENG_property_owning_democracy_idea_desc: "The government is trying to bind home ownership, share ownership and market loyalty together."
 ENG_city_big_bang_idea: "City Big Bang"
 ENG_city_big_bang_idea_desc: "Financial deregulation and electronic trading are pulling London into a new global role."
 ENG_utility_privatisation_idea: "Utility Privatisation"
 ENG_utility_privatisation_idea_desc: "Water, electricity and other utilities are being prepared for private ownership and regulated markets."
 ENG_community_charge_idea: "Community Charge"
 ENG_community_charge_idea_desc: "Local taxation is being flattened and centralised. Collection improves on paper, but the politics are combustible."
 ENG_wapping_settlement_idea: "Wapping Settlement"
 ENG_wapping_settlement_idea_desc: "A bruising confrontation with the print unions strengthens the government's industrial authority."
 ENG_social_contract_idea: "Responsible Social Contract"
 ENG_social_contract_idea_desc: "The unions are being brought back into government by bargain rather than surrender."
 ENG_idea_labour_divided: "A Party Divided"
 ENG_idea_labour_divided_desc: "Labour enters the mid-1980s fractured between old socialism, trade union influence, anti-nuclear activists and modernising reformers."
 ENG_social_cost_of_thatcherism_idea: "The Social Cost of Thatcherism"
 ENG_social_cost_of_thatcherism_idea_desc: "Labour has turned the costs of unemployment, public cuts and regional decline into a governing argument."
 ENG_cnd_pressure_idea: "CND Pressure"
 ENG_cnd_pressure_idea_desc: "Anti-nuclear activists keep defence policy under pressure and make alliance discipline harder to maintain."
 ENG_social_contract_mk2_idea: "Social Contract Mk II"
 ENG_social_contract_mk2_idea_desc: "Pay restraint, workplace rights and investment pledges are bound into a new union settlement."
 ENG_poll_tax_momentum_idea: "Poll Tax Momentum"
 ENG_poll_tax_momentum_idea_desc: "Opposition to the Community Charge is being converted into organisation, legitimacy and electoral pressure."
 ENG_northern_city_compacts_idea: "Northern City Compacts"
 ENG_northern_city_compacts_idea_desc: "Northern regeneration is being organised through city-region deals and targeted industrial policy."
 ENG_shadow_budget_idea: "Treasury Credibility"
 ENG_shadow_budget_idea_desc: "Labour's spending promises are being costed against taxes, debt and market confidence."
 ENG_public_sector_pay_review_idea: "Public Sector Pay Review"
 ENG_public_sector_pay_review_idea_desc: "Public service pay is being repaired in a way that improves morale but raises social spending pressure."
 ENG_black_wednesday_lessons_idea: "Black Wednesday Lessons"
 ENG_black_wednesday_lessons_idea_desc: "Labour has built monetary caution into its economic identity after watching sterling discipline the Conservatives."
 ENG_devolution_referendums_idea: "Devolution Referendums"
 ENG_devolution_referendums_idea_desc: "Constitutional reform is being legitimised through public consent in Scotland and Wales."
 ENG_expand_the_nhs_idea: "Expanded NHS"
 ENG_expand_the_nhs_idea_desc: "The NHS is being given real resources again, with stability gains and fiscal pressure arriving together."
 ENG_public_housing_drive_idea: "Public Housing Drive"
 ENG_public_housing_drive_idea_desc: "Council housing and urban repair are being used to reverse visible social decline."
 ENG_national_reindustrialisation_idea: "National Reindustrialisation"
 ENG_national_reindustrialisation_idea_desc: "Regional production, infrastructure and patient capital are placed at the centre of economic policy."
 ENG_bennite_vision_idea: "Bennite Vision"
 ENG_bennite_vision_idea_desc: "Labour's hard left is trying to democratise economic power rather than merely manage markets."
 ENG_mass_nationalisation_idea: "Mass Nationalisation"
 ENG_mass_nationalisation_idea_desc: "Strategic industries are pulled toward public ownership, strengthening productive control while alarming capital."
 ENG_workers_control_labour_idea: "Workers' Control"
 ENG_workers_control_labour_idea_desc: "Workplace democracy raises organised labour's influence inside production."
 ENG_capital_flight_pressure_idea: "Capital Flight Pressure"
 ENG_capital_flight_pressure_idea_desc: "Financial actors are moving assets and confidence away from a government they regard as hostile."
 ENG_third_way_idea: "Third Way"
 ENG_third_way_idea_desc: "A synthesis of market credibility, social investment and disciplined message politics now defines the government."
 ENG_financial_services_compact_idea: "Financial Services Compact"
 ENG_financial_services_compact_idea_desc: "The City receives predictability while Labour receives revenue, investment and political cover."
 ENG_labour_atlanticism_idea: "Labour Atlanticism"
 ENG_labour_atlanticism_idea_desc: "Labour presents NATO loyalty as a tool of influence rather than a Conservative monopoly."
 ENG_social_chapter_support_idea: "Social Chapter Support"
 ENG_social_chapter_support_idea_desc: "European social standards strengthen the credibility of Labour's workplace settlement."
 ENG_ethical_foreign_policy_idea: "Ethical Foreign Policy"
 ENG_ethical_foreign_policy_idea_desc: "Foreign policy is being judged more openly through rights, sanctions and democratic legitimacy."
 ENG_labour_public_contract_idea: "The Public Contract"
 ENG_labour_public_contract_idea_desc: "Labour binds public service repair to fiscal discipline and national trust."
 ENG_omov_reforms_idea: "One Member, One Vote"
 ENG_omov_reforms_idea_desc: "Labour's internal constitution is being modernised to strengthen party members and reduce the old block-vote image."
 ENG_blairite_media_operation_idea: "Blairite Media Operation"
 ENG_blairite_media_operation_idea_desc: "The party machine learns to move quickly, speak tightly and keep the story on its chosen terrain."
 ENG_bank_of_england_independence_idea: "Bank of England Independence"
 ENG_bank_of_england_independence_idea_desc: "Operational independence gives monetary policy a new credibility, even as it narrows political room."
 ENG_welfare_to_work_idea: "Welfare to Work"
 ENG_welfare_to_work_idea_desc: "Social support is tied to employability, training and pressure to enter work."
 ENG_new_labour_idea: "New Labour"
 ENG_new_labour_idea_desc: "Labour is recast as a governing movement of markets, opportunity, social investment and constitutional reform."
 ENG_social_democratic_cabinet_idea: "Social Democratic Cabinet"
 ENG_social_democratic_cabinet_idea_desc: "The leadership balances party unity with a serious programme for office."
 ENG_workers_rights_package_idea: "Workers' Rights Package"
 ENG_workers_rights_package_idea_desc: "Workplace protections return in moderated form, restoring rights without restoring old vetoes."
 ENG_minimum_wage_commission_idea: "Minimum Wage Commission"
 ENG_minimum_wage_commission_idea_desc: "A wage floor is being prepared carefully, raising low-pay security while keeping business reaction manageable."
 ENG_nhs_recovery_plan_idea: "NHS Recovery Plan"
 ENG_nhs_recovery_plan_idea_desc: "Public health capacity is raised again, with real fiscal cost attached."
 ENG_school_standards_drive_idea: "School Standards Drive"
 ENG_school_standards_drive_idea_desc: "Education reform is treated as the foundation of social mobility and productivity."
 ENG_public_services_first_idea: "Public Services First"
 ENG_public_services_first_idea_desc: "Visible repair of services takes priority over a quick market confidence dividend."
 ENG_regional_development_agencies_idea: "Regional Development Agencies"
 ENG_regional_development_agencies_idea_desc: "Regional institutions channel investment toward places left behind by the 1980s."
 ENG_industrial_partnership_councils_idea: "Industrial Partnership Councils"
 ENG_industrial_partnership_councils_idea_desc: "Industry policy is negotiated through structured partnership instead of confrontation."
 ENG_public_stake_settlement_idea: "Public Stake Settlement"
 ENG_public_stake_settlement_idea_desc: "The state claims a deliberate role in investment, infrastructure and productive ownership."
 ENG_thatcher_regeneration_bond_costs_idea: "Regeneration Bond Costs"
 ENG_thatcher_regeneration_bond_costs_idea_desc: "Targeted regeneration bonds channel private finance into neglected industrial districts, but guarantees and tax concessions still weigh on the national accounts."
 ENG_thatcher_industrial_town_rebuild_costs_idea: "Industrial Town Rebuild Costs"
 ENG_thatcher_industrial_town_rebuild_costs_idea_desc: "A rare Conservative commitment to deep regional repair is consuming fiscal room and administrative capacity."
 ENG_labour_regional_reconstruction_costs_idea: "Regional Reconstruction Costs"
 ENG_labour_regional_reconstruction_costs_idea_desc: "Labour's regional programme is shifting public money toward damaged industrial communities, with immediate pressure on consumption, offices and tax receipts."
 ENG_labour_coalfield_rebuild_costs_idea: "Coalfield Rebuild Costs"
 ENG_labour_coalfield_rebuild_costs_idea_desc: "The coalfield rebuild is a serious long-term repair effort. It may end the special regional strain, but it is expensive, slow and politically exposed."
 ENG_labour_constitutional_reform_idea: "Constitutional Reform"
 ENG_labour_constitutional_reform_idea_desc: "Devolution and rights reform start to remake the British state from within."
 ENG_good_friday_framework_idea: "Good Friday Framework"
 ENG_good_friday_framework_idea_desc: "A constitutional peace framework reduces the security burden in Northern Ireland, though implementation remains politically delicate."
 ENG_human_rights_act_idea: "Human Rights Act"
 ENG_human_rights_act_idea_desc: "Rights protections are being written into the machinery of government, improving legitimacy at administrative cost."
 ENG_human_rights_culture_idea: "Human Rights Culture"
 ENG_human_rights_culture_idea_desc: "Rights law is changing how public bodies work, raising trust and productivity while increasing administrative cost."
 ENG_refugee_resettlement_framework_idea: "Refugee Resettlement Framework"
 ENG_refugee_resettlement_framework_idea_desc: "Britain is accepting a larger resettlement burden, increasing migration pull and service pressure."
 ENG_managed_migration_system_idea: "Managed Migration System"
 ENG_managed_migration_system_idea_desc: "Migration is being channelled toward skills, integration and productivity, though bureaucracy expands with it."
 ENG_commonwealth_visa_links_idea: "Commonwealth Visa Links"
 ENG_commonwealth_visa_links_idea_desc: "Commonwealth links are turned into a managed source of labour, diplomacy and soft power."
 ENG_global_britain_networks_idea: "Global Britain Networks"
 ENG_global_britain_networks_idea_desc: "Services, universities, migration and finance are connected into a more global British growth model."
 ENG_labour_strategic_defence_review_idea: "Strategic Defence Review"
 ENG_labour_strategic_defence_review_idea_desc: "The defence brief is being disciplined around usable capability and fiscal reality."
 ENG_nato_reassurance_tour_idea: "NATO Reassurance Tour"
 ENG_nato_reassurance_tour_idea_desc: "Labour is reassuring NATO partners that alliance discipline survives a change of government."
 ENG_nato_interoperability_programme_idea: "NATO Interoperability Programme"
 ENG_nato_interoperability_programme_idea_desc: "Britain's forces are being adapted for coalition warfare, increasing readiness and operating cost."
 ENG_eurofighter_commitments_idea: "Eurofighter Commitments"
 ENG_eurofighter_commitments_idea_desc: "Aerospace procurement strengthens British air power and industry while raising air-force costs."
 ENG_joint_rapid_reaction_force_idea: "Joint Rapid Reaction Force"
 ENG_joint_rapid_reaction_force_idea_desc: "Deployable expeditionary forces improve response options, but they are not cheap."
 ENG_peacekeeping_doctrine_idea: "Peacekeeping Doctrine"
 ENG_peacekeeping_doctrine_idea_desc: "The armed forces are trained for stabilisation missions and international mandates."
 ENG_labour_defence_industrial_base_idea: "Defence Industrial Base"
 ENG_labour_defence_industrial_base_idea_desc: "Defence procurement is being used to preserve advanced manufacturing and electronics capacity."
 ENG_kosovo_air_campaign_idea: "Kosovo Air Campaign"
 ENG_kosovo_air_campaign_idea_desc: "The RAF is becoming the visible instrument of New Labour's interventionist human-rights policy."
 ENG_sierra_leone_lessons_idea: "Sierra Leone Lessons"
 ENG_sierra_leone_lessons_idea_desc: "Special forces, evacuation planning and limited intervention doctrine are sharpened."
 ENG_stakeholder_society_idea: "Stakeholder Society"
 ENG_stakeholder_society_idea_desc: "New Labour ties social rights to responsibility, productivity and a broader civic bargain."
 ENG_cool_britannia_idea: "Cool Britannia"
 ENG_cool_britannia_idea_desc: "A younger cultural image gives Britain political reach, soft power and migration appeal."
 ENG_public_private_partnerships_idea: "Public-Private Partnerships"
 ENG_public_private_partnerships_idea_desc: "Private capital accelerates delivery and office growth, but future governments inherit the contracts."
 ENG_knowledge_economy_idea: "Knowledge Economy"
 ENG_knowledge_economy_idea_desc: "Universities, skilled labour and office work are becoming central to the national productivity model."
 ENG_new_labour_globalisation_compact_idea: "Globalisation Compact"
 ENG_new_labour_globalisation_compact_idea_desc: "Open markets and mobile services are accepted as long as the state can capture enough of the gains."
 ENG_a_new_british_settlement_idea: "A New British Settlement"
 ENG_a_new_british_settlement_idea_desc: "Labour has turned repair into a governing settlement rather than a protest against the 1980s."
 ENG_bill_of_rights_idea: "British Bill of Rights"
 ENG_bill_of_rights_idea_desc: "Rights should not depend entirely on convention and restraint."
 ENG_proportional_future_idea: "Proportional Future"
 ENG_proportional_future_idea_desc: "The electoral system itself has become part of the national argument."
 ENG_renewed_deterrent_idea: "Renewed Deterrent"
 ENG_renewed_deterrent_idea_desc: "Britain has recommitted to nuclear deterrence as a pillar of its global position."
 ENG_1985_anglo_irish_framework: "Anglo-Irish Framework"
 ENG_1985_anglo_irish_framework_desc: "London and Dublin are cooperating more closely over Northern Ireland, reducing some pressure while angering hardliners."
 ENG_1985_royal_navy_modernisation: "Royal Navy Modernisation"
 ENG_1985_royal_navy_modernisation_desc: "The Royal Navy is modernising around North Atlantic duties, submarine warfare and post-Falklands lessons."
 ENG_1985_special_relationship_idea: "Special Relationship"
 ENG_1985_special_relationship_idea_desc: "British policy is tied closely to Washington through defence planning, diplomacy and intelligence cooperation."
 ENG_1985_trident_commitment_idea: "Trident Commitment"
 ENG_1985_trident_commitment_idea_desc: "Trident procurement secures the nuclear deterrent while placing a heavy bill on the defence budget."
 ENG_greenham_common_deployment_idea: "Greenham Common Deployment"
 ENG_greenham_common_deployment_idea_desc: "Cruise missile deployment strengthens NATO deterrence while feeding domestic protest and policing costs."
 ENG_baor_commitment_idea: "BAOR Rhine Commitment"
 ENG_baor_commitment_idea_desc: "The British Army of the Rhine gives NATO credibility in Central Europe, at a real personnel cost."
 ENG_falklands_lessons_idea: "Falklands Lessons"
 ENG_falklands_lessons_idea_desc: "The armed forces are absorbing the logistics, naval and air lessons of the South Atlantic campaign."
 ENG_integrated_air_defence_idea: "Integrated Air Defence"
 ENG_integrated_air_defence_idea_desc: "Air defence coordination is being tightened across NATO procedures and British command systems."
 ENG_defence_industrial_orders_idea: "Defence Industrial Orders"
 ENG_defence_industrial_orders_idea_desc: "Aircraft and defence orders protect high-value manufacturing, even as they add pressure to the budget."
 ENG_north_atlantic_fleet_exercises_idea: "North Atlantic Fleet Exercises"
 ENG_north_atlantic_fleet_exercises_idea_desc: "Royal Navy exercises in the North Atlantic improve readiness at the cost of higher naval operating expenses."
 ENG_nato_readiness_reviews_idea: "NATO Readiness Reviews"
 ENG_nato_readiness_reviews_idea_desc: "NATO readiness reviews turn alliance commitments into practical mobilisation and command requirements."
 ENG_north_atlantic_guardian_idea: "North Atlantic Guardian"
 ENG_north_atlantic_guardian_idea_desc: "Britain has committed itself to keeping the northern sea lanes open in any crisis with the Warsaw Pact."
 ENG_atlantic_market_state_idea: "Atlantic Market State"
 ENG_atlantic_market_state_idea_desc: "British statecraft now links financial openness, Atlantic diplomacy and defence readiness."
 ENG_thatcherite_settlement_idea: "Thatcherite Settlement"
 ENG_thatcherite_settlement_idea_desc: "The government's reforms have hardened into an institutional settlement of lower state ownership, tighter welfare expectations and stronger executive authority."
 ENG_workers_control_idea: "Workers' Control Boards"
 ENG_workers_control_idea_desc: "Industrial democracy strengthens organised labour but slows the machinery of government."
 ENG_state_planning_idea: "State Planning"
 ENG_state_planning_idea_desc: "The state directs capital toward industry, accepting higher public costs and weaker market trust."
 ENG_fortress_britain_idea: "Fortress Britain"
 ENG_fortress_britain_idea_desc: "Security and sovereignty dominate policy, while international trust erodes."
 ENG_authoritarian_westminster_idea: "Authoritarian Westminster"
 ENG_authoritarian_westminster_idea_desc: "Central authority expands past convention, trading democratic legitimacy for command."
 ENG_conservative_statecraft_modifier: "The Thatcher Project"
 ENG_conservative_statecraft_modifier_tt: "This modifier grows as the Conservative route commits to privatisation, deregulation, public spending restraint, North Sea receipts, utility reform, security and Atlanticism. Harsh labour-market reforms can lower factory and office workforce requirements while worsening regional damage.\n\nCurrent workforce requirement relief:\nCivilian Industries: [?ENG_conservative_civ_factory_workforce|%-]\nMilitary Industries: [?ENG_conservative_mil_factory_workforce|%-]\nOffices: [?ENG_conservative_office_workforce|%-]"
 ENG_national_development_programme_modifier: "National Development Programme"
 ENG_national_development_programme_modifier_tt: "This party-independent modifier grows as Britain invests in transport, ports, energy reliability, North Sea supply chains, telecom networks, research corridors and carefully limited regional regeneration."
 ENG_thatcher_london_financial_growth_modifier: "London Financial Growth"
 ENG_thatcher_london_financial_growth_modifier_tt: "London is receiving the offices, infrastructure and policy attention needed for a financial boom."
 ENG_thatcher_southern_growth_modifier: "Southern Growth Corridor"
 ENG_thatcher_southern_growth_modifier_tt: "Southern England is benefiting from service-sector growth, new offices and easier private investment."
 ENG_1985_post_industrial_strain_modifier: "Post-Industrial Strain"
 ENG_1985_post_industrial_strain_modifier_tt: "The old coal, steel and heavy-industry regions begin 1985 under heavy pressure from weak productivity, exhausted pits, unemployment, policing strain and the political aftershock of the miners' strike."
 ENG_thatcher_northern_industrial_strain_modifier: "Accelerated Deindustrialisation"
 ENG_thatcher_northern_industrial_strain_modifier_tt: "Thatcherite closures, subsidy discipline and union defeat are sharply worsening the already strained old industrial regions."
 ENG_thatcher_regional_enterprise_zone_modifier: "Enterprise Zone Relief"
 ENG_thatcher_regional_enterprise_zone_modifier_tt: "Targeted relief is replacing the harshest industrial collapse with a still painful strain. The region is not booming; it is simply no longer falling as fast."
 ENG_thatcher_community_charge_trial_modifier: "Community Charge Trial"
 ENG_thatcher_community_charge_trial_modifier_tt: "The Community Charge trial is raising local resentment and weakening regional confidence."
 ENG_labour_northern_recovery_modifier: "Mitigated Industrial Strain"
 ENG_labour_northern_recovery_modifier_tt: "Labour is easing the worst regional damage with grants and boards, but the old industrial regions remain under pressure."
 ENG_national_regeneration_board_modifier: "Regeneration Board Relief"
 ENG_national_regeneration_board_modifier_tt: "Targeted development boards have softened post-industrial decline. The region is still strained, but infrastructure and grant work have made the damage more manageable."
 ENG_labour_reconstruction_modifier: "Labour Reconstruction"
 ENG_labour_reconstruction_modifier_tt: "This modifier grows as Labour rebuilds credibility, industry, social contracts, coalfield recovery, energy planning, constitutional reform, migration policy, globalisation and defence readiness."
 ENG_alliance_reform_modifier: "Alliance Realignment"
 ENG_alliance_reform_modifier_tt: "This modifier grows as the SDP-Liberal Alliance turns protest votes into government: electoral reform, civil liberties, local government, Europe, small firms and constitutional devolution.\n\nCurrent Alliance programme:\nPolitical Power Gain: [?ENG_alliance_pp_factor|%+]\nStability: [?ENG_alliance_stability|%+]\nResearch Speed: [?ENG_alliance_research|%+]\nConsumer Goods Factor: [?ENG_alliance_consumer_goods|%-]\nTrade Opinion: [?ENG_alliance_trade|%+]\nGlobalism Equilibrium: [?ENG_alliance_globalism|+]\nBureaucracy Cost: [?ENG_alliance_bureaucracy_cost|%-]\nOffice Tax Income: [?ENG_alliance_office_tax|%+]\nDrift Defence: [?ENG_alliance_defence_drift|%+]"
 ENG_hard_left_mobilisation_modifier: "Hard Left Mobilisation"
 ENG_hard_left_mobilisation_modifier_tt: "This modifier grows as the CPGB route expands public ownership, workers' control, non-alignment and industrial planning."
 ENG_nationalist_pressure_modifier: "Nationalist Pressure"
 ENG_nationalist_pressure_modifier_tt: "This modifier grows as the nationalist route centralises Westminster, hardens public order and breaks with Europe."
 ENG_city_workshop_bop: "The City and the Workshop"
 ENG_workshop_side: "The Workshop"
 ENG_city_side: "The City"
 ENG_city_workshop_balance: "Uneasy Balance"
 ENG_city_workshop_balance_tt: "Britain is trying to hold finance and industry in the same settlement."
 ENG_workshop_mobilisation: "Workshop Mobilisation"
 ENG_workshop_mobilisation_tt: "Industrial policy and regional employment dominate economic planning."
 ENG_regional_revival: "Regional Revival"
 ENG_regional_revival_tt: "The productive regions receive more attention, even at fiscal cost."
 ENG_social_contract_range: "Social Contract"
 ENG_social_contract_range_tt: "Union compromise and productive investment are slightly favoured."
 ENG_market_tilt: "Market Tilt"
 ENG_market_tilt_tt: "The City has the advantage, but industry has not been entirely abandoned."
 ENG_financial_opening: "Financial Opening"
 ENG_financial_opening_tt: "Deregulation and capital flows are driving the British economy."
 ENG_city_supremacy: "City Supremacy"
 ENG_city_supremacy_tt: "London finance dominates policy, revenue and risk."
 ENG_labour_mandate_bop: "Labour's Governing Mandate"
 ENG_labour_movement_side: "The Movement"
 ENG_labour_treasury_side: "The Treasury"
 ENG_labour_balanced_mandate: "Balanced Mandate"
 ENG_labour_balanced_mandate_tt: "Labour is balancing public-service repair, party discipline and fiscal credibility."
 ENG_labour_movement_supremacy: "Movement Supremacy"
 ENG_labour_movement_supremacy_tt: "Trade unions, public ownership and regional repair dominate Labour's programme, raising stability in the movement while worrying markets."
 ENG_labour_social_contract_range: "Social Contract"
 ENG_labour_social_contract_range_tt: "Labour has tilted toward organised labour and public-service repair without losing all fiscal restraint."
 ENG_labour_public_investment_range: "Public Investment"
 ENG_labour_public_investment_range_tt: "Public investment and regional repair are favoured, with a manageable fiscal cost."
 ENG_labour_fiscal_caution_range: "Fiscal Caution"
 ENG_labour_fiscal_caution_range_tt: "Treasury discipline is shaping the programme before social spending can expand."
 ENG_labour_market_reassurance: "Market Reassurance"
 ENG_labour_market_reassurance_tt: "Labour has convinced markets it can govern, but the party's movement wing is less comfortable."
 ENG_labour_treasury_dominance: "Treasury Dominance"
 ENG_labour_treasury_dominance_tt: "Fiscal credibility and market reassurance dominate Labour's statecraft, improving confidence while narrowing social-democratic room."
 ENG_union_question_category: "The Union Question"
 ENG_union_question_category_desc: "Britain's regional, labour and constitutional pressures are tracked through the Union score."
 ENG_national_development_category: "National Development"
 ENG_national_development_category_desc: "Long-term construction decisions let Britain keep funding transport, energy, research, North Sea services and regional regeneration after the focus tree opens the programme."
 ENG_manage_the_city_category: "Managing the City"
 ENG_manage_the_city_category_desc: "Decisions over regulation, capital and confidence shift the City-Workshop balance."
 ENG_ulster_briefings_category: "Ulster Security Briefings"
 ENG_ulster_briefings_category_desc: "Security, intelligence, loyalist pressure and backchannels shape the Troubles. These decisions feed the IRA Situation Room."
 ENG_party_conference_category: "Party Conference Season"
 ENG_party_conference_category_desc: "Party management keeps the governing route from tearing itself apart."
 ENG_constitutional_future_category: "The Constitutional Future"
 ENG_constitutional_future_category_desc: "Devolution, conventions and electoral reform can calm or destabilise the Union."
 ENG_fund_the_coalfield_regeneration_boards: "Fund the Coalfield Regeneration Boards"
 ENG_fund_the_coalfield_regeneration_boards_desc: "Targeted spending can cool coalfield anger, but it pulls policy toward the Workshop."
 ENG_deploy_extra_police_presence: "Deploy Extra Police Presence"
 ENG_deploy_extra_police_presence_desc: "A visible security presence reduces immediate militant freedom and improves intelligence penetration, but raises loyalist tension and damages stability."
 ENG_negotiate_with_moderate_union_leadership: "Negotiate with Moderate Union Leadership"
 ENG_negotiate_with_moderate_union_leadership_desc: "Moderate union figures can still be brought into a national bargain."
 ENG_fund_british_rail_electrification: "Fund British Rail Electrification"
 ENG_fund_british_rail_electrification_desc: "A further electrification round improves regional links and industrial logistics, but requires direct Treasury support."
 ENG_expand_m25_development_corridor: "Expand the M25 Development Corridor"
 ENG_expand_m25_development_corridor_desc: "Office parks and road capacity around the South East improve service-sector output while widening the visible regional imbalance."
 ENG_issue_regional_regeneration_grants: "Issue Regional Regeneration Grants"
 ENG_issue_regional_regeneration_grants_desc: "Targeted grants soften old industrial decline and improve the Union score, without turning strained regions into boom regions."
 ENG_underwrite_north_sea_service_contracts: "Underwrite North Sea Service Contracts"
 ENG_underwrite_north_sea_service_contracts_desc: "State-backed contracts give British firms a stronger place in offshore engineering, logistics and energy support."
 ENG_expand_university_technology_parks: "Expand University Technology Parks"
 ENG_expand_university_technology_parks_desc: "University-linked technology parks strengthen research commercialisation and data infrastructure."
 ENG_prepare_channel_tunnel_financing: "Prepare Channel Tunnel Financing"
 ENG_prepare_channel_tunnel_financing_desc: "The Channel Tunnel needs patient finance, French confidence and a government willing to carry early political cost."
 ENG_invite_foreign_banks: "Invite Foreign Banks"
 ENG_invite_foreign_banks_desc: "The City can be made more global, faster."
 ENG_strengthen_the_watchdogs: "Strengthen the Watchdogs"
 ENG_strengthen_the_watchdogs_desc: "Confidence is easier to sustain if deregulation does not look like abdication."
 ENG_fast_track_new_trading_rules: "Fast Track New Trading Rules"
 ENG_fast_track_new_trading_rules_desc: "A faster Big Bang can bring money and heat in equal measure."
 ENG_backchannel_to_dublin: "Backchannel to Dublin"
 ENG_backchannel_to_dublin_desc: "Open quiet contact with Dublin. Ireland receives a response event; if it accepts, informal channels lower IRA support and build Peace Progress."
 ENG_backchannel_to_dublin_request_tt: "§HBackchannel to Dublin§!\nIreland receives a response event. §GIf Dublin accepts§!, Britain opens backchannels, gains Peace Progress, lowers IRA public support, and unlocks further Anglo-Irish tools. §RIf Dublin refuses§!, Peace Progress falls and IRA support rises."
 ENG_expand_intelligence_coordination: "Expand Intelligence Coordination"
 ENG_expand_intelligence_coordination_desc: "Coordinated intelligence hits arms, money and cells before they move, raising the Intel Penetration tracker. Requires Irish intelligence liaison from accepted Dublin cooperation."
 ENG_emergency_public_order_measures: "Emergency Public Order Measures"
 ENG_emergency_public_order_measures_desc: "Hard measures reduce immediate danger, but lift republican sympathy and loyalist tension while damaging stability."
 ENG_reassure_the_wets: "Reassure the Wets"
 ENG_reassure_the_wets_desc: "The softer wing of the Conservatives still matters in a country under strain."
 ENG_confront_the_militants: "Confront the Militants"
 ENG_confront_the_militants_desc: "Labour cannot avoid the conference floor forever."
 ENG_calm_alliance_federalists: "Calm Alliance Federalists"
 ENG_calm_alliance_federalists_desc: "The Alliance must keep reformers, localists and disciplinarians in one tent."
 ENG_call_a_constitutional_convention: "Call a Constitutional Convention"
 ENG_call_a_constitutional_convention_desc: "The future of the state can be forced into the open."
 ENG_prepare_devolution_drafts: "Prepare Devolution Drafts"
 ENG_prepare_devolution_drafts_desc: "Drafts are dull work until they become the basis of a new settlement."
 ENG_prepare_referendum_machinery: "Prepare Referendum Machinery"
 ENG_prepare_referendum_machinery_desc: "A fair vote requires machinery, legitimacy and nerves."
 eng_big_bang_preview.1.t: "The Big Bang Approaches"
 eng_big_bang_preview.1.d: "Officials, brokers and ministers are moving toward a radical opening of the City. The old rules are fading before the new ones are fully trusted."
 eng_big_bang_preview.1.a: "Open the market and watch the floor."
 eng_big_bang_preview.2.t: "Clean Transition"
 eng_big_bang_preview.2.d: "The reforms land cleanly. Foreign capital arrives, the City grows louder, and the Treasury begins to smile."
 eng_big_bang_preview.2.a: "London likes this future."
 eng_big_bang_preview.3.t: "Speculative Fever"
 eng_big_bang_preview.3.d: "The money is real, but so is the heat. Ministers are already being warned that deregulation has a political temperature."
 eng_big_bang_preview.3.a: "Growth rarely arrives politely."
 eng_big_bang_preview.4.t: "Regulatory Blowback"
 eng_big_bang_preview.4.d: "The reform package looks careless to critics and frightening to the public. The City has momentum, but the government has bought itself trouble."
 eng_big_bang_preview.4.a: "Tighten the line."
 eng_ulster_crisis.1.t: "Ulster Crisis Review"
 eng_ulster_crisis.1.d: "The latest security review from Northern Ireland is not a simple success or failure. Cooperation, backlash and renewed violence are all possible."
 eng_ulster_crisis.1.a: "Read the briefing."
 eng_ulster_crisis.2.t: "Security Cooperation Holds"
 eng_ulster_crisis.2.d: "Backchannels, intelligence and operational discipline hold together. For once, the system does not make the crisis worse."
 eng_ulster_crisis.2.a: "Keep the channels open."
 eng_ulster_crisis.3.t: "Unionist Backlash"
 eng_ulster_crisis.3.d: "Unionist leaders accuse Westminster of drifting toward Dublin. The government has calmed one fire by feeding another."
 eng_ulster_crisis.3.a: "This was always the risk."
 eng_ulster_crisis.4.t: "Bombing Campaign Escalates"
 eng_ulster_crisis.4.d: "A new wave of attacks forces the government back into emergency posture. The public wants answers and the security services want room."
 eng_ulster_crisis.4.a: "There will be consequences."
 eng_labour_conference.1.t: "Labour Conference"
 eng_labour_conference.1.d: "Kinnock faces a movement that wants unity, clarity and revenge in different proportions."
 eng_labour_conference.1.a: "Take the floor."
 eng_labour_conference.2.t: "Kinnock Wins the Floor"
 eng_labour_conference.2.d: "The leadership wins the argument. Not everyone is convinced, but most accept that Labour must be made governable."
 eng_labour_conference.2.a: "The party can move."
 eng_labour_conference.3.t: "Reconciliation at a Price"
 eng_labour_conference.3.d: "The factions avoid a rupture, but the compromise is expensive and untidy."
 eng_labour_conference.3.a: "Better untidy than broken."
 eng_labour_conference.4.t: "Left Walkout"
 eng_labour_conference.4.d: "A visible walkout wounds Labour's claim to discipline and hands the press an easy picture."
 eng_labour_conference.4.a: "Hold the centre."
 eng_labour_conference.5.t: "Liverpool Militant Crisis"
 eng_labour_conference.5.d: "The dispute in Liverpool has become a national camera pointed at Labour's inner war. Discipline can restore credibility, but compromise keeps parts of the movement inside the tent."
 eng_labour_conference.5.a: "Draw the line."
 eng_labour_conference.5.b: "Keep talking to the left."
 eng_labour_conference.6.t: "The Sun Problem"
 eng_labour_conference.6.d: "The hostile press has found its Labour story. The party machine can blunt the damage, but one bad week can still make reform look like panic."
 eng_labour_conference.6.a: "Run the grid."
 eng_labour_conference.7.t: "Nationwide Strike Threat"
 eng_labour_conference.7.d: "The return of union rights has raised expectations faster than the government can satisfy them. Ministers must decide whether to impose discipline or side with the movement."
 eng_labour_conference.7.a: "Force a settlement."
 eng_labour_conference.7.b: "Side with the workers."
 eng_labour_conference.8.t: "Sterling Market Test"
 eng_labour_conference.8.d: "The City has heard the government's plans. Currency traders, pension funds and foreign banks now test whether Labour can bend finance without breaking confidence."
 eng_labour_conference.8.a: "Hold the line."
 eng_labour_conference.9.t: "Clause IV Debate"
 eng_labour_conference.9.d: "The old pledge to common ownership carries memory, identity and electoral danger. Rewriting it can reassure Britain, but the movement will feel the loss."
 eng_labour_conference.9.a: "Rewrite it cleanly."
 eng_labour_conference.9.b: "Soften the language."
 eng_alliance_referendum.1.t: "The Reform Question"
 eng_alliance_referendum.1.d: "The Alliance has forced constitutional reform onto the table. The public is interested, but not infinitely patient."
 eng_alliance_referendum.1.a: "Test the appetite."
 eng_alliance_referendum.2.t: "Reform Momentum"
 eng_alliance_referendum.2.d: "The argument for reform gathers momentum. The old system suddenly looks less permanent."
 eng_alliance_referendum.2.a: "Push forward."
 eng_alliance_referendum.3.t: "Constitutional Fatigue"
 eng_alliance_referendum.3.d: "Voters accept that the system is flawed, but many wonder whether this government has mistaken process for bread."
 eng_alliance_referendum.3.a: "Keep it practical."
 eng_alliance_referendum.4.t: "The Old System Holds"
 eng_alliance_referendum.4.d: "The reform campaign stalls. The two-party system is battered but not beaten."
 eng_alliance_referendum.4.a: "The fight continues."
 ENG_1985_special_relationship_warmed: "Special Relationship Warmed"
 ENG_1985_labour_disarmament_alarm: "Labour Disarmament Alarm"
 ENG_education_reform_act: "The Education Reform Act"
 ENG_education_reform_act_desc: "Education will be made answerable to central standards, published results and a sharper managerial culture."
 ENG_local_management_of_schools: "Local Management of Schools"
 ENG_local_management_of_schools_desc: "Schools gain budget responsibility, but the settlement pulls authority away from older local government structures."
 ENG_section_28: "Section 28"
 ENG_section_28_desc: "The government hardens its social conservative flank, gaining discipline among supporters while deepening cultural conflict."
 ENG_poll_tax_registers: "Compile the Poll Tax Registers"
 ENG_poll_tax_registers_desc: "A flat local charge requires names, addresses and administrative pressure before it can produce revenue."
 ENG_community_charge_rollout: "Roll Out the Community Charge"
 ENG_community_charge_rollout_desc: "The Community Charge promises fiscal discipline and local accountability. It also asks the whole country to absorb the politics of a flat bill."
 ENG_face_down_the_ratepayers: "Face Down the Ratepayers"
 ENG_face_down_the_ratepayers_desc: "The government will not retreat from the charge simply because the opposition has found a street issue."
 ENG_poll_tax_rebate_scheme: "Offer Transitional Relief"
 ENG_poll_tax_rebate_scheme_desc: "Relief dulls the edge of the Community Charge, but it also weakens the clean fiscal logic that sold the policy to the Treasury."
 ENG_anti_poll_tax_pressure: "Anti-Poll Tax Pressure"
 ENG_anti_poll_tax_pressure_desc: "The charge is no longer a technical reform. It is becoming a test of public obedience, party loyalty and prime ministerial judgement."
 ENG_public_sector_governance_settlement: "Public Sector Governance Settlement"
 ENG_public_sector_governance_settlement_desc: "Schools, councils and local finance are now tied into one Westminster-centred settlement."
 ENG_float_the_water_authorities: "Float the Water Authorities"
 ENG_float_the_water_authorities_desc: "Water privatisation raises revenue, but households will notice the bills long after the Treasury counts the receipts."
 ENG_electricity_board_sell_off: "Sell the Electricity Boards"
 ENG_electricity_board_sell_off_desc: "The electricity boards are prepared for sale as another pillar of state ownership moves into regulated markets."
 ENG_lawson_boom: "The Lawson Boom"
 ENG_lawson_boom_desc: "Credit, confidence and tax receipts surge together. A boom is still a boom even when it is building its own correction."
 ENG_south_east_property_boom: "South-East Property Boom"
 ENG_south_east_property_boom_desc: "Rising property values and office demand pour wealth into the South East while making the regional divide harder to ignore."
 ENG_interest_rate_squeeze: "The Interest Rate Squeeze"
 ENG_interest_rate_squeeze_desc: "The boom overheats. Higher rates defend confidence, but the pain spreads through mortgages, firms and cabinet nerves."
 ENG_cabinet_under_pressure: "Cabinet Under Pressure"
 ENG_cabinet_under_pressure_desc: "The later Thatcher years turn policy success into political strain. Loyalty is still present, but it is no longer effortless."
 ENG_no_turning_back: "No Turning Back"
 ENG_no_turning_back_desc: "The government commits to the full architecture of the Thatcher settlement, accepting that the social and party costs cannot be wished away."
 ENG_education_reform_act_idea: "Education Reform Act"
 ENG_education_reform_act_idea_desc: "Central standards and managerial reform reshape schools while raising administrative pressure."
 ENG_section_28_idea: "Section 28"
 ENG_section_28_idea_desc: "A socially conservative education clause strengthens parts of the Tory coalition and alienates others."
 ENG_poll_tax_backlash_idea: "Poll Tax Backlash"
 ENG_poll_tax_backlash_idea_desc: "The Community Charge improves population tax collection, but the flat bill tears into legitimacy and public order."
 ENG_poll_tax_relief_idea: "Poll Tax Relief"
 ENG_poll_tax_relief_idea_desc: "Transitional relief softens the charge, but the Treasury does not get relief for free."
 ENG_1985_water_privatisation_idea: "Water Privatisation"
 ENG_1985_water_privatisation_idea_desc: "Water authorities are floated, turning a public utility into a regulated private market."
 ENG_1985_electricity_privatisation_idea: "Electricity Privatisation"
 ENG_1985_electricity_privatisation_idea_desc: "The electricity boards join the wider privatisation programme, trading state control for market receipts."
 ENG_1985_lawson_boom_idea: "Lawson Boom"
 ENG_1985_lawson_boom_idea_desc: "Deregulation, credit and confidence push the economy upward, with the warning signs still easy to dismiss."
 ENG_1985_housing_bubble_idea: "Housing Bubble"
 ENG_1985_housing_bubble_idea_desc: "The South East property market becomes a political asset and a social pressure point at the same time."
 ENG_interest_rate_squeeze_idea: "Interest Rate Squeeze"
 ENG_interest_rate_squeeze_idea_desc: "Higher rates defend the currency and cool the boom, but they hurt households and firms."
 ENG_late_thatcher_cabinet_friction_idea: "Cabinet Friction"
 ENG_late_thatcher_cabinet_friction_idea_desc: "Policy discipline is turning into personal strain inside the government."
 ENG_thatcher_poll_tax_unrest_modifier: "Poll Tax Unrest"
 ENG_thatcher_poll_tax_unrest_modifier_tt: "The Community Charge is producing local unrest, higher policing needs and weaker regional productivity."
 ENG_thatcher_south_east_housing_boom_modifier: "South-East Housing Boom"
 ENG_thatcher_south_east_housing_boom_modifier_tt: "The South East is gaining offices and private wealth while housing pressure narrows useful local space."
 ENG_thatcher_water_rates_backlash_modifier: "Water Rates Backlash"
 ENG_thatcher_water_rates_backlash_modifier_tt: "Water privatisation is producing local resentment over bills and accountability."
 ENG_green_shortcut: "Ecology"
 ENG_ecology_party_breakthrough: "The Ecology Party Breakthrough"
 ENG_ecology_party_breakthrough_desc: "The Ecology Party enters government as a protest against the old economic argument, but Britain still has to be governed through cold war budgets, North Sea decline and an uneasy Union."
 ENG_from_ecology_to_green_party: "From Ecology to Green Party"
 ENG_from_ecology_to_green_party_desc: "The party must become more than a campaign label. It needs discipline, spokespeople and a programme that can survive Whitehall."
 ENG_local_environmental_democracy: "Local Environmental Democracy"
 ENG_local_environmental_democracy_desc: "Councils, planning boards and local campaigners can give green politics roots, though decentralisation also adds administrative cost."
 ENG_cnd_cabinet_debate: "The CND Cabinet Debate"
 ENG_cnd_cabinet_debate_desc: "The peace movement helped make this government possible. Turning slogans into defence policy is harder."
 ENG_clean_air_and_water_bill: "Clean Air and Water Bill"
 ENG_clean_air_and_water_bill_desc: "Pollution controls and water standards can make the state look useful again, but enforcement is expensive."
 ENG_north_sea_transition_plan: "North Sea Transition Plan"
 ENG_north_sea_transition_plan_desc: "North Sea expertise can be redirected toward wind, offshore engineering and energy conservation before the revenue cushion fades."
 ENG_greenham_governing_test: "The Greenham Governing Test"
 ENG_greenham_governing_test_desc: "Greenham Common becomes a test of whether a protest movement can govern without abandoning the people who gave it force."
 ENG_retrofit_britain: "Retrofit Britain"
 ENG_retrofit_britain_desc: "Insulation, rail links and public works can cut waste and create jobs, though the Treasury will feel every contract."
 ENG_renewable_procurement_board: "Renewable Procurement Board"
 ENG_renewable_procurement_board_desc: "A procurement board gives the transition industrial teeth, pushing orders into British firms and research programmes."
 ENG_steady_state_economy: "A Steady-State Economy"
 ENG_steady_state_economy_desc: "Growth for its own sake is rejected. Stability improves, but markets and productivity do not applaud restraint."
 ENG_green_modernisation_programme: "Green Modernisation Programme"
 ENG_green_modernisation_programme_desc: "The transition is sold as an industrial future: cleaner energy, technology, services and exportable expertise."
 ENG_no_first_use_review: "No-First-Use Review"
 ENG_no_first_use_review_desc: "Britain can lower the nuclear temperature, but Washington and parts of Whitehall will hear weakness before they hear restraint."
 ENG_green_defence_compromise: "Green Defence Compromise"
 ENG_green_defence_compromise_desc: "NATO is kept, but the mission is narrowed toward defensive posture, arms control and civil resilience."
 ENG_the_green_settlement: "The Green Settlement"
 ENG_the_green_settlement_desc: "A green government cannot make Britain easy to govern. It can make the bargain cleaner, more local and less dependent on the old carbon economy."
 ENG_1985_set_green_route_tt: "§YEcology / Green Programme§! becomes active.\nThis route builds §YGreen Transition§! through local environmental democracy, anti-nuclear pressure, North Sea transition, retrofitting, renewable procurement and a difficult defence compromise.\nFormer Conservative, Labour, Alliance, Hard Left and Nationalist route spirits are removed."
 ENG_green_transition_modifier: "Green Transition"
 ENG_green_transition_modifier_tt: "The Green programme is built through decentralisation, energy transition, anti-nuclear pressure and environmental regulation. It can improve stability, power efficiency, renewable output and research while reducing fossil dependence, but it usually raises state costs and can strain defence policy."
 ENG_margaret_wright_idea: "Margaret Wright"
 ENG_margaret_wright_idea_desc: "Margaret Wright carries the Ecology Party from protest politics into the responsibilities of government."
 ENG_margaret_wright_idea_tt: "A green prime minister improves public trust among reformers, but governing through a young party slows the machine and pulls defence policy toward anti-nuclear positions."
 ENG_green_party_government_idea: "Green Party Government"
 ENG_green_party_government_idea_desc: "The government is trying to turn environmental protest, peace politics and local democracy into a national programme."
 ENG_clean_air_and_water_bill_idea: "Clean Air and Water Bill"
 ENG_clean_air_and_water_bill_idea_desc: "Higher environmental standards improve public health and confidence while adding visible costs to enforcement and utilities."
 ENG_north_sea_transition_idea: "North Sea Transition"
 ENG_north_sea_transition_idea_desc: "Offshore engineering and North Sea expertise are being redirected into renewable energy and conservation."
 ENG_green_settlement_idea: "The Green Settlement"
 ENG_green_settlement_idea_desc: "Britain has accepted a greener state bargain: cleaner energy, stronger civic standards and higher transition costs."
