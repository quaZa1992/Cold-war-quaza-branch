l_english:
# IMPERIA COLD WAR — Eastern Bloc consumer goods contracts
 COLDWAR_EB_CONTRACT_CANCEL: "Cancel the Consumer Goods Contract"
 COLDWAR_EB_CONTRACT_CANCEL_TITLE: "Cancel the Consumer Goods Contract"
 COLDWAR_EB_CONTRACT_CANCEL_ACTION_DESC: "We end our consumer goods contract with this country at once."
 COLDWAR_EB_CONTRACT_REVOKE: "End the Consumer Goods Contract"
 COLDWAR_EB_CONTRACT_REVOKE_TITLE: "End the Consumer Goods Contract"
 COLDWAR_EB_CONTRACT_REVOKE_ACTION_DESC: "We stop selling consumer goods to this country. Their weekly payments to us end at once."
 COLDWAR_EB_CONTRACT_REVOKE_SEND_DESC: "We stop our consumer goods deliveries to [THIS.GetNameDef]. Their weekly payments to us end at once."
 COLDWAR_EB_CONTRACT_REVOKE_RECEIVE_DESC: "[FROM.GetNameDefCap] has stopped its consumer goods deliveries to us."
 COLDWAR_EB_ct_not_pending_tt: "No request of ours is waiting for their answer"
 COLDWAR_EBC_income_tt: "Income: about §G[?COLDWAR_EB_rq_amt|2]§! billion over one year, paid every week (more when the Cold War is tense)\nEither side can end the contract at any time in the diplomacy screen"
 COLDWAR_EBC.1.t: "[?var:COLDWAR_EB_rq_cur_b.GetNameDefCap] Wants Our Consumer Goods"
 COLDWAR_EBC.1.d: "The trade ministry of §Y[?var:COLDWAR_EB_rq_cur_b.GetNameDef]§! asks for a one year contract of size §Y[?COLDWAR_EB_rq_cur_s|0]§!: refrigerators, jeans and coffee for its shops, paid in hard currency every week.\n\nFor them the goods calm the queues at home. For us they are a reliable customer, and a window into a closed society."
 COLDWAR_EBC.1.a: "Sign the contract."
 COLDWAR_EBC.1.b: "We do not sell to them."
 COLDWAR_EBC.2.t: "[?var:COLDWAR_EB_rp_by.GetNameDefCap] Signs the Contract"
 COLDWAR_EBC.2.d: "§Y[?var:COLDWAR_EB_rp_by.GetNameDefCap]§! has signed our consumer goods contract of size §Y[?COLDWAR_EB_rp_size|0]§! for one year. The first deliveries reach our shops next week, and the payments leave our Treasury every week."
 COLDWAR_EBC.2.a: "Fill the shelves."
 COLDWAR_EBC.3.t: "[?var:COLDWAR_EB_rp_by.GetNameDefCap] Refuses the Contract"
 COLDWAR_EBC.3.d: "§Y[?var:COLDWAR_EB_rp_by.GetNameDefCap]§! will not sell consumer goods to us. We can ask another Western country."
 COLDWAR_EBC.3.a: "Their loss."
 COLDWAR_EBC.4.t: "[?var:COLDWAR_EB_rv_by.GetNameDefCap] Ends the Contract"
 COLDWAR_EBC.4.d: "§Y[?var:COLDWAR_EB_rv_by.GetNameDefCap]§! has stopped its consumer goods deliveries. Our weekly payments end, and so does the calm in the queues.\n§RThere was a 5% chance of a Spark: half of the Pressure becomes Unrest.§!"
 COLDWAR_EBC.4.a: "We will remember this."
 COLDWAR_EBC.5.t: "[?var:COLDWAR_EB_cn_by.GetNameDefCap] Cancels the Contract"
 COLDWAR_EBC.5.d: "§Y[?var:COLDWAR_EB_cn_by.GetNameDefCap]§! has cancelled its consumer goods contract with us. Its weekly payments end at once."
 COLDWAR_EBC.5.a: "Noted."
 COLDWAR_EB_ct_blank: ""
 COLDWAR_EB_ct_list_none: "\nNo contract is running."
 COLDWAR_EB_ct_line_1_txt: "\n[?var:COLDWAR_EB_ctv_p1.GetNameWithFlag]: size §Y[?COLDWAR_EB_ctv_s1|0]§!, about §Y[?COLDWAR_EB_ctv_d1|0]§! days left"
 COLDWAR_EB_ct_line_2_txt: "\n[?var:COLDWAR_EB_ctv_p2.GetNameWithFlag]: size §Y[?COLDWAR_EB_ctv_s2|0]§!, about §Y[?COLDWAR_EB_ctv_d2|0]§! days left"
 COLDWAR_EB_ct_line_3_txt: "\n[?var:COLDWAR_EB_ctv_p3.GetNameWithFlag]: size §Y[?COLDWAR_EB_ctv_s3|0]§!, about §Y[?COLDWAR_EB_ctv_d3|0]§! days left"
 COLDWAR_EB_ct_line_4_txt: "\n[?var:COLDWAR_EB_ctv_p4.GetNameWithFlag]: size §Y[?COLDWAR_EB_ctv_s4|0]§!, about §Y[?COLDWAR_EB_ctv_d4|0]§! days left"
 COLDWAR_EB_CONTRACT_BUY: "Buy Western Consumer Goods"
 COLDWAR_EB_CONTRACT_BUY_TITLE: "Buy Western Consumer Goods"
 COLDWAR_EB_CONTRACT_BUY_ACTION_DESC: "Ask this country for a one year consumer goods contract. Pick the size in the window. All our contracts together can reach at most §Y3§! size steps."
 COLDWAR_EB_CONTRACT_BUY_SEND_DESC: "We ask [THIS.GetNameDef] for a one year consumer goods contract. They answer within a day."
 COLDWAR_EB_CONTRACT_BUY_RECEIVE_DESC: "[FROM.GetNameDefCap] asks us for a consumer goods contract. We answer in the event that follows."
 COLDWAR_EB_ct_title: "Buy Western Consumer Goods"
 COLDWAR_EB_ct_desc: "Contract for one year. Choose the size:"
 COLDWAR_EB_ct_size_1: "Small"
 COLDWAR_EB_ct_size_1_tt: "§YSmall contract§! (1 of 3 size steps)"
 COLDWAR_EB_ct_summary_1: "We pay every week about §Y1.04%§! of our GDP over the year, more when the Cold War is tense.\nUnrest: §G-0.15§! per month   Stability: §G+1%§!   Consumer goods: §G-2%§!\nDaily Pro-Western Support: §R+0.005§!"
 COLDWAR_EB_ct_size_2: "Medium"
 COLDWAR_EB_ct_size_2_tt: "§YMedium contract§! (2 of 3 size steps)"
 COLDWAR_EB_ct_summary_2: "We pay every week about §Y2.08%§! of our GDP over the year, more when the Cold War is tense.\nUnrest: §G-0.3§! per month   Stability: §G+2%§!   Consumer goods: §G-4%§!\nDaily Pro-Western Support: §R+0.01§!"
 COLDWAR_EB_ct_size_3: "Large"
 COLDWAR_EB_ct_size_3_tt: "§YLarge contract§! (3 of 3 size steps)"
 COLDWAR_EB_ct_summary_3: "We pay every week about §Y4.16%§! of our GDP over the year, more when the Cold War is tense.\nUnrest: §G-0.45§! per month   Stability: §G+3%§!   Consumer goods: §G-6%§!\nDaily Pro-Western Support: §R+0.015§!"
 COLDWAR_EB_ct_summary: "[COLDWAR_EB_ct_summary_sl]"
 COLDWAR_EB_ct_note: "Size steps in use: §Y[?ROOT.COLDWAR_EB_contract_total|0]§! running, §Y[?ROOT.COLDWAR_EB_ct_pend_total|0]§! waiting, §Y[?ROOT.COLDWAR_EB_ct_free|0]§! of 3 free."
 COLDWAR_EB_ct_cap_full_tt: "All §Y3§! size steps for Western goods are already used or requested"
 COLDWAR_EB_ct_cap_size_tt: "The chosen size fits into our free size steps"
