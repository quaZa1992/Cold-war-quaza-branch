 cw_sr_report.21.t: "[ROOT.GetName]: Space Programme Authorised"
 cw_sr_report.21.d: "[ROOT.GetName] has authorised development of Deep-Space Tracking Network. Development requires sustained funding; mission hardware and operating costs require separate appropriations."
