 cw_sr_p1_description: "Expand large antennas, precision clocks, tracking ships and mission-control links. Commissioning creates national deep-space communications capacity."
 cw_sr_p2_description: "Qualify restart sequences, coast-phase control, propellant management and precision injection. A transfer stage serves GEO, lunar and planetary missions without forcing one orbit before another."
 cw_sr_p3_description: "Test docking targets, relative navigation, propulsion tolerances, crew procedures and rescue compatibility in Earth orbit."
 cw_sr_p4_description: "Develop multispectral instruments, image reception, calibration and national cartographic processing. Returns agriculture, water-management and survey evidence."
 cw_sr_p5_description: "Develop solar pointing, radiation-tolerant detectors, telescope calibration and an orbital scientific operations team."
 cw_sr_p6_description: "Build a GEO satellite bus, injection motor, ground terminals and reliable station keeping. Expansion requires replacement launches and a supported ground network."
 cw_sr_p7_description: "Develop highly elliptical spacecraft, high-latitude terminals and orbital handover schedules. The architecture trades continuous single-satellite visibility for useful high-latitude coverage."
 cw_sr_p8_description: "Develop stable clocks, orbital ephemerides, receiver standards and ground correction stations. A constellation, replacement capacity and receiver adoption are required for useful national coverage."
 cw_sr_p9_description: "Integrate precision pointing, secure mission control, image recovery or relay and a continuing interpretation service. Coverage has revisit gaps and replacement costs."
 cw_sr_p10_description: "Qualify large propulsion clusters, stage structures, assembly buildings, launch pads and full-scale flight tests. A heavy-lift family does not become reliable through funding alone."
 cw_sr_p11_description: "Expand long-duration engine tests, fault isolation, manufacturing inspection and high-altitude simulation. A qualified centre supports future reusable and long-coast systems."
 cw_sr_p12_description: "Test atmosphere management, water recovery, biological monitoring, maintenance and emergency reserves over progressively longer orbital missions."
 cw_sr_p13_description: "Qualify radar rendezvous, abort corridors, automatic docking and uncrewed navigation. Demonstration flights establish safe cargo and modular assembly procedures."
 cw_sr_p14_description: "Develop a pressurised cargo vehicle, propellant transfer interfaces, rendezvous software and disposal procedures. Each delivery consumes a vehicle and launch allocation."
 cw_sr_p15_description: "Develop a single-launch station, crew transport interfaces, onboard science and finite consumable reserves. Early stations have limited life and cannot support an indefinite crew without logistics."
 cw_sr_p16_description: "Develop a large orbital workshop with solar instruments, accommodation, electrical power and crew transport. Launch damage, thermal control and repair capability remain serious mission risks."
 cw_sr_p17_description: "Develop a central module, standard docking ports, incremental science modules, cargo schedules, crew rotation and orbital maintenance. Sustained occupation requires continuing launches and operating finance."
 cw_sr_p18_description: "Develop ascent systems, thermal protection, reusable engines, flight software, landing and a refurbishment infrastructure. Reuse reduces selected hardware replacement, while inspection and launch costs continue."
 cw_sr_p19_description: "Develop restartable orbital propulsion, autonomous capture, thermal control and service interfaces. A tug moves a limited payload; it needs propellant, docking compatibility and replacement support."
 cw_sr_p20_description: "Test insulation, boil-off management, transfer couplings, fluid measurement and contamination control in orbit. Ground tanks alone do not qualify a zero-gravity propellant transfer system."
 cw_sr_p21_description: "Assemble a storage platform, delivery vehicles, transfer plumbing and rendezvous procedures. Replenishment flights and boil-off losses remain substantial operating costs."
 cw_sr_p22_description: "Develop precision optics, detector calibration, low-vibration pointing, thermal control and a scientific operations centre. An optical fault may require a costly servicing mission."
 cw_sr_p23_description: "Qualify lunar-orbit insertion, mapping instruments, navigation and long-range links. Surface maps improve later mission planning without making this orbiter a universal prerequisite."
 cw_sr_p24_description: "Develop descent propulsion, hazard tolerance, teleoperation, thermal survival and a mobile science package. Landing success and useful surface operation are separate mission objectives."
 cw_sr_p25_description: "Develop landing, drilling, surface ascent, Earth-return guidance and a recoverable sample capsule. Each stage may leave a scientifically useful partial success without returning material."
 cw_sr_p26_description: "Qualify a longer lunar-distance crew mission, navigation, radiation monitoring, abort planning and high-speed Earth return. It does not itself deliver a lunar lander."
 cw_sr_p27_description: "Develop and qualify a complete lunar expedition: transfer, lunar orbit, descent, ascent, docking and safe Earth recovery. Every expedition consumes substantial launch and flight hardware."
 cw_sr_p28_description: "Develop a small crew-tended lunar-orbit laboratory, deep-space maintenance, supply flights and rescue contingencies. Permanent occupation requires a separate sustained logistics commitment."
 cw_sr_p29_description: "Develop landed habitat modules, power, radiation protection, surface logistics, spares and recurring crew transport. Initial crews visit seasonally; continuous occupation is a further major commitment."
 cw_sr_p30_description: "Develop a lunar-distance relay, halo-orbit navigation, large antennas and sustained station keeping to support far-side science. The mission does not operate at Sun-Earth L2."
 cw_sr_p31_description: "Develop solar-wind instruments, halo-orbit injection, long-range tracking and station keeping. The Sun-Earth L1 region is roughly 1.5 million km sunward from Earth."
 cw_sr_p32_description: "Develop cryogenic detectors, passive thermal geometry, precision pointing and distant autonomous servicing procedures. The Sun-Earth L2 region lies beyond Earth, away from the Sun."
 cw_sr_p33_description: "Develop a protected entry vehicle, pressure vessel, descent instruments and rapid data transmission. Atmospheric science may succeed even when surface contact is brief or absent."
 cw_sr_p34_description: "Develop orbital insertion, radar mapping, thermal control and long-lived communications. An orbiter is a different technical branch from a short-lived surface probe."
 cw_sr_p35_description: "Develop Mars-orbit insertion, imaging, navigation and a sustained science operation. Launch-window delays and dust conditions can alter the mission without destroying all scientific value."
 cw_sr_p36_description: "Develop entry, descent, landing, sterilisation, power and surface science. Landing, short surface contact and a complete operating season are different outcomes."
 cw_sr_p37_description: "Develop long-life power, radiation protection, weak-signal communications and outer-planet navigation. Useful science arrives after a multi-year cruise."
 cw_sr_p38_description: "Develop a long-lived probe, precision encounters, autonomous fault management and a series of gravity assists. Initial arrival resolves the first giant-planet encounter; later milestones require additional cruise years."
 cw_sr_p39_description: "Develop a heat-tolerant probe, Venus gravity assist, precision navigation and short high-value Mercury encounters. This is a flyby mission rather than a Mercury orbiter."
 cw_sr_p40_description: "Develop a nuclear propulsion stage, reactor controls, shielding, ground safety infrastructure and an uncrewed in-space test. Successful ground firing is substantial evidence but does not qualify a complete flight vehicle."
 cw_sr_p41_description: "Develop a crewed military reconnaissance station, optical instruments, secure downlinks, film-return procedures and its crew transport. Crewed intelligence has political visibility, finite endurance and high recurring cost."
 cw_sr_p42_description: "Develop a compatible docking adapter, atmosphere-transfer procedures, joint tracking, crew training and rescue doctrine. A bilateral flight needs negotiated partners; national hardware alone cannot create a diplomatic agreement."
 cw_sr_p43_description: "Rebuild an unsuccessful super-heavy launch programme through engine testing, cluster control, independent quality assurance and new full-scale flights. Continue lander and lunar-return qualification only after credible launch evidence."
 cw_sr_p44_description: "Develop a super-heavy launch system, large winged orbiter, autonomous re-entry and a national processing infrastructure. A successful uncrewed demonstration does not certify regular crew transport or an economic reusable service."
 cw_sr_p45_description: "Develop a Venus entry package, atmospheric balloon, multi-national instruments and a continuing comet flyby trajectory. Balloon deployment and the later encounter are distinct objectives of one demanding flight architecture."
 cw_sr_p46_description: "Retain heavy-launch production and develop successive orbital workshops, crew rotations, solar astronomy and Earth-observation campaigns. Workshop replacement and expedition hardware remain recurring costs."
 cw_sr_p47_description: "Establish a civilian coordinating commission, national scientific priorities, procurement rules and a small programme office. Any player-controlled country may begin without inherited space hardware."
 cw_sr_p48_description: "Develop suborbital scientific rockets, range safety, telemetry and payload-recovery procedures. Sounding flights build teams and evidence without establishing orbital launch capability."
 cw_sr_p49_description: "Develop a modest spacecraft bus, power supply, scientific instrument package, environmental testing and ground acceptance. A qualified payload still needs a purchased or national launch."
 cw_sr_p50_description: "Contract a launch provider, qualify interfaces and launch a small national spacecraft. This establishes foreign-provider orbital access and mission operations without creating a domestic rocket industry."
 cw_sr_p51_description: "Qualify multi-stage propulsion, guidance, payload separation, range safety and full orbital flight. A national launcher is a long, expensive strategic choice alongside purchased launch access."
 cw_sr_p52_description: "Develop a modest tracking antenna, communications links, orbital data processing and trained mission controllers. This supports national satellites and international scientific cooperation."
 cw_sr_p53_description: "Develop a crew cabin, short-duration life support, escape system, heat shield, recovery operations and progressively qualified uncrewed then crewed missions. A satellite programme does not provide a crew vehicle automatically."
 cw_sr_p54_description: "Qualify an autonomous deep-space bus, thermal control, long-range communications, attitude control and cruise fault recovery on a high-energy demonstration flight."
 cw_sr_p55_description: "Qualify the Diamant B reference architecture and a new equatorial launch site, including stage integration, range control and payload interfaces."
 cw_sr_p56_description: "Qualify a compact national orbital launcher and experimental satellite, using test flights and Woomera launch cooperation. A successful launch demonstrates a limited domestic launch capability."
 cw_sr_p57_description: "Develop a British scientific satellite, instrument calibration and university operations while contracting foreign launch services. A national payload can fly before a domestic rocket is ready."
 cw_sr_p58_description: "Complete an unguided solid-stage orbital demonstration through stage sequencing, spin stabilisation, separation tests and range operations."
 cw_sr_p59_description: "Develop a more capable solid-propellant scientific launcher, flight control and a succession of national science satellites. Each new instrument or launch remains a further commitment."
 cw_sr_p60_description: "Complete the first national orbital launcher and satellite through integrated testing, launch-range qualification, tracking and payload acceptance."
 cw_sr_p61_description: "Develop a recoverable experiment capsule, thermal protection, de-orbit control and national recovery teams. Payload survival and successful recovery are separate from orbital insertion."
 cw_sr_p62_description: "Develop a modest scientific satellite, Indian instrument and operations teams, and interfaces for a foreign launch provider. The mission establishes science and operations rather than a domestic rocket."
 cw_sr_p63_description: "Develop a four-stage small launcher, guidance, integration facilities and an experimental satellite. National orbital launch remains a separate long-term project from foreign satellite access."
 cw_sr_p64_description: "Develop a follow-on ionospheric research satellite, antennas, calibration and Canadian ground operations. Launch is purchased from an established provider."
 cw_sr_p65_description: "Develop a domestic communications service through procured spacecraft, provider-qualified transfer stages, northern ground terminals and broadcast operations."
 cw_sr_p66_description: "Develop equatorial science missions, ocean-platform operations and Scout integration with a partner. Offshore launch geography offers a national service role without supplying a domestic rocket."
 cw_sr_p67_description: "Develop an experimental communications payload, propagation measurements, receiving terminals and international launch integration."
 cw_sr_p68_description: "Develop a follow-on radiation-belt science payload, experiment calibration and ground analysis using a contracted polar launch."
 cw_sr_p69_description: "Develop a cooperative European communications spacecraft, stable three-axis pointing, international terminals and partner launch procurement."
 cw_sr_p70_description: "Develop a compact astronomical satellite, ultraviolet and X-ray instruments, precise pointing and ground analysis with an international launch provider."
 cw_sr_p71_description: "Expand polar sounding flights, auroral instruments, tracking and international scientific range services. The campaign remains suborbital."
 cw_sr_p72_description: "Expand range scheduling, safe launch corridors, telemetry, recovery support and services for international partner vehicles."
 cw_sr_p73_description: "Develop a national sounding-rocket series, scientific payload integration, range safety and upper-atmosphere research campaigns."
 cw_sr_p74_description: "Develop sounding-rocket flights, payload recovery, atmospheric instruments and range services within a limited national research budget."
 cw_sr_p75_description: "Negotiate a scientific payload agreement, qualify photometers and plasma instruments, integrate them with a partner spacecraft and operate national receiving and analysis teams. The launch vehicle and satellite bus are supplied by the partner."
 cw_sr_p76_description: "Develop atmospheric instruments, calibration, telemetry and joint analysis for partner-operated high-altitude rocket campaigns. Acceptance covers the payload campaign and its ground systems; it does not qualify a domestic rocket."
 cw_sr_p77_description: "Develop a precision multispectral camera, film handling, calibration, interpretation laboratories and integration with a Soviet spacecraft. Partner launch procurement and an accepted payload agreement remain part of the funded mission."
 cw_sr_p78_description: "Secure a partner flight agreement, select and medically qualify a research cosmonaut, train with the Soviet crew and prepare a national experiment package. Transport, rescue and station access are supplied through the partner agreement."
 cw_sr_p79_description: "Negotiate network participation and capacity access, build an Earth terminal and qualify antenna pointing, links, staffing and national communications interfaces. The shared space segment remains a partner-operated service."
 cw_sr_p80_description: "Develop a landed rover, terrain navigation, autonomous fault protection, surface power and a remotely supervised traverse. Communications delay requires onboard decisions; a successful landing alone does not complete a mobile science campaign."
 cw_sr_p81_description: "Develop sterile sampling, a Mars ascent vehicle, orbital or direct return interfaces, an Earth-entry capsule and a secure sample-receiving facility. The mission lasts through sample recovery on Earth; surface collection alone earns no returned-sample capability."
 cw_sr_p82_description: "Qualify expedition living volume, regenerative support, maintenance reserves, medical monitoring and storm-shelter procedures. A twenty-four-month orbital endurance campaign follows development; it tests habitation without claiming that Earth orbit reproduces the interplanetary radiation environment."
 cw_sr_p83_description: "Qualify large aeroshell structures, guidance through a thin atmosphere, terminal propulsion, landing stability and cargo deployment. Deliver an uncrewed representative load before committing a crew. Small science-lander experience is insufficient for expedition-scale payloads."
 cw_sr_p84_description: "Develop and qualify the complete expedition: orbital assembly, transfer propulsion, shielding, redundant support, surface habitat, ascent vehicle and Earth return. Include uncrewed ascent and return-hardware qualification before crew departure. The funded mission covers multiple launches, outbound flight, a surface expedition and the journey home. Full success is awarded only after crew recovery on Earth."
 cw_sr_p1_brief: "Expand large antennas, precision clocks, tracking ships and mission-control links."
 cw_sr_p2_brief: "Qualify restart sequences, coast-phase control, propellant management and precision injection."
 cw_sr_p3_brief: "Test docking targets, relative navigation, propulsion tolerances, crew procedures and rescue compatibility in Earth orbit.."
 cw_sr_p4_brief: "Develop multispectral instruments, image reception, calibration and national cartographic processing."
 cw_sr_p5_brief: "Develop solar pointing, radiation-tolerant detectors, telescope calibration and an orbital scientific operations team.."
 cw_sr_p6_brief: "Build a GEO satellite bus, injection motor, ground terminals and reliable station keeping."
 cw_sr_p7_brief: "Develop highly elliptical spacecraft, high-latitude terminals and orbital handover schedules."
 cw_sr_p8_brief: "Develop stable clocks, orbital ephemerides, receiver standards and ground correction stations."
 cw_sr_p9_brief: "Integrate precision pointing, secure mission control, image recovery or relay and a continuing interpretation service."
 cw_sr_p10_brief: "Qualify large propulsion clusters, stage structures, assembly buildings, launch pads and full-scale flight tests."
 cw_sr_p11_brief: "Expand long-duration engine tests, fault isolation, manufacturing inspection and high-altitude simulation."
 cw_sr_p12_brief: "Test atmosphere management, water recovery, biological monitoring, maintenance and emergency reserves over progressively longer orbital missions.."
 cw_sr_p13_brief: "Qualify radar rendezvous, abort corridors, automatic docking and uncrewed navigation."
 cw_sr_p14_brief: "Develop a pressurised cargo vehicle, propellant transfer interfaces, rendezvous software and disposal procedures."
 cw_sr_p15_brief: "Develop a single-launch station, crew transport interfaces, onboard science and finite consumable reserves."
 cw_sr_p16_brief: "Develop a large orbital workshop with solar instruments, accommodation, electrical power and crew transport."
 cw_sr_p17_brief: "Develop a central module, standard docking ports, incremental science modules, cargo schedules, crew rotation and orbital maintenance."
 cw_sr_p18_brief: "Develop ascent systems, thermal protection, reusable engines, flight software, landing and a refurbishment infrastructure."
 cw_sr_p19_brief: "Develop restartable orbital propulsion, autonomous capture, thermal control and service interfaces."
 cw_sr_p20_brief: "Test insulation, boil-off management, transfer couplings, fluid measurement and contamination control in orbit."
 cw_sr_p21_brief: "Assemble a storage platform, delivery vehicles, transfer plumbing and rendezvous procedures."
 cw_sr_p22_brief: "Develop precision optics, detector calibration, low-vibration pointing, thermal control and a scientific operations centre."
 cw_sr_p23_brief: "Qualify lunar-orbit insertion, mapping instruments, navigation and long-range links."
 cw_sr_p24_brief: "Develop descent propulsion, hazard tolerance, teleoperation, thermal survival and a mobile science package."
 cw_sr_p25_brief: "Develop landing, drilling, surface ascent, Earth-return guidance and a recoverable sample capsule."
 cw_sr_p26_brief: "Qualify a longer lunar-distance crew mission, navigation, radiation monitoring, abort planning and high-speed Earth return."
 cw_sr_p27_brief: "Develop and qualify a complete lunar expedition: transfer, lunar orbit, descent, ascent, docking and safe Earth recovery."
 cw_sr_p28_brief: "Develop a small crew-tended lunar-orbit laboratory, deep-space maintenance, supply flights and rescue contingencies."
 cw_sr_p29_brief: "Develop landed habitat modules, power, radiation protection, surface logistics, spares and recurring crew transport."
 cw_sr_p30_brief: "Develop a lunar-distance relay, halo-orbit navigation, large antennas and sustained station keeping to support far-side science."
 cw_sr_p31_brief: "Develop solar-wind instruments, halo-orbit injection, long-range tracking and station keeping."
 cw_sr_p32_brief: "Develop cryogenic detectors, passive thermal geometry, precision pointing and distant autonomous servicing procedures."
 cw_sr_p33_brief: "Develop a protected entry vehicle, pressure vessel, descent instruments and rapid data transmission."
 cw_sr_p34_brief: "Develop orbital insertion, radar mapping, thermal control and long-lived communications."
 cw_sr_p35_brief: "Develop Mars-orbit insertion, imaging, navigation and a sustained science operation."
 cw_sr_p36_brief: "Develop entry, descent, landing, sterilisation, power and surface science."
 cw_sr_p37_brief: "Develop long-life power, radiation protection, weak-signal communications and outer-planet navigation."
 cw_sr_p38_brief: "Develop a long-lived probe, precision encounters, autonomous fault management and a series of gravity assists."
 cw_sr_p39_brief: "Develop a heat-tolerant probe, Venus gravity assist, precision navigation and short high-value Mercury encounters."
 cw_sr_p40_brief: "Develop a nuclear propulsion stage, reactor controls, shielding, ground safety infrastructure and an uncrewed in-space test."
 cw_sr_p41_brief: "Develop a crewed military reconnaissance station, optical instruments, secure downlinks, film-return procedures and its crew transport."
 cw_sr_p42_brief: "Develop a compatible docking adapter, atmosphere-transfer procedures, joint tracking, crew training and rescue doctrine."
 cw_sr_p43_brief: "Rebuild an unsuccessful super-heavy launch programme through engine testing, cluster control, independent quality assurance and new full-scale flights."
 cw_sr_p44_brief: "Develop a super-heavy launch system, large winged orbiter, autonomous re-entry and a national processing infrastructure."
 cw_sr_p45_brief: "Develop a Venus entry package, atmospheric balloon, multi-national instruments and a continuing comet flyby trajectory."
 cw_sr_p46_brief: "Retain heavy-launch production and develop successive orbital workshops, crew rotations, solar astronomy and Earth-observation campaigns."
 cw_sr_p47_brief: "Establish a civilian coordinating commission, national scientific priorities, procurement rules and a small programme office."
 cw_sr_p48_brief: "Develop suborbital scientific rockets, range safety, telemetry and payload-recovery procedures."
 cw_sr_p49_brief: "Develop a modest spacecraft bus, power supply, scientific instrument package, environmental testing and ground acceptance."
 cw_sr_p50_brief: "Contract a launch provider, qualify interfaces and launch a small national spacecraft."
 cw_sr_p51_brief: "Qualify multi-stage propulsion, guidance, payload separation, range safety and full orbital flight."
 cw_sr_p52_brief: "Develop a modest tracking antenna, communications links, orbital data processing and trained mission controllers."
 cw_sr_p53_brief: "Develop a crew cabin, short-duration life support, escape system, heat shield, recovery operations and progressively qualified uncrewed then crewed missions."
 cw_sr_p54_brief: "Qualify an autonomous deep-space bus, thermal control, long-range communications, attitude control and cruise fault recovery on a high-energy demonstration flight.."
 cw_sr_p55_brief: "Qualify the Diamant B reference architecture and a new equatorial launch site, including stage integration, range control and payload interfaces.."
 cw_sr_p56_brief: "Qualify a compact national orbital launcher and experimental satellite, using test flights and Woomera launch cooperation."
 cw_sr_p57_brief: "Develop a British scientific satellite, instrument calibration and university operations while contracting foreign launch services."
 cw_sr_p58_brief: "Complete an unguided solid-stage orbital demonstration through stage sequencing, spin stabilisation, separation tests and range operations.."
 cw_sr_p59_brief: "Develop a more capable solid-propellant scientific launcher, flight control and a succession of national science satellites."
 cw_sr_p60_brief: "Complete the first national orbital launcher and satellite through integrated testing, launch-range qualification, tracking and payload acceptance.."
 cw_sr_p61_brief: "Develop a recoverable experiment capsule, thermal protection, de-orbit control and national recovery teams."
