 cw_sr_report.28.d: "[ROOT.GetName] has completed the accepted mission objectives of Deep-Space Tracking Network. The mission authority has accepted the scientific and operational campaign."
 cw_sr_report.29.t: "[ROOT.GetName]: Partial Mission Results"
 cw_sr_report.29.d: "[ROOT.GetName] has recovered limited scientific and engineering results from Deep-Space Tracking Network. The complete operational objective remains unqualified. A funded technical review is required."
 cw_sr_report.30.t: "[ROOT.GetName]: Mission Failure"
 cw_sr_report.30.d: "[ROOT.GetName] has reported the loss of mission hardware or an unsuccessful operating campaign for Deep-Space Tracking Network. A funded investigation and corrective engineering programme are required before another attempt."
 cw_sr_report.31.t: "[ROOT.GetName]: Spaceflight Disaster"
 cw_sr_report.31.d: "[ROOT.GetName] has reported a catastrophic accident during Deep-Space Tracking Network. Flight operations have been suspended pending an extended safety investigation."
