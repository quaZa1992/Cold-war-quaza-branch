 cw_sr_p1_detail: "Expand large antennas, precision clocks, tracking ships and mission-control links. Commissioning creates national deep-space communications capacity.\n\nDevelopment: $24bn / 42 months at standard qualification.\nMission: $0bn. Weekly operations: $0.04615bn.\nMission campaign: 0 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Ground Tracking.\nAccepted capability: Deep Space Communications.\nFirst accepted programme: +10 prestige, +0 research data, +0 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p2_detail: "Qualify restart sequences, coast-phase control, propellant management and precision injection. A transfer stage serves GEO, lunar and planetary missions without forcing one orbit before another.\n\nDevelopment: $31bn / 42 months at standard qualification.\nMission: $3bn. Weekly operations: $0.01538bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Orbital Flight.\nAccepted capability: High Energy Upper Stage.\nFirst accepted programme: +15 prestige, +1 research data, +1 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p3_detail: "Test docking targets, relative navigation, propulsion tolerances, crew procedures and rescue compatibility in Earth orbit.\n\nDevelopment: $18bn / 30 months at standard qualification.\nMission: $4bn. Weekly operations: $0.01538bn.\nMission campaign: 0.2 months. Crew: 2.\nEarliest development: 1970.\nRequires: Space Administration, Crewed Flight.\nAccepted capability: Rendezvous Docking.\nFirst accepted programme: +15 prestige, +1 research data, +1 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nIndependent Crewed Orbital Capsule.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p4_detail: "Develop multispectral instruments, image reception, calibration and national cartographic processing. Returns agriculture, water-management and survey evidence.\n\nDevelopment: $19bn / 36 months at standard qualification.\nMission: $3.2bn. Weekly operations: $0.025bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Orbital Flight.\nAccepted capability: Earth Observation, Polar Orbit.\nFirst accepted programme: +22 prestige, +1 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p5_detail: "Develop solar pointing, radiation-tolerant detectors, telescope calibration and an orbital scientific operations team.\n\nDevelopment: $17bn / 36 months at standard qualification.\nMission: $3bn. Weekly operations: $0.01538bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Orbital Flight.\nAccepted capability: Orbital Science.\nFirst accepted programme: +15 prestige, +1 research data, +1 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p6_detail: "Build a GEO satellite bus, injection motor, ground terminals and reliable station keeping. Expansion requires replacement launches and a supported ground network.\n\nDevelopment: $30bn / 42 months at standard qualification.\nMission: $5bn. Weekly operations: $0.04231bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, High Energy Upper Stage.\nAccepted capability: Geostationary Insertion, Global Communications.\nFirst accepted programme: +15 prestige, +1 research data, +1 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p7_detail: "Develop highly elliptical spacecraft, high-latitude terminals and orbital handover schedules. The architecture trades continuous single-satellite visibility for useful high-latitude coverage.\n\nDevelopment: $22bn / 36 months at standard qualification.\nMission: $3.8bn. Weekly operations: $0.03462bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Orbital Flight, High Energy Upper Stage.\nAccepted capability: Highly Elliptical Communications.\nFirst accepted programme: +15 prestige, +1 research data, +1 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p8_detail: "Develop stable clocks, orbital ephemerides, receiver standards and ground correction stations. A constellation, replacement capacity and receiver adoption are required for useful national coverage.\n\nDevelopment: $48bn / 54 months at standard qualification.\nMission: $7bn. Weekly operations: $0.06154bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Orbital Flight.\nAccepted capability: Orbital Navigation.\nFirst accepted programme: +35 prestige, +2 research data, +3 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p9_detail: "Integrate precision pointing, secure mission control, image recovery or relay and a continuing interpretation service. Coverage has revisit gaps and replacement costs.\n\nDevelopment: $49bn / 48 months at standard qualification.\nMission: $6bn. Weekly operations: $0.05962bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Polar Orbit, Earth Observation.\nAccepted capability: Orbital Reconnaissance.\nFirst accepted programme: +28 prestige, +2 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p10_detail: "Qualify large propulsion clusters, stage structures, assembly buildings, launch pads and full-scale flight tests. A heavy-lift family does not become reliable through funding alone.\n\nDevelopment: $116bn / 72 months at standard qualification.\nMission: $8.5bn. Weekly operations: $0.06538bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Launch Basic, High Energy Upper Stage.\nAccepted capability: Heavy Lift.\nFirst accepted programme: +42 prestige, +2 research data, +4 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nRestartable High-Energy Upper Stage\nAdvanced Propulsion Qualification Centre.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p11_detail: "Expand long-duration engine tests, fault isolation, manufacturing inspection and high-altitude simulation. A qualified centre supports future reusable and long-coast systems.\n\nDevelopment: $35bn / 48 months at standard qualification.\nMission: $0bn. Weekly operations: $0.03846bn.\nMission campaign: 0 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Launch Basic.\nAccepted capability: High Reliability Propulsion.\nFirst accepted programme: +15 prestige, +0 research data, +0 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p12_detail: "Test atmosphere management, water recovery, biological monitoring, maintenance and emergency reserves over progressively longer orbital missions.\n\nDevelopment: $37bn / 54 months at standard qualification.\nMission: $4.5bn. Weekly operations: $0.03077bn.\nMission campaign: 0.2 months. Crew: 3.\nEarliest development: 1970.\nRequires: Space Administration, Crewed Flight.\nAccepted capability: Long Duration Life Support, Regenerative Life Support.\nFirst accepted programme: +15 prestige, +1 research data, +1 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nIndependent Crewed Orbital Capsule.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p13_detail: "Qualify radar rendezvous, abort corridors, automatic docking and uncrewed navigation. Demonstration flights establish safe cargo and modular assembly procedures.\n\nDevelopment: $26bn / 42 months at standard qualification.\nMission: $3.6bn. Weekly operations: $0.01538bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Rendezvous Docking.\nAccepted capability: Autonomous Docking.\nFirst accepted programme: +15 prestige, +1 research data, +1 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nOrbital Rendezvous & Docking Trials.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p14_detail: "Develop a pressurised cargo vehicle, propellant transfer interfaces, rendezvous software and disposal procedures. Each delivery consumes a vehicle and launch allocation.\n\nDevelopment: $34bn / 48 months at standard qualification.\nMission: $4.8bn. Weekly operations: $0.04231bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Autonomous Docking.\nAccepted capability: Orbital Cargo.\nFirst accepted programme: +24 prestige, +1 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nAdvanced Autonomous Rendezvous & Docking.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p15_detail: "Develop a single-launch station, crew transport interfaces, onboard science and finite consumable reserves. Early stations have limited life and cannot support an indefinite crew without logistics.\n\nDevelopment: $53bn / 60 months at standard qualification.\nMission: $9bn. Weekly operations: $0.08077bn.\nMission campaign: 0.2 months. Crew: 3.\nEarliest development: 1970.\nRequires: Space Administration, Crewed Flight, Rendezvous Docking, Long Duration Life Support.\nAccepted capability: Orbital Station.\nFirst accepted programme: +48 prestige, +3 research data, +4 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nIndependent Crewed Orbital Capsule\nOrbital Rendezvous & Docking Trials\nRegenerative Life-Support Development.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p16_detail: "Develop a large orbital workshop with solar instruments, accommodation, electrical power and crew transport. Launch damage, thermal control and repair capability remain serious mission risks.\n\nDevelopment: $68bn / 60 months at standard qualification.\nMission: $12bn. Weekly operations: $0.09231bn.\nMission campaign: 0.2 months. Crew: 3.\nEarliest development: 1970.\nRequires: Space Administration, Heavy Lift, Crewed Flight, Rendezvous Docking, Long Duration Life Support.\nAccepted capability: Orbital Station, Orbital Science.\nFirst accepted programme: +52 prestige, +3 research data, +4 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nIndependent Crewed Orbital Capsule\nOrbital Rendezvous & Docking Trials\nRegenerative Life-Support Development\nHeavy-Lift Launch Vehicle Family.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p17_detail: "Develop a central module, standard docking ports, incremental science modules, cargo schedules, crew rotation and orbital maintenance. Sustained occupation requires continuing launches and operating finance.\n\nDevelopment: $172bn / 90 months at standard qualification.\nMission: $24bn. Weekly operations: $0.20192bn.\nMission campaign: 0.2 months. Crew: 3.\nEarliest development: 1973.\nRequires: Space Administration, Orbital Station, Autonomous Docking, Orbital Cargo, Regenerative Life Support.\nAccepted capability: Modular Orbital Station.\nFirst accepted programme: +88 prestige, +5 research data, +7 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nSalyut-Type Early Orbital Station OR Skylab-Type Orbital Workshop OR Almaz Crewed Reconnaissance Station OR Extended Apollo Applications Workshop Campaign\nAdvanced Autonomous Rendezvous & Docking\nUncrewed Orbital Cargo Ferry\nRegenerative Life-Support Development.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p18_detail: "Develop ascent systems, thermal protection, reusable engines, flight software, landing and a refurbishment infrastructure. Reuse reduces selected hardware replacement, while inspection and launch costs continue.\n\nDevelopment: $192bn / 78 months at standard qualification.\nMission: $12bn. Weekly operations: $0.16538bn.\nMission campaign: 0.2 months. Crew: 4.\nEarliest development: 1970.\nRequires: Space Administration, Crewed Flight, Heavy Lift, High Reliability Propulsion.\nAccepted capability: Reusable Flight.\nFirst accepted programme: +76 prestige, +4 research data, +6 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nIndependent Crewed Orbital Capsule\nOrbital Rendezvous & Docking Trials\nAdvanced Propulsion Qualification Centre.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p19_detail: "Develop restartable orbital propulsion, autonomous capture, thermal control and service interfaces. A tug moves a limited payload; it needs propellant, docking compatibility and replacement support.\n\nDevelopment: $75bn / 66 months at standard qualification.\nMission: $8bn. Weekly operations: $0.07115bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1975.\nRequires: Space Administration, High Energy Upper Stage, Rendezvous Docking, High Reliability Propulsion.\nAccepted capability: Orbital Transfer Tug.\nFirst accepted programme: +55 prestige, +3 research data, +5 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nRestartable High-Energy Upper Stage\nOrbital Rendezvous & Docking Trials.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p20_detail: "Test insulation, boil-off management, transfer couplings, fluid measurement and contamination control in orbit. Ground tanks alone do not qualify a zero-gravity propellant transfer system.\n\nDevelopment: $58bn / 66 months at standard qualification.\nMission: $8bn. Weekly operations: $0.05bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1975.\nRequires: Space Administration, High Energy Upper Stage, High Reliability Propulsion.\nAccepted capability: Cryogenic Storage.\nFirst accepted programme: +44 prestige, +2 research data, +4 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p21_detail: "Assemble a storage platform, delivery vehicles, transfer plumbing and rendezvous procedures. Replenishment flights and boil-off losses remain substantial operating costs.\n\nDevelopment: $136bn / 90 months at standard qualification.\nMission: $19bn. Weekly operations: $0.15bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1980.\nRequires: Space Administration, Cryogenic Storage, Autonomous Docking, Orbital Cargo.\nAccepted capability: Orbital Refuelling.\nFirst accepted programme: +78 prestige, +4 research data, +7 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nLong-Duration Cryogenic Propellant Storage\nAdvanced Autonomous Rendezvous & Docking\nUncrewed Orbital Cargo Ferry.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p22_detail: "Develop precision optics, detector calibration, low-vibration pointing, thermal control and a scientific operations centre. An optical fault may require a costly servicing mission.\n\nDevelopment: $98bn / 90 months at standard qualification.\nMission: $14bn. Weekly operations: $0.08846bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Orbital Science, High Reliability Propulsion.\nAccepted capability: Precision Orbital Astronomy.\nFirst accepted programme: +68 prestige, +4 research data, +6 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nOrbital Solar & High-Energy Observatory OR Ariel Scientific Satellite Campaign OR ISIS Ionospheric Satellite Campaign OR ANS Ultraviolet & X-Ray Astronomy Satellite.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p23_detail: "Qualify lunar-orbit insertion, mapping instruments, navigation and long-range links. Surface maps improve later mission planning without making this orbiter a universal prerequisite.\n\nDevelopment: $29bn / 42 months at standard qualification.\nMission: $5.5bn. Weekly operations: $0.01538bn.\nMission campaign: 0.3 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, High Energy Upper Stage, Deep Space Communications, Planetary Probes.\nAccepted capability: Lunar Mapping.\nFirst accepted programme: +33 prestige, +2 research data, +3 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p24_detail: "Develop descent propulsion, hazard tolerance, teleoperation, thermal survival and a mobile science package. Landing success and useful surface operation are separate mission objectives.\n\nDevelopment: $47bn / 54 months at standard qualification.\nMission: $8bn. Weekly operations: $0.01538bn.\nMission campaign: 0.3 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, High Energy Upper Stage, Deep Space Communications, Planetary Probes.\nAccepted capability: Robotic Lunar Surface.\nFirst accepted programme: +52 prestige, +3 research data, +4 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nLunar Mapping & Polar Survey Orbiter.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p25_detail: "Develop landing, drilling, surface ascent, Earth-return guidance and a recoverable sample capsule. Each stage may leave a scientifically useful partial success without returning material.\n\nDevelopment: $61bn / 60 months at standard qualification.\nMission: $10bn. Weekly operations: $0.01538bn.\nMission campaign: 0.5 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, High Energy Upper Stage, Deep Space Communications, Planetary Probes.\nAccepted capability: Robotic Sample Return.\nFirst accepted programme: +64 prestige, +4 research data, +5 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nLunar Mapping & Polar Survey Orbiter.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p26_detail: "Qualify a longer lunar-distance crew mission, navigation, radiation monitoring, abort planning and high-speed Earth return. It does not itself deliver a lunar lander.\n\nDevelopment: $94bn / 60 months at standard qualification.\nMission: $15bn. Weekly operations: $0.01538bn.\nMission campaign: 0.5 months. Crew: 3.\nEarliest development: 1970.\nRequires: Space Administration, Crewed Flight, High Energy Upper Stage, Deep Space Communications, Long Duration Life Support.\nAccepted capability: Crewed Cislunar Operations.\nFirst accepted programme: +58 prestige, +3 research data, +5 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nIndependent Crewed Orbital Capsule\nRestartable High-Energy Upper Stage\nRegenerative Life-Support Development.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p27_detail: "Develop and qualify a complete lunar expedition: transfer, lunar orbit, descent, ascent, docking and safe Earth recovery. Every expedition consumes substantial launch and flight hardware.\n\nDevelopment: $226bn / 78 months at standard qualification.\nMission: $28bn. Weekly operations: $0.06154bn.\nMission campaign: 0.5 months. Crew: 3.\nEarliest development: 1970.\nRequires: Space Administration, Heavy Lift, Crewed Flight, Rendezvous Docking, High Energy Upper Stage, Deep Space Communications.\nAccepted capability: Lunar Landing, Lunar Return.\nFirst accepted programme: +90 prestige, +5 research data, +8 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nLunar Mapping & Polar Survey Orbiter\nExtended Crewed Circumlunar Flight\nOrbital Rendezvous & Docking Trials\nHeavy-Lift Launch Vehicle Family.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p28_detail: "Develop a small crew-tended lunar-orbit laboratory, deep-space maintenance, supply flights and rescue contingencies. Permanent occupation requires a separate sustained logistics commitment.\n\nDevelopment: $186bn / 96 months at standard qualification.\nMission: $27bn. Weekly operations: $0.20769bn.\nMission campaign: 1 months. Crew: 3.\nEarliest development: 1980.\nRequires: Space Administration, Heavy Lift, Crewed Cislunar Operations, Orbital Station, Orbital Cargo, Regenerative Life Support.\nAccepted capability: Lunar Orbital Station.\nFirst accepted programme: +105 prestige, +6 research data, +9 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nExtended Crewed Circumlunar Flight\nSalyut-Type Early Orbital Station OR Skylab-Type Orbital Workshop OR Almaz Crewed Reconnaissance Station OR Extended Apollo Applications Workshop Campaign\nUncrewed Orbital Cargo Ferry\nRegenerative Life-Support Development.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p29_detail: "Develop landed habitat modules, power, radiation protection, surface logistics, spares and recurring crew transport. Initial crews visit seasonally; continuous occupation is a further major commitment.\n\nDevelopment: $368bn / 120 months at standard qualification.\nMission: $45bn. Weekly operations: $0.34615bn.\nMission campaign: 1 months. Crew: 4.\nEarliest development: 1980.\nRequires: Space Administration, Heavy Lift, Lunar Landing, Lunar Return, Orbital Cargo, Regenerative Life Support.\nAccepted capability: Lunar Outpost.\nFirst accepted programme: +150 prestige, +8 research data, +13 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nCrewed Lunar Landing Expedition OR N1-L3 Reliability Recovery & Lunar Continuation\nUncrewed Orbital Cargo Ferry\nRegenerative Life-Support Development.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p30_detail: "Develop a lunar-distance relay, halo-orbit navigation, large antennas and sustained station keeping to support far-side science. The mission does not operate at Sun-Earth L2.\n\nDevelopment: $72bn / 72 months at standard qualification.\nMission: $11bn. Weekly operations: $0.07115bn.\nMission campaign: 2 months. Crew: 0.\nEarliest development: 1985.\nRequires: Space Administration, High Energy Upper Stage, Deep Space Communications, High Reliability Propulsion.\nAccepted capability: Lunar Farside Relay.\nFirst accepted programme: +56 prestige, +3 research data, +5 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p31_detail: "Develop solar-wind instruments, halo-orbit injection, long-range tracking and station keeping. The Sun-Earth L1 region is roughly 1.5 million km sunward from Earth.\n\nDevelopment: $36bn / 48 months at standard qualification.\nMission: $6.5bn. Weekly operations: $0.03269bn.\nMission campaign: 3.5 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, High Energy Upper Stage, Deep Space Communications, Planetary Probes.\nAccepted capability: Solar Wind Monitoring.\nFirst accepted programme: +45 prestige, +3 research data, +4 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p32_detail: "Develop cryogenic detectors, passive thermal geometry, precision pointing and distant autonomous servicing procedures. The Sun-Earth L2 region lies beyond Earth, away from the Sun.\n\nDevelopment: $136bn / 102 months at standard qualification.\nMission: $19bn. Weekly operations: $0.10577bn.\nMission campaign: 4 months. Crew: 0.\nEarliest development: 1985.\nRequires: Space Administration, Precision Orbital Astronomy, Cryogenic Storage, Deep Space Communications, High Energy Upper Stage.\nAccepted capability: Deep Space Infrared Astronomy.\nFirst accepted programme: +96 prestige, +5 research data, +8 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nLarge Earth-Orbiting Space Telescope\nLong-Duration Cryogenic Propellant Storage.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p33_detail: "Develop a protected entry vehicle, pressure vessel, descent instruments and rapid data transmission. Atmospheric science may succeed even when surface contact is brief or absent.\n\nDevelopment: $44bn / 54 months at standard qualification.\nMission: $8bn. Weekly operations: $0.01538bn.\nMission campaign: 5 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, High Energy Upper Stage, Deep Space Communications, Planetary Probes.\nAccepted capability: Venus Entry.\nFirst accepted programme: +54 prestige, +3 research data, +5 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nInterplanetary Probe Bus Qualification.\nEstablished pre-1970 equivalent flight qualifications also count.\nTransfer opportunities: every 19 months."
 cw_sr_p34_detail: "Develop orbital insertion, radar mapping, thermal control and long-lived communications. An orbiter is a different technical branch from a short-lived surface probe.\n\nDevelopment: $63bn / 60 months at standard qualification.\nMission: $11bn. Weekly operations: $0.04038bn.\nMission campaign: 7 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, High Energy Upper Stage, Deep Space Communications, Planetary Probes.\nAccepted capability: Venus Orbital Science.\nFirst accepted programme: +62 prestige, +3 research data, +5 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nInterplanetary Probe Bus Qualification.\nEstablished pre-1970 equivalent flight qualifications also count.\nTransfer opportunities: every 19 months."
 cw_sr_p35_detail: "Develop Mars-orbit insertion, imaging, navigation and a sustained science operation. Launch-window delays and dust conditions can alter the mission without destroying all scientific value.\n\nDevelopment: $53bn / 54 months at standard qualification.\nMission: $9.5bn. Weekly operations: $0.03846bn.\nMission campaign: 9 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, High Energy Upper Stage, Deep Space Communications, Planetary Probes.\nAccepted capability: Mars Orbital Science.\nFirst accepted programme: +64 prestige, +4 research data, +5 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nInterplanetary Probe Bus Qualification.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field.\nTransfer opportunities: every 26 months."
 cw_sr_p36_detail: "Develop entry, descent, landing, sterilisation, power and surface science. Landing, short surface contact and a complete operating season are different outcomes.\n\nDevelopment: $102bn / 72 months at standard qualification.\nMission: $17bn. Weekly operations: $0.04615bn.\nMission campaign: 10 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, High Energy Upper Stage, Deep Space Communications, Planetary Probes.\nAccepted capability: Mars Surface Science.\nFirst accepted programme: +90 prestige, +5 research data, +8 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nMars Orbital Reconnaissance Mission\nInterplanetary Probe Bus Qualification.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field.\nTransfer opportunities: every 26 months."
 cw_sr_p37_detail: "Develop long-life power, radiation protection, weak-signal communications and outer-planet navigation. Useful science arrives after a multi-year cruise.\n\nDevelopment: $48bn / 54 months at standard qualification.\nMission: $9bn. Weekly operations: $0.03269bn.\nMission campaign: 22 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, High Energy Upper Stage, Deep Space Communications, Planetary Probes.\nAccepted capability: Outer Planet Navigation.\nFirst accepted programme: +70 prestige, +4 research data, +6 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nInterplanetary Probe Bus Qualification.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p38_detail: "Develop a long-lived probe, precision encounters, autonomous fault management and a series of gravity assists. Initial arrival resolves the first giant-planet encounter; later milestones require additional cruise years.\n\nDevelopment: $112bn / 72 months at standard qualification.\nMission: $19bn. Weekly operations: $0.05bn.\nMission campaign: 30 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, High Energy Upper Stage, Deep Space Communications, Planetary Probes.\nAccepted capability: Outer Planet Gravity Assists.\nFirst accepted programme: +110 prestige, +6 research data, +9 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nJupiter Pioneer Flyby.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p39_detail: "Develop a heat-tolerant probe, Venus gravity assist, precision navigation and short high-value Mercury encounters. This is a flyby mission rather than a Mercury orbiter.\n\nDevelopment: $55bn / 54 months at standard qualification.\nMission: $9bn. Weekly operations: $0.02692bn.\nMission campaign: 5 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, High Energy Upper Stage, Deep Space Communications, Planetary Probes.\nAccepted capability: Inner Planet Gravity Assists.\nFirst accepted programme: +66 prestige, +4 research data, +6 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nInterplanetary Probe Bus Qualification.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p40_detail: "Develop a nuclear propulsion stage, reactor controls, shielding, ground safety infrastructure and an uncrewed in-space test. Successful ground firing is substantial evidence but does not qualify a complete flight vehicle.\n\nDevelopment: $154bn / 90 months at standard qualification.\nMission: $23bn. Weekly operations: $0.1bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Heavy Lift, High Reliability Propulsion, Deep Space Communications.\nAccepted capability: Nuclear Thermal Flight.\nFirst accepted programme: +100 prestige, +6 research data, +8 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p41_detail: "Develop a crewed military reconnaissance station, optical instruments, secure downlinks, film-return procedures and its crew transport. Crewed intelligence has political visibility, finite endurance and high recurring cost.\n\nDevelopment: $86bn / 72 months at standard qualification.\nMission: $14bn. Weekly operations: $0.11731bn.\nMission campaign: 0.2 months. Crew: 2.\nEarliest development: 1970.\nRequires: Space Administration, Crewed Flight, Rendezvous Docking, Long Duration Life Support.\nAccepted capability: Orbital Station, Orbital Reconnaissance.\nFirst accepted programme: +58 prestige, +3 research data, +5 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nIndependent Crewed Orbital Capsule\nOrbital Rendezvous & Docking Trials\nRegenerative Life-Support Development.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p42_detail: "Develop a compatible docking adapter, atmosphere-transfer procedures, joint tracking, crew training and rescue doctrine. A bilateral flight needs negotiated partners; national hardware alone cannot create a diplomatic agreement.\n\nDevelopment: $38bn / 42 months at standard qualification.\nMission: $8bn. Weekly operations: $0.02885bn.\nMission campaign: 0.2 months. Crew: 5.\nEarliest development: 1970.\nRequires: Space Administration, Crewed Flight, Rendezvous Docking.\nAccepted capability: International Docking Standard, Joint Orbital Rescue.\nFirst accepted programme: +54 prestige, +3 research data, +5 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nIndependent Crewed Orbital Capsule\nOrbital Rendezvous & Docking Trials.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p43_detail: "Rebuild an unsuccessful super-heavy launch programme through engine testing, cluster control, independent quality assurance and new full-scale flights. Continue lander and lunar-return qualification only after credible launch evidence.\n\nDevelopment: $244bn / 90 months at standard qualification.\nMission: $31bn. Weekly operations: $0.11154bn.\nMission campaign: 0.5 months. Crew: 2.\nEarliest development: 1970.\nRequires: Space Administration, Launch Basic, Crewed Flight, Rendezvous Docking, High Energy Upper Stage, Deep Space Communications.\nAccepted capability: Heavy Lift, Lunar Landing, Lunar Return.\nFirst accepted programme: +105 prestige, +6 research data, +9 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nLunar Mapping & Polar Survey Orbiter\nExtended Crewed Circumlunar Flight\nOrbital Rendezvous & Docking Trials\nAdvanced Propulsion Qualification Centre.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p44_detail: "Develop a super-heavy launch system, large winged orbiter, autonomous re-entry and a national processing infrastructure. A successful uncrewed demonstration does not certify regular crew transport or an economic reusable service.\n\nDevelopment: $218bn / 72 months at standard qualification.\nMission: $18bn. Weekly operations: $0.19423bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1976.\nRequires: Space Administration, Launch Basic, Crewed Flight, High Reliability Propulsion.\nAccepted capability: Heavy Lift, Reusable Flight, Automated Orbital Landing.\nFirst accepted programme: +86 prestige, +5 research data, +7 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nIndependent Crewed Orbital Capsule\nAdvanced Autonomous Rendezvous & Docking\nAdvanced Propulsion Qualification Centre.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p45_detail: "Develop a Venus entry package, atmospheric balloon, multi-national instruments and a continuing comet flyby trajectory. Balloon deployment and the later encounter are distinct objectives of one demanding flight architecture.\n\nDevelopment: $89bn / 78 months at standard qualification.\nMission: $15bn. Weekly operations: $0.04038bn.\nMission campaign: 15 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, High Energy Upper Stage, Deep Space Communications, Planetary Probes.\nAccepted capability: Venus Entry, Planetary Balloon Science, Comet Encounter Science.\nFirst accepted programme: +88 prestige, +5 research data, +7 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nVenus Atmospheric Entry & Surface Probe\nInterplanetary Probe Bus Qualification.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field.\nFixed launch opportunity: December 1984."
 cw_sr_p46_detail: "Retain heavy-launch production and develop successive orbital workshops, crew rotations, solar astronomy and Earth-observation campaigns. Workshop replacement and expedition hardware remain recurring costs.\n\nDevelopment: $124bn / 72 months at standard qualification.\nMission: $20bn. Weekly operations: $0.14038bn.\nMission campaign: 0.2 months. Crew: 3.\nEarliest development: 1970.\nRequires: Space Administration, Heavy Lift, Crewed Flight, Rendezvous Docking, Long Duration Life Support.\nAccepted capability: Orbital Station, Orbital Science, Extended Workshop Campaign.\nFirst accepted programme: +74 prestige, +4 research data, +6 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nIndependent Crewed Orbital Capsule\nOrbital Rendezvous & Docking Trials\nRegenerative Life-Support Development\nHeavy-Lift Launch Vehicle Family.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p47_detail: "Establish a civilian coordinating commission, national scientific priorities, procurement rules and a small programme office. Any player-controlled country may begin without inherited space hardware.\n\nDevelopment: $0.25bn / 18 months at standard qualification.\nMission: $0bn. Weekly operations: $0.00048bn.\nMission campaign: 0 months. Crew: 0.\nEarliest development: 1970.\nRequires: None.\nAccepted capability: Space Administration.\nFirst accepted programme: +3 prestige, +0 research data, +0 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p48_detail: "Develop suborbital scientific rockets, range safety, telemetry and payload-recovery procedures. Sounding flights build teams and evidence without establishing orbital launch capability.\n\nDevelopment: $1.1bn / 36 months at standard qualification.\nMission: $0bn. Weekly operations: $0.00154bn.\nMission campaign: 0 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration.\nAccepted capability: Sounding Rockets.\nFirst accepted programme: +8 prestige, +0 research data, +0 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p49_detail: "Develop a modest spacecraft bus, power supply, scientific instrument package, environmental testing and ground acceptance. A qualified payload still needs a purchased or national launch.\n\nDevelopment: $0.85bn / 36 months at standard qualification.\nMission: $0bn. Weekly operations: $0.00115bn.\nMission campaign: 0 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration.\nAccepted capability: Satellite Engineering, Scientific Instruments.\nFirst accepted programme: +8 prestige, +0 research data, +0 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p50_detail: "Contract a launch provider, qualify interfaces and launch a small national spacecraft. This establishes foreign-provider orbital access and mission operations without creating a domestic rocket industry.\n\nDevelopment: $0.35bn / 18 months at standard qualification.\nMission: $0.12bn. Weekly operations: $0.00106bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Satellite Engineering, Ground Tracking.\nAccepted capability: Contracted Orbital Access, Orbital Flight.\nFirst accepted programme: +15 prestige, +1 research data, +1 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p51_detail: "Qualify multi-stage propulsion, guidance, payload separation, range safety and full orbital flight. A national launcher is a long, expensive strategic choice alongside purchased launch access.\n\nDevelopment: $6.5bn / 72 months at standard qualification.\nMission: $0.6bn. Weekly operations: $0.00481bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Sounding Rockets, Satellite Engineering, Ground Tracking.\nAccepted capability: Launch Basic, Orbital Flight.\nFirst accepted programme: +27 prestige, +2 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p52_detail: "Develop a modest tracking antenna, communications links, orbital data processing and trained mission controllers. This supports national satellites and international scientific cooperation.\n\nDevelopment: $0.65bn / 24 months at standard qualification.\nMission: $0bn. Weekly operations: $0.00096bn.\nMission campaign: 0 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration.\nAccepted capability: Ground Tracking.\nFirst accepted programme: +6 prestige, +0 research data, +0 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p53_detail: "Develop a crew cabin, short-duration life support, escape system, heat shield, recovery operations and progressively qualified uncrewed then crewed missions. A satellite programme does not provide a crew vehicle automatically.\n\nDevelopment: $76bn / 84 months at standard qualification.\nMission: $11bn. Weekly operations: $0.05962bn.\nMission campaign: 0.2 months. Crew: 2.\nEarliest development: 1970.\nRequires: Space Administration, Launch Basic, Orbital Flight, Satellite Engineering, Ground Tracking.\nAccepted capability: Crewed Flight.\nFirst accepted programme: +58 prestige, +3 research data, +5 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nRecoverable Scientific Satellite Programme.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p54_detail: "Qualify an autonomous deep-space bus, thermal control, long-range communications, attitude control and cruise fault recovery on a high-energy demonstration flight.\n\nDevelopment: $19bn / 54 months at standard qualification.\nMission: $3bn. Weekly operations: $0.01346bn.\nMission campaign: 2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Satellite Engineering, Orbital Flight, High Energy Upper Stage, Deep Space Communications.\nAccepted capability: Planetary Probes.\nFirst accepted programme: +29 prestige, +2 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p55_detail: "Qualify the Diamant B reference architecture and a new equatorial launch site, including stage integration, range control and payload interfaces.\n\nDevelopment: $7.5bn / 48 months at standard qualification.\nMission: $0.85bn. Weekly operations: $0.00865bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Sounding Rockets, Satellite Engineering, Ground Tracking.\nAccepted capability: Launch Basic, Orbital Flight, Equatorial Launch Operations.\nFirst accepted programme: +29 prestige, +2 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p56_detail: "Qualify a compact national orbital launcher and experimental satellite, using test flights and Woomera launch cooperation. A successful launch demonstrates a limited domestic launch capability.\n\nDevelopment: $6.8bn / 48 months at standard qualification.\nMission: $0.75bn. Weekly operations: $0.00673bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Sounding Rockets, Satellite Engineering, Ground Tracking.\nAccepted capability: Launch Basic, Orbital Flight.\nFirst accepted programme: +31 prestige, +2 research data, +3 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p57_detail: "Develop a British scientific satellite, instrument calibration and university operations while contracting foreign launch services. A national payload can fly before a domestic rocket is ready.\n\nDevelopment: $4.2bn / 36 months at standard qualification.\nMission: $0.65bn. Weekly operations: $0.00538bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Satellite Engineering, Contracted Orbital Access, Ground Tracking.\nAccepted capability: Orbital Science.\nFirst accepted programme: +23 prestige, +1 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p58_detail: "Complete an unguided solid-stage orbital demonstration through stage sequencing, spin stabilisation, separation tests and range operations.\n\nDevelopment: $5.5bn / 42 months at standard qualification.\nMission: $0.55bn. Weekly operations: $0.00481bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Sounding Rockets, Satellite Engineering, Ground Tracking.\nAccepted capability: Launch Basic, Orbital Flight.\nFirst accepted programme: +31 prestige, +2 research data, +3 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p59_detail: "Develop a more capable solid-propellant scientific launcher, flight control and a succession of national science satellites. Each new instrument or launch remains a further commitment.\n\nDevelopment: $16bn / 60 months at standard qualification.\nMission: $1.6bn. Weekly operations: $0.01538bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Sounding Rockets, Satellite Engineering, Ground Tracking.\nAccepted capability: Launch Basic, Orbital Flight, Orbital Science.\nFirst accepted programme: +37 prestige, +2 research data, +3 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p60_detail: "Complete the first national orbital launcher and satellite through integrated testing, launch-range qualification, tracking and payload acceptance.\n\nDevelopment: $8.8bn / 48 months at standard qualification.\nMission: $0.95bn. Weekly operations: $0.00865bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Sounding Rockets, Satellite Engineering, Ground Tracking.\nAccepted capability: Launch Basic, Orbital Flight.\nFirst accepted programme: +34 prestige, +2 research data, +3 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p61_detail: "Develop a recoverable experiment capsule, thermal protection, de-orbit control and national recovery teams. Payload survival and successful recovery are separate from orbital insertion.\n\nDevelopment: $20bn / 60 months at standard qualification.\nMission: $2.6bn. Weekly operations: $0.01538bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Launch Basic, Orbital Flight, Satellite Engineering.\nAccepted capability: Recoverable Satellite.\nFirst accepted programme: +38 prestige, +2 research data, +3 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p62_detail: "Develop a modest scientific satellite, Indian instrument and operations teams, and interfaces for a foreign launch provider. The mission establishes science and operations rather than a domestic rocket.\n\nDevelopment: $3.8bn / 48 months at standard qualification.\nMission: $0.65bn. Weekly operations: $0.00481bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1971.\nRequires: Space Administration, Satellite Engineering, Contracted Orbital Access, Ground Tracking.\nAccepted capability: Orbital Flight, Orbital Science.\nFirst accepted programme: +27 prestige, +2 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p63_detail: "Develop a four-stage small launcher, guidance, integration facilities and an experimental satellite. National orbital launch remains a separate long-term project from foreign satellite access.\n\nDevelopment: $9.5bn / 84 months at standard qualification.\nMission: $0.9bn. Weekly operations: $0.00962bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Sounding Rockets, Satellite Engineering, Ground Tracking.\nAccepted capability: Launch Basic, Orbital Flight.\nFirst accepted programme: +35 prestige, +2 research data, +3 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p64_detail: "Develop a follow-on ionospheric research satellite, antennas, calibration and Canadian ground operations. Launch is purchased from an established provider.\n\nDevelopment: $5.5bn / 42 months at standard qualification.\nMission: $0.9bn. Weekly operations: $0.00673bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Satellite Engineering, Contracted Orbital Access, Ground Tracking.\nAccepted capability: Orbital Science.\nFirst accepted programme: +27 prestige, +2 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p65_detail: "Develop a domestic communications service through procured spacecraft, provider-qualified transfer stages, northern ground terminals and broadcast operations.\n\nDevelopment: $9.5bn / 48 months at standard qualification.\nMission: $1.8bn. Weekly operations: $0.0125bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Satellite Engineering, Contracted Orbital Access, Ground Tracking.\nAccepted capability: Domestic Satellite Communications, Geostationary Operations.\nFirst accepted programme: +34 prestige, +2 research data, +3 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p66_detail: "Develop equatorial science missions, ocean-platform operations and Scout integration with a partner. Offshore launch geography offers a national service role without supplying a domestic rocket.\n\nDevelopment: $7.2bn / 48 months at standard qualification.\nMission: $1.1bn. Weekly operations: $0.01154bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Satellite Engineering, Contracted Orbital Access, Ground Tracking.\nAccepted capability: Orbital Science, Offshore Launch Operations.\nFirst accepted programme: +29 prestige, +2 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p67_detail: "Develop an experimental communications payload, propagation measurements, receiving terminals and international launch integration.\n\nDevelopment: $8.5bn / 54 months at standard qualification.\nMission: $1.6bn. Weekly operations: $0.01058bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1971.\nRequires: Space Administration, Satellite Engineering, Contracted Orbital Access, Ground Tracking.\nAccepted capability: Experimental Satellite Communications, Geostationary Operations.\nFirst accepted programme: +32 prestige, +2 research data, +3 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p68_detail: "Develop a follow-on radiation-belt science payload, experiment calibration and ground analysis using a contracted polar launch.\n\nDevelopment: $6.8bn / 42 months at standard qualification.\nMission: $1.1bn. Weekly operations: $0.00769bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Satellite Engineering, Contracted Orbital Access, Ground Tracking.\nAccepted capability: Orbital Science, Radiation Environment Science.\nFirst accepted programme: +28 prestige, +2 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p69_detail: "Develop a cooperative European communications spacecraft, stable three-axis pointing, international terminals and partner launch procurement.\n\nDevelopment: $14bn / 60 months at standard qualification.\nMission: $2.5bn. Weekly operations: $0.01731bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Satellite Engineering, Contracted Orbital Access, Ground Tracking.\nAccepted capability: Experimental Satellite Communications, Geostationary Operations.\nFirst accepted programme: +39 prestige, +2 research data, +3 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p70_detail: "Develop a compact astronomical satellite, ultraviolet and X-ray instruments, precise pointing and ground analysis with an international launch provider.\n\nDevelopment: $4.8bn / 48 months at standard qualification.\nMission: $0.85bn. Weekly operations: $0.00577bn.\nMission campaign: 0.2 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Satellite Engineering, Contracted Orbital Access, Ground Tracking.\nAccepted capability: Orbital Science, Astronomical Instruments.\nFirst accepted programme: +29 prestige, +2 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p71_detail: "Expand polar sounding flights, auroral instruments, tracking and international scientific range services. The campaign remains suborbital.\n\nDevelopment: $2.5bn / 36 months at standard qualification.\nMission: $0bn. Weekly operations: $0.00346bn.\nMission campaign: 0 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Sounding Rockets, Scientific Instruments, Ground Tracking.\nAccepted capability: Sounding Rockets, Polar Science, Range Services.\nFirst accepted programme: +19 prestige, +0 research data, +0 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p72_detail: "Expand range scheduling, safe launch corridors, telemetry, recovery support and services for international partner vehicles.\n\nDevelopment: $3.4bn / 42 months at standard qualification.\nMission: $0bn. Weekly operations: $0.00481bn.\nMission campaign: 0 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Sounding Rockets, Ground Tracking.\nAccepted capability: Range Services, Ground Tracking.\nFirst accepted programme: +20 prestige, +0 research data, +0 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p73_detail: "Develop a national sounding-rocket series, scientific payload integration, range safety and upper-atmosphere research campaigns.\n\nDevelopment: $2.8bn / 42 months at standard qualification.\nMission: $0bn. Weekly operations: $0.00385bn.\nMission campaign: 0 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Sounding Rockets, Scientific Instruments, Ground Tracking.\nAccepted capability: Sounding Rockets, Upper Atmosphere Science.\nFirst accepted programme: +20 prestige, +0 research data, +0 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p74_detail: "Develop sounding-rocket flights, payload recovery, atmospheric instruments and range services within a limited national research budget.\n\nDevelopment: $2.6bn / 42 months at standard qualification.\nMission: $0bn. Weekly operations: $0.00346bn.\nMission campaign: 0 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Sounding Rockets, Scientific Instruments, Ground Tracking.\nAccepted capability: Sounding Rockets, Upper Atmosphere Science.\nFirst accepted programme: +20 prestige, +0 research data, +0 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p75_detail: "Negotiate a scientific payload agreement, qualify photometers and plasma instruments, integrate them with a partner spacecraft and operate national receiving and analysis teams. The launch vehicle and satellite bus are supplied by the partner.\n\nDevelopment: $1.5bn / 30 months at standard qualification.\nMission: $0.18bn. Weekly operations: $0.00231bn.\nMission campaign: 0.5 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Scientific Instruments, Ground Tracking.\nAccepted capability: Interkosmos Cooperation, Solar Physics Instruments, Orbital Payload Experience.\nFirst accepted programme: +18 prestige, +1 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p76_detail: "Develop atmospheric instruments, calibration, telemetry and joint analysis for partner-operated high-altitude rocket campaigns. Acceptance covers the payload campaign and its ground systems; it does not qualify a domestic rocket.\n\nDevelopment: $0.95bn / 30 months at standard qualification.\nMission: $0bn. Weekly operations: $0.00154bn.\nMission campaign: 0 months. Crew: 0.\nEarliest development: 1970.\nRequires: Space Administration, Interkosmos Cooperation, Scientific Instruments, Ground Tracking.\nAccepted capability: Upper Atmosphere Science, Suborbital Payload Experience.\nFirst accepted programme: +14 prestige, +0 research data, +0 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p77_detail: "Develop a precision multispectral camera, film handling, calibration, interpretation laboratories and integration with a Soviet spacecraft. Partner launch procurement and an accepted payload agreement remain part of the funded mission.\n\nDevelopment: $3.8bn / 48 months at standard qualification.\nMission: $0.55bn. Weekly operations: $0.00385bn.\nMission campaign: 0.5 months. Crew: 0.\nEarliest development: 1971.\nRequires: Space Administration, Interkosmos Cooperation, Scientific Instruments, Ground Tracking.\nAccepted capability: Multispectral Imaging, Earth Observation.\nFirst accepted programme: +27 prestige, +2 research data, +2 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p78_detail: "Secure a partner flight agreement, select and medically qualify a research cosmonaut, train with the Soviet crew and prepare a national experiment package. Transport, rescue and station access are supplied through the partner agreement.\n\nDevelopment: $2.8bn / 24 months at standard qualification.\nMission: $0.75bn. Weekly operations: $0.00231bn.\nMission campaign: 0.3 months. Crew: 2.\nEarliest development: 1976.\nRequires: Space Administration, Interkosmos Cooperation, Scientific Instruments, Ground Tracking.\nAccepted capability: Guest Cosmonaut Mission, Orbital Science.\nFirst accepted programme: +38 prestige, +2 research data, +3 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nInterkosmos Solar Physics Instrument Campaign.\nEstablished pre-1970 equivalent flight qualifications also count."
 cw_sr_p79_detail: "Negotiate network participation and capacity access, build an Earth terminal and qualify antenna pointing, links, staffing and national communications interfaces. The shared space segment remains a partner-operated service.\n\nDevelopment: $2.2bn / 36 months at standard qualification.\nMission: $0bn. Weekly operations: $0.00346bn.\nMission campaign: 0 months. Crew: 0.\nEarliest development: 1971.\nRequires: Space Administration, Interkosmos Cooperation, Ground Tracking.\nAccepted capability: Satellite Communications Terminal.\nFirst accepted programme: +16 prestige, +0 research data, +0 political power.\nRepeated successes award limited prestige; programme and research awards are granted once."
 cw_sr_p80_detail: "Develop a landed rover, terrain navigation, autonomous fault protection, surface power and a remotely supervised traverse. Communications delay requires onboard decisions; a successful landing alone does not complete a mobile science campaign.\n\nDevelopment: $84bn / 72 months at standard qualification.\nMission: $14bn. Weekly operations: $0.04808bn.\nMission campaign: 10 months. Crew: 0.\nEarliest development: 1976.\nRequires: Space Administration, Mars Surface Science, Mars Orbital Science, Planetary Probes, Deep Space Communications.\nAccepted capability: Mars Mobile Science.\nFirst accepted programme: +102 prestige, +6 research data, +9 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nMars Orbital Reconnaissance Mission\nMars Surface Science Lander.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field.\nTransfer opportunities: every 26 months."
 cw_sr_p81_detail: "Develop sterile sampling, a Mars ascent vehicle, orbital or direct return interfaces, an Earth-entry capsule and a secure sample-receiving facility. The mission lasts through sample recovery on Earth; surface collection alone earns no returned-sample capability.\n\nDevelopment: $210bn / 96 months at standard qualification.\nMission: $38bn. Weekly operations: $0.06923bn.\nMission campaign: 34 months. Crew: 0.\nEarliest development: 1974.\nRequires: Space Administration, Mars Surface Science, Mars Orbital Science, High Energy Upper Stage, Deep Space Communications, Planetary Probes.\nAccepted capability: Mars Sample Return, Robotic Mars Ascent Return.\nFirst accepted programme: +154 prestige, +8 research data, +13 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nMars Orbital Reconnaissance Mission\nMars Surface Science Lander\nRobotic Lunar Sample Return.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field.\nTransfer opportunities: every 26 months."
 cw_sr_p82_detail: "Qualify expedition living volume, regenerative support, maintenance reserves, medical monitoring and storm-shelter procedures. A twenty-four-month orbital endurance campaign follows development; it tests habitation without claiming that Earth orbit reproduces the interplanetary radiation environment.\n\nDevelopment: $138bn / 84 months at standard qualification.\nMission: $18bn. Weekly operations: $0.08077bn.\nMission campaign: 24 months. Crew: 6.\nEarliest development: 1972.\nRequires: Space Administration, Orbital Station, Regenerative Life Support, Crewed Flight, Rendezvous Docking.\nAccepted capability: Interplanetary Habitat Qualified.\nFirst accepted programme: +81 prestige, +5 research data, +7 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nModular Long-Duration Orbital Complex\nRegenerative Life-Support Development\nExtended Crewed Circumlunar Flight.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field."
 cw_sr_p83_detail: "Qualify large aeroshell structures, guidance through a thin atmosphere, terminal propulsion, landing stability and cargo deployment. Deliver an uncrewed representative load before committing a crew. Small science-lander experience is insufficient for expedition-scale payloads.\n\nDevelopment: $176bn / 84 months at standard qualification.\nMission: $32bn. Weekly operations: $0.05769bn.\nMission campaign: 11 months. Crew: 0.\nEarliest development: 1976.\nRequires: Space Administration, Mars Surface Science, Mars Orbital Science, Heavy Lift, High Energy Upper Stage, Deep Space Communications.\nAccepted capability: Mars Heavy Landing Qualified.\nFirst accepted programme: +116 prestige, +6 research data, +10 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nMars Surface Science Lander\nHeavy-Lift Launch Vehicle Family\nAdvanced Propulsion Qualification Centre.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field.\nTransfer opportunities: every 26 months."
 cw_sr_p84_detail: "Develop and qualify the complete expedition: orbital assembly, transfer propulsion, shielding, redundant support, surface habitat, ascent vehicle and Earth return. Include uncrewed ascent and return-hardware qualification before crew departure. The funded mission covers multiple launches, outbound flight, a surface expedition and the journey home. Full success is awarded only after crew recovery on Earth.\n\nDevelopment: $420bn / 72 months at standard qualification.\nMission: $110bn. Weekly operations: $0.16346bn.\nMission campaign: 34 months. Crew: 6.\nEarliest development: 1982.\nRequires: Space Administration, Mars Heavy Landing Qualified, Interplanetary Habitat Qualified, Mars Orbital Science, Mars Surface Science, Heavy Lift, High Energy Upper Stage, High Reliability Propulsion, Regenerative Life Support, Rendezvous Docking, Crewed Flight, Deep Space Communications.\nAccepted capability: Crewed Mars Landing, Crewed Mars Return.\nFirst accepted programme: +320 prestige, +8 research data, +16 political power.\nRepeated successes award limited prestige; programme and research awards are granted once.\n\nSuccessful precursor missions required before departure:\nMars Heavy Cargo Landing Demonstration\nExpedition Habitat & Closed-Cycle Endurance Trials\nMars Automated Ascent & Sample Return\nCrewed Lunar Landing Expedition OR N1-L3 Reliability Recovery & Lunar Continuation.\nEstablished pre-1970 equivalent flight qualifications also count.\nFirst accepted programme: 10% research bonus for 1 technology in any field.\nTransfer opportunities: every 26 months."
