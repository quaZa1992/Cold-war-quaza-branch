 cw_sr_ledger_name: "SPACE RACE"
 cw_sr_ledger_tt: "Space Race"
 cw_sr_ledger_delayed: "Open the Space Race command room. Review national programmes, launch readiness, weekly appropriations and the leading space powers."
 cw_sr_selected_detail: "[CW_SR_Selected_detail]"
 cw_sr_policy_explanation: "Standard: planned engineering cost and calendar.\nAssurance: +18% cost and calendar; up to +2.5 pp departure and +4 pp objective chance.\nAccelerated: +25% cost, -15% calendar; up to -4.5 pp departure and -3.5 pp objective chance.\nReduced: -20% cost, +35% calendar; up to -2.5 pp departure and -2 pp objective chance.\nSelect a policy for future paid engineering work."
 cw_sr_budget_tt: "Weekly development ceiling, shared between active programmes and investigations. Operating charges are additional and paid first.\nLast weekly engineering spending: $[?cw_sr_week_spent|3]bn.\nTotal programme spending: $[?cw_sr_spent|2]bn.\nUnpaid operating charges remain payable and block new launches.\n[CW_SR_Leader_Benefit]"
 cw_sr_risk_tt: "Estimates include funded qualification, maintained supporting programmes, relevant flight experience, interrupted funding, completed investigations, research analysis and space leadership.\nFull success requires departure and accepted mission objectives. Probabilities are frozen at departure.\nResearch data: +0.02 pp objective chance per point, capped at +2 pp.\nInvestigations require 3, 6 or 12 funded months, with weekly corrective-engineering charges.\nCrew losses remain possible."
