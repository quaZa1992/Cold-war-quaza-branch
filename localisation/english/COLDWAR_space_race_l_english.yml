 cw_sr_system_3: "Solar System"
 cw_sr_region_1: "Launch sites & labs\n19 programmes"
 cw_sr_region_tip_1: "Launch ranges, tracking antennas, qualification laboratories and mission control. Ground assets are commissioned after development; they do not launch into orbit."
 cw_sr_region_name_1: "Ground Infrastructure"
 cw_sr_region_2: "Low Earth orbit\n28 programmes"
 cw_sr_region_tip_2: "Crewed flight, orbital stations, astronomy and technology demonstrations. The close orbital environment still requires launch, power, communications and disposal planning."
 cw_sr_region_name_2: "Low Earth Orbit"
 cw_sr_region_3: "Polar orbit\n3 programmes"
 cw_sr_region_tip_3: "Global imaging, reconnaissance and environmental monitoring. Inclination and local launch geography affect launch performance; this is a parallel mission architecture."
 cw_sr_region_name_3: "Polar & Sun-Synchronous Orbit"
 cw_sr_region_4: "High Earth orbit\n1 programme"
 cw_sr_region_tip_4: "Molniya-type long dwell over high latitudes. Radiation exposure, repeated handovers and constellation replacement are continuing costs."
 cw_sr_region_name_4: "Highly Elliptical Earth Orbit"
 cw_sr_region_5: "Medium Earth orbit\n1 programme"
 cw_sr_region_tip_5: "Navigation and timing architectures between low orbit and the geostationary belt. A useful navigation service needs multiple spacecraft and a supported ground segment."
 cw_sr_region_name_5: "Medium Earth Orbit"
 cw_sr_region_6: "Geostationary orbit\n4 programmes"
 cw_sr_region_tip_6: "Communications and fixed Earth coverage. Transfer-orbit injection, circularisation and station keeping consume performance and propellant."
 cw_sr_region_name_6: "Geostationary & Transfer Orbit"
 cw_sr_region_7: "TRANSFER\n6 programmes"
 cw_sr_region_tip_7: "Translunar injection, high apogee tests and lunar-return trajectories. Transit flight, navigation and recovery are separate from a lunar landing."
 cw_sr_region_name_7: "Cislunar Transfer & High Earth Orbit"
 cw_sr_region_8: "MOON\n7 programmes"
 cw_sr_region_tip_8: "Orbital mapping, landing, rovers, sample return and crewed expeditions. Landing systems are required for surface work; direct lunar missions do not require Lagrange stations."
 cw_sr_region_name_8: "Lunar Orbit & Surface"
 cw_sr_region_9: "EARTH-MOON L1 / L2\n1 programme"
 cw_sr_region_tip_9: "The Earth-Moon pair of equilibrium regions, near the Moon. Relay or staging concepts need navigation and station keeping; this is distinct from Sun-Earth L1 and L2."
 cw_sr_region_name_9: "Earth-Moon L1 / L2 Region"
 cw_sr_region_10: "SUN-EARTH L1\n1 programme"
 cw_sr_region_tip_10: "Approximately 1.5 million km sunward from Earth. Solar-wind observatories use halo orbits and active station keeping; no lunar stop is necessary."
 cw_sr_region_name_10: "Sun-Earth L1 Region"
 cw_sr_region_11: "SUN-EARTH L2\n1 programme"
 cw_sr_region_tip_11: "Approximately 1.5 million km beyond Earth away from the Sun. Precision observatories require thermal control, communications and active station keeping."
 cw_sr_region_name_11: "Sun-Earth L2 Region"
 cw_sr_region_12: "VENUS\n3 programmes"
 cw_sr_region_tip_12: "Flybys, atmospheric entry and orbital radar science. Transfer opportunities and a severe thermal environment shape programme risk."
 cw_sr_region_name_12: "Venus & Inner-Planet Transfers"
 cw_sr_region_13: "MERCURY\n1 programme"
 cw_sr_region_tip_13: "Inner-planet navigation and gravity-assist flybys. A Mercury flyby is an independent science branch; it is not a prerequisite for Mars."
 cw_sr_region_name_13: "Mercury Flyby Trajectories"
 cw_sr_region_14: "MARS\n6 programmes"
 cw_sr_region_tip_14: "Orbital reconnaissance, robotic landing, rovers, sample return and a proposed crewed expedition. Launch opportunities recur roughly every 26 months. Return missions include the complete outward cruise, surface campaign and journey home."
 cw_sr_region_name_14: "Mars Orbit, Surface & Return Missions"
 cw_sr_region_15: "OUTER PLANETS\n2 programmes"
 cw_sr_region_tip_15: "Multi-year cruises, radiation, weak communications and gravity-assist navigation. The map is schematic and does not represent relative distances."
 cw_sr_region_name_15: "Jupiter, Saturn & Outer Planets"
