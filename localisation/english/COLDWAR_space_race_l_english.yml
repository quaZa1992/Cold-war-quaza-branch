 cw_sr_profile_USA: "The United States begins with operational crewed spaceflight, Saturn V and demonstrated lunar landing and return. New programmes retain their engineering, launch and operating costs."
 cw_sr_profile_SOV: "The Soviet Union begins with crewed orbital flight, automatic docking, lunar and planetary probe heritage. N1 heavy lift and a crewed lunar landing remain unfinished programmes."
 cw_sr_profile_FRA: "France has independent orbital-launch experience from Diamant A. At the start of 1970 the Kourou Diamant B facilities are still being brought into service."
 cw_sr_profile_ENG: "Britain has Ariel satellite and early Skynet operations, while Black Arrow has not yet achieved an orbital launch. British payload expertise and foreign launch access are separate from an independent launcher."
 cw_sr_profile_JAP: "ISAS has substantial sounding-rocket and Lambda development experience. NASDA was established in 1969. No Japanese satellite has reached orbit on 1 January 1970; Ohsumi is still a pending mission."
 cw_sr_profile_CHI: "China has a major national launch and satellite development effort, but Dong Fang Hong 1 has not launched on 1 January 1970. Independent orbital access must still be demonstrated."
 cw_sr_profile_RAJ: "ISRO was established in August 1969 and inherits Thumba sounding-rocket work. India has no operational orbital satellite or qualified orbital launcher in January 1970."
 cw_sr_profile_CAN: "Canada has Alouette heritage and the Canadian-built ISIS 1 mission launched by a US Delta in 1969. Payload design and operations are established; independent orbital launch production is not."
 cw_sr_profile_GER: "AZUR launched on a US Scout in November 1969. West Germany has satellite and ground-control experience through national and European cooperation, without an independent operational orbital launcher."
 cw_sr_profile_ITA: "Italy operates the San Marco programme and equatorial ocean platforms. The programme uses US-provided Scout launch vehicles; the platform does not establish a domestic orbital rocket industry."
 cw_sr_profile_AST: "WRESAT reached orbit in 1967 using a donated US launcher. Australia has range, tracking and cooperation experience, but no independently produced orbital launch vehicle."
 cw_sr_profile_HOL: "The Netherlands hosts ESTEC and has strong scientific instrument research. The ANS satellite is a study path in January 1970; formal national approval follows later in 1970."
 cw_sr_profile_SWE: "Esrange has operated under ESRO since 1966. Sweden has sounding-rocket, atmospheric and auroral science experience; the later Swedish space organisations are not treated as already founded in 1970."
 cw_sr_profile_BRA: "Brazil enters 1970 with CNAE, atmospheric research and Barreira do Inferno sounding-rocket infrastructure. Orbital satellites and independent orbital launch remain development objectives."
 cw_sr_profile_ARG: "Argentina has CNIE and a national sounding-rocket research tradition. Its 1970 starting point supports scientific payloads and launch-range work rather than a free orbital capability."
 cw_sr_profile_DDR: "East Germany participates in Interkosmos and has already flown a photometer on Interkosmos 1 in October 1969. Its 1970 strengths are scientific instruments, optics, receiving stations and Soviet cooperation. Complete satellite manufacture, a domestic orbital launcher and national crew transport remain separate development objectives."
 cw_sr_profile_CUSTOM: "Any player-controlled country may begin here. Establish national coordination, then choose sounding research, spacecraft engineering, purchased foreign launch access or a gradual domestic launcher programme."
