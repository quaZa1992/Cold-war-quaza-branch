 cw_sr_report.32.d: "[ROOT.GetName] has suspended deployed operations under Deep-Space Tracking Network. New operating charges are suspended. Existing debts remain payable. A funded mission or facility acceptance is required to restore deployed operations; accepted scientific knowledge is retained."
