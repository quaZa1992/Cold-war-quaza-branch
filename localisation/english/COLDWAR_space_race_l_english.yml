 cw_sr_report.1690.d: "[ROOT.GetName] has reported the loss of mission hardware or an unsuccessful operating campaign for Crewed Mars Landing & Earth Return Expedition. The expedition aborts without completing an accepted surface mission. Major vehicle deficiencies require corrective engineering and a full technical review."
 cw_sr_report.1691.t: "[ROOT.GetName]: Spaceflight Disaster"
 cw_sr_report.1691.d: "[ROOT.GetName] has reported a catastrophic accident during Crewed Mars Landing & Earth Return Expedition. Crew recovery fails after a catastrophic expedition emergency. An extended crew-safety investigation is required; the landing-and-return objective remains unfulfilled. The commission is reviewing crew recovery and national personnel losses."
 cw_sr_report.1692.t: "[ROOT.GetName]: Programme Mothballed"
 cw_sr_report.1692.d: "[ROOT.GetName] has suspended deployed operations under Crewed Mars Landing & Earth Return Expedition. New operating charges are suspended. Existing debts remain payable. A funded mission or facility acceptance is required to restore deployed operations; accepted scientific knowledge is retained."
 cw_sr_world.1688.t: "[FROM.GetName]: Space Milestone"
 cw_sr_world.1688.d: "[FROM.GetName] has completed Crewed Mars Landing & Earth Return Expedition. The accepted mission represents a major national scientific and industrial achievement."
 cw_sr_world.1691.t: "[FROM.GetName]: Crew Lost"
 cw_sr_world.1691.d: "[FROM.GetName] has reported the loss of a crew during Crewed Mars Landing & Earth Return Expedition. The government has suspended further flights of this architecture while a safety commission conducts its investigation."
 cw_sr_report.8001.t: "[ROOT.GetName]: Moon Expedition"
 cw_sr_report.8001.d: "[ROOT.GetName] has completed Crewed Lunar Landing Expedition. The crew has completed the surface expedition and returned safely to Earth. The mission authority has accepted the complete landing and recovery campaign."
 cw_sr_world.8001.t: "[FROM.GetName]: Moon Expedition"
 cw_sr_world.8001.d: "[FROM.GetName] has completed Crewed Lunar Landing Expedition. The crew has completed the surface expedition and returned safely to Earth. The mission authority has accepted the complete landing and recovery campaign."
 cw_sr_report.8002.t: "[ROOT.GetName]: Moon Expedition"
 cw_sr_report.8002.d: "[ROOT.GetName] has completed Crewed Lunar Landing Expedition. The crew has completed the surface expedition and returned safely to Earth. The mission authority has accepted the complete landing and recovery campaign."
 cw_sr_world.8002.t: "[FROM.GetName]: Moon Expedition"
 cw_sr_world.8002.d: "[FROM.GetName] has completed Crewed Lunar Landing Expedition. The crew has completed the surface expedition and returned safely to Earth. The mission authority has accepted the complete landing and recovery campaign."
 cw_sr_report.8003.t: "[ROOT.GetName]: Moon Expedition"
 cw_sr_report.8003.d: "[ROOT.GetName] has completed Crewed Lunar Landing Expedition. The crew has completed the surface expedition and returned safely to Earth. The mission authority has accepted the complete landing and recovery campaign."
 cw_sr_world.8003.t: "[FROM.GetName]: Moon Expedition"
 cw_sr_world.8003.d: "[FROM.GetName] has completed Crewed Lunar Landing Expedition. The crew has completed the surface expedition and returned safely to Earth. The mission authority has accepted the complete landing and recovery campaign."
 cw_sr_report.8004.t: "[ROOT.GetName]: Mars Expedition"
 cw_sr_report.8004.d: "[ROOT.GetName] has completed Crewed Mars Landing & Earth Return Expedition. The crew completes the Mars surface expedition and is recovered on Earth. Crewed Mars landing and return are jointly accepted."
 cw_sr_world.8004.t: "[FROM.GetName]: Mars Expedition"
 cw_sr_world.8004.d: "[FROM.GetName] has completed Crewed Mars Landing & Earth Return Expedition. The crew completes the Mars surface expedition and is recovered on Earth. Crewed Mars landing and return are jointly accepted."
 cw_sr_report.8005.t: "[ROOT.GetName]: Mars Expedition"
 cw_sr_report.8005.d: "[ROOT.GetName] has completed Crewed Mars Landing & Earth Return Expedition. The crew completes the Mars surface expedition and is recovered on Earth. Crewed Mars landing and return are jointly accepted."
 cw_sr_world.8005.t: "[FROM.GetName]: Mars Expedition"
 cw_sr_world.8005.d: "[FROM.GetName] has completed Crewed Mars Landing & Earth Return Expedition. The crew completes the Mars surface expedition and is recovered on Earth. Crewed Mars landing and return are jointly accepted."
 cw_sr_milestone_1: "First Artificial Satellite"
 cw_sr_first_reward_1: "Space prestige: §G+45§!\nResearch data: §G+5§!\nPolitical power: §G+12§!\n§G20%§! research bonus for §H1§! technology in any field.\nWorld-first award; recorded once for the achieving country."
 cw_sr_world.9001.t: "[FROM.GetName]: First Satellite"
 cw_sr_world.9001.d: "[FROM.GetName] has achieved First Artificial Satellite. The first artificial satellite reaches Earth orbit. The international scientific community recognises [FROM.GetName] as the first country to complete this achievement."
 cw_sr_milestone_2: "First Human Spaceflight"
 cw_sr_first_reward_2: "Space prestige: §G+80§!\nResearch data: §G+8§!\nPolitical power: §G+18§!\n§G20%§! research bonus for §H1§! technology in any field.\nWorld-first award; recorded once for the achieving country."
 cw_sr_world.9002.t: "[FROM.GetName]: First Human in Orbit"
 cw_sr_world.9002.d: "[FROM.GetName] has achieved First Human Spaceflight. A human orbital mission is completed and its crew recovered. The international scientific community recognises [FROM.GetName] as the first country to complete this achievement."
 cw_sr_milestone_3: "First Crewed Lunar Landing"
 cw_sr_first_reward_3: "Space prestige: §G+160§!\nResearch data: §G+12§!\nPolitical power: §G+26§!\n§G20%§! research bonus for §H1§! technology in any field.\nWorld-first award; recorded once for the achieving country."
 cw_sr_world.9003.t: "[FROM.GetName]: First Moon Landing"
 cw_sr_world.9003.d: "[FROM.GetName] has achieved First Crewed Lunar Landing. A crew lands on the Moon and completes its accepted return mission. The international scientific community recognises [FROM.GetName] as the first country to complete this achievement."
 cw_sr_milestone_4: "First Successful Lunar Rover"
 cw_sr_first_reward_4: "Space prestige: §G+42§!\nResearch data: §G+6§!\nPolitical power: §G+8§!\n§G20%§! research bonus for §H1§! technology in any field.\nWorld-first award; recorded once for the achieving country."
 cw_sr_world.9004.t: "[FROM.GetName]: First Lunar Rover"
 cw_sr_world.9004.d: "[FROM.GetName] has achieved First Successful Lunar Rover. A robotic vehicle completes an accepted mobile science campaign on the Moon. The international scientific community recognises [FROM.GetName] as the first country to complete this achievement."
 cw_sr_milestone_5: "First Robotic Lunar Sample Return"
 cw_sr_first_reward_5: "Space prestige: §G+62§!\nResearch data: §G+8§!\nPolitical power: §G+10§!\n§G20%§! research bonus for §H1§! technology in any field.\nWorld-first award; recorded once for the achieving country."
 cw_sr_world.9005.t: "[FROM.GetName]: First Lunar Samples"
 cw_sr_world.9005.d: "[FROM.GetName] has achieved First Robotic Lunar Sample Return. An automated mission delivers an accepted lunar sample to Earth. The international scientific community recognises [FROM.GetName] as the first country to complete this achievement."
 cw_sr_milestone_6: "First Operational Orbital Station"
 cw_sr_first_reward_6: "Space prestige: §G+55§!\nResearch data: §G+7§!\nPolitical power: §G+12§!\n§G20%§! research bonus for §H1§! technology in any field.\nWorld-first award; recorded once for the achieving country."
 cw_sr_world.9006.t: "[FROM.GetName]: First Space Station"
 cw_sr_world.9006.d: "[FROM.GetName] has achieved First Operational Orbital Station. A crewed orbital station completes its accepted initial scientific expedition. The international scientific community recognises [FROM.GetName] as the first country to complete this achievement."
 cw_sr_milestone_7: "First Successful Mars Orbiter"
 cw_sr_first_reward_7: "Space prestige: §G+65§!\nResearch data: §G+8§!\nPolitical power: §G+10§!\n§G20%§! research bonus for §H1§! technology in any field.\nWorld-first award; recorded once for the achieving country."
 cw_sr_world.9007.t: "[FROM.GetName]: First Mars Orbiter"
 cw_sr_world.9007.d: "[FROM.GetName] has achieved First Successful Mars Orbiter. A spacecraft enters Mars orbit and completes its accepted orbital science objectives. The international scientific community recognises [FROM.GetName] as the first country to complete this achievement."
 cw_sr_milestone_8: "First Sustained Mars Surface Mission"
 cw_sr_first_reward_8: "Space prestige: §G+95§!\nResearch data: §G+12§!\nPolitical power: §G+14§!\n§G20%§! research bonus for §H1§! technology in any field.\nWorld-first award; recorded once for the achieving country."
 cw_sr_world.9008.t: "[FROM.GetName]: First Mars Landing"
 cw_sr_world.9008.d: "[FROM.GetName] has achieved First Sustained Mars Surface Mission. A lander completes an accepted surface science campaign. Brief contact alone does not qualify. The international scientific community recognises [FROM.GetName] as the first country to complete this achievement."
 cw_sr_milestone_9: "First Successful Mars Rover"
 cw_sr_first_reward_9: "Space prestige: §G+115§!\nResearch data: §G+14§!\nPolitical power: §G+16§!\n§G20%§! research bonus for §H1§! technology in any field.\nWorld-first award; recorded once for the achieving country."
 cw_sr_world.9009.t: "[FROM.GetName]: First Mars Rover"
 cw_sr_world.9009.d: "[FROM.GetName] has achieved First Successful Mars Rover. A mobile explorer completes an accepted science traverse on Mars. The international scientific community recognises [FROM.GetName] as the first country to complete this achievement."
 cw_sr_milestone_10: "First Mars Samples Recovered on Earth"
 cw_sr_first_reward_10: "Space prestige: §G+170§!\nResearch data: §G+20§!\nPolitical power: §G+20§!\n§G20%§! research bonus for §H1§! technology in any field.\nWorld-first award; recorded once for the achieving country."
 cw_sr_world.9010.t: "[FROM.GetName]: Mars Samples Return"
 cw_sr_world.9010.d: "[FROM.GetName] has achieved First Mars Samples Recovered on Earth. A returned Mars sample is recovered and accepted by its receiving laboratory. The international scientific community recognises [FROM.GetName] as the first country to complete this achievement."
 cw_sr_milestone_11: "First Crewed Mars Expedition Returns"
 cw_sr_first_reward_11: "Space prestige: §G+260§!\nResearch data: §G+24§!\nPolitical power: §G+32§!\n§G20%§! research bonus for §H1§! technology in any field.\nWorld-first award; recorded once for the achieving country."
 cw_sr_world.9011.t: "[FROM.GetName]: First Mars Return"
 cw_sr_world.9011.d: "[FROM.GetName] has achieved First Crewed Mars Expedition Returns. The first accepted crewed Mars surface expedition returns its crew to Earth. The international scientific community recognises [FROM.GetName] as the first country to complete this achievement."
 cw_sr_world.9101.t: "[FROM.GetName]: First Mars Return"
 cw_sr_world.9101.d: "[FROM.GetName] has achieved First Crewed Mars Expedition Returns. The first accepted crewed Mars surface expedition returns its crew to Earth. The international scientific community recognises [FROM.GetName] as the first country to complete this achievement."
 cw_sr_world.9102.t: "[FROM.GetName]: First Mars Return"
 cw_sr_world.9102.d: "[FROM.GetName] has achieved First Crewed Mars Expedition Returns. The first accepted crewed Mars surface expedition returns its crew to Earth. The international scientific community recognises [FROM.GetName] as the first country to complete this achievement."
