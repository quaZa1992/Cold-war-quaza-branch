 COLDWAR_PAK_martial_law_category: "The Martial Law Regime"
 COLDWAR_PAK_martial_law_category_desc: "The generals in Rawalpindi decide who leads and how much politics the country may have."
 COLDWAR_PAK_policy_category: "The Bomb or the Bread"
 COLDWAR_PAK_policy_category_desc: "A choice made once can be reversed, at a price."
 COLDWAR_PAK_offers_category: "Offers from Pakistan"
 COLDWAR_PAK_offers_category_desc: "Proposals Islamabad has sent us."
 COLDWAR_PAK.10.t: "The Mountains Rise"
 COLDWAR_PAK.10.d: "Marri and Mengal fighters ambush army convoys from Kohlu to Kalat. The Balochistan insurgency has begun."
 COLDWAR_PAK.10.a: "Send in the army."
 COLDWAR_PAK.11.t: "Nizam-e-Mustafa"
 COLDWAR_PAK.11.d: "The opposition alliance calls the faithful into the streets. Lahore and Karachi are shut by strikes and processions."
 COLDWAR_PAK.11.a: "We must ride it out."
 COLDWAR_PAK.12.t: "The Ojhri Camp"
 COLDWAR_PAK.12.d: "The ammunition depot of the Afghan pipeline explodes between Rawalpindi and Islamabad. Rockets fall on both cities."
 COLDWAR_PAK.12.a: "Find out who is responsible."
 COLDWAR_PAK.13.t: "Peace in the Mountains"
 COLDWAR_PAK.13.d: "The last guerrilla bands come down from the hills under an amnesty."
 COLDWAR_PAK.13.a: "At last."
 COLDWAR_PAK.14.t: "The Fall of Dacca"
 COLDWAR_PAK.14.d: "Bangladesh is a state. The army that held the East is in Indian camps and the nation asks how it came to this."
 COLDWAR_PAK.14.a: "We will not forget."
 COLDWAR_PAK.101.t: "[From.GetName] Accepts"
 COLDWAR_PAK.101.d: "[From.GetName] has accepted our proposal."
 COLDWAR_PAK.101.a: "Excellent."
 COLDWAR_PAK.102.t: "[From.GetName] Declines"
 COLDWAR_PAK.102.d: "[From.GetName] has turned down our proposal."
 COLDWAR_PAK.102.a: "Unfortunate."
 COLDWAR_PAK.103.t: "An Agreement Resumes"
 COLDWAR_PAK.103.d: "The quarrel is over. The paused agreement with Pakistan is in force again."
 COLDWAR_PAK.103.a: "Good."
 COLDWAR_PAK.104.t: "An Agreement Suspended"
 COLDWAR_PAK.104.d: "War or sanctions stand between Pakistan and its partner. The agreement is suspended until the quarrel ends."
 COLDWAR_PAK.104.a: "So be it."
