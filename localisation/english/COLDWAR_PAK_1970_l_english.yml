 COLDWAR_PAK_deal_indus_waters_compact_RAJ: "The Indus Waters Compact"
 COLDWAR_PAK_deal_taxila_works: "The Taxila Works"
 COLDWAR_PAK_deal_taxila_works_CHI: "The Taxila Works"
 COLDWAR_PAK_deal_frontline_state: "The Frontline State"
 COLDWAR_PAK_deal_frontline_state_USA: "The Frontline State"
 COLDWAR_PAK_deal_tripoli_credit_line: "The Tripoli Credit Line"
 COLDWAR_PAK_deal_tripoli_credit_line_LBA: "The Tripoli Credit Line"
 COLDWAR_PAK_deal_peaceful_atom_accord: "The Peaceful Atom Accord"
 COLDWAR_PAK_deal_peaceful_atom_accord_CHI: "The Peaceful Atom Accord"
 COLDWAR_PAK_state_modifier: "Pakistani State"
 COLDWAR_PAK_economy_modifier: "Pakistani Economy"
 COLDWAR_PAK_army_modifier: "Pakistani Armed Forces"
 COLDWAR_PAK_security_modifier: "Order and Security"
 COLDWAR_PAK_pmlc_programme: "The Council League's Programme"
 COLDWAR_PAK_ppp_programme: "Islamic Socialism"
 COLDWAR_PAK_jui_programme: "The Ulema's Programme"
 COLDWAR_PAK_tnfj_programme: "The Shia Programme"
 COLDWAR_PAK_kho_programme: "The Path of the Imam"
 COLDWAR_PAK_ssp_programme: "The Pulpit Programme"
 COLDWAR_PAK_ji_programme: "The Jamaat's Programme"
 COLDWAR_PAK_pmlq_programme: "The Qayyum League's Programme"
 COLDWAR_PAK_nap_programme: "The NAP Programme"
 COLDWAR_PAK_al_programme: "The Six Points Programme"
 COLDWAR_PAK_army_programme: "The Garrison State"
 COLDWAR_PAK_chief_yah: "A New Chief at GHQ: Yahya Khan"
 COLDWAR_PAK_chief_yah_desc: "The corps commanders meet in Rawalpindi. A new chief of staff means a new head of state, and a new programme."
 COLDWAR_PAK_chief_nur: "A New Chief at GHQ: Nur Khan"
 COLDWAR_PAK_chief_nur_desc: "The corps commanders meet in Rawalpindi. A new chief of staff means a new head of state, and a new programme."
 COLDWAR_PAK_chief_gul: "A New Chief at GHQ: Gul Hassan Khan"
 COLDWAR_PAK_chief_gul_desc: "The corps commanders meet in Rawalpindi. A new chief of staff means a new head of state, and a new programme."
 COLDWAR_PAK_chief_tik: "A New Chief at GHQ: Tikka Khan"
 COLDWAR_PAK_chief_tik_desc: "The corps commanders meet in Rawalpindi. A new chief of staff means a new head of state, and a new programme."
 COLDWAR_PAK_chief_zia: "A New Chief at GHQ: Zia-ul-Haq"
 COLDWAR_PAK_chief_zia_desc: "The corps commanders meet in Rawalpindi. A new chief of staff means a new head of state, and a new programme."
 COLDWAR_PAK_ban_political_activity: "Ban Political Activity"
 COLDWAR_PAK_ban_political_activity_desc: "Seal the party offices and forbid public meetings."
 COLDWAR_PAK_allow_political_activity: "Allow Political Activity"
 COLDWAR_PAK_allow_political_activity_desc: "Let the parties campaign again, under the eyes of the martial law administrators."
 COLDWAR_PAK_switch_to_bread: "Abandon the Bomb"
 COLDWAR_PAK_switch_to_bread_desc: "Close Kahuta, open the books to the inspectors and spend the money on canals and schools."
 COLDWAR_PAK_switch_to_bomb: "Restart the Programme"
 COLDWAR_PAK_switch_to_bomb_desc: "The scientists are recalled and the centrifuge halls reopened."
