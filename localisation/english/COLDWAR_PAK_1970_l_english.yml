l_english:
# IMPERIA COLD WAR — Cold War: Pakistan 1970 national programme.
 COLDWAR_PAK_1970_focus: "Pakistan"
 COLDWAR_PAK_politics_tree_shortcut: "The Year of the Ballot"
 COLDWAR_PAK_army_tree_shortcut: "General Headquarters"
 COLDWAR_PAK_bengal_tree_shortcut: "The Bengal Question"
 COLDWAR_PAK_bomb_tree_shortcut: "The Bomb or the Bread"
 COLDWAR_PAK_economy_tree_shortcut: "Economy"
 COLDWAR_PAK_military_tree_shortcut: "Armed Forces"
 COLDWAR_PAK_foreign_tree_shortcut: "Foreign Policy"
 COLDWAR_PAK_ow_r: "The Restoration of Democracy"
 COLDWAR_PAK_ow_r_desc: "The movement that brought down Ayub Khan wants more than a new general. It wants an elected parliament."
 COLDWAR_PAK_ow_a: "The Democratic Action Committee"
 COLDWAR_PAK_ow_a_desc: "Eight parties around one table: the respectable opposition of lawyers, notables and old Leaguers."
 COLDWAR_PAK_ow_b: "Roti, Kapra aur Makan"
 COLDWAR_PAK_ow_b_desc: "Bread, clothing and shelter: three words that reach every tenant and every mill hand."
 COLDWAR_PAK_ow_m: "The Ballot Box Is Ours"
 COLDWAR_PAK_ow_m_desc: "Whatever the generals plan, the people have tasted a free vote."
 COLDWAR_PAK_ppp_e: "The Peoples Party"
 COLDWAR_PAK_ppp_e_desc: "Islam is our faith, democracy is our polity, socialism is our economy, all power to the people. The poor who chanted our slogans now expect bread before speeches."
 COLDWAR_PAK_ppp_pol: "Quaid-e-Awam"
 COLDWAR_PAK_ppp_pol_desc: "The Leader of the People speaks to a million in Lahore and the crowd answers. The party is Bhutto, and Bhutto is the party."
 COLDWAR_PAK_ppp_eco: "Socialism Is Our Economy"
 COLDWAR_PAK_ppp_eco_desc: "Our manifesto promises that all major industries will serve the people. The question is how fast, and who pays."
 COLDWAR_PAK_ppp_a1: "The Federal Security Force"
 COLDWAR_PAK_ppp_a1_desc: "A force loyal to the government, not to GHQ. The opposition calls it Bhutto's private army."
 COLDWAR_PAK_ppp_a2: "The Tripartite Accord"
 COLDWAR_PAK_ppp_a2_desc: "We sign with the NAP and the JUI: their governors and ministers in the Frontier and Balochistan, our constitution in Islamabad."
 COLDWAR_PAK_ppp_b1: "Nationalise the Commanding Heights"
 COLDWAR_PAK_ppp_b1_desc: "Steel, cement, engineering, chemicals: thirty-one units of the basic industries pass to the state on the first working day of the year."
 COLDWAR_PAK_ppp_b2: "The Mixed Economy Clause"
 COLDWAR_PAK_ppp_b2_desc: "Our own manifesto accepts a mixed economy. Regulate the families, tax them, and keep their capital in Pakistan."
 COLDWAR_PAK_ppp_a1f: "Dismiss the Balochistan Government"
 COLDWAR_PAK_ppp_a1f_desc: "Arms found at the Iraqi embassy give us the reason. Governor Bizenjo and Chief Minister Mengal go, and the mountains rise."
 COLDWAR_PAK_ppp_a2f: "Governments of the Opposition"
 COLDWAR_PAK_ppp_a2f_desc: "Let the NAP govern Quetta and Peshawar. A partner in office is easier to handle than a rebel in the hills."
 COLDWAR_PAK_ppp_b1f: "Banks, Insurance and Shipping"
 COLDWAR_PAK_ppp_b1f_desc: "Credit is the lifeblood of the families. Thirteen banks become the people's banks."
 COLDWAR_PAK_ppp_b2f: "The Peoples Works Programme"
 COLDWAR_PAK_ppp_b2f_desc: "Roads, drains and schools built by village labour and paid by the state. Work instead of charity."
 COLDWAR_PAK_ppp_pm: "The Peoples Government"
 COLDWAR_PAK_ppp_pm_desc: "The first elected government of the new Pakistan. It must prove that the people can rule without the generals."
 COLDWAR_PAK_ppp_em: "Bread, Clothing and Shelter"
 COLDWAR_PAK_ppp_em_desc: "The slogan becomes policy: cheap cloth, ration shops and housing schemes for the mill towns."
 COLDWAR_PAK_ppp_c1: "The Land Reforms of 1972"
 COLDWAR_PAK_ppp_c1_desc: "No family may own more than 150 irrigated acres. The surplus goes to the tenants who till it."
 COLDWAR_PAK_ppp_c2: "Spare the Waderas"
 COLDWAR_PAK_ppp_c2_desc: "Half our ticket in Sindh are landlords. A reform that breaks them breaks the party."
 COLDWAR_PAK_ppp_d1: "Bilateralism"
 COLDWAR_PAK_ppp_d1_desc: "Equal distance to every great power and dependence on none. The pacts of the 1950s served Washington, not Pakistan."
 COLDWAR_PAK_ppp_d2: "The Islamic Summit"
 COLDWAR_PAK_ppp_d2_desc: "Kings and presidents of the Muslim world in Lahore, under our flag. Their oil money will remember who invited them."
 COLDWAR_PAK_ppp_cm: "Awami Raj"
 COLDWAR_PAK_ppp_cm_desc: "The people's rule: party offices in every tehsil and party men in every department."
 COLDWAR_PAK_ppp_dm: "The Third World Voice"
 COLDWAR_PAK_ppp_dm_desc: "At the UN and in every capital of the South, Pakistan speaks for the poor nations against the rich."
 COLDWAR_PAK_ppp_cap: "The Peoples' Pakistan"
 COLDWAR_PAK_ppp_cap_desc: "A constitution, nationalised banks, land to the tenant and a voice in the world. The party has built its Pakistan."
 COLDWAR_PAK_ppp_h: "The March Election"
 COLDWAR_PAK_ppp_h_desc: "Nine parties have formed one alliance against us. We could win honestly, or we could make sure."
 COLDWAR_PAK_ppp_k1: "Count Every Vote"
 COLDWAR_PAK_ppp_k1_desc: "A clean count costs seats. It also takes away the generals' excuse."
 COLDWAR_PAK_ppp_k2: "The Larkana Plan"
 COLDWAR_PAK_ppp_k2_desc: "Returning officers who know what is expected. Two-thirds is safer than a majority."
 COLDWAR_PAK_ppp_k1f: "The Daughter of the East"
 COLDWAR_PAK_ppp_k1f_desc: "A new generation leads the party: younger, Western-educated, at ease with markets and with Washington."
 COLDWAR_PAK_ppp_k2f: "Rule by Emergency"
 COLDWAR_PAK_ppp_k2f_desc: "Martial law in Karachi, Lahore and Hyderabad, declared by a civilian. The army obeys, for now."
 COLDWAR_PAK_ppp_km: "Jiye Bhutto"
 COLDWAR_PAK_ppp_km_desc: "Long live Bhutto: whatever happens to the man, the name will win elections for a generation."
 COLDWAR_PAK_pmlc_e: "Jinnah's League"
 COLDWAR_PAK_pmlc_e_desc: "The League that made Pakistan will govern it again: lawyers, landlords and mill owners who learned their politics from the Quaid. Property is safe, and so is the rule of law."
 COLDWAR_PAK_pmlc_x: "The Punjab Notables"
 COLDWAR_PAK_pmlc_x_desc: "The landed families of the canal colonies and the lawyers of Lahore have held the League together since the Raj."
 COLDWAR_PAK_pmlc_y: "The League Reunited"
 COLDWAR_PAK_pmlc_y_desc: "Convention, Council, Qayyum and the pirs of Sindh in one party again. Whoever sits in the League's chair can claim the whole nation."
 COLDWAR_PAK_pmlc_xf: "Canal Colony Patronage"
 COLDWAR_PAK_pmlc_xf_desc: "Water rights, tubewell licences and land grants for the families that vote for us. The canals were dug by the Raj, and we know who should drink from them."
 COLDWAR_PAK_pmlc_yf: "Pir Pagara's Functional League"
 COLDWAR_PAK_pmlc_yf_desc: "The Pir of Pagara commands thousands of Hurs in Sindh. His blessing carries seats, and his friends expect favours."
 COLDWAR_PAK_pmlc_m: "The Muslim League Ministry"
 COLDWAR_PAK_pmlc_m_desc: "A cabinet of solid names: no slogans, no committees, only ministers who understand a balance sheet."
 COLDWAR_PAK_pmlc_c1: "Return the Mills"
 COLDWAR_PAK_pmlc_c1_desc: "The mills taken in 1972 go back to their owners. A factory that is not safe in Pakistan will be built in Dubai."
 COLDWAR_PAK_pmlc_c2: "The Farmers' League"
 COLDWAR_PAK_pmlc_c2_desc: "The cotton and wheat of Punjab pay for the nation. The farmer must get a fair price, and an input subsidy from the state he feeds."
 COLDWAR_PAK_pmlc_c1f: "Ittefaq and the Foundries"
 COLDWAR_PAK_pmlc_c1f_desc: "The Sharif family's foundries in Lahore will roll steel again. A small enterprise that became a large one shows that the League's economy works."
 COLDWAR_PAK_pmlc_c2f: "Tubewells for Punjab"
 COLDWAR_PAK_pmlc_c2f_desc: "Every village in Punjab will have a tubewell and an electric line. Our water is our wealth."
 COLDWAR_PAK_pmlc_z: "The Punjab Development Plan"
 COLDWAR_PAK_pmlc_z_desc: "Roads, a motorway and electric lines from Rawalpindi to Multan: a province that builds for itself and for the country."
 COLDWAR_PAK_pmlc_cap: "The Islami Jamhoori Ittehad"
 COLDWAR_PAK_pmlc_cap_desc: "Nine parties of the right, from the League to the Jamaat, stand together under one banner. A rival who cannot beat us has to join us."
 COLDWAR_PAK_ona_r: "The Third Path"
 COLDWAR_PAK_ona_r_desc: "Neither Washington's pacts nor Moscow's creed: Pakistan was founded for something of its own."
 COLDWAR_PAK_ona_a: "Nizam-e-Mustafa"
 COLDWAR_PAK_ona_a_desc: "The order of the Prophet: the slogan that can fill every mosque against a government."
 COLDWAR_PAK_ona_b: "Provincial Autonomy Now"
 COLDWAR_PAK_ona_b_desc: "Pukhtun, Baloch, Sindhi and Punjabi: four nations in one federation, each master of its own home."
 COLDWAR_PAK_ona_m: "A Non-Aligned Pakistan"
 COLDWAR_PAK_ona_m_desc: "Pakistan should stand with the Muslim world and the Third World, not in the antechambers of the blocs."
 COLDWAR_PAK_ji_e: "The Jamaat-e-Islami"
 COLDWAR_PAK_ji_e_desc: "Sovereignty belongs to God, and the state must answer to His law. We have disciplined workers and a programme for every ministry, and now we hold them."
 COLDWAR_PAK_ji_pol: "Theo-Democracy"
 COLDWAR_PAK_ji_pol_desc: "The people elect their representatives, but no assembly may legislate against the Quran and the Sunnah. This is our answer to the dictator and to the secular parliament alike."
 COLDWAR_PAK_ji_eco: "Islamic Economics"
 COLDWAR_PAK_ji_eco_desc: "Private property, honest trade and no usury: neither the capitalist nor the commissar. Wealth must circulate through zakat and partnership, not through interest."
 COLDWAR_PAK_ji_a1: "The Cadre Party"
 COLDWAR_PAK_ji_a1_desc: "Membership is a long road: study, prayer, accounts and the scrutiny of the amir. Few join, and none join lightly."
 COLDWAR_PAK_ji_a2: "The Mass Movement"
 COLDWAR_PAK_ji_a2_desc: "The party must go to the mohalla, the bazaar and the mill gate. A procession for every grievance, and a Friday sermon behind it."
 COLDWAR_PAK_ji_b1: "Abolish Riba"
 COLDWAR_PAK_ji_b1_desc: "A loan that returns more than it lent is riba. We will end it, and replace it with partnership and the sharing of profit and loss."
 COLDWAR_PAK_ji_b2: "The Zakat Fund"
 COLDWAR_PAK_ji_b2_desc: "Two and a half percent of savings and a tenth of the harvest, collected by committees of the faithful and spent on the poor of their own district."
 COLDWAR_PAK_ji_a1f: "Islami Jamiat-e-Talaba"
 COLDWAR_PAK_ji_a1f_desc: "Our students hold the student unions of Lahore and Karachi. They supply the cadres of tomorrow, and they supply a good many quarrels today."
 COLDWAR_PAK_ji_a2f: "The Nizam-e-Mustafa Movement"
 COLDWAR_PAK_ji_a2f_desc: "Nine parties, one slogan: the system of the Prophet. The mosque committees carry it from Karachi to Peshawar."
 COLDWAR_PAK_ji_b1f: "The Islamic Banking Commission"
 COLDWAR_PAK_ji_b1f_desc: "Every bank product goes before a board of scholars and accountants. Mudaraba and musharaka instead of the interest-bearing loan."
 COLDWAR_PAK_ji_b2f: "The Bonus Share Scheme"
 COLDWAR_PAK_ji_b2f_desc: "The National Labour Federation asks for the worker as a partner: shares in the firm, a seat in the committee, and a wage that a mullah can defend from the pulpit."
 COLDWAR_PAK_ji_pm: "The Shariat Benches"
 COLDWAR_PAK_ji_pm_desc: "Every law is tested against the Quran and the Sunnah. The courts, not the party, will say what the Shariat requires."
 COLDWAR_PAK_ji_em: "The Council of Islamic Ideology"
 COLDWAR_PAK_ji_em_desc: "The Council's opinions must bind the Assembly, not gather dust in the Law Ministry. Eight scholars and a mandate to review every statute."
 COLDWAR_PAK_ji_c1: "Islamise the Curriculum"
 COLDWAR_PAK_ji_c1_desc: "Islamiyat in every class, a mosque school in every village, and textbooks that teach what the nation believes."
 COLDWAR_PAK_ji_c2: "The Penal Code of the Shariat"
 COLDWAR_PAK_ji_c2_desc: "Theft, drink and false witness answered by the punishments the Quran names, with the burden of proof set high. Deterrence and mercy in one code."
 COLDWAR_PAK_ji_d1: "The Afghan Jihad"
 COLDWAR_PAK_ji_d1_desc: "A neighbouring people is resisting a foreign army, and Peshawar cannot look away. The exiled parties, the refugees and the arms pipeline all come through our gates."
 COLDWAR_PAK_ji_d2: "The Ummah's Treasury"
 COLDWAR_PAK_ji_d2_desc: "The Muslim World League and the Gulf foundations fund our schools, our hospitals and our publishing houses. Gratitude has a price, and we know it."
 COLDWAR_PAK_ji_cm: "The Society of the Faithful"
 COLDWAR_PAK_ji_cm_desc: "Mosque committees, study circles and Quran classes in every ward. The state and the society learn to answer to the same law."
 COLDWAR_PAK_ji_dm: "Brothers Across the World"
 COLDWAR_PAK_ji_dm_desc: "From Mecca to Kabul to the Brotherhood in Cairo, our publishers, students and preachers have friends who answer our letters."
 COLDWAR_PAK_ji_cap: "The Islamic State of Pakistan"
 COLDWAR_PAK_ji_cap_desc: "The Objectives Resolution is no longer a preamble. Law, school and market answer to one standard, and the state is judged by it."
 COLDWAR_PAK_nap_e: "The Heirs of Bacha Khan"
 COLDWAR_PAK_nap_e_desc: "We are the heirs of Bacha Khan's Khudai Khidmatgar, of the Baloch who want their own assembly and of the Sindhi and Punjabi left. Pakistan will be a federation of equals or it will not hold."
 COLDWAR_PAK_nap_pol: "The Four Nations"
 COLDWAR_PAK_nap_pol_desc: "Pukhtun, Baloch, Sindhi and Punjabi are four nations with four histories. A state that denies it will have to hold them together by force."
 COLDWAR_PAK_nap_eco: "Land to the Tenant"
 COLDWAR_PAK_nap_eco_desc: "The land belongs to the man who ploughs it, and the mines and gas wells belong to the province under which they lie. Socialism for us begins with the khan and the sardar, not with the mill."
 COLDWAR_PAK_nap_a1: "Cooperate with the Centre"
 COLDWAR_PAK_nap_a1_desc: "We sign with the others and enter the government. A seat at the table in Islamabad is worth more than a walkout."
 COLDWAR_PAK_nap_a2: "Provincial Rights First"
 COLDWAR_PAK_nap_a2_desc: "The centre keeps defence, foreign affairs, currency and communications. Everything else belongs to the provinces, in law and in budget."
 COLDWAR_PAK_nap_b1: "The Hashtnagar Reform"
 COLDWAR_PAK_nap_b1_desc: "The khans of Hashtnagar took half the crop and gave the tenant nothing. The law now says who owns the plough, and who owns the field."
 COLDWAR_PAK_nap_b2: "The Sardari Compact"
 COLDWAR_PAK_nap_b2_desc: "Mengal, Bugti and Marri hold their tribes, and their tribes hold the hills. A compact with the sardars costs less than a war with them."
 COLDWAR_PAK_nap_a1f: "Governor Bizenjo"
 COLDWAR_PAK_nap_a1f_desc: "Ghaus Bakhsh Bizenjo, poet and politician, governs Quetta for the federation. The Baloch see one of their own in the Governor's House for the first time."
 COLDWAR_PAK_nap_a2f: "The Provincial Assemblies Decide"
 COLDWAR_PAK_nap_a2f_desc: "Budgets, police and the Levies are voted in Peshawar and Quetta. Federal officers wait for the assemblies, and the assemblies do not always hurry."
 COLDWAR_PAK_nap_b1f: "Tenant Committees"
 COLDWAR_PAK_nap_b1f_desc: "A committee of tenants in every village decides the crop share, the water turn and the price of seed. The patwari no longer decides alone."
 COLDWAR_PAK_nap_b2f: "Royalties for Sui Gas"
 COLDWAR_PAK_nap_b2f_desc: "Sui gas heats Lahore and Karachi while the district that sits on it has no pipe. The province gets a fair royalty, and the town gets its flame."
 COLDWAR_PAK_nap_pm: "The Government of Four Provinces"
 COLDWAR_PAK_nap_pm_desc: "Four chief ministers and one Prime Minister who listens to them. The cabinet table has chairs from Peshawar, Quetta, Karachi and Lahore."
 COLDWAR_PAK_nap_em: "Develop the Frontier"
 COLDWAR_PAK_nap_em_desc: "For twenty years the hills sent soldiers and received a school or two. A factory in Peshawar and a cement works in Quetta change the account."
 COLDWAR_PAK_nap_c1: "Pashto and Balochi in the Schools"
 COLDWAR_PAK_nap_c1_desc: "A child who learns first in Pashto or Balochi reads sooner and stays in school. The language of the home must also be the language of the classroom."
 COLDWAR_PAK_nap_c2: "Urdu as the Link"
 COLDWAR_PAK_nap_c2_desc: "Urdu is the language in which Pukhtun and Punjabi, Baloch and Sindhi can speak to each other. We give it the offices and keep the mother tongues in the home."
 COLDWAR_PAK_nap_d1: "Friends in Kabul"
 COLDWAR_PAK_nap_d1_desc: "Daoud has come to power in Kabul, and he knows our hills better than our ministers do. A neighbour who is a friend costs less than one who is a rival."
 COLDWAR_PAK_nap_d2: "Friends in Moscow"
 COLDWAR_PAK_nap_d2_desc: "Our party chose Moscow, not Beijing, in 1967. The Soviets will build steel and teach engineers, and ask for nothing but good manners."
 COLDWAR_PAK_nap_cm: "A Federation of Equals"
 COLDWAR_PAK_nap_cm_desc: "Every province has its assembly, its police, its language and its share of the revenue. The Senate holds them together."
 COLDWAR_PAK_nap_dm: "Peace on the Durand Line"
 COLDWAR_PAK_nap_dm_desc: "We renounce the dream of Pashtunistan and ask Kabul to renounce it too. The line drawn in 1893 divides families, but it will not divide states."
 COLDWAR_PAK_nap_cap: "The Four Nations Federation"
 COLDWAR_PAK_nap_cap_desc: "A federation in which the Pukhtun, Baloch, Sindhi and Punjabi each rule at home and all rule together in Islamabad. Wali Khan's party has done what its enemies said it could not."
 COLDWAR_PAK_pmlq_e: "The Qayyum League"
 COLDWAR_PAK_pmlq_e_desc: "Khan Abdul Qayyum Khan ruled the Frontier like a chief of police, and the Frontier was never quieter. We govern by order and by the favour that holds a district together."
 COLDWAR_PAK_pmlq_x: "The Frontier Strongman"
 COLDWAR_PAK_pmlq_x_desc: "Every district officer reports to Peshawar and Peshawar reports to us. The Red Shirts know our name."
 COLDWAR_PAK_pmlq_y: "Partner of the Peoples Party"
 COLDWAR_PAK_pmlq_y_desc: "We take the Interior Ministry and give the government its Frontier votes. A partner of the strong is stronger than a rival of the strong."
 COLDWAR_PAK_pmlq_xf: "The Hazara Notables"
 COLDWAR_PAK_pmlq_xf_desc: "In Abbottabad and Mansehra the Khans are our men, and our men are rewarded: a road, a school and a licence for every loyal village."
 COLDWAR_PAK_pmlq_yf: "The Interior Ministry"
 COLDWAR_PAK_pmlq_yf_desc: "The Federal Security Force, the Special Branch and the passport office now report to us. A minister who can count the police can count his enemies."
 COLDWAR_PAK_pmlq_m: "Order in the Frontier"
 COLDWAR_PAK_pmlq_m_desc: "The checkposts, the jirgas and the district officers all work to one plan: nothing in the Frontier moves without our knowledge."
 COLDWAR_PAK_pmlq_c1: "Against Pashtunistan"
 COLDWAR_PAK_pmlq_c1_desc: "There is no Pashtunistan, only the Frontier of Pakistan. Whoever speaks for Kabul in Peshawar is a stranger."
 COLDWAR_PAK_pmlq_c2: "The Khans' Peace"
 COLDWAR_PAK_pmlq_c2_desc: "The maliks of the tribal agencies keep their allowances and their levies. They keep the peace, and we keep them satisfied."
 COLDWAR_PAK_pmlq_cap: "The Centralist League"
 COLDWAR_PAK_pmlq_cap_desc: "One state, one centre and one set of officers. The League of the Frontier has proved that a strong capital makes strong provinces."
 COLDWAR_PAK_pmlq_z: "Qayyum's Legacy"
 COLDWAR_PAK_pmlq_z_desc: "A Frontier Corps with its own roads, a constabulary with its own barracks, and loyalists in every checkpost. Whoever comes after us inherits an order."
 COLDWAR_PAK_oe_r: "The Voice of the Ulema"
 COLDWAR_PAK_oe_r_desc: "Ten thousand seminaries shape the villages more than any ministry. The clerics want a say in the state."
 COLDWAR_PAK_oe_a: "The Deobandi Seminaries"
 COLDWAR_PAK_oe_a_desc: "Deoband's students hold the mosques of the Frontier and Balochistan."
 COLDWAR_PAK_oe_b: "The Shia Mutalibat"
 COLDWAR_PAK_oe_b_desc: "A fifth of the nation follows the Jafari school and asks for its own religious law and its own schools."
 COLDWAR_PAK_oe_m: "The Clerical Front"
 COLDWAR_PAK_oe_m_desc: "Sunni and Shia clerics can still march together when a government touches the mosque."
 COLDWAR_PAK_jui_e: "The Jamiat Ulema-e-Islam"
 COLDWAR_PAK_jui_e_desc: "We come from the Deobandi seminaries and the village mosque. The Pashtun poor know us, and we hold that a ruler owes justice before ceremony."
 COLDWAR_PAK_jui_x: "The Madrasa Network"
 COLDWAR_PAK_jui_x_desc: "Every town has a madrasa and every madrasa a hundred boys who would otherwise have no school. Our strength is in the benches, not in the ballot boxes."
 COLDWAR_PAK_jui_y: "The Frontier Coalition"
 COLDWAR_PAK_jui_y_desc: "The NAP has the numbers in the Frontier and we have the name that the villagers trust. A coalition of unlikely partners can rule better than a quarrel."
 COLDWAR_PAK_jui_xf: "Wifaq-ul-Madaris"
 COLDWAR_PAK_jui_xf_desc: "One board sets the syllabus, holds the examinations and issues the certificates for thousands of seminaries. The state recognises the degree, and the seminaries recognise the board."
 COLDWAR_PAK_jui_yf: "Chief Minister Mufti Mahmud"
 COLDWAR_PAK_jui_yf_desc: "A cleric sits in the Chief Minister's chair in Peshawar. He will resign if Islamabad dismisses the government of Balochistan, and he has said so."
 COLDWAR_PAK_jui_m: "The Ulema in Office"
 COLDWAR_PAK_jui_m_desc: "Seminary graduates sit in the departments and the district offices. They are honest, and they are slow."
 COLDWAR_PAK_jui_c1: "Socialism Is No Sin"
 COLDWAR_PAK_jui_c1_desc: "We will not hand the poor to the Marxists. We ask only why the same mullahs who denounce socialism are so quiet about the landlord."
 COLDWAR_PAK_jui_c2: "The Fatwa Against Socialism"
 COLDWAR_PAK_jui_c2_desc: "A hundred and thirteen ulema have ruled: a system that denies property and God is not ours. The bazaar and the landlord are relieved."
 COLDWAR_PAK_jui_c1f: "The Poor Pashtun's Ulema"
 COLDWAR_PAK_jui_c1f_desc: "The clerics of the hill villages carry zakat to the tenant and a letter to the khan. Wells, seed and a small loan are our sermons."
 COLDWAR_PAK_jui_c2f: "The Clerical Bloc"
 COLDWAR_PAK_jui_c2f_desc: "The ulema of every school close ranks behind one list. The landlords, the traders and the Gulf donors know where they stand."
 COLDWAR_PAK_jui_z: "The Refugee Seminaries"
 COLDWAR_PAK_jui_z_desc: "Three million Afghans, and a seminary for every camp. The boys study the Quran, and the old men ask what the war will leave of their homes."
 COLDWAR_PAK_jui_cap: "The Deobandi Establishment"
 COLDWAR_PAK_jui_cap_desc: "The seminaries, the board and the party stand together. A generation of graduates now teaches, preaches and sits in the district councils."
 COLDWAR_PAK_tnfj_e: "The Shia Demands Committee"
 COLDWAR_PAK_tnfj_e_desc: "We ask for no Shia state. We ask that our fiqh be taught, our courts respected, and that no ordinance written by one school bind the others."
 COLDWAR_PAK_tnfj_x: "The Islamabad Convention"
 COLDWAR_PAK_tnfj_x_desc: "Tens of thousands come to Islamabad to say that the Zakat Ordinance must not bind the Shia. They will go home when the Secretariat answers."
 COLDWAR_PAK_tnfj_y: "Accommodation with the State"
 COLDWAR_PAK_tnfj_y_desc: "Mufti Sahib prefers a letter to the Chief Martial Law Administrator over a crowd at his gate. A quiet word may secure more than a long march."
 COLDWAR_PAK_tnfj_xf: "Exemption from Zakat"
 COLDWAR_PAK_tnfj_xf_desc: "Our community gives zakat by its own fiqh, to its own committees. A declaration at the bank is all we ask."
 COLDWAR_PAK_tnfj_yf: "Shia Seats in the Councils"
 COLDWAR_PAK_tnfj_yf_desc: "A Shia scholar on the Council of Islamic Ideology and one on the Shariat Court: not a privilege, but a voice where laws are weighed."
 COLDWAR_PAK_tnfj_m: "The Jafari Fiqh"
 COLDWAR_PAK_tnfj_m_desc: "Inheritance, marriage and worship judged by the school the parties follow. A uniform code for a plural nation is uniform only in name."
 COLDWAR_PAK_tnfj_z: "The Imambargah Network"
 COLDWAR_PAK_tnfj_z_desc: "From the Karachi imambargahs to the valleys of Gilgit, the trusts feed mourners, run dispensaries and keep the register of the community."
 COLDWAR_PAK_tnfj_cap: "Equal Citizens of the Faith"
 COLDWAR_PAK_tnfj_cap_desc: "Equal rights in law and in the schools, and equal protection in the street. No more and no less."
 COLDWAR_PAK_kho_e: "The Path of the Imam"
 COLDWAR_PAK_kho_e_desc: "The Imam in Tehran has shown that a mosque can topple a throne. Our young men look to Qom, and the generals look at them."
 COLDWAR_PAK_kho_x: "The Students of Qom"
 COLDWAR_PAK_kho_x_desc: "Hundreds of our students are enrolled at Qom and Najaf. They return with new books, new sermons and a very different view of the Shah's friends."
 COLDWAR_PAK_kho_y: "The Kurram Valley"
 COLDWAR_PAK_kho_y_desc: "Parachinar is the Shia heart of the tribal belt, a spear of valley pointing at Kabul. The Turi tribesmen will do their own politics."
 COLDWAR_PAK_kho_xf: "The Ayatollah's Envoy"
 COLDWAR_PAK_kho_xf_desc: "A letter from Qom names our scholar as the Imam's representative in Pakistan. Riyadh reads it, and so does the Interior Ministry."
 COLDWAR_PAK_kho_yf: "Defend Parachinar"
 COLDWAR_PAK_kho_yf_desc: "The council of elders asks the state for rifles, roads and a garrison. If the state refuses, the valley will not go undefended."
 COLDWAR_PAK_kho_m: "Guardianship of the Jurist"
 COLDWAR_PAK_kho_m_desc: "The rule of the jurist is a doctrine and not an export. In a Sunni majority state it must be argued, never imposed."
 COLDWAR_PAK_kho_z: "Friends in Tehran"
 COLDWAR_PAK_kho_z_desc: "A trade mission, a student exchange and a new bank branch in Mashhad. Tehran is a friend, and Riyadh is a patron to others at home."
 COLDWAR_PAK_kho_cap: "The Shia Political Voice"
 COLDWAR_PAK_kho_cap_desc: "Not a revolution but a voice: our community votes, marches and mourns as citizens. Our enemies hear only the first of those."
 COLDWAR_PAK_osal_r: "The Sectarian Pulpit"
 COLDWAR_PAK_osal_r_desc: "Some preachers want a state for their own sect alone. Their sermons fill streets as fast as any party."
 COLDWAR_PAK_osal_a: "Khatm-e-Nubuwwat"
 COLDWAR_PAK_osal_a_desc: "The finality of prophethood becomes a political cause against the Ahmadi minority."
 COLDWAR_PAK_osal_b: "The Punjab Sermons"
 COLDWAR_PAK_osal_b_desc: "In Jhang a preacher turns the poor against the Shia landlords. Sect and class become one quarrel."
 COLDWAR_PAK_osal_m: "The Militant Seminaries"
 COLDWAR_PAK_osal_m_desc: "Seminaries that teach the gun beside the book. Every government that uses them pays for them later."
 COLDWAR_PAK_ssp_e: "The Campus and the Pulpit"
 COLDWAR_PAK_ssp_e_desc: "Our students hold the campuses and our preachers hold the pulpits. The police files on both are thick, and the ministry is aware of it."
 COLDWAR_PAK_ssp_x: "The Khatm-e-Nubuwwat Committees"
 COLDWAR_PAK_ssp_x_desc: "The finality of prophethood is the oldest cause on our pulpits. Committees in every town demand that the law give it a name."
 COLDWAR_PAK_ssp_y: "The Jhang Pulpit"
 COLDWAR_PAK_ssp_y_desc: "In Jhang the landlords are Shia and the shopkeepers are Sunni. A preacher of fierce words finds a hearing there."
 COLDWAR_PAK_ssp_xf: "Ordinance XX of 1984"
 COLDWAR_PAK_ssp_xf_desc: "The ordinance bars the Ahmadis from calling themselves Muslims or using Islamic forms of worship. The mosques call it overdue, and the courts and the minority will count the cases."
 COLDWAR_PAK_ssp_yf: "Against the Landlords of Jhang"
 COLDWAR_PAK_ssp_yf_desc: "The big estates of Jhang pay little tax and send no sons to the army. The urban poor of the city listen to anyone who names them."
 COLDWAR_PAK_ssp_m: "The Sunni State Demand"
 COLDWAR_PAK_ssp_m_desc: "We say Pakistan was won by the Sunni majority and must carry its law. The ministry and the courts answer that no school can govern the rest."
 COLDWAR_PAK_ssp_z: "The Seminaries of the Frontier"
 COLDWAR_PAK_ssp_z_desc: "Gulf donors pay for hundreds of seminaries from Jhang to the Frontier. The graduates are literate and ill employed, and some are very angry."
 COLDWAR_PAK_ssp_cap: "The Sunni Pakistan Project"
 COLDWAR_PAK_ssp_cap_desc: "The project is complete on paper, and the mosque is divided. Every district now keeps a register of processions, a list of preachers and a police picket."
 COLDWAR_PAK_stem_s0: "The Year of the Ballot"
 COLDWAR_PAK_stem_s0_desc: "Martial law has ruled Pakistan since March 1969, yet General Yahya has promised the first direct national election in our history. From Dacca to Peshawar every party is already counting seats."
 COLDWAR_PAK_stem_s1a: "The Legal Framework Order"
 COLDWAR_PAK_stem_s1a_desc: "The order fixes the rules before the vote: seats by population, 120 days to write a constitution, and the President's right to reject it."
 COLDWAR_PAK_stem_s1b: "Dissolve One Unit"
 COLDWAR_PAK_stem_s1b_desc: "One Unit made Punjab the master of West Pakistan. Sindh, the Frontier and Balochistan want their names back."
 COLDWAR_PAK_stem_s1c: "One Man, One Vote"
 COLDWAR_PAK_stem_s1c_desc: "For the first time every adult Pakistani votes directly for the National Assembly. No Basic Democrats stand between the people and the ballot."
 COLDWAR_PAK_stem_s2: "The National Assembly Convenes"
 COLDWAR_PAK_stem_s2_desc: "Three hundred and thirteen members, a majority from the East, and a constitution to write in 120 days. Whoever controls this hall controls Pakistan."
 COLDWAR_PAK_stem_s3a: "Transfer of Power"
 COLDWAR_PAK_stem_s3a_desc: "The generals hand the country back to its elected representatives. The barracks will not forget what they gave up."
 COLDWAR_PAK_stem_s3b: "The Generals Stay"
 COLDWAR_PAK_stem_s3b_desc: "The army postpones the transfer. Order first, politicians later, if ever."
 COLDWAR_PAK_stem_s4a: "The Constitution of 1973"
 COLDWAR_PAK_stem_s4a_desc: "A federal parliamentary republic, Islam the state religion, a Senate for the provinces. For once the government and the opposition signed the same document."
 COLDWAR_PAK_stem_s4b: "The Provisional Constitutional Order"
 COLDWAR_PAK_stem_s4b_desc: "The judges swear a new oath or go home. The generals now rule by an order instead of by a decree."
 COLDWAR_PAK_on_r: "The Ideology of Pakistan"
 COLDWAR_PAK_on_r_desc: "One nation, one faith, one army: the ideology the state has taught since Jinnah."
 COLDWAR_PAK_on_a: "The Steel Frame"
 COLDWAR_PAK_on_a_desc: "The army and the civil service held the country together when the politicians failed."
 COLDWAR_PAK_on_b: "Joy Bangla"
 COLDWAR_PAK_on_b_desc: "Victory to Bengal: the cry of the Six Points movement from Dacca to Chittagong."
 COLDWAR_PAK_on_m: "The Nation Above Parties"
 COLDWAR_PAK_on_m_desc: "The nation comes before any party, and whoever speaks for the nation may silence the parties."
 COLDWAR_PAK_army_ghq: "The General Headquarters"
 COLDWAR_PAK_army_ghq_desc: "The country's business now passes through GHQ at Rawalpindi. The army has ruled before and knows both what it earns and what it costs."
 COLDWAR_PAK_army_nur_l: "The Airman Reformer"
 COLDWAR_PAK_army_nur_l_desc: "The man who made PIA fly and led the air force through 1965 now holds the whole state. The army accepts him for the moment, and watches the line items."
 COLDWAR_PAK_army_gul_l: "The Professional Army"
 COLDWAR_PAK_army_gul_l_desc: "A staff officer of the old school takes over the headquarters. He wants an army that fights well, obeys the law and does not run the country."
 COLDWAR_PAK_army_yah_l: "Yahya's Martial Law"
 COLDWAR_PAK_army_yah_l_desc: "The Commander in Chief is now also President and Chief Martial Law Administrator. He promises a return to the barracks after an election, and for the moment the army is willing to wait."
 COLDWAR_PAK_army_tik_l: "The Hard Hand"
 COLDWAR_PAK_army_tik_l_desc: "The general who commanded in the East in 1971 and led the army in the 1970s takes the headquarters. His answer to disorder is simple, and not everyone will like it."
 COLDWAR_PAK_army_zia_l: "Operation Fair Play"
 COLDWAR_PAK_army_zia_l_desc: "On the night of the fourth of July the army moves, the Prime Minister is taken into protective custody and elections are promised within ninety days. We are told it is a pause and not a rupture."
 COLDWAR_PAK_army_nur_t: "The Reform Junta"
 COLDWAR_PAK_army_nur_t_desc: "A small council of soldiers, airmen and engineers sits down to cut waste and set priorities. Nobody in the services is happy about their line items."
 COLDWAR_PAK_army_gul_t: "Back to the Barracks"
 COLDWAR_PAK_army_gul_t_desc: "Regiments return to their garrisons from the district offices and polling stations. The soldier's task is the frontier, and not the tehsil."
 COLDWAR_PAK_army_yah_t: "The Council of Administration"
 COLDWAR_PAK_army_yah_t_desc: "A handful of soldiers and civilian advisers meet at Rawalpindi and decide what the ministries will do. Three hundred officers of the civil service have already been told to go."
 COLDWAR_PAK_army_tik_t: "Martial Law Zones"
 COLDWAR_PAK_army_tik_t_desc: "The country is divided into zones, each under a commander who may close a newspaper or a road. Order first, and the accounts afterwards."
 COLDWAR_PAK_army_zia_pol: "Islamisation from Above"
 COLDWAR_PAK_army_zia_pol_desc: "General Zia declares that the republic will be run according to the Quran and the Sunna. The Council of Islamic Ideology is to draft the laws, and the ulema see a chance they have not had in thirty years."
 COLDWAR_PAK_army_zia_eco: "Denationalise the Mills"
 COLDWAR_PAK_army_zia_eco_desc: "Rice mills, cotton gins and flour mills go back to their owners. The state may regulate, but should not run a flour mill."
 COLDWAR_PAK_army_nur_p1: "The Education Policy of 1969"
 COLDWAR_PAK_army_nur_p1_desc: "Free primary schools, a national curriculum and technical colleges for the provinces. A nation that cannot read cannot choose its own future."
 COLDWAR_PAK_army_nur_p2: "Clean Hands"
 COLDWAR_PAK_army_nur_p2_desc: "A rule for every contract and every posting: gifts are entered in a register, files are numbered, and a clerk who sells a signature loses his pension."
 COLDWAR_PAK_army_gul_p1: "Officers Out of Politics"
 COLDWAR_PAK_army_gul_p1_desc: "Every serving officer posted to a civil department goes back to his unit by the end of the year. The army will advise the government but not run it."
 COLDWAR_PAK_army_gul_p2: "The Army as Arbiter"
 COLDWAR_PAK_army_gul_p2_desc: "The army will not govern, but it will decide who may. The Corps Commanders keep a standing right to veto any order that threatens the unity of the country."
 COLDWAR_PAK_army_yah_p1: "Honest Elections"
 COLDWAR_PAK_army_yah_p1_desc: "An independent Election Commission, no funds from the Council and no thumb on the scale. If the voters choose strangers to the barracks, the barracks must accept it."
 COLDWAR_PAK_army_yah_p2: "Manage the Results"
 COLDWAR_PAK_army_yah_p2_desc: "Our staff officers know which candidates are friendly. Money and advice reach them quietly, so that no single party can command the Assembly alone."
 COLDWAR_PAK_army_tik_p1: "Pacify Balochistan"
 COLDWAR_PAK_army_tik_p1_desc: "The provincial government has lost our confidence, and the hills are arming. We will send the divisions before the quarrel becomes a war."
 COLDWAR_PAK_army_tik_p2: "Hold the East by Force"
 COLDWAR_PAK_army_tik_p2_desc: "No majority in a hall in Dacca will break the country while we command in the East. The garrisons stay and the tax collectors escorted."
 COLDWAR_PAK_army_zia_p1: "The Hudood Ordinances"
 COLDWAR_PAK_army_zia_p1_desc: "Four ordinances replace the colonial penal code in matters of theft, adultery, false accusation and drink. The ulema are satisfied and the lawyers are not."
 COLDWAR_PAK_army_zia_p2: "The Federal Shariat Court"
 COLDWAR_PAK_army_zia_p2_desc: "A bench of Muslim judges may strike down any law repugnant to the injunctions of Islam. Parliament will not be the only judge of what the nation may do."
 COLDWAR_PAK_army_zia_e1: "The Zakat Ordinance"
 COLDWAR_PAK_army_zia_e1_desc: "The state collects zakat from the bank accounts and ushr from the harvest, and gives to the poor through local committees. Charity becomes a duty of the treasury."
 COLDWAR_PAK_army_zia_e2: "Interest-Free Counters"
 COLDWAR_PAK_army_zia_e2_desc: "Banks open counters where savers share in profit and loss instead of earning interest. Whether it is cheaper or dearer is for the next budget to say."
 COLDWAR_PAK_army_nur_p1f: "Universities for the Provinces"
 COLDWAR_PAK_army_nur_p1f_desc: "Quetta and Peshawar get campuses of their own, so that a Baloch or Pukhtun student need not travel to Lahore to learn physics. The funds come out of the development budget."
 COLDWAR_PAK_army_nur_p2f: "Screen the Civil Service"
 COLDWAR_PAK_army_nur_p2f_desc: "Every officer is screened by a board of three: his files, his property and his reputation in the district. Those who pass keep their rank, and those who fail are told why."
 COLDWAR_PAK_army_gul_p1f: "The Staff College Reforms"
 COLDWAR_PAK_army_gul_p1f_desc: "Majors learn logistics and colonels learn the law. Quetta's staff college gets new chairs, a new library and a new syllabus."
 COLDWAR_PAK_army_gul_p2f: "The Corps Commanders' Council"
 COLDWAR_PAK_army_gul_p2f_desc: "The corps commanders sit with the Commander in Chief, and nothing of importance leaves Rawalpindi without their assent."
 COLDWAR_PAK_army_yah_p1f: "The Assembly Will Meet"
 COLDWAR_PAK_army_yah_p1f_desc: "The summons goes out, the committee rooms are booked and the draftsmen are told the constitution must be ready in 120 days. After eleven years, a date."
 COLDWAR_PAK_army_yah_p2f: "The National Security Council"
 COLDWAR_PAK_army_yah_p2f_desc: "Maj. Gen. Ghulam Umar's secretariat keeps a file on every politician and a fund for every purpose. It never appears in the budget and never needs to."
 COLDWAR_PAK_army_tik_p1f: "The Kohlu Operations"
 COLDWAR_PAK_army_tik_p1f_desc: "Two divisions, helicopters lent by Tehran and a post at every pass. The Marri and Mengal hills are to be cleared of armed bands."
 COLDWAR_PAK_army_tik_p2f: "Eastern Command at Dacca"
 COLDWAR_PAK_army_tik_p2f_desc: "A full corps in Dacca and Chittagong, with its own signals and engineers. The East will see the flag every day."
 COLDWAR_PAK_army_zia_pm: "The Majlis-e-Shoora"
 COLDWAR_PAK_army_zia_pm_desc: "A house of nominated members, chosen for piety and experience, advises the President. It debates, it does not decide."
 COLDWAR_PAK_army_zia_em: "The Gulf Remittances"
 COLDWAR_PAK_army_zia_em_desc: "Masons from Gujranwala and drivers from Mardan send money home from the Gulf. Every village has a radio, a television and a new roof."
 COLDWAR_PAK_army_nur_ec: "Technocrats at the Planning Commission"
 COLDWAR_PAK_army_nur_ec_desc: "Economists, engineers and statisticians take the licensing files out of the ministers' hands. A permit should follow a plan, and not a telephone call."
 COLDWAR_PAK_army_gul_ec: "Fauji Foundation Enterprises"
 COLDWAR_PAK_army_gul_ec_desc: "The welfare foundation of the ex servicemen already owns mills and sugar estates. Let its profits pay for the soldiers' pensions and for fertiliser."
 COLDWAR_PAK_army_yah_ec: "The Fourth Five-Year Plan"
 COLDWAR_PAK_army_yah_ec_desc: "The plan for 1970 to 1975 promises growth near six percent and a narrower gap between the wings. The Planning Commission is drawing the tables, and every province wants its share."
 COLDWAR_PAK_army_tik_ec: "The Garrison Economy"
 COLDWAR_PAK_army_tik_ec_desc: "Roads, depots and cantonments are laid by the army and paid for by the army. The civil economy can follow the supply columns."
 COLDWAR_PAK_army_zia_q1: "Partyless Elections"
 COLDWAR_PAK_army_zia_q1_desc: "A referendum on the Islamic system, then elections without party labels. Candidates stand as individuals, and the clans return their own."
 COLDWAR_PAK_army_zia_q2: "Martial Law Without End"
 COLDWAR_PAK_army_zia_q2_desc: "The Assembly is not yet worthy of the country, and we keep the order that works. The promise of the ninety days is a story for another year."
 COLDWAR_PAK_army_zia_af: "The Afghan Cell"
 COLDWAR_PAK_army_zia_af_desc: "The ISI opens an Afghan bureau in Rawalpindi. Refugee camps fill the Frontier, and the border is no longer quiet."
 COLDWAR_PAK_army_nur_e1: "Export-Led Growth"
 COLDWAR_PAK_army_nur_e1_desc: "Cotton, yarn and leather earn the foreign exchange for everything else. The mills of Karachi get credit and a free hand, and the shops at home pay the price of world markets."
 COLDWAR_PAK_army_nur_e2: "Basic Needs First"
 COLDWAR_PAK_army_nur_e2_desc: "Flour, cloth, a roof and a clinic come before the balance of payments. Mill hands get a share in the profit, and the villages get tubewells."
 COLDWAR_PAK_army_gul_e1: "Military Industry at Wah"
 COLDWAR_PAK_army_gul_e1_desc: "The Ordnance Factories at Wah turn out rifles and shells. A second line for engines and radios would give the army its own supplies, whatever the embargo says."
 COLDWAR_PAK_army_gul_e2: "Civilian Contractors"
 COLDWAR_PAK_army_gul_e2_desc: "Let the mill owners bid for the army's orders in the open, against each other. Contracts get cheaper, and the generals stop running businesses."
 COLDWAR_PAK_army_yah_e1: "The Labour Policy of 1969"
 COLDWAR_PAK_army_yah_e1_desc: "Minimum wages, a share of profit for the mill hand, a union that may stand beside the manager. The strikes of 1969 taught the mill owners that the street is also a power."
 COLDWAR_PAK_army_yah_e2: "Business as Usual"
 COLDWAR_PAK_army_yah_e2_desc: "The Twenty-Two Families built our industry and know how to run it. Why disturb what earns foreign exchange when there is an election to hold?"
 COLDWAR_PAK_army_tik_e1: "Defence Before Development"
 COLDWAR_PAK_army_tik_e1_desc: "Tanks first, tubewells second. The budget speaks for the army, and the farmer is asked to wait for the next plan."
 COLDWAR_PAK_army_tik_e2: "The Frontier Works Organisation"
 COLDWAR_PAK_army_tik_e2_desc: "Army engineers lay the road to China through the Karakoram. The same battalions will build anything else we ask them to."
 COLDWAR_PAK_army_zia_qm: "The Eighth Amendment"
 COLDWAR_PAK_army_zia_qm_desc: "Whatever house sits, it must indemnify every martial law order and give the President the power to dismiss it. The rest of the constitution may be revived."
 COLDWAR_PAK_army_zia_f1: "The Pipeline"
 COLDWAR_PAK_army_zia_f1_desc: "American dollars and Saudi riyals buy rifles, rockets and Stinger missiles for the seven parties in Peshawar. The ISI is the only door, and we hold the key."
 COLDWAR_PAK_army_zia_f2: "Strategic Depth"
 COLDWAR_PAK_army_zia_f2_desc: "A friendly government in Kabul would end our fear of a war on two fronts. We must choose our friends among the commanders with care."
 COLDWAR_PAK_army_nur_cap: "The Modernising Junta"
 COLDWAR_PAK_army_nur_cap_desc: "The airman who rebuilt PIA and the air force now turns his managers on the whole state: schools, airlines, squadrons and clean files from one office."
 COLDWAR_PAK_army_gul_cap: "The Army of the Republic"
 COLDWAR_PAK_army_gul_cap_desc: "A smaller, better trained army that answers to the constitution and not to a man. Nobody should have to ask again whose army this is."
 COLDWAR_PAK_army_yah_cap: "The Barracks Pledge"
 COLDWAR_PAK_army_yah_cap_desc: "The Commander in Chief gave his word on the radio that the army would return to its duty after the ballot. That word is now the standard by which every general will be measured."
 COLDWAR_PAK_army_tik_cap: "Order at Any Price"
 COLDWAR_PAK_army_tik_cap_desc: "No strike, no march, no separatist pamphlet. The cost is plain in the courts and the jails and the foreign press, but the roads are open and the cantonments are calm."
 COLDWAR_PAK_army_zia_cap: "The Soldier of Islam"
 COLDWAR_PAK_army_zia_cap_desc: "An army that has fought in Afghanistan, a code of law that is Islamic and a house that obeys the President. His successors will have to decide how much of it to keep."
 COLDWAR_PAK_al_e: "The Awami League Government"
 COLDWAR_PAK_al_e_desc: "A hundred and sixty of the 162 seats in the East, 167 of 313 in the House: the Six Points were on every poster and the people answered. Now Bangabandhu must govern all of Pakistan."
 COLDWAR_PAK_al_pol: "Bangabandhu"
 COLDWAR_PAK_al_pol_desc: "The people of Bengal named him Bangabandhu, Friend of Bengal, at the Dacca racecourse in 1969. After the Agartala case he is the one man a Bengali farmer and a Rawalpindi general both have to deal with."
 COLDWAR_PAK_al_eco: "The Six Points Economy"
 COLDWAR_PAK_al_eco_desc: "Tajuddin Ahmad takes the Finance Ministry with one idea: the taxes and the foreign exchange of Bengal must work for Bengal first. The centre keeps defence and foreign affairs, and a fair share of the revenue."
 COLDWAR_PAK_al_a1: "Prime Minister of All Pakistan"
 COLDWAR_PAK_al_a1_desc: "Our leader takes the oath in Islamabad and sits at the head of a cabinet with ministers from Lahore, Karachi and Peshawar. The East has the Prime Minister, and the West must accept a Bengali as head of government."
 COLDWAR_PAK_al_a2: "Dacca First"
 COLDWAR_PAK_al_a2_desc: "Cabinet, budget and Assembly sit in Dacca for half of every year. The hall Louis Kahn is designing at Sher-e-Bangla Nagar finally has a reason to be finished."
 COLDWAR_PAK_al_b1: "Two Economies"
 COLDWAR_PAK_al_b1_desc: "1,600 km apart and two economies in fact: one earns the dollars in jute, the other spends them. Separate foreign exchange accounts let the East spend what the East earns."
 COLDWAR_PAK_al_b2: "One Market, Fair Shares"
 COLDWAR_PAK_al_b2_desc: "One currency, but with a reserve bank in each wing, so that Bengal's savings cannot flow west by the back door. One market, and a fair share of the plan for each."
 COLDWAR_PAK_al_a1f: "Bengalis in the Army"
 COLDWAR_PAK_al_a1f_desc: "The East holds 54 percent of the people and a very small share of the officers. We open Kakul and the East Bengal Regiment to a province that was told it was not martial."
 COLDWAR_PAK_al_a2f: "The East Pakistan Rifles"
 COLDWAR_PAK_al_a2f_desc: "Point six of the programme: a militia or paramilitary force for the East. The Rifles already guard the border, and under provincial control they will also keep the peace."
 COLDWAR_PAK_al_b1f: "Jute for Bengal"
 COLDWAR_PAK_al_b1f_desc: "Adamjee Jute Mills at Narayanganj is the largest in the world, and its owners live in Karachi. The jute board, the exports and the profit should have a Dacca address."
 COLDWAR_PAK_al_b2f: "Abolish Jagirdari and Sardari"
 COLDWAR_PAK_al_b2f_desc: "The manifesto promised to end zamindari, jagirdari and sardari and to excuse the small farmer from land tax up to 25 bighas. The wadera in Sindh and the sardar in Balochistan have noted the date."
 COLDWAR_PAK_al_pm: "The Federal Parliament"
 COLDWAR_PAK_al_pm_desc: "Kamal Hossain's draft is on the table: a parliamentary federation, direct election, an independent judiciary and the Lahore Resolution of 1940 as its preamble. We have 120 days."
 COLDWAR_PAK_al_em: "Embankments and Cyclone Shelters"
 COLDWAR_PAK_al_em_desc: "The cyclone of 12 November killed hundreds of thousands in the delta while the capital watched. Never again: earth embankments, concrete shelters and a warning system for every polder."
 COLDWAR_PAK_al_c1: "A Secular Republic"
 COLDWAR_PAK_al_c1_desc: "Muslim, Hindu, Buddhist and Christian vote on one roll and stand equal before the law. Faith belongs to the mosque and the temple, not to the ministry."
 COLDWAR_PAK_al_c2: "The Islamic Republic Kept"
 COLDWAR_PAK_al_c2_desc: "No law repugnant to the Quran and the Sunnah, and the state stays an Islamic Republic. Our party was never against the faith, and we will say so in the constitution."
 COLDWAR_PAK_al_d1: "Friendship with India"
 COLDWAR_PAK_al_d1_desc: "Calcutta is two hours from Dacca and the Ganges does not recognise a frontier. We talk about water, trade and the railway lines before we talk about Kashmir."
 COLDWAR_PAK_al_d2: "Between the Blocs"
 COLDWAR_PAK_al_d2_desc: "We are a poor country on the Bay of Bengal with seventy million mouths to feed. Our friends are whoever buys our jute and lends on fair terms, in Washington, Moscow or Peking."
 COLDWAR_PAK_al_cm: "The Rule of Law"
 COLDWAR_PAK_al_cm_desc: "The rules that jailed Bangabandhu are repealed. Judges are free, the press is free, and no citizen is held without charge."
 COLDWAR_PAK_al_dm: "Peace in South Asia"
 COLDWAR_PAK_al_dm_desc: "A federation at peace with its neighbours can spend on schools. We offer trade, water and talks to Delhi, Kathmandu and Colombo, and ask the army to hold the line, not to extend it."
 COLDWAR_PAK_al_cap: "Golden Bengal in a Federal Pakistan"
 COLDWAR_PAK_al_cap_desc: "Sonar Bangla inside a Pakistan that works for both wings: the rivers tamed, the jute fairly sold, the schools open. It is the country the Lahore Resolution promised."
 COLDWAR_PAK_ben_r: "The Bengal Question"
 COLDWAR_PAK_ben_r_desc: "The Assembly is summoned, a majority of its members speak Bengali, and a constitution must be framed in 120 days. Dacca wants autonomy and Rawalpindi wants a veto. The question will not wait."
 COLDWAR_PAK_ben_m: "Honour the Mandate"
 COLDWAR_PAK_ben_m_desc: "The party that won the election forms the government. The Six Points become the basis of a federation, and the East keeps its taxes, its foreign exchange and its militia."
 COLDWAR_PAK_ben_c: "The Constitutional Bargain"
 COLDWAR_PAK_ben_c_desc: "The LFO gives the President the last word and the Six Points give the provinces the first. A bargain over both lets the President keep his chair and the majority party keep its mandate, if each can sell it at home."
 COLDWAR_PAK_ben_s: "Operation Searchlight"
 COLDWAR_PAK_ben_s_desc: "Talks are over. The army moves to restore order in the East, the Awami League is banned and its leaders are arrested or flee. Whatever order returns, the cost to the unity of the country will be counted for years."
 COLDWAR_PAK_ben_g: "Let Them Go"
 COLDWAR_PAK_ben_g_desc: "We cannot hold 1,600 km of India against the will of its people, and we should not try. If the East wants its own flag, let it be settled by treaty and not by war."
 COLDWAR_PAK_ben_m2: "Mujib in Islamabad"
 COLDWAR_PAK_ben_m2_desc: "Bangabandhu takes the oath as Prime Minister before the President, with a cabinet from every province. It is the first time the head of government is chosen by the votes of the whole people."
 COLDWAR_PAK_ben_c2: "The Dacca Round Table"
 COLDWAR_PAK_ben_c2_desc: "The President, Mujib, Bhutto, Wali Khan and the rest at one table in Dacca. Ayub tried it in Rawalpindi in 1969 without the Six Points. This time the agenda is the Six Points."
 COLDWAR_PAK_ben_s2: "Martial Law in Dacca"
 COLDWAR_PAK_ben_s2_desc: "Martial law returns to the East: curfews in Dacca and Chittagong, a civilian governor on paper and a general in fact. Every village that loses its harvest to the fighting will remember who ordered it."
 COLDWAR_PAK_ben_g2: "The Partition Commission"
 COLDWAR_PAK_ben_g2_desc: "Who owns the reserves, the ships, the debts and the jute stocks of the old country? A commission with a chairman from a neutral state will count it line by line."
 COLDWAR_PAK_ben_m3: "The Six Points Federation"
 COLDWAR_PAK_ben_m3_desc: "The centre keeps defence, foreign affairs and a fair share of the revenue. Everything else belongs to the provinces, and the East has its own accounts and its own rifles."
 COLDWAR_PAK_ben_c3: "The Provincial Autonomy Act"
 COLDWAR_PAK_ben_c3_desc: "A fixed share of revenue for the centre, provincial control of trade and a joint command for the Rifles. Neither wing gets all of what it asked for, and both can live with it."
 COLDWAR_PAK_ben_s3: "The Dacca Garrison"
 COLDWAR_PAK_ben_s3_desc: "Three understrength divisions, one squadron of Sabres and a few gunboats must hold a province 1,600 km from the nearest reserve. Command and supply are the real campaign, not the first operation."
 COLDWAR_PAK_ben_g3: "Two Nations, Two States"
 COLDWAR_PAK_ben_g3_desc: "Two states, two flags, two embassies, one history. We exchange High Commissioners, open the border to trade, and speak of each other with respect."
 COLDWAR_PAK_ben_end: "The Stranded Pakistanis"
 COLDWAR_PAK_ben_end_desc: "Hundreds of thousands of Urdu speakers came to the East in 1947 and now ask which country is theirs. We owe them a passport, a roof and a promise, whichever way the union went."
 COLDWAR_PAK_nuc_r: "The Bomb or the Bread"
 COLDWAR_PAK_nuc_r_desc: "If India builds the bomb, we will eat grass or leaves, even go hungry, but we will get one of our own. Every government since has had to decide whether it meant those words."
 COLDWAR_PAK_nuc_g: "We Will Eat Grass"
 COLDWAR_PAK_nuc_g_desc: "Whatever the price, the nation will have the bomb. Ministers will find the money, scientists the way, and the people the patience."
 COLDWAR_PAK_nuc_b: "Bread Before Bombs"
 COLDWAR_PAK_nuc_b_desc: "A bomb feeds no child and irrigates no field. Pakistan will build dams and mills first, and trust diplomacy with India."
 COLDWAR_PAK_nuc_mul: "The Multan Meeting"
 COLDWAR_PAK_nuc_mul_desc: "In a garden in Multan the President asks the scientists how long. Three years, they answer, and he raises three fingers."
 COLDWAR_PAK_nuc_atm: "Atoms for Peace"
 COLDWAR_PAK_nuc_atm_desc: "The Karachi plant gives the city electricity from Canadian heavy water. Peaceful atoms, under international eyes."
 COLDWAR_PAK_nuc_con: "The Consortium Bargain"
 COLDWAR_PAK_nuc_con_desc: "The World Bank and the donors will lend again, if we devalue, cut subsidies and keep our hands off the atom."
 COLDWAR_PAK_nuc_sup: "SUPARCO and the Rockets"
 COLDWAR_PAK_nuc_sup_desc: "The space research commission launched rockets from Sonmiani in 1962. Its engineers can do more than weather studies."
 COLDWAR_PAK_nuc_pu: "The Plutonium Route"
 COLDWAR_PAK_nuc_pu_desc: "A French reprocessing plant can separate plutonium from our reactors' fuel under one contract. Fast, cheap, and in plain sight."
 COLDWAR_PAK_nuc_u: "The Uranium Route"
 COLDWAR_PAK_nuc_u_desc: "Centrifuges built from stolen drawings and bought parts. Slow and costly, but no foreign government can switch them off."
 COLDWAR_PAK_nuc_saf: "Safeguards and Inspectors"
 COLDWAR_PAK_nuc_saf_desc: "Every gram counted, every room open to the IAEA. Suppliers trust a country that hides nothing."
 COLDWAR_PAK_nuc_dam: "Water Before Industry"
 COLDWAR_PAK_nuc_dam_desc: "The Indus feeds Pakistan. Canals, tubewells and drainage first; factories can wait for the harvest."
 COLDWAR_PAK_nuc_fac: "Industry Before Water"
 COLDWAR_PAK_nuc_fac_desc: "Karachi's mills earn the foreign exchange that buys everything else."
 COLDWAR_PAK_nuc_hat: "The Hatf Programme"
 COLDWAR_PAK_nuc_hat_desc: "A bomb needs a road to its target. Short-range rockets first, then something that reaches Delhi."
 COLDWAR_PAK_nuc_fr: "The French Reprocessing Plant"
 COLDWAR_PAK_nuc_fr_desc: "The plant rises at Chashma under French engineers and IAEA cameras. Every visitor from Washington asks about it."
 COLDWAR_PAK_nuc_p706: "Project-706"
 COLDWAR_PAK_nuc_p706_desc: "A code number, a budget nobody audits, and an engineer who answers to the Prime Minister alone."
 COLDWAR_PAK_nuc_nfz: "A Nuclear-Free South Asia"
 COLDWAR_PAK_nuc_nfz_desc: "We proposed it at the UN in 1974. If India signs, the arms race ends before it begins."
 COLDWAR_PAK_nuc_tar: "Tarbela Comes Online"
 COLDWAR_PAK_nuc_tar_desc: "The largest earth-filled dam in the world finally holds. Water for Punjab, power for the grid."
 COLDWAR_PAK_nuc_epz: "The Karachi Export Processing Zone"
 COLDWAR_PAK_nuc_epz_desc: "A fenced zone at Landhi where foreign firms pay no duty and hire Pakistani hands."
 COLDWAR_PAK_nuc_ch: "Chashma"
 COLDWAR_PAK_nuc_ch_desc: "If the French leave, the half-built plant is still ours, and so is what our engineers learned."
 COLDWAR_PAK_nuc_kah: "Engineering Research Laboratories"
 COLDWAR_PAK_nuc_kah_desc: "Kahuta, in the hills near the capital. The laboratories are guarded better than the President."
 COLDWAR_PAK_nuc_pd: "The Peace Dividend"
 COLDWAR_PAK_nuc_pd_desc: "Every rupee not spent on the border is a rupee for a school or a canal."
 COLDWAR_PAK_nuc_gr2: "Green Revolution II"
 COLDWAR_PAK_nuc_gr2_desc: "New seed, fertiliser and tubewells, now for the small farmer as well as the big one."
 COLDWAR_PAK_nuc_tex: "Textiles for the World"
 COLDWAR_PAK_nuc_tex_desc: "Cotton grows in Punjab and Sindh. Spin it, weave it, sew it and sell it, instead of exporting raw bales."
 COLDWAR_PAK_nuc_net: "The Procurement Network"
 COLDWAR_PAK_nuc_net_desc: "Inverters from Britain, valves from Switzerland, steel from Germany, ordered through firms in Dubai."
 COLDWAR_PAK_nuc_bcap: "The Development State"
 COLDWAR_PAK_nuc_bcap_desc: "Dams, mills, exports and schools: the bread has been baked. The generals still count the tanks India has."
 COLDWAR_PAK_nuc_kir: "The Kirana Cold Tests"
 COLDWAR_PAK_nuc_kir_desc: "A device without its core, tested in a tunnel in the Kirana hills. It works, and the world does not need to know yet."
 COLDWAR_PAK_nuc_amb: "Strategic Ambiguity"
 COLDWAR_PAK_nuc_amb_desc: "We neither confirm nor deny. Washington can certify that we have no bomb, and New Delhi can never be sure."
 COLDWAR_PAK_nuc_dec: "Declare the Bomb"
 COLDWAR_PAK_nuc_dec_desc: "Let the world know. A declared deterrent is the only one India must respect."
 COLDWAR_PAK_eco_r: "The Planning Commission"
 COLDWAR_PAK_eco_r_desc: "A few economists in Karachi draw up the plans that every ministry must follow. We give them a clear mandate and a longer reach, and we will see which chain of the economy should run first."
 COLDWAR_PAK_eco_c0_0: "Sui Gas for the Nation"
 COLDWAR_PAK_eco_c0_0_desc: "Under the dunes of Sui lies the largest gas field in the country. A pipe to Karachi and Lahore turns it into fuel for every mill and kitchen."
 COLDWAR_PAK_eco_c1_0: "The National Fertilizer Corporation"
 COLDWAR_PAK_eco_c1_0_desc: "Urea made from Sui gas, sold at a fixed price to every farmer who asks. One corporation runs the state plants and answers for the harvest."
 COLDWAR_PAK_eco_c2_0: "SCARP Tubewells"
 COLDWAR_PAK_eco_c2_0_desc: "Salt rises where the water stands. Public tubewells pump the water table down and flush the salt away, and the canal colonies live again."
 COLDWAR_PAK_eco_c3_0: "The Overseas Employment Corporation"
 COLDWAR_PAK_eco_c3_0_desc: "Since the oil price of 1973 the Gulf needs hands for its cities. We register the workers, license the agents and make the passage legal."
 COLDWAR_PAK_eco_c4_0: "Port Qasim"
 COLDWAR_PAK_eco_c4_0_desc: "Karachi's harbour is full. A second deep water port at Bin Qasim will take the steel, the grain and the containers of a growing country."
 COLDWAR_PAK_eco_c0_1a: "Gas for Industry"
 COLDWAR_PAK_eco_c0_1a_desc: "Gas first for the fertiliser plants, the mill boilers and the power stations. The chimneys of Karachi and Lyallpur will run on Sui, the kitchens come later."
 COLDWAR_PAK_eco_c0_1b: "Gas for Homes"
 COLDWAR_PAK_eco_c0_1b_desc: "A gas flame in every town kitchen instead of dung cakes and wood: the first service of the state that every family notices. The mills will have to wait for their share."
 COLDWAR_PAK_eco_c1_1: "The Karachi Shipyard"
 COLDWAR_PAK_eco_c1_1_desc: "Hulls built at Karachi instead of bought in Europe: coasters, tankers and patrol vessels. A seafaring nation without a yard remains a customer."
 COLDWAR_PAK_eco_c2_1: "The Cotton Belt"
 COLDWAR_PAK_eco_c2_1_desc: "White fields from Multan to Sukkur feed every spindle in the country. We will protect the crop from its pests and sell it for what it is worth."
 COLDWAR_PAK_eco_c3_1a: "Export Our Workers"
 COLDWAR_PAK_eco_c3_1a_desc: "Every mason, driver and electrician who goes to Dubai sends home more than he could earn in a year here. We will let them go and open the door for the next thousand."
 COLDWAR_PAK_eco_c3_1b: "Keep the Skilled at Home"
 COLDWAR_PAK_eco_c3_1b_desc: "The engineer who leaves for Jeddah is a bridge we did not build at home. Better salaries and a place to work will keep the skilled in Pakistan, even if it costs the Gulf cheque."
 COLDWAR_PAK_eco_c4_1: "The Indus Highway"
 COLDWAR_PAK_eco_c4_1_desc: "A road from Karachi to Peshawar along the Indus that does not cross Lahore: the western side of the country gets its highway at last."
 COLDWAR_PAK_eco_c0_2: "The WAPDA Grid"
 COLDWAR_PAK_eco_c0_2_desc: "The Water and Power Development Authority runs the dams, the plants and the wires from Karachi to Peshawar. One authority, one grid, and one very large payroll."
 COLDWAR_PAK_eco_c1_2a: "Cement for the Dams"
 COLDWAR_PAK_eco_c1_2a_desc: "Tarbela, Mangla, canals, barrages and housing blocks all eat cement. We keep every bag at home and fix the price, and the dams are built first."
 COLDWAR_PAK_eco_c1_2b: "Cement for Export"
 COLDWAR_PAK_eco_c1_2b_desc: "The Gulf builds cities and pays in dollars. Our kilns have the limestone, and a ship from Karachi earns more than a bag sold at the controlled price."
 COLDWAR_PAK_eco_c2_2a: "Basmati for the Gulf"
 COLDWAR_PAK_eco_c2_2a_desc: "Long, fragrant grain from Kala Shah Kaku: the Gulf pays three times what the bazaar does. Wheat can be imported when it must be."
 COLDWAR_PAK_eco_c2_2b: "Wheat Self-Sufficiency"
 COLDWAR_PAK_eco_c2_2b_desc: "A country that must buy its bread abroad is a country with a price on its freedom. We will pay the farmer a guaranteed price and fill the silos at home."
 COLDWAR_PAK_eco_c3_2: "The Remittance Economy"
 COLDWAR_PAK_eco_c3_2_desc: "Every month the Gulf sends home more than our exports earn. The bazaars, the housing schemes and the household budget now depend on it."
 COLDWAR_PAK_eco_c4_2: "The Oil and Gas Development Corporation"
 COLDWAR_PAK_eco_c4_2_desc: "Since the oil price shock every barrel we pump ourselves is one we do not pay for in dollars. A state corporation will drill where the foreign firms did not."
 COLDWAR_PAK_eco_c0_3: "Electrify the Villages"
 COLDWAR_PAK_eco_c0_3_desc: "A bulb, a fan and an electric pump for the village: the wire reaches the places the road never did. The farmer who pumps by hand today will pump by switch tomorrow."
 COLDWAR_PAK_eco_c1_3: "The Machine Tool Factory"
 COLDWAR_PAK_eco_c1_3_desc: "Lathes, milling machines and presses made at home: a country that builds its own machine tools can build almost anything else. The factory at Landhi gives our mills their first native tools."
 COLDWAR_PAK_eco_c2_3: "The Agricultural Development Bank"
 COLDWAR_PAK_eco_c2_3_desc: "Credit for the tractor, the tubewell and the seed: one bank for the farmer. The loan officer decides who plants and who waits."
 COLDWAR_PAK_eco_c3_3: "The Allama Iqbal Open University"
 COLDWAR_PAK_eco_c3_3_desc: "A university with no walls: lessons by post, radio and television for the clerk, the housewife and the soldier. We teach the nation that has never seen a classroom."
 COLDWAR_PAK_mil_r: "The Defence Committee"
 COLDWAR_PAK_mil_r_desc: "After 1971 the army must be told what it is for and what the nation can pay. The service chiefs, the ministers and the finance secretary sit at one table, and the table decides."
 COLDWAR_PAK_mil_c0_0: "The China Divisions"
 COLDWAR_PAK_mil_c0_0_desc: "Washington cut us off in 1965, Peking did not. Type 59 tanks, field guns and spares arrive by road and sea, and whole divisions are reequipped."
 COLDWAR_PAK_mil_c1_0: "The Northern Areas"
 COLDWAR_PAK_mil_c1_0_desc: "Gilgit and Baltistan have no seat in any assembly, yet they guard the road to China. We will give the mountain valleys an administration and a road."
 COLDWAR_PAK_mil_c2_0: "The Pakistan Air Force"
 COLDWAR_PAK_mil_c2_0_desc: "We have fewer aircraft than India and more border to cover. The question for the air staff is where the next squadrons come from, and which of our friends will sell them."
 COLDWAR_PAK_mil_c3_0: "The Navy's Silent Service"
 COLDWAR_PAK_mil_c3_0_desc: "We cannot match the Indian carrier with surface ships. A handful of quiet boats makes the sea dangerous for it, and costs a fraction of the price."
 COLDWAR_PAK_mil_c4_0: "The Special Service Group"
 COLDWAR_PAK_mil_c4_0_desc: "The black berets of Cherat: an elite for the mountains, for sabotage and for the day a conventional army cannot act. Their instructors will train the rest of the army."
 COLDWAR_PAK_mil_c0_1a: "Hold the Line"
 COLDWAR_PAK_mil_c0_1a_desc: "Twice the plains of Punjab were our battlefield. Next time the border will be dug, wired and covered by canals before the first Indian tank arrives."
 COLDWAR_PAK_mil_c0_1b: "Riposte"
 COLDWAR_PAK_mil_c0_1b_desc: "The best defence is a counterstroke. We train our corps to strike across the border within days if India moves, and to be across the Ravi before the world can ask questions."
 COLDWAR_PAK_mil_c1_1: "The Northern Light Infantry"
 COLDWAR_PAK_mil_c1_1_desc: "The Gilgit Scouts and the Karakoram Scouts know every pass above 4,000 metres. We put them under one regiment, one badge and one pay scale."
 COLDWAR_PAK_mil_c2_1a: "The Shenyang Squadrons"
 COLDWAR_PAK_mil_c2_1a_desc: "The F-6 is a tough, simple fighter built in the thousands. Dozens of squadrons on a dozen airfields, instead of a few expensive wings."
 COLDWAR_PAK_mil_c2_1b: "The Mirage Wings"
 COLDWAR_PAK_mil_c2_1b_desc: "Mach 2 fighters from Dassault: fewer aircraft, but each one a match for anything India flies. The air staff will pay in francs, and in training."
 COLDWAR_PAK_mil_c3_1: "The Daphne Boats"
 COLDWAR_PAK_mil_c3_1_desc: "Three French boats, Hangor, Shushuk and Mangro, quiet enough to lie off Bombay. One order, and the navy has a weapon again."
 COLDWAR_PAK_mil_c4_1: "Pakistan Ordnance Factories Wah"
 COLDWAR_PAK_mil_c4_1_desc: "Rifles, shells and fuses from our own works: the army will have ammunition on the first day of the war and on the hundredth. Wah must grow to match it."
 COLDWAR_PAK_mil_c0_2: "The Heavy Rebuild Factory"
 COLDWAR_PAK_mil_c0_2_desc: "At Taxila our workshops overhaul and rebuild the tanks of the army. A tank that goes back into service is one we do not have to buy."
 COLDWAR_PAK_mil_c1_2: "The Siachen Glacier"
 COLDWAR_PAK_mil_c1_2_desc: "A glacier no one lives on, on a map line that nobody drew. We will hold the heights above the Saltoro or the Indians will hold them for us."
 COLDWAR_PAK_mil_c2_2: "The Kamra Aeronautical Complex"
 COLDWAR_PAK_mil_c2_2_desc: "Mirage and F-6 airframes can be overhauled in Pakistan, not shipped to Paris or Shenyang. A rebuild factory at Kamra turns a dependence into a skill."
 COLDWAR_PAK_mil_c3_2: "The Agosta Submarines"
 COLDWAR_PAK_mil_c3_2_desc: "The Agosta is quieter and its torpedoes reach further. The French will build two and train our crews in the same breath."
 COLDWAR_PAK_mil_c0_3: "Army Reserve South"
 COLDWAR_PAK_mil_c0_3_desc: "A second strategic reserve in the south, built around Multan, to protect the Indus plain or strike across the desert. One reserve in the north is not enough for a country this long."
 COLDWAR_PAK_mil_c2_3: "Falcons at Sargodha"
 COLDWAR_PAK_mil_c2_3_desc: "The F-16 Fighting Falcon, the best fighter we have ever flown. It comes from Washington with a bill and a string."
 COLDWAR_PAK_for_r: "The Foreign Office"
 COLDWAR_PAK_for_r_desc: "Pakistan has India on one flank, Afghanistan on another and the Gulf across the water. A country so placed cannot improvise: the Foreign Office keeps a file on every capital and a proposal ready for each."
 COLDWAR_PAK_for_c0_0: "Higher Than the Himalayas"
 COLDWAR_PAK_for_c0_0_desc: "Peking was the first great power to treat us as an equal and to settle a border without a shot. Our friendship with China is higher than the mountains between us and deeper than the sea."
 COLDWAR_PAK_for_c1_0: "The Kissinger Channel"
 COLDWAR_PAK_for_c1_0_desc: "Washington cannot talk to Peking, and Peking cannot talk to Washington. The President of Pakistan can talk to both. A quiet flight from Islamabad is all it takes to change the world."
 COLDWAR_PAK_for_c2_0: "Brothers in the Holy Land"
 COLDWAR_PAK_for_c2_0_desc: "Our officers train the Saudi army, and our brigades stand at Tabuk on the road to the Holy Places. The Kingdom's gratitude is worth more than any pact."
 COLDWAR_PAK_for_c3_0: "The Shah's Helicopters"
 COLDWAR_PAK_for_c3_0_desc: "Tehran fears a Baloch rising as much as we do. The Shah lends Cobra helicopters and credit; in return he asks only that the mountains stay ours."
 COLDWAR_PAK_for_c4_0: "The Karachi Steel Mill"
 COLDWAR_PAK_for_c4_0_desc: "Moscow offers what Washington refused: a steel mill for Karachi, designed and financed by the Soviet Union. A country without its own steel has no heavy industry at all."
 COLDWAR_PAK_for_c5_0a: "Settle the Durand Line"
 COLDWAR_PAK_for_c5_0a_desc: "Kabul has never accepted the line Durand drew in 1893. We offer a treaty of good neighbours and an end to the quarrel, in return for peace in the Frontier."
 COLDWAR_PAK_for_c5_0b: "Hekmatyar's Guests"
 COLDWAR_PAK_for_c5_0b_desc: "Daoud trains Pashtun rebels against us, so we house his Islamist enemies in Peshawar. It is cheap and it works, and one day it will cost a great deal."
 COLDWAR_PAK_for_c6_0: "Mirage and Agosta"
 COLDWAR_PAK_for_c6_0_desc: "When Washington closed the door, Paris opened its workshops. Mirage fighters for the air force, Agosta boats for the navy, and no questions about politics."
 COLDWAR_PAK_for_c7_0: "The Simla Agreement"
 COLDWAR_PAK_for_c7_0_desc: "We lost a war and half a country, but we keep Kashmir on the table and the army in its barracks. A treaty with Delhi, signed on equal terms, is better than another war."
 COLDWAR_PAK_for_c8_0a: "Leave the Pacts"
 COLDWAR_PAK_for_c8_0a_desc: "SEATO and CENTO gave us promises that did not hold in 1965 or 1971. We leave them, and sit with the non-aligned."
 COLDWAR_PAK_for_c8_0b: "Hold to the Pacts"
 COLDWAR_PAK_for_c8_0b_desc: "Treaties are only paper, but paper has kept the aid flowing and the rifles in our hands. We stay in the pacts and expect the allies to remember them."
 COLDWAR_PAK_for_c0_1: "The Karakoram Highway"
 COLDWAR_PAK_for_c0_1_desc: "A road through the highest gorge on earth, built by Pakistani soldiers and Chinese engineers side by side. It joins Islamabad to Kashgar and cuts a ribbon through the Karakoram."
 COLDWAR_PAK_for_c1_1: "End the Embargo"
 COLDWAR_PAK_for_c1_1_desc: "Since 1965 we have paid for American tanks and received no spare parts for them. A single exception in 1970, then a cash arrangement: spares first, new weapons later."
 COLDWAR_PAK_for_c2_1: "Manpower for the Gulf"
 COLDWAR_PAK_for_c2_1_desc: "The sheikhdoms need hands to build their towns and we have millions without work. A Pakistani mason in Dubai feeds a whole village at home."
 COLDWAR_PAK_for_c3_1: "Regional Cooperation for Development"
 COLDWAR_PAK_for_c3_1_desc: "Three Muslim neighbours with one railway to build and one market to open. Karachi, Tehran and Istanbul can trade with each other before they trade with anyone else."
 COLDWAR_PAK_for_c4_1: "The Spirit of Tashkent"
 COLDWAR_PAK_for_c4_1_desc: "Kosygin brought two prime ministers to one table and a war ended on paper. Moscow, not Washington, proved it could speak to both sides of the Subcontinent."
 COLDWAR_PAK_for_c5_1: "Kabul's Neighbour"
 COLDWAR_PAK_for_c5_1_desc: "Landlocked Afghanistan reaches the sea only through Karachi. Whoever governs in Kabul needs our port, and we need a quiet border."
 COLDWAR_PAK_for_c7_1: "The Indus Commission"
 COLDWAR_PAK_for_c7_1_desc: "The Indus feeds Punjab and Sindh, and its tributaries rise in lands we do not govern. A commission that meets twice a year is the cheapest dam we shall ever build."
 COLDWAR_PAK_for_c0_2: "The Heavy Mechanical Complex"
 COLDWAR_PAK_for_c0_2_desc: "At Taxila Chinese technicians cast the steel for the machines that will make our machines. The families of Karachi had no interest in such a plant; the state did."
 COLDWAR_PAK_for_c1_2: "The Frontline State"
 COLDWAR_PAK_for_c1_2_desc: "Soviet tanks sit on the Oxus and three million Afghans cross our border. Washington, which refused us spare parts for sixteen years, now offers billions for the front line."
 COLDWAR_PAK_for_c2_2: "The Gaddafi Stadium"
 COLDWAR_PAK_for_c2_2_desc: "The Colonel spoke to the Islamic Summit in Lahore and the crowd roared. The stadium bears his name, and his deposits are in our banks."
 COLDWAR_PAK_for_c0_3: "The Chinese Nuclear Accord"
 COLDWAR_PAK_for_c0_3_desc: "A formal agreement on the peaceful uses of nuclear energy with the one great power that asks no questions about our neighbours. The reactors are for electricity; we say so loudly."
 COLDWAR_PAK_ppp_hill_campaign: "The Hill Campaign"
 COLDWAR_PAK_ppp_hill_campaign_desc: "The army is committed to the hill campaign in Balochistan and its payroll swells."
 COLDWAR_PAK_ppp_transfer_harvest: "Harvest of the Transfer Year"
 COLDWAR_PAK_ppp_transfer_harvest_desc: "The land transfer disrupts the harvest and agricultural tax receipts fall for a year."
 COLDWAR_PAK_stem_campaign_season: "Campaign Season"
 COLDWAR_PAK_stem_campaign_season_desc: "The parties are on the stump and the government finds little time to govern."
 COLDWAR_PAK_ow_bread_drift: "Roti, Kapra aur Makan Wave"
 COLDWAR_PAK_ow_bread_drift_desc: "The bread-and-clothing slogan pulls the country toward the Western camp for a year."
 COLDWAR_PAK_ppp_awami_raj: "Awami Raj"
 COLDWAR_PAK_ppp_awami_raj_desc: "The People's Party raj gives the government a mandate at the price of a swollen party bureaucracy."
 COLDWAR_PAK_ppp_peoples_pakistan: "The Peoples' Pakistan"
 COLDWAR_PAK_ppp_peoples_pakistan_desc: "A state built around the People's Party delivers growth and stability but invites corruption."
 COLDWAR_PAK_ppp_jiye_bhutto: "Jiye Bhutto"
 COLDWAR_PAK_ppp_jiye_bhutto_desc: "The cult of the leader hardens the regime against drift at the cost of a bigger party apparatus."
 COLDWAR_PAK_nuc_opaque_deterrent: "The Opaque Deterrent"
 COLDWAR_PAK_nuc_opaque_deterrent_desc: "Pakistan neither confirms nor denies the bomb and keeps its Western partners guessing."
 COLDWAR_PAK_nuc_development_state: "The Development State"
 COLDWAR_PAK_nuc_development_state_desc: "The state steers the economy toward growth and construction while the army is kept lean."
 COLDWAR_PAK_army_reformer_in_uniform: "The Reformer in Uniform"
 COLDWAR_PAK_army_reformer_in_uniform_desc: "An airman's reputation for clean dealing buys reform, at a price in paperwork."
 COLDWAR_PAK_army_purge_slowdown: "The Purge Slows the Files"
 COLDWAR_PAK_army_purge_slowdown_desc: "Files slow down while the screening boards work."
 COLDWAR_PAK_line_technocrat: "The Technocrat Line"
 COLDWAR_PAK_line_technocrat_desc: "Planning Commission technocrats steer the economy by criteria rather than friendship."
 COLDWAR_PAK_army_basic_needs: "The Basic Needs Programme"
 COLDWAR_PAK_army_basic_needs_desc: "Subsidies for the poor steady the country at the cost of social spending."
 COLDWAR_PAK_army_modernising_junta: "The Modernising Junta"
 COLDWAR_PAK_army_modernising_junta_desc: "A junta of technocrats and airmen modernises the state at the price of military wages."
 COLDWAR_PAK_army_soldiers_mandate: "The Soldier's Mandate"
 COLDWAR_PAK_army_soldiers_mandate_desc: "A professional soldier's mandate sharpens the army and thins the political machine."
 COLDWAR_PAK_army_corps_commanders_council: "The Corps Commanders' Council"
 COLDWAR_PAK_army_corps_commanders_council_desc: "Nine corps commanders share the government and steady it, at a cost to stability."
 COLDWAR_PAK_line_foundation: "The Foundation Line"
 COLDWAR_PAK_line_foundation_desc: "Fauji Foundation enterprises carry the economy under the army's wing."
 COLDWAR_PAK_army_army_of_the_republic: "The Army of the Republic"
 COLDWAR_PAK_army_army_of_the_republic_desc: "A professional army answerable to the republic, paid for in military wages."
 COLDWAR_PAK_army_chief_cmla: "The Chief Martial Law Administrator"
 COLDWAR_PAK_army_chief_cmla_desc: "Martial law concentrates power in one office at some cost to stability."
 COLDWAR_PAK_army_councils_files: "The Council's Files"
 COLDWAR_PAK_army_councils_files_desc: "The National Security Council's secret files steady the regime and feed corruption."
 COLDWAR_PAK_line_fourth_plan: "The Fourth Plan Line"
 COLDWAR_PAK_line_fourth_plan_desc: "The Fourth Five-Year Plan builds fast and borrows heavily."
 COLDWAR_PAK_army_labour_charter_1969: "The Labour Charter of 1969"
 COLDWAR_PAK_army_labour_charter_1969_desc: "The 1969 labour policy calms the mills and slows factory output."
 COLDWAR_PAK_army_barracks_pledge: "The Barracks Pledge"
 COLDWAR_PAK_army_barracks_pledge_desc: "A pledge to return to the barracks steadies the regime and dampens war fervour."
 COLDWAR_PAK_army_hard_hand: "The Hard Hand"
 COLDWAR_PAK_army_hard_hand_desc: "A hard hand holds the state together at the cost of stability and police budgets."
 COLDWAR_PAK_army_balochistan_garrisons: "Balochistan Garrison Costs"
 COLDWAR_PAK_army_balochistan_garrisons_desc: "The Balochistan operation raises army personnel costs for two years."
 COLDWAR_PAK_line_garrison: "The Garrison Line"
 COLDWAR_PAK_line_garrison_desc: "A garrison economy builds and arms at the expense of tax receipts."
 COLDWAR_PAK_army_order_at_any_price: "Order at Any Price"
 COLDWAR_PAK_army_order_at_any_price_desc: "Order is kept at any price in stability and police spending."
 COLDWAR_PAK_army_ninety_day_promise: "The Ninety Day Promise"
 COLDWAR_PAK_army_ninety_day_promise_desc: "A promise of elections in ninety days buys authority at the cost of stability and investor confidence."
 COLDWAR_PAK_army_nizam_e_islam: "The Nizam-e-Islam"
 COLDWAR_PAK_army_nizam_e_islam_desc: "An Islamic order lends the regime legitimacy and cools Western leanings."
 COLDWAR_PAK_line_islamic_market: "The Islamic Market Line"
 COLDWAR_PAK_line_islamic_market_desc: "Denationalised mills and an Islamic market line favour business over the tax base."
 COLDWAR_PAK_army_nominated_house: "The Nominated House"
 COLDWAR_PAK_army_nominated_house_desc: "A nominated assembly serves the ruler and costs a little stability."
 COLDWAR_PAK_army_presidents_reserve_power: "The President's Reserve Power"
 COLDWAR_PAK_army_presidents_reserve_power_desc: "A reserve power in the constitution entrenches the president at the cost of stability."
 COLDWAR_PAK_army_soldier_of_islam: "The Soldier of Islam"
 COLDWAR_PAK_army_soldier_of_islam_desc: "The soldier of Islam rules with conviction at a cost in stability and bureaucracy."
 COLDWAR_PAK_ji_society_faithful: "The Society of the Faithful"
 COLDWAR_PAK_ji_society_faithful_desc: "A disciplined cadre society brings order and religious cohesion at the price of a heavier bureaucracy."
 COLDWAR_PAK_ji_islamic_state: "The Islamic State of Pakistan"
 COLDWAR_PAK_ji_islamic_state_desc: "The state is openly built on Islamic law, strengthening the regime but burdening administration and investors."
 COLDWAR_PAK_jui_wifaq: "Wifaq-ul-Madaris"
 COLDWAR_PAK_jui_wifaq_desc: "A national board of seminaries cheapens religious schooling but sidelines secular science."
 COLDWAR_PAK_jui_mufti_resigns: "The Ministry Resigns"
 COLDWAR_PAK_jui_mufti_resigns_desc: "The provincial ministry resigns over Balochistan and Peshawar loses political weight for a year."
 COLDWAR_PAK_jui_ulema_office: "The Ulema in Office"
 COLDWAR_PAK_jui_ulema_office_desc: "Clerics in government steady the street and strengthen authority at the cost of a heavier administration."
 COLDWAR_PAK_jui_deobandi_establishment: "The Deobandi Establishment"
 COLDWAR_PAK_jui_deobandi_establishment_desc: "The Deobandi network is woven into the state, cheapening schooling but weighing on research and administration."
 COLDWAR_PAK_tnfj_zakat_exemption: "Zakat Exemption"
 COLDWAR_PAK_tnfj_zakat_exemption_desc: "Exempting the Shia community from zakat buys loyalty but trims the tax base."
 COLDWAR_PAK_tnfj_jafari_fiqh: "The Jafari Fiqh"
 COLDWAR_PAK_tnfj_jafari_fiqh_desc: "Recognition of Jafari jurisprudence calms the community but adds to schooling costs."
 COLDWAR_PAK_tnfj_equal_citizens: "Equal Citizens of the Faith"
 COLDWAR_PAK_tnfj_equal_citizens_desc: "Equal civic standing for every school of faith steadies the state at the cost of added administration."
 COLDWAR_PAK_kho_guardianship: "Guardianship of the Jurist"
 COLDWAR_PAK_kho_guardianship_desc: "The rule of the jurist hardens the base but opens the country to outside influence."
 COLDWAR_PAK_kho_shia_voice: "The Shia Political Voice"
 COLDWAR_PAK_kho_shia_voice_desc: "A Shia political voice gives the community a stake in the state at the price of foreign leverage and bureaucracy."
 COLDWAR_PAK_ssp_ordinance_shadow: "The Ordinance Shadow"
 COLDWAR_PAK_ssp_ordinance_shadow_desc: "The anti-Ahmadi ordinance pushes the state toward the Salafist pole but unsettles society and frightens investors."
 COLDWAR_PAK_ssp_sectarian_divide: "A Sectarian Divide"
 COLDWAR_PAK_ssp_sectarian_divide_desc: "A state defined by one sect hardens its base but splits society and invites outside meddling."
 COLDWAR_PAK_pmlc_wider_party: "A Wider Party"
 COLDWAR_PAK_pmlc_wider_party_desc: "The factions come home and the party machine grows for a year."
 COLDWAR_PAK_pmlc_ijt: "The Islami Jamhoori Ittehad"
 COLDWAR_PAK_pmlc_ijt_desc: "A broad conservative alliance trades stability and growth for patronage and a heavier secretariat."
 COLDWAR_PAK_nap_transfer_year: "The Transfer Year"
 COLDWAR_PAK_nap_transfer_year_desc: "Tenant land transfers cost a year of land-tax revenue."
 COLDWAR_PAK_nap_federation_equals: "A Federation of Equals"
 COLDWAR_PAK_nap_federation_equals_desc: "Four provinces share one state, at the price of a heavier secretariat."
 COLDWAR_PAK_nap_four_nations_fed: "The Four Nations Federation"
 COLDWAR_PAK_nap_four_nations_fed_desc: "A federation of four equal nations binds the provinces to the state at some cost in administration."
 COLDWAR_PAK_pmlq_centralist: "The Centralist League"
 COLDWAR_PAK_pmlq_centralist_desc: "A strong centre in the hands of the Qayyum League."
 COLDWAR_PAK_al_rule_of_law: "The Rule of Law"
 COLDWAR_PAK_al_rule_of_law_desc: "The courts bind the state while the Awami League rules."
 COLDWAR_PAK_al_golden_bengal: "Golden Bengal in a Federal Pakistan"
 COLDWAR_PAK_al_golden_bengal_desc: "Both wings prosper under one federal roof."
 COLDWAR_PAK_ben_roundtable_wait: "The Round Table Pending"
 COLDWAR_PAK_ben_roundtable_wait_desc: "The East waits for the Round Table to conclude; autonomy is not yet settled."
 COLDWAR_PAK_ben_six_points_fed: "The Six Points Federation"
 COLDWAR_PAK_ben_six_points_fed_desc: "A loose federation on the Six Points: provinces keep their funds."
 COLDWAR_PAK_ben_autonomy_settlement: "The Autonomy Settlement"
 COLDWAR_PAK_ben_autonomy_settlement_desc: "A fixed federal share and provincial autonomy settle the dispute."
 COLDWAR_PAK_ben_garrison_pay: "The Dacca Garrison Pay"
 COLDWAR_PAK_ben_garrison_pay_desc: "A garrison 1,600 km from home is expensive to pay and supply."
 COLDWAR_PAK_ben_two_nations: "Two Nations, Two States"
 COLDWAR_PAK_ben_two_nations_desc: "Two states settle apart by treaty."
 COLDWAR_PAK_eco_load_shedding: "First Load Shedding"
 COLDWAR_PAK_eco_load_shedding_desc: "Theft, tripped feeders and the first load shedding of the rural grid."
 COLDWAR_PAK_martial_law: "Martial Law Administration"
 COLDWAR_PAK_martial_law_desc: "General Yahya rules by martial law regulations since 25 March 1969. The constitution of 1962 is suspended."
 COLDWAR_PAK_army_shadow: "The Army's Shadow"
 COLDWAR_PAK_army_shadow_desc: "The generals went back to the barracks. Nobody in Islamabad forgets the road from Rawalpindi."
 COLDWAR_PAK_guided_order: "The Guided Order"
 COLDWAR_PAK_guided_order_desc: "A provisional order lets the generals rule through the courts and the civil service."
 COLDWAR_PAK_two_wings: "Two Wings, One Nation"
 COLDWAR_PAK_two_wings_desc: "1,600 km of India lie between the wings. The West earns 61% more per head than the East, and the East holds 54% of the people."
 COLDWAR_PAK_fragile_union: "A Fragile Union"
 COLDWAR_PAK_fragile_union_desc: "The East stays, on terms it can revoke."
 COLDWAR_PAK_scars_of_1971: "Scars of 1971"
 COLDWAR_PAK_scars_of_1971_desc: "Half the country is gone and ninety thousand soldiers sit in Indian camps."
 COLDWAR_PAK_clean_break: "A Clean Break"
 COLDWAR_PAK_clean_break_desc: "Two nations, two states, and a long argument about the bill."
 COLDWAR_PAK_twenty_two_families: "The Twenty-Two Families"
 COLDWAR_PAK_twenty_two_families_desc: "Mahbub ul Haq counted them in 1968: twenty-two families own two thirds of industry and most of the banks and insurers."
 COLDWAR_PAK_commanding_heights: "The Commanding Heights"
 COLDWAR_PAK_commanding_heights_desc: "Steel, cement, banks and insurance belong to the state. The families moved their money abroad."
 COLDWAR_PAK_crony_capital: "Crony Capital"
 COLDWAR_PAK_crony_capital_desc: "The mills went back to friends of the government."
 COLDWAR_PAK_feudal_countryside: "The Feudal Countryside"
 COLDWAR_PAK_feudal_countryside_desc: "88% of farms are smaller than 25 acres and hold 57% of the land. The waderas and jagirdars deliver the rural vote."
 COLDWAR_PAK_waderas_bend: "The Waderas Bend"
 COLDWAR_PAK_waderas_bend_desc: "Ceilings and tenancy rules cut the largest estates, on paper and partly in the fields."
 COLDWAR_PAK_waderas_endure: "The Waderas Endure"
 COLDWAR_PAK_waderas_endure_desc: "The big houses lost acres, not power."
 COLDWAR_PAK_consortium_lifeline: "The Consortium Lifeline"
 COLDWAR_PAK_consortium_lifeline_desc: "The World Bank's Aid-to-Pakistan Consortium pays for the plan. In May 1971 Pakistan asked it for a moratorium."
 COLDWAR_PAK_aid_partnership: "The Aid Partnership"
 COLDWAR_PAK_aid_partnership_desc: "The donors reschedule the debt and stay on as partners."
 COLDWAR_PAK_full_safeguards: "Under Full Safeguards"
 COLDWAR_PAK_full_safeguards_desc: "IAEA inspectors count every gram in our reactors. Weapons work would have to hide from them."
 COLDWAR_PAK_debt_overhang: "Debt Overhang"
 COLDWAR_PAK_debt_overhang_desc: "The plan is paid for. The debt that paid for it is not."
 COLDWAR_PAK_embargo_years: "The Embargo Years"
 COLDWAR_PAK_embargo_years_desc: "Washington cut off arms after the 1965 war. Pattons and Sabres wait for spare parts."
 COLDWAR_PAK_spare_parts: "Spare Parts Diplomacy"
 COLDWAR_PAK_spare_parts_desc: "Every tank and fighter comes from a different friend."
 COLDWAR_PAK_indian_shadow: "The Indian Shadow"
 COLDWAR_PAK_indian_shadow_desc: "Two wars, a divided Kashmir and an army five times larger next door."
 COLDWAR_PAK_deterrence_sought: "Deterrence Sought"
 COLDWAR_PAK_deterrence_sought_desc: "The country will eat grass, if it must, to match India's bomb."
 COLDWAR_PAK_balance_of_terror: "A Balance of Terror"
 COLDWAR_PAK_balance_of_terror_desc: "Cold tests in the Kirana Hills tell New Delhi what it needs to know."
 COLDWAR_PAK_uneasy_peace: "An Uneasy Peace"
 COLDWAR_PAK_uneasy_peace_desc: "The guns stay on the border, the money goes to the canals."
 COLDWAR_PAK_illiterates: "A Nation of Illiterates"
 COLDWAR_PAK_illiterates_desc: "In 1972 only 21.7% of Pakistanis can read, and 11.6% of the women."
 COLDWAR_PAK_schools_without_teachers: "Schools Without Teachers"
 COLDWAR_PAK_schools_without_teachers_desc: "The schools are built faster than teachers can be trained."
 COLDWAR_PAK_reading_minority: "A Reading Minority"
 COLDWAR_PAK_reading_minority_desc: "The cities read; the villages listen to those who do."
 COLDWAR_PAK_half_reads: "Half a Nation Reads"
 COLDWAR_PAK_half_reads_desc: "Half the country can read a newspaper, and the other half still cannot."
 COLDWAR_PAK_1973_constitution: "The 1973 Constitution"
 COLDWAR_PAK_1973_constitution_desc: "The first constitution all parties signed."
 COLDWAR_PAK_policy_reversed: "A Policy Reversed"
 COLDWAR_PAK_policy_reversed_desc: "The government has thrown away years of planning."
 COLDWAR_PAK_politics_banned: "Political Activity Banned"
 COLDWAR_PAK_politics_banned_desc: "Party offices are sealed and public meetings need a permit."
 COLDWAR_PAK_politics_allowed: "Political Activity Allowed"
 COLDWAR_PAK_politics_allowed_desc: "The parties hold rallies again under the eyes of the martial law administrators."
 COLDWAR_PAK_balochistan_insurgency: "The Balochistan Insurgency"
 COLDWAR_PAK_balochistan_insurgency_desc: "Marri and Mengal fighters hold the mountains."
 COLDWAR_PAK_nizam_movement: "The Nizam-e-Mustafa Movement"
 COLDWAR_PAK_nizam_movement_desc: "The opposition fills the streets and calls for the rule of the Prophet."
 COLDWAR_PAK_ojhri_disaster: "The Ojhri Disaster"
 COLDWAR_PAK_ojhri_disaster_desc: "Rockets from the Afghan pipeline rained on Rawalpindi and Islamabad."
 COLDWAR_PAK_deal_open_border: "Open Border, Quiet Border"
 COLDWAR_PAK_deal_open_border_AFG: "Open Border, Quiet Border"
 COLDWAR_PAK_deal_quiet_baloch_frontier: "A Quiet Baloch Frontier"
 COLDWAR_PAK_deal_quiet_baloch_frontier_PER: "A Quiet Baloch Frontier"
 COLDWAR_PAK_deal_qom_exchange: "The Qom Exchange"
 COLDWAR_PAK_deal_qom_exchange_PER: "The Qom Exchange"
 COLDWAR_PAK_deal_ganges_waters: "The Ganges Waters Accord"
 COLDWAR_PAK_deal_partition_commission: "The Partition Commission"
 COLDWAR_PAK_deal_candu_fuel_CAN: "CANDU Fuel and Spares"
 COLDWAR_PAK_deal_reprocessing_partnership: "The Reprocessing Partnership"
 COLDWAR_PAK_deal_nuclear_restraint: "South Asian Nuclear Restraint"
 COLDWAR_PAK_deal_nuclear_restraint_RAJ: "South Asian Nuclear Restraint"
 COLDWAR_PAK_deal_basmati_contract_UAE: "The Basmati Contract"
 COLDWAR_PAK_deal_higher_than_the_himalayas: "Higher Than the Himalayas"
 COLDWAR_PAK_deal_higher_than_the_himalayas_CHI: "Higher Than the Himalayas"
 COLDWAR_PAK_deal_kissinger_channel: "The Kissinger Channel"
 COLDWAR_PAK_deal_kissinger_channel_USA: "The Kissinger Channel"
 COLDWAR_PAK_deal_brothers_in_the_holy_land: "Brothers in the Holy Land"
 COLDWAR_PAK_deal_brothers_in_the_holy_land_SAU: "Brothers in the Holy Land"
 COLDWAR_PAK_deal_shahs_cobras: "The Shah's Cobras"
 COLDWAR_PAK_deal_shahs_cobras_PER: "The Shah's Cobras"
 COLDWAR_PAK_deal_soviet_steel_contract: "The Soviet Steel Contract"
 COLDWAR_PAK_deal_soviet_steel_contract_SOV: "The Soviet Steel Contract"
 COLDWAR_PAK_deal_kabul_understanding: "The Kabul Understanding"
 COLDWAR_PAK_deal_kabul_understanding_AFG: "The Kabul Understanding"
 COLDWAR_PAK_deal_mirage_and_agosta: "Mirage and Agosta"
 COLDWAR_PAK_deal_mirage_and_agosta_FRA: "Mirage and Agosta"
 COLDWAR_PAK_deal_simla_agreement: "The Simla Agreement"
 COLDWAR_PAK_deal_simla_agreement_RAJ: "The Simla Agreement"
 COLDWAR_PAK_deal_bandung_line: "The Bandung Line"
 COLDWAR_PAK_deal_bandung_line_CHI: "The Bandung Line"
 COLDWAR_PAK_deal_alliance_dividend: "The Alliance Dividend"
 COLDWAR_PAK_deal_alliance_dividend_USA: "The Alliance Dividend"
 COLDWAR_PAK_deal_friendship_highway: "The Friendship Highway"
 COLDWAR_PAK_deal_friendship_highway_CHI: "The Friendship Highway"
 COLDWAR_PAK_deal_cash_sales_arrangement: "The Cash Sales Arrangement"
 COLDWAR_PAK_deal_cash_sales_arrangement_USA: "The Cash Sales Arrangement"
 COLDWAR_PAK_deal_gulf_labour_compact: "The Gulf Labour Compact"
 COLDWAR_PAK_deal_gulf_labour_compact_UAE: "The Gulf Labour Compact"
 COLDWAR_PAK_deal_gulf_labour_compact_KUW: "The Gulf Labour Compact"
 COLDWAR_PAK_deal_rcd_common_market: "The RCD Common Market"
 COLDWAR_PAK_deal_rcd_common_market_TUR: "The RCD Common Market"
 COLDWAR_PAK_deal_rcd_common_market_PER: "The RCD Common Market"
 COLDWAR_PAK_deal_spirit_of_tashkent: "The Spirit of Tashkent"
 COLDWAR_PAK_deal_spirit_of_tashkent_SOV: "The Spirit of Tashkent"
