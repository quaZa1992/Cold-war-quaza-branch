 mdcw_pan_carbon_fibers_1961:0 "Carbon Fibre I"
 mdcw_pan_carbon_fibers_1961_desc:0 "1961: Heat-treated polymer fibers provide strong, lightweight reinforcement for demanding industrial components. Factory and dockyard output increase by 3%."
 mdcw_graphitic_fibers_1970:0 "Carbon Fibre II"
 mdcw_graphitic_fibers_1970_desc:0 "1970: Controlled processing of liquid-crystalline pitch produces stiff graphitic fibers for specialized industrial applications. Factory and dockyard output increase by 3%, and the production efficiency cap rises by 2.5%."
 mdcw_computer_aided_drafting_1963:0 "CAD"
 mdcw_computer_aided_drafting_1963_desc:0 "1963: Interactive computer drawings improve the preparation and revision of manufacturing designs. Production efficiency at the start of a production line increases by 3%."
 mdcw_solid_modelling_1975:0 "Solid Modelling"
 mdcw_solid_modelling_1975_desc:0 "1975: Digital solid models describe a product's geometry consistently, making design revisions and prototype preparation easier. Starting production efficiency and retention when changing lines each increase by 3%."
 mdcw_genetic_code_1966:0 "Genetic Code"
 mdcw_genetic_code_1966_desc:0 "1966: Understanding how nucleotide sequences encode proteins establishes the foundation for molecular breeding and biotechnology. Agricultural productivity increases by 3%."
 mdcw_recombinant_dna_1973:0 "Gene Cloning"
 mdcw_recombinant_dna_1973_desc:0 "1973: Gene cloning and recombinant DNA methods establish practical laboratory biotechnology. Base monthly productivity growth rises by 0.025 points, before country and regional modifiers."
 mdcw_dna_sequencing_1977:0 "Sequencing"
 mdcw_dna_sequencing_1977_desc:0 "1977: Early sequencing methods make molecular analysis more precise and strengthen biomedical research. Medical support units recover an additional 1% of casualties."
