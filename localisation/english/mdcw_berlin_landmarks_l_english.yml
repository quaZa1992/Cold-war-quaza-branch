# IMPERIA CW — Cold War: berlin landmarks — English localisation.
 landmark_berlin_tv_tower: "Berlin Television Tower"
 landmark_berlin_tv_tower_plural: "$landmark_berlin_tv_tower$"
 landmark_berlin_tv_tower_desc: "Opened on 3 October 1969 near Alexanderplatz in East Berlin, the 365-metre television tower is a prominent symbol of the German Democratic Republic. Its slender concrete shaft supports a 32-metre steel-clad sphere containing observation and restaurant floors, crowned by a red-and-white broadcasting antenna."
