l_english:
# IMPERIA COLD WAR — Syrian government programmes, constitutional choices and fiscal succession.
 COLDWAR_SYR_RP_divided_command:0 "Divided Command"
 COLDWAR_SYR_RP_divided_command_desc:0 "Atassi signs cabinet orders while Salah Jadid controls the party apparatus and Hafez al-Assad commands the armed forces. An officers' conference will clarify how orders reach the provincial garrisons."
 COLDWAR_SYR_RP_provincial_delegates:0 "Provincial Delegates"
 COLDWAR_SYR_RP_provincial_delegates_desc:0 "Branch delegates bring petitions from the cooperatives to Damascus. Giving them the floor will test the patience of the officers who have run the provincial security committees."
 COLDWAR_SYR_RP_keep_atassi:0 "Keep Atassi in Office"
 COLDWAR_SYR_RP_keep_atassi_desc:0 "Keep Nureddin al-Atassi at the head of state and give his ministers control over the cabinet agenda. Civilian authority reassures the cabinet, while the officers have less room to rally the country behind military initiatives."
 COLDWAR_SYR_RP_corrective_movement:0 "Corrective Movement"
 COLDWAR_SYR_RP_corrective_movement_desc:0 "Hafez al-Assad can take charge of the government and entrust the provisional presidency to Ahmad al-Khatib. Army commanders gain a clear chain of command and a larger personnel budget."
 COLDWAR_SYR_RP_jadid_secretariat:0 "Jadid's Secretariat"
 COLDWAR_SYR_RP_jadid_secretariat_desc:0 "Keep Atassi as head of state while Salah Jadid directs policy through the party secretariat. Cooperatives gain first claim on equipment at the expense of state manufacturing firms."
 COLDWAR_SYR_RP_cabinet_responsibility:0 "Cabinet Responsibility"
 COLDWAR_SYR_RP_cabinet_responsibility_desc:0 "Require ministers to countersign orders and bring service estimates before the cabinet. Civilian oversight makes it harder for senior officers to rally support for mobilisation."
 COLDWAR_SYR_RP_presidential_ballot:0 "Presidential Ballot"
 COLDWAR_SYR_RP_presidential_ballot_desc:0 "Put Hafez al-Assad's name before the electorate in a presidential referendum. A public mandate strengthens his authority over cabinet meetings and gives military preparedness a place in his programme."
 COLDWAR_SYR_RP_party_statutes:0 "Party Statutes"
 COLDWAR_SYR_RP_party_statutes_desc:0 "Give the Regional Command a formal vote on appointments. Officers must take their disputes to the party, and the Baath can rally its members around the new statutes."
 COLDWAR_SYR_RP_progressive_front:0 "The Progressive Front"
 COLDWAR_SYR_RP_progressive_front_desc:0 "Offer the Communist Party and the Arab Socialist Union seats in a Baath-led National Progressive Front if each commands at least five percent support. The coalition limits foreign leverage over its members, while the Baath retains oversight of university appointments."
 COLDWAR_SYR_RP_national_pact:0 "The National Pact"
 COLDWAR_SYR_RP_national_pact_desc:0 "Restore competitive elections at four-year intervals and give opposition parties room to organise. A separate Communist opposition may register once its Political Bureau has formed."
 COLDWAR_SYR_RP_emergency_registers:0 "Emergency Registers"
 COLDWAR_SYR_RP_emergency_registers_desc:0 "Commission a common register of detention orders for the Ministry of Justice. Provincial clerks will need training in machine-readable records before appeals can be traced."
 COLDWAR_SYR_RP_special_courts:0 "Retain Special Courts"
 COLDWAR_SYR_RP_special_courts_desc:0 "Give the exceptional courts defined jurisdictions and require written referrals. The emergency apparatus retains broad powers over public life and academic appointments."
 COLDWAR_SYR_RP_ordinary_appeals:0 "Ordinary Appeals"
 COLDWAR_SYR_RP_ordinary_appeals_desc:0 "Let defendants appeal emergency rulings to the ordinary courts. Judges can reopen cases, although ministers must still negotiate with the security services to obtain the records."
 COLDWAR_SYR_RP_constitutional_charter:0 "Constitutional Charter"
 COLDWAR_SYR_RP_constitutional_charter_desc:0 "Publish the settlement and ask provincial offices to reconcile their procedures with it. Uniform public records help officials implement the charter and reduce the leverage of outside patrons."
 COLDWAR_SYR_RP_import_licences:0 "Import Licences"
 COLDWAR_SYR_RP_import_licences_desc:0 "Order the Foreign Trade Ministry to reconcile foreign-exchange allocations with import licences. Reliable orders help commercial relations and give manufacturers access to better equipment once customs clearance comes through."
 COLDWAR_SYR_RP_municipal_relief:0 "Municipal Relief"
 COLDWAR_SYR_RP_municipal_relief_desc:0 "Release a central grant to municipal bakeries and dispensaries. Coordinating local purchases reduces the cost of keeping clinics open, while the bakeries require a larger subsidy."
 COLDWAR_SYR_RP_city_syndicates:0 "City Syndicates"
 COLDWAR_SYR_RP_city_syndicates_desc:0 "Invite chambers of commerce, professional syndicates and unions to resume regular meetings. Their members can coordinate local production, but negotiations will tie up ministers."
 COLDWAR_SYR_RP_syndicate_bargain:0 "Syndicate Bargain"
 COLDWAR_SYR_RP_syndicate_bargain_desc:0 "Guarantee local merchants a voice in distribution and wage talks. Merchants can arrange supplies and restore trade contacts, while the cabinet must consult the syndicates before changing course."
 COLDWAR_SYR_RP_price_board:0 "Cabinet Price Board"
 COLDWAR_SYR_RP_price_board_desc:0 "Give a cabinet board authority to ration foreign exchange and fix wholesale prices. Lower procurement prices ease the subsidy bill, while manufacturers must sell into a controlled market."
 COLDWAR_SYR_RP_hama_public_works:0 "Hama Public Works"
 COLDWAR_SYR_RP_hama_public_works_desc:0 "Rebuild roads and municipal services in Hama. Construction contracts can reopen routes into the old commercial quarters and give the municipality room for further works."
 COLDWAR_SYR_RP_presidential_review:0 "Presidential Review"
 COLDWAR_SYR_RP_presidential_review_desc:0 "Summon the cabinet to review civilian authority and bring succession orders under one roof. The other commands will resent a review of their authority while the Defence Companies retain their separate chain of command."
 COLDWAR_SYR_RP_recall_hafez:0 "Recall Hafez"
 COLDWAR_SYR_RP_recall_hafez_desc:0 "Restore the president's direct authority over the commands that competed during his illness. A settlement with senior officers entails a more expensive personnel establishment."
 COLDWAR_SYR_RP_civil_stewardship:0 "Civil Stewardship"
 COLDWAR_SYR_RP_civil_stewardship_desc:0 "Transfer the presidency to a collective civilian council. A common cabinet position reduces outside leverage over divided ministries, while military mobilisation commands less public backing."
 COLDWAR_SYR_RP_rifaat_claim:0 "Accept Rifaat's Claim"
 COLDWAR_SYR_RP_rifaat_claim_desc:0 "Allow Rifaat al-Assad to claim the presidency through his influence in the Defence Companies. His command network can act quickly while civilian ministers and rival officers weigh their allegiance."
 COLDWAR_SYR_RP_cabinet_succession:0 "Cabinet Succession"
 COLDWAR_SYR_RP_cabinet_succession_desc:0 "Publish a succession procedure that leaves the sitting government in office. Keeping the chain of command and civilian authorities in place gives outside patrons fewer openings, at the cost of a larger secretariat."
 COLDWAR_SYR_RP_oil_receipts:0 "Oil Receipts"
 COLDWAR_SYR_RP_oil_receipts_desc:0 "Earmark part of oil revenue for imported industrial inputs. Public firms gain access to spare parts and raw materials, while the proceeds committed to the account are unavailable for ordinary spending."
 COLDWAR_SYR_RP_bread_subsidies:0 "Bread Subsidies"
 COLDWAR_SYR_RP_bread_subsidies_desc:0 "Use the new fiscal headroom to support the price of flour. Maintaining affordable bread in the cities will place a continuing burden on the welfare budget."
 COLDWAR_SYR_RP_open_imports:0 "Open Import Licences"
 COLDWAR_SYR_RP_open_imports_desc:0 "Open a wider import window for manufacturers. Better access to spares and intermediate goods raises output and restores trading relationships, while the authorities spend more to cushion households on fixed wages."
 COLDWAR_SYR_RP_five_year_estimates:0 "Five-Year Estimates"
 COLDWAR_SYR_RP_five_year_estimates_desc:0 "Draw provincial investment, irrigation maintenance and public services into one set of five-year estimates. Predictable appropriations help projects survive a poor harvest or a fall in export earnings."
 COLDWAR_SYR_RP_civil_cabinet:0 "The Civil Cabinet"
 COLDWAR_SYR_RP_civil_cabinet_desc:0 "Gather the ministers responsible for the provincial administrations around Atassi. Give their offices clerical support and a technical staff to coordinate provincial works."
 COLDWAR_SYR_RP_cabinet_auditors:0 "Cabinet Auditors"
 COLDWAR_SYR_RP_cabinet_auditors_desc:0 "Send auditors into public companies and require ministerial signatures on new orders. They can curb improper procurement and lower overhead, though inspections slow factory managers."
 COLDWAR_SYR_RP_provincial_councils:0 "Provincial Councils"
 COLDWAR_SYR_RP_provincial_councils_desc:0 "Let elected local councils settle disputes over services and land use. They can advance local infrastructure works once Damascus yields some control over decisions."
 COLDWAR_SYR_RP_party_delegates:0 "Party Delegates"
 COLDWAR_SYR_RP_party_delegates_desc:0 "Give rural Baath branches a larger delegation to the Regional Congress. The party can reach more cooperative organisers, who will press their claims against military administrators."
 COLDWAR_SYR_RP_producer_committees:0 "Producer Committees"
 COLDWAR_SYR_RP_producer_committees_desc:0 "Assign machinery and transport to committees of agricultural producers. Their cooperatives will bring more land into production as military factories compete for supplies."
 COLDWAR_SYR_RP_state_holding_firms:0 "State Holding Firms"
 COLDWAR_SYR_RP_state_holding_firms_desc:0 "Group state manufacturers into holding companies with priority access to industrial inputs. Their workshops can supply the army, while farmers wait for machinery."
 COLDWAR_SYR_RP_presidential_office:0 "Presidential Office"
 COLDWAR_SYR_RP_presidential_office_desc:0 "Bring officers and civilian secretaries into a presidential office headed by Hafez al-Assad. Regular staff conferences give the command a direct hearing."
 COLDWAR_SYR_RP_technical_cabinet:0 "A Technical Cabinet"
 COLDWAR_SYR_RP_technical_cabinet_desc:0 "Appoint engineers and industrial managers to cabinet posts. Public factories gain experienced directors and established training institutions will have to supply more specialists."
 COLDWAR_SYR_RP_appoint_loyalists:0 "Appoint Loyalists"
 COLDWAR_SYR_RP_appoint_loyalists_desc:0 "Entrust appointments to officers personally loyal to the president and recognise separate guard commands. Direct access to commanders helps the presidency issue orders but gives patrons more influence over technical posts."
 COLDWAR_SYR_RP_labour_congress:0 "Labour Congress"
 COLDWAR_SYR_RP_labour_congress_desc:0 "Bring union officers and farming representatives together under the Communist Party. Organisers can extend the party's reach into the countryside by spending political capital to secure the delegates' backing."
 COLDWAR_SYR_RP_plant_councils:0 "Plant Councils"
 COLDWAR_SYR_RP_plant_councils_desc:0 "Let elected plant councils negotiate production schedules and report shortages directly. Their coordination raises industrial productivity while adding another layer of administration."
 COLDWAR_SYR_RP_wage_bargaining:0 "Wage Bargaining"
 COLDWAR_SYR_RP_wage_bargaining_desc:0 "Guarantee a regular wage round for employees of the state sector. Plants can plan output around agreed contracts, while the state pays for the additional benefits."
 COLDWAR_SYR_RP_asu:0 "Arab Socialist Union"
 COLDWAR_SYR_RP_asu_desc:0 "Bring public-sector engineers into the Arab Socialist Union's industrial commission. Funding the commission can recover technical expertise scattered since the end of the union with Egypt and give the party a stronger footing among engineers."
 COLDWAR_SYR_RP_public_engineers:0 "Public Engineers"
 COLDWAR_SYR_RP_public_engineers_desc:0 "Create provincial offices for state engineers so that works can proceed to a common plan. Additional salaries and clerical posts will enlarge the administrative budget."
 COLDWAR_SYR_RP_rural_cooperatives:0 "Rural Cooperatives"
 COLDWAR_SYR_RP_rural_cooperatives_desc:0 "Give farming cooperatives first call on public credit and survey teams. Crop production will benefit as urban construction projects wait for staff."
 COLDWAR_SYR_RP_budget_committee:0 "Budget Committee"
 COLDWAR_SYR_RP_budget_committee_desc:0 "Give parliamentary deputies access to ministry estimates. Reconciled accounts improve revenue collection and require a temporary secretariat."
 COLDWAR_SYR_RP_audit_court:0 "An Audit Court"
 COLDWAR_SYR_RP_audit_court_desc:0 "Allow an independent court to disallow improper expenditure. Reviewing contracts can reduce corruption and administrative costs, though ministers must now defend their accounts."
 COLDWAR_SYR_RP_municipal_tax:0 "Municipal Tax Shares"
 COLDWAR_SYR_RP_municipal_tax_desc:0 "Give municipalities authority to collect and retain more revenue from public infrastructure. Local services gain a dependable source of income while industrial ministries surrender part of their investment budget."
 COLDWAR_SYR_RP_civil_service:0 "The Civil Service"
 COLDWAR_SYR_RP_civil_service_desc:0 "Assemble the permanent secretaries around the new cabinet and standardise recordkeeping. The reorganisation pays for new accounting machinery and instruction for departmental clerks."
 COLDWAR_SYR_RP_merit_appointments:0 "Merit Appointments"
 COLDWAR_SYR_RP_merit_appointments_desc:0 "Recruit graduates by examination and give technical officials secure appointments. Research institutes will benefit, while the education system must train more candidates."
 COLDWAR_SYR_RP_provincial_delegation:0 "Provincial Delegation"
 COLDWAR_SYR_RP_provincial_delegation_desc:0 "Allow provincial officials to issue local infrastructure orders. Work on roads and public utilities can move faster if the treasury funds the additional administrative offices."
