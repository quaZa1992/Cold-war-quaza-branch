l_english:
# IMPERIA CW — Cold War: Syria 1970 content imported from quaZa.
 COLDWAR_SYR_goal_scope_tt:0 "War goal against Israel: 365 days. Targets the Golan when Israel owns it. An Israeli occupation of Syrian-owned Golan instead permits a wider conquest and annexation in the peace settlement. War is declared manually."
 COLDWAR_SYR_offer_invalid_tt:0 "The proposed terms are no longer available. No funds are committed and no agreement takes effect."
 COLDWAR_SYR_war_reserve_readiness:0 "Prepared Reserve Call-Up"
 COLDWAR_SYR_war_reserve_readiness_desc:0 "A 120-day operational establishment. Its military advantages require additional personnel, administration or civilian resources. Benefits and burdens end together when the mandate or Golan objective lapses."
 COLDWAR_SYR_war_supply_preparation:0 "Forward Supply Preparation"
 COLDWAR_SYR_war_supply_preparation_desc:0 "A 120-day operational establishment. Its military advantages require additional personnel, administration or civilian resources. Benefits and burdens end together when the mandate or Golan objective lapses."
 COLDWAR_SYR_war_joint_planning:0 "Egyptian Joint Planning Mission"
 COLDWAR_SYR_war_joint_planning_desc:0 "A 180-day operational establishment. Its military advantages require additional personnel, administration or civilian resources. Benefits and burdens end together when the mandate or Golan objective lapses."
 COLDWAR_SYR_war_medical_service:0 "Forward Medical Establishment"
 COLDWAR_SYR_war_medical_service_desc:0 "A 120-day operational establishment. Its military advantages require additional personnel, administration or civilian resources. Benefits and burdens end together when the mandate or Golan objective lapses."
 COLDWAR_SYR_war_short_window:0 "Short Offensive Window"
 COLDWAR_SYR_war_short_window_desc:0 "A 60-day operational establishment. Its military advantages require additional personnel, administration or civilian resources. Benefits and burdens end together when the mandate or Golan objective lapses."
 COLDWAR_SYR_war_sustained_window:0 "Sustained Operational Pressure"
 COLDWAR_SYR_war_sustained_window_desc:0 "A 120-day operational establishment. Its military advantages require additional personnel, administration or civilian resources. Benefits and burdens end together when the mandate or Golan objective lapses."
 COLDWAR_SYR_war_bridge_credit:0 "Emergency Campaign Credit"
 COLDWAR_SYR_war_bridge_credit_desc:0 "A one-off $0.10 billion loan remains real public debt after demobilization. The emergency interest premium lasts 365 days."
 COLDWAR_SYR_lebanon_deployment:0 "Limited Lebanese Assistance Mission"
 COLDWAR_SYR_lebanon_deployment_desc:0 "An invited 180-day mission imposes personnel and fuel commitments. Lebanon may revoke its invitation; withdrawal removes both operational benefits and sustainment burdens."
 COLDWAR_SYR_pipeline_administration:0 "Iraqi Pipeline Administration"
 COLDWAR_SYR_pipeline_administration_desc:0 "Agreed pipeline transit pays Syria $0.00093 billion per week while Iraq can pay and cooperation continues. Administration and maintenance increase bureaucracy spending."
 COLDWAR_SYR_pipeline_access:0 "Agreed Syrian Pipeline Access"
 COLDWAR_SYR_pipeline_access_desc:0 "Pipeline transit through Syria improves fuel acquisition in return for $0.00093 billion per week. The agreement ends if payment or cooperation fails."
 COLDWAR_SYR_peacetime_joint_planning:0 "Egyptian Staff Cooperation"
 COLDWAR_SYR_peacetime_joint_planning_desc:0 "A separately accepted 180-day staff mission improves planning and organization while increasing bureaucracy spending. It cannot overlap with the operational planning package or the existing Egyptian coalition bonus."
 COLDWAR_SYR_import_compression:0 "Controlled Import Compression"
 COLDWAR_SYR_import_compression_desc:0 "A 180-day reduction of imports conserves state expenditure but disrupts factories dependent on imported machinery and inputs."
 COLDWAR_SYR_targeted_subsidy_cuts:0 "Emergency Subsidy Restraint"
 COLDWAR_SYR_targeted_subsidy_cuts_desc:0 "A 180-day restraint programme reduces social expenditure while household costs and political opposition rise."
 COLDWAR_SYR_failed_preparations_tt:0 "Preparations failed because their requirements are no longer met or the GDP-based cost could not be calculated. Political power is returned; no payment or promised benefit is applied. A negative treasury does not prevent Syrian expenditure."
 COLDWAR_SYR_decision_war_appropriation:0 "Convene the Operational Cabinet"
 COLDWAR_SYR_decision_war_appropriation_desc:0 "Activate a valid Golan campaign under the prepared staff programme. A still-valid appropriation is credited; renewing an expired budget costs 0.75% of current annual GDP. This authorization does not declare war."
 COLDWAR_SYR_decision_war_reserves:0 "Call Up Prepared Reserves"
 COLDWAR_SYR_decision_war_reserves_desc:0 "Call up the prepared reserve establishment at a one-time cost of 0.50% of current GDP. For 120 days, stronger readiness will improve organization while personnel expenditure rises and factory output falls under the additional demands. The advantages and burdens end together when the campaign commitment lapses."
 COLDWAR_SYR_decision_war_stockpiles:0 "Fund Forward Supply Preparation"
 COLDWAR_SYR_decision_war_stockpiles_desc:0 "Commit 0.50% of current GDP to forward supply preparation. For 120 days, improved distribution will reduce supply and army fuel consumption while requiring additional personnel expenditure. The programme organizes the resources already available to the army rather than promising equipment or stores that Syria has not acquired."
 COLDWAR_SYR_decision_war_medical:0 "Prepare Forward Medical Services"
 COLDWAR_SYR_decision_war_medical_desc:0 "Spend 0.25% of current GDP to prepare forward medical services for 120 days. Better treatment and evacuation arrangements can improve organization and confidence, while raising healthcare expenditure. The medical establishment is part of the campaign's real cost and will stand down with its associated operational commitment."
 COLDWAR_SYR_decision_war_goal_armistice:0 "Authorize a Post-Armistice War Goal"
 COLDWAR_SYR_decision_war_goal_armistice_desc:0 "While at peace and the Golan remains under Israeli occupation, commit 0.25% of current GDP to authorize a renewed war goal lasting one year. The goal keeps the military option available after an armistice. It does not declare war, and cannot be purchased again while an equivalent goal already exists."
 COLDWAR_SYR_decision_war_reconvene:0 "Reconvene the Operational Cabinet"
 COLDWAR_SYR_decision_war_reconvene_desc:0 "Recall the operational cabinet to consider preparations previously held in reserve. An already-paid appropriation can still support authorization while it remains valid, without another funding charge. The government must decide whether the Golan objective justifies activating the mandate before the appropriation expires."
 COLDWAR_SYR_decision_war_window:0 "Authorize the Planned Operational Window"
 COLDWAR_SYR_decision_war_window_desc:0 "Commit 0.50% of current GDP to the operational approach already prepared by the staff. Authorize either a sixty-day short offensive or 120 days of sustained pressure, with the corresponding supply and personnel burdens. A campaign receives one such window; the decision leaves any declaration of war to the government."
 COLDWAR_SYR_decision_war_credit:0 "Arrange Emergency Campaign Credit"
 COLDWAR_SYR_decision_war_credit_desc:0 "Arrange a $0.100 billion emergency advance with an equal increase in public debt. The bridge loan brings a one-year interest premium and weakens confidence, even if it meets an immediate campaign need. Only one can be taken for this campaign, and demobilization will not cancel its principal."
 COLDWAR_SYR_decision_war_demobilize:0 "Demobilize the Campaign Establishment"
 COLDWAR_SYR_decision_war_demobilize_desc:0 "Begin standing down the campaign establishment, ending temporary reserve, supply, medical and planning advantages together with their operating burdens. The army retains professional skills it has genuinely learned. Borrowed money remains public debt, and demobilization provides no refund for resources already spent preparing the campaign."
 COLDWAR_SYR_decision_war_egypt:0 "Offer Coordinated Operations to Egypt"
 COLDWAR_SYR_decision_war_egypt_desc:0 "Invite Egypt to coordinate operations through a defined staff mission. If Cairo accepts, Syria will pay 0.25% of current GDP and support the additional bureaucracy for 180 days. Existing Egyptian coalition coordination takes precedence, avoiding a second payment for overlapping work; no invitation can commit Egypt to war without its own decision."
 COLDWAR_SYR_FOREIGN.204.t:0 "A Diplomatic Offer Expires"
 COLDWAR_SYR_FOREIGN.204.d:0 "No matching answer arrived before the offer expired. There is no payment, operational bonus or change to the war."
 COLDWAR_SYR_FOREIGN.204.option_a:0 "Close this proposal"
 COLDWAR_SYR_FOREIGN.204.option_a_outcome_tt:0 "Close the unanswered Egyptian coordination proposal. No joint mission or payment is activated; the cabinet receives a report on the expired request."
 COLDWAR_SYR_decision_war_warning:0 "Send a Limited-Aims Diplomatic Notice"
 COLDWAR_SYR_decision_war_warning_desc:0 "Notify Israel that recovery of the occupied Golan is Syria's stated political objective. The Israeli government may accept a negotiating channel or reject the position. The notice neither requests permission to act nor assumes consent: any territorial agreement or peace settlement still requires explicit negotiations."
 COLDWAR_SYR_FOREIGN.207.t:0 "A Diplomatic Offer Expires"
 COLDWAR_SYR_FOREIGN.207.d:0 "No matching answer arrived before the offer expired. There is no payment, operational bonus or change to the war."
 COLDWAR_SYR_FOREIGN.207.option_a:0 "Close this proposal"
 COLDWAR_SYR_FOREIGN.207.option_a_outcome_tt:0 "Close the unanswered notice of Syrian war aims. No negotiating consent, territorial settlement or change to the war is granted; the cabinet receives a report."
 COLDWAR_SYR_decision_war_mediation:0 "Request Disengagement Mediation"
 COLDWAR_SYR_decision_war_mediation_desc:0 "Request talks on disengagement, separation of forces and security around the Golan. Israel's acceptance would open a negotiating channel, while final peace terms remain the responsibility of the actual belligerents and coalition leaders. Silence or refusal cannot be treated as agreement on their behalf."
 COLDWAR_SYR_FOREIGN.208.t:0 "A Diplomatic Offer Expires"
 COLDWAR_SYR_FOREIGN.208.d:0 "No matching answer arrived before the offer expired. There is no payment, operational bonus or change to the war."
 COLDWAR_SYR_FOREIGN.208.option_a:0 "Close this proposal"
 COLDWAR_SYR_FOREIGN.208.option_a_outcome_tt:0 "Close the unanswered disengagement proposal. No agreement or change to the war is imposed; the cabinet receives a report."
 COLDWAR_SYR_WAR.1.t:0 "A Limited War for the Golan"
 COLDWAR_SYR_WAR.1.d:0 "Recovering the occupied Golan remains the cabinet’s stated objective. The General Staff must prepare for fighting while the presidency decides how far Syria can pursue its claims without closing the diplomatic channel."
 COLDWAR_SYR_WAR.1.option_a:0 "Confirm the limited objective"
 COLDWAR_SYR_WAR.1.option_a_outcome_tt:0 "Confirm recovery of the Golan as the limited political objective. The chosen preparations remain available; an existing war goal is not renewed or duplicated, and war must still be declared through diplomacy."
 COLDWAR_SYR_WAR.1.option_b:0 "Keep the diplomatic channel open"
 COLDWAR_SYR_WAR.1.option_b_outcome_tt:0 "Record Syria's willingness to keep a negotiating channel open alongside its existing Golan preparations. This declaration grants no foreign consent, peace agreement or transfer of territory."
 COLDWAR_SYR_WAR.2.t:0 "The Syrian War Cabinet"
 COLDWAR_SYR_WAR.2.d:0 "Military plans require transport, trained reserves and a government willing to sustain their cost. Ministers must decide whether the General Staff should prepare an offensive proposal or concentrate on defending the existing front."
 COLDWAR_SYR_WAR.2.option_a:0 "Submit the plan for appropriations"
 COLDWAR_SYR_WAR.2.option_a_outcome_tt:0 "Record the cabinet's request for an operational appropriation. Funding and authorization still require their separate decisions; submitting this brief spends no money and mobilizes no forces."
 COLDWAR_SYR_WAR.2.option_b:0 "Keep the staff on a defensive brief"
 COLDWAR_SYR_WAR.2.option_b_outcome_tt:0 "Record a defensive staff brief. This choice grants no offensive mandate or operational package and does not refund earlier expenditure."
 COLDWAR_SYR_WAR.3.t:0 "The Price of Operational Readiness"
 COLDWAR_SYR_WAR.3.d:0 "The army has received an appropriation for preparations. The cabinet must now decide whether to authorize an operational commitment or retain the money already spent as the cost of readiness without ordering further preparations."
 COLDWAR_SYR_WAR.3.option_a:0 "Hold the operational mandate"
 COLDWAR_SYR_WAR.3.option_a_outcome_tt:0 "Withhold the operational mandate. The existing appropriation retains its original expiry date; no preparations are authorized and the expenditure is not refunded."
 COLDWAR_SYR_WAR.3.option_b:0 "Authorize preparations"
 COLDWAR_SYR_WAR.3.option_b_outcome_tt:0 "Authorize separately funded Golan preparations and end the defensive brief while the appropriation and objective remain valid. Reserve, supply, medical and operational-window packages still require their own decisions and spending."
 COLDWAR_SYR_WAR.4.t:0 "A Syrian Coordination Proposal"
 COLDWAR_SYR_WAR.4.d:0 "Damascus proposes a joint planning mission to coordinate the two armies’ preparations. Syrian officers would fund and host the work, while Cairo retains authority over its own forces and any decision to enter a war."
 COLDWAR_SYR_WAR.4.option_a:0 "Decline the proposal"
 COLDWAR_SYR_WAR.4.option_a_outcome_tt:0 "Decline the Syrian coordination proposal and notify Damascus. No Egyptian forces, money or planning mission are committed."
 COLDWAR_SYR_WAR.4.option_b:0 "Accept these coordination terms"
 COLDWAR_SYR_WAR.4.option_b_outcome_tt:0 "Accept the proposed coordination terms and send them to Damascus for funding. Syria must still authorize the quarter-percent-of-GDP payment before a new mission begins; Egypt enters no war and transfers no troops."
 COLDWAR_SYR_WAR.5.t:0 "Egypt Replies to the Operations Proposal"
 COLDWAR_SYR_WAR.5.d:0 "Cairo has accepted the proposal for staff cooperation. Syrian ministers must decide whether to commit the required funding and carry the mission’s continuing administrative obligations alongside the country’s other military preparations."
 COLDWAR_SYR_WAR.5.option_a:0 "Cancel the arrangement"
 COLDWAR_SYR_WAR.5.option_a_outcome_tt:0 "Cancel this accepted coordination offer. No new planning mission begins and no additional coordination payment is charged."
 COLDWAR_SYR_WAR.5.option_b:0 "Fund the accepted arrangement"
 COLDWAR_SYR_WAR.5.option_b_outcome_tt:0 "Pay 0.25% of Syria's current GDP and establish the accepted Egyptian joint planning mission for 180 days. It improves maximum planning and organization while increasing bureaucracy expenditure; benefits and burdens end together if the operational mandate or Golan objective lapses."
 COLDWAR_SYR_WAR.5.option_c:0 "Use the existing Egyptian coalition"
 COLDWAR_SYR_WAR.5.option_c_outcome_tt:0 "Recognize the existing Egyptian coalition arrangements and close this offer. Keep their existing effects without another charge or a duplicate Syrian planning bonus."
 COLDWAR_SYR_WAR.6.t:0 "Commit the Operational Window"
 COLDWAR_SYR_WAR.6.d:0 "The General Staff offers two ways to use the preparations already made: a short offensive seeking an early decision, or sustained pressure intended to hold the front and wear down the opponent. Either course will place additional demands on the army."
 COLDWAR_SYR_WAR.6.option_a:0 "Stand down the funded preparations"
 COLDWAR_SYR_WAR.6.option_a_outcome_tt:0 "Stand down this funded window before activation. No offensive or sustained-pressure modifiers are granted; the preparatory expenditure is not refunded."
 COLDWAR_SYR_WAR.6.option_b:0 "Commit the short offensive"
 COLDWAR_SYR_WAR.6.option_b_outcome_tt:0 "Commit the campaign's single operational window to a 60-day short offensive. Attack and maximum planning improve at the cost of higher supply consumption and personnel expenditure; all window effects end together on expiry or loss of the mandate or Golan objective."
 COLDWAR_SYR_WAR.6.option_c:0 "Apply sustained pressure"
 COLDWAR_SYR_WAR.6.option_c_outcome_tt:0 "Commit the campaign's single operational window to 120 days of sustained pressure. Defence and organization improve while personnel expenditure rises and civilian factory output falls; all window effects end together on expiry or loss of the mandate or Golan objective."
 COLDWAR_SYR_WAR.7.t:0 "Syria States Its War Aims"
 COLDWAR_SYR_WAR.7.d:0 "Damascus states that recovery of the occupied Golan is the purpose of its military policy. Israel must decide whether to open a diplomatic channel or reject the Syrian position while the confrontation continues."
 COLDWAR_SYR_WAR.7.option_a:0 "Offer a negotiating channel"
 COLDWAR_SYR_WAR.7.option_a_outcome_tt:0 "Record a willingness to negotiate and notify Damascus that a channel is open. No territorial concession or peace agreement is concluded by this reply."
 COLDWAR_SYR_WAR.7.option_b:0 "Reject the Syrian position"
 COLDWAR_SYR_WAR.7.option_b_outcome_tt:0 "Reject the stated Syrian position and notify Damascus. This reply grants no negotiating consent and changes neither territory nor the war."
 COLDWAR_SYR_WAR.8.t:0 "A Proposal for Disengagement"
 COLDWAR_SYR_WAR.8.d:0 "Syria proposes talks on separation of forces, security guarantees and the future of the Golan. Accepting the discussion would give the governments a channel in which to examine a settlement of the confrontation."
 COLDWAR_SYR_WAR.8.option_a:0 "Decline these terms"
 COLDWAR_SYR_WAR.8.option_a_outcome_tt:0 "Decline the proposed disengagement terms and notify Damascus. No consent, territorial settlement or change to the war is granted."
 COLDWAR_SYR_WAR.8.option_b:0 "Agree to discuss disengagement"
 COLDWAR_SYR_WAR.8.option_b_outcome_tt:0 "Record Israel's consent to discuss disengagement and open a negotiating channel with Damascus. The actual governments and coalition war leaders must still negotiate any peace or territorial settlement through diplomacy."
 COLDWAR_SYR_WAR.9.t:0 "The Diplomatic Channel Reports"
 COLDWAR_SYR_WAR.9.d:0 "The foreign ministry has received the latest replies to its proposals. Ministers must consider which commitments the other governments have accepted and where Syrian policy must proceed without their cooperation."
 COLDWAR_SYR_WAR.9.option_a:0 "Review our commitments"
 COLDWAR_SYR_WAR.9.option_a_outcome_tt:0 "Acknowledge the diplomatic report. This notice grants no new payment, military bonus or territorial settlement; only arrangements that were actually accepted and funded remain in force."
 COLDWAR_SYR_WAR.10.t:0 "The Cabinet Reviews the Campaign"
 COLDWAR_SYR_WAR.10.d:0 "The campaign has brought new demands for personnel, medical support and supplies. Ministers must weigh those commitments against the prospects of recovering the Golan, reaching a negotiated pause or returning the army to its normal establishment."
 COLDWAR_SYR_WAR.10.option_a:0 "Maintain the limited objective"
 COLDWAR_SYR_WAR.10.option_a_outcome_tt:0 "Complete the cabinet's campaign review while maintaining its stated limited objective. Existing operational commitments keep their own expiry dates; no temporary bonus is renewed."
 COLDWAR_SYR_WAR.10.option_b:0 "Seek a negotiated pause"
 COLDWAR_SYR_WAR.10.option_b_outcome_tt:0 "Complete the campaign review and record the cabinet's intention to seek disengagement. Existing commitments keep their expiry dates; a negotiated pause still requires the other governments' agreement."
 COLDWAR_SYR_WAR.10.option_c:0 "Begin demobilization"
 COLDWAR_SYR_WAR.10.option_c_outcome_tt:0 "Complete the campaign review and convene the demobilization decision. The campaign establishment is removed only when demobilization is confirmed in that event."
 COLDWAR_SYR_WAR.11.t:0 "The Operational Window Closes"
 COLDWAR_SYR_WAR.11.d:0 "The opening phase of the campaign has passed. Commanders must take stock of the front and the resources still committed to it before the cabinet decides whether to maintain the wider military effort."
 COLDWAR_SYR_WAR.11.option_a:0 "Take stock of the campaign"
 COLDWAR_SYR_WAR.11.option_a_outcome_tt:0 "End any short-offensive or sustained-pressure package, removing both its advantages and spending burdens. Reserve, supply, joint-planning and medical commitments retain their own expiry dates."
 COLDWAR_SYR_WAR.11.option_b:0 "Review the wider commitments"
 COLDWAR_SYR_WAR.11.option_b_outcome_tt:0 "End both operational-window packages and convene a wider cabinet review. Other campaign commitments retain their own expiry dates until their separate termination or demobilization."
 COLDWAR_SYR_WAR.12.t:0 "Returning the Army to Its Establishment"
 COLDWAR_SYR_WAR.12.d:0 "Returning the army to its normal establishment will release the reserves, supply services and medical resources committed to the campaign. The government must still service its loans and preserve the professional knowledge gained by the armed forces."
 COLDWAR_SYR_WAR.12.option_a:0 "Stand down the campaign establishment"
 COLDWAR_SYR_WAR.12.option_a_outcome_tt:0 "End the operational mandate and appropriation authorization, removing reserve, supply, joint-planning, medical and window packages with their costs. Durable training, public debt and any unexpired emergency-credit premium remain; expenditure already incurred is not refunded."
 COLDWAR_SYR_decision_soviet_training:0 "Request a Soviet Training Mission"
 COLDWAR_SYR_decision_soviet_training_desc:0 "Ask Moscow to provide a military training mission. Soviet approval depends on available assistance capacity and a willingness to support the undertaking. Syria will pay $0.060 billion for hosting only if a new mission begins; an unanswered or declined request creates no training establishment and no hosting bill."
 COLDWAR_SYR_WAR.13.t:0 "Syria Requests a Military Training Mission"
 COLDWAR_SYR_WAR.13.d:0 "Syrian military schools have requested a Soviet training mission. Moscow must decide whether to commit instructors and assistance capacity, while Damascus would meet the agreed hosting costs and prepare its officers to receive the mission."
 COLDWAR_SYR_WAR.13.option_a:0 "Decline the mission"
 COLDWAR_SYR_WAR.13.option_a_outcome_tt:0 "Decline the training request and notify Damascus. No Soviet assistance capacity, political power or recurring aid expenditure is committed, and Syria pays no hosting fee."
 COLDWAR_SYR_WAR.13.option_b:0 "Accept under the assistance programme"
 COLDWAR_SYR_WAR.13.option_b_outcome_tt:0 "Authorize one military training mission. Soviet commitment: 1 assistance-capacity slot and 25 Political Power, plus the agreed weekly assistance expenditure. Syria pays $0.060 billion in hosting costs when the mission starts."
 COLDWAR_SYR_WAR.14.t:0 "The Training-Mission Response"
 COLDWAR_SYR_WAR.14.d:0 "Moscow has answered the request for a training mission. The Defence Ministry must review the agreement and organise its schools around the commitments the two governments have actually made."
 COLDWAR_SYR_WAR.14.option_a:0 "Review the assistance agreement"
 COLDWAR_SYR_WAR.14.option_a_outcome_tt:0 "Review the governments’ training agreement and close the outstanding request."
 COLDWAR_SYR_FOREIGN.213.t:0 "The Training Request Expires"
 COLDWAR_SYR_FOREIGN.213.d:0 "The training request has not resulted in an agreement. The Defence Ministry must review its plans for military education and decide whether a later approach to Moscow would be worthwhile."
 COLDWAR_SYR_FOREIGN.213.option_a:0 "Close the request"
 COLDWAR_SYR_FOREIGN.213.option_a_outcome_tt:0 "Close the expired training request and send it to the cabinet for review. No new mission or hosting payment is activated."
 COLDWAR_SYR_FOREIGN.40.t:0 "International Scrutiny of Syrian Security Operations"
 COLDWAR_SYR_FOREIGN.40.d:0 "Reports of Syrian emergency security operations have reached Washington. The American government must weigh a diplomatic sanctions response against its other interests in the region and the likely effect on relations with Damascus."
 COLDWAR_SYR_FOREIGN.40.option_a:0 "Decline additional sanctions"
 COLDWAR_SYR_FOREIGN.40.option_a_outcome_tt:0 "Decline additional American sanctions. This event adds no new sanctions or Syrian penalties; any sanctions already in force remain governed by their existing terms."
 COLDWAR_SYR_FOREIGN.40.option_b:0 "Impose diplomatic sanctions"
 COLDWAR_SYR_FOREIGN.40.option_b_outcome_tt:0 "Political Power: −35. Impose American diplomatic sanctions on Syria."
 COLDWAR_SYR_decision_development_credit:0 "Negotiate a Development Loan"
 COLDWAR_SYR_decision_development_credit_desc:0 "Request a $0.200 billion development loan from the Soviet Union. Acceptance requires a lender able and willing to supply the money, while Syria incurs an equal public debt. An attractive project does not make the advance free, and opening negotiations does not guarantee that Moscow will finance it."
 COLDWAR_SYR_FOREIGN.101.t:0 "A Syrian Diplomatic Offer Expires"
 COLDWAR_SYR_FOREIGN.101.d:0 "The counterparty did not conclude the proposed contract within ninety days. No payment, project or treaty was activated."
 COLDWAR_SYR_FOREIGN.101.option_a:0 "Close the expired offer"
 COLDWAR_SYR_FOREIGN.101.option_a_outcome_tt:0 "Close the unanswered development-credit offer. No Soviet funds are transferred and no Syrian debt is added."
 COLDWAR_SYR_FOREIGN.1.t:0 "Syria Requests Development Credit"
 COLDWAR_SYR_FOREIGN.1.d:0 "Damascus seeks development credit to support its economic programme. Moscow must decide whether the proposed loan serves Soviet interests and whether it is prepared to commit the funds while Syria assumes responsibility for repayment."
 COLDWAR_SYR_FOREIGN.1.option_a:0 "Decline the loan"
 COLDWAR_SYR_FOREIGN.1.option_a_outcome_tt:0 "Decline the development loan and notify Damascus. Soviet funds remain in the treasury and Syria receives neither cash nor new debt."
 COLDWAR_SYR_FOREIGN.1.option_b:0 "Fund the $0.20 billion loan"
 COLDWAR_SYR_FOREIGN.1.option_b_outcome_tt:0 "Soviet Treasury: −$0.200 billion. Syrian Treasury and Public Debt: +$0.200 billion each. Resolve the immediate currency emergency. Another development-credit draw becomes available after 730 days."
 COLDWAR_SYR_decision_friendship_treaty:0 "Propose a Friendship and Cooperation Treaty"
 COLDWAR_SYR_decision_friendship_treaty_desc:0 "Propose a friendship and cooperation treaty to Moscow, setting out a more durable basis for consultation. The Soviet government may accept or decline the terms. An accepted agreement strengthens the relationship, while further aid, loans and joint undertakings remain subjects for their own negotiations."
 COLDWAR_SYR_FOREIGN.102.t:0 "A Syrian Diplomatic Offer Expires"
 COLDWAR_SYR_FOREIGN.102.d:0 "The counterparty did not conclude the proposed contract within ninety days. No payment, project or treaty was activated."
 COLDWAR_SYR_FOREIGN.102.option_a:0 "Close the expired offer"
 COLDWAR_SYR_FOREIGN.102.option_a_outcome_tt:0 "Close the unanswered friendship-treaty proposal. No treaty commitment or additional diplomatic-relations modifier is created."
 COLDWAR_SYR_FOREIGN.2.t:0 "A Syrian Friendship Treaty"
 COLDWAR_SYR_FOREIGN.2.d:0 "Damascus proposes a treaty of consultation and respect for sovereignty. The agreement would provide a lasting diplomatic framework for cooperation while leaving military assistance and other financial commitments to negotiations on their own terms."
 COLDWAR_SYR_FOREIGN.2.option_a:0 "Decline the treaty"
 COLDWAR_SYR_FOREIGN.2.option_a_outcome_tt:0 "Decline the treaty and notify Damascus. This proposal adds no consultation commitment, financial transfer or diplomatic-relations bonus."
 COLDWAR_SYR_FOREIGN.2.option_b:0 "Sign the consultation treaty"
 COLDWAR_SYR_FOREIGN.2.option_b_outcome_tt:0 "Conclude a five-year consultation treaty. Bilateral Opinion: +25. Further military and financial commitments require agreement."
 COLDWAR_SYR_decision_gulf_project:0 "Offer a Gulf-Funded Civil Project"
 COLDWAR_SYR_decision_gulf_project_desc:0 "Present a civil development project to a Gulf partner. The proposed $0.200 billion contribution must come from a government prepared to approve and finance it. Only an accepted, funded agreement can produce the selected project; diplomatic interest and a pending offer do not pay the construction bill."
 COLDWAR_SYR_decision_gulf_finance:0 "Approach a Gulf Project Partner"
 COLDWAR_SYR_decision_gulf_finance_desc:0 "Approach a Gulf government with a concrete Syrian development proposal. A prospective partner must judge the project and approve the use of its own treasury. The negotiation offers a route to financed construction, while preserving the other government's right to decline or let the proposal lapse."
 COLDWAR_SYR_decision_funded_project:0 "Offer a Funded Development Project"
 COLDWAR_SYR_decision_funded_project_desc:0 "Put forward a specific development undertaking with a partner and a real source of finance. The proposed $0.200 billion contribution will be paid only after acceptance, supporting one agreed project. The offer can expire without construction if the other government decides not to commit its resources."
 COLDWAR_SYR_FOREIGN.20.t:0 "Choose a Project Partner"
 COLDWAR_SYR_FOREIGN.20.d:0 "The cabinet intends to seek external funding for a civil project. Its delegation must choose which government to approach and present a proposal that offers the prospective donor a reason to support Syrian development."
 COLDWAR_SYR_FOREIGN.20.option_a:0 "Withdraw the project proposal"
 COLDWAR_SYR_FOREIGN.20.option_a_outcome_tt:0 "Withdraw the civil-project proposal before approaching a donor. No grant is charged, reserved or spent, and no building is constructed."
 COLDWAR_SYR_FOREIGN.20.option_b:0 "Submit the $0.20 billion proposal to Saudi Arabia"
 COLDWAR_SYR_FOREIGN.20.option_b_outcome_tt:0 "Ask Saudi Arabia to fund one $0.200 billion civil project. Its government must consent and pay from its own treasury; this request alone provides Syria with neither cash nor a building."
 COLDWAR_SYR_FOREIGN.20.option_c:0 "Submit the $0.20 billion proposal to Kuwait"
 COLDWAR_SYR_FOREIGN.20.option_c_outcome_tt:0 "Ask Kuwait to fund one $0.200 billion civil project. Its government must consent and pay from its own treasury; this request alone provides Syria with neither cash nor a building."
 COLDWAR_SYR_FOREIGN.20.option_d:0 "Submit the $0.20 billion proposal to the Soviet Union"
 COLDWAR_SYR_FOREIGN.20.option_d_outcome_tt:0 "Ask the Soviet Union to fund one $0.200 billion civil project under the agreed project programme. Its government must consent and pay from its own treasury; this request alone provides Syria with neither cash nor a building."
 COLDWAR_SYR_FOREIGN.21.t:0 "A Syrian Civil Project Proposal"
 COLDWAR_SYR_FOREIGN.21.d:0 "Damascus requests a grant for a civil project. The prospective donor must decide whether to finance construction in Syria, with the funds committed to the agreed work or returned if the project cannot proceed."
 COLDWAR_SYR_FOREIGN.21.option_a:0 "Decline the proposal"
 COLDWAR_SYR_FOREIGN.21.option_a_outcome_tt:0 "Decline the Syrian civil project and notify Damascus. No donor funds are charged and Syria receives no project reserve or building."
 COLDWAR_SYR_FOREIGN.21.option_b:0 "Fund the civil project"
 COLDWAR_SYR_FOREIGN.21.option_b_outcome_tt:0 "Commit $0.200 billion to the Syrian civil project. The grant finances one agreed construction project and can be returned to the donor if construction cannot proceed."
 COLDWAR_SYR_FOREIGN.22.t:0 "Allocate the Funded Civil Project"
 COLDWAR_SYR_FOREIGN.22.d:0 "The donor has provided funding for a civil project. Ministers must choose between a civilian workshop in Damascus and improvements to the Latakia road network, or return the grant if the agreed construction cannot proceed."
 COLDWAR_SYR_FOREIGN.22.option_a:0 "Return the reserved grant to the donor"
 COLDWAR_SYR_FOREIGN.22.option_a_outcome_tt:0 "Return the $0.200 billion grant to the donor and close the civil project."
 COLDWAR_SYR_FOREIGN.22.option_b:0 "Build one civilian workshop in Damascus"
 COLDWAR_SYR_FOREIGN.22.option_b_outcome_tt:0 "Complete 1 Civilian Industry in Damascus using the agreed grant. Requires Syrian ownership, control and building capacity."
 COLDWAR_SYR_FOREIGN.22.option_c:0 "Improve the Latakia road network"
 COLDWAR_SYR_FOREIGN.22.option_c_outcome_tt:0 "Complete 1 Infrastructure level in Latakia using the agreed grant. Requires Syrian ownership, control and building capacity."
 COLDWAR_SYR_FOREIGN.121.t:0 "The Civil Project Offer Expires"
 COLDWAR_SYR_FOREIGN.121.d:0 "The prospective donor has not agreed to fund the civil project within the consultation period. The cabinet must decide how its development programme can proceed without that commitment."
 COLDWAR_SYR_FOREIGN.121.option_a:0 "Close the proposal"
 COLDWAR_SYR_FOREIGN.121.option_a_outcome_tt:0 "Close the unanswered civil-project proposal. The prospective donor retains its funds; Syria receives no project reserve, cash or building."
 COLDWAR_SYR_decision_pipeline:0 "Negotiate Iraq Pipeline Operations"
 COLDWAR_SYR_decision_pipeline_desc:0 "Invite Iraq to agree operating rights and transit payments for the pipeline through Syria. An accepted arrangement can support regular revenue and practical cooperation, but the route earns nothing while negotiations remain unsettled. Payment difficulties or a diplomatic rupture can bring the operation to an end."
 COLDWAR_SYR_FOREIGN.103.t:0 "A Syrian Diplomatic Offer Expires"
 COLDWAR_SYR_FOREIGN.103.d:0 "The counterparty did not conclude the proposed contract within ninety days. No payment, project or treaty was activated."
 COLDWAR_SYR_FOREIGN.103.option_a:0 "Close the expired offer"
 COLDWAR_SYR_FOREIGN.103.option_a_outcome_tt:0 "Close the unanswered pipeline proposal. No transit agreement or weekly payment begins."
 COLDWAR_SYR_decision_iraq_transit:0 "Open Pipeline Negotiations with Iraq"
 COLDWAR_SYR_decision_iraq_transit_desc:0 "Open formal pipeline negotiations with Baghdad over operating rights, transit payments and the conditions needed to keep the route working. Until the two governments accept an arrangement, Syria cannot count on transit income. An operating contract will remain dependent on payment and a workable bilateral relationship."
 COLDWAR_SYR_FOREIGN.3.t:0 "Proposed Syrian Pipeline Transit Terms"
 COLDWAR_SYR_FOREIGN.3.d:0 "Damascus offers Iraq a one-year agreement for pipeline transit through Syria. Baghdad would obtain improved access to fuel and pay a weekly transit fee; Syria would maintain the administration needed to keep the route operating."
 COLDWAR_SYR_FOREIGN.3.option_a:0 "Decline the transit contract"
 COLDWAR_SYR_FOREIGN.3.option_a_outcome_tt:0 "Decline the proposed transit contract and notify Damascus. No pipeline benefits, administration burden or transit payments begin."
 COLDWAR_SYR_FOREIGN.3.option_b:0 "Accept the one-year operating contract"
 COLDWAR_SYR_FOREIGN.3.option_b_outcome_tt:0 "One-year pipeline agreement. Iraq: Fuel Acquisition +2%; pays Syria $0.00093 billion per week. Syria: receives $0.00093 billion per week; Bureaucracy Costs +2.4%. War, withdrawal or inability to pay ends the agreement."
 COLDWAR_SYR_decision_federation:0 "Propose an Arab Federal Agreement"
 COLDWAR_SYR_decision_federation_desc:0 "Offer a federal cooperation agreement to an Arab partner, identifying a basis for closer consultation without assuming that sovereignty has already been surrendered. The other government must decide whether to accept. A signed agreement opens cooperation; any eventual political union would require a separate and explicit settlement."
 COLDWAR_SYR_FOREIGN.4.t:0 "A Proposed Arab Federal Consultation"
 COLDWAR_SYR_FOREIGN.4.d:0 "Damascus proposes a framework for consultation and voluntary Arab cooperation. Each government must decide whether regular political coordination will serve its interests and how far it is prepared to support closer relations with Syria."
 COLDWAR_SYR_FOREIGN.4.option_a:0 "Decline the framework"
 COLDWAR_SYR_FOREIGN.4.option_a_outcome_tt:0 "Decline this government's participation and notify Damascus. This reply grants no federal commitment or opinion improvement and does not undo another government's separately accepted agreement."
 COLDWAR_SYR_FOREIGN.4.option_b:0 "Sign the consultation framework"
 COLDWAR_SYR_FOREIGN.4.option_b_outcome_tt:0 "Sign a five-year consultation framework. Bilateral Opinion with Syria: +25. Closer political integration remains a matter for negotiation."
 COLDWAR_SYR_FOREIGN.104.t:0 "Federal Consultations Close"
 COLDWAR_SYR_FOREIGN.104.d:0 "The consultation period has ended. Damascus must now frame its Arab policy around the governments that accepted the proposed cooperation and the partners that chose to remain outside it."
 COLDWAR_SYR_FOREIGN.104.option_a:0 "Record the partners' positions"
 COLDWAR_SYR_FOREIGN.104.option_a_outcome_tt:0 "Close the period for federal consultation offers. Only governments that actually signed retain their accepted commitments and bilateral opinion effects; this notice enrolls no additional country."
 COLDWAR_SYR_decision_golan:0 "Offer a Golan Negotiating Package"
 COLDWAR_SYR_decision_golan_desc:0 "Send Israel a package for discussions on disengagement, security and the occupied Golan. Acceptance would establish a negotiating channel, leaving the actual terms to the governments concerned. Neither the proposal nor a willingness to talk transfers territory or settles the war on behalf of other belligerents."
 COLDWAR_SYR_FOREIGN.5.t:0 "A Golan Negotiating Package"
 COLDWAR_SYR_FOREIGN.5.d:0 "Syria proposes staged disengagement, security guarantees and discussion of the Golan. The Israeli government must decide whether these terms offer a basis for negotiations with Damascus and the other governments involved in the conflict."
 COLDWAR_SYR_FOREIGN.5.option_a:0 "Decline these terms"
 COLDWAR_SYR_FOREIGN.5.option_a_outcome_tt:0 "Decline the Golan negotiating package and notify Damascus. No consent, territorial transfer or change to the war is granted."
 COLDWAR_SYR_FOREIGN.5.option_b:0 "Accept talks on the package"
 COLDWAR_SYR_FOREIGN.5.option_b_outcome_tt:0 "Accept talks on disengagement and the Golan. Territorial and peace terms remain to be negotiated."
 COLDWAR_SYR_FOREIGN.105.t:0 "The Golan Proposal Expires"
 COLDWAR_SYR_FOREIGN.105.d:0 "The Golan proposal has not produced an agreement. The cabinet must consider whether to return to talks later or rely on its other means of pursuing the Syrian position."
 COLDWAR_SYR_FOREIGN.105.option_a:0 "Close the offer"
 COLDWAR_SYR_FOREIGN.105.option_a_outcome_tt:0 "Close the unanswered Golan offer. No territory, money, negotiating consent or war status changes."
 COLDWAR_SYR_decision_joint_plan:0 "Offer Joint Operational Planning"
 COLDWAR_SYR_decision_joint_plan_desc:0 "Offer Egypt 180 days of staff cooperation. If Cairo accepts, Syria will contribute 0.25% of its current GDP and maintain the additional planning establishment. The mission can improve coordination without committing either government to an automatic offensive or duplicating an existing Egyptian planning arrangement."
 COLDWAR_SYR_FOREIGN.109.t:0 "A Syrian Diplomatic Offer Expires"
 COLDWAR_SYR_FOREIGN.109.d:0 "The counterparty did not conclude the proposed contract within ninety days. No payment, project or treaty was activated."
 COLDWAR_SYR_FOREIGN.109.option_a:0 "Close the expired offer"
 COLDWAR_SYR_FOREIGN.109.option_a_outcome_tt:0 "Close the unanswered staff-cooperation offer. No planning mission or additional spending is activated."
 COLDWAR_SYR_FOREIGN.9.t:0 "A Syrian Staff-Cooperation Offer"
 COLDWAR_SYR_FOREIGN.9.d:0 "Damascus proposes a joint staff mission to improve the two armies’ planning and organisation. Syria would fund the mission and maintain its administrative establishment, while Egypt would retain command of its forces and its own military policy."
 COLDWAR_SYR_FOREIGN.9.option_a:0 "Decline the mission"
 COLDWAR_SYR_FOREIGN.9.option_a_outcome_tt:0 "Decline the staff mission and notify Damascus. Syria pays no mission fee and receives no new planning or organization package."
 COLDWAR_SYR_FOREIGN.9.option_b:0 "Accept the staff cooperation"
 COLDWAR_SYR_FOREIGN.9.option_b_outcome_tt:0 "Accept 180 days of staff cooperation. Syria pays 0.25% of annual GDP; Maximum Planning +4%, Army Organization +2%, Bureaucracy Costs +3%. Requires an available joint-planning commitment."
 COLDWAR_SYR_decision_lebanon:0 "Offer Lebanese Security Assistance"
 COLDWAR_SYR_decision_lebanon_desc:0 "Offer Lebanon a limited security assistance mission under a revocable invitation. The Lebanese government must accept before Syria can consider deployment, and the operation will require separate authorization and funding. An invitation is a negotiated responsibility, not a transfer of Lebanese sovereignty or control of its forces."
 COLDWAR_SYR_FOREIGN.106.t:0 "A Syrian Diplomatic Offer Expires"
 COLDWAR_SYR_FOREIGN.106.d:0 "The counterparty did not conclude the proposed contract within ninety days. No payment, project or treaty was activated."
 COLDWAR_SYR_FOREIGN.106.option_a:0 "Close the expired offer"
 COLDWAR_SYR_FOREIGN.106.option_a_outcome_tt:0 "Close the unanswered Lebanese assistance offer. No invitation, deployment or Syrian setup payment is activated."
 COLDWAR_SYR_FOREIGN.6.t:0 "Syria Offers Limited Security Assistance"
 COLDWAR_SYR_FOREIGN.6.d:0 "Damascus seeks a revocable Lebanese invitation for limited security assistance. The Lebanese government must weigh the proposed mission against its authority over internal affairs, while Syria would bear the cost of any deployment it subsequently authorizes."
 COLDWAR_SYR_FOREIGN.6.option_a:0 "Decline the mission"
 COLDWAR_SYR_FOREIGN.6.option_a_outcome_tt:0 "Decline the assistance proposal and notify Damascus. Syria receives no invitation, deployment authority or military-access rights from this offer."
 COLDWAR_SYR_FOREIGN.6.option_b:0 "Issue the revocable invitation"
 COLDWAR_SYR_FOREIGN.6.option_b_outcome_tt:0 "Invite Syrian security assistance for up to one year. Lebanon may revoke the invitation. Syria must subsequently authorize and fund any 180-day mission."
 COLDWAR_SYR_decision_authorize_mission:0 "Negotiate a Limited Foreign Mission"
 COLDWAR_SYR_decision_authorize_mission_desc:0 "Act on Lebanon's accepted invitation and authorize the limited assistance mission. Syria must pay $0.080 billion in setup costs and support personnel and fuel commitments for up to 180 days. The Lebanese government can revoke its invitation, and the mission does not assume authority over its territory or armed forces."
 COLDWAR_SYR_decision_regional_withdrawal:0 "Review and Withdraw a Foreign Mission"
 COLDWAR_SYR_decision_regional_withdrawal_desc:0 "Withdraw the accepted Lebanese assistance mission and close its invitation. The temporary military benefits and the personnel and fuel commitments will end together. Syria will retain the knowledge already acquired and remain responsible for its public debts, while ending this particular foreign obligation."
 COLDWAR_SYR_decision_hard_currency:0 "Respond to a Hard-Currency Crisis"
 COLDWAR_SYR_decision_hard_currency_desc:0 "Foreign exchange shortages have brought competing demands to the cabinet. Consider six months of subsidy restraint or import compression, accepting the hardship each causes, or seek a negotiated development loan which adds debt if approved. Deferring the choice leaves the crisis awaiting a funded response."
 COLDWAR_SYR_FOREIGN.7.t:0 "A Hard-Currency Emergency"
 COLDWAR_SYR_FOREIGN.7.d:0 "Foreign exchange is running short as the government struggles to maintain essential imports and its domestic commitments. Ministers must choose between reducing subsidies, compressing imported inputs or seeking a Soviet loan to ease the immediate pressure."
 COLDWAR_SYR_FOREIGN.7.option_a:0 "Defer the package"
 COLDWAR_SYR_FOREIGN.7.option_a_outcome_tt:0 "Defer a response. The hard-currency emergency remains unresolved; no relief package, loan or cash transfer is activated."
 COLDWAR_SYR_FOREIGN.7.option_b:0 "Restrain subsidies"
 COLDWAR_SYR_FOREIGN.7.option_b_outcome_tt:0 "For 180 days: Social Costs −4.8%; Stability −3 percentage points. Resolve the immediate currency emergency."
 COLDWAR_SYR_FOREIGN.7.option_c:0 "Compress imported inputs"
 COLDWAR_SYR_FOREIGN.7.option_c_outcome_tt:0 "For 180 days: Bureaucracy Costs −2.4%; Factory Output −4%; Stability −2 percentage points. Resolve the immediate currency emergency."
 COLDWAR_SYR_FOREIGN.7.option_d:0 "Request a $0.20 billion loan"
 COLDWAR_SYR_FOREIGN.7.option_d_outcome_tt:0 "Request a $0.200 billion development loan from Moscow. Funding requires Soviet approval; the currency emergency continues while talks remain unresolved."
 COLDWAR_SYR_iranian_supply_credit:0 "Iranian Supply Credit"
 COLDWAR_SYR_iranian_supply_credit_desc:0 "A one-year supply credit improves fuel acquisition. The $0.10 billion principal remains Syrian public debt; an additional 0.15 percentage-point interest premium applies while the arrangement lasts."
 COLDWAR_SYR_decision_iran_oil:0 "Negotiate an Iranian Supply Arrangement"
 COLDWAR_SYR_decision_iran_oil_desc:0 "Approach the post-revolutionary Iranian government for a one-year supply and credit arrangement. Accepted terms provide a $0.100 billion advance with equal Syrian debt and a temporary interest premium. Continued supply cooperation depends on the political relationship; its collapse will not erase money Syria has already borrowed."
 COLDWAR_SYR_FOREIGN.108.t:0 "A Syrian Diplomatic Offer Expires"
 COLDWAR_SYR_FOREIGN.108.d:0 "The counterparty did not conclude the proposed contract within ninety days. No payment, project or treaty was activated."
 COLDWAR_SYR_FOREIGN.108.option_a:0 "Close the expired offer"
 COLDWAR_SYR_FOREIGN.108.option_a_outcome_tt:0 "Close the unanswered Iranian supply-credit request. No Iranian payment, Syrian debt or supply-credit benefit is activated."
 COLDWAR_SYR_FOREIGN.8.t:0 "A Syrian Supply and Credit Request"
 COLDWAR_SYR_FOREIGN.8.d:0 "Damascus seeks an Iranian credit advance to support fuel supplies for the coming year. Tehran must decide whether to finance the arrangement, while Syria would assume the resulting debt and the agreed borrowing premium."
 COLDWAR_SYR_FOREIGN.8.option_a:0 "Decline the request"
 COLDWAR_SYR_FOREIGN.8.option_a_outcome_tt:0 "Decline the supply-credit request and notify Damascus. Iranian funds remain in the treasury and Syria receives neither an advance, new debt nor a supply-credit package."
 COLDWAR_SYR_FOREIGN.8.option_b:0 "Approve the financed supply arrangement"
 COLDWAR_SYR_FOREIGN.8.option_b_outcome_tt:0 "Iranian Treasury: −$0.100 billion. Syrian Treasury and Public Debt: +$0.100 billion each. Fuel Acquisition: +3% for one year; borrowing premium: +0.15 percentage points. Political rupture or war ends the programme; the debt remains payable."
 COLDWAR_SYR_treaty_relations:0 "Syrian Consultation Agreement"
 COLDWAR_SYR_foreign_dossier:0 "Foreign Commitments and Golan Operations"
 COLDWAR_SYR_foreign_dossier_desc:0 "Manage Syria's foreign commitments and preparations around the occupied Golan. Agreements need willing partners, while operations require a political mandate, appropriations and support services. Consider what the country can sustain before turning a diplomatic promise or a military plan into an active obligation."
 COLDWAR_SYR_revoke_invitation:0 "Revoke the Syrian Assistance Invitation"
 COLDWAR_SYR_revoke_invitation_desc:0 "End the accepted cooperation terms. The corresponding benefits, expenses and future payments cease together. Existing public debt remains payable."
 COLDWAR_SYR_suspend_pipeline:0 "Suspend the Syrian Pipeline Contract"
 COLDWAR_SYR_suspend_pipeline_desc:0 "End the accepted cooperation terms. The corresponding benefits, expenses and future payments cease together. Existing public debt remains payable."
 COLDWAR_SYR_counterparty_dossier:0 "Syrian Bilateral Commitments"
 COLDWAR_SYR_counterparty_dossier_desc:0 "Review the assistance and transit commitments agreed with Damascus. Cooperation remains subject to this government's consent and the continued fulfilment of the terms. An invitation or operating agreement can be ended when it no longer serves the interests for which it was accepted."
