l_english:
# IMPERIA CW — Cold War: Integrated SOV 1985 focus — English localisation.
 SOV_1985_focus: "Soviet Union 1985"
 SOV_1985_focus_desc: "The Soviet Union begins in 1985 with a vast army, a tired planned economy, loyal but nervous republics and a party that no longer fully believes its own ritual language."
 SOV_1985_chernenkos_last_winter: "Chernenko's Last Winter"
 SOV_1985_chernenkos_last_winter_desc: "The Union begins 1985 old, armed, afraid and exhausted. The machine still obeys Moscow, but every ministry knows the numbers are worse than the speeches."
 SOV_1985_the_general_secretary_question: "The General Secretary Question"
 SOV_1985_the_general_secretary_question_desc: "The succession cannot be treated as another ritual. If the party chooses renewal, the apparatus will resist; if it chooses paralysis, the country will pay."
 SOV_1985_cautious_glasnost: "Cautious Glasnost"
 SOV_1985_cautious_glasnost_desc: "Let carefully chosen truths into public life. Debate can restore legitimacy, but even a controlled opening teaches people how to speak."
 SOV_1985_controlled_newspapers_focus: "Controlled Newspapers"
 SOV_1985_controlled_newspapers_focus_desc: "Permit criticism only through approved channels and approved editors. The organs will read every page before the people do."
 SOV_1985_the_writers_return: "The Writers Return"
 SOV_1985_the_writers_return_desc: "Novelists, historians and dissident intellectuals can become the conscience of reform, or the first crack in the monopoly of truth."
 SOV_1985_the_archives_question: "The Archives Question"
 SOV_1985_the_archives_question_desc: "Opening the Stalin-era record gives reformers moral force and gives hardliners a list of enemies."
 SOV_1985_no_return_to_silence: "No Return to Silence"
 SOV_1985_no_return_to_silence_desc: "Once fear begins to fade, the old command language stops sounding inevitable."
 SOV_1985_admit_stagnation: "Admit Stagnation"
 SOV_1985_admit_stagnation_desc: "The plan is not merely slowing; it is lying. Admitting the crisis hurts stability now, but makes serious reform possible."
 SOV_1985_anti_alcohol_campaign: "Anti-Alcohol Campaign"
 SOV_1985_anti_alcohol_campaign_desc: "Discipline the workforce and attack social decay. The budget, the shops and the black market will all answer back."
 SOV_1985_rebuild_the_plan: "Rebuild the Plan"
 SOV_1985_rebuild_the_plan_desc: "Technocrats can still repair parts of the command economy, if the ministries stop protecting their own failures."
 SOV_1985_enterprise_experiment: "Enterprise Experiment"
 SOV_1985_enterprise_experiment_desc: "Give factories limited autonomy and measure what happens before the entire plan is placed at risk."
 SOV_1985_consumer_goods_emergency: "Consumer Goods Emergency"
 SOV_1985_consumer_goods_emergency_desc: "Empty shelves are becoming a political fact. Diverting resources to civilian supply buys time, not a solution."
 SOV_1985_prices_tell_the_truth: "Prices Tell the Truth"
 SOV_1985_prices_tell_the_truth_desc: "The price system can expose waste, but the public will see the shortages with new clarity."
 SOV_1985_socialist_market_union: "Socialist Market Union"
 SOV_1985_socialist_market_union_desc: "Try to bind the Union together with socialist ownership, enterprise autonomy and a negotiated economic bargain."
 SOV_1985_andropovs_unfinished_state_focus: "Andropov's Unfinished State"
 SOV_1985_andropovs_unfinished_state_focus_desc: "The security organs believe discipline and audits can rescue socialism before openness turns into collapse."
 SOV_1985_the_organs_audit_the_party: "The Organs Audit the Party"
 SOV_1985_the_organs_audit_the_party_desc: "Use the KGB to attack privilege inside the party. It weakens the nomenklatura and strengthens the men with files."
 SOV_1985_afghan_war_review: "Afghan War Review"
 SOV_1985_afghan_war_review_desc: "Afghanistan bleeds prestige, manpower and money. A review may prepare withdrawal, but the military will hear doubt."
 SOV_1985_hold_the_warsaw_pact: "Hold the Warsaw Pact"
 SOV_1985_hold_the_warsaw_pact_desc: "The eastern alliance still obeys Moscow, but its discipline must be actively maintained. Unlocks bloc-wide security coordination and cheap energy exports in the Moscow Leverage decisions."
 SOV_1985_star_wars_pressure: "Star Wars Pressure"
 SOV_1985_star_wars_pressure_desc: "The American strategic challenge forces painful choices between prestige, missiles, computers and bread."
 SOV_1985_arms_control_feelers: "Arms Control Feelers"
 SOV_1985_arms_control_feelers_desc: "Explore negotiations without admitting weakness. Lower pressure abroad can give reform a little oxygen at home."
 SOV_1985_the_union_contract: "The Union Contract"
 SOV_1985_the_union_contract_desc: "The republics obey Moscow, but obedience is no longer the same as belief."
 SOV_1985_listen_to_the_republics_focus: "Listen to the Republics"
 SOV_1985_listen_to_the_republics_focus_desc: "A negotiated Union may survive where a commanded one fails, though every compromise teaches the republics their own strength."
 SOV_1985_baltic_first_secretaries: "Baltic First Secretaries"
 SOV_1985_baltic_first_secretaries_desc: "Keep the Baltic party machines aligned before civic fronts become permanent political institutions."
 SOV_1985_ukrainian_grain_and_coal: "Ukrainian Grain and Coal"
 SOV_1985_ukrainian_grain_and_coal_desc: "Ukraine remains essential to the Union's food, energy and industry. Moscow must bargain as well as command."
 SOV_1985_language_laws_compromise: "Language Laws Compromise"
 SOV_1985_language_laws_compromise_desc: "Cultural concessions may calm the republics while angering those who believe the Union should speak only with Moscow's voice."
 SOV_1985_new_union_treaty_draft: "Draft a New Union Treaty"
 SOV_1985_new_union_treaty_draft_desc: "A renewed federation could save the state, but the old guard will see the draft as surrender."
 SOV_1985_the_workers_speak_focus: "The Workers Speak"
 SOV_1985_the_workers_speak_focus_desc: "Workers can anchor reform in socialist legitimacy, unless shortages convince them that slogans are cheaper than soap."
 SOV_1985_donbass_miners_demands: "Donbass Miners' Demands"
 SOV_1985_donbass_miners_demands_desc: "The miners want wages, soap, equipment and respect. Meeting them costs power; ignoring them costs authority."
 SOV_1985_nuclear_safety_files: "Nuclear Safety Files"
 SOV_1985_nuclear_safety_files_desc: "Industrial secrecy hides dangerous systems. Reviewing nuclear safety empowers technocrats and environmental critics alike."
 SOV_1985_gulag_files: "The Gulag Files"
 SOV_1985_gulag_files_desc: "The terror state left records as well as graves. Releasing selected files gives reform moral force, but the KGB and the old guard will not forgive it."
 SOV_1985_congress_of_peoples_deputies: "Congress of People's Deputies"
 SOV_1985_congress_of_peoples_deputies_desc: "A supervised national congress can renew Soviet legitimacy, or become the first institution that speaks louder than the party apparatus."
 SOV_1985_socialism_reforged: "Socialism Reforged"
 SOV_1985_socialism_reforged_desc: "Bind reform to workers, councils and a renewed Union instead of surrendering socialism to either bureaucrats or shock therapists."
 SOV_1985_the_liberal_break: "The Liberal Break"
 SOV_1985_the_liberal_break_desc: "If the monopoly cracks far enough, urban liberals and economists will demand legality, markets and western credit at a speed the Union may not survive."
 SOV_1985_law_on_state_enterprise: "Law on State Enterprise"
 SOV_1985_law_on_state_enterprise_desc: "Give enterprises greater responsibility for output, contracts and revenue. The ministries lose some control; directors learn they can bargain."
 SOV_1985_legalize_cooperatives: "Legalize Cooperatives"
 SOV_1985_legalize_cooperatives_desc: "Cooperatives can ease shortages and absorb the shadow market, but they also create new wealth outside old party discipline."
 SOV_1985_rebuild_consumer_supply: "Rebuild Consumer Supply"
 SOV_1985_rebuild_consumer_supply_desc: "The legitimacy of reform will be measured in soap, shoes, meat and queues. Redirecting resources to consumers buys breathing room."
 SOV_1985_western_joint_ventures: "Western Joint Ventures"
 SOV_1985_western_joint_ventures_desc: "Invite limited western capital and technology into a still-socialist economy. The benefits are obvious, and so are the security risks."
 SOV_1985_directors_union: "The Directors' Union"
 SOV_1985_directors_union_desc: "Industrial directors, ministry fixers and party-capital networks can turn autonomy into a new ruling bargain before anyone calls it capitalism."
 SOV_1985_infiltrate_popular_fronts: "Infiltrate the Popular Fronts"
 SOV_1985_infiltrate_popular_fronts_desc: "The Baltic and republican movements must be watched from within before civic committees become parallel governments."
 SOV_1985_emergency_discipline: "Emergency Discipline"
 SOV_1985_emergency_discipline_desc: "Reform without control is collapse. Restore fear, party lines and obedience before the language of openness outruns the state."
 SOV_1985_the_quiet_union: "The Quiet Union"
 SOV_1985_the_quiet_union_desc: "A security-guided Union can reform technically while denying politics the oxygen that destroyed earlier experiments."
 SOV_1985_save_union_by_force: "Save the Union by Force"
 SOV_1985_save_union_by_force_desc: "If persuasion fails, the army and the organs can still impose obedience. The cost will be paid in legitimacy and blood."
 SOV_1985_committee_for_national_salvation: "Committee for National Salvation"
 SOV_1985_committee_for_national_salvation_desc: "A military-patriotic emergency committee can claim to rescue the Union from chaos, reformers and republic nationalism."
 SOV_1985_geneva_summit: "The Geneva Summit"
 SOV_1985_geneva_summit_desc: "A serious meeting with Washington can reduce pressure abroad and prove that the new leadership is more than another funeral procession."
 SOV_1985_reykjavik_proposal: "The Reykjavik Proposal"
 SOV_1985_reykjavik_proposal_desc: "Radical arms control could break the strategic spiral, but generals and hardliners will hear it as dangerous idealism."
 SOV_1985_afghanistan_exit_strategy: "Afghanistan Exit Strategy"
 SOV_1985_afghanistan_exit_strategy_desc: "Prepare a way out of the Afghan war without admitting defeat. Reform needs resources and credibility more than another year of attrition."
 SOV_1985_the_withdrawal_timetable: "The Withdrawal Timetable"
 SOV_1985_the_withdrawal_timetable_desc: "Set the machinery of withdrawal in motion. The army will grumble, but every month saved in Afghanistan strengthens reform at home."
 SOV_1985_warsaw_pact_reform: "Reform the Warsaw Pact"
 SOV_1985_warsaw_pact_reform_desc: "The alliance can no longer be held by tanks alone. A looser pact may survive where a rigid empire would crack. Unlocks renewed Tirana channels in the Moscow Leverage decisions."
 SOV_1985_sinatra_doctrine_seed: "Seeds of the Sinatra Doctrine"
 SOV_1985_sinatra_doctrine_seed_desc: "Let the eastern allies find their own road, at least in theory. Moscow gains trust abroad and anxiety inside every hardliner office."
 SOV_1985_kazakh_december_question: "The Kazakh December Question"
 SOV_1985_kazakh_december_question_desc: "Alma-Ata shows that republican dignity is no longer a Baltic issue alone. Moscow can contain the streets, but not erase the lesson."
 SOV_1985_caucasus_pressure: "Caucasus Pressure"
 SOV_1985_caucasus_pressure_desc: "The Caucasus carries old grievances, borders and fears. A reforming Union must handle national conflict before it becomes a test of state power."
 SOV_1985_sovereignty_inside_union: "Sovereignty Inside the Union"
 SOV_1985_sovereignty_inside_union_desc: "Recognize republican rights inside a common state. It may save the Union by admitting that Moscow no longer owns every answer."
 SOV_1985_yeltsins_moscow_platform: "Yeltsin's Moscow Platform"
 SOV_1985_yeltsins_moscow_platform_desc: "A Russian tribune can turn reform against the party center itself. The RSFSR begins to discover its own political weight."
 SOV_1985_rsfsr_steps_forward: "The RSFSR Steps Forward"
 SOV_1985_rsfsr_steps_forward_desc: "When Russia demands sovereignty, the Union's core becomes its greatest threat."
 SOV_1985_union_of_sovereign_republics: "Union of Sovereign Republics"
 SOV_1985_union_of_sovereign_republics_desc: "A new federal bargain can preserve a common state, but only by ending the fiction that the old Union still exists unchanged."
 SOV_1985_the_chernobyl_question_focus: "The Chernobyl Question"
 SOV_1985_the_chernobyl_question_focus_desc: "Nuclear secrecy, bureaucratic fear and public truth collide. The disaster can be buried as a file or made into a reason for renewal."
 SOV_1985_aral_sea_cannot_speak: "The Aral Sea Cannot Speak"
 SOV_1985_aral_sea_cannot_speak_desc: "The drying sea is an indictment of command targets, cotton plans and silence. Environmental politics now has a Soviet language."
 SOV_1985_restore_worker_councils: "Restore Worker Councils"
 SOV_1985_restore_worker_councils_desc: "Worker councils can give socialism a democratic base, but every council weakens the bureaucrats who once spoke in the workers' name."
 SOV_1985_break_nomenklatura_privilege: "Break Nomenklatura Privilege"
 SOV_1985_break_nomenklatura_privilege_desc: "Attack special shops, closed clinics and protected careers. The public will cheer, and the apparatus will remember."
 SOV_1985_ecological_soviet_renewal: "Ecological Soviet Renewal"
 SOV_1985_ecological_soviet_renewal_desc: "Make public health, environmental repair and socialist democracy part of one renewal project rather than separate dissident causes."
 SOV_1985_public_health_sobriety: "Public Health Sobriety"
 SOV_1985_public_health_sobriety_desc: "Treat alcoholism as a social and medical crisis instead of only a police problem."
 SOV_1985_police_sobriety_raids: "Police Sobriety Raids"
 SOV_1985_police_sobriety_raids_desc: "Use administrative discipline and the organs to force sobriety into factories and streets."
 SOV_1985_sobriety_social_contract: "Sobriety Social Contract"
 SOV_1985_sobriety_social_contract_desc: "Link public health, food supply and workplace discipline into a reform that people can actually feel."
 SOV_1985_black_market_crackdown: "Black Market Crackdown"
 SOV_1985_black_market_crackdown_desc: "Attack the illegal alcohol economy before it turns every reform into another private racket."
 SOV_1985_article_six_defended: "Article Six Defended"
 SOV_1985_article_six_defended_desc: "The party monopoly remains the spine of the Soviet state. Without it, reform becomes disintegration."
 SOV_1985_article_six_revision: "Revise Article Six"
 SOV_1985_article_six_revision_desc: "The party cannot renew society while declaring itself untouchable. Limited competition begins inside Soviet legality."
 SOV_1985_party_veto_over_reform: "Party Veto Over Reform"
 SOV_1985_party_veto_over_reform_desc: "Let the apparatus stop reforms that endanger the monopoly before the streets or republics learn to do it instead."
 SOV_1985_multi_candidate_soviets: "Multi-Candidate Soviets"
 SOV_1985_multi_candidate_soviets_desc: "Allow controlled electoral competition in the soviets and accept the first real political risk of Glasnost."
 SOV_1985_ministerial_plan_restoration: "Ministerial Plan Restoration"
 SOV_1985_ministerial_plan_restoration_desc: "Rebuild discipline through ministries, targets and allocations. It buys command at the cost of flexibility."
 SOV_1985_cooperative_market_socialism: "Cooperative Market Socialism"
 SOV_1985_cooperative_market_socialism_desc: "Let cooperatives relieve shortages while keeping reform tied to socialist legitimacy."
 SOV_1985_director_autonomy_bargain: "Director Autonomy Bargain"
 SOV_1985_director_autonomy_bargain_desc: "Give enterprise directors the room to solve problems, and accept that they will also build private power."
 SOV_1985_federal_compromise: "Federal Compromise"
 SOV_1985_federal_compromise_desc: "Save the Union by bargaining with the republics before sovereignty becomes an exit door."
 SOV_1985_moscow_recentralizes: "Moscow Recentralizes"
 SOV_1985_moscow_recentralizes_desc: "Reassert command before republican laws, fronts and ministries make obedience optional."
 SOV_1985_double_down_in_afghanistan: "Double Down in Afghanistan"
 SOV_1985_double_down_in_afghanistan_desc: "The war can still be framed as honor, security and socialist duty. It will not be cheap."
 SOV_1985_afghan_honor_exit: "Afghan Honor Exit"
 SOV_1985_afghan_honor_exit_desc: "Shape withdrawal as a disciplined Soviet decision rather than a retreat forced by exhaustion."
