 # IMPERIA COLD WAR — Equipment rework 23.11.2026: names and descriptions.
 COLDWAR_tank_sights_1940s_module:0 "Dedicated Telescopes and Periscopes"
 COLDWAR_tank_sights_1940s_module_desc:0 "Dedicated gunner telescopes, commander periscopes and the first active infrared night sights.\n\n§GDesigner Hint: Optional sight package. Needs a battlestation of the same decade or newer in the design. Improves soft, hard and air attack at a higher unit cost.§!"
 EQ_MOD_CAT_COLDWAR_tank_sights_1940s_TITLE:0 "Sights (1940s)"
 sp_COLDWAR_tank_sights_1940s:0 "Dedicated Telescopes and Periscopes Programme"
 sp_COLDWAR_tank_sights_1940s_desc:0 "A national programme to develop and series-produce dedicated telescopes and periscopes for armoured vehicles. §YWhile running: 3 civilian factories are bound to the programme.§!"
 COLDWAR_tank_sights_1950s_module:0 "Early Optical Rangefinders"
 COLDWAR_tank_sights_1950s_module_desc:0 "Stereoscopic and coincidence rangefinders with mechanical ballistic computers.\n\n§GDesigner Hint: Optional sight package. Needs a battlestation of the same decade or newer in the design. Improves soft, hard and air attack at a higher unit cost.§!"
 EQ_MOD_CAT_COLDWAR_tank_sights_1950s_TITLE:0 "Sights (1950s)"
 sp_COLDWAR_tank_sights_1950s:0 "Early Optical Rangefinders Programme"
 sp_COLDWAR_tank_sights_1950s_desc:0 "A national programme to develop and series-produce early optical rangefinders for armoured vehicles. §YWhile running: 3 civilian factories are bound to the programme.§!"
 COLDWAR_tank_sights_1960s_module:0 "Advanced Optical Rangefinders"
 COLDWAR_tank_sights_1960s_module_desc:0 "Improved optical rangefinders, electro-mechanical ballistic computers and multispectrum night vision.\n\n§GDesigner Hint: Optional sight package. Needs a battlestation of the same decade or newer in the design. Improves soft, hard and air attack at a higher unit cost.§!"
 EQ_MOD_CAT_COLDWAR_tank_sights_1960s_TITLE:0 "Sights (1960s)"
 sp_COLDWAR_tank_sights_1960s:0 "Advanced Optical Rangefinders Programme"
 sp_COLDWAR_tank_sights_1960s_desc:0 "A national programme to develop and series-produce advanced optical rangefinders for armoured vehicles. §YWhile running: 3 civilian factories are bound to the programme.§!"
 COLDWAR_tank_sights_1970s_module:0 "Early Laser Rangefinders"
 COLDWAR_tank_sights_1970s_module_desc:0 "Ruby laser rangefinders, early digital ballistic computers and stabilisers integrated into the fire control.\n\n§GDesigner Hint: Optional sight package. Needs a battlestation of the same decade or newer in the design. Improves soft, hard and air attack at a higher unit cost.§!"
 EQ_MOD_CAT_COLDWAR_tank_sights_1970s_TITLE:0 "Sights (1970s)"
 sp_COLDWAR_tank_sights_1970s:0 "Early Laser Rangefinders Programme"
 sp_COLDWAR_tank_sights_1970s_desc:0 "A national programme to develop and series-produce early laser rangefinders for armoured vehicles. §YWhile running: 3 civilian factories are bound to the programme.§!"
 COLDWAR_tank_sights_1980s_module:0 "Digital Laser Fire Control"
 COLDWAR_tank_sights_1980s_module_desc:0 "Mature digital laser rangefinders, integrated ballistic computers and advanced multispectrum sights.\n\n§GDesigner Hint: Optional sight package. Needs a battlestation of the same decade or newer in the design. Improves soft, hard and air attack at a higher unit cost.§!"
 EQ_MOD_CAT_COLDWAR_tank_sights_1980s_TITLE:0 "Sights (1980s)"
 sp_COLDWAR_tank_sights_1980s:0 "Digital Laser Fire Control Programme"
 sp_COLDWAR_tank_sights_1980s_desc:0 "A national programme to develop and series-produce digital laser fire control for armoured vehicles. §YWhile running: 3 civilian factories are bound to the programme.§!"
 COLDWAR_tank_sights_1990s_module:0 "Integrated Digital Fire Control"
 COLDWAR_tank_sights_1990s_module_desc:0 "Second-generation multispectrum sights, fully digital ballistic computers, automatic target tracking and digital battle management.\n\n§GDesigner Hint: Optional sight package. Needs a battlestation of the same decade or newer in the design. Improves soft, hard and air attack at a higher unit cost.§!"
