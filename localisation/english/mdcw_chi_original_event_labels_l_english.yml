l_english:
# IMPERIA CW — Cold War: chi original event labels — English localisation.
 china_1985.1.d: "Inspired by the campus discussion circles and the slow-burning corruption petitions, students at the University of Science and Technology of China march in Hefei. Within weeks, similar demonstrations break out in Shanghai and Beijing. The General Secretary urges restraint; the elders demand a hard line. The decision lands on Deng's desk."
 china_1985.1.e: "Send the Police but Avoid Bloodshed"
 china_1985.2.d: "Dual-track pricing has been working — too well in some cases. Urban inflation runs at double-digit rates for the first time since the founding of the People's Republic. The Politburo Standing Committee meets in Zhongnanhai to decide whether to brake or accelerate."
 china_1985.2.e: "Increase Urban Subsidies"
 china_1985.3.d: "On the long brick walls of Peking University, hand-written big-character posters return for the first time since the Cultural Revolution — but this time the targets are corruption, censorship and inflation, not landlords. The Public Security Bureau is asking for instructions."
 china_1985.3.e: "Call for Anti-Corruption Reform"
 china_1985.5.d: "Guangdong, Fujian and the coastal cities are pulling away from the interior at a pace that worries Beijing. Provincial Party secretaries lobby for more autonomy; central planners warn that the Republic is fragmenting along the coast."
 china_1985.5.e: "Redirect Funds Inland"
