 COLDWAR_USA_gulf_events.13.t:0 "An American access request"
 COLDWAR_USA_gulf_events.13.d:0 "Washington has asked to use our territory and airfields for its operations around Iraq. Cooperation could strengthen our security relationship, but it would also associate our government with an American commitment whose course remains uncertain."
 COLDWAR_USA_gulf_events.13.o0:0 "Accept the staging agreement"
 COLDWAR_USA_gulf_events.13.o1:0 "Accept northern access and basing"
 COLDWAR_USA_gulf_events.13.o2:0 "Decline this commitment"
 COLDWAR_USA_gulf_events.20.t:0 "Coalition air-cover coordination"
 COLDWAR_USA_gulf_events.20.d:0 "American officers propose closer liaison between their air forces and our ground commands. The arrangement could protect our troops from attacks, but maintaining it will require additional personnel and a continuing relationship with Washington."
 COLDWAR_USA_gulf_events.20.o0:0 "Accept the liaison programme"
 COLDWAR_USA_gulf_events.20.o1:0 "Decline"
 COLDWAR_USA_gulf_events.21.t:0 "The initial American arms offer"
 COLDWAR_USA_gulf_events.21.d:0 "American envoys have offered money and small arms to strengthen our forces. The assistance would improve our position against Baghdad while bringing our administration into a closer relationship with Washington."
 COLDWAR_USA_gulf_events.21.o0:0 "Accept delivery"
 COLDWAR_USA_gulf_events.21.o1:0 "Decline"
 COLDWAR_USA_gulf_events.22.t:0 "A funded American support agreement"
 COLDWAR_USA_gulf_events.22.d:0 "Washington proposes a continuing subsidy and advisory mission. Its government will need to keep the mission funded, while our own commanders remain responsible for the fighting and the political consequences of accepting foreign help."
 COLDWAR_USA_gulf_events.22.o0:0 "Accept the 90-day contract"
 COLDWAR_USA_gulf_events.22.o1:0 "Decline"
 COLDWAR_USA_gulf_events.23.t:0 "The committed clandestine cache"
 COLDWAR_USA_gulf_events.23.d:0 "Weapons previously entrusted to the northern supply network can now be delivered to an established local administration. Taking responsibility for them will strengthen our forces and make our links with the Americans more difficult to keep discreet."
 COLDWAR_USA_gulf_events.23.o0:0 "Accept the recorded equipment"
 COLDWAR_USA_gulf_events.23.o1:0 "Decline delivery"
 COLDWAR_USA_gulf_events.24.t:0 "A regional administration grant"
 COLDWAR_USA_gulf_events.24.d:0 "American assistance could help our administration restore public services and build institutions beyond its military organization. We must decide whether to accept the aid and undertake the local work needed to turn it into a lasting recovery."
 COLDWAR_USA_gulf_events.24.o0:0 "Accept the grant"
 COLDWAR_USA_gulf_events.24.o1:0 "Decline"
 COLDWAR_USA_gulf_events.25.t:0 "A northern reconstruction grant"
 COLDWAR_USA_gulf_events.25.d:0 "American assistance could help our administration restore public services and build institutions beyond its military organization. We must decide whether to accept the aid and undertake the local work needed to turn it into a lasting recovery."
 COLDWAR_USA_gulf_events.25.o0:0 "Accept the grant"
 COLDWAR_USA_gulf_events.25.o1:0 "Decline"
 COLDWAR_USA_gulf_events.30.t:0 "Terms for northern self-government"
 COLDWAR_USA_gulf_events.30.d:0 "Washington proposes a settlement that recognizes local budgets and security within Iraq. Baghdad must decide whether those guarantees offer a more durable peace than continued confrontation; the northern administrations will make their own decision."
 COLDWAR_USA_gulf_events.30.o0:0 "Submit these terms to the Kurdish administration"
 COLDWAR_USA_gulf_events.30.o1:0 "Reject these terms"
 COLDWAR_USA_gulf_events.31.t:0 "A Baghdad autonomy agreement"
 COLDWAR_USA_gulf_events.31.d:0 "Baghdad has offered local security and revenue powers within Iraq. Accepting would give our administration a recognized place in the republic, but its value will depend on whether the central government continues to honor what it has promised."
 COLDWAR_USA_gulf_events.31.o0:0 "Accept internal self-government"
 COLDWAR_USA_gulf_events.31.o1:0 "Refuse these terms"
 COLDWAR_USA_gulf_events.40.t:0 "American aid to Iraqi Kurdish actors"
 COLDWAR_USA_gulf_events.40.d:0 "Washington's growing relationship with the Iraqi Kurdish parties has raised concern in Ankara. A stronger movement across the frontier could change the regional balance and encourage ambitions extending beyond Iraq. Our government must decide how far cooperation with the American effort serves Turkish interests."
 COLDWAR_USA_gulf_events.40.o0:0 "Review our regional policy"
 COLDWAR_USA_gulf_events.41.t:0 "Warning of a northern rising"
 COLDWAR_USA_gulf_events.41.d:0 "Armed networks and mounting defiance in the north are converging with a moment of Iraqi military weakness. Commanders warn that a rising could follow within forty-five days if these conditions continue. Baghdad can reinforce its position or seek an agreement before the confrontation passes beyond political control."
 COLDWAR_USA_gulf_events.41.o0:0 "Prepare our response"
 COLDWAR_USA_gulf_events.42.t:0 "Manage the American air commitment"
 COLDWAR_USA_gulf_events.42.d:0 "The northern air operation requires continuing cooperation from the governments hosting our aircraft and the forces relying on their cover. We must decide whether to renew that undertaking or bring the present deployment to an end."
 COLDWAR_USA_gulf_events.42.o0:0 "Renew after fresh host consent"
 COLDWAR_USA_gulf_events.42.o1:0 "Withdraw this air programme"
 COLDWAR_USA_gulf_events.42.o2:0 "Leave the present term unchanged"
 COLDWAR_USA_gulf_events.43.t:0 "A challenge to the protection commitment"
 COLDWAR_USA_gulf_events.43.d:0 "Fighting between Iraq and a protected northern administration has brought our promise under scrutiny. Some in Washington favor a negotiated settlement; others argue that American credibility now requires a wider intervention. Continuing the commitment without deciding its limits may satisfy neither side."
 COLDWAR_USA_gulf_events.43.o0:0 "Review the settlement options"
 COLDWAR_USA_gulf_events.43.o1:0 "Maintain our present commitment"
 COLDWAR_USA_gulf_events.43.o2:0 "End the protection commitment"
 COLDWAR_USA_gulf_events.44.t:0 "Select the arms recipient"
 COLDWAR_USA_gulf_events.44.d:0 "American representatives are preparing to approach a northern administration about assistance. Its leaders will decide whether the offer serves their interests and how closely they wish to associate their government with Washington."
 COLDWAR_USA_gulf_events.44.o0:0 "Send the offer to KUR"
 COLDWAR_USA_gulf_events.44.o1:0 "Send the offer to PUK"
 COLDWAR_USA_gulf_events.44.o2:0 "Make no offer"
 COLDWAR_USA_gulf_events.45.t:0 "Select the support partner"
 COLDWAR_USA_gulf_events.45.d:0 "American representatives are preparing to approach a northern administration about assistance. Its leaders will decide whether the offer serves their interests and how closely they wish to associate their government with Washington."
 COLDWAR_USA_gulf_events.45.o0:0 "Send the offer to KUR"
 COLDWAR_USA_gulf_events.45.o1:0 "Send the offer to PUK"
 COLDWAR_USA_gulf_events.45.o2:0 "Make no offer"
