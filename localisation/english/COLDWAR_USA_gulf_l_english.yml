 COLDWAR_USA_gulf_request_staging_TUR:0 "Request staging in TUR"
 COLDWAR_USA_gulf_request_staging_TUR_desc:0 "Ask this government for military and air-base access. Its player may refuse. The first accepted staging agreement with this host costs $2.00 billion; a repeat consent request does not replay that invoice."
 COLDWAR_USA_gulf_request_north_TUR:0 "Request northern access from TUR"
 COLDWAR_USA_gulf_request_north_TUR_desc:0 "Ask this government for military and air-base access. Its player may refuse. The first accepted north agreement with this host costs $0.50 billion; a repeat consent request does not replay that invoice."
 COLDWAR_USA_gulf_request_staging_SAU:0 "Request staging in SAU"
 COLDWAR_USA_gulf_request_staging_SAU_desc:0 "Ask this government for military and air-base access. Its player may refuse. The first accepted staging agreement with this host costs $2.00 billion; a repeat consent request does not replay that invoice."
 COLDWAR_USA_gulf_request_north_SAU:0 "Request northern access from SAU"
 COLDWAR_USA_gulf_request_north_SAU_desc:0 "Ask this government for military and air-base access. Its player may refuse. The first accepted north agreement with this host costs $0.50 billion; a repeat consent request does not replay that invoice."
