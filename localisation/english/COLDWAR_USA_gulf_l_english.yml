# IMPERIA CW — Cold War: USA gulf — English localisation.
 COLDWAR_USA_gulf_accord_funding_condition_tt:0 "Iraq's contribution has been paid, or its Treasury can cover the agreed §Y$[?IRQ.COLDWAR_USA_gulf_accord_invoice|2] billion§! contribution."
 COLDWAR_USA_gulf_target_support:0 "American support for the Kurdish underground"
 COLDWAR_USA_gulf_target_security:0 "Funded northern security operation"
 COLDWAR_USA_gulf_events.10.t:0 "An American access request"
 COLDWAR_USA_gulf_events.10.d:0 "Washington has asked to use our territory and airfields for its operations around Iraq. Cooperation could strengthen our security relationship, but it would also associate our government with an American commitment whose course remains uncertain."
 COLDWAR_USA_gulf_events.10.o0:0 "Accept the staging agreement"
 COLDWAR_USA_gulf_events.10.o1:0 "Accept northern access and basing"
 COLDWAR_USA_gulf_events.10.o2:0 "Decline this commitment"
