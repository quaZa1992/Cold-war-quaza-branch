 COLDWAR_USA_gulf_events.47.d:0 "American representatives are preparing to approach a northern administration about assistance. Its leaders will decide whether the offer serves their interests and how closely they wish to associate their government with Washington."
 COLDWAR_USA_gulf_events.47.o0:0 "Send the offer to KUR"
 COLDWAR_USA_gulf_events.47.o1:0 "Send the offer to PUK"
 COLDWAR_USA_gulf_events.47.o2:0 "Make no offer"
 COLDWAR_USA_gulf_events.50.t:0 "An invitation to the Gulf coalition"
 COLDWAR_USA_gulf_events.50.d:0 "Washington seeks our support in opposing Iraq's attack on Kuwait. We can endorse cooperation and contribute to its costs, offer political backing alone, or keep our distance from the American undertaking. Any military deployment will remain a separate decision for our government."
 COLDWAR_USA_gulf_events.50.o0:0 "Cooperate and contribute $0.25 billion"
 COLDWAR_USA_gulf_events.50.o1:0 "Political cooperation without a financial pledge"
 COLDWAR_USA_gulf_events.50.o2:0 "Decline"
 COLDWAR_USA_gulf_invite_SAU:0 "Invite SAU to Gulf cooperation"
 COLDWAR_USA_gulf_invite_SAU_desc:0 "Invite political cooperation and an optional real $0.25 billion cost-sharing contribution. The recipient chooses freely; acceptance does not declare war, create faction membership or grant access."
 COLDWAR_USA_gulf_invite_ENG:0 "Invite ENG to Gulf cooperation"
 COLDWAR_USA_gulf_invite_ENG_desc:0 "Invite political cooperation and an optional real $0.25 billion cost-sharing contribution. The recipient chooses freely; acceptance does not declare war, create faction membership or grant access."
