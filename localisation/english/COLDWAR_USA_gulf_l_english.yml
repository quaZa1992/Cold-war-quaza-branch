 COLDWAR_USA_gulf_request_north_ENG_desc:0 "Ask this government for military and air-base access. Its player may refuse. The first accepted north agreement with this host costs $0.50 billion; a repeat consent request does not replay that invoice."
 COLDWAR_USA_gulf_request_staging_FRA:0 "Request staging in FRA"
 COLDWAR_USA_gulf_request_staging_FRA_desc:0 "Ask this government for military and air-base access. Its player may refuse. The first accepted staging agreement with this host costs $2.00 billion; a repeat consent request does not replay that invoice."
 COLDWAR_USA_gulf_request_north_FRA:0 "Request northern access from FRA"
 COLDWAR_USA_gulf_request_north_FRA_desc:0 "Ask this government for military and air-base access. Its player may refuse. The first accepted north agreement with this host costs $0.50 billion; a repeat consent request does not replay that invoice."
 COLDWAR_USA_gulf_revoke_access:0 "Revoke the American access agreement"
 COLDWAR_USA_gulf_revoke_access_desc:0 "Withdraw this host's actual military and air-base access granted by the programme. Readiness and liaison training already earned continue with their personnel costs to expiry or an explicit American withdrawal."
 COLDWAR_USA_gulf_appeal_offer:0 "Broadcast the Appeal"
 COLDWAR_USA_gulf_appeal_offer_desc:0 "Publicly invite an Iraqi opposition response for 90 days. This creates no units, territory, combat modifier or automatic revolt."
 COLDWAR_USA_gulf_rising_response:0 "Coordinate a Local Rising"
 COLDWAR_USA_gulf_rising_response_desc:0 "A local administration chooses whether to coordinate with American contacts. Real grievances and an Iraqi military opening are required. This does not transfer territory or declare an American war."
 COLDWAR_USA_gulf_assembly_offer_KUR:0 "Fund a regional assembly in KUR"
 COLDWAR_USA_gulf_assembly_offer_KUR_desc:0 "The recipient must accept its own offer. All funding, equipment, route and once-only limits are checked again at delivery."
 COLDWAR_USA_gulf_assembly_offer_PUK:0 "Fund a regional assembly in PUK"
 COLDWAR_USA_gulf_assembly_offer_PUK_desc:0 "The recipient must accept its own offer. All funding, equipment, route and once-only limits are checked again at delivery."
 COLDWAR_USA_gulf_arms_offer:0 "Offer the Initial Arms Package"
 COLDWAR_USA_gulf_arms_offer_desc:0 "Choose an actual local recipient, which must accept. All live route, funding, stockpile and once-only conditions are rechecked in the recipient event. Existing-country and underground support share one initial-package marker and common recurring budget."
 COLDWAR_USA_gulf_renew_arms:0 "Renew Kurdish Support"
 COLDWAR_USA_gulf_renew_arms_desc:0 "Choose an actual local recipient, which must accept. All live route, funding, stockpile and once-only conditions are rechecked in the recipient event. Existing-country and underground support share one initial-package marker and common recurring budget."
 COLDWAR_USA_gulf_reconstruction:0 "Fund Regional Reconstruction"
 COLDWAR_USA_gulf_reconstruction_desc:0 "Choose an actual local recipient, which must accept. All live route, funding, stockpile and once-only conditions are rechecked in the recipient event. Existing-country and underground support share one initial-package marker and common recurring budget."
 COLDWAR_USA_gulf_uprising_aftermath:0 "Support the Northern Rising"
 COLDWAR_USA_gulf_uprising_aftermath_desc:0 "Choose an actual local recipient, which must accept. All live route, funding, stockpile and once-only conditions are rechecked in the recipient event. Existing-country and underground support share one initial-package marker and common recurring budget."
 COLDWAR_USA_gulf_warning:0 "The Northern Uprising Warning"
 COLDWAR_USA_gulf_warning_desc:0 "The public 45-day warning advances only while at least two organized states remain at 80% resistance during a real military opening and a committed local arms cache remains. An American funding withdrawal does not erase previously committed local weapons. It pauses below the condition and resets after 15 such days. A respected implemented autonomy settlement ends it. This is an informational decision; the daily observer runs the warning."
 COLDWAR_USA_gulf_underground:0 "Fund the Kurdish Underground"
 COLDWAR_USA_gulf_underground_desc:0 "Spend $0.25 billion and commit 1,000 actual infantry weapons to a single cache. Enable native resistance in at most two organized northern states, with one 60% seed per state. No absent country receives money or equipment. The common 90-day support budget costs $0.05 billion per week while funded."
 COLDWAR_USA_gulf_sustain_underground:0 "Sustain the Clandestine Network"
 COLDWAR_USA_gulf_sustain_underground_desc:0 "Renew the single common support budget for 90 days at $0.05 billion per week, charged daily. Its own target contribution is +25 points, never an absolute resistance target or cap. Initial seeds and pulse cooldowns cannot replay."
 COLDWAR_USA_gulf_expand_164:0 "Expand the Underground in State 164"
 COLDWAR_USA_gulf_expand_164_desc:0 "Spend $0.10 billion on a new organized state. Thirty uninterrupted funded days of the common underground contract are required before native resistance is enabled. A state can be seeded only once; withdrawal cancels an unfinished expansion without refund. Halabja requires an actually formed PUK movement."
 COLDWAR_USA_gulf_expand_633:0 "Expand the Underground in State 633"
 COLDWAR_USA_gulf_expand_633_desc:0 "Spend $0.10 billion on a new organized state. Thirty uninterrupted funded days of the common underground contract are required before native resistance is enabled. A state can be seeded only once; withdrawal cancels an unfinished expansion without refund. Halabja requires an actually formed PUK movement."
 COLDWAR_USA_gulf_expand_630:0 "Expand the Underground in State 630"
 COLDWAR_USA_gulf_expand_630_desc:0 "Spend $0.10 billion on a new organized state. Thirty uninterrupted funded days of the common underground contract are required before native resistance is enabled. A state can be seeded only once; withdrawal cancels an unfinished expansion without refund. Halabja requires an actually formed PUK movement."
 COLDWAR_USA_gulf_expand_1078:0 "Expand the Underground in State 1078"
 COLDWAR_USA_gulf_expand_1078_desc:0 "Spend $0.10 billion on a new organized state. Thirty uninterrupted funded days of the common underground contract are required before native resistance is enabled. A state can be seeded only once; withdrawal cancels an unfinished expansion without refund. Halabja requires an actually formed PUK movement."
 COLDWAR_USA_gulf_end_support:0 "End the Kurdish support contract"
 COLDWAR_USA_gulf_end_support_desc:0 "Stop the common recurring subsidy and its advisers/target contribution. Money already spent is sunk; committed equipment stays recorded until delivered, seized or written off. Seed and pulse ledgers persist."
 COLDWAR_USA_gulf_writeoff_cache:0 "Write off the undelivered cache"
 COLDWAR_USA_gulf_writeoff_cache_desc:0 "Resolve an abandoned or settled clandestine commitment. The remaining equipment is lost and cannot be refunded or granted again. This permanently closes its delivery ledger."
 COLDWAR_USA_gulf_cache_offer_KUR:0 "Offer the recorded cache to KUR"
 COLDWAR_USA_gulf_cache_offer_KUR_desc:0 "Offer only the remaining previously committed equipment, after an actual rising or an agreed lawful settlement. Acceptance and route are checked again; no second initial grant is created."
 COLDWAR_USA_gulf_cache_offer_PUK:0 "Offer the recorded cache to PUK"
 COLDWAR_USA_gulf_cache_offer_PUK_desc:0 "Offer only the remaining previously committed equipment, after an actual rising or an agreed lawful settlement. Acceptance and route are checked again; no second initial grant is created."
 COLDWAR_IRQ_northern_security:0 "Emergency Security Appropriation"
 COLDWAR_IRQ_northern_security_desc:0 "Pay 2% of current annual GDP once, then sustain a 90-day national military-overhead package. The smaller programme adds +35% army personnel/+20% equipment upkeep; the major adds +60%/+35%. Keep at least two actual divisions in the northern states for 30 days before the resistance reduction. One 90-day cooldown survives withdrawal and government change."
 COLDWAR_IRQ_northern_major_operation:0 "Major Northern Operation"
 COLDWAR_IRQ_northern_major_operation_desc:0 "Pay 4% of current annual GDP once, then sustain a 90-day national military-overhead package. The smaller programme adds +35% army personnel/+20% equipment upkeep; the major adds +60%/+35%. Keep at least two actual divisions in the northern states for 30 days before the resistance reduction. One 90-day cooldown survives withdrawal and government change."
 COLDWAR_IRQ_northern_withdraw_security:0 "End the Northern Operation"
 COLDWAR_IRQ_northern_withdraw_security_desc:0 "End exceptional personnel/equipment overhead and its own target reductions. Preparation expenditure is sunk; the 90-day cooldown, resistance and grievances remain."
 COLDWAR_IRQ_northern_talks:0 "Reopen Kurdish Negotiations"
 COLDWAR_IRQ_northern_talks_desc:0 "Propose local budget and security powers. Existing local players choose separately. With no country, Iraq's domestic autonomy system handles the political response; this decision does not let Baghdad choose the opposition's answer."
 COLDWAR_USA_gulf_refugees:0 "Fund Refugee Relief"
 COLDWAR_USA_gulf_refugees_desc:0 "Aid workers need a dependable supply route and the resources to restore damaged infrastructure. A sustained relief operation can help northern communities recover while the fighting and displacement continue."
 COLDWAR_USA_gulf_protection:0 "Maintain the Northern Safe Haven"
 COLDWAR_USA_gulf_protection_desc:0 "Renew 90 days of protection logistics at $0.05 billion per week beyond ordinary deployed-force expenses. Accessible northern states under actual US/Kurdish control receive +0.10 local supply for their controller. Actual forces, access and local control remain necessary. This commitment does not remotely ban Iraqi movement or declare a US war."
 COLDWAR_USA_gulf_patrols:0 "Manage Coalition Air Cover"
 COLDWAR_USA_gulf_patrols_desc:0 "Renew or withdraw the real 90-day air ideas. Renewal requires fresh host consent and recipient acceptance. Personnel costs continue during the earned term after host access loss; actual basing obeys normal diplomacy."
 COLDWAR_USA_gulf_respond:0 "Respond to a Protection Crisis"
 COLDWAR_USA_gulf_respond_desc:0 "Consult, maintain the present commitment or withdraw. Any US war requires a separate player decision and real deployed forces."
 COLDWAR_USA_gulf_local_rebuild:0 "Rebuild the Regional Infrastructure"
 COLDWAR_USA_gulf_local_rebuild_desc:0 "Spend $0.20 billion of the actual local treasury to complete one infrastructure level in an owned, controlled northern state with available infrastructure capacity. The grant does not waive this local invoice. Each state can receive this programme project once."
 COLDWAR_USA_gulf_recognised_policy_cost_tt:0 "Northern development expenditure: §Y$0.025 billion per week§! for §Y90 days§!."
 COLDWAR_USA_gulf_external_policy_cost_tt:0 "Northern protection expenditure: §Y$0.050 billion per week§! for §Y90 days§!, in addition to deployed forces."
 COLDWAR_USA_gulf_limited_relief_cost_tt:0 "Refugee relief expenditure: §G$0.020 billion per week§! instead of §Y$0.025 billion§!."
 COLDWAR_USA_gulf_relief_cost_tt:0 "Refugee relief expenditure: §Y$0.025 billion per week§! for §Y90 days§!."
 COLDWAR_USA_gulf_accord:0 "Offer a Recognised Autonomy Programme"
 COLDWAR_USA_gulf_accord_desc:0 "Baghdad and the regional representatives must agree on internal self-government before Washington funds reconstruction."
 COLDWAR_USA_gulf_revise_accord:0 "Negotiate a New Northern Commitment"
 COLDWAR_USA_gulf_revise_accord_desc:0 "Baghdad and the regional representatives must agree on internal self-government before Washington funds reconstruction."
 COLDWAR_USA_gulf_external_policy:0 "Offer an External Protection Commitment"
 COLDWAR_USA_gulf_external_policy_desc:0 "A separate pledge to the regional administrations commits American protection while the dispute with Baghdad remains unresolved."
 COLDWAR_USA_gulf_revise_external:0 "Negotiate a New Northern Commitment"
 COLDWAR_USA_gulf_revise_external_desc:0 "A separate pledge to the regional administrations commits American protection while the dispute with Baghdad remains unresolved."
 COLDWAR_USA_gulf_withdraw_policy:0 "Withdraw the Northern Commitment"
 COLDWAR_USA_gulf_withdraw_policy_desc:0 "Washington will end its current undertaking. Existing local institutions and previously delivered aid remain in place."
 COLDWAR_USA_gulf_cancel_policy_offer:0 "Close the Settlement Negotiations"
 COLDWAR_USA_gulf_cancel_policy_offer_desc:0 "Washington will withdraw its outstanding proposal. Diplomatic work already undertaken cannot be recovered, but no unaccepted financial contribution will be paid."
 COLDWAR_USA_gulf_decline_protection:0 "End the American Protection Agreement"
 COLDWAR_USA_gulf_decline_protection_desc:0 "Our administration will withdraw its consent to the American protection arrangement. The regional authorities must then seek another basis for their security."
 COLDWAR_USA_gulf_escalate_protection:0 "Expand the Protection Mandate"
 COLDWAR_USA_gulf_escalate_protection_desc:0 "Fighting against a protected regional administration has put the American commitment to the test. Congress must decide whether to authorize a wider intervention."
 COLDWAR_USA_gulf_events.52.t:0 "An American protection proposal"
 COLDWAR_USA_gulf_events.52.d:0 "Washington seeks a common protection undertaking with the northern administrations outside a settlement with Baghdad. It will take effect when the governments concerned accept and American funding is available. Our security forces would then enter a closer and more costly relationship with American advisers."
 COLDWAR_USA_gulf_events.52.o0:0 "Accept the protection commitment"
 COLDWAR_USA_gulf_events.52.o1:0 "Decline the American commitment"
 COLDWAR_USA_gulf_events.54.t:0 "An American pledge in the north"
 COLDWAR_USA_gulf_events.54.d:0 "Washington has entered a protection agreement with the northern administrations. Continued fighting may now produce demands in the United States for a wider military intervention. Baghdad can pursue negotiations or bear the risk of a new confrontation."
 COLDWAR_USA_gulf_events.54.o0:0 "Review our northern policy"
 COLDWAR_USA_gulf_relief_funded_condition_tt:0 "A funded refugee relief operation is in progress."
 COLDWAR_USA_gulf_separate_air_policy_condition_tt:0 "Recognised autonomy is not the selected northern commitment."
 COLDWAR_USA_gulf_protection_funded_condition_tt:0 "A funded northern protection operation is in progress."
 COLDWAR_USA_gulf_air_offers_tt:0 "Offer each existing eligible KUR/PUK government a separate 90-day air-cover agreement: CAS damage reduction +25%, enemy air-superiority effect -20%, army personnel cost +5%. Each recipient decides. Actual sorties use real aircraft and ordinary basing, range and war rules."
 COLDWAR_USA_gulf_desert_storm:0 "Desert Storm"
 COLDWAR_USA_gulf_desert_storm_desc:0 "Iraq's attack on Kuwait threatens the sovereignty of the Gulf's states and the order on which their security depends. We will seek authority to use American military power to reverse the conquest, while leaving the commitment of forces in the hands of Washington and its coalition partners."
 COLDWAR_USA_gulf_desert_shield:0 "Desert Shield"
 COLDWAR_USA_gulf_desert_shield_desc:0 "The forces needed to defend the Gulf must reach the region before they can influence events there. We will approach friendly governments about staging rights and prepare the supply arrangements on which any sustained American deployment will depend."
 COLDWAR_USA_gulf_coalition:0 "Coalition Mandate"
 COLDWAR_USA_gulf_coalition_desc:0 "A response to the conquest of Kuwait will carry greater weight if regional and international governments accept a common purpose. We will seek their cooperation and negotiate the commitments they are willing to make, knowing that political endorsement alone does not place their forces under American command."
 COLDWAR_USA_gulf_appeal:0 "Open Northern Channels"
 COLDWAR_USA_gulf_appeal_desc:0 "Iraq's northern parties possess their own ambitions, grievances and memories of outside intervention. Opening channels to them will clarify what they seek from Washington and what they can undertake themselves. Public encouragement must be weighed against the consequences for people who may act upon it."
 COLDWAR_USA_gulf_contacts:0 "Kurdish Contacts"
 COLDWAR_USA_gulf_contacts_desc:0 "Open separate channels to the Kurdish parties. Their priorities and rivalries remain distinct."
 COLDWAR_USA_gulf_limited_war:0 "A Limited War"
 COLDWAR_USA_gulf_limited_war_desc:0 "Our mandate in the Gulf is strongest when its objectives remain clear. We will concentrate on Kuwait's restoration and organize a disciplined humanitarian effort, accepting that restraint leaves Washington with less influence over the struggle for power inside Iraq."
 COLDWAR_USA_gulf_arm_front:0 "Arm the Front"
 COLDWAR_USA_gulf_arm_front_desc:0 "Iraqi Kurdish leaders may provide a local counterweight to Baghdad, but their military position cannot be sustained by American declarations alone. We will offer arms and continuing support on terms that the local administrations can accept, committing resources to a conflict whose end Washington cannot dictate."
 COLDWAR_USA_gulf_northern_access:0 "Northern Access"
 COLDWAR_USA_gulf_northern_access_desc:0 "Relief and protection in northern Iraq depend on supply routes through neighboring states. We will negotiate access with governments whose own interests in the Kurdish question may differ sharply from ours. Their cooperation must be maintained rather than taken for granted."
 COLDWAR_USA_gulf_comfort:0 "Provide Comfort"
 COLDWAR_USA_gulf_comfort_desc:0 "Fighting and displacement in the north have left communities beyond the reach of dependable public services. An American relief effort can keep essential supplies moving and help damaged infrastructure recover, provided neighboring governments allow the necessary routes to remain open."
 COLDWAR_USA_gulf_safe_haven:0 "Northern Safe Haven"
 COLDWAR_USA_gulf_safe_haven_desc:0 "A protected relief area requires more than a declaration. We will support the logistics of an accessible northern refuge, while recognizing that the security of its inhabitants still depends on the forces present and the willingness of outside governments to remain involved."
 COLDWAR_USA_gulf_no_fly:0 "Northern Air Shield"
 COLDWAR_USA_gulf_no_fly_desc:0 "American and cooperating air forces can make attacks on the northern communities more difficult. We will prepare interception, air-superiority and liaison arrangements from consenting bases. The commitment must be sustained by actual aircraft and the governments willing to host them."
 COLDWAR_USA_gulf_assembly:0 "Regional Assembly"
 COLDWAR_USA_gulf_assembly_desc:0 "Local councils and party administrations must provide more than military leadership if the north is to recover. We will support representative institutions and a functioning regional budget, while allowing the Kurdish parties to negotiate their own relationship and priorities."
 COLDWAR_USA_gulf_baghdad_accord:0 "Baghdad Accord"
 COLDWAR_USA_gulf_baghdad_accord_desc:0 "An agreement with Baghdad could turn an uncertain refuge into recognized self-government within Iraq. We will seek terms that protect regional budgets and local security, and support reconstruction only once the governments concerned accept and uphold the settlement."
 COLDWAR_USA_gulf_self_rule:0 "Guarantee Self-Rule"
 COLDWAR_USA_gulf_self_rule_desc:0 "The regional administrations may be unable to secure dependable guarantees from Baghdad. An external American commitment would strengthen their defence, but would also leave Washington responsible for a costly undertaking that Iraq's government continues to contest."
 COLDWAR_USA_gulf_recovery:0 "Northern Recovery"
 COLDWAR_USA_gulf_recovery_desc:0 "Northern recovery needs roads, functioning administration and an economy able to support returning families. We will negotiate assistance with the local authorities and support practical reconstruction, whether their security rests on an accepted Iraqi settlement or a continuing external commitment."
 COLDWAR_USA_gulf_recognised_budget:0 "A Recognised Northern Settlement"
 COLDWAR_USA_gulf_recognised_budget_desc:0 "An accepted regional settlement reduces Baghdad's exceptional military commitments while reserving revenue for the northern administration."
 COLDWAR_USA_gulf_recognised_development:0 "Recognised Regional Development"
 COLDWAR_USA_gulf_recognised_development_desc:0 "American reconstruction funding supports the regional economy. Local institutions must expand to administer the programme."
 COLDWAR_USA_gulf_external_guarantee:0 "The American Protection Commitment"
 COLDWAR_USA_gulf_external_guarantee_desc:0 "American support strengthens our defence against Iraq. Maintaining the liaison and readiness arrangements puts an additional burden on the regional military budget."
 COLDWAR_USA_gulf_northern_air_readiness:0 "Northern Air Readiness"
 COLDWAR_USA_gulf_northern_air_readiness_desc:0 "American interception and air-superiority preparation increases actual air-force personnel expenses. Its earned term continues after basing access loss until expiry or explicit withdrawal."
 COLDWAR_KUR_coalition_air_cover:0 "Coalition Air Cover"
 COLDWAR_KUR_coalition_air_cover_desc:0 "Accepted American liaison reduces CAS damage and the effect of enemy air superiority on our divisions. Coordination increases our army personnel costs. These are national force modifiers, not a geographic ban."
 COLDWAR_KUR_us_advisers:0 "American Military Advisers"
 COLDWAR_KUR_us_advisers_desc:0 "A funded, recipient-approved support contract assists defence against Iraq. It ends when the common American support budget expires or is withdrawn."
 COLDWAR_USA_gulf_security_small:0 "Northern Security Appropriation"
 COLDWAR_USA_gulf_security_small_desc:0 "Exceptional northern operations increase national army personnel and equipment upkeep. Actual troops are required before resistance reductions are delivered."
 COLDWAR_USA_gulf_security_major:0 "Major Northern Operation"
 COLDWAR_USA_gulf_security_major_desc:0 "An intensive operation imposes high national army personnel and equipment upkeep. Preparation is sunk, and withdrawal does not erase the operation cooldown."
 COLDWAR_IRQ_kurdish_autonomy:0 "Iraqi Regional Self-Government"
 COLDWAR_USA_gulf_relief_local:0 "Funded Northern Relief"
 COLDWAR_USA_gulf_protection_local:0 "Safe-Haven Logistics"
 COLDWAR_USA_gulf_category:0 "The Gulf and Northern Iraq"
 COLDWAR_USA_gulf_category_desc:0 "React to Iraqi aggression and the northern crisis through real military deployment, accepted agreements and funded operations. Baghdad's countermeasures do not depend on American focus completion."
