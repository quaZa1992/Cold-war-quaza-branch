l_english:
# IMPERIA CW — Cold War: Integrated IRQ 1985 debt — English localisation.
 IRQ_1985_gulf_war_bond_drive: "Gulf War Bond Drive"
 IRQ_1985_gulf_war_bond_drive_desc: "The front consumes shells, engines, wages, and political patience. Baghdad will ask the Gulf monarchies to buy new Iraqi war bonds, turning anti-Iranian solidarity into hard cash."
 IRQ_1985_make_iran_pay: "Make Iran Pay"
 IRQ_1985_make_iran_pay_desc: "Through glorious diplomacy, coercion, or victory in the war, Baghdad will demand that Iran assume the burden Iraq carried on behalf of the Arab world. If Tehran accepts, most of Iraq's war debt will be shifted across the border."
 IRQ_1985_make_the_arab_states_pay: "Make the Arab States Pay"
 IRQ_1985_make_the_arab_states_pay_desc: "The Gulf monarchies financed the war while Iran threatened their thrones. Baghdad can now demand that Saudi Arabia, Kuwait, and the smaller Gulf states convert that moral debt into a real balance-sheet transfer."

 IRQ_1985_float_emergency_war_bonds: "Float Emergency War Bonds"
 IRQ_1985_float_emergency_war_bonds_desc: "Ask the Gulf monarchies to buy another round of Iraqi war bonds. The buyers will lose treasury reserves and take on political strain, while Iraq receives immediate cash and owes more bonds."

 GULF_1985_iraqi_bond_exposure_idea: "Exposure to Iraqi War Bonds"
 GULF_1985_iraqi_bond_exposure_idea_desc: "Our treasury is carrying Iraqi war bonds as a political investment against revolutionary Iran. It brings returns on paper, but it ties our budget and credibility to Baghdad's war."
 IRQ_1985_assumed_iraqi_war_debt_idea: "Assumed Iraqi War Debt"
 IRQ_1985_assumed_iraqi_war_debt_idea_desc: "We have accepted a portion of Iraq's wartime debt burden. The decision may avert a diplomatic crisis, but it weighs heavily on the budget and domestic confidence."

 IRQ_1985_war_focus_minor_cost_tt: "§RIraq spends $1.50B from the treasury and adds $2.00B debt to finance this war measure.§!"
 IRQ_1985_war_focus_standard_cost_tt: "§RIraq spends $3.50B from the treasury and adds $4.50B debt to finance this war measure.§!"
 IRQ_1985_war_focus_major_cost_tt: "§RIraq spends $6.00B from the treasury and adds $8.00B debt to finance this major war measure.§!"
 IRQ_1985_gulf_bond_drive_tt: "§YWar bond requests§! will be sent to Saudi Arabia, Kuwait, the United Arab Emirates, Qatar, Bahrain, and Oman if they exist. Accepted offers transfer treasury money to Iraq and add Iraqi bonds to the buyer's holdings."
 IRQ_1985_make_iran_pay_tt: "Iran receives an event to assume §Y70%§! of Iraq's current direct debt. If Iran accepts, Iraq's postwar debt-crash debuff is removed."
 IRQ_1985_make_arab_states_pay_tt: "Saudi Arabia, Kuwait, the United Arab Emirates, Qatar, Bahrain, and Oman receive events to assume divided shares of Iraq's war debt. Each acceptance is painful for the creditor and reduces Iraq's debt-crash pressure."
 IRQ_1985_iran_assumes_debt_tt: "Iran assumes §Y70%§! of Iraq's current direct debt. Iraq removes its postwar debt-crash debuff."
 IRQ_1985_sau_bond_accept_tt: "Saudi Arabia pays §R$10.00B§! and receives §Y$12.00B§! in Iraqi war bonds."
 IRQ_1985_kuw_bond_accept_tt: "Kuwait pays §R$7.00B§! and receives §Y$8.50B§! in Iraqi war bonds."
 IRQ_1985_uae_bond_accept_tt: "The United Arab Emirates pays §R$5.00B§! and receives §Y$6.00B§! in Iraqi war bonds."
 IRQ_1985_qat_bond_accept_tt: "Qatar pays §R$3.00B§! and receives §Y$3.60B§! in Iraqi war bonds."
 IRQ_1985_bhr_bond_accept_tt: "Bahrain pays §R$1.50B§! and receives §Y$1.80B§! in Iraqi war bonds."
 IRQ_1985_oma_bond_accept_tt: "Oman pays §R$1.50B§! and receives §Y$1.80B§! in Iraqi war bonds."
 IRQ_1985_sau_assumes_debt_tt: "Saudi Arabia assumes §Y25%§! of Iraq's registered postwar debt-sharing base."
 IRQ_1985_kuw_assumes_debt_tt: "Kuwait assumes §Y20%§! of Iraq's registered postwar debt-sharing base."
 IRQ_1985_uae_assumes_debt_tt: "The United Arab Emirates assumes §Y10%§! of Iraq's registered postwar debt-sharing base."
 IRQ_1985_qat_assumes_debt_tt: "Qatar assumes §Y6%§! of Iraq's registered postwar debt-sharing base."
 IRQ_1985_bhr_assumes_debt_tt: "Bahrain assumes §Y4%§! of Iraq's registered postwar debt-sharing base."
 IRQ_1985_oma_assumes_debt_tt: "Oman assumes §Y3%§! of Iraq's registered postwar debt-sharing base."

 irq_1985_debt.1.t: "Baghdad Requests a Saudi War Bond Purchase"
 irq_1985_debt.1.d: "Iraqi envoys argue that Baghdad is bleeding Iran on behalf of every Gulf monarchy. They request that Riyadh buy a major package of Iraqi war bonds: cash now for Iraq, a claim on Iraqi repayment later, and a visible political wager on Saddam's war."
 irq_1985_debt.1.a: "Buy the bonds. Iraq must not fall."
 irq_1985_debt.1.b: "Riyadh will not write another blank cheque."
 irq_1985_debt.2.t: "Baghdad Requests a Kuwaiti War Bond Purchase"
 irq_1985_debt.2.d: "Iraq claims that Kuwait's ports, credit, and oil security all depend on containing Tehran. Baghdad wants another purchase of Iraqi war bonds, but the exposure would be politically dangerous if the war drags on."
 irq_1985_debt.2.a: "Finance the front, reluctantly."
 irq_1985_debt.2.b: "Kuwait has paid enough."
 irq_1985_debt.3.t: "Baghdad Requests an Emirati War Bond Purchase"
 irq_1985_debt.3.d: "The Iraqi embassy frames the bond package as a regional security premium: Abu Dhabi pays now, Iraq holds the line, and repayment is promised after victory."
 irq_1985_debt.3.a: "Buy the bonds."
 irq_1985_debt.3.b: "Decline the exposure."
 irq_1985_debt.4.t: "Baghdad Requests a Qatari War Bond Purchase"
 irq_1985_debt.4.d: "Baghdad asks Doha to join the next Gulf financing round. The sum is smaller than the Saudi and Kuwaiti packages, but the political signal is the same."
 irq_1985_debt.4.a: "Contribute to the bond round."
 irq_1985_debt.4.b: "Stay out of Baghdad's books."
 irq_1985_debt.5.t: "Baghdad Requests a Bahraini War Bond Purchase"
 irq_1985_debt.5.d: "Iraq asks Manama for a symbolic but real bond purchase, arguing that even smaller Gulf monarchies benefit from Iraqi pressure on Tehran."
 irq_1985_debt.5.a: "Approve the purchase."
 irq_1985_debt.5.b: "Refuse the request."
 irq_1985_debt.6.t: "Baghdad Requests an Omani War Bond Purchase"
 irq_1985_debt.6.d: "Baghdad wants Muscat to join the financing line. The request is modest, but it still binds Omani credibility to Iraq's war effort."
 irq_1985_debt.6.a: "Buy the bonds."
 irq_1985_debt.6.b: "We will not be dragged deeper."

 irq_1985_debt.10.t: "Iraq Demands That Iran Pay"
 irq_1985_debt.10.d: "Baghdad claims that the war's devastation must be settled by Tehran. Iraqi negotiators demand that Iran assume most of Iraq's direct war debt as the price of diplomatic closure, battlefield defeat, or regional stability."
 irq_1985_debt.10.a: "Accept the burden and close this chapter."
 irq_1985_debt.10.b: "Iran will not pay Saddam's bills."

 irq_1985_debt.20.t: "Iraq Demands Saudi Debt Assumption"
 irq_1985_debt.20.d: "Baghdad argues that Iraq fought as the Arab shield against revolutionary Iran. Saudi Arabia is asked to assume a large share of Iraqi war debt, a decision that would calm Baghdad but anger ministers guarding the treasury."
 irq_1985_debt.20.a: "Assume the Saudi share."
 irq_1985_debt.20.b: "Reject the demand."
 irq_1985_debt.21.t: "Iraq Demands Kuwaiti Debt Assumption"
 irq_1985_debt.21.d: "Iraq now frames Kuwaiti wartime loans as a moral debt owed to Baghdad. Accepting would relieve Iraq's crisis, but the cost to Kuwait would be severe and politically explosive."
 irq_1985_debt.21.a: "Assume the Kuwaiti share."
 irq_1985_debt.21.b: "These loans remain Iraqi obligations."
 irq_1985_debt.22.t: "Iraq Demands Emirati Debt Assumption"
 irq_1985_debt.22.d: "Iraqi diplomats ask Abu Dhabi to absorb a defined portion of Baghdad's war debt. The request is presented as Arab solidarity, but it is also a pressure campaign."
 irq_1985_debt.22.a: "Assume the Emirati share."
 irq_1985_debt.22.b: "Refuse the demand."
 irq_1985_debt.23.t: "Iraq Demands Qatari Debt Assumption"
 irq_1985_debt.23.d: "Doha is asked to take a smaller but still painful share of Iraq's war debt. Baghdad promises gratitude; the finance ministry sees risk."
 irq_1985_debt.23.a: "Assume the Qatari share."
 irq_1985_debt.23.b: "Decline."
 irq_1985_debt.24.t: "Iraq Demands Bahraini Debt Assumption"
 irq_1985_debt.24.d: "Baghdad requests that Bahrain contribute to a divided Arab assumption of Iraq's war debt. The amount is smaller than the Saudi or Kuwaiti share, but it still hits the treasury."
 irq_1985_debt.24.a: "Assume the Bahraini share."
 irq_1985_debt.24.b: "Refuse."
 irq_1985_debt.25.t: "Iraq Demands Omani Debt Assumption"
 irq_1985_debt.25.d: "Iraq asks Oman to take part in the Arab debt package. Muscat can help defuse Baghdad's crisis, but only by accepting a direct fiscal burden."
 irq_1985_debt.25.a: "Assume the Omani share."
 irq_1985_debt.25.b: "Keep our distance."


