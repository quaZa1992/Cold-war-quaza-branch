 COLDWAR_OPEC_mb_legend: "Full member: any net oil exporter, admitted by three quarters of the full members including every founder (Art. 7 C). Associate: seat without vote (Art. 7 D). Observer: any country, simple majority (Art. 11 D). No expulsion: the Statute has none."
 COLDWAR_OPEC_our: "OUR STATUS"
 COLDWAR_OPEC_mb_a_app_tt: "Apply for full membership (50 PP, any net oil exporter, Art. 7 C): the Secretary General gives his opinion in 30 days, then the Conference decides by three quarters including every founder."
 COLDWAR_OPEC_mb_a_aps_tt: "Apply for associate membership (50 PP): a seat without a vote; we may join resolutions. Art. 7 D; MP freedom: any oil producer."
 COLDWAR_OPEC_mb_a_obs_tt: "Ask to sit as an observer (50 PP, simple majority, Art. 11 D): we see the Conference, lobby at half price and may join resolutions."
 COLDWAR_OPEC_mb_a_wd_tt: "Notice of withdrawal (Statute Art. 8): we leave OPEC on the next 1 January. Every obligation ends; the members' opinion of us -15. Coming back needs a new admission. The notice can be cancelled until then."
 COLDWAR_OPEC_mb_a_wdc_tt: "Cancel our notice of withdrawal."
 COLDWAR_OPEC_mb_a_sus_tt: "Ask the Conference to suspend our membership (50 PP, simple majority; Ecuador 1992, Indonesia 2009): no vote and no obligations; we come back by a notice without a new admission."
 COLDWAR_OPEC_mb_a_quo_tt: "Leave our quota (B2) at once: our oil income -8 % ends, our share no longer counts for the quota line."
 COLDWAR_OPEC_mb_a_swg_tt: "Stop balancing the market as swing producer (B3): our -15 % and the others' +5 % end."
 COLDWAR_OPEC_mb_a_rea_tt: "Notice of reactivation: full member again on the next 1 January without a new admission (Indonesia 2016)."
