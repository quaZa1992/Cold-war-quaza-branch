 COLDWAR_OPEC_nw_A1: "Every oil company now pays at least 55 % tax, and the posted price follows inflation. The producers keep more of each barrel; importers in Europe, Japan and America pay a little more, for good."
 COLDWAR_OPEC_nw_A2: "The posted price rises at once and keeps creeping up while the agreements cover a quarter of world exports. Every oil-importing country will pay more for its oil."
 COLDWAR_OPEC_nw_A3: "The posted price is raised to make up for the weaker dollar. Oil bills of the importers rise a little; the producers' income keeps its value."
 COLDWAR_OPEC_nw_A4: "The producers fix the price themselves, without the oil companies, and raise it sharply at once. A price shock for every importer; oil crisis tiers may follow."
 COLDWAR_OPEC_nw_A5: "The posted price is frozen for 180 days. Breathing space for the importers; the producers forgo income while the freeze holds."
 COLDWAR_OPEC_nw_A6: "OPEC follows a moderate line and lowers the posted price for two years. Relief for the importers and goodwill in the West; less income for the producers."
 COLDWAR_OPEC_nw_A7: "The oil price follows a basket of currencies and is adjusted for inflation every 1 January. A falling dollar no longer eats the producers' income; the importers carry the inflation."
 COLDWAR_OPEC_nw_A8: "OPEC sets a reference price and steers the market into its band with the quotas. The world price becomes more predictable for buyers and sellers."
 COLDWAR_OPEC_nw_B1: "The producers hold back output at once. The OPEC price jumps and the spot market spikes. The importers feel it immediately."
 COLDWAR_OPEC_nw_B2: "A production ceiling with national quotas holds the price line: the OPEC level rises every month while the quota holders keep a quarter of world exports. Cheating members could break it."
 COLDWAR_OPEC_nw_B3: "[COLDWAR_OPEC_news_byname] balances the market by cutting its own output, so that the others can keep their quotas. The price holds; the swing producer pays for it."
 COLDWAR_OPEC_nw_B4: "OPEC gives up defending the price and fights for its market share: the quotas end and the oil price falls for half a year. Cheap oil for the world, a blow to producers outside OPEC."
 COLDWAR_OPEC_nw_C1: "The producing states buy into the concessions of the foreign oil companies. More of the oil wealth stays at home; the Western companies and their governments lose influence."
 COLDWAR_OPEC_nw_C2: "OPEC stands behind the nationalisation of the oil industry in [COLDWAR_OPEC_sn_n_target]. The members hold together against sanctions; the home countries of the companies are angered."
 COLDWAR_OPEC_nw_C3: "The members take their oil fields into full national ownership. The age of the foreign concessions ends; the West loses direct control over most of the oil it imports."
 COLDWAR_OPEC_nw_D1: "[COLDWAR_OPEC_sn_n_target] joins OPEC as a full member. The organisation controls a larger share of world oil exports, and its decisions weigh more on the market."
 COLDWAR_OPEC_nw_D2: "[COLDWAR_OPEC_sn_n_target] becomes an associate member of OPEC: it sits at the Conference without a vote and may join its resolutions."
 COLDWAR_OPEC_nw_D3: "The kings and presidents of the oil states meet in solemn summit. The show of unity strengthens the producers' hand."
 COLDWAR_OPEC_nw_D4: "OPEC creates a Special Fund that lends to developing countries outside the organisation. Petrodollars become aid, and influence, in the poorer importing countries."
 COLDWAR_OPEC_nw_D5: "OPEC offers a dialogue to the industrialised countries led by the United States. Tension eases; for a year the price rises only to make up for inflation."
 COLDWAR_OPEC_nw_D7: "[COLDWAR_OPEC_sn_n_target] becomes an observer at the OPEC Conference: it follows the talks and may join resolutions."
 COLDWAR_OPEC_nw_D8: "[COLDWAR_OPEC_news_byname] suspends its membership: it neither votes nor is bound. OPEC loses some of its weight on the market."
 COLDWAR_OPEC_nw_D9: "[COLDWAR_OPEC_sn_n_target] works with OPEC from outside and joins its price line, quotas and cuts. A producer outside the organisation shares its discipline and its costs."
 COLDWAR_OPEC_nw_F1: "The OPEC Fund pays for a two-year programme in [COLDWAR_OPEC_sn_n_target]: new construction and more stability, financed by the oil producers. OPEC gains friends in the developing world."
 COLDWAR_OPEC_nw_E1: "The oil producers stop all deliveries to [COLDWAR_OPEC_sn_n_target]. Its supply shrinks and its oil price soars; the shortage lifts the world price for everybody."
 COLDWAR_OPEC_nw_E2: "The oil weapon: output is cut by 5 % at once and by 5 % more every month. The world price climbs step by step. Every importer is hit, the embargoed ones hardest."
 COLDWAR_OPEC_nw_E3: "OPEC tells [COLDWAR_OPEC_sn_n_target] where it stands: friends are spared the cuts and the shortage, enemies are embargoed. Every importer now watches its own class."
 COLDWAR_OPEC_nw_E4: "The running oil embargo now covers [COLDWAR_OPEC_sn_n_target] as well. One more country loses its oil from the producers."
 COLDWAR_OPEC_nw_E5: "Embargoed oil may no longer reach its targets through refineries in third countries. Every embargo bites harder."
 COLDWAR_OPEC_nw_E6: "As a gesture of goodwill the producers ease the oil weapon by two steps. Relief for the consumers; tension falls."
 COLDWAR_OPEC_nw_E7: "The producers lift their oil embargo on [COLDWAR_OPEC_sn_n_target]. Oil flows again; only the members that did not agree keep theirs."
 COLDWAR_OPEC_nw_E8: "The producers end their embargoes and cuts and pay [COLDWAR_OPEC_sn_n_target] instead, so that it can carry on. Oil flows again; the front state lives on petrodollars."
