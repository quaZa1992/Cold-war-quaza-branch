 COLDWAR_OPEC_tier1_tt: "§HOil crisis tier 1§!: real price from 1.5x that of January 1970, for a country that imports its oil.\nTax revenue and factory output -2 % (scaled by its oil dependency), consumer goods up, stability down. Strategic reserves and oil price resistance soften it. [?global.cwop_tier1|0] countries are in this tier now."
 COLDWAR_OPEC_tier2_n: "[?global.cwop_tier2|0]"
 COLDWAR_OPEC_tier2_l: "2 · 2.5x+"
 COLDWAR_OPEC_tier2_tt: "§HOil crisis tier 2§!: real price from 2.5x that of January 1970, for a country that imports its oil.\nTax revenue and factory output -6 % (scaled by its oil dependency), consumer goods up, stability down. Strategic reserves and oil price resistance soften it. [?global.cwop_tier2|0] countries are in this tier now."
 COLDWAR_OPEC_tier3_n: "[?global.cwop_tier3|0]"
 COLDWAR_OPEC_tier3_l: "3 · 4x+"
 COLDWAR_OPEC_tier3_tt: "§HOil crisis tier 3§!: real price from 4x that of January 1970, for a country that imports its oil.\nTax revenue and factory output -12 % (scaled by its oil dependency), consumer goods up, stability down. Strategic reserves and oil price resistance soften it. [?global.cwop_tier3|0] countries are in this tier now."
 COLDWAR_OPEC_tier4_n: "[?global.cwop_tier4|0]"
 COLDWAR_OPEC_tier4_l: "4 · 6x+"
 COLDWAR_OPEC_tier4_tt: "§HOil crisis tier 4§!: real price from 6x that of January 1970, for a country that imports its oil.\nTax revenue and factory output -20 % (scaled by its oil dependency), consumer goods up, stability down. Strategic reserves and oil price resistance soften it. [?global.cwop_tier4|0] countries are in this tier now."
