 COLDWAR_OPEC_open_tt: "§HOPEC · Organization of the Petroleum Exporting Countries§!\nThe oil price explained, the Conference, members, resolutions, embargoes and the Fund.\nShift+O"
 COLDWAR_OPEC_kicker: "ORGANIZATION OF THE PETROLEUM EXPORTING COUNTRIES"
 COLDWAR_OPEC_title: "OPEC"
 COLDWAR_OPEC_kicker_tt: "§HOPEC§!: Organization of the Petroleum Exporting Countries, founded in Baghdad on 14 September 1960; Secretariat in Vienna since 1965. The flags: the full members in the order of accession."
 COLDWAR_OPEC_lab_0: "SECRETARY GEN."
 COLDWAR_OPEC_lab_1: "PRESIDENT"
 COLDWAR_OPEC_lab_2: "NEXT CONF."
 COLDWAR_OPEC_sg_tt: "§HSecretary General§! (Statute Art. 28)\nAppointed by the Conference unanimously for three years (renewable once); without unanimity the office goes by rotation for two years. A player office: candidacy 30 days (50 PP), election by the players and the AI delegations. He drafts every resolution, may table it at once or decline it, pays half for his own requests and sees the market three months ahead. Without a Secretary General the President of the Conference leads the Secretariat (as from mid-1983 to mid-1988)."
 COLDWAR_OPEC_pres_tt: "§HPresident of the Conference§! (Statute Art. 14)\nRotates at every Conference among the member governments led by players, in the order of accession. He may put one file first on the agenda."
 COLDWAR_OPEC_conf_tt: "§HThe Conference§! (Statute Art. 12)\nTwo ordinary meetings a year (here 1 June and 1 December, 30 days, four files). An extraordinary meeting sits when a member asks (100 PP) and a simple majority approves within 7 days."
 COLDWAR_OPEC_viewing: "VIEWING AS"
 COLDWAR_OPEC_footer_right: "[?global.cwop_n_players|0] PLAYERS · [?global.cwop_n_ai|0] AI DELEGATIONS"
 COLDWAR_OPEC_footer_mid_tt: "§HHow OPEC decides§!\nEvery full member has one vote: §GFor§!, §YReservation§! or §RAgainst§!. One Against blocks a resolution; a Reservation lets it pass but the member is not bound (the practice of Doha 1976). A resolution takes effect 30 days after the Conference unless a full member objects (Art. 11). The game rule adds that the For-voters must hold 15 % of world oil exports for a price, output or embargo resolution. AI delegations vote by KI-Lite: their stance (interest + persuasion) is shown in the CONFERENCE tab and every player may change it."
 COLDWAR_OPEC_mk_head: "§OTHE OIL PRICE§!"
 COLDWAR_OPEC_mk_head_r: "ECONOMIC COMMISSION · MONTHLY"
 COLDWAR_OPEC_mk_price: "$§Y[?global.cwop_mk_price|2]§! / bbl"
 COLDWAR_OPEC_mk_price_tt: "§HThe oil price in dollars of the day§!\n1.80 $ (the posted price of January 1970) x spot market / 75 x OPEC level x embargo shortage x US consumer prices.\nNow: 1.80 x [?global.cwop_mk_spot|1] / 75 x [?global.cwop_mk_level|2] x [?global.cwop_mk_emb|2] x [?global.cwop_mk_cpi|2] = §Y$[?global.cwop_mk_price|2]§!.\nImporters pay through Imperia's oil formulas and the crisis tiers; exporters earn through the petrodollar factor."
 COLDWAR_OPEC_mk_sub: "dollars of the day · §Y[?global.cwop_mk_real|2]§! x January 1970 (real) · $§Y[?global.cwop_mk_usd70|2]§! in 1970 dollars"
 COLDWAR_OPEC_mk_sub_tt: "§HReal price§! = spot / 75 x OPEC level x embargo shortage = §Y[?global.cwop_mk_real|2]§! times the price of January 1970 (global.mdcw_cw_oil_ratio). The Cold War system, the oil crisis tiers and the COMECON clearing read this ratio."
 COLDWAR_OPEC_mk_fc_lab: "NEXT MONTH"
 COLDWAR_OPEC_mk_fc_up: "§G+[?global.cwop_fc_pct|1] %§!"
 COLDWAR_OPEC_mk_fc_down: "§R[?global.cwop_fc_pct|1] %§!"
 COLDWAR_OPEC_mk_fc_eq: "±0.0 %"
 COLDWAR_OPEC_mk_fc_tt: "§HForecast of the OPEC level§! (same formulas as the monthly Cold War update, only read)\nNext month: §Y[?global.cwop_fc_next|2]§!. [COLDWAR_OPEC_ui_fc_sg]"
 COLDWAR_OPEC_mk_fc_sg: "In three months: §Y[?global.cwop_fc_next3|2]§! (Secretary General's market report)."
 COLDWAR_OPEC_mk_ch1_lab: "SPOT MARKET"
 COLDWAR_OPEC_mk_ch1_val: "§Y[?global.cwop_mk_spot|1]§!"
 COLDWAR_OPEC_mk_ch1_sub: "Imperia model $\n(75 = normal)"
 COLDWAR_OPEC_mk_sym1: "x"
 COLDWAR_OPEC_mk_ch2_lab: "OPEC LEVEL"
 COLDWAR_OPEC_mk_ch2_val: "§Y[?global.cwop_mk_level|2]§!"
 COLDWAR_OPEC_mk_ch2_sub: "price decisions\nof OPEC"
 COLDWAR_OPEC_mk_sym2: "x"
 COLDWAR_OPEC_mk_ch3_lab: "EMBARGOES"
 COLDWAR_OPEC_mk_ch3_val: "x§Y[?global.cwop_mk_emb|2]§!"
 COLDWAR_OPEC_mk_ch3_sub: "oil kept off\nthe market"
 COLDWAR_OPEC_mk_sym3: "x"
 COLDWAR_OPEC_mk_ch4_lab: "US PRICES"
 COLDWAR_OPEC_mk_ch4_val: "x§Y[?global.cwop_mk_cpi|2]§!"
 COLDWAR_OPEC_mk_ch4_sub: "US CPI,\n1970 = 1"
 COLDWAR_OPEC_mk_sym4: "="
 COLDWAR_OPEC_mk_ch5_lab: "PRICE"
 COLDWAR_OPEC_mk_ch5_val: "$§O[?global.cwop_mk_price|2]§!"
 COLDWAR_OPEC_mk_ch5_sub: "per barrel,\ntoday's $"
 COLDWAR_OPEC_mk_ch1_tt: "§HSpot market (Imperia)§! [?global.cwop_mk_spot|1] model dollars; 75 = normal, from 15 to 200.\nIt moves every week towards an equilibrium of 30-120 (supply and demand of the Imperia oil market), plus the risk premium of Cold War tension (+0.3 for every point above 50), war and event spikes and the asking prices of the exporters."
 COLDWAR_OPEC_mk_ch2_tt: "§HOPEC level§! [?global.cwop_mk_level|2] (1970 = 1, from 0.5 to 12)\nPrice resolutions of OPEC multiply it at once (A2-A4 up, A6 down, B1 output restraint). Every month: price agreements covering 25 % of world exports creep it up 1.5 % x their share towards 1 + 0.8 x share; cut agreements pull it down; without either it drifts back to 1; above 3 consumers save and new fields come in (-0.4 %). Cuts (E2), quotas (B2), a reference price (A8) and a freeze (A5) act on it too."
 COLDWAR_OPEC_mk_ch3_tt: "§HEmbargo shortage§! x[?global.cwop_mk_emb|2]\nEvery running embargo keeps oil off the world market: 1 + 0.25 x the share of world exports blocked (now [?global.cwop_mk_embpct|1] %, at most 75 %). Embargoed importers feel far more than this world factor; most favoured consumers (E3) feel none of it, preferential ones half."
 COLDWAR_OPEC_mk_ch4_tt: "§HUS consumer prices§! x[?global.cwop_mk_cpi|2] (BLS CPI-U, 1970 = 1)\nOnly for the display in dollars of the day. Dollar inflation is why OPEC asked for compensation (A3, Geneva 1972-73) and a currency basket (A7)."
 COLDWAR_OPEC_mk_ch5_tt: "§HThe price§! $[?global.cwop_mk_price|2] a barrel in dollars of the day, $[?global.cwop_mk_usd70|2] in dollars of 1970.\nImporters reach crisis tiers at 1.5, 2.5, 4 and 6 times the real price of January 1970; exporters earn the petrodollar factor."
 COLDWAR_OPEC_mk_why1: "Spot market: the Imperia market moves weekly towards its equilibrium (30-120 model $) and jumps with wars and events. Tension above 50 adds a risk premium of 0.3 per point. OPEC cannot set it; the producers' asking prices only push it."
 COLDWAR_OPEC_mk_why2: "OPEC level: price agreements cover [?global.cwop_mk_share|0] % and cut agreements [?global.cwop_mk_cut|0] % of world exports. From 25 % they move the level every month. Resolutions of the Conference move it at once with the export share of their For-voters."
 COLDWAR_OPEC_mk_why3: "Embargo shortage: [?global.cwop_mk_embpct|1] % of world exports are kept from their buyers. The world pays x[?global.cwop_mk_emb|2]; the targets pay their own surcharge by the export share of the countries that embargo them."
 COLDWAR_OPEC_mk_why4: "Consumer prices: the posted price is set in dollars. US inflation eats the producers' income. A3 compensates when US prices rose 5 % since the last compensation, A7 does it every year."
 COLDWAR_OPEC_mk_why5: "The price: [?global.cwop_mk_real|2] times January 1970 in real terms. Who reads it: the Cold War system (crisis tiers, market confidence, arms demand), Imperia's oil formulas, the COMECON clearing and the national focus trees."
 COLDWAR_OPEC_mk_fc: "FORECAST · [COLDWAR_OPEC_ui_fc_text]"
 COLDWAR_OPEC_fc_1: "price agreements cover [?global.cwop_mk_share|0] % of world exports (25 % line): the level creeps up [?global.cwop_fc_pct|1] % towards [?global.cwop_fc_target|2].[COLDWAR_OPEC_ui_fc_more]"
 COLDWAR_OPEC_fc_2: "price agreements cover [?global.cwop_mk_share|0] %, but the level has reached its line ([?global.cwop_fc_target|2]); only the market or a resolution moves it.[COLDWAR_OPEC_ui_fc_more]"
 COLDWAR_OPEC_fc_3: "a tight market above 100: the posted price follows the spot market up ([?global.cwop_fc_pct|1] %).[COLDWAR_OPEC_ui_fc_more]"
 COLDWAR_OPEC_fc_4: "cut agreements cover [?global.cwop_mk_cut|0] % of world exports: the level falls [?global.cwop_fc_pct|1] %.[COLDWAR_OPEC_ui_fc_more]"
 COLDWAR_OPEC_fc_5: "cut agreements have brought the level to their line.[COLDWAR_OPEC_ui_fc_more]"
 COLDWAR_OPEC_fc_6: "no agreement covers 25 % of world exports: the level drifts back towards 1 ([?global.cwop_fc_pct|1] %).[COLDWAR_OPEC_ui_fc_more]"
 COLDWAR_OPEC_fc_7: "no agreement and the level stands at 1: stable.[COLDWAR_OPEC_ui_fc_more]"
 COLDWAR_OPEC_fc_8: "the price freeze (A5) holds the level.[COLDWAR_OPEC_ui_fc_more]"
 COLDWAR_OPEC_fc_save: " Above 3 consumers save: -0.4 %."
 COLDWAR_OPEC_fc_res1: " The oil weapon cuts again (E2)."
 COLDWAR_OPEC_fc_res2: " Quotas hold the line (+1 %)."
 COLDWAR_OPEC_fc_res3: " The market-share strategy lets it fall (-3 %)."
 COLDWAR_OPEC_fc_res4: " The reference price pulls it into its band (A8)."
