 COLDWAR_OPEC_nm_sel_0: "choose a country"
 COLDWAR_OPEC_nm_emb_tt: "§HImpose Oil Embargo§! (50 PP): the Cold War diplomatic action, the same as in the diplomacy screen\nWe stop selling oil to [COLDWAR_OPEC_sn_ntgt]. The pressure on it grows with our share of world exports (and of everyone else who embargoes it); we lose sales; the world shortage factor rises; trade relations -100 both ways; tension +1. Only exporters with the major or minor exporter spirit; not on a country we exempt."
 COLDWAR_OPEC_nm_exe_tt: "§HGrant Oil Exemption§! (10 PP): the Cold War diplomatic action\n[COLDWAR_OPEC_sn_ntgt] is exempt from our embargo policy: joint embargoes we take part in do not reach it through us."
 COLDWAR_OPEC_nm_lift_tt: "§HLift Oil Embargo§!: the Cold War diplomatic action\nOnly our own oil embargo on [COLDWAR_OPEC_sn_ntgt] ends. If it was our part in a joint embargo, the bound members may see it as a breach (opinion), but OPEC has no sanction."
 COLDWAR_OPEC_nm_rev_tt: "§HWithdraw Oil Exemption§!: the Cold War diplomatic action\n[COLDWAR_OPEC_sn_ntgt] is no longer exempt from our embargo policy."
 COLDWAR_OPEC_au_head: "EMBARGOES AGAINST US"
 COLDWAR_OPEC_au_on: "[?cwop_ui_embn|0] countries · pressure §R[?cwop_ui_embp|0] %§! · [COLDWAR_OPEC_ui_au_class]"
 COLDWAR_OPEC_au_off: "Nobody embargoes us. · [COLDWAR_OPEC_ui_au_class]"
 COLDWAR_OPEC_au_cl1: "class: most favoured"
 COLDWAR_OPEC_au_cl2: "class: preferential"
 COLDWAR_OPEC_au_cl3: "class: neutral"
 COLDWAR_OPEC_au_cl4: "class: embargoed"
 COLDWAR_OPEC_au_res_on: "Strategic reserve: §Gthe surcharge is halved§!"
 COLDWAR_OPEC_au_res_off: "No strategic reserve (it would halve the surcharge)"
 COLDWAR_OPEC_au_tt: "§HEmbargoes against us§!\nOur oil price gets a surcharge: 1 + 1.2 x pressure x our import dependency (half with a strategic petroleum reserve, half if we export oil ourselves). The pressure is the export share of the countries that embargo us (at most 80 %; x1.25 under a ban on indirect supply).\nCounter-lobby: in the CONFERENCE tab every player may lobby, pay or press each AI delegation on an embargo file; a lifting (E7) binds only its For-voters."
 COLDWAR_OPEC_fd_head: "THE OPEC FUND"
 COLDWAR_OPEC_fd_head_r: "VIENNA 1976"
 COLDWAR_OPEC_fd_on: "Established · [?cwop_ui_nfp|0] payers · 0.1 % of GDP a year"
 COLDWAR_OPEC_fd_off: "Not established: the Conference creates it (D4)."
 COLDWAR_OPEC_fd_tt: "§HThe OPEC Fund§! (Special Fund, January 1976, about $800 million; OPEC Fund for International Development 1980)\nThe payers give 0.1 % of their GDP a year while a programme runs. A programme (F1, simple majority) helps one country outside OPEC for 730 days: it counts as received assistance in the Cold War system (construction +5 %, x1.25 if non-aligned) and its opinion of the payers rises. Two programmes at most."
 COLDWAR_OPEC_fd_prop_tt: "Opens the programme of the OPEC Fund (F1) in the RESOLUTIONS tab, with the country chosen under national measures."
 COLDWAR_OPEC_dec_A2_tt: "Opens the OPEC window at resolution §YA2 · Five-Year Price Agreement§!. The vote now runs in the OPEC Conference: request it there (50 PP, the Secretary General pays half), win the delegations, and the members that vote For are bound."
 COLDWAR_OPEC_dec_A6_tt: "Opens the OPEC window at resolution §YA6 · A Moderate Price Line§!. The vote now runs in the OPEC Conference: request it there (50 PP, the Secretary General pays half), win the delegations, and the members that vote For are bound."
 COLDWAR_OPEC_dec_B1_tt: "Opens the OPEC window at resolution §YB1 · Output Restraint§!. The vote now runs in the OPEC Conference: request it there (50 PP, the Secretary General pays half), win the delegations, and the members that vote For are bound."
 COLDWAR_OPEC_ev_t_ord: "The OPEC Conference Opens"
 COLDWAR_OPEC_ev_t_extra: "Extraordinary OPEC Conference"
 COLDWAR_OPEC_ev_t_ask: "An Extraordinary Conference Is Asked"
 COLDWAR_OPEC_ev_t_oapec: "The Arab Oil Ministers Meet"
 COLDWAR_OPEC_ev_t_sg: "Election of the OPEC Secretary General"
 COLDWAR_OPEC_ev_s_ord: "The ministers of the Organization of the Petroleum Exporting Countries meet in Vienna for §Y30 days§! (Statute Art. 12). Our delegation votes §GFor§!, §YReservation§! or §RAgainst§! on every file of the agenda in the OPEC window (§YShift+O§!, CONFERENCE tab). One Against blocks a resolution; a Reservation lets it pass but does not bind us. AI delegations vote by their stance, and every player may lobby them."
 COLDWAR_OPEC_ev_s_sg: "Several delegations stand for Secretary General. Every player member votes once within §Y30 days§! in the OPEC window; AI delegations vote for the candidate they like best. Elected unanimously (no player for another candidate, no AI delegation against him) he serves §Ythree years§!; otherwise the office goes by rotation for §Ytwo years§! (Statute Art. 28)."
 COLDWAR_OPEC_ev_sg_full: "for §Ythree years§!, appointed unanimously (Statute Art. 28)."
 COLDWAR_OPEC_ev_sg_rot: "for §Ytwo years§! by rotation, as the Conference found no unanimity (Statute Art. 28)."
 COLDWAR_OPEC_ev_adm_full: "§Ya full member§!"
 COLDWAR_OPEC_ev_adm_assoc: "§Yan associate member§!"
