 COLDWAR_OPEC.6.t: "OPEC Admits a New Member"
 COLDWAR_OPEC.6.d: "§Y[COLDWAR_OPEC_sn_ev6_target]§! is now [COLDWAR_OPEC_ev6_admitted] of the Organization of the Petroleum Exporting Countries. Shares of world exports, votes and the rotation of the offices change with it."
 COLDWAR_OPEC.8.t: "The Oil Weapon"
 COLDWAR_OPEC_ev_w_51_e8: "The members have declared a joint oil embargo on §Y[COLDWAR_OPEC_sn_ev8_target]§!. Every bound member stops its oil deliveries; the shortage raises the world price and hits the target hardest (OPEC window, EMBARGOES tab)."
 COLDWAR_OPEC_ev_w_54_e8: "The joint oil embargo now also covers §Y[COLDWAR_OPEC_sn_ev8_target]§!."
 COLDWAR_OPEC_ev_w_53_e8: "The members class §Y[COLDWAR_OPEC_sn_ev8_target]§! as embargoed: every bound member stops its oil deliveries (OPEC window, EMBARGOES tab)."
 COLDWAR_OPEC.8.d: "[COLDWAR_OPEC_ev8_weapon]"
 COLDWAR_OPEC.9.t: "Oil Embargo Ends"
 COLDWAR_OPEC.9.d: "The joint oil embargo on §Y[COLDWAR_OPEC_sn_ev9_target]§! has ended. Bilateral embargoes that members decided on their own stay in force."
