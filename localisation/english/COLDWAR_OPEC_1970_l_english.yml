 COLDWAR_OPEC_em_r2_tt: "§HJoint embargo on [COLDWAR_OPEC_sn_ekt2]§!\nEvery source has imposed the Oil Embargo (the Cold War diplomatic action) on the target (and on its subjects or its alliance if the resolution said so). Targets: [?cwop_ui_ekn2|0] (with subjects or alliance if so decided). The sources hold §Y[?cwop_ui_eks2|1] %§! of world exports; the pressure on the target is §Y[?cwop_ui_ekp2|0] %§! (Cold War formula: their share, the target's import dependency; at most 80 %).\nIt ends at its date, when the target stops fighting a member or an Arab state (if so decided), by lifting (E7, only for the For-voters) or when no source is left.\nClick to select it for a proposal (E7 lifts the selected embargo)."
