 COLDWAR_OPEC_ev_s_extra_e1: "An extraordinary Conference sits for §Y21 days§! on §Y[COLDWAR_OPEC_ev1_item_title]§!. Vote in the OPEC window (§YShift+O§!). It closes as soon as every player delegation has voted."
 COLDWAR_OPEC_ev_s_ask_e1: "A member asks for an extraordinary Conference on §Y[COLDWAR_OPEC_ev1_item_title]§!. The Secretary General convenes it when a simple majority of the members approves within §Y7 days§! (Statute Art. 12). Approve or reject in the OPEC window."
 COLDWAR_OPEC_ev_s_oapec_e1: "The Arab oil ministers meet at once on §Y[COLDWAR_OPEC_ev1_item_title]§! (Kuwait, October 1973). They decide within §Y14 days§! by majority; a delegation that votes against is not bound. Vote in the OPEC window."
