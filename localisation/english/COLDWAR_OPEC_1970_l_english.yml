 COLDWAR_OPEC_kind_dove: "DOVE"
 COLDWAR_OPEC_kind_middle: "MIDDLE"
 COLDWAR_OPEC_ui_dp_page: "[?cwop_ui_dpage1|0]/[?cwop_ui_dpages|0]"
 COLDWAR_OPEC_a_vfor_tt: "§GFor§!: we are bound, with gain and price. Our share of world exports counts for the 15 % line and the size of the effect."
 COLDWAR_OPEC_a_vres_tt: "§YReservation§!: the resolution may pass, but we are neither bound nor paid (Doha 1976). The practice of OPEC when a member does not want to block."
 COLDWAR_OPEC_a_vag_tt: "§RAgainst§!: one Against blocks a resolution of the Conference (unanimity, Art. 11 C). On the OAPEC way an Against only keeps us out."
 COLDWAR_OPEC_a_apr_tt: "Approve the extraordinary Conference. It sits 21 days on this file when a simple majority of the members approves within 7 days (Art. 12); AI delegations approve unless they are Against the file."
 COLDWAR_OPEC_a_rej_tt: "Reject the extraordinary Conference. The file then waits for the next ordinary Conference."
 COLDWAR_OPEC_a_obj_tt: "Object within 30 days (Statute Art. 11): an adopted resolution then does not take effect; one already in force (oil weapon, unilateral price) no longer binds us."
 COLDWAR_OPEC_a_acc_tt: "Accept: an invitation makes us a candidate (opinion of the Secretary General 30 days, then the Conference votes); an offer after a vote takes effect for us."
 COLDWAR_OPEC_a_dec_tt: "Decline the invitation or offer. The file closes."
 COLDWAR_OPEC_a_table_tt: "Secretary General: put this draft on the agenda at once (it waits for the next Conference)."
 COLDWAR_OPEC_a_decl_tt: "Secretary General: decline to table this draft. The file closes and the requester is told."
 COLDWAR_OPEC_a_fwd_tt: "President of the Conference: put this file first on the agenda (once per Conference)."
 COLDWAR_OPEC_a_extra_tt: "Ask for an extraordinary Conference on this file (100 PP). The Secretary General convenes it when a simple majority approves within 7 days (Art. 12). Not while a Conference sits."
 COLDWAR_OPEC_a_stand_tt: "Stand for Secretary General (50 PP). Elected unanimously: three years, renewable once. Otherwise the office goes by rotation for two years (Art. 28)."
 COLDWAR_OPEC_rnow: "IF THE VOTE CLOSED NOW"
 COLDWAR_OPEC_rnow_tt: "§HThe count as it stands§!: players as they voted (players who did not vote count as bound For-voters, except for admissions and the OAPEC way), AI delegations by their stance today. The AI votes are only final when the vote closes; lobbying can still change them."
 COLDWAR_OPEC_why_head_sg: "HOW THE DELEGATIONS ELECT"
 COLDWAR_OPEC_why_head: "WHY [COLDWAR_OPEC_sn_del] VOTES SO"
 COLDWAR_OPEC_why_head0: "WHY A DELEGATION VOTES SO"
 COLDWAR_OPEC_why_temp_l: "Temperament"
 COLDWAR_OPEC_why_temp_v: "[?cwop_uv_del_ic_temp|+0]"
 COLDWAR_OPEC_why_temp_tt: "Temperament of the delegation on this kind of resolution (design 5.3): hawks (Algeria, Libya, Iraq, Iran under the Shah, Venezuela, Nigeria) want higher prices, doves (Saudi Arabia, the UAE, Kuwait, Qatar) moderation. From -40 to +40."
 COLDWAR_OPEC_why_money_l: "Money"
 COLDWAR_OPEC_why_money_v: "[?cwop_uv_del_ic_money|+0]"
 COLDWAR_OPEC_why_money_tt: "Debt above 40 % of GDP or an empty treasury: +15 for a higher price, -15 for a lower one (Iraq, Nigeria, Venezuela, Indonesia)."
 COLDWAR_OPEC_why_price_l: "Price level"
 COLDWAR_OPEC_why_price_v: "[?cwop_uv_del_ic_price|+0]"
 COLDWAR_OPEC_why_price_tt: "Real price above 4x 1970: -15 for a rise (fear for demand, the Saudi line 1977-78). Below 1.5x: +10 (the posted price has lost purchasing power)."
 COLDWAR_OPEC_why_bloc_l: "Bloc"
 COLDWAR_OPEC_why_bloc_v: "[?cwop_uv_del_ic_bloc|+0]"
 COLDWAR_OPEC_why_bloc_tt: "A Western delegation does not embargo its own bloc (-40) and is cautious on prices (-5); Soviet and Beijing bloc delegations like an embargo on the West (+15)."
 COLDWAR_OPEC_why_war_l: "Arab-Israeli war"
 COLDWAR_OPEC_why_war_v: "[?cwop_uv_del_ic_war|+0]"
 COLDWAR_OPEC_why_war_tt: "Arab delegations within a year of an Arab-Israeli war: +30 for the oil weapon, -30 for lifting it (October 1973)."
 COLDWAR_OPEC_why_opin_l: "Opinion of the requester"
 COLDWAR_OPEC_why_opin_v: "[?cwop_uv_del_ic_opin|+0]"
 COLDWAR_OPEC_why_opin_tt: "Opinion of the requesting country: above 50 +15, above 20 +8, below -20 -8, below -50 -15."
 COLDWAR_OPEC_why_tgt_l: "The target"
 COLDWAR_OPEC_why_tgt_v: "[?cwop_uv_del_ic_tgt|+0]"
 COLDWAR_OPEC_why_tgt_tt: "Embargoes: reversed opinion of the target, +20 against supporters of Israel (Arab delegations) or colonial and apartheid regimes (Arab and African delegations), -40 against members, -30 against the own bloc leader. Admissions: opinion of the applicant, war -60, same bloc +10, a big exporter -10 (quota competition), developing +10."
 COLDWAR_OPEC_why_quota_l: "Market share"
 COLDWAR_OPEC_why_quota_v: "[?cwop_uv_del_ic_quota|+0]"
 COLDWAR_OPEC_why_quota_tt: "Quotas: a delegation with more than 20 % of world exports guards its market share (-10)."
 COLDWAR_OPEC_why_int_l: "Interest (at most ±60)"
 COLDWAR_OPEC_why_int_v: "[?cwop_uv_del_int|+0]"
 COLDWAR_OPEC_why_int_tt: "Sum of the lines above, limited to ±60 so that players can always turn the vote at least one step (Enes, 30.10.2026)."
 COLDWAR_OPEC_why_per_l: "Persuasion by players (±50)"
 COLDWAR_OPEC_why_per_v: "[?cwop_uv_del_per|+0]"
 COLDWAR_OPEC_why_per_tt: "Lobby (25 PP: ±12 x trust 0.5-1.5 by its opinion of the lobbyist, x1.5 with a running Cold War programme), compensation (0.2 % of the payer's GDP: ±15), bloc pressure (a bloc leader on its own bloc, 50 PP: ±25, opinion -10). Every player once per kind, file and delegation; together at most ±50."
 COLDWAR_OPEC_why_h_l: "Stance → vote"
 COLDWAR_OPEC_why_h_v: "§H[?cwop_uv_del_h|+0]§! [COLDWAR_OPEC_ui_why_vote]"
 COLDWAR_OPEC_why_h_tt: "+25 and more: For. -25 and less: Against. In between: Reservation. Invitations: accepted from +25."
 COLDWAR_OPEC_wv1: "§GFOR§!"
 COLDWAR_OPEC_wv2: "§RAGAINST§!"
 COLDWAR_OPEC_wv3: "§YRESERVATION§!"
 COLDWAR_OPEC_why_player: "A player decides for himself. Select an AI delegation to see its reasons and to lobby it."
 COLDWAR_OPEC_why_sg: "AI delegations vote for the candidate they like best: their opinion of him (÷5, at most ±20), the same bloc +10, the same temperament (hawk or dove) +10, war with him -60, plus the campaigns of players. Players click a candidate to vote for him; anyone may campaign for a candidate once per election."
 COLDWAR_OPEC_sgc_tt: "Campaign for [COLDWAR_OPEC_sn_del]: 25 PP; every AI delegation moves +12 towards him, times its trust in us (0.5 to 1.5 by its opinion of us). Once per election; public."
 COLDWAR_OPEC_p_lf_tt: "Lobby the delegation to vote For (25 PP, half for an observer): +12 x its trust in us (0.5 to 1.5 by its opinion of us), x1.5 with a running Cold War programme to it. Once per file."
 COLDWAR_OPEC_p_la_tt: "Lobby the delegation to vote Against (consumers such as the USA, Western Europe and Japan do it too): -12 x trust. Once per file."
 COLDWAR_OPEC_p_pf_tt: "Compensation for a For vote: 0.2 % of our GDP goes to its treasury; +15, its opinion of us +10. Once per file."
 COLDWAR_OPEC_p_pa_tt: "Compensation for an Against vote: 0.2 % of our GDP; -15, its opinion of us +10. Once per file."
 COLDWAR_OPEC_p_bf_tt: "Bloc pressure (only a bloc leader on a delegation of its own bloc): 50 PP, +25, its opinion of us -10. Once per file."
 COLDWAR_OPEC_p_ba_tt: "Bloc pressure against: 50 PP, -25, its opinion of us -10. Once per file."
