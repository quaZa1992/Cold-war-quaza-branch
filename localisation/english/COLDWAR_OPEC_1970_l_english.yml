 COLDWAR_OPEC_em_u_peace: "with peace"
 COLDWAR_OPEC_em_u_lift: "by lifting"
 COLDWAR_OPEC_em_empty: "No joint embargo runs. A joint embargo (E1) makes every member that votes For impose the Oil Embargo (the Cold War diplomatic action) on the target. On the OAPEC way the Arab oil ministers decide within 14 days by majority, on the Conference way all full members with unanimity and Reservation. One country alone imposes it as a national measure (right) or in the diplomacy screen."
 COLDWAR_OPEC_ow_head: "THE OIL WEAPON AND THE CONSUMERS"
 COLDWAR_OPEC_ow_cut_l: "PRODUCTION CUTS (E2)"
 COLDWAR_OPEC_ow_cut_on: "§Y[?global.cwop_cut_stage|0] %§! of [?global.cwop_cut_cap|0] % · [?cwop_ui_ncut|0] cutting"
 COLDWAR_OPEC_ow_cut_off: "none"
 COLDWAR_OPEC_ow_cut_tt: "§HThe oil weapon§! (Kuwait, 17 October 1973)\nThe bound members cut their output 5 % at once and 5 % more every month up to the ceiling (10, 15 or 25 %; Algiers: at most 25 %). Every step multiplies the OPEC level by 1 + 5 % x the export share of the cutters; the cutters lose 1 % of oil export income for every 1 % of cut. Most favoured consumers (E3) are spared, preferential ones feel half. Easing (E6) takes two steps back; lifting the last joint embargo (E7) or the Khartoum formula (E8) ends the cuts."
 COLDWAR_OPEC_ow_leak_on: "Indirect supply §Rbanned§! (E5): pressure x1.25"
 COLDWAR_OPEC_ow_leak_off: "Indirect supply open: refiners in third countries pass oil on"
 COLDWAR_OPEC_ow_leak_tt: "§HBan on indirect supply§! (4 November 1973)\nWithout it embargoed oil reaches the target through refineries in third countries (1967 failed this way; Rotterdam stayed open in 1973). With it the pressure on every target is multiplied by 1.25 (a COLDWAR line in the Cold War formula); the bound members lose 5 % of oil income (refinery customers)."
 COLDWAR_OPEC_ow_k_on: "Khartoum: [COLDWAR_OPEC_sn_g_k_target] is paid until [?cwop_ui_ky|0]"
 COLDWAR_OPEC_ow_k_off: "Khartoum formula (E8): pump and pay instead"
 COLDWAR_OPEC_ow_k_tt: "§HThe Khartoum formula§! (1 September 1967)\nThe For-voters resume pumping (their part in joint embargoes and cuts ends) and pay the front state 0.2 % of their GDP a year for three years (Kuwait, Saudi Arabia and Libya paid Egypt and Jordan $378 million a year). [?cwop_ui_nkp|0] countries pay now."
 COLDWAR_OPEC_cl1_l: "MOST FAVOURED"
 COLDWAR_OPEC_cl1_tt: "§HMost Favoured§!\nMost favoured consumers (E3; France, Spain, Britain in 1973): the bound members exempt them, and they feel no world shortage in their oil price."
 COLDWAR_OPEC_cl1_none: "–"
 COLDWAR_OPEC_cl2_l: "PREFERENTIAL"
 COLDWAR_OPEC_cl2_tt: "§HPreferential§!\nPreferential consumers (E3; Japan, the Philippines, Belgium in December 1973): exempt by the bound members, half the world shortage."
 COLDWAR_OPEC_cl2_none: "–"
 COLDWAR_OPEC_cl4_l: "EMBARGOED"
 COLDWAR_OPEC_cl4_tt: "§HEmbargoed§!\nEmbargoed consumers: the targets of joint embargoes (E1, E4), or classed so by E3."
 COLDWAR_OPEC_cl4_none: "–"
 COLDWAR_OPEC_pp_head: "PROPOSE · CHAPTER E OF THE RESOLUTIONS"
 COLDWAR_OPEC_pp_E1_tt: "§HE1 · Joint Embargo on§!\nBaghdad 4-5 Jun 1967 (failed: re-routing, Iran and Venezuela stayed out); USA 18-20 Oct, Netherlands 23 Oct 1973\nOpens the resolution in the RESOLUTIONS tab with the country chosen under national measures."
 COLDWAR_OPEC_pp_E2_tt: "§HE2 · The Oil Weapon: Graduated Production Cuts§!\nKuwait 17 Oct 1973 (5 % at once, then 5 % a month); 4 Nov 1973 (25 % below September)\nOpens the resolution in the RESOLUTIONS tab."
 COLDWAR_OPEC_pp_E3_tt: "§HE3 · Classification of§!\nMost favoured states 11/1973; four classes 22 Dec 1973 (Japan, the Philippines, Belgium preferential)\nOpens the resolution in the RESOLUTIONS tab with the country chosen under national measures."
 COLDWAR_OPEC_pp_E4_tt: "§HE4 · Extending the Embargo to§!\nAlgiers summit 26-28 Nov 1973: South Africa, Portugal, Rhodesia\nOpens the resolution in the RESOLUTIONS tab with the country chosen under national measures."
 COLDWAR_OPEC_pp_E5_tt: "§HE5 · Ban on Indirect Supply§!\n4 Nov 1973 (also refineries supplying US forces); Libya closes Caribbean refineries 21 Dec 1973\nOpens the resolution in the RESOLUTIONS tab."
 COLDWAR_OPEC_pp_E6_tt: "§HE6 · Easing for Goodwill§!\nEC (without the Netherlands) spared the December cut, 18 Nov 1973; cut 25 to 15 %, 22-25 Dec 1973\nOpens the resolution in the RESOLUTIONS tab."
 COLDWAR_OPEC_pp_E7_tt: "§HE7 · Lifting the Embargo on§!\nVienna 18 Mar 1974 (USA; Syria and Libya stood aside); Cairo 10-11 Jul 1974 (Netherlands)\nOpens the resolution in the RESOLUTIONS tab with the selected embargo."
 COLDWAR_OPEC_pp_E8_tt: "§HE8 · The Khartoum Formula for§!\nKhartoum 1 Sep 1967: resume pumping, Kuwait, Saudi Arabia, Libya pay $266m a year to Egypt, $112m to Jordan\nOpens the resolution in the RESOLUTIONS tab with the country chosen under national measures."
