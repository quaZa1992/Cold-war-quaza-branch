 COLDWAR_OPEC_msel_head0: "SELECT A COUNTRY"
 COLDWAR_OPEC_msel_tt: "§HKI-Lite§!: an AI country answers by its stance: interest (at most ±60) plus persuasion by players (at most ±50). From +25 it accepts an invitation or keeps its quota; at -25 and below it overproduces."
 COLDWAR_OPEC_mb_q_lf_tt: "Lobby the quota holder to keep its quota (25 PP): +12 x trust. Once while the quotas run."
 COLDWAR_OPEC_mb_q_la_tt: "Lobby it to overproduce (25 PP): -12 x trust. Once while the quotas run."
 COLDWAR_OPEC_mb_q_pf_tt: "Pay it to keep its quota: 0.2 % of our GDP, +15. Once while the quotas run."
 COLDWAR_OPEC_mb_q_bf_tt: "Bloc pressure to keep its quota (bloc leaders on their own bloc, 50 PP): +25, its opinion of us -10."
 COLDWAR_OPEC_mb_inv_tt: "Invite this producer to join OPEC (25 PP, a free file). A player decides himself; an AI country answers by its stance after 30 days in which anyone may lobby it. If it accepts, the Secretary General gives his opinion (30 days) and the Conference decides by three quarters including every founder."
 COLDWAR_OPEC_ms_quota: "Quota holder (B2). Quota discipline: stance [?cwop_ui_qh|+0] (temperament [?cwop_uv_msel_ic_temp|+0], money [?cwop_uv_msel_ic_money|+0], temptation [?cwop_uv_msel_ic_price|+0], market share [?cwop_uv_msel_ic_quota|+0], lobbying [?cwop_uv_msel_per|+0]). It overproduces at -25."
 COLDWAR_OPEC_ms_inv: "If invited it would answer with stance [?cwop_ui_iv|+0] ([COLDWAR_OPEC_ui_inv_word]): exporter [?cwop_uv_msel_ic_temp|+0], bloc [?cwop_uv_msel_ic_bloc|+0], opinion of us [?cwop_uv_msel_ic_opin|+0], war [?cwop_uv_msel_ic_war|+0]."
 COLDWAR_OPEC_ms_mem: "Full member since [?cwop_uv_msel_acc|0]. Bound by: [COLDWAR_OPEC_ui_msel_o]. Temperament: hawk up, dove down on prices; see the CONFERENCE tab for its stance on a file."
 COLDWAR_OPEC_ms_cand: "Candidate: its admission is on the agenda (CONFERENCE tab). Three quarters of the full members including every founder decide (Art. 7 C)."
 COLDWAR_OPEC_ms_assoc: "Associate member: a seat at the Conference without a vote (Art. 7 D); it may join resolutions in force."
 COLDWAR_OPEC_ms_obs: "Observer (Art. 11 D): follows the Conference, lobbies at half price and may join resolutions in force."
 COLDWAR_OPEC_ms_susp: "Suspended: no vote and no obligations until a notice of reactivation (next 1 January)."
