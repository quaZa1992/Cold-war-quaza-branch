 COLDWAR_OPEC_nm_note: "Our own Oil Embargo or Oil Exemption, without a vote: the Cold War diplomatic actions."
 COLDWAR_OPEC_nm_f0_tt: "Countries that import oil and are not full members of OPEC."
 COLDWAR_OPEC_nm_f1_tt: "Countries we embargo now (our own bilateral embargoes and our part in joint embargoes)."
 COLDWAR_OPEC_nm_f2_tt: "Countries we exempt from our embargoes."
 COLDWAR_OPEC_nm_empty: "No country in this list."
 COLDWAR_OPEC_nm_noexp: "Embargo and exemption are tools of oil exporters. As a consumer: lobby the delegations on an embargo file, ask to be classed most favoured (E3) or build a strategic petroleum reserve."
