 COLDWAR_OPEC_mb_col_c: "COUNTRY"
 COLDWAR_OPEC_mb_col_c_tt: "Country (a flag with a gold frame is a founder: its vote is needed for every admission)."
 COLDWAR_OPEC_mb_col_s: "STATUS"
 COLDWAR_OPEC_mb_col_s_tt: "Full member (votes), associate (seat without vote, Art. 7 D), observer (Art. 11 D), suspended (no vote, no obligations), candidate, co-operating producer."
 COLDWAR_OPEC_mb_col_g: "GOVT"
 COLDWAR_OPEC_mb_col_g_tt: "Governed by a player (votes himself) or by the AI (votes by KI-Lite)."
 COLDWAR_OPEC_mb_col_b: "BLOC"
 COLDWAR_OPEC_mb_col_b_tt: "Bloc in the Cold War system. A Western delegation does not embargo its own bloc."
 COLDWAR_OPEC_mb_col_x: "SHARE"
 COLDWAR_OPEC_mb_col_x_tt: "Share of world oil exports (weights the resolutions and the embargoes)."
 COLDWAR_OPEC_mb_col_t: "TEMPER"
 COLDWAR_OPEC_mb_col_t_tt: "Temperament of the delegation: hawks want high prices and the oil weapon, doves moderation (KI-Lite)."
