 COLDWAR_OPEC_evt_D4: "The OPEC Special Fund"
 COLDWAR_OPEC_evt_D5: "Dialogue with the Industrialised Countries"
 COLDWAR_OPEC_evt_D8: "Suspension of Our Membership"
 COLDWAR_OPEC_evt_E2: "The Oil Weapon: Graduated Production Cuts"
 COLDWAR_OPEC_evt_E5: "Ban on Indirect Supply"
 COLDWAR_OPEC_evt_E6: "Easing for Goodwill"
 COLDWAR_OPEC_evt_sg: "Secretary General"
 COLDWAR_OPEC_evt_none: "our membership"
 COLDWAR_OPEC_ev_res_1: "§GAdopted§!. It takes effect in 30 days unless a full member objects in the OPEC window (Statute Art. 11); resolutions of the oil weapon and unilateral prices work at once and an objector only leaves the obligation."
 COLDWAR_OPEC_ev_res_2: "§RBlocked§!: a full member voted Against. OPEC decides by unanimity (Statute Art. 11 C); a Reservation would have let it pass. The resolution can return after 180 days if it is a one-off."
 COLDWAR_OPEC_ev_res_3: "§YNo effect§!: the members that voted For hold less than 15 % of world oil exports. A price line without the producers does not hold."
 COLDWAR_OPEC_ev_res_4: "§RNot adopted§!: the majority was not reached (admission: three quarters of the full members including every founder; procedure: a simple majority; OAPEC: a majority of the Arab oil ministers)."
 COLDWAR_OPEC_ev_res_6: "§RDeclined§!: the invited or addressed country did not accept, or did not answer in time."
 COLDWAR_OPEC_ev_res_7: "§RThe Secretary General declined§! to table this draft."
 COLDWAR_OPEC_ev_res_8: "The file closed: its target no longer exists."
 COLDWAR_OPEC_ev_res_9: "§GIn force§! for the members bound by it."
 COLDWAR_OPEC_ev_res_0: "The file is on the agenda."
 COLDWAR_OPEC_ev_w_52: "The producers cut their output by 5 % at once and by 5 % more every month (Kuwait, October 1973). The OPEC level rises with every step (OPEC window, MARKET tab)."
 COLDWAR_OPEC_member: "Member of OPEC"
 COLDWAR_OPEC_member_desc: "We sit in the Conference of the Organization of the Petroleum Exporting Countries in Vienna: one country, one vote, and every resolution needs us (Statute Art. 11). The producers' front lifts the posted price we receive."
 COLDWAR_OPEC_associate: "Associate Member of OPEC"
 COLDWAR_OPEC_associate_desc: "We take part in the deliberations of the Conference without a vote (Statute Art. 7 E) and may join its resolutions."
 COLDWAR_OPEC_observer: "Observer at OPEC"
 COLDWAR_OPEC_observer_desc: "Our delegation follows the Conference in Vienna (Statute Art. 11 D). We may lobby the delegations and join resolutions."
 COLDWAR_OPEC_suspended: "Suspended OPEC Membership"
 COLDWAR_OPEC_suspended_desc: "Our membership rests: no vote and no obligations. A notice brings us back on the next 1 January without a new admission (Indonesia 2016)."
 COLDWAR_OPEC_presidency: "President of the OPEC Conference"
 COLDWAR_OPEC_presidency_desc: "Our minister presides over the Conference of OPEC and orders its agenda."
 COLDWAR_OPEC_secretary_general: "OPEC Secretary General"
 COLDWAR_OPEC_secretary_general_desc: "One of our officials leads the Secretariat in Vienna: he drafts every resolution, may table it at once or decline it, and sees the market three months ahead."
 COLDWAR_OPEC_oapec: "Member of the OAPEC"
 COLDWAR_OPEC_oapec_desc: "We belong to the Organization of Arab Petroleum Exporting Countries (Kuwait, 1968). Its oil ministers can decide on the oil weapon within two weeks."
 COLDWAR_OPEC_t_A5: "OPEC: Price Freeze"
 COLDWAR_OPEC_t_A5_desc: "A resolution of OPEC weighs on us for 180 days."
 COLDWAR_OPEC_t_B1: "OPEC: Output Restraint"
 COLDWAR_OPEC_t_B1_desc: "A resolution of OPEC weighs on us for 180 days."
 COLDWAR_OPEC_t_B4: "OPEC: Market-Share Strategy"
 COLDWAR_OPEC_t_B4_desc: "A resolution of OPEC works for us for 365 days."
 COLDWAR_OPEC_t_C2: "OPEC: OPEC Backs Our Nationalisation"
 COLDWAR_OPEC_t_C2_desc: "A resolution of OPEC works for us for 365 days."
 COLDWAR_OPEC_t_D3: "OPEC: Summit of Sovereigns"
 COLDWAR_OPEC_t_D3_desc: "A resolution of OPEC works for us for 365 days."
 COLDWAR_OPEC_t_E8: "OPEC: Khartoum Aid"
 COLDWAR_OPEC_t_E8_desc: "A resolution of OPEC works for us for 1095 days."
 COLDWAR_OPEC_t_F1: "OPEC: OPEC Fund Programme"
 COLDWAR_OPEC_t_F1_desc: "A resolution of OPEC works for us for 730 days."
