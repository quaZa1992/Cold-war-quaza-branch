 COLDWAR_OPEC_sg_ctitle: "Election of the Secretary General (Statute Art. 28)"
 COLDWAR_OPEC_sg_gain: "· Leads the Secretariat: tables or declines drafts\n· Pays half; sees the market three months ahead"
 COLDWAR_OPEC_sg_price: "· Needs a player member; two terms at most"
 COLDWAR_OPEC_sg_proc: "Candidacy 30 days (50 PP), election 30 days by the players and the AI delegations. Unanimous: three years. Otherwise rotation: two years."
 COLDWAR_OPEC_sg_note: "Without a Secretary General the President of the Conference leads the Secretariat (as 1983-88)."
 COLDWAR_OPEC_fst_sg1: "Candidacy open · 30 days · four candidates at most"
 COLDWAR_OPEC_fst_sg2: "Election · players vote by clicking a candidate"
 COLDWAR_OPEC_fst_1: "By [COLDWAR_OPEC_sn_f_by] · drafted by the Secretariat"
 COLDWAR_OPEC_fst_2: "By [COLDWAR_OPEC_sn_f_by] · waits for the next Conference"
 COLDWAR_OPEC_fst_3: "By [COLDWAR_OPEC_sn_f_by] · extraordinary Conference asked"
 COLDWAR_OPEC_fst_4: "By [COLDWAR_OPEC_sn_f_by] · before the Conference"
 COLDWAR_OPEC_fst_5: "Adopted · in force unless a member objects"
 COLDWAR_OPEC_fst_6: "By [COLDWAR_OPEC_sn_f_by] · [COLDWAR_OPEC_sn_f_target] answers"
 COLDWAR_OPEC_fst_7: "By [COLDWAR_OPEC_sn_f_by] · before the Arab oil ministers"
 COLDWAR_OPEC_fst_8: "In force · a bound member may still object"
 COLDWAR_OPEC_fh_sg: "Unanimous (no player or AI delegation for another): three years. Otherwise the office rotates for two years."
 COLDWAR_OPEC_fh_1: "The Secretary General may table the draft at once or decline it. Without him it waits [?cwop_ui_f_left|0] more days."
 COLDWAR_OPEC_fh_2: "It goes before the next ordinary Conference (four files, oldest first), unless a member asks for an extraordinary one (100 PP)."
 COLDWAR_OPEC_fh_3: "Members approve or reject; AI delegations approve unless they are Against the file. Approved: the Conference sits 21 days at once."
 COLDWAR_OPEC_fh_4: "Vote For, Reservation or Against. One Against blocks. Lobby the AI delegations on the right; their stance decides when the vote closes."
 COLDWAR_OPEC_fh_5: "Takes effect in [?cwop_ui_f_left|0] days. A full member may object until then; an AI delegation that was turned Against objects too."
 COLDWAR_OPEC_fh_6: "The addressed country answers. An AI country decides by its stance when the 30 days end; lobby it on the right."
 COLDWAR_OPEC_fh_7: "The Arab oil ministers decide by majority. Who votes against is not bound (Iraq, 17 October 1973)."
 COLDWAR_OPEC_fh_8: "In force. For [?cwop_ui_f_left|0] days a bound member may still object and leave the obligation."
 COLDWAR_OPEC_rn_sg: "The candidate with most votes wins; unanimity gives three years."
 COLDWAR_OPEC_rn_offer: "The addressed country decides: stance [?cwop_ui_offer_h|+0] (accepts from +25)."
 COLDWAR_OPEC_rn_1: "For [?cwop_ui_nf|0] · Reservation [?cwop_ui_nr|0] · Against [?cwop_ui_na|0] of [?cwop_ui_n|0]. The For-voters hold [?cwop_ui_fsh|0] % of world exports."
 COLDWAR_OPEC_rn_2: "Blocked: [?cwop_ui_na|0] Against. Unanimity is needed; a Reservation would let it pass."
 COLDWAR_OPEC_rn_3: "No effect: the For-voters hold only [?cwop_ui_fsh|0] % of world exports (15 % needed)."
 COLDWAR_OPEC_rn_4: "No majority: For [?cwop_ui_nf|0] of [?cwop_ui_n|0] (founders For: [?cwop_ui_ffd|0] of [?cwop_ui_nfd|0])."
 COLDWAR_OPEC_rn_5: "Not yet counted."
