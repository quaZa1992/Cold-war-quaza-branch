l_english:
 # IMPERIA COLD WAR — Cold War internal faction events (2026-11-13)
 coldwar_ifac.1.t:0 "Landowners Resist Land Reform"
 coldwar_ifac.1.d:0 "The large landowners have united against the land reform bill in the legislature. They warn that breaking up the estates will ruin farm output, while smallholders and rural labourers call the bill long overdue. The landowners expect the government to drop it."
 coldwar_ifac.1.o1:0 "Shelve the reform"
 coldwar_ifac.1.o2:0 "Push the reform through"
 coldwar_ifac.1.o3:0 "Buy out the largest estates"
 coldwar_ifac.2.t:0 "Estate Owners Demand Export Credits"
 coldwar_ifac.2.d:0 "Falling world prices for grain and cash crops have squeezed the large estates. The landowners are asking for state export credits so they can keep selling abroad without cutting production."
 coldwar_ifac.2.o1:0 "Grant the export credits"
 coldwar_ifac.2.o2:0 "Sell through the state marketing board"
 coldwar_ifac.2.o3:0 "They will have to manage"
 coldwar_ifac.3.t:0 "The General Staff Demands New Equipment"
 coldwar_ifac.3.d:0 "The General Staff has sent the government a list of equipment it considers outdated. The generals argue that our potential enemies are modernising quickly and that the army cannot wait for the next budget."
 coldwar_ifac.3.o1:0 "Fund the procurement programme"
 coldwar_ifac.3.o2:0 "Promise funds in the next budget"
 coldwar_ifac.3.o3:0 "The current equipment will do"
 coldwar_ifac.4.t:0 "Officers Complain About Pay"
 coldwar_ifac.4.d:0 "Junior and mid-ranking officers are complaining that their pay has fallen behind civilian salaries. Senior commanders warn that good officers are leaving the service and that morale in the barracks is sinking."
 coldwar_ifac.4.o1:0 "Pay a one-off service bonus"
 coldwar_ifac.4.o2:0 "Offer housing and privileges instead"
 coldwar_ifac.4.o3:0 "Remind them of their duty"
 coldwar_ifac.5.t:0 "Oil Companies Seek Exploration Licences"
 coldwar_ifac.5.d:0 "The oil and gas companies want new exploration licences on terms they call competitive. The ministry warns that generous terms mean lower royalties for the state for years to come."
 coldwar_ifac.5.o1:0 "Grant licences on generous terms"
 coldwar_ifac.5.o2:0 "Grant licences with state participation"
 coldwar_ifac.5.o3:0 "Keep the fields closed for now"
 coldwar_ifac.6.t:0 "Bankers Lobby Against Exchange Controls"
 coldwar_ifac.6.d:0 "The large banks are lobbying against our exchange controls. They argue that the rules keep foreign capital away and push business to other financial centres. Our economists fear capital flight if the controls go."
 coldwar_ifac.6.o1:0 "Lift the controls"
 coldwar_ifac.6.o2:0 "Ease them for trade finance only"
 coldwar_ifac.6.o3:0 "The controls stay"
 coldwar_ifac.7.t:0 "Wall Street Fears for the Dollar"
 coldwar_ifac.7.d:0 "Foreign central banks are converting their dollars into gold and the trade balance keeps worsening. The big New York banks and brokerage houses demand that the government defend the dollar at any cost."
 coldwar_ifac.7.o1:0 "Defend the dollar"
 coldwar_ifac.7.o2:0 "Reassure the markets in public"
 coldwar_ifac.7.o3:0 "Close the gold window"
 coldwar_ifac.8.t:0 "Brokers Fight Over Fixed Commissions"
 coldwar_ifac.8.d:0 "Regulators want to end the fixed commissions on stock trades. The established brokerage houses are lobbying hard to keep them, while large institutional investors push for open competition."
 coldwar_ifac.8.o1:0 "Keep the fixed commissions"
 coldwar_ifac.8.o2:0 "Phase them out over several years"
 coldwar_ifac.8.o3:0 "Abolish them now"
 coldwar_ifac.9.t:0 "Chaebols Request Policy Loans"
 coldwar_ifac.9.d:0 "The heads of the largest business groups ask for cheap state-directed loans to expand their factories and shipyards. They promise new exports in return, but critics say the groups are growing too powerful."
 coldwar_ifac.9.o1:0 "Grant the directed credit"
 coldwar_ifac.9.o2:0 "Tie the loans to export targets"
 coldwar_ifac.9.o3:0 "Refuse the request"
 coldwar_ifac.10.t:0 "Chaebols Compete for Heavy Industry Licences"
 coldwar_ifac.10.d:0 "The government plans to build up steel, chemicals and shipbuilding. Every major business group wants the licences, and the groups that lose out are already complaining to the ministries."
 coldwar_ifac.10.o1:0 "Give the licences to the leading groups"
 coldwar_ifac.10.o2:0 "Split the licences between the groups"
 coldwar_ifac.10.o3:0 "Keep heavy industry in state hands"
 coldwar_ifac.11.t:0 "Traders Expand the Farmers' Markets"
 coldwar_ifac.11.d:0 "Private traders have turned the local farmers' markets into busy trading places. They ask the authorities to look the other way, while party officials report the markets as a danger to the planned economy."
 coldwar_ifac.11.o1:0 "Tolerate the markets"
 coldwar_ifac.11.o2:0 "License a few stalls"
 coldwar_ifac.11.o3:0 "Close the markets"
 coldwar_ifac.12.t:0 "Bishops Speak Out on Social Questions"
 coldwar_ifac.12.d:0 "The bishops have published a pastoral letter on poverty, wages and land. Many of the faithful welcome it, but some ministers see it as open criticism of the government's policies."
 coldwar_ifac.12.o1:0 "Embrace their message"
 coldwar_ifac.12.o2:0 "Meet the bishops in private"
 coldwar_ifac.12.o3:0 "Tell the Church to stay out of politics"
 coldwar_ifac.13.t:0 "Church Schools Request State Funding"
 coldwar_ifac.13.d:0 "The church school network is running short of money. The clergy ask the state to pay for buildings and teachers, pointing out that their schools educate a large share of the nation's children."
 coldwar_ifac.13.o1:0 "Fund the church schools"
 coldwar_ifac.13.o2:0 "Pay only the teachers' salaries"
 coldwar_ifac.13.o3:0 "Public money is for public schools"
 coldwar_ifac.14.t:0 "Temple Authorities Request Restoration Funds"
 coldwar_ifac.14.d:0 "Several of the nation's most important temples and shrines are in poor repair. The priesthood asks the government to pay for their restoration before the next great festival."
 coldwar_ifac.14.o1:0 "Pay for the restoration"
 coldwar_ifac.14.o2:0 "Make a partial grant"
 coldwar_ifac.14.o3:0 "The temples must raise their own funds"
 coldwar_ifac.15.t:0 "Priesthood Opposes the Family Planning Campaign"
 coldwar_ifac.15.d:0 "Religious leaders have spoken out against the government's family planning campaign. They call it an attack on tradition, and some villages have already turned the health workers away."
 coldwar_ifac.15.o1:0 "Suspend the campaign"
 coldwar_ifac.15.o2:0 "Exempt religious communities"
 coldwar_ifac.15.o3:0 "The campaign continues"
 COLDWAR_ifac_subsidy_costs_tt:0 "Additional Expenses: §R0.125%§! of GDP\n"
