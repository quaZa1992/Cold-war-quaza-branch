 COLDWAR_POL.701.a: "Pledge reform within the alliance."
 COLDWAR_POL.701.b: "Mobilise and wait."
 COLDWAR_POL.701.c: "Answer with silence."
 COLDWAR_POL.701.d: "A letter from the Soviet Politburo reaches the Central Committee. It speaks of counter-revolution, of the fate of socialism in Poland and of fraternal duty. Soviet divisions are on the move along the border."
 COLDWAR_POL.701.e: "The moment has passed."
 COLDWAR_POL.701.t: "The Letter from the Pact"
 COLDWAR_POL.702.a: "Buy Western oil on credit."
 COLDWAR_POL.702.b: "Ration fuel at home."
 COLDWAR_POL.702.c: "Ask Moscow to talk."
 COLDWAR_POL.702.d: "The Druzhba pipeline delivers only part of the agreed oil. Moscow says nothing about the reason, and nothing needs to be said."
 COLDWAR_POL.702.e: "The moment has passed."
 COLDWAR_POL.702.t: "The Taps Run Dry"
 COLDWAR_POL.703.a: "Accept the deferral."
 COLDWAR_POL.703.b: "We will manage alone."
 COLDWAR_POL.703.c: "The moment has passed."
 COLDWAR_POL.703.d: "Moscow offers to defer the payments of the rouble debt for a year. The bankers in Warsaw breathe again; the comrades in Moscow will remember the favour."
 COLDWAR_POL.703.t: "The Rouble Deferral"
 COLDWAR_POL.704.a: "A loyal debtor is a loyal ally."
 COLDWAR_POL.704.b: "The moment has passed."
 COLDWAR_POL.704.d: "Poland has accepted our offer to defer its rouble payments."
 COLDWAR_POL.704.t: "Warsaw Accepts the Deferral"
 COLDWAR_POL.706.a: "Release the prisoners."
 COLDWAR_POL.706.b: "Hold firm."
 COLDWAR_POL.706.c: "Ignore it."
 COLDWAR_POL.706.d: "The United States suspends its trade privileges and credits for Poland until the prisoners are free and the union is legal again."
 COLDWAR_POL.706.e: "The moment has passed."
 COLDWAR_POL.706.t: "Washington Closes the Door"
 COLDWAR_POL.707.a: "Accept the aid package."
 COLDWAR_POL.707.b: "Decline politely."
 COLDWAR_POL.707.c: "The moment has passed."
 COLDWAR_POL.707.d: "The American ambassador brings word that the sanctions are lifted, and an offer of food and medical aid."
 COLDWAR_POL.707.t: "A Thaw in Washington"
 COLDWAR_POL.708.a: "Accept the parcels."
 COLDWAR_POL.708.b: "The state needs no charity."
 COLDWAR_POL.708.c: "The moment has passed."
 COLDWAR_POL.708.d: "Polish-American organisations send food, medicine and clothes, and the State Department pays for the ships."
 COLDWAR_POL.708.t: "Parcels from Polonia"
 COLDWAR_POL.709.a: "Ship them."
 COLDWAR_POL.709.b: "The moment has passed."
 COLDWAR_POL.709.d: "Poland has accepted the Polish-American relief."
 COLDWAR_POL.709.t: "The Parcels Arrive"
 COLDWAR_POL.710.a: "Welcome the Holy Father."
 COLDWAR_POL.710.b: "The time is not right."
 COLDWAR_POL.710.c: "The moment has passed."
 COLDWAR_POL.710.d: "The Holy See proposes a papal pilgrimage to Poland. Millions would come to the Masses, and Moscow would count every one of them."
 COLDWAR_POL.710.t: "Nine Days of Prayer"
 COLDWAR_POL.711.a: "Deo gratias."
 COLDWAR_POL.711.b: "The moment has passed."
 COLDWAR_POL.711.d: "Warsaw has agreed to the papal pilgrimage."
 COLDWAR_POL.711.t: "The Pilgrimage Is Welcome"
 COLDWAR_POL.712.a: "Let the batch leave."
 COLDWAR_POL.712.b: "Keep the quota unused."
 COLDWAR_POL.712.c: "The moment has passed."
 COLDWAR_POL.712.d: "Bonn asks that the next 25,000 ethnic Germans may leave for the Federal Republic. Every family that goes takes skilled hands from Silesia and Masuria."
 COLDWAR_POL.712.t: "The Exit Quota"
 COLDWAR_POL.713.a: "Welcome them."
 COLDWAR_POL.713.b: "The moment has passed."
 COLDWAR_POL.713.d: "Another 25,000 resettlers have crossed from Poland under the reunification quota."
 COLDWAR_POL.713.t: "Resettlers from Poland"
 COLDWAR_POL.714.a: "Protest in East Berlin."
 COLDWAR_POL.714.b: "Accept it quietly."
 COLDWAR_POL.714.c: "The moment has passed."
 COLDWAR_POL.714.d: "From today a Pole may enter the German Democratic Republic only with a written invitation. East Berlin fears the Polish disease more than it values the Polish shoppers."
 COLDWAR_POL.714.t: "The Border Closes"
 COLDWAR_POL.715.a: "Sign the rescheduling."
 COLDWAR_POL.715.b: "We will pay on time."
 COLDWAR_POL.715.c: "The moment has passed."
 COLDWAR_POL.715.d: "The creditors' club in Paris offers to reschedule this year's payments, on condition that Poland pays a little longer."
 COLDWAR_POL.715.t: "Rescheduled Payments"
 COLDWAR_POL.716.a: "We will honour the terms."
 COLDWAR_POL.716.d: "The grace period of the Paris rescheduling has ended."
 COLDWAR_POL.716.t: "The Rescheduled Payments Fall Due"
 COLDWAR_POL.801.a: "Pay them."
 COLDWAR_POL.801.d: "A year has passed, and the payments deferred last year are due again."
 COLDWAR_POL.801.t: "The Deferred Payments Fall Due"
 COLDWAR_POL_1970_focus: "Poland: The Small Stabilisation"
 COLDWAR_POL_1970_party_0: "£generic_Western_Autocracy_small Government-in-Exile (London)"
 COLDWAR_POL_1970_party_1: "£generic_conservatism_small Znak"
 COLDWAR_POL_1970_party_13: "£generic_Neutral_Autocracy_small PZPR (Silesian Group)"
 COLDWAR_POL_1970_party_14: "£generic_Neutral_conservatism_small Polish Episcopate"
 COLDWAR_POL_1970_party_15: "£generic_oligarchism_small Red Directors"
 COLDWAR_POL_1970_party_16: "£MDCW_P70_ALLIANCE_OF_DEMOCRATS_POLAND Democratic Party (SD)"
 COLDWAR_POL_1970_party_17: "£generic_Neutral_green_small League for Nature Protection"
 COLDWAR_POL_1970_party_18: "£generic_neutral_Social_small United People's Party (ZSL)"
 COLDWAR_POL_1970_party_19: "£generic_Neutral_Communism_small Communist Party of Poland (Mijal)"
 COLDWAR_POL_1970_party_2: "£generic_liberalism_small Kultura"
 COLDWAR_POL_1970_party_20: "£generic_Nat_Populism_small Confederation of Independent Poland"
 COLDWAR_POL_1970_party_20_desc: "(Independence Nationalism) - Confederation of Independent Poland (Polish: Konfederacja Polski Niepodleglej, KPN)\n\nThe independence underground of the 1970s: the Ruch group, tried in June 1970 for plotting against the state, the Movement for the Defence of Human and Civic Rights (ROPCiO) of 1977, and the Confederation that Leszek Moczulski declared on 1 September 1979.\n\nIt calls the People's Republic institutionalised Russian rule and wants a sovereign, democratic Third Republic in the tradition of Pilsudski's Legions, with free elections and workers' participation in management. Its strength lies in national memory, not in numbers."
 COLDWAR_POL_1970_party_22: "£POL_Nat_Autocracy_small Polish People's Army (WRON)"
 COLDWAR_POL_1970_party_3: "£generic_socialism_small Polish Socialist Party"
 COLDWAR_POL_1970_party_4: "£generic_Communist_State_small PZPR (Central Committee)"
 COLDWAR_POL_1970_party_5: "£generic_anarchist_communism_small KOR and Solidarity"
 COLDWAR_POL_1970_party_5_desc: "(Democratic Socialism) - KOR and Solidarity\n\nThe Commandos of the 1968 student revolt and the strike committees of the coast form one movement: Jacek Kuron and Karol Modzelewski, who wrote the Open Letter to the Party in 1965, Adam Michnik, and the workers of Gdansk and Szczecin. From it will come the Workers' Defence Committee (KOR) of 1976 and the free trade union Solidarity of 1980.\n\nThe movement asks for free speech, free unions, workers' councils and the rule of law, and rejects both the bureaucrats of the Party and the nationalism of the Partisans. Its strength lies in the factories, the universities and the uncensored press."
 COLDWAR_POL_1970_party_6: "£generic_Conservative_small PAX Association"
 COLDWAR_POL_1970_party_7: "£generic_Autocracy_small PZPR (Partisans)"
 COLDWAR_POL_after_the_coast: "After the Coast"
 COLDWAR_POL_after_the_coast_desc: "Whatever happened at the shipyard gates, the Party must explain itself to the workers. The Central Committee meets to decide who speaks for Poland now."
 COLDWAR_POL_agreements_category: "Agreements of Poland"
 COLDWAR_POL_agreements_category_desc: "Our standing agreements with other governments. An agreement is suspended while either side is at war with the other or imposes an embargo or sanctions on it, and returns without new payments."
 COLDWAR_POL_agricultural_circles: "Agricultural Circles"
 COLDWAR_POL_agricultural_circles_desc: "The village circle owns the tractor, the combine and the threshing machine, and lends them to the small farms by the week. The county agronomist drops in with advice and forms, and the farmers find that sharing a machine costs less than quarrelling over one."
 COLDWAR_POL_algeria_engineering: "Engineers and Doctors for Algeria"
 COLDWAR_POL_algeria_engineering_desc: "Algiers hires Polish engineers, teachers and doctors for its industrial plan. Polish voices are heard in hospitals and technical schools from Oran to Annaba, and the postcards home are full of oranges and heat.\n\n§gAgreement with Algeria: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_algeria_engineering_partner: "Engineers and Doctors for Algeria"
 COLDWAR_POL_algeria_engineering_partner_desc: "Polish engineers, teachers and doctors arrive on state contracts to staff Algeria's hospitals and technical colleges. The national plan needs trained hands, and these hands are disciplined, cheap and friendly.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_alliance_loyalty: "Within the Alliances"
 COLDWAR_POL_alliance_loyalty_desc: "The programme promises reform without breaking Poland's international alliances. The Soviet ambassador is told early and in person, the army stays in its barracks, and Western friends are asked to be patient with a country that lives next door to its protector.\n\n§gLapses while KOR and Solidarity are out of power and returns when they govern again.§!"
 COLDWAR_POL_arms_libya: "Arms and Builders for Libya"
 COLDWAR_POL_arms_libya_desc: "Tripoli pays in oil money for Polish tanks, shells and housing blocks. Convoys leave Gdynia with crates stencilled in Arabic, and Polish builders put up whole districts in the desert under a hard sun.\n\n§gAgreement with Libya: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_arms_libya_partner: "Arms and Builders for Libya"
 COLDWAR_POL_arms_libya_partner_desc: "Colonel Gaddafi's government buys tanks, ammunition and entire housing estates from Polish state firms and pays on delivery with oil money. Libyan officers are trained in Polish military schools, and the instructors are surprised at how well the desert pays.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_army_ai1: "Bumar-Labedy: The Tank Works"
 COLDWAR_POL_army_ai1_desc: "Gliwice's Labedy works turn out T-55s by the hundred for Poland and the Pact. The assembly line is Soviet; the welders are Silesian."
 COLDWAR_POL_army_ai1_tb: "Bumar-Labedy: The Tank Works"
 COLDWAR_POL_army_ai2a: "Swidnik Helicopters for the Bloc"
 COLDWAR_POL_army_ai2a_desc: "Poland builds Mi-2 helicopters for the whole bloc and is paid in transferable roubles. Work is shared, designs are not, and the generals chafe."
 COLDWAR_POL_army_ai2b: "Own Design Bureaus"
 COLDWAR_POL_army_ai2b_desc: "Polish engineers at the design bureaus draw their own armoured cars, engines and radios. Moscow regards a national arms industry as national ambition."
 COLDWAR_POL_army_ai2b_tb: "Own Design Bureaus"
 COLDWAR_POL_army_ai3: "The T-72 Licence"
 COLDWAR_POL_army_ai3_desc: "Poland asks Moscow for the licence to the Soviet army's newest tank. Bumar-Labedy would build it for Poland and, under licence, for export."
 COLDWAR_POL_army_ai3_tb: "The T-72 Licence"
 COLDWAR_POL_army_ai4: "The Military Technical Academy"
 COLDWAR_POL_army_ai4_desc: "WAT in Warsaw trains the engineers, radar officers and rocket specialists the Pact needs. Its laboratories are among the best in the country."
 COLDWAR_POL_army_ai4_tb: "The Military Technical Academy"
 COLDWAR_POL_army_ai5a: "Arms for Cash: Libya and Iraq"
 COLDWAR_POL_army_ai5a_desc: "Libya and Iraq seek Polish tanks and infantry weapons. Each government must approve its purchase. The first completed sale strengthens Poland's arms export programme, while Western banks scrutinise the trade."
 COLDWAR_POL_army_ai5b: "Arms for Friends: India and Syria"
 COLDWAR_POL_army_ai5b_desc: "Warsaw offers India and Syria preferential terms for tanks and infantry weapons. Each government must approve its purchase. The first completed sale supports Poland's armed forces and defence industry."
 COLDWAR_POL_army_ai6: "CENZIN: The Arms Export Office"
 COLDWAR_POL_army_ai6_desc: "One state trading company will sell guns for the whole defence industry. It bargains hard and keeps its books to itself."
 COLDWAR_POL_army_as1: "Air Forces Modernisation"
 COLDWAR_POL_army_as1_desc: "Fighter regiments need new engines, new radars and pilots with more hours in the air."
 COLDWAR_POL_army_as2a: "Soviet MiG-21 Deliveries"
 COLDWAR_POL_army_as2a_desc: "Interceptors come straight from the Soviet factories, with Soviet instructors. They are cheap and fast, and they are not ours."
 COLDWAR_POL_army_as2a_tb: "Soviet MiG-21 Deliveries"
 COLDWAR_POL_army_as2b: "Lim Fighters at Mielec"
 COLDWAR_POL_army_as2b_desc: "Mielec builds the Lim jets under Soviet licence and the Iskra trainer of its own design. A Polish aircraft industry is a point of pride and a line in the budget."
 COLDWAR_POL_army_as2b_tb: "Lim Fighters at Mielec"
 COLDWAR_POL_army_as3: "The Polish Navy"
 COLDWAR_POL_army_as3_desc: "Destroyers, submarines and minesweepers at Gdynia and Swinoujscie make Poland the Pact's only Baltic navy besides the Soviets and the East Germans."
 COLDWAR_POL_army_as3_dr: "The Polish Navy"
 COLDWAR_POL_army_as4: "Missile Boats and Landing Ships"
 COLDWAR_POL_army_as4_desc: "Gdansk yards build the Polnocny class for the whole Pact, and the Navy receives Osa missile boats from the Soviet Union. Moscow watches who guards the sea lanes."
 COLDWAR_POL_army_as5: "The Coastal Air Defence Belt"
 COLDWAR_POL_army_as5_desc: "Radar stations and SAM batteries line the coast, tied to the Pact's integrated air defence. The stations are Soviet and so are the keys."
 COLDWAR_POL_army_as5_tb: "The Coastal Air Defence Belt"
 COLDWAR_POL_army_e: "The Polish People's Army"
 COLDWAR_POL_army_e_desc: "Fourteen divisions are pledged to the Pact, and the Defence Minister prefers Moscow's trust to Warsaw's favour."
 COLDWAR_POL_army_e_tb: "The Polish People's Army"
 COLDWAR_POL_army_gf1: "Warsaw Pact Commitments"
 COLDWAR_POL_army_gf1_desc: "Poland's armies are written into Soviet plans down to the battalion. Obedience buys a quiet frontier and a share of the equipment."
 COLDWAR_POL_army_gf2a: "Coastal Front for the Pact"
 COLDWAR_POL_army_gf2a_desc: "In Soviet plans Poland would become the Coastal Front, a sea-to-sea army to strike at Denmark and the Baltic straits. The staff gets Soviet manuals and a very large bill."
 COLDWAR_POL_army_gf2a_tb: "Coastal Front for the Pact"
 COLDWAR_POL_army_gf2b: "Territorial Defence of the Homeland"
 COLDWAR_POL_army_gf2b_desc: "Poland's own General Staff would plan a defence on the Oder and the Neisse, with local militia and reserves. Moscow will ask whose side the Poles are on."
 COLDWAR_POL_army_gf3: "6th Pomeranian Airborne Division"
 COLDWAR_POL_army_gf3_desc: "The Army's red-beret division trains to jump behind the lines. Its barracks are in Krakow, and its colonels have friends in Moscow."
 COLDWAR_POL_army_gf4: "7th Lusatian Naval Landing Division"
 COLDWAR_POL_army_gf4_desc: "A division of marines to land in Denmark when the Front moves west. Polish-built Polnocny landing ships will carry it."
 COLDWAR_POL_army_gf4_tb: "7th Lusatian Naval Landing Division"
 COLDWAR_POL_army_gf5: "The Border Protection Troops"
 COLDWAR_POL_army_gf5_desc: "WOP guards the green border and the Baltic shore. Its watchtowers keep smugglers, spies and fugitives out of the Pact's front line."
 COLDWAR_POL_army_modifier: "Armed Forces"
 COLDWAR_POL_army_modifier_desc: "The lasting reforms of the Polish People's Army, built focus by focus."
 COLDWAR_POL_benesz: "Andrzej Benesz"
 COLDWAR_POL_bonn_package: "The Bonn Package"
 COLDWAR_POL_bonn_package_desc: "Bonn pays hard currency for the right of German families to be reunited: a lump sum, a credit and a number of exit permits agreed in a protocol. For Warsaw the money is welcome, and for Silesia the cost is people.\n\n§gAgreement with West Germany: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_bonn_package_partner: "The Bonn Package"
 COLDWAR_POL_bonn_package_partner_desc: "The Chancellor agrees a package with Warsaw: money and credit in exchange for letting ethnic Germans leave. The Federal Republic buys the right of families to be together, and Bonn pays in marks.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_bop: "The Party and the Church"
 COLDWAR_POL_bop_atheist_state: "The Atheist State"
 COLDWAR_POL_bop_catholic_nation: "A Catholic Nation"
 COLDWAR_POL_bop_church: "The Church"
 COLDWAR_POL_bop_church_mediates: "The Church Mediates"
 COLDWAR_POL_bop_coexistence: "Coexistence"
 COLDWAR_POL_bop_desc: "The Party governs the state, but the Church holds the nation's heart. Every concession to one is weighed by the other, and both are watched from Moscow."
 COLDWAR_POL_bop_party: "The Party"
 COLDWAR_POL_bop_party_leads: "The Party Leads"
 COLDWAR_POL_border_controls: "Invitations at the Polish Border"
 COLDWAR_POL_border_controls_desc: "Poles may cross only with a written invitation. The border posts on the Oder and the Neisse turn back the shoppers and the casual visitors, trade suffers, and the Polish disease stays on the far bank."
 COLDWAR_POL_border_protest: "Protest against the border controls"
 COLDWAR_POL_brezhnev_doctrine_1: "The Brezhnev Doctrine: Trusted Ally"
 COLDWAR_POL_brezhnev_doctrine_1_desc: "Polish regiments crossed the Czechoslovak border in August 1968 beside the Red Army, and the Kremlin remembers who stood on its side. The Soviet ambassador is welcome at every reception, and Polish generals are the first to receive Moscow's confidences.\n\n§gLoyal focuses and Soviet offers keep Moscow content; reforms, Western ties and the Church move it toward suspicion.§!"
 COLDWAR_POL_brezhnev_doctrine_2: "The Brezhnev Doctrine: Reliable Partner"
 COLDWAR_POL_brezhnev_doctrine_2_desc: "Moscow still counts on Warsaw, but now reads its press more closely. Pravda praises the firmness of the Polish comrades and quietly asks a few questions about the Church. Trust, the Kremlin likes to say, is good, and checking it is better.\n\n§gLoyal focuses and Soviet offers ease it; reforms, Western ties and the Church deepen it.§!"
 COLDWAR_POL_brezhnev_doctrine_3: "The Brezhnev Doctrine: Fraternal Vigilance"
 COLDWAR_POL_brezhnev_doctrine_3_desc: "The Soviet embassy's reports from Warsaw grow longer. Emissaries of the Central Committee come to see for themselves, smiling as they ask about wages and the mood in the shipyards. In the Kremlin, Poland is watched, though not yet doubted.\n\n§gLoyal focuses and Soviet offers ease it; reforms, Western ties and the Church deepen it.§!"
 COLDWAR_POL_brezhnev_doctrine_4: "The Brezhnev Doctrine: Fraternal Concern"
 COLDWAR_POL_brezhnev_doctrine_4_desc: "Brezhnev's telephone calls to the Polish First Secretary turn from jokes to lectures. Pravda speaks of anti-socialist forces, and Soviet advisers appear at every staff meeting of the Polish army. In Moscow the word 'concern' is heard more and more often.\n\n§gLoyal focuses and Soviet offers ease it; reforms, Western ties and the Church deepen it.§!"
 COLDWAR_POL_brezhnev_doctrine_5: "The Brezhnev Doctrine: The Warsaw Letter"
 COLDWAR_POL_brezhnev_doctrine_5_desc: "A sharp letter from the Soviet Central Committee reaches the Polish leadership, warning that the gains of socialism are in danger and that the fraternal parties cannot stay indifferent. Warsaw reads it once in the Politburo and again behind closed doors.\n\n§gLoyal focuses and Soviet offers ease it; any further reform or Western tie deepens it.§!"
 COLDWAR_POL_brezhnev_doctrine_6: "The Brezhnev Doctrine: Manoeuvres on the Border"
 COLDWAR_POL_brezhnev_doctrine_6_desc: "Soviet divisions exercise along the Polish frontier, tanks idling in the fields of Belarus while staff trains wait in the sidings. The Polish generals are told it is only an exercise. Nobody in Warsaw sleeps easily.\n\n§gOnly loyal focuses and Soviet offers can bring it down; at this stage Moscow may decide to intervene.§!"
 COLDWAR_POL_broad_confederation: "The Confederation of Groups"
 COLDWAR_POL_broad_confederation_desc: "Keep the tent wide: Pilsudskites, conservatives, workers and students under one name and one signature, each with its own paper and its own quarrels. The Security Service infiltrates what it cannot count, and counts what it cannot infiltrate.\n\n§gLapses while the Confederation is out of power and returns when it governs again.§!"
 COLDWAR_POL_bucharest_oil: "Oil at the Bucharest Formula"
 COLDWAR_POL_bucharest_oil_desc: "Soviet crude flows to the refinery at Plock through the Friendship pipeline, priced by a five-year average that lags behind the market. Polish refineries run well, and the roubles that pay for them pile up into a debt of another kind.\n\n§gAgreement with the Soviet Union: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_bucharest_oil_partner: "Oil at the Bucharest Formula"
 COLDWAR_POL_bucharest_oil_partner_desc: "The Friendship pipeline pumps cheap crude to loyal allies, and in return the Kremlin expects loyalty and a neat ledger of rouble balances. Poland takes a large share, and the oilmen of Tyumen send it with pride.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_casaroli_commission: "Casaroli's Working Group"
 COLDWAR_POL_casaroli_commission_desc: "Monsignor Casaroli comes from Rome with his briefcase and his patience. A standing working group trades church space for civil peace, a parish here and a seminary there, and nobody calls it a victory.\n\n§gAgreement with the Holy See: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_casaroli_commission_partner: "Casaroli's Working Group"
 COLDWAR_POL_casaroli_commission_partner_desc: "Monsignor Casaroli's missions to Warsaw bear fruit in a standing working group. The Vatican accepts that small gains are better than none, and each concession is written down in careful Italian.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_catholic_round_table: "The Round Table"
 COLDWAR_POL_catholic_round_table_desc: "Catholic experts sit between the Party and the opposition at a literal round table and write the compromise nobody dares to sign alone. The ashtrays fill, the tea goes cold and the night is long.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_ccc_grain: "CCC Grain Credits"
 COLDWAR_POL_ccc_grain_desc: "American grain arrives on credit from the Commodity Credit Corporation, and Polish herds get feed. Freighters from the Gulf ports unload at Gdansk, and the pig farms of Greater Poland are fed.\n\n§gAgreement with the United States: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_ccc_grain_partner: "CCC Grain Credits"
 COLDWAR_POL_ccc_grain_partner_desc: "Farmers in Iowa and Kansas sell grain to Poland on Commodity Credit Corporation terms, and the elevators at the Gulf ports are busy. A hungry ally is a loyal customer, the Department of Agriculture reasons.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_china_protocol: "The Beijing Trade Protocol"
 COLDWAR_POL_china_protocol_desc: "Beijing wants Polish ships and machines, and a friend inside Moscow's bloc. A trade protocol is signed with little ceremony, and cargo vessels from Szczecin sail for Shanghai with machinery in their holds.\n\n§gAgreement with China: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_china_protocol_partner: "The Beijing Trade Protocol"
 COLDWAR_POL_china_protocol_partner_desc: "Chinese trade officials in blue tunics tour the shipyards of Gdansk and Szczecin and order ships and machines in return for Chinese goods. In Beijing, Poland is valued as a friend within the Soviet camp.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_church_a1: "Prudence Without Pretext"
 COLDWAR_POL_church_a1_desc: "Nothing must give Moscow a pretext. The Primate restrains strikers and priests alike and keeps every sermon on the right side of the line that ends in tanks."
 COLDWAR_POL_church_a1f: "Distance from the Opposition"
 COLDWAR_POL_church_a1f_desc: "Kuron and the lawyers of KOR are welcome as individuals at Mass but not as partners. The Primate will not let secular dissidents decide how far the Church may go."
 COLDWAR_POL_church_a2: "Memoranda on Human Rights"
 COLDWAR_POL_church_a2_desc: "The bishops send the government sober memoranda: rights are not a gift of the Party, and a worker who is beaten and dismissed is a pastoral matter. The Central Committee will read them as a political programme."
 COLDWAR_POL_church_a2f: "Shelter for the Opposition"
 COLDWAR_POL_church_a2f_desc: "A church can host a hunger strike for imprisoned workers, stack the independent press behind its altars and open its lecture halls to the flying university. The Security Service will count every visitor."
 COLDWAR_POL_church_b1: "The Gierek Meeting"
 COLDWAR_POL_church_b1_desc: "The First Secretary offers to receive the Primate in person. A quiet agreement on permits and priests is worth a handshake, though some bishops and some workers will call it a bargain with the Party."
 COLDWAR_POL_church_b1f: "Permits for New Churches"
 COLDWAR_POL_church_b1f_desc: "Congregations have waited ten years for a permit to build a parish church. The new estates of Nowa Huta and Krakow can have theirs if the Church pays for them out of the collection."
 COLDWAR_POL_church_b1f_tb: "Permits for New Churches"
 COLDWAR_POL_church_b2: "Refuse Group D's Bargain"
 COLDWAR_POL_church_b2_desc: "Group D of the Security Service offers favours to priests who cooperate and pressure for those who do not. The Primate forbids contact on those terms; the Church will live on the offering plate and the gifts of the faithful."
 COLDWAR_POL_church_b2f: "Parish Charity and Western Aid"
 COLDWAR_POL_church_b2f_desc: "Catholic agencies in the West offer flour, clothing and medicines for every parish. The Church would become the largest distributor of free goods in the country, and Moscow will note the foreign convoys."
 COLDWAR_POL_church_c1: "Mass at the Shipyard Gate"
 COLDWAR_POL_church_c1_desc: "Priests can say Mass for the strikers under the shipyard gate and hear confessions on the quay. The Church stands openly on the workers' side, and every Pole will see it."
 COLDWAR_POL_church_c2: "The Church as Mediator"
 COLDWAR_POL_church_c2_desc: "Bishops can sit between the Interior Ministry and the strike committee, carry messages and cool tempers. Both sides will grumble that the Church spoke for the other."
 COLDWAR_POL_church_cap: "The Primate's Social Council"
 COLDWAR_POL_church_cap_desc: "Lay experts, economists and jurists will meet in the Primate's residence to write what the government will not: a programme for the nation under Catholic social teaching. Ministers will read it before they answer."
 COLDWAR_POL_church_cm: "Rural Solidarity Backed"
 COLDWAR_POL_church_cm_desc: "The farmers ask for a union of their own and the village priests stand with them against the procurement officers. The Primate considers saying publicly that they are right."
 COLDWAR_POL_church_d1: "Nine Days in June"
 COLDWAR_POL_church_d1_desc: "The Primate wants a pope to kneel at Czestochowa and speak in Victory Square before a million Poles. The Church needs no party if the nation knows when to stand."
 COLDWAR_POL_church_d2: "A Quiet Pilgrimage"
 COLDWAR_POL_church_d2_desc: "If a pope comes, the Church will keep the sermons within the liturgy and agree the route with the Ministry. No banners, no politics, and a nation moved but not mobilised."
 COLDWAR_POL_church_dm: "The Family Farm"
 COLDWAR_POL_church_dm_desc: "The Church teaches that land belongs to the family that works it. Priests bless the harvest, defend the private farm against the collective and ask for fair prices for the pig and the calf."
 COLDWAR_POL_church_e: "The Primate of the Millennium"
 COLDWAR_POL_church_e_desc: "Cardinal Wyszynski outlasted Bierut and is outlasting Gomulka. The Episcopate does not seek office; it offers the nation the one institution the Party cannot dissolve."
 COLDWAR_POL_church_eco: "Rerum Novarum in Practice"
 COLDWAR_POL_church_eco_desc: "Parish kitchens, clothing drives and clinics in church halls do what the shops and the state cannot. The Church calls it Christian charity; the Security Service files it as an organised network."
 COLDWAR_POL_church_em: "Laborem Exercens"
 COLDWAR_POL_church_em_desc: "The Church prepares a teaching on human work: labour comes before capital and workers may organise freely. The Party economists will find it hard to answer."
 COLDWAR_POL_church_em_tb: "Laborem Exercens"
 COLDWAR_POL_church_mediation: "The Church as Ally"
 COLDWAR_POL_church_mediation_desc: "A holy picture hangs on the shipyard gate, and a priest says Mass in the yard for the strikers. The bishops, who fear bloodshed above all, offer to carry messages between the table and the Party.\n\n§gLapses while KOR and Solidarity are out of power and returns when they govern again.§!"
 COLDWAR_POL_church_pm: "The Sermon of Calm"
 COLDWAR_POL_church_pm_desc: "When the shipyards stop and the Soviet army watches the frontier, the Primate will ask for calm, for work and for the independent unions the strikers demand. He is the one man both sides still listen to."
 COLDWAR_POL_church_pol: "Letter on Freedom of Conscience"
 COLDWAR_POL_church_pol_desc: "The bishops write to every parish about the right to believe, to teach the catechism and to bury the dead with a cross. The new government is told the Church is ready to talk, but not to kneel."
 COLDWAR_POL_church_state_commission: "The Church-State Commission"
 COLDWAR_POL_church_state_commission_desc: "Bishops and ministers meet at a long table to settle disputes about priests, pilgrimages and parish buildings. The Primate's secretary carries the minutes. The Church is no longer a petitioner, and the Party must hear what it says.\n\n§gLapses while the Army is out of power and returns when it governs again.§!"
 COLDWAR_POL_church_x1: "Glemp's Accommodation"
 COLDWAR_POL_church_x1_desc: "Archbishop Glemp takes the Primate's staff with orders to keep the churches open and the priests out of prison. He sits down with the generals, and the underground wonders whose side the bishops are on."
 COLDWAR_POL_church_x2: "Masses for the Homeland"
 COLDWAR_POL_church_x2_desc: "The pastoral line hardens. A young priest's monthly Mass for the homeland fills a Warsaw church and spills into the street, and the Security Service watches the preacher more closely than the Primate."
 COLDWAR_POL_ciolkosz: "Adam Ciolkosz"
 COLDWAR_POL_citizens_committees: "The Citizens' Committees"
 COLDWAR_POL_citizens_committees_desc: "Strikes end in agreements that the Party breaks, so the shipyard hires lawyers. Experts, priests and journalists gather round Walesa in committees that can name candidates, talk to foreign governments and staff the offices the Party cannot.\n\n§gLapses while KOR and Solidarity are out of power and returns when they govern again.§!"
 COLDWAR_POL_civil_society: "Ten Million Members"
 COLDWAR_POL_civil_society_desc: "One worker in three carries the same union card, and the nation has learned to organise without the Party. The shops are still empty, but nobody now doubts that Poland is a society, and Moscow does not doubt it either.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_coal_for_credit: "Credit for Coal, No Emigrants"
 COLDWAR_POL_coal_for_credit_desc: "Warsaw offers coal instead of exit permits, and Bonn agrees to credit against deliveries. The wagons leave Silesia full, and the families who hoped to leave watch the trains from their windows.\n\n§gAgreement with West Germany: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_coal_for_credit_partner: "Credit for Coal, No Emigrants"
 COLDWAR_POL_coal_for_credit_partner_desc: "Bonn lends against Silesian coal and does not get the emigrants it wanted. Coal buyers in the Ruhr note the deliveries, the foreign ministry notes the refusal, and the families of Silesia go on waiting for the exit permits that did not come.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_coal_for_currency: "Coal for Hard Currency"
 COLDWAR_POL_coal_for_currency_desc: "Train after train of Silesian coal rolls to the Baltic ports, and out of the ports to Hamburg and Rotterdam for dollars and marks. The bankers are paid on time. The miners work their Sundays, and the doctors of Katowice count the lungs."
 COLDWAR_POL_coal_for_machines: "Silesian Coal for Berlin Machines"
 COLDWAR_POL_coal_for_machines_desc: "Polish black coal rolls west to the furnaces and power stations of the German Democratic Republic. Precision machine tools from Dresden and Karl-Marx-Stadt return on the same wagons, and the engineers of Silesia admire their neat workmanship.\n\n§gAgreement with East Germany: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_coal_for_machines_partner: "Silesian Coal for Berlin Machines"
 COLDWAR_POL_coal_for_machines_partner_desc: "East Germany needs black coal for its power stations and offers lathes, presses and Robotron computers in exchange. The railway sidings at Frankfurt on the Oder fill with wagons going both ways.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_comecon_specialisation: "Comecon Specialisation"
 COLDWAR_POL_comecon_specialisation_desc: "Poland builds ships, mining machinery and railway wagons for the whole socialist bloc and receives oil, ore and gas in return. Planners at the Comecon secretariat in Moscow draw the division of labour, and Polish factories fill orders years ahead.\n\n§gPoland's economic model: adopting another model replaces it.§!"
 COLDWAR_POL_continuity_in_exile: "Keep the Continuity"
 COLDWAR_POL_continuity_in_exile_desc: "Whoever sits in Warsaw, the London seals stay with their lawful holder until the state is free and whole. The exile purse pays for the principle, and the chancery clerks keep the books in pounds.\n\n§gLapses while neither the Government-in-Exile nor Kultura governs, and returns when one of them does.§!"
 COLDWAR_POL_control_commission: "The Party Control Commission"
 COLDWAR_POL_control_commission_desc: "A commission of grey-haired comrades audits every committee from county to ministry. A misspent million, a wedding paid from the cadres' fund and a mistress on the payroll are all found out in due time. The secretaries do not love their visitors.\n\n§gLapses while the Central Committee is out of power and returns when it governs again.§!"
 COLDWAR_POL_country_e: "The Countryside Programme"
 COLDWAR_POL_country_e_desc: "Three million private farmers feed Poland and trust nobody in Warsaw. The new leadership can offer them a deal: fewer orders, more tractors, a say in prices."
 COLDWAR_POL_country_e_tb: "The Countryside Programme"
 COLDWAR_POL_country_fd1: "Feed Grain from America"
 COLDWAR_POL_country_fd1_desc: "Pigs need grain, and Polish grain is thin. American credit would buy corn and soya, and the meat would reach the shops, at a price paid in dollars."
 COLDWAR_POL_country_fd2: "Fodder Plants and Silos"
 COLDWAR_POL_country_fd2_desc: "Compound feed mills in Kuyavia turn imported maize into balanced rations. The pigs will eat better than their owners."
 COLDWAR_POL_country_fd3a: "Large Pig Complexes"
 COLDWAR_POL_country_fd3a_desc: "State pig factories of ten thousand animals rise beside the villages. Meat comes in tonnes; the small farmer loses his contract."
 COLDWAR_POL_country_fd3b: "Land Reclamation and Drainage"
 COLDWAR_POL_country_fd3b_desc: "Drain the marshes of Masuria and the Zulawy delta, lay field tiles and clear stones. The land will be better, for everyone, but slowly."
 COLDWAR_POL_country_fd3b_tb: "Land Reclamation and Drainage"
 COLDWAR_POL_country_fd4: "Fodder Self-Sufficiency Plan"
 COLDWAR_POL_country_fd4_desc: "Feed imports should shrink year by year as home-grown protein grows. The plan promises independence from the dollar and from the American grain trade."
 COLDWAR_POL_country_fd5: "Meat Export Contracts"
 COLDWAR_POL_country_fd5_desc: "Hams to West Germany, Britain and Italy earn dollars. The meat comes from the same pigs that the shops lack."
 COLDWAR_POL_country_fm1: "Compulsory Deliveries Abolished"
 COLDWAR_POL_country_fm1_desc: "The state stops taking grain and pigs at fixed prices. Farmers deliver by contract and are paid better, and the Treasury pays the difference."
 COLDWAR_POL_country_fm2a: "State Farms Expanded"
 COLDWAR_POL_country_fm2a_desc: "The big state farms (PGR) of the western lands get more land, machines and credit. Private farmers watch the best fields go to the state."
 COLDWAR_POL_country_fm2b: "Contract Farming with Peasants"
 COLDWAR_POL_country_fm2b_desc: "Let the state buy from the private farmer under a written contract, with seed and fertiliser on credit. The Party secretary loses his say in the village."
 COLDWAR_POL_country_fm3: "Farmer Pensions 1977"
 COLDWAR_POL_country_fm3_desc: "A farmer who hands his land to the state or his son may retire on a pension, as a worker does. It is the first time the village is offered social security."
 COLDWAR_POL_country_fm4: "The Agricultural Circles"
 COLDWAR_POL_country_fm4_desc: "A cooperative of village farmers shares a tractor, a combine and a mechanic. The Party likes its meetings; the farmers like its machines."
 COLDWAR_POL_country_fm4_tb: "The Agricultural Circles"
 COLDWAR_POL_czech_machines: "Czechoslovak Machine Tools and Trams"
 COLDWAR_POL_czech_machines_desc: "Prague sells the machine tools its engineers have long perfected, together with Tatra lorries and Skoda goods. In return the Czechoslovak furnaces burn Polish coal, and the trams of Warsaw rattle along on Czech wheels.\n\n§gAgreement with Czechoslovakia: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_czech_machines_partner: "Czechoslovak Machine Tools and Trams"
 COLDWAR_POL_czech_machines_partner_desc: "Czechoslovak plants at Brno and Plzen turn out machine tools and trams for the Polish market, and the wagons come back from Silesia loaded with coal. The planners in Prague tick off the quota with relief.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_ddr_border_invitations: "Require Invitations at the Border"
 COLDWAR_POL_ddr_border_invitations_desc: "East Berlin fears that strikes and free unions will cross the Oder with the Polish shoppers. A written invitation at the border keeps both out."
 COLDWAR_POL_ddr_cond_tt: "Poland's Social Discontent stands at 60 or more, or the workers' movement governs"
 COLDWAR_POL_debt50_tt: "Poland's Western Debt stands at 50 or more"
 COLDWAR_POL_debt75_tt: "Poland's Western Debt stands at 75 or more"
 COLDWAR_POL_debt_band_1: "Serviced Debt"
 COLDWAR_POL_debt_band_1_desc: "The banks of Frankfurt and Paris extend their loans, and the interest is paid without fuss. Rows of new Western machines stand in Polish halls, and nobody has yet asked how they will be paid for.\n\n§gWestern credit and licences push the debt up; debt service, coal and copper exports and rescheduling bring it down.§!"
 COLDWAR_POL_debt_band_2: "The Debt Trap"
 COLDWAR_POL_debt_band_2_desc: "Interest now eats a large part of the coal the miners dig and the ships the yards build. The finance minister reads the foreign exchange figures before anything else, and every new credit goes to pay for the last one.\n\n§gUnpaid interest keeps adding to the debt at this level; servicing it, exporting coal and copper and rescheduling bring it down.§!"
 COLDWAR_POL_debt_band_3: "Rescheduling"
 COLDWAR_POL_debt_band_3_desc: "The creditors' delegates sit in the Ministry of Finance, and the planners cut orders from the West to pay the interest. Shops stand bare while the convoys go west. Rescheduling is the word spoken quietly in corridors.\n\n§gInterest feeds on itself here, so servicing the debt, exporting for hard currency and rescheduling are the ways down.§!"
 COLDWAR_POL_debt_m10_tt: "Western Debt: §G-10§!"
 COLDWAR_POL_debt_m12_tt: "Western Debt: §G-12§!"
 COLDWAR_POL_debt_m3_tt: "Western Debt: §G-3§!"
 COLDWAR_POL_debt_m5_tt: "Western Debt: §G-5§!"
 COLDWAR_POL_debt_m8_tt: "Western Debt: §G-8§!"
 COLDWAR_POL_debt_modifier: "Western Debt: [?COLDWAR_POL_debt|0] of 100"
 COLDWAR_POL_debt_modifier_desc: "Every Western credit builds a factory today and a repayment tomorrow. The banks lend gladly while the plan grows, and less gladly once the interest outruns the exports. Bands at 25, 50 and 75; see the decision category Warsaw and the Nation."
 COLDWAR_POL_debt_p10_tt: "Western Debt: §R+10§!"
 COLDWAR_POL_debt_p3_tt: "Western Debt: §R+3§!"
 COLDWAR_POL_debt_p4_tt: "Western Debt: §R+4§!"
 COLDWAR_POL_debt_p5_tt: "Western Debt: §R+5§!"
 COLDWAR_POL_debt_p6_tt: "Western Debt: §R+6§!"
 COLDWAR_POL_debt_p8_tt: "Western Debt: §R+8§!"
 COLDWAR_POL_decade_of_success: "The Decade of Success"
 COLDWAR_POL_decade_of_success_desc: "Poland has new motorways, a rebuilt Royal Castle, a small car in many families and a football team that came third in the world. Foreign visitors are shown the new Warsaw Central Station and the bill has not yet arrived.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_declared_independence: "The Declaration of Independence"
 COLDWAR_POL_declared_independence_desc: "No more petitions. The Confederation says plainly that the People's Republic is Russian rule and that only the end of the Party's monopoly can free Poland. The Security Service will quote the declaration at trials.\n\n§gLapses while the Confederation is out of power and returns when it governs again.§!"
 COLDWAR_POL_deferral_tt: "Western Debt: §G-10§! for one year; the deferred payments return after 365 days (§R+10§!)."
 COLDWAR_POL_diplomatic_relations: "Diplomatic Relations Restored"
 COLDWAR_POL_diplomatic_relations_desc: "Rome and Warsaw exchange nuncio and ambassador after long decades of silence. The papal flag rises over the nunciature in Warsaw, the bells of the parishes ring, and the Polish ambassador presents his credentials in the Vatican to a smiling Secretary of State.\n\n§gAgreement with the Holy See: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_diplomatic_relations_partner: "Diplomatic Relations Restored"
 COLDWAR_POL_diplomatic_relations_partner_desc: "The Vatican and Warsaw restore diplomatic relations, and the Pope's nuncio arrives in Poland after long years. The Secretary of State signs, and the Polish ambassador presents his credentials in the Apostolic Palace.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_dir_church: "The Church and the Nation"
 COLDWAR_POL_dir_church_a: "The Primate's Prudence"
 COLDWAR_POL_dir_church_a_desc: "The Primate restrains the faithful as firmly as he defies the Party. Nothing must give Moscow a reason to send tanks."
 COLDWAR_POL_dir_church_b: "Catholic Deputies in the Sejm"
 COLDWAR_POL_dir_church_b_desc: "A handful of Catholic deputies speak in the Sejm with the bishops' blessing. They are tolerated, watched and listened to."
 COLDWAR_POL_dir_church_desc: "The Primate of the Millennium fills the squares when the Party fills only the halls. Catholic deputies, the PAX movement and the bishops each offer the state a different bargain."
 COLDWAR_POL_dir_church_m: "A Nation at Prayer"
 COLDWAR_POL_dir_church_m_desc: "Processions, pilgrimages and full churches remind the Party that the nation gathers somewhere else on Sundays."
 COLDWAR_POL_dir_nation: "Independence and the Emigration"
 COLDWAR_POL_dir_nation_a: "The London Seals"
 COLDWAR_POL_dir_nation_a_desc: "The exiled President still keeps the seals of 1939. Recognising them tells Poles that the People's Republic is a passing regime, not the state itself."
 COLDWAR_POL_dir_nation_b: "Appeal to the Covenants"
 COLDWAR_POL_dir_nation_b_desc: "Warsaw has signed the United Nations covenants on human rights. Its own signature can be used against it, one complaint at a time."
 COLDWAR_POL_dir_nation_desc: "In London a President-in-Exile still keeps the seals of the Second Republic, and young patriots in Warsaw read Pilsudski in secret. To them the People's Republic is an occupation with Polish faces."
 COLDWAR_POL_dir_nation_m: "A Free Poland in Waiting"
 COLDWAR_POL_dir_nation_m_desc: "Patriots prepare a programme and a following for the day the Soviet garrison leaves. Moscow notices every new underground leaflet."
 COLDWAR_POL_dir_party: "The Party Decides"
 COLDWAR_POL_dir_party_a: "Close Ranks in the Politburo"
 COLDWAR_POL_dir_party_a_desc: "After the shooting on the coast, the leadership's first instinct is discipline: one line, one voice, no leaks to Moscow or the street. The streets will hear the new discipline before they see any meat."
 COLDWAR_POL_dir_party_b: "Consult the Factories"
 COLDWAR_POL_dir_party_b_desc: "Send the secretaries into the halls and let the workers speak. The apparatus hates it; the shipyards remember it."
 COLDWAR_POL_dir_party_desc: "The Party is not one Party. Gomulka's old guard, Moczar's Partisans, Gierek's Silesians and the generals each claim to know how to keep Poland socialist and the Russians outside the gates."
 COLDWAR_POL_dir_party_m: "The Leading Role of the Party"
 COLDWAR_POL_dir_party_m_desc: "Whoever leads the Party leads Poland. The new leadership means to make that the rule of the next decade, in law as in practice."
 COLDWAR_POL_dir_workers: "The Workers Speak"
 COLDWAR_POL_dir_workers_a: "Aid for the Persecuted"
 COLDWAR_POL_dir_workers_a_desc: "Lawyers, doctors and writers collect money and testimony for the dismissed and the beaten. The Security Service writes down every name."
 COLDWAR_POL_dir_workers_b: "Committees in the Shipyards"
 COLDWAR_POL_dir_workers_b_desc: "Workers on the coast keep the strike committees of December alive in secret, with delegates, demands and a printing press. Every meeting costs a shift."
 COLDWAR_POL_dir_workers_desc: "The shipyards and the universities have both learned that the workers' state fears its workers. Students, intellectuals and strike committees could learn to speak with one voice."
 COLDWAR_POL_dir_workers_m: "A Programme of Demands"
 COLDWAR_POL_dir_workers_m_desc: "One list of demands, from free trade unions to meat in the shops, could turn local strikes into a national programme."
 COLDWAR_POL_direction_tt: "The other political directions are closed until the next change of government."
 COLDWAR_POL_eastern_solidarity: "A Message to Eastern Europe"
 COLDWAR_POL_eastern_solidarity_desc: "The congress sends a message to the working people of Prague, Budapest, Sofia and the Soviet republics: you too can have a free union. For Moscow this is no longer a trade-union matter.\n\n§gLapses while KOR and Solidarity are out of power and returns when they govern again.§!"
 COLDWAR_POL_economy_co1: "Housing Cooperatives"
 COLDWAR_POL_economy_co1_desc: "Families pay a deposit and join a cooperative. The wait will be long and the estates grey, but young couples will finally have a door of their own."
 COLDWAR_POL_economy_co2: "The Panel Factories"
 COLDWAR_POL_economy_co2_desc: "Concrete slabs come off a production line and rise as eleven-storey blocks. Quick to build, cold in winter, and the damp comes with the keys."
 COLDWAR_POL_economy_co2_tb: "The Panel Factories"
 COLDWAR_POL_economy_co3a: "Members Pay Their Share"
 COLDWAR_POL_economy_co3a_desc: "Raise the members' contributions to what a flat really costs. Savers with a zloty hoard get a roof, and those without wait longer."
 COLDWAR_POL_economy_co3b: "Flats by the Workplace"
 COLDWAR_POL_economy_co3b_desc: "Factories and ministries allocate flats to their own staff. Directors win loyalty and the Treasury pays; the Party secretaries keep the best apartments."
 COLDWAR_POL_economy_co4: "Repair and Service Cooperatives"
 COLDWAR_POL_economy_co4_desc: "Plumbers, tailors and repairmen may work in their own cooperatives. The private craftsman survives under a cooperative signboard."
 COLDWAR_POL_economy_co5: "Free Saturdays"
 COLDWAR_POL_economy_co5_desc: "Two Saturdays a month will be free, then three, then every one. The workers will be happy and the plan will have to be met in five days."
 COLDWAR_POL_economy_cr1: "Western Credit Lines"
 COLDWAR_POL_economy_cr1_desc: "Western banks are flush with money and keen to lend to a planned economy that never defaults. Borrow now, repay from the exports of the new factories."
 COLDWAR_POL_economy_cr2a: "Government Rescheduling Talks"
 COLDWAR_POL_economy_cr2a_desc: "Ask the creditor governments to stretch the repayments. They will agree, with conditions and inspectors attached."
 COLDWAR_POL_economy_cr2b: "Syndicated Bank Loans"
 COLDWAR_POL_economy_cr2b_desc: "A club of Western banks will lend a billion on commercial terms and no conditions. Poland can build roads and rails faster now and pay a floating rate later."
 COLDWAR_POL_economy_cr2b_tb: "Syndicated Bank Loans"
 COLDWAR_POL_economy_cr3: "The Foreign Trade Bank"
 COLDWAR_POL_economy_cr3_desc: "One bank for hard-currency accounts, letters of credit and interest bills. The plan has to know what it owes before it spends more."
 COLDWAR_POL_economy_cr4: "Coal and Copper for the Banks"
 COLDWAR_POL_economy_cr4_desc: "The creditors want repayment in goods the West will buy. Silesian coal and Lower Silesian copper leave on the trains; the shops see less of both."
 COLDWAR_POL_economy_cr5: "The Debt Service Calendar"
 COLDWAR_POL_economy_cr5_desc: "Put every instalment on a calendar and every instalment on the Politburo table. The bankers will sleep better, the planners will not."
 COLDWAR_POL_economy_e: "The 1971-1975 Plan"
 COLDWAR_POL_economy_e_desc: "The planners want a five-year plan with 38 per cent more national income and a third more investment. The ministries put machines first and the shops second."
 COLDWAR_POL_economy_e_tb: "The 1971-1975 Plan"
 COLDWAR_POL_economy_modifier: "National Economy"
 COLDWAR_POL_economy_modifier_desc: "The lasting changes to the national economy, built focus by focus."
 COLDWAR_POL_economy_pr1: "The Price Question"
 COLDWAR_POL_economy_pr1_desc: "Everyone in the Politburo knows the prices lie, and everyone remembers Christmas 1970. A commission is set up to say what the shops should charge, quietly."
 COLDWAR_POL_economy_pr2a: "Commercial Meat Prices"
 COLDWAR_POL_economy_pr2a_desc: "Sell the better cuts at the price they cost and leave the cheap cuts to the queue. The state saves a fortune; the shipyards will hear of it."
 COLDWAR_POL_economy_pr2b: "Hold the Price Line"
 COLDWAR_POL_economy_pr2b_desc: "Subsidies carry meat, bread and coal at the old prices. The workers keep faith with the Party and the streets stay quiet, and the budget loses billions a year."
 COLDWAR_POL_economy_pr3: "Commercial Shops"
 COLDWAR_POL_economy_pr3_desc: "Open shops where goods cost what the market will bear. Those with money are served; those without queue at the state shop next door."
 COLDWAR_POL_economy_pr4: "Pewex Hard-Currency Shops"
 COLDWAR_POL_economy_pr4_desc: "Dollar shops will sell Western goods to Poles who have relatives abroad. They draw the dollars out of the mattresses, and teach everyone what the zloty is worth."
 COLDWAR_POL_economy_pr5: "Sugar Coupons and Ration Cards"
 COLDWAR_POL_economy_pr5_desc: "If the shelves cannot be filled, share what is on them. Coupons are boring, honest and fair, and Poles will queue for them without rioting."
 COLDWAR_POL_emergency_courts: "Summary Courts and Internment"
 COLDWAR_POL_emergency_courts_desc: "Military prosecutors sit in requisitioned school halls, ready to try strike leaders within days. In barracks at the edge of town, rows of cots are laid out for men who held union cards. Justice has been made fast, and memory will be slower.\n\n§gLapses while the Army is out of power and returns when it governs again.§!"
 COLDWAR_POL_emigre_unity: "The Reunited Government"
 COLDWAR_POL_emigre_unity_desc: "The aged President cannot go on for ever, and the two councils look for a single successor under one seal. Long years of schism could end around one table in London, if the soldiers' camp yields.\n\n§gLapses while neither the Government-in-Exile nor Kultura governs, and returns when one of them does.§!"
 COLDWAR_POL_endo_communist_state: "The Endo-Communist State"
 COLDWAR_POL_endo_communist_state_desc: "Flags, uniforms and veterans' parades fill the squares, and the radio speaks of the nation's thousand years. The state distrusts Moscow and Washington alike. The universities are quiet, the border guards are alert, and the Kremlin reads every speech twice.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_exile_a1: "The Reunited Government"
 COLDWAR_POL_exile_a1_desc: "The aged President cannot go on for ever, and the two councils look for a single successor under one seal. Eighteen years of schism could end around one table, if the soldiers' camp yields."
 COLDWAR_POL_exile_a2: "The Council of Three Line"
 COLDWAR_POL_exile_a2_desc: "Raczynski and the veterans of Anders's army keep their own council and refuse to treat the President in Eaton Place as the only voice of the Republic. The soldiers have not forgiven 1954."
 COLDWAR_POL_exile_b1: "The Kultura Doctrine"
 COLDWAR_POL_exile_b1_desc: "Accept the eastern frontier and extend a hand to Ukrainians, Lithuanians and Belarusians. A Poland that fears no neighbour cannot be accused of wanting their land, though the old officers call it surrender."
 COLDWAR_POL_exile_b1_tb: "The Kultura Doctrine"
 COLDWAR_POL_exile_b2: "The Borders of 1939"
 COLDWAR_POL_exile_b2_desc: "The Treaty of Riga line is the only lawful frontier, whoever occupies Lwow and Wilno. The exiles do not trade the property of the nation for a favour, and the neighbours take note."
 COLDWAR_POL_exile_cap: "The Free Voice of Poland"
 COLDWAR_POL_exile_cap_desc: "Poland has voices in London, Paris, Munich and Washington that say what the censor forbids, and a press house in Warsaw now prints some of them. The Party and the Security Service resent every page."
 COLDWAR_POL_exile_e: "The Seals of the Republic"
 COLDWAR_POL_exile_e_desc: "The President of the Republic in London still holds the seals handed on from Moscicki in 1939. The seat is a house in Eaton Place and the claim is a whole country."
 COLDWAR_POL_exile_eco: "The Diaspora Purse"
 COLDWAR_POL_exile_eco_desc: "Veterans in Britain, farmers in Canada and engineers in Chicago send what they can: pensions, parcels, printing presses and scholarships."
 COLDWAR_POL_exile_eco_tb: "The Diaspora Purse"
 COLDWAR_POL_exile_em: "Bridges to the Underground"
 COLDWAR_POL_exile_em_desc: "Money, paper and advice go to Warsaw by way of tourists and pilgrims. The Party sees conspirators; the exiles see colleagues."
 COLDWAR_POL_exile_em_tb: "Bridges to the Underground"
 COLDWAR_POL_exile_pm: "Kultura at Maisons-Laffitte"
 COLDWAR_POL_exile_pm_desc: "The monthly with the grey cover is read in Warsaw ministries and smuggled into every university. Its editors turn down every government prize."
 COLDWAR_POL_exile_pol: "Radio Free Europe, Polish Section"
 COLDWAR_POL_exile_pol_desc: "Every evening Poles in their kitchens turn the dial to a Munich voice, and the Security Service jams it with all its power."
 COLDWAR_POL_exile_pol_tb: "Radio Free Europe, Polish Section"
 COLDWAR_POL_exile_x1: "The Insignia Go Home"
 COLDWAR_POL_exile_x1_desc: "The President in exile hands the seals and the assets of the Republic to an elected President in Warsaw. The continuity of the state is honoured at the moment it is no longer needed, and the London party fades away."
 COLDWAR_POL_exile_x2: "Keep the Continuity"
 COLDWAR_POL_exile_x2_desc: "Warsaw's President was chosen under a Round Table constitution, and the London seals remain with their lawful holder until the state is free and whole. The exile purse pays for the principle."
 COLDWAR_POL_exit_batches_tt: "Fewer than five batches of 25,000 have left so far"
 COLDWAR_POL_exit_cost_tt: "If Poland accepts: we pay §R0.012%§! of our GDP once and receive 25,000 resettlers."
 COLDWAR_POL_exit_quota: "The Exit Quota"
 COLDWAR_POL_exit_quota_desc: "Skilled workers from Silesia and Masuria queue at the passport office with the forms for family reunification, and the foremen are among the first to go. The factories find vacancies in the shift lists that they cannot fill."
 COLDWAR_POL_expert_councils: "Councils of Experts"
 COLDWAR_POL_expert_councils_desc: "Economists, engineers and planners now sit beside the ministers, and every paper that reaches the Council of Ministers has passed through their calculators first. The old party secretary signs where he used to decide, and complains about it at lunch.\n\n§gLapses while neither the Silesian Group nor the Red Directors govern, and returns when one of them does.§!"
 COLDWAR_POL_fiat_licence: "Fiat Licence Repaid in Cars"
 COLDWAR_POL_fiat_licence_desc: "Turin sells a factory and takes the cars it builds. At Bielsko-Biala and Tychy the first small Fiats roll off the line, the Polish family dreams of a Sunday drive, and the Italians are repaid in finished cars.\n\n§gAgreement with Italy: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_fiat_licence_partner: "Fiat Licence Repaid in Cars"
 COLDWAR_POL_fiat_licence_partner_desc: "Fiat in Turin sells the plans, the machines and the training for a Polish small-car factory, and takes finished cars as payment. The Agnelli family likes a customer who pays in cars.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_for_blk: "Fraternal Neighbours"
 COLDWAR_POL_for_blk_coal: "Silesian Coal for Berlin Machines"
 COLDWAR_POL_for_blk_coal_desc: "Silesian coal goes west by rail and precision machines come back east."
 COLDWAR_POL_for_blk_cze: "Czechoslovak Machine Tools and Trams"
 COLDWAR_POL_for_blk_cze_desc: "Czechoslovakia's old machine works still sell to the bloc at reasonable prices."
 COLDWAR_POL_for_blk_desc: "East Berlin, Prague and Budapest are on the same road, with the same planners and the same worries."
 COLDWAR_POL_for_blk_gdr: "Visa-Free Travel with the GDR"
 COLDWAR_POL_for_blk_gdr_desc: "Open the border at the Oder to the East Germans, who come to buy sausage and cheap Polish goods."
 COLDWAR_POL_for_blk_hun: "Ikarus Buses and Hungarian Know-How"
 COLDWAR_POL_for_blk_hun_desc: "Hungary's buses and farm cooperatives show what can be done under a softer plan."
 COLDWAR_POL_for_con: "Contracts for Hard Currency"
 COLDWAR_POL_for_con_alg: "Engineers and Doctors for Algeria"
 COLDWAR_POL_for_con_alg_desc: "Algiers hires Polish engineers, teachers and doctors, and pays for them in dollars and oil."
 COLDWAR_POL_for_con_desc: "Oil states pay in dollars for Polish tanks, builders and engineers."
 COLDWAR_POL_for_con_irq: "Polish Contractors in Iraq"
 COLDWAR_POL_for_con_irq_desc: "Polish contractors win roads and housing in Baghdad against dollar payment."
 COLDWAR_POL_for_con_lba: "Arms and Builders for Libya"
 COLDWAR_POL_for_con_lba_desc: "Tripoli buys armour and ammunition for hard currency, no questions asked."
 COLDWAR_POL_for_far: "Friends Beyond the Bloc"
 COLDWAR_POL_for_far_chi: "The Beijing Trade Protocol"
 COLDWAR_POL_for_far_chi_desc: "Beijing buys Polish coal and ships. Moscow reads a long list of Polish trade partners."
 COLDWAR_POL_for_far_cub: "Sugar for Ships and Tractors"
 COLDWAR_POL_for_far_cub_desc: "Cuba needs ships and tractors and pays in sugar, which Poland cannot yet get in its own shops."
 COLDWAR_POL_for_far_desc: "Hanoi, Havana and Beijing look to Warsaw for ships, schools and a voice in the world."
 COLDWAR_POL_for_far_vie: "The ICCS Mission in Vietnam"
 COLDWAR_POL_for_far_vie_desc: "If a ceasefire comes, Polish officers and diplomats could watch it beside Canadians, Hungarians and Indonesians."
 COLDWAR_POL_for_ger: "Ostpolitik with Bonn"
 COLDWAR_POL_for_ger_alt: "Credit for Coal, No Emigrants"
 COLDWAR_POL_for_ger_alt_desc: "Poland keeps its citizens and sells coal for a smaller, dearer loan."
 COLDWAR_POL_for_ger_bank: "The Syndicated Bank Credit"
 COLDWAR_POL_for_ger_bank_desc: "Banks in Frankfurt lend to Warsaw on the strength of its government's guarantee."
 COLDWAR_POL_for_ger_desc: "Willy Brandt's government offers a new start; its banks and its voters watch Warsaw."
 COLDWAR_POL_for_ger_pkg: "The Bonn Package"
 COLDWAR_POL_for_ger_pkg_desc: "Bonn would pay pension claims and a cheap loan if Poland lets its ethnic Germans leave."
 COLDWAR_POL_for_ger_tr: "The Warsaw Treaty"
 COLDWAR_POL_for_ger_tr_desc: "Poland and West Germany could sign the treaty that makes the Oder-Neisse border a fact, with Bonn renouncing force."
 COLDWAR_POL_for_ger_txt: "The Textbook Commission"
 COLDWAR_POL_for_ger_txt_desc: "Historians from both countries sit down to write a history that both can teach."
 COLDWAR_POL_for_hls: "The Vatican Door"
 COLDWAR_POL_for_hls_cas: "Casaroli's Working Group"
 COLDWAR_POL_for_hls_cas_desc: "A standing working group lets the State and the Holy See talk without the Primate's presence."
 COLDWAR_POL_for_hls_desc: "Between the Primate's Warsaw and the Holy See in Rome, a second line of dialogue opens."
 COLDWAR_POL_for_hls_dio: "Bishops for the Western Territories"
 COLDWAR_POL_for_hls_dio_desc: "Rome could give the western lands their own bishops once Bonn has signed the frontier treaty."
 COLDWAR_POL_for_hls_inv: "An Invitation to the Pope"
 COLDWAR_POL_for_hls_inv_desc: "The Primate wishes to receive a pope on Polish soil. The State dare not refuse; Moscow dare not like it."
 COLDWAR_POL_for_hls_rel: "Diplomatic Relations Restored"
 COLDWAR_POL_for_hls_rel_desc: "After decades without ambassadors the State and the Holy See could exchange them."
 COLDWAR_POL_for_root: "Peaceful Coexistence"
 COLDWAR_POL_for_root_desc: "Warsaw wants friends in every camp: the bloc for oil, the West for credit, Rome for peace at home. A foreign policy of open doors."
 COLDWAR_POL_for_sov: "The Elder Brother"
 COLDWAR_POL_for_sov_desc: "Moscow supplies the oil, the gas and the security guarantee. Poland shows it is a reliable ally and expects fair prices."
 COLDWAR_POL_for_sov_gas: "Soyuz Gas for Polish Labour"
 COLDWAR_POL_for_sov_gas_desc: "Polish brigades could lay a stretch of the planned Soviet gas pipeline and be paid in gas."
 COLDWAR_POL_for_sov_loan: "The Rouble Rescheduling"
 COLDWAR_POL_for_sov_loan_desc: "A debt that cannot be paid in dollars is deferred in roubles, at a price."
 COLDWAR_POL_for_sov_oil: "Oil at the Bucharest Formula"
 COLDWAR_POL_for_sov_oil_desc: "Oil at a five-year average price keeps Polish industry running when the world price jumps."
 COLDWAR_POL_for_sov_ships: "Ships for the Soviet Fleet"
 COLDWAR_POL_for_sov_ships_desc: "Gdansk and Szczecin build ships for Soviet customers, paid in roubles that buy only Soviet goods."
 COLDWAR_POL_for_usa: "Washington Calling"
 COLDWAR_POL_for_usa_ccc: "CCC Grain Credits"
 COLDWAR_POL_for_usa_ccc_desc: "A delegation goes to Washington to buy American grain on credit, to feed the livestock that the plan did not."
 COLDWAR_POL_for_usa_desc: "The Americans have grain and credit to sell and a million Polish voters at home."
 COLDWAR_POL_for_usa_gm: "Harvester and General Motors Licences"
 COLDWAR_POL_for_usa_gm_desc: "Chicago and Detroit sell licences for combines and engines to a planned economy."
 COLDWAR_POL_for_usa_nix: "The Joint Trade Commission"
 COLDWAR_POL_for_usa_nix_desc: "A joint trade commission and trade offices would let American firms see what Polish factories can make."
 COLDWAR_POL_for_usa_pl: "The PL 480 Deferral"
 COLDWAR_POL_for_usa_pl_desc: "Poland owes the Americans for earlier grain; deferring repayments buys more grain."
 COLDWAR_POL_for_wst: "The Western Capitals"
 COLDWAR_POL_for_wst_desc: "Paris, Rome and London compete to sell licences, lend francs and buy coal."
 COLDWAR_POL_for_wst_eng: "Perkins Engines for Ursus"
 COLDWAR_POL_for_wst_eng_desc: "British engines go into Polish tractors for the Polish farmer."
 COLDWAR_POL_for_wst_fiat: "Fiat Licence Repaid in Cars"
 COLDWAR_POL_for_wst_fiat_desc: "Turin would build the Polish people's car and take the finished ones in payment."
 COLDWAR_POL_for_wst_fra: "The French Credit Protocol"
 COLDWAR_POL_for_wst_fra_desc: "Paris lends to Warsaw with a credit protocol each year."
 COLDWAR_POL_for_wst_gis: "Giscard's Coal and Cooperation Accord"
 COLDWAR_POL_for_wst_gis_desc: "The French President is invited to sign a five-year plan of cooperation and a coal contract."
 COLDWAR_POL_for_wst_pc: "The Paris Club Rescheduling"
 COLDWAR_POL_for_wst_pc_desc: "The creditors meet in Paris to put off a default that no one wants."
 COLDWAR_POL_foreign_category: "Relations with Poland"
 COLDWAR_POL_foreign_category_desc: "Pressure, aid and offers for the Polish People's Republic. Each decision changes only our own country; Poland answers in its own capital."
 COLDWAR_POL_foreign_offers_tree_shortcut: "Foreign Offers"
 COLDWAR_POL_fra_repay_tt: "Repayment: from the third year §R0.004%§! of our GDP every week for 5 years (paid to France)."
 COLDWAR_POL_fra_reschedule: "Offer to Reschedule Polish Debt"
 COLDWAR_POL_fra_reschedule_desc: "Poland cannot meet this year's payments. For a creditor, a patient debtor is cheaper than a bankrupt one."
 COLDWAR_POL_fraternal_mobilisation: "Mobilisation Against Poland"
 COLDWAR_POL_fraternal_mobilisation_desc: "Tank regiments move to the Polish border and reservists are called up in Belarus and the Baltic republics. Trains of fuel and ammunition fill the sidings. The Kremlin pays for its patience in roubles and in nerves."
 COLDWAR_POL_free_press: "Presses and Union Aid from the West"
 COLDWAR_POL_free_press_desc: "Printing machines, paper and cash cross the border in the luggage of Western trade unionists. The union weekly runs to hundreds of thousands of copies, and the Security Service counts every parcel it misses.\n\n§gLapses while KOR and Solidarity are out of power and returns when they govern again.§!"
 COLDWAR_POL_free_voice: "The Free Voice of Poland"
 COLDWAR_POL_free_voice_desc: "Poland has voices in London, Paris, Munich and Washington that say what the censor forbids, and a press house in Warsaw now prints some of them. The Party and the Security Service resent every page.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_french_protocol: "The French Credit Protocol"
 COLDWAR_POL_french_protocol_desc: "Paris lends to a former miner of Lens and sells Poland French factories. Gierek, who once worked the coal of northern France, is a trusted friend at the Quai d'Orsay.\n\n§gAgreement with France: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_french_protocol_partner: "The French Credit Protocol"
 COLDWAR_POL_french_protocol_partner_desc: "Paris offers credits in francs and sells the Poles French plants, from chemical works to engineering lines. The Quai d'Orsay likes the idea of a bridge to the East, and the contractors like the orders.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_gdr_workers_programme_tt: "Poland keeps its §YOverseas Employment Programme§!: the German Democratic Republic and other partners can request Polish workers through the Ministry of Labour Abroad, and their wages return as remittances."
 COLDWAR_POL_ger_exit_quota: "Offer a Family Reunification Quota"
 COLDWAR_POL_ger_exit_quota_desc: "Ethnic Germans in Silesia and Masuria want to join their families in the Federal Republic. Bonn pays for every batch that Warsaw lets go."
 COLDWAR_POL_german_banks: "The Syndicated Bank Credit"
 COLDWAR_POL_german_banks_desc: "Frankfurt's banks lend to a planned economy that never defaults. Syndicated credits arrive in tranches, and every tranche is carefully spent on factories and imports. In Warsaw the finance ministry learns to write letters that German bankers like to read.\n\n§gAgreement with West Germany: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_german_banks_partner: "The Syndicated Bank Credit"
 COLDWAR_POL_german_banks_partner_desc: "The banks of Frankfurt, Munich and Dusseldorf form a syndicate to lend money to Poland. Eastern bloc credit is thought safe, because no state is supposed to default, and the bankers sleep soundly.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_giedroyc: "Jerzy Giedroyc"
 COLDWAR_POL_gierek: "Edward Gierek"
 COLDWAR_POL_gierek_a1: "Rehabilitate the Intelligentsia"
 COLDWAR_POL_gierek_a1_desc: "Let the professors purged in 1968 return to their chairs and the young engineers travel to Western conferences. Some of them will start asking questions."
 COLDWAR_POL_gierek_a1_tb: "Rehabilitate the Intelligentsia"
 COLDWAR_POL_gierek_a1f: "Councils of Experts"
 COLDWAR_POL_gierek_a1f_desc: "Economists and engineers sit beside the ministers and write the plans. Party secretaries who used to decide now only sign."
 COLDWAR_POL_gierek_a2: "The Propaganda of Success"
 COLDWAR_POL_gierek_a2_desc: "Television, the press and every factory banner report record harvests and new flats. The gap between the screen and the shop counter will be remembered."
 COLDWAR_POL_gierek_a2f: "Scenes from the Decade"
 COLDWAR_POL_gierek_a2f_desc: "A modern, colourful state television sells the decade to the nation every evening. Its chairman builds villas on the side."
 COLDWAR_POL_gierek_a2f_tb: "Scenes from the Decade"
 COLDWAR_POL_gierek_b1: "The Licence Strategy"
 COLDWAR_POL_gierek_b1_desc: "Buy the factory, not the product: Western licences, paid on credit, will be repaid with the goods they produce. Moscow notes how much Poland now trades with the capitalists."
 COLDWAR_POL_gierek_b1f: "The Small Fiat"
 COLDWAR_POL_gierek_b1f_desc: "A car a worker can buy. The Fiat 126 licence brings a new factory to Bielsko-Biala and a waiting list longer than the factory can serve."
 COLDWAR_POL_gierek_b1f_tb: "The Small Fiat"
 COLDWAR_POL_gierek_b2: "Socialist Division of Labour"
 COLDWAR_POL_gierek_b2_desc: "Grow inside the bloc: Poland builds ships, buses and helicopters for all of Comecon and buys Soviet oil in transferable roubles. Less Western debt, less Western technology."
 COLDWAR_POL_gierek_b2f: "The Orenburg Pipeline Brigades"
 COLDWAR_POL_gierek_b2f_desc: "Polish workers lay their share of the Soyuz gas pipeline across the Urals. They are paid in gas for the next twenty years."
 COLDWAR_POL_gierek_b2f_tb: "The Orenburg Pipeline Brigades"
 COLDWAR_POL_gierek_c1: "Two Million Flats"
 COLDWAR_POL_gierek_c1_desc: "Concrete panel estates rise around every city. A young family can finally leave the in-laws' kitchen, after an eleven-year wait."
 COLDWAR_POL_gierek_c2: "The Security Service Rebuilt"
 COLDWAR_POL_gierek_c2_desc: "The Security Service is reorganised, enlarged and given modern equipment. Dissidents learn that the new leadership listens to more than the factories."
 COLDWAR_POL_gierek_cap: "The Decade of Success"
 COLDWAR_POL_gierek_cap_desc: "Poland has new motorways, a rebuilt Royal Castle, a small car in many families and a team that came third at the World Cup. The bill has not yet arrived."
 COLDWAR_POL_gierek_cm: "Forty-Nine Voivodeships"
 COLDWAR_POL_gierek_cm_desc: "Abolish the counties and split the provinces into forty-nine small voivodeships. No regional party boss will ever again be strong enough to challenge Warsaw."
 COLDWAR_POL_gierek_cm_tb: "Forty-Nine Voivodeships"
 COLDWAR_POL_gierek_d1: "Gierek in Paris"
 COLDWAR_POL_gierek_d1_desc: "The French-speaking former miner from Lens is welcome in Paris and Bonn. French credit lines and German banks follow him home."
 COLDWAR_POL_gierek_d1_tb: "Gierek in Paris"
 COLDWAR_POL_gierek_d2: "Brezhnev's Hunting Guest"
 COLDWAR_POL_gierek_d2_desc: "Gierek spends his holidays in the Crimea with Brezhnev. Soviet oil stays cheap and Moscow asks fewer questions about Polish credits."
 COLDWAR_POL_gierek_dm: "The Tenth Industrial Power"
 COLDWAR_POL_gierek_dm_desc: "The slogan says Poland will be the world's tenth industrial power. The plants are real, even if the slogan is not."
 COLDWAR_POL_gierek_dm_tb: "The Tenth Industrial Power"
 COLDWAR_POL_gierek_e: "The Second Poland"
 COLDWAR_POL_gierek_e_desc: "Edward Gierek ran Silesia like a company town that delivered. He promises the whole country what Katowice already has: work, flats and something in the shops."
 COLDWAR_POL_gierek_eco: "Growth on Credit"
 COLDWAR_POL_gierek_eco_desc: "Western banks are flush with money and eager to lend to a planned economy that never defaults. Borrow now, build now, repay with the exports of the new factories."
 COLDWAR_POL_gierek_em: "Huta Katowice"
 COLDWAR_POL_gierek_em_desc: "The largest steelworks in Poland rises on a field near Dabrowa Gornicza, fed by a broad-gauge railway from the Soviet ore fields."
 COLDWAR_POL_gierek_pm: "The Seventh Congress"
 COLDWAR_POL_gierek_pm_desc: "The Party congress crowns the decade so far: a new Politburo, a new plan, and the leading role of the Party written into the coming constitution."
 COLDWAR_POL_gierek_pol: "Consultations in the Factories"
 COLDWAR_POL_gierek_pol_desc: "The new leadership goes to the shipyards in person and asks for help. The old apparatus resents ministers who listen to strikers."
 COLDWAR_POL_gierek_x1: "Babiuch's Austerity"
 COLDWAR_POL_gierek_x1_desc: "Edward Babiuch takes the government with orders to cut imports and raise prices quietly. The banks are relieved; the queues are not."
 COLDWAR_POL_gierek_x2: "Rakowski's Reform Wing"
 COLDWAR_POL_gierek_x2_desc: "Mieczyslaw Rakowski of Polityka argues for prices that tell the truth and a Party that talks to its critics. Moscow calls it revisionism."
 COLDWAR_POL_gierek_x2_tb: "Rakowski's Reform Wing"
 COLDWAR_POL_giscard_accord: "Giscard's Coal and Cooperation Accord"
 COLDWAR_POL_giscard_accord_desc: "France buys Polish coal and sells Polish industry a decade of credit. President Giscard d'Estaing visits Warsaw, drinks toasts to friendship and signs the accords, and the French delegation goes home with promises of contracts and a taste for Polish vodka.\n\n§gAgreement with France: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_giscard_accord_partner: "Giscard's Coal and Cooperation Accord"
 COLDWAR_POL_giscard_accord_partner_desc: "President Giscard d'Estaing signs a five-year accord with Gierek: French coal purchases, French credit and French contracts for Polish industry. Paris gains a reliable coal supplier and a friendly eastern capital.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_glemp: "Jozef Glemp"
 COLDWAR_POL_gomulka: "Wladyslaw Gomulka"
 COLDWAR_POL_gomulka_a1: "Verification of the Party Cards"
 COLDWAR_POL_gomulka_a1_desc: "Every member re-registers before a committee of the old guard, as in 1958. Careerists and doubters drop out, and so do the workers who never found time for the meetings."
 COLDWAR_POL_gomulka_a1_tb: "Verification of the Party Cards"
 COLDWAR_POL_gomulka_a1f: "The Party Control Commission"
 COLDWAR_POL_gomulka_a1f_desc: "A stern commission of old comrades audits every committee and punishes waste and moral lapses. Thrift is the rule, and it is not loved by the secretaries it audits."
 COLDWAR_POL_gomulka_a2: "The Partisans Kept at Bay"
 COLDWAR_POL_gomulka_a2_desc: "Moczar lost the Interior Ministry in 1968 and Gomulka means to keep him from getting it back. Loyal deputies take over the files, the Partisans are watched, and the veterans' men grumble."
 COLDWAR_POL_gomulka_a2f: "The Interior Ministry Re-Staffed"
 COLDWAR_POL_gomulka_a2f_desc: "Trusted Gomulka men run the ministry, the Security Service and the prosecutors. The secret police no longer belong to a faction, only to the First Secretary."
 COLDWAR_POL_gomulka_b1: "The Jaszczuk Reform"
 COLDWAR_POL_gomulka_b1_desc: "Boleslaw Jaszczuk's plan lets factory directors keep part of their profit and pays workers by result. The ministries lose power over the enterprises, and the treasury pays the first bonuses."
 COLDWAR_POL_gomulka_b1f: "Enterprise Associations"
 COLDWAR_POL_gomulka_b1f_desc: "Factories merge into industrial associations that keep accounts, pay bonuses and answer for profit. Directors become managers; workers on fixed norms start counting each others' premiums."
 COLDWAR_POL_gomulka_b1f_tb: "Enterprise Associations"
 COLDWAR_POL_gomulka_b2: "Selective Development"
 COLDWAR_POL_gomulka_b2_desc: "No more scattering of money: coal, steel, machines and chemicals come first, and the shops can wait. Every ministry must justify any investment that does not feed the heavy sector."
 COLDWAR_POL_gomulka_b2f: "The Plock Chemical Works"
 COLDWAR_POL_gomulka_b2f_desc: "Druzhba crude flows from the east to a refinery and petrochemical complex on the Vistula. Poland will make its own fuel, plastics and fertiliser, if the consumer waits a few more years."
 COLDWAR_POL_gomulka_b2f_tb: "The Plock Chemical Works"
 COLDWAR_POL_gomulka_c1: "Order in the Press and the Theatre"
 COLDWAR_POL_gomulka_c1_desc: "Censors tighten their grip on stage, press and the universities, as in the weeks after Dziady. Order is kept; the writers and professors who might have worked abroad stop answering letters."
 COLDWAR_POL_gomulka_c2: "End of the March Campaign"
 COLDWAR_POL_gomulka_c2_desc: "The anti-Zionist campaign has shamed Poland and the Party. Gomulka's closest men announce that it is over; the Partisans take this as a rebuke, and the emigrants are not coming back."
 COLDWAR_POL_gomulka_cap: "The Polish Road, Kept Steady"
 COLDWAR_POL_gomulka_cap_desc: "A decade without a debt, a revolt or a Soviet reproach. Nothing glitters and nothing is lost, but the wages stand still and the young begin to look abroad."
 COLDWAR_POL_gomulka_cap_tb: "The Polish Road, Kept Steady"
 COLDWAR_POL_gomulka_cm: "The Pensions of the Old Party"
 COLDWAR_POL_gomulka_cm_desc: "Veterans of the pre-war Party, of the Resistance and of the mines receive pensions and holiday places from a new fund. The treasury pays and the old guard votes yes."
 COLDWAR_POL_gomulka_d1: "The Ostpolitik Dividend"
 COLDWAR_POL_gomulka_d1_desc: "Willy Brandt knelt at the Ghetto Heroes' monument and Bonn is ready to trade. West German credit and licences look attractive, but Moscow wants to know what else Warsaw is promising."
 COLDWAR_POL_gomulka_d2: "T-55 for the Pact"
 COLDWAR_POL_gomulka_d2_desc: "Bumar-Labedy turns out Soviet-designed tanks for every army in the Pact. Moscow notices who is a dependable arsenal, and Polish engineers notice what they are not allowed to design."
 COLDWAR_POL_gomulka_d2_tb: "T-55 for the Pact"
 COLDWAR_POL_gomulka_dm: "The Five-Year Plan of Steel"
 COLDWAR_POL_gomulka_dm_desc: "Targets for coal, steel and cement are fixed for five years ahead, and imports of Western machines are cut to what can be paid in exports. The plan is dull and it adds up."
 COLDWAR_POL_gomulka_dm_tb: "The Five-Year Plan of Steel"
 COLDWAR_POL_gomulka_e: "Comrade Wieslaw Holds the Line"
 COLDWAR_POL_gomulka_e_desc: "The First Secretary refuses to resign over the coast. He has led the Party since October 1956 and tells the Central Committee that a socialist state does not bend to a crowd in the street."
 COLDWAR_POL_gomulka_eco: "The Revised Price System"
 COLDWAR_POL_gomulka_eco_desc: "The December price list was Gomulka's own scheme: honest prices for meat and flour, wages tied to output. If it is introduced slowly and explained, he argues, the shipyards will accept it."
 COLDWAR_POL_gomulka_em: "The Copper Basin"
 COLDWAR_POL_gomulka_em_desc: "Copper under Legnica and Lubin is the one resource Poland can sell for hard currency. Mines, a smelter and a new town rise on the plain, with equipment bought from abroad."
 COLDWAR_POL_gomulka_pm: "The Fifth Congress Reaffirms"
 COLDWAR_POL_gomulka_pm_desc: "Delegates cheer the leading role of the Party, Brezhnev attends in person, and the line is confirmed: no experiments, no factions. The rank and file go home with a longer list of rules."
 COLDWAR_POL_gomulka_pol: "The Warsaw Treaty Is Mine"
 COLDWAR_POL_gomulka_pol_desc: "Gomulka opened the road to Bonn with his offer of 1969, and the border treaty has just been signed in Warsaw. He sees it as the crown of his rule, and Moscow approves a German settlement made on Soviet terms."
 COLDWAR_POL_gomulka_x1: "Kania, the Compromise"
 COLDWAR_POL_gomulka_x1_desc: "Stanislaw Kania, secretary for the Church and security, is no friend of anybody's faction. The Central Committee picks him because nobody fears him, and the bishops will take his calls."
 COLDWAR_POL_gomulka_x2: "Kociolek's Firm Hand"
 COLDWAR_POL_gomulka_x2_desc: "Stanislaw Kociolek ran the Gdansk party committee in December 1970 and spoke to the strikers on the radio. Gomulka had marked him as the man to carry on, and the shipyards remember his voice."
 COLDWAR_POL_grabski: "Tadeusz Grabski"
 COLDWAR_POL_gucwa: "Stanislaw Gucwa"
 COLDWAR_POL_harvester_gm: "Harvester and General Motors Licences"
 COLDWAR_POL_harvester_gm_desc: "American companies sell know-how for Polish hard currency. Engineers from International Harvester and General Motors visit Polish plants with blueprints and thermos flasks, and licensed designs begin to appear on assembly lines where nothing like them stood before.\n\n§gAgreement with the United States: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_harvester_gm_partner: "Harvester and General Motors Licences"
 COLDWAR_POL_harvester_gm_partner_desc: "Engineers from Illinois and Detroit license their designs to Polish plants and collect payment in hard currency. Boardrooms are pleased with a sale behind the Iron Curtain, and the Commerce Department approves.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_hls_pilgrimage: "Propose a Pilgrimage to Poland"
 COLDWAR_POL_hls_pilgrimage_desc: "The Primate wants the Pope to kneel at Czestochowa and speak to his people. The Holy See can propose a pilgrimage; Warsaw must decide whether to let a million Poles gather in one field."
 COLDWAR_POL_iccs_vietnam: "The ICCS Mission in Vietnam"
 COLDWAR_POL_iccs_vietnam_desc: "Polish officers in light tropical uniforms inspect ceasefire sites across South Vietnam beside their Hungarian, Indonesian and Canadian colleagues. Warsaw has a seat at a great-power table, and Hanoi has a friendly pair of eyes.\n\n§gAgreement with Vietnam: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_iccs_vietnam_partner: "The ICCS Mission in Vietnam"
 COLDWAR_POL_iccs_vietnam_partner_desc: "Polish officers of the commission walk the roads, markets and airfields of the south and write careful reports. In Hanoi these observers are called friends, and their reports help to fill the file of violations.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_ikarus_buses: "Ikarus Buses and Hungarian Know-How"
 COLDWAR_POL_ikarus_buses_desc: "Long Ikarus buses rumble through the streets of Polish towns. Hungarian agronomists come to show how a small household plot can feed a town, and Polish farmers walk their fields with notebooks and quiet envy.\n\n§gAgreement with Hungary: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_ikarus_buses_partner: "Ikarus Buses and Hungarian Know-How"
 COLDWAR_POL_ikarus_buses_partner_desc: "Budapest sells its long Ikarus buses to Poland and sends agronomists to explain the household plot. Hungarian economists are pleased that a larger neighbour finds their cautious experiments worth studying.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_incentive_economy: "The Incentive Economy"
 COLDWAR_POL_incentive_economy_desc: "Directors' bonuses and workers' wages follow output and quality. Managers learn what a balance sheet is, and shop assistants learn that a customer may be encouraged to return. Party secretaries watch their old powers drain away like water from a bath.\n\n§gPoland's economic model: adopting another model replaces it.§!"
 COLDWAR_POL_independence_socialism: "Independence Before Class"
 COLDWAR_POL_independence_socialism_desc: "Pilsudski left the red tram at the Independence stop, and the Socialists remember where it is. Poland first, social reform within a free state: a line that wins officers, costs the class-first workers and sets the neighbour's teeth on edge.\n\n§gLapses while the PPS is out of power and returns when it governs again.§!"
 COLDWAR_POL_industry_e: "The Industrial Programme"
 COLDWAR_POL_industry_e_desc: "Poland wants to be counted among the industrial powers. The ministries will pick the plants that earn dollars or save them."
 COLDWAR_POL_industry_e_tb: "The Industrial Programme"
 COLDWAR_POL_industry_fu1: "The Silesian Mines Plan"
 COLDWAR_POL_industry_fu1_desc: "More coal from deeper seams, and better pay for the men who cut it. Mining is the Party's proudest profession and its most dangerous."
 COLDWAR_POL_industry_fu1_tb: "The Silesian Mines Plan"
 COLDWAR_POL_industry_fu2a: "Belchatow Lignite Basin"
 COLDWAR_POL_industry_fu2a_desc: "An open-pit lignite mine and a giant power station in the Lodz plain. Power for the whole nation, soot and debt for the whole district."
 COLDWAR_POL_industry_fu2a_tb: "Belchatow Lignite Basin"
 COLDWAR_POL_industry_fu2b: "The Mir Power Grid"
 COLDWAR_POL_industry_fu2b_desc: "Join the Comecon grid and take current from Ukrainian stations. Cheap and quick, and Moscow reads the meter."
 COLDWAR_POL_industry_fu3: "Plock Petrochemicals"
 COLDWAR_POL_industry_fu3_desc: "The Druzhba pipeline ends at Plock. The refinery and a new ethylene plant can turn Soviet crude into fuel and plastics."
 COLDWAR_POL_industry_fu3_tb: "Plock Petrochemicals"
 COLDWAR_POL_industry_fu4: "Zarnowiec Nuclear Plant"
 COLDWAR_POL_industry_fu4_desc: "Soviet-licensed reactors on Lake Zarnowiec could end Poland's dependence on Silesian coal. The site is picked; the engineers need years and a great deal of credit."
 COLDWAR_POL_industry_fu4_tb: "Zarnowiec Nuclear Plant"
 COLDWAR_POL_industry_fu5a: "Sell Coal for Hard Currency"
 COLDWAR_POL_industry_fu5a_desc: "Silesian coal is Poland's best export. Sell more of it and pay the bankers, even if the miners must work Sundays."
 COLDWAR_POL_industry_fu5b: "The Modern Longwall Pits"
 COLDWAR_POL_industry_fu5b_desc: "Buy shearers and powered supports from Britain and Germany and mine fewer tonnes more safely. The pay-back is slow; the miners are loyal."
 COLDWAR_POL_industry_fu5b_tb: "The Modern Longwall Pits"
 COLDWAR_POL_industry_fu6: "The Fuel and Power Ministry"
 COLDWAR_POL_industry_fu6_desc: "One ministry for pit, plant and pipeline gives Warsaw a single energy budget. It also gives the miners one more office to argue with."
 COLDWAR_POL_industry_fu6_tb: "The Fuel and Power Ministry"
 COLDWAR_POL_industry_rm1: "KGHM: Lubin and Glogow"
 COLDWAR_POL_industry_rm1_desc: "A huge copper deposit under Lower Silesia: shafts at Lubin, a smelter at Glogow. The ore is poor and the dollars will be good."
 COLDWAR_POL_industry_rm1_tb: "KGHM: Lubin and Glogow"
 COLDWAR_POL_industry_rm2a: "Copper for Export"
 COLDWAR_POL_industry_rm2a_desc: "Ship refined copper cathodes to London and Hamburg and book the dollars against the debt. The factories at home wait for what is left."
 COLDWAR_POL_industry_rm2b: "Copper for Polish Industry"
 COLDWAR_POL_industry_rm2b_desc: "Keep the copper at home for cable works, brass mills and motors, so the machines need fewer foreign inputs. The dollars it would earn must be borrowed instead."
 COLDWAR_POL_industry_rm2b_tb: "Copper for Polish Industry"
 COLDWAR_POL_industry_rm3: "Tarnobrzeg Sulphur"
 COLDWAR_POL_industry_rm3_desc: "Sulphur lies beneath Subcarpathia. Melted from the ground with hot water, it will go to the acid and fertiliser plants."
 COLDWAR_POL_industry_rm3_tb: "Tarnobrzeg Sulphur"
 COLDWAR_POL_industry_rm4: "The Fertiliser Combines"
 COLDWAR_POL_industry_rm4_desc: "Sulphur and Soviet gas become fertiliser at Pulawy and Wloclawek. The farmers get artificial manure; the state gets exports."
 COLDWAR_POL_industry_sy1: "The Shipyard Programme"
 COLDWAR_POL_industry_sy1_desc: "Gdansk, Gdynia and Szczecin build ships for the world and for Comecon, and pay the workers less than they earn."
 COLDWAR_POL_industry_sy2a: "Yards for the Eastern Bloc"
 COLDWAR_POL_industry_sy2a_desc: "Moscow orders fishing factories, trawlers and landing ships and pays in oil and credit roubles. The orders are safe and the margins small."
 COLDWAR_POL_industry_sy2b: "Ships for Western Owners"
 COLDWAR_POL_industry_sy2b_desc: "Greek, Norwegian and German owners pay in dollars and want Western-standard hulls. Moscow asks why the best berths go to the capitalists."
 COLDWAR_POL_industry_sy2b_tb: "Ships for Western Owners"
 COLDWAR_POL_industry_sy3: "Northern Port Gdansk"
 COLDWAR_POL_industry_sy3_desc: "A deep-water port beyond the Dead Vistula for coal, sulphur and oil. Poland will not have to depend on German ports."
 COLDWAR_POL_industry_sy3_tb: "Northern Port Gdansk"
 COLDWAR_POL_industry_sy4: "Polish Ocean Lines"
 COLDWAR_POL_industry_sy4_desc: "A merchant fleet earns freight in dollars, and sailors who see Rotterdam and Singapore come home with opinions."
 COLDWAR_POL_industry_sy4_tb: "Polish Ocean Lines"
 COLDWAR_POL_industry_sy5: "Deep-Sea Fishing Fleets"
 COLDWAR_POL_industry_sy5_desc: "Trawlers on the Newfoundland banks and in the North Sea bring home cod and herring, and some of the protein the shops lack."
 COLDWAR_POL_industry_tree_shortcut: "Industry"
 COLDWAR_POL_interim_government: "Free Elections Now"
 COLDWAR_POL_interim_government_desc: "No agreement with the Party can hold, says the union floor, until the Sejm is freely elected. A caretaker government and a vote are demanded, and Moscow reads the demand as the end of socialism in Poland.\n\n§gLapses while KOR and Solidarity are out of power and returns when they govern again.§!"
 COLDWAR_POL_intermarium: "The Intermarium Federation"
 COLDWAR_POL_intermarium_desc: "Between the Baltic and the Black Sea, free nations that once shared a Commonwealth could stand together again as equals. Pilsudski drew this map long ago, and exiles still carry it folded in their wallets. The Kremlin has read it before.\n\n§gLapses while the Confederation is out of power and returns when it governs again.§!"
 COLDWAR_POL_international_ties: "The Socialist International Line"
 COLDWAR_POL_international_ties_desc: "Brandt in Bonn, Kreisky in Vienna and Palme in Stockholm show that socialism can come with free elections. The Party takes its seat at their table and takes their advice and their money.\n\n§gLapses while the PPS is out of power and returns when it governs again.§!"
 COLDWAR_POL_iraq_contracts: "Polish Contractors in Iraq"
 COLDWAR_POL_iraq_contracts_desc: "Baghdad hires Polish builders for roads and housing, and pays in dollars. Polish foremen sweat in the summer heat of Basra and Mosul, and the cheques reach the state bank in Warsaw.\n\n§gAgreement with Iraq: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_iraq_contracts_partner: "Polish Contractors in Iraq"
 COLDWAR_POL_iraq_contracts_partner_desc: "Polish construction crews arrive in Iraq to build roads, apartment blocks and factories. They work through the summer heat and finish on time, and the ministry of housing is pleased to pay.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_jaroszewicz: "Piotr Jaroszewicz"
 COLDWAR_POL_jaruz_a1: "Martial Law"
 COLDWAR_POL_jaruz_a1_desc: "The army can take the squares, the telephones and the printing presses before any strike committee meets, and Moscow's divisions can stay at home. The strikes will stop, and the price will come later."
 COLDWAR_POL_jaruz_a1f: "Summary Courts and Internment"
 COLDWAR_POL_jaruz_a1f_desc: "Military courts will try strike leaders within days, and camps are readied for men who were in the union. Justice is quick, and the memory of it will not be."
 COLDWAR_POL_jaruz_a2: "The Front of National Accord"
 COLDWAR_POL_jaruz_a2_desc: "The general asks the Primate and the strike leaders to a table, to share a state they all fear to lose. Moscow warns him that the table is a trap."
 COLDWAR_POL_jaruz_a2f: "The Church-State Commission"
 COLDWAR_POL_jaruz_a2f_desc: "A standing commission of bishops and ministers settles disputes about priests, pilgrimages and churches. The Church is a partner, and the Party must hear what it says."
 COLDWAR_POL_jaruz_b1: "The Militarised Economy"
 COLDWAR_POL_jaruz_b1_desc: "Coal, rail and the ports run on military discipline, and army trucks haul the harvest. Production meets targets, and the farmers and the trade unionists pay for it."
 COLDWAR_POL_jaruz_b1f: "Ration Cards and the Army Depots"
 COLDWAR_POL_jaruz_b1f_desc: "Army depots stockpile flour and meat, and ration cards guarantee a minimum for every family. The queue becomes a list, and the list becomes an institution."
 COLDWAR_POL_jaruz_b2: "The Second Stage of Reform"
 COLDWAR_POL_jaruz_b2_desc: "Economists want market prices, self-financing firms and a real budget. The price rises that follow will test whether anyone believes the general."
 COLDWAR_POL_jaruz_b2f: "The Joint Venture Law"
 COLDWAR_POL_jaruz_b2f_desc: "Foreign firms may open joint ventures in Poland and send their profits home. Polish engineers learn what a market looks like, and the apparatus learns who now writes the contracts."
 COLDWAR_POL_jaruz_b2f_tb: "The Joint Venture Law"
 COLDWAR_POL_jaruz_c1: "PRON, the Facade of Consultation"
 COLDWAR_POL_jaruz_c1_desc: "The Patriotic Movement for National Rebirth brings together Party, allied parties, Catholics and non-party names. It meets, it consults, it resolves, and no one doubts who decides."
 COLDWAR_POL_jaruz_c2: "Officers in the Voivodeships"
 COLDWAR_POL_jaruz_c2_desc: "Colonels take the place of first secretaries in the provinces, and the administration is cleaner and quicker. The Party notes that its own men now stand behind the officers."
 COLDWAR_POL_jaruz_cap: "Order Restored, Dialogue Opened"
 COLDWAR_POL_jaruz_cap_desc: "The shipyards work, the Church speaks, and the officers have given back more than they took. Poland is calm and its army stays in its barracks, though few believe it will stay there forever."
 COLDWAR_POL_jaruz_cm: "The Constitutional Tribunal and Ombudsman"
 COLDWAR_POL_jaruz_cm_desc: "A court for the constitution and an ombudsman for the citizens: the army claims it wants a state that obeys its own laws. Many Poles pay attention."
 COLDWAR_POL_jaruz_d1: "Moscow's Oil, Moscow's Terms"
 COLDWAR_POL_jaruz_d1_desc: "Soviet oil and gas keep Polish power plants going, and Moscow gets a say in return. The general defends it as a loyalty that costs less than debt."
 COLDWAR_POL_jaruz_d2: "Poland at the IMF and the World Bank"
 COLDWAR_POL_jaruz_d2_desc: "Poland has applied to rejoin the Fund and the Bank, and Western governments say sanctions can be eased step by step. The conditions are the usual ones, and Moscow reads the fine print."
 COLDWAR_POL_jaruz_dm: "The Modernised Army"
 COLDWAR_POL_jaruz_dm_desc: "Poland's tank plants build the T-72 under licence, and a new generation of officers trains on the new equipment. The foreign press counts the tanks that went to the barracks."
 COLDWAR_POL_jaruz_dm_tb: "The Modernised Army"
 COLDWAR_POL_jaruz_e: "The Defence Minister's Staff"
 COLDWAR_POL_jaruz_e_desc: "General Jaruzelski has led the Defence Ministry since 1968, and his officers are the last institution that obeys orders and keeps its files in order. He offers it to a Party that has lost its way."
 COLDWAR_POL_jaruz_eco: "Commissars in the Factories"
 COLDWAR_POL_jaruz_eco_desc: "Officers with plans, schedules and rifles enter the plants. Deliveries arrive on time, and the shop floor watches them like policemen."
 COLDWAR_POL_jaruz_em: "Coal for Hard Currency"
 COLDWAR_POL_jaruz_em_desc: "Miners under military discipline dig harder, and every spare tonne goes west for dollars to pay the bankers. Output is high and the pits are hot."
 COLDWAR_POL_jaruz_pm: "The Triple Office"
 COLDWAR_POL_jaruz_pm_desc: "The general holds the government, the Party and the Defence Ministry at once. The Council of State sits as a chancellery for one man."
 COLDWAR_POL_jaruz_pol: "The Lesser Evil"
 COLDWAR_POL_jaruz_pol_desc: "If Poles do not restore order themselves, others will do it for them. A Polish uniform, the general tells the Politburo, is better than a Soviet one."
 COLDWAR_POL_jaruz_x1: "The Rakowski Government"
 COLDWAR_POL_jaruz_x1_desc: "Mieczyslaw Rakowski takes the government with a plan for a market and an eye on the oldest shipyard. The economists are delighted, and the workers keep the date."
 COLDWAR_POL_jaruz_x2: "Kiszczak and the Round Table"
 COLDWAR_POL_jaruz_x2_desc: "Interior Minister Czeslaw Kiszczak, the general's oldest ally, meets Walesa and opens a table to the opposition. The security man proves the better negotiator."
 COLDWAR_POL_jaruzelski: "Wojciech Jaruzelski"
 COLDWAR_POL_kaczorowski: "Ryszard Kaczorowski"
 COLDWAR_POL_kania: "Stanislaw Kania"
 COLDWAR_POL_king_coal: "King Coal"
 COLDWAR_POL_king_coal_desc: "Hundreds of thousands of miners dig the black coal that heats the cities, pays for imports and fills the Comecon quotas. Katowice lives under a grey haze, and the pithead is the pulse of the whole economy.\n\n§gIndustry focuses that modernise the mines, export coal for hard currency or diversify into copper, sulphur and power replace it.§!"
 COLDWAR_POL_kiszczak: "Czeslaw Kiszczak"
 COLDWAR_POL_kociolek: "Stanislaw Kociolek"
 COLDWAR_POL_kowalczyk: "Edward Kowalczyk"
 COLDWAR_POL_kpn_a1: "The Helsinki Rights Campaign"
 COLDWAR_POL_kpn_a1_desc: "Collect the cases, quote the articles of the pledges Warsaw has signed and send them abroad. A state that signed cannot answer without admitting what it did, and the officers distrust lawyers' tactics."
 COLDWAR_POL_kpn_a1_tb: "The Helsinki Rights Campaign"
 COLDWAR_POL_kpn_a2: "The Declaration of Independence"
 COLDWAR_POL_kpn_a2_desc: "No more petitions. The Confederation says plainly that the People's Republic is Russian rule and that only the end of the Party's monopoly can free Poland."
 COLDWAR_POL_kpn_b1: "Workers in Management"
 COLDWAR_POL_kpn_b1_desc: "The crew sits on the board and the state sets the frame. Point five of the declaration is the Confederation's offer to the strikers."
 COLDWAR_POL_kpn_b1_tb: "Workers in Management"
 COLDWAR_POL_kpn_b2: "The Kwiatkowski Tradition"
 COLDWAR_POL_kpn_b2_desc: "Gdynia was built from a fishing village in a decade, the Central Industrial District from fields. A state that knows what it wants can do it again, if it can borrow."
 COLDWAR_POL_kpn_b2_tb: "The Kwiatkowski Tradition"
 COLDWAR_POL_kpn_cap: "The Third Republic"
 COLDWAR_POL_kpn_cap_desc: "A democratic, sovereign Poland that owes nothing to Moscow or the Party's old guard builds its own arms at Stalowa Wola, as the Central Industrial District once did. Moscow has noticed."
 COLDWAR_POL_kpn_e: "The Movement for Human Rights"
 COLDWAR_POL_kpn_e_desc: "Warsaw has put its name to international pledges on human rights, and the Movement means to hold it to them. Its eighteen founders include a general of the Second Republic and two men just out of prison."
 COLDWAR_POL_kpn_eco: "Economic Sovereignty"
 COLDWAR_POL_kpn_eco_desc: "A Polish economy must serve Poland, not Comecon quotas or the creditors' calendar. The Confederation will say who owns what, and for whom the mines are dug."
 COLDWAR_POL_kpn_eco_tb: "Economic Sovereignty"
 COLDWAR_POL_kpn_em: "The Intermarium Federation"
 COLDWAR_POL_kpn_em_desc: "Between the Baltic and the Black Sea, free nations that were once Poland's neighbours in the Commonwealth could stand together. Every capital from Moscow to Bonn has read this map before."
 COLDWAR_POL_kpn_em_tb: "The Intermarium Federation"
 COLDWAR_POL_kpn_pm: "The Appeal to the Army"
 COLDWAR_POL_kpn_pm_desc: "The officers swore an oath to Poland, not to a Party. The Confederation speaks to colonels and conscripts alike: your duty is to the nation, and you will be remembered."
 COLDWAR_POL_kpn_pm_dr: "The Appeal to the Army"
 COLDWAR_POL_kpn_pol: "The Heirs of the Legions"
 COLDWAR_POL_kpn_pol_desc: "Pilsudski's soldiers made a state out of three empires. The young men who lay flowers at the Unknown Soldier on 11 November want to finish the work."
 COLDWAR_POL_kpn_x1: "The Confederation of Groups"
 COLDWAR_POL_kpn_x1_desc: "Keep the tent wide: Pilsudskites, conservatives, workers and students under one name and one signature, each with its own paper. The Security Service infiltrates what it cannot count."
 COLDWAR_POL_kpn_x2: "One Party, One Line"
 COLDWAR_POL_kpn_x2_desc: "A single party with a clear leadership can stand in an election and discipline its cells. Workers who wanted a movement find a barracks."
 COLDWAR_POL_kpp_a1: "Bombard the Headquarters"
 COLDWAR_POL_kpp_a1_desc: "Workers are told to criticise their directors and ministries in public. The state apparatus shrinks, and Moscow sees where such talk usually ends."
 COLDWAR_POL_kpp_a2: "The Iron Cadre Party"
 COLDWAR_POL_kpp_a2_desc: "A small Party of tested cadres runs everything from the Central Committee to the factory cell. Discipline replaces discussion, and the unions are only a transmission belt."
 COLDWAR_POL_kpp_b1: "Rely on Our Own Strength"
 COLDWAR_POL_kpp_b1_desc: "No Western licences, no Western debt and no dependence on Comecon either. The country builds its own factories with its own steel and its own people."
 COLDWAR_POL_kpp_b2: "Mass Labour Mobilisation"
 COLDWAR_POL_kpp_b2_desc: "Weekend work shifts, youth brigades and factory competitions build roads, dams and workshops without waiting for the plan. The workers are told it is an honour."
 COLDWAR_POL_kpp_b2_tb: "Mass Labour Mobilisation"
 COLDWAR_POL_kpp_cap: "A Self-Reliant People's Poland"
 COLDWAR_POL_kpp_cap_desc: "Poland stands alone between two empires, with its own factories, its own militia and a Party that owes nothing to anyone. It is poorer in shops and richer in pride."
 COLDWAR_POL_kpp_e: "The Anti-Revisionist Line"
 COLDWAR_POL_kpp_e_desc: "Alternative: Comrade Mijal takes the Party and declares that Moscow's road is a betrayal of Lenin and Stalin. Radio Tirana stops broadcasting into Poland and starts to speak from Warsaw."
 COLDWAR_POL_kpp_eco: "Heavy Industry First"
 COLDWAR_POL_kpp_eco_desc: "Steel, coal and machines come before shop windows. The plan is rewritten to cut the consumer share and send the difference to the blast furnaces."
 COLDWAR_POL_kpp_em: "The Gdansk Dock Cells"
 COLDWAR_POL_kpp_em_desc: "The only place where Mijal's party ever had friends is the Gdansk shipyard. Make the dock cells the model workshop of the new Poland and give them a slipway worthy of it."
 COLDWAR_POL_kpp_em_tb: "The Gdansk Dock Cells"
 COLDWAR_POL_kpp_pm: "Radio Tirana in Polish"
 COLDWAR_POL_kpp_pm_desc: "The Polish programme from Tirana is heard in the Gdansk docks and Silesian pits. Militia drills, anti-clerical pamphlets and slogans from Beijing arrive in the same bundle."
 COLDWAR_POL_kpp_pol: "Purge of the Revisionists"
 COLDWAR_POL_kpp_pol_desc: "The Central Committee is cleared of Gomulka's men and Gierek's technocrats. Loyal workers and the security organs get the files; the apparatus gets the cellars."
 COLDWAR_POL_kpp_x1: "The Four Modernisations"
 COLDWAR_POL_kpp_x1_desc: "If Beijing turns to modernisation, Mijal will follow from his exile in China. The factories may learn from foreign machines after all."
 COLDWAR_POL_kpp_x1_tb: "The Four Modernisations"
 COLDWAR_POL_kpp_x2: "Hoxha's Isolation"
 COLDWAR_POL_kpp_x2_desc: "Albania breaks with China and builds bunkers. Warsaw's loyalists draw the conclusion that only a closed country is a pure one."
 COLDWAR_POL_kpp_x2_tb: "Hoxha's Isolation"
 COLDWAR_POL_kresy_claim: "The Borders of 1939"
 COLDWAR_POL_kresy_claim_desc: "The Treaty of Riga line is the only lawful frontier, whoever occupies Lwow and Wilno. The exiles do not trade the property of the nation for a favour, and the neighbours take note.\n\n§gLapses while neither the Government-in-Exile nor Kultura governs, and returns when one of them does.§!"
 COLDWAR_POL_kulaj: "Jan Kulaj"
 COLDWAR_POL_kuron: "Jacek Kuron"
 COLDWAR_POL_land_for_farmers: "Land for the Farmers"
 COLDWAR_POL_land_for_farmers_desc: "The land a farmer tills is his by law, and the state bank lends him money for a tractor and guarantees him a pension in his old age. In the village the portrait on the wall is slowly replaced by a calendar from the cooperative."
 COLDWAR_POL_lesser_evil_settlement: "Order Restored, Dialogue Opened"
 COLDWAR_POL_lesser_evil_settlement_desc: "The shipyards work, the Church speaks and the generals have given back more than they took. Poland is calm and its army sits in its barracks, though few believe it will stay there for ever. Everyone calls it the lesser evil, and many mean it.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_licence_economy: "The Licence Economy"
 COLDWAR_POL_licence_economy_desc: "Western licences and credits replace Gomulka's autarky. Fiat engines hum in Bielsko-Biala, and shop windows in Warsaw show goods bought on other people's money. The bankers of Frankfurt and Paris are happy to lend to a state that has never missed a payment.\n\n§gPoland's economic model: adopting another model replaces it.§!"
 COLDWAR_POL_lipski: "Jan Jozef Lipski"
 COLDWAR_POL_loyal_catholic_alternative: "A Loyal Catholic Alternative"
 COLDWAR_POL_loyal_catholic_alternative_desc: "A Catholic association in the Sejm, in the press and in the shops tells the faithful that one may be devout, patriotic and loyal at once. Many believers prefer to hear this from the Primate.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_loyal_ministry: "The Interior Ministry Re-Staffed"
 COLDWAR_POL_loyal_ministry_desc: "At the Ministry of Internal Affairs the corridors are staffed by men who owe their desks to the First Secretary. The Security Service, its files and its informers answer to one man now and no longer to a faction.\n\n§gLapses while the Central Committee is out of power and returns when it governs again.§!"
 COLDWAR_POL_malinowski: "Roman Malinowski"
 COLDWAR_POL_market_reform: "The Market Programme"
 COLDWAR_POL_market_reform_desc: "Free prices, a convertible zloty and firms that live or die by their accounts. Queues shorten, the first bankrupt factory shuts its gates, and economists argue in the newspapers about whether this is justice or shock.\n\n§gPoland's economic model: adopting another model replaces it.§!"
 COLDWAR_POL_mass_labour_brigades: "Labour Brigades"
 COLDWAR_POL_mass_labour_brigades_desc: "On Saturday mornings brigades of students, soldiers and factory shifts turn out with shovels and trowels to build schools, roads and housing outside the plan. Loudspeakers play marches, and the foremen quietly count how many came of their own will.\n\n§gPoland's economic model: adopting another model replaces it.§!"
 COLDWAR_POL_mazowiecki: "Tadeusz Mazowiecki"
 COLDWAR_POL_meat_question_1: "The Meat Question"
 COLDWAR_POL_meat_question_1_desc: "The butcher's window on a Lodz housing estate shows one tray of bones and lard, and the queue starts before dawn. Pork is priced low enough for a pensioner's purse, so every plan to charge its true cost ends with a crowd outside a Party committee.\n\n§gPrice reform, feed imports and better farm policy ease it; shelving the price list deepens it.§!"
 COLDWAR_POL_meat_question_2: "The Meat Question (Feed Imports)"
 COLDWAR_POL_meat_question_2_desc: "Feed grain comes in through Gdansk and Szczecin, and the pig farms of Greater Poland begin to fill their troughs again. Sausage appears on the counter by Friday, still rationed by the length of the line. The housewife is cautious, for she has seen this before.\n\n§gFurther feed imports and farm support ease it; neglect brings it back.§!"
 COLDWAR_POL_meat_question_3: "The Meat Question (Easing)"
 COLDWAR_POL_meat_question_3_desc: "Meat is on the counter most mornings now, and the shop assistant even smiles. Shoppers still buy twice what they need, because they remember the empty hooks. The Party counts the quiet as a victory and the mothers count the coupons they no longer need.\n\n§gKeeping up reform and farm support removes it; backsliding brings it back.§!"
 COLDWAR_POL_meters_category: "Warsaw and the Nation"
 COLDWAR_POL_meters_category_desc: "Western Debt: §Y[?COLDWAR_POL_debt|0]§! of 100. Every Western credit builds a factory today and a repayment tomorrow. The banks lend gladly while the plan grows, and less gladly once the interest outruns the exports. From 25 Serviced Debt, from 50 The Debt Trap (the debt grows by 0.5 and Social Discontent by 0.5 every month), from 75 Rescheduling. Western sanctions on Poland add 1 a month; coal and copper exports each remove 0.25 a month.\nSocial Discontent: §Y[?COLDWAR_POL_unrest|0]§! of 100. Prices, queues and broken promises gather quietly in the shipyards and the mills. When the anger spills over, it does so all at once, and the street remembers every December. From 40 Grumbling Queues, from 60 the Strike Wave (KOR and Solidarity gain 0.5% popularity every month), from 80 the General Strike (the gain goes on). The Meat Question adds 0.5 a month at its first stage; stability above 60% removes 0.5 a month.\nThe Brezhnev Doctrine stands at one of six stages. At the last stage the Soviet Union may decide on fraternal assistance."
 COLDWAR_POL_mijal: "Kazimierz Mijal"
 COLDWAR_POL_militarised_economy: "The Militarised Economy"
 COLDWAR_POL_militarised_economy_desc: "Mines, railways and ports run to military timetables, with colonels in the directors' offices and reservists in the pit cages. Plans arrive as orders, and fulfilment is reported up the same chain of command.\n\n§gPoland's economic model: adopting another model replaces it.§!"
 COLDWAR_POL_mlynczak: "Tadeusz Mlynczak"
 COLDWAR_POL_moczar: "Mieczyslaw Moczar"
 COLDWAR_POL_moczar_a1: "The Purge Goes On"
 COLDWAR_POL_moczar_a1_desc: "The anti-Zionist slogans of 1968 were a pretext, yet dismissals of 'doubtful' officers, editors and professors continue and the families keep leaving. The ministry's files gain; the laboratories and the foreign press take note."
 COLDWAR_POL_moczar_a1f: "The Veterans' Placement Office"
 COLDWAR_POL_moczar_a1f_desc: "Veterans are placed in ministries, directorates and editorial offices ahead of better qualified applicants. The offices grow loyal, slow and crowded."
 COLDWAR_POL_moczar_a2: "Call the Professors Back"
 COLDWAR_POL_moczar_a2_desc: "The General quietly admits the campaign cost the nation its best chemists and historians, and some may return to reopened chairs. The veterans' hard men call it weakness."
 COLDWAR_POL_moczar_a2f: "Historians of the Resistance"
 COLDWAR_POL_moczar_a2f_desc: "Archives open to historians who write the story of the resistance in full, Home Army included. The Party loses its monopoly on the past and gains a better educated public."
 COLDWAR_POL_moczar_b1: "The National Economy"
 COLDWAR_POL_moczar_b1_desc: "Poland will build its own steel, its own guns and its own tractors with Polish veterans and soldiers at the head of the works. Moscow reads 'our own' as 'not yours'."
 COLDWAR_POL_moczar_b1f: "Arms Works of the Nation"
 COLDWAR_POL_moczar_b1f_desc: "New lines of rifles, trucks and armoured carriers are laid out in Lodz and the south. Every part is made at home and checked by a veteran officer."
 COLDWAR_POL_moczar_b1f_tb: "Arms Works of the Nation"
 COLDWAR_POL_moczar_b2: "Order and Discipline"
 COLDWAR_POL_moczar_b2_desc: "Late arrivals, absences and drink are punished by dismissal, and the veterans' guards stand at the gates of every plant. Output rises and so does resentment."
 COLDWAR_POL_moczar_b2f: "The Work Book and the Labour Court"
 COLDWAR_POL_moczar_b2f_desc: "A work book follows each worker from job to job and comrade courts sit in the plants. Directors get a docile workforce, the workers get a record to fear."
 COLDWAR_POL_moczar_c1: "The Chamber of Control"
 COLDWAR_POL_moczar_c1_desc: "Moczar chairs the Supreme Chamber of Control, whose inspectors audit every ministry. The press prints the scandals and the apparatus learns to fear a general with a notebook."
 COLDWAR_POL_moczar_c2: "Provincial Party Forums"
 COLDWAR_POL_moczar_c2_desc: "Hardliners in the voivodeship committees meet outside the Politburo's control and pass resolutions against 'liberalism'. Moscow wonders whether Warsaw has two Parties."
 COLDWAR_POL_moczar_cap: "The Endo-Communist State"
 COLDWAR_POL_moczar_cap_desc: "A Poland of flags, uniforms and veterans' parades, distrustful of Moscow and Washington alike. The state is strong and proud, its universities are quiet, and both blocs are watching."
 COLDWAR_POL_moczar_cm: "Veterans' Privileges"
 COLDWAR_POL_moczar_cm_desc: "Veterans receive priority flats, pensions and holiday places. The grateful man in uniform guards the system, and the civilian next in the queue notes his name on the list."
 COLDWAR_POL_moczar_cm_tb: "Veterans' Privileges"
 COLDWAR_POL_moczar_d1: "Neither Moscow Nor Bonn"
 COLDWAR_POL_moczar_d1_desc: "Warsaw will not take orders from the Kremlin or give in to the Federal Republic. The Polish road to socialism is spoken of aloud, and both blocs grow nervous."
 COLDWAR_POL_moczar_d2: "Prove Loyalty on the Border"
 COLDWAR_POL_moczar_d2_desc: "Polish divisions join Pact manoeuvres on the German and Czech frontiers, with Moczar's officers in the front rank. Nobody can say the Partisans are disloyal, and the patriots at home mutter."
 COLDWAR_POL_moczar_d2_dr: "Prove Loyalty on the Border"
 COLDWAR_POL_moczar_dm: "Arms Export Contracts"
 COLDWAR_POL_moczar_dm_desc: "Polish tanks, trucks and ammunition go to Arab states, Vietnam and Africa for hard currency. The buyers pay and the neighbours remember the sellers."
 COLDWAR_POL_moczar_dm_tb: "Arms Export Contracts"
 COLDWAR_POL_moczar_e: "The Veterans' Association"
 COLDWAR_POL_moczar_e_desc: "General Moczar speaks for the old fighters of the People's Guard and the partisan units. Hundreds of thousands of veterans have a banner, a pension and a leader who is not Moscow's choice."
 COLDWAR_POL_moczar_eco: "The Veterans' Cooperatives"
 COLDWAR_POL_moczar_eco_desc: "Cooperatives run by veterans win building quotas, scarce materials and the best managers' posts. Friends of the General are never short of cement."
 COLDWAR_POL_moczar_em: "The Veterans' Enterprises"
 COLDWAR_POL_moczar_em_desc: "State firms owned by veterans' funds employ ex-soldiers and sell for hard currency without a Western loan. Foreign bankers are not invited to the opening."
 COLDWAR_POL_moczar_em_tb: "The Veterans' Enterprises"
 COLDWAR_POL_moczar_pm: "The Veterans' Congress"
 COLDWAR_POL_moczar_pm_desc: "Thousands of veterans in uniform fill the congress hall in Warsaw. The Politburo watches to see how many hands rise when Moczar speaks."
 COLDWAR_POL_moczar_pol: "A Thousand Years of Poland"
 COLDWAR_POL_moczar_pol_desc: "Grunwald, the Piast kings and the Recovered Territories replace the Internationale in the school books and on the radio. Poland is told it is a nation first and a socialist state second, and the Church is told whose nation it is."
 COLDWAR_POL_moczar_x1: "Olszowski's Order"
 COLDWAR_POL_moczar_x1_desc: "Stefan Olszowski, a Politburo hardliner, speaks for the strong hand. He promises discipline in the factories and fewer concessions to any union."
 COLDWAR_POL_moczar_x2: "Grabski and the Katowice Forum"
 COLDWAR_POL_moczar_x2_desc: "Tadeusz Grabski and the Katowice hardliners denounce every compromise and appeal to Moscow's fears. Their Poland is loyal, orthodox and tightly held."
 COLDWAR_POL_moczulski: "Leszek Moczulski"
 COLDWAR_POL_modern_pits: "The Modernised Pits"
 COLDWAR_POL_modern_pits_desc: "Longwall shearers and steel roof supports reach the coal faces of Silesia, and new shafts are cut with air a miner can breathe. Output rises, and fewer names are read out at the pithead on St Barbara's Day."
 COLDWAR_POL_moskwa: "Zygmunt Moskwa"
 COLDWAR_POL_national_economy: "The National Economy"
 COLDWAR_POL_national_economy_desc: "Industry is built at home by Polish hands for the Polish nation, and old soldiers and veterans are first in line for the directors' chairs. Foundries run on national pride, and the plan is written in the language of the homeland.\n\n§gPoland's economic model: adopting another model replaces it.§!"
 COLDWAR_POL_nine_days_of_prayer: "Nine Days of Prayer"
 COLDWAR_POL_nine_days_of_prayer_desc: "A Polish pope kisses the soil at Warsaw airport, and for nine days millions line the roads and fill the fields. Not a single policeman is needed, and the whole nation sees itself at once."
 COLDWAR_POL_nixon_trade: "The Joint Trade Commission"
 COLDWAR_POL_nixon_trade_desc: "Nixon lands in Warsaw to a warm welcome, and a joint commission to arrange trade is created. Washington wants a bridge to the Eastern bloc and a market for American farmers, and Warsaw wants dollars.\n\n§gAgreement with the United States: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_nixon_trade_partner: "The Joint Trade Commission"
 COLDWAR_POL_nixon_trade_partner_desc: "President Nixon travels to Warsaw after Moscow and agrees a commission for trade with Poland. American farmers and bankers look at a market of more than thirty million, and the State Department sees a bridge to the East.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_no_direction_tt: "No other political direction has been chosen since the last change of government"
 COLDWAR_POL_no_sanction_tt: "No Western sanction lies on Poland"
 COLDWAR_POL_offer_accept_algeria_engineering: "Accept: Engineers and Doctors for Algeria"
 COLDWAR_POL_offer_accept_algeria_engineering_desc: "Algiers hires Polish specialists for its industrial plan."
 COLDWAR_POL_offer_accept_arms_libya: "Accept: Arms and Builders for Libya"
 COLDWAR_POL_offer_accept_arms_libya_desc: "Tripoli pays in oil money for tanks, shells and housing blocks."
 COLDWAR_POL_offer_accept_bonn_package: "Accept: The Bonn Package"
 COLDWAR_POL_offer_accept_bonn_package_desc: "Bonn buys the right of families to be reunited, and pays in hard currency."
 COLDWAR_POL_offer_accept_bucharest_oil: "Accept: Oil at the Bucharest Formula"
 COLDWAR_POL_offer_accept_bucharest_oil_desc: "Cheap oil keeps a loyal neighbour's industry running and its debt in roubles."
 COLDWAR_POL_offer_accept_casaroli_commission: "Accept: Casaroli's Working Group"
 COLDWAR_POL_offer_accept_casaroli_commission_desc: "Monsignor Casaroli's patient diplomacy exchanges church space for civil peace."
 COLDWAR_POL_offer_accept_ccc_grain: "Accept: CCC Grain Credits"
 COLDWAR_POL_offer_accept_ccc_grain_desc: "American farmers sell grain on credit; Polish herds get feed."
 COLDWAR_POL_offer_accept_china_protocol: "Accept: The Beijing Trade Protocol"
 COLDWAR_POL_offer_accept_china_protocol_desc: "Beijing wants Polish ships and machines, and a friend inside Moscow's bloc."
 COLDWAR_POL_offer_accept_coal_for_credit: "Accept: Credit for Coal, No Emigrants"
 COLDWAR_POL_offer_accept_coal_for_credit_desc: "Bonn will lend against coal if Warsaw will not release its Germans."
 COLDWAR_POL_offer_accept_coal_for_machines: "Accept: Silesian Coal for Berlin Machines"
 COLDWAR_POL_offer_accept_coal_for_machines_desc: "The GDR needs black coal; Poland needs precision machines."
 COLDWAR_POL_offer_accept_czech_machines: "Accept: Czechoslovak Machine Tools and Trams"
 COLDWAR_POL_offer_accept_czech_machines_desc: "Prague sells the machines its engineers have long perfected."
 COLDWAR_POL_offer_accept_diplomatic_relations: "Accept: Diplomatic Relations Restored"
 COLDWAR_POL_offer_accept_diplomatic_relations_desc: "Rome and Warsaw exchange nuncio and ambassador after forty years."
 COLDWAR_POL_offer_accept_fiat_licence: "Accept: Fiat Licence Repaid in Cars"
 COLDWAR_POL_offer_accept_fiat_licence_desc: "Turin sells a factory and takes the cars it builds."
 COLDWAR_POL_offer_accept_french_protocol: "Accept: The French Credit Protocol"
 COLDWAR_POL_offer_accept_french_protocol_desc: "Paris lends to a former miner of Lens and sells Poland French factories."
 COLDWAR_POL_offer_accept_german_banks: "Accept: The Syndicated Bank Credit"
 COLDWAR_POL_offer_accept_german_banks_desc: "Frankfurt's banks lend to a planned economy that never defaults."
 COLDWAR_POL_offer_accept_giscard_accord: "Accept: Giscard's Coal and Cooperation Accord"
 COLDWAR_POL_offer_accept_giscard_accord_desc: "France buys Polish coal and sells Polish industry a decade of credit."
 COLDWAR_POL_offer_accept_harvester_gm: "Accept: Harvester and General Motors Licences"
 COLDWAR_POL_offer_accept_harvester_gm_desc: "American companies sell know-how for Polish hard currency."
 COLDWAR_POL_offer_accept_iccs_vietnam: "Accept: The ICCS Mission in Vietnam"
 COLDWAR_POL_offer_accept_iccs_vietnam_desc: "Hanoi gets a friendly pair of eyes on the ceasefire, and Warsaw a seat at a great-power table."
 COLDWAR_POL_offer_accept_ikarus_buses: "Accept: Ikarus Buses and Hungarian Know-How"
 COLDWAR_POL_offer_accept_ikarus_buses_desc: "Budapest sells buses and shows how a small farm can feed a town."
 COLDWAR_POL_offer_accept_iraq_contracts: "Accept: Polish Contractors in Iraq"
 COLDWAR_POL_offer_accept_iraq_contracts_desc: "Baghdad hires Polish builders for roads and housing, and pays in dollars."
 COLDWAR_POL_offer_accept_nixon_trade: "Accept: The Joint Trade Commission"
 COLDWAR_POL_offer_accept_nixon_trade_desc: "Washington wants a bridge to the Eastern bloc and a market for American farmers."
 COLDWAR_POL_offer_accept_papal_invitation: "Accept: An Invitation to the Pope"
 COLDWAR_POL_offer_accept_papal_invitation_desc: "The Primate wishes to receive a pope on Polish soil, as the Millennium of 1966 promised."
 COLDWAR_POL_offer_accept_paris_club: "Accept: The Paris Club Rescheduling"
 COLDWAR_POL_offer_accept_paris_club_desc: "Creditors prefer a rescheduled Poland to a bankrupt one."
 COLDWAR_POL_offer_accept_perkins_engines: "Accept: Perkins Engines for Ursus"
 COLDWAR_POL_offer_accept_perkins_engines_desc: "British engine makers sell licences for Poland's tractor factory."
 COLDWAR_POL_offer_accept_pl480_deferral: "Accept: The PL 480 Deferral"
 COLDWAR_POL_offer_accept_pl480_deferral_desc: "Washington lets old farm-aid debts wait so that new grain can be bought."
 COLDWAR_POL_offer_accept_rouble_rescheduling: "Accept: The Rouble Rescheduling"
 COLDWAR_POL_offer_accept_rouble_rescheduling_desc: "Moscow keeps its ally solvent and keeps its leverage."
 COLDWAR_POL_offer_accept_ships_for_fleet: "Accept: Ships for the Soviet Fleet"
 COLDWAR_POL_offer_accept_ships_for_fleet_desc: "Poland's yards build for the whole bloc, and the Soviet navy gets landing ships it does not have to build itself."
 COLDWAR_POL_offer_accept_soyuz_gas: "Accept: Soyuz Gas for Polish Labour"
 COLDWAR_POL_offer_accept_soyuz_gas_desc: "Polish crews lay a stretch of the great pipeline and are paid in gas."
 COLDWAR_POL_offer_accept_sugar_for_ships: "Accept: Sugar for Ships and Tractors"
 COLDWAR_POL_offer_accept_sugar_for_ships_desc: "Havana pays in sugar for Polish ships and tractors."
 COLDWAR_POL_offer_accept_textbook_commission: "Accept: The Textbook Commission"
 COLDWAR_POL_offer_accept_textbook_commission_desc: "Historians of both nations meet to remove the old hatreds from school books."
 COLDWAR_POL_offer_accept_visa_free_gdr: "Accept: Visa-Free Travel with the GDR"
 COLDWAR_POL_offer_accept_visa_free_gdr_desc: "A million Poles and East Germans cross the Oder each year to shop, visit and sell."
 COLDWAR_POL_offer_accept_warsaw_treaty: "Accept: The Warsaw Treaty"
 COLDWAR_POL_offer_accept_warsaw_treaty_desc: "Bonn closes the frontier question for good, recognises the Oder-Neisse line and gets a calmer east."
 COLDWAR_POL_offer_accept_western_dioceses: "Accept: Bishops for the Western Territories"
 COLDWAR_POL_offer_accept_western_dioceses_desc: "Rome recognises the frontier in church law and Warsaw gets regular Polish bishops in the west."
 COLDWAR_POL_offer_cancel_algeria_engineering: "Terminate: Engineers and Doctors for Algeria"
 COLDWAR_POL_offer_cancel_algeria_engineering_desc: "We withdraw from the agreement. Payments already made are not refunded; running repayments continue."
 COLDWAR_POL_offer_cancel_arms_libya: "Terminate: Arms and Builders for Libya"
 COLDWAR_POL_offer_cancel_arms_libya_desc: "We withdraw from the agreement. Payments already made are not refunded; running repayments continue."
