 COLDWAR_POL_peasant_commonwealth: "The Peasant Commonwealth"
 COLDWAR_POL_peasant_commonwealth_desc: "The countryside has electricity, paved roads and a farmer who votes for his own party. Poland feeds itself, the cooperative store sells good boots, and the cities have learned, at last, to say thank you to the villages that feed them.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_perkins_engines: "Perkins Engines for Ursus"
 COLDWAR_POL_perkins_engines_desc: "British engine makers sell licences for Poland's tractor factory. Perkins diesels and Massey Ferguson designs move onto the lines at Ursus, and Polish farmers get machines that a village mechanic can service.\n\n§gAgreement with the United Kingdom: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_perkins_engines_partner: "Perkins Engines for Ursus"
 COLDWAR_POL_perkins_engines_partner_desc: "British makers license diesels and tractors to the Ursus works, and engineers from Coventry and Peterborough pack their bags for Warsaw. The export order is welcome in a country short of them.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_piasecki: "Boleslaw Piasecki"
 COLDWAR_POL_pilgrimage_tt: "If Poland accepts: we gain §G5§! political power."
 COLDWAR_POL_pl480_deferral: "The PL 480 Deferral"
 COLDWAR_POL_pl480_deferral_desc: "Washington lets the old farm-aid debts wait so that new grain can be bought. The repayment schedule is pushed back in a letter that reaches the finance ministry, and the flour keeps coming.\n\n§gAgreement with the United States: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_pl480_deferral_partner: "The PL 480 Deferral"
 COLDWAR_POL_pl480_deferral_partner_desc: "The Treasury and the Department of Agriculture agree to postpone Polish repayments on farm-aid credits so that new grain may be bought. It is better, officials reason, to have a debtor who can still eat.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_plan_and_credit_tree_shortcut: "Plan and Credit"
 COLDWAR_POL_polish_road_steady: "The Polish Road, Kept Steady"
 COLDWAR_POL_polish_road_steady_desc: "A decade without a debt, a revolt or a Soviet reproach. Nothing glitters and nothing is lost: the trams run, the pensions arrive, and the Party secretary gives the same speech each May. But wages stand still, and the young begin to look abroad.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_polonia_programme_tt: "Poland keeps its §YOverseas Employment Programme§!: the Ministry of Labour Abroad counts the Polonia, and the remittances of every Pole who leaves under an agreement flow into the weekly budget."
 COLDWAR_POL_power_church: "A Government of National Trust"
 COLDWAR_POL_power_church_desc: "Invite the Episcopate to name a government the nation will accept."
 COLDWAR_POL_power_exile: "The Return of the Seals"
 COLDWAR_POL_power_exile_desc: "Recognise the London government as the lawful continuation of the Republic and invite its President home."
 COLDWAR_POL_power_gierek: "The Silesian Takes Over"
 COLDWAR_POL_power_gierek_desc: "Bring Edward Gierek from Katowice to the Central Committee."
 COLDWAR_POL_power_gomulka: "Comrade Wieslaw's Mandate"
 COLDWAR_POL_power_gomulka_desc: "Return the leadership to the Central Committee centre of Gomulka and his heirs."
 COLDWAR_POL_power_jaruz: "The General Steps In"
 COLDWAR_POL_power_jaruz_desc: "Entrust the state to General Jaruzelski and the officer corps."
 COLDWAR_POL_power_kpn: "Power to the Confederation"
 COLDWAR_POL_power_kpn_desc: "Let Moczulski's Confederation of Independent Poland form a government of independence."
 COLDWAR_POL_power_kpp: "Power to the Orthodox"
 COLDWAR_POL_power_kpp_desc: "Hand the Party to Mijal's anti-revisionist communists."
 COLDWAR_POL_power_moczar: "The Partisans' Hour"
 COLDWAR_POL_power_moczar_desc: "Make General Moczar First Secretary."
 COLDWAR_POL_power_not_ruling_tt: "This party is not already in government"
 COLDWAR_POL_power_pax: "Power to PAX"
 COLDWAR_POL_power_pax_desc: "Let Piasecki's PAX Association form a national Catholic government."
 COLDWAR_POL_power_pps: "Power to the Socialists"
 COLDWAR_POL_power_pps_desc: "Revive the Polish Socialist Party of Daszynski and Pilsudski as the governing party."
 COLDWAR_POL_power_sd: "Power to the Democrats"
 COLDWAR_POL_power_sd_desc: "Let the Democratic Party of the craftsmen and the intelligentsia lead the coalition."
 COLDWAR_POL_power_solid: "Power to the Workers' Movement"
 COLDWAR_POL_power_solid_desc: "Let the workers' and students' committees form a government of their own."
 COLDWAR_POL_power_znak: "Power to Znak"
 COLDWAR_POL_power_znak_desc: "Form a government around the Catholic deputies of Znak."
 COLDWAR_POL_power_zsl: "Power to the Countryside"
 COLDWAR_POL_power_zsl_desc: "Let the peasant party govern in its own name for the first time since 1947."
 COLDWAR_POL_pps_a1: "Independence Before Class"
 COLDWAR_POL_pps_a1_desc: "Pilsudski left the red tram at the Independence stop. Poland first, social reform within a free state: a line that wins officers, costs the class-first workers and sets the neighbour's teeth on edge."
 COLDWAR_POL_pps_a2: "The Socialist International Line"
 COLDWAR_POL_pps_a2_desc: "Brandt in Bonn, Kreisky in Vienna and Palme in Stockholm show that socialism can come with free elections. The Party takes its place at their table and takes their advice and their money."
 COLDWAR_POL_pps_a2_tb: "The Socialist International Line"
 COLDWAR_POL_pps_b1: "Cooperative Socialism"
 COLDWAR_POL_pps_b1_desc: "Let the village and the housing estate own their dairies, shops and bakeries together. Meat can reach the counter by a cooperative route, though members' committees will be slower than the ministry."
 COLDWAR_POL_pps_b2: "The Welfare Republic"
 COLDWAR_POL_pps_b2_desc: "Sickness insurance, pensions and the eight-hour day for everyone, paid from taxation. A rich state could pay for it; a poor one will have to borrow."
 COLDWAR_POL_pps_cap: "The Social Republic"
 COLDWAR_POL_pps_cap_desc: "Cooperatives, free unions and a state that insures its citizens against sickness and age: the Republic of 1892 stands in a Poland that exists, and the Party apparatus has been asked to make room for it."
 COLDWAR_POL_pps_e: "The Party Returns from Exile"
 COLDWAR_POL_pps_e_desc: "The old party of Pilsudski and Daszynski survives in London and Paris, a Socialist International member without a country. Now it is asked to take responsibility for one."
 COLDWAR_POL_pps_eco: "The Cooperative Tradition"
 COLDWAR_POL_pps_eco_desc: "Shops, dairies and housing run by their members, not by the ministry or the landlord: a third way between the plan and the market, taught by Abramowski to three generations."
 COLDWAR_POL_pps_eco_tb: "The Cooperative Tradition"
 COLDWAR_POL_pps_em: "The Workers' Housing Cooperative"
 COLDWAR_POL_pps_em_desc: "A flat in a cooperative block, paid by members over twenty years, is the Party's answer to the eleven-year queue. Workers lay the bricks of their own estates."
 COLDWAR_POL_pps_em_tb: "The Workers' Housing Cooperative"
 COLDWAR_POL_pps_pm: "The Lipski Revival"
 COLDWAR_POL_pps_pm_desc: "A KOR founder returns to the Party of his youth and opens its doors in Warsaw. The old exiles and the young workers sit in the same room for the first time in forty years."
 COLDWAR_POL_pps_pm_tb: "The Lipski Revival"
 COLDWAR_POL_pps_pol: "Pilsudski and Daszynski"
 COLDWAR_POL_pps_pol_desc: "An independent democratic republic, universal suffrage, the eight-hour day: the programme of 1892 has not been fulfilled, and the Party that wrote it says so."
 COLDWAR_POL_pps_x1: "A Senate Seat for Lipski"
 COLDWAR_POL_pps_x1_desc: "The Party stands in the open Senate election as ally of the Citizens' Committees. Its old men are applauded and its young ones ask why they must stand behind them."
 COLDWAR_POL_pps_x1_tb: "A Senate Seat for Lipski"
 COLDWAR_POL_pps_x2: "The Democratic Left"
 COLDWAR_POL_pps_x2_desc: "A workers' party that speaks for the strikers, not for the ministers. It refuses the market shock and the Party's last offer alike."
 COLDWAR_POL_pps_x2_tb: "The Democratic Left"
 COLDWAR_POL_prices_freeze: "Shelve the Price List"
 COLDWAR_POL_prices_freeze_desc: "The coast is restless and the price list can wait another year. The subsidies will eat the investment budget, and the next price rise will be steeper."
 COLDWAR_POL_prices_raise: "Publish the New Price List"
 COLDWAR_POL_prices_raise_desc: "Meat, flour and coal must cost what they cost to produce, or the plan has no money for machines. The Politburo will announce the rise on the twelfth of December, two weeks before Christmas."
 COLDWAR_POL_prisoners_released_tt: "Poland has released its political prisoners"
