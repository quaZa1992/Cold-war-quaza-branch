l_english:
 # IMPERIA COLD WAR — Poland 1970 (generated by pol_build.py)
 COLDWAR_POL.101.a: "We will study the terms."
 COLDWAR_POL.101.d: "The government in Warsaw proposes a standing agreement: Soyuz Gas for Polish Labour. Polish crews lay a stretch of the great pipeline and are paid in gas. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.101.t: "Soyuz Gas for Polish Labour"
 COLDWAR_POL.102.a: "We will study the terms."
 COLDWAR_POL.102.d: "The government in Warsaw proposes a standing agreement: Oil at the Bucharest Formula. Cheap oil keeps a loyal neighbour's industry running and its debt in roubles. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.102.t: "Oil at the Bucharest Formula"
 COLDWAR_POL.103.a: "We will study the terms."
 COLDWAR_POL.103.d: "The government in Warsaw proposes a standing agreement: Ships for the Soviet Fleet. Poland's yards build for the whole bloc, and the Soviet navy gets landing ships it does not have to build itself. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.103.t: "Ships for the Soviet Fleet"
 COLDWAR_POL.104.a: "We will study the terms."
 COLDWAR_POL.104.d: "The government in Warsaw proposes a standing agreement: The Rouble Rescheduling. Moscow keeps its ally solvent and keeps its leverage. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.104.t: "The Rouble Rescheduling"
 COLDWAR_POL.105.a: "We will study the terms."
 COLDWAR_POL.105.d: "The government in Warsaw proposes a standing agreement: Visa-Free Travel with the GDR. A million Poles and East Germans cross the Oder each year to shop, visit and sell. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.105.t: "Visa-Free Travel with the GDR"
 COLDWAR_POL.106.a: "We will study the terms."
 COLDWAR_POL.106.d: "The government in Warsaw proposes a standing agreement: Silesian Coal for Berlin Machines. The GDR needs black coal; Poland needs precision machines. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.106.t: "Silesian Coal for Berlin Machines"
 COLDWAR_POL.107.a: "We will study the terms."
 COLDWAR_POL.107.d: "The government in Warsaw proposes a standing agreement: Czechoslovak Machine Tools and Trams. Prague sells the machines its engineers have long perfected. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.107.t: "Czechoslovak Machine Tools and Trams"
 COLDWAR_POL.108.a: "We will study the terms."
 COLDWAR_POL.108.d: "The government in Warsaw proposes a standing agreement: Ikarus Buses and Hungarian Know-How. Budapest sells buses and shows how a small farm can feed a town. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.108.t: "Ikarus Buses and Hungarian Know-How"
 COLDWAR_POL.109.a: "We will study the terms."
 COLDWAR_POL.109.d: "The government in Warsaw proposes a standing agreement: The ICCS Mission in Vietnam. Hanoi gets a friendly pair of eyes on the ceasefire, and Warsaw a seat at a great-power table. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.109.t: "The ICCS Mission in Vietnam"
 COLDWAR_POL.110.a: "We will study the terms."
 COLDWAR_POL.110.d: "The government in Warsaw proposes a standing agreement: Sugar for Ships and Tractors. Havana pays in sugar for Polish ships and tractors. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.110.t: "Sugar for Ships and Tractors"
 COLDWAR_POL.111.a: "We will study the terms."
 COLDWAR_POL.111.d: "The government in Warsaw proposes a standing agreement: The Beijing Trade Protocol. Beijing wants Polish ships and machines, and a friend inside Moscow's bloc. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.111.t: "The Beijing Trade Protocol"
 COLDWAR_POL.112.a: "We will study the terms."
 COLDWAR_POL.112.d: "The government in Warsaw proposes a standing agreement: Arms and Builders for Libya. Tripoli pays in oil money for tanks, shells and housing blocks. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.112.t: "Arms and Builders for Libya"
 COLDWAR_POL.113.a: "We will study the terms."
 COLDWAR_POL.113.d: "The government in Warsaw proposes a standing agreement: Polish Contractors in Iraq. Baghdad hires Polish builders for roads and housing, and pays in dollars. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.113.t: "Polish Contractors in Iraq"
 COLDWAR_POL.114.a: "We will study the terms."
 COLDWAR_POL.114.d: "The government in Warsaw proposes a standing agreement: Engineers and Doctors for Algeria. Algiers hires Polish specialists for its industrial plan. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.114.t: "Engineers and Doctors for Algeria"
 COLDWAR_POL.115.a: "We will study the terms."
 COLDWAR_POL.115.d: "The government in Warsaw proposes a standing agreement: The Warsaw Treaty. Bonn closes the frontier question for good, recognises the Oder-Neisse line and gets a calmer east. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.115.t: "The Warsaw Treaty"
 COLDWAR_POL.116.a: "We will study the terms."
 COLDWAR_POL.116.d: "The government in Warsaw proposes a standing agreement: The Textbook Commission. Historians of both nations meet to remove the old hatreds from school books. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.116.t: "The Textbook Commission"
 COLDWAR_POL.117.a: "We will study the terms."
 COLDWAR_POL.117.d: "The government in Warsaw proposes a standing agreement: The Bonn Package. Bonn buys the right of families to be reunited, and pays in hard currency. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.117.t: "The Bonn Package"
 COLDWAR_POL.118.a: "We will study the terms."
 COLDWAR_POL.118.d: "The government in Warsaw proposes a standing agreement: Credit for Coal, No Emigrants. Bonn will lend against coal if Warsaw will not release its Germans. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.118.t: "Credit for Coal, No Emigrants"
 COLDWAR_POL.119.a: "We will study the terms."
 COLDWAR_POL.119.d: "The government in Warsaw proposes a standing agreement: The Syndicated Bank Credit. Frankfurt's banks lend to a planned economy that never defaults. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.119.t: "The Syndicated Bank Credit"
 COLDWAR_POL.120.a: "We will study the terms."
 COLDWAR_POL.120.d: "The government in Warsaw proposes a standing agreement: The Joint Trade Commission. Washington wants a bridge to the Eastern bloc and a market for American farmers. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.120.t: "The Joint Trade Commission"
 COLDWAR_POL.121.a: "We will study the terms."
 COLDWAR_POL.121.d: "The government in Warsaw proposes a standing agreement: CCC Grain Credits. American farmers sell grain on credit; Polish herds get feed. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.121.t: "CCC Grain Credits"
 COLDWAR_POL.122.a: "We will study the terms."
 COLDWAR_POL.122.d: "The government in Warsaw proposes a standing agreement: Harvester and General Motors Licences. American companies sell know-how for Polish hard currency. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.122.t: "Harvester and General Motors Licences"
 COLDWAR_POL.123.a: "We will study the terms."
 COLDWAR_POL.123.d: "The government in Warsaw proposes a standing agreement: The PL 480 Deferral. Washington lets old farm-aid debts wait so that new grain can be bought. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.123.t: "The PL 480 Deferral"
 COLDWAR_POL.124.a: "We will study the terms."
 COLDWAR_POL.124.d: "The government in Warsaw proposes a standing agreement: Fiat Licence Repaid in Cars. Turin sells a factory and takes the cars it builds. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.124.t: "Fiat Licence Repaid in Cars"
 COLDWAR_POL.125.a: "We will study the terms."
 COLDWAR_POL.125.d: "The government in Warsaw proposes a standing agreement: The French Credit Protocol. Paris lends to a former miner of Lens and sells Poland French factories. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.125.t: "The French Credit Protocol"
 COLDWAR_POL.126.a: "We will study the terms."
 COLDWAR_POL.126.d: "The government in Warsaw proposes a standing agreement: Giscard's Coal and Cooperation Accord. France buys Polish coal and sells Polish industry a decade of credit. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.126.t: "Giscard's Coal and Cooperation Accord"
 COLDWAR_POL.127.a: "We will study the terms."
 COLDWAR_POL.127.d: "The government in Warsaw proposes a standing agreement: Perkins Engines for Ursus. British engine makers sell licences for Poland's tractor factory. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.127.t: "Perkins Engines for Ursus"
 COLDWAR_POL.128.a: "We will study the terms."
 COLDWAR_POL.128.d: "The government in Warsaw proposes a standing agreement: The Paris Club Rescheduling. Creditors prefer a rescheduled Poland to a bankrupt one. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.128.t: "The Paris Club Rescheduling"
 COLDWAR_POL.129.a: "We will study the terms."
 COLDWAR_POL.129.d: "The government in Warsaw proposes a standing agreement: Bishops for the Western Territories. Rome recognises the frontier in church law and Warsaw gets regular Polish bishops in the west. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.129.t: "Bishops for the Western Territories"
 COLDWAR_POL.130.a: "We will study the terms."
 COLDWAR_POL.130.d: "The government in Warsaw proposes a standing agreement: Casaroli's Working Group. Monsignor Casaroli's patient diplomacy exchanges church space for civil peace. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.130.t: "Casaroli's Working Group"
 COLDWAR_POL.131.a: "We will study the terms."
 COLDWAR_POL.131.d: "The government in Warsaw proposes a standing agreement: An Invitation to the Pope. The Primate wishes to receive a pope on Polish soil, as the Millennium of 1966 promised. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.131.t: "An Invitation to the Pope"
 COLDWAR_POL.132.a: "We will study the terms."
 COLDWAR_POL.132.d: "The government in Warsaw proposes a standing agreement: Diplomatic Relations Restored. Rome and Warsaw exchange nuncio and ambassador after forty years. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_POL.132.t: "Diplomatic Relations Restored"
