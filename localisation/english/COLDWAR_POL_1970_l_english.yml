 COLDWAR_POL_programme_znak_desc: "The programme of Znak and the Catholic Intelligentsia. Its effects apply only while this party governs; they are kept and return when it governs again."
 COLDWAR_POL_programme_zsl: "Programme: ZSL and Rural Solidarity"
 COLDWAR_POL_programme_zsl_desc: "The programme of ZSL and Rural Solidarity. Its effects apply only while this party governs; they are kept and return when it governs again."
 COLDWAR_POL_raczynski: "Edward Raczynski"
 COLDWAR_POL_rakowski: "Mieczyslaw Rakowski"
 COLDWAR_POL_reiff: "Ryszard Reiff"
 COLDWAR_POL_relief_cost_tt: "If Poland accepts: we pay §R0.005%§! of our GDP once."
 COLDWAR_POL_resettlers: "Resettlers from Poland"
 COLDWAR_POL_resettlers_desc: "At the transit camp at Friedland the Aussiedler from Silesia and Masuria arrive with their families and old documents in German. They find work quickly, and their new neighbours ask about the villages they left."
 COLDWAR_POL_resistance_historians: "Historians of the Resistance"
 COLDWAR_POL_resistance_historians_desc: "Archives open their cellars to historians who tell the story of the Resistance in full, the Home Army included. The Party's hold on the past weakens, and students queue at the reading room to see what their parents were forbidden to ask.\n\n§gLapses while the Partisans are out of power and returns when they govern again.§!"
 COLDWAR_POL_rights_monitors: "The Helsinki Rights Campaign"
 COLDWAR_POL_rights_monitors_desc: "Collect the cases, quote the articles of the Helsinki pledges Warsaw has signed, and send them abroad. A state that signed cannot answer without admitting what it did, and some officers distrust such lawyers' tactics.\n\n§gLapses while the Confederation is out of power and returns when it governs again.§!"
 COLDWAR_POL_rouble_deferral_cost_tt: "If Poland accepts: we pay §R0.05%§! of our GDP once and gain §G5§! political power."
 COLDWAR_POL_rouble_rescheduling: "The Rouble Rescheduling"
 COLDWAR_POL_rouble_rescheduling_desc: "Moscow agrees to wait on Polish rouble debts and sends extra deliveries of raw materials. The ally stays solvent, and the Kremlin keeps its hand on the lever. Polish negotiators thank their hosts and count the cost of gratitude.\n\n§gAgreement with the Soviet Union: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_rouble_rescheduling_partner: "The Rouble Rescheduling"
 COLDWAR_POL_rouble_rescheduling_partner_desc: "Moscow reschedules the debts of its Warsaw ally and sends oil and cotton to keep the factories running. The price is a political note on the loyalty of the Polish comrades, and the Kremlin keeps it in the file.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_sabbat: "Kazimierz Sabbat"
 COLDWAR_POL_sanction_cond_tt: "Poland is ruled by the army or has outlawed the independent unions (Martial Law)"
 COLDWAR_POL_sanction_cost_tt: "Weekly cost: §R0.01%§! of our GDP in lost trade while the sanction stands. American agreements with Poland are suspended."
 COLDWAR_POL_sd_a1: "Rule of Law Clubs"
 COLDWAR_POL_sd_a1_desc: "Lawyers and judges in SD argue that the state, too, is bound by its own statutes. The ministries put the idea down in minutes as unhelpful."
 COLDWAR_POL_sd_a1_tb: "Rule of Law Clubs"
 COLDWAR_POL_sd_a2: "The Loyal Partner of the Front"
 COLDWAR_POL_sd_a2_desc: "SD sits in the Front of National Unity, votes for the plan and receives its quota of ministries and Sejm seats. Quotas bring the usual favours."
 COLDWAR_POL_sd_a2_tb: "The Loyal Partner of the Front"
 COLDWAR_POL_sd_b1: "Private Crafts Come First"
 COLDWAR_POL_sd_b1_desc: "Workshops, bakeries and repair shops are allowed to hire apprentices, own their premises and buy supplies. The ideologues complain that a new bourgeoisie is growing."
 COLDWAR_POL_sd_b1_tb: "Private Crafts Come First"
 COLDWAR_POL_sd_b2: "The Polonia Firms"
 COLDWAR_POL_sd_b2_desc: "Let Poles abroad open small firms at home and bring dollars and know-how. Insiders will want a seat on the board of a firm that is neither quite foreign nor quite Polish."
 COLDWAR_POL_sd_b2_tb: "The Polonia Firms"
 COLDWAR_POL_sd_cap: "The Small Business Republic"
 COLDWAR_POL_sd_cap_desc: "Poland has a proper small-business class: shopkeepers, craftsmen and engineers who own their workshops and answer to a court. The Party shares the room with their chambers."
 COLDWAR_POL_sd_e: "The Craftsmen's Party"
 COLDWAR_POL_sd_e_desc: "The Democratic Party speaks for the craftsman with a workshop, the shopkeeper and the engineer who never joined the Party. Under Zygmunt Moskwa it asks to run the coalition, politely and with a ledger."
 COLDWAR_POL_sd_eco: "A Charter for the Crafts"
 COLDWAR_POL_sd_eco_desc: "Bakers, tailors and plumbers work mostly in small private shops. Guarantee them premises, supplies and a fair tax, and the queues at the tailor shorten."
 COLDWAR_POL_sd_em: "Service Co-operatives"
 COLDWAR_POL_sd_em_desc: "Repair, laundry, taxi and building co-operatives fill the gaps the state industry leaves. They hire the unemployable, outbid the ministries and send the invoices through the right office."
 COLDWAR_POL_sd_em_tb: "Service Co-operatives"
 COLDWAR_POL_sd_front_seats: "The Loyal Partner of the Front"
 COLDWAR_POL_sd_front_seats_desc: "Shopkeepers, craftsmen and clerks of the Democratic Party sit in the Front of National Unity, vote for the plan and receive their quota of ministries and Sejm seats. Quotas bring the usual favours.\n\n§gLapses while the Democratic Party is out of power and returns when it governs again.§!"
 COLDWAR_POL_sd_pm: "The Ombudsman and the Tribunals"
 COLDWAR_POL_sd_pm_desc: "A small office where citizens may complain, a court that may rule on laws, a Senate that may be revived. The reformers in SD ask for modest things; the Party hears an indictment."
 COLDWAR_POL_sd_pm_tb: "The Ombudsman and the Tribunals"
 COLDWAR_POL_sd_pol: "Engineers and Technicians' Clubs"
 COLDWAR_POL_sd_pol_desc: "The technical intelligentsia that the Party shunned after 1968 finds a home in SD clubs. Some of them read foreign journals openly."
 COLDWAR_POL_sd_pol_tb: "Engineers and Technicians' Clubs"
 COLDWAR_POL_sd_x1: "Mlynczak's Reform Convention"
 COLDWAR_POL_sd_x1_desc: "Tadeusz Mlynczak wants SD to ask aloud for a state of law and a share of the economy. The Party will thank the Democrats and warn them in the same sentence."
 COLDWAR_POL_sd_x2: "Kowalczyk and the Patriotic Front"
 COLDWAR_POL_sd_x2_desc: "Edward Kowalczyk steers SD into a broad patriotic front beside the Party. The Democrats stay safe and quiet, and the intelligentsia they once courted looks away."
 COLDWAR_POL_sd_x2_tb: "Kowalczyk and the Patriotic Front"
 COLDWAR_POL_second_stage_reform: "The Second Stage of Reform"
 COLDWAR_POL_second_stage_reform_desc: "Prices now move with demand, firms must live on what they earn, and joint ventures with Western partners open in rented halls. The plan has become a guide instead of a command, and directors who once waited for orders must now find customers.\n\n§gPoland's economic model: adopting another model replaces it.§!"
 COLDWAR_POL_selective_development: "Selective Development"
 COLDWAR_POL_selective_development_desc: "Coal, steel, power and chemicals get the money, and the consumer waits his turn. Cranes shape the skyline at Nowa Huta and Plock, and the housewife is told that the five-year plan is hers too.\n\n§gPoland's economic model: adopting another model replaces it.§!"
 COLDWAR_POL_self_governing_republic: "The Self-Governing Republic"
 COLDWAR_POL_self_governing_republic_desc: "The republic of self-governing workplaces, towns and villages is written into the constitution, with an elected Sejm, a Constitutional Tribunal and police under the law. Every Party office is asked to justify itself, and some find the questions new.\n\n§gLapses while KOR and Solidarity are out of power and returns when they govern again.§!"
 COLDWAR_POL_self_limitation: "The Self-Limiting Revolution"
 COLDWAR_POL_self_limitation_desc: "Self-government in factories, towns and villages, but foreign policy and defence stay with the Party, and no demand is made that Moscow cannot swallow. In the union halls the older men call this prudence, and the radicals call it timidity.\n\n§gLapses while KOR and Solidarity are out of power and returns when they govern again.§!"
 COLDWAR_POL_self_reliance: "Self-Reliance Economy"
 COLDWAR_POL_self_reliance_desc: "The country stands on its own resources: no foreign credit, no foreign advisers, no licence that cannot be paid for in coal. Factories make do with what Polish mines and Polish engineers can provide, and the shops carry what the nation can make.\n\n§gPoland's economic model: adopting another model replaces it.§!"
 COLDWAR_POL_self_reliant_poland: "A Self-Reliant People's Poland"
 COLDWAR_POL_self_reliant_poland_desc: "Poland stands alone between two empires, with its own factories, its own militia and a Party that owes nothing to anyone. It is poorer in shops and richer in pride.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_service_the_debt: "Service the Debt"
 COLDWAR_POL_service_the_debt_desc: "The Ministry of Finance sets aside hard currency to pay the Western banks ahead of time. Every dollar repaid now is a dollar that does not grow."
 COLDWAR_POL_shadow_of_march_1: "The Shadow of March"
 COLDWAR_POL_shadow_of_march_1_desc: "Since March 1968 the lecture halls of Warsaw University have thinned out. Thousands of Jews, many of them survivors of the war, have been handed a one-way travel document, and the professors who spoke up have lost their chairs. Laboratories wait for people who now teach in Copenhagen and Tel Aviv.\n\n§gRehabilitating purged scholars eases it; renewed purges deepen it.§!"
 COLDWAR_POL_shadow_of_march_2: "The Shadow of March (Rehabilitations)"
 COLDWAR_POL_shadow_of_march_2_desc: "A few names return to the faculty lists. Dismissed lecturers are quietly asked to teach again, editors discover that old files were mislaid, and the corridors of the university smell a little less of fear. Those who left in 1968 are not coming back, and everybody knows it.\n\n§gEach further rehabilitation eases it again; a renewed purge sends it back.§!"
 COLDWAR_POL_shadow_of_march_3: "The Shadow of March (Fading)"
 COLDWAR_POL_shadow_of_march_3_desc: "The last of the dossiers from 1968 are being reopened. Seminars run again in Krakow and Wroclaw, borrowed typewriters tap out honest footnotes, and a young physicist can come home from Paris without being asked whom she met there. The silence of the bad years has not quite lifted.\n\n§gOne more rehabilitation removes it; a new purge deepens it again.§!"
 COLDWAR_POL_ships_for_fleet: "Ships for the Soviet Fleet"
 COLDWAR_POL_ships_for_fleet_desc: "The slipways of Gdansk, Szczecin and Gdynia turn out merchantmen, trawlers and landing ships for the whole bloc. The Soviet navy places the orders, and the yard workers learn that a warship pays better than a trawler.\n\n§gAgreement with the Soviet Union: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_ships_for_fleet_partner: "Ships for the Soviet Fleet"
 COLDWAR_POL_ships_for_fleet_partner_desc: "Soviet admirals visit the yards on the Baltic to inspect the landing ships that Polish workers have built for them. The ships are well made and paid for in oil and orders, and they spare Soviet yards the trouble.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_small_business_republic: "The Small Business Republic"
 COLDWAR_POL_small_business_republic_desc: "Poland has a proper small-business class: shopkeepers, craftsmen and engineers who own their workshops and answer to a court, not a committee. The Party shares the room with their chambers of trade, and the corner shop opens at seven.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_small_stabilisation: "The Small Stabilisation"
 COLDWAR_POL_small_stabilisation_desc: "Comrade Wieslaw has no use for foreign loans or consumer whims. Steel mills and coal pits get the money, wages stay where they were, and every new machine must be paid for in Polish coal and Polish patience. Order, not abundance, is the programme.\n\n§gAdopting another economic model through a leader's economy focuses replaces it.§!"
 COLDWAR_POL_smallholders: "Three Million Smallholdings"
 COLDWAR_POL_smallholders_desc: "Behind the fence of almost every village stands a private farmer who sells his grain at fixed prices and keeps his own horse. After 1956 the collective farm was quietly buried. The farmer trusts neither the Party's promises nor its tractors.\n\n§gFarmer pensions, land for the peasants or a peasant-movement government replace it with a better settlement.§!"
 COLDWAR_POL_social_council: "The Primate's Social Council"
 COLDWAR_POL_social_council_desc: "Lay experts, economists and jurists meet in the Primate's residence to write what the government will not: a programme for the nation under Catholic social teaching. Ministers read it before they answer.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_social_enterprise: "The Social Enterprise"
 COLDWAR_POL_social_enterprise_desc: "The factory belongs to those who work in it. A workers' council meets in the canteen, chooses the director from rival candidates and argues over the balance sheet far into the evening. Production is slower to organise than the Party expected, and faster than the sceptics feared.\n\n§gPoland's economic model: adopting another model replaces it.§!"
 COLDWAR_POL_social_republic: "The Social Republic"
 COLDWAR_POL_social_republic_desc: "Cooperatives, free unions and a state that insures its citizens against sickness and age: the dream of the Socialists of 1892 stands in a Poland that exists, and the Party apparatus has been asked to make room for it.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_society_ch1: "The Church Question"
 COLDWAR_POL_society_ch1_desc: "Eleven thousand churches fill on Sundays and the state has no answer. A mixed commission sits down at the Council of State."
 COLDWAR_POL_society_ch2a: "Group D Against the Church"
 COLDWAR_POL_society_ch2a_desc: "The SB's Department IV watches every priest and every pilgrimage. The Party tightens its grip, and the Primate answers from the pulpit."
 COLDWAR_POL_society_ch2b: "Normalisation Talks"
 COLDWAR_POL_society_ch2b_desc: "Sit down with the Primate and settle: churches for quiet. Moscow will note that the Church is again a partner."
 COLDWAR_POL_society_ch3: "Permission for New Churches"
 COLDWAR_POL_society_ch3_desc: "Parishes in the new estates may build a church at last. The Party cell in the factory will call it a pity."
 COLDWAR_POL_society_ch4: "Gierek Meets the Pope"
 COLDWAR_POL_society_ch4_desc: "The First Secretary of a communist party wants to be received at the Vatican. Western credit follows a leader who is on speaking terms with the Pope; Moscow would have to be told."
 COLDWAR_POL_society_ch5: "Preparing the Papal Visit"
 COLDWAR_POL_society_ch5_desc: "If a Polish Pope were ever to come home, the state would want to be sure the crowds stay orderly. Moscow would fear what nine days of masses could do."
 COLDWAR_POL_society_e: "The Social Contract"
 COLDWAR_POL_society_e_desc: "The workers have shown that the state fears its workers. The Party, the police and the bishops each offer a way to keep them quiet."
 COLDWAR_POL_society_sc1: "The Security Apparatus"
 COLDWAR_POL_society_sc1_desc: "The Interior Ministry has its lists, its informers and its paramilitary reserve. The question is how hard to press."
 COLDWAR_POL_society_sc2a: "ZOMO and the Security Service"
 COLDWAR_POL_society_sc2a_desc: "Riot police and the Security Service move into every factory town. The queues grow quiet for a while."
 COLDWAR_POL_society_sc2b: "Control by Persuasion"
 COLDWAR_POL_society_sc2b_desc: "Send propagandists, union men and Party secretaries, not tanks. It is slower, but the workers need not hate the Party for it."
 COLDWAR_POL_society_sc3: "The Informer Network"
 COLDWAR_POL_society_sc3_desc: "A file for every workshop, a friend in every flat. The files never stop growing."
 COLDWAR_POL_society_sc4a: "Censorship Tightened"
 COLDWAR_POL_society_sc4a_desc: "GUKPPiW decides what may be printed, from coal output to the date of the Warsaw Uprising. Writers will learn to whisper and the best of them will leave."
 COLDWAR_POL_society_sc4b: "A Looser Press"
 COLDWAR_POL_society_sc4b_desc: "Let Polityka print an honest piece on housing and let the theatres stage Mickiewicz. The critics come out of the cafes and onto the page."
 COLDWAR_POL_society_sf1: "Universities and Science"
 COLDWAR_POL_society_sf1_desc: "Half the best professors left in 1968. New institutes and a reformed Academy of Sciences must get the laboratories working again."
 COLDWAR_POL_society_sf1_tb: "Universities and Science"
 COLDWAR_POL_society_sf2a: "Rehabilitate the Professors"
 COLDWAR_POL_society_sf2a_desc: "Professors expelled in March 1968 may come back to their chairs. Some of them will teach what they are not supposed to."
 COLDWAR_POL_society_sf2a_tb: "Rehabilitate the Professors"
 COLDWAR_POL_society_sf2b: "Party Control of the Universities"
 COLDWAR_POL_society_sf2b_desc: "Rectors are appointed by the Ministry and Party cells sit in every faculty. Science becomes engineering, and the humanities keep their heads down."
 COLDWAR_POL_society_sf2b_tb: "Party Control of the Universities"
 COLDWAR_POL_society_sf3: "The Scholars Return"
 COLDWAR_POL_society_sf3_desc: "Scientists who left for Haifa, Chicago or Stockholm are invited to visit, and some to stay. The laboratories could fill again."
 COLDWAR_POL_society_sf3_tb: "The Scholars Return"
 COLDWAR_POL_society_sf4: "Third Place in 1974"
 COLDWAR_POL_society_sf4_desc: "Back the national team under Kazimierz Gorski with money, a training camp and a place on television. A good World Cup would keep the nation cheerful."
 COLDWAR_POL_society_sf5a: "Polonia and the Remittances"
 COLDWAR_POL_society_sf5a_desc: "Millions of Poles abroad send parcels, dollars and letters. The state welcomes the dollars and the Western agencies welcome the contacts."
 COLDWAR_POL_society_sf5b: "Polish Workers in the GDR"
 COLDWAR_POL_society_sf5b_desc: "Thousands of Polish workers go to East German factories under state agreements. They send home marks and bring back grievances."
 COLDWAR_POL_society_sf5b_tb: "Polish Workers in the GDR"
 COLDWAR_POL_society_sf6: "Olympic Medals Montreal 1976"
 COLDWAR_POL_society_sf6_desc: "The sport clubs of the Army and the Police are asked to send athletes to every games. A gold medal is worth ten editorials."
 COLDWAR_POL_solid_a1: "A Union Above Politics"
 COLDWAR_POL_solid_a1_desc: "A union that forms a party will be treated as a party and banned as one. Solidarity organises the workplace and leaves the government to the Sejm, and has no ministers to show for it."
 COLDWAR_POL_solid_a1f: "The Self-Limiting Revolution"
 COLDWAR_POL_solid_a1f_desc: "Self-government in the factories, towns and villages, but foreign policy and defence stay with the Party, and no demand is made that Moscow cannot swallow. The radicals call it timid."
 COLDWAR_POL_solid_a2: "The Citizens' Committees"
 COLDWAR_POL_solid_a2_desc: "Strikes end in agreements that the Party breaks. Walesa gathers experts, priests and lawyers into a committee that can name candidates, talk to foreign governments and staff the offices the Party cannot."
 COLDWAR_POL_solid_a2_tb: "The Citizens' Committees"
 COLDWAR_POL_solid_a2f: "Free Elections Now"
 COLDWAR_POL_solid_a2f_desc: "No agreement with the Party holds until the Sejm is elected freely. The union calls for a caretaker government and a vote, and Moscow reads the call as the end of socialism."
 COLDWAR_POL_solid_a2f_tb: "Free Elections Now"
 COLDWAR_POL_solid_b1: "The Social Enterprise"
 COLDWAR_POL_solid_b1_desc: "Every large plant becomes a social enterprise run by its crew through a workers' council, with directors chosen in open competition. Planners in Warsaw and Moscow smell Yugoslavia."
 COLDWAR_POL_solid_b1f: "Councils Elect the Directors"
 COLDWAR_POL_solid_b1f_desc: "The first councils choose their managers by competition and the managers answer to the crew. Productivity rises where the council is good and stalls where it argues."
 COLDWAR_POL_solid_b1f_tb: "Councils Elect the Directors"
 COLDWAR_POL_solid_b2: "Prices Tell the Truth"
 COLDWAR_POL_solid_b2_desc: "Free the prices, let the zloty find its value and let firms live or die by their accounts. The cure is brutal, but the creditors will pay for a government that dares to apply it."
 COLDWAR_POL_solid_b2_tb: "Prices Tell the Truth"
 COLDWAR_POL_solid_b2f: "Small Privatisation"
 COLDWAR_POL_solid_b2f_desc: "Shops, bakeries and workshops pass to the people who run them. They pay taxes at once, and the workers of the big plants watch their neighbours get rich."
 COLDWAR_POL_solid_b2f_tb: "Small Privatisation"
 COLDWAR_POL_solid_c1: "The Church as Ally"
 COLDWAR_POL_solid_c1_desc: "The Pope's portrait hangs on the shipyard gate and a priest says Mass for the strikers. The bishops, who fear bloodshed above all, offer to carry messages between the table and the Party."
 COLDWAR_POL_solid_c2: "The New Evolutionism"
 COLDWAR_POL_solid_c2_desc: "The lay left of KOR does not mean to be a Church auxiliary. Its flying university, its journals and its friends in Paris and Prague argue for reform in the language of rights, not of faith."
 COLDWAR_POL_solid_c2_tb: "The New Evolutionism"
 COLDWAR_POL_solid_cap: "Ten Million Members"
 COLDWAR_POL_solid_cap_desc: "One worker in three belongs to the same union, and the nation has learned to organise without the Party. The shops are still empty, but nobody now doubts that Poland is a society, and Moscow does not doubt it either."
 COLDWAR_POL_solid_cm: "The Farmers' Charter of Rzeszow"
 COLDWAR_POL_solid_cm_desc: "Private farmers form their own union beside the workers. The union promises that peasant land is safe, and the farmers promise that there will be meat in the shops."
 COLDWAR_POL_solid_d1: "A Message to Eastern Europe"
 COLDWAR_POL_solid_d1_desc: "The congress writes to the working people of Prague, Budapest, Sofia and the Soviet republics: you too can have a free union. For Moscow this is no longer a trade-union matter."
 COLDWAR_POL_solid_d1_tb: "A Message to Eastern Europe"
 COLDWAR_POL_solid_d2: "Within the Alliances"
 COLDWAR_POL_solid_d2_desc: "The programme promises reform without violating Poland's international alliances. The Soviet ambassador is told early, the army stays in its barracks, and the West is asked to be patient."
 COLDWAR_POL_solid_dm: "Presses and Union Aid from the West"
 COLDWAR_POL_solid_dm_desc: "Printing machines, paper and cash cross the border in the luggage of Western trade unionists. The union weekly runs to hundreds of thousands, and the Security Service counts every parcel it misses."
 COLDWAR_POL_solid_dm_tb: "Presses and Union Aid from the West"
 COLDWAR_POL_solid_e: "The Open Letter"
 COLDWAR_POL_solid_e_desc: "Kuron and Modzelewski told the Party that the workers' state belongs to the workers, and went to prison for it. Their friends now hold the ministries and must show what they meant."
 COLDWAR_POL_solid_eco: "Experts at the Lenin Shipyard"
 COLDWAR_POL_solid_eco_desc: "The strike committee needs people who can read a budget and a statute. Mazowiecki, Geremek and other advisers take the train to Gdansk and sit down beside the workers."
 COLDWAR_POL_solid_eco_tb: "Experts at the Lenin Shipyard"
 COLDWAR_POL_solid_em: "The Social Council for the Economy"
 COLDWAR_POL_solid_em_desc: "Economists of the union and of the ministries meet to write one plan for the country: how to pay for the crisis, who sets prices and who keeps the factories running. Credit to cover the gap will have to come from somewhere."
 COLDWAR_POL_solid_em_tb: "The Social Council for the Economy"
 COLDWAR_POL_solid_pm: "The Gdansk Agreement"
 COLDWAR_POL_solid_pm_desc: "A free union, the right to strike and a wage rise are written at the shipyard table. The Party concedes what it called impossible, and the strikes have cost the plants weeks of output."
 COLDWAR_POL_solid_pol: "The Committee for Workers' Defence"
 COLDWAR_POL_solid_pol_desc: "Strikers are beaten, dismissed and left without a lawyer. Writers, doctors and priests collect money and testimony for them openly, under their own names, and the Security Service does not know how to answer."
 COLDWAR_POL_solid_pol_tb: "The Committee for Workers' Defence"
 COLDWAR_POL_solid_x1: "The Round Table Contract"
 COLDWAR_POL_solid_x1_desc: "Kiszczak and Walesa sit at one table in the Namiestnikowski Palace. The Party keeps most Sejm seats and the presidency; the union gets legality, a free Senate and an open vote for the rest."
 COLDWAR_POL_solid_x2: "The Self-Governing Republic"
 COLDWAR_POL_solid_x2_desc: "The republic of self-governing workplaces, towns and villages is written into the constitution: an elected Sejm, a Constitutional Tribunal and a police under the law. Every Party office is asked to justify itself."
 COLDWAR_POL_sov_cut_oil: "Cut Oil Deliveries"
 COLDWAR_POL_sov_cut_oil_desc: "The Friendship pipeline carries oil and obedience in the same pipe. A slightly closed valve reminds Warsaw who keeps its refineries running."
 COLDWAR_POL_sov_fraternal_assistance: "Fraternal Assistance"
 COLDWAR_POL_sov_fraternal_assistance_desc: "The Polish comrades have lost control of their own country, or so the reports from Warsaw say. Fraternal assistance is a decision for the Politburo, not a reflex of the General Staff."
 COLDWAR_POL_sov_rouble_deferral: "Offer to Reschedule the Rouble Debt"
 COLDWAR_POL_sov_rouble_deferral_desc: "Poland cannot pay its rouble debts on time. A year's grace costs Moscow little and binds Warsaw more firmly than a tank division."
 COLDWAR_POL_soyuz_gas: "Soyuz Gas for Polish Labour"
 COLDWAR_POL_soyuz_gas_desc: "Polish crews lay a stretch of the great pipeline that will carry Soviet gas west, living in camps on the steppe and working through the frost. They are paid in gas for the furnaces at home, and the foremen come back with stories of minus thirty.\n\n§gAgreement with the Soviet Union: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_soyuz_gas_partner: "Soyuz Gas for Polish Labour"
 COLDWAR_POL_soyuz_gas_partner_desc: "Polish brigades arrive at the pipeline sites with their own cranes, welders and canteen trucks. The pipe goes into the ground faster than Moscow had planned, and the gas ministry notes with satisfaction that the allies deliver.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_stage4_tt: "Poland's Brezhnev Doctrine stands at stage 4 or worse"
 COLDWAR_POL_stage6_tt: "Poland's Brezhnev Doctrine stands at its last stage: Manoeuvres on the Border"
 COLDWAR_POL_state_and_society_tree_shortcut: "State and Society"
 COLDWAR_POL_state_modifier: "The Polish State"
 COLDWAR_POL_state_modifier_desc: "The lasting reforms of the Polish state, built focus by focus."
 COLDWAR_POL_stomma: "Stanislaw Stomma"
 COLDWAR_POL_success_television: "Scenes from the Decade"
 COLDWAR_POL_success_television_desc: "Colour comes to Polish screens, with variety shows, new serials, Sunday films from the West and a cheerful evening news. Every household sees the new decade on the television, and the chairman's villa by the lake is not shown.\n\n§gLapses while neither the Silesian Group nor the Red Directors govern, and returns when one of them does.§!"
 COLDWAR_POL_sugar_for_ships: "Sugar for Ships and Tractors"
 COLDWAR_POL_sugar_for_ships_desc: "Havana pays in sugar for Polish ships and tractors. Ursus machines roll through the cane fields of Oriente, the yards of Gdansk send trawlers and cargo ships to Cuban ports, and Polish children chew candy made from the island's cane.\n\n§gAgreement with Cuba: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_sugar_for_ships_partner: "Sugar for Ships and Tractors"
 COLDWAR_POL_sugar_for_ships_partner_desc: "Cuban cane cutters work beside Polish tractors, and Polish ships dock in Havana harbour. The sugar harvest pays the bill, and Fidel tells the crowd in the plaza that Poland is a friend of the revolution.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_tension_p1_tt: "World Tension: §R+1§!"
 COLDWAR_POL_tension_p2_tt: "World Tension: §R+2§!"
 COLDWAR_POL_tension_p3_tt: "World Tension: §R+3§!"
 COLDWAR_POL_textbook_commission: "The Textbook Commission"
 COLDWAR_POL_textbook_commission_desc: "Historians of both nations meet in Braunschweig and Warsaw to strike the old hatreds from the school books. They argue for years over a single paragraph, and most of the paragraphs survive.\n\n§gAgreement with West Germany: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_textbook_commission_partner: "The Textbook Commission"
 COLDWAR_POL_textbook_commission_partner_desc: "Teachers and historians of the Georg Eckert Institute in Braunschweig sit down with Polish colleagues over the school books. Maps are redrawn, myths are footnoted, and the first texts in a new tone go to the printers.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_the_army_tree_shortcut: "The Army"
 COLDWAR_POL_the_december_crisis_tree_shortcut: "The December Crisis"
 COLDWAR_POL_the_party_tree_shortcut: "The Party"
 COLDWAR_POL_third_republic: "The Third Republic"
 COLDWAR_POL_third_republic_desc: "A democratic, sovereign Poland that owes nothing to Moscow or the Party's old guard builds its own arms at Stalowa Wola, as the Central Industrial District once did. Foundries glow again at night, and Moscow has noticed.\n\n§gA government's legacy: a later government's legacy replaces it.§!"
 COLDWAR_POL_trunk: "The Small Stabilisation"
 COLDWAR_POL_trunk_desc: "Fourteen years after October 1956, Comrade Wieslaw still rules from the Central Committee building. Wages stand still, the shops are thin and the Politburo is quarrelling over a new price list for Christmas."
 COLDWAR_POL_union_statute: "A Union Above Politics"
 COLDWAR_POL_union_statute_desc: "A union that forms a party will be treated as a party and banned as one, say the founders. The union keeps to the workplace and the wage, leaves government to the Sejm, and accepts that it will have no ministers to show for it.\n\n§gLapses while KOR and Solidarity are out of power and returns when they govern again.§!"
 COLDWAR_POL_unrecognised_frontier: "The Unrecognised Frontier"
 COLDWAR_POL_unrecognised_frontier_desc: "Bonn ministers say 'Polish administration' when they speak of Wroclaw and Szczecin and leave the frontier to a future peace treaty. Settlers on the Oder still keep a bag packed by the door. Foreign bankers ask about the frontier first, and about the plan second.\n\n§gRemoved when West Germany accepts the Warsaw Treaty offer.§!"
 COLDWAR_POL_unrest_band_1: "Grumbling Queues"
 COLDWAR_POL_unrest_band_1_desc: "The queues grow longer outside the butchers of Gdansk and Lodz, and bitter jokes go round the factory benches. For now the grumbling is private, behind a hand, but the Party's informers write it down.\n\n§gPrice rises, repression, empty shops and heavy debt push discontent up; wages, housing and dialogue bring it down.§!"
 COLDWAR_POL_unrest_band_2: "Strike Wave"
 COLDWAR_POL_unrest_band_2_desc: "Work stops at the shipyard, at the tram depot, at the Ursus works. Strike committees print leaflets, and the militia stands outside the gates, waiting for orders that nobody wants to give.\n\n§gWage and housing measures and dialogue with the workers ease it; it also builds support for KOR and Solidarity.§!"
 COLDWAR_POL_unrest_band_3: "General Strike"
 COLDWAR_POL_unrest_band_3_desc: "Every factory is silent. Trains stand in the stations, ports are blockaded and the militia can do little more than watch. The Party calls on the nation to return to work, and the nation waits.\n\n§gOnly dialogue, agreements and concessions to the workers end it; repression makes it worse.§!"
 COLDWAR_POL_unrest_drift_gomulka_cap_tt: "For 3 years Social Discontent rises by a further §R0.30§! every month."
 COLDWAR_POL_unrest_drift_jaruz_a1_tt: "For 2 years Social Discontent rises by a further §R0.50§! every month."
 COLDWAR_POL_unrest_drift_society_sc2a_tt: "For 2 years Social Discontent rises by a further §R0.30§! every month."
 COLDWAR_POL_unrest_m10_tt: "Social Discontent: §G-10§!"
 COLDWAR_POL_unrest_m12_tt: "Social Discontent: §G-12§!"
 COLDWAR_POL_unrest_m15_tt: "Social Discontent: §G-15§!"
 COLDWAR_POL_unrest_m20_tt: "Social Discontent: §G-20§!"
 COLDWAR_POL_unrest_m3_tt: "Social Discontent: §G-3§!"
 COLDWAR_POL_unrest_m5_tt: "Social Discontent: §G-5§!"
 COLDWAR_POL_unrest_m8_tt: "Social Discontent: §G-8§!"
 COLDWAR_POL_unrest_modifier: "Social Discontent: [?COLDWAR_POL_unrest|0] of 100"
 COLDWAR_POL_unrest_modifier_desc: "Prices, queues and broken promises gather quietly in the shipyards and the mills. When the anger spills over, it does so all at once, and the street remembers every December. Bands at 40, 60 and 80; see the decision category Warsaw and the Nation."
 COLDWAR_POL_unrest_p10_tt: "Social Discontent: §R+10§!"
 COLDWAR_POL_unrest_p12_tt: "Social Discontent: §R+12§!"
 COLDWAR_POL_unrest_p3_tt: "Social Discontent: §R+3§!"
 COLDWAR_POL_unrest_p4_tt: "Social Discontent: §R+4§!"
 COLDWAR_POL_unrest_p5_tt: "Social Discontent: §R+5§!"
 COLDWAR_POL_unrest_p6_tt: "Social Discontent: §R+6§!"
 COLDWAR_POL_unrest_p8_tt: "Social Discontent: §R+8§!"
 COLDWAR_POL_usa_lift_sanctions: "Lift the Sanctions on Poland"
 COLDWAR_POL_usa_lift_sanctions_desc: "The prisoners are free, and the State Department sees a thaw worth rewarding.\n\nThe sanction itself is ended in the sanctions menu."
 COLDWAR_POL_usa_relief: "Send the Polish-American Relief"
 COLDWAR_POL_usa_relief_desc: "Polish-American parishes and clubs collect food, medicine and clothes for the old country, and the State Department pays for the ships."
 COLDWAR_POL_usa_sanctions: "Impose Sanctions on Poland"
 COLDWAR_POL_usa_sanctions_desc: "Warsaw has turned the army on its own workers. Washington can close its markets and its banks until the prisoners are free and the unions are legal again.\n\nThe sanction class itself is chosen in the sanctions menu."
 COLDWAR_POL_veterans_council: "The Council of Three Line"
 COLDWAR_POL_veterans_council_desc: "The veterans of Anders's army keep their own council and refuse to treat the President in Eaton Place as the only voice of the Republic. The soldiers have not forgiven the split of 1954.\n\n§gLapses while neither the Government-in-Exile nor Kultura governs, and returns when one of them does.§!"
 COLDWAR_POL_veterans_placement: "The Veterans' Placement Office"
 COLDWAR_POL_veterans_placement_desc: "Veterans of the partisan struggle carry their badges and cards into every ministry, directorate and editorial office, and they are hired first. The offices grow loyal, slow and crowded, with tea in glasses and war stories before lunch.\n\n§gLapses while the Partisans are out of power and returns when they govern again.§!"
 COLDWAR_POL_visa_free_gdr: "Visa-Free Travel with the GDR"
 COLDWAR_POL_visa_free_gdr_desc: "Every year a million Poles and East Germans cross the Oder to shop, visit relatives and sell. Polish women bring home shoes and cosmetics from the other side, and East German housewives go back with sausage and cheap goods in their bags.\n\n§gAgreement with East Germany: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_visa_free_gdr_partner: "Visa-Free Travel with the GDR"
 COLDWAR_POL_visa_free_gdr_partner_desc: "Poles stream across the bridge at Frankfurt on the Oder with bags full of sausage and cheap goods, and East German shelves empty a little faster. The Party in East Berlin watches the friendship with a frown.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_walesa: "Lech Walesa"
 COLDWAR_POL_warsaw_treaty: "The Warsaw Treaty"
 COLDWAR_POL_warsaw_treaty_desc: "Brandt kneels at the memorial to the Ghetto heroes, and Bonn and Warsaw sign a treaty that treats the Oder-Neisse line as the western frontier. Settlers in Wroclaw and Szczecin sleep easier, for the first time since the war.\n\n§gAgreement with West Germany: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_warsaw_treaty_partner: "The Warsaw Treaty"
 COLDWAR_POL_warsaw_treaty_partner_desc: "The Chancellor signs in Warsaw and speaks of the burden of the past. The treaty closes the frontier question for a calmer east, and the opposition in the Bundestag denounces it as a betrayal of the expellees.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_welfare_republic: "The Welfare Republic"
 COLDWAR_POL_welfare_republic_desc: "Sickness insurance, pensions and the eight-hour day for everyone, paid from taxation. A rich state could pay for it; a poor one will have to borrow. The clerks of the new insurance fund hand out the first booklets.\n\n§gLapses while the PPS is out of power and returns when it governs again.§!"
 COLDWAR_POL_western_dioceses: "Bishops for the Western Territories"
 COLDWAR_POL_western_dioceses_desc: "A papal bull makes the Silesian, Warmian and Pomeranian church districts regular Polish dioceses. Administrators in the western lands are consecrated as bishops, and the frontier is blessed in church law.\n\n§gAgreement with the Holy See: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_western_dioceses_partner: "Bishops for the Western Territories"
 COLDWAR_POL_western_dioceses_partner_desc: "After the Warsaw Treaty the Holy See raises the administrators in the former German lands to the rank of residential Polish bishops. The Secretary of State's office hopes that Rome's gesture will be repaid in better treatment for the Church.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_workers_councils: "Councils Elect the Directors"
 COLDWAR_POL_workers_councils_desc: "The first councils choose their managers by open competition, and the managers answer to the crew. Where the council is good, productivity jumps; where it argues, the lathes stand quiet. Everyone learns what a vote costs.\n\n§gLapses while KOR and Solidarity are out of power and returns when they govern again.§!"
 COLDWAR_POL_wycech: "Czeslaw Wycech"
 COLDWAR_POL_wyszynski: "Stefan Wyszynski"
 COLDWAR_POL_zaleski: "August Zaleski"
 COLDWAR_POL_znak_a1: "Neo-Positivism"
 COLDWAR_POL_znak_a1_desc: "Poland lies between Germany and Russia and no manifesto will move it. Accept the alliance as a fact, spend the political capital on small liberties and call the rest romanticism."
 COLDWAR_POL_znak_a2: "Break with the Regime"
 COLDWAR_POL_znak_a2_desc: "The Catholic circle stops explaining the Party to the Church and starts explaining the nation to the Party. The Party will hear an opposition, and act accordingly."
 COLDWAR_POL_znak_b1: "Stay in the Sejm"
 COLDWAR_POL_znak_b1_desc: "A mandate is a microphone, an interpellation is a leaflet printed by the state, and a deputy can still telephone a minister. Resigning would only make the benches quieter."
 COLDWAR_POL_znak_b2: "Resign the Mandates"
 COLDWAR_POL_znak_b2_desc: "If the Sejm only applauds, a Catholic deputy is only a decoration. Hand back the mandates and let the nation see an empty bench."
 COLDWAR_POL_znak_cap: "The Round Table"
 COLDWAR_POL_znak_cap_desc: "Catholic experts will sit between the Party and the opposition at a literal round table and write the compromise that nobody dares to sign alone."
 COLDWAR_POL_znak_e: "The Circle of Znak"
 COLDWAR_POL_znak_e_desc: "Five Catholic deputies sit in the Sejm by permission of the Party and the Cardinal. They are few, they are watched, and they are the only deputies the intelligentsia reads."
 COLDWAR_POL_znak_eco: "Christian Democracy"
 COLDWAR_POL_znak_eco_desc: "The clubs read Adenauer, Erhard and De Gasperi: a market with a conscience, a state that serves the family and the family farm. The Planning Commission calls it bourgeois, but cannot say what is wrong with it."
 COLDWAR_POL_znak_em: "Social Market from Bonn and Rome"
 COLDWAR_POL_znak_em_desc: "German Catholic foundations offer loans and advisers for private craftsmen and the farm cooperatives. Credit for the small man comes with an account that someone must settle."
 COLDWAR_POL_znak_em_tb: "Social Market from Bonn and Rome"
 COLDWAR_POL_znak_pm: "Experts for the Strikers"
 COLDWAR_POL_znak_pm_desc: "If the shipyards strike, the committee will have demands and no lawyers. Mazowiecki and his colleagues can bring drafts, legal training and the trust of the Church."
 COLDWAR_POL_znak_pol: "Tygodnik Powszechny and Wiez"
 COLDWAR_POL_znak_pol_desc: "Krakow's weekly and Warsaw's monthly give the Catholic intelligentsia a room to think in public. The censor cuts a third of every issue and the readers learn to read between the gaps."
 COLDWAR_POL_znak_x1: "Prime Minister Mazowiecki"
 COLDWAR_POL_znak_x1_desc: "A Catholic editor takes the Council of Ministers at the head of a government that is not communist. He draws a thick line under the past and asks the West for money."
 COLDWAR_POL_znak_x2: "Organic Work, not Office"
 COLDWAR_POL_znak_x2_desc: "Let the clubs stay clubs: schools, libraries, parish lectures and publishing, with no seats and no portfolios. Poland is rebuilt from the bottom, not from a cabinet."
 COLDWAR_POL_zsl_a1: "The Ghost of Mikolajczyk's PSL"
 COLDWAR_POL_zsl_a1_desc: "Mikolajczyk's Polish Peasant Party was broken in 1947, but its voters still live in the villages. Speak openly as their heirs and the Front of National Unity must make room."
 COLDWAR_POL_zsl_a2: "Junior Partner of the Front"
 COLDWAR_POL_zsl_a2_desc: "Inside the Front of National Unity the peasant party takes its seats from the common list and delivers the village vote. In return it receives ministries, cars and a say in rural appointments."
 COLDWAR_POL_zsl_b1: "Land for the Farmers"
 COLDWAR_POL_zsl_b1_desc: "Private farms are guaranteed in law, handed down to sons, supported by credit and one day by a pension. The collective-farm lobby in the Party will call it surrender."
 COLDWAR_POL_zsl_b2: "Agricultural Circles"
 COLDWAR_POL_zsl_b2_desc: "Neighbours share a tractor, a combine and a machine pool through the village circle. It is the bloc's idea of progress, and the independent farmer pays with some of his independence."
 COLDWAR_POL_zsl_cap: "The Peasant Commonwealth"
 COLDWAR_POL_zsl_cap_desc: "The countryside has electricity, paved roads and a farmer who votes for his own party. Poland feeds itself and the cities have learned to say thank you."
 COLDWAR_POL_zsl_e: "The Peasant Party Takes the Chair"
 COLDWAR_POL_zsl_e_desc: "The United People's Party has sat in the Sejm for twenty years as the Party's junior partner. Now the villages ask it to govern, in the spirit of Witos, with a hearing for every farmer's grievance."
 COLDWAR_POL_zsl_eco: "Fair Procurement Prices"
 COLDWAR_POL_zsl_eco_desc: "The state buys grain and livestock at prices fixed in Warsaw for the benefit of the cities. Pay the farmer more and meat will return to the shops, even if the treasury carries the difference."
 COLDWAR_POL_zsl_em: "The Food Economy Bank"
 COLDWAR_POL_zsl_em_desc: "A bank for the villages lends against the harvest, builds silos and sells tractors on credit. The treasury guarantees the loans and the Western creditors are told they are for fertiliser."
 COLDWAR_POL_zsl_em_tb: "The Food Economy Bank"
 COLDWAR_POL_zsl_front_seats: "Junior Partner of the Front"
 COLDWAR_POL_zsl_front_seats_desc: "Inside the Front of National Unity the peasant party takes its seats from the common list and delivers the village vote. In return it receives ministries, cars and a say in rural appointments.\n\n§gLapses while the peasant movement is out of power and returns when it governs again.§!"
 COLDWAR_POL_zsl_pm: "League for Nature Protection"
 COLDWAR_POL_zsl_pm_desc: "The League for Nature Protection, a mass society older than the People's Republic, counts the forests and rivers the plan forgot. The peasant party offers it a platform and a voice in the villages."
 COLDWAR_POL_zsl_pm_tb: "League for Nature Protection"
 COLDWAR_POL_zsl_pol: "Witos's Heirs in the Sejm"
 COLDWAR_POL_zsl_pol_desc: "The 117 peasant deputies stop voting in silence. They bring village petitions to the committees and remind the ministers that the city's bread grows in somebody's field."
 COLDWAR_POL_zsl_x1: "Rural Solidarity and Jan Kulaj"
 COLDWAR_POL_zsl_x1_desc: "Hundreds of thousands of farmers join an independent union under Jan Kulaj. The peasant party can lead it or be left behind by it, and Moscow will not like either."
 COLDWAR_POL_zsl_x2: "Malinowski's Renewed ZSL"
 COLDWAR_POL_zsl_x2_desc: "Roman Malinowski promises a peasant party that argues back, within the alliance. The villages treat it as the safe choice against the union, and the union treats it as a government's tool."
