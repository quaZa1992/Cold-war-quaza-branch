 COLDWAR_POL_offer_responses: "Proposals From Warsaw"
 COLDWAR_POL_offer_responses_desc: "Standing agreements proposed by Poland. They hold while neither side is at war with the other or imposes an embargo or sanctions on it, are suspended otherwise and return without new payments."
 COLDWAR_POL_offer_same_government_tt: "The Polish government that made the offer is still in office"
 COLDWAR_POL_offer_sender_tt: "The offer came from the government of Poland that still holds Warsaw"
 COLDWAR_POL_oil_cut_tt: "Weekly cost for 90 days: §R0.002%§! of our GDP in lost oil exports."
 COLDWAR_POL_olszowski: "Stefan Olszowski"
 COLDWAR_POL_order_and_discipline: "Order and Discipline"
 COLDWAR_POL_order_and_discipline_desc: "The work book follows a man from job to job, comrade courts judge the late and the drunk, and a worker dismissed for absence will not easily find another post. The factory gates open on time, and the canteens fill with sullen silence.\n\n§gPoland's economic model: adopting another model replaces it.§!"
 COLDWAR_POL_ostrowski: "Stanislaw Ostrowski"
 COLDWAR_POL_papal_invitation: "An Invitation to the Pope"
 COLDWAR_POL_papal_invitation_desc: "The Primate wishes to receive a pope on Polish soil, as the Millennium of 1966 promised. The Party hesitates, the bishops insist, and the crowd at Jasna Gora is a vast argument for an invitation.\n\n§gAgreement with the Holy See: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_papal_invitation_partner: "An Invitation to the Pope"
 COLDWAR_POL_papal_invitation_partner_desc: "Rome waits for an invitation that Warsaw has refused before, and the Polish bishops press for it. A pope in Poland would be a pilgrimage and a diplomatic event at once, and the Vatican prepares the rooms.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_paris_club: "The Paris Club Rescheduling"
 COLDWAR_POL_paris_club_desc: "Creditors prefer a rescheduled Poland to a bankrupt one. Delegates meet in Paris and agree to move the due payments back. The Polish negotiators leave looking solemn, with relief in their briefcases.\n\n§gAgreement with France: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_paris_club_partner: "The Paris Club Rescheduling"
 COLDWAR_POL_paris_club_partner_desc: "The Paris Club meets in the French Treasury to reschedule Poland's payments, and the creditor governments agree that a bankrupt customer is worth less than a patient debtor. The French chair the session.\n\n§gAgreement with Poland: holds while both countries are at peace with each other and neither embargoes or sanctions the other.§!"
 COLDWAR_POL_pax_a1: "The Loyal Alternative to the Episcopate"
 COLDWAR_POL_pax_a1_desc: "If the bishops will not talk to the state, PAX will. A Catholic who wants to be a Pole and a citizen of the People's Republic can find a church line that does not end in an argument with the Party."
 COLDWAR_POL_pax_a2: "National Catholicism"
 COLDWAR_POL_pax_a2_desc: "Piasecki's old creed of nation and faith returns in a socialist coat. It is anti-liberal, anti-Western, anti-Znak, and it speaks to the same soldiers and officials as the Partisans."
 COLDWAR_POL_pax_b1: "Cooperatives Inside Socialism"
 COLDWAR_POL_pax_b1_desc: "Catholic craftsmen's cooperatives employ people the state shops cannot and the Party can point to in speeches. They compete with the planned enterprises and do not always lose."
 COLDWAR_POL_pax_b2: "Hard Currency Workshops"
 COLDWAR_POL_pax_b2_desc: "The association sells devotional goods, furniture and printing abroad, and the dollars go home to the treasury and the association alike. Everyone suspects where part of the proceeds goes."
 COLDWAR_POL_pax_cap: "A Loyal Catholic Alternative"
 COLDWAR_POL_pax_cap_desc: "A Catholic association in the Sejm, in the press and in the shops tells the faithful that one may be devout, patriotic and loyal at once. Many believers prefer to hear this from the Primate."
 COLDWAR_POL_pax_cap_tb: "A Loyal Catholic Alternative"
 COLDWAR_POL_pax_e: "Piasecki's Association"
 COLDWAR_POL_pax_e_desc: "Boleslaw Piasecki, a deputy since 1965, carries the Party's line into Catholic homes. The bishops forbid priests to read his papers; the ministers read them with pleasure."
 COLDWAR_POL_pax_eco: "Inco-Veritas"
 COLDWAR_POL_pax_eco_desc: "The association owns workshops and trading firms that produce what the parishes and the shops need. A Catholic enterprise inside socialism pays its own way and a share of the Party's."
 COLDWAR_POL_pax_em: "The PAX Workshops"
 COLDWAR_POL_pax_em_desc: "A modern workshop in Warsaw prints, binds and builds for the association and, through its contracts, for the state. A loyal Catholic enterprise can afford new machines."
 COLDWAR_POL_pax_em_tb: "The PAX Workshops"
 COLDWAR_POL_pax_pm: "A Seat on the Council of State"
 COLDWAR_POL_pax_pm_desc: "Piasecki is no minister but he has the ear of the Politburo. He tells the First Secretary what the believers will tolerate and what they will not."
 COLDWAR_POL_pax_pol: "Slowo Powszechne and the PAX Press"
 COLDWAR_POL_pax_pol_desc: "A daily, a publishing house and a network of clubs put out a Catholicism with a state licence and a state paper allocation. Readers who want the Pope read the other press."
 COLDWAR_POL_pax_x1: "Reiff and the Patriotic Front"
 COLDWAR_POL_pax_x1_desc: "With Piasecki gone, Ryszard Reiff holds the association together and offers it to the Party as a pillar of any broad patriotic front."
 COLDWAR_POL_pax_x2: "Reconciliation with the Primate"
 COLDWAR_POL_pax_x2_desc: "Reiff's PAX offers its press and its clubs to the Episcopate and asks the bishops to lift their ban. The Party will find that the Catholic ally it paid for has a will of its own."
