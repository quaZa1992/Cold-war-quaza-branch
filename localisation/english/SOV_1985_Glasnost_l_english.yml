l_english:
# IMPERIA CW — Cold War: Integrated SOV 1985 Glasnost — English localisation.
 SOV_1985_outlook_struggle_dynamic_modifier: "Soviet Outlook Struggle"
 SOV_1985_outlook_struggle_dynamic_modifier_desc: "The Soviet state is no longer moved by one party line alone. Old Guard statists, reform socialists, market liberals, the KGB, republic sovereigntists, directors, workers and national patriots are fighting over what the Union means after 1985."
 SOV_1985_glasnost_category: "Glasnost and the Union"
 SOV_1985_glasnost_category_desc: "Manage truth, fear, party monopoly, command obedience, republic sovereignty and the outlook blocs inside the Soviet Union."
 SOV_1985_the_truth_question: "The Truth Question"
 SOV_1985_the_truth_question_desc: "Open more space for public truth and media pluralism. Reformers gain, but so do republican and security reactions."
 SOV_1985_controlled_newspapers: "Controlled Newspapers"
 SOV_1985_controlled_newspapers_desc: "Allow a managed Glasnost while keeping the organs close to every editor."
 SOV_1985_stalin_on_trial: "Stalin on Trial"
 SOV_1985_stalin_on_trial_desc: "Expose the crimes of the old terror. The reform case becomes stronger, but hardliners remember every name."
 SOV_1985_enterprise_autonomy: "Enterprise Autonomy"
 SOV_1985_enterprise_autonomy_desc: "Let factories and ministries solve problems locally. Productivity may rise, but directors will learn the taste of power."
 SOV_1985_andropovs_inheritance: "Andropov's Inheritance"
 SOV_1985_andropovs_inheritance_desc: "Use the security organs to audit the party and preserve order before openness becomes collapse."
 SOV_1985_listen_to_the_republics: "Listen to the Republics"
 SOV_1985_listen_to_the_republics_desc: "Offer respect and negotiated sovereignty inside the Union. Moscow keeps legitimacy, but command obedience weakens."
 SOV_1985_the_workers_speak: "The Workers Speak"
 SOV_1985_the_workers_speak_desc: "Invite workers into the reform debate before shortages turn into strikes."
 SOV_1985_the_chernobyl_question: "The Chernobyl Question"
 SOV_1985_the_chernobyl_question_desc: "Let the disaster become a national truth instead of only a security file."
 sov_1985_glasnost.1.t: "The People Know, But Whisper"
 sov_1985_glasnost.1.d: "The public knows more than it can safely say. In kitchens, queues and factory yards the same facts circulate in low voices. The state still frightens people, but silence no longer convinces them."
 sov_1985_glasnost.1.a: "The whisper becomes political."
 sov_1985_glasnost.2.t: "The People No Longer Whisper"
 sov_1985_glasnost.2.d: "Fear has retreated faster than the party expected. People speak in meetings, newspapers and squares as if history has finally become public property."
 sov_1985_glasnost.2.a: "There is no return to silence."
 sov_1985_glasnost.3.t: "The Truth Hits Empty Shelves"
 sov_1985_glasnost.3.d: "Glasnost has taught the public to name the crisis. Empty shelves now look less like temporary shortages and more like evidence against the whole system."
 sov_1985_glasnost.3.a: "Soap, meat and truth."
 sov_1985_glasnost.4.t: "Directors Become Princes"
 sov_1985_glasnost.4.d: "Enterprise autonomy has given factory directors, ministry fixers and local brokers a new language of reform. Many speak of efficiency; many quietly build private kingdoms."
 sov_1985_glasnost.4.a: "The plan loosens its grip."
