l_english:
 ###################################################
 # NUCLEAR — Bhutto Warning
 ###################################################
 pak_1985_nuclear.1.t: "We Will Eat Grass"
 pak_1985_nuclear.1.d: "The Cabinet has been read the late Prime Minister's words again: 'We will eat grass, even go hungry, but we will get one of our own.' The Generals nod. The Finance Secretary pales. The Foreign Secretary thinks of the Pressler Amendment.\n\nWhat sort of programme will Pakistan run?"
 pak_1985_nuclear.1.o1: "Then we will eat grass."
 pak_1985_nuclear.1.o2: "Quietly. We confirm nothing."
 pak_1985_nuclear.1.o3: "First we feed the country."

 ###################################################
 # NUCLEAR — A Whisper from Kahuta
 ###################################################
 pak_1985_nuclear.10.t: "A Whisper from Kahuta"
 pak_1985_nuclear.10.d: "A foreign newspaper has published a sketch of our centrifuge halls. The annotations are wrong. The location is right. Khan is furious. The Generals demand action."
 pak_1985_nuclear.10.o1: "Tighten the perimeter."
 pak_1985_nuclear.10.o2: "Silence the press."
 pak_1985_nuclear.10.o3: "Deny everything publicly."

 ###################################################
 # NUCLEAR — Beijing's Quiet Hand
 ###################################################
 pak_1985_nuclear.20.t: "Beijing's Quiet Hand"
 pak_1985_nuclear.20.d: "A delegation from China's Ninth Academy has arrived in Islamabad with no luggage that anyone is allowed to inspect. The papers they carry could halve our development time."
 pak_1985_nuclear.20.o1: "Accept their assistance, in full."
 pak_1985_nuclear.20.o2: "Just a friendship visit. Nothing more."

 ###################################################
 # NUCLEAR — Suspicious Procurement
 ###################################################
 pak_1985_nuclear.30.t: "Suspicious Procurement in Europe"
 pak_1985_nuclear.30.d: "Dutch and German customs services have started asking pointed questions about a series of dual-use shipments. Our procurement chiefs ask for guidance: continue the operation, route through ISI cutouts, or pull the plug?"
 pak_1985_nuclear.30.o1: "Push forward at any cost."
 pak_1985_nuclear.30.o2: "Use ISI cutouts. Slower, safer."
 pak_1985_nuclear.30.o3: "Abort the operation."

 ###################################################
 # NUCLEAR — Pressler Pressure
 ###################################################
 pak_1985_nuclear.40.t: "Pressler Pressure Builds"
 pak_1985_nuclear.40.d: "Senator Pressler's amendment requires the President to certify, every fiscal year, that Pakistan does not possess a nuclear device. This year's certification is being held up. Cables from Foggy Bottom grow colder by the week."
 pak_1985_nuclear.40.o1: "Slow the program. Aid first."
 pak_1985_nuclear.40.o2: "Hide it better. Compartmentalize."
 pak_1985_nuclear.40.o3: "Ignore the pressure. Press on."

 ###################################################
 # NUCLEAR — News: Pakistan Has the Bomb
 ###################################################
 pak_1985_nuclear.50.t: "Pakistan Has the Bomb"
 pak_1985_nuclear.50.d: "Reuters, AFP and Press TV all carry the same story by morning: Pakistan has confirmed possession of a nuclear device. Delhi summons its security cabinet. Riyadh sends quiet congratulations. Washington's Senate is in uproar. The Cold War's calculus has shifted again."
 pak_1985_nuclear.50.o1: "The world reacts."
 pak_1985_nuclear.50.o2: "Pakistan stands as a nuclear power."

 ###################################################
 # NUCLEAR — Cold Test
 ###################################################
 pak_1985_nuclear.51.t: "The First Cold Test"
 pak_1985_nuclear.51.d: "Deep in the Chagai Hills, a sub-critical experiment delivers exactly the yield the calculations predicted. No flash, no crater, no announcement. Only a number on a screen, watched by a President who has not slept in three nights."
 pak_1985_nuclear.51.o1: "We are a nuclear power."

 ###################################################
 # INDIA — Delhi Takes Notice
 ###################################################
 pak_1985_indian.1.t: "Delhi Takes Notice"
 pak_1985_indian.1.d: "Indian Army Headquarters has begun openly war-gaming a strike on Kahuta. Indira Gandhi's death has not blunted Delhi's strategic instinct - it has sharpened it. RAW briefings warn the Indian Cabinet that Pakistan is months from a deliverable device."
 pak_1985_indian.1.o1: "Increase military readiness."
 pak_1985_indian.1.o2: "Publicly deny everything."
 pak_1985_indian.1.o3: "Signal resolve back."

 ###################################################
 # NUCLEAR — Cost of the Bomb
 ###################################################
 pak_1985_nuclear.100.t: "The Cost of the Bomb"
 pak_1985_nuclear.100.d: "Bread queues stretch through Lahore. Hospital wards run out of saline. Junior teachers have not been paid in three months. The Press is forbidden to print pictures, but the pictures still circulate."
 pak_1985_nuclear.100.o1: "We will not turn back now."
 pak_1985_nuclear.100.o2: "Slow down. We have proven enough."

 ###################################################
 # POLITICAL — Coup Risk
 ###################################################
 pak_1985_political.5.t: "The Generals Object"
 pak_1985_political.5.d: "Three Corps Commanders have requested an audience with the President. They wear their dress uniforms. They are not smiling. The Eighth Amendment may yet be put to its first test."
 pak_1985_political.5.o1: "Convince them. Concessions, but no surrender."
 pak_1985_political.5.o2: "Purge the disloyal officers."
 pak_1985_political.5.o3: "Yield. The army keeps its veto."

 ###################################################
 # POLITICAL — Civilian Government
 ###################################################
 pak_1985_political.10.t: "A New Civilian Pakistan"
 pak_1985_political.10.d: "For the first time in eight years, parties contest a real election. The PPP and the Muslim League take the new Assembly. The army watches from Rawalpindi - no longer the ruler, no longer the silent partner."
 pak_1985_political.10.o1: "A new chapter begins."
