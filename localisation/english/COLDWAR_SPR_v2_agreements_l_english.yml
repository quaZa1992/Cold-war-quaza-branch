l_english:
 # IMPERIA CW — Cold War: Spain V2 development and negotiated agreements.
  COLDWAR_SPR_energy_accounts:0 "The Energy Balance"
 COLDWAR_SPR_energy_accounts_desc:0 "Factories, transport and growing cities depend on a fuel and electricity system exposed to external supply. A credible energy policy must choose between faster conventional capacity and a more expensive nuclear programme."
 COLDWAR_SPR_nuclear_investment:0 "A Nuclear Programme"
 COLDWAR_SPR_nuclear_investment_desc:0 "Nuclear generation offers a different source of electricity, but requires capital, specialist personnel and a secure fuel cycle. The state will fund site and safety work before authorising construction through the existing investment system."
 COLDWAR_SPR_conventional_investment:0 "Conventional Capacity"
 COLDWAR_SPR_conventional_investment_desc:0 "Conventional stations can meet industrial demand with familiar technology and shorter construction schedules. That speed retains dependence on purchased fuel and ties future supply to foreign markets."
 COLDWAR_SPR_uranium_investment:0 "Uranium Surveys"
 COLDWAR_SPR_uranium_investment_desc:0 "Domestic uranium resources must be surveyed and evaluated before they can support the fuel cycle. A deposit is an opportunity for paid development, not a mine or automatic production."
 COLDWAR_SPR_energy_crisis_protocol:0 "Supply Contingencies"
 COLDWAR_SPR_energy_crisis_protocol_desc:0 "A supply interruption must not leave ministries competing for the same deliveries. Contingency plans will prioritise essential transport and public services, accepting administrative cost in exchange for a more coherent response."
 COLDWAR_SPR_industrial_adjustment:0 "Reconversion Fund"
 COLDWAR_SPR_industrial_adjustment_desc:0 "Industrial adjustment can destroy the communities it is meant to modernise. A funded retraining and redevelopment reserve will make closures and new investment part of the same policy."
 COLDWAR_SPR_reserve_law:0 "A Trained Reserve"
 COLDWAR_SPR_reserve_law_desc:0 "A territorial reserve can provide depth without keeping every soldier permanently under arms. Its usefulness depends on exercises, stores and mobilisation planning that divert resources from the standing force."
 COLDWAR_SPR_equipment_licensing:0 "Licensed Equipment"
 COLDWAR_SPR_equipment_licensing_desc:0 "Licensing can provide proven designs before domestic development is mature. Production improvements are useful only when the foreign owner actually grants a licence and the equipment can be supported locally."
 COLDWAR_SPR_us_bases_offer:0 "The US Agreement"
 COLDWAR_SPR_us_bases_offer_desc:0 "Access to facilities is a negotiable bilateral arrangement rather than automatic NATO membership. Spain can seek clearer terms and compensation while the United States retains the right to reject the proposal."
 COLDWAR_SPR_limited_access:0 "Restricted Facilities"
 COLDWAR_SPR_limited_access_desc:0 "The government can limit external use of Spanish facilities while continuing ordinary commerce. Greater discretion preserves freedom of action at the expense of assistance tied to the basing relationship."
 COLDWAR_SPR_bilateral_training:0 "Atlantic Contacts"
 COLDWAR_SPR_bilateral_training_desc:0 "Military contacts can improve training before formal membership is politically possible. Spain will seek exercises and exchanges as agreements among governments, without claiming the alliance's collective guarantees."
 COLDWAR_SPR_mediterranean_offer:0 "Mediterranean Contacts"
 COLDWAR_SPR_mediterranean_offer_desc:0 "Cooperation with neighbouring states does not require a permanent bloc commitment. Diplomatic and commercial contacts can broaden Spain's options while leaving every government in control of its own undertakings."
 COLDWAR_SPR_european_trade_offer:0 "The European Market"
 COLDWAR_SPR_european_trade_offer_desc:0 "The European market matters to Spanish industry even while political membership is closed. A preferential trade arrangement can prepare firms for wider competition without granting a seat in the Communities."
 COLDWAR_SPR_eec_application:0 "A European Application"
 COLDWAR_SPR_eec_application_desc:0 "Membership requires a political settlement acceptable to the existing members and a lengthy adjustment of domestic institutions. An application begins negotiations rather than completing them."
 COLDWAR_SPR_nato_application:0 "The Atlantic Question"
 COLDWAR_SPR_nato_application_desc:0 "The alliance question divides parties and services as well as foreign governments. A public mandate and an accepted admission agreement are separate requirements for a durable commitment."
 COLDWAR_SPR_sahara_conference:0 "The Saharan Question"
 COLDWAR_SPR_sahara_conference_desc:0 "The future of the Sahara involves its inhabitants, Spain and neighbouring states with incompatible claims. Negotiations must address administration, security and a political process without awarding another player's territory by focus."
 COLDWAR_SPR_sahara_transition_offer:0 "A Supervised Transition"
 COLDWAR_SPR_sahara_transition_offer_desc:0 "Spain can seek an agreed withdrawal timetable and political process under external supervision. Funding an orderly handover is a cost of ending the administration rather than a reward for disposing of it."
 COLDWAR_SPR_sahara_presence_offer:0 "A Continued Presence"
 COLDWAR_SPR_sahara_presence_offer_desc:0 "Maintaining an administration requires personnel, supplies and a defensible political mandate. A temporary continued presence will remain an expensive commitment subject to local and international opposition."
 COLDWAR_SPR_maghreb_commerce:0 "Maghreb Dialogue"
 COLDWAR_SPR_maghreb_commerce_desc:0 "Trade, migration and security link Spain to the southern shore. A regular diplomatic channel can manage disagreements without assuming that a single agreement resolves all territorial claims."
 COLDWAR_SPR_iberoamerican_credit:0 "Ibero-American Links"
 COLDWAR_SPR_iberoamerican_credit_desc:0 "Diplomatic ties across the Atlantic can support commercial and educational exchange. Spain must offer concrete cooperation rather than treating shared language as a claim to political obedience."
 COLDWAR_SPR_operating_generation_tt:0 "An owned and controlled nuclear reactor is producing electricity."
 COLDWAR_SPR_agreements_category:0 "Spanish Development and Agreements"
 COLDWAR_SPR_agreements_category_desc:0 "Fund national projects and negotiate commercial, defence and constitutional agreements with the governments concerned."
 COLDWAR_SPR_native_project_terms:0 "Prepare one paid investment project. Confirm the current price and construction period before committing funds."
 COLDWAR_SPR_project_confirm:0 "Authorise the investment"
 COLDWAR_SPR_project_cancel:0 "Defer construction"
 COLDWAR_SPR_project_13_title:0 "A Reactor Investment"
 COLDWAR_SPR_project_13_desc:0 "The ministry has prepared a site-specific proposal. The price reflects the current investment terms; construction will follow the normal project timetable."
 COLDWAR_SPR_project_12_title:0 "Conventional Generating Capacity"
 COLDWAR_SPR_project_12_desc:0 "The ministry has prepared a site-specific proposal. The price reflects the current investment terms; construction will follow the normal project timetable."
 COLDWAR_SPR_project_15_title:0 "Develop the Salamanca Deposits"
 COLDWAR_SPR_project_15_desc:0 "The ministry has prepared a site-specific proposal. The price reflects the current investment terms; construction will follow the normal project timetable."
 COLDWAR_SPR_project_price_tt:0 "Treasury: §R-$[?project_monetary_cost^-1|2] billion§!\nConstruction period: §Y[?project_total_construction_duration_display^-1|0] days§!\nOne paid project; normal energy, employment and fuel requirements apply."
 COLDWAR_SPR_energy_accounts_report:0 "The energy ministry reports current electricity output and fuel needs. New generating capacity must be funded and supplied throughout its operation."
 COLDWAR_SPR_review_accounts:0 "Review the national balance"
 COLDWAR_SPR_energy_accounts_values:0 "Electricity balance: §Y[?energy_balance|2]§!\nNuclear generation: §Y[?nuclear_energy_generation|2]§!\nReactor fuel consumption: §Y[?nuclear_fuel_consumption|2] per week§!"
 COLDWAR_SPR_v2_oil_shock:0 "Energy Supply Adjustment"
 COLDWAR_SPR_v2_oil_shock_desc:0 "Imported-energy disruption is forcing firms to adjust production and services."
 COLDWAR_SPR_v2_industrial_shock:0 "Industrial Adjustment"
 COLDWAR_SPR_v2_industrial_shock_desc:0 "Industrial reconversion is reducing output while displaced workers require support."
 COLDWAR_SPR_v2_funded_adjustment:0 "Funded Industrial Adjustment"
 COLDWAR_SPR_v2_funded_adjustment_desc:0 "The reconversion fund cushions the productivity loss while maintaining support for displaced workers."
 COLDWAR_SPR_energy_crisis_protocol_tt:0 "Later supply adjustment: civilian productivity §R-10%§! and office productivity §R-5%§! for §Y90 days§! instead of §Y180§!, while an owned reserve facility remains operational. The 1973 shock is unaffected."
 COLDWAR_SPR_industrial_adjustment_tt:0 "1980s industrial adjustment: civilian productivity §R-5%§! instead of §R-10%§! for §Y365 days§!. Social expenditure remains §R+10%§!."
 COLDWAR_SPR_law_cost:0 "£pol_power  §Y150§!"
 COLDWAR_SPR_reserve_law_tt:0 "Permit the next conscription law at its normal §Y150 Political Power§! cost and legal requirements. Enactment remains optional."
 COLDWAR_SPR_licensing_report:0 "The procurement service can arrange production of foreign designs through bilateral contracts. The exporter determines which equipment it is willing to license, and the agreement retains its normal industrial cost."
 COLDWAR_SPR_licensing_option:0 "Prepare a bilateral procurement request"
 COLDWAR_SPR_licensing_tt:0 "Use §YDiplomacy → Request Licence Production§! to select the exporter and equipment. The exporter must accept; normal civilian-industry licence costs apply."
 COLDWAR_SPR_accept:0 "Accept the proposed terms"
 COLDWAR_SPR_refuse:0 "Decline the proposal"
 COLDWAR_SPR_lapsed:0 "The proposal can no longer be concluded"
 COLDWAR_SPR_proposal_sent:0 "Submit these terms for the recipient government’s approval. The offer remains open for §Y90 days§!."
 COLDWAR_SPR_v2_commercial_project:0 "Spanish Commercial Cooperation"
 COLDWAR_SPR_v2_commercial_project_desc:0 "A funded commercial-services agreement supports offices for the duration of the project."
 COLDWAR_SPR_v2_sahara_interim:0 "Interim Saharan Administration"
 COLDWAR_SPR_v2_sahara_interim_desc:0 "Participating governments have accepted an interim Spanish administration, subject to review after 720 days."
 COLDWAR_SPR_v2_us_bases_offer_tt:0 "US Treasury: §R-$1.50 billion§!\nSpanish Treasury: §G+$1.50 billion§!\nUnited States receives military access to Spain for §Y720 days§!, subject to continued peace. The agreement creates no alliance."
 COLDWAR_SPR_v2_us_bases_offer_title:0 "The Spanish Facilities Agreement"
 COLDWAR_SPR_v2_us_bases_offer_desc:0 "Madrid proposes a temporary facilities agreement. The terms provide a single payment in return for agreed military access."
 COLDWAR_SPR_v2_limited_access_tt:0 "United States receives military access to Spain for §Y720 days§!, subject to continued peace. The agreement creates no alliance."
 COLDWAR_SPR_v2_limited_access_title:0 "Restricted Spanish Facilities"
 COLDWAR_SPR_v2_limited_access_desc:0 "Madrid proposes a limited, temporary access arrangement without a facilities payment."
 COLDWAR_SPR_v2_bilateral_training_tt:0 "Each government: Treasury §R-$0.30 billion§!, §G+20 Army Experience§! and §G+10 Air Experience§!."
 COLDWAR_SPR_v2_bilateral_training_title:0 "Joint Exercises with Spain"
 COLDWAR_SPR_v2_bilateral_training_desc:0 "The Spanish services propose a funded bilateral exercise to improve staff coordination."
 COLDWAR_SPR_v2_mediterranean_offer_tt:0 "Each government: Treasury §R-$0.50 billion§!; office productivity §G+5%§! for §Y720 days§!. Concurrent agreements do not stack the productivity bonus."
 COLDWAR_SPR_v2_mediterranean_offer_title:0 "Mediterranean Commercial Cooperation"
 COLDWAR_SPR_v2_mediterranean_offer_desc:0 "Spain proposes reciprocal commercial services and a joint contribution to their development."
 COLDWAR_SPR_v2_european_trade_offer_tt:0 "Establish a bilateral trade-adjustment channel. No membership, subsidy or compulsory market access is granted."
 COLDWAR_SPR_v2_european_trade_offer_title:0 "Spanish Trade Negotiations"
 COLDWAR_SPR_v2_european_trade_offer_desc:0 "Spain requests a regular trade-adjustment channel with the Communities. The arrangement confers no membership or financial obligation."
 COLDWAR_SPR_v2_eec_application_tt:0 "Recognise Spain’s candidacy. Every current Community member must assent before Spain receives candidate status. Admission retains the normal §Y50 Political Power§!, Europeanism, peace and legal requirements."
 COLDWAR_SPR_v2_eec_application_title:0 "Spain and the European Communities"
 COLDWAR_SPR_v2_eec_application_desc:0 "Spain requests assent to its candidacy. Legal adjustment and the normal Community admission requirements remain necessary."
 COLDWAR_SPR_v2_sahara_conference_tt:0 "Join the Saharan conference. Participation grants no territory, claim, core, military access or financial payment."
 COLDWAR_SPR_v2_sahara_conference_title:0 "A Conference on the Sahara"
 COLDWAR_SPR_v2_sahara_conference_desc:0 "Spain invites the interested governments to a conference on Saharan self-determination and the future administration of the territory."
 COLDWAR_SPR_v2_sahara_transition_offer_tt:0 "Accept a Saharan transition protocol and a non-aggression agreement with Spain. Finalisation requires every existing conference participant’s assent. Any territorial handover remains a separate agreement by the current owner."
 COLDWAR_SPR_v2_sahara_transition_offer_title:0 "A Supervised Saharan Transition"
 COLDWAR_SPR_v2_sahara_transition_offer_desc:0 "Spain proposes an agreed transition to Saharan self-government. A final settlement will require the participating governments to confirm their assent."
 COLDWAR_SPR_v2_sahara_presence_offer_tt:0 "Approve an interim administration of the territory Spain currently owns for §Y720 days§!. All conference participants must accept; no territorial transfer or new core is granted."
 COLDWAR_SPR_v2_sahara_presence_offer_title:0 "An Interim Saharan Administration"
 COLDWAR_SPR_v2_sahara_presence_offer_desc:0 "Spain proposes a temporary continuation of its existing administration, subject to a review after 720 days."
 COLDWAR_SPR_v2_maghreb_commerce_tt:0 "Each government: Treasury §R-$0.50 billion§!; office productivity §G+5%§! for §Y720 days§!. Concurrent agreements do not stack the productivity bonus."
 COLDWAR_SPR_v2_maghreb_commerce_title:0 "Maghreb Commercial Cooperation"
 COLDWAR_SPR_v2_maghreb_commerce_desc:0 "Spain proposes reciprocal commercial services with a funded contribution from both governments."
 COLDWAR_SPR_v2_iberoamerican_credit_tt:0 "Spanish Treasury: §R-$2.00 billion§!\nBorrower Treasury: §G+$2.00 billion§!\nBond obligation to Spain: §Y$2.00 billion§! at face value. Repayment uses the normal bilateral bond settlement."
 COLDWAR_SPR_v2_iberoamerican_credit_title:0 "Spanish Development Credit"
 COLDWAR_SPR_v2_iberoamerican_credit_desc:0 "Madrid offers a development bond at face value. The borrower receives the principal and accepts a matching obligation to Spain."
 COLDWAR_SPR_v2_ec_legal_adjustment:0 "Community Legal Adjustment"
 COLDWAR_SPR_v2_ec_legal_adjustment_desc:0 "Parliament and the ministries must reconcile commercial law and administrative obligations before presenting a complete accession application."
 COLDWAR_SPR_nato_application_tt:0 "Request admission through the NATO member-led voting procedure. Actual admission requires alliance approval; no membership is granted by the application."
 COLDWAR_SPR_v2_sahara_settlement:0 "Conclude the Saharan Transition"
 COLDWAR_SPR_v2_sahara_settlement_desc:0 "Conclude the accepted transition protocol and establish non-aggression agreements between Spain and every participating government. Territorial administration remains subject to a separate agreement by its current owner."
 COLDWAR_SPR_v2_review_sahara_administration:0 "Review the Interim Administration"
 COLDWAR_SPR_v2_review_sahara_administration_desc:0 "The 720-day interim protocol has expired. Reopen negotiations so that every participant can consider renewed terms for a further period."
 COLDWAR_SPR_declined_title:0 "A Proposal Declined"
 COLDWAR_SPR_declined_desc:0 "The other government has declined the proposed terms. No payment or agreement has been concluded."
 COLDWAR_SPR_expired_title:0 "A Proposal Has Expired"
 COLDWAR_SPR_expired_desc:0 "A diplomatic proposal has reached the end of its acceptance period. Fresh terms may now be submitted."
 COLDWAR_SPR_quote_changed_title:0 "Investment Terms Have Changed"
 COLDWAR_SPR_quote_changed_desc:0 "The project price, timetable or eligibility changed before authorisation. No funds were committed. The ministry can prepare a fresh proposal."
 COLDWAR_SPR_noted:0 "Take note"
