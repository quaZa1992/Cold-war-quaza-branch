l_english:
# IMPERIA CW — Cold War: Imperia gc events bond crisis — English localisation.
 imp_bond_crisis_done: "Bond Crisis has been triggered."
 imp_bond_crisis: "Broken Bond Market"
 imp_bond_crisis_desc: "The collapse of trust in sovereign debt has shattered global financial stability."

 imp_currency_devaluation: "Currency Devaluation"
 imp_currency_devaluation_desc: "Rapid loss of currency value is driving up inflation and eroding public confidence."
 imp_currency_devaluation_min: "Minor Currency Devaluation"
 imp_currency_devaluation_min_desc: "Loss of currency value is driving up inflation and eroding public confidence."

 imp_global_recession_bonds: "Global Recession"
 imp_global_recession_bonds_desc: "The world economy is contracting as trade, industry, and employment collapse."
 imp_global_recession_bonds_min: "Global Recession"
 imp_global_recession_bonds_minmin: "Global Recession"
 imp_global_recession_bonds_min_desc: "The world economy is contracting as trade, industry, and employment collapse."
 imp_global_recession_bonds_minmin_desc: "The world economy is contracting as trade, industry, and employment collapse."

 imp_reduced_oil_demand: "Reduced Oil Demand"
 imp_reduced_oil_demand_desc: "With our economy in recession, reliance on oil is heavily decreased."

 imp_bond_crisis.1.t: "Bond Market collapses!"
 imp_bond_crisis.1.d: "This morning, [?global.bond_crisis_starter.GetAdjective] banks have begun to dump trillions in dollars worth of bonds. Within hours, as global financial centers opened, investors responded with outright panic. Interest rates are already spiking, equity indices are plunging and fears of a global recession are mounting. Analysts are now warning that the value of major currencies could be the next to collapse, as confidence in the global financial system is eroding."
 imp_bond_crisis.1.o1: "Oh no."

 imp_bond_crisis.2.t: "Major currencies Plumet!"
 imp_bond_crisis.2.d: "In response to the ongoing turmoil in global bond markets, which started with a sell-off of massive amounts of [?global.bond_crisis_starter.GetAdjective] bonds, global confidence in major currencies is plummeting. Currencies across the world are losing value and gold prices are beginning to surge to historic highs as investors seek stability and safety from the onslaught. The sudden devaluation is sparking acute inflation fears and is beginning to destabilize weak and fragile economies."
 imp_bond_crisis.2.o1: "Now what?"
 imp_bond_crisis.2.o2: "Now what?"

 imp_bond_crisis.3.t: "The [?global.year] [?global.bond_crisis_starter.GetAdjective] Financial Crisis"
 imp_bond_crisis.3.d: "It is now almost certain that the global economy is heading for a deep recession, following the chaos of the past two weeks. Trade volumes continue to shrink as supply chains unraval and global demand falls. Factories are beginning to idle, with production slowing to a crawl in many industrial centers. Unemployment rates are expected to rise rapidly as businesses cut back or shutter entirely. The road to recovery looks uncertain and fraught with challenges because confidence in the global economic system is currently on an extended hiatus."
 imp_bond_crisis.3.o1: "What did I do to deserve this?"
 imp_bond_crisis.3.o2: "What did I do to deserve this?"
 imp_bond_crisis.3.o3: "Maybe it won't be so bad?"
 imp_bond_crisis_tt: "§YDecisions to mitigate the effects of the Financial Crisis are now available in the Financial Crisis tab.\n\nDuring the Financial crisis, nations with higher globalism have a higher chance to receive harmful events.§!"

 imp_bond_crisis.4.t: "Oil Prices Crash!"
 imp_bond_crisis.4.d: "With global economies grinding to a halt, oil prices are collapsing. Demand for fuel is plummeting amid factory shutdowns, grounded airlines and severely reduced global trade. Storage facilities are rapidly reaching capacity and producers are forced to flood the market with the supply they do have. The resulting price crash marks one of the most severe downturns the energy sector has faced in decades."
 imp_bond_crisis.4.o1: "A minor relief...?"
 imp_bond_crisis.4.o2: "Oh no!"

 imp_bond_crisis.5.t: "Crisis Easing"
 imp_bond_crisis.5.d: "Signs of recovery are beginning to emerge and markets are stabilizing. Whether or not our government has enacted sweeping reforms, we are now at a point where public confidence is returning. The scars of this crisis may remain and the road ahead might be uncertain, but the immediate danger appears to have passed. The global economy is less and less in freefall, but will it ever the same?"
 imp_bond_crisis.5.o1: "Finally"

 imp_bond_crisis_decisions: "Global Financial Crisis"
 imp_bond_crisis_decisions_desc: "A complex cascade of economic imbalances, speculative excesses, and institutional weaknesses has triggered a severe downturn in the global economy. Markets are in disarray, major financial institutions teeter on the brink, and governments scramble to respond. The full consequences remain unclear, but the world is entering a period of uncertainty and instability that will test even the strongest nations."

 d_imp_bond_crisis_1: "Secure Inner Circle"
 d_imp_bond_crisis_1_desc: "In the face of mounting instability, our leadership can turn inwards, relying on a trusted circle of allies and loyalists who will maintain control. We will hand out positions of power not by merit, but based on loyalty."
 d_imp_bond_crisis_2: "Emergency Interest Rate Cuts"
 d_imp_bond_crisis_2_desc: "In an effort to stabilize the collapsing bond market and prevent interest rates from spiralling out of control, we can instruct our central bank to slash interest rates."
 d_imp_bond_crisis_3: "Implement Quantitative Easing"
 d_imp_bond_crisis_3_desc: "To inject liquidity into our economy, the central bank can begin to purchase government bonds and financial assets on a massive scale. This unconvential measure is intended to take the hurt away from the current crisis and hopefully stabilize financial markets. However, critics warn that this may create asset bubbles in the futures."
 d_imp_bond_crisis_4: "Implement Banking Regulations"
 d_imp_bond_crisis_4_desc: "We can implement stricter capital requirements and put limits on risky lending practises to prevent further instability."
 d_imp_bond_crisis_5: "Enact Capital Controls"
 d_imp_bond_crisis_5_desc: "To prevent mass capital flight and stabilize our national currency, we can place emergency restrictions on the movement of money across borders. We will place limits on foreign transfers, investments and withdrawals."