# IMPERIA CW — Cold War: PER Abu Musa 1970 — English localisation.
 COLDWAR_PER_abu_musa_category:0 "The Abu Musa Dispute"
 COLDWAR_PER_abu_musa_category_desc:0 "Sharjah administers Abu Musa under British protection, while Iran maintains a competing claim. Britain's approaching departure presents an opportunity to press the issue. The November 1971 arrangement historically admitted Iranian forces while preserving Sharjah's civil jurisdiction; a forcible seizure is a different course."
 COLDWAR_PER_prepare_abu_musa:0 "Prepare an Abu Musa Landing"
 COLDWAR_PER_prepare_abu_musa_desc:0 "The navy can concentrate landing craft, staff and supplies for a short operation near the Strait of Hormuz. Preparations become possible during the final 90 days of an agreed British withdrawal, after the coast becomes independent, or during an existing war. This concentration is costly and cannot be sustained indefinitely."
 COLDWAR_PER_assert_abu_musa:0 "Enforce the Abu Musa Claim"
 COLDWAR_PER_assert_abu_musa_desc:0 "With landing preparations complete, Tehran can press its claim to Abu Musa by force and sustain the mobilisation for a further 90 days. The final day before the agreed British withdrawal offers the historical opening; actual independence provides another. Sharjah's administration and the competing sovereignty claims make escalation a serious diplomatic choice. British protection still carries the risk of British intervention until the treaty relationship ends."
 COLDWAR_PER_abu_musa_landing_preparations:0 "Abu Musa Landing Preparations"
 COLDWAR_PER_abu_musa_landing_preparations_desc:0 "Landing craft and naval personnel are concentrated for a brief operation at the entrance to the Gulf. Faster preparation and greater assault capacity depend on an expensive temporary mobilisation. The operation concerns Abu Musa; the Tunbs dispute follows a different history."
 COLDWAR_PER_abu_musa_coercion:0 "Iranian Pressure over Abu Musa"
 COLDWAR_PER_can_prepare_abu_musa_tt:0 "An independent Iran can prepare a landing while Abu Musa remains under UAE administration outside an agreed arbitration settlement, during the final 90 days of British withdrawal, after UAE independence, or during war with the UAE."
 COLDWAR_PER_can_assert_abu_musa_tt:0 "An independent Iran, at peace with the UAE, has funded landing preparations; Abu Musa remains under UAE administration without an agreed arbitration settlement, and British withdrawal is due within 24 hours or the UAE is independent."
