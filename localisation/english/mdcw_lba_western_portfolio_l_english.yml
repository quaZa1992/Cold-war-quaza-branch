l_english:
 LBA_libyan_capital_inflows: "Libyan Capital Inflows"
 LBA_libyan_capital_inflows_desc: "Libyan money is flowing into selected banks, firms and infrastructure portfolios. The arrangement is politically awkward, but economically useful.\n\n§RThis spirit is removed if we impose economic or financial sanctions on Libya, or if Muammar Gaddafi no longer rules Libya.§!"
 LBA_western_portfolio_returns: "Western Portfolio Returns"
 LBA_western_portfolio_returns_desc: "Libyan holdings in Western markets are producing financial returns and quiet leverage over governments that would otherwise prefer a harder line."
 LBA_gaddafis_western_portfolio_dynamic_modifier: "Gaddafi's Western Portfolio"
 LBA_gaddafis_western_portfolio_dynamic_modifier_desc: "Libyan oil wealth has been converted into stakes, accounts and useful dependencies abroad."
 LBA_gaddafis_western_portfolio_income_tt: "Each active Western portfolio partner grants §G+0.1B§! additional income and improves Libyan investment returns. Current active partners: §Y[?LBA_western_portfolio_partners|0]§!."
 LBA_libyan_trade_relationships: "Libyan Trade Relationships"
 LBA_western_investment_offer_tt: "The target country will receive an event and may accept or reject a Libyan investment package. Acceptance grants a permanent §G-2.00% Consumer Goods§! modifier and §G+10 Libyan trade relations§!.\n\n§RThis modifier is removed if the country imposes economic or financial sanctions on Libya, or if Muammar Gaddafi no longer rules Libya.§!\n\nEach active accepted deal increases §YGaddafi's Western Portfolio§! for Libya by §G+0.1B additional income§! and higher investment returns."
 LibyaColdWar.10.t: "Libyan Investment Proposal"
 LibyaColdWar.10.d: "[FROM.GetNameDef] has offered a discreet investment package aimed at banks, energy, construction and strategic industry. Accepting would reduce consumer goods pressure and improve trade relations with Libya, but it would also make our Libya policy more complicated.\n\n§RThe benefit will be removed if we impose economic or financial sanctions on Libya, or if Muammar Gaddafi no longer rules Libya.§!"
 LibyaColdWar.10.a: "Take the money."
 LibyaColdWar.10.b: "Reject the arrangement."
