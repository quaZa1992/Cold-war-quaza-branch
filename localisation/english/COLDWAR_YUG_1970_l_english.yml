 COLDWAR_YUG_kom_the_southern_flank_of_the_camp: "The Southern Flank of the Camp"
 COLDWAR_YUG_kom_the_southern_flank_of_the_camp_desc: "The southern flank of the camp is well ordered and well defended."
 COLDWAR_YUG_prx_press_freedom: "Press Freedom"
 COLDWAR_YUG_prx_press_freedom_desc: "A free press brings small research gains."
