 COLDWAR_YUG_brotherhood_unity_category_desc: "Discontent of the eight federal units (0 to 100; crisis at 75, breaking point at 90):\nSlovenia: §Y[?COLDWAR_YUG_disc_slovenia|0]§!\nCroatia: §Y[?COLDWAR_YUG_disc_croatia|0]§!\nSerbia: §Y[?COLDWAR_YUG_disc_serbia|0]§!\nBosnia and Herzegovina: §Y[?COLDWAR_YUG_disc_bosnia|0]§!\nMontenegro: §Y[?COLDWAR_YUG_disc_montenegro|0]§!\nMacedonia: §Y[?COLDWAR_YUG_disc_macedonia|0]§!\nKosovo: §Y[?COLDWAR_YUG_disc_kosovo|0]§!\nVojvodina: §Y[?COLDWAR_YUG_disc_vojvodina|0]§!"
 COLDWAR_YUG_economy_category: "The Yugoslav Economy"
 COLDWAR_YUG_economy_category_desc: "Debt, tourism and contracts abroad."
 COLDWAR_YUG_programmes_category: "The Programmes of the Federation"
 COLDWAR_YUG_programmes_category_desc: "Measures unlocked by the national focus."
 COLDWAR_YUG_offers_category: "Offers from Belgrade"
 COLDWAR_YUG_offers_category_desc: "Proposals Belgrade has sent us."
 COLDWAR_YUG_succession_wars_category: "The Wars of Yugoslav Succession"
 COLDWAR_YUG_succession_wars_category_desc: "Fronts, uprisings and recognition. War exhaustion: §Y[?COLDWAR_YUG_war_exhaustion|0]§!. Exposure: §Y[?COLDWAR_YUG_exposure|0]§!. Reunification count (Belgrade): §Y[?SER.COLDWAR_YUG_reunif_count|0]§! of 6. Surrender limit above +100% taken back by the cap: §Y[?COLDWAR_YUG_surrender_excess_neg|%]§!."
 COLDWAR_YUG_dirty_war_category: "The Dirty War"
 COLDWAR_YUG_dirty_war_category_desc: "Short offensive edges, paid in people, refugees and exposure (now §Y[?COLDWAR_YUG_exposure|0]§!)."
 COLDWAR_YUG_recognition_category: "The Yugoslav Question"
 COLDWAR_YUG_recognition_category_desc: "The federation in the Balkans has broken apart. The capitals of the world take sides."
 COLDWAR_YUG.1.t: "Tito Is Dead"
 COLDWAR_YUG.1.d: "Ljubljana, 4 May 1980, 15:05. The Marshal is dead. The Blue Train carries him to Belgrade, and 128 delegations come to the funeral. Now the presidency rotates every May."
 COLDWAR_YUG.1.a: "Comrade Tito, we swear to you."
 COLDWAR_YUG.2.t: "The Debt Wall"
 COLDWAR_YUG.2.d: "The creditors in Frankfurt and New York want their money back. Petrol is rationed to forty litres a month; the shops empty."
 COLDWAR_YUG.2.a: "Tighten the belts."
 COLDWAR_YUG.10.t: "The Croatian Spring"
 COLDWAR_YUG.10.d: "Students strike in Zagreb and Matica hrvatska demands that Croatia keep the dollars it earns on the coast."
 COLDWAR_YUG.10.a: "Concede."
 COLDWAR_YUG.10.b: "Crack down."
 COLDWAR_YUG.11.t: "The Pristina Demonstrations"
 COLDWAR_YUG.11.d: "It began in the student canteen; now the crowds in Pristina shout for a Kosovo Republic."
 COLDWAR_YUG.11.a: "Concede."
 COLDWAR_YUG.11.b: "Crack down."
 COLDWAR_YUG.12.t: "The Meetings of Truth"
 COLDWAR_YUG.12.d: "Buses from every Serbian town bring the crowds to the squares: the leadership must answer to the people."
 COLDWAR_YUG.12.a: "Concede."
 COLDWAR_YUG.12.b: "Crack down."
 COLDWAR_YUG.13.t: "Mladina and the JBTZ Trial"
 COLDWAR_YUG.13.d: "A military court tries a journalist in Serbo-Croatian, in Ljubljana. The whole of Slovenia signs the petition."
 COLDWAR_YUG.13.a: "Concede."
 COLDWAR_YUG.13.b: "Crack down."
 COLDWAR_YUG.14.t: "The Agrokomerc Affair"
 COLDWAR_YUG.14.d: "Promissory notes without cover: the Velika Kladusa combine has printed its own money, and half the Bosnian leadership signed."
 COLDWAR_YUG.14.a: "Concede."
 COLDWAR_YUG.14.b: "Crack down."
 COLDWAR_YUG.15.t: "The Yoghurt Revolution"
 COLDWAR_YUG.15.d: "The workers of Niksic march on Titograd and the leadership resigns under a rain of yoghurt cups."
 COLDWAR_YUG.15.a: "Concede."
 COLDWAR_YUG.15.b: "Crack down."
 COLDWAR_YUG.16.t: "The Yoghurt Revolution in Novi Sad"
 COLDWAR_YUG.16.d: "Crowds from Serbia proper surround the provincial assembly in Novi Sad."
 COLDWAR_YUG.16.a: "Concede."
 COLDWAR_YUG.16.b: "Crack down."
 COLDWAR_YUG.17.t: "The Name Question"
 COLDWAR_YUG.17.d: "Athens and Sofia contest the very name of the republic; Skopje answers in the streets."
 COLDWAR_YUG.17.a: "Concede."
 COLDWAR_YUG.17.b: "Crack down."
 COLDWAR_YUG.20.t: "The Crisis of the Federation"
 COLDWAR_YUG.20.d: "The presidency meets in emergency session. Three republics refuse the federal budget, the Territorial Defence guards the republican borders, and the JNA waits for an order."
 COLDWAR_YUG.20.a: "Offer a Confederation."
 COLDWAR_YUG.20.b: "Declare a State of Emergency."
 COLDWAR_YUG.20.c: "Let Them Go."
 COLDWAR_YUG.21.t: "The Confederation Fails"
 COLDWAR_YUG.21.d: "The confederal union was a truce, not a peace. The republics leave the last federal bodies."
 COLDWAR_YUG.21.a: "So it ends."
 COLDWAR_YUG.30.t: "Our Own Army"
 COLDWAR_YUG.30.d: "The Territorial Defence answers to us now: the rifles in the village halls, the depots in the hills. Where the JNA split, a whole corps came over."
 COLDWAR_YUG.30.a: "To the borders."
 COLDWAR_YUG.40.t: "Journalists at the Front"
 COLDWAR_YUG.40.d: "Foreign camera crews film the burned villages. Tonight the pictures run in every European capital."
 COLDWAR_YUG.40.a: "Deny everything."
 COLDWAR_YUG.41.t: "Mass Graves Found"
 COLDWAR_YUG.41.d: "Investigators open a field near the front line. What they find is reported around the world."
 COLDWAR_YUG.41.a: "We were not there."
 COLDWAR_YUG.42.t: "The Tribunal Indicts"
 COLDWAR_YUG.42.d: "The international tribunal in The Hague publishes an indictment. Our leader's name is on it."
 COLDWAR_YUG.42.a: "They have no jurisdiction here."
 COLDWAR_YUG.43.t: "Extradition Demanded"
 COLDWAR_YUG.43.d: "The tribunal demands that we hand over the accused. Credits, recognition and trade depend on the answer."
 COLDWAR_YUG.43.a: "Hand them over."
 COLDWAR_YUG.43.b: "Refuse."
 COLDWAR_YUG.50.t: "Refugees Arrive"
 COLDWAR_YUG.50.d: "Columns of tractors and buses cross the lines: our people, driven from their homes."
 COLDWAR_YUG.50.a: "Take them in."
 COLDWAR_YUG.51.t: "The Country Rallies"
 COLDWAR_YUG.51.d: "The news from the front lines hardens every heart."
 COLDWAR_YUG.51.a: "We will not forget."
 COLDWAR_YUG.60.t: "[From.GetName] Recognises Us"
 COLDWAR_YUG.60.d: "[From.GetName] has recognised our independence. Embassies open; credits may follow."
 COLDWAR_YUG.60.a: "A state among states."
 COLDWAR_YUG.61.t: "[From.GetName] Recognises a Breakaway State"
 COLDWAR_YUG.61.d: "Another capital has recognised one of the republics that left us."
 COLDWAR_YUG.61.a: "They will regret it."
 COLDWAR_YUG.62.t: "[From.GetName] Backs Belgrade"
 COLDWAR_YUG.62.d: "[From.GetName] stands by the government in Belgrade."
 COLDWAR_YUG.62.a: "We have friends."
 COLDWAR_YUG.63.t: "Belgrade Asks for Recognition"
 COLDWAR_YUG.63.d: "The government in Belgrade asks us to recognise it as the lawful continuation of Yugoslavia."
 COLDWAR_YUG.63.a: "Recognise Belgrade."
 COLDWAR_YUG.63.b: "Ignore the request."
 COLDWAR_YUG.64.t: "Belgrade Asks for a Seat in the Pact"
 COLDWAR_YUG.64.d: "Yugoslavia asks to join our alliance."
 COLDWAR_YUG.64.a: "Welcome Belgrade."
 COLDWAR_YUG.64.b: "Not now."
 COLDWAR_YUG.70.t: "A Long War"
 COLDWAR_YUG.70.d: "Neighbour against neighbour: nobody here gives up a village while the next one still stands."
 COLDWAR_YUG.70.a: "We fight on."
 COLDWAR_YUG.80.t: "The Banks Collapse"
 COLDWAR_YUG.80.d: "Dafiment and Jugoskandik close their doors. The savings of a whole country are gone."
 COLDWAR_YUG.80.a: "Nobody could have known."
 COLDWAR_YUG.100.t: "A Proposal from Belgrade"
 COLDWAR_YUG.100.d: "The Yugoslav government has sent us a proposal. It waits in the decision category 'Offers from Belgrade'."
 COLDWAR_YUG.100.a: "We will consider it."
 COLDWAR_YUG.101.t: "[From.GetName] Accepts"
 COLDWAR_YUG.101.d: "[From.GetName] has accepted our proposal."
 COLDWAR_YUG.101.a: "Excellent."
 COLDWAR_YUG.102.t: "[From.GetName] Declines"
 COLDWAR_YUG.102.d: "[From.GetName] has turned down our proposal."
 COLDWAR_YUG.102.a: "Unfortunate."
 COLDWAR_YUG.200.t: "Discontent Returns"
 COLDWAR_YUG.200.d: "The anger comes back."
 COLDWAR_YUG.200.a: "OK"
