 COLDWAR_YUG_skj_the_letter_desc: "Tito's letter brings the League back to discipline and watchfulness."
 COLDWAR_YUG_skj_the_open_tribune: "The Open Tribune"
 COLDWAR_YUG_skj_the_open_tribune_desc: "A public debate inside the League lets new ideas and cheap advice flow."
 COLDWAR_YUG_skj_cadre_discipline: "Cadre Discipline"
 COLDWAR_YUG_skj_cadre_discipline_desc: "The Tenth Congress ties the cadres to one line."
 COLDWAR_YUG_skj_pluralism_of_interests: "Pluralism of Interests"
 COLDWAR_YUG_skj_pluralism_of_interests_desc: "Many interests get a voice in the League, which helps research and schools."
 COLDWAR_YUG_skj_the_delegate_system: "The Delegate System"
 COLDWAR_YUG_skj_the_delegate_system_desc: "Delegates from every workplace make advisors cheaper to appoint."
 COLDWAR_YUG_skj_the_firm_hand: "The Firm Hand"
 COLDWAR_YUG_skj_the_firm_hand_desc: "A hard line against the Croatian movement raises defences and weeds out resistance."
 COLDWAR_YUG_skj_federalise_the_federation: "Federalise the Federation"
 COLDWAR_YUG_skj_federalise_the_federation_desc: "Republics keep more of their income, which cuts the price of political advisors."
 COLDWAR_YUG_skj_associated_labour: "Associated Labour"
 COLDWAR_YUG_skj_associated_labour_desc: "Workers' organisations run enterprises, which steadies the state but slows output."
 COLDWAR_YUG_skj_the_trepca_exports: "The Trepca Exports"
 COLDWAR_YUG_skj_the_trepca_exports_desc: "Trepca ore and metal exports bring in market income and cheaper goods."
 COLDWAR_YUG_skj_social_compacts: "Social Compacts"
 COLDWAR_YUG_skj_social_compacts_desc: "Agreed prices and wages ease household costs and social spending."
 COLDWAR_YUG_skj_the_federal_price_office: "The Federal Price Office"
 COLDWAR_YUG_skj_the_federal_price_office_desc: "A federal office holds prices down and lowers the interest burden."
 COLDWAR_YUG_skj_the_autoput_dividend: "The Autoput Dividend"
 COLDWAR_YUG_skj_the_autoput_dividend_desc: "The new highway pays back in trade income and productivity."
 COLDWAR_YUG_skj_the_river_fleet: "The River Fleet"
 COLDWAR_YUG_skj_the_river_fleet_desc: "River barges and dredgers lift market income and ease consumer goods supply."
 COLDWAR_YUG_skj_the_new_international_economic_order: "The New International Economic Order"
 COLDWAR_YUG_skj_the_new_international_economic_order_desc: "Yugoslavia leads a Third World trade agenda for fair terms."
 COLDWAR_YUG_skj_democratic_centralism: "Democratic Centralism"
 COLDWAR_YUG_skj_democratic_centralism_desc: "The League decides with one voice again and trims the apparatus."
 COLDWAR_YUG_skj_statehood_for_the_republics: "Statehood for the Republics"
 COLDWAR_YUG_skj_statehood_for_the_republics_desc: "Republics build their own roads and banks."
