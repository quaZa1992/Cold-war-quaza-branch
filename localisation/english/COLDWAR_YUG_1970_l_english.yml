 FOCUS_FILTER_COLDWAR_YUG_SERBIA: "Serbia: The Wars of Succession"
 COLDWAR_YUG_skj_e: "The League of Communists"
 COLDWAR_YUG_skj_e_desc: "Tito still rides the Blue Train and the League still holds the country together, but since the Ninth Congress every republican party writes its own statute. The question is no longer who rules, but whether the centre still means anything."
 COLDWAR_YUG_skj_pol: "The Line of the Ninth Congress"
 COLDWAR_YUG_skj_pol_desc: "The congress gave every republic its quota of the presidium and every province its voice. The federal party now governs by counting: one Slovene here, one Macedonian there, and never two Serbs in a row."
 COLDWAR_YUG_skj_eco: "Samoupravljanje Is Our Road"
 COLDWAR_YUG_skj_eco_desc: "Neither the Soviet plan nor the Western market: the workers' council elects the director, the factory keeps its income, and the party watches from the side. The showpieces stand in Slovenia, while Sarajevo and Titograd see the capital go to the plants that already earn."
 COLDWAR_YUG_skj_lw1: "The Executive Bureau"
 COLDWAR_YUG_skj_lw1_desc: "Tito wants fifteen men around one table who can say yes without asking eight capitals. Stane Dolanc, a young Slovene, becomes the secretary who carries the Marshal's word to every republican party."
 COLDWAR_YUG_skj_a1: "The Firm Hand at Karadjordjevo"
 COLDWAR_YUG_skj_a1_desc: "Karadjordjevo, December 1971: Tito summons the Croatian leadership to his hunting lodge and tells them the street has gone too far. Savka and Tripalo resign, the students go home, and the old fear returns to Zagreb."
 COLDWAR_YUG_skj_a2: "Federalise the Federation"
 COLDWAR_YUG_skj_a2_desc: "Bakaric has the formula: federalise the federation. Let the republics keep the currency their hotels and ships earn, let them run their own banks, and the nationalists have nothing left to shout about."
 COLDWAR_YUG_skj_b1: "Associated Labour"
 COLDWAR_YUG_skj_b1_desc: "Kardelj wants the market tamed without bringing back the planners: every workshop becomes a basic organisation of associated labour, and everything else is a compact between them. Thousands of contracts replace the price."
 COLDWAR_YUG_skj_b2: "The Republics Borrow and Build"
 COLDWAR_YUG_skj_b2_desc: "The republican banks borrow in Frankfurt and New York, and every republic builds its own steel mill, its own refinery and its own airport. The credit is cheap, the ribbons are cut, and the bill comes later."
 COLDWAR_YUG_skj_un1: "The Federal Fund Renewed"
 COLDWAR_YUG_skj_un1_desc: "The Fund for the Underdeveloped gets a new five year mandate and Kosovo takes the biggest share: Trepca's mines, the new university next to the old bazaar, a road to every district. In Ljubljana and Zagreb the papers ask why Slovene and Croat workers pay for it."
 COLDWAR_YUG_skj_lw2a: "Tito's Letter to the League"
 COLDWAR_YUG_skj_lw2a_desc: "September 1972: a letter over Tito's name goes to every cell. The liberals of Belgrade and Ljubljana are named, the League is a fighting organisation again, and the men who spoke of a modern Serbia clear their desks."
 COLDWAR_YUG_skj_lw2b: "A Discussion in the League"
 COLDWAR_YUG_skj_lw2b_desc: "No letter goes out. The Executive Bureau lets the cells argue, Komunist prints the liberals next to the loyalists, and Tito for once listens. The League learns to disagree without expelling anyone."
 COLDWAR_YUG_skj_a1f: "Democratic Centralism Restored"
 COLDWAR_YUG_skj_a1f_desc: "The new men in Zagreb, Ljubljana and Belgrade owe their posts to the Executive Bureau. Milka Planinc runs the Croatian League with a hard hand, and nobody in the republics speaks of the national question at congresses any more."
 COLDWAR_YUG_skj_a2f: "Statehood for the Republics"
 COLDWAR_YUG_skj_a2f_desc: "The amendments of 1971 call the republics states, and the republics begin to behave like states. Zagreb opens its own bank abroad, Ljubljana its own trade office, and the federal ministries shrink to a corridor."
 COLDWAR_YUG_skj_b1f: "Basic Organisations of Associated Labour"
 COLDWAR_YUG_skj_b1f_desc: "In every factory hall the workers vote on the income of their own unit, from the welders to the canteen. Nobody gets fired, nobody gets rich, and the meetings last until the night shift."
 COLDWAR_YUG_skj_b2f: "Political Factories"
 COLDWAR_YUG_skj_b2f_desc: "A steel mill in Smederevo, an aluminium plant in Mostar, a ferronickel works in Macedonia: every republic must have its own giant, whether there is ore, water or a market or not. The locals call them political factories."
 COLDWAR_YUG_skj_un2a: "Social Compacts"
 COLDWAR_YUG_skj_un2a_desc: "Instead of a planner's order and instead of a price war, the republics, the chambers of commerce and the unions sign compacts on prices, wages and investment. Nobody in Belgrade sets a price; on paper the inflation is tamed."
 COLDWAR_YUG_skj_un2b: "A Federal Price Office"
 COLDWAR_YUG_skj_un2b_desc: "Every shopper in every republic should pay the same for bread, oil and shoes, so a federal office with its inspectors and its stamps decides what may cost what. The republics grumble, and the shelves stay full."
 COLDWAR_YUG_skj_lw3a: "The Tenth Congress"
 COLDWAR_YUG_skj_lw3a_desc: "May 1974 in the Sava Centre: the Congress turns the Letter into a statute. Every card is checked, every cell reports, and Tito is elected President of the League without a term. The debate of the Seventies is closed."
 COLDWAR_YUG_skj_lw3b: "The League Opens to the Young"
 COLDWAR_YUG_skj_lw3b_desc: "Kardelj tells the League it is no longer the only voice: unions, chambers, communes and the youth each speak for their own interest, and the League must win them by argument. The students of 1968 are invited into the cells instead of the courts."
 COLDWAR_YUG_skj_pm: "The Constitution of 1974"
 COLDWAR_YUG_skj_pm_desc: "Kardelj's masterpiece gives every republic and both provinces a seat in the presidency of nine and a near veto at home. Novi Sad celebrates its own presidency, and Belgrade learns that Serbia cannot decide without Pristina and Novi Sad."
 COLDWAR_YUG_skj_em: "The Social Plan 1976 to 1980"
 COLDWAR_YUG_skj_em_desc: "The social plan for 1976 to 1980 promises growth of seven percent a year, steel, energy and a car in every courtyard. Nobody plans; everyone agrees."
 COLDWAR_YUG_skj_un3a: "The Highway of Brotherhood and Unity"
 COLDWAR_YUG_skj_un3a_desc: "The youth brigades of 1948 built the first stretch. Now the republics sign a compact to finish the second lane down the Vardar to the Greek border, with the Zastavas and Mercedes of the Gastarbeiter roaring home from Munich. Sarajevo and Titograd still wait for a tarmac road of their own."
 COLDWAR_YUG_skj_un3b: "The Danube and Sava Waterway"
 COLDWAR_YUG_skj_un3b_desc: "Why pour concrete when the rivers are already there? From the canals of the Banat to the Sava quays of Slavonski Brod, barges carry coal, grain and ore for a fraction of the lorry price, and the Danube opens the road to Vienna and the Black Sea."
 COLDWAR_YUG_skj_lw4: "The Delegate System"
 COLDWAR_YUG_skj_lw4_desc: "No more deputies who answer to nobody: every enterprise, every commune and every socio political organisation sends delegates, and the delegates elect the assemblies. Kardelj calls it the end of the state; the clerks call it overtime."
 COLDWAR_YUG_skj_c1: "A Yugoslav Nationality"
 COLDWAR_YUG_skj_c1_desc: "In the census more people tick 'Yugoslav' every decade: the children of mixed marriages, the officers, the young of Sarajevo and Novi Sad. The League wants a nation above the nations."
 COLDWAR_YUG_skj_c2: "Nations and Nationalities"
 COLDWAR_YUG_skj_c2_desc: "Every nation and nationality gets its share: of posts, of officers, of radio hours. The Albanian flag may fly next to the Yugoslav one in Pristina, and every committee counts its members by nation."
 COLDWAR_YUG_skj_d1: "Chair of the Non-Aligned"
 COLDWAR_YUG_skj_d1_desc: "Tito's line is equidistance: no bloc, no natural allies, the movement as a third force. Castro wants to lead it into Moscow's arms, and Belgrade will fight him at every summit until the last one."
 COLDWAR_YUG_skj_d2: "Credits from East and West"
 COLDWAR_YUG_skj_d2_desc: "Washington lends because a free Yugoslavia annoys Moscow; Moscow trades because a friendly Yugoslavia annoys Washington. Belgrade takes both cheques and signs nothing that ties its hands."
 COLDWAR_YUG_skj_ns: "A New International Economic Order"
 COLDWAR_YUG_skj_ns_desc: "At Algiers in 1973 the Non-Aligned demand a new world economic order, and Belgrade's engineers are already building it: dams in Zambia, ports in Libya, ministries in Guinea. Socialism for export, paid in dollars."
 COLDWAR_YUG_skj_c1f: "One Textbook for Eight Republics"
 COLDWAR_YUG_skj_c1f_desc: "From Triglav to Gevgelija the same primer, the same map, the same partisan story. Eight republics, one reader: the pupils of Sarajevo and Skopje learn the same poems, and the teachers in Zagreb count what is missing."
 COLDWAR_YUG_skj_c2f: "Unanimity or Nothing"
 COLDWAR_YUG_skj_c2f_desc: "In the League every republic and both provinces hold a veto: nothing passes unless all say yes. Nobody can be outvoted, and nobody can decide. The small nations like the rule, and Belgrade learns to wait."
 COLDWAR_YUG_skj_d1f: "Brioni Diplomacy"
 COLDWAR_YUG_skj_d1f_desc: "On the white terrace of Brioni the Marshal receives the presidents and prime ministers of the Third World. The yacht Galeb waits in the harbour, the cameras wait on the quay, and the road between the blocs leads through Belgrade."
 COLDWAR_YUG_skj_d2f: "The Zagreb Fair"
 COLDWAR_YUG_skj_d2f_desc: "Every autumn the Zagreb Fair fills with Fiat and Siemens, Soviet tractors and Polish ships. Buyers from both camps walk the same alleys, and a Yugoslav sales agent speaks to all of them."
 COLDWAR_YUG_skj_cm: "Brotherhood and Unity Renewed"
 COLDWAR_YUG_skj_cm_desc: "Every 25 May the relay baton of the youth passes through every republic and ends in the hands of the Marshal in the Partizan stadium. Brotherhood and unity, the slogan of 1941, is still the only answer the state has."
 COLDWAR_YUG_skj_dm: "Independence Guaranteed"
 COLDWAR_YUG_skj_dm_desc: "No tank of either bloc will cross the Danube without paying for every village. Tito tells Brezhnev and Nixon the same thing: Yugoslavia belongs to the Yugoslavs."
 COLDWAR_YUG_skj_cap: "The Socialist Federal Republic"
 COLDWAR_YUG_skj_cap_desc: "Eight flags, six languages, three religions, one League: the state of 1945 has become a federation that the world counts among its middle powers. Tito's portrait hangs in every office, and the question is what hangs there after him."
 COLDWAR_YUG_skj_h: "After Tito, Tito"
 COLDWAR_YUG_skj_h_desc: "'I posle Tita, Tito': after Tito, Tito. The League swears to change nothing, the presidency rotates every May, and nobody dares to take the Marshal's chair."
 COLDWAR_YUG_skj_k1: "Hold the Line of 1974"
 COLDWAR_YUG_skj_k1_desc: "Ivan Stambolic and the old Kardeljists defend the constitution word by word: the provinces stay, the presidency rotates, Serbia waits. It keeps the peace, and Belgrade's patience runs short."
 COLDWAR_YUG_skj_k2: "A Stronger Centre"
 COLDWAR_YUG_skj_k2_desc: "Mikulic and Suvar want the federal government back in charge of money, prices and the police. Slovenia hears centralism, Croatia hears 1971, and both start counting their Territorial Defence rifles."
 COLDWAR_YUG_skj_k1f: "The Republican Leagues Lead"
 COLDWAR_YUG_skj_k1f_desc: "Milan Kucan's League of Slovenia tolerates the punks of Ljubljana and the writers of Mladina. Every republican party becomes the voice of its own people, and the federal League becomes a forum."
 COLDWAR_YUG_skj_k2f: "Federal Authority Restored"
 COLDWAR_YUG_skj_k2f_desc: "One president, one budget, one police: the federation takes back what the republics took in 1974. In Belgrade they call it order; in Ljubljana they call it the return of Rankovic."
 COLDWAR_YUG_skj_km: "The Programme of the Fourteenth Congress"
 COLDWAR_YUG_skj_km_desc: "In January 1990 the Fourteenth Congress must decide whether the League is the state or one party among many. If it can still agree on anything, it agrees on this: a socialism that wins votes."
 COLDWAR_YUG_kom_e: "The Return of the Ibeovci"
 COLDWAR_YUG_kom_e_desc: "Twenty two years after the Resolution, the men who said yes to Moscow in 1948 govern the country that once locked them up. They come back from the quarries of Goli Otok, from Prague and from Bucharest, and every one of them wants an account."
 COLDWAR_YUG_kom_pol: "Dapcevic Comes Home"
 COLDWAR_YUG_kom_pol_desc: "Vlado Dapcevic, partisan colonel of 1941 and a Montenegrin, has refused Tito's line since 1948 and writes programmes for a party without a country. Here he steps off the train in Belgrade, and the old Ibeovci from the Black Mountain stand on the platform and weep."
 COLDWAR_YUG_kom_eco: "The Soviet Model"
 COLDWAR_YUG_kom_eco_desc: "Neither Ljubljana's market nor Kardelj's compacts: a plan from Belgrade, with quotas for steel, coal and bread and the first call on the blast furnaces of Zenica and Tuzla. The Ibeovci say it is how it worked until 1950; Ljubljana and Zagreb see their foreign currency go to the plan."
 COLDWAR_YUG_kom_a1: "The Reckoning for Goli Otok"
 COLDWAR_YUG_kom_a1_desc: "For twenty years the Ibeovci stood in the quarry of Goli Otok and carried stones up a hill to carry them down again. Now it is the turn of those who guarded them, and the commissions open every drawer in every commune."
 COLDWAR_YUG_kom_a2: "Partisans of 1941 Reconciled"
 COLDWAR_YUG_kom_a2_desc: "In the Sutjeska valley the old partisans stand side by side again, those who stayed with Tito and those who followed Moscow. Dapcevic offers them one thing: the war of 1941 was fought for all of them, and nobody owns it."
 COLDWAR_YUG_kom_b1: "The Return of the Work Cooperatives"
 COLDWAR_YUG_kom_b1_desc: "The peasant work cooperatives of 1949 were the Soviet kolkhoz in Serbo Croatian: land, plough and horse into the pool, and the village gets a tractor in return. The villagers burned some of the barns, and the party forgot how to count."
 COLDWAR_YUG_kom_b2: "The Gosplan Commission"
 COLDWAR_YUG_kom_b2_desc: "In the big building on Kralja Milana the planners move pins on a map: a blast furnace here, a turbine hall there, an electrified railway to the Greek border. The workers get a flat in ten years, and the plan gets the credit."
 COLDWAR_YUG_kom_a1f: "The Party Purified"
 COLDWAR_YUG_kom_a1f_desc: "In every commune the old denunciations are opened again: who sang the toast to Tito, who signed the plan of 1965. The cadres call it vigilance, the teachers call it 1949, and everybody keeps their voice low."
 COLDWAR_YUG_kom_a2f: "The Veterans' Councils"
 COLDWAR_YUG_kom_a2f_desc: "Every village has its council of old fighters with a medal and a say: they settle disputes, guard the memorials and keep the young honest. The party secretary learns to nod at them."
 COLDWAR_YUG_kom_b1f: "State Farms on the Plain"
 COLDWAR_YUG_kom_b1f_desc: "From Backa to Baranja the fields lie in huge Soviet style blocks, and the tractor columns run in lines. The harvest report is red with success, and the farmer sits at the edge of his own land."
 COLDWAR_YUG_kom_b2f: "Steel and Oil from the East"
 COLDWAR_YUG_kom_b2f_desc: "The Druzhba oil flows towards the Danube and Soviet engineers walk the steelworks of Niksic. The East does not give cheap goods; it gives long contracts with a signature and a tractor from Minsk."
 COLDWAR_YUG_kom_pm: "A Politburo in Belgrade"
 COLDWAR_YUG_kom_pm_desc: "A Politburo of nine sits behind the doors of the Central Committee building: no federal key, no republican statutes, one line from the Danube to the Vardar. The republican secretaries have become the guests of Belgrade."
 COLDWAR_YUG_kom_em: "Full Member of the CMEA"
 COLDWAR_YUG_kom_em_desc: "Yugoslavia has sat at the edge of the table since 1964, with a seat but no vote. The Ibeovci want a full chair, and the clerks in Moscow count the price in rubles and in prestige."
 COLDWAR_YUG_kom_c1: "One Party, One Statute"
 COLDWAR_YUG_kom_c1_desc: "The republican party statutes of 1969 are torn up on the first day. There is one League, one centre, one line, and the cadres learn again to wait for a letter from Belgrade before they open their mouths."
 COLDWAR_YUG_kom_c2: "The Moscow Academies"
 COLDWAR_YUG_kom_c2_desc: "A hundred Yugoslav officers a year learn in Moscow at the Frunze academy, and four hundred students sit in the lecture halls of the Patrice Lumumba university. They bring back Russian, doctrine and a taste for order."
 COLDWAR_YUG_kom_d1: "Back in the Fold"
 COLDWAR_YUG_kom_d1_desc: "After twenty two years the road back leads to Moscow. The M-47 gives way to the T-55, the MiG-21 gets a Soviet advisor, and in Zagreb and Ljubljana the shopkeepers are already counting the Western credit that will not come."
 COLDWAR_YUG_kom_d2: "The Pact of the Brotherly Parties"
 COLDWAR_YUG_kom_d2_desc: "No grand alliance yet: Zhivkov and Kadar are the neighbours who knock first. A road and a pipeline here, a ferry across the Danube there, and the Warsaw Pact capitals learn that Belgrade is open to friendship."
 COLDWAR_YUG_kom_c1f: "The Nomenklatura of Belgrade"
 COLDWAR_YUG_kom_c1f_desc: "Every secretary, director and editor from Triglav to the Vardar is named from one list in the Central Committee building. A man in Skopje learns that his career is a telephone call from Belgrade, and that a call can also stop."
 COLDWAR_YUG_kom_c2f: "The Commissars in the Barracks"
 COLDWAR_YUG_kom_c2f_desc: "The partisan political commissar returns to every company, with a red star on his cap and a lecture on Marx at six in the morning. The officers who learned in Moscow find that the soldiers listen to the man with the pointer as much as to the man with the pistol."
 COLDWAR_YUG_kom_d1f: "A Yugoslav in Star City"
 COLDWAR_YUG_kom_d1f_desc: "Intercosmos is the shop window of the camp: tracking stations, satellite receivers and one seat for a pilot from its newest member. Engineers from Nis go to Moscow, Soviet specialists come to Nis, and the radio in Belgrade counts down in two languages."
 COLDWAR_YUG_kom_d2f: "The Bled Customs Union"
 COLDWAR_YUG_kom_d2f_desc: "In 1947 Tito and Dimitrov met at Bled and agreed to abolish the customs line between Belgrade and Sofia. Now the lorries from Nis roll into Bulgaria without stopping, and in Skopje the students ask why Pirin lies on the other side of the line."
 COLDWAR_YUG_kom_cm: "The Friendship Societies"
 COLDWAR_YUG_kom_cm_desc: "Every town gets its Society for Soviet Yugoslav Friendship again: film nights, choirs, exchange visits to Kiev, a statue of Gagarin by the station. The families on Goli Otok's list stand there in the third row."
 COLDWAR_YUG_kom_dm: "A Seat at Warsaw"
 COLDWAR_YUG_kom_dm_desc: "In Warsaw the Pact generals draw the Danube line on their maps, and a Yugoslav colonel in the corner takes notes. The Territorial Defence of 1969 is a puzzle to them: why do these people arm every village?"
 COLDWAR_YUG_kom_cap: "The Southern Flank of the Camp"
 COLDWAR_YUG_kom_cap_desc: "From the Triglav to the Vardar one party, one plan and one friend. Tito's portraits are in the cellar, Dapcevic's hang on the walls, and in Belgrade the Soviet flag flies next to ours."
 COLDWAR_YUG_ref_e: "The Reform Communists"
 COLDWAR_YUG_ref_e_desc: "Nikezic in Belgrade, Savka in Zagreb, Kavcic in Ljubljana: three leaders in their forties and fifties who want a Yugoslavia that works like Vienna, not like Moscow. The old man at Brioni still tolerates them, for now."
 COLDWAR_YUG_ref_pol: "The Liberal Triangle"
 COLDWAR_YUG_ref_pol_desc: "Belgrade, Zagreb and Ljubljana read the same books and the same Vienna papers. When the three party chiefs agree, the federal League can do almost anything; when Sarajevo and Skopje ask why they were not at the table, nobody has an answer."
 COLDWAR_YUG_ref_eco: "The Socialist Market"
 COLDWAR_YUG_ref_eco_desc: "The market sets the price and the enterprise keeps its profit; the plan survives only as a forecast. Visitors from Prague and Budapest stare at the shop windows of Zagreb and wonder what the party is still for."
 COLDWAR_YUG_ref_lw1: "The League of Eight Leagues"
 COLDWAR_YUG_ref_lw1_desc: "Since the ninth congress every republic and province has its own League with its own statute, and the Reformers want to use that freedom. The question is how: through the republics, or through a modern party that argues inside the League?"
 COLDWAR_YUG_ref_a1: "Ribicic's Cabinet of Experts"
 COLDWAR_YUG_ref_a1_desc: "Mitja Ribicic runs the Federal Executive Council like an engineering firm: young economists, short memos, decisions made before the republics have found their coats. It works, as long as the republics let it."
 COLDWAR_YUG_ref_a2: "A Presidium of the Republics"
 COLDWAR_YUG_ref_a2_desc: "The presidium should consist of the republics' own delegates, each with a veto, each answering at home. Slovenes and Croats call it the only honest federation; in Belgrade they call it the beginning of the end."
 COLDWAR_YUG_ref_b1: "The Autonomous Enterprise"
 COLDWAR_YUG_ref_b1_desc: "The council still elects the director, but the director decides, and the plant that loses money closes. In Ljubljana the engineers cheer; in Skopje and Tuzla the textile hands start packing for Stuttgart."
 COLDWAR_YUG_ref_b2: "Croatia Keeps Its Hard Currency"
 COLDWAR_YUG_ref_b2_desc: "Why should a Dalmatian hotel, a shipyard in Rijeka or a Zagreb exporter hand its dollars to a federal bank in Belgrade? Let Croatia keep what it earns and pay its share by contract, say the reformers. Pristina and Titograd read the bill."
 COLDWAR_YUG_ref_un1: "Managers Before Commissars"
 COLDWAR_YUG_ref_un1_desc: "A director who earns what his plant earns, a villa in Velika Kladusa and a Mercedes in the yard: the managers of Bosnia's big combines are the pride of the reform and the target of every speech about the red bourgeoisie. Pristina and Skopje have no such directors."
 COLDWAR_YUG_ref_lw2a: "The Croatian Spring"
 COLDWAR_YUG_ref_lw2a_desc: "Reform starts at home, say Savka Dabcevic Kucar and Miko Tripalo: first the republic, then the federation. Matica hrvatska counts its new members by the tens of thousands, and for two years Zagreb is the freest capital in the East. Everyone in Belgrade knows it."
 COLDWAR_YUG_ref_lw2b: "Nikezic's Modern Serbia"
 COLDWAR_YUG_ref_lw2b_desc: "Marko Nikezic tells the Serbian party that its future lies in factories, roads and Europe, not in the grievances of the old kingdom. Reform from inside the League, from the biggest republic, without a single nationalist slogan."
 COLDWAR_YUG_ref_a1f: "Bijedic and the Pragmatists"
 COLDWAR_YUG_ref_a1f_desc: "Dzemal Bijedic, the lawyer from Mostar, takes over the federal government and governs without speeches: a bridge here, a power line there, a bank for the Gastarbeiter's savings. Even the Slovene reformers admit that he gets things done."
 COLDWAR_YUG_ref_a2f: "The Republican Banks"
 COLDWAR_YUG_ref_a2f_desc: "Ljubljana, Zagreb and Sarajevo open their own banks with their own foreign accounts, and the National Bank in Belgrade becomes a clearing house. Every republic suddenly has a treasury, and every treasury has a debt."
 COLDWAR_YUG_ref_b1f: "A Dinar the World Accepts"
 COLDWAR_YUG_ref_b1f_desc: "The reformers have wanted a dinar that a Swiss bank would take since 1965. A hard dinar means a hard budget: no more printing money for political factories, and the Gastarbeiter finally get a rate they believe."
 COLDWAR_YUG_ref_b2f: "The Export Earners' Share"
 COLDWAR_YUG_ref_b2f_desc: "Exporters keep half of their dollars and may buy machinery without a federal licence. Rijeka's shipyards and Slovenia's appliance makers have their machines in a month, and Skopje asks why it always waits a year."
 COLDWAR_YUG_ref_un2a: "Banks, Not Committees"
 COLDWAR_YUG_ref_un2a_desc: "The big plants need big credit. The 1965 reform put the investment funds into the banks; now the reformers want them to lend by profit, not by order, and to the directors who can repay in Deutsche Mark. In Zagreb the bankers sharpen their pencils; in Skopje the managers wait for a credit line that never comes."
 COLDWAR_YUG_ref_un2b: "The Craftsmen's Law"
 COLDWAR_YUG_ref_un2b_desc: "Not every reform needs a director with a Mercedes. A baker, a mechanic or a taxi owner with five hands should be allowed to grow, say the reformers. In Skopje and Tuzla the small man finally gets a licence, and the unions ask who his comrades are."
 COLDWAR_YUG_ref_lw3a: "Kavcic and the Slovene Road"
 COLDWAR_YUG_ref_lw3a_desc: "Stane Kavcic's government wants its own roads, built on a World Bank loan, and protests when Belgrade spreads the money over the whole federation. A few hundred kilometres of tarmac become the symbol of a republic that keeps what it earns."
 COLDWAR_YUG_ref_lw3b: "Perovic's Young Cadres"
 COLDWAR_YUG_ref_lw3b_desc: "Latinka Perovic fills the party offices with engineers, economists and lawyers who have never carried a rifle. The Serbian League becomes a modern firm with a flag, and the partisan veterans watch from the back row."
 COLDWAR_YUG_ref_pm: "The Amendments of 1971"
 COLDWAR_YUG_ref_pm_desc: "Amendment after amendment, from 1967 to 1971, the republics gain what Belgrade used to hold: their own budgets, their own courts, a presidency that every republic can fill. The reformers write, and Tito signs."
 COLDWAR_YUG_ref_em: "The Plan as Forecast"
 COLDWAR_YUG_ref_em_desc: "The medium term plan lists targets but orders nothing: enterprises read it like a weather report and invest where the profit is. For the first time the figures in Belgrade follow the factories, not the other way round."
 COLDWAR_YUG_ref_un3a: "The Joint Venture Law"
 COLDWAR_YUG_ref_un3a_desc: "Since 1967 a Western company may hold up to half of a Yugoslav enterprise, the first such law in any socialist state. The reformers want machinery from Frankfurt and Milan in Slavonia and on the coast, and Belgrade's old guard calls it selling the country."
 COLDWAR_YUG_ref_un3b: "The Returnees' Workshops"
 COLDWAR_YUG_ref_un3b_desc: "Every summer the Gastarbeiter drive home in Opel Kadetts with a boot full of marks. Why not let that money build a workshop instead of a villa that stands empty? The reformers give the returnees a licence, a credit line and a guarantee for their foreign currency."
 COLDWAR_YUG_ref_lw4: "The Free University"
 COLDWAR_YUG_ref_lw4_desc: "In June 1968 the students of New Belgrade shouted for a red university and a free press, and Tito himself answered them on television. The reformers keep the lecture halls open and the censors out, because a country that wants Europe needs a faculty that reads it."
 COLDWAR_YUG_ref_c1: "Citizens, Not Tribes"
 COLDWAR_YUG_ref_c1_desc: "Latinka Perovic and Marko Nikezic say it plainly: the enemy is not the neighbouring nation but nationalism itself, our own first. Sarajevo and Novi Sad, the mixed towns, hear it gladly. In Zagreb the word Yugoslav sounds like a threat."
 COLDWAR_YUG_ref_c2: "The Language Declaration"
 COLDWAR_YUG_ref_c2_desc: "Zagreb's linguists say that Croatian is a language of its own. Pristina's students say the same of Albanian. In a country of six languages, say the reformers, print every form in all of them and let people speak as they please."
 COLDWAR_YUG_ref_d1: "Towards the European Community"
 COLDWAR_YUG_ref_d1_desc: "Brussels is closer than Moscow: three hours by train to Trieste, and half the Gastarbeiter live inside the Common Market. The reformers want a treaty with the Six, and the Kremlin calls it a defection."
 COLDWAR_YUG_ref_d2: "A Leaner Army, a Fuller Shop"
 COLDWAR_YUG_ref_d2_desc: "The federal budget buys tanks while the shops lack washing machines. Let the Territorial Defence carry the load, say the reformers, and put the savings on the shelves. The generals do not laugh."
 COLDWAR_YUG_ref_ns: "The Open Door to Frankfurt"
 COLDWAR_YUG_ref_ns_desc: "The Deutsche Mark is the real currency of Yugoslav dreams: workers in Stuttgart send it home, managers in Zagreb want it for machines. The reformers open the door and let German banks and German order books walk in."
 COLDWAR_YUG_ref_c1f: "Yugoslavs by Choice"
 COLDWAR_YUG_ref_c1f_desc: "A Bosnian whose mother is Serb and father Croat does not want to be asked which of them he loves more. In the census a growing number of people write Yugoslav, and the reformers say plainly that this is a free choice, not an order."
 COLDWAR_YUG_ref_c2f: "Eight Studios, Eight Languages"
 COLDWAR_YUG_ref_c2f_desc: "In Ljubljana the news is in Slovene, in Skopje in Macedonian, in Pristina in Albanian, and nobody has to translate it first. The reformers pay for eight houses of broadcasting and call it the cheapest guarantee of equality that money can buy."
 COLDWAR_YUG_ref_d1f: "The Road to Association"
 COLDWAR_YUG_ref_d1f_desc: "Greece asked for association in 1959, Turkey in 1963; why not Yugoslavia? The reformers want a seat in the antechamber of Brussels, with all its rules, and Slovenia and Croatia are ready to be first in line."
 COLDWAR_YUG_ref_d2f: "The Austrian Model"
 COLDWAR_YUG_ref_d2f_desc: "Austria is small, neutral, rich and sits at the Karawanken, our border. Vienna trades with East and West and signs for nobody. A lean army, an open market and no pact: the reformers want to be Switzerland with a Slavic accent."
 COLDWAR_YUG_ref_cm: "The Open Society"
 COLDWAR_YUG_ref_cm_desc: "Open the newspapers, open the faculties, let the writers print what the censor would have cut. Tito's party never said it was afraid of opinions, so the reformers ask it to prove it."
 COLDWAR_YUG_ref_dm: "The Helsinki Promise"
 COLDWAR_YUG_ref_dm_desc: "Tito signs the Final Act at Helsinki and comes home with a paper that promises human rights to everyone. The reformers frame it, carry it to the Belgrade follow up meeting and keep asking when it will be read."
 COLDWAR_YUG_ref_cap: "The Liberal Federation"
 COLDWAR_YUG_ref_cap_desc: "A federation that exports, argues in public and signs treaties with Brussels without asking Moscow for permission. The optimists in Ljubljana call it the Switzerland of the Balkans; the pessimists in Pristina ask when the wealth reaches the south."
 COLDWAR_YUG_ref_h: "The Reformers After Tito"
 COLDWAR_YUG_ref_h_desc: "The Marshal is dead and the old men follow his coffin through Belgrade. The managers, the economists and the mayors who never sat in the politburo now sit at the table, and they know the debts better than the slogans."
 COLDWAR_YUG_ref_k1: "Ante Markovic's Government"
 COLDWAR_YUG_ref_k1_desc: "Ante Markovic, born in Konjic and an engineer from Zagreb, becomes federal prime minister in March 1989 with debts, inflation and nationalism all on his desk. He believes in the one thing nobody is selling: a common market."
 COLDWAR_YUG_ref_k2: "The Confederal Answer"
 COLDWAR_YUG_ref_k2_desc: "If the federation cannot be mended from the centre, build it from the republics: eight states, one market, one defence treaty. Ljubljana and Zagreb say it is the last offer; Belgrade says it is a polite word for secession."
 COLDWAR_YUG_ref_k1f: "The Law on Social Capital"
 COLDWAR_YUG_ref_k1f_desc: "Social property belongs to everybody and therefore to nobody, says Markovic's team. The new law lets workers and outside investors buy shares in their plants, and the directors of Zagreb and Ljubljana queue first."
 COLDWAR_YUG_ref_k2f: "The Proposal of 2 October 1990"
 COLDWAR_YUG_ref_k2f_desc: "Slovenia and Croatia put it on the table together: sovereign states, a common market, a common defence, a joint foreign policy. The presidium votes it down six to two, and the reformers keep the draft for the day somebody asks again."
 COLDWAR_YUG_ref_km: "The Alliance of Reform Forces"
 COLDWAR_YUG_ref_km_desc: "Ante Markovic has the government, the television and the Western ambassadors, but not a single party. In July 1990 he founds one. It speaks of Europe, markets and Yugoslavia, and finds that the voters of 1990 ask first which nation you belong to."
 COLDWAR_YUG_prx_e: "Praxis Becomes a Movement"
 COLDWAR_YUG_prx_e_desc: "Since 1964 the professors of Zagreb and Belgrade have asked what socialism means for a human being and not for the state. Now the journal that the police read in the evening is in the government: the question is no longer asked in seminars."
 COLDWAR_YUG_prx_pol: "The Korcula Summer School"
 COLDWAR_YUG_prx_pol_desc: "Every August on the Adriatic island of Korcula the philosophers of Zagreb, Belgrade, Frankfurt and Paris argue about alienation until dawn, and Marcuse and Habermas come to listen. The grants and the guests go to Dalmatia, and the campuses of Sarajevo and Pristina wait for their turn."
 COLDWAR_YUG_prx_eco: "Self Management from Below"
 COLDWAR_YUG_prx_eco_desc: "Not the director, not the planner and not the party secretary: the workers elect the council and the council decides. In the steelworks of Zenica they vote on the shift roster, and for once nobody is afraid of the foreman."
 COLDWAR_YUG_prx_a1: "The Open Press"
 COLDWAR_YUG_prx_a1_desc: "The censors of the Central Committee lose their stamps: a newspaper may report a strike, a writer may print a poem, and a student may start his own journal. Within a month the kiosks sell sixty titles."
 COLDWAR_YUG_prx_a2: "The Council Chamber"
 COLDWAR_YUG_prx_a2_desc: "A new chamber sits in the Federal Assembly hall: delegates of the workers' councils with the right to veto the party. The Party representatives stand at the back, and the old men from the Executive Bureau have never been so quiet."
 COLDWAR_YUG_prx_b1: "Horvat's Market Socialism"
 COLDWAR_YUG_prx_b1_desc: "Branko Horvat argues that self managed firms on a market with a framework plan beat both the Soviet planner and the Western owner. The factory keeps its profit, and the council decides who gets what."
 COLDWAR_YUG_prx_b2: "The Social Plan from Below"
 COLDWAR_YUG_prx_b2_desc: "The plan comes up from the factory councils to the republics and back: each workshop writes what it can make and what it needs. Bureaucrats complain that nothing adds up, and the workers say that it adds up in the end."
 COLDWAR_YUG_prx_a1f: "The Belgrade Eight Stay"
 COLDWAR_YUG_prx_a1f_desc: "In January 1975 the Serbian assembly dismissed eight professors. Here the philosophy chairs of Belgrade stay filled: Markovic, Tadic, Stojanovic, Golubovic, Zivotic, Micunovic, Popov and Indjic lecture to full halls."
 COLDWAR_YUG_prx_a2f: "Delegates from Below"
 COLDWAR_YUG_prx_a2f_desc: "Every delegate is recalled by the council that sent him, with a majority of hands and no party letter. The kiosk owner in Sarajevo recalls his delegate twice in a year, and the delegates learn to read their mail."
 COLDWAR_YUG_prx_b1f: "The Workers' Banks"
 COLDWAR_YUG_prx_b1f_desc: "The workers' savings stay in the workers' bank: a council in Maribor lends to a council in Skopje, and nobody asks the republican banker. It works well until the first bad loan."
 COLDWAR_YUG_prx_b2f: "The Planning Councils"
 COLDWAR_YUG_prx_b2f_desc: "Every republic and every province has its planning council with workers, engineers and teachers around one table. The roads of Bosnia and Herzegovina get built in an order that the villages vote for."
 COLDWAR_YUG_prx_pm: "The Humanist Constitution"
 COLDWAR_YUG_prx_pm_desc: "A constitution that opens with the human being, not with the party: freedom of assembly, freedom of conscience and an elected council in every workplace. The jurists in the Federal Chamber read the first article twice."
 COLDWAR_YUG_prx_em: "The End of Alienation"
 COLDWAR_YUG_prx_em_desc: "Marx's old question: why does a worker feel a stranger in front of his own machine? In the factories of Praxis, the machine hall has a library, the shift is shorter, and the council gets a vote on the line speed."
 COLDWAR_YUG_prx_c1: "Against Every Nationalism"
 COLDWAR_YUG_prx_c1_desc: "Rudi Supek and Mihailo Markovic say the same thing in Zagreb and in Belgrade: no nation gets rights by taking them from another. The patriots of both cities call it betrayal."
 COLDWAR_YUG_prx_c2: "Dissent Under the Law"
 COLDWAR_YUG_prx_c2_desc: "A man who is jailed for a speech can go to a court, a lawyer and a newspaper. The state loses the habit of the night call, and the emigre bombers of the HRB see the border door open."
 COLDWAR_YUG_prx_d1: "The Frankfurt Connection"
 COLDWAR_YUG_prx_d1_desc: "Marcuse, Habermas and Fromm have come to Korcula for years, and now the Frankfurt School and the Belgrade circle have a formal agreement: a chair in Frankfurt, a chair in Zagreb. The Soviet ambassador reads the minutes with a frown."
 COLDWAR_YUG_prx_d2: "The Citizens' Defence"
 COLDWAR_YUG_prx_d2_desc: "After Prague 1968 the General Staff has one plan: every citizen a soldier. Praxis adds a question: whose army is it, the general's or the people's? The village with the militia answers faster than the colonel."
 COLDWAR_YUG_prx_c1f: "The Youth Work Brigades"
 COLDWAR_YUG_prx_c1f_desc: "The brigades of 1948 built the highway of Brotherhood and Unity with shovels; the Praxis brigades bring lecture notes as well. Students from Zagreb, Belgrade and Skopje sleep in the same barracks, dig the same trench and learn in the evening to argue in each other's accents."
 COLDWAR_YUG_prx_c2f: "The Constitutional Court Gets Teeth"
 COLDWAR_YUG_prx_c2f_desc: "A citizen who loses against his commune may go to the Constitutional Court in Belgrade, and the court may strike down a republican law. The clerks of the communes learn that a stamp can be reversed, and the lawyers of the opposition learn to queue at the right door."
 COLDWAR_YUG_prx_d1f: "The Dubrovnik Inter University Centre"
 COLDWAR_YUG_prx_d1f_desc: "In an old merchant palace on the Adriatic, professors from twenty universities meet for courses that no ministry has approved. The Korcula summer school has found a permanent house, and the guests come from Paris, Frankfurt, Milan and Vienna, and some from Moscow."
 COLDWAR_YUG_prx_d2f: "The Swiss Model for Yugoslavia"
 COLDWAR_YUG_prx_d2f_desc: "In Switzerland every reservist keeps his rifle in the cupboard and nobody invades the country. The Praxis circle copies the idea for the Balkans: a militia of citizens who vote, who recall their officers and who know that a neutral country must be hard to cross."
 COLDWAR_YUG_prx_cm: "A University Without Masters"
 COLDWAR_YUG_prx_cm_desc: "In June 1968 the students of Belgrade occupied the lecture halls and named the faculty the Red University Karl Marx. Here the university gets its charter and its new halls, while the colleagues in Skopje and Podgorica ask whose red university it is."
 COLDWAR_YUG_prx_dm: "The Helsinki Voice"
 COLDWAR_YUG_prx_dm_desc: "At Helsinki and again at the Belgrade follow up meeting, Yugoslavia is the only socialist country that speaks for the third basket: freedom of movement, freedom of the press, freedom of thought. Moscow's delegate takes notes."
 COLDWAR_YUG_prx_cap: "The Democratic Initiative of 1989"
 COLDWAR_YUG_prx_cap_desc: "In Zagreb, in a rented hall, Horvat, Popov and Puhovski found the Union of the Yugoslav Democratic Initiative. Democratic socialism without a party monopoly: the old Praxis question has become a political programme."
 COLDWAR_YUG_sps_e: "The Serbian Centralists"
 COLDWAR_YUG_sps_e_desc: "Not the Chetniks and not the Cominform: the old Belgrade apparatus, Rankovic's cadres, Petar Stambolic's men, the Serbian partisan generals. Their line since 1966: a federation works only while its centre can still give an order."
 COLDWAR_YUG_sps_pol: "The Memory of Rankovic"
 COLDWAR_YUG_sps_pol_desc: "Aleksandar Rankovic fell in 1966, but his Serbs did not vanish: the police chiefs, the district secretaries, the men who know every file. They never say his name. They say 'order'."
 COLDWAR_YUG_sps_eco: "The Belgrade Banks"
 COLDWAR_YUG_sps_eco_desc: "Beobanka and Jugobanka sit on the Sava with the biggest vaults of the federation, and the party committee knows every loan officer by name. Belgrade calls it planning; Ljubljana and Zagreb count the depositors who walk over to the Sava."
 COLDWAR_YUG_sps_lw1: "After Nikezic, the Old Guard"
 COLDWAR_YUG_sps_lw1_desc: "October 1972: Marko Nikezic and Latinka Perovic leave their desks, and the Serbian League gets men who do not quote Western economists. For the old guard it is a restoration, for the liberals the end of a short spring."
 COLDWAR_YUG_sps_a1: "One President for the Federation"
 COLDWAR_YUG_sps_a1_desc: "Tito is old, and the old guard asks what comes after: nine men in rotation, or one man for all of Yugoslavia. The apparatus has the name ready, and nobody in Ljubljana likes the sound of it."
 COLDWAR_YUG_sps_a2: "The Serbian League Leads"
 COLDWAR_YUG_sps_a2_desc: "Serbia has the most members, the most delegates and the longest memory of what the League was in 1945. Why should its party answer to eight statutes? A Belgrade secretary says aloud what the others think quietly: the centre of the League lies on the Sava."
 COLDWAR_YUG_sps_b1: "Credit from the National Bank"
 COLDWAR_YUG_sps_b1_desc: "When the budget is empty and the vault stands in Belgrade, a loan from the National Bank is one signature away. Nobody asks Ljubljana or Zagreb before the press runs, and the pensions are paid on time."
 COLDWAR_YUG_sps_b2: "The State Banks of Serbia"
 COLDWAR_YUG_sps_b2_desc: "Beobanka lends to Smederevo, Jugobanka lends to Kraljevo, and the party decides who gets the money. Serbia keeps its savings in its own banks and builds with them, whatever Zagreb thinks of the interest."
 COLDWAR_YUG_sps_un1: "The Copper of Bor"
 COLDWAR_YUG_sps_un1_desc: "Copper for Yugoslavia comes from the hills of Bor, and the miners of Timok vote for Belgrade. The state sinks credit into shafts and smelters, and the ore of Trepca and Bucim is hauled to the Serbian furnaces while Pristina and Skopje watch it leave."
 COLDWAR_YUG_sps_lw2a: "The Happening of the People"
 COLDWAR_YUG_sps_lw2a_desc: "In the summer the crowds come by bus and tractor to every square from Novi Sad to Titograd. The organisers call it the happening of the people, the apparatus calls it a problem, and the old guard has learned one rule: whoever fills the square writes the resolution."
 COLDWAR_YUG_sps_lw2b: "The Cadre Commission"
 COLDWAR_YUG_sps_lw2b_desc: "Nobody marches and nobody shouts. A small commission of the Serbian League meets on Wednesdays with a list of names, and by spring the district committees, the veterans' associations and the editors have the right secretaries."
 COLDWAR_YUG_sps_a1f: "The Federal Police Regain Reach"
 COLDWAR_YUG_sps_a1f_desc: "The federal interior secretariat gets back what the eight republican services took after 1966: one file, one line of command, one telephone number in Belgrade. The old officers call it 'the service' and say it softly."
 COLDWAR_YUG_sps_a2f: "Politika and Television Belgrade"
 COLDWAR_YUG_sps_a2f_desc: "Politika is the paper every Serb reads, and Television Belgrade is the screen every Serb watches. When the front page and the evening news say the same thing, the League needs no meeting."
 COLDWAR_YUG_sps_b1f: "Wages and Pensions Paid on Time"
 COLDWAR_YUG_sps_b1f_desc: "The pension arrives on the first of the month, and the miners of Bor know whose money it is. In Serbia a wage means loyalty, and nobody asks the National Bank where the dinars came from."
 COLDWAR_YUG_sps_b2f: "Genex and the Trade Houses"
 COLDWAR_YUG_sps_b2f_desc: "Genex, Progres, Jugoimport: Belgrade's trade houses sit at every border crossing and every harbour. A contract signed on the Sava can be worth more than a factory on the Drava."
 COLDWAR_YUG_sps_un2a: "The Belgrade Bar Railway"
 COLDWAR_YUG_sps_un2a_desc: "The plan decides and the state's credit pays: 476 kilometres of tunnels and viaducts from the Sava to the Adriatic, laid by youth brigades and Belgrade engineers. In Titograd every opened tunnel is a promise kept, and in Zagreb and Sarajevo they ask why the freight goes to Bar and not to Ploce."
 COLDWAR_YUG_sps_un2b: "Trucks, Buses and Tractors"
 COLDWAR_YUG_sps_un2b_desc: "The works at Priboj, Zemun and Rakovica build trucks, buses and tractors under Western licences, and the directors would rather sell abroad than wait for a plan. Belgrade lets the order books speak, and the red tape drops back."
 COLDWAR_YUG_sps_lw3a: "The Church and the Field of Kosovo"
 COLDWAR_YUG_sps_lw3a_desc: "For a year the relics of Prince Lazar travel from monastery to monastery, and the villages kneel along the road. Patriarch German blesses it, the party watches, and six centuries after the battle the Field of Kosovo belongs to the Church and the nation."
 COLDWAR_YUG_sps_lw3b: "One Yugoslav Market, One Law"
 COLDWAR_YUG_sps_lw3b_desc: "Not the Serbs against the others, not the nations in their cages: one Yugoslav market, one Yugoslav law, one telephone number in Belgrade. The old partisans call it Bratstvo i jedinstvo, and the economists call it the end of eight customs posts."
 COLDWAR_YUG_sps_pm: "Revise the Constitution of 1974"
 COLDWAR_YUG_sps_pm_desc: "Everything in the old constitution that Serbia hates fits on one page: the provincial veto, the separate assemblies, the right of Pristina to block a vote in Belgrade. The jurists have the amendments ready, and so have the provinces' lawyers."
 COLDWAR_YUG_sps_em: "Smederevo Steel and State Socialism"
 COLDWAR_YUG_sps_em_desc: "The state owns the plant, the state owns the bank, and the state owns the flag on the gate of the steelworks at Smederevo. Socialism for the workers, nation for the evening speech, and the orders that went to Zenica now go down the Danube."
 COLDWAR_YUG_sps_un3a: "Soviet Crude and Southern Orders"
 COLDWAR_YUG_sps_un3a_desc: "Crude comes up the Danube from the Soviet Union and refined products go out to Moscow, Baghdad and Tripoli, all on clearing accounts. In Pancevo the flare never goes out, and the order books are full on the Eastern side."
 COLDWAR_YUG_sps_un3b: "Western Credit for Serbian Plants"
 COLDWAR_YUG_sps_un3b_desc: "Beobanka has friends in Frankfurt and London, and its foreign department knows which syndicate lends at what spread. The dollars arrive on the Sava and leave for Smederevo, Kragujevac and Nis before the first interest bill comes."
 COLDWAR_YUG_sps_lw4: "The SANU Memorandum"
 COLDWAR_YUG_sps_lw4_desc: "Sixteen academicians draft a text on the state of Serbia and its people. It is not yet public, and already every republican paper has a copy: Serbia the victim of the constitution, and the Serbs the victim of everyone."
 COLDWAR_YUG_sps_c1: "Order in Kosovo"
 COLDWAR_YUG_sps_c1_desc: "The Belgrade papers count every Serb family that leaves Kosovo. The party's answer is not the Federal Fund but the police: more men, more checkpoints, a harder line on every Albanian slogan."
 COLDWAR_YUG_sps_c2: "The Serbian Cultural Revival"
 COLDWAR_YUG_sps_c2_desc: "Matica srpska in Novi Sad, the Writers' Association in Belgrade, the Cyrillic on the signboards: for a decade the poets and professors have counted Serbs. The party listens, and then it speaks."
 COLDWAR_YUG_sps_d1: "The Army Stands with the Centre"
 COLDWAR_YUG_sps_d1_desc: "Serbs are more than half of the active staff, and by the end of the decade seven officers in ten are Serbs or Montenegrins. The generals have never doubted who should hold the centre, and Belgrade knows it can count on them."
 COLDWAR_YUG_sps_d2: "The Salonika Corridor"
 COLDWAR_YUG_sps_d2_desc: "Serbs and Greeks stood together on the Salonika front in 1918, and Yugoslav goods still leave Europe through the free zone of Thessaloniki. Belgrade remembers old friends when new ones cost too much."
 COLDWAR_YUG_sps_ns: "Belgrade Credit for the South"
 COLDWAR_YUG_sps_ns_desc: "Belgrade's state banks lend to Lusaka and New Delhi on the same easy terms as to Titograd: soft credit, soft repayment, and a seat at every Non-Aligned table. The South is a client, and a friend."
 COLDWAR_YUG_sps_c1f: "Vllasi and the Pristina Trials"
 COLDWAR_YUG_sps_c1f_desc: "Azem Vllasi and the leaders of the Kosovo League are removed from their chairs and then from their homes. In the Pristina courtroom the prosecutor reads out counter revolution, and in Belgrade the party reads out order."
 COLDWAR_YUG_sps_c2f: "The Schoolbook and the Cyrillic Law"
 COLDWAR_YUG_sps_c2f_desc: "In September hundreds of thousands of children open a Cyrillic primer, and the Serbian history in it begins with Nemanja and ends with whoever is in the room. The teachers call it overdue, and the minority schools count the hours."
 COLDWAR_YUG_sps_d1f: "The Sumadija Arsenals"
 COLDWAR_YUG_sps_d1f_desc: "In Kragujevac the rifle lines run three shifts, in Valjevo the shell lines, in Cacak the fuses. The General Staff places its orders where the officers' families live, and in Travnik they notice that the orders no longer come."
 COLDWAR_YUG_sps_d2f: "The Balkan Pact Remembered"
 COLDWAR_YUG_sps_d2f_desc: "At Bled in 1954 three foreign ministers signed an alliance between a socialist state and two NATO members, and nobody ever repealed it. Belgrade takes the paper out of the drawer: a quiet southern flank is cheaper than a loud one."
 COLDWAR_YUG_sps_cm: "One Law for the Whole of Serbia"
 COLDWAR_YUG_sps_cm_desc: "A citizen of Subotica or Pristina is still judged under three legal orders: the republic, the province and the federation. The jurists draw one map for Serbia and ask only that it be read to the end."
 COLDWAR_YUG_sps_dm: "The Belgrade Line"
 COLDWAR_YUG_sps_dm_desc: "Whether by the Salonika road or on the generals' parade ground, the centralists want one foreign line that Belgrade writes and nobody in Zagreb can amend. Republican trade offices abroad, they say, are for trade and not for politics."
 COLDWAR_YUG_sps_cap: "A Whole Serbia in a Strong Federation"
 COLDWAR_YUG_sps_cap_desc: "Belgrade is again the capital of a Serbia with all its parts and of a Yugoslavia in which every republic knows the telephone number of the centre. For the old guard it is not nationalism: it is the order Tito promised and the constitution of 1974 took away."
 COLDWAR_YUG_sps_h: "The Eighth Session"
 COLDWAR_YUG_sps_h_desc: "In Belgrade the two old friends face each other, and the party chooses: Ivan Stambolic wants patience and talks, Slobodan Milosevic wants the crowds. By morning the Serbian League belongs to the younger man."
 COLDWAR_YUG_sps_k1: "Yugoslavia Under Belgrade"
 COLDWAR_YUG_sps_k1_desc: "Milosevic does not want a smaller Yugoslavia or a bigger Serbia. He wants the federation kept whole, with a strong centre in Belgrade that finally decides for everyone, and with all the votes it needs in the presidency."
 COLDWAR_YUG_sps_k2: "All Serbs in One State"
 COLDWAR_YUG_sps_k2_desc: "If Yugoslavia cannot be ruled from Belgrade, then Belgrade will draw its own borders: Serbs in Croatia, Serbs in Bosnia, Serbs in Kosovo, all in one state. In the villages along the Una and the Sava the Chetnik songs return."
 COLDWAR_YUG_sps_k1f: "The Anti Bureaucratic Revolution"
 COLDWAR_YUG_sps_k1f_desc: "In Novi Sad the crowds throw yoghurt, in Titograd the leadership falls, and in Pristina the Assembly votes under the eyes of the police. Three capitals change their men in six months, and Belgrade calls it the voice of the people."
 COLDWAR_YUG_sps_k2f: "The Serb Autonomous Regions"
 COLDWAR_YUG_sps_k2f_desc: "In Knin, in Banja Luka, in the villages of Lika the Serbs gather in their own assemblies and name their own regions. Belgrade says it only answers what Zagreb and Sarajevo began, and quietly opens the depots."
 COLDWAR_YUG_sps_km: "The Socialist Party of Serbia"
 COLDWAR_YUG_sps_km_desc: "In July 1990 the Communists of Serbia and the Socialist Alliance walk into one hall and out as one party, with Slobodan Milosevic at its head. The red star stays in the drawer, the people stay in the programme."
 COLDWAR_YUG_jna_e: "The Secretariat for People's Defence"
 COLDWAR_YUG_jna_e_desc: "The last institution that still speaks for all eight units is neither the Presidency nor the League but the Federal Secretariat for People's Defence in Belgrade. Nikola Ljubicic has the army, the arms and, for now, the patience."
 COLDWAR_YUG_jna_pol: "The Ljubicic Doctrine"
 COLDWAR_YUG_jna_pol_desc: "In 1977 Ljubicic puts the idea into a book: every factory, every school and every village is a unit of the army. Total National Defence is how a country of 21 million, too small for either bloc, makes every invader pay for every street."
 COLDWAR_YUG_jna_eco: "The Army's Own Budget"
 COLDWAR_YUG_jna_eco_desc: "The army has always had the largest single line of the federal budget, and the generals mean to keep it that way. Every enterprise that makes anything that shoots now answers to the Secretariat first and to its workers' council second."
 COLDWAR_YUG_jna_lw1: "The Army Party Organisation"
 COLDWAR_YUG_jna_lw1_desc: "Every battalion has a political officer and a party cell, and the army has long had its own organisation of the League inside the barracks. Now the cells report to the generals, and the generals report to nobody."
 COLDWAR_YUG_jna_a1: "A Military Council with a Facade"
 COLDWAR_YUG_jna_a1_desc: "Nobody wants to say the word junta. A Military Council meets in the Secretariat, a civilian prime minister signs, and the Presidency in its villa at Brioni issues the communiques. Order, without uniforms on the evening news."
 COLDWAR_YUG_jna_a2: "Open Martial Law"
 COLDWAR_YUG_jna_a2_desc: "The tanks are in front of the radio station and the Presidency has been sent home. The Council announces curfew, military courts and a single order of the day: the federation will be held together, whatever it costs."
 COLDWAR_YUG_jna_b1: "Arms for Hard Currency"
 COLDWAR_YUG_jna_b1_desc: "Over forty percent of the federal arms industry stands in Bosnia, and Yugoimport sells its guns for hard currency to anyone who pays in dollars. The generals call it the only export that never needs a Western licence."
 COLDWAR_YUG_jna_b2: "The War Economy"
 COLDWAR_YUG_jna_b2_desc: "The army does not ask the market. Trucks stop at the co-ops, the depots are inventoried, and the quartermasters sign receipts that nobody will ever redeem. The factories run three shifts, the shops run out of coffee."
 COLDWAR_YUG_jna_un1: "Swords into Ploughshares"
 COLDWAR_YUG_jna_un1_desc: "In Kragujevac the lines that built carbines now stamp out car doors and the Zastava 750, and the army keeps the factory halls. The arms towns of Bosnia and Slavonia keep the guns and ask why the cars stay in Sumadija."
 COLDWAR_YUG_jna_lw2a: "The Belgrade Officer Academies"
 COLDWAR_YUG_jna_lw2a_desc: "Every future colonel goes through the same gate in Belgrade: one curriculum, one set of manuals, one table in the mess. The sons of the Black Mountain fill the benches far beyond their share, and Zagreb and Ljubljana count the names."
 COLDWAR_YUG_jna_lw2b: "The Republican Military Schools"
 COLDWAR_YUG_jna_lw2b_desc: "Why must every lieutenant of the Yugoslav army learn his trade on the Sava? Naval cadets train in Split, airmen in Zadar, engineers in Zagreb, and a military gymnasium opens in every republican capital. Belgrade calls it fragmentation, the republics call it fairness."
 COLDWAR_YUG_jna_a1f: "The Cabinet of Experts"
 COLDWAR_YUG_jna_a1f_desc: "The Council keeps the guns and gives the ministries to economists from Zagreb, Ljubljana and Belgrade. The inflation numbers improve, the generals grumble, and the Reformers say they told you so."
 COLDWAR_YUG_jna_a2f: "The Military Courts"
 COLDWAR_YUG_jna_a2f_desc: "Civilians who trouble the army are tried by the army: the curfew is enforced by courts martial and the sentences are read in Serbo Croatian, whatever the accused's language. The silence in the cafes is the verdict."
 COLDWAR_YUG_jna_b1f: "The Bosnian Arms Valley"
 COLDWAR_YUG_jna_b1f_desc: "From Mostar to Konjic the valleys of Bosnia hum with arms works that the generals can hide from every inspector. The republic gets jobs, and the Secretariat gets the biggest arsenal of the federation in one hand's reach."
 COLDWAR_YUG_jna_b2f: "The Strategic Reserves"
 COLDWAR_YUG_jna_b2f_desc: "Fuel, flour and steel sit in the army's bunkers under every mountain, to be issued by coupon. The queues are orderly, the shelves are bare, and the colonel in charge of the depot is the most popular man in town."
 COLDWAR_YUG_jna_un2a: "The Export Combines"
 COLDWAR_YUG_jna_un2a_desc: "TAM trucks from Maribor, FAP trucks from Priboj and IMT tractors from Rakovica were built for the army first, and now the army sells the rest. Every convoy that crosses the border to Baghdad or Tripoli brings back dollars, and the republics ask who keeps the account."
 COLDWAR_YUG_jna_un2b: "The Mountain Depots"
 COLDWAR_YUG_jna_un2b_desc: "Under the mountains of Bosnia the engineers have drilled for twenty years: tunnels for ammunition, fuel and spare parts, and a bunker near Konjic for the whole leadership. If the borders close and the banks refuse, the army still has what it needs for months."
 COLDWAR_YUG_jna_lw3a: "The Professional Cadre Army"
 COLDWAR_YUG_jna_lw3a_desc: "The generals stop counting heads and start counting skills. A corps of long service sergeants and contract specialists runs the platoons, the conscripts serve shorter, and the army becomes small, expensive and good."
 COLDWAR_YUG_jna_lw3b: "The Armed Youth"
 COLDWAR_YUG_jna_lw3b_desc: "Every fourteen year old learns to strip a rifle, read a map and march in step before the school year ends, and every village has a firing range behind the church. The army of All People's Defence is not a corps of professionals but the whole nation in uniform."
 COLDWAR_YUG_jna_pm: "The Chain of Command"
 COLDWAR_YUG_jna_pm_desc: "Ministries, republican governments and communes now follow a single chain of orders that ends in the Secretariat. It is faster than the delegate system, and nobody can say where the Presidency's authority begins."
 COLDWAR_YUG_jna_em: "The Military Industrial Complex"
 COLDWAR_YUG_jna_em_desc: "Djuro Djakovic in Slavonski Brod, SOKO in Mostar, the works of Konjic and Vogosca: a hundred plants, one customer, and over forty percent of the federal arms industry in Bosnia. Ljubljana and Skopje count the defence vote against the Federal Fund."
 COLDWAR_YUG_jna_un3a: "The Military Technical Institute"
 COLDWAR_YUG_jna_un3a_desc: "Behind the fence in Belgrade the Military Technical Institute designs rockets, optics and armour that the civilian ministries are not allowed to see. The best designs find foreign buyers, and the best engineers come willingly, because nobody else pays."
 COLDWAR_YUG_jna_un3b: "The Army Builds"
 COLDWAR_YUG_jna_un3b_desc: "The engineer battalions lay the bridges, the barracks town gets a road, and the road gets a village. In Macedonia the conscripts still pour the concrete that Skopje's budget never found after the earthquake, and the north pays."
 COLDWAR_YUG_jna_lw4: "The Partisan Veterans"
 COLDWAR_YUG_jna_lw4_desc: "The old fighters of 1941 still march on the anniversaries of the Sutjeska and Neretva, and they trust the army because it is the army they built. As long as one veteran sits in every village council, no general needs a decree."
 COLDWAR_YUG_jna_c1: "Officers of All Nations"
 COLDWAR_YUG_jna_c1_desc: "In every garrison a lieutenant from Split shares a table with a captain from Bitola and a major from Ljubljana, and the army tells them they are all Yugoslavs. Many of them write 'Yugoslav' in the census, more than in any other profession."
 COLDWAR_YUG_jna_c2: "The Serbian and Montenegrin Core"
 COLDWAR_YUG_jna_c2_desc: "The Secretariat trusts the men it knows: the sons of Montenegrin mountains and Serbian villages who joined the army before they could vote. Everyone else is told that Yugoslavia is safe in their hands."
 COLDWAR_YUG_jna_d1: "Arms from Both Blocs"
 COLDWAR_YUG_jna_d1_desc: "A MiG-21 and an M-47 stand in the same barracks yard, and the quartermaster knows both manuals. Belgrade buys from Washington and from Moscow, and the generals refuse to be the property of either."
 COLDWAR_YUG_jna_d2: "The Quiet Deal with Moscow"
 COLDWAR_YUG_jna_d2_desc: "The generals do not write it down and the Presidency does not ask. A Soviet admiral visits Tivat, Soviet spare parts arrive on credit, and the army learns again what the Russian manuals say about the Adriatic."
 COLDWAR_YUG_jna_ns: "Officers from the Third World"
 COLDWAR_YUG_jna_ns_desc: "Colonels from Lusaka, Algiers and Cairo sit in Belgrade's classrooms and learn how a small army fights a large one. The Non-Aligned Movement gets a school, and Belgrade gets friends who remember the teachers."
 COLDWAR_YUG_jna_c1f: "The Party in the Barracks"
 COLDWAR_YUG_jna_c1f_desc: "The League of Communists in the army has its own committees in every garrison, and lieutenants from eight republics sit in the same cell. The generals rule through the party card, and the barracks speak with the League's own voice."
 COLDWAR_YUG_jna_c2f: "The Counterintelligence Service"
 COLDWAR_YUG_jna_c2f_desc: "The Federal Secretariat does not need the party to know who can be trusted. Its own counterintelligence service keeps a file on every garrison commander and every republican staff, and the files go straight to the Secretariat."
 COLDWAR_YUG_jna_d1f: "Our Own Calibre"
 COLDWAR_YUG_jna_d1f_desc: "The two calibre worlds end in Kragujevac: one Yugoslav rifle and one Yugoslav infantry vehicle for every barracks, and no foreign quartermaster can switch off the spare parts. The generals are proud, the accountants less so."
 COLDWAR_YUG_jna_d2f: "The Soviet Missile Belt"
 COLDWAR_YUG_jna_d2f_desc: "Missile batteries on credit ring Belgrade, Nis and the Adriatic, and Soviet crews teach the Yugoslav brigades how to read a Russian radar screen. The Presidency says nothing, the General Staff sleeps better, and Washington counts the dishes."
 COLDWAR_YUG_jna_cm: "Brotherhood and Unity in Uniform"
 COLDWAR_YUG_jna_cm_desc: "On the day of the Republic the whole army parades in front of the Federal Assembly, eight flags carried by eight sergeants. Brotherhood and unity, the old slogan of 1941, now wears a uniform and has a drill sergeant."
 COLDWAR_YUG_jna_dm: "Defence in Every Direction"
 COLDWAR_YUG_jna_dm_desc: "The General Staff plans for an attack from the east, from the west and from the south, and every plan ends in the mountains and the village militias. Belgrade tells both camps the same thing: no foreign tank will cross the Danube unpaid."
 COLDWAR_YUG_jna_cap: "The Guarantor of the Federation"
 COLDWAR_YUG_jna_cap_desc: "Eight republics have quarrelled for fifty years and the army alone has never been divided. The generals call themselves the guarantor of the federation, and the rest of the world calls it a garrison."
 COLDWAR_YUG_jna_h: "The Mamula Years"
 COLDWAR_YUG_jna_h_desc: "Ljubicic leaves in May 1982, two years after Tito, and Admiral Branko Mamula takes the Secretariat. The new generation of generals has never fought a war, and nobody has told them that an army must not run a nation."
 COLDWAR_YUG_jna_k1: "Yugoslavia by the Army"
 COLDWAR_YUG_jna_k1_desc: "General Kadijevic does not want a Serbian army; he wants the Yugoslav one, with its eight republics and its five-pointed star. If the League cannot save the federation, the generals will."
 COLDWAR_YUG_jna_k2: "The Army of the Serbs"
 COLDWAR_YUG_jna_k2_desc: "In the officers' messes of Belgrade the toasts have changed. The army will no longer carry eight flags for eight republics, but guard the borders of the Serbian people wherever they run."
 COLDWAR_YUG_jna_k1f: "Collect the Republican Rifles"
 COLDWAR_YUG_jna_k1f_desc: "In May 1990 the trucks come to the Territorial Defence depots in Slovenia and Croatia and leave with the weapons. The generals call it routine inspection, Ljubljana and Zagreb call it disarmament."
 COLDWAR_YUG_jna_k2f: "The Serbian Reserve Divisions"
 COLDWAR_YUG_jna_k2f_desc: "Reservists in Sumadija and Vojvodina receive call-up papers for divisions that have only one nationality in their ranks. It is an army that can fight, but it is no longer the army of the Yugoslavs."
 COLDWAR_YUG_jna_km: "The Movement for Yugoslavia"
 COLDWAR_YUG_jna_km_desc: "On 4 November 1990 the army founds its own party, the League of Communists Movement for Yugoslavia, because the old League has dissolved itself and somebody must still stand for the whole country."
 COLDWAR_YUG_mon_e: "The Death of Peter II"
 COLDWAR_YUG_mon_e_desc: "On 3 November 1970 King Peter II dies in a hospital in Denver at forty seven. In Libertyville the exiles bury him in a Serbian monastery, and in London a twenty five year old prince who has never seen his country becomes the head of the House."
 COLDWAR_YUG_mon_pol: "The Patriarch's Blessing"
 COLDWAR_YUG_mon_pol_desc: "Patriarch German blesses the Crown Prince and calls him the heir of Saint Sava's dynasty. In every monastery a candle burns for Peter II, and in Zagreb the Catholic bishops watch which way the incense drifts."
 COLDWAR_YUG_mon_eco: "Restitution of the Crown Estates"
 COLDWAR_YUG_mon_eco_desc: "The royal farms and the old estates of the Banat fall back to the House, and every landowner of the plain suddenly remembers his title. Novi Sad cheers the leases, and the peasants of Slavonia and Bosnia ask who will come for their fields next."
 COLDWAR_YUG_mon_a1: "A Crowned Federation"
 COLDWAR_YUG_mon_a1_desc: "A Yugoslav kingdom, not a Serbian one: Croats, Slovenes, Serbs, Bosnians, Macedonians, Montenegrins and Albanians under one crown and eight seats at the council. The exiles in London speak of a crown above the nations, not above the Serbs."
 COLDWAR_YUG_mon_a2: "The Serbian Throne"
 COLDWAR_YUG_mon_a2_desc: "The kingdom of the Karadjordjevic has been Serbia's since Kosovo and Kumanovo. The exiles say the crown must sit on Serbian ground first: Belgrade's cafes stand to attention, while Zagreb and Pristina lock their doors."
 COLDWAR_YUG_mon_b1: "The Peasant Crown"
 COLDWAR_YUG_mon_b1_desc: "In the old kingdom ninety percent of the people lived on the land, and the dynasty rose from the pigs of Topola. The peasant king is a good story, and the farmer gets a cheque and a church bell."
 COLDWAR_YUG_mon_b2: "The Royal Investment Charter"
 COLDWAR_YUG_mon_b2_desc: "The crown opens its books to Western banks, and the royalist exiles in London and Chicago are the guarantors. Investors listen to a king; they do not listen to a Central Committee."
 COLDWAR_YUG_mon_a1f: "The Crown Council of Eight"
 COLDWAR_YUG_mon_a1f_desc: "Around the table of the Crown Council sit eight seats, one for each unit, and the Crown Prince decides only when the table is split. Montenegro sends an old general, and Slovenia sends a university professor."
 COLDWAR_YUG_mon_a2f: "Draskovic's Renewal Movement"
 COLDWAR_YUG_mon_a2f_desc: "Vuk Draskovic fills the squares with young men who wave the old tricolour and sing of the king. Ravna Gora is the word on every banner: the movement exists twenty years before it does in real life."
 COLDWAR_YUG_mon_b1f: "The Cooperative Villages of Sumadija"
 COLDWAR_YUG_mon_b1f_desc: "In Sumadija the old savings and credit cooperatives of the kingdom are rebuilt: a grain store, a dairy, a mill and a small school in every parish. Karadjordje's villages are the first to get the cheques."
 COLDWAR_YUG_mon_b2f: "Loans from the City of London"
 COLDWAR_YUG_mon_b2f_desc: "The emigre bankers of London sign the first royal loan on a table in St James's. The bonds are guaranteed by the House, and the bill comes in a currency that the court does not print."
 COLDWAR_YUG_mon_pm: "The Royal Council of State"
 COLDWAR_YUG_mon_pm_desc: "The Crown Prince has no party, no army and no cadre, but he has one thing: he can ask. When two units quarrel he summons them to the palace, and for a day at least they drink coffee together."
 COLDWAR_YUG_mon_em: "The Mixed Economy of the Crown"
 COLDWAR_YUG_mon_em_desc: "Private farms, private shops and state steel under one crown: a mixed economy with a king above it. The old merchants of the Knez Mihailova street open their shutters again, and the party store clerks look worried."
 COLDWAR_YUG_mon_c1: "Ravna Gora Rehabilitated"
 COLDWAR_YUG_mon_c1_desc: "Draza Mihailovic, the general of Ravna Gora, was shot in 1946 and lies in an unknown grave. The monarchists want his name back in the schoolbooks. In Zagreb and Sarajevo, the same name means something very different."
 COLDWAR_YUG_mon_c2: "Amnesty for the Partisans"
 COLDWAR_YUG_mon_c2_desc: "The old king had told Yugoslavs in 1944 to join Tito's partisans, and the son follows his example: the war is over, and nobody owns it. Amnesty for the commissars of 1945 and the officers of 1941 alike."
 COLDWAR_YUG_mon_d1: "The Allies of 1941"
 COLDWAR_YUG_mon_d1_desc: "Britain sheltered the king and the government in exile from 1941, and in Libertyville, Illinois, the Serbian church still sings for the House. The old friends are asked to remember the old alliance."
 COLDWAR_YUG_mon_d2: "The Oath of the Officers"
 COLDWAR_YUG_mon_d2_desc: "A colonel in Nis still wears his father's Royal Yugoslav Army sabre in the cupboard, and a major in Mostar remembers the oath of 1941. The crown asks them to swear once more."
 COLDWAR_YUG_mon_c1f: "The Gathering at Ravna Gora"
 COLDWAR_YUG_mon_c1f_desc: "Every spring the old officers climb the Ravna Gora hill with their medals, light fires and read the names of the fallen. The gathering becomes the great day of the House: priests bless it, Belgrade's cafes empty for it, and Zagreb and Pristina close their shutters."
 COLDWAR_YUG_mon_c2f: "The Gates Open to the Emigres"
 COLDWAR_YUG_mon_c2f_desc: "The exiles of Chicago, Toronto, Munich and Buenos Aires have waited a generation for a stamp in the passport. The amnesty has no list of names: the engineer, the priest and the man who once planted a bomb stand in the same queue at the airport."
 COLDWAR_YUG_mon_d1f: "The Balkan Pact Revived"
 COLDWAR_YUG_mon_d1f_desc: "In 1954 at Bled, Yugoslavia, Greece and Turkey signed a pact that Moscow called a Western trick and Washington called a miracle. The Crown's men dust off the text: three capitals on three coasts, and one chain of armies from the Adriatic to the Dardanelles."
 COLDWAR_YUG_mon_d2f: "The Royal Military Academy"
 COLDWAR_YUG_mon_d2f_desc: "The old academy on the Banjica road reopens under the royal arms: cadets in the white gloves of 1930, a riding hall, a chapel of Saint George. The teachers have commanded corps, and the first class of lieutenants swears the oath of the House."
 COLDWAR_YUG_mon_cm: "A Monarchy Above the Wounds"
 COLDWAR_YUG_mon_cm_desc: "At Oplenac, in the royal church of Saint George, a monarch stands beside the old partisan and the old Chetnik. For one afternoon in the vault of the Karadjordjevic dead, nobody mentions 1941."
 COLDWAR_YUG_mon_dm: "Neutrality Under the Crown"
 COLDWAR_YUG_mon_dm_desc: "The crown cannot join either camp without losing half its people. A neutral king above the blocs is the one thing that Washington and Moscow can both live with, and the one thing Belgrade's cafes cannot argue about."
 COLDWAR_YUG_mon_cap: "The Constitutional Monarchy"
 COLDWAR_YUG_mon_cap_desc: "On the Dedinje hill the flag of the House is raised: King Alexander, the grandson of Alexander the Unifier, takes the oath on the constitution. A crown that governs by consent, for all the peoples of Yugoslavia, or for Serbia alone."
 COLDWAR_YUG_fed_r: "Bratstvo i Jedinstvo"
 COLDWAR_YUG_fed_r_desc: "The partisans fought under this slogan in 1941 and Tito built a state on it. Every highway sign, school parade and May Day speech repeats it, and everyone in Belgrade knows what happens the day people stop believing it."
 COLDWAR_YUG_fed_c0_0: "The Kosovo Question"
 COLDWAR_YUG_fed_c0_0_desc: "In 1968 students carried the Albanian flag through Pristina, and Belgrade learned that the poorest corner of the federation is also the youngest. Tito wants the Albanians to feel at home in Yugoslavia before Tirana tells them otherwise."
 COLDWAR_YUG_fed_c1_0: "The Croatian Question"
 COLDWAR_YUG_fed_c1_0_desc: "Matica hrvatska, the oldest cultural society in Zagreb, has become a national party in all but name since the language declaration of 1967. Tito prefers to talk with the students before the students talk without him."
 COLDWAR_YUG_fed_c2_0: "Bosnia, Yugoslavia in Small"
 COLDWAR_YUG_fed_c2_0_desc: "Muslims, Serbs and Croats share every street in Sarajevo, and nobody asks who married whom. If Brotherhood and Unity fails here, it fails everywhere, so Belgrade sends money and lets the Bosnian party do the arithmetic."
 COLDWAR_YUG_fed_c3_0: "Macedonia and Montenegro"
 COLDWAR_YUG_fed_c3_0_desc: "Skopje still lives in the shadow of the earthquake of 1963 and the Black Mountain feeds a republic of six hundred thousand. Both sit at the bottom of the Federal Fund table and keep their eyes on Belgrade."
 COLDWAR_YUG_fed_c0_1a: "The University of Pristina"
 COLDWAR_YUG_fed_c0_1a_desc: "Lectures in Albanian, a library, a campus on the hill: the first generation of Albanian engineers and doctors will not come from Belgrade or from Tirana, but from Pristina. Some say it is Tito's gift, others say it is a seminary of nationalists."
 COLDWAR_YUG_fed_c0_1b: "Serbs Return to Kosovo"
 COLDWAR_YUG_fed_c0_1b_desc: "In Kosovo Polje and Gnjilane the Serbs sell their houses and leave for Nis and Belgrade, and the old men in the cafes say only the state can stop it. Bring them home with flats, jobs and a police station that answers."
 COLDWAR_YUG_fed_c1_1a: "More Currency for Zagreb"
 COLDWAR_YUG_fed_c1_1a_desc: "The hotels of Opatija and the yards of Rijeka earn Deutschmarks, and Zagreb wants to see them in Zagreb before Belgrade sees them. Bakaric nods: let the coast keep part of what it earns."
 COLDWAR_YUG_fed_c1_1b: "The National Bank Holds"
 COLDWAR_YUG_fed_c1_1b_desc: "Narodna banka in Belgrade holds every dollar and every mark and hands them out by the plan. Better one pool and one price, say the bankers, than eight republics selling the same dinar to eight exchange offices."
 COLDWAR_YUG_fed_c2_1: "The Sarajevo Winter Games"
 COLDWAR_YUG_fed_c2_1_desc: "In 1978 the IOC meets in Athens and picks Sarajevo over Sapporo and Gothenburg. The city that lit the fuse of 1914 will light a flame of peace, and the bobsled run goes up above the old Turkish quarter."
 COLDWAR_YUG_fed_c3_1a: "The Macedonian Orthodox Church"
 COLDWAR_YUG_fed_c3_1a_desc: "On 19 July 1967 the Macedonian bishops met in Ohrid and declared their church independent of Belgrade. The Serbian Patriarch calls it a schism, and a Macedonian peasant calls it the first church of his own in two hundred years."
 COLDWAR_YUG_fed_c3_1b: "The Bay of Kotor Rebuilt"
 COLDWAR_YUG_fed_c3_1b_desc: "On 15 April 1979 the sea coast of Montenegro shook from Ulcinj to Kotor. Old churches, hotels and whole villages are rubble, and UNESCO has just put the bay on its list."
 COLDWAR_YUG_fed_c0_2a: "Albanian Schools and Radio"
 COLDWAR_YUG_fed_c0_2a_desc: "In the villages around Gjakova and Prizren the lessons are in Albanian now, and in the evening Radio Pristina reads the news in the same language. A generation learns to read in a tongue that half of Belgrade never bothered to learn."
 COLDWAR_YUG_fed_c0_2b: "The Patriarchate at Pec"
 COLDWAR_YUG_fed_c0_2b_desc: "Under the red roofs at Pec the Serbian archbishops were once crowned, and every summer the buses bring pilgrims from Kraljevo and Cacak. Belgrade pays for the scaffolding and a policeman at the gate, and in Pristina people read the fence as a statement."
 COLDWAR_YUG_fed_c1_2a: "Croatian Banks Abroad"
 COLDWAR_YUG_fed_c1_2a_desc: "Zagrebacka banka and Privredna banka Zagreb keep desks in Frankfurt and Vienna, and the marks of the Croatian guest workers arrive straight at Jelacic Square. Belgrade asks whose foreign currency this is, and Zagreb answers that it is a bank, not a flag."
 COLDWAR_YUG_fed_c1_2b: "A Federal Currency Board"
 COLDWAR_YUG_fed_c1_2b_desc: "One vault, one rate, one rule, and no printing press for anyone who cannot show the dollars. The bankers in Belgrade call it the end of the monthly devaluation, and in Zagreb and Ljubljana they call it the end of the republic's own purse."
 COLDWAR_YUG_fed_c2_2: "The Agrokomerc Affair"
 COLDWAR_YUG_fed_c2_2_desc: "Fikret Abdic's food empire in Velika Kladusa paid its suppliers with promissory notes that no bank covered. When the paper comes due the whole Bosnian leadership trembles, and Belgrade enjoys the audit."
 COLDWAR_YUG_fed_c3_2a: "The Ohrid Summer of Culture"
 COLDWAR_YUG_fed_c3_2a_desc: "Every July the old church of Saint Sophia fills with violins and Macedonian verse, and the lake hotels fill with guests from Zagreb to Munich. Skopje calls it culture, Sofia calls it a Bulgarian heritage in the wrong language."
 COLDWAR_YUG_fed_c3_2b: "The Port of Bar"
 COLDWAR_YUG_fed_c3_2b_desc: "At Bar the cranes stand where a fishing village was, and the trains from Belgrade now run down to the water. The Montenegrins finally have a port that carries their own freight, and the dockers in Rijeka count the empty wagons."
 COLDWAR_YUG_fed_c0_3: "The Trepca Mines"
 COLDWAR_YUG_fed_c0_3_desc: "Stari Trg in Trepca has dug lead, zinc and silver since Roman times, and now it feeds half the metal of the federation. Whoever holds the pit holds the biggest payroll in Kosovo."
 COLDWAR_YUG_fed_c1_3: "Dalmatia and the Krajina"
 COLDWAR_YUG_fed_c1_3_desc: "Behind the tourist coast the Orthodox villages of the Krajina live on potatoes and pensions, and the old partisans remember who wore whose uniform in 1941. A road, a factory and a school can still decide which memory wins."
 COLDWAR_YUG_fed_c3_3: "Vojvodina, the Breadbasket"
 COLDWAR_YUG_fed_c3_3_desc: "The black earth of the Banat and Backa feeds the federation from Novi Sad to Subotica, and the Pannonian farmers want fertiliser, silos and a say in Belgrade."
 COLDWAR_YUG_fed_c0_4: "Kosovo After 1981"
 COLDWAR_YUG_fed_c0_4_desc: "The tanks have left Pristina and 226 are in prison, and now the federation puts Fund money into canteens, flats and a student hostel instead of only into police stations. Whether the young in Pristina believe it is another question."
 COLDWAR_YUG_eco_r: "The Yugoslav Economy"
 COLDWAR_YUG_eco_r_desc: "Neither plan nor market: the workers' council elects the director, the firm keeps its income and the republic pays for the mistakes. A Zastava, a Rade Koncar transformer and a Dalmatian hotel all live on the same ledger."
 COLDWAR_YUG_eco_c0_0: "The Debt Ledger"
 COLDWAR_YUG_eco_c0_0_desc: "Some clerk in the National Bank has finally added up what the republics borrowed in Frankfurt, Zurich and New York. The sum is bigger than any republic admitted, and every republic blames another."
 COLDWAR_YUG_eco_c1_0: "Zastava and Fiat"
 COLDWAR_YUG_eco_c1_0_desc: "In Kragujevac the red Zastava 750 rolls out under a licence from Turin and every family dreams of one. The Fica is also the first car on the Brotherhood and Unity highway to the sea."
 COLDWAR_YUG_eco_c2_0: "The Iron Gates"
 COLDWAR_YUG_eco_c2_0_desc: "The Danube cuts through the Carpathians at the gorge of the Iron Gates, and Belgrade and Bucharest build one dam together, as Tito and Gheorghiu-Dej agreed in 1963. Half the power goes to Belgrade, half to Bucharest, and neither can switch it off without the other."
 COLDWAR_YUG_eco_c3_0: "The Adriatic Coast"
 COLDWAR_YUG_eco_c3_0_desc: "Dalmatia and Istria already hold millions of guests every summer, and the Adriatic Highway winds above blue water. Tito's islands, a hotel on every cape and the policeman who waves at the Germans."
 COLDWAR_YUG_eco_c4_0: "Energoprojekt Abroad"
 COLDWAR_YUG_eco_c4_0_desc: "Energoprojekt builds dams, power stations and hotels for the Third World from Zambia to Guinea. Engineers from Belgrade sign contracts where the Soviets sign only treaties."
 COLDWAR_YUG_eco_c5_0: "The Private Peasant"
 COLDWAR_YUG_eco_c5_0_desc: "Eighty five percent of the land is still in private hands, after the collectives of 1949 failed in the villages. The peasant has ten hectares, a tractor, a son in Germany and a very long memory."
 COLDWAR_YUG_eco_c0_1a: "Borrow in Frankfurt"
 COLDWAR_YUG_eco_c0_1a_desc: "The Deutsche Bank and Chase Manhattan lend to anyone with a Yugoslav stamp, and the republics line up in Frankfurt with their wish lists. Pay later, and the cranes keep turning today."
 COLDWAR_YUG_eco_c0_1b: "Pay As We Go"
 COLDWAR_YUG_eco_c0_1b_desc: "Dinar in, dinar out: no new loans, no new cranes, no holiday abroad on credit. Slovenes grumble at the border queues and the Zagreb engineers watch Austrian firms win the contracts."
 COLDWAR_YUG_eco_c1_1: "The Yugo for America"
 COLDWAR_YUG_eco_c1_1_desc: "Malcolm Bricklin has an idea: a brand new car for 3,990 dollars that every student can afford. Kragujevac only needs to bolt the Fiat 128 into an export shell and sign."
 COLDWAR_YUG_eco_c2_1: "Krsko"
 COLDWAR_YUG_eco_c2_1_desc: "The Sava valley near Krsko has been chosen for a nuclear power station that Slovenia and Croatia will share. The republics argue about the site while the demand for current rises faster than any plan."
 COLDWAR_YUG_eco_c3_1a: "Package Tours for the West"
 COLDWAR_YUG_eco_c3_1a_desc: "Neckermann and TUI fill the planes and the Germans fill the hotels of Porec, Umag and Makarska. They pay in Deutschmarks and ask only for sun, cheap wine and a menu in German."
 COLDWAR_YUG_eco_c3_1b: "Holiday Homes for the Workers"
 COLDWAR_YUG_eco_c3_1b_desc: "Every big enterprise from Kragujevac to Zenica builds a holiday home on the coast: two weeks of sea for the workers, paid by the firm. The Croats count the plots and ask who owns the beach."
 COLDWAR_YUG_eco_c4_1: "The Port of Umm Qasr"
 COLDWAR_YUG_eco_c4_1_desc: "Where the Shatt al Arab meets the Gulf, Yugoslav cranes build a deep water port for Baghdad. A hundred thousand Yugoslavs work in Iraq, and the money comes home in dollars."
 COLDWAR_YUG_eco_c5_1a: "The Agrokombinat"
 COLDWAR_YUG_eco_c5_1a_desc: "The big socialist estates of PKB near Belgrade and Belje in Baranja farm ten thousand hectares each, with silos, abattoirs and exports. The smallholder is welcome to deliver to them."
 COLDWAR_YUG_eco_c5_1b: "Keep the Smallholders"
 COLDWAR_YUG_eco_c5_1b_desc: "The peasant keeps his land, his pigs and his plum brandy, and sends his sons to Germany to buy a Golf. Belgrade promises cheap fertiliser, and Vojvodina grumbles about the missed economy of scale."
 COLDWAR_YUG_eco_c0_2a: "The Eurodollar Syndicate"
 COLDWAR_YUG_eco_c0_2a_desc: "A syndicate of forty banks in London, Frankfurt and New York lends to Yugoslavia in a single signing. The finance men call it confidence, and an old accountant in the National Bank writes the date of the bill into his notebook."
 COLDWAR_YUG_eco_c0_2b: "The Export Surplus Drive"
 COLDWAR_YUG_eco_c0_2b_desc: "Zagreb engineers and Slovene shoemakers work for the foreign order book, and the shops at home get what is left. After the lean years the customs officers at Sezana count trucks outbound instead of inbound."
 COLDWAR_YUG_eco_c1_2a: "Steel at Smederevo"
 COLDWAR_YUG_eco_c1_2a_desc: "The blast furnaces of Smederevo glow above the Danube at night, and the steel goes into the cars, the bridges and the ships. Belgrade wants the new rolling mill, the Bosnians want it in Zenica."
 COLDWAR_YUG_eco_c1_2b: "Aluminium at Mostar"
 COLDWAR_YUG_eco_c1_2b_desc: "On the Neretva the bauxite from Herzegovina meets the cheap power of the Jablanica dams. If Mostar smelts it where it is mined, half the profits stay at home."
 COLDWAR_YUG_eco_c2_2a: "Westinghouse Builds Krsko"
 COLDWAR_YUG_eco_c2_2a_desc: "Westinghouse sells the pressurised water reactor, with American engineers on the Sava and a loan from the Export Import Bank. The Soviet embassy in Belgrade makes sure the Yugoslavs hear about it."
 COLDWAR_YUG_eco_c2_2b: "A Soviet Reactor for Krsko"
 COLDWAR_YUG_eco_c2_2b_desc: "A VVER from Atomenergoexport, the same type that Finland and Hungary have bought. Moscow offers fuel, training and a credit line, and the Marshal wonders what it costs in other coin."
 COLDWAR_YUG_eco_c3_2a: "Hotel Chains on the Adriatic"
 COLDWAR_YUG_eco_c3_2a_desc: "Riviera Porec, Hoteli Dubrovnik and the groups on Hvar and Makarska sign season contracts with Neckermann and TUI and build whole resorts in one winter. The marks flow, and so do the stories about who owns which hotel."
 COLDWAR_YUG_eco_c3_2b: "The Workers' Coast"
 COLDWAR_YUG_eco_c3_2b_desc: "From Kragujevac to Zenica the whole workforce takes the bus to the sea, two weeks a year at the firm's own beach hotel. The Dalmatians watch the trade union buses and ask who owns their coast."
 COLDWAR_YUG_eco_c4_2: "Contracts in Tripoli"
 COLDWAR_YUG_eco_c4_2_desc: "Colonel Gaddafi wants roads, hospitals and a new Tripoli, and Energoprojekt and Hidrogradnja send the engineers. In return the oil flows north in tankers across the Mediterranean."
 COLDWAR_YUG_eco_c5_2a: "PKB, the Belgrade Agrokombinat"
 COLDWAR_YUG_eco_c5_2a_desc: "Outside Belgrade the great estate of Padinska Skela farms the black earth with thousands of hands, silos, dairies and an export office. The director has a Mercedes, the tractor driver has a flat, and the smallholder has a delivery slip."
 COLDWAR_YUG_eco_c5_2b: "The Peasant Pension Law"
 COLDWAR_YUG_eco_c5_2b_desc: "For the first time the state writes to the old man with the ten hectares: after sixty five he gets a pension, whatever the pigs say. His sons stay on the farm a little longer, and the factory towns ask who is paying."
 COLDWAR_YUG_eco_c0_3: "Long Term Stabilisation"
 COLDWAR_YUG_eco_c0_3_desc: "Under IMF enhanced surveillance the Kraigher commission writes a programme with 25 proposals. The republics pass eight, the petrol coupons are printed and the nation learns the word stabilisation."
 COLDWAR_YUG_eco_c1_3a: "The Smederevo Blast Furnaces"
 COLDWAR_YUG_eco_c1_3a_desc: "The second furnace is lit above the Danube and the glow reaches Belgrade on a clear night. The plant builders want hard currency, and the steel will go into the cars, the bridges and the ships, whether Zenica likes it or not."
 COLDWAR_YUG_eco_c1_3b: "Bauxite from Herzegovina"
 COLDWAR_YUG_eco_c1_3b_desc: "Under the vineyards and tobacco fields of Herzegovina lies the bauxite that the whole Yugoslav aluminium industry feeds on. Open pits, red dust and a railway to the Neretva bring cash to Mostar, and the farmers get a new neighbour."
 COLDWAR_YUG_eco_c2_3a: "A Second Reactor at Prevlaka"
 COLDWAR_YUG_eco_c2_3a_desc: "Krsko works, so the Croatian power men say it is Zagreb's turn. A second Westinghouse unit on the Sava near the capital would heat half the city, and the farmers who own the meadows ask whether anyone remembers who pays."
 COLDWAR_YUG_eco_c2_3b: "A VVER Fleet for the South"
 COLDWAR_YUG_eco_c2_3b_desc: "Moscow offers a whole series, one standard reactor after another, with fuel, engineers and a credit line. The south would finally have current to spare, and the Marshal calculates what the fleet costs in other coin."
 COLDWAR_YUG_eco_c3_3: "Gastarbeiter Come Home"
 COLDWAR_YUG_eco_c3_3_desc: "In Stuttgart and Munich three quarters of a million Yugoslavs bolt Mercedes engines and send marks home. Belgrade asks whether they could bring the skill and the savings back and open a workshop instead."
 COLDWAR_YUG_eco_c0_4: "The Convertible Dinar Plan"
 COLDWAR_YUG_eco_c0_4_desc: "Ante Markovic stands before the Skupstina with 7 dinar to the Deutschmark and a wage freeze. The old money loses four zeros, and the shop prices stop for the first time in a decade."
 COLDWAR_YUG_eco_c2_4: "The Adriatic Pipeline"
 COLDWAR_YUG_eco_c2_4_desc: "JANAF will lay a pipe from the island of Krk across Croatia and Serbia and out to the Pancevo refinery, so that tankers can unload at Omisalj instead of on the Danube. Every republic wants the pumping stations."
 COLDWAR_YUG_mil_r: "The Yugoslav People's Army"
 COLDWAR_YUG_mil_r_desc: "Born in the forests of 1941, the army still sees itself as the oldest brother of Brotherhood and Unity. From Belgrade the generals look at eight republics and wonder which of them would stay loyal if the Marshal were gone."
 COLDWAR_YUG_mil_c0_0: "Total National Defence"
 COLDWAR_YUG_mil_c0_0_desc: "After Prague 1968 nobody in Belgrade trusts the road to the east or the west. General Ljubicic writes it down: every factory, every school and every village learns to fight alone for months if the capital falls."
 COLDWAR_YUG_mil_c1_0: "The National Key in the Officer Corps"
 COLDWAR_YUG_mil_c1_0_desc: "Serbs and Montenegrins are well over half of the active officers, and every other nation notices it. The Personnel Department starts to count by nation, rank by rank, school by school."
 COLDWAR_YUG_mil_c2_0: "Yugoimport SDPR"
 COLDWAR_YUG_mil_c2_0_desc: "Yugoimport sells rifles, mortars and trainers to anyone who pays in hard currency and asks for no flag. The general directorate in Belgrade keeps the lists, and the commissions go to the friends."
 COLDWAR_YUG_mil_c3_0: "SOKO Mostar"
 COLDWAR_YUG_mil_c3_0_desc: "In the Neretva valley, SOKO builds the helicopters and jets of the Yugoslav air force under the Herzegovina sun. Half of Mostar lives from the hangars."
 COLDWAR_YUG_mil_c4_0: "The Adriatic Fleet"
 COLDWAR_YUG_mil_c4_0_desc: "The Yugoslav navy sails out of Split, Pula and Kotor with frigates, patrol boats and a handful of submarines. Its job is not to win the sea but to make every invader pay in the bays."
 COLDWAR_YUG_mil_c0_1a: "The JNA Takes Command"
 COLDWAR_YUG_mil_c0_1a_desc: "The General Staff in Belgrade wants one chain of command for every rifle in the country. The republican headquarters keep their hats and lose their keys to the depots."
 COLDWAR_YUG_mil_c0_1b: "The Republican Militias"
 COLDWAR_YUG_mil_c0_1b_desc: "Let every republic arm and train its own people, as the 1974 constitution says. The Slovene and Croat commanders sleep better, the generals in Belgrade do not."
 COLDWAR_YUG_mil_c1_1a: "Officers from Every Nation"
 COLDWAR_YUG_mil_c1_1a_desc: "A Slovene colonel in Nis, a Macedonian general in Zagreb, a Bosnian major in Ljubljana. The generals grumble, but the army can tell every mother in every republic that her son will rise as high as any other."
 COLDWAR_YUG_mil_c1_1b: "Trust the Serbian Officers"
 COLDWAR_YUG_mil_c1_1b_desc: "The old partisan families fill the General Staff, and they run it as they run their regiments: with a hard hand and no questions. The army becomes harder and smaller, and every other nation sees whose army it is."
 COLDWAR_YUG_mil_c2_1: "The Orao with Romania"
 COLDWAR_YUG_mil_c2_1_desc: "A Yugoslav and a Romanian ground attack jet from one drawing board, with Rolls Royce Viper engines under licence. In Mostar and Craiova the engineers swap drawings and complain about the same ministries."
 COLDWAR_YUG_mil_c3_1: "The Galeb Trainer"
 COLDWAR_YUG_mil_c3_1_desc: "The Galeb teaches every young pilot from Zemun to Tripoli how to fly a jet that was built at home. The Super Galeb will fly in a few years, and then the flight schools of three continents will ask for it."
 COLDWAR_YUG_mil_c4_1: "The Submarine Pens of Vis"
 COLDWAR_YUG_mil_c4_1_desc: "Since the war the island of Vis is a fortress: closed to foreigners, honeycombed with tunnels, home to the midget submarines. Fishermen wave at a navy they are not allowed to photograph."
 COLDWAR_YUG_mil_c0_2a: "One Army, One Command"
 COLDWAR_YUG_mil_c0_2a_desc: "Every depot key, every radio net and every mobilisation plan goes through one office in Belgrade. The colonels in Zagreb and Ljubljana still wear their hats, but the orders no longer begin with their names."
 COLDWAR_YUG_mil_c0_2b: "Partisan Brigades in Every Commune"
 COLDWAR_YUG_mil_c0_2b_desc: "The old partisans still know the hills. Give every commune a brigade with its own commander and its own depot, and an invader meets a different army in every valley, drilled by men who fought in 1941."
 COLDWAR_YUG_mil_c1_2a: "The Military Academy Quotas"
 COLDWAR_YUG_mil_c1_2a_desc: "A seat at the Military Academy for a boy from Skopje, one for a boy from Pristina, one for a boy from Ljubljana. Fill the quota every year and in twenty years the General Staff speaks every language of the federation."
 COLDWAR_YUG_mil_c1_2b: "The Montenegrin Officer Tradition"
 COLDWAR_YUG_mil_c1_2b_desc: "Montenegro is small, but its families have sent sons to the army for as long as anyone can remember. Give them the colonels' posts and the army gets a hard core that follows an old name before it follows a new order."
 COLDWAR_YUG_mil_c2_2: "The M-84 Tank"
 COLDWAR_YUG_mil_c2_2_desc: "In Slavonski Brod the Soviet T-72 comes home as a Yugoslav tank with its own fire control and its own armour. The Djuro Djakovic works sends the new tanks down the Brotherhood and Unity highway to the garrisons."
 COLDWAR_YUG_mil_c3_2a: "MiGs from Moscow"
 COLDWAR_YUG_mil_c3_2a_desc: "The Yugoslav air force wants the new fighter, and only Moscow sells it. In Belgrade the generals hope the Americans look away, and the spare parts have to come from the east for twenty years."
 COLDWAR_YUG_mil_c3_2b: "The Novi Avion"
 COLDWAR_YUG_mil_c3_2b_desc: "Why buy a fighter when we can build our own? The Aeronautical Institute in Belgrade starts on the Novi Avion, a supersonic jet with Yugoslav avionics, and nobody asks yet who will pay for the engine."
 COLDWAR_YUG_mil_c4_2: "The Base at Kotor"
 COLDWAR_YUG_mil_c4_2_desc: "The Bay of Kotor is the best natural harbour on the Adriatic, and the Yugoslav navy knows it. Montenegro gets the cranes, and the admirals get a base where the mountains hide the masts."
 COLDWAR_YUG_mil_c0_3: "Disarm the Territorial Defence"
 COLDWAR_YUG_mil_c0_3_desc: "A sealed order from the General Staff: move the republican weapons into JNA barracks before anyone gets ideas. A depot sergeant in Zagreb counts the rifles and signs a paper he does not understand."
 COLDWAR_YUG_mil_c2_3: "Tanks for Kuwait"
 COLDWAR_YUG_mil_c2_3_desc: "The emirate wants tanks that its desert can bear and its treasury can pay. Yugoslavia sends the M-84, and Energoprojekt's cranes are already on the skyline."
 COLDWAR_YUG_mil_c3_3a: "MiG-29 Squadrons at Batajnica"
 COLDWAR_YUG_mil_c3_3a_desc: "At Batajnica outside Belgrade the first MiG-29s land with their drag chutes open. The pilots call it the best aeroplane they have ever flown, and the mechanics wait for the spare parts from the east."
 COLDWAR_YUG_mil_c3_3b: "Supersonic at SOKO Mostar"
 COLDWAR_YUG_mil_c3_3b_desc: "The Novi Avion does not stay on the drawing boards in Belgrade. The last assembly hall in Mostar opens its doors and a Yugoslav supersonic fighter rolls out into the Herzegovina sun, with every part signed for by someone at home."
 COLDWAR_YUG_sec_r: "The Service"
 COLDWAR_YUG_sec_r_desc: "Since Brioni the Service has no face and eight heads. Everyone in Yugoslavia is sure that someone is still writing it down, and nobody knows which republic's clerk it is."
 COLDWAR_YUG_sec_c0_0: "After Brioni"
 COLDWAR_YUG_sec_c0_0_desc: "On Brioni in July 1966 Tito accused Rankovic of bugging his own bedroom. The UDBA is broken up, and every republic gets a small service of its own with a new name."
 COLDWAR_YUG_sec_c1_0: "The Emigres"
 COLDWAR_YUG_sec_c1_0_desc: "In Munich, Stockholm and Sydney the Croatian emigre clubs plot and print. After our ambassador in Stockholm is shot dead in April 1971, nobody in Belgrade calls them harmless any more."
 COLDWAR_YUG_sec_c2_0: "The Dissidents"
 COLDWAR_YUG_sec_c2_0_desc: "In Belgrade cafes the professors talk about Marx and the Marshal. The Service writes it down, because a man who writes down what he thinks can be summoned."
 COLDWAR_YUG_sec_c0_1a: "A Federal SDB"
 COLDWAR_YUG_sec_c0_1a_desc: "Put the eight services under one roof in Belgrade, and nobody will go bombing again. The republics would rather their policemen answered to their own parliaments."
 COLDWAR_YUG_sec_c0_1b: "The Republican Services"
 COLDWAR_YUG_sec_c0_1b_desc: "Let every republic watch its own people and answer to its own parliament. The files stay in Zagreb and Ljubljana, and Belgrade learns what the republics choose to tell it."
 COLDWAR_YUG_sec_c1_1: "The Bugojno Group"
 COLDWAR_YUG_sec_c1_1_desc: "Nineteen men of the HRB cross the border in June 1972 to start an uprising on the Bosnian mountains. Within a month the army and the police have them, and the hunt ends the dream of a Croatian guerrilla."
 COLDWAR_YUG_sec_c2_1a: "Djilas Under Watch"
 COLDWAR_YUG_sec_c2_1a_desc: "Milovan Djilas, Tito's old comrade, lives in a small flat in Belgrade, a man who wrote that the party became a new class. His books come out in New York, and a car stands at his door every day."
 COLDWAR_YUG_sec_c2_1b: "Let Djilas Publish"
 COLDWAR_YUG_sec_c2_1b_desc: "Let him publish in Belgrade, let him lecture in Ljubljana. The old Marshal's friend of 1941 speaks to the public, and the party cells learn what a free debate sounds like."
 COLDWAR_YUG_sec_c0_2a: "The Federal Secretariat for the Interior"
 COLDWAR_YUG_sec_c0_2a_desc: "The Federal Secretariat for the Interior in Belgrade sits on top of eight republican services and wants every file they hold. Its inspectors carry briefcases and a federal stamp, and the republican ministers learn to smile."
 COLDWAR_YUG_sec_c0_2b: "Eight Services, Eight Files"
 COLDWAR_YUG_sec_c0_2b_desc: "Eight services, eight chiefs, eight filing cabinets. Zagreb watches its emigres, Ljubljana watches the Carinthian border, Pristina keeps its own books, and Belgrade is asked politely before anyone opens a drawer."
 COLDWAR_YUG_sec_c1_2a: "Liquidate the Emigres"
 COLDWAR_YUG_sec_c1_2a_desc: "The Service sends men with pistols to Munich and Stockholm. Every silenced voice is a problem less in Zagreb and a diplomatic note more in Bonn."
 COLDWAR_YUG_sec_c1_2b: "Watch, Do Not Shoot"
 COLDWAR_YUG_sec_c1_2b_desc: "No pistols, no bombs: the Service sits in the emigre clubs, drinks the beer and writes down names. The exile press goes on printing, and Bonn and Stockholm look the other way."
 COLDWAR_YUG_sec_c2_2a: "Article 133 Prosecutions"
 COLDWAR_YUG_sec_c2_2a_desc: "Article 133 punishes hostile propaganda, and propaganda is whatever the public prosecutor says it is. A poet in Belgrade, a student in Pristina and a journalist in Ljubljana learn that a sentence can be a few words long."
 COLDWAR_YUG_sec_c2_2b: "A Press Law for the Republics"
 COLDWAR_YUG_sec_c2_2b_desc: "Each republic gets a press law of its own and an editor who answers to his own assembly. Mladina prints the army budget, Vjesnik prints the Zagreb view, and Belgrade learns the news from the same papers as everyone else."
 COLDWAR_YUG_sec_c0_3: "Goli Otok Closes"
 COLDWAR_YUG_sec_c0_3_desc: "The Ibeovci who broke on the bare rock of Goli Otok are allowed to speak, and the Adriatic island is closed for good. The Service will no longer send anyone there, and the survivors tell their stories at last."
 COLDWAR_YUG_sec_c1_3a: "Operations in Munich"
 COLDWAR_YUG_sec_c1_3a_desc: "A flat in Munich, a car with Belgrade plates and a man who never gives his name. The Service has decided that the emigre leaders will not die in bed, and the Bavarian police start to draw maps of the crime scenes."
 COLDWAR_YUG_sec_c1_3b: "Informers in the Diaspora Clubs"
 COLDWAR_YUG_sec_c1_3b_desc: "Every Yugoslav club in Stuttgart, Toronto and Sydney has a treasurer, a folk dance group and a man who writes to Belgrade. Nobody has to shoot anybody; it is enough to know who sat at which table."
 COLDWAR_YUG_sec_c2_3: "The Belgrade Eight"
 COLDWAR_YUG_sec_c2_3_desc: "In January 1975 the Serbian assembly sacks eight professors of the Belgrade philosophy faculty. The summer school at Korcula is closed, and Praxis is no longer printed."
 COLDWAR_YUG_ext_r: "Non-Aligned Yugoslavia"
 COLDWAR_YUG_ext_r_desc: "From Belgrade in 1961 Tito, Nehru and Nasser invented a world that belongs to neither camp. Yugoslavia opens its doors to anyone who wants neither the Kremlin nor Wall Street."
 COLDWAR_YUG_ext_c0_0: "Lusaka 1970"
 COLDWAR_YUG_ext_c0_0_desc: "On the Zambian highveld more than fifty countries swear that peace and development are the same thing. Tito flies in with a plane full of Yugoslav engineers and an offer to build roads."
 COLDWAR_YUG_ext_c1_0: "Nixon in Belgrade"
 COLDWAR_YUG_ext_c1_0_desc: "The American President drives down the Belgrade avenues and the crowds wave. Washington wants a communist country that will not march with Moscow, and Tito wants credits and a reason for Brezhnev to be careful."
 COLDWAR_YUG_ext_c2_0: "Brezhnev in Belgrade"
 COLDWAR_YUG_ext_c2_0_desc: "General Secretary Brezhnev flies to Belgrade and asks Tito for a treaty. Tito gives him a banquet, a declaration about different roads to socialism, and a polite no."
 COLDWAR_YUG_ext_c3_0: "The Treaty of Osimo"
 COLDWAR_YUG_ext_c3_0_desc: "In a villa near Ancona the Italians and Yugoslavs sign away the last quarrel of the war: Zone B stays ours, Trieste stays theirs. Slovenes and Croats cheer, and in Trieste the shutters come down."
 COLDWAR_YUG_ext_c4_0: "Nasser's Heirs"
 COLDWAR_YUG_ext_c4_0_desc: "Tito and Nasser built the movement together, and Nasser died in September 1970. Sadat now rules the Nile, and the Yugoslav shipyards and engineers still have friends in Cairo."
 COLDWAR_YUG_ext_c0_1: "Colombo 1976"
 COLDWAR_YUG_ext_c0_1_desc: "In Colombo the movement asks for a new world economy: fair prices for raw materials, aid without strings. The Yugoslav delegates, who live on Western credit themselves, nod at every point."
 COLDWAR_YUG_ext_c1_1: "The EC Trade Agreement"
 COLDWAR_YUG_ext_c1_1_desc: "Brussels trades with Yugoslavia, and Yugoslavia is the first socialist country to ask. The Zagreb cattle breeders and the Ljubljana exporters wait for what the Six will say."
 COLDWAR_YUG_ext_c2_1: "The CMEA Associate"
 COLDWAR_YUG_ext_c2_1_desc: "Yugoslavia sits at the table of the CMEA as a guest, not as a member. Its ships and shoes go to Moscow, and its crude comes back in pipes, paid in clearing roubles."
 COLDWAR_YUG_ext_c3_1: "The Carinthian Slovenes"
 COLDWAR_YUG_ext_c3_1_desc: "Carinthian Slovenes still sing in Slovene and still wait for bilingual signs. Belgrade asks Vienna to honour Article 7 of the State Treaty, and Vienna asks about its own minorities in Yugoslavia."
 COLDWAR_YUG_ext_c4_1: "Contracts in Baghdad"
 COLDWAR_YUG_ext_c4_1_desc: "Iraqi crude for Yugoslav roads, bridges and ports. A hundred thousand Yugoslav workers will put on helmets in Basra, and the contract papers are signed in Baghdad."
 COLDWAR_YUG_ext_c0_2: "Havana 1979"
 COLDWAR_YUG_ext_c0_2_desc: "In Havana Fidel Castro argues that the Soviet Union is the movement's natural ally, and old Tito hobbles to the lectern to answer him. Neither camp's friend, he says, and half the hall applauds."
 COLDWAR_YUG_ext_c1_2: "The Cooperation Agreement of 1980"
 COLDWAR_YUG_ext_c1_2_desc: "In April 1980, a month before Tito's funeral, Brussels signs a wider agreement with the old Marshal's state. Trade, credits and a promise: when he is gone, Europe will still be there."
 COLDWAR_YUG_ext_c2_2a: "The Friendship Treaty"
 COLDWAR_YUG_ext_c2_2a_desc: "Brezhnev wants it in writing: friendship, cooperation and a seat at the Warsaw table if need be. Tito could sign, and Belgrade would never again be sure what its own army is for."
 COLDWAR_YUG_ext_c2_2b: "No Treaty, No Bases"
 COLDWAR_YUG_ext_c2_2b_desc: "Tito says it in the Blue Train and on television: no treaty, no foreign bases, no Soviet pasha in the Adriatic. The generals salute, the economists wince, and the Soviet ambassador goes home."
 COLDWAR_YUG_ext_c3_2: "The Macedonian Question"
 COLDWAR_YUG_ext_c3_2_desc: "Skopje wants a Macedonian nation, Athens wants nobody to say its name, and Sofia insists the Macedonians are Bulgarians. A free zone for Yugoslav goods in the port of Salonika keeps the peace for now."
 COLDWAR_YUG_ext_c4_2: "Tito in Beijing"
 COLDWAR_YUG_ext_c4_2_desc: "In 1977 Tito flies to Beijing and is welcomed as an old friend, after twenty years of quarrels and Chinese denunciation. Hua Guofeng visits Belgrade a year later."
 COLDWAR_YUG_ext_c0_3: "The Belgrade Summit of 1989"
 COLDWAR_YUG_ext_c0_3_desc: "Twenty eight years after the first conference, Belgrade hosts the movement again. The streets are painted and the shops are empty, and the heads of state eat well in the Sava Centre."
 COLDWAR_YUG_ext_c1_3: "The Recruitment Agreement"
 COLDWAR_YUG_ext_c1_3_desc: "A bus leaves Zagreb every morning for Stuttgart. The recruitment agreement with Bonn puts our workers on the German assembly lines, and the Deutschmarks come back in cardboard suitcases."
 COLDWAR_YUG_ext_c2_3a: "Soviet Repair Yards at Tivat"
 COLDWAR_YUG_ext_c2_3a_desc: "In the Bay of Kotor the cranes of the Arsenal can lift a Soviet hull as easily as a Yugoslav one. Moscow pays in roubles and asks for no flag on the quay; the staff in Belgrade calls it a repair contract, and nobody in Washington believes the name."
 COLDWAR_YUG_ext_c2_3b: "An Adriatic Without Fleets"
 COLDWAR_YUG_ext_c2_3b_desc: "Neither the Sixth Fleet nor the Soviet Mediterranean Squadron will drop anchor in our bays. Belgrade proposes an Adriatic without foreign fleets, a sea of ferries, fishermen and holidaymakers, and Rome and Athens listen."
 COLDWAR_YUG_ext_c3_3: "Albania, Our Neighbour"
 COLDWAR_YUG_ext_c3_3_desc: "Hoxha's Albania has broken with Moscow and will soon break with Beijing, and the only neighbour left is Yugoslavia. Pristina has relatives on the other side of the Drin."
 COLDWAR_YUG_srbcmd_r: "The Supreme Defence Council"
 COLDWAR_YUG_srbcmd_r_desc: "The federation that the partisans built is breaking apart in the cabinet rooms of Ljubljana and Zagreb. In Belgrade the generals and the Serbian leadership sit at one table and decide that the borders of the republics are not the borders of the nation."
 COLDWAR_YUG_srbcmd_c0_0: "General Mobilisation"
 COLDWAR_YUG_srbcmd_c0_0_desc: "The call-up papers go out to every reservist between twenty and fifty. In the villages of Sumadija the men report; in Belgrade, half of them do not open the door."
 COLDWAR_YUG_srbcmd_c1_0: "The Special Operations Units"
 COLDWAR_YUG_srbcmd_c1_0_desc: "State Security builds its own soldiers: red berets, black cars, no unit numbers on the reports. They answer to the police, not to the General Staff."
 COLDWAR_YUG_srbcmd_c0_1a: "Call Up Every Reservist"
 COLDWAR_YUG_srbcmd_c0_1a_desc: "Every man with a military book is called, and the police check the trains. The ranks are full again, but the anger follows the reservists into the trenches."
 COLDWAR_YUG_srbcmd_c0_1b: "Volunteers and Contracts"
 COLDWAR_YUG_srbcmd_c0_1b_desc: "Only those who want to fight will fight. The army shrinks, but the men in it stay, and they are paid in marks instead of promises."
 COLDWAR_YUG_srbcmd_c1_1: "Orders Without Paper"
 COLDWAR_YUG_srbcmd_c1_1_desc: "Some orders are given by telephone and never written down. Everyone in the room understands what they mean, and everyone knows that one day someone will ask who gave them."
 COLDWAR_YUG_srbcmd_c0_2a: "Military Police at the Bus Stations"
 COLDWAR_YUG_srbcmd_c0_2a_desc: "Patrols wait at the stations for young men with a suitcase. Thousands are caught; tens of thousands slip out through Hungary first."
 COLDWAR_YUG_srbcmd_c0_2b: "The Professional Brigades"
 COLDWAR_YUG_srbcmd_c0_2b_desc: "A smaller army of men who chose it: armoured brigades with experience, paid on time, kept away from village politics."
 COLDWAR_YUG_srbcmd_c1_2: "The Volunteer Guards"
 COLDWAR_YUG_srbcmd_c1_2_desc: "Football supporters, ex convicts and true believers sign up with men who answer to no officer. They fight hard and they fight dirty, and the army must stand next to them."
 COLDWAR_YUG_srbcmd_c0_3: "The Army of Yugoslavia"
 COLDWAR_YUG_srbcmd_c0_3_desc: "The JNA is dissolved into what Belgrade still calls the Army of Yugoslavia. The red star comes off the caps; the Bosnian and Croatian officers are told to go home."
 COLDWAR_YUG_srbfr_r: "The Wars of Succession"
 COLDWAR_YUG_srbfr_r_desc: "The map on the wall in the General Staff no longer shows one country. It shows fronts: the Karawanken, the Danube at Vukovar, the Drina, the Neretva."
 COLDWAR_YUG_srbfr_c0_0a: "Ten Days in Slovenia"
 COLDWAR_YUG_srbfr_c0_0a_desc: "The JNA marches to the border posts to take back the customs houses. It is not a war anyone in Belgrade wanted to fight, but no one wants to be the one who gave the order to stop."
 COLDWAR_YUG_srbfr_c0_0b: "Let Slovenia Go"
 COLDWAR_YUG_srbfr_c0_0b_desc: "Slovenia has almost no Serbs, and the army has better things to do. Belgrade lets the northern republic go and turns its eyes south to where the Serbs live."
 COLDWAR_YUG_srbfr_c1_0: "The Krajina Rising"
 COLDWAR_YUG_srbfr_c1_0_desc: "In Knin the Serbian villagers fell logs across the roads. Belgrade sends weapons, not police, and the Croatian state ends a few kilometres inland."
 COLDWAR_YUG_srbfr_c2_0: "Arming the Bosnian Serbs"
 COLDWAR_YUG_srbfr_c2_0_desc: "When the JNA leaves Bosnia it leaves behind its Bosnian Serb officers and almost all its weapons. On paper Belgrade withdrew; in practice the army only changed its badges."
 COLDWAR_YUG_srbfr_c3_0: "Podgorica Stays with Us"
 COLDWAR_YUG_srbfr_c3_0_desc: "The small mountain republic votes to stay with Serbia, and Belgrade pays its bills. It is a union of the poor with the poorer, but it is still Yugoslavia."
 COLDWAR_YUG_srbfr_c4_0: "Emergency Rule in Pristina"
 COLDWAR_YUG_srbfr_c4_0_desc: "Kosovo's autonomy was taken away in 1989, and the Albanians walked out of the schools and the hospitals. The province is held by police and nothing else."
 COLDWAR_YUG_srbfr_c0_1a: "Storm the Border Posts"
 COLDWAR_YUG_srbfr_c0_1a_desc: "The armoured columns roll to the Austrian border. The tanks reach the posts, and the world watches them on Austrian television."
 COLDWAR_YUG_srbfr_c0_1b: "Pull Back to the Kupa"
 COLDWAR_YUG_srbfr_c0_1b_desc: "Why bleed for Ljubljana? The army pulls back to the river line and the Croatian frontier, where it has Serbian villages behind it."
 COLDWAR_YUG_srbfr_c1_1: "The Battle for Vukovar"
 COLDWAR_YUG_srbfr_c1_1_desc: "Three months of artillery on a baroque town on the Danube. When it falls there is nothing left to take, and the army has learned that it cannot win like this."
 COLDWAR_YUG_srbfr_c2_1: "The Drina Corridor"
 COLDWAR_YUG_srbfr_c2_1_desc: "The corridor at Brcko is a few kilometres wide, and without it the western Serbs are cut off from Belgrade. Whoever holds Posavina holds the Serbian lands together."
 COLDWAR_YUG_srbfr_c3_1: "The Bay of Kotor Base"
 COLDWAR_YUG_srbfr_c3_1_desc: "The fleet leaves Split and Pula for the last Yugoslav harbour it can still use: the long fjord of Boka Kotorska."
 COLDWAR_YUG_srbfr_c4_1: "Novi Sad under Belgrade"
 COLDWAR_YUG_srbfr_c4_1_desc: "The autonomy of the north ended with the yoghurt revolution. Now the wheat of the Banat feeds the army and the young Hungarians cross the border to avoid the draft."
 COLDWAR_YUG_srbfr_c1_2a: "Drive to the Adriatic"
 COLDWAR_YUG_srbfr_c1_2a_desc: "Dubrovnik, Zadar, Split: the coast was Yugoslav and it could be again. The guns of Kotor open fire on the walls of Dubrovnik, and the whole world sees it."
 COLDWAR_YUG_srbfr_c1_2b: "Hold the Slavonian Line"
 COLDWAR_YUG_srbfr_c1_2b_desc: "The army digs in from Osijek to the Danube and lets Croatia come at it. Holding is cheaper than taking, and the line protects the Vojvodina."
 COLDWAR_YUG_srbfr_c2_2a: "All of Bosnia"
 COLDWAR_YUG_srbfr_c2_2a_desc: "Bosnia is Yugoslavia in miniature, and Belgrade decides to keep all of it. It means fighting the Muslims and the Croats at once, in every valley."
 COLDWAR_YUG_srbfr_c2_2b: "Partition with Zagreb"
 COLDWAR_YUG_srbfr_c2_2b_desc: "Two presidents meet at a hunting lodge in Vojvodina. What they say is never written down, but both sides draw lines through Bosnia afterwards."
 COLDWAR_YUG_srbfr_c3_2a: "Let Skopje Go in Peace"
 COLDWAR_YUG_srbfr_c3_2a_desc: "The JNA leaves Macedonia without firing a shot and takes the equipment with it. Skopje is poor and quiet, and Belgrade needs the troops elsewhere."
 COLDWAR_YUG_srbfr_c3_2b: "The Vardar Campaign"
 COLDWAR_YUG_srbfr_c3_2b_desc: "Macedonia sits on the road to Thessaloniki and the Aegean. The generals argue it must not become a second front run from Sofia or Tirana."
 COLDWAR_YUG_srbfr_c4_2a: "Tolerate the Parallel State"
 COLDWAR_YUG_srbfr_c4_2a_desc: "Let them have their schools in private houses and their elections in cafes, as long as they do not take up arms. A cold peace in Kosovo frees ten thousand police for the fronts."
 COLDWAR_YUG_srbfr_c4_2b: "Break the Parallel State"
 COLDWAR_YUG_srbfr_c4_2b_desc: "The police close the private schools and arrest the shadow ministers. It looks like order for a year; then the first armed men appear in Drenica."
 COLDWAR_YUG_srbout_r: "The Shape of the Peace"
 COLDWAR_YUG_srbout_r_desc: "Every war ends at a table. Belgrade must decide what it is fighting for: a country that is gone, or a country that can still be held."
 COLDWAR_YUG_srbout_c0_0a: "Restore the Federation"
 COLDWAR_YUG_srbout_c0_0a_desc: "The map on the wall shows one country again. It took years and a hundred thousand graves, and every village in Croatia and Bosnia remembers it."
 COLDWAR_YUG_srbout_c0_0b: "Serbia Alone"
 COLDWAR_YUG_srbout_c0_0b_desc: "Belgrade stops pretending. The Yugoslav flags come down in the ministries, and what remains is Serbia, smaller, poorer, and finally at peace with its own size."
 COLDWAR_YUG_srbout_c0_1a: "The Third Yugoslavia"
 COLDWAR_YUG_srbout_c0_1a_desc: "A new constitution: republics again, with their own assemblies, and Belgrade with the army and the money. It is a federation built over graves, and it will need a generation to hold."
 COLDWAR_YUG_srbout_c0_1b: "A Smaller, Harder State"
 COLDWAR_YUG_srbout_c0_1b_desc: "The state shrinks to what can be held and fortifies it. The war is not over in Belgrade's mind, it is only paused at the Drina."
 COLDWAR_YUG_srbout_c0_2: "Rebuilding After the War"
 COLDWAR_YUG_srbout_c0_2_desc: "Bridges over the Danube, the refinery at Pancevo, the trains to Bar: everything needs rebuilding, and there is no Marshall Plan for the losers."
 COLDWAR_YUG_srbhome_r: "The Home Front"
 COLDWAR_YUG_srbhome_r_desc: "Behind the front there is a city of queues. The shops are empty, the black market is full, and every month the banknotes have more zeros."
 COLDWAR_YUG_srbhome_c0_0: "War Finance from the Press"
 COLDWAR_YUG_srbhome_c0_0_desc: "The National Bank prints the army's pay. For a year it works; then the prices rise every hour and the pensioners queue at dawn for bread."
 COLDWAR_YUG_srbhome_c1_0: "Breaking the Embargo"
 COLDWAR_YUG_srbhome_c1_0_desc: "The UN embargo closes the ports and the airports. Every border with a river or a mountain becomes a business."
 COLDWAR_YUG_srbhome_c2_0: "The Refugee Centres"
 COLDWAR_YUG_srbhome_c2_0_desc: "Half a million Serbs from Croatia and Bosnia arrive with a tractor and a suitcase. They sleep in schools and holiday camps, and they vote for whoever promises them their villages back."
 COLDWAR_YUG_srbhome_c0_1: "The Pyramid Banks"
 COLDWAR_YUG_srbhome_c0_1_desc: "Dafiment and Jugoskandik promise fifteen percent a month on foreign currency. The state lets them run, takes their marks, and waits for the crash."
 COLDWAR_YUG_srbhome_c1_1: "Fuel over the Danube"
 COLDWAR_YUG_srbhome_c1_1_desc: "Barges with Romanian oil slip down the Danube at night, past the observers. The fuel goes to the army first and the black market second."
 COLDWAR_YUG_srbhome_c2_1: "Draft Dodgers Abroad"
 COLDWAR_YUG_srbhome_c2_1_desc: "The brightest young people leave with tourist visas and do not come back. They send money home, and the country gets older every year."
 COLDWAR_YUG_srbhome_c0_2: "The Avramovic Programme"
 COLDWAR_YUG_srbhome_c0_2_desc: "An old banker from the World Bank pegs a new dinar to the Deutschmark and forbids the press to print. Prices freeze overnight, and the war budget with them."
 COLDWAR_YUG_srbhome_c1_2: "The Grey Economy"
 COLDWAR_YUG_srbhome_c1_2_desc: "Half of Belgrade lives from the kiosk, the boot of a car, the cousin in Vienna. The state no longer fights it; it taxes it."
 COLDWAR_YUG_srbhome_c2_2a: "Amnesty for Deserters"
 COLDWAR_YUG_srbhome_c2_2a_desc: "Those who ran may come home without a trial. The army is furious, the mothers are grateful, and the war becomes a little less sacred."
 COLDWAR_YUG_srbhome_c2_2b: "Hunt the Deserters"
 COLDWAR_YUG_srbhome_c2_2b_desc: "Lists at the border, names in the newspapers, trials in absentia. Fewer run, and those who stay hate the state that holds them."
 COLDWAR_YUG_srbdip_r: "Friends in a Cold Room"
 COLDWAR_YUG_srbdip_r_desc: "Belgrade has almost no friends left. It looks east to Moscow and south to Athens, where the Orthodox churches still ring for the Serbs."
 COLDWAR_YUG_srbdip_c0_0: "Moscow Will Not Abandon Us"
 COLDWAR_YUG_srbdip_c0_0_desc: "The Russians speak of brothers, but they also need the West's credit. Belgrade asks, and waits for an answer from the Kremlin."
 COLDWAR_YUG_srbdip_c1_0a: "Sign the Peace Plan"
 COLDWAR_YUG_srbdip_c1_0a_desc: "Vance and Owen draw a map of ten provinces. Belgrade signs, and the Bosnian Serbs in Pale say no. A signature is cheap; a peace is not."
 COLDWAR_YUG_srbdip_c1_0b: "Reject the Peace Plan"
 COLDWAR_YUG_srbdip_c1_0b_desc: "The radicals in the assembly tear up the map. Belgrade will take what it can hold, and the world will have to accept the line where the guns stop."
 COLDWAR_YUG_srbdip_c0_1: "The Greek Corridor"
 COLDWAR_YUG_srbdip_c0_1_desc: "Greek trucks bring goods through the Vardar valley, and Greek banks hold Serbian money. The embargo has a door in the south."
 COLDWAR_YUG_srbsps_e: "The Socialists at War"
 COLDWAR_YUG_srbsps_e_desc: "The old League of Communists of Serbia renamed itself and kept its offices, its newspapers and its police. Milosevic speaks of Serbia and Yugoslavia in the same breath, and the voters in the villages believe him."
 COLDWAR_YUG_srbsps_pol: "Control the Television"
 COLDWAR_YUG_srbsps_pol_desc: "Radio Television Belgrade tells the country what happened today. On 9 March 1991 the opposition marches against the 'TV Bastille', and the tanks come out."
 COLDWAR_YUG_srbsps_eco: "The State Keeps the Factories"
 COLDWAR_YUG_srbsps_eco_desc: "No privatisation that the party cannot see. The big combines stay in social property, their directors sit in the party, and nobody is fired before an election."
 COLDWAR_YUG_srbsps_a1: "The Strong Hand in Pristina"
 COLDWAR_YUG_srbsps_a1_desc: "Kosovo is the heart of Serbia, and the heart is held by police. The party that rose with the speech at Gazimestan will not give back one inch of the province."
 COLDWAR_YUG_srbsps_a2: "The Coalition with JUL"
 COLDWAR_YUG_srbsps_a2_desc: "Mirjana Markovic's Yugoslav Left gathers the old communists, the managers and the generals' wives. It is the second party of power, and it sits at the president's breakfast table."
 COLDWAR_YUG_srbsps_b1: "Directors Loyal to the Party"
 COLDWAR_YUG_srbsps_b1_desc: "Every big factory gets a director who knows whom to call. The orders from the army keep the furnaces lit."
 COLDWAR_YUG_srbsps_b2: "Privatise to Friends"
 COLDWAR_YUG_srbsps_b2_desc: "Telekom Srbija is sold to the Italians and Greeks, other firms to men with good connections. The state gets cash for the war; the friends get the rest."
 COLDWAR_YUG_srbsps_pm: "The Rally at Gazimestan"
 COLDWAR_YUG_srbsps_pm_desc: "A million people on a field in Kosovo, six hundred years after the battle. The leader tells them battles are not yet excluded, and the crowd understands."
 COLDWAR_YUG_srbsps_em: "The Sanctions Economy"
 COLDWAR_YUG_srbsps_em_desc: "Under the embargo, the right to import is worth more than any factory. The state hands out licences, and the licence holders finance the party."
 COLDWAR_YUG_srbsps_c1: "The Patriot Who Ends the War"
 COLDWAR_YUG_srbsps_c1_desc: "The man who started the war now presents himself as the guarantor of peace. He drops the Bosnian Serbs, closes the Drina, and flies to Ohio to sign."
 COLDWAR_YUG_srbsps_c2: "War Until the Last Village"
 COLDWAR_YUG_srbsps_c2_desc: "Not one village is given up. The party and the radicals compete in who promises more, and the bill is sent to the next generation."
 COLDWAR_YUG_srbsps_cap: "Slobo's Serbia"
 COLDWAR_YUG_srbsps_cap_desc: "One man holds the party, the police, the television and the banks. The system is built to survive, but only as long as he does."
 COLDWAR_YUG_srbsrs_e: "The Serbian Radical Party"
 COLDWAR_YUG_srbsrs_e_desc: "Vojislav Seselj, a law professor who was jailed by Tito, now leads the radicals. He speaks of borders far to the west, and the crowds at the rallies cheer every new line."
 COLDWAR_YUG_srbsrs_pol: "The Chetnik Voivode"
 COLDWAR_YUG_srbsrs_pol_desc: "The radicals revive the old titles and the old songs. To their voters it means pride; to everyone else in the region it means fear."
 COLDWAR_YUG_srbsrs_eco: "Confiscate the Profiteers"
 COLDWAR_YUG_srbsrs_eco_desc: "Seize the fortunes of the war profiteers and the pyramid bankers. The poor applaud; the profiteers simply join the radicals."
 COLDWAR_YUG_srbsrs_a1: "Volunteers of the Radicals"
 COLDWAR_YUG_srbsrs_a1_desc: "The party sends its own men to the fronts in Croatia and Bosnia. They fight under the party's banners and answer to the party's leader."
 COLDWAR_YUG_srbsrs_a2: "Radicals in Parliament"
 COLDWAR_YUG_srbsrs_a2_desc: "The radicals put on suits and take the speaker's chair. Power changes them a little, and their voters notice."
 COLDWAR_YUG_srbsrs_b1: "The War Tax"
 COLDWAR_YUG_srbsrs_b1_desc: "Every salary pays for the front. The radicals tax shops, cafes and pensions until the war has what it needs."
 COLDWAR_YUG_srbsrs_b2: "Expel the Enemy Capital"
 COLDWAR_YUG_srbsrs_b2_desc: "Foreign companies are told to leave, and the banks of the enemy states are seized. Serbia stands alone and poorer."
 COLDWAR_YUG_srbsrs_pm: "Greater Serbia"
 COLDWAR_YUG_srbsrs_pm_desc: "The radical map runs from the Adriatic at Karlobag to the Hungarian border. Every Serb in the old Yugoslavia, and many who are not Serbs, are to live in one state."
 COLDWAR_YUG_srbsrs_em: "The Autarkic Economy"
 COLDWAR_YUG_srbsrs_em_desc: "If the world will not trade with Serbia, Serbia will make what it needs. Coal from Kolubara, wheat from the Banat, steel from Smederevo."
 COLDWAR_YUG_srbsrs_c1: "Karlobag, Ogulin, Karlovac, Virovitica"
 COLDWAR_YUG_srbsrs_c1_desc: "Four towns on a line west of Zagreb's suburbs mark the border of the radicals' dream. Writing it into the programme of a government means war without end."
 COLDWAR_YUG_srbsrs_c2: "The Radical Government"
 COLDWAR_YUG_srbsrs_c2_desc: "The radicals no longer need Milosevic. They take the ministries, the police and the television and govern alone."
 COLDWAR_YUG_srbsrs_cap: "The Radical Republic"
 COLDWAR_YUG_srbsrs_cap_desc: "A state organised for permanent war. It is feared, sanctioned and isolated, and its leaders believe that is proof they are right."
 COLDWAR_YUG_srbspo_e: "The Serbian Renewal Movement"
 COLDWAR_YUG_srbspo_e_desc: "Vuk Draskovic, a writer with a beard and a voice for crowds, leads the royalists. His party promises the crown back and the communists out."
 COLDWAR_YUG_srbspo_pol: "The Crown Prince Comes Home"
 COLDWAR_YUG_srbspo_pol_desc: "Crown Prince Alexander, born in exile in London, walks into the White Palace. The crowds want to see a king; the politicians want to see what he will do."
 COLDWAR_YUG_srbspo_eco: "Return the Confiscated Property"
 COLDWAR_YUG_srbspo_eco_desc: "Houses, shops and land taken in 1945 are returned to their owners and heirs. It is justice to some and eviction to others."
 COLDWAR_YUG_srbspo_a1: "The Serbian Guard"
 COLDWAR_YUG_srbspo_a1_desc: "In 1991 the movement had its own armed guard. Draskovic later regretted it; here it marches."
 COLDWAR_YUG_srbspo_a2: "The Vidovdan Assembly"
 COLDWAR_YUG_srbspo_a2_desc: "A great assembly on Vidovdan writes the new constitution, with every party at the table except those who refuse to come."
 COLDWAR_YUG_srbspo_b1: "Peasant Serbia"
 COLDWAR_YUG_srbspo_b1_desc: "The movement's voters live in the villages of Sumadija. Cheap credit, no requisitions, and a priest in every school."
 COLDWAR_YUG_srbspo_b2: "Belgrade Open for Business"
 COLDWAR_YUG_srbspo_b2_desc: "Foreign banks, foreign hotels, foreign capital: a royal Serbia must be open to Europe to be worth anything."
 COLDWAR_YUG_srbspo_pm: "A Crown under Parliament"
 COLDWAR_YUG_srbspo_pm_desc: "A king who reigns but does not rule, a parliament that rules and does not reign. The tricolour gets its crown back."
 COLDWAR_YUG_srbspo_em: "The Diaspora Investment"
 COLDWAR_YUG_srbspo_em_desc: "The Serbs of Chicago, Melbourne and Munich have money and memories of the king. Bonds in dollars bring both home."
 COLDWAR_YUG_srbspo_c1: "Peace and the King"
 COLDWAR_YUG_srbspo_c1_desc: "Draskovic turned against the war early. A royal Serbia offers peace to its neighbours in the name of a dynasty that once ruled them all."
 COLDWAR_YUG_srbspo_c2: "King and Fatherland"
 COLDWAR_YUG_srbspo_c2_desc: "The crown and the army march together, as they did in 1912 and 1914. The war becomes a national crusade with a king at its head."
 COLDWAR_YUG_srbspo_cap: "The Kingdom of Serbia"
 COLDWAR_YUG_srbspo_cap_desc: "The Karadjordjevic dynasty returns to Belgrade, eighty years after the first kingdom was proclaimed. A crown without a king's power, but a crown."
 COLDWAR_YUG_srbds_e: "The Democratic Party"
 COLDWAR_YUG_srbds_e_desc: "The party of the liberal intellectuals, refounded in 1990 on the name of a pre war party. Zoran Djindjic, a philosopher trained in Germany, wants a state that works."
 COLDWAR_YUG_srbds_pol: "The Students' Winter"
 COLDWAR_YUG_srbds_pol_desc: "Every evening for three months, tens of thousands walk through Belgrade with whistles. They win back the city councils the regime tried to steal."
 COLDWAR_YUG_srbds_eco: "The Reform Economy"
 COLDWAR_YUG_srbds_eco_desc: "Prices freed, social property converted to shares, and the loss makers closed. The economy shrinks before it grows."
 COLDWAR_YUG_srbds_a1: "End the One Party Media"
 COLDWAR_YUG_srbds_a1_desc: "Independent radio and television, a free B92, and a state broadcaster that no longer reads the party's press releases."
 COLDWAR_YUG_srbds_a2: "The Zajedno Coalition"
 COLDWAR_YUG_srbds_a2_desc: "Djindjic, Draskovic and Vesna Pesic join hands under the name 'Together'. Without the coalition there is no majority; with it there is no peace in the office."
 COLDWAR_YUG_srbds_b1: "Private Enterprise Law"
 COLDWAR_YUG_srbds_b1_desc: "A small business can be registered in a week instead of a year. Kiosks become shops, and shops become companies."
 COLDWAR_YUG_srbds_b2: "Open to the World"
 COLDWAR_YUG_srbds_b2_desc: "Lift the barriers, sign the trade deals, and let the investors in. The cost is to admit that the war was a mistake."
 COLDWAR_YUG_srbds_pm: "A Normal Country"
 COLDWAR_YUG_srbds_pm_desc: "Electricity on time, pensions paid, police who obey the law. A normal country is the most radical programme in Serbia."
 COLDWAR_YUG_srbds_em: "The IMF Agreement"
 COLDWAR_YUG_srbds_em_desc: "The Fund lends; the Fund dictates. Subsidies are cut, the dinar is floated, and the loans arrive."
 COLDWAR_YUG_srbds_c1: "Peace with the Neighbours"
 COLDWAR_YUG_srbds_c1_desc: "Recognise the borders, open the embassies, and trade with Zagreb and Sarajevo. The war is ended in law, not only on the ground."
 COLDWAR_YUG_srbds_c2: "Serbia in Europe"
 COLDWAR_YUG_srbds_c2_desc: "Brussels is the goal. Every law is written to fit a European rulebook, and every concession costs a vote at home."
 COLDWAR_YUG_srbds_cap: "The Democratic Serbia"
 COLDWAR_YUG_srbds_cap_desc: "A government that can lose an election and leave. It sounds simple; it took a decade of protest to reach."
 COLDWAR_YUG_srbdss_e: "The Democratic Party of Serbia"
 COLDWAR_YUG_srbdss_e_desc: "Vojislav Kostunica leaves the DS in 1992 to build a national, legalist party. He is honest, slow and stubborn, and his voters like all three."
 COLDWAR_YUG_srbdss_pol: "The Rule of Law"
 COLDWAR_YUG_srbdss_pol_desc: "Judges that cannot be phoned, police that need a warrant. The state becomes slower and harder to abuse."
 COLDWAR_YUG_srbdss_eco: "Legal Continuity"
 COLDWAR_YUG_srbdss_eco_desc: "No revolution, no purge: the old laws apply until new ones are passed. The directors keep their offices, and the change is slow."
 COLDWAR_YUG_srbdss_a1: "A Lawful Kosovo Policy"
 COLDWAR_YUG_srbdss_a1_desc: "Kosovo is Serbian by law and must be kept by law: courts, elections, rights for the Albanians, but no talk of independence."
 COLDWAR_YUG_srbdss_a2: "The Coalition of Serbia"
 COLDWAR_YUG_srbdss_a2_desc: "A broad coalition of eighteen parties against one man. It wins, and then it must govern together."
 COLDWAR_YUG_srbdss_b1: "The Social Market"
 COLDWAR_YUG_srbdss_b1_desc: "Pensions protected, prices of bread and milk watched, and privatisation with conditions for the workers."
 COLDWAR_YUG_srbdss_b2: "Fiscal Discipline"
 COLDWAR_YUG_srbdss_b2_desc: "Budgets that balance and a dinar that holds. The ministries complain; the savers sleep better."
 COLDWAR_YUG_srbdss_pm: "The Legalist State"
 COLDWAR_YUG_srbdss_pm_desc: "A state that follows its own constitution, even when it is inconvenient. It is the opposite of the 1990s."
 COLDWAR_YUG_srbdss_em: "Clean Hands"
 COLDWAR_YUG_srbdss_em_desc: "The war profiteers are audited, the smuggling bosses lose their licences, and the customs service is rebuilt."
 COLDWAR_YUG_srbdss_c1: "Neutral Serbia"
 COLDWAR_YUG_srbdss_c1_desc: "Not NATO, not Moscow, not the war: Serbia stays out of every alliance and keeps its army for its own borders."
 COLDWAR_YUG_srbdss_c2: "Serbs Across the Drina"
 COLDWAR_YUG_srbdss_c2_desc: "Not annexation but closeness: Belgrade and Banja Luka sign an agreement on schools, passports and trade."
 COLDWAR_YUG_srbdss_cap: "The Lawful Republic"
 COLDWAR_YUG_srbdss_cap_desc: "A conservative republic of laws: national in feeling, careful in action, and very slow to change."
 COLDWAR_YUG_skj_the_republican_keys: "The Republican Keys"
 COLDWAR_YUG_skj_the_republican_keys_desc: "Every republic holds a key to every federal office, which makes political advisors cheaper."
