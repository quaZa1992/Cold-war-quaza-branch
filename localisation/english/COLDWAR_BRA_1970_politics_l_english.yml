 COLDWAR_BRA_1970_party_1_1:0 "£generic_conservatism_small (ARENA) - National Renewal Alliance"
 COLDWAR_BRA_1970_party_1_1_desc:0 "(National Renewal Alliance)\n\nARENA is the regime’s civilian governing party under the post-1965 two-party system. Its party organisation remains distinct from the Armed Forces command."
 COLDWAR_BRA_1970_party_1_1_icon:0 "£generic_conservatism_small"
 COLDWAR_BRA_1970_party_1_2:0 "£generic_conservatism_small (PDS) - Democratic Social Party"
 COLDWAR_BRA_1970_party_1_2_desc:0 "(Democratic Social Party)\n\nThe PDS succeeds ARENA as the governing camp reorganises after the return to a multiparty system. It remains a civilian party, distinct from the Armed Forces command."
 COLDWAR_BRA_1970_party_1_2_icon:0 "£generic_conservatism_small"
 COLDWAR_BRA_1970_party_1_3:0 "£generic_conservatism_small (PFL) - Liberal Front Party"
 COLDWAR_BRA_1970_party_1_3_desc:0 "(Liberal Front Party)\n\nThe PFL forms from PDS dissidents during the transition and joins democratic opponents of military rule in a civilian coalition."
 COLDWAR_BRA_1970_party_1_3_icon:0 "£generic_conservatism_small"
 COLDWAR_BRA_1970_party_20_1:0 "£generic_Nat_Populism_small (Lacerdists) - Lacerdist political movement"
 COLDWAR_BRA_1970_party_20_1_desc:0 "(Lacerdist political movement)\n\nCarlos Lacerda remains an opposition politician with a national following. After his death, allies may continue the movement around Sandra Cavalcanti, his close associate from Guanabara."
 COLDWAR_BRA_1970_party_20_1_icon:0 "£generic_Nat_Populism_small"
 COLDWAR_BRA_1970_party_20_2:0 "£generic_Nat_Populism_small (PRN) - National Reconstruction Party"
 COLDWAR_BRA_1970_party_20_2_desc:0 "(National Reconstruction Party)\n\nA separate organisation founded in 1989, the PRN became Fernando Collor de Mello’s presidential vehicle. Its formation does not determine the election result."
 COLDWAR_BRA_1970_party_20_2_icon:0 "£generic_Nat_Populism_small"
 COLDWAR_BRA_1970_party_2_1:0 "£generic_liberalism_small (MDB) - Brazilian Democratic Movement"
 COLDWAR_BRA_1970_party_2_1_desc:0 "(Brazilian Democratic Movement)\n\nThe MDB is the legal opposition under the post-1965 two-party system, operating within institutions constrained by the military regime."
 COLDWAR_BRA_1970_party_2_1_icon:0 "£generic_liberalism_small"
 COLDWAR_BRA_1970_party_2_2:0 "£generic_liberalism_small (PMDB) - Brazilian Democratic Movement Party"
 COLDWAR_BRA_1970_party_2_2_desc:0 "(Brazilian Democratic Movement Party)\n\nThe PMDB carries the MDB opposition into restored multiparty politics."
 COLDWAR_BRA_1970_party_2_2_icon:0 "£generic_liberalism_small"
 COLDWAR_BRA_1970_party_2_3:0 "£generic_liberalism_small (PSDB) - Brazilian Social Democracy Party"
 COLDWAR_BRA_1970_party_2_3_desc:0 "(Brazilian Social Democracy Party)\n\nThe PSDB represents reformist social-democratic currents that split from the PMDB during constitutional politics."
 COLDWAR_BRA_1970_party_2_3_icon:0 "£generic_liberalism_small"
 COLDWAR_BRA_1970_party_3_1:0 "£generic_socialism_small (PTB) - Brazilian Labour Party, restored pre-1965 organisation"
 COLDWAR_BRA_1970_party_3_1_desc:0 "(Brazilian Labour Party, restored pre-1965 organisation)\n\nThe original PTB was dissolved in 1965. Restoring its organisation is an alternative political outcome, separate from the party later registered under Ivete Vargas."
 COLDWAR_BRA_1970_party_3_1_icon:0 "£generic_socialism_small"
 COLDWAR_BRA_1970_party_3_2:0 "£generic_socialism_small (PTB) - Brazilian Labour Party, registered successor"
 COLDWAR_BRA_1970_party_3_2_desc:0 "(Brazilian Labour Party, registered successor)\n\nIvete Vargas’s group secured the PTB name during party reorganisation, separate from Brizola’s supporters."
 COLDWAR_BRA_1970_party_3_2_icon:0 "£generic_socialism_small"
 COLDWAR_BRA_1970_party_3_3:0 "£generic_socialism_small (PDT) - Democratic Labour Party"
 COLDWAR_BRA_1970_party_3_3_desc:0 "(Democratic Labour Party)\n\nBrizola’s supporters formed the PDT after losing the PTB name to Ivete Vargas’s group during the party reorganisation."
 COLDWAR_BRA_1970_party_3_3_icon:0 "£generic_socialism_small"
 COLDWAR_BRA_1970_party_3_4:0 "£generic_socialism_small (PT) - Workers Party"
 COLDWAR_BRA_1970_party_3_4_desc:0 "(Workers Party)\n\nThe PT emerged from the new union movement and social organisations of the late dictatorship."
 COLDWAR_BRA_1970_party_3_4_icon:0 "£generic_socialism_small"
