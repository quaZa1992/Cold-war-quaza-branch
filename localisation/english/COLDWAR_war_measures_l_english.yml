 COLDWAR_WM_dec_shell_pk:0 "Shell the Peacekeepers"
 COLDWAR_WM_dec_shell_pk_desc:0 "§gFire on the positions of foreign peacekeepers to force them back into their bases.§!\n§YHistory:§! §gUNIFIL positions in southern Lebanon came under fire again and again after 1978.§!\n\nPossible in a Protected Zone of a country we are at war with. Not in a Protected Zone. Once per state every 365 days."
