 COLDWAR_WM_dec_conscription:0 "Forced Conscription"
 COLDWAR_WM_dec_conscription_desc:0 "§gRound up the men of an occupied region and put them into our uniform.§!\n§YHistory:§! §gForced to serve against their own country, forbidden by the Geneva Conventions of 1949.§!\n\nPossible in a state we control that belongs to a country we are at war with. Not in a Protected Zone. Once per state every 365 days."
