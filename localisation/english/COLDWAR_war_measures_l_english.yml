l_english:
 COLDWAR_WM_category:0 "War Measures"
 COLDWAR_WM_category_desc:0 "Measures in states we hold by force, against rebels at home and against unrest. Every one of them leaves evidence.\n\n§YEvidence:§! [?COLDWAR_WM_evidence|0] of 20. At 20 the story breaks and the evidence is spent. Foreign observers in the country can publish earlier.\n§YExposure:§! [?COLDWAR_WM_exposure|0] of 100 (25 Under Scrutiny, 50 Accused, 75 Pariah). It falls by 2 a month at war and 5 in peace."
 COLDWAR_WM_state_gui_title:0 "§YWar Measures§!   Evidence [?ROOT.COLDWAR_WM_evidence|0] / 20"
 COLDWAR_WM_state_gui_title_tt:0 "§YEvidence§! collects with every measure. At 20 the story reaches the world press, and the evidence turns into §YExposure§! (now [?ROOT.COLDWAR_WM_exposure|0] of 100)."
 COLDWAR_PK_category:0 "Peacekeeping"
 COLDWAR_PK_category_desc:0 "Our peacekeepers abroad. A Protected Zone shields its people from war measures while 1 to 3 of our divisions stand in it. Anyone may still march in, but whoever takes a zone by force will answer for it."
 COLDWAR_WM_accused:0 "Accused of War Crimes"
 COLDWAR_WM_accused_desc:0 "Governments across the world accuse us of war crimes. Our enemies find it easy to justify a war against us."
 COLDWAR_WM_pariah:0 "Pariah State"
 COLDWAR_WM_pariah_desc:0 "We are an outcast among nations. Trade partners and diplomats keep their distance, while our people close ranks."
 COLDWAR_WM_crushed:0 "Dissent Crushed"
 COLDWAR_WM_crushed_desc:0 "The streets are quiet. Nobody asks where the organisers have gone."
 COLDWAR_WM_crushed_com:0 "Order Restored"
 COLDWAR_WM_crushed_com_desc:0 "The organs of state security have restored order. The workplaces are calm, and the prisons are full."
 COLDWAR_WM_condemned:0 "Condemned our war crimes"
 COLDWAR_WM_stood_by:0 "Stood by us after a massacre"
 COLDWAR_WM_scrutiny:0 "Under Scrutiny for War Crimes"
 COLDWAR_WM_accused_opinion:0 "Accused of War Crimes"
 COLDWAR_WM_plunder:0 "Plundered"
 COLDWAR_WM_free_fire:0 "Free Fire Zone"
 COLDWAR_WM_cordon:0 "Cordoned"
 COLDWAR_WM_sweep:0 "Swept"
 COLDWAR_WM_relocation:0 "Relocated"
 COLDWAR_WM_defoliation:0 "Defoliated"
 COLDWAR_WM_defoliated_land:0 "Poisoned Land"
 COLDWAR_WM_conscription:0 "Press Ganged"
 COLDWAR_WM_crackdown:0 "Crackdown"
 COLDWAR_WM_interned:0 "Internment"
 COLDWAR_OBS_host:0 "International Observers"
 COLDWAR_OBS_sender:0 "Observer Missions Abroad"
 COLDWAR_PK_zone:0 "Protected Zone"
 COLDWAR_PK_rebuild:0 "Reconstruction by Peacekeepers"
 COLDWAR_PK_sender:0 "Peacekeepers Abroad"
 COLDWAR_PK_host_aid:0 "Humanitarian Aid"
 COLDWAR_PK_host_rebuild:0 "Peacekeeper Reconstruction"
 COLDWAR_PK_volunteers:0 "Peacekeepers under New Rules"
 COLDWAR_WM.1.t:0 "[GetCOLDWAR_WM_StoryTitle]"
 COLDWAR_WM.1.d:0 "[GetCOLDWAR_WM_StoryDesc][GetCOLDWAR_WM_StoryVerified][GetCOLDWAR_WM_StoryDead][GetCOLDWAR_WM_StoryFled][GetCOLDWAR_WM_StoryCount][GetCOLDWAR_WM_StoryTotal][GetCOLDWAR_WM_StoryLoot][GetCOLDWAR_WM_StoryComplicit]"
 COLDWAR_WM_loot_line:0 "\n§YValue taken from occupied land:§! §R[?global.COLDWAR_WM_story_loot|2] billion§!"
 COLDWAR_WM_verified_line:0 "\n\nThe reports were confirmed by the international observer mission of [COLDWAR_WM_story_verifier.GetNameDef]."
 COLDWAR_WM_complicit_one:0 "\n\n§RIt has also come out that observers of [COLDWAR_WM_story_accomplice.GetNameDef] saw it and stayed silent.§!"
 COLDWAR_WM_complicit_more:0 "\n\n§RIt has also come out that observers of [COLDWAR_WM_story_accomplice.GetNameDef] and [?global.COLDWAR_WM_story_complicit|0] missions in all saw it and stayed silent.§!"
 COLDWAR_WM_empty:0 ""
 COLDWAR_WM_dead_line:0 "\n\n§YKilled:§! §R[?global.COLDWAR_WM_story_dead|1] thousand§!"
 COLDWAR_WM_fled_line:0 "\n§YDriven from their homes:§! §R[?global.COLDWAR_WM_story_fled|1] thousand§!"
 COLDWAR_WM_count_line:0 "\n§gThe numbers cover §Y[?global.COLDWAR_WM_story_count|0]§! operations that went unreported until now.§!"
 COLDWAR_WM_total_line:0 "\n§YKilled by [COLDWAR_WM_story_perpetrator.GetAdjective] measures so far:§! §R[?global.COLDWAR_WM_story_total_dead|1] thousand§!"
 COLDWAR_WM.1.a:0 "We condemn it."
 COLDWAR_WM.1.b:0 "This is not our affair."
 COLDWAR_WM.1.c:0 "They are our allies. We stand by them."
 COLDWAR_WM.1.e:0 "Enemy propaganda."
 COLDWAR_OBS_send:0 "Send Observer Mission"
 COLDWAR_OBS_send_desc:0 "Offer an international observer mission. The host gains political power, stability and war support for every mission, but our observers will see what happens in its states, whoever does it.\nCosts §Y100§! political power and §Y0.15 billion§! a month."
 COLDWAR_OBS_send_send:0 "We offer [This.GetNameDef] an international observer mission. If they accept, our observers see every war measure in their states, whoever carries it out, and we decide whether the world hears of it.\nCosts §Y100§! political power and §Y0.15 billion§! a month."
 COLDWAR_OBS_end_send:0 "The observer mission between us and [This.GetNameDef] ends at once."
 COLDWAR_PK_send_send:0 "We offer [This.GetNameDef] peacekeepers. If they accept, we get military access and choose one of their states as our Protected Zone, two of our contingents march in and stay.\nCosts §Y100§! political power, §Y2 billion§!, §Y15,000§! manpower, then §Y0.4 billion§! a month."
 COLDWAR_PK_end_send:0 "The peacekeeping mission between us and [This.GetNameDef] ends at once, and the world will hear of it."
 COLDWAR_OBS_send_receive:0 "[Root.GetNameDefCap] offers to send an international observer mission. Observers raise our standing (§G+0.10§! political power a day, §G+2%§! stability and war support for each mission), but they will see everything that happens in our states, ours included."
 COLDWAR_OBS_send_accept_t:0 "Observers Accepted"
 COLDWAR_OBS_send_accept_d:0 "[This.GetNameDefCap] has accepted our observer mission."
 COLDWAR_OBS_send_reject_t:0 "Observers Refused"
 COLDWAR_OBS_send_reject_d:0 "[This.GetNameDefCap] does not want our observers in the country."
 COLDWAR_OBS_end:0 "End Observer Mission"
 COLDWAR_OBS_end_desc:0 "End the observer mission between us. Why, is a matter for diplomacy."
 COLDWAR_OBS_end_t:0 "Observer Mission Ended"
 COLDWAR_OBS_end_d:0 "The observer mission has packed up and left."
 COLDWAR_OBS_tt_players:0 "Only between players: both countries must be played by a human"
 COLDWAR_OBS_tt_host:0 "The country is at war, in civil war, in revolt or facing mass protests"
 COLDWAR_OBS_tt_neutral:0 "We are not at war with either side"
 COLDWAR_OBS_tt_host_limit:0 "The country hosts fewer than 4 observer missions"
 COLDWAR_OBS_tt_sender_limit:0 "We have fewer than 2 observer missions abroad"
 COLDWAR_OBS.1.t:0 "Our Observers in [COLDWAR_OBS_host.GetName] Report"
 COLDWAR_OBS.1.d:0 "Our observer mission in [COLDWAR_OBS_host.GetNameDef] has seen [GetCOLDWAR_OBS_Kind] [COLDWAR_OBS_state.GetName], carried out by [COLDWAR_OBS_perp.GetNameDef].\n\n§YDead:§! [?COLDWAR_OBS_seen_dead_k|1] thousand\n§YDriven from their homes:§! [?COLDWAR_OBS_seen_flee_k|1] thousand\n\nIf we publish, the world will hear it from us, confirmed. If we stay silent, nobody will know that we knew, unless the story comes out anyway."
 COLDWAR_OBS.1.a:0 "Publish the report."
 COLDWAR_OBS.1.a_already:0 "The story is already public."
 COLDWAR_OBS.1.b:0 "Say nothing."
 COLDWAR_OBS.1.b_tt:0 "If the story comes out later anyway, the news will name us as silent witnesses, and our stability will fall by §R3%§!."
 COLDWAR_OBS.2.t:0 "Foreign Observers Were Watching"
 COLDWAR_OBS.2.d:0 "Our operation in [COLDWAR_OBS_state.GetName] did not go unseen. The observer mission of [COLDWAR_OBS_first.GetNameDef] was there, and [?COLDWAR_OBS_watchers|0] missions in all have seen it. What they do with it is up to them."
 COLDWAR_OBS.2.a:0 "We know who they are."
 COLDWAR_PK_send:0 "Send Peacekeepers"
 COLDWAR_PK_SEND_TITLE:0 "Send Peacekeepers"
 COLDWAR_PK_SEND_ACTION_DESC:0 "Offer peacekeepers for one Protected Zone."
 COLDWAR_PK_END_TITLE:0 "End Peacekeeping Mission"
 COLDWAR_PK_END_ACTION_DESC:0 "End the peacekeeping mission between us."
 COLDWAR_OBS_SEND_TITLE:0 "Send Observer Mission"
 COLDWAR_OBS_SEND_ACTION_DESC:0 "Offer an international observer mission."
 COLDWAR_OBS_END_TITLE:0 "End Observer Mission"
 COLDWAR_OBS_END_ACTION_DESC:0 "End the observer mission between us."
 COLDWAR_PK.4.t:0 "Our Peacekeepers Are Welcome"
 COLDWAR_PK.4.d:0 "[COLDWAR_PK_new_host.GetNameDefCap] has accepted our peacekeepers. Now choose where they stand: open §YDecisions§!, category §YPeacekeeping§!, and click §YEstablish a Protected Zone§!. The states we may choose light up on the map. Two Peacekeeping Contingents are raised in our capital. March them into the zone: it protects while they stand there, and they stay as long as we want."
 COLDWAR_PK.4.a:0 "Choose the zone."
 COLDWAR_PK_send_desc:0 "Offer peacekeepers. After acceptance we choose one of their states as Protected Zone, 2 small contingents are raised in our capital and march there.\nCosts §Y100§! political power, §Y2 billion§!, §Y15,000§! manpower, then §Y0.4 billion§! a month."
 COLDWAR_PK_send_receive:0 "[Root.GetNameDefCap] offers to send peacekeepers. They would get military access and one Protected Zone in one of our states, where nobody, not even we, can use war measures while their troops stand there."
 COLDWAR_PK_send_accept_t:0 "Peacekeepers Accepted"
 COLDWAR_PK_send_accept_d:0 "[This.GetNameDefCap] has accepted our peacekeepers. Choose the Protected Zone in the Peacekeeping decisions."
 COLDWAR_PK_send_reject_t:0 "Peacekeepers Refused"
 COLDWAR_PK_send_reject_d:0 "[This.GetNameDefCap] does not want our peacekeepers."
 COLDWAR_PK_end:0 "End Peacekeeping Mission"
 COLDWAR_PK_end_desc:0 "Withdraw our peacekeepers, or ask theirs to leave. The world will notice."
 COLDWAR_PK_end_t:0 "Peacekeeping Ended"
 COLDWAR_PK_end_d:0 "The peacekeeping mission is over and the zones are lifted."
 COLDWAR_PK_tt_not_enemy:0 "We are not at war with them"
 COLDWAR_PK_tt_money:0 "We have at least 2 billion in the treasury"
 COLDWAR_PK_dec_zone:0 "Establish a Protected Zone"
 COLDWAR_PK_dec_zone_desc:0 "Declare this state our Protected Zone (one per mission). 2 Peacekeeping Contingents are raised in our capital; march them here, they protect while they stand in the state. While 1 to 3 of our divisions stand in it: no war measures by anyone, compliance growth §G+10%§!. An enemy of the host who takes the zone by force will damage our troops, break a story and give us a war goal against him."
 COLDWAR_PK_dec_task_aid:0 "Mandate: Humanitarian Aid"
 COLDWAR_PK_dec_task_aid_desc:0 "Our peacekeepers run relief convoys. The host pays §G5%§! less for social spending. Can be changed every 90 days."
 COLDWAR_PK_dec_task_relief:0 "Mandate: Refugee Relief"
 COLDWAR_PK_dec_task_relief_desc:0 "Our peacekeepers run camps and keep the roads safe. Half as many people flee from the Protected Zones. Can be changed every 90 days."
 COLDWAR_PK_dec_task_rebuild:0 "Mandate: Reconstruction"
 COLDWAR_PK_dec_task_rebuild_desc:0 "Our engineers rebuild. Productivity growth §G+50%§! in the Protected Zones, repairs §G+10%§! faster in the whole host country. Can be changed every 90 days."
 COLDWAR_PK_dec_shoot_back:0 "Rules of Engagement: Shoot Back"
 COLDWAR_PK_dec_shoot_back_desc:0 "Our peacekeepers stop standing between the lines. The Protected Zones end, and we may send volunteers to the host whatever the world tension. Send the contingents with the normal volunteer button in diplomacy: they stay our divisions under our command, and they arrive after the usual transfer time."
 COLDWAR_PK_dec_stand_down:0 "Stand Down"
 COLDWAR_PK_dec_stand_down_desc:0 "Our special permission to send volunteers to this country ends. Recall volunteers with the normal button in diplomacy."
 COLDWAR_PK.1.t:0 "[COLDWAR_PK_news_sender.GetAdjective] Peacekeepers for [COLDWAR_PK_news_host.GetName]"
 COLDWAR_PK.1.d:0 "[COLDWAR_PK_news_host.GetNameDefCap] has accepted peacekeepers from [COLDWAR_PK_news_sender.GetNameDef]. Their contingents will take up positions in Protected Zones, and whoever attacks them will have to answer to the world."
 COLDWAR_PK.1.a:0 "Blue helmets."
 COLDWAR_PK.2.t:0 "[GetCOLDWAR_PK_EndTitle]"
 COLDWAR_PK.2.d:0 "[GetCOLDWAR_PK_EndDesc]"
 COLDWAR_PK_end_1_t:0 "[COLDWAR_PK_news_sender.GetAdjective] Peacekeepers Withdraw"
 COLDWAR_PK_end_1_d:0 "[COLDWAR_PK_news_sender.GetNameDefCap] has withdrawn its peacekeepers from [COLDWAR_PK_news_host.GetNameDef]. The Protected Zones are gone."
 COLDWAR_PK_end_2_t:0 "[COLDWAR_PK_news_host.GetName] Sends the Peacekeepers Home"
 COLDWAR_PK_end_2_d:0 "[COLDWAR_PK_news_host.GetNameDefCap] has asked the peacekeepers of [COLDWAR_PK_news_sender.GetNameDef] to leave. The Protected Zones are gone, and the world wonders what comes next."
 COLDWAR_PK.2.a:0 "We will see."
 COLDWAR_PK.3.t:0 "[COLDWAR_PK_news_sender.GetAdjective] Peacekeepers Open Fire"
 COLDWAR_PK.3.d:0 "The peacekeepers of [COLDWAR_PK_news_sender.GetNameDef] in [COLDWAR_PK_news_host.GetNameDef] are no longer standing between the lines. Their government has changed the rules of engagement, and its contingents may now fight as volunteers."
 COLDWAR_PK.3.a:0 "So much for neutrality."
 COLDWAR_WM_kind_1:0 "the plunder of"
 COLDWAR_WM_title_1:0 "The Looting of [COLDWAR_WM_story_state.GetName]"
 COLDWAR_WM_desc_1_f:0 "Troops of [COLDWAR_WM_story_perpetrator.GetNameDef] are accused of stripping occupied [COLDWAR_WM_story_state.GetName] of everything that can be moved. Factories stand empty, granaries are bare, and [COLDWAR_WM_story_victim.GetNameDef] speaks of organised plunder of its people."
 COLDWAR_WM_kind_2:0 "a free fire zone in"
 COLDWAR_WM_title_2:0 "Free Fire Zone in [COLDWAR_WM_story_state.GetName]"
 COLDWAR_WM_desc_2_f:0 "[COLDWAR_WM_story_perpetrator.GetNameDefCap] has declared [COLDWAR_WM_story_state.GetName] a free fire zone. Correspondents report villages shelled without warning and columns of civilians on the roads. [COLDWAR_WM_story_victim.GetNameDefCap] accuses its enemy of waging war on the population itself."
 COLDWAR_WM_desc_2_h:0 "[COLDWAR_WM_story_perpetrator.GetNameDefCap] has turned its own province of [COLDWAR_WM_story_state.GetName] into a free fire zone against the rebels. Correspondents report villages shelled without warning and civilians fleeing across the border."
 COLDWAR_WM_kind_3:0 "mass arrests in"
 COLDWAR_WM_title_3:0 "Mass Arrests in [COLDWAR_WM_story_state.GetName]"
 COLDWAR_WM_desc_3_f:0 "In occupied [COLDWAR_WM_story_state.GetName], forces of [COLDWAR_WM_story_perpetrator.GetNameDef] seal off whole districts and take the men away. Families of the missing say many never came back. [COLDWAR_WM_story_victim.GetNameDefCap] calls it collective punishment."
 COLDWAR_WM_desc_3_h:0 "In rebellious [COLDWAR_WM_story_state.GetName], the security forces of [COLDWAR_WM_story_perpetrator.GetNameDef] seal off whole districts and take the men away. Families of the missing say many never came back."
 COLDWAR_WM_kind_4:0 "a massacre in"
 COLDWAR_WM_title_4:0 "Massacre in [COLDWAR_WM_story_state.GetName]"
 COLDWAR_WM_desc_4_f:0 "Survivors describe villages in [COLDWAR_WM_story_state.GetName] emptied by troops of [COLDWAR_WM_story_perpetrator.GetNameDef] in a punitive sweep. Foreign correspondents have reached the area, and the pictures are on front pages from Stockholm to Tokyo. [COLDWAR_WM_story_victim.GetNameDefCap] demands that the world act."
 COLDWAR_WM_desc_4_h:0 "Survivors describe villages in [COLDWAR_WM_story_state.GetName] emptied by the army of [COLDWAR_WM_story_perpetrator.GetNameDef] in a sweep against its own rebels. Foreign correspondents smuggled the pictures out, and they are on front pages from Stockholm to Tokyo."
 COLDWAR_WM_kind_5:0 "forced relocation in"
 COLDWAR_WM_title_5:0 "Villages Emptied in [COLDWAR_WM_story_state.GetName]"
 COLDWAR_WM_desc_5_f:0 "Whole villages in occupied [COLDWAR_WM_story_state.GetName] have been burned and their people marched into guarded camps by [COLDWAR_WM_story_perpetrator.GetNameDef]. Relief workers describe hunger and disease behind the wire. [COLDWAR_WM_story_victim.GetNameDefCap] calls it deportation."
 COLDWAR_WM_desc_5_h:0 "The government of [COLDWAR_WM_story_perpetrator.GetNameDef] is moving the rural population of [COLDWAR_WM_story_state.GetName] into fortified hamlets to cut the rebels off from food and recruits. Relief workers describe hunger and disease behind the wire."
 COLDWAR_WM_kind_6:0 "defoliation of"
 COLDWAR_WM_title_6:0 "Poisoned Forests of [COLDWAR_WM_story_state.GetName]"
 COLDWAR_WM_desc_6_f:0 "Aircraft of [COLDWAR_WM_story_perpetrator.GetNameDef] have sprayed the forests and fields of [COLDWAR_WM_story_state.GetName] with herbicides. Crops have died across the region, and doctors report sick children in the villages below the flight paths."
 COLDWAR_WM_kind_7:0 "the bombing of"
 COLDWAR_WM_title_7:0 "Cities of [COLDWAR_WM_story_state.GetName] in Flames"
 COLDWAR_WM_desc_7_f:0 "Wave after wave of bombers of [COLDWAR_WM_story_perpetrator.GetNameDef] struck the towns of [COLDWAR_WM_story_state.GetName]. Hospitals and housing blocks are among the ruins, and [COLDWAR_WM_story_victim.GetNameDef] has shown foreign reporters the dead."
 COLDWAR_WM_kind_9:0 "torture centres in"
 COLDWAR_WM_title_9:0 "Torture in [COLDWAR_WM_story_state.GetName]"
 COLDWAR_WM_desc_9_f:0 "Former prisoners describe interrogation centres run by [COLDWAR_WM_story_perpetrator.GetNameDef] in occupied [COLDWAR_WM_story_state.GetName]: beatings, electric shocks and people who disappear at night. [COLDWAR_WM_story_victim.GetNameDefCap] has handed the testimonies to the press."
 COLDWAR_WM_desc_9_h:0 "Former prisoners describe interrogation centres run by the security forces of [COLDWAR_WM_story_perpetrator.GetNameDef] in [COLDWAR_WM_story_state.GetName]: beatings, electric shocks and people who disappear at night."
 COLDWAR_WM_kind_10:0 "forced conscription in"
 COLDWAR_WM_title_10:0 "Press Gangs in [COLDWAR_WM_story_state.GetName]"
 COLDWAR_WM_desc_10_f:0 "Young men in occupied [COLDWAR_WM_story_state.GetName] are being rounded up by [COLDWAR_WM_story_perpetrator.GetNameDef] and sent to the front in the uniform of the enemy of their own country. [COLDWAR_WM_story_victim.GetNameDefCap] calls it a crime against its citizens."
 COLDWAR_WM_kind_11:0 "shelling of peacekeepers in"
 COLDWAR_WM_title_11:0 "Peacekeepers Shelled in [COLDWAR_WM_story_state.GetName]"
 COLDWAR_WM_desc_11_f:0 "Artillery of [COLDWAR_WM_story_perpetrator.GetNameDef] has hit the positions of the [COLDWAR_WM_story_pk.GetAdjective] peacekeepers in [COLDWAR_WM_story_state.GetName]. Blue helmets are among the wounded, and the contingent has withdrawn into its bases."
 COLDWAR_WM_kind_12:0 "death squads in"
 COLDWAR_WM_title_12:0 "Death Squads in [COLDWAR_WM_story_state.GetName]"
 COLDWAR_WM_desc_12_h:0 "Bodies are found at dawn by the roadsides around [COLDWAR_WM_story_state.GetName]. Mothers of the disappeared gather in front of the ministries of [COLDWAR_WM_story_perpetrator.GetNameDef], and foreign journalists now print the names of the missing."
 COLDWAR_WM_kind_13:0 "a security crackdown in"
 COLDWAR_WM_title_13:0 "Crackdown in [COLDWAR_WM_story_state.GetName]"
 COLDWAR_WM_desc_13_h:0 "The state security of [COLDWAR_WM_story_perpetrator.GetNameDef] has arrested thousands of strikers, students and dissidents in [COLDWAR_WM_story_state.GetName]. Smuggled letters tell of overcrowded prisons and of people who were never charged."
 COLDWAR_WM_kind_14:0 "internment without trial in"
 COLDWAR_WM_title_14:0 "Internment without Trial in [COLDWAR_WM_story_state.GetName]"
 COLDWAR_WM_desc_14_h:0 "In dawn raids the security forces of [COLDWAR_WM_story_perpetrator.GetNameDef] have interned hundreds of suspects without charge or trial. Lawyers speak of beatings in the camps, and the free press of the country prints every account."
 COLDWAR_WM_kind_15:0 "the overrunning of peacekeepers in"
 COLDWAR_WM_title_15:0 "Peacekeepers Overrun in [COLDWAR_WM_story_state.GetName]"
 COLDWAR_WM_desc_15_f:0 "Troops of [COLDWAR_WM_story_perpetrator.GetNameDef] have stormed [COLDWAR_WM_story_state.GetName] straight through the positions of the [COLDWAR_WM_story_pk.GetAdjective] peacekeepers. The blue helmets took heavy losses, and their government is under pressure to answer."
 COLDWAR_WM_tt_people:0 "£manpower_texticon §R[?COLDWAR_WM_p_dead|1]§! thousand people killed, §R[?COLDWAR_WM_p_flee|1]§! thousand driven from their homes. More will flee each week."
 COLDWAR_WM_tt_money:0 "£treasury §G+[?COLDWAR_WM_p_money|2]§! billion taken from the region"
 COLDWAR_WM_tt_draft:0 "£manpower_texticon §G+[?COLDWAR_WM_p_draft|0]§! manpower pressed into service"
 COLDWAR_WM_tt_intel:0 "£GFX_SPY_satellite_texticon Intelligence on the owner: civilian §G+10§!, army §G+10§!"
 COLDWAR_WM_tt_shell:0 "The peacekeepers lose §G50%§! organisation and §G20%§! strength. The Protected Zone stops protecting for §Y90§! days. Their country: war support §R+5%§!."
 COLDWAR_WM_tt_evidence:0 "£decision_icon_small §YEvidence§! §R+[?COLDWAR_WM_p_gain|0]§!, then §Y[?COLDWAR_WM_p_after|0]§! of 20. At 20 the story reaches the world press."
 COLDWAR_WM_tt_protests:0 "£political_violence_texticon Protests §G-20§!, radicalisation §G-2§!"
 COLDWAR_WM_tt_prod_5:0 "Productivity of the state §R-5%§!"
 COLDWAR_WM_tt_prod_10:0 "Productivity of the state §R-10%§!"
 COLDWAR_WM_tt_prod_15:0 "Productivity of the state §R-15%§!"
 COLDWAR_WM_dec_plunder:0 "Plunder the Region"
 COLDWAR_WM_dec_plunder_desc:0 "§gStrip the occupied land of food, machinery and anything of value.§!\n§YHistory:§! §gSoviet removal of factories from Manchuria, 1945. Iraqi looting of Kuwait, 1990.§!\n\nPossible in a state we control that belongs to a country we are at war with. Not in a Protected Zone. Once per state every 730 days."
 COLDWAR_WM_btn_plunder_tt:0 "£decision_icon_small §YPlunder the Region§!  £political_power §Y25§!\n§gStrip the occupied land of food, machinery and anything of value.§!\n§YHistory:§! §gSoviet removal of factories from Manchuria, 1945. Iraqi looting of Kuwait, 1990.§!\n\n§YIn [THIS.GetName]:§!\n£treasury §G+[?THIS.COLDWAR_WM_pv_money|2]§! billion for us\n£manpower_texticon §R[?THIS.COLDWAR_WM_pv_plunder_d|1]§! thousand killed, §R[?THIS.COLDWAR_WM_pv_plunder_f|1]§! thousand driven from their homes\nProductivity of the state §R-15%§!\nState spirit §YPlundered§! for §Y730§! days: productivity growth §R-50%§!, resistance target §R+10%§!, compliance growth §R-20%§!\nWar support of the owner §R+2%§!\n£decision_icon_small §YEvidence§! §R+8§! (one and a half times as a democracy), now §Y[?ROOT.COLDWAR_WM_evidence|0]§! of 20\n\n§gPossible in a state we control that belongs to a country we are at war with, while at war, in a civil war or a revolt. Not in a Protected Zone. Once per state every 730 days. No region loses more than a quarter of its people to measures and flight.§!"
 COLDWAR_WM_dec_free_fire:0 "Declare a Free Fire Zone"
 COLDWAR_WM_dec_free_fire_desc:0 "§gAnyone moving in the zone counts as the enemy. Artillery and aircraft fire without clearance.§!\n§YHistory:§! §gFree fire zones of the Vietnam War.§!\n\nPossible in a state we control that belongs to an enemy, or our own state in revolt. Not in a Protected Zone. Once per state every 180 days."
