 COLDWAR_WM_dec_cordon:0 "Cordon and Search"
 COLDWAR_WM_dec_cordon_desc:0 "§gSeal off a district and search it house by house, taking away the men of fighting age.§!\n§YHistory:§! §gBritish operations in Northern Ireland from 1970. French operations in Algeria.§!\n\nPossible in an occupied enemy state or our own state in revolt, with resistance of 20 or more. Not in a Protected Zone. Once per state every 180 days."
