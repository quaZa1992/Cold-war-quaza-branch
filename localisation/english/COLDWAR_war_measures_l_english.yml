 COLDWAR_WM_dec_sweep_desc:0 "§gA punitive operation against the villages that shelter the rebels.§!\n§YHistory:§! §gMy Lai, South Vietnam, 1968.§!\n\nPossible in an occupied enemy state or our own state in revolt, with resistance of 20 or more. Not in a Protected Zone. Once per state every 365 days."
