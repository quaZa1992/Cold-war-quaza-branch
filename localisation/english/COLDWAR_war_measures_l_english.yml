 COLDWAR_WM_dec_death_squads:0 "Unleash the Death Squads"
 COLDWAR_WM_dec_death_squads_desc:0 "§gParamilitary killers make leaders of the protests disappear.§!\n§YHistory:§! §gArgentina, 1976 to 1983. El Salvador and Guatemala in the 1980s.§!\n\nPossible during mass protests, a revolt or a civil war, also in peace. Once a year."
 COLDWAR_WM_dec_crackdown:0 "State Security Crackdown"
 COLDWAR_WM_dec_crackdown_desc:0 "§gThe state security service arrests strikers, students and dissidents by the thousand.§!\n§YHistory:§! §gMartial law in Poland, December 1981. Normalisation in Czechoslovakia after 1969.§!\n\nPossible during mass protests, a revolt or a civil war, also in peace. Once a year."
 COLDWAR_WM_dec_internment:0 "Internment without Trial"
 COLDWAR_WM_dec_internment_desc:0 "§gSuspects are held without charge or trial.§!\n§YHistory:§! §gOperation Demetrius, Northern Ireland, August 1971.§!\n\nPossible during mass protests, a revolt or a civil war, also in peace. Once a year."
