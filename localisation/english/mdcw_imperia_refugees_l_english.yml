l_english:
 imp_refugee_pull_modifier: "Refugee Pull"
 imp_refugee_integration_rate: "Refugee Integration Rate"
 imp_refugees_decisions: "UNHCR Report"
 imp_refugees_decisions_desc: "Formally known as the §YOffice of the High Commissioner for Refugees§!, the UNHCR was established by the §YGeneral Assembly of the United Nations§! in 1950 in the aftermath of the Second World War to help the millions of people who had lost their homes.\n\n§YAny lingering conflicts will displace large amounts of people§!, most of whom will flee to §Yneighbouring countries§!. This sudden influx of refugees may §Rdestabilize already vulnerable nations§!, creating §Reconomic strain§! or §Rpolitical tension§!. A smaller portion of these displaced peoples may also attempt to flee to §Yricher, more distant nations§!. A nation's §Yimmigration policy§! plays a crucial role in determining how many refugees ultimately find their way within its borders.\n\nSince the dawn of the new Milennium, §R[?global.imp_total_refugees_k|0]k§! people worldwide have been forced to abandon their homes and seek refuge abroad.\n§R[?imp_total_refugees_k|0]k§! people have fled §Y[root.GetNameWithFlag]§! because of war, and we have provided shelter and support to §G[?imp_refugees_taken_k|0]k§! refugees.\n\nOf these, §R[?imp_costly_refugees_k|0]k§! people have not yet integrated into our society and are causing significant strain on our health and social budgets."
 imp_refugee_block_costs: "Increased Border Security Costs"
 imp_refugee_block_costs_desc: "With the influx of refugees crossing the border, additional security measures have become necessary to maintain order and prevent illegal crossings. Patrols have been expanded, checkpoints reinforced, and surveillance increased—placing a strain on the national budget."
 imp_refugees_dynamic_modifier: "Refugee Welfare Costs"
 imp_refugees_dynamic_modifier_desc: "The government has allocated additional funding to support the welfare of incoming refugee populations. These costs include providing essential services such as housing, food assistance, healthcare, and education to displaced individuals and families. While these expenditures place added pressure on national budgets, they are vital for ensuring humane living conditions and fostering stability during a time of crisis."
 imp_refugee_event.1.t: "Refugees Massing At Borders"
 imp_refugee_event.1.d: "Thousands of refugees, fleeing violence and destruction, are massing along our borders. Refugee camps have sprung up near border-crossings, and many of the displaced are living in horrific conditions with limited access to food, water, and medical aid. The border patrol enforces the law strictly, preventing any entry into the country. Despite this, there is growing pressure both from local humanitarian groups and the international community to intervene, as public outcry over the refugees' suffering intensifies. As the refugee camps become more crowded, the situation becomes more difficult to manage, with reports of violence and desperation increasing among the refugees."
 imp_refugee_event.1.o1: "The borders will remain closed"
 imp_refugee_event.1.o2: "We must help these people"
 imp_refugee_event.2.t: "Monthly Refugee Report"
 imp_refugee_event.2.d: "The UNHCR reports the following:\n[imp_refugees_0]\n[imp_refugees_1]\n[imp_refugees_2]\n[imp_refugees_3]\n[imp_refugees_4]\n[imp_refugees_5]\n[imp_refugees_6]\n[imp_refugees_7]\n[imp_refugees_8]\n[imp_refugees_9]\n[imp_refugees_10]"
 imp_refugee_event.2.o1: "The human toll"
 d_refugees_on: "Enable Monthly Refugee Report"
 d_refugees_off: "Disable Monthly Refugee Report"
 imp_refugee_event.3.t: "Massive Refugee Influx"
 imp_refugee_event.3.d: "War, famine, and political upheaval in nearby regions have led to an unprecedented wave of refugees seeking safety within our borders. Thousands of displaced individuals are arriving daily, overwhelming border infrastructure and straining local communities. Temporary shelters are filling up, and resources are running thin. This sudden influx has caused debate across the nation: should we extend our hand to those in need or focus on safeguarding our own stability?"
 imp_refugee_event.3.o1: "We must help these people"
 imp_refugee_event.3.o2: "Close the borders"
 imp_refugee_event.4.t: "[From.GetNameWithFlag] closes borders!"
 imp_refugee_event.4.d: "[From.GetNameDef] has announced the complete closure of its borders to refugees, citing concerns over national security, economic stability, and resource strain. This decision has caused fierce international backlash from humanitarian organizations condemning the lack of compassion during an escalating crisis. The closure has left countless displaced individuals stranded in dire conditions, and tensions are rising in border regions as neighboring countries struggle to absorb the overflow. The effects are not limited to the region as international destinations are seeing a surge in refugee applications and arrivals, prompting both humanitarian appeals and political backlash in various nations. The global community is left to manage the fallout of [From.GetName]'s decision."
 imp_refugee_event.4.o1: "Outrageous"
 imp_refugee_event.4.o2: "Understandable"
