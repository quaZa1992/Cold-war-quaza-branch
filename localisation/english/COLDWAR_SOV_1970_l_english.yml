 COLDWAR_SOV_pb_lag_tt:0 "Every January the republic with the worst overall standing - not Moscow's favourite, not one already disqualified - is §RLagging Behind§! for a year: stability §R-3%§!, political power gain §R-5%§!, and an investigation is §R10%§! more likely to find something."
