 COLDWAR_SOV_shortcut_outlook_we:0 "Western Outlook and Parties"
 COLDWAR_SOV_shortcut_outlook_na:0 "Non-Aligned Outlook and Parties"
 COLDWAR_SOV_shortcut_outlook_nt:0 "Nationalist Outlook and Parties"
 COLDWAR_SOV_shortcut_economy:0 "Gosplan and the Economy"
 COLDWAR_SOV_shortcut_military:0 "The Soviet Armed Forces"
 COLDWAR_SOV_shortcut_state:0 "State and Union"
 COLDWAR_SOV_shortcut_foreign:0 "Foreign Policy"
 COLDWAR_SOV_shortcut_union_plan:0 "The Union Plan (joint)"
 COLDWAR_SOV_the_collective_leadership:0 "The Collective Leadership"
 COLDWAR_SOV_the_collective_leadership_desc:0 "January 1970. Six years after the fall of Khrushchev, the Soviet Union is governed by a troika: Leonid Brezhnev as General Secretary, Alexei Kosygin at the head of the Council of Ministers and Nikolai Podgorny as head of state. Behind the facade of unity, the Politburo balances reformers against the orthodox, Moscow against the republics and the planners against the generals. Whoever holds this balance holds the Union."
 COLDWAR_SOV_mod_political_power_factor_tt:0 "Political Power Gain: $RIGHT|+=%1$"
 COLDWAR_SOV_the_lenin_centenary:0 "The Lenin Centenary"
 COLDWAR_SOV_the_lenin_centenary_desc:0 "On 22 April 1970 the Soviet Union marks one hundred years since the birth of Vladimir Ilyich Lenin. Jubilee medals, mass rallies, new monuments and an endless stream of 'Leniniana' on television and in print turn the anniversary into the greatest propaganda campaign of the decade. The Party presents itself as the rightful heir of the revolution, and every citizen is reminded to whom the future is owed."
 COLDWAR_SOV_kremlin_politics:0 "Kremlin Politics"
 COLDWAR_SOV_kremlin_politics_desc:0 "Power in the Soviet Union does not flow from elections but from the quiet arithmetic of the Politburo. Every appointment, every retirement and every new regional first secretary shifts the balance between reformers and the orthodox guardians of the system. To rule from the Kremlin, the General Secretary must learn to count votes, reward loyalty and isolate rivals before they can do the same to him."
 COLDWAR_SOV_mod_production_factory_max_efficiency_factor_tt:0 "Maximum Production Efficiency: $RIGHT|+=%1$"
 COLDWAR_SOV_mod_trade_opinion_factor_tt:0 "Trade Opinion: $RIGHT|+=%1$"
 COLDWAR_SOV_the_24th_party_congress:0 "The XXIV Party Congress"
 COLDWAR_SOV_the_24th_party_congress_desc:0 "From 30 March to 9 April 1971 almost five thousand delegates gather in the Kremlin Palace of Congresses for the XXIV Congress of the CPSU. Brezhnev unveils a Peace Programme for relations with the West and the guidelines of the Ninth Five-Year Plan, promising both security and a better life for Soviet citizens. The congress sets the course of the collective leadership for the years to come."
 COLDWAR_SOV_mod_stability_factor_tt:0 "Stability: $RIGHT|+=%1$"
 COLDWAR_SOV_mod_drift_defence_factor_tt:0 "Ideology Drift Defence: $RIGHT|+=%1$"
 COLDWAR_SOV_the_doctrine_of_developed_socialism:0 "The Doctrine of Developed Socialism"
 COLDWAR_SOV_the_doctrine_of_developed_socialism_desc:0 "Communism has not yet arrived, but the Party now declares that the Soviet Union has entered the stage of 'developed socialism', a long historical era in which the system perfects itself step by step. The doctrine replaces Khrushchev's bold promise of communism by 1980 with a reassuring message of stability and gradual progress. It gives ideologists such as Mikhail Suslov a firm framework and tells every citizen that the foundations are sound."
 COLDWAR_SOV_the_gerontocracy_question:0 "The Gerontocracy Question"
 COLDWAR_SOV_the_gerontocracy_question_desc:0 "The men who rose under Stalin still sit at the summit of the Party. By the middle of the decade the average age of the Politburo exceeds sixty-five, and many regional secretaries have held their posts for twenty years or more. Stability of cadres has bought the leadership loyalty and calm, but it also blocks the path of younger, more capable officials. The Party must decide whether to renew its ranks or honour its veterans."
 COLDWAR_SOV_resolution_tt:0 "§YPolitburo resolution:§! the Politburo votes on this decision 10 days from now. A majority gives a §Gmandate§! (+25 political power, +2% stability); without one, Moscow carries §RDefying the Politburo§! and Union cohesion falls by 2."
 COLDWAR_SOV_mod_productivity_growth_modifier_tt:0 "Productivity Growth: $RIGHT|+=%1$"
 COLDWAR_SOV_mod_research_speed_factor_tt:0 "Research Speed: $RIGHT|+=%1$"
 COLDWAR_SOV_renew_the_cadres:0 "Renew the Cadres"
 COLDWAR_SOV_renew_the_cadres_desc:0 "The generation of 1964 cannot govern forever. By sending veteran ministers and obkom secretaries into honourable retirement and promoting younger engineers, economists and administrators, the leadership can breathe new energy into the state. The old guard will not leave quietly, and the shake-up will cause friction throughout the Party apparatus, but a renewed cadre corps may be exactly what the Union needs to face the decades ahead."
 COLDWAR_SOV_respect_for_seniority:0 "Respect for Seniority"
 COLDWAR_SOV_respect_for_seniority_desc:0 "The Party rewards those who have served it longest. Ministers, marshals and first secretaries keep their posts until they die in office, and the nomenklatura enjoys a security unknown since the revolution. The result is calm and predictable government, but also an era that later generations will call the zastoi, the Stagnation, as growth slows, corruption spreads and new ideas wait in vain for a hearing."
 COLDWAR_SOV_the_1977_constitution:0 "The 1977 Constitution"
 COLDWAR_SOV_the_1977_constitution_desc:0 "Long in preparation, a new Fundamental Law is to replace the Stalin Constitution of 1936. Its sixth article enshrines the Communist Party as the leading and guiding force of Soviet society, while the text proclaims the Soviet people a new historical community of many nations. The Brezhnev Constitution codifies developed socialism, broadens the formal rights of citizens and binds the republics ever more closely to the centre in Moscow."
 COLDWAR_SOV_whither_the_union:0 "Whither the Union?"
 COLDWAR_SOV_whither_the_union_desc:0 "Where is the Soviet Union heading? Behind closed doors, Party theorists, scientists, economists and patriots offer competing answers: a reaffirmation of the Party's leading role, a cautious opening towards the West, a socialist path independent of both blocs, or a revival rooted in Russian tradition. The leadership must decide which current of thought it will allow to shape the next generation of Soviet politics."
 COLDWAR_SOV_tt_no_direction_communism:0 "No direction has been chosen yet under the Emerging government"
 COLDWAR_SOV_dir_the_leading_role:0 "The Leading Role of the Party"
 COLDWAR_SOV_dir_the_leading_role_desc:0 "The answer to every question is the Party. Ideological commissions, the Komsomol and the primary Party organisations in every factory and collective farm are ordered to strengthen discipline and political education. Deviations are to be corrected, doubts dispelled and the masses mobilised behind the line of the Central Committee. The Union will march forward as Lenin intended, guided by the vanguard of the working class."
 COLDWAR_SOV_tt_no_direction_democratic:0 "No direction has been chosen yet under the Western government"
 COLDWAR_SOV_dir_convergence:0 "The Convergence Memorandum"
 COLDWAR_SOV_dir_convergence_desc:0 "Since 1968 the physicist Andrei Sakharov has circulated his essay 'Reflections on Progress, Peaceful Coexistence and Intellectual Freedom', arguing that capitalism and socialism must converge to save mankind. Instead of silencing the father of the Soviet hydrogen bomb, the leadership now permits an official debate on his ideas. Scientists and intellectuals sense a new thaw, while the guardians of orthodoxy see the first crack in the dam."
 COLDWAR_SOV_tt_no_direction_neutrality:0 "No direction has been chosen yet under the Non-Aligned government"
 COLDWAR_SOV_dir_third_way:0 "A Third Way for Socialism"
 COLDWAR_SOV_dir_third_way_desc:0 "Neither the rigid orthodoxy of the apparatus nor the consumer capitalism of the West offers a convincing future. Inspired by Yugoslav self-management, the Prague reformers and the anti-colonial movements of the Third World, a circle of Soviet theorists proposes a socialism of its own: decentralised, pragmatic and open to the non-aligned world. The debate is risky, but it promises fresh answers to old problems."
 COLDWAR_SOV_tt_no_direction_nationalist:0 "No direction has been chosen yet under the Nationalist government"
 COLDWAR_SOV_mod_conscription_factor_tt:0 "Recruitable Population Factor: $RIGHT|+=%1$"
 COLDWAR_SOV_dir_the_russian_idea:0 "The Russian Idea"
 COLDWAR_SOV_dir_the_russian_idea_desc:0 "Writers of the village prose movement, the journal Molodaya Gvardiya and patriotic circles within the Party call for a return to Russian roots: the land, the old churches and the memory of the Great Patriotic War. Elevating the Russian people as the backbone of the Union can rally soldiers and patriots behind the state. For Ukrainians, Balts and Central Asians, however, a Russian revival sounds dangerously like Russification."
 COLDWAR_SOV_em_the_party_of_a_new_type:0 "The Party of a New Type"
 COLDWAR_SOV_em_the_party_of_a_new_type_desc:0 "Lenin conceived the Bolsheviks as a party of a new type: disciplined, centralised and guided by revolutionary theory. Restoring this spirit means weeding out careerists, raising ideological standards and demanding exemplary conduct from every member. The Communist Party of the Soviet Union would once again lead by example rather than by inertia, and its authority among the people would grow accordingly."
 COLDWAR_SOV_mod_production_speed_infrastructure_factor_tt:0 "Infrastructure Construction Speed: $RIGHT|+=%1$"
 COLDWAR_SOV_em_komsomol_mobilisation:0 "Komsomol Mobilisation"
 COLDWAR_SOV_em_komsomol_mobilisation_desc:0 "The Komsomol counts tens of millions of young members, many of whom have never felt the enthusiasm of the founding years. Shock construction projects in Siberia, student work brigades and military-patriotic education can mobilise this energy for the building of communism. A generation that lays track across the taiga will also stand ready to defend the motherland."
 COLDWAR_SOV_mod_production_factory_efficiency_gain_factor_tt:0 "Production Efficiency Growth: $RIGHT|+=%1$"
 COLDWAR_SOV_em_the_workers_state:0 "The Workers' State"
 COLDWAR_SOV_em_the_workers_state_desc:0 "The Soviet Union calls itself the state of workers and peasants, yet the people on the factory floor often feel far removed from the decisions made in their name. Giving the trade unions a stronger voice, improving working conditions and honouring labour in culture and propaganda can renew the bond between the party and the working class. The ideals of October must be visible in every workshop."
 COLDWAR_SOV_tt_party_pop_4_20:0 "Popularity of §YCommunist Party of the Soviet Union§! at least §Y20%§!"
 COLDWAR_SOV_restore_party_rule_tt:0 "The §YCommunist Party of the Soviet Union§! returns to power under the General Secretary of the historical line."
 COLDWAR_SOV_power_the_cpsu:0 "Restore the Party of Lenin"
 COLDWAR_SOV_power_the_cpsu_desc:0 "Whatever factions may have risen in recent years, the Communist Party of the Soviet Union claims to be the only true heir of Lenin. Placing power firmly back in the hands of the CPSU under Leonid Brezhnev would restore the familiar order of the Politburo, the Central Committee and the regional committees. The transition will unsettle the ministries for a time, but it promises continuity and a return to the Leninist norms of party life."
 COLDWAR_SOV_tt_party_pop_5_20:0 "Popularity of §YFree Councils of Labour§! at least §Y20%§!"
 COLDWAR_SOV_tt_bop_le_m0p2:0 "§YPolitburo balance§! at most §Y-0.20§! (-1 reformers, +1 orthodox)"
 COLDWAR_SOV_tt_fac_labour_unions_ge_70:0 "Opinion of the Trade Unions at least §Y70§!"
 COLDWAR_SOV_new_leader_pyotr_siuda_tt:0 "§YPyotr Siuda§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_councils:0 "All Power to the Councils"
 COLDWAR_SOV_power_councils_desc:0 "What if the old slogan of 1917 were taken literally? The Free Councils of Labour, led by Pyotr Siuda, a veteran of the Novocherkassk strike of 1962, demand that power pass from the party apparatus to elected councils of workers in every factory and town. The experiment would dismantle the nomenklatura and could unleash enormous energy, or plunge the economy into chaos."
 COLDWAR_SOV_tt_party_pop_6_20:0 "Popularity of §YNeo-Stalinist Platform§! at least §Y20%§!"
 COLDWAR_SOV_tt_bop_ge_0p4:0 "§YPolitburo balance§! at least §Y+0.40§! (-1 reformers, +1 orthodox)"
 COLDWAR_SOV_new_leader_sergei_trapeznikov_tt:0 "§YSergei Trapeznikov§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_iron_line:0 "The Iron Line Takes Power"
 COLDWAR_SOV_power_iron_line_desc:0 "For the Neo-Stalinist Platform, the troubles of the Soviet Union stem from the abandonment of Stalin's firm hand. Led by Sergei Trapeznikov, the Central Committee's conservative chief of science and education, the Iron Line promises discipline, ideological vigilance and an end to the half-hearted experiments of recent years. Handing them power would reassure the hardliners in the army and the security organs, but it would chill the intelligentsia and alarm the West."
 COLDWAR_SOV_tt_party_pop_7_20:0 "Popularity of §YKomsomol Vanguard§! at least §Y20%§!"
 COLDWAR_SOV_tt_bop_ge_0p3:0 "§YPolitburo balance§! at least §Y+0.30§! (-1 reformers, +1 orthodox)"
 COLDWAR_SOV_tt_fac_intelligence_community_ge_60:0 "Opinion of the KGB (Intelligence Community) at least §Y60§!"
 COLDWAR_SOV_new_leader_alexander_shelepin_tt:0 "§YAlexander Shelepin§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_komsomol:0 "The Komsomol Vanguard Takes Power"
 COLDWAR_SOV_power_komsomol_desc:0 "Alexander Shelepin, former head of the Komsomol and the KGB, has never abandoned his ambition to lead the Soviet Union. His Komsomol Vanguard gathers a younger generation of officials who promise energy, order and a decisive break with the ageing men of the Politburo. Handing them power would be a generational revolution from above, carried out by men known for their authoritarian instincts."
 COLDWAR_SOV_em_the_leading_role_of_the_party:0 "The Leading Role of the Party"
 COLDWAR_SOV_em_the_leading_role_of_the_party_desc:0 "Whatever the course of recent events, the Communist Party remains the leading and guiding force of Soviet society, the nucleus of its political system and of all state and public organisations. Reaffirming this principle, which a new constitution will enshrine in its sixth article, gives the party apparatus a clear mandate to direct the state. It is the foundation on which every further reform or consolidation must rest."
 COLDWAR_SOV_em_socialist_emulation:0 "Socialist Emulation"
 COLDWAR_SOV_em_socialist_emulation_desc:0 "Socialist emulation pits brigades, workshops and factories against one another in comradely competition to exceed the plan. Red banners, honour boards and the title of Hero of Socialist Labour reward the best, while laggards are criticised in the factory newspaper. Freeing the movement from formalism and empty pledges can raise efficiency and morale without abandoning the principles of planning."
 COLDWAR_SOV_mod_corruption_cost_factor_tt:0 "Political Power Cost to change Corruption Laws: $RIGHT|-=%1$"
 COLDWAR_SOV_mod_bureaucracy_cost_multiplier_modifier_tt:0 "Bureaucracy Costs: $RIGHT|-=%1$"
 COLDWAR_SOV_em_peoples_control:0 "People's Control"
 COLDWAR_SOV_em_peoples_control_desc:0 "The Committee of People's Control, with millions of volunteer inspectors in every factory, office and collective farm, is meant to be the eyes of the working people over the bureaucracy. Giving it real powers to investigate embezzlement, waste and abuse of office would strike at the corruption spreading through the apparatus. The nomenklatura will resent the scrutiny, but honest citizens will welcome it."
 COLDWAR_SOV_mod_mdcw_cw_support_effectiveness_tt:0 "Support Campaign Effectiveness (Cold War): $RIGHT|+=%1$"
 COLDWAR_SOV_mod_opinion_gain_monthly_same_ideology_factor_tt:0 "Opinion Gain (Same Ideology): $RIGHT|+=%1$"
 COLDWAR_SOV_em_peace_and_socialism:0 "Peace and Socialism"
 COLDWAR_SOV_em_peace_and_socialism_desc:0 "From its editorial offices in Prague, the journal Problems of Peace and Socialism brings together communist and workers' parties from around the world. Turning it into a genuine platform for the international movement would carry the Soviet vision of socialism far beyond the bloc and strengthen ties with fraternal parties in the West and the Third World. A shared voice is the first step towards a shared strategy."
 COLDWAR_SOV_we_the_samizdat_presses:0 "Tolerate the Samizdat Presses"
 COLDWAR_SOV_we_the_samizdat_presses_desc:0 "Typed on carbon paper and passed from hand to hand, samizdat carries forbidden novels, poetry and the Chronicle of Current Events across the Soviet Union. Instead of hunting down every typewriter, the authorities could simply look the other way. Tolerating the underground presses would win the trust of the intelligentsia and open a channel for honest criticism, though the ideological guardians warn that it is the first crack in the dam."
 COLDWAR_SOV_we_stop_the_jamming:0 "Stop the Jamming"
 COLDWAR_SOV_we_stop_the_jamming_desc:0 "Every night a vast network of transmitters jams the Russian-language broadcasts of the Voice of America, the BBC and other Western stations. In September 1973, as a gesture of detente, the jamming of several of them was suspended. Ending it for good would save enormous sums, please Western governments and let Soviet citizens hear the world, but it would also break the party's monopoly on information."
 COLDWAR_SOV_we_recognise_the_human_rights_committee:0 "Recognise the Human Rights Committee"
 COLDWAR_SOV_we_recognise_the_human_rights_committee_desc:0 "In November 1970 Andrei Sakharov, Valery Chalidze and Andrei Tverdokhlebov founded the Human Rights Committee to study how Soviet law could protect the rights of citizens. The KGB regards them as enemies, but recognising the committee as a legitimate voice would demonstrate that Soviet socialism respects its own constitution. Such a step would earn praise abroad and enrage the security organs at home."
 COLDWAR_SOV_tt_party_pop_0_20:0 "Popularity of §YSystems Directorate§! at least §Y20%§!"
 COLDWAR_SOV_tt_bop_le_m0p4:0 "§YPolitburo balance§! at most §Y-0.40§! (-1 reformers, +1 orthodox)"
 COLDWAR_SOV_new_leader_dzhermen_gvishiani_tt:0 "§YDzhermen Gvishiani§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_systems_men:0 "The Systems Men Take Charge"
 COLDWAR_SOV_power_systems_men_desc:0 "Dzhermen Gvishiani, deputy chairman of the State Committee for Science and Technology and son-in-law of Alexei Kosygin, champions management science, systems analysis and computerised planning. His Systems Directorate envisions a Soviet Union governed by experts and data rather than by party dogma. Handing them power would mean leaving the party state behind entirely, a revolution of technocrats that could modernise the country or tear it apart."
 COLDWAR_SOV_tt_party_pop_1_20:0 "Popularity of §YPeople's Labour Union (NTS)§! at least §Y20%§!"
 COLDWAR_SOV_new_leader_vladimir_poremsky_tt:0 "§YVladimir Poremsky§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_solidarists:0 "The Solidarists Return"
 COLDWAR_SOV_power_solidarists_desc:0 "For decades the People's Labour Union, known as the NTS, has waged a propaganda war against the Soviet regime from exile, smuggling its journals Posev and Grani into the country. Under Vladimir Poremsky it offers a vision of a national, Christian and solidarist Russia freed from communism. Bringing the émigrés home to power would be an unprecedented break with more than half a century of Soviet history."
 COLDWAR_SOV_tt_party_pop_2_20:0 "Popularity of §YCommittee for Human Rights§! at least §Y20%§!"
 COLDWAR_SOV_new_leader_andrei_sakharov_tt:0 "§YAndrei Sakharov§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_human_rights:0 "Power to the Human Rights Committee"
 COLDWAR_SOV_power_human_rights_desc:0 "The physicist Andrei Sakharov, father of the Soviet hydrogen bomb and now the country's most famous dissident, would lead a government founded on law, human rights and convergence with the West. The Committee for Human Rights promises to free political prisoners, end censorship and guarantee the freedom to emigrate. Such a transfer of power would astonish the world, though the security organs and much of the apparatus would never accept it willingly."
 COLDWAR_SOV_tt_party_pop_3_20:0 "Popularity of §YUnion of Democratic Socialists§! at least §Y20%§!"
 COLDWAR_SOV_new_leader_roy_medvedev_tt:0 "§YRoy Medvedev§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_democratic_socialists:0 "Power to the Democratic Socialists"
 COLDWAR_SOV_power_democratic_socialists_desc:0 "The historian Roy Medvedev, author of a damning study of Stalinism, argues that the Soviet Union can be democratised without abandoning socialism. His Union of Democratic Socialists calls for free debate, competing candidates and an independent judiciary while preserving public ownership. Handing them power would turn the country into a socialist democracy, an experiment that Prague was never allowed to complete."
 COLDWAR_SOV_we_a_democratic_union:0 "A Democratic Union"
 COLDWAR_SOV_we_a_democratic_union_desc:0 "With the monopoly of the party broken, the Soviet Union must rebuild itself as a democratic state. Freedom of speech and assembly, independent courts and genuine parliamentary institutions are to replace the old structures of control. The transition promises a flowering of science and public life, but it also releases grievances that decades of repression had kept hidden."
 COLDWAR_SOV_we_free_elections:0 "Free Elections"
 COLDWAR_SOV_we_free_elections_desc:0 "For the first time since the Constituent Assembly was dispersed in January 1918, the peoples of the Soviet Union are to choose their representatives freely among competing parties. Regular elections will give the new government genuine legitimacy and open the way for the human rights movement to win popular support. They will also give a voice to nationalists in the republics, who may use it to demand independence."
 COLDWAR_SOV_mod_consumer_goods_factor_tt:0 "Tax Cost Factor (Consumer Goods): $RIGHT|-=%1$"
 COLDWAR_SOV_mod_corporate_tax_income_multiplier_modifier_tt:0 "Corporate Tax Income: $RIGHT|+=%1$"
 COLDWAR_SOV_we_the_market_returns:0 "The Market Returns"
 COLDWAR_SOV_we_the_market_returns_desc:0 "Central planning has failed to deliver the goods that Soviet citizens want. Private enterprise, free prices and foreign investment are to return after more than half a century of state monopoly, creating a mixed economy in which the state retains only the commanding heights. The reform promises growth and abundance, but in the short term it means rising prices, unemployment and widening inequality."
 COLDWAR_SOV_cw_partners_keep_bloc_tt:0 "Countries under our protection that are led by players keep their own Cold War bloc; computer-led ones follow us."
 COLDWAR_SOV_we_join_the_free_world:0 "Join the Free World"
 COLDWAR_SOV_we_join_the_free_world_desc:0 "The Soviet Union, once the leader of the socialist camp, is ready to change sides. Aligning with the United States and Western Europe would end the Cold War on terms no one in 1970 could have imagined, opening access to Western markets, credits and technology. For millions of veterans and party members it would be a bitter betrayal; for the new democrats it is the only path to a normal future."
 COLDWAR_SOV_na_the_yugoslav_model:0 "The Yugoslav Model"
 COLDWAR_SOV_na_the_yugoslav_model_desc:0 "Josip Broz Tito's Yugoslavia has shown that socialism need not mean Soviet-style central planning. Workers' self-management, decentralised enterprises and a foreign policy independent of both blocs have brought Belgrade prosperity and international prestige. Studying the Yugoslav model, long condemned in Moscow as revisionism, would offer Soviet reformers an alternative that remains socialist without being Stalinist."
 COLDWAR_SOV_na_the_technocrats:0 "The Technocrats"
 COLDWAR_SOV_na_the_technocrats_desc:0 "Economists, engineers and planners in the research institutes of Moscow and Novosibirsk believe that the Soviet economy can be fixed by expertise rather than ideology. They call for mathematical planning methods, profit incentives and the enterprise autonomy promised by the Kosygin reform of 1965. Giving them a voice would move the country towards a pragmatic course between the dogmas of the party and the models of the West."
 COLDWAR_SOV_na_the_village_prose:0 "The Village Prose"
 COLDWAR_SOV_na_the_village_prose_desc:0 "Writers such as Valentin Rasputin, Vasily Belov and Vasily Shukshin mourn the dying Russian village, its traditions, its churches and its moral world, destroyed by collectivisation and industrial progress. Their village prose has become a quiet conservative counterculture, tolerated by the censors yet deeply critical of Soviet modernity. Encouraging this current would strengthen a rooted, national alternative to both communist and Western ideologies."
 COLDWAR_SOV_na_the_third_force:0 "The Third Force"
 COLDWAR_SOV_na_the_third_force_desc:0 "Between the party loyalists and the Western-minded dissidents stands a third force: technocrats, conservatives and environmentalists who want reform without capitulation. Allowing them to organise and to influence policy would broaden the political spectrum and create allies for change within the system. The Politburo's conservatives see a dangerous dilution of the party line, but the reformers see a way out of stagnation."
 COLDWAR_SOV_tt_party_pop_13_20:0 "Popularity of §YGosplan Technocracy§! at least §Y20%§!"
 COLDWAR_SOV_tt_bop_ge_m0p4:0 "§YPolitburo balance§! at least §Y-0.40§! (-1 reformers, +1 orthodox)"
 COLDWAR_SOV_tt_bop_le_0p4:0 "§YPolitburo balance§! at most §Y+0.40§! (-1 reformers, +1 orthodox)"
 COLDWAR_SOV_new_leader_nikolai_baibakov_tt:0 "§YNikolai Baibakov§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_planners:0 "The Planners' Government"
 COLDWAR_SOV_power_planners_desc:0 "Nikolai Baibakov has chaired the State Planning Committee since 1965 and knows the Soviet economy better than anyone. His Gosplan Technocracy would govern not through ideology or party congresses but through balances, targets and indicators. Handing power to the planners would put the economy before politics, creating an administrative state run by the men who actually manage the country's resources."
 COLDWAR_SOV_tt_party_pop_14_20:0 "Popularity of §YLive Not by Lies§! at least §Y20%§!"
 COLDWAR_SOV_new_leader_aleksandr_solzhenitsyn_tt:0 "§YAleksandr Solzhenitsyn§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_solzhenitsyn:0 "Live Not by Lies in Power"
 COLDWAR_SOV_power_solzhenitsyn_desc:0 "Aleksandr Solzhenitsyn, Nobel laureate and chronicler of the Gulag, calls on his countrymen to live not by lies. His followers envision a Russia freed from communist ideology and rooted in Orthodox faith, rural values and the traditions of local self-government. Handing them power would be a moral revolution, but Solzhenitsyn's authoritarian streak and Russian nationalism trouble the non-Russian republics and the Westernisers alike."
 COLDWAR_SOV_tt_party_pop_15_20:0 "Popularity of §YThe Red Directors§! at least §Y20%§!"
 COLDWAR_SOV_new_leader_nikolai_shchelokov_tt:0 "§YNikolai Shchelokov§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_directors:0 "The Directors Take Over"
 COLDWAR_SOV_power_directors_desc:0 "The directors of the great factories, combines and ministries are the true masters of the Soviet economy, and they are tired of taking orders from party secretaries. With the backing of Interior Minister Nikolai Shchelokov, the Red Directors propose a government of managers in which the heads of industry hold power directly. Their rule might be efficient, and profitable for many of them, but it risks turning public property into private fiefdoms."
 COLDWAR_SOV_tt_party_pop_16_20:0 "Popularity of §YFree Enterprise League§! at least §Y20%§!"
 COLDWAR_SOV_tt_bop_le_m0p5:0 "§YPolitburo balance§! at most §Y-0.50§! (-1 reformers, +1 orthodox)"
 COLDWAR_SOV_new_leader_nikolai_shmelyov_tt:0 "§YNikolai Shmelyov§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_free_enterprise:0 "The Free Enterprise Cabinet"
 COLDWAR_SOV_power_free_enterprise_desc:0 "The economist Nikolai Shmelyov argues that the Soviet economy can be saved only by markets, private initiative and honest prices. His Free Enterprise League proposes dismantling the planning apparatus, legalising private business and opening the country to foreign investment. Handing them power would be a leap into the unknown, offering prosperity to the enterprising and hardship to those who have known nothing but the security of the state."
 COLDWAR_SOV_tt_party_pop_17_20:0 "Popularity of §YFriends of Baikal§! at least §Y20%§!"
 COLDWAR_SOV_tt_flag_aral_disaster:0 "The Aral Sea is dying"
 COLDWAR_SOV_tt_flag_rbmk:0 "The RBMK reactors are being built"
 COLDWAR_SOV_new_leader_grigory_galazy_tt:0 "§YGrigory Galazy§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_greens:0 "The Green Cabinet"
 COLDWAR_SOV_power_greens_desc:0 "Since the 1960s scientists and writers have fought to save Lake Baikal from the effluent of a giant pulp mill on its shore. Grigory Galazy, director of the Limnological Institute in Irkutsk, now leads the Friends of Baikal, grown into a broader movement against the environmental devastation caused by Soviet industry. A green government would put nature before production targets, a radical departure for a country built on heavy industry."
 COLDWAR_SOV_tt_party_pop_18_20:0 "Popularity of §YSocialist Market Commonwealth§! at least §Y20%§!"
 COLDWAR_SOV_tt_bop_le_m0p3:0 "§YPolitburo balance§! at most §Y-0.30§! (-1 reformers, +1 orthodox)"
 COLDWAR_SOV_new_leader_alexander_yakovlev_tt:0 "§YAlexander Yakovlev§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_market_socialists:0 "The Market Socialists Take Power"
 COLDWAR_SOV_power_market_socialists_desc:0 "Alexander Yakovlev, a party ideologist who studied in the United States and warned against Russian chauvinism, has come to believe that socialism needs markets to survive. His Socialist Market Commonwealth proposes combining public ownership with competition, enterprise autonomy and openness to the world. Handing them power would launch a far-reaching reform from within, one that could renew Soviet socialism or unravel it entirely."
 COLDWAR_SOV_tt_party_pop_19_20:0 "Popularity of §YUnion of Sovereign Republics§! at least §Y20%§!"
 COLDWAR_SOV_tt_cohesion_lt_45:0 "§YUnion cohesion§! below §Y45§!"
 COLDWAR_SOV_new_leader_pyotr_shelest_tt:0 "§YPyotr Shelest§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_sovereign_republics:0 "A Union of Sovereign Republics"
 COLDWAR_SOV_power_sovereign_republics_desc:0 "Pyotr Shelest, the former first secretary of the Ukrainian party, has long defended the economic and cultural rights of the republics against Moscow's centralism. His Union of Sovereign Republics proposes to turn the Soviet Union into a genuine federation in which each republic controls its own affairs. Handing them power would satisfy national aspirations from Kiev to Tashkent, but it could also loosen the bonds that hold the Union together."
 COLDWAR_SOV_na_neither_moscow_nor_washington:0 "Neither Moscow nor Washington"
 COLDWAR_SOV_na_neither_moscow_nor_washington_desc:0 "The new Soviet leadership declares that the country will no longer head one bloc in a global confrontation. Neither the old Moscow of the Politburo nor Washington shall dictate the course of the world; instead the Soviet Union will pursue its own interests and keep an equal distance from all camps. It is a dramatic turn that leaves allies bewildered and opens entirely new possibilities for the country."
 COLDWAR_SOV_na_the_third_way_economy:0 "The Third Way Economy"
 COLDWAR_SOV_na_the_third_way_economy_desc:0 "Between Soviet central planning and Western capitalism lies a third way. Inspired by the Kosygin reform, Yugoslav self-management and the ideas of the Czechoslovak economist Ota Šik, the new economic policy combines planning for key sectors with enterprise autonomy, market prices and trade with the whole world. It is an untested experiment on a continental scale, but its advocates believe it can unleash the potential stifled by decades of rigid planning."
 COLDWAR_SOV_mod_army_personnel_cost_multiplier_modifier_tt:0 "Army Personnel Costs: $RIGHT|-=%1$"
 COLDWAR_SOV_na_dissolve_the_pact:0 "Dissolve the Warsaw Pact?"
 COLDWAR_SOV_na_dissolve_the_pact_desc:0 "If the Soviet Union no longer leads a bloc, what is the purpose of the Warsaw Pact? Dissolving the alliance would free Eastern Europe to choose its own partners and remove the main justification for NATO's presence on the continent. Each former member will decide its own future, and some will certainly turn west, but the step would mark the true end of the post-war order in Europe."
 COLDWAR_SOV_mod_foreign_influence_modifier_tt:0 "Foreign Influence: $RIGHT|+=%1$"
 COLDWAR_SOV_na_join_the_movement:0 "Join the Non-Aligned Movement"
 COLDWAR_SOV_na_join_the_movement_desc:0 "Founded in Belgrade in 1961 by Tito, Nehru, Nasser and Sukarno, the Non-Aligned Movement brings together states that refuse to join either bloc. Seeking membership would be an astonishing step for a superpower, but it would align the Soviet Union with India and the developing world as an equal rather than a patron. The members will be wary of Moscow's motives, yet its accession would transform the movement overnight."
 COLDWAR_SOV_nt_molodaya_gvardiya:0 "Molodaya Gvardiya"
 COLDWAR_SOV_nt_molodaya_gvardiya_desc:0 "Published by the Komsomol's own press, the journal Molodaya Gvardiya has become the mouthpiece of the so-called Russian Party: writers and editors who praise village life, Orthodox heritage and the greatness of the Russian nation. Opening its pages wider would give Russian nationalists a respectable platform inside the Soviet system, at the price of unsettling the other republics."
 COLDWAR_SOV_nt_the_victory_cult:0 "The Cult of Victory"
 COLDWAR_SOV_nt_the_victory_cult_desc:0 "Since 1965, Victory Day is once again a public holiday, and the memory of the Great Patriotic War has become the strongest shared faith of the Soviet people. From the Motherland Calls on Mamayev Kurgan to the eternal flames in every town, twenty million dead bind the nation together. Raising the victory above the revolution itself would make the sacrifice of the Russian people the true foundation of the state."
 COLDWAR_SOV_nt_vozrozhdenie:0 "Vozrozhdenie"
 COLDWAR_SOV_nt_vozrozhdenie_desc:0 "Beneath the official slogans, a quiet current runs through Soviet Russia: restored churches and monasteries, the village prose of Valentin Rasputin and Vasily Belov, the All-Russian Society for the Protection of Historical and Cultural Monuments. Its followers speak of a vozrozhdenie, a rebirth of the Russian nation after decades of uprooting. Embracing this revival would turn cultural nostalgia into a political programme."
 COLDWAR_SOV_tt_party_pop_20_20:0 "Popularity of §YThe Russian Party§! at least §Y20%§!"
 COLDWAR_SOV_tt_bop_ge_0p2:0 "§YPolitburo balance§! at least §Y+0.20§! (-1 reformers, +1 orthodox)"
 COLDWAR_SOV_new_leader_dmitry_polyansky_tt:0 "§YDmitry Polyansky§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_russian_party:0 "The Russian Party Takes Power"
 COLDWAR_SOV_power_russian_party_desc:0 "For years the Russian Party worked in the shadows of the Central Committee, in editorial offices and Komsomol cells. Now its patrons step forward openly, promising that Russia will no longer pay for the other nations of the union and will finally be master in its own house. The transfer of power will shake the apparatus, and the republics will watch with deep unease."
 COLDWAR_SOV_tt_party_pop_21_20:0 "Popularity of §YCommittee of National Rebirth§! at least §Y20%§!"
 COLDWAR_SOV_new_leader_committee_of_national_rebirth_tt:0 "§YCommittee of National Rebirth§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_national_rebirth:0 "The National Rebirth"
 COLDWAR_SOV_power_national_rebirth_desc:0 "In the darkest corner of the Russian Party, radicals dream of more than a reformed union: a Committee of National Rebirth that would sweep away the Marxist creed entirely and rebuild Russia as an ethnic, authoritarian state. What if a deep crisis of the system handed them their moment? Such a seizure of power would break with everything Soviet and could tear the union apart."
 COLDWAR_SOV_tt_party_pop_22_20:0 "Popularity of §YCouncil of Marshals§! at least §Y20%§!"
 COLDWAR_SOV_tt_fac_the_military_ge_75:0 "Opinion of the Army at least §Y75§!"
 COLDWAR_SOV_new_leader_andrei_grechko_tt:0 "§YAndrei Grechko§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_marshals:0 "The Marshals Step In"
 COLDWAR_SOV_power_marshals_desc:0 "The Soviet marshals have always stood just outside the circle of power, mindful of how Zhukov was cast aside in 1957. Should the Party falter and the country slide into disorder, the High Command could step in as guardian of the state, ruling through a council of marshals in the name of order and the great victory. The army's loyalty would then belong to the nation rather than to the Party."
 COLDWAR_SOV_tt_party_pop_23_20:0 "Popularity of §YHouse of Romanov§! at least §Y20%§!"
 COLDWAR_SOV_new_leader_grand_duke_vladimir_kirillovich_tt:0 "§YGrand Duke Vladimir Kirillovich§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_power_romanovs:0 "The Return of the Romanovs"
 COLDWAR_SOV_power_romanovs_desc:0 "Half a century after Yekaterinburg, the idea seems absurd: a Romanov back in the Kremlin. Yet in emigre circles in France and Spain, Grand Duke Vladimir Kirillovich still claims the throne, and among disillusioned Russian nationalists the old symbols are quietly regaining their pull. What if a collapsing order turned to the crown as the last remaining source of legitimacy?"
 COLDWAR_SOV_nt_russia_first:0 "Russia First"
 COLDWAR_SOV_nt_russia_first_desc:0 "Why should Russian workers pay for cotton in Uzbekistan and new factories in the Baltic while the villages of the Non-Black Earth region decay? The question is asked ever more openly in Moscow. Putting Russia first means redirecting investment, prestige and political attention to the Russian heartland, even if the other republics see it as a betrayal of the union's promise."
 COLDWAR_SOV_nt_the_rsfsr_institutions:0 "Institutions for the RSFSR"
 COLDWAR_SOV_nt_the_rsfsr_institutions_desc:0 "Every Soviet republic has its own Communist Party, its own Academy of Sciences and its own KGB, every one except Russia, whose affairs are run directly by the all-union centre. Russian nationalists have long called this a humiliation. Creating separate Russian institutions would give the largest republic a voice of its own, but also a power base that could one day rival the union itself."
 COLDWAR_SOV_mod_army_morale_factor_tt:0 "Division Recovery Rate: $RIGHT|+=%1$"
 COLDWAR_SOV_nt_the_army_of_the_nation:0 "The Army of the Nation"
 COLDWAR_SOV_nt_the_army_of_the_nation_desc:0 "Officially, the Soviet Army belongs to all Soviet peoples, but its officer corps is overwhelmingly Russian and its traditions reach back to Suvorov and Kutuzov. Nationalists want to make that heritage explicit: an army rooted in Russian history, Russian valour and Russian soil rather than in proletarian internationalism. Soldiers who fight for the motherland, they argue, fight harder than those who fight for an abstraction."
 COLDWAR_SOV_nt_the_imperial_question:0 "The Imperial Question"
 COLDWAR_SOV_nt_the_imperial_question_desc:0 "Every Russian nationalist must eventually answer the same question: is the Soviet Union Russia's empire, to be held at any cost, or a burden that drains the Russian nation? One camp would keep every republic by force if needed; the other would let the restless periphery go and build a tighter union around the Slavic core. The answer will define the country's borders for generations."
 COLDWAR_SOV_mod_communism_drift_tt:0 "Emerging Drift: $RIGHT|+=2$"
 COLDWAR_SOV_cpsu_the_party_of_lenin:0 "The Party of Lenin"
 COLDWAR_SOV_cpsu_the_party_of_lenin_desc:0 "Nearly fifteen million members strong, the Communist Party of the Soviet Union is the spine of the state, the guardian of Lenin's legacy and the source of every career that matters. As the country enters the 1970s, the leadership must decide how the Party presents itself: as a living revolutionary vanguard or as the steady administrator of a mature socialist society. Either way, its authority must remain beyond question."
 COLDWAR_SOV_cpsu_the_nomenklatura:0 "The Nomenklatura"
 COLDWAR_SOV_cpsu_the_nomenklatura_desc:0 "The nomenklatura lists decide who runs every factory, ministry, newspaper and regional committee in the Soviet Union. Those on them enjoy special shops, dachas and the certainty that their position is safe. Strengthening this system binds the cadres firmly to the Party, but it also breeds a privileged caste that grows ever more comfortable and ever less accountable."
 COLDWAR_SOV_mod_war_support_factor_tt:0 "War Support: $RIGHT|+=%1$"
 COLDWAR_SOV_cpsu_the_komsomol:0 "The Komsomol"
 COLDWAR_SOV_cpsu_the_komsomol_desc:0 "With nearly thirty million members, the Leninist Young Communist League is the Party's school and recruiting ground. Its brigades raise new towns in Siberia, its activists organise every university and factory, and its leaders are the next generation of the nomenklatura. A revitalised Komsomol could bind Soviet youth to the cause, if it can still inspire rather than merely organise."
 COLDWAR_SOV_cpsu_the_party_card_exchange:0 "The Party Card Exchange"
 COLDWAR_SOV_cpsu_the_party_card_exchange_desc:0 "The 24th Party Congress has decided that every Communist must receive a new party card, and in 1973 and 1974 each member has to appear in person to exchange the old one. Officially it is an administrative procedure; in practice it is a quiet purge, as the passive, the corrupt and the drunk can simply be left without a new card. Done seriously, the exchange could cleanse the ranks without the terror of earlier decades."
 COLDWAR_SOV_cpsu_democratic_centralism:0 "Democratic Centralism"
 COLDWAR_SOV_cpsu_democratic_centralism_desc:0 "Lenin's principle of democratic centralism holds that debate is free until a decision is made, and that afterwards every member must carry it out without dissent. In practice, the emphasis has long fallen on centralism. Reaffirming the doctrine closes the ranks behind the Politburo's line and shields the Party against factions and foreign ideas, though it leaves little room for initiative from below."
 COLDWAR_SOV_cpsu_the_constitution_of_developed_socialism:0 "Article Six"
 COLDWAR_SOV_cpsu_the_constitution_of_developed_socialism_desc:0 "A new Soviet constitution, long prepared by a commission under Brezhnev himself, could name the Party outright as 'the leading and guiding force of Soviet society, the nucleus of its political system'. The basic law would enshrine the era of developed socialism and the Party's monopoly in a single article. Written into law, the Party's role would no longer be a matter of practice but of constitutional principle."
 COLDWAR_SOV_cpsu_the_party_of_the_whole_people:0 "The Party of the Whole People"
 COLDWAR_SOV_cpsu_the_party_of_the_whole_people_desc:0 "Since Khrushchev's programme of 1961, the CPSU no longer calls itself merely the party of the working class but the party of the whole Soviet people. With the dictatorship of the proletariat declared complete, it claims to speak for workers, collective farmers and the intelligentsia alike, and for every nation of the union. Embracing this broad identity widens its base, at the cost of some revolutionary sharpness."
 COLDWAR_SOV_ple_the_politburo:0 "The Politburo"
 COLDWAR_SOV_ple_the_politburo_desc:0 "Real power in the Soviet Union lies with a dozen elderly men around a table in the Kremlin Senate. Since Khrushchev's fall in 1964, Leonid Brezhnev has ruled as first among equals, balancing Kosygin's government, Suslov's ideology and the ambitions of younger rivals. Every succession, every change of course and every career is decided here, behind closed doors and by a show of hands."
 COLDWAR_SOV_tt_not_gensec_kos:0 "§YAlexei Kosygin§! is not yet General Secretary"
 COLDWAR_SOV_tt_bop_le_m0p15:0 "§YPolitburo balance§! at most §Y-0.15§! (-1 reformers, +1 orthodox)"
 COLDWAR_SOV_tt_fac_industrial_conglomerates_ge_40:0 "Opinion of the Branch Ministries (Industrial Conglomerates) at least §Y40§!"
 COLDWAR_SOV_candidacy_kos_tt:0 "§YAlexei Kosygin§! becomes a candidate for General Secretary. The decision §YConvene the Plenum: Alexei Kosygin§! asks the Politburo to elect him (Moscow casts its §Y3§! votes for him, every republic with a seat in the Politburo has §Y1§! vote and AI republics vote in favour; only if all three republican members vote against does the Plenum reject him). If the Politburo agrees, he takes over; if it rejects him, nothing changes, stability falls by §R3%§! and the balance shifts against him. If Alexei Kosygin has died, §YNikolai Ryzhkov§! stands in his place and carries his course."
 COLDWAR_SOV_ple_kos:0 "The Premier's Plenum"
 COLDWAR_SOV_ple_kos_desc:0 "Alexei Kosygin has headed the Council of Ministers since 1964 and is respected at home and abroad as a capable manager. His economic reform of 1965, however, is being slowly strangled by the Party apparatus. What if the Premier's allies in the ministries and the Central Committee called a plenum to make him General Secretary, placing the government's pragmatism above the Party's ideology?"
 COLDWAR_SOV_tt_not_gensec_pod:0 "§YNikolai Podgorny§! is not yet General Secretary"
 COLDWAR_SOV_tt_cohesion_ge_50:0 "§YUnion cohesion§! at least §Y50§!"
 COLDWAR_SOV_candidacy_pod_tt:0 "§YNikolai Podgorny§! becomes a candidate for General Secretary. The decision §YConvene the Plenum: Nikolai Podgorny§! asks the Politburo to elect him (Moscow casts its §Y3§! votes for him, every republic with a seat in the Politburo has §Y1§! vote and AI republics vote in favour; only if all three republican members vote against does the Plenum reject him). If the Politburo agrees, he takes over; if it rejects him, nothing changes, stability falls by §R3%§! and the balance shifts against him. If Nikolai Podgorny has died, §YVasily Kuznetsov§! stands in his place and carries his course."
 COLDWAR_SOV_ple_pod:0 "The Presidium Takes the Lead"
 COLDWAR_SOV_ple_pod_desc:0 "As Chairman of the Presidium of the Supreme Soviet, Nikolai Podgorny is the formal head of the Soviet state and the third man of the collective leadership. A veteran of the Kharkov party organisation and former leader of the Ukrainian Communists, he commands loyalties in the largest non-Russian republic. What if a plenum turned to him, raising the organs of the state above the Party secretariat?"
 COLDWAR_SOV_tt_not_gensec_sus:0 "§YMikhail Suslov§! is not yet General Secretary"
 COLDWAR_SOV_tt_fac_communist_cadres_ge_60:0 "Opinion of the Nomenklatura (Communist Cadres) at least §Y60§!"
 COLDWAR_SOV_tt_bop_ge_0:0 "§YPolitburo balance§! at least §Y+0.00§! (-1 reformers, +1 orthodox)"
 COLDWAR_SOV_candidacy_sus_tt:0 "§YMikhail Suslov§! becomes a candidate for General Secretary. The decision §YConvene the Plenum: Mikhail Suslov§! asks the Politburo to elect him (Moscow casts its §Y3§! votes for him, every republic with a seat in the Politburo has §Y1§! vote and AI republics vote in favour; only if all three republican members vote against does the Plenum reject him). If the Politburo agrees, he takes over; if it rejects him, nothing changes, stability falls by §R3%§! and the balance shifts against him. If Mikhail Suslov has died, §YMikhail Zimyanin§! stands in his place and carries his course."
 COLDWAR_SOV_ple_sus:0 "The Grey Cardinal Steps Forward"
 COLDWAR_SOV_ple_sus_desc:0 "Mikhail Suslov, the Party's chief ideologist, has never sought the top post, preferring to guard doctrine from the shadows, which has earned him the name 'grey cardinal'. Ascetic, dogmatic and feared, he has made and broken careers for more than two decades. What if a plenum asked him to step forward and personally steer the Party back towards ideological purity?"
 COLDWAR_SOV_tt_not_gensec_she:0 "§YAlexander Shelepin§! is not yet General Secretary"
 COLDWAR_SOV_tt_fac_labour_unions_ge_55:0 "Opinion of the Trade Unions at least §Y55§!"
 COLDWAR_SOV_tt_fac_intelligence_community_ge_50:0 "Opinion of the KGB (Intelligence Community) at least §Y50§!"
 COLDWAR_SOV_tt_bop_ge_0p25:0 "§YPolitburo balance§! at least §Y+0.25§! (-1 reformers, +1 orthodox)"
 COLDWAR_SOV_candidacy_she_tt:0 "§YAlexander Shelepin§! becomes a candidate for General Secretary. The decision §YConvene the Plenum: Alexander Shelepin§! asks the Politburo to elect him (Moscow casts its §Y3§! votes for him, every republic with a seat in the Politburo has §Y1§! vote and AI republics vote in favour; only if all three republican members vote against does the Plenum reject him). If the Politburo agrees, he takes over; if it rejects him, nothing changes, stability falls by §R3%§! and the balance shifts against him."
 COLDWAR_SOV_ple_she:0 "Iron Shurik's Return"
 COLDWAR_SOV_ple_she_desc:0 "Alexander Shelepin, once head of the Komsomol and later of the KGB, helped topple Khrushchev in 1964 and was soon seen as Brezhnev's most dangerous rival. Since 1967 he has been sidelined to the trade unions, yet 'Iron Shurik' still has friends among the security men and the former Komsomol generation. What if a plenum brought him back to finish what he began, with an iron broom for the cadres?"
 COLDWAR_SOV_tt_not_gensec_and:0 "§YYuri Andropov§! is not yet General Secretary"
 COLDWAR_SOV_tt_fac_intelligence_community_ge_70:0 "Opinion of the KGB (Intelligence Community) at least §Y70§!"
 COLDWAR_SOV_candidacy_and_tt:0 "§YYuri Andropov§! becomes a candidate for General Secretary. The decision §YConvene the Plenum: Yuri Andropov§! asks the Politburo to elect him (Moscow casts its §Y3§! votes for him, every republic with a seat in the Politburo has §Y1§! vote and AI republics vote in favour; only if all three republican members vote against does the Plenum reject him). If the Politburo agrees, he takes over; if it rejects him, nothing changes, stability falls by §R3%§! and the balance shifts against him. If Yuri Andropov has died, §YHeydar Aliyev§! stands in his place and carries his course."
 COLDWAR_SOV_ple_and:0 "The Chekist Plenum"
 COLDWAR_SOV_ple_and_desc:0 "Yuri Andropov has run the KGB since 1967 and knows more about the Party's secrets, and its corruption, than anyone else in the leadership. Austere, intelligent and patient, he is the candidate of those who believe the country needs discipline and order before anything else. Historically he succeeded Brezhnev in November 1982, but a plenum could bring the Chekist to power much sooner."
 COLDWAR_SOV_tt_not_gensec_gre:0 "§YAndrei Grechko§! is not yet General Secretary"
 COLDWAR_SOV_tt_tension_ge_55:0 "§YCold War tension§! at least §Y55§!"
 COLDWAR_SOV_candidacy_gre_tt:0 "§YAndrei Grechko§! becomes a candidate for General Secretary. The decision §YConvene the Plenum: Andrei Grechko§! asks the Politburo to elect him (Moscow casts its §Y3§! votes for him, every republic with a seat in the Politburo has §Y1§! vote and AI republics vote in favour; only if all three republican members vote against does the Plenum reject him). If the Politburo agrees, he takes over; if it rejects him, nothing changes, stability falls by §R3%§! and the balance shifts against him. If Andrei Grechko has died, §YNikolai Ogarkov§! stands in his place and carries his course."
 COLDWAR_SOV_ple_gre:0 "The Marshal's Hour"
 COLDWAR_SOV_ple_gre_desc:0 "Marshal Andrei Grechko, Minister of Defence since 1967, speaks for an army that has made the Soviet Union a military superpower. Blunt and hawkish, he distrusts detente and the civilians who negotiate it. What if the Politburo, fearing weakness abroad and drift at home, handed the Party to a soldier for the first time, with the General Staff standing firmly behind him?"
 COLDWAR_SOV_tt_not_gensec_ust:0 "§YDmitry Ustinov§! is not yet General Secretary"
 COLDWAR_SOV_tt_fac_defense_industry_ge_80:0 "Opinion of the Defence Industry at least §Y80§!"
 COLDWAR_SOV_tt_fac_the_military_ge_60:0 "Opinion of the Army at least §Y60§!"
 COLDWAR_SOV_candidacy_ust_tt:0 "§YDmitry Ustinov§! becomes a candidate for General Secretary. The decision §YConvene the Plenum: Dmitry Ustinov§! asks the Politburo to elect him (Moscow casts its §Y3§! votes for him, every republic with a seat in the Politburo has §Y1§! vote and AI republics vote in favour; only if all three republican members vote against does the Plenum reject him). If the Politburo agrees, he takes over; if it rejects him, nothing changes, stability falls by §R3%§! and the balance shifts against him. If Dmitry Ustinov has died, §YLeonid Smirnov§! stands in his place and carries his course."
 COLDWAR_SOV_ple_ust:0 "The Armourer's Plenum"
 COLDWAR_SOV_ple_ust_desc:0 "Dmitry Ustinov became People's Commissar for Armaments in 1941, at just thirty-two, and has overseen the Soviet defence industry ever since, from tanks and artillery to missiles and space rockets. As Central Committee Secretary for defence, he is the patron of the military-industrial complex. What if a plenum chose the armourer himself, placing the needs of the defence plants at the centre of the state?"
 COLDWAR_SOV_tt_not_gensec_gro:0 "§YGrigory Romanov§! is not yet General Secretary"
 COLDWAR_SOV_tt_bop_ge_0p15:0 "§YPolitburo balance§! at least §Y+0.15§! (-1 reformers, +1 orthodox)"
 COLDWAR_SOV_tt_fac_industrial_conglomerates_ge_50:0 "Opinion of the Branch Ministries (Industrial Conglomerates) at least §Y50§!"
 COLDWAR_SOV_tt_fac_communist_cadres_ge_50:0 "Opinion of the Nomenklatura (Communist Cadres) at least §Y50§!"
 COLDWAR_SOV_candidacy_gro_tt:0 "§YGrigory Romanov§! becomes a candidate for General Secretary. The decision §YConvene the Plenum: Grigory Romanov§! asks the Politburo to elect him (Moscow casts its §Y3§! votes for him, every republic with a seat in the Politburo has §Y1§! vote and AI republics vote in favour; only if all three republican members vote against does the Plenum reject him). If the Politburo agrees, he takes over; if it rejects him, nothing changes, stability falls by §R3%§! and the balance shifts against him."
 COLDWAR_SOV_ple_gro:0 "The Leningrad Plenum"
 COLDWAR_SOV_ple_gro_desc:0 "Grigory Romanov, the rising master of the Leningrad party organisation, rules the second city of the Soviet Union with a firm hand and a close eye on the defence factories that fill it. Young by Politburo standards, orthodox and efficient, he is already spoken of as a future leader. What if a plenum skipped a generation and summoned the man from Smolny to the Kremlin?"
 COLDWAR_SOV_tt_not_gensec_che:0 "§YKonstantin Chernenko§! is not yet General Secretary"
 COLDWAR_SOV_tt_fac_communist_cadres_ge_70:0 "Opinion of the Nomenklatura (Communist Cadres) at least §Y70§!"
 COLDWAR_SOV_candidacy_che_tt:0 "§YKonstantin Chernenko§! becomes a candidate for General Secretary. The decision §YConvene the Plenum: Konstantin Chernenko§! asks the Politburo to elect him (Moscow casts its §Y3§! votes for him, every republic with a seat in the Politburo has §Y1§! vote and AI republics vote in favour; only if all three republican members vote against does the Plenum reject him). If the Politburo agrees, he takes over; if it rejects him, nothing changes, stability falls by §R3%§! and the balance shifts against him. If Konstantin Chernenko has died, §YViktor Grishin§! stands in his place and carries his course."
 COLDWAR_SOV_ple_che:0 "The Apparatchik's Plenum"
 COLDWAR_SOV_ple_che_desc:0 "Konstantin Chernenko has spent his career at Brezhnev's side, rising from propaganda work in Moldavia to head the Central Committee's General Department. He has no power base of his own beyond the apparatus, which is precisely why the old guard trusts him. Historically he succeeded Andropov in February 1984; a plenum could make the loyal apparatchik leader whenever the elders want continuity above all."
 COLDWAR_SOV_tt_not_gensec_gor:0 "§YMikhail Gorbachev§! is not yet General Secretary"
 COLDWAR_SOV_candidacy_gor_tt:0 "§YMikhail Gorbachev§! becomes a candidate for General Secretary. The decision §YConvene the Plenum: Mikhail Gorbachev§! asks the Politburo to elect him (Moscow casts its §Y3§! votes for him, every republic with a seat in the Politburo has §Y1§! vote and AI republics vote in favour; only if all three republican members vote against does the Plenum reject him). If the Politburo agrees, he takes over; if it rejects him, nothing changes, stability falls by §R3%§! and the balance shifts against him."
 COLDWAR_SOV_ple_gor:0 "The New Generation"
 COLDWAR_SOV_ple_gor_desc:0 "Mikhail Gorbachev, the energetic party chief of Stavropol, belongs to a generation shaped by Khrushchev's thaw rather than by Stalin's purges. Powerful patrons such as Andropov and Suslov have marked him as a man of the future. Historically he became General Secretary in March 1985; a plenum could hand power to the new generation earlier, with all the hope and risk that change brings."
 COLDWAR_SOV_tt_gensec_bre:0 "Leonid Brezhnev is General Secretary"
 COLDWAR_SOV_bre_dear_leonid_ilyich:0 "Dear Leonid Ilyich"
 COLDWAR_SOV_bre_dear_leonid_ilyich_desc:0 "Since October 1964, Leonid Ilyich Brezhnev has led the Party, first cautiously, then with growing confidence. After the upheavals of Stalin and Khrushchev, he offers the nomenklatura what it craves most: stability, predictability and respect for its positions. Hailed as 'dear Leonid Ilyich' in official speeches, he now stands ready to shape a whole era in his own image."
 COLDWAR_SOV_bre_the_dnepropetrovsk_clan:0 "The Dnepropetrovsk Clan"
 COLDWAR_SOV_bre_the_dnepropetrovsk_clan_desc:0 "Brezhnev built his career in Dnepropetrovsk and Moldavia, and the men he met there have followed him to Moscow: Andrei Kirilenko in the Secretariat, Nikolai Shchelokov at the Interior Ministry, Nikolai Tikhonov in the Council of Ministers. Promoting this circle of old comrades secures the General Secretary's grip on key posts, but it also rewards loyalty above competence."
 COLDWAR_SOV_bre_the_general_department:0 "The General Department"
 COLDWAR_SOV_bre_the_general_department_desc:0 "Every document that reaches the Politburo passes through the Central Committee's General Department, headed since 1965 by Konstantin Chernenko. He controls the agenda, the minutes and the flow of paper to the General Secretary's desk. Turning this office into the nerve centre of the leadership makes the bureaucracy run more smoothly and makes Brezhnev's most loyal aide indispensable."
 COLDWAR_SOV_bre_balance_the_troika:0 "Balance the Troika"
 COLDWAR_SOV_bre_balance_the_troika_desc:0 "The collective leadership born in 1964 rests on a careful division: Brezhnev leads the Party, Kosygin the government and Podgorny the state. Each has his own clients and ambitions, and open rivalry would threaten everything. By balancing the troika, giving each man a sphere and none a reason to rebel, Brezhnev keeps the peace in the Politburo while quietly strengthening his own position."
 COLDWAR_SOV_bre_the_first_choice:0 "Detente or Doctrine?"
 COLDWAR_SOV_bre_the_first_choice_desc:0 "The invasion of Czechoslovakia in 1968 has shown the world that Moscow will defend socialism in Eastern Europe by force. Now the leadership must decide how to use the strategic parity it has reached with the United States. Should it negotiate from strength and harvest the fruits of detente, or harden the Brezhnev Doctrine and confront the West wherever it challenges the socialist camp?"
 COLDWAR_SOV_bre_detente_from_strength:0 "Detente from Strength"
 COLDWAR_SOV_bre_detente_from_strength_desc:0 "With nuclear parity achieved, Brezhnev believes the Soviet Union can finally negotiate with the West as an equal. Arms control, trade agreements and summits are not a sign of weakness but proof that the correlation of forces has shifted in favour of socialism. Detente from strength promises Western technology and grain while the Soviet Union keeps its military might intact."
 COLDWAR_SOV_bre_the_crimean_talks:0 "The Crimean Talks"
 COLDWAR_SOV_bre_the_crimean_talks_desc:0 "In September 1971, Brezhnev invites West German Chancellor Willy Brandt to his dacha at Oreanda in the Crimea. Between swims in the Black Sea and long conversations, the two men confirm the spirit of the Moscow Treaty and of Bonn's new eastern policy. Courting West Germany opens a door to credit and technology and drives a wedge into the Western alliance."
 COLDWAR_SOV_bre_brezhnev_in_washington:0 "Brezhnev in Washington"
 COLDWAR_SOV_bre_brezhnev_in_washington_desc:0 "In June 1973, Brezhnev travels to the United States for a second summit with Richard Nixon, a year after their breakthrough meeting in Moscow. On the table lies an Agreement on the Prevention of Nuclear War, committing both superpowers to consult rather than slide into confrontation. Whether Washington signs depends on its own calculations, but the visit itself is a triumph of Soviet prestige."
 COLDWAR_SOV_bre_the_helsinki_triumph:0 "The Helsinki Triumph"
 COLDWAR_SOV_bre_the_helsinki_triumph_desc:0 "In August 1975, thirty-five states sign the Final Act of the Conference on Security and Co-operation in Europe in Helsinki. For Brezhnev, it is the crowning achievement of his career: the post-war borders of Europe, including the division of Germany and the Soviet gains of 1945, are recognised as inviolable. The human rights clauses of the third basket seem a small price to pay, for now."
 COLDWAR_SOV_bre_the_doctrine_hawk:0 "The Doctrine Hawk"
 COLDWAR_SOV_bre_the_doctrine_hawk_desc:0 "Prague in 1968 proved that the socialist commonwealth is a single body and that the loss of any part threatens the whole. The hawks around Suslov, Grechko and the General Staff argue that detente is a Western trap and that the Brezhnev Doctrine must guide Soviet policy. Choosing the doctrine means standing firm everywhere and trusting military power over Western goodwill."
 COLDWAR_SOV_bre_the_iron_bloc:0 "The Iron Bloc"
 COLDWAR_SOV_bre_the_iron_bloc_desc:0 "The Warsaw Pact and Comecon bind Eastern Europe to Moscow, yet Romania goes its own way, Poland simmers and Hungary experiments with markets. An iron bloc would tighten the reins: joint command structures, deeper economic integration and Soviet advisers in every allied defence ministry. The allies would gain security and lose what little room for manoeuvre they still have."
 COLDWAR_SOV_mod_equipment_cost_multiplier_modifier_tt:0 "Equipment Costs: $RIGHT|-=%1$"
 COLDWAR_SOV_mod_production_speed_arms_factory_factor_tt:0 "Military Factory Construction Speed: $RIGHT|+=%1$"
 COLDWAR_SOV_mod_military_industry_tax_modifier_tt:0 "Military Industry Taxes: $RIGHT|+=%1$"
 COLDWAR_SOV_bre_answer_every_challenge:0 "Answer Every Challenge"
 COLDWAR_SOV_bre_answer_every_challenge_desc:0 "For every American carrier a Soviet cruiser, for every new missile a Soviet reply. Under this principle, the Soviet Union matches each Western weapons programme step by step, determined never again to suffer the inferiority of the Cuban crisis years. The military-industrial complex welcomes the orders, even as the arms race tightens with every turn."
 COLDWAR_SOV_mod_send_volunteer_size_tt:0 "$MODIFIER_SEND_VOLUNTEER_SIZE$: $RIGHT|+=%1$"
 COLDWAR_SOV_bre_the_internationalist_duty:0 "The Internationalist Duty"
 COLDWAR_SOV_bre_the_internationalist_duty_desc:0 "From Vietnam to Africa and the Middle East, national liberation movements look to Moscow for weapons, advisers and money. Soviet ideologists call it the internationalist duty of the first socialist state to support every people fighting imperialism. Embracing this duty spreads Soviet influence across the Third World, but it also deepens commitments in distant wars with uncertain outcomes."
 COLDWAR_SOV_bre_the_tula_speech:0 "The Tula Speech"
 COLDWAR_SOV_bre_the_tula_speech_desc:0 "In January 1977, presenting Tula with its title of Hero City, Brezhnev declares that the Soviet Union does not seek military superiority and wants only a defence sufficient to deter any attacker. The marshals grumble, but the speech is meant to reassure a new American administration and keep detente alive. Words, however, must be matched by deeds to be believed."
 COLDWAR_SOV_bre_the_second_choice:0 "Butter, Guns or Oil?"
 COLDWAR_SOV_bre_the_second_choice_desc:0 "Growth is slowing, and the leadership can no longer fund everything at once. The consumer wants flats, cars and full shelves; the marshals want tanks and missiles; and the new oil fields of Western Siberia promise a flood of hard currency. As the five-year plans of the 1970s take shape, Brezhnev must decide where the Soviet Union places its bet for the coming decade."
 COLDWAR_SOV_mod_social_cost_multiplier_modifier_tt:0 "Social Spending Costs: $RIGHT|-=%1$"
 COLDWAR_SOV_bre_consumer_socialism:0 "Consumer Socialism"
 COLDWAR_SOV_bre_consumer_socialism_desc:0 "The Ninth Five-Year Plan is the first to promise that consumer goods will grow faster than heavy industry. Refrigerators, televisions and the new Zhiguli cars from Togliatti are meant to prove that socialism can deliver a good life, not just steel and rockets. Putting the consumer first buys the contentment of the population, though it strains a planning system built for tanks and turbines."
 COLDWAR_SOV_bre_the_little_deal:0 "The Little Deal"
 COLDWAR_SOV_bre_the_little_deal_desc:0 "The economist James Millar would later call it the 'little deal': the regime tolerates the black market, private plots, favours and petty theft, and in return the population tolerates the regime. Accepting this unspoken bargain keeps private life supplied and tempers discontent, while corruption seeps ever deeper into the foundations of the state."
 COLDWAR_SOV_mod_production_speed_buildings_factor_tt:0 "Construction Speed: $RIGHT|+=%1$"
 COLDWAR_SOV_bre_a_flat_for_every_family:0 "A Flat for Every Family"
 COLDWAR_SOV_bre_a_flat_for_every_family_desc:0 "Millions of Soviet families still live in communal apartments, sharing one kitchen between several households. The Party has promised every family a flat of its own, and new prefabricated districts are rising on the edge of every city, from Moscow to Novosibirsk. Pushing housing construction even harder would answer one of the people's deepest wishes and turn a promise into concrete."
 COLDWAR_SOV_bre_guns_before_butter:0 "Guns before Butter"
 COLDWAR_SOV_bre_guns_before_butter_desc:0 "The marshals and the defence ministries argue that the international situation leaves no room for indulgence. As long as the United States arms itself and China threatens the Far East, every rouble belongs first to the armed forces. Placing guns before butter guarantees the strength of the military-industrial complex, while the queues for meat and shoes grow longer."
 COLDWAR_SOV_bre_the_military_industrial_commission:0 "The Military-Industrial Commission"
 COLDWAR_SOV_bre_the_military_industrial_commission_desc:0 "The Military-Industrial Commission of the Council of Ministers coordinates the nine defence ministries that build everything from rifles to intercontinental missiles. Giving it greater authority and new factories would turn the defence sector into an even more privileged state within the state. Its output would rise, but so would its claim on the country's best engineers and resources."
 COLDWAR_SOV_mod_breakthrough_factor_tt:0 "Division Breakthrough: $RIGHT|+=%1$"
 COLDWAR_SOV_bre_the_tank_parks:0 "The Tank Parks"
 COLDWAR_SOV_bre_the_tank_parks_desc:0 "Behind barbed wire across the western military districts and Eastern Europe stand vast tank parks, row upon row of T-55s and T-62s, with the new T-64 entering service. Soviet doctrine counts on overwhelming armoured mass to reach the Rhine within days. Expanding these parks and pushing the next generation of main battle tanks would cement Soviet superiority on land."
 COLDWAR_SOV_mod_oil_export_multiplier_modifier_tt:0 "Oil Export Revenue: $RIGHT|+=%1$"
 COLDWAR_SOV_bre_the_oil_bet:0 "The Oil Bet"
 COLDWAR_SOV_bre_the_oil_bet_desc:0 "The discovery of Samotlor and the other giant fields of Western Siberia has turned the Soviet Union into an oil power. Exporting crude and gas for hard currency could pay for Western machinery and grain without painful reforms. Betting on oil is the easy road, but an economy that lives off its wells may lose the will to modernise itself."
 COLDWAR_SOV_mod_agricolture_productivity_modifier_tt:0 "Agricultural Productivity: $RIGHT|+=%1$"
 COLDWAR_SOV_bre_oil_for_grain:0 "Oil for Grain"
 COLDWAR_SOV_bre_oil_for_grain_desc:0 "Soviet agriculture cannot keep pace with demand, and a single bad harvest, as in 1972, forces Moscow to buy millions of tonnes of grain abroad. Oil money offers a way out: sell crude on the world market and buy wheat, fodder and meat in return. The collective farms gain breathing space and the cities stay fed, as long as oil prices remain high."
 COLDWAR_SOV_bre_pipelines_to_europe:0 "Pipelines to Europe"
 COLDWAR_SOV_bre_pipelines_to_europe_desc:0 "In 1970, Moscow and Bonn sign the first gas-for-pipes deal: German steel pipes in exchange for Soviet natural gas delivered over twenty years. Austria already receives Soviet gas, and Italy and France are interested in similar contracts. Long-term supply agreements with Western Europe would bring a steady flow of hard currency and bind the continent's industry to Soviet energy, whether NATO likes it or not."
 COLDWAR_SOV_bre_kgb_or_mvd:0 "Andropov or Shchelokov?"
 COLDWAR_SOV_bre_kgb_or_mvd_desc:0 "Two men compete to be the guardian of Soviet order. Yuri Andropov's KGB watches dissidents, foreign spies and, increasingly, corrupt officials; Nikolai Shchelokov's Interior Ministry runs the militia and enjoys Brezhnev's personal friendship. Their rivalry is bitter and personal. The General Secretary must decide whose methods, and whose people, he will trust to keep the country in line."
 COLDWAR_SOV_mod_intelligence_agency_defense_tt:0 "Intelligence Defence: $RIGHT|+=2$"
 COLDWAR_SOV_bre_back_the_kgb:0 "Back the KGB"
 COLDWAR_SOV_bre_back_the_kgb_desc:0 "Andropov argues that corruption and indiscipline are eating away at the state, and that only the KGB has the reach and the integrity to stop it. Backing the Committee for State Security gives it a free hand to investigate economic crimes, even among the protected clients of regional party bosses. Order will improve, though many in the nomenklatura will learn to fear the knock at the door."
 COLDWAR_SOV_mod_police_cost_multiplier_modifier_tt:0 "Police Costs: $RIGHT|-=%1$"
 COLDWAR_SOV_bre_back_the_mvd:0 "Back the MVD"
 COLDWAR_SOV_bre_back_the_mvd_desc:0 "Nikolai Shchelokov has modernised the militia, raised its pay and polished its image with popular television detective series. He is also an old friend of Brezhnev from Moldavia and Dnepropetrovsk. Backing the Interior Ministry means a loyal, comfortable police force that keeps the streets calm, and one that looks the other way when the right people are involved."
 COLDWAR_SOV_bre_trust_the_republics:0 "Trust in the Republican Cadres"
 COLDWAR_SOV_bre_trust_the_republics_desc:0 "Under Brezhnev's stability of cadres, the first secretaries of the union republics enjoy unprecedented security: Sharaf Rashidov in Uzbekistan, Dinmukhamed Kunaev in Kazakhstan, Heydar Aliyev in Azerbaijan. In exchange for loyalty and good plan figures, Moscow asks few questions about how they run their domains. Trusting the republican cadres keeps the union quiet, but lets local patronage networks flourish."
 COLDWAR_SOV_bre_malaya_zemlya:0 "Malaya Zemlya"
 COLDWAR_SOV_bre_malaya_zemlya_desc:0 "In 1978, a slim volume of war memoirs appears under Brezhnev's name, celebrating the small bridgehead of Malaya Zemlya near Novorossiysk as if it had decided the war. Printed in millions of copies, it is studied in schools and honoured with the Lenin Prize for Literature. Together with the ever-growing collection of medals on his chest, it marks a personality cult that the nation increasingly mocks in private."
 COLDWAR_SOV_bre_marshal_brezhnev:0 "Marshal Brezhnev"
 COLDWAR_SOV_bre_marshal_brezhnev_desc:0 "In May 1976, Brezhnev is made a Marshal of the Soviet Union, a rank far above the one he held in the war, which he ended as a major general and political officer. The new title flatters the army and ties the General Secretary to its glory. The generals salute, even if some privately resent seeing their highest honour bestowed upon a former political commissar."
 COLDWAR_SOV_bre_chairman_of_the_presidium:0 "Chairman of the Presidium"
 COLDWAR_SOV_bre_chairman_of_the_presidium_desc:0 "In June 1977, Nikolai Podgorny is abruptly removed from the Politburo and from his post as head of state, and Brezhnev takes the chairmanship of the Presidium of the Supreme Soviet himself. For the first time, one man holds both the leadership of the Party and the formal presidency of the Soviet state. The troika is over; Brezhnev now stands alone at the summit."
 COLDWAR_SOV_bre_the_leaders_health:0 "The General Secretary's Health"
 COLDWAR_SOV_bre_the_leaders_health_desc:0 "Behind the medals and the ovations, Brezhnev's health is failing. Strokes, a dependence on sleeping pills and increasingly slurred speech turn every public appearance into an ordeal watched closely by foreign diplomats and the Politburo alike. The leadership must decide how to handle the decline: hide it and carry on, or prepare for an orderly departure."
 COLDWAR_SOV_bre_the_kremlin_doctors:0 "The Kremlin Doctors"
 COLDWAR_SOV_bre_the_kremlin_doctors_desc:0 "Yevgeny Chazov and the Fourth Main Directorate of the Ministry of Health, the Kremlin's own medical service, are tasked with keeping the General Secretary on his feet. With the best physicians, private clinics and constant supervision, they can sustain Brezhnev for years, historically until 1982. The leader stays in office, but the country is governed ever more by his aides."
 COLDWAR_SOV_bre_a_dignified_retirement:0 "A Dignified Retirement"
 COLDWAR_SOV_bre_a_dignified_retirement_desc:0 "More than once, a tired and ailing Brezhnev asks his comrades to let him retire. The Politburo has always refused, fearing a destabilising struggle for the succession. What if this time they agreed? A dignified retirement, with full honours and a chosen successor, would give the Soviet Union something it has never had: a peaceful, planned transfer of power at the very top."
 COLDWAR_SOV_bre_the_succession:0 "The Succession"
 COLDWAR_SOV_bre_the_succession_desc:0 "Whoever controls the succession controls the future of the Soviet Union. Andropov has the KGB, Chernenko the apparatus, Romanov the Leningrad organisation, and the young Gorbachev the favour of the reformers. By naming an heir while he still can, Brezhnev may spare the country a struggle in the Politburo, or ignite one."
 COLDWAR_SOV_mod_intel_network_gain_factor_tt:0 "$MODIFIER_INTEL_NETWORK_GAIN_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SOV_bre_heir_andropov:0 "Heir: Andropov"
 COLDWAR_SOV_bre_heir_andropov_desc:0 "Yuri Andropov is the most capable and the most feared man in the Politburo. Naming him heir promises a successor who will root out corruption and restore discipline, provided the Party is ready for a Chekist at its head. Historically, Andropov succeeded Brezhnev in 1982, after first moving from the KGB back into the Central Committee Secretariat."
 COLDWAR_SOV_bre_heir_chernenko:0 "Heir: Chernenko"
 COLDWAR_SOV_bre_heir_chernenko_desc:0 "Konstantin Chernenko is Brezhnev's shadow, his most loyal aide and the keeper of his papers. Naming him heir guarantees that nothing will change: the cadres keep their posts, the policies continue and the old guard sleeps soundly. What if Chernenko came to power directly, without Andropov's interlude, and continuity became the Soviet Union's only programme?"
 COLDWAR_SOV_mod_industrial_capacity_factory_tt:0 "Factory Output: $RIGHT|+=%1$"
 COLDWAR_SOV_bre_heir_romanov:0 "Heir: Romanov"
 COLDWAR_SOV_bre_heir_romanov_desc:0 "Grigory Romanov, the strict and efficient master of Leningrad, would bring a younger, harder face to the Kremlin: orthodox in ideology, close to the defence industry and impatient with laxity. Naming him heir skips a generation of tired old men and places the Party in the hands of a technocrat of order. What if the man from Smolny, not Gorbachev, became the Soviet Union's future?"
 COLDWAR_SOV_bre_heir_gorbachev:0 "Heir: An Early Gorbachev"
 COLDWAR_SOV_bre_heir_gorbachev_desc:0 "In the late 1970s, Mikhail Gorbachev has only just arrived in Moscow as Central Committee Secretary for agriculture. Naming him heir would hand power to a man not yet fifty, a generation younger than the rest of the Politburo. What if the reformer came to power years before 1985, while the economy and the empire still had reserves to spare?"
 COLDWAR_SOV_bre_developed_socialism_achieved:0 "Developed Socialism Achieved"
 COLDWAR_SOV_bre_developed_socialism_achieved_desc:0 "The Party proclaims that the Soviet Union has entered the stage of developed socialism, a mature society that no longer needs revolutionary leaps, only steady improvement. With the borders recognised, the shelves fuller and the army mighty, the Brezhnev era appears to have reached its summit. Whether this is a plateau or the beginning of stagnation, only time will tell."
 COLDWAR_SOV_tt_gensec_kos:0 "Alexei Kosygin is General Secretary"
 COLDWAR_SOV_kos_the_premier_takes_the_party:0 "The Premier Takes the Party"
 COLDWAR_SOV_kos_the_premier_takes_the_party_desc:0 "For the first time since Khrushchev, the Party and the government are united in one hand, and this time it belongs to a manager rather than an ideologue. Alexei Kosygin brings with him the ministries, the planners and the conviction that the economy, not doctrine, decides the fate of socialism. The apparatus watches warily as the Premier sets out to run the Party like a well-managed enterprise."
 COLDWAR_SOV_kos_baibakov_at_gosplan:0 "Baibakov at Gosplan"
 COLDWAR_SOV_kos_baibakov_at_gosplan_desc:0 "Nikolai Baibakov, an oilman who has headed the State Planning Committee since 1965, knows the Soviet economy better than almost anyone. Under Kosygin, Gosplan could become the engine of reform rather than its brake, setting more realistic targets and listening to the ministries. Giving Baibakov a free hand strengthens the planners and the industrial ministries that depend on them."
 COLDWAR_SOV_kos_the_systems_men:0 "The Systems Men"
 COLDWAR_SOV_kos_the_systems_men_desc:0 "Jermen Gvishiani, Kosygin's son-in-law and deputy head of the State Committee for Science and Technology, champions systems analysis and modern management. Through him, Soviet scientists build ties with Western research institutes and help found the International Institute for Applied Systems Analysis near Vienna. Empowering these systems men brings computers, cybernetics and fresh thinking into the heart of planning."
 COLDWAR_SOV_kos_government_before_party:0 "Government before Party"
 COLDWAR_SOV_kos_government_before_party_desc:0 "Kosygin has long been frustrated by Party secretaries who meddle in factory management without understanding production. Placing the government before the Party means letting ministries and enterprise directors make economic decisions while the apparatus confines itself to ideology and cadres. Efficiency would gain, but the regional party bosses will not easily surrender their power."
 COLDWAR_SOV_kos_the_reform_model:0 "Which Reform?"
 COLDWAR_SOV_kos_the_reform_model_desc:0 "Everyone around Kosygin agrees that the economy needs reform; no one agrees on which. Some look to Hungary's New Economic Mechanism and market prices, others to computers and cybernetic planning that could make the plan truly scientific, still others to a careful revival of the 1965 reform within the existing system. The Premier must choose a path and stake his authority on it."
 COLDWAR_SOV_kos_market_socialism:0 "Market Socialism"
 COLDWAR_SOV_kos_market_socialism_desc:0 "Inspired by Budapest's New Economic Mechanism, Kosygin's bolder advisers propose that prices, profits and demand rather than plan targets should guide Soviet enterprises. Factories would trade among themselves, compete for customers and keep part of their earnings. Market socialism promises dynamism and better goods, while orthodox Marxists warn that it is the first step back to capitalism."
 COLDWAR_SOV_mod_tax_gain_multiplier_modifier_tt:0 "Tax Revenue: $RIGHT|+=%1$"
 COLDWAR_SOV_kos_flexible_prices:0 "Flexible Prices"
 COLDWAR_SOV_kos_flexible_prices_desc:0 "Soviet prices for bread, meat and rent have barely changed in years, held down by subsidies that cost the budget billions. Letting prices move closer to real costs would ease the endless shortages and dry up the black market, but every official remembers what happened in Novocherkassk in 1962 when meat prices rose. Flexible prices are the hardest reform of all to sell."
 COLDWAR_SOV_kos_the_enterprise_law:0 "The Law on the Socialist Enterprise"
 COLDWAR_SOV_kos_the_enterprise_law_desc:0 "A new law on the socialist enterprise would give directors genuine independence: the right to draw up their own production plans, choose suppliers, hire and fire, and reinvest their profits. Ministries would become advisers rather than commanders. Productivity could rise sharply, but the trade unions fear that workers will pay for efficiency with their jobs and their bonuses."
 COLDWAR_SOV_mod_imp_investment_in_extra_tt:0 "Incoming Investment Slots: $RIGHT|+=0$"
 COLDWAR_SOV_mod_receiving_investment_cost_modifier_tt:0 "Received Investment Cost: $RIGHT|-=%1$"
 COLDWAR_SOV_mod_imp_sanction_resistance_tt:0 "Sanction Resistance: $RIGHT|+=%1$"
 COLDWAR_SOV_kos_joint_ventures:0 "Joint Ventures with the West"
 COLDWAR_SOV_kos_joint_ventures_desc:0 "Fiat is already building the giant car plant at Togliatti, and Western companies are eager for more Soviet contracts. Kosygin's reformers propose going further: joint ventures with Western firms on Soviet soil, financed by Western credit and run with Western know-how. Capital and technology would flow in, along with debt and a dependence on the capitalist world that hardliners find intolerable."
 COLDWAR_SOV_kos_cybernetic_communism:0 "Cybernetic Communism"
 COLDWAR_SOV_kos_cybernetic_communism_desc:0 "Soviet cyberneticists argue that the plan fails not because it is a plan, but because no human bureaucracy can process the millions of decisions an economy requires. Computers can. A cybernetic communism would link factories, ministries and Gosplan in a single information system that balances production in real time. The vision is breathtaking; the cost in money and machines is enormous."
 COLDWAR_SOV_kos_the_ogas_grid:0 "The OGAS Grid"
 COLDWAR_SOV_kos_the_ogas_grid_desc:0 "Academician Viktor Glushkov of the Kiev Institute of Cybernetics has designed OGAS, the All-State Automated System for the collection and processing of information. A nationwide network of computing centres would connect thousands of enterprises with Moscow and give planners real data instead of padded reports. The bureaucracy blocked it in 1970; under Kosygin, it could finally be built."
 COLDWAR_SOV_kos_the_electronic_rouble:0 "The Electronic Rouble"
 COLDWAR_SOV_kos_the_electronic_rouble_desc:0 "Viktor Glushkov's most radical idea goes beyond planning: abolish cash altogether and settle every wage and purchase electronically through the OGAS network. With every rouble traceable, the black market, embezzlement and the second economy would have nowhere to hide. Officials who live off undeclared income are, unsurprisingly, among the plan's fiercest opponents."
 COLDWAR_SOV_kos_the_planometric_institutes:0 "The Planometric Institutes"
 COLDWAR_SOV_kos_the_planometric_institutes_desc:0 "At the Central Economic Mathematical Institute in Moscow, economists under Nikolai Fedorenko are building optimal planning models on the foundations of Leonid Kantorovich's linear programming. Kantorovich, who will become the only Soviet Nobel laureate in economics, has shown that mathematics can allocate resources far better than guesswork. Funding these institutes would put science at the heart of Soviet planning."
 COLDWAR_SOV_kos_reform_within_the_plan:0 "Reform within the Plan"
 COLDWAR_SOV_kos_reform_within_the_plan_desc:0 "Kosygin's own instincts are cautious. Rather than markets or computers, he wants to rescue the reform of 1965, with its sales targets, profit indicators and enterprise incentive funds, from the ministries that have hollowed it out. Reform within the plan keeps central planning intact while giving factories just enough freedom to work better."
 COLDWAR_SOV_mod_civilian_industry_tax_modifier_tt:0 "Civilian Industry Taxes: $RIGHT|+=%1$"
 COLDWAR_SOV_kos_profit_and_bonus:0 "Plan, Profit, Bonus"
 COLDWAR_SOV_kos_profit_and_bonus_desc:0 "In 1962, the Kharkov economist Yevsei Liberman published an article in Pravda titled 'Plan, Profit, Bonus', arguing that enterprises should be judged by their profitability and that workers should share in it. His ideas inspired the 1965 reform before the apparatus watered them down. Reviving them would reward efficient factories and give workers a reason to care about quality."
 COLDWAR_SOV_kos_the_production_associations:0 "Production Associations"
 COLDWAR_SOV_kos_the_production_associations_desc:0 "In 1973, the Central Committee and the Council of Ministers order the merger of enterprises into large production associations, combining factories, design bureaus and research institutes under a single management. Done properly, these associations could cut out layers of ministerial bureaucracy and speed the path from invention to production. Done badly, they simply create bigger monopolies."
 COLDWAR_SOV_kos_the_apparatus_resists:0 "The Apparatus Resists"
 COLDWAR_SOV_kos_the_apparatus_resists_desc:0 "Reform threatens the power of the regional party secretaries, the branch ministries and the thousands of officials who live by allocating scarce resources. Once again, as after 1965, the apparatus begins to sabotage the changes through delays, reinterpretations and quiet obstruction. Kosygin must now decide whether to win the Party over with concessions or to break its resistance."
 COLDWAR_SOV_kos_bring_the_party_along:0 "Bring the Party Along"
 COLDWAR_SOV_kos_bring_the_party_along_desc:0 "Kosygin knows that no reform survives in the Soviet Union without the Party's blessing. By offering the nomenklatura positions in the new structures, consulting the regional secretaries and wrapping the changes in Leninist language, he can turn opponents into reluctant partners. The reform will move more slowly, but it will no longer be fought at every step."
 COLDWAR_SOV_kos_break_the_apparatus:0 "Break the Apparatus"
 COLDWAR_SOV_kos_break_the_apparatus_desc:0 "Kosygin's patience is exhausted. If the apparatus will not reform, it must be removed: obstructive ministers dismissed, regional secretaries retired and the stability of cadres brought to an end. Breaking the apparatus would clear the way for real change, but it means open war with the most powerful class in the country and the risk of a backlash that could cost the Premier everything."
 COLDWAR_SOV_kos_curb_the_military_budget:0 "Curb the Military Budget"
 COLDWAR_SOV_kos_curb_the_military_budget_desc:0 "Defence absorbs a far larger share of Soviet output than the official budget admits, starving the civilian economy of steel, engineers and investment. Kosygin argues that strategic parity has been achieved and that every additional tank is a refrigerator or a flat the people will never see. Curbing military spending would free resources, but it will turn the marshals and the defence industry against him."
 COLDWAR_SOV_kos_conversion_of_defence_plants:0 "Conversion of Defence Plants"
 COLDWAR_SOV_kos_conversion_of_defence_plants_desc:0 "The defence plants hold the best machine tools and engineers in the Soviet Union. Converting part of their capacity to civilian production could bring quality televisions, washing machines and tractors to the market. Defence directors already make some consumer goods as a sideline; Kosygin would make it a central task, much to the displeasure of the Military-Industrial Commission."
 COLDWAR_SOV_kos_trade_not_tanks:0 "Trade, Not Tanks"
 COLDWAR_SOV_kos_trade_not_tanks_desc:0 "Kosygin believes the future of the Soviet Union lies in commerce with the world, not confrontation. Trade agreements with France, Italy and West Germany, credits from Western banks and an end to costly adventures could do more for the image of socialism than any military parade. Trade, not tanks, would ease tensions and bring in the technology the Soviet economy badly needs."
 COLDWAR_SOV_kos_the_glassboro_spirit:0 "The Glassboro Spirit"
 COLDWAR_SOV_kos_the_glassboro_spirit_desc:0 "In June 1967, Kosygin and President Lyndon Johnson met for three days at a small college in Glassboro, New Jersey. The summit produced no treaty, but it showed that the leaders of the two superpowers could talk frankly with each other. A new summit with the Premier could revive that spirit, ease tensions and open the way to trade, if Washington is willing to answer."
 COLDWAR_SOV_kos_the_tashkent_mediator:0 "The Tashkent Mediator"
 COLDWAR_SOV_kos_the_tashkent_mediator_desc:0 "In January 1966, Kosygin brought India's Lal Bahadur Shastri and Pakistan's Ayub Khan together in Tashkent and brokered an end to their war. It was a rare triumph for Soviet diplomacy in the role of peacemaker. Renewing this role would raise Moscow's standing in South Asia and win friends in both New Delhi and Islamabad, though balancing the two rivals is never easy."
 COLDWAR_SOV_kos_not_a_single_soldier:0 "Not a Single Soldier"
 COLDWAR_SOV_kos_not_a_single_soldier_desc:0 "In March 1979, as the communist regime in Kabul begs for Soviet troops to crush the uprising in Herat, Kosygin answers bluntly that the Soviet Union cannot replace the Afghan people in their own struggle. Holding to this line would keep the Soviet Army out of a war it cannot win, at the cost of disappointing an ally and risking its collapse."
 COLDWAR_SOV_kos_the_premiers_heart:0 "The Premier's Heart"
 COLDWAR_SOV_kos_the_premiers_heart_desc:0 "Kosygin's heart is failing. A boating accident in 1976 and repeated heart attacks have weakened him, and historically he died in December 1980, only weeks after resigning. If his reforms are to outlive him, the Premier must choose who will carry them forward: a young reformer from the provinces or the disciplined chairman of the KGB."
 COLDWAR_SOV_kos_heir_gorbachev:0 "Heir: Gorbachev's Generation"
 COLDWAR_SOV_kos_heir_gorbachev_desc:0 "Kosygin sees in the younger provincial secretaries, above all Mikhail Gorbachev of Stavropol, the men who could finish what he started. Naming Gorbachev heir would hand the reform course to a generation that believes the system can be renewed from within. What if the Premier's legacy passed directly to the future architect of perestroika?"
 COLDWAR_SOV_kos_heir_andropov:0 "Heir: Andropov"
 COLDWAR_SOV_kos_heir_andropov_desc:0 "Kosygin and Andropov share a distaste for corruption and a belief that the economy must work better. Naming the KGB chairman heir would secure discipline and order for the reform course, though Andropov's vision is one of tighter control rather than greater freedom. What if the Premier's experiment passed into the hands of the Chekist?"
 COLDWAR_SOV_kos_rule_of_the_planners:0 "Rule of the Planners"
 COLDWAR_SOV_kos_rule_of_the_planners_desc:0 "If the Party cannot be reformed, perhaps it can be bypassed. In this most radical outcome, the planners and engineers of Gosplan take over the state, with Nikolai Baibakov at their head, and govern by data and expertise rather than ideology. The leading role of the Communist Party would end, replaced by a technocracy that answers to efficiency alone."
 COLDWAR_SOV_kos_socialism_that_works:0 "Socialism That Works"
 COLDWAR_SOV_kos_socialism_that_works_desc:0 "After years of struggle against the apparatus, the Kosygin reforms finally bear fruit: factories that meet demand, shops with goods on the shelves and growth that no longer depends on ever more labour and raw materials. For the first time since the 1950s, Soviet socialism seems able to compete with the West on its own terms."
 COLDWAR_SOV_tt_gensec_pod:0 "Nikolai Podgorny is General Secretary"
 COLDWAR_SOV_pod_the_president_of_the_presidium:0 "The President of the Presidium"
 COLDWAR_SOV_pod_the_president_of_the_presidium_desc:0 "For years, Nikolai Podgorny's office as head of state has been largely ceremonial: signing decrees, awarding orders and receiving foreign ambassadors. As General Secretary, he would turn the Presidium of the Supreme Soviet into a real centre of power, governing through the institutions of the state rather than through the Party apparatus. The state, not the Party, would become the face of Soviet power."
 COLDWAR_SOV_pod_the_supreme_soviet_awakens:0 "The Supreme Soviet Awakens"
 COLDWAR_SOV_pod_the_supreme_soviet_awakens_desc:0 "The Supreme Soviet of the USSR meets only a few days each year to approve the plan and the budget unanimously. Podgorny would give it real work: standing commissions that scrutinise ministries, deputies who question officials and debates that actually change laws. A living parliament would revive Lenin's call for all power to the soviets, though the Party secretaries will see it as a threat to their monopoly."
 COLDWAR_SOV_pod_the_kharkov_connection:0 "The Kharkov Connection"
 COLDWAR_SOV_pod_the_kharkov_connection_desc:0 "Podgorny built his career in Ukraine, from the sugar industry and the Kharkov regional committee to the leadership of the Ukrainian Communist Party in Kiev. His network of Ukrainian cadres, engineers and managers remains loyal. Drawing on the Kharkov connection would strengthen the voice of the second-largest republic in Moscow and win support among those who want the union to be a true partnership of nations."
 COLDWAR_SOV_pod_the_council_of_ministers_alliance:0 "An Alliance with the Ministers"
 COLDWAR_SOV_pod_the_council_of_ministers_alliance_desc:0 "Podgorny has no strong base in the Party Secretariat, but the branch ministries, chafing under the interference of Party secretaries, are natural allies. By promising the ministers greater autonomy and a voice in the Presidium, he can build a coalition of the state against the apparatus. The industrial ministries would gain power, and the economy a clearer chain of command."
 COLDWAR_SOV_pod_the_state_question:0 "Federation or Presidium?"
 COLDWAR_SOV_pod_the_state_question_desc:0 "Podgorny must decide what kind of state he wants to build. One path leads to a genuine federation in which the union republics gain real rights and a voice in every decision that concerns them. The other leads to a strong Presidium, a central state presidency that governs the union from Moscow above both the Party and the republics. Either way, the Soviet state will never look the same."
 COLDWAR_SOV_mod_nationalist_drift_tt:0 "Nationalist Drift: $RIGHT|+=2$"
 COLDWAR_SOV_pod_a_federal_union:0 "A Federal Union"
 COLDWAR_SOV_pod_a_federal_union_desc:0 "The Soviet constitution already calls the union a voluntary federation of sovereign republics; Podgorny would make the words mean something. Republican governments would gain control over their own economies, languages and cultures, and the republics would have to approve any union decision that affects them. A federal union could win the loyalty of the non-Russian nations, or give them the tools to leave."
 COLDWAR_SOV_pod_republic_councils:0 "Republic Councils of Ministers"
 COLDWAR_SOV_pod_republic_councils_desc:0 "Every union republic already has its own Council of Ministers, yet in practice these governments wait on orders from the all-Union ministries in Moscow. Podgorny, who ran Ukraine before coming to the Kremlin, knows how little room the republics truly have. Giving their governments real authority over local industry and services would bind the republics more firmly to the Union, even if it adds another layer of officials to pay."
 COLDWAR_SOV_pod_republican_accounting:0 "Republican Cost Accounting"
 COLDWAR_SOV_pod_republican_accounting_desc:0 "Under khozraschet, Soviet enterprises are supposed to balance their own books, but the republics themselves still live on allocations handed down by Gosplan. Letting each republic keep part of what it earns and answer for its own costs would reward the efficient and expose the wasteful. Kiev, Minsk and Tbilisi would gain a stake in their own prosperity, and the Union a reason to trust them."
 COLDWAR_SOV_pod_the_soviet_of_nationalities:0 "The Soviet of Nationalities"
 COLDWAR_SOV_pod_the_soviet_of_nationalities_desc:0 "The Supreme Soviet has two chambers, and the Soviet of Nationalities was meant to give every republic and autonomous region an equal voice. For decades it has done little more than applaud. As Chairman of the Presidium, Podgorny can breathe life into it, letting deputies from Tashkent to Tallinn debate the questions that touch their peoples and turning a ceremonial body into a genuine forum of the Union."
 COLDWAR_SOV_pod_the_strong_presidium:0 "The Strong Presidium"
 COLDWAR_SOV_pod_the_strong_presidium_desc:0 "Under the Constitution the Presidium of the Supreme Soviet is the collective head of the Soviet state, yet real power has always rested with the Party. Podgorny intends to change that balance. A Presidium that drafts decrees, oversees ministries and speaks for the state would govern more efficiently, but the Party apparatus and the republican leaders will not surrender their prerogatives quietly."
 COLDWAR_SOV_pod_ministers_answer_to_the_state:0 "Ministers Answer to the State"
 COLDWAR_SOV_pod_ministers_answer_to_the_state_desc:0 "The branch ministries have grown into fiefdoms that answer to Central Committee secretaries and defend their own plans at any cost. If ministers were made accountable to the Presidium and the Council of Ministers rather than to Party patrons, orders could flow through a single chain of command. The industrial ministries would welcome clearer authority, and the planners hope for fewer contradictory instructions."
 COLDWAR_SOV_pod_presidential_decrees:0 "Presidential Decrees"
 COLDWAR_SOV_pod_presidential_decrees_desc:0 "Between sessions of the Supreme Soviet, the Presidium governs through decrees, the ukazy that carry Podgorny's signature. Used boldly, this instrument can settle questions the Politburo prefers to postpone, from pensions to the rights of the republics. Every decree published in Izvestia reminds the country that the Soviet state has a head of its own, and that his word is law."
 COLDWAR_SOV_pod_the_state_security_council:0 "The State Security Council"
 COLDWAR_SOV_pod_the_state_security_council_desc:0 "Questions of internal security are settled in closed meetings between the KGB chairman and the General Secretary. A State Security Council attached to the Presidium would bring defence, internal affairs and state security together under the head of state. The Lubyanka gains a seat at the highest table of government, while the state gains a firmer grip on the guardians of its ideological order."
 COLDWAR_SOV_pod_head_of_state_diplomacy:0 "Head-of-State Diplomacy"
 COLDWAR_SOV_pod_head_of_state_diplomacy_desc:0 "As formal head of state, Podgorny receives ambassadors, signs treaties and travels where the General Secretary cannot. A grand tour of Africa and the Middle East, like the journey that historically took him to Tanzania, Zambia, Mozambique and Somalia in 1977, would give Moscow a dignified and personal face in Cairo, Damascus, Addis Ababa and Luanda."
 COLDWAR_SOV_pod_the_treaty_signer:0 "The Treaty Signer"
 COLDWAR_SOV_pod_the_treaty_signer_desc:0 "Treaties of friendship are the currency of Soviet influence in the Third World, and the head of state is the natural man to sign them. Historically, it was Podgorny who flew to Cairo in May 1971 to sign the first such pact with an Arab state. Making him the Union's treaty signer would let Moscow bind Egypt, Iraq and India more quickly and present the socialist community as a reliable partner."
 COLDWAR_SOV_mod_agriculture_tax_modifier_tt:0 "Agriculture Tax: $RIGHT|+=%1$"
 COLDWAR_SOV_pod_ukrainian_breadbasket:0 "The Ukrainian Breadbasket"
 COLDWAR_SOV_pod_ukrainian_breadbasket_desc:0 "The black earth of Ukraine still feeds much of the Union, but its kolkhozes suffer from poor machinery, wasted harvests and low procurement prices. Podgorny, once First Secretary in Kiev, understands the republic's countryside better than anyone in the Politburo. Investment in fertiliser, irrigation and storage could restore Ukraine's role as the breadbasket of the Union and win the loyalty of its villages."
 COLDWAR_SOV_mod_energy_gain_multiplier_tt:0 "Energy Production: $RIGHT|+=%1$"
 COLDWAR_SOV_mod_fossil_pp_energy_generation_modifier_tt:0 "Fossil Power Plant Output: $RIGHT|+=%1$"
 COLDWAR_SOV_pod_donbass_coal:0 "Donbass Coal"
 COLDWAR_SOV_pod_donbass_coal_desc:0 "The mines of the Donets Basin powered the first Five-Year Plans and remain the heart of Ukrainian heavy industry. Yet the shafts are deep, the seams are thinning and the miners are growing restless. New power stations and modernised pits would keep the furnaces of the south burning, and a government that looks after the miners can count on the support of the trade unions."
 COLDWAR_SOV_pod_the_final_form:0 "The Final Form of the State"
 COLDWAR_SOV_pod_the_final_form_desc:0 "Podgorny's reforms have raised a question the Party has long avoided: what kind of state should the Soviet Union ultimately be? One path leads to a looser union in which the republics stand as sovereign partners. The other leads to a strong Soviet presidency that rules above the Party apparatus. The choice will define the Union for a generation."
 COLDWAR_SOV_pod_union_of_sovereign_states:0 "A Union of Sovereign States"
 COLDWAR_SOV_pod_union_of_sovereign_states_desc:0 "What if the Union were refounded as a voluntary association of sovereign republics, bound by treaty rather than by the will of the Central Committee? Pyotr Shelest, Kiev's outspoken defender of Ukrainian interests, would lead the new union as its first head. The republics would welcome the change, yet abandoning the leading role of the Communist Party will shake the foundations of the old order."
 COLDWAR_SOV_pod_the_soviet_presidency:0 "The Soviet Presidency"
 COLDWAR_SOV_pod_the_soviet_presidency_desc:0 "Foreign newspapers already call Podgorny the Soviet President, though no such office exists. Turning the chairmanship of the Presidium into a true presidency, with its own staff and powers, would give the state a head who does not depend on the goodwill of the Party apparatus. The General Secretary would remain influential, but no longer the only master in the Kremlin."
 COLDWAR_SOV_pod_the_soviet_state:0 "The Soviet State"
 COLDWAR_SOV_pod_the_soviet_state_desc:0 "The state has finally stepped out of the shadow of the Party. Ministries answer to the government, the republics have their voice in the Supreme Soviet, and the head of state speaks with real authority at home and abroad. Podgorny's vision of a Soviet Union governed by its own institutions has become reality, and the system looks steadier than it has in decades."
 COLDWAR_SOV_tt_gensec_sus:0 "Mikhail Suslov is General Secretary"
 COLDWAR_SOV_sus_the_grey_cardinal_rules:0 "The Grey Cardinal Rules"
 COLDWAR_SOV_sus_the_grey_cardinal_rules_desc:0 "For decades Mikhail Suslov has guarded the purity of the Party line from the shadows, shaping every major speech, textbook and Pravda editorial. Now the Grey Cardinal stands at the head of the Party itself. Ascetic, cautious and unyielding, he intends to defend Marxism-Leninism against revisionism at home and abroad, even if innovation and scientific freedom must pay the price."
 COLDWAR_SOV_sus_the_ideological_commission:0 "The Ideological Commission"
 COLDWAR_SOV_sus_the_ideological_commission_desc:0 "Ideological work is scattered among the propaganda, culture and science departments of the Central Committee, each guarding its own turf. Suslov proposes a single commission to coordinate them all, from university lecture halls to factory wall newspapers. With one hand on every lever of propaganda, the Party can renew the faith of its members and remind the nomenklatura where their loyalty belongs."
 COLDWAR_SOV_sus_ponomarevs_department:0 "Ponomarev's Department"
 COLDWAR_SOV_sus_ponomarevs_department_desc:0 "Boris Ponomarev has run the International Department of the Central Committee since 1955, maintaining Moscow's ties with communist parties and liberation movements across the globe. Under Suslov's protection, the department can expand its funding, its party schools and its network of contacts in Havana, Hanoi and Ulan Bator. The socialist community needs a guiding centre, and Ponomarev is eager to provide it."
 COLDWAR_SOV_sus_trapeznikovs_science_department:0 "Trapeznikov's Science Department"
 COLDWAR_SOV_sus_trapeznikovs_science_department_desc:0 "Sergei Trapeznikov, head of the Central Committee's Department of Science and Educational Institutions, is an old companion of Brezhnev and an open admirer of Stalin. Under his supervision, academic appointments and research topics are screened for ideological reliability. Scholars at the Academy of Sciences grumble about lost freedom, but the neo-Stalinist wing of the Party sees in him a champion of discipline in the institutes."
 COLDWAR_SOV_sus_the_line:0 "The Correct Line"
 COLDWAR_SOV_sus_the_line_desc:0 "Every communist knows that the Party line must be followed, but where exactly does it run? Suslov must decide whether to concentrate on guarding the ideological purity of Soviet society at home, or to carry the struggle against imperialism and revisionism abroad. Both paths lead back to Marxism-Leninism, yet they demand very different resources and face very different enemies."
 COLDWAR_SOV_sus_ideological_purity:0 "Ideological Purity"
 COLDWAR_SOV_sus_ideological_purity_desc:0 "Samizdat manuscripts pass from hand to hand, foreign radio stations are heard in Moscow kitchens, and dissidents demand that the state respect its own Constitution. Suslov's answer is uncompromising: the dissident circles must be broken up, their leaders tried or exiled, and the intelligentsia reminded of its duty. The Party gains calm and order, though the price is paid in creativity and goodwill abroad."
 COLDWAR_SOV_sus_rewrite_the_history:0 "Rewrite the History"
 COLDWAR_SOV_sus_rewrite_the_history_desc:0 "Since 1956, Soviet history books have been torn between Khrushchev's denunciation of Stalin and the uneasy silence that followed his fall. The Pravda article marking Stalin's ninetieth birthday in 1969 showed how far the pendulum has already swung. Suslov's historians can go further, portraying the late leader as the organiser of victory, a creeping rehabilitation that delights the conservatives and alarms the reformers."
 COLDWAR_SOV_mod_foreign_subversive_activites_tt:0 "Foreign Subversive Activities: $RIGHT|-=%1$"
 COLDWAR_SOV_sus_the_glavlit_offensive:0 "The Glavlit Offensive"
 COLDWAR_SOV_sus_the_glavlit_offensive_desc:0 "Glavlit, the Main Administration for Safeguarding State Secrets in the Press, decides what Soviet citizens may read. A tighter regime of censorship would strip questionable passages from literary journals, keep foreign publications out of libraries and silence the liberal editors of Novy Mir for good. Hostile voices will find it harder to reach Soviet readers, although scientists will also lose access to useful works from the West."
 COLDWAR_SOV_sus_the_closed_society:0 "The Closed Society"
 COLDWAR_SOV_sus_the_closed_society_desc:0 "Detente has brought Western tourists, journalists, jeans and records into the Soviet Union, and with them dangerous ideas. Suslov insists that peaceful coexistence between states does not mean coexistence between ideologies. Fewer exit visas, fewer exchanges and closer supervision of foreigners would seal Soviet society against bourgeois influence, even if foreign trading partners come to view the Union with growing suspicion."
 COLDWAR_SOV_sus_militant_internationalism:0 "Militant Internationalism"
 COLDWAR_SOV_sus_militant_internationalism_desc:0 "From Indochina to the Horn of Africa, the correlation of forces in the world seems to be shifting towards socialism. Suslov argues that the Soviet Union must not merely observe this historic process but actively lead it, sending arms, money and advisers wherever peoples rise against imperialism. Such a course is expensive and will alarm Washington, but history, he insists, is on Moscow's side."
 COLDWAR_SOV_mod_mdcw_cw_military_programme_cost_tt:0 "Military Programme Cost (Cold War): $RIGHT|-=%1$"
 COLDWAR_SOV_sus_the_liberation_movements:0 "The Liberation Movements"
 COLDWAR_SOV_sus_the_liberation_movements_desc:0 "The crumbling Portuguese empire, unrest in Ethiopia and the struggle in South Yemen have opened new fronts in the battle against imperialism. The MPLA in Angola and FRELIMO in Mozambique look to Moscow for weapons and training. By supporting these movements systematically, the Soviet Union can win loyal allies in Africa and Arabia before Washington or Beijing does."
 COLDWAR_SOV_sus_against_eurocommunism:0 "Against Eurocommunism"
 COLDWAR_SOV_sus_against_eurocommunism_desc:0 "The Italian, French and Spanish communists under Enrico Berlinguer, Georges Marchais and Santiago Carrillo are drifting towards a democratic road to socialism, independent of Moscow and openly critical of its methods. To Suslov this Eurocommunism is nothing but revisionism in new clothes. Condemning it will cost friendship in Rome and Paris, but it will remind every loyal party that the movement has only one centre."
 COLDWAR_SOV_sus_the_world_conference:0 "The World Conference"
 COLDWAR_SOV_sus_the_world_conference_desc:0 "In June 1969 delegations from seventy-five parties gathered in Moscow for the International Meeting of Communist and Workers' Parties. Suslov wants a new conference on the same model, with the CPSU firmly at its centre and a joint declaration against imperialism and revisionism. Even if some parties stay away, the image of a united movement assembled in the Kremlin is worth the effort."
 COLDWAR_SOV_sus_moral_incentives:0 "Moral Incentives"
 COLDWAR_SOV_sus_moral_incentives_desc:0 "Kosygin's reforms tried to motivate workers with bonuses and enterprise profits, an approach Suslov considers dangerously close to capitalism. He prefers the methods of socialist emulation: boards of honour, red challenge banners, medals and the title of Hero of Socialist Labour. Consciousness rather than money should drive the Soviet worker, though planners fear that productivity will suffer without material rewards."
 COLDWAR_SOV_sus_against_the_market:0 "Against the Market"
 COLDWAR_SOV_sus_against_the_market_desc:0 "Collective farm markets, cooperative workshops and private plots have grown into a grey economy where prices follow supply and demand. To Suslov, every kopeck earned outside the plan is a step towards the restoration of capitalism. Closing down the cooperative sector will please the Party orthodox and restore ideological clarity, even if shoppers find the shelves emptier than before."
 COLDWAR_SOV_sus_the_drawing_together_of_nations:0 "The Drawing Together of Nations"
 COLDWAR_SOV_sus_the_drawing_together_of_nations_desc:0 "Party theorists already speak of the Soviet people as a new historical community that transcends nationality. Suslov wants to give substance to this formula through sblizhenie, the drawing together of the nations of the Union: more Russian-language teaching, mixed workforces on the great construction sites and a shared Soviet culture. Moscow hopes that national grievances will fade as a common identity takes root."
 COLDWAR_SOV_mod_education_cost_multiplier_modifier_tt:0 "Education Costs: $RIGHT|-=%1$"
 COLDWAR_SOV_sus_marxism_leninism_in_every_school:0 "Marxism-Leninism in Every School"
 COLDWAR_SOV_sus_marxism_leninism_in_every_school_desc:0 "Young Soviet citizens learn their Marxism-Leninism from dry textbooks and recite it without conviction. Suslov orders a thorough overhaul of ideological education, from the Young Pioneers to university courses in scientific communism. New curricula, better-trained teachers and compulsory study circles cost money, but a generation raised in the faith of the Party will not stray towards bourgeois temptations."
 COLDWAR_SOV_sus_no_gods_in_the_kremlin:0 "No Gods in the Kremlin"
 COLDWAR_SOV_sus_no_gods_in_the_kremlin_desc:0 "Despite decades of atheist propaganda, churches are filling again and some intellectuals look to Orthodoxy for answers the Party cannot give. Suslov intends to renew the campaign of scientific atheism, tighten the grip of the Council for Religious Affairs and close parishes that grow too popular. Believers and monarchist dreamers are pushed back to the margins, though the faithful will not forget."
 COLDWAR_SOV_sus_the_polemic_with_beijing:0 "The Polemic with Beijing"
 COLDWAR_SOV_sus_the_polemic_with_beijing_desc:0 "Since the border clashes on the Ussuri in 1969, Moscow and Beijing have exchanged insults in print as fiercely as they once exchanged fire. Mao's China calls the Soviet Union social-imperialist, while Suslov denounces Maoism as a petty-bourgeois deviation. Renewing the polemic in Pravda and across the world movement will rally loyal parties around Moscow, but it pushes any reconciliation with China further away."
 COLDWAR_SOV_sus_the_heir_question:0 "The Ideologue's Heir"
 COLDWAR_SOV_sus_the_heir_question_desc:0 "Mikhail Suslov was born in 1902, and his health grows weaker every year. The orthodox wing of the Party must decide who will guard the Marxist-Leninist line once the Grey Cardinal is gone. Konstantin Chernenko offers continuity and a steady hand on the apparatus, while Grigory Romanov of Leningrad promises a younger and harder line."
 COLDWAR_SOV_sus_heir_chernenko:0 "Heir: Chernenko"
 COLDWAR_SOV_sus_heir_chernenko_desc:0 "Konstantin Chernenko has spent his career in the Party apparatus, running the General Department of the Central Committee and the flow of paper that keeps the Politburo working. He is no ideologue, but he is reliable, careful and loyal to collective leadership. Naming him heir assures the cadres that nothing will change abruptly when the Grey Cardinal departs."
 COLDWAR_SOV_sus_heir_romanov:0 "Heir: Romanov"
 COLDWAR_SOV_sus_heir_romanov_desc:0 "Grigory Romanov rules Leningrad with a firm hand, keeping its factories, shipyards and restless intellectuals in strict order. Younger than the old guard and admired by the defence industry, he represents a harder and more disciplined variant of orthodoxy. Choosing him as heir signals that the Party's conservatives intend to hold power for another generation."
 COLDWAR_SOV_sus_the_iron_line_inherits:0 "The Iron Line Inherits"
 COLDWAR_SOV_sus_the_iron_line_inherits_desc:0 "What if the guardians of orthodoxy decided that collective leadership had grown too soft? The Neo-Stalinist Platform, led by Sergei Trapeznikov, steps forward to claim Suslov's inheritance and govern in the spirit of the old Vozhd. The cult of the Generalissimo is restored, discipline replaces debate, and the CPSU as it existed under Brezhnev becomes a memory."
 COLDWAR_SOV_sus_the_orthodox_union:0 "The Orthodox Union"
 COLDWAR_SOV_sus_the_orthodox_union_desc:0 "Suslov's work is complete. The Party line is clear, the censors are vigilant and the schools teach Marxism-Leninism without deviation. The Soviet Union stands as a fortress of orthodox socialism, steady and predictable, though critics whisper that it has also become rigid and slow to adapt to a changing world."
 COLDWAR_SOV_tt_gensec_she:0 "Alexander Shelepin is General Secretary"
 COLDWAR_SOV_she_iron_shurik:0 "Iron Shurik"
 COLDWAR_SOV_she_iron_shurik_desc:0 "Alexander Shelepin, known as Iron Shurik, has led the Komsomol, the KGB and the Committee of Party-State Control. Brezhnev pushed him aside into the trade unions, but now the former Chekist stands at the head of the Party. He promises to restore order, discipline and honesty to a system grown complacent, and the comfortable nomenklatura has every reason to fear him."
 COLDWAR_SOV_she_the_komsomoltsy:0 "The Komsomoltsy"
 COLDWAR_SOV_she_the_komsomoltsy_desc:0 "Shelepin's power has always rested on a network of former Komsomol leaders: Nikolai Yegorychev of the Moscow party organisation, Nikolai Mesyatsev of state television and Vadim Tikunov of the police ministry. Brezhnev has scattered them to embassies and minor posts. Recalling the Komsomoltsy to Moscow gives the new General Secretary loyal men in key positions, but the established cadres see a rival clan taking their places."
 COLDWAR_SOV_mod_decryption_factor_tt:0 "$MODIFIER_DECRYPTION_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SOV_she_semichastny_returns:0 "Semichastny Returns"
 COLDWAR_SOV_she_semichastny_returns_desc:0 "Vladimir Semichastny succeeded Shelepin as chairman of the KGB in 1961 and lost the post in 1967 after Stalin's daughter defected to the West. Since then he has been sitting in Kiev as a deputy premier of Ukraine. Bringing him back to Moscow would place a trusted friend over the security organs and sharpen their fight against foreign subversion."
 COLDWAR_SOV_she_the_trade_union_base:0 "The Trade Union Base"
 COLDWAR_SOV_she_the_trade_union_base_desc:0 "Since 1967 Shelepin has chaired the All-Union Central Council of Trade Unions, a post meant to be a political dead end. Instead he has used it to build a following among the millions of workers who depend on the unions for holidays, housing and sanatoriums. As General Secretary he can turn that following into a pillar of his rule."
 COLDWAR_SOV_she_the_labour_question:0 "The Labour Question"
 COLDWAR_SOV_she_the_labour_question_desc:0 "The Soviet worker is guaranteed a job, but too often he arrives late, leaves early and drinks on shift. Shelepin must decide how to raise productivity: through strict discipline enforced from above, or by giving workers and their unions a greater share in running their factories and their lives. Either way, the relationship between the state and its working class will change."
 COLDWAR_SOV_she_labour_discipline:0 "Labour Discipline"
 COLDWAR_SOV_she_labour_discipline_desc:0 "Absenteeism, idleness and theft from the workplace cost the economy dearly every year. Shelepin intends to tighten labour legislation, tie bonuses to attendance and punish shirkers with transfers and fines. Factory directors welcome the firmer hand, but the trade unions he once led will not easily forgive their former chairman for turning against the workers' privileges."
 COLDWAR_SOV_mod_total_workforce_modifier_tt:0 "Total Workforce: $RIGHT|+=%1$"
 COLDWAR_SOV_she_the_absenteeism_raids:0 "The Absenteeism Raids"
 COLDWAR_SOV_she_the_absenteeism_raids_desc:0 "Militia patrols and volunteer druzhinniki descend on shops, cinemas, barbershops and bathhouses during working hours, demanding to know why able-bodied citizens are not at their posts. The raids are crude and unpopular, but they send a clear message that the working day belongs to the state. Productivity rises, though so does the bill for policing the streets."
 COLDWAR_SOV_mod_monthly_population_tt:0 "Monthly Population: $RIGHT|+=2$"
 COLDWAR_SOV_she_the_war_on_drunkenness:0 "The War on Drunkenness"
 COLDWAR_SOV_she_the_war_on_drunkenness_desc:0 "Vodka is the curse of the Soviet workplace, responsible for accidents, absenteeism and early deaths, yet it is also one of the state's most reliable sources of revenue. Shelepin is prepared to raise prices, limit sales hours and shut down the taverns near factories. Sober workers will produce more, but the budget will feel the loss and many citizens will resent the new restrictions."
 COLDWAR_SOV_she_workers_socialism:0 "Workers' Socialism"
 COLDWAR_SOV_she_workers_socialism_desc:0 "Shelepin's years at the head of the trade unions have taught him that workers want respect as well as wages. He proposes a socialism that places the working class at the centre: more say for labour collectives, a greater share of resources for social needs and an end to the arrogance of managers. The unions rally behind him, and talk of free workers' councils begins to spread."
 COLDWAR_SOV_she_the_union_councils:0 "The Union Councils"
 COLDWAR_SOV_she_the_union_councils_desc:0 "Factory trade union committees already manage holiday vouchers, kindergartens and housing queues, but they have little influence over production. Shelepin wants union councils at every level to take a real part in decisions on working conditions, safety and the distribution of social funds. Workers feel more secure and more valued, though the expanded welfare system will strain the budget."
 COLDWAR_SOV_she_the_workers_control:0 "Workers' Control Commissions"
 COLDWAR_SOV_she_the_workers_control_desc:0 "Lenin dreamed of workers' control over production, and Shelepin himself led the Committee of Party-State Control under Khrushchev. Reviving that spirit, commissions elected by labour collectives would inspect warehouses, audit accounts and expose managers who steal or falsify their reports. Corruption retreats, but the branch ministries resent ordinary workers poking into their affairs."
 COLDWAR_SOV_she_order_in_the_streets:0 "Order in the Streets"
 COLDWAR_SOV_she_order_in_the_streets_desc:0 "Hooliganism, petty crime and public drunkenness have grown in Soviet cities, and citizens complain that the militia does too little. Shelepin promises firm order: more patrols, more volunteer squads and swift punishment for offenders. A country that sees a policeman on every corner feels safer, even if the price of order is paid in watchfulness and fear."
 COLDWAR_SOV_she_the_war_on_corruption:0 "The War on Corruption"
 COLDWAR_SOV_she_the_war_on_corruption_desc:0 "Under Brezhnev's policy of stability of cadres, regional bosses have grown rich on bribes, blat and falsified plan reports. Shelepin intends to unleash the procurators and control commissions against them, from district committees to republican ministries. Honest citizens applaud, but the nomenklatura recognises the threat to its comfortable existence and closes ranks."
 COLDWAR_SOV_she_purge_the_brezhnevites:0 "Purge the Brezhnevites"
 COLDWAR_SOV_she_purge_the_brezhnevites_desc:0 "Brezhnev's men still occupy the Central Committee, the ministries and the republican party leaderships: the Dnepropetrovsk clan, the Moldavian circle and their many clients. Shelepin is ready to break them, dismissing the corrupt and retiring the old. Ending the stability of cadres will shake the apparatus to its core, but it will leave the General Secretary master of the Party."
 COLDWAR_SOV_she_youth_brigades:0 "Youth Brigades"
 COLDWAR_SOV_she_youth_brigades_desc:0 "The Komsomol has always sent its young volunteers to the great building sites of the Union, from the Virgin Lands to the Siberian hydroelectric dams. Shelepin, who once led the youth league, wants to expand these brigades into a permanent army of young enthusiasts. New towns and factories rise faster, and thousands of young men gain discipline before they enter the armed forces."
 COLDWAR_SOV_she_the_komsomol_economy:0 "The Komsomol Economy"
 COLDWAR_SOV_she_the_komsomol_economy_desc:0 "Projects like the Baikal-Amur Mainline, planned as a great Komsomol shock construction across the taiga, show what young volunteers can achieve. Shelepin wants the Komsomol to take on a far larger share of such infrastructure work, from roads and railways to power lines. The work is hard and the conditions harsh, but the country gains infrastructure at a fraction of the usual cost."
 COLDWAR_SOV_she_the_foreign_line:0 "East or West?"
 COLDWAR_SOV_she_the_foreign_line_desc:0 "Shelepin is a hardliner at home, but where should he turn abroad? Some believe he could heal the rift with Beijing, where he is remembered as a man with whom one can talk. Others expect him to confront the West directly, abandoning the compromises of detente. The General Secretary must choose which front matters most to the Union."
 COLDWAR_SOV_she_talk_to_beijing:0 "Talk to Beijing"
 COLDWAR_SOV_she_talk_to_beijing_desc:0 "In the Chinese capital, Shelepin is regarded as a disciplined revolutionary rather than a revisionist bureaucrat. He proposes direct talks between the two camps of the pure line, setting aside years of polemics and border clashes. Whether Mao's China accepts the offer is uncertain, but even an opening would transform the balance of power in Asia."
 COLDWAR_SOV_mod_planning_speed_tt:0 "Planning Speed: $RIGHT|+=%1$"
 COLDWAR_SOV_she_confront_the_west:0 "Confront the West"
 COLDWAR_SOV_she_confront_the_west_desc:0 "Detente, in Shelepin's eyes, has only allowed the imperialists to buy time and spread their influence into the socialist camp. He prefers a harder course: no concessions on human rights, no compromises over Berlin and a firm answer to every American provocation. The armed forces and the patriotic public welcome the new resolve, although the risk of confrontation grows."
 COLDWAR_SOV_she_the_final_question:0 "The Shape of Power"
 COLDWAR_SOV_she_the_final_question_desc:0 "Shelepin has reshaped the Party, the trade unions and the security organs, but one question remains: what form should his power take? He could rule openly as a leader standing above the Party, or he could bind his order to the collective leadership and prepare a successor who will carry it forward after him."
 COLDWAR_SOV_she_the_leader_state:0 "The Leader State"
 COLDWAR_SOV_she_the_leader_state_desc:0 "What if Shelepin decided that collective leadership was itself the problem? With the Komsomol Vanguard as the new ruling force, Iron Shurik would govern as a Vozhd, a leader whose authority rests on discipline, youth and loyalty rather than on the Central Committee. The old CPSU fades into the background, and the Soviet Union enters an era of personal rule."
 COLDWAR_SOV_she_collective_discipline:0 "Collective Discipline"
 COLDWAR_SOV_she_collective_discipline_desc:0 "Instead of ruling alone, Shelepin chooses to embed his reforms in the collective leadership of the Politburo. Discipline becomes the shared creed of the leadership, and Yuri Andropov, the most disciplined of them all, is named the man to carry the work forward. The Party regains its confidence, and the order Shelepin built is meant to outlast him."
 COLDWAR_SOV_she_the_iron_order:0 "The Iron Order"
 COLDWAR_SOV_she_the_iron_order_desc:0 "Shelepin's campaigns have transformed Soviet life. Factories run on schedule, officials fear the inspectors and the streets are quieter than they have been in years. The Iron Order brings stability and productivity to a Union that had grown lax, although scientists and artists complain that little room is left for creativity and free thought."
 COLDWAR_SOV_tt_gensec_and:0 "Yuri Andropov is General Secretary"
 COLDWAR_SOV_and_the_chekist_takes_power:0 "The Chekist Takes Power"
 COLDWAR_SOV_and_the_chekist_takes_power_desc:0 "For years Yuri Andropov has led the KGB, gathering information on every corner of Soviet society and on all of its failures. Now the former chairman of state security stands at the head of the Party. Austere, intelligent and well informed, he knows that the system is ailing and intends to cure it with discipline, honesty and carefully measured reform."
 COLDWAR_SOV_and_kgb_men_in_the_kremlin:0 "KGB Men in the Kremlin"
 COLDWAR_SOV_and_kgb_men_in_the_kremlin_desc:0 "Andropov trusts the men he worked with at the Lubyanka. Viktor Chebrikov takes over the KGB, Vladimir Kryuchkov runs foreign intelligence, and Heydar Aliyev, a KGB general who rose to lead Azerbaijan, is brought to Moscow. The security services gain unprecedented influence over the state, and their intelligence networks reach deeper into every institution of the Union."
 COLDWAR_SOV_and_the_young_reformers:0 "The Young Reformers"
 COLDWAR_SOV_and_the_young_reformers_desc:0 "Andropov surrounds himself with younger, energetic men: Mikhail Gorbachev, the party chief from Stavropol, Nikolai Ryzhkov, the industrial manager from Uralmash, and Yegor Ligachev, the incorruptible first secretary of Tomsk. They are loyal communists, but they share the conviction that the economy needs fundamental change. Their rise brings fresh ideas to the leadership and tilts the Politburo towards reform."
 COLDWAR_SOV_and_lessons_of_budapest:0 "Lessons of Budapest"
 COLDWAR_SOV_and_lessons_of_budapest_desc:0 "As Soviet ambassador in Budapest in 1956, Andropov watched a socialist state collapse within days and helped crush the uprising that followed. He learned that discontent must be addressed before it explodes, but he also saw how Janos Kadar later rebuilt Hungary with his goulash communism. The Hungarian experience offers lessons in both firmness and flexibility."
 COLDWAR_SOV_and_the_discipline_campaign:0 "The Discipline Campaign"
 COLDWAR_SOV_and_the_discipline_campaign_desc:0 "Andropov's first great initiative is a campaign against idleness, drunkenness and absenteeism. Militia patrols raid cinemas, shops and bathhouses during working hours, demanding papers from anyone who should be at work. Citizens grumble, but productivity rises, and the KGB gains new authority to investigate even the most powerful officials in the republics."
 COLDWAR_SOV_and_the_road:0 "Order or Reform?"
 COLDWAR_SOV_and_the_road_desc:0 "Andropov knows the Soviet system is in trouble, but his diagnosis allows two cures. He can combine discipline with cautious economic reform, giving managers more independence and the young reformers more influence. Or he can build a Chekist state in which security, control and ideological vigilance hold the Union together. The choice will shape the Soviet future for years to come."
 COLDWAR_SOV_and_order_and_reform:0 "Order and Reform"
 COLDWAR_SOV_and_order_and_reform_desc:0 "Discipline alone cannot save the Soviet economy. Andropov openly admits that the Party does not truly know the society it governs, and he commissions studies on how to give enterprises more independence and workers more responsibility. Order and reform must go hand in hand, and the reformers of the Politburo find themselves listened to at last."
 COLDWAR_SOV_and_the_large_scale_experiment:0 "The Large-Scale Economic Experiment"
 COLDWAR_SOV_and_the_large_scale_experiment_desc:0 "Andropov launches a bold test of economic reform. Enterprises in five industrial ministries, two all-Union and three republican, are allowed to plan more of their own output, keep part of their profits and reward workers for fulfilled delivery contracts. If the large-scale experiment succeeds, its methods could be extended across the entire Soviet economy."
 COLDWAR_SOV_and_the_economic_department:0 "Ryzhkov's Economic Department"
 COLDWAR_SOV_and_the_economic_department_desc:0 "The Central Committee has never had a department responsible for the economy as a whole, only branch departments that defend their own industries. Andropov creates one and places Nikolai Ryzhkov, former director of the Uralmash works, at its head. With a single team studying the economy, the Party can finally plan reforms rather than simply issue targets."
 COLDWAR_SOV_and_the_technology_gap:0 "The Technology Gap"
 COLDWAR_SOV_and_the_technology_gap_desc:0 "KGB reports leave no doubt: the Soviet Union is falling behind the West in computers and microelectronics, and the gap grows wider every year. Copying Western designs and smuggling components through third countries can only go so far. Andropov orders a crash programme to build a native computing industry before the technological lag becomes a strategic one."
 COLDWAR_SOV_and_the_chekist_state:0 "The Chekist State"
 COLDWAR_SOV_and_the_chekist_state_desc:0 "Andropov concludes that only the security organs remain uncorrupted enough to hold the Union together. The KGB receives wider powers over the economy, the Party and the media, and its officers are placed in key positions across the state. Order is restored and enemies are watched closely, but scientists and intellectuals sense the air growing heavier."
 COLDWAR_SOV_and_gorky_for_sakharov:0 "Gorky for Sakharov"
 COLDWAR_SOV_and_gorky_for_sakharov_desc:0 "Andrei Sakharov, father of the Soviet hydrogen bomb, has become the most prominent voice of the human rights movement. Rather than put him on trial, the KGB proposes to exile him to Gorky, a city closed to foreigners, where he can be watched and silenced. The dissident movement loses its figurehead, though Washington and the Western press will protest loudly."
 COLDWAR_SOV_and_the_kgb_economy:0 "The KGB Economy"
 COLDWAR_SOV_and_the_kgb_economy_desc:0 "Speculators, black-market traders and officials who live far beyond their salaries have built a shadow economy of their own. Andropov sets the KGB on their trail, from the trade networks of Moscow to the fish shops of the Okean affair. Unearned incomes are confiscated, and the nomenklatura learns that its privileges no longer guarantee protection."
 COLDWAR_SOV_and_the_informant_society:0 "The Informant Society"
 COLDWAR_SOV_and_the_informant_society_desc:0 "Every workplace, apartment block and research institute already has its watchers, but Andropov wants a denser network still. New informants are recruited among students, engineers and pensioners, and reports flow to the regional KGB directorates in unprecedented numbers. Foreign intelligence services find it harder to operate, but citizens learn to guard their words more carefully than ever."
 COLDWAR_SOV_and_the_cotton_affair_exposed:0 "The Cotton Affair Exposed"
 COLDWAR_SOV_and_the_cotton_affair_exposed_desc:0 "For years the Uzbek SSR has reported cotton harvests that never existed, and Moscow has paid enormous sums for phantom fibre. Under Sharaf Rashidov, the republic's leaders built a vast system of bribery and falsified reports. Andropov sends investigators to Tashkent to expose the pripiski, punish the guilty and remind every republic that the centre is watching."
 COLDWAR_SOV_and_the_shchelokov_purge:0 "The Shchelokov Purge"
 COLDWAR_SOV_and_the_shchelokov_purge_desc:0 "Nikolai Shchelokov, Brezhnev's old friend and Minister of Internal Affairs since the late 1960s, has turned the militia into his personal domain, riddled with corruption and luxury. Andropov removes him and sends KGB officers to purge the ministry from top to bottom. The militia becomes cleaner and cheaper to run, while Brezhnev's old circle loses one of its most powerful members."
 COLDWAR_SOV_and_a_way_out_of_afghanistan:0 "A Way Out"
 COLDWAR_SOV_and_a_way_out_of_afghanistan_desc:0 "Andropov knows how easily a limited intervention becomes an endless war. Wherever Soviet soldiers are bogged down, as they could be in the mountains of Afghanistan, he prefers a dignified way out through negotiations rather than further escalation. Easing such burdens would calm tensions with the West and let the Union concentrate on its problems at home."
 COLDWAR_SOV_and_talks_with_beijing:0 "Talks with Beijing"
 COLDWAR_SOV_and_talks_with_beijing_desc:0 "Years of Sino-Soviet hostility have brought nothing but border garrisons and wasted resources. Andropov proposes to resume regular consultations with Beijing at the level of deputy foreign ministers, without preconditions. The Chinese leadership will decide whether to respond, but any thaw would ease the burden on the Far East and weaken American influence in Asia."
 COLDWAR_SOV_and_the_succession:0 "Andropov's Kidneys"
 COLDWAR_SOV_and_the_succession_desc:0 "Andropov's kidneys are failing, and he spends more and more time connected to a dialysis machine at the Kremlin hospital in Kuntsevo. The Politburo receives his instructions in writing while rumours spread through Moscow. Before his illness ends his rule, the General Secretary must decide who will carry his work forward: a reformer, a guardian of continuity or a fellow Chekist."
 COLDWAR_SOV_and_heir_gorbachev:0 "Heir: Mikhail Gorbachev"
 COLDWAR_SOV_and_heir_gorbachev_desc:0 "Mikhail Gorbachev, the energetic party leader from Stavropol, is Andropov's protege and the youngest man in the leadership. Open to new ideas, he has already taken charge of agriculture and much of the economic agenda. Naming him heir tells the Party that the reforms will continue, and it alarms the old guard who would prefer a calmer succession."
 COLDWAR_SOV_and_heir_chernenko:0 "Heir: Chernenko"
 COLDWAR_SOV_and_heir_chernenko_desc:0 "The elderly members of the Politburo do not want another reformer, and they rally around Konstantin Chernenko, Brezhnev's faithful chief of staff. His health is poor and his ideas are few, but he guarantees that no one will lose his post. Choosing him satisfies the cadres and preserves stability, even if the reforms quietly lose their momentum."
 COLDWAR_SOV_and_heir_aliyev:0 "Heir: The Chekist from Baku"
 COLDWAR_SOV_and_heir_aliyev_desc:0 "Heydar Aliyev rose through the ranks of the Azerbaijani KGB, has led his republic's Communist Party since 1969 and is Andropov's choice for First Deputy Premier in Moscow. As a Muslim from the Caucasus at the summit of Soviet power, he would show the peoples of the Union that the Kremlin belongs to them all. To the KGB, he is simply one of their own."
 COLDWAR_SOV_and_the_disciplined_union:0 "The Disciplined Union"
 COLDWAR_SOV_and_the_disciplined_union_desc:0 "Andropov's campaigns have left their mark. Officials think twice before taking bribes, workers arrive on time, and the Party has regained some of the authority it lost in the years of stagnation. The Disciplined Union is not yet a reformed one, but it has gained the strength and confidence to face the challenges of the coming decade."
 COLDWAR_SOV_tt_gensec_gre:0 "Andrei Grechko is General Secretary"
 COLDWAR_SOV_mod_army_org_factor_tt:0 "Division Organisation: $RIGHT|+=%1$"
 COLDWAR_SOV_gre_the_marshals_hour:0 "The Marshal's Hour"
 COLDWAR_SOV_gre_the_marshals_hour_desc:0 "Since Marshal Zhukov was ousted in 1957, the army has been kept away from the summit of power. Now Marshal Andrei Grechko, Minister of Defence and a veteran of the battles for the Caucasus and Kiev, stands at the head of the Party. There is no coup and no junta, only a soldier in the General Secretary's chair, and the armed forces finally have a voice at the top."
 COLDWAR_SOV_mod_max_planning_factor_tt:0 "Maximum Planning: $RIGHT|+=%1$"
 COLDWAR_SOV_gre_the_general_staff_in_the_politburo:0 "The General Staff in the Politburo"
 COLDWAR_SOV_gre_the_general_staff_in_the_politburo_desc:0 "The Chief of the General Staff has always carried out the decisions of the political leadership without taking part in them. Grechko gives Viktor Kulikov, and after him Nikolai Ogarkov, a regular voice in the Politburo's deliberations. Military planning becomes faster and better coordinated with the needs of the state, and the General Staff becomes the brain of the Union as well as of the army."
 COLDWAR_SOV_gre_yepishevs_political_directorate:0 "Yepishev's Political Directorate"
 COLDWAR_SOV_gre_yepishevs_political_directorate_desc:0 "General Alexei Yepishev heads the Main Political Directorate of the Soviet Army and Navy, responsible for the ideological education of every soldier and sailor. His political officers are both a link between the Party and the barracks and a guarantee of loyalty. Strengthening the directorate raises the morale of the troops and reassures the Party cadres that the army remains firmly under their control."
 COLDWAR_SOV_gre_the_defence_council:0 "The Defence Council"
 COLDWAR_SOV_gre_the_defence_council_desc:0 "The Defence Council of the USSR brings together the General Secretary, the Minister of Defence, the Chief of the General Staff and the leaders of the defence industry. Under Grechko it becomes the true centre of power, deciding not only military questions but also economic priorities. Decisions are swift and clear, though the civilians of the Politburo feel increasingly sidelined."
 COLDWAR_SOV_gre_the_doctrine:0 "Mass Army or Nuclear Shield?"
 COLDWAR_SOV_gre_the_doctrine_desc:0 "Soviet military thinkers have long debated whether the next war will be decided by armoured masses or by strategic missiles. Grechko himself trusts in tank armies and trained reserves, but the rocket designers and the Strategic Rocket Forces argue that nuclear power is the only true guarantee of security. The General Secretary must decide where the Union's resources will go."
 COLDWAR_SOV_gre_the_mass_army:0 "The Mass Army"
 COLDWAR_SOV_gre_the_mass_army_desc:0 "Grechko's war was won by millions of soldiers and tens of thousands of tanks, and he sees no reason to change the formula. Conscription is enforced more strictly, reserve divisions are filled and training for reservists is expanded. The Soviet Army becomes larger and harder to defeat in defence, although the economy loses more young men to the barracks."
 COLDWAR_SOV_gre_the_tank_armies_of_the_west:0 "The Tank Armies of the West"
 COLDWAR_SOV_gre_the_tank_armies_of_the_west_desc:0 "The Group of Soviet Forces in Germany is the spearhead of the Warsaw Pact, with five armies poised along the inner German border. Grechko wants them equipped with the newest tanks, the T-64 and the coming T-72, and trained for a rapid thrust to the Rhine. NATO planners watch nervously as the breakthrough power of Soviet armour grows."
 COLDWAR_SOV_mod_mobilization_speed_tt:0 "$MODIFIER_MOBILIZATION_SPEED$: $RIGHT|+=%1$"
 COLDWAR_SOV_gre_mobilisation_reserves:0 "Mobilisation Reserves"
 COLDWAR_SOV_gre_mobilisation_reserves_desc:0 "In the event of war, the Soviet Union must be able to call millions of reservists to the colours within days. Grechko orders mobilisation plans revised, depots stocked and military commissariats modernised in every district. The effort fills warehouses with equipment and supplies that could otherwise reach the shops, but the Union will never again be caught unprepared as in 1941."
 COLDWAR_SOV_mod_enemy_justify_war_goal_time_tt:0 "Enemy Justify Wargoal Time: $RIGHT|+=%1$"
 COLDWAR_SOV_mod_rocket_attack_factor_tt:0 "$MODIFIER_ROCKET_ATTACK_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SOV_gre_the_nuclear_shield:0 "The Nuclear Shield"
 COLDWAR_SOV_gre_the_nuclear_shield_desc:0 "Marshal Grechko is persuaded that the decisive weapon of the age is the intercontinental ballistic missile. New generations of heavy rockets, among them the R-36M known in the West as the SS-18, will give the Strategic Rocket Forces the power to deter any aggressor. Behind such a shield, Soviet diplomats can negotiate from a position of strength."
 COLDWAR_SOV_gre_the_strategic_triad:0 "The Strategic Triad"
 COLDWAR_SOV_gre_the_strategic_triad_desc:0 "Missiles in silos can be targeted, but submarines hiding in the Barents Sea and bombers on airborne alert are far harder to destroy. Grechko orders the development of all three legs of the strategic triad, from new Delta-class missile submarines to modern long-range bombers. The investment is enormous, and Washington will see it as another escalation of the arms race."
 COLDWAR_SOV_gre_against_salt:0 "Against SALT"
 COLDWAR_SOV_gre_against_salt_desc:0 "The SALT negotiations promise to limit the strategic arsenals of both superpowers, but many officers believe they would freeze Soviet missile forces just as they are catching up. Grechko lends his weight to the sceptics in the Politburo and the defence industry, arguing that no agreement can replace real military strength. Detente cools, and the arms race continues unchecked."
 COLDWAR_SOV_mod_army_core_defence_factor_tt:0 "Defence on Core Territory: $RIGHT|+=%1$"
 COLDWAR_SOV_gre_the_far_eastern_command:0 "The Far Eastern Command"
 COLDWAR_SOV_gre_the_far_eastern_command_desc:0 "Since the clashes with China in 1969, dozens of Soviet divisions have been stationed along the Amur and the Ussuri, yet coordinating them from Moscow is slow and inefficient. Grechko proposes a separate high command for the Far East, headquartered in Ulan-Ude, with its own air bases and reserves, to defend Soviet territory against any threat from China or Japan."
 COLDWAR_SOV_mod_training_time_factor_tt:0 "Training Time: $RIGHT|-=%1$"
 COLDWAR_SOV_mod_experience_gain_army_tt:0 "Army Experience Gain: $RIGHT|+=%1$"
 COLDWAR_SOV_gre_suvorov_schools:0 "Suvorov and Nakhimov Schools"
 COLDWAR_SOV_gre_suvorov_schools_desc:0 "Founded during the Great Patriotic War to educate the orphans of fallen soldiers, the Suvorov and Nakhimov schools have become the cradle of the Soviet officer corps. Grechko wants more of them, with better teachers and stricter standards, to produce cadets who are ready to command. The armed forces will gain officers who have worn the uniform since childhood."
 COLDWAR_SOV_gre_the_school_of_the_nation:0 "The Army as the School of the Nation"
 COLDWAR_SOV_gre_the_school_of_the_nation_desc:0 "Every year young men from all fifteen republics enter the Soviet Army, many of them speaking little Russian. Grechko sees military service as the great melting pot of the Union, where Uzbeks, Lithuanians and Russians learn a common language of command and a shared Soviet identity. The barracks become a school of friendship between peoples and of loyalty to the Union."
 COLDWAR_SOV_mod_international_market_income_modifier_tt:0 "Arms Sales Income: $RIGHT|+=%1$"
 COLDWAR_SOV_gre_arms_for_allies:0 "Arms for Allies"
 COLDWAR_SOV_gre_arms_for_allies_desc:0 "Soviet weapons have become the most effective form of diplomacy, from Kalashnikovs in Africa to MiG fighters in the Middle East. Grechko wants arms exports organised on a larger scale, with long-term credits for friendly regimes and cheaper aid packages for liberation movements. The defence industry gains new markets, and every rifle shipped abroad buys influence for Moscow."
 COLDWAR_SOV_mod_mdcw_cw_assistance_capacity_tt:0 "Assistance Programme Capacity (Cold War): $RIGHT|+=%1$"
 COLDWAR_SOV_gre_the_military_advisers:0 "The Military Advisers"
 COLDWAR_SOV_gre_the_military_advisers_desc:0 "In Egypt, thousands of Soviet advisers and air-defence crews helped rebuild the army after the defeat of 1967. Grechko proposes to expand such missions in Egypt and extend them to Syria and Iraq, offering training, staff work and modern doctrine to friendly armies. It is up to Cairo, Damascus and Baghdad to accept, but every adviser they welcome draws them closer to Moscow."
 COLDWAR_SOV_gre_the_heir_of_the_marshal:0 "After the Marshal"
 COLDWAR_SOV_gre_the_heir_of_the_marshal_desc:0 "Grechko has passed seventy, and even a marshal's health cannot last forever. The question of succession weighs on the leadership: should another man close to the armed forces continue the course, or should power return to the civilian Party apparatus? The decision will determine whether the army's hour becomes an era or merely an episode."
 COLDWAR_SOV_gre_heir_ustinov:0 "Heir: Ustinov"
 COLDWAR_SOV_gre_heir_ustinov_desc:0 "Dmitry Ustinov has directed the Soviet defence industry since he became People's Commissar for Armaments in 1941. Though not a career soldier, he knows every design bureau and every factory of the military-industrial complex. Naming him heir assures the defence industry that its privileged position will survive the Marshal, and that the armed forces will keep receiving the best the Union can produce."
 COLDWAR_SOV_gre_return_to_civilian_rule:0 "Return to Civilian Rule"
 COLDWAR_SOV_gre_return_to_civilian_rule_desc:0 "The Marshal's leadership has strengthened the armed forces, but many in the Party fear that the generals are growing too powerful. Grechko himself accepts that the army should step back once his task is done. Konstantin Chernenko, a quiet man of the Party apparatus, is named heir, reassuring the cadres that the Party will once again command the gun."
 COLDWAR_SOV_gre_the_council_of_marshals:0 "The Council of Marshals"
 COLDWAR_SOV_gre_the_council_of_marshals_desc:0 "What if the marshals decided that the Party had failed the Union? The Council of Marshals takes power, stripping the Central Committee of its authority and placing the country under the direct rule of the High Command. Grechko becomes head of a military government, promising order and strength. Many citizens accept the change in silence, but the shock to the old system is immense."
 COLDWAR_SOV_gre_the_garrison_party:0 "The Garrison Party"
 COLDWAR_SOV_gre_the_garrison_party_desc:0 "Marshal Andrei Grechko has run the Ministry of Defence since 1967, and in his hands the party itself begins to resemble a garrison. Officers sit beside obkom secretaries, military-patriotic education reaches every school and factory, and the defence of the motherland becomes the measure of every policy. Critics whisper of a state run from Arbat Square, but the Marshal answers that a besieged camp must be commanded, not debated."
 COLDWAR_SOV_tt_gensec_ust:0 "Dmitry Ustinov is General Secretary"
 COLDWAR_SOV_ust_the_armourer:0 "The Armourer"
 COLDWAR_SOV_ust_the_armourer_desc:0 "Dmitry Ustinov became People's Commissar of Armaments in June 1941, at just thirty-two, and has managed Soviet weapons production ever since. Now the man who armed the Red Army against Hitler leads the party itself. His course is plain: the defence industry is the backbone of the state, and everything else, from the plan to the consumer, must learn to live alongside it."
 COLDWAR_SOV_ust_the_military_industrial_commission:0 "Smirnov's Commission"
 COLDWAR_SOV_ust_the_military_industrial_commission_desc:0 "Leonid Smirnov has chaired the Military-Industrial Commission of the Council of Ministers since 1963, quietly coordinating ministries, design bureaus and factories across the Union. Under a General Secretary who built this system himself, the commission gains new weight. Its decisions now bind Gosplan as well as the defence ministries, and new armaments plants rise wherever it points on the map."
 COLDWAR_SOV_ust_the_design_bureaus:0 "The Design Bureaus"
 COLDWAR_SOV_ust_the_design_bureaus_desc:0 "The names of Tupolev, Sukhoi, Mikoyan, Chelomei and Yangel carry more prestige than those of most ministers. Their design bureaus compete fiercely for state orders, test sites and talent, and every new prototype is a matter of national pride. By granting them new experimental facilities and shielding them from the worst of the bureaucracy, the leadership hopes to keep Soviet engineering a generation ahead of the West."
 COLDWAR_SOV_ust_the_nine_ministries:0 "The Nine Ministries"
 COLDWAR_SOV_ust_the_nine_ministries_desc:0 "Nine all-Union ministries, from Medium Machine Building to Aviation, Shipbuilding and the Radio Industry, form the industrial heart of Soviet defence. Insiders simply call them the Nine, and their true budgets are among the best-kept secrets of the state. Binding them more tightly together promises cheaper weapons and shorter supply chains, at the price of an ever larger and more privileged apparatus."
 COLDWAR_SOV_ust_quality_or_quantity:0 "Quality or Quantity?"
 COLDWAR_SOV_ust_quality_or_quantity_desc:0 "The Soviet armed forces have always relied on numbers, but the West is pulling ahead in electronics, precision and engines. The Armourer must decide where the defence industry's resources go next. One path pours money into cutting-edge research and expensive new systems, while the other keeps the assembly lines of Nizhny Tagil and Kharkov running at full speed in the belief that mass will tell in the end."
 COLDWAR_SOV_ust_quality:0 "Quality"
 COLDWAR_SOV_ust_quality_desc:0 "A single modern weapon, the argument goes, is worth a dozen obsolete ones. Research institutes receive priority funding, tolerances are tightened and new designs are pushed into service even when they cost far more per unit. The army will field less hardware than its planners might wish, but every tank, aircraft and missile it does field should match or surpass its NATO counterpart."
 COLDWAR_SOV_ust_the_fourth_generation:0 "The Fourth Generation"
 COLDWAR_SOV_ust_the_fourth_generation_desc:0 "American F-15s and F-16s are entering service, and the Soviet air forces need an answer. The Mikoyan and Sukhoi bureaus are tasked with a new generation of light and heavy fighters, built around powerful turbofans, pulse-Doppler radar and exceptional agility. The future MiG-29 and Su-27 will be costly and difficult to build, but they are meant to win back the skies over Central Europe."
 COLDWAR_SOV_mod_army_speed_factor_tt:0 "Division Speed: $RIGHT|+=%1$"
 COLDWAR_SOV_ust_t80_and_the_gas_turbine:0 "T-80 and the Gas Turbine"
 COLDWAR_SOV_ust_t80_and_the_gas_turbine_desc:0 "Ustinov has long championed a tank driven by a gas turbine rather than a diesel. The result, developed in Leningrad and adopted in 1976 as the T-80, is fast, powerful and thirsty, and far more expensive than the T-72 rolling off the lines in the Urals. Backing it fully means accepting that cost for the sake of a spearhead able to race across the North German Plain."
 COLDWAR_SOV_ust_quantity:0 "Quantity"
 COLDWAR_SOV_ust_quantity_desc:0 "Wars, the Marshal's generation learned in 1941, are won by the side that can still deliver tanks when the first battles are over. New armaments plants are built, proven designs are kept in production instead of being replaced and unit costs are driven down relentlessly. The Soviet Army will field more divisions, more guns and more armour than any opponent can hope to destroy."
 COLDWAR_SOV_mod_line_change_production_efficiency_factor_tt:0 "$MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SOV_ust_standardise_the_arsenal:0 "Standardise the Arsenal"
 COLDWAR_SOV_ust_standardise_the_arsenal_desc:0 "Dozens of overlapping designs strain both the supply system and the factories. By standardising calibres, engines, chassis and components across the services, planners hope to cut costs, simplify training and keep production lines running smoothly when one model gives way to the next. It is the unglamorous side of armament, but the generals of 1941 remember well what chaos in the arsenal can cost."
 COLDWAR_SOV_ust_the_stockpiles:0 "The Stockpiles"
 COLDWAR_SOV_ust_the_stockpiles_desc:0 "Across Russia and the Urals lie vast hidden depots of fuel, ammunition, spare parts and mothballed equipment, held by the State Reserve for the day of mobilisation. Expanding them ties up resources the civilian economy badly needs, but ensures that a Soviet Army cut off from its factories could still fight for months. In a long war, what has already been stored may decide the outcome."
 COLDWAR_SOV_ust_the_rocket_men:0 "The Rocket Men"
 COLDWAR_SOV_ust_the_rocket_men_desc:0 "Valentin Glushko, Vladimir Chelomei and Vladimir Utkin lead the great rocket design bureaus, and their rivalries are as legendary as their engines. Each wants priority for his own missiles and launchers, from heavy silo-based ICBMs to the Proton. Ustinov knows all of them personally and intends to harness their competition, giving the Strategic Rocket Forces and the space programme the very best they can build."
 COLDWAR_SOV_ust_ss20_deployment:0 "SS-20 Deployment"
 COLDWAR_SOV_ust_ss20_deployment_desc:0 "The new RSD-10 Pioneer, known in the West as the SS-20, is a mobile intermediate-range missile with three warheads, able to strike any target in Western Europe within minutes. Deploying it in numbers would modernise the Soviet theatre arsenal at a stroke. It would also alarm Bonn and the other NATO capitals, and may well provoke the Americans into stationing new missiles of their own on European soil."
 COLDWAR_SOV_ust_energia_buran:0 "Energia-Buran"
 COLDWAR_SOV_ust_energia_buran_desc:0 "The American Space Shuttle programme has convinced the military that the United States intends to dominate orbit. Ustinov backs a Soviet answer on a grand scale: the super-heavy Energia rocket and the reusable Buran orbiter, developed under Glushko at NPO Energia. The project will swallow billions of rubles and years of effort, but it promises to keep Soviet spaceflight equal to anything launched from Cape Canaveral."
 COLDWAR_SOV_ust_the_closed_cities:0 "The Closed Cities"
 COLDWAR_SOV_ust_the_closed_cities_desc:0 "Arzamas-16, Chelyabinsk-65 and Krasnoyarsk-26 appear on no public map. In these closed cities, scientists and engineers live behind fences and checkpoints, better supplied than most Soviet citizens, and work on nuclear weapons and the materials to build them. Expanding this secret archipelago brings new laboratories and reactors into being and keeps the country's best minds devoted to the needs of defence."
 COLDWAR_SOV_ust_dual_use_lines:0 "Dual-Use Lines"
 COLDWAR_SOV_ust_dual_use_lines_desc:0 "The defence ministries already turn out refrigerators, televisions and washing machines alongside missiles and tanks, and for most Soviet consumers these goods are the only face of the military-industrial complex they will ever see. Formalising such dual-use lines brings new civilian capacity to the armaments plants. Quality remains uneven and the military always comes first, but households from Minsk to Vladivostok will notice the difference."
 COLDWAR_SOV_ust_the_foreign_line:0 "The Afghan Question"
 COLDWAR_SOV_ust_the_foreign_line_desc:0 "Since the April Revolution of 1978, the communist government in Kabul has torn itself apart while rebellion spreads across the Afghan countryside. Its leaders beg Moscow for help, and the Politburo must decide how far to go. Some argue that only Soviet troops can save the revolution, while others warn that the army would be walking into a war no outside power has ever won."
 COLDWAR_SOV_ust_the_hawk:0 "The Hawk of Kabul"
 COLDWAR_SOV_ust_the_hawk_desc:0 "In December 1979, Ustinov stood alongside Andropov and Gromyko in pressing for intervention, and now the decision is his alone. The 40th Army crosses the Amu Darya to secure Kabul and the main cities, while the General Staff promises a short campaign. The officers who return will be battle-hardened, but the West sees only Soviet aggression, and the mountains will not be pacified quickly."
 COLDWAR_SOV_ust_arms_not_soldiers:0 "Arms, Not Soldiers"
 COLDWAR_SOV_ust_arms_not_soldiers_desc:0 "Instead of sending Soviet divisions into Afghanistan, Moscow sends weapons, advisers and money. The government in Kabul must fight its own war, backed by Soviet helicopters and armour but not by Soviet conscripts. The same approach is extended to friendly regimes from Angola to Ethiopia and Syria, turning the output of the defence industry into influence and hard currency without the risk of a quagmire."
 COLDWAR_SOV_ust_the_heir:0 "The Armourer's Heir"
 COLDWAR_SOV_ust_the_heir_desc:0 "Ustinov is in his seventies, and even the man who built the Soviet arsenal cannot outrun time. Before he goes, he must decide who will inherit not only the party but also the defence complex he has shaped for four decades. The candidates represent two very different futures: the disciplined technocracy of Leningrad, or the energetic new generation from Stavropol."
 COLDWAR_SOV_ust_heir_romanov:0 "Heir: Romanov"
 COLDWAR_SOV_ust_heir_romanov_desc:0 "Grigory Romanov, the hard-driving first secretary of Leningrad, shares the Armourer's faith in industrial discipline and military strength. His city builds tanks, warships and electronics, and he has never shown the slightest sympathy for reformist experiments. By naming him successor, Ustinov ensures that the defence complex keeps its privileged place and that the course set in the Kremlin continues unbroken."
 COLDWAR_SOV_ust_heir_gorbachev:0 "Heir: Gorbachev"
 COLDWAR_SOV_ust_heir_gorbachev_desc:0 "Mikhail Gorbachev, the young agriculture secretary from Stavropol, is energetic, educated and popular with the reform-minded members of the Politburo. Choosing him is a gamble for the old Marshal, since Gorbachev talks of efficiency and modernisation rather than more tanks. Yet Ustinov may conclude that only a younger man can keep the economy strong enough to carry the weight of Soviet defence."
 COLDWAR_SOV_ust_the_arsenal_of_socialism:0 "The Arsenal of Socialism"
 COLDWAR_SOV_ust_the_arsenal_of_socialism_desc:0 "Under Ustinov, the Soviet Union becomes the arsenal of world socialism. Factories from the Urals to the Volga turn out weapons for the Warsaw Pact and for allies on three continents, design bureaus race to field ever better systems and the whole economy bends to the needs of defence. Whether the people can carry this burden indefinitely is a question for another day."
 COLDWAR_SOV_tt_gensec_gro:0 "Grigory Romanov is General Secretary"
 COLDWAR_SOV_gro_the_leningrad_order:0 "The Leningrad Order"
 COLDWAR_SOV_gro_the_leningrad_order_desc:0 "Grigory Romanov has ruled Leningrad since 1970 with an iron grip and a manager's eye for numbers. Now he brings the Leningrad model to the whole Union: strict discipline in the party, close ties between science and industry and zero tolerance for ideological deviation. The order that made the city on the Neva a showcase of efficiency is to be applied from Kaliningrad to Kamchatka."
 COLDWAR_SOV_gro_the_leningrad_cadres:0 "The Leningrad Cadres"
 COLDWAR_SOV_gro_the_leningrad_cadres_desc:0 "Every General Secretary brings his own people to Moscow, and Romanov is no exception. Trusted secretaries and managers from the Leningrad obkom move into key departments of the Central Committee and the ministries, displacing the old networks of the Brezhnev era. The newcomers are capable and loyal, but the established nomenklatura resents losing its comfortable positions to the men from the north."
 COLDWAR_SOV_gro_the_kirov_works:0 "The Kirov Works"
 COLDWAR_SOV_gro_the_kirov_works_desc:0 "The Kirov Works, LOMO and the Admiralty Shipyards form Leningrad's belt of heavy and defence industry, building tanks, optics and warships. Romanov knows these plants intimately and considers them the pride of the Soviet working class. Expanding their capacity and channelling new orders their way strengthens the defence complex and binds its managers closely to the new General Secretary."
 COLDWAR_SOV_gro_science_production_associations:0 "Science-Production Associations"
 COLDWAR_SOV_gro_science_production_associations_desc:0 "Leningrad pioneered the science-production association, merging research institutes, design bureaus and factories into a single enterprise so that new ideas reach the assembly line in years rather than decades. Elektrosila, LOMO and Svetlana became models of the approach. Extending it across the Union promises to close the gap between Soviet science and Soviet industry, one of the planned economy's most stubborn weaknesses."
 COLDWAR_SOV_gro_the_path:0 "Technocracy or Iron Discipline?"
 COLDWAR_SOV_gro_the_path_desc:0 "Romanov's Leningrad was known for two things: modern management and an unforgiving hand. As General Secretary, he must choose which of the two will define his rule. He can bet on engineers, computers and automation to make the economy work, or on discipline, ideological vigilance and fear to make people work harder within the existing system."
 COLDWAR_SOV_gro_hardline_technocracy:0 "Hardline Technocracy"
 COLDWAR_SOV_gro_hardline_technocracy_desc:0 "The Soviet Union will be modernised, but strictly on the party's terms. Engineers and economists receive real authority, scientific management and computerised planning spread from the ministries to the shop floor, and productivity becomes the measure of every official. There is no room for liberal experiments or market reforms, for technocracy here means efficiency under firm party control, not freedom."
 COLDWAR_SOV_gro_the_intensive_economy:0 "The Intensive Economy"
 COLDWAR_SOV_gro_the_intensive_economy_desc:0 "For decades, Soviet growth came from adding more workers, more land and more raw materials, and those reserves are running out. The intensive economy aims to grow instead through productivity, better technology and smarter use of existing capacity, as Leningrad's own experiments suggested. Planners will be judged on efficiency rather than gross output, a quiet revolution in the culture of Gosplan itself."
 COLDWAR_SOV_gro_automated_plants:0 "Automated Plants"
 COLDWAR_SOV_gro_automated_plants_desc:0 "Leningrad's engineers dream of factories run by machines: numerically controlled machine tools, industrial robots and computerised control systems that never drink, never shirk and never miss a shift. Building the microelectronics plants to make this possible is expensive, and Soviet chips still lag behind Western ones, but automation offers a way to raise output without finding workers the country no longer has."
 COLDWAR_SOV_gro_iron_discipline:0 "Iron Discipline"
 COLDWAR_SOV_gro_iron_discipline_desc:0 "Absenteeism, drinking on the job and falsified reports have become a way of life across the Union. Romanov's answer is discipline: inspections, sanctions, dismissals and the full weight of the KGB behind the party's demands. Republic leaders who inflate their figures will now pay for it, and while the country may grumble, the General Secretary is convinced that order must come before everything else."
 COLDWAR_SOV_gro_no_rock_no_jeans:0 "No Rock, No Jeans"
 COLDWAR_SOV_gro_no_rock_no_jeans_desc:0 "Romanov's Leningrad was notorious for its hostility to the underground rock scene, Western fashion and anything else that smelled of bourgeois decadence. Now the same severity becomes national policy. Unofficial concerts are broken up, black-market jeans are confiscated and youth culture is steered back toward the Komsomol, and while foreign influence weakens, young people and dissidents alike take note."
 COLDWAR_SOV_gro_the_purge_of_the_lazy:0 "The Purge of the Lazy"
 COLDWAR_SOV_gro_the_purge_of_the_lazy_desc:0 "Too many ministers, directors and obkom secretaries have grown complacent during the long years of stability of cadres. Romanov intends to change that. Officials who miss their targets or live off connections are removed regardless of their patrons and replaced with younger, more demanding managers, and the nomenklatura learns that its positions are no longer guaranteed for life."
 COLDWAR_SOV_mod_navy_org_factor_tt:0 "Naval Organisation: $RIGHT|+=%1$"
 COLDWAR_SOV_mod_navy_max_range_factor_tt:0 "Naval Range: $RIGHT|+=%1$"
 COLDWAR_SOV_gro_the_naval_capital:0 "The Naval Capital"
 COLDWAR_SOV_gro_the_naval_capital_desc:0 "Leningrad has been Russia's naval capital since Peter the Great, and its yards still build the most advanced ships of the Soviet Navy, including the nuclear-powered Kirov-class battlecruisers taking shape at the Baltic Shipyard. Romanov sees the fleet as a symbol of the Union's global reach and pours resources into the shipyards on the Neva, giving Admiral Gorshkov the ocean-going navy he has long demanded."
 COLDWAR_SOV_gro_no_concessions:0 "No Concessions"
 COLDWAR_SOV_gro_no_concessions_desc:0 "Romanov does not believe in detente. To him, every concession at the negotiating table is a sign of weakness that the imperialists will exploit. Soviet diplomats are instructed to hold firm on every issue, from arms control to human rights, and the military is assured that no agreement will cut its strength. Even fraternal allies hoping for softer trade terms find Moscow unbending."
 COLDWAR_SOV_gro_the_baltic_fortress:0 "The Baltic Fortress"
 COLDWAR_SOV_gro_the_baltic_fortress_desc:0 "The Leningrad Military District and the Baltic republics guard the Union's northwestern flank against NATO. Romanov turns the region into a fortress, with new garrisons, fortified coastlines and reinforced border troops. A hard line toward Estonian, Latvian and Lithuanian national sentiment keeps the republics in check ideologically, but deepens a quiet resentment that Moscow would be unwise to ignore."
 COLDWAR_SOV_gro_the_heir:0 "Romanov's Line"
 COLDWAR_SOV_gro_the_heir_desc:0 "Romanov is younger than most of the Politburo, but even a vigorous leader must think about who will follow him. He can gather all power into his own hands and trust that his system will outlive him, or entrust the succession to the defence-industrial technocrats who helped him rise. Either way, the decision will shape the Soviet Union for a generation."
 COLDWAR_SOV_gro_the_strong_hand:0 "The Strong Hand"
 COLDWAR_SOV_gro_the_strong_hand_desc:0 "Romanov has no intention of being merely first among equals. He gathers the levers of power in his own office, overriding the collective leadership that has guided the party since Khrushchev's fall in 1964. Decisions are made faster and enforced more strictly, and those who hesitate are swept aside, for the Soviet Union has its strong hand again, for better or worse."
 COLDWAR_SOV_gro_the_technocrats_succession:0 "The Technocrats' Succession"
 COLDWAR_SOV_gro_the_technocrats_succession_desc:0 "Romanov chooses institutional continuity over personal rule. Dmitry Ustinov, the veteran master of the defence complex and his closest ally in the Politburo, is designated to take over should the General Secretary die or step down. The arrangement reassures the generals and the industrial ministries that the course of efficiency and military strength will survive any change at the top."
 COLDWAR_SOV_gro_the_ordered_union:0 "The Ordered Union"
 COLDWAR_SOV_gro_the_ordered_union_desc:0 "Under Romanov, the Soviet Union becomes a disciplined and well-managed machine. Plans are fulfilled honestly, factories modernise, scientists and engineers enjoy respect and the authority of the party goes unquestioned. It is a stern and colourless order with little room for dissent or experiment, but for the first time in years the Union seems to be moving with purpose rather than drifting."
 COLDWAR_SOV_tt_gensec_che:0 "Konstantin Chernenko is General Secretary"
 COLDWAR_SOV_che_the_apparatchik:0 "The Apparatchik"
 COLDWAR_SOV_che_the_apparatchik_desc:0 "Konstantin Chernenko spent his career not on the front lines of politics but behind them, managing paperwork, appointments and correspondence for Leonid Brezhnev. Now the consummate apparatchik leads the party. He offers no grand vision, only the reassurance that the system will go on functioning as it always has, and for a Politburo weary of upheaval that is exactly the point."
 COLDWAR_SOV_che_the_general_department:0 "The General Department"
 COLDWAR_SOV_che_the_general_department_desc:0 "Since 1965, Chernenko has headed the General Department of the Central Committee, the nerve centre through which every Politburo document, decree and secret file must pass. Its archives and procedures are his true power base. By streamlining the department and placing his own people at its desks, he controls what reaches the leadership and when."
 COLDWAR_SOV_che_letters_from_the_people:0 "Letters from the People"
 COLDWAR_SOV_che_letters_from_the_people_desc:0 "Every year, hundreds of thousands of Soviet citizens write to the Central Committee about housing, shortages, injustice and abuses by local officials. Chernenko's department handles these letters, and he regards them as the ear of the apparatus. Taking the complaints seriously, and acting visibly on a few of them, gives ordinary people the sense that someone in Moscow is listening."
 COLDWAR_SOV_che_the_path:0 "Continuity or Opening?"
 COLDWAR_SOV_che_the_path_desc:0 "Chernenko's instinct is to preserve the system Brezhnev built. Yet the economy is stagnating, the younger members of the Politburo are restless and even loyal apparatchiks admit that something must change. The General Secretary must decide whether to stand firmly on continuity or to permit a careful, limited opening toward the reformers gathered around Gorbachev."
 COLDWAR_SOV_che_continuity:0 "Continuity"
 COLDWAR_SOV_che_continuity_desc:0 "There will be no experiments. Cadres stay in their posts, the ministries keep their privileges and the party line remains what it was under Leonid Ilyich. The nomenklatura breathes a sigh of relief and society enjoys a few more years of predictability, while the question of whether the economy can afford this calm is one the old men in the Kremlin prefer not to ask."
 COLDWAR_SOV_che_the_ideology_plenum:0 "The Ideology Plenum"
 COLDWAR_SOV_che_the_ideology_plenum_desc:0 "In June 1983, the Central Committee met in a plenum devoted entirely to ideology, with Chernenko delivering the main report. Its message was clear: Soviet culture, education and propaganda must be purged of foreign influence and rededicated to Marxism-Leninism. Implementing its resolutions tightens the party's hold on the minds of the people, at least on paper."
 COLDWAR_SOV_che_a_cautious_opening:0 "A Cautious Opening"
 COLDWAR_SOV_che_a_cautious_opening_desc:0 "Chernenko is no reformer, but he is pragmatic enough to let younger colleagues experiment. Gorbachev and his allies are given room to test new methods in agriculture and industry, provided they do not touch the foundations of the system. It is a small door left ajar, and many in the apparatus fear that it will be impossible to close again."
 COLDWAR_SOV_che_the_school_reform:0 "The School Reform"
 COLDWAR_SOV_che_the_school_reform_desc:0 "In 1984, the Soviet leadership adopts a sweeping reform of general and vocational schooling. Every pupil is to learn a trade alongside the standard curriculum, and secondary schools are tied more closely to factories and collective farms. The reform promises skilled hands for an economy short of labour, though teachers complain about the added burden and the costs."
 COLDWAR_SOV_che_the_food_programme_continued:0 "The Food Programme Continued"
 COLDWAR_SOV_che_the_food_programme_continued_desc:0 "Brezhnev's Food Programme of May 1982 promised to end the chronic shortages of meat, milk and vegetables by the end of the decade. Chernenko intends to see it through, with more investment in the agro-industrial complex, better storage and transport and higher purchase prices for the collective farms. Grain imports from the capitalist world remain an embarrassment the party hopes to end."
 COLDWAR_SOV_che_the_foreign_line:0 "Talk or Boycott?"
 COLDWAR_SOV_che_the_foreign_line_desc:0 "Relations with Washington are at their lowest point in decades. The Euromissile crisis, the downing of KAL 007 and Reagan's talk of an evil empire have poisoned the atmosphere. Chernenko must choose whether to return to the negotiating table in Geneva or to answer American hostility with hostility of his own, beginning with the Olympic Games in Los Angeles."
 COLDWAR_SOV_che_the_peace_offensive:0 "The Peace Offensive"
 COLDWAR_SOV_che_the_peace_offensive_desc:0 "The Soviet Union proposes to resume arms talks in Geneva, covering strategic weapons, intermediate-range missiles and weapons in space alike. The offer is aimed at European public opinion as much as at Washington, presenting Moscow as the true champion of peace. Whether the Americans accept, and on what terms, now lies with them."
 COLDWAR_SOV_che_the_olympic_boycott:0 "The Olympic Boycott"
 COLDWAR_SOV_che_the_olympic_boycott_desc:0 "Four years after the Americans boycotted the Moscow Olympics, the Soviet Union answers in kind. Citing security concerns and anti-Soviet hysteria, the National Olympic Committee announces in May 1984 that Soviet athletes will not travel to Los Angeles, and most of the socialist bloc follows. At home the decision is presented as a matter of dignity, while in Washington it confirms that detente is dead."
 COLDWAR_SOV_che_the_emphysema:0 "The Emphysema"
 COLDWAR_SOV_che_the_emphysema_desc:0 "Chernenko is a sick man. Emphysema leaves him breathless, and he spends ever more time at the Kremlin hospital in Kuntsevo while his colleagues govern in his name. The succession can no longer be postponed, and the Politburo must decide whether the next General Secretary will come from the old guard or from a new generation."
 COLDWAR_SOV_che_heir_gorbachev:0 "Heir: Gorbachev"
 COLDWAR_SOV_che_heir_gorbachev_desc:0 "Mikhail Gorbachev already chairs the Secretariat when Chernenko is too ill to attend, and he has quietly built a coalition with Gromyko and the younger members of the Politburo. Naming him heir hands the future to a man of fifty-three who speaks of acceleration and renewal. The old guard is uneasy, but even many of them know the country needs a younger leader."
 COLDWAR_SOV_che_heir_grishin:0 "Heir: Grishin"
 COLDWAR_SOV_che_heir_grishin_desc:0 "Viktor Grishin has led the Moscow party organisation since 1967 and is the favoured candidate of the Brezhnev-era veterans. A stolid, cautious administrator, he promises that nothing important will change. Elevating him reassures the nomenklatura that its world is safe, though younger cadres and the reformers around Gorbachev see in him only more of the stagnation they despise."
 COLDWAR_SOV_che_heir_romanov:0 "Heir: Romanov"
 COLDWAR_SOV_che_heir_romanov_desc:0 "Grigory Romanov, the former Leningrad chief who now oversees the defence industry from the Central Committee Secretariat, is the hardliners' answer to Gorbachev. Disciplined, technocratic and uncompromising, he would combine the ideological firmness of the old guard with new managerial energy. Naming him heir signals that the party's future will be one of order rather than reform."
 COLDWAR_SOV_che_the_last_of_the_old_guard:0 "The Last of the Old Guard"
 COLDWAR_SOV_che_the_last_of_the_old_guard_desc:0 "Chernenko's rule marks the final chapter of the generation that came of age under Stalin and rose under Brezhnev. They govern with caution, respect for seniority and unshakable faith in the system they built. Their era brings stability and comfort to the apparatus, even as the economy slows and the gap between the leaders and the young grows ever wider."
 COLDWAR_SOV_tt_gensec_gor:0 "Mikhail Gorbachev is General Secretary"
 COLDWAR_SOV_mod_democratic_drift_tt:0 "Western Drift: $RIGHT|+=2$"
 COLDWAR_SOV_gor_the_new_generation:0 "The New Generation"
 COLDWAR_SOV_gor_the_new_generation_desc:0 "Mikhail Gorbachev became a full member of the Politburo in October 1980, its youngest by far. Now in power, he represents a generation shaped not by the purges and the war but by the Thaw and the Twentieth Congress. He promises perestroika, a restructuring of the Soviet system, in the belief that socialism can be renewed rather than abandoned."
 COLDWAR_SOV_gor_ryzhkov_and_ligachev:0 "Ryzhkov and Ligachev"
 COLDWAR_SOV_gor_ryzhkov_and_ligachev_desc:0 "Nikolai Ryzhkov, the industrial manager from Sverdlovsk, takes charge of the Council of Ministers, while Yegor Ligachev from Tomsk runs the Secretariat as the party's second man. Together they form the backbone of the new team, one tasked with making the economy work and the other with cleansing the apparatus of corruption and inertia. Their partnership will last only as long as reform stays within limits both can accept."
 COLDWAR_SOV_gor_yakovlev_returns:0 "Yakovlev Returns from Ottawa"
 COLDWAR_SOV_gor_yakovlev_returns_desc:0 "Alexander Yakovlev spent a decade as ambassador in Ottawa, a quiet exile after he criticised Russian nationalism in 1972. Gorbachev met him during his visit to Canada in 1983 and was struck by his ideas. Brought back to Moscow, Yakovlev becomes the intellectual architect of glasnost and the most radical voice in the leadership, convinced that the party must open up in order to survive."
 COLDWAR_SOV_gor_shevardnadze_at_the_foreign_ministry:0 "Shevardnadze at the Foreign Ministry"
 COLDWAR_SOV_gor_shevardnadze_at_the_foreign_ministry_desc:0 "In July 1985, Andrei Gromyko leaves the Foreign Ministry after twenty-eight years, and Gorbachev hands it to Eduard Shevardnadze, the Georgian party chief with no diplomatic experience at all. The choice stuns the world, but Shevardnadze brings flexibility and warmth where Gromyko was known as Mister Nyet. His appointment also signals respect for the non-Russian republics at the highest level of the Union."
 COLDWAR_SOV_gor_the_path:0 "Acceleration or Glasnost?"
 COLDWAR_SOV_gor_the_path_desc:0 "Gorbachev agrees that the system must change, but not on where to begin. Some advisers urge acceleration, modernising machine-building and raising investment so that the economy grows faster before politics is touched. Others argue that nothing will move until the truth can be spoken openly, and that openness must come first, so the order of reform may well decide its fate."
 COLDWAR_SOV_gor_uskorenie:0 "Uskorenie"
 COLDWAR_SOV_gor_uskorenie_desc:0 "At the April Plenum of 1985 and again at the Twenty-Seventh Party Congress, Gorbachev calls for uskorenie, the acceleration of socio-economic development. Massive investment flows into machine-building and new technology, aiming to re-equip Soviet industry within a decade. It is an ambitious but traditional programme of growth from above, and it tests whether the planned economy can still be revived by command."
 COLDWAR_SOV_gor_the_anti_alcohol_campaign:0 "The Anti-Alcohol Campaign"
 COLDWAR_SOV_gor_the_anti_alcohol_campaign_desc:0 "In May 1985, the Central Committee declares war on drunkenness. Vodka prices rise, opening hours shrink, vineyards are uprooted and party members are expected to set an example of sobriety. Discipline and public health improve, but the budget loses billions in alcohol revenue, moonshine flourishes and sugar vanishes from the shops, and people soon nickname Gorbachev the mineral water secretary."
 COLDWAR_SOV_gor_the_state_enterprise_law:0 "The State Enterprise Law"
 COLDWAR_SOV_gor_the_state_enterprise_law_desc:0 "Adopted in June 1987, the Law on the State Enterprise grants factories a measure of self-financing and the right to elect their own directors. State orders replace part of the rigid plan, and enterprises may keep a share of what they earn. The branch ministries lose much of their power in the process, and the planned economy begins to loosen at its very core."
 COLDWAR_SOV_gor_glasnost_first:0 "Glasnost First"
 COLDWAR_SOV_gor_glasnost_first_desc:0 "Gorbachev decides that the country cannot be restructured while it is still afraid to speak. Censorship relaxes, papers such as Moscow News and Ogonyok print what was unprintable a year before, and banned films and novels come down from the shelves. Intellectual life flourishes, but the party also loses its monopoly on the truth, and with it a pillar of its authority."
 COLDWAR_SOV_gor_the_blank_spots:0 "The Blank Spots of History"
 COLDWAR_SOV_gor_the_blank_spots_desc:0 "Soviet history is full of blank spots: the purges, the famine, the secret protocols of 1939, Katyn. Under glasnost, historians and journalists begin to fill them in, Bukharin and other victims of Stalin are rehabilitated and the public learns what the textbooks concealed. The reckoning is cathartic for many, but it shakes the faith of those who believed in the party's infallibility."
 COLDWAR_SOV_gor_release_sakharov:0 "Release Sakharov"
 COLDWAR_SOV_gor_release_sakharov_desc:0 "Andrei Sakharov, father of the Soviet hydrogen bomb and Nobel Peace laureate, has lived in internal exile in Gorky since 1980. In December 1986, a telephone is suddenly installed in his flat, and the General Secretary himself calls to invite him back to Moscow. His release electrifies the dissident movement and convinces the West that the changes in the Kremlin are real."
 COLDWAR_SOV_gor_the_cooperative_law:0 "The Cooperative Law"
 COLDWAR_SOV_gor_the_cooperative_law_desc:0 "The Law on Cooperation of May 1988 allows Soviet citizens to found cooperatives in trade, services, catering and even manufacturing. Overnight, much of the shadow economy steps into the light as cafes, repair shops and small producers appear in every city. The state gains taxes and the shops gain goods, though the new cooperators are soon accused of profiteering and ties to organised crime."
 COLDWAR_SOV_gor_new_thinking:0 "New Thinking"
 COLDWAR_SOV_gor_new_thinking_desc:0 "New political thinking holds that in the nuclear age, universal human values must take precedence over the class struggle. Gorbachev and Shevardnadze apply it to foreign policy, seeking mutual security instead of military superiority. Western leaders are cautiously impressed, and relations with partners across the world begin to thaw as the confrontation of the early 1980s gives way to dialogue."
 COLDWAR_SOV_gor_the_zero_option:0 "The Zero Option"
 COLDWAR_SOV_gor_the_zero_option_desc:0 "Reagan proposed the zero option in 1981, expecting Moscow to reject it. Now the Soviet Union takes him at his word: all intermediate-range missiles in Europe, the SS-20 included, are to be eliminated entirely, removing a whole class of nuclear weapons. The generals are furious at giving up more missiles than the Americans, but the decision now rests with Washington."
 COLDWAR_SOV_gor_leave_afghanistan:0 "Leave Afghanistan"
 COLDWAR_SOV_gor_leave_afghanistan_desc:0 "Gorbachev has called Afghanistan a bleeding wound. After years of war, thousands of Soviet dead and no end in sight, the Politburo decides to bring the 40th Army home, offering Kabul a withdrawal plan that gives the Afghan government time to stand on its own. The army sees it as a humiliation, but Soviet mothers will be grateful."
 COLDWAR_SOV_gor_the_sinatra_doctrine:0 "The Sinatra Doctrine"
 COLDWAR_SOV_gor_the_sinatra_doctrine_desc:0 "The Brezhnev Doctrine is dead. In October 1989, Foreign Ministry spokesman Gennady Gerasimov jokes that Moscow now follows the Sinatra Doctrine, letting the countries of Eastern Europe do it their way, and Soviet tanks will no longer rescue unpopular communist governments. The socialist community saves on subsidies and earns goodwill in the West, but its cohesion can no longer be guaranteed by force."
 COLDWAR_SOV_gor_democratisation:0 "Demokratizatsiya"
 COLDWAR_SOV_gor_democratisation_desc:0 "At the January Plenum of 1987, Gorbachev declares that perestroika requires the democratisation of party and state. Several candidates are to stand in elections, secret ballots will choose party secretaries and workers may elect their managers. The reformers rejoice, but the nomenklatura sees its appointments and privileges threatened, and the balance of power in the Politburo tips decisively."
 COLDWAR_SOV_gor_the_congress_of_peoples_deputies:0 "The Congress of People's Deputies"
 COLDWAR_SOV_gor_the_congress_of_peoples_deputies_desc:0 "In March 1989, Soviet citizens vote in the first contested national elections since 1917. The new Congress of People's Deputies brings Sakharov, Yeltsin and many critics of the party onto the national stage, and its sessions, broadcast live, captivate the whole country. Several party bosses lose to unknown challengers, a humiliation that reveals how far the party's authority has fallen."
 COLDWAR_SOV_gor_the_union_treaty:0 "The New Union Treaty"
 COLDWAR_SOV_gor_the_union_treaty_desc:0 "The Union of 1922 can no longer hold the republics together by force alone. Gorbachev proposes a new Union Treaty that would turn the Soviet Union into a voluntary federation of sovereign republics, sharing defence, foreign policy and a common market while granting each wide autonomy. A Union-wide referendum is to give it popular legitimacy, but the republics and the hardliners must still be won over."
 COLDWAR_SOV_gor_how_far:0 "How Far?"
 COLDWAR_SOV_gor_how_far_desc:0 "Perestroika has unleashed forces no one fully controls. Elections, a free press and national movements are reshaping the country faster than the party can adapt. Gorbachev must decide how far the reform should go, whether to keep it within the framework of the Communist Party and its leading role, or to accept that the party itself must become something new."
 COLDWAR_SOV_gor_humane_democratic_socialism:0 "Humane, Democratic Socialism"
 COLDWAR_SOV_gor_humane_democratic_socialism_desc:0 "At the Twenty-Eighth Congress in July 1990, the party adopts its programmatic statement Towards a Humane, Democratic Socialism. The Communist Party remains the governing force, but it renounces dogma, accepts political pluralism and commits itself to the rule of law. For Gorbachev, this is the synthesis he has sought since 1985: renewal without rupture, and socialism with a human face at last."
 COLDWAR_SOV_new_leader_mikhail_gorbachev_tt:0 "§YMikhail Gorbachev§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_gor_the_social_democratic_turn:0 "The Social-Democratic Turn"
 COLDWAR_SOV_gor_the_social_democratic_turn_desc:0 "The reformers conclude that the Communist Party cannot be saved in its old form. Gorbachev and his allies break with the hardliners and refound the governing party on social-democratic principles, modelled on the labour parties of Western Europe, while old comrades denounce the betrayal. The Soviet Union enters uncharted territory as a pluralist socialist state."
 COLDWAR_SOV_gor_the_presidency:0 "The Presidency of the USSR"
 COLDWAR_SOV_gor_the_presidency_desc:0 "In March 1990, the Congress of People's Deputies ends the party's constitutional monopoly on power, creates the office of President of the USSR and elects Gorbachev to it. Executive authority shifts from the Politburo to the state. A new Federation Council brings the leaders of all the republics into direct consultation with the President, replacing the old system of party seats."
 COLDWAR_SOV_mod_mdcw_cw_market_exposure_tt:0 "World Market Exposure (Cold War): $RIGHT|-=%1$"
 COLDWAR_SOV_gor_the_common_european_home:0 "The Common European Home"
 COLDWAR_SOV_gor_the_common_european_home_desc:0 "In Strasbourg in July 1989, Gorbachev tells the Council of Europe of a common European home stretching from the Atlantic to the Urals. The vision imagines a continent where the blocs dissolve into cooperation, trade flows freely and the Soviet Union takes its place as one European nation among others. The Iron Curtain is lifting, and partners in Bonn, Paris and Rome are eager to engage."
 COLDWAR_SOV_wc_all_power_to_the_councils:0 "All Power to the Councils"
 COLDWAR_SOV_wc_all_power_to_the_councils_desc:0 "The slogan of 1917 returns to the streets: all power to the councils. Workers' councils born in factories across the Union demand that the soviets become again what they were meant to be, organs of self-government rather than rubber stamps of the party apparatus. The Free Councils of Labour now hold power, and the ministries, the planners and the nomenklatura brace for a revolution from below."
 COLDWAR_SOV_wc_the_novocherkassk_memory:0 "The Novocherkassk Memory"
 COLDWAR_SOV_wc_the_novocherkassk_memory_desc:0 "In June 1962, workers at the Novocherkassk electric locomotive plant struck against higher food prices and cut wages. Troops opened fire, killing more than twenty people, and the event was buried in official silence, but Pyotr Siuda, a striker and witness, kept the memory alive. Now Novocherkassk becomes the founding myth of the council movement and a rallying cry for the trade unions."
 COLDWAR_SOV_wc_dissolve_the_ministries:0 "Dissolve the Ministries"
 COLDWAR_SOV_wc_dissolve_the_ministries_desc:0 "The branch ministries in Moscow have commanded Soviet industry from above for half a century. The councils intend to abolish them and hand control of each enterprise to the people who work there. The transition will be chaotic as supply chains break, production falters and old managers resist, but the councils believe that self-management, once rooted, will prove stronger than any bureaucracy."
 COLDWAR_SOV_wc_the_council_question:0 "Factory or Village?"
 COLDWAR_SOV_wc_the_council_question_desc:0 "The council revolution must decide where its centre of gravity lies. The industrial workers of the cities, heirs of the Petrograd Soviet, demand that factory councils lead the new order. Yet the countryside has its own claim, for collective farmers want land and autonomy rather than new masters, and the choice between them will shape the character of the new state."
 COLDWAR_SOV_wc_factory_councils:0 "Factory Councils"
 COLDWAR_SOV_wc_factory_councils_desc:0 "Elected councils of workers take over the management of their factories, choosing directors, setting production priorities and sharing the proceeds of their labour. The Yugoslav experience is studied closely, but the Soviet councils aim to go further. Freed from ministerial orders, many enterprises discover unexpected reserves of initiative, and workers see for the first time in decades what it means to own the means of production."
 COLDWAR_SOV_wc_the_congress_of_councils:0 "The Congress of Councils"
 COLDWAR_SOV_wc_the_congress_of_councils_desc:0 "Delegates from councils across the Union gather in Moscow for a Congress of Councils, the first truly elected national assembly of working people since the early days of the revolution. Debates are long, loud and sometimes chaotic, but the Congress gives the new order a face and a voice. Its decrees carry a legitimacy that no Politburo resolution ever enjoyed."
 COLDWAR_SOV_wc_the_rural_communes:0 "The Rural Communes"
 COLDWAR_SOV_wc_the_rural_communes_desc:0 "The collective farms were imposed on the peasantry by force, and those who work them have little say in how they are run. The councils propose a different model: rural communes owned and governed by the people who till the land, free to decide what to grow and how to share the harvest. Productivity rises as farmers at last work for themselves and their neighbours."
 COLDWAR_SOV_wc_land_to_the_communes:0 "Land to the Communes"
 COLDWAR_SOV_wc_land_to_the_communes_desc:0 "The land belongs to those who work it. State and collective farms are transferred to the rural communes together with their machinery and livestock, and villages across Russia, Ukraine and Central Asia gain control of their own future. The cities will have to wait longer for consumer goods as resources flow to the countryside, but the peasantry has never been more loyal."
 COLDWAR_SOV_wc_the_federation_of_councils:0 "The Federation of Councils"
 COLDWAR_SOV_wc_the_federation_of_councils_desc:0 "The Union of Soviet Socialist Republics was meant to be a free federation of soviet republics, and the councils intend to make that promise real. Power flows upward from local councils to republican congresses and only then to the Union, giving Ukrainians, Georgians, Kazakhs and Balts a genuine voice in their own affairs. Many in the republics find the new federation worth belonging to."
 COLDWAR_SOV_wc_abolish_the_nomenklatura:0 "Abolish the Nomenklatura"
 COLDWAR_SOV_wc_abolish_the_nomenklatura_desc:0 "The nomenklatura, the secret lists of posts and of the people entitled to fill them, has been the backbone of party rule since Stalin. The councils abolish it outright: positions are now elected or filled on merit, and special shops, dachas and privileges vanish. Corruption declines sharply, but the displaced elite is bitter and the administrative chaos is felt everywhere."
 COLDWAR_SOV_wc_workers_militias:0 "Workers' Militias"
 COLDWAR_SOV_wc_workers_militias_desc:0 "A council republic needs its own defenders. Workers' militias are formed in factories and districts, armed and trained to protect the revolution against counter-revolution and foreign intervention alike. They swell the pool of available manpower, but professional officers watch with alarm as discipline gives way to elected commanders and the regular army loses its monopoly on force."
 COLDWAR_SOV_wc_leave_the_arms_race:0 "Leave the Arms Race"
 COLDWAR_SOV_wc_leave_the_arms_race_desc:0 "The councils see the arms race as a burden imposed on working people by two ruling classes. Defence spending is cut sharply, weapons programmes are cancelled and resources are redirected to housing and consumer goods. The generals are outraged, but tensions with the West ease, and workers in Moscow and Detroit alike may wonder why they were ever enemies."
 COLDWAR_SOV_wc_international_of_councils:0 "International of Councils"
 COLDWAR_SOV_wc_international_of_councils_desc:0 "The Soviet council revolution looks abroad for comrades. Yugoslavia, with its long tradition of workers' self-management, becomes the natural first partner, and appeals go out to labour movements from Poland to Latin America. A new international of councils is founded to support self-managing socialism wherever it emerges, offering a third way between Washington and the old Moscow."
 COLDWAR_SOV_wc_the_revolutions_course:0 "The Revolution's Course"
 COLDWAR_SOV_wc_the_revolutions_course_desc:0 "The councils hold power, but the long-term direction of the revolution remains open. Some delegates insist that it cannot stop at the Soviet borders and must keep advancing at home and abroad. Others argue that the time has come to consolidate, to build stable institutions and to show the world that council communism can work in peace."
 COLDWAR_SOV_wc_permanent_revolution:0 "Permanent Revolution"
 COLDWAR_SOV_wc_permanent_revolution_desc:0 "The revolution must never rest. Reviving the old idea of permanent revolution, the councils commit to continuous mobilisation, spreading their model abroad and challenging every entrenched hierarchy at home, while volunteers and aid flow to movements across the world. The energy is intoxicating, but constant upheaval takes its toll on daily life and on stability."
 COLDWAR_SOV_wc_the_councils_settle:0 "The Councils Settle"
 COLDWAR_SOV_wc_the_councils_settle_desc:0 "After years of upheaval, the councils choose consolidation. Procedures are codified, elections become routine and the new institutions settle into the rhythm of everyday government. Workers return to production confident that their councils will endure. The revolution has become a state, and for most citizens that comes as a welcome relief."
 COLDWAR_SOV_wc_the_commune_state:0 "The Commune State"
 COLDWAR_SOV_wc_the_commune_state_desc:0 "The Soviet Union has become what Lenin once described in The State and Revolution: a commune state governed by elected and recallable councils of working people. The ministries and the nomenklatura are gone, factories and farms manage themselves and power flows from below. Utopia or dangerous experiment, the council republic stands as a genuine alternative to capitalism and to the old Soviet model alike."
 COLDWAR_SOV_ns_the_iron_line:0 "The Iron Line"
 COLDWAR_SOV_ns_the_iron_line_desc:0 "Sergei Trapeznikov, head of the Central Committee's Department of Science and Education, has long been the voice of those who never accepted the denunciation of Stalin. His Neo-Stalinist Platform now holds power, promising strict discipline, ideological purity and a return to the mobilising spirit of the five-year plans. Intellectuals tremble, but many ordinary people remember the Stalin years as a time of order and greatness."
 COLDWAR_SOV_ns_rehabilitate_the_vozhd:0 "Rehabilitate the Vozhd"
 COLDWAR_SOV_ns_rehabilitate_the_vozhd_desc:0 "Since 1956, Stalin's name has been spoken only in whispers or in condemnation. The Neo-Stalinists restore him as the architect of victory and industrialisation: monuments return, textbooks are rewritten and Khrushchev's secret speech is quietly disowned. In the republics, the memory of the deportations makes the move deeply unpopular, but in Beijing, which never condemned Stalin, Mao takes notice."
 COLDWAR_SOV_ns_the_mobilisation_economy:0 "The Mobilisation Economy"
 COLDWAR_SOV_ns_the_mobilisation_economy_desc:0 "The Neo-Stalinists revive the economics of the 1930s and the war years: maximum investment in heavy and defence industry, rigid central control and the subordination of every resource to the plan. New armaments plants rise and the workforce is placed on a permanent war footing. Living standards suffer and efficiency declines, but the state's capacity to mobilise grows dramatically."
 COLDWAR_SOV_ns_the_question:0 "Plans or Cadres?"
 COLDWAR_SOV_ns_the_question_desc:0 "Stalin once declared that cadres decide everything, yet the Neo-Stalinists are also heirs to the five-year plans and the great construction projects. The leadership must choose its emphasis. It can launch a renewed drive of industrialisation powered by ambitious targets, or forge a new and disciplined cadre corps through purges and promotions that will carry the system forward."
 COLDWAR_SOV_ns_the_new_industrialisation:0 "The New Industrialisation"
 COLDWAR_SOV_ns_the_new_industrialisation_desc:0 "Like the first five-year plans, the new industrialisation sets breathtaking targets: new factories, new cities and new industries built at enormous speed. Investment is concentrated on output, and the slogans of the 1930s reappear on factory walls. Civilian industry expands dramatically, but the strain on workers and the disruption of everyday life breed unrest that the regime must contain."
 COLDWAR_SOV_ns_shock_workers:0 "Shock Workers"
 COLDWAR_SOV_ns_shock_workers_desc:0 "The Stakhanovites of the 1930s smashed every norm and became heroes of the nation. Trapeznikov's circle wants that spirit back: shock brigades, red banners on the shop floor and public honour for those who overfulfil the plan. The trade unions grumble about speed-ups and raised norms, but the Neo-Stalinists believe socialist emulation can achieve what Kosygin's bonuses never did."
 COLDWAR_SOV_ns_cadres_decide_everything:0 "Cadres Decide Everything"
 COLDWAR_SOV_ns_cadres_decide_everything_desc:0 "In May 1935 Stalin told the graduates of the Red Army academies that cadres decide everything. The Neo-Stalinist platform takes the slogan literally: the nomenklatura is to be rebuilt as a disciplined, ideologically reliable corps, promoted for loyalty and results rather than seniority. The Central Committee apparatus, long used to Brezhnev's comfortable stability of cadres, is promised a firmer hand and a renewed sense of mission."
 COLDWAR_SOV_ns_the_new_purge:0 "The New Purge"
 COLDWAR_SOV_ns_the_new_purge_desc:0 "Corruption, nepotism and quiet private dealing have spread through the apparatus since Khrushchev's fall. The Neo-Stalinists answer with the oldest remedy they know: a purge of the ranks, carried out by the organs of state security and justified in the language of revolutionary vigilance. Thieves and careerists will fall, but so will many who merely backed the wrong patron, and the whole party will learn once more what fear means."
 COLDWAR_SOV_ns_the_patriotic_spirit:0 "The Great Patriotic Spirit"
 COLDWAR_SOV_ns_the_patriotic_spirit_desc:0 "In May 1970 the country marked twenty-five years since the victory over fascism, and the memory of the Great Patriotic War remains the deepest source of Soviet legitimacy. The platform places the war, and the Generalissimo who led it, back at the centre of public life: new memorials, military-patriotic education in every school and a cult of sacrifice that binds the young to the generation of 1941."
 COLDWAR_SOV_ns_the_closed_economy:0 "The Closed Economy"
 COLDWAR_SOV_ns_the_closed_economy_desc:0 "Western credits, Fiat licences and grain deals have made the Union dependent on its rivals, or so the Neo-Stalinists argue. Their answer is autarky: foreign trade reduced to what is strictly necessary, contacts with capitalist firms placed under suspicion and the economy organised to survive any embargo the imperialists might impose. Self-reliance has a price in technology and comfort, but it removes a lever the West could one day pull."
 COLDWAR_SOV_ns_collective_farms_tightened:0 "Tighten the Kolkhozy"
 COLDWAR_SOV_ns_collective_farms_tightened_desc:0 "Private plots and market sales have crept back into the countryside, and many kolkhozy survive only on state subsidies. The platform orders a return to discipline: tighter control over private livestock, firm delivery quotas and larger, consolidated farms run by reliable chairmen. Output may rise in the granaries, but the collective farmers will remember who took away the little freedom they had won since 1953."
 COLDWAR_SOV_ns_reconcile_with_mao:0 "A Stalinist Hand to Mao"
 COLDWAR_SOV_ns_reconcile_with_mao_desc:0 "The clashes on Damansky Island in March 1969 brought the Soviet Union and China to the brink of war. Yet Mao has always despised Khrushchev's revisionism far more than Stalin's legacy, and a Moscow that rehabilitates Stalin might find an unexpected listener in Beijing. The platform proposes to offer the Chinese comrades a common return to the pure line, if they are willing to take it."
 COLDWAR_SOV_ns_the_iron_curtain_reinforced:0 "The Iron Curtain Reinforced"
 COLDWAR_SOV_ns_the_iron_curtain_reinforced_desc:0 "Western radio, tourists, jazz records and smuggled jeans corrupt Soviet youth more effectively than any army could. The Neo-Stalinists want the frontier sealed once more: the jamming of the Voice of America and Radio Liberty is intensified, contacts with foreigners are restricted and cultural exchanges are cut back to the bare minimum. Trade with the West will suffer, but the ideological frontier of the Union will finally be secure."
 COLDWAR_SOV_ns_the_leadership_question:0 "A New Vozhd?"
 COLDWAR_SOV_ns_the_leadership_question_desc:0 "The Neo-Stalinist platform has always been divided on one point: should the restoration produce a new supreme leader, or must power remain with the collective Politburo? Some in Trapeznikov's circle dream of a new Vozhd who stands above the apparatus as Stalin did, while others fear another reign of terror that would devour its own creators. The movement must decide which path the restoration will take."
 COLDWAR_SOV_ns_a_new_vozhd:0 "A New Vozhd"
 COLDWAR_SOV_ns_a_new_vozhd_desc:0 "The decision is made: the Union will once again have a Vozhd. The General Secretary is elevated above the Politburo, his portraits fill the squares and his word becomes the final authority in party and state. Supporters call it the restoration of Leninist order; critics whisper that the country has seen all this before, and remember how it ended for the delegates of the Congress of Victors in 1934."
 COLDWAR_SOV_ns_collective_stalinism:0 "Collective Stalinism"
 COLDWAR_SOV_ns_collective_stalinism_desc:0 "Rather than create another Vozhd, the leadership chooses Stalinism without Stalin. The cult of the late Generalissimo is restored and many of his methods return, but power remains shared within the Politburo, where no single man can turn the organs against his colleagues. The nomenklatura welcomes a system that offers discipline from above and security for those who already sit at the top."
 COLDWAR_SOV_ns_the_second_industrialisation:0 "The Second Industrialisation"
 COLDWAR_SOV_ns_the_second_industrialisation_desc:0 "Stalin's first industrialisation turned a peasant land into a great power within a decade. The Neo-Stalinists now promise a second one: new giants such as the Kama truck works, power stations on the Siberian rivers and whole industrial cities built from scratch in the taiga. Mobilisation, central direction and sacrifice are once again to drive the Soviet economy forward, this time towards the twenty-first century."
 COLDWAR_SOV_kv_the_leader_state:0 "The Leader State"
 COLDWAR_SOV_kv_the_leader_state_desc:0 "Alexander Shelepin, the Iron Shurik who once led both the Komsomol and the KGB, has finally taken power together with his network of former Komsomol functionaries. The comfortable collective rule of the Brezhnev years is over. In its place stands a leader state, built on personal loyalty, youthful energy and a security apparatus that answers to one man rather than to the Politburo."
 COLDWAR_SOV_kv_the_vozhd_principle:0 "The Vozhd Principle"
 COLDWAR_SOV_kv_the_vozhd_principle_desc:0 "Shelepin's followers do not hide what they want: a single leader whose authority rests on personal will rather than on the consensus of ageing Politburo members. The principle of the Vozhd is proclaimed openly, and the apparatus is told that loyalty to the leader is loyalty to the revolution itself. Few dare to ask aloud where this road led the last time it was travelled."
 COLDWAR_SOV_kv_the_youth_vanguard:0 "The Youth Vanguard"
 COLDWAR_SOV_kv_the_youth_vanguard_desc:0 "The Komsomol, with more than twenty million members, is the largest reservoir of energy in the Union, and Shelepin knows it better than anyone. Its brigades are to become the vanguard of the new order, sent to the great construction sites, to the factories and to the border regions. The young are promised responsibility and rapid advancement in return for unconditional commitment."
 COLDWAR_SOV_kv_the_pillar:0 "Which Pillar?"
 COLDWAR_SOV_kv_the_pillar_desc:0 "Every leader state needs a foundation, and Shelepin's advisers are divided on which one to choose. Some want to build the regime on the organs of state security, which Shelepin and Semichastny once commanded. Others want to rest it on the permanent mobilisation of the masses through the Komsomol and great national campaigns. The choice will define the character of the new order."
 COLDWAR_SOV_kv_the_security_state:0 "The Security State"
 COLDWAR_SOV_kv_the_security_state_desc:0 "The KGB was Shelepin's springboard to power, and it will now be his main pillar. Its directorates are expanded, its informers multiplied and its authority over party members restored to levels unseen since 1953. Every foreign influence and every whisper of dissent is to be detected early, and the Chekists become the guardians not only of the state but of the leader himself."
 COLDWAR_SOV_kv_the_informers:0 "Every Third an Informer"
 COLDWAR_SOV_kv_the_informers_desc:0 "A security state rests on information, and information comes from people. A vast network of informers is recruited in factories, institutes, dormitories and housing blocks, many of them from the ranks of the Komsomol. Foreign intelligence services find it ever harder to operate, but trust between colleagues, neighbours and friends begins to wither, and the atmosphere in the country grows colder."
 COLDWAR_SOV_kv_mass_mobilisation:0 "Mass Mobilisation"
 COLDWAR_SOV_kv_mass_mobilisation_desc:0 "Rather than relying on the secret police, the regime builds its power on the masses. Rallies, voluntary labour Saturdays, people's patrol squads and endless campaigns keep society in permanent motion. The Komsomol Vanguard presents itself as the movement of a young and fighting generation, and anyone who stands aside quickly learns that indifference is also a political statement."
 COLDWAR_SOV_kv_the_great_campaigns:0 "The Great Campaigns"
 COLDWAR_SOV_kv_the_great_campaigns_desc:0 "In the spirit of the Virgin Lands and the great Komsomol construction projects, the regime launches a new series of national campaigns. Tens of thousands of young volunteers are sent to the taiga, the steppe and the Far North to lay railways, raise dams and found new towns. The work is hard and the living conditions harsh, but the campaigns give the regime both results and legitimacy."
 COLDWAR_SOV_kv_purge_the_old_men:0 "Purge the Old Men"
 COLDWAR_SOV_kv_purge_the_old_men_desc:0 "The Politburo of 1970 is a council of elderly men, many of whom have held high office since Stalin's days. Shelepin's young cadres now push them aside: pensions, honourable retirements and, where needed, humiliating dismissals clear the way for a new generation. The principle of stability of cadres that protected the old guard under Brezhnev is abandoned, and the whole apparatus trembles."
 COLDWAR_SOV_mod_infra_cost_multiplier_modifier_tt:0 "Infrastructure Upkeep: $RIGHT|-=%1$"
 COLDWAR_SOV_kv_construction_battalions:0 "Construction Battalions"
 COLDWAR_SOV_kv_construction_battalions_desc:0 "The Soviet Army already maintains construction battalions, but the new regime turns them, together with the Komsomol brigades, into a permanent labour force for the great projects. Roads, railways, pipelines and bridges are pushed into the remote regions of Siberia and the Far East at a pace no ordinary ministry could achieve. Discipline replaces wages as the main motivation."
 COLDWAR_SOV_kv_discipline_in_the_factories:0 "Discipline in the Factories"
 COLDWAR_SOV_kv_discipline_in_the_factories_desc:0 "Absenteeism, drinking at work and idle hours have become part of everyday life in Soviet industry. The new regime declares war on slackness: inspection teams patrol the factories, latecomers are named and shamed, and managers are held personally responsible for labour discipline. Productivity rises, but the trade unions lose what little ability they had to protect the workers they represent."
 COLDWAR_SOV_kv_the_iron_fist_abroad:0 "The Iron Fist Abroad"
 COLDWAR_SOV_kv_the_iron_fist_abroad_desc:0 "The Brezhnev Doctrine already claims the right to intervene wherever socialism is threatened. Shelepin's regime goes further, promising its allies a firmer hand and its enemies a harder line from the Elbe to the Ussuri. Military aid to revolutionary movements grows, Soviet forces are placed on higher readiness, and the world is reminded that the young generation in Moscow does not fear confrontation."
 COLDWAR_SOV_kv_the_eastern_opening:0 "The Eastern Opening"
 COLDWAR_SOV_kv_the_eastern_opening_desc:0 "Ideology has divided Moscow and Beijing for a decade, but two leader states may understand each other better than two parties ever did. Without abandoning Soviet interests, the regime signals to Mao that a pragmatic understanding is possible, building on the talks Kosygin and Zhou Enlai held at Beijing airport in September 1969. Whether China takes the outstretched hand is up to Beijing."
 COLDWAR_SOV_kv_the_succession:0 "After the Vozhd"
 COLDWAR_SOV_kv_the_succession_desc:0 "A regime built around one man has no ready answer to the question of what comes after him. Shelepin's circle must decide whether to designate an heir from among the loyal Komsomol cadres or to let power return to the party, where it lay before the leader state was proclaimed. The choice will decide whether the system survives its founder."
 COLDWAR_SOV_kv_heir_semichastny:0 "Heir: Semichastny"
 COLDWAR_SOV_kv_heir_semichastny_desc:0 "Vladimir Semichastny succeeded Shelepin both as head of the Komsomol and as chairman of the KGB, and he has followed his mentor ever since. Brezhnev exiled him to a minor post in Kiev in 1967, but under the leader state he has returned to the centre. Naming him heir ensures that the security organs will stand behind the succession, and that Shelepin's line will continue."
 COLDWAR_SOV_kv_return_to_the_party:0 "Return to the Party"
 COLDWAR_SOV_kv_return_to_the_party_desc:0 "The age of the leader state draws to a close. Rather than handing power to a designated heir, the Komsomol Vanguard returns authority to the Communist Party of the Soviet Union and its Central Committee. A plenum will decide the future course, and the comrades who survived the years of mobilisation must once again find a common line."
 COLDWAR_SOV_kv_the_vanguard_state:0 "The Vanguard State"
 COLDWAR_SOV_kv_the_vanguard_state_desc:0 "The vanguard state has become an established order. The Komsomol generation now holds the key posts in party, state and security apparatus, and a young, disciplined elite governs a society trained in permanent mobilisation. Admirers see a socialism that has rediscovered its fighting energy; critics see a garrison state run by the former youth league. Either way, the Union has changed for good."
 COLDWAR_SOV_sd_the_systems_men_rule:0 "The Systems Men Rule"
 COLDWAR_SOV_sd_the_systems_men_rule_desc:0 "Dzhermen Gvishiani, Kosygin's son-in-law and deputy chairman of the State Committee for Science and Technology, has long argued that the Union must be run like one great system. Now the systems men hold power: economists, cyberneticians and managers who speak the language of efficiency rather than ideology. Their rule is authoritarian and technocratic, but it looks westwards for methods and partners."
 COLDWAR_SOV_sd_the_iiasa_partnership:0 "The IIASA Partnership"
 COLDWAR_SOV_sd_the_iiasa_partnership_desc:0 "Together with McGeorge Bundy, Gvishiani has been negotiating an international institute where Soviet and American scientists could jointly study the problems of modern industrial societies. At Laxenburg near Vienna, the International Institute for Applied Systems Analysis is set to become a bridge between East and West. For the Directorate it is a window on Western management science and a symbol of its new course."
 COLDWAR_SOV_sd_the_managerial_revolution:0 "The Managerial Revolution"
 COLDWAR_SOV_sd_the_managerial_revolution_desc:0 "Party secretaries still meddle in every decision of every factory, and the nomenklatura confuses loyalty with competence. The Directorate puts an end to this: enterprise directors receive real authority, professional managers are trained on the model of Western business schools and promotion depends on measurable results. The old party apparatus watches with alarm as its grip on the economy slips away."
 COLDWAR_SOV_sd_the_form:0 "Technocracy or Corporation?"
 COLDWAR_SOV_sd_the_form_desc:0 "The systems men agree on what they reject, but not on what they want to build. One faction envisions a technocratic state in which scientific institutes and planning bodies govern through models and data. The other dreams of a corporate union in which large industrial associations operate like Western corporations, open to foreign capital and trade. The Directorate must now choose its shape."
 COLDWAR_SOV_sd_the_technocratic_state:0 "The Technocratic State"
 COLDWAR_SOV_sd_the_technocratic_state_desc:0 "The Directorate chooses the path of the technocratic state. Ministries are reorganised according to systems analysis, planning bodies are staffed with mathematicians and engineers, and decisions are justified by models instead of quotations from Lenin. The state becomes more efficient and more powerful, but also more distant from the people it governs and more dependent on a small, closed elite of experts."
 COLDWAR_SOV_sd_the_corporate_union:0 "The Corporate Union"
 COLDWAR_SOV_sd_the_corporate_union_desc:0 "The Directorate chooses the corporate path. Large industrial associations are transformed into semi-independent corporations that negotiate with foreign partners, raise credit abroad and compete for markets. Western banks and firms are invited to invest, and Soviet enterprises begin to resemble Fiat or Siemens more than a department of a ministry. Efficiency grows, and so does the foreign debt."
 COLDWAR_SOV_sd_western_licences:0 "Western Licences"
 COLDWAR_SOV_sd_western_licences_desc:0 "The giant car plant at Togliatti, agreed with Fiat in 1966, showed how quickly Western licences can close a technological gap. The Directorate makes this the rule rather than the exception: licences for production lines, electronics and chemical processes are purchased systematically, and Soviet engineers are sent abroad to learn. Critics warn of dependency, but the systems men see no shame in learning from the best."
 COLDWAR_SOV_sd_the_computer_ministry:0 "The Computer Ministry"
 COLDWAR_SOV_sd_the_computer_ministry_desc:0 "Viktor Glushkov's plan for a nationwide automated management system, OGAS, was shelved by the old leadership, which feared what transparent data might reveal. The Directorate revives it under a dedicated ministry for computer technology. New microelectronics plants are built, the Ryad series of computers is expanded and a network linking the planning bodies becomes the backbone of a modern state."
 COLDWAR_SOV_sd_rationalise_the_army:0 "Rationalise the Army"
 COLDWAR_SOV_sd_rationalise_the_army_desc:0 "The Soviet Armed Forces swallow a huge share of the nation's resources, yet nobody can say exactly how much security they produce. The Directorate applies systems analysis to defence: redundant divisions are disbanded, procurement is subjected to cost-effectiveness calculations and the bloated officer corps is reduced. The General Staff protests bitterly, but the systems men believe a smaller, modern army is a stronger one."
 COLDWAR_SOV_sd_cocom_relaxation:0 "Lift the CoCom Lists"
 COLDWAR_SOV_sd_cocom_relaxation_desc:0 "Since 1949 the Western Coordinating Committee for Multilateral Export Controls, CoCom, has kept advanced technology out of Soviet hands. The Directorate offers Washington a bargain: closer economic cooperation, scientific exchange and political predictability in return for easing the embargo lists on computers and electronics. Whether the Americans accept depends on how far they trust the new men in Moscow."
 COLDWAR_SOV_sd_the_future_of_the_directorate:0 "The Future of the Directorate"
 COLDWAR_SOV_sd_the_future_of_the_directorate_desc:0 "The Directorate has transformed the Union, but its rule rests on no mandate other than competence. Some systems men want to make their rule permanent and institutionalise technocratic government; others believe the modern society they have created now needs a parliament, elections and the rule of law. The Directorate must decide whether it is a transition or a destination."
 COLDWAR_SOV_sd_the_permanent_directorate:0 "The Permanent Directorate"
 COLDWAR_SOV_sd_the_permanent_directorate_desc:0 "The systems men decide that their rule is not a transition. The Directorate becomes a permanent institution of state, its members co-opted on the basis of qualifications and its decisions binding on every ministry. Parliament and parties remain decorative. The Union becomes a managed society in which experts govern, and the citizen's role is to work, consume and trust the system."
 COLDWAR_SOV_sd_hand_over_to_parliament:0 "Hand Over to Parliament"
 COLDWAR_SOV_sd_hand_over_to_parliament_desc:0 "The Directorate concludes that its historic task has been fulfilled. A modern economy and an educated society, its members reason, can no longer be governed from closed offices. Free elections are called, the Supreme Soviet is transformed into a real parliament and power is handed to the liberals of the Committee for Human Rights. The technocrats step back, hoping their reforms will outlive their rule."
 COLDWAR_SOV_sd_the_managed_union:0 "The Managed Union"
 COLDWAR_SOV_sd_the_managed_union_desc:0 "Gvishiani's dream has come true: the Soviet Union is governed as one great system, its economy steered by data, models and professional managers. Productivity and science flourish, and the Union has become a respected partner of the West in technology and trade. Whether this managed union is still socialism, or something altogether new, is a question its leaders no longer find important."
 COLDWAR_SOV_nts_the_solidarists_return:0 "The Solidarists Return"
 COLDWAR_SOV_nts_the_solidarists_return_desc:0 "For forty years the People's Labour Union, the NTS, worked from exile, first in Belgrade and later in Frankfurt, where its Posev publishing house smuggled books and leaflets into the Union. Now the Solidarists return home, not as a hunted underground but as a governing party. Their doctrine of solidarism promises a third way between communism and capitalism, rooted in Russian tradition and Christian ethics."
 COLDWAR_SOV_nts_the_church_restored:0 "The Church Restored"
 COLDWAR_SOV_nts_the_church_restored_desc:0 "Since Khrushchev's anti-religious campaign closed thousands of churches, the Russian Orthodox Church has survived as a tolerated but closely watched institution. The NTS restores its freedom: confiscated churches and monasteries are returned, seminaries reopen and the Patriarch of Moscow becomes a respected voice in public life. Some even speak openly of the House of Romanov again, a name that was taboo for half a century."
 COLDWAR_SOV_nts_private_property:0 "Private Property Restored"
 COLDWAR_SOV_nts_private_property_desc:0 "Solidarism regards private property as the foundation of human dignity and responsibility. Small businesses, workshops, shops and service enterprises are returned to private hands, and citizens may once again own land, a house and the tools of their own trade. The nomenklatura, which controlled all property in the name of the people, loses the very basis of its power."
 COLDWAR_SOV_nts_the_model:0 "Solidarism or Free Market?"
 COLDWAR_SOV_nts_the_model_desc:0 "The NTS leadership is divided over the economy. The old guard of the Solidarists wants an organic, corporate order in which employers, workers and the state cooperate through professional chambers. Younger members, inspired by the West German economic miracle, call for a genuine free market. The decision will shape the new Russia for generations."
 COLDWAR_SOV_nts_solidarist_corporatism:0 "Solidarist Corporatism"
 COLDWAR_SOV_nts_solidarist_corporatism_desc:0 "The Solidarists choose their original doctrine. Society is organised into professional corporations in which entrepreneurs, employees and the state negotiate wages, prices and working conditions together. Class struggle is to be replaced by solidarity, and the trade unions, freed from party control, become genuine partners rather than transmission belts. Critics fear the system is too slow and too comfortable for those already inside it."
 COLDWAR_SOV_nts_free_market_russia:0 "A Free Market"
 COLDWAR_SOV_nts_free_market_russia_desc:0 "The younger generation of the NTS prevails. Prices are freed, state enterprises are opened to competition and the ruble is set on the road towards convertibility. The model is Ludwig Erhard's West Germany, which rose from ruins within a single decade. The transition is painful and old certainties disappear, but the market promises a prosperity the plan never delivered."
 COLDWAR_SOV_nts_decollectivisation:0 "Decollectivisation"
 COLDWAR_SOV_nts_decollectivisation_desc:0 "The kolkhozy and sovkhozy were born of Stalin's war against the peasantry, and the NTS regards them as a crime that must be undone. Collective farms are dissolved, their land divided among the families who work it, and the peasant becomes a free farmer once more. The transition will be chaotic, but for the first time since 1929 the Russian village belongs to those who till its soil."
 COLDWAR_SOV_nts_the_constituent_assembly:0 "The Constituent Assembly"
 COLDWAR_SOV_nts_the_constituent_assembly_desc:0 "In January 1918 the Bolsheviks dispersed the only freely elected Constituent Assembly in Russian history after a single session. The NTS now convenes a new one. Elected by universal suffrage, it is to give the country a constitution, decide the form of the state and settle the relationship between the peoples of the old Union. It is the long-delayed answer to 1918."
 COLDWAR_SOV_nts_into_the_west:0 "Into the West"
 COLDWAR_SOV_nts_into_the_west_desc:0 "The NTS has always seen Russia as part of Christian Europe, and its leaders spent decades in exile in the West. The new government breaks with the Eastern bloc and seeks a place alongside the Western democracies. In Bonn, where the NTS has long had friends, the decision is greeted with particular relief. The Cold War, at least as the world has known it, is coming to an end."
 COLDWAR_SOV_nts_the_republics_question:0 "The Republics Question"
 COLDWAR_SOV_nts_the_republics_question_desc:0 "The Union was held together by the party and the army; without the communist monopoly, its fifteen republics face a fundamental question. Should the new Russia become a nation state that lets the other peoples go their own way, or can the old Union be transformed into a voluntary association of free nations? The answer will redraw the map of Eurasia."
 COLDWAR_SOV_nts_a_russian_federation:0 "A Russian Federation"
 COLDWAR_SOV_nts_a_russian_federation_desc:0 "The NTS chooses Russia over empire. The new government offers every union republic the right to determine its own future, while Russia itself is reorganised as a democratic federation. In Kiev, Tbilisi, Vilnius and Tashkent the offer is received with astonishment, and in some places with jubilation. Russia becomes smaller, but it is no longer a prison of nations."
 COLDWAR_SOV_nts_a_union_of_nations:0 "A Union of Nations"
 COLDWAR_SOV_nts_a_union_of_nations_desc:0 "The NTS decides to keep the peoples of the old Union together, but on an entirely new basis. Instead of the dictatorship of a party, a voluntary association of equal nations is to emerge, with common defence, a common market and broad autonomy for each member. Not every republic is convinced, but many leaders see more advantages than dangers in remaining together."
 COLDWAR_SOV_nts_the_new_russia:0 "The New Russia"
 COLDWAR_SOV_nts_the_new_russia_desc:0 "Half a century after the revolution, Russia has found its way back to itself. A free economy, a restored church and a government that grew out of the emigration have created a state the old exiles in Frankfurt and Paris could only dream of. The new Russia is a partner of the West, proud of its past and finally able to look to the future."
 COLDWAR_SOV_chr_the_committee_governs:0 "The Committee Governs"
 COLDWAR_SOV_chr_the_committee_governs_desc:0 "In November 1970 Andrei Sakharov, Valery Chalidze and Andrei Tverdokhlebov founded the Committee for Human Rights in the USSR, a tiny circle of scientists defending the constitution against the state. Now this committee governs. Its programme rests on Sakharov's idea of convergence: socialism and capitalism must learn from each other, disarm and cooperate if humanity is to survive."
 COLDWAR_SOV_chr_release_the_prisoners:0 "Release the Prisoners of Conscience"
 COLDWAR_SOV_chr_release_the_prisoners_desc:0 "Thousands of Soviet citizens sit in labour camps and psychiatric hospitals for their opinions, their faith or their national aspirations. The new government opens the gates: political prisoners are amnestied, the special psychiatric hospitals are investigated and the Chronicle of Current Events can finally be published openly. The West applauds, while the KGB watches in disbelief as its opponents walk free."
 COLDWAR_SOV_chr_end_the_party_monopoly:0 "End the Party Monopoly"
 COLDWAR_SOV_chr_end_the_party_monopoly_desc:0 "For half a century the Communist Party has claimed the leading role in Soviet society without any vote ever confirming it. The Committee abolishes this monopoly: new parties may form, candidates may compete and the Supreme Soviet will be chosen in free and secret elections. The nomenklatura sees its world collapse, and many communists face the unaccustomed task of persuading voters."
 COLDWAR_SOV_chr_the_economic_question:0 "Convergence or Social Market?"
 COLDWAR_SOV_chr_the_economic_question_desc:0 "Sakharov's convergence theory leaves an open question: how far should the economy move towards the market? Some members of the Committee want a mixed economy in which private and state enterprises compete as equals. Others prefer the West German or Scandinavian social market, where a strong welfare state cushions the effects of competition. Both camps agree that the old plan cannot continue unchanged."
 COLDWAR_SOV_chr_the_convergence_economy:0 "The Convergence Economy"
 COLDWAR_SOV_chr_the_convergence_economy_desc:0 "The Committee chooses convergence in its purest form. State enterprises are given autonomy, private and cooperative businesses are legalised, and market prices take over where planning has failed. The economy becomes a hybrid of socialist and capitalist elements, just as Sakharov predicted in his 1968 essay. Supporters see the future of both systems; opponents see neither one thing nor the other."
 COLDWAR_SOV_chr_the_social_market:0 "The Social Market"
 COLDWAR_SOV_chr_the_social_market_desc:0 "The Committee chooses the social market. Competition and private initiative are permitted, but within a strong framework of social security: guaranteed pensions, free healthcare, unemployment insurance and collective bargaining. The aim is to give Soviet citizens the freedom of the West without taking away the security they have grown accustomed to. It is expensive, but it keeps the country stable."
 COLDWAR_SOV_chr_the_rule_of_law:0 "The Rule of Law"
 COLDWAR_SOV_chr_the_rule_of_law_desc:0 "Valery Chalidze and his colleagues have always insisted that the Soviet constitution is a decent document that is simply never applied. The Committee now makes it binding: courts become independent, the procuracy is placed under legal control, and arbitrary arrests and telephone justice are forbidden. Officials discover, to their surprise, that the law applies to them as well."
 COLDWAR_SOV_chr_a_free_press:0 "A Free Press"
 COLDWAR_SOV_chr_a_free_press_desc:0 "For decades the censors of Glavlit have shaped every newspaper, book and film in the Union. The Committee abolishes censorship. Samizdat authors publish openly, new newspapers appear and foreign radio stations are no longer jammed. The state loses its monopoly on truth, and with it much of its ability to steer public opinion, but science and culture flourish in the new freedom."
 COLDWAR_SOV_chr_disarmament:0 "Disarmament"
 COLDWAR_SOV_chr_disarmament_desc:0 "Sakharov, the father of the Soviet hydrogen bomb, has long warned that the arms race threatens the survival of humanity. The Committee acts on his conviction: defence spending is cut drastically, divisions are disbanded and the Union declares itself ready to make unilateral gestures in nuclear disarmament. The generals are outraged, but the world takes notice of a superpower that disarms of its own accord."
 COLDWAR_SOV_chr_the_convergence_treaty:0 "The Convergence Treaty"
 COLDWAR_SOV_chr_the_convergence_treaty_desc:0 "Convergence cannot be the work of one side alone. The Committee proposes a comprehensive treaty to Washington: mutual reductions in strategic arms, joint scientific programmes and a gradual opening of both societies to each other. It would be the greatest step towards lasting peace since 1945. Whether the United States is willing to take the outstretched hand remains to be seen."
 COLDWAR_SOV_chr_the_union_question:0 "The Right to Leave"
 COLDWAR_SOV_chr_the_union_question_desc:0 "Since 1936 the Soviet constitution has guaranteed each union republic the right to secede, a right that was never meant to be used. The Committee, which takes the constitution at its word, must now decide whether to let the republics actually exercise it, or to keep them together in a reformed democratic federation. Neither choice will be easy, and both will be contested."
 COLDWAR_SOV_chr_the_right_of_secession:0 "The Right of Secession"
 COLDWAR_SOV_chr_the_right_of_secession_desc:0 "The Committee honours the constitution to the letter. Every union republic is free to hold a referendum and leave the Union if its people so wish. In the Baltic republics, the Caucasus and Ukraine, national movements prepare to vote. Moscow accepts that a Union held together by force cannot be a democratic one, even if this means the end of the old state."
 COLDWAR_SOV_chr_a_democratic_federation:0 "A Democratic Federation"
 COLDWAR_SOV_chr_a_democratic_federation_desc:0 "The Committee seeks to preserve the Union on a democratic basis. A new treaty of union gives the republics broad self-government, their own freely elected parliaments and guaranteed rights for minorities, while foreign policy, defence and currency remain common. The hope is that peoples who suffered together under Stalin will choose to build a free federation together as well."
 COLDWAR_SOV_chr_join_the_free_world:0 "Join the Free World"
 COLDWAR_SOV_chr_join_the_free_world_desc:0 "Having embraced democracy, human rights and the rule of law, the new Soviet Union no longer sees any reason to stand against the West. The Committee leaves the logic of bloc confrontation behind and seeks partnership with the democratic world. For the first time since 1945, Moscow and Washington stand on the same side, and the Iron Curtain begins to lift."
 COLDWAR_SOV_chr_the_open_society:0 "The Open Society"
 COLDWAR_SOV_chr_the_open_society_desc:0 "The Soviet Union has become an open society, with free elections, a free press, independent courts and open borders. Sakharov's vision of convergence has become reality, and the country that once frightened the world is now among its most active partners in science and diplomacy. Many problems remain, but they are debated openly rather than hidden behind closed doors."
 COLDWAR_SOV_uds_socialist_democracy:0 "Socialist Democracy"
 COLDWAR_SOV_uds_socialist_democracy_desc:0 "Roy Medvedev, the historian whose manuscript 'Let History Judge' documented Stalin's crimes, has always believed that socialism and democracy belong together. His Union of Democratic Socialists now governs. It does not want to abolish socialism, but to free it from bureaucracy and dictatorship, in the spirit of the Prague Spring and the reform communists of Western Europe."
 COLDWAR_SOV_uds_multi_party_socialism:0 "Multi-Party Socialism"
 COLDWAR_SOV_uds_multi_party_socialism_desc:0 "Medvedev's central demand is pluralism within socialism. New parties are allowed, provided they accept the socialist foundations of the constitution: social democrats, agrarians, Christian socialists and independent Marxists. The Communist Party must compete for votes like any other. Critics on the right call it a half-measure, while critics on the left call it the beginning of the end."
 COLDWAR_SOV_uds_the_rehabilitations:0 "The Rehabilitations"
 COLDWAR_SOV_uds_the_rehabilitations_desc:0 "Medvedev's 'Let History Judge' becomes state policy. The archives are opened, the victims of the purges are rehabilitated by name, and the roles of Stalin, Beria and their accomplices are examined in public. Khrushchev's secret speech of 1956 was only a beginning; now the full truth is spoken. It is painful and unsettling, but the party believes that only honesty can restore its credibility."
 COLDWAR_SOV_uds_the_model:0 "Rome or Stockholm?"
 COLDWAR_SOV_uds_the_model_desc:0 "Democratic socialism can take many forms, and the government looks westwards for inspiration. Some favour the path of Luigi Longo and Enrico Berlinguer's Italian Communist Party, which combines Marxism with parliamentary democracy and independence from Moscow. Others prefer the Sweden of Olof Palme, a social democracy that has achieved prosperity and equality without revolution. The choice will shape the new Soviet socialism."
 COLDWAR_SOV_uds_eurocommunist_alliance:0 "The Eurocommunist Alliance"
 COLDWAR_SOV_uds_eurocommunist_alliance_desc:0 "The government chooses Rome. Close ties are forged with the Italian and French Communist Parties, which have long sought a democratic road to socialism free of Moscow's tutelage. Together they form a new current within the world communist movement, one that respects elections, civil liberties and national paths. In Western Europe the Soviet Union suddenly appears as an ally of reform rather than its enemy."
 COLDWAR_SOV_uds_the_scandinavian_model:0 "The Scandinavian Model"
 COLDWAR_SOV_uds_the_scandinavian_model_desc:0 "The government chooses Stockholm. Following the example of Olof Palme's Sweden, it builds a generous welfare state with comprehensive health insurance, housing programmes, decent pensions and equal opportunities in education. Market mechanisms are tolerated where they serve society, but social justice remains the goal. It is an expensive model, but it creates a broad base of satisfied citizens and social peace."
 COLDWAR_SOV_uds_workers_participation:0 "Workers' Participation"
 COLDWAR_SOV_uds_workers_participation_desc:0 "Socialist democracy must not stop at the factory gates. Workers' councils are elected in every enterprise, with the right to take part in decisions on production, wages and the appointment of managers. The model draws on Yugoslav self-management and West German co-determination. Productivity rises as workers gain a real stake in their enterprises, and the trade unions rediscover their purpose."
 COLDWAR_SOV_uds_cut_the_defence_budget:0 "Cut the Defence Budget"
 COLDWAR_SOV_uds_cut_the_defence_budget_desc:0 "The Soviet military absorbs resources that the economy and the consumer urgently need. The government cuts the defence budget, reduces conventional forces in Central Europe and redirects funds to housing, healthcare and consumer goods. The General Staff warns of weakness, but the government is convinced that the greatest threat to socialism is not NATO but the empty shelves of Soviet shops."
 COLDWAR_SOV_uds_detente_partners:0 "Detente Partners"
 COLDWAR_SOV_uds_detente_partners_desc:0 "Willy Brandt's new eastern policy and Olof Palme's active neutrality show that social democrats in the West are looking for partners in the East. The government offers Bonn and Stockholm a special relationship: political dialogue, trade agreements and cooperation between parties that share the goal of a democratic socialism. The Moscow Treaty of August 1970 could become the start of something much bigger."
 COLDWAR_SOV_uds_the_final_question:0 "How Far?"
 COLDWAR_SOV_uds_the_final_question_desc:0 "The reforms have transformed the Union, but one question remains open. Should socialism stay the fixed foundation of the state, with pluralism only within its boundaries, or should the people be free to choose any path, including a return to capitalism? Medvedev himself is a convinced socialist, but many in his party believe that democracy cannot be limited by any doctrine."
 COLDWAR_SOV_uds_socialism_remains:0 "Socialism Remains"
 COLDWAR_SOV_uds_socialism_remains_desc:0 "The government decides that democracy will remain socialist. The socialist foundations of the economy stay enshrined in the constitution, and parties that reject them are not admitted to elections. Within these boundaries, debate is free and lively. Supporters see this as the true fulfilment of Lenin's promise of soviet democracy; critics see a democracy with a safety catch."
 COLDWAR_SOV_uds_full_democracy:0 "Full Democracy"
 COLDWAR_SOV_uds_full_democracy_desc:0 "The government decides that democracy cannot have limits. All restrictions on parties are lifted, including on those that question socialism itself, and the people will decide in free elections which economic and political order they want. It is a bold gamble that could end with the voters rejecting the very socialism the reformers set out to save."
 COLDWAR_SOV_uds_socialism_with_a_human_face:0 "Socialism with a Human Face"
 COLDWAR_SOV_uds_socialism_with_a_human_face_desc:0 "What Alexander Dubcek attempted in Prague in 1968, and what Soviet tanks crushed that August, has now come true in Moscow itself. Socialism has become democratic, open and humane, guided by the will of the people rather than the dictates of a bureaucracy. Eurocommunists in the West look on with admiration, and many in Eastern Europe dare to hope again."
 COLDWAR_SOV_gt_the_planners_govern:0 "The Planners Govern"
 COLDWAR_SOV_gt_the_planners_govern_desc:0 "Nikolai Baibakov has led the State Planning Committee since 1965 and knows the Soviet economy better than any member of the Politburo. Now Gosplan itself takes power. The planners have no interest in ideological debates; they want balanced plans, reliable supply chains and efficient investment. The party's political role shrinks, and the country is run like a giant enterprise with Gosplan as its board of directors."
 COLDWAR_SOV_gt_ideology_retired:0 "Ideology Retired"
 COLDWAR_SOV_gt_ideology_retired_desc:0 "The technocrats have no use for slogans. Marxism-Leninism remains the official doctrine in textbooks and on banners, but it no longer guides decisions. Party secretaries lose their influence over economic questions, ideological commissions are reduced to ceremony and economic necessity becomes the only criterion. Many in the nomenklatura feel the ground slipping beneath their feet."
 COLDWAR_SOV_gt_the_material_balances:0 "The Material Balances"
 COLDWAR_SOV_gt_the_material_balances_desc:0 "The method of material balances has been the backbone of Soviet planning since the 1930s: every ton of steel, every kilowatt and every machine must be matched between producers and consumers. Under the technocrats it is refined with computers, input-output tables and the linear programming of Leonid Kantorovich. Shortages and bottlenecks diminish as the plan finally becomes coherent."
 COLDWAR_SOV_gt_the_model:0 "Engineers or Resources?"
 COLDWAR_SOV_gt_the_model_desc:0 "The planners must set a long-term strategy. One school wants to make the Union an engineering power that modernises its factories, invests in machine tools and competes on quality. The other wants to exploit the vast oil and gas fields of Western Siberia, discovered at Samotlor and Urengoy in the 1960s, and finance development through raw material exports. Both paths have their price."
 COLDWAR_SOV_gt_the_engineers_state:0 "The Engineers' State"
 COLDWAR_SOV_gt_the_engineers_state_desc:0 "The planners choose the path of the engineers. Investment flows into machine building, instrument making, chemistry and electronics, and Soviet industry is equipped with modern machine tools and automated lines. The goal is an economy that lives not from the export of raw materials but from its own technical excellence. It is a long and expensive road, but it promises lasting independence."
 COLDWAR_SOV_mod_resource_export_multiplier_modifier_tt:0 "Resource Export Revenue: $RIGHT|+=%1$"
 COLDWAR_SOV_gt_the_resource_state:0 "The Resource State"
 COLDWAR_SOV_gt_the_resource_state_desc:0 "The planners choose the path of resources. The oil fields of Western Siberia and the gas fields of the Far North are developed at full speed, pipelines are laid towards Europe and the hard currency they earn pays for imported machinery and grain. The gas-for-pipes agreement signed with West Germany in 1970 is only the beginning. The Union becomes an energy superpower, for better or worse."
 COLDWAR_SOV_gt_siberian_projects:0 "Siberian Projects"
 COLDWAR_SOV_gt_siberian_projects_desc:0 "The vast territories beyond the Urals hold the Union's future wealth, but they lack roads, railways and towns. The planners launch a series of great Siberian projects: new rail lines, hydroelectric plants on the Angara and Yenisei, and territorial production complexes that combine mining, energy and industry. The costs are enormous, but the planners think in decades rather than five-year plans."
 COLDWAR_SOV_gt_military_conversion:0 "Military Conversion"
 COLDWAR_SOV_gt_military_conversion_desc:0 "The military-industrial complex consumes the best engineers, materials and factories of the Union, while consumers wait years for a refrigerator. The planners order part of the defence industry converted to civilian production: tank plants turn out tractors, aircraft works build household appliances and missile designers work on consumer electronics. The arms lobby resists, and the transition proves harder than expected."
 COLDWAR_SOV_mod_globalism_equilibrium_tt:0 "Globalism Equilibrium: $RIGHT|+=0$"
 COLDWAR_SOV_gt_trade_with_all:0 "Trade with All"
 COLDWAR_SOV_gt_trade_with_all_desc:0 "Ideology has no place in the planners' trade policy. The Union buys and sells wherever conditions are favourable, from West Germany and Japan to the Arab world and Latin America, and perhaps one day even China. Political considerations take a back seat to economic advantage. Foreign trade organisations gain greater autonomy, and Soviet goods appear in markets where they were never seen before."
 COLDWAR_SOV_gt_the_future:0 "Technocracy Forever?"
 COLDWAR_SOV_gt_the_future_desc:0 "Gosplan's rule has brought order to the economy, but it rests on neither ideological nor democratic legitimacy. The planners must decide whether to make their rule permanent, as a government of experts without ideology, or to hand political power back to the party, which has kept its structures and members across the whole country. Either way, the planners intend to keep the plan."
 COLDWAR_SOV_gt_permanent_technocracy:0 "Permanent Technocracy"
 COLDWAR_SOV_gt_permanent_technocracy_desc:0 "The planners decide to stay. Gosplan becomes the supreme organ of state, the party is reduced to a mass organisation for mobilisation and education, and real power rests with economists, engineers and statisticians. The Union becomes a state without ideology, governed by figures and forecasts. It is efficient and stable, but its citizens have no voice in it."
 COLDWAR_SOV_gt_return_to_party_rule:0 "Return to Party Rule"
 COLDWAR_SOV_gt_return_to_party_rule_desc:0 "The planners decide that their task is fulfilled. The economy has been put in order, and political leadership returns to the Communist Party of the Soviet Union, which kept its structures and members throughout the technocratic interlude. The new party leadership inherits a stronger economy, and many planners return quietly to their offices in the Gosplan building on Marx Prospect."
 COLDWAR_SOV_gt_the_planned_society:0 "The Planned Society"
 COLDWAR_SOV_gt_the_planned_society_desc:0 "The planned society has become reality. Every factory, every city and every resource fits into a coherent system steered from Gosplan, and the old dream of a rationally organised economy has finally been realised. Shortages have become rare and growth steady. Whether this is still the socialism of Lenin or simply the triumph of the engineers is a question the planners do not care to debate."
 COLDWAR_SOV_lnl_live_not_by_lies:0 "Live Not by Lies"
 COLDWAR_SOV_lnl_live_not_by_lies_desc:0 "Alexander Solzhenitsyn, Nobel laureate of 1970 and author of 'One Day in the Life of Ivan Denisovich', has always demanded one thing above all: never to take part in the lie. His followers now govern the country. Their programme is authoritarian and Orthodox, rejects Marxism as a foreign doctrine and places Russia's spiritual and national recovery above any global mission."
 COLDWAR_SOV_lnl_letter_to_the_soviet_leaders:0 "Letter to the Soviet Leaders"
 COLDWAR_SOV_lnl_letter_to_the_soviet_leaders_desc:0 "In his Letter to the Soviet Leaders, Solzhenitsyn called on the Kremlin to abandon Marxist ideology, give up the empire, develop the Russian North-East and grant religious and cultural freedom. What was once an unanswered appeal from a persecuted writer is now the programme of government. The party is stripped of its ideological monopoly, and the nomenklatura loses its claim to rule."
 COLDWAR_SOV_lnl_the_north_east:0 "Develop the North-East"
 COLDWAR_SOV_lnl_the_north_east_desc:0 "Solzhenitsyn believed that Russia's future lay not in foreign adventures but in its own vast and undeveloped North-East. The government turns towards Siberia and the Far East: new settlements, roads and railways open up the land, and its resources are developed carefully for the benefit of the Russian people rather than the arms race. A new frontier opens for a generation in search of purpose."
 COLDWAR_SOV_lnl_the_form:0 "Orthodoxy or Zemstvo?"
 COLDWAR_SOV_lnl_the_form_desc:0 "Solzhenitsyn's followers agree that Russia needs an authoritarian but lawful government for the transition. Some want to build this order on the Orthodox Church as the moral foundation of state and society. Others want to revive the zemstvo, the local self-government created by the reforms of Alexander II, so that Russians learn to govern themselves from the bottom up. The choice will shape the new state."
 COLDWAR_SOV_lnl_authoritarian_orthodoxy:0 "Authoritarian Orthodoxy"
 COLDWAR_SOV_lnl_authoritarian_orthodoxy_desc:0 "The government chooses Orthodoxy as the foundation of the new order. The Church becomes the moral authority of the state, religious instruction returns to the schools and the government sees itself as the guardian of Russian spiritual tradition. Firm authority is justified as necessary for a people that must first recover from decades of lies. Dissent, now judged by religious rather than socialist standards, is still not welcome."
 COLDWAR_SOV_lnl_the_zemstvo:0 "The Zemstvo Revived"
 COLDWAR_SOV_lnl_the_zemstvo_desc:0 "The government chooses the zemstvo. Following the model of the 1864 reform, elected local assemblies take over responsibility for schools, roads, hospitals and agriculture in the districts and provinces. Moscow retains authority over the great questions of state, but Russians learn to manage their own affairs locally. The bureaucracy shrinks, and a modest civic life returns to the provinces."
 COLDWAR_SOV_lnl_end_the_foreign_adventures:0 "End the Foreign Adventures"
 COLDWAR_SOV_lnl_end_the_foreign_adventures_desc:0 "Solzhenitsyn argued that the Union was squandering its strength in Cuba, Vietnam, the Middle East and Eastern Europe while the Russian village decayed. The government ends this policy: aid to distant regimes is cut, military advisers are recalled and the satellites are told they must find their own way. Influence abroad declines, but resources are freed for Russia itself."
 COLDWAR_SOV_lnl_the_village_restored:0 "The Village Restored"
 COLDWAR_SOV_lnl_the_village_restored_desc:0 "The writers of village prose, Valentin Rasputin, Vasily Belov and Vasily Shukshin, have mourned the dying Russian village for years. The government makes its revival a national priority: the Non-Black Earth Zone receives roads, schools and investment, collective farmers gain more freedom over their land, and young families are encouraged to return to the countryside. Russia seeks its roots in its own soil."
 COLDWAR_SOV_lnl_release_the_republics:0 "Release the Non-Slavic Republics"
 COLDWAR_SOV_lnl_release_the_republics_desc:0 "In 'Rebuilding Russia' Solzhenitsyn would argue that Russia no longer has the strength to hold the Baltic, the Caucasus and Central Asia against their will. Twenty years earlier, his followers in power reach the same conclusion: better to let these peoples go in peace than to keep spending Russian blood and wealth on an empire that drains its own heartland. Riga, Tbilisi and Tashkent are offered the right to leave."
 COLDWAR_SOV_lnl_the_slavic_question:0 "The Slavic Question"
 COLDWAR_SOV_lnl_the_slavic_question_desc:0 "With the non-Slavic periphery released, a harder question remains: what of Ukraine, Belorussia and the Russian-settled north of Kazakhstan? Solzhenitsyn regards the three East Slavic peoples as branches of a single nation that grew from Kievan Rus. Whether they can be persuaded to stay together with Russia, or whether Russia must learn to stand alone, will define the new state."
 COLDWAR_SOV_lnl_the_slavic_union:0 "The Slavic Union"
 COLDWAR_SOV_lnl_the_slavic_union_desc:0 "Moscow proposes a voluntary union of the Russian, Ukrainian and Belorussian peoples, with Kazakhstan invited to join, bound together by a common faith, history and language rather than by Marxist ideology. Kiev, Minsk and Alma-Ata are free to accept or refuse. If they agree, the old Soviet Union will give way to a smaller and more natural community of kindred nations."
 COLDWAR_SOV_lnl_russia_alone:0 "Russia Alone"
 COLDWAR_SOV_lnl_russia_alone_desc:0 "If the Slavic brothers will not come, Russia will not beg. Solzhenitsyn has always insisted that the Russian people must first heal themselves, and a Russia within her own borders, free of imperial burdens, may yet prove stronger than the sprawling Union ever was. The RSFSR turns inward to rebuild its villages, its churches and its conscience."
 COLDWAR_SOV_lnl_repentance_and_self_limitation:0 "Repentance and Self-Limitation"
 COLDWAR_SOV_lnl_repentance_and_self_limitation_desc:0 "In his 1973 essay 'Repentance and Self-Limitation in the Life of Nations', Solzhenitsyn called on Russia to acknowledge the crimes of the Soviet era and to turn away from external expansion toward inner development. The state now adopts this creed as its own: modest ambitions abroad, moral renewal at home and a quiet return to the Orthodox faith and the Russian land."
 COLDWAR_SOV_rd_the_directors_take_over:0 "The Directors Take Over"
 COLDWAR_SOV_rd_the_directors_take_over_desc:0 "The men who truly run the Soviet economy sit not in the Politburo but in the director's offices of the great combines and ministries. Backed by Interior Minister Nikolai Shchelokov and his MVD, the red directors step out of the shadows and take the reins of government, promising efficiency and prosperity while quietly securing their own share of the people's property."
 COLDWAR_SOV_rd_shadow_capitalism:0 "Shadow Capitalism Legalised"
 COLDWAR_SOV_rd_shadow_capitalism_desc:0 "Underground workshops, unrecorded production lines and networks of blat have kept Soviet shelves from emptying for decades. Instead of hunting the tsekhoviki and speculators, the new leadership brings them into the light and taxes what was once prosecuted. Critics call it the legalisation of theft; the directors call it realism, and the shadow economy has never been so confident."
 COLDWAR_SOV_rd_the_mvd_state:0 "The MVD State"
 COLDWAR_SOV_rd_the_mvd_state_desc:0 "Nikolai Shchelokov has turned the Ministry of Internal Affairs into a power base to rival the KGB, with its own troops, its own informants and its own share of the shadow economy. Under the directors' rule the militsiya becomes the backbone of the state, guarding order on the streets and the interests of its patrons in the ministries."
 COLDWAR_SOV_rd_the_model:0 "Nomenklatura or Clans?"
 COLDWAR_SOV_rd_the_model_desc:0 "Two visions of the directors' state compete. The Moscow nomenklatura wants to convert its offices into ownership, turning ministries into holding companies. The republican clans of Tashkent, Baku and Alma-Ata prefer the old ways of patronage, tribute and family loyalty. The directors must decide whose hands will hold the wealth of the Union."
 COLDWAR_SOV_rd_nomenklatura_privatisation:0 "Nomenklatura Privatisation"
 COLDWAR_SOV_rd_nomenklatura_privatisation_desc:0 "Ministers become chairmen, departments become concerns, and the officials who once managed state property quietly acquire it. Two decades before it happened historically, the nomenklatura privatises the Soviet economy from within, trading Party cards for share certificates. Productivity may rise, but ordinary citizens begin to ask who now owns the factories they were told belonged to them."
 COLDWAR_SOV_rd_the_clan_economy:0 "The Clan Economy"
 COLDWAR_SOV_rd_the_clan_economy_desc:0 "In the republics, power has long rested on networks of kinship and patronage, from Sharaf Rashidov's Uzbekistan to Dinmukhamed Kunaev's Kazakhstan. Rather than fight these clans, Moscow embraces them: loyal republican bosses receive a free hand and a share of the spoils in exchange for keeping their fiefdoms quiet. Corruption deepens, but the Union holds together."
 COLDWAR_SOV_rd_cotton_and_caviar:0 "Cotton and Caviar"
 COLDWAR_SOV_rd_cotton_and_caviar_desc:0 "Uzbek cotton and Caspian caviar are worth their weight in hard currency, and both have long been skimmed through padded harvest reports and smuggling rings. The directors stop pretending otherwise and organise these trades for export, channelling the proceeds through friendly hands. The cotton scandal that would historically shake the Party in the 1980s becomes a business model instead."
 COLDWAR_SOV_mod_interest_rate_multiplier_modifier_tt:0 "Interest Rates: $RIGHT|-=2$ percentage points"
 COLDWAR_SOV_mod_office_park_income_tax_modifier_tt:0 "Office Income Tax: $RIGHT|+=%1$"
 COLDWAR_SOV_rd_the_directors_banks:0 "The Directors' Banks"
 COLDWAR_SOV_rd_the_directors_banks_desc:0 "Gosbank alone cannot serve the needs of the new economic masters. Enterprise funds and ministry accounts are pooled into commercial banks owned by the directors themselves, lending to friends, financing deals and moving money between the official and the shadow economy. Moscow gains its first modern office blocks, and with them a new class of Soviet bankers."
 COLDWAR_SOV_rd_western_accounts:0 "Western Accounts"
 COLDWAR_SOV_rd_western_accounts_desc:0 "The directors know that what the Party gives, the Party can take away. Through Vneshtorgbank, foreign trade missions and front companies in Vienna and Zurich, hard currency flows quietly into private accounts abroad. It is insurance against the next purge, paid for by the Soviet treasury, and it strengthens the shadow economy at the expense of public trust."
 COLDWAR_SOV_rd_the_question:0 "Who Owns the Union?"
 COLDWAR_SOV_rd_the_question_desc:0 "The factories have new masters, the banks new owners and the republics new lords. Now the directors must decide what kind of state will protect their gains: an openly governed corporate republic run by managers and bankers, or a populist order that buys social peace with generous handouts. The answer will settle who really owns the Soviet Union."
 COLDWAR_SOV_rd_the_directors_republic:0 "The Directors' Republic"
 COLDWAR_SOV_rd_the_directors_republic_desc:0 "The directors drop the pretence that the Party still governs. Enterprise managers, bankers and ministry chiefs take their seats as the true ruling council of the land, and the state is run like a holding company answerable to its largest shareholders. Profits flow upward, and the language of class struggle gives way to the language of balance sheets."
 COLDWAR_SOV_rd_buy_the_people:0 "Buy the People"
 COLDWAR_SOV_rd_buy_the_people_desc:0 "A regime of directors cannot rely on ideology or terror, so it relies on generosity. Higher wages, fuller shops, new flats and better pensions are handed out to keep the workers grateful and quiet while the elite enriches itself. It is an expensive bargain, but the directors calculate that contentment is cheaper than unrest."
 COLDWAR_SOV_rd_the_corporate_union:0 "The Corporate Union"
 COLDWAR_SOV_rd_the_corporate_union_desc:0 "The Soviet Union completes its quiet metamorphosis into a corporate state. The great combines, banks and trading houses now form the skeleton of the country, owned by those who once merely managed them, and the hammer and sickle survives mostly on letterheads. Efficient and profitable, the Corporate Union is also a land where wealth and power belong to very few."
 COLDWAR_SOV_fel_the_free_enterprise_cabinet:0 "The Free Enterprise Cabinet"
 COLDWAR_SOV_fel_the_free_enterprise_cabinet_desc:0 "A cabinet of young economists around Nikolai Shmelyov, the man who would one day write that the Soviet economy lives on advances and debts, takes office with a radical mandate. Their diagnosis is blunt: the planned economy cannot be repaired, only replaced. Markets, prices and private initiative are to achieve what Gosplan never could, whatever the cost in stability."
 COLDWAR_SOV_fel_free_the_prices:0 "Free the Prices"
 COLDWAR_SOV_fel_free_the_prices_desc:0 "For decades the state has fixed the price of everything from bread to tractors, and since 1969 a State Committee on Prices has guarded the system, leaving shortages, queues and a thriving black market. The new government abolishes administered prices in one stroke. Shelves will fill again, but for many families the price of a loaf will rise faster than their wages."
 COLDWAR_SOV_fel_the_rouble_convertible:0 "A Convertible Rouble"
 COLDWAR_SOV_fel_the_rouble_convertible_desc:0 "The Soviet rouble has never been a real currency abroad, its official rate a fiction maintained by Gosbank and the foreign trade monopoly. Making it convertible would tie the Union to world markets, open the door to foreign trade and expose every inefficient enterprise to honest prices. Western bankers are intrigued; the old guard of the Ministry of Foreign Trade is appalled."
 COLDWAR_SOV_fel_the_speed:0 "Shock or Steps?"
 COLDWAR_SOV_fel_the_speed_desc:0 "The reformers agree on the destination but not on the speed. One camp argues for a single decisive leap, liberalising everything at once before the bureaucracy can regroup. The other warns that a society raised on guaranteed jobs and fixed prices cannot survive such a jolt and urges a gradual transition. The cabinet must choose its pace."
 COLDWAR_SOV_fel_shock_therapy:0 "Shock Therapy"
 COLDWAR_SOV_fel_shock_therapy_desc:0 "Everything at once: prices, trade and enterprises are released in a single blow, as Russia would attempt two decades later in another timeline. The reformers bet that the pain will be sharp but short and that a functioning market will rise from the wreckage of the plan. Factories close, savings evaporate and the streets grow restless, but there is no turning back."
 COLDWAR_SOV_fel_step_by_step:0 "Step by Step"
 COLDWAR_SOV_fel_step_by_step_desc:0 "The cabinet chooses caution over speed. Markets are introduced sector by sector, beginning with services, light industry and agriculture, while heavy industry and basic prices remain under state control for now. Much as Hungary's reformers have done since 1968, the transition is meant to grow out of the plan rather than tear it down, buying time and public patience."
 COLDWAR_SOV_fel_voucher_privatisation:0 "Voucher Privatisation"
 COLDWAR_SOV_fel_voucher_privatisation_desc:0 "Two decades before Russia historically tried it, every Soviet citizen receives a voucher, a paper share in the national wealth that can be exchanged for stock in the enterprises being sold off. The idea is to make the people owners and to break the grip of the nomenklatura on state property. Whether workers keep their shares or sell them to the shrewdest bidders remains to be seen."
 COLDWAR_SOV_mod_foreign_influence_defense_modifier_tt:0 "Foreign Influence Defence: $RIGHT|+=%1$"
 COLDWAR_SOV_fel_open_to_investment:0 "Open to Investment"
 COLDWAR_SOV_fel_open_to_investment_desc:0 "Fiat helped build the great car plant at Togliatti; now the whole Union is open for business. Western firms are invited to set up joint ventures, buy into Soviet enterprises and lend to the state, with legal guarantees that their property will not be nationalised. The capital and technology are badly needed, though the foreign debt that comes with them may one day weigh heavily on Moscow."
 COLDWAR_SOV_fel_the_market_union:0 "The Market Union"
 COLDWAR_SOV_fel_the_market_union_desc:0 "The planned economy is gone. Prices are set by supply and demand, enterprises answer to owners and customers, and the rouble trades on world markets. The Union that Lenin founded has become something its founders would hardly recognise: a market economy still flying the red flag, prosperous for some, bewildering for many and irreversibly changed."
 COLDWAR_SOV_mod_renewable_energy_gain_multiplier_tt:0 "Renewable Energy Production: $RIGHT|+=%1$"
 COLDWAR_SOV_fob_the_green_cabinet:0 "The Green Cabinet"
 COLDWAR_SOV_fob_the_green_cabinet_desc:0 "Scientists, writers and engineers who have spent years defending Lake Baikal against the planners now find themselves in power. Inspired by the limnologist Grigory Galazy of the Limnological Institute in Irkutsk, the new cabinet declares that the Soviet people must stop conquering nature and start protecting it. Every gigantic project of Gosplan will be judged by a new measure: what it costs the land."
 COLDWAR_SOV_fob_save_baikal:0 "Save Baikal"
 COLDWAR_SOV_fob_save_baikal_desc:0 "Since 1966 the Baikalsk Pulp and Paper Mill has poured its waste into the deepest and oldest lake on Earth, home to the nerpa seal and hundreds of species found nowhere else. Scientists and writers across the Union have protested for years. The new government finally orders the mill closed, placing the purity of Baikal above the plan's demand for cellulose."
 COLDWAR_SOV_fob_stop_the_rivers:0 "Stop the River Reversal"
 COLDWAR_SOV_fob_stop_the_rivers_desc:0 "Soviet planners dream of reversing the great Siberian rivers, sending the waters of the Ob and Irtysh south through a vast canal to irrigate the cotton fields of Central Asia. Ecologists warn of flooded forests, a changed Arctic climate and drowned villages. The project is cancelled, to the relief of Siberia and the dismay of the Central Asian republics that counted on its water."
 COLDWAR_SOV_fob_the_path:0 "Green Socialism or Conservation?"
 COLDWAR_SOV_fob_the_path_desc:0 "The Friends of Baikal must decide what kind of movement they are. Some see ecology as the fulfilment of socialism, a planned economy that finally plans for the planet as well as for output. Others simply want to shield nature from industry, whatever the ideology, through strict laws and vast reserves. The choice will shape the green Union to come."
 COLDWAR_SOV_mod_health_cost_multiplier_modifier_tt:0 "Health Care Costs: $RIGHT|-=%1$"
 COLDWAR_SOV_fob_green_socialism:0 "Green Socialism"
 COLDWAR_SOV_fob_green_socialism_desc:0 "Planning, the reformers argue, is the perfect tool for ecology if only it aims at the right targets. Gosplan is ordered to account for clean water, forests and air alongside steel and grain, and the Party preaches harmony between man and nature as a socialist virtue. Consumers may wait a little longer for their goods, but their children will inherit a living land."
 COLDWAR_SOV_mod_non_electric_fuel_consumption_modifier_tt:0 "Non-Electric Fuel Consumption: $RIGHT|-=%1$"
 COLDWAR_SOV_fob_conservation_first:0 "Conservation First"
 COLDWAR_SOV_fob_conservation_first_desc:0 "The Soviet Union already has its strict nature reserves, some dating back to Lenin's time, but they have long been sacrificed to mines and logging. Now conservation comes first: new reserves are founded, mining is bound by tough environmental rules and no project may proceed without an ecological review. Nature, not output, becomes the first concern of the state."
 COLDWAR_SOV_fob_save_the_aral:0 "Save the Aral"
 COLDWAR_SOV_fob_save_the_aral_desc:0 "Fed by the Amu Darya and Syr Darya, the Aral Sea is already shrinking as Soviet cotton farms drink up its rivers. Hydrologists warn that within a generation it could become a salt desert poisoning Karakalpakstan and Kazakhstan. By curbing irrigation and restoring river flows, Moscow tries to save the sea and wins the gratitude of the peoples who live along its shores."
 COLDWAR_SOV_fob_close_semipalatinsk:0 "Close Semipalatinsk"
 COLDWAR_SOV_fob_close_semipalatinsk_desc:0 "Since 1949 the steppe near Semipalatinsk in Kazakhstan has been the main Soviet nuclear test site, scarred by hundreds of explosions whose fallout has sickened the surrounding villages. Closing the Polygon is a gesture of respect to the Kazakh people and a signal of goodwill to the world, though the generals and the weapons designers protest bitterly at losing their proving ground."
 COLDWAR_SOV_fob_the_rbmk_question:0 "The Reactor Question"
 COLDWAR_SOV_fob_the_rbmk_question_desc:0 "The RBMK, pride of Soviet nuclear engineering, is cheap to build and can be scaled to enormous size, and the first units are rising at Leningrad. Yet some physicists warn of a dangerous design flaw that could make the reactor run away under the wrong conditions. Heeding them means slower construction and less power, but it may spare a town called Chernobyl a terrible fate."
 COLDWAR_SOV_fob_the_green_union:0 "The Green Union"
 COLDWAR_SOV_fob_the_green_union_desc:0 "The Soviet Union becomes the first great power to place ecology at the heart of its state ideology. Clean rivers, protected forests and renewable power replace gigantomania as symbols of national pride, and Lake Baikal stands as the emblem of a new relationship between people and land. Abroad, the Green Union offers the world an unexpected vision of what socialism can become."
 COLDWAR_SOV_smc_the_market_socialists:0 "The Market Socialists"
 COLDWAR_SOV_smc_the_market_socialists_desc:0 "Alexander Yakovlev, acting head of the Central Committee's propaganda department, has long believed that socialism can be both efficient and humane. With his allies in power, the Soviet Union looks to Budapest and Belgrade rather than to its own dogmas, promising markets within a planned framework, more freedom for enterprises and less fear for citizens: socialism with a human face."
 COLDWAR_SOV_smc_an_early_glasnost:0 "An Early Glasnost"
 COLDWAR_SOV_smc_an_early_glasnost_desc:0 "Fifteen years before Gorbachev made it a watchword, the government embraces glasnost. The censors of Glavlit loosen their grip, newspapers may criticise mismanagement and banned writers return to the pages of Novy Mir. Scientists and engineers welcome the freer exchange of ideas, while the guardians of ideology warn that once people are allowed to speak, they may never stop."
 COLDWAR_SOV_smc_the_cooperative_law:0 "The Cooperative Law"
 COLDWAR_SOV_smc_the_cooperative_law_desc:0 "Instead of prosecuting the shadow economy, the reformers give it a legal form. Citizens may now found cooperatives, small collectively owned businesses running cafes, workshops, repair shops and taxis, as the Law on Cooperation would only allow in 1988 historically. The black market shrinks, services finally appear and a new class of socialist entrepreneurs is born."
 COLDWAR_SOV_smc_the_model:0 "Belgrade or Budapest?"
 COLDWAR_SOV_smc_the_model_desc:0 "Two models of reformed socialism lie to the west. Tito's Yugoslavia entrusts its factories to workers' councils that elect managers and share profits. Kádár's Hungary keeps state ownership but frees enterprises to respond to prices and profits under the New Economic Mechanism of 1968. Moscow must decide which experiment to follow on a continental scale."
 COLDWAR_SOV_smc_self_management:0 "Self-Management"
 COLDWAR_SOV_smc_self_management_desc:0 "Following the Yugoslav example, Soviet enterprises are handed to the people who work in them. Elected workers' councils appoint directors, set wages and decide how to invest their profits, while the trade unions gain real influence for the first time since the 1920s. Belgrade welcomes Moscow's late conversion to its heresy, and the Soviet worker becomes a co-owner in fact as well as in slogans."
 COLDWAR_SOV_smc_the_new_mechanism:0 "The New Economic Mechanism"
 COLDWAR_SOV_smc_the_new_mechanism_desc:0 "Hungary's New Economic Mechanism, designed by Rezső Nyers and launched in 1968, keeps the factories in state hands but lets them trade, set many of their own prices and keep their profits. Moscow adopts the model for the whole Union, replacing thousands of plan targets with a few broad guidelines. Kádár's quiet goulash communism becomes the blueprint for a superpower."
 COLDWAR_SOV_smc_open_to_the_world:0 "Open to the World"
 COLDWAR_SOV_smc_open_to_the_world_desc:0 "A socialism that can compete need not hide behind walls. Trade barriers come down, joint ventures with Western firms are encouraged and Soviet scientists, artists and tourists travel abroad more freely. Detente gains a new depth as the West discovers a Soviet Union more interested in exchange than in confrontation, and tensions between the blocs begin to ease."
 COLDWAR_SOV_smc_federal_reform:0 "Federal Reform"
 COLDWAR_SOV_smc_federal_reform_desc:0 "The Union has always been federal on paper and centralist in practice. The reformers take the constitution at its word, transferring real powers over budgets, culture and local industry from the Moscow ministries to the fifteen union republics. National elites gain a stake in the reformed Union, and the old charge of Russian domination loses some of its sting."
 COLDWAR_SOV_smc_the_question:0 "How Far the Market?"
 COLDWAR_SOV_smc_the_question_desc:0 "Market socialism has transformed the Soviet economy, but its architects disagree on where to stop. One faction wants to keep the commanding heights in public hands, with markets serving a socialist plan. The other argues that half-measures breed stagnation and that private property must be allowed to grow alongside the state. The reformers must decide how far the market may go."
 COLDWAR_SOV_smc_socialist_market:0 "A Socialist Market"
 COLDWAR_SOV_smc_socialist_market_desc:0 "The reform stops at the gates of private ownership. Enterprises compete, prices move and managers answer for profits, but the land, the banks and the great industries remain the property of society. It is a balance that Lenin's New Economic Policy once struck and Stalin abolished, now restored as the permanent foundation of Soviet socialism."
 COLDWAR_SOV_smc_the_mixed_economy:0 "The Mixed Economy"
 COLDWAR_SOV_smc_the_mixed_economy_desc:0 "The reformers go further than any socialist state before them. Private businesses may grow beyond family workshops, foreign capital may own shares and the state keeps only the strategic industries in its hands. Purists in the Party denounce a betrayal of October, but the result resembles the mixed economies of Western Europe more than anything Marx described."
 COLDWAR_SOV_smc_the_commonwealth:0 "The Commonwealth"
 COLDWAR_SOV_smc_the_commonwealth_desc:0 "The Socialist Market Commonwealth is complete: a voluntary association of reformed republics bound by a common market, shared institutions and a socialism that has learned to trust its citizens. The Soviet Union has become what the Prague reformers dreamed of in 1968, a state where economic freedom and social justice coexist. Whether the world believes it is another matter."
 COLDWAR_SOV_usr_a_union_of_sovereign_republics:0 "A Union of Sovereign Republics"
 COLDWAR_SOV_usr_a_union_of_sovereign_republics_desc:0 "Pyotr Shelest, First Secretary of the Communist Party of Ukraine, has long defended the language, culture and economic interests of his republic against Moscow's centralism. With his allies now leading the Union, a new idea takes hold: national communism, in which each republic builds socialism in its own way within a loose union of sovereign Soviet states."
 COLDWAR_SOV_usr_the_new_union_treaty:0 "The New Union Treaty"
 COLDWAR_SOV_usr_the_new_union_treaty_desc:0 "The Treaty of 1922 that created the Soviet Union is to be replaced by a new compact among equals. Each union republic is invited to sign, gaining wider powers over its economy, language and internal affairs while remaining within a common state. It is the bargain Gorbachev would offer too late in 1991, proposed while the Union is still strong enough to make it work."
 COLDWAR_SOV_usr_our_soviet_ukraine:0 "Our Soviet Ukraine"
 COLDWAR_SOV_usr_our_soviet_ukraine_desc:0 "Named after Shelest's 1970 book 'O Ukraine, Our Soviet Land', this programme celebrates Ukraine as a full partner in the Union rather than a province of Moscow. The Ukrainian language returns to schools, universities and publishing houses, Cossack history is honoured and Kiev gains a greater say over the republic's coal, steel and grain. Ukrainians answer with growing loyalty to the reformed Union."
 COLDWAR_SOV_usr_the_model:0 "Many Paths or a Kiev Axis?"
 COLDWAR_SOV_usr_the_model_desc:0 "The national communists disagree on the shape of the new Union. Some want every republic, from Estonia to Tajikistan, to follow its own road to socialism as an equal partner. Others believe the Union needs a new core and look to an axis between Moscow and Kiev, with Ukraine as the second pillar of the federation. Shelest's followers must choose."
 COLDWAR_SOV_usr_many_paths:0 "Many Paths to Socialism"
 COLDWAR_SOV_usr_many_paths_desc:0 "Lenin's policy of korenizatsiya, the rooting of Soviet power in each nation's own language and cadres, is revived after decades of Russification. Every republic is free to adapt socialism to its own traditions, from the collective farms of the Baltic to the cotton fields of Uzbekistan. The Union becomes a family of distinct nations rather than a single Soviet people."
 COLDWAR_SOV_usr_the_kiev_axis:0 "The Kiev Axis"
 COLDWAR_SOV_usr_the_kiev_axis_desc:0 "Russia and Ukraine together form the heart of the Union, and the national communists propose to make this partnership explicit. Kiev becomes a second capital, Ukrainian cadres take a larger share of leading posts in Moscow and the two largest republics jointly steer the federation. The smaller republics grumble at a new dual hegemony, but the Union gains a firmer core."
 COLDWAR_SOV_usr_economic_sovereignty:0 "Economic Sovereignty"
 COLDWAR_SOV_usr_economic_sovereignty_desc:0 "Republican governments take control of the enterprises on their territory, much as Khrushchev's regional economic councils, the sovnarkhozy, attempted in 1957. The ministries in Moscow lose their grip, and local planners who know their own resources can finally act without waiting for permission. Productivity rises as each republic competes to show what it can achieve on its own."
 COLDWAR_SOV_usr_republic_formations:0 "Republican Formations"
 COLDWAR_SOV_usr_republic_formations_desc:0 "During the Great Patriotic War the Red Army fielded national divisions raised in the republics, until they were quietly disbanded after the victory. The national communists revive the idea: each republic raises formations of its own citizens, commanded in their own languages but sworn to the common defence. The army grows, and so does the republics' sense of ownership in it."
 COLDWAR_SOV_usr_the_commonwealth_of_soviet_states:0 "The Commonwealth of Soviet States"
 COLDWAR_SOV_usr_the_commonwealth_of_soviet_states_desc:0 "The Union of Soviet Socialist Republics gives way to a Commonwealth of Soviet States, a voluntary association of sovereign socialist nations sharing a common defence, currency and market. Unlike the hasty Commonwealth of Independent States of 1991, it is built while trust between the republics still exists. Nationalist passions cool, for every nation now has its own state within the family."
 COLDWAR_SOV_rp_the_russian_party:0 "The Russian Party"
 COLDWAR_SOV_rp_the_russian_party_desc:0 "Within the Party apparatus an informal current has grown that values Russian tradition above Marxist internationalism. Its patron is Politburo member Dmitry Polyansky, its voice the journal Molodaya Gvardiya, and its supporters reach from the Komsomol to the Writers' Union. Now the 'Russian Party' steps into the open, determined to put the Russian people first in the state they built."
 COLDWAR_SOV_rp_the_molodaya_gvardiya_line:0 "The Molodaya Gvardiya Line"
 COLDWAR_SOV_rp_the_molodaya_gvardiya_line_desc:0 "Under its editor Anatoly Nikonov, Molodaya Gvardiya has printed essays praising the Russian village, the Orthodox heritage and the national spirit, drawing fierce condemnation from Party liberals. Its line now becomes official policy: the press, the publishing houses and the Komsomol are encouraged to promote Russian patriotism, and the guardians of ideology learn to speak of the nation as readily as of class."
 COLDWAR_SOV_rp_the_russian_village_first:0 "The Russian Village First"
 COLDWAR_SOV_rp_the_russian_village_first_desc:0 "The village prose of Vasily Belov and Valentin Rasputin mourns the dying Russian countryside, its churches in ruins and its young people fleeing to the cities. The Russian Party makes the revival of the Non-Black Earth Zone a national priority, pouring money into roads, housing and machinery for the old Russian heartland that collectivisation left behind."
 COLDWAR_SOV_rp_the_model:0 "Red or White?"
 COLDWAR_SOV_rp_the_model_desc:0 "The Russian Party is united in its love of Russia but divided over her past. The red wing honours the Soviet state as the latest form of Russian greatness and seeks to fuse Bolshevism with national pride. The white wing looks further back, to Orthodoxy, old Russia and the faith that sustained the people before 1917. One vision must prevail."
 COLDWAR_SOV_rp_national_bolshevism:0 "National Bolshevism"
 COLDWAR_SOV_rp_national_bolshevism_desc:0 "The ideas of Nikolai Ustryalov, who saw in Bolshevism a new incarnation of the Russian state, find fresh followers. The Soviet Union is presented as the heir to a thousand years of Russian history and the Party as its rightful guardian. Communist symbols and Russian patriotism merge into a single creed of red greatness that appeals to soldiers and workers alike."
 COLDWAR_SOV_rp_orthodox_nationalism:0 "Orthodox Nationalism"
 COLDWAR_SOV_rp_orthodox_nationalism_desc:0 "The white wing of the Russian Party wins out. The persecution of the Church ends, the Moscow Patriarchate gains a voice in public life and restored churches ring their bells again across Russia. Faith is recast as the soul of the nation and the Church becomes a pillar of the state, an arrangement unthinkable to the militantly atheist Party of only a few years before."
 COLDWAR_SOV_rp_a_communist_party_for_the_rsfsr:0 "A Party for the RSFSR"
 COLDWAR_SOV_rp_a_communist_party_for_the_rsfsr_desc:0 "Every union republic has its own Communist Party except the largest, Russia, whose affairs are run directly by the all-Union apparatus. The Russian Party demands an end to this anomaly and founds a Communist Party of the RSFSR with its own Central Committee. Russians gain an institution of their own, while the other republics fear it as a rival centre of power."
 COLDWAR_SOV_rp_the_slavic_core:0 "The Slavic Core"
 COLDWAR_SOV_rp_the_slavic_core_desc:0 "Russia, Ukraine and Belorussia share a common origin in Kievan Rus, and the Russian Party wants their bond to be closer than that with any other republic. Kiev and Minsk are offered a privileged partnership: deeper integration with Russia in exchange for continued autonomy and respect for their own languages. The Slavic core is meant to become the unbreakable heart of the state."
 COLDWAR_SOV_rp_the_great_power_army:0 "The Great Power Army"
 COLDWAR_SOV_rp_the_great_power_army_desc:0 "The Soviet Army is honoured as the heir of Suvorov and Kutuzov, of Borodino and Stalingrad, and its traditions are tied ever more openly to Russian history. Officers are told they defend Russia first and ideology second, and the General Staff welcomes the new prestige and budget. A proud army, the Russian Party believes, is the backbone of a great power."
 COLDWAR_SOV_rp_the_question:0 "Empire or Nation?"
 COLDWAR_SOV_rp_the_question_desc:0 "The Russian Party faces its oldest dilemma. Should Russia hold the Union together as an empire, carrying the burden of the borderlands for the sake of greatness? Or should she shed the periphery and become a compact nation-state, spending her strength on her own people? Imperial patriots and the followers of Solzhenitsyn give opposite answers, and the Party must choose."
 COLDWAR_SOV_rp_the_empire:0 "The Empire"
 COLDWAR_SOV_rp_the_empire_desc:0 "Russia chooses greatness. The Union is to be held together at any price, its borderlands bound to Moscow by Russian settlers, the Russian language and Russian bayonets. The patriotic press speaks of a historic mission, and the militsiya grows to keep the realm secure. The empire endures, but its peoples are reminded daily who is the elder brother."
 COLDWAR_SOV_rp_the_nation:0 "The Nation"
 COLDWAR_SOV_rp_the_nation_desc:0 "Russia chooses herself. The costly subsidies to the borderlands are cut, the republics are allowed to drift toward independence and the state concentrates on the Russian lands, from Smolensk to Vladivostok. Many imperial patriots call it a betrayal, but ordinary Russians welcome a government that finally spends the nation's wealth at home."
 COLDWAR_SOV_rp_great_russia:0 "Great Russia"
 COLDWAR_SOV_rp_great_russia_desc:0 "The Russian Party completes its programme. Soviet achievement and Russian tradition, the space rockets and the onion domes, the victory of 1945 and the memory of Kutuzov stand side by side in a new national synthesis. Great Russia is confident, patriotic and proud of her thousand-year history, and her people believe once more that they are destined to shape the world."
 COLDWAR_SOV_cnr_the_national_rebirth:0 "The National Rebirth"
 COLDWAR_SOV_cnr_the_national_rebirth_desc:0 "From the shadows of the Union, a clandestine committee of embittered officers, writers and officials has prepared for this hour. Rejecting both communism and the West, they promise the national rebirth of a Russian people they believe has been betrayed by internationalists and bureaucrats. Their rule begins with emergency decrees, closed borders and a hunt for enemies within."
 COLDWAR_SOV_cnr_the_emergency_committee:0 "The Emergency Committee"
 COLDWAR_SOV_cnr_the_emergency_committee_desc:0 "Power is placed in the hands of a State Committee for the National Emergency, a collective body that answers to no Congress and no Politburo. Ministers are dismissed, Party officials arrested and the old nomenklatura stripped of its privileges overnight. The committee rules by decree, and the fear it inspires in the elite is matched by the hope it awakens among the angry and the dispossessed."
 COLDWAR_SOV_cnr_militarise_the_nation:0 "Militarise the Nation"
 COLDWAR_SOV_cnr_militarise_the_nation_desc:0 "The Committee declares that a reborn nation must be an armed nation. Military spending climbs, reserve call-ups are extended, and schools, factories and youth organisations are reorganised along military lines. Every citizen is told that the motherland faces enemies on every side, and the whole country begins to take on the look of a vast barracks."
 COLDWAR_SOV_cnr_the_path:0 "Isolation or Expansion?"
 COLDWAR_SOV_cnr_the_path_desc:0 "The leaders of the Committee agree that Russia has been humiliated, but not on how to restore her pride. One faction wants to seal the borders and build an autarkic fortress, immune to Western influence and self-sufficient in everything. The other dreams of revenge and of reclaiming lost influence by force. The direction of the rebirth must now be decided."
 COLDWAR_SOV_cnr_fortress_russia:0 "Fortress Russia"
 COLDWAR_SOV_cnr_fortress_russia_desc:0 "The borders close. Foreign trade is reduced to what is strictly necessary, Western radio is jammed more heavily than ever and unauthorised contact with foreigners becomes a crime. Behind its walls the nation is to produce everything it needs and defend every inch of its soil. Fortress Russia trades prosperity for a security its rulers consider absolute."
 COLDWAR_SOV_mod_army_attack_factor_tt:0 "Division Attack: $RIGHT|+=%1$"
 COLDWAR_SOV_cnr_the_revanche:0 "The Revanche"
 COLDWAR_SOV_cnr_the_revanche_desc:0 "The Committee speaks openly of revenge for every retreat and every humiliation the Russian nation has suffered. Troops move toward the frontiers, military doctrine turns to the offensive and the propaganda machine prepares the population for war. The world watches with alarm as Moscow rattles its sabre louder than at any time since the Cuban crisis."
 COLDWAR_SOV_cnr_the_rebirth_state:0 "The Rebirth State"
 COLDWAR_SOV_cnr_the_rebirth_state_desc:0 "The national rebirth is enshrined as the permanent order of the state. A collective dictatorship of the Committee rules over a disciplined, militarised and inward-looking society in which loyalty to the nation outweighs every other value. Scientists and artists chafe under the new orthodoxy, but the regime has achieved what it set out to do: a Russia remade in its own image."
 COLDWAR_SOV_com_the_marshals_govern:0 "The Marshals Govern"
 COLDWAR_SOV_com_the_marshals_govern_desc:0 "Defence Minister Marshal Andrei Grechko and the senior commanders of the Soviet Armed Forces have lost patience with the quarrelling civilians of the Politburo. Backed by the military districts and the General Staff, they assume direct control of the state through a Council of Marshals. The Party is not abolished, but for the first time since the Revolution it takes its orders from the army."
 COLDWAR_SOV_com_the_general_staff_governs:0 "The General Staff Governs"
 COLDWAR_SOV_com_the_general_staff_governs_desc:0 "The General Staff, long called the brain of the army, becomes the brain of the state. Its officers take over ministries and planning bodies, applying the methods of military staff work to the economy and the administration. Decisions are made faster and orders followed more strictly, but civilian expertise is pushed aside in favour of the soldier's way of thinking."
 COLDWAR_SOV_com_order_and_discipline:0 "Order and Discipline"
 COLDWAR_SOV_com_order_and_discipline_desc:0 "The marshals bring the values of the barracks to civilian life. Absenteeism, drunkenness at work and petty theft are punished severely, corrupt officials face military tribunals and the black marketeers find their protectors gone. Ordinary citizens grumble at the harsh new rules, yet many admit that the trains run on time and the shops are less empty than before."
 COLDWAR_SOV_com_the_model:0 "Ogarkov or the Old Marshals?"
 COLDWAR_SOV_com_the_model_desc:0 "The officer corps is split between generations. The old marshals who fought from Moscow to Berlin trust in mass armies, vast reserves and the lessons of 1945. Younger reformers around Nikolai Ogarkov, first deputy chief of the General Staff, foresee a revolution in warfare driven by computers, precision weapons and automated command. The Council must decide whose vision will guide the army."
 COLDWAR_SOV_com_the_modernisers:0 "The Modernisers"
 COLDWAR_SOV_com_the_modernisers_desc:0 "Ogarkov's vision prevails. Military research institutes receive priority funding for electronics, computers and automated command and control, and the army begins to plan for a war fought with reconnaissance-strike complexes rather than endless waves of tanks. The West will one day call it the revolution in military affairs; the Soviet Union now intends to lead it."
 COLDWAR_SOV_mod_army_defence_factor_tt:0 "Division Defence: $RIGHT|+=%1$"
 COLDWAR_SOV_com_the_old_marshals:0 "The Old Marshals"
 COLDWAR_SOV_com_the_old_marshals_desc:0 "The veterans of the Great Patriotic War keep their grip on the army. Their faith lies in mass, in the deep reserves of the Soviet people and in the armoured fists that once broke the Wehrmacht. Conscription is widened, reserve divisions are filled and the army prepares to fight the next war as it won the last, with numbers, steel and endurance."
 COLDWAR_SOV_com_the_military_economy:0 "The Military Economy"
 COLDWAR_SOV_com_the_military_economy_desc:0 "The Soviet economy has always served the army first, but under the marshals the defence industry takes direct control of the plan. The Military-Industrial Commission sets priorities for the ministries, new arms plants rise in the Urals and Siberia, and civilian production is subordinated to the needs of defence. Tanks roll off the lines while the shops wait their turn."
 COLDWAR_SOV_com_the_defence_council:0 "The Defence Council"
 COLDWAR_SOV_com_the_defence_council_desc:0 "The Defence Council of the USSR, once a secretive body chaired by the General Secretary, becomes the supreme organ of state power. Military planning, foreign policy and the economy are now coordinated in a single room by the marshals and their chosen civilians. Decisions that once took months of Politburo bargaining are taken in a single sitting."
 COLDWAR_SOV_com_strategic_deterrence:0 "Strategic Deterrence"
 COLDWAR_SOV_com_strategic_deterrence_desc:0 "The Strategic Rocket Forces, the youngest and most prestigious branch of the Soviet military, receive the full backing of the marshals. New generations of heavy intercontinental missiles are ordered from the design bureaus of Mikhail Yangel and Vladimir Chelomei, and silos multiply across the steppe. The Council intends to negotiate with Washington from a position of overwhelming strength, whatever the cost to detente."
 COLDWAR_SOV_com_the_question:0 "How Long?"
 COLDWAR_SOV_com_the_question_desc:0 "Military rule was meant to be temporary, a remedy for a crisis the civilians could not handle. Now the marshals face the question every junta eventually confronts. Some argue that order has been restored and the army should return power to the Party before politics corrupts it. Others believe the country needs the soldiers' firm hand indefinitely."
 COLDWAR_SOV_com_return_to_the_barracks:0 "Return to the Barracks"
 COLDWAR_SOV_com_return_to_the_barracks_desc:0 "Their task complete, the marshals hand power back to the Communist Party of the Soviet Union and return to their headquarters. The army keeps its prestige and a powerful voice in matters of defence, but the principle of Party control over the military is restored. The soldiers have shown that they can rule, and the Party will not forget it."
 COLDWAR_SOV_com_the_permanent_stavka:0 "The Permanent Stavka"
 COLDWAR_SOV_com_the_permanent_stavka_desc:0 "During the Great Patriotic War the Stavka of the Supreme High Command directed the entire Soviet war effort. The marshals now make it a permanent institution of peacetime government, a supreme headquarters that commands not only armies but ministries and republics. The Soviet Union becomes a state permanently organised for war, whether war comes or not."
 COLDWAR_SOV_com_the_garrison_state:0 "The Garrison State"
 COLDWAR_SOV_com_the_garrison_state_desc:0 "The rule of the marshals hardens into a lasting order. Every region is a military district, every factory a potential arsenal and every citizen a soldier in reserve. Shielded by its nuclear arsenal and its vast armies, the Garrison State offers its people security and discipline in place of freedom, and the world must reckon with a superpower ruled by its generals."
 COLDWAR_SOV_new_leader_emperor_vladimir_iii_tt:0 "§YEmperor Vladimir III§! becomes the leader of [ROOT.GetNameDef]."
 COLDWAR_SOV_rom_the_return_of_the_tsar:0 "The Return of the Romanovs"
 COLDWAR_SOV_rom_the_return_of_the_tsar_desc:0 "Few would have believed it possible: in a Soviet Union shaken by crisis, the head of the House of Romanov, Grand Duke Vladimir Kirillovich, is invited back from exile in Madrid. Born in Finland in 1917 and raised in emigration, he has never seen the Russia he claims. Monarchists, nationalists and many weary citizens now look to him as the symbol of a lost continuity."
 COLDWAR_SOV_rom_the_coronation:0 "The Coronation"
 COLDWAR_SOV_rom_the_coronation_desc:0 "For the first time since 1896, a Russian emperor is crowned in the Dormition Cathedral of the Moscow Kremlin. The ancient regalia are brought out of the Armoury, the bells of Ivan the Great ring out and crowds fill Red Square, some in joy, some in disbelief. Whatever the future holds, the coronation of Vladimir Kirillovich marks a break with more than half a century of Soviet history."
 COLDWAR_SOV_rom_the_church_and_the_crown:0 "The Church and the Crown"
 COLDWAR_SOV_rom_the_church_and_the_crown_desc:0 "Tsar and Patriarch were once the twin pillars of Holy Russia, and the restored monarchy seeks to rebuild that alliance. The Moscow Patriarchate is freed from Soviet supervision, its seminaries and monasteries reopen and plans are drawn up to rebuild the Cathedral of Christ the Saviour. The Church in turn blesses the crown and calls on the faithful to support it."
 COLDWAR_SOV_rom_the_form:0 "Duma or Autocrat?"
 COLDWAR_SOV_rom_the_form_desc:0 "What kind of monarchy will Russia have? Liberal monarchists point to the State Duma of 1906 and to the constitutional crowns of Britain and Scandinavia. Traditionalists insist that only an autocrat, ruling by the grace of God as the tsars once did, can hold the vast country together after decades of upheaval. The Grand Duke and his advisers must settle the question."
 COLDWAR_SOV_rom_constitutional_monarchy:0 "Constitutional Monarchy"
 COLDWAR_SOV_rom_constitutional_monarchy_desc:0 "The emperor reigns but does not rule. A new State Duma is elected by the people, a constitution guarantees civil rights and the government answers to parliament. Russia picks up the thread of the reforms of 1905 that war and revolution cut short, and Western capitals watch with fascination as the largest country on Earth becomes a parliamentary monarchy."
 COLDWAR_SOV_rom_the_autocrat:0 "The Autocrat"
 COLDWAR_SOV_rom_the_autocrat_desc:0 "The old formula of Orthodoxy, Autocracy and Nationality is revived. The emperor rules with full authority, assisted by ministers he alone appoints, and the Soviet instruments of control are turned to the service of the throne. Supporters see a return to the natural order of Russian life; opponents note that the new autocracy relies on the same secret police as the old dictatorship."
 COLDWAR_SOV_rom_the_emigres_return:0 "The Émigrés Return"
 COLDWAR_SOV_rom_the_emigres_return_desc:0 "In Paris, Berlin, Belgrade, New York and Buenos Aires, the descendants of the White emigration have kept Russian culture alive in exile for half a century. Now they are invited home. Engineers, scholars, priests and businessmen return with knowledge, capital and connections abroad, and Russia rediscovers a part of herself that the Revolution scattered across the world."
 COLDWAR_SOV_rom_the_crown_and_the_republics:0 "The Crown and the Republics"
 COLDWAR_SOV_rom_the_crown_and_the_republics_desc:0 "The restored monarchy inherits fifteen union republics that owe no loyalty to a Russian tsar. Georgians, Balts and Central Asians watch the coronation with suspicion, and many remember the old empire as a prison of nations. The crown offers the republics broad self-government under the dynasty, but some prefer to drift away rather than kneel before a Romanov."
 COLDWAR_SOV_rom_the_royal_houses:0 "The Royal Houses of Europe"
 COLDWAR_SOV_rom_the_royal_houses_desc:0 "The Romanovs are bound by blood to nearly every royal house in Europe, and the Grand Duke has lived for years in Madrid. His envoys now call on Buckingham Palace and on Prince Juan Carlos, seeking recognition of the restored crown. For London and Madrid, embracing a Russian emperor would be a remarkable gesture, and a useful wedge between Moscow and its communist past."
 COLDWAR_SOV_rom_the_restored_empire:0 "The Restored Empire"
 COLDWAR_SOV_rom_the_restored_empire_desc:0 "The double-headed eagle flies once again over the Kremlin. The Russian Empire, abolished in 1917, has risen from the ruins of the Soviet experiment, with a Romanov on the throne and the Church at his side. It is a different empire from the one Nicholas II lost, shaped by decades of Soviet industry and education, but it claims the same thousand-year inheritance."
 COLDWAR_SOV_gosplan_directives:0 "Gosplan Directives"
 COLDWAR_SOV_gosplan_directives_desc:0 "Gosplan, the State Planning Committee under Nikolai Baibakov, sets the targets for every factory, mine and collective farm from the Baltic to the Pacific. Millions of products, prices and deliveries must be balanced on paper before a single tonne of steel is poured. Strengthening the authority of the planners and the discipline of the five-year plans is the first step towards mastering the economy."
 COLDWAR_SOV_complete_the_eighth_plan:0 "Complete the Eighth Five-Year Plan"
 COLDWAR_SOV_complete_the_eighth_plan_desc:0 "The Eighth Five-Year Plan, covering 1966 to 1970, is the most successful of the post-war era. Industrial output and real incomes grow at a pace no later plan will match, helped by Kosygin's reforms and the opening of Siberian resources. Now its final year must be completed with honour: unfinished factories commissioned, targets reported as fulfilled and the foundations laid for the next plan."
 COLDWAR_SOV_the_kosygin_reform_question:0 "The Kosygin Reform Question"
 COLDWAR_SOV_the_kosygin_reform_question_desc:0 "Since 1965 Premier Alexei Kosygin's reform has judged enterprises by sales and profit rather than gross output, rewarded workers with bonuses and granted managers more autonomy. Since the Prague Spring of 1968, however, the Politburo views any loosening of central control with suspicion, and the ministries are quietly rolling the reform back. Should the Kosygin reform be deepened, or allowed to fade away?"
 COLDWAR_SOV_deepen_the_kosygin_reform:0 "Deepen the Kosygin Reform"
 COLDWAR_SOV_deepen_the_kosygin_reform_desc:0 "Kosygin and his economists argue that the reform has failed not because it went too far but because it never went far enough. Enterprises should keep a larger share of their profits, draw up more of their own plans and answer to their customers rather than to the ministries. The branch ministries and much of the nomenklatura resist, but the Premier is determined to give Soviet industry the incentives it lacks."
 COLDWAR_SOV_enterprise_self_financing:0 "Khozraschyot: Enterprise Self-Financing"
 COLDWAR_SOV_enterprise_self_financing_desc:0 "Under full khozraschyot, or economic accounting, Soviet enterprises must cover their costs from their own revenues instead of relying on endless subsidies from the state budget. Profitable factories may reinvest and reward their workers, while loss-making ones face pressure to modernise or merge. For managers it means freedom; for the trade unions it raises the spectre of lost jobs and harder work."
 COLDWAR_SOV_mod_faction_trade_opinion_factor_tt:0 "$MODIFIER_FACTION_TRADE_OPINION_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SOV_lessons_from_budapest:0 "Lessons from Budapest"
 COLDWAR_SOV_lessons_from_budapest_desc:0 "Since 1968 Janos Kadar's Hungary has quietly experimented with its New Economic Mechanism, combining central planning with market prices, enterprise autonomy and a modest private sector. Hungarian shops are full while Soviet shelves stand empty. Instead of viewing Budapest with suspicion, Moscow could send its economists to study what works and adapt the lessons to Soviet conditions, and win the gratitude of a loyal ally in the process."
 COLDWAR_SOV_legalise_the_cooperatives:0 "Legalise the Cooperatives"
 COLDWAR_SOV_legalise_the_cooperatives_desc:0 "Behind the facade of the planned economy lies a vast second economy of private tailors, mechanics, builders and traders, tolerated because everyone depends on it. Legalising small cooperatives would bring these activities into the open, generate tax revenue and fill the gaps the state cannot. For the nomenklatura, who profit from the shadows, it means the end of lucrative privileges, and they will not forgive it."
 COLDWAR_SOV_cybernetic_planning:0 "OGAS: Cybernetic Planning"
 COLDWAR_SOV_cybernetic_planning_desc:0 "In 1962 the cybernetician Viktor Glushkov proposes OGAS, a nationwide automated system linking every enterprise to regional computing centres and to Gosplan in Moscow. In 1970 the Politburo shelves the plan, wary of its cost and of the transparency it would bring. What if the leadership decides otherwise and entrusts the planned economy to computers and mathematics instead of paperwork and guesswork?"
 COLDWAR_SOV_the_ogas_network:0 "The OGAS Network"
 COLDWAR_SOV_the_ogas_network_desc:0 "The first regional computing centres are online, and data from the factories begins to reach Moscow in hours instead of months. Now the network must be extended across the Union, connecting thousands of enterprises, ministries and planning offices into a single information system. If Glushkov's vision succeeds, the Soviet Union will possess the most advanced planning apparatus in the world."
 COLDWAR_SOV_kantorovich_optimal_prices:0 "Kantorovich's Optimal Prices"
 COLDWAR_SOV_kantorovich_optimal_prices_desc:0 "Leonid Kantorovich, the father of linear programming, has argued for decades that optimal prices can be calculated mathematically to allocate scarce resources efficiently. His work will earn him the Nobel Prize in Economics, yet at home his ideas remain suspect as a disguised theory of the market. Adopting objectively determined valuations could bring rationality to the arbitrary prices of the planned economy."
 COLDWAR_SOV_computing_centres_of_the_republics:0 "Computing Centres of the Republics"
 COLDWAR_SOV_computing_centres_of_the_republics_desc:0 "From Kiev and Minsk to Tallinn, Tbilisi and Tashkent, each union republic receives its own computing centre and institute of cybernetics. Local engineers and mathematicians train on Soviet machines, process regional statistics and write software for their industries. The project spreads modern skills beyond Moscow and Leningrad and gives the republics a stake in the scientific future of the Union."
 COLDWAR_SOV_the_ministries_restored:0 "The Ministries Restored"
 COLDWAR_SOV_the_ministries_restored_desc:0 "Khrushchev's regional economic councils, the sovnarkhozy, have been abolished and the centralised branch ministries restored. Each ministry once again commands its own empire of factories, research institutes and supply networks from Moscow. The ministers regain their power and the apparatus its order, but every ministry guards its own interests, and coordination between the branches suffers."
 COLDWAR_SOV_new_union_ministries:0 "New Union Ministries"
 COLDWAR_SOV_new_union_ministries_desc:0 "As the economy grows more complex, new all-union ministries are created for instrument-making, mineral fertilisers, the gas industry and other specialised branches. Each brings expertise, investment and a direct line to the Council of Ministers. Each also brings new departments, new officials and new paperwork, adding further layers to an already formidable bureaucracy."
 COLDWAR_SOV_the_tolkachi:0 "The Tolkachi"
 COLDWAR_SOV_the_tolkachi_desc:0 "No plan can foresee every missing bolt or delayed cable. Every Soviet enterprise therefore relies on its tolkachi, the 'pushers' who travel the country with favours, bribes and bottles of cognac to obtain the materials the official supply system fails to deliver. They are illegal in spirit yet indispensable in practice, keeping the factories running at the price of an ever-growing culture of informal deals."
 COLDWAR_SOV_plan_fulfilment_campaigns:0 "Plan Fulfilment Campaigns"
 COLDWAR_SOV_plan_fulfilment_campaigns_desc:0 "Red banners, honour boards and socialist competition between brigades: the Party mobilises the workforce to fulfil and overfulfil the plan. Shock workers are celebrated in Pravda, model collectives receive medals and the best enterprises are entered in the books of labour glory. The campaigns raise output and morale, even if the reported figures sometimes owe more to creativity than to production."
 COLDWAR_SOV_the_ninth_five_year_plan:0 "The Ninth Five-Year Plan"
 COLDWAR_SOV_the_ninth_five_year_plan_desc:0 "The Ninth Five-Year Plan, covering 1971 to 1975, is adopted by the XXIV Party Congress. For the first time the planners promise that consumer goods will grow faster than heavy industry, while the armed forces press for their own share of investment. The leadership must decide where the priorities of the coming five years truly lie."
 COLDWAR_SOV_group_b_goods_for_the_people:0 "Group B: Goods for the People"
 COLDWAR_SOV_group_b_goods_for_the_people_desc:0 "Soviet planners divide industry into Group A, the means of production, and Group B, the consumer goods. The Ninth Plan promises for the first time that Group B will grow faster, bringing more clothing, furniture, shoes and household goods to Soviet families. Turning this promise into reality demands investment and attention that the defence industry would rather keep for itself."
 COLDWAR_SOV_the_brezhnevka:0 "The Brezhnevka"
 COLDWAR_SOV_the_brezhnevka_desc:0 "The five-storey Khrushchyovka is giving way to a new generation of prefabricated housing. Panel blocks of nine to sixteen storeys, with lifts, larger kitchens and separate bathrooms, rise in vast new districts on the edges of every Soviet city. Millions of families leave their communal apartments for flats of their own, and the housing programme becomes one of the most visible achievements of the era."
 COLDWAR_SOV_refrigerators_and_televisions:0 "Refrigerators and Televisions"
 COLDWAR_SOV_refrigerators_and_televisions_desc:0 "A refrigerator in the kitchen and a television in the living room: for Soviet families of the 1970s these are the symbols of a modern life. Factories in Minsk, Moscow and Lvov expand their output of household appliances, and the first colour sets begin to replace black and white. Every new appliance proves that socialism can deliver comfort as well as steel."
 COLDWAR_SOV_group_a_means_of_production:0 "Group A: Means of Production"
 COLDWAR_SOV_group_a_means_of_production_desc:0 "The classic Soviet doctrine is clear: heavy industry first, for without machines, steel and energy there can be no consumer goods tomorrow. The planners direct investment towards new plants, power stations and metallurgical combines, accepting that the shop shelves will remain sparse for now. It is the proven path of the first five-year plans, and many in Gosplan see no reason to abandon it."
 COLDWAR_SOV_steel_cities:0 "Magnitka and Cherepovets"
 COLDWAR_SOV_steel_cities_desc:0 "Magnitogorsk in the Urals, built around a mountain of iron ore during the first five-year plans, remains the symbol of Soviet metallurgy, while the Cherepovets works near the Rybinsk Reservoir is among the most modern steel plants in the country. Expanding both secures the steel on which every other branch of industry depends, from the shipyards of Leningrad to the tractor plants of the Volga."
 COLDWAR_SOV_machine_building_first:0 "Machine-Building First"
 COLDWAR_SOV_machine_building_first_desc:0 "Machine-building is the heart of every industrial economy, yet Soviet factories still work with ageing lathes and outdated equipment. Prioritising machine tools, precision engineering and automation would raise productivity across all sectors and reduce dependence on imports from the West. Engineers and designers receive new resources, and the factories of Leningrad, Kharkov and Sverdlovsk lead the way."
 COLDWAR_SOV_the_defence_sector_first:0 "The Defence Sector First"
 COLDWAR_SOV_the_defence_sector_first_desc:0 "With the strategic balance against the United States at stake, the Military-Industrial Commission demands absolute priority for the defence sector. New arms plants, design bureaux and test ranges receive the best engineers and the scarcest materials. The marshals and the defence industry welcome the decision, while Soviet consumers once again learn to wait."
 COLDWAR_SOV_mod_military_factories_productivity_tt:0 "Military Factory Productivity: $RIGHT|+=%1$"
 COLDWAR_SOV_the_nine_ministries:0 "The Nine Defence Ministries"
 COLDWAR_SOV_the_nine_ministries_desc:0 "The Soviet defence industry is organised into nine ministries, from Medium Machine-Building, which builds the nuclear arsenal, to aviation, shipbuilding, radio and electronics. Each runs its own closed cities, schools, hospitals and research institutes, forming a state within the state. Coordinating them more tightly under the Military-Industrial Commission promises to make the Soviet arsenal cheaper and more efficient to produce."
 COLDWAR_SOV_dual_use_factories:0 "Dual-Use Factories"
 COLDWAR_SOV_dual_use_factories_desc:0 "Tank plants that build refrigerators, missile factories that turn out vacuum cleaners and aircraft works that produce washing machines: the defence industry is ordered to dedicate part of its capacity to civilian goods. The quality is often poor and the designs plain, but the products do reach the shops. It is an imperfect answer to chronic shortages, yet better than none at all."
 COLDWAR_SOV_avtovaz_the_zhiguli:0 "AvtoVAZ: The Zhiguli"
 COLDWAR_SOV_avtovaz_the_zhiguli_desc:0 "On 19 April 1970 the first VAZ-2101 rolls off the assembly line in Togliatti, built under licence from Fiat on the banks of the Volga. The Zhiguli, sold abroad as the Lada, is meant to bring the private car within reach of ordinary Soviet families. Completing the giant Volga Automobile Plant would turn the dream of a car of one's own into reality for millions."
 COLDWAR_SOV_kamaz_the_kama_truck_works:0 "KamAZ: The Kama Truck Works"
 COLDWAR_SOV_kamaz_the_kama_truck_works_desc:0 "In Naberezhnye Chelny on the Kama River, a vast new truck plant is rising, equipped with machine tools bought from the United States, West Germany, France and Italy. Once completed, the KamAZ works will produce heavy lorries for the national economy and the army alike, replacing the ageing vehicles that slow down Soviet transport. It is one of the great construction projects of the decade."
 COLDWAR_SOV_the_price_question:0 "The Price Question"
 COLDWAR_SOV_the_price_question_desc:0 "Soviet retail prices have barely moved in years, while production costs keep rising and the state subsidises meat, bread and milk at ever greater expense. Economists warn that artificial prices feed shortages and the black market. Yet the memory of the bloody strikes in Novocherkassk after the price rises of 1962 still haunts the leadership. Should the state dare to touch prices again?"
 COLDWAR_SOV_raise_retail_prices:0 "Raise Retail Prices"
 COLDWAR_SOV_raise_retail_prices_desc:0 "Honest prices would close the gap between what goods cost to produce and what citizens pay for them, draining the black market of its lifeblood and filling the state budget. The reform will be deeply unpopular: queues may turn into protests, and the trade unions will bristle. But without it, the Soviet economy cannot hope to balance supply and demand."
 COLDWAR_SOV_hold_the_prices:0 "Hold the Prices"
 COLDWAR_SOV_hold_the_prices_desc:0 "Stable prices are part of the unwritten social contract between the Party and the people. A loaf of bread is to cost the same in 1980 as it did in 1955, whatever the burden on the state budget. Shelves may be empty and queues long, but no Soviet citizen will see the price of essentials rise under this leadership."
 COLDWAR_SOV_the_unified_system_question:0 "The Unified System Question"
 COLDWAR_SOV_the_unified_system_question_desc:0 "Soviet computing stands at a crossroads. One option is to copy IBM's System/360, gaining instant access to Western software and a common standard for the entire Eastern Bloc. The other is to keep developing indigenous architectures such as Sergei Lebedev's BESM series, slower to mature but independent of Western designs. The decision will shape Soviet computing for decades."
 COLDWAR_SOV_mod_research_sharing_per_country_bonus_factor_tt:0 "Research Sharing Bonus: $RIGHT|+=%1$"
 COLDWAR_SOV_ryad_copy_the_ibm_360:0 "Ryad: Copy the IBM/360"
 COLDWAR_SOV_ryad_copy_the_ibm_360_desc:0 "The leadership decides to build the Unified System of Electronic Computers, known as Ryad, as a functional copy of the IBM System/360. Together with Comecon partners in East Germany, Hungary, Poland, Czechoslovakia and Bulgaria, Soviet factories can quickly produce compatible machines and run Western software. The price is the gradual withering of the original Soviet design schools."
 COLDWAR_SOV_continue_the_besm_line:0 "Continue the BESM Line"
 COLDWAR_SOV_continue_the_besm_line_desc:0 "Sergei Lebedev's Institute of Precision Mechanics and Computer Engineering has created the BESM line, among the most capable computers outside the United States. Instead of copying IBM, the Soviet Union continues to invest in its own architecture, its own software and its own engineers. Progress will be slower and more expensive, but Soviet computing will remain independent and original."
 COLDWAR_SOV_microelectronics_of_zelenograd:0 "Microelectronics of Zelenograd"
 COLDWAR_SOV_microelectronics_of_zelenograd_desc:0 "Zelenograd, a new town on the outskirts of Moscow, is the centre of Soviet microelectronics, home to research institutes and plants such as Mikron and Angstrem. Investing in its laboratories and production lines could narrow the gap with the integrated circuits of Silicon Valley. Without modern chips, neither computers nor missiles can keep pace with the West."
 COLDWAR_SOV_the_tenth_five_year_plan:0 "The Tenth Five-Year Plan"
 COLDWAR_SOV_the_tenth_five_year_plan_desc:0 "The Tenth Five-Year Plan, covering 1976 to 1980, is proclaimed the Plan of Efficiency and Quality. Instead of new factories and ever greater volumes, the emphasis shifts to productivity, technical progress and better products. The XXV Party Congress sets new priorities for the planners, but whether the ministries can change their habits remains to be seen."
 COLDWAR_SOV_the_shchekino_method:0 "The Shchekino Method"
 COLDWAR_SOV_the_shchekino_method_desc:0 "At the Shchekino chemical combine near Tula, an experiment begun in 1967 allows management to reduce its workforce while keeping the wage fund unchanged, distributing the savings as higher pay to the remaining workers. Productivity soars. Extending the method across Soviet industry could free hundreds of thousands of workers for new plants, but the trade unions fear the end of guaranteed employment."
 COLDWAR_SOV_quality_mark_of_the_ussr:0 "The State Quality Mark"
 COLDWAR_SOV_quality_mark_of_the_ussr_desc:0 "The State Quality Mark, a pentagon bearing a stylised letter K, is awarded to Soviet products that meet the highest standards. Factories compete for the right to stamp it on their goods, and those that earn it gain bonuses and prestige. A strict certification system could improve the reputation of Soviet goods at home and in the markets of the socialist community."
 COLDWAR_SOV_the_1979_economic_mechanism:0 "The 1979 Economic Mechanism"
 COLDWAR_SOV_the_1979_economic_mechanism_desc:0 "In July 1979 the Central Committee and the Council of Ministers adopt a decree on improving planning and the economic mechanism. Net output replaces gross output as the key indicator, stable long-term norms are introduced and enterprises are judged on fulfilling their delivery contracts. It is the last major attempt of the Brezhnev era to make the planned economy more efficient."
 COLDWAR_SOV_the_scientific_technical_revolution:0 "The Scientific-Technical Revolution"
 COLDWAR_SOV_the_scientific_technical_revolution_desc:0 "For years the Party has proclaimed that the scientific-technical revolution will carry socialism past capitalism. Now the promise must be fulfilled: computers, automation, new materials and modern management are to transform every branch of the economy. If science truly becomes a direct productive force, the Soviet Union can enter the twenty-first century as the most advanced society on earth."
 COLDWAR_SOV_the_agrarian_problem:0 "The Agrarian Problem"
 COLDWAR_SOV_the_agrarian_problem_desc:0 "Agriculture is the Achilles heel of the Soviet economy. A quarter of all investment flows into the countryside, yet harvests swing wildly from year to year, collective farms remain inefficient and city dwellers still queue for meat. From the black earth of Ukraine to the virgin lands of Kazakhstan, the leadership searches for a lasting solution."
 COLDWAR_SOV_pour_capital_into_the_kolkhozy:0 "Pour Capital into the Kolkhozy"
 COLDWAR_SOV_pour_capital_into_the_kolkhozy_desc:0 "The orthodox answer to the agrarian crisis is more money: higher procurement prices, debt write-offs, and new barns, roads and housing for the collective and state farms. Under Brezhnev, investment in agriculture reaches unprecedented levels. The farmers welcome the funds, even if critics ask whether capital alone can cure a system that rewards plan figures rather than good harvests."
 COLDWAR_SOV_mod_agriculture_workers_modifier_tt:0 "Agriculture Workers: $RIGHT|+=%1$"
 COLDWAR_SOV_fertiliser_and_machinery:0 "Fertiliser and Machinery"
 COLDWAR_SOV_fertiliser_and_machinery_desc:0 "Soviet fields need more fertiliser, more tractors and more combine harvesters. New chemical plants produce mineral fertilisers in vast quantities, while the tractor works of Volgograd, Kharkov and Minsk deliver modern machines to the countryside. Mechanisation and chemistry, the planners believe, will finally raise Soviet yields to the level of the West."
 COLDWAR_SOV_land_melioration:0 "Land Melioration"
 COLDWAR_SOV_land_melioration_desc:0 "The great land melioration programme, adopted in 1966, aims to transform Soviet agriculture through drainage and irrigation. Swamps in Belorussia and the Baltic are drained, while canals bring water to the dry steppes of the south. The works are costly and often poorly executed, but they promise to add millions of hectares of reliable farmland."
 COLDWAR_SOV_the_non_black_earth_programme:0 "The Non-Black-Earth Programme"
 COLDWAR_SOV_the_non_black_earth_programme_desc:0 "The leadership launches a programme to revive the Non-Black-Earth zone, the historic Russian heartland stretching from Pskov to the Urals. For decades its villages have emptied while investment has gone to Ukraine and Kazakhstan. Now roads, houses, drainage and machinery are to bring the old Russian countryside back to life, even if the other republics resent the shift in priorities."
 COLDWAR_SOV_the_link_system:0 "The Link System"
 COLDWAR_SOV_the_link_system_desc:0 "In the 1960s the agronomist Ivan Khudenko runs an experiment in Kazakhstan with small autonomous teams, the links, which work their land independently and are paid according to results. Output soars and costs fall, yet the experiment is shut down and Khudenko is destined to die in prison. What if the leadership embraces his ideas instead and gives Soviet farmers responsibility for their own harvests?"
 COLDWAR_SOV_enlarge_the_private_plots:0 "Enlarge the Private Plots"
 COLDWAR_SOV_enlarge_the_private_plots_desc:0 "The private household plots of collective farmers cover only a tiny share of Soviet farmland, yet they produce around a quarter of the nation's food: potatoes, vegetables, eggs, milk and meat. Enlarging the plots and easing the restrictions on private livestock would quickly improve supply at little cost to the state. Orthodox ideologists grumble, but hungry cities care little for doctrine."
 COLDWAR_SOV_kolkhoz_markets:0 "Free Kolkhoz Markets"
 COLDWAR_SOV_kolkhoz_markets_desc:0 "In every Soviet city, the kolkhoz markets offer what the state shops cannot: fresh produce at prices set by supply and demand. Lifting the remaining restrictions on these markets would allow farmers to sell their surplus freely, improving supply and drawing trade out of the shadows. It is a small step towards the market, but a visible one."
 COLDWAR_SOV_contract_farming:0 "Contract Farming"
 COLDWAR_SOV_contract_farming_desc:0 "Instead of rigid plan targets dictated from above, collective farms and their teams sign contracts with the state to deliver fixed quantities at agreed prices. Whatever they produce beyond the contract, they may sell or keep. The system rewards initiative and efficiency, but it also loosens the grip of the district Party committees on the countryside."
 COLDWAR_SOV_the_harvest_of_1972:0 "The Harvest of 1972"
 COLDWAR_SOV_the_harvest_of_1972_desc:0 "The summer of 1972 brings disaster. After a winter of bitter frosts, drought scorches the fields of the Volga region and Ukraine, and the grain harvest falls far short of the plan. The cities face shortages of bread and the farms a lack of fodder for their livestock. The leadership must decide whether to spend precious hard currency on imports or to ask the people to endure."
 COLDWAR_SOV_buy_grain_abroad:0 "Buy Grain Abroad"
 COLDWAR_SOV_buy_grain_abroad_desc:0 "Exportkhleb sends its buyers to the grain exchanges of the West. The shops stay full; the gold reserve shrinks."
 COLDWAR_SOV_tighten_the_belts:0 "Tighten the Belts"
 COLDWAR_SOV_tighten_the_belts_desc:0 "Hard currency is too precious to waste on foreign grain. Those who have lived through the war know real hardship, and they can bear this too. Livestock herds are slaughtered, rationing quietly returns to the provinces and the queues grow longer. The state preserves its reserves and its pride, but the patience of the population is not unlimited."
 COLDWAR_SOV_virgin_lands_renewal:0 "Virgin Lands Renewal"
 COLDWAR_SOV_virgin_lands_renewal_desc:0 "Khrushchev's Virgin Lands campaign has ploughed up millions of hectares of steppe in Kazakhstan and Siberia. Erosion and dust storms have since taken their toll, and yields remain unpredictable. A renewed effort with shelterbelts, crop rotation and modern machinery could restore the virgin lands as a reliable granary of the Union."
 COLDWAR_SOV_white_gold:0 "White Gold"
 COLDWAR_SOV_white_gold_desc:0 "Cotton is the white gold of Soviet Central Asia. The Uzbek SSR alone grows most of the Union's crop, and its leader Sharof Rashidov promises ever higher harvests to Moscow. But cotton monoculture consumes vast amounts of water and labour, and behind the record figures lie inflated reports and corruption. How far should the Union push its cotton fields?"
 COLDWAR_SOV_irrigate_the_desert:0 "Irrigate the Desert"
 COLDWAR_SOV_irrigate_the_desert_desc:0 "The waters of the Amu Darya and the Syr Darya are diverted into a vast network of canals, among them the Karakum Canal, to turn the deserts of Turkmenistan and Uzbekistan into cotton fields. The harvests grow and Central Asia prospers, but the rivers no longer reach the Aral Sea. Its shores begin to recede, and future generations will pay the price."
 COLDWAR_SOV_save_the_aral_sea:0 "Save the Aral Sea"
 COLDWAR_SOV_save_the_aral_sea_desc:0 "The Aral Sea, once the fourth-largest lake on earth, is shrinking year by year as its rivers are drained for irrigation. Fishing towns such as Muynak and Aralsk watch the water retreat from their harbours, while salt storms spread over the fields. Reducing water consumption and modernising irrigation could save the sea, even at the expense of the cotton harvest and the patience of Tashkent."
 COLDWAR_SOV_turn_the_siberian_rivers:0 "Turn the Siberian Rivers"
 COLDWAR_SOV_turn_the_siberian_rivers_desc:0 "Soviet engineers dream of reversing the flow of the great Siberian rivers. Under the project known as Sibaral, part of the waters of the Ob and the Irtysh would be channelled southwards through a canal more than two thousand kilometres long to the thirsty fields of Central Asia. It would be the most ambitious water project in history, and scientists warn of unforeseen consequences for climate and nature."
 COLDWAR_SOV_the_food_programme:0 "The Food Programme"
 COLDWAR_SOV_the_food_programme_desc:0 "The Central Committee adopts the Food Programme of the USSR, a comprehensive plan to secure the nation's food supply by the end of the decade. Agriculture, processing, storage, transport and trade are to be integrated into agro-industrial complexes under unified management. After decades of half-measures, the leadership promises to solve the agrarian problem once and for all."
 COLDWAR_SOV_samotlor:0 "Samotlor: West Siberian Oil"
 COLDWAR_SOV_samotlor_desc:0 "Discovered in 1965 among the swamps of the Tyumen region, Samotlor is the largest oil field in the Soviet Union and one of the largest in the world. Drilling crews, pipelines and new towns spring up in the West Siberian taiga, and production climbs year after year. Siberian oil is set to become the lifeblood of the economy and its most valuable export."
 COLDWAR_SOV_the_tyumen_complex:0 "The Tyumen Oil and Gas Complex"
 COLDWAR_SOV_the_tyumen_complex_desc:0 "West Siberia holds not only oil but also enormous deposits of natural gas. Developing them requires roads, railways, power lines and entire cities in a land of permafrost, bogs and winters far below freezing. The Tyumen oil and gas complex becomes one of the largest construction sites on earth, drawing workers from every corner of the Union."
 COLDWAR_SOV_gas_for_pipes:0 "Gas for Pipes"
 COLDWAR_SOV_gas_for_pipes_desc:0 "Soyuznefteexport negotiates with Ruhrgas and Mannesmann over an unprecedented deal: West German large-diameter pipes on credit, repaid with deliveries of Soviet natural gas from 1973. Such an agreement would bind the Federal Republic to Soviet energy and open a lasting channel of trade across the Iron Curtain. Moscow makes its offer, and the decision now lies with Bonn."
 COLDWAR_SOV_urengoy:0 "Urengoy: The Gas Giant"
 COLDWAR_SOV_urengoy_desc:0 "Discovered in 1966 beyond the Arctic Circle, Urengoy is the largest gas field in the world. Bringing it into production demands drilling rigs, compressor stations and thousands of kilometres of pipeline across the tundra. Once tapped, Urengoy gas can heat Soviet cities, power industry and flow westwards to European customers who pay in hard currency."
 COLDWAR_SOV_tt_oil_ge_2:0 "§YOil price level§! (Cold War) at least §Y2§!"
 COLDWAR_SOV_petrodollars:0 "Petrodollars"
 COLDWAR_SOV_petrodollars_desc:0 "The oil crisis of 1973 quadruples world prices, and every barrel of Soviet oil sold abroad now brings in a fortune in hard currency. Petrodollars pay for American grain, Western machinery and generous aid to friendly regimes across the Third World. The windfall makes reform seem less urgent, and the economy grows ever more dependent on the price of oil."
 COLDWAR_SOV_mod_production_speed_nuclear_reactor_factor_tt:0 "Nuclear Reactor Construction Speed: $RIGHT|+=%1$"
 COLDWAR_SOV_mod_nuclear_energy_generation_modifier_tt:0 "Nuclear Power Output: $RIGHT|+=%1$"
 COLDWAR_SOV_the_atomic_power_programme:0 "The Atomic Power Programme"
 COLDWAR_SOV_the_atomic_power_programme_desc:0 "Since the Obninsk plant began supplying the grid in 1954, the Soviet Union has seen itself as a pioneer of peaceful atomic energy. The Ministry of Medium Machine-Building and the Ministry of Energy now draw up plans for dozens of new reactors in the European part of the Union, where fossil fuels are scarce. The key question is which reactor design to build."
 COLDWAR_SOV_rbmk_reactors:0 "RBMK: Channel Reactors"
 COLDWAR_SOV_rbmk_reactors_desc:0 "The RBMK is a large graphite-moderated channel reactor, derived from the military plutonium reactors. It is cheap, can be built with existing industrial capacity and can be scaled up to enormous outputs. It lacks a full containment structure and hides dangerous design flaws known only to a few specialists, but the planners value speed and size above all else."
 COLDWAR_SOV_vver_reactors:0 "VVER: Pressurised Reactors"
 COLDWAR_SOV_vver_reactors_desc:0 "The VVER is a pressurised water reactor, similar in principle to Western designs and housed within a containment structure. It is more expensive and demands advanced heavy engineering, but it is safer, more reliable and suitable for export to the socialist countries. Choosing the VVER means slower expansion, but a sounder foundation for the Soviet nuclear industry."
 COLDWAR_SOV_mod_imp_oil_price_resistance_tt:0 "Oil Price Resistance: $RIGHT|+=%1$"
 COLDWAR_SOV_the_leningrad_station:0 "The Leningrad Station"
 COLDWAR_SOV_the_leningrad_station_desc:0 "On the shores of the Gulf of Finland at Sosnovy Bor, the Leningrad Nuclear Power Plant takes shape, with its first unit due to go online in 1973. It is to become the flagship of Soviet nuclear energy, supplying power to the second city of the Union and its industries. Its success will set the pace for the reactors that follow across the country."
 COLDWAR_SOV_atoms_for_the_republics:0 "Atoms for the Republics"
 COLDWAR_SOV_atoms_for_the_republics_desc:0 "Nuclear power should not remain a privilege of the Russian heartland. New stations in Ukraine, Armenia, Lithuania and Kazakhstan can supply electricity to the growing cities and industries of the republics and reduce their dependence on distant coal and gas. Each new plant also binds the republics more closely to the scientific might of the Union."
 COLDWAR_SOV_mod_hydroelectric_power_generation_modifier_tt:0 "Hydroelectric Power Output: $RIGHT|+=%1$"
 COLDWAR_SOV_the_great_siberian_dams:0 "The Great Siberian Dams"
 COLDWAR_SOV_the_great_siberian_dams_desc:0 "On the Yenisei and the Angara, Soviet engineers are building some of the largest hydroelectric dams in the world. The Krasnoyarsk station nears completion, while the Sayano-Shushenskaya project, under construction since 1968, promises even greater output for the aluminium smelters and industries of Siberia. Ecologists worry about flooded valleys and lost villages, but the turbines keep turning."
 COLDWAR_SOV_the_baikal_amur_mainline:0 "The Baikal-Amur Mainline"
 COLDWAR_SOV_the_baikal_amur_mainline_desc:0 "The Baikal-Amur Mainline is proclaimed the construction project of the century: more than four thousand kilometres of railway through taiga, mountains and permafrost, north of Lake Baikal to the Pacific. Komsomol volunteers from every republic answer the call. The line will open up the resources of the Far East and provide a second route to the Pacific, safely distant from the Chinese border."
 COLDWAR_SOV_bam_open_to_traffic:0 "BAM Open to Traffic"
 COLDWAR_SOV_bam_open_to_traffic_desc:0 "After years of labour in some of the harshest conditions on earth, the Baikal-Amur Mainline opens to regular traffic. Trains now roll from Taishet to Sovetskaya Gavan, carrying timber, coal and ore from the Far East and supplies to the garrisons along the Amur. The project of the century has become reality, and the Soviet Far East no longer depends on a single railway."
 COLDWAR_SOV_kuzbass_and_ekibastuz:0 "Kuzbass and Ekibastuz"
 COLDWAR_SOV_kuzbass_and_ekibastuz_desc:0 "The Kuznetsk Basin in Western Siberia and the open-pit mines of Ekibastuz in Kazakhstan hold some of the largest coal reserves in the world. Their coal fires the power stations and steelworks of the Urals and Siberia. New mines, power plants and high-voltage lines can turn these coalfields into the energy backbone of the eastern Union."
 COLDWAR_SOV_mod_energy_use_multiplier_tt:0 "Energy Use: $RIGHT|-=%1$"
 COLDWAR_SOV_the_unified_energy_system:0 "The Unified Energy System"
 COLDWAR_SOV_the_unified_energy_system_desc:0 "The Unified Energy System links the power grids of the Soviet republics into a single network, while the Mir interconnection extends it to the Comecon partners in Eastern Europe. Electricity can flow from Siberian dams to Ukrainian factories and from Soviet power plants to Budapest and Prague. It is socialist integration in the most literal sense."
 COLDWAR_SOV_the_academy_of_sciences:0 "The Academy of Sciences"
 COLDWAR_SOV_the_academy_of_sciences_desc:0 "The Academy of Sciences of the USSR, led by its president Mstislav Keldysh, presides over hundreds of institutes and tens of thousands of researchers. Soviet scientists rank among the best in the world in mathematics, physics and space research, yet much of their work never reaches the factories. Strengthening the Academy and its links to industry could turn scientific excellence into economic strength."
 COLDWAR_SOV_akademgorodok:0 "Akademgorodok"
 COLDWAR_SOV_akademgorodok_desc:0 "Near Novosibirsk, among the birch forests on the shores of the Ob Sea, stands Akademgorodok, the science town of the Academy's Siberian Branch. Its institutes of mathematics, nuclear physics and computing attract the brightest young minds, drawn by a freedom of debate unusual in the Soviet Union. Expanding the town strengthens Soviet science and computing far from the bureaucracy of Moscow."
 COLDWAR_SOV_the_naukograds:0 "The Naukograds"
 COLDWAR_SOV_the_naukograds_desc:0 "Arzamas-16, Obninsk, Dubna and dozens of other science cities are missing from public maps, yet they form the backbone of Soviet nuclear, rocket and weapons research. Their residents enjoy better supplies and housing in exchange for secrecy and loyalty. Expanding the naukograds strengthens both science and defence, behind the fences and checkpoints of the KGB."
 COLDWAR_SOV_genetics_rehabilitated:0 "Genetics Rehabilitated"
 COLDWAR_SOV_genetics_rehabilitated_desc:0 "For decades, Trofim Lysenko's pseudo-science has dominated Soviet biology, while genuine geneticists have been dismissed, imprisoned or worse. Since his fall in 1965, the discipline has slowly been recovering. A decisive rehabilitation of genetics, with new institutes and modern breeding programmes, could bring Soviet agriculture and medicine back to the frontier of world science."
 COLDWAR_SOV_scientific_exchange:0 "Scientific Exchange with the West"
 COLDWAR_SOV_scientific_exchange_desc:0 "Soviet and American scientists agree to found the International Institute for Applied Systems Analysis in Laxenburg near Vienna, a meeting place for researchers from East and West. Joint commissions on space, medicine, the environment and energy follow. Opening Soviet laboratories to Western contacts accelerates research, but ideologists fear that foreign ideas will cross the border along with the data."
 COLDWAR_SOV_the_space_race_question:0 "The Space Race Question"
 COLDWAR_SOV_the_space_race_question_desc:0 "The Americans have planted their flag on the Moon, and the Soviet lunar programme is in crisis after repeated failures of the giant N1 rocket. Should the Union continue the costly race to land a cosmonaut on the Moon, or shift its efforts to long-duration orbital stations and robotic exploration? The decision will define Soviet spaceflight for the next two decades."
 COLDWAR_SOV_lunokhod:0 "Lunokhod"
 COLDWAR_SOV_lunokhod_desc:0 "On 17 November 1970 Lunokhod 1, delivered by the Luna 17 probe, rolls onto the surface of the Sea of Rains. Steered from a control centre in Crimea, it becomes the first remote-controlled vehicle to explore another world. Robotic explorers allow the Soviet Union to claim triumphs on the Moon without risking the lives of its cosmonauts."
 COLDWAR_SOV_venera:0 "Venera: The Road to Venus"
 COLDWAR_SOV_venera_desc:0 "On 15 December 1970 the Venera 7 probe descends through the crushing atmosphere of Venus and transmits data from its surface, the first successful landing on another planet. Further Venera missions are to send back the first images from the Venusian surface. The exploration of the planets offers the Soviet Union a field in which it can lead the world."
 COLDWAR_SOV_the_n1_moon_rocket:0 "Korolev's Dream: The N1"
 COLDWAR_SOV_the_n1_moon_rocket_desc:0 "Sergei Korolev's giant N1 rocket is meant to carry Soviet cosmonauts to the Moon, but every launch so far has ended in an explosion, and the programme faces cancellation. What if the leadership refuses to give up? With Nikolai Kuznetsov's improved engines and patient ground testing, the N1 could yet fly and restore the prestige of the Soviet space programme."
 COLDWAR_SOV_the_soviet_moonshot:0 "The Soviet Moonshot"
 COLDWAR_SOV_the_soviet_moonshot_desc:0 "The N1 finally works. A lunar orbiter and the LK lander carry a Soviet cosmonaut to the surface of the Moon, where the red flag is planted not far from the footprints of the Americans. The world press is stunned, Moscow celebrates, and the space race is suddenly far from over. Socialism has proven that it can match any achievement of the West."
 COLDWAR_SOV_the_orbital_stations:0 "The Orbital Stations"
 COLDWAR_SOV_the_orbital_stations_desc:0 "In April 1971 Salyut 1 is set to become the first space station in history. Long-duration flights aboard orbital laboratories allow Soviet cosmonauts to conduct experiments, observe the Earth and learn to live in space for months at a time. It is a field in which the Soviet Union can lead the world, with the military Almaz stations never far behind."
 COLDWAR_SOV_soyuz_apollo:0 "Soyuz-Apollo"
 COLDWAR_SOV_soyuz_apollo_desc:0 "An American Apollo and a Soviet Soyuz are to dock in orbit, and their crews are to shake hands in space. The Apollo-Soyuz Test Project would become a powerful symbol of detente, proof that the superpowers can cooperate even in the most prestigious field of the Cold War. Moscow proposes the joint mission to Washington, and the Americans must decide whether to accept."
 COLDWAR_SOV_the_space_shuttle_answer:0 "Answer the Space Shuttle"
 COLDWAR_SOV_the_space_shuttle_answer_desc:0 "The Americans are developing a reusable Space Shuttle, and Soviet military analysts fear it could be used to deploy weapons in orbit or even to snatch Soviet satellites. Ignoring it is not an option for a superpower. The leadership must decide how to answer, and whether to match the American programme in capability and prestige at enormous cost."
 COLDWAR_SOV_energia_buran:0 "Energia-Buran"
 COLDWAR_SOV_energia_buran_desc:0 "NPO Energia, under Valentin Glushko, designs a super-heavy launch vehicle and a reusable orbiter of its own. The Energia rocket can lift a hundred tonnes into orbit, while the Buran spaceplane is designed to fly fully automatically. The programme is the most expensive in Soviet space history, but it gives the Union a capability to rival anything the Americans possess."
 COLDWAR_SOV_mir_station:0 "Mir: The Permanent Station"
 COLDWAR_SOV_mir_station_desc:0 "The era of short-lived Salyut stations gives way to a modular, permanently crewed outpost in orbit. Mir, a name meaning both peace and world, is assembled module by module and will host cosmonauts and international guests for years on end. A permanent presence in space crowns the Soviet orbital programme and demonstrates the scientific maturity of socialism."
 COLDWAR_SOV_eyes_in_orbit:0 "Zenit: Eyes in Orbit"
 COLDWAR_SOV_eyes_in_orbit_desc:0 "Since 1962, Zenit reconnaissance satellites based on the Vostok spacecraft have photographed the territory of the United States, NATO and China, returning their film capsules to Earth. Better cameras, longer missions and new generations of satellites give the General Staff an ever clearer picture of enemy forces. In the nuclear age, knowledge from orbit is a strategic weapon in itself."
 COLDWAR_SOV_the_scientific_superpower:0 "The Scientific Superpower"
 COLDWAR_SOV_the_scientific_superpower_desc:0 "From the laboratories of Akademgorodok to the launch pads of Baikonur, Soviet science has become a pillar of national power. The Union trains more engineers and scientists than any other nation and competes with the United States in every field from physics to spaceflight. Science is no longer merely a tool of the state but the proud face of socialism before the world."
 COLDWAR_SOV_the_soviet_army:0 "The Soviet Army"
 COLDWAR_SOV_the_soviet_army_desc:0 "The Soviet Army is the most powerful land force in the world: well over a hundred divisions, tens of thousands of tanks and a doctrine shaped by the experience of the Great Patriotic War. Its groups of forces stand guard in East Germany, Poland, Czechoslovakia and Hungary, while new divisions reinforce the border with China. Maintaining its readiness is the first duty of the state."
 COLDWAR_SOV_grechkos_ministry:0 "Grechko's Ministry"
 COLDWAR_SOV_grechkos_ministry_desc:0 "Marshal Andrei Grechko, Minister of Defence since 1967, is a veteran of the battle for the Caucasus and a firm believer in massive conventional forces. Under his leadership the armed forces receive new tanks, missiles and infantry weapons, and the military gains a stronger voice in the Politburo. Grechko's ministry is a guarantee of strength, and a constant demand on the resources of the Union."
 COLDWAR_SOV_the_doctrine_debate:0 "The Doctrine Debate"
 COLDWAR_SOV_the_doctrine_debate_desc:0 "Since Marshal Sokolovsky's 'Military Strategy' appeared in 1962, Soviet planners have assumed that any war with NATO would turn nuclear within days. A younger generation in the General Staff now argues that massed armour could reach the Rhine before the West dares to escalate. Should the Soviet Army prepare to fight beneath the mushroom cloud, or to win so quickly that the warheads never leave their silos?"
 COLDWAR_SOV_deep_operations_revived:0 "Deep Operations Revived"
 COLDWAR_SOV_deep_operations_revived_desc:0 "Rehabilitated along with its author after the purges, Marshal Tukhachevsky's theory of deep operations is returning to the lecture halls of the Frunze Academy. Instead of grinding through NATO's forward defences, successive echelons of tanks and motor rifles would strike across the entire depth of the enemy position at once. By the middle of the decade the idea is once again the guiding star of Soviet operational art."
 COLDWAR_SOV_the_nuclear_battlefield:0 "The Nuclear Battlefield"
 COLDWAR_SOV_the_nuclear_battlefield_desc:0 "Sokolovsky's school holds that no war in Europe can stay conventional for long, and that the Soviet Army must be built accordingly. Divisions will train to advance through contaminated ground in sealed vehicles, while the rocket troops open the way with tactical warheads. It is a grim doctrine, but one that refuses to pretend the nuclear age never arrived."
 COLDWAR_SOV_operational_manoeuvre_groups:0 "Operational Manoeuvre Groups"
 COLDWAR_SOV_operational_manoeuvre_groups_desc:0 "Marshal Nikolai Ogarkov and his staff propose a sharper blade for the deep battle: operational manoeuvre groups, powerful tank formations that slip through the first breach and race into NATO's rear before reserves can be committed or nuclear release authorised. Headquarters, airfields and missile sites would fall before the enemy understands what has happened. Speed itself becomes the decisive weapon."
 COLDWAR_SOV_theatres_of_military_operations:0 "Theatres of Military Operations"
 COLDWAR_SOV_theatres_of_military_operations_desc:0 "A war against NATO and China would be fought on several fronts at once, too many for the General Staff in Moscow to direct alone. In 1979 permanent high commands are created for the Western, South-Western, Southern and Far Eastern theatres, each able to control several fronts and fleets in wartime. Command is pushed forward, closer to the battle it must win."
 COLDWAR_SOV_the_tank_question:0 "The Tank Question"
 COLDWAR_SOV_the_tank_question_desc:0 "Kharkov's T-64 is the most advanced tank in the world, but it is expensive, temperamental and difficult to build in the numbers a war with NATO would demand. Nizhny Tagil offers a simpler, sturdier machine derived from the same ideas. The defence industry must decide whether the Soviet Army fields a single main battle tank or tolerates two parallel lines of production."
 COLDWAR_SOV_t64_morozovs_masterpiece:0 "T-64: Morozov's Masterpiece"
 COLDWAR_SOV_t64_morozovs_masterpiece_desc:0 "Alexander Morozov's design bureau in Kharkov has given the Soviet Army a machine years ahead of anything in the West, with composite armour, a powerful smoothbore gun and an automatic loader. Committing fully to the T-64 means accepting its high cost and a complicated engine that keeps the mechanics busy. The elite divisions facing NATO in Germany will receive the finest tank the Union can build."
 COLDWAR_SOV_t72_the_mass_tank:0 "T-72: The Mass Tank"
 COLDWAR_SOV_t72_the_mass_tank_desc:0 "Uralvagonzavod in Nizhny Tagil has produced a tank built for the realities of mass war: robust, simple to maintain and cheap enough to equip reserve divisions and allied armies alike. The T-72 will never be the most sophisticated machine on the battlefield, but it can be built in vast numbers and sold across the socialist world. In a long war, quantity has a quality all its own."
 COLDWAR_SOV_t80_gas_turbine:0 "T-80: The Gas Turbine Tank"
 COLDWAR_SOV_t80_gas_turbine_desc:0 "The Kirov Plant in Leningrad proposes a radical solution: a tank powered by a gas turbine, giving it the acceleration of a sports car and the thirst of an aircraft. Dmitry Ustinov is an enthusiastic patron, and the T-80 promises a mobility no NATO formation could hope to match. Whether its engines can survive a long winter campaign is a question the engineers must still answer."
 COLDWAR_SOV_mod_mechanized_attack_factor_tt:0 "$MODIFIER_MECHANIZED_ATTACK_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SOV_bmp_infantry_in_armour:0 "BMP: Infantry in Armour"
 COLDWAR_SOV_bmp_infantry_in_armour_desc:0 "The BMP-1 has changed the meaning of infantry. For the first time riflemen can fight from inside an armoured vehicle carrying its own gun and anti-tank missile, keeping pace with the tanks even across contaminated ground. Building tactics and production around the infantry fighting vehicle will give every motor rifle regiment the protection and firepower the modern battlefield demands."
 COLDWAR_SOV_ak74:0 "AK-74"
 COLDWAR_SOV_ak74_desc:0 "The Kalashnikov has armed half the world, but its heavy cartridge is a relic of the Second World War. Izhmash has developed a lighter weapon firing a small-calibre, high-velocity round that is more accurate at range and lets each soldier carry more ammunition. Adopted in 1974, the AK-74 will become the standard rifle of the Soviet Army for decades to come."
 COLDWAR_SOV_the_praporshchiki:0 "The Praporshchiki"
 COLDWAR_SOV_the_praporshchiki_desc:0 "The conscript army turns over every two years, and the gap between raw recruits and their officers has long been filled by no one. In 1972 the rank of praporshchik is introduced: long-serving professional warrant officers who manage stores, vehicles and discipline at company level. They cost more than conscripts, but they give the Soviet Army a backbone of experience it has always lacked."
 COLDWAR_SOV_against_dedovshchina:0 "Against Dedovshchina"
 COLDWAR_SOV_against_dedovshchina_desc:0 "In the barracks, second-year conscripts, the so-called 'grandfathers', rule over the newcomers through beatings, extortion and humiliation that officers prefer not to see. Breaking this unwritten hierarchy means prosecuting the tormentors, punishing commanders who look away and admitting that the problem exists at all. The generals resent the interference, but an army that preys on itself cannot fight well."
 COLDWAR_SOV_mod_paradrop_organization_factor_tt:0 "$MODIFIER_PARADROP_ORGANIZATION_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SOV_mod_special_forces_cap_tt:0 "Special Forces Cap: $RIGHT|+=2$"
 COLDWAR_SOV_margelovs_airborne:0 "Margelov's Airborne"
 COLDWAR_SOV_margelovs_airborne_desc:0 "General Vasily Margelov has turned the Airborne Troops into an elite force, with their striped vests, blue berets and air-dropped armoured vehicles. Soldiers already call them 'Uncle Vasya's Troops'. Raising the airborne divisions to a strategic reserve of the High Command would give Moscow a force able to seize capitals, airfields and bridgeheads anywhere within reach of the transport fleet."
 COLDWAR_SOV_mod_special_forces_attack_factor_tt:0 "$MODIFIER_SPECIAL_FORCES_ATTACK_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SOV_spetsnaz_of_the_gru:0 "Spetsnaz of the GRU"
 COLDWAR_SOV_spetsnaz_of_the_gru_desc:0 "Military intelligence maintains its own special purpose brigades, small teams trained to parachute deep behind enemy lines, locate NATO's tactical nuclear weapons and destroy them before they can be used. Expanding the Spetsnaz of the GRU would give every front a hidden sword in the enemy's rear. Their very existence remains a closely guarded secret, even within the Soviet Army itself."
 COLDWAR_SOV_mi24_the_flying_tank:0 "Mi-24: The Flying Tank"
 COLDWAR_SOV_mi24_the_flying_tank_desc:0 "Mil's design bureau has created something without parallel: a heavily armoured gunship that can also carry a squad of infantry into battle. The Mi-24 combines rockets, cannon and anti-tank missiles with the speed to strike anywhere along the front. Soldiers already call it the 'flying tank', and its silhouette will soon become one of the most feared in the world."
 COLDWAR_SOV_rocket_artillery:0 "Grad and Uragan"
 COLDWAR_SOV_rocket_artillery_desc:0 "The legacy of the wartime Katyusha lives on in the Grad, a truck-mounted launcher able to saturate an entire grid square in seconds. Its heavier successor, the Uragan, is already being designed to strike targets far behind the front. Massing rocket artillery would give Soviet commanders the crushing firepower needed to blast open NATO's defences ahead of the armoured breakthrough."
 COLDWAR_SOV_universal_military_duty:0 "Universal Military Duty"
 COLDWAR_SOV_universal_military_duty_desc:0 "The 1967 Law on Universal Military Duty shortened service to two years but made it truly universal, backed by pre-conscription training in schools and by the volunteer society DOSAAF. Every young Soviet man is meant to arrive at his unit already able to shoot, drive and read a map. The army gains a deep pool of trained reserves, and society learns to see service as a debt owed to the Motherland."
 COLDWAR_SOV_ustinovs_ministry:0 "Ustinov's Ministry"
 COLDWAR_SOV_ustinovs_ministry_desc:0 "In 1976 the death of Marshal Grechko brings Dmitry Ustinov to the Ministry of Defence, a lifelong manager of the armaments industry rather than a field commander. Ustinov knows every factory and design bureau personally, and under him weapons will flow faster and cheaper than ever before. The professional soldiers grumble that an industrialist, not a general, now runs the Soviet Army."
 COLDWAR_SOV_the_army_of_a_superpower:0 "The Army of a Superpower"
 COLDWAR_SOV_the_army_of_a_superpower_desc:0 "A generation after Victory, the Soviet Army stands as the largest and most powerful land force on earth, with divisions deployed from the Elbe to the Amur. Its officers are well trained, its arsenals full and its doctrine studied by friend and foe alike. Now it must prove that it is more than a parade on Red Square: a force ready to win any war the Motherland may be forced to fight."
 COLDWAR_SOV_strategic_rocket_forces:0 "Strategic Rocket Forces"
 COLDWAR_SOV_strategic_rocket_forces_desc:0 "Created by Khrushchev in 1959, the Strategic Rocket Forces have become the senior service of the Soviet military, guardians of the missiles that can reach any point on the globe. Their silos stretch from Belorussia to the Siberian taiga. Investing in new generations of intercontinental missiles will ensure that the Soviet Union can never again be blackmailed by American nuclear superiority."
 COLDWAR_SOV_nuclear_parity:0 "Nuclear Parity"
 COLDWAR_SOV_nuclear_parity_desc:0 "For the first time in history, the Soviet Union possesses as many intercontinental missiles as the United States. The humiliation of Cuba in 1962 has been answered by a decade of relentless construction, and Washington must now negotiate with Moscow as an equal. Parity brings confidence to the Kremlin, but also a new and dangerous temptation to believe that any confrontation can be won."
 COLDWAR_SOV_the_heavy_icbm:0 "R-36M: The Heavy ICBM"
 COLDWAR_SOV_the_heavy_icbm_desc:0 "The Yuzhnoye design bureau in Dnepropetrovsk is preparing the R-36M, a missile so large that it can carry ten warheads or a single devastating charge. In the West it will be called the SS-18 'Satan', and its accuracy threatens the American Minuteman silos themselves. Deploying it would give the Soviet Union a genuine first-strike capability, and Washington will see it exactly that way."
 COLDWAR_SOV_mirv_and_mobile_launchers:0 "MIRVs and Mobile Launchers"
 COLDWAR_SOV_mirv_and_mobile_launchers_desc:0 "Fixed silos can be targeted, and every year American missiles grow more accurate. Some designers argue that survivability matters more than sheer numbers: several independently targeted warheads on every missile, and launchers that roam the roads and railways where no satellite can follow them. A smaller arsenal that cannot be destroyed in a first strike may deter more effectively than a larger one that can."
 COLDWAR_SOV_pioneer_the_ss20:0 "Pioneer: The SS-20"
 COLDWAR_SOV_pioneer_the_ss20_desc:0 "The ageing missiles aimed at Western Europe can be replaced by the RSD-10 Pioneer, a mobile and accurate weapon carrying three warheads. NATO will call it the SS-20, and it can hold every capital from London to Rome hostage without ever threatening America itself. It would give Moscow a powerful lever over Europe, but it may also provoke Bonn and its allies into a dangerous response."
 COLDWAR_SOV_mod_static_anti_air_damage_factor_tt:0 "Static Anti-Air Damage: $RIGHT|+=%1$"
 COLDWAR_SOV_pvo_strany:0 "PVO Strany"
 COLDWAR_SOV_pvo_strany_desc:0 "Unlike any Western nation, the Soviet Union treats the defence of its own airspace as a separate branch of the armed forces. PVO Strany commands the radars, interceptor regiments and missile batteries stretching from the Baltic to the Pacific coast. Strengthening it will ensure that no American bomber or spy plane crosses the Soviet border without paying for it, as Gary Powers learned in 1960."
 COLDWAR_SOV_mod_air_intercept_efficiency_tt:0 "$MODIFIER_AIR_INTERCEPT_EFFICIENCY$: $RIGHT|+=%1$"
 COLDWAR_SOV_the_moscow_shield:0 "A-35: The Moscow Shield"
 COLDWAR_SOV_the_moscow_shield_desc:0 "Around the capital the A-35 anti-ballistic missile system is finally entering service, with enormous radars and interceptors designed to destroy incoming warheads high above the atmosphere. It cannot stop a full American attack, but it can protect the leadership against a limited strike or an accidental launch. Completing the shield will be expensive, and it may yet become a bargaining chip in future arms control talks."
 COLDWAR_SOV_frontal_aviation:0 "Frontal Aviation"
 COLDWAR_SOV_frontal_aviation_desc:0 "Frontal Aviation is the air arm that fights alongside the ground forces, clearing the skies above the tank columns and striking NATO airfields, bridges and nuclear launchers. Its regiments in East Germany and Czechoslovakia stand only minutes from the inner German border. Refining its tactics and training will turn the air force into a true partner of the deep operation rather than a separate war fought overhead."
 COLDWAR_SOV_swing_wings:0 "Swing Wings: MiG-23 and Su-24"
 COLDWAR_SOV_swing_wings_desc:0 "Variable-geometry wings promise the best of both worlds: short take-offs from rough forward airfields and high speed at low level. Mikoyan's MiG-23 is set to become the workhorse fighter of the Warsaw Pact, while Sukhoi's Su-24 can penetrate deep into Western Europe at treetop height, by night and in any weather. Together they will carry Frontal Aviation into a new decade."
 COLDWAR_SOV_mig25_foxbat:0 "MiG-25 Foxbat"
 COLDWAR_SOV_mig25_foxbat_desc:0 "Designed to catch an American supersonic bomber that was never built, the MiG-25 can race at nearly three times the speed of sound at the edge of the stratosphere. No Western fighter can catch it and few missiles can reach it. Pressing it into service as an interceptor and reconnaissance aircraft would give the air defence forces a weapon that truly lives up to its legend."
 COLDWAR_SOV_long_range_aviation:0 "Long-Range Aviation"
 COLDWAR_SOV_long_range_aviation_desc:0 "The strategic bombers of Long-Range Aviation have long lived in the shadow of the rocket forces. Tupolev's Tu-22M, known in the West as the 'Backfire', promises to change that: a supersonic swing-wing bomber able to strike carrier groups at sea and targets across Europe and Asia. Whether it could also reach America will become a fierce question at every arms control table."
 COLDWAR_SOV_the_fourth_generation:0 "The Fourth Generation"
 COLDWAR_SOV_the_fourth_generation_desc:0 "The American F-15 and F-16 have set a new standard in the air, and Soviet designers are determined to answer them. Sukhoi's Su-27 promises long range and extraordinary agility, while Mikoyan's MiG-29 will be a nimble frontline fighter for the whole Warsaw Pact. Accelerating both programmes would give the Soviet Air Force aircraft capable of matching, perhaps surpassing, anything the West can field."
 COLDWAR_SOV_civil_defence_of_the_ussr:0 "Civil Defence of the USSR"
 COLDWAR_SOV_civil_defence_of_the_ussr_desc:0 "Civil Defence of the USSR teaches every schoolchild to put on a gas mask and every factory to prepare its shelters. Deep metro stations double as bunkers, and evacuation plans exist for every major city. Expanding the programme reassures the population that the state has prepared for the worst, and signals to Washington that the Soviet Union intends to survive even a nuclear war."
 COLDWAR_SOV_strategic_superiority:0 "The Correlation of Forces"
 COLDWAR_SOV_strategic_superiority_desc:0 "At the Twenty-Fifth Party Congress in 1976, Brezhnev declares that the correlation of forces in the world has shifted decisively in favour of socialism. Nuclear parity, the American defeat in Vietnam and revolutions across Africa all seem to prove him right. Embracing this confidence turns caution into assertiveness, but the West may well read Soviet optimism as a threat to be countered."
 COLDWAR_SOV_gorshkovs_navy:0 "Gorshkov's Ocean-Going Navy"
 COLDWAR_SOV_gorshkovs_navy_desc:0 "Admiral Sergei Gorshkov has commanded the Soviet Navy since 1956, and he has a vision: a fleet able to sail every ocean and show the red flag wherever the Americans go. Coastal defence is no longer enough for a superpower. Under his guidance new cruisers, submarines and replenishment ships are turning a navy built for home waters into a true ocean-going fleet."
 COLDWAR_SOV_okean_70:0 "Exercise Okean-70"
 COLDWAR_SOV_okean_70_desc:0 "In April 1970 the Soviet Navy stages Okean, the largest naval exercise since the Second World War. Ships of the Northern, Baltic, Black Sea and Pacific Fleets manoeuvre simultaneously across the Atlantic, the Pacific and the Mediterranean, rehearsing the destruction of American carrier groups. The message to Washington is unmistakable: the oceans no longer belong to the West alone."
 COLDWAR_SOV_mod_industrial_capacity_dockyard_tt:0 "Dockyard Output: $RIGHT|+=%1$"
 COLDWAR_SOV_the_navy_question:0 "Sea Power of the State"
 COLDWAR_SOV_the_navy_question_desc:0 "Admiral Gorshkov preaches that a superpower needs a balanced fleet, yet resources are finite and the admirals are divided into two camps. One side wants submarines above all, cheap to hide and deadly against carriers and convoys. The other dreams of carriers and great surface ships able to project Soviet power to distant shores. The Party must decide what kind of sea power the state requires."
 COLDWAR_SOV_the_submarine_fleet:0 "The Submarine Fleet"
 COLDWAR_SOV_the_submarine_fleet_desc:0 "Submarines are the great equaliser of the Soviet Navy. Hunter-killer boats can stalk American carriers and convoys, while missile submarines carry a share of the nuclear deterrent that no enemy can find and destroy. Concentrating the shipyards on the underwater fleet will give the Soviet Union the largest submarine force in the world and a nuclear arsenal hidden beneath the waves."
 COLDWAR_SOV_mod_navy_submarine_attack_factor_tt:0 "$MODIFIER_NAVY_SUBMARINE_ATTACK_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SOV_the_bastion_strategy:0 "The Bastion Strategy"
 COLDWAR_SOV_the_bastion_strategy_desc:0 "Rather than sending missile submarines into the open Atlantic, where American hunters lie in wait, the Navy can keep them close to home. The Barents Sea and the Sea of Okhotsk would become protected bastions, guarded by surface ships, aircraft and attack submarines. From these sanctuaries new long-range missiles could still reach the United States, while the boats themselves remain safe."
 COLDWAR_SOV_lira_the_titanium_submarine:0 "Lira: The Titanium Submarine"
 COLDWAR_SOV_lira_the_titanium_submarine_desc:0 "Project 705, which NATO will call the Alfa, is a submarine unlike any other: a titanium hull, a liquid-metal reactor and a crew so small that automation replaces most of its sailors. It can outrun almost any torpedo in the Western arsenal and dive deeper than its pursuers. The cost is staggering and the reactor temperamental, but no other navy on earth could build such a vessel."
 COLDWAR_SOV_akula_the_typhoon:0 "Akula: The Typhoon"
 COLDWAR_SOV_akula_the_typhoon_desc:0 "The Rubin design bureau proposes the largest submarine ever built: Project 941 Akula, which the West will call the Typhoon. With a hull broad and strong enough to break through Arctic ice, it could surface near the North Pole and launch its missiles at America. Building such giants will strain the yards of Severodvinsk, but they would make the naval deterrent virtually invulnerable."
 COLDWAR_SOV_carriers_and_cruisers:0 "Carriers and Cruisers"
 COLDWAR_SOV_carriers_and_cruisers_desc:0 "Submarines can sink a fleet, but they cannot show the flag or support allies in distant waters. A balanced fleet of aircraft-carrying cruisers and heavy missile cruisers would let the Soviet Union project power from the Mediterranean to the Indian Ocean. The yards of Nikolaev and Leningrad stand ready, if the Party is willing to pay for a true ocean-going surface navy."
 COLDWAR_SOV_the_kiev_class:0 "The Kiev Class"
 COLDWAR_SOV_the_kiev_class_desc:0 "The Black Sea Shipyard in Nikolaev is preparing a new type of warship: the heavy aircraft-carrying cruiser. The Kiev class combines vertical take-off jets and helicopters with heavy anti-ship missiles, and as a 'cruiser' it can legally pass through the Turkish Straits. It is not yet a true aircraft carrier, but it is the first step toward one."
 COLDWAR_SOV_kirov_the_battlecruiser:0 "Kirov: The Battlecruiser"
 COLDWAR_SOV_kirov_the_battlecruiser_desc:0 "Project 1144, the Kirov class, would be the largest surface combatant built anywhere since the Second World War: a nuclear-powered battlecruiser bristling with anti-ship and anti-aircraft missiles. Its purpose is to lead surface action groups against American carriers and to shield Soviet submarines on their way to sea. Its sheer size announces that the Soviet Navy has come of age."
 COLDWAR_SOV_the_fifth_eskadra:0 "The Fifth Eskadra"
 COLDWAR_SOV_the_fifth_eskadra_desc:0 "The Fifth Operational Squadron keeps Soviet warships permanently in the Mediterranean, shadowing the American Sixth Fleet and showing support for Arab allies. To stay at sea it needs friendly harbours for supplies and repairs. Moscow will ask Damascus for a naval supply point at Tartus, an arrangement that could give the Soviet Union a lasting foothold on the Mediterranean coast."
 COLDWAR_SOV_naval_missile_aviation:0 "Naval Missile Aviation"
 COLDWAR_SOV_naval_missile_aviation_desc:0 "Naval Missile Aviation is the long arm of Gorshkov's fleet: regiments of land-based bombers armed with heavy anti-ship missiles. Their task is to find American carrier groups far out at sea and overwhelm them with massed missile strikes before their aircraft can threaten the Soviet coast. Expanding this force is the most economical way to challenge American dominance of the oceans."
 COLDWAR_SOV_bases_on_three_oceans:0 "Bases on Three Oceans"
 COLDWAR_SOV_bases_on_three_oceans_desc:0 "A global navy needs global harbours. Berbera in Somalia and Aden in South Yemen overlook the gateway between the Red Sea and the Indian Ocean, while Cam Ranh Bay in Vietnam looks out over the South China Sea. Moscow will offer its partners aid and protection in exchange for port rights, but no ally will be forced to accept the offer."
 COLDWAR_SOV_the_shipyards_of_the_north:0 "Severodvinsk and Nikolaev"
 COLDWAR_SOV_the_shipyards_of_the_north_desc:0 "Every ship of the ocean-going fleet must first be built, and the great yards are already working at the limit of their capacity. Severodvinsk on the White Sea launches the nuclear submarines, while Nikolaev on the Black Sea produces the large surface ships. Expanding both will ensure that the ambitions of the admirals are not frustrated by a simple shortage of slipways."
 COLDWAR_SOV_a_navy_of_a_superpower:0 "A Navy of a Superpower"
 COLDWAR_SOV_a_navy_of_a_superpower_desc:0 "Where once the Soviet Navy hugged the coastline, its ships now sail every ocean on earth. Squadrons patrol the Mediterranean, the Indian Ocean and the South China Sea, and Soviet flags fly in harbours from Havana to Aden. Gorshkov's dream has become reality: a true blue-water navy, the equal of any fleet that sails the seas."
 COLDWAR_SOV_mod_encryption_factor_tt:0 "$MODIFIER_ENCRYPTION_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SOV_andropovs_kgb:0 "Andropov's KGB"
 COLDWAR_SOV_andropovs_kgb_desc:0 "Since 1967 Yuri Andropov has led the Committee for State Security, and he has transformed it. Gone are the crude terror methods of the Stalin years; in their place stands a modern, professional service relying on surveillance, informers and the quiet pressure of 'prophylactic' conversations. Andropov is intelligent, ambitious and trusted by Brezhnev, and his KGB is becoming a pillar of the state."
 COLDWAR_SOV_the_fifth_directorate:0 "The Fifth Directorate"
 COLDWAR_SOV_the_fifth_directorate_desc:0 "Created on Andropov's initiative in 1967, the Fifth Directorate of the KGB is tasked with combating 'ideological subversion'. Its officers watch writers, churches, national movements and anyone who listens too closely to foreign radio. Expanding its reach will help the Party detect dissent before it can spread, though every new file deepens the silence that hangs over Soviet intellectual life."
 COLDWAR_SOV_the_dissident_question:0 "The Dissident Question"
 COLDWAR_SOV_the_dissident_question_desc:0 "Since the trial of Sinyavsky and Daniel in 1966, a small but stubborn dissident movement has taken shape. Samizdat manuscripts circulate from hand to hand, Andrei Sakharov speaks out for human rights, and Solzhenitsyn's novels reach the world through foreign publishers. The state must decide whether to crush these voices, expel them, or quietly allow them a space to exist."
 COLDWAR_SOV_punitive_psychiatry:0 "Punitive Psychiatry"
 COLDWAR_SOV_punitive_psychiatry_desc:0 "If opposing Soviet power is a sign of madness, then dissidents belong in hospitals rather than prisons. Psychiatrists of the Serbsky Institute have developed a convenient diagnosis, 'sluggish schizophrenia', that can be applied to anyone who refuses to conform. The special psychiatric hospitals will silence the troublemakers, but the West will condemn the practice as a grotesque abuse of medicine."
 COLDWAR_SOV_exile_and_expulsion:0 "Exile and Expulsion"
 COLDWAR_SOV_exile_and_expulsion_desc:0 "Neither prison nor tolerance: the most troublesome voices can simply be removed. Solzhenitsyn, after the publication of 'The Gulag Archipelago' abroad, can be stripped of his citizenship and put on a plane to the West, while Sakharov can be banished to the closed city of Gorky. The dissidents lose their audience at home, though they gain a far louder one abroad."
 COLDWAR_SOV_tolerate_the_samizdat:0 "Tolerate the Samizdat"
 COLDWAR_SOV_tolerate_the_samizdat_desc:0 "What if the Party decided that typewritten manuscripts and private poetry readings posed no real threat to socialism? Tolerating samizdat would let new ideas circulate among scientists and intellectuals and soften the hostility of Western opinion. The KGB warns that tolerance is the first step toward another Prague Spring, but reformers argue that a confident socialism need not fear mere words."
 COLDWAR_SOV_the_refusenik_question:0 "The Refusenik Question"
 COLDWAR_SOV_the_refusenik_question_desc:0 "Since the Six-Day War, thousands of Soviet Jews have applied to emigrate to Israel, and many have been refused, losing their jobs and becoming 'refuseniks'. In Washington, Senator Henry Jackson seeks to link American trade benefits to the freedom to emigrate. The Kremlin must decide whether to open the gates for the sake of detente or to hold on to the specialists it has trained."
 COLDWAR_SOV_open_the_gates:0 "Open the Gates"
 COLDWAR_SOV_open_the_gates_desc:0 "Letting those who wish to leave depart would remove a constant irritant from relations with the United States and unlock the trade and credits the economy needs. It also means watching engineers, doctors and scientists board trains and planes for Vienna and onward to Israel. The Politburo weighs the loss of talent against the benefits of detente, and chooses to let them go."
 COLDWAR_SOV_the_diploma_tax:0 "The Diploma Tax"
 COLDWAR_SOV_the_diploma_tax_desc:0 "In August 1972 the Presidium of the Supreme Soviet decrees that emigrants must repay the cost of their state education before they may leave. For a university graduate the sum can equal many years of wages. The measure brings in hard currency and discourages the drain of talent, but it provokes outrage in the West and threatens the trade deals of detente."
 COLDWAR_SOV_the_first_chief_directorate:0 "The First Chief Directorate"
 COLDWAR_SOV_the_first_chief_directorate_desc:0 "The First Chief Directorate of the KGB runs Soviet intelligence abroad. Its officers work under diplomatic cover in embassies, trade missions and news agencies, recruiting sources in governments, armies and laboratories around the world. Expanding its networks and its codebreakers will give the Kremlin the secrets it needs to stay one step ahead of its rivals."
 COLDWAR_SOV_active_measures:0 "Active Measures"
 COLDWAR_SOV_active_measures_desc:0 "Service A of the First Chief Directorate specialises in 'active measures': forged documents, planted newspaper stories and quiet support for peace movements and friendly politicians in the West. Its aim is not to steal secrets but to shape opinion, sow distrust between Washington and its allies, and make the Soviet cause appear to be the cause of peace itself."
 COLDWAR_SOV_the_illegals:0 "The Illegals"
 COLDWAR_SOV_the_illegals_desc:0 "The most valuable agents carry no diplomatic passport at all. The illegals live for years under false identities in the West as shopkeepers, engineers or academics, waiting for the moment they are needed. Training them takes years and losing one is a disaster, but a well-placed illegal can reach places no embassy officer ever could, and vanish without a trace."
 COLDWAR_SOV_kgb_border_troops:0 "KGB Border Troops"
 COLDWAR_SOV_kgb_border_troops_desc:0 "The KGB Border Troops guard the longest frontier in the world, from the Baltic coast to the Pacific, from the Arctic tundra to the mountains of Central Asia. After the bloody clashes with China on the Ussuri in 1969, their importance is clearer than ever. Strengthening the border guards will keep foreign agents out, smugglers in check and Soviet citizens safely at home."
 COLDWAR_SOV_operation_ryan:0 "Operation RYaN"
 COLDWAR_SOV_operation_ryan_desc:0 "The leadership of the KGB has become convinced that the Americans are preparing a surprise nuclear attack. Operation RYaN, an acronym for 'nuclear missile attack' in Russian, orders every KGB and GRU station abroad to watch for warning signs: lights burning late at the Pentagon, blood banks filling up, officials cancelling their holidays. The hunt for the first strike may save the nation, or push the world to the brink."
 COLDWAR_SOV_the_anti_corruption_drive:0 "The Anti-Corruption Drive"
 COLDWAR_SOV_the_anti_corruption_drive_desc:0 "Corruption has spread through the Party and the state like rot through timber. Ministers protect their clients, regional leaders run their territories as personal fiefdoms, and goods vanish from factories into the black market. A determined campaign of arrests and investigations would restore discipline, but it will make powerful enemies among a nomenklatura that has grown comfortable under the stability of cadres."
 COLDWAR_SOV_the_shield_and_the_sword:0 "The Shield and the Sword"
 COLDWAR_SOV_the_shield_and_the_sword_desc:0 "Since the days of Dzerzhinsky, the Chekists have called themselves the shield and the sword of the Party. Under this banner the KGB can bind its many tasks into a single purpose, from counter-intelligence at home to guarding the borders and watching for ideological subversion. A security service at the height of its power makes the Soviet state very difficult to undermine from within or without."
 COLDWAR_SOV_the_union_of_republics:0 "The Union of Republics"
 COLDWAR_SOV_the_union_of_republics_desc:0 "The Soviet Union is a federation of fifteen republics, each with its own Party, government and flag. Behind the slogans of the friendship of peoples lie real tensions: national elites seeking autonomy, Russians resentful of subsidising the periphery, and a population growing fastest in the south. Moscow must learn to manage the Union as carefully as it manages the economy."
 COLDWAR_SOV_local_barons_or_moscows_men:0 "Local Barons or Moscow's Men?"
 COLDWAR_SOV_local_barons_or_moscows_men_desc:0 "Brezhnev's 'stability of cadres' has left powerful first secretaries in charge of the republics for years: Kunaev in Kazakhstan, Rashidov in Uzbekistan, Shcherbytsky in Ukraine. They deliver loyalty and plan figures, and in return Moscow leaves them largely alone. Should the Kremlin continue to trust these local barons, or send its own men to keep watch over them?"
 COLDWAR_SOV_trust_the_local_barons:0 "Trust the Local Barons"
 COLDWAR_SOV_trust_the_local_barons_desc:0 "The bargain is simple: the republican leaders keep their territories quiet, vote with Brezhnev in the Politburo and meet their plans, at least on paper. In exchange Moscow asks few questions about how they run their domains. The Union will be calmer and more cohesive, even if corruption and nepotism flourish behind the facades of Tashkent, Alma-Ata and Baku."
 COLDWAR_SOV_rotate_the_cadres:0 "Rotate the Cadres"
 COLDWAR_SOV_rotate_the_cadres_desc:0 "Trust is good, but control is better. Moscow will place Russian second secretaries in every republican Party organisation, rotate officials between regions and break up the local networks that shield corrupt leaders. The republics will resent the outsiders, but no first secretary will ever again be able to treat his republic as a personal possession."
 COLDWAR_SOV_the_ukrainian_question:0 "The Ukrainian Question"
 COLDWAR_SOV_the_ukrainian_question_desc:0 "Ukraine is the second pillar of the Union, home to vital industries, rich farmland and a large and proud nation. Its first secretary, Petro Shelest, defends Ukrainian culture and the republic's economic interests, sometimes too openly for Moscow's liking. The Kremlin must decide whether to tolerate Shelest's course or replace it with something more reliably loyal."
 COLDWAR_SOV_shelests_ukraine:0 "Shelest's Ukraine"
 COLDWAR_SOV_shelests_ukraine_desc:0 "What if Petro Shelest had kept his post? His book 'Our Soviet Ukraine' celebrates the republic's history and its Cossack traditions, and his leadership shields the Ukrainian language and intelligentsia. A Ukraine secure in its identity may prove a more willing partner in the Union, though some in Moscow fear it could also become a far more demanding one."
 COLDWAR_SOV_the_shcherbytsky_line:0 "The Shcherbytsky Line"
 COLDWAR_SOV_the_shcherbytsky_line_desc:0 "In 1972 Shelest is removed and Volodymyr Shcherbytsky, a close ally of Brezhnev, takes over in Kiev. Shelest's book is condemned as nationalist, and a wave of arrests sweeps through the Ukrainian intelligentsia while Russian gains ground in schools and publishing. Ukraine becomes a model of loyalty, but the resentment buried in those years does not simply disappear."
 COLDWAR_SOV_the_baltic_question:0 "The Baltic Showcase"
 COLDWAR_SOV_the_baltic_question_desc:0 "Estonia, Latvia and Lithuania are the most prosperous and Western-minded republics of the Union, with high living standards, a strong sense of national identity and long memories of independence. They can serve as a showcase of what socialism can achieve, or as a laboratory for deeper integration with the rest of the country. Moscow must choose how to treat its western frontier."
 COLDWAR_SOV_the_soviet_west:0 "The Soviet West"
 COLDWAR_SOV_the_soviet_west_desc:0 "Let the Baltic republics be the shop window of socialism. Tallinn's designers, the fashion houses of Riga and the cafes of Vilnius can show visitors, and the rest of the Union, that Soviet life can be modern and stylish. Estonians already watch Finnish television across the gulf; allowing them a little more freedom may win more loyalty than any campaign of Russification."
 COLDWAR_SOV_industrial_migration:0 "Industrial Migration"
 COLDWAR_SOV_industrial_migration_desc:0 "New industrial combines in Riga and Tallinn need workers, and the Baltic republics cannot supply enough of them. Bringing in labour from Russia, Ukraine and Belorussia will boost production and tie the region more closely to the Union. Yet every new apartment block filled with Russian-speaking workers feeds the fear among Latvians and Estonians that they are becoming minorities in their own lands."
 COLDWAR_SOV_the_caucasus:0 "The Caucasus"
 COLDWAR_SOV_the_caucasus_desc:0 "Georgia, Armenia and Azerbaijan form the southern frontier of the Union, a region of ancient nations, fierce pride and old rivalries. Their economies thrive on private plots and the shadow market as much as on the plan, and their Party bosses are among the most corrupt in the country. Bringing order to Transcaucasia will require both a firm hand and a careful touch."
 COLDWAR_SOV_shevardnadze_cleans_tbilisi:0 "Shevardnadze Cleans Up Tbilisi"
 COLDWAR_SOV_shevardnadze_cleans_tbilisi_desc:0 "In 1972 Eduard Shevardnadze, the Georgian minister of internal affairs, replaces the discredited Vasil Mzhavanadze as first secretary in Tbilisi. He launches a sweeping campaign against bribery and the black market, purging thousands of officials. Georgians are astonished, Moscow is impressed, and the ambitious new leader begins a career that may take him far beyond the Caucasus."
 COLDWAR_SOV_aliyev_in_baku:0 "Aliyev in Baku"
 COLDWAR_SOV_aliyev_in_baku_desc:0 "Heydar Aliyev, a career KGB officer, has led Azerbaijan since 1969. He presents himself as a scourge of corruption while building a network of loyal clans, and he flatters Brezhnev lavishly on every visit. Under his rule the oil industry of Baku is modernised and the republic reports spectacular growth. Backing Aliyev buys stability on the Caspian, at a price that is never written down."
 COLDWAR_SOV_the_karabakh_petitions:0 "The Karabakh Petitions"
 COLDWAR_SOV_the_karabakh_petitions_desc:0 "The Armenians of Nagorno-Karabakh, an autonomous region inside Azerbaijan, have petitioned Moscow for decades to be transferred to Armenia, and each time the request is quietly buried. Granting it would satisfy Yerevan but enrage Baku; refusing it preserves the status quo while the grievance festers. Historically, this very question would begin to tear the Union apart in 1988."
 COLDWAR_SOV_the_central_asian_barons:0 "The Central Asian Barons"
 COLDWAR_SOV_the_central_asian_barons_desc:0 "In Central Asia, Kunaev in Kazakhstan and Rashidov in Uzbekistan rule with an almost feudal authority. Their republics deliver cotton, grain and unwavering loyalty, and in return Moscow tolerates their clans, their courts of flatterers and their creative accounting. The arrangement keeps the region calm, but the Kremlin knows less and less about what really happens in Tashkent and Alma-Ata."
 COLDWAR_SOV_the_cotton_affair:0 "The Cotton Affair"
 COLDWAR_SOV_the_cotton_affair_desc:0 "Uzbekistan reports record cotton harvests year after year, and Moscow pays billions of roubles for them. But investigators suspect that much of this cotton exists only on paper, with the difference pocketed by a pyramid of officials reaching all the way to the top of the republic. Exposing the fraud would strike a mighty blow against corruption, but it will humiliate an entire republic."
 COLDWAR_SOV_the_language_question:0 "The Language Question"
 COLDWAR_SOV_the_language_question_desc:0 "More than a hundred languages are spoken across the Soviet Union, and the question of which should be taught in schools is never merely educational. Russian binds together the Union, the army and the economy, but the national languages carry the identity of each people. Moscow must decide how far to promote Russian and how much room to leave for the native tongues."
 COLDWAR_SOV_russian_as_lingua_franca:0 "Russian as the Language of Inter-Ethnic Communication"
 COLDWAR_SOV_russian_as_lingua_franca_desc:0 "A decree of 1978 strengthens the teaching of Russian from the very first grade in every school of the Union, praising it as the language of inter-ethnic communication. Conscripts from Tashkent to Tallinn will understand their officers, and engineers can move freely between the republics. Yet when Georgia's language rights are threatened that same year, crowds fill the streets of Tbilisi in protest."
 COLDWAR_SOV_native_language_schools:0 "Native Language Schools"
 COLDWAR_SOV_native_language_schools_desc:0 "Rather than forcing Russian into every classroom, the Party could guarantee schooling in the native language of each republic, with Russian taught as a second tongue. National intelligentsias would welcome the gesture, and the friendship of peoples would sound less like Russification. The army complains that recruits arrive unable to follow orders, but loyalty freely given may be worth more."
 COLDWAR_SOV_tt_cohesion_lt_40:0 "§YUnion cohesion§! below §Y40§!"
 COLDWAR_SOV_the_union_treaty_question:0 "The Union Treaty Question"
 COLDWAR_SOV_the_union_treaty_question_desc:0 "The Union Treaty of 1922 bound the republics together, but the state it created is now groaning under the weight of national demands, economic strain and political doubt. If the bonds begin to weaken, Moscow must choose: renegotiate the Union as a voluntary federation of sovereign states, or hold it together through sheer force of will and arms."
 COLDWAR_SOV_the_renewed_federation:0 "The Renewed Federation"
 COLDWAR_SOV_the_renewed_federation_desc:0 "A new treaty could transform the Soviet Union into a genuine federation of sovereign republics, with real powers over their economies, languages and cultures, united by a common defence, currency and foreign policy. The hardliners see it as the beginning of the end. The reformers answer that a union held together by consent is the only union that can truly last."
 COLDWAR_SOV_the_iron_union:0 "The Iron Union"
 COLDWAR_SOV_the_iron_union_desc:0 "There will be no new treaty and no negotiation with nationalists. The Union was forged in revolution and war and will be preserved by the same means: the KGB will watch the national movements, the army will stand ready, and any first secretary who flirts with separatism will be removed. Order will be maintained, but at the cost of the goodwill of millions."
 COLDWAR_SOV_the_soviet_people_realised:0 "The Soviet People"
 COLDWAR_SOV_the_soviet_people_realised_desc:0 "The Party has long proclaimed the emergence of a new historical community: the Soviet people, bound together not by blood or language but by shared ideals and a common future. With the Union secured, this promise may finally become reality, as Uzbeks, Ukrainians and Latvians come to see themselves as Soviet citizens first and foremost."
 COLDWAR_SOV_the_soviet_way_of_life:0 "The Soviet Way of Life"
 COLDWAR_SOV_the_soviet_way_of_life_desc:0 "Guaranteed work, cheap bread, free healthcare and a separate apartment for every family: this is the promise of the Soviet way of life. For millions who remember the war and the crowded communal flats, these are the best years they have ever known. Celebrating these achievements reminds the people what they owe to socialism, and what they stand to lose."
 COLDWAR_SOV_the_alcohol_problem:0 "The Alcohol Problem"
 COLDWAR_SOV_the_alcohol_problem_desc:0 "Vodka is woven into every celebration, every bargain and every tragedy of Soviet life. Consumption keeps climbing year after year, and alcoholism fills the hospitals, empties the factories and shortens the lives of Soviet men. Yet the sale of alcohol also fills the state treasury. The Party must decide whether it can afford to fight the bottle, or afford not to."
 COLDWAR_SOV_the_vodka_monopoly:0 "The Vodka Monopoly"
 COLDWAR_SOV_the_vodka_monopoly_desc:0 "The state monopoly on vodka brings in a huge share of all retail revenue, money the budget simply cannot do without. Rather than fighting the national vice, the Ministry of Finance will quietly profit from it. Hospitals and factories will pay the price in absent workers and ruined health, but as long as the shelves are stocked, the people remain content."
 COLDWAR_SOV_the_1972_temperance_decree:0 "The 1972 Temperance Decree"
 COLDWAR_SOV_the_1972_temperance_decree_desc:0 "In 1972 the Central Committee resolves to combat drunkenness and alcoholism, restricting opening hours, raising prices and cutting the production of strong spirits. Enforced seriously, the decree could save lives and lift labour productivity, though the treasury will lose a vital source of income. Many citizens will simply turn to home-distilled samogon, and their goodwill toward the Party may suffer."
 COLDWAR_SOV_the_sporting_superpower:0 "The Sporting Superpower"
 COLDWAR_SOV_the_sporting_superpower_desc:0 "From the Olympic podium to the ice hockey rink, the chessboard and the football pitch, Soviet athletes prove the strength of socialism to the whole world. Sports schools search for talent in every town and village, and champions become national heroes. Investing in sport costs little compared to missiles, yet every gold medal is a small victory in the Cold War."
 COLDWAR_SOV_the_moscow_olympics:0 "The Moscow Olympics"
 COLDWAR_SOV_the_moscow_olympics_desc:0 "In 1974 the International Olympic Committee awards the 1980 Summer Games to Moscow, the first Olympics ever to be held in a socialist country. New stadiums, hotels and an Olympic village must be built, and the capital polished for the eyes of the world. The Games promise a triumph of Soviet prestige, unless the West decides to stay away."
 COLDWAR_SOV_culture_question:0 "Between Thaw and Frost"
 COLDWAR_SOV_culture_question_desc:0 "The cultural thaw of the Khrushchev years is long over, but it has never been fully reversed. Writers, filmmakers and theatre directors test the limits of what the censors will allow, and audiences flock to anything that hints at forbidden truths. The Party must decide whether to tighten its grip on culture or to permit a carefully managed openness."
 COLDWAR_SOV_glavlit_holds_the_line:0 "Glavlit Holds the Line"
 COLDWAR_SOV_glavlit_holds_the_line_desc:0 "Glavlit, the central censorship office, reviews every book, newspaper and film before it reaches the public. Under firm instructions from the ideological apparatus, it will continue to cut, delay and ban anything that strays from the Party line. Soviet culture will remain safely orthodox, while its most gifted artists either conform, fall silent or turn to samizdat."
 COLDWAR_SOV_cultural_detente:0 "Cultural Detente"
 COLDWAR_SOV_cultural_detente_desc:0 "Lyubimov's Taganka Theatre stages daring productions, Vysotsky's songs play on tape recorders in every apartment block, and Tarkovsky films masterpieces that the censors struggle to understand. What if the Party chose to tolerate rather than suppress them? A measure of cultural freedom could reconcile the intelligentsia with the state and show the world a more human face of socialism."
 COLDWAR_SOV_the_church_question:0 "The Church Question"
 COLDWAR_SOV_the_church_question_desc:0 "Despite decades of persecution, the Russian Orthodox Church endures, as do Muslim, Catholic, Baptist and Jewish communities across the Union. The Council for Religious Affairs keeps believers under close watch, and attending church is a risk for anyone with a career. The Party must decide whether to intensify the struggle against religion or to seek a quiet accommodation with it."
 COLDWAR_SOV_scientific_atheism:0 "Scientific Atheism"
 COLDWAR_SOV_scientific_atheism_desc:0 "Religion is a relic of the past, destined to disappear as society advances toward communism. Lectures, museums of atheism and the Znanie Society will carry the scientific worldview into every town and village, while the authorities continue to restrict new parishes and the training of clergy. Believers will grow fewer in public, even if many continue to pray in private."
 COLDWAR_SOV_accord_with_the_patriarchate:0 "Accord with the Patriarchate"
 COLDWAR_SOV_accord_with_the_patriarchate_desc:0 "What if the Party sought a genuine partnership with the Moscow Patriarchate rather than merely tolerating it? Loosening the restrictions on parishes and seminaries could win the gratitude of millions of believers and turn the Church into an ally in patriotic and peace campaigns. Hardline ideologues are appalled, but the Church may prove a valuable pillar of stability."
 COLDWAR_SOV_the_double_burden:0 "The Double Burden"
 COLDWAR_SOV_the_double_burden_desc:0 "Soviet women make up more than half of the workforce, serving as doctors, engineers and crane operators. Yet when their shift ends a second one begins: queues for groceries, cooking, laundry and childcare, with little help from husbands or the economy. Easing this double burden through more kindergartens, services and household goods would improve countless lives and keep women at work."
 COLDWAR_SOV_the_demographic_gap:0 "The Demographic Gap"
 COLDWAR_SOV_the_demographic_gap_desc:0 "In Russia and the Baltic republics most families have one or two children, while in Uzbekistan and Tajikistan they have five or six. The demographic centre of the Union is shifting steadily southward, toward Central Asia and the Caucasus. Planners must adapt by building schools and jobs in the south, encouraging larger families in the north and preparing an army whose recruits speak less and less Russian."
 COLDWAR_SOV_the_developed_socialist_society:0 "The Developed Socialist Society"
 COLDWAR_SOV_the_developed_socialist_society_desc:0 "Brezhnev's ideologists declare that the Soviet Union has reached the stage of 'developed socialism', a mature society on the road to communism, and the new constitution of 1977 enshrines the claim. If it can be made real, with rising living standards and a confident population, the socialist way of life may become an example the whole world wishes to follow."
 COLDWAR_SOV_peaceful_coexistence:0 "Peaceful Coexistence"
 COLDWAR_SOV_peaceful_coexistence_desc:0 "Lenin's principle of peaceful coexistence holds that socialism and capitalism can compete without war. In the age of nuclear parity, the Kremlin sees a chance to turn the principle into practice through arms control talks, trade with the West and the recognition of the post-war order in Europe. Detente will not end the struggle between the systems, but it may move it to safer ground."
 COLDWAR_SOV_the_moscow_treaty:0 "The Moscow Treaty"
 COLDWAR_SOV_the_moscow_treaty_desc:0 "Chancellor Willy Brandt's new eastern policy offers an opportunity that seemed impossible only a few years ago. A treaty between the Soviet Union and West Germany would renounce the use of force and recognise the post-war borders of Europe, including the Oder-Neisse line. Moscow is ready to make the offer; Bonn must decide whether to sign it."
 COLDWAR_SOV_the_peace_programme:0 "The Peace Programme"
 COLDWAR_SOV_the_peace_programme_desc:0 "At the Twenty-Fourth Party Congress in the spring of 1971, Leonid Brezhnev unveils a Peace Programme that recasts Soviet foreign policy around peaceful coexistence. Recognition of Europe's post-war borders, arms limitation and expanded trade with the capitalist world are to secure what decades of confrontation could not. The treaty signed with Bonn in August 1970 already points the way; now the whole Politburo must commit to detente."
 COLDWAR_SOV_the_berlin_agreement:0 "The Quadripartite Agreement"
 COLDWAR_SOV_the_berlin_agreement_desc:0 "West Berlin remains the most dangerous flashpoint in Europe, an island of the West deep inside the German Democratic Republic. Ambassador Pyotr Abrasimov sits down with his American, British and French counterparts to settle access routes, transit rights and the city's ties to the Federal Republic. A Quadripartite Agreement would defuse a crisis that has flared repeatedly since 1948, but East Berlin fears that Moscow is trading away its interests for detente."
 COLDWAR_SOV_salt_negotiations:0 "SALT Negotiations"
 COLDWAR_SOV_salt_negotiations_desc:0 "Since November 1969 Soviet and American delegations have been meeting in Helsinki and Vienna to discuss limits on strategic weapons. Vladimir Semyonov's team must reconcile the hopes of the Foreign Ministry with the deep suspicions of the General Staff and the defence industry. Now that rough parity with the United States is within reach, Moscow must decide whether to freeze the race through negotiation or press on towards outright strategic superiority."
 COLDWAR_SOV_salt_i_and_the_abm_treaty:0 "SALT I and the ABM Treaty"
 COLDWAR_SOV_salt_i_and_the_abm_treaty_desc:0 "In May 1972, beneath the chandeliers of the Kremlin, Leonid Brezhnev and Richard Nixon are ready to sign the first agreements limiting the nuclear arsenals of the superpowers. The Interim Agreement freezes the number of missile launchers, while the ABM Treaty restricts each side to minimal missile defences. For the marshals it is a constraint on Soviet power; for the Politburo it is formal recognition that the USSR stands as America's equal."
 COLDWAR_SOV_superiority_not_parity:0 "Superiority, Not Parity"
 COLDWAR_SOV_superiority_not_parity_desc:0 "Marshal Andrei Grechko and the Central Committee's defence secretary Dmitry Ustinov argue that arms control merely freezes American advantages in technology. With a new generation of heavy missiles nearing deployment, they insist the Soviet Union can win the arms race outright if it keeps building. Abandoning the talks would delight the General Staff and the design bureaus, but it would also commit the economy to a ruinous competition with no end in sight."
 COLDWAR_SOV_the_moscow_summit:0 "The Moscow Summit"
 COLDWAR_SOV_the_moscow_summit_desc:0 "No American president has ever made an official visit to Moscow. A summit with Richard Nixon would crown the policy of detente and could produce a joint declaration of Basic Principles governing relations between the two superpowers, pledging restraint and peaceful coexistence. Despite the American bombing of North Vietnam, Brezhnev is determined that the visit should go ahead, convinced that recognition as an equal is worth the indignation of Hanoi."
 COLDWAR_SOV_trade_and_credits:0 "Western Credits and Technology"
 COLDWAR_SOV_trade_and_credits_desc:0 "The Volga automobile plant at Togliatti, built with the help of Fiat, has shown what Western machinery and loans can achieve. Alexei Kosygin and the Ministry of Foreign Trade now seek credits from Western banks, licences and entire factories to modernise Soviet industry, paying with oil, gas and timber. The ideologues warn of dependence on capitalist creditors, but the planners see no faster way to close the technological gap."
 COLDWAR_SOV_the_paris_axis:0 "The Paris Axis"
 COLDWAR_SOV_the_paris_axis_desc:0 "Since de Gaulle's visit in 1966, France has been the Western power most willing to deal with Moscow on its own terms. President Georges Pompidou's visit in October 1970 offers the chance to deepen this special relationship through regular political consultations, joint research and industrial cooperation, from colour television to space science. A privileged partnership with Paris would show Washington that Western Europe need not follow American leadership in everything."
 COLDWAR_SOV_mod_military_spending_cost_factor_tt:0 "Political Power Cost to change Military Spending: $RIGHT|-=%1$"
 COLDWAR_SOV_vladivostok_accords:0 "The Vladivostok Accords"
 COLDWAR_SOV_vladivostok_accords_desc:0 "The first SALT agreements will expire in 1977, and a permanent treaty is needed to replace them. Meeting the new American president Gerald Ford near Vladivostok in November 1974, Brezhnev can agree on a framework of equal ceilings for strategic launchers and multiple warheads. The marshals grumble that American forward-based systems in Europe are left untouched, but a deal would keep detente alive after the fall of Nixon."
 COLDWAR_SOV_the_helsinki_conference:0 "The Helsinki Conference"
 COLDWAR_SOV_the_helsinki_conference_desc:0 "For a quarter of a century Moscow has sought formal recognition of the borders drawn in 1945. The Conference on Security and Cooperation in Europe, gathering thirty-five states in Helsinki, can finally deliver it. The price is the so-called Third Basket on human contacts, information and human rights. Gromyko considers it a harmless concession on paper, yet dissidents across the Union are already preparing to hold the Soviet state to its signature."
 COLDWAR_SOV_salt_ii:0 "SALT II"
 COLDWAR_SOV_salt_ii_desc:0 "After years of haggling over warhead limits, cruise missiles and the Backfire bomber, a second strategic arms treaty is finally ready. In Vienna in June 1979, Brezhnev and Jimmy Carter can sign SALT II, setting equal limits on launchers and multiple warheads until 1985. The treaty would cap the arms race at a costly but stable level, provided the American Senate ever agrees to ratify it."
 COLDWAR_SOV_tt_tension_ge_60:0 "§YCold War tension§! at least §Y60§!"
 COLDWAR_SOV_the_end_of_detente:0 "The End of Detente?"
 COLDWAR_SOV_the_end_of_detente_desc:0 "Detente is unravelling. Soviet involvement in Africa, the deployment of new SS-20 missiles in Europe and NATO's answer with Pershing and cruise missiles have poisoned relations with Washington. The Politburo must decide whether the policy of the Peace Programme can still be rescued through concessions, or whether the time has come to accept a renewed confrontation with the West."
 COLDWAR_SOV_save_detente:0 "Save Detente"
 COLDWAR_SOV_save_detente_desc:0 "Detente has brought recognition, trade and grain, and Moscow is not prepared to throw it away. Through new proposals on arms control, restraint in the Third World and personal letters to the American president, the Soviet leadership tries to rebuild trust before the hardliners in both capitals bury the policy for good. Such gestures cost prestige at home, and the generals will see them as weakness."
 COLDWAR_SOV_the_second_cold_war:0 "The Second Cold War"
 COLDWAR_SOV_the_second_cold_war_desc:0 "Washington has chosen confrontation, and Moscow will not be intimidated. The SS-20s stay in Europe, the military budget grows, and Soviet propaganda denounces the new American arms build-up as preparation for nuclear war. The years of summits and handshakes are over; the Soviet Union returns to the logic of the Cold War, convinced that only strength commands the respect of its adversaries."
 COLDWAR_SOV_the_chinese_question:0 "The Chinese Question"
 COLDWAR_SOV_the_chinese_question_desc:0 "Less than a year ago Soviet and Chinese soldiers fought pitched battles on Damansky Island in the Ussuri and at Tielieketi on the Xinjiang border. Beijing now calls the Soviet Union social-imperialist and its main enemy, while Moscow fears a nuclear-armed China of eight hundred million people along a frontier thousands of kilometres long. How to deal with Mao's China has become the most pressing security question facing the Politburo."
 COLDWAR_SOV_the_beijing_border_talks:0 "The Beijing Border Talks"
 COLDWAR_SOV_the_beijing_border_talks_desc:0 "After Alexei Kosygin's hurried meeting with Zhou Enlai at Beijing airport in September 1969, both sides have agreed to talk. Since October, First Deputy Foreign Minister Vasily Kuznetsov has led a delegation in Beijing to negotiate the disputed border and avoid new clashes. Progress is slow and the rhetoric remains hostile, but every month of talks is a month without fighting on the Ussuri."
 COLDWAR_SOV_three_roads_to_beijing:0 "Three Roads to Beijing"
 COLDWAR_SOV_three_roads_to_beijing_desc:0 "The General Staff, the Foreign Ministry and the International Department each offer a different answer to the Chinese challenge. Moscow can contain China with a wall of divisions and alliances, strike its nuclear programme before it matures, or seek a reconciliation that would reunite the two great communist powers. Each road carries its own risks, and the choice will shape Soviet policy in Asia for decades."
 COLDWAR_SOV_contain_china:0 "Contain China"
 COLDWAR_SOV_contain_china_desc:0 "The Soviet Union will neither attack China nor bow to its demands. Instead, the frontier from the Pamirs to the Pacific is to become a defensive barrier, backed by a network of friendly states around China's periphery. Containment is expensive and slow, but it promises security without the risk of a nuclear war in Asia, and it leaves the door open for talks once Beijing becomes more reasonable."
 COLDWAR_SOV_the_trans_baikal_buildup:0 "The Trans-Baikal Buildup"
 COLDWAR_SOV_the_trans_baikal_buildup_desc:0 "Between 1969 and 1972 the Soviet forces facing China are to grow from a modest screen into a powerful front. New garrisons, airfields and depots are rising across the Trans-Baikal and Far Eastern Military Districts, while tank and motor-rifle divisions move east along the Trans-Siberian Railway. The buildup consumes enormous resources, but it ensures that the People's Liberation Army will never repeat Damansky on a larger scale."
 COLDWAR_SOV_the_amur_fortified_districts:0 "The Amur Fortified Districts"
 COLDWAR_SOV_the_amur_fortified_districts_desc:0 "Along the Amur and the Ussuri, where the border runs within sight of Chinese villages, the army is constructing fortified districts of bunkers, gun emplacements and dug-in tank turrets. Manned by machine-gun and artillery units, these defences are meant to blunt any Chinese offensive long enough for reserves to arrive from the west. Khabarovsk and Blagoveshchensk, both within artillery range of China, depend on them."
 COLDWAR_SOV_the_mongolian_shield:0 "The Mongolian Shield"
 COLDWAR_SOV_the_mongolian_shield_desc:0 "Mongolia guards the shortest route from northern China to Lake Baikal and the Trans-Siberian Railway. Under the treaty of 1966, Moscow can station the 39th Army in the country and turn the Mongolian People's Republic into a forward bastion against China. Yumjaagiin Tsedenbal's government is willing, but Ulaanbaatar expects economic aid in return for hosting Soviet tanks and airfields."
 COLDWAR_SOV_asian_collective_security:0 "Asian Collective Security"
 COLDWAR_SOV_asian_collective_security_desc:0 "In June 1969 Leonid Brezhnev proposed a system of collective security in Asia, a vague idea that everyone in the region understood to be aimed at China. Reviving the proposal would bind India, Vietnam, Mongolia and Afghanistan more closely to Moscow and present the Soviet Union as the guarantor of peace in Asia. Beijing will denounce it as encirclement, but China's wary neighbours may find the offer attractive."
 COLDWAR_SOV_treaty_with_india:0 "Treaty with India"
 COLDWAR_SOV_treaty_with_india_desc:0 "As the crisis in East Pakistan escalates and Washington moves closer to Beijing and Islamabad, Indira Gandhi's government seeks a reliable partner. A Treaty of Peace, Friendship and Cooperation, prepared by Andrei Gromyko and Swaran Singh, would make India the cornerstone of Soviet policy in South Asia and a counterweight to China. In return, Moscow must be ready to supply weapons and diplomatic cover should war break out."
 COLDWAR_SOV_vietnam_against_china:0 "Vietnam against China"
 COLDWAR_SOV_vietnam_against_china_desc:0 "Vietnam, increasingly at odds with Beijing, has become China's southern rival. A Treaty of Friendship and Cooperation with Hanoi would grant the Soviet Navy access to the great American-built base at Cam Ranh Bay and open a second front against China in the south. Yet the alliance could drag Moscow into a war over Cambodia, where Vietnam and China's protege Pol Pot are already clashing."
 COLDWAR_SOV_the_surgical_strike_option:0 "The Surgical Strike Option"
 COLDWAR_SOV_the_surgical_strike_option_desc:0 "In 1969 Soviet diplomats quietly asked their American contacts how Washington would react to a strike on China's nuclear facilities. Some in the General Staff still believe that a single blow could destroy Mao's atomic programme before it can threaten Soviet cities. What if the option, never formally adopted, were taken seriously? The Politburo must decide whether to keep it on the table."
 COLDWAR_SOV_plan_lop_nur:0 "Plan Lop Nur"
 COLDWAR_SOV_plan_lop_nur_desc:0 "The planners of the General Staff draw up detailed options for a strike on the Chinese nuclear test site at Lop Nur and the weapons facilities around it. Missile brigades and long-range aviation are assigned targets, while ground forces prepare to exploit the chaos that would follow. The plan gives Moscow the means to topple the Maoist regime, but the decision to use it would be the gravest in Soviet history."
 COLDWAR_SOV_strike_at_dawn:0 "Strike at Dawn"
 COLDWAR_SOV_strike_at_dawn_desc:0 "Orders are drafted for a strike at dawn: missiles and bombers against Lop Nur and China's nuclear infrastructure, tank armies in Mongolia and the Trans-Baikal ready to roll into Manchuria and Xinjiang. Moscow prepares to present the operation as a preventive measure against Maoist adventurism, but news of the preparations is already causing alarm in Washington, Delhi and Tokyo. Once the order is given, there is no way back."
 COLDWAR_SOV_reconcile_with_beijing:0 "Reconcile with Beijing"
 COLDWAR_SOV_reconcile_with_beijing_desc:0 "What if the meeting between Kosygin and Zhou Enlai at Beijing airport in September 1969 had been a turning point rather than a mere ceasefire? An ideological truce, an end to the polemics between the two parties and a pullback of forces from the border could restore the alliance broken in the early 1960s. The hardliners in both capitals will resist, but a united communist world would transform the balance of the Cold War."
 COLDWAR_SOV_settle_damansky:0 "Settle Damansky"
 COLDWAR_SOV_settle_damansky_desc:0 "The bloody island of Damansky, which the Chinese call Zhenbao, lies on the Chinese side of the main channel of the Ussuri. Accepting the river's navigable channel as the border, as international practice suggests, would hand the island to China and remove the most visible symbol of the conflict. Historically the question was settled only in 1991; doing it now would show Beijing that Moscow is serious about peace."
 COLDWAR_SOV_the_eastern_front_secured:0 "The Eastern Front Secured"
 COLDWAR_SOV_the_eastern_front_secured_desc:0 "Whether through strength or through compromise, the danger of a great war with China has receded. The divisions in the Far East can be held at a sustainable level, the frontier regions can turn to development, and the Baikal-Amur Mainline will one day connect Siberia's riches with the Pacific. For the first time since 1969, the Soviet Union can look east without fear."
 COLDWAR_SOV_the_socialist_commonwealth:0 "The Socialist Commonwealth"
 COLDWAR_SOV_the_socialist_commonwealth_desc:0 "Moscow speaks of a socialist commonwealth, a family of fraternal states bound together by Marxism-Leninism, the Warsaw Pact and Comecon. Behind the rhetoric lies a reality of Soviet garrisons in Central Europe, cheap raw materials flowing west and growing frustration in Warsaw, Budapest and Bucharest. Keeping the commonwealth united requires constant attention, generosity and, when necessary, pressure."
 COLDWAR_SOV_the_doctrine_question:0 "Limited Sovereignty?"
 COLDWAR_SOV_the_doctrine_question_desc:0 "The tanks that rolled into Prague in August 1968 raised a question that still hangs over the Eastern bloc: how sovereign are the socialist states? Moscow can enshrine the right to intervene whenever socialism is threatened, or it can accept that each fraternal party must find its own way, with all the risks that entails. The answer will define relations with Eastern Europe for a generation."
 COLDWAR_SOV_mod_imp_sanction_effectiveness_tt:0 "Sanction Effectiveness: $RIGHT|+=%1$"
 COLDWAR_SOV_the_brezhnev_doctrine:0 "The Brezhnev Doctrine"
 COLDWAR_SOV_the_brezhnev_doctrine_desc:0 "In September 1968 Pravda declared that the sovereignty of each socialist country is limited by the interests of the socialist community as a whole. Making this principle the formal basis of bloc policy tells every party leader from East Berlin to Sofia that no one may leave the camp. Western governments will see it as proof that detente stops at the Elbe, but for Moscow the unity of the bloc comes first."
 COLDWAR_SOV_let_them_go_their_way:0 "Let Them Go Their Way"
 COLDWAR_SOV_let_them_go_their_way_desc:0 "What if Moscow announced, twenty years early, that each socialist country may choose its own path? The Politburo could renounce the use of force against its allies and allow reformers like those of the Prague Spring to experiment freely. Eastern Europe would gain new legitimacy and the West would applaud, but the hardliners warn that once the doors are open, the whole bloc may walk through them."
 COLDWAR_SOV_the_comprehensive_programme:0 "The Comprehensive Programme"
 COLDWAR_SOV_the_comprehensive_programme_desc:0 "At the Comecon session in Bucharest in July 1971, the member states are to adopt a Comprehensive Programme for socialist economic integration. Joint investment projects, coordinated five-year plans, specialisation of production and cooperation in science are meant to turn a loose trading club into an integrated economic bloc. Romania insists on its sovereignty, but most partners welcome Soviet resources and markets."
 COLDWAR_SOV_the_oil_price_question:0 "Fraternal Oil"
 COLDWAR_SOV_the_oil_price_question_desc:0 "Soviet oil flows to Eastern Europe through the Druzhba pipeline at prices far below the world market. This subsidy keeps the economies of the fraternal states running and buys their loyalty, but every barrel sold cheaply in Leipzig or Bratislava is a barrel that could earn hard currency in Rotterdam. As world prices climb, the question of what fraternal oil should cost can no longer be avoided."
 COLDWAR_SOV_subsidised_oil:0 "Subsidised Oil"
 COLDWAR_SOV_subsidised_oil_desc:0 "Moscow decides that the stability of its allies is worth more than hard currency. Oil and gas will continue to flow to Comecon partners at friendly prices, cushioning Poland and the German Democratic Republic from the shocks of the world economy. The Ministry of Finance counts the lost revenue, but the Politburo knows that a hungry, cold Eastern Europe would cost far more."
 COLDWAR_SOV_world_market_prices:0 "World Market Prices"
 COLDWAR_SOV_world_market_prices_desc:0 "The Bucharest formula of 1975 tied Comecon oil prices to a moving average of world prices; what if Moscow went all the way? Charging the fraternal states the full market rate would bring substantial additional revenue and end the hidden subsidy to Eastern Europe. Warsaw, East Berlin and Prague will protest loudly, and their already strained economies may not survive the shock."
 COLDWAR_SOV_the_soyuz_pipeline:0 "The Soyuz Pipeline"
 COLDWAR_SOV_the_soyuz_pipeline_desc:0 "The gas fields of Orenburg could supply Eastern Europe for decades, if only a pipeline to the western border can be built. Moscow proposes that each Comecon partner construct its own section of the Soyuz line in exchange for guaranteed gas deliveries. The project would weld the bloc together with steel and gas, a monument to socialist economic integration stretching across the steppe and the Ukrainian plains."
 COLDWAR_SOV_shield_and_brotherhood:0 "Shield and Brotherhood"
 COLDWAR_SOV_shield_and_brotherhood_desc:0 "Large joint manoeuvres demonstrate the unity and readiness of the Warsaw Pact. Exercises such as Brotherhood in Arms, held in the German Democratic Republic in 1970, and the Shield series bring together armies from the Baltic to the Black Sea under Soviet direction. Each exercise must be agreed with the allied governments, but the shared experience strengthens both the coalition and the Soviet Army itself."
 COLDWAR_SOV_kulikovs_unified_command:0 "Kulikov's Unified Command"
 COLDWAR_SOV_kulikovs_unified_command_desc:0 "The Unified Armed Forces of the Warsaw Pact are still more a coalition on paper than an integrated force. Under a forceful commander-in-chief such as Marshal Viktor Kulikov, a permanent staff, common doctrine and shared research could transform them into a single military machine. The allies will gain access to Soviet expertise, but they will also find their armies ever more closely bound to Moscow's plans."
 COLDWAR_SOV_the_polish_question:0 "The Polish Question"
 COLDWAR_SOV_the_polish_question_desc:0 "In December 1970 sudden price increases just before Christmas drive the shipyard workers of Gdańsk, Gdynia and Szczecin into the streets. The militia opens fire, dozens are killed, and Władysław Gomułka falls, replaced by the Silesian party boss Edward Gierek. Moscow must decide how to handle Poland: rescue the new leadership with money and grain, or remind Warsaw firmly where its obligations lie."
 COLDWAR_SOV_credits_for_gierek:0 "Credits for Gierek"
 COLDWAR_SOV_credits_for_gierek_desc:0 "Edward Gierek promises the Polish workers a better life, but he needs money and grain to deliver it. Moscow can extend credits, raw materials and food to stabilise his government and calm the shipyards. The help is expensive, and Gierek will soon be borrowing from Western banks as well, yet a stable Poland is the keystone of the Warsaw Pact and the corridor to the Soviet forces in Germany."
 COLDWAR_SOV_discipline_warsaw:0 "Discipline Warsaw"
 COLDWAR_SOV_discipline_warsaw_desc:0 "The Polish comrades have let the situation slip out of control, and Moscow will not reward failure. The Polish leadership is summoned to the Kremlin to hear unambiguous demands for ideological firmness, order in the shipyards and loyalty to the alliance. How Warsaw answers is up to the Poles, but every party leader in the bloc will understand the message."
 COLDWAR_SOV_romanias_maverick_course:0 "Romania's Maverick Course"
 COLDWAR_SOV_romanias_maverick_course_desc:0 "Nicolae Ceaușescu refused to join the invasion of Czechoslovakia, recognised West Germany, kept relations with Israel and welcomed Richard Nixon to Bucharest in 1969. Romania remains a member of the Warsaw Pact and Comecon, yet it behaves more and more like a non-aligned state. Moscow must decide whether to tolerate this independent streak or to make an example of Bucharest."
 COLDWAR_SOV_tolerate_bucharest:0 "Tolerate Bucharest"
 COLDWAR_SOV_tolerate_bucharest_desc:0 "Ceaușescu's independence is irritating, but Romania remains a one-party communist state with no intention of leaving the bloc. Moscow chooses to swallow its pride, keep the dialogue open and let Bucharest enjoy its moments on the world stage. Tolerance spares the alliance a damaging quarrel and frees the leadership to concentrate on more pressing matters."
 COLDWAR_SOV_isolate_bucharest:0 "Isolate Bucharest"
 COLDWAR_SOV_isolate_bucharest_desc:0 "Romania's flirtation with Washington and Beijing can no longer be tolerated. Moscow will freeze joint projects, cool party contacts and make clear to the other allies that independence has its price. The pressure may push Ceaușescu even closer to the West and China, but it will show the rest of the bloc exactly where the limits lie."
 COLDWAR_SOV_interkosmos:0 "Interkosmos"
 COLDWAR_SOV_interkosmos_desc:0 "Since 1967 the Interkosmos programme has allowed Soviet allies to share in the conquest of space through joint satellites and scientific experiments. The next step is to fly guest cosmonauts from fraternal countries aboard Soyuz spacecraft to the Salyut stations. A Czechoslovak, Polish, East German, Cuban or Vietnamese cosmonaut in orbit would be a powerful symbol of socialist solidarity and of Soviet leadership in space."
 COLDWAR_SOV_the_commonwealth_of_socialist_nations:0 "The Commonwealth of Socialist Nations"
 COLDWAR_SOV_the_commonwealth_of_socialist_nations_desc:0 "What if the loose web of treaties binding the Eastern bloc were replaced by a formal Commonwealth of Socialist Nations? Permanent common institutions, coordinated planning and joint aid programmes could give the alliance a structure as solid as the European Community in the West. Smaller allies fear absorption into a Soviet superstate, but the advocates argue that only true integration can match the economic power of the capitalist world."
 COLDWAR_SOV_proletarian_internationalism:0 "Proletarian Internationalism"
 COLDWAR_SOV_proletarian_internationalism_desc:0 "Lenin taught that the cause of socialism knows no borders, and the Soviet Union regards itself as the bulwark of national liberation movements around the world. Through the International Department of the Central Committee under Boris Ponomarev, Moscow supports communist parties, liberation fronts and progressive regimes in Asia, Africa and Latin America. Solidarity is a duty, but it is also a powerful instrument of Soviet influence."
 COLDWAR_SOV_operation_kavkaz:0 "Operation Kavkaz"
 COLDWAR_SOV_operation_kavkaz_desc:0 "Israeli deep-penetration raids are striking at the heart of Egypt, and Gamal Abdel Nasser flies secretly to Moscow to plead for help. Under Operation Kavkaz, an entire air defence division with modern surface-to-air missiles and squadrons of MiG-21s flown by Soviet pilots can be deployed along the Suez Canal. It would be one of the largest Soviet combat deployments outside the bloc, and a direct challenge to Israel and its American patrons."
 COLDWAR_SOV_the_treaty_with_egypt:0 "The Treaty with Egypt"
 COLDWAR_SOV_the_treaty_with_egypt_desc:0 "After the death of Nasser in September 1970, Moscow is anxious to bind his successor Anwar Sadat to the Soviet camp. A Treaty of Friendship and Cooperation, signed in Cairo in May 1971, would formalise the presence of thousands of Soviet advisers and the flow of arms to the most important state in the Arab world. Sadat's loyalty is uncertain, but Egypt remains the key to Soviet influence in the Middle East."
 COLDWAR_SOV_lifeline_to_hanoi:0 "Lifeline to Hanoi"
 COLDWAR_SOV_lifeline_to_hanoi_desc:0 "North Vietnam's war against the United States and Saigon depends on Soviet surface-to-air missiles, MiG fighters, fuel and rice delivered through Haiphong and across China. Expanding this lifeline would strengthen Hanoi's defences against American bombing and secure Soviet influence over the Vietnamese communists, who are courted by Beijing as well. The supplies will anger Washington, but abandoning a fraternal party at war is unthinkable."
 COLDWAR_SOV_the_island_of_freedom:0 "The Island of Freedom"
 COLDWAR_SOV_the_island_of_freedom_desc:0 "Cuba is the Soviet outpost in the Western Hemisphere, but its economy is reeling after the failed ten-million-ton sugar harvest of 1970. By buying Cuban sugar at preferential prices and supplying oil in return, Moscow can keep Fidel Castro's revolution afloat and bind the island to Comecon. The subsidy is expensive, but a socialist Cuba ninety miles from Florida is worth every rouble."
 COLDWAR_SOV_syria_and_iraq:0 "Syria and Iraq"
 COLDWAR_SOV_syria_and_iraq_desc:0 "The Baathist regimes in Damascus and Baghdad are bitter rivals of each other, yet both are natural partners for Moscow. Iraq is ready to sign a Treaty of Friendship and needs Soviet help to nationalise its oil industry, while Hafez al-Assad's Syria seeks weapons and advisers to rebuild its army. Together they would give the Soviet Union a firm foothold in the Middle East, whatever happens in Cairo."
 COLDWAR_SOV_patrice_lumumba_university:0 "Patrice Lumumba University"
 COLDWAR_SOV_patrice_lumumba_university_desc:0 "Founded in Moscow in 1960, the Peoples' Friendship University named after Patrice Lumumba educates thousands of students from Asia, Africa and Latin America. Expanding it would train a new generation of engineers, doctors and party cadres who return home with Soviet diplomas and, it is hoped, Soviet sympathies. Not every graduate becomes a friend of Moscow, but the investment in future elites pays off over decades."
 COLDWAR_SOV_military_advisers:0 "Military Advisers"
 COLDWAR_SOV_military_advisers_desc:0 "From Egypt to Vietnam, Soviet officers train armies, operate radar stations and teach the use of modern weapons. A permanent corps of military advisers, organised through the Tenth Main Directorate of the General Staff, would make Soviet assistance more efficient and more influential. Advisers on the ground often achieve more than arms shipments alone, and they let Moscow know exactly what its partners are doing."
 COLDWAR_SOV_the_question_of_aid:0 "Aid or Arms?"
 COLDWAR_SOV_the_question_of_aid_desc:0 "Every partner in the Third World asks for help, but Soviet resources are not unlimited. Moscow can build dams, steel mills and power stations as it did at Aswan and Bhilai, winning goodwill through visible development, or it can concentrate on weapons, which are cheaper to provide and buy influence with the generals who often hold real power. The choice will define the character of Soviet engagement in the developing world."
 COLDWAR_SOV_economic_aid_programmes:0 "Economic Aid Programmes"
 COLDWAR_SOV_economic_aid_programmes_desc:0 "The Aswan High Dam remains the proudest symbol of Soviet friendship in the Third World. By expanding economic aid programmes, from the Euphrates dam in Syria to steelworks in India, Moscow can show that socialism brings not only weapons but development. Such projects take years and consume scarce resources, yet they leave lasting monuments and tie entire economies to Soviet technology and expertise."
 COLDWAR_SOV_arms_on_credit:0 "Arms on Credit"
 COLDWAR_SOV_arms_on_credit_desc:0 "Tanks, fighters and missiles are the Soviet Union's most sought-after exports. Selling them on generous credit terms, often never fully repaid, wins the gratitude of governments and armies across the Middle East, Africa and Asia. The defence industry welcomes the orders, and every customer becomes dependent on Soviet spare parts, ammunition and instructors for years to come."
 COLDWAR_SOV_the_cuban_bridge:0 "The Cuban Bridge to Angola"
 COLDWAR_SOV_the_cuban_bridge_desc:0 "As Portugal's empire collapses, the Marxist MPLA of Agostinho Neto fights rival movements backed by Zaire, South Africa and the United States for control of Angola. Fidel Castro is ready to send Cuban troops, but only Soviet aircraft and weapons can carry and equip them across the Atlantic. Supporting this bridge would establish a new socialist state in southern Africa, at the cost of further damage to detente."
 COLDWAR_SOV_the_horn_of_africa:0 "The Horn of Africa"
 COLDWAR_SOV_the_horn_of_africa_desc:0 "In the Horn of Africa, Moscow has two clients who are about to go to war with each other. Siad Barre's Somalia hosts a Soviet naval facility at Berbera, while the revolutionary Derg in Ethiopia under Mengistu Haile Mariam proclaims Marxism-Leninism. When Somalia moves to seize the Ogaden, the Soviet Union will have to choose one side and lose the other."
 COLDWAR_SOV_back_ethiopia:0 "Back the Derg"
 COLDWAR_SOV_back_ethiopia_desc:0 "Ethiopia, with its large population and revolutionary government, is the greater prize. Moscow can organise a massive airlift of weapons and send General Vasily Petrov to direct the defence of the Ogaden alongside Cuban brigades. The decision will cost the base at Berbera and the friendship of Somalia, but it could secure a loyal Marxist-Leninist ally on the Red Sea."
 COLDWAR_SOV_back_somalia:0 "Back Siad Barre"
 COLDWAR_SOV_back_somalia_desc:0 "Somalia has been a faithful partner for years and hosts the valuable naval facility at Berbera. Continuing to arm Siad Barre's army would keep this foothold on the Gulf of Aden and the Indian Ocean, even as Somali forces advance into the Ogaden. Abandoning the revolutionaries in Addis Ababa would hurt Soviet prestige among African progressives, but a loyal ally in hand may be worth more than a promise."
 COLDWAR_SOV_the_afghan_question:0 "The Afghan Question"
 COLDWAR_SOV_the_afghan_question_desc:0 "In April 1978 the Saur Revolution brought the communist People's Democratic Party to power in Kabul, but its radical reforms have provoked rebellion across the country. In March 1979 an uprising in Herat killed Soviet advisers, and Nur Muhammad Taraki is begging for troops. The Politburo must decide whether to intervene directly or leave the Afghan comrades to fight their own war."
 COLDWAR_SOV_the_limited_contingent:0 "The Limited Contingent"
 COLDWAR_SOV_the_limited_contingent_desc:0 "If the Afghan government formally asks for help, the Soviet Union can send a Limited Contingent of troops to secure the cities, roads and airfields while the Afghan army fights the rebels. Andropov, Ustinov and Gromyko believe a short intervention will stabilise the regime and keep Afghanistan out of American hands. The world will condemn the move, and no one can say how long the soldiers will have to stay."
 COLDWAR_SOV_no_soviet_soldier:0 "Not a Single Soviet Soldier"
 COLDWAR_SOV_no_soviet_soldier_desc:0 "In March 1979 Alexei Kosygin told Taraki on the telephone that Soviet troops could not replace the Afghan people in their own struggle. What if the leadership had held to his advice? Kabul would receive weapons, advisers and money, but not a single Soviet soldier. The Afghan communists will feel betrayed, yet the Soviet Union spares itself a war in the mountains that could last for years."
 COLDWAR_SOV_vanguard_of_world_revolution:0 "Vanguard of World Revolution"
 COLDWAR_SOV_vanguard_of_world_revolution_desc:0 "What if Moscow abandoned caution and openly embraced the role of vanguard of world revolution? Liberation movements from southern Africa to Central America would receive weapons, money and training without the restraint imposed by detente. The cost to the Soviet budget and to relations with the West would be immense, but the ideologues dream of a world where the correlation of forces has shifted decisively towards socialism."
 COLDWAR_SOV_offer_gas_for_pipes:0 "Gas for Pipes"
 COLDWAR_SOV_berlin_all_three_tt:0 "Once §Yall three Western powers§! have signed, Cold War tension falls by §G2§! and the transit routes to Berlin are secured."
 COLDWAR_SOV_offer_paris_axis:0 "A Franco-Soviet Partnership"
 COLDWAR_SOV_helsinki_signature_tt:0 "Every signature lowers Cold War tension by §G1§! (at most §G3§! in total)."
 COLDWAR_SOV_offer_cocom:0 "Relaxing the Export Controls"
 COLDWAR_SOV_truce_camp_tt:0 "Whether China returns to the Soviet camp remains §YBeijing's own decision§! (Cold War alignment)."
 COLDWAR_SOV_garrison_aid_tt:0 "While the garrison stays, the Soviet Union pays us §G0.2%§! of its GDP every year."
 COLDWAR_SOV_afghan_burden_cost_tt:0 "§YThe Afghan Burden§! costs the Soviet Union §R0.3%§! of its GDP every month until the troops withdraw."
 COLDWAR_SOV_olympic_invitations_tt:0 "The Western powers receive their invitations and decide for themselves whether to send a team."
 COLDWAR_SOV_kompromat_ignored_tt:0 "The accuser gets half of the 50 political power back."
 COLDWAR_SOV_promotion_accept_tt:0 "Our First Secretary moves to Moscow and a new one is elected. Our Politburo seat becomes free; we gain §YPatron in Moscow§! (one proposal a year even without a seat)."
 COLDWAR_SOV_client_accept_tt:0 "Our next approved §YUnion project§! is built in [FROM.GetNameDef]."
 COLDWAR_SOV_free_project_tt:0 "Moscow pays for the building (§Y2%§! of its GDP, §Y1.5%§! for infrastructure or an agriculture district, §Y3%§! for a military factory, more while other Union projects still weigh on its budget)."
 COLDWAR_SOV_disgrace_shortened_tt:0 "§YIn Disgrace§! ends at the next Party Congress."
 COLDWAR_SOV_karabakh_request_tt:0 "§YAzerbaijan decides§! whether to hand over Nagorno-Karabakh."
 COLDWAR_SOV_karabakh_armenia_tt:0 "§YArmenia decides§! whether to take over Nagorno-Karabakh."
 COLDWAR_SOV_imperial_release_tt:0 "Every Union republic is offered §Yindependence§!. Each republic decides for itself."
 COLDWAR_SOV_disintegration_free_tt:0 "Our national decisions (§YPopular Front§!, §YDeclaration of Sovereignty§!, §YReferendum§!) are open to us."
 COLDWAR_SOV_union_subsidies_saved_tt:0 "Moscow no longer pays our Union subsidies: the Soviet Union gains §G0.3%§! of its GDP."
 COLDWAR_SOV_politburo_category_unlock_tt:0 "Unlocks the decisions §YThe Politburo§!."
 COLDWAR_SOV_five_year_plan_category_unlock_tt:0 "Unlocks the decisions §YFive-Year Plans§!."
 COLDWAR_SOV_union_category_unlock_tt:0 "Unlocks the decisions §YThe Union of Republics§!."
 COLDWAR_SOV_grain_import_decisions_unlock_tt:0 "Unlocks the decisions §YGrain Imports§!."
 COLDWAR_SOV_no_vote_running_trig_tt:0 "No Politburo vote is running."
 COLDWAR_SOV_politburo_category:0 "The Politburo"
 COLDWAR_SOV_politburo_category_desc:0 "Ten old men in the Kremlin decide the fate of a superpower. The §YPolitburo balance§! between reformers and the orthodox shapes every vote: a General Secretary who wants his way must cultivate both camps."
 COLDWAR_SOV_rally_the_reformers:0 "Rally the Reformers"
 COLDWAR_SOV_rally_the_reformers_desc:0 "Kosygin's economists, the institutes of the Academy and the younger regional secretaries are invited to the Kremlin. The old apparatus watches with suspicion."
 COLDWAR_SOV_rally_the_orthodox:0 "Rally the Orthodox"
 COLDWAR_SOV_rally_the_orthodox_desc:0 "Suslov's ideological commission, the Main Political Directorate of the army and the veterans of the Party are given the floor."
 COLDWAR_SOV_retire_a_veteran:0 "Retire a Veteran"
 COLDWAR_SOV_retire_a_veteran_desc:0 "One of the old men is persuaded to retire with honours, a dacha and a state pension. His seat goes to a man of the middle."
 COLDWAR_SOV_promote_regional_cadres:0 "Promote Regional Cadres"
 COLDWAR_SOV_promote_regional_cadres_desc:0 "First Secretaries from the republics and the oblasts are brought to Moscow as ministers and department heads. The republics feel heard; the networks of patronage grow."
 COLDWAR_SOV_plenum_category:0 "The Plenum of the Central Committee"
 COLDWAR_SOV_plenum_category_desc:0 "A General Secretary is not overthrown, he is relieved by the Plenum. Every candidacy opened in the focus tree can be put to the Politburo here: Moscow casts §Y3§! votes for its candidate, every republic with a seat in the Politburo has §Y1§! vote (AI republics vote in favour, players decide in §YThe Politburo of the CPSU§!). The candidate takes over unless all three republican members vote against; then stability falls and he must wait 180 days."
 COLDWAR_SOV_plenum_vote_convene_plenum_kos_tt:0 "The Politburo votes on §YAlexei Kosygin§! within 10 days."
 COLDWAR_SOV_plenum_wait_kos_trig_tt:0 "The Plenum has not rejected §YAlexei Kosygin§! in the last 180 days."
 COLDWAR_SOV_convene_plenum_kos:0 "Convene the Plenum: Alexei Kosygin"
 COLDWAR_SOV_convene_plenum_kos_desc:0 "The Politburo is asked to propose §YAlexei Kosygin§! to the Plenum as General Secretary. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_kos_standin_tt:0 "The Politburo votes on §YNikolai Ryzhkov§! within 10 days."
 COLDWAR_SOV_convene_plenum_kos_standin:0 "Convene the Plenum: Nikolai Ryzhkov"
 COLDWAR_SOV_convene_plenum_kos_standin_desc:0 "The Politburo is asked to propose §YNikolai Ryzhkov§! to the Plenum as General Secretary. Alexei Kosygin is dead; Nikolai Ryzhkov carries his course. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_pod_tt:0 "The Politburo votes on §YNikolai Podgorny§! within 10 days."
 COLDWAR_SOV_plenum_wait_pod_trig_tt:0 "The Plenum has not rejected §YNikolai Podgorny§! in the last 180 days."
 COLDWAR_SOV_convene_plenum_pod:0 "Convene the Plenum: Nikolai Podgorny"
 COLDWAR_SOV_convene_plenum_pod_desc:0 "The Politburo is asked to propose §YNikolai Podgorny§! to the Plenum as General Secretary. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_pod_standin_tt:0 "The Politburo votes on §YVasily Kuznetsov§! within 10 days."
 COLDWAR_SOV_convene_plenum_pod_standin:0 "Convene the Plenum: Vasily Kuznetsov"
 COLDWAR_SOV_convene_plenum_pod_standin_desc:0 "The Politburo is asked to propose §YVasily Kuznetsov§! to the Plenum as General Secretary. Nikolai Podgorny is dead; Vasily Kuznetsov carries his course. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_sus_tt:0 "The Politburo votes on §YMikhail Suslov§! within 10 days."
 COLDWAR_SOV_plenum_wait_sus_trig_tt:0 "The Plenum has not rejected §YMikhail Suslov§! in the last 180 days."
 COLDWAR_SOV_convene_plenum_sus:0 "Convene the Plenum: Mikhail Suslov"
 COLDWAR_SOV_convene_plenum_sus_desc:0 "The Politburo is asked to propose §YMikhail Suslov§! to the Plenum as General Secretary. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_sus_standin_tt:0 "The Politburo votes on §YMikhail Zimyanin§! within 10 days."
 COLDWAR_SOV_convene_plenum_sus_standin:0 "Convene the Plenum: Mikhail Zimyanin"
 COLDWAR_SOV_convene_plenum_sus_standin_desc:0 "The Politburo is asked to propose §YMikhail Zimyanin§! to the Plenum as General Secretary. Mikhail Suslov is dead; Mikhail Zimyanin carries his course. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_she_tt:0 "The Politburo votes on §YAlexander Shelepin§! within 10 days."
 COLDWAR_SOV_plenum_wait_she_trig_tt:0 "The Plenum has not rejected §YAlexander Shelepin§! in the last 180 days."
 COLDWAR_SOV_convene_plenum_she:0 "Convene the Plenum: Alexander Shelepin"
 COLDWAR_SOV_convene_plenum_she_desc:0 "The Politburo is asked to propose §YAlexander Shelepin§! to the Plenum as General Secretary. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_and_tt:0 "The Politburo votes on §YYuri Andropov§! within 10 days."
 COLDWAR_SOV_plenum_wait_and_trig_tt:0 "The Plenum has not rejected §YYuri Andropov§! in the last 180 days."
 COLDWAR_SOV_convene_plenum_and:0 "Convene the Plenum: Yuri Andropov"
 COLDWAR_SOV_convene_plenum_and_desc:0 "The Politburo is asked to propose §YYuri Andropov§! to the Plenum as General Secretary. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_and_standin_tt:0 "The Politburo votes on §YHeydar Aliyev§! within 10 days."
 COLDWAR_SOV_convene_plenum_and_standin:0 "Convene the Plenum: Heydar Aliyev"
 COLDWAR_SOV_convene_plenum_and_standin_desc:0 "The Politburo is asked to propose §YHeydar Aliyev§! to the Plenum as General Secretary. Yuri Andropov is dead; Heydar Aliyev carries his course. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_gre_tt:0 "The Politburo votes on §YAndrei Grechko§! within 10 days."
 COLDWAR_SOV_plenum_wait_gre_trig_tt:0 "The Plenum has not rejected §YAndrei Grechko§! in the last 180 days."
 COLDWAR_SOV_convene_plenum_gre:0 "Convene the Plenum: Andrei Grechko"
 COLDWAR_SOV_convene_plenum_gre_desc:0 "The Politburo is asked to propose §YAndrei Grechko§! to the Plenum as General Secretary. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_gre_standin_tt:0 "The Politburo votes on §YNikolai Ogarkov§! within 10 days."
 COLDWAR_SOV_convene_plenum_gre_standin:0 "Convene the Plenum: Nikolai Ogarkov"
 COLDWAR_SOV_convene_plenum_gre_standin_desc:0 "The Politburo is asked to propose §YNikolai Ogarkov§! to the Plenum as General Secretary. Andrei Grechko is dead; Nikolai Ogarkov carries his course. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_ust_tt:0 "The Politburo votes on §YDmitry Ustinov§! within 10 days."
 COLDWAR_SOV_plenum_wait_ust_trig_tt:0 "The Plenum has not rejected §YDmitry Ustinov§! in the last 180 days."
 COLDWAR_SOV_convene_plenum_ust:0 "Convene the Plenum: Dmitry Ustinov"
 COLDWAR_SOV_convene_plenum_ust_desc:0 "The Politburo is asked to propose §YDmitry Ustinov§! to the Plenum as General Secretary. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_ust_standin_tt:0 "The Politburo votes on §YLeonid Smirnov§! within 10 days."
 COLDWAR_SOV_convene_plenum_ust_standin:0 "Convene the Plenum: Leonid Smirnov"
 COLDWAR_SOV_convene_plenum_ust_standin_desc:0 "The Politburo is asked to propose §YLeonid Smirnov§! to the Plenum as General Secretary. Dmitry Ustinov is dead; Leonid Smirnov carries his course. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_gro_tt:0 "The Politburo votes on §YGrigory Romanov§! within 10 days."
 COLDWAR_SOV_plenum_wait_gro_trig_tt:0 "The Plenum has not rejected §YGrigory Romanov§! in the last 180 days."
 COLDWAR_SOV_convene_plenum_gro:0 "Convene the Plenum: Grigory Romanov"
 COLDWAR_SOV_convene_plenum_gro_desc:0 "The Politburo is asked to propose §YGrigory Romanov§! to the Plenum as General Secretary. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_che_tt:0 "The Politburo votes on §YKonstantin Chernenko§! within 10 days."
 COLDWAR_SOV_plenum_wait_che_trig_tt:0 "The Plenum has not rejected §YKonstantin Chernenko§! in the last 180 days."
 COLDWAR_SOV_convene_plenum_che:0 "Convene the Plenum: Konstantin Chernenko"
 COLDWAR_SOV_convene_plenum_che_desc:0 "The Politburo is asked to propose §YKonstantin Chernenko§! to the Plenum as General Secretary. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_che_standin_tt:0 "The Politburo votes on §YViktor Grishin§! within 10 days."
 COLDWAR_SOV_convene_plenum_che_standin:0 "Convene the Plenum: Viktor Grishin"
 COLDWAR_SOV_convene_plenum_che_standin_desc:0 "The Politburo is asked to propose §YViktor Grishin§! to the Plenum as General Secretary. Konstantin Chernenko is dead; Viktor Grishin carries his course. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_plenum_vote_convene_plenum_gor_tt:0 "The Politburo votes on §YMikhail Gorbachev§! within 10 days."
 COLDWAR_SOV_plenum_wait_gor_trig_tt:0 "The Plenum has not rejected §YMikhail Gorbachev§! in the last 180 days."
 COLDWAR_SOV_convene_plenum_gor:0 "Convene the Plenum: Mikhail Gorbachev"
 COLDWAR_SOV_convene_plenum_gor_desc:0 "The Politburo is asked to propose §YMikhail Gorbachev§! to the Plenum as General Secretary. Moscow casts §Y3§! votes for him, every republican member has §Y1§!: only if all three republican members vote against is he rejected."
 COLDWAR_SOV_five_year_plan_category:0 "Five-Year Plans"
 COLDWAR_SOV_five_year_plan_category_desc:0 "Gosplan drafts, the Party Congress approves, the Supreme Soviet makes it law. At the start of every Five-Year Plan the leadership sets one priority; the Politburo votes on it. A plan that the Politburo rejects still applies, but the General Secretary carries the defeat.\n\nCurrent plan: §Y[COLDWAR_SOV_GetPlanName]§!"
 COLDWAR_SOV_plan_vote_tt:0 "The Politburo votes on the priority within 10 days (majority: §G+50§! political power; otherwise §RDefying the Politburo§!). The priority applies until the end of the plan."
 COLDWAR_SOV_plan_open_trig_tt:0 "A new Five-Year Plan has begun and no priority has been set for it yet."
 COLDWAR_SOV_set_plan_group_a:0 "Priority: Heavy Industry"
 COLDWAR_SOV_set_plan_group_a_desc:0 "Steel, machine tools and power stations first: the old Soviet recipe for growth."
 COLDWAR_SOV_set_plan_group_b:0 "Priority: Consumer Goods"
 COLDWAR_SOV_set_plan_group_b_desc:0 "Refrigerators, televisions, clothes and housing: a plan for the Soviet consumer."
 COLDWAR_SOV_set_plan_armaments:0 "Priority: The Defence Industry"
 COLDWAR_SOV_set_plan_armaments_desc:0 "Parity with the United States must be held at any price: the defence industry receives the best of everything."
 COLDWAR_SOV_set_plan_agriculture:0 "Priority: The Food Programme"
 COLDWAR_SOV_set_plan_agriculture_desc:0 "Fertiliser, tractors, irrigation and storage: the Party promises to end the grain imports."
 COLDWAR_SOV_union_category:0 "The Union of Republics"
 COLDWAR_SOV_union_category_desc:0 "Fifteen republics, more than a hundred nationalities, one Party. §YUnion cohesion§! ([?COLDWAR_SOV_union_cohesion|0] of 100) decides how much Moscow can ask of the republics, and how much they will ask of Moscow."
 COLDWAR_SOV_development_fund:0 "The Development Fund of the Republics"
 COLDWAR_SOV_development_fund_desc:0 "Money from the Union budget for schools, hospitals and factories in the poorer republics of Central Asia and the Caucasus."
 COLDWAR_SOV_cadre_rotation:0 "Rotate the Republican Cadres"
 COLDWAR_SOV_cadre_rotation_desc:0 "Second Secretaries from Moscow, Russians as KGB chiefs, outsiders as heads of the republican ministries: the local clans lose their grip."
 COLDWAR_SOV_russification_max_trig_tt:0 "Used fewer than three times."
 COLDWAR_SOV_russification_campaign:0 "The Russian Language Campaign"
 COLDWAR_SOV_russification_campaign_desc:0 "Russian from the first school year, Russian in the army, Russian in the universities: the language of interethnic communication for all."
 COLDWAR_SOV_sovereign_rights:0 "Sovereign Rights of the Republics"
 COLDWAR_SOV_sovereign_rights_desc:0 "The republics receive more control over their own budgets, languages and cadres. Moscow governs less and is resented less."
 COLDWAR_SOV_grain_import_decisions:0 "Grain Imports"
 COLDWAR_SOV_grain_import_decisions_desc:0 "Since 1972 the Soviet Union has bought grain abroad in every bad year: from the United States, Canada, Argentina and Australia, paid in gold and oil money."
 COLDWAR_SOV_grain_bought_tt:0 "The poor harvest no longer costs us §Y5%§! stability."
 COLDWAR_SOV_poor_harvest_trig_tt:0 "The harvest has failed this year."
 COLDWAR_SOV_politburo_cpsu_category:0 "The Politburo of the CPSU"
 COLDWAR_SOV_politburo_cpsu_category_desc:0 "The Political Bureau of the Central Committee: eleven men in Moscow and three First Secretaries of the Union republics. Its file lies open to the Kremlin and to every republic.\n\n[COLDWAR_SOV_GetSessionState]"
 COLDWAR_SOV_seat_free_trig_tt:0 "A republican seat is free."
 COLDWAR_SOV_congress_open_trig_tt:0 "A Party Congress is in session (or a rotation left a seat to fill)."
 COLDWAR_SOV_no_congress_trig_tt:0 "No Party Congress is in session."
 COLDWAR_SOV_no_barons_trig_tt:0 "We have not promised the local barons stability (§YTrust the Local Barons§!)."
 COLDWAR_SOV_bid_received_tt:0 "We receive the political power that [FROM.GetNameDef] offered with its application."
 COLDWAR_SOV_appoint_seat:0 "Appoint [FROM.GetNameDef] to the Politburo"
 COLDWAR_SOV_appoint_seat_desc:0 "The First Secretary of [FROM.GetNameDef] becomes a full member of the Politburo. [FROM.COLDWAR_SOV_GetBid]"
 COLDWAR_SOV_appoint_seat_extraordinary:0 "Extraordinary Plenum: Appoint [FROM.GetNameDef]"
 COLDWAR_SOV_appoint_seat_extraordinary_desc:0 "Between congresses a seat can only be filled by an extraordinary plenum of the Central Committee. It costs authority."
 COLDWAR_SOV_dismiss_seat:0 "Remove [FROM.GetNameDef] from the Politburo"
 COLDWAR_SOV_dismiss_seat_desc:0 "The Congress elects a new Politburo. The First Secretary of [FROM.GetNameDef] is not on the list."
 COLDWAR_SOV_dismiss_seat_extraordinary:0 "Extraordinary Plenum: Remove [FROM.GetNameDef]"
 COLDWAR_SOV_dismiss_seat_extraordinary_desc:0 "Between congresses a member of the Politburo can only be removed by an extraordinary plenum of the Central Committee."
 COLDWAR_SOV_purge_a_seat:0 "Purge [FROM.GetNameDef] from the Politburo"
 COLDWAR_SOV_purge_a_seat_desc:0 "Shelepin's purge of the Brezhnevites reaches the republics: one republican member can be removed without a plenum."
 COLDWAR_SOV_call_a_session:0 "Call an Extra Session of the Politburo"
 COLDWAR_SOV_call_a_session_desc:0 "The General Secretary summons the Politburo outside the regular calendar. Every republican member may submit a new proposal."
 COLDWAR_SOV_promotion_offer_tt:0 "[FROM.GetNameDefCap] receives the offer and decides."
 COLDWAR_SOV_promote_to_moscow:0 "Promote the First Secretary of [FROM.GetNameDef] to Moscow"
 COLDWAR_SOV_promote_to_moscow_desc:0 "A post in Moscow for a deserving First Secretary - and a free seat in the Politburo. Aliyev went this way in 1982, Shevardnadze in 1985. §YThe republic decides§! whether to accept."
 COLDWAR_SOV_kgb_investigation:0 "KGB Investigation: [FROM.GetNameDef]"
 COLDWAR_SOV_kgb_investigation_desc:0 "Andropov's discipline campaign does not need an accuser. The KGB examines the First Secretary of [FROM.GetNameDef]."
 COLDWAR_SOV_has_seat_trig_tt:0 "Our republic has a seat in the Politburo."
 COLDWAR_SOV_no_seat_trig_tt:0 "Our republic has no seat in the Politburo (Moscow's eye is not on us)."
 COLDWAR_SOV_apply_25_tt:0 "Moscow sees our offer of §Y25§! political power."
 COLDWAR_SOV_can_apply_trig_tt:0 "Applications for the coming Party Congress are open, we have no seat and have not applied yet, and we are neither in disgrace nor branded slanderers."
 COLDWAR_SOV_apply_25:0 "Apply for a Seat (25 political power)"
 COLDWAR_SOV_apply_25_desc:0 "Our First Secretary applies for a seat in the Politburo at the coming Party Congress, with a gift of §Y25§! political power for Moscow. If Moscow chooses another republic, half of it comes back."
 COLDWAR_SOV_apply_50_tt:0 "Moscow sees our offer of §Y50§! political power."
 COLDWAR_SOV_apply_50:0 "Apply for a Seat (50 political power)"
 COLDWAR_SOV_apply_50_desc:0 "Our First Secretary applies for a seat in the Politburo at the coming Party Congress, with a gift of §Y50§! political power for Moscow. If Moscow chooses another republic, half of it comes back."
 COLDWAR_SOV_apply_100_tt:0 "Moscow sees our offer of §Y100§! political power."
 COLDWAR_SOV_apply_100:0 "Apply for a Seat (100 political power)"
 COLDWAR_SOV_apply_100_desc:0 "Our First Secretary applies for a seat in the Politburo at the coming Party Congress, with a gift of §Y100§! political power for Moscow. If Moscow chooses another republic, half of it comes back."
 COLDWAR_SOV_proposal_free_trig_tt:0 "We have not submitted a proposal in this session (a patron without a seat: one a year), and no earlier proposal is still open."
 COLDWAR_SOV_proposal_sent_tt:0 "The proposal goes to §YMoscow§!. If Moscow refuses, we can take it before the Politburo."
 COLDWAR_SOV_propose_project_1:0 "Propose a Union Project: a Civilian Factory"
 COLDWAR_SOV_propose_project_1_desc:0 "We ask the Union to build a civilian factory in our republic. Moscow pays §Y2%§! of its GDP, more while other Union projects still weigh on its budget, and its consumer goods tax rises for 90 days."
 COLDWAR_SOV_propose_project_2:0 "Propose a Union Project: Infrastructure"
 COLDWAR_SOV_propose_project_2_desc:0 "We ask the Union to build infrastructure in our republic. Moscow pays §Y1.5%§! of its GDP, more while other Union projects still weigh on its budget, and its consumer goods tax rises for 90 days."
 COLDWAR_SOV_propose_project_3:0 "Propose a Union Project: a Power Station"
 COLDWAR_SOV_propose_project_3_desc:0 "We ask the Union to build a power station in our republic. Moscow pays §Y2%§! of its GDP, more while other Union projects still weigh on its budget, and its consumer goods tax rises for 90 days."
 COLDWAR_SOV_propose_project_4:0 "Propose a Union Project: an Agriculture District"
 COLDWAR_SOV_propose_project_4_desc:0 "We ask the Union to build an agriculture district in our republic. Moscow pays §Y1.5%§! of its GDP, more while other Union projects still weigh on its budget, and its consumer goods tax rises for 90 days."
 COLDWAR_SOV_propose_project_5:0 "Propose a Union Project: a Military Factory"
 COLDWAR_SOV_propose_project_5_desc:0 "We ask the Union to build a military factory in our republic. Moscow pays §Y3%§! of its GDP, more while other Union projects still weigh on its budget, and its consumer goods tax rises for 90 days."
 COLDWAR_SOV_propose_plan_relief:0 "Propose Plan Relief"
 COLDWAR_SOV_propose_plan_relief_desc:0 "Our republic asks to be relieved of part of its plan targets for two years. Moscow would have to make up the shortfall."
 COLDWAR_SOV_propose_cadre_protection:0 "Propose Cadre Protection"
 COLDWAR_SOV_propose_cadre_protection_desc:0 "Our First Secretary asks for a guarantee that no investigation will be opened against our cadres until the next Party Congress."
 COLDWAR_SOV_bring_vote_tt:0 "The Politburo votes on our proposal within 10 days. If it passes, Moscow must carry it out or face §RDefying the Politburo§!."
 COLDWAR_SOV_bring_before_politburo:0 "Bring It before the Politburo"
 COLDWAR_SOV_bring_before_politburo_desc:0 "Moscow has refused our proposal. We put it to the Politburo: three of the seven Moscow members will usually support a republic, and with the other republican members we may have a majority."
 COLDWAR_SOV_seek_a_patron:0 "Seek the Patronage of [FROM.GetNameDef]"
 COLDWAR_SOV_seek_a_patron_desc:0 "We have no seat, but [FROM.GetNameDef] has one. We ask its First Secretary to propose his next Union project for our republic. §Y[FROM.GetNameDefCap] decides.§!"
 COLDWAR_SOV_kompromat_sent_tt:0 "§YMoscow decides§! whether to investigate. Chance of success: 15% + 5% per corruption level of the accused, +25% if it falsified its plan report; never with cadre protection or against Moscow's Man."
 COLDWAR_SOV_kompromat_free_trig_tt:0 "Moscow is not examining another dossier right now."
 COLDWAR_SOV_kompromat:0 "Kompromat against [FROM.GetNameDef]"
 COLDWAR_SOV_kompromat_desc:0 "We send the Party Control Committee a dossier on the First Secretary of [FROM.GetNameDef]. If Moscow investigates and finds something, he loses his seat. If not, we are branded slanderers."
 COLDWAR_SOV_pripiski_tt:0 "Our false report (§Ypripiski§!) makes us an easy target for kompromat until it is uncovered."
 COLDWAR_SOV_pripiski_union_tt:0 "A running §YUnion plan mission§! counts as fulfilled at once, with its full reward. If the lie is uncovered (kompromat, a KGB investigation, or the January audit of the People's Control), the reward is taken away and the failure counts twice."
 COLDWAR_SOV_pripiski_emulation_tt:0 "$COLDWAR_SOV_pb_pripiski_emu$"
 COLDWAR_SOV_pripiski_once_trig_tt:0 "We have not reported this Five-Year Plan yet."
 COLDWAR_SOV_report_overfulfilment:0 "Report the Plan Overfulfilled"
 COLDWAR_SOV_report_overfulfilment_desc:0 "The figures are good. On paper they are excellent: 108 percent. Moscow rewards success, and who will count the cotton?"
 COLDWAR_SOV_petition_moscow:0 "Petition Moscow"
 COLDWAR_SOV_petition_moscow_desc:0 "Without a seat we can still write to the Central Committee and ask for investment. Moscow may ignore the letter."
 COLDWAR_SOV_popular_front:0 "Found a Popular Front"
 COLDWAR_SOV_popular_front_desc:0 "Writers, scientists and young party members found a popular front in support of perestroika - and of our nation."
 COLDWAR_SOV_cohesion_below_55_trig_tt:0 "§YUnion cohesion§! is below §Y55§!."
 COLDWAR_SOV_declare_sovereignty:0 "Declare Sovereignty"
 COLDWAR_SOV_declare_sovereignty_desc:0 "The Supreme Soviet of our republic declares that the laws of the republic take precedence over the laws of the Union."
 COLDWAR_SOV_cohesion_below_35_trig_tt:0 "§YUnion cohesion§! is below §Y35§!."
 COLDWAR_SOV_independence_referendum:0 "Hold an Independence Referendum"
 COLDWAR_SOV_independence_referendum_desc:0 "The people of our republic are asked whether they want to remain in the Soviet Union. §YMoscow will have to respond.§!"
 COLDWAR_SOV_ballot_yes_tt:0 "Our vote counts §Gin favour§!."
 COLDWAR_SOV_ballot_yes:0 "Vote in Favour"
 COLDWAR_SOV_ballot_yes_desc:0 "Our First Secretary raises his hand: the republic votes §Gin favour§! of [COLDWAR_SOV_GetVoteSubject].\n\n[COLDWAR_SOV_GetVoteLeanFull]"
 COLDWAR_SOV_ballot_no_tt:0 "Our vote counts §Ragainst§!."
 COLDWAR_SOV_ballot_no:0 "Vote Against"
 COLDWAR_SOV_ballot_no_desc:0 "Our First Secretary takes up the fight: the republic votes §Ragainst§! [COLDWAR_SOV_GetVoteSubject].\n\n[COLDWAR_SOV_GetVoteLeanFull]"
 COLDWAR_SOV_pb_award_title_hero:0 "Hero of Socialist Labour"
 COLDWAR_SOV_pb_award_title_pride:0 "The Pride of the Union"
 COLDWAR_SOV_pb_award_line_hero:0 "For the second year running we lead the Union. In the Sverdlov Hall the Chairman of the Presidium pins the Gold Star of the Hammer and Sickle on our First Secretary: he is a §YHero of Socialist Labour§!, and so, for a year, is our republic."
 COLDWAR_SOV_pb_award_line_pride:0 "For a year our republic carries the title §YPride of the Union§!: Pravda prints our First Secretary's portrait, and every factory wants to keep the title."
 COLDWAR_SOV_pb_order_line:0 "\n\nIt is our third title in this Five-Year Plan: the republic is decorated with the §YOrder of Lenin§!, for as long as it remains in the Union."
 COLDWAR_SOV_pb_empty:0 ""
 COLDWAR_SOV_pb_lagging_tt:0 "For a year an investigation of our republic is §R10%§! more likely to find something."
 COLDWAR_SOV_pb_news_hero:0 "For the second year running it leads the Union: its First Secretary, [?global.COLDWAR_SOV_pb_pride.GetLeader], receives the Gold Star of the Hammer and Sickle as a §YHero of Socialist Labour§!."
 COLDWAR_SOV_pb_news_pride:0 "Its First Secretary, [?global.COLDWAR_SOV_pb_pride.GetLeader], received the congratulations of the Politburo in the Kremlin. For a year the republic carries the title §YPride of the Union§!."
 COLDWAR_SOV_pb_news_order:0 "\n\nWith its third title in this Five-Year Plan the republic is decorated with the §YOrder of Lenin§!."
 COLDWAR_SOV_pb_news_lag:0 "\n\nAt the bottom of the table Pravda names §R[?global.COLDWAR_SOV_pb_lagging.GetNameDef]§!: the republic is lagging behind."
 COLDWAR_SOV_pb_disqualified_tt:0 "The republic is §Rdisqualified§! from the Socialist Emulation for a year: last in every column, and its Pride of the Union, Red Banners and Order of Lenin are withdrawn."
 COLDWAR_SOV_pb_pripiski_emu:0 "Our statisticians also polish the figures Moscow reads in the §YSocialist Emulation§! for a year (growth §Y+1.5§! points, factories and output per head §Y+10%§!). Nobody outside our leadership knows. If the lie is uncovered, we are §Rdisqualified§! from the emulation for a year and lose its honours."
 COLDWAR_SOV_pb_favour_tt:0 "Moscow favours one republic a year (50 political power, Union cohesion §R-1§!): the republic gains §G25§! political power and counts §Y3§! places better in the January judgement of the Socialist Emulation; the other republics resent it (their opinion of it §R-20§!)."
 COLDWAR_SOV_pb_favour_free_trig_tt:0 "Moscow has not favoured another republic in the last year."
 COLDWAR_SOV_pb_favour_republic:0 "Favour [FROM.GetNameDef]"
 COLDWAR_SOV_pb_favour_republic_desc:0 "A word from the General Secretary, a delegation in Pravda, a new factory in the right oblast: everybody understands which republic Moscow prefers this year."
 COLDWAR_SOV_moscows_favourite:0 "Moscow's Favourite"
 COLDWAR_SOV_pb_favoured_tt:0 "For a year we count §Y3§! places better in the January judgement of the Socialist Emulation."
 COLDWAR_SOV_pb_favourite_resent_tt:0 "Our opinion of [?global.COLDWAR_SOV_pb_favourite.GetNameDef]: §R-20§!."
 COLDWAR_SOV_pb_sp_tt:0 "§YThe Spartakiad of the Peoples of the USSR§! (1971, 1975, 1979, 1983, 1986): 90 days before the games every republic prepares its team in the decisions of The Politburo of the CPSU. The result weighs the preparation, the size of the republic and luck. Gold: §YChampions of the Spartakiad§! for two years (stability +3%, war support +5%, political power gain +5%); silver: 50 political power; bronze: 25 political power. The games strengthen the Union (cohesion +2)."
 COLDWAR_SOV_pb_sp_ed_5:0 "V Spartakiad of the Peoples of the USSR (1971)"
 COLDWAR_SOV_pb_sp_ed_6:0 "VI Spartakiad of the Peoples of the USSR (1975)"
 COLDWAR_SOV_pb_sp_ed_7:0 "VII Spartakiad of the Peoples of the USSR (1979)"
 COLDWAR_SOV_pb_sp_ed_8:0 "VIII Spartakiad of the Peoples of the USSR (1983)"
 COLDWAR_SOV_pb_sp_ed_9:0 "IX Spartakiad of the Peoples of the USSR (1986)"
 COLDWAR_SOV_pb_sp_ed_none:0 "the Spartakiad of the Peoples of the USSR"
 COLDWAR_SOV_pb_sp_prep_own_5:0 "V Spartakiad, summer 1971: §Ypreparations§! - our team [?COLDWAR_SOV_pb_sp_pts|0] points"
 COLDWAR_SOV_pb_sp_prep_5:0 "V Spartakiad, summer 1971: the republics §Yprepare their teams§!"
 COLDWAR_SOV_pb_sp_held_5:0 "V Spartakiad 1971: champions §Y[?global.COLDWAR_SOV_pb_sp_gold.GetName]§!"
 COLDWAR_SOV_pb_sp_prep_own_6:0 "VI Spartakiad, summer 1975: §Ypreparations§! - our team [?COLDWAR_SOV_pb_sp_pts|0] points"
 COLDWAR_SOV_pb_sp_prep_6:0 "VI Spartakiad, summer 1975: the republics §Yprepare their teams§!"
 COLDWAR_SOV_pb_sp_held_6:0 "VI Spartakiad 1975: champions §Y[?global.COLDWAR_SOV_pb_sp_gold.GetName]§!"
 COLDWAR_SOV_pb_sp_prep_own_7:0 "VII Spartakiad, summer 1979: §Ypreparations§! - our team [?COLDWAR_SOV_pb_sp_pts|0] points"
 COLDWAR_SOV_pb_sp_prep_7:0 "VII Spartakiad, summer 1979: the republics §Yprepare their teams§!"
 COLDWAR_SOV_pb_sp_held_7:0 "VII Spartakiad 1979: champions §Y[?global.COLDWAR_SOV_pb_sp_gold.GetName]§!"
 COLDWAR_SOV_pb_sp_prep_own_8:0 "VIII Spartakiad, summer 1983: §Ypreparations§! - our team [?COLDWAR_SOV_pb_sp_pts|0] points"
 COLDWAR_SOV_pb_sp_prep_8:0 "VIII Spartakiad, summer 1983: the republics §Yprepare their teams§!"
 COLDWAR_SOV_pb_sp_held_8:0 "VIII Spartakiad 1983: champions §Y[?global.COLDWAR_SOV_pb_sp_gold.GetName]§!"
 COLDWAR_SOV_pb_sp_prep_own_9:0 "IX Spartakiad, summer 1986: §Ypreparations§! - our team [?COLDWAR_SOV_pb_sp_pts|0] points"
 COLDWAR_SOV_pb_sp_prep_9:0 "IX Spartakiad, summer 1986: the republics §Yprepare their teams§!"
 COLDWAR_SOV_pb_sp_held_9:0 "IX Spartakiad 1986: champions §Y[?global.COLDWAR_SOV_pb_sp_gold.GetName]§!"
 COLDWAR_SOV_pb_sp_next:0 "V Spartakiad of the Peoples of the USSR: summer 1971"
 COLDWAR_SOV_pb_sp_sp_trained_tt:0 "Our team gains §G3§! points for the Spartakiad (now [?COLDWAR_SOV_pb_sp_pts|0])."
 COLDWAR_SOV_pb_sp_not_trained_trig_tt:0 "Our team has not been sent to the training camps yet."
 COLDWAR_SOV_pb_sp_train:0 "Train the Republic's Team"
 COLDWAR_SOV_pb_sp_train_desc:0 "Training camps on the Black Sea, the best coaches of the republic, and leave from work for every athlete of the team."
 COLDWAR_SOV_pb_sp_sp_built_tt:0 "Our team gains §G4§! points for the Spartakiad (now [?COLDWAR_SOV_pb_sp_pts|0])."
 COLDWAR_SOV_pb_sp_not_built_trig_tt:0 "We have not built for this Spartakiad yet."
 COLDWAR_SOV_pb_sp_stadiums:0 "Build Stadiums and Sports Schools"
 COLDWAR_SOV_pb_sp_stadiums_desc:0 "A new stadium in the capital and a sports school in every district: the republic's athletes need more than enthusiasm."
 COLDWAR_SOV_pb_sp_sp_special_tt:0 "Our team gains §G6§! points for the Spartakiad (now [?COLDWAR_SOV_pb_sp_pts|0])."
 COLDWAR_SOV_pb_sp_doping_risk_tt:0 "§RIn one case of four the doctors are caught§!: §RA Doping Scandal§! (stability -5%, political power gain -5% for 180 days) and the points are struck from the record."
 COLDWAR_SOV_pb_sp_not_special_trig_tt:0 "Our doctors have not started their programme yet."
 COLDWAR_SOV_pb_sp_special:0 "Special Preparation of the Athletes"
 COLDWAR_SOV_pb_sp_special_desc:0 "The team doctors have a programme of their own. Nobody asks what is in the injections, and nobody will - unless the control commission does."
 COLDWAR_SOV_pb_emu_tt:0 "§YSocialist Emulation§!: every month Moscow ranks the Union republics by growth, industry, output per head and the fulfilled targets of the Union Plan, using the figures the republics report.\n\n§YEvery quarter§! a §YTransferable Red Banner§! goes to the leader of each column (the holder keeps it on a tie):\n  Growth: construction speed §G+5%§!\n  Industry: factory output §G+3%§!\n  Output per Head: consumer goods §G-2%§!\n  the Plan: stability §G+3%§!, political power gain §G+5%§!\n§YSocialist Emulation§! (Union tree) doubles the banners.\n\n§YEvery January§! the best republic overall becomes the §YPride of the Union§! for a year: stability §G+5%§!, political power gain §G+10%§!, construction speed §G+10%§!, consumer goods §G-5%§!.\nA second title in a row: §YHero of Socialist Labour§! instead (stability §G+5%§!, political power gain §G+10%§!, construction speed §G+15%§!, consumer goods §G-5%§!, factory output §G+5%§!) and the Gold Star for the First Secretary.\nThree titles in one Five-Year Plan: the §YOrder of Lenin§! for as long as the republic stays in the Union (stability §G+3%§!, political power gain §G+5%§!, construction speed §G+5%§!, factory output §G+3%§!).\nThe last republic is §RLagging Behind§! for a year (stability §R-3%§!, political power gain §R-5%§!, investigations +10%).\n\nHolders of the Order of Lenin:[COLDWAR_SOV_pb_GetOrderList]"
 COLDWAR_SOV_pb_order_list:0 "[UKR.COLDWAR_SOV_pb_GetOrderHolder][BLR.COLDWAR_SOV_pb_GetOrderHolder][EST.COLDWAR_SOV_pb_GetOrderHolder][LAT.COLDWAR_SOV_pb_GetOrderHolder][LIT.COLDWAR_SOV_pb_GetOrderHolder][ARM.COLDWAR_SOV_pb_GetOrderHolder][AZE.COLDWAR_SOV_pb_GetOrderHolder][GEO.COLDWAR_SOV_pb_GetOrderHolder][KAZ.COLDWAR_SOV_pb_GetOrderHolder][KYR.COLDWAR_SOV_pb_GetOrderHolder][TAJ.COLDWAR_SOV_pb_GetOrderHolder][TRK.COLDWAR_SOV_pb_GetOrderHolder][UZB.COLDWAR_SOV_pb_GetOrderHolder][MLV.COLDWAR_SOV_pb_GetOrderHolder]"
