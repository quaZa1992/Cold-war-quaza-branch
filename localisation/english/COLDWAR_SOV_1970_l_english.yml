 COLDWAR_SOV_banner_plan:0 "Red Banner: the Plan"
 COLDWAR_SOV_banner_plan_desc:0 "Every quarter the Central Committee hands its Transferable Red Banner for annual targets of the Union Plan fulfilled in this Five-Year Plan to the republic that leads the Socialist Emulation. This quarter it hangs in our House of Government."
