 COLDWAR_SOV.1.t:0 "January 1970: The Troika"
 COLDWAR_SOV.1.d:0 "Six years after the fall of Khrushchev the Soviet Union is governed by a collective leadership. General Secretary Leonid Brezhnev holds the Party, Premier Alexei Kosygin the government and the economy, Nikolai Podgorny the Presidium of the Supreme Soviet. Behind them sit the ideologue Suslov, the ambitious Shelepin, and a Politburo of old comrades who have learned to fear sudden change.\n\nThe balance between reformers and the orthodox decides what the Politburo will accept. The cohesion of the fifteen Union republics decides how much Moscow can ask of them, and three republican First Secretaries sit in the Politburo itself. The country is a superpower; its shops are half empty, its harvests uncertain and its army the largest on Earth."
 COLDWAR_SOV.1.a:0 "Stability of cadres. Continuity. Developed socialism."
 COLDWAR_SOV.2.t:0 "The Lenin Centenary"
 COLDWAR_SOV.2.d:0 "On 22 April 1970 the Soviet Union celebrates the hundredth birthday of Vladimir Ilyich Lenin. Every worker receives a jubilee medal, every factory holds a rally, and television broadcasts the Leniniana around the clock. The jokes about Lenin-flavoured soap and triple beds for 'Lenin is with us' travel faster than the official speeches."
 COLDWAR_SOV.2.a:0 "Lenin lived, Lenin lives, Lenin will live!"
 COLDWAR_SOV.3.t:0 "The Brezhnev Constitution"
 COLDWAR_SOV.3.d:0 "The Supreme Soviet has adopted the new Constitution of the USSR. Article 6 enshrines the leading and guiding role of the Communist Party; the Soviet people is proclaimed a new historical community of nations. For the first time the rights of citizens are listed at length, and for the first time no one expects them to be enforced."
 COLDWAR_SOV.3.a:0 "A constitution of developed socialism."
 COLDWAR_SOV.4.t:0 "A Soviet Footprint on the Moon"
 COLDWAR_SOV.4.d:0 "A Soviet cosmonaut has stepped onto the surface of the Moon. Radio Moscow interrupts its programme, crowds gather on Red Square, and newspapers across the world print the photograph of the red flag in the grey dust. The space race has a second winner."
 COLDWAR_SOV.4.a:0 "Glory to the Soviet people!"
 COLDWAR_SOV.5.t:0 "Solzhenitsyn Expelled"
 COLDWAR_SOV.5.d:0 "Aleksandr Solzhenitsyn has been arrested, stripped of his citizenship and put on a plane to Frankfurt. The Gulag Archipelago is being read on Western radio stations in Russian every night. The Politburo hopes that out of sight means out of mind."
 COLDWAR_SOV.5.a:0 "Let him write for the West."
 COLDWAR_SOV.6.t:0 "The Moscow Olympics"
 COLDWAR_SOV.6.d:0 "The Games of the XXII Olympiad open in the Lenin Stadium. Misha the bear smiles from every poster, the city has been cleared of dissidents and drunks, and the shops have been filled for the foreign guests. The invitations to the Western teams have been sent; each nation will decide for itself whether to come."
 COLDWAR_SOV.6.a:0 "Let the Games begin!"
 COLDWAR_SOV.7.t:0 "The Moscow Helsinki Group"
 COLDWAR_SOV.7.d:0 "Yuri Orlov, Elena Bonner, Anatoly Shcharansky and their friends have founded a public group to monitor the Soviet Union's compliance with Basket Three of the Helsinki Final Act. Their reports reach Western embassies within days."
 COLDWAR_SOV.7.a:0 "Let them be watched."
 COLDWAR_SOV.7.b:0 "A signature is a signature."
 COLDWAR_SOV.8.t:0 "The World Reacts"
 COLDWAR_SOV.8.d:0 "Soviet strategic bombers have struck the Chinese nuclear installations at Lop Nur. Washington, New Delhi and Tokyo condemn the attack; the United Nations Security Council meets in emergency session; the communist parties of the world are divided as never before."
 COLDWAR_SOV.8.a:0 "The threat has been removed."
 COLDWAR_SOV.9.t:0 "Summoned to Moscow"
 COLDWAR_SOV.9.d:0 "The Soviet leadership has summoned our Party leadership to Moscow to explain the unrest in the country and the 'right-wing deviations' in the press. Brezhnev speaks of the common responsibility of the socialist community. How we answer is our own decision."
 COLDWAR_SOV.9.a:0 "Promise discipline."
 COLDWAR_SOV.9.b:0 "Defend our own course."
 COLDWAR_SOV.10.t:0 "The Politburo in Session"
 COLDWAR_SOV.10.d:0 "The Politburo of the Central Committee meets in its room on the third floor of the Senate building in the Kremlin. On the agenda: the reports of the ministries, the plan, cadre questions and the proposals of the republican members.\n\nEvery republican seat holder may now submit one proposal for this session."
 COLDWAR_SOV.10.a:0 "Open the session."
 COLDWAR_SOV.11.t:0 "The Politburo Votes"
 COLDWAR_SOV.11.d:0 "The Politburo of the Central Committee votes on [COLDWAR_SOV_GetVoteSubject].\n\n[COLDWAR_SOV_GetVoteLeanFull] As one of the three republican members, our First Secretary holds a full vote.\n\n§YWe cast our vote in the decisions of The Politburo of the CPSU: in favour or against. The votes are counted ten days after the vote was called; if we have not voted by then, our vote counts as an abstention.§!"
 COLDWAR_SOV.11.a:0 "To the vote."
 COLDWAR_SOV.12.t:0 "The Count"
 COLDWAR_SOV.12.d:0 "The votes are counted."
 COLDWAR_SOV.12.a:0 "Count."
 COLDWAR_SOV.13.t:0 "The Politburo Has Voted"
 COLDWAR_SOV.13.d:0 "The Politburo of the CPSU has voted on [COLDWAR_SOV_GetLastVoteSubject].\n\n§YResult: [COLDWAR_SOV_GetVoteResult]§!\nIn favour: §Y[?global.COLDWAR_SOV_vote_yes]§! of §Y[?global.COLDWAR_SOV_vote_total]§! votes. [COLDWAR_SOV_GetMoscowVote]\n\nThe republican members:[UKR.COLDWAR_SOV_GetVoteLine][BLR.COLDWAR_SOV_GetVoteLine][EST.COLDWAR_SOV_GetVoteLine][LAT.COLDWAR_SOV_GetVoteLine][LIT.COLDWAR_SOV_GetVoteLine][ARM.COLDWAR_SOV_GetVoteLine][AZE.COLDWAR_SOV_GetVoteLine][GEO.COLDWAR_SOV_GetVoteLine][KAZ.COLDWAR_SOV_GetVoteLine][KYR.COLDWAR_SOV_GetVoteLine][TAJ.COLDWAR_SOV_GetVoteLine][TRK.COLDWAR_SOV_GetVoteLine][UZB.COLDWAR_SOV_GetVoteLine][MLV.COLDWAR_SOV_GetVoteLine]"
 COLDWAR_SOV.13.a:0 "So it is decided."
 COLDWAR_SOV.15.t:0 "A Seat at the Table"
 COLDWAR_SOV.15.d:0 "The Politburo has met. As a republican member our First Secretary may submit one proposal for this session: a Union project for our republic, relief from the plan, or protection of our cadres. Moscow decides first; if it refuses, we can take the matter before the Politburo."
 COLDWAR_SOV.15.a:0 "We know what our republic needs."
 COLDWAR_SOV.16.t:0 "108 Percent"
 COLDWAR_SOV.16.d:0 "The figures have gone to Moscow: 108 percent of the plan. The cotton, the grain and the meat are all there - on paper. Pravda will print them, and the Socialist Emulation will rank us by them.\n\nOnly a handful of men know the truth: the First Secretary, the chairman of our statistics board and two heads of department. The inspectors of the People's Control and the KGB must never find the gap."
 COLDWAR_SOV.16.a:0 "Who will count the cotton?"
 COLDWAR_SOV.17.t:0 "A Dossier from the Republics"
 COLDWAR_SOV.17.d:0 "[FROM.GetNameDefCap] has sent the Central Committee a dossier on the First Secretary of the [COLDWAR_SOV_GetAccused]: bribes, falsified reports, relatives in high places. If even half of it is true, he cannot stay in the Politburo. If it is slander, the accuser will pay for it."
 COLDWAR_SOV.17.a:0 "Let the Party Control Committee investigate. (25 political power)"
 COLDWAR_SOV.17.b:0 "Put it in the drawer."
 COLDWAR_SOV.18.t:0 "The Party Control Committee Reports"
 COLDWAR_SOV.18.d:0 "The Party Control Committee has examined the accusations against the First Secretary of the [COLDWAR_SOV_GetAccused].\n\n[COLDWAR_SOV_GetKompromatResult]"
 COLDWAR_SOV.18.a:0 "The Party cleanses itself."
 COLDWAR_SOV.19.t:0 "A Call to Moscow"
 COLDWAR_SOV.19.d:0 "The General Secretary has offered our First Secretary a post in Moscow: a chair in the Council of Ministers and a place among the leadership of the Union. It is the career of a lifetime. But our republic would need a new First Secretary, and our seat in the Politburo would become free at once.\n\nIn return the republic would keep a patron in Moscow."
 COLDWAR_SOV.19.a:0 "He goes to Moscow."
 COLDWAR_SOV.19.b:0 "He is needed here."
 COLDWAR_SOV.20.t:0 "A Proposal from the Republics"
 COLDWAR_SOV.20.d:0 "[FROM.GetNameDefCap] has submitted a proposal to the Central Committee: [FROM.COLDWAR_SOV_GetProposal]\n\nIf we refuse, the republic can take the matter before the Politburo, where the republican members may outvote us."
 COLDWAR_SOV.20.a:0 "Approve the proposal."
 COLDWAR_SOV.20.b:0 "Refuse."
 COLDWAR_SOV.21.t:0 "Moscow Agrees"
 COLDWAR_SOV.21.d:0 "The Central Committee has approved our proposal. The ministries in Moscow have been instructed to carry it out."
 COLDWAR_SOV.21.a:0 "The Union keeps its word."
 COLDWAR_SOV.22.t:0 "The Politburo Has Overruled Us"
 COLDWAR_SOV.22.d:0 "The Politburo has adopted the proposal of the [COLDWAR_SOV_GetLastProposer] against our wishes. The decision of the Politburo binds the government. We can carry it out, or ignore the majority and bear the consequences."
 COLDWAR_SOV.22.a:0 "Carry out the decision."
 COLDWAR_SOV.22.b:0 "Ignore the majority."
 COLDWAR_SOV.23.t:0 "A Request for Patronage"
 COLDWAR_SOV.23.d:0 "[FROM.GetNameDefCap] has no seat in the Politburo and asks for our help: our next Union project should be built in their republic. A favour given is a favour owed."
 COLDWAR_SOV.23.a:0 "Take them under our wing."
 COLDWAR_SOV.23.b:0 "We have our own needs."
 COLDWAR_SOV.24.t:0 "The Referendum"
 COLDWAR_SOV.24.d:0 "[FROM.GetNameDefCap] has held a referendum on independence, and the result is unambiguous. The republic's leaders now ask Moscow to respond.\n\nWe can negotiate a new Union treaty, recognise the result, or refuse. Force would mean war, and war must be declared openly."
 COLDWAR_SOV.24.a:0 "Negotiate a new Union treaty."
 COLDWAR_SOV.24.b:0 "Recognise the result."
 COLDWAR_SOV.24.c:0 "The Union is indivisible."
 COLDWAR_SOV.25.t:0 "A New Five-Year Plan"
 COLDWAR_SOV.25.d:0 "The [COLDWAR_SOV_GetPlanName] begins. As a member of the Politburo our republic may choose one Union project, built at Moscow's expense."
 COLDWAR_SOV.25.a:0 "Build a §Ycivilian factory§! in our republic."
 COLDWAR_SOV.25.b:0 "Build new §Yinfrastructure§! in our republic."
 COLDWAR_SOV.25.c:0 "Build a §Ypower station§! in our republic."
 COLDWAR_SOV.25.e:0 "Build an §Yagriculture district§! in our republic."
 COLDWAR_SOV.25.f:0 "Build a §Ymilitary factory§! in our republic."
 COLDWAR_SOV.27.t:0 "Removed from the Politburo"
 COLDWAR_SOV.27.d:0 "The Central Committee has relieved the First Secretary of the [COLDWAR_SOV_GetLastSeat] of his duties as a member of the Politburo. No reason was given; none was needed."
 COLDWAR_SOV.27.a:0 "Cadres decide everything."
 COLDWAR_SOV.28.t:0 "The Federation Council"
 COLDWAR_SOV.28.d:0 "The President of the USSR has created the Federation Council. The leaders of all fifteen republics now advise the head of state directly; the three republican seats in the Politburo have lost their meaning, and the Politburo itself is no longer the centre of power."
 COLDWAR_SOV.28.a:0 "A new Union is being born."
 COLDWAR_SOV.29.t:0 "A Petition from the Republics"
 COLDWAR_SOV.29.d:0 "[FROM.GetNameDefCap] has no seat in the Politburo, but its First Secretary has written to the Central Committee: the republic needs investment, and it asks the Union to help.\n\nEvery rouble Gosplan sends to the republics is a rouble missing in Moscow's own budget. A Union project costs us §Y2%§! of our GDP for a factory and §Y1.5%§! for infrastructure, half as much again for every project that still weighs on the budget, and raises our consumer goods tax by §R10%§! for 90 days. Several petitions granted at once add up quickly."
 COLDWAR_SOV.29.a:0 "Build a civilian factory there."
 COLDWAR_SOV.29.b:0 "Improve their infrastructure."
 COLDWAR_SOV.29.c:0 "File it away."
 COLDWAR_SOV.30.t:0 "The Investment Burden Eases"
 COLDWAR_SOV.30.d:0 "One of the Union projects no longer weighs on Moscow's budget."
 COLDWAR_SOV.30.a:0 "Good."
 COLDWAR_SOV.31.t:0 "The Succession Plenum"
 COLDWAR_SOV.31.d:0 "The Central Committee has been summoned to an extraordinary plenum. The Politburo must propose a new General Secretary, and the plenum will elect him. Who will lead the Party now?"
 COLDWAR_SOV.31.a:0 "Alexei Kosygin."
 COLDWAR_SOV.31.b:0 "Nikolai Podgorny."
 COLDWAR_SOV.31.c:0 "Mikhail Suslov."
 COLDWAR_SOV.31.e:0 "Alexander Shelepin."
 COLDWAR_SOV.31.f:0 "Yuri Andropov."
 COLDWAR_SOV.31.g:0 "Andrei Grechko."
 COLDWAR_SOV.31.h:0 "Dmitry Ustinov."
 COLDWAR_SOV.31.i:0 "Grigory Romanov."
 COLDWAR_SOV.31.j:0 "Konstantin Chernenko."
 COLDWAR_SOV.31.k:0 "Mikhail Gorbachev."
 COLDWAR_SOV.31.l:0 "Nikolai Ryzhkov, in the place of Alexei Kosygin."
 COLDWAR_SOV.31.m:0 "Vasily Kuznetsov, in the place of Nikolai Podgorny."
 COLDWAR_SOV.31.n:0 "Mikhail Zimyanin, in the place of Mikhail Suslov."
 COLDWAR_SOV.31.o:0 "Heydar Aliyev, in the place of Yuri Andropov."
 COLDWAR_SOV.31.p:0 "Nikolai Ogarkov, in the place of Andrei Grechko."
 COLDWAR_SOV.31.q:0 "Leonid Smirnov, in the place of Dmitry Ustinov."
 COLDWAR_SOV.31.r:0 "Viktor Grishin, in the place of Konstantin Chernenko."
 COLDWAR_SOV.32.t:0 "A Dignified Retirement"
 COLDWAR_SOV.32.d:0 "Leonid Ilyich Brezhnev has asked the Central Committee to relieve him of his duties for reasons of health. The Plenum thanks him for his outstanding services; the Politburo will now put his designated heir to the vote."
 COLDWAR_SOV.32.a:0 "The Party thanks Leonid Ilyich."
 COLDWAR_SOV.33.t:0 "A New General Secretary"
 COLDWAR_SOV.33.d:0 "The Plenum of the Central Committee of the CPSU has unanimously elected §Y[SOV.GetLeader]§! General Secretary. Foreign governments study his biography; Kremlinologists study the order of the leaders on the Lenin Mausoleum."
 COLDWAR_SOV.33.a:0 "The Party is united."
 COLDWAR_SOV.34.t:0 "Moscow Refuses"
 COLDWAR_SOV.34.d:0 "The Central Committee has refused our proposal. As a member of the Politburo we can still take the matter before the Politburo: the seven Moscow members are sceptical, but three of them will usually support a republic, and the votes of the republics may decide.\n\nThe decision §YBring It before the Politburo§! is available for 90 days."
 COLDWAR_SOV.34.a:0 "We will see."
 COLDWAR_SOV.35.t:0 "A New First Secretary?"
 COLDWAR_SOV.35.d:0 "The Party Control Committee has found our First Secretary guilty. We have lost our seat and are in disgrace in Moscow. The Central Committee lets it be known that a new First Secretary would shorten our exile from the corridors of power."
 COLDWAR_SOV.35.a:0 "Elect a new First Secretary."
 COLDWAR_SOV.35.b:0 "He stays."
 COLDWAR_SOV.36.t:0 "The Party Congress Opens"
 COLDWAR_SOV.36.d:0 "The [COLDWAR_SOV_GetCongress] of the Communist Party of the Soviet Union has opened in the Kremlin Palace of Congresses. Five thousand delegates applaud the report of the Central Committee. Behind the scenes the new Central Committee and the new Politburo are being formed: for thirty days Moscow may change the republican seats without the cost of an extraordinary plenum."
 COLDWAR_SOV.36.a:0 "Long live the Party!"
 COLDWAR_SOV.37.t:0 "The New Politburo"
 COLDWAR_SOV.37.d:0 "The [COLDWAR_SOV_GetCongress] has closed. The new Central Committee has elected the Politburo. The republican members:[UKR.COLDWAR_SOV_GetSeatLine][BLR.COLDWAR_SOV_GetSeatLine][EST.COLDWAR_SOV_GetSeatLine][LAT.COLDWAR_SOV_GetSeatLine][LIT.COLDWAR_SOV_GetSeatLine][ARM.COLDWAR_SOV_GetSeatLine][AZE.COLDWAR_SOV_GetSeatLine][GEO.COLDWAR_SOV_GetSeatLine][KAZ.COLDWAR_SOV_GetSeatLine][KYR.COLDWAR_SOV_GetSeatLine][TAJ.COLDWAR_SOV_GetSeatLine][TRK.COLDWAR_SOV_GetSeatLine][UZB.COLDWAR_SOV_GetSeatLine][MLV.COLDWAR_SOV_GetSeatLine]"
 COLDWAR_SOV.37.a:0 "Forward to the decisions of the Congress!"
 COLDWAR_SOV.38.t:0 "Pravda: The Pride of the Union"
 COLDWAR_SOV.38.d:0 "Moscow, January. The Central Committee has reviewed the Socialist Emulation of the Union republics in the past year. Growth, industry, output per head and the fulfilment of the plan were weighed against each other, and one republic stood above the rest: [?global.COLDWAR_SOV_pb_pride.GetNameDef]. [COLDWAR_SOV_pb_GetNewsTitleLine][COLDWAR_SOV_pb_GetNewsOrderLine][COLDWAR_SOV_pb_GetNewsLagLine]\n\nThe other First Secretaries applauded. Several of them have already asked Gosplan for their figures."
 COLDWAR_SOV.38.a:0 "Glory to the workers of the republic!"
 COLDWAR_SOV.40.t:0 "The Karabakh Petitions"
 COLDWAR_SOV.40.d:0 "Tens of thousands of Armenians have signed petitions asking Moscow to transfer the Nagorno-Karabakh Autonomous Oblast from Azerbaijan to Armenia. In Stepanakert the regional soviet has voted for the transfer; in Baku the streets answer with anger."
 COLDWAR_SOV.40.a:0 "The borders of the republics are not to be changed."
 COLDWAR_SOV.40.b:0 "Ask Baku to cede Nagorno-Karabakh to Armenia."
 COLDWAR_SOV.41.t:0 "The Warsaw Pact Is Dissolved"
 COLDWAR_SOV.41.d:0 "Moscow has announced the dissolution of the Warsaw Treaty Organisation. The Soviet troops will go home; every former member is free to choose its own alliances."
 COLDWAR_SOV.41.a:0 "We will go our own way."
 COLDWAR_SOV.42.t:0 "The Imperial Question"
 COLDWAR_SOV.42.d:0 "The Russian Party must answer the question that has haunted Russia since 1917: is Russia the Union, or is the Union a burden on Russia? Some want to hold every republic, by force if need be; others want a smaller, Russian Union of those who wish to stay."
 COLDWAR_SOV.42.a:0 "Hold the Union together."
 COLDWAR_SOV.42.b:0 "A smaller Russian Union."
 COLDWAR_SOV.43.t:0 "A Poor Harvest"
 COLDWAR_SOV.43.d:0 "Drought in the Volga region and an early frost in Kazakhstan: the grain harvest has fallen far short of the plan. Unless we find grain, the shops will be empty by spring.\n\nThe decision §YBuy Grain Abroad§! can prevent the worst for 120 days."
 COLDWAR_SOV.43.a:0 "The kolkhozes must deliver."
 COLDWAR_SOV.44.t:0 "The Union Is Breaking Apart"
 COLDWAR_SOV.44.d:0 "Union cohesion has collapsed. Republican parliaments ignore the laws of the Union, the ministries in Moscow no longer reach the provinces, and national fronts march in every capital from Tallinn to Dushanbe."
 COLDWAR_SOV.44.a:0 "We must save what can be saved."
 COLDWAR_SOV.45.t:0 "Accident at the Nuclear Power Plant"
 COLDWAR_SOV.45.d:0 "An explosion has destroyed the reactor of an RBMK unit. A cloud of radioactive dust drifts over the republics and towards Scandinavia, where measuring stations raise the alarm before Moscow says a word."
 COLDWAR_SOV.45.a:0 "Evacuate the zone and say nothing."
 COLDWAR_SOV.45.b:0 "Tell the world the truth."
 COLDWAR_SOV.46.t:0 "The Dying Sea"
 COLDWAR_SOV.46.d:0 "The Aral Sea is shrinking. The rivers that fed it now water the cotton fields of Uzbekistan and Turkmenistan; the fishing fleets of Muynak lie in the sand, and salt storms carry poison across Karakalpakstan."
 COLDWAR_SOV.46.a:0 "Divert the Siberian rivers to the south."
 COLDWAR_SOV.46.b:0 "The cotton plan comes first."
 COLDWAR_SOV.47.t:0 "The Orthodox Conspire"
 COLDWAR_SOV.47.d:0 "The reformers dominate the Politburo, and the old guard has had enough. Generals, KGB officers and regional secretaries meet at dachas outside Moscow; the word 'Hungary' is heard more and more often."
 COLDWAR_SOV.47.a:0 "Make concessions to the orthodox."
 COLDWAR_SOV.47.b:0 "Purge the conspirators."
 COLDWAR_SOV.48.t:0 "The Reformers Call on the Army"
 COLDWAR_SOV.48.d:0 "Reaction rules the Politburo. Reform-minded ministers and economists warn that the country is heading for ruin, and some of them have begun to sound out the generals."
 COLDWAR_SOV.48.a:0 "Step back."
 COLDWAR_SOV.48.b:0 "Show a firm hand."
 COLDWAR_SOV.49.t:0 "The Soviet Withdrawal"
 COLDWAR_SOV.49.d:0 "Moscow has informed our government that the limited contingent will leave Afghanistan. The last Soviet columns will cross the Amu Darya; from now on our army stands alone."
 COLDWAR_SOV.49.a:0 "We will defend ourselves."
 COLDWAR_SOV.50.t:0 "Gdansk, December 1970"
 COLDWAR_SOV.50.d:0 "Strikes have broken out in the shipyards of Gdansk, Gdynia and Szczecin after a sudden rise in food prices. The Polish militia has opened fire; Gomulka has fallen and Edward Gierek takes over. Warsaw waits to hear what Moscow thinks."
 COLDWAR_SOV.50.a:0 "Help Gierek with credits."
 COLDWAR_SOV.50.b:0 "Order calm and discipline."
 COLDWAR_SOV.51.t:0 "A Nobel Prize for Solzhenitsyn"
 COLDWAR_SOV.51.d:0 "The Swedish Academy has awarded the Nobel Prize in Literature to Aleksandr Solzhenitsyn. The writer asks whether he will be allowed to return if he travels to Stockholm."
 COLDWAR_SOV.51.a:0 "If he goes, he stays there."
 COLDWAR_SOV.51.b:0 "Let him collect his prize."
 COLDWAR_SOV.52.t:0 "Soyuz 11"
 COLDWAR_SOV.52.d:0 "The crew of Soyuz 11 - Georgy Dobrovolsky, Vladislav Volkov and Viktor Patsayev - has been found dead in their capsule after landing. A valve opened during the separation of the modules. The first space station, Salyut 1, has lost its first crew."
 COLDWAR_SOV.52.a:0 "Their names will live in the stars."
 COLDWAR_SOV.53.t:0 "Empty Shelves"
 COLDWAR_SOV.53.d:0 "The harvest shortfall reaches the shops."
 COLDWAR_SOV.53.a:0 "Endure."
 COLDWAR_SOV.54.t:0 "The Union Is Breaking Apart"
 COLDWAR_SOV.54.d:0 "Moscow has lost control. The Union ministries no longer reach our republic and the national front fills the squares. What our republic does now is our own decision."
 COLDWAR_SOV.54.a:0 "Our time has come."
 COLDWAR_SOV.55.t:0 "The Next Item"
 COLDWAR_SOV.55.d:0 "The next item on the agenda."
 COLDWAR_SOV.55.a:0 "Next."
 COLDWAR_SOV.60.t:0 "Moscow Offers Independence"
 COLDWAR_SOV.60.d:0 "The government of the Union has offered our republic the right to leave the Soviet Union. Independence would be ours, with all its promises and all its dangers."
 COLDWAR_SOV.60.a:0 "Declare independence."
 COLDWAR_SOV.60.b:0 "We stay in the Union."
 COLDWAR_SOV.61.t:0 "The New Union Treaty"
 COLDWAR_SOV.61.d:0 "Moscow offers our republic a new Union treaty: broad autonomy, our own budget and laws, and a voice in the Union that no longer depends on the Politburo. No one will be forced to stay - or to leave."
 COLDWAR_SOV.61.a:0 "Sign the treaty."
 COLDWAR_SOV.61.b:0 "Not yet."
 COLDWAR_SOV.62.t:0 "Moscow Asks for Karabakh"
 COLDWAR_SOV.62.d:0 "The Central Committee asks the Azerbaijani leadership to agree to the transfer of Nagorno-Karabakh to the Armenian SSR. Refusing Moscow has its price; agreeing would cost the government in Baku its standing at home."
 COLDWAR_SOV.62.a:0 "Agree to hand over the oblast."
 COLDWAR_SOV.62.b:0 "Karabakh is Azerbaijan."
 COLDWAR_SOV.63.t:0 "An Invitation to Moscow"
 COLDWAR_SOV.63.d:0 "The organising committee of the Moscow Olympics has invited our national team. Some in our government want to boycott the Games in protest against Soviet policy; our athletes want to compete."
 COLDWAR_SOV.63.a:0 "Our athletes will go to Moscow."
 COLDWAR_SOV.63.b:0 "We boycott the Games."
 COLDWAR_SOV.64.t:0 "Karabakh Comes to Armenia"
 COLDWAR_SOV.64.d:0 "Baku has agreed to hand over the Nagorno-Karabakh Autonomous Oblast. Taking it means taking responsibility for its people - and for the anger of our neighbour."
 COLDWAR_SOV.64.a:0 "Miatsum! Unification!"
 COLDWAR_SOV.64.b:0 "Leave it as it is."
 COLDWAR_SOV.70.t:0 "Applications for the 24th Congress"
 COLDWAR_SOV.70.d:0 "Applications open."
 COLDWAR_SOV.70.a:0 "Open."
 COLDWAR_SOV.71.t:0 "Applications for the 25th Congress"
 COLDWAR_SOV.71.d:0 "Applications open."
 COLDWAR_SOV.71.a:0 "Open."
 COLDWAR_SOV.72.t:0 "Applications for the 26th Congress"
 COLDWAR_SOV.72.d:0 "Applications open."
 COLDWAR_SOV.72.a:0 "Open."
 COLDWAR_SOV.73.t:0 "Applications for the 27th Congress"
 COLDWAR_SOV.73.d:0 "Applications open."
 COLDWAR_SOV.73.a:0 "Open."
 COLDWAR_SOV.74.t:0 "Applications for the 28th Congress"
 COLDWAR_SOV.74.d:0 "Applications open."
 COLDWAR_SOV.74.a:0 "Open."
 COLDWAR_SOV.75.t:0 "The 24th Congress Opens"
 COLDWAR_SOV.75.d:0 "The congress opens."
 COLDWAR_SOV.75.a:0 "Open."
 COLDWAR_SOV.76.t:0 "The 25th Congress Opens"
 COLDWAR_SOV.76.d:0 "The congress opens."
 COLDWAR_SOV.76.a:0 "Open."
 COLDWAR_SOV.77.t:0 "The 26th Congress Opens"
 COLDWAR_SOV.77.d:0 "The congress opens."
 COLDWAR_SOV.77.a:0 "Open."
 COLDWAR_SOV.78.t:0 "The 27th Congress Opens"
 COLDWAR_SOV.78.d:0 "The congress opens."
 COLDWAR_SOV.78.a:0 "Open."
 COLDWAR_SOV.79.t:0 "The 28th Congress Opens"
 COLDWAR_SOV.79.d:0 "The congress opens."
 COLDWAR_SOV.79.a:0 "Open."
 COLDWAR_SOV.80.t:0 "The Congress Closes"
 COLDWAR_SOV.80.d:0 "The congress closes."
 COLDWAR_SOV.80.a:0 "Close."
 COLDWAR_SOV.81.t:0 "The Rotation of Cadres"
 COLDWAR_SOV.81.d:0 "Our own rule demands it: at every Party Congress at least one republican seat must change hands. The Congress is over and no seat has changed. Which republic must give up its seat? We may then appoint a successor without the cost of an extraordinary plenum."
 COLDWAR_SOV.81.a:0 "The Ukrainian SSR gives up its seat."
 COLDWAR_SOV.81.b:0 "The Byelorussian SSR gives up its seat."
 COLDWAR_SOV.81.c:0 "The Estonian SSR gives up its seat."
 COLDWAR_SOV.81.e:0 "The Latvian SSR gives up its seat."
 COLDWAR_SOV.81.f:0 "The Lithuanian SSR gives up its seat."
 COLDWAR_SOV.81.g:0 "The Armenian SSR gives up its seat."
 COLDWAR_SOV.81.h:0 "The Azerbaijan SSR gives up its seat."
 COLDWAR_SOV.81.i:0 "The Georgian SSR gives up its seat."
 COLDWAR_SOV.81.j:0 "The Kazakh SSR gives up its seat."
 COLDWAR_SOV.81.k:0 "The Kirghiz SSR gives up its seat."
 COLDWAR_SOV.81.l:0 "The Tajik SSR gives up its seat."
 COLDWAR_SOV.81.m:0 "The Turkmen SSR gives up its seat."
 COLDWAR_SOV.81.n:0 "The Uzbek SSR gives up its seat."
 COLDWAR_SOV.81.o:0 "The Moldavian SSR gives up its seat."
 COLDWAR_SOV.90.t:0 "Death of Leonid Brezhnev"
 COLDWAR_SOV.90.d:0 "Leonid Ilyich Brezhnev, General Secretary since 1964, has died in his sleep at his dacha in Zarechye. The Hall of Columns of the House of the Unions is draped in black; the funeral will take place on Red Square."
 COLDWAR_SOV.90.a:0 "The Party mourns its General Secretary."
 COLDWAR_SOV.90.b:0 "He will be buried at the Kremlin Wall."
 COLDWAR_SOV.91.t:0 "Death of Alexei Kosygin"
 COLDWAR_SOV.91.d:0 "Alexei Nikolayevich Kosygin, the reformer of 1965 and for fourteen years Chairman of the Council of Ministers, has died of a heart attack. In the Politburo §YNikolai Ryzhkov§! now speaks for his camp: his plenum and his course pass to him. The Hall of Columns of the House of the Unions is draped in black; the funeral will take place on Red Square."
 COLDWAR_SOV.91.a:0 "The Party mourns its General Secretary."
 COLDWAR_SOV.91.b:0 "He will be buried at the Kremlin Wall."
 COLDWAR_SOV.92.t:0 "Death of Nikolai Podgorny"
 COLDWAR_SOV.92.d:0 "Nikolai Viktorovich Podgorny, former Chairman of the Presidium of the Supreme Soviet, has died in Moscow. In the Politburo §YVasily Kuznetsov§! now speaks for his camp: his plenum and his course pass to him. The Hall of Columns of the House of the Unions is draped in black; the funeral will take place on Red Square."
 COLDWAR_SOV.92.a:0 "The Party mourns its General Secretary."
 COLDWAR_SOV.92.b:0 "He will be buried at the Kremlin Wall."
 COLDWAR_SOV.93.t:0 "Death of Mikhail Suslov"
 COLDWAR_SOV.93.d:0 "Mikhail Andreyevich Suslov, the grey cardinal and chief ideologue of the Party for three decades, has died after a stroke. In the Politburo §YMikhail Zimyanin§! now speaks for his camp: his plenum and his course pass to him. The Hall of Columns of the House of the Unions is draped in black; the funeral will take place on Red Square."
 COLDWAR_SOV.93.a:0 "The Party mourns its General Secretary."
 COLDWAR_SOV.93.b:0 "He will be buried at the Kremlin Wall."
 COLDWAR_SOV.94.t:0 "Death of Yuri Andropov"
 COLDWAR_SOV.94.d:0 "Yuri Vladimirovich Andropov has died of kidney failure. For months he had governed from a hospital bed in Kuntsevo. In the Politburo §YHeydar Aliyev§! now speaks for his camp: his plenum and his course pass to him. The Hall of Columns of the House of the Unions is draped in black; the funeral will take place on Red Square."
 COLDWAR_SOV.94.a:0 "The Party mourns its General Secretary."
 COLDWAR_SOV.94.b:0 "He will be buried at the Kremlin Wall."
 COLDWAR_SOV.95.t:0 "Death of Andrei Grechko"
 COLDWAR_SOV.95.d:0 "Marshal of the Soviet Union Andrei Antonovich Grechko, Minister of Defence, has died suddenly at his dacha. In the Politburo §YNikolai Ogarkov§! now speaks for his camp: his plenum and his course pass to him. The Hall of Columns of the House of the Unions is draped in black; the funeral will take place on Red Square."
 COLDWAR_SOV.95.a:0 "The Party mourns its General Secretary."
 COLDWAR_SOV.95.b:0 "He will be buried at the Kremlin Wall."
 COLDWAR_SOV.96.t:0 "Death of Dmitry Ustinov"
 COLDWAR_SOV.96.d:0 "Marshal of the Soviet Union Dmitry Fyodorovich Ustinov, the armourer of the Soviet state, has died after a short illness. In the Politburo §YLeonid Smirnov§! now speaks for his camp: his plenum and his course pass to him. The Hall of Columns of the House of the Unions is draped in black; the funeral will take place on Red Square."
 COLDWAR_SOV.96.a:0 "The Party mourns its General Secretary."
 COLDWAR_SOV.96.b:0 "He will be buried at the Kremlin Wall."
 COLDWAR_SOV.97.t:0 "Death of Konstantin Chernenko"
 COLDWAR_SOV.97.d:0 "Konstantin Ustinovich Chernenko has died of emphysema and heart failure after thirteen months in office. In the Politburo §YViktor Grishin§! now speaks for his camp: his plenum and his course pass to him. The Hall of Columns of the House of the Unions is draped in black; the funeral will take place on Red Square."
 COLDWAR_SOV.97.a:0 "The Party mourns its General Secretary."
 COLDWAR_SOV.97.b:0 "He will be buried at the Kremlin Wall."
 COLDWAR_SOV.160.t:0 "[COLDWAR_SOV_pb_GetAwardTitle]"
 COLDWAR_SOV.160.d:0 "The Central Committee has judged the Socialist Emulation of the past year: in growth, industry, output per head and the plan taken together, no republic stood higher than ours. [COLDWAR_SOV_pb_GetAwardLine][COLDWAR_SOV_pb_GetOrderLine]"
 COLDWAR_SOV.160.a:0 "Glory to the workers of our republic!"
 COLDWAR_SOV.161.t:0 "Lagging Behind"
 COLDWAR_SOV.161.d:0 "The Central Committee has judged the Socialist Emulation of the past year, and our republic stands at the bottom of the table. Pravda names us among those who 'lag behind'. Gosplan's inspectors will read our figures twice this year."
 COLDWAR_SOV.161.a:0 "We will catch up."
 COLDWAR_SOV.162.t:0 "The Red Banner for Growth"
 COLDWAR_SOV.162.d:0 "The Central Committee has reviewed the Socialist Emulation of the last quarter. In GDP growth in the last quarter no republic stands higher than ours, and the Transferable Red Banner for growth passes to our republic. The workers' delegation brings it from Moscow tomorrow; the banner hangs in our House of Government until another republic takes it from us.\n\nBonus while we hold it: construction speed §G+5%§!, twice as much once the Union has adopted §YSocialist Emulation§!."
 COLDWAR_SOV.162.a:0 "We will not give it up."
 COLDWAR_SOV.163.t:0 "The Red Banner for Industry"
 COLDWAR_SOV.163.d:0 "The Central Committee has reviewed the Socialist Emulation of the last quarter. In civilian and military factories no republic stands higher than ours, and the Transferable Red Banner for industry passes to our republic. The workers' delegation brings it from Moscow tomorrow; the banner hangs in our House of Government until another republic takes it from us.\n\nBonus while we hold it: factory output §G+3%§!, twice as much once the Union has adopted §YSocialist Emulation§!."
 COLDWAR_SOV.163.a:0 "We will not give it up."
 COLDWAR_SOV.164.t:0 "The Red Banner for Output per Head"
 COLDWAR_SOV.164.d:0 "The Central Committee has reviewed the Socialist Emulation of the last quarter. In GDP per head no republic stands higher than ours, and the Transferable Red Banner for output per head passes to our republic. The workers' delegation brings it from Moscow tomorrow; the banner hangs in our House of Government until another republic takes it from us.\n\nBonus while we hold it: consumer goods §G-2%§!, twice as much once the Union has adopted §YSocialist Emulation§!."
 COLDWAR_SOV.164.a:0 "We will not give it up."
 COLDWAR_SOV.165.t:0 "The Red Banner for the Plan"
 COLDWAR_SOV.165.d:0 "The Central Committee has reviewed the Socialist Emulation of the last quarter. In annual targets of the Union Plan fulfilled in this Five-Year Plan no republic stands higher than ours, and the Transferable Red Banner for the plan passes to our republic. The workers' delegation brings it from Moscow tomorrow; the banner hangs in our House of Government until another republic takes it from us.\n\nBonus while we hold it: stability §G+3%§!, political power gain §G+5%§!, twice as much once the Union has adopted §YSocialist Emulation§!."
 COLDWAR_SOV.165.a:0 "We will not give it up."
 COLDWAR_SOV.166.t:0 "The Red Banner for Growth Passes On"
 COLDWAR_SOV.166.d:0 "The banner passes to another republic."
 COLDWAR_SOV.166.a:0 "Pass it on."
 COLDWAR_SOV.167.t:0 "The Red Banner for Industry Passes On"
 COLDWAR_SOV.167.d:0 "The banner passes to another republic."
 COLDWAR_SOV.167.a:0 "Pass it on."
 COLDWAR_SOV.168.t:0 "The Red Banner for Output per Head Passes On"
 COLDWAR_SOV.168.d:0 "The banner passes to another republic."
 COLDWAR_SOV.168.a:0 "Pass it on."
 COLDWAR_SOV.169.t:0 "The Red Banner for the Plan Passes On"
 COLDWAR_SOV.169.d:0 "The banner passes to another republic."
 COLDWAR_SOV.169.a:0 "Pass it on."
 COLDWAR_SOV.170.t:0 "[COLDWAR_SOV_pb_GetSpEdition]"
 COLDWAR_SOV.170.d:0 "The Committee for Physical Culture and Sport has announced the dates: this summer the best athletes of every republic meet in Luzhniki for the [COLDWAR_SOV_pb_GetSpEdition]. For three months the republics prepare their teams - in the gyms, on new stadiums, and, some say, in the laboratories.\n\n§YEvery republic prepares its team in the decisions of The Politburo of the CPSU.§!"
 COLDWAR_SOV.170.a:0 "Our athletes will be ready."
 COLDWAR_SOV.170.b:0 "Faster, higher, stronger - and Soviet."
 COLDWAR_SOV.171.t:0 "The Closing of the [COLDWAR_SOV_pb_GetSpEdition]"
 COLDWAR_SOV.171.d:0 "The flame in Luzhniki has gone out. In the table of the Union republics:\n\n  Gold: §Y[?global.COLDWAR_SOV_pb_sp_gold.GetNameDef]§!\n  Silver: §Y[?global.COLDWAR_SOV_pb_sp_silver.GetNameDef]§!\n  Bronze: §Y[?global.COLDWAR_SOV_pb_sp_bronze.GetNameDef]§!\n\nThe Central Committee congratulates the athletes of all fifteen republics: the games have shown the friendship of the peoples of the Union."
 COLDWAR_SOV.171.a:0 "Glory to Soviet sport!"
 COLDWAR_SOV.172.t:0 "Champions of the Spartakiad"
 COLDWAR_SOV.172.d:0 "Our athletes have won the table of the Spartakiad of the Peoples of the USSR. The team returns to a parade in the capital of our republic."
 COLDWAR_SOV.172.a:0 "Champions!"
 COLDWAR_SOV.173.t:0 "A Doping Scandal"
 COLDWAR_SOV.173.d:0 "The control commission of the sports committee has found what our team doctors were giving the athletes. Moscow speaks of a disgrace for Soviet sport, and the points our team had earned with the special preparation are struck from the record."
 COLDWAR_SOV.173.a:0 "Blame the doctors."
 COLDWAR_SOV.174.t:0 "Silver at the Spartakiad"
 COLDWAR_SOV.174.d:0 "Our athletes finished second among the Union republics at the Spartakiad. A fine result - next time, gold."
 COLDWAR_SOV.174.a:0 "Well done."
 COLDWAR_SOV.175.t:0 "Bronze at the Spartakiad"
 COLDWAR_SOV.175.d:0 "Our athletes finished third among the Union republics at the Spartakiad and bring medals home."
 COLDWAR_SOV.175.a:0 "A place on the podium."
 COLDWAR_SOV.176.t:0 "Moscow's Favourite"
 COLDWAR_SOV.176.d:0 "The General Secretary has let it be known: this year our republic is the example for the Union. Pravda prints our figures on its front page, Gosplan answers our letters at once - and every other First Secretary has noticed."
 COLDWAR_SOV.176.a:0 "Moscow knows its friends."
 COLDWAR_SOV.177.t:0 "Moscow Has a Favourite"
 COLDWAR_SOV.177.d:0 "Pravda calls [?global.COLDWAR_SOV_pb_favourite.GetNameDef] 'an example for the whole Union', and the General Secretary has praised its First Secretary by name. For a year Moscow's favourite counts three places better in the Socialist Emulation."
 COLDWAR_SOV.177.a:0 "Some republics are more equal than others."
 COLDWAR_SOV.177.b:0 "The republics will understand."
 COLDWAR_SOV.178.t:0 "Disqualified"
 COLDWAR_SOV.178.d:0 "Our honours are withdrawn."
 COLDWAR_SOV.178.a:0 "Hand them back."
 COLDWAR_SOV.179.t:0 "Socialist Emulation"
 COLDWAR_SOV.179.d:0 "The banners carry their new rank."
 COLDWAR_SOV.179.a:0 "Raise them."
 COLDWAR_SOV.180.t:0 "The V Spartakiad Is Announced"
 COLDWAR_SOV.180.d:0 "Preparations open."
 COLDWAR_SOV.180.a:0 "Open."
 COLDWAR_SOV.181.t:0 "The VI Spartakiad Is Announced"
 COLDWAR_SOV.181.d:0 "Preparations open."
 COLDWAR_SOV.181.a:0 "Open."
 COLDWAR_SOV.182.t:0 "The VII Spartakiad Is Announced"
 COLDWAR_SOV.182.d:0 "Preparations open."
 COLDWAR_SOV.182.a:0 "Open."
 COLDWAR_SOV.183.t:0 "The VIII Spartakiad Is Announced"
 COLDWAR_SOV.183.d:0 "Preparations open."
 COLDWAR_SOV.183.a:0 "Open."
 COLDWAR_SOV.184.t:0 "The IX Spartakiad Is Announced"
 COLDWAR_SOV.184.d:0 "Preparations open."
 COLDWAR_SOV.184.a:0 "Open."
 COLDWAR_SOV.185.t:0 "The V Spartakiad"
 COLDWAR_SOV.185.d:0 "The games are held."
 COLDWAR_SOV.185.a:0 "Hold them."
 COLDWAR_SOV.186.t:0 "The VI Spartakiad"
 COLDWAR_SOV.186.d:0 "The games are held."
 COLDWAR_SOV.186.a:0 "Hold them."
 COLDWAR_SOV.187.t:0 "The VII Spartakiad"
 COLDWAR_SOV.187.d:0 "The games are held."
 COLDWAR_SOV.187.a:0 "Hold them."
 COLDWAR_SOV.188.t:0 "The VIII Spartakiad"
 COLDWAR_SOV.188.d:0 "The games are held."
 COLDWAR_SOV.188.a:0 "Hold them."
 COLDWAR_SOV.189.t:0 "The IX Spartakiad"
 COLDWAR_SOV.189.d:0 "The games are held."
 COLDWAR_SOV.189.a:0 "Hold them."
 COLDWAR_SOV.900.t:0 "[From.GetNameDefCap] Accepts"
 COLDWAR_SOV.900.d:0 "Our envoys report that [From.GetNameDef] has accepted our proposal. The agreed terms now take effect."
 COLDWAR_SOV.900.a:0 "Excellent."
 COLDWAR_SOV.901.t:0 "[From.GetNameDefCap] Declines"
 COLDWAR_SOV.901.d:0 "[From.GetNameDefCap] has turned down our proposal. We will have to find another way."
 COLDWAR_SOV.901.a:0 "Unfortunate."
 COLDWAR_SOV.100.t:0 "Gas for Pipes"
 COLDWAR_SOV.100.d:0 "Moscow proposes a deal without precedent: large-diameter steel pipes from Mannesmann, financed on credit by German banks, in exchange for Soviet natural gas delivered through the new trunk line from 1973 for twenty years. Industry is enthusiastic; Washington is not."
 COLDWAR_SOV.100.a:0 "Sign the pipeline deal."
 COLDWAR_SOV.100.b:0 "We must decline."
 COLDWAR_SOV.101.t:0 "Apollo-Soyuz"
 COLDWAR_SOV.101.d:0 "The Soviet Academy of Sciences proposes a joint flight: an American Apollo and a Soviet Soyuz would dock in orbit, and their crews would shake hands two hundred kilometres above the Earth. A docking module and common procedures would have to be developed together."
 COLDWAR_SOV.101.a:0 "Fly together."
 COLDWAR_SOV.101.b:0 "We must decline."
 COLDWAR_SOV.102.t:0 "A Supply Point in Tartus"
 COLDWAR_SOV.102.d:0 "The Soviet Mediterranean squadron needs a port. Moscow proposes a naval supply point in Tartus, in exchange for military aid and advisers."
 COLDWAR_SOV.102.a:0 "Grant the supply point."
 COLDWAR_SOV.102.b:0 "We must decline."
 COLDWAR_SOV.103.t:0 "Port Rights for the Soviet Navy"
 COLDWAR_SOV.103.d:0 "The Soviet Navy asks for the right to use our harbour as a supply point and anchorage. In return Moscow offers economic aid and protection."
 COLDWAR_SOV.103.a:0 "Grant the port rights."
 COLDWAR_SOV.103.b:0 "We must decline."
 COLDWAR_SOV.104.t:0 "The Moscow Treaty"
 COLDWAR_SOV.104.d:0 "The Soviet government offers the Federal Republic a treaty renouncing the use of force and recognising the existing frontiers in Europe, including the Oder-Neisse line and the inner German border. It would open the door to trade and to an agreement on Berlin."
 COLDWAR_SOV.104.a:0 "Sign the treaty."
 COLDWAR_SOV.104.b:0 "We must decline."
 COLDWAR_SOV.105.t:0 "The Four Power Agreement on Berlin"
 COLDWAR_SOV.105.d:0 "Moscow proposes to settle the Berlin question among the four powers: guaranteed transit between West Berlin and the Federal Republic, visits for West Berliners in the East, and an end to the crises that have haunted the divided city since 1948."
 COLDWAR_SOV.105.a:0 "Join the agreement."
 COLDWAR_SOV.105.b:0 "We must decline."
 COLDWAR_SOV.106.t:0 "SALT I and the ABM Treaty"
 COLDWAR_SOV.106.d:0 "After two and a half years of talks in Helsinki and Vienna the delegations have a text: a freeze on strategic missile launchers and a strict limit on anti-ballistic missile defences. Moscow is ready to sign."
 COLDWAR_SOV.106.a:0 "Sign the treaties."
 COLDWAR_SOV.106.b:0 "We must decline."
 COLDWAR_SOV.107.t:0 "Summit in Moscow"
 COLDWAR_SOV.107.d:0 "The Soviet leadership invites the President of the United States to Moscow. On the table: the Basic Principles of Relations, agreements on trade, health, the environment and space, and a common commitment to avoid confrontation."
 COLDWAR_SOV.107.a:0 "Travel to Moscow."
 COLDWAR_SOV.107.b:0 "We must decline."
 COLDWAR_SOV.108.t:0 "A Franco-Soviet Partnership"
 COLDWAR_SOV.108.d:0 "President Pompidou's Paris and Moscow share a mistrust of Anglo-American hegemony. The Soviet side proposes regular consultations and joint work in electronics, colour television and space research."
 COLDWAR_SOV.108.a:0 "Deepen the partnership."
 COLDWAR_SOV.108.b:0 "We must decline."
 COLDWAR_SOV.109.t:0 "The Vladivostok Accord"
 COLDWAR_SOV.109.d:0 "At an air base near Vladivostok the Soviet side proposes the framework for a second strategic arms treaty: an equal ceiling of 2,400 launchers each."
 COLDWAR_SOV.109.a:0 "Agree to the framework."
 COLDWAR_SOV.109.b:0 "We must decline."
 COLDWAR_SOV.110.t:0 "The Final Act of Helsinki"
 COLDWAR_SOV.110.d:0 "The Conference on Security and Cooperation in Europe has reached its conclusion. The Final Act recognises the inviolability of frontiers, opens trade and exchanges, and commits its signatories to respect human rights. Moscow asks us to sign."
 COLDWAR_SOV.110.a:0 "Sign the Final Act."
 COLDWAR_SOV.110.b:0 "We must decline."
 COLDWAR_SOV.111.t:0 "SALT II"
 COLDWAR_SOV.111.d:0 "In Vienna the General Secretary is ready to sign the second strategic arms limitation treaty. Ratification in the Senate will not be easy."
 COLDWAR_SOV.111.a:0 "Sign in Vienna."
 COLDWAR_SOV.111.b:0 "We must decline."
 COLDWAR_SOV.112.t:0 "Border Talks in Beijing"
 COLDWAR_SOV.112.d:0 "Since October 1969 Soviet and Chinese delegations have been meeting in Beijing. Moscow now proposes a practical step: an end to patrols in the disputed sectors and a hotline between the frontier commands."
 COLDWAR_SOV.112.a:0 "Agree to the measures."
 COLDWAR_SOV.112.b:0 "We must decline."
 COLDWAR_SOV.113.t:0 "The Mongolian Shield"
 COLDWAR_SOV.113.d:0 "The Soviet Union proposes to station the 39th Army in Mongolia. The garrison would protect the People's Republic against China; Moscow would pay for its upkeep and for new roads and barracks."
 COLDWAR_SOV.113.a:0 "Welcome the army."
 COLDWAR_SOV.113.b:0 "We must decline."
 COLDWAR_SOV.114.t:0 "Treaty of Peace, Friendship and Cooperation"
 COLDWAR_SOV.114.d:0 "Moscow offers New Delhi a twenty-year treaty: mutual consultations in case of a threat, Soviet arms on easy terms and a trade agreement in rupees."
 COLDWAR_SOV.114.a:0 "Sign the treaty."
 COLDWAR_SOV.114.b:0 "We must decline."
 COLDWAR_SOV.115.t:0 "A Treaty against Beijing"
 COLDWAR_SOV.115.d:0 "Moscow offers Hanoi a treaty of friendship and cooperation. The Soviet Pacific Fleet would use Cam Ranh Bay, and both sides would stand together against Chinese pressure."
 COLDWAR_SOV.115.a:0 "Sign the treaty."
 COLDWAR_SOV.115.b:0 "We must decline."
 COLDWAR_SOV.116.t:0 "An Ideological Truce"
 COLDWAR_SOV.116.d:0 "The Soviet leadership proposes to end the polemics: no more open letters, no more broadcasts against each other, and a return of the ambassadors. The question of the socialist camp would remain open, and with it Beijing's own choice of camp."
 COLDWAR_SOV.116.a:0 "End the polemics."
 COLDWAR_SOV.116.b:0 "We must decline."
 COLDWAR_SOV.117.t:0 "The Damansky Settlement"
 COLDWAR_SOV.117.d:0 "Moscow offers to draw the river frontier along the main navigation channel. Damansky Island, called Zhenbao by the Chinese, would belong to China, and the bloodiest dispute of 1969 would be closed."
 COLDWAR_SOV.117.a:0 "Accept the settlement."
 COLDWAR_SOV.117.b:0 "We must decline."
 COLDWAR_SOV.118.t:0 "The Soyuz Pipeline"
 COLDWAR_SOV.118.d:0 "Comecon has decided on its largest joint project: a gas pipeline from Orenburg to the western border of the Soviet Union. Every member is asked to contribute workers, money and machinery, and will receive gas for decades in return."
 COLDWAR_SOV.118.a:0 "Join the project."
 COLDWAR_SOV.118.b:0 "We must decline."
 COLDWAR_SOV.119.t:0 "Shield and Brotherhood in Arms"
 COLDWAR_SOV.119.d:0 "The High Command of the Warsaw Pact invites our army to the joint manoeuvres of this year."
 COLDWAR_SOV.119.a:0 "Send our divisions."
 COLDWAR_SOV.119.b:0 "We must decline."
 COLDWAR_SOV.120.t:0 "Credits for Gierek"
 COLDWAR_SOV.120.d:0 "Moscow offers raw materials on credit, grain and a hard-currency loan to the new Polish leadership, so that the price increases that toppled Gomulka can be withdrawn."
 COLDWAR_SOV.120.a:0 "Accept the credits."
 COLDWAR_SOV.120.b:0 "We must decline."
 COLDWAR_SOV.121.t:0 "Interkosmos"
 COLDWAR_SOV.121.d:0 "Within the Interkosmos programme a cosmonaut from our country is offered a seat on a Soviet Soyuz. The whole nation would watch the launch from Baikonur."
 COLDWAR_SOV.121.a:0 "Send our cosmonaut."
 COLDWAR_SOV.121.b:0 "We must decline."
 COLDWAR_SOV.122.t:0 "Operation Kavkaz"
 COLDWAR_SOV.122.d:0 "Moscow offers to send a complete air defence division with SA-3 batteries and MiG-21 squadrons flown by Soviet pilots to the Suez Canal. The deep-penetration raids of the Israeli air force would end."
 COLDWAR_SOV.122.a:0 "Accept the division."
 COLDWAR_SOV.122.b:0 "We must decline."
 COLDWAR_SOV.123.t:0 "A Treaty of Friendship with Egypt"
 COLDWAR_SOV.123.d:0 "Moscow offers Cairo a fifteen-year treaty of friendship and cooperation: consultations, arms and economic aid."
 COLDWAR_SOV.123.a:0 "Sign the treaty."
 COLDWAR_SOV.123.b:0 "We must decline."
 COLDWAR_SOV.124.t:0 "Arms for Hanoi"
 COLDWAR_SOV.124.d:0 "Surface-to-air missiles, MiG fighters, trucks and rice: Moscow offers a new aid package for the war against the Americans and their allies."
 COLDWAR_SOV.124.a:0 "Accept the aid."
 COLDWAR_SOV.124.b:0 "We must decline."
 COLDWAR_SOV.125.t:0 "Oil for Sugar"
 COLDWAR_SOV.125.d:0 "Moscow offers a long-term exchange at preferential prices: Soviet oil for Cuban sugar, well above the world market price for the sugar."
 COLDWAR_SOV.125.a:0 "Accept the exchange."
 COLDWAR_SOV.125.b:0 "We must decline."
 COLDWAR_SOV.126.t:0 "A Treaty of Friendship with Iraq"
 COLDWAR_SOV.126.d:0 "Moscow offers Baghdad a treaty of friendship and cooperation, with Soviet help for the national oil industry after the nationalisation of the IPC."
 COLDWAR_SOV.126.a:0 "Sign the treaty."
 COLDWAR_SOV.126.b:0 "We must decline."
 COLDWAR_SOV.127.t:0 "An Arms Package for Syria"
 COLDWAR_SOV.127.d:0 "Tanks, artillery and air defence missiles, delivered with Soviet advisers to train the Syrian army."
 COLDWAR_SOV.127.a:0 "Accept the package."
 COLDWAR_SOV.127.b:0 "We must decline."
 COLDWAR_SOV.128.t:0 "Support for the MPLA"
 COLDWAR_SOV.128.d:0 "Moscow offers weapons, transport aircraft and coordination with the Cuban expeditionary force against the FNLA, UNITA and their foreign backers."
 COLDWAR_SOV.128.a:0 "Accept the support."
 COLDWAR_SOV.128.b:0 "We must decline."
 COLDWAR_SOV.129.t:0 "An Airlift to Addis Ababa"
 COLDWAR_SOV.129.d:0 "An air bridge of Antonovs and Ilyushins, Soviet generals and Cuban brigades are offered to the Derg against the Somali invasion."
 COLDWAR_SOV.129.a:0 "Accept the airlift."
 COLDWAR_SOV.129.b:0 "We must decline."
 COLDWAR_SOV.130.t:0 "Arms for Somalia"
 COLDWAR_SOV.130.d:0 "Moscow offers weapons and advisers for the Somali army, on condition that the naval facilities in Berbera remain at the disposal of the Soviet fleet."
 COLDWAR_SOV.130.a:0 "Accept the offer."
 COLDWAR_SOV.130.b:0 "We must decline."
 COLDWAR_SOV.131.t:0 "The Limited Contingent"
 COLDWAR_SOV.131.d:0 "The Soviet leadership is ready to answer the repeated requests of the Afghan government: a limited contingent of Soviet troops would secure the cities and the roads against the insurgency. The decision lies with Kabul."
 COLDWAR_SOV.131.a:0 "Request the troops."
 COLDWAR_SOV.131.b:0 "We must decline."
 COLDWAR_SOV.132.t:0 "The Prevention of Nuclear War"
 COLDWAR_SOV.132.d:0 "During his visit to the United States the General Secretary proposes an agreement on the prevention of nuclear war: both powers would consult each other whenever a crisis threatens to escalate."
 COLDWAR_SOV.132.a:0 "Sign the agreement."
 COLDWAR_SOV.132.b:0 "We must decline."
 COLDWAR_SOV.133.t:0 "Long-Term Gas Contracts"
 COLDWAR_SOV.133.d:0 "The Soviet Ministry of Gas Industry offers long-term supply contracts at stable prices. The gas would come from Siberia through the new export lines; payment would be in hard currency and machinery."
 COLDWAR_SOV.133.a:0 "Sign the contract."
 COLDWAR_SOV.133.b:0 "We must decline."
 COLDWAR_SOV.134.t:0 "A Summit with the Premier"
 COLDWAR_SOV.134.d:0 "Premier Kosygin proposes a summit in the spirit of Glassboro: talks on arms, trade and the conflicts of the Third World, without the ceremonies of a state visit."
 COLDWAR_SOV.134.a:0 "Meet the Premier."
 COLDWAR_SOV.134.b:0 "We must decline."
 COLDWAR_SOV.135.t:0 "Two Camps of the Pure Line"
 COLDWAR_SOV.135.d:0 "The new General Secretary proposes talks between two parties that both reject revisionism. The border commands would stand down their alert."
 COLDWAR_SOV.135.a:0 "Open the talks."
 COLDWAR_SOV.135.b:0 "We must decline."
 COLDWAR_SOV.136.t:0 "Resuming the Consultations"
 COLDWAR_SOV.136.d:0 "Moscow proposes to resume the consultations between the deputy foreign ministers, suspended since the invasion of Afghanistan."
 COLDWAR_SOV.136.a:0 "Resume the consultations."
 COLDWAR_SOV.136.b:0 "We must decline."
 COLDWAR_SOV.137.t:0 "Soviet Military Advisers"
 COLDWAR_SOV.137.d:0 "The Ministry of Defence of the USSR offers to send military advisers and to train our officers at Soviet academies."
 COLDWAR_SOV.137.a:0 "Accept the advisers."
 COLDWAR_SOV.137.b:0 "We must decline."
 COLDWAR_SOV.138.t:0 "New Talks in Geneva"
 COLDWAR_SOV.138.d:0 "Moscow proposes to resume the talks on strategic and intermediate-range weapons that broke off over the Euromissiles."
 COLDWAR_SOV.138.a:0 "Return to Geneva."
 COLDWAR_SOV.138.b:0 "We must decline."
 COLDWAR_SOV.139.t:0 "The Zero Option"
 COLDWAR_SOV.139.d:0 "The General Secretary accepts what Moscow rejected for years: the destruction of all intermediate-range nuclear missiles in Europe, verified by inspectors of both sides."
 COLDWAR_SOV.139.a:0 "Sign the INF Treaty."
 COLDWAR_SOV.139.b:0 "We must decline."
 COLDWAR_SOV.140.t:0 "Back to the Pure Line"
 COLDWAR_SOV.140.d:0 "The new leadership in Moscow has repudiated de-Stalinisation. It proposes a joint return to the line of Lenin and Stalin and an end to the split of 1960."
 COLDWAR_SOV.140.a:0 "Restore the friendship."
 COLDWAR_SOV.140.b:0 "We must decline."
 COLDWAR_SOV.141.t:0 "A Pragmatic Opening"
 COLDWAR_SOV.141.d:0 "The leaders in Moscow and Beijing both rule without ideology now. A pragmatic rapprochement is proposed: trade, border crossings and quiet frontiers."
 COLDWAR_SOV.141.a:0 "Accept the opening."
 COLDWAR_SOV.141.b:0 "We must decline."
 COLDWAR_SOV.142.t:0 "Relaxing the Export Controls"
 COLDWAR_SOV.142.d:0 "Moscow asks Washington to relax the CoCom lists that bar Western computers and machine tools from the socialist countries, in exchange for political concessions and an end to the arms race."
 COLDWAR_SOV.142.a:0 "Relax the controls."
 COLDWAR_SOV.142.b:0 "We must decline."
 COLDWAR_SOV.143.t:0 "The Convergence Treaty"
 COLDWAR_SOV.143.d:0 "In the spirit of Sakharov's vision the new Soviet government proposes a treaty of joint disarmament and scientific cooperation: the two systems would meet halfway instead of preparing to destroy each other."
 COLDWAR_SOV.143.a:0 "Sign the treaty."
 COLDWAR_SOV.143.b:0 "We must decline."
 COLDWAR_SOV.144.t:0 "A Social Democratic Partnership"
 COLDWAR_SOV.144.d:0 "The new Soviet leadership speaks the language of European social democracy. It proposes party contacts, cultural exchange and a trade agreement between our governments."
 COLDWAR_SOV.144.a:0 "Accept the partnership."
 COLDWAR_SOV.144.b:0 "We must decline."
 COLDWAR_SOV.145.t:0 "The Slavic Union"
 COLDWAR_SOV.145.d:0 "The new government in Moscow proposes a union of the three East Slavic peoples and Kazakhstan. Our republic would remain in the Union with broader autonomy and an equal voice."
 COLDWAR_SOV.145.a:0 "Join the Slavic Union."
 COLDWAR_SOV.145.b:0 "We will go our own way."
 COLDWAR_SOV.146.t:0 "A Closer Union of the East Slavs"
 COLDWAR_SOV.146.d:0 "Moscow proposes a closer union of Russians, Ukrainians and Belarusians within the Soviet state. Our autonomy would stay as it is."
 COLDWAR_SOV.146.a:0 "Accept the closer union."
 COLDWAR_SOV.146.b:0 "We must decline."
 COLDWAR_SOV.147.t:0 "The Romanovs Return"
 COLDWAR_SOV.147.d:0 "The restored Russian crown asks the royal houses of Europe for recognition. A Romanov on the throne in Moscow, the Soviet era over: the courts of Europe must decide how to receive their long-lost cousin."
 COLDWAR_SOV.147.a:0 "Recognise the crown."
 COLDWAR_SOV.147.b:0 "We must decline."
