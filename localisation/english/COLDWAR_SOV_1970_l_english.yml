# IMPERIA CW — Cold War: SOV 1970 — English localisation.
 # COLDWAR | Soviet Union 1970 (focus tree, Politburo of the Republics, ideas, events, decisions). Generated - edit the generator.
 COLDWAR_SOV_tenth_plan_tt:0 "The §YTenth Five-Year Plan§! (1976-1980), the 'plan of efficiency and quality', opens a new priority choice in §YFive-Year Plans§!."
 COLDWAR_SOV_bam_supply_tt:0 "Supply in the Far East improves for the §YChinese Question§!."
 COLDWAR_SOV_clergy_faction_tt:0 "The §YMoscow Patriarchate§! becomes an internal faction."
 COLDWAR_SOV_oligarch_faction_tt:0 "The §Yshadow economy§! becomes an internal faction."
 COLDWAR_SOV_amur_bunkers_tt:0 "Bunkers along the border of §YPrimorye§! and §YKhabarovsk§!, each paid with §R0.2%§! of GDP."
 COLDWAR_SOV_lop_nur_wargoal_tt:0 "We gain a wargoal against §YChina§!. Whether to strike remains our decision."
 COLDWAR_SOV_mod_supply_consumption_factor_tt:0 "Supply Consumption: $RIGHT|-=%1$"
 COLDWAR_SOV_comprehensive_programme_tt:0 "The Cold War decision §YComecon Integration Programme§! refunds §G25§! of its political power cost."
 COLDWAR_SOV_world_market_prices_tt:0 "Every Comecon partner (§YDDR, Poland, Czechoslovakia, Hungary, Romania, Bulgaria§!) thinks less of us (§R-10§!)."
 COLDWAR_SOV_federal_union_tt:0 "In the Politburo the republican seats count §Ytwice§! on Union questions (language, Union treaty, proposals of the republics)."
 COLDWAR_SOV_treaty_signer_tt:0 "The friendship treaties with §YEgypt§!, §YIraq§! and §YIndia§! each refund §G25§! political power."
 COLDWAR_SOV_local_barons_tt:0 "Politburo seats can only change at a §YParty Congress§! (no extraordinary plenum). Kompromat chance §G-10%§!."
 COLDWAR_SOV_rotate_cadres_tt:0 "At every §YParty Congress§! at least one republican seat must change hands."
 COLDWAR_SOV_free_dismissal_tt:0 "Once, we may remove a republican seat holder without the cost of an extraordinary plenum."
 COLDWAR_SOV_discipline_campaign_tt:0 "Kompromat chance §G+20%§!. The §YKGB§! may investigate a seat holder without an accuser (50 PP)."
 COLDWAR_SOV_cotton_affair_all_tt:0 "Every republic that has falsified its plan reports (§Ypripiski§!) is investigated at once."
 COLDWAR_SOV_iron_discipline_tt:0 "A republic that falsifies its plan report loses §R3%§! stability."
 COLDWAR_SOV_afghan_withdrawal_tt:0 "If §YThe Afghan Burden§! is active, we offer the Afghan government a plan for our withdrawal."
 COLDWAR_SOV_afghan_withdrawal_gor_tt:0 "§YThe Afghan Burden§! ends; the Afghan government receives our withdrawal plan."
 COLDWAR_SOV_republic_offer_independence_tt:0 "Every Union republic is offered §Yindependence§!. Each republic decides for itself."
 COLDWAR_SOV_republic_offer_secession_tt:0 "The Union republics are offered the §Yright to secede§!. Each republic decides for itself."
 COLDWAR_SOV_republic_offer_release_tt:0 "The Baltic, Caucasian and Central Asian republics are offered §Yindependence§!. Each decides for itself."
 COLDWAR_SOV_republic_offer_treaty_tt:0 "Every Union republic is offered the §YNew Union Treaty§!: more autonomy, no one is forced to leave."
 COLDWAR_SOV_harvest_1972_tt:0 "Drought and frost: the grain harvest falls §R13%§! short of the plan."
 COLDWAR_SOV_tt_soviet_bloc:0 "We belong to the §YSoviet bloc§! (Cold War alignment)"
 COLDWAR_SOV_kremlin_doctors_tt:0 "The Kremlin doctors keep §YBrezhnev§! alive: his death comes up to §Ytwo years§! later than history recorded."
 COLDWAR_SOV_shortcut_politics:0 "The Collective Leadership"
 COLDWAR_SOV_shortcut_politburo:0 "The Politburo and the General Secretaries"
