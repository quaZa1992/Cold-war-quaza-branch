 COLDWAR_SOV_pb_emu_growth_tt:0 "Economic growth: the leading republic by GDP growth in the last quarter.\n\n§YSocialist Emulation§!: every month Moscow ranks the Union republics by growth, industry, output per head and the fulfilled targets of the Union Plan, using the figures the republics report.\n\n§YEvery quarter§! a §YTransferable Red Banner§! goes to the leader of each column (the holder keeps it on a tie):\n  Growth: construction speed §G+5%§!\n  Industry: factory output §G+3%§!\n  Output per Head: consumer goods §G-2%§!\n  the Plan: stability §G+3%§!, political power gain §G+5%§!\n§YSocialist Emulation§! (Union tree) doubles the banners.\n\n§YEvery January§! the best republic overall becomes the §YPride of the Union§! for a year: stability §G+5%§!, political power gain §G+10%§!, construction speed §G+10%§!, consumer goods §G-5%§!.\nA second title in a row: §YHero of Socialist Labour§! instead (stability §G+5%§!, political power gain §G+10%§!, construction speed §G+15%§!, consumer goods §G-5%§!, factory output §G+5%§!) and the Gold Star for the First Secretary.\nThree titles in one Five-Year Plan: the §YOrder of Lenin§! for as long as the republic stays in the Union (stability §G+3%§!, political power gain §G+5%§!, construction speed §G+5%§!, factory output §G+3%§!).\nThe last republic is §RLagging Behind§! for a year (stability §R-3%§!, political power gain §R-5%§!, investigations +10%).\n\nHolders of the Order of Lenin:[COLDWAR_SOV_pb_GetOrderList]"
