 COLDWAR_SOV_banner_growth:0 "Red Banner: Growth"
 COLDWAR_SOV_banner_growth_desc:0 "Every quarter the Central Committee hands its Transferable Red Banner for GDP growth in the last quarter to the republic that leads the Socialist Emulation. This quarter it hangs in our House of Government."
 COLDWAR_SOV_banner_growth_2:0 "Red Banner: Growth (Socialist Emulation)"
 COLDWAR_SOV_banner_growth_2_desc:0 "Every quarter the Central Committee hands its Transferable Red Banner for GDP growth in the last quarter to the republic that leads the Socialist Emulation. This quarter it hangs in our House of Government."
 COLDWAR_SOV_banner_industry:0 "Red Banner: Industry"
 COLDWAR_SOV_banner_industry_desc:0 "Every quarter the Central Committee hands its Transferable Red Banner for civilian and military factories to the republic that leads the Socialist Emulation. This quarter it hangs in our House of Government."
 COLDWAR_SOV_banner_industry_2:0 "Red Banner: Industry (Socialist Emulation)"
 COLDWAR_SOV_banner_industry_2_desc:0 "Every quarter the Central Committee hands its Transferable Red Banner for civilian and military factories to the republic that leads the Socialist Emulation. This quarter it hangs in our House of Government."
 COLDWAR_SOV_banner_output:0 "Red Banner: Output per Head"
 COLDWAR_SOV_banner_output_desc:0 "Every quarter the Central Committee hands its Transferable Red Banner for GDP per head to the republic that leads the Socialist Emulation. This quarter it hangs in our House of Government."
 COLDWAR_SOV_banner_output_2:0 "Red Banner: Output per Head (Socialist Emulation)"
 COLDWAR_SOV_banner_output_2_desc:0 "Every quarter the Central Committee hands its Transferable Red Banner for GDP per head to the republic that leads the Socialist Emulation. This quarter it hangs in our House of Government."
 COLDWAR_SOV_banner_plan:0 "Red Banner: the Plan"
 COLDWAR_SOV_banner_plan_desc:0 "Every quarter the Central Committee hands its Transferable Red Banner for annual targets of the Union Plan fulfilled in this Five-Year Plan to the republic that leads the Socialist Emulation. This quarter it hangs in our House of Government."
 COLDWAR_SOV_banner_plan_2:0 "Red Banner: the Plan (Socialist Emulation)"
 COLDWAR_SOV_banner_plan_2_desc:0 "Every quarter the Central Committee hands its Transferable Red Banner for annual targets of the Union Plan fulfilled in this Five-Year Plan to the republic that leads the Socialist Emulation. This quarter it hangs in our House of Government."
 COLDWAR_SOV_pride_of_the_union:0 "Pride of the Union"
 COLDWAR_SOV_pride_of_the_union_desc:0 "No republic served the Union better last year. Pravda prints our First Secretary's portrait, and every factory wants to keep the title."
 COLDWAR_SOV_hero_of_socialist_labour:0 "Hero of Socialist Labour"
 COLDWAR_SOV_hero_of_socialist_labour_desc:0 "Two years in a row the best republic of the Union: our First Secretary wears the Gold Star of the Hammer and Sickle."
 COLDWAR_SOV_order_of_lenin:0 "The Order of Lenin"
 COLDWAR_SOV_order_of_lenin_desc:0 "Three times the best republic in one Five-Year Plan: the Order of Lenin is pinned to our republic's banner for as long as we remain in the Union."
 COLDWAR_SOV_lagging_behind:0 "Lagging Behind"
 COLDWAR_SOV_lagging_behind_desc:0 "Last in the Socialist Emulation. Pravda names us among the republics that lag behind, and Gosplan's inspectors read our figures twice."
 COLDWAR_SOV_spartakiad_champions:0 "Champions of the Spartakiad"
 COLDWAR_SOV_spartakiad_champions_desc:0 "Our athletes won the Spartakiad of the Peoples of the USSR. The medals are on show in every school of the republic."
 COLDWAR_SOV_doping_scandal:0 "A Doping Scandal"
 COLDWAR_SOV_doping_scandal_desc:0 "The doctors of our team have been caught. The sports committee in Moscow speaks of a disgrace for Soviet sport."
