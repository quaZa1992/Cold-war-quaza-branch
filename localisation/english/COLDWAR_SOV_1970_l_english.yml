 COLDWAR_SOV_pride_of_the_union:0 "Pride of the Union"
 COLDWAR_SOV_pride_of_the_union_desc:0 "No republic served the Union better last year. Pravda prints our First Secretary's portrait, and every factory wants to keep the title."
 COLDWAR_SOV_hero_of_socialist_labour:0 "Hero of Socialist Labour"
 COLDWAR_SOV_hero_of_socialist_labour_desc:0 "Two years in a row the best republic of the Union: our First Secretary wears the Gold Star of the Hammer and Sickle."
 COLDWAR_SOV_order_of_lenin:0 "The Order of Lenin"
 COLDWAR_SOV_order_of_lenin_desc:0 "Three times the best republic in one Five-Year Plan: the Order of Lenin is pinned to our republic's banner for as long as we remain in the Union."
 COLDWAR_SOV_lagging_behind:0 "Lagging Behind"
 COLDWAR_SOV_lagging_behind_desc:0 "Last in the Socialist Emulation. Pravda names us among the republics that lag behind, and Gosplan's inspectors read our figures twice."
