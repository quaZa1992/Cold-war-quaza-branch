 COLDWAR_EGY_1970_recall_ahmad_ismail_desc:0 "Ahmad Ismail Ali was dismissed in September 1969. Recall him after May 1971."
 COLDWAR_EGY_1970_recall_zikri_desc:0 "Abou Zikry left naval command in September 1969. Recall him from October 1972."
