l_english:
# IMPERIA CW — Cold War: EGY 1970 parties — English localisation.
 COLDWAR_EGY_1970_party_0:0 "£COLDWAR_EGY_1970_party_0 (NDP) - National Democratic Party"
 COLDWAR_EGY_1970_party_0_icon:0 "£COLDWAR_EGY_1970_party_0"
 COLDWAR_EGY_1970_party_0_desc:0 "(Developmental Authoritarianism) - National Democratic Party (Arabic: Al-Hizb al-Watani al-Dimuqrati, NDP)\n\nAnwar Sadat, one of the original Free Officers, long-serving speaker of the National Assembly and vice-president since December 1969, stands at the head of a current within the regime that would loosen the state's grip on the economy and seek an opening toward the West.\n\nIts vision is a ruling party of the centre, combining presidential authority with controlled pluralism, private investment and a negotiated recovery of Sinai with American help. For now it can only grow inside the Arab Socialist Union, but it is ready to emerge as the party of power."
 COLDWAR_EGY_1970_party_1:0 "£COLDWAR_EGY_1970_party_1 Conservative Party"
 COLDWAR_EGY_1970_party_1_icon:0 "£COLDWAR_EGY_1970_party_1"
 COLDWAR_EGY_1970_party_1_desc:0 "(Conservatism) - Conservative Party (Arabic: Hizb al-Muhafizin)\n\nZakaria Mohieddin, Free Officer, founder of Egypt's intelligence services and prime minister in 1965–66, withdrew from public life in 1968 after disagreeing with Nasser over economic policy. On 9 June 1967 Nasser had named him as his successor in his resignation speech.\n\nAround him gathers a conservative current that favours fiscal discipline, a larger role for private enterprise and better relations with the United States. Its supporters believe Egypt cannot afford dependence on the Soviet Union and endless war, and that order and prosperity must come before revolutionary slogans."
 COLDWAR_EGY_1970_party_2:0 "£COLDWAR_EGY_1970_party_2 Free Egyptians Party"
 COLDWAR_EGY_1970_party_2_icon:0 "£COLDWAR_EGY_1970_party_2"
 COLDWAR_EGY_1970_party_2_desc:0 "(Liberalism) - Free Egyptians Party (Arabic: Hizb al-Misriyyin al-Ahrar)\n\nOsman Ahmed Osman, the engineer whose Arab Contractors company built much of the Aswan High Dam, is living proof that Egyptian enterprise can flourish even under Arab socialism. Though his firm was nationalized in 1961, he still directs it and its tens of thousands of workers across the Arab world.\n\nA liberal current around him calls for civil liberties, a secular state and a market economy open to Arab and Western capital. It speaks for engineers, professionals and Copts who want Egypt to rejoin the modern world, and it waits for the regime's grip to loosen."
 COLDWAR_EGY_1970_party_3:0 "£COLDWAR_EGY_1970_party_3 (ESDP) - Egyptian Social Democratic Party"
 COLDWAR_EGY_1970_party_3_icon:0 "£COLDWAR_EGY_1970_party_3"
 COLDWAR_EGY_1970_party_3_desc:0 "(Social Democracy) - Egyptian Social Democratic Party (Arabic: Al-Hizb al-Misri al-Dimuqrati al-Ijtima'i, ESDP)\n\nIbrahim Shukri, wounded as a student in the nationalist demonstrations of 1935 and elected to parliament in 1950 for Ahmed Hussein's Socialist Party, has become a respected administrator and agrarian reformer within the Nasserist state.\n\nThe current around him favours parliamentary government, land reform and social welfare within a mixed economy. It hopes to turn the single party into a genuine multiparty democracy in which a moderate left can compete openly, without sacrificing the social gains of the revolution."
 COLDWAR_EGY_1970_party_4:0 "£COLDWAR_EGY_1970_party_4 (ECP) - Egyptian Communist Party"
 COLDWAR_EGY_1970_party_4_icon:0 "£COLDWAR_EGY_1970_party_4"
 COLDWAR_EGY_1970_party_4_desc:0 "(Marxism-Leninism) - Egyptian Communist Party (Arabic: Al-Hizb al-Shuyu'i al-Misri, ECP)\n\nEgypt's communists dissolved their organizations in 1965 after years in Nasser's prisons and entered the Arab Socialist Union as individuals. Many now hold posts in its Vanguard Organization, the press and the cultural institutions, but a minority regard the dissolution as a historic mistake.\n\nKhaled Mohieddin, the 'Red Major' of the Free Officers and a former member of the communist movement HADITU, is the best-known figure who could rally a reborn party. Such a party would push for deeper socialism, a closer alliance with Moscow and workers' control of the nationalized industries."
 COLDWAR_EGY_1970_party_5:0 "£COLDWAR_EGY_1970_party_5 Revolutionary Socialists"
 COLDWAR_EGY_1970_party_5_icon:0 "£COLDWAR_EGY_1970_party_5"
 COLDWAR_EGY_1970_party_5_desc:0 "(Trotskyism) - Revolutionary Socialists (Arabic: Al-Ishtirakiyyun al-Thawriyyun)\n\nHenri Curiel, the Cairo-born founder of the Democratic Movement for National Liberation, has lived in exile since 1950. From Paris he runs a network that aids anti-colonial movements from Algeria to South Africa and keeps up contacts with Egyptian leftists.\n\nA revolutionary current inspired by him and by the student and worker protests of February 1968 rejects both the bureaucratic state socialism of the ASU and the Moscow line. It calls for independent workers' councils, student power and an internationalist struggle against imperialism."
 COLDWAR_EGY_1970_party_6:0 "£COLDWAR_EGY_1970_party_6 (Karama) - Dignity Party"
 COLDWAR_EGY_1970_party_6_icon:0 "£COLDWAR_EGY_1970_party_6"
 COLDWAR_EGY_1970_party_6_desc:0 "(Popular Nasserism) - Dignity Party (Arabic: Hizb al-Karama)\n\nHussein el-Shafei, cavalry officer, Free Officer and vice-president, is among the most loyal of Nasser's companions. Devout yet devoted to the revolution, he embodies the popular, nationalist and religious face of the regime.\n\nThe Dignity current he could lead speaks for peasants, workers and the urban poor, promising social justice, Arab unity and uncompromising resistance to Israel. It distrusts the new state bourgeoisie and talk of an opening to the West, and seeks to keep the revolution's promises to the common people."
 COLDWAR_EGY_1970_party_7:0 "£COLDWAR_EGY_1970_party_7 Arab Democratic Nasserist Party"
 COLDWAR_EGY_1970_party_7_icon:0 "£COLDWAR_EGY_1970_party_7"
 COLDWAR_EGY_1970_party_7_desc:0 "(Nasserist Authoritarianism) - Arab Democratic Nasserist Party (Arabic: Al-Hizb al-Arabi al-Dimuqrati al-Nasiri)\n\nAli Sabri, former prime minister and secretary-general of the Arab Socialist Union, leads the so-called centres of power that control the ASU apparatus, the Vanguard Organization and much of the security services. He is regarded as Moscow's favourite in Cairo.\n\nHis faction demands a disciplined single-party state built on the National Charter of 1962, state ownership of industry, a close alliance with the Soviet Union and total war to liberate Sinai. In a succession struggle, it would seek to rule through the party machine rather than the presidency."
 COLDWAR_EGY_1970_party_8:0 "£COLDWAR_EGY_1970_party_8 Shi'a Reform Party"
 COLDWAR_EGY_1970_party_8_icon:0 "£COLDWAR_EGY_1970_party_8"
 COLDWAR_EGY_1970_party_8_desc:0 "(Shia Reformism) - Shi'a Reform Party (Arabic: Hizb al-Islah al-Shi'i)\n\nEgypt has no Shia community of note, yet the Fatimid heritage of Cairo and Al-Azhar's own history leave their mark. In 1959 Sheikh Mahmud Shaltut, rector of Al-Azhar, declared Ja'fari Shia jurisprudence a legitimate school of Islam, a landmark of the movement for rapprochement between the sects.\n\nA small council of scholars and converts inspired by this rapprochement hopes to found a Shia reform party in Egypt. Its leadership is collective, for no single figure is prominent enough to head it, and it calls for religious tolerance, Islamic unity and social justice."
 COLDWAR_EGY_1970_party_9:0 "£COLDWAR_EGY_1970_party_9 Islamic Guardianship Party"
 COLDWAR_EGY_1970_party_9_icon:0 "£COLDWAR_EGY_1970_party_9"
 COLDWAR_EGY_1970_party_9_desc:0 "(Shia Theocracy) - Islamic Guardianship Party (Arabic: Hizb al-Wilaya al-Islamiyya)\n\nIn Najaf the exiled Ayatollah Ruhollah Khomeini has begun lecturing on Islamic government, arguing that the jurists must rule in the absence of the Hidden Imam. His ideas reach a few Egyptian students and admirers through Iraqi and Lebanese contacts.\n\nA council of Islamic jurists inspired by these lectures imagines a state led by religious scholars, with the law of God replacing both Arab socialism and the Western model. In Nasser's Egypt this is an underground dream with almost no followers, but its advocates believe the region is ripe for upheaval."
 COLDWAR_EGY_1970_party_10:0 "£COLDWAR_EGY_1970_party_10 (Al-Nour) - Party of the Light"
 COLDWAR_EGY_1970_party_10_icon:0 "£COLDWAR_EGY_1970_party_10"
 COLDWAR_EGY_1970_party_10_desc:0 "(Salafism) - Party of the Light (Arabic: Hizb al-Nur)\n\nSheikh Abd al-Razzaq Afifi, an Al-Azhar graduate and a leading figure of the Salafi society Ansar al-Sunna al-Muhammadiyya, has taught in Saudi Arabia since the 1950s and sits among its senior religious scholars. He is the bridge between Egyptian Salafism and the Saudi religious establishment.\n\nA Salafi party inspired by him would demand the application of sharia and the purification of worship from saint veneration and innovation, together with close ties to Saudi Arabia. It accepts any authority that rules by Islamic law, making it a natural ally of the conservative Arab monarchies against Arab socialism."
 COLDWAR_EGY_1970_party_11:0 "£COLDWAR_EGY_1970_party_11 Ansar Bayt al-Maqdis"
 COLDWAR_EGY_1970_party_11_icon:0 "£COLDWAR_EGY_1970_party_11"
 COLDWAR_EGY_1970_party_11_desc:0 "(Jihadism) - Supporters of Jerusalem (Arabic: Jama'at Ansar Bayt al-Maqdis)\n\nSince June 1967 Sinai has been under Israeli occupation, its Bedouin tribes caught between the Israeli army, Egyptian intelligence and the smuggling networks. Among a few radicalized young men, a call to holy war for Jerusalem begins to spread.\n\nThe Supporters of Jerusalem reject Nasser's secular nationalism as well as the Arab monarchies, aiming at a caliphate to be built through armed struggle. Led by a shadowy council of Sinai militants rather than a single emir, the group is tiny, but it feeds on defeat, occupation and despair."
 COLDWAR_EGY_1970_party_12:0 "£COLDWAR_EGY_1970_party_12 (MB) - Muslim Brotherhood"
 COLDWAR_EGY_1970_party_12_icon:0 "£COLDWAR_EGY_1970_party_12"
 COLDWAR_EGY_1970_party_12_desc:0 "(Political Islam) - Society of the Muslim Brothers (Arabic: Jama'at al-Ikhwan al-Muslimin, MB)\n\nFounded by Hassan al-Banna in Ismailia in 1928, the Society of the Muslim Brothers became the largest mass movement in Egypt before Nasser crushed it in 1954 and again in 1965. Sayyid Qutb, its most influential thinker, was hanged in August 1966, and thousands of members remain in prison.\n\nIts General Guide since 1951, the former judge Hassan al-Hudaybi, himself behind bars, upholds patient preaching against the radical temptation to declare Muslims unbelievers. Banned and scattered, the Brotherhood awaits the day it can return to public life and press for a state governed by Islamic law."
 COLDWAR_EGY_1970_party_13:0 "£COLDWAR_EGY_1970_party_13 Coptic Orthodox Church"
 COLDWAR_EGY_1970_party_13_icon:0 "£COLDWAR_EGY_1970_party_13"
 COLDWAR_EGY_1970_party_13_desc:0 "(Coptic Communalism) - Coptic Orthodox Church (Arabic: Al-Kanisa al-Qibtiyya al-Urthudhuksiyya)\n\nPope Cyril VI, a monk of deep piety, has led the Coptic Orthodox Church since 1959 and enjoys a close personal friendship with President Nasser. In June 1968 Nasser and Emperor Haile Selassie attended the consecration of the new Saint Mark's Cathedral in Abbasiya, built with state support.\n\nThe Church speaks for Egypt's millions of Copts, who seek security, fair access to public posts and freedom to build churches. Its political influence is quiet but real, and in a time of crisis it could rally the faithful behind a government that guarantees their place in the nation."
 COLDWAR_EGY_1970_party_14:0 "£COLDWAR_EGY_1970_party_14 (Wafd) - New Wafd Party"
 COLDWAR_EGY_1970_party_14_icon:0 "£COLDWAR_EGY_1970_party_14"
 COLDWAR_EGY_1970_party_14_desc:0 "(Liberal Nationalism) - New Wafd Party (Arabic: Hizb al-Wafd al-Jadid)\n\nFouad Serageddin, secretary-general of the Wafd and interior minister when British troops stormed the Ismailia police headquarters in January 1952, has lived in political isolation since the revolution dissolved all parties in 1953. His lands were sequestrated, but his prestige among the old elite endures.\n\nThe heirs of Saad Zaghloul's Wafd want a return to constitutional, multiparty government, the rule of law and a free economy. In 1970 they meet discreetly in the salons of Garden City and Zamalek, convinced that the single party of the revolution will not outlive its founder."
 COLDWAR_EGY_1970_party_15:0 "£COLDWAR_EGY_1970_party_15 Republican People's Party"
 COLDWAR_EGY_1970_party_15_icon:0 "£COLDWAR_EGY_1970_party_15"
 COLDWAR_EGY_1970_party_15_desc:0 "(Business Oligarchy) - Republican People's Party (Arabic: Hizb al-Sha'b al-Jumhuri)\n\nThe builders of the Aswan High Dam, the contractors and engineers of Osman Ahmed Osman's Arab Contractors, form a network of business power that even Arab socialism cannot do without. Osman himself enjoys close ties to Vice-President Sadat.\n\nA party built around this network would promise that a strong state and big private capital can rebuild Egypt together. It favours public works, housing, reconstruction of the Canal cities and partnership with Gulf investors, with government by managers rather than ideologues."
 COLDWAR_EGY_1970_party_16:0 "£COLDWAR_EGY_1970_party_16 Reform and Development Party"
 COLDWAR_EGY_1970_party_16_icon:0 "£COLDWAR_EGY_1970_party_16"
 COLDWAR_EGY_1970_party_16_desc:0 "(Economic Liberalism) - Reform and Development Party (Arabic: Hizb al-Islah wa al-Tanmiya)\n\nAbdel Aziz Hegazy, a professor of accounting and finance minister since 1968, is one of the regime's leading economists. He knows better than most how the cost of war, Soviet debts and an inefficient public sector are draining Egypt's treasury.\n\nThe reform current around him calls for budget discipline, decentralization, private and foreign investment and a rational administration. It does not reject the social gains of the revolution, but insists that Egypt must produce more and spend less if it is to survive."
 COLDWAR_EGY_1970_party_17:0 "£COLDWAR_EGY_1970_party_17 Egyptian Green Party"
 COLDWAR_EGY_1970_party_17_icon:0 "£COLDWAR_EGY_1970_party_17"
 COLDWAR_EGY_1970_party_17_desc:0 "(Green Politics) - Egyptian Green Party (Arabic: Hizb al-Khudr al-Misri)\n\nRushdi Said, Egypt's foremost geologist and head of its geological survey and mining authority, knows the land of Egypt better than any politician. He understands that the nearly completed Aswan High Dam, for all its benefits, will trap the Nile's silt and change the delta and its coast forever.\n\nEnvironmentalists around him argue that the Nile, the delta and the desert oases must be managed with science, not slogans. They call for careful land reclamation, protection of the coast and the antiquities, and planning for a population that already exceeds thirty million."
 COLDWAR_EGY_1970_party_18:0 "£COLDWAR_EGY_1970_party_18 (ASU) - Arab Socialist Union"
 COLDWAR_EGY_1970_party_18_icon:0 "£COLDWAR_EGY_1970_party_18"
 COLDWAR_EGY_1970_party_18_desc:0 "(Arab Socialism) - Arab Socialist Union (Arabic: Al-Ittihad al-Ishtiraki al-Arabi, ASU)\n\nFounded in 1962 under the National Charter, the Arab Socialist Union is Egypt's sole legal political organization, uniting workers, peasants, soldiers, intellectuals and national capitalists in an alliance of the working forces of the people. President Gamal Abdel Nasser stands at its head.\n\nSince the defeat of June 1967 Nasser has rebuilt the army, waged the War of Attrition along the Suez Canal and promised reform through the March 30 Programme of 1968. With the president's health failing, Vice-President Anwar Sadat stands first in line to succeed him at the head of the state and the union."
 COLDWAR_EGY_1970_party_19:0 "£COLDWAR_EGY_1970_party_19 (Tagammu) - National Progressive Unionist Party"
 COLDWAR_EGY_1970_party_19_icon:0 "£COLDWAR_EGY_1970_party_19"
 COLDWAR_EGY_1970_party_19_desc:0 "(Independent Socialism) - National Progressive Unionist Party (Arabic: Hizb al-Tagammu al-Watani al-Taqaddumi al-Wahdawi)\n\nKhaled Mohieddin, the Free Officer known as the Red Major and founder of the newspaper Al-Masa, is the natural leader of an independent left that unites Marxists, left Nasserists and progressive religious figures. He keeps his distance from both the ASU bureaucracy and Moscow's orthodoxy.\n\nA Tagammu, or rally, around him would defend the public sector, land reform and workers' rights while demanding freedom of speech and political pluralism. It opposes any separate peace with Israel and any turn toward Washington."
 COLDWAR_EGY_1970_party_20:0 "£COLDWAR_EGY_1970_party_20 Homeland Defenders Party"
 COLDWAR_EGY_1970_party_20_icon:0 "£COLDWAR_EGY_1970_party_20"
 COLDWAR_EGY_1970_party_20_desc:0 "(National Populism) - Homeland Defenders Party (Arabic: Hizb Humat al-Watan)\n\nKamal el-Din Hussein, artillery officer, Free Officer and former vice-president, was removed from office in 1964 and placed under house arrest after an open letter criticizing Nasser. A devout man with sympathies for the Islamic movement, he retains the respect of many officers.\n\nA nationalist party around him would appeal to veterans and patriots angered by the defeat of 1967, demanding honesty in government, a strong army and the liberation of Sinai. It stands for national dignity first, distrustful of Soviet advisers and Western powers alike."
 COLDWAR_EGY_1970_party_21:0 "£COLDWAR_EGY_1970_party_21 Arab Socialist Ba'ath Party – Egypt Region"
 COLDWAR_EGY_1970_party_21_icon:0 "£COLDWAR_EGY_1970_party_21"
 COLDWAR_EGY_1970_party_21_desc:0 "(Ba'athism) - Arab Socialist Ba'ath Party – Egypt Region (Arabic: Hizb al-Ba'th al-Arabi al-Ishtiraki – Qutr Misr)\n\nFounded in Damascus by Michel Aflaq and Salah al-Din al-Bitar, the Ba'ath preaches one Arab nation with an eternal mission. After the collapse of the United Arab Republic in 1961, Nasserists and Ba'athists became bitter rivals, and in Egypt the party has no legal existence.\n\nA small regional organization, directed by a collective regional command, keeps contact with the rival Ba'athist regimes in Damascus and Baghdad. It argues that Nasser's state lacks a true ideological vanguard and offers its own model of a disciplined party leading the nation toward unity, freedom and socialism."
 COLDWAR_EGY_1970_party_22:0 "£COLDWAR_EGY_1970_party_22 Egyptian Armed Forces"
 COLDWAR_EGY_1970_party_22_icon:0 "£COLDWAR_EGY_1970_party_22"
 COLDWAR_EGY_1970_party_22_desc:0 "(Military Rule) - Egyptian Armed Forces (Arabic: Al-Quwwat al-Musallaha al-Misriyya)\n\nGeneral Mohamed Fawzi, appointed commander-in-chief after the defeat of June 1967 and minister of war since 1968, has rebuilt the army with Soviet weapons and advisers. Along the Suez Canal his forces are fighting the War of Attrition against the Israeli positions on the eastern bank.\n\nThe army is the backbone of the revolutionary state and the source of its leaders, and Fawzi still serves loyally under Nasser. Should the political order fracture, the high command could take direct control in the name of the battle, subordinating every institution to the liberation of Sinai."
 COLDWAR_EGY_1970_party_23:0 "£COLDWAR_EGY_1970_party_23 Muhammad Ali Dynasty"
 COLDWAR_EGY_1970_party_23_icon:0 "£COLDWAR_EGY_1970_party_23"
 COLDWAR_EGY_1970_party_23_desc:0 "(Constitutional Monarchism) - Muhammad Ali Dynasty (Arabic: Usrat Muhammad Ali)\n\nFuad II was proclaimed king as an infant after his father Farouk's abdication in July 1952, and the monarchy was abolished in June 1953. Since Farouk's death in Rome in 1965, the young head of the house has lived in exile in Europe, and he turns eighteen on 16 January 1970.\n\nA few royalists among the old aristocracy and the émigrés of Paris and Geneva dream of a restored constitutional monarchy that would end the revolutionary experiment. With no organized following inside Egypt, they hope that defeat and economic hardship will one day make the throne appear once more as a symbol of stability."
 COLDWAR_EGY_1970_party_0_future:0 "£COLDWAR_EGY_1970_party_0_future Nation's Future Party"
 COLDWAR_EGY_1970_party_0_future_icon:0 "£COLDWAR_EGY_1970_party_0_future"
 COLDWAR_EGY_1970_party_0_future_desc:0 "(Developmental Authoritarianism) - Nation's Future Party (Arabic: Hizb Mustaqbal Watan)\n\nA circle of officers, provincial notables and young administrators around Vice-President Anwar Sadat argues that Egypt's future depends on stability, discipline and development rather than ideological crusades. They want a mass organization that mobilizes the youth behind the state and its president.\n\nThe Nation's Future Party presents itself as a party of national service: loyal to the presidency, close to the security institutions and hostile to both the Islamists and the radical left. It seeks foreign investment, new infrastructure and an end to the exhausting war with Israel on honourable terms."
 COLDWAR_EGY_1970_party_18_alliance:0 "£COLDWAR_EGY_1970_party_18_alliance Socialist Popular Alliance Party"
 COLDWAR_EGY_1970_party_18_alliance_icon:0 "£COLDWAR_EGY_1970_party_18_alliance"
 COLDWAR_EGY_1970_party_18_alliance_desc:0 "(Democratic Socialism) - Socialist Popular Alliance Party (Arabic: Hizb al-Tahaluf al-Sha'bi al-Ishtiraki)\n\nKhaled Mohieddin, the Free Officer who broke with his comrades in 1954 by demanding a return to parliamentary democracy, has returned to public life as a journalist and head of the Egyptian peace movement. He offers a democratic face for the left of the Arab Socialist Union.\n\nThe alliance he could lead would succeed the single party with a broad socialist front of Nasserists, Marxists and trade unionists. It wants pluralism without abandoning the nationalizations, land reform and social rights of the revolution."
