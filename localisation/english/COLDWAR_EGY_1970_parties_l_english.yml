l_english:
 COLDWAR_EGY_1970_party_0:0 "£COLDWAR_EGY_1970_party_0 National Democratic Party"
 COLDWAR_EGY_1970_party_0_icon:0 "£COLDWAR_EGY_1970_party_0"
 COLDWAR_EGY_1970_party_0_desc:0 "Founded historically in 1978. Anwar Sadat, vice-president in January 1970, is its prospective founder in this alternate path.\n\nLeader: Anwar as-Sadat"
 COLDWAR_EGY_1970_party_1:0 "£COLDWAR_EGY_1970_party_1 Conservative Party"
 COLDWAR_EGY_1970_party_1_icon:0 "£COLDWAR_EGY_1970_party_1"
 COLDWAR_EGY_1970_party_1_desc:0 "The later Conservative Party is retained. Retired vice-president Zakaria Mohieddin is an alternate founding candidate for a conservative, pro-Western platform.\n\nLeader: Zakaria Mohieddin"
 COLDWAR_EGY_1970_party_2:0 "£COLDWAR_EGY_1970_party_2 Free Egyptians Party"
 COLDWAR_EGY_1970_party_2_icon:0 "£COLDWAR_EGY_1970_party_2"
 COLDWAR_EGY_1970_party_2_desc:0 "Founded historically in 2011. Entrepreneur Osman Ahmed Osman represents an alternate early foundation; this is not a claim of historical party membership.\n\nLeader: Osman Ahmed Osman"
 COLDWAR_EGY_1970_party_3:0 "£COLDWAR_EGY_1970_party_3 Egyptian Social Democratic Party"
 COLDWAR_EGY_1970_party_3_icon:0 "£COLDWAR_EGY_1970_party_3"
 COLDWAR_EGY_1970_party_3_desc:0 "Founded historically in 2011. Ibrahim Shukri is an alternate 1970 candidate for parliamentary social reform, not its historical founder.\n\nLeader: Ibrahim Shukri"
 COLDWAR_EGY_1970_party_4:0 "£COLDWAR_EGY_1970_party_4 Egyptian Communist Party"
 COLDWAR_EGY_1970_party_4_icon:0 "£COLDWAR_EGY_1970_party_4"
 COLDWAR_EGY_1970_party_4_desc:0 "The communist organisations dissolved themselves in 1965; a party revival is an alternate path. Free Officer and former HADITU associate Khaled Mohieddin is an alternate leadership candidate, not a historical ECP chairman in January 1970.\n\nLeader: Khaled Mohieddin"
 COLDWAR_EGY_1970_party_5:0 "£COLDWAR_EGY_1970_party_5 Revolutionary Socialists"
 COLDWAR_EGY_1970_party_5_icon:0 "£COLDWAR_EGY_1970_party_5"
 COLDWAR_EGY_1970_party_5_desc:0 "The later Revolutionary Socialists are retained. Exiled communist Henri Curiel is an alternate candidate for an independent revolutionary left; he was not a historical leader of this later Trotskyist organisation.\n\nLeader: Henri Curiel"
 COLDWAR_EGY_1970_party_6:0 "£COLDWAR_EGY_1970_party_6 Dignity Party (Karama)"
 COLDWAR_EGY_1970_party_6_icon:0 "£COLDWAR_EGY_1970_party_6"
 COLDWAR_EGY_1970_party_6_desc:0 "The later Karama party is retained. Free Officer Hussein el-Shafei represents an alternate early Nasserist foundation.\n\nLeader: Hussein el-Shafei"
 COLDWAR_EGY_1970_party_7:0 "£COLDWAR_EGY_1970_party_7 Arab Democratic Nasserist Party"
 COLDWAR_EGY_1970_party_7_icon:0 "£COLDWAR_EGY_1970_party_7"
 COLDWAR_EGY_1970_party_7_desc:0 "The later Nasserist party is retained. Ali Sabri, a senior ASU politician in 1970, leads its alternate early incarnation.\n\nLeader: Ali Sabri"
 COLDWAR_EGY_1970_party_8:0 "£COLDWAR_EGY_1970_party_8 Shi'a Reform Party"
 COLDWAR_EGY_1970_party_8_icon:0 "£COLDWAR_EGY_1970_party_8"
 COLDWAR_EGY_1970_party_8_desc:0 "A fictional Egyptian Shi'a reform party. No organised Egyptian party or personal leader of this doctrine is attested for January 1970; a collective council is used.\n\nLeader: Shi'a Reform Council"
 COLDWAR_EGY_1970_party_9:0 "£COLDWAR_EGY_1970_party_9 Islamic Guardianship Party"
 COLDWAR_EGY_1970_party_9_icon:0 "£COLDWAR_EGY_1970_party_9"
 COLDWAR_EGY_1970_party_9_desc:0 "A fictional Egyptian party of Islamic jurists. An Iranian-style Egyptian theocracy is an alternate-history option, represented by a collective council.\n\nLeader: Council of Islamic Jurists"
 COLDWAR_EGY_1970_party_10:0 "£COLDWAR_EGY_1970_party_10 Al-Nour Party"
 COLDWAR_EGY_1970_party_10_icon:0 "£COLDWAR_EGY_1970_party_10"
 COLDWAR_EGY_1970_party_10_desc:0 "Founded historically in 2011. Egyptian Salafi scholar Abd al-Razzaq Afifi, then resident in Saudi Arabia, is an alternate founding candidate, not a historical Al-Nour chairman.\n\nLeader: Abd al-Razzaq Afifi"
 COLDWAR_EGY_1970_party_11:0 "£COLDWAR_EGY_1970_party_11 Ansar Bayt al-Maqdis"
 COLDWAR_EGY_1970_party_11_icon:0 "£COLDWAR_EGY_1970_party_11"
 COLDWAR_EGY_1970_party_11_desc:0 "The later organisation is retained as an alternate-history faction. Its modern commanders were not active adult leaders in 1970; a collective leadership is used.\n\nLeader: Sinai Leadership Council"
 COLDWAR_EGY_1970_party_12:0 "£COLDWAR_EGY_1970_party_12 Muslim Brotherhood"
 COLDWAR_EGY_1970_party_12_icon:0 "£COLDWAR_EGY_1970_party_12"
 COLDWAR_EGY_1970_party_12_desc:0 "Hassan al-Hudaybi was General Guide from 1951 until 1973. The organisation is banned at the start; a government takeover requires an alternate political path.\n\nLeader: Hassan al-Hudaybi"
 COLDWAR_EGY_1970_party_13:0 "£COLDWAR_EGY_1970_party_13 Coptic Orthodox Church"
 COLDWAR_EGY_1970_party_13_icon:0 "£COLDWAR_EGY_1970_party_13"
 COLDWAR_EGY_1970_party_13_desc:0 "Pope Cyril VI headed the Church from 1959 to 1971. The Church is represented as a political faction for gameplay, not a historical electoral party.\n\nLeader: Pope Cyril VI"
 COLDWAR_EGY_1970_party_14:0 "£COLDWAR_EGY_1970_party_14 New Wafd Party"
 COLDWAR_EGY_1970_party_14_icon:0 "£COLDWAR_EGY_1970_party_14"
 COLDWAR_EGY_1970_party_14_desc:0 "Founded historically in 1978 as the revival of the Wafd dissolved in 1953. Veteran Fouad Serageddin is the prospective founder.\n\nLeader: Fouad Serageddin"
 COLDWAR_EGY_1970_party_15:0 "£COLDWAR_EGY_1970_party_15 Republican People's Party"
 COLDWAR_EGY_1970_party_15_icon:0 "£COLDWAR_EGY_1970_party_15"
 COLDWAR_EGY_1970_party_15_desc:0 "The later party is retained. Entrepreneur Osman Ahmed Osman is an alternate 1970 candidate for its business-oriented programme, not its historical founder.\n\nLeader: Osman Ahmed Osman"
 COLDWAR_EGY_1970_party_16:0 "£COLDWAR_EGY_1970_party_16 Reform and Development Party"
 COLDWAR_EGY_1970_party_16_icon:0 "£COLDWAR_EGY_1970_party_16"
 COLDWAR_EGY_1970_party_16_desc:0 "The later party is retained. Finance minister Abdel Aziz Hegazy is an alternate founding candidate for economic and administrative reform.\n\nLeader: Abdel Aziz Hegazy"
 COLDWAR_EGY_1970_party_17:0 "£COLDWAR_EGY_1970_party_17 Egyptian Green Party"
 COLDWAR_EGY_1970_party_17_icon:0 "£COLDWAR_EGY_1970_party_17"
 COLDWAR_EGY_1970_party_17_desc:0 "Founded historically in 1990. Geologist Rushdi Said, head of the mining and geological research organisation in 1970, is an alternate environmentalist candidate.\n\nLeader: Rushdi Said"
 COLDWAR_EGY_1970_party_18:0 "£COLDWAR_EGY_1970_party_18 Arab Socialist Union"
 COLDWAR_EGY_1970_party_18_icon:0 "£COLDWAR_EGY_1970_party_18"
 COLDWAR_EGY_1970_party_18_desc:0 "The sole legal political organisation in January 1970. Gamal Abdel Nasser remains president; Anwar Sadat is the default successor after his death.\n\nLeader: Gamal Abdel Nasser"
 COLDWAR_EGY_1970_party_19:0 "£COLDWAR_EGY_1970_party_19 National Progressive Unionist Rally Party (Tagammu)"
 COLDWAR_EGY_1970_party_19_icon:0 "£COLDWAR_EGY_1970_party_19"
 COLDWAR_EGY_1970_party_19_desc:0 "Founded historically in 1976. Free Officer Khaled Mohieddin is its prospective founder and an independent socialist candidate in 1970.\n\nLeader: Khaled Mohieddin"
 COLDWAR_EGY_1970_party_20:0 "£COLDWAR_EGY_1970_party_20 Homeland Defenders Party"
 COLDWAR_EGY_1970_party_20_icon:0 "£COLDWAR_EGY_1970_party_20"
 COLDWAR_EGY_1970_party_20_desc:0 "The later party is retained. Free Officer Kamal el-Din Hussein is an alternate early nationalist candidate, not its historical chairman.\n\nLeader: Kamal el-Din Hussein"
 COLDWAR_EGY_1970_party_21:0 "£COLDWAR_EGY_1970_party_21 Arab Socialist Ba'ath Party - Egypt Region"
 COLDWAR_EGY_1970_party_21_icon:0 "£COLDWAR_EGY_1970_party_21"
 COLDWAR_EGY_1970_party_21_desc:0 "The later Egyptian Ba'ath organisation is retained as a playable party. A regional leadership council avoids assigning an unrelated Egyptian politician to this movement.\n\nLeader: Egyptian Ba'ath Regional Command"
 COLDWAR_EGY_1970_party_22:0 "£COLDWAR_EGY_1970_party_22 Egyptian Armed Forces"
 COLDWAR_EGY_1970_party_22_icon:0 "£COLDWAR_EGY_1970_party_22"
 COLDWAR_EGY_1970_party_22_desc:0 "War minister and commander-in-chief Mohamed Fawzi represents direct military rule. In January 1970 he serves under Nasser, rather than heading a separate ruling party.\n\nLeader: Mohamed Fawzi"
 COLDWAR_EGY_1970_party_23:0 "£COLDWAR_EGY_1970_party_23 Muhammad Ali Dynasty"
 COLDWAR_EGY_1970_party_23_icon:0 "£COLDWAR_EGY_1970_party_23"
 COLDWAR_EGY_1970_party_23_desc:0 "Fuad II lives in exile and is seventeen on 1 January 1970, turning eighteen on 16 January. Restoration is an alternate-history route.\n\nLeader: Fuad II"
 COLDWAR_EGY_1970_party_0_future:0 "£COLDWAR_EGY_1970_party_0_future Nation's Future Party"
 COLDWAR_EGY_1970_party_0_future_icon:0 "£COLDWAR_EGY_1970_party_0_future"
 COLDWAR_EGY_1970_party_0_future_desc:0 "The later party is retained as an alternate foundation in 1970. Anwar Sadat is its alternate candidate, not its historical founder."
 COLDWAR_EGY_1970_party_18_alliance:0 "£COLDWAR_EGY_1970_party_18_alliance Socialist Popular Alliance Party"
 COLDWAR_EGY_1970_party_18_alliance_icon:0 "£COLDWAR_EGY_1970_party_18_alliance"
 COLDWAR_EGY_1970_party_18_alliance_desc:0 "The later party is retained as an alternate successor to the ASU. Khaled Mohieddin is its alternate 1970 candidate, not its historical founder."
