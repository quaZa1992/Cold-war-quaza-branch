l_english:
# IMPERIA CW — Cold War: Imperia preserved LBA focus and unbound labels — English localisation.
 LBA_negotiations_with_un: "Gaddafi Politics"
 LBA_negotiations_with_un_desc: "Gaddafi's Libya survives by playing several games at once: revolutionary patronage, pan-Arab theatre, pressure against Britain, quiet Western portfolios and the dream of a deterrent no foreign capital can bomb with impunity."
 LBA_nuclear_backchannels_threat: "[LBA.GetAdjective] Nuclear Backchannels"
 LBA_weaponise_oil_contracts_threat: "[LBA.GetAdjective] Oil Pressure"
 LBA_celebrate_lockerbie_bombers: "Defy the Lockerbie Accusations"
 LBA_celebrate_lockerbie_bombers_desc: "If the West expects contrition, it has misunderstood Gaddafi. We will deny, deflect and turn the accusations into another speech about imperial intimidation."
 LBA_pressure_western_air_routes_threat: "[LBA.GetAdjective] Pressure on Western Air Routes"
 LBA_wmds: "Acquire Centrifuge Networks"
 LBA_wmds_desc: "Since the 1970s, Libya's nuclear ambitions have leaned on foreign engineers, dual-use imports and improvised procurement. We need a deeper centrifuge network before any weapon is even imaginable, and the cost will be felt across the civilian economy."
 LBA_wmds_threat: "[LBA.GetAdjective] Centrifuge Procurement"
 LBA_acquire_yellowcake_routes_threat: "[LBA.GetAdjective] Yellowcake Routes"
 LBA_start_building_reactor: "Expand the Tajoura Program"
 LBA_start_building_reactor_desc: "The Soviet-built Tajoura reactor is watched too closely and produces too little for Gaddafi's ambitions. Expanding the program will create a deterrent path, but also a target and a heavy burden on civilian imports."
 LBA_arms_smuggling: "Smuggle Dual-Use Equipment"
 LBA_arms_smuggling_desc: "The weapons channels that move rifles can also move machine tools, electronics and parts that should never appear together on one invoice. Every shipment makes the program more real and more vulnerable."
 LBA_buy_nukes: "The Impossible Bomb Deal"
 LBA_buy_nukes_desc: "Gaddafi has tried to buy a nuclear deterrent before: from China, from Pakistan's program, through India and later through the chaos around the Soviet collapse. Any new attempt will be wildly expensive, diplomatically explosive and likely to fail. But if it succeeds, Libya will never be treated the same way again."
 LBA_compensation_to_lockerbie_victims: "Legacy Lockerbie Compensation"
 LBA_compensation_to_lockerbie_victims_desc: "This legacy normalisation focus is disabled in the 1985 Cold War setup."
 LBA_disarmament_program: "Legacy Disarmament Program"
 LBA_disarmament_program_desc: "This legacy normalisation focus is disabled in the 1985 Cold War setup."
 LBA_disarmament_program_tt: "This legacy disarmament option is disabled in the 1985 Cold War setup."
 LBA_remove_sanctions: "Legacy Sanctions Removal"
 LBA_remove_sanctions_desc: "This legacy sanctions focus is disabled in the 1985 Cold War setup."
 LBA_invite_foreign_investors: "Legacy Foreign Investment"
 LBA_invite_foreign_investors_desc: "This legacy post-sanctions investment focus is disabled in the 1985 Cold War setup."
 LBA_arms_deals_with_italy: "Legacy Italian Arms Deal"
 LBA_arms_deals_with_italy_desc: "This legacy normalisation focus is disabled in the 1985 Cold War setup."
 LBA_disarmament_public_tt: "This legacy option is disabled in the 1985 Cold War setup."
 LBA_dealing_with_sanctions_shortcut: "Gaddafi Politics"
 LBA_1985_fund_ira_networks: "Fund IRA Networks"
 LBA_1985_fund_ira_networks_desc: "Quiet money, safe houses and sympathetic intermediaries can strengthen republican networks in Britain without committing Libya to a fully exposed weapons pipeline."
 LBA_1985_intelligence_to_ira: "Share Intelligence with the IRA"
 LBA_1985_intelligence_to_ira_desc: "Libyan contacts can pass on travel patterns, security observations and forged documentation. The operation is cheaper than arms shipments, but a leak would still damage our standing."
 LBA_1985_scale_back_ira_support: "Scale Back IRA Support"
 LBA_1985_scale_back_ira_support_desc: "The British will remain enemies of the revolution, but there are moments when deniability matters more than escalation. We can cool the channel before it drags Tripoli into a larger confrontation."
 LBA_1985_lockerbie_operation: "Authorize a Covert Aviation Operation"
 LBA_1985_lockerbie_operation_desc: "A hardline faction around the security services proposes a spectacular strike against Western aviation. It could make Libya feared, or it could bring sanctions, isolation and a crisis inside the regime."
