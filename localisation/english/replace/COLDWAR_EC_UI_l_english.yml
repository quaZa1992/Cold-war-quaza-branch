# IMPERIA COLD WAR — European Communities interface naming in the native MD interface.
 # Native Millennium Dawn keys are overridden here. Internal IDs and rules are retained.

 # Organisation and navigation.
 EU_main_background_window_inner_title:0 "§C[COLDWAR_EC_GetOrgName]§!"
 eu_gui_tooltip:0 "§C[EUU.GetFlag][COLDWAR_EC_GetOrgName]§! Interface"
 eu_gui_tooltip_delayed:0 "Open the institutions of the §C[COLDWAR_EC_GetOrgName]§!: the European Commission, Parliament, Council, member states and common budget."
 EU_offices_screen_title:0 "Offices"
 EU_offices_screen_desc:0 "Institutional offices of the §C[COLDWAR_EC_GetOrgName]§!, their current holders and the requirements for taking office."
 EU_europeanism_screen_title:0 "Members"
 EU_europeanism_screen_desc:0 "Member states of the §C[COLDWAR_EC_GetOrgName]§!, their populations, population shares, support for European integration and institutional obligations."
 fiscal_button_title:0 "Budget"
 fiscal_button_desc:0 "The common budget of the §C[COLDWAR_EC_GetOrgName]§!: member contributions, expenditure, the next fiscal year and the multiannual financial framework."
 euro_voting_button_desc:0 "The Council represents the member states of the §C[COLDWAR_EC_GetOrgName]§!. Review adopted legal acts, proposed measures and eligible voting members.\n\nQualified majority voting requires support from more than §C55% of member states§! representing more than §C65% of the member states' population§!."
 parliament_button_desc:0 "The European Parliament considers proposed legal acts of the §C[COLDWAR_EC_GetOrgName]§! before they proceed to the Council.\n\nGather majority support within §Y14 days§! to complete the parliamentary vote."
 EU_trigger_article_50:0 "Withdraw"
 EU_article_50_available_delayed:0 "Begin withdrawal from the §C[COLDWAR_EC_GetOrgName]§!. The withdrawal negotiations and settlement are handled through the membership decisions."

