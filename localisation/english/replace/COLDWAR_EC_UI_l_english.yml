 # Native post-Community membership description. Millennium Dawn wording retained.
 COLDWAR_EC_UI_union_member_desc:0 "The European Union (EU) is a political and economic union of member states that are located primarily in Europe. The EU has developed an internal single market through a standardised system of laws that apply in all member states. EU policies aim to ensure the free movement of people, goods, services, and capital within the internal market, enact legislation in justice and home affairs, and maintain common policies on trade, agriculture, fisheries, and regional development."
