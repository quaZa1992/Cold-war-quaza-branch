 european_council_voting_members_tt:0 "Member states of the §C[COLDWAR_EC_GetOrgName]§! eligible to vote on the current Council measure."
 european_council_header_tt:0 "Adopted legal acts of the §C[COLDWAR_EC_GetOrgName]§!.\n\nQualified majority voting requires support from more than §C55% of member states§! representing more than §C65% of the member states' population§!."
 EU_budget_global_expense_tooltip:0 "£click_left §GOn Left Click:§! Raise external expenditure\n§YPrerequisites:§!\n[!EU_global_expenses_click_enabled]\n§YEffects:§!\n[!EU_global_expenses_click]\n£GFX_click_right §GOn Right Click:§! Lower external expenditure\n§YPrerequisites:§!\n[!EU_global_expenses_right_click_enabled]\n§YEffects:§!\n[!EU_global_expenses_right_click]"
 EU_MD_LAW_FLOWCHART:0 "Open the §CEuropean Integration§! Flowchart"

 # Membership and institutional descriptions.
 EU_member:0 "[COLDWAR_EC_GetOrgName] Member"
 EU_member_desc:0 "[COLDWAR_EC_GetMembershipDescription]"
 COLDWAR_EC_UI_communities_member_desc:0 "The European Communities bring together the European Economic Community, the European Coal and Steel Community and Euratom. Their member states share a Commission, a Council and a Parliament. Cooperation rests on the customs union, common agricultural policy and joint economic institutions."
 COLDWAR_EC_UI_parliament_delegations:0 "National parliamentary delegations represent the member states in the European Parliament. The political groups organise these delegates across national boundaries."
 COLDWAR_EC_UI_parliament_direct_elections:0 "Members of the European Parliament are directly elected in the member states and organise into political groups."
 EU_commission_president_desc:0 "The §YPresident of the European Commission§! leads the Commission of the §C[COLDWAR_EC_GetOrgName]§!. The Commission prepares legislative proposals and oversees the administration of common policies."
 EU_voting_category:0 "The [COLDWAR_EC_GetOrgName]"
 EU_voting_category_desc:0 "[ROOT.GetFlag] Support for European integration: [?ROOT.europeanism|%G1]\n[EUU.GetFlag] Support across member states: [?global.var_europeanism|%G1]\n\nCommon policies of the §C[COLDWAR_EC_GetOrgName]§! are coordinated through the Commission, Parliament and Council. National governments negotiate reforms, membership and the common budget.\n\n[ROOT.GetFlag] Breaches of common institutional values: [?ROOT.breach_of_EU_value|g0]"
 EU_Voting_tutorial:0 "European Integration Guide"
 EU_Voting_tutorial_desc:0 "A guide to the institutions, legislative procedure, membership and common budget of the §C[COLDWAR_EC_GetOrgName]§!."
 EU_fiscal_category:0 "European Fiscal Policies"
 EU_fiscal_category_desc:0 "Fiscal policies of the §C[COLDWAR_EC_GetOrgName]§! and their member states."
 EU_apply_for_membership:0 "Accession to the [COLDWAR_EC_GetOrgName]"

 # IMPERIA COLD WAR: Native office, requirement and numeric budget wording.
 EUU_subsidies_suspended:0 "Suspension of [COLDWAR_EC_GetOrgName] Subsidies"
 EUU_subsidies_suspended_desc:0 "The [COLDWAR_EC_GetOrgName] subsidies we were once receiving have now been suspended. The sudden change in our budget will take some getting used to and we should look to remedying the situation to once again take advantage of the subsidies allotted to us."
 EUU_voting_rights_suspended:0 "Suspension of [COLDWAR_EC_GetOrgName] Voting Rights in the Council"
 EUU_voting_rights_suspended_desc:0 "Our voting rights in the [COLDWAR_EC_GetOrgName] have been suspended due to repeated breaches of European values. It is time we either change the direction we are taking our country or we should explore leaving the Union."
 EU_ambassador_to_un_tt:0 "The §YAmbassador of the Union to the United Nations§! represents the [COLDWAR_EC_GetOrgName] at the United Nations, working in coordination with diplomatic missions of all the [COLDWAR_EC_GetOrgName] member states.\n\n§YPerks of the Office:§!\nHolding this office grants the holder nation the Permanent Member of the UNSC national spirit.\n\n[!eu_ambassador_to_un_back_click]\n"
 EU_any_current_eu_candidates:0 "Any Current [COLDWAR_EC_GetOrgName] Candidates"
 EU_any_nation_holds_council_president_TT:0 "Any §Y[COLDWAR_EC_GetOrgName]§! Country Holds §Y$EU_council_president$§!"
 EU_article_50_available_click:0 "Prerequisites:\n[!EU_Article_50_click_enabled]\nEffects:\n§Y[ROOT.GetNameWithFlag]§! will begin to exit the §C[EUU.GetFlag][COLDWAR_EC_GetOrgName]§!"
 EU_average_eu_economy_tt_delayed:0 "The Economy of the [COLDWAR_EC_GetOrgName] is calculated as an average of all members' economies:\n§RRegression - 1§!\n§ORecession - 2§!\n§YStagnation - 3§!\n§GStable Growth - 4§!\n§BFast Growth - 5§!\n§0Economic Boom - 6§!"
 EU_budget_draft:0 "You have started making a draft of the Common budget"
 EU_budget_draft_desc:0 "The member state which drafts the Common Budget of the next fiscal year has to put the draft on the agenda of the European Parliament at the end of the negotiations. As a reward, the drafting member state gets the total invested political power, when the Common Budget is approved and put into effect."
 EU_candidate:0 "[ROOT.GetNameWithFlag] is an [COLDWAR_EC_GetOrgName] Candidate"
 EU_central_bank_president_tt:0 "The §YPresident of the European Central Bank§! presides over the European Central Bank (ECB), the institution responsible for the management of the Euro and the [COLDWAR_EC_GetOrgName]'s monetary policy in the Eurozone. They head the executive board, Governing Council and General Council of the ECB and represent the bank abroad.\n\n§YPerks of the Office:§!\nHolding this office allows us to start, expand, or reduce the OMT Program of the ECB to temporarily reduce the interest rates of member states with high interest rates.\n\n[!eu_central_bank_president_back_click]\n"
 EU_does_not_hold_another_office_tt:0 "§Y[ROOT.GetNameWithFlag]§! Does Not Currently Hold Another §C[EUU.GetFlag][COLDWAR_EC_GetOrgName]§! Office\n"
 EU_european_union_currently_exists_tt:0 "The §Y[COLDWAR_EC_GetOrgName]§! currently exists.\n"
 EU_european_union_currently_exists_tt_NOT:0 "The §Y[COLDWAR_EC_GetOrgName]§! does not exist.\n"
 EU_external_sov_chi_influence_50_tt:0 "§Y[SOV.GetNameWithFlag]§! or §Y[CHI.GetNameWithFlag]§! Currently Have §R60%§! §YInfluence§! in §Y[THIS.GetNameWithFlag]§! or §Y[SOV.GetNameWithFlag]§! isn't in the §C[COLDWAR_EC_GetOrgName]§!\n"
 EU_former_member:0 "Former [COLDWAR_EC_GetOrgName] Member"
 EU_frontex_director_tt:0 "The §YFrontex Executive Director§! presides over the European Border and Coast Guard Agency (commonly known as Frontex). The purpose of Frontex is to support [COLDWAR_EC_GetOrgName] member states on the ground in their efforts to protect external European Borders. It also exercises border control over the Schengen area to assist with the area of freedom, security and justice domain.\n\n§YPerks of the Office:§!\n\nHolding this office will allow the holder to temporarily take control over the Frontex forces for their tenure.\n\n[!eu_frontex_director_back_click]\n"
 EU_has_over_five_percent_pop_tt:0 "§Y[ROOT.GetAdjectiveCap]§! Population greater than §G5%§! of the Total [COLDWAR_EC_GetOrgName] Population (Current Ratio: [?ROOT.EU_pop_ratio|Y%2])."
 EU_high_representative_tt:0 "The §YHigh Representative of the Union for Foreign Affairs and Security Policy§! is the chief coordinator and representative of the Common Foreign and Security Policy (CFSP) within the [COLDWAR_EC_GetOrgName]. The title is often shortened to the [COLDWAR_EC_GetOrgName] Foreign Minister and they primarily coordinate foreign policy on behalf of member states.\n\n§YPerks of the Office:§!\n\n[!foreign_affairs_security_back_click]\n"
 EU_level_of_breaches_less_than_3_tt:0 "Level of Breach of [COLDWAR_EC_GetOrgName] Values is §YLess Than§! 3 (Current Breaches: [?THIS.breach_of_EU_value|0R])\n"
 EU_no_external_sov_influence_15_tt:0 "§Y[SOV.GetNameWithFlag]§! Currently Does Not Have §R15%§! §YInfluence§! in §Y[THIS.GetNameWithFlag]§! or is in the §C[COLDWAR_EC_GetOrgName]§!\n"
 EU_ongoing_budget_draft_trigger_tt:0 "Any §C[COLDWAR_EC_GetOrgName] Member State§! is Currently Drafting a §YNew Common Budget§!"
 EU_parliament_president_desc:0 "The §YPresident of the European Parliament§! presides over the debates and activities of the European Parliament. They represent the European Parliament in all legal matters and external relations, particularly international relations. They serve a two-and-a-half-year term and their signature is required to sign the Budget of the [COLDWAR_EC_GetOrgName] and Union acts adopted under co-decision procedures."
 EU_potential:0 "[ROOT.GetNameWithFlag] is a Potential [COLDWAR_EC_GetOrgName] Member"
 EU_president_council_tt:0 "The §YPresident of the European Council§! presides over and drives forward the work of the European Council, which is composed of the heads of state or government of the member states and a principal representative of §C[EUU.GetFlag][COLDWAR_EC_GetOrgName]§! on the world stage. The institution comprises the college of heads of state and the president of the European Commission and provides political direction to the whole of the [COLDWAR_EC_GetOrgName].\n\n§YPerks of the Office:§!\nHolding this office allows us to put a bill forward to vote without requiring influence on any member.\n\nIncreases the success rate of Pro-European and Euroscepticism Campaigns by §G+10%§!\n\n[!eu_president_council_back_click]\n"
 EU_president_european_parliament_tt:0 "The §YPresident of the European Parliament§! presides over the debates and activities of the European Parliament. They represent the European Parliament in all legal matters and external relations, particularly international relations. They serve a two-and-a-half-year term and their signature is required to sign the Budget of §C[EUU.GetFlag][COLDWAR_EC_GetOrgName]§! and Union acts adopted under co-decision procedures.\n\n§YPerks of the Office:§!\nHolding this office allows us to put a bill forward to vote without requiring influence on any member.\n\nIncreases the success rate of Pro-European and Euroscepticism Campaigns by §G+10%§!\n\n[!eu_parliament_president_back_click]\n"
 EU_president_of_the_eurofederation_tt:0 "The §YPresident of the European Federation§! is the duly elected leader of the European Federation. The European Federation is one of the final federalization options of the [COLDWAR_EC_GetOrgName] and as such is a very powerful position.\n\n§YPerks of the Office:§!\n\n[!eu_pres_federation_back_click]\n"
 EU_recently_retired_from_an_eu_office_tt:0 "§Y[ROOT.GetNameWithFlag]§! Has Not Recently Retired from a [COLDWAR_EC_GetOrgName] Offices (Days to Take A New Office: [?recently_retired_from_an_eu_office:days_left|Y0])\n"
 EU_sec_general_euro_army_tt:0 "The §YSecretary General of EuroArmy§! is the head of the EuroArmy of the [COLDWAR_EC_GetOrgName]. They are responsible for the coordination of the EuroArmy which is the combined and common armed forces of the [COLDWAR_EC_GetOrgName] member states.\n\n§YPerks of the Office:§!\n\nHolding this office will allow the holder to temporarily take control over the EuroArmy forces for their tenure.\n[!eu_sec_general_euro_army_back_click]\n"
 EU_sec_general_euro_navy_tt:0 "The §YSecretary General of EuroNavy§! is the head of the EuroNavy of the [COLDWAR_EC_GetOrgName]. They are responsible for the coordination of the EuroNavy which is the combined and common naval strength of the [COLDWAR_EC_GetOrgName].\n\n§YPerks of the Office:§!\n\nHolding this office will allow the holder to take control over Member States Navies and unify them into one European Fleet.\n[!eu_sec_general_euro_navy_back_click]\n"
 EU_sup_vote_desc_tt:0 "§C[EUU.GetFlag][COLDWAR_EC_GetOrgName]'s§! primary voting system is Qualified Majority Voting (QMV). QMV requires that 65% of §C[EUU.GetFlag][COLDWAR_EC_GetOrgName]'s§! §YPopulation§! support the Council resolution."
 EU_total_member_vote_desc_tt:0 "§C[EUU.GetFlag][COLDWAR_EC_GetOrgName]'s§! primary voting system is Qualified Majority Voting (QMV). QMV requires that [?global.EU_majority_qmv_state] §CMember States§! (or 55% of the current §CMember State§! total) support the current resolution. Once we have more than [?global.EU_majority_qmv_state] §CMember States§! the law can be passed assuming we have the required population majority of 65%.\n\nPop % of §Cmember states§! §GSupporting§!: [?global.EU_pop_ratio_yes|%+]\nPop % of §Cmember states§! §RRejecting§!: [?global.EU_pop_ratio_no|%-]"
 eu_distrib_row_tt:0 "[THIS.GetNameWithFlag]\n§YTotal§!: [?THIS.EU_budget_total_gain|Y2] billion\n§CRatio§!: [?THIS.EU_budget_ratio_gain|C%2]\n§OGrowth§!: [?THIS.EU_growth_subsidies|O2]\n§GNatural resources§!: [?THIS.EU_natural_subsidies|G2]\n§LExternal relations§!: [?THIS.EU_global_exp_subsidies|L2]\n§gAdmin., etc.§!: [?THIS.EU_admin_subsidies|g2]\n§Rnet payer§!/§Gnet receiver§!: [?THIS.EU_budget_net|+2] billion"
 eu_president_commission_tt:0 "The §YPresident of the European Commission§! is the head of the executive branch of the §C[EUU.GetFlag][COLDWAR_EC_GetOrgName]§!. The President leads a cabinet of Commissioners, referred to simply as the College, collectively accountable to the European Parliament. They are empowered to allocate portfolios among, reshuffle, or dismiss commissioners as necessary. The Commission is the only body allowed to propose bills to become European Law.\n\n§YPerks of the Office:§!\nHolding this office allows us to put a bill forward to vote without requiring influence on any member.\n\nIncreases the success rate of Pro-European and Euroscepticism Campaigns by §G+10%§!\n\nHolding this office allows us to suspend member states who have more than three levels of breaches regardless of influence.\n\n[!eu_president_commission_back_click]\n"
 euroscepticism_campaign_desc:0 "Euroscepticism Campaign in all member states of §C[EUU.GetFlag] The [COLDWAR_EC_GetOrgName]§!.\n\n§HPrerequisites:§!\n[!euroscepticism_euwide_button_click_enabled]\n§HEffect:§!\n[!euroscepticism_euwide_button_click]\n"
 expenditure_total_loc_tt:0 "Category - Total - Ratio\n§OGrowth§!: [?global.EU_growth_exp_total|Y0] billion - [?global.EU_growth_exp_ratio|O%2]\n§GNatural resources§!: [?global.EU_natural_exp_total|Y0] billion - [?global.EU_natural_exp_ratio|G%2]\n§LExternal relations§!: [?global.EU_global_exp_total|Y0] billion - [?global.EU_global_exp_ratio|L%2]\n§gAdministration, security and citizenship§!: [?global.EU_admin_exp_total|Y0] billion - [?global.EU_admin_exp_ratio|g%2]"
 gdp_total_of_the_eu_tt_delayed:0 "Total Pop of [EUU.GetFlag][COLDWAR_EC_GetOrgName]: [?global.var_EUpopTotalDisplay|Y]§YM§!\nGDP/C of [EUU.GetFlag][COLDWAR_EC_GetOrgName]: [?global.EU_gdp_capita|Y3]k\n"
 instrument_for_pre_accession_assistance_desc:0 "The Instrument for Pre-accession Assistance (IPA) provides financial and technical assistance for reforms in countries seeking membership of the [COLDWAR_EC_GetOrgName]."
 pro_european_campaign_desc:0 "Pro-European Campaign in all member states of §C[EUU.GetFlag] The [COLDWAR_EC_GetOrgName]§!.\n\n§HPrerequisites:§!\n[!proeuro_euwide_button_click_enabled]\n§HEffect:§!\n[!proeuro_euwide_button_click]\n"
 system_of_eu_values_tt:0 "System of European Values:\nCommon values:\nissue of breach - level of breach\n\nRule of Law:\nParalyzing Corruption - 5\nCrippling Corruption - 4\nRampant Corruption - 3\nUnrestrained Corruption - 2\nSystematic Corruption - 1\n\nRespect for human dignity and freedom:\nhas offensive war with [COLDWAR_EC_GetOrgName] member state - 10\nhas communist government - 2\nhas reactionary government - 2\nhas communist in coalition - 1\nhas reactionary in coalition - 1\n\nDemocracy:\nNo elections - 5\nDictatorship - 5\nCommunist Dictatorship - 5\nFascist Dictatorship - 5\nis puppet - 4\nNeo-Imperialism - 1\n\nWomen and Minority Rights:\nProhibited Service for Women - 1\nElection Threshold 10% - 1\n\nNo Bailout clause:\nDefault on Debts - 1\nBailout given - 1"
 tooltip_EU_budget_admin_combined:0 "Common budget §OGrowth§! rate: Add §O+2%§! (pts)\nCommon budget §GNatural resources§! rate: Add §G+2%§! (pts)\nCommon budget §gAdmin., etc.§! rate: Add §g-4%§! (pts)\nTotal invested PP: Add §Y[?global.EU_10_per_member_cost]§!\n[EU_parl_PG_party_1_icon], [EU_parl_PG_party_14_icon] and [EU_parl_PG_party_6_icon] will §Gsupport§! this change.\n[EU_parl_PG_party_2_icon] and [EU_parl_PG_party_16_icon] will §Gsupport§! this change.\n[EU_parl_PG_party_20_icon], [EU_parl_PG_party_21_icon], [EU_parl_PG_party_22_icon] and [EU_parl_PG_party_23_icon] will §Rresist§! this change.\n\nCommon budget §OGrowth§! rate: Add §O-2%§! (pts)\nCommon budget §GNatural resources§! rate: Add §G-2%§! (pts)\nCommon budget §gAdmin., etc.§! rate: Add §g+4%§! (pts)\nTotal invested PP: Add §Y[?global.EU_10_per_member_cost]§!\n[EU_parl_PG_party_1_icon], [EU_parl_PG_party_14_icon] and [EU_parl_PG_party_6_icon] will §Rresist§! this change.\n[EU_parl_PG_party_2_icon] and [EU_parl_PG_party_16_icon] will §Rresist§! this change.\n[EU_parl_PG_party_20_icon], [EU_parl_PG_party_21_icon], [EU_parl_PG_party_22_icon] and [EU_parl_PG_party_23_icon] will §Gsupport§! this change."
 tooltip_EU_budget_global_combined:0 "Raising Growth Subsidies:\nCommon budget §OGrowth§! rate: Add §O+2%§! (pts)\nCommon budget §GNatural resources§! rate: Add §G+2%§! (pts)\nCommon budget §LExternal relations§! rate: Add §L-4%§! (pts)\nTotal invested PP: Add §Y[?global.EU_10_per_member_cost]§!\n[EU_parl_PG_party_1_icon], [EU_parl_PG_party_14_icon] and [EU_parl_PG_party_6_icon] will §Gsupport§! this change.\n[EU_parl_PG_party_2_icon] and [EU_parl_PG_party_16_icon] will §Rresist§! this change.\n[EU_parl_PG_party_3_icon] and [EU_parl_PG_party_18_icon] will §Gsupport§! this change.\n[EU_parl_PG_party_17_icon] will §Gsupport§! this change.\n[EU_parl_PG_party_4_icon],  [EU_parl_PG_party_5_icon] and [EU_parl_PG_party_19_icon] will §Gsupport§! this change.\n[EU_parl_PG_party_20_icon], [EU_parl_PG_party_21_icon], [EU_parl_PG_party_22_icon] and [EU_parl_PG_party_23_icon] will §Gsupport§! this change.\n\nLowering Growth Subsidies:\nCommon budget §OGrowth§! rate: Add §O-2%§! (pts)\nCommon budget §GNatural resources§! rate: Add §G-2%§! (pts)\nCommon budget §LExternal relations§! rate: Add §L+4%§! (pts)\nTotal invested PP: Add §Y[?global.EU_10_per_member_cost]§!\n[EU_parl_PG_party_1_icon], [EU_parl_PG_party_14_icon] and [EU_parl_PG_party_6_icon] will §Rresist§! this change.\n[EU_parl_PG_party_2_icon] and [EU_parl_PG_party_16_icon] will §Gsupport§! this change.\n[EU_parl_PG_party_3_icon] and [EU_parl_PG_party_18_icon] will §Rresist§! this change.\n[EU_parl_PG_party_17_icon] will §Rresist§! this change.\n[EU_parl_PG_party_4_icon],  [EU_parl_PG_party_5_icon] and [EU_parl_PG_party_19_icon] will §Rresist§! this change.\n[EU_parl_PG_party_20_icon], [EU_parl_PG_party_21_icon], [EU_parl_PG_party_22_icon] and [EU_parl_PG_party_23_icon] will §Rresist§! this change."
 tooltip_EU_budget_growth_combined:0 "Common budget §OGrowth§! rate: Add §O+5%§! (pts)\nCommon budget §GNatural resources§! rate: Add §G-5%§! (pts)\nTotal invested PP: Add §Y[?global.EU_10_per_member_cost]§!\n[EU_parl_PG_party_1_icon], [EU_parl_PG_party_6_icon] and [EU_parl_PG_party_14_icon] will §Rresist§! this change.\n[EU_parl_PG_party_2_icon] and [EU_parl_PG_party_16_icon] will §Gsupport§!  this change.\n[EU_parl_PG_party_3_icon] and [EU_parl_PG_party_18_icon] will §Gsupport§!  this change.\n[EU_parl_PG_party_17_icon] will §Rresist§! this change.\n[EU_parl_PG_party_4_icon],  [EU_parl_PG_party_5_icon] and [EU_parl_PG_party_19_icon] will §Gsupport§!  this change.\n\nCommon budget §OGrowth§! rate: Add §O-5%§! (pts)\nCommon budget §GNatural resources§! rate: Add §G+5%§! (pts)\nTotal invested PP: Add §Y[?global.EU_10_per_member_cost]§!\n[EU_parl_PG_party_1_icon], [EU_parl_PG_party_6_icon] and [EU_parl_PG_party_14_icon] will §Gsupport§!  this change.\n[EU_parl_PG_party_2_icon] and [EU_parl_PG_party_16_icon] will §Rresist§! this change.\n[EU_parl_PG_party_3_icon] and [EU_parl_PG_party_18_icon] will §Rresist§! this change.\n[EU_parl_PG_party_17_icon] will §Gsupport§!  this change.\n[EU_parl_PG_party_4_icon],  [EU_parl_PG_party_5_icon] and [EU_parl_PG_party_19_icon] will §Rresist§! this change."
