l_english:
# IMPERIA CW — Cold War: covert action — English localisation.

 # COLDWAR: Cold War reskin of MD's cyber warfare system as Covert Action.
 # Overrides MD_cyberwarfare_l_english.yml (and two keys from MD_international / MD_opinion_modifiers).
 # Internal keys and scripts are unchanged. English only by design.

 cyber_operations: "Covert Action"
 cyber_operations_desc: "\n\n\n\n\n\n£MAIN_desctext_cyber\n\n\n\n\n\n\n\n\nRun deniable covert operations against designated target nations - rivals and allies alike. Add targets in the Covert Action panel, then launch operations as the tier of your service allows."
 branch_cyber: "Covert Action"
 IS_title_cyber: "COVERT ACTION"
 CYBER_CAP_TITLE: "§YCOVERT ACTION SERVICE CAPABILITIES§!"
 CYBER_TIER_LABEL: "Service Tier:"
 CYBER_TIER_TT: "The overall tier of your covert action service. Higher tiers unlock more ambitious operations and additional simultaneous target slots."
 CYBER_OFFENSE_LABEL: "Action Strength:"
 CYBER_OFFENSE_TT_DELAYED: "Determines how effective our covert operations are. Increases the success chance of every operation we launch."
 CYBER_DEFENSE_LABEL: "Counter-Intelligence:"
 CYBER_DEFENSE_TT_DELAYED: "How well our security services shield the state against foreign agents, saboteurs and moles. Reduces the effectiveness of operations mounted against us."
 CYBER_ATTRIB_LABEL: "Deniability:"
 CYBER_ATTRIB_TT: "Reduces the chance that our operations are traced back to us. Higher values make our hand harder to find."
 CYBER_MAX_TARGETS_LABEL: "Max Targets:"
 CYBER_GUI_INVEST_OFF: "Offensive Capability"
 CYBER_GUI_INVEST_DEF: "Counter-Intelligence Capability"
 CYBER_OPERATIONS_TITLE: "§YCOVERT OPERATIONS§!"
 CYBER_DECRYPT_TT_DELAYED: "The further we have broken [?current_cyber_nation_target.GetNameWithFlag]'s ciphers, the more effective our covert operations become against them, and the less likely our agents are to be caught or identified."
 CYBER_CUR_DEFENSE_TT: "§YTarget Counter-Intelligence§!: [?cyber_defense_rating@var:current_cyber_nation_target|-]"
 CYBER_TARGET_DEFENSE_TT: "Displays the strength of [?current_cyber_nation_target.GetNameWithFlag]'s §YCounter-Intelligence§!."
 CYBER_TARGET_DEFENSE_TT_DELAYED: "The stronger a target nation's §YCounter-Intelligence§! is, the harder it is to run successful operations against it without first breaking, or partially breaking, its ciphers."
 CYBER_ADD_TARGET_TT: "Designate this nation as a target for covert action."
 CYBER_BROWSER_HINT: "Click a nation to put it under surveillance."
 CYBER_BTN_GPS: "Radio Jamming"
 CYBER_BTN_ECON: "Counterfeit Currency"
 CYBER_BTN_PROP: "Black Propaganda"
 CYBER_BTN_INFRA: "Rail and Bridge Sabotage"
 CYBER_BTN_CRIT: "Industrial Sabotage"
 CYBER_BTN_SIGINT: "Listening Post"
 CYBER_BTN_RADAR: "Radar Deception"
 CYBER_BTN_ELECT: "Fund the Opposition"
 CYBER_BTN_ESPION: "Technology Theft"
 CYBER_BTN_COMMS: "Cable Tapping"
 CYBER_BTN_FIN: "Currency Speculation"
 CYBER_BTN_LOG: "Port and Union Strikes"
 CYBER_BTN_SLEEP: "Plant Illegals"
 CYBER_BTN_DECEPT: "Disinformation Campaign"
 CYBER_BTN_ZERO: "Wet Affairs"
 CYBER_BTN_HARDEN: "Counter-Intelligence Sweep"
 CYBER_BTN_CNTRINT: "Mole Hunt"
 CYBER_BTN_ATTRIB: "Defector Debriefing"
 CYBER_GPS_BTN_TT_DELAYED: "Powerful jamming transmitters near the border and on board 'fishing trawlers' drown the target's military radio nets in noise. Field commanders lose contact with their units, artillery spotters fall silent and even routine manoeuvres turn into confusion."
 CYBER_SIGINT_BTN_TT_DELAYED: "From a listening post on a hilltop, inside an embassy attic or aboard a 'trawler' bristling with antennas, our signals officers record the target's government, military and diplomatic traffic around the clock. Week by week the intercepts build a picture of its intentions, weaknesses and internal quarrels."
 CYBER_RADAR_BTN_TT_DELAYED: "Electronic reconnaissance flights probe the edges of the target's airspace while chaff, decoys and false transmitters flood its air-defence radars with phantom contacts. Operators chase ghosts, real aircraft slip through. The window is short, but thirty days of blind radar can decide a campaign."
 CYBER_ECON_BTN_TT_DELAYED: "Our printing presses turn out near-perfect copies of the target's banknotes, smuggled in by couriers and fed into black markets and border trade. Confidence in the currency erodes, prices climb and the economy quietly bleeds for months."
 CYBER_PROP_BTN_TT_DELAYED: "Clandestine radio stations, forged government documents, anonymous leaflets and planted newspaper stories flood the target's public sphere. The goal is not to convince but to exhaust: a population that no longer knows what to believe loses faith in every institution, including its own government."
 CYBER_ELECT_BTN_TT_DELAYED: "Suitcases of cash reach friendly parties, newspapers and trade unions. Rumours about candidates appear in the press just before polling day, rallies are disrupted and the counting is called into question. The target's institutions are not destroyed - they are quietly made untrustworthy."
 CYBER_ESPION_BTN_TT_DELAYED: "Recruited engineers, bribed clerks and front companies buying 'civilian' equipment funnel blueprints, test data and samples out of the target's laboratories and defence plants. By the time the leak is found, our designers are already building on what we took."
 CYBER_COMMS_BTN_TT_DELAYED: "Divers and engineers place taps on the target's undersea and overland telephone cables, while a tunnel under the border reaches a key exchange. Orders, cables and cabinet conversations are recorded, transcribed and delivered to our analysts - and the target keeps talking, unaware."
 CYBER_INFRA_BTN_TT_DELAYED: "Saboteurs blow up railway bridges, derail freight trains and wreck switching yards and power lines across the country. Repair crews are overwhelmed as damage piles up in several places at once. The destruction is real, physical and slow to undo."
 CYBER_FIN_BTN_TT_DELAYED: "Through banks and brokers abroad we sell the target's currency short at the worst possible moment, start rumours of devaluation and pull deposits at once. Reserves drain, credit dries up and the central bank scrambles - and unlike sanctions, nobody can prove who was behind it."
 CYBER_LOG_BTN_TT_DELAYED: "Our agents inside dockworkers', railwaymen's and lorry drivers' unions call wildcat strikes at the decisive moment. Ammunition ships sit unloaded, fuel trains stand still and supply convoys never leave the depot. The enemy army does not break in battle - it starves in place."
 CYBER_SLEEP_BTN_TT_DELAYED: "Patient, methodical, invisible. Illegals under false identities settle into the target's ministries, factories and universities and wait. For the next year our network sits in place, ready to be activated - and the target may have no secrets left at all."
 CYBER_CRIT_BTN_TT_DELAYED: "Coordinated sabotage teams strike power stations, refineries, assembly lines and transport hubs in a single night. Industrial output stops, supply chains snap and the government is left reeling across every sector at once - a strategic bombing campaign without a single aircraft."
 CYBER_DECEPT_BTN_TT_DELAYED: "We do not attack the target's industry. We attack its judgement. Forged intelligence reports, planted documents, double agents feeding false information and stories placed in friendly newspapers abroad. Every decision the target takes may rest on a reality we invented."
 CYBER_ZERO_BTN_TT_DELAYED: "The most secret department of our service is given the green light. Plant directors, chief engineers and key officials die in 'accidents', poisonings and car bombs while charges detonate in the plants they ran. By the time anyone understands what happened, the damage cannot be undone."
 CYBER_HARDEN_BTN_TT_DELAYED: "Security officers vet personnel, tighten access to ministries and plants, change cipher keys and close the doors foreign services like to use. The work is grey and thankless, but every door we close is one less way in for the enemy."
 CYBER_CNTRINT_BTN_TT_DELAYED: "Our counter-intelligence officers go through files, surveillance reports and travel records, looking for the tell-tale signs of a foreign hand: unexplained money, secret meetings, documents copied without reason. A mole we know about is far less dangerous than one we don't."
 CYBER_ATTRIB_BTN_TT_DELAYED: "A defector from the other side is flown to a safe house and debriefed for weeks. Names, codewords, dead drops and case officers - piece by piece, we reconstruct who was behind the recent operations against us. Naming the culprit is the first step towards answering them."
