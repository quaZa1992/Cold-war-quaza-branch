 cyber_sigint_surveillance_tracking: "Listening Post Active"
 cyber_sigint_surveillance_tracking_desc: "Our signals officers are recording the target's government, military and diplomatic traffic, gathering intelligence far faster than by ordinary means. The operation will run for approximately 180 days."
 cyber_radar_spoofing_tracking: "Radar Deception Active"
 cyber_radar_spoofing_tracking_desc: "Reconnaissance flights, decoys and false transmitters are blinding the target's air-defence radars. The operation will conclude within 30 days."
 cyber_election_interference_tracking: "Funding the Opposition"
 cyber_election_interference_tracking_desc: "Our money and agents are backing friendly parties, newspapers and unions in the target, eroding public confidence in the government. The operation will run for approximately 180 days."
 cyber_industrial_espionage_tracking: "Technology Theft Active"
 cyber_industrial_espionage_tracking_desc: "Recruited engineers and front companies are smuggling blueprints and samples out of the target's laboratories and defence plants. The operation will run for approximately 120 days."
 cyber_comms_intercept_tracking: "Cable Tap Active"
 cyber_comms_intercept_tracking_desc: "Our taps on the target's telephone and telegraph cables are delivering government and diplomatic conversations to our analysts. The operation will run for approximately 180 days."
 cyber_financial_system_attack_tracking: "Currency Speculation Active"
 cyber_financial_system_attack_tracking_desc: "Through banks and brokers abroad we are draining the target's currency reserves and credit. The operation will run for approximately 150 days."
 cyber_logistics_disruption_tracking: "Port and Union Strikes Active"
 cyber_logistics_disruption_tracking_desc: "Our agents in the target's dockworkers' and railwaymen's unions are paralysing military supply. The operation will conclude within 90 days."
 cyber_sleeper_network_tracking: "Illegals in Place"
 cyber_sleeper_network_tracking_desc: "Our illegals have settled into the target's ministries, factories and universities. Their presence makes future operations faster and cheaper for as long as they stay undiscovered, up to one year."
 cyber_deception_campaign_tracking: "Disinformation Campaign Active"
 cyber_deception_campaign_tracking_desc: "Forged reports, planted documents and double agents are feeding false information to the target's leadership. The campaign will run for approximately 180 days."
 cyber_zero_day_strike_tracking: "Wet Affairs: Aftermath"
 cyber_zero_day_strike_tracking_desc: "Our executive action against the target's plant directors, engineers and key installations has been carried out. The operation is complete; this entry will expire as the initial chaos subsides."
 cyber_network_hardening_complete_tt: "Counter-intelligence sweep complete. Personnel have been vetted, cipher keys changed and access to sensitive sites tightened."
 cyber_counter_intrusion_complete_tt: "Mole hunt complete. Every foreign agent and network we uncovered has been rolled up."
 cyber_attribution_hunt_complete_tt: "Defector debriefing complete. Our analysts have finished reviewing recent hostile operations."
