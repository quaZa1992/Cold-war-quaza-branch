 cyber_propaganda_tracking_complete_tt: "Black propaganda resolved. Our clandestine broadcasts and leaflets have run their course."
 cyber_infra_tracking_complete_tt: "Rail and bridge sabotage resolved. Our sabotage teams have finished their campaign against the target's transport network."
 cyber_crit_tracking_complete_tt: "Industrial sabotage resolved. Our teams have struck the target's most vital plants and installations."
 cyber_sigint_surveillance_tracking_complete_tt: "Listening post operation resolved. Our signals officers have finished collecting the target's traffic."
 cyber_radar_spoofing_tracking_complete_tt: "Radar deception resolved. Our reconnaissance and decoy flights have ended."
 cyber_election_interference_tracking_complete_tt: "Funding of the opposition resolved. Our covert campaign around the target's elections has ended."
 cyber_industrial_espionage_tracking_complete_tt: "Technology theft resolved. Our agents have smuggled out the targeted designs and research."
 cyber_comms_intercept_tracking_complete_tt: "Cable tapping resolved. Our taps on the target's lines have delivered what they could."
 cyber_financial_system_attack_tracking_complete_tt: "Currency speculation resolved. Our operation against the target's reserves and credit has ended."
 cyber_logistics_disruption_tracking_complete_tt: "Port and union strikes resolved. Our agents have ended their campaign against the target's supply lines."
 cyber_sleeper_network_tracking_complete_tt: "Illegals planted. Our network is in place inside the target's institutions, ready for activation."
 cyber_deception_campaign_tracking_complete_tt: "Disinformation campaign resolved. Our false trails and forged reports have been laid."
 cyber_zero_day_strike_tracking_complete_tt: "Wet affairs resolved. The executive action against the target's key people and installations has been carried out."
 cyber_network_hardening_active: "Security Tightened"
 cyber_network_hardening_active_desc: "Our security services have vetted personnel, changed cipher keys and sealed access to ministries and defence plants. Foreign operations against us are far less likely to succeed while these measures last."
 cyber_counter_intrusion_active: "Mole Hunt"
 cyber_counter_intrusion_active_desc: "Counter-intelligence officers are combing files, surveillance reports and travel records for foreign agents. Vigilance is heightened across the entire state apparatus."
 cyber_attribution_hunt_active: "Defector Debriefing"
 cyber_attribution_hunt_active_desc: "A defector is revealing names, codewords and dead drops of the services working against us. What we learn sharpens our defences and points to the culprit."
 MD_cyber.201.t: "Mole Hunt: Agents Uncovered"
 MD_cyber.201.d: "Our counter-intelligence officers have finished their hunt. Foreign agents, listening devices and an entire network of informers have been uncovered and rolled up. Our house is clean - for now."
 MD_cyber.201.a: "Good work. Stay vigilant."
 MD_cyber.202.t: "Mole Hunt: Nothing Found"
 MD_cyber.202.d: "Our counter-intelligence officers have finished their hunt through ministries and defence plants. No foreign agents or listening devices were found. Either we are clean, or they are better than we think."
 MD_cyber.202.a: "Maintain the watch."
 MD_cyber.1.t: "Operation Successful"
 MD_cyber.1.d: "Our agents have carried out the operation. No trace was left behind, and the target has no indication of our involvement."
 MD_cyber.1.a: "Excellent work."
 MD_cyber.2.t: "Foreign Sabotage Suspected"
 MD_cyber.2.d: "Our security services have found clear signs of a foreign operation on our soil. Whoever was behind it covered their tracks well. We cannot determine who is responsible."
 MD_cyber.2.a: "Tighten security."
 MD_cyber.3.t: "Covert Operation by [?disp_name_agressor.GetNameWithFlag] Exposed"
 MD_cyber.3.d: "Our security services have caught agents working for [?disp_name_agressor.GetNameWithFlag]. The operation against us was deliberate and targeted. Their diplomats have been expelled and a formal protest has been lodged."
 MD_cyber.3.a: "Expel their diplomats."
 MD_cyber.4.t: "Operation Aborted"
 MD_cyber.4.d: "Our agents could not get close enough to the target. The operation was called off before any action was taken. More preparation is needed."
 MD_cyber.4.a: "Regroup and assess."
 MD_cyber.11.t: "Military Radio Jammed"
 MD_cyber.11.d: "Our units report that their radio networks are drowning in noise. Commanders in the field can barely reach their troops. A foreign jamming operation is suspected."
 MD_cyber.11.a: "Switch to field telephones and couriers."
 MD_cyber.12.t: "Counterfeit Money Floods the Market"
 MD_cyber.12.d: "Banks and shops report large quantities of near-perfect forged banknotes. Confidence in our currency is slipping. Our analysts are certain this is the work of a foreign service."
 MD_cyber.12.a: "Withdraw the affected notes."
 MD_cyber.13.t: "Enemy Propaganda Spreads"
 MD_cyber.13.d: "Clandestine radio stations, anonymous leaflets and forged documents are circulating across the country. Public confidence in the government is eroding. Our analysts believe a foreign service is behind it."
 MD_cyber.13.a: "Launch a counter-propaganda campaign."
 MD_cyber.14.t: "Railways and Bridges Sabotaged"
 MD_cyber.14.d: "Bridges have been blown, freight trains derailed and power lines cut in several regions at once. Investigators have found clear evidence of organised sabotage. This is a serious escalation."
 MD_cyber.14.a: "Declare a national emergency."
 MD_cyber.15.t: "Wave of Industrial Sabotage"
 MD_cyber.15.d: "Power stations, refineries, factories and transport hubs have been hit in a single coordinated night of sabotage. The scale and precision of the attacks are unprecedented. The nation's economy is crippled."
 MD_cyber.15.a: "Mobilise everything we have."
 MD_cyber.16.t: "Our Lines Are Being Monitored"
 MD_cyber.16.d: "Foreign listening posts have been intercepting our government and military traffic. Sensitive transmissions have almost certainly been recorded by a hostile service."
 MD_cyber.16.a: "Impose strict radio discipline."
 MD_cyber.17.t: "Air-Defence Radars Deceived"
 MD_cyber.17.d: "Our air-defence radars are filling with phantom contacts and false readings. Operators are overwhelmed, and foreign reconnaissance aircraft may be exploiting the confusion."
 MD_cyber.17.a: "Switch to backup detection procedures."
 MD_cyber.18.t: "Foreign Money in Our Politics"
 MD_cyber.18.d: "Evidence has surfaced that a foreign service is funding parties, newspapers and unions in our country and spreading rumours to deepen our political divisions."
 MD_cyber.18.a: "Denounce foreign interference."
 MD_cyber.19.t: "Technology Stolen"
 MD_cyber.19.d: "Blueprints, test data and samples have disappeared from our laboratories and defence plants. Several engineers are under suspicion. The full extent of the theft is still being assessed."
 MD_cyber.19.a: "Vet all personnel with clearance."
 MD_cyber.110.t: "Cable Tap Discovered"
 MD_cyber.110.d: "Engineers have found a foreign tap on one of our most important telephone cables. Our military and diplomatic conversations have been recorded for who knows how long."
 MD_cyber.110.a: "Rip it out and change every code."
 MD_cyber.111.t: "Run on the Currency"
 MD_cyber.111.d: "Massive speculation against our currency on foreign markets, rumours of devaluation and sudden withdrawals of deposits are draining the central bank's reserves. The attack appears orchestrated."
 MD_cyber.111.a: "Declare a financial emergency."
 MD_cyber.112.t: "Wildcat Strikes Paralyse Supply"
 MD_cyber.112.d: "Dockworkers, railwaymen and lorry drivers have walked out at the worst possible moment. Ammunition and fuel are stuck in ports and depots, and units at the front report shortages. Foreign agitators are suspected."
 MD_cyber.112.a: "Send in the army to move supplies."
 MD_cyber.113.t: "Spy Ring Uncovered"
 MD_cyber.113.d: "Our security services have uncovered agents living under false identities inside our ministries and factories. They are well trained and have probably been in place for years."
 MD_cyber.113.a: "Begin a thorough security review."
 MD_cyber.114.t: "Our Intelligence Has Been Poisoned"
 MD_cyber.114.d: "Our intelligence services have discovered a systematic campaign of forged reports and planted documents. Our leadership and military commanders may have been acting on deliberately false information."
 MD_cyber.114.a: "Establish a task force to verify our sources."
 MD_cyber.115.t: "Wet Affairs"
 MD_cyber.115.d: "Plant directors, engineers and officials have died in a string of 'accidents' and assassinations, while explosions ripped through the installations they ran. Industry and infrastructure have been badly hit."
 MD_cyber.115.a: "Hunt down the killers."
 cyber_propaganda_ops_malus: "Enemy Propaganda"
 cyber_propaganda_ops_malus_desc: "Clandestine broadcasts, leaflets and forged documents are eroding public confidence in our government and institutions, weakening political output and national cohesion."
 cyber_gps_jamming_malus: "Military Radio Jammed"
 cyber_gps_jamming_malus_desc: "Foreign jamming transmitters are drowning out our military radio networks, severely hampering troop coordination and battlefield awareness."
 cyber_economic_disruption_malus: "Counterfeit Money in Circulation"
 cyber_economic_disruption_malus_desc: "Large quantities of forged banknotes are undermining confidence in our currency and dragging down economic output. Recovery will take time."
 cyber_infrastructure_damage_malus: "Sabotaged Transport Network"
 cyber_infrastructure_damage_malus_desc: "Blown bridges, wrecked railways and cut power lines are hampering logistics, construction and supply distribution."
 cyber_critical_strike_malus: "Wave of Industrial Sabotage"
 cyber_critical_strike_malus_desc: "A coordinated sabotage campaign has crippled our power stations, factories and supply chains at once. Recovery will be long and painful."
 cyber_sigint_surveillance_malus: "Lines Under Surveillance"
 cyber_sigint_surveillance_malus_desc: "Foreign listening posts are recording our government and military traffic, hampering coordinated political action."
 cyber_radar_spoofing_malus: "Radars Deceived"
 cyber_radar_spoofing_malus_desc: "Decoys, chaff and false transmitters are flooding our air-defence radars with phantom contacts, degrading detection and interception."
 cyber_election_interference_malus: "Foreign-Funded Opposition"
 cyber_election_interference_malus_desc: "Foreign money and rumours are eroding public confidence and deepening our domestic political divisions."
 cyber_industrial_espionage_malus: "Technology Stolen"
 cyber_industrial_espionage_malus_desc: "Blueprints and research data have been smuggled out of our laboratories and defence plants, setting back our development programmes."
 cyber_comms_intercept_malus: "Lines Tapped"
 cyber_comms_intercept_malus_desc: "Our military and diplomatic telephone and cable traffic has been tapped. Operational security is degraded and coordination is suffering."
 cyber_financial_system_attack_malus: "Run on the Currency"
 cyber_financial_system_attack_malus_desc: "Orchestrated speculation against our currency is draining reserves and choking credit across the economy."
 cyber_logistics_disruption_malus: "Strikes Paralyse Supply"
 cyber_logistics_disruption_malus_desc: "Wildcat strikes in ports, railways and haulage are holding up military supply. Units at the front are experiencing shortages."
 cyber_sleeper_network_malus: "Infiltrated by Illegals"
 cyber_sleeper_network_malus_desc: "Foreign agents under false identities have settled into our ministries and factories, giving a hostile service lasting access to our secrets."
 cyber_deception_campaign_malus: "Intelligence Poisoned"
 cyber_deception_campaign_malus_desc: "Our leadership and commanders have been acting on forged reports and planted documents. Coordination and situational awareness are severely degraded."
 cyber_zero_day_strike_malus: "Wet Affairs"
 cyber_zero_day_strike_malus_desc: "A string of assassinations and bombings has struck down key engineers, plant directors and the installations they ran."
 upgrade_establish_cyber_operations_division: "Special Activities Division"
 upgrade_establish_cyber_operations_division_desc: "Establish a dedicated division for deniable operations abroad: sabotage, subversion, propaganda and agent networks. This division unlocks §YCovert Action§! operations."
 upgrade_offensive_cyber_operations: "Sabotage and Subversion Directorate"
 upgrade_offensive_cyber_operations_desc: "Expand the division with trained sabotage teams, forgers and agent handlers, enabling more ambitious operations."
 upgrade_cyber_warfare_operational_planning: "Active Measures Service"
 upgrade_cyber_warfare_operational_planning_desc: "Turn the division into a full active measures service able to coordinate sabotage, disinformation and agent networks against well-protected targets."
 upgrade_defensive_cyber_operations: "Counter-Intelligence Directorate"
 upgrade_defensive_cyber_operations_desc: "Build a dedicated directorate that vets personnel, hunts moles, protects our ciphers and hides our own hand."
 upgrade_cyber_elite: "Executive Action Section"
 upgrade_cyber_elite_desc: "Create the most secret section of the service - trained for assassination and spectacular sabotage against even the best-protected targets."
