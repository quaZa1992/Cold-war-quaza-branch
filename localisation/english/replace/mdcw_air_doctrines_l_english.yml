l_english:
# IMPERIA COLD WAR — Air Command doctrine expansion and balance.
 GRAND_DOCTRINE_LOCAL_AIRSPACE_DEFENCE_DESC:0 "Cold War territorial air defence combined warning networks, interceptors and ground defences. Protecting national airspace favours local readiness, at the expense of distant operations and strategic bombing."
 GRAND_DOCTRINE_STRATEGIC_DESTRUCTION_DESC:0 "Wartime bomber commands and Cold War strategic forces organised sustained attacks on infrastructure. Long campaigns need considerable fuel and divert effort from defensive interception."
 GRAND_DOCTRINE_AIR_BATTLEFIELD_SUPPORT_DESC:0 "Korean War air-ground cooperation shaped later tactical air commands. Close support aids the land battle, but sustained flying consumes fuel and diverts air-superiority resources."
 GRAND_DOCTRINE_AIR_SUPREMACY_DESC:0 "Cold War fighter commands sought control of contested airspace through patrols, detection and escort. The commitment consumes fuel and reduces the effort available for close air support."
 GRAND_DOCTRINE_AUTONOMOUS_AIR_DESC:0 "Later unmanned air campaigns combined remote crews and coordinated strike systems. Advanced control technology is required; specialist staffing and prolonged qualification remain costly."
 GRAND_DOCTRINE_MIXED_ROLE_DESC:0 "Cold War medium-sized air forces maintained several roles within limited fleets. Flexible commands support varied missions, but broader qualifications demand more personnel and slower training progression."
 GRAND_DOCTRINE_INTEGRATED_AIR_WARFARE_DESC:0 "Cold War joint air planning coordinated fighters, attack aircraft and support elements. Combined operations gain flexibility, but require additional fuel and a substantial coordinating staff."
 SUBDOCTRINE_OPERATIONS_CENTRAL_COMMAND_DESC:0 "Radar-led Cold War commands concentrated information and assigned missions centrally. Coordination improves, but administrative staff cost more and restricted local responsibility slows operational learning."
 SUBDOCTRINE_OPERATIONS_DETACHED_COMMAND_DESC:0 "Theatre and regional commands delegated authority to local air leaders. Independent judgement preserves experience, but duplicated support consumes more fuel and distant escort is harder to coordinate."
 SUBDOCTRINE_OPERATIONS_NAVAL_AIR_DESC:0 "Wartime carrier experience shaped Cold War naval aviation. Fleet-directed aircraft concentrate on maritime operations, with greater fuel demand and less attention to land close support."
 SUBDOCTRINE_DESIGN_MULTIROLE_DESC:0 "Cold War fighter-bombers combined several missions in one aircraft family. Versatile equipment reduces the need for separate designs, but its compromises limit peak agility."
 SUBDOCTRINE_DESIGN_DEDICATED_DESC:0 "Cold War air forces also procured aircraft for distinct combat tasks. Specialist performance improves, but maintaining separate fleets requires more trained personnel."
 SUBDOCTRINE_DESIGN_HEAVY_DESC:0 "Heavy Cold War aircraft carried large payloads, sensors and fuel reserves. Endurance and specialist equipment come with higher production cost and less agility."
 SUBDOCTRINE_DESIGN_DRONE_DESC:0 "Early unmanned reconnaissance led to later remotely piloted aircraft designs. Lightweight construction limits production demands, but protection remains weaker even after refinement."
 SUBDOCTRINE_DESIGN_STEALTH_DESC:0 "Late Cold War low-observable development prioritised concealment and survivability. Suitable technology is required; specialised construction costs more and configuration compromises reduce range."
 SUBDOCTRINE_DESIGN_EW_DESC:0 "Vietnam-era and later electronic support aircraft collected signals and assisted strike packages. Specialist crews cost more, while electronic equipment competes with offensive weapon employment."
 SUBDOCTRINE_DESIGN_MODULAR_DESC:0 "Cold War equipment commonality and later modular systems simplified support and adaptation. Flexible interfaces aid service, but cost coordinating personnel and limit peak attack performance."
 SUBDOCTRINE_HEAVY_STRATEGIC_BOMBER_DESC:0 "Second World War bomber commands evolved into Cold War strategic forces. Long-range bombing needs fuel and disciplined crews, while heavy aircraft retain limited agility."
 SUBDOCTRINE_HEAVY_NAVAL_BOMBERS_DESC:0 "Cold War maritime patrol aircraft combined long endurance with specialised sensors and weapons. Patrol formations gain maritime capability, but their configurations reduce agility."
 SUBDOCTRINE_HEAVY_GUNSHIPS_DESC:0 "Vietnam-era gunships provided sustained fire where enemy air power was limited. Specialist crews improve support, but slow aircraft remain vulnerable in contested airspace."
 SUBDOCTRINE_HEAVY_AEW_DESC:0 "Cold War airborne warning extended surveillance and battle management beyond ground radar. Control networks aid other formations, but large support aircraft consume fuel and specialist personnel."
 SUBDOCTRINE_HEAVY_AIRLIFT_DESC:0 "Berlin and subsequent Cold War deployments demonstrated the value of strategic airlift. Long routes and sustained schedules require fuel and a substantial support establishment."
 SUBDOCTRINE_HEAVY_REFUELING_DESC:0 "Cold War tankers extended the practical reach of combat aircraft. Better procedures improve coordination, but tanker sorties still increase total fuel demand and personnel costs."
 SUBDOCTRINE_MULTIROLE_MIXED_DESC:0 "Cold War multirole squadrons shared aircraft across several tasks. Balanced capability avoids a single narrow mission, but broader qualifications cost personnel and slow training progression."
 SUBDOCTRINE_MULTIROLE_STRIKE_DESC:0 "Cold War fighter-bombers concentrated on carrying weapons to tactical targets. Attack proficiency improves, but loaded configurations sacrifice agility."
 SUBDOCTRINE_MULTIROLE_OPERATIONS_DESC:0 "Cold War commands integrated fighter-bombers into varied air missions. Flexible packages combine capabilities, but their equipment and preparation limit range and require additional staff."
 SUBDOCTRINE_MULTIROLE_DOMINANCE_DESC:0 "Later Cold War multirole fighters could concentrate on air combat when required. Fighter employment improves at the expense of ground-attack and bombing proficiency."
 SUBDOCTRINE_MULTIROLE_CARRIER_DESC:0 "Cold War carrier aircraft combined fleet defence and attack roles. Flexible deck operations require costly crews and longer qualification before those skills can be used effectively."
 SUBDOCTRINE_STRIKE_CAS_DESC:0 "Korean and Vietnam War experience shaped dedicated close-support aircraft. Ground-attack configurations support troops, but sacrifice range and air-to-air performance."
 SUBDOCTRINE_STRIKE_NAVAL_DESC:0 "Cold War naval strike crews trained for navigation, search and maritime weapon release. Specialist personnel cost more, while attack configurations reduce aircraft agility."
 SUBDOCTRINE_STRIKE_MUNITIONS_DESC:0 "Late Cold War precision and support arrangements improved attack preparation. Specialist arming personnel cost more, and complex weapon preparation reduces mission efficiency."
 SUBDOCTRINE_STRIKE_SEAD_DESC:0 "Vietnam-era defence-suppression training and later coordinated packages addressed increasingly complex threats. Specialist preparation improves strike survivability, but costs staff and diverts ground firepower."
 SUBDOCTRINE_STRIKE_INTERDICTION_DESC:0 "Cold War interdiction planning sought targets beyond the immediate battle. Deep missions consume fuel and draw aircraft away from close support of troops at the front."
 SUBDOCTRINE_STRIKE_CAMPAIGN_DESC:0 "Cold War air campaigns attempted to disrupt movement and reinforcement over time. Sustained attack schedules require more fuel and a permanent planning staff."
 SUBDOCTRINE_FIGHTER_LIGHT_DESC:0 "Light Cold War fighters offered relatively economical air combat and local readiness. Their size limits operating radius and protection even when crews become proficient."
 SUBDOCTRINE_FIGHTER_AIR_SUP_DESC:0 "Dedicated Cold War fighters prioritised detection, combat and escort. Specialised airframes deliver strong air-to-air performance, but cost more industrial production."
 SUBDOCTRINE_FIGHTER_BVR_DESC:0 "Cold War radar and missile training developed beyond-visual-range engagements. Suitable aircraft and weapons remain necessary; radar-centred employment trades agility and specialist staffing for detection and attack."
 SUBDOCTRINE_FIGHTER_WVR_DESC:0 "Vietnam-era experience renewed close-combat instruction for fighter crews. Manoeuvre and mutual awareness improve, but qualification progresses more slowly and the chosen profiles favour shorter range."
 SUBDOCTRINE_FIGHTER_STEALTH_DESC:0 "Late Cold War low-observable work informed later fighter employment. Concealment requires appropriate technology and costly specialist support, while restrictive configurations limit attack flexibility."
 SUBDOCTRINE_FIGHTER_INTERCEPTOR_DESC:0 "Cold War interceptors defended threatened sectors through controlled scrambles. Strong interception sacrifices prolonged air-superiority patrols and distant escort commitments."
 SUBDOCTRINE_DRONE_MALE_DESC:0 "Long-endurance reconnaissance preceded operational armed MALE campaigns after the Cold War. Advanced drone systems are required; vulnerable platforms still need a substantial control staff."
 SUBDOCTRINE_DRONE_UCAS_DESC:0 "Carrier UCAS programmes developed after the Cold War. Advanced unmanned systems and an actual carrier are required; deck qualification and remote control demand more personnel and training."
 SUBDOCTRINE_DRONE_LOITERING_DESC:0 "Later unmanned strike systems combined expendable aircraft with target preparation. Suitable technology is required; compact platforms trade range and control personnel for the chosen attack role."
 SUBDOCTRINE_DRONE_COUNTER_DESC:0 "Cold War point defence addressed small and low-flying threats before later drone-specific systems. Local warning and interception protect installations, but require staff and divert distant escort effort."
 SUBDOCTRINE_DRONE_SWARM_DESC:0 "Large coordinated unmanned formations are a post-Cold-War capability. Advanced control and expendable-aircraft technology are required; vulnerable platforms and difficult coordination remain constraints."
 GRAND_DOCTRINE_MDCW_DISPERSED_AIR_DEFENCE:0 "Dispersed Air Defence"
 GRAND_DOCTRINE_MDCW_DISPERSED_AIR_DEFENCE_DESC:0 "Swedish Bas 60 and Bas 90 dispersed aircraft and ground crews. Mobile servicing and rapid repair sustain local defence, but duplicate services cost more personnel and favour a shorter operating radius."
 GRAND_DOCTRINE_MDCW_SELECTIVE_AIR_DENIAL:0 "Selective Air Denial"
 GRAND_DOCTRINE_MDCW_SELECTIVE_AIR_DENIAL_DESC:0 "Finnish defensive priorities and North Vietnamese controlled attacks conserved smaller fighter forces. Selected interceptions trade sustained air-superiority patrols and distant escort for local effectiveness."
 GRAND_DOCTRINE_MDCW_OFFENSIVE_COUNTER_AIR:0 "Offensive Counter Air"
 GRAND_DOCTRINE_MDCW_OFFENSIVE_COUNTER_AIR_DESC:0 "Israeli attacks in 1967 demonstrated rehearsed strikes against enemy air bases. Coordinated packages improve attack preparation, but consume more fuel and divert effort from home air defence."
 GRAND_DOCTRINE_MDCW_MARITIME_AIR_DENIAL:0 "Maritime Air Denial"
 GRAND_DOCTRINE_MDCW_MARITIME_AIR_DENIAL_DESC:0 "Argentine air attacks in 1982 threatened a stronger fleet. Maritime search and concentrated strikes contest the sea approaches, sacrificing close air support and broad air-superiority operations."
 GRAND_DOCTRINE_MDCW_COUNTERINSURGENCY_AIR_SUPPORT:0 "Counterinsurgency Air Support"
 GRAND_DOCTRINE_MDCW_COUNTERINSURGENCY_AIR_SUPPORT_DESC:0 "Portuguese African operations combined light aircraft with dispersed ground support. Sustained tactical assistance suits limited hostile air power, sacrificing fighter combat and strategic bombing."
 SUBDOCTRINE_MDCW_DISPERSED_SERVICING_TEAMS:0 "Dispersed Servicing Teams"
 SUBDOCTRINE_MDCW_DISPERSED_SERVICING_TEAMS_DESC:0 "Swedish dispersed-base practice sent servicing crews beyond main airfields. Mobile teams restore operations, but duplicated services need more personnel and complicate distant escort commitments."
 mdcw_dispersed_servicing_teams_stage_1:0 "Mobile Repair Sections"
 mdcw_dispersed_servicing_teams_stage_1_desc:0 "Mobile sections carry the tools and spares needed to restore dispersed airfields."
 mdcw_dispersed_servicing_teams_stage_2:0 "Servicing Drills"
 mdcw_dispersed_servicing_teams_stage_2_desc:0 "Crews rehearse inspections and servicing under austere operating conditions."
 mdcw_dispersed_servicing_teams_stage_3:0 "Local Readiness Teams"
 mdcw_dispersed_servicing_teams_stage_3_desc:0 "Local readiness teams prepare aircraft for brief defensive sorties."
 mdcw_dispersed_servicing_teams_stage_4:0 "Distributed Spare Stocks"
 mdcw_dispersed_servicing_teams_stage_4_desc:0 "Distributed spare stocks reduce dependence on a single servicing centre."
 mdcw_dispersed_servicing_teams_stage_5:0 "Recovered Flight Schedules"
 mdcw_dispersed_servicing_teams_stage_5_desc:0 "Recovered flight schedules return serviced aircraft to interception duties."
 SUBDOCTRINE_MDCW_ADVERSARY_AIR_TRAINING:0 "Adversary Air Training"
 SUBDOCTRINE_MDCW_ADVERSARY_AIR_TRAINING_DESC:0 "Aggressor training and Red Flag from 1975 confronted crews with unfamiliar threats. Combat preparation preserves experience, but maintaining realistic exercises requires more fuel and instructor staff."
 mdcw_adversary_air_training_stage_1:0 "Dissimilar Combat Training"
 mdcw_adversary_air_training_stage_1_desc:0 "Dissimilar aircraft confront crews with unfamiliar engagement problems."
 mdcw_adversary_air_training_stage_2:0 "Threat Recognition"
 mdcw_adversary_air_training_stage_2_desc:0 "Threat recognition exercises prepare inexperienced crews for contested airspace."
 mdcw_adversary_air_training_stage_3:0 "Recorded Debriefings"
 mdcw_adversary_air_training_stage_3_desc:0 "Recorded debriefings turn operational experience into shared lessons."
 mdcw_adversary_air_training_stage_4:0 "Complex Exercise Packages"
 mdcw_adversary_air_training_stage_4_desc:0 "Complex exercises train crews to coordinate several aircraft roles."
 mdcw_adversary_air_training_stage_5:0 "Instructor Feedback Cycles"
 mdcw_adversary_air_training_stage_5_desc:0 "Instructor feedback preserves combat experience and improves specialist leadership."
 SUBDOCTRINE_MDCW_FIELD_MAINTAINABLE_DESIGNS:0 "Field Maintainable Designs"
 SUBDOCTRINE_MDCW_FIELD_MAINTAINABLE_DESIGNS_DESC:0 "Cold War Swedish requirements favoured dispersed operation and simple servicing. Maintainable tactical airframes reduce accidents, production and staff costs, accepting a modest speed limitation."
 mdcw_field_maintainable_designs_stage_1:0 "Accessible Service Panels"
 mdcw_field_maintainable_designs_stage_1_desc:0 "Accessible panels simplify routine inspection and specialist servicing."
 mdcw_field_maintainable_designs_stage_2:0 "Standard Ground Equipment"
 mdcw_field_maintainable_designs_stage_2_desc:0 "Standard ground equipment reduces the production burden of tactical fleets."
 mdcw_field_maintainable_designs_stage_3:0 "Field Fault Isolation"
 mdcw_field_maintainable_designs_stage_3_desc:0 "Field fault-isolation procedures improve operating safety away from main bases."
 mdcw_field_maintainable_designs_stage_4:0 "Interchangeable Service Sets"
 mdcw_field_maintainable_designs_stage_4_desc:0 "Interchangeable servicing equipment reduces demands on specialist ground crews."
 mdcw_field_maintainable_designs_stage_5:0 "Austere Servicing Standards"
 mdcw_field_maintainable_designs_stage_5_desc:0 "Austere servicing standards combine simpler production with safer operation."
 SUBDOCTRINE_MDCW_RUGGED_ATTACK_DESIGNS:0 "Rugged Attack Designs"
 SUBDOCTRINE_MDCW_RUGGED_ATTACK_DESIGNS_DESC:0 "Light attack aircraft supported troops in Korea and the Portuguese African wars. Robust platforms favour ground fire and recoverability at the expense of speed and air-to-air performance."
 mdcw_rugged_attack_designs_stage_1:0 "Protected Critical Systems"
 mdcw_rugged_attack_designs_stage_1_desc:0 "Protection of critical systems improves the survival of ground-attack aircraft."
 mdcw_rugged_attack_designs_stage_2:0 "Field Damage Repairs"
 mdcw_rugged_attack_designs_stage_2_desc:0 "Field damage checks and repair procedures reduce operating accidents."
 mdcw_rugged_attack_designs_stage_3:0 "Stable Attack Passes"
 mdcw_rugged_attack_designs_stage_3_desc:0 "Stable attack passes improve the ground-attack performance of support aircraft."
 mdcw_rugged_attack_designs_stage_4:0 "Survivable Control Runs"
 mdcw_rugged_attack_designs_stage_4_desc:0 "Repairable aircraft structures improve recovery after damage."
 mdcw_rugged_attack_designs_stage_5:0 "Sustained Attack Service"
 mdcw_rugged_attack_designs_stage_5_desc:0 "Attack-platform refinements strengthen the ground-support role."
 SUBDOCTRINE_MDCW_TACTICAL_AIRLIFT_PROCEDURES:0 "Tactical Airlift Procedures"
 SUBDOCTRINE_MDCW_TACTICAL_AIRLIFT_PROCEDURES_DESC:0 "Berlin in 1948 and 1949 demonstrated disciplined airlift schedules and maintenance. Specialist transport crews improve reach and delivery, but require more personnel and slower qualification."
 mdcw_tactical_airlift_procedures_stage_1:0 "Route And Load Planning"
 mdcw_tactical_airlift_procedures_stage_1_desc:0 "Route planning extends the useful reach of transport airframes."
 mdcw_tactical_airlift_procedures_stage_2:0 "Transport Crew Checks"
 mdcw_tactical_airlift_procedures_stage_2_desc:0 "Transport crew checks reduce the risks of sustained airlift operations."
 mdcw_tactical_airlift_procedures_stage_3:0 "Airdrop Coordination"
 mdcw_tactical_airlift_procedures_stage_3_desc:0 "Airdrop coordination improves the organisation of arriving airborne troops."
 mdcw_tactical_airlift_procedures_stage_4:0 "Economical Transport Profiles"
 mdcw_tactical_airlift_procedures_stage_4_desc:0 "Disciplined flight planning reduces transport fuel requirements."
 mdcw_tactical_airlift_procedures_stage_5:0 "Theatre Airlift Schedules"
 mdcw_tactical_airlift_procedures_stage_5_desc:0 "Theatre airlift schedules extend the useful reach of transport airframes."
 SUBDOCTRINE_MDCW_MARITIME_SEARCH_COORDINATION:0 "Maritime Search Coordination"
 SUBDOCTRINE_MDCW_MARITIME_SEARCH_COORDINATION_DESC:0 "Norwegian Orion operations from 1969 emphasised maritime and underwater search. Specialist crews exploit fitted sensors over wide approaches, accepting less strike emphasis and higher personnel costs."
 mdcw_maritime_search_coordination_stage_1:0 "Allocated Search Sectors"
 mdcw_maritime_search_coordination_stage_1_desc:0 "Allocated search sectors extend maritime patrol coverage."
 mdcw_maritime_search_coordination_stage_2:0 "Sensor Crew Coordination"
 mdcw_maritime_search_coordination_stage_2_desc:0 "Sensor crew coordination improves the use of submarine-detection equipment."
 mdcw_maritime_search_coordination_stage_3:0 "Contact Classification"
 mdcw_maritime_search_coordination_stage_3_desc:0 "Contact-classification procedures help patrol crews identify surface contacts."
 mdcw_maritime_search_coordination_stage_4:0 "Extended Patrol Navigation"
 mdcw_maritime_search_coordination_stage_4_desc:0 "Extended patrol navigation increases maritime patrol range."
 mdcw_maritime_search_coordination_stage_5:0 "Coordinated Underwater Search"
 mdcw_maritime_search_coordination_stage_5_desc:0 "Coordinated underwater search improves submarine detection."
 SUBDOCTRINE_MDCW_LOW_LEVEL_PENETRATION:0 "Low Level Penetration"
 SUBDOCTRINE_MDCW_LOW_LEVEL_PENETRATION_DESC:0 "RAF Tornado attacks in 1991 exposed both the purpose and risks of low-level penetration. Fast strike profiles improve survivability, but reduce range and bombing performance while raising accident risk."
 mdcw_low_level_penetration_stage_1:0 "Low Level Navigation"
 mdcw_low_level_penetration_stage_1_desc:0 "Low-level navigation procedures improve survival on defended approaches."
 mdcw_low_level_penetration_stage_2:0 "Fast Ingress Profiles"
 mdcw_low_level_penetration_stage_2_desc:0 "Fast ingress profiles improve the speed of multirole and strike aircraft."
 mdcw_low_level_penetration_stage_3:0 "Rehearsed Attack Runs"
 mdcw_low_level_penetration_stage_3_desc:0 "Rehearsed attack runs improve ground-attack performance."
 mdcw_low_level_penetration_stage_4:0 "Egress Discipline"
 mdcw_low_level_penetration_stage_4_desc:0 "Disciplined egress procedures improve the survivability of returning aircraft."
 mdcw_low_level_penetration_stage_5:0 "Integrated Strike Profiles"
 mdcw_low_level_penetration_stage_5_desc:0 "Integrated strike profiles strengthen the ground-attack role."
 SUBDOCTRINE_MDCW_STAND_OFF_STRIKE_PACKAGES:0 "Stand Off Strike Packages"
 SUBDOCTRINE_MDCW_STAND_OFF_STRIKE_PACKAGES_DESC:0 "Late Cold War strike packages combined designation, specialist support and suitable weapons. Deliberate attacks gain reach and accuracy, but cost more personnel and divert immediate close-support effort."
 mdcw_stand_off_strike_packages_stage_1:0 "Weapon And Route Integration"
 mdcw_stand_off_strike_packages_stage_1_desc:0 "Weapon and route integration extends the reach of strike aircraft."
 mdcw_stand_off_strike_packages_stage_2:0 "Target Designation Procedures"
 mdcw_stand_off_strike_packages_stage_2_desc:0 "Target-designation procedures improve bombing target selection."
 mdcw_stand_off_strike_packages_stage_3:0 "Protected Strike Packages"
 mdcw_stand_off_strike_packages_stage_3_desc:0 "Protected strike packages improve the survival of multirole and strike aircraft."
 mdcw_stand_off_strike_packages_stage_4:0 "Deliberate Target Attacks"
 mdcw_stand_off_strike_packages_stage_4_desc:0 "Deliberate target preparation improves the bombing performance of strike aircraft."
 mdcw_stand_off_strike_packages_stage_5:0 "Extended Attack Planning"
 mdcw_stand_off_strike_packages_stage_5_desc:0 "Extended attack planning improves the operating range of strike packages."
 SUBDOCTRINE_MDCW_FORWARD_AIR_CONTROL:0 "Forward Air Control"
 SUBDOCTRINE_MDCW_FORWARD_AIR_CONTROL_DESC:0 "Korean War airborne controllers and ground liaison teams coordinated attacks near friendly troops. Better control strengthens close support, requiring specialist staff and diverting strategic bombing effort."
 mdcw_forward_air_control_stage_1:0 "Common Air Ground Procedures"
 mdcw_forward_air_control_stage_1_desc:0 "Air-ground liaison teams connect supporting aircraft with troops in contact."
 mdcw_forward_air_control_stage_2:0 "Controller Training"
 mdcw_forward_air_control_stage_2_desc:0 "Controlled attack procedures improve close-support employment."
 mdcw_forward_air_control_stage_3:0 "Mission Debrief Exchange"
 mdcw_forward_air_control_stage_3_desc:0 "Mission debriefs turn operational experience into shared lessons."
 mdcw_forward_air_control_stage_4:0 "Tactical Target Handover"
 mdcw_forward_air_control_stage_4_desc:0 "Controller training strengthens the effect of supporting aircraft on enemy organisation."
 mdcw_forward_air_control_stage_5:0 "Integrated Control Parties"
 mdcw_forward_air_control_stage_5_desc:0 "Integrated controller procedures improve close-support coordination."
 SUBDOCTRINE_MDCW_SEA_SKIMMING_STRIKE:0 "Sea Skimming Strike"
 SUBDOCTRINE_MDCW_SEA_SKIMMING_STRIKE_DESC:0 "Argentine pilots in 1982 attacked ships at very low altitude with bombs and missiles. Concentrated low approaches threaten fleets, but sacrifice operating radius and increase the risks of flight."
 mdcw_sea_skimming_strike_stage_1:0 "Sea Approach Navigation"
 mdcw_sea_skimming_strike_stage_1_desc:0 "Sea-approach navigation improves the survival of maritime strike aircraft."
 mdcw_sea_skimming_strike_stage_2:0 "Low Level Attack Practice"
 mdcw_sea_skimming_strike_stage_2_desc:0 "Low-level attack practice improves naval target selection."
 mdcw_sea_skimming_strike_stage_3:0 "Concentrated Weapon Release"
 mdcw_sea_skimming_strike_stage_3_desc:0 "Coordinated attack waves concentrate naval strike effort."
 mdcw_sea_skimming_strike_stage_4:0 "Coordinated Strike Waves"
 mdcw_sea_skimming_strike_stage_4_desc:0 "Maritime recognition procedures improve naval target selection."
 mdcw_sea_skimming_strike_stage_5:0 "Rehearsed Disengagement"
 mdcw_sea_skimming_strike_stage_5_desc:0 "Low-altitude attack practice improves the employment of maritime strike aircraft."
 SUBDOCTRINE_MDCW_AMBUSH_INTERCEPTION:0 "Ambush Interception"
 SUBDOCTRINE_MDCW_AMBUSH_INTERCEPTION_DESC:0 "Finnish defensive choices and North Vietnamese ground control favoured selected opportunities. Fighters improve brief interception engagements, accepting weaker continuous patrols and distant escort."
 mdcw_ambush_interception_stage_1:0 "Ground Controller Vectors"
 mdcw_ambush_interception_stage_1_desc:0 "Ground-control procedures direct fighters towards selected engagements."
 mdcw_ambush_interception_stage_2:0 "Coordinated Firing Passes"
 mdcw_ambush_interception_stage_2_desc:0 "Brief firing opportunities concentrate the attack of fighter sections."
 mdcw_ambush_interception_stage_3:0 "Selected Engagement Windows"
 mdcw_ambush_interception_stage_3_desc:0 "Selected engagement windows improve interception effectiveness."
 mdcw_ambush_interception_stage_4:0 "Recognition And Disengagement"
 mdcw_ambush_interception_stage_4_desc:0 "Recognition and disengagement procedures improve interception warning."
 mdcw_ambush_interception_stage_5:0 "Local Ambush Proficiency"
 mdcw_ambush_interception_stage_5_desc:0 "Practised interception windows improve brief fighter engagements."
 SUBDOCTRINE_MDCW_SECTION_MUTUAL_SUPPORT:0 "Section Mutual Support"
 SUBDOCTRINE_MDCW_SECTION_MUTUAL_SUPPORT_DESC:0 "Section tactics such as the Thach Weave in 1942 protected weaker fighters through teamwork. Mutual cover preserves formations and escorts, trading individual attack freedom and ace generation for discipline."
 mdcw_section_mutual_support_stage_1:0 "Paired Defensive Turns"
 mdcw_section_mutual_support_stage_1_desc:0 "Paired defensive turns improve the survival of cooperating fighters."
 mdcw_section_mutual_support_stage_2:0 "Wingman Discipline"
 mdcw_section_mutual_support_stage_2_desc:0 "Wingman discipline preserves experienced aircrews through repeated operations."
 mdcw_section_mutual_support_stage_3:0 "Escort Section Procedures"
 mdcw_section_mutual_support_stage_3_desc:0 "Escort procedures coordinate fighters protecting other aircraft."
 mdcw_section_mutual_support_stage_4:0 "Coordinated Disengagement"
 mdcw_section_mutual_support_stage_4_desc:0 "Coordinated disengagement improves the survival of cooperating fighters."
 mdcw_section_mutual_support_stage_5:0 "Established Section Teams"
 mdcw_section_mutual_support_stage_5_desc:0 "Established section teams preserve experienced crews through repeated operations."
 SUBDOCTRINE_MDCW_RECONNAISSANCE_RPV_OPERATIONS:0 "Reconnaissance RPV Operations"
 SUBDOCTRINE_MDCW_RECONNAISSANCE_RPV_OPERATIONS_DESC:0 "Ryan drones in Vietnam and later Israeli RPVs collected intelligence before modern armed UAV campaigns. Control and exploitation teams support reconnaissance, but need specialist staff and vulnerable platforms."
 mdcw_reconnaissance_rpv_operations_stage_1:0 "Flight Control Teams"
 mdcw_reconnaissance_rpv_operations_stage_1_desc:0 "Flight-control reports improve interception warning."
 mdcw_reconnaissance_rpv_operations_stage_2:0 "Imagery Exploitation"
 mdcw_reconnaissance_rpv_operations_stage_2_desc:0 "Imagery exploitation converts reconnaissance reports into target preparation."
 mdcw_reconnaissance_rpv_operations_stage_3:0 "Shared Reconnaissance Reports"
 mdcw_reconnaissance_rpv_operations_stage_3_desc:0 "Shared reconnaissance reports improve detection during air-superiority operations."
 mdcw_reconnaissance_rpv_operations_stage_4:0 "Operational Controller Training"
 mdcw_reconnaissance_rpv_operations_stage_4_desc:0 "Controller training improves the use of reconnaissance reports for interception warning."
 mdcw_reconnaissance_rpv_operations_stage_5:0 "Target Record Integration"
 mdcw_reconnaissance_rpv_operations_stage_5_desc:0 "Target-record integration improves bombing target selection."
 SUBDOCTRINE_MDCW_DECOY_RPV_OPERATIONS:0 "Decoy RPV Operations"
 SUBDOCTRINE_MDCW_DECOY_RPV_OPERATIONS_DESC:0 "Israeli RPVs in 1982 gathered intelligence and acted as decoys alongside strike aircraft. Coordinated support improves target preparation and survivability, but exposes unmanned platforms and requires control staff."
 mdcw_decoy_rpv_operations_stage_1:0 "Decoy Route Rehearsals"
 mdcw_decoy_rpv_operations_stage_1_desc:0 "Coordinated decoy flights support the survival of manned strike aircraft."
 mdcw_decoy_rpv_operations_stage_2:0 "Emitter Report Processing"
 mdcw_decoy_rpv_operations_stage_2_desc:0 "Emitter reports inform target preparation without automatically suppressing enemy air defences."
 mdcw_decoy_rpv_operations_stage_3:0 "Manned Unmanned Coordination"
 mdcw_decoy_rpv_operations_stage_3_desc:0 "Supporting escorts coordinate their flights with strike packages."
 mdcw_decoy_rpv_operations_stage_4:0 "Prepared Strike Support"
