l_english:
 Warsaw_Pact.1.a: "Absolutely"
 Warsaw_Pact.1.b: "Never"
 Warsaw_Pact.1.d: "[From.GetAdjective] delegations have come forth with an interesting proposition. The delegation is explaining how [From.GetNameDef] wish to sign the joint agreements and become part of the Warsaw Pact. They are requesting a hearing to begin the process of signing a new declaration of friendship and allowing [From.GetNameDef]'s entrance into our alliance."
 Warsaw_Pact.1.t: "[From.GetNameDef] wishes to join the Warsaw Pact"
 Warsaw_Pact.2.a: "Disappointing"
 Warsaw_Pact.2.d: "[SOV.GetNameDef] has rejected our request to join the Warsaw Pact."
 Warsaw_Pact.2.t: "[SOV.GetNameDef] refuses request to join the Warsaw Pact"
 Warsaw_Pact.3.a: "We accept!"
 Warsaw_Pact.3.b: "We don't have time for this."
 Warsaw_Pact.3.d: "[SOV.GetNameDef] and their allies want to invite us into the Warsaw Pact. What are we going to do?"
 Warsaw_Pact.3.t: "Invitation to the Warsaw Pact"
 Warsaw_Pact.4.a: "A Great Day!"
 Warsaw_Pact.4.b: "A New Ally"
 Warsaw_Pact.4.c: "Interesting Development"
 Warsaw_Pact.4.d: "[SOV.GetNameDef] and [ROOT.GetNameDef] have come forth today to announce [ROOT.GetNameDef]'s entrance into the Warsaw Pact. [SOV.GetNameDef] and [ROOT.GetNameDef] have decided it is in both of their best interest that [ROOT.GetNameDef] enters the alliance."
 Warsaw_Pact.4.t: "[ROOT.GetNameDef] joins the Warsaw Pact"
 Warsaw_Pact.5.a: "Good choice"
 Warsaw_Pact.5.b: "Interesting"
 Warsaw_Pact.5.d: "The leader of [ROOT.GetNameDef], [ROOT.GetLeader], has today announced the country's intention to immediately pull out of the Warsaw Pact and its affiliated command structures. This will weaken the military pact."
 Warsaw_Pact.5.t: "[ROOT.GetNameDef] leaves the Warsaw Pact!"
 Warsaw_Pact_member_tooltip: "§RFaction Special Rules§!:\n- Only communist states may join if they are at peace\n- War declarations are controlled by the faction leader\n- Countries can only be called to defensive wars\n\n§YIntegrated Soviet command planning§! gives modest organization, planning, coordination and defensive stability bonuses."
 autonomy_soviet_republic_1985: "Soviet Socialist Republic"
 nato_dissolve_soviet_union: "Dissolve the Soviet Union"
 nato_dissolve_soviet_union_desc: "Containment becomes victory only when Soviet power can no longer dominate Eurasia. Break the imperial structure that holds the union together."
 nato_open_eastern_door: "Open the Eastern Door"
 nato_open_eastern_door_desc: "The eastern half of Europe cannot remain locked behind the old bloc system forever. Bring former Warsaw Pact states into NATO's political and military orbit."
 nato_post_cold_war_order: "Post-Cold War Order"
 nato_post_cold_war_order_desc: "A durable peace requires more than a Soviet retreat. Support democratic transitions across the former Eastern Bloc and anchor Europe in the Atlantic order."
 nato_victory_over_communism: "Victory over Communism"
 nato_victory_over_communism_desc: "The Cold War is not truly over while communist power blocs can still challenge the Atlantic alliance. Push the ideology out of the great-power arena."
 stabilizing_balkans_desc: "A centralized Yugoslav state can dominate the western Balkans and resist Atlantic influence. Ensure the region is balkanized into stable successor states and no longer able to act as a unified threat."
 warsaw_break_nato_desc: "The Atlantic alliance is the main obstacle to socialist security. Split its members away from Washington, convert them, or bring them into our own camp."
 warsaw_break_nato_name: "Break NATO"
 warsaw_expand_socialism_europe_desc: "The revolution cannot remain confined to the east. Bring the workers' movement into Western and Southern Europe and fold new socialist governments into the pact."
 warsaw_expand_socialism_europe_name: "Expand Socialism in Europe"
 warsaw_global_revolution_desc: "Socialism must become a world system, not a regional fortress. Coordinate allied revolutions and bind them into a global Warsaw Pact network."
 warsaw_global_revolution_name: "Global Revolution"
 warsaw_hold_eastern_bloc_desc: "The Warsaw Pact was built to keep the socialist states of Eastern Europe bound together. Preserve the bloc through the crisis decade and keep its core members aligned until at least 1995."
 warsaw_hold_eastern_bloc_name: "Hold the Eastern Bloc"
 warsaw_integrated_high_command_desc: "The Warsaw Pact must be more than flags on a treaty. Bind the armies of Eastern Europe into one operational command structure under Soviet leadership after years of joint planning."
 warsaw_integrated_high_command_name: "Integrated High Command"
 warsaw_preserve_soviet_union_desc: "The Union is the center of the socialist world. Keep Moscow stable, communist, and able to hold the Soviet republics inside the wider socialist camp until at least 1995."
 warsaw_preserve_soviet_union_name: "Preserve the Soviet Union"
 warsaw_red_army_primacy_desc: "NATO must believe that any land war in Europe would be decided by Soviet armored mass and Warsaw Pact depth. Maintain the largest and most feared army on the continent."
 warsaw_red_army_primacy_name: "Red Army Primacy"
 warsaw_secure_third_world_allies_desc: "Anti-imperialist movements across Asia, Africa, and Latin America need backing. Protect friendly regimes and turn them into reliable partners of the socialist camp."
 warsaw_secure_third_world_allies_name: "Secure Third World Allies"
