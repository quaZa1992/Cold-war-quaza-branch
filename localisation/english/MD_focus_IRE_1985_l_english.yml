l_english:
 ireland_1985_focus: "Ireland 1985 Focus Tree"

 IRE_political_tree_shortcut: "1985 Party Paths"
 IRE_economy_tree_shortcut: "Debt and Recovery"
 IRE_military_tree_shortcut: "Defence Forces"
 IRE_foreign_tree_shortcut: "Foreign Policy"
 IRE_1985_party_branches_tt: "The party paths are now available. Each party path requires that party family to be in power."
 IRE_1985_debt_mountain_tt: "Ireland's debt burden is represented by a static national spirit with an interest-rate penalty. Fiscal focuses can reduce or remove it."

 IRE_state_of_the_nation: "The State of the Nation"
 IRE_state_of_the_nation_desc: "It is 1985. Debt service, unemployment, emigration and the Troubles define Irish politics. The Republic can still recover, but every government must first decide what kind of state it wants to be."
 IRE_political_landscape: "The Political Landscape"
 IRE_political_landscape_desc: "Fine Gael, Fianna Fail, Labour, the Workers' Party, the Progressive Democrats and Sinn Fein all offer different answers to the crisis of the 1980s."
 IRE_the_28th_dail: "The 28th Dail"
 IRE_the_28th_dail_desc: "The Dail becomes the hinge of the decade. Party government, economic recovery, defence policy and the Northern question now move onto separate tracks."

 IRE_wp_a_workers_breakthrough: "A Workers' Breakthrough"
 IRE_wp_a_workers_breakthrough_desc: "The Workers' Party turns its Dublin base into a national challenge, promising secular republicanism and disciplined socialist government."
 IRE_wp_industrial_democracy: "Industrial Democracy"
 IRE_wp_industrial_democracy_desc: "Workplace councils and trade-union influence become central to industrial policy."
 IRE_wp_the_commanding_heights: "The Commanding Heights"
 IRE_wp_the_commanding_heights_desc: "Banks, semi-state companies and strategic industry are pulled toward state direction."
 IRE_wp_a_secular_republic: "A Secular Republic"
 IRE_wp_a_secular_republic_desc: "The party attacks clerical influence in schools, hospitals and constitutional law."
 IRE_wp_a_workers_republic: "A Workers' Republic"
 IRE_wp_a_workers_republic_desc: "A socialist republic becomes the governing project rather than a slogan."

 IRE_lab_the_spring_tide: "The Spring Tide"
 IRE_lab_the_spring_tide_desc: "Labour under Dick Spring moves from junior coalition partner to a plausible party of government."
 IRE_lab_a_real_welfare_state: "A Real Welfare State"
 IRE_lab_a_real_welfare_state_desc: "Healthcare, welfare payments and social protections expand despite fiscal pressure."
 IRE_lab_stand_with_the_unions: "Stand with the Unions"
 IRE_lab_stand_with_the_unions_desc: "The ICTU is brought into a national compact on wages, jobs and industrial peace."
 IRE_lab_democratic_socialism: "Democratic Socialism"
 IRE_lab_democratic_socialism_desc: "Labour anchors a reformist social republic inside democratic institutions."

 IRE_FG_lab_coalition: "The Fine Gael-Labour Coalition"
 IRE_FG_lab_coalition_desc: "Garret FitzGerald governs through a strained but historically important coalition with Labour. The cabinet can modernise the state, but the numbers are tight and every reform costs trust."
 IRE_fg_programme_for_government: "Programme for Government"
 IRE_fg_programme_for_government_desc: "The coalition programme balances Fine Gael's constitutional liberalism with Labour's insistence that austerity cannot be the only answer."
 IRE_fg_manage_labour_ministers: "Manage Labour Ministers"
 IRE_fg_manage_labour_ministers_desc: "Labour ministers are not passengers in government. Keeping them inside the tent gives the cabinet more social legitimacy, but it also limits how hard Fine Gael can cut."
 IRE_cabinet_collective_responsibility: "Cabinet Collective Responsibility"
 IRE_cabinet_collective_responsibility_desc: "FitzGerald forces Fine Gael and Labour ministers to defend one programme in public, tightening discipline before the fiscal and constitutional fights ahead."
 IRE_constitutional_crusade: "The Constitutional Crusade"
 IRE_constitutional_crusade_desc: "FitzGerald's project seeks to make the Republic more pluralist, more liberal and less constrained by old church-state habits."
 IRE_tallaght_strategy: "The Tallaght Strategy"
 IRE_tallaght_strategy_desc: "A rare fiscal consensus with the opposition gives Ireland room to make hard budget choices without total parliamentary warfare."
 IRE_department_of_finance_orthodoxy: "Department of Finance Orthodoxy"
 IRE_department_of_finance_orthodoxy_desc: "Merrion Street imposes a harder line on borrowing, debt service and public expenditure. The discipline is unpopular, but the markets will notice."
 IRE_anglo_irish_negotiations: "Anglo-Irish Negotiations"
 IRE_anglo_irish_negotiations_desc: "Dublin and London begin serious talks on Northern Ireland. Any agreement will be historic, but unionist anger is guaranteed."
 IRE_family_planning_compromise: "Family Planning Compromise"
 IRE_family_planning_compromise_desc: "Contraception law is liberalised through compromise rather than confrontation, signalling a quieter but real social shift."
 IRE_divorce_referendum: "The Divorce Referendum"
 IRE_divorce_referendum_desc: "The coalition risks a national vote on one of the most divisive social questions in the state. Defeat would hurt, but it would also prepare the next generation of reformers."
 IRE_defer_the_divorce_question: "Defer the Divorce Question"
 IRE_defer_the_divorce_question_desc: "The government can postpone the divorce fight and preserve stability, accepting a slower path toward constitutional reform."
 IRE_mary_robinson_moment: "The Robinson Moment"
 IRE_mary_robinson_moment_desc: "The liberal republic finds a public champion in Mary Robinson's rise. Fine Gael cannot own that change alone, but it can make space for it."
 IRE_budgetary_emergency: "Budgetary Emergency"
 IRE_budgetary_emergency_desc: "Debt service is eating the state's room to act. Emergency fiscal measures reduce borrowing pressure, but the public will feel them."
 IRE_sign_anglo_irish_agreement: "Sign the Anglo-Irish Agreement"
 IRE_sign_anglo_irish_agreement_desc: "The 1985 agreement gives Dublin a consultative role in Northern Ireland for the first time. It is the coalition's most consequential diplomatic act."
 IRE_social_partnership_opening: "Open Social Partnership"
 IRE_social_partnership_opening_desc: "Government, unions and employers begin the talks that can turn austerity into a national recovery compact."
 IRE_public_service_pay_restraint: "Public Service Pay Restraint"
 IRE_public_service_pay_restraint_desc: "The state asks its own workers to carry part of the fiscal burden. It saves money, but tests Labour's patience."
 IRE_tax_base_broadening: "Broaden the Tax Base"
 IRE_tax_base_broadening_desc: "The recovery cannot rest on cuts alone. Closing exemptions and widening the tax base gives the state breathing room without abandoning the low-tax industrial strategy."
 IRE_face_unionist_backlash: "Face Unionist Backlash"
 IRE_face_unionist_backlash_desc: "Unionist protests and political fury follow the Anglo-Irish Agreement. Dublin must absorb the shock without abandoning the process."
 IRE_cross_border_secretariat: "Cross-Border Secretariat"
 IRE_cross_border_secretariat_desc: "The machinery of cooperation is made permanent through offices, contacts and quiet habits of consultation."
 IRE_modernise_garda_special_branch: "Modernise Special Branch"
 IRE_modernise_garda_special_branch_desc: "A more professional Garda security apparatus can protect the Anglo-Irish process without turning the Republic into a garrison state."
 IRE_european_pioneer: "A European Pioneer"
 IRE_european_pioneer_desc: "Ireland leans into European integration as a route out of isolation and economic weakness."
 IRE_single_european_act: "The Single European Act"
 IRE_single_european_act_desc: "The Single European Act offers access, discipline and a wider market. Ireland can use Europe as a lever for domestic renewal."
 IRE_structural_funds_strategy: "Structural Funds Strategy"
 IRE_structural_funds_strategy_desc: "European structural funds are directed toward roads, training and the infrastructure needed for a small open economy."
 IRE_expand_regional_technical_colleges: "Regional Technical Colleges"
 IRE_expand_regional_technical_colleges_desc: "The export economy needs technicians, accountants and engineers. Regional colleges become the quiet machinery of Ireland's 1990s growth."
 IRE_fg_programme_for_national_recovery: "A National Recovery Programme"
 IRE_fg_programme_for_national_recovery_desc: "The coalition attempts to claim the recovery compact before Fianna Fail can. Wage restraint, tax reform and investment are tied into one programme."
 IRE_low_corporation_tax_compromise: "The Low-Tax Compromise"
 IRE_low_corporation_tax_compromise_desc: "Fine Gael defends a targeted low corporation tax model while keeping enough revenue to hold Labour inside the recovery compact."
 IRE_prepare_dublin_financial_services: "Prepare Dublin Financial Services"
 IRE_prepare_dublin_financial_services_desc: "With Europe opening and fiscal credibility restored, Dublin can prepare the institutions that will become an international financial services hub."
 IRE_european_social_charter: "European Social Charter"
 IRE_european_social_charter_desc: "Labour wins a social dimension to European integration, softening the edges of market reform."
 IRE_maastricht_question: "The Maastricht Question"
 IRE_maastricht_question_desc: "European Union and monetary integration promise influence, investment and rules that will bind Irish policy deep into the 1990s."
 IRE_european_monetary_anchor: "European Monetary Anchor"
 IRE_european_monetary_anchor_desc: "European monetary discipline gives Ireland credibility on rates, debt and investment, but it also narrows the room for old fiscal improvisation."
 IRE_keep_the_coalition_together: "Keep the Coalition Together"
 IRE_keep_the_coalition_together_desc: "The government can try to survive the electoral storm, presenting discipline and reform as one national project."
 IRE_call_the_1987_election: "Call the 1987 Election"
 IRE_call_the_1987_election_desc: "An election can renew the government's mandate, but it also risks handing the recovery agenda to Haughey."
 IRE_brutons_modernisers: "Bruton's Modernisers"
 IRE_brutons_modernisers_desc: "John Bruton and the party modernisers prepare Fine Gael for a different 1990s: pro-European, fiscally careful and more socially open than its old image."
 IRE_the_1992_rainbow_formula: "The Rainbow Formula"
 IRE_the_1992_rainbow_formula_desc: "Fine Gael can govern with Labour and the democratic left, turning coalition management into a reform strategy rather than an emergency arrangement."
 IRE_age_of_fitzgerald: "The Age of FitzGerald"
 IRE_age_of_fitzgerald_desc: "The coalition tradition carries Ireland into the 1990s as a more open, more European and more institutionally confident republic."

 IRE_ff_the_boss_returns: "The Boss Returns"
 IRE_ff_the_boss_returns_desc: "Charles Haughey brings Fianna Fail back with discipline, ambition and a hard eye for power."
 IRE_ff_the_haughey_grip: "The Haughey Grip"
 IRE_ff_the_haughey_grip_desc: "The party machine is tightened around the Taoiseach and his circle."
 IRE_ff_the_great_u_turn: "The Great U-Turn"
 IRE_ff_the_great_u_turn_desc: "Fianna Fail embraces fiscal correction, surprising allies and enemies alike."
 IRE_ff_forge_social_partnership: "Forge Social Partnership"
 IRE_ff_forge_social_partnership_desc: "Government, unions and employers are drawn into an agreement to stabilise the economy."
 IRE_ff_a_modern_republican_party: "A Modern Republican Party"
 IRE_ff_a_modern_republican_party_desc: "Fianna Fail turns recovery, nationalism and party organisation into a renewed governing formula."

 IRE_pd_break_the_mould: "Break the Mould"
 IRE_pd_break_the_mould_desc: "The Progressive Democrats attack the old parties with market liberalism and social reform."
 IRE_pd_radical_tax_reform: "Radical Tax Reform"
 IRE_pd_radical_tax_reform_desc: "A lower, simpler tax state becomes the centrepiece of the PD offer."
 IRE_pd_slash_the_deficit: "Slash the Deficit"
 IRE_pd_slash_the_deficit_desc: "The deficit is attacked directly, even at the cost of public anger."
 IRE_pd_the_enterprise_economy: "The Enterprise Economy"
 IRE_pd_the_enterprise_economy_desc: "Ireland is rebuilt around private enterprise, low taxes and foreign investment."

 IRE_sf_ballot_and_armalite: "The Ballot and the Armalite"
 IRE_sf_ballot_and_armalite_desc: "Sinn Fein carries the republican movement into electoral politics in the South."
 IRE_sf_end_abstentionism: "End Abstentionism"
 IRE_sf_end_abstentionism_desc: "Taking seats in the Dail changes Sinn Fein from protest movement to governing force."
 IRE_sf_eire_nua: "Eire Nua"
 IRE_sf_eire_nua_desc: "A federal republican model is offered as an answer to the unionist question."
 IRE_sf_thirty_two_county_republic: "The 32-County Republic"
 IRE_sf_thirty_two_county_republic_desc: "The state puts a united republic at the centre of its national mission."

 IRE_econ_the_debt_mountain: "The Debt Mountain"
 IRE_econ_the_debt_mountain_desc: "Debt service crowds out almost every promise. The bond market is now part of Irish politics."
 IRE_econ_spending_review: "Spending Review"
 IRE_econ_spending_review_desc: "The state begins the painful audit needed to reduce borrowing costs."
 IRE_econ_programme_for_national_recovery: "Programme for National Recovery"
 IRE_econ_programme_for_national_recovery_desc: "Wage restraint, industrial peace and fiscal repair are bound into one national bargain."
 IRE_econ_keep_them_home: "Keep Them Home"
 IRE_econ_keep_them_home_desc: "Jobs at home are the only lasting answer to emigration."
 IRE_econ_ida_export_platform: "The IDA Export Platform"
 IRE_econ_ida_export_platform_desc: "Ireland is sold abroad as an English-speaking export platform into Europe."
 IRE_econ_regional_technical_colleges: "Regional Technical Colleges"
 IRE_econ_regional_technical_colleges_desc: "A stronger technical education network prepares the workforce for export industry."
 IRE_econ_ifsc_blueprint: "The IFSC Blueprint"
 IRE_econ_ifsc_blueprint_desc: "Dublin's docklands are prepared for a future financial-services district."
 IRE_econ_celtic_tiger_seed: "Seeds of the Celtic Tiger"
 IRE_econ_celtic_tiger_seed_desc: "Debt repair, education, exports and foreign capital form the first shape of a future boom."

 IRE_defence_forces_review: "Defence Forces Review"
 IRE_defence_forces_review_desc: "Ireland's small military needs a realistic role: neutrality, sovereignty, peacekeeping and coastal control."
 IRE_professionalise_the_army: "Professionalise the Army"
 IRE_professionalise_the_army_desc: "Training, readiness and command standards are improved within Ireland's limited resources."
 IRE_expand_the_naval_service: "Expand the Naval Service"
 IRE_expand_the_naval_service_desc: "Fisheries protection, smuggling control and coastal patrols require a stronger Naval Service."
 IRE_air_corps_modernisation: "Air Corps Modernisation"
 IRE_air_corps_modernisation_desc: "The Air Corps receives enough investment to support patrol, training and emergency tasks."
 IRE_un_peacekeeping_command: "UN Peacekeeping Command"
 IRE_un_peacekeeping_command_desc: "Peacekeeping becomes the professional core of Ireland's military reputation."
 IRE_modernise_the_defence_forces: "Modernise the Defence Forces"
 IRE_modernise_the_defence_forces_desc: "The Army, Naval Service and Air Corps are modernised without abandoning Ireland's small-state limits."

 IRE_foreign_policy_review: "Foreign Policy Review"
 IRE_foreign_policy_review_desc: "Ireland reviews its place between Europe, Britain, America, neutrality and the Northern conflict."
 IRE_deepen_the_eec: "Deepen the EEC"
 IRE_deepen_the_eec_desc: "European institutions offer markets, funds and diplomatic weight for a small state."
 IRE_guard_our_neutrality: "Guard Our Neutrality"
 IRE_guard_our_neutrality_desc: "Neutrality is defended as a practical national doctrine, not merely a slogan."
 IRE_open_the_nato_question: "Open the NATO Question"
 IRE_open_the_nato_question_desc: "The government tests how far Irish neutrality can bend toward western security cooperation."
 IRE_partnership_for_peace: "Partnership for Peace"
 IRE_partnership_for_peace_desc: "Ireland adopts interoperability and training links without immediately abandoning formal neutrality."
 IRE_request_nato_guarantees: "Request NATO Guarantees"
 IRE_request_nato_guarantees_desc: "A fully alternative course asks whether Ireland should enter the western alliance outright."
 IRE_anglo_irish_agreement: "The Anglo-Irish Agreement"
 IRE_anglo_irish_agreement_desc: "Dublin gains a formal role in Northern affairs through agreement with London."
 IRE_shared_island_policy: "A Shared Island"
 IRE_shared_island_policy_desc: "Reconciliation and consent are treated as more important than immediate constitutional drama."
 IRE_prepare_a_border_poll: "Prepare a Border Poll"
 IRE_prepare_a_border_poll_desc: "The constitutional claim is disciplined into a future vote rather than a sudden confrontation."

 IRE_1985_debt_overhang: "Debt Overhang"
 IRE_1985_debt_overhang_desc: "Debt service dominates the budget and raises Ireland's effective interest burden."
 IRE_1985_debt_overhang_reduced: "Reduced Debt Overhang"
 IRE_1985_debt_overhang_reduced_desc: "The debt problem has eased, but interest payments still shape the budget."
 IRE_1985_emigration_pressure: "Emigration Pressure"
 IRE_1985_emigration_pressure_desc: "Young workers and graduates continue leaving for Britain, America and Australia."
 IRE_1985_troubles_spillover: "Troubles Spillover"
 IRE_1985_troubles_spillover_desc: "The conflict in Northern Ireland keeps pulling the Republic into security crises."
 IRE_1985_neutral_defence_posture: "Neutral Defence Posture"
 IRE_1985_neutral_defence_posture_desc: "Neutrality saves money but leaves the Defence Forces small and cautious."
 IRE_1985_constitutional_crusade_spirit: "Constitutional Crusade"
 IRE_1985_constitutional_crusade_spirit_desc: "The state pushes toward a more pluralist constitutional order."
 IRE_1985_tallaght_consensus_spirit: "Tallaght Consensus"
 IRE_1985_tallaght_consensus_spirit_desc: "Fiscal repair is treated as a national responsibility rather than ordinary party warfare."
 IRE_1985_social_partnership_spirit: "Social Partnership"
 IRE_1985_social_partnership_spirit_desc: "Government, unions and employers coordinate recovery through national bargaining."
 IRE_1985_modern_republic_spirit: "Modern Republic"
 IRE_1985_modern_republic_spirit_desc: "A more open, secular and competent Republic is taking shape."
 IRE_1985_european_reformer_spirit: "European Reformer"
 IRE_1985_european_reformer_spirit_desc: "Ireland uses Europe as a multiplier for a small state's influence."
 IRE_1985_haughey_machine_spirit: "The Haughey Machine"
 IRE_1985_haughey_machine_spirit_desc: "Fianna Fail's organisation turns loyalty and patronage into political strength."
 IRE_1985_haughey_grip_spirit: "Haughey's Grip"
 IRE_1985_haughey_grip_spirit_desc: "Cabinet and party discipline are centralised around Haughey."
 IRE_1985_fianna_fail_recovery_spirit: "Fianna Fail Recovery"
 IRE_1985_fianna_fail_recovery_spirit_desc: "Austere recovery and party control are fused into one governing formula."
 IRE_1985_labour_spring_tide_spirit: "Spring Tide"
 IRE_1985_labour_spring_tide_spirit_desc: "Labour's reform mandate gives the old party system a serious challenger."
 IRE_1985_welfare_state_spirit: "Welfare State"
 IRE_1985_welfare_state_spirit_desc: "Social provision expands despite the pressure on the budget."
 IRE_1985_trade_union_compact_spirit: "Trade Union Compact"
 IRE_1985_trade_union_compact_spirit_desc: "Unions accept national bargaining in exchange for influence over recovery."
 IRE_1985_democratic_socialism_spirit: "Democratic Socialism"
 IRE_1985_democratic_socialism_spirit_desc: "Labour's social republic is grounded in elections, welfare and trade unions."
 IRE_1985_workers_republic_spirit: "Workers' Republic"
 IRE_1985_workers_republic_spirit_desc: "The Workers' Party mobilises a secular socialist alternative."
 IRE_1985_workers_democracy_spirit: "Workers' Democracy"
 IRE_1985_workers_democracy_spirit_desc: "Workplace democracy reduces labour waste but politicises the economy."
 IRE_1985_planned_economy_spirit: "Planned Economy"
 IRE_1985_planned_economy_spirit_desc: "Strategic industries are directed by the state."
 IRE_1985_secular_republic_spirit: "Secular Republic"
 IRE_1985_secular_republic_spirit_desc: "Church influence is pushed out of public administration."
 IRE_1985_socialist_republic_spirit: "Socialist Republic"
 IRE_1985_socialist_republic_spirit_desc: "The Republic is reorganised around a socialist state project."
 IRE_1985_break_the_mould_spirit: "Break the Mould"
 IRE_1985_break_the_mould_spirit_desc: "The Progressive Democrats attack the old political settlement."
 IRE_1985_low_tax_economy_spirit: "Low-Tax Economy"
 IRE_1985_low_tax_economy_spirit_desc: "Lower taxation encourages enterprise but narrows the social bargain."
 IRE_1985_enterprise_economy_spirit: "Enterprise Economy"
 IRE_1985_enterprise_economy_spirit_desc: "Private enterprise, offices and foreign capital become the core of recovery."
 IRE_1985_provisional_politics_spirit: "Provisional Politics"
 IRE_1985_provisional_politics_spirit_desc: "Sinn Fein's rise ties electoral politics to the armed struggle."
 IRE_1985_republican_mobilisation_spirit: "Republican Mobilisation"
 IRE_1985_republican_mobilisation_spirit_desc: "The republican movement moves deeper into legal politics."
 IRE_1985_eire_nua_spirit: "Eire Nua"
 IRE_1985_eire_nua_spirit_desc: "A federal model is offered for a future all-Ireland settlement."
 IRE_1985_united_republic_spirit: "United Republic"
 IRE_1985_united_republic_spirit_desc: "Government policy is centred on the 32-county republic."
 IRE_1985_spending_review_spirit: "Spending Review"
 IRE_1985_spending_review_spirit_desc: "A painful spending review lowers Ireland's fiscal risk."
 IRE_1985_programme_for_national_recovery_spirit: "Programme for National Recovery"
 IRE_1985_programme_for_national_recovery_spirit_desc: "A recovery compact lowers conflict and improves the investment climate."
 IRE_1985_jobs_at_home_spirit: "Jobs at Home"
 IRE_1985_jobs_at_home_spirit_desc: "Domestic job creation begins to slow the loss of workers abroad."
 IRE_1985_ida_export_platform_spirit: "IDA Export Platform"
 IRE_1985_ida_export_platform_spirit_desc: "IDA policy draws export industry into Ireland."
 IRE_1985_technological_colleges_spirit: "Technological Colleges"
 IRE_1985_technological_colleges_spirit_desc: "Technical colleges create the workforce demanded by export industry."
 IRE_1985_ifsc_blueprint_spirit: "IFSC Blueprint"
 IRE_1985_ifsc_blueprint_spirit_desc: "Dublin prepares for international financial services."
 IRE_1985_celtic_tiger_seed_spirit: "Seeds of the Celtic Tiger"
 IRE_1985_celtic_tiger_seed_spirit_desc: "The first conditions for a future Irish boom are in place."
 IRE_1985_defence_review_spirit: "Defence Review"
 IRE_1985_defence_review_spirit_desc: "The Defence Forces receive a realistic review of missions and readiness."
 IRE_1985_professional_army_spirit: "Professional Army"
 IRE_1985_professional_army_spirit_desc: "Army readiness improves through training and command reforms."
 IRE_1985_naval_service_spirit: "Naval Service"
 IRE_1985_naval_service_spirit_desc: "Ireland's Naval Service is strengthened for coastal and fisheries duties."
 IRE_1985_air_corps_spirit: "Air Corps"
 IRE_1985_air_corps_spirit_desc: "The Air Corps receives modest but useful modernisation."
 IRE_1985_un_peacekeeping_tradition: "UN Peacekeeping Tradition"
 IRE_1985_un_peacekeeping_tradition_desc: "Peacekeeping remains Ireland's clearest military contribution abroad."
 IRE_1985_modern_defence_forces: "Modern Defence Forces"
 IRE_1985_modern_defence_forces_desc: "Ireland's small military becomes more professional across land, sea and air."
 IRE_1985_active_neutrality_spirit: "Active Neutrality"
 IRE_1985_active_neutrality_spirit_desc: "Neutrality is defended through diplomacy, peacekeeping and sovereignty."
 IRE_1985_western_partner_spirit: "Western Partner"
 IRE_1985_western_partner_spirit_desc: "Ireland leans carefully toward western security cooperation."
 IRE_1985_nato_interoperability_spirit: "NATO Interoperability"
 IRE_1985_nato_interoperability_spirit_desc: "NATO training standards are adopted without automatically ending neutrality."
 IRE_1985_anglo_irish_agreement_spirit: "Anglo-Irish Agreement"
 IRE_1985_anglo_irish_agreement_spirit_desc: "Dublin and London cooperate more closely on Northern Ireland."
 IRE_1985_shared_island_spirit: "Shared Island"
 IRE_1985_shared_island_spirit_desc: "Reconciliation and consent guide policy toward Northern Ireland."
 IRE_1985_path_to_unity_spirit: "Path to Unity"
 IRE_1985_path_to_unity_spirit_desc: "The state prepares a constitutional path toward unity by consent."
 IRE_1985_coalition_programme_spirit: "Fine Gael-Labour Coalition"
 IRE_1985_coalition_programme_spirit_desc: "The cabinet rests on Fine Gael's reform programme and Labour's social mandate."
 IRE_1985_programme_for_government_spirit: "Programme for Government"
 IRE_1985_programme_for_government_spirit_desc: "The coalition programme has been upgraded into a disciplined shared agenda, giving the cabinet clearer authority and reducing administrative drag."
 IRE_1985_cabinet_discipline_spirit: "Cabinet Discipline"
 IRE_1985_cabinet_discipline_spirit_desc: "The Programme for Government has hardened into cabinet discipline: ministers defend one line, the bureaucracy moves faster, and opposition attacks lose some bite."
 IRE_1985_labour_coalition_compromise_spirit: "Labour Coalition Compromise"
 IRE_1985_labour_coalition_compromise_spirit_desc: "Labour support stabilises the cabinet, but social spending remains politically protected."
 IRE_1985_family_planning_compromise_spirit: "Family Planning Compromise"
 IRE_1985_family_planning_compromise_spirit_desc: "Social liberalisation advances through cautious legislative compromise."
 IRE_1985_divorce_referendum_defeat_spirit: "Divorce Referendum Defeat"
 IRE_1985_divorce_referendum_defeat_spirit_desc: "A failed referendum has wounded the coalition, but the public debate has shifted the boundaries of reform."
 IRE_1985_cautious_constitutionalism_spirit: "Cautious Constitutionalism"
 IRE_1985_cautious_constitutionalism_spirit_desc: "The government preserves stability by moving more slowly on divisive constitutional questions."
 IRE_1985_presidential_liberalism_spirit: "Presidential Liberalism"
 IRE_1985_presidential_liberalism_spirit_desc: "A new public liberalism is changing the tone of Irish politics and giving constitutional reform a broader social base."
 IRE_1985_department_of_finance_orthodoxy_spirit: "Department of Finance Orthodoxy"
 IRE_1985_department_of_finance_orthodoxy_spirit_desc: "Fiscal discipline is now enforced from the centre of government, preparing the later budget emergency without adding another permanent national spirit."
 IRE_1985_budget_emergency_spirit: "Budgetary Emergency"
 IRE_1985_budget_emergency_spirit_desc: "Emergency fiscal discipline starts the budget repair chain, reducing borrowing pressure at the price of public resentment."
 IRE_1985_public_service_pay_restraint_spirit: "Public Service Pay Restraint"
 IRE_1985_public_service_pay_restraint_spirit_desc: "Public-sector pay restraint is a temporary austerity pressure that helps stabilise the budget but strains the coalition's social base."
 IRE_1985_tax_base_broadening_spirit: "Broadened Tax Base"
 IRE_1985_tax_base_broadening_spirit_desc: "The budget emergency has been upgraded into a wider, more credible revenue base by trading exemptions and loopholes for fiscal reach."
 IRE_1985_anglo_irish_negotiations_spirit: "Anglo-Irish Negotiations"
 IRE_1985_anglo_irish_negotiations_spirit_desc: "Dublin is pushing London toward a formal role for the Republic in the Northern Ireland question."
 IRE_1985_unionist_backlash_spirit: "Unionist Backlash"
 IRE_1985_unionist_backlash_spirit_desc: "The Anglo-Irish Agreement has provoked fierce unionist resistance. This is a temporary shock, not a permanent reform spirit."
 IRE_1985_cross_border_secretariat_spirit: "Cross-Border Secretariat"
 IRE_1985_cross_border_secretariat_spirit_desc: "The Anglo-Irish Agreement has been upgraded into permanent consultation, giving Dublin's Northern policy administrative weight."
 IRE_1985_garda_special_branch_spirit: "Modernised Special Branch"
 IRE_1985_garda_special_branch_spirit_desc: "A professionalised Garda security service gives Dublin more control over border pressure and republican militancy."
 IRE_1985_single_european_act_spirit: "Single European Act"
 IRE_1985_single_european_act_spirit_desc: "Ireland's early European reform stance has become a concrete market-integration strategy."
 IRE_1985_structural_funds_spirit: "Structural Funds Strategy"
 IRE_1985_structural_funds_spirit_desc: "The Single European Act strategy has been upgraded into a practical structural-funds programme for infrastructure, training and regional development."
 IRE_1985_european_social_charter_spirit: "European Social Charter"
 IRE_1985_european_social_charter_spirit_desc: "The coalition ties European integration to social protection."
 IRE_1985_maastricht_consensus_spirit: "Maastricht Consensus"
 IRE_1985_maastricht_consensus_spirit_desc: "Structural-funds politics has matured into a broad pro-European consensus around the future European Union."
 IRE_1985_european_monetary_anchor_spirit: "European Monetary Anchor"
 IRE_1985_european_monetary_anchor_spirit_desc: "The Maastricht consensus is upgraded into monetary discipline, improving investor confidence and helping push borrowing costs down."
 IRE_1985_coalition_survives_spirit: "Coalition Survival"
 IRE_1985_coalition_survives_spirit_desc: "The government survives by turning crisis management into a claim of responsible rule."
 IRE_1985_1987_election_prepared_spirit: "Prepared for the 1987 Election"
 IRE_1985_1987_election_prepared_spirit_desc: "The party machine is ready for an election fought on discipline, recovery and reform."
 IRE_1985_bruton_modernisers_spirit: "Bruton's Modernisers"
 IRE_1985_bruton_modernisers_spirit_desc: "A younger Fine Gael generation is preparing the party for the European 1990s."
 IRE_1985_rainbow_formula_spirit: "Rainbow Formula"
 IRE_1985_rainbow_formula_spirit_desc: "Fine Gael, Labour and the democratic left can turn coalition politics into a durable reform formula."
 IRE_1985_1990s_open_republic_spirit: "Open Republic"
 IRE_1985_1990s_open_republic_spirit_desc: "Ireland enters the 1990s as a more pluralist, European and investment-ready republic."
 IRE_1985_strained_relations: "Strained Anglo-Irish Relations"
 IRE_1985_partnership: "Anglo-Irish Partnership"
 IRE_1985_kinship: "Global Irish Kinship"
 IRE_1985_soviet_trade: "Eastern Bloc Trade"
