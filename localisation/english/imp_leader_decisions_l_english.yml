  joe_biden: "Joe Biden"
  hillary_clinton: "Hillary Clinton"
  kamala_harris: "Kamala Harris"
  al_gore: "Al Gore"
  al_gore_decision_desc: "Having served as Vice President since 1992 under Bill Clinton, Al Gore now holds the Democratic nomination for the upcoming November election. A former senator from Tennessee and author of the environmental manifesto Earth in the Balance, he brings eight years of executive experience and a detailed, sometimes rigid, vision for America's future. If he loses in November, will his ambitions for climate action and technological investment fade, or will he try again another day?"
  al_gore_desc: "Vice President Al Gore enters the presidency with eight years of executive experience, a background as a senator from Tennessee, and authorship of the environmental work Earth in the Balance. His political identity combines Washington insider knowledge with advocacy for climate action, technological investment, and fiscal centrism."
  bernie_sanders: "Bernie Sanders"
  elizabeth_warren: "Elizabeth Warren"
  dennis_kucinich: "Dennis Kucinich"
  john_edwards: "John Edwards"
  john_edwards_decision_desc: "A personal injury lawyer who rose to national prominence with a successful Senate run in 1998, John Edwards has quickly become a rising star in the Democratic Party. Known for his charismatic, populist rhetoric focusing on \"Two Americas\" and fighting for the working class, he is considered a future contender for higher office. With only one Senate term to his name, can his compelling narrative and southern appeal overcome his relatively thin political record?"
  john_edwards_desc: "Senator, now President, John Edwards brings a populist message of economic justice and taking on powerful interests to the presidency. His background as a personal injury lawyer informs his advocacy for workers, healthcare reform, and fighting poverty, presenting an optimistic, charismatic alternative to Washington's established political figures."
  howard_dean: "Howard Dean"
  howard_dean_decision_desc: "Starting his career in medicine, he eventually shifted over to politics in 1980, becoming a Vermont representitive in 1983 then the Lieutenant Governor in 1987 and finally the Governor of Vermont in 1991. He gave this position up however in 2003 to seek out the nomination of the Democratic Party, highly critical of the present leadership, he is considered a long shot candidate but with his innovation on using the internet for fundraising he is quickly gaining steam."
  howard_dean_desc: "Former Governor of Vermont, he has largely based his politics upon a foreign policy critical of unjust interventions, and a domestic policy surrounding grassroots support and fiscal responsiblity."
  wesley_clark: "Wesley Clark"
  wesley_clark_decision_desc: "From serving in Vietnam, being awarded a Silver Star for gallantry in combat, to being the Supreme Allied Commander Europe of NATO until 2000, he has had a long 34 year military career. He commanded NATO forces during the Kosovo war, despite this career however, he holds very liberal beliefs stating he is pro-affirmative action, pro-choice, pro-education and pro-healthcare."
  wesley_clark_desc: "A Vietnam veteran and former Supreme Allied Commander Europe of NATO, Wesley Clark has gone from staff officer to General and now President. Despite being an independent for years he settled into the Democratic Party as he saw them to stand for internationalism, fair play, and ordinary men and women."
  john_kerry: "John Kerry"
  john_kerry_decision_desc: "Graduating from Yale in 1966, he enlisted in the Naval Reserve serving a brief tour in South Vietnam. A prominent anti-war activist when he was younger, and now securing the nomination of the Democratic Party for the upcoming election he has had a typical career for a candidate, working in both the legal and political sectors. He may have had botox but he did also win three purple hearts!"
  john_kerry_desc: "A Vietnam veteran turned anti-war activist and long-serving senator, John Kerry brings a complex legacy of military service and diplomatic skepticism to the presidency. His career reflects a blend of foreign policy realism and progressive domestic ambition, shaped by legal expertise and decades in the Senate."
  
  imp_leader_usa_rep_decisions: "Republican Presidential Candidates"
  george_bush: "George W. Bush"
  john_mccain: "John McCain"
  mitt_romney: "Mitt Romney"
  alan_keyes: "Alan Keyes"
  alan_keyes_decision_desc: "A former Assistant Secretary of State for International Organizations under Reagan, Alan Keyes is a fiery conservative orator and perennial presidential candidate. With a background in diplomacy and a Ph.D. from Harvard, he brings intellectual rigor to his deeply moralistic, pro-life platform. Though he has never held elected office, his passionate defense of conservative principles has earned him a loyal following. Can this articulate outsider rally enough support to break into the political mainstream?"
  alan_keyes_desc: "Alan Keyes brings a fiercely moralistic and intellectual brand of conservatism to the presidency, rooted in his diplomatic background and religious convictions. His tenure focuses on a hawkish foreign policy, staunch social conservatism, and a vision of American renewal based on traditional values."
  steve_forbes: "Steve Forbes"
  steve_forbes_decision_desc: "The editor-in-chief of Forbes magazine and heir to a publishing fortune, Steve Forbes brings his signature \"Flat Tax\" proposal and supply-side economic vision to the political arena. A two-time contender for the Republican nomination, he advocates for radical tax simplification, school choice, and a return to the gold standard. Can this wealthy media executive translate his boardroom ideas into a viable national campaign?"
  steve_forbes_desc: "Steve Forbes enters the presidency as a businessman and publisher, championing supply-side economics, his iconic Flat Tax, and a platform of deregulation and monetary reform. His leadership is defined by radical tax simplification, privatization, and a foreign policy grounded in free-market advocacy."
  dick_cheney: "Dick Cheney"
  dick_cheney_decision_desc: "A veteran of multiple Republican administrations, Dick Cheney has served as White House Chief of Staff, Congressman, and Secretary of Defense before being selected as the vice-presidential nominee. Known for his deep Washington experience, conservative credentials, and steady, often hardline, hand in foreign policy, he is seen as the ultimate insider. Would a Cheney presidency be defined by pragmatism and security, or by the controversies that have followed his long career?"
  dick_cheney_desc: "Dick Cheney brings decades of Washington experience as a congressman, Defense Secretary, and White House insider to the presidency. His political identity is built on national security expertise, conservative governance, and a pragmatic, often uncompromising, approach to executive power and foreign affairs."
