l_english:
  imp_leader_usa_dem_decisions: "Democratic Presidential Candidates"
  barack_obama: "Barack Obama"
  pete_buttigieg: "Pete Buttigieg"
  gretchen_whitmer: "Gretchen Whitmer"
  tim_kaine: "Tim Kaine"
  tim_walz: "Tim Walz"
