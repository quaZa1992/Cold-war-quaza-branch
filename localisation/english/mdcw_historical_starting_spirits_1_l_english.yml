l_english:
 AGL_1985_unita_insurgency: "UNITA Insurgency"
 AGL_1985_unita_insurgency_desc: "UNITA does not begin as a separate state in January 1985, but the Angolan state remains tied down by rural war, foreign support networks and military attrition."
 BRM_1985_ethnic_borderlands: "Ethnic Borderlands"
 BRM_1985_ethnic_borderlands_desc: "Burma remains formally unified, while armed ethnic movements and hard terrain keep the borderlands difficult to administer."
 DRC_1985_mobutuist_zaire: "Mobutuist Zaire"
 DRC_1985_mobutuist_zaire_desc: "Zaire's state apparatus is held together by patronage, coercion and foreign relationships. It is stable enough to survive, but expensive and deeply inefficient."
 ETH_1985_eritrean_question: "The Eritrean Question"
 ETH_1985_eritrean_question_desc: "Eritrea remains formally inside Ethiopia, but the long insurgency has become a structural military and political crisis."
 IND_1985_outer_islands_separatism: "Outer Islands Separatism"
 IND_1985_outer_islands_separatism_desc: "Aceh and West Papua are not independent states in 1985, but separatist pressures force Jakarta to commit security resources."
 ISR_1985_occupied_territories: "Occupation and Palestinian Unrest"
 ISR_1985_occupied_territories_desc: "Israel remains tied to the West Bank and Gaza through occupation, security pressure and contested claims. Even when represented through a Palestinian map tag, the issue drains manpower, diplomacy and legitimacy."
 LBA_1985_green_jamahiriya: "Green Jamahiriya"
 LBA_1985_green_jamahiriya_desc: "Gaddafi's committees, oil politics and revolutionary doctrine dominate Libya. In 1985 the system is still more confident than brittle, and oil-state taxation gives Tripoli some room to maneuver, but centralized habits, foreign adventurism and family politics already carry real costs."
 MOR_1985_western_sahara_front: "Western Sahara Front"
 MOR_1985_western_sahara_front_desc: "The Western Sahara conflict continues below the level of a clean state war, forcing Morocco to sustain an expensive desert security posture."
 NKO_1985_juche_garrison_state: "Juche Garrison State"
 NKO_1985_juche_garrison_state_desc: "North Korea enters 1985 as a militarized command state. It can mobilize for defense, but civilian productivity and consumption are sacrificed to the garrison economy."
 NKO_1985_kim_dynasty: "Kim Dynasty"
 NKO_1985_kim_dynasty_desc: "Kim Il Sung's personal rule has become a hereditary revolutionary state. Loyalty is tightly organized around the family, party, army and security services."
 PAL_1985_plo_exile_and_occupation: "PLO in Exile and Occupation"
 PAL_1985_plo_exile_and_occupation_desc: "The PLO claims the Palestinian national cause from exile while the West Bank and Gaza remain under occupation and fragmented local control. Legitimacy is high, state capacity is not."
 SAF_1985_south_west_africa_occupation: "South West Africa Occupation"
 SAF_1985_south_west_africa_occupation_desc: "Namibia is still administered as South West Africa under South African control. International pressure, SWAPO activity and the security burden make this a constant drain."
 SAU_1985_establishment_salafism: "Establishment Salafism"
 SAU_1985_establishment_salafism_desc: "The Saudi monarchy rests on the alliance between the House of Saud and the Wahhabi religious establishment. It gives the kingdom ideological discipline and domestic control, but locks society into a deeply conservative order."
 SOM_1985_clan_border_fractures: "Clan and Border Fractures"
 SOM_1985_clan_border_fractures_desc: "Somalia is still formally unified in 1985, but northern opposition, clan politics and the aftermath of the Ogaden War have weakened the regime's reach."
 SUD_1985_southern_insurgency: "Southern Insurgency"
 SUD_1985_southern_insurgency_desc: "The Second Sudanese Civil War is not represented as a separate sovereign state at start, but southern resistance still strains Khartoum's authority."
