 COLDWAR_IRQ_focus_owned_executive_tt:0 "Establishes executive constitutional authority for the government programme."
 COLDWAR_IRQ_focus_owned_representative_tt:0 "Establishes representative constitutional authority for the government programme."
 COLDWAR_IRQ_focus_owned_amnesty_tt:0 "Releases eligible living detainees and restores their political standing before the applicable case deadlines. Legal political guarantees take effect."
 COLDWAR_IRQ_focus_owned_legalization_tt:0 "Legalises Communist political activity and enacts political guarantees."
 COLDWAR_IRQ_focus_owned_front_tt:0 "Enacts the Baath–Communist Front charter, legalises Communist activity and forms the domestic coalition. The leading party retains government."
 COLDWAR_IRQ_focus_owned_transition_tt:0 "Ratifies the civilian transition and permits contested elections."
 COLDWAR_IRQ_focus_owned_civilian_budget_tt:0 "Ends the active emergency budget. Previously committed personnel bills remain payable until expiry."
