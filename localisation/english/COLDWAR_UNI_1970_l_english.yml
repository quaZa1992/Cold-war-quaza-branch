l_english:
# IMPERIA CW — Cold War: UNI 1970 — English localisation.
 # COLDWAR | The Union Plan 1970 (missions of the Union republics, Moscow's judgement, the joint Union tree). Generated - edit the generator.
 COLDWAR_UNI_target_counts_tt:0 "Our annual target counts for §GThe Plan Is Fulfilled!§! ([?global.COLDWAR_UNI_fulfilled|0] of [?global.COLDWAR_UNI_needed|0] needed)."
 COLDWAR_UNI_deliveries_tt:0 "Moscow gains §GDeliveries from the Republics§! for 180 days: construction speed and political power gain §G+1%§! per weight point of our republic."
 COLDWAR_UNI_shortfall_tt:0 "Moscow suffers §RShortfalls in the Republics§! for 180 days: per weight point of our republic construction speed §R-2.5%§!, political power gain §R-2.5%§!, Tax Cost Factor (Consumer Goods) §R+1%§!."
 COLDWAR_UNI_buff_fulfillers_tt:0 "Every republic that has fulfilled its annual target receives §GThe Plan Is Fulfilled!§! too - and every one that fulfils it later this year."
 COLDWAR_UNI_reward_lost_tt:0 "The reward for the falsified fulfilment is §Rtaken away§!."
 COLDWAR_UNI_requisition_sov_tt:0 "Moscow uses the same number of civilian factories for its own plan for 60 days (§GRequisitioned Capacity§!)."
 COLDWAR_UNI_replace_tt:0 "The First Secretary is §Rretired§!. Moscow installs its own man (trait §YMoscow's Man§!: political power gain -10%, immune to kompromat); the republic must accept §RMoscow's Choice§! (stability -10% for 180 days)."
 COLDWAR_UNI_leave_union_tt:0 "Our republic §Yleaves the Union plan§!: no more missions, punishments or rewards of the joint Union tree."
 COLDWAR_UNI_keep_priority_tt:0 "We keep the annual target Gosplan proposed."
 COLDWAR_UNI_counter_plan_tt:0 "Annual target: Moscow's priority, but §Ytwo§! new buildings are needed. Reward §Gx2§!."
 COLDWAR_UNI_cadre_vote_tt:0 "The Politburo votes on the cadre question within 10 days (the Moscow members vote with the orthodox). If it rejects the replacement, nothing happens and the costs are lost."
 COLDWAR_UNI_khozraschet_tt:0 "Moscow's §RShortfalls in the Republics§! no longer counts this failure."
 COLDWAR_UNI_eased_tt:0 "After 90 days §YMoscow's Choice§! eases to stability -5%."
 COLDWAR_UNI_directive_issued_tt:0 "The republic receives the directive at once: 270 days, reward §Gx1.5§!."
 COLDWAR_UNI_union_plan_category:0 "The Union Plan"
 COLDWAR_UNI_union_plan_category_desc:0 "The Union plan of [?global.COLDWAR_UNI_year|0] ([COLDWAR_SOV_GetPlanName]). Moscow's priority: §Y[COLDWAR_UNI_GetPrioName]§!.\n\nFulfilled: §Y[?global.COLDWAR_UNI_fulfilled|0]§! of [?global.COLDWAR_UNI_members|0] republics - §Y[?global.COLDWAR_UNI_needed|0]§! are needed for §GThe Plan Is Fulfilled!§! (one year: stability +3%, construction speed +5% for Moscow and every republic that fulfilled its target; Union cohesion +2). [COLDWAR_UNI_GetYearState]\n\n§RShortfalls in the Republics§!: Moscow loses §R[?global.COLDWAR_UNI_sf_pct|1]%§! construction speed and political power gain and pays §R[?global.COLDWAR_UNI_cg_pct|0]%§! more for consumer goods ([?global.COLDWAR_UNI_sf_total|0] points; every failure counts for 180 days - Ukrainian SSR 3, Byelorussian, Kazakh and Uzbek SSR 2, every other republic 1).\n\nThe republics:[UKR.COLDWAR_UNI_GetPlanLine][BLR.COLDWAR_UNI_GetPlanLine][EST.COLDWAR_UNI_GetPlanLine][LAT.COLDWAR_UNI_GetPlanLine][LIT.COLDWAR_UNI_GetPlanLine][ARM.COLDWAR_UNI_GetPlanLine][AZE.COLDWAR_UNI_GetPlanLine][GEO.COLDWAR_UNI_GetPlanLine][KAZ.COLDWAR_UNI_GetPlanLine][KYR.COLDWAR_UNI_GetPlanLine][TAJ.COLDWAR_UNI_GetPlanLine][TRK.COLDWAR_UNI_GetPlanLine][UZB.COLDWAR_UNI_GetPlanLine][MLV.COLDWAR_UNI_GetPlanLine]"
 COLDWAR_UNI_goal_t_civ_trig_tt:0 "Built: one new §Ycivilian factory§!.\nCivilian factories §Y[?industrial_complex_total|0]§!, needed more than §Y[?COLDWAR_UNI_t_b1|0]§!."
 COLDWAR_UNI_tolkachi_rearm_tt:0 "Our §Ytolkachi§! have found the missing materials: the deadline moves (45 days at most, never beyond the end of the plan year)."
 COLDWAR_UNI_target_civ:0 "Fulfil the Industrial Plan"
 COLDWAR_UNI_target_civ_desc:0 "Gosplan's figures leave no doubt: the republic is to raise a new factory before the year is out.\n\nGoal: one new §Ycivilian factory§!.\nReward: §GPlan Fulfilled: Industry§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nEvery fulfilled annual target counts for §GThe Plan Is Fulfilled!§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_t_arms_trig_tt:0 "Built: one new §Ymilitary factory§!.\nMilitary factories §Y[?military_factory_total|0]§!, needed more than §Y[?COLDWAR_UNI_t_b1|0]§!."
 COLDWAR_UNI_target_arms:0 "The Defence Order"
 COLDWAR_UNI_target_arms_desc:0 "The Military-Industrial Commission has placed an order with our republic. The ministry in Moscow counts every machine shop.\n\nGoal: one new §Ymilitary factory§!.\nReward: §GPlan Fulfilled: Industry§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nEvery fulfilled annual target counts for §GThe Plan Is Fulfilled!§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_t_power_trig_tt:0 "Built: one new §Ypower station§! (fossil, nuclear or renewable).\nFossil power stations §Y[?number_of_fossil_pps|0]§!, needed more than §Y[?COLDWAR_UNI_t_b1|0]§!; Nuclear reactors §Y[?nuclear_reactors|0]§!, needed more than §Y[?COLDWAR_UNI_t_b2|0]§!; Renewable power stations §Y[?renewable_energy_infra|0]§!, needed more than §Y[?COLDWAR_UNI_t_b3|0]§!."
 COLDWAR_UNI_target_power:0 "Power for the Plan"
 COLDWAR_UNI_target_power_desc:0 "The new factories of the plan need electricity. Gosplan expects a new power station on our soil.\n\nGoal: one new §Ypower station§! (fossil, nuclear or renewable).\nReward: §GPlan Fulfilled: Power§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nEvery fulfilled annual target counts for §GThe Plan Is Fulfilled!§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_t_agri_trig_tt:0 "Built: one new §Yagriculture district§!.\nAgriculture districts §Y[?agriculture_district_total|0]§!, needed more than §Y[?COLDWAR_UNI_t_b1|0]§!."
 COLDWAR_UNI_target_agri:0 "The Harvest Quota"
 COLDWAR_UNI_target_agri_desc:0 "Bread, meat and milk: the Food Programme is measured in our fields.\n\nGoal: one new §Yagriculture district§!.\nReward: §GPlan Fulfilled: The Harvest§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nEvery fulfilled annual target counts for §GThe Plan Is Fulfilled!§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_t_roads_trig_tt:0 "Built: one more level of §Yinfrastructure§! in any of our states."
 COLDWAR_UNI_target_roads:0 "Roads of the Union"
 COLDWAR_UNI_target_roads_desc:0 "Without roads the harvest rots and the factories wait. Gosplan wants our republic connected.\n\nGoal: one more level of §Yinfrastructure§! in any of our states.\nReward: §GPlan Fulfilled: Roads§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nEvery fulfilled annual target counts for §GThe Plan Is Fulfilled!§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_t_dock_trig_tt:0 "Built: one new §Ydockyard§!.\nDockyards §Y[?naval_factory_total|0]§!, needed more than §Y[?COLDWAR_UNI_t_b1|0]§!."
 COLDWAR_UNI_target_dock:0 "Ports of the Union"
 COLDWAR_UNI_target_dock_desc:0 "The Union's fleets need yards. Our coast is to build ships for the Union.\n\nGoal: one new §Ydockyard§!.\nReward: §GPlan Fulfilled: Industry§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nEvery fulfilled annual target counts for §GThe Plan Is Fulfilled!§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_t_oil_trig_tt:0 "Built: one new §Yrefinery§!.\nRefineries §Y[?synthetic_refinery_total|0]§!, needed more than §Y[?COLDWAR_UNI_t_b1|0]§!."
 COLDWAR_UNI_target_oil:0 "Black Gold of the Caspian"
 COLDWAR_UNI_target_oil_desc:0 "Baku gave the Union its first oil. Gosplan expects the Caspian to refine more of it.\n\nGoal: one new §Yrefinery§!.\nReward: §GPlan Fulfilled: Industry§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nEvery fulfilled annual target counts for §GThe Plan Is Fulfilled!§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_t_deliver_trig_tt:0 "Delivered: a delivery of §Y0.2%§! of our GDP to the Union fund (decision §YDeliver to the Union Fund§!)."
 COLDWAR_UNI_target_deliver:0 "Plan Deliveries"
 COLDWAR_UNI_target_deliver_desc:0 "Instead of buildings Gosplan asks for money: a share of our income for the Union fund.\n\nGoal: a delivery of §Y0.2%§! of our GDP to the Union fund.\nReward: §GPlan Fulfilled: Deliveries§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nEvery fulfilled annual target counts for §GThe Plan Is Fulfilled!§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_t_discipline_trig_tt:0 "§Ystability of at least 50%§! when the deadline comes (checked when the time runs out)."
 COLDWAR_UNI_target_discipline:0 "Party Discipline"
 COLDWAR_UNI_target_discipline_desc:0 "Moscow asks for order, not for buildings: a republic without unrest, strikes and scandals.\n\nGoal: §Ystability of at least 50%§! when the deadline comes.\nReward: §GPlan Fulfilled: Party Discipline§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nEvery fulfilled annual target counts for §GThe Plan Is Fulfilled!§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_t_steel_trig_tt:0 "Built: one new §Ycivilian or military factory§!.\nCivilian factories §Y[?industrial_complex_total|0]§!, needed more than §Y[?COLDWAR_UNI_t_b1|0]§!; Military factories §Y[?military_factory_total|0]§!, needed more than §Y[?COLDWAR_UNI_t_b2|0]§!."
 COLDWAR_UNI_target_steel:0 "Steel and Tractors"
 COLDWAR_UNI_target_steel_desc:0 "Kharkov tractors and Minsk lorries: the Slavic republics are the workshop of the Union.\n\nGoal: one new §Ycivilian or military factory§!.\nReward: §GPlan Fulfilled: Industry§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nEvery fulfilled annual target counts for §GThe Plan Is Fulfilled!§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_t_cotton_trig_tt:0 "Built: one new §Yagriculture district§! for the cotton harvest.\nAgriculture districts §Y[?agriculture_district_total|0]§!, needed more than §Y[?COLDWAR_UNI_t_b1|0]§!."
 COLDWAR_UNI_target_cotton:0 "White Gold"
 COLDWAR_UNI_target_cotton_desc:0 "White gold: Central Asia's cotton is counted in millions of tonnes, and Moscow counts every one of them.\n\nGoal: one new §Yagriculture district§! for the cotton harvest.\nReward: §GPlan Fulfilled: The Harvest§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nEvery fulfilled annual target counts for §GThe Plan Is Fulfilled!§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_t_virgin_trig_tt:0 "Built: one new §Yagriculture district§! in the Virgin Lands.\nAgriculture districts §Y[?agriculture_district_total|0]§!, needed more than §Y[?COLDWAR_UNI_t_b1|0]§!."
 COLDWAR_UNI_target_virgin:0 "The Virgin Lands Harvest"
 COLDWAR_UNI_target_virgin_desc:0 "Khrushchev's Virgin Lands still feed the Union. Gosplan expects the steppe to give more.\n\nGoal: one new §Yagriculture district§! in the Virgin Lands.\nReward: §GPlan Fulfilled: The Harvest§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nEvery fulfilled annual target counts for §GThe Plan Is Fulfilled!§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_t_orchards_trig_tt:0 "Built: one new §Yagriculture district§! for orchards and vineyards.\nAgriculture districts §Y[?agriculture_district_total|0]§!, needed more than §Y[?COLDWAR_UNI_t_b1|0]§!."
 COLDWAR_UNI_target_orchards:0 "Orchards and Vineyards"
 COLDWAR_UNI_target_orchards_desc:0 "Moldavia's wine and fruit fill the shops of Moscow and Leningrad. Gosplan wants more of them.\n\nGoal: one new §Yagriculture district§! for orchards and vineyards.\nReward: §GPlan Fulfilled: The Harvest§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nEvery fulfilled annual target counts for §GThe Plan Is Fulfilled!§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_d_civ_trig_tt:0 "Built: one new §Ycivilian factory§!.\nCivilian factories §Y[?industrial_complex_total|0]§!, needed more than §Y[?COLDWAR_UNI_d_b1|0]§!."
 COLDWAR_UNI_directive_civ:0 "Moscow's Directive: Fulfil the Industrial Plan"
 COLDWAR_UNI_directive_civ_desc:0 "Gosplan's figures leave no doubt: the republic is to raise a new factory before the year is out.\n\nGoal: one new §Ycivilian factory§!.\nReward: §GPlan Fulfilled: Industry§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_d_arms_trig_tt:0 "Built: one new §Ymilitary factory§!.\nMilitary factories §Y[?military_factory_total|0]§!, needed more than §Y[?COLDWAR_UNI_d_b1|0]§!."
 COLDWAR_UNI_directive_arms:0 "Moscow's Directive: The Defence Order"
 COLDWAR_UNI_directive_arms_desc:0 "The Military-Industrial Commission has placed an order with our republic. The ministry in Moscow counts every machine shop.\n\nGoal: one new §Ymilitary factory§!.\nReward: §GPlan Fulfilled: Industry§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_d_power_trig_tt:0 "Built: one new §Ypower station§! (fossil, nuclear or renewable).\nFossil power stations §Y[?number_of_fossil_pps|0]§!, needed more than §Y[?COLDWAR_UNI_d_b1|0]§!; Nuclear reactors §Y[?nuclear_reactors|0]§!, needed more than §Y[?COLDWAR_UNI_d_b2|0]§!; Renewable power stations §Y[?renewable_energy_infra|0]§!, needed more than §Y[?COLDWAR_UNI_d_b3|0]§!."
 COLDWAR_UNI_directive_power:0 "Moscow's Directive: Power for the Plan"
 COLDWAR_UNI_directive_power_desc:0 "The new factories of the plan need electricity. Gosplan expects a new power station on our soil.\n\nGoal: one new §Ypower station§! (fossil, nuclear or renewable).\nReward: §GPlan Fulfilled: Power§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_d_nuclear_trig_tt:0 "Built: one new §Ynuclear reactor§!.\nNuclear reactors §Y[?nuclear_reactors|0]§!, needed more than §Y[?COLDWAR_UNI_d_b1|0]§!."
 COLDWAR_UNI_directive_nuclear:0 "Moscow's Directive: Atoms for the Republic"
 COLDWAR_UNI_directive_nuclear_desc:0 "The Ministry of Medium Machine Building wants a reactor in our republic. Moscow calls it the energy of the future.\n\nGoal: one new §Ynuclear reactor§!.\nReward: §GPlan Fulfilled: Power§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_d_agri_trig_tt:0 "Built: one new §Yagriculture district§!.\nAgriculture districts §Y[?agriculture_district_total|0]§!, needed more than §Y[?COLDWAR_UNI_d_b1|0]§!."
 COLDWAR_UNI_directive_agri:0 "Moscow's Directive: The Harvest Quota"
 COLDWAR_UNI_directive_agri_desc:0 "Bread, meat and milk: the Food Programme is measured in our fields.\n\nGoal: one new §Yagriculture district§!.\nReward: §GPlan Fulfilled: The Harvest§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_d_roads_trig_tt:0 "Built: one more level of §Yinfrastructure§! in any of our states."
 COLDWAR_UNI_directive_roads:0 "Moscow's Directive: Roads of the Union"
 COLDWAR_UNI_directive_roads_desc:0 "Without roads the harvest rots and the factories wait. Gosplan wants our republic connected.\n\nGoal: one more level of §Yinfrastructure§! in any of our states.\nReward: §GPlan Fulfilled: Roads§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_d_dock_trig_tt:0 "Built: one new §Ydockyard§!.\nDockyards §Y[?naval_factory_total|0]§!, needed more than §Y[?COLDWAR_UNI_d_b1|0]§!."
 COLDWAR_UNI_directive_dock:0 "Moscow's Directive: Ports of the Union"
 COLDWAR_UNI_directive_dock_desc:0 "The Union's fleets need yards. Our coast is to build ships for the Union.\n\nGoal: one new §Ydockyard§!.\nReward: §GPlan Fulfilled: Industry§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_d_deliver_trig_tt:0 "Delivered: a special consignment of §Y0.4%§! of our GDP to the Union fund (decision §YDeliver to the Union Fund§!)."
 COLDWAR_UNI_directive_deliver:0 "Moscow's Directive: The Special Consignment"
 COLDWAR_UNI_directive_deliver_desc:0 "Instead of buildings Gosplan asks for money: a share of our income for the Union fund.\n\nGoal: a special consignment of §Y0.4%§! of our GDP to the Union fund.\nReward: §GPlan Fulfilled: Deliveries§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_goal_d_komsomol_trig_tt:0 "Sent: §Y5,000§! young workers for the construction sites of the Union (decision §YSend the Komsomol Brigades§!)."
 COLDWAR_UNI_directive_komsomol:0 "Moscow's Directive: The Komsomol Brigades"
 COLDWAR_UNI_directive_komsomol_desc:0 "The Komsomol calls its young men and women to the great construction sites of the Union.\n\nGoal: §Y5,000§! young workers for the construction sites of the Union.\nReward: §GPlan Fulfilled: Komsomol Brigades§! for 180 days (x1.5 for Moscow's priority and directives, x2 for a Counter-Plan); Moscow gains §GDeliveries from the Republics§!.\nFailure: Moscow suffers §RShortfalls in the Republics§! for 180 days and decides our punishment."
 COLDWAR_UNI_union_plan_trig_tt:0 "At least §Y[?global.COLDWAR_UNI_needed|0]§! republics have fulfilled their annual target (now §Y[?global.COLDWAR_UNI_fulfilled|0]§!)."
 COLDWAR_UNI_union_plan_lost_tt:0 "§RThe Plan Is Fulfilled! is lost for this year§! - for Moscow and for every republic."
 COLDWAR_UNI_union_plan:0 "Fulfil the Union Plan"
 COLDWAR_UNI_union_plan_desc:0 "If enough republics fulfil their annual target before the year is out, Moscow and every republic that kept its word receive §GThe Plan Is Fulfilled!§! for a year (stability +3%, construction speed +5%) and Union cohesion grows by 2. Every republic that fails makes it harder - and costs Moscow at once."
 COLDWAR_UNI_not_delivered_trig_tt:0 "We have not delivered yet."
 COLDWAR_UNI_deliver_fund:0 "Deliver to the Union Fund"
 COLDWAR_UNI_deliver_fund_desc:0 "Our republic pays its share into the Union fund: §Y0.2%§! of our GDP goes to Moscow."
 COLDWAR_UNI_not_delivered_special_trig_tt:0 "We have not delivered the special consignment yet."
 COLDWAR_UNI_deliver_special:0 "Deliver the Special Consignment"
 COLDWAR_UNI_deliver_special_desc:0 "Moscow's directive asks for §Y0.4%§! of our GDP for the Union fund."
 COLDWAR_UNI_not_komsomol_trig_tt:0 "We have not sent the brigades yet."
 COLDWAR_UNI_send_komsomol:0 "Send the Komsomol Brigades"
 COLDWAR_UNI_send_komsomol_desc:0 "5,000 young men and women leave our republic for the great construction sites of the Union."
 COLDWAR_UNI_tolkachi_tt:0 "The deadline of our annual target moves §Yonce§! when it runs out."
 COLDWAR_UNI_tolkachi_open_trig_tt:0 "Our annual target is running and the tolkachi have not been sent yet."
 COLDWAR_UNI_tolkachi_window_trig_tt:0 "The plan year still has room for a later deadline (until mid-December)."
 COLDWAR_UNI_send_tolkachi:0 "Send the Tolkachi"
 COLDWAR_UNI_send_tolkachi_desc:0 "Our 'pushers' travel the Union with cognac, caviar and promises: the missing cement and steel will be found. When the deadline of our annual target comes, it moves once - 45 days at most, never beyond the end of the plan year."
 COLDWAR_UNI_storm_tt:0 "Our §Yannual target§! is fulfilled at once."
 COLDWAR_UNI_storm_open_trig_tt:0 "Our annual target is running and has not been stormed yet."
 COLDWAR_UNI_storm_the_plan:0 "Storm the Plan"
 COLDWAR_UNI_storm_the_plan_desc:0 "Shturmovshchina: night shifts, Sunday shifts, every machine running at once. The annual target is fulfilled - and the workers and the machines pay for it."
 COLDWAR_UNI_dir_free_trig_tt:0 "No other directive is being drafted, and a Five-Year Plan is running."
 COLDWAR_UNI_directive_choose_tt:0 "We choose the task of the directive."
 COLDWAR_UNI_issue_directive:0 "Issue a Directive to [FROM.GetNameDef]"
 COLDWAR_UNI_issue_directive_desc:0 "Gosplan gives [FROM.GetNameDef] a special task: 270 days, a reward of x1.5 - and a failure we would have to judge. At most two directives per republic and Five-Year Plan, never the same task as its annual target."
 COLDWAR_UNI_issue_directive_cheap:0 "Issue a Directive to [FROM.GetNameDef]"
 COLDWAR_UNI_issue_directive_cheap_desc:0 "Gosplan gives [FROM.GetNameDef] a special task: 270 days, a reward of x1.5 - and a failure we would have to judge. At most two directives per republic and Five-Year Plan, never the same task as its annual target. §GGosplan Directives§! make it cheaper."
 COLDWAR_UNI_draft_unlock_tt:0 "Every republic may choose its own annual target from §YGosplan's Draft§! (Moscow's priority pays x1.5)."
 COLDWAR_UNI_cheap_directives_tt:0 "§YIssue a Directive§! costs 15 instead of 25 political power."
 COLDWAR_UNI_peoples_control_tt:0 "Every January the false plan reports of the year are §Yaudited§! (the chance of a KGB investigation)."
 COLDWAR_UNI_party_control_tt:0 "Reprimands and economic punishments no longer cost Union cohesion against republics §Ywithout a seat§! in the Politburo."
 COLDWAR_UNI_emulation_tt:0 "The four §YTransferable Red Banners§! of the Socialist Emulation (growth, industry, output per head, the plan) carry §Ytwice§! their bonus from the next quarter."
 COLDWAR_UNI_tolkachi_unlock_tt:0 "Every Union republic may §YSend the Tolkachi§! (25 political power): the deadline of its annual target moves once."
 COLDWAR_UNI_storming_unlock_tt:0 "Every Union republic may §YStorm the Plan§!: the annual target is fulfilled at once (stability -5%, construction speed -10% for 180 days)."
 COLDWAR_UNI_counter_unlock_tt:0 "§YGosplan's Draft§! offers the §YCounter-Plan§!: twice Moscow's priority target for double the reward."
 COLDWAR_UNI_reserves_tt:0 "The chance that our false reports or our cadres are uncovered falls by §G10%§!."
 COLDWAR_UNI_directives_9_tt:0 "While the Ninth Plan runs, §GThe Plan Is Fulfilled!§! also rewards the people's well-being: stability."
 COLDWAR_UNI_plan_9_trig_tt:0 "The Ninth Five-Year Plan (1971-1975) has begun."
 COLDWAR_UNI_good_years_9_trig_tt:0 "In at least three years of the Ninth Plan the Union plan was fulfilled (so far: §Y[?global.COLDWAR_UNI_good_years_9|0]§!)."
 COLDWAR_UNI_directives_10_tt:0 "While the Tenth Plan runs, §GThe Plan Is Fulfilled!§! also rewards efficiency and quality: production efficiency."
 COLDWAR_UNI_plan_10_trig_tt:0 "The Tenth Five-Year Plan (1976-1980) has begun."
 COLDWAR_UNI_good_years_10_trig_tt:0 "In at least three years of the Tenth Plan the Union plan was fulfilled (so far: §Y[?global.COLDWAR_UNI_good_years_10|0]§!)."
 COLDWAR_UNI_directives_11_tt:0 "While the Eleventh Plan runs, §GThe Plan Is Fulfilled!§! also rewards intensification: research."
 COLDWAR_UNI_plan_11_trig_tt:0 "The Eleventh Five-Year Plan (1981-1985) has begun."
 COLDWAR_UNI_good_years_11_trig_tt:0 "In at least three years of the Eleventh Plan the Union plan was fulfilled (so far: §Y[?global.COLDWAR_UNI_good_years_11|0]§!)."
 COLDWAR_UNI_directives_12_tt:0 "While the Twelfth Plan runs, §GThe Plan Is Fulfilled!§! also rewards uskorenie: construction speed."
 COLDWAR_UNI_plan_12_trig_tt:0 "The Twelfth Five-Year Plan (1986-1990) has begun."
 COLDWAR_UNI_good_years_12_trig_tt:0 "In at least three years of the Twelfth Plan the Union plan was fulfilled (so far: §Y[?global.COLDWAR_UNI_good_years_12|0]§!)."
 COLDWAR_UNI_who_all_trig_tt:0 "We take part in the Union plan (Moscow or a Union republic without a Declaration of Sovereignty)."
 COLDWAR_UNI_who_sov_trig_tt:0 "Only §YMoscow§! can take this focus (for the whole Union)."
 COLDWAR_UNI_who_rep_trig_tt:0 "Only a §YUnion republic§! in the Union plan can take this focus (for the whole Union)."
 COLDWAR_UNI_the_union_plan:0 "The Union Plan"
 COLDWAR_UNI_the_union_plan_desc:0 "Moscow and the fifteen republics pull in one direction: Gosplan's annual plan becomes a shared task. Whoever takes this focus takes it for the whole Union."
 COLDWAR_UNI_gosplan_directives:0 "Gosplan Directives"
 COLDWAR_UNI_gosplan_directives_desc:0 "The planning committee no longer asks: it directs. Special tasks for single republics become routine."
 COLDWAR_UNI_peoples_control:0 "The People's Control"
 COLDWAR_UNI_peoples_control_desc:0 "Committees of People's Control in every ministry and every kolkhoz check the figures the republics report."
 COLDWAR_UNI_party_control_commission:0 "The Party Control Commission"
 COLDWAR_UNI_party_control_commission_desc:0 "Pelshe's commission punishes on behalf of the Party itself - and the Party does not need to explain itself to the republics."
 COLDWAR_UNI_socialist_emulation:0 "Socialist Emulation"
 COLDWAR_UNI_socialist_emulation_desc:0 "Republic against republic, factory against factory: the best of the plan carry the Transferable Red Banner."
 COLDWAR_UNI_the_tolkachi:0 "The Tolkachi"
 COLDWAR_UNI_the_tolkachi_desc:0 "Every factory has its pushers - men who know where to find cement, cables and a favour. The republics stop pretending they do not exist."
 COLDWAR_UNI_storming_the_plan:0 "Storming the Plan"
 COLDWAR_UNI_storming_the_plan_desc:0 "When the quarter ends, the factories storm: night shifts and Sunday shifts until the figures are met."
 COLDWAR_UNI_counter_plan:0 "The Counter-Plan"
 COLDWAR_UNI_counter_plan_desc:0 "The best collectives promise more than Gosplan asked - and the newspapers print their names."
 COLDWAR_UNI_keep_reserves:0 "Keep Reserves in Hand"
 COLDWAR_UNI_keep_reserves_desc:0 "A wise director never reports his full capacity: next year's plan is calculated from this year's result."
 COLDWAR_UNI_directives_9:0 "Directives of the Ninth Plan"
 COLDWAR_UNI_directives_9_desc:0 "The Party Congress adopts the directives of the Ninth Five-Year Plan (1971-1975) for the whole Union. Its watchword: prosperity."
 COLDWAR_UNI_capstone_9:0 "The Ninth Plan Fulfilled"
 COLDWAR_UNI_capstone_9_desc:0 "The Union has fulfilled its plan in at least three years of this Five-Year Plan."
 COLDWAR_UNI_directives_10:0 "Directives of the Tenth Plan"
 COLDWAR_UNI_directives_10_desc:0 "The Party Congress adopts the directives of the Tenth Five-Year Plan (1976-1980) for the whole Union. Its watchword: efficiency."
 COLDWAR_UNI_capstone_10:0 "The Tenth Plan Fulfilled"
 COLDWAR_UNI_capstone_10_desc:0 "The Union has fulfilled its plan in at least three years of this Five-Year Plan."
 COLDWAR_UNI_directives_11:0 "Directives of the Eleventh Plan"
 COLDWAR_UNI_directives_11_desc:0 "The Party Congress adopts the directives of the Eleventh Five-Year Plan (1981-1985) for the whole Union. Its watchword: intensification."
 COLDWAR_UNI_capstone_11:0 "The Eleventh Plan Fulfilled"
 COLDWAR_UNI_capstone_11_desc:0 "The Union has fulfilled its plan in at least three years of this Five-Year Plan."
 COLDWAR_UNI_directives_12:0 "Directives of the Twelfth Plan"
 COLDWAR_UNI_directives_12_desc:0 "The Party Congress adopts the directives of the Twelfth Five-Year Plan (1986-1990) for the whole Union. Its watchword: acceleration."
 COLDWAR_UNI_capstone_12:0 "The Twelfth Plan Fulfilled"
 COLDWAR_UNI_capstone_12_desc:0 "The Union has fulfilled its plan in at least three years of this Five-Year Plan."
 COLDWAR_UNI_joint_all_tt:0 "Completes for Moscow and every Union republic in the Union plan."
 COLDWAR_UNI.1.t:0 "Gosplan Publishes the Plan"
 COLDWAR_UNI.1.d:0 "Gosplan publishes the plan of the year."
 COLDWAR_UNI.1.a:0 "Publish."
 COLDWAR_UNI.2.t:0 "Gosplan Publishes the Plan for [?global.COLDWAR_UNI_year|0]"
 COLDWAR_UNI.2.d:0 "Gosplan has sent the plan for [?global.COLDWAR_UNI_year|0] to the fifteen republics. Moscow's priority in the [COLDWAR_SOV_GetPlanName]: §Y[COLDWAR_UNI_GetPrioName]§!.\n\nEvery republic has its annual target and roughly 300 days to fulfil it. If at least §Y[?global.COLDWAR_UNI_needed|0]§! of the [?global.COLDWAR_UNI_members|0] republics deliver, Moscow and every republic that kept its word receive §GThe Plan Is Fulfilled!§!. Every republic that fails costs Moscow dearly - and Moscow will judge it."
 COLDWAR_UNI.2.a:0 "For the plan!"
 COLDWAR_UNI.3.t:0 "Gosplan's Draft for [?global.COLDWAR_UNI_year|0]"
 COLDWAR_UNI.3.d:0 "The draft of the plan has arrived from Moscow. Gosplan proposes Moscow's priority for our republic: §Y[COLDWAR_UNI_GetTargetName]§!. Our planners may propose another task instead - one that suits our republic better, but earns less. (Once the target is fulfilled, it can no longer be changed.)\n\n§YIf we do not answer within 15 days, Moscow's priority stands.§!"
 COLDWAR_UNI.3.a:0 "Keep Moscow's priority: §Y[COLDWAR_UNI_GetTargetName]§! (reward x1.5)."
 COLDWAR_UNI.3.b:0 "Our own mission: §YSteel and Tractors§! - one new §Ycivilian or military factory§!."
 COLDWAR_UNI.3.c:0 "Our own mission: §YPorts of the Union§! - one new §Ydockyard§!."
 COLDWAR_UNI.3.e:0 "Our own mission: §YRoads of the Union§! - one more level of §Yinfrastructure§! in any of our states."
 COLDWAR_UNI.3.f:0 "Our own mission: §YPower for the Plan§! - one new §Ypower station§! (fossil, nuclear or renewable)."
 COLDWAR_UNI.3.g:0 "Our own mission: §YBlack Gold of the Caspian§! - one new §Yrefinery§!."
 COLDWAR_UNI.3.h:0 "Our own mission: §YWhite Gold§! - one new §Yagriculture district§! for the cotton harvest."
 COLDWAR_UNI.3.i:0 "Our own mission: §YThe Virgin Lands Harvest§! - one new §Yagriculture district§! in the Virgin Lands."
 COLDWAR_UNI.3.j:0 "Our own mission: §YOrchards and Vineyards§! - one new §Yagriculture district§! for orchards and vineyards."
 COLDWAR_UNI.3.k:0 "Our own mission: §YRoads of the Union§! - one more level of §Yinfrastructure§! in any of our states."
 COLDWAR_UNI.3.l:0 "A general mission: §YPlan Deliveries§! - a delivery of §Y0.2%§! of our GDP to the Union fund."
 COLDWAR_UNI.3.m:0 "A general mission: §YParty Discipline§! - §Ystability of at least 50%§! when the deadline comes."
 COLDWAR_UNI.3.n:0 "§YThe Counter-Plan§!: we promise twice Moscow's priority target - two new buildings instead of one, for double the reward."
 COLDWAR_UNI.4.t:0 "The Plan for [?global.COLDWAR_UNI_year|0]"
 COLDWAR_UNI.4.d:0 "Gosplan has sent our republic its annual target: §Y[COLDWAR_UNI_GetTargetName]§!. We have about 300 days. If we deliver, our republic and Moscow profit; if we fail, Moscow loses and decides our punishment.\n\n(With the joint focus §YThe Union Plan§! our planners may propose their own task each year.)"
 COLDWAR_UNI.4.a:0 "We will fulfil the plan."
 COLDWAR_UNI.10.t:0 "Plan Failure in [From.GetNameDef]"
 COLDWAR_UNI.10.d:0 "[From.GetNameDefCap] [From.COLDWAR_UNI_GetFailure] The Union pays for it: [From.COLDWAR_UNI_GetLossLine]\n\nMoscow decides what follows. Every punishment has its price: a harsh hand costs Union cohesion, and a republic that is pushed too far turns towards sovereignty. [From.COLDWAR_UNI_GetProtection]\n\n§YIf we do not decide within 15 days, the republic goes unpunished.§!"
 COLDWAR_UNI.10.a:0 "Accept their explanations."
 COLDWAR_UNI.10.b:0 "A severe Party reprimand."
 COLDWAR_UNI.10.c:0 "Requisition their capacity: their civilian factories work for us for 60 days."
 COLDWAR_UNI.10.e:0 "Gosplan takes their offices for 60 days."
 COLDWAR_UNI.10.f:0 "Levy the shortfall: 0.3% of their GDP for the Union budget."
 COLDWAR_UNI.10.g:0 "Slow their construction: their brigades build for us for 60 days."
 COLDWAR_UNI.10.h:0 "Replace the First Secretary: put the cadre question to the Politburo."
 COLDWAR_UNI.10.i:0 "Replace the First Secretary by decree - without the Politburo."
 COLDWAR_UNI.10.j:0 "Khozraschet: the republic carries its own shortfall."
 COLDWAR_UNI.11.t:0 "Moscow Accepts Our Explanations"
 COLDWAR_UNI.11.d:0 "The Central Committee has heard our First Secretary. The harvest, the weather, the suppliers in other republics: Moscow accepts the explanations - this time."
 COLDWAR_UNI.11.a:0 "We will do better."
 COLDWAR_UNI.12.t:0 "A Severe Party Reprimand"
 COLDWAR_UNI.12.d:0 "The Party Control Committee has issued our First Secretary a severe reprimand with an entry in his personal file. The Republic's apparatus is shaken."
 COLDWAR_UNI.12.a:0 "Accept the reprimand."
 COLDWAR_UNI.13.t:0 "Moscow Requisitions Our Capacity"
 COLDWAR_UNI.13.d:0 "By order of Gosplan, part of our civilian industry works for the plans of the Union ministries for the next 60 days."
 COLDWAR_UNI.13.a:0 "The Union comes first."
 COLDWAR_UNI.14.t:0 "Gosplan Takes Our Offices"
 COLDWAR_UNI.14.d:0 "Union ministries have taken over the offices of our planning bodies and banks. For 60 days our administration works for Moscow."
 COLDWAR_UNI.14.a:0 "Comply."
 COLDWAR_UNI.15.t:0 "The Shortfall Is Levied"
 COLDWAR_UNI.15.d:0 "The Ministry of Finance of the USSR has debited 0.3% of our GDP from the republican budget to cover the shortfall."
 COLDWAR_UNI.15.a:0 "Pay."
 COLDWAR_UNI.16.t:0 "Our Brigades Build for the Union"
 COLDWAR_UNI.16.d:0 "Our construction trusts have been ordered to Union projects. For 60 days our own sites stand half empty."
 COLDWAR_UNI.16.a:0 "Send the brigades."
 COLDWAR_UNI.17.t:0 "Moscow's Man in Our Republic"
 COLDWAR_UNI.17.d:0 "Moscow has retired our First Secretary and installed [Root.GetLeader]. In the Party and on the streets people ask whether the republic is still governed from its own capital."
 COLDWAR_UNI.17.a:0 "Accept Moscow's choice."
 COLDWAR_UNI.17.b:0 "The streets answer."
 COLDWAR_UNI.18.t:0 "Moscow Replaces the First Secretary of [From.GetNameDef]"
 COLDWAR_UNI.18.d:0 "The plenum of the Central Committee of [From.GetNameDef] has 'granted the request' of its First Secretary to retire. His successor, [From.GetLeader], comes with Moscow's blessing - and with Moscow's instructions."
 COLDWAR_UNI.18.a:0 "A cadre decision."
 COLDWAR_UNI.19.t:0 "Moscow's Choice Eases"
 COLDWAR_UNI.19.d:0 "Moscow's Choice eases."
 COLDWAR_UNI.19.a:0 "Ease."
 COLDWAR_UNI.20.t:0 "A Directive for the [COLDWAR_UNI_GetDirTarget]"
 COLDWAR_UNI.20.d:0 "Gosplan is ready to give the [COLDWAR_UNI_GetDirTarget] a special task. A directive runs 270 days and pays x1.5 if it is fulfilled; if it fails, the Union suffers and we judge. It must not repeat the republic's running annual target."
 COLDWAR_UNI.20.a:0 "Withdraw the directive."
 COLDWAR_UNI.20.b:0 "Moscow's Directive: Fulfil the Industrial Plan - one new §Ycivilian factory§!."
 COLDWAR_UNI.20.c:0 "Moscow's Directive: The Defence Order - one new §Ymilitary factory§!."
 COLDWAR_UNI.20.e:0 "Moscow's Directive: Power for the Plan - one new §Ypower station§! (fossil, nuclear or renewable)."
 COLDWAR_UNI.20.f:0 "Moscow's Directive: Atoms for the Republic - one new §Ynuclear reactor§!."
 COLDWAR_UNI.20.g:0 "Moscow's Directive: The Harvest Quota - one new §Yagriculture district§!."
 COLDWAR_UNI.20.h:0 "Moscow's Directive: Roads of the Union - one more level of §Yinfrastructure§! in any of our states."
 COLDWAR_UNI.20.i:0 "Moscow's Directive: Ports of the Union - one new §Ydockyard§!."
 COLDWAR_UNI.20.j:0 "Moscow's Directive: The Special Consignment - a special consignment of §Y0.4%§! of our GDP to the Union fund."
 COLDWAR_UNI.20.k:0 "Moscow's Directive: The Komsomol Brigades - §Y5,000§! young workers for the construction sites of the Union."
 COLDWAR_UNI.21.t:0 "Moscow's Directive"
 COLDWAR_UNI.21.d:0 "Gosplan has issued our republic a special directive: §Y[COLDWAR_UNI_GetDirectiveName]§!. We have 270 days."
 COLDWAR_UNI.21.a:0 "The directive will be fulfilled."
 COLDWAR_UNI.22.t:0 "Khozraschet"
 COLDWAR_UNI.22.d:0 "Moscow will not punish us. Under the new economic accounting our republic carries the cost of its own shortfall."
 COLDWAR_UNI.22.a:0 "Self-financing, then."
 COLDWAR_UNI.23.t:0 "The Cadre Question"
 COLDWAR_UNI.23.d:0 "Moscow has put the replacement of our First Secretary to the Politburo. If the Politburo agrees, he must go."
 COLDWAR_UNI.23.a:0 "We will see how the Politburo votes."
 COLDWAR_UNI.24.t:0 "Unrest in [From.GetNameDef]"
 COLDWAR_UNI.24.d:0 "Thousands have gathered in the capital of [From.GetNameDef] against the First Secretary Moscow sent them. Students, writers and young party members demand a leader of their own nation. The Union's cohesion suffers."
 COLDWAR_UNI.24.a:0 "Troubling news."
 COLDWAR_UNI.30.t:0 "Pravda: [From.GetNameDefCap] Has Failed Its Plan"
 COLDWAR_UNI.30.d:0 "[From.GetNameDefCap] [From.COLDWAR_UNI_GetFailure] The whole Union pays the price: [From.COLDWAR_UNI_GetLossLine]\n\nUnion plan [?global.COLDWAR_UNI_year|0]: §Y[?global.COLDWAR_UNI_fulfilled|0]§! republics have fulfilled their target, §Y[?global.COLDWAR_UNI_needed|0]§! are needed for §GThe Plan Is Fulfilled!§!. Moscow will decide how [From.GetNameDef] answers for it."
 COLDWAR_UNI.30.a:0 "Shameful."
 COLDWAR_UNI.31.t:0 "Pripiski Exposed in [From.GetNameDefCap]"
 COLDWAR_UNI.31.d:0 "The inspectors have found what the reports concealed: [From.GetNameDef] reported a plan it never fulfilled. The reward is withdrawn, the republic is in disgrace, and the false figures cost the Union twice: [From.COLDWAR_UNI_GetLossLine]"
 COLDWAR_UNI.31.a:0 "Who will count the cotton now?"
 COLDWAR_UNI.32.t:0 "The Plan Is Fulfilled!"
 COLDWAR_UNI.32.d:0 "§Y[?global.COLDWAR_UNI_fulfilled|0]§! republics have fulfilled their annual target - the Union plan for [?global.COLDWAR_UNI_year|0] is fulfilled ahead of time. Moscow and every republic that kept its word receive §GThe Plan Is Fulfilled!§! for a year, and Union cohesion grows."
 COLDWAR_UNI.32.a:0 "Glory to the Soviet people!"
 COLDWAR_UNI.34.t:0 "The Plan Year [?global.COLDWAR_UNI_last_year|0]"
 COLDWAR_UNI.34.d:0 "Gosplan has closed the books of [?global.COLDWAR_UNI_last_year|0]: §Y[?global.COLDWAR_UNI_last_fulfilled|0]§! of [?global.COLDWAR_UNI_last_members|0] republics fulfilled their annual target; [?global.COLDWAR_UNI_last_needed|0] were needed. [COLDWAR_UNI_GetLastResult][COLDWAR_UNI_GetShortfallNote][COLDWAR_UNI_GetRedBanner]\n\nThe republics:[UKR.COLDWAR_UNI_GetLastLine][BLR.COLDWAR_UNI_GetLastLine][EST.COLDWAR_UNI_GetLastLine][LAT.COLDWAR_UNI_GetLastLine][LIT.COLDWAR_UNI_GetLastLine][ARM.COLDWAR_UNI_GetLastLine][AZE.COLDWAR_UNI_GetLastLine][GEO.COLDWAR_UNI_GetLastLine][KAZ.COLDWAR_UNI_GetLastLine][KYR.COLDWAR_UNI_GetLastLine][TAJ.COLDWAR_UNI_GetLastLine][TRK.COLDWAR_UNI_GetLastLine][UZB.COLDWAR_UNI_GetLastLine][MLV.COLDWAR_UNI_GetLastLine]"
 COLDWAR_UNI.34.a:0 "The next plan begins."
 COLDWAR_UNI.41.t:0 "Shortfall Expires"
 COLDWAR_UNI.41.d:0 "A shortfall expires."
 COLDWAR_UNI.41.a:0 "Expire."
 COLDWAR_UNI.42.t:0 "Shortfall Expires"
 COLDWAR_UNI.42.d:0 "An exposed shortfall expires."
 COLDWAR_UNI.42.a:0 "Expire."
 COLDWAR_UNI.43.t:0 "Delivery Expires"
 COLDWAR_UNI.43.d:0 "A delivery bonus expires."
 COLDWAR_UNI.43.a:0 "Expire."
 COLDWAR_UNI.44.t:0 "Requisition Ends"
 COLDWAR_UNI.44.d:0 "The requisition ends."
 COLDWAR_UNI.44.a:0 "End."
 COLDWAR_UNI.45.t:0 "Pripiski Exposed"
 COLDWAR_UNI.45.d:0 "The false report of the republic is exposed."
 COLDWAR_UNI.45.a:0 "Expose."
 COLDWAR_UNI.90.t:0 "AI Plan"
 COLDWAR_UNI.90.d:0 "The AI republic fulfils its plan."
 COLDWAR_UNI.90.a:0 "Fulfil."
 COLDWAR_UNI.91.t:0 "AI Directive"
 COLDWAR_UNI.91.d:0 "The AI republic fulfils its directive."
 COLDWAR_UNI.91.a:0 "Fulfil."
 COLDWAR_UNI_reward_industry_1:0 "Plan Fulfilled: Industry"
 COLDWAR_UNI_reward_industry_1_desc:0 "Our republic has kept its word to Gosplan. The plan bonus is paid for half a year."
 COLDWAR_UNI_reward_industry_2:0 "Plan Overfulfilled: Industry"
 COLDWAR_UNI_reward_industry_2_desc:0 "Our republic has kept its word to Gosplan. The plan bonus is paid for half a year."
