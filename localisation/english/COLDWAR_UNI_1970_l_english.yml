 COLDWAR_UNI_reward_discipline_3_desc:0 "Our republic has kept its word to Gosplan. The plan bonus is paid for half a year."
 COLDWAR_UNI_reward_komsomol_1:0 "Plan Fulfilled: Komsomol Brigades"
 COLDWAR_UNI_reward_komsomol_1_desc:0 "Our republic has kept its word to Gosplan. The plan bonus is paid for half a year."
 COLDWAR_UNI_reward_komsomol_2:0 "Plan Overfulfilled: Komsomol Brigades"
 COLDWAR_UNI_reward_komsomol_2_desc:0 "Our republic has kept its word to Gosplan. The plan bonus is paid for half a year."
