 COLDWAR_UNI_reward_deliver_3_desc:0 "Our republic has kept its word to Gosplan. The plan bonus is paid for half a year."
 COLDWAR_UNI_reward_discipline_1:0 "Plan Fulfilled: Party Discipline"
 COLDWAR_UNI_reward_discipline_1_desc:0 "Our republic has kept its word to Gosplan. The plan bonus is paid for half a year."
 COLDWAR_UNI_reward_discipline_2:0 "Plan Overfulfilled: Party Discipline"
 COLDWAR_UNI_reward_discipline_2_desc:0 "Our republic has kept its word to Gosplan. The plan bonus is paid for half a year."
