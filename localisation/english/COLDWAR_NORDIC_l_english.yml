# IMPERIA COLD WAR — Sami: Sweden 1970 and Nordic cooperation.
 COLDWAR_NORDIC_council_member:0 "Member of the Nordic Council"
 COLDWAR_NORDIC_council_member_desc:0 "The Council brings the Nordic governments together for civilian cooperation under the Helsinki Treaty. Each government signs its own commitments."
 COLDWAR_NORDIC_council_business:0 "Nordic Council"
 COLDWAR_NORDIC_council_business_desc:0 "Sign the programmes your government wants to join. Two or more members can begin. The signatory list closes when work starts.\n\nWorking Life:[COLDWAR_NORDIC_labour_lock][COLDWAR_NORDIC_labour_name_SWE][COLDWAR_NORDIC_labour_name_NRY][COLDWAR_NORDIC_labour_name_DEN][COLDWAR_NORDIC_labour_name_FIN][COLDWAR_NORDIC_labour_name_ICE]\nIndustrial Finance:[COLDWAR_NORDIC_finance_lock][COLDWAR_NORDIC_finance_name_SWE][COLDWAR_NORDIC_finance_name_NRY][COLDWAR_NORDIC_finance_name_DEN][COLDWAR_NORDIC_finance_name_FIN][COLDWAR_NORDIC_finance_name_ICE]\nResearch:[COLDWAR_NORDIC_research_lock][COLDWAR_NORDIC_research_name_SWE][COLDWAR_NORDIC_research_name_NRY][COLDWAR_NORDIC_research_name_DEN][COLDWAR_NORDIC_research_name_FIN][COLDWAR_NORDIC_research_name_ICE]\nPublic Services:[COLDWAR_NORDIC_services_lock][COLDWAR_NORDIC_services_name_SWE][COLDWAR_NORDIC_services_name_NRY][COLDWAR_NORDIC_services_name_DEN][COLDWAR_NORDIC_services_name_FIN][COLDWAR_NORDIC_services_name_ICE]\nRenew the Compact:[COLDWAR_NORDIC_compact_lock][COLDWAR_NORDIC_compact_name_SWE][COLDWAR_NORDIC_compact_name_NRY][COLDWAR_NORDIC_compact_name_DEN][COLDWAR_NORDIC_compact_name_FIN][COLDWAR_NORDIC_compact_name_ICE]\n[COLDWAR_NORDIC_GetProjectStatus]"
