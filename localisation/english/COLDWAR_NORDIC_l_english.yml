 COLDWAR_NORDIC_shortcut:0 "Nordic Cooperation"
 COLDWAR_NORDIC_helsinki_framework:0 "The Helsinki Framework"
 COLDWAR_NORDIC_helsinki_framework_desc:0 "The Helsinki Treaty already gives the Nordic governments a place to meet. Our delegation can now put specific programmes before the Council and decide which ones to sign."
 COLDWAR_NORDIC_council_required:0 "Is a member of the Nordic Council."
 COLDWAR_NORDIC_open_register:0 "Opens the Nordic Council programme register in Decisions."
 COLDWAR_NORDIC_quote_tt:0 "Treasury contribution: USD $AMOUNT$ billion."
 COLDWAR_NORDIC_labour_ready_tt:0 "At least two governments must sign Working Life. After work begins, all recorded signatories must be able to take part."
 COLDWAR_NORDIC_labour_busy_tt:0 "A signatory must finish the current focus before the group can start another."
 COLDWAR_NORDIC_labour_sign:0 "Sign Working Life"
 COLDWAR_NORDIC_labour_sign_desc:0 "Join the programme before its first joint focus begins. Later capital bills require a separate decision."
 COLDWAR_NORDIC_labour_withdraw:0 "Withdraw signature from Working Life"
 COLDWAR_NORDIC_labour_withdraw_desc:0 "Withdraw before the first joint focus begins."
 COLDWAR_NORDIC_labour_suspend:0 "Pause Working Life"
 COLDWAR_NORDIC_labour_suspend_desc:0 "The programme keeps its signatories, completed work and paid contributions. All signatories must be ready before another focus starts."
 COLDWAR_NORDIC_labour_resume:0 "Resume Working Life"
 COLDWAR_NORDIC_labour_resume_desc:0 "The programme keeps its signatories, completed work and paid contributions. All signatories must be ready before another focus starts."
 COLDWAR_NORDIC_labour_vote_1_tt:0 "Every signatory must agree to Portable Social Rights."
 COLDWAR_NORDIC_labour_vote_1:0 "Support Portable Social Rights"
 COLDWAR_NORDIC_labour_vote_1_desc:0 "Record this government's preference. Every signatory must support the same option before it can begin."
 COLDWAR_NORDIC_labour_vote_2_tt:0 "Every signatory must agree to Regional Skills Agreements."
 COLDWAR_NORDIC_labour_vote_2:0 "Support Regional Skills Agreements"
 COLDWAR_NORDIC_labour_vote_2_desc:0 "Record this government's preference. Every signatory must support the same option before it can begin."
 COLDWAR_NORDIC_labour_programme:0 "Nordic Working Life"
 COLDWAR_NORDIC_labour_programme_desc:0 "The current commitments and gains from this programme."
 COLDWAR_NORDIC_labour_office:0 "A Common Labour Office"
 COLDWAR_NORDIC_labour_office_desc:0 "A worker who takes a job across the border should know which office to call. The signatories will establish a common register of the rules their employment offices apply."
 COLDWAR_NORDIC_labour_office_effect_tt:0 "Opens the working-life policy vote."
 COLDWAR_NORDIC_portable_rights:0 "Portable Social Rights"
 COLDWAR_NORDIC_portable_rights_desc:0 "A family that moves for work should keep its place in the social insurance system. The signatories will recognise each other's records and pay the resulting claims."
 COLDWAR_NORDIC_regional_skills:0 "Regional Skills Agreements"
 COLDWAR_NORDIC_regional_skills_desc:0 "Workshops and technical colleges can train for the jobs the region actually needs. Governments will cover the teaching bill and keep their own social insurance rules."
 COLDWAR_NORDIC_recognise_qualifications:0 "Recognise Qualifications"
 COLDWAR_NORDIC_recognise_qualifications_desc:0 "A builder with a certificate from another Nordic country should be able to get back to work without sitting the same exam twice."
 COLDWAR_NORDIC_labour_settlement:0 "A Labour-Market Settlement"
 COLDWAR_NORDIC_labour_settlement_desc:0 "The common labour market has operated since the 1950s. The new agreement updates it for the people and employers now using it."
 COLDWAR_NORDIC_language_access:0 "Language Access in Public Offices"
 COLDWAR_NORDIC_language_access_desc:0 "Forms and interpreters will help people deal with the office on the other side of a border. A smaller backlog should repay some of the training bill."
 COLDWAR_NORDIC_working_life:0 "A Nordic Working Life"
 COLDWAR_NORDIC_working_life_desc:0 "The agreement is earning its keep when a family can move for a job without months of uncertainty. Keep the service offices funded as more people use them."
 COLDWAR_NORDIC_finance_ready_tt:0 "At least two governments must sign Industrial Finance. After work begins, all recorded signatories must be able to take part."
 COLDWAR_NORDIC_finance_busy_tt:0 "A signatory must finish the current focus before the group can start another."
 COLDWAR_NORDIC_finance_sign:0 "Sign Industrial Finance"
 COLDWAR_NORDIC_finance_sign_desc:0 "Join the programme before its first joint focus begins. Later capital bills require a separate decision."
 COLDWAR_NORDIC_finance_withdraw:0 "Withdraw signature from Industrial Finance"
 COLDWAR_NORDIC_finance_withdraw_desc:0 "Withdraw before the first joint focus begins."
 COLDWAR_NORDIC_finance_suspend:0 "Pause Industrial Finance"
 COLDWAR_NORDIC_finance_suspend_desc:0 "The programme keeps its signatories, completed work and paid contributions. All signatories must be ready before another focus starts."
 COLDWAR_NORDIC_finance_resume:0 "Resume Industrial Finance"
 COLDWAR_NORDIC_finance_resume_desc:0 "The programme keeps its signatories, completed work and paid contributions. All signatories must be ready before another focus starts."
 COLDWAR_NORDIC_finance_vote_1_tt:0 "Every signatory must agree to A Common Investment Bank."
 COLDWAR_NORDIC_finance_vote_1:0 "Support A Common Investment Bank"
 COLDWAR_NORDIC_finance_vote_1_desc:0 "Record this government's preference. Every signatory must support the same option before it can begin."
 COLDWAR_NORDIC_finance_vote_2_tt:0 "Every signatory must agree to National Banks, Shared Guarantees."
 COLDWAR_NORDIC_finance_vote_2:0 "Support National Banks, Shared Guarantees"
 COLDWAR_NORDIC_finance_vote_2_desc:0 "Record this government's preference. Every signatory must support the same option before it can begin."
 COLDWAR_NORDIC_finance_programme:0 "Nordic Industrial Finance"
 COLDWAR_NORDIC_finance_programme_desc:0 "The current commitments and gains from this programme."
 COLDWAR_NORDIC_industrial_finance:0 "Nordic Industrial Finance"
 COLDWAR_NORDIC_industrial_finance_desc:0 "Large projects can exhaust the resources of a small national lender. The signatories will agree whether to pool capital or to guarantee loans through their own banks."
 COLDWAR_NORDIC_industrial_finance_effect_tt:0 "Opens the industrial finance policy vote."
 COLDWAR_NORDIC_investment_bank:0 "A Common Investment Bank"
 COLDWAR_NORDIC_investment_bank_desc:0 "The Nordic Investment Bank can finance projects that are hard for one country to carry. Each government must put up its own capital before the bank can start work."
 COLDWAR_NORDIC_investment_bank_cash_tt:0 "Has enough in the treasury to pay 0.50% of GDP."
 COLDWAR_NORDIC_investment_bank_contribute:0 "Fund A Common Investment Bank"
 COLDWAR_NORDIC_investment_bank_contribute_desc:0 "Pay 0.50% of GDP once from the treasury. The focus becomes available after every signatory has paid."
 COLDWAR_NORDIC_investment_bank_funded_tt:0 "Every signatory must pay its contribution of 0.50% of GDP."
 COLDWAR_NORDIC_shared_guarantees:0 "National Banks, Shared Guarantees"
 COLDWAR_NORDIC_shared_guarantees_desc:0 "Let national lenders issue the loans. Common guarantee rules make projects easier to finance while each government keeps a say over the proposals it backs."
 COLDWAR_NORDIC_named_project:0 "Finance a Named Project"
 COLDWAR_NORDIC_named_project_desc:0 "Put a real site in the ledger. Civilian industry, offices and infrastructure paid for through the investment window can be recorded as Council projects when two signatories are involved."
 COLDWAR_NORDIC_named_project_effect_tt:0 "A new civilian industry, office or infrastructure project financed between two signatories through the normal investment window counts toward the Nordic Industrial Network."
 COLDWAR_NORDIC_technical_standards:0 "Common Technical Standards"
 COLDWAR_NORDIC_technical_standards_desc:0 "A supplier who can build to one set of drawings can serve several markets. Inspectors and shop-floor trainers will have work to do before those gains arrive."
 COLDWAR_NORDIC_smaller_firms:0 "Fair Access for Smaller Firms"
 COLDWAR_NORDIC_smaller_firms_desc:0 "A common market for industrial projects is only useful if smaller firms can bid. The signatories will publish the terms and staff a simple appeals process."
 COLDWAR_NORDIC_industrial_network:0 "A Nordic Industrial Network"
 COLDWAR_NORDIC_industrial_network_desc:0 "Use the experience from a delivered joint investment to improve the next generation of industrial projects."
 COLDWAR_NORDIC_industrial_network_project_tt:0 "Two signatories must deliver a Nordic investment project."
 COLDWAR_NORDIC_research_ready_tt:0 "At least two governments must sign Research. After work begins, all recorded signatories must be able to take part."
 COLDWAR_NORDIC_research_busy_tt:0 "A signatory must finish the current focus before the group can start another."
 COLDWAR_NORDIC_research_sign:0 "Sign Research"
 COLDWAR_NORDIC_research_sign_desc:0 "Join the programme before its first joint focus begins. Later capital bills require a separate decision."
 COLDWAR_NORDIC_research_withdraw:0 "Withdraw signature from Research"
 COLDWAR_NORDIC_research_withdraw_desc:0 "Withdraw before the first joint focus begins."
 COLDWAR_NORDIC_research_suspend:0 "Pause Research"
 COLDWAR_NORDIC_research_suspend_desc:0 "The programme keeps its signatories, completed work and paid contributions. All signatories must be ready before another focus starts."
 COLDWAR_NORDIC_research_resume:0 "Resume Research"
 COLDWAR_NORDIC_research_resume_desc:0 "The programme keeps its signatories, completed work and paid contributions. All signatories must be ready before another focus starts."
 COLDWAR_NORDIC_research_vote_1_tt:0 "Every signatory must agree to Open Academic Exchange."
 COLDWAR_NORDIC_research_vote_1:0 "Support Open Academic Exchange"
 COLDWAR_NORDIC_research_vote_1_desc:0 "Record this government's preference. Every signatory must support the same option before it can begin."
 COLDWAR_NORDIC_research_vote_2_tt:0 "Every signatory must agree to Protected Strategic Research."
 COLDWAR_NORDIC_research_vote_2:0 "Support Protected Strategic Research"
 COLDWAR_NORDIC_research_vote_2_desc:0 "Record this government's preference. Every signatory must support the same option before it can begin."
 COLDWAR_NORDIC_research_programme:0 "Nordic Research"
 COLDWAR_NORDIC_research_programme_desc:0 "The current commitments and gains from this programme."
 COLDWAR_NORDIC_research_desk:0 "The Nordic Research Desk"
 COLDWAR_NORDIC_research_desk_desc:0 "The same instruments are too expensive for every laboratory to buy. The signatories will agree which work to share and which work stays under national control."
 COLDWAR_NORDIC_research_desk_effect_tt:0 "Opens the research policy vote."
 COLDWAR_NORDIC_open_exchange:0 "Open Academic Exchange"
 COLDWAR_NORDIC_open_exchange_desc:0 "Open the grant lists and make exchanges easy. More researchers can work together, and governments will have less control over the ideas that travel with them."
 COLDWAR_NORDIC_protected_research:0 "Protected Strategic Research"
 COLDWAR_NORDIC_protected_research_desc:0 "Share civilian findings through vetted teams and keep sensitive work behind national security rules. The restrictions cost time and staff."
 COLDWAR_NORDIC_joint_laboratories:0 "Joint Laboratories"
 COLDWAR_NORDIC_joint_laboratories_desc:0 "A shared laboratory gives teams access to equipment they cannot each afford. The work begins after the signatories have paid their contributions."
 COLDWAR_NORDIC_joint_laboratories_cash_tt:0 "Has enough in the treasury to pay 0.20% of GDP."
 COLDWAR_NORDIC_joint_laboratories_contribute:0 "Fund Joint Laboratories"
 COLDWAR_NORDIC_joint_laboratories_contribute_desc:0 "Pay 0.20% of GDP once from the treasury. The focus becomes available after every signatory has paid."
 COLDWAR_NORDIC_joint_laboratories_funded_tt:0 "Every signatory must pay its contribution of 0.20% of GDP."
 COLDWAR_NORDIC_university_networks:0 "Connect the University Networks"
 COLDWAR_NORDIC_university_networks_desc:0 "The universities can exchange results by connecting their computers. Each member must have the equipment and fund its end of the connection."
 COLDWAR_NORDIC_university_networks_technology_tt:0 "All signatories must have researched $computing_2$."
 COLDWAR_NORDIC_university_networks_cash_tt:0 "Has enough in the treasury to pay 0.10% of GDP."
 COLDWAR_NORDIC_university_networks_contribute:0 "Fund Connect the University Networks"
 COLDWAR_NORDIC_university_networks_contribute_desc:0 "Pay 0.10% of GDP once from the treasury. The focus becomes available after every signatory has paid."
 COLDWAR_NORDIC_university_networks_funded_tt:0 "Every signatory must pay its contribution of 0.10% of GDP."
 COLDWAR_NORDIC_compatible_network:0 "Keep the Network Compatible"
 COLDWAR_NORDIC_compatible_network_desc:0 "One university should be able to replace its computers without cutting off its neighbours. The signatories will maintain common protocols and train the staff who run the links."
 COLDWAR_NORDIC_nordunet:0 "NORDUnet"
 COLDWAR_NORDIC_nordunet_desc:0 "The university links are ready for regular use. Keep funding the staff and equipment so researchers can depend on the network for everyday work."
 COLDWAR_NORDIC_services_ready_tt:0 "At least two governments must sign Public Services. After work begins, all recorded signatories must be able to take part."
 COLDWAR_NORDIC_services_busy_tt:0 "A signatory must finish the current focus before the group can start another."
 COLDWAR_NORDIC_services_sign:0 "Sign Public Services"
 COLDWAR_NORDIC_services_sign_desc:0 "Join the programme before its first joint focus begins. Later capital bills require a separate decision."
 COLDWAR_NORDIC_services_withdraw:0 "Withdraw signature from Public Services"
 COLDWAR_NORDIC_services_withdraw_desc:0 "Withdraw before the first joint focus begins."
 COLDWAR_NORDIC_services_suspend:0 "Pause Public Services"
 COLDWAR_NORDIC_services_suspend_desc:0 "The programme keeps its signatories, completed work and paid contributions. All signatories must be ready before another focus starts."
 COLDWAR_NORDIC_services_resume:0 "Resume Public Services"
 COLDWAR_NORDIC_services_resume_desc:0 "The programme keeps its signatories, completed work and paid contributions. All signatories must be ready before another focus starts."
 COLDWAR_NORDIC_services_vote_1_tt:0 "Every signatory must agree to Integrated Mainland Power."
 COLDWAR_NORDIC_services_vote_1:0 "Support Integrated Mainland Power"
 COLDWAR_NORDIC_services_vote_1_desc:0 "Record this government's preference. Every signatory must support the same option before it can begin."
 COLDWAR_NORDIC_services_vote_2_tt:0 "Every signatory must agree to Resilient National Systems."
 COLDWAR_NORDIC_services_vote_2:0 "Support Resilient National Systems"
 COLDWAR_NORDIC_services_vote_2_desc:0 "Record this government's preference. Every signatory must support the same option before it can begin."
 COLDWAR_NORDIC_services_programme:0 "Nordic Public Services"
 COLDWAR_NORDIC_services_programme_desc:0 "The current commitments and gains from this programme."
 COLDWAR_NORDIC_cross_border_services:0 "Services Across the Border"
 COLDWAR_NORDIC_cross_border_services_desc:0 "A storm, a power shortage or an accident at sea can leave a small country short of help. Agree what the public services can ask of their neighbours."
 COLDWAR_NORDIC_cross_border_services_effect_tt:0 "Opens the public services policy vote."
 COLDWAR_NORDIC_mainland_power:0 "Integrated Mainland Power"
 COLDWAR_NORDIC_mainland_power_desc:0 "Coordinate supply and reserve planning on connected mainland systems. Iceland can share planning and technical training through an island agreement."
 COLDWAR_NORDIC_national_resilience:0 "Resilient National Systems"
 COLDWAR_NORDIC_national_resilience_desc:0 "Keep reserve capacity and repair teams under national control. Common procedures will help crews restore transport links after an emergency."
 COLDWAR_NORDIC_coastal_services:0 "Coastal and Island Services"
 COLDWAR_NORDIC_coastal_services_desc:0 "Shared reporting rules help patrols and rescue crews interpret sightings. Maintaining those watch schedules takes more personnel time."
 COLDWAR_NORDIC_cross_border_rescue:0 "Prepare Cross-Border Rescue"
 COLDWAR_NORDIC_cross_border_rescue_desc:0 "Agree who takes the first call, which teams can cross the border and who provides transport. Individual governments retain the decision to send crews."
 COLDWAR_NORDIC_environmental_safeguards:0 "Agree Environmental Safeguards"
 COLDWAR_NORDIC_environmental_safeguards_desc:0 "A damaged river or coastline has more than one government to answer to. Common rules and trained inspectors give engineering projects a clear standard."
 COLDWAR_NORDIC_environmental_fund:0 "A Nordic Environmental Fund"
 COLDWAR_NORDIC_environmental_fund_desc:0 "The signatories can enter renewable energy and agricultural projects in a common register once they have provided their contributions. Each project still needs its normal investment agreement."
 COLDWAR_NORDIC_environmental_fund_cash_tt:0 "Has enough in the treasury to pay 0.20% of GDP."
 COLDWAR_NORDIC_environmental_fund_contribute:0 "Fund A Nordic Environmental Fund"
 COLDWAR_NORDIC_environmental_fund_contribute_desc:0 "Pay 0.20% of GDP once from the treasury. The focus becomes available after every signatory has paid."
 COLDWAR_NORDIC_environmental_fund_funded_tt:0 "Every signatory must pay its contribution of 0.20% of GDP."
 COLDWAR_NORDIC_environmental_fund_effect_tt:0 "New renewable energy or agricultural investments between signatories are recorded in the environmental fund register."
 COLDWAR_NORDIC_compact_ready_tt:0 "At least two governments must sign Renew the Compact. After work begins, all recorded signatories must be able to take part."
 COLDWAR_NORDIC_compact_busy_tt:0 "A signatory must finish the current focus before the group can start another."
 COLDWAR_NORDIC_compact_sign:0 "Sign Renew the Compact"
 COLDWAR_NORDIC_compact_sign_desc:0 "Join the programme before its first joint focus begins. Later capital bills require a separate decision."
 COLDWAR_NORDIC_compact_withdraw:0 "Withdraw signature from Renew the Compact"
 COLDWAR_NORDIC_compact_withdraw_desc:0 "Withdraw before the first joint focus begins."
 COLDWAR_NORDIC_compact_suspend:0 "Pause Renew the Compact"
 COLDWAR_NORDIC_compact_suspend_desc:0 "The programme keeps its signatories, completed work and paid contributions. All signatories must be ready before another focus starts."
 COLDWAR_NORDIC_compact_resume:0 "Resume Renew the Compact"
 COLDWAR_NORDIC_compact_resume_desc:0 "The programme keeps its signatories, completed work and paid contributions. All signatories must be ready before another focus starts."
 COLDWAR_NORDIC_compact_vote_1_tt:0 "Every signatory must agree to A Standing Nordic Secretariat."
 COLDWAR_NORDIC_compact_vote_1:0 "Support A Standing Nordic Secretariat"
 COLDWAR_NORDIC_compact_vote_1_desc:0 "Record this government's preference. Every signatory must support the same option before it can begin."
 COLDWAR_NORDIC_compact_vote_2_tt:0 "Every signatory must agree to Cooperation by Treaty."
 COLDWAR_NORDIC_compact_vote_2:0 "Support Cooperation by Treaty"
 COLDWAR_NORDIC_compact_vote_2_desc:0 "Record this government's preference. Every signatory must support the same option before it can begin."
 COLDWAR_NORDIC_compact_programme:0 "Nordic Compact"
 COLDWAR_NORDIC_compact_programme_desc:0 "The current commitments and gains from this programme."
 COLDWAR_NORDIC_renew_compact:0 "Renew the Nordic Compact"
 COLDWAR_NORDIC_renew_compact_desc:0 "The governments that completed the four programmes can agree how to keep them running. The work can go to a standing office or remain with the national administrations."
 COLDWAR_NORDIC_renew_compact_effect_tt:0 "Opens the vote on how to run the Nordic Compact."
 COLDWAR_NORDIC_standing_secretariat:0 "A Standing Nordic Secretariat"
 COLDWAR_NORDIC_standing_secretariat_desc:0 "A permanent office can act promptly on common decisions. Its staff and offices will need a continuing contribution from each government."
 COLDWAR_NORDIC_cooperation_by_treaty:0 "Cooperation by Treaty"
 COLDWAR_NORDIC_cooperation_by_treaty_desc:0 "Keep the secretariat small and run the agreements through national ministries. Administration costs less, though decisions will take longer to coordinate."
 COLDWAR_NORDIC_project_status_0:0 "Both industrial and environmental investments have been delivered."
 COLDWAR_NORDIC_project_status_1:0 "A Nordic industrial investment has been delivered."
 COLDWAR_NORDIC_project_status_2:0 "A Nordic environmental investment has been delivered."
