l_english:
 PAK_1985_focus: "Pakistan 1985 Focus Tree"

 ###################################################
 # OPENING
 ###################################################
 PAK_1985_state_of_the_republic: "The State of Pakistan, 1985"
 PAK_1985_state_of_the_republic_desc: "President Zia-ul-Haq presides over an Islamic Republic that walks a tightrope: a non-party 'civilian' Parliament under Junejo, the army holding real power, the ISI swollen by the Afghan war, an economy strangled by debt, and a half-built bomb hidden behind a fence at Kahuta. Take stock, and decide what kind of Pakistan we are about to become."
 PAK_1985_acknowledge_frontline: "Frontline of the Afghan War"
 PAK_1985_acknowledge_frontline_desc: "The Soviets are bleeding north of the Khyber. Refugees, dollars, weapons and intelligence officers move through Peshawar and Quetta. Washington and Riyadh need us. We must milk that need, and survive its costs."
 PAK_1985_the_indian_shadow: "The Indian Shadow"
 PAK_1985_the_indian_shadow_desc: "Indira's heirs lead a country with the bomb, a vast army and unfinished business in Kashmir. Every Pakistani strategy, every rupee of the defence budget, is haunted by Delhi."
 PAK_1985_kahuta_under_watch: "Kahuta Under Watch"
 PAK_1985_kahuta_under_watch_desc: "The Engineering Research Laboratories near Kahuta are watched by half the world's intelligence services. Every shipment of vacuum tubes, every Dutch newspaper article, every CIA cable adds pressure - but the program advances."
 PAK_1985_the_bhutto_warning: "We Will Eat Grass"
 PAK_1985_the_bhutto_warning_desc: "Zulfikar Ali Bhutto, executed under our own flag, left a sentence Pakistan cannot forget: 'We will eat grass, even go hungry, but we will get one of our own.' His words still rule our nuclear conscience. Confront the warning - and choose a national priority."

 ###################################################
 # NATIONAL PRIORITY
 ###################################################
 PAK_1985_choose_national_priority: "Choose a National Priority"
 PAK_1985_choose_national_priority_desc: "Bomb above bread. Managed ambiguity. Or development before deterrence. Pick the road, and accept the price."
 PAK_1985_the_bomb_above_bread: "The Bomb Above Bread"
 PAK_1985_the_bomb_above_bread_desc: "Strategic deterrence will be built whatever the cost - in rupees, in welfare, in the patience of our people. The economy bleeds; the bomb advances."
 PAK_1985_managed_ambiguity: "Managed Ambiguity"
 PAK_1985_managed_ambiguity_desc: "Neither denial nor declaration. Pakistan keeps the program alive, hidden under civilian fig leaves and friendly diplomacy. Slower, but harder to sanction."
 PAK_1985_development_before_deterrence: "Development Before Deterrence"
 PAK_1985_development_before_deterrence_desc: "An alternative Pakistan. Slow the bomb, feed the country, build factories, ports and farms. Hardliners will scream that we are surrendering Kashmir."

 ###################################################
 # BOMB BRANCH
 ###################################################
 PAK_1985_bhuttos_nuclear_legacy: "Bhutto's Nuclear Legacy"
 PAK_1985_bhuttos_nuclear_legacy_desc: "Embrace the dead Prime Minister's vision and turn his slogan into a state doctrine. The PPP base remembers."
 PAK_1985_empower_aq_khan: "Empower Abdul Qadeer Khan"
 PAK_1985_empower_aq_khan_desc: "A metallurgist who once worked in a Dutch laboratory now runs Kahuta. He is paranoid, vain, brilliant - and he gets results. Give him an unbreakable mandate."
 PAK_1985_shield_kahuta: "Shield the Kahuta Complex"
 PAK_1985_shield_kahuta_desc: "Triple the perimeter, expand the army battalion, restrict overflights, monitor the staff. No CIA officer, no IAEA inspector, no Indian satellite is going to read our centrifuge halls."
 PAK_1985_divert_national_resources: "Divert National Resources"
 PAK_1985_divert_national_resources_desc: "Cancel infrastructure projects, raid the Federal budget, draw on Saudi gifts - whatever it takes. Kahuta will not be starved."
 PAK_1985_nation_under_sacrifice: "A Nation Under Sacrifice"
 PAK_1985_nation_under_sacrifice_desc: "Lights flicker, hospitals empty, wages stagnate - but the country is told that this is what greatness costs. Every speech ends with India, with Bhutto's promise, with the Bomb."
 PAK_1985_seek_chinese_assistance: "Seek Chinese Assistance"
 PAK_1985_seek_chinese_assistance_desc: "Beijing remembers 1962, 1965, and Tibet. Quiet help arrives - blueprints, design data, technical visitors with no business cards. Washington will eventually notice."
 PAK_1985_procurement_networks: "Procurement Networks in Western Europe"
 PAK_1985_procurement_networks_desc: "Front companies in Frankfurt, dual-use parts ordered through Almelo, vacuum pumps shipped through Karachi via three flag states. The A.Q. Khan network goes operational - with all the noise that implies."
 PAK_1985_overseas_scientific_contacts: "Exploit Overseas Scientific Contacts"
 PAK_1985_overseas_scientific_contacts_desc: "Pakistani scientists abroad are quietly reactivated. Old colleagues, old papers, old centrifuge schematics - the blueprints come home, but so does Western counter-intelligence interest."
 PAK_1985_compartmentalize_program: "Compartmentalize the Program"
 PAK_1985_compartmentalize_program_desc: "No-one but a handful of generals and Khan himself sees the whole picture. Cells, code names, secure phones. Progress slows by a hair - and the leaks slow by a lot."
 PAK_1985_pressler_pressure: "The Pressler Shadow"
 PAK_1985_pressler_pressure_desc: "Senator Larry Pressler's amendment hangs over us. Each year the President of the United States must certify Pakistan does not possess a nuclear device, or aid is cut. Every hint at Kahuta narrows our breathing room."
 PAK_1985_accelerate_enrichment: "Accelerate Uranium Enrichment"
 PAK_1985_accelerate_enrichment_desc: "Triple the cascades, double the maintenance shifts, run the centrifuges hot. We are months, not years, from a device."
 PAK_1985_the_islamic_bomb: "The Islamic Bomb"
 PAK_1985_the_islamic_bomb_desc: "We have done what no Muslim state has ever done. The cold device is real. The Saudis whisper congratulations, Tehran goes quiet, Delhi seethes. The world has changed."
 PAK_1985_first_cold_test: "The First Cold Test"
 PAK_1985_first_cold_test_desc: "A cold yield experiment in the Chagai mountains. The instruments scream success. No flash, no crater - just a number on a screen and a stunned room of generals."
 PAK_1985_build_delivery_system: "Build a Delivery System"
 PAK_1985_build_delivery_system_desc: "A bomb in a basement is theatre. A warhead on a missile is policy. We commission Hatf and the long-march programme."
 PAK_1985_doctrine_first_use: "Doctrine of First Use"
 PAK_1985_doctrine_first_use_desc: "We will never be the first to disarm. If India crosses our red lines - in the Punjab, on the Indus, against Karachi - the response will not be conventional."

 ###################################################
 # AMBIGUITY BRANCH
 ###################################################
 PAK_1985_keep_program_denied: "Keep the Program Denied"
 PAK_1985_keep_program_denied_desc: "Officially, we have a peaceful research programme. Officially, we have signed nothing because we will sign nothing. Let our enemies argue with our denials."
 PAK_1985_balance_washington_beijing: "Balance Washington and Beijing"
 PAK_1985_balance_washington_beijing_desc: "American aid in one pocket, Chinese technical visitors in the other. The trick is not to be caught with both hands full at the same time."
 PAK_1985_slow_steady_progress: "Slow but Steady Progress"
 PAK_1985_slow_steady_progress_desc: "No grand announcements, no public sacrifices. Just grinding centrifuge hours, year after year, until the door is open whenever we choose to walk through it."
 PAK_1985_threshold_state: "A Threshold State"
 PAK_1985_threshold_state_desc: "Everyone now knows we could test. We have not. The ambiguity itself is the deterrent."

 ###################################################
 # DEVELOPMENT BRANCH
 ###################################################
 PAK_1985_bread_before_bomb_focus: "Bread Before the Bomb"
 PAK_1985_bread_before_bomb_focus_desc: "Open the gates of the development tree. Slow the centrifuges, feed the people, repair the cities. The hardliners will not forgive us."
 PAK_1985_indus_irrigation: "Indus Irrigation Drive"
 PAK_1985_indus_irrigation_desc: "Tarbela and Mangla feed the Punjab; tubewells and link canals follow. Water is power."
 PAK_1985_wheat_security: "Wheat Security"
 PAK_1985_wheat_security_desc: "End the import dependence. Subsidies, fertilizer, mechanized harvest, public granaries."
 PAK_1985_mechanize_countryside: "Mechanize the Countryside"
 PAK_1985_mechanize_countryside_desc: "Tractors out of Karachi, fertilizer from Multan, credit from cooperatives. The peasant becomes a producer."
 PAK_1985_karachi_industry: "Karachi Industrial Growth"
 PAK_1985_karachi_industry_desc: "Steel mill, port, textile clusters, ship-breaking yards. Karachi becomes the engine of a new Pakistan."
 PAK_1985_textile_exports: "Expand Textile Exports"
 PAK_1985_textile_exports_desc: "Faisalabad and Karachi flood the world with cotton. Hard currency follows."
 PAK_1985_export_processing_zones: "Export Processing Zones"
 PAK_1985_export_processing_zones_desc: "Tax-free industrial parks, foreign capital, light manufacturing. Pakistan begins to look like Korea two decades behind."
 PAK_1985_export_labour_gulf: "Export Labour to the Gulf"
 PAK_1985_export_labour_gulf_desc: "A million Pakistanis already work in Saudi Arabia, Kuwait, the Emirates. We make the channels official, the remittances clean, the migration steady."
 PAK_1985_remittance_flows: "Capture Remittance Flows"
 PAK_1985_remittance_flows_desc: "Direct the money home through banks, not hawala. Foreign reserves swell."
 PAK_1985_islamic_banking: "Islamic Banking Channels"
 PAK_1985_islamic_banking_desc: "Interest-free instruments, takaful, Mudaraba certificates. The Gulf money trusts us; the ulema bless us."
 PAK_1985_planning_commission: "Planning Commission Revival"
 PAK_1985_planning_commission_desc: "Technocrats with PhDs from MIT and Cambridge return to Islamabad. Five-year plans return - this time written by economists, not generals."
 PAK_1985_strategic_ports: "Strategic Ports"
 PAK_1985_strategic_ports_desc: "Karachi expands. Gwadar is sketched on Chinese maps. Pakistan reaches for the Arabian Sea."
 PAK_1985_national_development_program: "National Development Programme"
 PAK_1985_national_development_program_desc: "An alternative Pakistan: industrial, agricultural, exporting, and quietly nuclear. Bhutto's ghost would not have approved. The country might survive."

 ###################################################
 # ARMY & STATE BRANCH
 ###################################################
 PAK_1985_army_and_state: "The Army and the State"
 PAK_1985_army_and_state_desc: "The barracks decide who governs. Always have, always will."
 PAK_1985_guardians_of_republic: "Guardians of the Republic"
 PAK_1985_guardians_of_republic_desc: "The TSK doctrine, Pakistani-style. The army is not a part of the state - it is the state."
 PAK_1985_empower_isi: "Empower the ISI"
 PAK_1985_empower_isi_desc: "Lt-Gen Akhtar Abdur Rehman commands a service that watches everyone, in every district, in every embassy. We make him untouchable."
 PAK_1985_military_first_budgeting: "Military-First Budgeting"
 PAK_1985_military_first_budgeting_desc: "Education, health, agriculture - they wait. Tanks, jets, missiles, divisions - they do not."
 PAK_1985_eighth_amendment: "The Eighth Amendment"
 PAK_1985_eighth_amendment_desc: "Article 58(2)(b): the President may dissolve the National Assembly at his pleasure. Civilian government becomes a privilege the army can revoke."
 PAK_1985_islamization_above: "Islamization from Above"
 PAK_1985_islamization_above_desc: "Hudood Ordinances, blasphemy laws, zakat collection by the state, religious courts. The Republic becomes more than nominally Islamic."
 PAK_1985_fortress_pakistan: "Fortress Pakistan"
 PAK_1985_fortress_pakistan_desc: "The Indian border is fortified, GHQ Rawalpindi enlarged, doctrines of mountain warfare and strategic depth codified. Nothing will get through."

 ###################################################
 # CIVILIANIZATION
 ###################################################
 PAK_1985_controlled_civilianization: "Controlled Civilianization"
 PAK_1985_controlled_civilianization_desc: "Slowly, carefully, on the President's terms - hand back parliamentary normality without losing the army's veto."
 PAK_1985_bring_in_junejo: "Bring in Junejo"
 PAK_1985_bring_in_junejo_desc: "Muhammad Khan Junejo, a small-town politician of unimpeachable correctness, becomes Prime Minister of a non-party Parliament. He thinks he is governing. He is decorating."
 PAK_1985_parliament_without_parties: "A Parliament Without Parties"
 PAK_1985_parliament_without_parties_desc: "Elections without manifestos, deputies without flags. The institutions return - hollowed out."
 PAK_1985_soften_martial_rule: "Soften Martial Rule"
 PAK_1985_soften_martial_rule_desc: "Lift the most visible decrees. Allow journalists to breathe. Keep the structures."
 PAK_1985_limited_civilian_admin: "Limited Civilian Administration"
 PAK_1985_limited_civilian_admin_desc: "A working compromise - a managed democracy under the President's eye. Quietly preferred by the embassies. Quietly resented by the people."

 ###################################################
 # RESTORE PARTIES
 ###################################################
 PAK_1985_restore_party_politics: "Restore Party Politics"
 PAK_1985_restore_party_politics_desc: "Throw open the gates. Let the PPP, the PML, the regional voices return. The army will not like it. The army may move."
 PAK_1985_end_non_party_system: "End the Non-Party System"
 PAK_1985_end_non_party_system_desc: "Repeal the regulations forbidding party tickets. The country can vote again."
 PAK_1985_curb_security_state: "Curb the Security State"
 PAK_1985_curb_security_state_desc: "Bring the ISI under civilian oversight. Audit the army's budget. Open the closed files."
 PAK_1985_parliamentary_revival: "Parliamentary Revival"
 PAK_1985_parliamentary_revival_desc: "A democratic Pakistan. Fragile, noisy, pluralistic - and finally, ours."

 ###################################################
 # AFGHAN STRATEGY
 ###################################################
 PAK_1985_host_the_jihad: "Host the Jihad"
 PAK_1985_host_the_jihad_desc: "The mujahideen need bases, training camps, weapons depots. We provide them - and skim from every shipment."
 PAK_1985_channel_american_aid: "Channel American Aid"
 PAK_1985_channel_american_aid_desc: "Six billion dollars and counting. F-16s, Stinger missiles, foreign-currency transfers. We are the indispensable Cold War ally - until the war ends."
 PAK_1985_coordinate_with_cia: "Coordinate with the CIA"
 PAK_1985_coordinate_with_cia_desc: "Operation Cyclone. The ISI distributes everything; the Americans see only what they need to see."
 PAK_1985_saudi_money: "Saudi Money, Pakistani Control"
 PAK_1985_saudi_money_desc: "The House of Saud matches every American dollar. Wahhabi schools open in Karachi, Peshawar, Lahore. The price will be paid for decades."
 PAK_1985_refugee_burden: "The Refugee Burden"
 PAK_1985_refugee_burden_desc: "Three million Afghans cross the Khyber. The camps swell. The drugs and the guns flow with them."
 PAK_1985_strategic_depth: "Seek Strategic Depth"
 PAK_1985_strategic_depth_desc: "Pakistan needs a friendly Kabul. Where Soviet tanks roll, we will roll the ISI. The doctrine of strategic depth is born."

 ###################################################
 # IDEAS - NAMES & DESCRIPTIONS
 ###################################################
 PAK_1985_the_indian_shadow_idea: "The Indian Shadow"
 PAK_1985_the_indian_shadow_idea_desc: "India's military, demographic and strategic weight is now a permanent feature of every cabinet meeting in Islamabad."
 PAK_1985_kahuta_under_watch_idea: "Kahuta Under Watch"
 PAK_1985_kahuta_under_watch_idea_desc: "Foreign intelligence services scrutinise every shipment near the Engineering Research Laboratories."
 PAK_1985_we_shall_eat_grass: "We Shall Eat Grass"
 PAK_1985_we_shall_eat_grass_desc: "Bhutto's promise has become state policy. The economy bleeds, public services starve - but the centrifuges turn."
 PAK_1985_aq_khan_network_idea: "The A.Q. Khan Network"
 PAK_1985_aq_khan_network_idea_desc: "Front companies, smuggling routes and a charismatic, paranoid metallurgist who answers to nobody but the President."
 PAK_1985_kahuta_secured_idea: "Kahuta Secured"
 PAK_1985_kahuta_secured_idea_desc: "An Army battalion, a counter-intel cell, and a no-fly zone now ring the centrifuge halls."
 PAK_1985_chinese_assistance_idea: "Chinese Quiet Hand"
 PAK_1985_chinese_assistance_idea_desc: "Quiet design assistance, technical visitors, and rocket cooperation flow east-to-west across the Karakoram."
 PAK_1985_procurement_networks_idea: "Procurement Networks"
 PAK_1985_procurement_networks_idea_desc: "Inverters from Frankfurt, vacuum pumps from Eindhoven, maraging steel from Switzerland - all bought by men who never give the same name twice."
 PAK_1985_compartmentalized_program_idea: "Compartmentalized Program"
 PAK_1985_compartmentalized_program_idea_desc: "Cells inside cells. Code names instead of identities. Even Khan does not see the whole picture."
 PAK_1985_under_pressler_shadow: "Under Pressler's Shadow"
 PAK_1985_under_pressler_shadow_desc: "The Pressler Amendment requires the US President to certify each year that Pakistan does not possess a nuclear device, or aid is suspended. We are one Senate hearing away from disaster."
 PAK_1985_the_islamic_bomb_idea: "The Islamic Bomb"
 PAK_1985_the_islamic_bomb_idea_desc: "Pakistan has done what no Muslim state has done. The first Sunni nuclear power has arrived."
 PAK_1985_first_use_doctrine: "Full-Spectrum Deterrence"
 PAK_1985_first_use_doctrine_desc: "Pakistan reserves the right to use nuclear weapons first. Every Indian corps commander now plans around it."
 PAK_1985_managed_ambiguity_idea: "Managed Ambiguity"
 PAK_1985_managed_ambiguity_idea_desc: "Officially we have nothing. Off the record, every embassy in Islamabad assumes otherwise. We let them assume."
 PAK_1985_threshold_deterrence_idea: "Threshold Deterrence"
 PAK_1985_threshold_deterrence_idea_desc: "Capability without confirmation. The cheapest doctrine in the nuclear age."
 PAK_1985_bread_before_the_bomb: "Bread Before the Bomb"
 PAK_1985_bread_before_the_bomb_desc: "An alternative Pakistan. Slower in the centrifuges, faster in the fields, the factories and the textile sheds."
 PAK_1985_indus_irrigation_idea: "Indus Irrigation"
 PAK_1985_indus_irrigation_idea_desc: "Water moves; villages eat; the Punjab grows."
 PAK_1985_wheat_security_idea: "Wheat Security"
 PAK_1985_wheat_security_idea_desc: "Public granaries, fertilizer subsidies, a real Green Revolution at last."
 PAK_1985_textile_export_boom: "Textile Export Boom"
 PAK_1985_textile_export_boom_desc: "Faisalabad's looms feed the world's department stores."
 PAK_1985_export_processing_zones_idea: "Export Processing Zones"
 PAK_1985_export_processing_zones_idea_desc: "Tax-free industrial parks dotted along the Karachi coast pull in foreign capital."
 PAK_1985_remittance_economy_idea: "Remittance Economy"
 PAK_1985_remittance_economy_idea_desc: "A million Pakistanis abroad send home more than the country exports."
 PAK_1985_islamic_banking_idea: "Islamic Banking Channels"
 PAK_1985_islamic_banking_idea_desc: "Mudaraba certificates and interest-free instruments win the trust of the Gulf and the ulema."
 PAK_1985_development_state_idea: "The Pakistani Development State"
 PAK_1985_development_state_idea_desc: "An alternative country: industrial, exporting, fed, schooled. Hardliners call it surrender. History may not."
 PAK_1985_military_ascendancy: "Military Ascendancy"
 PAK_1985_military_ascendancy_desc: "GHQ Rawalpindi rules, civilians administer. The arrangement is honest, at least."
 PAK_1985_isi_deep_state: "The ISI Deep State"
 PAK_1985_isi_deep_state_desc: "Inter-Services Intelligence has become a state within the state, with its own budget, its own foreign policy and its own private wars."
 PAK_1985_islamization_from_above: "Islamization from Above"
 PAK_1985_islamization_from_above_desc: "The Hudood Ordinances, the Council of Islamic Ideology, mandatory zakat collection - the Republic is being reforged in Zia's image."
 PAK_1985_cost_of_strategic_parity: "The Cost of Strategic Parity"
 PAK_1985_cost_of_strategic_parity_desc: "The defence budget eats education, health, infrastructure. India is the same shape - just larger."
 PAK_1985_managed_civilian_facade: "Managed Civilian Facade"
 PAK_1985_managed_civilian_facade_desc: "Junejo's cabinet meets, debates, votes. Decisions of consequence still travel north to Aabpara."
 PAK_1985_civilian_facade_idea: "Civilian Government Restored"
 PAK_1985_civilian_facade_idea_desc: "A working compromise: the army keeps its red lines, the civilians get the rest."
 PAK_1985_civilian_revival_idea: "Civilian Revival"
 PAK_1985_civilian_revival_idea_desc: "Parliament is loud again. Newspapers print again. The barracks watch warily."
 PAK_1985_frontline_state_idea: "Frontline State"
 PAK_1985_frontline_state_idea_desc: "The Soviet-Afghan war makes us indispensable - and the dollars, weapons and refugees flow accordingly."
 PAK_1985_cia_isi_partnership: "ISI-CIA Partnership"
 PAK_1985_cia_isi_partnership_desc: "Operation Cyclone runs through Aabpara. Both services pretend the other is the junior partner."
 PAK_1985_refugee_burden_idea: "Afghan Refugee Burden"
 PAK_1985_refugee_burden_idea_desc: "Three million refugees, drugs and guns following them, camps that will not close in this generation."
 PAK_1985_strategic_depth_idea: "Strategic Depth Doctrine"
 PAK_1985_strategic_depth_idea_desc: "Whatever happens in Kabul, our influence will not retreat. The mujahideen are tomorrow's clients."
