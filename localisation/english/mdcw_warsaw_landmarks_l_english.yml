 landmark_warsaw_palace_desc: "Opened in central Warsaw in July 1955, the Palace of Culture and Science houses theatres, cinemas, scientific institutions and the Congress Hall. Its educational and scientific institutions reduce education costs and support research for the country controlling the landmark."
