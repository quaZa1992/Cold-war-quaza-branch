l_english:
 GULF_1985_war_financiers: "Financiers of the Gulf War"
 GULF_1985_war_financiers_desc: "The Gulf monarchies are underwriting Iraq's war effort to contain revolutionary Iran. Oil wealth buys influence, but it also ties their security to Baghdad's fortunes."
 HEZ_1985_emerging_resistance_cells: "Emerging Resistance Cells"
 HEZ_1985_emerging_resistance_cells_desc: "Hezbollah is still young in 1985, but Iranian support, clerical networks, and the war in South Lebanon are turning it into a durable armed movement."
 IRQ_1985_baathist_total_war_state: "Ba'athist Total War State"
 IRQ_1985_baathist_total_war_state_desc: "Saddam Hussein's Iraq is built around the security services, Ba'athist loyalty, and the war against Iran. The regime can mobilize ruthlessly, but the army is under political pressure."
 IRQ_1985_war_debt_and_militarized_economy: "War Debt and Militarized Economy"
 IRQ_1985_war_debt_and_militarized_economy_desc: "The war is being paid for with oil revenue, foreign credit, and Gulf support. It keeps the front supplied, but distorts the whole economy."
 IRQ_1985_war_of_attrition: "War of Attrition"
 IRQ_1985_war_of_attrition_desc: "By 1985 the war against Iran has become a grinding contest of trenches, artillery, recruitment, and money. Iraq can hold prepared positions well, but every month at the front raises the cost of the army."
 ISR_1985_security_belt_war: "Security Belt War"
 ISR_1985_security_belt_war_desc: "Israel's withdrawal from most of Lebanon has left a contested security belt and a persistent low-intensity conflict on the northern frontier."
 LEB_1985_civil_war_fragmentation: "Civil War Fragmentation"
 LEB_1985_civil_war_fragmentation_desc: "Lebanon is fractured between militias, sectarian institutions, foreign patrons, and weakened state structures. Beirut's government exists, but it does not command the whole country."
 PER_1985_revolutionary_war_economy: "Revolutionary War Economy"
 PER_1985_revolutionary_war_economy_desc: "Sanctions, wartime centralization, disrupted oil exports, and ideological institutions weigh heavily on Iran's economy."
 PER_1985_sacred_defense_mobilization: "Sacred Defense Mobilization"
 PER_1985_sacred_defense_mobilization_desc: "Iran enters 1985 with the war framed as a revolutionary defense of the homeland and the Islamic Republic. Mobilization is deep, but the strain on manpower, logistics, and society is severe."
