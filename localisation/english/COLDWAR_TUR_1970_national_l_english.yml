 COLDWAR_TUR_1970_regional_contracting:0 "Anatolian Contractors"
 COLDWAR_TUR_1970_regional_contracting_desc:0 "Provincial construction can build up Turkish contractors and their suppliers as well as roads and public facilities. Contracts should leave behind experienced firms and productive workshops."
 COLDWAR_TUR_1970_regional_needs:0 "Anatolia's Regional Needs"
 COLDWAR_TUR_1970_regional_needs_desc:0 "The national development plan must reach Anatolia's provincial centres as well as the industrial west. Better connections around Sivas can bring farm produce to market and extend schools and public services."
 COLDWAR_TUR_1970_regional_shareholding:0 "Regional Shareholding"
 COLDWAR_TUR_1970_regional_shareholding_desc:0 "Workers, farmers, traders and craftsmen can become investors in the industries built around them. Regional shareholding will join local savings to state credit and infrastructure, giving production a broader base of ownership."
 COLDWAR_TUR_1970_religious_education:0 "Knowledge and Conviction"
 COLDWAR_TUR_1970_religious_education_desc:0 "The movement sees no lasting national revival without both practical knowledge and religious conviction. Technical teaching and religious institutions will develop together, with the education budget carrying the cost of a broader public role."
 COLDWAR_TUR_1970_religious_institutes:0 "Higher Religious Institutes"
 COLDWAR_TUR_1970_religious_institutes_desc:0 "Religious education needs institutions able to train its own scholars and public teachers. A larger system will strengthen the movement's social foundations, while requiring a lasting place in the state's education budget."
 COLDWAR_TUR_1970_repair_spares:0 "Repair and Spare Parts"
 COLDWAR_TUR_1970_repair_spares_desc:0 "Machines must keep working after the first purchase has been celebrated. Domestic repair services and dependable spare parts can reduce costly stoppages, while creating skilled work throughout the supplier network."
 COLDWAR_TUR_1970_replacement_security_administration:0 "Regional Security Administration"
 COLDWAR_TUR_1970_replacement_security_administration_desc:0 "Give provincial commands greater authority over public order and state administration. Concentrated security resources reassure officials and the armed forces, but heavier policing is costly and leaves demands for equal citizenship unresolved."
 COLDWAR_TUR_1970_research_partners:0 "TUBITAK Partnerships"
 COLDWAR_TUR_1970_research_partners_desc:0 "Connect university laboratories with the scientific work of TUBITAK. Shared research and technical offices can help Turkish firms apply new methods, provided institutions receive trained staff and steady funding."
 COLDWAR_TUR_1970_road_market:0 "National Road Links"
 COLDWAR_TUR_1970_road_market_desc:0 "The national road system can bring provincial producers into larger markets. Connections between towns and industrial centres will determine whether investment reaches beyond the coastal cities."
 COLDWAR_TUR_1970_rural_schools:0 "Rural School Expansion"
 COLDWAR_TUR_1970_rural_schools_desc:0 "Too many districts remain distant from secondary and technical education. Extend rural schools and provide trained staff so young people beyond the cities can take part in modern agriculture and industry."
 COLDWAR_TUR_1970_second_plan:0 "The Second Five-Year Plan"
 COLDWAR_TUR_1970_second_plan_desc:0 "The Second Five-Year Plan seeks industrial growth, better infrastructure, and wider public services. Its ambitions compete for foreign exchange, electricity, and trained administrators, so Ankara must choose where investment will have the greatest lasting value."
 COLDWAR_TUR_1970_security_administration:0 "Security Administration"
 COLDWAR_TUR_1970_security_administration_desc:0 "Give provincial commands greater authority over public order and state administration. Concentrated security resources reassure officials and the armed forces, but heavier policing is costly and leaves demands for equal citizenship unresolved."
 COLDWAR_TUR_1970_service_capital:0 "Istanbul Services"
 COLDWAR_TUR_1970_service_capital_desc:0 "Shipping, insurance and financial services can draw international business through Istanbul. The city gains new employment and foreign contacts, while the government accepts a greater dependence on confidence in markets beyond its own control."
 COLDWAR_TUR_1970_service_charter:0 "A Statute for the Services"
 COLDWAR_TUR_1970_service_charter_desc:0 "Clear duties and dependable promotion rules can bind the services to their professional responsibilities. The officers retain their constitutional influence, but the government begins to replace personal arrangements with a durable statute."
 COLDWAR_TUR_1970_service_colleges:0 "State Service Colleges"
 COLDWAR_TUR_1970_service_colleges_desc:0 "National institutions need officers and public servants prepared for complex duties. Service colleges and technical teaching will improve that preparation, while instructors and equipment require dependable funding."
 COLDWAR_TUR_1970_service_contracts:0 "Service-Led Procurement"
 COLDWAR_TUR_1970_service_contracts_desc:0 "Direct procurement funds toward equipment and services required by the armed forces. Domestic workshops gain dependable orders, while the treasury and civilian ministries bear the cost of a service-led industrial policy."
 COLDWAR_TUR_1970_service_modernisation:0 "Armed Forces Modernisation"
 COLDWAR_TUR_1970_service_modernisation_desc:0 "The armed forces need equipment they can maintain, trained personnel, and dependable supply. Turkey can strengthen its services through domestic workshops, allied standards, or negotiated foreign contracts, each carrying a different cost."
 COLDWAR_TUR_1970_settlement:0 "The 1961 Settlement"
 COLDWAR_TUR_1970_settlement_desc:0 "Turkey's elected government works under a constitution shaped by military intervention and a powerful National Security Council. Demirel must balance civilian authority with the generals' claim to protect the republic and its institutions."
