 COLDWAR_TUR_1970_regional_163_0:0 "Highland Villages"
 COLDWAR_TUR_1970_regional_163_0_desc:0 "The northeastern plateau supports substantial herds, but a short growing season and scattered villages make reliable services expensive. Local producers need fodder, veterinary advice and dependable access to markets. Investment can strengthen this economy, while winter and distance continue to shape every public works programme."
