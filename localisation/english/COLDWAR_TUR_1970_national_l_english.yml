 COLDWAR_TUR_1970_shortcut_ytp:0 "YTP: Eastern Development"
 COLDWAR_TUR_1970_shp_artisan_cooperatives:0 "Artisan Apprentices"
 COLDWAR_TUR_1970_shp_artisan_cooperatives_desc:0 "Artisans and small workshops need affordable equipment and a new generation of skilled workers. Cooperative investment and vocational instruction can help them modernise while preserving independent livelihoods."
 COLDWAR_TUR_1970_shp_artisan_markets:0 "Artisan Market Links"
 COLDWAR_TUR_1970_shp_artisan_markets_desc:0 "The artisan investment budget can instead develop commercial services and access to customers. Cooperative offices will help small workshops reach buyers in larger markets."
 COLDWAR_TUR_1970_shp_artisan_training:0 "Train Apprentices"
 COLDWAR_TUR_1970_shp_artisan_training_desc:0 "Artisans pass practical knowledge from one generation to the next. Vocational education can help small workshops maintain those skills while adopting better methods."
 COLDWAR_TUR_1970_shp_artisan_workshops:0 "Modern Workshops"
 COLDWAR_TUR_1970_shp_artisan_workshops_desc:0 "The artisan investment budget can build productive premises and equipment for small workshops. Local industry will gain a stronger foundation for skilled work."
 COLDWAR_TUR_1970_shp_bargaining:0 "Rights for Workers"
 COLDWAR_TUR_1970_shp_bargaining_desc:0 "Workers and public employees need effective union rights and a voice at work. Secure collective bargaining can give working families a fairer share in national development."
 COLDWAR_TUR_1970_shp_city_schools:0 "City Schools"
 COLDWAR_TUR_1970_shp_city_schools_desc:0 "Education must give every child a genuine opportunity to develop. A sustained commitment to teachers and learning can strengthen the social foundation of democracy."
 COLDWAR_TUR_1970_shp_city_services:0 "Neighbourhood Offices"
 COLDWAR_TUR_1970_shp_city_services_desc:0 "Municipal services must keep pace with the neighbourhoods that depend on them. Local offices and trained staff can help authorities respond to residents."
 COLDWAR_TUR_1970_shp_city_transport:0 "City Transport Works"
 COLDWAR_TUR_1970_shp_city_transport_desc:0 "A growing city needs connections between homes, workplaces and public services. Local transport works can make the benefits of urban growth more widely accessible."
 COLDWAR_TUR_1970_shp_east_services:0 "Equal Local Services"
 COLDWAR_TUR_1970_shp_east_services_desc:0 "Public services should reach citizens equally across the country. Local administration must support the daily needs of families as well as regional enterprise."
 COLDWAR_TUR_1970_shp_east_training:0 "Regional Skills"
 COLDWAR_TUR_1970_shp_east_training_desc:0 "New enterprises need trained technicians and workers from their own communities. Practical education can make regional investment more durable."
 COLDWAR_TUR_1970_shp_equal_rights:0 "Equal Rights"
 COLDWAR_TUR_1970_shp_equal_rights_desc:0 "Citizens must be able to take part in public life without discrimination. A social democracy is stronger when all communities enjoy equal protection and a fair chance to work."
 COLDWAR_TUR_1970_shp_export_skills:0 "Compete Abroad"
 COLDWAR_TUR_1970_shp_export_skills_desc:0 "Turkish firms must compete through useful products and the skills of their workers. Technical research can support a stronger place in international markets."
 COLDWAR_TUR_1970_shp_farm_services:0 "Farm Service Offices"
 COLDWAR_TUR_1970_shp_farm_services_desc:0 "Small producers need accessible information and support as markets change. Local service offices can connect farms to cooperatives and buyers."
 COLDWAR_TUR_1970_shp_farm_transport:0 "Routes to Markets"
 COLDWAR_TUR_1970_shp_farm_transport_desc:0 "Farmers need reliable routes to the communities that buy their harvests. Transport investment can make the work of small producers more rewarding."
 COLDWAR_TUR_1970_shp_health_access:0 "Health for Families"
 COLDWAR_TUR_1970_shp_health_access_desc:0 "Illness should not exclude a family from a secure life. Public health administration and local access can bring protection to more of the people who need it."
 COLDWAR_TUR_1970_shp_health_training:0 "Health Staff Training"
 COLDWAR_TUR_1970_shp_health_training_desc:0 "Health services need capable staff and continuing education. Professional training will strengthen the public institutions on which households rely."
 COLDWAR_TUR_1970_shp_investment:0 "Social Market for Jobs"
 COLDWAR_TUR_1970_shp_investment_desc:0 "A democratic social market must combine productive industry with fair wages and employment. Investment in local infrastructure can bring new work to communities left behind by uneven growth."
 COLDWAR_TUR_1970_shp_jobs_east:0 "Work in the East"
 COLDWAR_TUR_1970_shp_jobs_east_desc:0 "Eastern communities need productive work and a fair chance to share in national growth. Industrial investment can create jobs close to the families who depend on them."
 COLDWAR_TUR_1970_shp_labour_standards:0 "Labour Standards"
 COLDWAR_TUR_1970_shp_labour_standards_desc:0 "Turkish workers deserve secure rights and decent conditions in a changing international economy. Stronger workplace representation can bring our public commitments closer to the standards expected of a modern democracy."
 COLDWAR_TUR_1970_shp_market_training:0 "Market Skills"
 COLDWAR_TUR_1970_shp_market_training_desc:0 "Small workshops need the skills to find buyers and manage orders beyond their local districts. Practical training and commercial services can help them compete."
 COLDWAR_TUR_1970_shp_public_workers:0 "Public Employees"
 COLDWAR_TUR_1970_shp_public_workers_desc:0 "Public employees serve citizens throughout the Republic and deserve a meaningful voice in their working lives. Well-organised services depend on capable and respected staff."
 COLDWAR_TUR_1970_shp_regional_connections:0 "Roads for Regions"
 COLDWAR_TUR_1970_shp_regional_connections_desc:0 "New workplaces need connections to suppliers, customers and public services. A programme of regional works can make productive investment useful to the surrounding communities."
 COLDWAR_TUR_1970_shp_regional_jobs:0 "Eastern Employment"
 COLDWAR_TUR_1970_shp_regional_jobs_desc:0 "Communities in the eastern and southeastern provinces need productive work and equal access to opportunity. Regional investment can bring jobs and public services closer to families across the country."
 COLDWAR_TUR_1970_shp_regional_trade:0 "Regional Enterprise"
 COLDWAR_TUR_1970_shp_regional_trade_desc:0 "New industrial jobs need local suppliers and commercial services. Regional offices can connect workshops with producers and customers beyond their immediate districts."
 COLDWAR_TUR_1970_shp_science_labs:0 "Applied Research"
 COLDWAR_TUR_1970_shp_science_labs_desc:0 "Turkish industry needs research that can be turned into useful equipment and products. Cooperation between scientists and producers can strengthen that capacity."
 COLDWAR_TUR_1970_shp_skilled_production:0 "Skills for Industry"
 COLDWAR_TUR_1970_shp_skilled_production_desc:0 "Workers must have the opportunity to acquire skills as industry changes. Training and practical research can make technological development a source of wider prosperity."
 COLDWAR_TUR_1970_shp_social_centres:0 "Social Service Offices"
 COLDWAR_TUR_1970_shp_social_centres_desc:0 "Social protection is useful only when households can reach it. Local service offices can help families obtain support and make public institutions more responsive."
 COLDWAR_TUR_1970_shp_social_insurance:0 "A Wider Social Security"
 COLDWAR_TUR_1970_shp_social_insurance_desc:0 "Unemployment, illness and old age must not leave families without protection. Broader social insurance and local provision can give working people a more dependable measure of security."
 COLDWAR_TUR_1970_shp_technical_enterprise:0 "Industry and Research"
 COLDWAR_TUR_1970_shp_technical_enterprise_desc:0 "Universities, skilled workers and producers can turn scientific knowledge into useful products. Practical cooperation and modern equipment will help Turkish industry compete abroad."
 COLDWAR_TUR_1970_shp_technology:0 "Industrial Technology"
 COLDWAR_TUR_1970_shp_technology_desc:0 "Turkey must acquire advanced technology and develop the ability to produce it. Investment in research and technical education can give industry new capabilities and skilled workers."
 COLDWAR_TUR_1970_shp_technology_works:0 "Technology Works"
 COLDWAR_TUR_1970_shp_technology_works_desc:0 "Advanced production requires places where new knowledge can be applied. Investment in modern workshops can give skilled workers and engineers the means to compete."
 COLDWAR_TUR_1970_shp_urban_services:0 "Growing City Services"
 COLDWAR_TUR_1970_shp_urban_services_desc:0 "A growing city needs roads and local services that reach its working neighbourhoods. Municipal investment can create a stronger foundation for housing, public health and employment."
 COLDWAR_TUR_1970_shp_wage_bargaining:0 "A Fair Wage"
 COLDWAR_TUR_1970_shp_wage_bargaining_desc:0 "Working people need effective collective representation and a fair return for their labour. A democratic workplace gives workers a stronger voice in the decisions that shape their lives."
 COLDWAR_TUR_1970_shp_womens_skills:0 "Skills for Women"
 COLDWAR_TUR_1970_shp_womens_skills_desc:0 "Women need access to technical education and independent livelihoods. Training can open more of the economy to their skills and ambitions."
 COLDWAR_TUR_1970_shp_workplace_skills:0 "Workplace Training"
 COLDWAR_TUR_1970_shp_workplace_skills_desc:0 "Skills and the ability to adapt are essential to secure productive work. Cooperation between employees, employers and educators can widen access to training."
 COLDWAR_TUR_1970_shp_workshop_methods:0 "Workshop Methods"
 COLDWAR_TUR_1970_shp_workshop_methods_desc:0 "Modern equipment needs skilled hands. Training can help independent artisans improve their products and pass their knowledge to apprentices."
 COLDWAR_TUR_1970_social_pact:0 "Rural Cooperatives"
 COLDWAR_TUR_1970_social_pact_desc:0 "Small producers need a stronger position in markets and access to services. A cooperative development programme can pool their resources and strengthen local administration alongside private enterprise."
 COLDWAR_TUR_1970_social_republic:0 "A Social Republic"
 COLDWAR_TUR_1970_social_republic_desc:0 "Provincial production will command lasting public support when education, health and municipal services advance alongside it. A broader social settlement can strengthen democratic government, while committing the state beyond a single investment plan."
 COLDWAR_TUR_1970_sodep_civic_participation:0 "Civic Associations"
 COLDWAR_TUR_1970_sodep_civic_participation_desc:0 "A free republic needs independent associations and citizens who can take part in public affairs. Local organisations and professional bodies can make democratic government more responsive to the people it serves."
 COLDWAR_TUR_1970_sodep_local:0 "Democratic Towns"
 COLDWAR_TUR_1970_sodep_local_desc:0 "Social democracy must grow through elected local associations and practical public services. Municipal investment can connect the rights of citizens with the everyday needs of urban and provincial communities."
 COLDWAR_TUR_1970_sodep_municipal_works:0 "Municipal Works"
 COLDWAR_TUR_1970_sodep_municipal_works_desc:0 "Local authorities need the means to connect neighbourhoods to transport and public services. Investment in municipal works can turn social democratic commitments into visible improvements."
 COLDWAR_TUR_1970_sodep_productive_employment:0 "Production and Jobs"
 COLDWAR_TUR_1970_sodep_productive_employment_desc:0 "Social justice must rest on productive work as well as fair distribution. Public investment can help provincial enterprise create jobs and give local communities a stronger economic base."
 COLDWAR_TUR_1970_sodep_professional_training:0 "Skills for Local Growth"
 COLDWAR_TUR_1970_sodep_professional_training_desc:0 "Municipalities and local industry need engineers, teachers and skilled technicians. Technical education can help communities maintain their services and make better use of investment."
 COLDWAR_TUR_1970_soviet_projects:0 "Soviet Industrial Projects"
 COLDWAR_TUR_1970_soviet_projects_desc:0 "Negotiations with Moscow can bring machinery, industrial expertise, and investment into Turkish development. Broader commercial ties diversify the sources of equipment while Ankara preserves its alliance commitments and freedom of action."
 COLDWAR_TUR_1970_start_enterprise_finance:0 "State Enterprise Financing Burden"
 COLDWAR_TUR_1970_start_enterprise_finance_desc:0 "Public enterprises need budget support for investment in machinery, power, and transport. The government must distinguish projects that build lasting capacity from recurring transfers that crowd out other public needs.\n\nWeekly state-enterprise expenditure: relieved by Restructure State Enterprises, Workers in State Firms."
 COLDWAR_TUR_1970_start_fiscal_information:0 "Fragmented Fiscal Administration"
 COLDWAR_TUR_1970_start_fiscal_information_desc:0 "Ministries lack timely information for comparing revenue, investment, and public obligations. Better statistics and a coordinated short-term forecast would help the cabinet set priorities and explain its choices to parliament.\n\nBureaucracy costs: relieved by Public Administration School, Public Firm Oversight.\n\nPolitical power gain: relieved by Public Administration School, Public Firm Oversight."
 COLDWAR_TUR_1970_start_fiscal_information_m1:0 "Fragmented Fiscal Administration"
 COLDWAR_TUR_1970_start_fiscal_information_m1_desc:0 "Ministries lack timely information for comparing revenue, investment, and public obligations. Better statistics and a coordinated short-term forecast would help the cabinet set priorities and explain its choices to parliament.\n\nBureaucracy costs: relieved by Public Administration School, Public Firm Oversight.\n\nPolitical power gain: relieved by Public Administration School, Public Firm Oversight."
 COLDWAR_TUR_1970_start_fiscal_information_m2:0 "Fragmented Fiscal Administration"
 COLDWAR_TUR_1970_start_fiscal_information_m2_desc:0 "Ministries lack timely information for comparing revenue, investment, and public obligations. Better statistics and a coordinated short-term forecast would help the cabinet set priorities and explain its choices to parliament.\n\nBureaucracy costs: relieved by Public Administration School, Public Firm Oversight.\n\nPolitical power gain: relieved by Public Administration School, Public Firm Oversight."
 COLDWAR_TUR_1970_start_foreign_exchange:0 "Foreign-Exchange Bottleneck"
 COLDWAR_TUR_1970_start_foreign_exchange_desc:0 "Industrial expansion depends on imported machinery and inputs, while the lira remains overvalued. Export earnings cannot keep pace with demand for foreign currency; Ankara must choose how to ration imports and sustain production.\n\nCivilian factory productivity: relieved by Diversify Manufactured Exports, Domestic Industrial Inputs.\n\nCivilian factory construction speed: relieved by Diversify Manufactured Exports, Domestic Industrial Inputs."
 COLDWAR_TUR_1970_start_foreign_exchange_eased:0 "Easing Foreign-Exchange Bottleneck"
 COLDWAR_TUR_1970_start_foreign_exchange_eased_desc:0 "Import arrears have been reduced, but industry still depends on a narrow supply of foreign exchange. Domestic inputs or stronger export earnings must complete the adjustment."
 COLDWAR_TUR_1970_start_foreign_exchange_m1:0 "Foreign-Exchange Bottleneck"
 COLDWAR_TUR_1970_start_foreign_exchange_m1_desc:0 "Industrial expansion depends on imported machinery and inputs, while the lira remains overvalued. Export earnings cannot keep pace with demand for foreign currency; Ankara must choose how to ration imports and sustain production.\n\nCivilian factory productivity: relieved by Diversify Manufactured Exports, Domestic Industrial Inputs.\n\nCivilian factory construction speed: relieved by Diversify Manufactured Exports, Domestic Industrial Inputs."
 COLDWAR_TUR_1970_start_foreign_exchange_m2:0 "Foreign-Exchange Bottleneck"
 COLDWAR_TUR_1970_start_foreign_exchange_m2_desc:0 "Industrial expansion depends on imported machinery and inputs, while the lira remains overvalued. Export earnings cannot keep pace with demand for foreign currency; Ankara must choose how to ration imports and sustain production.\n\nCivilian factory productivity: relieved by Diversify Manufactured Exports, Domestic Industrial Inputs.\n\nCivilian factory construction speed: relieved by Diversify Manufactured Exports, Domestic Industrial Inputs."
 COLDWAR_TUR_1970_start_foreign_spares:0 "Imported Equipment and Spares"
 COLDWAR_TUR_1970_start_foreign_spares_desc:0 "The services depend on imported equipment, replacement parts, and foreign military assistance. Rising costs make maintenance harder and give suppliers influence over Ankara's choices, increasing the value of domestic repair capacity.\n\nProduction efficiency cap: relieved by MKE Production Contracts, Licensed Arms Supply.\n\nDomestic tooling or licensed technical support can relieve the production constraint. Dependence on foreign suppliers is not entirely removed."
 COLDWAR_TUR_1970_start_foreign_spares_m1:0 "Imported Equipment and Spares"
 COLDWAR_TUR_1970_start_foreign_spares_m1_desc:0 "The services depend on imported equipment, replacement parts, and foreign military assistance. Rising costs make maintenance harder and give suppliers influence over Ankara's choices, increasing the value of domestic repair capacity.\n\nProduction efficiency cap: relieved by MKE Production Contracts, Licensed Arms Supply.\n\nDomestic tooling or licensed technical support can relieve the production constraint. Dependence on foreign suppliers is not entirely removed."
 COLDWAR_TUR_1970_start_foreign_spares_m2:0 "Imported Equipment and Spares"
 COLDWAR_TUR_1970_start_foreign_spares_m2_desc:0 "The services depend on imported equipment, replacement parts, and foreign military assistance. Rising costs make maintenance harder and give suppliers influence over Ankara's choices, increasing the value of domestic repair capacity.\n\nProduction efficiency cap: relieved by MKE Production Contracts, Licensed Arms Supply.\n\nDomestic tooling or licensed technical support can relieve the production constraint. Dependence on foreign suppliers is not entirely removed."
 COLDWAR_TUR_1970_start_planned_industry:0 "Planned Industrialisation"
 COLDWAR_TUR_1970_start_planned_industry_desc:0 "Five-year planning and state enterprise have expanded industry, yet investment still competes for scarce foreign exchange. The government must decide whether public direction can raise production without burdening the Treasury and administration indefinitely.\n\nThe planning apparatus retains its administrative cost."
 COLDWAR_TUR_1970_start_planned_industry_m1:0 "Planned Industrialisation"
 COLDWAR_TUR_1970_start_planned_industry_m1_desc:0 "Five-year planning and state enterprise have expanded industry, yet investment still competes for scarce foreign exchange. The government must decide whether public direction can raise production without burdening the Treasury and administration indefinitely.\n\nThe planning apparatus retains its administrative cost."
 COLDWAR_TUR_1970_start_planned_industry_m2:0 "Planned Industrialisation"
 COLDWAR_TUR_1970_start_planned_industry_m2_desc:0 "Five-year planning and state enterprise have expanded industry, yet investment still competes for scarce foreign exchange. The government must decide whether public direction can raise production without burdening the Treasury and administration indefinitely.\n\nThe planning apparatus retains its administrative cost."
 COLDWAR_TUR_1970_start_regional_exclusion:0 "Unequal Regional Citizenship"
 COLDWAR_TUR_1970_start_regional_exclusion_desc:0 "Kurdish citizens in the eastern provinces face restrictions on civic identity and unequal access to public life. Local grievances call for a political response through citizenship, services, and accountable administration.\n\nStability: relieved by Equal Citizenship.\n\nPolice costs: relieved by Equal Citizenship."
 COLDWAR_TUR_1970_start_regional_exclusion_m1:0 "Unequal Regional Citizenship"
 COLDWAR_TUR_1970_start_regional_exclusion_m1_desc:0 "Kurdish citizens in the eastern provinces face restrictions on civic identity and unequal access to public life. Local grievances call for a political response through citizenship, services, and accountable administration.\n\nStability: relieved by Equal Citizenship.\n\nPolice costs: relieved by Equal Citizenship."
 COLDWAR_TUR_1970_start_regional_exclusion_m2:0 "Unequal Regional Citizenship"
 COLDWAR_TUR_1970_start_regional_exclusion_m2_desc:0 "Kurdish citizens in the eastern provinces face restrictions on civic identity and unequal access to public life. Local grievances call for a political response through citizenship, services, and accountable administration.\n\nStability: relieved by Equal Citizenship.\n\nPolice costs: relieved by Equal Citizenship."
 COLDWAR_TUR_1970_start_rural_services:0 "Rural Services Gap"
 COLDWAR_TUR_1970_start_rural_services_desc:0 "Schooling and technical services remain uneven, particularly outside the major cities. Teachers, practical training, and transport are needed to connect rural communities with modern agriculture, industry, and public institutions.\n\nResearch speed: relieved by Provincial Teacher Posts, Train Technical Teachers, Technical Colleges, Anatolian Skills.\n\nInfrastructure construction speed: relieved by Eastern Road Links, Farm Equipment and Power, Public Works Contracts."
 COLDWAR_TUR_1970_start_rural_services_m1:0 "Rural Services Gap"
 COLDWAR_TUR_1970_start_rural_services_m1_desc:0 "Schooling and technical services remain uneven, particularly outside the major cities. Teachers, practical training, and transport are needed to connect rural communities with modern agriculture, industry, and public institutions.\n\nResearch speed: relieved by Provincial Teacher Posts, Train Technical Teachers, Technical Colleges, Anatolian Skills.\n\nInfrastructure construction speed: relieved by Eastern Road Links, Farm Equipment and Power, Public Works Contracts."
 COLDWAR_TUR_1970_start_rural_services_m2:0 "Rural Services Gap"
 COLDWAR_TUR_1970_start_rural_services_m2_desc:0 "Schooling and technical services remain uneven, particularly outside the major cities. Teachers, practical training, and transport are needed to connect rural communities with modern agriculture, industry, and public institutions.\n\nResearch speed: relieved by Provincial Teacher Posts, Train Technical Teachers, Technical Colleges, Anatolian Skills.\n\nInfrastructure construction speed: relieved by Eastern Road Links, Farm Equipment and Power, Public Works Contracts."
 COLDWAR_TUR_1970_start_rural_transition:0 "Rural-Urban Transition"
 COLDWAR_TUR_1970_start_rural_transition_desc:0 "Many families still depend on agriculture as people move toward towns and industrial centres. Housing, health care, water, and municipal administration must keep pace with this shift in livelihoods.\n\nOffice productivity: relieved by Integrated Provincial Services, Restructure State Enterprises, Village-City Centres.\n\nHealth costs: relieved by Village Health Teams, Municipal Waterworks, Neighbourhood Health."
 COLDWAR_TUR_1970_start_rural_transition_m1:0 "Rural-Urban Transition"
 COLDWAR_TUR_1970_start_rural_transition_m1_desc:0 "Many families still depend on agriculture as people move toward towns and industrial centres. Housing, health care, water, and municipal administration must keep pace with this shift in livelihoods.\n\nOffice productivity: relieved by Integrated Provincial Services, Restructure State Enterprises, Village-City Centres.\n\nHealth costs: relieved by Village Health Teams, Municipal Waterworks, Neighbourhood Health."
 COLDWAR_TUR_1970_start_rural_transition_m2:0 "Rural-Urban Transition"
 COLDWAR_TUR_1970_start_rural_transition_m2_desc:0 "Many families still depend on agriculture as people move toward towns and industrial centres. Housing, health care, water, and municipal administration must keep pace with this shift in livelihoods.\n\nOffice productivity: relieved by Integrated Provincial Services, Restructure State Enterprises, Village-City Centres.\n\nHealth costs: relieved by Village Health Teams, Municipal Waterworks, Neighbourhood Health."
 COLDWAR_TUR_1970_start_smallholdings:0 "Rain-Fed Smallholdings"
 COLDWAR_TUR_1970_start_smallholdings_desc:0 "Small farms and reliance on rainfall leave many households exposed to a weak harvest. Wheat imports can protect food supplies, while better roads, credit, and irrigation would strengthen rural production.\n\nAgricultural productivity: relieved by Euphrates-Tigris Irrigation, Farm Equipment and Power."
 COLDWAR_TUR_1970_state_banks:0 "State Lending Banks"
 COLDWAR_TUR_1970_state_banks_desc:0 "Public banks can place long-term capital behind industrial works and provincial production where private investment is scarce. The Treasury must carry the risks of the projects it supports."
 COLDWAR_TUR_1970_submarine_school:0 "Submarine Service School"
 COLDWAR_TUR_1970_submarine_school_desc:0 "A capable submarine service depends on experienced crews, engineers, and disciplined maintenance. Expand technical training so the fleet can use its boats effectively and keep them in service."
 COLDWAR_TUR_1970_supervised_elections:0 "An Electoral Understanding"
 COLDWAR_TUR_1970_supervised_elections_desc:0 "Keep parliamentary competition within an understanding that reassures the general staff. Elections can sustain a civilian mandate, but limits imposed from outside the Assembly leave the government vulnerable to pressure."
 COLDWAR_TUR_1970_targeted_security:0 "Targeted Social Aid"
 COLDWAR_TUR_1970_targeted_security_desc:0 "Economic opening will not command lasting support if every adjustment falls on households with the least protection. Targeted assistance can preserve social consent while keeping a permanent claim on the public budget."
 COLDWAR_TUR_1970_tbkp_civic_rights:0 "Political Rights for All"
 COLDWAR_TUR_1970_tbkp_civic_rights_desc:0 "Workers, women and every community must be able to organise and take part in public decisions. A free political life requires equal rights and institutions that answer to citizens."
 COLDWAR_TUR_1970_tbkp_planning:0 "Planning and Markets"
 COLDWAR_TUR_1970_tbkp_planning_desc:0 "National development needs public priorities and investment, but markets and a wider distribution of ownership also have a place in economic life. The government must decide where to direct its limited investment first."
 COLDWAR_TUR_1970_tbkp_pluralism:0 "Parliament and Rights"
 COLDWAR_TUR_1970_tbkp_pluralism_desc:0 "A democratic republic needs a parliament able to hold the government to account, with freedom of belief, expression and organisation for its citizens. Political rights must be secure for opponents as well as supporters."
 COLDWAR_TUR_1970_tbkp_producer_services:0 "Producer Transport"
 COLDWAR_TUR_1970_tbkp_producer_services_desc:0 "Farmers and small producers need dependable links to markets and public services. Regional transport investment can make their enterprises more productive."
 COLDWAR_TUR_1970_tbkp_public_industry:0 "Industry Investment"
 COLDWAR_TUR_1970_tbkp_public_industry_desc:0 "Modern productive enterprises require investment beyond their present resources. Public capital can renew capacity while leaving room for other forms of ownership within a democratic economic plan."
 COLDWAR_TUR_1970_tbkp_public_presence:0 "United Socialist Voice"
 COLDWAR_TUR_1970_tbkp_public_presence_desc:0 "A united organisation must bring its different traditions into a common public life. Open political activity and local associations can give socialist ideas a place in a pluralist republic."
 COLDWAR_TUR_1970_tbkp_public_technology:0 "Industry Skills Training"
 COLDWAR_TUR_1970_tbkp_public_technology_desc:0 "Public investment must be matched by engineers and trained workers. Technical instruction can improve the capacity of Turkish enterprises to maintain and develop their equipment."
 COLDWAR_TUR_1970_tbkp_small_producers:0 "Aid Small Producers"
 COLDWAR_TUR_1970_tbkp_small_producers_desc:0 "Wider ownership needs access to credit and productive equipment. Support small producers and their associations so that economic opportunity reaches beyond the largest enterprises."
 COLDWAR_TUR_1970_tbkp_workplace_plan:0 "Workers and the Plan"
 COLDWAR_TUR_1970_tbkp_workplace_plan_desc:0 "Workers and technical staff should have a direct voice in the enterprises that shape their livelihoods. Their knowledge can improve production and make economic decisions more accountable."
 COLDWAR_TUR_1970_teacher_posts:0 "Provincial Teacher Posts"
 COLDWAR_TUR_1970_teacher_posts_desc:0 "Rural schools need trained teachers as well as classrooms. Fund provincial posts and technical instruction so that young people beyond the main cities can gain the skills required by agriculture and industry."
 COLDWAR_TUR_1970_technical_colleges:0 "Technical Colleges"
 COLDWAR_TUR_1970_technical_colleges_desc:0 "Factories, farms and public works need trained specialists close to the communities they serve. Provincial colleges will broaden practical teaching, with laboratories and instructors making a continuing claim on the education budget."
 COLDWAR_TUR_1970_technical_teachers:0 "Train Technical Teachers"
 COLDWAR_TUR_1970_technical_teachers_desc:0 "Rural schools and colleges need instructors as well as buildings. Train and retain technical teachers so students can gain the practical skills required by modern production and public services."
 COLDWAR_TUR_1970_temporary_aegean_war:0 "The Aegean War Cabinet"
 COLDWAR_TUR_1970_temporary_aegean_war_desc:0 "Greek entry transforms the island conflict into a war between the two states. A joint war cabinet can concentrate naval and air planning, but mobilising for a wider contest will draw resources away from civilian production."
 COLDWAR_TUR_1970_temporary_command_ministries:0 "Reorganise the Ministries"
 COLDWAR_TUR_1970_temporary_command_ministries_desc:0 "Military inspectors can confront patronage across the ministries and centralise control of public administration. The reorganisation promises discipline, but dismissals and overlapping authority may interrupt civilian services."
 COLDWAR_TUR_1970_temporary_competitive_lira_3:0 "Price Adjustment"
 COLDWAR_TUR_1970_temporary_competitive_lira_3_desc:0 "An overvalued lira makes Turkish exports costly and imported goods attractive. Restore competitiveness through exchange-rate adjustment, while preparing households and firms for higher prices on imported food, fuel, and equipment."
 COLDWAR_TUR_1970_temporary_limited_war:0 "Keep the War Limited"
 COLDWAR_TUR_1970_temporary_limited_war_desc:0 "Victory need not become a struggle for every shore of the Aegean. Concentrating the campaign on Cyprus can preserve strength for a negotiated settlement, while requiring the government to restrain those demanding a broader reckoning with Greece."
 COLDWAR_TUR_1970_temporary_northern_bridgehead:0 "Secure the Northern Bridgehead"
 COLDWAR_TUR_1970_temporary_northern_bridgehead_desc:0 "A landing is only the beginning of an enduring position on the island. The ports, roads and supply arrangements of the northern bridgehead must be made dependable before Ankara can decide what political settlement its troops will defend."
 COLDWAR_TUR_1970_territorial_defence:0 "Territorial Defence"
 COLDWAR_TUR_1970_territorial_defence_desc:0 "Turkey must be able to defend difficult terrain as well as its principal roads. Provincial formations and specialist instruction will strengthen territorial readiness, with administration and training sustaining the commitment."
 COLDWAR_TUR_1970_thermal_reserve:0 "Thermal Reserve Capacity"
 COLDWAR_TUR_1970_thermal_reserve_desc:0 "Thermal power can supply electricity when hydroelectric output falters. Reserve generation for the grid and industry, accepting greater fuel imports and pollution as the cost of dependable supply."
 COLDWAR_TUR_1970_thrace_claim:0 "A Claim on Western Thrace"
 COLDWAR_TUR_1970_thrace_claim_desc:0 "The government can carry its demands to the land frontier and invoke the position of the Turkish minority in Western Thrace. A territorial claim would turn that appeal into an openly expansionist war aim, with consequences extending far beyond the province itself."
 COLDWAR_TUR_1970_tip75_plan_machinery:0 "Machines for the Plan"
 COLDWAR_TUR_1970_tip75_plan_machinery_desc:0 "A plan for democratic renewal needs workshops capable of supplying Turkish producers. Public machinery investment can connect skilled employment with national development."
 COLDWAR_TUR_1970_tip75_rural_stations:0 "Farm Machine Stations"
 COLDWAR_TUR_1970_tip75_rural_stations_desc:0 "Rural producers need access to tractors and skilled maintenance without bearing the entire cost individually. Public stations can make machinery available across farming districts."
 COLDWAR_TUR_1970_tip_banking:0 "Public Banking"
 COLDWAR_TUR_1970_tip_banking_desc:0 "Credit determines which ambitions become factories and which remain promises. Public control of the principal banks can put national development first, while obliging the state to finance and administer the institutions it now directs."
 COLDWAR_TUR_1970_tip_farm_coops:0 "Producer Cooperatives"
 COLDWAR_TUR_1970_tip_farm_coops_desc:0 "Small farmers need credit, storage and a fair route to market. Voluntary producer cooperatives can strengthen their bargaining position while keeping control in the hands of members."
 COLDWAR_TUR_1970_tip_industrial_labs:0 "Industry Research"
 COLDWAR_TUR_1970_tip_industrial_labs_desc:0 "Public steelworks need engineers, machine tools and chemical supplies. Research connected to domestic production can reduce dependence on imported equipment."
 COLDWAR_TUR_1970_tip_industrial_plan:0 "Industry in the Plan"
 COLDWAR_TUR_1970_tip_industrial_plan_desc:0 "The labour movement must be able to deliver production as well as demand a fairer share. Long investment contracts and technical training will consolidate an industrial plan whose results can be judged by the people it serves."
 COLDWAR_TUR_1970_tip_institutes:0 "Village Institutes"
 COLDWAR_TUR_1970_tip_institutes_desc:0 "The village needs teachers who can join education to practical improvement. Institutes rooted in rural life can spread technical knowledge and give communities a stronger place in the Republic's scientific and cultural development."
 COLDWAR_TUR_1970_tip_insurance:0 "Social Insurance"
 COLDWAR_TUR_1970_tip_insurance_desc:0 "Industrial development should not leave a household destitute after injury, illness or unemployment. Broader social insurance can give working families greater security, with contributions and public expenditure sustaining the promise."
 COLDWAR_TUR_1970_tip_labour:0 "Labour and Republic"
 COLDWAR_TUR_1970_tip_labour_desc:0 "A republic of equal citizens must hear the people whose labour sustains it. The workers' party will use public authority to strengthen labour, defend civil rights and challenge the concentration of economic power."
 COLDWAR_TUR_1970_tip_legal_network:0 "Labour Networks"
 COLDWAR_TUR_1970_tip_legal_network_desc:0 "A new legal organisation must reconnect workers, local officers and professional supporters whose earlier party was closed. Institutions that survive scrutiny will give the labour programme a firmer public base."
 COLDWAR_TUR_1970_tip_machinery:0 "Farm Credit and Tools"
 COLDWAR_TUR_1970_tip_machinery_desc:0 "Agricultural credit should reach those who work modest holdings, not only those who can already offer security to a bank. Machinery services and funded lending can increase production while placing more of the initial risk on public institutions."
 COLDWAR_TUR_1970_tip_management:0 "Worker Management"
 COLDWAR_TUR_1970_tip_management_desc:0 "Workers know the faults of a workshop long before an inspector arrives. Representation in management can turn that knowledge into better production, while requiring time, training and a negotiated division of authority."
 COLDWAR_TUR_1970_tip_planning:0 "Democratic Planning"
 COLDWAR_TUR_1970_tip_planning_desc:0 "Investment should answer to social need as well as private return. Democratic planning can direct capital towards productive work, provided public institutions are equipped to hear workers and producers rather than merely issue instructions."
 COLDWAR_TUR_1970_tip_producer_control:0 "Producer Control"
 COLDWAR_TUR_1970_tip_producer_control_desc:0 "Participation needs resources that producers can direct themselves. A funded investment programme will give cooperatives a stronger position, while making public credit responsible for projects that may take years to repay."
 COLDWAR_TUR_1970_tip_public_investment:0 "Public Industry Funds"
 COLDWAR_TUR_1970_tip_public_investment_desc:0 "The commanding industries require capital that serves a long national purpose. A publicly financed plant can expand production beyond the priorities of the largest private groups, at a substantial cost to the Treasury."
 COLDWAR_TUR_1970_tip_public_technology:0 "Public Technical Skills"
 COLDWAR_TUR_1970_tip_public_technology_desc:0 "Public industry must develop the technical capacity to answer its critics. Applied research and professional training can improve production without reducing workers' participation to a ceremonial role."
 COLDWAR_TUR_1970_tip_small_farmers:0 "Small Farm Groups"
 COLDWAR_TUR_1970_tip_small_farmers_desc:0 "A small cultivator should not face large creditors and merchants alone. Cooperative credit and shared equipment can improve the position of rural households while preserving personal property and the work of the family farm."
 COLDWAR_TUR_1970_tip_steel_priority:0 "Public Steel and Tools"
 COLDWAR_TUR_1970_tip_steel_priority_desc:0 "A productive national economy needs domestic steel and engineering capacity. Public investment will strengthen the industries supplying the machinery on which Turkish development depends."
 COLDWAR_TUR_1970_tip_union_security:0 "Collective Bargaining"
 COLDWAR_TUR_1970_tip_union_security_desc:0 "The right to organise must have practical force in the workplace. Collective bargaining and broader insurance can give workers security and a stronger voice in production."
 COLDWAR_TUR_1970_tip_village_power:0 "Rural Production Links"
 COLDWAR_TUR_1970_tip_village_power_desc:0 "Better roads connect producers to machinery stations, schools and markets. Public investment in rural transport can support the villages alongside industrial development."
 COLDWAR_TUR_1970_tkp_alliance:0 "Workers and Peasants"
 COLDWAR_TUR_1970_tkp_alliance_desc:0 "A government claiming a popular revolution must bring factory workers and rural labourers into a common programme. Agricultural assistance and organised public provision can widen that alliance, while committing the state to demands it can no longer dismiss."
 COLDWAR_TUR_1970_tkp_banks:0 "Socialise Major Banks"
 COLDWAR_TUR_1970_tkp_banks_desc:0 "The principal banks place investment at the service of a narrow circle of owners. Bringing them into public hands will give the new government control over credit, together with the responsibility for their liabilities and daily administration."
 COLDWAR_TUR_1970_tkp_development:0 "Socialist Development"
 COLDWAR_TUR_1970_tkp_development_desc:0 "The party must make reconstruction visible in everyday production. A consolidated industrial programme will direct public capital into workshops and technical capacity, accepting the cost of proving that the new order can provide more than political declarations."
 COLDWAR_TUR_1970_tkp_education:0 "Worker Technical Skills"
 COLDWAR_TUR_1970_tkp_education_desc:0 "A new system cannot depend forever on inherited expertise. Technical colleges and workplace teaching will prepare workers to operate and direct complex production, with a lasting education budget supporting the change."
 COLDWAR_TUR_1970_tkp_farm_machinery:0 "Machinery for Farmers"
 COLDWAR_TUR_1970_tkp_farm_machinery_desc:0 "Rural producers need equipment they can maintain and use throughout the season. Machinery supply and repair instruction will connect higher output to practical services in the villages."
 COLDWAR_TUR_1970_tkp_front:0 "The Democratic Front"
 COLDWAR_TUR_1970_tkp_front_desc:0 "The revolutionary government needs a broader alliance than its clandestine organisation alone. A popular front can bring workers, peasants and sympathetic professionals into public life, but its social commitments will place further claims on the budget."
 COLDWAR_TUR_1970_tkp_industry:0 "Socialise Key Industry"
 COLDWAR_TUR_1970_tkp_industry_desc:0 "The new order will be judged by whether public industry can keep the country supplied. Reorganisation of the largest enterprises can concentrate investment, but interrupted management and training must be paid for before the promise of higher output is realised."
 COLDWAR_TUR_1970_tkp_plan:0 "National Output Plan"
 COLDWAR_TUR_1970_tkp_plan_desc:0 "Public ownership must be joined to a workable production plan. Reliable standards, investment schedules and supplies can make the factories more consistent, while imposing greater demands on the institutions coordinating them."
 COLDWAR_TUR_1970_tkp_public_steel:0 "Steel for the Plan"
 COLDWAR_TUR_1970_tkp_public_steel_desc:0 "Place steel and engineering at the centre of a public production plan. Heavy industry can supply the machines needed by agriculture, transport and other factories."
 COLDWAR_TUR_1970_tkp_rural_credit:0 "Collective Farm Credit"
 COLDWAR_TUR_1970_tkp_rural_credit_desc:0 "The rural alliance requires capital on terms that cultivators can meet. Collective purchasing and public credit will expand access to equipment, while the state carries more of the risk of poor harvests and unpaid advances."
 COLDWAR_TUR_1970_tkp_stations:0 "State Machine Stations"
 COLDWAR_TUR_1970_tkp_stations_desc:0 "A network of machinery stations can put equipment within reach of farms unable to buy their own. Workshops and trained crews will make this a permanent service, with the public sector responsible for keeping it supplied."
 COLDWAR_TUR_1970_tkp_underground:0 "Underground to Office"
 COLDWAR_TUR_1970_tkp_underground_desc:0 "The cadres who sustained the clandestine party must now build public institutions. A government born from confrontation cannot live on its underground discipline alone; it must organise the officials, workers and local committees who will carry its authority into everyday life."
 COLDWAR_TUR_1970_tkp_workplace_training:0 "Vocational Workshops"
 COLDWAR_TUR_1970_tkp_workplace_training_desc:0 "A planned economy needs skilled workers who can maintain and improve its machinery. Technical schools and workshop instruction will prepare the workforce for industrial production."
 COLDWAR_TUR_1970_tool_priority:0 "Machine-Tool Priority"
 COLDWAR_TUR_1970_tool_priority_desc:0 "A machine-making industry can serve factories far beyond its own gates. Precision tools and trained operators deserve the first claim on investment, even if this leaves fewer funds for a rapid expansion of finished motor production."
 COLDWAR_TUR_1970_trade_standards:0 "European Trade Standards"
 COLDWAR_TUR_1970_trade_standards_desc:0 "Turkish firms seeking European markets must meet demanding product and commercial standards. Laboratories, inspection services, and export advice can make that transition practical, though public agencies must bear the cost."
 COLDWAR_TUR_1970_transmission_works:0 "Transmissions and Parts"
 COLDWAR_TUR_1970_transmission_works_desc:0 "An engine line is only as dependable as its suppliers. Training and component contracts will strengthen the firms producing transmissions, bearings and replacement parts for the new works."
 COLDWAR_TUR_1970_tusas:0 "TUSAS Overhaul Capacity"
 COLDWAR_TUR_1970_tusas_desc:0 "Prepare a Turkish aircraft industry capable of overhaul, assembly, and engineering work. A trained workforce and careful technical partnerships can strengthen air readiness before Ankara commits to costly domestic production."
 COLDWAR_TUR_1970_university_research:0 "University Research"
 COLDWAR_TUR_1970_university_research_desc:0 "Turkish universities need laboratories and scientific careers capable of supporting advanced industry. A sustained research allocation can build this capacity, while competing with the immediate demand for technical colleges and provincial instruction."
 COLDWAR_TUR_1970_urban_growth:0 "Restructure State Enterprises"
 COLDWAR_TUR_1970_urban_growth_desc:0 "Reorganise the finance and management of public utilities and productive enterprises. Applied technical capacity and dependable municipal services give the state a stronger basis for reducing repeated transfers while preserving useful investment."
 COLDWAR_TUR_1970_urban_utilities:0 "Urban Utility Investment"
 COLDWAR_TUR_1970_urban_utilities_desc:0 "Growing urban districts need dependable water, power, and municipal administration. Invest in utilities that can serve new residents and industry, while strengthening the local institutions responsible for maintenance."
 COLDWAR_TUR_1970_vehicle_works:0 "National Vehicle Works"
 COLDWAR_TUR_1970_vehicle_works_desc:0 "Domestic vehicle production can serve both national defence and civilian transport. Turkish works will gain engineering experience, while machinery, components and trained technicians require a substantial investment."
 COLDWAR_TUR_1970_village_cities:0 "Village-City Centres"
 COLDWAR_TUR_1970_village_cities_desc:0 "Village communities need nearby schools, health services and productive work. A network of village centres can bring these services within reach while retaining the strength of local communities."
 COLDWAR_TUR_1970_village_health:0 "Village Health Teams"
 COLDWAR_TUR_1970_village_health_desc:0 "Village health teams can treat illness before it becomes a burden on distant hospitals. Regular clinics and trained staff extend public care beyond the cities, but require a lasting commitment from the health budget."
 COLDWAR_TUR_1970_welfare_municipalities:0 "Welfare Municipalities"
 COLDWAR_TUR_1970_welfare_municipalities_desc:0 "A municipality should be judged by whether help reaches the household that needs it. Organised welfare and accountable local services can build a durable social base, while committing the government to more than an election-season distribution."
 COLDWAR_TUR_1970_world_markets:0 "Turkish Firms Abroad"
 COLDWAR_TUR_1970_world_markets_desc:0 "Exporters, contractors and service firms can build a lasting Turkish presence abroad. Commercial representation and practical training will help them stay there after the first contract is finished."
 COLDWAR_TUR_1970_ytp_continuation:0 "The Provincial Base"
 COLDWAR_TUR_1970_ytp_continuation_desc:0 "A smaller party can still serve a provincial electorate if it keeps its organisation and programme intact. The government will invest in that base rather than treat an unfavourable election as a reason to abandon it."
 COLDWAR_TUR_1970_ytp_coops:0 "Producer Cooperatives"
 COLDWAR_TUR_1970_ytp_coops_desc:0 "A cooperative should answer to its members rather than to an appointed patron. Shared purchasing and marketing can strengthen small farmers, provided the state supplies credit without taking command of every village account."
 COLDWAR_TUR_1970_ytp_eastern_plan:0 "Develop the East"
 COLDWAR_TUR_1970_ytp_eastern_plan_desc:0 "The eastern provinces need an investment programme that answers their own conditions. Roads, workshops and public services can connect neglected districts to the national economy without requiring their affairs to be directed entirely from Ankara."
 COLDWAR_TUR_1970_ytp_enterprise:0 "Provincial Credit"
 COLDWAR_TUR_1970_ytp_enterprise_desc:0 "Provincial traders and manufacturers need patient capital as well as better roads. Regional lending can turn local savings into workshops, while keeping the public banks exposed to the fortunes of smaller firms."
 COLDWAR_TUR_1970_ytp_land:0 "Land for the Landless"
 COLDWAR_TUR_1970_ytp_land_desc:0 "Landless families and small cultivators need fair surveys, practical settlement assistance and a stronger position in agricultural development. A funded rural reform programme will connect these needs to better production, with public services supporting the work."
 COLDWAR_TUR_1970_ytp_land_settlement:0 "Farm Settlement Aid"
 COLDWAR_TUR_1970_ytp_land_settlement_desc:0 "Land reform must be supported by roads, water and practical assistance if a family holding is to support its cultivators. Settlement without these services would leave the underlying poverty untouched."
 COLDWAR_TUR_1970_ytp_partnership:0 "Liberal Assembly Pact"
 COLDWAR_TUR_1970_ytp_partnership_desc:0 "Parliamentary partnership can give a smaller organisation influence beyond its numbers. A common programme of research and practical investment will preserve its contribution without pretending that cooperation makes the parties identical."
 COLDWAR_TUR_1970_ytp_prices:0 "Farm Price Support"
 COLDWAR_TUR_1970_ytp_prices_desc:0 "Small cultivators need the means to keep producing when their earnings fall short. Funded assistance and purchasing advice can support farm incomes, while making rural protection a continuing public responsibility."
 COLDWAR_TUR_1970_ytp_professionals:0 "Train Regional Experts"
 COLDWAR_TUR_1970_ytp_professionals_desc:0 "Eastern development needs technical colleges and engineers able to maintain machinery, waterworks and public works. Provincial teaching will support industry and keep more practical expertise close to the communities that need it."
 COLDWAR_TUR_1970_ytp_purchasing:0 "Rural Purchase Offices"
 COLDWAR_TUR_1970_ytp_purchasing_desc:0 "The guarantee needs buyers, accounts and accessible depots. A regional purchasing service will make the promise usable to small producers rather than leave it in the hands of distant wholesalers."
 COLDWAR_TUR_1970_ytp_regional_markets:0 "Regional Farm Trade"
 COLDWAR_TUR_1970_ytp_regional_markets_desc:0 "Eastern producers need access to purchasers and reliable transport. Regional marketing can connect family farms and local firms to the national economy."
 COLDWAR_TUR_1970_ytp_services:0 "A Republic of Services"
 COLDWAR_TUR_1970_ytp_services_desc:0 "The Republic must be present in a village as more than a tax demand and a distant official. Practical services and accountable local institutions can give parliamentary government a stronger foundation in the provinces."
 COLDWAR_TUR_1970_ytp_storage:0 "Cooperative Storage"
 COLDWAR_TUR_1970_ytp_storage_desc:0 "Storage and processing belong beside the farms that supply them. Producer-owned facilities can reduce waste and improve bargaining power, but the investment must be carried before its first successful season."
 COLDWAR_TUR_1970_ytp_village_links:0 "Village Roads, Water"
 COLDWAR_TUR_1970_ytp_village_links_desc:0 "A harvest is worth little if it cannot reach a buyer, and a school struggles without safe water and transport. A provincial works programme will begin with these ordinary foundations of economic life."
 COLDWAR_TUR_1970_ytp_village_professions:0 "Regional Skills"
 COLDWAR_TUR_1970_ytp_village_professions_desc:0 "Provincial services need trained teachers, technicians and administrators who can build careers outside the largest cities. A funded professional programme will strengthen local services while committing the education budget to continued training."
 COLDWAR_TUR_CYP_R2_tur_abstain:0 "Decline Intervention"
 COLDWAR_TUR_CYP_R2_tur_abstain_desc:0 "Declining intervention can preserve peace with Greece and maintain Turkey's standing among its allies. The cabinet must still answer officers and citizens who expect the state to protect Turkish Cypriots."
 COLDWAR_TUR_CYP_R2_tur_consult:0 "Consult the Guarantors"
 COLDWAR_TUR_CYP_R2_tur_consult_desc:0 "A crisis in Cyprus calls for consultation among the guarantor powers. Ankara can place its concerns before Athens and London while keeping a negotiated settlement within reach of all three governments."
 COLDWAR_TUR_CYP_R2_tur_operation:0 "Intervene in Cyprus"
 COLDWAR_TUR_CYP_R2_tur_operation_desc:0 "If the Cyprus settlement cannot protect Turkish Cypriots, Ankara may consider military action. Such a choice risks confrontation with Greece, strains relations with allies, and could turn a local crisis into a regional war."
 COLDWAR_TUR_CYP_R2_tur_terms:0 "Negotiate Security Terms"
 COLDWAR_TUR_CYP_R2_tur_terms_desc:0 "Turkey can seek revised security assurances with Greece and Britain to protect both communities and preserve the Republic of Cyprus. Negotiations demand concessions, but a settlement may avert a wider conflict."
