l_english:
# IMPERIA COLD WAR — Turkey national programme English localisation.
 COLDWAR_TUR_1970_accountable_holdings:0 "Public Firm Oversight"
 COLDWAR_TUR_1970_accountable_holdings_desc:0 "Public enterprises must answer for their accounts as well as their production. Professional oversight can curb patronage and improve management, provided the institutions have qualified staff and dependable funding."
 COLDWAR_TUR_1970_accounts:0 "Public Defence Accounts"
 COLDWAR_TUR_1970_accounts_desc:0 "Military procurement and service contracts require clear public accounts. An independent audit office can expose patronage and strengthen parliament's scrutiny, though a professional staff and reliable records carry a continuing cost."
 COLDWAR_TUR_1970_administration_school:0 "Public Administration School"
 COLDWAR_TUR_1970_administration_school_desc:0 "Parliament, the National Security Council, and the general staff all depend on capable ministries. A public administration school can train officials to keep records, manage budgets, and carry policy into the provinces."
 COLDWAR_TUR_1970_aegean_claim:0 "Press the Aegean Island Claim"
 COLDWAR_TUR_1970_aegean_claim_desc:0 "The islands facing the Turkish coast command routes essential to both countries. Ankara will press its existing claim as a declared objective of the war, accepting the burden of carrying the conflict beyond Cyprus."
 COLDWAR_TUR_1970_aegean_deterrence:0 "Aegean Naval Deterrence"
 COLDWAR_TUR_1970_aegean_deterrence_desc:0 "Give naval deterrence priority over a reciprocal settlement with Greece. A stronger operational posture reassures the services, while persistent maritime tension risks damaging trade and commercial confidence."
 COLDWAR_TUR_1970_aegean_talks:0 "Aegean Deconfliction"
 COLDWAR_TUR_1970_aegean_talks_desc:0 "Offer Greece reciprocal naval deconfliction and a standing channel for maritime incidents. Practical cooperation can preserve readiness and reduce the risk of miscalculation, provided both governments uphold the agreement."
 COLDWAR_TUR_1970_aegean_war:0 "The Aegean War Cabinet"
 COLDWAR_TUR_1970_aegean_war_desc:0 "Greek entry transforms the island conflict into a war between the two states. A joint war cabinet can concentrate naval and air planning, but mobilising for a wider contest will draw resources away from civilian production."
 COLDWAR_TUR_1970_airframe_assembly:0 "Airframe Assembly Partnership"
 COLDWAR_TUR_1970_airframe_assembly_desc:0 "Prepare Turkish factories and engineers for aircraft assembly and component production. A negotiated partnership can build industrial knowledge, but dependable airframes require years of technical training and investment."
 COLDWAR_TUR_1970_amphibious_service:0 "Amphibious Service Training"
 COLDWAR_TUR_1970_amphibious_service_desc:0 "The armed forces require trained crews and clear procedures to move troops and supplies by sea. Coordinated amphibious exercises can improve readiness in the Aegean, but demand vessels, training, and continuing funds."
 COLDWAR_TUR_1970_anap_border_enterprise:0 "Eastern Enterprise"
 COLDWAR_TUR_1970_anap_border_enterprise_desc:0 "Investment incentives and better connections can bring private activity to eastern provinces. Public resources must first build the foundations on which local firms can compete."
 COLDWAR_TUR_1970_anap_college_workshops:0 "College Workshops"
 COLDWAR_TUR_1970_anap_college_workshops_desc:0 "Technical education needs workshops where students can practise with the tools used by local industry. Practical instruction will help graduates enter productive employment."
 COLDWAR_TUR_1970_anap_contractors_abroad:0 "Contractors Abroad"
 COLDWAR_TUR_1970_anap_contractors_abroad_desc:0 "Construction firms need experienced staff and domestic suppliers before they can compete for work overseas. Commercial training can help them prepare for contracts they must still win."
 COLDWAR_TUR_1970_anap_discretionary_aid:0 "Selective Incentives"
 COLDWAR_TUR_1970_anap_discretionary_aid_desc:0 "The government can concentrate investment incentives on favoured exporters and speed the establishment of capacity. Selective access to public support carries a risk of corruption that must be accepted openly."
 COLDWAR_TUR_1970_anap_eastern_training:0 "Training in the East"
 COLDWAR_TUR_1970_anap_eastern_training_desc:0 "Eastern provinces need professional and technical opportunities if investment is to create lasting local employment. Regional training can strengthen firms beyond the largest coastal cities."
 COLDWAR_TUR_1970_anap_equipment:0 "Factory Equipment Aid"
 COLDWAR_TUR_1970_anap_equipment_desc:0 "Productive investment requires finance that lasts longer than a trading season. Equipment funding can improve the efficiency of industrial lines, with the government accepting a substantial initial commitment of public capital."
 COLDWAR_TUR_1970_anap_europe_customers:0 "European Customers"
 COLDWAR_TUR_1970_anap_europe_customers_desc:0 "Turkish exporters can seek customers in Europe if they meet demanding standards and delivery schedules. Commercial resources will help firms prepare their products for a competitive market."
 COLDWAR_TUR_1970_anap_europe_standards:0 "Quality for Export"
 COLDWAR_TUR_1970_anap_europe_standards_desc:0 "Manufacturers competing for European orders need consistent products and trained staff. Quality work in Turkey can help firms retain customers through commercial performance."
 COLDWAR_TUR_1970_anap_export_brokers:0 "Commercial Networks"
 COLDWAR_TUR_1970_anap_export_brokers_desc:0 "Exporters and their suppliers need commercial contacts capable of turning public investment into orders. Business services can help firms reach customers beyond the domestic market."
 COLDWAR_TUR_1970_anap_export_corridor:0 "Export Corridors"
 COLDWAR_TUR_1970_anap_export_corridor_desc:0 "Exporters need roads and dependable links to ports as much as they need customers. Concentrated transport investment will reduce the distance between provincial producers and foreign markets."
 COLDWAR_TUR_1970_anap_export_quality:0 "Export Quality Rules"
 COLDWAR_TUR_1970_anap_export_quality_desc:0 "Export equipment must be matched by product quality and technical skills. Training and industrial testing can help producers keep the customers they win abroad."
 COLDWAR_TUR_1970_anap_export_standards:0 "Export Standards"
 COLDWAR_TUR_1970_anap_export_standards_desc:0 "Turkish manufacturers need dependable quality as well as modern machines to win foreign orders. Testing and technical training can help firms compete on the strength of their products."
 COLDWAR_TUR_1970_anap_farm_extension:0 "Irrigation Advice"
 COLDWAR_TUR_1970_anap_farm_extension_desc:0 "Farmers need practical advice on using water and equipment effectively. Extension workers can help turn public irrigation works into more reliable production."
 COLDWAR_TUR_1970_anap_farm_irrigation:0 "Farm Water Networks"
 COLDWAR_TUR_1970_anap_farm_irrigation_desc:0 "Farm exports depend on a reliable harvest as well as access to buyers. The agricultural investment fund can first expand irrigation and local water distribution."
 COLDWAR_TUR_1970_anap_farm_marketing:0 "Farm Market Networks"
 COLDWAR_TUR_1970_anap_farm_marketing_desc:0 "Irrigation and better marketing give farmers a chance to sell more of a reliable harvest. The state can support access to markets without directing every production decision."
 COLDWAR_TUR_1970_anap_farm_processing:0 "Food Processing"
 COLDWAR_TUR_1970_anap_farm_processing_desc:0 "Agricultural exports can earn more when producers have nearby processing facilities. The agricultural investment fund can finance those works instead of concentrating first on irrigation."
 COLDWAR_TUR_1970_anap_farm_routes:0 "Roads from the Farms"
 COLDWAR_TUR_1970_anap_farm_routes_desc:0 "A larger harvest needs a route to processors and buyers. Better local connections will help farm households sell produce while it is still marketable."
 COLDWAR_TUR_1970_anap_financial_skills:0 "Financial Training"
 COLDWAR_TUR_1970_anap_financial_skills_desc:0 "Banks and commercial firms need specialists who understand international transactions. Professional training can support a more open financial system and its expanding obligations."
 COLDWAR_TUR_1970_anap_food_markets:0 "Farm Goods Markets"
 COLDWAR_TUR_1970_anap_food_markets_desc:0 "Farmers and food firms need commercial contacts that reach beyond the nearest town. Local offices can connect provincial producers to a wider network of buyers."
 COLDWAR_TUR_1970_anap_food_standards:0 "Standards for Food"
 COLDWAR_TUR_1970_anap_food_standards_desc:0 "Processed food must meet the requirements of customers at home and abroad. Testing and technical instruction can help producers protect the reputation of Turkish goods."
 COLDWAR_TUR_1970_anap_freight_depots:0 "Export Depots"
 COLDWAR_TUR_1970_anap_freight_depots_desc:0 "Warehouses and commercial services can gather goods from smaller producers before shipment. Exporters need reliable handling as much as a market for the final product."
 COLDWAR_TUR_1970_anap_freight_roads:0 "Freight to the Ports"
 COLDWAR_TUR_1970_anap_freight_roads_desc:0 "Manufacturers need dependable routes from factories to ports. Directing the transport allocation to freight can help exporters ship goods on time, while competing with investment in tourism access."
 COLDWAR_TUR_1970_anap_freight_training:0 "Export Logistics Skills"
 COLDWAR_TUR_1970_anap_freight_training_desc:0 "Export firms need people who can organise transport, documentation and delivery. Practical commercial training can make the new freight routes more useful to provincial producers."
 COLDWAR_TUR_1970_anap_housing:0 "Serviced Urban Land"
 COLDWAR_TUR_1970_anap_housing_desc:0 "Growing towns need roads and public services before private builders can provide dependable new neighbourhoods. Serviced land in Istanbul will support urban expansion, while public investment carries the cost of reaching households beyond the established centres."
 COLDWAR_TUR_1970_anap_housing_land:0 "Serviced Urban Land"
 COLDWAR_TUR_1970_anap_housing_land_desc:0 "A growing urban population needs housing on land with adequate roads and utilities. The social investment allocation can prepare new districts for building and settlement."
 COLDWAR_TUR_1970_anap_housing_services:0 "Services for Homes"
 COLDWAR_TUR_1970_anap_housing_services_desc:0 "New neighbourhoods need public services after the first houses are occupied. Local provision and health care will place a lasting claim on the public budget."
 COLDWAR_TUR_1970_anap_housing_suppliers:0 "Housing Suppliers"
 COLDWAR_TUR_1970_anap_housing_suppliers_desc:0 "Construction firms need dependable materials to build homes at a cost families can afford. Investment in local supply can support housing as well as the broader building trade."
 COLDWAR_TUR_1970_anap_incentive_audits:0 "Incentive Accounts"
 COLDWAR_TUR_1970_anap_incentive_audits_desc:0 "Published incentives need reliable accounts if the Treasury is to know which firms receive support. Professional supervision can make public commitments more predictable."
 COLDWAR_TUR_1970_anap_insurance_services:0 "Shipping Insurance"
 COLDWAR_TUR_1970_anap_insurance_services_desc:0 "International commerce depends on shipping, insurance and reliable commercial services. Istanbul can develop these activities if firms have the offices and staff to serve foreign customers."
 COLDWAR_TUR_1970_anap_market_farms:0 "Agricultural Marketing"
 COLDWAR_TUR_1970_anap_market_farms_desc:0 "An open market must give farmers the means to reach its buyers. Storage, commercial advice and practical training can help rural production compete, while concessionary finance reduces the immediate tax return."
 COLDWAR_TUR_1970_anap_middle_east_markets:0 "Regional Customers"
 COLDWAR_TUR_1970_anap_middle_east_markets_desc:0 "Turkish suppliers and contractors can seek orders across neighbouring markets. Commercial resources can support their domestic preparation while individual foreign customers decide whether to buy."
 COLDWAR_TUR_1970_anap_parts_suppliers:0 "Suppliers for Exporters"
 COLDWAR_TUR_1970_anap_parts_suppliers_desc:0 "Export factories rely on domestic suppliers who can meet demanding schedules. New workshops can retain more of the work in Turkey, though they require costly investment before orders arrive."
 COLDWAR_TUR_1970_anap_regional_colleges:0 "Regional Colleges"
 COLDWAR_TUR_1970_anap_regional_colleges_desc:0 "Provincial firms need technicians and commercial staff trained close to home. The social investment allocation can finance practical education, leaving urban housing for another funding round."
 COLDWAR_TUR_1970_anap_rules_based_aid:0 "Rules for Incentives"
 COLDWAR_TUR_1970_anap_rules_based_aid_desc:0 "Export incentives can be awarded through published conditions rather than private discretion. Parliament and firms must accept the political effort required to make the same rules apply across the market."
 COLDWAR_TUR_1970_anap_social_cover:0 "Wider Social Coverage"
 COLDWAR_TUR_1970_anap_social_cover_desc:0 "A market economy needs political consent from households as well as confidence from investors. Broader social coverage will protect the programme's foundations, with a permanent contribution from the budget."
 COLDWAR_TUR_1970_anap_tourism_roads:0 "Tourism Connections"
 COLDWAR_TUR_1970_anap_tourism_roads_desc:0 "Visitors bring income to regions whose firms can offer transport and accommodation. A tourism transport allocation can open new destinations, though freight improvements must compete for later funds."
 COLDWAR_TUR_1970_anap_tourism_services:0 "Tourism Enterprises"
 COLDWAR_TUR_1970_anap_tourism_services_desc:0 "Small firms need premises and commercial services to turn visitor demand into local employment. Private enterprise can build the sector around improved access."
 COLDWAR_TUR_1970_anap_tourism_training:0 "Hospitality Training"
 COLDWAR_TUR_1970_anap_tourism_training_desc:0 "A lasting visitor economy depends on trained workers and dependable service. Local training will help tourism firms make better use of the connections built for them."
 COLDWAR_TUR_1970_anatolian_markets:0 "Markets for Anatolian Firms"
 COLDWAR_TUR_1970_anatolian_markets_desc:0 "A provincial factory needs customers as well as credit. Testing, commercial representation and supply contracts can help smaller firms reach national markets without making them permanently dependent on a minister's favour."
 COLDWAR_TUR_1970_anatolian_training:0 "Anatolian Skills"
 COLDWAR_TUR_1970_anatolian_training_desc:0 "Practical expertise is concentrated too narrowly in the largest cities. Colleges and workshops across Anatolia will prepare specialists for industry, agriculture and the services, provided graduates can find equipment and skilled work at home."
 COLDWAR_TUR_1970_ap_building_materials:0 "Building Materials"
 COLDWAR_TUR_1970_ap_building_materials_desc:0 "Housing construction needs a steady supply of affordable building materials. Local producers and contractors can reduce dependence on distant suppliers as industrial towns expand."
 COLDWAR_TUR_1970_ap_city_clinics:0 "Town Health Support"
 COLDWAR_TUR_1970_ap_city_clinics_desc:0 "Rapid urban growth puts pressure on families seeking dependable health services. Public support for local staff and access programmes can sustain confidence in development, while increasing the health budget commitment."
 COLDWAR_TUR_1970_ap_city_water:0 "Water for New Districts"
 COLDWAR_TUR_1970_ap_city_water_desc:0 "Provincial towns are receiving families faster than water and sanitation can be extended. The first claim on the urban works budget will go to the services on which those new districts depend."
 COLDWAR_TUR_1970_ap_coastal_supply:0 "Coastal Processing"
 COLDWAR_TUR_1970_ap_coastal_supply_desc:0 "A dependable processing industry can connect fishing communities to customers throughout the country. New works around Izmir will handle and prepare their output, while commercial services coordinate purchases and distribution."
 COLDWAR_TUR_1970_ap_contract_suppliers:0 "Contractor Supply"
 COLDWAR_TUR_1970_ap_contract_suppliers_desc:0 "Provincial contractors need dependable materials and trained workers to carry their orders through. Local suppliers can turn government contracts into a broader construction trade."
 COLDWAR_TUR_1970_ap_dam_contractors:0 "Dam Contractors"
 COLDWAR_TUR_1970_ap_dam_contractors_desc:0 "Anatolian water and power projects depend on contractors who can build and maintain large works. Long public contracts can leave behind skills and workshops if their cost is carried through to completion."
 COLDWAR_TUR_1970_ap_dam_engineers:0 "Works Engineers"
 COLDWAR_TUR_1970_ap_dam_engineers_desc:0 "The construction programme needs surveyors, engineers and technicians as well as concrete. Practical instruction can strengthen the firms that must operate and maintain these works."
 COLDWAR_TUR_1970_ap_direct_contracts:0 "Preferred Contracts"
 COLDWAR_TUR_1970_ap_direct_contracts_desc:0 "The government can place contracts quickly with favoured provincial builders. A rapid start will enlarge local capacity, but private access to public money will carry a clear cost to the integrity of administration."
 COLDWAR_TUR_1970_ap_farm_credit:0 "Farm Cooperative Aid"
 COLDWAR_TUR_1970_ap_farm_credit_desc:0 "Farmers need affordable machinery and the means to bring a harvest to market. Lending through their own cooperatives can spread investment beyond the largest estates, provided the banks are willing to carry a long rural commitment."
 COLDWAR_TUR_1970_ap_fish_distribution:0 "Markets for the Catch"
 COLDWAR_TUR_1970_ap_fish_distribution_desc:0 "A catch loses value when it cannot reach the towns quickly. Commercial depots and transport can connect cooperative sellers with urban buyers."
 COLDWAR_TUR_1970_ap_fisheries:0 "Credit for Fishing"
 COLDWAR_TUR_1970_ap_fisheries_desc:0 "Small fishing enterprises need reliable finance and a stronger position when selling their catch. Coastal cooperative offices will organise credit, purchases and commercial advice, giving crews a practical service rather than another distant promise."
 COLDWAR_TUR_1970_ap_fishing_gear:0 "Coastal Boatyards"
 COLDWAR_TUR_1970_ap_fishing_gear_desc:0 "Small crews need reliable boats and repair facilities close to their harbours. Local workshops can keep equipment in service and give coastal trades a steadier market."
 COLDWAR_TUR_1970_ap_irrigation:0 "Family Farm Water"
 COLDWAR_TUR_1970_ap_irrigation_desc:0 "Small farms need reliable water as well as affordable equipment. Irrigation and local distribution will improve harvests, but the public works require a substantial initial commitment."
 COLDWAR_TUR_1970_ap_irrigation_maintenance:0 "Canal Maintenance"
 COLDWAR_TUR_1970_ap_irrigation_maintenance_desc:0 "Water reaches a farm only when canals and pumps remain in working order. Local maintenance crews can protect the investment from deterioration and keep smallholders connected to irrigation."
 COLDWAR_TUR_1970_ap_local_builders:0 "Local Building Firms"
 COLDWAR_TUR_1970_ap_local_builders_desc:0 "Provincial builders need trained staff and access to consistent orders. A stronger local construction trade can continue to serve new districts after the first contracts are complete."
 COLDWAR_TUR_1970_ap_machinery_pools:0 "Farm Machinery Pools"
 COLDWAR_TUR_1970_ap_machinery_pools_desc:0 "Cooperative purchasing and shared machinery can bring mechanisation within reach of cultivators whose holdings cannot sustain individual investment."
 COLDWAR_TUR_1970_ap_open_contracts:0 "Open Tendering"
 COLDWAR_TUR_1970_ap_open_contracts_desc:0 "Open competition for public contracts asks officials and legislators to defend a slower, more transparent process. The government will need political support to establish standards that suppliers can trust."
 COLDWAR_TUR_1970_ap_port_cooperatives:0 "Cooperative Port Sales"
 COLDWAR_TUR_1970_ap_port_cooperatives_desc:0 "Cooperative sales and equipment purchasing can strengthen small coastal producers without removing their responsibility for operating their own boats."
 COLDWAR_TUR_1970_ap_provincial_councils:0 "Provincial Consultation"
 COLDWAR_TUR_1970_ap_provincial_councils_desc:0 "Development depends on the cooperation of local representatives, professionals and producers. Provincial consultation can bring practical needs to the attention of the ministries responsible for investment."
 COLDWAR_TUR_1970_ap_roads_maintenance:0 "Road Crews"
 COLDWAR_TUR_1970_ap_roads_maintenance_desc:0 "A road loses its value when maintenance cannot keep pace with traffic. Regional crews and workshops will keep the routes between producers and markets open."
 COLDWAR_TUR_1970_ap_seed_services:0 "Seed and Farm Advice"
 COLDWAR_TUR_1970_ap_seed_services_desc:0 "Farmers need advice on seed, machinery and the care of irrigated land. Agricultural services can make cooperative equipment more useful without displacing the family farm."
 COLDWAR_TUR_1970_ap_supplier_credit:0 "Provincial Suppliers"
 COLDWAR_TUR_1970_ap_supplier_credit_desc:0 "Provincial workshops need dependable orders and access to commercial credit. A wider network of suppliers can give private manufacturers a foothold beyond the established industrial centres."
 COLDWAR_TUR_1970_ap_supplier_training:0 "Workshop Apprentices"
 COLDWAR_TUR_1970_ap_supplier_training_desc:0 "Independent firms need skilled machinists and foremen to deliver consistent goods. Apprenticeships will link local workshops to the technical schools on which expansion depends."
 COLDWAR_TUR_1970_ap_teacher_posts:0 "Provincial Teachers"
 COLDWAR_TUR_1970_ap_teacher_posts_desc:0 "Children in provincial districts need teachers who can remain in their communities. Schools and local recruitment require a dependable commitment to education spending."
 COLDWAR_TUR_1970_ap_tender_profession:0 "Tender Officers"
 COLDWAR_TUR_1970_ap_tender_profession_desc:0 "Competitive procurement requires officials who can prepare bids and compare the obligations they impose. Professional staff can protect the value of public investment."
 COLDWAR_TUR_1970_ap_trade_schools:0 "Local Trade Schools"
 COLDWAR_TUR_1970_ap_trade_schools_desc:0 "Farm machinery, construction and industry all rely on practical trades. Provincial schools can train the people required by the development programme without drawing every student to the capital."
 COLDWAR_TUR_1970_ap_water_engineers:0 "Municipal Water Crews"
 COLDWAR_TUR_1970_ap_water_engineers_desc:0 "Municipalities need trained crews to maintain pipes and treatment works after construction. Public services will need a continuing share of the budget as the city grows."
 COLDWAR_TUR_1970_ap_worker_housing:0 "Homes near Industry"
 COLDWAR_TUR_1970_ap_worker_housing_desc:0 "New industrial towns must provide housing for workers and their families. The urban works budget can support serviced building land, though this leaves less for immediate water expansion elsewhere."
 COLDWAR_TUR_1970_applied_research:0 "Applied Industrial Research"
 COLDWAR_TUR_1970_applied_research_desc:0 "Research should solve the problems encountered by farms and workshops. Technical institutes will work with domestic producers on useful machinery, controls and maintenance rather than measure their success by imported designs alone."
 COLDWAR_TUR_1970_aselsan:0 "ASELSAN Communications"
 COLDWAR_TUR_1970_aselsan_desc:0 "A Turkish communications industry can equip the armed forces and train a new body of engineers. Laboratories, components, and technical staff must be developed before domestic electronics can meet service requirements."
 COLDWAR_TUR_1970_audit_court:0 "Court of Accounts"
 COLDWAR_TUR_1970_audit_court_desc:0 "Public expenditure must answer to institutions that can inspect a ministry as readily as a provincial office. Expanding the Court of Accounts gives Parliament better evidence, while exposing arrangements on which influential patrons have long depended."
 COLDWAR_TUR_1970_black_sea_gas:0 "Black Sea Gas Contract"
 COLDWAR_TUR_1970_black_sea_gas_desc:0 "Long-term gas and industrial agreements with Moscow can meet rising energy demand and support production. Reliable supply depends on firm contracts, transport, and careful management of the commercial relationship."
 COLDWAR_TUR_1970_bonn_protocol:0 "Bonn Labour Protocol"
 COLDWAR_TUR_1970_bonn_protocol_desc:0 "Cooperate with Bonn on consular protection, recruitment, and the remittances Turkish workers send home. Clear arrangements can support families and employers while preserving Ankara's authority over migration."
 COLDWAR_TUR_1970_capacity_arms_factory_1_tt:0 "Room for 1 additional arms factory level."
 COLDWAR_TUR_1970_capacity_dockyard_1_tt:0 "Room for 1 additional dockyard level."
 COLDWAR_TUR_1970_capacity_fossil_powerplant_1_tt:0 "Room for 1 additional fossil powerplant level."
 COLDWAR_TUR_1970_capacity_industrial_complex_1_tt:0 "Room for 1 additional industrial complex level."
 COLDWAR_TUR_1970_capacity_infrastructure_1_tt:0 "Room for 1 additional infrastructure level."
 COLDWAR_TUR_1970_capacity_infrastructure_2_tt:0 "Room for 2 additional infrastructure levels."
 COLDWAR_TUR_1970_capacity_offices_1_tt:0 "Room for 1 additional offices level."
 COLDWAR_TUR_1970_cgp_common_board:0 "Republican Growth"
 COLDWAR_TUR_1970_cgp_common_board_desc:0 "Republican institutions and a mixed economy can unite public purpose with private initiative. The government should coordinate investment while leaving room for independent enterprise."
 COLDWAR_TUR_1970_cgp_private_compact:0 "Private Capital Pact"
 COLDWAR_TUR_1970_cgp_private_compact_desc:0 "A reliable framework can draw private capital into the national programme. The government will support firms that expand production, while accepting a lower immediate tax return from their retained earnings."
 COLDWAR_TUR_1970_cgp_public_credit:0 "Public Credit Oversight"
 COLDWAR_TUR_1970_cgp_public_credit_desc:0 "Public credit should sustain useful production without becoming a refuge for failing contracts. Stronger review can improve the output of supported firms, with commercial services carrying the cost of a more cautious lending policy."
 COLDWAR_TUR_1970_change_order:0 "The Social State"
 COLDWAR_TUR_1970_change_order_desc:0 "The Republic must make constitutional democracy meaningful to workers, farmers and families. Planned development and social rights can bring the benefits of growth to citizens beyond the established centres of wealth."
 COLDWAR_TUR_1970_chemical_inputs:0 "Fertiliser and Inputs"
 COLDWAR_TUR_1970_chemical_inputs_desc:0 "Industrial development should raise the productivity of the countryside as well as the towns. Domestic chemical inputs and fertiliser supply can give farmers more dependable production, at the cost of another large capital commitment."
 COLDWAR_TUR_1970_chp_civic_services:0 "Local Civic Services"
 COLDWAR_TUR_1970_chp_civic_services_desc:0 "Citizens should be able to obtain public services without a journey to a distant administrative centre. Provincial offices can make the Republic more accessible and accountable."
 COLDWAR_TUR_1970_chp_coop_trade:0 "Cooperative Trade"
 COLDWAR_TUR_1970_chp_coop_trade_desc:0 "A cooperative export service can help producers reach foreign markets and bring the proceeds of their work home. Their organisations need commercial knowledge as well as dependable transport."
 COLDWAR_TUR_1970_chp_coop_warehouses:0 "Cooperative Stores"
 COLDWAR_TUR_1970_chp_coop_warehouses_desc:0 "Producers need facilities that preserve and prepare their output before it reaches the market. Cooperative processing can keep more value in the hands of those who produce it."
 COLDWAR_TUR_1970_chp_ecevit_platform:0 "A Democratic Left"
 COLDWAR_TUR_1970_chp_ecevit_platform_desc:0 "Political democracy must reach the places where people work and produce. Bülent Ecevit's democratic left asks workers, farmers and citizens to shape the Republic's economic future."
 COLDWAR_TUR_1970_chp_energy_enterprise:0 "Energy Equipment"
 COLDWAR_TUR_1970_chp_energy_enterprise_desc:0 "Local firms can make and repair more of the equipment needed by the energy sector. A domestic workshop will deepen the industrial base that supports the national plan."
 COLDWAR_TUR_1970_chp_energy_grid:0 "Regional Works Roads"
 COLDWAR_TUR_1970_chp_energy_grid_desc:0 "Regional works need reliable transport for equipment, staff and maintenance. Public road connections will support construction and productive activity around Adana, while improving access to the districts that depend on these investments."
 COLDWAR_TUR_1970_chp_energy_parts:0 "Industrial Components"
 COLDWAR_TUR_1970_chp_energy_parts_desc:0 "Power equipment depends on a dependable supply of parts and skilled labour. Applied industrial research can help Turkish producers meet that demand."
 COLDWAR_TUR_1970_chp_energy_plan:0 "Power for Production"
 COLDWAR_TUR_1970_chp_energy_plan_desc:0 "Factories, farms and households depend on reliable power. A development plan must decide where scarce capital can do the most to relieve shortages."
 COLDWAR_TUR_1970_chp_energy_research:0 "Power Engineering"
 COLDWAR_TUR_1970_chp_energy_research_desc:0 "Turkey needs engineers able to maintain and improve its energy equipment. Technical training will make public investment less dependent on outside expertise."
 COLDWAR_TUR_1970_chp_enterprise_research:0 "Public Research Links"
 COLDWAR_TUR_1970_chp_enterprise_research_desc:0 "Public enterprises and technical institutes can work together on production problems. Their engineers need the time and equipment to adapt methods to Turkish conditions."
 COLDWAR_TUR_1970_chp_equal_citizens:0 "Equal Citizenship"
 COLDWAR_TUR_1970_chp_equal_citizens_desc:0 "The Republic must command the loyalty of all its citizens through equal rights and public institutions that treat them fairly. Political freedom and social justice belong together."
 COLDWAR_TUR_1970_chp_export_coops:0 "Cooperative Exports"
 COLDWAR_TUR_1970_chp_export_coops_desc:0 "Producer cooperatives need reliable contacts and market information if they are to sell beyond their home districts. A shared commercial service can help them reach buyers at home and abroad."
 COLDWAR_TUR_1970_chp_factory_training:0 "Factory Skills"
 COLDWAR_TUR_1970_chp_factory_training_desc:0 "Machinery is useful only when workers can operate and maintain it. Industrial training will connect public investment to the skill of the people who use it."
 COLDWAR_TUR_1970_chp_farm_equipment:0 "Farm Machine Pools"
 COLDWAR_TUR_1970_chp_farm_equipment_desc:0 "Cooperative capital cannot meet every demand at once. A shared machinery workshop can serve holdings that cannot support a tractor or repair shop of their own."
 COLDWAR_TUR_1970_chp_farm_mechanics:0 "Farm Mechanics"
 COLDWAR_TUR_1970_chp_farm_mechanics_desc:0 "Farmers need mechanics able to keep shared machinery working throughout the season. Practical training will make cooperative equipment more useful to the communities it serves."
 COLDWAR_TUR_1970_chp_farm_purchasing:0 "Cooperative Buying"
 COLDWAR_TUR_1970_chp_farm_purchasing_desc:0 "Small producers pay too much when each family must purchase equipment alone. Cooperative offices can organise orders and make supplies easier to obtain."
 COLDWAR_TUR_1970_chp_farm_water:0 "Water for Producers"
 COLDWAR_TUR_1970_chp_farm_water_desc:0 "Reliable water can give small producers a more secure harvest. Public works and cooperative access can spread the benefits beyond the largest holdings."
 COLDWAR_TUR_1970_chp_health_services:0 "Public Health Offices"
 COLDWAR_TUR_1970_chp_health_services_desc:0 "Health protection must reach families who cannot depend on private care. Public service offices can support a more reliable system of preventive and local treatment."
 COLDWAR_TUR_1970_chp_health_training:0 "Health Service Skills"
 COLDWAR_TUR_1970_chp_health_training_desc:0 "Public health services need staff able to use their resources well. Professional training will support more efficient administration and care, with the education budget carrying the cost of maintaining these skills."
 COLDWAR_TUR_1970_chp_industrial_compact:0 "Industrial Social Pact"
 COLDWAR_TUR_1970_chp_industrial_compact_desc:0 "Social democracy must sustain the production on which its commitments depend. Research and industrial cooperation will support a more productive economy, with technical education taking a larger share of expenditure."
 COLDWAR_TUR_1970_chp_inonu_council:0 "The Social Republic"
 COLDWAR_TUR_1970_chp_inonu_council_desc:0 "Parliamentary democracy must give workers and farmers a fair share in national development. Under İsmet İnönü, the party can bring social reform into the work of the Republic."
 COLDWAR_TUR_1970_chp_land_skills:0 "Skills for Farmers"
 COLDWAR_TUR_1970_chp_land_skills_desc:0 "New equipment and irrigation need practical knowledge to deliver better harvests. Agricultural training will help cultivators make productive use of their investment."
 COLDWAR_TUR_1970_chp_market_routes:0 "Routes for Producers"
 COLDWAR_TUR_1970_chp_market_routes_desc:0 "A stronger marketing association needs dependable connections to the farmers and customers it serves. Transport works can make cooperative trade more effective."
 COLDWAR_TUR_1970_chp_municipal_supply:0 "Municipal Services"
 COLDWAR_TUR_1970_chp_municipal_supply_desc:0 "A city administration must be able to coordinate services and respond to neighbourhood needs. Local offices and trained staff can bring decisions closer to residents."
 COLDWAR_TUR_1970_chp_municipal_works:0 "Municipal Works"
 COLDWAR_TUR_1970_chp_municipal_works_desc:0 "Growing towns need transport and basic services that match the pace of urban life. Public works can give local administrations a foundation on which to serve their communities."
 COLDWAR_TUR_1970_chp_national_technology:0 "Independent Industry"
 COLDWAR_TUR_1970_chp_national_technology_desc:0 "Turkey needs technical knowledge from abroad without allowing foreign conditions to dictate national development. Training and domestic research can strengthen our ability to choose the terms on which industry grows."
 COLDWAR_TUR_1970_chp_people_sector:0 "The People's Sector"
 COLDWAR_TUR_1970_chp_people_sector_desc:0 "Cooperatives and associations of working people can invest alongside public and private enterprise. Their savings should support production and give ordinary citizens a greater stake in development."
 COLDWAR_TUR_1970_chp_people_workshops:0 "Workers' Workshops"
 COLDWAR_TUR_1970_chp_people_workshops_desc:0 "Working people's savings can help build enterprises that serve local communities. Productive workshops give those associations a concrete role in the country's development."
 COLDWAR_TUR_1970_chp_producer_markets:0 "Producer Markets"
 COLDWAR_TUR_1970_chp_producer_markets_desc:0 "Cooperative capital cannot meet every demand at once. A producer marketing service can strengthen small farmers when they bring their harvests to buyers."
 COLDWAR_TUR_1970_chp_public_machinery:0 "Machine-Tool Works"
 COLDWAR_TUR_1970_chp_public_machinery_desc:0 "Public industry needs the ability to make the machinery on which future factories depend. Investment in productive workshops can give the national plan a stronger industrial base."
 COLDWAR_TUR_1970_chp_public_services:0 "Public Services First"
 COLDWAR_TUR_1970_chp_public_services_desc:0 "The strongest claim on public money comes from citizens whose services have fallen behind. A renewed programme will place social provision first, with a lasting budget to make the promise credible."
 COLDWAR_TUR_1970_chp_rail_depots:0 "Regional Depots"
 COLDWAR_TUR_1970_chp_rail_depots_desc:0 "Cooperative exports depend on storage and reliable routes to their customers. Regional transport works will connect producers to the wider economy."
 COLDWAR_TUR_1970_chp_remittance_funds:0 "Workers Abroad"
 COLDWAR_TUR_1970_chp_remittance_funds_desc:0 "Turkish workers abroad send savings home to support their families and communities. Cooperative investment can give those savings a productive use in the national economy."
 COLDWAR_TUR_1970_chp_reunion:0 "The Republic's Party"
 COLDWAR_TUR_1970_chp_reunion_desc:0 "The Republican People’s Party returns to public life with a responsibility to defend a democratic, secular and socially just republic. Its renewed organisation must bring citizens into the work of national development."
 COLDWAR_TUR_1970_chp_rural_clinics:0 "Care Beyond Cities"
 COLDWAR_TUR_1970_chp_rural_clinics_desc:0 "People outside the largest cities need services within practical reach. Provincial health administration and trained staff can bring public care closer to them."
 COLDWAR_TUR_1970_chp_village_health:0 "Rural Health Teams"
 COLDWAR_TUR_1970_chp_village_health_desc:0 "Health staff need dependable premises and connections to the villages they serve. Local service centres can help carry preventive care into the countryside."
 COLDWAR_TUR_1970_chp_village_services:0 "Village Service Hubs"
 COLDWAR_TUR_1970_chp_village_services_desc:0 "The village centre can bring administration and public services within reach of surrounding settlements. Families should be able to use those services while keeping their homes and communities."
 COLDWAR_TUR_1970_chp_village_teachers:0 "Teachers for Villages"
 COLDWAR_TUR_1970_chp_village_teachers_desc:0 "Village children need teachers and practical instruction as well as roads to school. Training and support for provincial staff can bring education closer to rural families."
 COLDWAR_TUR_1970_chp_village_workshops:0 "Village Workshops"
 COLDWAR_TUR_1970_chp_village_workshops_desc:0 "Farm machinery requires repair close to the people who use it. A workshop in a village centre can create local work and support neighbouring cooperatives."
 COLDWAR_TUR_1970_chp_womens_education:0 "Education for Women"
 COLDWAR_TUR_1970_chp_womens_education_desc:0 "Women must be able to obtain the education and skills needed to participate fully in public and economic life. Wider access strengthens families, communities and the Republic."
 COLDWAR_TUR_1970_chp_worker_machines:0 "Savings for Machinery"
 COLDWAR_TUR_1970_chp_worker_machines_desc:0 "Workers' associations can put savings into machinery and productive enterprises at home. Turkish engineers and workers will need the skills to make that investment last."
 COLDWAR_TUR_1970_chp_workplace_councils:0 "A Voice at Work"
 COLDWAR_TUR_1970_chp_workplace_councils_desc:0 "Workers know the practical problems of the enterprises they keep running. Their participation in management can support more responsive public industry and give industrial democracy a daily meaning."
 COLDWAR_TUR_1970_chpr_investment_growth:0 "Industrial Investment"
 COLDWAR_TUR_1970_chpr_investment_growth_desc:0 "Social democracy must build prosperity as well as share it. New industrial investment can create productive employment and give the Republic a stronger economic base."
 COLDWAR_TUR_1970_chpr_local_authorities:0 "Local Growth Powers"
 COLDWAR_TUR_1970_chpr_local_authorities_desc:0 "Communities know the needs of their own districts. Strong local authorities with reliable resources can connect public services and productive investment to the places that need them."
 COLDWAR_TUR_1970_chpr_public_employees:0 "Civil Servant Rights"
 COLDWAR_TUR_1970_chpr_public_employees_desc:0 "Public servants should have a respected voice in the institutions they sustain. Better representation and secure working conditions can strengthen the quality of public service."
 COLDWAR_TUR_1970_chpr_teachers:0 "Teachers in Public Life"
 COLDWAR_TUR_1970_chpr_teachers_desc:0 "A modern republic depends on teachers who have the training, standing and resources to serve their communities. Investment in public education can widen opportunity and strengthen the skills on which national development depends."
 COLDWAR_TUR_1970_civic_equality:0 "Equal Citizenship"
 COLDWAR_TUR_1970_civic_equality_desc:0 "Kurdish citizens should have equal access to schools, courts, and public service. Addressing regional grievances through civilian administration can strengthen the republic, though centralist officials will resist a wider recognition of local identity."
 COLDWAR_TUR_1970_civil_cabinet:0 "A Civilian Council Cabinet"
 COLDWAR_TUR_1970_civil_cabinet_desc:0 "Civilian ministers should manage the daily business of government while the National Security Council advises on strategic questions. Administrative continuity can protect public services, though parties surrender some freedom to set priorities."
 COLDWAR_TUR_1970_civil_service_statute:0 "A Career Civil Service"
 COLDWAR_TUR_1970_civil_service_statute_desc:0 "The Republic needs officials whose careers survive a change of ministers. Competitive entry, secure tenure and common training can give elected governments a capable administration without turning every appointment into a party favour."
 COLDWAR_TUR_1970_civilian_ministry:0 "Civilian Defence Staff"
 COLDWAR_TUR_1970_civilian_ministry_desc:0 "The defence ministry needs civilian officials able to question procurement, personnel and strategic priorities on equal terms with the commanders. Expanding its professional staff will strengthen cabinet authority without pretending that a civilian minister alone can end military influence."
 COLDWAR_TUR_1970_coalition_bargain:0 "Parliamentary Terms"
 COLDWAR_TUR_1970_coalition_bargain_desc:0 "A place at the cabinet table is useful only if it advances our programme. Clear coalition terms can secure investment and public services, while requiring compromises with partners who do not share all our religious and social ambitions."
 COLDWAR_TUR_1970_collective_bargaining:0 "Collective Bargaining"
 COLDWAR_TUR_1970_collective_bargaining_desc:0 "Collective bargaining gives organised workers a stronger voice in wages and working conditions. A social republic must make these rights meaningful while supporting productive employment."
 COLDWAR_TUR_1970_command:0 "Direct Military Rule"
 COLDWAR_TUR_1970_command_desc:0 "The general staff can take direct responsibility for the state and claim to restore order. Military rule promises unity of command, but sidelines parliament and places public administration under permanent political pressure."
 COLDWAR_TUR_1970_command_ministries:0 "Reorganise the Ministries"
 COLDWAR_TUR_1970_command_ministries_desc:0 "Military inspectors can confront patronage across the ministries and centralise control of public administration. The reorganisation promises discipline, but dismissals and overlapping authority may interrupt civilian services."
 COLDWAR_TUR_1970_command_planning:0 "The Command State"
 COLDWAR_TUR_1970_command_planning_desc:0 "Use the general staff's command structure to direct industrial investment around Konya. Central planning can concentrate resources on strategic production, but military administration leaves less room for civilian priorities and local initiative."
 COLDWAR_TUR_1970_competitive_lira:0 "A Competitive Exchange Rate"
 COLDWAR_TUR_1970_competitive_lira_desc:0 "An overvalued lira makes Turkish exports costly and imported goods attractive. Restore competitiveness through exchange-rate adjustment, while preparing households and firms for higher prices on imported food, fuel, and equipment."
 COLDWAR_TUR_1970_competitive_state:0 "Foundations for Firms"
 COLDWAR_TUR_1970_competitive_state_desc:0 "An open economy still needs public investment. The state will concentrate on transport, power and skills, leaving more commercial decisions to enterprises that must answer for their own results."
 COLDWAR_TUR_1970_constitutional_consolidation:0 "Constitutional Accord"
 COLDWAR_TUR_1970_constitutional_consolidation_desc:0 "Institutions endure when rival governments accept the limits they impose. The ministries, courts and services must now defend an agreed constitutional order even when an election brings their opponents to office."
 COLDWAR_TUR_1970_consular_network:0 "Regional Consular Network"
 COLDWAR_TUR_1970_consular_network_desc:0 "Support Turkish trade and citizens abroad with a wider professional consular network. More capable offices can protect families and assist firms, though diplomatic reach requires trained staff and a continuing budget."
 COLDWAR_TUR_1970_convertibility:0 "Lira Convertibility"
 COLDWAR_TUR_1970_convertibility_desc:0 "Banks and commercial firms are preparing for a more open lira regime. Clear rules can support international trade, while domestic producers face stronger competition from abroad."
 COLDWAR_TUR_1970_council:0 "Council Supervision"
 COLDWAR_TUR_1970_council_desc:0 "Give the National Security Council a stronger hand in reviewing national policy. The arrangement reassures senior officers and preserves elected ministers, though civilian decisions now require another layer of consultation."
 COLDWAR_TUR_1970_council_procurement:0 "Council Procurement Board"
 COLDWAR_TUR_1970_council_procurement_desc:0 "Bring the services into a joint board to compare equipment needs and coordinate orders. Common standards can reduce duplication across the armed forces, while committee review slows decisions and adds administrative expense."
 COLDWAR_TUR_1970_council_revision:0 "The Council Mandate"
 COLDWAR_TUR_1970_council_revision_desc:0 "The council can advise the cabinet without standing above it. A revised mandate must settle who decides, who advises and who answers to Parliament. The government will need both public legitimacy and sufficient confidence within the services to make that settlement endure."
 COLDWAR_TUR_1970_crete_claim:0 "A Claim on Crete"
 COLDWAR_TUR_1970_crete_claim_desc:0 "A campaign for Crete would carry Turkish ambitions into the heart of the eastern Mediterranean. Its harbours offer a formidable strategic prize, but taking and holding the island would demand a far larger commitment than defending the original landings."
 COLDWAR_TUR_1970_d8_ban:0 "Bangladesh Partnership"
 COLDWAR_TUR_1970_d8_ban_desc:0 "A development partnership with Bangladesh can turn common ambitions into practical contacts between producers and technical institutions. Both governments will commit resources to the programme and sign a charter for a common economic organisation."
 COLDWAR_TUR_1970_d8_egy:0 "Egypt Partnership"
 COLDWAR_TUR_1970_d8_egy_desc:0 "A development partnership with Egypt can turn common ambitions into practical contacts between producers and technical institutions. Both governments will commit resources to the programme and sign a charter for a common economic organisation."
 COLDWAR_TUR_1970_d8_farms:0 "Agricultural Cooperation"
 COLDWAR_TUR_1970_d8_farms_desc:0 "Developing economies can exchange useful experience in seed, machinery and farm services. A common technical programme will support production while requiring a permanent contribution of trained staff and public funds."
 COLDWAR_TUR_1970_d8_ind:0 "Indonesia Partnership"
 COLDWAR_TUR_1970_d8_ind_desc:0 "A development partnership with Indonesia can turn common ambitions into practical contacts between producers and technical institutions. Both governments will commit resources to the programme and sign a charter for a common economic organisation."
 COLDWAR_TUR_1970_d8_may:0 "Malaysia Partnership"
 COLDWAR_TUR_1970_d8_may_desc:0 "A development partnership with Malaysia can turn common ambitions into practical contacts between producers and technical institutions. Both governments will commit resources to the programme and sign a charter for a common economic organisation."
 COLDWAR_TUR_1970_d8_nig:0 "Nigeria Partnership"
 COLDWAR_TUR_1970_d8_nig_desc:0 "A development partnership with Nigeria can turn common ambitions into practical contacts between producers and technical institutions. Both governments will commit resources to the programme and sign a charter for a common economic organisation."
 COLDWAR_TUR_1970_d8_pak:0 "Pakistan Partnership"
 COLDWAR_TUR_1970_d8_pak_desc:0 "A development partnership with Pakistan can turn common ambitions into practical contacts between producers and technical institutions. Both governments will commit resources to the programme and sign a charter for a common economic organisation."
 COLDWAR_TUR_1970_d8_per:0 "Iran Partnership"
 COLDWAR_TUR_1970_d8_per_desc:0 "A development partnership with Iran can turn common ambitions into practical contacts between producers and technical institutions. Both governments will commit resources to the programme and sign a charter for a common economic organisation."
 COLDWAR_TUR_1970_d8_technical:0 "Technical Cooperation"
 COLDWAR_TUR_1970_d8_technical_desc:0 "Engineers and technical institutes can gain more from dependable cooperation than from occasional ceremonial visits. Funded research exchanges will give the members a practical return on their new organisation."
 COLDWAR_TUR_1970_d8_trade:0 "Trade and Production"
 COLDWAR_TUR_1970_d8_trade_desc:0 "Commercial contacts should bring producers dependable customers rather than an endless list of intentions. Coordinated standards and business services can widen trade while reducing the public return from some commercial concessions."
 COLDWAR_TUR_1970_defence_committee:0 "Defence Committee"
 COLDWAR_TUR_1970_defence_committee_desc:0 "Parliament must be able to examine force requirements without treating every disagreement as a challenge to national security. A permanent committee with trained staff can question the budget and sustain equipment programmes across changes of cabinet."
 COLDWAR_TUR_1970_development_conference:0 "A Development Conference"
 COLDWAR_TUR_1970_development_conference_desc:0 "Large developing economies share a need for productive investment, practical technology and wider markets. Ankara can bring them to a conference on economic cooperation without asking them to surrender their own institutions or foreign policies."
 COLDWAR_TUR_1970_development_majority:0 "Majority for Growth"
 COLDWAR_TUR_1970_development_majority_desc:0 "The Justice Party looks to public works and private enterprise to carry development into the provinces. The government must reconcile the demands of farmers, contractors and industry with the credit, skills and foreign exchange at its disposal."
 COLDWAR_TUR_1970_directed_credit:0 "Directed Development Credit"
 COLDWAR_TUR_1970_directed_credit_desc:0 "Public credit can be directed towards machinery, workshops and productive orders. Conventional lending offers a familiar instrument, but the state must accept the cost of guarantees and the danger of favouring well-connected borrowers."
 COLDWAR_TUR_1970_diverse_markets:0 "Diverse Export Markets"
 COLDWAR_TUR_1970_diverse_markets_desc:0 "Turkish manufacturers need customers beyond established markets. Export finance, trade missions, and quality certification can widen commercial ties and strengthen foreign earnings, provided firms adapt to different buyers."
 COLDWAR_TUR_1970_dl_education:0 "Democratic Education"
 COLDWAR_TUR_1970_dl_education_desc:0 "Education must give citizens the means to question authority as well as the skills to earn a living. Broader technical and scientific teaching will require teachers, institutions and a public budget that endures beyond an election."
 COLDWAR_TUR_1970_dl_exports:0 "Local Goods for Export"
 COLDWAR_TUR_1970_dl_exports_desc:0 "Exports can earn the machinery and inputs needed for development, but the home economy should not remain dependent on every imported component. Technical investment will strengthen firms that can serve both markets."
 COLDWAR_TUR_1970_dl_participation:0 "Popular Participation"
 COLDWAR_TUR_1970_dl_participation_desc:0 "A democratic left must organise around citizens, producers and working communities. Local participation can turn national development into a practical concern for ordinary households."
 COLDWAR_TUR_1970_dl_producer_funds:0 "Producer Investment"
 COLDWAR_TUR_1970_dl_producer_funds_desc:0 "Cooperating farmers can pool a share of their growing incomes in producer-managed investment. Their savings should serve rural production and the security of the communities that created them."
 COLDWAR_TUR_1970_dl_producers:0 "Workers and Farmers"
 COLDWAR_TUR_1970_dl_producers_desc:0 "Workers and producers need a political voice rooted in their own experience. Democratic participation and productive enterprise can broaden opportunity without surrendering national independence."
 COLDWAR_TUR_1970_dl_services:0 "Household Services"
 COLDWAR_TUR_1970_dl_services_desc:0 "Health, schooling and dependable local administration give households the security to take part in economic change. Expanding access will strengthen public confidence while adding lasting obligations to the budget."
 COLDWAR_TUR_1970_dl_settlement:0 "Democratic Left Pact"
 COLDWAR_TUR_1970_dl_settlement_desc:0 "A durable democratic left must join productive investment to the independence of citizens and their associations. The government will consolidate a programme in which participation brings both a voice in decisions and responsibility for their results."
 COLDWAR_TUR_1970_dl_villages:0 "Village Investment"
 COLDWAR_TUR_1970_dl_villages_desc:0 "Village centres can bring schools, clinics and productive work within reach of neighbouring settlements. Investment should strengthen the villages around them and leave families free to remain in their homes."
 COLDWAR_TUR_1970_dl_worker_funds:0 "Worker Investment"
 COLDWAR_TUR_1970_dl_worker_funds_desc:0 "Workers should have a share in investment as well as wages. Worker-managed funds can direct part of enterprise earnings toward productive assets and greater security for working families."
 COLDWAR_TUR_1970_dl_workplaces:0 "Workplace Investment"
 COLDWAR_TUR_1970_dl_workplaces_desc:0 "Investment funds need real workshops in which their members can work and exercise their stake. A new industrial project will combine public finance with workplace participation and a responsibility to keep production competitive."
 COLDWAR_TUR_1970_domestic_inputs:0 "Domestic Industrial Inputs"
 COLDWAR_TUR_1970_domestic_inputs_desc:0 "Replace selected imported industrial inputs through domestic workshops and negotiated supply contracts. Local capacity eases pressure on foreign exchange, but public allocation and technical supervision remain necessary."
 COLDWAR_TUR_1970_dsp_coop_services:0 "Cooperative Services"
 COLDWAR_TUR_1970_dsp_coop_services_desc:0 "Producer associations need accessible services and good information to manage their own affairs. Local offices can help members reach markets while keeping decisions close to them."
 COLDWAR_TUR_1970_dsp_cooperative_processing:0 "Village Processing"
 COLDWAR_TUR_1970_dsp_cooperative_processing_desc:0 "Producer associations can invest in processing as well as farming. Local industry will give village families a greater share of the value created by their crops and strengthen the rural economy."
 COLDWAR_TUR_1970_dsp_industrial_education:0 "Democratic Skills"
 COLDWAR_TUR_1970_dsp_industrial_education_desc:0 "A democratic left must be able to sustain both productive work and independent public institutions. Technical teaching and industrial research will strengthen that foundation, with education claiming a larger share of the budget."
 COLDWAR_TUR_1970_dsp_local_health:0 "Health Near Home"
 COLDWAR_TUR_1970_dsp_local_health_desc:0 "Families need health services within reach of their own communities. Local administration can support the staff and organisation needed to provide them."
 COLDWAR_TUR_1970_dsp_local_services:0 "Local Services"
 COLDWAR_TUR_1970_dsp_local_services_desc:0 "Participation must leave households with better services and a dependable local authority. A funded programme will connect the movement's provincial work to national social commitments."
 COLDWAR_TUR_1970_dsp_village_roads:0 "Village Connections"
 COLDWAR_TUR_1970_dsp_village_roads_desc:0 "Surrounding villages need dependable connections to their shared centre. Roads can make local employment and public services more accessible throughout the district."
 COLDWAR_TUR_1970_dsp_village_schools:0 "Village Learning"
 COLDWAR_TUR_1970_dsp_village_schools_desc:0 "Village centres can bring education to neighbouring communities without requiring families to leave their homes. Teachers and practical courses are essential to that promise."
 COLDWAR_TUR_1970_dsp_worker_enterprise:0 "Workers as Investors"
 COLDWAR_TUR_1970_dsp_worker_enterprise_desc:0 "Workers should share in the success of the enterprises they sustain. Investment in equipment and skills can strengthen production while giving working people a greater stake in its future."
 COLDWAR_TUR_1970_dsp_worker_skills:0 "Workers' Skills"
 COLDWAR_TUR_1970_dsp_worker_skills_desc:0 "Working people need the knowledge to take part in productive investment as well as the work of a factory. Technical education can give their associations a stronger foundation."
 COLDWAR_TUR_1970_dsp_worker_supply:0 "Worker Enterprises"
 COLDWAR_TUR_1970_dsp_worker_supply_desc:0 "Workers' investment can support suppliers and productive workshops. New facilities give their savings a practical role in the country's development."
 COLDWAR_TUR_1970_dyp_accounts:0 "Procurement Accounts"
 COLDWAR_TUR_1970_dyp_accounts_desc:0 "Development contracts must be judged by what Turkish firms can deliver. Engineering assessments and trained procurement staff will improve the selection of industrial projects and give public accounts a firmer basis than political assurances."
 COLDWAR_TUR_1970_dyp_artisan_training:0 "Artisan Training"
 COLDWAR_TUR_1970_dyp_artisan_training_desc:0 "Small firms depend on skilled workers, technical advice and knowledge of their customers. Training can help artisans and manufacturers build reliable provincial businesses."
 COLDWAR_TUR_1970_dyp_assembly_rights:0 "Parliamentary Rights"
 COLDWAR_TUR_1970_dyp_assembly_rights_desc:0 "A representative parliament depends on open political competition and reliable civil rights. The government must build support across the Assembly for reforms that command public confidence."
 COLDWAR_TUR_1970_dyp_clinic_access:0 "Rural Health Support"
 COLDWAR_TUR_1970_dyp_clinic_access_desc:0 "Families in rural districts need public support for reaching basic health services. A funded assistance programme will commit the government to provincial staff, advice and travel needs, with a continuing claim on the health budget."
 COLDWAR_TUR_1970_dyp_council_tenders:0 "Council Tender Rules"
 COLDWAR_TUR_1970_dyp_council_tenders_desc:0 "Municipal councils can establish public tender rules for local works. The government must spend political capital defending competitive contracting and the independence of local scrutiny."
 COLDWAR_TUR_1970_dyp_enterprise:0 "Guarantee Enterprise"
 COLDWAR_TUR_1970_dyp_enterprise_desc:0 "Small manufacturers and artisans need capital, technical knowledge and access to customers. Support for provincial industry can widen employment, while public resources remain exposed to commercial failure."
 COLDWAR_TUR_1970_dyp_farm_maintenance:0 "Water Associations"
 COLDWAR_TUR_1970_dyp_farm_maintenance_desc:0 "Irrigation schemes need users who can organise maintenance and recover the cost of upkeep. Local associations can help public investment deliver dependable water to family farms."
 COLDWAR_TUR_1970_dyp_favoured_works:0 "Favoured Local Works"
 COLDWAR_TUR_1970_dyp_favoured_works_desc:0 "Local authorities can place contracts with preferred firms and bring projects forward quickly. The resulting access to public funds risks making personal connections more valuable than fair competition."
 COLDWAR_TUR_1970_dyp_health_staff:0 "Train Health Workers"
 COLDWAR_TUR_1970_dyp_health_staff_desc:0 "Provincial health programmes need dependable staff funding and practical support. A sustained public commitment will answer local expectations, while requiring the Treasury to carry its continuing cost."
 COLDWAR_TUR_1970_dyp_investment_links:0 "Industrial Town Roads"
 COLDWAR_TUR_1970_dyp_investment_links_desc:0 "Industry outside the largest cities needs dependable access to suppliers and customers. Roads and local services will help provincial investment become a lasting source of employment."
 COLDWAR_TUR_1970_dyp_local_authority:0 "Municipal Authority"
 COLDWAR_TUR_1970_dyp_local_authority_desc:0 "Municipal councils need the means to meet local obligations and answer to residents. A limited institutional reform budget can strengthen local administration, while leaving parliamentary staffing for another time."
 COLDWAR_TUR_1970_dyp_local_housing:0 "Serviced Housing Land"
 COLDWAR_TUR_1970_dyp_local_housing_desc:0 "Households need affordable sites connected to transport and utilities. Local authorities can prepare land for building while coordinating the services needed by new communities."
 COLDWAR_TUR_1970_dyp_local_professionals:0 "Local Professionals"
 COLDWAR_TUR_1970_dyp_local_professionals_desc:0 "Engineers, accountants and administrators help a municipality turn local decisions into dependable services. Training can give local government capacity beyond the next construction project."
 COLDWAR_TUR_1970_dyp_local_services:0 "Provincial Housing"
 COLDWAR_TUR_1970_dyp_local_services_desc:0 "Rapid urban growth is straining housing and local services. Investment in roads and utilities can help municipalities serve expanding neighbourhoods, with a continuing claim on public funds."
 COLDWAR_TUR_1970_dyp_market_links:0 "Routes to Customers"
 COLDWAR_TUR_1970_dyp_market_links_desc:0 "Provincial producers can serve larger markets when transport connects their workshops and farms to commercial centres. Local road investment can bring more customers within reach."
 COLDWAR_TUR_1970_dyp_market_roads:0 "Roads to Markets"
 COLDWAR_TUR_1970_dyp_market_roads_desc:0 "A national commercial opening must reach the provincial producer. Road improvements can connect workshops and farms to larger markets, while requiring capital that cannot also be spent on direct credit guarantees."
 COLDWAR_TUR_1970_dyp_parliament_rules:0 "Assembly Scrutiny"
 COLDWAR_TUR_1970_dyp_parliament_rules_desc:0 "Parliament needs the staff and time to examine public decisions. Strengthening its scrutiny places elected representatives at the centre of a limited institutional reform budget."
 COLDWAR_TUR_1970_dyp_producer_markets:0 "Producers and Buyers"
 COLDWAR_TUR_1970_dyp_producer_markets_desc:0 "Farmers and workshops need dependable channels to the larger towns. Better marketing and distribution can raise returns without requiring every producer to become a large enterprise."
 COLDWAR_TUR_1970_dyp_public_accounts:0 "Public Accounts Office"
 COLDWAR_TUR_1970_dyp_public_accounts_desc:0 "Public contracts and accounts deserve examination by qualified officials answerable to elected representatives. Better professional training will support that oversight."
 COLDWAR_TUR_1970_dyp_regional_schools:0 "Skills for the Provinces"
 COLDWAR_TUR_1970_dyp_regional_schools_desc:0 "Provincial enterprises need qualified workers and local authorities need professional staff. Technical schools can support both, with education costs continuing after the buildings open."
 COLDWAR_TUR_1970_dyp_rural_banks:0 "Rural Loan Backing"
 COLDWAR_TUR_1970_dyp_rural_banks_desc:0 "Farm families need water, equipment and access to capital if provincial development is to reach the countryside. Credit and local services can support productive holdings, while the public banks must carry the risks of lending."
 COLDWAR_TUR_1970_dyp_rural_water:0 "Rural Water Works"
 COLDWAR_TUR_1970_dyp_rural_water_desc:0 "Farmers need reliable water and practical support to improve their land. A dedicated rural works allocation can strengthen production, though the same funds cannot also finance an immediate urban clinic expansion."
 COLDWAR_TUR_1970_dyp_small_business:0 "Provincial Firm Loans"
 COLDWAR_TUR_1970_dyp_small_business_desc:0 "Artisans and small manufacturers need capital, materials and help finding buyers. Provincial business credit can support their investment, although the state must finance its share of the risk."
 COLDWAR_TUR_1970_dyp_social_insurance:0 "Social Insurance"
 COLDWAR_TUR_1970_dyp_social_insurance_desc:0 "Social security should reach people whose work leaves them exposed to illness and old age. Wider coverage can protect households if the government accepts the recurring expense."
 COLDWAR_TUR_1970_dyp_social_outreach:0 "Security in Old Age"
 COLDWAR_TUR_1970_dyp_social_outreach_desc:0 "Older citizens need dependable protection when earnings no longer cover their needs. Wider access to assistance can strengthen family security while creating a continuing budget obligation."
 COLDWAR_TUR_1970_dyp_social_security:0 "Family Social Security"
 COLDWAR_TUR_1970_dyp_social_security_desc:0 "Every household needs security against illness, old age and the loss of work. Wider social protection can extend that assurance, but a broader commitment requires dependable public resources."
 COLDWAR_TUR_1970_dyp_tender_auditors:0 "Municipal Auditors"
 COLDWAR_TUR_1970_dyp_tender_auditors_desc:0 "Councils need qualified staff who can examine contracts and accounts. Professional auditing gives elected representatives a firmer basis on which to supervise local expenditure."
 COLDWAR_TUR_1970_dyp_town_services:0 "Urban Service Pacts"
 COLDWAR_TUR_1970_dyp_town_services_desc:0 "Municipalities need the resources to serve growing towns and new neighbourhoods. Local contractors and public authorities can extend practical services when they have the means to work together."
 COLDWAR_TUR_1970_dyp_village_markets:0 "Village Market Roads"
 COLDWAR_TUR_1970_dyp_village_markets_desc:0 "Rural producers need routes to buyers as well as water for cultivation. Better local roads will bring farm goods and supplies within reach of the towns."
 COLDWAR_TUR_1970_dyp_water_districts:0 "Water for Towns"
 COLDWAR_TUR_1970_dyp_water_districts_desc:0 "New neighbourhoods need dependable water and roads as towns expand. Municipal investment can bring services closer to residents, but construction and maintenance remain public obligations."
 COLDWAR_TUR_1970_dyp_works_schedules:0 "Local Works Plans"
 COLDWAR_TUR_1970_dyp_works_schedules_desc:0 "Municipal contractors need dependable schedules and local suppliers if their works are to benefit residents. Local administration must follow construction through to delivery."
 COLDWAR_TUR_1970_dyp_workshop_sites:0 "Workshop Sites"
 COLDWAR_TUR_1970_dyp_workshop_sites_desc:0 "Small manufacturers need serviced premises and access to suppliers. Provincial industrial sites can give workshops a stable foundation without directing every commercial decision."
 COLDWAR_TUR_1970_eastern_provincial_works:0 "Eastern Provincial Works"
 COLDWAR_TUR_1970_eastern_provincial_works_desc:0 "The provincial development plans must be carried beyond the main construction sites. Local roads, waterworks and maintained connections will extend their reach to surrounding districts. This programme commits substantial public funds to works suited to the different conditions of the plateau and the southeastern plains."
 COLDWAR_TUR_1970_eastern_roads:0 "Eastern Road Links"
 COLDWAR_TUR_1970_eastern_roads_desc:0 "Reliable roads can connect eastern towns and rural districts with markets, schools, and clinics. A phased provincial works programme opens practical routes for commerce and administration across difficult terrain."
 COLDWAR_TUR_1970_electrical_works:0 "Electrical Equipment"
 COLDWAR_TUR_1970_electrical_works_desc:0 "Motors, switchgear and industrial controls are indispensable to a modern workshop. Investment in electrical equipment will give domestic firms a wider place in the industrial plan, with technical education supporting the new production."
 COLDWAR_TUR_1970_electrification:0 "Farm Equipment and Power"
 COLDWAR_TUR_1970_electrification_desc:0 "Bring power and agricultural machinery to provincial farms and workshops. Pumps, repair services, and maintained equipment can raise production beyond the major projects, provided local communities can operate them."
 COLDWAR_TUR_1970_end_guardianship:0 "Civilian Supremacy"
 COLDWAR_TUR_1970_end_guardianship_desc:0 "A government backed by enduring public institutions can finally challenge the officers' claim to arbitrate the Republic's political life. The services must accept a professional place within the constitutional order. If their confidence has not been won, the final settlement can still break under military resistance."
 COLDWAR_TUR_1970_engineering_priority:0 "Engineering Scholarships"
 COLDWAR_TUR_1970_engineering_priority_desc:0 "The industrial plan requires engineers able to adapt machinery to Turkish conditions. Scholarships and applied teaching will place technical skill first in the next education allocation, while other institutions wait for their expansion."
 COLDWAR_TUR_1970_enterprise_reform:0 "Workers in State Firms"
 COLDWAR_TUR_1970_enterprise_reform_desc:0 "Workers in public enterprises should have a meaningful voice in management and a share in improved productivity. Professional management and modern machinery can make public investment more effective."
 COLDWAR_TUR_1970_enterprise_tax_relief:0 "Profits for Investment"
 COLDWAR_TUR_1970_enterprise_tax_relief_desc:0 "Firms that keep more of their earnings can finance the next workshop and export order. The Treasury must accept a smaller immediate return and judge the policy by the productive investment it actually encourages."
 COLDWAR_TUR_1970_enterprise_turn:0 "An Enterprise Republic"
 COLDWAR_TUR_1970_enterprise_turn_desc:0 "A broad movement of enterprise, social justice, national solidarity and conservative opinion seeks a competitive economy. Public investment must give producers the transport, skills and security to reach wider markets."
 COLDWAR_TUR_1970_enterprise_weekly_tt:0 "Weekly state-enterprise expenditure: §R$[?COLDWAR_TUR_1970_enterprise_weekly|3] billion§! (0.015% of GDP)."
 COLDWAR_TUR_1970_eximbank:0 "Export Credit Bank"
 COLDWAR_TUR_1970_eximbank_desc:0 "Turkish manufacturers need finance and guarantees to compete for overseas contracts. An export-credit institution can support their orders, while the state accepts the cost and the risk of default."
 COLDWAR_TUR_1970_expanded_war:0 "A Wider Aegean Reckoning"
 COLDWAR_TUR_1970_expanded_war_desc:0 "The war has given the government an opportunity to pursue ambitions far beyond the island. A wider claim can rally the demand for victory, but Ankara would be choosing a larger confrontation and a more costly peace."
 COLDWAR_TUR_1970_export_credit:0 "Productive Export Credits"
 COLDWAR_TUR_1970_export_credit_desc:0 "Commit public capital to firms with productive export orders. Credit can support testing, materials, and marketing, but guarantees must be selective and the Treasury must carry the risk of repayment."
 COLDWAR_TUR_1970_export_diversification:0 "Diversify Manufactured Exports"
 COLDWAR_TUR_1970_export_diversification_desc:0 "Broaden manufactured exports beyond a narrow agricultural base. New customers and products can strengthen foreign earnings, while production becomes more exposed to the demands of overseas markets."
 COLDWAR_TUR_1970_export_machinery:0 "Export Machine Credit"
 COLDWAR_TUR_1970_export_machinery_desc:0 "A manufacturer needs machinery before an export order can become a shipment. Credit tied to equipment and market contracts can deepen industrial production, at the cost of scarce capital that could otherwise flow into commerce and financial services."
 COLDWAR_TUR_1970_export_turn:0 "Production for Export"
 COLDWAR_TUR_1970_export_turn_desc:0 "Factories cannot prosper behind a narrow home market forever. Export finance and dependable transport can bring Turkish goods to new customers, but firms must learn to compete on quality and price rather than rely on permanent protection."
 COLDWAR_TUR_1970_fair_procurement:0 "Public Orders, Public Accounts"
 COLDWAR_TUR_1970_fair_procurement_desc:0 "A social programme needs contracts the public can trust. Audited tenders and practical standards will direct orders towards useful production, while strengthening the institutions required to question favoured suppliers."
 COLDWAR_TUR_1970_faith_mobilisation:0 "Mobilise the Faithful"
 COLDWAR_TUR_1970_faith_mobilisation_desc:0 "Our movement draws strength from families and associations that feel excluded from public life. A campaign of moral renewal can turn that loyalty into political influence, while sharpening disagreement with secular institutions and the military command."
 COLDWAR_TUR_1970_financial_opening:0 "A Financial Opening"
 COLDWAR_TUR_1970_financial_opening_desc:0 "Commercial firms seek access to finance and international business. A wider financial sector can attract investment, while exposure to external markets leaves Turkish firms vulnerable to sudden pressure."
 COLDWAR_TUR_1970_fleet_construction:0 "Fleet Construction Orders"
 COLDWAR_TUR_1970_fleet_construction_desc:0 "A sustained order can expand the shipyards and strengthen the Turkish fleet. New construction gives the services greater control over maintenance, but ties up capital that could support civilian industry."
 COLDWAR_TUR_1970_foreign_service:0 "A Professional Foreign Service"
 COLDWAR_TUR_1970_foreign_service_desc:0 "A professional diplomatic corps can defend Turkey's interests across the alliance and neighbouring regions. Skilled officials strengthen commercial negotiations and crisis communication while leaving each government free to make its own decisions."
 COLDWAR_TUR_1970_found_d8:0 "Found the Developing Eight"
 COLDWAR_TUR_1970_found_d8_desc:0 "The conference can become a lasting institution only when every founding government is prepared to sign. A common organisation will give the partners a place to coordinate economic work while leaving national authority in their own hands."
 COLDWAR_TUR_1970_fp_civic_guarantees:0 "Civic Guarantees"
 COLDWAR_TUR_1970_fp_civic_guarantees_desc:0 "A credible return to public life requires clear guarantees about the rights of citizens and the limits of party authority. A parliamentary strategy can widen support, at the price of restraining ambitions that some supporters still regard as essential."
 COLDWAR_TUR_1970_fp_local_organisation:0 "Rebuild Local Organisation"
 COLDWAR_TUR_1970_fp_local_organisation_desc:0 "The movement's local organisation must survive the loss of its former party. A new legal vehicle can reconnect experienced activists with voters, while requiring a fresh charter and institutions that answer for their own conduct."
 COLDWAR_TUR_1970_fp_movement_discipline:0 "Movement Discipline"
 COLDWAR_TUR_1970_fp_movement_discipline_desc:0 "Continuity will require a disciplined organisation able to resist fragmentation. A stronger party apparatus can preserve the movement's voice, while narrowing the room for local initiative and for those who seek a different course."
 COLDWAR_TUR_1970_gap_irrigation:0 "Euphrates-Tigris Irrigation"
 COLDWAR_TUR_1970_gap_irrigation_desc:0 "Irrigation along the Middle Euphrates can make farm output less dependent on uncertain rainfall. Water allocation, village access, and maintenance must be settled carefully if the new system is to serve local producers."
 COLDWAR_TUR_1970_gp_coops:0 "Voluntary Farm Unions"
 COLDWAR_TUR_1970_gp_coops_desc:0 "Families can gain scale without losing their own farms. Voluntary associations will share machinery and marketing facilities, with public assistance directed through accounts that members can inspect and challenge."
 COLDWAR_TUR_1970_gp_costs:0 "Industrial Cost Board"
 COLDWAR_TUR_1970_gp_costs_desc:0 "A mixed economy must know what its factories actually cost. Technical inspection and standard accounts can identify waste in armaments contracts, at the price of another permanent demand for trained inspectors."
 COLDWAR_TUR_1970_gp_exports:0 "Industry for Export"
 COLDWAR_TUR_1970_gp_exports_desc:0 "The national plan must prepare firms to meet customers beyond a protected home market. Technical assistance and testing can improve their products without turning every export order into a permanent state subsidy."
 COLDWAR_TUR_1970_gp_irrigation:0 "Family Farm Irrigation"
 COLDWAR_TUR_1970_gp_irrigation_desc:0 "Improved water supply can give family farms a more dependable harvest. The programme will combine public works with agricultural guidance, allowing households and voluntary associations to decide how best to use the new capacity."
 COLDWAR_TUR_1970_gp_plan:0 "Public and Private"
 COLDWAR_TUR_1970_gp_plan_desc:0 "Planning should direct scarce capital towards useful production without reducing the economy to a single form of ownership. A common investment framework can coordinate public enterprises and private firms while exposing both to closer scrutiny."
 COLDWAR_TUR_1970_gp_private_firms:0 "Private Enterprise"
 COLDWAR_TUR_1970_gp_private_firms_desc:0 "Private firms should compete through production rather than privileged access to ministers. Investment credit can reward expansion and efficiency, with the state accepting a smaller immediate tax return on the earnings retained for growth."
 COLDWAR_TUR_1970_gp_republic:0 "A Reforming Republic"
 COLDWAR_TUR_1970_gp_republic_desc:0 "The Republic needs reform without surrendering its constitutional foundations. Public authority and private enterprise can both serve national development when institutions are strong enough to demand results from each."
 COLDWAR_TUR_1970_gp_seed:0 "Seeds and Fertiliser"
 COLDWAR_TUR_1970_gp_seed_desc:0 "Water alone will not raise yields. Reliable seed, fertiliser and practical instruction can help cultivators make better use of their land, while requiring a sustained technical service rather than an occasional shipment."
 COLDWAR_TUR_1970_gp_senate:0 "Parliamentary Renewal"
 COLDWAR_TUR_1970_gp_senate_desc:0 "Representative institutions lose authority when their rules appear designed to protect office holders. Electoral and parliamentary reform can renew their standing, while leaving the government answerable to a legislature it cannot command by appointment."
 COLDWAR_TUR_1970_gp_state_firms:0 "Renew Public Firms"
 COLDWAR_TUR_1970_gp_state_firms_desc:0 "The state has already invested heavily in its enterprises. New machinery and firmer accounts can recover that investment, but the Treasury must finance the reorganisation before it can demand better performance."
 COLDWAR_TUR_1970_grid_suppliers:0 "Domestic Grid Suppliers"
 COLDWAR_TUR_1970_grid_suppliers_desc:0 "Develop Turkish suppliers for the generation and transmission programme. Domestic orders can build electrical engineering skills and support the national grid, provided firms meet demanding standards for reliability."
 COLDWAR_TUR_1970_heavy_industry:0 "The Heavy Industry Drive"
 COLDWAR_TUR_1970_heavy_industry_desc:0 "Turkey cannot remain a buyer of the machines on which every other industry depends. A sustained heavy-industry programme will concentrate public credit, engineering and production orders behind domestic capacity, with the Treasury carrying a bill that private firms cannot meet alone."
 COLDWAR_TUR_1970_highland_village_works:0 "Highland Village Works"
 COLDWAR_TUR_1970_highland_village_works_desc:0 "Mountain villages need dependable roads as well as promises from Ankara. A sustained programme of local bridges, drainage and maintained approaches will connect producers to provincial centres. Winter and distance will continue to raise the cost of works, but the settlements need no longer face these obstacles without support."
 COLDWAR_TUR_1970_hp_capital_goods:0 "Machines for Industry"
 COLDWAR_TUR_1970_hp_capital_goods_desc:0 "Public enterprises need modern equipment and a clear productive purpose. New industrial techniques can strengthen domestic machinery production and reduce the cost of future investment."
 COLDWAR_TUR_1970_hp_cooperative_markets:0 "Village Markets"
 COLDWAR_TUR_1970_hp_cooperative_markets_desc:0 "Farmers need fair access to markets, timely payment and the means to improve their harvests. Producer associations can bring transport, fertiliser and irrigation within the reach of smaller holdings."
 COLDWAR_TUR_1970_hp_exports:0 "Exporting Local Goods"
 COLDWAR_TUR_1970_hp_exports_desc:0 "Turkish producers need knowledge of foreign markets as well as the equipment to serve them. A common effort in industrial and agricultural marketing can improve export earnings without surrendering domestic capacity."
 COLDWAR_TUR_1970_hp_people_sector:0 "The People's Sector"
 COLDWAR_TUR_1970_hp_people_sector_desc:0 "Cooperatives and joint enterprises can gather the savings of working families and put them to productive use. Supporting producer associations gives small enterprise a stronger place beside public and private industry."
 COLDWAR_TUR_1970_hp_provincial_services:0 "Connect the Provinces"
 COLDWAR_TUR_1970_hp_provincial_services_desc:0 "Regional industry and agriculture cannot prosper without dependable connections to their markets. Public works can bring provincial producers into the national plan and support more balanced development."
 COLDWAR_TUR_1970_hp_public_industry:0 "Public Industry Works"
 COLDWAR_TUR_1970_hp_public_industry_desc:0 "The state must lead investment where heavy industry, energy and transport demand resources beyond the reach of individual firms. A public industrial project can give private workshops a more dependable foundation."
 COLDWAR_TUR_1970_hp_social_security:0 "A People's Economy"
 COLDWAR_TUR_1970_hp_social_security_desc:0 "Public enterprise, private industry and the savings of working people each have a place in national development. A planned mixed economy can direct their resources toward production and a wider measure of social security."
 COLDWAR_TUR_1970_imam_hatip_priority:0 "Imam-Hatip Teachers"
 COLDWAR_TUR_1970_imam_hatip_priority_desc:0 "Religious schools need capable teachers rather than promises of expansion alone. Training and appointments will answer the expectations of conservative families, while making the movement's educational ambitions more contentious within the secular state."
 COLDWAR_TUR_1970_import_arrears:0 "Clear Import Arrears"
 COLDWAR_TUR_1970_import_arrears_desc:0 "Factories wait for essential machinery and inputs as foreign payments tighten. Clear overdue obligations and protect priority imports, restoring production while leaving less public capital for other investments."
 COLDWAR_TUR_1970_import_licences:0 "Capital Import Licences"
 COLDWAR_TUR_1970_import_licences_desc:0 "Foreign currency cannot meet every request for machinery. Direct licences toward productive equipment and essential industrial inputs, supporting investment while requiring firms to compete for scarce imports."
 COLDWAR_TUR_1970_industrial_compacts:0 "Domestic Supply Contracts"
 COLDWAR_TUR_1970_industrial_compacts_desc:0 "Public orders can give Turkish suppliers the confidence to invest beyond a single project. Contracts will reward dependable production, while the state accepts the cost of building suppliers that cannot yet compete on price alone."
 COLDWAR_TUR_1970_industrial_exports:0 "Industrial Export Deals"
 COLDWAR_TUR_1970_industrial_exports_desc:0 "Turkish manufacturers need reliable machinery and skilled workers to meet foreign orders. Standards and technical training can help firms build a market abroad while the country remains dependent on imported equipment."
 COLDWAR_TUR_1970_industrial_guarantees:0 "Industrial Guarantees"
 COLDWAR_TUR_1970_industrial_guarantees_desc:0 "Guarantees should follow productive contracts rather than political promises. A specialist credit service will support firms supplying the industrial plan, while the Treasury remains responsible when a supported project fails."
 COLDWAR_TUR_1970_institutional_accounts:0 "Independent Public Accounts"
 COLDWAR_TUR_1970_institutional_accounts_desc:0 "Banks and public enterprises need clear responsibility for the funds entrusted to them. Separate accounts and firm investment rules will preserve their discretion, even if the Treasury forgoes the convenience of drawing all public balances into one pool."
 COLDWAR_TUR_1970_iraq_pipeline:0 "Iraq-Turkey Oil Transit"
 COLDWAR_TUR_1970_iraq_pipeline_desc:0 "Transit arrangements with Baghdad could carry Iraqi petroleum toward the Mediterranean and support trade between neighbouring states. Turkey gains commercial income and regional influence, but the route requires investment and diplomatic coordination."
 COLDWAR_TUR_1970_joint_schools:0 "Joint Service Schools"
 COLDWAR_TUR_1970_joint_schools_desc:0 "Bring the service schools together around staff work, communications, and operational planning. Shared exercises can improve coordination across the armed forces, provided the services commit instructors and modern facilities."
 COLDWAR_TUR_1970_judicial_tenure:0 "Judicial Independence"
 COLDWAR_TUR_1970_judicial_tenure_desc:0 "Constitutional government requires courts that can judge public authority without waiting for permission. Secure tenure and adequate judicial administration give citizens a stronger remedy, while limiting the freedom of ministers and commanders to settle disputes by pressure."
 COLDWAR_TUR_1970_just_order:0 "A Just Economic Order"
 COLDWAR_TUR_1970_just_order_desc:0 "Production, distribution and public finance must serve a more just order. The government will bring its industrial experience and provincial networks into a broader economic programme, promising productive investment without leaving social obligations to charity alone."
 COLDWAR_TUR_1970_karakaya:0 "Karakaya Preparations"
 COLDWAR_TUR_1970_karakaya_desc:0 "Prepare another hydroelectric development on the Euphrates. Engineering, transmission, and site preparation can add future power capacity, while careful planning must account for villages, agriculture, and public finance."
 COLDWAR_TUR_1970_keban:0 "Keban's First Units"
 COLDWAR_TUR_1970_keban_completion:0 "Complete Keban Capacity"
 COLDWAR_TUR_1970_keban_completion_desc:0 "Complete Keban's remaining generating capacity and extend reliable electricity to the expanding grid. Hydropower can reduce dependence on imported fuel, but transmission, construction, and settlement require sustained public investment."
 COLDWAR_TUR_1970_keban_desc:0 "Keban is a major national undertaking to add dependable hydroelectric power. Bring the first generating units into service and connect them to industry, while coordinating construction, transmission, and the needs of nearby communities."
 COLDWAR_TUR_1970_landing_craft:0 "Landing Craft Works"
 COLDWAR_TUR_1970_landing_craft_desc:0 "Fund landing craft suited to moving troops and supplies between the coast and nearby islands. Reliable lift improves the services' readiness, while specialised vessels add to procurement and maintenance costs."
 COLDWAR_TUR_1970_licensed_supply:0 "Licensed Arms Supply"
 COLDWAR_TUR_1970_licensed_supply_desc:0 "Production under licence can put proven weapons into Turkish service while our factories learn to maintain the designs. Foreign drawings and tooling shorten the road to dependable output, but supplier obligations and imported components leave less freedom for wholly Turkish production."
 COLDWAR_TUR_1970_limited_war:0 "Keep the War Limited"
 COLDWAR_TUR_1970_limited_war_desc:0 "Victory need not become a struggle for every shore of the Aegean. Concentrating the campaign on Cyprus can preserve strength for a negotiated settlement, while requiring the government to restrain those demanding a broader reckoning with Greece."
 COLDWAR_TUR_1970_local_health:0 "Neighbourhood Health"
 COLDWAR_TUR_1970_local_health_desc:0 "Local health services can spare families long journeys and neglected illness. Municipal clinics and reliable provision will extend care, with staff and supplies becoming a permanent public obligation."
 COLDWAR_TUR_1970_local_skills:0 "Skills for Local Industry"
 COLDWAR_TUR_1970_local_skills_desc:0 "Match technical instruction to the needs of provincial factories, farms, and transport networks. Training becomes productive when communities have equipment and workplaces where new skills can be used."
 COLDWAR_TUR_1970_local_workshop_funds:0 "Local Workshop Funds"
 COLDWAR_TUR_1970_local_workshop_funds_desc:0 "Partnership funds should leave visible workshops behind them. Patient investment and practical advice can give smaller producers the means to expand, while returns arrive more slowly than they would in trade and speculation."
 COLDWAR_TUR_1970_machine_tools:0 "Machine Tool Workshops"
 COLDWAR_TUR_1970_machine_tools_desc:0 "Build workshops capable of maintaining industrial machinery and gradually replacing selected imports. Productive independence depends on skilled engineers, modern tools, and sustained investment rather than declarations of self-sufficiency."
 COLDWAR_TUR_1970_machinery_works:0 "Precision Workshops"
 COLDWAR_TUR_1970_machinery_works_desc:0 "Reliable tools require workshops that can hold their tolerances and repair their own equipment. New production facilities and practical research will put this work on a lasting industrial footing."
 COLDWAR_TUR_1970_mam:0 "TUBITAK Marmara Centre"
 COLDWAR_TUR_1970_mam_desc:0 "Expand applied research around the Marmara region and connect TUBITAK with universities and industry. New laboratories can turn scientific work into practical solutions, but require trained staff, equipment, and public funds."
 COLDWAR_TUR_1970_mcp_agricultural_towns:0 "Agricultural Towns"
 COLDWAR_TUR_1970_mcp_agricultural_towns_desc:0 "Farms and village enterprises need shared access to machinery, transport and processing. Agricultural towns will concentrate these services around existing communities and connect rural production to local industry."
 COLDWAR_TUR_1970_mcp_apprentices:0 "Industrial Apprentices"
 COLDWAR_TUR_1970_mcp_apprentices_desc:0 "National production needs trained workers as much as slogans of independence. Apprenticeships linked to domestic factories will improve technical capacity, with public education supporting the firms taking new entrants."
 COLDWAR_TUR_1970_mcp_civic_training:0 "Teachers and Citizens"
 COLDWAR_TUR_1970_mcp_civic_training_desc:0 "A common civic education requires trained teachers as well as new books. The state must fund their preparation while recognising the strain that prescribed teaching places on independent thought."
 COLDWAR_TUR_1970_mcp_family_security:0 "Family Insurance"
 COLDWAR_TUR_1970_mcp_family_security_desc:0 "Workers and artisans should be able to depend on insurance in sickness and old age. Extend the programme through local institutions and provide for its continuing cost."
 COLDWAR_TUR_1970_mcp_farm_machinery:0 "Farm Town Machinery"
 COLDWAR_TUR_1970_mcp_farm_machinery_desc:0 "Local machinery and maintenance can connect more productive farms with regional processing. Training and reliable equipment will make investment in agricultural towns useful."
 COLDWAR_TUR_1970_mcp_foreign_markets:0 "Markets for Producers"
 COLDWAR_TUR_1970_mcp_foreign_markets_desc:0 "Turkish firms need practical knowledge of foreign markets and dependable commercial contacts. Support exporters without neglecting the citizens whose work has built those connections."
 COLDWAR_TUR_1970_mcp_industrial_inputs:0 "Domestic Inputs"
 COLDWAR_TUR_1970_mcp_industrial_inputs_desc:0 "Turkish industry remains vulnerable when its essential materials and equipment must come from abroad. Domestic suppliers will take a larger place in national production through a funded intermediate-goods programme."
 COLDWAR_TUR_1970_mcp_insurance:0 "Artisan and Worker Aid"
 COLDWAR_TUR_1970_mcp_insurance_desc:0 "National solidarity must reach households whose livelihood is insecure. A programme for workers and artisans can broaden the movement's social base, while giving the state another obligation it must finance in difficult years."
 COLDWAR_TUR_1970_mcp_national_curriculum:0 "National Curriculum"
 COLDWAR_TUR_1970_mcp_national_curriculum_desc:0 "The schools shape the nation's future as surely as its factories. A national curriculum will give history, language and civic duty greater weight, while a narrower public debate carries a political cost."
 COLDWAR_TUR_1970_mcp_national_sector:0 "National Enterprise"
 COLDWAR_TUR_1970_mcp_national_sector_desc:0 "Workers, public employees, artisans and farmers can pool savings in enterprises they jointly own. A nation sector can mobilise small investors alongside public and private enterprise."
 COLDWAR_TUR_1970_mcp_parliament:0 "Nationalist Parliament"
 COLDWAR_TUR_1970_mcp_parliament_desc:0 "The movement's return to legal politics requires an organisation capable of working through representative institutions. Provincial cadres can preserve their national programme while accepting the discipline of parliamentary competition."
 COLDWAR_TUR_1970_mcp_return_savings:0 "Savings for Return"
 COLDWAR_TUR_1970_mcp_return_savings_desc:0 "Citizens who have worked abroad should be able to invest their savings in firms at home. Better information and productive contracts can make their return an opportunity for Turkish industry."
 COLDWAR_TUR_1970_mcp_six_unions:0 "Six Producer Unions"
 COLDWAR_TUR_1970_mcp_six_unions_desc:0 "Workers, officials, artisans, villagers, employers and professionals can each organise savings for investment. Their associations will give the nation sector a wider base in production."
 COLDWAR_TUR_1970_mcp_technical_schools:0 "Technical Schools"
 COLDWAR_TUR_1970_mcp_technical_schools_desc:0 "Turkey needs technicians for farms, factories and public services. Direct the education budget towards practical instruction and equipment for vocational schools."
 COLDWAR_TUR_1970_mcp_town_processing:0 "Farm Processing"
 COLDWAR_TUR_1970_mcp_town_processing_desc:0 "Agricultural towns should process the harvest as well as supply machinery. Local industry can connect farmers to a larger market and keep more productive work in the region."
 COLDWAR_TUR_1970_mcp_town_roads:0 "Roads to Farm Towns"
 COLDWAR_TUR_1970_mcp_town_roads_desc:0 "The new agricultural centres need roads to nearby villages and markets. Invest in transport so that farmers can reach machinery, services and buyers."
 COLDWAR_TUR_1970_mcp_worker_savings:0 "Workers' Savings"
 COLDWAR_TUR_1970_mcp_worker_savings_desc:0 "Workers and employees should be able to pool savings and become shareholders in productive enterprises. Their investment can widen ownership while supplying Turkish industry."
 COLDWAR_TUR_1970_mcp_workers_abroad:0 "Workers Abroad"
 COLDWAR_TUR_1970_mcp_workers_abroad_desc:0 "Turkish workers abroad need effective support as they face difficult employment and family conditions. Consular services should defend their interests and help those who choose to return."
 COLDWAR_TUR_1970_mcp_workshop_schools:0 "Schools and Industry"
 COLDWAR_TUR_1970_mcp_workshop_schools_desc:0 "Training should lead to skilled work. Equip schools and local firms to teach machinery maintenance, production and the trades needed by a growing industrial economy."
 COLDWAR_TUR_1970_mcp_workshop_supply:0 "Workshop Co-ops"
 COLDWAR_TUR_1970_mcp_workshop_supply_desc:0 "Small workshops need affordable equipment and trained hands. Local purchasing associations can join apprenticeships to a practical supply of tools and materials."
 COLDWAR_TUR_1970_mechanised_force:0 "Mechanised Force"
 COLDWAR_TUR_1970_mechanised_force_desc:0 "A mobile army needs workshops as much as fighting vehicles. Concentrated procurement will support mechanised formations, while complex equipment demands spare parts and longer technical training."
 COLDWAR_TUR_1970_merit_promotions:0 "Merit Promotions"
 COLDWAR_TUR_1970_merit_promotions_desc:0 "Appointments at the top of the services shape the ambitions of every officer below. A permanent promotions board can favour competence and continuity, but ministers must be ready to withstand the objections of officers accustomed to choosing their own successors."
 COLDWAR_TUR_1970_mhp_artisan_credit:0 "Artisan Credit"
 COLDWAR_TUR_1970_mhp_artisan_credit_desc:0 "Artisans need working capital and reliable workshops. The state can direct a limited investment fund to independent producers and the firms that supply them."
 COLDWAR_TUR_1970_mhp_artisan_markets:0 "Artisan Markets"
 COLDWAR_TUR_1970_mhp_artisan_markets_desc:0 "A reliable commercial network can connect smaller firms with public contracts and new buyers. Local business services will help workshops turn their skills into production."
 COLDWAR_TUR_1970_mhp_artisan_training:0 "Workshop Training"
 COLDWAR_TUR_1970_mhp_artisan_training_desc:0 "Young workers need the practical skills of experienced artisans. Training in the workshop can strengthen small enterprise and improve the quality of Turkish production."
 COLDWAR_TUR_1970_mhp_coop_credit:0 "Credit for Artisans"
 COLDWAR_TUR_1970_mhp_coop_credit_desc:0 "Artisans and small producers cannot compete when working capital is scarce. Cooperative credit and shared purchasing can give their enterprises room to modernise."
 COLDWAR_TUR_1970_mhp_coop_machinery:0 "Cooperative Machinery"
 COLDWAR_TUR_1970_mhp_coop_machinery_desc:0 "Local producers need repair workshops and trained technicians as well as credit. Cooperative investment can bring machinery services closer to the farms and artisans that use them."
 COLDWAR_TUR_1970_mhp_coop_markets:0 "Producers to Market"
 COLDWAR_TUR_1970_mhp_coop_markets_desc:0 "A producer who cannot reach a buyer remains dependent on intermediaries. Improve the roads linking workshops and farms with regional markets."
 COLDWAR_TUR_1970_mhp_coop_supply:0 "Cooperative Supply"
 COLDWAR_TUR_1970_mhp_coop_supply_desc:0 "Artisan and farmer cooperatives can buy equipment together and reduce the cost of maintaining it. Local purchasing gives small producers a stronger position in the market."
 COLDWAR_TUR_1970_mhp_cooperative_funds:0 "Cooperative Funds"
 COLDWAR_TUR_1970_mhp_cooperative_funds_desc:0 "Bring producers and artisans together to finance workshops, housing and credit. Cooperative capital can support local enterprise, but public guarantees must be funded and carefully supervised."
 COLDWAR_TUR_1970_mhp_export_bank:0 "Export Credit"
 COLDWAR_TUR_1970_mhp_export_bank_desc:0 "Turkish producers need dependable credit and sales abroad. A national export programme can connect industrial investment with foreign markets and earn the exchange needed for machinery."
 COLDWAR_TUR_1970_mhp_family_insurance:0 "Family Insurance"
 COLDWAR_TUR_1970_mhp_family_insurance_desc:0 "National solidarity must reach workers and their families when illness or injury interrupts a wage. Extend insurance coverage, accepting the continuing cost to the social budget."
 COLDWAR_TUR_1970_mhp_national_service:0 "Nation and Defence"
 COLDWAR_TUR_1970_mhp_national_service_desc:0 "National independence depends on a capable state and armed forces prepared to defend the republic. Support training and the institutions responsible for national security."
 COLDWAR_TUR_1970_mhp_popular_holdings:0 "People's Shareholding"
 COLDWAR_TUR_1970_mhp_popular_holdings_desc:0 "Mobilise household savings for enterprises with a broad base of Turkish shareholders. The state can guide investment towards useful production while giving small savers a stake in national development."
 COLDWAR_TUR_1970_mhp_restored:0 "Renew National Policy"
 COLDWAR_TUR_1970_mhp_restored_desc:0 "Recovering the historic name must be followed by a programme that can govern. Domestic maintenance and industrial contracts will bind the restored organisation to production that can be judged by practical results."
 COLDWAR_TUR_1970_mhp_share_exports:0 "Provincial Exporters"
 COLDWAR_TUR_1970_mhp_share_exports_desc:0 "Shareholder firms need buyers beyond their home markets. Technical preparation and common commercial services can help provincial industry compete abroad."
 COLDWAR_TUR_1970_mhp_share_industry:0 "Regional Shareholders"
 COLDWAR_TUR_1970_mhp_share_industry_desc:0 "Local savings can give provincial investors a lasting stake in Turkish production. Workshops with reliable machinery and contracts will carry popular shareholding beyond the largest industrial centres."
 COLDWAR_TUR_1970_mhp_share_machinery:0 "Machinery for Firms"
 COLDWAR_TUR_1970_mhp_share_machinery_desc:0 "Provincial shareholders need firms able to maintain machinery and train their own workers. A regional works can make local capital useful beyond its first investment."
 COLDWAR_TUR_1970_mhp_worker_housing:0 "Workers and Services"
 COLDWAR_TUR_1970_mhp_worker_housing_desc:0 "Industrial families need transport and local services close to their work. Invest in the connections that allow towns to grow alongside production."
 COLDWAR_TUR_1970_mhp_worker_insurance:0 "Working Family Cover"
 COLDWAR_TUR_1970_mhp_worker_insurance_desc:0 "Workers cannot build a dependable national economy while their families remain without protection. Wider insurance and safer employment will extend security alongside production, with public spending supporting the commitment."
 COLDWAR_TUR_1970_mhp_workplace_safety:0 "Safety at Work"
 COLDWAR_TUR_1970_mhp_workplace_safety_desc:0 "Insurance is strongest when factories also prevent injury. Training foremen and inspectors can improve the organisation of work and protect the families who depend on it."
 COLDWAR_TUR_1970_mke_production:0 "MKE Production Contracts"
 COLDWAR_TUR_1970_mke_production_desc:0 "A Turkish production base requires more than an order for finished weapons. MKE must finance tooling, train suppliers and keep its workshops busy through long contracts. The bill is heavier than buying a proven design, but the country gains workshops that answer to Ankara."
 COLDWAR_TUR_1970_mnp_chambers:0 "Artisans in Public Life"
 COLDWAR_TUR_1970_mnp_chambers_desc:0 "Small merchants and craftsmen should be heard alongside the great industrial groups. Provincial chambers can bring their experience into public policy, provided the movement supplies practical advice rather than merely asking for loyalty."
 COLDWAR_TUR_1970_mobilised_nation:0 "A Mobilised Nation"
 COLDWAR_TUR_1970_mobilised_nation_desc:0 "Give national service, preparation, and organised mobilisation a central place in public life. The armed forces gain trained personnel, while civilian institutions and social services receive less of the state's attention."
 COLDWAR_TUR_1970_motor_priority:0 "Motor Production Priority"
 COLDWAR_TUR_1970_motor_priority_desc:0 "Engines and transmissions connect industrial ambition to transport, farming and national defence. A concentrated production order can build that capability, while imported tooling still absorbs foreign exchange during the first stage."
 COLDWAR_TUR_1970_mountain_schools:0 "Mountain Schools"
 COLDWAR_TUR_1970_mountain_schools_desc:0 "Much of Turkey demands troops and officers able to operate in mountainous terrain. Specialist schools will strengthen field readiness through experienced instructors and suitable training grounds."
 COLDWAR_TUR_1970_movement_charter:0 "A Defensible Charter"
 COLDWAR_TUR_1970_movement_charter_desc:0 "The movement needs an organisation capable of surviving scrutiny as well as winning an audience. A precise charter, trained provincial officers and a permanent legal service will defend its place in public life without placing every dispute in the hands of a single leader."
 COLDWAR_TUR_1970_msp_coalition_work:0 "Deliver the Agreement"
 COLDWAR_TUR_1970_msp_coalition_work_desc:0 "A coalition must be judged by what its ministries accomplish. Coordinated tenders and investment timetables will turn the party's industrial commitments into work that can continue through cabinet disagreements."
 COLDWAR_TUR_1970_municipal_provision:0 "Municipal Waterworks"
 COLDWAR_TUR_1970_municipal_provision_desc:0 "Public service must reach the neighbourhood as well as the lecture hall. Waterworks and practical municipal administration can make the movement's promise of social renewal visible in ordinary household life."
 COLDWAR_TUR_1970_municipal_water:0 "Municipal Waterworks"
 COLDWAR_TUR_1970_municipal_water_desc:0 "Improve water and sanitation for cities growing beyond their older infrastructure. Reliable municipal services can prevent illness and support new housing, while requiring long-term maintenance by local authorities."
 COLDWAR_TUR_1970_national_development_bank:0 "National Growth Bank"
 COLDWAR_TUR_1970_national_development_bank_desc:0 "Anatolian production needs long-term capital that can serve farms and workshops together. A national development bank will direct public funds towards these investments, with professional oversight responsible for their risks."
 COLDWAR_TUR_1970_national_outlook:0 "Faith and Industry"
 COLDWAR_TUR_1970_national_outlook_desc:0 "Our towns need workshops, our villages need opportunity, and the Republic needs an economy that answers to its own people. Millî Görüş will join industrial ambition to religious conviction and give provincial producers a stronger voice in national development."
 COLDWAR_TUR_1970_nato_interoperability:0 "NATO Interoperability"
 COLDWAR_TUR_1970_nato_interoperability_desc:0 "Align staff procedures and communications with the standards used by Turkey's allies. Better coordination strengthens joint defence planning, while specialist instruction and compatible equipment demand sustained investment."
 COLDWAR_TUR_1970_nine_lights:0 "The Nine Lights"
 COLDWAR_TUR_1970_nine_lights_desc:0 "The Nine Lights bind Turkish nationalism to social solidarity, science, rural development and modern industry. National independence and a strong state must give those principles political purpose."
 COLDWAR_TUR_1970_north_annex:0 "Incorporate the Northern Territory"
 COLDWAR_TUR_1970_north_annex_desc:0 "Direct rule would bind the northern territory to the Turkish state rather than place it behind a separate government. Ankara would gain control over its administration, but would also inherit the costs of reconstruction and a sharper confrontation over the island's future."
 COLDWAR_TUR_1970_north_subject:0 "Proclaim a Northern Cypriot Republic"
 COLDWAR_TUR_1970_north_subject_desc:0 "A northern administration can turn military protection into a separate political order. Ankara would retain a decisive position through a dependent republic, while assuming the diplomatic burden and continuing expense of sustaining its institutions."
 COLDWAR_TUR_1970_northeastern_markets_services:0 "Northeastern Markets and Services"
 COLDWAR_TUR_1970_northeastern_markets_services_desc:0 "Northeastern producers need veterinary advice, fodder services and reliable links to processors and markets. Provincial teaching and maintained local works will strengthen the livestock districts and the productive valleys together. These services can support a growing regional economy while the cost of reaching scattered settlements remains."
 COLDWAR_TUR_1970_northern_bridgehead:0 "Secure the Northern Bridgehead"
 COLDWAR_TUR_1970_northern_bridgehead_desc:0 "A landing is only the beginning of an enduring position on the island. The ports, roads and supply arrangements of the northern bridgehead must be made dependable before Ankara can decide what political settlement its troops will defend."
 COLDWAR_TUR_1970_officer_colleges:0 "Officer Colleges"
 COLDWAR_TUR_1970_officer_colleges_desc:0 "An officer educated alongside engineers, administrators and civilian scholars has more than one language in which to discuss the Republic. Joint teaching and professional study can strengthen the services without making political intervention the measure of military honour."
 COLDWAR_TUR_1970_open_procurement:0 "Open Procurement"
 COLDWAR_TUR_1970_open_procurement_desc:0 "Defence orders should purchase useful equipment rather than political protection. Competitive contracts and published accounts can reward reliable suppliers, although breaking established arrangements will require money, inspectors and sustained parliamentary attention."
 COLDWAR_TUR_1970_parliament:0 "Parliamentary Oversight"
 COLDWAR_TUR_1970_parliament_desc:0 "The Grand National Assembly should supervise defence appointments and public spending. Stronger parliamentary oversight affirms the authority of elected representatives, while challenging officers accustomed to a direct voice in government."
 COLDWAR_TUR_1970_parliamentary_nationalism:0 "Assembly Nationalism"
 COLDWAR_TUR_1970_parliamentary_nationalism_desc:0 "Pursue the nationalist programme through parliamentary negotiation and wider civilian cooperation. A stable majority can support development and public order, but requires compromise with other parties and commercial interests."
 COLDWAR_TUR_1970_participation_funds:0 "Participation Finance"
 COLDWAR_TUR_1970_participation_funds_desc:0 "Finance shaped by partnership can attract savers unwilling to rely on interest-bearing lending. Production funds will share risks and returns, with public oversight needed to keep religious confidence from becoming a substitute for sound accounts."
 COLDWAR_TUR_1970_preview_accounts:0 "National Programme"
 COLDWAR_TUR_1970_preview_accounts_desc:0 "Military procurement and service contracts require clear public accounts. An independent audit office can expose patronage and strengthen parliament's scrutiny, though a professional staff and reliable records carry a continuing cost."
 COLDWAR_TUR_1970_preview_administration_school:0 "National Programme"
 COLDWAR_TUR_1970_preview_administration_school_desc:0 "Parliament, the National Security Council, and the general staff all depend on capable ministries. A public administration school can train officials to keep records, manage budgets, and carry policy into the provinces."
 COLDWAR_TUR_1970_preview_aegean_deterrence:0 "National Programme"
 COLDWAR_TUR_1970_preview_aegean_deterrence_desc:0 "Give naval deterrence priority over a reciprocal settlement with Greece. A stronger operational posture reassures the services, while persistent maritime tension risks damaging trade and commercial confidence."
 COLDWAR_TUR_1970_preview_airframe_assembly:0 "National Programme"
 COLDWAR_TUR_1970_preview_airframe_assembly_desc:0 "Prepare Turkish factories and engineers for aircraft assembly and component production. A negotiated partnership can build industrial knowledge, but dependable airframes require years of technical training and investment."
 COLDWAR_TUR_1970_preview_amphibious_service:0 "National Programme"
 COLDWAR_TUR_1970_preview_amphibious_service_desc:0 "The armed forces require trained crews and clear procedures to move troops and supplies by sea. Coordinated amphibious exercises can improve readiness in the Aegean, but demand vessels, training, and continuing funds."
 COLDWAR_TUR_1970_preview_anap_border_enterprise:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_anap_border_enterprise_desc:0 "Investment incentives and better connections can bring private activity to eastern provinces. Public resources must first build the foundations on which local firms can compete."
 COLDWAR_TUR_1970_preview_anap_college_workshops:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_college_workshops_desc:0 "Technical education needs workshops where students can practise with the tools used by local industry. Practical instruction will help graduates enter productive employment."
 COLDWAR_TUR_1970_preview_anap_contractors_abroad:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_contractors_abroad_desc:0 "Construction firms need experienced staff and domestic suppliers before they can compete for work overseas. Commercial training can help them prepare for contracts they must still win."
 COLDWAR_TUR_1970_preview_anap_eastern_training:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_eastern_training_desc:0 "Eastern provinces need professional and technical opportunities if investment is to create lasting local employment. Regional training can strengthen firms beyond the largest coastal cities."
 COLDWAR_TUR_1970_preview_anap_equipment:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_anap_equipment_desc:0 "Productive investment requires finance that lasts longer than a trading season. Equipment funding can improve the efficiency of industrial lines, with the government accepting a substantial initial commitment of public capital."
 COLDWAR_TUR_1970_preview_anap_europe_customers:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_europe_customers_desc:0 "Turkish exporters can seek customers in Europe if they meet demanding standards and delivery schedules. Commercial resources will help firms prepare their products for a competitive market."
 COLDWAR_TUR_1970_preview_anap_europe_standards:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_europe_standards_desc:0 "Manufacturers competing for European orders need consistent products and trained staff. Quality work in Turkey can help firms retain customers through commercial performance."
 COLDWAR_TUR_1970_preview_anap_export_brokers:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_export_brokers_desc:0 "Exporters and their suppliers need commercial contacts capable of turning public investment into orders. Business services can help firms reach customers beyond the domestic market."
 COLDWAR_TUR_1970_preview_anap_export_corridor:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_anap_export_corridor_desc:0 "Exporters need roads and dependable links to ports as much as they need customers. Concentrated transport investment will reduce the distance between provincial producers and foreign markets."
 COLDWAR_TUR_1970_preview_anap_export_quality:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_anap_export_quality_desc:0 "Export equipment must be matched by product quality and technical skills. Training and industrial testing can help producers keep the customers they win abroad."
 COLDWAR_TUR_1970_preview_anap_export_standards:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_export_standards_desc:0 "Turkish manufacturers need dependable quality as well as modern machines to win foreign orders. Testing and technical training can help firms compete on the strength of their products."
 COLDWAR_TUR_1970_preview_anap_farm_extension:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_farm_extension_desc:0 "Farmers need practical advice on using water and equipment effectively. Extension workers can help turn public irrigation works into more reliable production."
 COLDWAR_TUR_1970_preview_anap_farm_marketing:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_anap_farm_marketing_desc:0 "Irrigation and better marketing give farmers a chance to sell more of a reliable harvest. The state can support access to markets without directing every production decision."
 COLDWAR_TUR_1970_preview_anap_financial_skills:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_financial_skills_desc:0 "Banks and commercial firms need specialists who understand international transactions. Professional training can support a more open financial system and its expanding obligations."
 COLDWAR_TUR_1970_preview_anap_food_standards:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_food_standards_desc:0 "Processed food must meet the requirements of customers at home and abroad. Testing and technical instruction can help producers protect the reputation of Turkish goods."
 COLDWAR_TUR_1970_preview_anap_freight_training:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_freight_training_desc:0 "Export firms need people who can organise transport, documentation and delivery. Practical commercial training can make the new freight routes more useful to provincial producers."
 COLDWAR_TUR_1970_preview_anap_housing:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_anap_housing_desc:0 "Growing towns need roads and public services before private builders can provide dependable new neighbourhoods. Serviced land in Istanbul will support urban expansion, while public investment carries the cost of reaching households beyond the established centres."
 COLDWAR_TUR_1970_preview_anap_housing_services:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_housing_services_desc:0 "New neighbourhoods need public services after the first houses are occupied. Local provision and health care will place a lasting claim on the public budget."
 COLDWAR_TUR_1970_preview_anap_incentive_audits:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_incentive_audits_desc:0 "Published incentives need reliable accounts if the Treasury is to know which firms receive support. Professional supervision can make public commitments more predictable."
 COLDWAR_TUR_1970_preview_anap_market_farms:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_anap_market_farms_desc:0 "An open market must give farmers the means to reach its buyers. Storage, commercial advice and practical training can help rural production compete, while concessionary finance reduces the immediate tax return."
 COLDWAR_TUR_1970_preview_anap_middle_east_markets:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_middle_east_markets_desc:0 "Turkish suppliers and contractors can seek orders across neighbouring markets. Commercial resources can support their domestic preparation while individual foreign customers decide whether to buy."
 COLDWAR_TUR_1970_preview_anap_regional_colleges:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_regional_colleges_desc:0 "Provincial firms need technicians and commercial staff trained close to home. The social investment allocation can finance practical education, leaving urban housing for another funding round."
 COLDWAR_TUR_1970_preview_anap_rules_based_aid:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_rules_based_aid_desc:0 "Export incentives can be awarded through published conditions rather than private discretion. Parliament and firms must accept the political effort required to make the same rules apply across the market."
 COLDWAR_TUR_1970_preview_anap_social_cover:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_anap_social_cover_desc:0 "A market economy needs political consent from households as well as confidence from investors. Broader social coverage will protect the programme's foundations, with a permanent contribution from the budget."
 COLDWAR_TUR_1970_preview_anap_tourism_training:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_preview_anap_tourism_training_desc:0 "A lasting visitor economy depends on trained workers and dependable service. Local training will help tourism firms make better use of the connections built for them."
 COLDWAR_TUR_1970_preview_anatolian_markets:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_anatolian_markets_desc:0 "A provincial factory needs customers as well as credit. Testing, commercial representation and supply contracts can help smaller firms reach national markets without making them permanently dependent on a minister's favour."
 COLDWAR_TUR_1970_preview_anatolian_training:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_anatolian_training_desc:0 "Practical expertise is concentrated too narrowly in the largest cities. Colleges and workshops across Anatolia will prepare specialists for industry, agriculture and the services, provided graduates can find equipment and skilled work at home."
 COLDWAR_TUR_1970_preview_ap_city_clinics:0 "Justice Party Development Programme"
 COLDWAR_TUR_1970_preview_ap_city_clinics_desc:0 "Rapid urban growth puts pressure on families seeking dependable health services. Public support for local staff and access programmes can sustain confidence in development, while increasing the health budget commitment."
 COLDWAR_TUR_1970_preview_ap_coastal_supply:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_ap_coastal_supply_desc:0 "A dependable processing industry can connect fishing communities to customers throughout the country. New works around Izmir will handle and prepare their output, while commercial services coordinate purchases and distribution."
 COLDWAR_TUR_1970_preview_ap_contract_suppliers:0 "Justice Party Development Programme"
 COLDWAR_TUR_1970_preview_ap_contract_suppliers_desc:0 "Provincial contractors need dependable materials and trained workers to carry their orders through. Local suppliers can turn government contracts into a broader construction trade."
 COLDWAR_TUR_1970_preview_ap_dam_engineers:0 "Justice Party Development Programme"
 COLDWAR_TUR_1970_preview_ap_dam_engineers_desc:0 "The construction programme needs surveyors, engineers and technicians as well as concrete. Practical instruction can strengthen the firms that must operate and maintain these works."
 COLDWAR_TUR_1970_preview_ap_farm_credit:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_ap_farm_credit_desc:0 "Farmers need affordable machinery and the means to bring a harvest to market. Lending through their own cooperatives can spread investment beyond the largest estates, provided the banks are willing to carry a long rural commitment."
 COLDWAR_TUR_1970_preview_ap_fisheries:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_ap_fisheries_desc:0 "Small fishing enterprises need reliable finance and a stronger position when selling their catch. Coastal cooperative offices will organise credit, purchases and commercial advice, giving crews a practical service rather than another distant promise."
 COLDWAR_TUR_1970_preview_ap_irrigation:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_ap_irrigation_desc:0 "Small farms need reliable water as well as affordable equipment. Irrigation and local distribution will improve harvests, but the public works require a substantial initial commitment."
 COLDWAR_TUR_1970_preview_ap_local_builders:0 "Justice Party Development Programme"
 COLDWAR_TUR_1970_preview_ap_local_builders_desc:0 "Provincial builders need trained staff and access to consistent orders. A stronger local construction trade can continue to serve new districts after the first contracts are complete."
 COLDWAR_TUR_1970_preview_ap_machinery_pools:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_ap_machinery_pools_desc:0 "Cooperative purchasing and shared machinery can bring mechanisation within reach of cultivators whose holdings cannot sustain individual investment."
 COLDWAR_TUR_1970_preview_ap_open_contracts:0 "Justice Party Development Programme"
 COLDWAR_TUR_1970_preview_ap_open_contracts_desc:0 "Open competition for public contracts asks officials and legislators to defend a slower, more transparent process. The government will need political support to establish standards that suppliers can trust."
 COLDWAR_TUR_1970_preview_ap_port_cooperatives:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_ap_port_cooperatives_desc:0 "Cooperative sales and equipment purchasing can strengthen small coastal producers without removing their responsibility for operating their own boats."
 COLDWAR_TUR_1970_preview_ap_provincial_councils:0 "Justice Party Development Programme"
 COLDWAR_TUR_1970_preview_ap_provincial_councils_desc:0 "Development depends on the cooperation of local representatives, professionals and producers. Provincial consultation can bring practical needs to the attention of the ministries responsible for investment."
 COLDWAR_TUR_1970_preview_ap_seed_services:0 "Justice Party Development Programme"
 COLDWAR_TUR_1970_preview_ap_seed_services_desc:0 "Farmers need advice on seed, machinery and the care of irrigated land. Agricultural services can make cooperative equipment more useful without displacing the family farm."
 COLDWAR_TUR_1970_preview_ap_supplier_training:0 "Justice Party Development Programme"
 COLDWAR_TUR_1970_preview_ap_supplier_training_desc:0 "Independent firms need skilled machinists and foremen to deliver consistent goods. Apprenticeships will link local workshops to the technical schools on which expansion depends."
 COLDWAR_TUR_1970_preview_ap_teacher_posts:0 "Justice Party Development Programme"
 COLDWAR_TUR_1970_preview_ap_teacher_posts_desc:0 "Children in provincial districts need teachers who can remain in their communities. Schools and local recruitment require a dependable commitment to education spending."
 COLDWAR_TUR_1970_preview_ap_tender_profession:0 "Justice Party Development Programme"
 COLDWAR_TUR_1970_preview_ap_tender_profession_desc:0 "Competitive procurement requires officials who can prepare bids and compare the obligations they impose. Professional staff can protect the value of public investment."
 COLDWAR_TUR_1970_preview_ap_trade_schools:0 "Justice Party Development Programme"
 COLDWAR_TUR_1970_preview_ap_trade_schools_desc:0 "Farm machinery, construction and industry all rely on practical trades. Provincial schools can train the people required by the development programme without drawing every student to the capital."
 COLDWAR_TUR_1970_preview_ap_water_engineers:0 "Justice Party Development Programme"
 COLDWAR_TUR_1970_preview_ap_water_engineers_desc:0 "Municipalities need trained crews to maintain pipes and treatment works after construction. Public services will need a continuing share of the budget as the city grows."
 COLDWAR_TUR_1970_preview_applied_research:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_applied_research_desc:0 "Research should solve the problems encountered by farms and workshops. Technical institutes will work with domestic producers on useful machinery, controls and maintenance rather than measure their success by imported designs alone."
 COLDWAR_TUR_1970_preview_aselsan:0 "National Programme"
 COLDWAR_TUR_1970_preview_aselsan_desc:0 "A Turkish communications industry can equip the armed forces and train a new body of engineers. Laboratories, components, and technical staff must be developed before domestic electronics can meet service requirements."
 COLDWAR_TUR_1970_preview_cgp_common_board:0 "Republican Development Programme"
 COLDWAR_TUR_1970_preview_cgp_common_board_desc:0 "Republican institutions and a mixed economy can unite public purpose with private initiative. The government should coordinate investment while leaving room for independent enterprise."
 COLDWAR_TUR_1970_preview_cgp_private_compact:0 "Republican Development Programme"
 COLDWAR_TUR_1970_preview_cgp_private_compact_desc:0 "A reliable framework can draw private capital into the national programme. The government will support firms that expand production, while accepting a lower immediate tax return from their retained earnings."
 COLDWAR_TUR_1970_preview_cgp_public_credit:0 "Republican Development Programme"
 COLDWAR_TUR_1970_preview_cgp_public_credit_desc:0 "Public credit should sustain useful production without becoming a refuge for failing contracts. Stronger review can improve the output of supported firms, with commercial services carrying the cost of a more cautious lending policy."
 COLDWAR_TUR_1970_preview_change_order:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_change_order_desc:0 "The Republic must make constitutional democracy meaningful to workers, farmers and families. Planned development and social rights can bring the benefits of growth to citizens beyond the established centres of wealth."
 COLDWAR_TUR_1970_preview_chemical_inputs:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_chemical_inputs_desc:0 "Industrial development should raise the productivity of the countryside as well as the towns. Domestic chemical inputs and fertiliser supply can give farmers more dependable production, at the cost of another large capital commitment."
 COLDWAR_TUR_1970_preview_chp_ecevit_platform:0 "CHP programme"
 COLDWAR_TUR_1970_preview_chp_ecevit_platform_desc:0 "Political democracy must reach the places where people work and produce. Bülent Ecevit's democratic left asks workers, farmers and citizens to shape the Republic's economic future."
 COLDWAR_TUR_1970_preview_chp_equal_citizens:0 "CHP programme"
 COLDWAR_TUR_1970_preview_chp_equal_citizens_desc:0 "The Republic must command the loyalty of all its citizens through equal rights and public institutions that treat them fairly. Political freedom and social justice belong together."
 COLDWAR_TUR_1970_preview_chp_health_services:0 "CHP programme"
 COLDWAR_TUR_1970_preview_chp_health_services_desc:0 "Health protection must reach families who cannot depend on private care. Public service offices can support a more reliable system of preventive and local treatment."
 COLDWAR_TUR_1970_preview_chp_health_training:0 "CHP programme"
 COLDWAR_TUR_1970_preview_chp_health_training_desc:0 "Public health services need staff able to use their resources well. Professional training will support more efficient administration and care, with the education budget carrying the cost of maintaining these skills."
 COLDWAR_TUR_1970_preview_chp_industrial_compact:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_chp_industrial_compact_desc:0 "Social democracy must sustain the production on which its commitments depend. Research and industrial cooperation will support a more productive economy, with technical education taking a larger share of expenditure."
 COLDWAR_TUR_1970_preview_chp_inonu_council:0 "CHP programme"
 COLDWAR_TUR_1970_preview_chp_inonu_council_desc:0 "Parliamentary democracy must give workers and farmers a fair share in national development. Under İsmet İnönü, the party can bring social reform into the work of the Republic."
 COLDWAR_TUR_1970_preview_chp_public_services:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_chp_public_services_desc:0 "The strongest claim on public money comes from citizens whose services have fallen behind. A renewed programme will place social provision first, with a lasting budget to make the promise credible."
 COLDWAR_TUR_1970_preview_chp_reunion:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_chp_reunion_desc:0 "The Republican People’s Party returns to public life with a responsibility to defend a democratic, secular and socially just republic. Its renewed organisation must bring citizens into the work of national development."
 COLDWAR_TUR_1970_preview_chp_womens_education:0 "CHP programme"
 COLDWAR_TUR_1970_preview_chp_womens_education_desc:0 "Women must be able to obtain the education and skills needed to participate fully in public and economic life. Wider access strengthens families, communities and the Republic."
 COLDWAR_TUR_1970_preview_chp_workplace_councils:0 "CHP programme"
 COLDWAR_TUR_1970_preview_chp_workplace_councils_desc:0 "Workers know the practical problems of the enterprises they keep running. Their participation in management can support more responsive public industry and give industrial democracy a daily meaning."
 COLDWAR_TUR_1970_preview_chpr_investment_growth:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_chpr_investment_growth_desc:0 "Social democracy must build prosperity as well as share it. New industrial investment can create productive employment and give the Republic a stronger economic base."
 COLDWAR_TUR_1970_preview_chpr_local_authorities:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_chpr_local_authorities_desc:0 "Communities know the needs of their own districts. Strong local authorities with reliable resources can connect public services and productive investment to the places that need them."
 COLDWAR_TUR_1970_preview_chpr_public_employees:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_chpr_public_employees_desc:0 "Public servants should have a respected voice in the institutions they sustain. Better representation and secure working conditions can strengthen the quality of public service."
 COLDWAR_TUR_1970_preview_chpr_teachers:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_chpr_teachers_desc:0 "A modern republic depends on teachers who have the training, standing and resources to serve their communities. Investment in public education can widen opportunity and strengthen the skills on which national development depends."
 COLDWAR_TUR_1970_preview_civic_equality:0 "National Programme"
 COLDWAR_TUR_1970_preview_civic_equality_desc:0 "Kurdish citizens should have equal access to schools, courts, and public service. Addressing regional grievances through civilian administration can strengthen the republic, though centralist officials will resist a wider recognition of local identity."
 COLDWAR_TUR_1970_preview_civil_cabinet:0 "National Programme"
 COLDWAR_TUR_1970_preview_civil_cabinet_desc:0 "Civilian ministers should manage the daily business of government while the National Security Council advises on strategic questions. Administrative continuity can protect public services, though parties surrender some freedom to set priorities."
 COLDWAR_TUR_1970_preview_civil_service_statute:0 "National Programme"
 COLDWAR_TUR_1970_preview_civil_service_statute_desc:0 "The Republic needs officials whose careers survive a change of ministers. Competitive entry, secure tenure and common training can give elected governments a capable administration without turning every appointment into a party favour."
 COLDWAR_TUR_1970_preview_civilian_ministry:0 "National Programme"
 COLDWAR_TUR_1970_preview_civilian_ministry_desc:0 "The defence ministry needs civilian officials able to question procurement, personnel and strategic priorities on equal terms with the commanders. Expanding its professional staff will strengthen cabinet authority without pretending that a civilian minister alone can end military influence."
 COLDWAR_TUR_1970_preview_collective_bargaining:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_collective_bargaining_desc:0 "Collective bargaining gives organised workers a stronger voice in wages and working conditions. A social republic must make these rights meaningful while supporting productive employment."
 COLDWAR_TUR_1970_preview_command:0 "National Programme"
 COLDWAR_TUR_1970_preview_command_desc:0 "The general staff can take direct responsibility for the state and claim to restore order. Military rule promises unity of command, but sidelines parliament and places public administration under permanent political pressure."
 COLDWAR_TUR_1970_preview_command_planning:0 "National Programme"
 COLDWAR_TUR_1970_preview_command_planning_desc:0 "Use the general staff's command structure to direct industrial investment around Konya. Central planning can concentrate resources on strategic production, but military administration leaves less room for civilian priorities and local initiative."
 COLDWAR_TUR_1970_preview_competitive_lira:0 "National Programme"
 COLDWAR_TUR_1970_preview_competitive_lira_desc:0 "An overvalued lira makes Turkish exports costly and imported goods attractive. Restore competitiveness through exchange-rate adjustment, while preparing households and firms for higher prices on imported food, fuel, and equipment."
 COLDWAR_TUR_1970_preview_competitive_state:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_competitive_state_desc:0 "An open economy still needs public investment. The state will concentrate on transport, power and skills, leaving more commercial decisions to enterprises that must answer for their own results."
 COLDWAR_TUR_1970_preview_constitutional_consolidation:0 "National Programme"
 COLDWAR_TUR_1970_preview_constitutional_consolidation_desc:0 "Institutions endure when rival governments accept the limits they impose. The ministries, courts and services must now defend an agreed constitutional order even when an election brings their opponents to office."
 COLDWAR_TUR_1970_preview_consular_network:0 "National Programme"
 COLDWAR_TUR_1970_preview_consular_network_desc:0 "Support Turkish trade and citizens abroad with a wider professional consular network. More capable offices can protect families and assist firms, though diplomatic reach requires trained staff and a continuing budget."
 COLDWAR_TUR_1970_preview_convertibility:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_convertibility_desc:0 "Banks and commercial firms are preparing for a more open lira regime. Clear rules can support international trade, while domestic producers face stronger competition from abroad."
 COLDWAR_TUR_1970_preview_council:0 "National Programme"
 COLDWAR_TUR_1970_preview_council_desc:0 "Give the National Security Council a stronger hand in reviewing national policy. The arrangement reassures senior officers and preserves elected ministers, though civilian decisions now require another layer of consultation."
 COLDWAR_TUR_1970_preview_council_procurement:0 "National Programme"
 COLDWAR_TUR_1970_preview_council_procurement_desc:0 "Bring the services into a joint board to compare equipment needs and coordinate orders. Common standards can reduce duplication across the armed forces, while committee review slows decisions and adds administrative expense."
 COLDWAR_TUR_1970_preview_council_revision:0 "National Programme"
 COLDWAR_TUR_1970_preview_council_revision_desc:0 "The council can advise the cabinet without standing above it. A revised mandate must settle who decides, who advises and who answers to Parliament. The government will need both public legitimacy and sufficient confidence within the services to make that settlement endure."
 COLDWAR_TUR_1970_preview_d8_farms:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_d8_farms_desc:0 "Developing economies can exchange useful experience in seed, machinery and farm services. A common technical programme will support production while requiring a permanent contribution of trained staff and public funds."
 COLDWAR_TUR_1970_preview_d8_technical:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_d8_technical_desc:0 "Engineers and technical institutes can gain more from dependable cooperation than from occasional ceremonial visits. Funded research exchanges will give the members a practical return on their new organisation."
 COLDWAR_TUR_1970_preview_d8_trade:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_d8_trade_desc:0 "Commercial contacts should bring producers dependable customers rather than an endless list of intentions. Coordinated standards and business services can widen trade while reducing the public return from some commercial concessions."
 COLDWAR_TUR_1970_preview_development_majority:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_development_majority_desc:0 "The Justice Party looks to public works and private enterprise to carry development into the provinces. The government must reconcile the demands of farmers, contractors and industry with the credit, skills and foreign exchange at its disposal."
 COLDWAR_TUR_1970_preview_directed_credit:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_directed_credit_desc:0 "Public credit can be directed towards machinery, workshops and productive orders. Conventional lending offers a familiar instrument, but the state must accept the cost of guarantees and the danger of favouring well-connected borrowers."
 COLDWAR_TUR_1970_preview_diverse_markets:0 "National Programme"
 COLDWAR_TUR_1970_preview_diverse_markets_desc:0 "Turkish manufacturers need customers beyond established markets. Export finance, trade missions, and quality certification can widen commercial ties and strengthen foreign earnings, provided firms adapt to different buyers."
 COLDWAR_TUR_1970_preview_dl_education:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dl_education_desc:0 "Education must give citizens the means to question authority as well as the skills to earn a living. Broader technical and scientific teaching will require teachers, institutions and a public budget that endures beyond an election."
 COLDWAR_TUR_1970_preview_dl_exports:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dl_exports_desc:0 "Exports can earn the machinery and inputs needed for development, but the home economy should not remain dependent on every imported component. Technical investment will strengthen firms that can serve both markets."
 COLDWAR_TUR_1970_preview_dl_participation:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dl_participation_desc:0 "A democratic left must organise around citizens, producers and working communities. Local participation can turn national development into a practical concern for ordinary households."
 COLDWAR_TUR_1970_preview_dl_producer_funds:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dl_producer_funds_desc:0 "Cooperating farmers can pool a share of their growing incomes in producer-managed investment. Their savings should serve rural production and the security of the communities that created them."
 COLDWAR_TUR_1970_preview_dl_producers:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dl_producers_desc:0 "Workers and producers need a political voice rooted in their own experience. Democratic participation and productive enterprise can broaden opportunity without surrendering national independence."
 COLDWAR_TUR_1970_preview_dl_services:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dl_services_desc:0 "Health, schooling and dependable local administration give households the security to take part in economic change. Expanding access will strengthen public confidence while adding lasting obligations to the budget."
 COLDWAR_TUR_1970_preview_dl_settlement:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dl_settlement_desc:0 "A durable democratic left must join productive investment to the independence of citizens and their associations. The government will consolidate a programme in which participation brings both a voice in decisions and responsibility for their results."
 COLDWAR_TUR_1970_preview_dl_villages:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dl_villages_desc:0 "Village centres can bring schools, clinics and productive work within reach of neighbouring settlements. Investment should strengthen the villages around them and leave families free to remain in their homes."
 COLDWAR_TUR_1970_preview_dl_worker_funds:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dl_worker_funds_desc:0 "Workers should have a share in investment as well as wages. Worker-managed funds can direct part of enterprise earnings toward productive assets and greater security for working families."
 COLDWAR_TUR_1970_preview_dl_workplaces:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dl_workplaces_desc:0 "Investment funds need real workshops in which their members can work and exercise their stake. A new industrial project will combine public finance with workplace participation and a responsibility to keep production competitive."
 COLDWAR_TUR_1970_preview_domestic_inputs:0 "National Programme"
 COLDWAR_TUR_1970_preview_domestic_inputs_desc:0 "Replace selected imported industrial inputs through domestic workshops and negotiated supply contracts. Local capacity eases pressure on foreign exchange, but public allocation and technical supervision remain necessary."
 COLDWAR_TUR_1970_preview_dsp_cooperative_processing:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dsp_cooperative_processing_desc:0 "Producer associations can invest in processing as well as farming. Local industry will give village families a greater share of the value created by their crops and strengthen the rural economy."
 COLDWAR_TUR_1970_preview_dsp_industrial_education:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dsp_industrial_education_desc:0 "A democratic left must be able to sustain both productive work and independent public institutions. Technical teaching and industrial research will strengthen that foundation, with education claiming a larger share of the budget."
 COLDWAR_TUR_1970_preview_dsp_local_health:0 "DSP programme"
 COLDWAR_TUR_1970_preview_dsp_local_health_desc:0 "Families need health services within reach of their own communities. Local administration can support the staff and organisation needed to provide them."
 COLDWAR_TUR_1970_preview_dsp_local_services:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dsp_local_services_desc:0 "Participation must leave households with better services and a dependable local authority. A funded programme will connect the movement's provincial work to national social commitments."
 COLDWAR_TUR_1970_preview_dsp_worker_enterprise:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_preview_dsp_worker_enterprise_desc:0 "Workers should share in the success of the enterprises they sustain. Investment in equipment and skills can strengthen production while giving working people a greater stake in its future."
 COLDWAR_TUR_1970_preview_dyp_accounts:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_dyp_accounts_desc:0 "Development contracts must be judged by what Turkish firms can deliver. Engineering assessments and trained procurement staff will improve the selection of industrial projects and give public accounts a firmer basis than political assurances."
 COLDWAR_TUR_1970_preview_dyp_artisan_training:0 "True Path Programme"
 COLDWAR_TUR_1970_preview_dyp_artisan_training_desc:0 "Small firms depend on skilled workers, technical advice and knowledge of their customers. Training can help artisans and manufacturers build reliable provincial businesses."
 COLDWAR_TUR_1970_preview_dyp_clinic_access:0 "True Path Programme"
 COLDWAR_TUR_1970_preview_dyp_clinic_access_desc:0 "Families in rural districts need public support for reaching basic health services. A funded assistance programme will commit the government to provincial staff, advice and travel needs, with a continuing claim on the health budget."
 COLDWAR_TUR_1970_preview_dyp_council_tenders:0 "True Path Programme"
 COLDWAR_TUR_1970_preview_dyp_council_tenders_desc:0 "Municipal councils can establish public tender rules for local works. The government must spend political capital defending competitive contracting and the independence of local scrutiny."
 COLDWAR_TUR_1970_preview_dyp_enterprise:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_dyp_enterprise_desc:0 "Small manufacturers and artisans need capital, technical knowledge and access to customers. Support for provincial industry can widen employment, while public resources remain exposed to commercial failure."
 COLDWAR_TUR_1970_preview_dyp_farm_maintenance:0 "True Path Programme"
 COLDWAR_TUR_1970_preview_dyp_farm_maintenance_desc:0 "Irrigation schemes need users who can organise maintenance and recover the cost of upkeep. Local associations can help public investment deliver dependable water to family farms."
 COLDWAR_TUR_1970_preview_dyp_health_staff:0 "True Path Programme"
 COLDWAR_TUR_1970_preview_dyp_health_staff_desc:0 "Provincial health programmes need dependable staff funding and practical support. A sustained public commitment will answer local expectations, while requiring the Treasury to carry its continuing cost."
 COLDWAR_TUR_1970_preview_dyp_local_professionals:0 "True Path Programme"
 COLDWAR_TUR_1970_preview_dyp_local_professionals_desc:0 "Engineers, accountants and administrators help a municipality turn local decisions into dependable services. Training can give local government capacity beyond the next construction project."
 COLDWAR_TUR_1970_preview_dyp_local_services:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_dyp_local_services_desc:0 "Rapid urban growth is straining housing and local services. Investment in roads and utilities can help municipalities serve expanding neighbourhoods, with a continuing claim on public funds."
 COLDWAR_TUR_1970_preview_dyp_parliament_rules:0 "True Path Programme"
 COLDWAR_TUR_1970_preview_dyp_parliament_rules_desc:0 "Parliament needs the staff and time to examine public decisions. Strengthening its scrutiny places elected representatives at the centre of a limited institutional reform budget."
 COLDWAR_TUR_1970_preview_dyp_producer_markets:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_dyp_producer_markets_desc:0 "Farmers and workshops need dependable channels to the larger towns. Better marketing and distribution can raise returns without requiring every producer to become a large enterprise."
 COLDWAR_TUR_1970_preview_dyp_public_accounts:0 "True Path Programme"
 COLDWAR_TUR_1970_preview_dyp_public_accounts_desc:0 "Public contracts and accounts deserve examination by qualified officials answerable to elected representatives. Better professional training will support that oversight."
 COLDWAR_TUR_1970_preview_dyp_regional_schools:0 "True Path Programme"
 COLDWAR_TUR_1970_preview_dyp_regional_schools_desc:0 "Provincial enterprises need qualified workers and local authorities need professional staff. Technical schools can support both, with education costs continuing after the buildings open."
 COLDWAR_TUR_1970_preview_dyp_rural_banks:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_dyp_rural_banks_desc:0 "Farm families need water, equipment and access to capital if provincial development is to reach the countryside. Credit and local services can support productive holdings, while the public banks must carry the risks of lending."
 COLDWAR_TUR_1970_preview_dyp_small_business:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_dyp_small_business_desc:0 "Artisans and small manufacturers need capital, materials and help finding buyers. Provincial business credit can support their investment, although the state must finance its share of the risk."
 COLDWAR_TUR_1970_preview_dyp_social_insurance:0 "True Path Programme"
 COLDWAR_TUR_1970_preview_dyp_social_insurance_desc:0 "Social security should reach people whose work leaves them exposed to illness and old age. Wider coverage can protect households if the government accepts the recurring expense."
 COLDWAR_TUR_1970_preview_dyp_social_outreach:0 "True Path Programme"
 COLDWAR_TUR_1970_preview_dyp_social_outreach_desc:0 "Older citizens need dependable protection when earnings no longer cover their needs. Wider access to assistance can strengthen family security while creating a continuing budget obligation."
 COLDWAR_TUR_1970_preview_dyp_social_security:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_dyp_social_security_desc:0 "Every household needs security against illness, old age and the loss of work. Wider social protection can extend that assurance, but a broader commitment requires dependable public resources."
 COLDWAR_TUR_1970_preview_dyp_tender_auditors:0 "True Path Programme"
 COLDWAR_TUR_1970_preview_dyp_tender_auditors_desc:0 "Councils need qualified staff who can examine contracts and accounts. Professional auditing gives elected representatives a firmer basis on which to supervise local expenditure."
 COLDWAR_TUR_1970_preview_dyp_town_services:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_dyp_town_services_desc:0 "Municipalities need the resources to serve growing towns and new neighbourhoods. Local contractors and public authorities can extend practical services when they have the means to work together."
 COLDWAR_TUR_1970_preview_dyp_works_schedules:0 "True Path Programme"
 COLDWAR_TUR_1970_preview_dyp_works_schedules_desc:0 "Municipal contractors need dependable schedules and local suppliers if their works are to benefit residents. Local administration must follow construction through to delivery."
 COLDWAR_TUR_1970_preview_electrical_works:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_electrical_works_desc:0 "Motors, switchgear and industrial controls are indispensable to a modern workshop. Investment in electrical equipment will give domestic firms a wider place in the industrial plan, with technical education supporting the new production."
 COLDWAR_TUR_1970_preview_electrification:0 "National Programme"
 COLDWAR_TUR_1970_preview_electrification_desc:0 "Bring power and agricultural machinery to provincial farms and workshops. Pumps, repair services, and maintained equipment can raise production beyond the major projects, provided local communities can operate them."
 COLDWAR_TUR_1970_preview_engineering_priority:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_engineering_priority_desc:0 "The industrial plan requires engineers able to adapt machinery to Turkish conditions. Scholarships and applied teaching will place technical skill first in the next education allocation, while other institutions wait for their expansion."
 COLDWAR_TUR_1970_preview_enterprise_reform:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_enterprise_reform_desc:0 "Workers in public enterprises should have a meaningful voice in management and a share in improved productivity. Professional management and modern machinery can make public investment more effective."
 COLDWAR_TUR_1970_preview_enterprise_tax_relief:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_enterprise_tax_relief_desc:0 "Firms that keep more of their earnings can finance the next workshop and export order. The Treasury must accept a smaller immediate return and judge the policy by the productive investment it actually encourages."
 COLDWAR_TUR_1970_preview_enterprise_turn:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_enterprise_turn_desc:0 "A broad movement of enterprise, social justice, national solidarity and conservative opinion seeks a competitive economy. Public investment must give producers the transport, skills and security to reach wider markets."
 COLDWAR_TUR_1970_preview_eximbank:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_eximbank_desc:0 "Turkish manufacturers need finance and guarantees to compete for overseas contracts. An export-credit institution can support their orders, while the state accepts the cost and the risk of default."
 COLDWAR_TUR_1970_preview_expanded_war:0 "National Programme"
 COLDWAR_TUR_1970_preview_expanded_war_desc:0 "The war has given the government an opportunity to pursue ambitions far beyond the island. A wider claim can rally the demand for victory, but Ankara would be choosing a larger confrontation and a more costly peace."
 COLDWAR_TUR_1970_preview_export_diversification:0 "National Programme"
 COLDWAR_TUR_1970_preview_export_diversification_desc:0 "Broaden manufactured exports beyond a narrow agricultural base. New customers and products can strengthen foreign earnings, while production becomes more exposed to the demands of overseas markets."
 COLDWAR_TUR_1970_preview_export_turn:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_export_turn_desc:0 "Factories cannot prosper behind a narrow home market forever. Export finance and dependable transport can bring Turkish goods to new customers, but firms must learn to compete on quality and price rather than rely on permanent protection."
 COLDWAR_TUR_1970_preview_fair_procurement:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_fair_procurement_desc:0 "A social programme needs contracts the public can trust. Audited tenders and practical standards will direct orders towards useful production, while strengthening the institutions required to question favoured suppliers."
 COLDWAR_TUR_1970_preview_faith_mobilisation:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_faith_mobilisation_desc:0 "Our movement draws strength from families and associations that feel excluded from public life. A campaign of moral renewal can turn that loyalty into political influence, while sharpening disagreement with secular institutions and the military command."
 COLDWAR_TUR_1970_preview_financial_opening:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_financial_opening_desc:0 "Commercial firms seek access to finance and international business. A wider financial sector can attract investment, while exposure to external markets leaves Turkish firms vulnerable to sudden pressure."
 COLDWAR_TUR_1970_preview_fleet_construction:0 "National Programme"
 COLDWAR_TUR_1970_preview_fleet_construction_desc:0 "A sustained order can expand the shipyards and strengthen the Turkish fleet. New construction gives the services greater control over maintenance, but ties up capital that could support civilian industry."
 COLDWAR_TUR_1970_preview_foreign_service:0 "National Programme"
 COLDWAR_TUR_1970_preview_foreign_service_desc:0 "A professional diplomatic corps can defend Turkey's interests across the alliance and neighbouring regions. Skilled officials strengthen commercial negotiations and crisis communication while leaving each government free to make its own decisions."
 COLDWAR_TUR_1970_preview_fp_local_organisation:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_fp_local_organisation_desc:0 "The movement's local organisation must survive the loss of its former party. A new legal vehicle can reconnect experienced activists with voters, while requiring a fresh charter and institutions that answer for their own conduct."
 COLDWAR_TUR_1970_preview_fp_movement_discipline:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_fp_movement_discipline_desc:0 "Continuity will require a disciplined organisation able to resist fragmentation. A stronger party apparatus can preserve the movement's voice, while narrowing the room for local initiative and for those who seek a different course."
 COLDWAR_TUR_1970_preview_gap_irrigation:0 "National Programme"
 COLDWAR_TUR_1970_preview_gap_irrigation_desc:0 "Irrigation along the Middle Euphrates can make farm output less dependent on uncertain rainfall. Water allocation, village access, and maintenance must be settled carefully if the new system is to serve local producers."
 COLDWAR_TUR_1970_preview_gp_coops:0 "Republican Development Programme"
 COLDWAR_TUR_1970_preview_gp_coops_desc:0 "Families can gain scale without losing their own farms. Voluntary associations will share machinery and marketing facilities, with public assistance directed through accounts that members can inspect and challenge."
 COLDWAR_TUR_1970_preview_gp_costs:0 "Republican Development Programme"
 COLDWAR_TUR_1970_preview_gp_costs_desc:0 "A mixed economy must know what its factories actually cost. Technical inspection and standard accounts can identify waste in armaments contracts, at the price of another permanent demand for trained inspectors."
 COLDWAR_TUR_1970_preview_gp_exports:0 "Republican Development Programme"
 COLDWAR_TUR_1970_preview_gp_exports_desc:0 "The national plan must prepare firms to meet customers beyond a protected home market. Technical assistance and testing can improve their products without turning every export order into a permanent state subsidy."
 COLDWAR_TUR_1970_preview_gp_irrigation:0 "Republican Development Programme"
 COLDWAR_TUR_1970_preview_gp_irrigation_desc:0 "Improved water supply can give family farms a more dependable harvest. The programme will combine public works with agricultural guidance, allowing households and voluntary associations to decide how best to use the new capacity."
 COLDWAR_TUR_1970_preview_gp_plan:0 "Republican Development Programme"
 COLDWAR_TUR_1970_preview_gp_plan_desc:0 "Planning should direct scarce capital towards useful production without reducing the economy to a single form of ownership. A common investment framework can coordinate public enterprises and private firms while exposing both to closer scrutiny."
 COLDWAR_TUR_1970_preview_gp_private_firms:0 "Republican Development Programme"
 COLDWAR_TUR_1970_preview_gp_private_firms_desc:0 "Private firms should compete through production rather than privileged access to ministers. Investment credit can reward expansion and efficiency, with the state accepting a smaller immediate tax return on the earnings retained for growth."
 COLDWAR_TUR_1970_preview_gp_republic:0 "Republican Development Programme"
 COLDWAR_TUR_1970_preview_gp_republic_desc:0 "The Republic needs reform without surrendering its constitutional foundations. Public authority and private enterprise can both serve national development when institutions are strong enough to demand results from each."
 COLDWAR_TUR_1970_preview_gp_seed:0 "Republican Development Programme"
 COLDWAR_TUR_1970_preview_gp_seed_desc:0 "Water alone will not raise yields. Reliable seed, fertiliser and practical instruction can help cultivators make better use of their land, while requiring a sustained technical service rather than an occasional shipment."
 COLDWAR_TUR_1970_preview_gp_state_firms:0 "Republican Development Programme"
 COLDWAR_TUR_1970_preview_gp_state_firms_desc:0 "The state has already invested heavily in its enterprises. New machinery and firmer accounts can recover that investment, but the Treasury must finance the reorganisation before it can demand better performance."
 COLDWAR_TUR_1970_preview_grid_suppliers:0 "National Programme"
 COLDWAR_TUR_1970_preview_grid_suppliers_desc:0 "Develop Turkish suppliers for the generation and transmission programme. Domestic orders can build electrical engineering skills and support the national grid, provided firms meet demanding standards for reliability."
 COLDWAR_TUR_1970_preview_heavy_industry:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_heavy_industry_desc:0 "Turkey cannot remain a buyer of the machines on which every other industry depends. A sustained heavy-industry programme will concentrate public credit, engineering and production orders behind domestic capacity, with the Treasury carrying a bill that private firms cannot meet alone."
 COLDWAR_TUR_1970_preview_hp_capital_goods:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_hp_capital_goods_desc:0 "Public enterprises need modern equipment and a clear productive purpose. New industrial techniques can strengthen domestic machinery production and reduce the cost of future investment."
 COLDWAR_TUR_1970_preview_hp_cooperative_markets:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_hp_cooperative_markets_desc:0 "Farmers need fair access to markets, timely payment and the means to improve their harvests. Producer associations can bring transport, fertiliser and irrigation within the reach of smaller holdings."
 COLDWAR_TUR_1970_preview_hp_exports:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_hp_exports_desc:0 "Turkish producers need knowledge of foreign markets as well as the equipment to serve them. A common effort in industrial and agricultural marketing can improve export earnings without surrendering domestic capacity."
 COLDWAR_TUR_1970_preview_hp_people_sector:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_hp_people_sector_desc:0 "Cooperatives and joint enterprises can gather the savings of working families and put them to productive use. Supporting producer associations gives small enterprise a stronger place beside public and private industry."
 COLDWAR_TUR_1970_preview_hp_provincial_services:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_hp_provincial_services_desc:0 "Regional industry and agriculture cannot prosper without dependable connections to their markets. Public works can bring provincial producers into the national plan and support more balanced development."
 COLDWAR_TUR_1970_preview_hp_public_industry:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_hp_public_industry_desc:0 "The state must lead investment where heavy industry, energy and transport demand resources beyond the reach of individual firms. A public industrial project can give private workshops a more dependable foundation."
 COLDWAR_TUR_1970_preview_hp_social_security:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_hp_social_security_desc:0 "Public enterprise, private industry and the savings of working people each have a place in national development. A planned mixed economy can direct their resources toward production and a wider measure of social security."
 COLDWAR_TUR_1970_preview_imam_hatip_priority:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_imam_hatip_priority_desc:0 "Religious schools need capable teachers rather than promises of expansion alone. Training and appointments will answer the expectations of conservative families, while making the movement's educational ambitions more contentious within the secular state."
 COLDWAR_TUR_1970_preview_import_licences:0 "National Programme"
 COLDWAR_TUR_1970_preview_import_licences_desc:0 "Foreign currency cannot meet every request for machinery. Direct licences toward productive equipment and essential industrial inputs, supporting investment while requiring firms to compete for scarce imports."
 COLDWAR_TUR_1970_preview_industrial_compacts:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_industrial_compacts_desc:0 "Public orders can give Turkish suppliers the confidence to invest beyond a single project. Contracts will reward dependable production, while the state accepts the cost of building suppliers that cannot yet compete on price alone."
 COLDWAR_TUR_1970_preview_industrial_exports:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_industrial_exports_desc:0 "Turkish manufacturers need reliable machinery and skilled workers to meet foreign orders. Standards and technical training can help firms build a market abroad while the country remains dependent on imported equipment."
 COLDWAR_TUR_1970_preview_industrial_guarantees:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_industrial_guarantees_desc:0 "Guarantees should follow productive contracts rather than political promises. A specialist credit service will support firms supplying the industrial plan, while the Treasury remains responsible when a supported project fails."
 COLDWAR_TUR_1970_preview_institutional_accounts:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_institutional_accounts_desc:0 "Banks and public enterprises need clear responsibility for the funds entrusted to them. Separate accounts and firm investment rules will preserve their discretion, even if the Treasury forgoes the convenience of drawing all public balances into one pool."
 COLDWAR_TUR_1970_preview_joint_schools:0 "National Programme"
 COLDWAR_TUR_1970_preview_joint_schools_desc:0 "Bring the service schools together around staff work, communications, and operational planning. Shared exercises can improve coordination across the armed forces, provided the services commit instructors and modern facilities."
 COLDWAR_TUR_1970_preview_judicial_tenure:0 "National Programme"
 COLDWAR_TUR_1970_preview_judicial_tenure_desc:0 "Constitutional government requires courts that can judge public authority without waiting for permission. Secure tenure and adequate judicial administration give citizens a stronger remedy, while limiting the freedom of ministers and commanders to settle disputes by pressure."
 COLDWAR_TUR_1970_preview_just_order:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_just_order_desc:0 "Production, distribution and public finance must serve a more just order. The government will bring its industrial experience and provincial networks into a broader economic programme, promising productive investment without leaving social obligations to charity alone."
 COLDWAR_TUR_1970_preview_karakaya:0 "National Programme"
 COLDWAR_TUR_1970_preview_karakaya_desc:0 "Prepare another hydroelectric development on the Euphrates. Engineering, transmission, and site preparation can add future power capacity, while careful planning must account for villages, agriculture, and public finance."
 COLDWAR_TUR_1970_preview_landing_craft:0 "National Programme"
 COLDWAR_TUR_1970_preview_landing_craft_desc:0 "Fund landing craft suited to moving troops and supplies between the coast and nearby islands. Reliable lift improves the services' readiness, while specialised vessels add to procurement and maintenance costs."
 COLDWAR_TUR_1970_preview_licensed_supply:0 "National Programme"
 COLDWAR_TUR_1970_preview_licensed_supply_desc:0 "Production under licence can put proven weapons into Turkish service while our factories learn to maintain the designs. Foreign drawings and tooling shorten the road to dependable output, but supplier obligations and imported components leave less freedom for wholly Turkish production."
 COLDWAR_TUR_1970_preview_local_health:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_local_health_desc:0 "Local health services can spare families long journeys and neglected illness. Municipal clinics and reliable provision will extend care, with staff and supplies becoming a permanent public obligation."
 COLDWAR_TUR_1970_preview_local_skills:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_local_skills_desc:0 "Match technical instruction to the needs of provincial factories, farms, and transport networks. Training becomes productive when communities have equipment and workplaces where new skills can be used."
 COLDWAR_TUR_1970_preview_local_workshop_funds:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_local_workshop_funds_desc:0 "Partnership funds should leave visible workshops behind them. Patient investment and practical advice can give smaller producers the means to expand, while returns arrive more slowly than they would in trade and speculation."
 COLDWAR_TUR_1970_preview_mam:0 "National Programme"
 COLDWAR_TUR_1970_preview_mam_desc:0 "Expand applied research around the Marmara region and connect TUBITAK with universities and industry. New laboratories can turn scientific work into practical solutions, but require trained staff, equipment, and public funds."
 COLDWAR_TUR_1970_preview_mcp_apprentices:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mcp_apprentices_desc:0 "National production needs trained workers as much as slogans of independence. Apprenticeships linked to domestic factories will improve technical capacity, with public education supporting the firms taking new entrants."
 COLDWAR_TUR_1970_preview_mcp_civic_training:0 "Schools and Civic Life"
 COLDWAR_TUR_1970_preview_mcp_civic_training_desc:0 "A common civic education requires trained teachers as well as new books. The state must fund their preparation while recognising the strain that prescribed teaching places on independent thought."
 COLDWAR_TUR_1970_preview_mcp_family_security:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mcp_family_security_desc:0 "Workers and artisans should be able to depend on insurance in sickness and old age. Extend the programme through local institutions and provide for its continuing cost."
 COLDWAR_TUR_1970_preview_mcp_farm_machinery:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mcp_farm_machinery_desc:0 "Local machinery and maintenance can connect more productive farms with regional processing. Training and reliable equipment will make investment in agricultural towns useful."
 COLDWAR_TUR_1970_preview_mcp_foreign_markets:0 "Workers Abroad"
 COLDWAR_TUR_1970_preview_mcp_foreign_markets_desc:0 "Turkish firms need practical knowledge of foreign markets and dependable commercial contacts. Support exporters without neglecting the citizens whose work has built those connections."
 COLDWAR_TUR_1970_preview_mcp_industrial_inputs:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mcp_industrial_inputs_desc:0 "Turkish industry remains vulnerable when its essential materials and equipment must come from abroad. Domestic suppliers will take a larger place in national production through a funded intermediate-goods programme."
 COLDWAR_TUR_1970_preview_mcp_insurance:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mcp_insurance_desc:0 "National solidarity must reach households whose livelihood is insecure. A programme for workers and artisans can broaden the movement's social base, while giving the state another obligation it must finance in difficult years."
 COLDWAR_TUR_1970_preview_mcp_national_curriculum:0 "Schools and Civic Life"
 COLDWAR_TUR_1970_preview_mcp_national_curriculum_desc:0 "The schools shape the nation's future as surely as its factories. A national curriculum will give history, language and civic duty greater weight, while a narrower public debate carries a political cost."
 COLDWAR_TUR_1970_preview_mcp_national_sector:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mcp_national_sector_desc:0 "Workers, public employees, artisans and farmers can pool savings in enterprises they jointly own. A nation sector can mobilise small investors alongside public and private enterprise."
 COLDWAR_TUR_1970_preview_mcp_parliament:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mcp_parliament_desc:0 "The movement's return to legal politics requires an organisation capable of working through representative institutions. Provincial cadres can preserve their national programme while accepting the discipline of parliamentary competition."
 COLDWAR_TUR_1970_preview_mcp_return_savings:0 "Workers Abroad"
 COLDWAR_TUR_1970_preview_mcp_return_savings_desc:0 "Citizens who have worked abroad should be able to invest their savings in firms at home. Better information and productive contracts can make their return an opportunity for Turkish industry."
 COLDWAR_TUR_1970_preview_mcp_technical_schools:0 "Schools and Civic Life"
 COLDWAR_TUR_1970_preview_mcp_technical_schools_desc:0 "Turkey needs technicians for farms, factories and public services. Direct the education budget towards practical instruction and equipment for vocational schools."
 COLDWAR_TUR_1970_preview_mcp_worker_savings:0 "Nation Sector"
 COLDWAR_TUR_1970_preview_mcp_worker_savings_desc:0 "Workers and employees should be able to pool savings and become shareholders in productive enterprises. Their investment can widen ownership while supplying Turkish industry."
 COLDWAR_TUR_1970_preview_mcp_workers_abroad:0 "Workers Abroad"
 COLDWAR_TUR_1970_preview_mcp_workers_abroad_desc:0 "Turkish workers abroad need effective support as they face difficult employment and family conditions. Consular services should defend their interests and help those who choose to return."
 COLDWAR_TUR_1970_preview_mcp_workshop_supply:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mcp_workshop_supply_desc:0 "Small workshops need affordable equipment and trained hands. Local purchasing associations can join apprenticeships to a practical supply of tools and materials."
 COLDWAR_TUR_1970_preview_mechanised_force:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mechanised_force_desc:0 "A mobile army needs workshops as much as fighting vehicles. Concentrated procurement will support mechanised formations, while complex equipment demands spare parts and longer technical training."
 COLDWAR_TUR_1970_preview_merit_promotions:0 "National Programme"
 COLDWAR_TUR_1970_preview_merit_promotions_desc:0 "Appointments at the top of the services shape the ambitions of every officer below. A permanent promotions board can favour competence and continuity, but ministers must be ready to withstand the objections of officers accustomed to choosing their own successors."
 COLDWAR_TUR_1970_preview_mhp_artisan_training:0 "Solidarity Investment"
 COLDWAR_TUR_1970_preview_mhp_artisan_training_desc:0 "Young workers need the practical skills of experienced artisans. Training in the workshop can strengthen small enterprise and improve the quality of Turkish production."
 COLDWAR_TUR_1970_preview_mhp_coop_credit:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mhp_coop_credit_desc:0 "Artisans and small producers cannot compete when working capital is scarce. Cooperative credit and shared purchasing can give their enterprises room to modernise."
 COLDWAR_TUR_1970_preview_mhp_coop_machinery:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mhp_coop_machinery_desc:0 "Local producers need repair workshops and trained technicians as well as credit. Cooperative investment can bring machinery services closer to the farms and artisans that use them."
 COLDWAR_TUR_1970_preview_mhp_coop_supply:0 "Producer Cooperatives"
 COLDWAR_TUR_1970_preview_mhp_coop_supply_desc:0 "Artisan and farmer cooperatives can buy equipment together and reduce the cost of maintaining it. Local purchasing gives small producers a stronger position in the market."
 COLDWAR_TUR_1970_preview_mhp_cooperative_funds:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mhp_cooperative_funds_desc:0 "Bring producers and artisans together to finance workshops, housing and credit. Cooperative capital can support local enterprise, but public guarantees must be funded and carefully supervised."
 COLDWAR_TUR_1970_preview_mhp_export_bank:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mhp_export_bank_desc:0 "Turkish producers need dependable credit and sales abroad. A national export programme can connect industrial investment with foreign markets and earn the exchange needed for machinery."
 COLDWAR_TUR_1970_preview_mhp_family_insurance:0 "Solidarity Investment"
 COLDWAR_TUR_1970_preview_mhp_family_insurance_desc:0 "National solidarity must reach workers and their families when illness or injury interrupts a wage. Extend insurance coverage, accepting the continuing cost to the social budget."
 COLDWAR_TUR_1970_preview_mhp_national_service:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mhp_national_service_desc:0 "National independence depends on a capable state and armed forces prepared to defend the republic. Support training and the institutions responsible for national security."
 COLDWAR_TUR_1970_preview_mhp_restored:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mhp_restored_desc:0 "Recovering the historic name must be followed by a programme that can govern. Domestic maintenance and industrial contracts will bind the restored organisation to production that can be judged by practical results."
 COLDWAR_TUR_1970_preview_mhp_share_exports:0 "Popular Shareholding"
 COLDWAR_TUR_1970_preview_mhp_share_exports_desc:0 "Shareholder firms need buyers beyond their home markets. Technical preparation and common commercial services can help provincial industry compete abroad."
 COLDWAR_TUR_1970_preview_mhp_share_industry:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mhp_share_industry_desc:0 "Local savings can give provincial investors a lasting stake in Turkish production. Workshops with reliable machinery and contracts will carry popular shareholding beyond the largest industrial centres."
 COLDWAR_TUR_1970_preview_mhp_worker_insurance:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mhp_worker_insurance_desc:0 "Workers cannot build a dependable national economy while their families remain without protection. Wider insurance and safer employment will extend security alongside production, with public spending supporting the commitment."
 COLDWAR_TUR_1970_preview_mhp_workplace_safety:0 "Solidarity Investment"
 COLDWAR_TUR_1970_preview_mhp_workplace_safety_desc:0 "Insurance is strongest when factories also prevent injury. Training foremen and inspectors can improve the organisation of work and protect the families who depend on it."
 COLDWAR_TUR_1970_preview_mke_production:0 "National Programme"
 COLDWAR_TUR_1970_preview_mke_production_desc:0 "A Turkish production base requires more than an order for finished weapons. MKE must finance tooling, train suppliers and keep its workshops busy through long contracts. The bill is heavier than buying a proven design, but the country gains workshops that answer to Ankara."
 COLDWAR_TUR_1970_preview_mnp_chambers:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_mnp_chambers_desc:0 "Small merchants and craftsmen should be heard alongside the great industrial groups. Provincial chambers can bring their experience into public policy, provided the movement supplies practical advice rather than merely asking for loyalty."
 COLDWAR_TUR_1970_preview_mobilised_nation:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mobilised_nation_desc:0 "Give national service, preparation, and organised mobilisation a central place in public life. The armed forces gain trained personnel, while civilian institutions and social services receive less of the state's attention."
 COLDWAR_TUR_1970_preview_motor_priority:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_motor_priority_desc:0 "Engines and transmissions connect industrial ambition to transport, farming and national defence. A concentrated production order can build that capability, while imported tooling still absorbs foreign exchange during the first stage."
 COLDWAR_TUR_1970_preview_mountain_schools:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_mountain_schools_desc:0 "Much of Turkey demands troops and officers able to operate in mountainous terrain. Specialist schools will strengthen field readiness through experienced instructors and suitable training grounds."
 COLDWAR_TUR_1970_preview_movement_charter:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_movement_charter_desc:0 "The movement needs an organisation capable of surviving scrutiny as well as winning an audience. A precise charter, trained provincial officers and a permanent legal service will defend its place in public life without placing every dispute in the hands of a single leader."
 COLDWAR_TUR_1970_preview_msp_coalition_work:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_msp_coalition_work_desc:0 "A coalition must be judged by what its ministries accomplish. Coordinated tenders and investment timetables will turn the party's industrial commitments into work that can continue through cabinet disagreements."
 COLDWAR_TUR_1970_preview_municipal_provision:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_municipal_provision_desc:0 "Public service must reach the neighbourhood as well as the lecture hall. Waterworks and practical municipal administration can make the movement's promise of social renewal visible in ordinary household life."
 COLDWAR_TUR_1970_preview_national_development_bank:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_national_development_bank_desc:0 "Anatolian production needs long-term capital that can serve farms and workshops together. A national development bank will direct public funds towards these investments, with professional oversight responsible for their risks."
 COLDWAR_TUR_1970_preview_national_outlook:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_national_outlook_desc:0 "Our towns need workshops, our villages need opportunity, and the Republic needs an economy that answers to its own people. Millî Görüş will join industrial ambition to religious conviction and give provincial producers a stronger voice in national development."
 COLDWAR_TUR_1970_preview_nato_interoperability:0 "National Programme"
 COLDWAR_TUR_1970_preview_nato_interoperability_desc:0 "Align staff procedures and communications with the standards used by Turkey's allies. Better coordination strengthens joint defence planning, while specialist instruction and compatible equipment demand sustained investment."
 COLDWAR_TUR_1970_preview_nine_lights:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_nine_lights_desc:0 "The Nine Lights bind Turkish nationalism to social solidarity, science, rural development and modern industry. National independence and a strong state must give those principles political purpose."
 COLDWAR_TUR_1970_preview_officer_colleges:0 "National Programme"
 COLDWAR_TUR_1970_preview_officer_colleges_desc:0 "An officer educated alongside engineers, administrators and civilian scholars has more than one language in which to discuss the Republic. Joint teaching and professional study can strengthen the services without making political intervention the measure of military honour."
 COLDWAR_TUR_1970_preview_open_procurement:0 "National Programme"
 COLDWAR_TUR_1970_preview_open_procurement_desc:0 "Defence orders should purchase useful equipment rather than political protection. Competitive contracts and published accounts can reward reliable suppliers, although breaking established arrangements will require money, inspectors and sustained parliamentary attention."
 COLDWAR_TUR_1970_preview_parliament:0 "National Programme"
 COLDWAR_TUR_1970_preview_parliament_desc:0 "The Grand National Assembly should supervise defence appointments and public spending. Stronger parliamentary oversight affirms the authority of elected representatives, while challenging officers accustomed to a direct voice in government."
 COLDWAR_TUR_1970_preview_parliamentary_nationalism:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_parliamentary_nationalism_desc:0 "Pursue the nationalist programme through parliamentary negotiation and wider civilian cooperation. A stable majority can support development and public order, but requires compromise with other parties and commercial interests."
 COLDWAR_TUR_1970_preview_participation_funds:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_participation_funds_desc:0 "Finance shaped by partnership can attract savers unwilling to rely on interest-bearing lending. Production funds will share risks and returns, with public oversight needed to keep religious confidence from becoming a substitute for sound accounts."
 COLDWAR_TUR_1970_preview_private_enterprise:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_private_enterprise_desc:0 "Private firms seek credit and investment incentives to expand beyond established commercial centres. A broader enterprise economy promises new production, while concessions reduce the Treasury’s immediate return."
 COLDWAR_TUR_1970_preview_productive_credit:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_productive_credit_desc:0 "Credit should create goods and employment rather than reward the circulation of money alone. Funded production contracts can direct finance towards workshops and farms, while placing a larger share of investment risk on public institutions."
 COLDWAR_TUR_1970_preview_professional_command:0 "National Programme"
 COLDWAR_TUR_1970_preview_professional_command_desc:0 "Professional standards and education can give officers a respected career within a constitutional republic. Promotions based on service and expertise reduce factional competition while keeping the armed forces an effective national institution."
 COLDWAR_TUR_1970_preview_provincial_accounts:0 "National Programme"
 COLDWAR_TUR_1970_preview_provincial_accounts_desc:0 "A national settlement must reach beyond Ankara. Common accounts and trained provincial auditors can bring local expenditure into the parliamentary budget, replacing discretionary transfers with institutions that the government must defend in public."
 COLDWAR_TUR_1970_preview_provincial_capital:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_provincial_capital_desc:0 "Industry and agriculture beyond the main centres need access to development capital. Investment in provincial production can broaden the foundations of growth if public allocations are administered carefully."
 COLDWAR_TUR_1970_preview_provincial_enterprise:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_provincial_enterprise_desc:0 "Provincial merchants and manufacturers need capital on terms that recognise the scale of their businesses. A funded enterprise programme will spread investment beyond the established industrial centres, with public guarantees carrying part of the risk."
 COLDWAR_TUR_1970_preview_provincial_firms:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_provincial_firms_desc:0 "Anatolian producers need commercial advice, accounting and connections to national buyers. Stronger local firms can keep more of the benefits of investment in the provinces."
 COLDWAR_TUR_1970_preview_public_cash_pool:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_public_cash_pool_desc:0 "Public institutions should not borrow expensively while other public balances lie idle. A common cash pool can give the Treasury greater room to manage its obligations, but participating banks and enterprises lose discretion over funds they once held themselves."
 COLDWAR_TUR_1970_preview_public_holdings:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_public_holdings_desc:0 "A mixed economy needs strong public industry and the capacity to make machinery at home. Direct investment in productive capacity can reduce dependence on imported equipment and support a wider industrial plan."
 COLDWAR_TUR_1970_preview_regional_contracting:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_regional_contracting_desc:0 "Provincial construction can build up Turkish contractors and their suppliers as well as roads and public facilities. Contracts should leave behind experienced firms and productive workshops."
 COLDWAR_TUR_1970_preview_regional_shareholding:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_regional_shareholding_desc:0 "Workers, farmers, traders and craftsmen can become investors in the industries built around them. Regional shareholding will join local savings to state credit and infrastructure, giving production a broader base of ownership."
 COLDWAR_TUR_1970_preview_religious_education:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_religious_education_desc:0 "The movement sees no lasting national revival without both practical knowledge and religious conviction. Technical teaching and religious institutions will develop together, with the education budget carrying the cost of a broader public role."
 COLDWAR_TUR_1970_preview_religious_institutes:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_religious_institutes_desc:0 "Religious education needs institutions able to train its own scholars and public teachers. A larger system will strengthen the movement's social foundations, while requiring a lasting place in the state's education budget."
 COLDWAR_TUR_1970_preview_repair_spares:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_repair_spares_desc:0 "Machines must keep working after the first purchase has been celebrated. Domestic repair services and dependable spare parts can reduce costly stoppages, while creating skilled work throughout the supplier network."
 COLDWAR_TUR_1970_preview_road_market:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_road_market_desc:0 "The national road system can bring provincial producers into larger markets. Connections between towns and industrial centres will determine whether investment reaches beyond the coastal cities."
 COLDWAR_TUR_1970_preview_rural_schools:0 "National Programme"
 COLDWAR_TUR_1970_preview_rural_schools_desc:0 "Too many districts remain distant from secondary and technical education. Extend rural schools and provide trained staff so young people beyond the cities can take part in modern agriculture and industry."
 COLDWAR_TUR_1970_preview_service_capital:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_service_capital_desc:0 "Shipping, insurance and financial services can draw international business through Istanbul. The city gains new employment and foreign contacts, while the government accepts a greater dependence on confidence in markets beyond its own control."
 COLDWAR_TUR_1970_preview_service_charter:0 "National Programme"
 COLDWAR_TUR_1970_preview_service_charter_desc:0 "Clear duties and dependable promotion rules can bind the services to their professional responsibilities. The officers retain their constitutional influence, but the government begins to replace personal arrangements with a durable statute."
 COLDWAR_TUR_1970_preview_service_colleges:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_service_colleges_desc:0 "National institutions need officers and public servants prepared for complex duties. Service colleges and technical teaching will improve that preparation, while instructors and equipment require dependable funding."
 COLDWAR_TUR_1970_preview_service_contracts:0 "National Programme"
 COLDWAR_TUR_1970_preview_service_contracts_desc:0 "Direct procurement funds toward equipment and services required by the armed forces. Domestic workshops gain dependable orders, while the treasury and civilian ministries bear the cost of a service-led industrial policy."
 COLDWAR_TUR_1970_preview_shp_artisan_cooperatives:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_shp_artisan_cooperatives_desc:0 "Artisans and small workshops need affordable equipment and a new generation of skilled workers. Cooperative investment and vocational instruction can help them modernise while preserving independent livelihoods."
 COLDWAR_TUR_1970_preview_shp_bargaining:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_shp_bargaining_desc:0 "Workers and public employees need effective union rights and a voice at work. Secure collective bargaining can give working families a fairer share in national development."
 COLDWAR_TUR_1970_preview_shp_city_schools:0 "SHP programme"
 COLDWAR_TUR_1970_preview_shp_city_schools_desc:0 "Education must give every child a genuine opportunity to develop. A sustained commitment to teachers and learning can strengthen the social foundation of democracy."
 COLDWAR_TUR_1970_preview_shp_equal_rights:0 "SHP programme"
 COLDWAR_TUR_1970_preview_shp_equal_rights_desc:0 "Citizens must be able to take part in public life without discrimination. A social democracy is stronger when all communities enjoy equal protection and a fair chance to work."
 COLDWAR_TUR_1970_preview_shp_investment:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_shp_investment_desc:0 "A democratic social market must combine productive industry with fair wages and employment. Investment in local infrastructure can bring new work to communities left behind by uneven growth."
 COLDWAR_TUR_1970_preview_shp_labour_standards:0 "SHP programme"
 COLDWAR_TUR_1970_preview_shp_labour_standards_desc:0 "Turkish workers deserve secure rights and decent conditions in a changing international economy. Stronger workplace representation can bring our public commitments closer to the standards expected of a modern democracy."
 COLDWAR_TUR_1970_preview_shp_regional_connections:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_shp_regional_connections_desc:0 "New workplaces need connections to suppliers, customers and public services. A programme of regional works can make productive investment useful to the surrounding communities."
 COLDWAR_TUR_1970_preview_shp_regional_jobs:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_shp_regional_jobs_desc:0 "Communities in the eastern and southeastern provinces need productive work and equal access to opportunity. Regional investment can bring jobs and public services closer to families across the country."
 COLDWAR_TUR_1970_preview_shp_social_centres:0 "SHP programme"
 COLDWAR_TUR_1970_preview_shp_social_centres_desc:0 "Social protection is useful only when households can reach it. Local service offices can help families obtain support and make public institutions more responsive."
 COLDWAR_TUR_1970_preview_shp_social_insurance:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_shp_social_insurance_desc:0 "Unemployment, illness and old age must not leave families without protection. Broader social insurance and local provision can give working people a more dependable measure of security."
 COLDWAR_TUR_1970_preview_shp_technology:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_shp_technology_desc:0 "Turkey must acquire advanced technology and develop the ability to produce it. Investment in research and technical education can give industry new capabilities and skilled workers."
 COLDWAR_TUR_1970_preview_shp_urban_services:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_shp_urban_services_desc:0 "A growing city needs roads and local services that reach its working neighbourhoods. Municipal investment can create a stronger foundation for housing, public health and employment."
 COLDWAR_TUR_1970_preview_shp_wage_bargaining:0 "SHP programme"
 COLDWAR_TUR_1970_preview_shp_wage_bargaining_desc:0 "Working people need effective collective representation and a fair return for their labour. A democratic workplace gives workers a stronger voice in the decisions that shape their lives."
 COLDWAR_TUR_1970_preview_social_pact:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_social_pact_desc:0 "Small producers need a stronger position in markets and access to services. A cooperative development programme can pool their resources and strengthen local administration alongside private enterprise."
 COLDWAR_TUR_1970_preview_social_republic:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_social_republic_desc:0 "Provincial production will command lasting public support when education, health and municipal services advance alongside it. A broader social settlement can strengthen democratic government, while committing the state beyond a single investment plan."
 COLDWAR_TUR_1970_preview_sodep_civic_participation:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_sodep_civic_participation_desc:0 "A free republic needs independent associations and citizens who can take part in public affairs. Local organisations and professional bodies can make democratic government more responsive to the people it serves."
 COLDWAR_TUR_1970_preview_sodep_local:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_sodep_local_desc:0 "Social democracy must grow through elected local associations and practical public services. Municipal investment can connect the rights of citizens with the everyday needs of urban and provincial communities."
 COLDWAR_TUR_1970_preview_sodep_productive_employment:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_sodep_productive_employment_desc:0 "Social justice must rest on productive work as well as fair distribution. Public investment can help provincial enterprise create jobs and give local communities a stronger economic base."
 COLDWAR_TUR_1970_preview_sodep_professional_training:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_sodep_professional_training_desc:0 "Municipalities and local industry need engineers, teachers and skilled technicians. Technical education can help communities maintain their services and make better use of investment."
 COLDWAR_TUR_1970_preview_state_banks:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_preview_state_banks_desc:0 "Public banks can place long-term capital behind industrial works and provincial production where private investment is scarce. The Treasury must carry the risks of the projects it supports."
 COLDWAR_TUR_1970_preview_submarine_school:0 "National Programme"
 COLDWAR_TUR_1970_preview_submarine_school_desc:0 "A capable submarine service depends on experienced crews, engineers, and disciplined maintenance. Expand technical training so the fleet can use its boats effectively and keep them in service."
 COLDWAR_TUR_1970_preview_supervised_elections:0 "National Programme"
 COLDWAR_TUR_1970_preview_supervised_elections_desc:0 "Keep parliamentary competition within an understanding that reassures the general staff. Elections can sustain a civilian mandate, but limits imposed from outside the Assembly leave the government vulnerable to pressure."
 COLDWAR_TUR_1970_preview_targeted_security:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_targeted_security_desc:0 "Economic opening will not command lasting support if every adjustment falls on households with the least protection. Targeted assistance can preserve social consent while keeping a permanent claim on the public budget."
 COLDWAR_TUR_1970_preview_tbkp_civic_rights:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tbkp_civic_rights_desc:0 "Workers, women and every community must be able to organise and take part in public decisions. A free political life requires equal rights and institutions that answer to citizens."
 COLDWAR_TUR_1970_preview_tbkp_planning:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tbkp_planning_desc:0 "National development needs public priorities and investment, but markets and a wider distribution of ownership also have a place in economic life. The government must decide where to direct its limited investment first."
 COLDWAR_TUR_1970_preview_tbkp_public_industry:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tbkp_public_industry_desc:0 "Modern productive enterprises require investment beyond their present resources. Public capital can renew capacity while leaving room for other forms of ownership within a democratic economic plan."
 COLDWAR_TUR_1970_preview_tbkp_public_technology:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tbkp_public_technology_desc:0 "Public investment must be matched by engineers and trained workers. Technical instruction can improve the capacity of Turkish enterprises to maintain and develop their equipment."
 COLDWAR_TUR_1970_preview_tbkp_small_producers:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tbkp_small_producers_desc:0 "Wider ownership needs access to credit and productive equipment. Support small producers and their associations so that economic opportunity reaches beyond the largest enterprises."
 COLDWAR_TUR_1970_preview_tbkp_workplace_plan:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tbkp_workplace_plan_desc:0 "Workers and technical staff should have a direct voice in the enterprises that shape their livelihoods. Their knowledge can improve production and make economic decisions more accountable."
 COLDWAR_TUR_1970_preview_teacher_posts:0 "National Programme"
 COLDWAR_TUR_1970_preview_teacher_posts_desc:0 "Rural schools need trained teachers as well as classrooms. Fund provincial posts and technical instruction so that young people beyond the main cities can gain the skills required by agriculture and industry."
 COLDWAR_TUR_1970_preview_technical_colleges:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_technical_colleges_desc:0 "Factories, farms and public works need trained specialists close to the communities they serve. Provincial colleges will broaden practical teaching, with laboratories and instructors making a continuing claim on the education budget."
 COLDWAR_TUR_1970_preview_technical_teachers:0 "National Programme"
 COLDWAR_TUR_1970_preview_technical_teachers_desc:0 "Rural schools and colleges need instructors as well as buildings. Train and retain technical teachers so students can gain the practical skills required by modern production and public services."
 COLDWAR_TUR_1970_preview_territorial_defence:0 "National Development Programme"
 COLDWAR_TUR_1970_preview_territorial_defence_desc:0 "Turkey must be able to defend difficult terrain as well as its principal roads. Provincial formations and specialist instruction will strengthen territorial readiness, with administration and training sustaining the commitment."
 COLDWAR_TUR_1970_preview_thermal_reserve:0 "National Programme"
 COLDWAR_TUR_1970_preview_thermal_reserve_desc:0 "Thermal power can supply electricity when hydroelectric output falters. Reserve generation for the grid and industry, accepting greater fuel imports and pollution as the cost of dependable supply."
 COLDWAR_TUR_1970_preview_tip75_plan_machinery:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip75_plan_machinery_desc:0 "A plan for democratic renewal needs workshops capable of supplying Turkish producers. Public machinery investment can connect skilled employment with national development."
 COLDWAR_TUR_1970_preview_tip75_rural_stations:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip75_rural_stations_desc:0 "Rural producers need access to tractors and skilled maintenance without bearing the entire cost individually. Public stations can make machinery available across farming districts."
 COLDWAR_TUR_1970_preview_tip_banking:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_banking_desc:0 "Credit determines which ambitions become factories and which remain promises. Public control of the principal banks can put national development first, while obliging the state to finance and administer the institutions it now directs."
 COLDWAR_TUR_1970_preview_tip_farm_coops:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_farm_coops_desc:0 "Small farmers need credit, storage and a fair route to market. Voluntary producer cooperatives can strengthen their bargaining position while keeping control in the hands of members."
 COLDWAR_TUR_1970_preview_tip_industrial_labs:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_industrial_labs_desc:0 "Public steelworks need engineers, machine tools and chemical supplies. Research connected to domestic production can reduce dependence on imported equipment."
 COLDWAR_TUR_1970_preview_tip_industrial_plan:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_industrial_plan_desc:0 "The labour movement must be able to deliver production as well as demand a fairer share. Long investment contracts and technical training will consolidate an industrial plan whose results can be judged by the people it serves."
 COLDWAR_TUR_1970_preview_tip_institutes:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_institutes_desc:0 "The village needs teachers who can join education to practical improvement. Institutes rooted in rural life can spread technical knowledge and give communities a stronger place in the Republic's scientific and cultural development."
 COLDWAR_TUR_1970_preview_tip_insurance:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_insurance_desc:0 "Industrial development should not leave a household destitute after injury, illness or unemployment. Broader social insurance can give working families greater security, with contributions and public expenditure sustaining the promise."
 COLDWAR_TUR_1970_preview_tip_labour:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_labour_desc:0 "A republic of equal citizens must hear the people whose labour sustains it. The workers' party will use public authority to strengthen labour, defend civil rights and challenge the concentration of economic power."
 COLDWAR_TUR_1970_preview_tip_legal_network:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_legal_network_desc:0 "A new legal organisation must reconnect workers, local officers and professional supporters whose earlier party was closed. Institutions that survive scrutiny will give the labour programme a firmer public base."
 COLDWAR_TUR_1970_preview_tip_machinery:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_machinery_desc:0 "Agricultural credit should reach those who work modest holdings, not only those who can already offer security to a bank. Machinery services and funded lending can increase production while placing more of the initial risk on public institutions."
 COLDWAR_TUR_1970_preview_tip_management:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_management_desc:0 "Workers know the faults of a workshop long before an inspector arrives. Representation in management can turn that knowledge into better production, while requiring time, training and a negotiated division of authority."
 COLDWAR_TUR_1970_preview_tip_planning:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_planning_desc:0 "Investment should answer to social need as well as private return. Democratic planning can direct capital towards productive work, provided public institutions are equipped to hear workers and producers rather than merely issue instructions."
 COLDWAR_TUR_1970_preview_tip_producer_control:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_producer_control_desc:0 "Participation needs resources that producers can direct themselves. A funded investment programme will give cooperatives a stronger position, while making public credit responsible for projects that may take years to repay."
 COLDWAR_TUR_1970_preview_tip_public_investment:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_public_investment_desc:0 "The commanding industries require capital that serves a long national purpose. A publicly financed plant can expand production beyond the priorities of the largest private groups, at a substantial cost to the Treasury."
 COLDWAR_TUR_1970_preview_tip_public_technology:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_public_technology_desc:0 "Public industry must develop the technical capacity to answer its critics. Applied research and professional training can improve production without reducing workers' participation to a ceremonial role."
 COLDWAR_TUR_1970_preview_tip_small_farmers:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_small_farmers_desc:0 "A small cultivator should not face large creditors and merchants alone. Cooperative credit and shared equipment can improve the position of rural households while preserving personal property and the work of the family farm."
 COLDWAR_TUR_1970_preview_tip_steel_priority:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_steel_priority_desc:0 "A productive national economy needs domestic steel and engineering capacity. Public investment will strengthen the industries supplying the machinery on which Turkish development depends."
 COLDWAR_TUR_1970_preview_tip_union_security:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_preview_tip_union_security_desc:0 "The right to organise must have practical force in the workplace. Collective bargaining and broader insurance can give workers security and a stronger voice in production."
 COLDWAR_TUR_1970_preview_tkp_alliance:0 "National Democratic Programme"
 COLDWAR_TUR_1970_preview_tkp_alliance_desc:0 "A government claiming a popular revolution must bring factory workers and rural labourers into a common programme. Agricultural assistance and organised public provision can widen that alliance, while committing the state to demands it can no longer dismiss."
 COLDWAR_TUR_1970_preview_tkp_banks:0 "National Democratic Programme"
 COLDWAR_TUR_1970_preview_tkp_banks_desc:0 "The principal banks place investment at the service of a narrow circle of owners. Bringing them into public hands will give the new government control over credit, together with the responsibility for their liabilities and daily administration."
 COLDWAR_TUR_1970_preview_tkp_development:0 "National Democratic Programme"
 COLDWAR_TUR_1970_preview_tkp_development_desc:0 "The party must make reconstruction visible in everyday production. A consolidated industrial programme will direct public capital into workshops and technical capacity, accepting the cost of proving that the new order can provide more than political declarations."
 COLDWAR_TUR_1970_preview_tkp_education:0 "National Democratic Programme"
 COLDWAR_TUR_1970_preview_tkp_education_desc:0 "A new system cannot depend forever on inherited expertise. Technical colleges and workplace teaching will prepare workers to operate and direct complex production, with a lasting education budget supporting the change."
 COLDWAR_TUR_1970_preview_tkp_farm_machinery:0 "National Democratic Programme"
 COLDWAR_TUR_1970_preview_tkp_farm_machinery_desc:0 "Rural producers need equipment they can maintain and use throughout the season. Machinery supply and repair instruction will connect higher output to practical services in the villages."
 COLDWAR_TUR_1970_preview_tkp_front:0 "National Democratic Programme"
 COLDWAR_TUR_1970_preview_tkp_front_desc:0 "The revolutionary government needs a broader alliance than its clandestine organisation alone. A popular front can bring workers, peasants and sympathetic professionals into public life, but its social commitments will place further claims on the budget."
 COLDWAR_TUR_1970_preview_tkp_industry:0 "National Democratic Programme"
 COLDWAR_TUR_1970_preview_tkp_industry_desc:0 "The new order will be judged by whether public industry can keep the country supplied. Reorganisation of the largest enterprises can concentrate investment, but interrupted management and training must be paid for before the promise of higher output is realised."
 COLDWAR_TUR_1970_preview_tkp_plan:0 "National Democratic Programme"
 COLDWAR_TUR_1970_preview_tkp_plan_desc:0 "Public ownership must be joined to a workable production plan. Reliable standards, investment schedules and supplies can make the factories more consistent, while imposing greater demands on the institutions coordinating them."
 COLDWAR_TUR_1970_preview_tkp_public_steel:0 "National Democratic Programme"
 COLDWAR_TUR_1970_preview_tkp_public_steel_desc:0 "Place steel and engineering at the centre of a public production plan. Heavy industry can supply the machines needed by agriculture, transport and other factories."
 COLDWAR_TUR_1970_preview_tkp_rural_credit:0 "National Democratic Programme"
 COLDWAR_TUR_1970_preview_tkp_rural_credit_desc:0 "The rural alliance requires capital on terms that cultivators can meet. Collective purchasing and public credit will expand access to equipment, while the state carries more of the risk of poor harvests and unpaid advances."
 COLDWAR_TUR_1970_preview_tkp_stations:0 "National Democratic Programme"
 COLDWAR_TUR_1970_preview_tkp_stations_desc:0 "A network of machinery stations can put equipment within reach of farms unable to buy their own. Workshops and trained crews will make this a permanent service, with the public sector responsible for keeping it supplied."
 COLDWAR_TUR_1970_preview_tkp_underground:0 "National Democratic Programme"
 COLDWAR_TUR_1970_preview_tkp_underground_desc:0 "The cadres who sustained the clandestine party must now build public institutions. A government born from confrontation cannot live on its underground discipline alone; it must organise the officials, workers and local committees who will carry its authority into everyday life."
 COLDWAR_TUR_1970_preview_tkp_workplace_training:0 "National Democratic Programme"
 COLDWAR_TUR_1970_preview_tkp_workplace_training_desc:0 "A planned economy needs skilled workers who can maintain and improve its machinery. Technical schools and workshop instruction will prepare the workforce for industrial production."
 COLDWAR_TUR_1970_preview_tool_priority:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_tool_priority_desc:0 "A machine-making industry can serve factories far beyond its own gates. Precision tools and trained operators deserve the first claim on investment, even if this leaves fewer funds for a rapid expansion of finished motor production."
 COLDWAR_TUR_1970_preview_trade_standards:0 "National Programme"
 COLDWAR_TUR_1970_preview_trade_standards_desc:0 "Turkish firms seeking European markets must meet demanding product and commercial standards. Laboratories, inspection services, and export advice can make that transition practical, though public agencies must bear the cost."
 COLDWAR_TUR_1970_preview_transmission_works:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_transmission_works_desc:0 "An engine line is only as dependable as its suppliers. Training and component contracts will strengthen the firms producing transmissions, bearings and replacement parts for the new works."
 COLDWAR_TUR_1970_preview_tusas:0 "National Programme"
 COLDWAR_TUR_1970_preview_tusas_desc:0 "Prepare a Turkish aircraft industry capable of overhaul, assembly, and engineering work. A trained workforce and careful technical partnerships can strengthen air readiness before Ankara commits to costly domestic production."
 COLDWAR_TUR_1970_preview_university_research:0 "Republican Social Programme"
 COLDWAR_TUR_1970_preview_university_research_desc:0 "Turkish universities need laboratories and scientific careers capable of supporting advanced industry. A sustained research allocation can build this capacity, while competing with the immediate demand for technical colleges and provincial instruction."
 COLDWAR_TUR_1970_preview_urban_growth:0 "National Programme"
 COLDWAR_TUR_1970_preview_urban_growth_desc:0 "Reorganise the finance and management of public utilities and productive enterprises. Applied technical capacity and dependable municipal services give the state a stronger basis for reducing repeated transfers while preserving useful investment."
 COLDWAR_TUR_1970_preview_urban_utilities:0 "National Programme"
 COLDWAR_TUR_1970_preview_urban_utilities_desc:0 "Growing urban districts need dependable water, power, and municipal administration. Invest in utilities that can serve new residents and industry, while strengthening the local institutions responsible for maintenance."
 COLDWAR_TUR_1970_preview_village_health:0 "National Programme"
 COLDWAR_TUR_1970_preview_village_health_desc:0 "Village health teams can treat illness before it becomes a burden on distant hospitals. Regular clinics and trained staff extend public care beyond the cities, but require a lasting commitment from the health budget."
 COLDWAR_TUR_1970_preview_welfare_municipalities:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_preview_welfare_municipalities_desc:0 "A municipality should be judged by whether help reaches the household that needs it. Organised welfare and accountable local services can build a durable social base, while committing the government to more than an election-season distribution."
 COLDWAR_TUR_1970_preview_world_markets:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_preview_world_markets_desc:0 "Exporters, contractors and service firms can build a lasting Turkish presence abroad. Commercial representation and practical training will help them stay there after the first contract is finished."
 COLDWAR_TUR_1970_preview_ytp_continuation:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_continuation_desc:0 "A smaller party can still serve a provincial electorate if it keeps its organisation and programme intact. The government will invest in that base rather than treat an unfavourable election as a reason to abandon it."
 COLDWAR_TUR_1970_preview_ytp_coops:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_coops_desc:0 "A cooperative should answer to its members rather than to an appointed patron. Shared purchasing and marketing can strengthen small farmers, provided the state supplies credit without taking command of every village account."
 COLDWAR_TUR_1970_preview_ytp_eastern_plan:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_eastern_plan_desc:0 "The eastern provinces need an investment programme that answers their own conditions. Roads, workshops and public services can connect neglected districts to the national economy without requiring their affairs to be directed entirely from Ankara."
 COLDWAR_TUR_1970_preview_ytp_enterprise:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_enterprise_desc:0 "Provincial traders and manufacturers need patient capital as well as better roads. Regional lending can turn local savings into workshops, while keeping the public banks exposed to the fortunes of smaller firms."
 COLDWAR_TUR_1970_preview_ytp_land:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_land_desc:0 "Landless families and small cultivators need fair surveys, practical settlement assistance and a stronger position in agricultural development. A funded rural reform programme will connect these needs to better production, with public services supporting the work."
 COLDWAR_TUR_1970_preview_ytp_land_settlement:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_land_settlement_desc:0 "Land reform must be supported by roads, water and practical assistance if a family holding is to support its cultivators. Settlement without these services would leave the underlying poverty untouched."
 COLDWAR_TUR_1970_preview_ytp_prices:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_prices_desc:0 "Small cultivators need the means to keep producing when their earnings fall short. Funded assistance and purchasing advice can support farm incomes, while making rural protection a continuing public responsibility."
 COLDWAR_TUR_1970_preview_ytp_professionals:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_professionals_desc:0 "Eastern development needs technical colleges and engineers able to maintain machinery, waterworks and public works. Provincial teaching will support industry and keep more practical expertise close to the communities that need it."
 COLDWAR_TUR_1970_preview_ytp_purchasing:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_purchasing_desc:0 "The guarantee needs buyers, accounts and accessible depots. A regional purchasing service will make the promise usable to small producers rather than leave it in the hands of distant wholesalers."
 COLDWAR_TUR_1970_preview_ytp_regional_markets:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_regional_markets_desc:0 "Eastern producers need access to purchasers and reliable transport. Regional marketing can connect family farms and local firms to the national economy."
 COLDWAR_TUR_1970_preview_ytp_services:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_services_desc:0 "The Republic must be present in a village as more than a tax demand and a distant official. Practical services and accountable local institutions can give parliamentary government a stronger foundation in the provinces."
 COLDWAR_TUR_1970_preview_ytp_storage:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_storage_desc:0 "Storage and processing belong beside the farms that supply them. Producer-owned facilities can reduce waste and improve bargaining power, but the investment must be carried before its first successful season."
 COLDWAR_TUR_1970_preview_ytp_village_links:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_village_links_desc:0 "A harvest is worth little if it cannot reach a buyer, and a school struggles without safe water and transport. A provincial works programme will begin with these ordinary foundations of economic life."
 COLDWAR_TUR_1970_preview_ytp_village_professions:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_preview_ytp_village_professions_desc:0 "Provincial services need trained teachers, technicians and administrators who can build careers outside the largest cities. A funded professional programme will strengthen local services while committing the education budget to continued training."
 COLDWAR_TUR_1970_private_enterprise:0 "Credit for Enterprise"
 COLDWAR_TUR_1970_private_enterprise_desc:0 "Private firms seek credit and investment incentives to expand beyond established commercial centres. A broader enterprise economy promises new production, while concessions reduce the Treasury’s immediate return."
 COLDWAR_TUR_1970_productive_credit:0 "Credit for Production"
 COLDWAR_TUR_1970_productive_credit_desc:0 "Credit should create goods and employment rather than reward the circulation of money alone. Funded production contracts can direct finance towards workshops and farms, while placing a larger share of investment risk on public institutions."
 COLDWAR_TUR_1970_professional_command:0 "A Professional Command"
 COLDWAR_TUR_1970_professional_command_desc:0 "Professional standards and education can give officers a respected career within a constitutional republic. Promotions based on service and expertise reduce factional competition while keeping the armed forces an effective national institution."
 COLDWAR_TUR_1970_programme_1:0 "National Programme"
 COLDWAR_TUR_1970_programme_10:0 "Eastern Development Programme"
 COLDWAR_TUR_1970_programme_10_desc:0 "The Republic must be present in a village as more than a tax demand and a distant official. Practical services and accountable local institutions can give parliamentary government a stronger foundation in the provinces."
 COLDWAR_TUR_1970_programme_11:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_programme_11_desc:0 "Farm families need water, equipment and access to capital if provincial development is to reach the countryside. Credit and local services can support productive holdings, while the public banks must carry the risks of lending."
 COLDWAR_TUR_1970_programme_12:0 "Republican Social Programme"
 COLDWAR_TUR_1970_programme_12_desc:0 "The Republic must make constitutional democracy meaningful to workers, farmers and families. Planned development and social rights can bring the benefits of growth to citizens beyond the established centres of wealth."
 COLDWAR_TUR_1970_programme_13:0 "Republican Development Programme"
 COLDWAR_TUR_1970_programme_13_desc:0 "The Republic needs reform without surrendering its constitutional foundations. Public authority and private enterprise can both serve national development when institutions are strong enough to demand results from each."
 COLDWAR_TUR_1970_programme_14:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_programme_14_desc:0 "Workers and producers need a political voice rooted in their own experience. Democratic participation and productive enterprise can broaden opportunity without surrendering national independence."
 COLDWAR_TUR_1970_programme_15:0 "Democratic Left Programme"
 COLDWAR_TUR_1970_programme_15_desc:0 "Cooperating farmers can pool a share of their growing incomes in producer-managed investment. Their savings should serve rural production and the security of the communities that created them."
 COLDWAR_TUR_1970_programme_16:0 "Republican Social Programme"
 COLDWAR_TUR_1970_programme_16_desc:0 "Social democracy must grow through elected local associations and practical public services. Municipal investment can connect the rights of citizens with the everyday needs of urban and provincial communities."
 COLDWAR_TUR_1970_programme_17:0 "Republican Social Programme"
 COLDWAR_TUR_1970_programme_17_desc:0 "Workers and public employees need effective union rights and a voice at work. Secure collective bargaining can give working families a fairer share in national development."
 COLDWAR_TUR_1970_programme_18:0 "Republican Social Programme"
 COLDWAR_TUR_1970_programme_18_desc:0 "The Republican People’s Party returns to public life with a responsibility to defend a democratic, secular and socially just republic. Its renewed organisation must bring citizens into the work of national development."
 COLDWAR_TUR_1970_programme_19:0 "Republican Development Programme"
 COLDWAR_TUR_1970_programme_19_desc:0 "Republican institutions and a mixed economy can unite public purpose with private initiative. The government should coordinate investment while leaving room for independent enterprise."
 COLDWAR_TUR_1970_programme_1_desc:0 "The Grand National Assembly should supervise defence appointments and public spending. Stronger parliamentary oversight affirms the authority of elected representatives, while challenging officers accustomed to a direct voice in government."
 COLDWAR_TUR_1970_programme_2:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_programme_20:0 "Republican Social Programme"
 COLDWAR_TUR_1970_programme_20_desc:0 "Public enterprise, private industry and the savings of working people each have a place in national development. A planned mixed economy can direct their resources toward production and a wider measure of social security."
 COLDWAR_TUR_1970_programme_21:0 "National Development Programme"
 COLDWAR_TUR_1970_programme_21_desc:0 "The Nine Lights bind Turkish nationalism to social solidarity, science, rural development and modern industry. National independence and a strong state must give those principles political purpose."
 COLDWAR_TUR_1970_programme_22:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_programme_22_desc:0 "A republic of equal citizens must hear the people whose labour sustains it. The workers' party will use public authority to strengthen labour, defend civil rights and challenge the concentration of economic power."
 COLDWAR_TUR_1970_programme_23:0 "National Democratic Programme"
 COLDWAR_TUR_1970_programme_23_desc:0 "The cadres who sustained the clandestine party must now build public institutions. A government born from confrontation cannot live on its underground discipline alone; it must organise the officials, workers and local committees who will carry its authority into everyday life."
 COLDWAR_TUR_1970_programme_24:0 "National Development Programme"
 COLDWAR_TUR_1970_programme_24_desc:0 "The movement's return to legal politics requires an organisation capable of working through representative institutions. Provincial cadres can preserve their national programme while accepting the discipline of parliamentary competition."
 COLDWAR_TUR_1970_programme_25:0 "National Development Programme"
 COLDWAR_TUR_1970_programme_25_desc:0 "Recovering the historic name must be followed by a programme that can govern. Domestic maintenance and industrial contracts will bind the restored organisation to production that can be judged by practical results."
 COLDWAR_TUR_1970_programme_26:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_programme_26_desc:0 "A new legal organisation must reconnect workers, local officers and professional supporters whose earlier party was closed. Institutions that survive scrutiny will give the labour programme a firmer public base."
 COLDWAR_TUR_1970_programme_27:0 "Labour and Democratic Planning"
 COLDWAR_TUR_1970_programme_27_desc:0 "National development needs public priorities and investment, but markets and a wider distribution of ownership also have a place in economic life. The government must decide where to direct its limited investment first."
 COLDWAR_TUR_1970_programme_28:0 "National Development Programme"
 COLDWAR_TUR_1970_programme_28_desc:0 "Workers, public employees, artisans and farmers can pool savings in enterprises they jointly own. A nation sector can mobilise small investors alongside public and private enterprise."
 COLDWAR_TUR_1970_programme_29:0 "Justice Party Development Programme"
 COLDWAR_TUR_1970_programme_29_desc:0 "The construction programme needs surveyors, engineers and technicians as well as concrete. Practical instruction can strengthen the firms that must operate and maintain these works."
 COLDWAR_TUR_1970_programme_2_desc:0 "Our towns need workshops, our villages need opportunity, and the Republic needs an economy that answers to its own people. Millî Görüş will join industrial ambition to religious conviction and give provincial producers a stronger voice in national development."
 COLDWAR_TUR_1970_programme_3:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_programme_30:0 "True Path Programme"
 COLDWAR_TUR_1970_programme_30_desc:0 "Small firms depend on skilled workers, technical advice and knowledge of their customers. Training can help artisans and manufacturers build reliable provincial businesses."
 COLDWAR_TUR_1970_programme_31:0 "Motherland Economic Programme"
 COLDWAR_TUR_1970_programme_31_desc:0 "Turkish manufacturers need dependable quality as well as modern machines to win foreign orders. Testing and technical training can help firms compete on the strength of their products."
 COLDWAR_TUR_1970_programme_32:0 "CHP programme"
 COLDWAR_TUR_1970_programme_32_desc:0 "Parliamentary democracy must give workers and farmers a fair share in national development. Under İsmet İnönü, the party can bring social reform into the work of the Republic."
 COLDWAR_TUR_1970_programme_33:0 "SHP programme"
 COLDWAR_TUR_1970_programme_33_desc:0 "Working people need effective collective representation and a fair return for their labour. A democratic workplace gives workers a stronger voice in the decisions that shape their lives."
 COLDWAR_TUR_1970_programme_34:0 "DSP programme"
 COLDWAR_TUR_1970_programme_34_desc:0 "Families need health services within reach of their own communities. Local administration can support the staff and organisation needed to provide them."
 COLDWAR_TUR_1970_programme_35:0 "Popular Shareholding"
 COLDWAR_TUR_1970_programme_35_desc:0 "Shareholder firms need buyers beyond their home markets. Technical preparation and common commercial services can help provincial industry compete abroad."
 COLDWAR_TUR_1970_programme_36:0 "Producer Cooperatives"
 COLDWAR_TUR_1970_programme_36_desc:0 "Artisan and farmer cooperatives can buy equipment together and reduce the cost of maintaining it. Local purchasing gives small producers a stronger position in the market."
 COLDWAR_TUR_1970_programme_37:0 "Solidarity Investment"
 COLDWAR_TUR_1970_programme_37_desc:0 "National solidarity must reach workers and their families when illness or injury interrupts a wage. Extend insurance coverage, accepting the continuing cost to the social budget."
 COLDWAR_TUR_1970_programme_38:0 "Nation Sector"
 COLDWAR_TUR_1970_programme_38_desc:0 "Workers and employees should be able to pool savings and become shareholders in productive enterprises. Their investment can widen ownership while supplying Turkish industry."
 COLDWAR_TUR_1970_programme_39:0 "Workers Abroad"
 COLDWAR_TUR_1970_programme_39_desc:0 "Turkish workers abroad need effective support as they face difficult employment and family conditions. Consular services should defend their interests and help those who choose to return."
 COLDWAR_TUR_1970_programme_3_desc:0 "Small merchants and craftsmen should be heard alongside the great industrial groups. Provincial chambers can bring their experience into public policy, provided the movement supplies practical advice rather than merely asking for loyalty."
 COLDWAR_TUR_1970_programme_4:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_programme_40:0 "Schools and Civic Life"
 COLDWAR_TUR_1970_programme_40_desc:0 "The schools shape the nation's future as surely as its factories. A national curriculum will give history, language and civic duty greater weight, while a narrower public debate carries a political cost."
 COLDWAR_TUR_1970_programme_4_desc:0 "A coalition must be judged by what its ministries accomplish. Coordinated tenders and investment timetables will turn the party's industrial commitments into work that can continue through cabinet disagreements."
 COLDWAR_TUR_1970_programme_5:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_programme_5_desc:0 "Production, distribution and public finance must serve a more just order. The government will bring its industrial experience and provincial networks into a broader economic programme, promising productive investment without leaving social obligations to charity alone."
 COLDWAR_TUR_1970_programme_6:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_programme_6_desc:0 "The movement's local organisation must survive the loss of its former party. A new legal vehicle can reconnect experienced activists with voters, while requiring a fresh charter and institutions that answer for their own conduct."
 COLDWAR_TUR_1970_programme_7:0 "Millî Görüş Programme"
 COLDWAR_TUR_1970_programme_7_desc:0 "Engineers and technical institutes can gain more from dependable cooperation than from occasional ceremonial visits. Funded research exchanges will give the members a practical return on their new organisation."
 COLDWAR_TUR_1970_programme_8:0 "Provincial Development Programme"
 COLDWAR_TUR_1970_programme_8_desc:0 "The Justice Party looks to public works and private enterprise to carry development into the provinces. The government must reconcile the demands of farmers, contractors and industry with the credit, skills and foreign exchange at its disposal."
 COLDWAR_TUR_1970_programme_9:0 "Enterprise and Export Programme"
 COLDWAR_TUR_1970_programme_9_desc:0 "Commercial firms seek access to finance and international business. A wider financial sector can attract investment, while exposure to external markets leaves Turkish firms vulnerable to sudden pressure."
 COLDWAR_TUR_1970_provincial_accounts:0 "Provincial Accounts"
 COLDWAR_TUR_1970_provincial_accounts_desc:0 "A national settlement must reach beyond Ankara. Common accounts and trained provincial auditors can bring local expenditure into the parliamentary budget, replacing discretionary transfers with institutions that the government must defend in public."
 COLDWAR_TUR_1970_provincial_capital:0 "Provincial Industry"
 COLDWAR_TUR_1970_provincial_capital_desc:0 "Industry and agriculture beyond the main centres need access to development capital. Investment in provincial production can broaden the foundations of growth if public allocations are administered carefully."
 COLDWAR_TUR_1970_provincial_enterprise:0 "Anatolian Enterprise"
 COLDWAR_TUR_1970_provincial_enterprise_desc:0 "Provincial merchants and manufacturers need capital on terms that recognise the scale of their businesses. A funded enterprise programme will spread investment beyond the established industrial centres, with public guarantees carrying part of the risk."
 COLDWAR_TUR_1970_provincial_firms:0 "Provincial Enterprises"
 COLDWAR_TUR_1970_provincial_firms_desc:0 "Anatolian producers need commercial advice, accounting and connections to national buyers. Stronger local firms can keep more of the benefits of investment in the provinces."
 COLDWAR_TUR_1970_provincial_services:0 "Integrated Provincial Services"
 COLDWAR_TUR_1970_provincial_services_desc:0 "Coordinate utilities, land records, and municipal services around Gaziantep. A capable provincial administration can meet the needs of growing towns and rural communities while making public investment more effective."
 COLDWAR_TUR_1970_provincial_works_technical_services:0 "Provincial Works and Technical Services"
 COLDWAR_TUR_1970_provincial_works_technical_services_desc:0 "Public works must be supported by the people and institutions that keep them useful. Regional technical services, producer advice and maintenance offices will consolidate the provincial investment programme. Better services can widen economic opportunity without pretending that the cost of serving distant districts has disappeared."
 COLDWAR_TUR_1970_public_cash_pool:0 "A Public Cash Pool"
 COLDWAR_TUR_1970_public_cash_pool_desc:0 "Public institutions should not borrow expensively while other public balances lie idle. A common cash pool can give the Treasury greater room to manage its obligations, but participating banks and enterprises lose discretion over funds they once held themselves."
 COLDWAR_TUR_1970_public_holdings:0 "Planned Capital Goods"
 COLDWAR_TUR_1970_public_holdings_desc:0 "A mixed economy needs strong public industry and the capacity to make machinery at home. Direct investment in productive capacity can reduce dependence on imported equipment and support a wider industrial plan."
 COLDWAR_TUR_1970_public_works:0 "Public Works Contracts"
 COLDWAR_TUR_1970_public_works_desc:0 "Provincial roads and utilities can bring development to districts beyond the main industrial centres. The government must finance construction and ensure that contractors deliver useful connections."
 COLDWAR_TUR_1970_regional_1032_0:0 "Dispersed Plateau Districts"
 COLDWAR_TUR_1970_regional_1032_0_desc:0 "Provincial centres are connected to the Republic's wider economy, while many surrounding districts need more dependable public works and technical services. Investment must serve settled centres and dispersed communities together. Better administration and maintained connections can narrow the gap, though the distances between them will continue to raise the cost of construction."
 COLDWAR_TUR_1970_regional_1032_0_preview:0 "Dispersed Plateau Districts"
 COLDWAR_TUR_1970_regional_1032_0_preview_desc:0 "Provincial centres are connected to the Republic's wider economy, while many surrounding districts need more dependable public works and technical services. Investment must serve settled centres and dispersed communities together. Better administration and maintained connections can narrow the gap, though the distances between them will continue to raise the cost of construction."
