 COLDWAR_TUR_1970_regional_162_0:0 "Uneven Provincial Connections"
 COLDWAR_TUR_1970_regional_162_0_desc:0 "Diyarbakır's markets and the workshops of the region stand beside districts that public services reach only with difficulty. The fertile plains and the mountain approaches demand different investments. Provincial roads, maintained works and practical training can bring more communities into economic life, but reaching the outlying districts will remain costly."
