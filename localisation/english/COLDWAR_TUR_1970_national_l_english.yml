 COLDWAR_TUR_1970_regional_1205_0:0 "Dryland Villages of the Euphrates"
 COLDWAR_TUR_1970_regional_1205_0_desc:0 "The plains around the Euphrates offer the prospect of larger and more dependable harvests. Village services, local works and water provision must develop together if farmers are to benefit. Irrigation can transform production, while maintaining connections across the rural districts remains a continuing public obligation."
