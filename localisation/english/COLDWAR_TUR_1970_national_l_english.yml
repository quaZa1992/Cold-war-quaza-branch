 COLDWAR_TUR_1970_regional_935_0:0 "Highland Routes and Valleys"
 COLDWAR_TUR_1970_regional_935_0_desc:0 "The approaches to Van and Ağrı are demanding, yet the plains of Muş and Iğdır offer valuable agricultural opportunities. Producers need roads, water and practical support suited to these different districts. Better connections can reduce their isolation without removing the cost of building across the surrounding highlands."
 COLDWAR_TUR_1970_regional_935_0_preview:0 "Highland Routes and Valleys"
 COLDWAR_TUR_1970_regional_935_0_preview_desc:0 "The approaches to Van and Ağrı are demanding, yet the plains of Muş and Iğdır offer valuable agricultural opportunities. Producers need roads, water and practical support suited to these different districts. Better connections can reduce their isolation without removing the cost of building across the surrounding highlands."
