# IMPERIA COLD WAR — Dynamic 1970 apartheid policies and reciprocal diplomacy.
# Generated by tools/apartheid_1970/compile.py.
 COLDWAR_AP_spirit:0 "[GetCOLDWARAPSpiritName]"
 COLDWAR_AP_spirit_desc:0 "[GetCOLDWARAPSpiritDescription]"
 COLDWAR_AP_name:0 "Apartheid"
 COLDWAR_AP_rhodesian_name:0 "Racial Minority Rule"
 COLDWAR_AP_legacy_name:0 "Legacy of Racial Segregation"
 COLDWAR_AP_description:0 "Racial classification, pass controls and minority political power provoke widespread opposition. Separate administrations and an extensive security apparatus make this settlement expensive to maintain. Public services are concentrated on privileged communities, holding down total provision while sustaining expectations of well-funded hospitals, schools and welfare.\n\nRestricted bargaining rights and low-paid labour favour investors and construction employers. Protected land, credit and agricultural support strengthen commercial farms, while occupational exclusion leaves offices short of trained staff. A narrow pool of skilled military recruits sustains costly personnel arrangements and high defence expectations. Selective immigration and contract recruitment coexist with rapid natural growth in a youthful, largely African population. These demographic pressures reflect social conditions and population structure. Across independent Africa, racial rule damages diplomatic and commercial relations.\n\nNational policy focuses and the Racial Policy and Reform decisions can revise or restore individual arrangements."
 COLDWAR_AP_rhodesian_description:0 "The restricted franchise and racial allocation of land protect a small settler electorate while excluding most Africans from political power. Separate public provision, employment restrictions and the security apparatus preserve this unequal settlement. Privileged communities demand well-funded services and defence while the majority receives much less support.\n\nLow-paid labour and protected commercial farms benefit established employers, but restricted training and occupations obstruct skilled employment. Selective immigration, a youthful population and costly military staffing add further pressures. Independent African governments oppose minority rule and its regional consequences.\n\nNational policy focuses and the Racial Policy and Reform decisions can revise or restore individual arrangements."
 COLDWAR_AP_legacy_description:0 "Legal and political reforms have ended the remaining racial controls on citizenship and residence. Unequal public provision, protected economic arrangements, military privileges or earlier population policies still require their own settlements. Their remaining costs and advantages continue until those policies are revised through the national policy focuses and Racial Policy and Reform decisions."
 COLDWAR_AP_policy_category:0 "Racial Policy and Reform"
 COLDWAR_AP_policy_category_desc:0 "The political settlement, public services, labour and land institutions, military privileges and population policy can each be revised. Reform reduces both the advantages and burdens of the affected arrangements. Existing institutions can also be restored. Diplomatic normalisation requires the other government's agreement and continuing concessions."
 COLDWAR_AP_commercial_agriculture_productivity:0 "Commercial Agriculture Productivity"
 COLDWAR_AP_commercial_agriculture_productivity_desc:0 "Productivity of commercial agricultural districts."
