 COLDWAR_AP_shortcut:0 "Racial Policy and Reform"
 COLDWAR_AP_propose_normalisation:0 "Propose Normalisation with [FROM.GetNameDef]"
 COLDWAR_AP_propose_normalisation_desc:0 "Offer talks on restoring ordinary diplomatic and commercial relations. The other government must agree. The settlement remains effective while peace and meaningful concessions continue. Worldwide criticism of racial rule remains."
 COLDWAR_AP_political:0 "Racial Security Controls"
 COLDWAR_AP_political_cooldown:0 "A previous policy revision is being implemented"
 COLDWAR_AP_political_focus:0 "Revise the Racial Settlement"
 COLDWAR_AP_political_focus_desc:0 "The franchise, racial classification and restrictions on residence sustain minority rule. A negotiated revision can reduce the burden of policing and separate administration, but it also gives up institutions on which the governing settlement depends."
 COLDWAR_AP_reduce_political:0 "Relax Racial Classification and Pass Controls"
 COLDWAR_AP_reduce_political_desc:0 "The franchise, racial classification and restrictions on residence sustain minority rule. A negotiated revision can reduce the burden of policing and separate administration, but it also gives up institutions on which the governing settlement depends."
 COLDWAR_AP_restore_political:0 "Reinstate Racial Classification and Pass Controls"
 COLDWAR_AP_restore_political_desc:0 "The franchise, racial classification and restrictions on residence sustain minority rule. A negotiated revision can reduce the burden of policing and separate administration, but it also gives up institutions on which the governing settlement depends."
 COLDWAR_AP_services:0 "Preferential Public Provision"
 COLDWAR_AP_services_cooldown:0 "A previous policy revision is being implemented"
 COLDWAR_AP_services_focus:0 "Broaden Access to Public Services"
 COLDWAR_AP_services_focus_desc:0 "Public hospitals, schools and welfare provision are divided by race and funded unequally. Extending equal access raises the cost of provision while reducing the exceptional spending expectations associated with a privileged minority."
 COLDWAR_AP_reduce_services:0 "Extend Equal Access to Public Services"
 COLDWAR_AP_reduce_services_desc:0 "Public hospitals, schools and welfare provision are divided by race and funded unequally. Extending equal access raises the cost of provision while reducing the exceptional spending expectations associated with a privileged minority."
 COLDWAR_AP_restore_services:0 "Restore Preferential Public Provision"
 COLDWAR_AP_restore_services_desc:0 "Public hospitals, schools and welfare provision are divided by race and funded unequally. Extending equal access raises the cost of provision while reducing the exceptional spending expectations associated with a privileged minority."
 COLDWAR_AP_labour:0 "Protected Labour and Land Arrangements"
 COLDWAR_AP_labour_cooldown:0 "A previous policy revision is being implemented"
 COLDWAR_AP_labour_focus:0 "Negotiate Labour and Land Reform"
 COLDWAR_AP_labour_focus_desc:0 "Restricted bargaining rights and access to land favour established employers and commercial farms. Opening employment and land institutions reduces these advantages, while easing the staffing difficulties created by occupational exclusion."
 COLDWAR_AP_reduce_labour:0 "Relax Employment and Land Restrictions"
 COLDWAR_AP_reduce_labour_desc:0 "Restricted bargaining rights and access to land favour established employers and commercial farms. Opening employment and land institutions reduces these advantages, while easing the staffing difficulties created by occupational exclusion."
 COLDWAR_AP_restore_labour:0 "Restore Protected Labour and Land Arrangements"
 COLDWAR_AP_restore_labour_desc:0 "Restricted bargaining rights and access to land favour established employers and commercial farms. Opening employment and land institutions reduces these advantages, while easing the staffing difficulties created by occupational exclusion."
 COLDWAR_AP_military:0 "Military Service Privileges"
 COLDWAR_AP_military_cooldown:0 "A previous policy revision is being implemented"
 COLDWAR_AP_military_focus:0 "Revise Military Service and Pay"
 COLDWAR_AP_military_focus_desc:0 "A narrow pool of eligible skilled recruits and the political importance of the armed services sustain privileged personnel arrangements. Wider recruitment and a common pay structure can reduce their cost and the exceptional defence-spending demands of minority rule."
 COLDWAR_AP_reduce_military:0 "Broaden Recruitment and Standardise Military Pay"
 COLDWAR_AP_reduce_military_desc:0 "A narrow pool of eligible skilled recruits and the political importance of the armed services sustain privileged personnel arrangements. Wider recruitment and a common pay structure can reduce their cost and the exceptional defence-spending demands of minority rule."
 COLDWAR_AP_restore_military:0 "Restore Preferential Military Service and Pay"
 COLDWAR_AP_restore_military_desc:0 "A narrow pool of eligible skilled recruits and the political importance of the armed services sustain privileged personnel arrangements. Wider recruitment and a common pay structure can reduce their cost and the exceptional defence-spending demands of minority rule."
 COLDWAR_AP_population:0 "Settlement and Family Policy"
 COLDWAR_AP_population_cooldown:0 "A previous policy revision is being implemented"
 COLDWAR_AP_population_focus:0 "Reconsider Settlement and Family Policy"
 COLDWAR_AP_population_focus_desc:0 "Selective settlement incentives coexist with contract migration and rapid natural growth in a youthful population. Voluntary family-planning provision and revised migration incentives can gradually change these pressures. Such trends arise from social conditions and population structure, rather than racial characteristics."
 COLDWAR_AP_reduce_population:0 "Expand Voluntary Family Planning and Revise Settlement Incentives"
 COLDWAR_AP_reduce_population_desc:0 "Selective settlement incentives coexist with contract migration and rapid natural growth in a youthful population. Voluntary family-planning provision and revised migration incentives can gradually change these pressures. Such trends arise from social conditions and population structure, rather than racial characteristics."
 COLDWAR_AP_restore_population:0 "Restore Settlement Incentives and Previous Family Policy"
 COLDWAR_AP_restore_population_desc:0 "Selective settlement incentives coexist with contract migration and rapid natural growth in a youthful population. Voluntary family-planning provision and revised migration incentives can gradually change these pressures. Such trends arise from social conditions and population structure, rather than racial characteristics."
