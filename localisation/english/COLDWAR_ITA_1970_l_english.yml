 COLDWAR_ITA.1.t: "The Workers' Statute"
 COLDWAR_ITA.1.d: "Law 300 of 20 May 1970 brings the constitution into the factories: no dismissal without just cause, union rights in every plant with more than fifteen workers."
 COLDWAR_ITA.1.a: "The Hot Autumn becomes law."
 COLDWAR_ITA.2.t: "The Night of the Forest Rangers"
 COLDWAR_ITA.2.d: "On the night of 7 December 1970 Junio Valerio Borghese's men occupy the Ministry of the Interior, then the order comes to stand down. Nobody is sure who gave it."
 COLDWAR_ITA.2.a: "Open an investigation."
 COLDWAR_ITA.2.b: "Let the matter rest."
 COLDWAR_ITA.3.t: "The Agnelli-Lama Accord"
 COLDWAR_ITA.3.d: "Gianni Agnelli for Confindustria and Luciano Lama for the CGIL sign the single point of contingency: wages follow prices quarter by quarter."
 COLDWAR_ITA.3.a: "Sign the accord."
 COLDWAR_ITA.3.b: "Delay it for now."
 COLDWAR_ITA.3.c: "The accord has no new object."
 COLDWAR_ITA.4.t: "The Seveso Cloud"
 COLDWAR_ITA.4.d: "A reactor of the ICMESA plant at Meda releases a cloud of dioxin over Seveso. The children fall ill first; the animals die in the fields."
 COLDWAR_ITA.4.a: "Fence the zone and treat the sick."
 COLDWAR_ITA.4.b: "Pay for a full clean-up."
 COLDWAR_ITA.5.t: "The Irpinia Earthquake"
 COLDWAR_ITA.5.d: "At 19:34 on 23 November 1980 the earth shakes for ninety seconds. Almost three thousand dead between Avellino, Potenza and Salerno; the help arrives late."
 COLDWAR_ITA.5.a: "Rebuild the south."
 COLDWAR_ITA.6.t: "The P2 List"
 COLDWAR_ITA.6.d: "In Licio Gelli's villa at Castiglion Fibocchi the magistrates find a list of 962 names: ministers, generals, the heads of the secret services, publishers."
 COLDWAR_ITA.6.a: "Close ranks and wait."
 COLDWAR_ITA.6.b: "Purge the lodge."
 COLDWAR_ITA.40.t: "Sabres Rattle"
 COLDWAR_ITA.40.d: "Officers, neo-fascists and men of the secret services meet in Rome: the country needs a strong hand, they say, and they are ready to give it."
 COLDWAR_ITA.40.a: "Purge the officer corps."
 COLDWAR_ITA.40.b: "Negotiate with the generals."
 COLDWAR_ITA.41.t: "Kidnapping of a Statesman"
 COLDWAR_ITA.41.d: "Via Fani, nine in the morning: the escort is dead and the statesman is in the hands of the Red Brigades. They want their comrades released."
 COLDWAR_ITA.41.a: "Hold the line of firmness."
 COLDWAR_ITA.41.b: "Negotiate for his life."
 COLDWAR_ITA.42.t: "The Station Bombing"
 COLDWAR_ITA.42.d: "A bomb tears through the waiting room of the station on a summer morning. Eighty-five dead, two hundred wounded."
 COLDWAR_ITA.42.a: "Emergency laws and roadblocks."
 COLDWAR_ITA.42.b: "Talk to the unions and the parties."
 COLDWAR_ITA.50.t: "The Second Mafia War"
 COLDWAR_ITA.50.d: "The Corleonesi of Toto Riina kill Bontate and Inzerillo and hunt their men through Palermo. Hundreds die; the clan that wins is stronger than before."
 COLDWAR_ITA.50.a: "Send the army to Sicily."
 COLDWAR_ITA.50.b: "Let them kill each other."
 COLDWAR_ITA.51.t: "Murder of a Prefect"
 COLDWAR_ITA.51.d: "The prefect and his wife are shot in their car in Via Carini. A hand writes on a wall: here died the hope of honest Palermitans."
 COLDWAR_ITA.51.a: "Antimafia resolve."
 COLDWAR_ITA.51.b: "A state funeral."
 COLDWAR_ITA.52.t: "The Maxi Trial"
 COLDWAR_ITA.52.d: "In the bunker hall of the Ucciardone 475 defendants face the court. The sentences: 19 life terms and 2,665 years of prison."
 COLDWAR_ITA.52.a: "The judges of Palermo did it."
 COLDWAR_ITA.52.b: "The whole country did it."
 COLDWAR_ITA.60.t: "The Scala Mobile Referendum"
 COLDWAR_ITA.60.d: "The PCI collected the signatures against the decree of San Valentino. The voters decide whether the four points come back."
 COLDWAR_ITA.60.a: "No wins: the decree stands."
 COLDWAR_ITA.60.b: "Yes wins: the points come back."
 COLDWAR_ITA.61.t: "The Resistance Remembers"
 COLDWAR_ITA.61.d: "The partisans' association ANPI marches in Milan, Bologna and Brescia against a neo-fascist government."
 COLDWAR_ITA.61.a: "Let them march."
 COLDWAR_ITA.62.t: "The Expelled of Tripoli"
 COLDWAR_ITA.62.d: "The twenty thousand Italians Gaddafi drove out in 1970 want compensation before any deal with Tripoli."
 COLDWAR_ITA.62.a: "We hear them."
 COLDWAR_ITA.63.t: "Destra Nazionale"
 COLDWAR_ITA.63.d: "The Monarchist party merges into the MSI: Almirante's Destra Nazionale gathers the whole right."
 COLDWAR_ITA.63.a: "One party of the right."
 COLDWAR_ITA.64.t: "Resistance Protests"
 COLDWAR_ITA.64.d: "The ANPI and the unions march in every city against the government of the flame."
 COLDWAR_ITA.64.a: "Hold firm."
 COLDWAR_ITA.65.t: "The Constitution of 1948"
 COLDWAR_ITA.65.d: "The lay and left parties march to defend the constitution of the Republic."
 COLDWAR_ITA.65.a: "The Republic changes anyway."
 COLDWAR_ITA.66.t: "The Flame Stays Lit"
 COLDWAR_ITA.66.d: "The hardliners will not follow the turn: they leave and found their own movement."
 COLDWAR_ITA.66.a: "Let them go."
 COLDWAR_ITA.67.t: "The Second Referendum"
 COLDWAR_ITA.67.d: "For the first time since 2 June 1946 Italians vote on the monarchy."
 COLDWAR_ITA.67.a: "The crown returns."
 COLDWAR_ITA.67.b: "Italy stays a republic."
 COLDWAR_ITA.100.t: "A Proposal from Rome"
 COLDWAR_ITA.100.d: "The Italian government has sent us a proposal. It waits in the decision category 'Offers from Italy'."
 COLDWAR_ITA.100.a: "We will consider it."
 COLDWAR_ITA.101.t: "[From.GetName] Accepts"
 COLDWAR_ITA.101.d: "[From.GetName] has accepted our proposal."
 COLDWAR_ITA.101.a: "Excellent."
 COLDWAR_ITA.102.t: "[From.GetName] Declines"
 COLDWAR_ITA.102.d: "[From.GetName] has turned down our proposal."
 COLDWAR_ITA.102.a: "Unfortunate."
 COLDWAR_ITA.104.t: "An Agreement Ends"
 COLDWAR_ITA.104.d: "[From.GetName] has ended an agreement between our countries."
 COLDWAR_ITA.104.a: "So be it."
