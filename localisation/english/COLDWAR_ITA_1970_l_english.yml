 COLDWAR_ITA_pci_lega_delle_cooperative: "Lega delle Cooperative"
 COLDWAR_ITA_pci_lega_delle_cooperative_desc: "The red cooperatives build, trade and sell cheaply."
 COLDWAR_ITA_pci_le_partecipazioni_statali: "Le Partecipazioni Statali"
 COLDWAR_ITA_pci_le_partecipazioni_statali_desc: "ENI and IRI answer to the ministry and carry out the plan."
