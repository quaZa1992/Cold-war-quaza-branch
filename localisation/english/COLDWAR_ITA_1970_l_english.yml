 COLDWAR_ITA_registry_pli: "£MDCW_P70_ITALIAN_LIBERAL_PARTY (PLI) - Italian Liberal Party"
 COLDWAR_ITA_registry_pli_desc: "(Classical Liberalism) - Italian Liberal Party (Italian: Partito Liberale Italiano, PLI)\n\nThe Italian Liberal Party, heir to the liberal ruling class of Cavour and Giolitti, has been led since 1954 by secretary Giovanni Malagodi, a former banker who turned it into the party of free enterprise. It fought the centre-left and the nationalisation of electricity and won 5.8 percent in 1968 as the main secular opposition on the right.\n\nThe Liberals defend the market economy, private property, balanced budgets and the rule of law, warn that the new regions will hand power to the Communists, and are firmly Atlanticist and European. Their base is the northern bourgeoisie, the professions and business circles."
 COLDWAR_ITA_registry_pli_icon: "£MDCW_P70_ITALIAN_LIBERAL_PARTY"
 COLDWAR_ITA_registry_cossutta: "£generic_communist_state_small (PCI-ML) - Cossutta's Communists"
 COLDWAR_ITA_registry_cossutta_desc: "(Marxism-Leninism) - Cossutta's Communists\n\nWhen the PCI chose Eurocommunism and the shelter of NATO, the pro-Soviet minority around Armando Cossutta refused to follow. Loyal to Moscow and to the old discipline, it keeps a small following among veteran party cadres and the CGIL."
 COLDWAR_ITA_registry_cossutta_icon: "£generic_communist_state_small"
 COLDWAR_ITA_registry_psi_left: "£generic_neutral_Social_small (PSI-S) - Socialist Left"
 COLDWAR_ITA_registry_psi_left_desc: "(Left Socialism) - Socialist Left\n\nAfter Socialist Unity the left wing of the old PSI around Riccardo Lombardi and Claudio Signorile stays apart: structural reforms, planning and an alliance with the Communists remain its programme."
 COLDWAR_ITA_registry_psi_left_icon: "£generic_neutral_Social_small"
