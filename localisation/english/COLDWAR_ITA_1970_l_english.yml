# IMPERIA COLD WAR — Cold War: Italy 1970 national programme.
 # IMPERIA COLD WAR update 21.11.2026: tag code replaced by the country name in two descriptions.
 # IMPERIA COLD WAR update 21.11.2026: tag code replaced by the country name in two descriptions.
 COLDWAR_ITA_1970_focus: "Italy"
 COLDWAR_ITA_dc_tree_shortcut: "Democrazia Cristiana"
 COLDWAR_ITA_pci_tree_shortcut: "PCI"
 COLDWAR_ITA_psi_tree_shortcut: "PSI"
 COLDWAR_ITA_msi_tree_shortcut: "MSI-DN"
 COLDWAR_ITA_economy_tree_shortcut: "The Economy"
 COLDWAR_ITA_south_tree_shortcut: "The South"
 FOCUS_FILTER_COLDWAR_ITA_PARTIES: "Italy: Parties and Governments"
 FOCUS_FILTER_COLDWAR_ITA_ECONOMY: "Italy: The Economic Miracle"
 FOCUS_FILTER_COLDWAR_ITA_SOUTH: "Italy: The Southern Question"
 FOCUS_FILTER_COLDWAR_ITA_SECURITY: "Italy: The Years of Lead"
 FOCUS_FILTER_COLDWAR_ITA_MILITARY: "Italy: The Southern Flank"
 FOCUS_FILTER_COLDWAR_ITA_WORLD: "Italy in the World"
 COLDWAR_ITA_dc_e: "The Party of the Nation"
 COLDWAR_ITA_dc_e_desc: "Mariano Rumor governs with a cabinet of Christian Democrats alone, the coffins of Piazza Fontana barely buried and Mirafiori still on strike. Bishops, peasants, clerks and industrialists: only the DC speaks to all of them."
 COLDWAR_ITA_dc_pol: "Correnti and the Manuale Cencelli"
 COLDWAR_ITA_dc_pol_desc: "In the smoke of Palazzo Sturzo every ministry, every bank chair and every RAI desk is weighed against the delegates of each corrente. Secretary Forlani keeps the scales level, and the party stays whole."
 COLDWAR_ITA_dc_eco: "The Social Market of the State Holdings"
 COLDWAR_ITA_dc_eco_desc: "Neither Moscow nor Manchester: the state owns the steel, the oil, the motorways and the banks, and the market does the rest. A Catholic economy where the factory chimney and the parish bell stand side by side."
 COLDWAR_ITA_dc_lw1: "Catholic Action in Every Parish"
 COLDWAR_ITA_dc_lw1_desc: "Every Sunday the civic committees hand out leaflets after mass, and every parish hall shows a film from Cinecitta before the vote. The young drift away to the piazza; we bring them back to the oratory."
 COLDWAR_ITA_dc_a1: "Dorotei Mediation"
 COLDWAR_ITA_dc_a1_desc: "Rumor, Piccoli and Bisaglia never shout. They phone, they promise, they find a post for the cousin of the mayor of Rovigo, and the strike ends before the television arrives."
 COLDWAR_ITA_dc_a2: "Fanfani's Strong State"
 COLDWAR_ITA_dc_a2_desc: "Amintore Fanfani wants a state that decides: a strong executive, a disciplined party, ministers who obey the secretary. Order in the piazze, order in the ministries."
 COLDWAR_ITA_dc_b1: "Growth Poles in the South"
 COLDWAR_ITA_dc_b1_desc: "Steel at Taranto, chemicals at Brindisi and Gela, a new pole for every province. The north calls them cathedrals in the desert; the south calls them the first wage in the family."
 COLDWAR_ITA_dc_b2: "Northern Industry First"
 COLDWAR_ITA_dc_b2_desc: "Let Fiat, Pirelli and Olivetti run, and the south will ride the train north to their gates. While Rome feeds the factories that already work, Reggio Calabria burns its barricades."
 COLDWAR_ITA_dc_un1: "IRI, the State as Entrepreneur"
 COLDWAR_ITA_dc_un1_desc: "Italsider, Alfa Romeo, Alitalia, the Autostrada del Sole and three banks of national interest: the IRI builds what private capital will not risk. The manager answers to the minister, the minister to the party."
 COLDWAR_ITA_dc_lw2: "The Referendum of 12 May 1974"
 COLDWAR_ITA_dc_lw2_desc: "Fanfani threw the whole party into the campaign to repeal divorce and the country said no. We bow to the vote, keep the faithful who stood with us and stop fighting the last war."
 COLDWAR_ITA_dc_a1f: "The Doroteo Network"
 COLDWAR_ITA_dc_a1f_desc: "From Vicenza to Trento every small firm, every savings bank and every parish band knows whom to call in Rome. Bisaglia's Veneto is white, rich and loyal."
 COLDWAR_ITA_dc_a2f: "Fanfani Secretary Again"
 COLDWAR_ITA_dc_a2f_desc: "Fanfani is secretary again and the party moves to his rhythm. The police get new powers, the correnti get orders, and the republic gets a man who means to be obeyed."
 COLDWAR_ITA_dc_b1f: "The Colombo Package for Calabria"
 COLDWAR_ITA_dc_b1f_desc: "Prime Minister Colombo promises Calabria a fifth steel centre and a great port at Gioia Tauro to end the revolt in Reggio. The bulldozers come, and so do the clans."
 COLDWAR_ITA_dc_b2f: "The Triangle of Turin, Milan, Genoa"
 COLDWAR_ITA_dc_b2f_desc: "Fiat's assembly lines, Olivetti's calculators and Pirelli's tyres carry the lira. Agnelli gets his new plant; the south gets the night train."
 COLDWAR_ITA_dc_un2: "ENI after Mattei"
 COLDWAR_ITA_dc_un2_desc: "Enrico Mattei broke the Seven Sisters and died in a plane over Bascape. His ENI still buys oil where the Americans will not go and pays the party where the voters cannot see."
 COLDWAR_ITA_dc_lw3: "Coldiretti and the Green Front"
 COLDWAR_ITA_dc_lw3_desc: "Paolo Bonomi's Coldiretti delivers the countryside: three million smallholders, their cooperatives and their votes. Brussels pays for the milk, the party pays for the rest."
 COLDWAR_ITA_dc_pm: "Governing from the Centre"
 COLDWAR_ITA_dc_pm_desc: "Centre left, centrist, monocolore: the formula changes every year, the DC stays. Andreotti says power wears out only those who do not have it."
 COLDWAR_ITA_dc_em: "The Mixed Economy Holds"
 COLDWAR_ITA_dc_em_desc: "The oil shock hits, the lira slides, and still the state groups keep the furnaces lit. No mass sackings at Italsider while the DC holds the treasury."
 COLDWAR_ITA_dc_un3: "Refinance the Cassa"
 COLDWAR_ITA_dc_un3_desc: "Aqueducts in Apulia, dams in Basilicata, roads into the Aspromonte. The Cassa has money for everything, and every contract has a godfather in the party who remembers the favour at election time."
 COLDWAR_ITA_dc_lw4: "The Concordat Question"
 COLDWAR_ITA_dc_lw4_desc: "Whatever the lawyers write in Rome, the oratory, the parish school and the hospital ward stay in Church hands. The DC negotiates with Cardinal Casaroli and keeps the Church at the centre of every village."
 COLDWAR_ITA_dc_c1: "Moro's Terza Fase"
 COLDWAR_ITA_dc_c1_desc: "Moro speaks of a third phase: the communists cannot stay outside the walls forever. Zaccagnini's honest face, Berlinguer's outside support, and Kissinger's warnings in the background."
 COLDWAR_ITA_dc_c2: "The Preambolo"
 COLDWAR_ITA_dc_c2_desc: "Donat Cattin's preamble closes the door: no government with the communists. The congress hall erupts, and the socialists of Craxi become our partners of choice."
 COLDWAR_ITA_dc_d1: "The Atlantic Anchor"
 COLDWAR_ITA_dc_d1_desc: "Cossiga says yes to the Euromissiles and the peace marchers walk to Comiso. Italy proves to Washington that the southern flank holds."
 COLDWAR_ITA_dc_d2: "Andreotti's Mediterranean"
 COLDWAR_ITA_dc_d2_desc: "Andreotti talks to the Arabs, the Palestinians and the colonel in Tripoli. Gaddafi expelled our settlers in 1970; now his bank buys nine percent of Fiat, and Turin smiles."
 COLDWAR_ITA_dc_ns: "Gas for Pipes"
 COLDWAR_ITA_dc_ns_desc: "Moscow has gas and needs steel tubes; Finsider has tubes and Italy needs gas. Togliattigrad already builds the Fiat 124, so why not a pipeline across Austria to the Po valley?"
 COLDWAR_ITA_dc_cm: "The State Survives the Years of Lead"
 COLDWAR_ITA_dc_cm_desc: "Moro is dead and the DC did not bend. Ministers, prefects and carabinieri keep the Republic standing, and the party takes the credit at the next election."
 COLDWAR_ITA_dc_dm: "Italy at the Summit Table"
 COLDWAR_ITA_dc_dm_desc: "Six heads of government in a French chateau, and the Italian prime minister among them. Whatever Washington thinks of our coalitions, the West cannot be governed without Rome."
 COLDWAR_ITA_dc_cap: "The Christian Democratic Republic"
 COLDWAR_ITA_dc_cap_desc: "The white whale has swallowed bombs, referendums, the oil shock and the murder of its best man, and it still swims at the centre of the Republic. No one governs Italy without the DC."
 COLDWAR_ITA_dc_h: "After Moro"
 COLDWAR_ITA_dc_h_desc: "The man who could talk to everyone lies in a Renault in Via Caetani. Zaccagnini resigns, Piccoli holds the line, and the P2 lists show who else sat in the shadows."
 COLDWAR_ITA_dc_k1: "De Mita's Renewal"
 COLDWAR_ITA_dc_k1_desc: "Ciriaco De Mita from Nusco wants a modern, lean DC of managers and professors. The old notables of the south grumble, and in 1983 the voters punish the experiment."
 COLDWAR_ITA_dc_k2: "The CAF Axis"
 COLDWAR_ITA_dc_k2_desc: "Craxi, Andreotti and Forlani shake hands on a camper at the socialist congress. Five parties share every bank, every hospital and every RAI channel, and nobody asks where the envelopes go."
 COLDWAR_ITA_dc_k1f: "Seize the Mafia Fortunes"
 COLDWAR_ITA_dc_k1f_desc: "Ten days after General Dalla Chiesa is shot in Palermo, mafia association becomes a crime and the clans' fortunes can be seized. The Maxi Trial is coming, and some of our own are nervous."
 COLDWAR_ITA_dc_k2f: "The Sicilian Current"
 COLDWAR_ITA_dc_k2f_desc: "Salvo Lima delivers Palermo to the Andreotti current, and Palermo delivers the votes. In Sicily the party, the contracts and the families are hard to tell apart."
 COLDWAR_ITA_dc_km: "The Programme of Piazza del Gesu"
 COLDWAR_ITA_dc_km_desc: "The Wall falls, the communists change their name, and Forlani asks what a Christian Democracy is for without them. Piazza del Gesu writes a programme for a Europe without blocs."
 COLDWAR_ITA_pri_e: "The Republican Conscience"
 COLDWAR_ITA_pri_e_desc: "Fewer than three voters in a hundred, yet no cabinet is formed without asking what Ugo La Malfa thinks of the budget. We are the schoolmasters of the Republic, and for once the class is ours."
 COLDWAR_ITA_pri_pol: "The Secular Pole"
 COLDWAR_ITA_pri_pol_desc: "The lay parties are small, but they read the papers and write the editorials. A government of the secular centre needs journalists as much as ministers."
 COLDWAR_ITA_pri_eco: "The Nota Aggiuntiva Ledger"
 COLDWAR_ITA_pri_eco_desc: "Ugo La Malfa wrote it in 1962: the boom cannot go on without a plan. Everybody agrees, until the plan has numbers in it."
 COLDWAR_ITA_pri_a1: "The Moral Question"
 COLDWAR_ITA_pri_a1_desc: "Public office is not a prize to be shared out. We say it in the Chamber and we say it in the editorials, and the old DC barons do not forgive us."
 COLDWAR_ITA_pri_a2: "The Needle of the Balance"
 COLDWAR_ITA_pri_a2_desc: "Five percent of the votes, and no majority without us. We are the weight on the scales, and the big parties know our price."
 COLDWAR_ITA_pri_b1: "Programming the Economy"
 COLDWAR_ITA_pri_b1_desc: "Investment by plan, the south first, the budget as a map of priorities. Confindustria calls it Soviet, we call it arithmetic."
 COLDWAR_ITA_pri_b2: "Rigour Before Everything"
 COLDWAR_ITA_pri_b2_desc: "The lira is a promise and the deficit is a lie. Cut first, plan afterwards, and tell the workers the truth before the bankers do."
 COLDWAR_ITA_pri_a1f: "The Law on Secret Lodges"
 COLDWAR_ITA_pri_a1f_desc: "Licio Gelli's list was found in a villa near Arezzo. Now the Republic says in law what it never dared say: a secret lodge is not a club, it is a conspiracy."
 COLDWAR_ITA_pri_a2f: "The Kingmaker's Portfolios"
 COLDWAR_ITA_pri_a2f_desc: "A republican at Palazzo Chigi, for the first time not a Christian Democrat. The DC sits on its hands and counts the days."
 COLDWAR_ITA_pri_b1f: "The Incomes Policy Pact"
 COLDWAR_ITA_pri_b1f_desc: "Wages, prices and profits at one table, with the state as referee. If everyone gives up a little, the lira gives up nothing."
 COLDWAR_ITA_pri_b2f: "The 1974 Budget Break"
 COLDWAR_ITA_pri_b2f_desc: "We leave the cabinet rather than sign a budget we do not believe. It is the republican way of telling the truth: you walk out of the room."
 COLDWAR_ITA_pri_pm: "The Republican Method"
 COLDWAR_ITA_pri_pm_desc: "Discuss, document, decide. Our method bores the Chamber and wins the argument."
 COLDWAR_ITA_pri_em: "The Honest Budget"
 COLDWAR_ITA_pri_em_desc: "Every lira in the budget has a name and a purpose. The Treasury publishes it, and nobody can say it did not know."
 COLDWAR_ITA_pri_c1: "The Malagodi Line"
 COLDWAR_ITA_pri_c1_desc: "The Liberals under Malagodi say what the Republicans only murmur: less state, lower taxes, a market that works. The south will have to learn to swim."
 COLDWAR_ITA_pri_c2: "The Lib-Lab Line"
 COLDWAR_ITA_pri_c2_desc: "Valerio Zanone's Liberals talk to the left about divorce, rights and the rules of the game. The bourgeois ladies of Milan are scandalised, and the students listen."
 COLDWAR_ITA_pri_d1: "The Atlantic Republicans"
 COLDWAR_ITA_pri_d1_desc: "The Sixth Fleet sits in the Bay of Naples and the Republic sleeps behind it. We prefer to say so openly and to be a partner, not a protectorate."
 COLDWAR_ITA_pri_d2: "Defence Modernisation"
 COLDWAR_ITA_pri_d2_desc: "An army of conscripts in old barracks cannot guard a Mediterranean island. We modernise, and we pay for it."
 COLDWAR_ITA_pri_cm: "The Secular Reform Bloc"
 COLDWAR_ITA_pri_cm_desc: "Republicans, Liberals and Social Democrats around one table: the secular centre finally behaves like a party."
 COLDWAR_ITA_pri_dm: "The Atlantic and European Choice"
 COLDWAR_ITA_pri_dm_desc: "Rome belongs to the Atlantic Alliance and to the Common Market. It is both, not either."
 COLDWAR_ITA_pri_cap: "The Republic of Competence"
 COLDWAR_ITA_pri_cap_desc: "The country that was ruled by patrons is ruled by examinations. It will not make Italy charming, but it will make her solvent."
 COLDWAR_ITA_psdi_e: "The Party of Palazzo Barberini"
 COLDWAR_ITA_psdi_e_desc: "In 1947 we left the Socialists rather than march with the Communists. Saragat's party is small, loyal and stubborn, and now it holds the government."
 COLDWAR_ITA_psdi_pol: "The UIL and the Social Funds"
 COLDWAR_ITA_psdi_pol_desc: "The UIL is our trade union, moderate and anti-communist. It will not call a general strike for fun, and it does not forget who stood by it."
 COLDWAR_ITA_psdi_eco: "The Social Democratic Economy"
 COLDWAR_ITA_psdi_eco_desc: "Neither the free-for-all of the liberals nor the five-year plans of Moscow. A market with rules, a state with limits, a worker with a pension."
 COLDWAR_ITA_psdi_a1: "The Sottogoverno Machine"
 COLDWAR_ITA_psdi_a1_desc: "Somebody has to sit on the boards of the public bodies, and it is better that it is somebody who is loyal. Call it sottogoverno if you like, it keeps the coalition together."
 COLDWAR_ITA_psdi_a2: "The Clean Party"
 COLDWAR_ITA_psdi_a2_desc: "We write our accounts on the table and we put the party ticket in the drawer. After what happened to our friends, nobody can say we did not warn them."
 COLDWAR_ITA_psdi_b1: "Pensions for Everyone"
 COLDWAR_ITA_psdi_b1_desc: "An old man should not beg for his bread. A pension for everyone, financed by the state, and the budget will have to find the money."
 COLDWAR_ITA_psdi_b2: "The Moderate Wage Compact"
 COLDWAR_ITA_psdi_b2_desc: "Wages that follow productivity, strikes that are the last resort. The UIL signs, the CGIL shouts, and the factories keep running."
 COLDWAR_ITA_psdi_a1f: "Chairs on the Public Boards"
 COLDWAR_ITA_psdi_a1f_desc: "Every hospital, every savings bank, every public agency has a social democratic on its board. It is not elegant, and it is loyal."
 COLDWAR_ITA_psdi_a2f: "The Lockheed Lesson"
 COLDWAR_ITA_psdi_a2f_desc: "A minister of ours took money from an aircraft maker, and the President paid with his office. Never again, and we are going to prove it."
 COLDWAR_ITA_psdi_b1f: "The Pension Reform Law"
 COLDWAR_ITA_psdi_b1f_desc: "Pensions that follow wages, not the other way round. Our grandparents' bread is now written into the law."
 COLDWAR_ITA_psdi_b2f: "The Tripartite Table"
 COLDWAR_ITA_psdi_b2f_desc: "Government, bosses and unions around one table, with a UIL man in the chair. The coffee is cold and the agreement is warm."
 COLDWAR_ITA_psdi_pm: "The Social Democratic Programme"
 COLDWAR_ITA_psdi_pm_desc: "Not the revolution, only the reform that the factory worker can see in his pay envelope."
 COLDWAR_ITA_psdi_em: "The Balanced Welfare Budget"
 COLDWAR_ITA_psdi_em_desc: "Welfare that the budget can carry: every pension has a source, every source has a rule."
 COLDWAR_ITA_psdi_c1: "Order Against the Reds"
 COLDWAR_ITA_psdi_c1_desc: "Saragat said it in 1947 and says it again: no common cause with the Communists, in the factories, in the piazza or in the voting booth."
 COLDWAR_ITA_psdi_c2: "Houses for the Workers"
 COLDWAR_ITA_psdi_c2_desc: "Rent is a worker's second boss. We build, subsidise and plan housing for the families that came north on the train."
 COLDWAR_ITA_psdi_d1: "The Atlantic Guarantee Party"
 COLDWAR_ITA_psdi_d1_desc: "While others flirt with Moscow we sit at Washington's table. Italy's friends know exactly who we are, and that is worth a guarantee."
 COLDWAR_ITA_psdi_d2: "The Socialist International Line"
 COLDWAR_ITA_psdi_d2_desc: "Brandt in Bonn, Palme in Stockholm, and us in Rome: democratic socialism without a Soviet flag."
 COLDWAR_ITA_psdi_cm: "The Orderly Society"
 COLDWAR_ITA_psdi_cm_desc: "Housing, pensions and a police that knows the law. The reformists show that order and welfare can share one budget."
 COLDWAR_ITA_psdi_dm: "The Western Social Democracy"
 COLDWAR_ITA_psdi_dm_desc: "The Atlantic Alliance and the social democratic parties of the north: one family, one table."
 COLDWAR_ITA_psdi_cap: "The Republic of Reformist Order"
 COLDWAR_ITA_psdi_cap_desc: "A republic that remembers who stood against both extremes. The workers get a pension, the factories get calm, the ministries get honest enough."
 COLDWAR_ITA_psi_e: "The Carnation"
 COLDWAR_ITA_psi_e_desc: "A red carnation hangs over the congress hall and the hammer and sickle shrinks to a footnote. The oldest party of the Italian left wants to be modern, Milanese and in charge, not the junior partner of anyone."
 COLDWAR_ITA_psi_pol: "Autonomy of the Socialists"
 COLDWAR_ITA_psi_pol_desc: "Pietro Nenni broke with the communists after Budapest. We are neither the DC's client nor the PCI's little brother: the socialists choose their own allies and their own road."
 COLDWAR_ITA_psi_eco: "The Reformist Economy"
 COLDWAR_ITA_psi_eco_desc: "Neither Soviet plans nor Agnelli's whims. A reformist economy that keeps the lira honest, the factories running and the workers paid, argued over in smoke filled rooms on Via del Corso."
 COLDWAR_ITA_psi_lw1: "A Commission for Governability"
 COLDWAR_ITA_psi_lw1_desc: "Avanti! calls for a Grande Riforma: governments that last more than nine months and a state that decides. A bicameral commission sits down to rewrite how the Republic is governed."
 COLDWAR_ITA_psi_a1: "The Midas Hotel Coup"
 COLDWAR_ITA_psi_a1_desc: "After 9.6 per cent the central committee meets at a Roman hotel and the young men take the party. Bettino Craxi wants voters from Saragat and from the DC, not lessons from Botteghe Oscure."
 COLDWAR_ITA_psi_a2: "Equilibri piu Avanzati"
 COLDWAR_ITA_psi_a2_desc: "Francesco De Martino wants more advanced balances: no government without the communists. The left together in the piazza, the left together in Parliament."
 COLDWAR_ITA_psi_b1: "Lombardi's Structural Reforms"
 COLDWAR_ITA_psi_b1_desc: "Riccardo Lombardi says reforms must change the structures, not just the budget lines: electricity, land, credit. Capitalism is to be tamed from the inside."
 COLDWAR_ITA_psi_b2: "Liberal Socialism"
 COLDWAR_ITA_psi_b2_desc: "Milan shows the way: designers, boutiques, brokers and small workshops. Socialism means freedom and opportunity, and the market is not the enemy."
 COLDWAR_ITA_psi_un1: "The Socialist Managers"
 COLDWAR_ITA_psi_un1_desc: "Our men now sit at ENI, at IRI, at EFIM. They build in the south and they deliver, and every contract leaves a little something for the party."
 COLDWAR_ITA_psi_lw2: "End of the Secret Vote"
 COLDWAR_ITA_psi_lw2_desc: "The franchi tiratori hide behind the secret ballot and sink every government from inside. From now on every deputy votes in the open, and answers for it."
 COLDWAR_ITA_psi_a1f: "Il Vangelo Socialista"
 COLDWAR_ITA_psi_a1f_desc: "Craxi writes that Proudhon, not Lenin, is the father of freedom. The communists choke on their coffee; the ex voters of the DC read on."
 COLDWAR_ITA_psi_a2f: "The Left Alternative"
 COLDWAR_ITA_psi_a2f_desc: "A government of the left without the DC: socialists and communists together, with a socialist at Palazzo Chigi. The Americans count our missiles twice."
 COLDWAR_ITA_psi_b1f: "Democratic Planning"
 COLDWAR_ITA_psi_b1f_desc: "A five year plan for Italy, drawn up in Rome and built in the south. Not Gosplan: a map of where the state puts its money."
 COLDWAR_ITA_psi_b2f: "Merits and Needs"
 COLDWAR_ITA_psi_b2f_desc: "Reward those who deserve, help those who need. Claudio Martelli tells the congress that the new left speaks to engineers and shopkeepers, not only to blue overalls."
 COLDWAR_ITA_psi_un2: "Milano da Bere"
 COLDWAR_ITA_psi_un2_desc: "Aperitivi in Brera, fashion shows, three private channels on every television set. Milan drinks to itself and the whole country watches."
 COLDWAR_ITA_psi_lw3: "A President Elected by the People"
 COLDWAR_ITA_psi_lw3_desc: "Let the people choose the head of state, as the French do. The left shouts about a new Duce; we answer that a republic which cannot decide invites the colonels."
 COLDWAR_ITA_psi_pm: "The Hinge of the Republic"
 COLDWAR_ITA_psi_pm_desc: "With ten per cent we decide who governs Italy. Every cabinet needs the socialists, and every cabinet knows it."
 COLDWAR_ITA_psi_em: "Growth with Equity"
 COLDWAR_ITA_psi_em_desc: "Growth for Milan and welfare for Naples, both paid from the same budget. Nobody asks too loudly where the money comes from."
 COLDWAR_ITA_psi_un3: "Piazza Affari and the Biscione"
 COLDWAR_ITA_psi_un3_desc: "The Borsa rings its bell at nine and the Biscione network sells soap and dreams from Aosta to Palermo. Milan has money and wants a say in Rome, and London looks on with a sour face."
 COLDWAR_ITA_psi_lw4: "The Pentapartito Pact"
 COLDWAR_ITA_psi_lw4_desc: "DC, PSI, PSDI, PRI and PLI sign one pact for a whole legislature. The governments still fall, but now they fall inside the same five parties."
 COLDWAR_ITA_psi_c1: "The San Valentino Decree"
 COLDWAR_ITA_psi_c1_desc: "On Valentine's Day the government cuts three points off the wage escalator by decree. The communists fill Piazza San Giovanni and call a referendum; we bet that the country is tired of inflation."
 COLDWAR_ITA_psi_c2: "The Scotti Protocol"
 COLDWAR_ITA_psi_c2_desc: "Unions, employers and government sign one protocol at the ministry: moderate wages, lower taxes, no strikes in the big plants. Luciano Lama shakes hands, the factories stay open."
 COLDWAR_ITA_psi_d1: "Sovereignty on Italian Soil"
 COLDWAR_ITA_psi_d1_desc: "At night on the Sicilian runway Carabinieri and airmen surround the American Delta Force. Italian soil, Italian law: the hijackers' plane is ours."
 COLDWAR_ITA_psi_d2: "Craxi Says Yes to Comiso"
 COLDWAR_ITA_psi_d2_desc: "Sicily gets the cruise missiles and we get a seat in NATO's inner room. Rome proves to Washington that the socialists are reliable allies."
 COLDWAR_ITA_psi_ns: "The Mediterranean Bridge"
 COLDWAR_ITA_psi_ns_desc: "The Mediterranean is our sea, not a NATO pond. Libyan money buys into Fiat, Arafat is received in Rome, and Washington frowns from across the ocean."
 COLDWAR_ITA_psi_cm: "Inflation Beaten"
 COLDWAR_ITA_psi_cm_desc: "Inflation falls from twelve per cent to five, and housewives notice at the market. The debt grows quietly in the Treasury ledgers."
 COLDWAR_ITA_psi_dm: "A Seat at Every Table"
 COLDWAR_ITA_psi_dm_desc: "Italy belongs at every table where the West decides, and walks out when it is left at the door. The fifth economy of the world wants to be treated as one."
 COLDWAR_ITA_psi_cap: "Decisionismo"
 COLDWAR_ITA_psi_cap_desc: "The longest government of the Republic decides, by decree if it must. Cartoonists draw Craxi in black boots; the trains and the budget committees run on time."
 COLDWAR_ITA_psi_h: "After Ghino di Tacco"
 COLDWAR_ITA_psi_h_desc: "Ghino di Tacco is gone and the party looks at its accounts in fear. The heirs must choose between Martelli's modern left and Amato's sober professors."
 COLDWAR_ITA_psi_k1: "Martelli's Modern Left"
 COLDWAR_ITA_psi_k1_desc: "Claudio Martelli wants a left of rights and merit, young and laic. The party must look like the Italy of 1990, not the sections of 1950."
 COLDWAR_ITA_psi_k2: "Amato's Technocrats"
 COLDWAR_ITA_psi_k2_desc: "Giuliano Amato and the technicians: balance sheets before banners. The lira and the debt are the real enemies now."
 COLDWAR_ITA_psi_k1f: "Falcone at the Ministry"
 COLDWAR_ITA_psi_k1f_desc: "Martelli brings Giovanni Falcone to the ministry in Rome. A national antimafia prosecutor and an investigative directorate: the clans have never faced the state like this."
 COLDWAR_ITA_psi_k2f: "The Amato Budget"
 COLDWAR_ITA_psi_k2f_desc: "In one night the state takes six lire in every thousand from every bank account. It hurts, but Italy shows Europe it can still pay its bills."
 COLDWAR_ITA_psi_km: "Reformist Unity"
 COLDWAR_ITA_psi_km_desc: "The wall has fallen in Berlin and the communists change their name. Now the socialists offer the whole Italian left one house, reformist and European."
 COLDWAR_ITA_pci_e: "Il Partito Nuovo in Government"
 COLDWAR_ITA_pci_e_desc: "Red flags over Piazza San Giovanni and a communist minister in every corridor of Palazzo Chigi. Longo's party of cells has become the government of the Republic, and Confindustria counts its lire."
 COLDWAR_ITA_pci_pol: "Democratic Centralism in a Mass Party"
 COLDWAR_ITA_pci_pol_desc: "Two million members, one line. The Federation decides, the sections obey, and whoever prints his own journal is shown the door, as Rossanda and Pintor learned."
 COLDWAR_ITA_pci_eco: "The Emilian Model"
 COLDWAR_ITA_pci_eco_desc: "Bologna has the best kindergartens in Europe and buses that run on time. What the red regions built since June 1970, the whole country will now copy."
 COLDWAR_ITA_pci_lw1: "The Feste dell'Unita"
 COLDWAR_ITA_pci_lw1_desc: "Every summer the whole of Italy dances under the red lanterns: lambrusco, ballroom orchestras, a speech from the secretary and the Unita sold by the million."
 COLDWAR_ITA_pci_a1: "Berlinguer's Compromesso Storico"
 COLDWAR_ITA_pci_a1_desc: "After Santiago, Berlinguer writes that a left with 51% cannot govern Italy alone. We keep the Christian Democrats at the table, Catholic and communist masses together."
 COLDWAR_ITA_pci_a2: "The Alternativa di Sinistra"
 COLDWAR_ITA_pci_a2_desc: "No deals with the party of Gava and the Lockheed bribes. Communists and socialists govern together, as the piazzas have demanded since the Hot Autumn."
 COLDWAR_ITA_pci_b1: "The Austerita Speech"
 COLDWAR_ITA_pci_b1_desc: "Berlinguer at the Eliseo theatre: austerity is not a sacrifice for the bosses but a chance to change what we produce. Fewer cars, more schools, more buses."
 COLDWAR_ITA_pci_b2: "The Scala Mobile Promise"
 COLDWAR_ITA_pci_b2_desc: "Every wage climbs with prices, point for point. The workers sleep well; the Banca d'Italia does not, and the lira slides on the Zurich exchange."
 COLDWAR_ITA_pci_un1: "Legacoop, the Red Cooperatives"
 COLDWAR_ITA_pci_un1_desc: "From the Coop supermarket to the building sites of the motorway, the red cooperatives do the work. Workers own the firm, and the firm votes with us."
 COLDWAR_ITA_pci_lw2: "The CGIL at the Table"
 COLDWAR_ITA_pci_lw2_desc: "Luciano Lama sits at the cabinet table with his pipe. The CGIL no longer strikes against the government; it negotiates with comrades, and Mirafiori listens."
 COLDWAR_ITA_pci_a1f: "The Workers Who Stood with Rossa"
 COLDWAR_ITA_pci_a1f_desc: "They took a statesman in Via Fani and they shot Guido Rossa, a communist worker, in Genoa. Our factory sections name the informers and hold the line; the Republic does not kneel."
 COLDWAR_ITA_pci_a2f: "The Red Giunte"
 COLDWAR_ITA_pci_a2f_desc: "Turin, Naples, Rome, Milan: red mayors in every great city, socialists and communists side by side. The Roman summer has Nicolini's open air cinema."
 COLDWAR_ITA_pci_b1f: "Rigore e Sobrieta"
 COLDWAR_ITA_pci_b1f_desc: "Fewer subsidies for a second car, more money for laboratories and public transport. Berlinguer's sobriety becomes a way of life, and Olivetti gets the research budget."
 COLDWAR_ITA_pci_b2f: "Il Punto Unico di Contingenza"
 COLDWAR_ITA_pci_b2f_desc: "Social peace bought point by point. The strike hours fall, the factory councils sign three year contracts, and Agnelli grumbles in Corso Marconi."
 COLDWAR_ITA_pci_un2: "The National Planning Agency"
 COLDWAR_ITA_pci_un2_desc: "Planners from the Ministry of the Budget and the CGIL draw a five year plan for the whole peninsula. The south gets the factories first, and Naples gets the cranes."
 COLDWAR_ITA_pci_lw3: "The New Family Law"
 COLDWAR_ITA_pci_lw3_desc: "Husband and wife equal before the law, children born outside marriage equal too. The women of UDI marched for this, and the divorce vote showed that Italy is ready."
 COLDWAR_ITA_pci_pm: "Clean Hands, Open Books"
 COLDWAR_ITA_pci_pm_desc: "The parties have occupied the state, the banks, the hospitals and RAI. Our hands stay clean, and we say it out loud: politics is not a business."
 COLDWAR_ITA_pci_em: "Steel for Gioia Tauro"
 COLDWAR_ITA_pci_em_desc: "After the revolt of Reggio, Calabria was promised a steel centre. This time it is built, by the state and for Calabrians, while the clans circle the tenders."
 COLDWAR_ITA_pci_un3: "ENI and IRI Answer to the Ministry"
 COLDWAR_ITA_pci_un3_desc: "IRI's steel mills and shipyards, ENI's refineries and Alfa Romeo itself now take their orders from a communist minister. Mattei's dream of an independent Italy returns."
 COLDWAR_ITA_pci_lw4: "Law 194"
 COLDWAR_ITA_pci_lw4_desc: "No more back rooms and knitting needles. Abortion becomes legal and free in public hospitals, and the bishops call the faithful to the polls against us."
 COLDWAR_ITA_pci_c1: "Under the NATO Umbrella"
 COLDWAR_ITA_pci_c1_desc: "Berlinguer tells Pansa he feels safer on this side, under the NATO umbrella, building socialism in freedom. In Prague we were already the first to say no."
 COLDWAR_ITA_pci_c2: "Fraternal Ties with Moscow"
 COLDWAR_ITA_pci_c2_desc: "Cossutta brings the comrades from Moscow to Botteghe Oscure. The roubles keep the Unita printing, and the State Department starts counting our ministers."
 COLDWAR_ITA_pci_d1: "The Eurocommunist Axis"
 COLDWAR_ITA_pci_d1_desc: "Berlinguer, Carrillo and Marchais in one room in Madrid: a communism of parliaments, free unions and free newspapers. Paris must choose whether to join us."
 COLDWAR_ITA_pci_d2: "A Neutral Italy"
 COLDWAR_ITA_pci_d2_desc: "Between Washington and Moscow sits a Mediterranean country that wants neither bases nor missiles. Belgrade shows the way, and Aviano's runways fall quiet."
 COLDWAR_ITA_pci_ns: "The Spirit of Osimo"
 COLDWAR_ITA_pci_ns_desc: "The border with Tito is drawn for good and Trieste becomes a bridge, not a trench. Slovenian gas, Italian machines, open Adriatic ports."
 COLDWAR_ITA_pci_cm: "Pio La Torre's Law"
 COLDWAR_ITA_pci_cm_desc: "Pio La Torre wanted mafia membership to be a crime and mafia wealth to be confiscated. It is law now, written in Palermo's blood."
 COLDWAR_ITA_pci_dm: "The March on Comiso"
 COLDWAR_ITA_pci_dm_desc: "A hundred thousand march to the almond groves of Comiso where the cruise missiles are to stand. Sicily wants to be an island of peace, not a target."
 COLDWAR_ITA_pci_cap: "La Terza Via"
 COLDWAR_ITA_pci_cap_desc: "Neither Brezhnev's tanks nor the social democracy of the bankers. Italy proves that socialism can grow in freedom, and the whole of Europe watches."
 COLDWAR_ITA_pci_h: "Ciao Enrico"
 COLDWAR_ITA_pci_h_desc: "Berlinguer collapsed on a stage in Padua. A million people fill Rome for his funeral, and for once we outpoll the DC. Now gentle Natta must lead."
 COLDWAR_ITA_pci_k1: "The Miglioristi of Napolitano"
 COLDWAR_ITA_pci_k1_desc: "Napolitano's Miglioristi want a party of reform, at ease in Strasbourg and in the boardrooms of Milan. Amendola's heirs say the future is European social democracy."
 COLDWAR_ITA_pci_k2: "Ingrao's Movement Left"
 COLDWAR_ITA_pci_k2_desc: "Pietro Ingrao has always claimed the right to dissent. His left wants a party of the movements: peace, environment, the factory floor, never the salons."
 COLDWAR_ITA_pci_k1f: "La Svolta della Bolognina"
 COLDWAR_ITA_pci_k1f_desc: "In a Bologna district hall Occhetto announces that everything will change, even the name. The hammer and sickle go under the roots of an oak tree."
 COLDWAR_ITA_pci_k2f: "The Party of the Movements"
 COLDWAR_ITA_pci_k2f_desc: "Greens, pacifists, feminists and the young workers of the south march with us from Perugia to Assisi. The party listens before it decides."
 COLDWAR_ITA_pci_km: "Occhetto's Nuovo Corso"
 COLDWAR_ITA_pci_km_desc: "Occhetto opens the windows of Botteghe Oscure. A new course for a party that governs: modern, European, and still with the people of the Feste."
 COLDWAR_ITA_dp_e: "The New Left in Parliament"
 COLDWAR_ITA_dp_e_desc: "We are the Italy that the Communist Party expelled and the Christian Democrats never invited. Students, workers and priests of the left sit in Parliament, and nobody can tell us to wait our turn."
 COLDWAR_ITA_dp_pol: "Il Manifesto Daily"
 COLDWAR_ITA_dp_pol_desc: "Rossanda, Pintor and Magri put out a daily paper from a rented floor in Rome. It says in print what the base whispers in the sezioni: the Party has become a bureaucracy of the Compromesso."
 COLDWAR_ITA_dp_eco: "Factory Councils Everywhere"
 COLDWAR_ITA_dp_eco_desc: "At Mirafiori and at Pirelli Bicocca the delegates are elected on the shop floor, not in the union hall. Every plant gets its council, and the foreman learns to knock."
 COLDWAR_ITA_dp_a1: "Council Democracy"
 COLDWAR_ITA_dp_a1_desc: "No leaders, no secret rooms: the assembly decides, the delegate can be recalled in a week. It is slow, loud, and nobody can buy it."
 COLDWAR_ITA_dp_a2: "A Party of a New Kind"
 COLDWAR_ITA_dp_a2_desc: "Capanna fills Piazza del Duomo and Magri writes the theses: we need a party that can win a vote as well as a march, but not the one on Botteghe Oscure."
 COLDWAR_ITA_dp_b1: "Self-Managed Factories"
 COLDWAR_ITA_dp_b1_desc: "The board of the factory is the assembly of its workers. They set the shifts, the wages and the prices, and the owners finally have to listen."
 COLDWAR_ITA_dp_b2: "The Radical Welfare State"
 COLDWAR_ITA_dp_b2_desc: "Free hospitals, cheap homes and schools open in the afternoon, paid by a steep tax on the big fortunes. Sicily and Calabria first."
 COLDWAR_ITA_dp_a1f: "The Delegates' Assembly"
 COLDWAR_ITA_dp_a1f_desc: "Delegates serve a year and return to the line. Nobody grows old in a seat."
 COLDWAR_ITA_dp_a2f: "The Lists of the Movements"
 COLDWAR_ITA_dp_a2f_desc: "PdUP, Avanguardia Operaia and the movement committees run under one symbol. It is untidy and loud, and it takes votes from both big parties of the left."
 COLDWAR_ITA_dp_b1f: "The Cooperative Plants"
 COLDWAR_ITA_dp_b1f_desc: "When a firm goes bankrupt its workers take it over, with the credit of a public fund. The banks cry property, we answer jobs."
 COLDWAR_ITA_dp_b2f: "The Thirty-Five Hour Week"
 COLDWAR_ITA_dp_b2f_desc: "Work less so that everybody works: the shift ends at one in the afternoon and the evening belongs to the circolo and the family."
 COLDWAR_ITA_dp_pm: "Power from Below"
 COLDWAR_ITA_dp_pm_desc: "Councils in the plants, committees in the quarters, assemblies in the schools. A republic grown from the bottom, one meeting at a time."
 COLDWAR_ITA_dp_em: "A Different Economy"
 COLDWAR_ITA_dp_em_desc: "We do not need a reactor in every valley. Sun, wind and rivers, and a plan to burn less."
 COLDWAR_ITA_dp_c1: "Neither with the State nor the BR"
 COLDWAR_ITA_dp_c1_desc: "Neither with the State nor with the Brigate Rosse. The bombs of the fascists and the pistols of the left both bury the movement, and we say so in the squares."
 COLDWAR_ITA_dp_c2: "The Movement of 1977"
 COLDWAR_ITA_dp_c2_desc: "Radio Alice jokes through the tear gas, the Metropolitan Indians dance in the squares. Bologna burns after a student is shot, and the Party calls us provocateurs."
 COLDWAR_ITA_dp_d1: "Out of the Blocs"
 COLDWAR_ITA_dp_d1_desc: "Italy needs no American bases in Naples and Vicenza, and no Soviet tanks either. We want the Mediterranean free of fleets."
 COLDWAR_ITA_dp_d2: "Solidarity with the Third World"
 COLDWAR_ITA_dp_d2_desc: "Cuba, Algeria, Vietnam, Mozambique: Italy's volunteers go where the empires leave. Doctors and teachers, not gunboats."
 COLDWAR_ITA_dp_cm: "The Civil Society Left"
 COLDWAR_ITA_dp_cm_desc: "Divorce, abortion, the asylums opened by Basaglia, a Workers' Statute: a country remade, one law after another."
 COLDWAR_ITA_dp_dm: "Peace from Comiso to Moscow"
 COLDWAR_ITA_dp_dm_desc: "Women camp outside Comiso and a million march in Rome against the missiles. Peace is a politics, not an absence of one."
 COLDWAR_ITA_dp_cap: "The Other Italy"
 COLDWAR_ITA_dp_cap_desc: "A republic of councils and movements, with the Compromesso never signed and the bombs never forgiven. The red flag and the rainbow share one balcony."
 COLDWAR_ITA_pr_e: "The Party of Civil Rights"
 COLDWAR_ITA_pr_e_desc: "Pannella in a three-piece suit and Emma Bonino beside him: we have lit a candle for every right the Republic forgot. Now the priests are the ones sweating."
 COLDWAR_ITA_pr_pol: "The Divorce League"
 COLDWAR_ITA_pr_pol_desc: "Italy was the last big Catholic country without divorce. We collected the signatures table by table, and the Vatican learned what a piazza can do."
 COLDWAR_ITA_pr_eco: "Markets Without Priests"
 COLDWAR_ITA_pr_eco_desc: "We are anticlerical, and we do not trust the state-owned holding companies any more than the bishops. Let people buy, sell and marry whom they like."
 COLDWAR_ITA_pr_a1: "The Referendum Republic"
 COLDWAR_ITA_pr_a1_desc: "The Constitution has a referendum and nobody uses it. We will collect signatures at every table in every piazza until the parties fear the ballot box."
 COLDWAR_ITA_pr_a2: "Parliamentary Radicalism"
 COLDWAR_ITA_pr_a2_desc: "Eighteen deputies who read every bill. In the Chamber we are the minority that never sleeps, the committee that never closes."
 COLDWAR_ITA_pr_b1: "Privatise the Party State"
 COLDWAR_ITA_pr_b1_desc: "Bureaucrats run the steelworks and the banks. We sell the shares, close the corridors, and see who still wants to be a manager."
 COLDWAR_ITA_pr_b2: "No Public Money for Parties"
 COLDWAR_ITA_pr_b2_desc: "The parties live on public money and pretend they are poor. We take the money away, and the Palazzo has to find real members."
 COLDWAR_ITA_pr_a1f: "Radio Radicale on the Air"
 COLDWAR_ITA_pr_a1f_desc: "The whole Chamber on the air, live, with the speeches nobody wanted you to hear. The country is learning what its deputies actually say."
 COLDWAR_ITA_pr_a2f: "The Filibuster of the Eighteen"
 COLDWAR_ITA_pr_a2f_desc: "Thousands of amendments, hours of speeches, and the majority has to explain itself at midnight. Obstruction is also a form of conversation."
 COLDWAR_ITA_pr_b1f: "Free Radio, Free Market"
 COLDWAR_ITA_pr_b1f_desc: "Local radios in every town, and a market for ideas as well as for goods. The state monopoly of the air is over."
 COLDWAR_ITA_pr_b2f: "The Citizens' Audit"
 COLDWAR_ITA_pr_b2f_desc: "Every public contract on a public website, every party account audited. Citizens own the books."
 COLDWAR_ITA_pr_pm: "The Radical Bill of Rights"
 COLDWAR_ITA_pr_pm_desc: "Divorce, abortion, conscientious objection, the vote at eighteen: one list of rights, one argument."
 COLDWAR_ITA_pr_em: "The Open Economy"
 COLDWAR_ITA_pr_em_desc: "Open the shops, open the borders, open the books."
 COLDWAR_ITA_pr_c1: "The Nonviolent Way"
 COLDWAR_ITA_pr_c1_desc: "Pannella on hunger strike, Bonino with her mouth taped shut in the piazza: nobody dies, and everybody listens. A bomb says nothing to the people it kills."
 COLDWAR_ITA_pr_c2: "Civil Liberties First"
 COLDWAR_ITA_pr_c2_desc: "Abortion is not a crime and the police are not a political party. The Republic's laws must apply to the minister as well as to the student."
 COLDWAR_ITA_pr_d1: "The Transnational Party"
 COLDWAR_ITA_pr_d1_desc: "A party for the whole continent and beyond. Rights do not stop at the Brenner, and neither do hunger strikes."
 COLDWAR_ITA_pr_d2: "No Nuclear Italy"
 COLDWAR_ITA_pr_d2_desc: "Let the country that invented Fermi's first pile decide whether it wants one in its backyard. We ask the villages first."
 COLDWAR_ITA_pr_cm: "The Republic of Rights"
 COLDWAR_ITA_pr_cm_desc: "Divorce, abortion, conscience and a police that reads the law. A rights culture is not decoration, it is the main building."
 COLDWAR_ITA_pr_dm: "Hunger Strike Diplomacy"
 COLDWAR_ITA_pr_dm_desc: "A man who refuses to eat can embarrass two superpowers at once. Pannella's stomach is our best embassy."
 COLDWAR_ITA_pr_cap: "The Radical Republic"
 COLDWAR_ITA_pr_cap_desc: "A Republic in which the minority is also a citizen, the voter is also a legislator and the loudest voice may be a hunger striker's whisper."
 COLDWAR_ITA_lega_e: "Autonomy for the North"
 COLDWAR_ITA_lega_e_desc: "The Coldiretti farmers of the Po plain and the little firms of Brianza feel Rome takes everything and returns a ministry. In the town halls they say it aloud: the north will decide for itself."
 COLDWAR_ITA_lega_pol: "Lombard Identity"
 COLDWAR_ITA_lega_pol_desc: "Dialect on the signs, the carroccio on the banners and a speech in the piazza from a man who works with his hands. A people that remembers 1167 will not be told what to think by Rome."
 COLDWAR_ITA_lega_eco: "The Workshops of the North"
 COLDWAR_ITA_lega_eco_desc: "Ten workers, one shed, one lathe, and an order book that reaches Stuttgart. The north's wealth is made in a thousand small workshops, not in the ministries."
 COLDWAR_ITA_lega_a1: "Federalism First"
 COLDWAR_ITA_lega_a1_desc: "Not a new state, but a new order: regions with their own budgets, their own schools and their own health service. Federalism is the Italian way to stay together."
 COLDWAR_ITA_lega_a2: "The Secession Talk"
 COLDWAR_ITA_lega_a2_desc: "Someone says it in a smoke filled room in Varese: if Rome will not listen, why stay? The prefect reports, the newspapers shriek, and the rooms fill up."
 COLDWAR_ITA_lega_b1: "The Tax Revolt"
 COLDWAR_ITA_lega_b1_desc: "The receipt book stays in the drawer. Why should the north's invoice pay for the cathedrals in the desert?"
 COLDWAR_ITA_lega_b2: "Fiscal Federalism"
 COLDWAR_ITA_lega_b2_desc: "Part of what Lombardy pays stays in Lombardy: for roads, schools and hospitals the citizens can see and judge."
 COLDWAR_ITA_lega_a1f: "The Regional Assemblies"
 COLDWAR_ITA_lega_a1f_desc: "The regional council sits in Milan with real powers over health, planning and transport. Rome keeps defence and the post office."
 COLDWAR_ITA_lega_a2f: "The Self-Determination Ballot"
 COLDWAR_ITA_lega_a2f_desc: "A ballot in the town halls: do we stay in the Republic, and on whose terms? The prefects send the carabinieri to count the boxes."
 COLDWAR_ITA_lega_b1f: "The Taxpayers' Strike"
 COLDWAR_ITA_lega_b1f_desc: "A man with a shed does not pay for a state that does not know where he works. The shed keeps the money, and keeps working."
 COLDWAR_ITA_lega_b2f: "The Regions Keep Their Taxes"
 COLDWAR_ITA_lega_b2f_desc: "The north's taxes are spent in the north: new sheds, new roads and a working railway to the Brenner."
 COLDWAR_ITA_lega_pm: "A Federal Italy"
 COLDWAR_ITA_lega_pm_desc: "Lombardy, Veneto, Piedmont and the others as equals inside a federal republic. Even the Mezzogiorno could try its own way."
 COLDWAR_ITA_lega_em: "The Productive North"
 COLDWAR_ITA_lega_em_desc: "The engine of Italy is northern, and it runs on small firms, family credit and export orders."
 COLDWAR_ITA_lega_c1: "Roma Ladrona"
 COLDWAR_ITA_lega_c1_desc: "Roma ladrona. The slogan is on every wall from Varese to Bergamo, and the south hears it as an insult."
 COLDWAR_ITA_lega_c2: "Parish and Cooperative"
 COLDWAR_ITA_lega_c2_desc: "On Sunday the priest blesses the harvest and the cooperative sets the price of milk. The north's identity has a bell tower."
 COLDWAR_ITA_lega_d1: "A Europe of the Regions"
 COLDWAR_ITA_lega_d1_desc: "Milan is closer to Munich than to Palermo. In a Europe of regions we trade with Bavaria and Rhone-Alpes directly."
 COLDWAR_ITA_lega_d2: "The Swiss Model"
 COLDWAR_ITA_lega_d2_desc: "Cantons, militias and armed neutrality. The Swiss have not fought a war since 1847 and they do not pay Rome."
 COLDWAR_ITA_lega_cm: "The Regional Constitution"
 COLDWAR_ITA_lega_cm_desc: "Regions write their own statutes and keep their own accounts. A republic of the regions."
 COLDWAR_ITA_lega_dm: "The Alpine Arc"
 COLDWAR_ITA_lega_dm_desc: "Lombardy, Bavaria, Tyrol and Slovenia talk to each other across the Alps without waiting for the foreign ministry."
 COLDWAR_ITA_lega_cap: "The Federal Republic of the Regions"
 COLDWAR_ITA_lega_cap_desc: "The Republic becomes a federation of regions, with Rome as a capital and not a master. Bergamo and Bari both vote on their budgets."
 COLDWAR_ITA_msi_e: "Destra Nazionale in Government"
 COLDWAR_ITA_msi_e_desc: "Giorgio Almirante takes the oath at the Quirinale in a dark double breasted suit. Outside, ANPI veterans stand silent with their partisan scarves, and in Brussels and Bonn the telephones do not stop ringing."
 COLDWAR_ITA_msi_pol: "The Presidential Question"
 COLDWAR_ITA_msi_pol_desc: "Forty cabinets in twenty five years, says Almirante, prove that the Republic of the parties cannot govern. A president elected by the people, or the slow decay goes on. In Montecitorio nobody laughs any more."
 COLDWAR_ITA_msi_eco: "The Social State of the Right"
 COLDWAR_ITA_msi_eco_desc: "The right speaks of the worker as well: pensions for the artisan, family allowances for the miner of Sulcis, the CISNAL in the ministry. Confindustria listens with crossed arms."
 COLDWAR_ITA_msi_lw1: "Law and Order with the Carabinieri"
 COLDWAR_ITA_msi_lw1_desc: "More Carabinieri in the stations of Milan and Rome, more roadblocks on the Autostrada del Sole. The right promises order, and the left asks whose order it will be."
 COLDWAR_ITA_msi_a1: "The Double Breasted Suit"
 COLDWAR_ITA_msi_a1_desc: "No boots, no black shirts, no Roman salutes on television. Almirante wants a right that the housewife of Bari and the notary of Turin can vote for, and he wants the DC to fear it."
 COLDWAR_ITA_msi_a2: "Rauti's National Popular Line"
 COLDWAR_ITA_msi_a2_desc: "Pino Rauti speaks to the steelworkers of Taranto and the day labourers of Foggia, against the capitalism of the north and against the American bases. The embassy on Via Veneto takes notes."
 COLDWAR_ITA_msi_b1: "The Chambers of Labour and Production"
 COLDWAR_ITA_msi_b1_desc: "Workers and employers, farmers and merchants sit in the same chambers and settle wages there, not on the picket lines at Mirafiori. The CGIL remembers who built such chambers last time."
 COLDWAR_ITA_msi_b2: "Free Enterprise for the Middle Class"
 COLDWAR_ITA_msi_b2_desc: "The baker, the tobacconist and the small builder carry the right at every election. Fewer forms, fewer inspectors, lower dues. The tax office in Rome counts the cost."
 COLDWAR_ITA_msi_un1: "Boia Chi Molla: Reggio Remembered"
 COLDWAR_ITA_msi_un1_desc: "Boia chi molla, shouted Reggio when Catanzaro became the regional capital. Ciccio Franco led the barricades for months. Now his party governs, and the south expects the debt to be paid."
 COLDWAR_ITA_msi_lw2: "The Legge Reale Extended"
 COLDWAR_ITA_msi_lw2_desc: "The Legge Reale gave the police the right to hold suspects and to shoot. Our government widens it again. Pannella's Radicals sit on the pavements of Piazza Navona with petitions."
 COLDWAR_ITA_msi_a1f: "The Monarchists Come Home"
 COLDWAR_ITA_msi_a1f_desc: "The monarchists bring the old Naples of Achille Lauro, the shipowners and the landowners of the south. The Savoy stay in Geneva, the Constitution says so, but the crown is on the posters again."
 COLDWAR_ITA_msi_a2f: "Socialisation in the Factories"
 COLDWAR_ITA_msi_a2f_desc: "Workers' delegates on the boards of the state firms of the south, profit shares at Taranto and Bagnoli. Agnelli calls it the Republic of Salo in a new suit; Rauti calls it justice."
 COLDWAR_ITA_msi_b1f: "The CNEL Becomes a Chamber"
 COLDWAR_ITA_msi_b1f_desc: "The quiet Council of Economy and Labour on Viale Lubin becomes a chamber that must be heard on every budget. The parties discover a new place to seat their friends."
 COLDWAR_ITA_msi_b2f: "The Shopkeepers' Tax Truce"
 COLDWAR_ITA_msi_b2f_desc: "An amnesty on old tax disputes and three quiet years for every shop with fewer than fifteen workers. The Bank of Italy writes a polite and very worried letter."
 COLDWAR_ITA_msi_un2: "The Gioia Tauro Steelworks"
 COLDWAR_ITA_msi_un2_desc: "The fifth steel centre was promised to Gioia Tauro, and the citrus groves were cleared for it. This time the furnaces are lit. Who builds the roads around them is another question."
 COLDWAR_ITA_msi_lw3: "The Antiterror Nuclei"
 COLDWAR_ITA_msi_lw3_desc: "Small Carabinieri units under one general, answering to Rome and to no current inside the services. They hunt the cells of every colour, and some of the trails lead to offices of the state."
 COLDWAR_ITA_msi_pm: "The Crisis of the System"
 COLDWAR_ITA_msi_pm_desc: "Almirante's old theme becomes the language of government: the parties have eaten the state. Every appointment at RAI and IRI is read out in the Chamber. The DC listens, and remembers."
 COLDWAR_ITA_msi_em: "The Corporatist Compact"
 COLDWAR_ITA_msi_em_desc: "A national pact on wages, prices and investment, signed in the Palazzo Chigi by the CISNAL, the CISL and Confindustria. The CGIL stays outside and calls a strike for the following Monday."
 COLDWAR_ITA_msi_un3: "The Prefect or the Notables"
 COLDWAR_ITA_msi_un3_desc: "In Palermo they still talk of the prefect who besieged the villages. In Naples the notables who brought Lauro's votes want their price. The ministry must decide which south it governs."
 COLDWAR_ITA_msi_lw4: "End the Strategy of Tension"
 COLDWAR_ITA_msi_lw4_desc: "Raids in the black underground and the red one, trials at speed, soldiers at Bologna station. The bombs grow rarer. In Piazza della Loggia the families ask why the state found its strength only now."
 COLDWAR_ITA_msi_c1: "Order without Terror"
 COLDWAR_ITA_msi_c1_desc: "The MSI government hands its own files to the magistrates of Brescia and Milan. Names from the black underground, names from the services. Some old comrades will never forgive it."
 COLDWAR_ITA_msi_c2: "The Hard Hand"
 COLDWAR_ITA_msi_c2_desc: "Emergency laws: detention without trial for ninety days, the army at the stations, curfews in the hot quarters of Milan. The bombs stop. So do many of the newspapers that asked too many questions."
 COLDWAR_ITA_msi_d1: "NATO's Southern Front Line"
 COLDWAR_ITA_msi_d1_desc: "Sigonella, Aviano, La Maddalena: the bases stay, and more come. The MSI, once suspicious of America, becomes its loudest friend in the Mediterranean. In Comiso the peace camps grow."
 COLDWAR_ITA_msi_d2: "The Mediterranean Third Way"
 COLDWAR_ITA_msi_d2_desc: "Enrico Mattei's road, walked by the right: oil from Algiers and Baghdad, ships from Genoa, no blind obedience to Washington. The Sixth Fleet still lies at Gaeta, and it watches."
 COLDWAR_ITA_msi_ns: "A Mediterranean Nation"
 COLDWAR_ITA_msi_ns_desc: "Gaddafi seized the houses of twenty thousand Italians in 1970 and gave them until October to leave, and our voters have not forgotten. Yet Libyan oil runs through Augusta and Libyan money buys into Turin. Rome talks to Tripoli."
 COLDWAR_ITA_msi_cm: "The Strong State"
 COLDWAR_ITA_msi_cm_desc: "The prefects obey, the police are paid on time, the trains to Reggio are guarded. The country is calmer. Whether it is freer is argued every night on the late news."
 COLDWAR_ITA_msi_dm: "Italy in the Mediterranean"
 COLDWAR_ITA_msi_dm_desc: "From Brindisi to Malta the Italian navy shows the flag. Rome wants a voice in every Mediterranean crisis, and it pays for the ships to make that voice heard."
 COLDWAR_ITA_msi_cap: "The Presidential Republic"
 COLDWAR_ITA_msi_cap_desc: "The people elect the head of the government for the first time since 1946. The right calls it the Second Republic. On 25 April the partisans march again, older now, and they are many."
 COLDWAR_ITA_msi_h: "After Almirante"
 COLDWAR_ITA_msi_h_desc: "Almirante steps down after eighteen years and dies a few months later. At his funeral the old guard and the young men of the Fronte della Gioventu stand side by side and do not speak."
 COLDWAR_ITA_msi_k1: "Fini's Modern Right"
 COLDWAR_ITA_msi_k1_desc: "Gianfranco Fini, thirty five, Almirante's chosen heir, speaks on television like a conservative from Munich or Madrid. The old flame stays on the party symbol, for now."
 COLDWAR_ITA_msi_k2: "Rauti's Movement"
 COLDWAR_ITA_msi_k2_desc: "Rauti wins the congress at Rimini with the votes of the young. Concerts, camps and a counter culture of runes and Tolkien, beyond right and left. The moderates start to leave."
 COLDWAR_ITA_msi_k1f: "The Road to Fiuggi"
 COLDWAR_ITA_msi_k1f_desc: "The party leaves the old name behind and writes a programme that a Christian Democrat could sign. The hardliners walk out of the hall and take the flame with them."
 COLDWAR_ITA_msi_k2f: "Linea Futura"
 COLDWAR_ITA_msi_k2f_desc: "Summer camps in the Abruzzo, ecology and Tolkien, the south against the north and Europe against the superpowers. A movement that wants to be modern without becoming liberal."
 COLDWAR_ITA_msi_km: "The New Destra Nazionale"
 COLDWAR_ITA_msi_km_desc: "Twenty years after the first oath, the right writes a new programme for a country that has outlived the Cold War. The question at every congress stays the same: how much of the past it keeps."
 COLDWAR_ITA_mon_e: "The Monarchist Revival"
 COLDWAR_ITA_mon_e_desc: "In the cafes of Naples and in the provincial salons the portrait of the King still hangs. We are the 45.7 percent who never accepted the verdict of 1946, and we are not asking for revenge."
 COLDWAR_ITA_mon_pol: "The King in Cascais"
 COLDWAR_ITA_mon_pol_desc: "In Cascais an old man who never abdicated writes letters. In Italian cafes they are read aloud, and nobody has forgotten who signed the Racial Laws."
 COLDWAR_ITA_mon_eco: "Order and Property"
 COLDWAR_ITA_mon_eco_desc: "Property, the family and a lira that holds. A king's economy is a landlord's economy, and it keeps the shopkeeper calm."
 COLDWAR_ITA_mon_a1: "The Constitutional Crown"
 COLDWAR_ITA_mon_a1_desc: "The crown reigns and does not rule: a Parliament, a Prime Minister, and above them a family that stands for the whole nation."
 COLDWAR_ITA_mon_a2: "The Strong Crown"
 COLDWAR_ITA_mon_a2_desc: "A King who can dismiss a cabinet and call the army. After thirty years of coalitions Italians may long for someone who decides."
 COLDWAR_ITA_mon_b1: "Lauro's Naples"
 COLDWAR_ITA_mon_b1_desc: "The Commander's Naples: jobs for friends, a new ferry for the port and a left shoe before the vote and the right one after."
 COLDWAR_ITA_mon_b2: "National Renewal"
 COLDWAR_ITA_mon_b2_desc: "Fewer favours, more exams. A state that pays its civil servants properly does not need to pay them in kind."
 COLDWAR_ITA_mon_a1f: "The Crown Under the Constitution"
 COLDWAR_ITA_mon_a1f_desc: "The Crown swears an oath to the Constitution of 1948. The first king of the Republic is a citizen with a crown."
 COLDWAR_ITA_mon_a2f: "The King as Arbiter"
 COLDWAR_ITA_mon_a2f_desc: "The King as arbiter above the parties: he can stop a crisis, he can call an election, and Vittorio Emanuele learns the trade at his father's elbow."
 COLDWAR_ITA_mon_b1f: "The Pasta and the Shoe"
 COLDWAR_ITA_mon_b1f_desc: "Roads, football stadium and fishermen's cooperatives: the Commander delivers, and a whole district votes for the crown."
 COLDWAR_ITA_mon_b2f: "The Piedmontese Civil Service"
 COLDWAR_ITA_mon_b2f_desc: "The old Piedmontese ministries get their pride back: examinations, files and honest clerks."
 COLDWAR_ITA_mon_pm: "A Crown Above the Parties"
 COLDWAR_ITA_mon_pm_desc: "Alfredo Covelli says it in every speech: the King belongs to everybody, the parties only to themselves."
 COLDWAR_ITA_mon_em: "The Southern Crown Fund"
 COLDWAR_ITA_mon_em_desc: "A fund in the King's name: dams, irrigation and a road to every village of the south."
 COLDWAR_ITA_mon_c1: "Altar and Throne"
 COLDWAR_ITA_mon_c1_desc: "The parish priest, the bishop and the carabiniere stand in one row. The Lateran Pacts were signed under a Savoy, and the Church remembers."
 COLDWAR_ITA_mon_c2: "The King's Officers"
 COLDWAR_ITA_mon_c2_desc: "Admirals and colonels who swore their oath to the King before 1946. In the wardroom the toast is still to the Crown."
 COLDWAR_ITA_mon_d1: "The Anti-Communist Front"
 COLDWAR_ITA_mon_d1_desc: "Behind Washington and behind NATO, against Moscow and against any pact with the Communists."
 COLDWAR_ITA_mon_d2: "The Crowned Heads of Europe"
 COLDWAR_ITA_mon_d2_desc: "Umberto's wife Marie Jose was a Belgian princess, and every court in Europe is a cousin. The Crowned Heads send flowers and open doors."
 COLDWAR_ITA_mon_cm: "The Monarchist Establishment"
 COLDWAR_ITA_mon_cm_desc: "Bishops, generals, landowners and the old families form one establishment around the crown."
 COLDWAR_ITA_mon_dm: "The Western Crown"
 COLDWAR_ITA_mon_dm_desc: "In the Atlantic Alliance a king is a guarantee, not an embarrassment: the West stands behind the Crown."
 COLDWAR_ITA_mon_cap: "The Second Referendum"
 COLDWAR_ITA_mon_cap_desc: "Twenty-four years after the first vote, a second ballot: this time with the crown under the Constitution. The old King does not live to see it, and the prince is ready."
 COLDWAR_ITA_eco_r: "The Economic Miracle at Risk"
 COLDWAR_ITA_eco_r_desc: "The miracle built the Autostrada del Sole and put a Fiat 500 in every courtyard. Now the Hot Autumn, the lira and the oil tankers decide whether the boom becomes a habit or a memory."
 COLDWAR_ITA_eco_c0_0: "The Mattei Legacy"
 COLDWAR_ITA_eco_c0_0_desc: "Enrico Mattei died in a burning plane in 1962, but his ENI still buys oil where the Seven Sisters will not go. Eugenio Cefis runs it now, and he wants Montedison too."
 COLDWAR_ITA_eco_c1_0: "Agnelli's Fiat"
 COLDWAR_ITA_eco_c1_0_desc: "Gianni Agnelli, l'Avvocato, runs the largest company in Italy from Corso Marconi. Mirafiori alone has some fifty thousand workers, and most of them are on strike."
 COLDWAR_ITA_eco_c2_0: "The Industrial Triangle"
 COLDWAR_ITA_eco_c2_0_desc: "Milan, Turin and Genoa still make the miracle: cars, typewriters, ships and steel. Rome wants a new wave of plants before the boom runs out of breath."
 COLDWAR_ITA_eco_c3_0: "The Lira Question"
 COLDWAR_ITA_eco_c3_0_desc: "Six hundred twenty five lire to the dollar, and the Bank of Italy burns reserves every week to keep it so. Guido Carli knows the parity is a promise Rome cannot keep forever."
 COLDWAR_ITA_eco_c4_0: "The Tax Reform of 1973"
 COLDWAR_ITA_eco_c4_0_desc: "IRPEF arrives on 1 January 1974: income tax withheld at the source for employees, a declaration for everyone else. The employees pay, the shopkeepers wait and see."
 COLDWAR_ITA_eco_c5_0: "The Refineries of the South"
 COLDWAR_ITA_eco_c5_0_desc: "Along the Sicilian coast from Augusta to Gela the flares burn day and night. Italy refines for half of Europe, and the south hopes that some of the jobs stay."
 COLDWAR_ITA_eco_c0_1a: "The Gas Contract with Moscow"
 COLDWAR_ITA_eco_c0_1a_desc: "ENI signed on 10 December 1969: Finsider pipes for Soviet gas, twenty years long. Washington frowns, and Moscow still has to confirm the deliveries."
 COLDWAR_ITA_eco_c0_1b: "The Transmed Pipeline"
 COLDWAR_ITA_eco_c0_1b_desc: "Algerian gas under the Strait of Sicily: no Soviet customer, no American veto, just the deepest sea pipe anyone has ever laid."
 COLDWAR_ITA_eco_c1_1: "The Fiat Licence for Togliatti"
 COLDWAR_ITA_eco_c1_1_desc: "On the Volga, a city named after Palmiro Togliatti builds our Fiat 124 under licence. The first Zhiguli rolled out on 22 April 1970; Turin wants the next contract."
 COLDWAR_ITA_eco_c2_1a: "Olivetti and the Electronic Age"
 COLDWAR_ITA_eco_c2_1a_desc: "At Ivrea the Programma 101 already sits on desks in America. Bet on calculators, computers and engineers, and Italy builds the machines of tomorrow."
 COLDWAR_ITA_eco_c2_1b: "Montedison and the Chemical Belt"
 COLDWAR_ITA_eco_c2_1b_desc: "Petrochemicals at Porto Marghera and Priolo give plastics to every Italian kitchen. The stacks smoke, the lagoon suffers, and the contracts in Sicily attract friends of friends."
 COLDWAR_ITA_eco_c3_1a: "Join the European Snake"
 COLDWAR_ITA_eco_c3_1a_desc: "Basel, April 1972: the six agree that their currencies may wander no more than two and a quarter percent apart. Rome joins the Snake and prays that the lira can swim."
 COLDWAR_ITA_eco_c3_1b: "Float the Lira"
 COLDWAR_ITA_eco_c3_1b_desc: "Let the lira find its own level: a cheap lira sells our shoes, our tiles and our Vespas from Munich to Chicago, and inflation is the bill."
 COLDWAR_ITA_eco_c4_1a: "Hunt the Sommerso"
 COLDWAR_ITA_eco_c4_1a_desc: "The Guardia di Finanza raids the workshops of the Veneto and the market stalls of Naples: every lira earned must be declared, and the shopkeepers pull down their shutters in protest."
 COLDWAR_ITA_eco_c4_1b: "Live with the Sommerso"
 COLDWAR_ITA_eco_c4_1b_desc: "The black economy employs millions, pays no tax and weaves half of Prato's cloth. Rome looks away and counts the jobs instead."
 COLDWAR_ITA_eco_c5_1a: "ENI Builds at Gela"
 COLDWAR_ITA_eco_c5_1a_desc: "The state oil company builds at Gela with its own money and its own crude, bought from Moscow and Tripoli. The Seven Sisters grumble and sell us less."
 COLDWAR_ITA_eco_c5_1b: "Private Refiners at Sarroch"
 COLDWAR_ITA_eco_c5_1b_desc: "On the bay of Sarroch near Cagliari the Moratti family runs its own refinery on private money, tolling crude for the majors. Cefis sneers, the Treasury does not."
 COLDWAR_ITA_eco_c0_2: "Metano in Every Kitchen"
 COLDWAR_ITA_eco_c0_2_desc: "SNAM lays steel from the Alps to Calabria, and the bottled gas cylinder slowly leaves the Italian kitchen."
 COLDWAR_ITA_eco_c1_2a: "The March of the Forty Thousand"
 COLDWAR_ITA_eco_c1_2a_desc: "After thirty five days at the gates of Mirafiori, foremen and clerks march silently through Turin. The strike collapses, Fiat cuts its workforce, and the unions never look the same."
 COLDWAR_ITA_eco_c1_2b: "A Settlement with the FLM"
 COLDWAR_ITA_eco_c1_2b_desc: "Rome brokers a deal with the metalworkers: no mass sackings, the redundant go on the Cassa Integrazione, and the line keeps moving."
 COLDWAR_ITA_eco_c2_2: "The Shipyards of Monfalcone"
 COLDWAR_ITA_eco_c2_2_desc: "Monfalcone, Genoa and Castellammare build liners and tankers for the world. The state holding keeps the yards alive and the welders in work."
 COLDWAR_ITA_eco_c3_2: "Into the EMS"
 COLDWAR_ITA_eco_c3_2_desc: "Andreotti signs up for the European Monetary System, with a wide band of six percent for the lira. The communists vote against, and national solidarity is over."
 COLDWAR_ITA_eco_c4_2: "The Third Italy"
 COLDWAR_ITA_eco_c4_2_desc: "Tiles in Sassuolo, spectacles in Belluno, knitwear in Carpi: thousands of family firms between Bologna and Treviso outsell the giants."
 COLDWAR_ITA_eco_c5_2: "The Power Plants of ENEL"
 COLDWAR_ITA_eco_c5_2_desc: "Since the nationalisation of 1962 one public body owns the grid. Its engineers want oil and coal plants on every coast before the next summer peak turns the lights off."
 COLDWAR_ITA_eco_c0_3: "Prodi Cleans Up the IRI"
 COLDWAR_ITA_eco_c0_3_desc: "A professor from Bologna takes the IRI chair and finds hundreds of thousands of workers and a mountain of debt. He sells what loses and keeps what builds."
 COLDWAR_ITA_eco_c1_3: "The Robogate Line"
 COLDWAR_ITA_eco_c1_3_desc: "Comau's welding robots take over the body shop at Rivalta. The Fiat Uno comes off a line where the men wear white coats."
 COLDWAR_ITA_eco_c2_3: "The National Energy Plan"
 COLDWAR_ITA_eco_c2_3_desc: "The plan promises oil and coal plants on the coasts and fuel stocks for the next crisis. After the tankers of 1973 nobody in Rome wants to be caught short again."
 COLDWAR_ITA_eco_c3_3: "The Divorce of 1981"
 COLDWAR_ITA_eco_c3_3_desc: "Treasury minister Andreatta and governor Ciampi agree by letter: the Bank of Italy no longer buys what the Treasury cannot sell. Inflation falls, and the debt starts to climb."
 COLDWAR_ITA_eco_c4_3: "Il Sorpasso"
 COLDWAR_ITA_eco_c4_3_desc: "The statisticians count the black economy and announce it: Italy has overtaken Britain. In the Milano da bere, the young bankers toast with Campari."
 COLDWAR_ITA_eco_c5_3: "Ravenna Gas and Larderello Steam"
 COLDWAR_ITA_eco_c5_3_desc: "Gas from the platforms off Ravenna, steam from the hills of Larderello, water from the Alpine dams: the Italians pull every kilowatt they can out of their own ground."
 COLDWAR_ITA_eco_c5_4: "Porto Tolle"
 COLDWAR_ITA_eco_c5_4_desc: "On the delta of the Po the largest oil fired plant in Europe is planned. The north east gets its power; the fishermen of the lagoon get the smoke."
 COLDWAR_ITA_sud_r: "The Southern Question"
 COLDWAR_ITA_sud_r_desc: "Naples has no sewers worth the name, Palermo is ruled from the building sites, and Reggio burns over the regional capital. The south is a third of Italy and half of its problems."
 COLDWAR_ITA_sud_c0_0: "The Cassa Refinanced"
 COLDWAR_ITA_sud_c0_0_desc: "Twenty years of Cassa money built aqueducts, roads and the Autostrada to Reggio. Every new tender also builds a clientele."
 COLDWAR_ITA_sud_c1_0: "The Notables of the South"
 COLDWAR_ITA_sud_c1_0_desc: "In every town of Sicily and Calabria there is a doctor, a lawyer and a baron who deliver the votes. Some of them deliver for the clans as well."
 COLDWAR_ITA_sud_c2_0: "The Irpinia Earthquake"
 COLDWAR_ITA_sud_c2_0_desc: "Ninety seconds on the evening of 23 November 1980: villages in Irpinia vanish and Naples cracks. President Pertini goes on television and asks where the help was."
 COLDWAR_ITA_sud_c3_0: "Dalla Chiesa to Palermo"
 COLDWAR_ITA_sud_c3_0_desc: "The general who broke the Red Brigades arrives as prefect of Palermo. He asks for powers; he gets one hundred days and a burst of Kalashnikov in Via Carini."
 COLDWAR_ITA_sud_c0_1: "The Law of 1971 for the South"
 COLDWAR_ITA_sud_c0_1_desc: "The new law brings the regions into the Cassa and obliges the state companies to build most of their new plants south of Rome."
 COLDWAR_ITA_sud_c1_1a: "Pact with the Notables"
 COLDWAR_ITA_sud_c1_1a_desc: "Rome leaves Palermo to the men who win its elections: quiet streets, full ballot boxes, and nobody asks where the contracts go."
 COLDWAR_ITA_sud_c1_1b: "War on the Clans"
 COLDWAR_ITA_sud_c1_1b_desc: "The state sends judges and carabinieri instead of contracts. The clans answer the way they know, with the lupara and with dynamite."
 COLDWAR_ITA_sud_c2_1: "The Law 219 Reconstruction"
 COLDWAR_ITA_sud_c2_1_desc: "Billions of lire for houses, roads and industrial zones in the crater. The Camorra was in the cement business long before the earth shook."
 COLDWAR_ITA_sud_c3_1: "The Antimafia Pool"
 COLDWAR_ITA_sud_c3_1_desc: "Rocco Chinnici had the idea and paid for it in Via Pipitone. Antonino Caponnetto makes it real: Falcone, Borsellino, Di Lello and Guarnotta share every file, so killing one judge no longer kills the case."
 COLDWAR_ITA_sud_c0_2a: "Taranto Doubled"
 COLDWAR_ITA_sud_c0_2a_desc: "Italsider doubles the Taranto works: the largest steel plant in Europe rises between the olive groves and the Ionian sea."
 COLDWAR_ITA_sud_c0_2b: "The Port of Gioia Tauro"
 COLDWAR_ITA_sud_c0_2b_desc: "The Pacchetto Colombo promised Calabria a fifth steel centre after the riots of Reggio. The orange groves were cleared and the steel never came; a container port might."
 COLDWAR_ITA_sud_c1_2: "The Rognoni La Torre Law"
 COLDWAR_ITA_sud_c1_2_desc: "Mafia association becomes a crime of its own, article 416 bis, and the state may seize what the clans own. Pio La Torre wrote it and died for it."
 COLDWAR_ITA_sud_c2_2a: "Zamberletti's Civil Protection"
 COLDWAR_ITA_sud_c2_2a_desc: "Giuseppe Zamberletti runs the emergency like a general: tents, prefabricated schools and engineers from Rome. Out of the rubble comes a ministry for civil protection."
 COLDWAR_ITA_sud_c2_2b: "Money to the Mayors"
 COLDWAR_ITA_sud_c2_2b_desc: "The funds go straight to the town halls: they know their streets, their builders and their voters. Years later some towns are still waiting for houses."
 COLDWAR_ITA_sud_c3_2: "The Buscetta Confessions"
 COLDWAR_ITA_sud_c3_2_desc: "Tommaso Buscetta, extradited from Brazil, sits across from Giovanni Falcone and draws the map of Cosa Nostra: the Commission, the families, the Corleonesi."
 COLDWAR_ITA_sud_c0_3: "The Cassa Becomes Agensud"
 COLDWAR_ITA_sud_c0_3_desc: "The Cassa is dissolved and reborn as an agency with a nine year plan. Fewer cathedrals in the desert, more aqueducts."
 COLDWAR_ITA_sud_c3_3: "The Maxi Trial"
 COLDWAR_ITA_sud_c3_3_desc: "Four hundred seventy five defendants in green cages, a courtroom built inside the walls of the Ucciardone. Palermo holds its breath for the verdict."
 COLDWAR_ITA_sud_c0_4: "Remittances and the Return Home"
 COLDWAR_ITA_sud_c0_4_desc: "Every Friday the train from Stuttgart to Reggio fills with cardboard suitcases. The money comes home first; one day, the men may follow."
 COLDWAR_ITA_sec_r: "The Years of Lead"
 COLDWAR_ITA_sec_r_desc: "Piazza Fontana is still a crater in our memory; anarchists, fascists and the secret services all point at each other. The state must decide whom it trusts before it can protect anyone."
 COLDWAR_ITA_sec_c0_0: "The SID Under Suspicion"
 COLDWAR_ITA_sec_c0_0_desc: "General Vito Miceli, chief of the SID, is arrested over the Rosa dei Venti plot. The service that should protect the Republic has been talking to the men who wanted to topple it."
 COLDWAR_ITA_sec_c1_0: "Justice for Bologna"
 COLDWAR_ITA_sec_c1_0_desc: "At 10.25 on 2 August 1980 the waiting room of Bologna Centrale explodes: eighty five dead. The station clock stays stopped, and the city demands names."
 COLDWAR_ITA_sec_c2_0: "Dalla Chiesa's Nucleus"
 COLDWAR_ITA_sec_c2_0_desc: "A Carabinieri general picks a few dozen men in plain clothes; one of them, Frate Mitra, gets inside the Red Brigades. Curcio and Franceschini are taken at Pinerolo."
 COLDWAR_ITA_sec_c3_0: "Via Fani"
 COLDWAR_ITA_sec_c3_0_desc: "Five bodyguards dead in Via Fani and Aldo Moro in the hands of the Red Brigades, on the very morning the national solidarity government goes before the Chamber."
 COLDWAR_ITA_sec_c4_0: "Patrizio Peci Talks"
 COLDWAR_ITA_sec_c4_0_desc: "Arrested in Turin, the head of the Turin column starts talking to the Carabinieri. Via Fracchia follows, and the brigades take their revenge on his brother Roberto."
 COLDWAR_ITA_sec_c0_1: "SISMI and SISDE"
 COLDWAR_ITA_sec_c0_1_desc: "The SID is split in two: SISMI for the military abroad, SISDE for the interior, CESIS to coordinate and a committee of Parliament to watch. On paper, at least."
 COLDWAR_ITA_sec_c1_1: "The P2 List Published"
 COLDWAR_ITA_sec_c1_1_desc: "Nine hundred sixty two names found in Licio Gelli's villa: generals, ministers, editors and the heads of the services. Forlani publishes the list, and his government falls."
 COLDWAR_ITA_sec_c2_1: "The Reale Law"
 COLDWAR_ITA_sec_c2_1_desc: "The police may search and hold suspects longer, and there is no bail for armed crimes. The Radicals gather signatures for a referendum; the voters keep the law."
 COLDWAR_ITA_sec_c3_1a: "The Line of Firmness"
 COLDWAR_ITA_sec_c3_1a_desc: "No talks with the Red Brigades: the DC and the PCI stand together, while Moro writes letters from the people's prison begging them to bend."
 COLDWAR_ITA_sec_c3_1b: "Negotiate for Moro"
 COLDWAR_ITA_sec_c3_1b_desc: "Craxi, the Pope and the Radicals want an opening: a pardon for one prisoner, a gesture for a life. The state bends, and buys time."
 COLDWAR_ITA_sec_c4_1: "The Dozier Rescue"
 COLDWAR_ITA_sec_c4_1_desc: "An American general held in a flat above a supermarket in Padua: the NOCS go in, and James Dozier walks out without a scratch."
 COLDWAR_ITA_sec_c0_2a: "Keep Gladio in the Dark"
 COLDWAR_ITA_sec_c0_2a_desc: "A stay behind network with arms caches in the hills of Friuli, run with the Americans since 1956: better that nobody in Parliament knows."
 COLDWAR_ITA_sec_c0_2b: "Tell Parliament About Gladio"
 COLDWAR_ITA_sec_c0_2b_desc: "The prime minister reads it into the record: Italy kept a secret army for the case of invasion. The caches are emptied, the questions remain."
 COLDWAR_ITA_sec_c1_2: "The Anselmi Law"
 COLDWAR_ITA_sec_c1_2_desc: "Tina Anselmi's commission digs through Gelli's papers; Parliament dissolves P2 and bans every secret association."
 COLDWAR_ITA_sec_c2_2: "The Coordinator of 1978"
 COLDWAR_ITA_sec_c2_2_desc: "After Moro, Dalla Chiesa gets the whole fight against terror and answers only to the minister. The hideout in Via Montenevoso yields Moro's memorial."
 COLDWAR_ITA_sec_c3_2: "The Cossiga Decree"
 COLDWAR_ITA_sec_c3_2_desc: "Terrorism becomes an aggravating circumstance, preventive custody grows longer, and those who break with the armed groups get lighter sentences."
 COLDWAR_ITA_sec_c4_2: "The Law on the Repentant"
 COLDWAR_ITA_sec_c4_2_desc: "Sentences are cut for terrorists who confess and name names. Hundreds talk, and the columns of the Red Brigades fall one by one."
 COLDWAR_ITA_mil_r: "The Southern Flank of NATO"
 COLDWAR_ITA_mil_r_desc: "Italy guards the Gorizia gap toward the east and the sea lanes against the Soviet Fifth Eskadra. Our army is large, conscripted and old."
 COLDWAR_ITA_mil_c0_0: "The Army Restructuring of 1975"
 COLDWAR_ITA_mil_c0_0_desc: "Service drops from fifteen to twelve months and the old divisions become brigades: forty five thousand fewer conscripts, but every battalion at full strength."
 COLDWAR_ITA_mil_c1_0: "The Leopard Licence"
 COLDWAR_ITA_mil_c1_0_desc: "Oto Melara in La Spezia builds the German Leopard under licence: hundreds of tanks for the armoured brigades of the north east."
 COLDWAR_ITA_mil_c2_0: "The Tornado Partnership"
 COLDWAR_ITA_mil_c2_0_desc: "Aeritalia builds the wings, Munich the centre, Warton the nose: three nations, one combat aircraft, and our share is a hundred of them."
 COLDWAR_ITA_mil_c3_0: "The Naval Law of 1975"
 COLDWAR_ITA_mil_c3_0_desc: "A thousand billion lire over ten years: new frigates, submarines and hydrofoils for a fleet that is rusting in Taranto."
 COLDWAR_ITA_mil_c4_0: "The Euromissile Decision"
 COLDWAR_ITA_mil_c4_0_desc: "The Cossiga government votes for the Euromissiles and Craxi's socialists vote with it. Italy says yes, so Bonn does not have to say it alone."
 COLDWAR_ITA_mil_c0_1a: "The Rapid Intervention Force"
 COLDWAR_ITA_mil_c0_1a_desc: "Paratroopers of the Folgore, San Marco marines and helicopters under one command: a force that can land in Lebanon or in Sicily within days."
 COLDWAR_ITA_mil_c0_1b: "The Gorizia Gap Fortified"
 COLDWAR_ITA_mil_c0_1b_desc: "Concrete on the Karst and along the Tagliamento: the armoured brigades of Friuli dig in where the tanks from the east would come."
 COLDWAR_ITA_mil_c1_1: "The OF 40 for Export"
 COLDWAR_ITA_mil_c1_1_desc: "Oto Melara and Fiat build a tank of their own for the Gulf: the OF 40 goes to Dubai, and Italy learns to sell arms the way France does."
 COLDWAR_ITA_mil_c2_1: "Agusta's Helicopters"
 COLDWAR_ITA_mil_c2_1_desc: "At Cascina Costa, Agusta sells Bell helicopters to half the world and designs the Mangusta, the first attack helicopter made in Europe."
 COLDWAR_ITA_mil_c3_1: "The Garibaldi Carrier"
 COLDWAR_ITA_mil_c3_1_desc: "Monfalcone launches a cruiser with a flat deck. Officially it carries helicopters; the deck has a ski jump."
 COLDWAR_ITA_mil_c4_1: "Cruise Missiles at Comiso"
 COLDWAR_ITA_mil_c4_1_desc: "One hundred twelve cruise missiles at the Magliocco airfield near Ragusa. The peace marchers come by the thousands, and so do the builders of the clans."
 COLDWAR_ITA_mil_c0_2: "The White Book of 1985"
 COLDWAR_ITA_mil_c0_2_desc: "Spadolini writes it all down and names the threat: no longer only the north east, but the south and the sea."
 COLDWAR_ITA_mil_c1_2: "The Ariete Programme"
 COLDWAR_ITA_mil_c1_2_desc: "An Italian main battle tank from Iveco and Oto Melara, with a gun of our own. The engineers promise a prototype within two years."
 COLDWAR_ITA_mil_c2_2: "The AMX with Brazil"
 COLDWAR_ITA_mil_c2_2_desc: "A light attack jet built with Embraer: Italian engineers in Varese, Brazilian partners in Sao Jose dos Campos, and a customer for every small air force."
 COLDWAR_ITA_mil_c3_2a: "Harriers for the Navy"
 COLDWAR_ITA_mil_c3_2a_desc: "Parliament ends the monopoly of 1923 and the navy buys jump jets. The Garibaldi becomes a real carrier."
 COLDWAR_ITA_mil_c3_2b: "Leave Jets to the Air Force"
 COLDWAR_ITA_mil_c3_2b_desc: "Helicopters at sea, fighters on land: the old arrangement holds, and the money goes to Tornados and radars."
 COLDWAR_ITA_est_r: "Italy in the World"
 COLDWAR_ITA_est_r_desc: "Rome signed the treaties that founded Europe, yet in every capital we are the ally nobody consults. Between Brussels, Belgrade, Tripoli and the Vatican, the Farnesina plays many tables at once."
 COLDWAR_ITA_est_c0_0: "Europe of the Founders"
 COLDWAR_ITA_est_c0_0_desc: "Altiero Spinelli dreamed of a federal Europe on the prison island of Ventotene; De Gasperi helped to build it. Rome stays the most European capital of the six."
 COLDWAR_ITA_est_c1_0: "The Trieste Question"
 COLDWAR_ITA_est_c1_0_desc: "Zone B has been Yugoslav in fact since 1954 and Italian on our maps. Every November the nationalists march in Trieste."
 COLDWAR_ITA_est_c2_0: "The Expulsion of 1970"
 COLDWAR_ITA_est_c2_0_desc: "Gaddafi confiscates everything and orders the Italians out of Libya; even the dead must leave their cemeteries. The refugees land in Naples with one suitcase each."
 COLDWAR_ITA_est_c3_0: "The Lodo Moro"
 COLDWAR_ITA_est_c3_0_desc: "Nobody signed it and everybody denies it: Palestinian groups may cross Italy with their weapons, and in return they leave Italy alone."
 COLDWAR_ITA_est_c4_0: "Aid for Mogadishu"
 COLDWAR_ITA_est_c4_0_desc: "Our former trust territory still runs its ministries in Italian and trains its doctors with our professors. Siad Barre wants roads, a port and a fishing fleet."
 COLDWAR_ITA_est_c5_0: "The Vatican Ostpolitik"
 COLDWAR_ITA_est_c5_0_desc: "Monsignor Casaroli travels to Budapest and Prague with a briefcase and endless patience. Rome watches, and learns that the Iron Curtain has doors."
 COLDWAR_ITA_est_c6_0: "The Peacekeeping Tradition"
 COLDWAR_ITA_est_c6_0_desc: "Italian observers in Kashmir, helicopters with UNIFIL in southern Lebanon: blue helmets suit a country that wants to be useful, not feared."
 COLDWAR_ITA_est_c0_1: "The Genscher Colombo Plan"
 COLDWAR_ITA_est_c0_1_desc: "Emilio Colombo and Hans Dietrich Genscher put a draft European Act on the table: a common foreign policy, more votes and fewer vetoes."
 COLDWAR_ITA_est_c1_1: "The Treaty of Osimo"
 COLDWAR_ITA_est_c1_1_desc: "Signed quietly in a villa near Ancona: Zone B goes to Belgrade forever, and a free industrial zone on the Karst is to join the two peoples. Trieste votes for its own list in anger."
 COLDWAR_ITA_est_c2_1a: "Libyan Capital for Fiat"
 COLDWAR_ITA_est_c2_1a_desc: "Fiat needs cash, Gaddafi has dollars: the Libyan fund pays some four hundred fifteen million for nearly a tenth of the company. Washington is not amused."
 COLDWAR_ITA_est_c2_1b: "Compensation Before Business"
 COLDWAR_ITA_est_c2_1b_desc: "No Libyan money in Italian industry until Tripoli pays for the farms, the houses and the cemeteries of 1970."
 COLDWAR_ITA_est_c3_1a: "Standoff at Sigonella"
 COLDWAR_ITA_est_c3_1a_desc: "On a Sicilian runway, carabinieri face American commandos around an Egyptian airliner. Craxi will not hand over the Achille Lauro hijackers: Italy is an ally, not a colony."
 COLDWAR_ITA_est_c3_1b: "Hand Over the Hijackers"
 COLDWAR_ITA_est_c3_1b_desc: "The Americans take Abu Abbas and his men off the Egyptian plane. Washington is grateful, and Cairo and Tunis remember."
 COLDWAR_ITA_est_c4_1: "The Aid Fund of 1985"
 COLDWAR_ITA_est_c4_1_desc: "The FAI fund spends billions of lire in eighteen months on dams, roads and fishing projects across the Horn. Some of them were even built."
 COLDWAR_ITA_est_c5_1: "The New Concordat"
 COLDWAR_ITA_est_c5_1_desc: "At Villa Madama Craxi and Casaroli sign a new Concordat: Catholicism is no longer the religion of the state, and the church will live on a share of the income tax."
 COLDWAR_ITA_est_c6_1: "Italcon in Beirut"
 COLDWAR_ITA_est_c6_1_desc: "General Franco Angioni leads two thousand Italians to the camps of Sabra and Shatila after the massacre. They run a field hospital, and leave with one soldier dead."
 COLDWAR_ITA_est_c0_2: "The Spinelli Draft Treaty"
 COLDWAR_ITA_est_c0_2_desc: "Old Spinelli gets the European Parliament to vote for a Treaty on European Union. Westminster laughs, Strasbourg applauds."
 COLDWAR_ITA_est_c1_2: "The Adriatic Partnership"
 COLDWAR_ITA_est_c1_2_desc: "Yugoslav shoppers crowd Ponte Rosso, Italian trucks cross at Fernetti: the border that frightened two generations becomes the most open in the east."
 COLDWAR_ITA_est_c2_2: "The Mediterranean Vocation"
 COLDWAR_ITA_est_c2_2_desc: "From Mattei to Andreotti, Rome talks to the Arabs when others will not: oil, contracts and a quiet hand in every crisis of the sea we share."
 COLDWAR_ITA_est_c6_2: "A Seat on the Security Council"
 COLDWAR_ITA_est_c6_2_desc: "Italy sits at the horseshoe table and argues for more elected members, not more permanent ones."
 COLDWAR_ITA_est_c0_3: "The Milan Council"
 COLDWAR_ITA_est_c0_3_desc: "Craxi chairs the summit at the Castello Sforzesco and does what no chairman dared: he calls a vote. London loses seven to three, and the Single Act is born."
