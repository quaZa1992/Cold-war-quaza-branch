 COLDWAR_ITA_pci_le_regioni_rosse: "Le Regioni Rosse"
 COLDWAR_ITA_pci_le_regioni_rosse_desc: "The red regions of Emilia-Romagna and Tuscany build fast and productively."
 COLDWAR_ITA_pci_feste_dellunita: "Feste dell'Unita"
