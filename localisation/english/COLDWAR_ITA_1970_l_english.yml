 COLDWAR_ITA_psi_elected_head_of_state: "Elected Head of State"
 COLDWAR_ITA_psi_elected_head_of_state_desc: "A directly elected president gives the state a face and a mandate."
 COLDWAR_ITA_psi_milano_da_bere: "Milano da Bere"
 COLDWAR_ITA_psi_milano_da_bere_desc: "The boom years of Milan: fashion, advertising and finance."
 COLDWAR_ITA_psi_piazza_affari: "Piazza Affari and the Biscione"
 COLDWAR_ITA_psi_piazza_affari_desc: "Milan finance and the private television networks sell the nation its dreams."
 COLDWAR_ITA_psi_vangelo_socialista: "Il Vangelo Socialista"
 COLDWAR_ITA_psi_vangelo_socialista_desc: "Proudhon over Lenin: a socialism of mutual aid and consent."
 COLDWAR_ITA_psi_unity_of_action: "Unity of Action"
 COLDWAR_ITA_psi_unity_of_action_desc: "Socialists and Communists together on the shop floor and in the red regions."
 COLDWAR_ITA_psi_merits_and_needs: "Merits and Needs"
 COLDWAR_ITA_psi_merits_and_needs_desc: "Schools and grants for the able, whatever their origin."
 COLDWAR_ITA_psi_welfare_for_naples: "Welfare for Naples"
 COLDWAR_ITA_psi_welfare_for_naples_desc: "Public housing and services for the Neapolitan poor."
 COLDWAR_ITA_psi_social_pact: "The Social Pact"
 COLDWAR_ITA_psi_social_pact_desc: "Unions, employers and government sign for a calmer factory floor."
 COLDWAR_ITA_psi_decisionismo: "Decisionismo"
