# IMPERIA COLD WAR — Immigration Backlash begins and fades (23.11.2026)
 COLDWAR_GWB.1.t:0 "The Backlash Fades"
 COLDWAR_GWB.1.d:0 "Half a year after the last arrivals, the agitation against the newcomers has lost its audience. The new neighbours work the same shifts, their children sit in the same classrooms, and the slogans have moved on to other walls."
 COLDWAR_GWB.1.a:0 "Thank the communities that made it work."
 COLDWAR_GWB.1.b:0 "The government takes the credit."
 COLDWAR_GWB.2.t:0 "Immigration Backlash"
 COLDWAR_GWB.2.d:0 "The new arrivals have become the talk of every bar and tabloid. Nationalist agitators blame the guest workers for crowded flats, low wages and crime, and their slogans find an audience. For the next half year §YImmigration Backlash§! pushes the country towards the nationalists (§Rnationalist drift +0.02§!). Every new arrival restarts the clock."
 COLDWAR_GWB.2.a:0 "It will pass."
