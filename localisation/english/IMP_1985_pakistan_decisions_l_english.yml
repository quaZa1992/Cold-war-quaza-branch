# IMPERIA CW — Cold War: Imperia 1985 pakistan decisions — English localisation.
 PAK_1985_nuclear_program_category: "Pakistan Nuclear Program"
 PAK_1985_nuclear_program_category_desc: "The Bhutto vow at work. Run the centrifuges, hide the procurement, and balance the cost in stability and detection."

 PAK_1985_redirect_budget_to_kahuta: "Redirect Budget to Kahuta"
 PAK_1985_redirect_budget_to_kahuta_desc: "Strip another 200 million rupees from civilian ministries and feed it into the centrifuge halls."

 PAK_1985_expand_military_secrecy: "Expand Military Secrecy"
 PAK_1985_expand_military_secrecy_desc: "Tighten the perimeter around sensitive installations. Restrict press access. Foreign attaches will be politely shown out."

 PAK_1985_use_isi_cutouts: "Use ISI Cutouts"
 PAK_1985_use_isi_cutouts_desc: "Procurement runs through Aabpara front companies. Faster smuggling - but if anything goes wrong, ISI fingerprints will be found."

 PAK_1985_request_chinese_support: "Quietly Request Chinese Support"
 PAK_1985_request_chinese_support_desc: "A discreet courier flight to Beijing. Designs come back; American patience does not."

 PAK_1985_mask_civilian_purchases: "Mask Civilian Purchases"
 PAK_1985_mask_civilian_purchases_desc: "Disguise centrifuge components as agricultural pump parts. Slower, but the IAEA cannot read invoices."

 PAK_1985_accelerate_uranium: "Accelerate Uranium Enrichment"
 PAK_1985_accelerate_uranium_desc: "Run the cascades hot, three shifts, no maintenance windows. Khan promises a device. The grid promises blackouts."

 PAK_1985_appease_washington: "Appease Washington"
 PAK_1985_appease_washington_desc: "Public reassurances at the UN. Private letters to Foggy Bottom. Slow Kahuta - on paper at least."

 PAK_1985_national_security_propaganda: "National Security Propaganda"
 PAK_1985_national_security_propaganda_desc: "Front pages and Friday sermons remind every Pakistani what India did in 1971. The bomb is not luxury; it is survival."

 PAK_1985_internal_censorship: "Tighten Internal Censorship"
 PAK_1985_internal_censorship_desc: "Sensitive editors are warned. Newsrooms are visited. The leaks slow. So does democracy."

 PAK_1985_emergency_resource_diversion: "Emergency Resource Diversion"
 PAK_1985_emergency_resource_diversion_desc: "An extraordinary appropriation. Schools shut for the quarter, hospital orders go unpaid, defence-industry workers volunteer to forgo wages. The bomb leaps forward."

 PAK_1985_lobby_washington: "Lobby Washington"
 PAK_1985_lobby_washington_desc: "Cash a chip from years of Afghan cooperation. The Pressler shadow is, for now, lifted."
