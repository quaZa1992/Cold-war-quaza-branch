 COLDWAR_AFG.672.a: "We will honour the terms."
 COLDWAR_AFG.672.d: "The ten years of payments under the agreement have ended. From now on Afghanistan repays the same share of its own economy."
 COLDWAR_AFG.672.t: "Iranian Development Credit: The Grant Period Ends"
 COLDWAR_AFG.701.a: "The air war has changed."
 COLDWAR_AFG.701.d: "American shoulder-fired missiles have reached the resistance. Our helicopter crews no longer fly low over the valleys, and the gunships that once ruled the passes now hug the airfields."
 COLDWAR_AFG.701.t: "Stingers in the Mountains"
 COLDWAR_AFG.702.a: "Islamabad has chosen its Afghans."
 COLDWAR_AFG.702.d: "In Peshawar the Sunni resistance parties have formed one alliance under Pakistani patronage. Arms and money now flow through a single channel, and their names are spoken in every village mosque."
 COLDWAR_AFG.702.t: "The Peshawar Seven"
 COLDWAR_AFG.703.a: "Our own weapons are turned against us."
 COLDWAR_AFG.703.d: "Rifles, mortars and rockets of Soviet make are turning up in resistance hands. They come from Egyptian depots, and no one in Washington has to answer for them."
 COLDWAR_AFG.703.t: "Arms From the Nile"
 COLDWAR_AFG.704.a: "The Hazarajat stirs."
 COLDWAR_AFG.704.d: "Under Iranian patronage the Shia parties of the Hazarajat have formed one council. The Hazara now speak with one voice in Kabul and in the mountains."
 COLDWAR_AFG.704.t: "The Shia Council"
 COLDWAR_AFG.705.a: "The valley is ours, for now."
 COLDWAR_AFG.705.d: "Soviet columns and air-landed battalions have swept a resistance valley. The fighters have withdrawn into the side valleys, the villages are empty, and the columns are already turning back."
 COLDWAR_AFG.705.t: "A Soviet Offensive"
 COLDWAR_AFG.706.a: "We will hold without them."
 COLDWAR_AFG.706.d: "Moscow has decided to bring its soldiers home. Division by division the contingent will leave, and our army must take over the posts it holds."
 COLDWAR_AFG.706.t: "The Soviet Withdrawal Begins"
 COLDWAR_AFG.707.a: "Next step."
 COLDWAR_AFG.707.d: "Another part of the contingent has crossed the Amu Darya."
 COLDWAR_AFG.707.t: "Withdrawal From Afghanistan"
 COLDWAR_AFG.708.a: "Support ends."
 COLDWAR_AFG.708.d: "The Geneva Accords are in force. Our support for the Afghan resistance ends."
 COLDWAR_AFG.708.t: "The Geneva Accords"
 COLDWAR_AFG.709.a: "The timetable begins."
 COLDWAR_AFG.709.d: "Under the Geneva Accords the contingent leaves Afghanistan."
 COLDWAR_AFG.709.t: "The Geneva Accords: Withdrawal"
 COLDWAR_AFG_afghan_syndrome_1: "The Afghan Syndrome"
 COLDWAR_AFG_afghan_syndrome_2: "The Afghan Syndrome (Mounting Losses)"
 COLDWAR_AFG_afghan_syndrome_3: "The Afghan Syndrome (A Soviet Vietnam)"
 COLDWAR_AFG_agreements_category: "Agreements of Afghanistan"
 COLDWAR_AFG_agreements_category_desc: "Our standing agreements with other governments. An agreement is suspended while either side is at war with the other or imposes an embargo or sanctions on it, and returns without new payments."
 COLDWAR_AFG_aid_dependent_1: "Aid-Dependent Development"
 COLDWAR_AFG_aid_dependent_1_desc: "This national spirit will §GImprove§! if we complete one of the focuses §YA Self-Financing Plan§! or §YA Friend of Every Donor§!."
 COLDWAR_AFG_aid_dependent_2: "Aid-Dependent Development (Easing)"
 COLDWAR_AFG_aid_dependent_2_desc: "This national spirit will §GImprove§! if we complete the focus §YA Friend of Every Donor§!.\nThis national spirit will be §GRemoved§! if we complete the focus §YA Self-Financing Plan§!."
 COLDWAR_AFG_aid_dependent_3: "Aid-Dependent Development (Last Projects)"
 COLDWAR_AFG_aid_dependent_3_desc: "This national spirit will be §GRemoved§! if we complete one of the focuses §YA Self-Financing Plan§! or §YA Friend of Every Donor§!."
 COLDWAR_AFG_army_air: "The Royal Afghan Air Force"
 COLDWAR_AFG_army_air_desc: "MiG-17s and MiG-21s fly from Bagram, maintained by men trained in the Soviet Union.\n\n§gRAAF 1970.§!"
 COLDWAR_AFG_army_bases: "Bagram and Shindand"
 COLDWAR_AFG_army_bases_desc: "Long runways in Parwan and Herat give the air force reach over the whole country.\n\n§gBagram and Shindand airbases.§!"
 COLDWAR_AFG_army_central: "The Central Corps"
 COLDWAR_AFG_army_central_desc: "The Kabul garrison becomes a corps that can defend the capital, or take it.\n\n§gCentral Forces Kabul.§!"
 COLDWAR_AFG_army_commando: "The 444th Commando Battalion"
 COLDWAR_AFG_army_commando_desc: "Kabul's commando battalion is the best unit in the army and the most political.\n\n§g444th Commandos in the 1973 coup.§!"
 COLDWAR_AFG_army_commando_dr: "The 444th Commando Battalion"
 COLDWAR_AFG_army_conscription: "Universal Service Law"
 COLDWAR_AFG_army_conscription_desc: "Two years of service for every young man, not only for those whose khans could not buy them out.\n\n§gConscription law.§!"
 COLDWAR_AFG_army_diversify: "Arms from India and Egypt"
 COLDWAR_AFG_army_diversify_desc: "Training in Delhi and Cairo breaks the Soviet monopoly on Afghan officers. The spare parts cost more.\n\n§gDaoud's India/Egypt training talks 1975.§!"
 COLDWAR_AFG_army_diversify_dr: "Arms from India and Egypt"
 COLDWAR_AFG_army_doctrine: "Soviet Doctrine, Afghan Soldiers"
 COLDWAR_AFG_army_doctrine_desc: "Afghan officers learn their trade in Soviet academies. The manuals are Russian; the mountains are Afghan.\n\n§gOfficer training in USSR.§!"
 COLDWAR_AFG_army_doctrine_dr: "Soviet Doctrine, Afghan Soldiers"
 COLDWAR_AFG_army_final: "A National Army"
 COLDWAR_AFG_army_final_desc: "An army of all Afghans, trained for Afghan wars, that answers to the state and not to a faction.\n\n§gGoal.§!"
 COLDWAR_AFG_army_frontier: "Frontier Brigades"
 COLDWAR_AFG_army_frontier_desc: "Regular brigades on the Durand Line replace the khans' levies. They are loyal and expensive.\n\n§gFrontier units.§!"
 COLDWAR_AFG_army_frontier_dr: "Frontier Brigades"
 COLDWAR_AFG_army_helos: "Helicopter Squadrons"
 COLDWAR_AFG_army_helos_desc: "Mi-8 helicopters reach valleys no truck can.\n\n§gMi-8 deliveries.§!"
 COLDWAR_AFG_army_helos_dr: "Helicopter Squadrons"
 COLDWAR_AFG_army_lashkars: "Tribal Lashkars"
 COLDWAR_AFG_army_lashkars_desc: "Arm the frontier tribes as levies. They defend their valleys and obey their khans.\n\n§gTribal levies c. 200,000 (1978).§!"
 COLDWAR_AFG_army_modifier: "Armed Forces"
 COLDWAR_AFG_army_modifier_desc: "The lasting results of our national focuses for armed forces."
 COLDWAR_AFG_army_moscow: "More Tanks from Moscow"
 COLDWAR_AFG_army_moscow_desc: "Moscow sells T-55s on credit and trains the crews. Every tank brings a Soviet adviser.\n\n§gT-55 deliveries 1970s.§!"
 COLDWAR_AFG_army_moscow_dr: "More Tanks from Moscow"
 COLDWAR_AFG_army_mountain: "The Mountain Warfare School"
 COLDWAR_AFG_army_mountain_desc: "The army learns to fight where it will have to: in the passes and the snow.\n\n§gMountain training.§!"
 COLDWAR_AFG_army_mountain_dr: "The Mountain Warfare School"
 COLDWAR_AFG_army_root: "The Royal Afghan Army"
 COLDWAR_AFG_army_root_desc: "Tens of thousands of conscripts with Soviet tanks and MiGs, commanded by royalists and courted by communists and Daoud.\n\n§gArmy size 1970 not confirmed (B_history gap); 1978: 100-145k; Soviet arms since 1956.§!"
 COLDWAR_AFG_army_stands_alone: "The Army Stands Alone"
 COLDWAR_AFG_army_tree_shortcut: "Army"
 COLDWAR_AFG_article_24_feud: "The Feud of Article 24"
 COLDWAR_AFG_article_24_feud_desc: "This national spirit will be §GRemoved§! if we complete one of the focuses §YThe Constitutional Kingdom Endures§! or §YThe Republic of Afghanistan§!."
 COLDWAR_AFG_bop: "Between Moscow and Washington"
 COLDWAR_AFG_bop_bitarafi: "Bitarafi: Active Neutrality"
 COLDWAR_AFG_bop_centre_tt: "The §YMoscow-Washington balance§! moves back toward the centre (by up to 0.10)."
 COLDWAR_AFG_bop_moscow: "Moscow"
 COLDWAR_AFG_bop_moscow_client: "A Soviet Client"
 COLDWAR_AFG_bop_moscow_lean: "The Northern Neighbour"
 COLDWAR_AFG_bop_washington: "Washington"
 COLDWAR_AFG_bop_washington_client: "An American Partner"
 COLDWAR_AFG_bop_washington_lean: "The Western Donors"
 COLDWAR_AFG_bound_crown_tt: "The spirit is paused while this party is out of office and returns when it governs again."
 COLDWAR_AFG_bound_daoud_tt: "The spirit is paused while this party is out of office and returns when it governs again."
 COLDWAR_AFG_bound_hazara_tt: "The spirit is paused while this party is out of office and returns when it governs again."
 COLDWAR_AFG_bound_jamiat_tt: "The spirit is paused while this party is out of office and returns when it governs again."
 COLDWAR_AFG_bound_mellat_tt: "The spirit is paused while this party is out of office and returns when it governs again."
 COLDWAR_AFG_bound_ulema_tt: "The spirit is paused while this party is out of office and returns when it governs again."
 COLDWAR_AFG_ceasefire_drift_tt: "For one year the Countryside in Revolt falls by a further §G0.5§! every month."
 COLDWAR_AFG_chinese_credit: "Interest-Free Chinese Credit"
 COLDWAR_AFG_chinese_credit_partner: "Interest-Free Chinese Credit"
 COLDWAR_AFG_chinese_rural_aid: "Chinese Rural Development"
 COLDWAR_AFG_chinese_rural_aid_partner: "Chinese Rural Development"
 COLDWAR_AFG_constitutional_kingdom: "The Constitutional Kingdom Endures"
 COLDWAR_AFG_contingent_category: "The Afghan Contingent"
 COLDWAR_AFG_contingent_category_desc: "The Limited Contingent of Soviet Forces in Afghanistan. Level: §Y[?COLDWAR_AFG_contingent_level|0]§! of 3."
 COLDWAR_AFG_contingent_full: "Full Commitment"
 COLDWAR_AFG_contingent_full_desc: "The largest Soviet force outside Europe since 1945. About 120,000 men (1987 estimate)."
 # IMPERIA COLD WAR — B9 MD standard: running cost shown the MD way (weekly budget), no % of GDP
 COLDWAR_AFG_contingent_full_effect_tt: "The contingent rises to level §Y3§!. Weekly cost: booked in our weekly budget. In Afghanistan the Countryside in Revolt falls by §G2§! a month and the army defence rises by §G5%§!; every contingent level still feeds the revolt by §R1§! a month."
 COLDWAR_AFG_contingent_leaving_tt: "The Soviet contingent has begun to withdraw, or there are no Soviet troops in Afghanistan"
 COLDWAR_AFG_contingent_modifier: "The Soviet Contingent"
 COLDWAR_AFG_contingent_modifier_desc: "The Limited Contingent of Soviet Forces is in Afghanistan, level [?COLDWAR_AFG_contingent_level|0] of 3."
 COLDWAR_AFG_contingent_offensive: "Seasonal Offensive"
 COLDWAR_AFG_contingent_offensive_desc: "A spring offensive into a resistance valley. The Panjshir offensives of 1980-85."
 COLDWAR_AFG_contingent_reinforce: "Reinforce the 40th Army"
 COLDWAR_AFG_contingent_reinforce_desc: "Raise the contingent toward its 1985 strength. About 108,800 men in 1985."
 # IMPERIA COLD WAR — B9 MD standard: running cost shown the MD way (weekly budget), no % of GDP
 COLDWAR_AFG_contingent_reinforce_effect_tt: "The contingent rises to level §Y2§!. Weekly cost: booked in our weekly budget. In Afghanistan the Countryside in Revolt falls by §G1§! a month and the army defence rises by §G5%§!; every contingent level still feeds the revolt by §R1§! a month."
 COLDWAR_AFG_contingent_withdraw: "Begin Withdrawal"
 COLDWAR_AFG_contingent_withdraw_desc: "Bring the boys home. The contingent falls by one level every 90 days; at level 0 the agreement ends. Gorbachev 1987; withdrawal 1988-89."
 COLDWAR_AFG_crown_a1: "Sign the Parties Law"
 COLDWAR_AFG_crown_a1_desc: "With one signature the king can turn the Jirga's 216 independents into parties that can govern. The left and the Islamists will organise in the open too.\n\n§gShafiq's party bill passed by the Jirga; never signed (countrystudies.us/afghanistan/87).§!"
 COLDWAR_AFG_crown_a1_tb: "Sign the Parties Law"
 COLDWAR_AFG_crown_a1f: "The Party-List Elections of 1973"
 COLDWAR_AFG_crown_a1f_desc: "Legal parties contest the 1973 Jirga. For the first time a cabinet can count its majority before it is appointed.\n\n§gAlternative: elections due 1973 under a signed parties law.§!"
 COLDWAR_AFG_crown_a1f_tb: "The Party-List Elections of 1973"
 COLDWAR_AFG_crown_a2: "Govern by Royal Firman"
 COLDWAR_AFG_crown_a2_desc: "Decrees from the palace pass where the Jirga stalls. Kabul's students will call it the end of the New Democracy.\n\n§gRoyal decrees during the 1971-72 budget deadlock.§!"
 COLDWAR_AFG_crown_a2_tb: "Govern by Royal Firman"
 COLDWAR_AFG_crown_a2f: "The Palace Secretariat"
 COLDWAR_AFG_crown_a2f_desc: "A small office of royal secretaries drafts the laws, vets the governors and tells ministers what the king wants.\n\n§gRoyal secretariat under Zahir Shah.§!"
 COLDWAR_AFG_crown_a2f_tb: "The Palace Secretariat"
 COLDWAR_AFG_crown_b1: "The Khans' Estates"
 COLDWAR_AFG_crown_b1_desc: "The great landholders feed the cities and seat the Jirga. The crown can make them its partners in development.\n\n§gLandowner dominance of the 1969 Wolesi Jirga.§!"
 COLDWAR_AFG_crown_b1_tb: "The Khans' Estates"
 COLDWAR_AFG_crown_b1f: "Karakul and Cotton Monopolies"
 COLDWAR_AFG_crown_b1f_desc: "Karakul pelts and cotton are what Afghanistan sells abroad. Royal monopolies can pay for the plan if the herders accept the state's price.\n\n§gKarakul was a leading export of the 1960s-70s.§!"
 COLDWAR_AFG_crown_b1f_tb: "Karakul and Cotton Monopolies"
 COLDWAR_AFG_crown_b2: "Bank-e Milli Concessions"
 COLDWAR_AFG_crown_b2_desc: "Zabuli's National Bank and its joint-stock companies want monopolies and protection. In return they will build mills and pay the treasury.\n\n§gBank-e Milli, founded 1932 by Abdul Majid Zabuli.§!"
 COLDWAR_AFG_crown_b2_tb: "Bank-e Milli Concessions"
 COLDWAR_AFG_crown_b2f: "The Kandahar Fruit Canneries"
 COLDWAR_AFG_crown_b2f_desc: "Kandahar's raisins and pomegranates leave the country unprocessed. Bank-e Milli capital can can them at home.\n\n§gKandahar fruit processing, 1960s-70s projects.§!"
 COLDWAR_AFG_crown_b2f_tb: "The Kandahar Fruit Canneries"
 COLDWAR_AFG_crown_c1: "The Royal Gendarmerie"
 COLDWAR_AFG_crown_c1_desc: "A gendarmerie loyal to the crown can carry Kabul's writ to the districts the army never visits.\n\n§gGendarmerie reform with West German police advisers (UNVERIFIED).§!"
 COLDWAR_AFG_crown_c1_tb: "The Royal Gendarmerie"
 COLDWAR_AFG_crown_c2: "Jirga Reconciliation"
 COLDWAR_AFG_crown_c2_desc: "The crown governs best when khans and mullahs are guests at court, not suspects.\n\n§gLoya Jirga tradition; 1964 constitutional Loya Jirga.§!"
 COLDWAR_AFG_crown_c2_tb: "Jirga Reconciliation"
 COLDWAR_AFG_crown_cap: "The Constitutional Kingdom Endures"
 COLDWAR_AFG_crown_cap_desc: "The New Democracy has survived the drought, the students and the Sardar. The monarchy has become the constitution's guardian rather than its rival.\n\n§gAlternative: no 1973 coup.§!"
 COLDWAR_AFG_crown_cm: "The King's Highways"
 COLDWAR_AFG_crown_cm_desc: "The ring road ends where the money ended. The crown will finish the links that bind Kandahar and Herat to Kabul.\n\n§gRing road built with Soviet and US aid 1950s-70s.§!"
 COLDWAR_AFG_crown_cm_tb: "The King's Highways"
 COLDWAR_AFG_crown_d1: "Ride Both Horses"
 COLDWAR_AFG_crown_d1_desc: "Moscow builds in the north and Washington in the south. The crown's art is to let neither own Afghanistan.\n\n§gBitarafi, positive neutrality, since 1955.§!"
 COLDWAR_AFG_crown_d1_tb: "Ride Both Horses"
 COLDWAR_AFG_crown_d2: "The Shah's Brother-Kingdom"
 COLDWAR_AFG_crown_d2_desc: "The Shah of Iran wants a royal neighbour against the Soviets and has the oil money to prove it. Moscow will slow its spare parts.\n\n§gShah's development offers to Afghanistan, early 1970s.§!"
 COLDWAR_AFG_crown_d2_tb: "The Shah's Brother-Kingdom"
 COLDWAR_AFG_crown_dm: "Crown Embassies"
 COLDWAR_AFG_crown_dm_desc: "Royal princes as ambassadors open doors and wallets in Tehran, Bonn, Delhi and Washington.\n\n§gRoyal family in the diplomatic service before 1964.§!"
 COLDWAR_AFG_crown_dm_tb: "Crown Embassies"
 COLDWAR_AFG_crown_e: "The House of Dost Mohammad"
 COLDWAR_AFG_crown_e_desc: "The Barakzai have ruled since 1826 and Zahir Shah since 1933. The dynasty is the one institution every tribe, mullah and donor still recognises.\n\n§gBarakzai dynasty since Dost Mohammad Khan 1826; Musahiban branch; Zahir Shah r. 1933-73.§!"
 COLDWAR_AFG_crown_e_tb: "The House of Dost Mohammad"
 COLDWAR_AFG_crown_eco: "The Royal Development Board"
 COLDWAR_AFG_crown_eco_desc: "Donor projects need one desk in Kabul that signs, pays and finishes them.\n\n§gMinistry of Planning, Third Five-Year Plan 1967-72.§!"
 COLDWAR_AFG_crown_eco_tb: "The Royal Development Board"
 COLDWAR_AFG_crown_em: "Royal Treasury Reform"
 COLDWAR_AFG_crown_em_desc: "Afghanistan taxes less than almost any state on earth. The crown can collect what the law already allows.\n\n§gLand and livestock tax resisted by the Jirga (FRUS d.339).§!"
 COLDWAR_AFG_crown_em_tb: "Royal Treasury Reform"
 COLDWAR_AFG_crown_pm: "A Loyal Cabinet"
 COLDWAR_AFG_crown_pm_desc: "Whatever form the government takes, its ministers must owe their offices to the king.\n\n§gCabinets of Etemadi, Zahir and Shafiq 1967-73.§!"
 COLDWAR_AFG_crown_pm_tb: "A Loyal Cabinet"
 COLDWAR_AFG_crown_pol: "Royal Prerogative"
 COLDWAR_AFG_crown_pol_desc: "The constitution leaves the king the last word on cabinets, the army and the Jirga's dissolution.\n\n§g1964 constitution, Arts. 9 and 69.§!"
 COLDWAR_AFG_crown_pol_tb: "Royal Prerogative"
 COLDWAR_AFG_crown_tree_shortcut: "Barakzai Dynasty"
 COLDWAR_AFG_crown_x1: "Crown Prince Ahmad Shah"
 COLDWAR_AFG_crown_x1_desc: "A trained heir ends the talk that the dynasty dies with Zahir Shah. Daoud's party loses its best argument.\n\n§gCrown Prince Ahmad Shah Khan, b. 1934.§!"
 COLDWAR_AFG_crown_x1_tb: "Crown Prince Ahmad Shah"
 COLDWAR_AFG_crown_x2: "Daoud as Prime Minister Again"
 COLDWAR_AFG_crown_x2_desc: "Amend Article 24 and bring the king's cousin back to govern. The army cheers; the constitutionalists warn that he will not stay a servant.\n\n§gAlternative B3: reconciliation over Article 24.§!"
 COLDWAR_AFG_crown_x2_tb: "Daoud as Prime Minister Again"
 COLDWAR_AFG_cyclone_patron: "Operation Cyclone"
 COLDWAR_AFG_daoud_a1: "The National Revolutionary Party"
 COLDWAR_AFG_daoud_a1_desc: "One legal party for the whole republic, built from loyal officials and officers.\n\n§gHezb-e Enqelab-e Melli, 1976/77.§!"
 COLDWAR_AFG_daoud_a1_tb: "The National Revolutionary Party"
 COLDWAR_AFG_daoud_a1f: "The Loya Jirga Constitution"
 COLDWAR_AFG_daoud_a1f_desc: "A hand-picked Loya Jirga gives the republic a presidential constitution and a single party.\n\n§gConstitution of 1977.§!"
 COLDWAR_AFG_daoud_a2: "The Officers' Republic"
 COLDWAR_AFG_daoud_a2_desc: "Rule through the commanders who carried out the coup and leave party politics to later.\n\n§gCentral Committee of officers, 1973-75.§!"
 COLDWAR_AFG_daoud_a2f: "The Republican Guard"
 COLDWAR_AFG_daoud_a2f_desc: "An elite guard in Kabul makes sure the next coup is not against the President.\n\n§gPresidential guard 1973-78.§!"
 COLDWAR_AFG_daoud_a2f_tb: "The Republican Guard"
 COLDWAR_AFG_daoud_b1: "Soviet Credit and Barter"
 COLDWAR_AFG_daoud_b1_desc: "Moscow lends at two per cent and takes payment in gas and cotton. The debt grows with every factory.\n\n§gSoviet credits to the Republic 1974-77.§!"
 COLDWAR_AFG_daoud_b1f: "The Jangalak Works"
 COLDWAR_AFG_daoud_b1f_desc: "Soviet credit turns Kabul's Jangalak workshops into a plant for vehicles, tools and spare parts.\n\n§gJangalak factory, Soviet-built.§!"
 COLDWAR_AFG_daoud_b1f_tb: "The Jangalak Works"
 COLDWAR_AFG_daoud_b2: "Petrodollars from Tehran"
 COLDWAR_AFG_daoud_b2_desc: "The Shah offers more money than Moscow and Washington together. Iranian advisers come with it.\n\n§gIran pledged $1,291m to the Seven-Year Plan.§!"
 COLDWAR_AFG_daoud_b2f: "The Iranian Railway Survey"
 COLDWAR_AFG_daoud_b2f_desc: "Surveyors map a line from Mashhad to Herat and Kandahar. The track will follow the money.\n\n§gIranian railway credit 1974-75 (LOW).§!"
 COLDWAR_AFG_daoud_c1: "Purge the Left from the Army"
 COLDWAR_AFG_daoud_c1_desc: "The communist officers who helped in 1973 are posted to the provinces or retired.\n\n§gRemoval of Parchamis 1975-77.§!"
 COLDWAR_AFG_daoud_c2: "Keep Parcham in the Cabinet"
 COLDWAR_AFG_daoud_c2_desc: "Parcham's ministers keep Moscow friendly and the students quiet, at the price of a party inside the party.\n\n§gParchami ministers 1973-75.§!"
 COLDWAR_AFG_daoud_c2_tb: "Keep Parcham in the Cabinet"
 COLDWAR_AFG_daoud_cap: "The Republic of Afghanistan"
 COLDWAR_AFG_daoud_cap_desc: "The monarchy is gone, the plan is working and the army obeys. The republic stands on its own.\n\n§gRepublic 1973-78.§!"
 COLDWAR_AFG_daoud_cm: "The Republican Police Academy"
 COLDWAR_AFG_daoud_cm_desc: "Trained police replace the khan's men in the district towns.\n\n§gPolice modernisation under the Republic.§!"
 COLDWAR_AFG_daoud_cm_tb: "The Republican Police Academy"
 COLDWAR_AFG_daoud_d1: "Pashtunistan Pressed"
 COLDWAR_AFG_daoud_d1_desc: "Kabul arms and shelters the Baluch and Pashtun rebels across the Durand Line.\n\n§gSupport for NWFP/Baluch insurgents 1973-75.§!"
 COLDWAR_AFG_daoud_d2: "Talks with Bhutto"
 COLDWAR_AFG_daoud_d2_desc: "Daoud and Bhutto agree to stop arming each other's rebels. The nationalists call it surrender.\n\n§gDaoud-Bhutto talks 1976.§!"
 COLDWAR_AFG_daoud_dm: "The Non-Aligned Republic"
 COLDWAR_AFG_daoud_dm_desc: "The republic takes credit from Moscow, Tehran, Riyadh and Delhi and gives none of them a base.\n\n§gDaoud's tours 1975-77.§!"
 COLDWAR_AFG_daoud_e: "The Sardar's Programme"
 COLDWAR_AFG_daoud_e_desc: "Daoud promises what the court never delivered: a planned economy, a strong army and a state that reaches every valley.\n\n§gDaoud's radio address of 17 July 1973.§!"
 COLDWAR_AFG_daoud_eco: "The Seven-Year Plan"
 COLDWAR_AFG_daoud_eco_desc: "A plan for 1976 to 1983 that the republic, not the donors, writes.\n\n§gSeven-Year Plan 1976 (Iranica, Economy XI).§!"
 COLDWAR_AFG_daoud_em: "Nationalise the Banks"
 COLDWAR_AFG_daoud_em_desc: "The private banks become state banks and their credit follows the plan.\n\n§gBank nationalisation, 1975.§!"
 COLDWAR_AFG_daoud_pm: "The President's Cabinet"
 COLDWAR_AFG_daoud_pm_desc: "Technocrats and loyal officers replace the royal clans in the ministries.\n\n§gCabinet reshuffles 1975-77.§!"
 COLDWAR_AFG_daoud_pol: "Rule from Above"
 COLDWAR_AFG_daoud_pol_desc: "The Jirga is dissolved. Governors, generals and ministers answer to the President alone.\n\n§gDissolution of parliament, 1973.§!"
 COLDWAR_AFG_daoud_tree_shortcut: "Sardar Daoud and the Republic"
 COLDWAR_AFG_daoud_x1: "Daoud Defies Brezhnev"
 COLDWAR_AFG_daoud_x1_desc: "In the Kremlin Daoud tells Brezhnev that Afghans will choose their own advisers. Soviet arms slow down.\n\n§gDaoud-Brezhnev meeting, April 1977.§!"
 COLDWAR_AFG_daoud_x2: "Moscow's Favoured President"
 COLDWAR_AFG_daoud_x2_desc: "A republic that keeps Soviet advisers in every ministry gets Soviet tanks first.\n\n§gAlternative B10.§!"
 COLDWAR_AFG_dehradun: "Officer Training in India"
 COLDWAR_AFG_dehradun_partner: "Officer Training in India"
 COLDWAR_AFG_democratic_kingdom: "The Democratic Kingdom"
 COLDWAR_AFG_dir_constitution: "The Parties Question"
 COLDWAR_AFG_dir_constitution_a: "Petition the Palace"
 COLDWAR_AFG_dir_constitution_a_desc: "Maiwandwal's Mosawat circle."
 COLDWAR_AFG_dir_constitution_b: "Rally the Bureaucracy"
 COLDWAR_AFG_dir_constitution_b_desc: "Afghan Mellat among Pashtun officials and teachers."
 COLDWAR_AFG_dir_constitution_desc: "The Jirga passed a political parties law and the king has never signed it. Reformers say the New Democracy cannot work without legal parties."
 COLDWAR_AFG_dir_constitution_m: "Parties in the Open"
 COLDWAR_AFG_dir_constitution_m_desc: "Shafiq's party bill 1972."
 COLDWAR_AFG_dir_faith: "The Hanafi State"
 COLDWAR_AFG_dir_faith_a: "The Sharia Faculty"
 COLDWAR_AFG_dir_faith_a_desc: "Niazi and Rabbani teach at the Kabul Faculty of Sharia."
 COLDWAR_AFG_dir_faith_b: "The Village Pulpits"
 COLDWAR_AFG_dir_faith_b_desc: "Friday sermons against the 1965 press law."
 COLDWAR_AFG_dir_faith_desc: "Village mullahs, Sufi pirs and the Islamist students of the Sharia faculty agree on one thing: the godless newspapers and unveiled ministries are leading Afghanistan astray."
 COLDWAR_AFG_dir_faith_m: "Islam in the Constitution"
 COLDWAR_AFG_dir_faith_m_desc: "Muslim Youth won the 1970 student elections."
 COLDWAR_AFG_dir_left: "Bread, Clothing and Shelter"
 COLDWAR_AFG_dir_left_a: "Organise the Officer Corps"
 COLDWAR_AFG_dir_left_a_desc: "Khalq and Parcham cells already meet in the barracks of Kabul and Bagram."
 COLDWAR_AFG_dir_left_b: "Organise the Schools"
 COLDWAR_AFG_dir_left_b_desc: "The left's real army is the teachers' college and the student hostels."
 COLDWAR_AFG_dir_left_desc: "Teachers, students and young officers no longer believe the court can lift the villages out of debt. The left offers a party, a programme and the Soviet model next door.\n\n§gKor, Kali, Dodai: the PDPA slogan of 1978.§!"
 COLDWAR_AFG_dir_left_m: "The Left Takes the Street"
 COLDWAR_AFG_dir_left_m_desc: "PDPA founding congress 1965; Shola-e Javid marches 1968-69."
 COLDWAR_AFG_dir_republic: "The Sardar's Return"
 COLDWAR_AFG_dir_republic_a: "Consult the Sardar"
 COLDWAR_AFG_dir_republic_a_desc: "Former ministers visit Daoud's villa every week."
 COLDWAR_AFG_dir_republic_b: "Sound Out the Garrison"
 COLDWAR_AFG_dir_republic_b_desc: "Parchami and Daoudist officers in the 4th and 15th Armoured Brigades."
 COLDWAR_AFG_dir_republic_desc: "Mohammed Daoud built the army and the roads as prime minister. Officers and officials who served him say Afghanistan needs a strong hand, not a talking shop."
 COLDWAR_AFG_dir_republic_m: "A Republic in Waiting"
 COLDWAR_AFG_dir_republic_m_desc: "Coup of 17 July 1973."
 COLDWAR_AFG_dir_throne: "The King Rules in Person"
 COLDWAR_AFG_dir_throne_a: "The Palace Guard"
 COLDWAR_AFG_dir_throne_a_desc: "General Abdul Wali, the king's cousin, is seen as the strongman of the palace."
 COLDWAR_AFG_dir_throne_b: "The Loya Jirga Tradition"
 COLDWAR_AFG_dir_throne_b_desc: "Tribal and religious notables in the 1969 Jirga."
 COLDWAR_AFG_dir_throne_desc: "Since 1963 Zahir Shah has ruled without a prime minister from the royal family. The palace can tighten its grip or let the constitution breathe."
 COLDWAR_AFG_dir_throne_m: "The Crown Holds the Centre"
 COLDWAR_AFG_dir_throne_m_desc: "Zahir Shah's balancing of tribes, technocrats and donors."
 COLDWAR_AFG_direction_tt: "The other political directions are closed until the next change of government."
 COLDWAR_AFG_drought_1: "The Great Drought"
 COLDWAR_AFG_drought_1_desc: "This national spirit will §GImprove§! if we complete one of the focuses §YVillage Granaries§!, §YBamyan Development Plan§!, §YThe Mazar Fertiliser Plant§!, §YBread Before Politics§!, §YThe Ghor Relief Commission§! or §YGranaries of the Provinces§!."
 COLDWAR_AFG_drought_2: "The Great Drought (Relief Arriving)"
 COLDWAR_AFG_drought_2_desc: "This national spirit will §GImprove§! if we complete one of the focuses §YVillage Granaries§!, §YBamyan Development Plan§!, §YThe Mazar Fertiliser Plant§!, §YBread Before Politics§! or §YThe Ghor Relief Commission§!.\nThis national spirit will be §GRemoved§! if we complete the §YGranaries of the Provinces§! focus."
 COLDWAR_AFG_drought_3: "The Great Drought (Recovery)"
 COLDWAR_AFG_drought_3_desc: "This national spirit will be §GRemoved§! if we complete one of the focuses §YVillage Granaries§!, §YBamyan Development Plan§!, §YThe Mazar Fertiliser Plant§!, §YBread Before Politics§!, §YThe Ghor Relief Commission§! or §YGranaries of the Provinces§!."
 COLDWAR_AFG_eco_afghani: "Stabilise the Afghani"
 COLDWAR_AFG_eco_afghani_desc: "A currency that holds its value in the Sarai Shahzada is worth more than any donor pledge.\n\n§gDa Afghanistan Bank policy.§!"
 COLDWAR_AFG_eco_afghani_tb: "Stabilise the Afghani"
 COLDWAR_AFG_eco_ariana: "Ariana Afghan Airlines"
 COLDWAR_AFG_eco_ariana_desc: "An airline that flies karakul to Frankfurt does not need the Khyber Pass.\n\n§gAriana, Pan Am partner from 1957.§!"
 COLDWAR_AFG_eco_ariana_tb: "Ariana Afghan Airlines"
 COLDWAR_AFG_eco_bazaar: "Tax the Bazaar"
 COLDWAR_AFG_eco_bazaar_desc: "Licences and turnover taxes for the merchants of Kabul and Kandahar. They will pass the cost to the mills.\n\n§gMerchant taxation.§!"
 COLDWAR_AFG_eco_bazaar_tb: "Tax the Bazaar"
 COLDWAR_AFG_eco_customs: "Customs Before Credit"
 COLDWAR_AFG_eco_customs_desc: "Customs duties are the one tax Kabul can actually collect. Collect them honestly first.\n\n§gCustoms as main revenue (FRUS d.339).§!"
 COLDWAR_AFG_eco_customs_tb: "Customs Before Credit"
 COLDWAR_AFG_eco_fair: "The Kabul Trade Fair"
 COLDWAR_AFG_eco_fair_desc: "Buyers from Moscow, Delhi and Hamburg come to Kabul for karakul, carpets and dried fruit.\n\n§gJeshyn fairs.§!"
 COLDWAR_AFG_eco_fair_tb: "The Kabul Trade Fair"
 COLDWAR_AFG_eco_fertiliser: "The Mazar Fertiliser Plant"
 COLDWAR_AFG_eco_fertiliser_desc: "Urea from Afghan gas for Afghan wheat. The country that imports grain in a drought can grow more of its own.\n\n§gMazar fertiliser plant, 1974.§!"
 COLDWAR_AFG_eco_fertiliser_tb: "The Mazar Fertiliser Plant"
 COLDWAR_AFG_eco_final: "A Self-Financing Plan"
 COLDWAR_AFG_eco_final_desc: "For the first time the treasury, not the donors, pays most of the plan.\n\n§gGoal of the Seven-Year Plan.§!"
 COLDWAR_AFG_eco_gas: "The Sheberghan Gas Fields"
 COLDWAR_AFG_eco_gas_debt: "Gas for Soviet Debt"
 COLDWAR_AFG_eco_gas_debt_desc: "Let the gas pay off the Soviet loans of the 1950s and 60s. The debt shrinks, the price stays low.\n\n§gGas netted against debt (CS Monitor 1982).§!"
 COLDWAR_AFG_eco_gas_debt_tb: "Gas for Soviet Debt"
 COLDWAR_AFG_eco_gas_desc: "Soviet engineers pump northern gas across the Amu Darya. It is Afghanistan's largest export and it pays almost nothing in cash.\n\n§gGas exports to USSR from 1967-68.§!"
 COLDWAR_AFG_eco_gas_price: "Gas at World Prices"
 COLDWAR_AFG_eco_gas_price_desc: "Demand hard currency for the gas, as Iran does for its oil. Moscow will remember who asked.\n\n§g1975 'improved terms'.§!"
 COLDWAR_AFG_eco_gas_price_tb: "Gas at World Prices"
 COLDWAR_AFG_eco_gas_tb: "The Sheberghan Gas Fields"
 COLDWAR_AFG_eco_grid: "The Northern Power Grid"
 COLDWAR_AFG_eco_grid_desc: "A gas power station lights Mazar and the northern mills.\n\n§gMazar gas power station.§!"
 COLDWAR_AFG_eco_grid_tb: "The Northern Power Grid"
 COLDWAR_AFG_eco_idb: "The Afghan Industrial Development Bank"
 COLDWAR_AFG_eco_idb_desc: "A development bank lends to Afghan firms what the donors lend to Afghan ministries.\n\n§gIDBA 1973 with IBRD and Chase (FRUS d.340).§!"
 COLDWAR_AFG_eco_idb_tb: "The Afghan Industrial Development Bank"
 COLDWAR_AFG_eco_kabul_mills: "The Gulbahar Textile Mills"
 COLDWAR_AFG_eco_kabul_mills_desc: "Afghan cotton becomes Afghan cloth in the valley north of Kabul.\n\n§gGulbahar textile complex, 1960s.§!"
 COLDWAR_AFG_eco_kabul_mills_tb: "The Gulbahar Textile Mills"
 COLDWAR_AFG_eco_karachi: "Transit through Karachi"
 COLDWAR_AFG_eco_karachi_desc: "The sea is closest through Pakistan. Using it means softening the Pashtunistan quarrel.\n\n§gAfghan Transit Trade Agreement 1965.§!"
 COLDWAR_AFG_eco_livestock: "Tax the Livestock"
 COLDWAR_AFG_eco_livestock_desc: "The flocks are the countryside's wealth. The Jirga has refused this tax for a decade.\n\n§gLivestock tax resisted by the Jirga.§!"
 COLDWAR_AFG_eco_livestock_tb: "Tax the Livestock"
 COLDWAR_AFG_eco_pipeline: "The Jowzjan Pipeline"
 COLDWAR_AFG_eco_pipeline_desc: "A second line carries gas to Mazar-i-Sharif and the new plants instead of only to the border.\n\n§gNorthern gas network.§!"
 COLDWAR_AFG_eco_pipeline_tb: "The Jowzjan Pipeline"
 COLDWAR_AFG_eco_root: "The Fourth Five-Year Plan"
 COLDWAR_AFG_eco_root_desc: "The Third Plan ends in 1972 with half its money from abroad. The fourth must be written for a country that pays more of its own way.\n\n§gThird Plan 1967-72: foreign share 47.2% (Dawn).§!"
 COLDWAR_AFG_eco_root_tb: "The Fourth Five-Year Plan"
 COLDWAR_AFG_eco_termez: "The Northern Route"
 COLDWAR_AFG_eco_termez_desc: "Through Termez and the Soviet railways, safe from Pakistani blockades and dependent on Moscow.\n\n§gNorthern route during 1961-63 closure.§!"
 COLDWAR_AFG_eco_termez_tb: "The Northern Route"
 COLDWAR_AFG_eco_transit: "The Landlocked Road"
 COLDWAR_AFG_eco_transit_desc: "Every Afghan export must cross a neighbour. Each route is a political choice.\n\n§gTransit via Pakistan; closure 1961-63.§!"
 COLDWAR_AFG_eco_transit_tb: "The Landlocked Road"
 COLDWAR_AFG_economy_modifier: "National Economy"
 COLDWAR_AFG_economy_modifier_desc: "The lasting results of our national focuses for national economy."
 COLDWAR_AFG_economy_tree_shortcut: "Economy"
 COLDWAR_AFG_end_war_tt: "The band spirit of the §YCountryside in Revolt§! and the §YMountain Front§! are removed; they return only if the revolt reaches 40 again."
 COLDWAR_AFG_exodus_active_tt: "Afghan refugees are fleeing the war (The Exodus is active)"
 COLDWAR_AFG_exodus_modifier: "The Exodus"
 COLDWAR_AFG_exodus_modifier_desc: "Afghans flee the war to Pakistan and Iran. Step [?COLDWAR_AFG_refugees|0] of 3; every neighbour that hosts the refugees halves the effects."
 COLDWAR_AFG_federal_afghanistan: "A Federal Afghanistan"
 COLDWAR_AFG_for_chi_canal: "The Parwan Irrigation Canal"
 COLDWAR_AFG_for_chi_canal_desc: "Chinese engineers for the Parwan canal.\n\n§gChinese Parwan canal (People's Daily 2023, LOW detail).§!"
 COLDWAR_AFG_for_chi_credit: "Interest-Free Chinese Credit"
 COLDWAR_AFG_for_chi_credit_desc: "Interest-free Chinese credit.\n\n§gChinese loans 1970s.§!"
 COLDWAR_AFG_for_don: "Friends Far and Near"
 COLDWAR_AFG_for_don_desc: "Delhi, Bonn, Beijing and Riyadh each want a foothold in Kabul."
 COLDWAR_AFG_for_final: "A Friend of Every Donor"
 COLDWAR_AFG_for_final_desc: "Afghanistan has agreements with both superpowers and its neighbours, and still no foreign base on its soil.\n\n§gBitarafi at its height.§!"
 COLDWAR_AFG_for_ger_paktia: "The Paktia Development Project"
 COLDWAR_AFG_for_ger_paktia_desc: "Bonn's development project in Paktia province.\n\n§gGerman Paktia project from 1965 (to be source-checked).§!"
 COLDWAR_AFG_for_ger_police: "Police Training Mission"
 COLDWAR_AFG_for_ger_police_desc: "German instructors for the Afghan police.\n\n§gGerman police aid (UNVERIFIED, flagged speculative).§!"
 COLDWAR_AFG_for_nbr: "The Neighbours"
 COLDWAR_AFG_for_nbr_desc: "Pakistan holds the road to the sea; Iran holds the Helmand's end and the oil money."
 COLDWAR_AFG_for_pak_spirit: "The Spirit of Kabul"
 COLDWAR_AFG_for_pak_spirit_desc: "An end to arming each other's rebels on the frontier.\n\n§gDaoud-Bhutto talks 1976; prisoner release Mar 1978.§!"
 COLDWAR_AFG_for_pak_transit: "Afghan Transit Trade Agreement"
 COLDWAR_AFG_for_pak_transit_desc: "A new transit agreement through Karachi.\n\n§gATTA 1965; 1970 transit conference blocked (FRUS d.333).§!"
 COLDWAR_AFG_for_per_credit: "Iranian Development Credit"
 COLDWAR_AFG_for_per_credit_desc: "The Shah's development credit for the Afghan plan.\n\n§gIran pledged $1,291m to the Seven-Year Plan (Iranica).§!"
 COLDWAR_AFG_for_per_rail: "The Herat-Mashhad Railway"
 COLDWAR_AFG_for_per_rail_desc: "A railway from Mashhad to Herat.\n\n§gRailway credit 1974-75 (LOW).§!"
 COLDWAR_AFG_for_per_water: "Helmand Water Treaty"
 COLDWAR_AFG_for_per_water_desc: "Settle the Helmand waters with Iran after a century of dispute.\n\n§gHelmand Water Treaty 1973 (22 + 4 m3/s).§!"
 COLDWAR_AFG_for_raj_aid: "Indian Technical Assistance"
 COLDWAR_AFG_for_raj_aid_desc: "Indian engineers and doctors for Afghan projects.\n\n§gIndian aid and training talks, Delhi 10-11 Mar 1975 (Dawn).§!"
 COLDWAR_AFG_for_raj_army: "Officer Training in India"
 COLDWAR_AFG_for_raj_army_desc: "Afghan cadets at the Indian Military Academy.\n\n§gIndian military training talks, March 1975 (Dawn; detail LOW).§!"
 COLDWAR_AFG_for_root: "Bitarafi: Positive Neutrality"
 COLDWAR_AFG_for_root_desc: "Afghanistan takes aid from both blocs and joins neither. Every agreement moves the balance between Moscow and Washington.\n\n§gBitarafi since 1955; NAM founder 1961.§!"
 COLDWAR_AFG_for_sau_kuwait: "Kuwait Fund and Gulf Credit"
 COLDWAR_AFG_for_sau_kuwait_desc: "Kuwait Fund and Gulf credit for the plan.\n\n§gKuwait $115.2m to the Seven-Year Plan (Iranica).§!"
 COLDWAR_AFG_for_sau_loan: "Saudi Development Loan"
 COLDWAR_AFG_for_sau_loan_desc: "A Saudi development loan.\n\n§gSaudi $71.5m to the Seven-Year Plan (Iranica).§!"
 COLDWAR_AFG_for_sov: "The Northern Neighbour"
 COLDWAR_AFG_for_sov_desc: "Moscow has given more aid than anyone and borders the north for two thousand kilometres."
 COLDWAR_AFG_for_sov_gas: "Sheberghan Gas Price Commission"
 COLDWAR_AFG_for_sov_gas_desc: "Kabul asks Moscow to pay a fair price for Sheberghan gas.\n\n§g18-year gas contract 1968; price $100 vs $180 re-export (CS Monitor 1982).§!"
 COLDWAR_AFG_for_sov_officers: "Officer Training in the Soviet Union"
 COLDWAR_AFG_for_sov_officers_desc: "More places for Afghan cadets in Soviet academies.\n\n§gAfghan officers in Soviet academies since 1956.§!"
 COLDWAR_AFG_for_sov_trade: "Five-Year Trade Agreement"
 COLDWAR_AFG_for_sov_trade_desc: "A five-year barter agreement with the northern neighbour.\n\n§gTrade agreement 1976 (+50% by 1980); treaty 14 Apr 1977.§!"
 COLDWAR_AFG_for_sov_wheat: "Soviet Wheat and Credit"
 COLDWAR_AFG_for_sov_wheat_desc: "Soviet grain can reach Mazar faster than American grain reaches Karachi.\n\n§gSoviet grain shipments 1971-72.§!"
 COLDWAR_AFG_for_usa: "The Distant Friend"
 COLDWAR_AFG_for_usa_desc: "Washington built the south's dams and Kandahar's airport and wants Afghanistan out of the Soviet orbit."
 COLDWAR_AFG_for_usa_helmand: "Helmand Delta and Kajaki Project"
 COLDWAR_AFG_for_usa_helmand_desc: "USAID is asked to finish the Helmand scheme it began.\n\n§gEtemadi's aide-memoires on Helmand and Kajaki, 1970 (FRUS d.333).§!"
 COLDWAR_AFG_for_usa_peace: "Peace Corps Teachers"
 COLDWAR_AFG_for_usa_peace_desc: "More Peace Corps teachers for provincial schools.\n\n§gPeace Corps in Afghanistan 1962-79, c. 200-250 volunteers.§!"
 COLDWAR_AFG_for_usa_poppy: "Poppy Eradication Programme"
 COLDWAR_AFG_for_usa_poppy_desc: "A crop-substitution programme for the poppy districts.\n\n§gFord approves PL-480 with poppy talks 1976 (FRUS E-8).§!"
 COLDWAR_AFG_for_usa_wheat: "PL-480 Wheat Grant"
 COLDWAR_AFG_for_usa_wheat_desc: "Kabul asks for American surplus wheat for the drought provinces.\n\n§gPL-480: 100,000 t, then 250,000 t, extra 100,000 t (FRUS d.345, d.348).§!"
 COLDWAR_AFG_foreign_tree_shortcut: "Foreign"
 COLDWAR_AFG_free_press: "Free Press and Free Unions"
 COLDWAR_AFG_frontier_militancy: "Frontier Militancy"
 COLDWAR_AFG_gas_commission: "Sheberghan Gas Price Commission"
 COLDWAR_AFG_gas_commission_partner: "Sheberghan Gas Price Commission"
 COLDWAR_AFG_geneva_accords: "The Geneva Accords"
 COLDWAR_AFG_geneva_accords_partner: "The Geneva Accords"
 COLDWAR_AFG_geneva_effects_tt: "The Countryside in Revolt falls by §G20§! and then by §G1§! every month; Pakistan, the Soviet Union and the United States end their support decisions and the Soviet contingent withdraws."
 COLDWAR_AFG_geneva_not_tt: "The Geneva Accords are not in force"
 COLDWAR_AFG_german_police: "Police Training Mission"
 COLDWAR_AFG_german_police_partner: "Police Training Mission"
 COLDWAR_AFG_hazara_a1: "Mohseni's Reform"
 COLDWAR_AFG_hazara_a1_desc: "Jafari law recognised, Shia schools legal, loyalty to the state.\n\n§gMohammad Asef Mohseni.§!"
 COLDWAR_AFG_hazara_a1f: "Jafari Courts"
 COLDWAR_AFG_hazara_a1f_desc: "Shia citizens may take their cases to Jafari judges.\n\n§g1964 constitution Hanafi bias.§!"
 COLDWAR_AFG_hazara_a1f_tb: "Jafari Courts"
 COLDWAR_AFG_hazara_a2: "The Seminarians' Revolution"
 COLDWAR_AFG_hazara_a2_desc: "The clerics of Najaf say only a Shia revolution will free the Hazaras.\n\n§gNajaf/Qom seminarians.§!"
 COLDWAR_AFG_hazara_a2f: "The Shura of the Hazarajat"
 COLDWAR_AFG_hazara_a2f_desc: "A council of clerics and commanders governs the central highlands.\n\n§gShura-ye Ittifaq 1979.§!"
 COLDWAR_AFG_hazara_b1: "Roads into the Highlands"
 COLDWAR_AFG_hazara_b1_desc: "A road from Kabul to Bamyan ends the isolation of the Hazarajat.\n\n§gBamyan roads.§!"
 COLDWAR_AFG_hazara_b1_tb: "Roads into the Highlands"
 COLDWAR_AFG_hazara_b1f: "Bamyan Development Plan"
 COLDWAR_AFG_hazara_b1f_desc: "Wells, seed and fodder for the famine districts of Ghor and Bamyan.\n\n§gGhor and Bamyan famine relief.§!"
 COLDWAR_AFG_hazara_b1f_tb: "Bamyan Development Plan"
 COLDWAR_AFG_hazara_b2: "Hazara Labour in the Cities"
 COLDWAR_AFG_hazara_b2_desc: "Hazara workers build Kabul. They should share its wealth.\n\n§gHazara labourers in Kabul.§!"
 COLDWAR_AFG_hazara_b2f: "The Workers' Hostels"
 COLDWAR_AFG_hazara_b2f_desc: "Hostels and clinics for the labourers of Kabul.\n\n§gUrban Hazara welfare.§!"
 COLDWAR_AFG_hazara_b2f_tb: "The Workers' Hostels"
 COLDWAR_AFG_hazara_c1: "Equal Citizenship"
 COLDWAR_AFG_hazara_c1_desc: "Hazaras serve as officers, governors and judges.\n\n§gHazara demands.§!"
 COLDWAR_AFG_hazara_c2: "Autonomy of the Hazarajat"
 COLDWAR_AFG_hazara_c2_desc: "The highlands govern themselves.\n\n§gHazarajat autonomy 1979-84.§!"
 COLDWAR_AFG_hazara_cap: "The Unity of the Shia"
 COLDWAR_AFG_hazara_cap_desc: "The Shia of Afghanistan speak with one voice and are heard.\n\n§gHezb-e Wahdat 1989.§!"
 COLDWAR_AFG_hazara_cm: "Shia Schools"
 COLDWAR_AFG_hazara_cm_desc: "Schools and libraries in the Shia quarters and villages.\n\n§gShia education.§!"
 COLDWAR_AFG_hazara_cm_tb: "Shia Schools"
 COLDWAR_AFG_hazara_d1: "The Tehran Patron"
 COLDWAR_AFG_hazara_d1_desc: "Iran offers money and seminary places to the Afghan Shia.\n\n§gIranian support after 1979.§!"
 COLDWAR_AFG_hazara_d2: "Afghan First"
 COLDWAR_AFG_hazara_d2_desc: "The Hazaras will be loyal Afghans, not Iran's clients.\n\n§gHazara nationalism.§!"
 COLDWAR_AFG_hazara_dm: "The Hazara Brigades"
 COLDWAR_AFG_hazara_dm_desc: "Hazara units in the army defend their homeland.\n\n§gLater Wahdat forces.§!"
 COLDWAR_AFG_hazara_e: "The Hazarajat Speaks"
 COLDWAR_AFG_hazara_e_desc: "Hazaras, long the poorest and most despised Afghans, demand equal citizenship.\n\n§gHazara discrimination; Ghor famine 1971-72.§!"
 COLDWAR_AFG_hazara_eco: "Pastures of the Hazarajat"
 COLDWAR_AFG_hazara_eco_desc: "The Hazara highlands want their pastures protected from the Kuchi nomads.\n\n§gKuchi grazing rights dispute.§!"
 COLDWAR_AFG_hazara_eco_tb: "Pastures of the Hazarajat"
 COLDWAR_AFG_hazara_em: "Highland Cooperatives"
 COLDWAR_AFG_hazara_em_desc: "Cooperatives sell Hazara wool and butter in the bazaars.\n\n§gHighland economy.§!"
 COLDWAR_AFG_hazara_pm: "A Shia Voice in Kabul"
 COLDWAR_AFG_hazara_pm_desc: "Hazara ministers sit in the cabinet for the first time.\n\n§gAlternative.§!"
 COLDWAR_AFG_hazara_pm_tb: "A Shia Voice in Kabul"
 COLDWAR_AFG_hazara_pol: "The Chindawol Circle"
 COLDWAR_AFG_hazara_pol_desc: "The Shia notables of Kabul ask for schools, courts and equality within the state.\n\n§gMohseni's Chindawol circle.§!"
 COLDWAR_AFG_hazara_pol_tb: "The Chindawol Circle"
 COLDWAR_AFG_hazara_tree_shortcut: "Hazara Shia Movement"
 COLDWAR_AFG_helmand_delta: "Helmand Delta and Kajaki Project"
 COLDWAR_AFG_helmand_delta_partner: "Helmand Delta and Kajaki Project"
 COLDWAR_AFG_helmand_treaty: "Helmand Water Treaty"
 COLDWAR_AFG_helmand_treaty_partner: "Helmand Water Treaty"
 COLDWAR_AFG_hezb_a1: "Party Discipline"
 COLDWAR_AFG_hezb_a1_desc: "The emir decides and the cadres obey.\n\n§gHekmatyar's party structure.§!"
 COLDWAR_AFG_hezb_a1f: "The Cadre School"
 COLDWAR_AFG_hezb_a1f_desc: "Trained cadres for the party, the army and the ministries.\n\n§gHezb training camps.§!"
 COLDWAR_AFG_hezb_a2: "Islamic Revolution"
 COLDWAR_AFG_hezb_a2_desc: "The khans and the court are as guilty as the communists.\n\n§gQutb, Maududi.§!"
 COLDWAR_AFG_hezb_a2f: "Revolutionary Courts"
 COLDWAR_AFG_hezb_a2f_desc: "Party judges try the enemies of Islam.\n\n§gHezb courts.§!"
 COLDWAR_AFG_hezb_b1: "ISI Arms Pipeline"
 COLDWAR_AFG_hezb_b1_desc: "Pakistan's intelligence service offers weapons, money and training to the party.\n\n§gISI support for Hezb after 1975.§!"
 COLDWAR_AFG_hezb_b1f: "The Shamshatu Camps"
 COLDWAR_AFG_hezb_b1f_desc: "Training camps near Peshawar turn students into soldiers.\n\n§gShamshatu refugee camp.§!"
 COLDWAR_AFG_hezb_b1f_tb: "The Shamshatu Camps"
 COLDWAR_AFG_hezb_b2: "Gulf Charities"
 COLDWAR_AFG_hezb_b2_desc: "Saudi and Kuwaiti donors fund schools, clinics and fighters.\n\n§gGulf funding.§!"
 COLDWAR_AFG_hezb_b2f: "Party Welfare Committees"
 COLDWAR_AFG_hezb_b2f_desc: "The party feeds the families of its fighters.\n\n§gHezb welfare.§!"
 COLDWAR_AFG_hezb_c1: "Purify the Ministries"
 COLDWAR_AFG_hezb_c1_desc: "Leftist officials and unveiled women leave the ministries.\n\n§gHezb social programme.§!"
 COLDWAR_AFG_hezb_c2: "Pashtun Tribal Pact"
 COLDWAR_AFG_hezb_c2_desc: "The tribes of the east join the party in return for their old rights.\n\n§gHezb Pashtun base.§!"
 COLDWAR_AFG_hezb_cap: "The Islamic Revolution of Afghanistan"
 COLDWAR_AFG_hezb_cap_desc: "The party has made the revolution it promised. The country is armed and disciplined.\n\n§gAlternative B6.§!"
 COLDWAR_AFG_hezb_cm: "The Party Army"
 COLDWAR_AFG_hezb_cm_desc: "Party fighters become the core of a new national army.\n\n§gHezb armed forces.§!"
 COLDWAR_AFG_hezb_d1: "Islamabad's Western Flank"
 COLDWAR_AFG_hezb_d1_desc: "A friendly Kabul gives Islamabad depth against India.\n\n§gPakistani regional strategy (the term strategic depth is from the 1980s).§!"
 COLDWAR_AFG_hezb_d2: "Against Both Superpowers"
 COLDWAR_AFG_hezb_d2_desc: "Neither East nor West: Islam alone.\n\n§gHezb anti-Western line.§!"
 COLDWAR_AFG_hezb_dm: "The Mujahid State"
 COLDWAR_AFG_hezb_dm_desc: "The state exists to wage and win the jihad.\n\n§gHezb ideology.§!"
 COLDWAR_AFG_hezb_dm_tb: "The Mujahid State"
 COLDWAR_AFG_hezb_e: "The University Jihadists"
 COLDWAR_AFG_hezb_e_desc: "Hekmatyar's students believe the communists must be fought with fists and then with guns.\n\n§gHekmatyar at Kabul University c. 1970.§!"
 COLDWAR_AFG_hezb_eco: "A War Economy"
 COLDWAR_AFG_hezb_eco_desc: "Every workshop serves the jihad.\n\n§gHezb logistics.§!"
 COLDWAR_AFG_hezb_em: "Requisition for the Jihad"
 COLDWAR_AFG_hezb_em_desc: "The property of the enemies of Islam serves the jihad.\n\n§gHezb requisitions.§!"
 COLDWAR_AFG_hezb_pm: "The Emir's Government"
 COLDWAR_AFG_hezb_pm_desc: "Hekmatyar governs with his party, not with coalitions.\n\n§gHekmatyar PM 1993 (alternative earlier).§!"
 COLDWAR_AFG_hezb_pol: "Hezb-e Islami"
 COLDWAR_AFG_hezb_pol_desc: "A disciplined party with a single leader and an armed wing.\n\n§gHezb-e Islami, 1975-76.§!"
 COLDWAR_AFG_hezb_tree_shortcut: "University Jihadists and Hezb-e Islami"
 COLDWAR_AFG_host_refugees_pak: "Host the Afghan Refugees"
 COLDWAR_AFG_host_refugees_pak_desc: "Camps in the North-West Frontier for three million Afghans. 3.3 million in Pakistan (1988)."
 COLDWAR_AFG_host_refugees_pak_end: "Close the Camps"
 COLDWAR_AFG_host_refugees_pak_end_desc: "We no longer accept Afghan refugees and stop the relief for the camps."
 # IMPERIA COLD WAR — B9 MD standard: running cost shown the MD way (weekly budget), no % of GDP
 COLDWAR_AFG_host_refugees_pak_tt: "Weekly cost: booked in our weekly budget while we host the refugees. In Afghanistan the effects of The Exodus are halved."
 COLDWAR_AFG_host_refugees_per: "Host the Afghan Refugees"
 COLDWAR_AFG_host_refugees_per_desc: "Two million Afghans in Iranian cities and camps. About 2 million in Iran (1988)."
 COLDWAR_AFG_host_refugees_per_end: "Close the Camps"
 COLDWAR_AFG_host_refugees_per_end_desc: "We no longer accept Afghan refugees and stop the relief for the camps."
 # IMPERIA COLD WAR — B9 MD standard: running cost shown the MD way (weekly budget), no % of GDP
 COLDWAR_AFG_host_refugees_per_tt: "Weekly cost: booked in our weekly budget while we host the refugees. In Afghanistan the effects of The Exodus are halved."
 COLDWAR_AFG_indian_aid: "Indian Technical Assistance"
 COLDWAR_AFG_indian_aid_partner: "Indian Technical Assistance"
 COLDWAR_AFG_iranian_brotherhood: "Iranian Brotherhood"
 COLDWAR_AFG_iranian_brotherhood_partner: "Iranian Brotherhood"
 COLDWAR_AFG_iranian_credit: "Iranian Development Credit"
 COLDWAR_AFG_iranian_credit_partner: "Iranian Development Credit"
 COLDWAR_AFG_isi_pipeline: "The ISI Arms Pipeline"
 COLDWAR_AFG_isi_pipeline_partner: "The ISI Arms Pipeline"
 COLDWAR_AFG_islamic_revolution: "The Islamic Revolution of Afghanistan"
 COLDWAR_AFG_islamic_state: "The Islamic State of Afghanistan"
 COLDWAR_AFG_jafari_courts: "Jafari Courts"
 COLDWAR_AFG_jamiat_a1: "Shura and Consultation"
 COLDWAR_AFG_jamiat_a1_desc: "Scholars, elders and engineers govern by consultation, not by a single leader.\n\n§gRabbani's shura model.§!"
 COLDWAR_AFG_jamiat_a1f: "Scholars of the Sharia Faculty"
 COLDWAR_AFG_jamiat_a1f_desc: "The Sharia faculty trains the judges and teachers of an Islamic state.\n\n§gFaculty of Sharia, Kabul.§!"
 COLDWAR_AFG_jamiat_a2: "The Commanders' Council"
 COLDWAR_AFG_jamiat_a2_desc: "The men with the guns in the valleys decide with the scholars.\n\n§gSupervisory Council of the North, Massoud.§!"
 COLDWAR_AFG_jamiat_a2f: "The Panjshir Commanders"
 COLDWAR_AFG_jamiat_a2f_desc: "Mountain fortresses and trained commanders hold the passes north of Kabul.\n\n§gPanjshir uprising 1975; Massoud.§!"
 COLDWAR_AFG_jamiat_a2f_tb: "The Panjshir Commanders"
 COLDWAR_AFG_jamiat_b1: "Bazaar Islam"
 COLDWAR_AFG_jamiat_b1_desc: "The traders of Kabul and Herat fund the movement and want low duties in return.\n\n§gBazaar support for Jamiat.§!"
 COLDWAR_AFG_jamiat_b1f: "Herat Merchant Guilds"
 COLDWAR_AFG_jamiat_b1f_desc: "Herat's guilds run the western trade with Iran under Islamic law.\n\n§gIsmail Khan's Herat.§!"
 COLDWAR_AFG_jamiat_b2: "Gulf Patrons"
 COLDWAR_AFG_jamiat_b2_desc: "Saudi and Kuwaiti charities build mosques, schools and clinics.\n\n§gGulf funding 1970s-80s.§!"
 COLDWAR_AFG_jamiat_b2f: "Mosque Schools"
 COLDWAR_AFG_jamiat_b2f_desc: "A school in every mosque, paid for by Gulf donors.\n\n§gMadrasa expansion.§!"
 COLDWAR_AFG_jamiat_c1: "The Sharia Courts"
 COLDWAR_AFG_jamiat_c1_desc: "Hanafi judges replace the secular courts of 1964.\n\n§gHanafi jurisprudence.§!"
 COLDWAR_AFG_jamiat_c2: "Tolerate the Sufi Orders"
 COLDWAR_AFG_jamiat_c2_desc: "The pirs and their followers are allies against communism, not heretics.\n\n§gMojaddedi and Gailani families.§!"
 COLDWAR_AFG_jamiat_cap: "The Islamic State of Afghanistan"
 COLDWAR_AFG_jamiat_cap_desc: "An Islamic government rules in Kabul with the support of the scholars and the commanders.\n\n§gIslamic State 1992 (alternative).§!"
 COLDWAR_AFG_jamiat_cm: "Islamic Education Ministry"
 COLDWAR_AFG_jamiat_cm_desc: "Islamic studies and modern sciences in one curriculum.\n\n§gJamiat education policy.§!"
 COLDWAR_AFG_jamiat_d1: "The Pakistan Connection"
 COLDWAR_AFG_jamiat_d1_desc: "Islamabad offers training camps and a border that stays open for the movement.\n\n§gPakistani support after 1975.§!"
 COLDWAR_AFG_jamiat_d2: "The Iranian Connection"
 COLDWAR_AFG_jamiat_d2_desc: "Tehran funds Persian-speaking Islamists in Herat and the north.\n\n§gIranian support for Ismail Khan.§!"
 COLDWAR_AFG_jamiat_dm: "The Mujahideen Network"
 COLDWAR_AFG_jamiat_dm_desc: "Supply routes, safe houses and commanders form one network.\n\n§gJamiat logistics 1980s.§!"
 COLDWAR_AFG_jamiat_e: "The Muslim Youth"
 COLDWAR_AFG_jamiat_e_desc: "The Islamist students and professors of Kabul want neither the Soviet model nor the court's laxity, but an Islamic order.\n\n§gMuslim Youth Organization 1969; Niazi, Rabbani.§!"
 COLDWAR_AFG_jamiat_eco: "An Islamic Economy"
 COLDWAR_AFG_jamiat_eco_desc: "Zakat and ushr instead of new taxes, and an end to interest.\n\n§gIslamic economics, Maududi.§!"
 COLDWAR_AFG_jamiat_em: "Zakat Treasury"
 COLDWAR_AFG_jamiat_em_desc: "Religious taxes collected by the state fund welfare and the army.\n\n§gZakat administration.§!"
 COLDWAR_AFG_jamiat_pm: "The Islamic Society Governs"
 COLDWAR_AFG_jamiat_pm_desc: "A government of professors, judges and commanders takes the ministries.\n\n§gIslamic State of Afghanistan 1992 (alternative earlier).§!"
 COLDWAR_AFG_jamiat_pol: "Jamiat-e Islami"
 COLDWAR_AFG_jamiat_pol_desc: "The movement organises as a society with a shura, a leader and cells in every faculty.\n\n§gJamiat-e Islami, 1972.§!"
 COLDWAR_AFG_jamiat_tree_shortcut: "Muslim Youth and Jamiat-e Islami"
 COLDWAR_AFG_jamiat_x1: "Rabbani's Presidency"
 COLDWAR_AFG_jamiat_x1_desc: "The scholar governs and the commanders obey the shura.\n\n§gRabbani president 1992-96.§!"
 COLDWAR_AFG_jamiat_x2: "Massoud's Ministry of Defence"
 COLDWAR_AFG_jamiat_x2_desc: "The Lion of Panjshir takes the army in hand.\n\n§gMassoud defence minister 1992.§!"
 COLDWAR_AFG_khalq_a1: "Revolution from the Barracks"
 COLDWAR_AFG_khalq_a1_desc: "Tanks on the streets of Kabul carry the party to power in a day.\n\n§gSaur Revolution, 27-28 April 1978.§!"
 COLDWAR_AFG_khalq_a1_tb: "Revolution from the Barracks"
 COLDWAR_AFG_khalq_a1f: "The Armoured Brigades"
 COLDWAR_AFG_khalq_a1f_desc: "The 4th and 15th Armoured Brigades become the revolution's praetorian guard.\n\n§gBrigades of the Saur coup.§!"
 COLDWAR_AFG_khalq_a1f_tb: "The Armoured Brigades"
 COLDWAR_AFG_khalq_a2: "Revolution of the Teachers"
 COLDWAR_AFG_khalq_a2_desc: "Khalqi teachers in every district school prepare the villages for the new order.\n\n§gKhalq recruitment among teachers.§!"
 COLDWAR_AFG_khalq_a2f: "Teachers to the Villages"
 COLDWAR_AFG_khalq_a2f_desc: "Graduates are sent to the villages as teachers, officials and party organisers.\n\n§gRural cadre programme 1978.§!"
 COLDWAR_AFG_khalq_a2f_tb: "Teachers to the Villages"
 COLDWAR_AFG_khalq_b1: "Decree No. 6: End Usury"
 COLDWAR_AFG_khalq_b1_desc: "Mortgages and debts to moneylenders and landlords are cancelled.\n\n§gDecree No. 6, 1978.§!"
 COLDWAR_AFG_khalq_b1f: "The Rural Credit Bank"
 COLDWAR_AFG_khalq_b1f_desc: "The state replaces the moneylender with seed, fertiliser and cheap credit.\n\n§gAgricultural Development Bank reform.§!"
 COLDWAR_AFG_khalq_b1f_tb: "The Rural Credit Bank"
 COLDWAR_AFG_khalq_b2: "Decree No. 8: Land to the Tiller"
 COLDWAR_AFG_khalq_b2_desc: "Holdings above six hectares of good land are seized and given to landless families.\n\n§gDecree No. 8, Nov 1978.§!"
 COLDWAR_AFG_khalq_b2f: "Peasant Cooperatives"
 COLDWAR_AFG_khalq_b2f_desc: "New owners are grouped into cooperatives that share water, oxen and tractors.\n\n§gCooperatives 1979.§!"
 COLDWAR_AFG_khalq_b2f_tb: "Peasant Cooperatives"
 COLDWAR_AFG_khalq_c1: "Amin's Security Service"
 COLDWAR_AFG_khalq_c1_desc: "AGSA arrests Parchamis, mullahs and khans alike. Fear keeps the revolution in power.\n\n§gAGSA 1978-79.§!"
 COLDWAR_AFG_khalq_c2: "Unite the Two Wings"
 COLDWAR_AFG_khalq_c2_desc: "Khalq brings Parcham back into the government rather than into prison.\n\n§g1977 reunification.§!"
 COLDWAR_AFG_khalq_cap: "The Revolution of Saur"
 COLDWAR_AFG_khalq_cap_desc: "The revolution has survived its first year. Its enemies are many, but so are its guns.\n\n§gDRA 1978-79.§!"
 COLDWAR_AFG_khalq_cap_tb: "The Revolution of Saur"
 COLDWAR_AFG_khalq_cm: "Defence of the Revolution"
 COLDWAR_AFG_khalq_cm_desc: "Party militias and the army defend the revolution in the provinces.\n\n§gRevolution defence groups 1979.§!"
 COLDWAR_AFG_khalq_d1: "Plead for Soviet Brigades"
 COLDWAR_AFG_khalq_d1_desc: "Taraki asks Moscow for Soviet troops in Afghan uniforms.\n\n§gTaraki's requests, March 1979.§!"
 COLDWAR_AFG_khalq_d2: "Khalq Stands Alone"
 COLDWAR_AFG_khalq_d2_desc: "The revolution will defend itself with Afghan soldiers.\n\n§gAmin's distrust of Moscow, 1979.§!"
 COLDWAR_AFG_khalq_dm: "The Democratic Republic"
 COLDWAR_AFG_khalq_dm_desc: "Socialist states recognise and fund the Democratic Republic of Afghanistan.\n\n§gDRA from April 1978.§!"
 COLDWAR_AFG_khalq_dm_tb: "The Democratic Republic"
 COLDWAR_AFG_khalq_e: "The Masses"
 COLDWAR_AFG_khalq_e_desc: "Khalq, the PDPA's Pashtun rural wing, wants a revolution, not a front with the feudal class.\n\n§gKhalq newspaper 1966; Taraki and Amin.§!"
 COLDWAR_AFG_khalq_e_tb: "The Masses"
 COLDWAR_AFG_khalq_eco: "Bread, Clothing, Shelter"
 COLDWAR_AFG_khalq_eco_desc: "The poor peasant must eat before he can learn socialism.\n\n§gKor, Kali, Dodai, 1978.§!"
 COLDWAR_AFG_khalq_eco_tb: "Bread, Clothing, Shelter"
 COLDWAR_AFG_khalq_em: "The Revolutionary Five-Year Plan"
 COLDWAR_AFG_khalq_em_desc: "Soviet planners help write a plan for the new republic.\n\n§gFirst Five-Year Plan of the DRA.§!"
 COLDWAR_AFG_khalq_em_tb: "The Revolutionary Five-Year Plan"
 COLDWAR_AFG_khalq_pm: "The Great Teacher"
 COLDWAR_AFG_khalq_pm_desc: "Taraki's portrait hangs in every office and his books in every school.\n\n§gTaraki personality cult 1978-79.§!"
 COLDWAR_AFG_khalq_pol: "The Officer Cells"
 COLDWAR_AFG_khalq_pol_desc: "Amin's men in the armoured brigades and the air force are the party's real strength.\n\n§gKhalqi army cells 1973-78.§!"
 COLDWAR_AFG_khalq_pol_tb: "The Officer Cells"
 COLDWAR_AFG_khalq_tree_shortcut: "PDPA (Khalq)"
 COLDWAR_AFG_kuwait_fund: "Kuwait Fund and Gulf Credit"
 COLDWAR_AFG_kuwait_fund_partner: "Kuwait Fund and Gulf Credit"
 COLDWAR_AFG_land_agbank: "The Agricultural Bank"
 COLDWAR_AFG_land_agbank_desc: "Seed, credit and fertiliser for smallholders, so that they need neither the moneylender nor the poppy.\n\n§gAgricultural Development Bank.§!"
 COLDWAR_AFG_land_convoys: "Emergency Grain Convoys"
 COLDWAR_AFG_land_convoys_desc: "Army trucks carry grain over passes that the ministries had never visited.\n\n§g1971-72 relief failures.§!"
 COLDWAR_AFG_land_convoys_tb: "Emergency Grain Convoys"
 COLDWAR_AFG_land_drain: "Drain the Saline Fields"
 COLDWAR_AFG_land_drain_desc: "Drains and new channels save the Marja and Nad-e Ali settlements. Engineers leave other projects for it.\n\n§gHAVA drainage problem.§!"
 COLDWAR_AFG_land_drain_tb: "Drain the Saline Fields"
 COLDWAR_AFG_land_fodder: "Fodder for the Flocks"
 COLDWAR_AFG_land_fodder_desc: "Three quarters of the sheep died in the drought. The karakul trade dies with them unless the flocks are fed.\n\n§gLivestock losses 1971.§!"
 COLDWAR_AFG_land_fodder_tb: "Fodder for the Flocks"
 COLDWAR_AFG_land_ghor: "The Ghor Relief Commission"
 COLDWAR_AFG_land_ghor_desc: "A standing commission so that the next famine is met in weeks, not seasons.\n\n§gFamine relief reorganisation.§!"
 COLDWAR_AFG_land_ghor_tb: "The Ghor Relief Commission"
 COLDWAR_AFG_land_granaries: "Granaries of the Provinces"
 COLDWAR_AFG_land_granaries_desc: "Silos in every province hold a year's grain. The drought is over and the state has learned from it.\n\n§gGood harvests from 1973.§!"
 COLDWAR_AFG_land_hava: "The Helmand Valley Authority"
 COLDWAR_AFG_land_hava_desc: "The American-built canals of the Helmand irrigate new farms and salt old ones.\n\n§gHAVA, salinisation (Wikipedia: HAVA).§!"
 COLDWAR_AFG_land_hava_tb: "The Helmand Valley Authority"
 COLDWAR_AFG_land_kajaki: "Finish Kajaki Power"
 COLDWAR_AFG_land_kajaki_desc: "Turbines in the Kajaki dam power Kandahar. The water goes to electricity before the fields.\n\n§gKajaki hydro request 1970 (FRUS d.333).§!"
 COLDWAR_AFG_land_kajaki_tb: "Finish Kajaki Power"
 COLDWAR_AFG_land_nangarhar: "The Nangarhar Canal"
 COLDWAR_AFG_land_nangarhar_desc: "Soviet-built canals and state farms make Jalalabad a garden of citrus and olives.\n\n§gNangarhar Valley Project 1960s.§!"
 COLDWAR_AFG_land_nangarhar_tb: "The Nangarhar Canal"
 COLDWAR_AFG_land_poppy_eradicate: "Eradicate the Poppy"
 COLDWAR_AFG_land_poppy_eradicate_desc: "Badakhshan and Helmand grow a hundred tonnes of opium. Eradication pleases donors and enrages growers.\n\n§gPoppy talks with USA 1976 (FRUS E-8).§!"
 COLDWAR_AFG_land_poppy_eradicate_tb: "Eradicate the Poppy"
 COLDWAR_AFG_land_poppy_tax: "Tax the Poppy Quietly"
 COLDWAR_AFG_land_poppy_tax_desc: "Officials take a share of the poppy trade and send some of it to Kabul. Everyone knows and no one says.\n\n§gOpium c. 100 t a year in the 1970s.§!"
 COLDWAR_AFG_land_poppy_tax_tb: "Tax the Poppy Quietly"
 COLDWAR_AFG_land_root: "Bread Before Politics"
 COLDWAR_AFG_land_root_desc: "The rains have failed for a second year. Whatever else Kabul does, it must feed Ghor and Bamyan.\n\n§gDrought 1969-72; famine in Ghor (FRUS d.353).§!"
 COLDWAR_AFG_land_root_tb: "Bread Before Politics"
 COLDWAR_AFG_land_tree_shortcut: "Land and Water"
 COLDWAR_AFG_liberation_front: "The National Liberation Front"
 COLDWAR_AFG_licensed_parties: "The Licensed Parties"
 COLDWAR_AFG_limited_contingent: "The Limited Contingent"
 COLDWAR_AFG_limited_contingent_partner: "The Limited Contingent"
 COLDWAR_AFG_mashhad_railway: "The Herat-Mashhad Railway"
 COLDWAR_AFG_mashhad_railway_partner: "The Herat-Mashhad Railway"
 COLDWAR_AFG_mellat_a1: "Maiwandwal's Way: Parliament First"
 COLDWAR_AFG_mellat_a1_desc: "Govern through coalitions in the Jirga and win the next election honestly.\n\n§gMaiwandwal's parliamentary strategy.§!"
 COLDWAR_AFG_mellat_a1_tb: "Maiwandwal's Way: Parliament First"
 COLDWAR_AFG_mellat_a1f: "Free Press and Free Unions"
 COLDWAR_AFG_mellat_a1f_desc: "Newspapers are licensed by law, not by ministers, and workers may organise.\n\n§gPress law 1965.§!"
 COLDWAR_AFG_mellat_a1f_tb: "Free Press and Free Unions"
 COLDWAR_AFG_mellat_a2: "Farhad's Way: A Pashtun Nation-State"
 COLDWAR_AFG_mellat_a2_desc: "Pashto in every office and school, and the lost lands beyond the Durand Line as the nation's cause.\n\n§gAfghan Mellat nationalism; Ghulam Mohammad Farhad.§!"
 COLDWAR_AFG_mellat_a2_tb: "Farhad's Way: A Pashtun Nation-State"
 COLDWAR_AFG_mellat_a2f: "Pashto, Language of State"
 COLDWAR_AFG_mellat_a2f_desc: "Pashto becomes the language of the army, the courts and the ministries.\n\n§gPashto Tolana, state Pashtunisation.§!"
 COLDWAR_AFG_mellat_a2f_tb: "Pashto, Language of State"
 COLDWAR_AFG_mellat_b1: "Land and Tax Reform"
 COLDWAR_AFG_mellat_b1_desc: "A land registry, a progressive land tax and loans for smallholders.\n\n§gThird Plan land survey.§!"
 COLDWAR_AFG_mellat_b1_tb: "Land and Tax Reform"
 COLDWAR_AFG_mellat_b1f: "The Land Survey"
 COLDWAR_AFG_mellat_b1f_desc: "Surveyors map every field so that the tax falls on the khan, not the tenant.\n\n§gCadastral survey projects.§!"
 COLDWAR_AFG_mellat_b1f_tb: "The Land Survey"
 COLDWAR_AFG_mellat_b2: "A Mixed Economy"
 COLDWAR_AFG_mellat_b2_desc: "Public works, private mills and foreign partners in joint companies.\n\n§gMixed economy model of the 1960s.§!"
 COLDWAR_AFG_mellat_b2_tb: "A Mixed Economy"
 COLDWAR_AFG_mellat_b2f: "Kabul Industrial Park"
 COLDWAR_AFG_mellat_b2f_desc: "Textile, cement and food plants around Pul-e Charkhi.\n\n§gPul-e Charkhi industrial area.§!"
 COLDWAR_AFG_mellat_b2f_tb: "Kabul Industrial Park"
 COLDWAR_AFG_mellat_c1: "Education Before Everything"
 COLDWAR_AFG_mellat_c1_desc: "Schools in every district and scholarships abroad for the best.\n\n§gExpansion of schooling 1960s-70s.§!"
 COLDWAR_AFG_mellat_c1_tb: "Education Before Everything"
 COLDWAR_AFG_mellat_c2: "The Aryana Heritage"
 COLDWAR_AFG_mellat_c2_desc: "The nation's ancient past, Aryana and Khorasan, becomes the school's first lesson.\n\n§gAryana cult; slot 21.§!"
 COLDWAR_AFG_mellat_c2_tb: "The Aryana Heritage"
 COLDWAR_AFG_mellat_cap: "The Democratic Kingdom"
 COLDWAR_AFG_mellat_cap_desc: "An elected cabinet governs, the parties compete and the courts are trusted.\n\n§gAlternative B1/B2.§!"
 COLDWAR_AFG_mellat_cap_tb: "The Democratic Kingdom"
 COLDWAR_AFG_mellat_cm: "Kabul University Autonomy"
 COLDWAR_AFG_mellat_cm_desc: "The university elects its own rector and runs its own budget.\n\n§gKabul University 1946.§!"
 COLDWAR_AFG_mellat_cm_tb: "Kabul University Autonomy"
 COLDWAR_AFG_mellat_d1: "Pashtunistan at the United Nations"
 COLDWAR_AFG_mellat_d1_desc: "Afghanistan takes the Pashtun question to the United Nations instead of the frontier.\n\n§gPashtunistan diplomacy 1947-70s.§!"
 COLDWAR_AFG_mellat_d1_tb: "Pashtunistan at the United Nations"
 COLDWAR_AFG_mellat_d2: "Western Partners"
 COLDWAR_AFG_mellat_d2_desc: "Bonn, Washington and the World Bank are the natural partners of a democratic Afghanistan.\n\n§gWestern aid orientation.§!"
 COLDWAR_AFG_mellat_d2_tb: "Western Partners"
 COLDWAR_AFG_mellat_dm: "A Democratic Example"
 COLDWAR_AFG_mellat_dm_desc: "Donors pay more to a government that holds honest elections.\n\n§gDonor conditionality.§!"
 COLDWAR_AFG_mellat_dm_tb: "A Democratic Example"
 COLDWAR_AFG_mellat_e: "Progressive Democracy"
 COLDWAR_AFG_mellat_e_desc: "Farhad's Afghan Mellat and Maiwandwal's progressives promise reform without revolution: parties, plans and a Pashto-speaking state.\n\n§gAfghan Mellat 1966; Maiwandwal's Progressive Democratic Party 1966.§!"
 COLDWAR_AFG_mellat_e_tb: "Progressive Democracy"
 COLDWAR_AFG_mellat_eco: "Evolutionary Socialism"
 COLDWAR_AFG_mellat_eco_desc: "Land and tax reform, state industry and a free press, but no class war.\n\n§gMaiwandwal, Progressive Democracy (Mosawat).§!"
 COLDWAR_AFG_mellat_eco_tb: "Evolutionary Socialism"
 COLDWAR_AFG_mellat_em: "The Planning Commission"
 COLDWAR_AFG_mellat_em_desc: "Planners trained in Bonn and Ann Arbor rewrite the Fourth Plan.\n\n§gMinistry of Planning.§!"
 COLDWAR_AFG_mellat_em_tb: "The Planning Commission"
 COLDWAR_AFG_mellat_pm: "The Progressive Cabinet"
 COLDWAR_AFG_mellat_pm_desc: "Reformers, technocrats and Pashtun nationalists in one government.\n\n§gAlternative B2.§!"
 COLDWAR_AFG_mellat_pm_tb: "The Progressive Cabinet"
 COLDWAR_AFG_mellat_pol: "A Cabinet Responsible to the Jirga"
 COLDWAR_AFG_mellat_pol_desc: "Ministers who answer to an elected majority, not to the palace.\n\n§gMaiwandwal government 1965-67.§!"
 COLDWAR_AFG_mellat_pol_tb: "A Cabinet Responsible to the Jirga"
 COLDWAR_AFG_mellat_tree_shortcut: "Afghan Mellat and the Progressives"
 COLDWAR_AFG_meters_category: "Kabul and the Provinces"
 COLDWAR_AFG_meters_category_desc: "State Reach: §Y[?COLDWAR_AFG_reach|0]§! of 100. From 25 tax income +3% and conscription +2%, from 50 +6% and +4% and the revolt falls by 0.25 a month, from 75 +10% and +6% and the revolt falls by 0.5 a month. The Great Drought lowers it by 0.5 a month.\nCountryside in Revolt: §Y[?COLDWAR_AFG_revolt|0]§! of 100. Bands at 25, 40, 60 and 80; from 40 the Mountain Front slows building and supply in Parwan, Kunar, Nangarhar and Paktia, Bamyan and Herat; from 60 The Exodus begins. Each Soviet contingent level adds 1 a month, The Great Drought 0.5, the supporters of the resistance up to 3 together. Stability above 60% without foreign support lowers it by 0.5 a month.\nRefugee step: §Y[?COLDWAR_AFG_refugees|0]§! of 3."
