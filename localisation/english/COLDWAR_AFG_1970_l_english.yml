 COLDWAR_AFG_offer_responses: "Proposals From Kabul"
 COLDWAR_AFG_offer_responses_desc: "Standing agreements proposed by Afghanistan. They hold while neither side is at war with the other or imposes an embargo or sanctions on it, are suspended otherwise and return without new payments."
 COLDWAR_AFG_offer_same_government_tt: "The Afghan government that made the offer is still in office"
 COLDWAR_AFG_offer_sender_tt: "The offer came from the government of Afghanistan that still holds Kabul"
 COLDWAR_AFG_officer_training: "Officer Training in the Soviet Union"
 COLDWAR_AFG_officer_training_partner: "Officer Training in the Soviet Union"
 COLDWAR_AFG_open_balance_tt: "The §YMoscow-Washington balance§! starts at the centre. Soviet agreements move it toward Moscow, American, Pakistani, Iranian and Saudi agreements toward Washington."
 COLDWAR_AFG_open_reach_tt: "Opens the §YState Reach§! meter at §Y25§! of 100. Its bands raise tax income and conscription and calm the countryside; The Great Drought lowers it by 0.5 every month."
 COLDWAR_AFG_pak_refugee_host: "Host of the Afghan Refugees"
 COLDWAR_AFG_pakistani_sanctuary: "Pakistani Sanctuary"
 COLDWAR_AFG_pakistani_sanctuary_partner: "Pakistani Sanctuary"
 COLDWAR_AFG_paktia_project: "The Paktia Development Project"
 COLDWAR_AFG_paktia_project_partner: "The Paktia Development Project"
 COLDWAR_AFG_palace_secretariat: "The Palace Secretariat"
 COLDWAR_AFG_paralysed_jirga: "The Paralysed Jirga"
 COLDWAR_AFG_paralysed_jirga_desc: "This national spirit will §GChange§! into §YThe Licensed Parties§! if we complete the §YSign the Parties Law§! focus.\nThis national spirit will be §GRemoved§! if we complete one of the focuses §YRule from Above§! or §YA Cabinet Responsible to the Jirga§!."
 COLDWAR_AFG_parcham_a1: "A Broad National Front"
 COLDWAR_AFG_parcham_a1_desc: "Non-party ministers and respected elders sit beside the party in the cabinet.\n\n§gNational Fatherland Front, 1981.§!"
 COLDWAR_AFG_parcham_a1_tb: "A Broad National Front"
 COLDWAR_AFG_parcham_a1f: "The Fundamental Principles"
 COLDWAR_AFG_parcham_a1f_desc: "An interim constitution invokes Islam, the flag regains its green and the mosques are repaired with state money.\n\n§gFundamental Principles, April 1980.§!"
 COLDWAR_AFG_parcham_a1f_tb: "The Fundamental Principles"
 COLDWAR_AFG_parcham_a2: "Vanguard Rule"
 COLDWAR_AFG_parcham_a2_desc: "The party decides, and the ministries and the army execute.\n\n§gPDPA Politburo rule 1978-86.§!"
 COLDWAR_AFG_parcham_a2_tb: "Vanguard Rule"
 COLDWAR_AFG_parcham_a2f: "State Security: KhAD"
 COLDWAR_AFG_parcham_a2f_desc: "A security service trained by the KGB hunts conspirators in the army and the bazaar.\n\n§gKhAD founded 1980.§!"
 COLDWAR_AFG_parcham_a2f_tb: "State Security: KhAD"
 COLDWAR_AFG_parcham_b1: "State Farms and Cooperatives"
 COLDWAR_AFG_parcham_b1_desc: "Machine stations and cooperatives replace the khan's credit and the khan's water.\n\n§gPDPA cooperative programme 1979-81.§!"
 COLDWAR_AFG_parcham_b1_tb: "State Farms and Cooperatives"
 COLDWAR_AFG_parcham_b1f: "Land Reform, Gradually"
 COLDWAR_AFG_parcham_b1f_desc: "Land is redistributed district by district, with water rights and credit attached.\n\n§gAmended land reform, 1981.§!"
 COLDWAR_AFG_parcham_b1f_tb: "Land Reform, Gradually"
 COLDWAR_AFG_parcham_b2: "Room for the Bazaar"
 COLDWAR_AFG_parcham_b2_desc: "Traders and small owners keep their shops if they keep the supply lines open.\n\n§gPrivate sector concessions, 1980s.§!"
 COLDWAR_AFG_parcham_b2_tb: "Room for the Bazaar"
 COLDWAR_AFG_parcham_b2f: "Soviet Gas Repricing"
 COLDWAR_AFG_parcham_b2f_desc: "A friendly Kabul asks Moscow for a fairer price for Sheberghan gas.\n\n§gGas price $100 vs $180 Soviet re-export (CS Monitor 1982).§!"
 COLDWAR_AFG_parcham_b2f_tb: "Soviet Gas Repricing"
 COLDWAR_AFG_parcham_c1: "Literacy for All"
 COLDWAR_AFG_parcham_c1_desc: "Classes for men and women in every village, whatever the mullah says.\n\n§g1978-79 literacy campaign; Herat uprising 1979.§!"
 COLDWAR_AFG_parcham_c1_tb: "Literacy for All"
 COLDWAR_AFG_parcham_c2: "Respect the Mosque"
 COLDWAR_AFG_parcham_c2_desc: "A ministry of religious affairs pays the imams and the party attends Friday prayer.\n\n§gDepartment of Islamic Affairs, 1980s.§!"
 COLDWAR_AFG_parcham_c2_tb: "Respect the Mosque"
 COLDWAR_AFG_parcham_cap: "The Revolution Consolidated"
 COLDWAR_AFG_parcham_cap_desc: "The party rules from Kabul to the provincial towns, and the front gives it a face the villages accept.\n\n§gPDPA consolidation, alternative.§!"
 COLDWAR_AFG_parcham_cm: "The Democratic Women's Organisation"
 COLDWAR_AFG_parcham_cm_desc: "Women teachers, doctors and officials become the regime's most loyal cadre in the cities.\n\n§gDOAW founded 1965 by Anahita Ratebzad.§!"
 COLDWAR_AFG_parcham_cm_tb: "The Democratic Women's Organisation"
 COLDWAR_AFG_parcham_d1: "Request Soviet Advisers"
 COLDWAR_AFG_parcham_d1_desc: "Kabul asks Moscow for advisers in the army, the ministries and the party schools.\n\n§gSoviet advisers 1978-79.§!"
 COLDWAR_AFG_parcham_d2: "Keep the Soviets at Arm's Length"
 COLDWAR_AFG_parcham_d2_desc: "Afghan communists can govern Afghanistan without a Soviet adviser at every desk.\n\n§gKarmal's 1980s complaints about advisers.§!"
 COLDWAR_AFG_parcham_d2_tb: "Keep the Soviets at Arm's Length"
 COLDWAR_AFG_parcham_dm: "The Treaty of Friendship"
 COLDWAR_AFG_parcham_dm_desc: "A twenty-year treaty binds Kabul and Moscow in friendship, good-neighbourliness and cooperation.\n\n§gTreaty of 5 December 1978.§!"
 COLDWAR_AFG_parcham_e: "The Banner"
 COLDWAR_AFG_parcham_e_desc: "Parcham, the PDPA's urban wing, wants a broad national-democratic front that can rule with Soviet help.\n\n§gParcham weekly 1968-69; Karmal elected for Kabul 1969.§!"
 COLDWAR_AFG_parcham_e_tb: "The Banner"
 COLDWAR_AFG_parcham_eco: "The Non-Capitalist Path"
 COLDWAR_AFG_parcham_eco_desc: "State industry leads, cooperatives follow, and the bazaar is tolerated for now.\n\n§gPDPA programme 1966.§!"
 COLDWAR_AFG_parcham_eco_tb: "The Non-Capitalist Path"
 COLDWAR_AFG_parcham_em: "CMEA Specialists"
 COLDWAR_AFG_parcham_em_desc: "Engineers from Moscow, Prague and Berlin staff the plants and the polytechnic.\n\n§gEastern bloc technical aid, 1980s.§!"
 COLDWAR_AFG_parcham_em_tb: "CMEA Specialists"
 COLDWAR_AFG_parcham_pm: "The Revolutionary Council"
 COLDWAR_AFG_parcham_pm_desc: "A council of party, army and front leaders becomes the supreme organ of state.\n\n§gRevolutionary Council 1978-87.§!"
 COLDWAR_AFG_parcham_pm_tb: "The Revolutionary Council"
 COLDWAR_AFG_parcham_pol: "National Democracy"
 COLDWAR_AFG_parcham_pol_desc: "First the feudal order, then socialism. The front must include patriotic officers, clerics and merchants.\n\n§gSoviet 'national democracy' doctrine.§!"
 COLDWAR_AFG_parcham_pol_tb: "National Democracy"
 COLDWAR_AFG_parcham_tree_shortcut: "PDPA (Parcham)"
 COLDWAR_AFG_parcham_x1: "Najibullah Takes the Party"
 COLDWAR_AFG_parcham_x1_desc: "The former head of KhAD replaces Karmal. He knows every informer and every commander who can be bought.\n\n§gNajibullah general secretary, May 1986.§!"
 COLDWAR_AFG_parcham_x1_tb: "Najibullah Takes the Party"
 COLDWAR_AFG_parcham_x2: "The Limited Contingent"
 COLDWAR_AFG_parcham_x2_desc: "Kabul asks Moscow for Soviet divisions to hold the cities and the roads.\n\n§gKabul's requests of 1979; Soviet entry 27 Dec 1979.§!"
 COLDWAR_AFG_party_list_jirga: "The Party-List Elections of 1973"
 COLDWAR_AFG_parwan_canal: "The Parwan Irrigation Canal"
 COLDWAR_AFG_parwan_canal_partner: "The Parwan Irrigation Canal"
 COLDWAR_AFG_pashtunistan_campaign: "Pashtunistan Campaign"
 COLDWAR_AFG_pashtunistan_diplomacy: "Pashtunistan at the UN"
 COLDWAR_AFG_pashtunistan_question: "The Pashtunistan Question"
 COLDWAR_AFG_pashtunistan_question_desc: "This national spirit will §GChange§! into §YPashtunistan Campaign§! if we complete the §YPashtunistan Pressed§! focus.\nThis national spirit will §GChange§! into §YPashtunistan at the UN§! if we complete the §YPashtunistan at the United Nations§! focus.\nThis national spirit will §GChange§! into §YA Quieter Frontier§! if we complete the §YTransit through Karachi§! focus.\nThis national spirit will be §GRemoved§! if we complete the §YTalks with Bhutto§! focus."
 COLDWAR_AFG_pashtunistan_question_softened: "A Quieter Frontier"
