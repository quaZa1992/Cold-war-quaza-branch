 COLDWAR_AFG_revolution_consolidated: "The Revolution Consolidated"
 COLDWAR_AFG_ruined_countryside: "The Ruined Countryside"
 COLDWAR_AFG_ruined_countryside_desc: "This national spirit will be §GRemoved§! if we complete the focus §YThe Agricultural Bank§!."
 COLDWAR_AFG_ruined_remains_tt: "If Scorched Earth was chosen, The Ruined Countryside remains."
 COLDWAR_AFG_saudi_benefactor: "The Saudi Benefactor"
 COLDWAR_AFG_saudi_benefactor_partner: "The Saudi Benefactor"
 COLDWAR_AFG_saudi_loan: "Saudi Development Loan"
