 # IMPERIA COLD WAR — Afghanistan 1970 (generated by afg_build.py)
 COLDWAR_AFG.101.a: "We will study the terms."
 COLDWAR_AFG.101.d: "The government in Kabul proposes a standing agreement: Soviet Advisory Mission. Advisers in every Afghan ministry and regiment. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.101.t: "Soviet Advisory Mission"
 COLDWAR_AFG.102.a: "We will study the terms."
 COLDWAR_AFG.102.d: "The government in Kabul proposes a standing agreement: Treaty of Friendship and Good-Neighbourliness. A twenty-year treaty with a socialist neighbour. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.102.t: "Treaty of Friendship and Good-Neighbourliness"
 COLDWAR_AFG.103.a: "We will study the terms."
 COLDWAR_AFG.103.d: "The government in Kabul proposes a standing agreement: The Limited Contingent. Soviet divisions hold Afghan cities and roads. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.103.t: "The Limited Contingent"
 COLDWAR_AFG.104.a: "We will study the terms."
 COLDWAR_AFG.104.d: "The government in Kabul proposes a standing agreement: Soviet Brigades in Afghan Uniform. Soviet units with Afghan insignia guard Kabul. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.104.t: "Soviet Brigades in Afghan Uniform"
 COLDWAR_AFG.105.a: "We will study the terms."
 COLDWAR_AFG.105.d: "The government in Kabul proposes a standing agreement: Chinese Rural Development. Beijing's model for the Afghan countryside. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.105.t: "Chinese Rural Development"
 COLDWAR_AFG.106.a: "We will study the terms."
 COLDWAR_AFG.106.d: "The government in Kabul proposes a standing agreement: Pakistani Sanctuary. A friendly Islamist Afghanistan on Pakistan's flank. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.106.t: "Pakistani Sanctuary"
 COLDWAR_AFG.107.a: "We will study the terms."
 COLDWAR_AFG.107.d: "The government in Kabul proposes a standing agreement: Iranian Brotherhood. Persian-speaking allies in Herat. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.107.t: "Iranian Brotherhood"
 COLDWAR_AFG.108.a: "We will study the terms."
 COLDWAR_AFG.108.d: "The government in Kabul proposes a standing agreement: The ISI Arms Pipeline. Pakistan's intelligence service arms a loyal party. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.108.t: "The ISI Arms Pipeline"
 COLDWAR_AFG.109.a: "We will study the terms."
 COLDWAR_AFG.109.d: "The government in Kabul proposes a standing agreement: The Saudi Benefactor. Riyadh funds a pious Afghanistan. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.109.t: "The Saudi Benefactor"
 COLDWAR_AFG.110.a: "We will study the terms."
 COLDWAR_AFG.110.d: "The government in Kabul proposes a standing agreement: Iranian Patronage of the Shia. Tehran becomes patron of the Afghan Shia. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.110.t: "Iranian Patronage of the Shia"
 COLDWAR_AFG.111.a: "We will study the terms."
 COLDWAR_AFG.111.d: "The government in Kabul proposes a standing agreement: Sheberghan Gas Price Commission. Cheap Afghan gas for Soviet Central Asia, at a fairer price. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.111.t: "Sheberghan Gas Price Commission"
 COLDWAR_AFG.112.a: "We will study the terms."
 COLDWAR_AFG.112.d: "The government in Kabul proposes a standing agreement: Soviet Wheat and Credit. Grain for a hungry neighbour buys gratitude in Kabul. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.112.t: "Soviet Wheat and Credit"
 COLDWAR_AFG.113.a: "We will study the terms."
 COLDWAR_AFG.113.d: "The government in Kabul proposes a standing agreement: Five-Year Trade Agreement. Afghan fruit, cotton and wool for Soviet machines. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.113.t: "Five-Year Trade Agreement"
 COLDWAR_AFG.114.a: "We will study the terms."
 COLDWAR_AFG.114.d: "The government in Kabul proposes a standing agreement: Officer Training in the Soviet Union. Afghan officers trained in Soviet academies become Soviet friends. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.114.t: "Officer Training in the Soviet Union"
 COLDWAR_AFG.115.a: "We will study the terms."
 COLDWAR_AFG.115.d: "The government in Kabul proposes a standing agreement: PL-480 Wheat Grant. American surplus wheat feeds Afghanistan and sells American goodwill. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.115.t: "PL-480 Wheat Grant"
 COLDWAR_AFG.116.a: "We will study the terms."
 COLDWAR_AFG.116.d: "The government in Kabul proposes a standing agreement: Helmand Delta and Kajaki Project. USAID finishes the Helmand scheme it began. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.116.t: "Helmand Delta and Kajaki Project"
 COLDWAR_AFG.117.a: "We will study the terms."
 COLDWAR_AFG.117.d: "The government in Kabul proposes a standing agreement: Peace Corps Teachers. Volunteers teach English, science and nursing in Afghan towns. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.117.t: "Peace Corps Teachers"
 COLDWAR_AFG.118.a: "We will study the terms."
 COLDWAR_AFG.118.d: "The government in Kabul proposes a standing agreement: Poppy Eradication Programme. Washington wants less Afghan opium on the world market. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.118.t: "Poppy Eradication Programme"
 COLDWAR_AFG.119.a: "We will study the terms."
 COLDWAR_AFG.119.d: "The government in Kabul proposes a standing agreement: Afghan Transit Trade Agreement. Karachi port and Pakistani railways carry Afghan trade. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.119.t: "Afghan Transit Trade Agreement"
 COLDWAR_AFG.120.a: "We will study the terms."
 COLDWAR_AFG.120.d: "The government in Kabul proposes a standing agreement: The Spirit of Kabul. Peace on the frontier and an end to support for each other's rebels. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.120.t: "The Spirit of Kabul"
 COLDWAR_AFG.121.a: "We will study the terms."
 COLDWAR_AFG.121.d: "The government in Kabul proposes a standing agreement: Helmand Water Treaty. Sistan's farms get guaranteed Helmand water. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.121.t: "Helmand Water Treaty"
 COLDWAR_AFG.122.a: "We will study the terms."
 COLDWAR_AFG.122.d: "The government in Kabul proposes a standing agreement: Iranian Development Credit. The Shah buys a friendly, non-Soviet neighbour. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.122.t: "Iranian Development Credit"
 COLDWAR_AFG.123.a: "We will study the terms."
 COLDWAR_AFG.123.d: "The government in Kabul proposes a standing agreement: The Herat-Mashhad Railway. A railway from Mashhad to Herat ties Afghan trade to Iranian ports. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.123.t: "The Herat-Mashhad Railway"
 COLDWAR_AFG.124.a: "We will study the terms."
 COLDWAR_AFG.124.d: "The government in Kabul proposes a standing agreement: Indian Technical Assistance. India gains a friend on Pakistan's western border. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.124.t: "Indian Technical Assistance"
 COLDWAR_AFG.125.a: "We will study the terms."
 COLDWAR_AFG.125.d: "The government in Kabul proposes a standing agreement: Officer Training in India. Indian academies train Afghan officers. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.125.t: "Officer Training in India"
 COLDWAR_AFG.126.a: "We will study the terms."
 COLDWAR_AFG.126.d: "The government in Kabul proposes a standing agreement: The Paktia Development Project. Bonn's largest aid project in Asia. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.126.t: "The Paktia Development Project"
 COLDWAR_AFG.127.a: "We will study the terms."
 COLDWAR_AFG.127.d: "The government in Kabul proposes a standing agreement: Police Training Mission. German instructors train the Afghan police. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.127.t: "Police Training Mission"
 COLDWAR_AFG.128.a: "We will study the terms."
 COLDWAR_AFG.128.d: "The government in Kabul proposes a standing agreement: The Parwan Irrigation Canal. Chinese engineers build a canal in Parwan. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.128.t: "The Parwan Irrigation Canal"
 COLDWAR_AFG.129.a: "We will study the terms."
 COLDWAR_AFG.129.d: "The government in Kabul proposes a standing agreement: Interest-Free Chinese Credit. Beijing courts Kabul away from Moscow. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.129.t: "Interest-Free Chinese Credit"
 COLDWAR_AFG.130.a: "We will study the terms."
 COLDWAR_AFG.130.d: "The government in Kabul proposes a standing agreement: Saudi Development Loan. Riyadh supports a Muslim neighbour against Soviet influence. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.130.t: "Saudi Development Loan"
 COLDWAR_AFG.131.a: "We will study the terms."
 COLDWAR_AFG.131.d: "The government in Kabul proposes a standing agreement: Kuwait Fund and Gulf Credit. Gulf money for Afghan development. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.131.t: "Kuwait Fund and Gulf Credit"
 COLDWAR_AFG.132.a: "We will study the terms."
 COLDWAR_AFG.132.d: "The government in Kabul proposes a standing agreement: The Geneva Accords. Non-interference, refugee return, Soviet withdrawal timetable. Its envoys wait for our answer in the decisions menu for 90 days."
 COLDWAR_AFG.132.t: "The Geneva Accords"
