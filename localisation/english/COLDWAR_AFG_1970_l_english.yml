 COLDWAR_AFG_shia_patronage_partner: "Iranian Patronage of the Shia"
 COLDWAR_AFG_shia_unity: "The Unity of the Shia"
 COLDWAR_AFG_soviet_advisory_mission: "Soviet Advisory Mission"
 COLDWAR_AFG_soviet_advisory_mission_partner: "Soviet Advisory Mission"
 COLDWAR_AFG_soviet_arsenal: "A Soviet Arsenal"
 COLDWAR_AFG_soviet_arsenal_desc: "This national spirit will be §GRemoved§! if we complete the focus §YA National Army§!."
 COLDWAR_AFG_soviet_brigades: "Soviet Brigades in Afghan Uniform"
 COLDWAR_AFG_soviet_brigades_partner: "Soviet Brigades in Afghan Uniform"
 COLDWAR_AFG_soviet_troops_tt: "Soviet troops are in Afghanistan (Limited Contingent or Soviet Brigades agreement active)"
 COLDWAR_AFG_soviet_wheat: "Soviet Wheat and Credit"
 COLDWAR_AFG_soviet_wheat_partner: "Soviet Wheat and Credit"
 COLDWAR_AFG_spirit_of_kabul: "The Spirit of Kabul"
 COLDWAR_AFG_spirit_of_kabul_partner: "The Spirit of Kabul"
 COLDWAR_AFG_state_census: "Census and Land Survey"
 COLDWAR_AFG_state_census_desc: "Count the people and map the fields. The khans know what follows a census.\n\n§g1979 census attempt.§!"
 COLDWAR_AFG_state_census_tb: "Census and Land Survey"
 COLDWAR_AFG_state_courts: "District Courts"
 COLDWAR_AFG_state_courts_desc: "Trained judges in every district apply the law of 1964.\n\n§gJudicial reform.§!"
 COLDWAR_AFG_state_courts_tb: "District Courts"
 COLDWAR_AFG_state_faculties_us: "Faculties with America"
 COLDWAR_AFG_state_faculties_us_desc: "Columbia, Wyoming and Nebraska staff the faculties. The Islamists recruit in the same hostels.\n\n§gUS university contracts.§!"
 COLDWAR_AFG_state_faculties_us_tb: "Faculties with America"
 COLDWAR_AFG_state_final: "A State for All Afghans"
 COLDWAR_AFG_state_final_desc: "Roads, courts and schools reach every province. The state is no longer a guest in its own country.\n\n§gGoal.§!"
 COLDWAR_AFG_state_governors: "Governors from Kabul"
 COLDWAR_AFG_state_governors_desc: "Governors trained in Kabul, rotated every three years, replace the local khans in office.\n\n§gProvincial administration.§!"
 COLDWAR_AFG_state_governors_tb: "Governors from Kabul"
 COLDWAR_AFG_state_khans: "Leave the Khans Their Due"
 COLDWAR_AFG_state_khans_desc: "Govern through the khans, pay them for order and ask little in tax.\n\n§gTraditional indirect rule.§!"
 COLDWAR_AFG_state_khans_tb: "Leave the Khans Their Due"
 COLDWAR_AFG_state_modifier: "The Afghan State"
 COLDWAR_AFG_state_modifier_desc: "The lasting results of our national focuses for the afghan state."
 COLDWAR_AFG_state_polytechnic: "The Polytechnic with Moscow"
 COLDWAR_AFG_state_polytechnic_desc: "Soviet professors train engineers. Their students also learn Marxism.\n\n§gKabul Polytechnic, Soviet-built 1967.§!"
 COLDWAR_AFG_state_polytechnic_tb: "The Polytechnic with Moscow"
 COLDWAR_AFG_state_ringroad: "Close the Ring Road"
 COLDWAR_AFG_state_ringroad_desc: "The Soviet north and the American south meet in a single road around the Hindu Kush.\n\n§gRing road; Salang tunnel 1964.§!"
 COLDWAR_AFG_state_root: "Hukumat: The Reach of Kabul"
 COLDWAR_AFG_state_root_desc: "Outside the cities the government is a governor, a garrison and a tax it rarely collects. The tribes keep their own law.\n\n§gState reach in 1970.§!"
 COLDWAR_AFG_state_root_tb: "Hukumat: The Reach of Kabul"
 COLDWAR_AFG_state_schools: "Village Schools"
 COLDWAR_AFG_state_schools_desc: "A school in every village of more than a hundred families.\n\n§gPrimary school expansion.§!"
 COLDWAR_AFG_state_schools_tb: "Village Schools"
 COLDWAR_AFG_state_tree_shortcut: "State"
 COLDWAR_AFG_state_university: "Kabul University"
 COLDWAR_AFG_state_university_desc: "Ten thousand students, faculties funded by four countries, and every political current of the age.\n\n§gKabul University; student unrest 1968-69.§!"
 COLDWAR_AFG_state_women: "Women in the Ministries"
 COLDWAR_AFG_state_women_desc: "Since 1959 women may work unveiled. Now they run hospitals, schools and departments.\n\n§g1959 unveiling; 1964 equality clause.§!"
 COLDWAR_AFG_state_women_tb: "Women in the Ministries"
 COLDWAR_AFG_stingers: "Stingers in the Mountains"
 COLDWAR_AFG_support_china: "Chinese Arms via Pakistan"
 COLDWAR_AFG_support_china_desc: "Rifles and rockets against Soviet encirclement, shipped through the Karakoram. Chinese support for the mujahideen."
 COLDWAR_AFG_support_china_end: "End: Chinese Arms via Pakistan"
 COLDWAR_AFG_support_china_end_desc: "We stop the support. Nothing already delivered can be recalled."
 # IMPERIA COLD WAR — B9 MD standard: running cost shown the MD way (weekly budget), no % of GDP
 COLDWAR_AFG_support_china_tt: "Weekly cost: booked in our weekly budget while the support continues. In Afghanistan the Countryside in Revolt rises by §R0.50§! a month (all supporters together at most §R3§! a month)."
 COLDWAR_AFG_support_cyclone: "Operation Cyclone"
 COLDWAR_AFG_support_cyclone_desc: "Arms and money for the Afghan resistance through Pakistan's intelligence service. Operation Cyclone; $6-12bn with Saudi and Chinese aid."
 COLDWAR_AFG_support_cyclone_end: "End: Operation Cyclone"
 COLDWAR_AFG_support_cyclone_end_desc: "We stop the support. Nothing already delivered can be recalled."
 # IMPERIA COLD WAR — B9 MD standard: running cost shown the MD way (weekly budget), no % of GDP
 COLDWAR_AFG_support_cyclone_tt: "Weekly cost: booked in our weekly budget while the support continues. In Afghanistan the Countryside in Revolt rises by §R1§! a month (all supporters together at most §R3§! a month)."
 COLDWAR_AFG_support_egypt: "Egyptian Arms Stocks"
 COLDWAR_AFG_support_egypt_desc: "Soviet-made weapons from Egyptian depots, untraceable to Washington."
 COLDWAR_AFG_support_egypt_tt: "In Afghanistan: the Countryside in Revolt rises by §R3§!."
 COLDWAR_AFG_support_isi: "ISI Sanctuary and Training"
 COLDWAR_AFG_support_isi_desc: "Camps, arms depots and training near Peshawar and Quetta. ISI role in the Afghan war."
 COLDWAR_AFG_support_isi_end: "End: ISI Sanctuary and Training"
 COLDWAR_AFG_support_isi_end_desc: "We stop the support. Nothing already delivered can be recalled."
