 COLDWAR_AFG_saudi_match: "Dollar for Dollar"
 COLDWAR_AFG_saur_revolution: "The Revolution of Saur"
 COLDWAR_AFG_setam_a1: "Provincial Councils"
 COLDWAR_AFG_setam_a1_desc: "Elected councils in every province, as the constitution promised and never delivered.\n\n§g1964 constitution, provincial councils.§!"
 COLDWAR_AFG_setam_a1_tb: "Provincial Councils"
 COLDWAR_AFG_setam_a1f: "Pashto and Dari, Uzbek and Hazaragi"
 COLDWAR_AFG_setam_a1f_desc: "Schools teach in the mother tongue first and the state language second.\n\n§gMinority-language education demands.§!"
 COLDWAR_AFG_setam_a1f_tb: "Pashto and Dari, Uzbek and Hazaragi"
 COLDWAR_AFG_setam_a2: "The People's War"
 COLDWAR_AFG_setam_a2_desc: "The Sholais say that only a peasants' war in the mountains will free the nationalities.\n\n§gShola-e Javid Maoism.§!"
 COLDWAR_AFG_setam_a2_tb: "The People's War"
 COLDWAR_AFG_setam_a2f: "Mountain Bases of Badakhshan"
 COLDWAR_AFG_setam_a2f_desc: "Badakhshan's valleys become the base of a movement that cannot be crushed from Kabul.\n\n§gBadakhshan as Setam stronghold.§!"
 COLDWAR_AFG_setam_a2f_tb: "Mountain Bases of Badakhshan"
 COLDWAR_AFG_setam_b1: "Cooperatives of the North"
 COLDWAR_AFG_setam_b1_desc: "Uzbek and Tajik farmers pool land and water against the Pashtun khans settled in the north.\n\n§gNorthern land disputes.§!"
 COLDWAR_AFG_setam_b1_tb: "Cooperatives of the North"
 COLDWAR_AFG_setam_b1f: "Northern Machine Stations"
 COLDWAR_AFG_setam_b1f_desc: "Tractors and pumps for the northern cooperatives.\n\n§gMachine-tractor stations.§!"
 COLDWAR_AFG_setam_b1f_tb: "Northern Machine Stations"
 COLDWAR_AFG_setam_b2: "The Oxus Trade"
 COLDWAR_AFG_setam_b2_desc: "Trade across the Amu Darya with Soviet Central Asia, under northern control.\n\n§gTermez-Hairatan trade.§!"
 COLDWAR_AFG_setam_b2f: "The Hairatan Port"
 COLDWAR_AFG_setam_b2f_desc: "A river port and depot on the Amu Darya opens the north to Soviet trade.\n\n§gHairatan port, later bridge 1982.§!"
 COLDWAR_AFG_setam_b2f_tb: "The Hairatan Port"
 COLDWAR_AFG_setam_c1: "Ethnic Quotas in the State"
 COLDWAR_AFG_setam_c1_desc: "Ministries and officer schools take recruits by nationality.\n\n§gSetam demand for parity.§!"
 COLDWAR_AFG_setam_c1_tb: "Ethnic Quotas in the State"
 COLDWAR_AFG_setam_c2: "Class Before Nation"
 COLDWAR_AFG_setam_c2_desc: "The Sholais insist that a Tajik landlord is no better than a Pashtun one.\n\n§gShola-e Javid line.§!"
 COLDWAR_AFG_setam_c2_tb: "Class Before Nation"
 COLDWAR_AFG_setam_cap: "A Federal Afghanistan"
 COLDWAR_AFG_setam_cap_desc: "Afghanistan becomes a federation of its peoples, poorer at the centre and stronger in its provinces.\n\n§gAlternative B7.§!"
 COLDWAR_AFG_setam_cap_tb: "A Federal Afghanistan"
 COLDWAR_AFG_setam_cm: "Badakhshi's Legacy"
 COLDWAR_AFG_setam_cm_desc: "The movement's founder becomes a symbol beyond any single party.\n\n§gTahir Badakhshi d. 1979.§!"
 COLDWAR_AFG_setam_cm_tb: "Badakhshi's Legacy"
 COLDWAR_AFG_setam_d1: "The Chinese Example"
 COLDWAR_AFG_setam_d1_desc: "Beijing's rural model and interest-free credit appeal to the Maoist wing.\n\n§gChinese aid; Sholai links to Maoism.§!"
 COLDWAR_AFG_setam_d2: "Neither Moscow nor Beijing"
 COLDWAR_AFG_setam_d2_desc: "The nationalities will owe nothing to any great power.\n\n§gSetam independence from Moscow.§!"
 COLDWAR_AFG_setam_d2_tb: "Neither Moscow nor Beijing"
 COLDWAR_AFG_setam_dm: "The Northern Front"
 COLDWAR_AFG_setam_dm_desc: "Militias of the northern peoples defend their valleys under one command.\n\n§gLater Junbish-e Milli, 1992.§!"
 COLDWAR_AFG_setam_dm_tb: "The Northern Front"
 COLDWAR_AFG_setam_e: "The Nationalities' Question"
 COLDWAR_AFG_setam_e_desc: "Tajiks, Uzbeks and Hazaras say the real division in Afghanistan is between a Pashtun state and its other peoples.\n\n§gSetam-e Melli, Tahir Badakhshi, 1968.§!"
 COLDWAR_AFG_setam_eco: "The Northern Economy"
 COLDWAR_AFG_setam_eco_desc: "Gas, cotton and the Oxus trade belong to the north that produces them.\n\n§gNorthern gas and cotton.§!"
 COLDWAR_AFG_setam_eco_tb: "The Northern Economy"
 COLDWAR_AFG_setam_em: "Northern Gas for the North"
 COLDWAR_AFG_setam_em_desc: "A share of the gas revenue stays in the provinces that pump it.\n\n§gSheberghan gas.§!"
 COLDWAR_AFG_setam_pm: "A Coalition of the Peoples"
 COLDWAR_AFG_setam_pm_desc: "Setam, the Sholais and the Shia left form one front of the nationalities.\n\n§gLeft minority coalitions 1970s.§!"
 COLDWAR_AFG_setam_pm_tb: "A Coalition of the Peoples"
 COLDWAR_AFG_setam_pol: "Federal Equality"
 COLDWAR_AFG_setam_pol_desc: "Each nationality governs its own schools, courts and taxes inside one federal state.\n\n§gSetam-e Melli programme.§!"
 COLDWAR_AFG_setam_pol_tb: "Federal Equality"
 COLDWAR_AFG_setam_tree_shortcut: "Setam-e Melli and the Sholais"
 COLDWAR_AFG_sharia_faculty: "Scholars of the Sharia Faculty"
