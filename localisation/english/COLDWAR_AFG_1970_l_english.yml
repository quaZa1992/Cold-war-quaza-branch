 COLDWAR_AFG_support_mi6: "MI6 Training Teams"
 COLDWAR_AFG_support_mi6_desc: "Instructors and radios for selected commanders. UK MI6 support."
 COLDWAR_AFG_support_mi6_end: "End: MI6 Training Teams"
 COLDWAR_AFG_support_mi6_end_desc: "We stop the support. Nothing already delivered can be recalled."
 # IMPERIA COLD WAR — B9 MD standard: running cost shown the MD way (weekly budget), no % of GDP
 COLDWAR_AFG_support_mi6_tt: "Weekly cost: booked in our weekly budget while the support continues. In Afghanistan the Countryside in Revolt rises by §R0.50§! a month (all supporters together at most §R3§! a month)."
 COLDWAR_AFG_support_peshawar: "The Peshawar Seven"
 COLDWAR_AFG_support_peshawar_desc: "Unite the Sunni parties into one alliance under Pakistani patronage. Seven Party Mujahideen Alliance, May 1985."
 COLDWAR_AFG_support_peshawar_tt: "In Afghanistan: the Countryside in Revolt rises by §R5§!; the Muslim Youth, the University Jihadists and the Village Mullahs gain §Y2%§! popularity each."
 COLDWAR_AFG_support_possible_tt: "The Afghan countryside is in revolt (at least 25) and the Geneva Accords are not in force"
 COLDWAR_AFG_support_saudi: "Match the Americans"
 COLDWAR_AFG_support_saudi_desc: "Dollar for dollar with Washington, and money for the Arab volunteers. Saudi dollar-for-dollar match."
 COLDWAR_AFG_support_saudi_end: "End: Match the Americans"
 COLDWAR_AFG_support_saudi_end_desc: "We stop the support. Nothing already delivered can be recalled."
 # IMPERIA COLD WAR — B9 MD standard: running cost shown the MD way (weekly budget), no % of GDP
 COLDWAR_AFG_support_saudi_tt: "Weekly cost: booked in our weekly budget while the support continues. In Afghanistan the Countryside in Revolt rises by §R1§! a month (all supporters together at most §R3§! a month)."
 COLDWAR_AFG_support_stingers: "Stinger Missiles"
 COLDWAR_AFG_support_stingers_desc: "Shoulder-fired missiles for the mujahideen, from September 1986."
 COLDWAR_AFG_support_stingers_tt: "In Afghanistan: the Countryside in Revolt rises by §R5§!; Afghan air accidents §R+10%§! for two years."
 COLDWAR_AFG_support_tehran: "The Tehran Eight"
 COLDWAR_AFG_support_tehran_desc: "Revolutionary Guards arms and money for the Shia parties of the Hazarajat. Tehran Eight, IRGC supply."
 COLDWAR_AFG_support_tehran_end: "End: The Tehran Eight"
 COLDWAR_AFG_support_tehran_end_desc: "We stop the support. Nothing already delivered can be recalled."
 COLDWAR_AFG_support_tehran_parties: "Unite the Shia Parties"
 COLDWAR_AFG_support_tehran_parties_desc: "Bring the Shia parties of the Hazarajat into one council under Iranian patronage."
 COLDWAR_AFG_support_tehran_parties_tt: "In Afghanistan: the Hazara Shia parties gain §Y2%§! popularity each."
 # IMPERIA COLD WAR — B9 MD standard: running cost shown the MD way (weekly budget), no % of GDP
 COLDWAR_AFG_support_tehran_tt: "Weekly cost: booked in our weekly budget while the support continues. In Afghanistan the Countryside in Revolt rises by §R0.50§! a month (all supporters together at most §R3§! a month)."
 COLDWAR_AFG_supporter_cut_25_tt: "Foreign support for the resistance reaches the valleys §G25%§! less (all border measures together at most 75%)."
 COLDWAR_AFG_supporter_cut_50_tt: "Foreign support for the resistance reaches the valleys §G50%§! less (all border measures together at most 75%)."
 COLDWAR_AFG_tehran_patron: "Patron of the Tehran Eight"
 COLDWAR_AFG_ten_per_cent_1: "A Ten Per Cent Nation"
 COLDWAR_AFG_ten_per_cent_1_desc: "This national spirit will §GImprove§! if we complete one of the focuses §YLiteracy for All§!, §YPashto and Dari, Uzbek and Hazaragi§!, §YEducation Before Everything§!, §YMosque Schools§!, §YIslamic Education Ministry§!, §YThe Madrasa Network§!, §YShia Schools§!, §YKabul University§!, §YVillage Schools§! or §YA State for All Afghans§!."
 COLDWAR_AFG_ten_per_cent_2: "A Ten Per Cent Nation (Schools Opening)"
 COLDWAR_AFG_ten_per_cent_2_desc: "This national spirit will §GImprove§! if we complete one of the focuses §YLiteracy for All§!, §YPashto and Dari, Uzbek and Hazaragi§!, §YEducation Before Everything§!, §YMosque Schools§!, §YIslamic Education Ministry§!, §YThe Madrasa Network§!, §YShia Schools§!, §YKabul University§!, §YVillage Schools§! or §YA State for All Afghans§!."
 COLDWAR_AFG_ten_per_cent_3: "A Ten Per Cent Nation (A New Generation)"
 COLDWAR_AFG_ten_per_cent_3_desc: "This national spirit will be §GRemoved§! if we complete one of the focuses §YLiteracy for All§!, §YPashto and Dari, Uzbek and Hazaragi§!, §YEducation Before Everything§!, §YMosque Schools§!, §YIslamic Education Ministry§!, §YThe Madrasa Network§!, §YShia Schools§!, §YKabul University§!, §YVillage Schools§! or §YA State for All Afghans§!."
 COLDWAR_AFG_tension_p1_tt: "World Tension: §R+1§!"
 COLDWAR_AFG_tension_p2_tt: "World Tension: §R+2§!"
 COLDWAR_AFG_trade_1976: "Five-Year Trade Agreement"
 COLDWAR_AFG_trade_1976_partner: "Five-Year Trade Agreement"
 COLDWAR_AFG_transit_agreement: "Afghan Transit Trade Agreement"
 COLDWAR_AFG_transit_agreement_partner: "Afghan Transit Trade Agreement"
 COLDWAR_AFG_treaty_of_friendship: "Treaty of Friendship and Good-Neighbourliness"
 COLDWAR_AFG_treaty_of_friendship_partner: "Treaty of Friendship and Good-Neighbourliness"
 COLDWAR_AFG_trunk: "The New Democracy at the Crossroads"
 COLDWAR_AFG_trunk_desc: "Six years after the constitution, the king has an elected Jirga that cannot pass a budget, unlicensed parties in every coffee house and a cousin waiting in his villa. Kabul must decide what the New Democracy is to become.\n\n§g1964 constitution; Etemadi cabinet 1967-71; 1969 Wolesi Jirga of 216 independents (FRUS 1969-76 E-7 d.333).§!"
 COLDWAR_AFG_ulema_a1: "Rule of the Pirs"
 COLDWAR_AFG_ulema_a1_desc: "Hereditary Sufi leaders and their disciples govern by consensus.\n\n§gMojaddedi and Gailani families.§!"
 COLDWAR_AFG_ulema_a1f: "The National Liberation Front"
 COLDWAR_AFG_ulema_a1f_desc: "Mojaddedi's front unites the traditional clergy behind the state.\n\n§gANLF 1979.§!"
 COLDWAR_AFG_ulema_a2: "Rule of the Talibs"
 COLDWAR_AFG_ulema_a2_desc: "The students of the madrasas enforce the law as the mullahs teach it.\n\n§gHarakat-e Inqilab; later Taliban.§!"
 COLDWAR_AFG_ulema_a2f: "Vice and Virtue Committees"
 COLDWAR_AFG_ulema_a2f_desc: "Committees in every town enforce prayer and modesty.\n\n§gReligious police.§!"
 COLDWAR_AFG_ulema_b1: "Ushr from the Harvest"
 COLDWAR_AFG_ulema_b1_desc: "A tenth of the harvest goes to the treasury as Islamic law commands.\n\n§gUshr tax.§!"
 COLDWAR_AFG_ulema_b1f: "Village Granaries"
 COLDWAR_AFG_ulema_b1f_desc: "Every mosque keeps a granary against the next drought.\n\n§gDrought relief through mosques.§!"
 COLDWAR_AFG_ulema_b2: "The Bazaar's Freedom"
 COLDWAR_AFG_ulema_b2_desc: "Low duties and no state monopolies for the faithful merchant.\n\n§gTraditional bazaar economy.§!"
 COLDWAR_AFG_ulema_b2f: "The Kandahar Bazaar"
 COLDWAR_AFG_ulema_b2f_desc: "Kandahar's merchants rebuild the southern trade routes.\n\n§gKandahar trade.§!"
 COLDWAR_AFG_ulema_c1: "Customary Law and Sharia"
 COLDWAR_AFG_ulema_c1_desc: "Pashtunwali and sharia, not secular courts, settle disputes.\n\n§gJirga and sharia courts.§!"
 COLDWAR_AFG_ulema_c2: "Close the Leftist Papers"
 COLDWAR_AFG_ulema_c2_desc: "The godless newspapers are closed and their editors silenced.\n\n§gDemands against the 1965 press law.§!"
 COLDWAR_AFG_ulema_cap: "The Pious Kingdom"
 COLDWAR_AFG_ulema_cap_desc: "The countryside is at peace with a government that prays as it prays.\n\n§gAlternative traditionalist state.§!"
 COLDWAR_AFG_ulema_cm: "The Madrasa Network"
 COLDWAR_AFG_ulema_cm_desc: "A madrasa in every district trains the next generation of mullahs.\n\n§gMadrasa expansion.§!"
 COLDWAR_AFG_ulema_d1: "The Saudi Benefactor"
 COLDWAR_AFG_ulema_d1_desc: "Riyadh funds the mosques and schools of a pious Afghanistan.\n\n§gSaudi aid 1970s-80s.§!"
 COLDWAR_AFG_ulema_d2: "Neither Moscow nor Washington"
 COLDWAR_AFG_ulema_d2_desc: "Afghanistan needs no foreign master to be Muslim.\n\n§gTraditional isolationism.§!"
 COLDWAR_AFG_ulema_dm: "The Tribal Lashkars"
 COLDWAR_AFG_ulema_dm_desc: "The tribes defend the faith in their own valleys.\n\n§gTribal levies.§!"
 COLDWAR_AFG_ulema_e: "The Voice of the Pulpit"
 COLDWAR_AFG_ulema_e_desc: "The mullahs of the villages speak for a countryside angered by unveiled women, leftist papers and rising prices.\n\n§gVillage mullahs; Kandahar riots 1959.§!"
 COLDWAR_AFG_ulema_eco: "The Mosque Endowments"
 COLDWAR_AFG_ulema_eco_desc: "Waqf lands and religious endowments fund the state's charities.\n\n§gWaqf administration.§!"
 COLDWAR_AFG_ulema_em: "Hajj and Charity Funds"
 COLDWAR_AFG_ulema_em_desc: "The state funds the pilgrimage and the poor.\n\n§gReligious funds.§!"
 COLDWAR_AFG_ulema_pm: "The Council of the Ulema"
 COLDWAR_AFG_ulema_pm_desc: "A council of scholars approves every law.\n\n§gJamiat-ul Ulema.§!"
 COLDWAR_AFG_ulema_pol: "The Hazrats' Blessing"
 COLDWAR_AFG_ulema_pol_desc: "The Mojaddedi Hazrats of Shor Bazaar lend the government their authority over the Sufi orders.\n\n§gHazrats of Shor Bazaar.§!"
 COLDWAR_AFG_ulema_tree_shortcut: "Village Mullahs and the Hazrats"
 COLDWAR_AFG_war_afghanisation: "Afghanisation"
 COLDWAR_AFG_war_afghanisation_desc: "Afghan divisions take over the posts the Soviets leave. Their pay, their ammunition and their loyalty must hold.\n\n§gWithdrawal 15 May 1988-15 Feb 1989.§!"
 COLDWAR_AFG_war_airassault: "Mi-24 Air Assault"
 COLDWAR_AFG_war_airassault_desc: "Helicopter gunships and air-landed battalions reach valleys that columns cannot.\n\n§gMi-24 operations.§!"
 COLDWAR_AFG_war_airassault_dr: "Mi-24 Air Assault"
 COLDWAR_AFG_war_alone: "The Army Stands Alone"
 COLDWAR_AFG_war_alone_desc: "Without a single Soviet soldier the army holds Jalalabad. The resistance learns that Kabul will not simply fall.\n\n§gBattle of Jalalabad, 1989.§!"
 COLDWAR_AFG_war_amnesty: "Amnesty for Returning Fighters"
 COLDWAR_AFG_war_amnesty_desc: "Fighters who lay down their arms keep their land and their rifles for village defence.\n\n§gAmnesty decrees 1980s.§!"
 COLDWAR_AFG_war_ceasefires: "Local Ceasefires"
 COLDWAR_AFG_war_ceasefires_desc: "Truces with single commanders quiet whole valleys for a season. Both sides use the time to rearm.\n\n§gSoviet truce with Massoud, 1983; local ceasefires during the withdrawal.§!"
 COLDWAR_AFG_war_cities: "Hold the Cities and Roads"
 COLDWAR_AFG_war_cities_desc: "Garrison the cities, the airfields and the Termez-Kabul highway, and leave the mountains to themselves.\n\n§gSoviet early plan: secure cities and roads (Wikipedia).§!"
 COLDWAR_AFG_war_durand: "The Durand Line Front"
 COLDWAR_AFG_war_durand_desc: "The resistance is armed and rested across the border. The frontier is the war's real front.\n\n§gPakistani sanctuary; Miram Shah raid 2 Apr 1986.§!"
 COLDWAR_AFG_war_gate_tt: "The Countryside in Revolt is at least 25, or Afghanistan is at war"
 COLDWAR_AFG_war_geneva: "The Geneva Accords"
 COLDWAR_AFG_war_geneva_desc: "Kabul and Islamabad promise non-interference and the return of refugees; Moscow and Washington stand as guarantors.\n\n§gGeneva Accords, 14 April 1988.§!"
 COLDWAR_AFG_war_joint: "Joint Command with the 40th Army"
 COLDWAR_AFG_war_joint_desc: "Afghan and Soviet staffs plan the war together. Soviet officers command; Afghan officers learn, or resent it.\n\n§gOKSVA 40th Army, 80,000 rising to 108,800 (1985).§!"
 COLDWAR_AFG_war_khad: "The Ministry of State Security"
 COLDWAR_AFG_war_khad_desc: "A security service on the KGB model infiltrates the resistance, bribes its commanders and plays its rivalries against each other.\n\n§gKhAD 1980, WAD 1986; 80,000 official strength in 1986.§!"
 COLDWAR_AFG_war_loya_jirga: "The Loya Jirga of 1987"
 COLDWAR_AFG_war_loya_jirga_desc: "A grand assembly passes a new constitution that permits other parties and calls the state Islamic again.\n\n§gLoya Jirga constitution, Nov 1987.§!"
 COLDWAR_AFG_war_magistral: "Operation Magistral"
 COLDWAR_AFG_war_magistral_desc: "A combined offensive clears the Gardez-Khost road and lifts the siege of Khost.\n\n§gOperation Magistral, Nov 1987-Jan 1988.§!"
 COLDWAR_AFG_war_magistral_dr: "Operation Magistral"
 COLDWAR_AFG_war_militias: "Buy the Militias"
 COLDWAR_AFG_war_militias_desc: "Pay the khans and commanders to guard their own valleys. They take the money, the guns and often the other side's money too.\n\n§gKhAD bribery of tribal militias; neutrality more often than commitment (Wikipedia).§!"
 COLDWAR_AFG_war_militias_dr: "Buy the Militias"
 COLDWAR_AFG_war_pacified: "The Countryside Pacified"
 COLDWAR_AFG_war_pacified_desc: "The resistance is broken. Whether peace follows depends on what was destroyed to win it.\n\n§gMilitary victory exit (alternative).§!"
 COLDWAR_AFG_war_peace: "A Negotiated Peace"
 COLDWAR_AFG_war_peace_desc: "The guns are not silent everywhere, but the war is over as a national war. Refugees begin to come home.\n\n§gExit by negotiation (alternative to 1992).§!"
 COLDWAR_AFG_war_reconciliation: "National Reconciliation"
 COLDWAR_AFG_war_reconciliation_desc: "Ceasefire, amnesty and seats for the opposition: the government offers to share power to end the war.\n\n§gNajibullah's National Reconciliation: ceasefire from Dec 1986, launched early 1987 (Wikipedia).§!"
 COLDWAR_AFG_war_refugees: "The Refugee Return Programme"
 COLDWAR_AFG_war_refugees_desc: "Land, seed and safe conduct for the families who return from Peshawar and Mashhad.\n\n§g5.5 million refugees; 3.3 million in Pakistan, about 2 million in Iran (1988).§!"
 COLDWAR_AFG_war_root: "The War in the Countryside"
 COLDWAR_AFG_war_root_desc: "Whole provinces no longer obey Kabul. The government holds the cities and the highways; the valleys belong to men with rifles and a cause.\n\n§gBy the mid-1980s about 80% of the countryside lay outside government control (Wikipedia: Soviet-Afghan War).§!"
 COLDWAR_AFG_war_salang: "Salang Highway Convoys"
 COLDWAR_AFG_war_salang_desc: "Pickets on every ridge keep the Salang tunnel and the northern highway open for the convoys.\n\n§gSalang route, the war's main supply line.§!"
 COLDWAR_AFG_war_sarandoy: "The Sarandoy"
 COLDWAR_AFG_war_sarandoy_desc: "A gendarmerie of the Interior Ministry guards towns and roads so that the army can fight.\n\n§gSarandoy, moved under WAD in 1986.§!"
 COLDWAR_AFG_war_scorched: "Scorched Earth"
 COLDWAR_AFG_war_scorched_desc: "Destroy the villages, wells and irrigation channels that feed the resistance. The fighters lose their base; Afghanistan loses its farms.\n\n§gDestruction of irrigation ditches and villages; millions of landmines (Wikipedia; Kaplan 2008).§!"
 COLDWAR_AFG_war_scorched_dr: "Scorched Earth"
 COLDWAR_AFG_war_seal: "Seal the Border Posts"
 COLDWAR_AFG_war_seal_desc: "Mined belts, posts and patrols on the passes halve what reaches the resistance from outside.\n\n§gBorder sealing operations.§!"
 COLDWAR_AFG_war_search: "Search and Destroy"
 COLDWAR_AFG_war_search_desc: "Air assault and armoured columns sweep the valleys. The fighters return when the columns leave, and the villagers flee.\n\n§gMi-24 search-and-destroy operations; Panjshir I-IX 1980-85.§!"
 COLDWAR_AFG_war_search_dr: "Search and Destroy"
 COLDWAR_AFG_war_strike: "Strike the Camps"
 COLDWAR_AFG_war_strike_desc: "Air and commando raids hit the camps and depots on the Pakistani side. Islamabad and Washington will answer.\n\n§gCross-border air raids; F-16 clashes (Wikipedia).§!"
 COLDWAR_AFG_war_strike_dr: "Strike the Camps"
 COLDWAR_AFG_war_tree_shortcut: "Afghan War"
 COLDWAR_AFG_withdrawal_tt: "The contingent falls by one level every §Y90§! days. At level 0 the Limited Contingent agreement ends; the Afghan Syndrome lasts one more year."
