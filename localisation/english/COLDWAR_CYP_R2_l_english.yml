 COLDWAR_CYP_R2_deal.czechoslovakia.t:0 "Cyprus Agreement: Supervised Czechoslovak Supply"
 COLDWAR_CYP_R2_deal.eec.d:0 "Cyprus proposes an association protocol to the six Community governments. It takes effect only if all six approve."
 COLDWAR_CYP_R2_deal.eec.t:0 "Cyprus Agreement: Cyprus Association Protocol"
 COLDWAR_CYP_R2_deal.greek_civil.d:0 "The Republic of Cyprus proposes the terms of the Greek-Cypriot Civil Exchange to Greece."
 COLDWAR_CYP_R2_deal.greek_civil.t:0 "Cyprus Agreement: Greek-Cypriot Civil Exchange"
 COLDWAR_CYP_R2_deal.greek_training.d:0 "The Republic of Cyprus proposes the terms of the Greek Training Mission to Greece."
 COLDWAR_CYP_R2_deal.greek_training.t:0 "Cyprus Agreement: Greek Training Mission"
 COLDWAR_CYP_R2_deal.turkey.d:0 "The Republic of Cyprus proposes the terms of the Communal Guarantees Protocol to Turkey."
 COLDWAR_CYP_R2_deal.turkey.t:0 "Cyprus Agreement: Communal Guarantees Protocol"
 COLDWAR_CYP_R2_deal.yugoslavia.d:0 "The Republic of Cyprus proposes the terms of the Non-Aligned Technical Exchange to Yugoslavia."
 COLDWAR_CYP_R2_deal.yugoslavia.t:0 "Cyprus Agreement: Non-Aligned Technical Exchange"
 COLDWAR_CYP_R2_deal_mod_army_attack_factor_tt:0 "Army attack: $RIGHT|+=%1$"
 COLDWAR_CYP_R2_deal_mod_army_org_factor_tt:0 "Division organization: $RIGHT|+=%1$"
 COLDWAR_CYP_R2_deal_mod_bureaucracy_cost_multiplier_modifier_tt:0 "Bureaucracy cost: $RIGHT|+=%1$"
 COLDWAR_CYP_R2_deal_mod_education_cost_multiplier_modifier_tt:0 "Education cost: $RIGHT|+=%1$"
 COLDWAR_CYP_R2_deal_mod_foreign_influence_defense_modifier_tt:0 "Foreign influence defence: $RIGHT|+=%1$"
