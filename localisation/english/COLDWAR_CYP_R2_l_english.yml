 COLDWAR_CYP_R2_modify_republican_institutions_tt:0 "Modify §YRepublican Institutions§!:"
 COLDWAR_CYP_R2_movement:0 "Open Island Routes"
 COLDWAR_CYP_R2_movement_desc:0 "A durable mobility agreement can remove the economic penalties of fragmentation. It requires functioning local guarantees rather than an assertion that the communal dispute has disappeared."
 COLDWAR_CYP_R2_municipal:0 "Shared Municipal Funds"
 COLDWAR_CYP_R2_municipal_desc:0 "A common fund can direct investment to neglected districts under joint supervision. Reliable funding reduces local uncertainty but creates an enduring budget commitment."
 COLDWAR_CYP_R2_national_firms:0 "National Enterprise"
 COLDWAR_CYP_R2_national_firms_desc:0 "A domestic enterprise strategy can retain local control and improve production standards. Restricted access to outside capital slows the pace at which the building sector can expand."
 COLDWAR_CYP_R2_networks:0 "Expose Armed Networks"
 COLDWAR_CYP_R2_networks_desc:0 "Investigations can disrupt clandestine violence, including the National Front and later EOKA B. Arrests and searches also risk polarizing Greek Cypriot politics."
 COLDWAR_CYP_R2_new_compact:0 "A Federal Compact"
 COLDWAR_CYP_R2_new_compact_desc:0 "A negotiated federal settlement can distribute powers more explicitly between a common government and communal authorities. The additional institutions impose a lasting administrative cost."
 COLDWAR_CYP_R2_nonaligned:0 "Non-Aligned Partners"
 COLDWAR_CYP_R2_nonaligned_desc:0 "Cyprus and Yugoslavia share the diplomatic traditions of the Non-Aligned Movement. A technical and commercial arrangement can build on that connection without becoming a military alliance."
 COLDWAR_CYP_R2_offer_accept:0 "Accept the proposal"
 COLDWAR_CYP_R2_offer_if_accepted_tt:0 "If all required participants accept:"
 COLDWAR_CYP_R2_offer_refuse:0 "Refuse the proposal"
 COLDWAR_CYP_R2_officers:0 "The Officer Question"
 COLDWAR_CYP_R2_officers_desc:0 "Greek officers provide military expertise while Athens is ruled by a junta. The presidency must decide how much of the National Guard command it can safely leave dependent on an external government."
 COLDWAR_CYP_R2_open_capital:0 "Open Capital Markets"
 COLDWAR_CYP_R2_open_capital_desc:0 "Foreign capital can finance expansion beyond the island limited savings. Greater reliance on outside investors also increases exposure to external political and commercial pressure."
 COLDWAR_CYP_R2_parish:0 "Parish Relief Network"
 COLDWAR_CYP_R2_parish_desc:0 "Reliable parish relief can reach families outside the largest towns. Public funding formalizes the partnership while retaining the educational compromise of the social covenant."
 COLDWAR_CYP_R2_parliamentary_left:0 "Parliamentary Strategy"
 COLDWAR_CYP_R2_parliamentary_left_desc:0 "A parliamentary strategy can connect the labour movement to the republic institutions. Opposition rights, coalition bargaining and electoral organization can extend its influence while preserving constitutional competition."
 COLDWAR_CYP_R2_passage:0 "Safe Civilian Passage"
 COLDWAR_CYP_R2_passage_desc:0 "Agreed routes for workers, patients and goods can reconnect communities. Liaison staff and supervised crossings cost money and require security services to relinquish some discretion."
 COLDWAR_CYP_R2_penetration_tt:0 "Officer penetration: $RIGHT|-=0$"
 COLDWAR_CYP_R2_plan:0 "The Second Plan"
 COLDWAR_CYP_R2_plan_desc:0 "The Second Five-Year Plan has supported roads, utilities and productive investment. Completing its priorities can sustain the growth already achieved during the 1960s."
 COLDWAR_CYP_R2_plan_research:0 "The Second Plan"
 COLDWAR_CYP_R2_planning_school:0 "Planning School"
 COLDWAR_CYP_R2_planning_school_desc:0 "A planning school can train the administrators needed for the public industrial programme. It expands domestic expertise at an additional educational cost."
 COLDWAR_CYP_R2_planning_school_research:0 "Planning School"
 COLDWAR_CYP_R2_police:0 "Police Counterweights"
 COLDWAR_CYP_R2_police_desc:0 "A lawful police reserve can prevent the Guard from monopolizing armed power. Rival chains of command must be coordinated and supported from the public budget."
 COLDWAR_CYP_R2_ports:0 "A Commercial Gateway"
 COLDWAR_CYP_R2_ports_desc:0 "Improved port facilities can serve exports and essential imports. Reliable handling, storage and coastal access will support the commercial routes on which the island depends."
 COLDWAR_CYP_R2_positions:0 "Prepared Positions"
 COLDWAR_CYP_R2_positions_desc:0 "Limited fieldworks can protect selected approaches and landing sites. Their value depends on the forces available to hold them and on the geography represented by the current map."
 COLDWAR_CYP_R2_pragmatism:0 "Settlement Pragmatism"
 COLDWAR_CYP_R2_pragmatism_desc:0 "A negotiated settlement can reduce uncertainty for households and businesses. Compromise on communal powers has a political cost among voters seeking firmer national guarantees."
 COLDWAR_CYP_R2_preparedness_tt:0 "Presidential preparedness: $RIGHT|+=0$"
 COLDWAR_CYP_R2_presidential_service:0 "Presidential Service"
 COLDWAR_CYP_R2_presidential_service_desc:0 "The presidential centre can coordinate a broad coalition around independence. A stronger secretariat improves political direction but increases the cost of administration."
 COLDWAR_CYP_R2_programme_akel_social_programme:0 "AKEL Social Programme"
 COLDWAR_CYP_R2_programme_akel_social_programme_desc:0 "The enacted national programme combines its approved policies and public commitments."
 COLDWAR_CYP_R2_programme_command_settlement:0 "Command Settlement"
 COLDWAR_CYP_R2_programme_command_settlement_desc:0 "The enacted national programme combines its approved policies and public commitments."
 COLDWAR_CYP_R2_programme_communal_arrangements:0 "Communal Arrangements"
 COLDWAR_CYP_R2_programme_communal_arrangements_desc:0 "The enacted national programme combines its approved policies and public commitments."
 COLDWAR_CYP_R2_programme_constitutional_settlement:0 "Constitutional Settlement"
 COLDWAR_CYP_R2_programme_constitutional_settlement_desc:0 "The enacted national programme combines its approved policies and public commitments."
 COLDWAR_CYP_R2_programme_defence_programme:0 "Defence Programme"
 COLDWAR_CYP_R2_programme_defence_programme_desc:0 "The enacted national programme combines its approved policies and public commitments."
 COLDWAR_CYP_R2_programme_development_policy:0 "Development Policy"
 COLDWAR_CYP_R2_programme_development_policy_desc:0 "The enacted national programme combines its approved policies and public commitments."
 COLDWAR_CYP_R2_programme_eniaion_economic_programme:0 "Eniaion Economic Programme"
 COLDWAR_CYP_R2_programme_eniaion_economic_programme_desc:0 "The enacted national programme combines its approved policies and public commitments."
 COLDWAR_CYP_R2_programme_presidential_programme:0 "Presidential Programme"
 COLDWAR_CYP_R2_programme_presidential_programme_desc:0 "The enacted national programme combines its approved policies and public commitments."
 COLDWAR_CYP_R2_programme_republican_institutions:0 "Republican Institutions"
 COLDWAR_CYP_R2_programme_republican_institutions_desc:0 "The enacted national programme combines its approved policies and public commitments."
 COLDWAR_CYP_R2_public_industry:0 "Public Industry"
 COLDWAR_CYP_R2_public_industry_desc:0 "Public holdings can concentrate scarce investment on industrial capacity. Acquisitions and management must be financed, and political ownership does not remove production constraints."
 COLDWAR_CYP_R2_public_standards:0 "Public Standards"
 COLDWAR_CYP_R2_public_standards_desc:0 "Technical standards and professional management can improve public industrial performance. The programme develops the selected public-holdings route while retaining its administrative costs."
 COLDWAR_CYP_R2_public_standards_research:0 "Public Standards"
 COLDWAR_CYP_R2_recovery:0 "Recovery and Housing"
 COLDWAR_CYP_R2_recovery_desc:0 "If conflict disrupts the economy, housing, services and lost commercial links become urgent priorities. Relief must be directed toward the disruption that actually occurred."
 COLDWAR_CYP_R2_representation:0 "Shared Representation"
 COLDWAR_CYP_R2_representation_desc:0 "Reserved representation cannot become effective through a unilateral appointment. Negotiated participation must give the Turkish Cypriot community a credible voice in shared decisions."
 COLDWAR_CYP_R2_republic:0 "The Republic at Ten"
 COLDWAR_CYP_R2_republic_desc:0 "The republic has survived its first decade, but its common institutions no longer command the confidence of both communities. Independence needs a functioning political settlement as well as international recognition."
 COLDWAR_CYP_R2_republican_right:0 "The Republican Right"
 COLDWAR_CYP_R2_republican_right_desc:0 "A republican right can distinguish constitutional competition from coercive Enosis. Its support for independence leaves room for close cultural relations with Greece."
 COLDWAR_CYP_R2_reserve_service:0 "Reserve Standards"
 COLDWAR_CYP_R2_reserve_service_desc:0 "A capable reserve gives substance to demands for security. Longer training and continuing readiness remain part of the price of this approach."
 COLDWAR_CYP_R2_reserve_service_research:0 "Reserve Standards"
 COLDWAR_CYP_R2_resilience:0 "Reserves for a Crisis"
 COLDWAR_CYP_R2_resilience_desc:0 "Emergency reserves and redundant supply contracts make peaceful development less vulnerable to pressure. Keeping resources in reserve reduces the return available from ordinary commercial investment."
 COLDWAR_CYP_R2_restore_1960:0 "The 1960 Balance"
 COLDWAR_CYP_R2_restore_1960_desc:0 "A repaired partnership can retain the constitutional framework of independence. Restored vetoes and communal protections constrain executive action in exchange for stronger guarantees."
 COLDWAR_CYP_R2_rights:0 "Communal Rights"
 COLDWAR_CYP_R2_rights_desc:0 "Rights to representation, worship, education and legal protection must survive changes of government. Their enforcement will be entrusted to institutions accepted by both communities."
 COLDWAR_CYP_R2_rural_processing:0 "Rural Processing"
 COLDWAR_CYP_R2_rural_processing_desc:0 "Processing and storage can retain more of the value of rural exports on the island. The investment complements cooperative organization and remains useful after a change of government."
 COLDWAR_CYP_R2_safeguards:0 "Enforce the Safeguards"
 COLDWAR_CYP_R2_safeguards_desc:0 "A standing review commission can investigate violations and preserve confidence when a government changes. The commission adds expense but gives ordinary grievances a lawful remedy."
 COLDWAR_CYP_R2_scrutiny:0 "Parliamentary Scrutiny"
 COLDWAR_CYP_R2_scrutiny_desc:0 "Stronger parliamentary scrutiny can build confidence in public decisions. Ministers must accept slower negotiations and less freedom to govern through presidential understandings."
 COLDWAR_CYP_R2_services:0 "Commercial Services"
 COLDWAR_CYP_R2_services_desc:0 "Professional services can complement tourism and external commerce. Their expansion increases demand for educated staff and should not be confused with an instant offshore-finance boom."
 COLDWAR_CYP_R2_services_for_all:0 "Services for All"
 COLDWAR_CYP_R2_services_for_all_desc:0 "Wider access to education and health care can support both social confidence and technical skills. The commitment requires continuing public expenditure instead of a one-time declaration."
 COLDWAR_CYP_R2_settlement_fund:0 "Settlement Investment"
 COLDWAR_CYP_R2_settlement_fund_desc:0 "Investment linked to an accepted settlement can demonstrate that compromise produces tangible national gains. Construction remains conditional on control, capacity and the agreed safeguards."
 COLDWAR_CYP_R2_shortcut_akel:0 "AKEL"
 COLDWAR_CYP_R2_shortcut_centre:0 "Presidential Centre"
 COLDWAR_CYP_R2_shortcut_community:0 "Two Communities"
 COLDWAR_CYP_R2_shortcut_constitution:0 "Constitution"
 COLDWAR_CYP_R2_shortcut_crisis:0 "Road to War"
 COLDWAR_CYP_R2_shortcut_defence:0 "National Defence"
 COLDWAR_CYP_R2_shortcut_diplomacy:0 "Foreign Agreements"
 COLDWAR_CYP_R2_shortcut_economy:0 "Development"
 COLDWAR_CYP_R2_shortcut_eng:0 "Cyprus: United Kingdom"
 COLDWAR_CYP_R2_shortcut_gre:0 "Cyprus: Greece"
 COLDWAR_CYP_R2_shortcut_liberal:0 "Eniaion"
 COLDWAR_CYP_R2_shortcut_tur:0 "Cyprus: Turkey"
 COLDWAR_CYP_R2_signals:0 "Signals and Logistics"
 COLDWAR_CYP_R2_signals_desc:0 "Reliable communications and maintenance improve the usefulness of a reserve force. The programme favours coordination and endurance over additional formations."
 COLDWAR_CYP_R2_signals_research:0 "Signals and Logistics"
 COLDWAR_CYP_R2_small_firms:0 "Small Firm Expansion"
 COLDWAR_CYP_R2_small_firms_desc:0 "A second stage of investment can connect small firms to machinery and export finance. Its assets remain national gains even if a later government changes economic policy."
 COLDWAR_CYP_R2_small_firms_research:0 "Small Firm Expansion"
 COLDWAR_CYP_R2_social_compact:0 "Common Social Rights"
 COLDWAR_CYP_R2_social_compact_desc:0 "Agreed social rights can give cooperation a material foundation across the communal divide. Services must be funded and administered with the consent of both sides."
 COLDWAR_CYP_R2_sovereignty:0 "Sovereignty First"
 COLDWAR_CYP_R2_sovereignty_desc:0 "A firm central position can resist outside pressure and defend the recognized republic. It makes communal concessions harder to negotiate and reduces confidence in a shared settlement."
 COLDWAR_CYP_R2_special:0 "Commando Training"
 COLDWAR_CYP_R2_special_desc:0 "A small specialist arm can cover difficult terrain and demanding missions. Its soldiers require longer training and dedicated support, limiting how widely the model can be applied."
 COLDWAR_CYP_R2_special_research:0 "Commando Training"
 COLDWAR_CYP_R2_succession:0 "Constitutional Succession"
 COLDWAR_CYP_R2_succession_desc:0 "The presidential centre needs lawful continuity beyond Makarios himself. A durable parliamentary organization and clear constitutional succession can preserve independence through a change of leadership."
 COLDWAR_CYP_R2_supply_chains:0 "Domestic Supply Chains"
 COLDWAR_CYP_R2_supply_chains_desc:0 "Local suppliers and common quality standards can strengthen manufacturing. Reliable contracts and technical training will help island firms compete for a greater share of export production."
 COLDWAR_CYP_R2_supply_chains_research:0 "Domestic Supply Chains"
 COLDWAR_CYP_R2_talks:0 "Resume the Talks"
 COLDWAR_CYP_R2_talks_desc:0 "Clerides and Denktash have been conducting intercommunal talks since 1968. A permanent liaison channel can keep local disputes from becoming another general confrontation."
 COLDWAR_CYP_R2_technical:0 "Technical Institutes"
 COLDWAR_CYP_R2_technical_desc:0 "A small island needs engineers, technicians and administrators as well as labour. Technical institutes address specialist shortages through education rather than restricting the national workforce."
 COLDWAR_CYP_R2_technical_research:0 "Technical Institutes"
 COLDWAR_CYP_R2_territorial:0 "Territorial Defence"
 COLDWAR_CYP_R2_territorial_desc:0 "Local defensive plans can make a small force harder to dislodge from important positions. The resulting posture sacrifices offensive flexibility and cannot promise control of the sea."
 COLDWAR_CYP_R2_tourism:0 "A Visitor Economy"
 COLDWAR_CYP_R2_tourism_desc:0 "Hotels and visitor services can earn foreign exchange and employ a growing urban population. Concentrating investment on visitors increases the losses the island suffers during a security crisis."
 COLDWAR_CYP_R2_tur_terms_CYP_title:0 "Communal Guarantees Proposal"
 COLDWAR_CYP_R2_tur_terms_ENG_title:0 "Communal Guarantees Proposal"
 COLDWAR_CYP_R2_tur_terms_GRE_title:0 "Communal Guarantees Proposal"
 COLDWAR_CYP_R2_tur_terms_deadline_desc:0 "The proposal lapses after 14 days without every required signature."
 COLDWAR_CYP_R2_tur_terms_deadline_title:0 "Communal Guarantees Lapse"
 COLDWAR_CYP_R2_tur_terms_desc:0 "Turkey proposes constitutional safeguards. Cyprus can accept only after both communal delegations have separately assented. Greece and the United Kingdom decide their own response."
 COLDWAR_CYP_R2_turkey_accept:0 "Accept the Communal Guarantees Protocol"
 COLDWAR_CYP_R2_turkey_cyp:0 "Communal Guarantees Protocol"
 COLDWAR_CYP_R2_turkey_cyp_desc:0 "A standing, recipient-approved Communal Guarantees Protocol agreement with its bilateral conditions in force."
 COLDWAR_CYP_R2_turkey_decline:0 "Decline the Communal Guarantees Protocol"
 COLDWAR_CYP_R2_turkey_tur:0 "Cyprus Confidence Protocol"
 COLDWAR_CYP_R2_turkey_tur_desc:0 "A standing, recipient-approved Communal Guarantees Protocol agreement with its bilateral conditions in force."
 COLDWAR_CYP_R2_turkish_army_crisis:0 "Army Crisis"
 COLDWAR_CYP_R2_turkish_pact:0 "Guarantees with Turkey"
 COLDWAR_CYP_R2_turkish_pact_desc:0 "A confidence agreement with Turkey can reduce external fears once communal guarantees are credible. It supplements Turkish Cypriot consent and cannot replace it."
 COLDWAR_CYP_R2_turkish_terms:0 "Accepted Communal Guarantees"
 COLDWAR_CYP_R2_turkish_terms_desc:0 "Stability +3%. Army attack -2%."
 COLDWAR_CYP_R2_utilities:0 "Reconnect Utilities"
 COLDWAR_CYP_R2_utilities_desc:0 "Electricity, water and road access should not depend on bargaining at every local checkpoint. A supervised infrastructure programme can improve services while leaving constitutional claims for negotiation."
 COLDWAR_CYP_R2_water:0 "Water for the Island"
 COLDWAR_CYP_R2_water_desc:0 "Water storage and distribution protect agriculture and growing towns from seasonal shortages. The same investment can serve villages, exporters and the tourist economy."
 COLDWAR_CYP_R2_weekly_expense_tt:0 "§HAdditional Expenses§!: §R$[?COLDWAR_CYP_R2_tt_weekly|3]§! billion per week"
 COLDWAR_CYP_R2_weekly_intervention_expense_tt:0 "Weekly expedition expense: 0.005% of current Turkish GDP while the intervention remains active."
 COLDWAR_CYP_R2_weekly_volunteer_expense_tt:0 "Weekly volunteer expense: 0.002% of current Greek GDP while Greek divisions serve in Cyprus."
 COLDWAR_CYP_R2_workshops:0 "Export Workshops"
 COLDWAR_CYP_R2_workshops_desc:0 "Light manufacturing offers a different export base from tourism. Imported machinery and industrial priorities absorb capital that could otherwise support commercial services."
 COLDWAR_CYP_R2_yugoslavia_accept:0 "Accept the Non-Aligned Technical Exchange"
 COLDWAR_CYP_R2_yugoslavia_cyp:0 "Non-Aligned Technical Exchange"
 COLDWAR_CYP_R2_yugoslavia_cyp_desc:0 "A standing, recipient-approved Non-Aligned Technical Exchange agreement with its bilateral conditions in force."
 COLDWAR_CYP_R2_yugoslavia_cyp_research_1:0 "Non-Aligned Technical Exchange"
 COLDWAR_CYP_R2_yugoslavia_decline:0 "Decline the Non-Aligned Technical Exchange"
 COLDWAR_CYP_R2_yugoslavia_ser:0 "Cypriot Technical Contracts"
 COLDWAR_CYP_R2_yugoslavia_ser_desc:0 "A standing, recipient-approved Non-Aligned Technical Exchange agreement with its bilateral conditions in force."
 COLDWAR_ENG_CYP_R2_eng_consult:0 "Consultation in London"
 COLDWAR_ENG_CYP_R2_eng_consult_desc:0 "London convenes the guarantors after a constitutional crisis and asks Greece and Turkey to participate in an agreed response."
 COLDWAR_ENG_CYP_R2_eng_mediation:0 "A Joint Mediation"
 COLDWAR_ENG_CYP_R2_eng_mediation_desc:0 "Britain works with Greece and Turkey on a common restoration proposal. Coordinated diplomacy creates administrative obligations as well as a path to settlement."
 COLDWAR_ENG_CYP_R2_eng_restraint:0 "Limit the Commitment"
 COLDWAR_ENG_CYP_R2_eng_restraint_desc:0 "Britain limits its enforcement commitment while retaining its treaty record. This reduces administrative costs but weakens its diplomatic influence."
 COLDWAR_GRE_CYP_R2_gre_consult:0 "A Guarantor Settlement"
 COLDWAR_GRE_CYP_R2_gre_consult_desc:0 "Greece convenes the guarantor governments after a constitutional crisis and asks each participant to consider a negotiated settlement."
 COLDWAR_GRE_CYP_R2_gre_coup:0 "Overthrow Makarios"
 COLDWAR_GRE_CYP_R2_gre_coup_desc:0 "Greek officers attempt to overthrow Makarios. Cyprus receives a warning and the outcome depends on the actual strength of the opposing institutions and networks."
 COLDWAR_GRE_CYP_R2_gre_escalate:0 "Fight Beside Cyprus"
 COLDWAR_GRE_CYP_R2_gre_escalate_desc:0 "Enter the Cyprus war against Turkey. Greece and Turkey leave NATO for the duration of this conflict, and their previous membership is restored once their war and the Cyprus-Turkey war have both ended."
 COLDWAR_GRE_CYP_R2_gre_network:0 "The Officer Network"
 COLDWAR_GRE_CYP_R2_gre_network_desc:0 "The junta preserves its officer network on Cyprus. This covert course deepens political influence at a material cost and increases the danger to the Republic."
 COLDWAR_GRE_CYP_R2_gre_officers:0 "Officers on Cyprus"
 COLDWAR_GRE_CYP_R2_gre_officers_desc:0 "The Greek officer mission remains a practical instrument of cooperation with Cyprus, while its presence also carries political weight in the National Guard."
 COLDWAR_GRE_CYP_R2_gre_response:0 "The Turkish Landing"
 COLDWAR_GRE_CYP_R2_gre_response_desc:0 "Turkish forces have entered the Cyprus war. Greece must decide whether to sustain Cyprus through a volunteer mission or enter the conflict as a belligerent."
 COLDWAR_GRE_CYP_R2_gre_treaty:0 "Honour the Republic"
 COLDWAR_GRE_CYP_R2_gre_treaty_desc:0 "Respect for the Republic and its elected institutions limits the use of Greek influence and gives civilian cooperation a firmer basis."
 COLDWAR_GRE_CYP_R2_gre_volunteers:0 "Volunteers for Cyprus"
 COLDWAR_GRE_CYP_R2_gre_volunteers_desc:0 "A volunteer mission can assist Cyprus while Greece avoids direct entry into the war. Cyprus must accept the deployment, and the volunteers must come from formations Greece actually possesses."
 COLDWAR_GRE_CYP_R2_gre_withdraw:0 "Withdraw the Network"
 COLDWAR_GRE_CYP_R2_gre_withdraw_desc:0 "Greece ends its sponsorship of the officer network before a coup is launched, reducing its influence and restoring some confidence."
# IMPERIA COLD WAR — B8 24.11.2026: NATO readmission offer text.
 COLDWAR_CYP_R2_nato_readmission_offer_tt:0 "After the related peace, Greece asks the NATO leader for readmission; the NATO leader decides."
