# IMPERIA COLD WAR — Compact Cyprus 1970 replacement.
 COLDWAR_CYP_R2_accept:0 "Accept the proposal"
 COLDWAR_CYP_R2_accepted_desc:0 "The recipient has approved the agreement. Its paired terms operate while the bilateral relationship remains eligible."
 COLDWAR_CYP_R2_accountability:0 "Joint Accounts"
 COLDWAR_CYP_R2_accountability_desc:0 "Published accounts can show how communal funds are divided and used. Common supervision makes future investment easier to defend to taxpayers in both communities."
 COLDWAR_CYP_R2_ack:0 "We shall continue through lawful institutions."
 COLDWAR_CYP_R2_acknowledge:0 "Acknowledge."
 COLDWAR_CYP_R2_agreement_accepted_t:0 "Agreement Ratified"
 COLDWAR_CYP_R2_agreement_declined_t:0 "Agreement Declined"
 COLDWAR_CYP_R2_angry_general_staff:0 "Angry General Staff"
 COLDWAR_CYP_R2_angry_general_staff_desc:0 "Stability -10%. Army organization -10%. Political power gain -15%."
 COLDWAR_CYP_R2_army_control:0 "Reassert Civilian Authority"
 COLDWAR_CYP_R2_army_coup_desc:0 "At day 60, pressure of 60 or more installs the dated military-junta government. Pressure of 36 to 59 defeats the plot with stability -5%. Pressure of 35 or less defeats it without a further penalty."
 COLDWAR_CYP_R2_army_coup_title:0 "The Turkish Army Crisis"
 COLDWAR_CYP_R2_army_crisis_end_desc:0 "The finite 180-day army crisis has ended. Its pending outcomes can no longer fire."
 COLDWAR_CYP_R2_army_crisis_end_title:0 "The Army Crisis Ends"
 COLDWAR_CYP_R2_army_intervene:0 "Authorize the Cyprus Operation"
 COLDWAR_CYP_R2_army_mandate:0 "Secure a Parliamentary Mandate"
 COLDWAR_CYP_R2_army_memorandum_desc:0 "Senior officers challenge civilian authority. If the army crisis is still active, military pressure rises by 15."
 COLDWAR_CYP_R2_army_memorandum_title:0 "The General Staff Memorandum"
 COLDWAR_CYP_R2_army_pressure_preview_tt:0 "Military pressure starts at 70. The day 30 memorandum adds 15. The day 60 coup succeeds at 60 or more."
 COLDWAR_CYP_R2_army_rotate:0 "Reassign Exposed Commanders"
 COLDWAR_CYP_R2_association:0 "European Association"
 COLDWAR_CYP_R2_association_desc:0 "Association can open commercial opportunities without granting Community membership. A trade agreement must secure the approval of the actual Community partners and preserve its negotiated conditions."
 COLDWAR_CYP_R2_audit:0 "Audit Office"
 COLDWAR_CYP_R2_audit_desc:0 "An independent audit office will examine procurement and public contracts. The initial expense buys administrative savings while the parliamentary route retains its slower political bargaining."
 COLDWAR_CYP_R2_autonomy:0 "Communal Autonomy"
 COLDWAR_CYP_R2_autonomy_desc:0 "Recognized communal administrative powers may provide security without demanding immediate institutional integration. The common government must accept a narrower field of direct authority."
 COLDWAR_CYP_R2_ballot:0 "Protect the Ballot"
 COLDWAR_CYP_R2_ballot_desc:0 "Electoral competition must not become a contest over who controls the police or the polling station. Protected campaigning and impartial administration can make lawful opposition credible."
 COLDWAR_CYP_R2_bases:0 "Base Area Access"
 COLDWAR_CYP_R2_bases_desc:0 "Civil access, employment and services around the British Sovereign Base Areas need practical agreements. Accommodation can protect livelihoods while leaving British sovereignty over the bases intact."
 COLDWAR_CYP_R2_bicommunal_labour:0 "Bicommunal Labour"
 COLDWAR_CYP_R2_bicommunal_labour_desc:0 "Trade-union contacts can rebuild practical cooperation between Greek Cypriot and Turkish Cypriot workers. A common labour agenda asks the party to spend political capital on compromise."
 COLDWAR_CYP_R2_britain_accept:0 "Accept the Base Area Civil Access"
 COLDWAR_CYP_R2_britain_cyp:0 "Base Area Civil Access"
 COLDWAR_CYP_R2_britain_cyp_desc:0 "A standing, recipient-approved Base Area Civil Access agreement with its bilateral conditions in force."
 COLDWAR_CYP_R2_britain_decline:0 "Decline the Base Area Civil Access"
 COLDWAR_CYP_R2_britain_eng:0 "Cypriot Base Liaison"
 COLDWAR_CYP_R2_britain_eng_desc:0 "A standing, recipient-approved Base Area Civil Access agreement with its bilateral conditions in force."
 COLDWAR_CYP_R2_cabinet:0 "Cabinet Government"
 COLDWAR_CYP_R2_cabinet_desc:0 "A cabinet answerable for security, expenditure and negotiations can reduce the personal burden on the presidency. A stronger centre also needs a larger permanent secretariat."
 COLDWAR_CYP_R2_capacity_tt:0 "The state is owned and controlled, with native construction capacity."
 COLDWAR_CYP_R2_checkpoints:0 "Retain Security Checks"
 COLDWAR_CYP_R2_checkpoints_desc:0 "Security checkpoints can reassure exposed villages and preserve inspection powers. They also obstruct ordinary commerce and deepen suspicion of the central government."
 COLDWAR_CYP_R2_church_talks:0 "Church Mediation"
 COLDWAR_CYP_R2_church_talks_desc:0 "The Orthodox Church has land, schools and an authority that reaches beyond party organizations. Its mediation can protect independence while reinforcing expectations of public support for religious institutions."
 COLDWAR_CYP_R2_church_welfare:0 "Church Social Covenant"
 COLDWAR_CYP_R2_church_welfare_desc:0 "Parish institutions can help deliver social support and strengthen the presidency in rural society. Public cooperation also reinforces the Church role in education and public life."
 COLDWAR_CYP_R2_civil_defence:0 "Civil Defence Network"
 COLDWAR_CYP_R2_civil_defence_desc:0 "Shelters, evacuation planning and medical coordination can reduce civilian exposure during a crisis. The network commits resources that cannot also fund a larger specialist force."
 COLDWAR_CYP_R2_civil_service:0 "A Secular Civil Service"
 COLDWAR_CYP_R2_civil_service_desc:0 "Professional recruitment can improve technical administration beyond confessional or personal networks. The reform weakens some of the political instruments on which a presidential coalition relies."
 COLDWAR_CYP_R2_civilian_rule:0 "Restore Civilian Rule"
 COLDWAR_CYP_R2_civilian_rule_desc:0 "A failed coup or a negotiated restoration must be followed by a command settlement and the dismantling of armed political networks. Neither a calendar date nor a foreign promise is enough."
 COLDWAR_CYP_R2_civilian_tt:0 "The constitutional government controls the security services."
 COLDWAR_CYP_R2_clerides:0 "Constitutional Right"
 COLDWAR_CYP_R2_clerides_desc:0 "The movement around Clerides can become a lasting constitutional alternative to the presidential centre. Its programme connects private enterprise, a republican legal order and a negotiated national settlement."
 COLDWAR_CYP_R2_clinics:0 "Joint Medical Access"
 COLDWAR_CYP_R2_clinics_desc:0 "Access to hospitals and emergency treatment can become a practical common interest. The state must fund transport, interpreters and care without discriminatory restrictions."
 COLDWAR_CYP_R2_coalition:0 "A Republican Coalition"
 COLDWAR_CYP_R2_coalition_desc:0 "The presidential centre can propose a cooperation agreement with EDEK around independence and social provision. The parties must negotiate a common programme and preserve their distinct political organizations."
 COLDWAR_CYP_R2_coast:0 "Coastal Watch"
 COLDWAR_CYP_R2_coast_desc:0 "Coastal observation and civilian reporting can improve warning. They provide information to the Guard without pretending that Cyprus can build a great-power fleet."
 COLDWAR_CYP_R2_coast_research:0 "Coastal Watch"
 COLDWAR_CYP_R2_coastal_services:0 "Coastal Services"
 COLDWAR_CYP_R2_coastal_services_desc:0 "Commercial offices and reliable public services can support the visitor economy. A larger service centre also requires municipal administration and exposes more revenue to interruption."
 COLDWAR_CYP_R2_command_reorganization:0 "Command Reorganization"
 COLDWAR_CYP_R2_command_reorganization_desc:0 "Army organization -5%. Political power gain -5%."
 COLDWAR_CYP_R2_commercial_credit:0 "Commercial Credit"
 COLDWAR_CYP_R2_commercial_credit_desc:0 "Private credit can channel savings toward expanding businesses. A more selective commercial system favours profitable borrowers and leaves some small producers dissatisfied."
 COLDWAR_CYP_R2_communal_response_desc:0 "The representatives have endorsed the negotiated practical safeguards. Their consent provides a basis for shared services and further constitutional talks."
 COLDWAR_CYP_R2_communal_response_title:0 "The Communal Delegations Respond"
 COLDWAR_CYP_R2_communities_tt:0 "Both communal delegations have accepted the safeguards."
 COLDWAR_CYP_R2_conference:0 "Constitutional Talks"
 COLDWAR_CYP_R2_conference_desc:0 "Representatives of both communities must debate executive powers, representation and security. Opening a conference commits the government to negotiations without deciding their result."
 COLDWAR_CYP_R2_confidence_40_tt:0 "Communal confidence is at least §Y40§!."
 COLDWAR_CYP_R2_confidence_50_tt:0 "Communal confidence is at least §Y50§!."
 COLDWAR_CYP_R2_confidence_65_tt:0 "Communal confidence is at least §Y65§!."
 COLDWAR_CYP_R2_confidence_tt:0 "Communal confidence: $RIGHT|+=0$"
 COLDWAR_CYP_R2_constitutional_tt:0 "The constitutional agreement is ratified."
 COLDWAR_CYP_R2_consult:0 "Consult the Guarantors"
 COLDWAR_CYP_R2_consult_ENG_title:0 "Guarantor Consultation: United Kingdom"
 COLDWAR_CYP_R2_consult_GRE_title:0 "Guarantor Consultation: Greece"
 COLDWAR_CYP_R2_consult_TUR_title:0 "Guarantor Consultation: Turkey"
 COLDWAR_CYP_R2_consult_abstain:0 "Abstain from consultation"
 COLDWAR_CYP_R2_consult_desc:0 "The Treaty of Guarantee calls for consultation when its obligations are threatened. Greece, Turkey and Britain must each choose whether to cooperate in restoring constitutional government."
 COLDWAR_CYP_R2_consult_participate:0 "Participate in consultation"
 COLDWAR_CYP_R2_consultation_deadline_desc:0 "The 30-day consultation period has ended without a settlement. If the Cyprus crisis remains active, Turkey's army crisis begins."
 COLDWAR_CYP_R2_consultation_deadline_title:0 "Consultation Deadline"
 COLDWAR_CYP_R2_consultation_desc:0 "The guarantors have been asked to consult on the constitutional crisis in Cyprus. Silence at the deadline is treated as abstention."
 COLDWAR_CYP_R2_convene_guarantors_tt:0 "The guarantor countries receive §YGuarantor Consultations§!."
 COLDWAR_CYP_R2_cooperative_sector:0 "A Cooperative Sector"
 COLDWAR_CYP_R2_cooperative_sector_desc:0 "Cooperative credit and marketing can strengthen small producers alongside organized labour. Public oversight and guarantees increase administrative responsibilities."
 COLDWAR_CYP_R2_cooperatives:0 "Rural Cooperatives"
 COLDWAR_CYP_R2_cooperatives_desc:0 "Cooperatives can pool credit, storage and marketing for small producers. Public supervision and guarantees add fiscal responsibilities while broadening access to investment."
 COLDWAR_CYP_R2_coup_resolution_desc:0 "The armed network moves against the constitutional government. The prepared defence succeeds in a tie."
 COLDWAR_CYP_R2_coup_resolution_title:0 "The Coup Attempt"
 COLDWAR_CYP_R2_coup_warning_desc:0 "The Greek officer network is preparing to overthrow the government. Its strength will be compared with the Republic's prepared defence after 14 days."
 COLDWAR_CYP_R2_coup_warning_effect_tt:0 "Resolution in 14 days. Defence: 40 + presidential preparedness. Strength: current officer penetration. Ties favour the defender."
 COLDWAR_CYP_R2_coup_warning_title:0 "Warning of a Coup Attempt"
 COLDWAR_CYP_R2_cypriot_command:0 "Cypriot Command"
 COLDWAR_CYP_R2_cypriot_command_desc:0 "Replacing exposed commanders can strengthen loyalty to the republic. The change disrupts existing chains of command and slows training while Cypriot officers gain experience."
 COLDWAR_CYP_R2_cyprus_intervention_forces:0 "Cyprus Intervention Forces"
 COLDWAR_CYP_R2_cyprus_intervention_forces_desc:0 "Navy organization +15%. Naval invasion preparation speed +50%. Amphibious invasion attack +15%. Planning speed +30%. Maximum planning +20%."
 COLDWAR_CYP_R2_cyprus_volunteer_mission:0 "Cyprus Volunteer Mission"
 COLDWAR_CYP_R2_cyprus_volunteer_mission_desc:0 "Volunteer limit +2. Minimum army-size requirement -100%. World-tension requirement -100%. Political power gain -5%."
 COLDWAR_CYP_R2_czech:0 "Inspected Arms Supply"
 COLDWAR_CYP_R2_czech_desc:0 "Czechoslovak supply offers an alternative source of equipment and expertise. UN inspection and agreed storage can reduce the resulting tension at the cost of secrecy and autonomy."
 COLDWAR_CYP_R2_czechoslovakia_accept:0 "Accept the Supervised Czechoslovak Supply"
 COLDWAR_CYP_R2_czechoslovakia_cyp:0 "Supervised Czechoslovak Supply"
 COLDWAR_CYP_R2_czechoslovakia_cyp_desc:0 "A standing, recipient-approved Supervised Czechoslovak Supply agreement with its bilateral conditions in force."
 COLDWAR_CYP_R2_czechoslovakia_cyp_research_1:0 "Supervised Czechoslovak Supply"
 COLDWAR_CYP_R2_czechoslovakia_cze:0 "Cypriot Supply Contracts"
 COLDWAR_CYP_R2_czechoslovakia_cze_desc:0 "A standing, recipient-approved Supervised Czechoslovak Supply agreement with its bilateral conditions in force."
 COLDWAR_CYP_R2_czechoslovakia_decline:0 "Decline the Supervised Czechoslovak Supply"
 COLDWAR_CYP_R2_deal.britain.d:0 "The Republic of Cyprus proposes the terms of the Base Area Civil Access to United Kingdom."
 COLDWAR_CYP_R2_deal.britain.t:0 "Cyprus Agreement: Base Area Civil Access"
