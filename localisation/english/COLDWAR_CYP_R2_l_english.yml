 COLDWAR_CYP_R2_deal_mod_production_speed_industrial_complex_factor_tt:0 "Civilian factory construction: $RIGHT|+=%1$"
 COLDWAR_CYP_R2_deal_mod_research_speed_factor_tt:0 "Research speed: $RIGHT|+=%1$"
 COLDWAR_CYP_R2_deal_mod_stability_factor_tt:0 "Stability: $RIGHT|+=%1$"
 COLDWAR_CYP_R2_deal_mod_training_time_factor_tt:0 "Unit training time: $RIGHT|+=%1$"
 COLDWAR_CYP_R2_deal_officer_penetration_tt:0 "Officer penetration: $RIGHT|+=0$"
 COLDWAR_CYP_R2_deal_weekly_expense_tt:0 "§HAdditional Expenses§!: §R$[?COLDWAR_CYP_R2_tt_weekly|3]§! billion per week"
 COLDWAR_CYP_R2_deal_weekly_income_tt:0 "§HAdditional Income§!: §G$[?COLDWAR_CYP_R2_tt_weekly|3]§! billion per week"
 COLDWAR_CYP_R2_decline:0 "Decline the proposal"
 COLDWAR_CYP_R2_declined_desc:0 "The recipient has declined the proposed agreement."
 COLDWAR_CYP_R2_democratic_socialism:0 "Democratic Socialism"
 COLDWAR_CYP_R2_democratic_socialism_desc:0 "A durable social programme must win support within the republic political system. Labour rights, public services and national independence can form a common platform for continued democratic competition."
 COLDWAR_CYP_R2_diplomatic_service:0 "Diplomatic Corps"
 COLDWAR_CYP_R2_diplomatic_service_desc:0 "A professional diplomatic service can broaden the republic external options. Representation abroad is a continuing administrative commitment, even when it protects room for manoeuvre."
 COLDWAR_CYP_R2_diplomatic_service_research:0 "Diplomatic Corps"
 COLDWAR_CYP_R2_displaced_tt:0 "Families have actually been displaced during the Cyprus conflict."
 COLDWAR_CYP_R2_doctrine:0 "Defence Doctrine"
 COLDWAR_CYP_R2_doctrine_desc:0 "The Guard should train around the island, its available forces and its political obligations. A coherent doctrine can reconcile the selected defence posture with realistic national resources."
 COLDWAR_CYP_R2_doctrine_research:0 "Defence Doctrine"
 COLDWAR_CYP_R2_eastern_terms:0 "Eastern Technical Methods"
 COLDWAR_CYP_R2_eastern_terms_desc:0 "Eastern industrial methods can offer another source of technical knowledge. A stronger reliance on this model narrows diplomatic flexibility without automatically making Cyprus a Soviet ally."
 COLDWAR_CYP_R2_eastern_terms_research:0 "Eastern Technical Methods"
 COLDWAR_CYP_R2_eec_accept:0 "Accept the Cyprus Association Protocol"
 COLDWAR_CYP_R2_eec_bel:0 "Cyprus Association Protocol: Belgium"
 COLDWAR_CYP_R2_eec_bel_desc:0 "A standing Community-approved association term, active while all six partners and Cyprus remain eligible."
 COLDWAR_CYP_R2_eec_cyp:0 "European Association"
 COLDWAR_CYP_R2_eec_cyp_desc:0 "A standing, recipient-approved Cyprus Association Protocol agreement with its bilateral conditions in force."
 COLDWAR_CYP_R2_eec_decline:0 "Decline the Cyprus Association Protocol"
 COLDWAR_CYP_R2_eec_fra:0 "Cyprus Association Protocol: France"
 COLDWAR_CYP_R2_eec_fra_desc:0 "A standing Community-approved association term, active while all six partners and Cyprus remain eligible."
 COLDWAR_CYP_R2_eec_ger:0 "Cyprus Association Protocol: West Germany"
 COLDWAR_CYP_R2_eec_ger_desc:0 "A standing Community-approved association term, active while all six partners and Cyprus remain eligible."
 COLDWAR_CYP_R2_eec_hol:0 "Cyprus Association Protocol: The Netherlands"
 COLDWAR_CYP_R2_eec_hol_desc:0 "A standing Community-approved association term, active while all six partners and Cyprus remain eligible."
 COLDWAR_CYP_R2_eec_ita:0 "Cyprus Association Protocol: Italy"
 COLDWAR_CYP_R2_eec_ita_desc:0 "A standing Community-approved association term, active while all six partners and Cyprus remain eligible."
 COLDWAR_CYP_R2_eec_lux:0 "Cyprus Association Protocol: Luxembourg"
 COLDWAR_CYP_R2_eec_lux_desc:0 "A standing Community-approved association term, active while all six partners and Cyprus remain eligible."
 COLDWAR_CYP_R2_emergency:0 "Presidential Safeguards"
 COLDWAR_CYP_R2_emergency_desc:0 "A protected communications network and clear succession orders can help the legal government survive a sudden attack. Preparedness is useful only if loyal institutions act when the crisis comes."
 COLDWAR_CYP_R2_endure:0 "A Durable Republic"
 COLDWAR_CYP_R2_endure_desc:0 "The republic can replace emergency improvisation with an accepted constitutional order. The settlement does not erase political disagreement or transfer territory by decree."
 COLDWAR_CYP_R2_english_mediation:0 "Joint British Mediation"
 COLDWAR_CYP_R2_english_mediation_CYP_title:0 "Joint Restoration Proposal"
 COLDWAR_CYP_R2_english_mediation_GRE_title:0 "Joint Restoration Proposal"
 COLDWAR_CYP_R2_english_mediation_TUR_title:0 "Joint Restoration Proposal"
 COLDWAR_CYP_R2_english_mediation_deadline_desc:0 "The joint restoration proposal lapses after 14 days without every required signature."
 COLDWAR_CYP_R2_english_mediation_deadline_title:0 "Joint Restoration Proposal Lapses"
 COLDWAR_CYP_R2_english_mediation_desc:0 "Bureaucracy cost +1%."
 COLDWAR_CYP_R2_english_restraint:0 "British Restraint"
 COLDWAR_CYP_R2_english_restraint_desc:0 "Bureaucracy cost -1%. Foreign influence defence -3%."
 COLDWAR_CYP_R2_enterprise:0 "Enterprise and Law"
 COLDWAR_CYP_R2_enterprise_desc:0 "Clerides centre-right current can support private enterprise under a republican legal order. Reforms favouring commercial initiative will face criticism over the distribution of their gains."
 COLDWAR_CYP_R2_event_acknowledge:0 "Acknowledge"
 COLDWAR_CYP_R2_federal_accept:0 "Approve the agreed terms"
 COLDWAR_CYP_R2_federal_centre:0 "A Negotiated Centre"
 COLDWAR_CYP_R2_federal_centre_desc:0 "The centre can invest its political authority in a bicommunal agreement. A more complex government may buy confidence and investment at a continuing administrative cost."
 COLDWAR_CYP_R2_federal_event_desc:0 "Cyprus proposes a negotiated constitutional settlement with safeguards accepted by the communal delegations. Your government is asked to approve the corresponding revision of the treaty framework."
 COLDWAR_CYP_R2_federal_event_title:0 "Terms for a Cypriot Federal Compact"
 COLDWAR_CYP_R2_federal_expired_desc:0 "The proposed compact has not obtained all required approvals. Existing constitutional obligations remain in force."
 COLDWAR_CYP_R2_federal_expired_title:0 "The Constitutional Proposal Remains Unsigned"
 COLDWAR_CYP_R2_federal_refuse:0 "Withhold approval"
 COLDWAR_CYP_R2_geneva:0 "The Geneva Conference"
 COLDWAR_CYP_R2_geneva_conference_tt:0 "The guarantor countries receive §YCeasefire and Constitutional Restoration§!."
 COLDWAR_CYP_R2_geneva_deadline_desc:0 "The 14-day Geneva response period has elapsed. No ceasefire is imposed without every belligerent's consent."
 COLDWAR_CYP_R2_geneva_deadline_title:0 "Geneva Proposal Expires"
 COLDWAR_CYP_R2_geneva_desc:0 "A crisis conference can seek a ceasefire, constitutional restoration and practical guarantees. If negotiations fail, the involved states retain control over their next military and diplomatic choices."
 COLDWAR_CYP_R2_geneva_offer_desc:0 "Every country currently at war with Cyprus receives this proposal. A white peace with Cyprus is applied only if every current Cyprus belligerent accepts."
 COLDWAR_CYP_R2_geneva_offer_title:0 "Ceasefire and Constitutional Restoration"
 COLDWAR_CYP_R2_greek_assistance_desc:0 "Greece has opened an assistance channel during the war. Cyprus may accept or refuse the offer."
 COLDWAR_CYP_R2_greek_assistance_title:0 "Greek Assistance for Cyprus"
 COLDWAR_CYP_R2_greek_civil:0 "Civilian Greek Links"
 COLDWAR_CYP_R2_greek_civil_accept:0 "Accept the Greek-Cypriot Civil Exchange"
 COLDWAR_CYP_R2_greek_civil_cyp:0 "Greek-Cypriot Civil Exchange"
 COLDWAR_CYP_R2_greek_civil_cyp_desc:0 "A standing, recipient-approved Greek-Cypriot Civil Exchange agreement with its bilateral conditions in force."
 COLDWAR_CYP_R2_greek_civil_cyp_research_1:0 "Greek-Cypriot Civil Exchange"
 COLDWAR_CYP_R2_greek_civil_decline:0 "Decline the Greek-Cypriot Civil Exchange"
 COLDWAR_CYP_R2_greek_civil_desc:0 "Education and civilian technical cooperation with Greece need not place the Guard under political tutelage. Both governments must fund the exchange and accept its civilian character."
 COLDWAR_CYP_R2_greek_civil_gre:0 "Cypriot Educational Exchange"
 COLDWAR_CYP_R2_greek_civil_gre_desc:0 "A standing, recipient-approved Greek-Cypriot Civil Exchange agreement with its bilateral conditions in force."
 COLDWAR_CYP_R2_greek_mission:0 "Retain Greek Missions"
 COLDWAR_CYP_R2_greek_mission_desc:0 "A renewed Greek training mission can improve the Guard quickly. Acceptance leaves Cyprus dependent on officers whose government may pursue a different political objective."
 COLDWAR_CYP_R2_greek_network:0 "Greek Officer Network"
 COLDWAR_CYP_R2_greek_network_desc:0 "Stability -2%."
 COLDWAR_CYP_R2_greek_officers:0 "Greek Officers on Cyprus"
 COLDWAR_CYP_R2_greek_officers_desc:0 "Army organization +2%. Unit training time -5%."
 COLDWAR_CYP_R2_greek_training_accept:0 "Accept the Greek Training Mission"
 COLDWAR_CYP_R2_greek_training_cyp:0 "Greek Training Mission"
 COLDWAR_CYP_R2_greek_training_cyp_desc:0 "A standing, recipient-approved Greek Training Mission agreement with its bilateral conditions in force."
 COLDWAR_CYP_R2_greek_training_decline:0 "Decline the Greek Training Mission"
 COLDWAR_CYP_R2_greek_training_gre:0 "Cyprus Training Commitment"
 COLDWAR_CYP_R2_greek_training_gre_desc:0 "A standing, recipient-approved Greek Training Mission agreement with its bilateral conditions in force."
 COLDWAR_CYP_R2_greek_treaty:0 "Greek Guarantor Commitment"
 COLDWAR_CYP_R2_greek_treaty_desc:0 "Foreign influence defence +5%. Stability +2%."
 COLDWAR_CYP_R2_greek_withdrawal:0 "Greek Network Withdrawn"
 COLDWAR_CYP_R2_greek_withdrawal_desc:0 "Stability +3%."
 COLDWAR_CYP_R2_guard:0 "The National Guard"
 COLDWAR_CYP_R2_guard_desc:0 "The Guard needs training, communications and a command responsible to the republic. A modest defence programme must distinguish useful readiness from politically dangerous dependence."
 COLDWAR_CYP_R2_guard_research:0 "The National Guard"
 COLDWAR_CYP_R2_hard_guarantees:0 "Security Before Terms"
 COLDWAR_CYP_R2_hard_guarantees_desc:0 "Negotiations can be conditioned on stronger security guarantees. The position supports defence and bargaining leverage while requiring more resources and delaying communal confidence."
 COLDWAR_CYP_R2_idea_1960_treaty_of_guarantee:0 "1960 Treaty of Guarantee"
 COLDWAR_CYP_R2_idea_1960_treaty_of_guarantee_desc:0 "The1960 settlement protects the independence and territorial integrity of Cyprus and prohibits union or partition. Greece, Turkey and Britain undertake to consult when the treaty order is threatened."
 COLDWAR_CYP_R2_idea_broken_constitutional_partnership:0 "Broken Constitutional Partnership"
 COLDWAR_CYP_R2_idea_broken_constitutional_partnership_desc:0 "The constitutional partnership has broken down. Representation, executive powers and security remain disputed, weakening the authority of common institutions."
 COLDWAR_CYP_R2_idea_command_reorganization:0 "Command Reorganization"
 COLDWAR_CYP_R2_idea_command_reorganization_desc:0 "Replacing exposed commanders can strengthen loyalty to the republic. The change disrupts existing chains of command and slows training while Cypriot officers gain experience."
 COLDWAR_CYP_R2_idea_displaced_families:0 "Displaced Families"
 COLDWAR_CYP_R2_idea_displaced_families_desc:0 "Conflict has disrupted homes, services and the economic life of the island. Recovery requires peace and a funded reconstruction programme."
 COLDWAR_CYP_R2_idea_divided_national_guard_command:0 "Divided National Guard Command"
 COLDWAR_CYP_R2_idea_divided_national_guard_command_desc:0 "Dependence on Greek officers and competing political loyalties complicate civilian control of the National Guard. Training and command reforms require time and resources."
 COLDWAR_CYP_R2_idea_enosis_underground_networks:0 "Enosis Underground Networks"
 COLDWAR_CYP_R2_idea_enosis_underground_networks_desc:0 "Armed supporters of union with Greece challenge the authority of the republic. Clandestine intimidation and violence weaken lawful political competition."
 COLDWAR_CYP_R2_idea_limited_technical_capacity:0 "Limited Technical Capacity"
 COLDWAR_CYP_R2_idea_limited_technical_capacity_desc:0 "Ministries, schools and industry compete for a limited pool of trained specialists. Technical education must expand if national development is to continue."
 COLDWAR_CYP_R2_idea_makarios_presidential_authority:0 "Makarios Presidential Authority"
 COLDWAR_CYP_R2_idea_makarios_presidential_authority_desc:0 "Makarios combines the presidency with the authority of the Orthodox archbishopric. His broad personal mandate can hold together allies with different political aims."
 COLDWAR_CYP_R2_idea_security_investigations:0 "Security Investigations"
 COLDWAR_CYP_R2_idea_security_investigations_desc:0 "Investigations can disrupt clandestine violence, including the National Front and later EOKA B. Arrests and searches also risk polarizing Greek Cypriot politics."
 COLDWAR_CYP_R2_idea_separate_communal_administrations:0 "Separate Communal Administrations"
 COLDWAR_CYP_R2_idea_separate_communal_administrations_desc:0 "Greek Cypriot and Turkish Cypriot communities rely on separate administrations and restricted routes. Fragmented services and markets raise costs and obstruct shared investment."
 COLDWAR_CYP_R2_idea_tourism_interrupted:0 "Tourism Interrupted"
 COLDWAR_CYP_R2_idea_tourism_interrupted_desc:0 "Conflict has disrupted homes, services and the economic life of the island. Recovery requires peace and a funded reconstruction programme."
 COLDWAR_CYP_R2_idea_unficyp_presence:0 "UNFICYP Presence"
 COLDWAR_CYP_R2_idea_unficyp_presence_desc:0 "The United Nations force helps prevent renewed communal fighting and maintains channels between the sides. Its presence encourages restraint during local security disputes."
 COLDWAR_CYP_R2_if_accept_tt:0 "If they accept:"
 COLDWAR_CYP_R2_independent:0 "An Independent State"
 COLDWAR_CYP_R2_independent_desc:0 "The presidency can seek support abroad without placing Cyprus under a foreign political command. Independence remains a negotiating position that must be sustained through institutions and resources."
 COLDWAR_CYP_R2_industrial_standards:0 "Industrial Standards"
 COLDWAR_CYP_R2_industrial_standards_desc:0 "Standards, quality control and vocational instruction help small firms reach external markets. The programme consolidates the manufacturing route instead of duplicating the service investment."
 COLDWAR_CYP_R2_industrial_standards_research:0 "Industrial Standards"
 COLDWAR_CYP_R2_infantry:0 "Infantry Training"
 COLDWAR_CYP_R2_infantry_desc:0 "Infantry training and equipment standards must reflect the Guard that Cyprus can actually sustain. Modernization will improve existing forces without conjuring new divisions."
 COLDWAR_CYP_R2_infantry_research:0 "Infantry Training"
 COLDWAR_CYP_R2_institutions:0 "Independent Institutions"
 COLDWAR_CYP_R2_institutions_desc:0 "Predictable courts and professional administration can protect investment and lawful opposition. The reform depends on initial spending and limits discretionary political favours."
 COLDWAR_CYP_R2_island_market:0 "An Island-Wide Market"
 COLDWAR_CYP_R2_island_market_desc:0 "Agreed access can make the island a larger effective market without requiring communities to abandon their institutions. Commercial benefits depend on the mobility settlement remaining credible."
 COLDWAR_CYP_R2_island_market_research:0 "An Island-Wide Market"
 COLDWAR_CYP_R2_labour:0 "Organized Labour"
 COLDWAR_CYP_R2_labour_desc:0 "AKEL draws strength from organized workers and a parliamentary commitment to independence. Its social programme improves security for households while placing greater demands on commercial returns."
 COLDWAR_CYP_R2_land_improvement:0 "Land Improvement"
 COLDWAR_CYP_R2_land_improvement_desc:0 "Irrigation and access works can raise rural output without taking communal land through administrative fiat. Projects in sensitive districts require the agreement of the affected representatives."
 COLDWAR_CYP_R2_liaison:0 "Local Security Liaison"
 COLDWAR_CYP_R2_liaison_desc:0 "Joint incident reporting can improve security without pretending that the communities already share a trusted command structure. Separate liaison offices will remain an administrative burden."
 COLDWAR_CYP_R2_mediation:0 "Presidential Mediation"
 COLDWAR_CYP_R2_mediation_desc:0 "Makarios can arbitrate between parliamentary allies, the Church and the security services. Personal authority accelerates decisions but leaves oversight dependent on the presidency."
 COLDWAR_CYP_R2_merit:0 "Merit Appointments"
 COLDWAR_CYP_R2_merit_desc:0 "Technical appointments and open examinations can turn professional administration into a durable advantage. The presidency accepts the limits that impartial recruitment places on patronage."
 COLDWAR_CYP_R2_merit_research:0 "Merit Appointments"
 COLDWAR_CYP_R2_military_pressure_tt:0 "Military pressure: $RIGHT|+=0$"
 COLDWAR_CYP_R2_military_terms:0 "Written Mission Terms"
 COLDWAR_CYP_R2_military_terms_desc:0 "Written terms for postings, training and withdrawal can moderate dependence on Greek officers. The agreement improves accountability while retaining the mission and its political risks."
 COLDWAR_CYP_R2_military_terms_research:0 "Written Mission Terms"
 COLDWAR_CYP_R2_mobile:0 "Mobile Reserves"
 COLDWAR_CYP_R2_mobile_desc:0 "A trained mobile reserve can respond to threats before isolated positions are overwhelmed. It requires longer instruction and a continuing readiness budget."
