# IMPERIA COLD WAR — Universal SSR focus programme.
 COLDWAR_SSR_market_category:0 "Sovereign Economic Transition"
 COLDWAR_SSR_market_category_desc:0 "Choose how to settle six industrial lots after beginning a sovereign reform course."
 COLDWAR_SSR_market_cancel_pending:0 "Cancel Pending Settlement"
 COLDWAR_SSR_market_cancel_pending_desc:0 "Cancel the current settlement before execution. No fee or proceeds are paid."
 COLDWAR_SSR_market_light_industry_auction:0 "Light Industry: Competitive Sale"
 COLDWAR_SSR_market_light_industry_auction_desc:0 "Consumer workshops and light manufacturing employ workers whose skills may not find an immediate place in larger industrial combines. A public auction will invite investors to acquire the enterprise with clear obligations and published accounts. The state gains modest proceeds and new management, while accepting a smaller immediate share of the firm's income and the risk of restructuring its workforce."
 COLDWAR_SSR_market_light_industry_workers:0 "Light Industry: Worker Buyout"
 COLDWAR_SSR_market_light_industry_workers_desc:0 "Consumer workshops and light manufacturing employ workers whose skills may not find an immediate place in larger industrial combines. Employees and local investors will acquire the enterprise through a supervised buyout. The settlement protects workplace knowledge and social confidence, but limited capital and concessional financing leave more of the initial burden with the public budget."
 COLDWAR_SSR_market_light_industry_liquidate:0 "Light Industry: Close the Combine"
 COLDWAR_SSR_market_light_industry_liquidate_desc:0 "Consumer workshops and light manufacturing employ workers whose skills may not find an immediate place in larger industrial combines. An unviable enterprise will be closed and its recoverable assets sold. The decision ends a claim on scarce public resources and clears the way for new activity, while destroying productive capacity and leaving the workforce to find a new livelihood."
 COLDWAR_SSR_market_light_industry_public:0 "Light Industry: Public Retooling"
 COLDWAR_SSR_market_light_industry_public_desc:0 "Consumer workshops and light manufacturing employ workers whose skills may not find an immediate place in larger industrial combines. The enterprise will remain in public ownership while its equipment, management and accounts are reorganised. The state preserves productive capacity and employment, taking responsibility for an investment whose return depends on finding viable customers."
 COLDWAR_SSR_market_food_processing_auction:0 "Food Processing: Competitive Sale"
 COLDWAR_SSR_market_food_processing_auction_desc:0 "Processing plants connect rural producers to urban consumers. Their reconstruction must preserve viable agricultural supply as well as factory machinery. A public auction will invite investors to acquire the enterprise with clear obligations and published accounts. The state gains modest proceeds and new management, while accepting a smaller immediate share of the firm's income and the risk of restructuring its workforce."
