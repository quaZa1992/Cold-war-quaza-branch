 COLDWAR_SSR_market_relief_preview_dynamic_modifier:0 "One-Sixth Restructuring Relief"
 COLDWAR_SSR_market_preview_shock_window:0 "Market Opening"
 COLDWAR_SSR_market_preview_shock_fiscal:0 "Fiscal and Social Dislocation"
 COLDWAR_SSR_market_preview_shock_burden:0 "Industrial Restructuring"
 COLDWAR_SSR_market_preview_shock_window_desc:0 "Prices, trade and enterprise privileges will be released in a single programme. New firms and investment can respond quickly to genuine demand, but wages, savings and public revenue will bear the disruption before a new commercial order is secure."
 COLDWAR_SSR_market_preview_shock_fiscal_desc:0 "Prices, trade and enterprise privileges will be released in a single programme. New firms and investment can respond quickly to genuine demand, but wages, savings and public revenue will bear the disruption before a new commercial order is secure."
 COLDWAR_SSR_market_preview_shock_burden_desc:0 "The restructuring burden persists until the six national industrial lots are settled."
 COLDWAR_SSR_market_preview_gradual_window:0 "Orderly Market Entry"
 COLDWAR_SSR_market_preview_gradual_fiscal:0 "Transition Support"
 COLDWAR_SSR_market_preview_gradual_burden:0 "Industrial Restructuring"
 COLDWAR_SSR_market_preview_gradual_window_desc:0 "Essential prices and public commitments will change in stages while enterprises acquire new customers and commercial accounts. The government will preserve a measure of household security, accepting slower investment and a continuing obligation to support weak producers."
 COLDWAR_SSR_market_preview_gradual_fiscal_desc:0 "Essential prices and public commitments will change in stages while enterprises acquire new customers and commercial accounts. The government will preserve a measure of household security, accepting slower investment and a continuing obligation to support weak producers."
