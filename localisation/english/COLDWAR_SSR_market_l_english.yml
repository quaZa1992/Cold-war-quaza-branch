 COLDWAR_SSR_market_preview_directed_window:0 "Public Reconstruction Drive"
 COLDWAR_SSR_market_preview_directed_fiscal:0 "Public Enterprise Support"
 COLDWAR_SSR_market_preview_directed_burden:0 "Industrial Restructuring"
 COLDWAR_SSR_market_preview_directed_window_desc:0 "The state will retain command of strategic enterprises and finance their reconstruction through a national investment plan. Public control can protect jobs and essential supply, but the treasury must carry risks that a private investor would refuse."
