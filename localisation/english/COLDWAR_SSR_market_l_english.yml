 COLDWAR_SSR_market_consumer_durables_auction_desc:0 "Factories producing household goods need new designs, distribution and customers. Their workers face a demanding transition from guaranteed orders to competitive sales. A public auction will invite investors to acquire the enterprise with clear obligations and published accounts. The state gains modest proceeds and new management, while accepting a smaller immediate share of the firm's income and the risk of restructuring its workforce."
