 COLDWAR_SSR_market_industrial_suppliers_auction:0 "Industrial Suppliers: Competitive Sale"
 COLDWAR_SSR_market_industrial_suppliers_auction_desc:0 "Specialised suppliers were organised around larger Union customers. Some can find new orders; others survive only through arrears and public support. A public auction will invite investors to acquire the enterprise with clear obligations and published accounts. The state gains modest proceeds and new management, while accepting a smaller immediate share of the firm's income and the risk of restructuring its workforce."
