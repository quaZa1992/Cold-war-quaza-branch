l_english:
# IMPERIA CW — Cold War: lba legacy remainder — English localisation.
 LBA_cultivate_ira_channels: "Cultivate IRA Channels"
 LBA_cultivate_ira_channels_desc: "British pressure gives us a pressure point of our own. Quiet money, intermediaries and safe routes through sympathetic networks can strengthen Irish republican militancy without immediately exposing Tripoli."
 LBA_ship_semtex_to_belfast: "Ship Semtex to Belfast"
 LBA_ship_semtex_to_belfast_desc: "The security services argue that small shipments of explosives, radios and light arms can keep London distracted for years. The cost is deniability: if the trail leads back to us, Britain will not treat this as rhetoric."
 LBA_lockerbie_operation_focus: "The Lockerbie Option"
 LBA_lockerbie_operation_focus_desc: "A hardline circle inside the security apparatus proposes a spectacular strike against Western aviation. It may frighten the West, backfire before launch, or bring sanctions and crisis home to Libya."
 LBA_nuclear_backchannels: "Nuclear Backchannels"
 LBA_nuclear_backchannels_desc: "A real deterrent cannot be built in public. We will reopen quiet channels to engineers, smugglers, sympathetic states and the ruins of Cold War procurement networks. This will consume money, imports and political attention for years."
 LBA_pan_arab_revolutionary_front: "Pan-Arab Revolutionary Front"
 LBA_pan_arab_revolutionary_front_desc: "Gaddafi's answer to isolation is not silence, but agitation. Libya will present itself as the patron of Arab dignity against monarchs, clients and Western bases."
 LBA_weaponise_oil_contracts: "Weaponise Oil Contracts"
 LBA_weaponise_oil_contracts_desc: "Oil contracts are not only revenue; they are leverage. By threatening access, prices and delivery schedules, Libya can pressure hostile capitals and regional rivals without firing a shot."
 LBA_bankroll_revolutionary_clients: "Bankroll Revolutionary Clients"
 LBA_bankroll_revolutionary_clients_desc: "Tripoli cannot outspend Washington, but it can keep smaller movements alive. Money, training channels and political shelter will spread Western attention thin across several theatres."
 LBA_pressure_western_air_routes: "Pressure Western Air Routes"
 LBA_pressure_western_air_routes_desc: "The West depends on the assumption that its citizens and companies can move safely. Sustained threats, scares and deniable pressure around air routes can drain attention from London and Washington, even when no claim is made."
 LBA_acquire_yellowcake_routes: "Acquire Yellowcake Routes"
 LBA_acquire_yellowcake_routes_desc: "A bomb begins as paperwork, front companies and ore that does not officially exist. Securing reliable yellowcake routes will be slow, expensive, disruptive and easy to expose."
 LBA_nuclear_program_burden: "Nuclear Program Burden"
 LBA_nuclear_program_burden_desc: "Covert procurement, guarded facilities, imported machinery and scientific patronage are consuming resources that could have gone into the civilian economy."
 LibyaColdWar.1.t: "The Lockerbie Operation"
 LibyaColdWar.1.d: "A civilian airliner has been destroyed over Scotland, and Western intelligence agencies are already pointing toward Libyan contacts. Tripoli can deny involvement, but the damage is done: Britain and the United States are preparing a sustained diplomatic campaign against us."
 LibyaColdWar.1.a: "Deny everything."
 LibyaColdWar.2.t: "The Operation Is Shelved"
 LibyaColdWar.2.d: "After weeks of pressure from security hardliners, the operation against Western aviation has been abandoned. The decision preserves deniability and avoids immediate confrontation, though some revolutionary officers now mutter that Libya has lost its nerve."
 LibyaColdWar.2.a: "Discretion serves the revolution."
 LibyaColdWar.3.t: "The Plot Is Exposed"
 LibyaColdWar.3.d: "Foreign services have uncovered traces of a Libyan-linked aviation plot before it could be carried out. The West lacks the spectacle it feared, but it has enough evidence to begin a public campaign against Tripoli."
 LibyaColdWar.3.a: "Contain the scandal."
