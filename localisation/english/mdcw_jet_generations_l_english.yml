l_english:
 # COLDWAR jetgen | Jet generations 1, 2, 2.5 and 3.5 (technologies, airframes, modules, country names).
 # Technologies
 mdcw_gen_1_light: "1st Generation Light Aircraft"
 mdcw_gen_1_light_desc: "Subsonic swept-wing day fighters of the Korean War era such as the F-86 Sabre and the MiG-15. Gunsights, ranging radar and guns, but no guided weapons."
 mdcw_gen_1_medium: "1st Generation Medium Aircraft"
 mdcw_gen_1_medium_desc: "Larger jet fighters, night fighters and fighter-bombers of the early 1950s such as the F-84F, Yak-25 and Javelin. They carry more fuel and a second weapon load."
 mdcw_gen_2_light: "2nd Generation Light Aircraft"
 mdcw_gen_2_light_desc: "Supersonic fighters of the late 1950s such as the F-104, MiG-21 and Mirage III. Afterburning engines, the first air-to-air missiles and simple search radars."
 mdcw_gen_2_medium: "2nd Generation Medium Aircraft"
 mdcw_gen_2_medium_desc: "Heavy supersonic interceptors and strike fighters such as the F-105, Su-7 and Lightning. Range and payload grow, agility stays limited."
 mdcw_fire_control_1963: "Airborne Fire-Control Radar"
 mdcw_fire_control_1963_desc: "Second-wave radars such as the RP-22, Cyrano II and NASARR turn the 2nd generation into Gen 2.5 fighters: either a dedicated interception set or a multi-mode strike set."
 mdcw_pulse_doppler_1972: "Pulse-Doppler Look-Down Radar"
 mdcw_pulse_doppler_1972_desc: "Pulse-doppler sets such as the AWG-10 and Sapfir-23ML see low targets against ground clutter, while digital nav-attack systems serve strike aircraft. The core of Gen 3.5 fighters."
 mdcw_engines_1964: "Improved Afterburning Turbojets"
 mdcw_engines_1964_desc: "Uprated engines such as the R-13, J79-19 and Atar 9K give older airframes the thrust for heavier loads and better climb."
 mdcw_delta_wing_1956: "Delta Wing Design"
 mdcw_delta_wing_1956_desc: "Delta wings such as those of the MiG-21, Mirage III and Draken trade low-speed handling for speed and range at high altitude."
 mdcw_aero_kit_1972: "Leading-Edge Slats and Canards"
 mdcw_aero_kit_1972_desc: "Retrofitted slats and canards on aircraft such as the late F-4E, MiG-23MLD and Kfir improve turning combat at a small cost in top speed."
 mdcw_early_aam_1957: "First Guided Air-to-Air Missiles"
 mdcw_early_aam_1957_desc: "Rear-aspect heat seekers such as the AIM-9B and K-13 or beam-riding and semi-active radar missiles such as the AIM-7 and R530."
 mdcw_cooled_ir_1965: "Cooled Infrared Seekers"
 mdcw_cooled_ir_1965_desc: "Nitrogen-cooled seekers such as the AIM-9D, R-13M and Red Top widen the engagement envelope of heat-seeking missiles."
 mdcw_aam_1976: "All-Aspect and Pulse-Doppler Missiles"
 mdcw_aam_1976_desc: "All-aspect heat seekers such as the AIM-9L and R-60M, or improved radar missiles such as the AIM-7F, Skyflash and R-24R."
 mdcw_ew_1975: "Digital Radar Warning and ECM"
 mdcw_ew_1975_desc: "Digital warning receivers and jamming pods such as the ALR-46, ALQ-119 and SPO-15 tell the pilot who is looking and spoil enemy lock-ons."
 mdcw_pgm_1972: "First Precision-Guided Munitions"
 mdcw_pgm_1972_desc: "Laser-guided bombs such as Paveway I and TV- or laser-guided missiles such as the AGM-65A, Kh-25 and AS.30L, first used in numbers over Vietnam."
