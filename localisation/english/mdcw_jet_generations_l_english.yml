 # Modules
 engine_light_single_0: "1st Generation Light Turbojet"
 engine_light_single_0_desc: "Early centrifugal and axial turbojets of the first jet fighters.$ENGINE_INFO$"
 engine_light_double_0: "1st Generation Twin Light Turbojets"
 engine_light_double_0_desc: "Two early light turbojets side by side.$ENGINE_INFO$"
 engine_jet_single_0: "1st Generation Turbojet"
 engine_jet_single_0_desc: "Early large axial turbojets for heavier fighters.$ENGINE_INFO$"
 engine_jet_double_0: "1st Generation Twin Turbojets"
 engine_jet_double_0_desc: "Two early turbojets for night fighters and fighter-bombers.$ENGINE_INFO$"
 engine_light_single_1b: "Improved Afterburning Light Turbojet"
 engine_light_single_1b_desc: "Uprated afterburning turbojets of the mid-1960s, the step between early and 1970s engines.$ENGINE_INFO$"
 engine_light_double_1b: "Improved Twin Afterburning Light Turbojets"
 engine_light_double_1b_desc: "Two uprated afterburning light turbojets.$ENGINE_INFO$"
 engine_jet_single_1b: "Improved Afterburning Turbojet"
 engine_jet_single_1b_desc: "Uprated large afterburning turbojets of the mid-1960s.$ENGINE_INFO$"
 engine_jet_double_1b: "Improved Twin Afterburning Turbojets"
 engine_jet_double_1b_desc: "Two uprated afterburning turbojets or early afterburning turbofans.$ENGINE_INFO$"
 avionics_manned_0: "Gyro Gunsight and Ranging Radar"
 avionics_manned_0_desc: "A computing gyro gunsight fed by a small ranging radar. The pilot still finds his target by eye.\n\n§GDesigner Hint: Avionics set the groundwork for your aircraft. They provide blanket increases across the board to the majority of aircraft stats, at the cost of increased resource costs§!"
 avionics_manned_1b_intercept: "Interception Radar Set"
 avionics_manned_1b_intercept_desc: "A search-and-track radar built for interception, able to guide radar missiles. Stronger in air combat.\n\n§GDesigner Hint: Avionics set the groundwork for your aircraft. They provide blanket increases across the board to the majority of aircraft stats, at the cost of increased resource costs§!"
 avionics_manned_1b_strike: "Multi-Mode Strike Radar"
 avionics_manned_1b_strike_desc: "A radar with air and ground-mapping modes for fighter-bombers. Stronger in ground attack.\n\n§GDesigner Hint: Avionics set the groundwork for your aircraft. They provide blanket increases across the board to the majority of aircraft stats, at the cost of increased resource costs§!"
 avionics_manned_1c_lookdown: "Pulse-Doppler Look-Down Radar"
 avionics_manned_1c_lookdown_desc: "A pulse-doppler radar that tracks low-flying targets against ground clutter. Best for air superiority.\n\n§GDesigner Hint: Avionics set the groundwork for your aircraft. They provide blanket increases across the board to the majority of aircraft stats, at the cost of increased resource costs§!"
 avionics_manned_1c_navattack: "Digital Nav-Attack System"
 avionics_manned_1c_navattack_desc: "A digital navigation and weapon-aiming computer for low-level strikes. Best for ground attack.\n\n§GDesigner Hint: Avionics set the groundwork for your aircraft. They provide blanket increases across the board to the majority of aircraft stats, at the cost of increased resource costs§!"
 weap_a2a_hardpoint_0_ir: "Early IR Missiles"
 weap_a2a_hardpoint_0_ir_desc: "Rear-aspect heat-seeking missiles. Light and simple, but only useful from behind the target.\n\n§GDesigner Hint: Both missile families fit the same slot. Heat seekers are lighter and keep more agility, radar missiles hit harder at range. Pick one per hardpoint.§!\n\n§WUsing this as the primary weapon will create an§! §BAir Superiority Fighter§!"
 weap_a2a_hardpoint_0_sarh: "Early Radar-Guided Missiles"
 weap_a2a_hardpoint_0_sarh_desc: "Early beam-riding or semi-active radar missiles. Longer range, heavier and less reliable.\n\n§GDesigner Hint: Both missile families fit the same slot. Heat seekers are lighter and keep more agility, radar missiles hit harder at range. Pick one per hardpoint.§!\n\n§WUsing this as the primary weapon will create an§! §BAir Superiority Fighter§!"
 weap_a2a_hardpoint_1_ir: "Cooled-Seeker IR Missiles"
 weap_a2a_hardpoint_1_ir_desc: "Heat seekers with a cooled seeker and a wider launch envelope, an alternative to radar missile hardpoints.\n\n§GDesigner Hint: Both missile families fit the same slot. Heat seekers are lighter and keep more agility, radar missiles hit harder at range. Pick one per hardpoint.§!\n\n§WUsing this as the primary weapon will create an§! §BAir Superiority Fighter§!"
 weap_a2a_hardpoint_1b_ir: "All-Aspect IR Missiles"
 weap_a2a_hardpoint_1b_ir_desc: "Heat seekers that can be fired at the target from any angle, deadly in a turning fight.\n\n§GDesigner Hint: Both missile families fit the same slot. Heat seekers are lighter and keep more agility, radar missiles hit harder at range. Pick one per hardpoint.§!\n\n§WUsing this as the primary weapon will create an§! §BAir Superiority Fighter§!"
 weap_a2a_hardpoint_1b_sarh: "Pulse-Doppler Radar Missiles"
 weap_a2a_hardpoint_1b_sarh_desc: "Semi-active radar missiles with look-down capability and longer reach.\n\n§GDesigner Hint: Both missile families fit the same slot. Heat seekers are lighter and keep more agility, radar missiles hit harder at range. Pick one per hardpoint.§!\n\n§WUsing this as the primary weapon will create an§! §BAir Superiority Fighter§!"
 spec_countermeasures_1b: "Digital RWR and ECM Pods"
 spec_countermeasures_1b_desc: "Digital radar warning receivers and external jamming pods.\n\n$mdcw_spec_countermeasures_hint$"
 spec_aero_kit_1: "Leading-Edge Slats and Canards"
 spec_aero_kit_1_desc: "Slats or small canards that keep the airflow attached at high angles of attack.\n\n§GDesigner Hint: More agility for dogfighting at a small loss of top speed.§!"
 weap_mp_med_hardpoint_1b: "Laser and TV-Guided Pylons"
 weap_mp_med_hardpoint_1b_desc: "Pylons and wiring for the first laser-guided bombs and TV-guided missiles.\n\n$weap_mp_med_hardpoint_1_desc$"
 mdcw_spec_countermeasures_hint: "§GDesigner Hint: Blanket increase in an aircraft's air defense stat. It is recommended to have at least one countermeasure module on an aircraft, especially if the aircraft does not have any stealth modules.§!"
