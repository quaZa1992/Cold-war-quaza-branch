 # Starting Spirits and National Ideas
 COLDWAR_SAF_colour_bar_1: "Colour Bar and Bantu Education"
 COLDWAR_SAF_colour_bar_1_desc: "Statutory job reservation and segregated Bantu Education confine technical and managerial training to a small minority, starving South African industry of skilled engineers and artisans."
 COLDWAR_SAF_colour_bar_2: "Wiehahn Labour Opening"
 COLDWAR_SAF_colour_bar_2_desc: "Reforms inspired by the Wiehahn Commission open selected skilled trades and recognized industrial unions, easing technical bottlenecks at higher public training cost."
 COLDWAR_SAF_colour_bar_3a: "Generational Skills Transition"
 COLDWAR_SAF_colour_bar_3a_desc: "Repealing statutory job reservation and Bantu Education unlocks broader industrial talent, while requiring sustained public spending to overcome decades of educational backlog."
 COLDWAR_SAF_colour_bar_3b: "Selective Artisan Exemptions"
 COLDWAR_SAF_colour_bar_3b_desc: "Limited artisan exemptions preserve white trade-union backing and keep schooling outlays low, yet structural shortages of skilled technicians persist across manufacturing."
 COLDWAR_SAF_oil_vuln_1: "Strategic Oil Vulnerability"
 COLDWAR_SAF_oil_vuln_1_desc: "With no domestic crude oil fields, South Africa relies heavily on maritime tanker deliveries and foreign refineries, leaving transport and industry acutely exposed to oil shocks and embargoes."
 COLDWAR_SAF_oil_vuln_2: "Strategic Fuel Fund and Sasol II"
 COLDWAR_SAF_oil_vuln_2_desc: "Strategic crude stockpiles and the Secunda coal-to-liquids expansion cushion South Africa against sudden supply cutoffs while raising state capital commitments."
 COLDWAR_SAF_oil_vuln_3a: "Sasol Coal-to-Liquids Autarky"
 COLDWAR_SAF_oil_vuln_3a_desc: "Twin Secunda synthetic-fuel complexes convert abundant domestic coal into motor fuel, insulating Pretoria from oil embargoes at the price of heavy recurring state subsidies."
 COLDWAR_SAF_oil_vuln_3b: "Diversified Maritime Energy Supply"
 COLDWAR_SAF_oil_vuln_3b_desc: "Restored maritime energy access and nuclear baseload generation stabilize national power supply while leaving fuel costs tied to international crude markets."
 COLDWAR_SAF_mineral_base_1: "Witwatersrand Mineral Superpower"
 COLDWAR_SAF_mineral_base_1_desc: "Witwatersrand gold and Bushveld strategic minerals anchor national exports and foreign exchange, though commodity booms fuel domestic inflation and sovereign credit premiums."
 COLDWAR_SAF_mineral_base_2a: "Beneficiated Strategic Minerals"
 COLDWAR_SAF_mineral_base_2a_desc: "Domestic ferrochrome smelting and bulk export corridors at Richards Bay and Saldanha maximize mineral earnings alongside heavy capital demands and persistent inflation pressure."
 COLDWAR_SAF_mineral_base_2b: "Diversified Rand Financial Hub"
 COLDWAR_SAF_mineral_base_2b_desc: "Expanding Johannesburg banking, services, and financial governance moderates reliance on raw mineral cycles while retaining a resilient precious-metals foundation."
 COLDWAR_SAF_laager_state_1: "Laager Security State and SWA Overstretch"
 COLDWAR_SAF_laager_state_1_desc: "Security deployments across South West Africa and domestic counter-insurgency structures harden territorial defence while straining logistics, training pipelines, and occupation stability."
 COLDWAR_SAF_laager_state_2a: "Total National Security System"
 COLDWAR_SAF_laager_state_2a_desc: "The State Security Council and National Security Management System tighten counter-insurgency and ideological defence at the cost of chronic unrest and heavier military logistics."
 COLDWAR_SAF_laager_state_2b: "Negotiated Border Settlement"
 COLDWAR_SAF_laager_state_2b_desc: "A negotiated frontier settlement reduces cross-border overstretch and improves regional compliance while leaving lasting post-conflict force-restructuring obligations."
 COLDWAR_SAF_pariah_isolation_1: "International Pariah Isolation"
 COLDWAR_SAF_pariah_isolation_1_desc: "Exit from the Commonwealth, arms restrictions, and international boycotts raise foreign borrowing and investment costs while insulating Pretoria from outside diplomatic leverage."
 COLDWAR_SAF_pariah_isolation_2: "Outward Diplomacy and Quiet Channels"
 COLDWAR_SAF_pariah_isolation_2_desc: "Quiet regional dialogue and pragmatic Western trade channels soften diplomatic isolation, though sovereign credit premiums and capital barriers remain."
 COLDWAR_SAF_pariah_isolation_3a: "Sanctions-Hardened Pariah Network"
 COLDWAR_SAF_pariah_isolation_3a_desc: "Clandestine procurement corridors and sanctions-evasion networks harden South Africa against international embargoes while locking in elevated trade and credit penalties."
 COLDWAR_SAF_pariah_isolation_3b: "Reintegrated Commonwealth Republic"
 COLDWAR_SAF_pariah_isolation_3b_desc: "Constitutional reform and renewed Commonwealth ties restore Western capital markets and diplomatic standing, exposing the domestic economy more directly to global market cycles."
 COLDWAR_SAF_pariah_isolation_3c: "Non-Aligned Liberation Diplomacy"
 COLDWAR_SAF_pariah_isolation_3c_desc: "Non-aligned African diplomacy expands continental influence and regional goodwill, though Western commercial investors remain cautious during structural transformation."
 COLDWAR_SAF_broederbond_1: "Broederbond and Parastatal Patronage"
 COLDWAR_SAF_broederbond_1_desc: "Tightly coordinated Afrikaner institutional networks across Eskom, Iscor, Sasol, and the civil service accelerate state infrastructure projects at the cost of patronage and administrative overhead."
 COLDWAR_SAF_broederbond_2a: "Technocratic State Capitalism"
 COLDWAR_SAF_broederbond_2a_desc: "Technocratic management boards modernize South African parastatals and power generation while preserving entrenched state-sector overhead and patronage ties."
 COLDWAR_SAF_broederbond_2b: "Dismantled Patronage Network"
 COLDWAR_SAF_broederbond_2b_desc: "Dismantling political patronage across state enterprises and ministries curtails corruption and widens the corporate tax base while reducing centralized executive leverage."
 COLDWAR_SAF_irbm_production_1: "Circle Warhead Production"
 COLDWAR_SAF_irbm_production_1_desc: "Dedicated Armscor warhead integration at Kentron Circle streamlines nuclear ballistic missile assembly."
 COLDWAR_SAF_irbm_production_2: "Circle Warhead Production"
 COLDWAR_SAF_irbm_production_2_desc: "Refined warhead diagnostics and missile casing production further lower nuclear ballistic missile fabrication costs."
 COLDWAR_SAF_catalytic_irbm_arsenal: "Six-Device IRBM Arsenal"
 COLDWAR_SAF_catalytic_irbm_arsenal_desc: "Standardized production of six deliverable warheads anchors South Africa's catalytic deterrence missile force."
 COLDWAR_SAF_npt_reintegration: "Voluntary Nuclear Disarmament Dividend"
 COLDWAR_SAF_npt_reintegration_desc: "Dismantling the clandestine nuclear arsenal restores international financial credibility and trade access."
 COLDWAR_SAF_dec_valindaba_run_idea: "Valindaba Y-Plant Enrichment Run"
 COLDWAR_SAF_dec_valindaba_run_idea_desc: "Active aerodynamic enrichment operations at Valindaba accelerate nuclear research at elevated weekly cost."
 COLDWAR_SAF_hist_durban_police_idea: "Natal Riot Policing Surge"
 COLDWAR_SAF_hist_durban_police_idea_desc: "Emergency police deployments across Durban industrial estates strain internal security budgets."
 COLDWAR_SAF_hist_secunda_crash_idea: "Emergency Secunda Expansion"
 COLDWAR_SAF_hist_secunda_crash_idea_desc: "Accelerated synthetic fuel procurement cushions the economy against the Iranian crude cutoff."
 COLDWAR_SAF_hist_spot_tankers_idea: "Spot-Market Crude Premium"
 COLDWAR_SAF_hist_spot_tankers_idea_desc: "Emergency oil purchases on clandestine maritime spot markets raise sovereign borrowing costs."
 COLDWAR_SAF_hist_debt_standstill_idea: "1985 Debt Standstill and Financial Rand"
 COLDWAR_SAF_hist_debt_standstill_idea_desc: "Foreign bank loan rollovers have frozen, forcing emergency exchange controls and a sharp rise in credit costs."
 COLDWAR_SAF_hist_laager_credit_idea: "Fortress Credit Isolation"
 COLDWAR_SAF_hist_laager_credit_idea_desc: "Refusal to open constitutional negotiations deepens foreign capital flight and sovereign borrowing costs."

