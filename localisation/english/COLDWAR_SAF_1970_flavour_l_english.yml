 COLDWAR_SAF_dec_cancel_cub_accord: "Terminate Havana-Pretoria Internationalist Technical and Defence Accord"
 COLDWAR_SAF_dec_cancel_cub_accord_desc: "End the standing bilateral agreement with Cuba."
 COLDWAR_SAF_dec_partner_cancel_cub_accord: "Terminate Havana-Pretoria Internationalist Technical and Defence Accord"
 COLDWAR_SAF_dec_partner_cancel_cub_accord_desc: "End the standing bilateral agreement with South Africa."
 COLDWAR_SAF_BILAT.15.t: "South African Proposal: Havana-Pretoria Internationalist Technical and Defence Accord"
 COLDWAR_SAF_BILAT.15.d: "Envoys from Pretoria have formally submitted the Havana-Pretoria Internationalist Technical and Defence Accord for our government's consideration. Our cabinet has 90 days to accept or refuse the terms through the South African Bilateral Proposals decision menu."
 COLDWAR_SAF_BILAT.15.a: "Review the terms in our decision menu."
 COLDWAR_SAF_BILAT.115.t: "Cuba Accepts: Havana-Pretoria Internationalist Technical and Defence Accord"
 COLDWAR_SAF_BILAT.115.d: "Cuba has ratified the Havana-Pretoria Internationalist Technical and Defence Accord. Both governments have enacted the agreed bilateral terms."
 COLDWAR_SAF_BILAT.115.a: "The agreement is in force."
 COLDWAR_SAF_BILAT.215.t: "Cuba Declines: Havana-Pretoria Internationalist Technical and Defence Accord"
 COLDWAR_SAF_BILAT.215.d: "Cuba has declined our proposal for the Havana-Pretoria Internationalist Technical and Defence Accord at this time."
 COLDWAR_SAF_BILAT.215.a: "Noted."

 # Historical Events
 COLDWAR_SAF_HIST.1.t: "1970 General Election Mandate"
 COLDWAR_SAF_HIST.1.d: "Voters across the Republic have returned the National Party to office with a commanding parliamentary majority, though gains by the United Party and the right-wing Herstigte Nasionale Party split sharpen cabinet tensions over modernization."
 COLDWAR_SAF_HIST.1.a: "Consolidate Vorster's Cabinet"
 COLDWAR_SAF_HIST.1.b: "Court Verligte Business"
 COLDWAR_SAF_HIST.2.t: "1973 Durban Industrial Strikes"
 COLDWAR_SAF_HIST.2.d: "Spontaneous industrial strikes have swept Durban and Pinetown factories as tens of thousands of Black workers demand higher wages, exposing acute tensions in South Africa's segregated labour market."
 COLDWAR_SAF_HIST.2.a: "Enforce Security Crackdown"
 COLDWAR_SAF_HIST.2.b: "Authorize Wage Concessions"
 COLDWAR_SAF_HIST.3.t: "Collapse of Portuguese Africa"
 COLDWAR_SAF_HIST.3.d: "The Carnation Revolution in Lisbon has abruptly ended Portuguese colonial rule in Angola and Mozambique, collapsing the Exercise Alcora buffer overnight and opening South Africa's northern frontier."
 COLDWAR_SAF_HIST.3.a: "Fortify the Northern Frontier"
 COLDWAR_SAF_HIST.3.b: "Launch Southern African Detente"
 COLDWAR_SAF_HIST.4.t: "The Soweto Uprising"
 COLDWAR_SAF_HIST.4.d: "Student marches in Soweto against compulsory Afrikaans schooling have escalated into nationwide unrest, drawing international condemnation and triggering foreign capital flight."
 COLDWAR_SAF_HIST.4.a: "Restore Order by Force"
 COLDWAR_SAF_HIST.4.b: "Suspend Afrikaans Mandate"
 COLDWAR_SAF_HIST.5.t: "UN Security Council Resolution 418"
 COLDWAR_SAF_HIST.5.d: "The United Nations Security Council has passed Resolution 418, imposing a mandatory international arms embargo on South Africa and cancelling major foreign naval and aircraft orders."
 COLDWAR_SAF_HIST.5.a: "Mobilize Armscor Self-Reliance"
 COLDWAR_SAF_HIST.5.b: "Expand Clandestine Procurement"
 COLDWAR_SAF_HIST.6.t: "The Muldergate Scandal"
 COLDWAR_SAF_HIST.6.d: "Revelations of covert Department of Information slush funds have forced Prime Minister John Vorster to step down, leaving the National Party caucus divided between Defence Minister P. W. Botha and moderate cabinet rivals."
 COLDWAR_SAF_HIST.6.a: "P. W. Botha Assumes Premiership"
 COLDWAR_SAF_HIST.6.b: "Verligte Cabinet Compromise"
 COLDWAR_SAF_HIST.7.t: "Iranian Oil Cutoff and Natref Crisis"
 COLDWAR_SAF_HIST.7.d: "The fall of the Shah in Tehran has severed South Africa's primary crude oil supply to the Natref refinery, confronting Pretoria with an acute liquid-fuels emergency."
 COLDWAR_SAF_HIST.7.a: "Crash-Fund Secunda Expansion"
 COLDWAR_SAF_HIST.7.b: "Emergency Spot-Market Tankers"
 COLDWAR_SAF_HIST.8.t: "The Sub-Antarctic Double Flash"
 COLDWAR_SAF_HIST.8.d: "A United States Vela surveillance satellite has recorded a characteristic double flash over the remote sub-Antarctic waters near the Prince Edward Islands, triggering intense international speculation over South African nuclear testing."
 COLDWAR_SAF_HIST.8.a: "Maintain Strict Ambiguity"
 COLDWAR_SAF_HIST.8.b: "Freeze Open Testing"
 COLDWAR_SAF_HIST.9.t: "Rubicon Speech and Debt Standstill"
 COLDWAR_SAF_HIST.9.d: "Following a defiant address in Durban that dashed foreign hopes of immediate constitutional concessions, international banks have refused to roll over short-term South African loans, forcing an urgent response to protect the rand."
 COLDWAR_SAF_HIST.9.a: "Declare Debt Standstill and Financial Rand"
 COLDWAR_SAF_HIST.9.b: "Signal Urgent Creditor Reforms"
 COLDWAR_SAF_HIST.10.t: "Crossroads of the Republic"
 COLDWAR_SAF_HIST.10.d: "Facing prolonged sanctions, financial exhaustion, and a transformed Cold War landscape, the cabinet stands at a historic crossroads between unbanning liberation movements for constitutional talks or hardening the laager."
 COLDWAR_SAF_HIST.10.a: "De Klerk Opens Constitutional Talks"
 COLDWAR_SAF_HIST.10.b: "Hold the Fortress Laager"

 # National Focuses (148)
 COLDWAR_SAF_FLV_np_root: "Vorster's National Mandate"
 COLDWAR_SAF_FLV_np_root_desc: "Prime Minister John Vorster enters the new decade commanding a large parliamentary majority, yet Afrikaner nationalism is straining between pragmatic modernizers and ideological purists."
 COLDWAR_SAF_FLV_pol_np_verligte: "Empower the Verligte Wing"
 COLDWAR_SAF_FLV_pol_np_verligte_desc: "Backing enlightened Afrikaner technocrats and Cape business leaders allows Pretoria to court foreign capital and regional dialogue, at the risk of alienating conservative rural constituencies."
 COLDWAR_SAF_FLV_pol_np_verkrampte: "Uphold Verkrampte Orthodoxy"
 COLDWAR_SAF_FLV_pol_np_verkrampte_desc: "Closing ranks with Transvaal conservatives and the orthodox Broederbond secures party discipline and ideological insulation, though foreign bankers and mining houses warn of rising capital costs."
 COLDWAR_SAF_FLV_pol_np_outward_cabinet: "Outward Policy Directorate"
 COLDWAR_SAF_FLV_pol_np_outward_cabinet_desc: "Foreign Minister Hilgard Muller's diplomats expand quiet commercial missions and sports concessions across Southern Africa and Europe, trading hardline nationalist fervour for diplomatic breathing room."
 COLDWAR_SAF_FLV_pol_np_boss_security: "Expand BOSS Security Powers"
 COLDWAR_SAF_FLV_pol_np_boss_security_desc: "General Hendrik van den Bergh's Bureau of State Security consolidates domestic surveillance and foreign counter-intelligence, tightening Pretoria's grip at growing fiscal and political cost."
 COLDWAR_SAF_FLV_pol_np_muldergate: "The Information Scandal Reckoning"
 COLDWAR_SAF_FLV_pol_np_muldergate_desc: "Revelations of covert slush funds inside the Department of Information shake the cabinet to its foundations, forcing a generational struggle over who will steer the National Party into the 1980s."
 COLDWAR_SAF_FLV_pol_np_botha_total_strategy: "Botha's Total National Strategy"
 COLDWAR_SAF_FLV_pol_np_botha_total_strategy_desc: "Framing regional insurgency and township unrest as a coordinated Soviet onslaught, Prime Minister P. W. Botha fuses military command with cabinet governance under an iron security doctrine."
 COLDWAR_SAF_FLV_pol_np_pragmatic_modernization: "Pragmatic Cabinet Modernization"
 COLDWAR_SAF_FLV_pol_np_pragmatic_modernization_desc: "Sidelining the securocrats after Muldergate, reform-minded ministers streamline the civil service and align Pretoria with the Carlton Conference business agenda."
 COLDWAR_SAF_FLV_pol_np_ssc_nsms: "National Security Management System"
 COLDWAR_SAF_FLV_pol_np_ssc_nsms_desc: "Joint Management Centres across every province subordinate local administration to military and intelligence officers, turning the State Security Council into the republic's true executive."
 COLDWAR_SAF_FLV_pol_np_tbvc_homelands: "TBVC Homeland Consolidation"
 COLDWAR_SAF_FLV_pol_np_tbvc_homelands_desc: "Pretoria finances nominal independence and border-zone infrastructure for Transkei, Bophuthatswana, Venda, and Ciskei, buying compliant local authorities at heavy recurring treasury expense."
 COLDWAR_SAF_FLV_pol_np_broederbond_technocracy: "Broederbond Technocratic Boards"
 COLDWAR_SAF_FLV_pol_np_broederbond_technocracy_desc: "Professionalizing Broederbond boards across Eskom, Iscor, and Sasol curbs patronage waste and expands Johannesburg's administrative capacity while weakening old party-machine loyalties."
 COLDWAR_SAF_FLV_pol_np_urban_councils: "Black Local Authorities Act"
 COLDWAR_SAF_FLV_pol_np_urban_councils_desc: "Granting 99-year leaseholds and elected township councils aims to cultivate a stable urban Black middle class, though underfunded municipalities risk sparking rent boycotts."
 COLDWAR_SAF_FLV_pol_np_emergency_apparatus: "Emergency Security Apparatus"
 COLDWAR_SAF_FLV_pol_np_emergency_apparatus_desc: "Sweeping detention powers, press censorship, and curfews hold insurrection at bay across the townships, hardening the regime against external pressure at severe diplomatic and social cost."
 COLDWAR_SAF_FLV_pol_np_corporate_accord: "Good Hope Business Accord"
 COLDWAR_SAF_FLV_pol_np_corporate_accord_desc: "At the Good Hope Conference in Cape Town, cabinet ministers and mining conglomerates agree to deregulate private capital and co-finance urban housing to avert foreign disinvestment."
 COLDWAR_SAF_FLV_pol_np_crossroads: "Adapt or Die Crossroads"
 COLDWAR_SAF_FLV_pol_np_crossroads_desc: "Caught between industrial labour bottlenecks, international credit freezes, and right-wing revolt, the National Party caucus must decide how far statutory reform can go."
 COLDWAR_SAF_FLV_pol_np_wiehahn_riekert: "Wiehahn and Riekert Reforms"
 COLDWAR_SAF_FLV_pol_np_wiehahn_riekert_desc: "Implementing the Wiehahn and Riekert reports legalizes Black trade unions and scraps statutory job reservation in skilled trades, easing industrial bottlenecks while unleashing organized labour power."
 COLDWAR_SAF_FLV_pol_np_white_artisan: "White Artisan Protection"
 COLDWAR_SAF_FLV_pol_np_white_artisan_desc: "Preserving Mines and Works Act job reservation with narrow exemptions shields white artisan unions from wage competition, securing electoral loyalty at the cost of persistent engineering shortages."
 COLDWAR_SAF_FLV_pol_np_tricameral: "Tricameral Parliament Charter"
 COLDWAR_SAF_FLV_pol_np_tricameral_desc: "A new constitution creates an Executive State Presidency alongside separate White, Coloured, and Indian chambers, co-opting minorities while excluding the Black majority and igniting nationwide civic resistance."
 COLDWAR_SAF_FLV_pol_np_provincial_federal: "Provincial Federal Opening"
 COLDWAR_SAF_FLV_pol_np_provincial_federal_desc: "Bypassing the Tricameral impasse, constitutional planners devolve legislative authority to multiracial provincial assemblies along the KwaZulu-Natal Indaba model, angering party hardliners."
 COLDWAR_SAF_FLV_pol_np_industrial_bargaining: "Industrial Bargaining Order"
 COLDWAR_SAF_FLV_pol_np_industrial_bargaining_desc: "Industrial Courts and statutory wage boards formalize arbitration across the Witwatersrand factories, stabilizing production lines while absorbing higher consumer-goods costs."
 COLDWAR_SAF_FLV_pol_np_executive_charter: "Executive Presidency Charter"
 COLDWAR_SAF_FLV_pol_np_executive_charter_desc: "Merging the offices of Prime Minister and State President concentrates constitutional authority in the Union Buildings, giving Pretoria decisive executive reach to confront escalating domestic and international crises."
 COLDWAR_SAF_FLV_pol_np_rubicon_defiance: "The Rubicon Defiance"
 COLDWAR_SAF_FLV_pol_np_rubicon_defiance_desc: "Refusing to yield to foreign creditors or township demands, the State President declares that South Africa will not be pushed across the Rubicon, rallying hardline resolve as foreign banks freeze credit."
 COLDWAR_SAF_FLV_pol_np_controlled_consociation: "Managed Group Consociation"
 COLDWAR_SAF_FLV_pol_np_controlled_consociation_desc: "Constitutional Minister Chris Heunis engineers an intricate group-rights confederation linking urban councils, homelands, and business elites, buying cautious stability through heavy bureaucratic complexity."
 COLDWAR_SAF_FLV_pol_np_deklerk_transition: "Negotiated Constitutional Transition"
 COLDWAR_SAF_FLV_pol_np_deklerk_transition_desc: "Recognizing that minority rule cannot outlast economic exhaustion and shifting Cold War tides, Pretoria unbans liberation movements and opens constitutional talks to safeguard the republic's future."
 COLDWAR_SAF_FLV_hl_root: "Fortress Republic Mandate"
 COLDWAR_SAF_FLV_hl_root_desc: "Rejecting outward concessions and liberal compromise as fatal weakness, Pretoria's hardliners mobilize the republic around absolute sovereignty and unyielding minority rule."
 COLDWAR_SAF_FLV_pol_hl_verwoerdian_partition: "Verwoerdian Grand Partition"
 COLDWAR_SAF_FLV_pol_hl_verwoerdian_partition_desc: "Following Albert Hertzog and Andries Treurnicht's doctrine of strict territorial partition, the government halts all integration and accelerates separate ethnic homelands regardless of business protests."
 COLDWAR_SAF_FLV_pol_hl_securocrat_junta: "Securocrat Garrison State"
 COLDWAR_SAF_FLV_pol_hl_securocrat_junta_desc: "SADF generals and intelligence chiefs bypass parliamentary factions entirely, reorganizing the republic around permanent garrison readiness and centralized military command."
 COLDWAR_SAF_FLV_pol_hl_strict_influx: "Iron Influx and Pass Control"
 COLDWAR_SAF_FLV_pol_hl_strict_influx_desc: "Expanding pass-law tribunals and statutory job reservation enforces rigid urban segregation, placating orthodox constituencies while locking in chronic technical bottlenecks and heavy clerical costs."
 COLDWAR_SAF_FLV_pol_hl_martial_directorate: "Martial Law Directorate"
 COLDWAR_SAF_FLV_pol_hl_martial_directorate_desc: "Military intelligence absorbs civilian policing into a unified counter-insurgency directorate, crushing underground networks while deepening domestic alienation."
 COLDWAR_SAF_FLV_pol_hl_afrikaans_supremacy: "Afrikaans Cultural Hegemony"
 COLDWAR_SAF_FLV_pol_hl_afrikaans_supremacy_desc: "Elevating Afrikaans across state administration, broadcasting, and schools cements Afrikaner nationalist cohesion while widening the rift with English-speaking commercial capital."
 COLDWAR_SAF_FLV_pol_hl_military_industrial_cmd: "Military-Industrial Command"
 COLDWAR_SAF_FLV_pol_hl_military_industrial_cmd_desc: "Placing heavy engineering plants and Armscor subsidiaries directly under general staff directives accelerates domestic munitions output by squeezing civilian consumption."
 COLDWAR_SAF_FLV_pol_hl_total_laager: "Total Laager Consolidation"
 COLDWAR_SAF_FLV_pol_hl_total_laager_desc: "Preparing the nation for indefinite siege, the cabinet seals political dissent and declares South Africa an uncompromising bastion against regional revolution and Western pressure."
 COLDWAR_SAF_FLV_pol_hl_economic_autarky: "Total Economic Autarky"
 COLDWAR_SAF_FLV_pol_hl_economic_autarky_desc: "Channeling gold revenues into domestic coal-to-liquids, steel, and import substitution insulates the economy from embargoes at the price of steep fiscal subsidies and lost foreign investment."
 COLDWAR_SAF_FLV_pol_hl_commando_mobilization: "Paramilitary Commando Mobilization"
 COLDWAR_SAF_FLV_pol_hl_commando_mobilization_desc: "Expanding rural Area Defence Commandos and Citizen Force call-ups places every white farmstead and border district on permanent military alert, driving up defence payrolls."
 COLDWAR_SAF_FLV_pol_hl_parastatal_command: "Command Parastatal Directive"
 COLDWAR_SAF_FLV_pol_hl_parastatal_command_desc: "Subordinating Eskom, Iscor, and Sasol to state strategic quotas expands heavy manufacturing across the Highveld while stoking inflationary pressures."
 COLDWAR_SAF_FLV_pol_hl_border_garrisons: "Northern Frontier Fortifications"
 COLDWAR_SAF_FLV_pol_hl_border_garrisons_desc: "Constructing hardened fortified outposts and forward logistics depots along the Limpopo frontier secures the northern approaches against cross-border guerrilla columns."
 COLDWAR_SAF_FLV_pol_hl_defy_embargo: "Defy the World Embargo"
 COLDWAR_SAF_FLV_pol_hl_defy_embargo_desc: "Embracing pariah status as a badge of sovereignty, Pretoria institutionalizes shell companies, mineral barter, and exchange controls to outlast international sanctions."
 COLDWAR_SAF_FLV_pol_hl_fortress_capstone: "The Unbroken Fortress Laager"
 COLDWAR_SAF_FLV_pol_hl_fortress_capstone_desc: "Isolated from Western capitals yet fortified by domestic arms, synthetic fuel, and unyielding internal security, the republic stands committed to permanent fortress survival."
 COLDWAR_SAF_FLV_lib_root: "Mandate for Constitutional Reform"
 COLDWAR_SAF_FLV_lib_root_desc: "Breaking two decades of National Party dominance, constitutional reformers and regional federalists take office in Pretoria, pledging rule of law, free enterprise, and an end to international isolation."
 COLDWAR_SAF_FLV_pol_lib_consociational_fed: "Consociational Market Federation"
 COLDWAR_SAF_FLV_pol_lib_consociational_fed_desc: "Blending the United Party's federal charter with KwaZulu's anti-sanctions free-market platform, Pretoria crafts a conservative consociation protecting regional autonomy and private property."
 COLDWAR_SAF_FLV_pol_lib_national_convention: "Multiracial National Convention"
 COLDWAR_SAF_FLV_pol_lib_national_convention_desc: "Fulfilling Helen Suzman and Frederik van Zyl Slabbert's core manifesto, the government summons all South African political movements to a sovereign National Convention to draft a non-racial federation."
 COLDWAR_SAF_FLV_pol_lib_provincial_kwazulu: "Provincial and KwaZulu Autonomy"
 COLDWAR_SAF_FLV_pol_lib_provincial_kwazulu_desc: "Recognizing the Zulu Royal House and elected provincial assemblies as co-equal federal pillars anchors regional stability across Natal and the Cape while limiting central executive reach."
 COLDWAR_SAF_FLV_pol_lib_bill_of_rights: "Entrenched Bill of Rights"
 COLDWAR_SAF_FLV_pol_lib_bill_of_rights_desc: "Enshrining habeas corpus, free association, and non-racial civil liberties in the constitution ends detention without trial and restores domestic and international legal standing."
 COLDWAR_SAF_FLV_pol_lib_enterprise_dereg: "Dismantle Parastatal Patronage"
 COLDWAR_SAF_FLV_pol_lib_enterprise_dereg_desc: "Opening Broederbond-controlled boards to private competition and competitive tendering cuts patronage waste and boosts commercial efficiency at the cost of reduced state-machine leverage."
 COLDWAR_SAF_FLV_pol_lib_constitutional_court: "Independent Constitutional Court"
 COLDWAR_SAF_FLV_pol_lib_constitutional_court_desc: "Empowering an independent judiciary to strike down discriminatory statutes curbs executive abuse and purges party-state patronage, constraining rapid unilateral decrees."
 COLDWAR_SAF_FLV_pol_lib_dismantle_segregation: "Repeal Pass and Group Areas Acts"
 COLDWAR_SAF_FLV_pol_lib_dismantle_segregation_desc: "Abolishing influx control and residential segregation ends the costly pass-law apparatus and opens urban labour mobility, triggering short-term political friction as cities absorb rapid migration."
 COLDWAR_SAF_FLV_pol_lib_gradual_deseg: "Phased Industrial Desegregation"
 COLDWAR_SAF_FLV_pol_lib_gradual_deseg_desc: "Opening skilled trades sector-by-sector in partnership with mining houses and chambers of commerce eases bottlenecks without provoking a white artisan backlash or sudden fiscal shock."
 COLDWAR_SAF_FLV_pol_lib_rapid_colour_bar: "Full Colour Bar Repeal"
 COLDWAR_SAF_FLV_pol_lib_rapid_colour_bar_desc: "Immediately repealing statutory job reservation and unifying public education eliminates South Africa's structural skills bottleneck, demanding heavy recurring schooling outlays and weathering right-wing protests."
 COLDWAR_SAF_FLV_pol_lib_jhb_capital: "Johannesburg Financial Revival"
 COLDWAR_SAF_FLV_pol_lib_jhb_capital_desc: "Expanding the Johannesburg Stock Exchange and commercial banking districts anchors the Rand as Southern Africa's premier capital hub."
 COLDWAR_SAF_FLV_pol_lib_technical_schools: "National Technical Colleges"
 COLDWAR_SAF_FLV_pol_lib_technical_schools_desc: "Opening non-racial engineering technikons across Cape Town and the Reef trains a new generation of artisans and scientists to modernize South African manufacturing."
 COLDWAR_SAF_FLV_pol_lib_western_credit: "Reopen Western Credit Lines"
 COLDWAR_SAF_FLV_pol_lib_western_credit_desc: "Verified constitutional reform restores South Africa's access to London and New York sovereign lending, slashing borrowing risk premiums while tying the Rand closer to global markets."
 COLDWAR_SAF_FLV_pol_lib_federal_capstone: "The Federal Republic of South Africa"
 COLDWAR_SAF_FLV_pol_lib_federal_capstone_desc: "With provincial legislatures seated and Western capital returning, the new Federal Republic charts a prosperous, pluralistic path at the southern tip of Africa."
 COLDWAR_SAF_FLV_anc_root: "Dawn of Majority Rule"
 COLDWAR_SAF_FLV_anc_root_desc: "Apartheid's parliamentary monopoly has fallen and the liberation movements assume power in Pretoria, confronting the immense task of governing a deeply unequal industrial republic."
 COLDWAR_SAF_FLV_pol_anc_freedom_charter: "Freedom Charter Mixed Economy"
 COLDWAR_SAF_FLV_pol_anc_freedom_charter_desc: "Guided by the 1955 Freedom Charter and the Morogoro consensus, the ANC balances social redistribution with private mining enterprise to keep export revenues flowing during reconstruction."
 COLDWAR_SAF_FLV_pol_anc_sacp_vanguard: "Socialist Vanguard Nationalization"
 COLDWAR_SAF_FLV_pol_anc_sacp_vanguard_desc: "Joe Slovo and Yusuf Dadoo's vanguard wing accelerates from national democracy straight into planned socialism, seizing the commanding heights of industry despite fierce Western capital flight."
 COLDWAR_SAF_FLV_pol_anc_pac_africanist: "Pan-Africanist Self-Reliance"
 COLDWAR_SAF_FLV_pol_anc_pac_africanist_desc: "Drawing on Robert Sobukwe's Africanism and Steve Biko's Black Consciousness, the government rejects both Western corporate tutelage and Soviet orthodoxy in favour of continental self-reliance."
 COLDWAR_SAF_FLV_pol_anc_cosatu_tripartite: "Tripartite Labour Compact"
 COLDWAR_SAF_FLV_pol_anc_cosatu_tripartite_desc: "Formalizing collective bargaining between the state, trade union federations, and employers curbs wildcat strikes and anchors social stability at higher recurring wage costs."
 COLDWAR_SAF_FLV_pol_anc_nationalize_mines: "Nationalize the Mining Houses"
 COLDWAR_SAF_FLV_pol_anc_nationalize_mines_desc: "Placing the Witwatersrand gold, platinum, and coal conglomerates under state ownership captures mineral surpluses directly for public planning while provoking severe corporate divestment."
 COLDWAR_SAF_FLV_pol_anc_agrarian_redistribution: "Africanist Land Redistribution"
 COLDWAR_SAF_FLV_pol_anc_agrarian_redistribution_desc: "Repealing the 1913 Natives Land Act and redistributing underutilized commercial estates addresses historic dispossession, testing agricultural supply chains during the transition."
 COLDWAR_SAF_FLV_pol_anc_mixed_parastatals: "Reconstruction Parastatal Fund"
 COLDWAR_SAF_FLV_pol_anc_mixed_parastatals_desc: "Redirecting Eskom and state development banks toward township electrification and civilian manufacturing broadens the domestic market while keeping public budgets under strain."
 COLDWAR_SAF_FLV_pol_anc_central_planning: "Central Planning Directorate"
 COLDWAR_SAF_FLV_pol_anc_central_planning_desc: "A central planning commission coordinates Iscor, Sasol, and nationalized mines under five-year industrial targets, boosting heavy output at the cost of expanding state bureaucracy."
 COLDWAR_SAF_FLV_pol_anc_azanian_coops: "Azanian Cooperative Industry"
 COLDWAR_SAF_FLV_pol_anc_azanian_coops_desc: "Funding community-owned workshops and regional cooperatives across the Eastern Cape builds grassroots African industrial capacity while remaining insulated from foreign multinationals."
 COLDWAR_SAF_FLV_pol_anc_repeal_pass_laws: "Repeal the Pass Laws"
 COLDWAR_SAF_FLV_pol_anc_repeal_pass_laws_desc: "Abolishing the hated dompas system and Group Areas Act restores freedom of movement overnight, ending security-state overstretch while imposing heavy emergency urban housing costs."
 COLDWAR_SAF_FLV_pol_anc_abolish_bantu_ed: "Dismantle Bantu Education"
 COLDWAR_SAF_FLV_pol_anc_abolish_bantu_ed_desc: "Merging segregated school boards into a single universal national education ministry ends the colour-bar research bottleneck permanently, demanding sustained fiscal investment."
 COLDWAR_SAF_FLV_pol_anc_apprenticeship_brigades: "National Technical Brigades"
 COLDWAR_SAF_FLV_pol_anc_apprenticeship_brigades_desc: "Deploying crash adult-literacy and factory-apprenticeship brigades across mines and townships delivers immediate construction gains at lower schooling cost than full university overhaul."
 COLDWAR_SAF_FLV_pol_anc_reintegrate_homelands: "Reintegrate the Homelands"
 COLDWAR_SAF_FLV_pol_anc_reintegrate_homelands_desc: "Dissolving the ethnic Bantustans restores common South African citizenship to millions and eliminates duplicate homeland administrations, requiring delicate absorption of regional civil servants."
 COLDWAR_SAF_FLV_pol_anc_civil_service_reform: "Non-Racial Civil Service Reform"
 COLDWAR_SAF_FLV_pol_anc_civil_service_reform_desc: "Dismantling Broederbond patronage networks across ministries and opening diplomatic missions across Africa transforms the state apparatus, accepting short-term administrative friction."
 COLDWAR_SAF_FLV_pol_anc_nonracial_capstone: "The Non-Racial Republic"
 COLDWAR_SAF_FLV_pol_anc_nonracial_capstone_desc: "With majority democracy institutionalized and continental isolation ended, South Africa stands reborn as a non-racial republic charting an independent course in the Cold War world."
 COLDWAR_SAF_FLV_econ_root: "Gold, Coal, and Strategic Industry"
 COLDWAR_SAF_FLV_econ_root_desc: "Pretoria's Treasury and Economic Advisory Council coordinate mineral royalties, state utilities, and industrial capital to shield South Africa from oil shocks and foreign credit pressure."
 COLDWAR_SAF_FLV_econ_gold_windfall: "Post-Bretton Woods Gold Policy"
 COLDWAR_SAF_FLV_econ_gold_windfall_desc: "As fixed gold parities strain under global monetary turmoil, Pretoria restructures Krugerrand bullion marketing and mining taxation to capture rising free-market gold revenues."
 COLDWAR_SAF_FLV_econ_sasol_ii: "Strategic Fuel Fund and Sasol II"
 COLDWAR_SAF_FLV_econ_sasol_ii_desc: "With zero domestic crude oil and growing Middle East embargo threats, Pretoria expands Strategic Fuel Fund cavern reserves and authorizes the giant Sasol II coal-to-liquids complex at Secunda."
 COLDWAR_SAF_FLV_econ_manpower_commission: "Industrial Manpower Commission"
 COLDWAR_SAF_FLV_econ_manpower_commission_desc: "Severe shortages of engineers, electricians, and toolmakers constrain heavy manufacturing across the Witwatersrand, forcing Pretoria to audit statutory job reservation and technical training."
 COLDWAR_SAF_FLV_econ_fiscal_reserves: "Gold Reserve Discipline"
 COLDWAR_SAF_FLV_econ_fiscal_reserves_desc: "The Reserve Bank sterilizes bullion windfalls into foreign exchange reserves and debt reduction, curbing inflation and defending the rand at the expense of slower public construction."
 COLDWAR_SAF_FLV_econ_megaproject_boom: "State Megaproject Spending"
 COLDWAR_SAF_FLV_econ_megaproject_boom_desc: "Pretoria channels surging gold receipts directly into Industrial Development Corporation factories and heavy public works, accepting higher borrowing costs and inflationary pressure."
 COLDWAR_SAF_FLV_econ_eskom_coal_grid: "Eskom Eastern Transvaal Grid"
 COLDWAR_SAF_FLV_econ_eskom_coal_grid_desc: "Eskom constructs giant pithead coal-fired power stations across the Eastern Transvaal coalfields, linking deep-level mines and smelters into a unified national high-voltage grid."
 COLDWAR_SAF_FLV_econ_apprenticeship_opening: "Technical Colleges and Apprenticeships"
 COLDWAR_SAF_FLV_econ_apprenticeship_opening_desc: "Backing industrial employers over craft unions, Pretoria opens technical colleges and certified apprenticeships to Black artisans, easing the chronic skills bottleneck at higher public education cost."
 COLDWAR_SAF_FLV_econ_artisan_protection: "White Artisan Job Protection"
 COLDWAR_SAF_FLV_econ_artisan_protection_desc: "To preserve white mineworker loyalty and contain right-wing electoral defections, Pretoria upholds statutory job reservation while granting narrow case-by-case industrial exemptions."
 COLDWAR_SAF_FLV_econ_witwatersrand_pgms: "Witwatersrand and Bushveld Minerals"
 COLDWAR_SAF_FLV_econ_witwatersrand_pgms_desc: "Mining houses sink ultra-deep Witwatersrand gold shafts and expand Bushveld platinum and chrome complexes, cementing Western dependence on South African strategic metals."
 COLDWAR_SAF_FLV_econ_sasol_iii_autarky: "Sasol III Coal-to-Liquids Autarky"
 COLDWAR_SAF_FLV_econ_sasol_iii_autarky_desc: "Pretoria doubles down on synthetic fuel autarky by duplicating the Secunda complex with Sasol III, insulating transport and military logistics from oil embargoes at steep permanent fiscal cost."
 COLDWAR_SAF_FLV_econ_koeberg_grid_integration: "Eskom Grid and Koeberg Integration"
 COLDWAR_SAF_FLV_econ_koeberg_grid_integration_desc: "Rather than sink endless subsidies into synthetic fuels, Eskom integrates the Cape nuclear power station into the national grid and relies on diversified maritime fuel tenders."
 COLDWAR_SAF_FLV_econ_reserve_bank: "Reserve Bank and Financial Rand"
 COLDWAR_SAF_FLV_econ_reserve_bank_desc: "Following the De Kock Commission's recommendations, the South African Reserve Bank institutes a dual-tier Financial Rand system to trap disinvesting foreign capital without freezing commercial trade."
 COLDWAR_SAF_FLV_econ_sishen_saldanha: "Sishen-Saldanha Rail and Iscor Steel"
 COLDWAR_SAF_FLV_econ_sishen_saldanha_desc: "Iscor and South African Railways complete the electrified Sishen-Saldanha heavy-haul iron ore corridor and expand Vanderbijlpark steelworks, turning Northern Cape ore into global exports."
 COLDWAR_SAF_FLV_econ_richards_bay: "Richards Bay Coal Terminal"
 COLDWAR_SAF_FLV_econ_richards_bay_desc: "Dredging a deep-water export terminal at Richards Bay opens a dedicated Natal rail outlet for Transvaal steam coal, transforming South Africa into one of the world's premier bulk coal exporters."
 COLDWAR_SAF_FLV_econ_parastatal_audit: "Parastatal Efficiency Commission"
 COLDWAR_SAF_FLV_econ_parastatal_audit_desc: "Spiraling capital overruns at Eskom, Iscor, and the state railways prompt a cabinet audit of Broederbond board appointments and state-enterprise accounting."
 COLDWAR_SAF_FLV_econ_debt_standstill: "Debt Standstill Contingency"
 COLDWAR_SAF_FLV_econ_debt_standstill_desc: "Preparing for a sudden cutoff of short-term foreign bank rollovers, the Treasury drafts unilateral debt-standstill decrees and strict exchange walls to ring-fence domestic liquidity."
 COLDWAR_SAF_FLV_econ_creditor_restructuring: "International Creditor Restructuring"
 COLDWAR_SAF_FLV_econ_creditor_restructuring_desc: "Negotiating directly with Zurich and London creditor syndicates, Pretoria commits scarce foreign reserves to scheduled repayments in exchange for lower sovereign risk premiums."
 COLDWAR_SAF_FLV_econ_uranium_development: "Surveyed Uranium Mine Financing"
 COLDWAR_SAF_FLV_econ_uranium_development_desc: "The Nuclear Fuels Corporation finances paid extraction infrastructure across surveyed uranium deposits in the West Rand, Klerksdorp, Free State, and Rossing, preparing commercial yellowcake output."
 COLDWAR_SAF_FLV_econ_state_capitalism: "Technocratic State Capitalism"
 COLDWAR_SAF_FLV_econ_state_capitalism_desc: "Pretoria retains strategic state control over Eskom, Iscor, and Sasol, replacing political appointees with professional engineers while keeping core utilities anchored to state security priorities."
 COLDWAR_SAF_FLV_econ_parastatal_privatization: "Privatization and Corporate Openness"
 COLDWAR_SAF_FLV_econ_parastatal_privatization_desc: "Listing Sasol and Iscor shares on the Johannesburg Stock Exchange dismantles Broederbond patronage boards, raises private capital, and trims state bureaucracy at the cost of cabinet leverage."
 COLDWAR_SAF_FLV_econ_sanctions_front_companies: "Sanctions-Busting Front Companies"
 COLDWAR_SAF_FLV_econ_sanctions_front_companies_desc: "Pretoria establishes offshore shell firms, reflagged freighters, and third-country re-export hubs to route oil, machinery, and coal around international sanctions at a recurring brokerage premium."
 COLDWAR_SAF_FLV_econ_mineral_beneficiation: "Beneficiated Strategic Minerals"
 COLDWAR_SAF_FLV_econ_mineral_beneficiation_desc: "Domestic smelters convert raw chromite, vanadium, and manganese into high-value ferroalloys before export, maximizing foreign exchange leverage while locking capital into heavy metallurgy."
 COLDWAR_SAF_FLV_econ_rand_financial_hub: "Diversified Rand Financial Hub"
 COLDWAR_SAF_FLV_econ_rand_financial_hub_desc: "Recycling mining surpluses into Johannesburg merchant banks, insurers, and commercial services reduces South Africa's exposure to raw bullion swings while moderating inflation."
 COLDWAR_SAF_FLV_econ_industrial_corridors: "Vaal and Cape Industrial Corridors"
 COLDWAR_SAF_FLV_econ_industrial_corridors_desc: "Linking Vaal Triangle metallurgy with Port Elizabeth and East London manufacturing hubs deepens domestic import-substitution capacity across heavy vehicles, chemicals, and machine tools."
 COLDWAR_SAF_FLV_econ_export_surplus_drive: "Strategic Trade Surplus Drive"
 COLDWAR_SAF_FLV_econ_export_surplus_drive_desc: "Compelled to service external obligations without new foreign credit, Pretoria enforces a permanent merchandise trade surplus backed by export-credit guarantees and port customs modernization."
 COLDWAR_SAF_FLV_econ_mineral_export_authority: "Strategic Minerals Export Board"
 COLDWAR_SAF_FLV_econ_mineral_export_authority_desc: "A unified Minerals Export Board coordinates long-term Western supply contracts for platinum, ferrochrome, and coal, turning South Africa's geological endowment into durable diplomatic insurance."
 COLDWAR_SAF_FLV_econ_capstone: "Resilient Industrial Republic"
 COLDWAR_SAF_FLV_econ_capstone_desc: "Backed by deep-level minerals, resilient energy grids, and hardened financial institutions, South Africa's industrial economy weathers Cold War shocks and sustains long-term national capacity."
 COLDWAR_SAF_FLV_mil_root: "South African Defence Review"
 COLDWAR_SAF_FLV_mil_root_desc: "Minister of Defence P. W. Botha submits a comprehensive White Paper to align the South African Defence Force, Armscor procurement, and Pelindaba research against mounting regional guerrilla pressure and Western arms restrictions."
 COLDWAR_SAF_FLV_mil_sadf_service: "SADF National Service Directive"
 COLDWAR_SAF_FLV_mil_sadf_service_desc: "Extending compulsory national service from nine to twelve months expands the Citizen Force operational pool for northern border deployments while raising active personnel upkeep across the Republic."
 COLDWAR_SAF_FLV_mil_two_year_draft: "Two-Year Citizen Force Conscription"
 COLDWAR_SAF_FLV_mil_two_year_draft_desc: "Doubling compulsory service to twenty-four months with recurring Citizen Force camps secures deep manpower reserves for home defence, at the cost of heavier military payrolls, longer training cycles, and domestic fatigue."
 COLDWAR_SAF_FLV_mil_mobile_columns: "Mechanized Columns and Recces"
 COLDWAR_SAF_FLV_mil_mobile_columns_desc: "Prioritizing fast-moving mechanized task forces, Reconnaissance Commandos, and cross-border strike groups gives the SADF lethal operational reach across Southern Africa while driving up vehicle procurement and field upkeep."
 COLDWAR_SAF_FLV_mil_savannah_lessons: "Lessons of Operation Savannah"
 COLDWAR_SAF_FLV_mil_savannah_lessons_desc: "After-action boards from northern motorized operations overhaul SADF combined-arms tactics, long-range radio coordination, and desert acclimatization to counter Soviet-supplied heavy armour and rocket artillery."
 COLDWAR_SAF_FLV_mil_swa_cutline: "Fortify the SWA Border Cutline"
 COLDWAR_SAF_FLV_mil_swa_cutline_desc: "Hardening forward airfields, mine-cleared patrol roads, and fortified supply hubs along the Ovamboland and Caprivi frontier anchors South West African logistics and enables sustained counter-insurgency operations."
 COLDWAR_SAF_FLV_mil_32_battalion: "32 Battalion and Bush Logistics"
 COLDWAR_SAF_FLV_mil_32_battalion_desc: "Integrating veteran Angolan bush trackers into permanent light-infantry formations alongside mine-protected supply convoys sharpens SADF counter-insurgency and deep-reconnaissance endurance across arid frontier zones."
 COLDWAR_SAF_FLV_mil_total_security: "Total National Security Consolidation"
 COLDWAR_SAF_FLV_mil_total_security_desc: "Elevating the State Security Council and Joint Management Centres into permanent command of border and internal security hardens the fortress Republic against insurgency, accepting permanent training, logistics, and stability costs."
 COLDWAR_SAF_FLV_mil_tripartite_accord: "Tripartite Border Settlement"
 COLDWAR_SAF_FLV_mil_tripartite_accord_desc: "Negotiating mutual disengagement across the Cunene frontier relieves the immense fiscal and logistical burden of South West African occupation, though hardline officers resent yielding forward positions."
 COLDWAR_SAF_FLV_mil_border_doctrine_cap: "Permanent Frontier Command"
 COLDWAR_SAF_FLV_mil_border_doctrine_cap_desc: "Institutionalizing a decade of bush warfare into joint army-air staff colleges and permanent operational headquarters cements the SADF as the premier conventional and counter-insurgency force in Southern Africa."
 COLDWAR_SAF_FLV_mil_armscor_directive: "Armscor Self-Reliance Directive"
 COLDWAR_SAF_FLV_mil_armscor_directive_desc: "Consolidating state munitions boards under the Armaments Corporation of South Africa channels capital into domestic firearms, armoured-vehicle, and optics plants to insulate the Republic against mandatory foreign arms embargoes."
 COLDWAR_SAF_FLV_mil_pretoria_arsenals: "Expand Lyttelton and Kentron Works"
 COLDWAR_SAF_FLV_mil_pretoria_arsenals_desc: "Capitalizing heavy ordnance assembly at Lyttelton Engineering near Pretoria and guided-munitions workshops in the Western Cape scales up serial production of indigenous artillery, armoured hulls, and tactical missiles."
 COLDWAR_SAF_FLV_mil_ratel_g5_olifant: "Ratel, Olifant and G5 Artillery"
 COLDWAR_SAF_FLV_mil_ratel_g5_olifant_desc: "Directing Armscor priority funding to wheeled Ratel infantry fighting vehicles, modernized Olifant main battle tanks, and long-range G5 and G6 155mm howitzers gives ground brigades decisive firepower at heavy procurement cost."
 COLDWAR_SAF_FLV_mil_cheetah_rooivalk: "Atlas Cheetah and Rooivalk SAAF"
 COLDWAR_SAF_FLV_mil_cheetah_rooivalk_desc: "Rebuilding aging Mirage airframes into Atlas Cheetah fighters and funding indigenous Rooivalk attack helicopters contests hostile airspace over the northern border, though pushing airframes and crews raises upkeep and accident rates."
 COLDWAR_SAF_FLV_mil_simonstown_cape: "Simonstown Cape Sea Route"
 COLDWAR_SAF_FLV_mil_simonstown_cape_desc: "Modernizing the Simonstown naval dockyard, Silvermine maritime surveillance headquarters, and Western Cape coastal batteries strengthens South African control over the vital Indian-Atlantic tanker lanes around the Cape of Good Hope."
 COLDWAR_SAF_FLV_mil_daphne_submarines: "Daphne Submarine Patrol Doctrine"
 COLDWAR_SAF_FLV_mil_daphne_submarines_desc: "Commissioning French-built Daphne-class submarines and fast missile strike craft shifts the South African Navy from blue-water escort duties to stealthy coastal denial and long-range South Atlantic reconnaissance."
 COLDWAR_SAF_FLV_mil_indigenous_defence: "Sovereign Defence Industrial Base"
 COLDWAR_SAF_FLV_mil_indigenous_defence_desc: "Linking Armscor subsidiaries with private engineering houses and CSIR laboratories completes a self-sustaining domestic armaments ecosystem capable of supplying armour, munitions, avionics, and naval refits under embargo."
 COLDWAR_SAF_FLV_mil_pelindaba_board: "Pelindaba Atomic Energy Board"
 COLDWAR_SAF_FLV_mil_pelindaba_board_desc: "Expanding the Atomic Energy Board complex at Pelindaba leverages South Africa's vast domestic uranium reserves and SAFARI-1 research reactor to build an independent nuclear physics cadre."
 COLDWAR_SAF_FLV_mil_valindaba_helikon: "Valindaba Helikon Y-Plant"
 COLDWAR_SAF_FLV_mil_valindaba_helikon_desc: "Commissioning UCOR's clandestine Helikon vortex-tube enrichment cascades at Valindaba gives Pretoria an autonomous pathway to highly enriched uranium, drawing steady Treasury funds and foreign intelligence scrutiny."
 COLDWAR_SAF_FLV_mil_armscor_warhead: "Circle Facility Warhead Engineering"
 COLDWAR_SAF_FLV_mil_armscor_warhead_desc: "Transferring nuclear device integration from civilian physicists to Armscor's Circle facility formalizes gun-type fission warhead engineering under strict military compartmentalization."
 COLDWAR_SAF_FLV_mil_kalahari_vastrap: "Kalahari Vastrap Test Shafts"
 COLDWAR_SAF_FLV_mil_kalahari_vastrap_desc: "Drilling deep underground test shafts at Vastrap in the Northern Cape demonstrates technical readiness for a cold fission test, accelerating domestic nuclear engineering while risking satellite detection by both superpowers."
 COLDWAR_SAF_FLV_mil_vela_ambiguity: "Sub-Antarctic Clandestine Test"
 COLDWAR_SAF_FLV_mil_vela_ambiguity_desc: "Pursuing strict policy ambiguity around covert maritime trials near the Prince Edward Islands yields weapons diagnostics and naval coordination while keeping foreign intelligence agencies divided over attribution."
 COLDWAR_SAF_FLV_mil_deterrence_council: "Strategic Nuclear Posture Review"
 COLDWAR_SAF_FLV_mil_deterrence_council_desc: "Cabinet and the Witvlei nuclear committee review whether South Africa's enriched uranium stockpile should anchor a clandestine six-device deterrent or serve as diplomatic leverage for international reintegration."
 COLDWAR_SAF_FLV_mil_catalytic_deterrent: "Six-Device Catalytic Deterrent"
 COLDWAR_SAF_FLV_mil_catalytic_deterrent_desc: "Completing six deliverable gun-type nuclear devices codifies Pretoria's catalytic deterrence doctrine: compelling Western powers to intervene against any existential Soviet-backed invasion, at permanent fiscal upkeep and diplomatic friction."
 COLDWAR_SAF_FLV_mil_npt_dismantlement: "Voluntary Nuclear Dismantlement"
 COLDWAR_SAF_FLV_mil_npt_dismantlement_desc: "Ordering the audited dismantlement of all nuclear devices and preparing accession to the Non-Proliferation Treaty ends recurring weapons upkeep and restores Western commercial confidence, at the price of sharp resistance from the defence establishment."
 COLDWAR_SAF_FLV_mil_atomic_posture_cap: "Atomic Energy Authority Charter"
 COLDWAR_SAF_FLV_mil_atomic_posture_cap_desc: "Reorganizing Pelindaba and UCOR into a unified Atomic Energy Corporation anchors South Africa's civilian nuclear fuel cycle, radioisotope exports, and reactor engineering for the decades ahead."
 COLDWAR_SAF_FLV_for_root: "Department of Foreign Affairs"
 COLDWAR_SAF_FLV_for_root_desc: "Hilgard Muller and the Pretoria foreign service face mounting isolation at the United Nations and the OAU. Coordinating trade, maritime security, and regional envoys is essential to protect South Africa's diplomatic room for manoeuvre."
 COLDWAR_SAF_FLV_for_west_opener: "Cape Sea Route Diplomacy"
 COLDWAR_SAF_FLV_for_west_opener_desc: "With the Suez Canal closed, Western oil tankers and strategic freighters depend on the Cape sea lanes. Pretoria can press London, Paris, Washington, and Bonn to weigh maritime security and mineral access against anti-apartheid pressure."
 COLDWAR_SAF_FLV_for_eng_simonstown: "Renew the Simonstown Agreement"
 COLDWAR_SAF_FLV_for_eng_simonstown_desc: "Reaffirming Royal Navy access to Simonstown Naval Base offers Britain vital South Atlantic patrol infrastructure in exchange for maritime arms cooperation and refit support."
 COLDWAR_SAF_FLV_for_fra_koeberg: "Koeberg and Mirage Licensing"
 COLDWAR_SAF_FLV_for_fra_koeberg_desc: "Paris remains South Africa's most pragmatic Western industrial partner. Commissioning Framatome to build the Koeberg nuclear station alongside licensed Mirage production anchors Eskom's Cape grid and SAAF modernization."
 COLDWAR_SAF_FLV_for_usa_minerals: "Constructive Engagement Minerals"
 COLDWAR_SAF_FLV_for_usa_minerals_desc: "American aerospace and defence industries rely heavily on Bushveld platinum, chrome, and manganese. Formalizing strategic mineral supply channels gives Washington an incentive to favour quiet diplomacy over punitive sanctions."
 COLDWAR_SAF_FLV_for_ger_ruhr: "Ruhr-Witwatersrand Tech Exchange"
 COLDWAR_SAF_FLV_for_ger_ruhr_desc: "West German engineering firms seek lucrative contracts in South African mining, steel, and energy. Channeling Ruhr industrial machinery and commercial aerodynamic-enrichment feasibility exchanges into the Witwatersrand modernizes domestic industry at a commercial premium."
 COLDWAR_SAF_FLV_for_west_credit: "Western Mineral Leverage"
 COLDWAR_SAF_FLV_for_west_credit_desc: "By tying long-term gold, platinum, and ferrochrome contracts to European and American merchant banks, Pretoria reduces sovereign borrowing spreads while accepting greater exposure to Western financial sentiment."
 COLDWAR_SAF_FLV_for_west_lobby: "London and Washington Envoys"
 COLDWAR_SAF_FLV_for_west_lobby_desc: "Sustaining commercial chambers, parliamentary contacts, and trade lobbies across London, Bonn, and Washington slows disinvestment campaigns and buys Pretoria time to manage Western sanctions threats."
 COLDWAR_SAF_FLV_for_pariah_opener: "Clandestine Sanctions Channels"
 COLDWAR_SAF_FLV_for_pariah_opener_desc: "United Nations embargoes cannot be met by Western goodwill alone. Pretoria must cultivate discreet security, oil, and trade partners among other diplomatically embattled states willing to deal without political conditions."
 COLDWAR_SAF_FLV_for_isr_issa: "The ISSA Defence Pact"
 COLDWAR_SAF_FLV_for_isr_issa_desc: "Both Pretoria and Jerusalem face hostile regional coalitions and Western arms restrictions. Trading South African yellowcake and funding for Israeli avionics, intelligence, and weapons engineering strengthens both defence establishments."
 COLDWAR_SAF_FLV_for_per_natref: "Imperial Natref Oil Corridor"
 COLDWAR_SAF_FLV_for_per_natref_desc: "With no domestic crude oil, South Africa depends on Persian Gulf tankers feeding the Natref refinery. Securing long-term crude contracts with Tehran stabilizes fuel reserves, though any political rupture in Iran would sever the lifeline."
 COLDWAR_SAF_FLV_for_tai_uranium: "Pretoria-Taipei Uranium Accord"
 COLDWAR_SAF_FLV_for_tai_uranium_desc: "Upgrading relations with Taipei unites two anti-communist trading states excluded from major international forums. Long-term uranium deliveries for Taiwan's power reactors bring industrial capital and diplomatic solidarity to Pretoria."
 COLDWAR_SAF_FLV_for_pariah_network: "Sanctions-Hardened Pariah Network"
 COLDWAR_SAF_FLV_for_pariah_network_desc: "Accepting that minority rule will never satisfy Western or OAU critics, Pretoria institutionalizes a siege network of covert procurement, sanctions-busting transit hubs, and mutual-survival pacts at the price of permanent credit and trade premiums."
 COLDWAR_SAF_FLV_for_sa_opener: "The Outward-Looking Policy"
 COLDWAR_SAF_FLV_for_sa_opener_desc: "Prime Minister Vorster's outward diplomacy seeks to break the OAU boycott from within by combining regional security guarantees for southern neighbours with economic aid and transport corridors for pragmatic African capitals."
 COLDWAR_SAF_FLV_for_por_alcora: "Exercise Alcora with Lisbon"
 COLDWAR_SAF_FLV_for_por_alcora_desc: "Portuguese Angola and Mozambique shield South Africa's northern approaches. Formalizing Exercise Alcora with Lisbon coordinates counter-insurgency intelligence, logistics, and border airfields across Southern Africa."
 COLDWAR_SAF_FLV_for_mlw_dialogue: "Lilongwe Outward Dialogue"
 COLDWAR_SAF_FLV_for_mlw_dialogue_desc: "President Hastings Banda has defied the OAU by opening formal diplomatic ties with Pretoria. Funding Lilongwe's capital and rail projects demonstrates to conservative African states that dialogue with South Africa pays tangible dividends."
 COLDWAR_SAF_FLV_for_zim_zambezi: "Zambezi Security Corridor"
 COLDWAR_SAF_FLV_for_zim_zambezi_desc: "Salisbury guards the Zambezi frontier against cross-border guerrillas while depending on South African rails and fuel to survive British and UN sanctions. Formalizing joint logistics strengthens forward defence at a diplomatic price."
 COLDWAR_SAF_FLV_for_bot_sacu: "Southern African Customs Accord"
 COLDWAR_SAF_FLV_for_bot_sacu_desc: "Updating the Southern African Customs Union revenue formula with Gaborone secures regional rail transit and commercial integration across the Highveld and Kalahari while giving Botswana stable customs receipts."
 COLDWAR_SAF_FLV_for_moz_nkomati: "The Nkomati Accord"
 COLDWAR_SAF_FLV_for_moz_nkomati_desc: "Once Mozambique stands independent, Pretoria can offer Maputo a pragmatic non-aggression and port-transit pact: reopening Maputo rail traffic and Cahora Bassa power lines in exchange for curbing cross-border guerrilla staging."
 COLDWAR_SAF_FLV_for_sa_constellation: "Constellation of Southern States"
 COLDWAR_SAF_FLV_for_sa_constellation_desc: "Linking Southern Africa's railways, customs unions, and power grids around Johannesburg anchors regional commerce and strengthens Pretoria's diplomatic standing across the subcontinent."
 COLDWAR_SAF_FLV_for_alt_opener: "Post-Apartheid Realignment"
 COLDWAR_SAF_FLV_for_alt_opener_desc: "A reformist or liberation government in Pretoria can break decisively with the laager era, choosing whether to re-enter Western Commonwealth institutions or chart a non-aligned and socialist international course."
 COLDWAR_SAF_FLV_for_commonwealth: "Rejoin the Commonwealth"
 COLDWAR_SAF_FLV_for_commonwealth_desc: "Having ended South Africa's constitutional isolation, Pretoria petitions London and the Commonwealth Secretariat to restore full membership, reopening City of London capital markets and preferential trade at the cost of deeper global market exposure."
 COLDWAR_SAF_FLV_for_lib_solidarity: "Liberation Foreign Policy"
 COLDWAR_SAF_FLV_for_lib_solidarity_desc: "Rejecting subordinate reintegration into Western financial blocks, the liberation government aligns Pretoria's diplomacy with the Frontline States, the Non-Aligned Movement, and the international allies who backed the anti-apartheid struggle."
 COLDWAR_SAF_FLV_for_non_aligned: "Non-Aligned Liberation Diplomacy"
 COLDWAR_SAF_FLV_for_non_aligned_desc: "Taking its seat in the OAU and the Non-Aligned Movement ends South Africa's continental ostracism, unlocking African diplomatic leadership while leaving Western private lenders cautious toward Pretoria's state-led economic agenda."
 COLDWAR_SAF_FLV_for_sov_minerals: "Moscow Strategic Minerals Pact"
 COLDWAR_SAF_FLV_for_sov_minerals_desc: "Aligning South Africa's platinum, chrome, and steel sectors with Soviet heavy-industry credits transforms the Cold War mineral balance, securing industrial plant equipment from Moscow while sharpening Western commercial hostility."
 COLDWAR_SAF_FLV_for_cub_accord: "Havana Technical and Defence Pact"
 COLDWAR_SAF_FLV_for_cub_accord_desc: "Inviting Cuban medical brigades, technical educators, and military instructors to Pretoria cements revolutionary solidarity across the South Atlantic, relieving domestic social costs while drawing Western diplomatic censure."
