l_english:
# IMPERIA CW — Cold War: Imperia resource — English localisation.
 RTT_request_tt: "§YRequest concessions for all resources in this state.§!\nResources in a state can only be requested if they are not already granted to another nation."
 RTT_extra_tt: "Resource consessions can only be requested and cancelled once every 30 days."
 RTT_cancel_tt: "§YCancel all resource concessions given to us in this state.§!"
 RTC_extra_tt: "Resource consessions can only be requested and cancelled once every 30 days.\n§YWarning: There is no confirmation event. Pressing this button will cancel all resource concessions."
 TBT_confirm_tt: "§YCancel all resource concessions given by us in this state.§!"
 TBT_extra_tt: "Resource consessions can only be requested and cancelled once every 30 days.\n§YWarning: This button only works if you have given the resource rights of this state to another nation.§!"

 RW_event.1.t: "Resource Concessions Request From [From.GetNameWithFlag]"
 RW_event.1.d: "[From.GetName] wishes exclusive concessions for resources in [?from.imp_resource_target.GetName]. These concessions will last until cancelled and we will not be able to exploit these resources ourselves."
 RW_event.1.o1: "Accept the request"
 RW_event.1.o2: "Decline the request"
 RW_event.1.o3: "We have already granted these consessions to another nation"

 RW_event.2.t: "[From.GetNameWithFlag] Has Accepted Our Resource Concession Request"
 RW_event.2.d: "[From.GetName] has accepted our resource concessions request in [?imp_resource_target.GetName]. The resources are now ours to exploit."
 RW_event.2.o1: "That's great to hear"

 RW_event.3.t: "[From.GetNameWithFlag] Has Denied Our Resource Concession Request"
 RW_event.3.d: "[From.GetName] has denied our resource concessions request in [?imp_resource_target.GetName]."
 RW_event.3.o1: "That's a shame"

 RW_event.4.t: "[From.GetNameWithFlag] Was Unable To Accept Our Resource Concession Request"
 RW_event.4.d: "[From.GetName] was unable to accept our resource concessions request in [?imp_resource_target.GetName]. The resources in this state are already being exploited by another nation."

 RW_event.5.t: "[From.GetNameWithFlag] Has Cancelled Their Resource Concessions"
 RW_event.5.d: "[From.GetName] has cancelled their resource concessions in [?from.imp_resource_target.GetName]. The resources previously conceded to them are now ours to exploit again."

 RW_event.6.t: "Cancelling Resource Concessions"
 RW_event.6.d: "Do you really want to end all resource concessions in [TB_target_province.GetName]?"
 RW_event.6.o1: "Yes, inform them"
 RW_event.6.o2: "Actually, never mind"

 RW_event.7.t: "[From.GetNameWithFlag] Has Cancelled Our Resource Concessions"
 RW_event.7.d: "[From.GetName] has cancelled our resource concessions in [TB_target_province.GetName]. The resources previously conceded to us are no longer ours to exploit."
 RW_event.7.o1: "We didn't need those resources anyway"

 RW_event.10.t: "Resource Request For [?imp_resource_target.GetName]"
 RW_event.10.d: "Do you really want to request the rights to resource exploitation in [?imp_resource_target.GetName]?"
 RW_event.10.o1: "Yes, I do"
 RW_event.10.o2: "Actually, never mind"

 RW_event.11.t: "Returning Resource Rights For [?imp_resource_target.GetName]"
 RW_event.11.d: "Do you really want to give up our rights to resource exploitation in [?imp_resource_target.GetName]?"
 RW_event.11.o1: "Yes, I do"
 RW_event.11.o2: "Actually, never mind"