l_english:
 # IMPERIA COLD WAR - Imperia economic policies in force in 1970 (tools/start_data_1970/policies.py)
 COLDWAR_ni_value_added_tax:0 "Value Added Tax"
 COLDWAR_ni_value_added_tax_desc:0 "A general tax on value added replaces the old cascade of turnover taxes. France pioneered it in 1954; West Germany, Denmark, the Netherlands, Sweden, Norway and Brazil followed by 1970, and the European Community requires it of every member. Revenue rises steadily with consumption and is hard to evade, but every household pays it at the till, prices jump on the day of introduction, small traders drown in invoices and the tax offices need more staff.\n\n§YCommitment:§! four years before removal."
 COLDWAR_ni_turnkey_plant_imports:0 "Turnkey Plant Imports"
 COLDWAR_ni_turnkey_plant_imports_desc:0 "Complete factories are bought abroad, delivered, built and started by foreign contractors: Fiat's car works at Togliatti, Renault's at Pitesti, Soviet steel mills at Isfahan, Bokaro and Helwan, Western chemical and steel complexes for Algeria. New capacity comes online years faster than domestic engineering could manage, but it is paid for with hard-currency credits, ties the economy to foreign suppliers and spare parts, and leaves domestic design bureaus with little to do.\n\n§YCommitment:§! four years before removal."
 COLDWAR_ni_revolutionary_austerity:0 "Revolutionary Austerity"
 COLDWAR_ni_revolutionary_austerity_desc:0 "'Plain living and hard struggle.' The party teaches that a revolutionary asks nothing of the state: wages stay frozen, rations stay small, and the commune, the work unit and the family carry what welfare there is. Mao's China lives by it, Cuba's moral incentives and Albania's self-reliance preach the same. The population accepts heavy levies without demanding services in return, but the zeal wears thin, workers see no reason to work harder and every shortage is blamed on the cadres.\n\n§YCommitment:§! four years before removal."
 COLDWAR_ni_national_reconciliation:0 "National Reconciliation"
 COLDWAR_ni_national_reconciliation_desc:0 "The prisons open, the exiles may come home and the old quarrels are struck from the record. An amnesty buys the peace of the street, but the men we pardon will organise again, and foreign friends will find open doors.\n\n§YCommitment:§! four years before removal."
 COLDWAR_ni_patronage_state:0 "Patronage State"
 COLDWAR_ni_patronage_state_desc:0 "Jobs in the ministries, contracts for the loyal provinces, a pension for every party veteran. The ruling party binds the country to itself one favour at a time, and the bill arrives in the budget and in the courts.\n\n§YCommitment:§! four years before removal."
 COLDWAR_ni_social_partnership:0 "Social Partnership"
 COLDWAR_ni_social_partnership_desc:0 "Unions, employers and the government settle wages and prices at one table. Strikes become rare and the plants run smoothly, but every agreement is paid for with wage rises that eat into profits and slow the push for efficiency.\n\n§YCommitment:§! four years before removal."
 COLDWAR_ni_consumer_socialism:0 "Consumer Socialism"
 COLDWAR_ni_consumer_socialism_desc:0 "A refrigerator, a television and a small car within reach of every working family: the party promises comfort instead of sacrifice. The shops fill and the grumbling stops, but the plants make goods for the shelves instead of machines for the plan.\n\n§YCommitment:§! four years before removal."
 COLDWAR_ni_food_subsidies:0 "Food Price Subsidies"
 COLDWAR_ni_food_subsidies_desc:0 "Bread, flour, sugar and cooking oil stay at the price the poor can pay, and the treasury covers the difference. No government dares touch the subsidy, because everyone remembers what happens when the price of bread goes up.\n\n§YCommitment:§! four years before removal."
