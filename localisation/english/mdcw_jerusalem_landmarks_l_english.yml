# IMPERIA CW — Cold War: jerusalem landmarks — English localisation.
 landmark_jerusalem_western_wall: "Western Wall"
 landmark_jerusalem_western_wall_plural: "$landmark_jerusalem_western_wall$"
 landmark_jerusalem_western_wall_desc: "The Western Wall in Jerusalem is part of the ancient retaining walls surrounding the Temple Mount. Its massive limestone courses and prayer plaza form a central place of Jewish worship. The country controlling the landmark gains stability and increased monthly population growth."
