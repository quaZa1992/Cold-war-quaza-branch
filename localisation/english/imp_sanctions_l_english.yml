 Imp_sanctions.3.t: "Caught in the Crossfire"
 Imp_sanctions.3.d: "Several of our nation's prominent companies have found themselves in dire straits due to sanctions imposed by us on another nation. With supply chains disrupted and lucrative markets cut off, these companies are struggling to adapt. Reports of layoffs and declining revenue have surfaced, drawing attention from both the media and political circles."
 Imp_sanctions.3.o1: "Provide financial assistance to stabilize these companies"
 Imp_sanctions.3.o2: "Leave them to their fate"
 Imp_sanctions.4.t: "Sanctions? What Sanctions?"
 Imp_sanctions.4.d: "Reports have surfaced that several major national companies have been secretly trading with a sanctioned nation, skirting international regulations. Within the halls of power, the government faces a difficult decision: crack down on these companies at the cost of jobs, or quietly turn a blind eye."
 Imp_sanctions.4.o1: "Crack down on them"
 Imp_sanctions.4.o2: "Let's leave them be"
 Imp_sanctions.5.t: "Athlete Banned"
 Imp_sanctions.5.d: "One of our nation’s top athletes has been banned from a prestigious international competition. The governing body cited “political misconduct” related to their statements in support of the government’s policies, claiming it violated neutrality standards. Supporters of the athlete are outraged, accusing the international governing body of bowing to foreign political agendas."
 Imp_sanctions.5.o1: "Support the Athlete Publically"
 Imp_sanctions.5.o2: "Let it slide"
 Imp_sanctions.6.t: "Key Political Figure Denied Entry"
 Imp_sanctions.6.d: "One of our senior political figures has been denied entry to an important international convention. The host nation cites security concerns and diplomatic sensitivities in their refusal, which many see as a deliberate political maneuver aimed at undermining our influence on the global stage. This snub has quickly become a hot topic in the media."
 Imp_sanctions.6.o1: "We'll organize our own summit"
 Imp_sanctions.6.o2: "Keep Calm"
 Imp_sanctions.7.t: "Sanctions Lead to Disappearance of Operative"
 Imp_sanctions.7.d: "Amid the growing international sanctions, heightened scrutiny on our operatives abroad has reached a critical point. One of our key operatives has mysteriously disappeared, with no official explanation from the host nation. Intelligence suggests that the operative may have been taken by local authorities or gone underground, but details remain scarce."
 Imp_sanctions.7.o1: "Bastards"
 Imp_sanctions.8.t: "Key Figure’s Assets Frozen by Sanctions"
 Imp_sanctions.8.d: "The assets of one of our key political figures have been frozen by international financial authorities. The individual, a prominent government ally, is known for their influence in both domestic and international business affairs."
 Imp_sanctions.8.o1: "Reimburse them"
 Imp_sanctions.8.o2: "That's their loss"
 Imp_sanctions.9.t: "Investors Pull Project Last Minute"
 Imp_sanctions.9.d: "A group of foreign investors has pulled out of a major development project at the last minute. The project, which was expected to provide a significant boost to our economy, has now been left in limbo. The investors cited uncertainty due to growing geopolitical tensions and the threat of further sanctions as their reasons for pulling out."
 Imp_sanctions.9.o1: "Nothing some bribes can't fix"
 Imp_sanctions.9.o2: "We don't need them"
 Imp_sanctions.10.t: "Black Market Activity on the Rise"
 Imp_sanctions.10.d: "As sanctions and economic hardships continue to bite, black market activity is becoming a common sight in our streets and markets. Smuggling, underground trade, and unofficial channels for goods and services are now proper alternatives to the official economy. These illegal transactions are costing us tax income."
 Imp_sanctions.10.o1: "Crack down on it"
 Imp_sanctions.10.o2: "Tolerate it"
 Imp_sanctions.11.t: "Companies Struggling From Sanctions"
 Imp_sanctions.11.d: "One of our key companies, which has long been a cornerstone of our economy, is now facing severe difficulties due to international sanctions. The company relies heavily on foreign trade and access to international markets, and with new restrictions in place, its operations have been crippled. Reports indicate that supply chains have been cut off, production has slowed, and thousands of workers are facing layoffs."
 Imp_sanctions.11.o1: "Provide Assistance"
 Imp_sanctions.11.o2: "Let it fail"
 Imp_sanctions.12.t: "Currency Under Pressure"
 Imp_sanctions.12.d: "Our national currency is currently under pressure due to a combination of external sanctions and internal economic concerns. Investors are growing nervous, and citizens are starting to show signs of anxiety, as the valuta’s exchange rate fluctuates more than usual. The central bank is monitoring the situation, but questions remain about how much longer this trend can be allowed to continue without further intervention. The market is unpredictable, and with each passing day, the pressure on the currency mounts."
 Imp_sanctions.12.o1: "Let the market handle it"
 Imp_sanctions.12.o2: "Impose currency controls"
 Imp_sanctions.13.t: "Preserving Aging Military Systems"
 Imp_sanctions.13.d: "Our military’s ability to maintain and replenish key systems is diminishing. Critical assets like aircraft, tanks, and naval vessels are beginning to show signs of wear. Unfortunately, we cannot find the necessary parts or upgrades abroad. We have been able to patch together what we can, but the reality is becoming clear: without access to spare parts, we are at risk of seeing some of our most crucial systems become non-operational."
 Imp_sanctions.13.o1: "Find the parts on the black market"
 Imp_sanctions.13.o2: "Cannablize our jets for parts"
 Imp_sanctions.13.o3: "Cannablize our light jets for parts"
 Imp_sanctions.13.o4: "Cannablize our tanks for parts"
 Imp_sanctions.14.t: "Officers Caught in Black Market Scandal"
 Imp_sanctions.14.d: "A development within our military ranks has come to our attention. Several high ranking officers have been caught smuggling weapons and military equipment to sell on the black market. With access to arms and supplies growing scarcer due to sanctions, these officers sought to profit from the shortage by diverting military assets for personal gain. The government must now decide how to handle the situation, or risk further damage to military cohesion and public confidence."
 Imp_sanctions.14.o1: "It's just a few guns"
 Imp_sanctions.14.o2: "That's a court martial"
