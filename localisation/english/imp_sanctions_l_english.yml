 Imp_sanctions.1.t: "Sanctions Report"
 Imp_sanctions.1.d: "We sanction these nations — page [?imp_sanc_by_us_page_number|0].\n§YDiplomatic ([?imp_dip_sanc_by_us^num|0]):§!\n[imp_dip_sanc_by_us_empty][imp_dip_sanc_by_us_0][imp_dip_sanc_by_us_1][imp_dip_sanc_by_us_2][imp_dip_sanc_by_us_3]\n§YFinancial ([?imp_fin_sanc_by_us^num|0]):§!\n[imp_fin_sanc_by_us_empty][imp_fin_sanc_by_us_0][imp_fin_sanc_by_us_1][imp_fin_sanc_by_us_2][imp_fin_sanc_by_us_3]\n§YEconomic ([?imp_eco_sanc_by_us^num|0]):§!\n[imp_eco_sanc_by_us_empty][imp_eco_sanc_by_us_0][imp_eco_sanc_by_us_1][imp_eco_sanc_by_us_2][imp_eco_sanc_by_us_3]\n§YMilitary ([?imp_mil_sanc_by_us^num|0]):§!\n[imp_mil_sanc_by_us_empty][imp_mil_sanc_by_us_0][imp_mil_sanc_by_us_1][imp_mil_sanc_by_us_2][imp_mil_sanc_by_us_3]"
 Imp_sanctions.1.o1: "Let them eat cake"
 Imp_sanctions.2.t: "Sanctions Report"
 Imp_sanctions.2.d: "These nations sanction us — page [?imp_sanc_on_us_page_number|0].\n§YDiplomatic ([?imp_dip_sanc_on_us^num|0]):§!\n[imp_dip_sanc_on_us_empty][imp_dip_sanc_on_us_0][imp_dip_sanc_on_us_1][imp_dip_sanc_on_us_2][imp_dip_sanc_on_us_3]\n§YFinancial ([?imp_fin_sanc_on_us^num|0]):§!\n[imp_fin_sanc_on_us_empty][imp_fin_sanc_on_us_0][imp_fin_sanc_on_us_1][imp_fin_sanc_on_us_2][imp_fin_sanc_on_us_3]\n§YEconomic ([?imp_eco_sanc_on_us^num|0]):§!\n[imp_eco_sanc_on_us_empty][imp_eco_sanc_on_us_0][imp_eco_sanc_on_us_1][imp_eco_sanc_on_us_2][imp_eco_sanc_on_us_3]\n§YMilitary ([?imp_mil_sanc_on_us^num|0]):§!\n[imp_mil_sanc_on_us_empty][imp_mil_sanc_on_us_0][imp_mil_sanc_on_us_1][imp_mil_sanc_on_us_2][imp_mil_sanc_on_us_3]"
 Imp_sanctions.2.o1: "Guess we'll eat cake"
 d_imp_consolidate_power: "Consolidate Power"
 d_imp_consolidate_power_desc: "Consolidate power by appointing loyalists to influential positions within the government, military or key institutions."
