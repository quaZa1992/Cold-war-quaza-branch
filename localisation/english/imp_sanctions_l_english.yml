l_english:
 imp_sanctions_decisions: "Sanctions Overview"
 imp_sanctions_decisions_desc: "The impact of §Ysanctions§! and §Rblowback§! is always multiplied by a factor derived from a nation's §Ylevel of independence§!. Nations with low §Yforeign influence§! are more resistant to sanctions and blowback.\n\nThe impact of §Ydiplomatic sanctions§! is calculated using the size of our §YGDP§!. The current strength of our outgoing §Ydiplomatic sanctions§! is §G[?imp_dip_sanction_strength]§!%.\n\nThe impact of §Yfinancial sanctions§! is calculated using our global share of §Yoffice parks§!. The §YInternational Bankers§! internal faction can further amplify their effectiveness. The current strength of outgoing §Yfinancial sanctions§! is §G[?imp_fin_sanction_strength]§!%.\n\nThe impact of §Yeconomic sanctions§! is calculated using the size of our §YGDP§!. The effects of §Yeconomic sanctions§! on neighbouring countries are significantly stronger. The current strength of outgoing §Yeconomic sanctions§! is §G[?imp_eco_sanction_strength]§!%.\n\nThe impact of §Ymilitary sanctions§! is calculated using our global share of §Ymilitary factories§! and §Ydockyards§!. The §YMilitary Industrial Complex§! and §YMaritime Industry§! internal factions can further amplify their effectiveness. The current strength of outgoing §Ymilitary sanctions§! is §G[?imp_mil_sanction_strength]§!%.\n\nImposing sanctions can cause significant §Rblowback§! to our own economy, depending on the relative strength of the nations we sanctioned.\n\n§YIt may take up to a month for newly imposed or lifted sanctions to take effect.§!"
 imp_sanctions_dip_dynamic_modifier: "Diplomatic Sanctions"
 imp_sanctions_dip_dynamic_modifier_desc: "This nation is affected by diplomatic sanctions with a severity of of [?imp_dip_sanctions_p|%]. These sanctions are causing disruptions to their diplomatic activities."
 imp_sanctions_fin_dynamic_modifier: "Financial Sanctions"
 imp_sanctions_fin_dynamic_modifier_desc: "This nation is affected by financial sanctions with a severity of [?imp_fin_sanctions_p|%]. These sanctions are causing disruptions to their financial stability."
 imp_sanctions_eco_dynamic_modifier: "Economic Sanctions"
 imp_sanctions_eco_dynamic_modifier_desc: "This nation is affected by economical sanctions with a severity of [?imp_eco_sanctions_p|%]. These sanctions are causing disruptions to their economical capabilities."
 imp_sanctions_mil_dynamic_modifier: "Military Sanctions"
 imp_sanctions_mil_dynamic_modifier_desc: "This nation is affected by military sanctions with a severity of [?imp_mil_sanctions_p|%]. These sanctions are causing disruptions to their military production."
 imp_sanctions_bb_dynamic_modifier: "Sanctions Blowback"
 imp_sanctions_bb_dynamic_modifier_desc: "This nation is affected by blowback from sanctions they have imposed upon other nations with a severity of [?imp_sanctions_blowback_p|%]."
 IMP_DIPLO_SANCTIONS_IMPOSE_TITLE: "Impose §YDiplomatic Sanctions§!"
 IMP_DIPLO_SANCTIONS_IMPOSE_ACTION_DESC: "We can impose §YDiplomatic Sanctions§! on this nation. This action will send a strong message of disapproval and undermine their global standing, limiting their ability to act both domestically and internationally."
 IMP_DIPLO_SANCTIONS_IMPOSE_SEND: "We will impose a comprehensive package of §YDiplomatic Sanctions§! on the target nation, including freezing monetary assets of individuals, expulsion from organisations, exclusion of sporting events, restricting travel for targeted individuals, expelling diplomatic staff and sanctioning donors of political organisations.\n\nImposing §YDiplomatic Sanctions§! will reduce the §YPolitical Power§! generation, §Yforeign influence§! and §Yinternational standing§! of the targeted nation. §YThe greater your economic power, the greater the impact of these sanctions will be.§!\n\nDiplomatic sanctions have no blowback effects."
 IMP_DIPLO_SANCTIONS_IMPOSE_ACCEPT: "Diplomatic Sanctions!"
 IMP_DIPLO_SANCTIONS_IMPOSE_ACCEPT_DESC: "They have imposed diplomatic sanctions!"
 IMP_DIPLO_SANCTIONS_LIFT_TITLE: "Lift §YDiplomatic Sanctions§!"
 IMP_DIPLO_SANCTIONS_LIFT_ACTION_DESC: "We can lift all §YDiplomatic Sanctions§! on this nation."
 IMP_DIPLO_SANCTIONS_LIFT_SEND: "We will lift any and all §YDiplomatic Sanctions§! on this nation."
 IMP_DIPLO_SANCTIONS_LIFT_ACCEPT: "Diplomatic Sanctions Lifted!"
 IMP_DIPLO_SANCTIONS_LIFT_ACCEPT_DESC: "They have lifted diplomatic sanctions!"
 IMP_FIN_SANCTIONS_IMPOSE_TITLE: "Impose §YFinancial Sanctions§!"
 IMP_FIN_SANCTIONS_IMPOSE_ACTION_DESC: "We can impose §YFinancial Sanctions§! on this nation. This action will target their ability to access global finance markets, limiting their ability to raise money from international sources."
 IMP_FIN_SANCTIONS_IMPOSE_SEND: "We will impose a comprehensive package of §YFinancial Sanctions§! on the target nation, including freezing national assets, restricting access to international banking and payment networks, investment bans, currency trade bans and withdrawal of foreign aid.\n\nImposing §YFinancial Sanctions§! will raise §Yinterest rates§! and the cost of §Yforeign investments§! and reduce the return on §Yinternational investments§!.\n\n Financial sanctions can have considerable blowback effects."
 IMP_FIN_SANCTIONS_IMPOSE_ACCEPT: "Financial Sanctions!"
 IMP_FIN_SANCTIONS_IMPOSE_ACCEPT_DESC: "They have imposed financial sanctions!"
 IMP_FIN_SANCTIONS_LIFT_TITLE: "Lift §YFinancial Sanctions§!"
 IMP_FIN_SANCTIONS_LIFT_ACTION_DESC: "We can lift all §YFinancial Sanctions§! on this nation."
 IMP_FIN_SANCTIONS_LIFT_SEND: "We will lift any and all §YFinancial Sanctions§! on this nation."
 IMP_FIN_SANCTIONS_LIFT_ACCEPT: "Financial Sanctions Lifted!"
 IMP_FIN_SANCTIONS_LIFT_ACCEPT_DESC: "They have lifted financial sanctions!"
 IMP_ECO_SANCTIONS_IMPOSE_TITLE: "Impose §YEconomic Sanctions§!"
 IMP_ECO_SANCTIONS_IMPOSE_ACTION_DESC: "We can impose §YEconomic Sanctions§! on this nation. This action will target their trade and industrial sectors, disrupting their economy by limiting access to goods and markets."
 IMP_ECO_SANCTIONS_IMPOSE_SEND: "We will impose a comprehensive package of §YEconomic Sanctions§! on the target nation, including broad trade restrictions, embargoes on key goods, technology export bans and limitations on access to our market.\n\nImposing §YEconomic Sanctions§! will lower §Ytax gains§!, increase §Ytax cost factor§! and reduce §Yconstruction speeds§! and §Yproductivity§! gains.\n\n Economic sanctions can have massive blowback effects."
 IMP_ECO_SANCTIONS_IMPOSE_ACCEPT: "Economical Sanctions!"
 IMP_ECO_SANCTIONS_IMPOSE_ACCEPT_DESC: "They have imposed economical sanctions!"
 IMP_ECO_SANCTIONS_LIFT_TITLE: "Lift §YEconomic Sanctions§!"
 IMP_ECO_SANCTIONS_LIFT_ACTION_DESC: "We can lift all §YEconomic Sanctions§! on this nation."
 IMP_ECO_SANCTIONS_LIFT_SEND: "We will lift any and all §YEconomical Sanctions§! on this nation."
 IMP_ECO_SANCTIONS_LIFT_ACCEPT: "Economical Sanctions Lifted!"
 IMP_ECO_SANCTIONS_LIFT_ACCEPT_DESC: "They have lifted economical sanctions!"
 IMP_MIL_SANCTIONS_IMPOSE_TITLE: "Impose §YMilitary Sanctions§!"
 IMP_MIL_SANCTIONS_IMPOSE_ACTION_DESC: "We can impose §YMilitary Sanctions§! on this nation. This action will target their military production facilities, disrupting their ability to produce military goods."
 IMP_MIL_SANCTIONS_IMPOSE_SEND: "We will impose a comprehensive package of §YMilitary Sanctions§! on the target nation, including banning the sale of ammunition, halting the supply of critical defense materials and restricting technology transfers.\n\nImposing §YMilitary Sanctions§! will lower §YFactory and Dockyard Output§! of high-tech components and reduce §YResearch Speed§!.\n\n Military sanctions can have blowback effects."
 IMP_MIL_SANCTIONS_IMPOSE_ACCEPT: "Military Sanctions!"
 IMP_MIL_SANCTIONS_IMPOSE_ACCEPT_DESC: "They have imposed military sanctions!"
 IMP_MIL_SANCTIONS_LIFT_TITLE: "Lift §YMilitary Sanctions§!"
 IMP_MIL_SANCTIONS_LIFT_ACTION_DESC: "We can lift all §YMilitary Sanctions§! on this nation."
 IMP_MIL_SANCTIONS_LIFT_SEND: "We will lift any and all §YMilitary Sanctions§! on this nation."
 IMP_MIL_SANCTIONS_LIFT_ACCEPT: "Military Sanctions Lifted!"
 IMP_MIL_SANCTIONS_LIFT_ACCEPT_DESC: "They have lifted military sanctions!"
