l_english:
 deutsche_mark: "Deutsche Mark"
 deutsche_mark_desc: "The historical currency issued by the Deutsche Bundesbank in West Germany. Holding reserves in this currency connects a nation to its international settlement network."
 dem_reserve_users_tt: "Nations using this reserve currency: [?global.dem_reserve_adoption_count|0Y]\n$return_on_investment_modifier$: [?global.proj_roi_dem|%.1+]\n$MODIFIER_TRADE_OPINION_FACTOR$: [?global.proj_trade_dem|%.1Y]\n$inflation_cost_multiplier_modifier$: [?global.proj_infl_dem|%.1-]"
 mdcw_soviet_rouble_desc: "The rouble issued in the Soviet Union."
 mdcw_modern_rouble_desc: "The currency of the Russian Federation, used within the Eurasian Economic Union and among post-Soviet trade partners. Holding rouble reserves integrates a country into Russia's alternative payment systems and energy settlement framework."
 mdcw_historical_guilder_desc: "The national currency of the Netherlands."
 mdcw_modern_guilder_desc: "The historic currency of the Netherlands, reintroduced after leaving the eurozone. Backed by strict monetary discipline and a large trade surplus, the guilder grants full monetary sovereignty and insulates the economy from external shocks, though it forgoes the deep liquidity of the major reserve blocs and is seldom held abroad."
