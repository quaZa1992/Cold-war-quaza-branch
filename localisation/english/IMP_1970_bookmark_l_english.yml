l_english:
 COLD_WAR_1970: "A World Divided"
 COLD_WAR_1970_DESC: "The year 1970 opens beneath the shadow of nuclear parity. The United States is mired in Vietnam, the Soviet Union commands a vast alliance across Eastern Europe, and the Sino-Soviet split has fractured the communist world. Colonial rule is retreating but not yet gone, wars of liberation are spreading across Africa, and a new generation of regional powers is testing the limits of both superpowers. The Cold War is global, unstable, and far from decided."
 USA_COLD_WAR_1970_DESC: "Richard Nixon enters the new decade promising peace with honor while American forces remain committed in Vietnam. Washington must manage domestic division, preserve the Western alliance, exploit the Sino-Soviet split, and decide how far it will go to defend a world order built around American power."
 SOV_COLD_WAR_1970_DESC: "Leonid Brezhnev presides over a superpower at the height of its territorial reach. Moscow dominates the Warsaw Pact, competes with Beijing for leadership of the socialist world, and seeks strategic parity with the United States. Yet the cost of empire and the rigidity of the Soviet system are already accumulating beneath the surface."
 CHI_COLD_WAR_1970_DESC: "Mao Zedong's China is emerging from the most violent phase of the Cultural Revolution. Isolated from both superpowers and locked in a bitter rivalry with the Soviet Union, Beijing must restore the state, secure its frontiers, and decide whether an opening to the United States can transform the global balance."
 ENG_COLD_WAR_1970_DESC: "Harold Wilson's government leads a country adjusting to the end of empire. Britain remains a nuclear power and a pillar of NATO, but economic strain, unrest in Northern Ireland, and uncertainty over Europe force London to redefine the meaning of global influence."
 FRA_COLD_WAR_1970_DESC: "Georges Pompidou inherits Charles de Gaulle's independent course. France stands outside NATO's integrated command while retaining its own nuclear deterrent, balancing European cooperation, strategic autonomy, and influence across its former colonial sphere."
 GER_COLD_WAR_1970_DESC: "Willy Brandt's Federal Republic anchors the Western alliance on the Cold War's central frontier. Ostpolitik offers a path toward practical relations with the East, but every concession risks unsettling Washington, NATO, and the fragile political balance within West Germany."
 DDR_COLD_WAR_1970_DESC: "Walter Ulbricht governs the German Democratic Republic under Soviet protection. The Berlin Wall has secured the regime's borders, but diplomatic isolation, economic dependence, and competition with West Germany leave East Berlin searching for recognition and legitimacy."
 OTHER_COLD_WAR_1970_DESC: "Across Asia, Africa, the Middle East, Europe, and the Americas, states old and new confront decolonization, ideological rivalry, military rule, and superpower intervention. Regional choices can reshape the global Cold War."
