l_english:
# IMPERIA CW — Cold War: Integrated Commonwealth — English localisation.
 COMMONWEALTH_shared_focus: "The Commonwealth Connection"
 COMMONWEALTH_shared_focus_desc: "The Commonwealth is not an empire, a customs union or a military bloc. It is a loose habit of summits, legal familiarity, education links and practical cooperation that can still matter if members choose to use it."
 COMMONWEALTH_preferential_trade_talks: "Preferential Trade Talks"
 COMMONWEALTH_preferential_trade_talks_desc: "A return to imperial preference is not realistic, but sectoral tariff easing, standards recognition and procurement access can still tighten trade between member states."
 COMMONWEALTH_common_standards_board: "Common Standards Board"
 COMMONWEALTH_common_standards_board_desc: "Shared legal traditions and professional bodies give the Commonwealth an advantage in standards work. Harmonised tenders and technical rules make cooperation less ceremonial."
 COMMONWEALTH_investment_forum: "Commonwealth Investment Forum"
 COMMONWEALTH_investment_forum_desc: "Banks, pension funds, commodity exporters and development agencies can be placed in the same room. The results are quieter than grand treaties, but often more useful."
 COMMONWEALTH_scholarship_and_training_scheme: "Scholarship and Training Scheme"
 COMMONWEALTH_scholarship_and_training_scheme_desc: "The Commonwealth Scholarship network and professional exchanges bind elites, universities and civil services across continents."
 COMMONWEALTH_managed_mobility_corridors: "Managed Mobility Corridors"
 COMMONWEALTH_managed_mobility_corridors_desc: "Migration inside the Commonwealth is politically sensitive, but targeted work, education and resettlement channels can increase mobility without pretending borders have vanished."
 COMMONWEALTH_development_corporation_mandate: "Development Corporation Mandate"
 COMMONWEALTH_development_corporation_mandate_desc: "Development cooperation is strongest when it builds ports, roads, power grids and administrative capacity rather than issuing another communique."
 COMMONWEALTH_infrastructure_tender_network: "Infrastructure Tender Network"
 COMMONWEALTH_infrastructure_tender_network_desc: "Member states open a shared tender network for infrastructure and public works, allowing firms and development banks to coordinate more easily."
 COMMONWEALTH_small_states_resilience_window: "Small States Resilience Window"
 COMMONWEALTH_small_states_resilience_window_desc: "Many Commonwealth states are small, maritime and exposed to shocks. Resilience financing gives the organisation a concrete purpose."
 COMMONWEALTH_staff_college_exchanges: "Staff College Exchanges"
 COMMONWEALTH_staff_college_exchanges_desc: "Common doctrine, language and training traditions let Commonwealth forces cooperate without needing a formal alliance."
 COMMONWEALTH_joint_maritime_patrols: "Joint Maritime Patrols"
 COMMONWEALTH_joint_maritime_patrols_desc: "Sea lanes, fisheries, piracy and island security are shared concerns from the Caribbean to the Indian Ocean and the Pacific."
 COMMONWEALTH_peacekeeping_doctrine: "Peacekeeping Doctrine"
 COMMONWEALTH_peacekeeping_doctrine_desc: "Commonwealth states have long experience in UN missions. A shared doctrine turns that habit into training, logistics and command value."
 COMMONWEALTH_cooperative_agenda: "The Cooperative Agenda"
 COMMONWEALTH_cooperative_agenda_desc: "The Commonwealth cannot command its members. It can, however, become a practical network of trade, development, education, mobility and security cooperation."
 COMMONWEALTH_commodity_preference_scheme: "Commodity Preference Scheme"
 COMMONWEALTH_commodity_preference_scheme_desc: "Commonwealth producers can coordinate commodity access, long-term purchasing habits and port-side standards without pretending the old imperial preference system still exists."
 COMMONWEALTH_commonwealth_business_council: "Commonwealth Business Council"
 COMMONWEALTH_commonwealth_business_council_desc: "A permanent council of chambers, banks and development lenders turns summit diplomacy into contracts, offices and portfolio links."
 COMMONWEALTH_skilled_worker_compacts: "Skilled Worker Compacts"
 COMMONWEALTH_skilled_worker_compacts_desc: "Targeted skilled-worker routes let members draw on shared language, legal training and professional qualifications while still carrying integration costs."
 COMMONWEALTH_diaspora_remittance_channels: "Diaspora Remittance Channels"
 COMMONWEALTH_diaspora_remittance_channels_desc: "Diaspora networks are already moving people and money. Formal channels make remittances cheaper, more visible and more useful for development."
 COMMONWEALTH_technical_assistance_missions: "Technical Assistance Missions"
 COMMONWEALTH_technical_assistance_missions_desc: "Engineers, auditors, teachers and administrators are less dramatic than brigades, but they are often what makes Commonwealth cooperation last."
 COMMONWEALTH_health_and_education_links: "Health and Education Links"
 COMMONWEALTH_health_and_education_links_desc: "Medical, university and civil-service exchanges give the Commonwealth a human purpose, although richer members must fund more capacity at home."
 COMMONWEALTH_disaster_relief_exercises: "Disaster Relief Exercises"
 COMMONWEALTH_disaster_relief_exercises_desc: "Island states, maritime states and large federal militaries all benefit from rehearsed relief logistics before the next cyclone, flood or evacuation."
 COMMONWEALTH_common_logistics_pool: "Common Logistics Pool"
 COMMONWEALTH_common_logistics_pool_desc: "Common equipment standards, maintenance access and supply planning make Commonwealth military cooperation cheaper to use, though not free to maintain."
 COMMONWEALTH_heads_of_government_summit: "Heads of Government Summit"
 COMMONWEALTH_heads_of_government_summit_desc: "A serious Commonwealth summit gives members a chance to lock in the network as more than ceremony."
 COMMONWEALTH_networked_commonwealth: "A Networked Commonwealth"
 COMMONWEALTH_networked_commonwealth_desc: "The Commonwealth remains voluntary and loose, but it now has real machinery: trade channels, migration links, development tenders and practical security cooperation."

