 COMMONWEALTH_cooperation_modifier: "Commonwealth Cooperation"
 COMMONWEALTH_cooperation_modifier_desc: "Commonwealth membership gives this country access to a practical cooperation network. Trade, mobility, development, education and defence measures are folded into this single dynamic spirit as the Commonwealth agenda advances."
 COMMONWEALTH_secretariat_channels_idea: "Secretariat Channels"
 COMMONWEALTH_secretariat_channels_idea_desc: "Regular Commonwealth Secretariat channels make diplomacy cheaper and more predictable."
 COMMONWEALTH_preferential_trade_framework_idea: "Preferential Trade Framework"
 COMMONWEALTH_preferential_trade_framework_idea_desc: "Sectoral trade preferences and mutual recognition agreements improve Commonwealth market access."
 COMMONWEALTH_common_standards_idea: "Common Standards"
 COMMONWEALTH_common_standards_idea_desc: "A shared standards framework reduces friction in trade, public tenders and technical cooperation."
 COMMONWEALTH_investment_forum_idea: "Commonwealth Investment Forum"
 COMMONWEALTH_investment_forum_idea_desc: "Investment forums and development finance channels increase access to Commonwealth capital."
 COMMONWEALTH_mobility_framework_idea: "Commonwealth Mobility Framework"
 COMMONWEALTH_mobility_framework_idea_desc: "Managed education, work and resettlement corridors increase mobility while adding integration costs."
 COMMONWEALTH_scholarship_network_idea: "Commonwealth Scholarship Network"
 COMMONWEALTH_scholarship_network_idea_desc: "Scholarship and civil-service training exchanges create long-term administrative and research links."
 COMMONWEALTH_development_cooperation_idea: "Development Cooperation"
 COMMONWEALTH_development_cooperation_idea_desc: "Commonwealth development cooperation supports infrastructure and practical state capacity."
 COMMONWEALTH_small_states_resilience_idea: "Small States Resilience"
 COMMONWEALTH_small_states_resilience_idea_desc: "A resilience window helps small and island states handle infrastructure, shocks and outside pressure."
 COMMONWEALTH_defence_cooperation_idea: "Defence Cooperation"
 COMMONWEALTH_defence_cooperation_idea_desc: "Staff college links and shared doctrine improve training and defensive readiness."
 COMMONWEALTH_maritime_security_idea: "Maritime Security Cooperation"
 COMMONWEALTH_maritime_security_idea_desc: "Joint maritime security work improves naval coordination and protection of shared sea lanes."
 COMMONWEALTH_cooperative_agenda_idea: "Commonwealth Cooperative Agenda"
 COMMONWEALTH_cooperative_agenda_idea_desc: "A broader cooperative agenda gives the Commonwealth practical weight without turning it into a supranational bloc."
 COMMONWEALTH_trade_mission_idea: "Commonwealth Trade Mission"
 COMMONWEALTH_trade_mission_idea_desc: "A temporary trade mission is connecting exporters, chambers of commerce and Commonwealth procurement channels."
 COMMONWEALTH_construction_tender_idea: "Commonwealth Construction Tender"
 COMMONWEALTH_construction_tender_idea_desc: "Participation in Commonwealth infrastructure tenders raises short-term costs while improving construction delivery."
 COMMONWEALTH_staff_college_exchange_idea: "Staff College Exchange"
 COMMONWEALTH_staff_college_exchange_idea_desc: "Officers are rotating through Commonwealth staff colleges, improving doctrine and training efficiency."
 COMMONWEALTH_mobility_window_idea: "Commonwealth Mobility Window"
 COMMONWEALTH_mobility_window_idea_desc: "A temporary mobility window increases skilled migration and refugee pull while adding service pressure."
 COMMONWEALTH_development_fund_contribution_idea: "Development Fund Contribution"
 COMMONWEALTH_development_fund_contribution_idea_desc: "A contribution to Commonwealth development funds costs money now, but strengthens influence and long-term returns."
 COMMONWEALTH_commodity_preference_idea: "Commodity Preference Scheme"
 COMMONWEALTH_commodity_preference_idea_desc: "Sectoral commodity arrangements improve resource exports and trade access without creating a formal customs union."
 COMMONWEALTH_business_council_idea: "Commonwealth Business Council"
 COMMONWEALTH_business_council_idea_desc: "The Commonwealth Business Council links banks, offices and investors across member states."
 COMMONWEALTH_skilled_worker_compact_idea: "Skilled Worker Compact"
 COMMONWEALTH_skilled_worker_compact_idea_desc: "Skilled-worker agreements increase mobility and productivity while adding pressure to public services."
 COMMONWEALTH_remittance_channels_idea: "Diaspora Remittance Channels"
 COMMONWEALTH_remittance_channels_idea_desc: "Better remittance infrastructure gives Commonwealth diasporas a more reliable economic channel."
 COMMONWEALTH_technical_assistance_idea: "Technical Assistance Missions"
 COMMONWEALTH_technical_assistance_idea_desc: "Technical missions improve administration, standards and construction delivery at the cost of more bureaucracy."
 COMMONWEALTH_health_education_links_idea: "Health and Education Links"
 COMMONWEALTH_health_education_links_idea_desc: "Health and education exchanges strengthen social links, but require additional spending capacity."
 COMMONWEALTH_disaster_relief_exercises_idea: "Disaster Relief Exercises"
 COMMONWEALTH_disaster_relief_exercises_idea_desc: "Joint relief planning improves stability and military readiness for humanitarian operations."
 COMMONWEALTH_logistics_pool_idea: "Common Logistics Pool"
 COMMONWEALTH_logistics_pool_idea_desc: "Shared logistics planning improves training and supply resilience, with modest personnel overhead."
 COMMONWEALTH_chogm_agenda_idea: "CHOGM Agenda"
 COMMONWEALTH_chogm_agenda_idea_desc: "The heads of government summit gives Commonwealth cooperation political weight."
 COMMONWEALTH_networked_commonwealth_idea: "Networked Commonwealth"
 COMMONWEALTH_networked_commonwealth_idea_desc: "A practical Commonwealth network improves trade, global links and investment returns."
 COMMONWEALTH_scholarship_network_bonus: "Commonwealth Scholarship Network"

 COMMONWEALTH_cooperation_category: "Commonwealth Cooperation"
 COMMONWEALTH_cooperation_category_desc: "Use the Commonwealth network for practical trade, development, mobility and security cooperation. Decisions become available as the shared Commonwealth focus tree establishes the relevant agreements."
 COMMONWEALTH_host_trade_mission: "Host a Commonwealth Trade Mission"
 COMMONWEALTH_host_trade_mission_desc: "Invite Commonwealth chambers of commerce and exporters. The results are folded into the shared Commonwealth member spirit."
 COMMONWEALTH_bid_for_infrastructure_contract: "Bid for Infrastructure Contracts"
 COMMONWEALTH_bid_for_infrastructure_contract_desc: "Use the Commonwealth tender network to bid for infrastructure and development contracts, adding capacity and some administrative overhead to the member spirit."
 COMMONWEALTH_open_mobility_window: "Open a Mobility Window"
 COMMONWEALTH_open_mobility_window_desc: "Expand managed work, study and resettlement channels for Commonwealth citizens, increasing mobility and service pressure through the member spirit."
 COMMONWEALTH_expand_staff_college_places: "Expand Staff College Places"
 COMMONWEALTH_expand_staff_college_places_desc: "Open more staff college slots for Commonwealth officer exchanges, improving training while adding personnel overhead through the member spirit."
 COMMONWEALTH_contribute_to_development_fund: "Contribute to the Development Fund"
 COMMONWEALTH_contribute_to_development_fund_desc: "Contribute money and expertise to Commonwealth development funds, improving influence and long-term returns."
 COMMONWEALTH_coordinate_commodity_purchases: "Coordinate Commodity Purchases"
 COMMONWEALTH_coordinate_commodity_purchases_desc: "Use Commonwealth channels to coordinate commodity access and purchasing guarantees."
 COMMONWEALTH_sponsor_technical_mission: "Sponsor a Technical Mission"
 COMMONWEALTH_sponsor_technical_mission_desc: "Fund Commonwealth engineers, auditors and technical advisers for a targeted administrative or infrastructure mission."
 COMMONWEALTH_mount_relief_mission: "Mount a Relief Mission"
 COMMONWEALTH_mount_relief_mission_desc: "Deploy staff, logistics officers and relief planners through Commonwealth disaster-response channels."
 COMMONWEALTH_technical_assistance_bonus: "Commonwealth Technical Assistance"
