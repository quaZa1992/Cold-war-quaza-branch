l_english:
 # COLDWAR groundmod | 1970s ground weapon modules (technologies, modules, country names).
 # Technologies
 mdcw_artillery_guns_1973: "Long-Barrel Artillery"
 mdcw_artillery_guns_1973_desc: "Longer barrels and heavier rocket launchers of the early 1970s, such as the 2S3 Akatsiya, the M109A1 and the BM-27 Uragan."
 mdcw_artillery_ammo_1975: "Rocket-Assisted Projectiles"
 mdcw_artillery_ammo_1975_desc: "Shells with a small rocket motor in the base that add about a quarter to the range of field guns."
 mdcw_dpicm_1975: "Improved Conventional Munitions"
 mdcw_dpicm_1975_desc: "Dual-purpose bomblets in shells and rockets, such as the M483A1 in service by 1975, let artillery fight armour."
 mdcw_saclos_atgm_1972: "Second-Generation ATGMs"
 mdcw_saclos_atgm_1972_desc: "Semi-automatic wire guidance: TOW (1970), MILAN (1972), Konkurs (1974) and HOT. The gunner only keeps the target in the sight."
 mdcw_gun_launched_atgm_1976: "Gun-Launched Missiles"
 mdcw_gun_launched_atgm_1976_desc: "Missiles fired through the tank gun, such as the 9K112 Kobra introduced on the T-64B in 1976."
 mdcw_mobile_sam_1971: "Mobile SAM Systems"
 mdcw_mobile_sam_1971_desc: "Missile vehicles that keep up with the troops, from the Osa (1971) and Rapier to the Roland, Strela-10 and the first Buk."
 mdcw_strategic_sam_1978: "Strategic SAM Systems"
 mdcw_strategic_sam_1978_desc: "Mobile long-range air defence such as the S-300P, whose state tests ended in 1978."
 mdcw_aa_autocannon_1973: "Radar-Directed AA Guns"
 mdcw_aa_autocannon_1973_desc: "Radar-laid gun systems such as the Gepard (contract 1973, service 1976), the ZSU-23-4M and the M163 Vulcan."
 mdcw_aa_fire_control_1976: "Air-Defence Fire Control"
 mdcw_aa_fire_control_1976_desc: "Pulse-doppler search radars and separate tracking radars on the vehicle, plus battery radars that guide a whole missile unit."
 # Modules
 mdcw_art_med_gun_1b: "Long-Barrel Self-Propelled Howitzer"
 mdcw_art_med_gun_1b_desc: "Howitzers of the early 1970s such as the 2S3 Akatsiya and the M109A1 with its longer 39-calibre barrel. Range grows from about 15 to over 18 km.\n\n§GDesigner Hint: Sits between the post-war howitzer and the late Cold War gun.§!"
 mdcw_art_med_rocket_1b: "Heavy Rocket Launcher"
 mdcw_art_med_rocket_1b_desc: "Truck-mounted multiple rocket launchers of the 1970s such as the 220 mm BM-27 Uragan, which fires 16 rockets out to 35 km in about 20 seconds.\n\n§GDesigner Hint: Rockets trade accuracy for saturation fire.§!"
 mdcw_artillery_light_ammo_1b: "Rocket-Assisted Light Shells"
 mdcw_artillery_light_ammo_1b_desc: "Light shells with a small rocket motor in the base. They reach about a quarter further than ordinary rounds at some cost in payload.\n\n§GDesigner Hint: Light ammunition favours breakthrough and defence over raw firepower.§!"
 mdcw_artillery_medium_ammo_1b: "Rocket-Assisted Medium Shells"
 mdcw_artillery_medium_ammo_1b_desc: "Medium shells with a rocket motor in the base. The 2S3 reaches 24 km with them instead of 18.5 km.\n\n§GDesigner Hint: Medium ammunition balances firepower, breakthrough and defence.§!"
 mdcw_artillery_heavy_ammo_1b: "Rocket-Assisted Heavy Shells"
 mdcw_artillery_heavy_ammo_1b_desc: "Heavy shells with a rocket motor in the base, fired by the largest field guns of the 1970s.\n\n§GDesigner Hint: Heavy ammunition hits hardest but adds little breakthrough or defence.§!"
 mdcw_dpicm_ammo_1b: "Improved Conventional Munitions"
 mdcw_dpicm_ammo_1b_desc: "Carrier shells and rockets that release dozens of dual-purpose bomblets. The M483A1 carries 88 of them and can knock out armour without guided missiles.\n\n§GDesigner Hint: Special ammunition shifts damage from soft to hard targets.§!"
 mdcw_spaa_autocannon_1b: "Radar-Directed Twin Autocannon"
 mdcw_spaa_autocannon_1b_desc: "Radar-laid gun systems of the 1970s such as the Gepard with two 35 mm guns firing 1,100 rounds per minute out to 5.5 km, or the upgraded ZSU-23-4M.\n\n§GDesigner Hint: Combine with a search and tracking radar in special slot 4.§!"
 mdcw_spaa_light_autocannon_1b: "Rotary Air-Defence Gun"
 mdcw_spaa_light_autocannon_1b_desc: "Light, very fast-firing guns such as the 20 mm M168 Vulcan of the M163, which fires up to 3,000 rounds per minute in short bursts.\n\n§GDesigner Hint: Fits the secondary slot of missile launchers.§!"
 mdcw_autocannon_ammo_1b: "HEI and APDS Air-Defence Rounds"
 mdcw_autocannon_ammo_1b_desc: "High-explosive incendiary rounds against aircraft and armour-piercing rounds against vehicles. The Gepard carries 640 anti-aircraft and 40 anti-tank rounds.\n\n§GDesigner Hint: Air-defence guns draw most of their air attack from their ammunition.§!"
 mdcw_spaa_short_range_missiles_1b: "Mobile Short-Range SAM"
 mdcw_spaa_short_range_missiles_1b_desc: "Self-contained missile vehicles of the 1970s such as the Osa, Roland, Crotale and Rapier, which follow the troops and engage low fliers out to about 8 to 12 km.\n\n§GDesigner Hint: Load into a missile launcher; add a radar or optical guidance in special slot 4.§!"
 mdcw_spaa_medium_range_missiles_1b: "Mobile Medium-Range SAM"
 mdcw_spaa_medium_range_missiles_1b_desc: "Tracked or towed missile batteries such as the Kub, the Improved HAWK and the first Buk, which cover a whole army corps out to 25 to 30 km.\n\n§GDesigner Hint: Best paired with a battery fire-control radar.§!"
 mdcw_spaa_long_range_missiles_1b: "Long-Range SAM"
 mdcw_spaa_long_range_missiles_1b_desc: "Mobile long-range systems such as the S-300P, whose tests ended in 1978. Its 5V55K missile reaches about 47 km.\n\n§GDesigner Hint: Heavy and slow, but covers the largest area.§!"
 mdcw_spaa_radar_1b: "Pulse-Doppler Search and Tracking Radar"
 mdcw_spaa_radar_1b_desc: "Separate search and tracking radars on the vehicle itself, such as those of the Gepard with 15 km each, which lock on and fire without help from outside.\n\n§GDesigner Hint: Raises the air attack of guns and missiles alike.§!"
 mdcw_spaa_off_vehicle_radar_1b: "Battery Fire-Control Radar"
 mdcw_spaa_off_vehicle_radar_1b_desc: "A central radar vehicle that finds and illuminates targets for a whole missile battery, such as the 1S91 of the Kub or the radars of the Improved HAWK.\n\n§GDesigner Hint: Strong guidance, but the battery is slow to move.§!"
 mdcw_afv_atgm_1b: "Second-Generation ATGM"
 mdcw_afv_atgm_1b_desc: "Wire-guided missiles of the 1970s such as TOW, MILAN, HOT and Konkurs. The gunner only keeps the sight on the target; the launcher steers the missile out to 2 to 4 km.\n\n§GDesigner Hint: Gives light vehicles the punch of a tank gun.§!"
 mdcw_smoothbore_atgm_1b: "Gun-Launched Guided Missile"
 mdcw_smoothbore_atgm_1b_desc: "Missiles fired through the main gun, such as the 9K112 Kobra of the T-64B and T-80B, which hit tanks out to 4 km, beyond the reach of ordinary rounds.\n\n§GDesigner Hint: Adds long-range hard attack to the main gun.§!"
