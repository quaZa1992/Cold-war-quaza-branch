# IMPERIA CW — Cold War: Guest Worker Administration
 mdcw_ni_overseas_employment_programme:0 "Overseas Employment Programme"
# IMPERIA CW — Cold War: Explain remittance replenishment in the sending programme.
 mdcw_ni_overseas_employment_programme_desc:0 "Our labour offices arrange employment abroad for citizens seeking a better wage. Bilateral agreements bring payments to our treasury, while workers overseas send money home to their families.\n\n§YAgreement Proceeds§!\n25,000 workers: §G$$10 billion§!, §G25 Political Power§!, up to §G$$150 million/week§!.\n50,000 workers: §G$$15 billion§!, §G50 Political Power§!, up to §G$$250 million/week§!.\n100,000 workers: §G$$25 billion§!, §G100 Political Power§!, up to §G$$400 million/week§!.\n\n§YRemittances§!\nAll overseas communities share a §Y$$3 billion weekly income limit§!. Base remittances decline by §Y0.01% each week§! and fall when workers return home. New eligible emigration can replenish income up to the limit. Income above the limit is not saved for later. New emigrants first offset workers previously recruited from abroad; only further emigration adds remittances. Recruiting workers from abroad reduces existing remittance income proportionally. Existing remittance income continues after the programme closes. Overseas communities can support remittance campaigns, household trade agreements and skilled return programmes under §YOverseas Labour / Policies§!.\n\nVoluntary returns reflect wages, stability and settlement support. War in the host country alone multiplies the return rate by four; war in our country alone reduces it to one quarter. If both countries are at war, neither adjustment applies. The final annual return rate is 0.5-15%, with an increased ceiling of 60% if only the host country is at war.\n\nThe foreign government pays the full agreement fee. Workers settle in the receiving country. Each proposal requires our consent; another can be negotiated once it is resolved. The receiving country must wait §Y60 days§! after an agreement before recruiting again. An agreement for 100,000 workers draws 50,000 residents from each of two states; smaller agreements draw from one."
 mdcw_ni_guest_worker_recruitment_programme:0 "Guest Worker Recruitment Programme"
 mdcw_ni_guest_worker_recruitment_programme_desc:0 "Bilateral labour agreements allow our employers to recruit workers abroad. New residents strengthen our workforce, but housing, public services and administration must expand with them.\n\n§YRecruitment Agreements§!\n25,000 workers: §R75 Political Power§! and §R$$10 billion§!.\n50,000 workers: §R125 Political Power§! and §R$$15 billion§!.\n100,000 workers: §R200 Political Power§! and §R$$25 billion§!.\nThe partner government must approve each proposal. Payment goes to its treasury when the workers settle here. Further recruitment is unavailable for §Y60 days§! after approval. Political Power is refunded if negotiations fail.\n\n§YPublic Services§!\nFor each §Y1% of our population§! living here under these agreements:\nHealthcare costs: §R+10%§!.\nBureaucracy costs: §R+20%§!.\nAdditional weekly Welfare: §R0.50% of GDP divided by 52§!.\nThe programme also adds a fixed §R5%§! bureaucracy overhead. Integration programmes reduce the additional costs for participating communities.\n\n§YPolitical Consequences§!\nArrivals increase Daily Nationalist Support by §R+0.02§! for §Y180 days§! and reduce Stability. Stability losses from arrivals cannot exceed §R3 percentage points§! within a 365-day period. Abuse by employers and hostility towards immigrants may provoke further disputes; labour protection reduces these risks.\n\nVoluntary returns are reviewed quarterly and settled annually. The income advantage abroad, stability and integration affect the return rate. Residence and family settlement can help workers remain; homecoming campaigns encourage their return. War in the host country alone multiplies the return rate by four; war in the home country alone reduces it to one quarter. If both countries are at war, neither adjustment applies. The final annual return rate is 0.5-15%, with an increased ceiling of 60% if only the host country is at war.\n\nManage communities, integration and repatriation under §YGuest Worker Agreements§! in the Decisions tab. Closing recruitment does not end our responsibilities towards residents already here. The programme can be removed only after all guest workers have returned home."
 mdcw_guest_workers_decisions:0 "Guest Worker Agreements"
 mdcw_guest_workers_decisions_desc:0 "Our labour office oversees employment agreements and the communities they create. Review public spending, support integration, negotiate recruitment abroad or maintain ties with our workers overseas."
# IMPERIA CW — Cold War: Shared current-income limit, replenishment and net-emigration eligibility.
 mdcw_gw_remittance_status_tt:0 "Weekly remittances: §G$$[?gw_dp_total_income_m|2] million§!\nBase remittances: §Y$$[?mdcw_gw_remittance_pool_m|2] million§!\nCampaign income: §G$$[?gw_dp_bonus_m|2] million§!\nShared weekly limit: §Y$$3 billion§!\nBase weekly decline: §Y0.01%§!\nNet emigration: §Y[?mdcw_gw_net_emigration_k|2] thousand§!\n\nAll overseas communities share this weekly limit. As income declines or workers return home, new eligible emigration agreements can replenish it up to §Y$$3 billion per week§!. Income above the limit is not saved for later. New emigrants must first offset previous recruitment from abroad before increasing remittances."
 mdcw_gw_remittance_income_tt:0 "$$[?mdcw_gw_weekly_income|+3] from §YGuest Worker Remittances§!\n"
 mdcw_gw_receiver_state_tt:0 "A state under our control can accommodate the new arrivals."
 mdcw_gw_source_population_tt:0 "§Y[FROM.GetName]§! has enough residents in states under its control to fulfil the agreement."
 mdcw_gw_treasury_tt:0 "We can afford the agreement payment."
 mdcw_gw_recruit_25000:0 "Recruit 25,000 Workers from [FROM.GetName]"
 mdcw_gw_recruit_25000_desc:0 "Open talks with §Y[FROM.GetName]§! over the recruitment of §Y25,000 workers§!. A limited agreement would allow our employers to recruit abroad with the consent of the workers' home government."
 mdcw_gw_recruit_25000_effect_tt:0 "Propose a labour agreement to §Y[FROM.GetName]§!. Its government may accept or refuse.\n\n§YOn Approval§!\nNew residents: §G+25,000§!\nPayment to [FROM.GetName]: §R$$10 billion§!\nFurther recruitment: unavailable for §Y60 days§!\n\nNew residents add to public-service costs and provoke §YImmigration Backlash§! for §Y180 days§!. The programme must remain open while guest workers live here. Political Power is refunded if negotiations fail."
 mdcw_gw_recruit_50000:0 "Recruit 50,000 Workers from [FROM.GetName]"
 mdcw_gw_recruit_50000_desc:0 "Our labour offices propose recruiting §Y50,000 workers§! from §Y[FROM.GetName]§!. The agreement would establish a larger overseas recruitment effort, with both governments responsible for arranging the move."
 mdcw_gw_recruit_50000_effect_tt:0 "Propose a labour agreement to §Y[FROM.GetName]§!. Its government may accept or refuse.\n\n§YOn Approval§!\nNew residents: §G+50,000§!\nPayment to [FROM.GetName]: §R$$15 billion§!\nFurther recruitment: unavailable for §Y60 days§!\n\nNew residents add to public-service costs and provoke §YImmigration Backlash§! for §Y180 days§!. The programme must remain open while guest workers live here. Political Power is refunded if negotiations fail."
 mdcw_gw_recruit_100000:0 "Recruit 100,000 Workers from [FROM.GetName]"
 mdcw_gw_recruit_100000_desc:0 "Seek a major labour agreement with §Y[FROM.GetName]§! for §Y100,000 workers§!. Recruitment on this scale carries considerable financial and political commitments, reaching well beyond the factory gates."
 mdcw_gw_recruit_100000_effect_tt:0 "Propose a labour agreement to §Y[FROM.GetName]§!. Its government may accept or refuse.\n\n§YOn Approval§!\nNew residents: §G+100,000§! (§Y50,000 from each of two states§!)\nPayment to [FROM.GetName]: §R$$25 billion§!\nFurther recruitment: unavailable for §Y60 days§!\n\nNew residents add to public-service costs and provoke §YImmigration Backlash§! for §Y180 days§!. The programme must remain open while guest workers live here. Political Power is refunded if negotiations fail."
 mdcw_gw_receiver_state_tt_NOT:0 "No state under our control can accommodate the new arrivals."
 mdcw_gw_source_population_tt_NOT:0 "§Y[FROM.GetName]§! cannot provide the agreed number of residents from states under its control."
 mdcw_gw_treasury_tt_NOT:0 "We cannot afford the agreement payment."
 mdcw_gw_programmes_tt:0 "Both governments have established the necessary labour programmes."
 mdcw_gw_programmes_tt_NOT:0 "Both governments must establish the necessary labour programmes."
 mdcw_gw_no_pending_tt:0 "Neither government is negotiating another labour agreement."
 mdcw_gw_no_pending_tt_NOT:0 "One of the governments is already negotiating a labour agreement."
 mdcw_guest_workers.1.t:0 "A Bilateral Labour Agreement"
 mdcw_guest_workers.1.d:0 "§Y[FROM.GetName]§! seeks our approval to recruit workers for employment abroad.\n\n§Y[mdcw_gw_origin_state.GetName]§! to §Y[mdcw_gw_destination_state.GetName]§!: 25,000 residents"
 mdcw_guest_workers.2.t:0 "A Bilateral Labour Agreement"
 mdcw_guest_workers.2.d:0 "§Y[FROM.GetName]§! seeks our approval to recruit workers for employment abroad.\n\n§Y[mdcw_gw_origin_state.GetName]§! to §Y[mdcw_gw_destination_state.GetName]§!: 50,000 residents"
 mdcw_guest_workers.3.t:0 "A Bilateral Labour Agreement"
 mdcw_guest_workers.3.d:0 "§Y[FROM.GetName]§! seeks our approval to recruit workers for employment abroad.\n\n§Y[mdcw_gw_origin_state.GetName]§! to §Y[mdcw_gw_destination_state.GetName]§!: 50,000 residents\n§Y[mdcw_gw_origin_state_2.GetName]§! to §Y[mdcw_gw_destination_state.GetName]§!: 50,000 residents"
