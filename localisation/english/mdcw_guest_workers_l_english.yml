 mdcw_guest_workers.accept:0 "Accept the agreement."
 mdcw_gw_refuse_offer_tt:0 "Political Power spent on the proposal: §Gfully refunded§! to the requesting government."
 mdcw_gw_offer_expired_tt:0 "§RThis proposal is no longer valid.§!\nThe agreement cannot proceed. No payment or movement of residents will take place."
 mdcw_gw_accept_offer_25000_tt:0 "Additional weekly remittances: §G+$$[?mdcw_gw_offer_remittance_m|2] million§!\nThe receiving country cannot recruit again for §Y60 days§!."
 mdcw_gw_accept_offer_50000_tt:0 "Additional weekly remittances: §G+$$[?mdcw_gw_offer_remittance_m|2] million§!\nThe receiving country cannot recruit again for §Y60 days§!."
 mdcw_gw_accept_offer_100000_tt:0 "Additional weekly remittances: §G+$$[?mdcw_gw_offer_remittance_m|2] million§!\nThe receiving country cannot recruit again for §Y60 days§!."
 mdcw_guest_workers.30.t:0 "Guest Workers Have Arrived"
 mdcw_guest_workers.30.d:0 "Workers from §Y[mdcw_gw_sender.GetName]§! have reached their new homes.\n\n[mdcw_gw_arrival_source_details]"
 mdcw_guest_workers.30.a:0 "The workers have arrived."
 mdcw_guest_workers.31.t:0 "Labour Negotiations Rejected"
 mdcw_guest_workers.31.d:0 "§Y[mdcw_gw_sender.GetName]§! has declined our proposed labour agreement. Recruitment will not proceed. The Political Power spent on negotiations has been §Gfully refunded§!."
 mdcw_guest_workers.31.a:0 "We acknowledge their decision."
 mdcw_guest_workers.32.t:0 "Labour Negotiations End"
 mdcw_guest_workers.32.d:0 "The proposed labour agreement can no longer go ahead. Recruitment will not proceed, and the Political Power spent on negotiations has been §Gfully refunded§!."
 mdcw_guest_workers.32.a:0 "Close the negotiations."
 mdcw_guest_workers_small:0 "Limited Labour Recruitment"
 mdcw_guest_workers_small_desc:0 "Our labour offices can negotiate a limited recruitment agreement for §Y25,000 workers§!. Employment abroad offers new opportunities to the workers, while our employers gain access to a wider workforce.\n\nPolitical Power: §R75§!\nPayment on approval: §R$$10 billion§!"
 mdcw_guest_workers_medium:0 "Expanded Labour Recruitment"
 mdcw_guest_workers_medium_desc:0 "A broader labour agreement would bring §Y50,000 workers§! to our country. Ministries and employers must work with their foreign counterparts to arrange recruitment and prepare for the new arrivals.\n\nPolitical Power: §R125§!\nPayment on approval: §R$$15 billion§!"
 mdcw_guest_workers_large:0 "Large-Scale Labour Recruitment"
 mdcw_guest_workers_large_desc:0 "Recruiting §Y100,000 workers§! requires a major agreement between governments. Such an undertaking can transform our workforce, but housing and public services must be prepared for the communities that will make their homes here.\n\nPolitical Power: §R200§!\nPayment on approval: §R$$25 billion§!"
 mdcw_gw_receiver_cooldown_tt:0 "We are ready to negotiate a new labour agreement."
 mdcw_gw_receiver_cooldown_tt_NOT:0 "§Y60 days§! must pass after our last agreement before we can recruit again."
 mdcw_gw_resident_costs:0 "Guest Worker Communities"
 mdcw_gw_resident_costs_desc:0 "Workers recruited abroad have made their homes here. Their communities need healthcare, housing and public services. Investment in integration can ease these pressures, but suspending recruitment does not remove the costs of residents already living in our country."
 mdcw_gw_resident_count_tt:0 "Guest workers living here: §Y[?mdcw_gw_guest_workers_k|2] thousand§!"
 mdcw_gw_resident_status_tt:0 "Guest workers living here: §Y[?mdcw_gw_guest_workers_k|2] thousand§!\nHealthcare costs: §R+[?mdcw_gw_health_cost|%2]§!\nBureaucracy costs: §R+[?mdcw_gw_bureaucracy_cost|%2]§!\nAdditional Welfare: §R$$[?gw_welfare_weekly|4] billion/week§!\nIntegration programmes: §R$$[?gw_project_weekly|3] billion/week§!\nSettlement support: §R$$[?gw_dp_retention_weekly|3] billion/week§!\nCommunity details and total weekly costs: §YGuest Worker Agreements§! in the Decisions tab."
 mdcw_gw_arrival_one_source_tt:0 "§Y[mdcw_gw_origin_state.GetName]§! to §Y[mdcw_gw_destination_state.GetName]§!: 25,000 residents"
 mdcw_gw_arrival_one_source_50000_tt:0 "§Y[mdcw_gw_origin_state.GetName]§! to §Y[mdcw_gw_destination_state.GetName]§!: 50,000 residents"
 mdcw_gw_arrival_two_sources_tt:0 "§Y[mdcw_gw_origin_state.GetName]§! to §Y[mdcw_gw_destination_state.GetName]§!: 50,000 residents\n§Y[mdcw_gw_origin_state_2.GetName]§! to §Y[mdcw_gw_destination_state.GetName]§!: 50,000 residents"
 mdcw_gw_arrival_applied_tt:0 "§YArrival Report§!"
 mdcw_gw_income_gap_tt:0 "Our GDP per capita is at least §Y25% higher§! than that of §Y[FROM.GetName]§!.\nOur GDP per capita: §Y$$[?gdp_per_capita|2] thousand§!\n[FROM.GetName]: §Y$$[?FROM.gdp_per_capita|2] thousand§!"
 mdcw_gw_income_gap_tt_NOT:0 "Requires a GDP per capita at least §Y25% higher§! than that of §Y[FROM.GetName]§!.\nOur GDP per capita: §Y$$[?gdp_per_capita|2] thousand§!\n[FROM.GetName]: §Y$$[?FROM.gdp_per_capita|2] thousand§!"
 mdcw_gw_arrival_observed_tt:0 "§YPopulation Before and After Arrival§! (thousands)\n[mdcw_gw_origin_state.GetName]: [?mdcw_gw_departure_before_k|3] to [?mdcw_gw_departure_after_k|3]\n[mdcw_gw_arrival_second_measurement]\n[mdcw_gw_destination_state.GetName]: [?mdcw_gw_arrival_before_k|3] to [?mdcw_gw_arrival_after_k|3]\nThe agreement has been paid and the workers have settled here."
