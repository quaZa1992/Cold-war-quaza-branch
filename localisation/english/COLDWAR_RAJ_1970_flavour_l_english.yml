 # 8 Historical Flavour Events
 COLDWAR_RAJ_FLV.1.t: "Supreme Court Strikes Down Bank and Privy Purse Orders"
 COLDWAR_RAJ_FLV.1.d: "In February and December 1970, Constitution Benches invalidate the initial bank nationalisation ordinance and the Presidential derecognition of former princely rulers, testing the boundary between parliamentary sovereignty and judicial review."
 COLDWAR_RAJ_FLV.1.a: "Re-enact through Parliament and call a fresh mandate (-0.2% GDP election cost, +3% ruling party popularity, -3% Stability)"
 COLDWAR_RAJ_FLV.1.b: "Negotiate statutory compensation with the judiciary (+3% Stability, -0.3% GDP treasury payout)"
 COLDWAR_RAJ_FLV.2.t: "East Pakistan Refugee Crisis Overwhelms the Eastern States"
 COLDWAR_RAJ_FLV.2.d: "Military crackdown across East Pakistan drives millions of refugees into West Bengal, Tripura, and Assam, straining food buffers, provincial budgets, and border security."
 COLDWAR_RAJ_FLV.2.a: "Mobilise national relief camps and diplomatic pressure (Treasury: -0.8% GDP, +5% War Support, -3% Stability)"
 COLDWAR_RAJ_FLV.2.b: "Appeal for international humanitarian aid and seal border checkpoints (Treasury: -0.3% GDP, +3% Diplomatic Influence, -4% War Support)"
 COLDWAR_RAJ_FLV.3.t: "All-India Railway Strike and the Pokhran Test"
 COLDWAR_RAJ_FLV.3.d: "In May 1974, over a million railway workers halt freight across the Union just days before Indian scientists prepare an underground nuclear device at Pokhran in Rajasthan."
 COLDWAR_RAJ_FLV.3.a: "Break the strike and authorise the Peaceful Nuclear Explosion (+5% War Support, +5% Nuclear Progress, -5% Western Trade Opinion, -3% Stability)"
 COLDWAR_RAJ_FLV.3.b: "Concede partial railway wage arbitration and maintain nuclear ambiguity (Weekly budget: -0.005% GDP/week for 1 year, +4% Stability, +3% Western Trade Opinion)"
 COLDWAR_RAJ_FLV.4.t: "The Allahabad High Court Verdict"
 COLDWAR_RAJ_FLV.4.d: "Justice Jagmohanlal Sinha unseats the Prime Minister over electoral-campaign irregularities as Jayaprakash Narayan's Sampoorna Kranti rallies swell in Delhi and Bihar."
 COLDWAR_RAJ_FLV.4.a: "Invoke Article 352 Internal Emergency (-8% Stability, +10% Political Power Gain for 2 years, -5% Democratic Drift)"
 COLDWAR_RAJ_FLV.4.b: "Step aside pending Supreme Court appeal and defend parliamentary norms (+6% Stability, -50 Political Power)"
 COLDWAR_RAJ_FLV.5.t: "The Janata Electoral Wave"
 COLDWAR_RAJ_FLV.5.d: "Following the lifting of censorship and emergency detentions, an unprecedented opposition coalition of Congress(O), Socialists, BLD, and Jana Sangh challenges Congress dominance at the polls."
 COLDWAR_RAJ_FLV.5.a: "Accept the democratic verdict and ensure peaceful transfer of power (+6% Stability, +5% Janata / Congress(O) Popularity)"
 COLDWAR_RAJ_FLV.5.b: "Rally the Congress machine behind populist welfare pledges (-0.4% GDP treasury spend, +5% INC(R) Popularity, -3% Stability)"
 COLDWAR_RAJ_FLV.6.t: "Punjab Crisis and Generational Transition in New Delhi"
 COLDWAR_RAJ_FLV.6.d: "Escalating militancy in Punjab, the assault on the Golden Temple, and the assassination of Prime Minister Indira Gandhi plunge the Union into grief and communal violence as a younger leadership assumes office."
 COLDWAR_RAJ_FLV.6.a: "Deploy the army to restore order and launch peace accords (-0.5% GDP security spend, +4% Stability after unrest, opens Punjab/Assam/Mizo dialogue)"
 COLDWAR_RAJ_FLV.6.b: "Impose extended President's Rule and hard counter-insurgency (+5% Police Cost Multiplier for 2 years, +10% Root Out Resistance, -5% Stability)"
 COLDWAR_RAJ_FLV.7.t: "The Bofors and HDW Procurement Scandals"
 COLDWAR_RAJ_FLV.7.d: "Allegations of illegal commissions paid on Swedish howitzer and West German submarine contracts rock Parliament, fracturing the ruling majority and uniting anti-corruption opposition fronts."
 COLDWAR_RAJ_FLV.7.a: "Order a transparent Parliamentary Inquiry and procurement overhaul (-4% Ruling Party Popularity, -5% Corruption Cost in Union State)"
 COLDWAR_RAJ_FLV.7.b: "Close ranks to protect defence modernisation schedules (+5% Corruption Cost for 2 years, preserves military procurement speed)"
 COLDWAR_RAJ_FLV.8.t: "The Balance-of-Payments Crunch"
 COLDWAR_RAJ_FLV.8.d: "Rising Gulf oil prices, falling remittances, and fiscal deficits reduce foreign exchange reserves to mere weeks of imports, confronting New Delhi with sovereign default or sweeping structural reform."
 COLDWAR_RAJ_FLV.8.a: "Pledge gold reserves and prepare emergency liberalisation (Treasury: -0.5% GDP, unlocks 1991 deregulation path, +5% Market Exposure)"
 COLDWAR_RAJ_FLV.8.b: "Impose severe import compression and capital rationing (-6% Factory Output for 2 years, preserves domestic tariff walls)"

