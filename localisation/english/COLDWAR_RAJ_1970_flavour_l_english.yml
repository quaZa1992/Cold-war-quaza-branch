# IMPERIA COLD WAR : India 1970-1990 national flavour focuses, spirits, decisions and events (English only)

 # Shortcuts
 COLDWAR_RAJ_flv_pol_shortcut: "India: Constitution and Federalism"
 COLDWAR_RAJ_flv_par_shortcut: "India: Party Mandates"
 COLDWAR_RAJ_flv_eco_shortcut: "India: Economy and Licence Raj"
 COLDWAR_RAJ_flv_sec_shortcut: "India: Security, Nuclear and ISRO"
 COLDWAR_RAJ_flv_dip_shortcut: "India: Bilateral Diplomacy"

 # Dynamic Modifier
 COLDWAR_RAJ_union_state_modifier: "State of the Indian Union"
 COLDWAR_RAJ_union_state_modifier_desc: "Tracks the constitutional cohesion, administrative capacity, fiscal discipline, and social compact of the Republic of India from 1970 to 1990."

 # 7 Starting Spirits (21 Ladder Stages)
 COLDWAR_RAJ_1970_licence_raj_1: "The Licence-Permit-Quota Raj"
 COLDWAR_RAJ_1970_licence_raj_1_desc: "Rooted in the 1956 Industrial Policy Resolution and tightened by the MRTP Act (enacted 27 December 1969, Rs 20 crore asset ceiling) and July 1969 bank nationalisation, central licensing restricted private expansion and shielded inefficient monopolies."
 COLDWAR_RAJ_1970_licence_raj_2: "Streamlined Industrial Licensing"
 COLDWAR_RAJ_1970_licence_raj_2_desc: "Rooted in the 1956 Industrial Policy Resolution and tightened by the MRTP Act (enacted 27 December 1969, Rs 20 crore asset ceiling) and July 1969 bank nationalisation, central licensing restricted private expansion and shielded inefficient monopolies."
 COLDWAR_RAJ_1970_licence_raj_3: "Lingering Inspector Raj (Removable via Full Liberalisation)"
 COLDWAR_RAJ_1970_licence_raj_3_desc: "Rooted in the 1956 Industrial Policy Resolution and tightened by the MRTP Act (enacted 27 December 1969, Rs 20 crore asset ceiling) and July 1969 bank nationalisation, central licensing restricted private expansion and shielded inefficient monopolies."
 COLDWAR_RAJ_1970_monsoon_agriculture_1: "Monsoon-Dependent Agrarian Economy"
 COLDWAR_RAJ_1970_monsoon_agriculture_1_desc: "In 1970 agriculture accounted for 45-48% of GDP and over 70% of employment. High-yielding wheat transformed Punjab and Haryana, but eastern and dryland states remained vulnerable to drought and PL-480 food aid until 1971-1972."
 COLDWAR_RAJ_1970_monsoon_agriculture_2: "Uneven Green Revolution"
 COLDWAR_RAJ_1970_monsoon_agriculture_2_desc: "In 1970 agriculture accounted for 45-48% of GDP and over 70% of employment. High-yielding wheat transformed Punjab and Haryana, but eastern and dryland states remained vulnerable to drought and PL-480 food aid until 1971-1972."
 COLDWAR_RAJ_1970_monsoon_agriculture_3: "Rainfed Heartland Vulnerability (Permanent Residual)"
 COLDWAR_RAJ_1970_monsoon_agriculture_3_desc: "In 1970 agriculture accounted for 45-48% of GDP and over 70% of employment. High-yielding wheat transformed Punjab and Haryana, but eastern and dryland states remained vulnerable to drought and PL-480 food aid until 1971-1972."
 COLDWAR_RAJ_1970_forex_squeeze_1: "Chronic Foreign Exchange Squeeze"
 COLDWAR_RAJ_1970_forex_squeeze_1_desc: "With reserves near Rs 810-830 crore (~USD 1.0-1.1 billion) in 1970 after the 1966 devaluation, India faced chronic trade deficits and acute vulnerability to the 1973, 1979, and 1990 global oil shocks."
 COLDWAR_RAJ_1970_forex_squeeze_2: "Managed Balance-of-Payments Strain"
 COLDWAR_RAJ_1970_forex_squeeze_2_desc: "With reserves near Rs 810-830 crore (~USD 1.0-1.1 billion) in 1970 after the 1966 devaluation, India faced chronic trade deficits and acute vulnerability to the 1973, 1979, and 1990 global oil shocks."
 COLDWAR_RAJ_1970_forex_squeeze_3: "Net Energy Import Exposure (Permanent Residual)"
 COLDWAR_RAJ_1970_forex_squeeze_3_desc: "With reserves near Rs 810-830 crore (~USD 1.0-1.1 billion) in 1970 after the 1966 devaluation, India faced chronic trade deficits and acute vulnerability to the 1973, 1979, and 1990 global oil shocks."
 COLDWAR_RAJ_1970_two_front_dilemma_1: "Two-Front Himalayan and Western Dilemma"
 COLDWAR_RAJ_1970_two_front_dilemma_1_desc: "Traumatised by the 1962 Sino-Indian War and locked in stalemate after the 1965 war with Pakistan, India sustained 3.0-3.5% of GDP in defence spending across ten mountain divisions and western armoured commands."
 COLDWAR_RAJ_1970_two_front_dilemma_2: "Fortified Frontier Readiness"
 COLDWAR_RAJ_1970_two_front_dilemma_2_desc: "Traumatised by the 1962 Sino-Indian War and locked in stalemate after the 1965 war with Pakistan, India sustained 3.0-3.5% of GDP in defence spending across ten mountain divisions and western armoured commands."
 COLDWAR_RAJ_1970_two_front_dilemma_3: "Permanent Himalayan and LoC Vigilance (Permanent Residual)"
 COLDWAR_RAJ_1970_two_front_dilemma_3_desc: "Traumatised by the 1962 Sino-Indian War and locked in stalemate after the 1965 war with Pakistan, India sustained 3.0-3.5% of GDP in defence spending across ten mountain divisions and western armoured commands."
 COLDWAR_RAJ_1970_internal_insurgencies_1: "Red Corridor and Frontier Insurgencies"
 COLDWAR_RAJ_1970_internal_insurgencies_1_desc: "By January 1970 CPI(ML) Naxalite cells waged rural and urban guerrilla war in West Bengal, Bihar, and Andhra Pradesh, alongside protracted NNC (Nagaland) and MNF (Mizoram) rebellions."
 COLDWAR_RAJ_1970_internal_insurgencies_2: "Contained Regional Militancy"
 COLDWAR_RAJ_1970_internal_insurgencies_2_desc: "By January 1970 CPI(ML) Naxalite cells waged rural and urban guerrilla war in West Bengal, Bihar, and Andhra Pradesh, alongside protracted NNC (Nagaland) and MNF (Mizoram) rebellions."
 COLDWAR_RAJ_1970_internal_insurgencies_3: "Simmering Borderland Unrest (Permanent Residual)"
 COLDWAR_RAJ_1970_internal_insurgencies_3_desc: "By January 1970 CPI(ML) Naxalite cells waged rural and urban guerrilla war in West Bengal, Bihar, and Andhra Pradesh, alongside protracted NNC (Nagaland) and MNF (Mizoram) rebellions."
 COLDWAR_RAJ_1970_federal_fractures_1: "Federal, Linguistic and Caste Fractures"
 COLDWAR_RAJ_1970_federal_fractures_1_desc: "Indira Gandhi's minority government after the November 1969 Congress split depended on CPI and DMK support, while Tamil state-autonomy demands, Article 370 in Kashmir, and rural caste clashes strained national cohesion."
 COLDWAR_RAJ_1970_federal_fractures_2: "Negotiated Federal Balance"
 COLDWAR_RAJ_1970_federal_fractures_2_desc: "Indira Gandhi's minority government after the November 1969 Congress split depended on CPI and DMK support, while Tamil state-autonomy demands, Article 370 in Kashmir, and rural caste clashes strained national cohesion."
 COLDWAR_RAJ_1970_federal_fractures_3: "Continental Pluralism Friction (Permanent Residual)"
 COLDWAR_RAJ_1970_federal_fractures_3_desc: "Indira Gandhi's minority government after the November 1969 Congress split depended on CPI and DMK support, while Tamil state-autonomy demands, Article 370 in Kashmir, and rural caste clashes strained national cohesion."
 COLDWAR_RAJ_1970_literacy_infrastructure_gap_1: "Literacy Gap and Power Bottlenecks"
 COLDWAR_RAJ_1970_literacy_infrastructure_gap_1_desc: "At the 1971 Census only 34.45% of Indians were literate (female literacy ~22%), creating a specialist bottleneck alongside chronic State Electricity Board power brownouts and congested rail corridors."
 COLDWAR_RAJ_1970_literacy_infrastructure_gap_2: "Expanding Technical Institutes and Grid"
 COLDWAR_RAJ_1970_literacy_infrastructure_gap_2_desc: "At the 1971 Census only 34.45% of Indians were literate (female literacy ~22%), creating a specialist bottleneck alongside chronic State Electricity Board power brownouts and congested rail corridors."
 COLDWAR_RAJ_1970_literacy_infrastructure_gap_3: "Generational Mass Education Deficit (Permanent Residual)"
 COLDWAR_RAJ_1970_literacy_infrastructure_gap_3_desc: "At the 1971 Census only 34.45% of Indians were literate (female literacy ~22%), creating a specialist bottleneck alongside chronic State Electricity Board power brownouts and congested rail corridors."

 # 5 Named National Spirits
 COLDWAR_RAJ_industrial_takeoff: "Industrial Takeoff"
 COLDWAR_RAJ_industrial_takeoff_desc: "India has broken out of slow industrial growth through sustained capital investment, domestic engineering and expanding domestic markets."
 COLDWAR_RAJ_pokhran_threshold: "Pokhran Deterrent Threshold"
 COLDWAR_RAJ_pokhran_threshold_desc: "Having demonstrated an indigenous nuclear explosive capability at Pokhran, New Delhi projects strategic deterrence across Asia despite Western export controls."
 COLDWAR_RAJ_peaceful_atomic_compact: "Peaceful Atomic Compact"
 COLDWAR_RAJ_peaceful_atomic_compact_desc: "By committing its atomic reactors to civilian power generation and international safeguards, India preserves access to global nuclear fuel and research cooperation."
 COLDWAR_RAJ_insat_network: "Orbital Communications Network"
 COLDWAR_RAJ_insat_network_desc: "Indigenous launch vehicles and geostationary satellites link India's states with weather forecasting, telecommunications and national broadcasting."
 COLDWAR_RAJ_indian_ocean_guardian: "Guardian of the Indian Ocean"
 COLDWAR_RAJ_indian_ocean_guardian_desc: "Modernized Himalayan formations, carrier aviation and island outposts anchor India's tri-service deterrence from the Karakoram to the Malacca Strait."

