 # 90 India Flavour Focuses
 COLDWAR_RAJ_minority_mandate: "Stabilise the Minority Government"
 COLDWAR_RAJ_minority_mandate_desc: "Following the November 1969 Congress split, New Delhi governs without a Lok Sabha majority. Securing floor coordination with regional and leftist benches is essential to pass the 1970 budget and avert parliamentary paralysis."
 COLDWAR_RAJ_abolish_privy_purses: "Abolish the Privy Purses"
 COLDWAR_RAJ_abolish_privy_purses_desc: "End the hereditary tax-free allowances and constitutional privileges of over five hundred former princely rulers. The populist stroke energises egalitarian voters while provoking fierce legal challenges from conservative benches."
 COLDWAR_RAJ_princely_settlement: "Negotiate a Princely Settlement"
 COLDWAR_RAJ_princely_settlement_desc: "Offer the former princely houses a phased statutory buyout in long-term development bonds rather than unilateral derecognition. Preserving constitutional continuity reassures courts and investors at the cost of populist momentum."
 COLDWAR_RAJ_constitutional_mandate: "Test the Constitutional Mandate"
 COLDWAR_RAJ_constitutional_mandate_desc: "Take the parliamentary deadlock directly to the Indian electorate. A clear Lok Sabha mandate establishes whether New Delhi will pursue executive centralisation or coalition consensus through the coming decade."
 COLDWAR_RAJ_emergency_discipline: "Proclaim Internal Emergency"
 COLDWAR_RAJ_emergency_discipline_desc: "Invoke Article 352 to suspend strikes, censor opposition dailies, and enforce administrative discipline across the ministries. Output recovers swiftly, but preventive detentions erode democratic legitimacy."
 COLDWAR_RAJ_parliamentary_safeguards: "Enshrine Parliamentary Safeguards"
 COLDWAR_RAJ_parliamentary_safeguards_desc: "Bind the executive to strict judicial review, free press protections, and parliamentary oversight of emergency powers. Constitutional trust deepens, though legislative consensus moves more slowly."
 COLDWAR_RAJ_twenty_point_drive: "Twenty-Point Administrative Drive"
 COLDWAR_RAJ_twenty_point_drive_desc: "Deploy district collectors to enforce price controls, abolish bonded labour, and crack down on tax evasion. Coercive targets deliver short-term revenue gains while alienating rural households."
 COLDWAR_RAJ_forty_fourth_charter: "Forty-Fourth Amendment Charter"
 COLDWAR_RAJ_forty_fourth_charter_desc: "Require written Cabinet assent for any emergency proclamation and shield fundamental rights from suspension. Restoring institutional checks strengthens long-term stability across party transitions."
 COLDWAR_RAJ_centre_state_commission: "Convene the Centre-State Review"
 COLDWAR_RAJ_centre_state_commission_desc: "Summon chief ministers from Madras, Calcutta, Chandigarh, and Hyderabad to audit revenue sharing, governors' powers, and Article 356 dismissals before regional grievances turn violent."
 COLDWAR_RAJ_article_356_directives: "Enforce Article 356 Directives"
 COLDWAR_RAJ_article_356_directives_desc: "Assert New Delhi's constitutional authority to dismiss unruly state ministries and coordinate national planning from the Centre. Unified command speeds central decrees but fuels regionalist resentment."
 COLDWAR_RAJ_rajamannar_devolution: "Rajamannar-Sarkaria Devolution"
 COLDWAR_RAJ_rajamannar_devolution_desc: "Curb arbitrary Article 356 dismissals and devolve a larger share of excise and planning grants to state capitals. Federal accommodation defuses secessionism while narrowing New Delhi's fiscal discretion."
 COLDWAR_RAJ_kashmir_accord: "Negotiate the Kashmir Accord"
 COLDWAR_RAJ_kashmir_accord_desc: "Bring Kashmiri political leaders back into the constitutional fold while keeping Article 370 under New Delhi's supervision. The settlement buys calm in Srinagar without resolving border rivalry."
 COLDWAR_RAJ_social_justice_compact: "Draft the Social Justice Compact"
 COLDWAR_RAJ_social_justice_compact_desc: "Commission a nationwide audit of caste exclusion, rural illiteracy, and public-sector representation. The findings force Parliament to choose between affirmative quotas and universal primary welfare."
 COLDWAR_RAJ_three_language_charter: "Three-Language Federal Charter"
 COLDWAR_RAJ_three_language_charter_desc: "Guarantee indefinite English associate status alongside regional state languages in federal examinations and courts. Reassuring southern states unlocks administrative talent across peninsular India."
 COLDWAR_RAJ_mandal_reservations: "Implement Mandal OBC Reservations"
 COLDWAR_RAJ_mandal_reservations_desc: "Reserve 27% of central civil service posts for Other Backward Classes. Historic representation transforms northern Indian politics while sparking fierce campus protests among upper-caste students."
 COLDWAR_RAJ_literacy_midday_compact: "Primary Literacy and Midday Meals"
 COLDWAR_RAJ_literacy_midday_compact_desc: "Scale Tamil Nadu's universal school nutrition programme nationwide alongside district primary literacy drives. Sustaining rural school funding strains the treasury but steadily builds India's technical base."
 COLDWAR_RAJ_inc_garibi_hatao: "Garibi Hatao Mandate"
 COLDWAR_RAJ_inc_garibi_hatao_desc: "Mobilise nationalised banks and the public distribution network behind the Congress(R) anti-poverty mandate. Direct appeals to smallholders and urban workers bypass regional party bosses."
 COLDWAR_RAJ_janata_sampoorna_kranti: "Sampoorna Kranti Coalition"
 COLDWAR_RAJ_janata_sampoorna_kranti_desc: "Unite Congress(O), Socialists, and agrarian democrats behind Jayaprakash Narayan's call for clean, decentralised governance. Broad coalition democracy restores civic trust while requiring constant cabinet brokerage."
 COLDWAR_RAJ_swatantra_dismantle_plan: "Dismantle the Planning Commission"
 COLDWAR_RAJ_swatantra_dismantle_plan_desc: "Repeal the MRTP asset ceiling, strip the Planning Commission of licensing powers, and abolish state trading monopolies. Unshackling private industry provokes fierce strikes from public-sector unions."
 COLDWAR_RAJ_bjp_integral_humanism: "Integral Humanism Mandate"
 COLDWAR_RAJ_bjp_integral_humanism_desc: "Anchor national policy in Deendayal Upadhyaya's Integral Humanism, rejecting both Western consumerism and Soviet statism in favour of cultural unity, indigenous enterprise, and muscular national defence."
 COLDWAR_RAJ_left_peoples_mandate: "Left Front People's Mandate"
 COLDWAR_RAJ_left_peoples_mandate_desc: "Unite peasant unions, industrial workers, and progressive intelligentsia behind a democratic Left Front programme. Land redistribution and worker protections anchor mass support while alarming private capital."
 COLDWAR_RAJ_inc_indira_socialism: "Indira's Socialist Centralisation"
 COLDWAR_RAJ_inc_indira_socialism_desc: "Bring coal mines, general insurance, and wholesale grain under state command while enforcing the 40% FERA foreign equity ceiling. State control shields strategic sectors at the cost of heavy bureaucracy."
 COLDWAR_RAJ_inc_rajiv_telecom: "Rajiv's Computer and Telecom Leap"
 COLDWAR_RAJ_inc_rajiv_telecom_desc: "Relax capital-goods licensing, launch indigenous C-DOT digital telephone exchanges, and introduce personal computers into ministries and railways. Rapid modernisation widens the external import bill."
 COLDWAR_RAJ_janata_gandhian_fera: "Gandhian Village and FERA Self-Reliance"
 COLDWAR_RAJ_janata_gandhian_fera_desc: "Reserve consumer manufacturing for khadi and district workshops while enforcing the 40% FERA equity limit on foreign multinationals. Domestic artisans gain space, though foreign tech exits slow computing."
 COLDWAR_RAJ_janata_kisan_budget: "Charan Singh's Agrarian Kisan Budget"
 COLDWAR_RAJ_janata_kisan_budget_desc: "Shift public investment from metropolitan steel mills toward rural roads, subsidised fertilisers, and remunerative grain support prices. Farmer incomes rise sharply while urban industrial budgets tighten."
 COLDWAR_RAJ_swatantra_export_tiger: "Export-Led Tiger Industrialisation"
 COLDWAR_RAJ_swatantra_export_tiger_desc: "Slash import tariffs, float the rupee competitively, and establish coastal export-processing zones in Bombay and Madras. Foreign capital pours into light industry while exposing India to global price swings."
 COLDWAR_RAJ_swatantra_private_property: "Private Enterprise and Property Rights"
 COLDWAR_RAJ_swatantra_private_property_desc: "Restore constitutional property protections, re-open private commercial banking, and cut marginal income taxes. Domestic entrepreneurs and commercial farmers expand output while direct tax receipts dip."
 COLDWAR_RAJ_bjp_swadeshi_centrism: "Swadeshi Self-Reliance and Centrism"
 COLDWAR_RAJ_bjp_swadeshi_centrism_desc: "Follow Atal Bihari Vajpayee's broad-tent Swadeshi consensus, backing Indian traders, domestic manufacturers, and pragmatic neighbourhood diplomacy while moderating communal polarisation."
 COLDWAR_RAJ_bjp_nuclear_hindutva: "Overt Nuclearisation and Hindutva"
 COLDWAR_RAJ_bjp_nuclear_hindutva_desc: "End nuclear ambiguity with overt warhead and missile induction while pressing for abrogation of Article 370 and a Uniform Civil Code. Strategic deterrence surges alongside domestic and diplomatic friction."
 COLDWAR_RAJ_left_operation_barga: "Operation Barga and Panchayati Raj"
 COLDWAR_RAJ_left_operation_barga_desc: "Register millions of tenant sharecroppers with heritable tenure and statutory crop shares through elected village panchayats. Rural poverty falls and Maoist recruitment dries up, though private industrialists hesitate."
 COLDWAR_RAJ_left_state_moscow: "State Industrial Command and Moscow"
 COLDWAR_RAJ_left_state_moscow_desc: "Expand heavy public-sector steel and engineering combines in close coordination with Soviet planners under the CPI National Democratic line. Industrial self-reliance strengthens while Western credit tightens."
 COLDWAR_RAJ_inc_congress_renewed: "Congress System Renewed"
 COLDWAR_RAJ_inc_congress_renewed_desc: "Consolidate the umbrella coalition of secularism, public enterprise, and parliamentary dominance across India's states. Enduring machine politics anchors the Republic while inviting patronage risks."
 COLDWAR_RAJ_janata_federal_charter: "Janata Federal Charter"
 COLDWAR_RAJ_janata_federal_charter_desc: "Institutionalise the Rolling Plan, village panchayat autonomy, and genuine parliamentary federalism. Power disperses from New Delhi to district councils, trading central speed for democratic depth."
 COLDWAR_RAJ_swatantra_open_market: "The Open Indian Market"
 COLDWAR_RAJ_swatantra_open_market_desc: "Complete the transition from command licensing to a competitive market republic. Eliminating the Licence Raj accelerates industrial productivity while leaving sharp regional and income disparities."
 COLDWAR_RAJ_bjp_sovereign_bharat: "Sovereign Bharat Doctrine"
 COLDWAR_RAJ_bjp_sovereign_bharat_desc: "Forge a self-reliant, militarily assertive Indian Republic free of foreign ideological tutelage. Strong central resolve strengthens national industry while demanding vigilant internal order."
 COLDWAR_RAJ_left_red_bastion: "Red Bastion of the Subcontinent"
 COLDWAR_RAJ_left_red_bastion_desc: "Cement an unbroken parliamentary socialist coalition uniting organised labour and emancipated sharecroppers. Deep social resilience comes at the cost of wary foreign and domestic private capital."
 COLDWAR_RAJ_eco_fourth_plan: "The Fourth Five-Year Plan Review"
 COLDWAR_RAJ_eco_fourth_plan_desc: "After three years of plan holidays, the Planning Commission must reconcile scarce foreign exchange, agrarian vulnerability, and heavy industrial targets under the Fourth Five-Year Plan."
 COLDWAR_RAJ_eco_agrarian_mandate: "Agrarian and Food Security Drive"
 COLDWAR_RAJ_eco_agrarian_mandate_desc: "With over seventy percent of Indians working the land, the Union Ministry of Agriculture expands rural credit, tube-well irrigation, and high-yield seed procurement across the northern and peninsular basins."
 COLDWAR_RAJ_eco_licence_review: "Industrial Licensing Commission"
 COLDWAR_RAJ_eco_licence_review_desc: "Following the Dutt Committee inquiry into industrial concentration, New Delhi must decide whether to tighten state licensing over large business houses or streamline permits to revive private output."
 COLDWAR_RAJ_eco_green_rev_belt: "Green Revolution Intensive Belt"
 COLDWAR_RAJ_eco_green_rev_belt_desc: "Concentrate high-yielding Mexican wheat, chemical fertilisers, and assured canal irrigation in Punjab, Haryana, and western Uttar Pradesh for rapid national grain surpluses, even as eastern provinces resent the disparity."
 COLDWAR_RAJ_eco_eastern_agrarian: "Eastern and Dryland Agrarian Reform"
 COLDWAR_RAJ_eco_eastern_agrarian_desc: "Spread tenancy security, minor irrigation tanks, and coarse-grain support across Bihar, West Bengal, and the Deccan plateau, trading slower peak wheat yields for broader rural stability and lower insurgency pressure."
 COLDWAR_RAJ_eco_tighten_mrtp: "Tighten MRTP and Nationalise Coal"
 COLDWAR_RAJ_eco_tighten_mrtp_desc: "Enforce strict asset ceilings under the Monopolies and Restrictive Trade Practices Act and bring private coking and non-coking coal mines under public control, securing state fiscal command at higher administrative cost."
 COLDWAR_RAJ_eco_selective_delicensing: "Selective Delicensing and Capital"
 COLDWAR_RAJ_eco_selective_delicensing_desc: "Raise MRTP asset thresholds, permit automatic capacity expansion in core manufacturing, and invite domestic private equity into intermediate goods, spurring productivity while provoking trade-union backlash."
 COLDWAR_RAJ_eco_end_pl480: "End PL-480 Grain Dependence"
 COLDWAR_RAJ_eco_end_pl480_desc: "Build nationwide Food Corporation of India procurement depots and strategic grain reserves to terminate concessional American wheat shipments, insulating Indian diplomacy from food leverage."
 COLDWAR_RAJ_eco_public_steel: "Public Heavy Industry and Steel"
 COLDWAR_RAJ_eco_public_steel_desc: "Commission blast furnaces at Bokaro and modernise integrated steel and heavy engineering combines in the Chota Nagpur and Damodar industrial belt, anchoring domestic capital-goods capacity."
 COLDWAR_RAJ_eco_energy_grid_board: "National Power and Energy Board"
 COLDWAR_RAJ_eco_energy_grid_board_desc: "Coordinate chronically bankrupt State Electricity Boards under a central transmission framework to curb industrial load-shedding and prepare major thermal or hydroelectric investments."
 COLDWAR_RAJ_eco_trade_policy_review: "Foreign Trade and Technology Review"
 COLDWAR_RAJ_eco_trade_policy_review_desc: "As global oil shocks strain India's import bill, the Commerce Ministry weighs stringent foreign-equity restrictions against export-processing zones and indigenous electronics."
 COLDWAR_RAJ_eco_ntpc_thermal: "NTPC Coal-Thermal Power Grid"
 COLDWAR_RAJ_eco_ntpc_thermal_desc: "Construct super-thermal coal stations near eastern coalfields and western load centres under the National Thermal Power Corporation, delivering reliable baseload power at heavy capital and health cost."
 COLDWAR_RAJ_eco_river_valley_hydro: "Multi-Purpose River Valley Dams"
 COLDWAR_RAJ_eco_river_valley_hydro_desc: "Expand multi-purpose Himalayan and Narmada hydroelectric reservoirs combining clean peak power with canal irrigation, while navigating contentious interstate water tribunals and displacement protests."
 COLDWAR_RAJ_eco_fera_shield: "Strict Import Substitution and FERA"
 COLDWAR_RAJ_eco_fera_shield_desc: "Enforce the forty-percent foreign equity ceiling under the Foreign Exchange Regulation Act, shielding domestic industry from external shocks and sanctions at the cost of multinational exits and slower technology inflows."
 COLDWAR_RAJ_eco_export_zones_cdot: "Export Zones and C-DOT Electronics"
 COLDWAR_RAJ_eco_export_zones_cdot_desc: "Expand the Santa Cruz Electronics Export Processing Zone in Bombay and fund the Centre for Development of Telematics, opening India to global software and hardware markets while increasing exposure to world-market swings."
 COLDWAR_RAJ_eco_bombay_high: "Bombay High Offshore and ONGC"
 COLDWAR_RAJ_eco_bombay_high_desc: "Deploy jack-up rigs to tap the Bombay High offshore oilfield in the Arabian Sea, slashing India's vulnerability to Middle Eastern crude price shocks and conserving vital foreign exchange."
 COLDWAR_RAJ_eco_forex_stabilisation: "Emergency Forex Stabilisation"
 COLDWAR_RAJ_eco_forex_stabilisation_desc: "Mobilise Non-Resident Indian remittance accounts, tighten Reserve Bank liquidity controls, and negotiate standby credit buffers to keep India's external balance solvent through global oil and interest shocks."
 COLDWAR_RAJ_eco_break_hindu_rate: "Breaking the Hindu Rate of Growth"
 COLDWAR_RAJ_eco_break_hindu_rate_desc: "With domestic grain reserves, offshore crude, and modernised heavy and electronics sectors aligned, India breaks past the stagnant three-percent growth ceiling of the early post-independence decades."
 COLDWAR_RAJ_sec_guarding_subcontinent: "Guarding the Subcontinent"
 COLDWAR_RAJ_sec_guarding_subcontinent_desc: "Facing two contested Himalayan and western borders alongside armed insurgencies in Bengal and the Northeast, New Delhi reorganises its joint military, intelligence, and defence-science command."
 COLDWAR_RAJ_sec_internal_front: "Stabilise the Internal Frontiers"
 COLDWAR_RAJ_sec_internal_front_desc: "From urban Naxalite squads in Calcutta to Naga and Mizo guerrillas along the Burmese frontier, the Home Ministry must decide between decisive paramilitary sweeps and negotiated political settlements."
 COLDWAR_RAJ_sec_hal_avadi: "HAL Bangalore and HVF Avadi"
 COLDWAR_RAJ_sec_hal_avadi_desc: "Expand Hindustan Aeronautics Limited in Bangalore and the Heavy Vehicles Factory at Avadi to assemble licenced fighters, Vijayanta tanks, and artillery domestically, easing foreign arms dependence."
 COLDWAR_RAJ_sec_steeplechase: "Operation Steeplechase and CRPF"
 COLDWAR_RAJ_sec_steeplechase_desc: "Deploy joint Army, CRPF, and state police cordons across West Bengal, Bihar, and the eastern hills to dismantle insurgent cells swiftly, accepting higher policing costs and civil-liberties friction."
 COLDWAR_RAJ_sec_shillong_accords: "Shillong-Mizo Accords and Relief"
 COLDWAR_RAJ_sec_shillong_accords_desc: "Pair political amnesty and statehood negotiations in Nagaland and Mizoram with rural land-relief and road links across Assam, trading sustained fiscal grants for durable frontier peace."
 COLDWAR_RAJ_sec_jaduguda_uranium: "Survey and Develop Jaduguda Mines"
 COLDWAR_RAJ_sec_jaduguda_uranium_desc: "Fund the Uranium Corporation of India to sink deep shafts and ore-processing mills at the surveyed Jaduguda deposit in Bihar's Singhbhum belt, laying a domestic fuel base for India's nuclear programme."
 COLDWAR_RAJ_sec_border_states: "Border States and Federal Order"
 COLDWAR_RAJ_sec_border_states_desc: "With eastern insurgencies contained, New Delhi turns to the sensitive northwestern states of Jammu and Kashmir and Punjab, where autonomy demands test the Union's constitutional balance."
 COLDWAR_RAJ_sec_smiling_buddha: "Operation Smiling Buddha"
 COLDWAR_RAJ_sec_smiling_buddha_desc: "Authorise Bhabha Atomic Research Centre scientists to detonate a subterranean plutonium device at the Pokhran range in Rajasthan, shattering the nuclear monopoly while inviting Western export sanctions."
 COLDWAR_RAJ_sec_barc_restraint: "BARC Civilian Power and Restraint"
 COLDWAR_RAJ_sec_barc_restraint_desc: "Keep India's nuclear option strictly civilian under Homi Bhabha's three-stage power plan, preserving uninterrupted Canadian and American reactor fuel and Western high-technology trade at the price of foregoing an overt test."
 COLDWAR_RAJ_sec_central_security: "Central Security in Punjab and Kashmir"
 COLDWAR_RAJ_sec_central_security_desc: "Assert direct federal security jurisdiction, fortify strategic passes in Jammu and Kashmir, and expand central intelligence oversight in Punjab, hardening border defences at the cost of regional alienation."
 COLDWAR_RAJ_sec_indira_sheikh: "Indira-Sheikh Autonomy Accords"
 COLDWAR_RAJ_sec_indira_sheikh_desc: "Negotiate constitutional power-sharing with Sheikh Abdullah in Srinagar and moderate Akali leaders in Chandigarh, easing insurgency pressures while conceding broader legislative autonomy to the states."
 COLDWAR_RAJ_sec_strategic_science_board: "Atomic and Strategic Tech Board"
 COLDWAR_RAJ_sec_strategic_science_board_desc: "Link the Indian Institutes of Technology, DRDO laboratories, and the Department of Space into a unified national research pipeline to overcome India's acute specialist bottleneck."
 COLDWAR_RAJ_sec_east_pak_refugees: "The East Pakistan Refugee Emergency"
 COLDWAR_RAJ_sec_east_pak_refugees_desc: "Millions of refugees streaming into West Bengal, Tripura, and Assam overwhelm provincial budgets and ignite a grave strategic crisis across the eastern border, forcing New Delhi to choose its response."
 COLDWAR_RAJ_sec_isro_thumba: "ISRO Thumba and Sriharikota Range"
 COLDWAR_RAJ_sec_isro_thumba_desc: "Develop Vikram Sarabhai's equatorial rocket range at Thumba and the orbital launch complex at Sriharikota, building indigenous telemetry, solid-propellant boosters, and national satellite tracking."
 COLDWAR_RAJ_sec_eastern_command: "Mobilise Eastern Command and Mukti"
 COLDWAR_RAJ_sec_eastern_command_desc: "Prepare Eastern Command for rapid riverine operations and train Bengali liberation cadres along the border, raising India's combat readiness while keeping the final decision on war or peace in Cabinet hands."
 COLDWAR_RAJ_sec_diplomatic_deterrence: "Humanitarian Relief and Deterrence"
 COLDWAR_RAJ_sec_diplomatic_deterrence_desc: "Prioritise international humanitarian diplomacy, UN relief appeals, and defensive border containment over offensive mobilisation, preserving diplomatic goodwill at the cost of prolonged refugee upkeep."
 COLDWAR_RAJ_sec_slv3_insat: "SLV-3 Launch Vehicle and INSAT"
 COLDWAR_RAJ_sec_slv3_insat_desc: "Place the Rohini satellite into orbit atop India's indigenous SLV-3 rocket and deploy the INSAT telecommunication and meteorology constellation, binding the subcontinent through national television, weather alerts, and radar."
 COLDWAR_RAJ_sec_post_crisis_doctrine: "Subcontinental Post-Crisis Doctrine"
 COLDWAR_RAJ_sec_post_crisis_doctrine_desc: "Codify joint tri-service operational lessons from the eastern and Himalayan theatres, reorganising mountain divisions and mechanised strike corps to sustain credible two-front deterrence."
 COLDWAR_RAJ_sec_indian_ocean_power: "Regional Power of the Indian Ocean"
 COLDWAR_RAJ_sec_indian_ocean_power_desc: "With modernized mountain divisions on the Himalayan passes, blue-water carrier groups in the Indian Ocean, and indigenous aerospace and nuclear mastery, New Delhi commands credible tri-service deterrence across South Asia."
 COLDWAR_RAJ_strategic_autonomy: "Strategic Autonomy in a Bipolar World"
 COLDWAR_RAJ_strategic_autonomy_desc: "South Block must chart an independent foreign policy across Washington, Moscow, Beijing, and the postcolonial world. Expanding India's diplomatic cadre prepares New Delhi to bargain on equal terms."
 COLDWAR_RAJ_soviet_shield: "Tilt Toward the Soviet Shield"
 COLDWAR_RAJ_soviet_shield_desc: "Facing a tightening Washington-Beijing-Islamabad axis, New Delhi leans on Moscow's UN veto, concessional arms credit, and heavy industrial backing while accepting colder Western trade ties."
 COLDWAR_RAJ_active_non_alignment: "Active Non-Alignment Leadership"
 COLDWAR_RAJ_active_non_alignment_desc: "Refusing junior status in either superpower camp, India rallies the Non-Aligned Movement around genuine non-alignment, insulating its domestic politics at the cost of slower advanced technology transfers."
 COLDWAR_RAJ_pragmatic_western_opening: "Pragmatic Opening to Western Capital"
 COLDWAR_RAJ_pragmatic_western_opening_desc: "New Delhi opens selective channels to Western technology, multilateral finance, and European suppliers, accelerating industrial modernisation while exposing India to global market swings."
 COLDWAR_RAJ_offer_sov_treaty: "Indo-Soviet Peace & Friendship Treaty"
 COLDWAR_RAJ_offer_sov_treaty_desc: "New Delhi proposes a twenty-year Treaty of Peace, Friendship and Cooperation with Moscow, anchoring mutual security consultations under Article IX while preserving India's formal non-alignment."
 COLDWAR_RAJ_offer_nam_charter: "Tripartite Non-Aligned Trade Charter"
 COLDWAR_RAJ_offer_nam_charter_desc: "Renewing the Tripartite Trade Expansion Agreement with Cairo and Belgrade, India cuts preferential tariffs on engineering goods, textiles, and shipping across the Non-Aligned core."
 COLDWAR_RAJ_offer_usa_pl480_tarapur: "PL-480 Wind-Down & Tarapur Protocol"
 COLDWAR_RAJ_offer_usa_pl480_tarapur_desc: "New Delhi negotiates a final settlement of accumulated PL-480 rupee balances while securing regular low-enriched uranium deliveries for the Tarapur nuclear power station."
 COLDWAR_RAJ_offer_eng_jaguar_carrier: "Jaguar Strike & Carrier Air Accord"
 COLDWAR_RAJ_offer_eng_jaguar_carrier_desc: "Drawing on Commonwealth naval and air ties, India negotiates licensed HAL assembly of the SEPECAT Jaguar strike aircraft alongside Sea Harrier carrier fighters and refit support from British yards."
 COLDWAR_RAJ_offer_fra_mirage_vikas: "Mirage 2000, Vikas & Tarapur Accord"
 COLDWAR_RAJ_offer_fra_mirage_vikas_desc: "Paris offers strategic autonomy without superpower strings: Dassault Mirage 2000 interceptors, SEP Viking liquid-propulsion transfers for ISRO's Vikas engine, and replacement fuel for Tarapur."
 COLDWAR_RAJ_offer_ger_hdw_rourkela: "HDW Submarine & Rourkela Pact"
 COLDWAR_RAJ_offer_ger_hdw_rourkela_desc: "Building on Rourkela Steel Plant and IIT Madras cooperation, New Delhi contracts West German shipbuilders for licensed Type 209 submarine assembly at Mazagon Dock in Bombay."
 COLDWAR_RAJ_offer_pak_simla_indus: "Simla Bilateral & Indus Waters Accord"
 COLDWAR_RAJ_offer_pak_simla_indus_desc: "New Delhi invites Islamabad to codify the Line of Control in Kashmir, reaffirm Indus Waters sharing, and commit both capitals to bilateral dispute resolution without third-party arbitration."
 COLDWAR_RAJ_offer_chi_lac_talks: "Beijing Envoys & Himalayan LAC Talks"
 COLDWAR_RAJ_offer_chi_lac_talks_desc: "After fourteen years without ambassadors, New Delhi seeks to restore full diplomatic missions with Beijing and establish a Joint Working Group to keep the Himalayan frontier peaceful."
 COLDWAR_RAJ_offer_sov_rupee_hal: "Rupee-Rouble Steel & HAL Licences"
 COLDWAR_RAJ_offer_sov_rupee_hal_desc: "By settling heavy steel plant credits and licensed MiG-21, MiG-23, and T-72 production in non-convertible Rupees, India conserves scarce hard currency while Moscow gains a reliable export market."
 COLDWAR_RAJ_offer_usa_hightech_mou: "High-Tech & Supercomputer MoU"
 COLDWAR_RAJ_offer_usa_hightech_mou_desc: "Under strict end-user verification safeguards, New Delhi petitions Washington for Cray weather supercomputers, GE F404 engines for the Light Combat Aircraft, and digital telecommunications hardware."
 COLDWAR_RAJ_offer_jap_maruti_oda: "Maruti-Suzuki Venture & Soft Yen ODA"
 COLDWAR_RAJ_offer_jap_maruti_oda_desc: "Partnering with Suzuki Motor Corporation at Gurgaon and drawing concessional OECF yen loans for power and gas pipelines, India imports Japanese shop-floor discipline into public manufacturing."
 COLDWAR_RAJ_offer_pak_nuclear_cbm: "Non-Attack on Nuclear Facilities Treaty"
 COLDWAR_RAJ_offer_pak_nuclear_cbm_desc: "To avert catastrophic pre-emptive strikes against Trombay or Kahuta during border crises, New Delhi proposes an annual mutual exchange of nuclear facility coordinates and a binding non-attack pledge."
 COLDWAR_RAJ_pillar_indian_ocean: "Pillar of the Indian Ocean"
 COLDWAR_RAJ_pillar_indian_ocean_desc: "From Sri Lanka and the Maldives to the Andaman straits, India asserts its role as the preeminent resident power of the Indian Ocean, backing diplomacy with blue-water reach."

