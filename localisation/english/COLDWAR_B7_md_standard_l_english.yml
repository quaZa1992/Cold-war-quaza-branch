l_english:
 # IMPERIA COLD WAR — MD standard (B7): offer events and native tooltip labels for Western Europe
 COLDWAR_B7.1.a:0 "Let Berlin go its own way"
 COLDWAR_B7.1.b:0 "Restore order by force"
 COLDWAR_B7.1.d:0 "The leadership in East Berlin has refused our demands and is taking the republic out of the Warsaw Pact. The Politburo must decide whether to let the GDR go its own way or to restore socialist order by force."
 COLDWAR_B7.1.t:0 "East Berlin Defies Fraternal Assistance"
 COLDWAR_B7.2.a:0 "A new chapter begins"
 COLDWAR_B7.2.d:0 "The Soviet leadership has accepted our course. The troops stay in their barracks and the republic decides its own future."
 COLDWAR_B7.2.t:0 "Moscow Lets Us Go"
 COLDWAR_B7.3.a:0 "We will defend the republic"
 COLDWAR_B7.3.d:0 "The Soviet leadership has chosen force. Tanks are moving on Berlin and the republic must defend itself."
 COLDWAR_B7.3.t:0 "Moscow Intervenes"
 COLDWAR_B7.4.a:0 "Complete German unity"
 COLDWAR_B7.4.b:0 "Not now"
 COLDWAR_B7.4.d:0 "The transition period in the East is over. The government in East Berlin asks the Federal Republic to complete the accession and take over its states, institutions and armed forces."
 COLDWAR_B7.4.t:0 "The Accession Treaty"
 COLDWAR_B7.5.a:0 "We remain on our own"
 COLDWAR_B7.5.d:0 "The federal government has declined to complete the accession for now. The republic remains a separate state."
 COLDWAR_B7.5.t:0 "Bonn Postpones the Accession"
 COLDWAR_B7.6.a:0 "Welcome Germany into the alliance"
 COLDWAR_B7.6.b:0 "Germany remains outside"
 COLDWAR_B7.6.d:0 "The treaty on German unity places the new state in our alliance. Germany asks to be admitted. The Politburo decides whether to accept it."
 COLDWAR_B7.6.t:0 "A United Germany Asks to Join"
