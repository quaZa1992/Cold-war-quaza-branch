 COLDWAR_GRE_R3_MIL_volunteers_desc:0 "Athens offers to authorize volunteers for the defence of Cyprus. Nicosia can accept the mission while retaining command of its own armed forces. Volunteer deployment will follow the ordinary diplomatic procedure."
 COLDWAR_GRE_R3_MIL_volunteers_title:0 "A Greek Volunteer Mission"
 COLDWAR_GRE_R3_MIL_war_support_factor_tt:0 "War support: $RIGHT|+=%1$"
 COLDWAR_GRE_R3_MIL_weekly_expense_tt:0 "Weekly mission expenditure: $RIGHT|+=5$ billion/week"
 COLDWAR_GRE_R3_POL_choose_kanellopoulos:0 "Invite Panagiotis Kanellopoulos"
 COLDWAR_GRE_R3_POL_choose_mavros:0 "Invite Georgios Mavros"
 COLDWAR_GRE_R3_POL_constantine_leader_tt:0 "Constantine II returns as King."
 COLDWAR_GRE_R3_POL_handover_desc:0 "A negotiated withdrawal by the armed forces needs a civilian ministry capable of restoring parliamentary government. Panagiotis Kanellopoulos offers the conservative constitutional tradition; Georgios Mavros offers the Centre Union tradition."
 COLDWAR_GRE_R3_POL_handover_title:0 "A Civilian Caretaker Cabinet"
 COLDWAR_GRE_R3_POL_kanellopoulos_leader_tt:0 "Panagiotis Kanellopoulos becomes head of government."
 COLDWAR_GRE_R3_POL_karamanlis_leader_tt:0 "Konstantinos Karamanlis becomes head of government."
 COLDWAR_GRE_R3_POL_mavros_leader_tt:0 "Georgios Mavros becomes Prime Minister."
 COLDWAR_GRE_R3_POL_security_directorate_leader_tt:0 "Dimitrios Ioannidis becomes head of government."
 COLDWAR_GRE_R3_change_aegean_command_3:0 "Divided Officer Corps"
 COLDWAR_GRE_R3_change_aegean_command_3_desc:0 "An enacted reform to the existing national programme."
 COLDWAR_GRE_R3_change_army_school_3:0 "Divided Officer Corps"
 COLDWAR_GRE_R3_change_army_school_3_desc:0 "An enacted reform to the existing national programme."
 COLDWAR_GRE_R3_change_industrial_standards_2:0 "Uneven Development"
 COLDWAR_GRE_R3_change_industrial_standards_2_desc:0 "An enacted reform to the existing national programme."
 COLDWAR_GRE_R3_change_island_links_2:0 "Uneven Development"
 COLDWAR_GRE_R3_change_island_links_2_desc:0 "An enacted reform to the existing national programme."
 COLDWAR_GRE_R3_change_joint_staff_0:0 "Divided Officer Corps"
 COLDWAR_GRE_R3_change_joint_staff_0_desc:0 "An enacted reform to the existing national programme."
 COLDWAR_GRE_R3_change_rural_water_1:0 "Uneven Development"
 COLDWAR_GRE_R3_change_rural_water_1_desc:0 "An enacted reform to the existing national programme."
 COLDWAR_GRE_R3_island_defence:0 "Prepare the Nicosia Defences"
 COLDWAR_GRE_R3_island_defence_desc:0 "The National Guard needs prepared positions around Nicosia before the first landing becomes a struggle for the capital. Greek engineers can assist with defensive works, but the Cypriot government must authorize their construction and retain command of the island."
 COLDWAR_GRE_R3_parliamentary_crown:0 "Parliamentary Crown"
 COLDWAR_GRE_R3_parliamentary_crown_desc:0 "The Crown exercises its constitutional role through Parliament."
 COLDWAR_GRE_R3_preview_aegean_deterrence_0:0 "External Relations"
 COLDWAR_GRE_R3_preview_aegean_deterrence_0_desc:0 "Persistent surveillance and contingency planning strengthen Greece's position in the Aegean. Keeping forces ready also diverts activity from commercial services and forgoes the negotiated safety procedures offered to Ankara."
 COLDWAR_GRE_R3_preview_amnesty_2:0 "Constitutional Administration"
 COLDWAR_GRE_R3_preview_amnesty_2_desc:0 "Political amnesty and ordinary jurisdiction can end the exclusion that survived the Civil War. A lawful public life will reduce the reach of exceptional authority and allow political opponents to participate without military permission."
 COLDWAR_GRE_R3_preview_civil_ministries_1:0 "Military Government Programme"
 COLDWAR_GRE_R3_preview_civil_ministries_1_desc:0 "Technically capable civilian ministries can carry development beyond the officer government's immediate security concerns. Their authority improves productive administration and public confidence, while limiting direct military discretion over everyday policy."
 COLDWAR_GRE_R3_preview_civil_war_families_1:0 "Left Government Programme"
 COLDWAR_GRE_R3_preview_civil_war_families_1_desc:0 "Rehabilitation must reach families and political currents excluded by the Civil War settlement. Ending discriminatory treatment can strengthen public legitimacy, while limiting the government's ability to use past political allegiance as an instrument of control."
 COLDWAR_GRE_R3_preview_close_support_1:0 "Defence Programme"
 COLDWAR_GRE_R3_preview_close_support_1_desc:0 "Ground-attack crews need weapons, communications and repeated training with the army. Close support strengthens the battlefield mission directly, while sustained readiness consumes a budget that cannot also fund the interception priority."
 COLDWAR_GRE_R3_preview_commercial_farming_0:0 "Development Strategy"
 COLDWAR_GRE_R3_preview_commercial_farming_0_desc:0 "Commercial farm lending can connect productive holdings with processing, storage and marketing services. It offers a broader private supply chain, while favouring stronger borrowers and sharpening disputes over unequal access to credit."
 COLDWAR_GRE_R3_preview_conservative_mandate_0:0 "Conservative Reconstruction"
 COLDWAR_GRE_R3_preview_conservative_mandate_0_desc:0 "The conservative right can rebuild civilian authority around enterprise, administrative continuity and a secure place in the West. Its programme should make commercial recovery compatible with institutions capable of resisting another military takeover."
 COLDWAR_GRE_R3_preview_constantine_1:0 "Royal Constitutional Programme"
 COLDWAR_GRE_R3_preview_constantine_1_desc:0 "Constantine can return from exile under a settled royal mandate. His return gives the royalist programme a recognized head, while leaving the scope of his political authority to the following constitutional choice."
 COLDWAR_GRE_R3_preview_constitution_0:0 "Constitutional Administration"
 COLDWAR_GRE_R3_preview_constitution_0_desc:0 "The military government invokes a constitution whose central safeguards remain suspended. Greece must decide whether exceptional authority is to become a permanent governing system or give way to accountable civilian institutions."
 COLDWAR_GRE_R3_preview_constitutional_crown_0:0 "Constitutional Settlement"
 COLDWAR_GRE_R3_preview_constitutional_crown_0_desc:0 "A restored crown can serve as a limited constitutional institution if it accepts parliamentary authority. The bargain offers continuity and stability, while binding the government to another centre of constitutional consent."
 COLDWAR_GRE_R3_preview_constitutional_right_0:0 "Conservative Reconstruction"
 COLDWAR_GRE_R3_preview_constitutional_right_0_desc:0 "Constitutional conservatism seeks a government that can make decisions without surrendering civilian authority. Its political programme strengthens the mandate of lawful institutions and resists the return of military vetoes."
 COLDWAR_GRE_R3_preview_crete_research_3:0 "Crete Applied Research"
 COLDWAR_GRE_R3_preview_crete_research_3_desc:0 "A dedicated research complex on Crete can concentrate applied computing and industrial science in a durable national institution. Laboratories and specialist services offer focused technical advances, supported by a continuing education commitment."
 COLDWAR_GRE_R3_preview_development_0:0 "Development Strategy"
 COLDWAR_GRE_R3_preview_development_0_desc:0 "Greece has a fast-growing economy, but investment remains concentrated in a few cities and externally connected sectors. A national development programme can improve construction capacity without pretending that private growth has already resolved regional disparities."
 COLDWAR_GRE_R3_preview_domestic_marine_supply_1:0 "Development Strategy"
 COLDWAR_GRE_R3_preview_domestic_marine_supply_1_desc:0 "Marine engineering and domestic suppliers can turn ship repair into a broader industrial network. This option demands more capital than commercial shipping services, but strengthens both productive yards and military ship construction."
 COLDWAR_GRE_R3_preview_enterprise_1:0 "Conservative Reconstruction"
 COLDWAR_GRE_R3_preview_enterprise_1_desc:0 "Civilian manufacturers need working plant and dependable investment conditions. A funded expansion of Greek enterprise can strengthen productive industry instead of merely increasing the output of military equipment."
 COLDWAR_GRE_R3_preview_entrench_0:0 "Constitutional Administration"
 COLDWAR_GRE_R3_preview_entrench_0_desc:0 "Entrenching the April regime concentrates authority and protects the officer government from parliamentary challenge. The security institutions that sustain that control demand resources and deepen the conflict over political legitimacy."
 COLDWAR_GRE_R3_preview_european_credit_1:0 "Conservative Reconstruction"
 COLDWAR_GRE_R3_preview_european_credit_1_desc:0 "Civilian institutions and credible public accounts can improve the terms on which Greece borrows. Restoring investor confidence supports industrial renewal, while the benefit is naturally limited once the lowest available borrowing rate has been reached."
 COLDWAR_GRE_R3_preview_external_room_0:0 "External Relations"
 COLDWAR_GRE_R3_preview_external_room_0_desc:0 "Greece needs a diplomatic service able to sustain relationships beyond immediate military dependence. Maintaining that reach consumes resources and requires room for professional foreign-policy work."
 COLDWAR_GRE_R3_preview_farm_cooperatives_0:0 "Development Strategy"
 COLDWAR_GRE_R3_preview_farm_cooperatives_0_desc:0 "Cooperatives can pool machinery, marketing and access to agricultural credit for small producers. Stronger public administration supports a larger productivity gain, but requires more funding for the institutions that manage it."
 COLDWAR_GRE_R3_preview_hai_foundation_2:0 "Hellenic Aerospace Capability"
 COLDWAR_GRE_R3_preview_hai_foundation_2_desc:0 "A national aerospace establishment can bring engineering, quality control and advanced training into a permanent institution. It gives Greece a foundation for maintaining its aircraft and eventually producing components at home."
 COLDWAR_GRE_R3_preview_hai_overhaul_0:0 "Aerospace Overhaul Priority"
 COLDWAR_GRE_R3_preview_hai_overhaul_0_desc:0 "Overhaul lines and experienced technicians can keep existing aircraft safe and useful for longer. The maintenance priority preserves crews and airframes, while a larger skilled support establishment raises air-force personnel costs."
 COLDWAR_GRE_R3_preview_hai_structures_2:0 "Greek Aerostructure Manufacturing"
 COLDWAR_GRE_R3_preview_hai_structures_2_desc:0 "Aerostructures and component manufacturing can give Greece a productive role beyond servicing imported aircraft. New plant and engineering routines support military manufacturing, but require a larger technical-education commitment."
 COLDWAR_GRE_R3_preview_handover_2:0 "Constitutional Administration"
 COLDWAR_GRE_R3_preview_handover_2_desc:0 "A negotiated transfer allows a constitutional civilian cabinet to replace military rule. Kanellopoulos or Mavros can lead the transition; amnesty and free parliamentary competition must still follow. The services retain funded institutional guarantees, but no political veto."
 COLDWAR_GRE_R3_preview_independent_diplomacy_0:0 "National and Social Programme"
 COLDWAR_GRE_R3_preview_independent_diplomacy_0_desc:0 "Athens can preserve Western security links while building commercial and political relations beyond the Atlantic alliance. This course prioritizes diplomatic freedom over the technical advantages of a closer Western procurement bargain."
 COLDWAR_GRE_R3_preview_industrial_credit_0:0 "Development Strategy"
 COLDWAR_GRE_R3_preview_industrial_credit_0_desc:0 "Thessaloniki and the industrial north need machinery, suppliers and reliable credit. Tax concessions will help a broader civilian manufacturing base take root, at the cost of some immediate revenue from commercial services."
 COLDWAR_GRE_R3_preview_industrial_standards_1:0 "Development Strategy"
 COLDWAR_GRE_R3_preview_industrial_standards_1_desc:0 "Greek manufacturers need consistent components, technical certification and reliable regional suppliers. An industrial standards programme can reduce the disadvantages of fragmented production, provided technical education receives continuing support."
 COLDWAR_GRE_R3_preview_interceptors_1:0 "Defence Programme"
 COLDWAR_GRE_R3_preview_interceptors_1_desc:0 "Interception links pilot training with the warning network that protects Greece's islands and industrial centres. Concentrating scarce aircraft investment on air defence forgoes a dedicated battlefield support programme."
 COLDWAR_GRE_R3_preview_island_links_1:0 "Development Strategy"
 COLDWAR_GRE_R3_preview_island_links_1_desc:0 "The island economy depends on dependable connections as much as on new hotel capacity. Better transport and public services will spread the visitor economy beyond a handful of well-connected destinations."
 COLDWAR_GRE_R3_preview_joint_staff_1:0 "Defence Programme"
 COLDWAR_GRE_R3_preview_joint_staff_1_desc:0 "Joint planning must replace competing political chains of command. A permanent staff reduces the worst coordination failures, while the individual services still need training and professional appointments to complete the reform."
 COLDWAR_GRE_R3_preview_kanellopoulos_1:0 "Conservative Reconstruction"
 COLDWAR_GRE_R3_preview_kanellopoulos_1_desc:0 "Kanellopoulos represents a constitutional conservative tradition displaced by the military takeover. His return emphasizes lawful government and civilian legitimacy rather than treating political seniority as a combat bonus."
 COLDWAR_GRE_R3_preview_karamanlis_1:0 "Conservative Reconstruction"
 COLDWAR_GRE_R3_preview_karamanlis_1_desc:0 "Karamanlis brings experience of government and a European orientation to the conservative programme. Recalling him gives Athens a stronger diplomatic interlocutor while requiring political space for a civilian leadership of its own."
 COLDWAR_GRE_R3_preview_left_front_0:0 "Left Government Programme"
 COLDWAR_GRE_R3_preview_left_front_0_desc:0 "A broad parliamentary Left can place productive reform beside academic freedom and political reconciliation. Its wider coalition offers research and social confidence, while reducing the freedom of a single party leadership to impose policy."
 COLDWAR_GRE_R3_preview_left_mandate_0:0 "Left Government Programme"
 COLDWAR_GRE_R3_preview_left_mandate_0_desc:0 "The Communist Left can build a programme around productive investment, research and the removal of political exclusion. Public control and redistribution change who receives commercial income and how much the state can immediately collect from it."
 COLDWAR_GRE_R3_preview_liberal_compromise_0:0 "Liberal Reconstruction"
 COLDWAR_GRE_R3_preview_liberal_compromise_0_desc:0 "A negotiated constitutional compromise can widen the coalition behind civilian government. It offers greater immediate stability, while making the executive more dependent on consultation and agreement."
 COLDWAR_GRE_R3_preview_liberal_mandate_0:0 "Liberal Reconstruction"
 COLDWAR_GRE_R3_preview_liberal_mandate_0_desc:0 "The Centre can rebuild a parliamentary alternative around lawful administration and broad civilian participation. Its strength comes from reducing institutional distrust, not from recreating either a security government or a conservative business programme."
 COLDWAR_GRE_R3_preview_loyal_command_0:0 "Military Government Programme"
 COLDWAR_GRE_R3_preview_loyal_command_0_desc:0 "Ioannidis can consolidate power through politically dependable appointments and the security apparatus. Easier command appointments strengthen his control, but renewed interference alienates a navy already wary of army political rule."
 COLDWAR_GRE_R3_preview_managed_opening_0:0 "Military Government Programme"
 COLDWAR_GRE_R3_preview_managed_opening_0_desc:0 "A controlled opening can bring civilian expertise and commercial confidence back into government. It also reduces the freedom of the officer leadership to dictate every appointment, without constituting a free parliamentary transfer or automatic European rehabilitation."
 COLDWAR_GRE_R3_preview_military_technocrats_1:0 "Military Government Programme"
 COLDWAR_GRE_R3_preview_military_technocrats_1_desc:0 "State-directed credit and technically trained administrators can extend industrial investment beyond the regime's security priorities. The productive gains depend on real plant and continuing investment in skilled staff."
 COLDWAR_GRE_R3_preview_mornos_water_1:0 "Attica Water Security"
 COLDWAR_GRE_R3_preview_mornos_water_1_desc:0 "Athens needs a dependable water supply as its population and service economy grow. Completing the Mornos supply works improves urban resilience and public health, while tying up capital that could otherwise support another major development project."
 COLDWAR_GRE_R3_preview_national_change_0:0 "National and Social Programme"
 COLDWAR_GRE_R3_preview_national_change_0_desc:0 "Papandreou's movement promises national autonomy and a broader social mandate. Its programme challenges established commercial privileges and places the relationship between private income, public spending and political independence at the centre of government."
 COLDWAR_GRE_R3_preview_national_health_0:0 "National and Social Programme"
 COLDWAR_GRE_R3_preview_national_health_0_desc:0 "A national health service can extend care beyond income and place of residence. More reliable civilian health improves social confidence and productive working lives, while hospitals, clinics and their staff require a substantially larger health budget."
 COLDWAR_GRE_R3_preview_negotiated_development_1:0 "National and Social Programme"
 COLDWAR_GRE_R3_preview_negotiated_development_1_desc:0 "A development compact can combine public priorities with private services and productive firms. It gains a broader commercial base in return for bargaining with investors whose resources also give them political leverage."
 COLDWAR_GRE_R3_preview_northern_corridor_1:0 "Northern Productive Connections"
 COLDWAR_GRE_R3_preview_northern_corridor_1_desc:0 "Selected northern road sections can connect productive districts and ports before a complete east-west motorway becomes affordable. The programme tackles bottlenecks around Macedonia instead of promising the whole Egnatia axis in a single investment."
 COLDWAR_GRE_R3_preview_officer_compact_0:0 "Military Government Programme"
 COLDWAR_GRE_R3_preview_officer_compact_0_desc:0 "The April regime depends on an officer coalition whose institutions do not always share the same priorities. Maintaining that compact supplies political authority and prepared staffs, while military supervision constrains independent intellectual life."
 COLDWAR_GRE_R3_preview_orthodox_plan_0:0 "Left Government Programme"
 COLDWAR_GRE_R3_preview_orthodox_plan_0_desc:0 "An orthodox planning line gives the state a stronger role in civilian industry and agricultural production. The productive programme redirects commercial income toward public priorities instead of maximizing immediate private-service tax receipts."
 COLDWAR_GRE_R3_preview_ote_digitisation_2:0 "OTE Digital Engineering"
 COLDWAR_GRE_R3_preview_ote_digitisation_2_desc:0 "Digital switching and data links can improve call handling and business communications. The programme starts with selected exchanges and commercial districts, while training and wider coverage continue to require investment."
 COLDWAR_GRE_R3_preview_ote_modernisation_1:0 "OTE Service Expansion"
 COLDWAR_GRE_R3_preview_ote_modernisation_1_desc:0 "Long waiting lists and uneven telephone access constrain firms and households alike. OTE can expand practical service capacity while developing the technical staff needed to maintain a larger national network."
 COLDWAR_GRE_R3_preview_papadopoulos_0:0 "Military Government Programme"
 COLDWAR_GRE_R3_preview_papadopoulos_0_desc:0 "Papadopoulos can use the cabinet to direct credit and coordinate a civilian development programme under military authority. The policy broadens productive capacity without resolving the question of free parliamentary government."
 COLDWAR_GRE_R3_preview_parliament_first_0:0 "Liberal Reconstruction"
 COLDWAR_GRE_R3_preview_parliament_first_0_desc:0 "Parliamentary authority must prevail over both royal interference and military political claims. Establishing that principle strengthens civilian government, while officers who expected an independent political role can resist the change during the transition."
 COLDWAR_GRE_R3_preview_parliamentary_king_0:0 "Royal Constitutional Programme"
 COLDWAR_GRE_R3_preview_parliamentary_king_0_desc:0 "A parliamentary crown binds royal authority to a civilian constitutional order. The settlement offers continuity and public reassurance in exchange for a narrower independent political role."
 COLDWAR_GRE_R3_preview_ppc_hydro_2:0 "PPC River Development"
 COLDWAR_GRE_R3_preview_ppc_hydro_2_desc:0 "A programme of northern river projects can provide domestic electricity, water management and improved regional connections. Fuel-free generation reduces operating exposure, but demands more capital than the thermal priority before the state receives productive returns."
 COLDWAR_GRE_R3_preview_ppc_lignite_1:0 "PPC Lignite Expansion"
 COLDWAR_GRE_R3_preview_ppc_lignite_1_desc:0 "PPC can expand the domestic lignite base and improve the efficiency of its thermal stations. The programme adds dependable generation and lowers fossil-plant fuel consumption, while pollution increases the burden on public health."
 COLDWAR_GRE_R3_preview_productive_credit_0:0 "Conservative Reconstruction"
 COLDWAR_GRE_R3_preview_productive_credit_0_desc:0 "Investment allowances and directed lending can accelerate the expansion of civilian firms. The state accepts lower immediate commercial tax receipts in exchange for a larger and more productive industrial base."
 COLDWAR_GRE_R3_preview_professional_cadres_0:0 "Defence Programme"
 COLDWAR_GRE_R3_preview_professional_cadres_0_desc:0 "Professional cadres can keep selected formations ready for rapid deployment and sustain them with fewer supplies. That readiness requires continuing expenditure and forgoes the broader defensive preparation of the territorial option."
 COLDWAR_GRE_R3_preview_professional_service_0:0 "Liberal Reconstruction"
 COLDWAR_GRE_R3_preview_professional_service_0_desc:0 "Professional appointments can make public administration less dependent on personal patronage. Technical competence and efficient administration come with a loss of political discretion over the allocation of offices."
 COLDWAR_GRE_R3_preview_public_credit_1:0 "National and Social Programme"
 COLDWAR_GRE_R3_preview_public_credit_1_desc:0 "Public control of credit can direct investment toward industrial capacity that private lenders have neglected. The state gains a stronger productive instrument while accepting weaker immediate commercial tax returns and a larger initial commitment."
 COLDWAR_GRE_R3_preview_republic_0:0 "Constitutional Settlement"
 COLDWAR_GRE_R3_preview_republic_0_desc:0 "A parliamentary republic settles the head-of-state question through civilian institutions. It offers a clearer source of political authority, while supporters of the displaced crown contest the new settlement during the transition."
 COLDWAR_GRE_R3_preview_research_institutes_1:0 "Left Government Programme"
 COLDWAR_GRE_R3_preview_research_institutes_1_desc:0 "Applied industrial institutes can connect public investment with engineering and productive research. Their work needs continuing educational support and should deliver usable technical expertise rather than a label for general political control."
 COLDWAR_GRE_R3_preview_royal_mandate_0:0 "Royal Constitutional Programme"
 COLDWAR_GRE_R3_preview_royal_mandate_0_desc:0 "Royalists can seek a renewed constitutional role for the crown after the failed countercoup and exile. Their programme must establish a political settlement before claiming that the armed forces or the wider public have reconciled themselves to it."
 COLDWAR_GRE_R3_preview_royal_veto_1:0 "Royal Constitutional Programme"
 COLDWAR_GRE_R3_preview_royal_veto_1_desc:0 "A constitutional revision can replace parliamentary supremacy with an active royal executive. The stronger royal settlement replaces the existing parliamentary package instead of stacking with it, reopening disputes over the crown's role in government."
 COLDWAR_GRE_R3_preview_rural_water_2:0 "Development Strategy"
 COLDWAR_GRE_R3_preview_rural_water_2_desc:0 "Irrigation and local transport can make rural investment productive beyond the main urban centres. The programme addresses the agricultural part of Greece's regional imbalance, while industrial and island transport measures address the remaining bottlenecks."
 COLDWAR_GRE_R3_preview_sea_control_0:0 "Defence Programme"
 COLDWAR_GRE_R3_preview_sea_control_0_desc:0 "A fleet built for sea control must coordinate escorts, surface forces and amphibious support beyond home waters. It gives Greece a more useful expeditionary instrument, with a larger continuing readiness bill."
 COLDWAR_GRE_R3_preview_sea_denial_0:0 "Defence Programme"
 COLDWAR_GRE_R3_preview_sea_denial_0_desc:0 "Submarines, coastal surveillance and a fleet designed for nearby waters can make an opponent's Aegean operations costly. Concentrating on sea denial sacrifices some of the range needed for sustained distant operations."
 COLDWAR_GRE_R3_preview_security_budget_0:0 "Military Government Programme"
 COLDWAR_GRE_R3_preview_security_budget_0_desc:0 "A funded security establishment can maintain prepared operational staffs and enforce the regime's authority. Its resources come from the civilian economy and a larger security budget, rather than a free improvement in scientific performance."
 COLDWAR_GRE_R3_preview_security_directorate_1:0 "Military Government Programme"
 COLDWAR_GRE_R3_preview_security_directorate_1_desc:0 "Ioannidis can replace cabinet balancing with a tighter security network and politically dependable officers. His control rests on the apparatus of the state rather than a broad civilian constituency, increasing its cost and narrowing commercial confidence."
 COLDWAR_GRE_R3_preview_service_council_0:0 "Military Government Programme"
 COLDWAR_GRE_R3_preview_service_council_0_desc:0 "A genuine service council gives naval and air commanders a stronger voice in national planning. Better coordination comes at the expense of the ruler's freedom to govern the armed forces through personal appointments."
 COLDWAR_GRE_R3_preview_services_reconciled_0:0 "Royal Constitutional Programme"
 COLDWAR_GRE_R3_preview_services_reconciled_0_desc:0 "A reconciliation with the services must address appointments, professional confidence and the consequences of the failed countercoup. Funded joint work can improve naval coordination while reducing the crown's freedom to govern through personal loyalties."
 COLDWAR_GRE_R3_preview_shipping_0:0 "Development Strategy"
 COLDWAR_GRE_R3_preview_shipping_0_desc:0 "Registry, chartering, insurance and port services can retain a greater share of Greek shipping earnings. Competitive tax treatment encourages that activity, while reducing the public share of each unit of commercial income."
 COLDWAR_GRE_R3_preview_shipyards_1:0 "Development Strategy"
 COLDWAR_GRE_R3_preview_shipyards_1_desc:0 "Greece's merchant fleet gives the country maritime reach, but domestic yards still need machinery and investment. Expanding the Piraeus shipbuilding and repair base creates productive capacity at home instead of assuming that Greek-owned tonnage already provides it."
 COLDWAR_GRE_R3_preview_social_contract_2:0 "National and Social Programme"
 COLDWAR_GRE_R3_preview_social_contract_2_desc:0 "A social settlement can bring excluded citizens into public life and fund a wider social commitment. That political mobilisation requires a real social budget rather than a purely administrative promise."
 COLDWAR_GRE_R3_preview_start_civil_war_inheritance:0 "Civil War Inheritance"
 COLDWAR_GRE_R3_preview_start_civil_war_inheritance_desc:0 "Exclusion, memories of the Civil War and conflicts over royal authority continue to divide public institutions. Amnesty and Open Courts or Rehabilitate the Excluded ends the political exclusion. A republic or monarchy by itself does not remove this spirit."
 COLDWAR_GRE_R3_preview_start_divided_officer_corps:0 "Divided Officer Corps"
 COLDWAR_GRE_R3_preview_start_divided_officer_corps_desc:0 "Personal loyalties and the failed royal countercoup divide the services. Neither navy professionalism nor army political power guarantees joint command. A Joint Defence Staff reduces army and naval organization penalties to -5% each and removes the planning penalty. Army Schools removes the remaining army penalty. An Aegean Command removes the remaining naval penalty."
 COLDWAR_GRE_R3_preview_start_emergency_rule:0 "Emergency Rule"
 COLDWAR_GRE_R3_preview_start_emergency_rule_desc:0 "Exceptional powers give the officer government administrative freedom while reducing political legitimacy and intellectual openness. Ends with an actual civilian handover; not merely a different cabinet label."
 COLDWAR_GRE_R3_preview_start_emigration_and_technical_gaps:0 "Emigration and Technical Gaps"
 COLDWAR_GRE_R3_preview_start_emigration_and_technical_gaps_desc:0 "Emigration brings remittances but makes technical capacity at home harder to maintain. Education and returning expertise are essential to a broader domestic productive base. Complete Technical Skills at Home or Free and Capable Universities."
 COLDWAR_GRE_R3_preview_start_maritime_and_tourism_expansion:0 "Maritime and Tourism Expansion"
 COLDWAR_GRE_R3_preview_start_maritime_and_tourism_expansion_desc:0 "Tourism and internationally connected shipping services bring real foreign earnings. Preferential commercial tax arrangements encourage activity while limiting the revenue retained by the state. Greek-owned ships are not an automatic domestic shipbuilding bonus. A continuing structural strength with a continuing external dependence."
 COLDWAR_GRE_R3_preview_start_restricted_european_association:0 "Restricted European Association"
 COLDWAR_GRE_R3_preview_start_restricted_european_association_desc:0 "Association continues in limited treaty form, while further political integration and new Community financing are restricted. Greece is associated with the Community, without being a member. Restore European Association through democratic reform and actual member-state approval."
 COLDWAR_GRE_R3_preview_start_suppressed_political_life:0 "Suppressed Political Life"
 COLDWAR_GRE_R3_preview_start_suppressed_political_life_desc:0 "Parties cannot compete freely, political detention continues and exceptional jurisdiction constrains public life. The formal easing of prior press censorship in late 1969 did not establish a free political system. Complete Amnesty and Open Courts, or enact the Social Contract under an actual civilian mandate."
 COLDWAR_GRE_R3_preview_start_uneven_development:0 "Uneven Development"
 COLDWAR_GRE_R3_preview_start_uneven_development_desc:0 "Rapid aggregate growth coexists with uneven regional infrastructure and less productive rural districts. Water and Rural Productivity removes the agricultural penalty. Either Island Transport and Services or Standards and Suppliers removes the construction penalty. Remove the spirit only when both components are resolved."
 COLDWAR_GRE_R3_preview_tax_compliance_0:0 "Conservative Reconstruction"
 COLDWAR_GRE_R3_preview_tax_compliance_0_desc:0 "Auditing commercial income and industrial accounts can widen the effective tax base without relying only on higher headline rates. The revenue requires a more capable tax administration and a continuing administrative budget."
 COLDWAR_GRE_R3_preview_territorial_army_0:0 "Defence Programme"
 COLDWAR_GRE_R3_preview_territorial_army_0_desc:0 "A territorial system gives Greece prepared positions and reserves suited to defending a difficult coastline and land frontier. Its broader mobilization base requires longer training and does not provide the supply economy of a smaller professional cadre."
 COLDWAR_GRE_R3_preview_tribunals_0:0 "Constitutional Administration"
 COLDWAR_GRE_R3_preview_tribunals_0_desc:0 "Exceptional courts give the regime another means to contain organized opposition. Their political reach strengthens administrative control, while the expense and continuing prosecutions make reconciliation harder."
 COLDWAR_GRE_R3_preview_universities_3:0 "Liberal Reconstruction"
 COLDWAR_GRE_R3_preview_universities_3_desc:0 "Universities need academic freedom, laboratories and stable teaching budgets if Greece is to retain technical expertise. Industrial and electronic research can benefit directly from that investment, without treating every educational reform as a generic construction programme."
 COLDWAR_GRE_R3_preview_visitor_credit_0:0 "Development Strategy"
 COLDWAR_GRE_R3_preview_visitor_credit_0_desc:0 "Tour operators, hotels and island services can turn improving transport links into foreign earnings. Directing credit toward the visitor economy produces services quickly, but leaves less subsidized finance for industrial construction."
 COLDWAR_GRE_R3_preview_western_bargain_0:0 "National and Social Programme"
 COLDWAR_GRE_R3_preview_western_bargain_0_desc:0 "A practical Western bargain can secure technical cooperation and commercial opportunities without abandoning a social programme at home. Closer access to external expertise also makes Athens more exposed to the preferences of its Western partners."
 COLDWAR_GRE_R3_programme_aerospace_overhaul_priority:0 "Aerospace Overhaul Priority"
 COLDWAR_GRE_R3_programme_aerospace_overhaul_priority_desc:0 "Overhaul lines and experienced technicians can keep existing aircraft safe and useful for longer. The maintenance priority preserves crews and airframes, while a larger skilled support establishment raises air-force personnel costs."
 COLDWAR_GRE_R3_programme_attica_water_security:0 "Attica Water Security"
 COLDWAR_GRE_R3_programme_attica_water_security_desc:0 "Athens needs a dependable water supply as its population and service economy grow. Completing the Mornos supply works improves urban resilience and public health, while tying up capital that could otherwise support another major development project."
 COLDWAR_GRE_R3_programme_conservative_reconstruction:0 "Conservative Reconstruction"
 COLDWAR_GRE_R3_programme_conservative_reconstruction_desc:0 "The conservative right can rebuild civilian authority around enterprise, administrative continuity and a secure place in the West. Its programme should make commercial recovery compatible with institutions capable of resisting another military takeover."
 COLDWAR_GRE_R3_programme_constitutional_administration:0 "Constitutional Administration"
 COLDWAR_GRE_R3_programme_constitutional_administration_desc:0 "The military government invokes a constitution whose central safeguards remain suspended. Greece must decide whether exceptional authority is to become a permanent governing system or give way to accountable civilian institutions."
 COLDWAR_GRE_R3_programme_constitutional_settlement:0 "Constitutional Settlement"
 COLDWAR_GRE_R3_programme_constitutional_settlement_desc:0 "A parliamentary republic settles the head-of-state question through civilian institutions. It offers a clearer source of political authority, while supporters of the displaced crown contest the new settlement during the transition."
 COLDWAR_GRE_R3_programme_crete_applied_research:0 "Crete Applied Research"
 COLDWAR_GRE_R3_programme_crete_applied_research_desc:0 "A dedicated research complex on Crete can concentrate applied computing and industrial science in a durable national institution. Laboratories and specialist services offer focused technical advances, supported by a continuing education commitment."
 COLDWAR_GRE_R3_programme_defence_programme:0 "Defence Programme"
 COLDWAR_GRE_R3_programme_defence_programme_desc:0 "Joint planning must replace competing political chains of command. A permanent staff reduces the worst coordination failures, while the individual services still need training and professional appointments to complete the reform."
 COLDWAR_GRE_R3_programme_development_strategy:0 "Development Strategy"
 COLDWAR_GRE_R3_programme_development_strategy_desc:0 "Greece has a fast-growing economy, but investment remains concentrated in a few cities and externally connected sectors. A national development programme can improve construction capacity without pretending that private growth has already resolved regional disparities."
 COLDWAR_GRE_R3_programme_external_relations:0 "External Relations"
 COLDWAR_GRE_R3_programme_external_relations_desc:0 "Greece needs a diplomatic service able to sustain relationships beyond immediate military dependence. Maintaining that reach consumes resources and requires room for professional foreign-policy work."
 COLDWAR_GRE_R3_programme_greek_aerostructure_manufacturing:0 "Greek Aerostructure Manufacturing"
 COLDWAR_GRE_R3_programme_greek_aerostructure_manufacturing_desc:0 "Aerostructures and component manufacturing can give Greece a productive role beyond servicing imported aircraft. New plant and engineering routines support military manufacturing, but require a larger technical-education commitment."
 COLDWAR_GRE_R3_programme_hellenic_aerospace_capability:0 "Hellenic Aerospace Capability"
 COLDWAR_GRE_R3_programme_hellenic_aerospace_capability_desc:0 "A national aerospace establishment can bring engineering, quality control and advanced training into a permanent institution. It gives Greece a foundation for maintaining its aircraft and eventually producing components at home."
 COLDWAR_GRE_R3_programme_left_government_programme:0 "Left Government Programme"
 COLDWAR_GRE_R3_programme_left_government_programme_desc:0 "The Communist Left can build a programme around productive investment, research and the removal of political exclusion. Public control and redistribution change who receives commercial income and how much the state can immediately collect from it."
 COLDWAR_GRE_R3_programme_liberal_reconstruction:0 "Liberal Reconstruction"
 COLDWAR_GRE_R3_programme_liberal_reconstruction_desc:0 "The Centre can rebuild a parliamentary alternative around lawful administration and broad civilian participation. Its strength comes from reducing institutional distrust, not from recreating either a security government or a conservative business programme."
 COLDWAR_GRE_R3_programme_military_government_programme:0 "Military Government Programme"
 COLDWAR_GRE_R3_programme_military_government_programme_desc:0 "The April regime depends on an officer coalition whose institutions do not always share the same priorities. Maintaining that compact supplies political authority and prepared staffs, while military supervision constrains independent intellectual life."
 COLDWAR_GRE_R3_programme_national_and_social_programme:0 "National and Social Programme"
 COLDWAR_GRE_R3_programme_national_and_social_programme_desc:0 "Papandreou's movement promises national autonomy and a broader social mandate. Its programme challenges established commercial privileges and places the relationship between private income, public spending and political independence at the centre of government."
 COLDWAR_GRE_R3_programme_northern_productive_connections:0 "Northern Productive Connections"
 COLDWAR_GRE_R3_programme_northern_productive_connections_desc:0 "Selected northern road sections can connect productive districts and ports before a complete east-west motorway becomes affordable. The programme tackles bottlenecks around Macedonia instead of promising the whole Egnatia axis in a single investment."
 COLDWAR_GRE_R3_programme_ote_digital_engineering:0 "OTE Digital Engineering"
 COLDWAR_GRE_R3_programme_ote_digital_engineering_desc:0 "Digital switching and data links can improve call handling and business communications. The programme starts with selected exchanges and commercial districts, while training and wider coverage continue to require investment."
 COLDWAR_GRE_R3_programme_ote_service_expansion:0 "OTE Service Expansion"
 COLDWAR_GRE_R3_programme_ote_service_expansion_desc:0 "Long waiting lists and uneven telephone access constrain firms and households alike. OTE can expand practical service capacity while developing the technical staff needed to maintain a larger national network."
 COLDWAR_GRE_R3_programme_ppc_lignite_expansion:0 "PPC Lignite Expansion"
 COLDWAR_GRE_R3_programme_ppc_lignite_expansion_desc:0 "PPC can expand the domestic lignite base and improve the efficiency of its thermal stations. The programme adds dependable generation and lowers fossil-plant fuel consumption, while pollution increases the burden on public health."
 COLDWAR_GRE_R3_programme_ppc_river_development:0 "PPC River Development"
 COLDWAR_GRE_R3_programme_ppc_river_development_desc:0 "A programme of northern river projects can provide domestic electricity, water management and improved regional connections. Fuel-free generation reduces operating exposure, but demands more capital than the thermal priority before the state receives productive returns."
 COLDWAR_GRE_R3_programme_royal_constitutional_programme:0 "Royal Constitutional Programme"
 COLDWAR_GRE_R3_programme_royal_constitutional_programme_desc:0 "Royalists can seek a renewed constitutional role for the crown after the failed countercoup and exile. Their programme must establish a political settlement before claiming that the armed forces or the wider public have reconciled themselves to it."
 COLDWAR_GRE_R3_requirements_civilian:0 "A civilian government has replaced emergency military rule."
 COLDWAR_GRE_R3_requirements_coup:0 "The coup government remains in power in Cyprus."
 COLDWAR_GRE_R3_requirements_network:0 "The Greek officer network remains active in Cyprus."
 COLDWAR_GRE_R3_requirements_no_expedition:0 "No Greek expeditionary command has superseded the coup programme."
 COLDWAR_GRE_R3_requirements_preparation:0 "The officer network exists and no coup has been launched."
 COLDWAR_GRE_R3_royal_executive:0 "Royal Executive Settlement"
 COLDWAR_GRE_R3_royal_executive_desc:0 "Royal executive authority supersedes the parliamentary settlement."
 COLDWAR_GRE_R3_shortcut_centre:0 "The Liberal Centre"
 COLDWAR_GRE_R3_shortcut_constitution:0 "The Constitutional Question"
 COLDWAR_GRE_R3_shortcut_crown:0 "The Crown"
 COLDWAR_GRE_R3_shortcut_cyprus:0 "Cyprus and the Guarantors"
 COLDWAR_GRE_R3_shortcut_defence:0 "Armed Forces"
 COLDWAR_GRE_R3_shortcut_economy:0 "Growth and Development"
 COLDWAR_GRE_R3_shortcut_foreign:0 "External Relations"
 COLDWAR_GRE_R3_shortcut_junta:0 "The Military Government"
 COLDWAR_GRE_R3_shortcut_left:0 "The Communist Left"
 COLDWAR_GRE_R3_shortcut_right:0 "The Conservative Right"
 COLDWAR_GRE_R3_shortcut_socialist:0 "National and Social Change"
 COLDWAR_GRE_R3_start_civil_war_inheritance:0 "Civil War Inheritance"
 COLDWAR_GRE_R3_start_civil_war_inheritance_desc:0 "Exclusion, memories of the Civil War and conflicts over royal authority continue to divide public institutions. Amnesty and Open Courts or Rehabilitate the Excluded ends the political exclusion. A republic or monarchy by itself does not remove this spirit."
 COLDWAR_GRE_R3_start_divided_officer_corps:0 "Divided Officer Corps"
 COLDWAR_GRE_R3_start_divided_officer_corps_desc:0 "Personal loyalties and the failed royal countercoup divide the services. Neither navy professionalism nor army political power guarantees joint command. A Joint Defence Staff reduces army and naval organization penalties to -5% each and removes the planning penalty. Army Schools removes the remaining army penalty. An Aegean Command removes the remaining naval penalty."
 COLDWAR_GRE_R3_start_emergency_rule:0 "Emergency Rule"
 COLDWAR_GRE_R3_start_emergency_rule_desc:0 "Exceptional powers give the officer government administrative freedom while reducing political legitimacy and intellectual openness. Ends with an actual civilian handover; not merely a different cabinet label."
 COLDWAR_GRE_R3_start_emigration_and_technical_gaps:0 "Emigration and Technical Gaps"
 COLDWAR_GRE_R3_start_emigration_and_technical_gaps_desc:0 "Emigration brings remittances but makes technical capacity at home harder to maintain. Education and returning expertise are essential to a broader domestic productive base. Complete Technical Skills at Home or Free and Capable Universities."
 COLDWAR_GRE_R3_start_maritime_and_tourism_expansion:0 "Maritime and Tourism Expansion"
 COLDWAR_GRE_R3_start_maritime_and_tourism_expansion_desc:0 "Tourism and internationally connected shipping services bring real foreign earnings. Preferential commercial tax arrangements encourage activity while limiting the revenue retained by the state. Greek-owned ships are not an automatic domestic shipbuilding bonus. A continuing structural strength with a continuing external dependence."
 COLDWAR_GRE_R3_start_restricted_european_association:0 "Restricted European Association"
 COLDWAR_GRE_R3_start_restricted_european_association_desc:0 "Association continues in limited treaty form, while further political integration and new Community financing are restricted. Greece is associated with the Community, without being a member. Restore European Association through democratic reform and actual member-state approval."
 COLDWAR_GRE_R3_start_suppressed_political_life:0 "Suppressed Political Life"
 COLDWAR_GRE_R3_start_suppressed_political_life_desc:0 "Parties cannot compete freely, political detention continues and exceptional jurisdiction constrains public life. The formal easing of prior press censorship in late 1969 did not establish a free political system. Complete Amnesty and Open Courts, or enact the Social Contract under an actual civilian mandate."
 COLDWAR_GRE_R3_start_uneven_development:0 "Uneven Development"
 COLDWAR_GRE_R3_start_uneven_development_desc:0 "Rapid aggregate growth coexists with uneven regional infrastructure and less productive rural districts. Water and Rural Productivity removes the agricultural penalty. Either Island Transport and Services or Standards and Suppliers removes the construction penalty. Remove the spirit only when both components are resolved."
 COLDWAR_GRE_R3_temp_aegean_command:0 "Aegean Staff Funding"
 COLDWAR_GRE_R3_temp_aegean_command_desc:0 "An Aegean command can coordinate the defence of dispersed islands with the navy's operational responsibilities. Training and technical work complete the naval part of the joint-command reform and require a temporary staff budget."
 COLDWAR_GRE_R3_temp_army_school:0 "Staff College Funding"
 COLDWAR_GRE_R3_temp_army_school_desc:0 "Staff courses and professional training can rebuild the army's institutional competence beyond personal political networks. Their immediate experience and doctrine benefits are supported by a training allocation that ends after 180 days."
 COLDWAR_GRE_R3_temp_gre_escalate:0 "Aegean Expeditionary Command"
 COLDWAR_GRE_R3_temp_gre_escalate_desc:0 "Greece can commit its armed forces beside Cyprus instead of limiting assistance to volunteers. A unified expeditionary command replaces the narrower post-coup initiative and concentrates readiness for 180 days. Both prior NATO members leave the Alliance for the conflict under the agreed RP rule and return after the related wars end."
 COLDWAR_GRE_R3_temp_handover:0 "Negotiated Military Withdrawal"
 COLDWAR_GRE_R3_temp_handover_desc:0 "A negotiated transfer allows a constitutional civilian cabinet to replace military rule. Kanellopoulos or Mavros can lead the transition; amnesty and free parliamentary competition must still follow. The services retain funded institutional guarantees, but no political veto."
 COLDWAR_GRE_R3_temp_operational_initiative:0 "Operational Initiative in Cyprus"
 COLDWAR_GRE_R3_temp_operational_initiative_desc:0 "A successful coup creates a brief operational opportunity, not a settled regional order. Concentrated staffs can prepare for the next crisis, but sustained readiness disrupts commercial life and gives way to a full expeditionary command if Greece enters the war."
 COLDWAR_GRE_R3_temp_parliament_first:0 "Officer Opposition to Parliamentary Control"
 COLDWAR_GRE_R3_temp_parliament_first_desc:0 "Parliamentary authority must prevail over both royal interference and military political claims. Establishing that principle strengthens civilian government, while officers who expected an independent political role can resist the change during the transition."
 COLDWAR_GRE_R3_temp_republic:0 "A Contested Republican Settlement"
 COLDWAR_GRE_R3_temp_republic_desc:0 "A parliamentary republic settles the head-of-state question through civilian institutions. It offers a clearer source of political authority, while supporters of the displaced crown contest the new settlement during the transition."
 COLDWAR_GRE_R3_temp_staff_network:0 "Forward Operational Planning"
 COLDWAR_GRE_R3_temp_staff_network_desc:0 "Liaison staff and communications make the officer network operational for a limited window. The preparation strengthens the actual coup attempt, consumes funds and ends when the plot is resolved; it is not a permanent global military reform."
 COLDWAR_GRE_R3_weekly_preview_tt:0 "Weekly expenditure: §R+$[?COLDWAR_GRE_R3_preview_weekly|3] billion§! ([?COLDWAR_GRE_R3_preview_rate|3]% of GDP)."
 COLDWAR_GRE_R3_weekly_tt:0 "Weekly expenditure: §R$[?COLDWAR_GRE_R3_weekly_expense|3] billion§!."
 COLDWAR_GRE_R4_crete_research:0 "Build the Crete Research Complex"
 COLDWAR_GRE_R4_crete_research_desc:0 "A dedicated research complex on Crete can concentrate applied computing and industrial science in a durable national institution. Laboratories and specialist services offer focused technical advances, supported by a continuing education commitment."
 COLDWAR_GRE_R4_hai_foundation:0 "Establish Hellenic Aerospace Industry"
 COLDWAR_GRE_R4_hai_foundation_desc:0 "A national aerospace establishment can bring engineering, quality control and advanced training into a permanent institution. It gives Greece a foundation for maintaining its aircraft and eventually producing components at home."
 COLDWAR_GRE_R4_hai_overhaul:0 "Prioritize Aircraft Overhaul"
 COLDWAR_GRE_R4_hai_overhaul_desc:0 "Overhaul lines and experienced technicians can keep existing aircraft safe and useful for longer. The maintenance priority preserves crews and airframes, while a larger skilled support establishment raises air-force personnel costs."
 COLDWAR_GRE_R4_hai_structures:0 "Build an Aerostructure Industry"
 COLDWAR_GRE_R4_hai_structures_desc:0 "Aerostructures and component manufacturing can give Greece a productive role beyond servicing imported aircraft. New plant and engineering routines support military manufacturing, but require a larger technical-education commitment."
 COLDWAR_GRE_R4_mornos_water:0 "Secure the Mornos Water Supply"
 COLDWAR_GRE_R4_mornos_water_desc:0 "Athens needs a dependable water supply as its population and service economy grow. Completing the Mornos supply works improves urban resilience and public health, while tying up capital that could otherwise support another major development project."
 COLDWAR_GRE_R4_northern_corridor:0 "Fund the Northern Corridor Sections"
 COLDWAR_GRE_R4_northern_corridor_desc:0 "Selected northern road sections can connect productive districts and ports before a complete east-west motorway becomes affordable. The programme tackles bottlenecks around Macedonia instead of promising the whole Egnatia axis in a single investment."
 COLDWAR_GRE_R4_ote_digitisation:0 "Begin Digital Exchange Rollout"
 COLDWAR_GRE_R4_ote_digitisation_desc:0 "Digital switching and data links can improve call handling and business communications. The programme starts with selected exchanges and commercial districts, while training and wider coverage continue to require investment."
 COLDWAR_GRE_R4_ote_modernisation:0 "Modernize the OTE Network"
 COLDWAR_GRE_R4_ote_modernisation_desc:0 "Long waiting lists and uneven telephone access constrain firms and households alike. OTE can expand practical service capacity while developing the technical staff needed to maintain a larger national network."
 COLDWAR_GRE_R4_ppc_hydro:0 "Harness the River Systems"
 COLDWAR_GRE_R4_ppc_hydro_desc:0 "A programme of northern river projects can provide domestic electricity, water management and improved regional connections. Fuel-free generation reduces operating exposure, but demands more capital than the thermal priority before the state receives productive returns."
 COLDWAR_GRE_R4_ppc_lignite:0 "Expand the Lignite Basins"
 COLDWAR_GRE_R4_ppc_lignite_desc:0 "PPC can expand the domestic lignite base and improve the efficiency of its thermal stations. The programme adds dependable generation and lowers fossil-plant fuel consumption, while pollution increases the burden on public health."
 COLDWAR_GRE_R4_prinos_appraisal:0 "Appraise the Prinos Basin"
 COLDWAR_GRE_R4_prinos_appraisal_desc:0 "The northern Aegean basin deserves a properly funded appraisal rather than optimistic claims of an oil bonanza. Geological work and exploratory drilling can establish a development case before Greece commits to offshore production."
 COLDWAR_GRE_R4_prinos_development:0 "Develop the Kavala Offshore Complex"
 COLDWAR_GRE_R4_prinos_development_desc:0 "Offshore platforms and a shore connection can turn the appraised Prinos deposits into limited domestic production. The field can ease a share of the import bill, but its scale does not justify treating Greece as a major oil exporter."
