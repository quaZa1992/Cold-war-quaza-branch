l_english:
# IMPERIA COLD WAR — Compact Greek national programme English localisation.
 COLDWAR_GRE_CYP_R2_gre_consult:0 "A Guarantor Settlement"
 COLDWAR_GRE_CYP_R2_gre_consult_desc:0 "The guarantors can consult on a settlement that preserves an independent Republic. A common diplomatic framework gives each government an alternative to deciding the island's future through military escalation."
 COLDWAR_GRE_CYP_R2_gre_coup:0 "Overthrow Makarios"
 COLDWAR_GRE_CYP_R2_gre_coup_desc:0 "Greek-directed officers can attempt to overthrow Makarios if their network overcomes the Republic's prepared defence. Success installs a coup government and opens the Enosis programme; it neither transfers sovereignty immediately nor guarantees that Turkey will stand aside."
 COLDWAR_GRE_CYP_R2_gre_escalate:0 "Fight Beside Cyprus"
 COLDWAR_GRE_CYP_R2_gre_escalate_desc:0 "Greece can commit its armed forces beside Cyprus instead of limiting assistance to volunteers. A unified expeditionary command replaces the narrower post-coup initiative and concentrates readiness for 180 days. Both prior NATO members leave the Alliance for the conflict under the agreed RP rule and return after the related wars end."
 COLDWAR_GRE_CYP_R2_gre_network:0 "The Officer Network"
 COLDWAR_GRE_CYP_R2_gre_network_desc:0 "Trusted officers can give Athens leverage over the government in Nicosia. Building a clandestine chain of command spends political capital and opens the route to a coup, with the risk of Cypriot resistance and a Turkish response."
 COLDWAR_GRE_CYP_R2_gre_officers:0 "Officers on Cyprus"
 COLDWAR_GRE_CYP_R2_gre_officers_desc:0 "Greek personnel serve on Cyprus under arrangements that give Athens a close relationship with the National Guard. That military presence can support the Republic or become a channel for interference, depending on the policy chosen in Athens."
 COLDWAR_GRE_CYP_R2_gre_response:0 "The Turkish Landing"
 COLDWAR_GRE_CYP_R2_gre_response_desc:0 "A Turkish landing turns the constitutional dispute into a military emergency. Greece must decide whether to support the Republic with a limited volunteer mission or enter the war with its full armed forces."
 COLDWAR_GRE_CYP_R2_gre_treaty:0 "An Independent Republic, a Greek Partner"
 COLDWAR_GRE_CYP_R2_gre_treaty_desc:0 "An independent Cyprus can remain Greece's closest regional partner without surrendering its government. Athens will offer instructors and reciprocal military access, while renouncing the covert command network that threatens the Republic."
 COLDWAR_GRE_CYP_R2_gre_volunteers:0 "Volunteers for Cyprus"
 COLDWAR_GRE_CYP_R2_gre_volunteers_desc:0 "A volunteer mission offers immediate military help without committing Greece to a general war with Turkey. Cyprus must accept the deployment, and Athens must sustain real formations and their continuing expenses."
 COLDWAR_GRE_R2_accession:0 "Apply for Community Membership"
 COLDWAR_GRE_R2_accession_desc:0 "Community membership would give Greece a deeper place in European institutions and their common rules. Admission requires the actual members' approval, funded obligations and the native membership system rather than a unilateral declaration."
 COLDWAR_GRE_R2_aegean_command:0 "An Aegean Command"
 COLDWAR_GRE_R2_aegean_command_desc:0 "An Aegean command can coordinate the defence of dispersed islands with the navy's operational responsibilities. Training and technical work complete the naval part of the joint-command reform and require a temporary staff budget."
 COLDWAR_GRE_R2_aegean_deterrence:0 "Deterrence in the Aegean"
 COLDWAR_GRE_R2_aegean_deterrence_desc:0 "Persistent surveillance and contingency planning strengthen Greece's position in the Aegean. Keeping forces ready also diverts activity from commercial services and forgoes the negotiated safety procedures offered to Ankara."
 COLDWAR_GRE_R2_aegean_talks:0 "Negotiate Aegean Procedures"
 COLDWAR_GRE_R2_aegean_talks_desc:0 "Agreed procedures with Ankara can reduce dangerous encounters at sea and keep commercial relations open. Both governments must accept the same terms, choosing a negotiated framework instead of unilateral readiness measures."
 COLDWAR_GRE_R2_air_command:0 "Air Defence of the Aegean"
 COLDWAR_GRE_R2_air_command_desc:0 "Aegean air defence requires trained crews, command procedures and suitable aircraft. A common air command can make those investments coherent before Greece chooses between interception and close battlefield support."
 COLDWAR_GRE_R2_american_standard:0 "Prioritize American Standardization"
 COLDWAR_GRE_R2_american_standard_desc:0 "A first major standardization programme can align Greek training and equipment with American assistance. It provides a useful funded relationship even under the junta, while closer dependence on Washington remains a political cost."
 COLDWAR_GRE_R2_amnesty:0 "Amnesty and Open Courts"
 COLDWAR_GRE_R2_amnesty_desc:0 "Political amnesty and ordinary jurisdiction can end the exclusion that survived the Civil War. A lawful public life will reduce the reach of exceptional authority and allow political opponents to participate without military permission."
 COLDWAR_GRE_R2_army_industry:0 "Army Workshops and Maintenance"
 COLDWAR_GRE_R2_army_industry_desc:0 "Army workshops need productive plant and technical capacity to maintain and supply Greek formations. A funded defence-industry expansion supports infantry equipment directly and remains distinct from civilian economic productivity."
 COLDWAR_GRE_R2_army_school:0 "Army Schools and Staff Courses"
 COLDWAR_GRE_R2_army_school_desc:0 "Staff courses and professional training can rebuild the army's institutional competence beyond personal political networks. Their immediate experience and doctrine benefits are supported by a training allocation that ends after 180 days."
 COLDWAR_GRE_R2_association:0 "Restore European Association"
 COLDWAR_GRE_R2_association_desc:0 "Restoring the European association requires civilian legitimacy and actual agreement from the Community partners. It can reopen productive and financial opportunities without pretending that association already grants full membership."
 COLDWAR_GRE_R2_british_guarantee:0 "British Guarantor Liaison"
 COLDWAR_GRE_R2_british_guarantee_desc:0 "British guarantor liaison can support shared maritime surveillance and communication over Cyprus. It funds a practical service relationship without giving Athens ownership of British bases or a veto over British policy."
 COLDWAR_GRE_R2_bulgarian_trade:0 "A Northern Commercial Opening"
 COLDWAR_GRE_R2_bulgarian_trade_desc:0 "Commercial relations with Bulgaria can exchange agricultural opportunities for a wider productive relationship across the bloc boundary. The agreement requires consent and peaceful relations, rather than assuming that proximity settles political differences."
 COLDWAR_GRE_R2_civil_ministries:0 "Ministries Under Tutelage"
 COLDWAR_GRE_R2_civil_ministries_desc:0 "Technically capable civilian ministries can carry development beyond the officer government's immediate security concerns. Their authority improves productive administration and public confidence, while limiting direct military discretion over everyday policy."
 COLDWAR_GRE_R2_civil_war_families:0 "Rehabilitate the Excluded"
 COLDWAR_GRE_R2_civil_war_families_desc:0 "Rehabilitation must reach families and political currents excluded by the Civil War settlement. Ending discriminatory treatment can strengthen public legitimacy, while limiting the government's ability to use past political allegiance as an instrument of control."
 COLDWAR_GRE_R2_close_support:0 "Battlefield Air Support"
 COLDWAR_GRE_R2_close_support_desc:0 "Ground-attack crews need weapons, communications and repeated training with the army. Close support strengthens the battlefield mission directly, while sustained readiness consumes a budget that cannot also fund the interception priority."
 COLDWAR_GRE_R2_commercial_farming:0 "Competitive Farm Credit"
 COLDWAR_GRE_R2_commercial_farming_desc:0 "Commercial farm lending can connect productive holdings with processing, storage and marketing services. It offers a broader private supply chain, while favouring stronger borrowers and sharpening disputes over unequal access to credit."
 COLDWAR_GRE_R2_conservative_mandate:0 "The Conservative Mandate"
 COLDWAR_GRE_R2_conservative_mandate_desc:0 "The conservative right can rebuild civilian authority around enterprise, administrative continuity and a secure place in the West. Its programme should make commercial recovery compatible with institutions capable of resisting another military takeover."
 COLDWAR_GRE_R2_constantine:0 "The Return of Constantine"
 COLDWAR_GRE_R2_constantine_desc:0 "Constantine can return from exile under a settled royal mandate. His return gives the royalist programme a recognized head, while leaving the scope of his political authority to the following constitutional choice."
 COLDWAR_GRE_R2_constitution:0 "The Constitution in Abeyance"
 COLDWAR_GRE_R2_constitution_desc:0 "The military government invokes a constitution whose central safeguards remain suspended. Greece must decide whether exceptional authority is to become a permanent governing system or give way to accountable civilian institutions."
 COLDWAR_GRE_R2_constitutional_crown:0 "A Crown Bound by Parliament"
 COLDWAR_GRE_R2_constitutional_crown_desc:0 "A restored crown can serve as a limited constitutional institution if it accepts parliamentary authority. The bargain offers continuity and stability, while binding the government to another centre of constitutional consent."
 COLDWAR_GRE_R2_constitutional_right:0 "Constitutional Conservatism"
 COLDWAR_GRE_R2_constitutional_right_desc:0 "Constitutional conservatism seeks a government that can make decisions without surrendering civilian authority. Its political programme strengthens the mandate of lawful institutions and resists the return of military vetoes."
 COLDWAR_GRE_R2_cypriot_settlement:0 "A Civil Settlement for Cyprus"
 COLDWAR_GRE_R2_cypriot_settlement_desc:0 "Greek sovereignty will need more than a declaration if Cypriot institutions are to function within the state. Regional representation, minority protections and funded administration can complete integration after sustained peace and sufficient local compliance."
 COLDWAR_GRE_R2_development:0 "The Development Programme"
 COLDWAR_GRE_R2_development_desc:0 "Greece has a fast-growing economy, but investment remains concentrated in a few cities and externally connected sectors. A national development programme can improve construction capacity without pretending that private growth has already resolved regional disparities."
 COLDWAR_GRE_R2_domestic_marine_supply:0 "A Domestic Marine Supply Chain"
 COLDWAR_GRE_R2_domestic_marine_supply_desc:0 "Marine engineering and domestic suppliers can turn ship repair into a broader industrial network. This option demands more capital than commercial shipping services, but strengthens both productive yards and military ship construction."
 COLDWAR_GRE_R2_eastern_terms:0 "Eastern Industrial Terms"
 COLDWAR_GRE_R2_eastern_terms_desc:0 "Industrial cooperation with the Soviet Union can provide technical assistance and a civilian productive programme. Athens gains an alternative partner, but must fund the relationship and accept the political exposure of greater dependence on Moscow."
 COLDWAR_GRE_R2_election:0 "A Free Parliamentary Mandate"
 COLDWAR_GRE_R2_election_desc:0 "A free parliamentary mandate must rest on legal parties, open competition and a civilian government that accepts the result. Elections provide political authority; they do not by themselves create new factories or scientific discoveries."
 COLDWAR_GRE_R2_enosis_compromise:0 "Negotiate Southern Enosis"
 COLDWAR_GRE_R2_enosis_compromise_desc:0 "After a real partition settlement, Athens can negotiate union with the remaining southern Republic. This narrower territorial prize requires agreement from the affected governments and distinct safeguards for Greek Cypriots and Turkish Cypriots."
 COLDWAR_GRE_R2_enosis_full:0 "Proclaim Full Enosis"
 COLDWAR_GRE_R2_enosis_full_desc:0 "The coup government can be asked to accept union with Greece. Full Enosis offers the whole Republic's territory and existing forces, but requires an actual Cypriot decision, a Turkish reaction window and a costly period of unsettled administration."
 COLDWAR_GRE_R2_enterprise:0 "Competitive Greek Enterprise"
 COLDWAR_GRE_R2_enterprise_desc:0 "Civilian manufacturers need working plant and dependable investment conditions. A funded expansion of Greek enterprise can strengthen productive industry instead of merely increasing the output of military equipment."
 COLDWAR_GRE_R2_entrench:0 "Entrench the Revolution"
 COLDWAR_GRE_R2_entrench_desc:0 "Entrenching the April regime concentrates authority and protects the officer government from parliamentary challenge. The security institutions that sustain that control demand resources and deepen the conflict over political legitimacy."
 COLDWAR_GRE_R2_european_credit:0 "Restore Investor Confidence"
 COLDWAR_GRE_R2_european_credit_desc:0 "Civilian institutions and credible public accounts can improve the terms on which Greece borrows. Restoring investor confidence supports industrial renewal, while the benefit is naturally limited once the lowest available borrowing rate has been reached."
 COLDWAR_GRE_R2_external_room:0 "Recover Room for Diplomacy"
 COLDWAR_GRE_R2_external_room_desc:0 "Greece needs a diplomatic service able to sustain relationships beyond immediate military dependence. Maintaining that reach consumes resources and requires room for professional foreign-policy work."
 COLDWAR_GRE_R2_farm_cooperatives:0 "Modernize the Cooperatives"
 COLDWAR_GRE_R2_farm_cooperatives_desc:0 "Cooperatives can pool machinery, marketing and access to agricultural credit for small producers. Stronger public administration supports a larger productivity gain, but requires more funding for the institutions that manage it."
 COLDWAR_GRE_R2_french_option:0 "Prioritize French Procurement"
 COLDWAR_GRE_R2_french_option_desc:0 "French aircraft and technical support offer an alternative first modernization programme. Greece can gain a more diverse supply relationship, but must pay for training and procurement instead of receiving the American facilities income. This priority does not prohibit unrelated future diplomacy."
 COLDWAR_GRE_R2_guarantee_settlement:0 "An Agreed Guarantor Settlement"
 COLDWAR_GRE_R2_guarantee_settlement_desc:0 "A durable security settlement must be accepted in Nicosia, Athens, Ankara and London. It can strengthen confidence and institutional protection while leaving the island's sovereignty and both communities outside unilateral control."
 COLDWAR_GRE_R2_handover:0 "Negotiate a Civilian Handover"
 COLDWAR_GRE_R2_handover_desc:0 "A negotiated transfer allows a constitutional civilian cabinet to replace military rule. Kanellopoulos or Mavros can lead the transition; amnesty and free parliamentary competition must still follow. The services retain funded institutional guarantees, but no political veto."
 COLDWAR_GRE_R2_independent_diplomacy:0 "An Independent Foreign Policy"
 COLDWAR_GRE_R2_independent_diplomacy_desc:0 "Athens can preserve Western security links while building commercial and political relations beyond the Atlantic alliance. This course prioritizes diplomatic freedom over the technical advantages of a closer Western procurement bargain."
 COLDWAR_GRE_R2_industrial_credit:0 "Credit for Industry"
 COLDWAR_GRE_R2_industrial_credit_desc:0 "Thessaloniki and the industrial north need machinery, suppliers and reliable credit. Tax concessions will help a broader civilian manufacturing base take root, at the cost of some immediate revenue from commercial services."
 COLDWAR_GRE_R2_industrial_standards:0 "Standards and Suppliers"
 COLDWAR_GRE_R2_industrial_standards_desc:0 "Greek manufacturers need consistent components, technical certification and reliable regional suppliers. An industrial standards programme can reduce the disadvantages of fragmented production, provided technical education receives continuing support."
 COLDWAR_GRE_R2_interceptors:0 "Concentrate on Interception"
 COLDWAR_GRE_R2_interceptors_desc:0 "Interception links pilot training with the warning network that protects Greece's islands and industrial centres. Concentrating scarce aircraft investment on air defence forgoes a dedicated battlefield support programme."
 COLDWAR_GRE_R2_island_links:0 "Island Transport and Services"
 COLDWAR_GRE_R2_island_links_desc:0 "The island economy depends on dependable connections as much as on new hotel capacity. Better transport and public services will spread the visitor economy beyond a handful of well-connected destinations."
 COLDWAR_GRE_R2_island_trade:0 "Civilian Ties with Cyprus"
 COLDWAR_GRE_R2_island_trade_desc:0 "Commercial, educational and administrative ties can make an independent Cyprus a valuable Greek partner. Both governments must accept the terms, and neither gains the right to dictate the other's internal politics."
 COLDWAR_GRE_R2_joint_staff:0 "A Joint Defence Staff"
 COLDWAR_GRE_R2_joint_staff_desc:0 "Joint planning must replace competing political chains of command. A permanent staff reduces the worst coordination failures, while the individual services still need training and professional appointments to complete the reform."
 COLDWAR_GRE_R2_kanellopoulos:0 "The Kanellopoulos Tradition"
 COLDWAR_GRE_R2_kanellopoulos_desc:0 "Kanellopoulos represents a constitutional conservative tradition displaced by the military takeover. His return emphasizes lawful government and civilian legitimacy rather than treating political seniority as a combat bonus."
 COLDWAR_GRE_R2_karamanlis:0 "Call Karamanlis Home"
 COLDWAR_GRE_R2_karamanlis_desc:0 "Karamanlis brings experience of government and a European orientation to the conservative programme. Recalling him gives Athens a stronger diplomatic interlocutor while requiring political space for a civilian leadership of its own."
 COLDWAR_GRE_R2_left_front:0 "A Broad Democratic Left Front"
 COLDWAR_GRE_R2_left_front_desc:0 "A broad parliamentary Left can place productive reform beside academic freedom and political reconciliation. Its wider coalition offers research and social confidence, while reducing the freedom of a single party leadership to impose policy."
 COLDWAR_GRE_R2_left_mandate:0 "The Left in Government"
 COLDWAR_GRE_R2_left_mandate_desc:0 "The Communist Left can build a programme around productive investment, research and the removal of political exclusion. Public control and redistribution change who receives commercial income and how much the state can immediately collect from it."
 COLDWAR_GRE_R2_liberal_compromise:0 "A Constitutional Compromise"
 COLDWAR_GRE_R2_liberal_compromise_desc:0 "A negotiated constitutional compromise can widen the coalition behind civilian government. It offers greater immediate stability, while making the executive more dependent on consultation and agreement."
 COLDWAR_GRE_R2_liberal_mandate:0 "Rebuild the Liberal Centre"
 COLDWAR_GRE_R2_liberal_mandate_desc:0 "The Centre can rebuild a parliamentary alternative around lawful administration and broad civilian participation. Its strength comes from reducing institutional distrust, not from recreating either a security government or a conservative business programme."
 COLDWAR_GRE_R2_loyal_command:0 "Promotion Through Loyalty"
 COLDWAR_GRE_R2_loyal_command_desc:0 "Ioannidis can consolidate power through politically dependable appointments and the security apparatus. Easier command appointments strengthen his control, but renewed interference alienates a navy already wary of army political rule."
 COLDWAR_GRE_R2_managed_opening:0 "A Managed Political Opening"
 COLDWAR_GRE_R2_managed_opening_desc:0 "A controlled opening can bring civilian expertise and commercial confidence back into government. It also reduces the freedom of the officer leadership to dictate every appointment, without constituting a free parliamentary transfer or automatic European rehabilitation."
 COLDWAR_GRE_R2_military_technocrats:0 "Military Technocrats"
 COLDWAR_GRE_R2_military_technocrats_desc:0 "State-directed credit and technically trained administrators can extend industrial investment beyond the regime's security priorities. The productive gains depend on real plant and continuing investment in skilled staff."
 COLDWAR_GRE_R2_national_change:0 "National and Social Change"
 COLDWAR_GRE_R2_national_change_desc:0 "Papandreou's movement promises national autonomy and a broader social mandate. Its programme challenges established commercial privileges and places the relationship between private income, public spending and political independence at the centre of government."
 COLDWAR_GRE_R2_national_health:0 "A National Health Service"
 COLDWAR_GRE_R2_national_health_desc:0 "A national health service can extend care beyond income and place of residence. More reliable civilian health improves social confidence and productive working lives, while hospitals, clinics and their staff require a substantially larger health budget."
 COLDWAR_GRE_R2_negotiated_development:0 "A Development Compact"
 COLDWAR_GRE_R2_negotiated_development_desc:0 "A development compact can combine public priorities with private services and productive firms. It gains a broader commercial base in return for bargaining with investors whose resources also give them political leverage."
 COLDWAR_GRE_R2_officer_compact:0 "The Officer Compact"
 COLDWAR_GRE_R2_officer_compact_desc:0 "The April regime depends on an officer coalition whose institutions do not always share the same priorities. Maintaining that compact supplies political authority and prepared staffs, while military supervision constrains independent intellectual life."
 COLDWAR_GRE_R2_operational_initiative:0 "The Operational Initiative"
 COLDWAR_GRE_R2_operational_initiative_desc:0 "A successful coup creates a brief operational opportunity, not a settled regional order. Concentrated staffs can prepare for the next crisis, but sustained readiness disrupts commercial life and gives way to a full expeditionary command if Greece enters the war."
 COLDWAR_GRE_R2_orthodox_plan:0 "An Orthodox Planning Line"
 COLDWAR_GRE_R2_orthodox_plan_desc:0 "An orthodox planning line gives the state a stronger role in civilian industry and agricultural production. The productive programme redirects commercial income toward public priorities instead of maximizing immediate private-service tax receipts."
 COLDWAR_GRE_R2_papadopoulos:0 "Papadopoulos and the Cabinet"
 COLDWAR_GRE_R2_papadopoulos_desc:0 "Papadopoulos can use the cabinet to direct credit and coordinate a civilian development programme under military authority. The policy broadens productive capacity without resolving the question of free parliamentary government."
 COLDWAR_GRE_R2_parliament_first:0 "Parliament Before Palace"
 COLDWAR_GRE_R2_parliament_first_desc:0 "Parliamentary authority must prevail over both royal interference and military political claims. Establishing that principle strengthens civilian government, while officers who expected an independent political role can resist the change during the transition."
 COLDWAR_GRE_R2_parliamentary_king:0 "A Crown under Parliament"
 COLDWAR_GRE_R2_parliamentary_king_desc:0 "A parliamentary crown binds royal authority to a civilian constitutional order. The settlement offers continuity and public reassurance in exchange for a narrower independent political role."
 COLDWAR_GRE_R2_productive_credit:0 "Productive Investment"
 COLDWAR_GRE_R2_productive_credit_desc:0 "Investment allowances and directed lending can accelerate the expansion of civilian firms. The state accepts lower immediate commercial tax receipts in exchange for a larger and more productive industrial base."
 COLDWAR_GRE_R2_professional_cadres:0 "Professional Cadres"
 COLDWAR_GRE_R2_professional_cadres_desc:0 "Professional cadres can keep selected formations ready for rapid deployment and sustain them with fewer supplies. That readiness requires continuing expenditure and forgoes the broader defensive preparation of the territorial option."
 COLDWAR_GRE_R2_professional_service:0 "A Professional Civil Service"
 COLDWAR_GRE_R2_professional_service_desc:0 "Professional appointments can make public administration less dependent on personal patronage. Technical competence and efficient administration come with a loss of political discretion over the allocation of offices."
 COLDWAR_GRE_R2_public_credit:0 "Public Control of Credit"
 COLDWAR_GRE_R2_public_credit_desc:0 "Public control of credit can direct investment toward industrial capacity that private lenders have neglected. The state gains a stronger productive instrument while accepting weaker immediate commercial tax returns and a larger initial commitment."
 COLDWAR_GRE_R2_radar:0 "Link the Radar Stations"
 COLDWAR_GRE_R2_radar_desc:0 "Linked radar stations improve the warning network on which interception depends. A funded station in Crete and electronic research support that system without substituting a generic planning bonus for actual air-defence infrastructure."
 COLDWAR_GRE_R2_reinforce_guard:0 "Reinforce the National Guard"
 COLDWAR_GRE_R2_reinforce_guard_desc:0 "Cyprus needs trained formations before a crisis overwhelms its small army. With Nicosia's consent, Greece can transfer the personnel and equipment for two fully supplied light infantry divisions directly into Cypriot service."
 COLDWAR_GRE_R2_republic:0 "A Parliamentary Republic"
 COLDWAR_GRE_R2_republic_desc:0 "A parliamentary republic settles the head-of-state question through civilian institutions. It offers a clearer source of political authority, while supporters of the displaced crown contest the new settlement during the transition."
 COLDWAR_GRE_R2_research_institutes:0 "Industrial Research Institutes"
 COLDWAR_GRE_R2_research_institutes_desc:0 "Applied industrial institutes can connect public investment with engineering and productive research. Their work needs continuing educational support and should deliver usable technical expertise rather than a label for general political control."
 COLDWAR_GRE_R2_royal_mandate:0 "The Crown and the Nation"
 COLDWAR_GRE_R2_royal_mandate_desc:0 "Royalists can seek a renewed constitutional role for the crown after the failed countercoup and exile. Their programme must establish a political settlement before claiming that the armed forces or the wider public have reconciled themselves to it."
 COLDWAR_GRE_R2_royal_veto:0 "Revise the Royal Settlement"
 COLDWAR_GRE_R2_royal_veto_desc:0 "A constitutional revision can replace parliamentary supremacy with an active royal executive. The stronger royal settlement replaces the existing parliamentary package instead of stacking with it, reopening disputes over the crown's role in government."
 COLDWAR_GRE_R2_rural_water:0 "Water and Rural Productivity"
 COLDWAR_GRE_R2_rural_water_desc:0 "Irrigation and local transport can make rural investment productive beyond the main urban centres. The programme addresses the agricultural part of Greece's regional imbalance, while industrial and island transport measures address the remaining bottlenecks."
 COLDWAR_GRE_R2_sea_control:0 "A Fleet for Sea Control"
 COLDWAR_GRE_R2_sea_control_desc:0 "A fleet built for sea control must coordinate escorts, surface forces and amphibious support beyond home waters. It gives Greece a more useful expeditionary instrument, with a larger continuing readiness bill."
 COLDWAR_GRE_R2_sea_denial:0 "Sea Denial and Coastal Defence"
 COLDWAR_GRE_R2_sea_denial_desc:0 "Submarines, coastal surveillance and a fleet designed for nearby waters can make an opponent's Aegean operations costly. Concentrating on sea denial sacrifices some of the range needed for sustained distant operations."
 COLDWAR_GRE_R2_security_budget:0 "The Security Establishment"
 COLDWAR_GRE_R2_security_budget_desc:0 "A funded security establishment can maintain prepared operational staffs and enforce the regime's authority. Its resources come from the civilian economy and a larger security budget, rather than a free improvement in scientific performance."
 COLDWAR_GRE_R2_security_directorate:0 "The Security Directorate"
 COLDWAR_GRE_R2_security_directorate_desc:0 "Ioannidis can replace cabinet balancing with a tighter security network and politically dependable officers. His control rests on the apparatus of the state rather than a broad civilian constituency, increasing its cost and narrowing commercial confidence."
 COLDWAR_GRE_R2_service_council:0 "Bargain with the Services"
 COLDWAR_GRE_R2_service_council_desc:0 "A genuine service council gives naval and air commanders a stronger voice in national planning. Better coordination comes at the expense of the ruler's freedom to govern the armed forces through personal appointments."
 COLDWAR_GRE_R2_services_reconciled:0 "Reconcile the Services"
 COLDWAR_GRE_R2_services_reconciled_desc:0 "A reconciliation with the services must address appointments, professional confidence and the consequences of the failed countercoup. Funded joint work can improve naval coordination while reducing the crown's freedom to govern through personal loyalties."
 COLDWAR_GRE_R2_shipping:0 "Merchant Shipping Services"
 COLDWAR_GRE_R2_shipping_desc:0 "Registry, chartering, insurance and port services can retain a greater share of Greek shipping earnings. Competitive tax treatment encourages that activity, while reducing the public share of each unit of commercial income."
 COLDWAR_GRE_R2_shipyards:0 "The Piraeus Shipyards"
 COLDWAR_GRE_R2_shipyards_desc:0 "Greece's merchant fleet gives the country maritime reach, but domestic yards still need machinery and investment. Expanding the Piraeus shipbuilding and repair base creates productive capacity at home instead of assuming that Greek-owned tonnage already provides it."
 COLDWAR_GRE_R2_skills_return:0 "A German Technical Exchange"
 COLDWAR_GRE_R2_skills_return_desc:0 "Technical exchange with West Germany can turn migration links into productive expertise at home. Greek firms and training institutions gain capability, while the programme pays for continuing cooperation and education."
 COLDWAR_GRE_R2_social_contract:0 "A Social Contract"
 COLDWAR_GRE_R2_social_contract_desc:0 "A social settlement can bring excluded citizens into public life and fund a wider social commitment. That political mobilisation requires a real social budget rather than a purely administrative promise."
 COLDWAR_GRE_R2_staff_network:0 "Prepare the Officer Network"
 COLDWAR_GRE_R2_staff_network_desc:0 "Liaison staff and communications make the officer network operational for a limited window. The preparation strengthens the actual coup attempt, consumes funds and ends when the plot is resolved; it is not a permanent global military reform."
 COLDWAR_GRE_R2_tax_compliance:0 "Tax Compliance"
 COLDWAR_GRE_R2_tax_compliance_desc:0 "Auditing commercial income and industrial accounts can widen the effective tax base without relying only on higher headline rates. The revenue requires a more capable tax administration and a continuing administrative budget."
 COLDWAR_GRE_R2_technical:0 "Technical Skills at Home"
 COLDWAR_GRE_R2_technical_desc:0 "Technical schools and practical training can keep more engineering capability at home while maintaining links with Greeks employed abroad. Returning expertise must complement domestic apprenticeships, rather than turn emigration into a simple loss of available workers."
 COLDWAR_GRE_R2_territorial_army:0 "Territorial Defence"
 COLDWAR_GRE_R2_territorial_army_desc:0 "A territorial system gives Greece prepared positions and reserves suited to defending a difficult coastline and land frontier. Its broader mobilization base requires longer training and does not provide the supply economy of a smaller professional cadre."
 COLDWAR_GRE_R2_tribunals:0 "Retain the Exceptional Courts"
 COLDWAR_GRE_R2_tribunals_desc:0 "Exceptional courts give the regime another means to contain organized opposition. Their political reach strengthens administrative control, while the expense and continuing prosecutions make reconciliation harder."
 COLDWAR_GRE_R2_universities:0 "Free and Capable Universities"
 COLDWAR_GRE_R2_universities_desc:0 "Universities need academic freedom, laboratories and stable teaching budgets if Greece is to retain technical expertise. Industrial and electronic research can benefit directly from that investment, without treating every educational reform as a generic construction programme."
 COLDWAR_GRE_R2_visitor_credit:0 "Credit for the Visitor Economy"
 COLDWAR_GRE_R2_visitor_credit_desc:0 "Tour operators, hotels and island services can turn improving transport links into foreign earnings. Directing credit toward the visitor economy produces services quickly, but leaves less subsidized finance for industrial construction."
 COLDWAR_GRE_R2_western_bargain:0 "The Western Bargain"
 COLDWAR_GRE_R2_western_bargain_desc:0 "A practical Western bargain can secure technical cooperation and commercial opportunities without abandoning a social programme at home. Closer access to external expertise also makes Athens more exposed to the preferences of its Western partners."
 COLDWAR_GRE_R2_yugoslav_corridor:0 "A Balkan Transit Understanding"
