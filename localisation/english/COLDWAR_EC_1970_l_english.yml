 COLDWAR_EC.1.t: "The Council Votes"
 COLDWAR_EC.1.d: "[COLDWAR_EC_ev_presidency_line] §Y[COLDWAR_EC_ev1_item_title]§! is now before the Council of the [COLDWAR_EC_GetOrgName]. Our delegation has §Y30 days§! to vote in the Communities window (§YShift+I§!). Only governments led by players vote; passive members neither vote nor count."
 COLDWAR_EC.2.t: "Council Decision"
 COLDWAR_EC_ev_res_14_e2: "§GA Community assistance programme starts§! for two years: [COLDWAR_EC_sn_ev2_target]."
 COLDWAR_EC.2.d: "§Y[COLDWAR_EC_ev2_item_title]§!\n\n[COLDWAR_EC_ev2_result]"
 COLDWAR_EC.3.t: "Ratification Required"
 COLDWAR_EC.3.d: "§Y[COLDWAR_EC_ev3_item_title]§! now needs the ratification of every member. Our government chooses in the Communities window: our parliament (90 days, 50 political power) or a referendum (60 days, decided by support for Europe). Without a choice within a year, parliament ratifies automatically."
 COLDWAR_EC.4.t: "An Offer from the Communities"
 COLDWAR_EC.4.d: "The Council of the [COLDWAR_EC_GetOrgName] offers us §Y[COLDWAR_EC_ev4_item_title]§!. We answer in the Communities window under §YYour Desk§!. The offer waits while our government is away; it lapses after 60 days in which we are played without answering."
 COLDWAR_EC.5.t: "Community Business"
 COLDWAR_EC_ev_res_14_e5: "§GA Community assistance programme starts§! for two years: [COLDWAR_EC_sn_ev5_target]."
 COLDWAR_EC.5.d: "§Y[COLDWAR_EC_ev5_item_title]§!\n\n[COLDWAR_EC_ev5_result]"
 COLDWAR_EC.6.t: "Request Not Pursued"
 COLDWAR_EC_ev_res_14_e6: "§GA Community assistance programme starts§! for two years: [COLDWAR_EC_sn_ev6_target]."
 COLDWAR_EC.6.d: "§Y[COLDWAR_EC_ev6_item_title]§!\n\n[COLDWAR_EC_ev6_result]"
 COLDWAR_EC.8.t: "Community Assistance"
 COLDWAR_EC_ev_res_14_e8: "§GA Community assistance programme starts§! for two years: [COLDWAR_EC_sn_ev8_target]."
 COLDWAR_EC.8.d: "[COLDWAR_EC_ev8_result]"
 COLDWAR_EC.9.t: "Enlargement of the Communities"
 COLDWAR_EC.9.d: "§Y[COLDWAR_EC_sn_ev9_target]§! is now a member of the [COLDWAR_EC_GetOrgName]. Council weights, seats in Parliament, the presidency order and the stars of the emblem change with it."
 COLDWAR_EC.10.t: "Presidency of the Council"
 COLDWAR_EC.10.d: "For the next six months our ministers chair the Council of the [COLDWAR_EC_GetOrgName]. We may put one file first on the agenda[COLDWAR_EC_ev_pres_free]."
 COLDWAR_EC.11.t: "A New Commission"
 COLDWAR_EC.11.d: "The term of the Commission ends. For 30 days every member government may put forward a candidate in the Communities window (50 political power). The candidate of the member with the largest Council weight goes to the Council, which appoints by common accord."
 COLDWAR_EC.12.t: "European Elections"
 COLDWAR_EC.12.d: "The citizens of the Communities have elected the European Parliament. Our delegation now holds §Y[?cwec_seats|0]§! seats. The next election follows in five years."
 COLDWAR_EC.13.t: "The Commission Appointed"
 COLDWAR_EC.13.d: "§Y[COLDWAR_EC_sn_g_com]§! provides the President of the Commission for the new term."
 COLDWAR_EC.14.t: "Referendum Result"
 COLDWAR_EC.14.d: "In the referendum on §Y[COLDWAR_EC_ev14_item_title]§! §Y[?cwec_last_referendum|0]%§! voted Yes. [COLDWAR_EC_ev14_referendum]"
 COLDWAR_EC.15.t: "Assistance Capacity Exceeded"
 COLDWAR_EC.15.d: "The Community programmes abroad take their share of our aid administration. Our assistance capacity is now §Y[?mdcw_cw_cap_max|0]§!, but our own programmes use §Y[?mdcw_cw_cap_used|0]§!. We have §Y7 days§! to end a programme in the Cold War window. Otherwise our newest programme ends: §Y[COLDWAR_EC_ev_newest]§!."
 COLDWAR_EC.16.t: "Programme Ended"
 COLDWAR_EC.16.d: "To stay within our assistance capacity our newest programme has ended: §Y[COLDWAR_EC_ev_ended]§!."
 COLDWAR_EC.17.t: "Application for Membership"
 COLDWAR_EC.17.d: "§Y[COLDWAR_EC_sn_ev17_target]§! has applied to join the [COLDWAR_EC_GetOrgName] (Article 237). Any member government can ask the Commission for an opinion and the opening of negotiations in the Proposals tab (D1)."
 COLDWAR_EC.18.t: "Request for Association"
 COLDWAR_EC.18.d: "§Y[COLDWAR_EC_sn_ev18_target]§! asks for an association agreement with the [COLDWAR_EC_GetOrgName] (Article 238). A member government can request it from the Commission in the Proposals tab (D2)."
 COLDWAR_EC.19.t: "Court of Justice"
 COLDWAR_EC_ev_court_open_e19: "The Commission takes §Y[COLDWAR_EC_sn_ev19_target]§! to the Court of Justice: sanctions against a fellow member break the Treaty. Judgment follows in 180 days."
 COLDWAR_EC_ev_court_judgment_e19: "The Court of Justice rules against §Y[COLDWAR_EC_sn_ev19_target]§!: support for Europe falls, the other members think worse of it[COLDWAR_EC_ev_court_fine]."
 COLDWAR_EC.19.d: "[COLDWAR_EC_ev19_court]"
 COLDWAR_EC.ok: "Noted."
