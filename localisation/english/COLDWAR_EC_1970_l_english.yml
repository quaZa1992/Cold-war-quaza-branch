 COLDWAR_EC_nw_A1: "The Communities finance themselves from their own resources (customs duties, farm levies and a share of VAT) instead of national contributions. Europe gains a budget of its own, and the Parliament a say over it."
 COLDWAR_EC_nw_A2: "The heads of government will meet regularly as the European Council. Europe gets a steering body at the top, and the big capitals more say in it."
 COLDWAR_EC_nw_A3: "The Parliament gains the power to reject the budget, and a Court of Auditors checks how the Communities spend their money."
 COLDWAR_EC_nw_A4: "The citizens will elect the European Parliament directly. Its members no longer come from the national parliaments. Europe gains a democratic voice of its own."
 COLDWAR_EC_nw_A5: "For the first time the Council outvotes a member that invokes a vital interest. The Luxembourg compromise loses its force: no single capital can hold up Community business at will."
 COLDWAR_EC_nw_A6: "A European flag, a European anthem and a common passport: the Communities reach out to their citizens."
 COLDWAR_EC_nw_A7: "The members commit to a single market without internal frontiers by 1992 and vote far more often by qualified majority. Europe is set to become one market, a challenge for every trading partner."
 COLDWAR_EC_nw_A8: "The participating members abolish the checks at their common borders. People and goods cross freely; the outer frontier of the Schengen area becomes the real border."
 COLDWAR_EC_nw_A9: "The Communities become the European Union: a single currency on the horizon, a common foreign and security policy and a European citizenship. Europe takes a large step towards political union."
 COLDWAR_EC_nw_A10: "The members form a Union of States: the governments work together on foreign policy and defence, and each keeps its veto. A Europe of nations, independent of Washington and cool towards the Commission."
 COLDWAR_EC_nw_A11: "The members found a European Union step by step: a common foreign policy, economic and monetary union in stages and a stronger Parliament."
 COLDWAR_EC_nw_A12: "A federal treaty: the Parliament legislates together with the Council, the veto is abolished and the Union gains powers of its own. Europe moves towards a federation."
 COLDWAR_EC_nw_B1: "The members narrow the margins between their currencies and co-ordinate their economic policies, the first step towards economic and monetary union."
 COLDWAR_EC_nw_B2: "The currencies of the members float together in a narrow band against the dollar: the snake in the tunnel. Europe begins to shield itself from the swings of the dollar."
 COLDWAR_EC_nw_B3: "Fixed but adjustable exchange rates and a new European currency unit, the ECU. Monetary stability in Europe, with the Deutsche Mark at its centre."
 COLDWAR_EC_nw_B4: "A programme of some three hundred measures to tear down the barriers between the national markets. Business across Europe prepares for one market."
 COLDWAR_EC_nw_B5: "Money moves freely between the members. Banks and investors gain; the governments lose the use of capital controls."
 COLDWAR_EC_nw_B6: "The first stage of economic and monetary union: the currencies join the exchange rate mechanism and the central banks work together. The road to a single currency is open."
 COLDWAR_EC_nw_B7: "The members agree on a single currency and a European central bank. Monetary sovereignty passes to Europe; the largest currency area after the dollar is in the making."
 COLDWAR_EC_nw_B8: "The parities between the currencies of the members are fixed for good. In all but name Europe has one currency."
 COLDWAR_EC_nw_B9: "In an oil crisis the members share their oil and their stocks. The oil weapon can no longer single out one Community country."
 COLDWAR_EC_nw_B10: "The Communities borrow on the capital markets and lend to [COLDWAR_EC_news_byname] to cover its balance of payments. Europe stands behind one of its members."
 COLDWAR_EC_nw_C1: "Community waters are open to the fishermen of every member, under common catch quotas. The coastal states lose control of their fishing grounds."
 COLDWAR_EC_nw_C2: "Small farms are bought out and merged into modern holdings. Fewer farmers, more output and anger in the countryside."
 COLDWAR_EC_nw_C3: "The Communities adopt common rules against the pollution of air and water. The polluter pays."
 COLDWAR_EC_nw_C4: "Equal pay for men and women and common social rights become Community law. Workers gain; employers pay."
 COLDWAR_EC_nw_C5: "A fund moves Community money to the poorer regions. The rich members pay; the periphery builds roads, harbours and factories."
 COLDWAR_EC_nw_C7: "The members pool their research in information technology: Europe's answer to the computer industries of America and Japan."
 COLDWAR_EC_nw_C8: "Each member may produce only so much milk; above its quota a levy is due. The butter mountains shrink, and the dairy farmers protest."
 COLDWAR_EC_nw_C9: "[COLDWAR_EC_news_byname] gets part of its net contribution to the budget back every year. The quarrel over the budget is settled; the other members pay the difference."
 COLDWAR_EC_nw_C10: "Programmes for the Mediterranean regions of the Communities prepare them for the competition of the new members from the south."
 COLDWAR_EC_nw_C11: "Students may study in another member state with Community grants. A generation grows up European."
 COLDWAR_EC_nw_C12: "The structural funds are doubled and pay for programmes of several years in the poorer regions. The rich members finance the catching-up of the south."
 COLDWAR_EC_nw_C13: "The heads of government proclaim the fundamental social rights of the workers, a social side for the single market."
 COLDWAR_EC_nw_C14: "The guaranteed prices for farm produce are cut and replaced by direct aid. Cheaper food and smaller surpluses, but protests from the farmers."
 COLDWAR_EC_nw_D1: "[COLDWAR_EC_sn_n_target] is to join the Communities. The Common Market grows; the new member takes over the laws of the Community and pays into its budget."
 COLDWAR_EC_nw_D2: "[COLDWAR_EC_sn_n_target] is associated with the Communities: free trade, aid and political dialogue, and perhaps one day membership."
 COLDWAR_EC_nw_D3: "Spain and Israel gain preferential access to the Common Market. The Communities reach into the Mediterranean."
 COLDWAR_EC_nw_D4: "Free trade in industrial goods with the EFTA countries that stay outside. Western Europe becomes one free-trade area."
 COLDWAR_EC_nw_D5: "The developing countries may export to the Communities free of duty. Trade, not only aid."
 COLDWAR_EC_nw_D6: "Aid, trade preferences and stable export earnings for dozens of countries in Africa, the Caribbean and the Pacific. Europe binds its former colonies to itself."
 COLDWAR_EC_nw_D7: "Trade and co-operation agreements with the countries around the Mediterranean. Europe's southern neighbours look to Brussels."
 COLDWAR_EC_nw_D8: "The European Communities and COMECON recognise each other. Trade across the Iron Curtain eases, and Washington watches warily."
 COLDWAR_EC_nw_D9: "East Germany becomes part of the Communities through German unity, without a treaty of accession. Community law applies in Leipzig and Dresden."
 COLDWAR_EC_nw_E1: "The foreign ministers will meet regularly to co-ordinate their foreign policy. Europe begins to speak with one voice."
 COLDWAR_EC_nw_E2: "The members declare a common European identity and strengthen their political co-operation. Europe defines its place in the world: beside the superpowers, not under them."
 COLDWAR_EC_nw_E3: "Europe opens a dialogue with the Arab League on oil, trade and the Middle East. Israel and the United States are concerned."
 COLDWAR_EC_nw_E4: "The members speak with one voice at the Conference on Security and Co-operation in Europe. Human rights enter the diplomacy between East and West."
 COLDWAR_EC_nw_E5: "The members recognise the right of the Palestinians to self-determination and want the PLO associated with the peace talks. Anger in Israel and Washington; approval in the Arab world."
 COLDWAR_EC_nw_E6: "The members adopt a common position on [COLDWAR_EC_sn_n_target]. Towards [COLDWAR_EC_sn_n_target] they now act as one, with the weight of the whole Community."
 COLDWAR_EC_nw_E7: "Foreign policy is decided by majority. No single member can block the voice of Europe abroad any longer."
 COLDWAR_EC_nw_E8: "The members declare Europe a third force between the superpowers. Moscow welcomes it; Washington is alarmed."
