 COLDWAR_EC_ev_res_1: "§GAdopted§! by the player governments: For [?global.cwec_last_wf|0] of [?global.cwec_last_w|0] Council votes (needed [?global.cwec_last_q|0]); Parliament For [?global.cwec_last_sf|0], Against [?global.cwec_last_sa|0]."
