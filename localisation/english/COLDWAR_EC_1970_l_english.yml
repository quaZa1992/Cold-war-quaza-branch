 COLDWAR_EC_ev_res_6: "§YAdopted against the opinion of Parliament§!: For [?global.cwec_last_wf|0] of [?global.cwec_last_w|0] Council votes. Overriding Parliament costs support for Europe (-2 in every member)."
 COLDWAR_EC_ev_res_7: "§RDeclined§!: the partner country did not accept."
 COLDWAR_EC_ev_res_8: "§RRatification failed§!: a member accepted a lost referendum. The treaty returns after a year."
