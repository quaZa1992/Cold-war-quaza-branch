 COLDWAR_EC_nwh_1: "The members have six months to put it into national law; then it takes effect."
 COLDWAR_EC_nwh_2: "It is in force at once."
 COLDWAR_EC_nwh_3: "It now goes as an offer to §Y[COLDWAR_EC_sn_n_target]§!, which decides whether to accept."
 COLDWAR_EC_nwh_4: "It now needs the ratification of every member, by its parliament or by a referendum."
 COLDWAR_EC_nwh_7: "The conference negotiates the treaty for six months; then the Council votes on the final text, and every member must ratify it."
 COLDWAR_EC_nwh_8: "The negotiations take a year and a half. The treaty of accession then needs the Council, the assent of the Parliament where required, and the ratification of every member."
