 COLDWAR_EC_ev_res_3: "§RBlocked§!: [COLDWAR_EC_sn_g_last_vetoer] invoked a vital national interest (Luxembourg compromise)."
 COLDWAR_EC_ev_res_4: "§RRejected by the European Parliament§!: Against [?global.cwec_last_sa|0] of [?global.cwec_last_s|0] player seats."
