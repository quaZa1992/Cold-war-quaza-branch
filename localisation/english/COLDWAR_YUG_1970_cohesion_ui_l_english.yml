 COLDWAR_YUG_1970_ui_bands_tt:0 "§YFederal Cohesion§!\nBelow §Y60§!: Federal Deadlock.\nBelow §O40§!: Constitutional Crisis and possible sovereignty motions.\nBelow §R20§!: Breaking Point. A qualifying motion can trigger a 90-day secession warning."
 COLDWAR_YUG_1970_ui_loss_tt:0 "The net loss assessed at the last monthly review. Disputes increase pressure. Tito in office halves dispute pressure. After his death, succession, funding agreements and economic relief can reduce the additional strain."
 COLDWAR_YUG_1970_ui_succession_tt:0 "A prepared handover reduces the initial loss when Tito dies. The federal succession decision requires a qualifying mandate and presidency arrangement."
 COLDWAR_YUG_1970_ui_cases_tt:0 "An open dispute adds monthly pressure. If it remains unresolved after its 90-day response window, it can advance at the next monthly review."
 COLDWAR_YUG_1970_ui_fiscal_tt:0 "Federal contributions, debt allocation and development arrears. Funding and oversight settlements can resolve the dispute. An active budget bridge temporarily halves its pressure."
 COLDWAR_YUG_1970_ui_constitutional_tt:0 "Disputes over federal and republican authority. Use constitutional mediation or negotiate settlement terms with the claimant."
 COLDWAR_YUG_1970_ui_provincial_tt:0 "Disputes over provincial guarantees and security. A local security accord can settle an eligible case."
 COLDWAR_YUG_1970_ui_command_tt:0 "Disputes over the chain of command and local security. A compact or ceasefire may be available once the conditions are met."
 COLDWAR_YUG_1970_ui_exit_tt:0 "A named claimant can receive a 90-day secession warning below 20 cohesion. An unresolved claim may advance at the monthly review after the deadline if the claimant and its territory meet the conditions."
 COLDWAR_YUG_1970_ui_armed_tt:0 "Armed refusal requires a separate 90-day warning. A conflict can begin at a monthly review if the warning has expired and the claim still meets the military conditions."
