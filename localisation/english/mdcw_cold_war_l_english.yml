  mdcw_cw.2.t: "Programme Terminated"
  mdcw_cw.2.d: "§Y[?var:mdcw_cw_ev2_partner.GetNameDef]§! has terminated our §Y[mdcw_cw_ev2_prog_L]§! in their country. The capacity we had committed is free again; what was built or learned stays.[mdcw_cw_ev2_more_L]"
  mdcw_cw.2.a: "Noted."
  mdcw_cw.6.t: "Programme Ended"
  mdcw_cw.6.d: "The §Y[mdcw_cw_ev6_prog_L]§! of §Y[?var:mdcw_cw_ev6_partner.GetNameDef]§! in our country has ended. Its benefits no longer apply.[mdcw_cw_ev6_more_L]"
  mdcw_cw.6.a: "Noted."
  mdcw_cw.3.t: "A Shift in the Blocs"
  mdcw_cw.3.d: "§Y[?var:mdcw_cw_ev3_partner.GetNameDef]§! has left the §Y[mdcw_cw_ev3_old_L]§! and is now part of the §Y[mdcw_cw_ev3_new_L]§!. Running programmes are not affected; whether they continue is a political decision."
  mdcw_cw.3.a: "We will take note."
  mdcw_cw.4.t: "Foreign Political Campaign"
  mdcw_cw.4.d: "§Y[?var:mdcw_cw_ev4_partner.GetNameDef]§! has launched a public political support campaign for the §Y[mdcw_cw_ev4_party_L]§! in our country.\n\nWe decide how much room it gets: open the Cold War window, tab §YProgrammes§!, and set the access level. Restricting it costs 25 political power and a little every day."
  mdcw_cw.4.a: "We will decide on the access."
  mdcw_cw.5.t: "Campaign Access Changed"
  mdcw_cw.5.d: "§Y[?var:mdcw_cw_ev5_partner.GetNameDef]§! has set the access of our public support campaign to §Y[mdcw_cw_ev5_access_L]§!."
  mdcw_cw.5.a: "Noted."
  mdcw_cw.10.t: "Bloc Embargo"
  mdcw_cw.10.d: "§Y[?var:mdcw_cw_ev10_partner.GetNameDef]§! has imposed §Y[mdcw_cw_ev10_type_L]§! sanctions on §Y[?var:mdcw_cw_ev10_target.GetNameWithFlag]§! and calls on every member of our bloc to follow.\n\nTo join, impose the same sanctions from the diplomacy screen of [?var:mdcw_cw_ev10_target.GetNameDef]. Joining earns the gratitude of our bloc leader (§G+15§! opinion); the usual costs and blowback of sanctions apply. Nobody is forced to join."
  mdcw_cw.10.a: "We will consider it."
  mdcw_cw.12.t: "Detente"
  mdcw_cw.12.d: "§Y[?var:mdcw_cw_ev12_a.GetNameDef]§! and §Y[?var:mdcw_cw_ev12_b.GetNameDef]§! have agreed to ease tensions between their camps. Talks on arms control and trade begin; markets breathe a sigh of relief."
  mdcw_cw.12.a: "A new chapter."
  mdcw_cw.13.t: "Targeted Oil Embargo"
  mdcw_cw.13.d: "An oil embargo announced by §Y[?var:mdcw_cw_ev13_partner.GetNameDef]§! targets §Y[?var:mdcw_cw_ev13_target.GetNameDef]§!. Import-dependent buyers there may face a higher effective oil price, while the exporter risks losing sales. The effect depends on the exporter's share of world oil supply and the target's reliance on imported crude.\n\nTrade relations between the two countries fall by 100 while this oil embargo lasts. Other producers may join or continue trading. The separate general embargo policy is unaffected, and the oil embargo can be lifted at any time."
  mdcw_cw.13.a: "A new pressure on the oil market."
  mdcw_cw.14.t: "OPEC: Proposal to Raise Oil Prices"
  mdcw_cw.14.d: "§Y[?var:mdcw_cw_ev_opec_proposer.GetNameDef]§! has called an OPEC conference. The ballot closes in 14 days. Every human delegation, including the proposer, may vote; AI delegations abstain. Only a majority of votes cast can authorize a change, and the market effect depends on the world oil-export share of the countries that vote yes.\n\nThe proposal would raise the common posted price. A yes vote commits our country to the price agreement for two years if it passes; our own national asking-price setting remains separate."
  mdcw_cw.14.a: "Support the proposal."
  mdcw_cw.14.b: "Oppose the proposal."
  mdcw_cw.14.c: "Abstain."
  mdcw_cw.15.t: "OPEC: Proposal to Lower Oil Prices"
  mdcw_cw.15.d: "§Y[?var:mdcw_cw_ev_opec_proposer.GetNameDef]§! has called an OPEC conference. The ballot closes in 14 days. Every human delegation, including the proposer, may vote; AI delegations abstain. Only a majority of votes cast can authorize a change, and the market effect depends on the world oil-export share of the countries that vote yes.\n\nThe proposal would lower the common posted price. A yes vote commits our country to a two-year price-cut policy if it passes. This could ease costs for importers but narrow exporters' margins."
  mdcw_cw.15.a: "Support the proposal."
  mdcw_cw.15.b: "Oppose the proposal."
  mdcw_cw.15.c: "Abstain."
  mdcw_cw.16.t: "OPEC: Proposal to Restrain Supply"
  mdcw_cw.16.d: "§Y[?var:mdcw_cw_ev_opec_proposer.GetNameDef]§! has called an OPEC conference. The ballot closes in 14 days. Every human delegation, including the proposer, may vote; AI delegations abstain. Only a majority of votes cast can authorize a change, and the market effect depends on the world oil-export share of the countries that vote yes.\n\nThe proposal would tighten the world oil market. If it passes, supporters accept a six-month reduction in oil-export income to represent the barrels they hold back. Opponents and abstainers make no pledge."
  mdcw_cw.16.a: "Support the proposal."
  mdcw_cw.16.b: "Oppose the proposal."
  mdcw_cw.16.c: "Abstain."
  mdcw_cw.18.t: "OPEC Agrees to Raise Oil Prices"
  mdcw_cw.18.d: "An OPEC conference convened by §Y[?var:mdcw_cw_ev_opec_proposer.GetNameDef]§! has reached an agreement. The countries that supported it are:[mdcw_cw_opec_supporter_PER_L][mdcw_cw_opec_supporter_IRQ_L][mdcw_cw_opec_supporter_KUW_L][mdcw_cw_opec_supporter_SAU_L][mdcw_cw_opec_supporter_VEN_L][mdcw_cw_opec_supporter_QAT_L][mdcw_cw_opec_supporter_IND_L][mdcw_cw_opec_supporter_LBA_L][mdcw_cw_opec_supporter_UAE_L][mdcw_cw_opec_supporter_ALG_L]\n\nTheir combined share of world oil exports now raises the common posted price. Members that rejected the motion or abstained did not join the two-year commitment. National asking prices remain separate."
  mdcw_cw.18.a: "Importers will take notice."
  mdcw_cw.19.t: "OPEC Agrees to Lower Oil Prices"
  mdcw_cw.19.d: "An OPEC conference convened by §Y[?var:mdcw_cw_ev_opec_proposer.GetNameDef]§! has reached an agreement. The countries that supported it are:[mdcw_cw_opec_supporter_PER_L][mdcw_cw_opec_supporter_IRQ_L][mdcw_cw_opec_supporter_KUW_L][mdcw_cw_opec_supporter_SAU_L][mdcw_cw_opec_supporter_VEN_L][mdcw_cw_opec_supporter_QAT_L][mdcw_cw_opec_supporter_IND_L][mdcw_cw_opec_supporter_LBA_L][mdcw_cw_opec_supporter_UAE_L][mdcw_cw_opec_supporter_ALG_L]\n\nTheir combined share of world oil exports lowers the common posted price. The supporters will defend the lower price for two years; other members have made no commitment."
  mdcw_cw.19.a: "A concession to the market."
  mdcw_cw.20.t: "OPEC Members Agree to Restrain Supply"
  mdcw_cw.20.d: "An OPEC conference convened by §Y[?var:mdcw_cw_ev_opec_proposer.GetNameDef]§! has reached an agreement. The countries that supported it are:[mdcw_cw_opec_supporter_PER_L][mdcw_cw_opec_supporter_IRQ_L][mdcw_cw_opec_supporter_KUW_L][mdcw_cw_opec_supporter_SAU_L][mdcw_cw_opec_supporter_VEN_L][mdcw_cw_opec_supporter_QAT_L][mdcw_cw_opec_supporter_IND_L][mdcw_cw_opec_supporter_LBA_L][mdcw_cw_opec_supporter_UAE_L][mdcw_cw_opec_supporter_ALG_L]\n\nThese producers will restrain exports for six months, giving up some sales while their combined weight drives up the posted oil price and causes a short-term market spike. Other members remain outside the pledge."
  mdcw_cw.20.a: "The oil market tightens."
  mdcw_cw.21.t: "OPEC Conference Ends Without Agreement"
  mdcw_cw.21.d: "The OPEC conference convened by §Y[?var:mdcw_cw_ev_opec_proposer.GetNameDef]§! has ended without a majority. §Y[?global.mdcw_cw_opec_yes_votes|0]§! members voted in favour and §Y[?global.mdcw_cw_opec_no_votes|0]§! opposed; the rest abstained. The proposed change to the common oil policy will not take effect."
  mdcw_cw.21.a: "No common policy this time."
  mdcw_cw.9.t: "Programme Could Not Start"
  mdcw_cw.9.d: "Our §Y[mdcw_cw_ev9_prog_L]§! for §Y[?var:mdcw_cw_ev9_partner.GetNameDef]§! was accepted, but it could not start: we lack the assistance capacity, we are at war with them, or the same programme is already running."
  mdcw_cw.9.a: "Unfortunate."
