  mdcw_cw_join_beijing_tt: "§YAlign with the Beijing Camp§!\nCost: §Y[?mdcw_cw_switch_cost_3|0]§! political power (15 per bloc point, at most 150). Joining from Non-Aligned costs half. -25% if the bloc leader runs a programme in our country, -50% if we facilitate its public support campaign.\n§YRequires a ruling party of:§! Communist State, Anarchist Communism, Emerging Autocracy, Neutral Social, Neutral Communism.\n\nLeaving a bloc gives Diplomatic Realignment for 180 days and angers the old bloc leader. The new alignment is locked for 2 years (estranged members may always leave). Running programmes continue. Cold War Tension rises with our bloc points.\n\nHover over the bloc's share for its effects."
