  mdcw_cw_ov_card_beijing_tier: "[mdcw_cw_bloc_tier_3_L]"
  mdcw_cw_ov_card_beijing_tt: "§YBeijing Camp§! · §Y[?global.mdcw_cw_share_pct_3|0]%§! of world power · network x[?global.mdcw_cw_scale_3|2] (with cohesion)\nSelf-reliance and revolutionary solidarity; isolated from both technology blocs.\n\n§YIdeology§!: open to Communist State, Anarchist Communism, Emerging Autocracy, Neutral Social, Neutral Communism.\nCohesion §Yx[?global.mdcw_cw_cohesion_3|2]§!: core ideologies (Communist State, Anarchist Communism, Neutral Communism) hold §Y[?global.mdcw_cw_core_pct_3|0]%§! of the bloc's points. Estranged members: §Y[?global.mdcw_cw_estranged_3|0]§!.\n\n§YEvery member§!\n Foreign influence defence: §G+10%§!\n Sanction resistance: §G+10%§!\n War support: §G+3%§!\n Globalism equilibrium: §Y-15§!\n Trade opinion: §R-15%§!\n Research speed: §R-2%§!\n Emerging Outlook drift: §Y+0.02§!\n\n§YGrows with the bloc (now)§!\n Construction speed: [?global.mdcw_cw_fx_3_network_build|+%1]\n Army training time: [?global.mdcw_cw_fx_3_network_train|-%1]\n Stability: [?global.mdcw_cw_fx_3_network_stab|+%1]\n\n§YBloc leader [CHI.GetNameDef] (now)§!\n Daily political power: [?global.mdcw_cw_fx_3_leader_pp_gain|+2]\n War support: [?global.mdcw_cw_fx_3_leader_war_sup|+%1]\n Consumer goods: [?global.mdcw_cw_fx_3_leader_consumer|-%1]\n Base upkeep: §R[?global.mdcw_cw_upkeep_3_weekly|2]bn§! per week (shown in MD's budget; active leader programmes can increase it)[mdcw_cw_bp_3_L]"
