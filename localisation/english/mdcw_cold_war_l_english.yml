  mdcw_cw_market_fx_5: "§YBoom§!: Strong investment brings mounting inflation and overheating.\nOffice income: §G+8%§!, Return on investment: §G+0.5%§!, Productivity growth: §G+2%§!, Civilian factory income: §G+3%§!, Interest rate: §R+0.75§!, Consumer goods: §R+5%§!"
