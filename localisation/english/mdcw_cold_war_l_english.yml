  mdcw_cw_ov_capacity_tt: "Capacity comes from our power rank (superpower 8, great power 6, large power 4, regional power 3, minor power 2, others 1). Bloc leaders gain more as their bloc grows, the national idea §YInternational Development Agency§! adds 4. A programme needs 1-3 capacity by package size, a public support campaign needs 1.\n\nWhat we receive is limited per effect; the national idea §YOpen Door Aid Policy§! raises these limits by 50% and makes incoming programmes 25% more effective."
