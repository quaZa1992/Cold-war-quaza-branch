  mdcw_cw_ov_card_soviet_tier: "[mdcw_cw_bloc_tier_2_L]"
  mdcw_cw_ov_card_soviet_tt: "§YSoviet Bloc§! · §Y[?global.mdcw_cw_share_pct_2|0]%§! of world power · network x[?global.mdcw_cw_scale_2|2] (with cohesion)\nPlanned trade inside Comecon and Soviet oil at friendship prices; cut off from Western capital.\n\n§YIdeology§!: open to Communist State, Anarchist Communism, Conservative Emerging, Emerging Autocracy, Neutral Social, Neutral Communism.\nCohesion §Yx[?global.mdcw_cw_cohesion_2|2]§!: core ideologies (Communist State, Anarchist Communism, Emerging Autocracy, Neutral Communism) hold §Y[?global.mdcw_cw_core_pct_2|0]%§! of the bloc's points. Estranged members: §Y[?global.mdcw_cw_estranged_2|0]§!.\n\n§YEvery member§!\n Sanction resistance: §G+10%§!\n Stability: §G+2%§!\n Globalism equilibrium: §Y-10§!\n Return on investment: §R-0.5%§!\n Trade opinion: §R-10%§!\n Emerging Outlook drift: §Y+0.02§!\n\n§YGrows with the bloc (now)§!\n Oil price resistance: [?global.mdcw_cw_fx_2_network_oil_res|+%1]\n Equipment upkeep: [?global.mdcw_cw_fx_2_network_equip|-%1]\n Factory efficiency growth: [?global.mdcw_cw_fx_2_network_eff_gain|+%1]\n Productivity growth: [?global.mdcw_cw_fx_2_network_prod_growth|+%1]\n\n§YBloc leader [SOV.GetNameDef] (now)§!\n Daily political power: [?global.mdcw_cw_fx_2_leader_pp_gain|+2]\n Military factory output: [?global.mdcw_cw_fx_2_leader_ic|+%1]\n Sanction effectiveness: [?global.mdcw_cw_fx_2_leader_sanc_eff|+%1]\n Oil export income: [?global.mdcw_cw_fx_2_leader_oil_exp|+%1]\n Base upkeep: §R[?global.mdcw_cw_upkeep_2_weekly|2]bn§! per week (shown in MD's budget; active leader programmes can increase it)[mdcw_cw_bp_2_L]"
  mdcw_cw_join_soviet_btn: "[mdcw_cw_join_soviet_label_L]"
  mdcw_cw_join_soviet_tt: "§YAlign with the Soviet Bloc§!\nCost: §Y[?mdcw_cw_switch_cost_2|0]§! political power (15 per bloc point, at most 150). Joining from Non-Aligned costs half. -25% if the bloc leader runs a programme in our country, -50% if we facilitate its public support campaign.\n§YRequires a ruling party of:§! Communist State, Anarchist Communism, Conservative Emerging, Emerging Autocracy, Neutral Social, Neutral Communism.\n\nLeaving a bloc gives Diplomatic Realignment for 180 days and angers the old bloc leader. The new alignment is locked for 2 years (estranged members may always leave). Running programmes continue. Cold War Tension rises with our bloc points.\n\nHover over the bloc's share for its effects."
