  mdcw_cw_ov_tension_tt: "§YCold War Tension§! (0-100) is separate from vanilla world tension. Programmes and campaigns in opposing blocs, sanctions between the blocs, bloc changes, volunteers, coups, shows of strength and wars between blocs raise it; detente and non-aligned diplomacy lower it.\nEvery month it drifts back to §Y[?global.mdcw_cw_tension_baseline|1]§! (40 plus 0.1 per sanction between opposing blocs, now §Y[?global.mdcw_cw_x_sanctions|0]§!).\nAbove 50 it adds a risk premium to the Imperia oil price: §Y+[?global.mdcw_cw_oil_premium_display|2]§! USD per barrel now.\n\nPolitical climate for every country:\n[mdcw_cw_climate_fx_L]"
  mdcw_cw_ov_oil: "Oil §Y$[?global.imp_oil_price_display|.2]§!/bbl · Producer x[?global.mdcw_cw_oil_level|2][mdcw_cw_oil_embargo_L]"
  mdcw_cw_ov_oil_tt: "§YOil§! - the Imperia oil market under the producer price level\nPrice now: §Y$[?global.imp_oil_price_display|.2]§! per barrel in dollars of the day (§Y$[?global.imp_oil_price_real_display|.2]§! in 1970 dollars; January 1970: $1.80). Market equilibrium §Y$[?global.imp_oil_price_equilibrium_display|.2]§!.\nReal price: §Yx[?global.mdcw_cw_oil_ratio|2]§! of January 1970. US consumer prices: §Yx[?global.mdcw_cw_cpi|2]§! of 1970.\n\n§YProducer price level§! x[?global.mdcw_cw_oil_level|2]: OPEC conferences can vote it up or down. Supporting producers with active higher-price agreements hold §Y[?global.mdcw_cw_opec_pct|0]%§! of world exports; lower-price supporters hold §Y[?global.mdcw_cw_opec_cut_share|%]§!. The larger active coalition determines the monthly direction once it holds at least 25% of exports. Without one, the level drifts back toward x1. National asking-price decisions separately move Imperia's market equilibrium. Above x3 high prices destroy demand (-0.4% a month).\nSignificant oil exporters can use each country's diplomacy screen to impose or lift an oil embargo, or grant an exemption. The target's extra oil cost scales with the embargoing exporters' world export share and its reliance on imported oil. A smaller global premium scales with the exports plausibly disrupted by targets' oil imports (now §Y[?global.mdcw_cw_oil_embargo_world_pct|1]%§! of world net exports at risk). Exporters also lose weekly oil revenue in proportion to sales at risk.\n[mdcw_cw_oil_embargo_tt_L]\n§YConsequences§! run through Imperia's oil effects: importers lose productivity, tax income and consumer goods, oil exporters earn more with every dollar. Above x2.67 each further step hurts importers less (economies adapt), exporters' income keeps growing. At x1.5, x2.5, x4 and x6, import-dependent countries also enter progressively worse oil-shock stages: higher consumer costs, weaker tax receipts, lower factory output and lost stability. Market Confidence falls and petrodollars raise Arms Demand."
  mdcw_cw_ov_market_label: "Market Confidence"
  mdcw_cw_ov_market_value: "§Y[?global.mdcw_cw_market|0]§! / 100 · [mdcw_cw_market_tier_L]"
  # IMPERIA CW — Cold War: GC equilibrium controls and graduated crisis penalties.
  mdcw_cw_ov_market_tt: "§YMarket Confidence§! = 100\n - Cold War Tension x0.7: §R[?global.mdcw_cw_mc_tension|1]§!\n - wars between blocs x3: §R[?global.mdcw_cw_mc_wars|1]§!\n - trade fragmentation (§Y[?global.mdcw_cw_x_econ|0]§! economic and financial sanctions between opposing blocs x0.15, at most 10): §R[?global.mdcw_cw_mc_frag|1]§!\n - oil shock (real oil price §Yx[?global.mdcw_cw_oil_ratio|2]§! of January 1970; 12 per step above x1.2, at most 30): §R[?global.mdcw_cw_mc_oil|1]§![COLDWAR_gc_cw_market_assessment_L]\n\nEffects now at Globalism 50. Each country feels them times its market exposure (x0.25 at Globalism 0, x1 at 50, x2 at 100):\n[mdcw_cw_market_fx_L]"
  mdcw_cw_ov_arms_label: "Arms Demand"
  mdcw_cw_ov_arms_value: "§Y[?global.mdcw_cw_arms|0]§! / 100 · [mdcw_cw_arms_tier_L]"
  # IMPERIA CW — Cold War: GC equilibrium controls and graduated crisis penalties.
  mdcw_cw_ov_arms_tt: "§YArms Demand§! = 0.8 x Tension + 5 x wars between blocs + 0.2 per military programme + petrodollars (2 per step of the real oil price above x1.5, at most 10; now §Y[?global.mdcw_cw_arms_petro|1]§!).[COLDWAR_gc_cw_arms_assessment_L]\nIt drives the military industry tax of the §YMilitary-Industrial Complex§! (+0.4% per point above 25, less below it; from -10% to +30%). Every country also receives the military factory income modifier shown below, regardless of its interest groups.\n\nEffects now:\n[mdcw_cw_arms_fx_L]\nArms sales income applies to international arms sellers, and war metal exports apply to their exporters."
  mdcw_cw_ov_market_effect: "§gMarket on us (x[?mdcw_cw_wm_exposure|2]):§! offices [?mdcw_cw_wm_office|+%0] · returns [?mdcw_cw_wm_roi|+%2] · productivity [?mdcw_cw_wm_prod_growth|+%0] · interest [?mdcw_cw_wm_interest|-2]"
  mdcw_cw_ov_arms_effect: "§gArms & climate:§! arms sales [?mdcw_cw_wm_arms_sales|+%0] · military factory income [?mdcw_cw_wm_mil_income|+%0] · equipment upkeep [?mdcw_cw_wm_equip|-%0] · trade [?mdcw_cw_wm_trade|+%0] · war support [?mdcw_cw_wm_war_sup|+%0] · stability [?mdcw_cw_wm_stab|+%0]"
  mdcw_cw_ov_blocs_title: "§YTHE BLOCS§!"
  mdcw_cw_ov_blocs_hint: "§gEffects grow with each bloc's share of world power§!"
  mdcw_cw_ov_blocs_tt: "§YWorld power§! is the sum of the points of all members. Points come from the Millennium Dawn power rank and change when a country rises or falls: Superpower 20, Great Power 12, Large Power 7, Regional Power 4, Minor Power 2, Non-Power 1.\n\nA bloc's share of all points sets how strong its network effects are: linear up to 25% (x1.0), half as fast above (at most x1.75). Hover over a bloc for its effects.\n\nMinor Bloc (0%+): leader capacity +0, member programmes x1\nEstablished Bloc (15%+): leader capacity +1, member programmes x1\nGlobal Bloc (30%+): leader capacity +2, member programmes x1.1\nDominant Network (45%+): leader capacity +3, member programmes x1.15\n\n§YIdeology§!: only countries whose ruling party fits a bloc may join it; Non-Aligned is open to all. Bloc effects grow with §Ycohesion§!: x0.85 if no member has a core ideology, x1.15 if all bloc points belong to core-ideology members. A member whose government changes to an ideology that does not fit becomes §Restranged§!: its points count 50%, it gets 50% of the network effects and no bloc programmes, it may leave at any time and drifts to Non-Aligned after 12 months."
  mdcw_cw_ov_card_na_name: "§Y$mdcw_cw_bloc_name_0$§!"
  mdcw_cw_ov_card_na_leader: "§gNo bloc leader§!"
  mdcw_cw_ov_card_na_power: "[?global.mdcw_cw_share_pct_0|0]%"
  mdcw_cw_ov_card_na_caption: "§g[?global.mdcw_cw_power_0|0] pts · [?global.mdcw_cw_count_0|0] states§!"
  mdcw_cw_ov_card_na_tier: "§gFree of both camps§!"
  mdcw_cw_ov_card_na_tt: "§YNon-Aligned§! · §Y[?global.mdcw_cw_share_pct_0|0]%§! of world power · network x[?global.mdcw_cw_scale_0|2]\nFree to deal with every bloc; no bloc discounts, no bloc technology.\n\n§YEvery member§!\n Foreign influence defence: §G+5%§!\n Trade opinion: §G+5%§!\n Research speed: §R-1%§!\n Equipment upkeep: §R+3%§!\n\n§YGrows with the bloc (now)§!\n Political power gain: [?global.mdcw_cw_fx_0_network_pp_factor|+%1]\n Foreign influence defence: [?global.mdcw_cw_fx_0_network_fidef|+%1]\n Sanction resistance: [?global.mdcw_cw_fx_0_network_sanc_res|+%1]"
  mdcw_cw_join_na_btn: "[mdcw_cw_join_na_label_L]"
  mdcw_cw_join_na_tt: "§YAlign with the Non-Aligned§!\nCost: §Y[?mdcw_cw_switch_cost_0|0]§! political power (15 per bloc point, at most 150). Leaving a bloc for Non-Aligned costs half. Open to every ruling party.\n\nLeaving a bloc gives Diplomatic Realignment for 180 days and angers the old bloc leader. The new alignment is locked for 2 years (estranged members may always leave). Running programmes continue. Cold War Tension rises with our bloc points.\n\nHover over the bloc's share for its effects."
  mdcw_cw_ov_card_west_name: "§Y$mdcw_cw_bloc_name_1$§!"
  mdcw_cw_ov_card_west_leader: "Led by [USA.GetNameWithFlag]"
  mdcw_cw_ov_card_west_power: "[?global.mdcw_cw_share_pct_1|0]%"
  mdcw_cw_ov_card_west_caption: "§g[?global.mdcw_cw_power_1|0] pts · [?global.mdcw_cw_count_1|0] states§!"
  mdcw_cw_ov_card_west_tier: "[mdcw_cw_bloc_tier_1_L]"
  mdcw_cw_ov_card_west_tt: "§YWestern Bloc§! · §Y[?global.mdcw_cw_share_pct_1|0]%§! of world power · network x[?global.mdcw_cw_scale_1|2] (with cohesion)\nAccess to Western capital, markets and technology - paid for with alliance obligations, dependence on imported oil and open doors for foreign influence. Open economies feel every market shock.\n\n§YIdeology§!: open to Western Autocracy, Conservatism, Liberalism, Socialism, Islamic Kingdom, Neutral Autocracy, Neutral Conservatism, Oligarchism, Neutral Libertarianism, Nationalist Populism, Nationalist Fascism, Nationalist Autocracy, Monarchism.\nCohesion §Yx[?global.mdcw_cw_cohesion_1|2]§!: core ideologies (Conservatism, Liberalism, Socialism) hold §Y[?global.mdcw_cw_core_pct_1|0]%§! of the bloc's points. Estranged members: §Y[?global.mdcw_cw_estranged_1|0]§!.\n\n§YEvery member§!\n Trade opinion: §G+10%§!\n Globalism equilibrium: §Y+5§!\n Foreign influence defence: §R-10%§!\n Military personnel costs: §R+3%§!\n Oil price resistance: §R-10%§!\n Western Outlook drift: §Y+0.02§!\n\n§YGrows with the bloc (now)§!\n Return on investment: [?global.mdcw_cw_fx_1_network_roi|+%2]\n Interest rate: [?global.mdcw_cw_fx_1_network_interest|-2]\n Research speed: [?global.mdcw_cw_fx_1_network_research|+%1]\n Sanction effectiveness: [?global.mdcw_cw_fx_1_network_sanc_eff|+%1]\n\n§YBloc leader [USA.GetNameDef] (now)§!\n Daily political power: [?global.mdcw_cw_fx_1_leader_pp_gain|+2]\n Sanction effectiveness: [?global.mdcw_cw_fx_1_leader_sanc_eff|+%1]\n Interest rate: [?global.mdcw_cw_fx_1_leader_interest|-2]\n Army personnel costs: [?global.mdcw_cw_fx_1_leader_army_pay|-%1]\n Base upkeep: §R[?global.mdcw_cw_upkeep_1_weekly|2]bn§! per week (shown in MD's budget; active leader programmes can increase it)[mdcw_cw_bp_1_L]"
  mdcw_cw_join_west_btn: "[mdcw_cw_join_west_label_L]"
  mdcw_cw_join_west_tt: "§YAlign with the Western Bloc§!\nCost: §Y[?mdcw_cw_switch_cost_1|0]§! political power (15 per bloc point, at most 150). Joining from Non-Aligned costs half. -25% if the bloc leader runs a programme in our country, -50% if we facilitate its public support campaign.\n§YRequires a ruling party of:§! Western Autocracy, Conservatism, Liberalism, Socialism, Islamic Kingdom, Neutral Autocracy, Neutral Conservatism, Oligarchism, Neutral Libertarianism, Nationalist Populism, Nationalist Fascism, Nationalist Autocracy, Monarchism.\n\nLeaving a bloc gives Diplomatic Realignment for 180 days and angers the old bloc leader. The new alignment is locked for 2 years (estranged members may always leave). Running programmes continue. Cold War Tension rises with our bloc points.\n\nHover over the bloc's share for its effects."
