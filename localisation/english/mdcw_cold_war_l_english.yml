  # IMPERIA CW — Cold War: GC equilibrium controls and graduated crisis penalties.
  mdcw_cw_market_fx_3: "§YUneasy§!: Investment slows as confidence weakens.\nOffice income: §R-6%§!, Return on investment: §R-0.5%§!, Productivity growth: §R-2%§!, Cost of investing abroad: §G-5%§!, Interest rate: §G-0.1§!"
