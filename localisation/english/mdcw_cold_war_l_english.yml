l_english:
# IMPERIA CW — Cold War: l english — English localisation.
  mdcw_cw_tt_not_leader: "Is not a bloc leader"
  mdcw_cw_tt_not_subject: "Is not a subject"
  mdcw_cw_tt_not_locked: "Has not changed its alignment in the last 24 months (estranged members may always leave)"
  mdcw_cw_tt_party_west: "Ruling party fits the Western Bloc: Western Autocracy, Conservatism, Liberalism, Socialism, Islamic Kingdom, Neutral Autocracy, Neutral Conservatism, Oligarchism, Neutral Libertarianism, Nationalist Populism, Nationalist Fascism, Nationalist Autocracy, Monarchism"
  mdcw_cw_tt_party_soviet: "Ruling party fits the Soviet Bloc: Communist State, Anarchist Communism, Conservative Emerging, Emerging Autocracy, Neutral Social, Neutral Communism"
  mdcw_cw_tt_party_beijing: "Ruling party fits the Beijing Camp: Communist State, Anarchist Communism, Emerging Autocracy, Neutral Social, Neutral Communism"
  mdcw_cw_tt_not_current: "Is not already in this bloc"
  mdcw_cw_tt_not_neutral: "Has not declared Armed Neutrality"
  mdcw_cw_diplomatic_realignment: "Diplomatic Realignment"
  mdcw_cw_diplomatic_realignment_desc: "We have turned our back on our former partners. Ministries, trade offices and officers need time to adjust to new allies."
  mdcw_cw_program_modifier: "Cold War Assistance"
  mdcw_cw_program_modifier_desc: "The combined effect of all assistance programmes we give and receive, after caps."
  mdcw_cw_world_market_modifier: "Cold War World Market"
  mdcw_cw_world_market_modifier_desc: "Cold War Tension moves market confidence and arms demand. Arms demand also affects military factory income in every country."
  mdcw_cw_world_market_modifier_tt: "Market Confidence §Y[?global.mdcw_cw_market|0]§! ([mdcw_cw_market_tier_L]), Arms Demand §Y[?global.mdcw_cw_arms|0]§! ([mdcw_cw_arms_tier_L]) and Cold War Tension §Y[?global.mdcw_cw_tension|0]§! ([mdcw_cw_tension_tier_L]). Market effects scale with our market exposure (x[?mdcw_cw_wm_exposure|2]): from x0.25 at Globalism 0 to x2 at Globalism 100. Closed economies feel less of the market, but no one is immune."
  mdcw_cw_great_power_competition: "Great Power Competition"
  mdcw_cw_great_power_competition_desc: "Rival blocs compete for our favour with programmes of their own."
  mdcw_cw_great_power_competition_tt: "Incoming assistance programmes are §G+10%§! more effective."
  mdcw_cw_bloc_modifier_na: "Non-Aligned Movement"
  mdcw_cw_bloc_modifier_na_desc: "Free to deal with every bloc; no bloc discounts, no bloc technology. Most effects grow or shrink with the bloc's share of world power."
  mdcw_cw_bloc_modifier_west: "Western Bloc"
  mdcw_cw_bloc_modifier_west_desc: "Access to Western capital, markets and technology - paid for with alliance obligations, dependence on imported oil and open doors for foreign influence. Open economies feel every market shock. Most effects grow or shrink with the bloc's share of world power and its ideological cohesion; estranged members get half of them."
  mdcw_cw_bloc_modifier_soviet: "Soviet Bloc"
  mdcw_cw_bloc_modifier_soviet_desc: "Planned trade inside Comecon and Soviet oil at friendship prices; cut off from Western capital. Most effects grow or shrink with the bloc's share of world power and its ideological cohesion; estranged members get half of them."
  mdcw_cw_bloc_modifier_beijing: "Beijing Camp"
  mdcw_cw_bloc_modifier_beijing_desc: "Self-reliance and revolutionary solidarity; isolated from both technology blocs. Most effects grow or shrink with the bloc's share of world power and its ideological cohesion; estranged members get half of them."
  mdcw_cw_bloc_modifier_tt: "§Y[mdcw_cw_alignment_L]§!: [?global.mdcw_cw_share_pct_0|0]% Non-Aligned, [?global.mdcw_cw_share_pct_1|0]% West, [?global.mdcw_cw_share_pct_2|0]% Soviet, [?global.mdcw_cw_share_pct_3|0]% Beijing of world power."
  mdcw_cw_bloc_solidarity: "Bloc Solidarity"
  mdcw_cw_nam_criticism: "Criticised Us at the Non-Aligned Summit"
  mdcw_cw_program_partner: "Assistance Partner"
  mdcw_cw_bloc_defection: "Left Our Bloc"
  mdcw_cw_foreign_interference: "Political Interference in Our Bloc"
  mdcw_cw_assistance_effectiveness: "Assistance Programme Effectiveness"
  mdcw_cw_assistance_capacity: "Assistance Capacity"
  mdcw_cw_assistance_capacity_desc: "How many assistance programmes we can run abroad (a Small programme needs 1, Medium 2, Large 3)."
  mdcw_cw_support_effectiveness: "Our Public Support Campaigns Abroad"
  mdcw_cw_support_effectiveness_desc: "Makes our public political support campaigns in other countries stronger."
  mdcw_cw_market_exposure: "Exposure to World Market Swings"
  mdcw_cw_market_exposure_desc: "Market Confidence effects (good and bad) hit us harder."
  mdcw_cw_military_programme_cost: "Cost of Our Military Programmes"
  mdcw_cw_military_programme_cost_desc: "Running costs of the Military Training Missions and Arms Production Assistance we send abroad."
  mdcw_cw_opec_pressure: "Oil Price Pressure"
  mdcw_cw_oil_embargo: "Oil Embargo Against Us"
  mdcw_cw_oil_trade_embargo: "Bilateral Oil Embargo"
  # IMPERIA CW — Cold War: GC equilibrium controls and graduated crisis penalties.
  mdcw_cw_oil_crisis_breakdown_tt: "§YOil shock: [mdcw_cw_oil_crisis_stage_L]§! (effective price x[?mdcw_cw_oil_crisis_ratio|2] of January 1970).\nAdditional effects now: consumer goods [?mdcw_cw_oil_crisis_consumer|+%1], tax income [?mdcw_cw_oil_crisis_tax|+%1], factory output [?mdcw_cw_oil_crisis_output|+%1], stability [?mdcw_cw_oil_crisis_stability|+%1].\n\nAt full oil dependency:\nx1.5: Consumer goods §R+4%§!, tax income §R-2%§!, factory output §R-2%§!, stability §R-0.5%§!.\nx2.5: Consumer goods §R+8%§!, tax income §R-6%§!, factory output §R-6%§!, stability §R-1.5%§!.\nx4: Consumer goods §R+14%§!, tax income §R-12%§!, factory output §R-12%§!, stability §R-4%§!.\nx6: Consumer goods §R+20%§!, tax income §R-20%§!, factory output §R-20%§!, stability §R-8%§!.\nThe burden scales with national oil dependency, supplements the continuous oil-price effects and follows the weekly oil market."
  mdcw_cw_assistance_limit: "Assistance Receiving Limits"
  mdcw_cw_assistance_limit_desc: "Raises the limits on how much incoming assistance programmes can add to each effect."
  mdcw_ni_loyalty_boards: "Loyalty Review Boards"
  mdcw_ni_loyalty_boards_desc: "Loyalty boards screen civil servants, teachers and scientists for subversive sympathies, as the American loyalty programmes and the purges of the Latin American juntas did. Foreign agitators find no foothold, but talent leaves and the climate of suspicion wears on society."
  mdcw_ni_loyalty_boards_avail_1: "Our ruling party is anti-communist (it may join the Western Bloc)"
  mdcw_ni_broadcasting: "International Broadcasting Service"
  mdcw_ni_broadcasting_desc: "Short-wave stations like Radio Free Europe, the Voice of America or Radio Moscow carry our view of the world into foreign living rooms. Our campaigns abroad reach more people, but the transmitters cost money and every broadcast is noticed by the other side."
  mdcw_ni_broadcasting_note: "Costs §R0.046bn§! per week in MD's budget. Every public support campaign we start raises Cold War Tension by §R0.1§! more."
  mdcw_ni_border_regime: "Border Regime and Exit Controls"
  mdcw_ni_border_regime_desc: "Fortified borders, exit visas and controlled travel stop the flight of skilled workers, as the Berlin Wall did in 1961. Scientists stay and foreign ideas stay out, but trade and trust suffer and the people resent the walls."
  mdcw_ni_border_regime_avail_1: "Communist or one-party socialist government"
  mdcw_ni_border_regime_note: "Net migration cannot fall below §G0%§! while these controls are active. Positive net migration remains possible."
  mdcw_ni_development_agency: "International Development Agency"
  mdcw_ni_development_agency_desc: "A permanent state agency plans, finances and staffs our aid abroad, like USAID, the Soviet GKES or the West German GTZ. It lets us run far more assistance programmes, but it is a large bureaucracy paid for by our own taxpayers, and every programme needs political attention at home."
  mdcw_ni_open_door_aid: "Open Door Aid Policy"
  mdcw_ni_open_door_aid_desc: "We welcome foreign experts, credits and equipment from anyone willing to help and give donors direct access to our ministries. Assistance works better and we can absorb much more of it, but foreign advisers, embassies and their favourite parties gain influence over our politics."
  mdcw_ni_import_substitution: "Import Substitution Industrialisation"
  mdcw_ni_import_substitution_desc: "High tariffs, import licences and state credit build up our own industry instead of buying abroad, as Brazil, Argentina and India did. Factories rise and sanctions bite less, but protected firms are inefficient and consumers pay more."
  mdcw_ni_export_led: "Export-Led Industrialisation"
  mdcw_ni_export_led_desc: "Cheap credit, a weak currency and export zones turn our factories towards the world market, like South Korea and Taiwan. Foreign orders fill the books, but wages are held down and every crisis on the world market hits us harder."
  mdcw_ni_petroleum_reserve: "Strategic Petroleum Reserve"
  mdcw_ni_petroleum_reserve_desc: "Salt caverns and tank farms hold months of oil imports, as the United States, Japan and West Germany decided after 1973. An embargo loses much of its terror, but filling the reserve ties up money and building capacity."
  mdcw_ni_petroleum_reserve_avail_1: "Is not an oil exporter"
  mdcw_ni_petroleum_reserve_note: "Targeted oil embargoes against us hurt half as much. Costs §R0.023bn§! per week in MD's budget."
  mdcw_ni_military_advisers: "Military Advisers Abroad"
  mdcw_ni_military_advisers_desc: "Our officers train, equip and sometimes lead the armies of friendly governments, as Soviet, American and Cuban advisers did from Vietnam to Angola. Our programmes become cheaper and our officers gain experience, but the coffins coming home erode support for the army."
  mdcw_ni_armed_neutrality: "Armed Neutrality"
  mdcw_ni_armed_neutrality_desc: "Like Sweden, Switzerland, Finland and Austria we stay out of both camps and defend every valley ourselves. Foreign pressure meets a united country, but a large conscript army is expensive and no bloc will come to our aid."
  mdcw_ni_armed_neutrality_avail_1: "Is Non-Aligned"
  mdcw_ni_armed_neutrality_note: "We cannot join a bloc while this idea is active. On adoption: Cold War Tension §G-1§!."
