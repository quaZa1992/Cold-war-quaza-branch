  MDCW_CW_ASSISTANCE_TITLE: "Assistance Programme"
  MDCW_CW_ASSISTANCE_ACTION_DESC: "Offer one of eight Cold War assistance programmes for one year. The receiver must accept."
  MDCW_CW_ASSISTANCE_SEND_DESC: "We offer [THIS.GetNameDef] a §Y[mdcw_cw_send_size_L] [mdcw_cw_send_type_name_L]§! for one year."
  MDCW_CW_ASSISTANCE_RECEIVE_DESC: "[ROOT.GetNameDef] offers us a §Y[mdcw_cw_pend_size_L] [mdcw_cw_pend_type_name_L]§! for one year.\n\nFor us: [mdcw_cw_pend_type_effect_L]. They carry the costs.\n\nAccepting does not change our alignment."
  MDCW_CW_ASSISTANCE_ACCEPT_TITLE: "Programme Accepted"
  MDCW_CW_ASSISTANCE_ACCEPT_DESC: "[THIS.GetNameDef] has accepted our assistance programme."
  MDCW_CW_ASSISTANCE_REJECT_TITLE: "Programme Declined"
  MDCW_CW_ASSISTANCE_REJECT_DESC: "[THIS.GetNameDef] has declined our assistance programme."
  mdcw_cw_tt_not_at_war: "We are not at war with them"
  mdcw_cw_tt_capacity: "We have enough free assistance capacity for this package"
  mdcw_cw_tt_not_running: "This programme is not already running in their country"
  mdcw_cw_tt_not_pending: "No other offer to them is waiting for an answer"
  mdcw_cw_ai_base: "Base"
  mdcw_cw_ai_opinion: "Opinion of us"
  mdcw_cw_ai_bloc: "Bloc relations"
  mdcw_cw_ai_war: "At war"
  MDCW_CW_PUBLIC_SUPPORT_TITLE: "Public Political Support"
  MDCW_CW_PUBLIC_SUPPORT_ACTION_DESC: "Openly support one party of this country for one year. No acceptance needed; the country decides how much access the campaign gets."
  MDCW_CW_PUBLIC_SUPPORT_SEND_DESC: "We launch a public support campaign for the §Y[mdcw_cw_send_party_L]§! in [THIS.GetNameDef]."
  MDCW_CW_PUBLIC_SUPPORT_ACCEPT_TITLE: "Campaign Launched"
  MDCW_CW_PUBLIC_SUPPORT_ACCEPT_DESC: "Our public political support campaign in [THIS.GetNameDef] has begun."
  mdcw_cw_tt_pps_capacity: "We have at least 1 free assistance capacity"
  mdcw_cw_tt_pps_not_running: "We do not already run a campaign in their country"
  mdcw_cw_tt_pps_cooldown: "We have not started a campaign there in the last 24 months"
  MDCW_CW_OIL_EMBARGO_IMPOSE_TITLE: "Impose Oil Embargo"
  MDCW_CW_OIL_EMBARGO_IMPOSE_ACTION_DESC: "We announce an oil embargo against [THIS.GetNameDef]. Their effective oil costs rise with our share of world net oil exports, alongside any other exporters' embargoes. The global oil price rises modestly if their oil imports are large enough to disrupt world supply. Our weekly oil-export revenue falls according to those lost sales. Trade relations between us fall by 100 in both directions until we lift this oil embargo. The separate general embargo diplomatic action is unaffected."
  MDCW_CW_OIL_EMBARGO_IMPOSE_SEND_DESC: "We announce an oil embargo against [THIS.GetNameDef]. Their effective oil costs rise with our share of world net oil exports, alongside any other exporters' embargoes. The global oil price rises modestly if their oil imports are large enough to disrupt world supply. Our weekly oil-export revenue falls according to those lost sales. Trade relations between us fall by 100 in both directions until we lift this oil embargo. The separate general embargo diplomatic action is unaffected."
  MDCW_CW_OIL_EMBARGO_LIFT_TITLE: "Lift Oil Embargo"
  MDCW_CW_OIL_EMBARGO_LIFT_ACTION_DESC: "We resume oil deliveries to [THIS.GetNameDef] and remove the bilateral -100 trade relations penalty from this oil embargo. Any separate general embargo and other exporters' oil embargoes remain in force."
  MDCW_CW_OIL_EMBARGO_LIFT_SEND_DESC: "We resume oil deliveries to [THIS.GetNameDef] and remove the bilateral -100 trade relations penalty from this oil embargo. Any separate general embargo and other exporters' oil embargoes remain in force."
  MDCW_CW_OIL_EXEMPTION_GRANT_TITLE: "Grant Oil Exemption"
  MDCW_CW_OIL_EXEMPTION_GRANT_ACTION_DESC: "We guarantee continued oil deliveries to [THIS.GetNameDef]. This exempts them only from our own embargo policy, not from other exporters' decisions."
  MDCW_CW_OIL_EXEMPTION_GRANT_SEND_DESC: "We guarantee continued oil deliveries to [THIS.GetNameDef]. This exempts them only from our own embargo policy, not from other exporters' decisions."
  MDCW_CW_OIL_EXEMPTION_REVOKE_TITLE: "Withdraw Oil Exemption"
  MDCW_CW_OIL_EXEMPTION_REVOKE_ACTION_DESC: "We end our oil exemption for [THIS.GetNameDef]. No embargo is imposed automatically."
  MDCW_CW_OIL_EXEMPTION_REVOKE_SEND_DESC: "We end our oil exemption for [THIS.GetNameDef]. No embargo is imposed automatically."
  mdcw_cw_decisions: "Cold War Alignment"
  mdcw_cw_decisions_desc: "Tools of our bloc membership. What is available depends on our bloc and on whether we lead it. Every option has a price."
  mdcw_cw_oil_decisions: "Oil Producer Policy"
  mdcw_cw_oil_decisions_desc: "OPEC members can call a conference to raise or lower the posted oil price, or coordinate a temporary supply restraint. A new conference can begin 60 days after the last one started. Human members vote; the AI abstains. Use a country's diplomacy screen to impose or lift a bilateral oil embargo, or to grant or withdraw an exemption. Active targets and exemptions appear below; no historical date is required."
  mdcw_cw_tt_programme_inactive: "The programme is not already running"
  mdcw_cw_dec_credit_window_tt: "For §Y365§! days:\nEvery other member of the §YWestern Bloc§!: Interest rate: §G-0.5§!, Return on investment: §G+0.3%§!\nWe: Interest rate: §R+0.25§!, one-off 0.05bn per bloc point of the other members."
  mdcw_cw_dec_credit_window: "Open the Credit Window"
  mdcw_cw_dec_credit_window_desc: "Washington opens its capital markets and the credit lines of the international institutions to its partners. Cheap dollars flow to our allies, but the flood of dollars abroad weakens our own position."
  mdcw_cw_dec_comecon_tt: "For §Y730§! days:\nEvery other member of the §YSoviet Bloc§!: Factory efficiency growth: §G+5%§!, Oil price resistance: §G+10%§!\nWe: Oil export income: §R-5%§!, bloc upkeep x1.5."
  mdcw_cw_dec_comecon: "Comecon Integration Programme"
  mdcw_cw_dec_comecon_desc: "A comprehensive programme to integrate the planned economies of our bloc: joint projects, specialisation and Soviet raw materials at friendship prices. Moscow carries the cost."
  mdcw_cw_dec_solidarity_tt: "For §Y730§! days:\nEvery other member of the §YBeijing Camp§!: Construction speed: §G+5%§!\nWe: Consumer goods: §R+2%§!, bloc upkeep x1.5."
  mdcw_cw_dec_solidarity: "Third World Solidarity Projects"
  mdcw_cw_dec_solidarity_desc: "Railways, stadiums and irrigation built by Chinese workers in friendly countries. The projects win hearts abroad, but every yuan spent there is missing at home."
  mdcw_cw_loan_tt: "We receive a credit of §Y2%§! of our GDP (§Y0.5-25bn§!); the same amount is added to our debt."
  mdcw_cw_tt_no_credit_conditions: "Is not bound by the conditions of an earlier credit"
  mdcw_cw_dec_western_credit: "Seek Western Development Credit"
  mdcw_cw_dec_western_credit_desc: "Western banks and the international institutions will lend to a reliable partner. They expect budget discipline and open markets in return."
  mdcw_cw_dec_soviet_credit: "Request Soviet Credits"
  mdcw_cw_dec_soviet_credit_desc: "Moscow lends on generous terms to its friends. The planners and security advisers that come with the money will stay."
  mdcw_cw_dec_self_reliance: "Self-Reliance Campaign"
  mdcw_cw_dec_self_reliance_desc: "The masses are mobilised to rely on their own strength. Foreign goods, foreign money and foreign ideas lose their grip on the country - and so does the world market."
  mdcw_cw_dec_nam_summit_tt: "Cold War Tension §G-1§!. The three bloc leaders resent the criticism: §R-10§! opinion of us."
  mdcw_cw_dec_nam_summit: "Non-Aligned Summit Diplomacy"
  mdcw_cw_dec_nam_summit_desc: "We host the non-aligned nations and speak for those who refuse to choose a camp. The summit calls on both superpowers to disarm - they will not thank us for it."
  mdcw_cw_dec_competing_offers: "Invite Competing Offers"
  mdcw_cw_dec_competing_offers_desc: "We let it be known that we listen to every offer. Assistance from rival camps will be more generous - and our own factions will fight over whose patron to follow."
  mdcw_cw_dec_detente_tt: "Cold War Tension §G-3§!.\nIf another bloc leader has taken this decision within the last 90 days, both agree on §YDetente§!: Cold War Tension §G-5§! more and both leaders get Detente for 365 days (Trade opinion: §G+10%§!, Stability: §G+2%§!, War support: §R-3%§!)."
  mdcw_cw_dec_detente: "Detente Initiative"
  mdcw_cw_dec_detente_desc: "We offer the other camp talks on arms control and trade. Alone it is a gesture; if the other side answers, it becomes an agreement."
  mdcw_cw_dec_show_of_strength_tt: "Cold War Tension §R+3§! (lowers Market Confidence for everyone)."
  mdcw_cw_dec_show_of_strength: "Show of Strength"
  mdcw_cw_dec_show_of_strength_desc: "Manoeuvres near the border, a parade of new missiles, a fleet visit in a troubled region. Our allies are reassured, our rivals alarmed - and the markets nervous."
  mdcw_cw_opec_vote_cooldown_tt: "At least 60 days must pass since the last OPEC proposal began."
  mdcw_cw_dec_oil_price_agreement_tt: "Opens a 14-day OPEC ballot. Every human member, including us, may support, reject or abstain; AI members abstain. A successful proposal raises the world posted-price level by 20% times the combined world export share of supporters. Supporting producers maintain upward price pressure for two years. This proposal can be called again 60 days after use."
  mdcw_cw_dec_oil_price_agreement: "Propose a Higher OPEC Oil Price"
  mdcw_cw_dec_oil_price_agreement_desc: "Convene OPEC members to seek a higher common posted price. The price changes only after the ballot, and only if more members support the proposal than oppose it."
  mdcw_cw_dec_oil_price_cut_tt: "Opens a 14-day OPEC ballot. Every human member, including us, may support, reject or abstain; AI members abstain. A successful proposal lowers the world posted-price level by 20% times the combined world export share of supporters. Supporting producers maintain downward price pressure for two years. This proposal can be called again 60 days after use."
  mdcw_cw_dec_oil_price_cut: "Propose a Lower OPEC Oil Price"
  mdcw_cw_dec_oil_price_cut_desc: "Call for a common reduction in the posted oil price to defend demand and ease pressure on importers. A failed ballot leaves the price unchanged."
  mdcw_cw_dec_oil_output_restraint_tt: "Opens a 14-day OPEC ballot. Every human member, including us, may support, reject or abstain; AI members abstain. If passed, the posted-price level rises by 30% times supporters' combined world export share, plus a smaller spot-price spike. Supporters lose 10% of oil-export income for six months. This proposal can be called again 60 days after use."
  mdcw_cw_dec_oil_output_restraint: "Propose a Joint Supply Restraint"
  mdcw_cw_dec_oil_output_restraint_desc: "Ask OPEC members to coordinate a temporary restriction in export supply. Members who agree bear lost sales; a passed agreement tightens the world market."
  mdcw_cw_oil_status_readonly: "Manage this policy from the country's diplomacy screen."
  mdcw_cw_dec_oil_status_embargo: "Oil Embargo: [FROM.GetNameDef]"
  mdcw_cw_dec_oil_status_embargo_desc: "Our embargo contributes to this country's oil shortage. [FROM.GetNameDef] currently faces [?FROM.mdcw_cw_oil_embargo_in|0] embargoes from exporters representing [?FROM.mdcw_cw_oil_embargo_pressure_pct|1]% of world net oil exports (maximum 80%). Their effective oil cost is currently §R+[?FROM.mdcw_cw_oil_embargo_cost_pct|1]%§! above the world price after accounting for domestic oil production; a Strategic Petroleum Reserve or domestic oil exports halve the extra cost. Our weekly oil-export revenue loss scales with our embargo targets' oil imports relative to our own exports. Both countries have -100 bilateral trade relations while this oil embargo lasts. Lift this one in their diplomacy screen."
  mdcw_cw_dec_oil_status_exemption: "Oil Exemption: [FROM.GetNameDef]"
  mdcw_cw_dec_oil_status_exemption_desc: "We have promised continued oil deliveries to this country. Our own oil embargo action is unavailable against them until we withdraw the exemption in their diplomacy screen. Other exporters set their own policies."
  mdcw_cw_imf_conditions: "IMF Conditions"
  mdcw_cw_imf_conditions_desc: "Western credit came with conditions: budget discipline and open markets."
  mdcw_cw_soviet_advisers: "Soviet Advisers"
  mdcw_cw_soviet_advisers_desc: "Soviet credits brought planners, security advisers and a say in our affairs."
  mdcw_cw_self_reliance: "Self-Reliance Campaign"
  mdcw_cw_self_reliance_desc: "We rely on our own strength and turn away from foreign markets and ideas."
  mdcw_cw_nam_summit: "Non-Aligned Summit"
  mdcw_cw_nam_summit_desc: "Our voice carries weight among the non-aligned nations."
  mdcw_cw_competing_offers: "Competing Offers"
  mdcw_cw_competing_offers_desc: "We let the blocs outbid each other for our favour. Our factions quarrel over whose offer to take."
  mdcw_cw_detente_hawks: "Hawks Oppose Detente"
  mdcw_cw_detente_hawks_desc: "Hardliners accuse the government of weakness towards the enemy."
  mdcw_cw_detente_agreement: "Detente"
  mdcw_cw_detente_agreement_desc: "Both camps have agreed to ease tensions. Trade flows more freely."
  mdcw_cw_show_of_strength: "Show of Strength"
  mdcw_cw_show_of_strength_desc: "Large exercises and parades demonstrate our resolve."
