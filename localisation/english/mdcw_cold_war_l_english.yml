  mdcw_cw_oil_embargo_tt_on: "§R[?mdcw_cw_oil_embargo_in|0] exporters§! embargo us. Together they supply §Y[?mdcw_cw_oil_embargo_pressure_pct|1]%§! of world net oil exports (capped at 80%). Our effective oil cost rises by §R[?mdcw_cw_oil_embargo_cost_pct|1]%§! on top of the world price, after accounting for how much oil we must import. A Strategic Petroleum Reserve halves this extra cost; domestic oil exporters also halve it. Active embargoes we impose: §Y[?mdcw_cw_oil_embargo_out|0]§!."
  mdcw_cw_oil_embargo_tt_off: "No oil embargo targets us. Our own active oil embargoes: §Y[?mdcw_cw_oil_embargo_out|0]§!."
