  mdcw_cw_out_pps_tt: "§YPublic Political Support§! for §Y[mdcw_cw_out_pps_party_L]§! in [THIS.GetNameDef]\nAccess granted by them: §Y[mdcw_cw_out_pps_access_L]§! · §Y[?ROOT.mdcw_cw_pps_left@THIS|0]§! days left\n\n§RRight-click§! to end the campaign."
  mdcw_cw_in_pps_tt: "§YPublic Political Support§! by [THIS.GetNameDef] for §Y[mdcw_cw_in_pps_party_L]§!\nCurrent access: §Y[mdcw_cw_in_pps_access_L]§! · §Y[?mdcw_cw_pps_left@ROOT|0]§! days left\n\nUse the access buttons to permit, facilitate or restrict this campaign."
  mdcw_cw_in_pps_text: "§gCampaign for§! §Y[mdcw_cw_in_pps_party_L]§!"
  mdcw_cw_in_access_external_btn: "External Only"
  mdcw_cw_in_access_external_tt: "§YExternal Only§!: base growth target §Y+0.025§! percentage points per month for its party, before ideological defence, broadcasting and the shared cap. Popularity gained so far stays."
  mdcw_cw_in_access_permit_btn: "Permitted"
  mdcw_cw_in_access_permit_tt: "§YPermitted§!: base growth target §Y+0.0625§! percentage points per month for its party, before ideological defence, broadcasting and the shared cap. Popularity gained so far stays."
  mdcw_cw_in_access_facilitate_btn: "Facilitated"
  mdcw_cw_in_access_facilitate_tt: "§YFacilitated§!: base growth target §Y+0.125§! percentage points per month for its party, before ideological defence, broadcasting and the shared cap. Popularity gained so far stays."
  mdcw_cw_in_access_restrict_btn: "Restricted"
  mdcw_cw_in_access_restrict_tt: "§YRestricted§!: base growth target §Y+0.0125§! percentage points per month for its party, before ideological defence, broadcasting and the shared cap. Costs §R25§! political power once and 0.02 political power per day while active. Popularity gained so far stays."
