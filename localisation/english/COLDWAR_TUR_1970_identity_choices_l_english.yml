l_english:
# IMPERIA COLD WAR — Turkey party dossier and social democratic congress.
 COLDWAR_TUR_PARTY.millet:0 "Nation Party (Millet Partisi)"
 COLDWAR_TUR_1970_org_millet:0 "£generic_Nat_Populism_small Nation Party (Millet Partisi)"
 COLDWAR_TUR_1970_org_millet_desc:0 "The Nation Party emerged from Osman Bölükbaşı's nationalist opposition tradition. It is a separate organisation from the Nationalist Movement Party and the later Conservative Party."
 COLDWAR_TUR_1970_org_millet_icon:0 "£generic_Nat_Populism_small"
 COLDWAR_TUR_1970_required_millet:0 "Nation Party (Millet Partisi)"
 COLDWAR_TUR_PARTY.1.d:0 "Choose among the political organisations whose congresses have been held. Each organisation retains its own programme and leadership."
 COLDWAR_TUR_LDR_form_mnp_tt:0 "§YNational Order Party (MNP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_mnp:0 "Found the National Order Party"
 COLDWAR_TUR_LDR_form_mnp_desc:0 "Artisans, engineers and men of faith need a political organisation of their own. A national congress will give our movement a party and a common programme."
 COLDWAR_TUR_LDR_form_msp_tt:0 "§YNational Salvation Party (MSP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_msp:0 "Found the National Salvation Party"
 COLDWAR_TUR_LDR_form_msp_desc:0 "Our provincial organisations need a new political home. The National Salvation Party will carry the movement before the electorate."
 COLDWAR_TUR_LDR_form_rp_tt:0 "§YWelfare Party (RP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_rp:0 "Found the Welfare Party"
 COLDWAR_TUR_LDR_form_rp_desc:0 "Municipal organisers and provincial supporters are ready to gather beneath a common banner. The Welfare Party will unite them around national development, social justice and moral renewal."
 COLDWAR_TUR_LDR_form_fp_tt:0 "§YVirtue Party (FP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_fp:0 "Found the Virtue Party"
 COLDWAR_TUR_LDR_form_fp_desc:0 "A new organisation can preserve our local strength and bring a new generation into the movement. The Virtue Party will provide that political home."
 COLDWAR_TUR_LDR_form_dyp_tt:0 "§YTrue Path Party (DYP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_dyp:0 "Found the True Path Party"
 COLDWAR_TUR_LDR_form_dyp_desc:0 "The provincial organisations of the centre right need a common roof. The True Path Party will rally producers, tradesmen and defenders of parliamentary government."
 COLDWAR_TUR_LDR_form_sodep_tt:0 "§YSocial Democracy Party (SODEP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_sodep:0 "Found the Social Democracy Party"
 COLDWAR_TUR_LDR_form_sodep_desc:0 "The social democratic movement needs an organisation rooted in its members and local branches. Let a founding congress bring that organisation into public life."
 COLDWAR_TUR_LDR_form_hp_tt:0 "§YPopulist Party (HP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_hp:0 "Found the Populist Party"
 COLDWAR_TUR_LDR_form_hp_desc:0 "A new parliamentary organisation can give social democracy a legal voice. The Populist Party will place public services and social protection at the centre of its programme."
 COLDWAR_TUR_LDR_form_shp_tt:0 "§YSocial Democratic Populist Party (SHP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_organise_shp:0 "Unite the Social Democratic Parties"
 COLDWAR_TUR_LDR_organise_shp_desc:0 "The Populist Party and the Social Democracy Party have built separate organisations. A joint congress can bring their delegates together behind one leadership and a common programme."
 COLDWAR_TUR_LDR_shp_founders_tt:0 "The Populist Party (HP) and the Social Democracy Party (SODEP) have both been founded."
 COLDWAR_TUR_LDR_form_chp_reopened_tt:0 "§YRepublican People's Party (CHP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_chp_reopened:0 "Reopen the People's Party"
 COLDWAR_TUR_LDR_form_chp_reopened_desc:0 "The republican movement can gather again beneath its historic banner. Reopening the Republican People's Party will restore its name and organisations to public life."
 COLDWAR_TUR_LDR_form_mp_tt:0 "§YConservative Party (MP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_mp:0 "Found the Conservative Party"
 COLDWAR_TUR_LDR_form_mp_desc:0 "The nationalist movement needs a legal political organisation. The Conservative Party will give its provincial cadres a common platform."
 COLDWAR_TUR_LDR_form_mcp_tt:0 "§YNationalist Labour Party (MÇP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_mcp:0 "Adopt the Nationalist Labour Name"
 COLDWAR_TUR_LDR_form_mcp_desc:0 "A party congress can give our organisation a name that expresses its nationalist and social programme. We shall continue as the Nationalist Labour Party."
 COLDWAR_TUR_LDR_form_mhp_restored_tt:0 "§YNationalist Movement Party (MHP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_mhp_restored:0 "Restore the Movement Name"
 COLDWAR_TUR_LDR_form_mhp_restored_desc:0 "Our congress can reclaim the name of the Nationalist Movement Party. Its provincial organisations and parliamentary representatives will return to the familiar banner."
 COLDWAR_TUR_LDR_form_millet_tt:0 "§YNation Party (Millet Partisi)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_millet:0 "Convene the Nation Party Congress"
 COLDWAR_TUR_LDR_form_millet_desc:0 "The Nation Party represents a separate nationalist opposition tradition. Its congress will place the organisation and its own leadership at the head of our parliamentary current."
 COLDWAR_TUR_LDR_form_anap_tt:0 "§YMotherland Party (ANAP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_anap:0 "Found the Motherland Party"
 COLDWAR_TUR_LDR_form_anap_desc:0 "Conservative voters, businessmen and liberal reformers need a common organisation. The Motherland Party will bring these currents together around enterprise and national prosperity."
 COLDWAR_TUR_LDR_form_dsp_tt:0 "§YDemocratic Left Party (DSP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_dsp:0 "Found the Democratic Left Party"
 COLDWAR_TUR_LDR_form_dsp_desc:0 "Our movement seeks a party independent of established factions and rooted in the working population. The Democratic Left Party will carry that programme into national politics."
 COLDWAR_TUR_LDR_form_mgp_tt:0 "§YNational Reliance Party (MGP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_mgp:0 "Adopt the National Reliance Name"
 COLDWAR_TUR_LDR_form_mgp_desc:0 "A national congress can renew the Reliance movement around republican institutions, public order and a mixed economy. The organisation will continue as the National Reliance Party."
 COLDWAR_TUR_LDR_form_cgp_tt:0 "§YRepublican Reliance Party (CGP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_cgp:0 "Unite the Republican Centre"
 COLDWAR_TUR_LDR_form_cgp_desc:0 "The republican centre should bring its organisations and parliamentary experience together. A common congress will establish the Republican Reliance Party."
 COLDWAR_TUR_LDR_form_tip_1975_tt:0 "§YWorkers' Party of Turkey (TİP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_tip_1975:0 "Reconstitute the Workers' Party"
 COLDWAR_TUR_LDR_form_tip_1975_desc:0 "Trade unionists, socialist intellectuals and provincial organisers can rebuild their common political organisation. A new Workers' Party will return their programme to public life."
 COLDWAR_TUR_LDR_form_tbkp_tt:0 "§YUnited Communist Party of Turkey (TBKP)§! becomes the governing organisation."
 COLDWAR_TUR_LDR_form_tbkp:0 "Unite the Communist Parties"
 COLDWAR_TUR_LDR_form_tbkp_desc:0 "The communist and workers' movements can gather into a common organisation. The United Communist Party of Turkey will seek a public political future for that union."
