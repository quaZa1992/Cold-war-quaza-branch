 COLDWAR_COL_leak_desc:0 "Evidence links [event_target:COLDWAR_COL_exposed_sponsor.GetAdjective] assistance to clandestine contacts in [event_target:COLDWAR_COL_exposed_region.GetName]. The documents have reached the international press."
 COLDWAR_COL_leak_response:0 "Lodge a formal protest."
 COLDWAR_COL_leak_news_title:0 "[event_target:COLDWAR_COL_exposed_sponsor.GetAdjectiveCap] SUPPORT FOR [COLDWAR_COL_GetExposedMovement] EXPOSED"
 COLDWAR_COL_leak_news_desc:0 "Documents linking [event_target:COLDWAR_COL_exposed_sponsor.GetAdjective] officials to support for [COLDWAR_COL_GetExposedMovement] in [event_target:COLDWAR_COL_exposed_region.GetName] have become public. The responsible authorities have lodged a diplomatic protest."
