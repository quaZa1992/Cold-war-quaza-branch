 COLDWAR_COL_status_serious:0 "SERIOUS UNREST"
 COLDWAR_COL_status_tt:0 "Current territorial assessment: [COLDWAR_COL_GetSelectedStatus]. Routine below §Y20%§! average resistance; unrest from §Y20%§!; serious unrest from §Y40%§!; colonial crisis from §Y60%§!."
 COLDWAR_COL_status_unrest:0 "UNREST"
 COLDWAR_COL_support_arms_cost:0 "15 PP / 250 infantry weapons\n25 command/control equipment"
 COLDWAR_COL_support_arms_tt:0 "[COLDWAR_COL_GetArmsTerms]\nRequires a regional intelligence network §Yabove 50%§!. Package cooldown: §Y180 days§!. §Y40%§! public disclosure chance: sponsor stability §R−1%§!, relations §R−25§! for §Y180 days§!, international news and notification of the responsible government."
 COLDWAR_COL_support_funding_cost:0 "$0.050bn"
 COLDWAR_COL_support_funding_tt:0 "[COLDWAR_COL_GetFundingTerms]\nRequires a regional intelligence network §Yabove 50%§!. Package cooldown: §Y180 days§!. §Y25%§! public disclosure chance: sponsor stability §R−1%§!, relations §R−25§! for §Y180 days§!, international news and notification of the responsible government."
 COLDWAR_COL_support_name:0 "[COLDWAR_COL_GetSupportName]"
 COLDWAR_COL_support_political_cost:0 "15 political power"
 COLDWAR_COL_support_political_tt:0 "[COLDWAR_COL_GetPoliticalTerms]\nRequires a regional intelligence network §Yabove 50%§!. §Y10%§! chance of public disclosure: sponsor stability §R−1%§!, relations §R−25§! for §Y180 days§!, international news and notification of the responsible government."
 COLDWAR_COL_support_requirements_tt:0 "Requires an organised independence movement and an active colonial administration. Each package has a separate §Y180-day§! cooldown. Combined foreign assistance adds at most §R15§! resistance target points in each affected state. Further funding and arms packages are unavailable at the cap."
 COLDWAR_COL_support_send:0 "Support"
 COLDWAR_COL_support_status:0 "[COLDWAR_COL_GetContactStatus]"
 COLDWAR_COL_tab_contacts:0 "Foreign Files"
 COLDWAR_COL_tab_contacts_tt:0 "§YConfidential foreign liaison§!\nThe intelligence service may approach colonial movements, organisations in occupied territories and active IRA or RAF contacts. A dossier can be placed before ministers only where an organisation is active and reliable regional sources exist. Establishing a network does not itself create a movement.\n\n§YAuthority to open a dossier§!\nAn intelligence agency and a regional network §Ystrictly above 50% in the state concerned§! are required. Operatives must establish sources in that area; coverage in a neighbouring state is insufficient. Territories controlled by this government, its subjects or its overlord fall outside foreign liaison.\n\n§YThe regional papers§!\n§YNext authorised contact§! brings the next accessible dossier before cabinet. It remains unavailable while no contact qualifies. A qualifying state also offers §YRegional file§! in its map panel. Papers identify the movement and assess its strength and assistance; RAF reports distinguish cadres from milieu.\n\n§YMinisterial commitments§!\nCabinet may authorise political backing, financial assistance or equipment shipments. The §YSupport§! papers state the price, effect, term, limits and risk of public disclosure. Loss of regional access suspends further commitments and withdraws the dossier. Assistance already delivered runs its remaining term while the recipient remains eligible."
 COLDWAR_COL_tab_internal:0 "Internal Files"
 COLDWAR_COL_tab_internal_tt:0 "§YThe internal security cabinet§!\nDomestic dossiers assess an organisation's strength, outside assistance and the demands placed on the security services. They belong to the government responsible for the case and require no foreign intelligence network.\n\n§YNorthern Ireland / IRA§!\nAn active British case brings organisation strength, community tension and policing appropriations before ministers. Policing mandates and §YMeasures§! cover investigations, reform, emergency detention, confidential ceasefire contacts and constitutional talks, subject to their stated conditions.\n\n§YFederal Republic of Germany / RAF§!\nFrom §Y14 May 1970§!, an active RAF case reports cadres, milieu, generation and foreign assistance. The federal security cabinet handles investigations, wanted persons, protection and prison policy. Additional programmes depend on the relevant institutional authority and national policy.\n\nWhere no active case falls within this government's jurisdiction, the Secretariat supplies a briefing in place of an organisation dossier."
 COLDWAR_COL_tab_territory:0 "Territories"
 COLDWAR_COL_tab_territory_tt:0 "§YThe Overseas Secretariat§!\nTerritorial dossiers place local resistance, cooperation, economic restrictions and weekly appropriations before cabinet. Papers are opened only for an active overseas administration under this government's authority. These domestic records require no foreign intelligence network.\n\n§YThe administrative settlement§!\nMinisters may retain Civil Administration, fund Development and Representation, impose Security Administration or pursue Negotiated Self-Government. A new mandate remains in force for §Y180 days§!. Self-government is an administrative course; independence requires a further political settlement.\n\n§YPetitions and expenditure§!\nTerritorial representatives may request a grant or consultation. §YRespond§! brings a pending petition before cabinet; each response states its payment and local consequences. Standing appropriations enter the weekly national budget."
 COLDWAR_COL_territory_empty_footer:0 "Domestic administration: no foreign network."
 COLDWAR_COL_territory_empty_help:0 "Ministers may retain civil administration,\nfund development, strengthen security, or\nnegotiate a measure of self-government.\nNew mandates remain in force for 180 days."
 COLDWAR_COL_territory_empty_intro:0 "No overseas administration is presently\nreported to this government's Secretariat."
 COLDWAR_COL_territory_empty_note:0 "The Overseas Secretariat opens dossiers for\nterritories administered by this government.\nEach assessment records local resistance,\ncooperation and the burden on the treasury."
 COLDWAR_COL_territory_empty_options:0 "Local representatives may seek grants or\nconsultation on the territorial settlement.\nCabinet responses carry stated costs and\nlocal consequences. Standing appropriations\nenter the weekly national budget."
 COLDWAR_COL_territory_empty_title:0 "NO ADMINISTERED TERRITORY"
 COLDWAR_COL_total_cost:0 "$[?COLDWAR_COL_total_weekly_cost|5]bn / week"
 COLDWAR_COL_unrest_stages_tt:0 "Additional effects of local resistance are cumulative: at §Y20%§!, local construction §R−10%§!; at §Y40%§!, local resources §R−10%§! and required garrisons §R+15%§!; at §Y60%§!, local supplies §R−10%§!. These effects apply only where native resistance is active. The dossier displays the combined administration and resistance effects."
 COLDWAR_COL_weekly_cost:0 "$[?COLDWAR_COL_view_cost|5]bn / week"
 COLDWAR_COL_weekly_cost_tt:0 "Selected territory: §Y$[?COLDWAR_COL_view_cost|5]bn per week§!. All administered territories: §Y$[?COLDWAR_COL_total_weekly_cost|5]bn per week§!. These standing appropriations are included in the national weekly expenditure account."
 COLDWAR_colonial_affairs_category:0 "Security Affairs"
 COLDWAR_colonial_affairs_category_desc:0 "The Cabinet Secretariat maintains the government's papers on overseas administration, internal security and confidential foreign liaison. Ministers may review territorial settlements, consider reports on domestic organisations and authorise assistance abroad. Standing appropriations are charged to the weekly national budget."
