 COLDWAR_COL_incident_title:0 "Underground violence"
 COLDWAR_COL_incident_desc:0 "A clandestine organisation has carried out an attack. Investigators face renewed pressure to disrupt its local support and supply networks."
 COLDWAR_COL_incident_response:0 "Support the investigation."
 COLDWAR_COL_political_colonial_terms:0 "§Y15 Political Power§!: strengthen the next colonial petition within §Y180 days§!. Settlement costs rise by §Y$0.025bn§! or §Y10 Political Power§!."
 COLDWAR_COL_political_domestic_terms:0 "§Y15 Political Power§!: organisation strength §R+5§!. One political package per sponsor every §Y180 days§!."
 COLDWAR_COL_political_raf_terms:0 "§Y15 Political Power§!: RAF sympathiser milieu §R+2§! in the German security case. One political package per sponsor every §Y180 days§!."
 COLDWAR_COL_political_occupation_terms:0 "§Y15 Political Power§!: local compliance §R−3§!. One political package per sponsor every §Y180 days§!."
 COLDWAR_COL_funding_standard_terms:0 "§Y$0.05bn§!: resistance target §R+5§! for §Y180 days§!. Combined regional target bonus capped at §Y15§!."
 COLDWAR_COL_funding_ira_terms:0 "§Y$0.05bn§!: IRA aid §R+5§! for §Y180 days§!, adding §R0.5 organisation strength per month§!. Combined aid capped at §Y15§!."
 COLDWAR_COL_funding_raf_terms:0 "§Y$0.05bn§!: RAF aid §R+5§! for §Y180 days§!, adding §R0.25 cadres per month§!. All RAF regional contacts share one §Y15§!-point aid cap."
 COLDWAR_COL_arms_standard_terms:0 "§Y15 Political Power, 250 Infantry Weapons, 25 Command and Control Equipment§!: resistance §R+5§! and resistance target §R+5§! for §Y180 days§!. Shared target bonus capped at §Y15§!."
 COLDWAR_COL_arms_ira_terms:0 "§Y15 Political Power, 250 Infantry Weapons, 25 Command and Control Equipment§!: IRA organisation strength §R+3§!; aid §R+5§! for §Y180 days§!, adding §R0.5 strength per month§!. Shared aid cap: §Y15§!."
 COLDWAR_COL_arms_raf_terms:0 "§Y15 Political Power, 250 Infantry Weapons, 25 Command and Control Equipment§!: RAF cadres §R+1§!; aid §R+5§! for §Y180 days§!, adding §R0.25 cadres per month§!. All RAF contacts share one §Y15§!-point aid cap."
 COLDWAR_COL_measure_casework_label:0 "[COLDWAR_COL_GetMeasure_casework_Label]"
 COLDWAR_COL_measure_casework_active:0 "Evidence-led Casework [active]"
 COLDWAR_COL_measure_casework_tt:0 "§Y20 Political Power; $0.025bn§!. Requires an intelligence agency. Fund evidence-led investigations for 180 days. Organisation strength −2 immediately and −0.5 each month. Cooldown: 180 days. Standing appropriation: §Y$0.003bn/week§!."
 COLDWAR_COL_measure_reform_label:0 "[COLDWAR_COL_GetMeasure_reform_Label]"
 COLDWAR_COL_measure_reform_active:0 "Fair Employment and Complaints [active]"
 COLDWAR_COL_measure_reform_tt:0 "§Y30 Political Power; $0.040bn§!. Employment review and an independent complaints process address community grievances. Tension −8 immediately and −1 each month for 180 days. Cannot begin during internment. Cooldown: 365 days. Standing appropriation: §Y$0.004bn/week§!."
 COLDWAR_COL_measure_internment_label:0 "[COLDWAR_COL_GetMeasure_internment_Label]"
 COLDWAR_COL_measure_internment_active:0 "Emergency Internment [active]"
 COLDWAR_COL_measure_internment_tt:0 "§Y45 Political Power; $0.020bn§!. Requires organisation strength above 44 and no ceasefire, constitutional roundtable or active employment reform. Detention without trial: organisation −8 immediately; tension +15; national stability −1%; local manpower −3% for 90 days. Recruitment pressure adds +1.5 organisation per month during detention. Cooldown: 365 days. Standing appropriation: §Y$0.006bn/week§!."
 COLDWAR_COL_measure_release_tt:0 "§Y15 Political Power§!. End the current emergency detention programme. Its weekly appropriation, local manpower restriction and recruitment penalty end. Organisation +3 as detainees return; community tension −8. The original internment cooldown remains."
 COLDWAR_COL_measure_backchannel_label:0 "[COLDWAR_COL_GetMeasure_backchannel_Label]"
 COLDWAR_COL_measure_backchannel_active:0 "Confidential Ceasefire Contacts [active]"
 COLDWAR_COL_measure_backchannel_tt:0 "§Y25 Political Power; $0.015bn§!. Requires tension below 71 and no internment or active ceasefire. 60%: a 90-day ceasefire, tension −5, organisation −0.5/month and a reduced monthly incident risk of 2%. Ceasefire liaison costs $0.002bn/week. 40%: talks fail, tension +5 and national stability −0.5%. External aid and recruitment remain active. Cooldown: 180 days."
 COLDWAR_COL_measure_roundtable_label:0 "[COLDWAR_COL_GetMeasure_roundtable_Label]"
 COLDWAR_COL_measure_roundtable_active:0 "Constitutional Power-sharing Talks [active]"
 COLDWAR_COL_measure_roundtable_tt:0 "§Y60 Political Power; $0.080bn§!. Convene constitutional parties around power-sharing. Requires an active ceasefire, tension below 46, foreign aid below 6 and no internment. Tension −10 immediately, then −1/month; organisation −0.5/month for 180 days. National stability −1.5%. After 60 days: 30% chance of obstruction ending talks and the ceasefire, adding +10 tension and +3 organisation. This is not an IRA disarmament agreement. Cooldown: 365 days. Standing appropriation: §Y$0.006bn/week§!."
 COLDWAR_COL_measure_coordination_label:0 "[COLDWAR_COL_GetMeasure_coordination_Label]"
 COLDWAR_COL_measure_coordination_active:0 "Federal-State Case Coordination [active]"
 COLDWAR_COL_measure_coordination_tt:0 "25 PP / $0.035bn + $0.003bn/week; 180 days / Wanted traces +8, then +1/month. Requires BKA level 1 and active RAF cadres. Consolidate federal and state police case files. Each wanted person still at large gains +8 trace, then +1 trace/month for 180 days, capped at 100. Arrests still require the existing investigation process. Cooldown: 180 days. Requires §YBKA Expansion§!."
 COLDWAR_COL_measure_judicial_label:0 "[COLDWAR_COL_GetMeasure_judicial_Label]"
 COLDWAR_COL_measure_judicial_active:0 "Judicial Review of Security Measures [active]"
 COLDWAR_COL_measure_judicial_tt:0 "35 PP / $0.025bn + $0.002bn/week; Rule of law +3 / Milieu -3 / Security -2. Requires milieu above 2, rule of law below 98 and security above 1. Review intrusive security measures: rule of law +3; milieu −3 immediately and −0.25/month for 180 days; security −2. Reduced intrusive powers constrain security capacity. Cooldown: 180 days. Requires §YData Protection§!."
 COLDWAR_COL_measure_medical_label:0 "[COLDWAR_COL_GetMeasure_medical_Label]"
 COLDWAR_COL_measure_medical_active:0 "Independent Prison Medical Review [active]"
 COLDWAR_COL_measure_medical_tt:0 "35 PP / $0.030bn + $0.003bn/week; Hunger pressure -10 / Milieu -2 / Security -2. Requires imprisoned RAF members, hunger-strike pressure above 9 and security above 1. Independent medical scrutiny reduces hunger pressure by 10 and milieu by 2; rule of law +2, security −2. Medical supervision costs $0.003bn/week for 90 days. The chosen prison regime remains in force. Cooldown: 180 days. Requires §YThe Stammheim Trial§!."
 COLDWAR_COL_measure_native_posters_tt:0 "40 PP / 180-day cooldown; Trace +4 / Cadres -1 / Milieu +1. Requires left-wing terror pressure above 20. Security +2. Only wanted persons still at large gain trace."
 COLDWAR_COL_measure_native_raster_tt:0 "50 PP / BKA level 3 / 240-day cooldown; Trace +10 / Rule of law -3 / Security +2. Requires the dragnet doctrine, BKA level 3 and more than 3 cadres. Only wanted persons still at large gain trace."
 COLDWAR_COL_measure_native_kronzeuge_tt:0 "50 PP / Witness provision / 365-day cooldown; Best wanted trace +25 / Milieu -2. Requires the crown-witness provision and more than 1 RAF prisoner. Rule of law −1. The existing German investigation identifies the best lead."
 COLDWAR_COL_measure_native_dropout_tt:0 "50 PP / Exit provision / 365-day cooldown; Cadres -2 / Milieu -5 / One member leaves. Requires the exit provision and more than 2 cadres. The existing wanted-person record is updated; this does not dissolve the organisation."
