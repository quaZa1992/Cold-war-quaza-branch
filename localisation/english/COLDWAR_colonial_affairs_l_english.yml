 COLDWAR_COL_measures_close:0 "Overview"
 COLDWAR_COL_measures_toggle_tt:0 "Review organisation-specific security measures and political initiatives. Costs, commitments, requirements and consequences appear on each file."
 COLDWAR_COL_measures_heading:0 "SECURITY AND POLITICAL MEASURES"
 COLDWAR_COL_measures_page:0 "MEASURES / [COLDWAR_COL_GetMeasuresPage]"
 COLDWAR_COL_measures_page_1:0 "FILE 1 OF 2"
 COLDWAR_COL_measures_page_2:0 "FILE 2 OF 2"
 COLDWAR_COL_measures_previous_tt:0 "Previous measures file"
 COLDWAR_COL_measures_next_tt:0 "Next measures file"
 COLDWAR_COL_case_tension:0 "Community tension [?COLDWAR_COL_case_tension|0]%"
 COLDWAR_COL_case_tension_tt:0 "Community tension is distinct from IRA organisation strength. Above 69: recruitment +0.5/month and monthly incident risk 25%, if organisation is above 44. Below 36: recruitment −0.5/month. A ceasefire reduces the incident risk to 2%. Otherwise the risk is 15%. Each incident imposes a 90-day cooldown. Tension is bounded between 20 and 95."
 COLDWAR_COL_ceasefire_title:0 "A provisional ceasefire"
 COLDWAR_COL_ceasefire_desc:0 "Intermediaries have secured a temporary cessation. Constitutional negotiations remain separate, and neither disarmament nor a final settlement has been agreed."
 COLDWAR_COL_talks_failed_title:0 "Contacts break down"
 COLDWAR_COL_talks_failed_desc:0 "The intermediaries cannot secure agreement on a cessation. The government faces criticism for a contact process that has yielded no result."
 COLDWAR_COL_roundtable_title:0 "Power-sharing talks obstructed"
 COLDWAR_COL_roundtable_desc:0 "Political opposition has broken the proposed constitutional process. The ceasefire has ended and community tensions are rising again."
 COLDWAR_COL_measure_acknowledge:0 "Review the security assessment."
