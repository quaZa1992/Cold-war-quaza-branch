l_english:
# IMPERIA COLD WAR — Cuba 1970: bilateral_l_english.
 COLDWAR_CUB_bilateral.1.t:0 "Cuba–Soviet Union: Commodity Protocol"
 COLDWAR_CUB_bilateral.1.d:0 "Havana proposes a coordinated commodity schedule, committing exports in return for a more predictable commercial relationship with the Soviet Union. If concluded before the documented precedent, this is an alternate-history early agreement. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_sov_commodity_cub:0 "Cuban Commodity Protocol"
 COLDWAR_CUB_bilat_sov_commodity_cub_desc:0 "A negotiated commodity schedule gives Cuban sugar and nickel a stable Soviet market and links imports to a longer planning horizon. Delivery commitments deepen dependence on a single trading partner. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_sov_commodity_sov:0 "Soviet Union Commodity Protocol"
 COLDWAR_CUB_bilat_sov_commodity_sov_desc:0 "Cuban commodities enter a coordinated purchasing programme, supporting supply planning and Soviet influence overseas. Administering preferential terms imposes a continuing burden on the trading institutions. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_offer_sov_commodity:0 "Propose Commodity Protocol"
 COLDWAR_CUB_cancel_bilat_sov_commodity:0 "Terminate Commodity Protocol"
 COLDWAR_CUB_accept_bilat_sov_commodity:0 "Accept Commodity Protocol"
 COLDWAR_CUB_refuse_bilat_sov_commodity:0 "Decline Commodity Protocol"
 COLDWAR_CUB_cancel_bilat_sov_commodity_as_partner:0 "Terminate Commodity Protocol"
 COLDWAR_CUB_bilateral.2.t:0 "Cuba–Soviet Union: Industrial Modernisation Protocol"
 COLDWAR_CUB_bilateral.2.d:0 "Havana proposes an industrial modernisation programme built around machinery purchases, technical exchanges and coordinated production plans. If concluded before the documented precedent, this is an alternate-history early agreement. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_sov_industry_cub:0 "Cuban Industrial Modernisation Protocol"
 COLDWAR_CUB_bilat_sov_industry_cub_desc:0 "Joint commissions coordinate imported machinery, industrial designs and technical training for Cuban production. Faster modernisation requires a larger planning and procurement administration. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_sov_industry_sov:0 "Soviet Union Industrial Modernisation Protocol"
 COLDWAR_CUB_bilat_sov_industry_sov_desc:0 "Equipment deliveries and technical exchanges broaden the market for Soviet industrial production. Engineers and training institutions carry the continuing cost of cooperation. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_offer_sov_industry:0 "Propose Industrial Modernisation Protocol"
 COLDWAR_CUB_cancel_bilat_sov_industry:0 "Terminate Industrial Modernisation Protocol"
 COLDWAR_CUB_accept_bilat_sov_industry:0 "Accept Industrial Modernisation Protocol"
 COLDWAR_CUB_refuse_bilat_sov_industry:0 "Decline Industrial Modernisation Protocol"
 COLDWAR_CUB_cancel_bilat_sov_industry_as_partner:0 "Terminate Industrial Modernisation Protocol"
 COLDWAR_CUB_bilateral.3.t:0 "Cuba–Mexico: Regional Energy Coordination"
 COLDWAR_CUB_bilateral.3.d:0 "Havana proposes a regional energy commission to coordinate commercial purchases and transport arrangements with Mexico. If concluded before the documented precedent, this is an alternate-history early agreement. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_mex_energy_cub:0 "Cuban Regional Energy Coordination"
 COLDWAR_CUB_bilat_mex_energy_cub_desc:0 "Regional coordination of petroleum purchases and shipping helps Cuban enterprises plan around external supply constraints. Havana accepts greater dependence on a politically exposed regional partnership. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_mex_energy_mex:0 "Mexico Regional Energy Coordination"
 COLDWAR_CUB_bilat_mex_energy_mex_desc:0 "Mexican commercial and diplomatic institutions coordinate an energy relationship with Cuba. Export opportunities bring a continuing administrative obligation and greater involvement in Caribbean affairs. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_offer_mex_energy:0 "Propose Regional Energy Coordination"
 COLDWAR_CUB_cancel_bilat_mex_energy:0 "Terminate Regional Energy Coordination"
 COLDWAR_CUB_accept_bilat_mex_energy:0 "Accept Regional Energy Coordination"
 COLDWAR_CUB_refuse_bilat_mex_energy:0 "Decline Regional Energy Coordination"
 COLDWAR_CUB_cancel_bilat_mex_energy_as_partner:0 "Terminate Regional Energy Coordination"
 COLDWAR_CUB_bilateral.4.t:0 "Cuba–Mexico: Agro-Industrial Commission"
 COLDWAR_CUB_bilateral.4.d:0 "Havana proposes an agro-industrial commission linking agricultural research, technical education and production methods in both countries. If concluded before the documented precedent, this is an alternate-history early agreement. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_mex_agro_cub:0 "Cuban Agro-Industrial Commission"
 COLDWAR_CUB_bilat_mex_agro_cub_desc:0 "Agronomists and technical institutes coordinate crop research and its industrial applications with Mexican partners. The programme broadens agricultural expertise while placing new demands on public training institutions. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_mex_agro_mex:0 "Mexico Agro-Industrial Commission"
 COLDWAR_CUB_bilat_mex_agro_mex_desc:0 "Agricultural institutes exchange research and production experience with Cuba. Shared technical work supports cultivation and scientific capacity, with a continuing obligation to fund staff and training. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_offer_mex_agro:0 "Propose Agro-Industrial Commission"
 COLDWAR_CUB_cancel_bilat_mex_agro:0 "Terminate Agro-Industrial Commission"
 COLDWAR_CUB_accept_bilat_mex_agro:0 "Accept Agro-Industrial Commission"
 COLDWAR_CUB_refuse_bilat_mex_agro:0 "Decline Agro-Industrial Commission"
 COLDWAR_CUB_cancel_bilat_mex_agro_as_partner:0 "Terminate Agro-Industrial Commission"
 COLDWAR_CUB_bilateral.5.t:0 "Cuba–Spain: Nickel and Machinery Trade Protocol"
 COLDWAR_CUB_bilateral.5.d:0 "Havana proposes a commodity and machinery protocol, matching a continuing commercial relationship with purchases from Spanish industry. If concluded before the documented precedent, this is an alternate-history early agreement. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_spr_nickel_cub:0 "Cuban Nickel and Machinery Trade Protocol"
 COLDWAR_CUB_bilat_spr_nickel_cub_desc:0 "A commodity and machinery protocol connects Cuban nickel exports with Spanish industrial suppliers. Access to equipment and a commercial market comes with delivery commitments and closer dependence on the partner's purchasing institutions. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_spr_nickel_spr:0 "Spain Nickel and Machinery Trade Protocol"
 COLDWAR_CUB_bilat_spr_nickel_spr_desc:0 "Spanish firms gain an organised channel for machinery sales and Cuban commodities. Public commercial agencies must administer the settlement and its continuing commitments. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_offer_spr_nickel:0 "Propose Nickel and Machinery Trade Protocol"
 COLDWAR_CUB_cancel_bilat_spr_nickel:0 "Terminate Nickel and Machinery Trade Protocol"
 COLDWAR_CUB_accept_bilat_spr_nickel:0 "Accept Nickel and Machinery Trade Protocol"
 COLDWAR_CUB_refuse_bilat_spr_nickel:0 "Decline Nickel and Machinery Trade Protocol"
 COLDWAR_CUB_cancel_bilat_spr_nickel_as_partner:0 "Terminate Nickel and Machinery Trade Protocol"
 COLDWAR_CUB_bilateral.6.t:0 "Cuba–Spain: Industrial Training Agreement"
 COLDWAR_CUB_bilateral.6.d:0 "Havana proposes a standing industrial training agreement, tying equipment maintenance and production methods to exchanges between technical institutions. If concluded before the documented precedent, this is an alternate-history early agreement. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_spr_training_cub:0 "Cuban Industrial Training Agreement"
 COLDWAR_CUB_bilat_spr_training_cub_desc:0 "Industrial institutes and Spanish suppliers coordinate training in the operation and maintenance of imported equipment. Cuban enterprises gain technical capacity while education services carry the continuing programme. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_spr_training_spr:0 "Spain Industrial Training Agreement"
 COLDWAR_CUB_bilat_spr_training_spr_desc:0 "Spanish industrial and educational institutions maintain exchanges with Cuban enterprises. Commercial experience and joint technical work develop expertise while widening the partner's influence within participating institutions. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_offer_spr_training:0 "Propose Industrial Training Agreement"
 COLDWAR_CUB_cancel_bilat_spr_training:0 "Terminate Industrial Training Agreement"
 COLDWAR_CUB_accept_bilat_spr_training:0 "Accept Industrial Training Agreement"
 COLDWAR_CUB_refuse_bilat_spr_training:0 "Decline Industrial Training Agreement"
 COLDWAR_CUB_cancel_bilat_spr_training_as_partner:0 "Terminate Industrial Training Agreement"
 COLDWAR_CUB_bilateral.7.t:0 "Cuba–Canada: Rail Service Contract"
 COLDWAR_CUB_bilateral.7.d:0 "Havana proposes a rail service contract with Canadian suppliers, connecting equipment purchases to maintenance and technical support. If concluded before the documented precedent, this is an alternate-history early agreement. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_can_rail_cub:0 "Cuban Rail Service Contract"
 COLDWAR_CUB_bilat_can_rail_cub_desc:0 "Working with Canadian suppliers able to meet applicable export requirements, Cuba links rail-equipment purchases to maintenance and technical service. Better coordination supports construction and supply, with greater dependence on foreign commercial partners. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_can_rail_can:0 "Canada Rail Service Contract"
 COLDWAR_CUB_bilat_can_rail_can_desc:0 "Canadian firms obtain industrial orders and a continuing service relationship with Cuba. Commercial agencies must administer maintenance commitments and a politically sensitive export market. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_offer_can_rail:0 "Propose Rail Service Contract"
 COLDWAR_CUB_cancel_bilat_can_rail:0 "Terminate Rail Service Contract"
 COLDWAR_CUB_accept_bilat_can_rail:0 "Accept Rail Service Contract"
 COLDWAR_CUB_refuse_bilat_can_rail:0 "Decline Rail Service Contract"
 COLDWAR_CUB_cancel_bilat_can_rail_as_partner:0 "Terminate Rail Service Contract"
 COLDWAR_CUB_bilateral.8.t:0 "Cuba–Canada: Industrial Purchasing Agreement"
 COLDWAR_CUB_bilateral.8.d:0 "Havana proposes an industrial purchasing agreement combining machinery orders with a continuing programme of technical exchanges. If concluded before the documented precedent, this is an alternate-history early agreement. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_can_industry_cub:0 "Cuban Industrial Purchasing Agreement"
 COLDWAR_CUB_bilat_can_industry_cub_desc:0 "A purchasing commission coordinates Canadian industrial equipment and technical exchanges for Cuban enterprises. Production and research benefit, while export commitments narrow the goods available for other markets. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_bilat_can_industry_can:0 "Canada Industrial Purchasing Agreement"
 COLDWAR_CUB_bilat_can_industry_can_desc:0 "Canadian suppliers and technical institutions establish a continuing Cuban market. Industrial feedback and commercial opportunities accompany new commitments to training and technical cooperation. The standing terms operate only while both governments remain at peace and free of mutual sanctions; either government may terminate the agreement."
 COLDWAR_CUB_offer_can_industry:0 "Propose Industrial Purchasing Agreement"
 COLDWAR_CUB_cancel_bilat_can_industry:0 "Terminate Industrial Purchasing Agreement"
 COLDWAR_CUB_accept_bilat_can_industry:0 "Accept Industrial Purchasing Agreement"
 COLDWAR_CUB_refuse_bilat_can_industry:0 "Decline Industrial Purchasing Agreement"
 COLDWAR_CUB_cancel_bilat_can_industry_as_partner:0 "Terminate Industrial Purchasing Agreement"
 COLDWAR_CUB_bilateral.review:0 "Review the proposal in the diplomatic decisions."
 COLDWAR_CUB_bilateral.900.t:0 "Bilateral Agreement Ratified"
 COLDWAR_CUB_bilateral.900.d:0 "Both governments have entered the negotiated agreement. Its provisions will operate while the bilateral conditions remain in force."
 COLDWAR_CUB_medical_mission_cub:0 "International Medical Cooperation Programme"
 COLDWAR_CUB_medical_mission_cub_desc:0 "A standing medical cooperation programme with one or more consenting partners, active only while each bilateral relationship remains eligible."
 COLDWAR_CUB_medical_mission_partner:0 "Cuban Medical Mission Agreement"
 COLDWAR_CUB_medical_mission_partner_desc:0 "A standing, recipient-approved medical mission agreement with Cuba."
 COLDWAR_CUB_soviet_assistance_sov:0 "Soviet–Cuban Technical Assistance"
 COLDWAR_CUB_soviet_assistance_sov_desc:0 "A continuing programme of technical assistance with Cuba, subject to bilateral peace and sanctions conditions."
 COLDWAR_CUB_symbolic_cooperation_ddr:0 "Playa RDA Scientific Cooperation"
 COLDWAR_CUB_symbolic_cooperation_ddr_desc:0 "A continuing cultural and scientific exchange with Cuba."
 COLDWAR_CUB_interests_sections_cub:0 "Cuban–American Interests Sections"
 COLDWAR_CUB_interests_sections_cub_desc:0 "Reciprocal diplomatic representation, active while bilateral peace and sanctions conditions permit."
 COLDWAR_CUB_interests_sections_usa:0 "American–Cuban Interests Sections"
 COLDWAR_CUB_interests_sections_usa_desc:0 "Reciprocal diplomatic representation, active while bilateral peace and sanctions conditions permit."
 COLDWAR_CUB_end_medical_treaty_target:0 "Terminate the Medical Mission Agreement"
 COLDWAR_CUB_cancel_medical_treaty_as_partner:0 "Terminate the Medical Mission Agreement"
 COLDWAR_CUB_end_interests_sections:0 "Close the Interests Sections Agreement"
 COLDWAR_CUB_reopen_interests_sections:0 "Renew the Interests Sections Proposal"
 COLDWAR_CUB_cancel_interests_sections_as_partner:0 "Close the Interests Sections Agreement"
