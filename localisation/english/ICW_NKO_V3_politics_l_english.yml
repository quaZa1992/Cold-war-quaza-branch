 COLDWAR_NKO_pol_cabinet_question: "The Cabinet Question"
 COLDWAR_NKO_pol_cabinet_question_desc: "The Central Committee debates whether the Workers' Party should keep governing alone or hand the cabinet to one of the allied forces. Each answer would change who holds power in Pyongyang."
 ICW_NKO_V3_power_cabinet_question_tt: "Opens the choice of a §YFront Cabinet§!, §YCounty Delegates§!, a §YPlanning Mandate§! or a §YMilitary Mandate§!."
 COLDWAR_NKO_pol_front_cabinet: "Front Cabinet"
 COLDWAR_NKO_pol_front_cabinet_desc: "Kang Ryang Uk and the Korean Democratic Party take the cabinet inside the Democratic Front, with the Workers' Party as junior partner."
 COLDWAR_NKO_pol_county_delegates: "Convene the County Delegates"
 COLDWAR_NKO_pol_county_delegates_desc: "The Chondoist Chongu Party gathers county delegates into a rural government, with the Workers' Party kept in the coalition."
 COLDWAR_NKO_pol_planning_mandate: "The Planning Mandate"
 COLDWAR_NKO_pol_planning_mandate_desc: "The ministries and planners take a mandate of their own. A technocratic cabinet governs and answers to the Supreme People's Assembly rather than to the Party."
 COLDWAR_NKO_pol_military_mandate: "The Military Mandate"
 COLDWAR_NKO_pol_military_mandate_desc: "The Korean People's Army petitions for the government itself. An Armed Forces Council takes over the cabinet and the Party is left as a partner of the generals."
 COLDWAR_NKO_pol_civilian_return: "Terms of Civilian Return"
 COLDWAR_NKO_pol_civilian_return_desc: "The new cabinet has served its purpose. The Supreme People's Assembly negotiates how civilian party government will be restored."
 ICW_NKO_V3_power_civilian_return_tt: "Opens the choice between §YRestore the Workers' Party Cabinet§! and §YThe Democratic Front Government§!."
 ICW_NKO_V3_power_not_wpk_tt: "The Workers' Party of Korea does not lead the government."
 ICW_NKO_V3_power_kpa_handover_tt: "If the Armed Forces Council governs, the focus §YA Statute for Civilian Transfer§! is completed."
 ICW_NKO_V3_power_kpa_handover_unlock_tt: "The focus §YTerms of Civilian Return§! can now end military rule."
 COLDWAR_NKO_pol_restore_wpk: "Restore the Workers' Party Cabinet"
 COLDWAR_NKO_pol_restore_wpk_desc: "The Workers' Party of Korea takes back the whole cabinet."
 COLDWAR_NKO_pol_democratic_front: "The Democratic Front Government"
 COLDWAR_NKO_pol_democratic_front_desc: "Authority passes to the Korean Democratic Party and its Front partners instead of returning to the Workers' Party alone."
 ICW_NKO_V3_power_front_cabinet_tt: "The §YKorean Democratic Party§! forms the government. The Workers' Party of Korea stays in the coalition."
 ICW_NKO_V3_power_convene_county_delegates_tt: "The §YChondoist Chongu Party§! forms the government. The Workers' Party of Korea stays in the coalition."
 ICW_NKO_V3_power_draft_a_planning_mandate_tt: "A §Ytechnocratic cabinet§! forms the government. The Workers' Party of Korea stays in the coalition."
 ICW_NKO_V3_power_petition_for_a_military_mandate_tt: "The §YKorean People's Army§! forms the government through an Armed Forces Council. The Workers' Party of Korea stays in the coalition."
 ICW_NKO_V3_power_restore_civilian_government_tt: "The §YWorkers' Party of Korea§! forms the government again."
 ICW_NKO_V3_power_resume_democratic_cabinet_tt: "The §YKorean Democratic Party§! forms the government. The Workers' Party of Korea stays in the coalition."
