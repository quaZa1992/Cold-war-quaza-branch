# IMPERIA CW — Cold War: IRQ 1970 politics — English localisation.
 COLDWAR_IRQ_party_2:0 "£generic_liberalism_small National Progressive Party"
 COLDWAR_IRQ_party_2_desc:0 "(Liberal Reformism) - National Progressive Party (Arabic: Al-Hizb al-Watani al-Taqaddumi)\n\nThe National Progressive Party was founded in 1960 by Muhammad Hadid, a former finance minister, after a split from Kamil al-Chadirchi's National Democratic Party. It represents liberal professionals, merchants and the reformist bourgeoisie of Baghdad.\n\nBanned like all independent parties under the Ba'th, it advocates constitutional government, parliamentary elections, the rule of law and a mixed economy. It favours good relations with both East and West and a peaceful settlement with the Kurds."
 COLDWAR_IRQ_party_2_icon:0 "£generic_liberalism_small"
 COLDWAR_IRQ_party_3:0 "£generic_socialism_small National Democratic Party"
 COLDWAR_IRQ_party_3_desc:0 "(Social Democracy) - National Democratic Party (Arabic: Al-Hizb al-Watani al-Dimuqrati)\n\nThe National Democratic Party was founded in 1946 by Kamil al-Chadirchi, heir to the Ahali group of the 1930s. It was the leading voice of Iraqi social democracy until Chadirchi's death in 1968.\n\nThe party stands for parliamentary democracy, land reform, social justice and the rights of workers and peasants. Driven underground by the Ba'th regime, its supporters among intellectuals and professionals hope for a democratic Iraq aligned with the Western left."
 COLDWAR_IRQ_party_3_icon:0 "£generic_socialism_small"
 COLDWAR_IRQ_party_4:0 "£IRQ_Neutral_Communism_small (ICP) - Iraqi Communist Party"
 COLDWAR_IRQ_party_4_desc:0 "(Marxism-Leninism) - Iraqi Communist Party (Arabic: Al-Hizb al-Shuyu'i al-Iraqi, ICP)\n\nFounded in 1934, the Iraqi Communist Party was once the largest communist party in the Arab world, reaching the height of its power under Abd al-Karim Qasim. It was decimated by the Ba'thist massacres of 1963 and is now led by First Secretary Aziz Muhammad.\n\nThe party hesitates between opposition and cooperation with the Ba'th, which is courting Moscow. It demands land reform, nationalisation of the oil industry, Kurdish autonomy and alliance with the Soviet Union."
 COLDWAR_IRQ_party_4_icon:0 "£IRQ_Neutral_Communism_small"
 COLDWAR_IRQ_party_6:0 "£generic_Conservative_small (KDP) - Kurdistan Democratic Party"
 COLDWAR_IRQ_party_6_desc:0 "(Kurdish Nationalism) - Kurdistan Democratic Party (Kurdish: Partiya Demokrat a Kurdistane, KDP)\n\nThe Kurdistan Democratic Party, founded in 1946, is led by the legendary Mulla Mustafa Barzani, whose peshmerga have fought Baghdad since 1961. In March 1970 the Ba'th regime signed an autonomy agreement with the KDP.\n\nRooted in tribal and conservative Kurdish society, the party demands genuine autonomy, a share of Kirkuk's oil and Kurdish participation in government. It looks to the Shah of Iran, Israel and the United States for support against Baghdad."
 COLDWAR_IRQ_party_6_icon:0 "£generic_Conservative_small"
 COLDWAR_IRQ_party_8:0 "£generic_Mod_Vilayat_e_Faqih_small Islamic Dawa Party"
 COLDWAR_IRQ_party_8_desc:0 "(Shia Islamism) - Islamic Dawa Party (Arabic: Hizb al-Da'wa al-Islamiyya)\n\nThe Islamic Dawa Party was founded in Najaf around 1957 by Shia clerics and activists, inspired by the thinking of Ayatollah Muhammad Baqir al-Sadr. It aims to counter the influence of communism and secular nationalism among Iraq's Shia majority.\n\nThe party works through clandestine cells, mosques and religious schools. It calls for an Islamic state based on Sharia, social justice and the participation of the faithful, and it faces growing persecution from the Ba'th regime."
 COLDWAR_IRQ_party_8_icon:0 "£generic_Mod_Vilayat_e_Faqih_small"
 COLDWAR_IRQ_party_9:0 "£generic_Vilayat_e_Faqih_small (SCIRI) - Supreme Council for the Islamic Revolution in Iraq"
 COLDWAR_IRQ_party_9_desc:0 "(Shia Revolutionary Islamism) - Supreme Council for the Islamic Revolution in Iraq (Arabic: Al-Majlis al-A'la li-l-Thawra al-Islamiyya fi al-Iraq, SCIRI)\n\nThe Supreme Council for the Islamic Revolution in Iraq was founded in Tehran in 1982 under Ayatollah Muhammad Baqir al-Hakim. It grew out of the clerical network of the Hakim family, whose patriarch, Grand Ayatollah Muhsin al-Hakim, died in June 1970.\n\nBacked by the Islamic Republic of Iran, the council adopts the doctrine of the guardianship of the jurist and seeks to overthrow the Ba'th regime. Its armed wing, the Badr Brigade, fights alongside Iran."
 COLDWAR_IRQ_party_9_icon:0 "£generic_Vilayat_e_Faqih_small"
 COLDWAR_IRQ_party_12:0 "£muslim_brotherhood_small (IIP) - Iraqi Islamic Party"
 COLDWAR_IRQ_party_12_desc:0 "(Sunni Islamism) - Iraqi Islamic Party (Arabic: Al-Hizb al-Islami al-Iraqi, IIP)\n\nThe Iraqi Islamic Party was founded in 1960 as the political arm of the Iraqi Muslim Brotherhood, which was established in the 1940s by Muhammad Mahmud al-Sawwaf. It was banned shortly after its creation and has continued underground since.\n\nThe party appeals to devout Sunni Arabs in Baghdad, Mosul and Anbar. It calls for an Islamic state, moral renewal and social justice, and rejects both communist atheism and the secular nationalism of the Ba'th."
 COLDWAR_IRQ_party_12_icon:0 "£muslim_brotherhood_small"
 COLDWAR_IRQ_party_18:0 "£generic_neutral_Social_small (ASU) - Arab Socialist Union"
 COLDWAR_IRQ_party_18_desc:0 "(Nasserism) - Arab Socialist Union (Arabic: Al-Ittihad al-Ishtiraki al-Arabi, ASU)\n\nThe Iraqi Arab Socialist Union was founded in 1964 by President Abd al-Salam Arif on the Egyptian model, as the country's only legal party. After the Ba'thist coup of 1968 it was pushed aside, but Nasserist officers and intellectuals remain in its orbit.\n\nIts programme combines Arab socialism, nationalisation of industry and banks, land reform and the goal of union with Egypt under Gamal Abdel Nasser. It looks to non-alignment rather than to either superpower."
 COLDWAR_IRQ_party_18_icon:0 "£generic_neutral_Social_small"
 COLDWAR_IRQ_party_19:0 "£generic_Neutral_Communism_small (PUK) - Patriotic Union of Kurdistan"
 COLDWAR_IRQ_party_19_desc:0 "(Kurdish Socialism) - Patriotic Union of Kurdistan (Kurdish: Yeketi Nishtimani Kurdistan, PUK)\n\nThe Patriotic Union of Kurdistan was founded in 1975 by Jalal Talabani after the collapse of Barzani's revolt. Its roots lie in the KDP Politburo faction of Ibrahim Ahmad and Talabani, which in the 1960s challenged Barzani's tribal leadership.\n\nThe PUK combines Kurdish nationalism with left-wing, Marxist-inspired ideas, appealing to urban intellectuals, students and the Sorani-speaking south of Kurdistan. It seeks a democratic Iraq with genuine Kurdish self-government. Its rivalry with the KDP would shape Kurdish politics for decades."
 COLDWAR_IRQ_party_19_icon:0 "£generic_Neutral_Communism_small"
 COLDWAR_IRQ_party_21:0 "£IRQ_Nat_Autocracy_small Arab Socialist Ba'th Party"
 COLDWAR_IRQ_party_21_desc:0 "(Ba'thism) - Arab Socialist Ba'th Party (Arabic: Hizb al-Ba'th al-Arabi al-Ishtiraki)\n\nThe Arab Socialist Ba'th Party seized power in the July 1968 coup. President Ahmad Hasan al-Bakr heads the Revolutionary Command Council, while his relative Saddam Hussein, vice-chairman of the council, builds the security apparatus behind him.\n\nThe Ba'th preaches 'Unity, Freedom, Socialism': pan-Arab nationalism, a single-party state and state control over the economy. It eliminates rivals through purges and show trials and prepares to nationalise the Iraq Petroleum Company. Its rule rests on the army, the party militia and an expanding secret police."
 COLDWAR_IRQ_party_21_icon:0 "£IRQ_Nat_Autocracy_small"
 COLDWAR_IRQ_party_22:0 "£generic_Nat_Autocracy_small Republican Officers"
 COLDWAR_IRQ_party_22_desc:0 "(Military Junta) - Republican Officers (Arabic: Al-Dubbat al-Jumhuriyyun)\n\nThe Republican Officers are the heirs of the Free Officers who overthrew the monarchy in 1958. Since then the army has made and unmade governments in Baghdad: Qasim, the Arif brothers and now the Ba'th.\n\nMany officers resent the Ba'th's efforts to subordinate the army to the party. A junta of republican officers would rule through martial law, rely on the army's prestige and pursue a pragmatic nationalism free of party ideology."
 COLDWAR_IRQ_party_22_icon:0 "£generic_Nat_Autocracy_small"
 COLDWAR_IRQ_party_23:0 "£generic_Monarchist_small Constitutional Monarchy Movement"
 COLDWAR_IRQ_party_23_desc:0 "(Constitutional Monarchism) - Constitutional Monarchy Movement (Arabic: Al-Haraka al-Malakiyya al-Dusturiyya)\n\nThe Hashemite monarchy of Iraq was destroyed in the bloody revolution of July 1958, when King Faisal II and much of the royal family were killed. Surviving royalists and former politicians of the old regime live in exile in London, Amman and Beirut.\n\nThey dream of restoring a constitutional monarchy under the Hashemite claimant Sharif Ali bin al-Hussein, who would formally found this movement in 1993. Their programme is parliamentary government, pluralism and close ties with the West."
 COLDWAR_IRQ_party_23_icon:0 "£generic_Monarchist_small"
