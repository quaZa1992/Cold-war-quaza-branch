 COLDWAR_FRA2_advanced_democracy:0 "Civic Institutions"
 COLDWAR_FRA2_advanced_democracy_desc:0 "Prepare public institutions for a communist governing programme through elected local representatives and trained administrative cadres. A coordination office gives the project substance, while extending public direction brings an enduring administrative burden."
