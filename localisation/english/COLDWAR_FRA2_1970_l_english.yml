 COLDWAR_FRA2_rhine:0 "Rhine Industry Pact"
 COLDWAR_FRA2_rhine_GER:0 "Rhine Industry Pact: Federal Republic of Germany"
 COLDWAR_FRA2_rhine_GER_desc:0 "Link industrial conversion and technical training across neighbouring regions. Franco-German cooperation shares the cost of modernisation rather than assigning construction on foreign territory unilaterally."
 COLDWAR_FRA2_rhine_desc:0 "Link industrial conversion and technical training across neighbouring regions. Franco-German cooperation shares the cost of modernisation rather than assigning construction on foreign territory unilaterally."
