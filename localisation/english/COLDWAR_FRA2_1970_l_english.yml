 COLDWAR_FRA2_service_review:0 "Conscription Reform"
 COLDWAR_FRA2_service_review_desc:0 "Decide how conscription should fit a force expected to defend Europe and operate overseas. A broader citizen reserve and a smaller professional core make different claims on the state."
