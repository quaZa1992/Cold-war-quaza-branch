# IMPERIA COLD WAR — France 1970 approved replacement.
 COLDWAR_FRA2P_atlantic_liberal_USA:0 "Atlantic Electronics Licensing: United States"
 COLDWAR_FRA2P_atlantic_liberal_USA_desc:0 "Negotiate licensing, technical support and export access with American electronics firms. Faster access to expertise and stronger service output require continuing licensing and technical support expenditure."
 COLDWAR_FRA2P_atlantic_liberal_france:0 "Atlantic Electronics Licensing: France"
 COLDWAR_FRA2P_atlantic_liberal_france_desc:0 "Negotiate licensing, technical support and export access with American electronics firms. Faster access to expertise and stronger service output require continuing licensing and technical support expenditure."
 COLDWAR_FRA2P_atlantic_security_ENG:0 "Channel Maritime Schools: United Kingdom"
 COLDWAR_FRA2P_atlantic_security_ENG_desc:0 "Pool selected courses in navigation, engineering and maritime safety while preserving national command. The arrangement requires trained instructors and naval personnel on both sides."
 COLDWAR_FRA2P_atlantic_security_france:0 "Channel Maritime Schools: France"
 COLDWAR_FRA2P_atlantic_security_france_desc:0 "Pool selected courses in navigation, engineering and maritime safety while preserving national command. The arrangement requires trained instructors and naval personnel on both sides."
 COLDWAR_FRA2P_ecological_industry_GER:0 "Rhine Clean Production Commission: Federal Republic of Germany"
 COLDWAR_FRA2P_ecological_industry_GER_desc:0 "Coordinate industrial conservation and clean-production engineering along the Rhine. Technical offices and shared research support conversion, while stricter operating practice reduces immediate factory output."
 COLDWAR_FRA2P_ecological_industry_france:0 "Rhine Clean Production Commission: France"
 COLDWAR_FRA2P_ecological_industry_france_desc:0 "Coordinate industrial conservation and clean-production engineering along the Rhine. Technical offices and shared research support conversion, while stricter operating practice reduces immediate factory output."
 COLDWAR_FRA2P_europe_liberal_GER:0 "European Export Credit Facility: Federal Republic of Germany"
 COLDWAR_FRA2P_europe_liberal_GER_desc:0 "Underwrite eligible cross-border orders through French and German institutions. Additional business receipts must be weighed against public guarantees and the risk of loss."
 COLDWAR_FRA2P_europe_liberal_france:0 "European Export Credit Facility: France"
 COLDWAR_FRA2P_europe_liberal_france_desc:0 "Underwrite eligible cross-border orders through French and German institutions. Additional business receipts must be weighed against public guarantees and the risk of loss."
 COLDWAR_FRA2P_europe_restraint_GER:0 "European Monetary Cooperation: Federal Republic of Germany"
 COLDWAR_FRA2P_europe_restraint_GER_desc:0 "Coordinate financial institutions and budget priorities with West Germany. France gains room for monetary discipline at the price of domestic restraint, while Germany commits administrative and political resources."
 COLDWAR_FRA2P_europe_restraint_france:0 "European Monetary Cooperation: France"
 COLDWAR_FRA2P_europe_restraint_france_desc:0 "Coordinate financial institutions and budget priorities with West Germany. France gains room for monetary discipline at the price of domestic restraint, while Germany commits administrative and political resources."
 COLDWAR_FRA2P_europe_technology_GER:0 "European Computing Consortium: Federal Republic of Germany"
 COLDWAR_FRA2P_europe_technology_GER_desc:0 "Support a French-German computing consortium inspired by the European partnerships of the early 1970s. Shared development distributes costs, but product standards and procurement remain contested."
 COLDWAR_FRA2P_europe_technology_france:0 "European Computing Consortium: France"
 COLDWAR_FRA2P_europe_technology_france_desc:0 "Support a French-German computing consortium inspired by the European partnerships of the early 1970s. Shared development distributes costs, but product standards and procurement remain contested."
 COLDWAR_FRA2P_federal_europe_GER:0 "Mutual Insurance Cooperation: Federal Republic of Germany"
 COLDWAR_FRA2P_federal_europe_GER_desc:0 "Exchange insurance administration, professional training and local-care practice between French mutual societies and German partners. Skilled staff and compatible rules require continuing investment."
 COLDWAR_FRA2P_federal_europe_france:0 "Mutual Insurance Cooperation: France"
 COLDWAR_FRA2P_federal_europe_france_desc:0 "Exchange insurance administration, professional training and local-care practice between French mutual societies and German partners. Skilled staff and compatible rules require continuing investment."
 COLDWAR_FRA2P_fn_export_ARG:0 "Naval Aviation Export Support: Argentina"
 COLDWAR_FRA2P_fn_export_ARG_desc:0 "Offer aviation training, engineering and export support to Argentina. Orders support French firms and Argentine readiness, while France must maintain instructor detachments and technical personnel."
 COLDWAR_FRA2P_fn_export_france:0 "Naval Aviation Export Support: France"
 COLDWAR_FRA2P_fn_export_france_desc:0 "Offer aviation training, engineering and export support to Argentina. Orders support French firms and Argentine readiness, while France must maintain instructor detachments and technical personnel."
 COLDWAR_FRA2P_independent_communism_ITA:0 "European Cooperative Partnership: Italy"
 COLDWAR_FRA2P_independent_communism_ITA_desc:0 "Develop cooperative finance, worker participation and municipal expertise with Italian partners. A French communist government can pursue practical European cooperation without yielding its political autonomy."
 COLDWAR_FRA2P_independent_communism_france:0 "European Cooperative Partnership: France"
 COLDWAR_FRA2P_independent_communism_france_desc:0 "Develop cooperative finance, worker participation and municipal expertise with Italian partners. A French communist government can pursue practical European cooperation without yielding its political autonomy."
 COLDWAR_FRA2P_local_sufficiency_AUS:0 "Municipal Heat Cooperation: Austria"
 COLDWAR_FRA2P_local_sufficiency_AUS_desc:0 "Develop municipal heat networks and local energy engineering with Austrian partners. France prioritises regional services over heavy throughput; Austria funds efficient generation and technical exchange."
 COLDWAR_FRA2P_local_sufficiency_france:0 "Municipal Heat Cooperation: France"
 COLDWAR_FRA2P_local_sufficiency_france_desc:0 "Develop municipal heat networks and local energy engineering with Austrian partners. France prioritises regional services over heavy throughput; Austria funds efficient generation and technical exchange."
 COLDWAR_FRA2P_participation_workshops:0 "Fund Participation Workshops"
 COLDWAR_FRA2P_participation_workshops_desc:0 "Support practical worker participation through regional workshops in Rhône-Alpes. The programme funds technical instruction and administrative capacity."
 COLDWAR_FRA2P_pcf_energy_contract_SOV:0 "Franco-Soviet Energy Engineering: Soviet Union"
 COLDWAR_FRA2P_pcf_energy_contract_SOV_desc:0 "Concentrate the industrial partnership on joint energy studies, equipment and efficient use. France lowers industrial energy demand and Soviet partners improve generation; both countries must fund specialist technical training."
 COLDWAR_FRA2P_pcf_energy_contract_france:0 "Franco-Soviet Energy Engineering: France"
 COLDWAR_FRA2P_pcf_energy_contract_france_desc:0 "Concentrate the industrial partnership on joint energy studies, equipment and efficient use. France lowers industrial energy demand and Soviet partners improve generation; both countries must fund specialist technical training."
 COLDWAR_FRA2P_pcf_shipping_contract_SOV:0 "Franco-Soviet Maritime Cooperation: Soviet Union"
 COLDWAR_FRA2P_pcf_shipping_contract_SOV_desc:0 "Concentrate the industrial partnership on maritime engineering, repair orders and commercial administration. French yards and Soviet commercial services would share funded investment and technical work."
 COLDWAR_FRA2P_pcf_shipping_contract_france:0 "Franco-Soviet Maritime Cooperation: France"
 COLDWAR_FRA2P_pcf_shipping_contract_france_desc:0 "Concentrate the industrial partnership on maritime engineering, repair orders and commercial administration. French yards and Soviet commercial services would share funded investment and technical work."
 COLDWAR_FRA2P_pompidou_europe_GER:0 "Rhenish Regional Investment: Federal Republic of Germany"
 COLDWAR_FRA2P_pompidou_europe_GER_desc:0 "Use the opening after The Hague to finance industrial links and regional services on both sides of the Rhine. Each government retains authority over its own investment."
 COLDWAR_FRA2P_pompidou_europe_france:0 "Rhenish Regional Investment: France"
 COLDWAR_FRA2P_pompidou_europe_france_desc:0 "Use the opening after The Hague to finance industrial links and regional services on both sides of the Rhine. Each government retains authority over its own investment."
 COLDWAR_FRA2P_psu_cooperative_exchange_SER:0 "Worker-Managed Enterprise Exchange: Yugoslavia"
 COLDWAR_FRA2P_psu_cooperative_exchange_SER_desc:0 "Exchange enterprise experience and applied industrial expertise with Yugoslav partners. Both countries fund training, while French cooperatives accept commercial discipline and Yugoslav institutions commit skilled staff."
 COLDWAR_FRA2P_psu_cooperative_exchange_france:0 "Worker-Managed Enterprise Exchange: France"
 COLDWAR_FRA2P_psu_cooperative_exchange_france_desc:0 "Exchange enterprise experience and applied industrial expertise with Yugoslav partners. Both countries fund training, while French cooperatives accept commercial discipline and Yugoslav institutions commit skilled staff."
 COLDWAR_FRA2P_regional_conversion:0 "Regional Conversion Fund"
 COLDWAR_FRA2P_regional_conversion_desc:0 "Direct public-bank credit toward industrial renewal in Hauts-de-France. The grant supports a production site and technical instruction."
 COLDWAR_FRA2P_sovereign_reflation_ALG:0 "Mediterranean Development Credit: Algeria"
 COLDWAR_FRA2P_sovereign_reflation_ALG_desc:0 "Finance agreed industrial orders and local production through French public credit and Algerian partners. Development supports demand in both countries, with credit exposure and costly concessions."
 COLDWAR_FRA2P_sovereign_reflation_france:0 "Mediterranean Development Credit: France"
 COLDWAR_FRA2P_sovereign_reflation_france_desc:0 "Finance agreed industrial orders and local production through French public credit and Algerian partners. Development supports demand in both countries, with credit exposure and costly concessions."
 COLDWAR_FRA2P_soviet_friendship_SOV:0 "Franco-Soviet Industrial Partnership: Soviet Union"
 COLDWAR_FRA2P_soviet_friendship_SOV_desc:0 "Offer industrial equipment, engineering and production cooperation to the Soviet government. Funded orders support civilian investment in both countries, while the French export commitment diverts engineering capacity from arms-factory expansion."
 COLDWAR_FRA2P_soviet_friendship_france:0 "Franco-Soviet Industrial Partnership: France"
 COLDWAR_FRA2P_soviet_friendship_france_desc:0 "Offer industrial equipment, engineering and production cooperation to the Soviet government. Funded orders support civilian investment in both countries, while the French export commitment diverts engineering capacity from arms-factory expansion."
 COLDWAR_FRA2_CID_programme:0 "CID Programme"
 COLDWAR_FRA2_CID_programme_desc:0 "The Citizens and Shopkeepers Independence programme, active before 5 October 1972 while its party governs."
