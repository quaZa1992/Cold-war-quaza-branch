 COLDWAR_FRA2_pressure_withdrawal_crisis:0 "Withdrawal Crisis"
 COLDWAR_FRA2_pressure_withdrawal_crisis_desc:0 "The former procurement charter is no longer in force."
 COLDWAR_FRA2_professional_core:0 "Professional Forces"
 COLDWAR_FRA2_professional_core_desc:0 "Build a smaller, high-readiness force for demanding deployments. Professional experience improves immediate capability, with a higher wage and support bill."
 COLDWAR_FRA2_progress:0 "Social Renewal"
 COLDWAR_FRA2_progress_desc:0 "Give the New Society programme a practical administrative and service base in the Paris region. Social consultation needs institutions and staff, and enlarges the cost of government."
 COLDWAR_FRA2_ps_basin_conversion:0 "Basin Conversion"
 COLDWAR_FRA2_ps_basin_conversion_desc:0 "Rebuild productive capacity in Hauts-de-France and improve connecting infrastructure in Normandie. Industrial conversion offers tangible employment sites, while retraining and transitional support enlarge the social budget."
 COLDWAR_FRA2_ps_conversion_boards:0 "Conversion Boards"
 COLDWAR_FRA2_ps_conversion_boards_desc:0 "Authorise regional boards to commission an industrial-renewal project. Prepared sites and technical studies support the Regional Conversion Fund when a separate project budget is committed."
 COLDWAR_FRA2_ps_programme:0 "Socialist Party Programme"
 COLDWAR_FRA2_ps_programme_desc:0 "The Socialist Party rebuilds its organisation and debates how to combine social rights, ownership and European commitments."
 COLDWAR_FRA2_ps_workplace_charters:0 "Workplace Charters"
 COLDWAR_FRA2_ps_workplace_charters_desc:0 "Give employees a stronger voice over workplace conditions through elected representation, inspection and bargaining offices. Better protection can reduce avoidable health costs, while employers resist the new obligations and investment adjusts more slowly."
 COLDWAR_FRA2_psu_cooperative_exchange:0 "Cooperative Pact"
 COLDWAR_FRA2_psu_cooperative_exchange_desc:0 "Exchange enterprise experience and applied industrial expertise with Yugoslav partners. Both countries fund training, while French cooperatives accept commercial discipline and Yugoslav institutions commit skilled staff."
 COLDWAR_FRA2_psu_cooperative_exchange_recipient_heading:0 "[SER.GetName]"
 COLDWAR_FRA2_psu_cooperative_markets:0 "Cooperative Markets"
 COLDWAR_FRA2_psu_cooperative_markets_desc:0 "Give worker-managed enterprises a shared Aquitaine sales and accounting office. A market-facing federation can spread practical experience, but preferential finance and retained earnings reduce tax receipts."
 COLDWAR_FRA2_psu_land_banks:0 "Cooperative Land"
 COLDWAR_FRA2_psu_land_banks_desc:0 "Create a Bourgogne land-credit office and prepare serviced sites in Aquitaine for cooperative enterprise and community facilities. Below-market terms broaden access, while reducing the taxable returns captured from development."
 COLDWAR_FRA2_psu_programme:0 "Unified Socialist Party Programme"
 COLDWAR_FRA2_psu_programme_desc:0 "The Unified Socialist Party develops local participation, independent unions and civilian public services."
 COLDWAR_FRA2_psu_tenants_councils:0 "Tenants' Councils"
 COLDWAR_FRA2_psu_tenants_councils_desc:0 "Let residents and service users share responsibility for a Bretagne neighbourhood office and access works in Pays de la Loire. Local participation receives concrete institutions, alongside a lasting public-service commitment."
 COLDWAR_FRA2_psu_union_institutes:0 "Union Institutes"
 COLDWAR_FRA2_psu_union_institutes_desc:0 "Build bargaining and technical institutes for independent unions. A domestic network can serve workplaces without relying on a foreign agreement, but requires public funding and employer concessions."
 COLDWAR_FRA2_public_banks:0 "Public Bank Credit"
 COLDWAR_FRA2_public_banks_desc:0 "Bring credit allocation under public direction through banking and regional finance offices. Their lending can support industrial construction and conversion, while public control requires supervisory staff and exposes the government to investment decisions."
 COLDWAR_FRA2_public_combine:0 "Public Combines"
 COLDWAR_FRA2_public_combine_desc:0 "Coordinate credit and procurement through public industrial groups, funding civilian capacity in Alsace-Lorraine and an armament programme in the north. Concentration supports scale but can slow adaptation and enlarge the planning apparatus."
 COLDWAR_FRA2_public_credit:0 "Credit Guarantees"
 COLDWAR_FRA2_public_credit_desc:0 "Channel credit guarantees toward viable industrial firms and a new production site in Midi-Pyrenees. Public backing can overcome investment bottlenecks while the Treasury bears the cost of preferential terms and the risk attached to its guarantees."
 COLDWAR_FRA2_public_service:0 "A State Within Reach"
 COLDWAR_FRA2_public_service_desc:0 "Pompidou's government inherited a central administration shaped by prefects and powerful ministries. Better local services can make that authority more useful to citizens while preserving the elected role of communes."
 COLDWAR_FRA2_radical_civic_service:0 "Civil Service Trials"
 COLDWAR_FRA2_radical_civic_service_desc:0 "Pilot civilian technical service through a Loire office and public works in Auvergne. Young participants gain practical skills outside the barracks, while a smaller pool of continuously trained recruits lengthens army training."
 COLDWAR_FRA2_radical_enterprise:0 "Private Innovation"
 COLDWAR_FRA2_radical_enterprise_desc:0 "Support private industrial investment in Aquitaine and technical services in the Paris region. Enterprise gains room to expand, while public credit and tax concessions put part of the risk on the state."
 COLDWAR_FRA2_radical_open_orders:0 "Open Public Orders"
 COLDWAR_FRA2_radical_open_orders_desc:0 "Open public procurement to new producers rather than reserve orders for established groups. An Aquitaine production site and technical studies widen the supplier base, while incumbents resist and concessions reduce corporate-tax receipts."
 COLDWAR_FRA2_radical_programme:0 "Radical Republicans Programme"
 COLDWAR_FRA2_radical_programme_desc:0 "The Radical Republicans defend secular institutions, civic equality and practical local development."
 COLDWAR_FRA2_recipient_agreements_category:0 "Bilateral Programme Proposals"
 COLDWAR_FRA2_recipient_agreements_category_desc:0 "Review and answer fixed-partner programme proposals."
 COLDWAR_FRA2_redistribution:0 "Household Demand"
 COLDWAR_FRA2_redistribution_desc:0 "Raise household purchasing power and expand public employment to sustain domestic demand. The policy broadens social gains, while its tax and wage effects challenge fiscal balance and export competitiveness."
 COLDWAR_FRA2_regional_councils:0 "Regional Councils"
 COLDWAR_FRA2_regional_councils_desc:0 "Give elected regional councils resources to shape local investment. Decisions closer to residents gain legitimacy, while Paris gives up some control over the timing and direction of development."
 COLDWAR_FRA2_regional_industry:0 "Regional Industry"
 COLDWAR_FRA2_regional_industry_desc:0 "Pair industrial renewal in Hauts-de-France with port and commercial facilities in Provence. Regional development spreads investment, while local services add continuing social costs."
 COLDWAR_FRA2_regional_links:0 "Regional Links"
 COLDWAR_FRA2_regional_links_desc:0 "Connect regional producers with ports, railways and industrial markets. Better access can spread employment beyond established centres, but transport investment competes with other public projects."
 COLDWAR_FRA2_regions:0 "Uneven Modernisation"
 COLDWAR_FRA2_regions_desc:0 "Competitive firms and ambitious public projects coexist with crowded cities, remote rural communities and vulnerable industrial districts."
