 COLDWAR_FRA2_shortcut_vietnam_strategy:0 "France and Indochina"
 COLDWAR_FRA2_sixth_plan:0 "Sixth Plan"
 COLDWAR_FRA2_sixth_plan_desc:0 "Prepare the Sixth Plan for 1971-1975 by balancing modern exporters, older industrial districts and underserved regions. Investment choices will shape whether growth reaches beyond the largest firms and cities."
 COLDWAR_FRA2_social_contract_ps:0 "Labour Compact"
 COLDWAR_FRA2_social_contract_ps_desc:0 "Back collective bargaining with a regional labour-services office and stronger guarantees for organised workers. Employers face new obligations and the social budget carries continuing commitments."
 COLDWAR_FRA2_social_market:0 "Social Market"
 COLDWAR_FRA2_social_market_desc:0 "Lecanuet's Democratic Centre joins market initiative to social responsibility and parliamentary government. It offers a distinct Christian democratic programme between presidential concentration and socialist planning."
 COLDWAR_FRA2_socialist_refoundation:0 "Socialist Renewal"
 COLDWAR_FRA2_socialist_refoundation_desc:0 "Alain Savary's Socialist Party is rebuilding after the weakening of the SFIO. Negotiations with republican clubs can broaden the democratic left, but leadership, organisation and relations with the Communists remain contested."
 COLDWAR_FRA2_sound_franc:0 "A Sound Franc"
 COLDWAR_FRA2_sound_franc_desc:0 "Defend monetary credibility through tighter public demand and a consistent budget. Investors gain confidence while domestic expansion slows."
 COLDWAR_FRA2_sovereign_reflation:0 "A Sovereign Reflation"
 COLDWAR_FRA2_sovereign_reflation_desc:0 "Finance agreed industrial orders and local production through French public credit and Algerian partners. Development supports demand in both countries, with credit exposure and costly concessions."
 COLDWAR_FRA2_sovereign_reflation_external_requirement_2:0 "Algeria has the active Algerian Energy and Industrial Cooperation spirit."
 COLDWAR_FRA2_sovereign_reflation_external_requirement_4:0 "[FRA.GetName] holds the required active programme."
 COLDWAR_FRA2_sovereign_reflation_recipient_heading:0 "[ALG.GetName]"
 COLDWAR_FRA2_soviet_friendship:0 "Soviet Partnership"
 COLDWAR_FRA2_soviet_friendship_desc:0 "Offer industrial equipment, engineering and production cooperation to the Soviet government. Funded orders support civilian investment in both countries, while the French export commitment diverts engineering capacity from arms-factory expansion."
 COLDWAR_FRA2_soviet_friendship_recipient_heading:0 "[SOV.GetName]"
 COLDWAR_FRA2_soviet_science:0 "Soviet Science Pact"
 COLDWAR_FRA2_soviet_science_SOV:0 "Soviet Science Pact: Soviet Union"
 COLDWAR_FRA2_soviet_science_SOV_desc:0 "Build on the 1966 Franco-Soviet cooperation framework and the developing dialogue with Moscow. Civilian science offers room for exchange without imposing military alignment. Opening the programme requires bilateral restrictions to be lifted."
 COLDWAR_FRA2_soviet_science_desc:0 "Build on the 1966 Franco-Soviet cooperation framework and the developing dialogue with Moscow. Civilian science offers room for exchange without imposing military alignment. Opening the programme requires bilateral restrictions to be lifted."
 COLDWAR_FRA2_soviet_science_france:0 "Soviet Science Pact: France"
 COLDWAR_FRA2_soviet_science_france_desc:0 "Build on the 1966 Franco-Soviet cooperation framework and the developing dialogue with Moscow. Civilian science offers room for exchange without imposing military alignment. Opening the programme requires bilateral restrictions to be lifted."
 COLDWAR_FRA2_soviet_science_recipient_heading:0 "[SOV.GetName]"
 COLDWAR_FRA2_statute:0 "Statutory Labour Pact"
 COLDWAR_FRA2_statute_desc:0 "Combine statutory labour rules with industrial investment in Normandie. Employers gain firmer operating conditions, while enforcement costs and union opposition remain real."
 COLDWAR_FRA2_symphonie:0 "Symphonie Satellite"
 COLDWAR_FRA2_symphonie_GER:0 "Symphonie Satellite: Federal Republic of Germany"
 COLDWAR_FRA2_symphonie_GER_desc:0 "Continue the Franco-German Symphonie satellite programme through telecommunications research and ground applications. Launch access and permitted uses still require diplomatic agreement."
 COLDWAR_FRA2_symphonie_desc:0 "Continue the Franco-German Symphonie satellite programme through telecommunications research and ground applications. Launch access and permitted uses still require diplomatic agreement."
 COLDWAR_FRA2_symphonie_external_requirement_1:0 "[GER.GetName] has completed 1G Internet Technology."
 COLDWAR_FRA2_symphonie_france:0 "Symphonie Satellite: France"
 COLDWAR_FRA2_symphonie_france_desc:0 "Continue the Franco-German Symphonie satellite programme through telecommunications research and ground applications. Launch access and permitted uses still require diplomatic agreement."
 COLDWAR_FRA2_symphonie_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_technical_colleges:0 "Technical Colleges"
 COLDWAR_FRA2_technical_colleges_desc:0 "Expand engineering and technician training beyond the elite schools. Practical qualifications can ease bottlenecks in modern industry, while requiring teachers, workshops and lasting education funds."
 COLDWAR_FRA2_telecoms:0 "Telecom Network"
 COLDWAR_FRA2_telecoms_desc:0 "Modernise the PTT network through CNET research, switching equipment and long-distance links. New exchanges in Paris and Rhone-Alpes widen service, while demand still exceeds available connections."
 COLDWAR_FRA2_territorial_balance:0 "Industrial Balance"
 COLDWAR_FRA2_territorial_balance_desc:0 "Tie regional transport to the chosen industrial strategy. Investment can narrow the inherited gap in access to modern production, although it cannot remove the advantages of the largest centres at once."
 COLDWAR_FRA2_tgv:0 "High-Speed Rail"
 COLDWAR_FRA2_tgv_desc:0 "Develop SNCF's high-speed project through engineering trials and improvements around Lyon. A railway designed for fast intercity journeys can ease reliance on road travel, but prototypes and dedicated approaches demand substantial public capital."
 COLDWAR_FRA2_transport_choice:0 "Rail or Motorway"
 COLDWAR_FRA2_transport_choice_desc:0 "Choose how to connect a rapidly urbanising country. High-speed rail offers concentrated capacity; motorways reach dispersed industry, and both compete for public investment."
 COLDWAR_FRA2_udr_nato_parent_nato_atlantic_fleet_programme:0 "Atlantic Exercises Programme"
 COLDWAR_FRA2_udr_nato_parent_nato_atlantic_fleet_programme_desc:0 "France retains its Atlantic Treaty commitments and national command. Allied consultation, operational cooperation and European partnerships offer different ways to support French security and strategic independence."
 COLDWAR_FRA2_udr_nato_parent_nato_europe_land_programme:0 "Land Standardisation Programme"
 COLDWAR_FRA2_udr_nato_parent_nato_europe_land_programme_desc:0 "France retains its Atlantic Treaty commitments and national command. Allied consultation, operational cooperation and European partnerships offer different ways to support French security and strategic independence."
 COLDWAR_FRA2_udr_nato_parent_nato_europe_sea_programme:0 "European Naval Pact Programme"
 COLDWAR_FRA2_udr_nato_parent_nato_europe_sea_programme_desc:0 "France retains its Atlantic Treaty commitments and national command. Allied consultation, operational cooperation and European partnerships offer different ways to support French security and strategic independence."
 COLDWAR_FRA2_udr_nato_parent_nato_rhine_programme:0 "Rhine Field Exercises Programme"
 COLDWAR_FRA2_udr_nato_parent_nato_rhine_programme_desc:0 "France retains its Atlantic Treaty commitments and national command. Allied consultation, operational cooperation and European partnerships offer different ways to support French security and strategic independence."
 COLDWAR_FRA2_udr_nato_programme:0 "Gaullist NATO Strategy Programme"
 COLDWAR_FRA2_udr_nato_programme_desc:0 "The UDR government keeps the Atlantic Treaty while defining the limits of military cooperation and national command."
 COLDWAR_FRA2_udr_programme:0 "Gaullist Government Programme"
 COLDWAR_FRA2_udr_programme_desc:0 "The Gaullist government links social participation, national industry and independent French decision-making."
 COLDWAR_FRA2_union_autonomy:0 "Independent Unions"
 COLDWAR_FRA2_union_autonomy_desc:0 "Guarantee that unions can represent employees independently of government and enterprise councils. Negotiated rights strengthen organised labour, while collective provision costs money and autonomous bargaining limits ministerial control."
 COLDWAR_FRA2_us_science:0 "US Research Accord"
 COLDWAR_FRA2_us_science_USA:0 "US Research Accord: United States"
 COLDWAR_FRA2_us_science_USA_desc:0 "Seek a civilian research accord with American institutions as an alternative to Soviet cooperation. Both governments must decide whether shared access justifies its cost and external commitments."
 COLDWAR_FRA2_us_science_desc:0 "Seek a civilian research accord with American institutions as an alternative to Soviet cooperation. Both governments must decide whether shared access justifies its cost and external commitments."
 COLDWAR_FRA2_us_science_france:0 "US Research Accord: France"
 COLDWAR_FRA2_us_science_france_desc:0 "Seek a civilian research accord with American institutions as an alternative to Soviet cooperation. Both governments must decide whether shared access justifies its cost and external commitments."
 COLDWAR_FRA2_us_science_recipient_heading:0 "[USA.GetName]"
 COLDWAR_FRA2_vietnam_strategy_programme:0 "France and Indochina Programme"
 COLDWAR_FRA2_vietnam_strategy_programme_desc:0 "French peace diplomacy, voluntary technical cooperation and expeditionary policy in Indochina."
 COLDWAR_FRA2_workers_control:0 "Workers on the Board"
 COLDWAR_FRA2_workers_control_desc:0 "Support worker representation with a technical and bargaining office in Rhone-Alpes. Workplace participation strengthens organised labour, while employers and central government lose some freedom of action."
 MDCW_HP_FRA_14_1:0 "£generic_Neutral_conservatism_small (CDS) - Centre of Social Democrats"
 MDCW_HP_FRA_14_1_desc:0 "(Christian Democracy) - Centre of Social Democrats (French: Centre des démocrates sociaux, CDS)\n\nCreated at Rennes on 23 May 1976, the Centre of Social Democrats united Jean Lecanuet's Centre démocrate with Jacques Duhamel and Joseph Fontanet's Centre démocratie et progrès. Lecanuet led the new centrist party.\n\nThe CDS combined Christian social principles with European federalism, parliamentary government and decentralisation. It remained an autonomous centrist organisation while cooperating with the governing majority."
 MDCW_HP_FRA_14_1_icon:0 "£generic_Neutral_conservatism_small"
 MDCW_HP_FRA_17_1:0 "£generic_Neutral_green_small The Greens"
 MDCW_HP_FRA_17_1_desc:0 "(Political Ecology) - The Greens (French: Les Verts)\n\nThe Greens were founded at Clichy on 28 and 29 January 1984, when the Verts-Parti écologiste and the Confédération écologiste united in a national political organisation. The new party gave France's ecological movement a lasting electoral structure.\n\nThe Greens linked environmental protection with political reform and grassroots participation. They challenged the priorities of both the traditional right and left, while debates over electoral alliances and party organisation continued within the movement."
 MDCW_HP_FRA_17_1_icon:0 "£generic_Neutral_green_small"
 MDCW_HP_FRA_1_1:0 "£generic_conservatism_small (RPR) - Rally for the Republic"
 MDCW_HP_FRA_1_1_desc:0 "(Gaullism) - Rally for the Republic (French: Rassemblement pour la République, RPR)\n\nThe Rally for the Republic emerged from the transformation of the UDR at the Porte de Versailles meeting on 5 December 1976, with Jacques Chirac elected its president. It reorganised the Gaullist movement around a more disciplined national party.\n\nThe RPR defended a strong presidency, national independence and a distinct French voice in Europe. Its relationship with President Valéry Giscard d'Estaing's government remained a central question for the Gaullist right."
 MDCW_HP_FRA_1_1_icon:0 "£generic_conservatism_small"
 MDCW_HP_FRA_2_1:0 "£generic_liberalism_small (PR) - Republican Party"
 MDCW_HP_FRA_2_1_desc:0 "(Liberal Conservatism) - Republican Party (French: Parti républicain, PR)\n\nFounded at Fréjus on 19 May 1977, the Republican Party brought together the Independent Republicans and other supporters of Valéry Giscard d'Estaing. It succeeded the FNRI as the organised party of the liberal presidential majority.\n\nThe PR favoured private enterprise, European integration and a modernised liberal conservatism. It retained a distinct identity within the broader presidential majority and competed with the Gaullists for influence."
 MDCW_HP_FRA_2_1_icon:0 "£generic_liberalism_small"
