 COLDWAR_FRA2_pressure_refuse_decision_CAM:0 "Refuse the French Procurement Ultimatum"
 COLDWAR_FRA2_pressure_refuse_decision_CAM_desc:0 "Rejecting preserves existing agreement rights but brings a 90-day withdrawal crisis and pauses France-paid cash support for 180 days where applicable. Paris requires an answer within 30 days."
