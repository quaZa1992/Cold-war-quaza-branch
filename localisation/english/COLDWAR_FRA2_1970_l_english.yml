 COLDWAR_FRA2_advanced_democracy:0 "Democratic Advance"
 COLDWAR_FRA2_advanced_democracy_desc:0 "Build on PCF-led municipalities, unions and parliamentary work to seek national power. Electoral advances broaden the party's reach but do not settle the future balance between party leadership and state institutions."
