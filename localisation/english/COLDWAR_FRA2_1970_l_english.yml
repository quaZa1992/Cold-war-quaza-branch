 COLDWAR_FRA2_fp_vietnam_engineering_VIE:0 "Vietnam Engineering Accord: Vietnam"
 COLDWAR_FRA2_fp_vietnam_engineering_VIE_desc:0 "Offer a civilian engineering programme centred on productive works, maintenance and technical training. Vietnam retains its own development priorities, while French firms and institutes gain experience at the cost of sustained aid and expert missions."
 COLDWAR_FRA2_fp_vietnam_engineering_desc:0 "Offer a civilian engineering programme centred on productive works, maintenance and technical training. Vietnam retains its own development priorities, while French firms and institutes gain experience at the cost of sustained aid and expert missions."
 COLDWAR_FRA2_fp_vietnam_engineering_france:0 "Vietnam Engineering Accord: France"
 COLDWAR_FRA2_fp_vietnam_engineering_france_desc:0 "Offer a civilian engineering programme centred on productive works, maintenance and technical training. Vietnam retains its own development priorities, while French firms and institutes gain experience at the cost of sustained aid and expert missions."
 COLDWAR_FRA2_fp_vietnam_engineering_recipient_heading:0 "[VIE.GetName]"
 COLDWAR_FRA2_fp_vietnam_health:0 "Vietnam Medicine"
 COLDWAR_FRA2_fp_vietnam_health_VIE:0 "Vietnam Medical Institutes: Vietnam"
 COLDWAR_FRA2_fp_vietnam_health_VIE_desc:0 "Prioritise medical administration, prevention and technical training rather than a larger industrial programme. Vietnam gains useful local services and France develops medical-equipment expertise, with a lasting burden of grants and expert missions."
 COLDWAR_FRA2_fp_vietnam_health_desc:0 "Prioritise medical administration, prevention and technical training rather than a larger industrial programme. Vietnam gains useful local services and France develops medical-equipment expertise, with a lasting burden of grants and expert missions."
 COLDWAR_FRA2_fp_vietnam_health_france:0 "Vietnam Medical Institutes: France"
 COLDWAR_FRA2_fp_vietnam_health_france_desc:0 "Prioritise medical administration, prevention and technical training rather than a larger industrial programme. Vietnam gains useful local services and France develops medical-equipment expertise, with a lasting burden of grants and expert missions."
 COLDWAR_FRA2_fp_vietnam_health_recipient_heading:0 "[VIE.GetName]"
 COLDWAR_FRA2_franc_stabilisation:0 "After the 1969 Devaluation"
 COLDWAR_FRA2_franc_stabilisation_desc:0 "The franc adjustment supports export orders, while the credit restraint used to stabilise demand weighs on construction and domestic investment."
 COLDWAR_FRA2_france_accept_heading:0 "[FRA.GetName]"
 COLDWAR_FRA2_fund_reactor:0 "Fund the First Approved Reactor Project"
 COLDWAR_FRA2_fund_reactor_desc:0 "Begin the Loire project only after France has completed reactor construction research and can add another unit within the area's native capacity."
 COLDWAR_FRA2_gaullist_success:0 "Gaullist Majority"
 COLDWAR_FRA2_gaullist_success_desc:0 "Turn the 1968 parliamentary majority into a programme that can survive de Gaulle's departure. Pompidou and Chaban-Delmas must balance social reform, industrial growth and the authority of the Gaullist movement."
 COLDWAR_FRA2_global_partnerships_programme:0 "Global Technical Partnerships Programme"
 COLDWAR_FRA2_global_partnerships_programme_desc:0 "French national policy and individually negotiated standing agreements. Partner governments retain their own authority."
 COLDWAR_FRA2_grassroots_left:0 "PSU Grassroots"
 COLDWAR_FRA2_grassroots_left_desc:0 "Give local militants, young workers and university activists a route into national decisions outside the larger socialist and communist parties. Participation broadens the PSU's reach but makes coordination harder."
 COLDWAR_FRA2_grenelle:0 "The Unfinished Settlement of Grenelle"
 COLDWAR_FRA2_grenelle_desc:0 "The wage settlement ended a national confrontation without resolving disputes over management, representation and the distribution of growth."
 COLDWAR_FRA2_higher_education_pressures:0 "Higher Education Expansion Pressures"
 COLDWAR_FRA2_higher_education_pressures_desc:0 "New colleges and universities widen access, while staffing, laboratories and technical instruction take time to catch up. These adjustment costs remain part of the national education system."
 COLDWAR_FRA2_housing:0 "Housing and Rights"
 COLDWAR_FRA2_housing_desc:0 "SONACOTRA and local authorities already house workers and families displaced by rapid urban growth. Extend serviced housing around Paris and replace precarious accommodation with lasting municipal services."
 COLDWAR_FRA2_independent_communism:0 "Party Independence"
 COLDWAR_FRA2_independent_communism_desc:0 "Develop cooperative finance, worker participation and municipal expertise with Italian partners. A French communist government can pursue practical European cooperation without yielding its political autonomy."
 COLDWAR_FRA2_independent_communism_recipient_heading:0 "[ITA.GetName]"
 COLDWAR_FRA2_institutional_balance_residual:0 "Unsettled Institutional Balance"
 COLDWAR_FRA2_institutional_balance_residual_desc:0 "The first constitutional reform has changed the presidency, but parliamentary scrutiny and public trust remain unsettled. The existing political-power advantage has ended; the remaining administrative and stability costs persist until the wider civic settlement."
 COLDWAR_FRA2_institutions_programme:0 "Republic and Society Programme"
 COLDWAR_FRA2_institutions_programme_desc:0 "A national programme for the authority, accountability and public services of the Fifth Republic."
 COLDWAR_FRA2_iran_energy:0 "Iranian Energy"
 COLDWAR_FRA2_iran_energy_PER:0 "Iranian Energy: Iran"
 COLDWAR_FRA2_iran_energy_PER_desc:0 "Negotiate energy engineering and technical cooperation with Iran. Generation gains come with commercial commitments and continuing French expenditure on technical services."
 COLDWAR_FRA2_iran_energy_desc:0 "Negotiate energy engineering and technical cooperation with Iran. Generation gains come with commercial commitments and continuing French expenditure on technical services."
 COLDWAR_FRA2_iran_energy_france:0 "Iranian Energy: France"
 COLDWAR_FRA2_iran_energy_france_desc:0 "Negotiate energy engineering and technical cooperation with Iran. Generation gains come with commercial commitments and continuing French expenditure on technical services."
 COLDWAR_FRA2_iran_energy_recipient_heading:0 "[PER.GetName]"
 COLDWAR_FRA2_italy:0 "Italian Cooperation"
 COLDWAR_FRA2_italy_ITA:0 "Italian Cooperation: Italy"
 COLDWAR_FRA2_italy_ITA_desc:0 "Offer Italy a joint machinery and industrial-research programme. Specialisation can benefit both economies, while each accepts a smaller national share of public contracts."
 COLDWAR_FRA2_italy_desc:0 "Offer Italy a joint machinery and industrial-research programme. Specialisation can benefit both economies, while each accepts a smaller national share of public contracts."
 COLDWAR_FRA2_italy_france:0 "Italian Cooperation: France"
 COLDWAR_FRA2_italy_france_desc:0 "Offer Italy a joint machinery and industrial-research programme. Specialisation can benefit both economies, while each accepts a smaller national share of public contracts."
 COLDWAR_FRA2_italy_recipient_heading:0 "[ITA.GetName]"
 COLDWAR_FRA2_jaguar:0 "Jaguar Partnership"
 COLDWAR_FRA2_jaguar_ENG:0 "Jaguar Partnership: United Kingdom"
 COLDWAR_FRA2_jaguar_ENG_desc:0 "Renew Anglo-French cooperation around the Jaguar precedent. Common development and training can serve both air forces, while each government retains control of its own commitments."
 COLDWAR_FRA2_jaguar_desc:0 "Renew Anglo-French cooperation around the Jaguar precedent. Common development and training can serve both air forces, while each government retains control of its own commitments."
 COLDWAR_FRA2_jaguar_doctrine:0 "Jaguar Air Doctrine"
 COLDWAR_FRA2_jaguar_doctrine_desc:0 "Build training around the Anglo-French Jaguar and common operating standards. Joint instruction improves aircrew preparation and fuel discipline, but requires permanent instructor posts and specialist ground crews."
 COLDWAR_FRA2_jaguar_france:0 "Jaguar Partnership: France"
 COLDWAR_FRA2_jaguar_france_desc:0 "Renew Anglo-French cooperation around the Jaguar precedent. Common development and training can serve both air forces, while each government retains control of its own commitments."
 COLDWAR_FRA2_jaguar_recipient_heading:0 "[ENG.GetName]"
 COLDWAR_FRA2_land_procurement:0 "Armour Procurement"
 COLDWAR_FRA2_land_procurement_desc:0 "Choose the industrial basis of future land equipment. A national platform preserves French design authority; common components can lower costs if partners agree."
 COLDWAR_FRA2_land_stewardship:0 "Rural Stewardship"
 COLDWAR_FRA2_land_stewardship_desc:0 "Support rural services and farming that relies less on purchased industrial inputs. Smaller holdings and local employment gain support, though yields may grow more slowly."
 COLDWAR_FRA2_left_radicals:0 "Republican Left"
 COLDWAR_FRA2_left_radicals_desc:0 "Bring cooperative credit and local public services into the republican programme through an Aquitaine office. Labour gains a stronger voice, alongside continuing social commitments."
 COLDWAR_FRA2_liberal_state:0 "Modern Liberal State"
 COLDWAR_FRA2_liberal_state_desc:0 "Giscard's Independent Republicans favour administrative competence and room for private initiative. Reform can widen enterprise while placing limits on established public privileges and discretionary state support."
 COLDWAR_FRA2_local_generation:0 "Local Power Supply"
 COLDWAR_FRA2_local_generation_desc:0 "Use engineering and regional coordination to improve existing hydroelectric and distributed generation. Better use of local resources requires trained operators and sustained technical administration."
 COLDWAR_FRA2_local_sufficiency:0 "Local Sufficiency"
 COLDWAR_FRA2_local_sufficiency_desc:0 "Develop municipal heat networks and local energy engineering with Austrian partners. France prioritises regional services over heavy throughput; Austria funds efficient generation and technical exchange."
 COLDWAR_FRA2_local_sufficiency_recipient_heading:0 "[AUS.GetName]"
 COLDWAR_FRA2_logistics:0 "Joint Logistics"
 COLDWAR_FRA2_logistics_desc:0 "Standardise support across the services so readiness survives deployment. Common routines improve supply, but require a permanent maintenance organisation."
 COLDWAR_FRA2_management:0 "Managerial Autonomy"
 COLDWAR_FRA2_management_desc:0 "Give professional managers greater freedom and support a Paris-region business and technical office. Firms retain more of the gains, while organised labour loses influence over investment decisions."
 COLDWAR_FRA2_mass_universities:0 "Mass Universities"
 COLDWAR_FRA2_mass_universities_desc:0 "Put the Faure reforms into practice and widen access to university study. More open institutions strengthen research and social mobility, but require a larger permanent education budget."
 COLDWAR_FRA2_memory:0 "Historical Recognition"
 COLDWAR_FRA2_memory_desc:0 "Veterans, harkis, repatriates and Algerian families carry distinct experiences of the war and its aftermath. Public recognition can make room for those histories, but it must be joined to practical support."
 COLDWAR_FRA2_mirage:0 "Mirage Design Line"
 COLDWAR_FRA2_mirage_desc:0 "Sustain Dassault's national combat-aircraft design and export capability. A continuing engineering base supports future models without granting technology that has not yet been developed."
 COLDWAR_FRA2_modifier_army_org_factor_tt:0 "$MODIFIER_ARMY_ORG_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_FRA2_modifier_production_factory_efficiency_gain_factor_tt:0 "$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_FRA2_modifier_production_factory_max_efficiency_factor_tt:0 "$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_FRA2_modifier_production_speed_infrastructure_factor_tt:0 "$modifier_production_speed_infrastructure_factor$: $RIGHT|+=%1$"
 COLDWAR_FRA2_modifier_research_speed_factor_tt:0 "$MODIFIER_RESEARCH_SPEED_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_FRA2_motorways:0 "Regional Motorways"
 COLDWAR_FRA2_motorways_desc:0 "Extend road access to industrial towns and smaller centres. Flexible routes can support regional growth, while increasing the economy's dependence on imported motor fuel."
 COLDWAR_FRA2_municipal_france:0 "Municipal France"
 COLDWAR_FRA2_municipal_france_desc:0 "Aquitaine's market towns, cooperatives and local authorities can bring investment closer to producers. Offices and agricultural processing reinforce municipal services, while regional administration carries a continuing cost."
 COLDWAR_FRA2_municipal_socialism:0 "Municipal Socialism"
 COLDWAR_FRA2_municipal_socialism_desc:0 "Carry the housing, school and cultural-service record of PCF municipalities into a wider investment programme. Local provision grows, while national coordination adds to the public commitment."
 COLDWAR_FRA2_mutuals:0 "Social Insurance"
 COLDWAR_FRA2_mutuals_desc:0 "Mutual societies and local insurance funds already connect households to health and social provision. Strengthen their administrative capacity while sustaining the wider public contribution on which coverage depends."
 COLDWAR_FRA2_national_armour:0 "AMX National Design"
 COLDWAR_FRA2_national_armour_desc:0 "Sustain a national armoured design line and its testing base. Domestic production retains expertise and control, but costs more than pooled procurement."
 COLDWAR_FRA2_national_champions:0 "National Champions"
 COLDWAR_FRA2_national_champions_desc:0 "Support a productive site in Rhone-Alpes and engineering offices in Normandie. Large industrial groups can undertake national projects, but expect public support and favourable tax treatment."
 COLDWAR_FRA2_national_computers:0 "Computer Industry"
 COLDWAR_FRA2_national_computers_desc:0 "Back the domestic computer-systems industry and Grenoble's engineering base with a funded production site. Independent supply requires public orders and continuing fiscal concessions."
 COLDWAR_FRA2_nato_atlantic_fleet:0 "Atlantic Exercises"
 COLDWAR_FRA2_nato_atlantic_fleet_ENG:0 "Atlantic Exercises: United Kingdom"
 COLDWAR_FRA2_nato_atlantic_fleet_ENG_desc:0 "Offer Britain a funded programme of naval exercises and fleet-support training. Both governments retain freedom to decide whether to commit ships in a crisis."
 COLDWAR_FRA2_nato_atlantic_fleet_desc:0 "Offer Britain a funded programme of naval exercises and fleet-support training. Both governments retain freedom to decide whether to commit ships in a crisis."
 COLDWAR_FRA2_nato_atlantic_fleet_external_requirement_2:0 "[ENG.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_atlantic_fleet_external_requirement_3:0 "[FRA.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_atlantic_fleet_france:0 "Atlantic Exercises: France"
 COLDWAR_FRA2_nato_atlantic_fleet_france_desc:0 "Offer Britain a funded programme of naval exercises and fleet-support training. Both governments retain freedom to decide whether to commit ships in a crisis."
 COLDWAR_FRA2_nato_atlantic_fleet_recipient_heading:0 "[ENG.GetName]"
 COLDWAR_FRA2_nato_common_maintenance:0 "Shared Maintenance"
 COLDWAR_FRA2_nato_common_maintenance_desc:0 "Turn agreed land-equipment standards into training and support routines for French forces. The partnership provides experience while France funds its own personnel."
 COLDWAR_FRA2_nato_conditional_plan:0 "Joint Contingencies"
 COLDWAR_FRA2_nato_conditional_plan_desc:0 "Train national staffs to coordinate an agreed contingency while preserving France's decision on any military commitment. Reliable planning requires a continuing personnel allocation."
 COLDWAR_FRA2_nato_europe_land:0 "Land Standardisation"
 COLDWAR_FRA2_nato_europe_land_GER:0 "Land Standardisation: Federal Republic of Germany"
 COLDWAR_FRA2_nato_europe_land_GER_desc:0 "Offer West Germany a further programme for compatible land equipment and maintenance standards. Both countries can reduce support costs while financing technical work; no force passes to a new command."
 COLDWAR_FRA2_nato_europe_land_desc:0 "Offer West Germany a further programme for compatible land equipment and maintenance standards. Both countries can reduce support costs while financing technical work; no force passes to a new command."
 COLDWAR_FRA2_nato_europe_land_external_requirement_2:0 "[GER.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_europe_land_external_requirement_3:0 "[FRA.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_europe_land_france:0 "Land Standardisation: France"
 COLDWAR_FRA2_nato_europe_land_france_desc:0 "Offer West Germany a further programme for compatible land equipment and maintenance standards. Both countries can reduce support costs while financing technical work; no force passes to a new command."
 COLDWAR_FRA2_nato_europe_land_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_nato_europe_sea:0 "European Naval Pact"
 COLDWAR_FRA2_nato_europe_sea_ENG:0 "European Naval Pact: United Kingdom"
 COLDWAR_FRA2_nato_europe_sea_ENG_desc:0 "Offer Britain a European naval engineering and production partnership. Shared development supports both shipbuilding sectors and requires continuing public contributions."
 COLDWAR_FRA2_nato_europe_sea_desc:0 "Offer Britain a European naval engineering and production partnership. Shared development supports both shipbuilding sectors and requires continuing public contributions."
 COLDWAR_FRA2_nato_europe_sea_external_requirement_2:0 "[ENG.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_europe_sea_external_requirement_3:0 "[FRA.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_europe_sea_france:0 "European Naval Pact: France"
 COLDWAR_FRA2_nato_europe_sea_france_desc:0 "Offer Britain a European naval engineering and production partnership. Shared development supports both shipbuilding sectors and requires continuing public contributions."
 COLDWAR_FRA2_nato_europe_sea_recipient_heading:0 "[ENG.GetName]"
 COLDWAR_FRA2_nato_europe_staff:0 "Joint Naval Staffs"
 COLDWAR_FRA2_nato_europe_staff_desc:0 "Develop French naval doctrine through the agreed European industrial programme. Staff exchanges and technical analysis require permanent administrative support."
 COLDWAR_FRA2_nato_european:0 "A European Pillar"
 COLDWAR_FRA2_nato_european_desc:0 "Concentrate new investment on European capability and compatible equipment. A stronger European voice in the Alliance requires technical preparation and sustained political coordination."
 COLDWAR_FRA2_nato_fleet_support:0 "Joint Fleet Support"
 COLDWAR_FRA2_nato_fleet_support_desc:0 "Apply agreed naval-exercise lessons to French fleet support. More efficient supply can improve routine readiness, but requires a larger trained support establishment."
 COLDWAR_FRA2_nato_independent:0 "An Independent Ally"
 COLDWAR_FRA2_nato_independent_desc:0 "Keep Atlantic political solidarity while directing discretionary funds toward capabilities France can control and sustain. Independence reduces outside leverage but duplicates some equipment and support capacity."
 COLDWAR_FRA2_nato_land_design:0 "Armour Design"
 COLDWAR_FRA2_nato_land_design_desc:0 "Carry the national land programme through design, testing and engineering. French expertise must be funded rather than granted through an automatic technology award."
 COLDWAR_FRA2_nato_land_priority:0 "National Land Forces"
 COLDWAR_FRA2_nato_land_priority_desc:0 "Fund French land equipment and training for an independent continental contribution. Domestic capacity expands while the equipment estate becomes more expensive to maintain."
 COLDWAR_FRA2_nato_nuclear_consult:0 "Nuclear Consultation"
 COLDWAR_FRA2_nato_nuclear_consult_desc:0 "Consult allies on deterrence and escalation while reserving the final decision to France. Consultation grants neither Nuclear Planning Group membership nor nuclear sharing or an allied veto."
 COLDWAR_FRA2_nato_nuclear_veto:0 "National Nuclear Veto"
 COLDWAR_FRA2_nato_nuclear_veto_desc:0 "Fund an independent assessment and decision system for the force de frappe. National authority reinforces the Gaullist mandate, while France bears the support burden of its separate capability."
 COLDWAR_FRA2_nato_pragmatic:0 "Selective Cooperation"
 COLDWAR_FRA2_nato_pragmatic_desc:0 "Expand liaison, exercises and contingency preparation under French authority. Practical cooperation improves support without assigning forces automatically to allied command, at the cost of a larger coordination staff."
 COLDWAR_FRA2_nato_review:0 "France and NATO"
 COLDWAR_FRA2_nato_review_desc:0 "France remains in the Atlantic Treaty after withdrawing from NATO's integrated command in 1966. Pompidou can reaffirm national discretion, deepen conditional cooperation or strengthen Europe's contribution without transferring authority over the French deterrent."
 COLDWAR_FRA2_nato_rhine:0 "Rhine Field Exercises"
 COLDWAR_FRA2_nato_rhine_GER:0 "Rhine Field Exercises: Federal Republic of Germany"
 COLDWAR_FRA2_nato_rhine_GER_desc:0 "Offer West Germany an additional land-exercise programme alongside existing French forces in Germany. Each government retains control of its forces; the agreement creates neither new basing rights nor an automatic wartime commitment."
 COLDWAR_FRA2_nato_rhine_desc:0 "Offer West Germany an additional land-exercise programme alongside existing French forces in Germany. Each government retains control of its forces; the agreement creates neither new basing rights nor an automatic wartime commitment."
 COLDWAR_FRA2_nato_rhine_external_requirement_2:0 "[GER.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_rhine_external_requirement_3:0 "[FRA.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_rhine_france:0 "Rhine Field Exercises: France"
 COLDWAR_FRA2_nato_rhine_france_desc:0 "Offer West Germany an additional land-exercise programme alongside existing French forces in Germany. Each government retains control of its forces; the agreement creates neither new basing rights nor an automatic wartime commitment."
 COLDWAR_FRA2_nato_rhine_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_nato_sea_design:0 "French Naval Design"
 COLDWAR_FRA2_nato_sea_design_desc:0 "Fund design teams and sea trials within French naval institutions. The programme develops expertise without granting ships or future hull technology."
 COLDWAR_FRA2_nato_sea_priority:0 "National Sea Power"
 COLDWAR_FRA2_nato_sea_priority_desc:0 "Direct the discretionary programme toward French naval construction and support. Greater shipyard capacity still requires crews, training and long-term maintenance."
 COLDWAR_FRA2_naval_review:0 "Naval Commitments"
 COLDWAR_FRA2_naval_review_desc:0 "Choose between distant oceanic presence and the routine work of escorting convoys, protecting approaches and maintaining the fleet."
 COLDWAR_FRA2_new_society:0 "Chaban's New Deal"
 COLDWAR_FRA2_new_society_desc:0 "Chaban-Delmas's New Society pairs administrative reform with broader workplace participation. Technical training and bargaining give the proposal material weight, while conservative Gaullists resist a lasting opening to organised labour."
 COLDWAR_FRA2_nuclear_construction_ready_tt:0 "France must have reactor construction technology and room to build in Loire."
 COLDWAR_FRA2_nuclear_priority:0 "Nuclear Deterrent"
 COLDWAR_FRA2_nuclear_priority_desc:0 "Keep the independent deterrent and its engineering base at the centre of defence policy. Conventional procurement and readiness must absorb the resulting pressure on resources."
 COLDWAR_FRA2_nuclear_scale:0 "Nuclear Expansion"
 COLDWAR_FRA2_nuclear_scale_desc:0 "Standardise the civil nuclear supply chain around the reactor choice made in 1970. Engineering and construction performance can improve, while every additional reactor still requires separate public investment."
 COLDWAR_FRA2_ocean_navy:0 "Ocean-Going Fleet"
 COLDWAR_FRA2_ocean_navy_desc:0 "Sustain the dockyards and trained crews required for an oceanic fleet. Overseas presence expands French reach but needs a larger permanent personnel establishment."
