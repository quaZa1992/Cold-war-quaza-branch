 COLDWAR_FRA2_defence_parent_jaguar_programme:0 "Jaguar Partnership Programme"
 COLDWAR_FRA2_defence_parent_jaguar_programme_desc:0 "France sustains an independent deterrent, national procurement and forces able to serve in Europe and overseas. Strategic freedom competes with the cost of readiness, equipment and specialist personnel."
 COLDWAR_FRA2_defence_programme:0 "Independent Defence Programme"
 COLDWAR_FRA2_defence_programme_desc:0 "French defence policy balances the independent deterrent, conventional forces and the cost of readiness."
 COLDWAR_FRA2_defence_review:0 "Defence Priorities"
 COLDWAR_FRA2_defence_review_desc:0 "Set the balance between the national deterrent, conventional defence in Europe and overseas commitments. Each choice draws on the same skilled personnel, procurement base and public resources."
 COLDWAR_FRA2_defferre:0 "The Defferre Reforms"
 COLDWAR_FRA2_defferre_desc:0 "Continue the decentralising reforms associated with Gaston Defferre and give Provence a first regional service programme. Elected institutions gain practical authority as the central state relinquishes some control."
 COLDWAR_FRA2_democratic_left:0 "Independent Left"
 COLDWAR_FRA2_democratic_left_desc:0 "Build an independent democratic left around parliamentary reform and a dependable fiscal base. Negotiating a majority consumes political capital, while distance from the Communists can unsettle supporters who expect a united opposition."
 COLDWAR_FRA2_democratic_road:0 "Democratic Socialism"
 COLDWAR_FRA2_democratic_road_desc:0 "Seek authority through elections, representative institutions and cooperation with organised labour. A broader constitutional mandate can steady the transition, while bargaining with allies limits the leadership's freedom to act alone."
 COLDWAR_FRA2_deterrent:0 "The Price of Independence"
 COLDWAR_FRA2_deterrent_desc:0 "The national deterrent and an independent procurement system preserve strategic freedom while drawing resources from conventional forces and civilian investment."
 COLDWAR_FRA2_diplomacy_programme:0 "Partnerships by Consent Programme"
 COLDWAR_FRA2_diplomacy_programme_desc:0 "France negotiates technical and industrial partnerships while preserving each government's authority to consent."
 COLDWAR_FRA2_diplomatic_review:0 "An Independent Voice"
 COLDWAR_FRA2_diplomatic_review_desc:0 "France can protect its independence through national capacity or through partnerships negotiated on equal terms. Decide where cooperation strengthens French influence and where it constrains it."
 COLDWAR_FRA2_diverse_energy:0 "Diversified Energy"
 COLDWAR_FRA2_diverse_energy_desc:0 "Pair more efficient use with a broader energy portfolio. Varied sources reduce concentration risk, though France remains exposed to imported fuel and supply changes."
 COLDWAR_FRA2_ecological_industry:0 "Industrial Conversion"
 COLDWAR_FRA2_ecological_industry_desc:0 "Coordinate industrial conservation and clean-production engineering along the Rhine. Technical offices and shared research support conversion, while stricter operating practice reduces immediate factory output."
 COLDWAR_FRA2_ecological_industry_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_ecology_municipal_heat:0 "Municipal Heat"
 COLDWAR_FRA2_ecology_municipal_heat_desc:0 "Fund a Rhone-Alpes combined heat-and-power site and connected local infrastructure in Bourgogne. Shared heat distribution reduces waste, but operation requires trained staff and does not make fossil generation carbon-free."
 COLDWAR_FRA2_ecology_programme:0 "Political Ecology Programme"
 COLDWAR_FRA2_ecology_programme_desc:0 "An emerging ecological course weighs conservation, rural livelihoods and the costs of industrial growth."
 COLDWAR_FRA2_ecology_river_basins:0 "River Basin Works"
 COLDWAR_FRA2_ecology_river_basins_desc:0 "Strengthen river-basin inspection in Alsace-Lorraine and sanitation infrastructure in Normandie. Prevention and cleaner services can reduce health costs, while discharge standards slow the approval of new industrial sites."
 COLDWAR_FRA2_economy_programme:0 "Industry, Regions and Energy Programme"
 COLDWAR_FRA2_economy_programme_desc:0 "French economic policy balances regional access, industrial investment, education and secure energy."
 COLDWAR_FRA2_education:0 "A Narrow Route to Expertise"
 COLDWAR_FRA2_education_desc:0 "Elite schools and national laboratories support advanced science, while technical training and mass university provision struggle to keep pace.\n\nRelief: Technical Colleges or Mass Universities replaces this spirit with Higher Education Expansion Pressures: education cost +4% and factory efficiency growth -1%. This adjustment is permanent."
 COLDWAR_FRA2_efficiency_ecology:0 "Conservation Works"
 COLDWAR_FRA2_efficiency_ecology_desc:0 "Fund civilian production of insulation and energy-saving equipment alongside practical conservation research. Lower fuel demand can make industry less vulnerable to supply shocks, while workers and installers need specialist training."
 COLDWAR_FRA2_energy_audit:0 "Energy Contingency Planning"
 COLDWAR_FRA2_energy_audit_desc:0 "French industry depends heavily on imported fuel. Review supply, transport and demand before a disruption reaches public services."
 COLDWAR_FRA2_energy_audit_timed:0 "Energy Contingency Planning"
 COLDWAR_FRA2_energy_audit_timed_desc:0 "A temporary national programme applies these policy changes for the stated duration."
 COLDWAR_FRA2_energy_review:0 "Energy Choices"
 COLDWAR_FRA2_energy_review_desc:0 "Review fuel dependence before an external crisis forces emergency decisions. France must choose between capital-intensive generation and a broader mix of supply and demand measures."
 COLDWAR_FRA2_environment_account:0 "Ecological Politics"
 COLDWAR_FRA2_environment_account_desc:0 "Make pollution and resource use part of public accounting. Ecological politics is emerging from disputes over the social and environmental costs of rapid postwar development."
 COLDWAR_FRA2_escort_navy:0 "Maritime Escorts"
 COLDWAR_FRA2_escort_navy_desc:0 "Prioritise escorts, maintenance and protection of French approaches. Reliable routine coverage requires continuously staffed patrols, technical crews and a larger naval personnel bill."
 COLDWAR_FRA2_europe_liberal:0 "European Market"
 COLDWAR_FRA2_europe_liberal_desc:0 "Underwrite eligible cross-border orders through French and German institutions. Additional business receipts must be weighed against public guarantees and the risk of loss."
 COLDWAR_FRA2_europe_liberal_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_europe_restraint:0 "Monetary Discipline"
 COLDWAR_FRA2_europe_restraint_desc:0 "Coordinate financial institutions and budget priorities with West Germany. France gains room for monetary discipline at the price of domestic restraint, while Germany commits administrative and political resources."
 COLDWAR_FRA2_europe_restraint_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_europe_technology:0 "European Ventures"
 COLDWAR_FRA2_europe_technology_desc:0 "French computing must compete with firms able to spread research costs across far larger markets. Invite West Germany to share engineering work and specialist offices in a computing consortium, while negotiating common standards and the division of public orders."
 COLDWAR_FRA2_europe_technology_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_executive:0 "Executive Safeguards"
 COLDWAR_FRA2_executive_desc:0 "The Fifth Republic gives the presidency decisive authority. Clarifying the statutory limits around emergency powers can protect the mandate while leaving Parliament with fewer checks on executive action."
 COLDWAR_FRA2_export_farms:0 "Export Agriculture"
 COLDWAR_FRA2_export_farms_desc:0 "Support mechanisation and processing for European and world markets. Larger farms can raise output and exports, but intensify pressure on small holdings and farm incomes."
 COLDWAR_FRA2_farm_policy:0 "Farm Settlement"
 COLDWAR_FRA2_farm_policy_desc:0 "Decide how agricultural modernisation should divide its gains between export-scale production and the survival of smaller rural communities."
 COLDWAR_FRA2_federal_europe:0 "Federal Europe"
 COLDWAR_FRA2_federal_europe_desc:0 "Exchange insurance administration, professional training and local-care practice between French mutual societies and German partners. Skilled staff and compatible rules require continuing investment."
 COLDWAR_FRA2_federal_europe_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_flight_schools:0 "Flight Safety"
 COLDWAR_FRA2_flight_schools_desc:0 "Train instructors and improve flight safety before increasing operational demands. Skilled crews take time to develop, and training competes with immediate readiness."
 COLDWAR_FRA2_fn_arsenal_orders:0 "Arsenal Renewal"
 COLDWAR_FRA2_fn_arsenal_orders_desc:0 "Direct defence orders toward domestic production in Hauts-de-France and Aquitaine. Additional industrial capacity supports the armed nation, while protected procurement raises the equipment bill."
 COLDWAR_FRA2_fn_contract_inspection:0 "Export Inspection"
 COLDWAR_FRA2_fn_contract_inspection_desc:0 "Build a Provence office for military aviation certification and technical export support. Evaluation flights and specialist studies improve expertise, while instructor and inspection posts enlarge the air personnel bill."
 COLDWAR_FRA2_fn_defence:0 "The Armed Nation"
 COLDWAR_FRA2_fn_defence_desc:0 "Prioritise territorial mobilisation and a national armaments base. Sustained readiness raises costs and gives military preparation a larger place in public life."
 COLDWAR_FRA2_fn_export:0 "Export Coalition"
 COLDWAR_FRA2_fn_export_desc:0 "Offer aviation training, engineering and export support to Argentina. Orders support French firms and Argentine readiness, while France must maintain instructor detachments and technical personnel."
 COLDWAR_FRA2_fn_export_recipient_heading:0 "[ARG.GetName]"
 COLDWAR_FRA2_fn_protection:0 "National Protection"
 COLDWAR_FRA2_fn_protection_desc:0 "Shelter French producers from external competition. Protected markets support local investment, but weaker competition and restricted technical exchange slow research and reduce civilian productivity."
 COLDWAR_FRA2_fn_state:0 "Authoritarian State"
 COLDWAR_FRA2_fn_state_desc:0 "Concentrate executive authority behind a nationalist government and a larger security establishment. Reorganising the state consumes political capital, while exclusion, coercion and increased police spending undermine republican trust."
 COLDWAR_FRA2_fp_abidjan_port:0 "Abidjan Port"
 COLDWAR_FRA2_fp_abidjan_port_CDI:0 "Abidjan Commercial Port: Cote d'Ivoire"
 COLDWAR_FRA2_fp_abidjan_port_CDI_desc:0 "Support repair, cargo and logistics services on a commercial basis without a French military access term. Ivorian maritime capacity expands and French yards receive work, while the two governments finance training and administration."
 COLDWAR_FRA2_fp_abidjan_port_desc:0 "Support repair, cargo and logistics services on a commercial basis without a French military access term. Ivorian maritime capacity expands and French yards receive work, while the two governments finance training and administration."
 COLDWAR_FRA2_fp_abidjan_port_france:0 "Abidjan Commercial Port: France"
 COLDWAR_FRA2_fp_abidjan_port_france_desc:0 "Support repair, cargo and logistics services on a commercial basis without a French military access term. Ivorian maritime capacity expands and French yards receive work, while the two governments finance training and administration."
 COLDWAR_FRA2_fp_abidjan_port_recipient_heading:0 "[CDI.GetName]"
 COLDWAR_FRA2_fp_abidjan_transit:0 "Abidjan Transit"
 COLDWAR_FRA2_fp_abidjan_transit_CDI:0 "Abidjan Transit Mission: Cote d'Ivoire"
 COLDWAR_FRA2_fp_abidjan_transit_CDI_desc:0 "Negotiate land and air transit through Cote d'Ivoire, supported by local transport works and an initial French investment. Actual host-approved access improves deployment options, while French personnel and equipment support require an initial commitment."
 COLDWAR_FRA2_fp_abidjan_transit_desc:0 "Negotiate land and air transit through Cote d'Ivoire, supported by local transport works and an initial French investment. Actual host-approved access improves deployment options, while French personnel and equipment support require an initial commitment."
 COLDWAR_FRA2_fp_abidjan_transit_france:0 "Abidjan Transit Mission: France"
 COLDWAR_FRA2_fp_abidjan_transit_france_desc:0 "Negotiate land and air transit through Cote d'Ivoire, supported by local transport works and an initial French investment. Actual host-approved access improves deployment options, while French personnel and equipment support require an initial commitment."
 COLDWAR_FRA2_fp_abidjan_transit_recipient_heading:0 "[CDI.GetName]"
 COLDWAR_FRA2_fp_african_finance:0 "West African Desk"
 COLDWAR_FRA2_fp_african_finance_desc:0 "Establish a regional diplomatic service for separate negotiations with the governments concerned. Each agreement and intervention requires its own national programme and local preparation."
 COLDWAR_FRA2_fp_african_security:0 "Sahel Relations"
 COLDWAR_FRA2_fp_african_security_desc:0 "Establish a regional diplomatic service for separate negotiations with the governments concerned. Each agreement and intervention requires its own national programme and local preparation."
 COLDWAR_FRA2_fp_arab_contracts:0 "Export Support Office"
 COLDWAR_FRA2_fp_arab_contracts_desc:0 "Concentrate aircraft, naval and engineering support in Provence. French exports depend on technicians and long support commitments, rather than a signature followed by an effortless windfall."
 COLDWAR_FRA2_fp_cameroon_guarantee:0 "Franc Zone Services"
 COLDWAR_FRA2_fp_cameroon_guarantee_CAM:0 "Central Franc Services: Cameroon"
 COLDWAR_FRA2_fp_cameroon_guarantee_CAM_desc:0 "Negotiate a French-backed settlement-service programme with Cameroon. The guarantee supports local institutions, while reporting requirements and French technical personnel preserve a privileged commercial relationship."
 COLDWAR_FRA2_fp_cameroon_guarantee_desc:0 "Negotiate a French-backed settlement-service programme with Cameroon. The guarantee supports local institutions, while reporting requirements and French technical personnel preserve a privileged commercial relationship."
 COLDWAR_FRA2_fp_cameroon_guarantee_france:0 "Central Franc Services: France"
 COLDWAR_FRA2_fp_cameroon_guarantee_france_desc:0 "Negotiate a French-backed settlement-service programme with Cameroon. The guarantee supports local institutions, while reporting requirements and French technical personnel preserve a privileged commercial relationship."
 COLDWAR_FRA2_fp_cameroon_guarantee_recipient_heading:0 "[CAM.GetName]"
 COLDWAR_FRA2_fp_cameroon_treasury:0 "African Treasuries"
 COLDWAR_FRA2_fp_cameroon_treasury_CAM:0 "African Treasury Seats: Cameroon"
 COLDWAR_FRA2_fp_cameroon_treasury_CAM_desc:0 "Finance treasury training and local financial offices while conceding more management authority to Cameroon. French equipment suppliers and technical services expand, but Paris accepts a larger initial investment and less direct commercial control."
 COLDWAR_FRA2_fp_cameroon_treasury_desc:0 "Finance treasury training and local financial offices while conceding more management authority to Cameroon. French equipment suppliers and technical services expand, but Paris accepts a larger initial investment and less direct commercial control."
 COLDWAR_FRA2_fp_cameroon_treasury_france:0 "African Treasury Seats: France"
 COLDWAR_FRA2_fp_cameroon_treasury_france_desc:0 "Finance treasury training and local financial offices while conceding more management authority to Cameroon. French equipment suppliers and technical services expand, but Paris accepts a larger initial investment and less direct commercial control."
 COLDWAR_FRA2_fp_cameroon_treasury_recipient_heading:0 "[CAM.GetName]"
 COLDWAR_FRA2_fp_chad_airlift:0 "Chadian Airlift"
 COLDWAR_FRA2_fp_chad_airlift_CHA:0 "Chadian Airlift Mission: Chad"
 COLDWAR_FRA2_fp_chad_airlift_CHA_desc:0 "Offer an airfield and advisory arrangement informed by the repeated French interventions in Chad. The host authorises access and receives funded support; France gains expeditionary experience while committing aircraft crews and logistics capacity."
 COLDWAR_FRA2_fp_chad_airlift_desc:0 "Offer an airfield and advisory arrangement informed by the repeated French interventions in Chad. The host authorises access and receives funded support; France gains expeditionary experience while committing aircraft crews and logistics capacity."
 COLDWAR_FRA2_fp_chad_airlift_france:0 "Chadian Airlift Mission: France"
 COLDWAR_FRA2_fp_chad_airlift_france_desc:0 "Offer an airfield and advisory arrangement informed by the repeated French interventions in Chad. The host authorises access and receives funded support; France gains expeditionary experience while committing aircraft crews and logistics capacity."
 COLDWAR_FRA2_fp_chad_airlift_recipient_heading:0 "[CHA.GetName]"
 COLDWAR_FRA2_fp_chad_cadres:0 "Chadian Cadres"
 COLDWAR_FRA2_fp_chad_cadres_CHA:0 "Chadian National Cadres: Chad"
 COLDWAR_FRA2_fp_chad_cadres_CHA_desc:0 "Prioritise local maintenance and military training without a French transit entitlement. Chad develops a stronger domestic force, while France funds the instruction and diverts officers from its own training system."
 COLDWAR_FRA2_fp_chad_cadres_desc:0 "Prioritise local maintenance and military training without a French transit entitlement. Chad develops a stronger domestic force, while France funds the instruction and diverts officers from its own training system."
 COLDWAR_FRA2_fp_chad_cadres_france:0 "Chadian National Cadres: France"
 COLDWAR_FRA2_fp_chad_cadres_france_desc:0 "Prioritise local maintenance and military training without a French transit entitlement. Chad develops a stronger domestic force, while France funds the instruction and diverts officers from its own training system."
 COLDWAR_FRA2_fp_chad_cadres_recipient_heading:0 "[CHA.GetName]"
 COLDWAR_FRA2_fp_djibouti_civil:0 "Djibouti Civil Pact"
 COLDWAR_FRA2_fp_djibouti_civil_DJI:0 "Djibouti Civil Compact: Djibouti"
 COLDWAR_FRA2_fp_djibouti_civil_DJI_desc:0 "Offer a sovereign Djibouti civilian services and technical training instead of a French military access term. Local productive capacity expands and French civilian missions gain experience, while the initial investment and expert staffing require a substantial commitment."
 COLDWAR_FRA2_fp_djibouti_civil_desc:0 "Offer a sovereign Djibouti civilian services and technical training instead of a French military access term. Local productive capacity expands and French civilian missions gain experience, while the initial investment and expert staffing require a substantial commitment."
 COLDWAR_FRA2_fp_djibouti_civil_france:0 "Djibouti Civil Compact: France"
 COLDWAR_FRA2_fp_djibouti_civil_france_desc:0 "Offer a sovereign Djibouti civilian services and technical training instead of a French military access term. Local productive capacity expands and French civilian missions gain experience, while the initial investment and expert staffing require a substantial commitment."
 COLDWAR_FRA2_fp_djibouti_civil_recipient_heading:0 "[DJI.GetName]"
 COLDWAR_FRA2_fp_djibouti_defence:0 "Djibouti Defence"
 COLDWAR_FRA2_fp_djibouti_defence_DJI:0 "Djibouti Defence Protocol: Djibouti"
 COLDWAR_FRA2_fp_djibouti_defence_DJI_desc:0 "Once Djibouti is sovereign, negotiate stationing conditions and a military cooperation protocol. The host authorises French land and air access and receives funding and facilities, while France accepts a permanent personnel commitment."
 COLDWAR_FRA2_fp_djibouti_defence_desc:0 "Once Djibouti is sovereign, negotiate stationing conditions and a military cooperation protocol. The host authorises French land and air access and receives funding and facilities, while France accepts a permanent personnel commitment."
 COLDWAR_FRA2_fp_djibouti_defence_france:0 "Djibouti Defence Protocol: France"
 COLDWAR_FRA2_fp_djibouti_defence_france_desc:0 "Once Djibouti is sovereign, negotiate stationing conditions and a military cooperation protocol. The host authorises French land and air access and receives funding and facilities, while France accepts a permanent personnel commitment."
 COLDWAR_FRA2_fp_djibouti_defence_recipient_heading:0 "[DJI.GetName]"
 COLDWAR_FRA2_fp_egypt_aviation:0 "Egyptian Air Support"
 COLDWAR_FRA2_fp_egypt_aviation_EGY:0 "Egyptian Air Support: Egypt"
 COLDWAR_FRA2_fp_egypt_aviation_EGY_desc:0 "Make Egypt the priority aviation support market instead. Cairo gains technical and operational training, while French manufacturers expand the support base and commit specialists to a longer technical relationship."
 COLDWAR_FRA2_fp_egypt_aviation_desc:0 "Make Egypt the priority aviation support market instead. Cairo gains technical and operational training, while French manufacturers expand the support base and commit specialists to a longer technical relationship."
 COLDWAR_FRA2_fp_egypt_aviation_france:0 "Egyptian Air Support: France"
 COLDWAR_FRA2_fp_egypt_aviation_france_desc:0 "Make Egypt the priority aviation support market instead. Cairo gains technical and operational training, while French manufacturers expand the support base and commit specialists to a longer technical relationship."
 COLDWAR_FRA2_fp_egypt_aviation_recipient_heading:0 "[EGY.GetName]"
 COLDWAR_FRA2_fp_foreign_service:0 "Foreign Trade"
 COLDWAR_FRA2_fp_foreign_service_desc:0 "Reinforce the Quai d'Orsay and commercial missions with a Paris service office. Contracts, technical missions and overseas commitments require permanent administrative staff as well as diplomatic ambition."
 COLDWAR_FRA2_fp_gabon_elf:0 "Gabon Oil Services"
 COLDWAR_FRA2_fp_gabon_elf_GAB:0 "Gabon Oil Services: Gabon"
 COLDWAR_FRA2_fp_gabon_elf_GAB_desc:0 "Offer an Elf-style petroleum services and investment settlement. Gabon receives transport works and technical assistance, while French contractors gain engineering orders and a privileged commercial position."
 COLDWAR_FRA2_fp_gabon_elf_desc:0 "Offer an Elf-style petroleum services and investment settlement. Gabon receives transport works and technical assistance, while French contractors gain engineering orders and a privileged commercial position."
 COLDWAR_FRA2_fp_gabon_elf_france:0 "Gabon Oil Services: France"
 COLDWAR_FRA2_fp_gabon_elf_france_desc:0 "Offer an Elf-style petroleum services and investment settlement. Gabon receives transport works and technical assistance, while French contractors gain engineering orders and a privileged commercial position."
 COLDWAR_FRA2_fp_gabon_elf_recipient_heading:0 "[GAB.GetName]"
 COLDWAR_FRA2_fp_gabon_officers:0 "Gabon Officers"
 COLDWAR_FRA2_fp_gabon_officers_GAB:0 "Gabon Officer Schools: Gabon"
 COLDWAR_FRA2_fp_gabon_officers_GAB_desc:0 "Replace a basing priority with stronger Gabonese military institutions. Local workshops and officer training offer a different form of security cooperation, while French advisers remain responsible for a sustained instructional commitment."
 COLDWAR_FRA2_fp_gabon_officers_desc:0 "Replace a basing priority with stronger Gabonese military institutions. Local workshops and officer training offer a different form of security cooperation, while French advisers remain responsible for a sustained instructional commitment."
 COLDWAR_FRA2_fp_gabon_officers_france:0 "Gabon Officer Schools: France"
