 COLDWAR_FRA2_senegal_defence_france_desc:0 "Renegotiate training and access under explicit Senegalese consent. The security arrangement preserves a defence option but commits both governments to continuing costs."
 COLDWAR_FRA2_senegal_defence_recipient_heading:0 "[SEN.GetName]"
 COLDWAR_FRA2_service_review:0 "Conscription Reform"
 COLDWAR_FRA2_service_review_desc:0 "Decide how conscription should fit a force expected to defend Europe and operate overseas. A broader citizen reserve and a smaller professional core make different claims on the state."
