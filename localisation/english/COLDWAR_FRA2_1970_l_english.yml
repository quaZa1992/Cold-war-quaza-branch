 COLDWAR_FRA2_air_programme:0 "Combat Aircraft"
 COLDWAR_FRA2_air_programme_desc:0 "French air power depends on continuing design, testing and production. A national aircraft line and cooperative development answer different operational and industrial needs."
 COLDWAR_FRA2_airbus:0 "Airbus Partnership"
 COLDWAR_FRA2_airbus_GER:0 "Airbus Partnership: Federal Republic of Germany"
 COLDWAR_FRA2_airbus_GER_desc:0 "France and West Germany already committed to the A300 in 1969. Continue the national work share and industrial capacity through a renewed funding agreement, with both governments deciding whether to accept the new terms."
 COLDWAR_FRA2_airbus_desc:0 "France and West Germany already committed to the A300 in 1969. Continue the national work share and industrial capacity through a renewed funding agreement, with both governments deciding whether to accept the new terms."
 COLDWAR_FRA2_airbus_france:0 "Airbus Partnership: France"
 COLDWAR_FRA2_airbus_france_desc:0 "France and West Germany already committed to the A300 in 1969. Continue the national work share and industrial capacity through a renewed funding agreement, with both governments deciding whether to accept the new terms."
 COLDWAR_FRA2_airbus_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_algeria_energy:0 "Algerian Energy"
 COLDWAR_FRA2_algeria_energy_ALG:0 "Algerian Energy: Algeria"
 COLDWAR_FRA2_algeria_energy_ALG_desc:0 "Renegotiate energy and industrial cooperation under Algerian sovereignty. The 1965 framework offers a starting point, while development priorities and future returns require mutual agreement."
 COLDWAR_FRA2_algeria_energy_active_tt:0 "France and Algeria must both have the active Algerian Energy and Industrial Cooperation agreement."
 COLDWAR_FRA2_algeria_energy_desc:0 "Renegotiate energy and industrial cooperation under Algerian sovereignty. The 1965 framework offers a starting point, while development priorities and future returns require mutual agreement."
