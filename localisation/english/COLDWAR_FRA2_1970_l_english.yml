 COLDWAR_FRA2_rhine:0 "Rhine Industry Pact"
 COLDWAR_FRA2_rhine_GER:0 "Rhine Industry Pact: Federal Republic of Germany"
 COLDWAR_FRA2_rhine_GER_desc:0 "Link industrial conversion and technical training across neighbouring regions. Franco-German cooperation shares the cost of modernisation rather than assigning construction on foreign territory unilaterally."
 COLDWAR_FRA2_rhine_desc:0 "Link industrial conversion and technical training across the Rhine. Joint investment can renew neighbouring production centres and share specialist expertise, while French and German institutions must agree how to divide costs and responsibilities."
 COLDWAR_FRA2_rhine_france:0 "Rhine Industry Pact: France"
 COLDWAR_FRA2_rhine_france_desc:0 "Link industrial conversion and technical training across neighbouring regions. Franco-German cooperation shares the cost of modernisation rather than assigning construction on foreign territory unilaterally."
 COLDWAR_FRA2_rhine_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_ri_export_finance:0 "Export Finance"
 COLDWAR_FRA2_ri_export_finance_desc:0 "Concentrate commercial finance and export certification in the Paris region and Provence. Stronger international business can broaden taxable returns, but maintaining specialised financial and technical staff raises the education bill."
 COLDWAR_FRA2_ri_programme:0 "Liberal Republicans Programme"
 COLDWAR_FRA2_ri_programme_desc:0 "The Independent Republicans pursue administrative reform, private initiative and responsible public credit."
 COLDWAR_FRA2_ri_sme_capital:0 "SME Risk Capital"
 COLDWAR_FRA2_ri_sme_capital_desc:0 "Direct long-term credit toward independent suppliers in Aquitaine and a business-support office in Bourgogne. Smaller firms gain productive capacity and technical advice, while public guarantees and tax concessions reduce the revenue retained by the state."
 COLDWAR_FRA2_right_programme:0 "Shopkeepers and the National Right Programme"
 COLDWAR_FRA2_right_programme_desc:0 "The national right and independent traders pursue protection, tax relief and a stronger central state."
 COLDWAR_FRA2_rural_services:0 "Rural Services"
 COLDWAR_FRA2_rural_services_desc:0 "Sustain cooperative services and smaller farms so rural communities remain viable. The policy protects local employment, while accepting slower concentration and lower economies of scale."
 COLDWAR_FRA2_secular_school:0 "The Secular School"
 COLDWAR_FRA2_secular_school_desc:0 "Strengthen the common public school and technical routes beyond the grandes ecoles. Wider access can reduce inherited barriers, but it depends on sustained funding and trained teachers."
 COLDWAR_FRA2_self_management:0 "Worker Self-Rule"
 COLDWAR_FRA2_self_management_desc:0 "Allocate the investment fund to a worker-managed factory and its coordinating office in Bourgogne. Enterprise councils gain a practical productive base, while preferential treatment for cooperative finance reduces corporate tax receipts."
 COLDWAR_FRA2_senegal_civil:0 "Senegal Civil Ties"
 COLDWAR_FRA2_senegal_civil_SEN:0 "Senegal Civil Ties: Senegal"
 COLDWAR_FRA2_senegal_civil_SEN_desc:0 "Offer Senegal a civilian partnership in public services and development. Dakar can choose this course instead of a relationship centred on French military presence."
 COLDWAR_FRA2_senegal_civil_desc:0 "Offer Senegal a civilian partnership in public services and development. Dakar can choose this course instead of a relationship centred on French military presence."
 COLDWAR_FRA2_senegal_civil_france:0 "Senegal Civil Ties: France"
 COLDWAR_FRA2_senegal_civil_france_desc:0 "Offer Senegal a civilian partnership in public services and development. Dakar can choose this course instead of a relationship centred on French military presence."
 COLDWAR_FRA2_senegal_civil_recipient_heading:0 "[SEN.GetName]"
 COLDWAR_FRA2_senegal_defence:0 "Senegal Defence"
 COLDWAR_FRA2_senegal_defence_SEN:0 "Senegal Defence: Senegal"
 COLDWAR_FRA2_senegal_defence_SEN_desc:0 "Renegotiate training and access under explicit Senegalese consent. The security arrangement preserves a defence option but commits both governments to continuing costs."
 COLDWAR_FRA2_senegal_defence_desc:0 "Renegotiate training and access under explicit Senegalese consent. The security arrangement preserves a defence option but commits both governments to continuing costs."
