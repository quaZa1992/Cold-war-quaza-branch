 COLDWAR_FRA2_atlantic_liberal:0 "Atlantic Trade"
 COLDWAR_FRA2_atlantic_liberal_desc:0 "Negotiate licensing, technical support and export access with American electronics firms. Faster access to expertise and stronger service output require continuing licensing and technical support expenditure."
 COLDWAR_FRA2_atlantic_liberal_recipient_heading:0 "[USA.GetName]"
 COLDWAR_FRA2_atlantic_security:0 "Atlantic Security"
 COLDWAR_FRA2_atlantic_security_desc:0 "Pool selected courses in navigation, engineering and maritime safety while preserving national command. The arrangement requires trained instructors and naval personnel on both sides."
 COLDWAR_FRA2_atlantic_security_external_requirement_2:0 "[ENG.GetName] is a member of NATO."
 COLDWAR_FRA2_atlantic_security_external_requirement_4:0 "[FRA.GetName] is a member of NATO."
 COLDWAR_FRA2_atlantic_security_recipient_heading:0 "[ENG.GetName]"
 COLDWAR_FRA2_atlantic_training:0 "Atlantic Training"
 COLDWAR_FRA2_atlantic_training_USA:0 "Atlantic Training: United States"
 COLDWAR_FRA2_atlantic_training_USA_desc:0 "Negotiate technical training and logistics cooperation with the United States. Better coordination requires permanent French liaison and training cadres, while forces remain outside NATO integrated command."
 COLDWAR_FRA2_atlantic_training_desc:0 "Negotiate technical training and logistics cooperation with the United States. Better coordination requires permanent French liaison and training cadres, while forces remain outside NATO integrated command."
 COLDWAR_FRA2_atlantic_training_france:0 "Atlantic Training: France"
 COLDWAR_FRA2_atlantic_training_france_desc:0 "Negotiate technical training and logistics cooperation with the United States. Better coordination requires permanent French liaison and training cadres, while forces remain outside NATO integrated command."
 COLDWAR_FRA2_atlantic_training_recipient_heading:0 "[USA.GetName]"
 COLDWAR_FRA2_balanced_forces:0 "Balanced Forces"
 COLDWAR_FRA2_balanced_forces_desc:0 "Retain the deterrent while giving deployable conventional forces a larger share of attention. A broader posture improves flexibility but cannot match every strategic priority at once."
 COLDWAR_FRA2_business:0 "Independent Firms"
 COLDWAR_FRA2_business_desc:0 "Open credit and public contracts to independent firms and professional services in Rhone-Alpes. A wider enterprise base strengthens local office activity, while tax concessions reduce the immediate return to the state."
 COLDWAR_FRA2_cdp_compromise:0 "Coalition Cooperation"
 COLDWAR_FRA2_cdp_compromise_desc:0 "Christian democrats can use coalition influence to secure practical reforms without adopting the full presidential programme. Cooperation gains access to government, but blurs their distance from the majority."
 COLDWAR_FRA2_centre_family_services:0 "Family Services"
 COLDWAR_FRA2_centre_family_services_desc:0 "Co-finance family-service offices in Bourgogne and local access works in Midi-Pyrenees. Practical childcare and neighbourhood provision strengthen the social-market settlement, while service staffing requires continuing public expenditure."
 COLDWAR_FRA2_centre_mutual_districts:0 "Mutual Districts"
 COLDWAR_FRA2_centre_mutual_districts_desc:0 "Organise local mutual-insurance administration around a Rhone-Alpes service office. Coordinated purchasing and claims can lower health expenditure, at the cost of tax concessions supporting the participating schemes."
 COLDWAR_FRA2_centre_programme:0 "Christian Democratic Programme"
 COLDWAR_FRA2_centre_programme_desc:0 "The Democratic Centre combines market enterprise, social provision and parliamentary influence."
 COLDWAR_FRA2_centrist_covenant:0 "Local Social Compact"
 COLDWAR_FRA2_centrist_covenant_desc:0 "Bring local elected representatives, mutual organisations and reformist deputies into a governing compact. A regional service office gives their negotiations practical support, while the government accepts a continuing commitment to local social provision."
 COLDWAR_FRA2_champion_model:0 "Industrial Champions"
 COLDWAR_FRA2_champion_model_desc:0 "Concentrate industrial investment in major productive groups, with factories in Normandie and Hauts-de-France. Coordinated projects can achieve scale, but require continuing public administration."
 COLDWAR_FRA2_cid_cooperatives:0 "Shopkeepers' Credit"
 COLDWAR_FRA2_cid_cooperatives_desc:0 "Give independent traders shared purchasing and credit offices. Cooperation can lower the barriers faced by small firms, while preferential fiscal treatment for the network reduces corporate tax receipts."
 COLDWAR_FRA2_cid_rural_networks:0 "Rural Shop Grants"
 COLDWAR_FRA2_cid_rural_networks_desc:0 "Support rural processing, regular markets and distribution through a Loire agricultural district and Midi-Pyrenees access works. The network assists farming communities but requires continuing local-service support."
 COLDWAR_FRA2_cid_tax:0 "Traders' Tax Revolt"
 COLDWAR_FRA2_cid_tax_desc:0 "Gerard Nicoud's Committee of Information and Defence challenges the tax and social-charge burden on independent traders and artisans. Relief can protect small firms, but shifts revenue needs onto the wider public budget."
 COLDWAR_FRA2_cid_wholesale_cooperatives:0 "Mutual Purchasing"
 COLDWAR_FRA2_cid_wholesale_cooperatives_desc:0 "Pool independent traders' purchasing, accounts and equipment advice through an Aquitaine office. Collective scale can help small firms, while preferential terms reduce corporate-tax receipts."
 COLDWAR_FRA2_citizen_army:0 "Citizen Army Training"
 COLDWAR_FRA2_citizen_army_desc:0 "Improve reserve organisation and useful training for conscripts. Wider territorial readiness strengthens national resilience but requires a longer and more expensive training establishment."
 COLDWAR_FRA2_citizen_defence:0 "Citizen Defence"
 COLDWAR_FRA2_citizen_defence_desc:0 "Organise popular defence around trained citizens, economical supply and a domestic equipment workshop. Maintaining an armed citizenry requires instructors and personnel spending, while a production site supplies its material foundation."
 COLDWAR_FRA2_civic_settlement:0 "Civic Settlement"
 COLDWAR_FRA2_civic_settlement_desc:0 "Complete the housing and recognition settlement while rebuilding trust in constitutional institutions. National reconciliation and civic oversight address the remaining administrative and stability costs."
 COLDWAR_FRA2_civil_liberties:0 "Equal Citizenship"
 COLDWAR_FRA2_civil_liberties_desc:0 "Extend civil rights and remove legal barriers facing women and younger citizens. Equal citizenship strengthens the Republic, while implementation requires continuing legal and social provision."
 COLDWAR_FRA2_civilian_republic:0 "Civilian Social State"
 COLDWAR_FRA2_civilian_republic_desc:0 "Expand civilian services in Bourgogne and Bretagne. Public investment supports a social republic, while the military sector receives a smaller share of economic and political attention."
 COLDWAR_FRA2_common_programme:0 "Common Programme"
 COLDWAR_FRA2_common_programme_desc:0 "Bind the democratic left to a programme of public enterprise, social rights and economic planning. Establish a planning and coordination office to translate the agreement into investment decisions, while its social commitments place lasting demands on the budget."
 COLDWAR_FRA2_communist_settlement:0 "Public Service Plan"
 COLDWAR_FRA2_communist_settlement_desc:0 "Coordinate public enterprises and local services through an industrial-region service office. The programme can consolidate working-class support, while maintaining wider social provision requires an enduring budget commitment."
 COLDWAR_FRA2_community_entry:0 "EEC Cooperation"
 COLDWAR_FRA2_community_entry_desc:0 "Use the European Communities to shape enlargement and common policy. France acts through existing institutions, where membership rights and the interests of other governments still matter."
 COLDWAR_FRA2_community_negotiations:0 "Community Enlargement and Institutional Negotiations"
 COLDWAR_FRA2_community_negotiations_desc:0 "Use the Community's established procedures to pursue enlargement and institutional reform. Membership and treaty decisions remain subject to their existing votes."
 COLDWAR_FRA2_community_negotiations_timed:0 "Community Enlargement and Institutional Negotiations"
 COLDWAR_FRA2_community_negotiations_timed_desc:0 "A temporary national programme applies these policy changes for the stated duration."
 COLDWAR_FRA2_competitiveness_ps:0 "Productive Compact"
 COLDWAR_FRA2_competitiveness_ps_desc:0 "Combine industrial renewal in Hauts-de-France with technical and commercial services in Alsace-Lorraine. Investment provides practical capacity, while maintaining the necessary skills requires higher education spending."
 COLDWAR_FRA2_concorde:0 "Concorde"
 COLDWAR_FRA2_concorde_ENG:0 "Concorde: United Kingdom"
 COLDWAR_FRA2_concorde_ENG_desc:0 "Deepen the Anglo-French supersonic programme. Prestige and advanced engineering support the partnership, while fuel use and uncertain demand threaten its commercial future."
 COLDWAR_FRA2_concorde_desc:0 "Deepen the Anglo-French supersonic programme. Prestige and advanced engineering support the partnership, while fuel use and uncertain demand threaten its commercial future."
 COLDWAR_FRA2_concorde_france:0 "Concorde: France"
 COLDWAR_FRA2_concorde_france_desc:0 "Deepen the Anglo-French supersonic programme. Prestige and advanced engineering support the partnership, while fuel use and uncertain demand threaten its commercial future."
 COLDWAR_FRA2_concorde_recipient_heading:0 "[ENG.GetName]"
 COLDWAR_FRA2_contract:0 "Social Settlement"
 COLDWAR_FRA2_contract_desc:0 "Anchor the social settlement in collective bargaining and an Alsace-Lorraine labour-services office. Cooperation improves industrial relations, while stronger guarantees enlarge continuing social expenditure."
 COLDWAR_FRA2_conversion:0 "Industrial Basins"
 COLDWAR_FRA2_conversion_desc:0 "Renew an industrial basin in Hauts-de-France with a funded civilian plant and technical retraining. The transition protects employment at the cost of continued social support."
 COLDWAR_FRA2_cooperation_weekly_expense_display_tt:0 ""
 COLDWAR_FRA2_cooperation_weekly_income_display_tt:0 ""
 COLDWAR_FRA2_credit_expansion:0 "Modernisation Credit"
 COLDWAR_FRA2_credit_expansion_desc:0 "Direct lower-cost credit toward modern equipment, housing and productive investment. Faster renewal supports growth, but the subsidy leaves the Treasury exposed if private projects underperform."
 COLDWAR_FRA2_ct_ben_advisers:0 "Cotonou Advisers"
 COLDWAR_FRA2_ct_ben_advisers_desc:0 "Offer a separate French advisory mission to Dahomey. Its government decides whether to accept the military training, access and financial commitments of this specific agreement."
 COLDWAR_FRA2_ct_ben_civil:0 "Hinvi Cooperatives"
 COLDWAR_FRA2_ct_ben_civil_BEN:0 "Hinvi Cooperatives: Dahomey"
 COLDWAR_FRA2_ct_ben_civil_BEN_desc:0 "Support the Hinvi palm cooperatives through SONADER, agricultural extension and processing expertise. French technical assistance and local investment can increase productive capacity, while cooperative management and export dependence remain difficult questions."
 COLDWAR_FRA2_ct_ben_civil_desc:0 "Support the Hinvi palm cooperatives through SONADER, agricultural extension and processing expertise. French technical assistance and local investment can increase productive capacity, while cooperative management and export dependence remain difficult questions."
 COLDWAR_FRA2_ct_ben_civil_france:0 "Hinvi Cooperatives: France"
 COLDWAR_FRA2_ct_ben_civil_france_desc:0 "Support the Hinvi palm cooperatives through SONADER, agricultural extension and processing expertise. French technical assistance and local investment can increase productive capacity, while cooperative management and export dependence remain difficult questions."
 COLDWAR_FRA2_ct_ben_civil_recipient_heading:0 "[BEN.GetName]"
 COLDWAR_FRA2_ct_ben_commercial:0 "Cotonou Civil Terms"
 COLDWAR_FRA2_ct_ben_commercial_desc:0 "Negotiate civilian administrative investment with the French satellite government in Dahomey. Local services expand under the existing factory contributions and the recipient pays its own agreed investment."
 COLDWAR_FRA2_ct_ben_contacts:0 "Cotonou Contacts"
 COLDWAR_FRA2_ct_ben_contacts_desc:0 "Establish a country programme for Dahomey through diplomatic contacts and local institutions. French preparation creates an opening for separately negotiated civilian and security agreements."
 COLDWAR_FRA2_ct_ben_coup:0 "Cotonou Operation"
 COLDWAR_FRA2_ct_ben_coup_desc:0 "Finance contacts among dissident officers and political opponents in Dahomey. Exposure can bring a failed coup or a civil war, while further French intervention remains a separate political and military commitment."
 COLDWAR_FRA2_ct_ben_security:0 "Cotonou Army Terms"
 COLDWAR_FRA2_ct_ben_security_desc:0 "Negotiate a separate military-capacity agreement with the French satellite government in Dahomey. Additional production and French support bring equipment and personnel obligations."
 COLDWAR_FRA2_ct_ben_ultimatum:0 "Cotonou Ultimatum"
 COLDWAR_FRA2_ct_ben_ultimatum_desc:0 "Present Dahomey alone with French satellite terms. Acceptance establishes a formal French satellite relationship; refusal leaves France to decide whether to enforce its demand through war."
 COLDWAR_FRA2_ct_bfa_advisers:0 "Volta Advisers"
 COLDWAR_FRA2_ct_bfa_advisers_desc:0 "Offer a separate French advisory mission to Upper Volta. Its government decides whether to accept the military training, access and financial commitments of this specific agreement."
 COLDWAR_FRA2_ct_bfa_civil:0 "Volta Cotton Roads"
 COLDWAR_FRA2_ct_bfa_civil_BFA:0 "Volta Cotton Roads: Upper Volta"
 COLDWAR_FRA2_ct_bfa_civil_BFA_desc:0 "Extend the southwestern cotton programme with agronomy and access to rural markets. French assistance can support local production, but purchased inputs and reliance on a single export crop increase exposure to external demand."
 COLDWAR_FRA2_ct_bfa_civil_desc:0 "Extend the southwestern cotton programme with agronomy and access to rural markets. French assistance can support local production, but purchased inputs and reliance on a single export crop increase exposure to external demand."
