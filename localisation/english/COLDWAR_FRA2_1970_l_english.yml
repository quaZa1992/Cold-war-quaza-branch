 COLDWAR_FRA2_ct_car_civil:0 "Bangui Laboratories"
 COLDWAR_FRA2_ct_car_civil_CAR:0 "Bangui Laboratories: Central African Republic"
 COLDWAR_FRA2_ct_car_civil_CAR_desc:0 "The Institut Pasteur in Bangui gives scientific cooperation an established local base. Equip its laboratories and organise exchanges with French researchers, while supporting the specialist teaching on which the institute depends. Concentrating expertise in the capital leaves a wider task of reaching the country's communities."
