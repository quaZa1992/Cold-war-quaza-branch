 COLDWAR_FRA2_pressure_response_category:0 "French Procurement Charter Responses"
 COLDWAR_FRA2_pressure_response_category_desc:0 "Review and answer pending French procurement ultimatums."
 COLDWAR_FRA2_pressure_send_CAM:0 "Demand Cameroon's Procurement Charter"
 COLDWAR_FRA2_pressure_send_CAM_desc:0 "France uses its existing leverage through Central Franc Services: Cameroon to demand a permanent procurement charter. Paris requires an answer within 30 days. Refusal brings a 90-day crisis and pauses France-paid cash support for 180 days where such payments exist."
 COLDWAR_FRA2_pressure_send_CDI:0 "Demand Côte d'Ivoire's Procurement Charter"
 COLDWAR_FRA2_pressure_send_CDI_desc:0 "France uses its existing leverage through Abidjan Transit Mission: Cote d'Ivoire to demand a permanent procurement charter. Paris requires an answer within 30 days. Refusal brings a 90-day crisis and pauses France-paid cash support for 180 days where such payments exist."
 COLDWAR_FRA2_pressure_send_CHA:0 "Demand Chad's Procurement Charter"
 COLDWAR_FRA2_pressure_send_CHA_desc:0 "France uses its existing leverage through Chadian Airlift Mission: Chad to demand a permanent procurement charter. Paris requires an answer within 30 days. Refusal brings a 90-day crisis and pauses France-paid cash support for 180 days where such payments exist."
 COLDWAR_FRA2_pressure_send_GAB:0 "Demand Gabon's Procurement Charter"
 COLDWAR_FRA2_pressure_send_GAB_desc:0 "France uses its existing leverage through Gabon Oil Services: Gabon, Libreville Station: Gabon to demand a permanent procurement charter. Paris requires an answer within 30 days. Refusal brings a 90-day crisis and pauses France-paid cash support for 180 days where such payments exist."
 COLDWAR_FRA2_pressure_send_NGR:0 "Demand Niger's Procurement Charter"
 COLDWAR_FRA2_pressure_send_NGR_desc:0 "France uses its existing leverage through Uranium Investment Rights: Niger to demand a permanent procurement charter. Paris requires an answer within 30 days. Refusal brings a 90-day crisis and pauses France-paid cash support for 180 days where such payments exist."
 COLDWAR_FRA2_pressure_send_SEN:0 "Demand Senegal's Procurement Charter"
 COLDWAR_FRA2_pressure_send_SEN_desc:0 "France uses its existing leverage through Dakar Clearing Services: Senegal to demand a permanent procurement charter. Paris requires an answer within 30 days. Refusal brings a 90-day crisis and pauses France-paid cash support for 180 days where such payments exist."
 COLDWAR_FRA2_pressure_send_category:0 "French Procurement Ultimatums"
 COLDWAR_FRA2_pressure_send_category_desc:0 "Present negotiated procurement charters to governments tied to active French agreements."
 COLDWAR_FRA2_pressure_send_cost_35_pp:0 "35 £pol_power"
 COLDWAR_FRA2_pressure_send_requirement_CAM:0 "At least one agreement must remain active: Central Franc Services: Cameroon. Relations must be peaceful and the 365-day ultimatum interval must have elapsed."
 COLDWAR_FRA2_pressure_send_requirement_CDI:0 "At least one agreement must remain active: Abidjan Transit Mission: Cote d'Ivoire. Relations must be peaceful and the 365-day ultimatum interval must have elapsed."
 COLDWAR_FRA2_pressure_send_requirement_CHA:0 "At least one agreement must remain active: Chadian Airlift Mission: Chad. Relations must be peaceful and the 365-day ultimatum interval must have elapsed."
 COLDWAR_FRA2_pressure_send_requirement_GAB:0 "At least one agreement must remain active: Gabon Oil Services: Gabon or Libreville Station: Gabon. Relations must be peaceful and the 365-day ultimatum interval must have elapsed."
 COLDWAR_FRA2_pressure_send_requirement_NGR:0 "At least one agreement must remain active: Uranium Investment Rights: Niger. Relations must be peaceful and the 365-day ultimatum interval must have elapsed."
 COLDWAR_FRA2_pressure_send_requirement_SEN:0 "At least one agreement must remain active: Dakar Clearing Services: Senegal. Relations must be peaceful and the 365-day ultimatum interval must have elapsed."
 COLDWAR_FRA2_pressure_withdrawal_crisis:0 "Withdrawal of French Support"
 COLDWAR_FRA2_pressure_withdrawal_crisis_desc:0 "French advisers, funding, and contractors are withdrawn after the procurement ultimatum is refused."
 COLDWAR_FRA2_professional_core:0 "Professional Forces"
 COLDWAR_FRA2_professional_core_desc:0 "Build a smaller, high-readiness force for demanding deployments. Professional experience improves immediate capability, with a higher wage and support bill."
 COLDWAR_FRA2_progress:0 "Social Renewal"
 COLDWAR_FRA2_progress_desc:0 "Give the New Society programme a practical administrative and service base in the Paris region. Social consultation needs institutions and staff, and enlarges the cost of government."
 COLDWAR_FRA2_ps_basin_conversion:0 "Basin Conversion"
 COLDWAR_FRA2_ps_basin_conversion_desc:0 "Rebuild productive capacity in Hauts-de-France and improve connecting infrastructure in Normandie. Industrial conversion offers tangible employment sites, while retraining and transitional support enlarge the social budget."
 COLDWAR_FRA2_ps_conversion_boards:0 "Conversion Boards"
 COLDWAR_FRA2_ps_conversion_boards_desc:0 "Authorise regional boards to commission an industrial-renewal project. Prepared sites and technical studies support the Regional Conversion Fund when a separate project budget is committed."
 COLDWAR_FRA2_ps_programme:0 "Socialist Party Programme"
 COLDWAR_FRA2_ps_programme_desc:0 "The Socialist Party rebuilds its organisation and debates how to combine social rights, ownership and European commitments."
 COLDWAR_FRA2_ps_workplace_charters:0 "Workplace Charters"
 COLDWAR_FRA2_ps_workplace_charters_desc:0 "Equip workplace-information and prevention services in Rhone-Alpes and Alsace-Lorraine. Stronger consultation can reduce health costs, but compulsory review gives investment decisions a longer timetable."
 COLDWAR_FRA2_psu_cooperative_exchange:0 "Cooperative Pact"
 COLDWAR_FRA2_psu_cooperative_exchange_desc:0 "Exchange enterprise experience and applied industrial expertise with Yugoslav partners. Both countries fund training, while French cooperatives accept commercial discipline and Yugoslav institutions commit skilled staff."
 COLDWAR_FRA2_psu_cooperative_exchange_recipient_heading:0 "[SER.GetName]"
 COLDWAR_FRA2_psu_cooperative_markets:0 "Cooperative Markets"
 COLDWAR_FRA2_psu_cooperative_markets_desc:0 "Give worker-managed enterprises a shared Aquitaine sales and accounting office. A market-facing federation can spread practical experience, but preferential finance and retained earnings reduce tax receipts."
 COLDWAR_FRA2_psu_land_banks:0 "Cooperative Land"
 COLDWAR_FRA2_psu_land_banks_desc:0 "Create a Bourgogne land-credit office and prepare serviced sites in Aquitaine for cooperative enterprise and community facilities. Below-market terms broaden access, while reducing the taxable returns captured from development."
 COLDWAR_FRA2_psu_programme:0 "Unified Socialist Party Programme"
 COLDWAR_FRA2_psu_programme_desc:0 "The Unified Socialist Party develops local participation, independent unions and civilian public services."
 COLDWAR_FRA2_psu_tenants_councils:0 "Tenants' Councils"
 COLDWAR_FRA2_psu_tenants_councils_desc:0 "Let residents and service users share responsibility for a Bretagne neighbourhood office and access works in Pays de la Loire. Local participation receives concrete institutions, alongside a lasting public-service commitment."
 COLDWAR_FRA2_psu_union_institutes:0 "Union Institutes"
 COLDWAR_FRA2_psu_union_institutes_desc:0 "Build bargaining and technical institutes for independent unions. A domestic network can serve workplaces without relying on a foreign agreement, but requires public funding and employer concessions."
 COLDWAR_FRA2_public_banks:0 "Public Bank Credit"
 COLDWAR_FRA2_public_banks_desc:0 "Use public banks to expand credit offices in Paris and Hauts-de-France. Regional investment gains an institutional base, while public administration must supervise the lending commitments."
 COLDWAR_FRA2_public_combine:0 "Public Combines"
 COLDWAR_FRA2_public_combine_desc:0 "Coordinate credit and procurement through public industrial groups, funding civilian capacity in Alsace-Lorraine and an armament programme in the north. Concentration supports scale but can slow adaptation and enlarge the planning apparatus."
 COLDWAR_FRA2_public_credit:0 "Credit Guarantees"
 COLDWAR_FRA2_public_credit_desc:0 "Retain public guarantees for major investment while requiring transparent commercial accounts. Credit can reach projects that private lenders avoid, but the state accepts their financial risk."
 COLDWAR_FRA2_public_service:0 "A State Within Reach"
 COLDWAR_FRA2_public_service_desc:0 "Pompidou's government inherited a central administration shaped by prefects and powerful ministries. Better local services can make that authority more useful to citizens while preserving the elected role of communes."
 COLDWAR_FRA2_radical_civic_service:0 "Civil Service Trials"
 COLDWAR_FRA2_radical_civic_service_desc:0 "Pilot civilian technical service through a Loire office and public works in Auvergne. Young participants gain practical skills outside the barracks, while a smaller pool of continuously trained recruits lengthens army training."
 COLDWAR_FRA2_radical_enterprise:0 "Private Innovation"
 COLDWAR_FRA2_radical_enterprise_desc:0 "Support private industrial investment in Aquitaine and technical services in the Paris region. Enterprise gains room to expand, while public credit and tax concessions put part of the risk on the state."
 COLDWAR_FRA2_radical_open_orders:0 "Open Public Orders"
 COLDWAR_FRA2_radical_open_orders_desc:0 "Open public procurement to new producers rather than reserve orders for established groups. An Aquitaine production site and technical studies widen the supplier base, while incumbents resist and concessions reduce corporate-tax receipts."
 COLDWAR_FRA2_radical_programme:0 "Radical Republicans Programme"
 COLDWAR_FRA2_radical_programme_desc:0 "The Radical Republicans defend secular institutions, civic equality and practical local development."
 COLDWAR_FRA2_recipient_agreements_category:0 "Bilateral Programme Proposals"
 COLDWAR_FRA2_recipient_agreements_category_desc:0 "Review and answer fixed-partner programme proposals."
 COLDWAR_FRA2_redistribution:0 "Household Demand"
 COLDWAR_FRA2_redistribution_desc:0 "Raise household purchasing power and expand public employment to sustain domestic demand. The policy broadens social gains, while its tax and wage effects challenge fiscal balance and export competitiveness."
 COLDWAR_FRA2_regional_councils:0 "Regional Councils"
 COLDWAR_FRA2_regional_councils_desc:0 "Give elected regional councils resources to shape local investment. Decisions closer to residents gain legitimacy, while Paris gives up some control over the timing and direction of development."
 COLDWAR_FRA2_regional_industry:0 "Regional Industry"
 COLDWAR_FRA2_regional_industry_desc:0 "Pair industrial renewal in Hauts-de-France with port and commercial facilities in Provence. Regional development spreads investment, while local services add continuing social costs."
 COLDWAR_FRA2_regional_links:0 "Regional Links"
 COLDWAR_FRA2_regional_links_desc:0 "Connect regional producers with ports, railways and industrial markets. Better access can spread employment beyond established centres, but transport investment competes with other public projects."
 COLDWAR_FRA2_regions:0 "Uneven Modernisation"
 COLDWAR_FRA2_regions_desc:0 "Competitive firms and ambitious public projects coexist with crowded cities, remote rural communities and vulnerable industrial districts."
 COLDWAR_FRA2_reissue_airbus:0 "Renew the proposal to Federal Republic of Germany"
 COLDWAR_FRA2_reissue_airbus_desc:0 "Send a fresh proposal for Airbus Partnership to Federal Republic of Germany. The terms are unchanged and require the recipient's consent."
 COLDWAR_FRA2_reissue_algeria_energy:0 "Renew the proposal to Algeria"
 COLDWAR_FRA2_reissue_algeria_energy_desc:0 "Send a fresh proposal for Algerian Energy to Algeria. The terms are unchanged and require the recipient's consent."
 COLDWAR_FRA2_reissue_algeria_training:0 "Renew the proposal to Algeria"
 COLDWAR_FRA2_reissue_algeria_training_desc:0 "Send a fresh proposal for Algerian Institutes to Algeria. The terms are unchanged and require the recipient's consent."
 COLDWAR_FRA2_reissue_ariane:0 "Renew the proposal to Federal Republic of Germany"
 COLDWAR_FRA2_reissue_ariane_desc:0 "Send a fresh proposal for A European Launcher to Federal Republic of Germany. The terms are unchanged and require the recipient's consent."
 COLDWAR_FRA2_reissue_atlantic_liberal:0 "Renew the proposal to United States"
 COLDWAR_FRA2_reissue_atlantic_liberal_desc:0 "Send a fresh proposal for Atlantic Trade to United States. The terms are unchanged and require the recipient's consent."
 COLDWAR_FRA2_reissue_atlantic_security:0 "Renew the proposal to United Kingdom"
 COLDWAR_FRA2_reissue_atlantic_security_desc:0 "Send a fresh proposal for Atlantic Security to United Kingdom. The terms are unchanged and require the recipient's consent."
 COLDWAR_FRA2_reissue_atlantic_training:0 "Renew the proposal to United States"
 COLDWAR_FRA2_reissue_atlantic_training_desc:0 "Send a fresh proposal for Atlantic Training to United States. The terms are unchanged and require the recipient's consent."
 COLDWAR_FRA2_reissue_category:0 "Renew Bilateral Proposals"
 COLDWAR_FRA2_reissue_category_desc:0 "Renew proposals to their original named partners after the waiting period."
 COLDWAR_FRA2_reissue_concorde:0 "Renew the proposal to United Kingdom"
 COLDWAR_FRA2_reissue_concorde_desc:0 "Send a fresh proposal for Concorde to United Kingdom. The terms are unchanged and require the recipient's consent."
 COLDWAR_FRA2_reissue_ecological_industry:0 "Renew the proposal to Federal Republic of Germany"
 COLDWAR_FRA2_reissue_ecological_industry_desc:0 "Send a fresh proposal for Industrial Conversion to Federal Republic of Germany. The terms are unchanged and require the recipient's consent."
 COLDWAR_FRA2_reissue_europe_liberal:0 "Renew the proposal to Federal Republic of Germany"
 COLDWAR_FRA2_reissue_europe_liberal_desc:0 "Send a fresh proposal for European Market to Federal Republic of Germany. The terms are unchanged and require the recipient's consent."
 COLDWAR_FRA2_reissue_europe_restraint:0 "Renew the proposal to Federal Republic of Germany"
