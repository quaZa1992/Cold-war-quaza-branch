 COLDWAR_FRA2_africa_central_programme_desc:0 "Individual French relations with named sovereign governments."
 COLDWAR_FRA2_africa_sahel_programme:0 "Sahel Relations Programme"
 COLDWAR_FRA2_africa_sahel_programme_desc:0 "Individual French relations with named sovereign governments."
 COLDWAR_FRA2_africa_strategy_programme:0 "African Networks and Intervention Programme"
