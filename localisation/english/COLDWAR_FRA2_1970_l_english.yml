 COLDWAR_FRA2_jaguar:0 "Jaguar Partnership"
 COLDWAR_FRA2_jaguar_ENG:0 "Jaguar Partnership: United Kingdom"
 COLDWAR_FRA2_jaguar_ENG_desc:0 "Renew Anglo-French cooperation around the Jaguar precedent. Common development and training can serve both air forces, while each government retains control of its own commitments."
 COLDWAR_FRA2_jaguar_desc:0 "Renew Anglo-French cooperation around the Jaguar precedent. Common development and training can serve both air forces, while each government retains control of its own commitments."
 COLDWAR_FRA2_jaguar_doctrine:0 "Jaguar Air Doctrine"
 COLDWAR_FRA2_jaguar_doctrine_desc:0 "Build training around the Anglo-French Jaguar and common operating standards. Joint instruction improves aircrew preparation and fuel discipline, but requires permanent instructor posts and specialist ground crews."
 COLDWAR_FRA2_jaguar_france:0 "Jaguar Partnership: France"
 COLDWAR_FRA2_jaguar_france_desc:0 "Renew Anglo-French cooperation around the Jaguar precedent. Common development and training can serve both air forces, while each government retains control of its own commitments."
 COLDWAR_FRA2_jaguar_recipient_heading:0 "[ENG.GetName]"
 COLDWAR_FRA2_land_procurement:0 "Armour Procurement"
 COLDWAR_FRA2_land_procurement_desc:0 "Choose the industrial basis of future land equipment. A national platform preserves French design authority; common components can lower costs if partners agree."
 COLDWAR_FRA2_land_stewardship:0 "Rural Stewardship"
 COLDWAR_FRA2_land_stewardship_desc:0 "Support rural services and farming that relies less on purchased industrial inputs. Smaller holdings and local employment gain support, though yields may grow more slowly."
 COLDWAR_FRA2_left_radicals:0 "Republican Left"
 COLDWAR_FRA2_left_radicals_desc:0 "Link secular reform with municipal services and rural cooperation. Fund local administration and an agricultural cooperative district so smaller communities share in development, accepting the public-service commitments of a broader social programme."
 COLDWAR_FRA2_liberal_state:0 "Modern Liberal State"
 COLDWAR_FRA2_liberal_state_desc:0 "Giscard's Independent Republicans favour administrative competence and room for private initiative. Reform can widen enterprise while placing limits on established public privileges and discretionary state support."
 COLDWAR_FRA2_local_generation:0 "Regional Hydropower"
 COLDWAR_FRA2_local_generation_desc:0 "Finance a regional hydroelectric programme and its engineering base in the Rhone basin. Distributed supply can reduce reliance on imported fuel, while construction, environmental assessment and specialist training require substantial public resources."
 COLDWAR_FRA2_local_sufficiency:0 "Local Sufficiency"
 COLDWAR_FRA2_local_sufficiency_desc:0 "Develop municipal heat networks and local energy engineering with Austrian partners. France prioritises regional services over heavy throughput; Austria funds efficient generation and technical exchange."
 COLDWAR_FRA2_local_sufficiency_recipient_heading:0 "[AUS.GetName]"
 COLDWAR_FRA2_logistics:0 "Joint Logistics"
 COLDWAR_FRA2_logistics_desc:0 "Standardise support across the services so readiness survives deployment. Common routines improve supply, but require a permanent maintenance organisation."
 COLDWAR_FRA2_management:0 "Managerial Autonomy"
 COLDWAR_FRA2_management_desc:0 "Give professional managers greater freedom and support a Paris-region business and technical office. Firms retain more of the gains, while organised labour loses influence over investment decisions."
 COLDWAR_FRA2_mass_universities:0 "Mass Universities"
 COLDWAR_FRA2_mass_universities_desc:0 "Put the Faure reforms into practice and widen access to university study. More open institutions strengthen research and social mobility, but require a larger permanent education budget."
 COLDWAR_FRA2_memory:0 "Historical Recognition"
 COLDWAR_FRA2_memory_desc:0 "Veterans, harkis, repatriates and Algerian families carry distinct experiences of the war and its aftermath. Public recognition can make room for those histories, but it must be joined to practical support."
 COLDWAR_FRA2_mirage:0 "Mirage Design Line"
 COLDWAR_FRA2_mirage_desc:0 "Sustain Dassault's combat-aircraft design and export capability through prototype testing, tooling and aircrew training. A continuing engineering base supports future models, while specialist production raises procurement costs."
 COLDWAR_FRA2_modifier_army_org_factor_tt:0 "$MODIFIER_ARMY_ORG_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_FRA2_modifier_production_factory_efficiency_gain_factor_tt:0 "$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_FRA2_modifier_production_factory_max_efficiency_factor_tt:0 "$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_FRA2_modifier_production_speed_infrastructure_factor_tt:0 "$modifier_production_speed_infrastructure_factor$: $RIGHT|+=%1$"
 COLDWAR_FRA2_modifier_research_speed_factor_tt:0 "$MODIFIER_RESEARCH_SPEED_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_FRA2_motorways:0 "Regional Motorways"
 COLDWAR_FRA2_motorways_desc:0 "Extend road access to industrial towns and smaller centres. Flexible routes can support regional growth, while increasing the economy's dependence on imported motor fuel."
 COLDWAR_FRA2_municipal_france:0 "Municipal France"
 COLDWAR_FRA2_municipal_france_desc:0 "Aquitaine's market towns, cooperatives and local authorities can bring investment closer to producers. Offices and agricultural processing reinforce municipal services, while regional administration carries a continuing cost."
 COLDWAR_FRA2_municipal_socialism:0 "Municipal Socialism"
 COLDWAR_FRA2_municipal_socialism_desc:0 "Use municipal government to organise local services, improve access and extend practical provision to working households. A new service office and transport works turn electoral influence into public capacity, while operating commitments raise social spending."
 COLDWAR_FRA2_mutuals:0 "Social Insurance"
 COLDWAR_FRA2_mutuals_desc:0 "Mutual societies and local insurance funds already connect households to health and social provision. Strengthen their administrative capacity while sustaining the wider public contribution on which coverage depends."
 COLDWAR_FRA2_national_armour:0 "AMX National Design"
 COLDWAR_FRA2_national_armour_desc:0 "Sustain a national armoured design line and its testing base. Domestic production retains expertise and control, but costs more than pooled procurement."
 COLDWAR_FRA2_national_champions:0 "National Champions"
 COLDWAR_FRA2_national_champions_desc:0 "Support a productive site in Rhone-Alpes and engineering offices in Normandie. Large industrial groups can undertake national projects, but expect public support and favourable tax treatment."
 COLDWAR_FRA2_national_computers:0 "Computer Industry"
 COLDWAR_FRA2_national_computers_desc:0 "Back the domestic computer-systems industry and Grenoble's engineering base with a funded production site. Independent supply requires public orders and continuing fiscal concessions."
 COLDWAR_FRA2_nato_atlantic_fleet:0 "Atlantic Exercises"
 COLDWAR_FRA2_nato_atlantic_fleet_ENG:0 "Atlantic Exercises: United Kingdom"
 COLDWAR_FRA2_nato_atlantic_fleet_ENG_desc:0 "Offer Britain a funded programme of naval exercises and fleet-support training. Both governments retain freedom to decide whether to commit ships in a crisis."
 COLDWAR_FRA2_nato_atlantic_fleet_desc:0 "Offer Britain a funded programme of naval exercises and fleet-support training. Both governments retain freedom to decide whether to commit ships in a crisis."
 COLDWAR_FRA2_nato_atlantic_fleet_external_requirement_2:0 "[ENG.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_atlantic_fleet_external_requirement_4:0 "[FRA.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_atlantic_fleet_france:0 "Atlantic Exercises: France"
 COLDWAR_FRA2_nato_atlantic_fleet_france_desc:0 "Offer Britain a funded programme of naval exercises and fleet-support training. Both governments retain freedom to decide whether to commit ships in a crisis."
 COLDWAR_FRA2_nato_atlantic_fleet_recipient_heading:0 "[ENG.GetName]"
 COLDWAR_FRA2_nato_common_maintenance:0 "Shared Maintenance"
 COLDWAR_FRA2_nato_common_maintenance_desc:0 "Turn agreed land-equipment standards into training and support routines for French forces. The partnership provides experience while France funds its own personnel."
 COLDWAR_FRA2_nato_conditional_plan:0 "Joint Contingencies"
 COLDWAR_FRA2_nato_conditional_plan_desc:0 "Train national staffs to coordinate an agreed contingency while preserving France's decision on any military commitment. Reliable planning requires a continuing personnel allocation."
 COLDWAR_FRA2_nato_europe_land:0 "Land Standardisation"
 COLDWAR_FRA2_nato_europe_land_GER:0 "Land Standardisation: Federal Republic of Germany"
 COLDWAR_FRA2_nato_europe_land_GER_desc:0 "Offer West Germany a further programme for compatible land equipment and maintenance standards. Both countries can reduce support costs while financing technical work; no force passes to a new command."
 COLDWAR_FRA2_nato_europe_land_desc:0 "Offer West Germany a further programme for compatible land equipment and maintenance standards. Both countries can reduce support costs while financing technical work; no force passes to a new command."
 COLDWAR_FRA2_nato_europe_land_external_requirement_2:0 "[GER.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_europe_land_external_requirement_4:0 "[FRA.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_europe_land_france:0 "Land Standardisation: France"
 COLDWAR_FRA2_nato_europe_land_france_desc:0 "Offer West Germany a further programme for compatible land equipment and maintenance standards. Both countries can reduce support costs while financing technical work; no force passes to a new command."
 COLDWAR_FRA2_nato_europe_land_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_nato_europe_sea:0 "European Naval Pact"
 COLDWAR_FRA2_nato_europe_sea_ENG:0 "European Naval Pact: United Kingdom"
 COLDWAR_FRA2_nato_europe_sea_ENG_desc:0 "Offer Britain a European naval engineering and production partnership. Shared development supports both shipbuilding sectors and requires continuing public contributions."
 COLDWAR_FRA2_nato_europe_sea_desc:0 "Offer Britain a European naval engineering and production partnership. Shared development supports both shipbuilding sectors and requires continuing public contributions."
 COLDWAR_FRA2_nato_europe_sea_external_requirement_2:0 "[ENG.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_europe_sea_external_requirement_4:0 "[FRA.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_europe_sea_france:0 "European Naval Pact: France"
 COLDWAR_FRA2_nato_europe_sea_france_desc:0 "Offer Britain a European naval engineering and production partnership. Shared development supports both shipbuilding sectors and requires continuing public contributions."
 COLDWAR_FRA2_nato_europe_sea_recipient_heading:0 "[ENG.GetName]"
 COLDWAR_FRA2_nato_europe_staff:0 "Joint Naval Staffs"
 COLDWAR_FRA2_nato_europe_staff_desc:0 "Develop French naval doctrine through the agreed European industrial programme. Staff exchanges and technical analysis require permanent administrative support."
 COLDWAR_FRA2_nato_european:0 "A European Pillar"
 COLDWAR_FRA2_nato_european_desc:0 "Build European military cooperation through common technical work and professional training. Shared electronic research can support future equipment, while preparing liaison staff and specialist schools requires sustained education spending."
 COLDWAR_FRA2_nato_fleet_support:0 "Joint Fleet Support"
 COLDWAR_FRA2_nato_fleet_support_desc:0 "Apply agreed naval-exercise lessons to French fleet support. More efficient supply can improve routine readiness, but requires a larger trained support establishment."
 COLDWAR_FRA2_nato_independent:0 "An Independent Ally"
 COLDWAR_FRA2_nato_independent_desc:0 "Keep operational planning, procurement and the deterrent under French direction. National engineering teams can refine future equipment, while maintaining separate supply chains increases procurement costs."
 COLDWAR_FRA2_nato_land_design:0 "Armour Design"
 COLDWAR_FRA2_nato_land_design_desc:0 "Carry the national land programme through design, testing and engineering. French trials teams and military schools can improve the next generation of equipment and its employment, while retaining national procurement authority."
 COLDWAR_FRA2_nato_land_priority:0 "National Land Forces"
 COLDWAR_FRA2_nato_land_priority_desc:0 "Fund French land equipment and training for an independent continental contribution. Domestic capacity expands while the equipment estate becomes more expensive to maintain."
 COLDWAR_FRA2_nato_nuclear_consult:0 "Nuclear Consultation"
 COLDWAR_FRA2_nato_nuclear_consult_desc:0 "Consult allied specialists on warning, communications and nuclear policy while retaining national release authority. Shared technical work can help French research, but regular consultation constrains diplomatic freedom."
 COLDWAR_FRA2_nato_nuclear_veto:0 "National Nuclear Veto"
 COLDWAR_FRA2_nato_nuclear_veto_desc:0 "Fund an independent assessment and decision system for the force de frappe. National authority reinforces the Gaullist mandate, while France bears the support burden of its separate capability."
 COLDWAR_FRA2_nato_pragmatic:0 "Selective Cooperation"
 COLDWAR_FRA2_nato_pragmatic_desc:0 "Expand liaison, exercises and contingency preparation under French authority. Practical cooperation improves support without assigning forces automatically to allied command, at the cost of a larger coordination staff."
 COLDWAR_FRA2_nato_review:0 "France and NATO"
 COLDWAR_FRA2_nato_review_desc:0 "France remains in the Atlantic Treaty after withdrawing from NATO's integrated command in 1966. Pompidou can reaffirm national discretion, deepen conditional cooperation or strengthen Europe's contribution without transferring authority over the French deterrent."
 COLDWAR_FRA2_nato_rhine:0 "Rhine Field Exercises"
 COLDWAR_FRA2_nato_rhine_GER:0 "Rhine Field Exercises: Federal Republic of Germany"
 COLDWAR_FRA2_nato_rhine_GER_desc:0 "Offer West Germany an additional land-exercise programme alongside existing French forces in Germany. Each government retains control of its forces; the agreement creates neither new basing rights nor an automatic wartime commitment."
 COLDWAR_FRA2_nato_rhine_desc:0 "Offer West Germany an additional land-exercise programme alongside existing French forces in Germany. Each government retains control of its forces; the agreement creates neither new basing rights nor an automatic wartime commitment."
 COLDWAR_FRA2_nato_rhine_external_requirement_2:0 "[GER.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_rhine_external_requirement_4:0 "[FRA.GetName] is a member of NATO."
 COLDWAR_FRA2_nato_rhine_france:0 "Rhine Field Exercises: France"
 COLDWAR_FRA2_nato_rhine_france_desc:0 "Offer West Germany an additional land-exercise programme alongside existing French forces in Germany. Each government retains control of its forces; the agreement creates neither new basing rights nor an automatic wartime commitment."
 COLDWAR_FRA2_nato_rhine_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_nato_sea_design:0 "French Naval Design"
 COLDWAR_FRA2_nato_sea_design_desc:0 "Fund design offices, dockyard engineering and sea trials within French naval institutions. Sustained national expertise supports fleet renewal, while specialist facilities and testing compete for a limited naval budget."
 COLDWAR_FRA2_nato_sea_priority:0 "National Sea Power"
 COLDWAR_FRA2_nato_sea_priority_desc:0 "Direct the discretionary programme toward French naval construction and support. Greater shipyard capacity still requires crews, training and long-term maintenance."
 COLDWAR_FRA2_naval_review:0 "Naval Commitments"
 COLDWAR_FRA2_naval_review_desc:0 "Choose between distant oceanic presence and the routine work of escorting convoys, protecting approaches and maintaining the fleet."
 COLDWAR_FRA2_new_society:0 "Chaban's New Deal"
 COLDWAR_FRA2_new_society_desc:0 "Chaban-Delmas's New Society pairs administrative reform with broader workplace participation. Technical training and bargaining give the proposal material weight, while conservative Gaullists resist a lasting opening to organised labour."
 COLDWAR_FRA2_nov_advisory_pacts:0 "French Advisers"
 COLDWAR_FRA2_nov_advisory_pacts_desc:0 "Use training and maintenance agreements to establish an overt French security presence. The host decides whether to admit advisers."
 COLDWAR_FRA2_nov_africa_policy:0 "African Affairs"
 COLDWAR_FRA2_nov_africa_policy_desc:0 "Organise the presidency, diplomatic service and security establishment around a new African policy. Existing French connections make some operations cheaper; entering another power's sphere demands a much larger commitment."
 COLDWAR_FRA2_nov_barracuda:0 "Barracuda Plan"
 COLDWAR_FRA2_nov_barracuda_desc:0 "Prepare to replace a hostile government in Bangui and restore a reliable political partner. Such an intervention requires a breakdown in relations with the incumbent government."
 COLDWAR_FRA2_nov_chad_support:0 "Chad Contingency"
 COLDWAR_FRA2_nov_chad_support_desc:0 "French support operations in Chad, including Limousin and later Tacaud, provide the precedent for an intervention in support of an allied government."
 COLDWAR_FRA2_nov_client_admin:0 "Client Administration"
 COLDWAR_FRA2_nov_client_admin_desc:0 "Replace improvised expeditionary administration with permanent civilian coordination. The institutional investment eases part of the French military burden without removing the client's satellite obligations."
 COLDWAR_FRA2_nov_commercial_clients:0 "Commercial Clients"
 COLDWAR_FRA2_nov_commercial_clients_desc:0 "Prioritise commercial administration and local service capacity within the satellite network. Better institutions and the satellite factory contribution strengthen the economic relationship with France."
 COLDWAR_FRA2_nov_doi_moi:0 "Economic Opening"
 COLDWAR_FRA2_nov_doi_moi_desc:0 "Respond to Vietnamese economic reform with a renewed commercial and technical partnership. Investment can expand services and specialist training while leaving economic policy in Vietnamese hands."
 COLDWAR_FRA2_nov_forward_logistics:0 "Overseas Staging"
 COLDWAR_FRA2_nov_forward_logistics_desc:0 "Equip an expeditionary staging system before threatening intervention. New productive capacity is purchased in France, while overseas access still requires the relevant host agreement."
 COLDWAR_FRA2_nov_francophone_links:0 "Francophone Links"
 COLDWAR_FRA2_nov_francophone_links_desc:0 "Link universities and technical institutions through specialist exchanges and French-language education. The partnership must grow from the participating institutions and their actual teaching capacity."
 COLDWAR_FRA2_nov_fund_coup:0 "Fund a Coup"
 COLDWAR_FRA2_nov_fund_coup_desc:0 "Commit funds to a specific coup attempt. A successful government change creates a potential partner. A discovered failure gives France an immediate military pretext; a civil war must be lost by the French-backed side before it creates that pretext."
 COLDWAR_FRA2_nov_hanoi_science:0 "Hanoi Exchanges"
 COLDWAR_FRA2_nov_hanoi_science_VIE:0 "Hanoi Exchanges: North Vietnam"
 COLDWAR_FRA2_nov_hanoi_science_VIE_desc:0 "Negotiate cultural, scientific and technical cooperation with Hanoi. Joint investment can expand university exchanges, specialist training and applied research."
 COLDWAR_FRA2_nov_hanoi_science_desc:0 "Negotiate cultural, scientific and technical cooperation with Hanoi. Joint investment can expand university exchanges, specialist training and applied research."
 COLDWAR_FRA2_nov_hanoi_science_france:0 "Hanoi Exchanges: France"
 COLDWAR_FRA2_nov_hanoi_science_france_desc:0 "Negotiate cultural, scientific and technical cooperation with Hanoi. Joint investment can expand university exchanges, specialist training and applied research."
 COLDWAR_FRA2_nov_hanoi_science_recipient_heading:0 "[VIE.GetName]"
 COLDWAR_FRA2_nov_hanoi_subject:0 "Hanoi Ultimatum"
 COLDWAR_FRA2_nov_hanoi_subject_desc:0 "Demand a French satellite relationship with North Vietnam. Hanoi may accept French supremacy or refuse and face a military confrontation whose outcome remains uncertain."
 COLDWAR_FRA2_nov_indochina_command:0 "Expeditionary Force"
 COLDWAR_FRA2_nov_indochina_command_desc:0 "Support a sustained overseas force rather than a cheap colonial expedition. Military organisation improves, but the larger deployment consumes more supplies."
 COLDWAR_FRA2_nov_indochina_council:0 "Indochina Council"
 COLDWAR_FRA2_nov_indochina_council_desc:0 "Coordinate the administrations of French client states through an Indochinese council. Each participating government must approve its own investment and retain its existing satellite obligations."
 COLDWAR_FRA2_nov_indochina_policy:0 "France and Vietnam"
 COLDWAR_FRA2_nov_indochina_policy_desc:0 "France retains diplomatic contacts and a legacy of war in Indochina. Peace diplomacy and voluntary cooperation can advance together, while a renewed military presence demands a separate strategic commitment."
 COLDWAR_FRA2_nov_indochina_return:0 "Armed Return"
 COLDWAR_FRA2_nov_indochina_return_desc:0 "Reject a purely diplomatic role and prepare an expeditionary return. A renewed French sphere in Indochina risks confrontation with Vietnam's allies and requires a substantial military commitment."
 COLDWAR_FRA2_nov_indochina_staging:0 "Indochina Staging"
 COLDWAR_FRA2_nov_indochina_staging_desc:0 "Rebuild transport and naval support before committing to a distant intervention. French yards and support services must prepare the capacity needed to sustain an overseas force."
 COLDWAR_FRA2_nov_liaison_offices:0 "SDECE Liaison"
 COLDWAR_FRA2_nov_liaison_offices_desc:0 "Presidential diplomacy depends on reliable reports and discreet communications with embassies and local intermediaries. Invest in secure equipment and technical preparation so Paris can sustain those channels when relations become strained."
 COLDWAR_FRA2_nov_libreville:0 "Libreville Plan"
 COLDWAR_FRA2_nov_libreville_desc:0 "The restoration of Leon M'Ba in 1964 provides a precedent for defending a friendly Gabonese presidency. A new operation requires an actual threat to a French-backed government."
 COLDWAR_FRA2_nov_officer_contacts:0 "Officer Contacts"
 COLDWAR_FRA2_nov_officer_contacts_desc:0 "Build contacts among officers and political intermediaries. The outcome remains a contest between French contacts and the incumbent government. The effectiveness of funded contacts depends on French influence and local resistance."
 COLDWAR_FRA2_nov_paris_conference:0 "Paris Conference"
 COLDWAR_FRA2_nov_paris_conference_desc:0 "Bring the belligerents and other concerned governments to the negotiating table. A settlement must respect Vietnamese sovereignty and regional independence, with the consent of the parties at war."
 COLDWAR_FRA2_nov_presidential_ties:0 "Central African Desk"
 COLDWAR_FRA2_nov_presidential_ties_desc:0 "Establish a regional diplomatic service for separate negotiations with the governments concerned. Each agreement and intervention requires its own national programme and local preparation."
 COLDWAR_FRA2_nov_reconstruction:0 "Hanoi Reconstruction"
 COLDWAR_FRA2_nov_reconstruction_desc:0 "Offer reconstruction and engineering cooperation to Hanoi. Investment in productive capacity and transport requires a separate settlement with the North Vietnamese government."
 COLDWAR_FRA2_nov_regional_neutrality:0 "Regional Neutrality"
 COLDWAR_FRA2_nov_regional_neutrality_desc:0 "Establish a framework for separate neutrality agreements with Vietnamese, Laotian and Cambodian governments. Each state retains authority over its own foreign relations."
 COLDWAR_FRA2_nov_sahel_leverage:0 "Sahel Leverage"
 COLDWAR_FRA2_nov_sahel_leverage_desc:0 "Use a paid Nigerien uranium concession as political leverage. The underlying survey, ownership and development agreements remain in force."
 COLDWAR_FRA2_nov_saigon_industry:0 "Saigon Orders"
 COLDWAR_FRA2_nov_saigon_industry_SVN:0 "Saigon Orders: South Vietnam"
 COLDWAR_FRA2_nov_saigon_industry_SVN_desc:0 "Offer South Vietnam industrial equipment and commercial support without imposing a French subject relationship. French firms receive a concrete services investment in return for an expensive initial programme."
 COLDWAR_FRA2_nov_saigon_industry_desc:0 "Offer South Vietnam industrial equipment and commercial support without imposing a French subject relationship. French firms receive a concrete services investment in return for an expensive initial programme."
 COLDWAR_FRA2_nov_saigon_industry_france:0 "Saigon Orders: France"
 COLDWAR_FRA2_nov_saigon_industry_france_desc:0 "Offer South Vietnam industrial equipment and commercial support without imposing a French subject relationship. French firms receive a concrete services investment in return for an expensive initial programme."
 COLDWAR_FRA2_nov_saigon_industry_recipient_heading:0 "[SVN.GetName]"
 COLDWAR_FRA2_nov_saigon_subject:0 "Saigon Ultimatum"
 COLDWAR_FRA2_nov_saigon_subject_desc:0 "Demand a French satellite relationship with South Vietnam. Saigon may accept French supremacy or refuse and face a military confrontation whose outcome remains uncertain."
 COLDWAR_FRA2_nov_satellite_offer:0 "Satellite Offer"
 COLDWAR_FRA2_nov_satellite_offer_desc:0 "Demand an enforceable French security relationship. Acceptance preserves the local state under French supremacy; refusal gives France a war objective that must still be won."
 COLDWAR_FRA2_nov_security_clients:0 "Security Clients"
 COLDWAR_FRA2_nov_security_clients_desc:0 "Prioritise locally maintained client armies and French military orders. A stronger security network offers fewer commercial services and commits France to more expensive support."
 COLDWAR_FRA2_nov_security_treaties:0 "Security Treaties"
 COLDWAR_FRA2_nov_security_treaties_desc:0 "Offer governments French protection in exchange for control over their external policy and a satellite relationship. A refusal can become a public military confrontation."
 COLDWAR_FRA2_nov_viet_contacts:0 "Hanoi Relations"
 COLDWAR_FRA2_nov_viet_contacts_desc:0 "Negotiate recognition and regular diplomatic channels with Hanoi. North Vietnam decides whether to accept a separate relationship with France on the proposed terms."
 COLDWAR_FRA2_nov_vietnam_mediation:0 "Paris Mediation"
 COLDWAR_FRA2_nov_vietnam_mediation_desc:0 "Maintain Paris as a meeting place for the belligerents. France can organise an agreement, but cannot end other countries' wars without their consent."
 COLDWAR_FRA2_nov_vietnam_partners:0 "Equal Partnership"
 COLDWAR_FRA2_nov_vietnam_partners_desc:0 "Build on the existing engineering and medical offers through consent, training and trade. This route gives France access to productive orders without restoring colonial authority."
 COLDWAR_FRA2_nov_vietnam_repair:0 "Vietnamese Services"
 COLDWAR_FRA2_nov_vietnam_repair_VIE:0 "Vietnamese Services: Vietnam"
 COLDWAR_FRA2_nov_vietnam_repair_VIE_desc:0 "Broaden engineering and medical cooperation through civilian maintenance, technical administration and local services. Each government retains authority over its domestic development."
 COLDWAR_FRA2_nov_vietnam_repair_desc:0 "Broaden engineering and medical cooperation through civilian maintenance, technical administration and local services. Each government retains authority over its domestic development."
 COLDWAR_FRA2_nov_vietnam_repair_france:0 "Vietnamese Services: France"
 COLDWAR_FRA2_nov_vietnam_repair_france_desc:0 "Broaden engineering and medical cooperation through civilian maintenance, technical administration and local services. Each government retains authority over its domestic development."
 COLDWAR_FRA2_nov_vietnam_repair_recipient_heading:0 "[VIE.GetName]"
 COLDWAR_FRA2_nov_wider_africa:0 "Beyond the Old Zone"
 COLDWAR_FRA2_nov_wider_africa_desc:0 "Compete beyond France's former colonial network. Local alliances and rival patrons make an operation more expensive, and their normal guarantees and war commitments remain relevant."
 COLDWAR_FRA2_nuclear_construction_ready_tt:0 "France must have reactor construction technology and room to build in Loire."
 COLDWAR_FRA2_nuclear_priority:0 "Nuclear Deterrent"
 COLDWAR_FRA2_nuclear_priority_desc:0 "Keep the independent deterrent and its engineering base at the centre of defence policy. Conventional procurement and readiness must absorb the resulting pressure on resources."
 COLDWAR_FRA2_nuclear_scale:0 "Nuclear Expansion"
 COLDWAR_FRA2_nuclear_scale_desc:0 "Standardise the civil nuclear supply chain around the reactor choice made in 1970. Engineering and construction performance can improve, while every additional reactor still requires separate public investment."
 COLDWAR_FRA2_ocean_navy:0 "Ocean-Going Fleet"
 COLDWAR_FRA2_ocean_navy_desc:0 "Sustain the dockyards and trained crews required for an oceanic fleet. Overseas presence expands French reach but needs a larger permanent personnel establishment."
 COLDWAR_FRA2_oil:0 "Oil-Intensive Growth"
 COLDWAR_FRA2_oil_dependence_intermediate:0 "Reduced but Persistent Oil Dependence"
 COLDWAR_FRA2_oil_dependence_intermediate_desc:0 "The chosen generation programme moderates civilian fuel demand, but transport and industrial production still rely on imported petroleum."
 COLDWAR_FRA2_oil_dependence_residual:0 "Persistent Oil Dependence"
 COLDWAR_FRA2_oil_dependence_residual_desc:0 "Energy investment has reduced civilian fuel demand, but France remains exposed to imported petroleum prices and supply disputes."
 COLDWAR_FRA2_oil_desc:0 "Cheap imported oil sustains transport and industry. High demand leaves national prosperity exposed to supply disputes, price changes and the exchange rate.\n\nRelief: Nuclear Expansion or Diversified Energy reduces civilian fuel demand from +8% to +6%. Cut Oil Dependence reduces it to a permanent +3%; imported petroleum exposure remains."
 COLDWAR_FRA2_oil_resilience:0 "Cut Oil Dependence"
 COLDWAR_FRA2_oil_resilience_desc:0 "Reduce the assumption that imported oil will remain cheap and reliable. The programme improves resilience, while power stations and fuel contracts remain distinct national choices."
 COLDWAR_FRA2_oil_strategy_ready_tt:0 "A French reactor must be generating power, or the funded diversified energy programme must be complete."
 COLDWAR_FRA2_open_computers:0 "Compatible Systems"
 COLDWAR_FRA2_open_computers_desc:0 "Adopt compatible computer systems and expand a Paris-region technical office. Licensing accelerates access to electronics expertise, while royalties and support payments reduce the returns retained by French firms."
 COLDWAR_FRA2_ortf:0 "Public Broadcasting"
 COLDWAR_FRA2_ortf_desc:0 "Give public broadcasting editorial room while modernising its studios and technical services. An independent professional service can regain public confidence, but ministers must surrender a measure of control and finance new equipment and training."
 COLDWAR_FRA2_parliament:0 "Parliamentary Checks"
 COLDWAR_FRA2_parliament_desc:0 "Give deputies and committees a stronger role in questioning ministers and scrutinising appointments. The aim is a more accountable Fifth Republic, not a return to the cabinet instability of the Fourth."
 COLDWAR_FRA2_participation:0 "Gaullist Participation"
 COLDWAR_FRA2_participation_desc:0 "Give workers a stake in industrial expansion through participation agreements and a funded production site. Employers must share returns, while technical workshops require their own investment."
 COLDWAR_FRA2_party_discipline:0 "Party Discipline"
 COLDWAR_FRA2_party_discipline_desc:0 "Concentrate political authority and industrial study within the party apparatus. The leadership can act more decisively, but political discipline deepens opposition outside its own organisations."
 COLDWAR_FRA2_pcf_energy_contract:0 "Energy Engineering"
 COLDWAR_FRA2_pcf_energy_contract_desc:0 "Concentrate the industrial partnership on joint energy studies, equipment and efficient use. France lowers industrial energy demand and Soviet partners improve generation; both countries must fund specialist technical training."
 COLDWAR_FRA2_pcf_energy_contract_external_requirement_2:0 "[SOV.GetName] holds the required active programme."
 COLDWAR_FRA2_pcf_energy_contract_external_requirement_4:0 "[FRA.GetName] holds the required active programme."
 COLDWAR_FRA2_pcf_energy_contract_recipient_heading:0 "[SOV.GetName]"
 COLDWAR_FRA2_pcf_municipal_health:0 "Municipal Health"
 COLDWAR_FRA2_pcf_municipal_health_desc:0 "Extend the municipal health and prevention tradition through service centres in Bourgogne and Rhone-Alpes. Better access and prevention lower health expenditure, while permanent local provision carries a larger social bill."
 COLDWAR_FRA2_pcf_parent_soviet_science_programme:0 "French Communist Party Programme"
 COLDWAR_FRA2_pcf_parent_soviet_science_programme_desc:0 "The French Communist Party weighs municipal power, organised labour and economic planning against the demands of electoral cooperation and its relationship with the Soviet Union."
 COLDWAR_FRA2_pcf_programme:0 "French Communist Party Programme"
 COLDWAR_FRA2_pcf_programme_desc:0 "The French Communist Party weighs municipal influence, organised labour and the institutional limits of a national transition."
 COLDWAR_FRA2_pcf_shipping_contract:0 "Shipping Protocol"
 COLDWAR_FRA2_pcf_shipping_contract_desc:0 "Concentrate the industrial partnership on maritime engineering, repair orders and commercial administration. French yards and Soviet commercial services would share funded investment and technical work."
 COLDWAR_FRA2_pcf_shipping_contract_external_requirement_2:0 "[SOV.GetName] holds the required active programme."
 COLDWAR_FRA2_pcf_shipping_contract_external_requirement_4:0 "[FRA.GetName] holds the required active programme."
 COLDWAR_FRA2_pcf_shipping_contract_recipient_heading:0 "[SOV.GetName]"
 COLDWAR_FRA2_pcf_supply_contracts:0 "Supply Contracts"
 COLDWAR_FRA2_pcf_supply_contracts_desc:0 "Link food processing and productive orders through a Normandie plant and a Loire agricultural district. Public procurement builds practical capacity, but guaranteed terms and concessions reduce corporate-tax receipts."
 COLDWAR_FRA2_plan_calcul:0 "Plan Calcul Renewal"
 COLDWAR_FRA2_plan_calcul_desc:0 "Renew the Plan Calcul through IRIA, domestic procurement and trained engineers. French computing needs a dependable market if it is to compete with established foreign suppliers."
 COLDWAR_FRA2_planned_targets:0 "Production Targets"
 COLDWAR_FRA2_planned_targets_desc:0 "Translate national production targets into a funded civilian industrial project. Planning can coordinate construction and standardise industrial methods, while rigid allocations and supply bottlenecks can reduce the flexibility of existing civilian production."
 COLDWAR_FRA2_pompidou_europe:0 "The Hague Opening"
 COLDWAR_FRA2_pompidou_europe_desc:0 "Use the opening after The Hague to finance industrial links and regional services on both sides of the Rhine. Each government retains authority over its own investment."
 COLDWAR_FRA2_pompidou_europe_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_pooled_armour:0 "Shared Components"
 COLDWAR_FRA2_pooled_armour_desc:0 "Standardise components and negotiate joint procurement with partners. Common orders lower equipment expenditure, but shared specifications and industrial work-sharing slow the adaptation of production lines."
 COLDWAR_FRA2_postcolonial:0 "The Postcolonial Settlement"
 COLDWAR_FRA2_postcolonial_desc:0 "Repatriation, migrant housing and competing memories of Algeria burden public trust. Overseas commitments also test the reach of a centralised state."
 COLDWAR_FRA2_presidency:0 "The Fifth Republic"
 COLDWAR_FRA2_presidency_desc:0 "Pompidou inherits a powerful presidency and a large Gaullist majority. Administrative concentration gives the executive room to act while narrowing parliamentary and local influence.\n\nRelief: Executive Safeguards or Parliamentary Checks replaces The Fifth Republic with Unsettled Institutional Balance: bureaucracy cost +4% and stability -2%. The starting +10% political-power bonus ends. Civic Settlement clears the residual after its funded housing and reconciliation path."
 COLDWAR_FRA2_presidential_industry:0 "Industrial Presidency"
 COLDWAR_FRA2_presidential_industry_desc:0 "Concentrate public investment in export-capable industrial groups and new productive capacity in Normandie. A stronger presidency secures scale and investment discipline while narrowing the social opening sought by organised labour."
 COLDWAR_FRA2_pressure_charter_france_CAM:0 "Procurement Charter"
 COLDWAR_FRA2_pressure_charter_france_CAM_desc:0 "The former procurement charter is no longer in force."
