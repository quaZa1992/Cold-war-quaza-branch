 COLDWAR_FRA2_oil:0 "Oil-Intensive Growth"
 COLDWAR_FRA2_oil_dependence_intermediate:0 "Reduced but Persistent Oil Dependence"
 COLDWAR_FRA2_oil_dependence_intermediate_desc:0 "The chosen generation programme moderates civilian fuel demand, but transport and industrial production still rely on imported petroleum."
 COLDWAR_FRA2_oil_dependence_residual:0 "Persistent Oil Dependence"
 COLDWAR_FRA2_oil_dependence_residual_desc:0 "Energy investment has reduced civilian fuel demand, but France remains exposed to imported petroleum prices and supply disputes."
 COLDWAR_FRA2_oil_desc:0 "Cheap imported oil sustains transport and industry. High demand leaves national prosperity exposed to supply disputes, price changes and the exchange rate.\n\nRelief: Nuclear Expansion or Diversified Energy reduces civilian fuel demand from +8% to +6%. Cut Oil Dependence reduces it to a permanent +3%; imported petroleum exposure remains."
 COLDWAR_FRA2_oil_resilience:0 "Cut Oil Dependence"
 COLDWAR_FRA2_oil_resilience_desc:0 "Reduce the assumption that imported oil will remain cheap and reliable. The programme improves resilience, while power stations and fuel contracts remain distinct national choices."
 COLDWAR_FRA2_oil_strategy_ready_tt:0 "A French reactor must be generating power, or the funded diversified energy programme must be complete."
 COLDWAR_FRA2_open_computers:0 "Compatible Systems"
 COLDWAR_FRA2_open_computers_desc:0 "Adopt compatible computer systems and expand a Paris-region technical office. Licensing accelerates access to electronics expertise, while royalties and support payments reduce the returns retained by French firms."
 COLDWAR_FRA2_ortf:0 "Public Broadcasting"
 COLDWAR_FRA2_ortf_desc:0 "The ORTF combines public broadcasting with close executive supervision. Give editors and broadcasters more professional room while retaining public service obligations and limiting the government's influence over the news."
 COLDWAR_FRA2_parliament:0 "Parliamentary Checks"
 COLDWAR_FRA2_parliament_desc:0 "Give deputies and committees a stronger role in questioning ministers and scrutinising appointments. The aim is a more accountable Fifth Republic, not a return to the cabinet instability of the Fourth."
 COLDWAR_FRA2_participation:0 "Gaullist Participation"
 COLDWAR_FRA2_participation_desc:0 "Give workers a stake in industrial expansion through participation agreements and a funded production site. Employers must share returns, while technical workshops require their own investment."
 COLDWAR_FRA2_party_discipline:0 "Party Discipline"
 COLDWAR_FRA2_party_discipline_desc:0 "Concentrate political authority and industrial study within the party apparatus. The leadership can act more decisively, but political discipline deepens opposition outside its own organisations."
 COLDWAR_FRA2_pcf_energy_contract:0 "Energy Engineering"
 COLDWAR_FRA2_pcf_energy_contract_desc:0 "Concentrate the industrial partnership on joint energy studies, equipment and efficient use. France lowers industrial energy demand and Soviet partners improve generation; both countries must fund specialist technical training."
 COLDWAR_FRA2_pcf_energy_contract_external_requirement_2:0 "[SOV.GetName] holds the required active programme."
 COLDWAR_FRA2_pcf_energy_contract_external_requirement_3:0 "[FRA.GetName] holds the required active programme."
 COLDWAR_FRA2_pcf_energy_contract_recipient_heading:0 "[SOV.GetName]"
 COLDWAR_FRA2_pcf_municipal_health:0 "Municipal Health"
 COLDWAR_FRA2_pcf_municipal_health_desc:0 "Extend the municipal health and prevention tradition through service centres in Bourgogne and Rhone-Alpes. Better access and prevention lower health expenditure, while permanent local provision carries a larger social bill."
 COLDWAR_FRA2_pcf_parent_soviet_science_programme:0 "French Communist Party Programme"
 COLDWAR_FRA2_pcf_parent_soviet_science_programme_desc:0 "PCF under Rochet, with Marchais rising. Eurocommunist and orthodox options are real internal tensions, not separate invented mass parties."
 COLDWAR_FRA2_pcf_programme:0 "French Communist Party Programme"
 COLDWAR_FRA2_pcf_programme_desc:0 "The French Communist Party weighs municipal influence, organised labour and the institutional limits of a national transition."
 COLDWAR_FRA2_pcf_shipping_contract:0 "Shipping Protocol"
 COLDWAR_FRA2_pcf_shipping_contract_desc:0 "Concentrate the industrial partnership on maritime engineering, repair orders and commercial administration. French yards and Soviet commercial services would share funded investment and technical work."
 COLDWAR_FRA2_pcf_shipping_contract_external_requirement_2:0 "[SOV.GetName] holds the required active programme."
 COLDWAR_FRA2_pcf_shipping_contract_external_requirement_3:0 "[FRA.GetName] holds the required active programme."
 COLDWAR_FRA2_pcf_shipping_contract_recipient_heading:0 "[SOV.GetName]"
 COLDWAR_FRA2_pcf_supply_contracts:0 "Supply Contracts"
 COLDWAR_FRA2_pcf_supply_contracts_desc:0 "Link food processing and productive orders through a Normandie plant and a Loire agricultural district. Public procurement builds practical capacity, but guaranteed terms and concessions reduce corporate-tax receipts."
 COLDWAR_FRA2_plan_calcul:0 "Plan Calcul Renewal"
 COLDWAR_FRA2_plan_calcul_desc:0 "Renew the Plan Calcul through IRIA, domestic procurement and trained engineers. French computing needs a dependable market if it is to compete with established foreign suppliers."
 COLDWAR_FRA2_planned_targets:0 "Production Targets"
 COLDWAR_FRA2_planned_targets_desc:0 "Direct investment toward a limited number of industrial priorities. Clear targets can concentrate effort, but compete with household supply, local needs and managers' discretion."
 COLDWAR_FRA2_pompidou_europe:0 "The Hague Opening"
 COLDWAR_FRA2_pompidou_europe_desc:0 "Use the opening after The Hague to finance industrial links and regional services on both sides of the Rhine. Each government retains authority over its own investment."
 COLDWAR_FRA2_pompidou_europe_external_requirement_2:0 "[GER.GetName] holds the required active programme."
 COLDWAR_FRA2_pompidou_europe_external_requirement_3:0 "[FRA.GetName] holds the required active programme."
 COLDWAR_FRA2_pompidou_europe_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_pooled_armour:0 "Shared Components"
 COLDWAR_FRA2_pooled_armour_desc:0 "Standardise components and negotiate joint procurement with partners. Common orders lower equipment expenditure, but shared specifications and industrial work-sharing slow the adaptation of production lines."
 COLDWAR_FRA2_postcolonial:0 "The Postcolonial Settlement"
 COLDWAR_FRA2_postcolonial_desc:0 "Repatriation, migrant housing and competing memories of Algeria burden public trust. Overseas commitments also test the reach of a centralised state."
 COLDWAR_FRA2_presidency:0 "The Fifth Republic"
 COLDWAR_FRA2_presidency_desc:0 "Pompidou inherits a powerful presidency and a large Gaullist majority. Administrative concentration gives the executive room to act while narrowing parliamentary and local influence.\n\nRelief: Executive Safeguards or Parliamentary Checks replaces The Fifth Republic with Unsettled Institutional Balance: bureaucracy cost +4% and stability -2%. The starting +10% political-power bonus ends. Civic Settlement clears the residual after its funded housing and reconciliation path."
 COLDWAR_FRA2_presidential_industry:0 "Industrial Presidency"
 COLDWAR_FRA2_presidential_industry_desc:0 "Concentrate public investment in export-capable industrial groups and new productive capacity in Normandie. A stronger presidency secures scale and investment discipline while narrowing the social opening sought by organised labour."
