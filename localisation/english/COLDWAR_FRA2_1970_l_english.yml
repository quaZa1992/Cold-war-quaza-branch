 COLDWAR_FRA2_cds_formed_tt:0 "The Centre of Social Democrats has been formed."
 COLDWAR_FRA2_cds_mutual_health:0 "Mutual Health"
 COLDWAR_FRA2_cds_mutual_health_desc:0 "Direct the joint investment programme toward mutual health services and two regional offices. Better organisation can improve the use of medical spending, while extending local provision adds continuing social commitments."
 COLDWAR_FRA2_cds_rural_access:0 "Rural Service Links"
 COLDWAR_FRA2_cds_rural_access_desc:0 "Direct the joint allocation toward rural access and agricultural cooperation. Roads and a productive district can connect smaller communities with services and markets, while public support for rural provision raises social spending."
 COLDWAR_FRA2_cds_social_partnership:0 "CDS Social Services"
 COLDWAR_FRA2_cds_social_partnership_desc:0 "Build the merged Christian democratic movement's governing programme around local institutions and social partnership. A service office supports negotiation among elected representatives, employers and organised labour, while specialist public provision needs sustained funding."
 COLDWAR_FRA2_centre_CDS_programme:0 "Centre of Social Democrats Programme"
 COLDWAR_FRA2_centre_CDS_programme_desc:0 "The Centre of Social Democrats supports social partnership, mutual provision and local development."
 COLDWAR_FRA2_ecology_public_transit:0 "Public Transit"
 COLDWAR_FRA2_ecology_public_transit_desc:0 "Use the allocation to improve regional public transport and its approaches. Better connections and practical engineering can reduce reliance on private fuel consumption, while operating subsidies create a lasting social-budget commitment."
 COLDWAR_FRA2_ecology_repair_economy:0 "Repair Economy"
 COLDWAR_FRA2_ecology_repair_economy_desc:0 "Use the investment fund to manufacture durable goods and support repair networks. A civilian production site and a local coordination office can extend the life of household equipment, while preferential support reduces corporate tax receipts."
 COLDWAR_FRA2_pr_capital_markets:0 "Capital Markets"
 COLDWAR_FRA2_pr_capital_markets_desc:0 "Allocate the programme to financial services, disclosure and technical expertise for private investment. Two offices can support a wider capital market, while supervision and specialist education require a continuing public commitment."
 COLDWAR_FRA2_pr_enterprise_finance:0 "Enterprise Finance"
 COLDWAR_FRA2_pr_enterprise_finance_desc:0 "Give the Republican Party's enterprise programme a financial and technical base. A specialist office can connect private firms with investment and public guarantees, while organising that service requires funding and legislative support."
 COLDWAR_FRA2_pr_formed_tt:0 "The Republican Party has been formed."
 COLDWAR_FRA2_pr_regional_enterprise:0 "Regional Firms"
 COLDWAR_FRA2_pr_regional_enterprise_desc:0 "Allocate investment support to a regional civilian producer and a prepared expansion site. Industrial development can reach smaller firms beyond Paris, while preferential grants reduce the fiscal yield of the supported enterprises."
 COLDWAR_FRA2_ri_PR_programme:0 "Republican Party Programme"
 COLDWAR_FRA2_ri_PR_programme_desc:0 "The Republican Party supports enterprise finance, private investment and regional development."
 COLDWAR_FRA2_rpr_formed_tt:0 "The Rally for the Republic has been formed."
 COLDWAR_FRA2_rpr_municipal_base:0 "Municipal Gaullism"
 COLDWAR_FRA2_rpr_municipal_base_desc:0 "Organise the Rally's local governing network around a regional service office. Elected representatives can coordinate investment and public contracts, while building a durable municipal base requires political work and public funds."
 COLDWAR_FRA2_rpr_municipal_works:0 "Municipal Works"
 COLDWAR_FRA2_rpr_municipal_works_desc:0 "Commit the development allocation to municipal works and service contracts. Better local access and a service office bring visible improvements, while public provision creates operating commitments that extend beyond the construction programme."
 COLDWAR_FRA2_rpr_open_tenders:0 "Open Tenders"
 COLDWAR_FRA2_rpr_open_tenders_desc:0 "Use competitive tenders to direct the development allocation toward a new civilian production site. Breaking established preferences consumes political capital, while technical evaluation and procurement oversight need trained specialists."
 COLDWAR_FRA2_udr_RPR_programme:0 "Rally for the Republic Programme"
 COLDWAR_FRA2_udr_RPR_programme_desc:0 "The Rally supports national authority through local government, public works and industrial development."
