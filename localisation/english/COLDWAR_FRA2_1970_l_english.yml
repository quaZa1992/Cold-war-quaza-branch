 COLDWAR_FRA2_algeria_energy_france_desc:0 "Renegotiate energy and industrial cooperation under Algerian sovereignty. The 1965 framework offers a starting point, while development priorities and future returns require mutual agreement."
 COLDWAR_FRA2_algeria_energy_recipient_heading:0 "[ALG.GetName]"
 COLDWAR_FRA2_algeria_training:0 "Algerian Institutes"
 COLDWAR_FRA2_algeria_training_ALG:0 "Algerian Institutes: Algeria"
 COLDWAR_FRA2_algeria_training_ALG_desc:0 "Extend the Algerian Petroleum Institute precedent into a lasting technical education partnership. Both governments fund training, and each retains the right to approve its own obligations."
 COLDWAR_FRA2_algeria_training_desc:0 "Extend the Algerian Petroleum Institute precedent into a lasting technical education partnership. Both governments fund training, and each retains the right to approve its own obligations."
 COLDWAR_FRA2_algeria_training_external_requirement_2:0 "[FRA.GetName] holds the required active programme."
 COLDWAR_FRA2_algeria_training_external_requirement_3:0 "Algeria has the active Algerian Energy and Industrial Cooperation spirit."
 COLDWAR_FRA2_algeria_training_france:0 "Algerian Institutes: France"
 COLDWAR_FRA2_algeria_training_france_desc:0 "Extend the Algerian Petroleum Institute precedent into a lasting technical education partnership. Both governments fund training, and each retains the right to approve its own obligations."
 COLDWAR_FRA2_algeria_training_recipient_heading:0 "[ALG.GetName]"
 COLDWAR_FRA2_american_challenge:0 "American Challenge"
 COLDWAR_FRA2_american_challenge_desc:0 "Servan-Schreiber argues that France must answer American industrial scale with education, modern management and a larger European market. The effort asks firms and public institutions to change together."
 COLDWAR_FRA2_amnesty:0 "Republican Amnesty"
 COLDWAR_FRA2_amnesty_desc:0 "Extend the late-1960s amnesties to close some domestic disputes left by the Algerian conflict. Reconciliation can reduce political division, while victims' claims and disagreements over public memory remain unresolved."
 COLDWAR_FRA2_arab_contracts_programme:0 "Arab Contracts and the Mediterranean Programme"
 COLDWAR_FRA2_arab_contracts_programme_desc:0 "French national policy and individually negotiated standing agreements. Partner governments retain their own authority."
 COLDWAR_FRA2_ariane:0 "A European Launcher"
 COLDWAR_FRA2_ariane_GER:0 "A European Launcher: Federal Republic of Germany"
 COLDWAR_FRA2_ariane_GER_desc:0 "Access to space should not leave Europe dependent on another government's launch decisions. Seek West German support for a French-led launcher project, sharing electronic research and development costs while building the wider European agreement needed to carry it forward."
 COLDWAR_FRA2_ariane_desc:0 "Access to space should not leave Europe dependent on another government's launch decisions. Seek West German support for a French-led launcher project, sharing electronic research and development costs while building the wider European agreement needed to carry it forward."
