 COLDWAR_FRA2_air_programme_desc:0 "French air power depends on continuing design, testing and production. A national aircraft line and cooperative development answer different operational and industrial needs."
 COLDWAR_FRA2_airbus:0 "Airbus Partnership"
 COLDWAR_FRA2_airbus_GER:0 "Airbus Partnership: Federal Republic of Germany"
 COLDWAR_FRA2_airbus_GER_desc:0 "France and West Germany already committed to the A300 in 1969. Continue the national work share and industrial capacity through a renewed funding agreement, with both governments deciding whether to accept the new terms."
 COLDWAR_FRA2_airbus_desc:0 "France and West Germany already committed to the A300 in 1969. Continue the national work share and industrial capacity through a renewed funding agreement, with both governments deciding whether to accept the new terms."
 COLDWAR_FRA2_airbus_france:0 "Airbus Partnership: France"
 COLDWAR_FRA2_airbus_france_desc:0 "France and West Germany already committed to the A300 in 1969. Continue the national work share and industrial capacity through a renewed funding agreement, with both governments deciding whether to accept the new terms."
 COLDWAR_FRA2_airbus_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_algeria_energy:0 "Algerian Energy"
 COLDWAR_FRA2_algeria_energy_ALG:0 "Algerian Energy: Algeria"
 COLDWAR_FRA2_algeria_energy_ALG_desc:0 "Renegotiate energy and industrial cooperation under Algerian sovereignty. The 1965 framework offers a starting point, while development priorities and future returns require mutual agreement."
 COLDWAR_FRA2_algeria_energy_active_tt:0 "France and Algeria must both have the active Algerian Energy and Industrial Cooperation agreement."
 COLDWAR_FRA2_algeria_energy_desc:0 "Renegotiate energy and industrial cooperation under Algerian sovereignty. The 1965 framework offers a starting point, while development priorities and future returns require mutual agreement."
 COLDWAR_FRA2_algeria_energy_france:0 "Algerian Energy: France"
 COLDWAR_FRA2_algeria_energy_france_desc:0 "Renegotiate energy and industrial cooperation under Algerian sovereignty. The 1965 framework offers a starting point, while development priorities and future returns require mutual agreement."
 COLDWAR_FRA2_algeria_energy_recipient_heading:0 "[ALG.GetName]"
 COLDWAR_FRA2_algeria_training:0 "Algerian Institutes"
 COLDWAR_FRA2_algeria_training_ALG:0 "Algerian Institutes: Algeria"
 COLDWAR_FRA2_algeria_training_ALG_desc:0 "Extend the Algerian Petroleum Institute precedent into a lasting technical education partnership. Both governments fund training, and each retains the right to approve its own obligations."
 COLDWAR_FRA2_algeria_training_desc:0 "Extend the Algerian Petroleum Institute precedent into a lasting technical education partnership. Both governments fund training, and each retains the right to approve its own obligations."
 COLDWAR_FRA2_algeria_training_external_requirement_1:0 "[FRA.GetName] holds the required active programme."
 COLDWAR_FRA2_algeria_training_external_requirement_2:0 "Algeria has the active Algerian Energy and Industrial Cooperation spirit."
 COLDWAR_FRA2_algeria_training_france:0 "Algerian Institutes: France"
 COLDWAR_FRA2_algeria_training_france_desc:0 "Extend the Algerian Petroleum Institute precedent into a lasting technical education partnership. Both governments fund training, and each retains the right to approve its own obligations."
 COLDWAR_FRA2_algeria_training_recipient_heading:0 "[ALG.GetName]"
 COLDWAR_FRA2_american_challenge:0 "American Challenge"
 COLDWAR_FRA2_american_challenge_desc:0 "Servan-Schreiber argues that France must answer American industrial scale with education, modern management and a larger European market. The effort asks firms and public institutions to change together."
 COLDWAR_FRA2_amnesty:0 "Republican Amnesty"
 COLDWAR_FRA2_amnesty_desc:0 "Extend the late-1960s amnesties to close some domestic disputes left by the Algerian conflict. Reconciliation can reduce political division, while victims' claims and disagreements over public memory remain unresolved."
 COLDWAR_FRA2_arab_contracts_programme:0 "Arab Contracts and the Mediterranean Programme"
 COLDWAR_FRA2_arab_contracts_programme_desc:0 "French national policy and individually negotiated standing agreements. Partner governments retain their own authority."
 COLDWAR_FRA2_ariane:0 "A European Launcher"
 COLDWAR_FRA2_ariane_GER:0 "A European Launcher: Federal Republic of Germany"
 COLDWAR_FRA2_ariane_GER_desc:0 "Negotiate a French-led European launcher with Germany as an alternate course. Shared engineering can widen access to space, but cannot remove the cost or the need for broader European consent."
 COLDWAR_FRA2_ariane_desc:0 "Negotiate a French-led European launcher with Germany as an alternate course. Shared engineering can widen access to space, but cannot remove the cost or the need for broader European consent."
 COLDWAR_FRA2_ariane_france:0 "A European Launcher: France"
 COLDWAR_FRA2_ariane_france_desc:0 "Negotiate a French-led European launcher with Germany as an alternate course. Shared engineering can widen access to space, but cannot remove the cost or the need for broader European consent."
 COLDWAR_FRA2_ariane_recipient_heading:0 "[GER.GetName]"
