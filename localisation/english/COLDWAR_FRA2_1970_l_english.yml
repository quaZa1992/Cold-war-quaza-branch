 COLDWAR_FRA2_shortcut_udr_nato:0 "Gaullist NATO Strategy"
 COLDWAR_FRA2_sixth_plan:0 "Sixth Plan"
 COLDWAR_FRA2_sixth_plan_desc:0 "The Sixth Plan, approved in 1970, must balance modern exporters, older industrial districts and underserved regions. Investment choices will shape whether growth reaches beyond the largest firms and cities."
 COLDWAR_FRA2_social_contract_ps:0 "Labour Compact"
 COLDWAR_FRA2_social_contract_ps_desc:0 "Back collective bargaining with a regional labour-services office and stronger guarantees for organised workers. Employers face new obligations and the social budget carries continuing commitments."
 COLDWAR_FRA2_social_market:0 "Social Market"
 COLDWAR_FRA2_social_market_desc:0 "Lecanuet's Democratic Centre joins market initiative to social responsibility and parliamentary government. It offers a distinct Christian democratic programme between presidential concentration and socialist planning."
 COLDWAR_FRA2_socialist_refoundation:0 "Socialist Renewal"
 COLDWAR_FRA2_socialist_refoundation_desc:0 "The Socialist Party is still rebuilding after the weakening of the SFIO and Guy Mollet's leadership. Alain Savary can broaden the democratic left by negotiating with republican clubs without pretending the 1971 Epinay settlement has already happened."
 COLDWAR_FRA2_sound_franc:0 "A Sound Franc"
 COLDWAR_FRA2_sound_franc_desc:0 "Defend monetary credibility through tighter public demand and a consistent budget. Investors gain confidence while domestic expansion slows."
 COLDWAR_FRA2_sovereign_reflation:0 "A Sovereign Reflation"
 COLDWAR_FRA2_sovereign_reflation_desc:0 "Finance agreed industrial orders and local production through French public credit and Algerian partners. Development supports demand in both countries, with credit exposure and costly concessions."
 COLDWAR_FRA2_sovereign_reflation_external_requirement_2:0 "Algeria has the active Algerian Energy and Industrial Cooperation spirit."
 COLDWAR_FRA2_sovereign_reflation_external_requirement_3:0 "[FRA.GetName] holds the required active programme."
 COLDWAR_FRA2_sovereign_reflation_recipient_heading:0 "[ALG.GetName]"
 COLDWAR_FRA2_soviet_friendship:0 "Soviet Partnership"
 COLDWAR_FRA2_soviet_friendship_desc:0 "Offer industrial equipment, engineering and production cooperation to the Soviet government. Funded orders support civilian investment in both countries, while the French export commitment diverts engineering capacity from arms-factory expansion."
 COLDWAR_FRA2_soviet_friendship_recipient_heading:0 "[SOV.GetName]"
 COLDWAR_FRA2_soviet_science:0 "Soviet Science Pact"
 COLDWAR_FRA2_soviet_science_SOV:0 "Soviet Science Pact: Soviet Union"
 COLDWAR_FRA2_soviet_science_SOV_desc:0 "Build on the 1966 Franco-Soviet cooperation framework and the developing dialogue with Moscow. Civilian science offers room for exchange without imposing military alignment. Opening the programme requires bilateral restrictions to be lifted."
 COLDWAR_FRA2_soviet_science_desc:0 "Build on the 1966 Franco-Soviet cooperation framework and the developing dialogue with Moscow. Civilian science offers room for exchange without imposing military alignment. Opening the programme requires bilateral restrictions to be lifted."
 COLDWAR_FRA2_soviet_science_france:0 "Soviet Science Pact: France"
 COLDWAR_FRA2_soviet_science_france_desc:0 "Build on the 1966 Franco-Soviet cooperation framework and the developing dialogue with Moscow. Civilian science offers room for exchange without imposing military alignment. Opening the programme requires bilateral restrictions to be lifted."
 COLDWAR_FRA2_soviet_science_recipient_heading:0 "[SOV.GetName]"
 COLDWAR_FRA2_statute:0 "Statutory Labour Pact"
 COLDWAR_FRA2_statute_desc:0 "Combine statutory labour rules with industrial investment in Normandie. Employers gain firmer operating conditions, while enforcement costs and union opposition remain real."
 COLDWAR_FRA2_symphonie:0 "Symphonie Satellite"
 COLDWAR_FRA2_symphonie_GER:0 "Symphonie Satellite: Federal Republic of Germany"
 COLDWAR_FRA2_symphonie_GER_desc:0 "Continue the Franco-German Symphonie satellite programme through telecommunications research and ground applications. Launch access and permitted uses still require diplomatic agreement."
 COLDWAR_FRA2_symphonie_desc:0 "Continue the Franco-German Symphonie satellite programme through telecommunications research and ground applications. Launch access and permitted uses still require diplomatic agreement."
 COLDWAR_FRA2_symphonie_external_requirement_1:0 "[GER.GetName] has completed 1G Internet Technology."
 COLDWAR_FRA2_symphonie_france:0 "Symphonie Satellite: France"
 COLDWAR_FRA2_symphonie_france_desc:0 "Continue the Franco-German Symphonie satellite programme through telecommunications research and ground applications. Launch access and permitted uses still require diplomatic agreement."
 COLDWAR_FRA2_symphonie_recipient_heading:0 "[GER.GetName]"
 COLDWAR_FRA2_technical_colleges:0 "Technical Colleges"
 COLDWAR_FRA2_technical_colleges_desc:0 "Expand engineering and technician training beyond the elite schools. Practical qualifications can ease bottlenecks in modern industry, while requiring teachers, workshops and lasting education funds."
 COLDWAR_FRA2_telecoms:0 "Telecom Network"
 COLDWAR_FRA2_telecoms_desc:0 "Modernise the PTT network through CNET research, switching equipment and long-distance links. New exchanges in Paris and Rhone-Alpes widen service, while demand still exceeds available connections."
 COLDWAR_FRA2_territorial_balance:0 "Industrial Balance"
 COLDWAR_FRA2_territorial_balance_desc:0 "Tie regional transport to the chosen industrial strategy. Investment can narrow the inherited gap in access to modern production, although it cannot remove the advantages of the largest centres at once."
 COLDWAR_FRA2_tgv:0 "High-Speed Rail"
 COLDWAR_FRA2_tgv_desc:0 "Fund SNCF engineering trials and the Lyon terminal and approaches. The 1970 study can prepare an experimental high-speed programme without claiming that commercial service already exists."
 COLDWAR_FRA2_transport_choice:0 "Rail or Motorway"
 COLDWAR_FRA2_transport_choice_desc:0 "Choose how to connect a rapidly urbanising country. High-speed rail offers concentrated capacity; motorways reach dispersed industry, and both compete for public investment."
 COLDWAR_FRA2_udr_nato_parent_nato_atlantic_fleet_programme:0 "NATO Agreement Programme"
 COLDWAR_FRA2_udr_nato_parent_nato_atlantic_fleet_programme_desc:0 "A UDR sub-tree. France remains a NATO treaty member outside integrated military command. The three strategies prioritise different funded capabilities and partnerships, not three fictional accession statuses."
 COLDWAR_FRA2_udr_nato_parent_nato_europe_land_programme:0 "NATO Agreement Programme"
 COLDWAR_FRA2_udr_nato_parent_nato_europe_land_programme_desc:0 "A UDR sub-tree. France remains a NATO treaty member outside integrated military command. The three strategies prioritise different funded capabilities and partnerships, not three fictional accession statuses."
