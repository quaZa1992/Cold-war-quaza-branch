 COLDWAR_BRA_pfl_9_research_1:0 "Liberal Institutions"
 COLDWAR_BRA_pfl_9_research_2:0 "Liberal Institutions"
 COLDWAR_BRA_pmdb_health_regions:0 "Regional Health"
 COLDWAR_BRA_pmdb_health_regions_desc:0 "Give regional health administration the first claim on the social investment fund. Offices can improve access and coordination across levels of government, while wider public provision creates a continuing social commitment."
 COLDWAR_BRA_pmdb_health_regions_research_0:0 "Regional Health"
 COLDWAR_BRA_pmdb_health_regions_research_1:0 "Regional Health"
 COLDWAR_BRA_pmdb_health_regions_research_2:0 "Regional Health"
 COLDWAR_BRA_pmdb_municipal_services:0 "Municipal Services"
 COLDWAR_BRA_pmdb_municipal_services_desc:0 "Use the first social investment allocation for local access and municipal services in the Northeast. Infrastructure and an administrative office give decentralisation practical means, while operating the expanded network adds to social commitments."
 COLDWAR_BRA_pmdb_municipal_services_research_0:0 "Municipal Services"
 COLDWAR_BRA_pmdb_municipal_services_research_1:0 "Municipal Services"
 COLDWAR_BRA_pmdb_municipal_services_research_2:0 "Municipal Services"
 COLDWAR_BRA_pmdb_social_charter:0 "Social Charter"
 COLDWAR_BRA_pmdb_social_charter_desc:0 "Turn the PMDB coalition's social and federal commitments into an investment programme. A coordinating office can negotiate responsibilities with states and municipalities, but the coalition must choose where its first funded expansion goes."
 COLDWAR_BRA_pmdb_social_charter_research_0:0 "Social Charter"
 COLDWAR_BRA_pmdb_social_charter_research_1:0 "Social Charter"
 COLDWAR_BRA_pmdb_social_charter_research_2:0 "Social Charter"
 COLDWAR_BRA_policy_adult_literacy:0 "Adult Literacy"
 COLDWAR_BRA_policy_adult_literacy_desc:0 "Expand adult literacy through sustained instruction and stronger local access."
 COLDWAR_BRA_policy_air_safety:0 "Flight Safety"
 COLDWAR_BRA_policy_air_safety_desc:0 "Fund safety instruction and maintenance with a larger skilled-personnel bill."
 COLDWAR_BRA_policy_air_support:0 "Tactical Air Support"
 COLDWAR_BRA_policy_air_support_desc:0 "Build a tactical-support air service with the required specialist staff."
 COLDWAR_BRA_policy_arena_0:0 "Governors Compact"
 COLDWAR_BRA_policy_arena_0_desc:0 "Bind state governors and the congressional government bloc through a civilian conservative programme."
 COLDWAR_BRA_policy_arena_1:0 "Municipal Patronage"
 COLDWAR_BRA_policy_arena_1_desc:0 "Back the municipal networks that connect conservative governors to their constituencies. A regional service office gives those commitments an administrative home, while negotiated appointments and local bargains increase the cost of administration."
 COLDWAR_BRA_policy_arena_2:0 "Technical Cabinet"
 COLDWAR_BRA_policy_arena_2_desc:0 "Strengthen the technical cabinet with an independent planning staff and standard procurement files. Better administration can reduce waste, but governors lose part of their bargaining power."
 COLDWAR_BRA_policy_arena_5:0 "Farm Credit"
 COLDWAR_BRA_policy_arena_5_desc:0 "Offer agricultural credit through established rural institutions."
 COLDWAR_BRA_policy_arena_6:0 "Federal Bargaining"
 COLDWAR_BRA_policy_arena_6_desc:0 "Coordinate federal and state investment while accepting a slower bargain over allocations."
 COLDWAR_BRA_policy_arena_7:0 "Protected Suppliers"
 COLDWAR_BRA_policy_arena_7_desc:0 "Reserve procurement for national suppliers, protecting output but narrowing technological competition."
 COLDWAR_BRA_policy_arena_8:0 "Export Constituency"
 COLDWAR_BRA_policy_arena_8_desc:0 "Shift the coalition toward competitive exporters while exposing sheltered domestic interests."
 COLDWAR_BRA_policy_arena_9:0 "Civilian Conservatism"
 COLDWAR_BRA_policy_arena_9_desc:0 "Build a conservative civilian government within ARENA, the regime’s governing party, while keeping it institutionally distinct from the armed forces command."
 COLDWAR_BRA_policy_atlantic:0 "Atlantic Continuity"
 COLDWAR_BRA_policy_atlantic_desc:0 "Maintain Atlantic technical and diplomatic links while developing the staff needed to use them. Cooperation can widen research contacts, but external methods require training and a continuing investment in specialists."
 COLDWAR_BRA_policy_carajas:0 "Carajas Logistics"
 COLDWAR_BRA_policy_carajas_desc:0 "Fund rail, port and administrative capacity for the Carajás mineral frontier. Resource revenues depend on exports."
 COLDWAR_BRA_policy_cerrado:0 "Cerrado Agribusiness"
 COLDWAR_BRA_policy_cerrado_desc:0 "Combine tropical agronomy with large-scale commercial farming and acknowledge land concentration."
 COLDWAR_BRA_policy_church_dialogue:0 "Church Grants"
 COLDWAR_BRA_policy_church_dialogue_desc:0 "Direct public grants to church-linked service organisations and sustain dialogue with the CNBB, alongside secular provision."
 COLDWAR_BRA_policy_coastal_fleet:0 "Coastal Escort Fleet"
 COLDWAR_BRA_policy_coastal_fleet_desc:0 "Prioritise cheaper escort production over the cohesion of a broader blue-water force."
 COLDWAR_BRA_policy_conservation:0 "Efficient Energy Use"
 COLDWAR_BRA_policy_conservation_desc:0 "Prioritise conservation and retrofitting rather than rapid supply expansion."
 COLDWAR_BRA_policy_constitutional:0 "Civil Guarantees"
 COLDWAR_BRA_policy_constitutional_desc:0 "End exceptional powers through a genuine constitutional reform. Early adoption is alternative history."
 COLDWAR_BRA_policy_energy_resilience:0 "Energy Resilience"
 COLDWAR_BRA_policy_energy_resilience_desc:0 "Maintain a diversified energy and resource system against external cost shocks."
 COLDWAR_BRA_policy_event_constitution_option_0:0 "The Constitutional Settlement: Strengthen social guarantees"
 COLDWAR_BRA_policy_event_constitution_option_0_desc:0 "Give social guarantees priority in the constitutional settlement, increasing the cost of public commitments."
 COLDWAR_BRA_policy_event_constitution_option_1:0 "The Constitutional Settlement: Prioritise governability"
 COLDWAR_BRA_policy_event_constitution_option_1_desc:0 "Give the executive more room to govern, at the cost of narrower social guarantees and weaker public consent."
 COLDWAR_BRA_policy_event_debt_crisis_option_0:0 "The External Credit Squeeze: Negotiate an adjustment programme"
 COLDWAR_BRA_policy_event_debt_crisis_option_0_desc:0 "Accept creditor adjustment to ease borrowing costs, while reducing investment."
 COLDWAR_BRA_policy_event_debt_crisis_option_1:0 "The External Credit Squeeze: Defend domestic investment"
 COLDWAR_BRA_policy_event_debt_crisis_option_1_desc:0 "Protect domestic investment, accepting higher borrowing costs and a larger fiscal cost from inflation."
 COLDWAR_BRA_policy_event_inflation_settlement_option_0:0 "Prices, Wages and Credit: Negotiated stabilisation"
 COLDWAR_BRA_policy_event_inflation_settlement_option_0_desc:0 "Fund negotiated stabilisation to reduce inflation-related public costs, accepting slower investment."
 COLDWAR_BRA_policy_event_inflation_settlement_option_1:0 "Prices, Wages and Credit: Production first"
 COLDWAR_BRA_policy_event_inflation_settlement_option_1_desc:0 "Protect production, accepting higher inflation-related public costs."
 COLDWAR_BRA_policy_event_officer_council_option_0:0 "The Officer Council: Protect the command hierarchy"
 COLDWAR_BRA_policy_event_officer_council_option_0_desc:0 "Keep operational authority concentrated in the services, limiting civilian influence over defence administration."
 COLDWAR_BRA_policy_event_officer_council_option_1:0 "The Officer Council: Bring civilian specialists into cabinet"
 COLDWAR_BRA_policy_event_officer_council_option_1_desc:0 "Bring civilian technical advisers into cabinet deliberations, increasing the demands on public administration."
 COLDWAR_BRA_policy_event_oil_shock_option_0:0 "The Imported Oil Bill: Protect investment"
 COLDWAR_BRA_policy_event_oil_shock_option_0_desc:0 "Maintain industrial investment through the surge in world oil prices, accepting higher inflation-related fiscal costs."
 COLDWAR_BRA_policy_event_oil_shock_option_1:0 "The Imported Oil Bill: Restrain consumption"
 COLDWAR_BRA_policy_event_oil_shock_option_1_desc:0 "Restrain consumption to limit inflation-related public costs, accepting lower industrial output."
 COLDWAR_BRA_policy_event_party_reform_option_0:0 "The Party Reorganisation: Register competing civilian organisations"
 COLDWAR_BRA_policy_event_party_reform_option_0_desc:0 "Allow a wider range of civilian parties to organise, making the political transition more contested."
 COLDWAR_BRA_policy_event_party_reform_option_1:0 "The Party Reorganisation: Negotiate a limited transition"
 COLDWAR_BRA_policy_event_party_reform_option_1_desc:0 "Limit the transition through agreement with military leaders, preserving more institutional continuity."
 COLDWAR_BRA_policy_event_party_split_option_0:0 "The Labourist Naming Dispute: Recognise distinct PTB and PDT organisations"
 COLDWAR_BRA_policy_event_party_split_option_0_desc:0 "Recognise PTB and PDT as separate organisations after the dispute over the PTB name."
 COLDWAR_BRA_policy_event_us_rights_option_0:0 "Military Aid and Human Rights: Retain agreed cooperation"
 COLDWAR_BRA_policy_event_us_rights_option_0_desc:0 "Preserve military training ties despite disagreement over human-rights conditions in US security cooperation."
 COLDWAR_BRA_policy_event_us_rights_option_1:0 "Military Aid and Human Rights: Denounce the military arrangement"
 COLDWAR_BRA_policy_event_us_rights_option_1_desc:0 "End the military arrangement over the dispute, asserting independence while losing part of the defence relationship."
 COLDWAR_BRA_policy_export_discipline:0 "Export Discipline"
 COLDWAR_BRA_policy_export_discipline_desc:0 "Reorient development toward export receipts and abandon the initial indiscriminate credit expansion."
 COLDWAR_BRA_policy_exports_arms:0 "Defence Export Office"
 COLDWAR_BRA_policy_exports_arms_desc:0 "Organise a defence-export office around customer support and production standards. Export preparation can improve factory output, while adapting equipment and providing support raises procurement costs."
 COLDWAR_BRA_policy_extension:0 "Regional Extension"
 COLDWAR_BRA_policy_extension_desc:0 "Use long-term regional extension and cooperative credit without a general land redistribution."
 COLDWAR_BRA_policy_frontier_admin:0 "Frontier Administration"
 COLDWAR_BRA_policy_frontier_admin_desc:0 "Expand permanent civil administration and compensation in the frontier, accepting continuing contestation."
 COLDWAR_BRA_policy_frontier_safeguards:0 "Frontier Safeguards"
 COLDWAR_BRA_policy_frontier_safeguards_desc:0 "Protect indigenous rights and establish project review before frontier expansion."
 COLDWAR_BRA_policy_industrial_standards:0 "Industrial Standards"
 COLDWAR_BRA_policy_industrial_standards_desc:0 "Create standards and quality-control capacity for national manufacturers."
 COLDWAR_BRA_policy_itamaraty:0 "Itamaraty Review"
 COLDWAR_BRA_policy_itamaraty_desc:0 "Define practical diplomatic priorities without committing any foreign player."
 COLDWAR_BRA_policy_land_titles:0 "Rural Settlement"
 COLDWAR_BRA_policy_land_titles_desc:0 "Regularise landholding and expand public extension, accepting conflict and administrative costs."
 COLDWAR_BRA_policy_licensed_tools:0 "Licensed Tooling"
 COLDWAR_BRA_policy_licensed_tools_desc:0 "Acquire tooling and production methods under licence. The engineering programme provides access to outside techniques, while the continuing appropriation and specialist training remain real costs."
 COLDWAR_BRA_policy_manaus:0 "Manaus Industry"
 COLDWAR_BRA_policy_manaus_desc:0 "Expand the Manaus zone through real facilities and explicit tax concessions."
 COLDWAR_BRA_policy_mdb_0:0 "Congressional Reform"
 COLDWAR_BRA_policy_mdb_0_desc:0 "Rebuild parliamentary oversight and a broad civilian government. Governing before the historical transition is alternative history."
 COLDWAR_BRA_policy_mdb_1:0 "Negotiated Amnesty"
 COLDWAR_BRA_policy_mdb_1_desc:0 "Seek a negotiated transition and amnesty, accepting limits on accountability."
 COLDWAR_BRA_policy_mdb_2:0 "Judicial Accountability"
 COLDWAR_BRA_policy_mdb_2_desc:0 "Restore judicial independence and investigate state coercion despite military resistance."
 COLDWAR_BRA_policy_mdb_5:0 "Public Accounts"
 COLDWAR_BRA_policy_mdb_5_desc:0 "Give congressional scrutiny a permanent public-accounts office. Auditors need access to ministers and spending records; establishing that authority consumes political capital before it can restrain administrative costs."
 COLDWAR_BRA_policy_mdb_6:0 "Federal Guarantees"
 COLDWAR_BRA_policy_mdb_6_desc:0 "Distribute authority across federal institutions and accept the cost of coalition bargaining."
 COLDWAR_BRA_policy_mdb_7:0 "Social Covenant"
 COLDWAR_BRA_policy_mdb_7_desc:0 "Expand social rights through a broad parliamentary compromise."
 COLDWAR_BRA_policy_mdb_8:0 "Fiscal Covenant"
 COLDWAR_BRA_policy_mdb_8_desc:0 "Constrain unfunded commitments to improve financing conditions."
 COLDWAR_BRA_policy_mdb_9:0 "Civilian Republic"
 COLDWAR_BRA_policy_mdb_9_desc:0 "Consolidate civilian institutions while leaving room for distinct economic choices within the PMDB."
 COLDWAR_BRA_policy_mechanised:0 "Vehicle Workshops"
 COLDWAR_BRA_policy_mechanised_desc:0 "Expand vehicle workshops with an explicit cost for domestic production depth."
 COLDWAR_BRA_policy_military_0:0 "Security Cabinet"
 COLDWAR_BRA_policy_military_0_desc:0 "Coordinate the presidency, service ministries and national security apparatus under the existing military government."
 COLDWAR_BRA_policy_military_1:0 "Retain AI-5"
 COLDWAR_BRA_policy_military_1_desc:0 "Preserve exceptional executive powers and the security services, at the cost of consent and civil liberties."
 COLDWAR_BRA_policy_military_2:0 "Controlled Opening"
 COLDWAR_BRA_policy_military_2_desc:0 "Accelerate political reform under military supervision, while retaining leverage for officers who oppose a rapid transition."
 COLDWAR_BRA_policy_military_5:0 "Defence Engineers"
 COLDWAR_BRA_policy_military_5_desc:0 "Expand a domestic engineering base while accepting the cost of maintaining small production runs."
 COLDWAR_BRA_policy_military_6:0 "Service Coordination"
 COLDWAR_BRA_policy_military_6_desc:0 "Improve coordination across services while retaining their institutional budgets."
 COLDWAR_BRA_policy_military_7:0 "National Champions"
 COLDWAR_BRA_policy_military_7_desc:0 "Concentrate credit in strategic national firms and accept contingent fiscal exposure."
 COLDWAR_BRA_policy_military_8:0 "Procurement Rules"
 COLDWAR_BRA_policy_military_8_desc:0 "Standardise procurement and end prestige orders at the expense of some domestic production."
 COLDWAR_BRA_policy_military_9:0 "A Defined Mandate"
 COLDWAR_BRA_policy_military_9_desc:0 "Give the service leadership a defined mission, clear responsibilities and a professional review of its institutional role."
 COLDWAR_BRA_policy_national_tools:0 "National Tooling"
 COLDWAR_BRA_policy_national_tools_desc:0 "Prioritise a national tooling base with a narrower technology pool."
 COLDWAR_BRA_policy_ocean_fleet:0 "Oceanic Fleet"
 COLDWAR_BRA_policy_ocean_fleet_desc:0 "Maintain an oceanic fleet with a large specialist and operating burden."
 COLDWAR_BRA_policy_offshore:0 "Offshore Petrobras"
 COLDWAR_BRA_policy_offshore_desc:0 "Fund offshore exploration and refining expertise, accepting the risk that reserves may not prove commercially viable."
 COLDWAR_BRA_policy_pcb_0:0 "Communist Coalition"
 COLDWAR_BRA_policy_pcb_0_desc:0 "Bring the Communist coalition into the institutions of government. Coordinating a broad parliamentary and labour alliance strengthens its ability to act, but negotiating that coalition requires political capital."
 COLDWAR_BRA_policy_pcb_1:0 "Pluralist Transition"
 COLDWAR_BRA_policy_pcb_1_desc:0 "Pursue a broad democratic transition while sharing authority with other left parties."
 COLDWAR_BRA_policy_pcb_2:0 "Cadre Direction"
 COLDWAR_BRA_policy_pcb_2_desc:0 "Concentrate authority in party cadres to direct industrial targets."
 COLDWAR_BRA_policy_pcb_6:0 "Public Ownership"
 COLDWAR_BRA_policy_pcb_6_desc:0 "Support long production runs through public firms and a recurring capital programme."
 COLDWAR_BRA_policy_pcb_7:0 "National Communism"
 COLDWAR_BRA_policy_pcb_7_desc:0 "Concentrate the industrial allocation on a domestic civilian plant and nationally directed engineering. Local production strengthens the public sector, while a narrower technical network slows general research."
 COLDWAR_BRA_policy_pcb_8:0 "International Links"
 COLDWAR_BRA_policy_pcb_8_desc:0 "Fund technical exchange through a research office and wider scientific contacts. The government gains access to outside methods, while sustaining trained staff increases education spending."
 COLDWAR_BRA_policy_pcb_9:0 "A Socialist Mandate"
 COLDWAR_BRA_policy_pcb_9_desc:0 "Give the socialist mandate a public-service office that can administer national commitments. Service provision can stabilise the coalition, but an expanded programme carries continuing social costs."
 COLDWAR_BRA_policy_pcdob_0:0 "Rural Revolution"
 COLDWAR_BRA_policy_pcdob_0_desc:0 "Develop a distinct alternate governing programme from the PCdoB’s rural revolutionary tradition."
 COLDWAR_BRA_policy_pcdob_1:0 "Peasant Cooperatives"
 COLDWAR_BRA_policy_pcdob_1_desc:0 "Pool equipment and extension services while confronting landholding interests."
 COLDWAR_BRA_policy_pcdob_2:0 "Village Land Titles"
 COLDWAR_BRA_policy_pcdob_2_desc:0 "Prioritise secure household titles and local consent over collective ownership."
 COLDWAR_BRA_policy_pcdob_4:0 "Village Instruction"
 COLDWAR_BRA_policy_pcdob_4_desc:0 "Expand rural instruction under a funded education programme."
 COLDWAR_BRA_policy_pcdob_6:0 "Agrarian Settlement"
 COLDWAR_BRA_policy_pcdob_6_desc:0 "Replace the initial land inequality burden through a costly agrarian settlement."
 COLDWAR_BRA_policy_pcdob_7:0 "People’s Defence"
 COLDWAR_BRA_policy_pcdob_7_desc:0 "Develop infantry-oriented territorial defence with a larger personnel bill."
 COLDWAR_BRA_policy_pcdob_8:0 "Civil Reconstruction"
 COLDWAR_BRA_policy_pcdob_8_desc:0 "Prioritise reconstruction while reducing military institutional weight."
 COLDWAR_BRA_policy_pcdob_9:0 "A Rural Republic"
 COLDWAR_BRA_policy_pcdob_9_desc:0 "Extend the rural programme through agricultural production and a staffed regional office. A material presence gives village commitments substance, while supporting settlement and local services raises social expenditure."
 COLDWAR_BRA_policy_pds_private_suppliers:0 "Private Suppliers"
 COLDWAR_BRA_policy_pds_private_suppliers_desc:0 "Direct the available capital toward domestic private suppliers in Sao Paulo. Technical renewal and a new civilian plant can widen the industrial base, while investment incentives reduce corporate tax receipts. This allocation leaves less capital for public holdings."
 COLDWAR_BRA_policy_pds_strategic_holdings:0 "Strategic Holdings"
 COLDWAR_BRA_policy_pds_strategic_holdings_desc:0 "Reserve this investment allocation for strategic public production in Minas Gerais. National control and a stronger production base are valuable, but financing another public commitment increases exposure to borrowing costs."
 COLDWAR_BRA_policy_pdt_0:0 "Labourist Democracy"
 COLDWAR_BRA_policy_pdt_0_desc:0 "Build Brizola’s democratic labourist alternative with education and national development at its centre."
 COLDWAR_BRA_policy_pdt_1:0 "Full-Time Schools"
 COLDWAR_BRA_policy_pdt_1_desc:0 "Use the CIEP precedent for full-time schooling, with a substantial operating commitment."
 COLDWAR_BRA_policy_pdt_2:0 "Technical Colleges"
 COLDWAR_BRA_policy_pdt_2_desc:0 "Prioritise technical and industrial education over the broader full-time school model."
 COLDWAR_BRA_policy_pdt_3:0 "Teachers Compact"
 COLDWAR_BRA_policy_pdt_3_desc:0 "Place teachers at the centre of the education programme. A regional education office supports training and school administration; the continuing appropriation remains a real commitment alongside the capital work."
 COLDWAR_BRA_policy_pdt_6:0 "Mass Education"
 COLDWAR_BRA_policy_pdt_6_desc:0 "Broaden access to education and remove the initial technical-research bottleneck."
 COLDWAR_BRA_policy_pdt_7:0 "National Ownership"
 COLDWAR_BRA_policy_pdt_7_desc:0 "Retain strategic ownership while accepting narrower foreign technology access."
 COLDWAR_BRA_policy_pdt_8:0 "Licensed Industry"
 COLDWAR_BRA_policy_pdt_8_desc:0 "Acquire industrial methods through licensed production and engineering exchanges. Foreign technical access can speed learning, while imported machinery and specialist support add to education costs."
 COLDWAR_BRA_policy_pdt_9:0 "A National School"
 COLDWAR_BRA_policy_pdt_9_desc:0 "Anchor education in a sustained national programme with stable administrative support."
 COLDWAR_BRA_policy_pfl_0:0 "Liberal Coalition"
 COLDWAR_BRA_policy_pfl_0_desc:0 "Build a conservative civilian coalition from the Liberal Front split, with its own regional and business interests."
 COLDWAR_BRA_policy_pfl_1:0 "Regional Investment"
 COLDWAR_BRA_policy_pfl_1_desc:0 "Direct development investment toward the Northeast through regional political bargains."
 COLDWAR_BRA_policy_pfl_2:0 "National Competition"
 COLDWAR_BRA_policy_pfl_2_desc:0 "Expose protected firms to national competition, accepting regional industrial disruption."
 COLDWAR_BRA_policy_pfl_3:0 "Civil Service Review"
 COLDWAR_BRA_policy_pfl_3_desc:0 "Professionalise appointments while retaining a parliamentary governing bargain."
 COLDWAR_BRA_policy_pfl_5:0 "Small Business"
 COLDWAR_BRA_policy_pfl_5_desc:0 "Direct a limited enterprise allocation toward a civilian producer in Bahia. The project gives smaller employers room to expand, while preferential tax treatment lowers corporate tax receipts."
 COLDWAR_BRA_policy_pfl_6:0 "Civilian Coalition"
 COLDWAR_BRA_policy_pfl_6_desc:0 "Consolidate an elected civilian centre-right coalition."
 COLDWAR_BRA_policy_pfl_7:0 "Social Partnership"
 COLDWAR_BRA_policy_pfl_7_desc:0 "Preserve a social compromise alongside market-oriented development."
 COLDWAR_BRA_policy_pfl_8:0 "Budget Credibility"
 COLDWAR_BRA_policy_pfl_8_desc:0 "Limit development credit and improve the government’s financing position."
 COLDWAR_BRA_policy_pfl_9:0 "Liberal Institutions"
 COLDWAR_BRA_policy_pfl_9_desc:0 "Establish an enterprise-service office with published administrative procedures and access for regional firms. Its work supports civilian institutions, but building support for transparent rules consumes political capital."
 COLDWAR_BRA_policy_pmdb_health_regions:0 "Regional Health"
 COLDWAR_BRA_policy_pmdb_health_regions_desc:0 "Give regional health administration the first claim on the social investment fund. Offices can improve access and coordination across levels of government, while wider public provision creates a continuing social commitment."
 COLDWAR_BRA_policy_pmdb_municipal_services:0 "Municipal Services"
 COLDWAR_BRA_policy_pmdb_municipal_services_desc:0 "Use the first social investment allocation for local access and municipal services in the Northeast. Infrastructure and an administrative office give decentralisation practical means, while operating the expanded network adds to social commitments."
 COLDWAR_BRA_policy_populist_0:0 "Public Probity"
 COLDWAR_BRA_policy_populist_0_desc:0 "Build Lacerda’s electoral programme around accountable government and public integrity."
 COLDWAR_BRA_policy_populist_1:0 "Independent Auditors"
 COLDWAR_BRA_policy_populist_1_desc:0 "Give auditors institutional independence at the expense of executive discretion."
 COLDWAR_BRA_policy_populist_2:0 "Presidential Campaign"
 COLDWAR_BRA_policy_populist_2_desc:0 "Mobilise a personal presidential mandate with greater polarisation."
 COLDWAR_BRA_policy_populist_3:0 "Administrative Reform"
 COLDWAR_BRA_policy_populist_3_desc:0 "Create a professional audit office to examine public contracts and departmental practices. Better records can restrain administrative costs, but establishing the office requires investment and political support."
 COLDWAR_BRA_policy_populist_4:0 "Competitive Imports"
 COLDWAR_BRA_policy_populist_4_desc:0 "Open access to imported machinery while exposing domestic manufacturers."
 COLDWAR_BRA_policy_populist_6:0 "Electoral Government"
 COLDWAR_BRA_policy_populist_6_desc:0 "Restore an electoral mandate without imposing a specific presidential winner."
 COLDWAR_BRA_policy_populist_7:0 "Rapid Competition"
 COLDWAR_BRA_policy_populist_7_desc:0 "Open protected markets to sharper competition. More efficient production brings resistance from established firms and their political allies."
 COLDWAR_BRA_policy_populist_8:0 "Staged Liberalism"
 COLDWAR_BRA_policy_populist_8_desc:0 "Subsidise a slower transition with a continuing adjustment budget."
 COLDWAR_BRA_policy_populist_9:0 "Executive Oversight"
 COLDWAR_BRA_policy_populist_9_desc:0 "Make executive authority answerable to independent oversight."
 COLDWAR_BRA_policy_pragmatism:0 "Pragmatic Diplomacy"
 COLDWAR_BRA_policy_pragmatism_desc:0 "Diversify diplomatic partners despite domestic anticommunist opposition."
 COLDWAR_BRA_policy_prn_0:0 "A New Presidency"
 COLDWAR_BRA_policy_prn_0_desc:0 "Develop a late-1989 personal presidential coalition. PRN is the renamed Party of Youth, not Lacerda’s party."
 COLDWAR_BRA_policy_prn_1:0 "Competition Shock"
 COLDWAR_BRA_policy_prn_1_desc:0 "Open the economy rapidly, accepting disruption and closures among sheltered firms."
 COLDWAR_BRA_policy_prn_2:0 "Negotiated Opening"
 COLDWAR_BRA_policy_prn_2_desc:0 "Fund a slower competitive adjustment with an explicit transition budget."
 COLDWAR_BRA_policy_prn_3:0 "Purchasing Reform"
 COLDWAR_BRA_policy_prn_3_desc:0 "Strengthen accountability in public purchasing through functioning oversight institutions."
 COLDWAR_BRA_policy_prn_4:0 "Industrial Imports"
 COLDWAR_BRA_policy_prn_4_desc:0 "Acquire industrial equipment and technical methods from abroad. Faster access to machinery supports industrial learning, while maintaining imported systems requires continuing technical expenditure."
 COLDWAR_BRA_policy_prn_5:0 "Service Review"
 COLDWAR_BRA_policy_prn_5_desc:0 "Reduce redundant appointments with a real political cost."
 COLDWAR_BRA_policy_prn_6:0 "Presidential Coalition"
 COLDWAR_BRA_policy_prn_6_desc:0 "Keep a heterogeneous governing coalition functioning through parliamentary bargains."
 COLDWAR_BRA_policy_prn_7:0 "Price Restraint"
 COLDWAR_BRA_policy_prn_7_desc:0 "Tighten indexation and credit commitments to reduce inflation’s public cost, accepting slower investment. This does not adopt the 1990 deposit freeze."
 COLDWAR_BRA_policy_prn_8:0 "Productive Credit"
 COLDWAR_BRA_policy_prn_8_desc:0 "Protect industrial credit while accepting higher financing pressure."
 COLDWAR_BRA_policy_prn_9:0 "Public Accountability"
 COLDWAR_BRA_policy_prn_9_desc:0 "Submit presidential administration to effective oversight and legislative bargaining."
 COLDWAR_BRA_policy_proalcool:0 "Alcohol Fuels"
 COLDWAR_BRA_policy_proalcool_desc:0 "Expand ethanol production through Proálcool, diversifying fuel supply while competing for land and food production."
