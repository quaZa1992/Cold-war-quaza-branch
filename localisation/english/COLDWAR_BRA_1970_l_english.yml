 COLDWAR_BRA_policy_pt_8_desc:0 "Expand family-farm credit and extension without a general expropriation programme."
 COLDWAR_BRA_policy_pt_9:0 "Popular Democracy"
 COLDWAR_BRA_policy_pt_9_desc:0 "Sustain a participatory democratic government whose active policy package ends with its tenure."
 COLDWAR_BRA_policy_ptb_0:0 "Labour Guarantees"
 COLDWAR_BRA_policy_ptb_0_desc:0 "Restore the dissolved pre-1965 labourist organisation as an alternative outcome, distinct from Ivete Vargas’s later PTB."
 COLDWAR_BRA_policy_ptb_1:0 "Union Mediation"
 COLDWAR_BRA_policy_ptb_1_desc:0 "Use negotiated corporatist mediation to stabilise industrial relations."
