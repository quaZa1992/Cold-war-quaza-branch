 COLDWAR_BRA_policy_ptb_3:0 "Workplace Insurance"
 COLDWAR_BRA_policy_ptb_3_desc:0 "Extend workplace insurance through a staffed claims office in the industrial heartland. Workers gain a more reliable point of access, while the state accepts a larger continuing social commitment."
