 COLDWAR_BRA_policy_pt_2_desc:0 "Trade workplace autonomy for a negotiated national investment and output agreement."
 COLDWAR_BRA_policy_pt_3:0 "Union Independence"
 COLDWAR_BRA_policy_pt_3_desc:0 "Allow unions and employers to negotiate wages under enforceable labour law."
 COLDWAR_BRA_policy_pt_5:0 "Popular Budgeting"
 COLDWAR_BRA_policy_pt_5_desc:0 "Adapt participatory budgeting, later associated with Porto Alegre, as an alternative approach to local government."
