 COLDWAR_JAP_1970_dsp_policy_0_desc: "Tripartite sector councils build on postwar shunto bargaining by bringing employers, unions and government into productivity negotiations."
 COLDWAR_JAP_1970_dsp_policy_1: "Small Manufacturers"
 COLDWAR_JAP_1970_dsp_policy_1_desc: "Small manufacturers faced pressure to modernise as wages rose and Japan’s exporters moved into higher-value production."
 COLDWAR_JAP_1970_dsp_policy_2: "Employment Insurance"
 COLDWAR_JAP_1970_dsp_policy_2_desc: "An employment-insurance extension cushions workers against restructuring while adding a continuing social-budget obligation."
 COLDWAR_JAP_1970_dsp_policy_3: "Security Review"
 COLDWAR_JAP_1970_dsp_policy_3_desc: "The DSP accepts the existing US alliance while insisting that security policy remain subject to Diet scrutiny and civilian oversight."
 COLDWAR_JAP_1970_dsp_policy_4: "Industry Offices"
 COLDWAR_JAP_1970_dsp_policy_4_desc: "Regional industry offices give local manufacturers access to planning and credit networks concentrated in Tokyo and Osaka."
 COLDWAR_JAP_1970_dsp_institutions: "Tripartite Wage Talks"
 COLDWAR_JAP_1970_dsp_institutions_desc: "A national tripartite wage conference formalises employer-union-government negotiations associated with Japan’s postwar wage rounds."
 COLDWAR_JAP_1970_dsp_industry: "Portable Pensions"
 COLDWAR_JAP_1970_dsp_industry_desc: "Portable pensions address workers moving between firms as industrial restructuring weakens employment-linked benefits."
 COLDWAR_JAP_1970_dsp_society: "Alliance Treaty"
 COLDWAR_JAP_1970_dsp_society_desc: "Diet hearings on the 1960 security treaty legacy keep alliance decisions within the parliamentary process demanded by the opposition."
 COLDWAR_JAP_1970_dsp_diplomacy: "Retraining Boards"
 COLDWAR_JAP_1970_dsp_diplomacy_desc: "Regional retraining boards help workers displaced by industrial change move into new occupations without abandoning collective bargaining."
 COLDWAR_JAP_1970_dsp_programme: "Workplace Safety"
 COLDWAR_JAP_1970_dsp_programme_desc: "Workplace safety inspection extends postwar labour protections, with compliance costs borne by manufacturers and the treasury."
 COLDWAR_JAP_1970_dsp_deep_fork0_a: "A Social Partnership"
 COLDWAR_JAP_1970_dsp_deep_fork0_a_desc: "Give organised labour a formal role in economic coordination."
 COLDWAR_JAP_1970_dsp_deep_fork0_b: "Competitive Labour"
 COLDWAR_JAP_1970_dsp_deep_fork0_b_desc: "Emphasise firm-level bargaining and adaptability."
 COLDWAR_JAP_1970_dsp_deep_fork0_a_follow: "Tripartite Wage Talks"
 COLDWAR_JAP_1970_dsp_deep_fork0_a_follow_desc: "Bring unions, firms and government together over wages and productivity."
 COLDWAR_JAP_1970_dsp_deep_fork0_b_follow: "Enterprise Skills"
 COLDWAR_JAP_1970_dsp_deep_fork0_b_follow_desc: "Support training schemes negotiated within firms."
 COLDWAR_JAP_1970_dsp_deep_fork1_a: "Social Insurance"
 COLDWAR_JAP_1970_dsp_deep_fork1_a_desc: "Extend protection for workers and their families."
 COLDWAR_JAP_1970_dsp_deep_fork1_b: "Fiscal Discipline"
 COLDWAR_JAP_1970_dsp_deep_fork1_b_desc: "Contain insurance costs through stricter financing rules."
 COLDWAR_JAP_1970_dsp_deep_fork1_a_follow: "Portable Pensions"
 COLDWAR_JAP_1970_dsp_deep_fork1_a_follow_desc: "Support continuity of pensions when workers change employers."
 COLDWAR_JAP_1970_dsp_deep_fork1_b_follow: "Insurance Review"
 COLDWAR_JAP_1970_dsp_deep_fork1_b_follow_desc: "Reduce duplication in the administration of social benefits."
 COLDWAR_JAP_1970_dsp_deep_fork2_a: "Democratic Alliance"
 COLDWAR_JAP_1970_dsp_deep_fork2_a_desc: "Support an alliance combined with social reform."
 COLDWAR_JAP_1970_dsp_deep_fork2_b: "Independent Defence"
 COLDWAR_JAP_1970_dsp_deep_fork2_b_desc: "Place more weight on Japan’s own defensive capability."
 COLDWAR_JAP_1970_dsp_deep_fork2_a_follow: "Defence and Welfare"
 COLDWAR_JAP_1970_dsp_deep_fork2_a_follow_desc: "Balance security commitments against domestic social priorities."
 COLDWAR_JAP_1970_dsp_deep_fork2_b_follow: "Defence Budget"
 COLDWAR_JAP_1970_dsp_deep_fork2_b_follow_desc: "Finance a modest expansion of defensive industrial capacity."
 COLDWAR_JAP_1970_dsp_deep_policy_charter: "Democratic Social Pact"
 COLDWAR_JAP_1970_dsp_deep_policy_charter_desc: "The party brings its selected labour and welfare policies into a common programme."
 COLDWAR_JAP_1970_jsp_mandate: "Constitutional Mandate"
 COLDWAR_JAP_1970_jsp_mandate_desc: "The JSP’s constitutional-pacifist programme turns its opposition mandate into a parliamentary alternative to LDP-led security policy."
 COLDWAR_JAP_1970_jsp_policy_0: "Article Nine Resolution"
 COLDWAR_JAP_1970_jsp_policy_0_desc: "The JSP’s Article Nine resolution frames constitutional restraint as a governing commitment, not a change to the constitution."
 COLDWAR_JAP_1970_jsp_policy_1: "National Health Access"
 COLDWAR_JAP_1970_jsp_policy_1_desc: "Japan established universal health insurance in 1961; this proposal addresses uneven service access and the higher public cost of equalisation."
 COLDWAR_JAP_1970_jsp_policy_2: "Municipal Housing"
 COLDWAR_JAP_1970_jsp_policy_2_desc: "Municipal housing grants answer postwar crowding and rising urban rents without treating public housing as a new national system."
 COLDWAR_JAP_1970_jsp_policy_3: "Labour Rights"
 COLDWAR_JAP_1970_jsp_policy_3_desc: "Stronger labour-rights enforcement extends union protections while requiring firms to absorb higher compliance and bargaining costs."
 COLDWAR_JAP_1970_jsp_policy_4: "Asian Reconciliation"
 COLDWAR_JAP_1970_jsp_policy_4_desc: "The JSP’s Asian reconciliation programme reflects postwar demands for accountability and Japan’s later development assistance in the region."
 COLDWAR_JAP_1970_jsp_institutions: "Socialist Caucus"
 COLDWAR_JAP_1970_jsp_institutions_desc: "A socialist parliamentary caucus coordinates welfare legislation across Diet committees within Japan’s multiparty system."
 COLDWAR_JAP_1970_jsp_industry: "Local Welfare"
 COLDWAR_JAP_1970_jsp_industry_desc: "Local welfare administration builds on Japan’s 1961 universal-insurance framework by improving access through municipal services."
 COLDWAR_JAP_1970_jsp_society: "Equal School Access"
 COLDWAR_JAP_1970_jsp_society_desc: "Equal-school opportunity extends postwar education reforms as secondary and higher education reshape Japan’s workforce."
 COLDWAR_JAP_1970_jsp_diplomacy: "Asian Civic Exchange"
 COLDWAR_JAP_1970_jsp_diplomacy_desc: "Asian civic exchanges support reconciliation through universities and civil society rather than imposing a settlement on neighbouring states."
 COLDWAR_JAP_1970_jsp_programme: "Diet Security"
 COLDWAR_JAP_1970_jsp_programme_desc: "A Diet security committee gives constitutional-pacifist parties a formal route to scrutinise alliance policy and military planning."
 COLDWAR_JAP_1970_jsp_deep_fork0_a: "Unarmed Neutrality"
 COLDWAR_JAP_1970_jsp_deep_fork0_a_desc: "Pursue neutrality with a pronounced reduction in military commitments."
 COLDWAR_JAP_1970_jsp_deep_fork0_b: "Defensive Neutrality"
 COLDWAR_JAP_1970_jsp_deep_fork0_b_desc: "Maintain a limited defensive force while pursuing neutrality."
 COLDWAR_JAP_1970_jsp_deep_fork0_a_follow: "Civilian Peace Office"
 COLDWAR_JAP_1970_jsp_deep_fork0_a_follow_desc: "Prioritise civilian institutions in national security planning."
 COLDWAR_JAP_1970_jsp_deep_fork0_b_follow: "Diet Defence Control"
 COLDWAR_JAP_1970_jsp_deep_fork0_b_follow_desc: "Keep a limited defensive force under close Diet scrutiny."
 COLDWAR_JAP_1970_jsp_deep_fork1_a: "Public Enterprises"
 COLDWAR_JAP_1970_jsp_deep_fork1_a_desc: "Give public enterprises a stronger role in investment."
 COLDWAR_JAP_1970_jsp_deep_fork1_b: "Mixed Economy"
 COLDWAR_JAP_1970_jsp_deep_fork1_b_desc: "Use regulation and bargaining alongside private production."
 COLDWAR_JAP_1970_jsp_deep_fork1_a_follow: "Public Investment"
 COLDWAR_JAP_1970_jsp_deep_fork1_a_follow_desc: "Place investment decisions under public accountability."
 COLDWAR_JAP_1970_jsp_deep_fork1_b_follow: "Regional Social Pacts"
 COLDWAR_JAP_1970_jsp_deep_fork1_b_follow_desc: "Coordinate unions, firms and local authorities."
 COLDWAR_JAP_1970_jsp_deep_fork2_a: "Labour Rights"
 COLDWAR_JAP_1970_jsp_deep_fork2_a_desc: "Strengthen collective bargaining and the position of employees."
 COLDWAR_JAP_1970_jsp_deep_fork2_b: "Welfare over Controls"
 COLDWAR_JAP_1970_jsp_deep_fork2_b_desc: "Concentrate public spending on social services rather than wage policy."
 COLDWAR_JAP_1970_jsp_deep_fork2_a_follow: "Public Employee Talks"
 COLDWAR_JAP_1970_jsp_deep_fork2_a_follow_desc: "Establish a structured channel for public-sector bargaining."
 COLDWAR_JAP_1970_jsp_deep_fork2_b_follow: "Local Welfare"
 COLDWAR_JAP_1970_jsp_deep_fork2_b_follow_desc: "Help local authorities deliver the chosen social programme."
 COLDWAR_JAP_1970_jsp_deep_policy_charter: "Socialist Programme"
 COLDWAR_JAP_1970_jsp_deep_policy_charter_desc: "The party combines its selected social and constitutional priorities."
 COLDWAR_JAP_1970_jcp_mandate: "Parliamentary Road"
 COLDWAR_JAP_1970_jcp_mandate_desc: "The JCP’s independent parliamentary road rejects both insurrection and subordination to foreign communist parties."
 COLDWAR_JAP_1970_jcp_policy_0: "Anti-Monopoly"
 COLDWAR_JAP_1970_jcp_policy_0_desc: "An anti-monopoly commission challenges the concentration of finance and production that accompanied Japan’s postwar industrial expansion."
 COLDWAR_JAP_1970_jcp_policy_1: "Tenant and Land Laws"
 COLDWAR_JAP_1970_jcp_policy_1_desc: "The JCP’s tenant and land-reform platform revisits rural inequality after the postwar redistribution of farmland."
 COLDWAR_JAP_1970_jcp_policy_2: "Public Enterprise Audit"
 COLDWAR_JAP_1970_jcp_policy_2_desc: "A public-enterprise audit subjects state-linked firms and public corporations to parliamentary cost and performance review."
 COLDWAR_JAP_1970_jcp_policy_3: "Asian Diplomacy"
 COLDWAR_JAP_1970_jcp_policy_3_desc: "Independent Asian diplomacy follows the JCP’s refusal to align Japan automatically with Washington, Moscow or Beijing."
 COLDWAR_JAP_1970_jcp_policy_4: "Independent Party"
 COLDWAR_JAP_1970_jcp_policy_4_desc: "A self-financed party organisation protects the JCP’s capacity to campaign and govern without reliance on corporate donations."
 COLDWAR_JAP_1970_jcp_institutions: "Labour Mediation"
 COLDWAR_JAP_1970_jcp_institutions_desc: "Labour-dispute mediation offers an institutional alternative to prolonged strikes as the JCP seeks to represent industrial workers."
 COLDWAR_JAP_1970_jcp_industry: "Constitutional Peace"
 COLDWAR_JAP_1970_jcp_industry_desc: "A constitutional peace forum ties the JCP’s anti-war platform to public review of Japan’s postwar security arrangements."
 COLDWAR_JAP_1970_jcp_society: "Utility Councils"
 COLDWAR_JAP_1970_jcp_society_desc: "Utility consumer councils give households a voice in energy and service costs generated by rapid urbanisation."
 COLDWAR_JAP_1970_jcp_diplomacy: "Anti-Monopoly Talks"
 COLDWAR_JAP_1970_jcp_diplomacy_desc: "Democratic anti-monopoly hearings make the JCP’s economic programme answerable to voters and parliamentary scrutiny."
 COLDWAR_JAP_1970_jcp_programme: "Public Works Review"
 COLDWAR_JAP_1970_jcp_programme_desc: "A public-works review board links the JCP’s infrastructure proposals to open procurement and local oversight."
 COLDWAR_JAP_1970_jcp_deep_fork0_a: "Public Ownership"
 COLDWAR_JAP_1970_jcp_deep_fork0_a_desc: "Place strategic enterprises under stronger public ownership."
 COLDWAR_JAP_1970_jcp_deep_fork0_b: "Cooperative Economy"
 COLDWAR_JAP_1970_jcp_deep_fork0_b_desc: "Support cooperatives and small producers alongside public firms."
 COLDWAR_JAP_1970_jcp_deep_fork0_a_follow: "Enterprise Oversight"
 COLDWAR_JAP_1970_jcp_deep_fork0_a_follow_desc: "Create oversight for the newly enlarged public sector."
 COLDWAR_JAP_1970_jcp_deep_fork0_b_follow: "Cooperative Credit"
 COLDWAR_JAP_1970_jcp_deep_fork0_b_follow_desc: "Direct public credit to worker and agricultural cooperatives."
 COLDWAR_JAP_1970_jcp_deep_fork1_a: "Demilitarised Republic"
 COLDWAR_JAP_1970_jcp_deep_fork1_a_desc: "Pursue substantial demilitarisation and a civilian security policy."
 COLDWAR_JAP_1970_jcp_deep_fork1_b: "Territorial Defence"
 COLDWAR_JAP_1970_jcp_deep_fork1_b_desc: "Retain a limited national force under civilian authority."
 COLDWAR_JAP_1970_jcp_deep_fork1_a_follow: "Civilian Peace"
 COLDWAR_JAP_1970_jcp_deep_fork1_a_follow_desc: "Give civilian authorities primary responsibility for security policy."
 COLDWAR_JAP_1970_jcp_deep_fork1_b_follow: "Civilian Defence"
 COLDWAR_JAP_1970_jcp_deep_fork1_b_follow_desc: "Subject the remaining defence establishment to public oversight."
 COLDWAR_JAP_1970_jcp_deep_fork2_a: "Price Controls"
 COLDWAR_JAP_1970_jcp_deep_fork2_a_desc: "Use public oversight to protect households from rising essential costs."
 COLDWAR_JAP_1970_jcp_deep_fork2_b: "Small Producers"
 COLDWAR_JAP_1970_jcp_deep_fork2_b_desc: "Protect small firms and cooperatives while retaining regulated markets."
 COLDWAR_JAP_1970_jcp_deep_fork2_a_follow: "Consumer Protection"
 COLDWAR_JAP_1970_jcp_deep_fork2_a_follow_desc: "Establish local institutions for monitoring household prices."
 COLDWAR_JAP_1970_jcp_deep_fork2_b_follow: "Small Enterprise Credit"
 COLDWAR_JAP_1970_jcp_deep_fork2_b_follow_desc: "Expand access to working capital for smaller enterprises."
 COLDWAR_JAP_1970_jcp_deep_policy_charter: "Socialist Programme"
 COLDWAR_JAP_1970_jcp_deep_policy_charter_desc: "The party consolidates its chosen parliamentary socialist programme."
 COLDWAR_JAP_1970_komeito_mandate: "Clean Government"
 COLDWAR_JAP_1970_komeito_mandate_desc: "Komeito’s clean-government platform builds on its Buddhist lay constituency and postwar campaigns for transparent civilian politics."
 COLDWAR_JAP_1970_komeito_policy_0: "Political Finance"
 COLDWAR_JAP_1970_komeito_policy_0_desc: "Political-finance disclosure answers public concern over factional money politics and opaque governing-party funding networks."
 COLDWAR_JAP_1970_komeito_policy_1: "Consumer Affairs"
 COLDWAR_JAP_1970_komeito_policy_1_desc: "A consumer-affairs bureau gives households a stronger voice over product safety and the quality of expanding mass markets."
 COLDWAR_JAP_1970_komeito_policy_2: "Urban Transit Planning"
 COLDWAR_JAP_1970_komeito_policy_2_desc: "Integrated urban-transit planning addresses congestion and access problems created by Japan’s rapid postwar metropolitan growth."
 COLDWAR_JAP_1970_komeito_policy_3: "Pollution Victim Relief"
 COLDWAR_JAP_1970_komeito_policy_3_desc: "Compensation for pollution victims responds to severe industrial-health cases and makes corporate liability part of consumer welfare."
 COLDWAR_JAP_1970_komeito_policy_4: "Diet Ethics"
 COLDWAR_JAP_1970_komeito_policy_4_desc: "A Diet ethics commission gives Komeito’s anti-corruption campaign a formal parliamentary oversight mechanism."
 COLDWAR_JAP_1970_komeito_institutions: "Consumer Price Talks"
 COLDWAR_JAP_1970_komeito_institutions_desc: "Price hearings address inflation and prepare households for possible future oil shocks."
 COLDWAR_JAP_1970_komeito_industry: "Peace Delegation"
 COLDWAR_JAP_1970_komeito_industry_desc: "Regional peace delegations extend Komeito’s civilian diplomacy through public exchanges rather than military commitments."
 COLDWAR_JAP_1970_komeito_society: "Pollution Claims"
 COLDWAR_JAP_1970_komeito_society_desc: "A pollution-claims tribunal offers residents a public route to seek remedies for industrial harm without prescribing an automatic ruling."
 COLDWAR_JAP_1970_komeito_diplomacy: "Procurement Review"
 COLDWAR_JAP_1970_komeito_diplomacy_desc: "Public-procurement review makes state contracts more transparent as public investment expands beyond the largest metropolitan areas."
 COLDWAR_JAP_1970_komeito_programme: "Household Housing"
 COLDWAR_JAP_1970_komeito_programme_desc: "Household housing finance responds to postwar urban crowding while exposing the treasury to subsidised-credit costs."
 COLDWAR_JAP_1970_komeito_deep_fork0_a: "Public Housing"
 COLDWAR_JAP_1970_komeito_deep_fork0_a_desc: "Use public investment to address the needs of urban families."
 COLDWAR_JAP_1970_komeito_deep_fork0_b: "Consumer Relief"
 COLDWAR_JAP_1970_komeito_deep_fork0_b_desc: "Concentrate assistance on household purchasing power."
 COLDWAR_JAP_1970_komeito_deep_fork0_a_follow: "Metropolitan Housing"
 COLDWAR_JAP_1970_komeito_deep_fork0_a_follow_desc: "Help local authorities finance affordable housing."
 COLDWAR_JAP_1970_komeito_deep_fork0_b_follow: "Consumer Protection"
 COLDWAR_JAP_1970_komeito_deep_fork0_b_follow_desc: "Give consumers a stronger voice in public administration."
 COLDWAR_JAP_1970_komeito_deep_fork1_a: "Humanitarian Welfare"
 COLDWAR_JAP_1970_komeito_deep_fork1_a_desc: "Place social insurance and public health at the centre of policy."
 COLDWAR_JAP_1970_komeito_deep_fork1_b: "Small Business Pact"
 COLDWAR_JAP_1970_komeito_deep_fork1_b_desc: "Support urban small businesses and competitive local markets."
 COLDWAR_JAP_1970_komeito_deep_fork1_a_follow: "Community Health"
 COLDWAR_JAP_1970_komeito_deep_fork1_a_follow_desc: "Strengthen local access to medical services."
 COLDWAR_JAP_1970_komeito_deep_fork1_b_follow: "Fair Retail Competition"
 COLDWAR_JAP_1970_komeito_deep_fork1_b_follow_desc: "Encourage small retailers while limiting administrative burdens."
 COLDWAR_JAP_1970_komeito_deep_fork2_a: "Active Neutrality"
 COLDWAR_JAP_1970_komeito_deep_fork2_a_desc: "Seek a more independent and neutral diplomatic position."
 COLDWAR_JAP_1970_komeito_deep_fork2_b: "Security Cooperation"
 COLDWAR_JAP_1970_komeito_deep_fork2_b_desc: "Maintain security cooperation while pursuing social reform."
 COLDWAR_JAP_1970_komeito_deep_fork2_a_follow: "Civilian Peace"
 COLDWAR_JAP_1970_komeito_deep_fork2_a_follow_desc: "Prioritise civilian cooperation and diplomatic dialogue."
 COLDWAR_JAP_1970_komeito_deep_fork2_b_follow: "Diet Security Oversight"
 COLDWAR_JAP_1970_komeito_deep_fork2_b_follow_desc: "Subject security cooperation to closer public scrutiny."
 COLDWAR_JAP_1970_komeito_deep_policy_charter: "Humanitarian Rule"
 COLDWAR_JAP_1970_komeito_deep_policy_charter_desc: "The party consolidates its chosen welfare and political priorities."
