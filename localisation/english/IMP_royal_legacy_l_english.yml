l_english:
# IMPERIA CW — Cold War: Imperia royal legacy — English localisation.
 IMP_royal_legacy.5.t: "The monarchy abolished!"
 IMP_royal_legacy.5.d: "Sensing the change in time, the British monarch has today undertaken steps to revoke their claims on the throne. In the meantime, government officials are making sure that the founding documents of our country are rewritten in a way as to no monarch being necessary to represent it.\nThis is the end of the British monarchy."
 IMP_royal_legacy.5.o1: "Good riddance."
 IMP_royal_legacy.25.t: "Queen Elizabeth II dies"
 IMP_royal_legacy.25.d: "Elizabeth Alexandra Mary, daughter of George VI, has peacefully passed in her sleep. She was nearly 100 years old and had been queen for nearly 70.\n\nThe nation and the commonwealth at large are in mourning. The long reign of the queen oversaw the end of the Empire, the revitalization of the Home Islands, the entry into the European Union and a proud and strong start into the dawning 3rd millennium.\n\nThe queen was a living legend. But every legend eventually dies."
 IMP_royal_legacy.25.o1: "She will reign in heaven now."
 IMP_royal_legacy.26.t: "King Charles III dies"
 IMP_royal_legacy.26.d: "'Charles is dead', a newspaper titles, followed by the subheading 'Only few are mourning'.\n\nKing Charles III was historically unpopular, comparable to the likes of his grand uncle Edward VIII.\n\nHis son, William V, will surely be a more popular king for the British people."
 IMP_royal_legacy.26.o1: "No king rules forever."
 ENG_king_charles_3: "King Charles III"
 ENG_king_charles_3_desc: "King Charles III, son of Elizabeth II, was the longest serving heir apparant in the history of the British monarchy before ascending to the throne. His former scandals, especially the death of his first wife Diana, has made him sort of a shame for the monarchy though."
 ENG_king_william_5: "King William V"
 ENG_king_william_5_desc: "King William V, son of Charles III, is far more like his grandmother in terms of popularity than his father ever could have wished to be. He did not reach the legendary status of Queen Elizabeth II yet, but he stands as a calm and popular rock of unity to the British people."
