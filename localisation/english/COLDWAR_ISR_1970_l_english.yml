l_english:
# IMPERIA COLD WAR — Cold War: Israel 1970 national programme.
 COLDWAR_ISR_1970_focus: "Israel"
 COLDWAR_ISR_alignment_tree_shortcut: "Alignment"
 COLDWAR_ISR_likud_tree_shortcut: "Gahal and Likud"
 COLDWAR_ISR_mafdal_tree_shortcut: "Mafdal"
 COLDWAR_ISR_small_parties_tree_shortcut: "The Smaller Parties"
 COLDWAR_ISR_economy_tree_shortcut: "The Economy"
 COLDWAR_ISR_territories_tree_shortcut: "The Territories"
 COLDWAR_ISR_society_tree_shortcut: "Society"
 COLDWAR_ISR_zahal_tree_shortcut: "Zahal"
 FOCUS_FILTER_COLDWAR_ISR_PARTIES: "Israel: Parties and Governments"
 FOCUS_FILTER_COLDWAR_ISR_ECONOMY: "Israel: Above Its Weight"
 FOCUS_FILTER_COLDWAR_ISR_ALIYAH: "Israel: Aliyah and Absorption"
 FOCUS_FILTER_COLDWAR_ISR_TERRITORIES: "Israel: The Territories"
 FOCUS_FILTER_COLDWAR_ISR_SOCIETY: "Israel: Society"
 FOCUS_FILTER_COLDWAR_ISR_IDF: "Israel: Zahal"
 FOCUS_FILTER_COLDWAR_ISR_SECURITY: "Israel: Security and Intelligence"
 FOCUS_FILTER_COLDWAR_ISR_FOREIGN: "Israel in the World"
 COLDWAR_ISR_aln_e: "Golda's Government"
 COLDWAR_ISR_aln_e_desc: "The Prime Minister's kitchen in Jerusalem is where Israel is governed. Golda holds the Alignment, the unity government and the war together, for now."
 COLDWAR_ISR_aln_pol: "The Mapai Machine"
 COLDWAR_ISR_aln_pol_desc: "Histadrut posts, kibbutz votes and party branches in every town deliver the Alignment its majority. The machine works, and it remembers who it owes."
 COLDWAR_ISR_aln_eco: "Sapir's Ledger"
 COLDWAR_ISR_aln_eco_desc: "Pinhas Sapir keeps the state's money in a little black notebook and personally decides where the next factory goes."
 COLDWAR_ISR_aln_lw1: "Open the Party Lists"
 COLDWAR_ISR_aln_lw1_desc: "For the first time the party's candidates are chosen by a broad centre, not only by the old leadership."
 COLDWAR_ISR_aln_a1: "The Kitchen Cabinet"
 COLDWAR_ISR_aln_a1_desc: "Golda decides on Saturday evenings with Dayan, Allon, Galili and Sapir in her kitchen. The full cabinet ratifies on Sunday."
 COLDWAR_ISR_aln_a2: "Collective Responsibility"
 COLDWAR_ISR_aln_a2_desc: "Every coalition partner sits at the table and shares the blame. Decisions are slower, but nobody can say they were not asked."
 COLDWAR_ISR_aln_b1: "Partnership with the Histadrut"
 COLDWAR_ISR_aln_b1_desc: "The labour federation owns factories, banks, the health fund and the construction giant Solel Boneh. A government that works with it builds fast and strikes rarely."
 COLDWAR_ISR_aln_b2: "Sapir's Industrial Drive"
 COLDWAR_ISR_aln_b2_desc: "Sapir offers grants and cheap loans to anyone who opens a factory in a development town. Private capital comes, and the unions grumble."
 COLDWAR_ISR_aln_un1: "The Export Drive"
 COLDWAR_ISR_aln_un1_desc: "Citrus, diamonds and textiles: every dollar earned abroad pays for a Phantom."
 COLDWAR_ISR_aln_lw2: "The Panthers' Demands"
 COLDWAR_ISR_aln_lw2_desc: "Young men from Musrara call themselves Black Panthers. The government sets up a committee and spends money in the slums."
 COLDWAR_ISR_aln_a1f: "Galili's Document"
 COLDWAR_ISR_aln_a1f_desc: "Minister without Portfolio Yisrael Galili writes down what the Alignment will build in the territories over four years. The paper is a compromise that satisfies no one."
 COLDWAR_ISR_aln_a2f: "The Broad Coalition"
 COLDWAR_ISR_aln_a2f_desc: "Seven parties, one cabinet, and the war at the canal: the broadest coalition in Israel's history keeps the country united."
 COLDWAR_ISR_aln_b1f: "Solel Boneh Builds"
 COLDWAR_ISR_aln_b1f_desc: "The Histadrut construction company builds roads, housing blocks and the Bar-Lev forts, all at once."
 COLDWAR_ISR_aln_b2f: "Development Town Factories"
 COLDWAR_ISR_aln_b2f_desc: "Textile mills in Dimona and Beit She'an give the new immigrants work. The subsidies are generous and the books are not always clean."
 COLDWAR_ISR_aln_un2: "Science-Based Industry"
 COLDWAR_ISR_aln_un2_desc: "The Weizmann Institute and the Technion spin off companies that build medical scanners and printing systems."
 COLDWAR_ISR_aln_lw3: "Housing for the Periphery"
 COLDWAR_ISR_aln_lw3_desc: "The ministry builds thousands of flats in Kiryat Shmona, Yeruham and Ofakim."
 COLDWAR_ISR_aln_pm: "The Allon Plan"
 COLDWAR_ISR_aln_pm_desc: "Keep the Jordan Valley and the Golan, return the populated hills: Yigal Allon's map is the government's unofficial plan."
 COLDWAR_ISR_aln_em: "Absorbing the Ingathering"
 COLDWAR_ISR_aln_em_desc: "Every immigrant needs a flat, a Hebrew class and a job. The Jewish Agency pays a part, the state the rest."
 COLDWAR_ISR_aln_un3: "The Chief Scientist's Fund"
 COLDWAR_ISR_aln_un3_desc: "A small office in the Ministry of Industry starts paying half the cost of private research."
 COLDWAR_ISR_aln_lw4: "The Peace Camp Within"
 COLDWAR_ISR_aln_lw4_desc: "Inside the party, the younger doves ask aloud whether the territories are a burden."
 COLDWAR_ISR_aln_c1: "Security First"
 COLDWAR_ISR_aln_c1_desc: "Moshe Dayan holds that Sharm el-Sheikh without peace is better than peace without Sharm el-Sheikh. The army sets the terms."
 COLDWAR_ISR_aln_c2: "Territories for Peace"
 COLDWAR_ISR_aln_c2_desc: "Abba Eban speaks for the doves: the territories are a card to play, not a home to keep."
 COLDWAR_ISR_aln_d1: "The Phantom Alliance"
 COLDWAR_ISR_aln_d1_desc: "The F-4 Phantoms are arriving, and with them the understanding that Washington will not let Israel lose. The price is that Washington is asked first."
 COLDWAR_ISR_aln_d2: "An Independent Arsenal"
 COLDWAR_ISR_aln_d2_desc: "After the French embargo of 1967, Israel builds what it cannot buy: the Nesher, the Kfir, one day its own tank."
 COLDWAR_ISR_aln_ns: "Shalom in Africa"
 COLDWAR_ISR_aln_ns_desc: "Israeli agronomists dig wells in Ghana and train officers in Uganda. Friends in Africa vote at the UN."
 COLDWAR_ISR_aln_cm: "Lessons of the Commission"
 COLDWAR_ISR_aln_cm_desc: "An inquiry asks why the warnings were ignored. Heads roll in the General Staff, and the intelligence branch is rebuilt."
 COLDWAR_ISR_aln_dm: "Interim Agreements"
 COLDWAR_ISR_aln_dm_desc: "Kissinger shuttles between Jerusalem and Cairo. Small steps, signed in tents, move the lines apart."
 COLDWAR_ISR_aln_cap: "Labour Zionism Renewed"
 COLDWAR_ISR_aln_cap_desc: "The pioneers built the state. Now their children must prove that Labour Zionism can run a modern economy."
 COLDWAR_ISR_aln_h: "The Palmach Generation"
 COLDWAR_ISR_aln_h_desc: "The founders are tired. The men who fought in 1948 want the party."
 COLDWAR_ISR_aln_k1: "Rabin's Government"
 COLDWAR_ISR_aln_k1_desc: "A soldier as prime minister: cautious, distrustful of grand plans, blunt with Washington."
 COLDWAR_ISR_aln_k2: "Peres the Builder"
 COLDWAR_ISR_aln_k2_desc: "The builder of Dimona and the aircraft industry wants a technological state."
 COLDWAR_ISR_aln_k1f: "The Entebbe Doctrine"
 COLDWAR_ISR_aln_k1f_desc: "Israel will go anywhere to bring its people home."
 COLDWAR_ISR_aln_k2f: "The Stabilization Plan"
 COLDWAR_ISR_aln_k2f_desc: "Cut spending, freeze wages and prices, devalue once and hold the shekel. It hurts, and it works."
 COLDWAR_ISR_aln_km: "A New Labour Programme"
 COLDWAR_ISR_aln_km_desc: "The party writes its first programme since the founders, for a country of high-tech and peace talks."
 COLDWAR_ISR_lik_e: "Herut and the Liberals"
 COLDWAR_ISR_lik_e_desc: "Begin's Herut and the General Zionist Liberals sit on one list under one name. The fighters of the Irgun and the shopkeepers of Tel Aviv have little in common except a dislike of the Mapai state."
 COLDWAR_ISR_lik_pol: "Begin's Discipline"
 COLDWAR_ISR_lik_pol_desc: "In Herut there is one leader, and the Central Committee knows it. Those who challenge Begin find themselves outside the movement."
 COLDWAR_ISR_lik_eco: "Free the Economy"
 COLDWAR_ISR_lik_eco_desc: "The Liberals want an economy of licences abolished, of private initiative and of a currency that is worth something. The workers in the Histadrut plants hear only that their jobs are in danger."
 COLDWAR_ISR_lik_lw1: "The Sephardi Vote"
 COLDWAR_ISR_lik_lw1_desc: "In Beit She'an and the Hatikva quarter they chant Begin's name. They remember the transit camps and who ran them."
 COLDWAR_ISR_lik_a1: "No to the Rogers Plan"
 COLDWAR_ISR_lik_a1_desc: "Washington offers a ceasefire at the canal and talks on withdrawal under Resolution 242. Begin will not put his name under a plan that hands back the land, and he would rather leave the cabinet than sign it."
 COLDWAR_ISR_lik_a2: "Stay in the Unity Government"
 COLDWAR_ISR_lik_a2_desc: "The war of attrition is not over, and the nation needs one government. The Liberal ministers argue that a seat at the table is worth more than a speech in the Knesset."
 COLDWAR_ISR_lik_b1: "Liberal Economics"
 COLDWAR_ISR_lik_b1_desc: "Less state, fewer permits, lower taxes on enterprise. The Histadrut economy is not the enemy, says Ehrlich, but it should have to compete."
 COLDWAR_ISR_lik_b2: "Project Renewal"
 COLDWAR_ISR_lik_b2_desc: "The neighbourhoods that Labour forgot get new schools, community centres and repaired flats. Every quarter is twinned with a Jewish community abroad that pays a share."
 COLDWAR_ISR_lik_un1: "Abolish Currency Controls"
 COLDWAR_ISR_lik_un1_desc: "Israelis may now hold dollars, and the lira finds its own price. It finds it quickly, and it is lower than anyone hoped."
 COLDWAR_ISR_lik_lw2: "Development Towns First"
 COLDWAR_ISR_lik_lw2_desc: "A minister from Beit She'an now builds housing and factories in the towns the founders put on the map and then forgot."
 COLDWAR_ISR_lik_a1f: "The Likud Alliance"
 COLDWAR_ISR_lik_a1f_desc: "A retired general with a farm in the Negev puts Herut, the Liberals, Tamir's Free Center and the State List into one bloc. For the first time there is an alternative to Mapai that can win."
 COLDWAR_ISR_lik_a2f: "Ministers of the Nation"
 COLDWAR_ISR_lik_a2f_desc: "Gahal ministers run transport, commerce and the postal service, and they are seen to run them well. Responsibility is a tool for the next election."
 COLDWAR_ISR_lik_b1f: "The Upheaval Budget"
 COLDWAR_ISR_lik_b1f_desc: "Bread, oil and bus fares cost more overnight, and the value-added tax goes up. The Treasury calls it honesty about prices; the Histadrut calls it war on the poor."
 COLDWAR_ISR_lik_b2f: "Neighbourhoods First"
 COLDWAR_ISR_lik_b2f_desc: "Hatikva in Tel Aviv and the Katamonim in Jerusalem see bulldozers that build instead of demolish. Their votes were given in 1977, and they expect to be paid back."
 COLDWAR_ISR_lik_un2: "Sell the Government Companies"
 COLDWAR_ISR_lik_un2_desc: "The state owns airlines, chemical works and shipyards. The Liberals want to sell them; the managers, often party men, want to stay."
 COLDWAR_ISR_lik_lw3: "Betar Youth"
 COLDWAR_ISR_lik_lw3_desc: "Jabotinsky's youth movement wears its brown shirts and sings of both banks of the Jordan. It fills the rallies and sends its graduates to the paratroopers."
 COLDWAR_ISR_lik_pm: "The Mahapach"
 COLDWAR_ISR_lik_pm_desc: "After twenty-nine years the Labour movement no longer governs. New men move into the ministries, the state companies and the Jewish Agency, and the old elite calls it a disaster."
 COLDWAR_ISR_lik_em: "Correct Economics"
 COLDWAR_ISR_lik_em_desc: "The new finance minister cuts duties on colour televisions and cars just before the election. People buy, the shops are full, and the reserves run down."
 COLDWAR_ISR_lik_un3: "The Bank Shares Policy"
 COLDWAR_ISR_lik_un3_desc: "The big banks buy their own shares to keep the price rising. Every teacher and taxi driver holds bank stock, because it never falls."
 COLDWAR_ISR_lik_lw4: "The Religious Pact"
 COLDWAR_ISR_lik_lw4_desc: "Begin, who wears a kippah at the Western Wall, gives the religious parties what Labour never would: no El Al flights on the Sabbath and stricter abortion law."
 COLDWAR_ISR_lik_c1: "Judea and Samaria"
 COLDWAR_ISR_lik_c1_desc: "The government no longer says 'the administered territories'. Begin goes to the caravans at Kadum and promises many more Elon Morehs."
 COLDWAR_ISR_lik_c2: "The Autonomy Plan"
 COLDWAR_ISR_lik_c2_desc: "The Arabs of Judea, Samaria and Gaza will run their own schools, clinics and councils, says Begin; Israel keeps security and the land. The Palestinians call it a cage, and Begin's old comrades call it treason."
 COLDWAR_ISR_lik_d1: "The Begin Doctrine"
 COLDWAR_ISR_lik_d1_desc: "No enemy of Israel will be allowed to build the bomb. The air force studies the reactors of the region and the routes to them."
 COLDWAR_ISR_lik_d2: "Peace for Sinai"
 COLDWAR_ISR_lik_d2_desc: "The man of Greater Israel gives back all of Sinai for a peace treaty with the largest Arab country. The airfields, the oil and the town of Yamit are the price."
 COLDWAR_ISR_lik_ns: "The Christian Ally"
 COLDWAR_ISR_lik_ns_desc: "The Phalange of Bashir Gemayel asks for rifles, tanks and training. In return, says the Mossad, Israel gets a friend in Beirut. The army is less sure."
 COLDWAR_ISR_lik_cm: "The Drobles Plan"
 COLDWAR_ISR_lik_cm_desc: "A plan of the settlement department puts new communities on the hilltops between the Arab towns. When the court forbids taking private land, the ministry declares the land state property instead."
 COLDWAR_ISR_lik_dm: "Strategic Cooperation"
 COLDWAR_ISR_lik_dm_desc: "Sharon and Weinberger sign a memorandum against Soviet threats in the region. Israel becomes an ally on paper, and Washington's patience becomes part of Israeli policy."
 COLDWAR_ISR_lik_cap: "The National Camp"
 COLDWAR_ISR_lik_cap_desc: "The underground fighters, the shopkeepers and the children of the development towns are now the governing majority. The national camp intends to stay."
 COLDWAR_ISR_lik_h: "After Begin"
 COLDWAR_ISR_lik_h_desc: "The old man no longer comes out of his flat. Herut must choose who will lead the national camp without him."
 COLDWAR_ISR_lik_k1: "Shamir's Steadfastness"
 COLDWAR_ISR_lik_k1_desc: "A small, silent man from the Lehi underground. Shamir does not do grand gestures; he simply does not move."
 COLDWAR_ISR_lik_k2: "Sharon's Grand Design"
 COLDWAR_ISR_lik_k2_desc: "The bulldozer wants to redraw the map of the region: Jordan as the Palestinian state, a friendly Lebanon, settlements everywhere. His critics say he lies to the cabinet."
 COLDWAR_ISR_lik_k1f: "No Territorial Compromise"
 COLDWAR_ISR_lik_k1f_desc: "The sea is the same sea and the Arabs are the same Arabs. Shamir blocks every conference that would end with less land."
 COLDWAR_ISR_lik_k2f: "Peace for Galilee"
 COLDWAR_ISR_lik_k2f_desc: "Forty kilometres, the cabinet is told, to push the PLO's guns out of range of Kiryat Shmona. The army is in Beirut within a week."
 COLDWAR_ISR_lik_km: "The Likud Charter"
 COLDWAR_ISR_lik_km_desc: "Herut and the Liberals stop being partners and become one party. The national camp writes down what it stands for after a decade in power."
 COLDWAR_ISR_maf_e: "The Religious Zionists"
 COLDWAR_ISR_maf_e_desc: "The party of the knitted kippah has sat in every government since the state was founded. It keeps the Sabbath in the law and the rabbinate in the state."
 COLDWAR_ISR_maf_pol: "The Young Guard"
 COLDWAR_ISR_maf_pol_desc: "Zevulun Hammer, Yehuda Ben-Meir and the graduates of Bnei Akiva want a party that cares about the Land, not only about religious councils and ministries."
 COLDWAR_ISR_maf_eco: "Hapoel HaMizrachi"
 COLDWAR_ISR_maf_eco_desc: "The religious labour movement has its own moshavim, kibbutzim, housing company and bank. It lives on settlement and on the share of state budgets it negotiates."
 COLDWAR_ISR_maf_lw1: "Bnei Akiva"
 COLDWAR_ISR_maf_lw1_desc: "Blue shirts, Shabbat afternoons, summer camps in the hills. The youth movement trains the party's voters, officers and settlers."
 COLDWAR_ISR_maf_a1: "Kingmaker of the Coalition"
 COLDWAR_ISR_maf_a1_desc: "No coalition in Jerusalem can be formed without the National Religious Party. Burg knows the price of every vote and collects it."
 COLDWAR_ISR_maf_a2: "Party of the Settlers"
 COLDWAR_ISR_maf_a2_desc: "The party stops being a mediator between rabbis and ministers and becomes the voice of the hilltops. The young men from Kfar Etzion and Hebron are now its heroes."
 COLDWAR_ISR_maf_b1: "The Religious Kibbutzim"
 COLDWAR_ISR_maf_b1_desc: "Tirat Zvi and Sde Eliyahu prove that a community can keep the commandments and still be the best dairy farm in the valley."
 COLDWAR_ISR_maf_b2: "The Mizrachi Bank"
 COLDWAR_ISR_maf_b2_desc: "The movement's bank lends to religious families, yeshivot and the new towns. It also lends to friends of the party."
 COLDWAR_ISR_maf_un1: "Kashrut Exports"
 COLDWAR_ISR_maf_un1_desc: "A rabbinate stamp opens shelves in Brooklyn and Paris. Wine, olives and biscuits from Israel sell as kosher first and Israeli second."
 COLDWAR_ISR_maf_lw2: "Women in National Service"
 COLDWAR_ISR_maf_lw2_desc: "Religious girls are exempt from the army, but they can give a year to hospitals, schools and the new towns. The Haredi rabbis call it a slippery slope."
 COLDWAR_ISR_maf_a1f: "The Ministry of Religions"
 COLDWAR_ISR_maf_a1f_desc: "Marriage, burial, kashrut and the rabbinical courts all run through one ministry, and the ministry belongs to the party."
 COLDWAR_ISR_maf_a2f: "Gush Emunim"
 COLDWAR_ISR_maf_a2f_desc: "The Bloc of the Faithful marches to Sebastia again and again until the government gives in. Rabbis, soldiers and students set up caravans on the hills, with or without permission."
 COLDWAR_ISR_maf_b1f: "Kibbutz Sa'ad Model"
 COLDWAR_ISR_maf_b1f_desc: "Machines that milk cows on the Sabbath without breaking it, greenhouses in the Negev sand: the religious kibbutzim turn law into engineering."
 COLDWAR_ISR_maf_b2f: "Religious Commerce"
 COLDWAR_ISR_maf_b2f_desc: "Kosher hotels, kosher airlines, kosher certificates for every bakery: religious law becomes a market, and the rabbinate a licence office."
 COLDWAR_ISR_maf_un2: "Religious Councils"
 COLDWAR_ISR_maf_un2_desc: "Every town has a religious council for synagogues, ritual baths and burial. Every council has jobs, and the party fills them."
 COLDWAR_ISR_maf_lw3: "The Sephardi Rabbinate"
 COLDWAR_ISR_maf_lw3_desc: "Rabbi Ovadia Yosef becomes Sephardi Chief Rabbi with the party's votes. The Sephardi faithful ask why the party's leaders are still all Ashkenazim."
 COLDWAR_ISR_maf_pm: "Who Is a Jew?"
 COLDWAR_ISR_maf_pm_desc: "The party demands that only conversions according to halakha count under the Law of Return. In New York and Los Angeles, the rabbis ask whether their Judaism is not Jewish enough for Israel."
 COLDWAR_ISR_maf_em: "Torah and Labour"
 COLDWAR_ISR_maf_em_desc: "Torah va'Avoda: study in the morning, work in the field in the afternoon. Religious Zionists serve, plough and pray, and they do not live on stipends."
 COLDWAR_ISR_maf_un3: "Yeshiva Budgets"
 COLDWAR_ISR_maf_un3_desc: "Merkaz HaRav, the ulpanot for girls and the hesder yeshivot all ask the Ministry of Education for more. The minister is one of theirs."
 COLDWAR_ISR_maf_lw4: "Tami Breakaway Averted"
 COLDWAR_ISR_maf_lw4_desc: "Aharon Abuhatzeira gets a ministry, places on the list and the party's protection from his accusers. The Moroccan voters stay."
 COLDWAR_ISR_maf_c1: "Hesder Yeshivot"
 COLDWAR_ISR_maf_c1_desc: "Five years: study, then tanks, then study again. The hesder boys fight in the best units and go back to the yeshiva benches."
 COLDWAR_ISR_maf_c2: "State Religious Schools"
 COLDWAR_ISR_maf_c2_desc: "A quarter of Israel's children learn mathematics and Talmud in the same building. The party guards the state religious stream as its future."
 COLDWAR_ISR_maf_d1: "The Whole Land of Israel"
 COLDWAR_ISR_maf_d1_desc: "Not one inch: the party of Rabbi Kook's students says the land was promised and cannot be bargained. Coalition partners who talk of compromise find Mafdal on the other side."
 COLDWAR_ISR_maf_d2: "Orthodox Diaspora Ties"
 COLDWAR_ISR_maf_d2_desc: "Modern Orthodox Jews from New York and London send money, children for a gap year and, more and more, themselves."
 COLDWAR_ISR_maf_ns: "The Jewish Agency Posts"
 COLDWAR_ISR_maf_ns_desc: "The Zionist movement divides its departments by party key. The religious department and the settlement desks belong to Mizrachi."
 COLDWAR_ISR_maf_cm: "The Sabbath Laws"
 COLDWAR_ISR_maf_cm_desc: "The party brought down a government over a ceremony that ran into the Sabbath. Shops, buses and the national airline stop on Friday evening."
 COLDWAR_ISR_maf_dm: "Amana"
 COLDWAR_ISR_maf_dm_desc: "Gush Emunim builds its own settlement company. Caravans first, then houses, then a community, and the ministry pays afterwards."
 COLDWAR_ISR_maf_cap: "Religious Zionism Renewed"
 COLDWAR_ISR_maf_cap_desc: "The religious Zionists are no longer the junior partner who asks for kashrut in the army. They want to lead the state, the army and the settlement of the land."
 COLDWAR_ISR_maf_h: "Burg's Succession"
 COLDWAR_ISR_maf_h_desc: "Burg has led the party through three decades and every coalition. The Young Guard believes its time has come."
 COLDWAR_ISR_maf_k1: "Hammer: Settle Everything"
 COLDWAR_ISR_maf_k1_desc: "Hammer was the Young Guard's spokesman when they went to Sebastia. Under him the party is the settlers' party first."
 COLDWAR_ISR_maf_k2: "The Moderate Religious Centre"
 COLDWAR_ISR_maf_k2_desc: "The party remembers that it was once the bridge between religious and secular Israel. It negotiates autonomy rather than marching to the hills."
 COLDWAR_ISR_maf_k1f: "Kiryat Arba Grows"
 COLDWAR_ISR_maf_k1f_desc: "The town above Hebron grows, and its women move into Beit Hadassah in the heart of the Arab city. Each attack brings a new neighbourhood, and each neighbourhood a new attack."
 COLDWAR_ISR_maf_k2f: "Paths of Peace"
 COLDWAR_ISR_maf_k2f_desc: "Religious Zionists who say that life is holier than land found their own movement. They are few, but they are listened to abroad."
 COLDWAR_ISR_maf_km: "Faith and State"
 COLDWAR_ISR_maf_km_desc: "After the split and the losses, the party rewrites what religious Zionism means in a state of high-tech and peace talks."
 COLDWAR_ISR_lib_e: "The Liberal Centre"
 COLDWAR_ISR_lib_e_desc: "A small party of lawyers, shopkeepers and old German Zionists now holds the Prime Minister's office. It has few votes in the Knesset and many ideas about how a modern state should be run."
 COLDWAR_ISR_lib_pol: "Civil Rights"
 COLDWAR_ISR_lib_pol_desc: "The man who prosecuted Eichmann now asks why an Israeli citizen has fewer rights against the state than an accused Nazi had in his court. Liberties must be written into law."
 COLDWAR_ISR_lib_eco: "Middle-Class Economics"
 COLDWAR_ISR_lib_eco_desc: "The pharmacist in Ramat Gan and the engineer in Haifa pay the highest taxes in the West and fill in forms for every import licence. A liberal government lets them breathe."
 COLDWAR_ISR_lib_a1: "Junior Partner"
 COLDWAR_ISR_lib_a1_desc: "We have sat in every cabinet since 1966 because we know how to make a coalition work. The big party gets the headlines; we get the laws we care about."
 COLDWAR_ISR_lib_a2: "The Democratic Movement for Change"
 COLDWAR_ISR_lib_a2_desc: "An archaeologist who was once Chief of Staff gathers generals, professors and businessmen into one movement. They promise to clean up politics after a generation of Labour rule."
 COLDWAR_ISR_lib_b1: "Competition Law"
 COLDWAR_ISR_lib_b1_desc: "One company makes the cement, one makes the margarine, one bank owns half the industry. A real antitrust authority would let competitors in."
 COLDWAR_ISR_lib_b2: "Civil Service Reform"
 COLDWAR_ISR_lib_b2_desc: "Too many clerks got their posts through the party branch. Open competitions, written exams and a professional commission would give Israel a civil service worthy of its army."
 COLDWAR_ISR_lib_a1f: "The Ministry of Tourism"
 COLDWAR_ISR_lib_a1f_desc: "Pilgrims, Jewish tourists from New York and Scandinavians on Eilat's beaches bring hard currency. The ministry wants hotels, an airport and roads to the Red Sea."
 COLDWAR_ISR_lib_a2f: "Electoral Reform"
 COLDWAR_ISR_lib_a2f_desc: "Thirteen lists in the Knesset and every one of them a kingmaker. Regional constituencies and a higher threshold would make members answer to voters, not to party committees."
 COLDWAR_ISR_lib_b1f: "Break the Cartels"
 COLDWAR_ISR_lib_b1f_desc: "The Histadrut's holding company and the great banking groups own each other's shares and sit on each other's boards. The government orders them to sell."
 COLDWAR_ISR_lib_b2f: "Merit Not Party Cards"
 COLDWAR_ISR_lib_b2f_desc: "After the scandals in the housing ministry and the health fund, every senior appointment goes through a public committee. Party loyalty is no longer a qualification."
 COLDWAR_ISR_lib_pm: "A Written Constitution"
 COLDWAR_ISR_lib_pm_desc: "In 1950 the Knesset decided to write the constitution chapter by chapter. Twenty years later the chapters still do not include the rights of the citizen. We will finish the job."
 COLDWAR_ISR_lib_em: "Open Markets"
 COLDWAR_ISR_lib_em_desc: "Let the pound float, cut the import licences and let Israelis buy abroad. Liberals have waited thirty years for this; the question is whether the currency can take it."
 COLDWAR_ISR_lib_c1: "Civil Marriage"
 COLDWAR_ISR_lib_c1_desc: "Thousands of couples fly to Cyprus because the rabbinate will not marry them at home. A civil register for those who want it ends the humiliation."
 COLDWAR_ISR_lib_c2: "Status Quo Kept"
 COLDWAR_ISR_lib_c2_desc: "The arrangement on Sabbath, kashrut, marriage and schools has kept religious and secular Jews in one state since independence. A liberal government does not have to pick that fight."
 COLDWAR_ISR_lib_d1: "Western Europe First"
 COLDWAR_ISR_lib_d1_desc: "Two thirds of our citrus goes to Europe, and Europe is our neighbour across the sea. We should be part of its market, not a supplicant at its gates."
 COLDWAR_ISR_lib_d2: "Atlantic Liberalism"
 COLDWAR_ISR_lib_d2_desc: "Israel's friends in Washington are its liberals. A free trade area with the United States would tie the two democracies together by commerce, not only by arms."
 COLDWAR_ISR_lib_cm: "Shinui"
 COLDWAR_ISR_lib_cm_desc: "The movement split over whether to stay in government. Those who left kept the name Change, the law professor at their head and the conviction that a party must be cleaner than its rivals."
 COLDWAR_ISR_lib_dm: "European Association"
 COLDWAR_ISR_lib_dm_desc: "By the end of the decade our factories will sell into Europe without tariffs. Our orange growers will face Spain and Portugal inside the same market."
 COLDWAR_ISR_lib_cap: "A Liberal Israel"
 COLDWAR_ISR_lib_cap_desc: "A state of citizens rather than of party members, with rights in law, open markets and clean government. The pioneers would not recognise it; their grandchildren might prefer it."
 COLDWAR_ISR_rak_e: "The Communist List"
 COLDWAR_ISR_rak_e_desc: "The New Communist List is the only party where a Jew from Tel Aviv and an Arab from Nazareth sit on the same bench as equals. Now it holds the Prime Minister's office, and Washington is alarmed."
 COLDWAR_ISR_rak_pol: "Jewish-Arab Front"
 COLDWAR_ISR_rak_pol_desc: "Jewish and Arab workers have the same boss and the same rent. The party shows that the two peoples can share one list, one union and one country."
 COLDWAR_ISR_rak_eco: "Nationalise the Banks"
 COLDWAR_ISR_rak_eco_desc: "The banks gambled with the savings of workers and propped up their own shares. The state takes them over for the people, not to save their owners."
 COLDWAR_ISR_rak_a1: "Moscow Line"
 COLDWAR_ISR_rak_a1_desc: "The party follows the line of the Soviet comrades. Moscow broke relations in 1967; a government of the left can give it reasons to return."
 COLDWAR_ISR_rak_a2: "Euro-Communism"
 COLDWAR_ISR_rak_a2_desc: "The Italian comrades speak of democracy and their own road. An Israeli communism that does not wait for instructions from Moscow could win Jewish voters too."
 COLDWAR_ISR_rak_b1: "Workers' Councils"
 COLDWAR_ISR_rak_b1_desc: "In the Histadrut's own factories the workers have no say; the managers answer to the party. Elected councils will run the plants."
 COLDWAR_ISR_rak_b2: "Planned Kibbutz Economy"
 COLDWAR_ISR_rak_b2_desc: "The kibbutz shows that collective farming feeds a nation. A national plan can do for industry what the kibbutz did for the valleys."
 COLDWAR_ISR_rak_a1f: "Soviet Recognition"
 COLDWAR_ISR_rak_a1f_desc: "Embassies again in Moscow and Tel Aviv. In return the gates open for the Jews who have applied to leave for years."
 COLDWAR_ISR_rak_a2f: "Independent Left"
 COLDWAR_ISR_rak_a2f_desc: "The party works with Zionist doves, Panthers and peace activists without asking them to read Lenin. A broad left needs more than one hymn."
 COLDWAR_ISR_rak_b1f: "Land Day"
 COLDWAR_ISR_rak_b1f_desc: "On 30 March 1976 the Arab towns struck against the expropriation of their fields, and six people were shot dead. The government ends the confiscations and makes the day a day of remembrance."
 COLDWAR_ISR_rak_b2f: "Cooperatives"
 COLDWAR_ISR_rak_b2f_desc: "Village cooperatives sell olives, tobacco and milk without the middleman taking half. The state lends them the money to start."
 COLDWAR_ISR_rak_pm: "End the Occupation"
 COLDWAR_ISR_rak_pm_desc: "Withdraw to the lines of 4 June 1967. Every month of occupation corrupts the army that enforces it and the people who send it."
 COLDWAR_ISR_rak_em: "Equal Wages"
 COLDWAR_ISR_rak_em_desc: "An Arab labourer and a Moroccan immigrant earn less than an Ashkenazi clerk for harder work. A legal minimum wage and equal pay end that."
 COLDWAR_ISR_rak_c1: "Recognise the PLO"
 COLDWAR_ISR_rak_c1_desc: "The Palestinians have chosen who speaks for them. Peace will be signed with the PLO or not at all."
 COLDWAR_ISR_rak_c2: "Two States"
 COLDWAR_ISR_rak_c2_desc: "A Palestinian state in the West Bank and Gaza beside Israel, with East Jerusalem as its capital. Two flags, one border, no more occupation."
 COLDWAR_ISR_rak_d1: "Non-Alignment"
 COLDWAR_ISR_rak_d1_desc: "Israel need not be Washington's aircraft carrier. Belgrade and Delhi broke with us because we chose a bloc; we can choose none."
 COLDWAR_ISR_rak_d2: "Peace Conference"
 COLDWAR_ISR_rak_d2_desc: "An international conference under American and Soviet chairmanship, with every party at the table. Only that way can a peace hold."
 COLDWAR_ISR_rak_cm: "Hadash"
 COLDWAR_ISR_rak_cm_desc: "Communists, Black Panthers from Musrara and Arab mayors join one Democratic Front for Peace and Equality."
 COLDWAR_ISR_rak_dm: "Peace Dividend"
 COLDWAR_ISR_rak_dm_desc: "A quarter of everything we produce goes to the army. Cut it, and there is money for housing, schools and pensions."
 COLDWAR_ISR_rak_l1: "Vilner Holds the Line"
 COLDWAR_ISR_rak_l1_desc: "Meir Vilner has kept the party on Moscow's line since the split of 1965. The Central Committee wants no surprises in the new front."
 COLDWAR_ISR_rak_l2: "Toubi's Arab Front"
 COLDWAR_ISR_rak_l2_desc: "Tawfik Toubi speaks for the Arab towns that give the front most of its votes. Under him the party looks to Nazareth before Moscow."
 COLDWAR_ISR_rak_cap: "A Socialist Israel"
 COLDWAR_ISR_rak_cap_desc: "Land to those who work it, factories to those who run them, peace with the neighbours. The red flag flies over Nazareth city hall; now it flies over the government."
 COLDWAR_ISR_rel_e: "The Council of Torah Sages"
 COLDWAR_ISR_rel_e_desc: "No decision of the party is taken without the sages. The Gerrer Rebbe and the great heads of yeshivot rule on what the government may do, and the ministers obey."
 COLDWAR_ISR_rel_pol: "Coalition Bargain"
 COLDWAR_ISR_rel_pol_desc: "Every coalition needs our votes, and every vote has a price written into the agreement: budgets for yeshivot, laws on the Sabbath, a promise on conversion."
 COLDWAR_ISR_rel_eco: "Yeshiva Funding"
 COLDWAR_ISR_rel_eco_desc: "After the destruction in Europe, the Torah world is rebuilt here. The state pays for each student, and the yeshivot of Bnei Brak and Jerusalem fill again."
 COLDWAR_ISR_rel_a1: "Inside the Government"
 COLDWAR_ISR_rel_a1_desc: "Our representatives take portfolios and sign the cabinet decisions. We share the responsibility, including for the army and for every Sabbath it breaks."
 COLDWAR_ISR_rel_a2: "Support from Outside"
 COLDWAR_ISR_rel_a2_desc: "We give the government its majority and take no minister's chair. The chairman of the finance committee is worth more to us than a ministry."
 COLDWAR_ISR_rel_b1: "Haredi Housing"
 COLDWAR_ISR_rel_b1_desc: "Families of eight and ten crowd into two rooms in Mea Shearim. The housing ministry builds whole neighbourhoods for them on the hills of Jerusalem."
 COLDWAR_ISR_rel_b2: "Torah Study Grants"
 COLDWAR_ISR_rel_b2_desc: "Ben-Gurion exempted four hundred students. The limit is now lifted: every young man who learns may learn."
 COLDWAR_ISR_rel_a1f: "Deputy Ministers"
 COLDWAR_ISR_rel_a1f_desc: "A deputy minister signs the budgets without bearing a minister's guilt. Through him, the independent Torah schools get their teachers and buildings."
 COLDWAR_ISR_rel_a2f: "Torah Independence"
 COLDWAR_ISR_rel_a2f_desc: "We are not Zionists. We sit in the Knesset to protect the Torah, not to celebrate the state. The community keeps its own courts, schools and kashrut."
 COLDWAR_ISR_rel_b1f: "New Haredi Towns"
 COLDWAR_ISR_rel_b1f_desc: "Cheap land and cheap flats are found across the old border, an hour from Bnei Brak. Our families move for the housing, and the world sees settlements."
 COLDWAR_ISR_rel_b2f: "Kollel Stipends"
 COLDWAR_ISR_rel_b2f_desc: "A married man learning in the kollel receives a stipend from the religious affairs ministry. The society of learners grows every year, and so does the bill."
 COLDWAR_ISR_rel_pm: "The Sephardi Torah Guardians"
 COLDWAR_ISR_rel_pm_desc: "The Sephardi students of the Lithuanian yeshivot were never given seats on our lists. Rav Ovadia Yosef now leads them in their own party, to return the crown to its former glory."
 COLDWAR_ISR_rel_em: "Ma'ayan Education"
 COLDWAR_ISR_rel_em_desc: "Long school days, hot meals and buses to the classroom in Beit She'an and Ofakim. The movement's schools take children the state system has given up on."
 COLDWAR_ISR_rel_c1: "Exemption Kept"
 COLDWAR_ISR_rel_c1_desc: "A boy who learns Torah protects Israel as surely as a soldier at the canal. The exemption stays, and with it the anger of the reservists."
 COLDWAR_ISR_rel_c2: "Nahal Haredi"
 COLDWAR_ISR_rel_c2_desc: "For the young men who do not sit and learn, a battalion of their own: kosher kitchens, no women, time for prayer. Some rabbis call it a trap."
 COLDWAR_ISR_rel_d1: "Rabbinate Power"
 COLDWAR_ISR_rel_d1_desc: "Only a conversion according to halakha makes a Jew. If Reform and Conservative rabbis in America object, they are welcome to come and learn."
 COLDWAR_ISR_rel_d2: "Pragmatic Rabbis"
 COLDWAR_ISR_rel_d2_desc: "The Rishon LeZion rules that saving lives outweighs holding land. A rabbi may support giving back territory for a real peace."
 COLDWAR_ISR_rel_cm: "Sabbath Enforcement"
 COLDWAR_ISR_rel_cm_desc: "The national airline will not fly on the Sabbath. Cinemas close, buses stop, and the secular cities count the cost."
 COLDWAR_ISR_rel_dm: "Diaspora Yeshivot"
 COLDWAR_ISR_rel_dm_desc: "From Brooklyn, Antwerp and London the donations flow, and with them young men who come to learn and stay."
 COLDWAR_ISR_rel_l1: "Rabbi Peretz Leads"
 COLDWAR_ISR_rel_l1_desc: "Rabbi Peretz of Ra'anana carries the blessing of Rabbi Ovadia. The Sephardi voters trust a rabbi before a politician."
 COLDWAR_ISR_rel_l2: "Deri's Machine"
 COLDWAR_ISR_rel_l2_desc: "A young yeshiva graduate builds schools, clubs and a ministry network across the development towns. Money moves fast in his ministry."
 COLDWAR_ISR_rel_cap: "A Torah Nation"
 COLDWAR_ISR_rel_cap_desc: "Within a generation the Torah world will be the fastest growing part of the Jewish people. The state may wish it worked more; it cannot ignore it."
 COLDWAR_ISR_arb_e: "Voices of the Arab Citizens"
 COLDWAR_ISR_arb_e_desc: "The mukhtars and notables who sat with Labour for twenty years now lead the government. One citizen in eight is an Arab, and for the first time the cabinet speaks their language."
 COLDWAR_ISR_arb_pol: "Allied to Labour"
 COLDWAR_ISR_arb_pol_desc: "Our lists were born in the Labour movement's lap and vote with it. Labour delivers the permits and the roads; the young say we deliver nothing else."
 COLDWAR_ISR_arb_eco: "Village Development"
 COLDWAR_ISR_arb_eco_desc: "Many villages still have no sewers, no zoning plan and no paved road to the main highway. The state paves, pipes and plans."
 COLDWAR_ISR_arb_a1: "Loyal Partners"
 COLDWAR_ISR_arb_a1_desc: "Loyalty to the state brings jobs, permits and respect. We are citizens first, and we prove it in the Knesset."
 COLDWAR_ISR_arb_a2: "Independent Arab Politics"
 COLDWAR_ISR_arb_a2_desc: "No more lists drawn up in Labour's offices. An Arab party with its own programme, its own money and its own voice."
 COLDWAR_ISR_arb_b1: "Municipal Budgets"
 COLDWAR_ISR_arb_b1_desc: "The heads of Arab councils demand the same grant per resident as a Jewish town of the same size. The interior ministry pays."
 COLDWAR_ISR_arb_b2: "Agricultural Credit"
 COLDWAR_ISR_arb_b2_desc: "Arab farmers get a fraction of the water quota and none of the cheap loans the moshavim receive. Credit and water change that."
 COLDWAR_ISR_arb_a1f: "Druze Service"
 COLDWAR_ISR_arb_a1f_desc: "Druze men serve in the army, the border police and the prison service. In return they ask for land, jobs and equal budgets, and many still wait."
 COLDWAR_ISR_arb_a2f: "The Progressive List"
 COLDWAR_ISR_arb_a2f_desc: "A lawyer from Haifa and a retired general from the 1967 war build one list: Arab nationalists and Jewish doves for a Palestinian state beside Israel."
 COLDWAR_ISR_arb_b1f: "Equal Services"
 COLDWAR_ISR_arb_b1f_desc: "Child allowances are paid more generously to families of soldiers, which in practice means Jewish families. Equal services means equal benefits."
 COLDWAR_ISR_arb_b2f: "Olive Cooperatives"
 COLDWAR_ISR_arb_b2f_desc: "Presses and storehouses owned by the growers themselves. Galilee oil sold in Haifa and Europe, not to the merchant who sets the price."
 COLDWAR_ISR_arb_pm: "Land Day Remembered"
 COLDWAR_ISR_arb_pm_desc: "Every 30 March the villages of the Galilee march for the six who were killed. The government stands with them and admits what was planned."
 COLDWAR_ISR_arb_em: "Arab Universities"
 COLDWAR_ISR_arb_em_desc: "Arab graduates go abroad because Haifa and Jerusalem have few places for them. A university in Nazareth keeps them at home."
 COLDWAR_ISR_arb_c1: "Civic Equality"
 COLDWAR_ISR_arb_c1_desc: "Equality before the law in fact, not only on paper: in land, budgets and public jobs. We ask nothing more than any citizen has."
 COLDWAR_ISR_arb_c2: "National Rights"
 COLDWAR_ISR_arb_c2_desc: "We are part of the Palestinian people as well as citizens of Israel. A national minority needs its own schools, media and recognised institutions."
 COLDWAR_ISR_arb_d1: "Bridge to the Arab World"
 COLDWAR_ISR_arb_d1_desc: "Our families live on both banks of the Jordan. Pilgrims to Mecca, students in Amman and traders in Cairo can be Israel's bridge, not its fifth column."
 COLDWAR_ISR_arb_d2: "Inside Israel First"
 COLDWAR_ISR_arb_d2_desc: "Sewers in Umm al-Fahm before speeches about Jerusalem. The mayors want budgets, not slogans."
 COLDWAR_ISR_arb_cm: "End Land Confiscation"
 COLDWAR_ISR_arb_cm_desc: "Since 1948 the state has taken Arab land by one law after another. No more: what remains stays with its owners."
 COLDWAR_ISR_arb_dm: "Open Bridges Wider"
 COLDWAR_ISR_arb_dm_desc: "More trucks over the Allenby and Damiya bridges, more permits for families and students. Open borders make quiet territories."
 COLDWAR_ISR_arb_cap: "Equal Citizenship"
 COLDWAR_ISR_arb_cap_desc: "One state, one citizenship, equal for Jew and Arab. Many Jews call it the end of Zionism; many Arabs call it the minimum."
 COLDWAR_ISR_hao_e: "The New Force"
 COLDWAR_ISR_hao_e_desc: "A weekly magazine with naked girls on the back page and state secrets on the front has sent its editor to the Knesset. Uri Avnery calls it the new force: against the establishment, for peace with the Arabs."
 COLDWAR_ISR_hao_pol: "Free Press"
 COLDWAR_ISR_hao_pol_desc: "No more gentlemen's agreements between the censor and the editors' committee. What the ministers hide, the papers will print."
 COLDWAR_ISR_hao_eco: "Consumer Rights"
 COLDWAR_ISR_hao_eco_desc: "The housewife in Holon pays cartel prices for milk, oil and cars. A consumer council with teeth will name the price-fixers."
 COLDWAR_ISR_hao_a1: "Avnery's Peace"
 COLDWAR_ISR_hao_a1_desc: "A Palestinian state beside Israel, a Semitic region at peace: Avnery has said it since before the Six Day War, and now he says it from the government benches."
 COLDWAR_ISR_hao_a2: "Aloni's Civil Rights"
 COLDWAR_ISR_hao_a2_desc: "A lawyer who wants Israelis to marry whom they like, be buried where they like and be judged by civil courts. The rabbinate calls her an enemy."
 COLDWAR_ISR_hao_b1: "The Comptroller's Teeth"
 COLDWAR_ISR_hao_b1_desc: "The State Comptroller writes reports that nobody reads. Give the office the power to refer cases to the police, and everybody will read them."
 COLDWAR_ISR_hao_b2: "A Social Safety Net"
 COLDWAR_ISR_hao_b2_desc: "No family below the line: child allowances paid in cash, a guaranteed minimum income, and the National Insurance Institute as a right, not a favour."
 COLDWAR_ISR_hao_a1f: "Talk to the PLO"
 COLDWAR_ISR_hao_a1f_desc: "In a London flat and a Paris café, Israelis sit across from men the government calls terrorists. They talk about borders, not bombs."
 COLDWAR_ISR_hao_a2f: "Ratz"
 COLDWAR_ISR_hao_a2f_desc: "Aloni has left Golda's party and taken the disappointed voters with her. Three letters on a ballot: civil rights, peace, and no apologies."
 COLDWAR_ISR_hao_b1f: "Investigative Journalism"
 COLDWAR_ISR_hao_b1f_desc: "A bank governor nominee in prison, a housing minister dead by his own hand, a prime minister's dollar account in Washington: the reporters are finding what the party buried."
 COLDWAR_ISR_hao_b2f: "Women's Equality"
 COLDWAR_ISR_hao_b2f_desc: "Israel had a woman prime minister, and still a woman cannot be a judge in a rabbinical court or a pilot in the air force. Equal pay must mean equal pay."
 COLDWAR_ISR_hao_pm: "Sheli"
 COLDWAR_ISR_hao_pm_desc: "Avnery, the former Labour secretary-general Lova Eliav and the retired general Matti Peled stand on one list. Peace and equality, in Hebrew: Sheli."
 COLDWAR_ISR_hao_em: "Green Line Economy"
 COLDWAR_ISR_hao_em_desc: "Every shekel poured into a hilltop caravan is a shekel missing in Kiryat Shmona. Build inside the Green Line, and the economy will follow."
 COLDWAR_ISR_hao_c1: "Peace Now"
 COLDWAR_ISR_hao_c1_desc: "Reserve officers who fought on the canal sign a letter to the prime minister: do not miss the chance of peace. Hundreds of thousands follow them into the squares."
 COLDWAR_ISR_hao_c2: "The Civil Rights Association"
 COLDWAR_ISR_hao_c2_desc: "Lawyers take the army to the Supreme Court over confiscated land and detainees without charge. Sometimes they win."
 COLDWAR_ISR_hao_d1: "Two States Now"
 COLDWAR_ISR_hao_d1_desc: "Not autonomy, not a Jordanian option: a Palestinian state in the West Bank and Gaza, with its capital in East Jerusalem, recognising Israel."
 COLDWAR_ISR_hao_d2: "European Mediation"
 COLDWAR_ISR_hao_d2_desc: "Europe buys our oranges and sells us its cars. Let Paris and Bonn sit at the table where Washington sits alone."
 COLDWAR_ISR_hao_cm: "Meretz Roots"
 COLDWAR_ISR_hao_cm_desc: "Ratz, Mapam and Shinui argue about everything except the essentials: civil rights, two states, a secular state. One day they will run together."
 COLDWAR_ISR_hao_dm: "The New Israel Fund"
 COLDWAR_ISR_hao_dm_desc: "American Jews who love Israel and want it to be just send money to rape crisis centres, Arab village councils and civil rights lawyers."
 COLDWAR_ISR_hao_cap: "An Open Society"
 COLDWAR_ISR_hao_cap_desc: "A state of all its citizens' rights, a press without a censor, a border drawn by agreement. Israel will be judged by how it treats the weakest."
 COLDWAR_ISR_map_e: "The Kibbutz Left"
 COLDWAR_ISR_map_e_desc: "The red flag still flies in the dining halls of Hashomer Hatzair. Meir Yaari and Yaakov Hazan lead a party of kibbutzniks who believe socialism and Zionism are the same thing."
 COLDWAR_ISR_map_pol: "Inside the Alignment"
 COLDWAR_ISR_map_pol_desc: "Mapam keeps its own name, its own paper and its own kibbutzim, but runs on one list with Labour. Influence from within, if Golda listens."
 COLDWAR_ISR_map_eco: "Kibbutz Artzi"
 COLDWAR_ISR_map_eco_desc: "Seventy collectives from the Galilee to the Negev share one federation, one movement and one discipline. They want credit, water and a factory in every valley."
 COLDWAR_ISR_map_a1: "Loyal to the Alignment"
 COLDWAR_ISR_map_a1_desc: "The comrades swallow their objections to settlement policy and stay. A seat at the cabinet table is worth more than a pure conscience in opposition."
 COLDWAR_ISR_map_a2: "Leave the Alignment"
 COLDWAR_ISR_map_a2_desc: "Labour has sat down with the Likud. Mapam will not share a cabinet with Shamir and Sharon, and walks out with its six seats."
 COLDWAR_ISR_map_b1: "Kibbutz Industry"
 COLDWAR_ISR_map_b1_desc: "The cowsheds stay, but the future is a plastics plant or a metal works behind the orchard. The collective owns it and the members run it in shifts."
 COLDWAR_ISR_map_b2: "Democratic Planning"
 COLDWAR_ISR_map_b2_desc: "The market cannot decide where a nation of immigrants should live and work. A planning council of unions, kibbutzim and ministries will."
 COLDWAR_ISR_map_a1f: "Shemtov's Health Ministry"
 COLDWAR_ISR_map_a1f_desc: "Mapam runs the hospitals. New clinics in the development towns, mother and child stations in every neighbourhood."
 COLDWAR_ISR_map_a2f: "Independent Socialists"
 COLDWAR_ISR_map_a2f_desc: "For the first time since 1965 the party runs alone. Its own list, its own platform, its own voice in the Histadrut."
 COLDWAR_ISR_map_b1f: "Tnuva and Plastics"
 COLDWAR_ISR_map_b1f_desc: "Kibbutz milk goes out under the Tnuva label, kibbutz drippers go out to the world. Cooperative capitalism, with the profits shared in the dining hall."
 COLDWAR_ISR_map_b2f: "Regional Councils"
 COLDWAR_ISR_map_b2f_desc: "Kibbutzim and moshavim share schools, clinics and roads through their regional councils. Give them the budget, not the ministry in Jerusalem."
 COLDWAR_ISR_map_pm: "Arab-Jewish Brotherhood"
 COLDWAR_ISR_map_pm_desc: "Mapam took Arab members when no Zionist party would. Equal budgets for the villages and a seat for an Arab comrade on every list."
 COLDWAR_ISR_map_em: "Kibbutz Absorption"
 COLDWAR_ISR_map_em_desc: "The newcomer gets a room, an ulpan and a job in the orchard. After a year the kibbutz decides whether he stays, and he decides too."
 COLDWAR_ISR_map_c1: "The Jordanian Option"
 COLDWAR_ISR_map_c1_desc: "Return the populated West Bank to King Hussein, keep the Jordan Valley. The king has been meeting Israelis in secret for years; Mapam would make it public."
 COLDWAR_ISR_map_c2: "A Palestinian State"
 COLDWAR_ISR_map_c2_desc: "Hashomer Hatzair once dreamed of a binational state. Its heirs now accept two: Israel, and a Palestinian state at its side."
 COLDWAR_ISR_map_d1: "Socialist International"
 COLDWAR_ISR_map_d1_desc: "European social democrats share our language of work and justice. Their parties govern in Bonn and Stockholm, and their friendship opens doors."
 COLDWAR_ISR_map_d2: "Bridges to the Eastern Left"
 COLDWAR_ISR_map_d2_desc: "Mapam once looked to Moscow and was burned in Prague. Still, the old comrades know the Italian and Romanian communists, and every contact helps a Jew get an exit visa."
 COLDWAR_ISR_map_cm: "United Left"
 COLDWAR_ISR_map_cm_desc: "The kibbutz socialists and the city liberals of Ratz discover they vote the same way on almost everything. Together they could be the third force."
 COLDWAR_ISR_map_dm: "Kibbutz Diplomacy"
 COLDWAR_ISR_map_dm_desc: "Tens of thousands of young Europeans and Americans pick bananas on a kibbutz every year. They go home with a suntan and a soft spot for Israel."
 COLDWAR_ISR_map_cap: "Socialist Zionism"
 COLDWAR_ISR_map_cap_desc: "A cooperative economy, a peace with the Arab peoples, a kibbutz in every valley. The dream of 1948, updated for the age of plastics and computers."
 COLDWAR_ISR_rnf_e: "The Iron Wall Revived"
 COLDWAR_ISR_rnf_e_desc: "Jabotinsky wrote that the Arabs would accept the Jews only behind an iron wall. The men of the radical right say the wall must now stand on the Jordan."
 COLDWAR_ISR_rnf_pol: "Street Politics"
 COLDWAR_ISR_rnf_pol_desc: "Marches through Arab towns, sit-ins on hilltops, scuffles with the police. The movement grows on the street, where the ministers cannot reach it."
 COLDWAR_ISR_rnf_eco: "Settler Economy"
 COLDWAR_ISR_rnf_eco_desc: "Cheap land, free roads and generous mortgages for anyone who moves across the Green Line. The treasury pays and the map changes."
 COLDWAR_ISR_rnf_a1: "Kahane's Kach"
 COLDWAR_ISR_rnf_a1_desc: "A rabbi from Brooklyn with a clenched fist on his posters says the Arabs must go. His followers are few and loud, and the other parties walk out when he speaks."
 COLDWAR_ISR_rnf_a2: "Tehiya's Revival"
 COLDWAR_ISR_rnf_a2_desc: "Begin has signed away the Sinai. Geula Cohen, the physicist Yuval Ne'eman and the settler Hanan Porat found a party of revival against Camp David."
 COLDWAR_ISR_rnf_b1: "Arms for Settlers"
 COLDWAR_ISR_rnf_b1_desc: "Every settler gets a rifle and a place in the regional defence. Some use it to guard the fence, some to settle scores in the next village."
 COLDWAR_ISR_rnf_b2: "Free Market Nationalism"
 COLDWAR_ISR_rnf_b2_desc: "The Histadrut is a socialist state within the state. Break it, cut taxes, and let Jewish enterprise build the whole land."
 COLDWAR_ISR_rnf_a1f: "Transfer Doctrine"
 COLDWAR_ISR_rnf_a1f_desc: "They call it transfer, and say it out loud. The party programme demands that the Arabs of the territories be made to leave, and the government now has the means."
 COLDWAR_ISR_rnf_a2f: "Sovereignty Bills"
 COLDWAR_ISR_rnf_a2f_desc: "Private members' bills pile up on the Knesset table: sovereignty over Jerusalem, over the Golan, over Judea and Samaria. Each one is a vote the government must face."
 COLDWAR_ISR_rnf_b1f: "The Jewish Underground"
 COLDWAR_ISR_rnf_b1f_desc: "Car bombs maim Arab mayors, gunmen attack a college in Hebron, and men from the settlements plan to blow up the Dome of the Rock. The state looks away until it cannot."
 COLDWAR_ISR_rnf_b2f: "Moledet"
 COLDWAR_ISR_rnf_b2f_desc: "General Rehavam Ze'evi, called Gandhi for his thin frame, offers transfer by agreement. A soldier's respectability for an idea that is not respectable."
 COLDWAR_ISR_rnf_pm: "No Return of Sinai"
 COLDWAR_ISR_rnf_pm_desc: "Yamit was built to stay. The movement to stop the withdrawal chains itself to the rooftops and dares the army to drag Jews from Jewish homes."
 COLDWAR_ISR_rnf_em: "Greater Israel Housing"
 COLDWAR_ISR_rnf_em_desc: "Five minutes from Kfar Saba, a villa with a garden for the price of a flat in Bat Yam. The suburbs of Greater Israel are sold as quality of life."
 COLDWAR_ISR_rnf_c1: "Collective Punishment"
 COLDWAR_ISR_rnf_c1_desc: "The family of a stone-thrower loses its house; the village loses its water and its road. The fear works for a season, and the hatred lasts a generation."
 COLDWAR_ISR_rnf_c2: "Voluntary Emigration Grants"
 COLDWAR_ISR_rnf_c2_desc: "Money for a ticket, a visa and a new start abroad, paid to every Arab family that signs. Its friends call it humane; everyone else calls it transfer with a cheque."
 COLDWAR_ISR_rnf_d1: "Defy Washington"
 COLDWAR_ISR_rnf_d1_desc: "We are not a vassal. If the Americans suspend an agreement over the Golan, let them; Israel survived before their aid and will survive after it."
 COLDWAR_ISR_rnf_d2: "Alliance of the Pariahs"
 COLDWAR_ISR_rnf_d2_desc: "Two small nations surrounded by enemies and condemned at the UN. Pretoria has coal, uranium and money; Israel has weapons and know-how."
 COLDWAR_ISR_rnf_cm: "The Sovereignty Campaign"
 COLDWAR_ISR_rnf_cm_desc: "One law for the whole land: Hebron as Tel Aviv. The campaign gives the government every tool to annex; whether to use it, and what to do with a million Arabs, it does not say."
 COLDWAR_ISR_rnf_dm: "Temple Mount Movement"
 COLDWAR_ISR_rnf_dm_desc: "Small groups pray at the Mughrabi Gate and draw plans for the Third Temple. The Waqf sees every step on the Mount as the first step of a conquest."
 COLDWAR_ISR_rnf_cap: "Greater Israel"
 COLDWAR_ISR_rnf_cap_desc: "From the sea to the river, one people, one sovereignty. The world will protest, the diaspora will split, and the radical right believes time is on its side."
 COLDWAR_ISR_emc_e: "The Generals' Cabinet"
 COLDWAR_ISR_emc_e_desc: "The country is in danger, the politicians hesitate, and the men who won 1967 sit at the cabinet table in uniform jackets. They promise to govern only as long as the emergency lasts."
 COLDWAR_ISR_emc_pol: "The Kirya War Room"
 COLDWAR_ISR_emc_pol_desc: "Cabinet meetings move from Jerusalem to the defence compound in Tel Aviv. Maps on the walls, a general at every elbow, and the ministers in civilian suits at the far end."
 COLDWAR_ISR_emc_eco: "Defence Budget First"
 COLDWAR_ISR_emc_eco_desc: "Tanks before housing, aircraft before schools. The treasury is told what the army needs, and finds the rest afterwards."
 COLDWAR_ISR_emc_a1: "Rule by Emergency Regulation"
 COLDWAR_ISR_emc_a1_desc: "The state of emergency declared in 1948 was never lifted. Now the cabinet uses it: decrees without the Knesset, closed military zones, strikes forbidden."
 COLDWAR_ISR_emc_a2: "The Cabinet of National Salvation"
 COLDWAR_ISR_emc_a2_desc: "The generals invite every Zionist party into the cabinet. Begin and Allon sit side by side, and nobody can call it a junta."
 COLDWAR_ISR_emc_b1: "Requisition Orders"
 COLDWAR_ISR_emc_b1_desc: "Trucks, buses and bulldozers are registered for the army; factories get orders, not tenders. The shops are empty and the reservists stay at the front."
 COLDWAR_ISR_emc_b2: "Rearmament on American Credit"
 COLDWAR_ISR_emc_b2_desc: "Washington pays, Israel rearms. The generals know the airlift of October can become a permanent bridge, if Congress votes the money."
 COLDWAR_ISR_emc_a1f: "The Censor's Office"
 COLDWAR_ISR_emc_a1f_desc: "The chief censor reads every page before it is printed. Papers that print photographs he has forbidden are shut for a week."
 COLDWAR_ISR_emc_a2f: "The Inner Security Cabinet"
 COLDWAR_ISR_emc_a2f_desc: "Five ministers, three of them former generals, decide war and peace. The parties get the other ministries and the patronage that goes with them."
 COLDWAR_ISR_emc_b1f: "The Ministry Runs Industry"
 COLDWAR_ISR_emc_b1f_desc: "Israel Military Industries, Rafael and the aircraft works answer to the defence ministry, and the defence ministry answers to the generals."
 COLDWAR_ISR_emc_b2f: "The Aid Dividend"
 COLDWAR_ISR_emc_b2f_desc: "American dollars pour concrete in the desert: runways, hangars and roads, built by American contractors on Israeli soil."
 COLDWAR_ISR_emc_pm: "The Defence Minister's Hour"
 COLDWAR_ISR_emc_pm_desc: "The cabinet needs one face. The eyepatch, the Palmach commander, the bulldozer, the chief of staff of Entebbe or the farmer from Tel Adashim: the choice is the cabinet's."
 COLDWAR_ISR_emc_em: "Civil Defence Everywhere"
 COLDWAR_ISR_emc_em_desc: "Every building gets a shelter, every school a drill, every street a warden. The home front is a front."
 COLDWAR_ISR_emc_c1: "Martial Law Beyond the Line"
 COLDWAR_ISR_emc_c1_desc: "In the territories the area commander is law, judge and mayor. Detention without trial for six months, renewable; mayors who protest are put on a bus to the Jordanian border."
 COLDWAR_ISR_emc_c2: "Return to Civilian Norms"
 COLDWAR_ISR_emc_c2_desc: "The generals know what military rule did to the army. Civil courts, civil police and an end to curfews by decree, even if the commanders object."
 COLDWAR_ISR_emc_d1: "The Pre-emptive Doctrine"
 COLDWAR_ISR_emc_d1_desc: "Never again wait for the first blow. If the enemy masses on the border, the air force strikes first, and the cabinet will not ask Washington."
 COLDWAR_ISR_emc_d2: "Deterrence and Washington"
 COLDWAR_ISR_emc_d2_desc: "Strong enough that no one attacks, close enough to Washington that no one doubts who stands behind us. The price is that the first shot must be theirs."
 COLDWAR_ISR_emc_cm: "A National Security Council"
 COLDWAR_ISR_emc_cm_desc: "No more decisions in kitchens and corridors. A permanent staff of soldiers, diplomats and economists prepares every choice for the cabinet."
 COLDWAR_ISR_emc_dm: "Deliberate Ambiguity"
 COLDWAR_ISR_emc_dm_desc: "Israel will not be the first to introduce such weapons to the region, and will not say what it has. The enemy must guess, and guessing deters."
 COLDWAR_ISR_emc_cap: "The Generals' Choice"
 COLDWAR_ISR_emc_cap_desc: "The emergency is over, or the generals say it is not. They can hand the keys back to the Knesset with honour, or keep them and call it security."
 COLDWAR_ISR_emc_bb: "Back to the Barracks"
 COLDWAR_ISR_emc_bb_desc: "The emergency is over. The generals hand the cabinet back to the Knesset and keep the nation's respect."
 COLDWAR_ISR_emc_gs: "The Garrison State"
 COLDWAR_ISR_emc_gs_desc: "The emergency is not over. The cabinet of generals suspends the elections and turns the state into a fortress."
 COLDWAR_ISR_emc_l1: "Dayan Takes the Helm"
 COLDWAR_ISR_emc_l1_desc: "The general with the eye patch is the face of the victory of 1967 and of the failure of 1973. The garrison state wants his name."
 COLDWAR_ISR_emc_l2: "Allon Heads the Cabinet"
 COLDWAR_ISR_emc_l2_desc: "The Palmach commander is also a party man of the kibbutzim. He promises the unions that the fortress will still feed its workers."
 COLDWAR_ISR_emc_l3: "Sharon in Command"
 COLDWAR_ISR_emc_l3_desc: "The bulldozer from the Suez crossing takes the cabinet. Washington and the settlers both read it as a signal."
 COLDWAR_ISR_emc_l4: "Gur's General Staff"
 COLDWAR_ISR_emc_l4_desc: "The paratrooper who took the Old City runs the state like the General Staff: orders, plans and no debates."
 COLDWAR_ISR_emc_l5: "Eitan's Iron Hand"
 COLDWAR_ISR_emc_l5_desc: "Raful promises order in the territories and a hard army. The diaspora papers ask what has become of the Jewish state."
 COLDWAR_ISR_econ_r: "The Economy of Survival"
 COLDWAR_ISR_econ_r_desc: "Every second pound the state spends goes to the army, and every dollar comes from exports, bonds or friends abroad. The economy must grow faster than the threat."
 COLDWAR_ISR_econ_l1: "The Diamond Exchange"
 COLDWAR_ISR_econ_l1_desc: "In the exchange tower at Ramat Gan, thousands of cutters and dealers turn rough stones from Africa into Israel's largest industrial export. A handshake and the word mazal close a deal worth millions."
 COLDWAR_ISR_econ_m1: "Israel Bonds"
 COLDWAR_ISR_econ_m1_desc: "In synagogues from Montreal to Johannesburg, the bond drive is a ritual. The money arrives fast, and it must be paid back."
 COLDWAR_ISR_econ_q1: "Industrial Parks"
 COLDWAR_ISR_econ_q1_desc: "Fenced plots with roads, power and a tax holiday wait for anyone who will build a factory in the Galilee."
 COLDWAR_ISR_econ_l2: "Rough Supply Deals"
 COLDWAR_ISR_econ_l2_desc: "Israel owns no mine. Every carat must be bought from someone who could stop selling tomorrow. Better to sign with the producers directly, and give them a reason to stay."
 COLDWAR_ISR_econ_m2: "The Bank of Israel"
 COLDWAR_ISR_econ_m2_desc: "The governor in Jerusalem warns every finance minister that the printing press is not a budget. Sometimes he is listened to."
 COLDWAR_ISR_econ_q2: "The Water Carrier"
 COLDWAR_ISR_econ_q2_desc: "A pipe from the Sea of Galilee carries the north's water to the fields of the Negev. Every new branch line is a political fight."
 COLDWAR_ISR_econ_la: "The London Sight"
 COLDWAR_ISR_econ_la_desc: "Ten times a year the Central Selling Organisation in London hands each sightholder a box of rough at a price that is not negotiable. Safe, clean, and on someone else's terms."
 COLDWAR_ISR_econ_lb: "Straight from the Mines"
 COLDWAR_ISR_econ_lb_desc: "Buyers fly to Kinshasa and Freetown with cash and come back with stones no cartel has counted. The margins are huge, and so are the questions."
 COLDWAR_ISR_econ_ma: "Index-Linked Everything"
 COLDWAR_ISR_econ_ma_desc: "Wages, savings, rents and taxes all follow the price index. Nobody feels the inflation, which is exactly why nobody stops it."
 COLDWAR_ISR_econ_mb: "Hard Money"
 COLDWAR_ISR_econ_mb_desc: "Stop indexing, cut the deficit and let the pound find its price. The economists promise it will hurt for a year. The unions say it will hurt forever."
 COLDWAR_ISR_econ_qa: "Drip Irrigation"
 COLDWAR_ISR_econ_qa_desc: "A kibbutz in the Negev sells a plastic tube that drips water straight to the roots. Half the water, twice the tomatoes."
 COLDWAR_ISR_econ_qb: "Desalination"
 COLDWAR_ISR_econ_qb_desc: "If there is not enough fresh water, make it from the sea. The engineers in Eilat say it can be done; the accountants ask about the oil bill."
 COLDWAR_ISR_econ_l3: "New York and Tokyo"
 COLDWAR_ISR_econ_l3_desc: "The polished stones go where the brides are: to the jewellers of 47th Street, and to a Japan that has just discovered the engagement ring."
 COLDWAR_ISR_econ_m3: "The Shekel"
 COLDWAR_ISR_econ_m3_desc: "Ten old pounds become one shekel. The banknotes look new; the question is whether the prices will."
 COLDWAR_ISR_econ_q3: "Silicon Wadi"
 COLDWAR_ISR_econ_q3_desc: "The engineers who build radar for the air force start companies of their own. Herzliya and Haifa fill with small firms making scanners, printers and chips."
 COLDWAR_ISR_econ_l4: "The Diamond Tower"
 COLDWAR_ISR_econ_l4_desc: "The exchange grows into a district of towers, banks and cutting floors. Ramat Gan now prices a good share of the world's polished diamonds."
 COLDWAR_ISR_econ_m4: "Stabilize the Economy"
 COLDWAR_ISR_econ_m4_desc: "Cut the budget, freeze wages and prices, devalue once and then hold the line. A national unity government is the only one that could dare it."
 COLDWAR_ISR_econ_q4: "Intel in Haifa"
 COLDWAR_ISR_econ_q4_desc: "An American chip maker opens its first design centre outside the United States, in Haifa. If Intel comes, others will follow."
 COLDWAR_ISR_econ_f: "The High-Tech Economy"
 COLDWAR_ISR_econ_f_desc: "Diamonds, water technology and electronics: a country without oil sells what its people know. The economy finally weighs more than its size."
 COLDWAR_ISR_ali_r: "The Law of Return"
 COLDWAR_ISR_ali_r_desc: "Every Jew has the right to come home. Since this spring, so does a Jew's non-Jewish grandchild, and the state must find them all a roof."
 COLDWAR_ISR_ali_l1: "Let My People Go"
 COLDWAR_ISR_ali_l1_desc: "Three million Jews live behind the Iron Curtain. Moscow lets a few thousand go each year when it wants something from the West. Ask, and keep asking."
 COLDWAR_ISR_ali_m1: "Absorption Centres"
 COLDWAR_ISR_ali_m1_desc: "A furnished flat, a Hebrew class and a social worker for the first six months: the absorption centre is the newcomer's first address in Israel."
 COLDWAR_ISR_ali_q1: "Beta Israel"
 COLDWAR_ISR_ali_q1_desc: "In the villages of Gondar live Jews who have prayed for Jerusalem for two thousand years. The rabbis have recognised them; now someone must bring them."
 COLDWAR_ISR_ali_l2: "The Refuseniks"
 COLDWAR_ISR_ali_l2_desc: "Engineers fired for applying to leave, teachers of Hebrew sent to camps: their names are read out at rallies in New York and London."
 COLDWAR_ISR_ali_m2: "Hebrew in the Ulpan"
 COLDWAR_ISR_ali_m2_desc: "Five months, five mornings a week: a dentist from Buenos Aires and a cobbler from Tbilisi learn the same verbs."
 COLDWAR_ISR_ali_q2: "Operation Moses"
 COLDWAR_ISR_ali_q2_desc: "Thousands have walked to the refugee camps in Sudan. Planes land at night, take them on board and fly them out through Europe, as long as nobody talks."
 COLDWAR_ISR_ali_la: "Direct Flights via Romania"
 COLDWAR_ISR_ali_la_desc: "Bucharest is the only Warsaw Pact capital that kept its embassy in Israel. It sells exit permits, quietly and by the head."
 COLDWAR_ISR_ali_lb: "Through Vienna"
 COLDWAR_ISR_ali_lb_desc: "The train from Moscow stops in Vienna. There, at the transit camp, many of our immigrants discover that they would rather go to Brooklyn."
 COLDWAR_ISR_ali_ma: "Development Towns"
 COLDWAR_ISR_ali_ma_desc: "From the ship straight to the periphery: new immigrants fill the towns that guard the borders and the desert."
 COLDWAR_ISR_ali_mb: "Settle the Territories"
 COLDWAR_ISR_ali_mb_desc: "Cheap housing across the Green Line is offered to every immigrant who will take it. Washington asks whether its money is paying for this."
 COLDWAR_ISR_ali_qa: "Western Aliyah"
 COLDWAR_ISR_ali_qa_desc: "Young Americans and French come after the victory of 1967, with degrees and ideals. Many stay; many find the bureaucracy too much."
 COLDWAR_ISR_ali_qb: "Communities in Danger"
 COLDWAR_ISR_ali_qb_desc: "The last Jews of Morocco, of Tehran after the revolution, of Damascus behind closed borders: they must leave quietly, one family at a time."
 COLDWAR_ISR_ali_l3: "The Soviet Wave"
 COLDWAR_ISR_ali_l3_desc: "They come with diplomas, violins and no Hebrew. Within a decade they will run hospitals, labs and orchestras."
 COLDWAR_ISR_ali_m3: "The Housing Ministry"
 COLDWAR_ISR_ali_m3_desc: "Prefabricated blocks, caravans and whole new neighbourhoods: the ministry builds faster than the planners can draw."
 COLDWAR_ISR_ali_q3: "The Yerida Problem"
 COLDWAR_ISR_ali_q3_desc: "Hundreds of thousands of Israelis now live in Los Angeles and Toronto. The government stops calling them deserters and starts inviting them home."
 COLDWAR_ISR_ali_l4: "Engineers from Leningrad"
 COLDWAR_ISR_ali_l4_desc: "A doctor of physics from Leningrad sweeps the street in Beersheba. The ministry has a programme for him; it has a waiting list."
 COLDWAR_ISR_ali_m4: "A Nation of Immigrants"
 COLDWAR_ISR_ali_m4_desc: "The melting pot is cooling into a mosaic. Moroccan Mimouna, Russian theatre and Yemeni song now belong to everyone."
 COLDWAR_ISR_ali_q4: "Twinned with the Diaspora"
 COLDWAR_ISR_ali_q4_desc: "Communities in Cleveland and Manchester adopt a neighbourhood in Israel and send money, volunteers and opinions."
 COLDWAR_ISR_ali_f: "The Ingathering Fulfilled"
 COLDWAR_ISR_ali_f_desc: "Jews from a hundred countries now share one language and one army. The state was built for them, and they have rebuilt the state."
 COLDWAR_ISR_ter_r: "The Morning After"
 COLDWAR_ISR_ter_r_desc: "Since June 1967 Israel rules a million Arabs from the Jordan to the Suez Canal. The cabinet has not decided what they are: a bargaining chip, a security belt, or a homeland."
 COLDWAR_ISR_ter_l1: "The Military Government"
 COLDWAR_ISR_ter_l1_desc: "A military governor rules each district by order and proclamation. Jordanian law stays, the army decides what it means."
 COLDWAR_ISR_ter_m1: "Nahal Outposts"
 COLDWAR_ISR_ter_m1_desc: "Soldiers of the Nahal brigade plough and stand guard at the same time. Today it is a military post; tomorrow it may be a village."
 COLDWAR_ISR_ter_q1: "The Golan Plan"
 COLDWAR_ISR_ter_q1_desc: "From the heights the Syrian guns once shelled the Hula valley. Now kibbutzim grow apples there, and a town is planned at Katzrin."
 COLDWAR_ISR_ter_l2: "Open Bridges"
 COLDWAR_ISR_ter_l2_desc: "Dayan lets the trucks of melons and olive oil cross the Jordan bridges. Let them trade, travel and study in Amman, and they will have something to lose."
 COLDWAR_ISR_ter_m2: "State Land Declarations"
 COLDWAR_ISR_ter_m2_desc: "The court has forbidden taking private land for settlements. The lawyers answer with old Ottoman registers: what is not proven cultivated belongs to the state."
 COLDWAR_ISR_ter_q2: "The Rafah Salient"
 COLDWAR_ISR_ter_q2_desc: "A wedge of new villages and a seaside town between Gaza and Sinai, to cut the Strip off from Egypt forever. First the Bedouin who farm there must go."
 COLDWAR_ISR_ter_la: "Work Permits"
 COLDWAR_ISR_ter_la_desc: "Every morning the buses from Gaza and Hebron bring the men who build Israel's houses and pick its oranges. They go home at night; most are not allowed to stay."
 COLDWAR_ISR_ter_lb: "Separate Economies"
 COLDWAR_ISR_ter_lb_desc: "Keep the two economies apart: no cheap labour across the line, no dependence either way. Integration today means one state tomorrow."
 COLDWAR_ISR_ter_ma: "Security Settlements Only"
 COLDWAR_ISR_ter_ma_desc: "Settle where the army needs depth, not where the Bible tells stories. Keep the hills of Nablus for a future deal."
 COLDWAR_ISR_ter_mb: "Settle Everywhere"
 COLDWAR_ISR_ter_mb_desc: "Every hilltop is a settlement waiting to happen. The settlers vote in Israel and are tried in Israeli courts; their neighbours in the next village are not."
 COLDWAR_ISR_ter_qa: "Annex the Golan"
 COLDWAR_ISR_ter_qa_desc: "Extend Israeli law to the Golan in one afternoon session, before anyone abroad can object. The Druze villages will be handed Israeli identity cards."
 COLDWAR_ISR_ter_qb: "Golan as a Bargaining Chip"
 COLDWAR_ISR_ter_qb_desc: "The heights are worth more on the table than on the map. Hold them, build little, and let Damascus know the price of a signature."
 COLDWAR_ISR_ter_l3: "The Civil Administration"
 COLDWAR_ISR_ter_l3_desc: "Civilian officials take over schools, permits and taxes from the army. The military government stays behind them and signs the orders."
 COLDWAR_ISR_ter_m3: "Roads to the Settlements"
 COLDWAR_ISR_ter_m3_desc: "A settlement without a road is an outpost; with a road it is a suburb of Jerusalem or Tel Aviv. The planners draw lines that bypass the Arab towns."
 COLDWAR_ISR_ter_q3: "The Intifada Doctrine"
 COLDWAR_ISR_ter_q3_desc: "The stones are thrown by teenagers, and the whole world is filming. The army has no doctrine for this, so the government must write one."
 COLDWAR_ISR_ter_l4: "Village Leagues"
 COLDWAR_ISR_ter_l4_desc: "If the town mayors listen to the PLO, the government will talk to the villages instead. The leagues get budgets, permits and guns."
 COLDWAR_ISR_ter_m4: "Jerusalem United"
 COLDWAR_ISR_ter_m4_desc: "A Basic Law can declare Jerusalem, complete and united, the capital of Israel. Whether the Knesset should pass it now is another question."
 COLDWAR_ISR_ter_q4: "Iron Fist or Talks"
 COLDWAR_ISR_ter_q4_desc: "Crush the uprising or offer elections in the territories: the cabinet is split down the middle, and both answers cost something."
 COLDWAR_ISR_ter_f: "The Future of the Territories"
 COLDWAR_ISR_ter_f_desc: "Twenty years after the war, the territories still have no final status. Whatever this government decides, the next one will inherit."
 COLDWAR_ISR_soc_r: "The Cracked Melting Pot"
 COLDWAR_ISR_soc_r_desc: "Ben-Gurion promised a melting pot. Twenty years later the Ashkenazi founders run the state, the Moroccans and Iraqis live in the development towns, the Haredim live by their own rules, and the Arab citizens are only just free of military rule."
 COLDWAR_ISR_soc_l1: "Two Israels"
 COLDWAR_ISR_soc_l1_desc: "Young men from Musrara have borrowed a name from America and are throwing bottles at the police. Their grievance is real: the second Israel earns less, learns less and serves in the worst units."
 COLDWAR_ISR_soc_m1: "The Status Quo Letter"
 COLDWAR_ISR_soc_m1_desc: "Sabbath, kashrut, marriage and divorce belong to the rabbinate, and the religious schools to themselves. Every government inherits the deal and every coalition is built on it."
 COLDWAR_ISR_soc_q1: "Citizens Without Equality"
 COLDWAR_ISR_soc_q1_desc: "The military government is gone, the permits are gone, but the land registry, the budgets and the Shin Bet remain. Arab citizens vote, and vote for lists the Labour party manages for them."
 COLDWAR_ISR_soc_la: "Pay to Close the Gap"
 COLDWAR_ISR_soc_la_desc: "Child allowances for large families, school integration, free secondary education. The gap narrows, the budget explodes, and a generation learns to wait for the welfare office."
 COLDWAR_ISR_soc_lb: "Arrest and Co-opt"
 COLDWAR_ISR_soc_lb_desc: "Arrest the leaders before demonstrations, find the moderates a job in the party or the labour federation. It works for a while. The anger goes to the ballot box instead."
 COLDWAR_ISR_soc_ma: "The Orthodox Monopoly"
 COLDWAR_ISR_soc_ma_desc: "No buses on the Sabbath, no El Al flights, no civil marriage, and no rabbi but an Orthodox one. The coalition is safe. Half of American Jewry is told its rabbis do not count."
 COLDWAR_ISR_soc_mb: "The Secular Revolt"
 COLDWAR_ISR_soc_mb_desc: "Cinemas open on Friday night, buses run and couples marry before a clerk. The religious parties walk out of cabinet and Mea Shearim burns tyres."
 COLDWAR_ISR_soc_qa: "Equal Budgets"
 COLDWAR_ISR_soc_qa_desc: "Same budget per pupil in Nazareth as in Nazareth Illit, roads to the villages, sewage in Umm al-Fahm. It costs real money and the right calls it betrayal."
 COLDWAR_ISR_soc_qb: "Judaize the Galilee"
 COLDWAR_ISR_soc_qb_desc: "The north has an Arab majority, and the Interior Ministry's district commissioner wants it reversed: confiscate land, plant Jewish hilltop villages, squeeze the Arab towns. The memo leaks."
 COLDWAR_ISR_soc_l2: "The Forgotten Towns"
 COLDWAR_ISR_soc_l2_desc: "Yeruham, Ofakim, Kiryat Shmona, Beit She'an: towns built for immigrants who were brought there by lorry at night. One textile mill, one school, and a bus to nowhere."
 COLDWAR_ISR_soc_m2: "The Yeshiva World"
 COLDWAR_ISR_soc_m2_desc: "Bnei Brak and Mea Shearim are growing faster than any town in the country. Men study all day, women raise seven children, and the state pays the stipends."
 COLDWAR_ISR_soc_q2: "Divide and Enlist"
 COLDWAR_ISR_soc_q2_desc: "The Druze serve and get their own battalion. The Bedouin trackers serve and their tents are torn down. The Christians and Muslims of the cities are told they are a different case."
 COLDWAR_ISR_soc_lc: "Twinned Neighbourhoods"
 COLDWAR_ISR_soc_lc_desc: "Each poor neighbourhood gets a Jewish community abroad as partner, money for flats and community centres, and a committee of residents. The patrons from Cleveland expect gratitude and photographs."
 COLDWAR_ISR_soc_ld: "Leave It to the Market"
 COLDWAR_ISR_soc_ld_desc: "Subsidised mills that lose money are closed. Those who want work can move to Tel Aviv. The economy gets leaner, and the towns become places of old people and anger."
 COLDWAR_ISR_soc_mc: "Keep the Exemption"
 COLDWAR_ISR_soc_mc_desc: "Torah study is their service. The exemption that began with four hundred students grows every year, and so does the anger of the parents whose sons do serve."
 COLDWAR_ISR_soc_md: "End the Exemption"
 COLDWAR_ISR_soc_md_desc: "Every yeshiva student receives a call-up order. Tens of thousands pray in the streets of Jerusalem, many refuse, and the military police must decide whom to arrest."
 COLDWAR_ISR_soc_qc: "One Law for All Citizens"
 COLDWAR_ISR_soc_qc_desc: "Arab citizens on the boards of state companies, in the civil service, at the universities. The Shin Bet loses its veto over teachers and mayors. Some of them will use their freedom against us."
 COLDWAR_ISR_soc_qd: "Surveillance and Control"
 COLDWAR_ISR_soc_qd_desc: "Every teacher, village head and clerk is vetted. Informers in every clan, favours for the obedient, jobs lost for the troublesome. Quiet is guaranteed, loyalty is not."
 COLDWAR_ISR_soc_l3: "The Second Israel Votes"
 COLDWAR_ISR_soc_l3_desc: "The children of the transit camps have found their vote. They will not forget who sent their parents to the desert, and they will not be satisfied with gratitude."
 COLDWAR_ISR_soc_m3: "A Jewish State, Defined"
 COLDWAR_ISR_soc_m3_desc: "What is a Jewish state: a state of the Jews, or a state of Jewish law? The Knesset writes an answer into the Basic Laws, and nobody is satisfied."
 COLDWAR_ISR_soc_q3: "Israeli or Palestinian?"
 COLDWAR_ISR_soc_q3_desc: "Since 1967 our Arab citizens meet their cousins from Jenin and Nablus again. Whether they call themselves Israeli Arabs or Palestinians in Israel depends, in part, on us."
 COLDWAR_ISR_soc_f: "The Shape of Israeli Society"
 COLDWAR_ISR_soc_f_desc: "Four tribes, as a later president would say: secular, national-religious, Haredi and Arab, plus the gap between east and west. Our choices decide whether they live in one state or four."
 COLDWAR_ISR_idf_r: "The Citizens' Army"
 COLDWAR_ISR_idf_r_desc: "Every man serves three years, every woman two, and then they come back for a month each year until their fifties. Zahal is not an army with a country, it is a country that turns into an army in forty-eight hours."
 COLDWAR_ISR_idf_l1: "The Bar-Lev Line"
 COLDWAR_ISR_idf_l1_desc: "A chain of sand-and-steel strongpoints along the canal lets a few hundred reservists watch the Egyptian army. Generals Sharon and Tal call it a death trap; the General Staff calls it a tripwire."
 COLDWAR_ISR_idf_m1: "The Reserve System"
 COLDWAR_ISR_idf_m1_desc: "The bus driver, the professor and the kibbutz tractor man keep their kit at home. When the radio reads out the code words, the economy stops and the divisions roll."
 COLDWAR_ISR_idf_q1: "Phantoms and Skyhawks"
 COLDWAR_ISR_idf_q1_desc: "The Phantom carries more bombs farther than anything in the region. Its spare parts come from St. Louis, and so does the decision whether we get them."
 COLDWAR_ISR_idf_l2: "Armour Doctrine"
 COLDWAR_ISR_idf_l2_desc: "The tank won in 1967 and the tank will win the next war. Israel Tal's armoured corps gets the money, the best conscripts and the last word."
 COLDWAR_ISR_idf_m2: "Women in Uniform"
 COLDWAR_ISR_idf_m2_desc: "Women instruct tank gunners, run the signals rooms and staff the offices. The religious parties fight every year to keep religious girls out of uniform."
 COLDWAR_ISR_idf_q2: "Israel Aircraft Industries"
 COLDWAR_ISR_idf_q2_desc: "The maintenance shop at Lod has become the country's largest employer. It copies the Mirage, builds the Arava transport and wants a fighter of its own."
 COLDWAR_ISR_idf_la: "Tank Supremacy"
 COLDWAR_ISR_idf_la_desc: "Pure tank brigades, charging fast and deep, with infantry and artillery left behind. It is magnificent against tanks. Against infantry with wire-guided rockets it is a gamble."
 COLDWAR_ISR_idf_lb: "Combined Arms"
 COLDWAR_ISR_idf_lb_desc: "Every tank battalion gets its mortars, its infantry in armoured carriers and its artillery observers. Slower, more expensive, and much harder to kill."
 COLDWAR_ISR_idf_ma: "Longer Service"
 COLDWAR_ISR_idf_ma_desc: "Thirty-six months for every man, more for officers. The line units are full and well drilled, and the universities and factories wait another year for their students and workers."
 COLDWAR_ISR_idf_mb: "Elite Units"
 COLDWAR_ISR_idf_mb_desc: "The General Staff reconnaissance unit takes the best eighteen-year-olds in the country and sends them where nobody else can go. The line brigades lose their future officers."
 COLDWAR_ISR_idf_qa: "The Kfir"
 COLDWAR_ISR_idf_qa_desc: "A Mirage airframe with an American engine and Israeli electronics. Every Kfir built at Lod is one less aircraft somebody can refuse to sell us."
 COLDWAR_ISR_idf_qb: "Buy American"
 COLDWAR_ISR_idf_qb_desc: "Why build what the Americans sell, with credit? The best fighters in the world arrive in squadrons, and every one of them comes with a phone line to the Pentagon."
 COLDWAR_ISR_idf_l3: "The Merkava"
 COLDWAR_ISR_idf_l3_desc: "Britain cancelled the Chieftain deal, and Israel will never again depend on someone else's tank. Tal designs a tank around the crew: engine in front, men protected behind it."
 COLDWAR_ISR_idf_m3: "The Golani and the Paratroops"
 COLDWAR_ISR_idf_m3_desc: "Golani takes the hills, the paratroopers take the cities. Their brown and red berets are worth a division in reputation alone."
 COLDWAR_ISR_idf_q3: "The Lavi Question"
 COLDWAR_ISR_idf_q3_desc: "A national fighter of our own, paid largely with American aid dollars. Washington says it is too expensive, the engineers say it is the future of the country's industry."
 COLDWAR_ISR_idf_l4: "Ground Forces Command"
 COLDWAR_ISR_idf_l4_desc: "Armour, infantry, artillery and engineers under one command that writes doctrine and trains divisions, while the General Staff fights the war."
 COLDWAR_ISR_idf_m4: "The Agranat Reforms"
 COLDWAR_ISR_idf_m4_desc: "No single intelligence chief will ever again decide alone that there is no war. A second opinion, new commanders and an army that rehearses the worst case."
 COLDWAR_ISR_idf_q4: "The Cherbourg Boats"
 COLDWAR_ISR_idf_q4_desc: "No cruisers, no destroyers: small, fast boats built in Cherbourg and Haifa, crewed by young officers who fight at night and close to the coast."
 COLDWAR_ISR_idf_f: "The Qualitative Edge"
 COLDWAR_ISR_idf_f_desc: "We will always be fewer. We must be better trained, better led and better equipped than any coalition that faces us."
 COLDWAR_ISR_sec_r: "Shabak and Mossad"
 COLDWAR_ISR_sec_r_desc: "The Shin Bet watches the territories and the citizens, the Mossad watches the world. Neither has a law that defines it, and both answer only to the Prime Minister."
 COLDWAR_ISR_sec_l1: "Counter-Terror Units"
 COLDWAR_ISR_sec_l1_desc: "Fedayeen cross from Lebanon at night and take schools and apartment blocks. The police get their own assault unit and the army learns to fight inside a town at home."
 COLDWAR_ISR_sec_m1: "The Dimona Programme"
 COLDWAR_ISR_sec_m1_desc: "The reactor in the Negev is officially a textile plant, then a research centre. What matters is that its scientists and engineers make every other special project faster."
 COLDWAR_ISR_sec_q1: "Mossad Abroad"
 COLDWAR_ISR_sec_q1_desc: "Stations in Paris, Rome, London and Nairobi, businessmen with three passports, and sources in every Arab capital."
 COLDWAR_ISR_sec_l2: "Airport Security"
 COLDWAR_ISR_sec_l2_desc: "Every passenger is questioned, every bag is opened, and every Arab name gets a second look. El Al becomes the safest airline in the world and the most unpleasant one to board."
 COLDWAR_ISR_sec_m2: "Weizmann and Soreq"
 COLDWAR_ISR_sec_m2_desc: "The Weizmann Institute built one of the first computers in the world outside America and Britain. Soreq's reactor trains the physicists who will run everything else."
 COLDWAR_ISR_sec_q2: "Operation Plumbat"
 COLDWAR_ISR_sec_q2_desc: "What the reactor needs, the market will not sell openly. A shipping company in Germany, a ship that changes its name and a cargo that never arrives in Genoa."
 COLDWAR_ISR_sec_la: "Wrath of God"
 COLDWAR_ISR_sec_la_desc: "Everyone involved in Munich will be found. The committee in Jerusalem signs the names, Caesarea does the rest, in Rome, Paris and Beirut. Sooner or later the wrong man is shot."
 COLDWAR_ISR_sec_lb: "Restraint and Law"
 COLDWAR_ISR_sec_lb_desc: "We arrest, we try, we sentence, and we do not shoot people on European streets. It keeps our friends in Europe, and it leaves the planners of Munich alive."
 COLDWAR_ISR_sec_ma: "Nuclear Energy"
 COLDWAR_ISR_sec_ma_desc: "A country without oil and without coal needs power from somewhere. A reactor at Nitzanim would end the dependence on tankers through Eilat."
 COLDWAR_ISR_sec_mb: "Strategic Programmes"
 COLDWAR_ISR_sec_mb_desc: "The best engineers go to Dimona and Rafael, not to the power station. The country gets security that cannot be bought abroad, and less of everything else."
 COLDWAR_ISR_sec_qa: "Periphery Intelligence"
 COLDWAR_ISR_sec_qa_desc: "Mossad, SAVAK and the Turkish service meet twice a year and share what they know about Baghdad and Damascus. In the mountains, Israeli advisers stand beside Barzani's Kurds."
 COLDWAR_ISR_sec_qb: "Friends in Europe"
 COLDWAR_ISR_sec_qb_desc: "After Munich, Europe's services want to know what we know. The BND and the French talk to us quietly, and expect discretion in return."
 COLDWAR_ISR_sec_l3: "Operation Thunderbolt"
 COLDWAR_ISR_sec_l3_desc: "Four Hercules aircraft, two thousand miles, ninety minutes on the ground. Israel will go anywhere to bring its people home, and the world will know it."
 COLDWAR_ISR_sec_m3: "Space Programme"
 COLDWAR_ISR_sec_m3_desc: "A small country that launches west, against the Earth's rotation, so as not to fly over its neighbours. Once a satellite is up, we no longer need to borrow anyone's photographs."
 COLDWAR_ISR_sec_q3: "The Vanunu Affair"
 COLDWAR_ISR_sec_q3_desc: "A dismissed technician took photographs inside Machon 2 and is talking to a London newspaper. A woman named Cindy has invited him to Rome."
 COLDWAR_ISR_sec_l4: "The Shin Bet Scandals"
 COLDWAR_ISR_sec_l4_desc: "Two hijackers were taken alive from the bus. An hour later they were dead, and the service lied to two inquiries. The Prime Minister must decide whether the truth or the service comes first."
 COLDWAR_ISR_sec_m4: "The Jericho Missiles"
 COLDWAR_ISR_sec_m4_desc: "Dassault started it, we finished it. A missile that reaches any capital that threatens us, built where no embargo can touch it."
 COLDWAR_ISR_sec_q4: "Signals Intelligence"
 COLDWAR_ISR_sec_q4_desc: "The intelligence branch listens to every radio net from Damascus to Cairo. Its conscripts later found half the country's electronics firms."
 COLDWAR_ISR_sec_f: "A Secure Israel"
 COLDWAR_ISR_sec_f_desc: "The services, the laboratories and the special projects work together. The citizen sees little of it, and is meant to."
 COLDWAR_ISR_for_r: "A Small Country's Diplomacy"
 COLDWAR_ISR_for_r_desc: "The Soviet bloc broke with us in 1967, the Arab world refuses to recognise us and Africa is wavering. Every friendship has to be earned and paid for."
 COLDWAR_ISR_for_l1: "Washington"
 COLDWAR_ISR_for_l1_desc: "The Americans are now our arsenal and our banker. They will not let us lose a war, and they will expect to be heard when the shooting stops."
 COLDWAR_ISR_for_m1: "The Periphery Doctrine"
 COLDWAR_ISR_for_m1_desc: "The Arabs surround us, but beyond them lie Persians, Turks and Ethiopians who fear the same enemies. Friendship with the periphery is quiet, practical and denied in public."
 COLDWAR_ISR_for_q1: "Pretoria"
 COLDWAR_ISR_for_q1_desc: "When Black Africa turned away, Pretoria came calling with money and raw materials. It buys our guns and our know-how, and it shares our isolation."
 COLDWAR_ISR_for_l2: "Bonn"
 COLDWAR_ISR_for_l2_desc: "Germany paid, Germany delivers, and Germany wants normality. Many in Israel still cannot shake a German hand."
 COLDWAR_ISR_for_m2: "Oil from the Shah"
 COLDWAR_ISR_for_m2_desc: "Iranian crude lands at Eilat and flows through the desert to Ashkelon. The Shah gets Israeli advisers and a route around Suez. All of it depends on one man in Tehran."
 COLDWAR_ISR_for_q2: "Bucharest"
 COLDWAR_ISR_for_q2_desc: "Ceausescu is the only Warsaw Pact ruler who kept his ambassador in Tel Aviv. He likes to be the man everyone must talk through."
 COLDWAR_ISR_for_la: "Paris Reconciled"
 COLDWAR_ISR_for_la_desc: "De Gaulle cut us off, the Elysée still sells Mirages to Libya. But France built Dimona with us, and old friendships can be repaired."
 COLDWAR_ISR_for_lb: "London and the Commonwealth"
 COLDWAR_ISR_for_lb_desc: "Our tanks are British and so are our habits of government. London cancelled the Chieftain and keeps embargoes ready, but trade and spare parts keep flowing."
 COLDWAR_ISR_for_ma: "Ethiopia's Emperor"
 COLDWAR_ISR_for_ma_desc: "Haile Selassie's officers trained with us and his coast faces the Bab el-Mandeb. Whoever rules in Addis Ababa, the Red Sea route and the Beta Israel matter to Jerusalem."
 COLDWAR_ISR_for_mb: "Ankara's Quiet Friendship"
 COLDWAR_ISR_for_mb_desc: "Turkey was the first Muslim country to recognise us. It keeps the relationship at the level of chargé d'affaires and does business without the photographs."
 COLDWAR_ISR_for_qa: "Taipei"
 COLDWAR_ISR_for_qa_desc: "Taiwan is rich, isolated and eager to buy. We have no embassy and need none."
 COLDWAR_ISR_for_qb: "Beijing Quietly"
 COLDWAR_ISR_for_qb_desc: "A billionaire in Tokyo with friends in Beijing opens doors that diplomats cannot. China wants to modernise its army and asks no questions about the Arabs."
 COLDWAR_ISR_for_l3: "The European Community"
 COLDWAR_ISR_for_l3_desc: "Europe buys our oranges and our cut diamonds. A free trade agreement opens its market, and opens ours to its factories."
 COLDWAR_ISR_for_m3: "Africa Reconnected"
 COLDWAR_ISR_for_m3_desc: "Our agronomists dug wells in Ghana before the oil states promised more money. One by one, the capitals that broke with us in 1973 are reopening their doors."
 COLDWAR_ISR_for_q3: "Amman in Secret"
 COLDWAR_ISR_for_q3_desc: "The King flies in by night. We fought him in 1967, we saved him from the Syrians in 1970, and we meet him in London tents and Arava caravans."
 COLDWAR_ISR_for_l4: "The Jewish Lobby"
 COLDWAR_ISR_for_l4_desc: "Congress listens when American Jews speak. They speak loudest when they agree with Jerusalem, and they notice when they do not."
 COLDWAR_ISR_for_m4: "Latin American Arms Market"
 COLDWAR_ISR_for_m4_desc: "Galil rifles, Arava transports and advisers for anyone who pays: Argentina's juntas, Guatemala's colonels, El Salvador. The factories stay open, and the customers are what they are."
 COLDWAR_ISR_for_q4: "Peace on Paper and in the Sand"
 COLDWAR_ISR_for_q4_desc: "Whether there is peace with Cairo, and whether our soldiers still stand in Sinai, is decided by governments, not by this office. We build on whatever exists."
 COLDWAR_ISR_for_f: "Israel Among the Nations"
 COLDWAR_ISR_for_f_desc: "From two dozen friends to a hundred embassies: a small state that the world has to reckon with."
 COLDWAR_ISR_for_q5: "Talks with the PLO"
 COLDWAR_ISR_for_q5_desc: "Oslo, a farmhouse and two exhausted delegations: recognition for recognition, and Gaza first under Palestinian self-rule."
 COLDWAR_ISR_aln_arms_dependency: "Dependence on American Arms"
 COLDWAR_ISR_aln_arms_dependency_desc: "Without an American arms partnership, every military programme costs more."
 COLDWAR_ISR_aln_labour_state: "The Labour State"
 COLDWAR_ISR_aln_labour_state_desc: "Renewed Labour Zionism binds the party, the Histadrut and the state into one working machine."
 COLDWAR_ISR_aln_export_drive: "The Export Drive"
 COLDWAR_ISR_aln_export_drive_desc: "Export premiums and trade missions make Israeli goods welcome abroad."
 COLDWAR_ISR_aln_stabilization_plan: "The Stabilization Plan"
 COLDWAR_ISR_aln_stabilization_plan_desc: "Wage freezes and budget cuts break the inflation spiral at the cost of the workers' purchasing power."
 COLDWAR_ISR_lik_correct_economics: "Correct Economics"
 COLDWAR_ISR_lik_correct_economics_desc: "Cheaper cars and televisions put the new government in a good light for a year."
 COLDWAR_ISR_lik_national_camp: "The National Camp"
 COLDWAR_ISR_lik_national_camp_desc: "The national camp holds the state: confident, building, and isolated abroad."
 COLDWAR_ISR_lik_campaign_tensions: "Campaign Tensions"
 COLDWAR_ISR_lik_campaign_tensions_desc: "The fight for the Sephardi vote sharpens the street."
 COLDWAR_ISR_lik_open_currency: "Open Currency Markets"
 COLDWAR_ISR_lik_open_currency_desc: "Without currency controls, foreign traders deal with Israel more freely."
 COLDWAR_ISR_lik_stock_boom: "Stock Exchange Boom"
 COLDWAR_ISR_lik_stock_boom_desc: "Bank shares only ever rise, and the treasury taxes the gains."
 COLDWAR_ISR_lik_lebanese_quagmire: "Lebanese Quagmire"
 COLDWAR_ISR_lik_lebanese_quagmire_desc: "A war that was meant to last days has lasted a year, and the country is counting its dead."
 COLDWAR_ISR_maf_religious_commerce: "Religious Commerce"
 COLDWAR_ISR_maf_religious_commerce_desc: "Kosher certification opens Orthodox markets abroad to Israeli traders."
 COLDWAR_ISR_maf_sabbath_skies: "Grounded on the Sabbath"
 COLDWAR_ISR_maf_sabbath_skies_desc: "El Al no longer flies on the Sabbath, and foreign partners notice."
 COLDWAR_ISR_maf_torah_and_the_land: "Torah and the Land"
 COLDWAR_ISR_maf_torah_and_the_land_desc: "Religious Zionism stands at the centre of the state, its schools, its army and its frontier."
 COLDWAR_ISR_maf_kashrut_exports: "Kashrut Exports"
 COLDWAR_ISR_maf_kashrut_exports_desc: "Israeli kosher food finds buyers in every Jewish community abroad."
 COLDWAR_ISR_lib_open_markets: "Open Markets"
 COLDWAR_ISR_lib_open_markets_desc: "Currency controls are eased and Israel opens its markets to the world."
 COLDWAR_ISR_lib_status_quo_crisis: "Status Quo Crisis"
 COLDWAR_ISR_lib_status_quo_crisis_desc: "Civil marriage breaks the religious status quo, and the religious camp takes to the streets."
 COLDWAR_ISR_lib_liberal_republic: "The Liberal Republic"
 COLDWAR_ISR_lib_liberal_republic_desc: "A constitution, open markets and a merit state: the liberal Israel its founders promised."
 COLDWAR_ISR_rel_society_of_learners: "The Society of Learners"
 COLDWAR_ISR_rel_society_of_learners_desc: "Every young man in the yeshiva, every family large: the Torah nation lives on state support."
 COLDWAR_ISR_rak_peoples_economy: "The People's Economy"
 COLDWAR_ISR_rak_peoples_economy_desc: "Banks, factories and fields answer to the workers' councils, and the state promises every citizen bread and work."
 COLDWAR_ISR_arb_olive_cooperatives: "Olive Cooperatives"
 COLDWAR_ISR_arb_olive_cooperatives_desc: "Galilean olive oil and produce reach foreign buyers through village cooperatives."
 COLDWAR_ISR_arb_state_of_all_citizens: "A State of All Its Citizens"
 COLDWAR_ISR_arb_state_of_all_citizens_desc: "Arab and Jewish citizens stand equal before every ministry, budget and court of the State of Israel."
 COLDWAR_ISR_hao_open_society: "The Open Society"
 COLDWAR_ISR_hao_open_society_desc: "A free press, clean courts and open universities, at the price of a public that questions every war."
 COLDWAR_ISR_map_kibbutz_exports: "Kibbutz Exports"
 COLDWAR_ISR_map_kibbutz_exports_desc: "Tnuva dairy and kibbutz plastics find buyers abroad."
 COLDWAR_ISR_map_cooperative_commonwealth: "The Cooperative Commonwealth"
 COLDWAR_ISR_map_cooperative_commonwealth_desc: "Kibbutz, moshav and Histadrut enterprise carry the economy as one cooperative commonwealth."
 COLDWAR_ISR_rnf_eretz_yisrael_hashlema: "Eretz Yisrael HaShlema"
 COLDWAR_ISR_rnf_eretz_yisrael_hashlema_desc: "The whole Land of Israel becomes the creed of government, at the price of isolation abroad."
 COLDWAR_ISR_emc_emergency_regulations: "Emergency Regulations"
 COLDWAR_ISR_emc_emergency_regulations_desc: "Rule by the Defence (Emergency) Regulations keeps the streets quiet for now."
 COLDWAR_ISR_emc_credit_dependence: "Dependence on American Credit"
 COLDWAR_ISR_emc_credit_dependence_desc: "Without the American credit line, the rearmament bill falls on the treasury."
 COLDWAR_ISR_emc_preemptive_strike: "Pre-emptive Strike"
 COLDWAR_ISR_emc_preemptive_strike_desc: "The first thirty days of a war are planned years in advance."
 COLDWAR_ISR_emc_back_to_barracks: "Back to the Barracks"
 COLDWAR_ISR_emc_back_to_barracks_desc: "The generals hand power back and keep the nation's respect."
 COLDWAR_ISR_emc_garrison_state: "The Garrison State"
 COLDWAR_ISR_emc_garrison_state_desc: "Elections are suspended and the state becomes a fortress. Elections are suspended while this spirit lasts."
 COLDWAR_ISR_econ_no_rough_supply: "No Rough Supply"
 COLDWAR_ISR_econ_no_rough_supply_desc: "Without secured rough stones the cutters import at any price."
 COLDWAR_ISR_econ_new_york_tokyo: "New York and Tokyo"
 COLDWAR_ISR_econ_new_york_tokyo_desc: "Israeli dealers on 47th Street and in Ginza open doors for Israeli trade."
 COLDWAR_ISR_econ_credit_brake: "Credit Brake"
 COLDWAR_ISR_econ_credit_brake_desc: "The new central bank tightens credit for construction."
 COLDWAR_ISR_econ_index_linked: "Index-Linked Everything"
 COLDWAR_ISR_econ_index_linked_desc: "Wages, savings and loans follow the price index, and so does inflation."
 COLDWAR_ISR_econ_hard_money_recession: "Hard Money Recession"
 COLDWAR_ISR_econ_hard_money_recession_desc: "Tight money breaks inflation and slows growth."
 COLDWAR_ISR_econ_the_shekel: "The Shekel"
 COLDWAR_ISR_econ_the_shekel_desc: "A new currency restores some trust abroad."
 COLDWAR_ISR_econ_stabilization: "Stabilization"
 COLDWAR_ISR_econ_stabilization_desc: "Budget cuts, a wage freeze and a fixed exchange rate end the hyperinflation."
 COLDWAR_ISR_econ_silicon_wadi: "Silicon Wadi"
 COLDWAR_ISR_econ_silicon_wadi_desc: "Engineers, start-ups and research parks turn the coastal plain into Silicon Wadi."
 COLDWAR_ISR_econ_high_tech_economy: "The High-Tech Economy"
 COLDWAR_ISR_econ_high_tech_economy_desc: "Israel lives on brains: chips, software and research."
 COLDWAR_ISR_ali_western_aliyah: "Western Aliyah"
 COLDWAR_ISR_ali_western_aliyah_desc: "Professionals from America and Europe come, and some of them leave again."
 COLDWAR_ISR_ali_ingathering_fulfilled: "The Ingathering Fulfilled"
 COLDWAR_ISR_ali_ingathering_fulfilled_desc: "The exiles have come home and the state is built around them."
 COLDWAR_ISR_ter_peace_dividend: "Peace Dividend"
 COLDWAR_ISR_ter_peace_dividend_desc: "Peace with Egypt and the Sinai returned: the army shrinks and money goes back into the economy."
 COLDWAR_ISR_ter_facts_on_the_ground: "Facts on the Ground"
 COLDWAR_ISR_ter_facts_on_the_ground_desc: "Annexation laws have redrawn the map of Israel; building and resolve rise, but the world turns away."
 COLDWAR_ISR_ter_autonomy: "Autonomy"
 COLDWAR_ISR_ter_autonomy_desc: "Civil administration in the West Bank and Gaza hands daily life to local councils under Israeli security control."
 COLDWAR_ISR_soc_shared_society: "A Shared Society"
 COLDWAR_ISR_soc_shared_society_desc: "Mizrachim, Arabs and the secular and religious share one civic state, and it costs real money."
 COLDWAR_ISR_soc_ethnic_democracy: "The Ethnic Democracy"
 COLDWAR_ISR_soc_ethnic_democracy_desc: "A Jewish state first and a democracy second: control holds, but the minorities and the world take note."
 COLDWAR_ISR_soc_tribes_of_israel: "The Tribes of Israel"
 COLDWAR_ISR_soc_tribes_of_israel_desc: "No single answer: each community bargains for its own share of the state."
 COLDWAR_ISR_idf_nation_in_uniform: "A Nation in Uniform"
 COLDWAR_ISR_idf_nation_in_uniform_desc: "Three years for men, two for women, and reserve duty until fifty: Zahal is the people under arms."
 COLDWAR_ISR_idf_canal_forts: "The Canal Forts"
 COLDWAR_ISR_idf_canal_forts_desc: "The strongpoints of the Bar-Lev Line watch the Suez Canal; the army learns to sit behind sand walls."
 COLDWAR_ISR_idf_unescorted_armour: "Unescorted Armour"
 COLDWAR_ISR_idf_unescorted_armour_desc: "Tanks charge ahead without infantry or artillery; Sagger teams have learned to wait for them."
 COLDWAR_ISR_idf_merkava_development: "Merkava Development"
 COLDWAR_ISR_idf_merkava_development_desc: "Israel designs its own main battle tank; the programme eats the defence budget for three years."
 COLDWAR_ISR_idf_call_up: "Call-Up"
 COLDWAR_ISR_idf_call_up_desc: "Every mobilisation empties the factories and offices of their reservists."
 COLDWAR_ISR_idf_spare_parts_shortage: "Spare Parts Shortage"
 COLDWAR_ISR_idf_spare_parts_shortage_desc: "Without an American supply line every Phantom and Skyhawk waits for parts."
 COLDWAR_ISR_idf_us_dependency: "Dependence on American Arms"
 COLDWAR_ISR_idf_us_dependency_desc: "Buying American ties every programme to Washington's goodwill; without it, costs climb."
 COLDWAR_ISR_idf_qualitative_edge: "The Qualitative Edge"
 COLDWAR_ISR_idf_qualitative_edge_desc: "Fewer men, better trained and better armed: Israel's answer to the arithmetic of the Arab armies."
 COLDWAR_ISR_sec_the_services: "The Services"
 COLDWAR_ISR_sec_the_services_desc: "Shin Bet at home, Mossad abroad, Aman in uniform: three services that rarely share and never sleep."
 COLDWAR_ISR_sec_safe_el_al: "The Safest Airline"
 COLDWAR_ISR_sec_safe_el_al_desc: "El Al and Lod airport set the world standard in security, and partners notice."
 COLDWAR_ISR_sec_secured_fuel: "Secured Fuel"
 COLDWAR_ISR_sec_secured_fuel_desc: "Two hundred tons of yellowcake vanished at sea in 1968; Dimona will not run short."
 COLDWAR_ISR_sec_a_secure_israel: "A Secure Israel"
 COLDWAR_ISR_sec_a_secure_israel_desc: "The services, the scientists and the police form one shield around the state."
 COLDWAR_ISR_for_diplomacy_of_survival: "Diplomacy of Survival"
 COLDWAR_ISR_for_diplomacy_of_survival_desc: "A small country without allies in its region needs friends everywhere else."
 COLDWAR_ISR_for_diaspora_expectations: "Diaspora Expectations"
 COLDWAR_ISR_for_diaspora_expectations_desc: "American Jewry gives generously and watches closely; every scandal costs twice."
 COLDWAR_ISR_for_cold_peace: "The Cold Peace"
 COLDWAR_ISR_for_cold_peace_desc: "The treaty with Egypt holds: no embassies full of friends, but no war on the southern front."
 COLDWAR_ISR_for_israel_among_nations: "Israel Among the Nations"
 COLDWAR_ISR_for_israel_among_nations_desc: "From pariah to partner: Israel has friends on every continent."
 COLDWAR_ISR_econ_de_beers_sight: "The De Beers Sight"
 COLDWAR_ISR_econ_de_beers_sight_desc: "The Central Selling Organisation in London allocates the rough stones: steady supply at London's prices."
 COLDWAR_ISR_econ_direct_mines: "Straight from the Mines"
 COLDWAR_ISR_econ_direct_mines_desc: "Israeli dealers buy directly in Kinshasa and Freetown, past the cartel: cheap stones, bank credit and smuggling."
 COLDWAR_ISR_nation_in_arms: "A Nation in Arms"
 COLDWAR_ISR_nation_in_arms_desc: "Every man serves three years and every woman two; then they stay in the reserve until they are past fifty."
 COLDWAR_ISR_burden_of_defence_1: "The Burden of Defence"
 COLDWAR_ISR_burden_of_defence_1_desc: "A quarter of the national product goes to defence; the factories of the state work for the army first."
 COLDWAR_ISR_burden_of_defence_2: "The Burden of Defence"
 COLDWAR_ISR_burden_of_defence_2_desc: "A quarter of the national product goes to defence; the factories of the state work for the army first."
