 COLDWAR_ISR_terr_status_207: "§YJerusalem§!\nSettlement level: §Y[?COLDWAR_ISR_settle_207|0]/5§!, outposts §Y[?COLDWAR_ISR_outposts_207|0]/3§!\nAdministration: §Y[COLDWAR_ISR_admin_207_loc]§!\nResistance: §R[?207.resistance|0]§!, revenge risk §R[?COLDWAR_ISR_revenge_207|0]%§!\nMonthly incident risk: §R[?COLDWAR_ISR_pulse_207|1]%§!\nOccupation Burden: §Y[?COLDWAR_ISR_burden|0]§!, Media attention: §Y[?COLDWAR_ISR_dark_count|1]§!\n\nEast Jerusalem: the Annexation Law unites the city; every new neighbourhood angers the Arab world."
 COLDWAR_ISR_terr_status_208: "§YWest Bank§!\nSettlement level: §Y[?COLDWAR_ISR_settle_208|0]/5§!, outposts §Y[?COLDWAR_ISR_outposts_208|0]/3§!\nAdministration: §Y[COLDWAR_ISR_admin_208_loc]§!\nResistance: §R[?208.resistance|0]§!, revenge risk §R[?COLDWAR_ISR_revenge_208|0]%§!\nMonthly incident risk: §R[?COLDWAR_ISR_pulse_208|1]%§!\nOccupation Burden: §Y[?COLDWAR_ISR_burden|0]§!, Media attention: §Y[?COLDWAR_ISR_dark_count|1]§!\n\nExpand the Settlements below for growth and settlers; Civil Administration, Autonomy or Open Bridges ease the burden."
 COLDWAR_ISR_terr_status_209: "§YGaza§!\nSettlement level: §Y[?COLDWAR_ISR_settle_209|0]/5§!, outposts §Y[?COLDWAR_ISR_outposts_209|0]/3§!\nAdministration: §Y[COLDWAR_ISR_admin_209_loc]§!\nResistance: §R[?209.resistance|0]§!, revenge risk §R[?COLDWAR_ISR_revenge_209|0]%§!\nMonthly incident risk: §R[?COLDWAR_ISR_pulse_209|1]%§!\nOccupation Burden: §Y[?COLDWAR_ISR_burden|0]§!, Media attention: §Y[?COLDWAR_ISR_dark_count|1]§!\n\nGaza is crowded and restless: every expansion raises the revenge risk; Autonomy or a return to Egypt ease the burden."
 COLDWAR_ISR_terr_status_213: "§YSinai§!\nSettlement level: §Y[?COLDWAR_ISR_settle_213|0]/5§!, outposts §Y[?COLDWAR_ISR_outposts_213|0]/3§!\nAdministration: §Y[COLDWAR_ISR_admin_213_loc]§!\nResistance: §R[?213.resistance|0]§!, revenge risk §R[?COLDWAR_ISR_revenge_213|0]%§!\nMonthly incident risk: §R[?COLDWAR_ISR_pulse_213|1]%§!\nOccupation Burden: §Y[?COLDWAR_ISR_burden|0]§!, Media attention: §Y[?COLDWAR_ISR_dark_count|1]§!\n\nThe Sinai is Egypt's land: settle it, or keep it as the price of peace (Offer Return)."
 COLDWAR_ISR_terr_status_587: "§YGolan§!\nSettlement level: §Y[?COLDWAR_ISR_settle_587|0]/5§!, outposts §Y[?COLDWAR_ISR_outposts_587|0]/3§!\nAdministration: §Y[COLDWAR_ISR_admin_587_loc]§!\nResistance: §R[?587.resistance|0]§!, revenge risk §R[?COLDWAR_ISR_revenge_587|0]%§!\nMonthly incident risk: §R[?COLDWAR_ISR_pulse_587|1]%§!\nOccupation Burden: §Y[?COLDWAR_ISR_burden|0]§!, Media attention: §Y[?COLDWAR_ISR_dark_count|1]§!\n\nFew people live on the Golan: expansion is cheap in risk; the Annexation Law makes it Israeli."
 COLDWAR_ISR_terr_status_overview: "§YThe State of Israel§!\nDiaspora Support §Y[?COLDWAR_ISR_diaspora|0]§!, Settler Movement §Y[?COLDWAR_ISR_settlers|0]§!\nOccupation Burden §Y[?COLDWAR_ISR_burden|0]§!, International Standing §Y[?COLDWAR_ISR_standing|0]§!\n\nSelect a region on the map, or Golan, Sinai or Jerusalem below, to see its settlements and actions."
