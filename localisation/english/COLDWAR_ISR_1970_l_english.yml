 COLDWAR_ISR_economy_category: "The Israeli Economy"
 COLDWAR_ISR_economy_category_desc: "Arms exports and the industries of the state."
 COLDWAR_ISR_society_category: "Israeli Society"
 COLDWAR_ISR_society_category_desc: "The development towns, the Arab citizens and the police."
 COLDWAR_ISR_diamonds_category: "Diamond Deals with Israel"
 COLDWAR_ISR_diamonds_category_desc: "Israel's diamond industry buys rough stones."
 COLDWAR_ISR_partner_category: "Agreements with Israel"
 COLDWAR_ISR_partner_category_desc: "Our agreements with Israel."
 COLDWAR_ISR.60.t: "The Bank Shares Crisis"
 COLDWAR_ISR.60.d: "For years the banks bought their own shares to keep the prices rising. In October 1983 the bubble bursts: the Tel Aviv exchange closes for eighteen days."
 COLDWAR_ISR.60.a: "The state takes over the banks."
 COLDWAR_ISR.61.t: "The Jewish Underground"
 COLDWAR_ISR.61.d: "The Shin Bet uncovers a settler cell that planted bombs in the cars of Palestinian mayors."
 COLDWAR_ISR.61.a: "Arrest them."
 COLDWAR_ISR.62.t: "The Underground Exposed"
 COLDWAR_ISR.62.d: "The trials of the underground's members split the national camp."
 COLDWAR_ISR.62.a: "The law is the law."
 COLDWAR_ISR.64.t: "The Eilat Desalination Plant"
 COLDWAR_ISR.64.d: "The plant at Eilat delivers its first water."
 COLDWAR_ISR.64.a: "Water from the sea."
 COLDWAR_ISR.65.t: "Operation Moses Becomes Public"
 COLDWAR_ISR.65.d: "A Jerusalem paper prints the story of the night flights from Khartoum. The Arab capitals are furious; the Sudan stops the flights."
 COLDWAR_ISR.65.a: "It was worth it."
 COLDWAR_ISR.180.t: "Charter Flights through Brussels"
 COLDWAR_ISR.180.d: "Israel asks whether a Belgian charter airline may fly the Jews of Ethiopia from Khartoum by way of Brussels. Nobody is to know."
 COLDWAR_ISR.180.a: "We will fly them."
 COLDWAR_ISR.180.b: "Too dangerous."
 COLDWAR_ISR.181.t: "Brussels Agrees"
 COLDWAR_ISR.181.d: "[From.GetName] lets the charter planes fly."
 COLDWAR_ISR.181.a: "Bring them home."
 COLDWAR_ISR.182.t: "Brussels Declines"
 COLDWAR_ISR.182.d: "[From.GetName] will not risk it."
 COLDWAR_ISR.182.a: "We find another way."
 COLDWAR_ISR.183.t: "Operation Moses Exposed"
 COLDWAR_ISR.183.d: "The world learns that Khartoum let the Jews of Ethiopia fly to Israel. The street and the Arab League turn on the government."
 COLDWAR_ISR.183.a: "A heavy blow."
 COLDWAR_ISR.184.t: "Operation Moses Exposed"
 COLDWAR_ISR.184.d: "The papers name the Belgian airline that flew the airlift. The Arab customers are not amused."
 COLDWAR_ISR.184.a: "It was the right thing."
 COLDWAR_ISR.66.t: "A Gush Emunim Outpost"
 COLDWAR_ISR.66.d: "Young settlers put up caravans on a hilltop without a permit. The army watches."
 COLDWAR_ISR.66.a: "Tolerate it."
 COLDWAR_ISR.66.b: "Clear the hill."
 COLDWAR_ISR.67.t: "Wadi Salib"
 COLDWAR_ISR.67.d: "Mizrachi residents riot in Haifa after the police shoot a drunken man; the anger of the poor quarters spills into the streets."
 COLDWAR_ISR.67.a: "Restore order."
 COLDWAR_ISR.68.t: "Land Day"
 COLDWAR_ISR.68.d: "Against the expropriation of land in the Galilee the Arab citizens call a general strike. Six are killed."
 COLDWAR_ISR.68.a: "Mourn the dead."
 COLDWAR_ISR.69.t: "The Lavi Question"
 COLDWAR_ISR.69.d: "The Lavi fighter flies, but the Americans pay for most of it and want it stopped."
 COLDWAR_ISR.69.a: "Build the Lavi."
 COLDWAR_ISR.69.b: "Cancel the Lavi."
 COLDWAR_ISR.70.t: "The Lillehammer Affair"
 COLDWAR_ISR.70.d: "A Mossad team kills a Moroccan waiter in Norway, mistaken for a planner of Munich. Five agents are arrested."
 COLDWAR_ISR.70.a: "A disaster."
 COLDWAR_ISR.71.t: "The Shin Bet Scandals"
 COLDWAR_ISR.71.d: "Two hijackers of Bus 300 were taken alive and then killed. The service lied to the inquiries."
 COLDWAR_ISR.71.a: "Cover it up."
 COLDWAR_ISR.71.b: "Investigate."
 COLDWAR_ISR.72.t: "Operation Plumbat Exposed"
 COLDWAR_ISR.72.d: "The press finds out how two hundred tons of uranium ore vanished at sea in 1968."
 COLDWAR_ISR.72.a: "Deny everything."
 COLDWAR_ISR.73.t: "The Technician from Dimona"
 COLDWAR_ISR.73.d: "A former technician of the reactor has photographs and wants to talk to the British press."
 COLDWAR_ISR.73.a: "Arrest him."
 COLDWAR_ISR.73.b: "Let him go."
 COLDWAR_ISR.80.t: "The Radical National Front Is Banned"
 COLDWAR_ISR.80.d: "The Central Elections Committee disqualifies the list for incitement to racism, as the Knesset law allows."
 COLDWAR_ISR.80.a: "The law protects the democracy."
 COLDWAR_ISR.85.t: "The London Sight"
 COLDWAR_ISR.85.d: "The Diamond Trading Company cuts the allocation of rough stones for Israeli dealers while London is cold towards us."
 COLDWAR_ISR.85.a: "A painful cut."
 COLDWAR_ISR.90.t: "The Intifada"
 COLDWAR_ISR.90.d: "The territories rise: stones, general strikes and closed shops from Jabalya to Nablus."
 COLDWAR_ISR.90.a: "Force, might and beatings."
 COLDWAR_ISR.90.b: "Talk to the local leaders."
 COLDWAR_ISR.120.t: "Diamonds for Israel"
 COLDWAR_ISR.120.d: "Israel offers to buy our rough diamonds for the cutters of Ramat Gan. A deal can be started in the decision category 'Diamond Deals with Israel'."
 COLDWAR_ISR.120.a: "We will consider it."
 COLDWAR_ISR.121.t: "A Diamond Deal"
 COLDWAR_ISR.121.d: "[From.GetName] sells its rough stones to Israel."
 COLDWAR_ISR.121.a: "Good business."
 COLDWAR_ISR.122.t: "The Diamond Deal Ends"
 COLDWAR_ISR.122.d: "[From.GetName] has cancelled the diamond deal."
 COLDWAR_ISR.122.a: "A loss."
 COLDWAR_ISR.130.t: "AIPAC Lobbies Congress"
 COLDWAR_ISR.130.d: "The American Israel Public Affairs Committee asks Congress for an arms and production package for Israel."
 COLDWAR_ISR.130.a: "Approve the package."
 COLDWAR_ISR.130.b: "Decline."
 COLDWAR_ISR.131.t: "Friends on Capitol Hill"
 COLDWAR_ISR.131.d: "Congress approves the package: credits, licences and spare parts."
 COLDWAR_ISR.131.a: "Thank our friends."
 COLDWAR_ISR.132.t: "Congress Says No"
 COLDWAR_ISR.132.d: "The package has failed in committee. The political capital is spent."
 COLDWAR_ISR.132.a: "Next year."
 COLDWAR_ISR.170.t: "Israel Offers to Return West Bank"
 COLDWAR_ISR.170.d: "Israel offers to hand back West Bank, held since 1967."
 COLDWAR_ISR.170.a: "We accept."
 COLDWAR_ISR.170.b: "We refuse."
 COLDWAR_ISR.171.t: "Israel Offers to Return Gaza"
 COLDWAR_ISR.171.d: "Israel offers to hand back Gaza, held since 1967."
 COLDWAR_ISR.171.a: "We accept."
 COLDWAR_ISR.171.b: "We refuse."
 COLDWAR_ISR.172.t: "Israel Offers to Return Sinai"
 COLDWAR_ISR.172.d: "Israel offers to hand back Sinai, held since 1967."
 COLDWAR_ISR.172.a: "We accept."
 COLDWAR_ISR.172.b: "We refuse."
 COLDWAR_ISR.173.t: "Israel Offers to Return Golan"
 COLDWAR_ISR.173.d: "Israel offers to hand back Golan, held since 1967."
 COLDWAR_ISR.173.a: "We accept."
 COLDWAR_ISR.173.b: "We refuse."
 COLDWAR_ISR.141.t: "[From.GetName] Accepts the Return"
 COLDWAR_ISR.141.d: "The handover is prepared; the settlers protest."
 COLDWAR_ISR.141.a: "Hand it over."
 COLDWAR_ISR.142.t: "[From.GetName] Refuses the Return"
 COLDWAR_ISR.142.d: "[From.GetName] will not take the territory back on our terms."
 COLDWAR_ISR.142.a: "So be it."
 COLDWAR_ISR.300.t: "Shots at a Settlement (West Bank)"
 COLDWAR_ISR.300.d: "Shots are fired at a settler car on the road to West Bank. Nobody is hurt, but the settlers demand action."
 COLDWAR_ISR.300.a: "Retaliation raid."
 COLDWAR_ISR.300.b: "Restraint."
 COLDWAR_ISR.300.c: "Build a security fence and a bypass road."
 COLDWAR_ISR.301.t: "Attack on a Settlement in West Bank"
 COLDWAR_ISR.301.d: "Gunmen attack a settlement in West Bank at night. There are dead and wounded; the funerals turn into rallies."
 COLDWAR_ISR.301.a: "Retaliation raid."
 COLDWAR_ISR.301.b: "Restraint."
 COLDWAR_ISR.301.c: "Build a security fence and a bypass road."
 COLDWAR_ISR.302.t: "Massacre in West Bank"
 COLDWAR_ISR.302.d: "A cell infiltrates a settlement in West Bank and kills a family. The country is in shock."
 COLDWAR_ISR.302.a: "Retaliation raid."
 COLDWAR_ISR.302.b: "Restraint."
 COLDWAR_ISR.302.c: "Build a security fence and a bypass road."
 COLDWAR_ISR.303.t: "Shots at a Settlement (Gaza)"
 COLDWAR_ISR.303.d: "Shots are fired at a settler car on the road to Gaza. Nobody is hurt, but the settlers demand action."
 COLDWAR_ISR.303.a: "Retaliation raid."
 COLDWAR_ISR.303.b: "Restraint."
 COLDWAR_ISR.303.c: "Build a security fence and a bypass road."
