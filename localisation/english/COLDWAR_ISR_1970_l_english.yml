 COLDWAR_ISR_ingathering_2: "The Ingathering"
 COLDWAR_ISR_ingathering_2_desc: "Absorption centres and Ulpanim turn newcomers into citizens faster."
 COLDWAR_ISR_war_of_attrition: "War of Attrition"
 COLDWAR_ISR_war_of_attrition_desc: "Artillery duels and commando raids along the Suez Canal; the Phantoms fly deep into Egypt."
