 COLDWAR_ISR.334.t: "Incident in Jerusalem"
 COLDWAR_ISR.334.d: "A patrol is ambushed, a mine goes off on a road, a petrol bomb hits a bus: one more night in Jerusalem."
 COLDWAR_ISR.334.a: "Hot pursuit."
 COLDWAR_ISR.334.b: "Seal off the area."
 COLDWAR_ISR.334.c: "Leave it to the police."
 COLDWAR_ISR.335.t: "Fedayeen Raid from Lebanon"
 COLDWAR_ISR.335.d: "Fedayeen cross from southern Lebanon and fire on a village in the Galilee."
 COLDWAR_ISR.335.a: "Strike the camps in Lebanon."
 COLDWAR_ISR.335.b: "Fortify the northern border."
 COLDWAR_ISR.335.c: "Ask the United Nations to act."
 COLDWAR_ISR.336.t: "Infiltration across the Jordan"
 COLDWAR_ISR.336.d: "A fedayeen squad crosses the Jordan at night and lays mines on a patrol road."
 COLDWAR_ISR.336.a: "Pursue them into Jordan."
 COLDWAR_ISR.336.b: "Mine the river crossings."
 COLDWAR_ISR.336.c: "Rely on Amman."
 COLDWAR_ISR.320.t: "A Foreign Press Exposé"
 COLDWAR_ISR.320.d: "A long report in a Western paper describes the occupation in detail. The bigger our record of harsh measures, the louder the echo."
 COLDWAR_ISR.320.a: "Deny everything."
 COLDWAR_ISR.320.b: "Admit mistakes."
 COLDWAR_ISR.320.c: "Deny everything."
 COLDWAR_ISR.320.e: "Admit mistakes."
 COLDWAR_ISR.320.f: "Deny everything."
 COLDWAR_ISR.320.g: "Admit mistakes."
 COLDWAR_ISR.321.t: "A Security Council Resolution"
 COLDWAR_ISR.321.d: "A draft resolution condemns Israel's actions in the occupied territories. The bigger our record of harsh measures, the louder the echo."
 COLDWAR_ISR.321.a: "Reject it."
 COLDWAR_ISR.321.b: "Ask Washington for a veto."
 COLDWAR_ISR.321.c: "Hold back for now."
 COLDWAR_ISR.321.e: "Reject it."
 COLDWAR_ISR.321.f: "Ask Washington for a veto."
 COLDWAR_ISR.321.g: "Hold back for now."
 COLDWAR_ISR.321.h: "Reject it."
 COLDWAR_ISR.321.i: "Ask Washington for a veto."
 COLDWAR_ISR.321.j: "Hold back for now."
 COLDWAR_ISR.322.t: "A European Boycott Threat"
 COLDWAR_ISR.322.d: "European ministers talk about labelling or stopping goods from the settlements. The bigger our record of harsh measures, the louder the echo."
 COLDWAR_ISR.322.a: "Ignore Brussels."
 COLDWAR_ISR.322.b: "Send the foreign minister."
 COLDWAR_ISR.322.c: "Ignore Brussels."
 COLDWAR_ISR.322.e: "Send the foreign minister."
 COLDWAR_ISR.322.f: "Ignore Brussels."
 COLDWAR_ISR.322.g: "Send the foreign minister."
 COLDWAR_ISR.323.t: "Questions in Congress"
 COLDWAR_ISR.323.d: "Senators ask whether American aid pays for the settlements. The bigger our record of harsh measures, the louder the echo."
 COLDWAR_ISR.323.a: "Lobby the Hill."
 COLDWAR_ISR.323.b: "Let it pass."
 COLDWAR_ISR.323.c: "Lobby the Hill."
 COLDWAR_ISR.323.e: "Let it pass."
 COLDWAR_ISR.323.f: "Lobby the Hill."
 COLDWAR_ISR.323.g: "Let it pass."
 COLDWAR_ISR.324.t: "An Open Letter from the Diaspora"
 COLDWAR_ISR.324.d: "Rabbis and community leaders abroad publish an open letter against the government's course. The bigger our record of harsh measures, the louder the echo."
 COLDWAR_ISR.324.a: "Reply firmly."
 COLDWAR_ISR.324.b: "Meet the signatories."
 COLDWAR_ISR.324.c: "Reply firmly."
 COLDWAR_ISR.324.e: "Meet the signatories."
 COLDWAR_ISR.324.f: "Reply firmly."
 COLDWAR_ISR.324.g: "Meet the signatories."
 COLDWAR_ISR.325.t: "Pictures from a Demolition"
 COLDWAR_ISR.325.d: "Television crews film a family in front of the ruins of its house. The bigger our record of harsh measures, the louder the echo."
 COLDWAR_ISR.325.a: "Censor the footage."
 COLDWAR_ISR.325.b: "Order an inquiry."
 COLDWAR_ISR.325.c: "Censor the footage."
 COLDWAR_ISR.325.e: "Order an inquiry."
 COLDWAR_ISR.325.f: "Censor the footage."
 COLDWAR_ISR.325.g: "Order an inquiry."
 COLDWAR_ISR.186.t: "Israel Proposes Mutual Recognition"
 COLDWAR_ISR.186.d: "Israel offers to recognise the PLO as the representative of the Palestinian people, if the PLO recognises Israel and renounces terror. Gaza would come first under our own authority."
 COLDWAR_ISR.186.a: "We accept: Oslo."
 COLDWAR_ISR.186.b: "Not on these terms."
 COLDWAR_ISR.187.t: "Recognition"
 COLDWAR_ISR.187.d: "On the White House lawn the two sides shake hands. The Palestinian National Authority takes over Gaza."
 COLDWAR_ISR.187.a: "A new chapter."
 COLDWAR_ISR.190.t: "Washington Proposes Talks with the PLO"
 COLDWAR_ISR.190.d: "The Secretary of State brings a plan: talks with the PLO under American sponsorship, recognition for recognition, Gaza first."
 COLDWAR_ISR.190.a: "Accept the American initiative."
 COLDWAR_ISR.190.b: "Not under pressure from Washington."
 COLDWAR_ISR.190.c: "Talks are already under way."
 COLDWAR_ISR.191.t: "Israel Accepts Our Initiative"
 COLDWAR_ISR.191.d: "Israel will talk to the PLO under our sponsorship."
 COLDWAR_ISR.191.a: "A success for American diplomacy."
 COLDWAR_ISR.192.t: "Israel Declines Our Initiative"
 COLDWAR_ISR.192.d: "Jerusalem will not talk to the PLO on our terms."
 COLDWAR_ISR.192.a: "We will remember it."
 COLDWAR_ISR.193.t: "Talks Already Under Way"
 COLDWAR_ISR.193.d: "Israel is already talking to the PLO, or the matter is settled."
 COLDWAR_ISR.193.a: "Good."
 COLDWAR_ISR.194.t: "Israel Proposes an Interim Agreement"
 COLDWAR_ISR.194.d: "Israel offers to hand the towns of the West Bank to the Authority, while it keeps the roads, the settlements and security."
 COLDWAR_ISR.194.a: "Sign the Interim Agreement."
 COLDWAR_ISR.194.b: "Not on these terms."
 COLDWAR_ISR.195.t: "The Interim Agreement"
 COLDWAR_ISR.195.d: "The Authority takes over the towns of the West Bank."
 COLDWAR_ISR.195.a: "Another step."
 COLDWAR_ISR.197.t: "Washington Backs the Peace Process"
 COLDWAR_ISR.197.d: "The President praises the agreements with the Palestinians and promises to stand behind the next steps."
 COLDWAR_ISR.197.a: "Welcome the support."
 COLDWAR_ISR.197.b: "Keep our distance."
 COLDWAR_ISR.188.t: "The PLO Says No"
 COLDWAR_ISR.188.d: "[From.GetName] rejects our terms."
 COLDWAR_ISR.188.a: "Then not now."
 COLDWAR_ISR.189.t: "Assassination at the Peace Rally"
 COLDWAR_ISR.189.d: "After a rally for peace in Tel Aviv a young extremist shoots the prime minister. The country is in shock."
 COLDWAR_ISR.189.a: "Mourn, and carry on."
 COLDWAR_ISR.200.t: "A Proposal from Israel: The Phantom Alliance"
 COLDWAR_ISR.200.d: "The Israeli government proposes 'The Phantom Alliance'. Both countries keep it while they are not at war and neither sanctions or embargoes the other."
 COLDWAR_ISR.200.a: "We accept."
 COLDWAR_ISR.200.b: "We refuse."
 COLDWAR_ISR.201.t: "A Proposal from Israel: Shalom Aid"
 COLDWAR_ISR.201.d: "The Israeli government proposes 'Shalom Aid'. Both countries keep it while they are not at war and neither sanctions or embargoes the other."
 COLDWAR_ISR.201.a: "We accept."
 COLDWAR_ISR.201.b: "We refuse."
 COLDWAR_ISR.202.t: "A Proposal from Israel: Disengagement"
 COLDWAR_ISR.202.d: "The Israeli government proposes 'Disengagement'. Both countries keep it while they are not at war and neither sanctions or embargoes the other."
 COLDWAR_ISR.202.a: "We accept."
