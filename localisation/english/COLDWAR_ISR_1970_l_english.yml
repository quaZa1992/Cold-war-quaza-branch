 COLDWAR_ISR.312.t: "Shots at a Settlement (Jerusalem)"
 COLDWAR_ISR.312.d: "Shots are fired at a settler car on the road to Jerusalem. Nobody is hurt, but the settlers demand action."
 COLDWAR_ISR.312.a: "Retaliation raid."
 COLDWAR_ISR.312.b: "Restraint."
 COLDWAR_ISR.312.c: "Build a security fence and a bypass road."
 COLDWAR_ISR.313.t: "Attack on a Settlement in Jerusalem"
 COLDWAR_ISR.313.d: "Gunmen attack a settlement in Jerusalem at night. There are dead and wounded; the funerals turn into rallies."
 COLDWAR_ISR.313.a: "Retaliation raid."
 COLDWAR_ISR.313.b: "Restraint."
 COLDWAR_ISR.313.c: "Build a security fence and a bypass road."
 COLDWAR_ISR.314.t: "Massacre in Jerusalem"
 COLDWAR_ISR.314.d: "A cell infiltrates a settlement in Jerusalem and kills a family. The country is in shock."
 COLDWAR_ISR.314.a: "Retaliation raid."
 COLDWAR_ISR.314.b: "Restraint."
 COLDWAR_ISR.314.c: "Build a security fence and a bypass road."
 COLDWAR_ISR.330.t: "Incident in West Bank"
 COLDWAR_ISR.330.d: "A patrol is ambushed, a mine goes off on a road, a petrol bomb hits a bus: one more night in West Bank."
 COLDWAR_ISR.330.a: "Hot pursuit."
 COLDWAR_ISR.330.b: "Seal off the area."
 COLDWAR_ISR.330.c: "Leave it to the police."
 COLDWAR_ISR.331.t: "Incident in Gaza"
 COLDWAR_ISR.331.d: "A patrol is ambushed, a mine goes off on a road, a petrol bomb hits a bus: one more night in Gaza."
 COLDWAR_ISR.331.a: "Hot pursuit."
 COLDWAR_ISR.331.b: "Seal off the area."
 COLDWAR_ISR.331.c: "Leave it to the police."
 COLDWAR_ISR.332.t: "Incident in Golan"
