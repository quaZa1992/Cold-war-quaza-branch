l_english:
 # ===========================================================================
 # CHINA 1985 - Focus tree, ideas, events
 # Imperia RP Cold War start. English-only by design.
 # ===========================================================================

 # --- Focus tree -----------------------------------------------------------
 CHI_1985_focus: "China 1985 - Reform State"

 # ROOT
 CHI_1985_the_reform_state_1985: "The Reform State of 1985"
 CHI_1985_the_reform_state_1985_desc: "China enters 1985 under Deng Xiaoping's shadow. The old revolutionary order still commands loyalty, but reform, markets and foreign contact are already transforming the country. Bureaucracy bloats, the PLA resists modernization, students whisper about corruption — and the Party watches all of it."

 # BRANCH 1: Deng's Balance of Power
 CHI_1985_dengs_paramount_position: "Deng's Paramount Position"
 CHI_1985_dengs_paramount_position_desc: "Without holding any of the highest formal titles, Deng Xiaoping rules through the Central Military Commission and a network of trusted reformers. Affirm his authority and the rest of the Party will fall in line."
 CHI_1985_central_advisory_commission: "Central Advisory Commission"
 CHI_1985_central_advisory_commission_desc: "The old revolutionary generation keeps a senate-style veto over reform. They will hold the line against bourgeois ideas — at the cost of slower change."
 CHI_1985_the_pragmatic_line: "The Pragmatic Line"
 CHI_1985_the_pragmatic_line_desc: "It does not matter whether the cat is black or white, so long as it catches mice. China will reform, but the Party will remain the instrument of order."
 CHI_1985_balance_the_party_elders: "Balance the Party Elders"
 CHI_1985_balance_the_party_elders_desc: "Reform cannot move faster than the consensus of the elders. Slow the pace, reassure the conservatives, and keep the coalition intact."
 CHI_1985_elevate_hu_yaobang: "Elevate Hu Yaobang"
 CHI_1985_elevate_hu_yaobang_desc: "The General Secretary represents the open, debating, intellectual wing of the reform. Backing him brings reformers and students into the tent — and puts a target on his back."
 CHI_1985_back_zhao_ziyang: "Back Zhao Ziyang"
 CHI_1985_back_zhao_ziyang_desc: "The Premier represents the technocratic, market-curious wing of the reform. His team will push prices, foreign capital and enterprise autonomy further than the elders are comfortable with."

 # BRANCH 2: Reform & Opening Economy
 CHI_1985_continue_rural_reforms: "Continue Rural Reforms"
 CHI_1985_continue_rural_reforms_desc: "The household responsibility system has dragged hundreds of millions out of collective farming. Make it permanent, expand it nationally, and lock in the productivity gains."
 CHI_1985_township_and_village_enterprises: "Township and Village Enterprises"
 CHI_1985_township_and_village_enterprises_desc: "Rural cooperatives and small private workshops absorb surplus farm labour and provide the consumer goods the planned economy never delivers. They are also the first cracks in the planning monopoly."
 CHI_1985_household_responsibility_system: "Household Responsibility System"
 CHI_1985_household_responsibility_system_desc: "Lease land back to households, let them sell surplus on the market, and let prosperity quietly replace the commune as the unit of rural society."
 CHI_1985_special_economic_zones: "Expand the Special Economic Zones"
 CHI_1985_special_economic_zones_desc: "Shenzhen, Zhuhai, Xiamen, Shantou. Walled-off coastal experiments where foreign capital is welcome, taxes are lower, and Hong Kong-style management is openly studied."
 CHI_1985_shenzhen_experiment: "The Shenzhen Experiment"
 CHI_1985_shenzhen_experiment_desc: "A fishing village across the border from Hong Kong becomes the test case for the entire reform. Make it work and the rest of the coast will follow."
 CHI_1985_zhuhai_xiamen_shantou: "Zhuhai, Xiamen and Shantou"
 CHI_1985_zhuhai_xiamen_shantou_desc: "Three more SEZs targeted at overseas Chinese capital. Each one is a controlled rehearsal for opening more of the coast in the late 1980s."
 CHI_1985_open_coastal_cities: "Open Fourteen Coastal Cities"
 CHI_1985_open_coastal_cities_desc: "Tianjin, Shanghai, Dalian and the rest. Coastal cities receive SEZ-style privileges. The interior provinces will resent the gap; foreign capital will reward the gamble."
 CHI_1985_import_foreign_technology: "Import Foreign Technology"
 CHI_1985_import_foreign_technology_desc: "Engineers, machine tools, complete production lines. China cannot afford to invent everything; it can afford to copy intelligently."
 CHI_1985_western_management_practices: "Western Management Practices"
 CHI_1985_western_management_practices_desc: "Japanese quality circles, American MBA-style cost accounting, German vocational training. The reform needs people who understand markets, not just engineers who can copy a circuit board."
 CHI_1985_dual_track_pricing: "Dual-Track Pricing"
 CHI_1985_dual_track_pricing_desc: "State-set prices for plan output, market prices for above-plan output. Brilliant on paper, but every well-connected official will spend the next decade pocketing the gap between the two."
 CHI_1985_price_reform_debate: "Price Reform Debate"
 CHI_1985_price_reform_debate_desc: "Should prices float to find their level, or should the state hold them down to keep cities calm? The whole reform coalition will divide on this."
 CHI_1985_control_inflation: "Control Inflation"
 CHI_1985_control_inflation_desc: "Rein in money growth, freeze sensitive prices, accept slower reform. The cities calm down; the marketizers grumble."
 CHI_1985_push_growth_at_all_costs: "Push Growth at All Costs"
 CHI_1985_push_growth_at_all_costs_desc: "Run the economy hot. Prices rise, corruption rises, but so do GDP and household income. A bet on momentum to outrun the political backlash."
 CHI_1985_expand_state_owned_enterprises: "Expand State-Owned Enterprises"
 CHI_1985_expand_state_owned_enterprises_desc: "When the heat gets too high, retreat. Pour state credit into the SOEs, slow the private sector, and remind everyone who runs the country."
 CHI_1985_dual_track_consolidation: "Dual-Track Consolidation"
 CHI_1985_dual_track_consolidation_desc: "Whichever pole won the price-reform fight, the dual-track system is now permanent and load-bearing. Make it institutional rather than improvised."
 CHI_1985_socialist_market_foundations: "Socialist Market Foundations"
 CHI_1985_socialist_market_foundations_desc: "A market under Party direction. The phrase that will define China's economic identity for the next forty years is set down in the resolutions of the 13th Congress."
 CHI_1985_dengist_development_state: "Dengist Development State"
 CHI_1985_dengist_development_state_desc: "Reform protected, Party preserved, students contained, growth high. The historical Deng path — and the one that turns China into the dominant Pacific economy."

 # BRANCH 3: Conservative Backlash
 CHI_1985_warning_against_bourgeois_liberalization: "Warn Against Bourgeois Liberalization"
 CHI_1985_warning_against_bourgeois_liberalization_desc: "Foreign ideas are entering on the back of foreign capital. Issue the formal Party warning that reform does not mean political liberalization."
 CHI_1985_strengthen_party_cells: "Strengthen Party Cells"
 CHI_1985_strengthen_party_cells_desc: "Push Party cells deeper into universities, factories and SOEs. Reform-era China still belongs to the Communist Party of China, and every workplace will know it."
 CHI_1985_cadre_discipline_campaign: "Cadre Discipline Campaign"
 CHI_1985_cadre_discipline_campaign_desc: "Punish the worst examples of corruption, but only by Party process. Public discipline kept tightly inside the system."
 CHI_1985_reassert_ideological_education: "Reassert Ideological Education"
 CHI_1985_reassert_ideological_education_desc: "Bring orthodox Marxism-Leninism back into the curriculum. The students need to remember whose country this is."
 CHI_1985_purge_unreliable_liberals: "Purge Unreliable Liberals"
 CHI_1985_purge_unreliable_liberals_desc: "Move beyond rebuke. Liberals in the Party are removed, demoted, or sent down. The line hardens."
 CHI_1985_orthodox_marxist_education: "Orthodox Marxist Education"
 CHI_1985_orthodox_marxist_education_desc: "Senior intellectuals reassert the canon. Foreign social-science texts are quietly removed from libraries; the Party's interpretation of reform becomes the only one published."
 CHI_1985_party_above_reform: "Party Above Reform"
 CHI_1985_party_above_reform_desc: "Reform is a tool of the Party, not an end in itself. When the two come into conflict, the Party wins."
 CHI_1985_conservative_maoist_restoration: "Conservative Maoist Restoration"
 CHI_1985_conservative_maoist_restoration_desc: "The elders win the long fight. Reform is rolled back to a controlled, ideological vintage; foreign capital flees; orthodoxy returns."

 # BRANCH 4: Student Movement & Political Reform
 CHI_1985_campus_discussion_circles: "Campus Discussion Circles"
 CHI_1985_campus_discussion_circles_desc: "Reading clubs around Western philosophy, democratic theory and economics multiply quietly across Beijing, Shanghai, Hefei. Tolerated for now."
 CHI_1985_expand_academic_exchange: "Expand Academic Exchange"
 CHI_1985_expand_academic_exchange_desc: "Tens of thousands of Chinese students travel to American and European universities. They will return with skills, contacts — and ideas the Party did not commission."
 CHI_1985_control_campus_press: "Control the Campus Press"
 CHI_1985_control_campus_press_desc: "The university journals are scrutinised; the more openly liberal student papers are quietly closed. Discussion can continue, but not in print."
 CHI_1985_anti_corruption_petitions: "Anti-Corruption Petitions"
 CHI_1985_anti_corruption_petitions_desc: "Students wrap their political demands in attacks on cadre privilege. It is harder for the Party to ban a petition against corruption than one against socialism."
 CHI_1985_limited_inner_party_democracy: "Limited Inner-Party Democracy"
 CHI_1985_limited_inner_party_democracy_desc: "Real elections inside the Party for some intermediate posts. The reformers think it strengthens legitimacy. The elders think it ends in 1989."
 CHI_1985_1986_student_demonstrations: "The 1986 Student Demonstrations"
 CHI_1985_1986_student_demonstrations_desc: "Hefei, Shanghai, Beijing. Student protests over corruption and political openness fill the squares for the first time since 1949. The decision the Party makes here will shape the next decade."
 CHI_1985_the_hu_yaobang_question: "The Hu Yaobang Question"
 CHI_1985_the_hu_yaobang_question_desc: "Was the General Secretary too tolerant of the protests? The elders say yes. The choice now is whether to defend him or feed him to the conservatives."
 CHI_1985_reform_without_democracy: "Reform Without Democracy"
 CHI_1985_reform_without_democracy_desc: "Deng's classic line: economic opening, political closure. The students are managed, the markets are open, the Party rules."
 CHI_1985_controlled_political_opening: "Controlled Political Opening"
 CHI_1985_controlled_political_opening_desc: "Pluralism inside one-party rule. A risky alt-historical path that the elders will fight every step of the way — but one that could let China skip 1989 entirely."
 CHI_1985_legalize_local_contestation: "Legalize Local Contestation"
 CHI_1985_legalize_local_contestation_desc: "Allow real candidate competition in village and county elections. Tiny in absolute terms, enormous in symbolism."
 CHI_1985_expand_peoples_congress_supervision: "Expand People's Congress Supervision"
 CHI_1985_expand_peoples_congress_supervision_desc: "Give the National People's Congress real teeth — ministerial questioning, budget review, audit reports made public."
 CHI_1985_political_reform_china: "Political Reform China"
 CHI_1985_political_reform_china_desc: "An alt-historical China where reform reaches the political system without breaking the Party. Reformers in power, conservatives outflanked, students pacified — and Tiananmen never happens."

 # BRANCH 5: PLA Strategic Decision
 CHI_1985_the_1985_strategic_decision: "The 1985 Strategic Decision"
 CHI_1985_the_1985_strategic_decision_desc: "Deng tells the Central Military Commission that a major war is no longer the central planning assumption. Local wars on the periphery are. The PLA must change."
 CHI_1985_cut_one_million_men: "Cut One Million Men"
 CHI_1985_cut_one_million_men_desc: "The historical 1985 decision: demobilise a million soldiers, redirect savings into modernisation, professionalise the rest. The veterans will be furious; the budget will breathe."
 CHI_1985_peoples_war_retained: "People's War Retained"
 CHI_1985_peoples_war_retained_desc: "Reject Deng's pivot. The PLA stays a mass mobilisation force on Maoist lines. Cheap, deeply political, and three decades behind."
 CHI_1985_national_defense_university: "National Defense University"
 CHI_1985_national_defense_university_desc: "Found a true joint command college. Officer training is rebuilt around studying limited war, joint operations and foreign militaries — not just Party doctrine."
 CHI_1985_local_wars_on_the_periphery: "Local Wars on the Periphery"
 CHI_1985_local_wars_on_the_periphery_desc: "Doctrine reorients toward border conflicts in Vietnam, the Strait, the Indian frontier and Central Asia. Smaller force, faster reaction, modern weapons."
 CHI_1985_reduce_military_regions: "Reduce Military Regions"
 CHI_1985_reduce_military_regions_desc: "Eleven regions become seven. Redundant headquarters close, generals retire, the chain of command shortens."
 CHI_1985_convert_defense_industry: "Convert Defense Industry"
 CHI_1985_convert_defense_industry_desc: "Defense factories make refrigerators, motorcycles and machine tools. The civil economy gains scale; the arms sector gains commercial discipline."
 CHI_1985_modernize_the_second_artillery: "Modernize the Second Artillery"
 CHI_1985_modernize_the_second_artillery_desc: "China's nuclear missile force receives serious investment. Survivable basing, solid-fuel programs, and the first credible second-strike posture."
 CHI_1985_retrain_officer_corps: "Retrain the Officer Corps"
 CHI_1985_retrain_officer_corps_desc: "Mid-career officers cycle through National Defense University. The 1990s PLA leadership starts here."
 CHI_1985_modernize_border_forces: "Modernize Border Forces"
 CHI_1985_modernize_border_forces_desc: "The Vietnam, Soviet and Indian frontier units receive new equipment first. Local wars require ready forces, not paper armies."
 CHI_1985_technological_army: "Technological Army"
 CHI_1985_technological_army_desc: "A smaller, professional, technologically literate PLA. Three decades of reform pay off in the force that will eventually challenge American power in the Pacific."
 CHI_1985_military_steps_in: "The Military Steps In"
 CHI_1985_military_steps_in_desc: "Civil order has frayed. The Central Military Commission asserts itself as the guarantor of last resort. Reform pauses; the barracks decide."

 # BRANCH 6: Taiwan, Hong Kong & National Reunification
 CHI_1985_one_country_two_systems: "One Country, Two Systems"
 CHI_1985_one_country_two_systems_desc: "Deng's formula for Hong Kong, Macau and ultimately Taiwan: a single sovereign state with capitalist enclaves preserved for fifty years. Brilliantly elastic, chronically distrusted."
 CHI_1985_prepare_hong_kong_transition: "Prepare for the Hong Kong Transition"
 CHI_1985_prepare_hong_kong_transition_desc: "1997 is twelve years away. Build the Basic Law, train the cadres, and reassure the territory's elite that the transition will be predictable."
 CHI_1985_taiwan_united_front: "Taiwan United Front"
 CHI_1985_taiwan_united_front_desc: "Quiet outreach to KMT old soldiers, overseas Chinese chambers of commerce, and Taiwanese business families. The reunification campaign begins long before the troops do."
 CHI_1985_reassure_hong_kong_capital: "Reassure Hong Kong Capital"
 CHI_1985_reassure_hong_kong_capital_desc: "Property rights, banking, and the Hong Kong dollar will all survive 1997. Promises that will need to be kept — visibly — to keep capital in the city."
 CHI_1985_macau_handover_preparations: "Macau Handover Preparations"
 CHI_1985_macau_handover_preparations_desc: "Lisbon and Beijing settle the parallel handover for 1999. Smaller than Hong Kong but a useful rehearsal."
 CHI_1985_fujian_coastal_development: "Fujian Coastal Development"
 CHI_1985_fujian_coastal_development_desc: "Massive investment in the Taiwan-facing province. Pull Taiwanese factories across the strait through opportunity, not threat."
 CHI_1985_hong_kong_basic_law_drafting: "Hong Kong Basic Law Drafting"
 CHI_1985_hong_kong_basic_law_drafting_desc: "The mini-constitution that will govern Hong Kong after 1997 is hammered out between Beijing and the territory's professional class."
 CHI_1985_peaceful_reunification_campaign: "Peaceful Reunification Campaign"
 CHI_1985_peaceful_reunification_campaign_desc: "Lean on economics, family ties and patience rather than threats. A long game, but one Beijing thinks it can win."
 CHI_1985_prepare_for_strait_contingencies: "Prepare for Strait Contingencies"
 CHI_1985_prepare_for_strait_contingencies_desc: "If reunification cannot come peacefully, it must be possible to make it come. Amphibious capability, missile coverage, and air superiority over the strait."
 CHI_1985_pressure_the_kuomintang: "Pressure the Kuomintang"
 CHI_1985_pressure_the_kuomintang_desc: "Diplomatic isolation, economic pressure, military signalling. Force Taipei to negotiate from a weaker position every year."
 CHI_1985_reunification_above_reform: "Reunification Above Reform"
 CHI_1985_reunification_above_reform_desc: "The reunification of the motherland becomes the founding political project. Reform is subordinated to nationalism; the strait is the centre of strategy."

 # BRANCH 7: Sino-Soviet, USA, Third World
 CHI_1985_anti_soviet_alignment: "Anti-Soviet Alignment"
 CHI_1985_anti_soviet_alignment_desc: "China and the United States share a long enemy. Lean into the Reagan-era partnership: arms purchases, intelligence sharing, joint pressure on Hanoi and Kabul."
 CHI_1985_support_pakistan_balance: "Support Pakistan Balance"
 CHI_1985_support_pakistan_balance_desc: "Islamabad is China's gateway to Central Asia, a check on India, and a quiet partner in the Afghan war. Strengthen the alignment."
 CHI_1985_three_obstacles_policy: "Three Obstacles Policy"
 CHI_1985_three_obstacles_policy_desc: "Beijing's price for normalisation with Moscow: Soviet withdrawal from Afghanistan, Vietnamese withdrawal from Cambodia, and reduction of Soviet forces on the Chinese border."
 CHI_1985_keep_india_contained: "Keep India Contained"
 CHI_1985_keep_india_contained_desc: "Border vigilance plus Pakistani alliance. India must understand that any Himalayan adventure will face two fronts."
 CHI_1985_normalize_with_moscow: "Normalize with Moscow"
 CHI_1985_normalize_with_moscow_desc: "Gorbachev is changing the game. Reciprocate carefully. The historical 1989 normalisation can come earlier and on better terms."
 CHI_1985_open_us_arms_sales: "Open US Arms Sales"
 CHI_1985_open_us_arms_sales_desc: "The Reagan-era window for Chinese access to American avionics, anti-tank weapons and submarine detection. Quietly transformative for the PLA."
 CHI_1985_shadow_over_vietnam: "Shadow Over Vietnam"
 CHI_1985_shadow_over_vietnam_desc: "Maintain pressure along the Vietnamese border. Hanoi must keep large forces in the north and cannot fully concentrate against Cambodia or the Soviet alternative."
 CHI_1985_cooperate_against_afghanistan: "Cooperate Against Afghanistan"
 CHI_1985_cooperate_against_afghanistan_desc: "Channel Chinese arms to the Afghan mujahideen via Pakistan. Bleed the Soviets, build the partnership with Islamabad and Washington at the same time."
 CHI_1985_african_and_third_world_links: "African and Third World Links"
 CHI_1985_african_and_third_world_links_desc: "Tanzania-Zambia railways, medical missions, technical aid. The deep base of relationships that will make China the dominant non-Western actor in the Global South by the 2010s."
 CHI_1985_arms_exports_to_the_developing_world: "Arms Exports to the Developing World"
 CHI_1985_arms_exports_to_the_developing_world_desc: "Cheap, robust Chinese weapons in Iraq, Iran, Africa and Latin America. Not always politically convenient — always profitable, and a school for a future export industry."
 CHI_1985_sell_arms_to_iran: "Sell Arms to Iran"
 CHI_1985_sell_arms_to_iran_desc: "Tehran is at war and isolated. Chinese silkworm anti-ship missiles and small-arms shipments earn hard currency that the reform economy badly needs."
 CHI_1985_sell_arms_to_iraq: "Sell Arms to Iraq"
 CHI_1985_sell_arms_to_iraq_desc: "Tanks, artillery, fighters. Selling to both sides of the Iran-Iraq war is cynical, profitable, and entirely consistent with Beijing's non-aligned posture."
 CHI_1985_offer_talks_to_moscow: "Offer Talks to Moscow"
 CHI_1985_offer_talks_to_moscow_desc: "With Gorbachev offering concessions on Afghanistan and the border, the moment has come for a normalisation summit. The Cold War's other half ends here."
 CHI_1985_chinese_global_outreach: "Chinese Global Outreach"
 CHI_1985_chinese_global_outreach_desc: "Embassies, scholarships, trade delegations. China stops being a regional power asking for recognition and starts being a global one offering relationships."
 CHI_1985_third_world_development_partnership: "Third World Development Partnership"
 CHI_1985_third_world_development_partnership_desc: "Infrastructure, industrial parks, lending. The first sketch of what will eventually become the Belt and Road."
 CHI_1985_nationalist_reunification_state: "Nationalist Reunification State"
 CHI_1985_nationalist_reunification_state_desc: "China remade around the project of forcible reunification. Higher army budgets, harder foreign policy, less reform — and a Pacific kept on edge."

 # ===========================================================================
 # IDEAS / NATIONAL SPIRITS
 # ===========================================================================
 CHI_idea_legacy_of_mao: "Legacy of Mao"
 CHI_idea_legacy_of_mao_desc: "The memory of Mao still shapes the party, the army and the countryside. His legacy grants legitimacy to the Communist state, but it also weighs heavily on reform, bureaucracy and ideological debate."
 CHI_idea_reform_and_opening: "Reform and Opening"
 CHI_idea_reform_and_opening_desc: "Deng Xiaoping has opened China to markets, foreign capital and pragmatic experimentation. Growth accelerates, but inequality, corruption and ideological tension follow."
 CHI_idea_backward_pla: "Backward People's Liberation Army"
 CHI_idea_backward_pla_desc: "The PLA is vast, politically loyal and experienced, but much of its doctrine, command structure and equipment remains behind the standard of modern limited warfare."
 CHI_idea_rural_reform_momentum: "Rural Reform Momentum"
 CHI_idea_rural_reform_momentum_desc: "The countryside is moving. Household responsibility, township enterprises and rising rural incomes give the reform its broadest social base."
 CHI_idea_inflation_and_corruption_pressure: "Inflation and Corruption Pressure"
 CHI_idea_inflation_and_corruption_pressure_desc: "Dual-track pricing and a weak rule-of-law create steady streams of inflation and graft. The cities feel both — and they remember."
 CHI_idea_sino_soviet_hostility: "Sino-Soviet Hostility"
 CHI_idea_sino_soviet_hostility_desc: "Decades of border tension, ideological splits and proxy wars have made the Soviet Union the chief external threat. The new General Secretary in Moscow may yet change that."
 CHI_idea_taiwan_question: "The Taiwan Question"
 CHI_idea_taiwan_question_desc: "The unfinished civil war hangs over every foreign policy decision. Reunification is the Party's core nationalist commitment — and its most dangerous strategic risk."
 CHI_idea_hu_yaobang_reform_line: "Hu Yaobang Reform Line"
 CHI_idea_hu_yaobang_reform_line_desc: "The General Secretary's open, debating, intellectual style energises reformers and students at the cost of conservative trust."
 CHI_idea_zhao_economic_team: "Zhao Ziyang's Economic Team"
 CHI_idea_zhao_economic_team_desc: "The Premier's pragmatic technocrats push pricing, foreign capital and enterprise autonomy further than the elders prefer."
 CHI_idea_central_advisory_commission: "Central Advisory Commission"
 CHI_idea_central_advisory_commission_desc: "The old revolutionary generation keeps a senate-style veto over reform. Chen Yun and his allies will hold the line against bourgeois ideas."
 CHI_idea_township_enterprises: "Township and Village Enterprises"
 CHI_idea_township_enterprises_desc: "Rural cooperatives and small private workshops absorb surplus labour and produce the consumer goods the planned economy never did."
 CHI_idea_dual_track_pricing: "Dual-Track Pricing"
 CHI_idea_dual_track_pricing_desc: "State-set prices for the plan, market prices for above-plan output. It works — and it bleeds inflation and corruption every step of the way."
 CHI_idea_socialist_market_foundations: "Socialist Market Foundations"
 CHI_idea_socialist_market_foundations_desc: "A market under Party direction. The phrase that defines China's economic identity for the next forty years."
 CHI_idea_dengist_development_state: "Dengist Development State"
 CHI_idea_dengist_development_state_desc: "Reform protected, Party preserved, students contained, growth high. The historical Deng outcome at full strength."
 CHI_idea_party_above_reform: "Party Above Reform"
 CHI_idea_party_above_reform_desc: "Reform is a tool of the Party, not an end in itself. Stability is paid for in growth and research."
 CHI_idea_anti_bourgeois_campaign: "Anti-Bourgeois Liberalization Campaign"
 CHI_idea_anti_bourgeois_campaign_desc: "Foreign ideas are entering on the back of foreign capital. The Party reasserts that reform does not mean political liberalisation."
 CHI_idea_reform_without_democracy: "Reform Without Democracy"
 CHI_idea_reform_without_democracy_desc: "Economic opening, political closure. The classic Dengist line, codified."
 CHI_idea_inner_party_pluralism: "Inner-Party Pluralism"
 CHI_idea_inner_party_pluralism_desc: "Real elections inside the Party for some intermediate posts, real accountability of cadres to their congresses. A modest but transformative experiment."
 CHI_idea_pla_reform_underway: "PLA Reform Underway"
 CHI_idea_pla_reform_underway_desc: "The cuts are happening, the doctrine is being rewritten, the universities are being founded. Painful in the short term; the foundation of the modern PLA."
 CHI_idea_local_wars_doctrine: "Local Wars Doctrine"
 CHI_idea_local_wars_doctrine_desc: "Doctrine reoriented from total war to limited wars on the periphery. Smaller force, faster reaction, modern weapons."
 CHI_idea_technological_army: "Technological Army"
 CHI_idea_technological_army_desc: "A smaller, professional, technologically literate PLA. The force that will eventually challenge American power in the Pacific."
 CHI_idea_peoples_war_doctrine: "People's War Doctrine"
 CHI_idea_peoples_war_doctrine_desc: "Mass mobilisation, deep defence in depth, political loyalty over technical capability. Cheap, vast, three decades behind."
 CHI_idea_one_country_two_systems: "One Country, Two Systems"
 CHI_idea_one_country_two_systems_desc: "Deng's formula for Hong Kong, Macau and Taiwan: a single sovereign state with capitalist enclaves preserved. Brilliantly elastic, chronically distrusted."
 CHI_idea_reunification_above_reform: "Reunification Above Reform"
 CHI_idea_reunification_above_reform_desc: "Nationalism replaces growth as the founding political project. Reform is subordinated to the strait."
 CHI_idea_anti_soviet_partnership: "Anti-Soviet Partnership"
 CHI_idea_anti_soviet_partnership_desc: "The Reagan-era alignment: arms purchases, intelligence sharing, joint pressure on Hanoi and Kabul. A China that is still communist but not Soviet."
 CHI_idea_normalisation_with_moscow: "Normalisation with Moscow"
 CHI_idea_normalisation_with_moscow_desc: "Gorbachev's offers reciprocated. The Cold War's other half quietly ends in Beijing."
 CHI_idea_third_world_arms_supplier: "Third-World Arms Supplier"
 CHI_idea_third_world_arms_supplier_desc: "Cheap, robust Chinese weapons across the developing world. Hard currency, diplomatic leverage, and a school for a future export industry."
 CHI_idea_conservative_maoist_restoration: "Conservative Maoist Restoration"
 CHI_idea_conservative_maoist_restoration_desc: "The elders have won the long fight. Reform is rolled back, foreign capital flees, orthodoxy returns."
 CHI_idea_political_reform_china: "Political Reform China"
 CHI_idea_political_reform_china_desc: "Pluralism inside one-party rule. Reformers in power, conservatives outflanked, students pacified — and Tiananmen never happens."
 CHI_idea_pla_regency: "PLA Regency"
 CHI_idea_pla_regency_desc: "The Central Military Commission asserts itself as the guarantor of last resort. Reform pauses; the barracks decide."
 CHI_idea_nationalist_reunification_state: "Nationalist Reunification State"
 CHI_idea_nationalist_reunification_state_desc: "China remade around the project of forcible reunification. Higher army budgets, harder foreign policy, less reform — and a Pacific kept on edge."

