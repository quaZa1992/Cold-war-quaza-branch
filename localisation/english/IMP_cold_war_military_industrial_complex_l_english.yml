# IMPERIA CW — Cold War: IMP military industrial complex — English localisation.
 IMP_military_industrial_complex_dynamic_modifier: "The Military-Industrial Complex (Export Compulsion)"
 IMP_military_industrial_complex_dynamic_modifier_desc: "When the Military-Industrial Complex is an active interest group, its manufacturers can earn more from foreign arms demand. A quiet market reduces this extra tax income; crises and wars increase it within a limited range."
 IMP_military_industrial_complex_breakdown_tt: "§YExport Compulsion§!\nAdditional military factory tax revenue for the active Military-Industrial Complex interest group:\nArms-market contribution: [?IMP_military_industrial_complex_tension_bonus|+%1] §g(0.4% per Arms Demand point above or below 25; without Cold War Equilibrium, 0.3% per World Tension point; maximum +30%)§!\nCountries currently at war: §Y[?global.IMP_military_industrial_complex_warring_countries|0]§!\nWar-market contribution: [?IMP_military_industrial_complex_war_bonus|+%1] §g(+0.5% per country at war, maximum +10%)§!\nTotal additional Military Industry Tax Revenue: [?IMP_military_industrial_complex_tax_bonus|+%1] §g(between -10% and +40%)§!\n\n§gEach country at war is counted once. Values are updated monthly. This bonus applies only while the Military-Industrial Complex interest group is active.§!"
