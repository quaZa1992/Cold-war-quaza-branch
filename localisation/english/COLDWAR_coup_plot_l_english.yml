l_english:
 # IMPERIA COLD WAR — Covert Action v2: coup plot minigame.
 CYBER_BTN_COUP: "Prepare a Coup"
 CYBER_COUP_BTN_TT: "§YPrerequisites:§!\n[!cyber_coup_plot_button_click_enabled]\n§YEffect:§!\n[!cyber_coup_plot_button_click]"
 CYBER_COUP_BTN_TT_DELAYED: "Through our illegals we reach officers who have had enough of their government. Money, promises and a guarantee of recognition: if they move, we will stand behind them. Whether they succeed is decided in the barracks of the target, not in our offices."
 COLDWAR_coup_launch_tt: "On success the target's §Ycoup plot§! rises by §R25§! times the strength of the operation. At §Y85§! the officers move: unless the government brings the plot below §Y70§! within 60 days, the party of our own ruling outlook takes power. The bloc of the country does not change.\nCosts §Y60§! command power and §Y1.5% of GDP§!."
 COLDWAR_coup_needs_illegals_tt: "Our illegals are planted in the target (Plant Illegals)"
 COLDWAR_coup_not_proofed_tt: "The target is not coup-proofed after a recent plot"
 COLDWAR_coup_one_plot_tt: "No other power is plotting in the target"
 COLDWAR_coup_plot_change_tt: "Coup plot: §Y[?COLDWAR_coup_delta|+0]§!"
 COLDWAR_coup_below_70_tt: "Coup plot below §Y70§!"
 COLDWAR_coup_mole_hunt_tt: "Ends the access of the plotters' foreign service to our institutions"
 COLDWAR_coup_cost_cp_25: "§Y25§! Command Power"
 COLDWAR_coup_plot_category: "Coup Plot"
 COLDWAR_coup_plot_category_desc: "Officers are plotting against the government with foreign help. §YCoup plot: [?COLDWAR_coup_plot|0] / 100§!\nAt §Y85§! they move; then we have 60 days to bring the plot below §Y70§!. Plots lose 2 points a month on their own."
 COLDWAR_coup_pay_officers: "Pay the Officers"
 COLDWAR_coup_pay_officers_desc: "Back pay, new flats and better postings keep the officer corps loyal. Costs 0.8% of GDP."
 COLDWAR_coup_purge_garrisons: "Purge the Garrisons"
 COLDWAR_coup_purge_garrisons_desc: "Suspect commanders are retired, transferred or arrested. The plot loses its men, the army its experience."
 COLDWAR_coup_mole_hunt: "Mole Hunt"
 COLDWAR_coup_mole_hunt_desc: "Our counter-intelligence goes after the foreign illegals behind the plot."
 COLDWAR_coup_rally_party: "Rally the Party"
 COLDWAR_coup_rally_party_desc: "Mass rallies and loyal militias show the officers that the street is not theirs."
 COLDWAR_coup_colonels_move: "The Colonels Move"
 COLDWAR_coup_colonels_move_desc: "The plotters are ready. Unless we bring the plot below 70 before the deadline, they will strike."
 cyber_coup_plot_tracking: "Prepare a Coup"
 cyber_coup_plot_tracking_desc: "Our officers in the target are being prepared. The operation will run for approximately 120 days."
 cyber_coup_plot_tracking_complete_tt: "Coup preparations resolved. Our contacts in the target's officer corps have been briefed."
 MD_cyber.121.t: "Plotting Officers"
 MD_cyber.121.d: "Our security service reports meetings of officers with foreign contacts. Money is changing hands in the barracks. A coup is being prepared."
 MD_cyber.121.a: "Find them before they find us."
 COLDWAR_coup.1.t: "The Plot Is Crushed"
 COLDWAR_coup.1.d: "The officers who planned to overthrow the government have been arrested before they could move. Their confessions name [?COLDWAR_coup_backer.GetNameWithFlag] as the power behind them."
 COLDWAR_coup.1.a: "The state stands."
 COLDWAR_coup.2.t: "Our Coup Has Failed"
 COLDWAR_coup.2.d: "Our officers in [FROM.GetNameWithFlag] were arrested before they could strike, and their confessions name us."
 COLDWAR_coup.2.a: "Deny everything."
 COLDWAR_coup.3.t: "The Army Has Seized Power"
 COLDWAR_coup.3.d: "Tanks stand before the ministries and the radio plays martial music. The plotters have overthrown the government and installed new men."
 COLDWAR_coup.3.a: "A new government."
 COLDWAR_coup.4.t: "Our Coup Has Succeeded"
 COLDWAR_coup.4.d: "The officers we supported in [FROM.GetNameWithFlag] have taken power. The new government owes us its existence."
 COLDWAR_coup.4.a: "Recognise them at once."
 cyber_op_slot_0_coup_plot_tracking: "Coup Preparations"
 cyber_op_slot_0_coup_plot_tracking_desc: "Our contacts in [?cyber_op_target_nation^0.GetNameWithFlag]'s officer corps are being prepared. The operation will run for approximately 120 days."
