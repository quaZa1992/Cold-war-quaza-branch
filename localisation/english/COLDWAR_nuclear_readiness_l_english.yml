l_english:
# IMPERIA CW — Cold War: nuclear readiness and crisis diplomacy.
 cw_nuclear.1.t:0 "Readiness Orders Completed"
 cw_nuclear.1.d:0 "The strategic forces have completed their preparations. The current posture is now [COLDWAR_nr_level_L]."
 cw_nuclear.2.t:0 "Civil Defence Stations Ready"
 cw_nuclear.2.d:0 "Emergency services and shelter authorities have completed their preparations. Civil defence arrangements are now in force."
 cw_nuclear.3.t:0 "A Nuclear Warning"
 cw_nuclear.3.d:0 "[COLDWAR_nr_sender.GetNameDefCap] has issued a formal nuclear warning to our government. Its strategic forces are at heightened readiness. The cabinet must decide how to respond."
 cw_nuclear.4.t:0 "A Counter-Alert"
 cw_nuclear.4.d:0 "[COLDWAR_nr_sender.GetNameDefCap] has announced a nuclear counter-alert. Both governments now face a confrontation in which each military move carries political consequences."
 cw_nuclear.5.t:0 "Direct Communications Established"
 cw_nuclear.5.d:0 "Our governments have agreed to keep a direct channel open throughout the confrontation. A mutual reduction of nuclear readiness can now be negotiated."
 cw_nuclear.6.t:0 "Mutual Stand-Down Agreed"
 cw_nuclear.6.d:0 "Both governments have accepted a coordinated return to routine nuclear readiness. The direct confrontation has ended."
 cw_nuclear.7.t:0 "Proposal Declined"
 cw_nuclear.7.d:0 "[COLDWAR_nr_recipient.GetNameDefCap] has declined our proposal. The existing military postures remain in place."
 cw_nuclear.8.t:0 "Nuclear Warning Withdrawn"
 cw_nuclear.8.d:0 "[COLDWAR_nr_sender.GetNameDefCap] has withdrawn its nuclear warning and returned its strategic forces to routine readiness. Our government retains control of its own posture."
 cw_nuclear.9.t:0 "Confrontation Lapses"
 cw_nuclear.9.d:0 "The period of formal nuclear confrontation has expired. Each government retains responsibility for its military posture and any further diplomatic action."
 cw_nuclear.10.t:0 "A Nuclear Confrontation"
 cw_nuclear.10.d:0 "[COLDWAR_nr_sender.GetNameDefCap] has issued a formal nuclear warning to [COLDWAR_nr_recipient.GetNameDef]. Diplomatic missions are seeking clarification as governments assess the risk of escalation."
 cw_nuclear.11.t:0 "An Ally Requests Consultation"
 cw_nuclear.11.d:0 "[COLDWAR_nr_sender.GetNameDefCap] requests urgent consultations concerning its nuclear confrontation with [COLDWAR_nr_recipient.GetNameDef]. Allied governments must coordinate their diplomatic and civil defence responses."
 cw_nuclear.12.t:0 "Nuclear Attack Confirmed"
 cw_nuclear.12.d:0 "[COLDWAR_nr_attacker.GetNameDefCap] has used nuclear weapons against us. Emergency services are assessing the consequences as the cabinet reviews its response."
 cw_nuclear.13.t:0 "Negotiations Overtaken by Events"
 cw_nuclear.13.d:0 "Nuclear weapons have been used during this confrontation. The proposed agreement can no longer be concluded on its previous terms."
 cw_nuclear.14.t:0 "Strategic Intelligence Assessment"
 cw_nuclear.14.d:0 "Our assessment of [COLDWAR_nr_subject.GetNameDef]:\n\n[COLDWAR_nr_assessment_L]"
 cw_nuclear.15.t:0 "A Final Nuclear Ultimatum"
 cw_nuclear.15.d:0 "[COLDWAR_nr_sender.GetNameDefCap] has issued a final nuclear ultimatum to our government. Its cabinet will be able to authorise nuclear operations after 72 hours. Direct communications and a mutual stand-down remain available."
 cw_nuclear.16.t:0 "Nuclear Release Authority Granted"
 cw_nuclear.16.d:0 "The 72-hour ultimatum has expired. The cabinet has granted seven days of nuclear release authority against [COLDWAR_nr_recipient.GetNameDef]. A separate military order is required to carry out an operation. The first operation will open a state of war."
 cw_nuclear.17.t:0 "A Foreign Nuclear Release Order"
 cw_nuclear.17.d:0 "[COLDWAR_nr_sender.GetNameDefCap] has completed its ultimatum and authorised nuclear operations against our government for seven days. The danger of an attack is immediate. Direct negotiations can still secure a mutual stand-down."
 cw_nuclear.18.t:0 "An Ultimatum Threatens Nuclear Use"
 cw_nuclear.18.d:0 "[COLDWAR_nr_sender.GetNameDefCap] has delivered a 72-hour nuclear ultimatum to [COLDWAR_nr_recipient.GetNameDef]. Diplomatic missions are seeking a negotiated reduction of readiness before nuclear operations can be authorised."
 cw_nuclear.19.t:0 "Nuclear Release Authority Withdrawn"
 cw_nuclear.19.d:0 "[COLDWAR_nr_sender.GetNameDefCap] has withdrawn its final ultimatum and any associated nuclear release authority. National readiness orders remain in force. Operations already underway remain committed."
 cw_nuclear.20.t:0 "Nuclear Release Authority Expires"
 cw_nuclear.20.d:0 "The nuclear release authority held by [COLDWAR_nr_sender.GetNameDef] against [COLDWAR_nr_recipient.GetNameDef] has expired. Further operations outside an existing war require a new authorisation. National readiness remains under government control."
 cw_nuclear.21.t:0 "A Nuclear Operation Opens Hostilities"
 cw_nuclear.21.d:0 "[COLDWAR_nr_sender.GetNameDefCap] has carried out a nuclear operation against [COLDWAR_nr_recipient.GetNameDef] before a declaration of war. A state of war now exists between the two governments, irrespective of the operation's outcome. Foreign governments have condemned the attack."
 COLDWAR_nr_category:0 "Strategic Readiness"
 COLDWAR_nr_category_desc:0 "The government directs nuclear readiness, civil defence and crisis communications. Formal warnings and proposals are delivered through diplomatic channels."
 COLDWAR_nr_open_command:0 "Convene the National Security Council"
 COLDWAR_nr_open_command_desc:0 "Review the posture of the strategic forces, the readiness of civil defence authorities and the state of any nuclear confrontation."
 COLDWAR_nr_title:0 "STRATEGIC COMMAND"
 COLDWAR_nr_subtitle:0 "NATIONAL SECURITY COUNCIL  |  STRATEGIC FORCES DIRECTORATE"
 COLDWAR_nr_review_command:0 "Convene the National Security Council."
 COLDWAR_nr_acknowledge:0 "Acknowledged."
 debug_event_scopes:0 "Event context"
 COLDWAR_nr_strategic_forces:0 "Strategic Forces"
 COLDWAR_nr_strategic_forces_desc:0 "Maintaining nuclear forces at elevated readiness places sustained demands on personnel, equipment and the national budget."
 COLDWAR_nr_civil_defence:0 "Civil Defence Mobilisation"
 COLDWAR_nr_civil_defence_desc:0 "Emergency services, shelter authorities and local administrations are assigned to civil defence duties."
 COLDWAR_nr_tt_arsenal:0 "At least 1 nuclear missile in storage is required."
 COLDWAR_nr_tt_transition:0 "The previous readiness order has been completed."
 COLDWAR_nr_tt_standdown:0 "No agreed stand-down is in force."
 COLDWAR_nr_tt_tactical_ready:0 "Requires Reinforced Readiness or higher, 1 operational nuclear missile and no agreed stand-down in force."
 COLDWAR_nr_tt_state_ready:0 "Requires Strategic Alert or higher, 20 operational nuclear missiles and no agreed stand-down in force."
 COLDWAR_nr_tt_strategic_ready:0 "Requires Maximum Readiness, 200 operational nuclear missiles and no agreed stand-down in force."
 COLDWAR_nr_tt_warning:0 "Requires Reinforced Readiness or higher, completed preparations, an available nuclear arsenal and a sovereign government outside our faction. Neither government may be engaged in another nuclear confrontation or a 90-day cooling-off period."
 COLDWAR_nr_tt_counter:0 "We are the recipient of an active nuclear warning, have reached Reinforced Readiness or higher and have not yet issued a counter-alert."
 COLDWAR_nr_tt_crisis:0 "This government is our counterpart in an active nuclear confrontation."
 COLDWAR_nr_tt_withdraw:0 "We issued the original warning to this government and the confrontation is still active."
 COLDWAR_nr_tt_hotline:0 "An active nuclear confrontation has no direct communications channel or unanswered proposal. Proposals may be sent once every 21 days."
 COLDWAR_nr_tt_standdown_offer:0 "A direct communications channel is open. No proposal is pending. Proposals may be sent once every 21 days."
 COLDWAR_nr_tt_assess:0 "A strategic assessment of this government has not been requested in the last 14 days."
 COLDWAR_nr_warning:0 "Issue a Nuclear Warning"
 COLDWAR_nr_warning_send:0 "Issue a formal nuclear warning to this government.\n\n§YCold War tension:§! §R+5§!\n§YWorld tension:§! §R+2§!\n§YDuration:§! 90 days\n§YCooling-off period after closure:§! 90 days"
 COLDWAR_nr_warning_receive:0 "[Root.GetNameDefCap] has issued a formal nuclear warning to our government."
 COLDWAR_nr_warning_accept_title:0 "Nuclear Warning Delivered"
 COLDWAR_nr_warning_accept:0 "Our warning has been delivered to [This.GetNameDef]."
 COLDWAR_nr_counter:0 "Announce a Nuclear Counter-Alert"
 COLDWAR_nr_counter_send:0 "Announce a nuclear counter-alert to this government.\n\n§YCold War tension:§! §R+3§!\n§YWorld tension:§! §R+1§!\nOur readiness posture becomes publicly known."
 COLDWAR_nr_counter_receive:0 "[Root.GetNameDefCap] has announced a nuclear counter-alert."
 COLDWAR_nr_counter_accept_title:0 "Counter-Alert Delivered"
 COLDWAR_nr_counter_accept:0 "Our counter-alert has been communicated to [This.GetNameDef]."
 COLDWAR_nr_hotline:0 "Propose Direct Crisis Communications"
 COLDWAR_nr_hotline_send:0 "Propose a direct communications channel between our governments.\n\n§YOn acceptance:§! Opens negotiations for a mutual stand-down.\n§YOffer valid for:§! 14 days"
 COLDWAR_nr_hotline_receive:0 "[Root.GetNameDefCap] proposes a direct channel between our governments.\n\n§YOn acceptance:§! Opens negotiations for a mutual stand-down."
 COLDWAR_nr_hotline_accept_title:0 "Direct Communications Agreed"
 COLDWAR_nr_hotline_accept:0 "Both governments have agreed to maintain direct crisis communications."
 COLDWAR_nr_standdown:0 "Propose a Mutual Nuclear Stand-Down"
 COLDWAR_nr_standdown_send:0 "Propose a coordinated nuclear stand-down.\n\n§YBoth governments on acceptance:§!\nReturn to §YRoutine Deterrence§!.\nCancel outstanding readiness orders.\nObserve a §Y30-day§! stand-down.\n§YCold War tension:§! §G-[?Root.COLDWAR_nr_pressure|2]§!\n§YCooling-off period:§! 90 days\n§YOffer valid for:§! 14 days"
 COLDWAR_nr_standdown_receive:0 "[Root.GetNameDefCap] proposes a coordinated stand-down.\n\n§YBoth governments on acceptance:§!\nReturn to §YRoutine Deterrence§!.\nCancel outstanding readiness orders.\nObserve a §Y30-day§! stand-down.\n§YCold War tension:§! §G-[?Root.COLDWAR_nr_pressure|2]§!\n§YCooling-off period:§! 90 days"
 COLDWAR_nr_standdown_accept_title:0 "Mutual Stand-Down Agreed"
 COLDWAR_nr_standdown_accept:0 "Both governments have agreed to return to routine nuclear readiness for 30 days."
 COLDWAR_nr_offer_reject_title:0 "Proposal Declined"
 COLDWAR_nr_offer_reject:0 "[This.GetNameDefCap] has declined our proposal. Existing military postures remain in place."
 COLDWAR_nr_withdraw:0 "Withdraw the Nuclear Warning"
 COLDWAR_nr_withdraw_send:0 "Withdraw our nuclear warning and return our forces to routine readiness.\n\n§YOur stand-down:§! 14 days\n§YCold War tension reduction:§! §GUp to 2§!\n§YCooling-off period:§! 90 days\nThe reduction cannot exceed the tension added by this confrontation. The other government retains control of its readiness posture."
 COLDWAR_nr_withdraw_receive:0 "[Root.GetNameDefCap] has ended the nuclear confrontation."
 COLDWAR_nr_withdraw_accept_title:0 "Warning Withdrawn"
 COLDWAR_nr_withdraw_accept:0 "Our government has returned its strategic forces to routine readiness."
 COLDWAR_nr_assess:0 "Request a Strategic Intelligence Assessment"
 COLDWAR_nr_assess_send:0 "Request a strategic intelligence assessment.\n\n§YBelow 35% air intelligence:§! Unconfirmed.\n§Y35% air intelligence, allied liaison or a public warning:§! General posture.\n§Y65% air intelligence:§! Confirmed readiness level.\n§YDiscovery of a concealed strategic or maximum alert:§! §R+1 Cold War tension§!, once per government every 30 days.\n§YNew assessment available in:§! 14 days"
 COLDWAR_nr_assess_receive:0 "A strategic intelligence assessment has been requested."
 COLDWAR_nr_assess_accept_title:0 "Assessment Requested"
 COLDWAR_nr_assess_accept:0 "The intelligence directorate has delivered its assessment."
 COLDWAR_nr_warning_threat:0 "Formal Nuclear Warning"
 COLDWAR_nr_counter_threat:0 "Nuclear Counter-Alert"
 COLDWAR_nr_level_5:0 "Routine Deterrence"
 COLDWAR_nr_order_5:0 "5  Routine Deterrence"
 COLDWAR_nr_level_5_tt:0 "§YRoutine Deterrence§!\n\nOperational share: §Y15%§!\nDispersed reserve: §Y10%§!\nWeekly readiness budget: §Y×1§!\n\nAdditional preparation is required before nuclear operations. Employment remains subject to national doctrine.\n\n§YOrder cost:§! 25 political power\n§YPreparation:§! 2 days per level raised; reductions take effect immediately."
 COLDWAR_nr_level_4:0 "Increased Vigilance"
 COLDWAR_nr_order_4:0 "4  Increased Vigilance"
 COLDWAR_nr_level_4_tt:0 "§YIncreased Vigilance§!\n\nOperational share: §Y30%§!\nDispersed reserve: §Y15%§!\nWeekly readiness budget: §Y×1.15§!\n\nAdditional preparation is required before nuclear operations. Employment remains subject to national doctrine.\n\n§YOrder cost:§! 25 political power\n§YPreparation:§! 2 days per level raised; reductions take effect immediately."
 COLDWAR_nr_level_3:0 "Reinforced Readiness"
 COLDWAR_nr_order_3:0 "3  Reinforced Readiness"
 COLDWAR_nr_level_3_tt:0 "§YReinforced Readiness§!\n\nOperational share: §Y50%§!\nDispersed reserve: §Y25%§!\nWeekly readiness budget: §Y×1.4§!\n\nTactical nuclear operations may be prepared. Employment remains subject to national doctrine.\n\n§YOrder cost:§! 25 political power\n§YPreparation:§! 2 days per level raised; reductions take effect immediately."
 COLDWAR_nr_level_2:0 "Strategic Alert"
 COLDWAR_nr_order_2:0 "2  Strategic Alert"
 COLDWAR_nr_level_2_tt:0 "§YStrategic Alert§!\n\nOperational share: §Y75%§!\nDispersed reserve: §Y40%§!\nWeekly readiness budget: §Y×1.8§!\n\nTactical and state nuclear operations may be prepared. Employment remains subject to national doctrine.\n\n§YOrder cost:§! 25 political power\n§YPreparation:§! 2 days per level raised; reductions take effect immediately."
 COLDWAR_nr_level_1:0 "Maximum Readiness"
 COLDWAR_nr_order_1:0 "1  Maximum Readiness"
 COLDWAR_nr_level_1_tt:0 "§YMaximum Readiness§!\n\nOperational share: §Y100%§!\nDispersed reserve: §Y50%§!\nWeekly readiness budget: §Y×2.5§!\n\nAll nuclear operations may be prepared. Employment remains subject to national doctrine.\n\n§YOrder cost:§! 25 political power\n§YPreparation:§! 2 days per level raised; reductions take effect immediately."
 COLDWAR_nr_assessment_unknown:0 "§YConfidence: Low§!\nThe available evidence does not support a reliable assessment of the government's nuclear readiness."
 COLDWAR_nr_assessment_routine:0 "§YConfidence: Assessed§!\nThe strategic forces appear to be at routine readiness or increased vigilance."
 COLDWAR_nr_assessment_elevated:0 "§YConfidence: Assessed§!\nThe strategic forces appear to be at reinforced readiness or strategic alert."
 COLDWAR_nr_assessment_maximum:0 "§YConfidence: Assessed§!\nThe strategic forces appear to be at maximum readiness."
 COLDWAR_nr_assessment_exact_5:0 "§YConfidence: Confirmed§!\nCurrent readiness: §YRoutine Deterrence§!."
 COLDWAR_nr_assessment_exact_4:0 "§YConfidence: Confirmed§!\nCurrent readiness: §YIncreased Vigilance§!."
 COLDWAR_nr_assessment_exact_3:0 "§YConfidence: Confirmed§!\nCurrent readiness: §YReinforced Readiness§!."
 COLDWAR_nr_assessment_exact_2:0 "§YConfidence: Confirmed§!\nCurrent readiness: §YStrategic Alert§!."
 COLDWAR_nr_assessment_exact_1:0 "§YConfidence: Confirmed§!\nCurrent readiness: §YMaximum Readiness§!."
