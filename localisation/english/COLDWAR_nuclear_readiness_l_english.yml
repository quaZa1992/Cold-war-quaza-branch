 COLDWAR_nr_relief_current:0 "[?Root.COLDWAR_nr_pressure|2]"
 COLDWAR_nr_launcher_tt:0 "§YStrategic Command§!\nCurrent posture: §Y[COLDWAR_nr_level_L]§!\n\nReview strategic readiness, civil defence and nuclear crisis communications."
