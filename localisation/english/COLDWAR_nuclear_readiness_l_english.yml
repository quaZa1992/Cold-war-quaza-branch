 cw_nuclear.30.t:0 "Post-Crisis Intelligence Review"
 cw_nuclear.30.d:0 "The review of our confrontation with [?COLDWAR_nr_review_peer.GetNameDef] is complete.\n\n§YAssessments requested:§! [?COLDWAR_nr_rv_assess|0]\n§YMisjudged:§! [?COLDWAR_nr_rv_wrong|0], of which [?COLDWAR_nr_rv_over|0] overstated the threat\n§YMisled by deliberate signals:§! [?COLDWAR_nr_rv_deceived|0]\n§YHighest readiness the counterpart actually reached:§! [COLDWAR_nr_review_peer_level_L]\n§YCounterpart exercises:§! [?COLDWAR_nr_rv_exercises|0]  |  §YConcealment periods:§! [?COLDWAR_nr_rv_concealed|0]\n§YEarly-warning false alarms:§! [?COLDWAR_nr_rv_alarms|0]"
 cw_nuclear.31.t:0 "Early Warning: Launches Reported"
 cw_nuclear.31.d:0 "Early-warning stations report missile launches from the territory of [?COLDWAR_nr_alarm_source_id.GetNameDef]. No second sensor has confirmed the data. The duty officers request a decision within minutes."
 cw_nuclear.31.a:0 "Treat it as a system fault."
 cw_nuclear.31.b:0 "Hold the forces at Reinforced Readiness until it is confirmed."
 cw_nuclear.31.c:0 "Order Maximum Readiness at once."
 COLDWAR_nr_tt_alarm_dismiss:0 "Threat perception: §G-5§!"
 COLDWAR_nr_tt_alarm_hold:0 "Readiness rises to §YReinforced Readiness§! at once, without political power cost.\nThreat perception: §R+8§!"
 COLDWAR_nr_tt_alarm_maximum:0 "Readiness rises to §YMaximum Readiness§! at once, without political power cost.\nAlert fatigue: §R+10§!\nThreat perception: §R+15§!\nOur posture becomes publicly known for §Y30 days§!.\nForeign player governments outside our faction: threat perception §R+10§!"
 cw_nuclear.32.t:0 "False Alarm Confirmed"
 cw_nuclear.32.d:0 "Follow-up checks have found no launches. The alarm was caused by [COLDWAR_nr_alarm_cause_L]"
 COLDWAR_nr_alarm_cause_1:0 "a training tape loaded into the warning computers."
 COLDWAR_nr_alarm_cause_2:0 "a failed component in the warning network's computers."
 COLDWAR_nr_alarm_cause_3:0 "radar returns from the rising Moon."
 COLDWAR_nr_alarm_cause_4:0 "satellite sensors misreading sunlight reflected from high clouds."
 cw_nuclear.32.a:0 "Restore the previous readiness posture."
 cw_nuclear.32.b:0 "Keep the forces at their current readiness."
 COLDWAR_nr_tt_alarm_restore:0 "Readiness returns to the posture held before the alarm, without political power cost."
 cw_nuclear.33.t:0 "Foreign Forces on Maximum Alert"
 cw_nuclear.33.d:0 "[COLDWAR_nr_sender.GetNameDefCap] has placed its strategic forces on maximum alert without public explanation. Our early-warning network is tracking unusual activity."
 COLDWAR_nr_tt_paranoia_plus10:0 "Threat perception: §R+10§!"
 cw_nuclear.35.t:0 "A Foreign Strategic Exercise"
 cw_nuclear.35.d:0 "Our services report a large strategic forces exercise by [?COLDWAR_ws_source_id.GetNameDef]. Its government describes the activity as routine. Our analysts cannot rule out that it covers genuine preparations."
 COLDWAR_nr_tt_paranoia_signal:0 "Threat perception: §R+[?COLDWAR_nr_last_signal_bump|0]§!"
 COLDWAR_nr_signal_title:0 "05 / STRATEGIC SIGNALLING"
 COLDWAR_nr_paranoia_label:0 "THREAT PERCEPTION"
 COLDWAR_nr_paranoia_value_1:0 "§G[?COLDWAR_nr_paranoia|0] / 100§!"
 COLDWAR_nr_paranoia_value_2:0 "[?COLDWAR_nr_paranoia|0] / 100"
 COLDWAR_nr_paranoia_value_3:0 "§Y[?COLDWAR_nr_paranoia|0] / 100§!"
 COLDWAR_nr_paranoia_value_4:0 "§R[?COLDWAR_nr_paranoia|0] / 100§!"
 COLDWAR_nr_paranoia_state_1:0 "§GCalm§!  |  Misjudged [?COLDWAR_nr_misread_pct|0]%"
 COLDWAR_nr_paranoia_state_2:0 "Watchful  |  Misjudged [?COLDWAR_nr_misread_pct|0]%"
 COLDWAR_nr_paranoia_state_3:0 "§YAlarmed§!  |  Misjudged [?COLDWAR_nr_misread_pct|0]%"
 COLDWAR_nr_paranoia_state_4:0 "§RParanoid§!  |  Misjudged [?COLDWAR_nr_misread_pct|0]%"
 COLDWAR_nr_signal_exercise:0 "§YExercise in progress: [?COLDWAR_nr_signal_days|0] days§!"
 COLDWAR_nr_signal_concealed:0 "§YReadiness concealed: [?COLDWAR_nr_signal_days|0] days§!"
 COLDWAR_nr_signal_cooldown:0 "Next signalling measure in [?COLDWAR_nr_signal_cd_days|0] days"
 COLDWAR_nr_signal_none:0 "No signalling measure in force"
 COLDWAR_nr_exercise:0 "Strategic Exercise  £pol_power  25"
 COLDWAR_nr_conceal:0 "Conceal Readiness  £pol_power  25"
 COLDWAR_nr_paranoia_tt:0 "§YThreat perception§!: [?COLDWAR_nr_paranoia|0] / 100\nHow our government reads foreign nuclear activity.\n\n§YMisjudged assessments:§! [?COLDWAR_nr_misread_pct|0]%, 10 points lower with 65% air intelligence (at least 2%), none for faction members\n§YOverstated among misjudged:§! [?COLDWAR_nr_overstate_pct|0]%\n§YEarly-warning false alarms per week:§! [?COLDWAR_nr_alarm_crisis_pct|1]%, only during a formal confrontation, from 30 threat perception, at most one per 60 days\n\n§YWeekly change§!\nBase: §G-6§!\nActive confrontation: §R+8§!\nForeign ultimatum or release authority: §R+6§!\nOwn readiness at Reinforced or higher: §R+3§!\nCold War tension: up to §R+4§!\nDirect channel: §G-4§!\nAgreed stand-down: §G-6§!\nWar scare: §R+4§!\n\n§YImmediate changes§!\nNuclear warning received: §R+12§!\nCounter-alert received: §R+8§!\nFinal ultimatum received: §R+20§!\nForeign release authority: §R+15§!\nReport of foreign strategic activity: §R+4§!\nForeign exercise: §R+6§!, by our counterpart §R+15§!\nForeign response to our activity: §R+5§!\nForeign maximum alert: §R+10§!\nNuclear operation by any government: §R+10§!\nNuclear attack on us: §R+100§!\nConcealment exposed by our intelligence: §R+10§!\nDirect channel agreed: §G-8§!\nMutual stand-down: §G-20§!"
 COLDWAR_nr_exercise_tt:0 "§YStrategic exercise§!\nCost: §Y25 political power§!\nDuration: §Y10 days§!\nAlert fatigue: §R+3§!\nForeign assessments report our forces at §YStrategic Alert§!. With 65% air intelligence an assessment sees through the exercise in §Y50%§! of cases. Faction members see our actual posture.\nForeign player governments outside our faction are notified: threat perception §R+6§!, our crisis counterpart §R+15§!.\nDuring a war scare, or within §Y30 days§! of a report about another government, the exercise counts as an escalation step.\nRequires: nuclear missiles in storage, no agreed stand-down, no other signalling measure in force.\nNext signalling measure after §Y60 days§!."
 COLDWAR_nr_conceal_tt:0 "§YConceal readiness§!\nCost: §Y25 political power§!\nDuration: §Y30 days§!\nForeign assessments report our forces no higher than §YIncreased Vigilance§!. With 65% air intelligence an assessment sees through the concealment in §Y50%§! of cases: the discovering government gains §R+10§! threat perception and an exposed Strategic Alert or Maximum Readiness adds §R+1§! Cold War tension. Faction members, public warnings and counter-alerts still reveal our posture.\nRequires: nuclear missiles in storage, no other signalling measure in force.\nNext signalling measure after §Y60 days§!."
 # IMPERIA COLD WAR update 25.11.2026: intelligence operations against strategic commands and Game Controller intelligence tools.
 COLDWAR_nr_assess_source_5:0 "§YSource:§! agents inside the strategic command"
 COLDWAR_nr_assess_note_3:0 "\n§YAnalysts' note:§! a foreign disinformation campaign aimed at our services has been identified."
 COLDWAR_nr_op_penetrate:0 "Penetrate Strategic Command"
 COLDWAR_nr_op_penetrate_desc:0 "Place agents inside the target's strategic forces command and early-warning staff to report its actual nuclear readiness."
 COLDWAR_nr_op_penetrate_tt:0 "For §Y120 days§! our strategic assessments of this government are exact and never misjudged. They see through its exercises, concealment and disinformation.\nAn assessment is delivered at once."
 COLDWAR_nr_op_penetrate_extra_tt:0 "Access lasts §Y180 days§!."
 COLDWAR_nr_op_exaggerate:0 "Exaggerate Our Nuclear Readiness"
 COLDWAR_nr_op_exaggerate_desc:0 "Feed the target's intelligence services false reports that our strategic forces stand at a higher alert than they do."
 COLDWAR_nr_op_exaggerate_tt:0 "For §Y90 days§! this government's strategic assessments of us report our readiness §Ytwo levels higher§! than it is, at most Maximum Readiness.\nAgents inside our strategic command identify the campaign."
 COLDWAR_nr_op_understate:0 "Understate Our Nuclear Readiness"
 COLDWAR_nr_op_understate_desc:0 "Feed the target's intelligence services false reports that our strategic forces stand at a lower alert than they do."
 COLDWAR_nr_op_understate_tt:0 "For §Y90 days§! this government's strategic assessments of us report our readiness §Ytwo levels lower§! than it is, at least Routine Deterrence.\nAgents inside our strategic command identify the campaign."
 COLDWAR_nr_op_disinfo_extra_tt:0 "The campaign lasts §Y135 days§!."
 COLDWAR_gc_nr_false_alarm:0 "Early-Warning False Alarm: [FROM.GetName]"
 COLDWAR_gc_nr_false_alarm_desc:0 "Trigger an early-warning false alarm for this player government."
 COLDWAR_gc_nr_false_alarm_tt:0 "[FROM.GetNameDefCap] receives an early-warning alarm reporting launches from its crisis counterpart, otherwise from a foreign nuclear power outside its faction.\nNo further false alarm for this government for §Y60 days§!."
 COLDWAR_gc_nr_alarming_report:0 "Alarming Intelligence Report: [FROM.GetName]"
 COLDWAR_gc_nr_alarming_report_desc:0 "Deliver an unverified intelligence report about foreign strategic preparations to this player government."
 COLDWAR_gc_nr_alarming_report_tt:0 "[FROM.GetNameDefCap]: threat perception §R+20§!. The government receives the report as an event."
 cw_nuclear.36.t:0 "An Alarming Intelligence Report"
 cw_nuclear.36.d:0 "Our services have received reports of unusual movements of foreign strategic forces and command staff. The source cannot be verified, and the reports may be exaggerated or planted."
 COLDWAR_nr_tt_paranoia_plus20:0 "Threat perception: §R+20§!"
 # IMPERIA COLD WAR update 25.11.2026: peacetime war scares between player nuclear powers.
 COLDWAR_ws_crisis_line:0 "War scare with §Y[?COLDWAR_ws_partner.GetNameDef]§!: §Y[?COLDWAR_ws_steps|0]§! escalation steps"
 COLDWAR_ws_opt_routine:0 "Treat it as routine activity."
 COLDWAR_ws_tt_routine:0 "No response now. Raising readiness or starting an exercise through Strategic Command within §Y30 days§! still counts as an answer."
 COLDWAR_ws_opt_assess:0 "Request an intelligence assessment."
 COLDWAR_ws_tt_assess:0 "A strategic assessment of [?COLDWAR_ws_source_id.GetNameDef] is delivered at once. Next assessment of this government after §Y14 days§!.\nRaising readiness or starting an exercise within §Y30 days§! still counts as an answer."
 COLDWAR_ws_opt_raise:0 "Raise our readiness by one level at once."
 COLDWAR_ws_tt_raise:0 "Readiness rises by §Yone level§! at once.\nThe other government notices the step: war scare escalation §R+1§!, its threat perception §R+5§!."
 COLDWAR_ws_opt_exercise:0 "Answer with a counter-exercise."
 COLDWAR_ws_tt_exercise:0 "Starts a strategic exercise: §Y25 political power§!, §Y10 days§!, alert fatigue §R+3§!.\nThe other government notices the step: war scare escalation §R+1§!, its threat perception §R+5§!."
 cw_nuclear.38.t:0 "Foreign Forces Respond"
 cw_nuclear.38.d:0 "[?COLDWAR_ws_source_id.GetNameDefCap] has raised the readiness of its strategic forces. Our analysts link the step to our own recent activity."
 cw_nuclear.39.t:0 "War Scare"
 cw_nuclear.39.d:0 "Tension between us and [?COLDWAR_ws_partner.GetNameDef] keeps rising. The two governments have answered each other's moves [?COLDWAR_ws_steps|0] times, and neither side has issued a formal warning."
 COLDWAR_ws_opt_warn:0 "Issue a formal nuclear warning."
 COLDWAR_ws_tt_warn:0 "Opens a formal nuclear confrontation, as the diplomatic action §YNuclear Warning§!.\nRequires Reinforced Readiness or higher with preparations complete."
 COLDWAR_ws_opt_clarify:0 "Explain our actions through diplomatic channels."
 COLDWAR_ws_tt_clarify:0 "[?COLDWAR_ws_partner.GetNameDefCap] decides whether to believe us. If it does: war scare escalation §G-3§! and threat perception §G-15§! for both governments.\nOnce per war scare."
 COLDWAR_ws_opt_wait:0 "Wait and watch."
 COLDWAR_ws_tt_wait:0 "Without new steps the escalation falls by §G1§! per week after §Y14 quiet days§!. The war scare ends after §Y30 quiet days§! at zero."
 cw_nuclear.40.t:0 "An Explanation Through Diplomatic Channels"
 cw_nuclear.40.d:0 "[?COLDWAR_ws_partner.GetNameDefCap] assures us that its recent strategic activity was routine and posed no threat to us."
 COLDWAR_ws_opt_accept:0 "Accept the explanation."
 COLDWAR_ws_tt_accept:0 "War scare escalation §G-3§! and threat perception §G-15§! for both governments."
 COLDWAR_ws_opt_reject:0 "Dismiss it as deception."
 COLDWAR_ws_tt_reject:0 "Threat perception: §R+5§!"
 cw_nuclear.41.t:0 "War Scare Review"
 cw_nuclear.41.d:0 "The war scare with [?COLDWAR_ws_rv_partner.GetNameDef] has ended.\n\n§YOrigin:§! a report about the strategic activity of [?COLDWAR_ws_rv_origin_country.GetNameDef]: [COLDWAR_ws_origin_L]\n§YEscalation steps:§! [?COLDWAR_ws_rv_mine|0] by us, [?COLDWAR_ws_rv_theirs|0] by them"
 COLDWAR_ws_origin_1:0 "nothing had taken place. Routine movements were misread."
 COLDWAR_ws_origin_2:0 "a genuine strategic exercise."
