 COLDWAR_nr_card_second_1:0 "Readiness"
 COLDWAR_NR_WARNING_TITLE:0 "Issue a Nuclear Warning"
 COLDWAR_NR_WARNING_ACTION_DESC:0 "Issue a formal nuclear warning to this government.\n\n§YCold War tension:§! §R+5§!\n§YWorld tension:§! §R+2§!\n§YDuration:§! 90 days\n§YCooling-off period after closure:§! 90 days"
 COLDWAR_NR_COUNTER_TITLE:0 "Announce a Nuclear Counter-Alert"
 COLDWAR_NR_COUNTER_ACTION_DESC:0 "Announce a nuclear counter-alert to this government.\n\n§YCold War tension:§! §R+3§!\n§YWorld tension:§! §R+1§!\nOur readiness posture becomes publicly known."
 COLDWAR_NR_HOTLINE_TITLE:0 "Propose Crisis Communications"
 COLDWAR_NR_HOTLINE_ACTION_DESC:0 "Propose a direct communications channel between our governments.\n\n§YOn acceptance:§! Opens negotiations for a mutual stand-down.\n§YOffer valid for:§! 14 days"
 COLDWAR_NR_STANDDOWN_TITLE:0 "Propose a Mutual Stand-Down"
 COLDWAR_NR_STANDDOWN_ACTION_DESC:0 "Propose a coordinated nuclear stand-down.\n\n§YBoth governments on acceptance:§!\nReturn to §YRoutine Deterrence§!.\nCancel outstanding readiness orders.\nObserve a §Y30-day§! stand-down.\n§YCold War tension reduction:§! §GUp to 18§!\n§YCooling-off period:§! 90 days\n§YOffer valid for:§! 14 days\nThe reduction cannot exceed the tension added by this confrontation."
 COLDWAR_NR_WITHDRAW_TITLE:0 "Withdraw Nuclear Warning"
 COLDWAR_NR_WITHDRAW_ACTION_DESC:0 "Withdraw our nuclear warning and return our forces to routine readiness.\n\n§YOur stand-down:§! 14 days\n§YCold War tension reduction:§! §GUp to 2§!\n§YCooling-off period:§! 90 days\nThe reduction cannot exceed the tension added by this confrontation. The other government retains control of its readiness posture."
 COLDWAR_NR_ASSESS_TITLE:0 "Request Strategic Assessment"
 COLDWAR_NR_ASSESS_ACTION_DESC:0 "Request a strategic intelligence assessment.\n\n§YBelow 35% air intelligence:§! Unconfirmed.\n§Y35% air intelligence, allied liaison or a public warning:§! General posture.\n§Y65% air intelligence:§! Confirmed readiness level.\n§YDiscovery of a concealed strategic or maximum alert:§! §R+1 Cold War tension§!, once per government every 30 days.\n§YNew assessment available in:§! 14 days"
 COLDWAR_NR_ULTIMATUM_TITLE:0 "Issue Nuclear Ultimatum"
 COLDWAR_NR_ULTIMATUM_ACTION_DESC:0 "Deliver a final nuclear ultimatum to this government.\n\n§YCost:§! 100 political power\n§YUltimatum:§! 72 hours\n§YNuclear release authority after expiry:§! 7 days\n§YCold War tension:§! §R+5§!\n§YWorld tension:§! §R+2§!\n§YFurther ultimatums:§! 90-day cooling-off period\n\nNuclear operations require a separate military order. The first operation opens war, including an intercepted or unsuccessful attack.\n§YAdditional consequences on execution:§!\n§R+20§! Cold War tension; §R+10§! world tension.\n§R-5%§! stability.\nForeign opinion: §R-100§! for §Y365 days§!.\nA mutual stand-down cancels release authority. Withdrawing authority prevents further launches; operations already underway remain committed."
 COLDWAR_NR_REVOKE_TITLE:0 "Withdraw Nuclear Ultimatum"
 COLDWAR_NR_REVOKE_ACTION_DESC:0 "Withdraw our final ultimatum and nuclear release authority.\n\n§YFurther launches outside an existing war:§! Cancelled\nCurrent national readiness remains in force.\nOperations already underway remain committed.\nThe 90-day ultimatum cooling-off period remains in force. Political power and tension already incurred are not refunded."
