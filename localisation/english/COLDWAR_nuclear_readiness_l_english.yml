 COLDWAR_nr_shelter_none:0 "§RNo public shelters.§! Build Civilian Shelters to enable mobilisation."
 COLDWAR_nr_shelter_tt:0 "§YPublic shelters§!\nShelter places: §Y[?COLDWAR_nr_shelter_places_m|2]M§!\nPopulation: §Y[?COLDWAR_nr_population_m|2]M§!\nNational coverage: §Y[?COLDWAR_nr_shelter_cover_pct|1]%§!\nShelter use: §Y[?COLDWAR_nr_shelter_use_pct|0]%§!\n[COLDWAR_nr_hardened_L]\n\nEach §YCivilian Shelter§! level holds §Y250,000§! people. Coverage in a struck state is its shelter places divided by its population.\n\n§YShelter use§!\nRoutine readiness: §Y35%§!\nAt war, in a nuclear confrontation or at Reinforced Readiness and above: §Y60%§!\nCivil defence mobilised: §Y100%§!\n\n§YProtection of sheltered people§!\nTactical operation: §G90%§!\nState operation: §G75%§!\nStrategic operation: §G60%§!\nHardened Shelters: §G+10%§! (maximum 95%)"
 COLDWAR_nr_hardened_yes:0 "Hardened Shelters: §Gin force§!"
 COLDWAR_nr_hardened_no:0 "Hardened Shelters: §Ynone§!"
 COLDWAR_nr_hardened_shelters_tt:0 "§YHardened Shelters§!: protection of sheltered population against nuclear operations §G+10%§!."
 COLDWAR_nr_shelter_prog:0 "Shelter Programme  £pol_power  50"
 COLDWAR_nr_shelter_prog_tt:0 "§YNational shelter programme§!\nCost: §Y50 political power§!\nDuration: §Y180 days§!\n§YCivilian Shelter§! construction speed: §G+60%§!\nConstruction speed: §R-4%§!"
 COLDWAR_nr_shelter_programme:0 "National Shelter Programme"
 COLDWAR_nr_shelter_programme_desc:0 "Construction crews and municipal budgets are directed towards public shelters."
 modifier_production_speed_civilian_shelter_factor:0 "£construction_speed_texticon §Y$civilian_shelter$§! construction speed"
 modifier_production_speed_civilian_shelter_factor_desc:0 "Modifies the speed of $civilian_shelter$ construction."
 cw_nuclear.94.t:0 "Strategic Command Suspended"
 cw_nuclear.94.d:0 "The Game Controller has suspended the Strategic Command system. Readiness postures, civil defence mobilisations, shelter programmes, nuclear confrontations and ultimatums have been cancelled. Nuclear operations follow the standard rules until the system is restored."
 cw_nuclear.95.t:0 "Strategic Command Restored"
 cw_nuclear.95.d:0 "The Game Controller has restored the Strategic Command system. All governments start again at Routine Deterrence without alert fatigue. Civil defence and shelter programmes can be ordered again."
 COLDWAR_gc_nr_disable:0 "Suspend Strategic Command"
 COLDWAR_gc_nr_disable_desc:0 "Switch off nuclear readiness, civil defence and nuclear crisis diplomacy for all countries."
 COLDWAR_gc_nr_disable_tt:0 "§YAll countries:§!\nReadiness returns to §YRoutine Deterrence§!, alert fatigue to §Y0§!.\nCivil defence mobilisations and shelter programmes end.\nNuclear confrontations, offers and ultimatums are cancelled without tension changes.\nStrategic Command, the related diplomatic actions and the weekly upkeep are switched off.\nNuclear operations follow the standard rules. Civilian Shelters keep protecting without civil defence mobilisation.\nAll players are notified."
 COLDWAR_gc_nr_enable:0 "Restore Strategic Command"
 COLDWAR_gc_nr_enable_desc:0 "Switch nuclear readiness, civil defence and nuclear crisis diplomacy back on for all countries."
 COLDWAR_gc_nr_enable_tt:0 "§YAll countries:§!\nStrategic Command starts again at §YRoutine Deterrence§! with no alert fatigue.\nNuclear powers and player governments are initialised immediately.\nAll players are notified."

