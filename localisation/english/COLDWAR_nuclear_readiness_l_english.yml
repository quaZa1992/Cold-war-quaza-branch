 COLDWAR_nr_stock_tt:0 "§YMissiles in storage§!\nNuclear ballistic missiles and intercontinental missiles held in the national stockpile. Deployed weapons remain under their assigned commands."
 COLDWAR_nr_ready_tt:0 "§YOperational allocation§!\nThe share of stored missiles assigned to immediate operations at the current readiness level. Required allocations: §Y1§! for a tactical raid, §Y20§! for a state raid and §Y200§! for a strategic raid. National doctrine and suitable delivery forces are also required."
 COLDWAR_nr_reserve_tt:0 "§YDispersed reserve§!\nThis share of the stored arsenal is protected from counterforce losses. An incoming tactical, state or strategic raid destroys respectively §Y5%§!, §Y15%§! or §Y40%§! of the remaining exposed stockpile."
 COLDWAR_nr_forces_label:0 "STRATEGIC FORCES / WEEK"
 COLDWAR_nr_forces_value:0 "$[?COLDWAR_nr_forces_weekly|3]B"
 COLDWAR_nr_civil_label:0 "CIVIL DEFENCE / WEEK"
 COLDWAR_nr_civil_value:0 "$[?COLDWAR_nr_civil_weekly|3]B"
 COLDWAR_nr_fatigue_label:0 "ALERT FATIGUE"
 COLDWAR_nr_fatigue_value:0 "[?COLDWAR_nr_fatigue|0] / 100"
 COLDWAR_nr_budget_tt:0 "§YWeekly strategic forces budget§!\nBase: §Y$0.002B§! plus §Y$0.00001B§! per stored missile, multiplied by readiness, fatigue, national wage levels and inflation.\nReadiness multipliers: §Y1 / 1.15 / 1.4 / 1.8 / 2.5§!.\nAlert fatigue adds up to §Y50%§! to this budget.\n\nCivil defence costs §Y$0.002B§! plus §Y0.002% of GDP§! per week, adjusted for inflation. Both expenses are included in the Defence Budget."
 COLDWAR_nr_fatigue_tt:0 "§YAlert fatigue§!\nDaily change:\nMaximum Readiness: §R+2§!\nStrategic Alert: §R+1§!\nReinforced Readiness: §R+0.25§!\nRoutine Deterrence / Increased Vigilance: §G-2§!\n\nAt 100 fatigue: §R-5 percentage points§! stability and §R+50%§! readiness costs. Fatigue recovers as forces stand down."
 COLDWAR_nr_civil_title:0 "03 / CIVIL DEFENCE"
 COLDWAR_nr_civil_inactive:0 "Emergency services at routine readiness."
 COLDWAR_nr_civil_preparing:0 "Shelter and emergency preparations: §Y[?COLDWAR_nr_civil_days|0] days§!."
 COLDWAR_nr_civil_active_text:0 "§GProtection active§!  |  Nuclear population losses §Y-20%§!."
 COLDWAR_nr_civil_start:0 "Mobilise  £pol_power  25"
 COLDWAR_nr_civil_stop:0 "Release Civil Defence"
 COLDWAR_nr_civil_tt:0 "§YCivil defence mobilisation§!\nCost: §Y25 political power§!\nPreparation: §Y3 days§!\nConstruction speed: §R-3%§!\nFactory output: §R-3%§!\n\nOnce preparations are complete, population losses from nuclear attacks are reduced by §G20%§! after existing shelter protection. Weekly funding begins when mobilisation is ordered."
 COLDWAR_nr_crisis_title:0 "04 / CRISIS COMMUNICATIONS"
 COLDWAR_nr_crisis_none:0 "No formal nuclear confrontation."
 COLDWAR_nr_crisis_partner:0 "Counterpart: §Y[?COLDWAR_nr_opponent.GetNameDef]§!"
 COLDWAR_nr_crisis_hotline:0 "§GDirect channel established§!  |  Mutual stand-down available."
 COLDWAR_nr_crisis_no_hotline:0 "Direct communications have not been agreed."
 COLDWAR_nr_crisis_hint:0 "Warnings, intelligence assessments and negotiations are available through diplomacy."
 COLDWAR_nr_consult:0 "Consult Allies  £pol_power  20"
 COLDWAR_nr_consult_tt:0 "§YUrgent allied consultations§!\nCost: §Y20 political power§!\nBrief allied player governments on the current confrontation.\nAvailable once every §Y30 days§!."
 COLDWAR_nr_order_pending:0 "Readiness order in progress: §Y[?COLDWAR_nr_build_days|0] days§!."
 COLDWAR_nr_order_none:0 "Readiness orders: 25 political power  |  2 days per level raised."
 COLDWAR_nr_cancel_order:0 "Cancel Preparations"
 COLDWAR_nr_cancel_tt:0 "Cancel the outstanding readiness order. The current posture remains in force. Political power is not refunded."
 COLDWAR_nr_footer:0 "READINESS  |  DETERRENCE  |  DIRECT COMMUNICATIONS"
 COLDWAR_nr_ai_reason:0 "Crisis communications"
 COLDWAR_nr_tt_ultimatum:0 "Requires an active nuclear confrontation, Maximum Readiness with preparations complete, offensive nuclear policy and a doctrine permitting first use. Both governments must be independent, at peace with each other and outside the same faction, with no non-aggression pact. No agreed stand-down or 90-day ultimatum cooling-off period may be in force."
 COLDWAR_nr_tt_revoke:0 "Our final ultimatum or nuclear release authority against this government is still in force."
 COLDWAR_nr_tt_prepare_first_use:0 "Requires war with this government or a final nuclear ultimatum at Maximum Readiness. The target must be outside our faction, outside our own subjects and not protected by a non-aggression pact."
 COLDWAR_nr_tt_launch_first_use:0 "Requires war with this government or valid nuclear release authority after the 72-hour ultimatum. Operations outside an existing war require Maximum Readiness and an eligible crisis counterpart. National employment doctrine still applies."
 COLDWAR_nr_ultimatum_send:0 "Deliver a final nuclear ultimatum to this government.\n\n§YCost:§! 100 political power\n§YUltimatum:§! 72 hours\n§YNuclear release authority after expiry:§! 7 days\n§YCold War tension:§! §R+5§!\n§YWorld tension:§! §R+2§!\n§YFurther ultimatums:§! 90-day cooling-off period\n\nNuclear operations require a separate military order. The first operation opens war, including an intercepted or unsuccessful attack.\n§YAdditional consequences on execution:§!\n§R+20§! Cold War tension; §R+10§! world tension.\n§R-5%§! stability.\nForeign opinion: §R-100§! for §Y365 days§!.\nA mutual stand-down cancels release authority. Withdrawing authority prevents further launches; operations already underway remain committed."
 COLDWAR_nr_ultimatum_receive:0 "Our government has received a final nuclear ultimatum.\n\n§YUltimatum:§! 72 hours\n§YRelease authority after expiry:§! 7 days\nNuclear operations can open war without a prior declaration. Direct communications and a mutual stand-down remain available."
 COLDWAR_nr_ultimatum_accept_title:0 "Final Ultimatum Delivered"
 COLDWAR_nr_ultimatum_accept:0 "The final ultimatum has been delivered. The cabinet will review nuclear release authority after 72 hours."
 COLDWAR_nr_revoke_send:0 "Withdraw our final ultimatum and nuclear release authority.\n\n§YFurther launches outside an existing war:§! Cancelled\nCurrent national readiness remains in force.\nOperations already underway remain committed.\nThe 90-day ultimatum cooling-off period remains in force. Political power and tension already incurred are not refunded."
 COLDWAR_nr_revoke_receive:0 "The final nuclear ultimatum and associated release authority have been withdrawn. Current readiness remains under national control."
 COLDWAR_nr_revoke_accept_title:0 "Release Authority Withdrawn"
 COLDWAR_nr_revoke_accept:0 "The cabinet has withdrawn its final ultimatum and nuclear release authority. Existing readiness orders remain in force."
 COLDWAR_nr_ultimatum_threat:0 "Final Nuclear Ultimatum"
 COLDWAR_nr_first_use_threat:0 "Nuclear First Use Opens Hostilities"
 COLDWAR_nr_first_use_condemnation:0 "Nuclear First Use"
 COLDWAR_nr_fu_waiting_text:0 "§RFinal ultimatum: [?COLDWAR_nr_fu_hours|0] hours remaining§!"
 COLDWAR_nr_fu_authorised_text:0 "§RNuclear release authority: [?COLDWAR_nr_fu_hours|0] hours remaining§!"
 COLDWAR_nr_fu_incoming_text:0 "§RForeign final ultimatum: [?COLDWAR_nr_fu_incoming_hours|0] hours remaining§!"
 COLDWAR_nr_fu_foreign_release_text:0 "§RForeign nuclear release authority: [?COLDWAR_nr_fu_incoming_hours|0] hours remaining§!"
 COLDWAR_nr_fu_both_text:0 "§RBoth governments have issued nuclear ultimatums or release orders.§!"
 COLDWAR_nr_fu_none_text:0 "No final nuclear ultimatum or release authority is in force."
 COLDWAR_nr_escalation_tt:0 "§YNuclear escalation§!\n\n§YOur government:§! [COLDWAR_nr_fu_own_status_L]\n§YOur counterpart:§! [COLDWAR_nr_fu_peer_status_L]\n\nUltimatums last §Y72 hours§!, followed by §Y7 days§! of release authority. A separate military order is required. A mutual stand-down cancels both governments' release authority. Operations already underway remain committed."
