l_english:
 # IMPERIA COLD WAR — Reversible Soviet and post-Soviet party registers.
 # IMPERIA COLD WAR — The Unbreakable Union (localisation)
 COLDWAR_SU.101.a: "Interesting."
 COLDWAR_SU.101.d: "Western correspondents in Moscow report a growing flood of typewritten pamphlets and banned novels in Soviet universities and factories. Several writers were reportedly questioned by the KGB this week."
 COLDWAR_SU.101.t: "Underground Press Spreads in the Soviet Union"
 COLDWAR_SU.102.a: "Interesting."
 COLDWAR_SU.102.d: "Hundreds of Soviet citizens who were refused exit visas held a silent protest in Moscow. In Washington, senators call for trade with the Soviet Union to be tied to free emigration."
 COLDWAR_SU.102.t: "Soviet Jews Denied the Right to Leave"
 COLDWAR_SU.103.a: "Interesting."
 COLDWAR_SU.103.d: "Shops across the Soviet Union have run out of meat, sugar and other basic goods. Prices on the kolkhoz markets are said to be several times the official ones."
 COLDWAR_SU.103.t: "Severe Shortages Across the Soviet Union"
 COLDWAR_SU.104.a: "Interesting."
 COLDWAR_SU.104.d: "Reports reaching the West describe a strike at a large Soviet plant over new work norms and food prices. Workers marched to the local party headquarters."
 COLDWAR_SU.104.t: "Strike at a Soviet Locomotive Plant"
 COLDWAR_SU.105.a: "Interesting."
 COLDWAR_SU.105.d: "Families in several Soviet cities have buried soldiers in sealed coffins. The official press still speaks of an international duty, but the number of graves keeps growing."
 COLDWAR_SU.105.t: "Soviet Losses Can No Longer Be Hidden"
 COLDWAR_SU.106.a: "Interesting."
 COLDWAR_SU.106.d: "Hundreds of thousands of coal miners in Siberia and Ukraine have stopped work. Their committees demand soap, food and the right to run their own mines."
 COLDWAR_SU.106.t: "Miners' Strike Spreads Across the Soviet Union"
 COLDWAR_SU.107.a: "Interesting."
 COLDWAR_SU.107.d: "Thousands of young people marched through Kaunas after the funeral of a student who burned himself in protest. Soviet troops were sent to the city."
 COLDWAR_SU.107.t: "Youth Protests in Lithuania"
 COLDWAR_SU.108.a: "Interesting."
 COLDWAR_SU.108.d: "Thousands of students have protested against the removal of their language from the constitution of their republic. Such open defiance of Moscow is rare."
 COLDWAR_SU.108.t: "Language Protest in a Soviet Republic"
 COLDWAR_SU.109.a: "Interesting."
 COLDWAR_SU.109.d: "Unrest has been reported in a Central Asian capital after Moscow replaced the local party leader. Students clashed with police on the main square."
 COLDWAR_SU.109.t: "Riots in Central Asia"
 COLDWAR_SU.110.a: "Interesting."
 COLDWAR_SU.110.d: "The dispute over Nagorno-Karabakh has turned violent. Moscow has sent troops of the Interior Ministry to separate the two Soviet republics."
 COLDWAR_SU.110.t: "Armenians and Azerbaijanis Clash Over Karabakh"
 COLDWAR_SU.111.a: "Interesting."
 COLDWAR_SU.111.d: "Armed supporters of General Dzhokhar Dudayev have taken power in Grozny and proclaimed an independent Chechen Republic of Ichkeria. Soviet troops in the city are surrounded."
 COLDWAR_SU.111.t: "Chechnya Declares Independence"
 COLDWAR_SU.112.a: "Interesting."
 COLDWAR_SU.112.d: "Mass movements for reform and sovereignty have been founded in several Soviet republics. Their congresses fill the largest halls of the capitals."
 COLDWAR_SU.112.t: "Popular Fronts Founded in Soviet Republics"
 COLDWAR_SU.113.a: "Interesting."
 COLDWAR_SU.113.d: "A human chain of about two million people has stretched across Estonia, Latvia and Lithuania, on the anniversary of the 1939 pact between Hitler and Stalin."
 COLDWAR_SU.113.t: "Two Million Join Hands in the Baltic"
 COLDWAR_SU.115.a: "Interesting."
 COLDWAR_SU.115.d: "A letter published in a Soviet newspaper has exposed a deep split in the Communist Party between reformers and conservatives."
 COLDWAR_SU.115.t: "An Open Letter Divides the Soviet Party"
 COLDWAR_SU.18.a: "Stand with Moscow."
 COLDWAR_SU.18.b: "Stand with our people."
 COLDWAR_SU.18.d: "The unrest in our republic has reached the Kremlin. Moscow wants to know whether our leadership stands with the Union or with its own people."
 COLDWAR_SU.18.t: "Moscow Asks Where We Stand"
 COLDWAR_SU.19.a: "Interesting."
 COLDWAR_SU.19.d: "Western newspapers publish the names of Soviet dissidents who were taken to psychiatric hospitals and labour camps in recent weeks. Several of them have not been seen since. Human rights groups call for sanctions."
 COLDWAR_SU.19.t: "Dissidents Vanish in the Soviet Union"
 COLDWAR_SU.201.a: "We must answer this."
 COLDWAR_SU.201.d: "Typewritten copies of Solzhenitsyn, the Chronicle of Current Events and foreign radio transcripts pass from hand to hand in the institutes and factories. The KGB counts thousands of copies."
 COLDWAR_SU.201.t: "Samizdat in Circulation"
 COLDWAR_SU.202.a: "We must answer this."
 COLDWAR_SU.202.d: "Thousands of Soviet Jews have applied to emigrate to Israel and been refused. They lose their jobs, hold hunger strikes and talk to Western journalists. The American Congress links trade to the right to emigrate."
 COLDWAR_SU.202.t: "The Refuseniks"
 COLDWAR_SU.203.a: "We must answer this."
 COLDWAR_SU.203.d: "Meat, sugar and washing powder have vanished from the state shops. Queues form before dawn and the kolkhoz markets set the real prices."
 COLDWAR_SU.203.t: "Empty Shelves"
 COLDWAR_SU.204.a: "We must answer this."
 COLDWAR_SU.204.d: "Workers of a large locomotive plant have downed tools over new work norms and higher meat prices. They march to the party building of the city. Other plants are watching."
 COLDWAR_SU.204.t: "Wildcat Strike"
 COLDWAR_SU.205.a: "We must answer this."
 COLDWAR_SU.205.d: "Sealed zinc coffins come home from the front. The families may not open them, and the gravestones may not say where the sons died."
 COLDWAR_SU.205.t: "Zinc Coffins"
 COLDWAR_SU.206.a: "We must answer this."
 COLDWAR_SU.206.d: "The miners of the Kuzbass and the Donbass have stopped work. They have no soap, no meat and no patience left, and their strike committees now speak of politics."
 COLDWAR_SU.206.t: "The Miners Rise"
 COLDWAR_SU.207.a: "We must answer this."
 COLDWAR_SU.207.d: "A student has burned himself in a park in Kaunas in protest against the occupation. At his funeral thousands of young people march through the city and shout for freedom."
 COLDWAR_SU.207.t: "Spring in Kaunas"
 COLDWAR_SU.208.a: "We must answer this."
 COLDWAR_SU.208.d: "The new constitution of the republic drops the clause that makes the national language the state language. Students fill the main avenue of the capital and refuse to leave."
 COLDWAR_SU.208.t: "The Language Protest"
 COLDWAR_SU.209.a: "We must answer this."
 COLDWAR_SU.209.d: "Moscow has replaced the long serving first secretary of the republic with a Russian who has never lived there. Students gather on the main square in the frost."
 COLDWAR_SU.209.t: "December in Alma-Ata"
 COLDWAR_SU.210.a: "We must answer this."
 COLDWAR_SU.210.d: "The soviet of Nagorno-Karabakh has voted to join Armenia. In Yerevan hundreds of thousands march, in Sumgait a mob attacks Armenian families. Two Union republics turn against each other."
 COLDWAR_SU.210.t: "Karabakh"
 COLDWAR_SU.211.a: "We must answer this."
 COLDWAR_SU.211.d: "General Dudayev's National Congress of the Chechen People has stormed the Supreme Soviet in Grozny. Armed men guard the television centre, and the arsenals of the Soviet garrison are surrounded. The congress speaks of an independent Ichkeria."
 COLDWAR_SU.211.t: "The Chechen Revolution"
 COLDWAR_SU.212.a: "We must answer this."
 COLDWAR_SU.212.d: "Writers, scientists and even party members have founded a Popular Front in support of reform. Within weeks it has more members than the party of the republic."
 COLDWAR_SU.212.t: "The Popular Fronts"
 COLDWAR_SU.213.a: "We must answer this."
 COLDWAR_SU.213.d: "Two million people join hands from Tallinn through Riga to Vilnius, on the anniversary of the secret protocol of 1939. The whole world watches."
 COLDWAR_SU.213.t: "The Human Chain"
 COLDWAR_SU.214.a: "We must answer this."
 COLDWAR_SU.214.d: "The General Staff complains in closed letters that the party starves the army. Marshals speak of the betrayal of the soldiers."
 COLDWAR_SU.214.t: "The Generals Grumble"
 COLDWAR_SU.215.a: "We must answer this."
 COLDWAR_SU.215.d: "A teacher from Leningrad has written an open letter: I cannot give up my principles. Half of the apparatus applauds, the other half calls it a manifesto against the line."
 COLDWAR_SU.215.t: "A Letter to the Party"
 COLDWAR_SU.216.a: "We must answer this."
 COLDWAR_SU.216.d: "The new General Secretary sits in the chair, but not yet on the throne. Every member of the Politburo counts his votes in the Central Committee."
 COLDWAR_SU.216.t: "The Succession Struggle"
 COLDWAR_SU.217.a: "We must answer this."
 COLDWAR_SU.217.d: "KGB reports speak of meetings in dachas outside Moscow: marshals, ministers and secretaries of the Central Committee. Someone is preparing to remove the General Secretary."
 COLDWAR_SU.217.t: "The Plot"
 COLDWAR_SU.30.a: "The Union must be saved."
 COLDWAR_SU.30.d: "The reports of the KGB, the Central Committee and the ministries say the same thing: the Union is in its deepest crisis since the war. Two of our three pillars are cracking."
 COLDWAR_SU.30.t: "The Time of Troubles"
 COLDWAR_SU.31.a: "We were lucky."
 COLDWAR_SU.31.d: "The worst is over, for now. The shops have bread, the republics are calm and the Politburo speaks with one voice again."
 COLDWAR_SU.31.t: "The Crisis Recedes"
 COLDWAR_SU.40.a: "A new treaty for the Union."
 COLDWAR_SU.40.b: "The state of emergency."
 COLDWAR_SU.40.c: "Russia first."
 COLDWAR_SU.40.d: "Two of the three pillars of the Union have broken at once. There is no time left for congresses and plenums. The leadership must choose a way out tonight."
 COLDWAR_SU.40.t: "The Union at the Brink"
 COLDWAR_SU.400.a: "We will march on."
 COLDWAR_SU.400.d: "The tankers from Nakhodka no longer come. Moscow wants hard currency for its oil, and we have none. The power stations go dark one by one."
 COLDWAR_SU.400.t: "The Soviet Oil Stops"
 COLDWAR_SU.401.a: "We will march on."
 COLDWAR_SU.401.d: "Without Soviet oil there is no fertiliser and no diesel for the tractors. The cooperative farms bring in half of last year's harvest."
 COLDWAR_SU.401.t: "The Fertiliser Runs Out"
 COLDWAR_SU.402.a: "We will march on."
 COLDWAR_SU.402.d: "The Public Distribution System no longer delivers rice and maize to the cities. Workers are told to find food for themselves."
 COLDWAR_SU.402.t: "The Rations Stop"
 COLDWAR_SU.403.a: "We will march on."
 COLDWAR_SU.403.d: "Torrential rains wash away the terraced fields on the hillsides and flood the grain stores. The famine reaches every province."
 COLDWAR_SU.403.t: "The Great Floods"
 COLDWAR_SU.41.a: "Back the Committee."
 COLDWAR_SU.41.b: "Stand against the coup."
 COLDWAR_SU.41.d: "While the General Secretary is on holiday in the Crimea, the chairman of the KGB, the defence minister and the vice president form a State Committee for the State of Emergency. They want the treaty stopped. The tanks are rolling into Moscow. Where do we stand?"
 COLDWAR_SU.41.t: "The August Coup"
 COLDWAR_SU.410.a: "Send the grain."
 COLDWAR_SU.410.b: "Not for this regime."
 COLDWAR_SU.410.d: "Pyongyang has asked the World Food Programme for help. Millions are starving, but the regime refuses to say how many. Food aid would save lives and open a closed country a little."
 COLDWAR_SU.410.t: "Famine in North Korea"
 COLDWAR_SU.411.a: "Help our neighbour."
 COLDWAR_SU.411.b: "They must help themselves."
 COLDWAR_SU.411.d: "North Korea is starving. Its leadership asks us for rice, oil and credit, and promises closer ties in return."
 COLDWAR_SU.411.t: "Pyongyang Asks for a Lifeline"
 COLDWAR_SU.412.a: "Ask again."
 COLDWAR_SU.412.b: "We will do without."
 COLDWAR_SU.412.d: "The last ships of last year's aid have been unloaded. The famine is not over. We can ask again, and swallow our pride once more."
 COLDWAR_SU.412.t: "The Aid Runs Out"
 COLDWAR_SU.50.a: "We will see."
 COLDWAR_SU.50.d: "The leadership in Moscow has admitted that the Union is in crisis. In our capital people talk openly about what this means for us."
 COLDWAR_SU.50.t: "Moscow Is Weak"
 COLDWAR_SU.51.a: "Hold the vote."
 COLDWAR_SU.51.b: "Boycott it."
 COLDWAR_SU.51.d: "Moscow asks whether our citizens should vote on the preservation of the Union as a renewed federation of equal sovereign republics."
 COLDWAR_SU.51.t: "The Referendum on the Union"
 COLDWAR_SU.53.a: "Sign the treaty."
 COLDWAR_SU.53.b: "Leave the Union."
 COLDWAR_SU.53.d: "The new Union Treaty lies ready in the Kremlin. We may sign it and stay in the renewed Union, or refuse and leave in peace."
 COLDWAR_SU.53.t: "The Union Treaty"
 COLDWAR_SU.55.a: "Submit."
 COLDWAR_SU.55.b: "Resist."
 COLDWAR_SU.55.d: "Soviet paratroopers have landed at our airport. The Committee in Moscow demands that our leadership submits to the State of Emergency."
 COLDWAR_SU.55.t: "Submit or Resist"
 COLDWAR_SU.57.a: "Let them go."
 COLDWAR_SU.57.b: "Send in the army."
 COLDWAR_SU.57.d: "[From.GetNameDefCap] has declared that it no longer recognises the Committee and has left the Union."
 COLDWAR_SU.57.t: "[From.GetNameDefCap] Resists"
 COLDWAR_SU.58.a: "Declare independence."
 COLDWAR_SU.58.b: "Stay in the Union."
 COLDWAR_SU.58.d: "Moscow no longer holds anybody. Our republic may declare its independence and leave the Union in peace, or stay."
 COLDWAR_SU.58.t: "The Republics' Choice"
 COLDWAR_SU.60.a: "Join the Commonwealth."
 COLDWAR_SU.60.b: "Decline."
 COLDWAR_SU.60.d: "Moscow invites all former Soviet republics to a Commonwealth of Independent States: open trade, joint transport, and a common defence for those who want it."
 COLDWAR_SU.60.t: "The Commonwealth of Independent States"
 COLDWAR_SU.600.a: "Fly in the aid."
 COLDWAR_SU.600.b: "They must help themselves."
 COLDWAR_SU.600.d: "The new Russia asks for food and medicine to get its cities through the winter. Our army has the stocks and the aircraft."
 COLDWAR_SU.600.t: "Food for Russia"
 COLDWAR_SU.602.a: "Fund it."
 COLDWAR_SU.602.b: "Not with our money."
 COLDWAR_SU.602.d: "The Russian government asks for money to guard, transport and dismantle the warheads of the former Soviet Union. Our senators call it the cheapest defence programme in history."
 COLDWAR_SU.602.t: "Securing the Soviet Arsenal"
 COLDWAR_SU.604.a: "Join the Union State."
 COLDWAR_SU.604.b: "We stay independent."
 COLDWAR_SU.604.d: "Moscow proposes a Union State: common customs, cheap energy, a common army command and one day a common president."
 COLDWAR_SU.604.t: "A Union State with Russia"
 COLDWAR_SU.606.a: "Lend the money."
 COLDWAR_SU.606.b: "Reform first, money later."
 COLDWAR_SU.606.d: "The President of the Soviet Union asks the seven for credits to save his reform. Without them, his advisers say, the Union will fall back into the hands of the hardliners."
 COLDWAR_SU.606.t: "Credits for Moscow"
 COLDWAR_SU.608.a: "Sign the treaty."
 COLDWAR_SU.608.b: "We do not trust Moscow."
 COLDWAR_SU.608.d: "Moscow is ready to sign: a third of the strategic arsenals of both sides will be destroyed under mutual inspection."
 COLDWAR_SU.608.t: "The Strategic Arms Reduction Treaty"
 COLDWAR_SU.62.a: "Take our share of the fleet."
 COLDWAR_SU.62.b: "Lease everything to Russia."
 COLDWAR_SU.62.d: "Moscow proposes to divide the Black Sea Fleet: a share of the ships for us, and the base in Sevastopol leased to Russia."
 COLDWAR_SU.62.t: "The Black Sea Fleet"
 COLDWAR_SU.70.a: "Interesting."
 COLDWAR_SU.70.d: "Soviet radio and television announce that a State Committee for the State of Emergency has taken power. Tanks are in the streets of Moscow, the General Secretary is said to be ill, and all newspapers except those of the party have been closed."
 COLDWAR_SU.70.t: "The State Committee Takes Power in Moscow"
 COLDWAR_SU.71.a: "[COLDWAR_SU_GetUnionEndOption]"
 COLDWAR_SU.71.d: "[COLDWAR_SU_GetUnionEndDesc]"
 COLDWAR_SU.71.t: "[COLDWAR_SU_GetUnionEndTitle]"
 COLDWAR_SU.72.a: "It is over."
 COLDWAR_SU.72.d: "Most of the republics have gone. What is left of the Union cannot pretend any longer: the Soviet Union has ceased to exist, without a treaty and without a plan."
 COLDWAR_SU.72.t: "The Union Dissolves"
 COLDWAR_SU.73.a: "[COLDWAR_SU_GetShockOption]"
 COLDWAR_SU.73.d: "[COLDWAR_SU_GetShockDesc]"
 COLDWAR_SU.73.t: "[COLDWAR_SU_GetShockTitle]"
 COLDWAR_SU.74.a: "Interesting."
 COLDWAR_SU.74.d: "[From.GetNameDefCap] has left the Soviet Union. Its new flag flies over the parliament, and its leaders speak of a new chapter in the history of the nation."
 COLDWAR_SU.74.t: "[From.GetNameDefCap] Leaves the Soviet Union"
 COLDWAR_SU.76.a: "Restore constitutional order."
 COLDWAR_SU.76.b: "Not now."
 COLDWAR_SU.76.d: "Grozny is in the hands of Dudayev's guards. They hold the arsenals of our garrison, and the mountains are full of armed men. The ministers promise that one airborne regiment can take the city in two hours."
 COLDWAR_SU.76.t: "Ichkeria Has Declared Independence"
 COLDWAR_SU.77.a: "Interesting."
 COLDWAR_SU.77.d: "The Chechen Republic of Ichkeria has declared its independence from Moscow. Its fighters have seized the weapons of the Soviet garrison in Grozny and dug in across the mountains of the North Caucasus."
 COLDWAR_SU.77.t: "Ichkeria Proclaims Its Independence"
 COLDWAR_SU.80.a: "Sign the treaty."
 COLDWAR_SU.80.b: "Refuse."
 COLDWAR_SU.80.d: "Moscow proposes a new treaty on the limitation of strategic arms. If we sign, both sides slow down the arms race."
 COLDWAR_SU.80.t: "The Soviets Propose Arms Control"
 COLDWAR_SU.84.a: "Help Russia."
 COLDWAR_SU.84.b: "Not now."
 COLDWAR_SU.84.d: "The new Russia asks for credits, food aid and a partnership with the West."
 COLDWAR_SU.84.t: "Russia Asks for a Partnership"
 COLDWAR_SU.86.a: "Back the package."
 COLDWAR_SU.86.b: "Let them default."
 COLDWAR_SU.86.d: "Russia cannot pay its debts. The Fund is ready to lend, if we stand behind it."
 COLDWAR_SU.86.t: "The IMF Package for Russia"
 COLDWAR_SU.90.a: "Accept the partnership."
 COLDWAR_SU.90.b: "Refuse."
 COLDWAR_SU.90.d: "The Committee in Moscow proposes an end to the old quarrel: a strategic partnership of the two communist great powers."
 COLDWAR_SU.90.t: "Moscow Proposes a Strategic Partnership"
 COLDWAR_SU.92.a: "Guarantee its borders."
 COLDWAR_SU.92.b: "Words only."
 COLDWAR_SU.92.d: "[From.GetNameDefCap] will give up the Soviet warheads on its soil if the great powers guarantee its borders."
 COLDWAR_SU.92.t: "Security Assurances for [From.GetNameDef]"
 COLDWAR_SU.94.a: "Welcome them."
 COLDWAR_SU.94.b: "Not yet."
 COLDWAR_SU.94.d: "[From.GetNameDefCap] asks for a place in the Western institutions and for our protection."
 COLDWAR_SU.94.t: "[From.GetNameDefCap] Asks to Return to Europe"
 COLDWAR_SU.96.a: "Welcome them."
 COLDWAR_SU.96.b: "We cannot afford it."
 COLDWAR_SU.96.d: "[From.GetNameDefCap] wants to stay close to Russia: trade, energy and our bases."
 COLDWAR_SU.96.t: "[From.GetNameDefCap] Joins the Commonwealth"
 COLDWAR_SU.97.a: "Good."
 COLDWAR_SU.97.d: "[From.GetNameDefCap] has accepted our proposal."
 COLDWAR_SU.97.t: "[From.GetNameDefCap] Accepts"
 COLDWAR_SU.98.a: "So be it."
 COLDWAR_SU.98.d: "[From.GetNameDefCap] has refused our proposal."
 COLDWAR_SU.98.t: "[From.GetNameDefCap] Refuses"
 COLDWAR_SU_B_C1: "Local Barons"
 COLDWAR_SU_B_C1_TT: "The first secretaries of the republics keep their posts.\nCentral Asia §G-0.10§!, the Caucasus §G-0.05§! per month\nCorruption rises one level\nCost: §Y75§! Political Power"
 COLDWAR_SU_B_C2: "Moscow's Men"
 COLDWAR_SU_B_C2_TT: "Moscow sends its own people to the republics.\nCentral Asia §R+0.15§! per month\nCorruption falls one level\nCost: §Y75§! Political Power"
 COLDWAR_SU_B_I1: "Glasnost"
 COLDWAR_SU_B_I1_TT: "The people may speak.\nThe People: §G-0.20§! per month\nResearch Speed: §G+6%§!\nWestern broadcasters: §R×1§!\nThe Baltic §R+0.15§!, the Caucasus §R+0.10§!, the Western Republics and Central Asia §R+0.05§! per month\nThe Elite: §R+0.10§! per month\n§RFrom Managed: 20% chance of a Spark§!\nCost: §Y1.5%§! of GDP"
 COLDWAR_SU_B_I2: "Managed"
 COLDWAR_SU_B_I2_TT: "Jamming and censorship.\nWestern broadcasters: §G×0.6§!\n§RFrom Sealed: 15% chance of a Spark§!\nCost: §Y1.5%§! of GDP"
 COLDWAR_SU_B_I3: "Sealed"
 COLDWAR_SU_B_I3_TT: "The Union is closed.\nWestern broadcasters: §G×0.3§!\nForeign campaigns: §G×0.2§!\nCost: §Y1.5%§! of GDP"
 COLDWAR_SU_B_N1: "Russification"
 COLDWAR_SU_B_N1_TT: "Russian in every school, Russians in every plant.\nUnion Cohesion: §G+0.3§! per month\nThe Baltic and the Caucasus §R+0.10§!, the Western Republics §R+0.05§! per month\nCost: §Y75§! Political Power"
 COLDWAR_SU_B_N2: "Balance"
 COLDWAR_SU_B_N2_TT: "Moscow keeps the old balance between the nations.\nCost: §Y75§! Political Power"
 COLDWAR_SU_B_N3: "Indigenisation"
 COLDWAR_SU_B_N3_TT: "Local cadres and the national languages first.\nEvery region §G-0.10§! per month\nUnion Cohesion: §R-0.2§! per month\nThe Elite: §R+0.05§! per month\nCost: §Y75§! Political Power"
 COLDWAR_SU_B_S1: "Thaw"
 COLDWAR_SU_B_S1_TT: "Censorship eased, critics tolerated.\nThe People: §G-0.6%§! of the value per month, but Pressure §Rreturns§! as anger (up to §R0.25§! per month)\nThe regions: §G-0.6%§! per month\nForeign campaigns: §R×1.25§!\nCost: §Y1%§! of GDP"
 COLDWAR_SU_B_S2: "Normalisation"
 COLDWAR_SU_B_S2_TT: "Steady police control.\n§Y1%§! of the People and of every region per month is moved to Pressure (§Y70%§! and §Y35%§! of it arrive)\nCost: §Y1%§! of GDP"
 COLDWAR_SU_B_S3: "Hard Line"
 COLDWAR_SU_B_S3_TT: "Arrests and informers.\n§Y2.4%§! of the People and of every region per month is moved to Pressure (§R75%§! and §R37.5%§! of it arrive)\nCost: §Y1%§! of GDP"
 COLDWAR_SU_CAMP_ELITE: "The Elite"
 COLDWAR_SU_CAMP_ELITE_TT: "§YThe Elite§!: party, KGB, army and defence industry.\nLevels: Collective Leadership, Corridor Intrigue, Open Factions, Plotting, Conspiracy.\nFrom 60 the Politburo Balance drifts to its edge. From 80 The Plot can start."
 COLDWAR_SU_CAMP_PEOPLE: "The People"
 COLDWAR_SU_CAMP_PEOPLES: "The Peoples"
 COLDWAR_SU_CAMP_PEOPLES_TT: "§YThe Peoples§!: the four regions of the Union republics, weighted by population.\nLevels: Friendship of Peoples, Quiet Resentment, National Awakening, Popular Fronts, Parade of Sovereignties.\nFrom 60 Union Cohesion falls by §R0.5§! per month, from 80 by §R1§!."
 COLDWAR_SU_CAMP_PEOPLE_TT: "§YThe People§!: Russia and the cities. Work, cheap bread and a flat in return for quiet.\nLevels: Quiet Patience, Grumbling in the Queues, Kitchen-Table Anger, Strikes and Riots, Revolutionary Situation.\nFrom 40: Stability and Civilian Factory Productivity fall. From 60: Factory Output and Tax Revenue fall."
 COLDWAR_SU_COH: "Union Cohesion: §Y[?COLDWAR_SOV_union_cohesion|0]§!   ·   Politburo Balance: §Y[?COLDWAR_SOV_bop|2]§!"
 COLDWAR_SU_COH_TT: "Union Cohesion below §Y35§!: every region §R+0.10§! per month, and the Time of Troubles opens."
 COLDWAR_SU_FROZEN: "§HFROZEN BY THE GAME CONTROLLER§!"
 COLDWAR_SU_PRESSURE: "Pressure"
 COLDWAR_SU_PRESSURE_TT: "Anger that was held down instead of solved. At §R95§! the lid blows: each month a §R25%§! chance of a civil war against the strongest opposition party.\nThe Thaw lets it out again, Normalisation and Hard Line fill it."
 COLDWAR_SU_REG_1: "The Baltic"
 COLDWAR_SU_REG_1_TT: "§YThe Baltic§! (EST, LAT, LIT)\nEvery month the region moves §Y5%§! of the way to the mean Unrest of its republics (now [?COLDWAR_SU_rssr1|0]).\nRussification §R+0.10§!, Indigenisation §G-0.10§!, Western broadcasters count twice, Industrial Migration §R+0.05§!, The Baltic Question §G-0.05§!, Glasnost §R+0.15§!\nAll regions: Union Cohesion below 35 §R+0.10§!, long wars and surrender §R+0.05§! to §R+0.15§!, volunteers of its republics §R+0.10§!."
 COLDWAR_SU_REG_2: "The Western Republics"
 COLDWAR_SU_REG_2_TT: "§YThe Western Republics§! (UKR, BLR, MLV)\nEvery month the region moves §Y5%§! of the way to the mean Unrest of its republics (now [?COLDWAR_SU_rssr2|0]).\nRussification §R+0.05§!, Indigenisation §G-0.10§!, Shelest's Ukraine §G-0.05§!, The Shcherbytsky Line §R+0.05§!, Glasnost §R+0.05§!\nAll regions: Union Cohesion below 35 §R+0.10§!, long wars and surrender §R+0.05§! to §R+0.15§!, volunteers of its republics §R+0.10§!."
 COLDWAR_SU_REG_3: "The Caucasus"
 COLDWAR_SU_REG_3_TT: "§YThe Caucasus§! (GEO, ARM, AZE)\nEvery month the region moves §Y5%§! of the way to the mean Unrest of its republics (now [?COLDWAR_SU_rssr3|0]).\nArmenia and Azerbaijan both at 40 Unrest §R+0.15§!, Russification §R+0.10§!, Indigenisation §G-0.10§!, deep corruption in the republics §R+0.05§!, Local Barons §G-0.05§!, Glasnost §R+0.10§!\nAll regions: Union Cohesion below 35 §R+0.10§!, long wars and surrender §R+0.05§! to §R+0.15§!, volunteers of its republics §R+0.10§!."
 COLDWAR_SU_REG_4: "Central Asia"
 COLDWAR_SU_REG_4_TT: "§YCentral Asia§! (KAZ, UZB, TRK, KYR, TAJ)\nEvery month the region moves §Y5%§! of the way to the mean Unrest of its republics (now [?COLDWAR_SU_rssr4|0]).\nLocal Barons §G-0.10§!, Moscow's Men §R+0.15§!, Indigenisation §G-0.10§!, the dying Aral Sea §R+0.05§!, Glasnost §R+0.05§!\nAll regions: Union Cohesion below 35 §R+0.10§!, long wars and surrender §R+0.05§! to §R+0.15§!, volunteers of its republics §R+0.10§!."
