 COLDWAR_SU_our_own_currency_desc: "A currency of our own, backed by our own gold and our own discipline."
 COLDWAR_SU_our_place_in_the_world: "Our Place in the World"
 COLDWAR_SU_our_place_in_the_world_desc: "A great power without an empire: what is Russia for?"
 COLDWAR_SU_partnership_with_the_west: "Partnership with the West"
 COLDWAR_SU_partnership_with_the_west_desc: "Russia asks for credits, food aid and a seat at the table. The foreign minister speaks of common values."
 COLDWAR_SU_partnership_with_the_west_fx_tt: "Army opinion: §R-10§!"
 COLDWAR_SU_party_landscape: "Party Register"
 COLDWAR_SU_party_landscape_desc: "Choose whether political organisations use their Soviet-era names or the names of the post-Soviet party landscape."
 COLDWAR_SU_pavlovs_plan: "Pavlov's Plan"
 COLDWAR_SU_pavlovs_plan_desc: "Prices are raised by decree, and fifty and hundred ruble notes are withdrawn overnight. The state gets its money, the people lose their savings."
 COLDWAR_SU_pavlovs_plan_fx_tt: "The People: §R+5§!\nThe Elite: §G-5§!"
 COLDWAR_SU_pavlovs_price_freeze: "Pavlov's Price Freeze"
 COLDWAR_SU_pavlovs_price_freeze_desc: "The premier freezes every price in the Union. The shops will stay empty, but at least nothing will cost more."
 COLDWAR_SU_peace_with_the_oligarchs: "Peace with the Oligarchs"
 COLDWAR_SU_peace_with_the_oligarchs_desc: "Their television stations will support the government, and the government will not ask where their money came from."
 COLDWAR_SU_permanent_neutrality: "Permanent Neutrality"
 COLDWAR_SU_permanent_neutrality_desc: "We belong to no bloc and no alliance. The United Nations recognise our neutrality."
 COLDWAR_SU_prepare_the_state_of_emergency: "Prepare the State of Emergency"
 COLDWAR_SU_prepare_the_state_of_emergency_desc: "In a KGB guest house the chairman of the KGB, the defence minister and the vice president draw up lists, decrees and the plan for the night."
 COLDWAR_SU_prepare_the_state_of_emergency_fx_tt: "The Elite: §G-10§!\nPressure: §R+10§!\nKGB opinion: §G+10§!\nArmy opinion: §G+10§!\nOpinion of the Western Bloc: §R-10§!"
 COLDWAR_SU_pressure_p10_tt: "Pressure: §R+10§!"
 COLDWAR_SU_print_the_rubles: "Print the Rubles"
 COLDWAR_SU_print_the_rubles_desc: "The Central Bank prints what the budget cannot pay. The wages arrive, and a month later they are worth half as much."
 COLDWAR_SU_provide_hope_tt: "§YThe United States§! decide whether to fly in food aid.\nIf they accept: they pay §R0.5%§! of their GDP, we get §YWestern Food Aid§! (Consumer Goods §G-4%§! for 1 year) and their opinion of us rises by §G10§!.\nIf they refuse: nothing happens."
 COLDWAR_SU_ps_albert_makashov_desc: "The general who ran for president of Russia against Yeltsin speaks the language of the barracks and of the hardliners."
 COLDWAR_SU_ps_alexander_lukashenko_ps_desc: "The collective farm director from Shklov became the first president of Belarus by fighting corruption. Now the Union State offers him a far bigger stage, and he means to use it."
 COLDWAR_SU_ps_alexander_lukashenko_us_desc: "Lukashenko governs like a collective farm chairman: firm prices, full shelves and no opposition. The Union State has made him a candidate for the Kremlin itself."
 COLDWAR_SU_ps_aman_tuleyev_desc: "The governor of the Kuzbass speaks for the miners and their families. He is a communist ally, but above all he is the master of his coal province."
 COLDWAR_SU_ps_anatoly_chubais_desc: "The architect of privatisation is the most hated man in Russia and the most capable. He believes the market will make Russians free, whether they like it or not."
 COLDWAR_SU_ps_anatoly_lukyanov_desc: "The chairman of the Supreme Soviet wrote poetry and the legal case for the emergency. He offers the Committee a parliamentary face."
 COLDWAR_SU_ps_arkady_volsky_desc: "The head of the Scientific-Industrial Union speaks for thirteen million workers of the great plants and for the directors who run them."
 COLDWAR_SU_ps_boris_berezovsky_desc: "Mathematician, car dealer and owner of the first channel, the most political of the oligarchs believes he can make presidents."
 COLDWAR_SU_ps_choose_albert_makashov: "Albert Makashov"
 COLDWAR_SU_ps_choose_albert_makashov_desc: "The general who ran for president of Russia against Yeltsin speaks the language of the barracks and of the hardliners."
 COLDWAR_SU_ps_choose_alexander_lukashenko_ps: "Alexander Lukashenko"
 COLDWAR_SU_ps_choose_alexander_lukashenko_ps_desc: "The collective farm director from Shklov became the first president of Belarus by fighting corruption. Now the Union State offers him a far bigger stage, and he means to use it."
 COLDWAR_SU_ps_choose_alexander_lukashenko_us: "Alexander Lukashenko"
 COLDWAR_SU_ps_choose_alexander_lukashenko_us_desc: "Lukashenko governs like a collective farm chairman: firm prices, full shelves and no opposition. The Union State has made him a candidate for the Kremlin itself."
 COLDWAR_SU_ps_choose_aman_tuleyev: "Aman Tuleyev"
 COLDWAR_SU_ps_choose_aman_tuleyev_desc: "The governor of the Kuzbass speaks for the miners and their families. He is a communist ally, but above all he is the master of his coal province."
 COLDWAR_SU_ps_choose_anatoly_chubais: "Anatoly Chubais"
 COLDWAR_SU_ps_choose_anatoly_chubais_desc: "The architect of privatisation is the most hated man in Russia and the most capable. He believes the market will make Russians free, whether they like it or not."
 COLDWAR_SU_ps_choose_anatoly_lukyanov: "Anatoly Lukyanov"
 COLDWAR_SU_ps_choose_anatoly_lukyanov_desc: "The chairman of the Supreme Soviet wrote poetry and the legal case for the emergency. He offers the Committee a parliamentary face."
 COLDWAR_SU_ps_choose_arkady_volsky: "Arkady Volsky"
 COLDWAR_SU_ps_choose_arkady_volsky_desc: "The head of the Scientific-Industrial Union speaks for thirteen million workers of the great plants and for the directors who run them."
 COLDWAR_SU_ps_choose_boris_berezovsky: "Boris Berezovsky"
 COLDWAR_SU_ps_choose_boris_berezovsky_desc: "Mathematician, car dealer and owner of the first channel, the most political of the oligarchs believes he can make presidents."
 COLDWAR_SU_ps_choose_dmitry_yazov: "Dmitry Yazov"
 COLDWAR_SU_ps_choose_dmitry_yazov_desc: "The last Marshal of the Soviet Union brought the tanks into Moscow. He is a soldier of the old school, loyal, stubborn and tired."
 COLDWAR_SU_ps_choose_eduard_limonov: "Eduard Limonov"
 COLDWAR_SU_ps_choose_eduard_limonov_desc: "Poet, provocateur and founder of the National Bolsheviks. His followers are young, angry and convinced that only a revolution can save Russia."
 COLDWAR_SU_ps_choose_eduard_shevardnadze: "Eduard Shevardnadze"
 COLDWAR_SU_ps_choose_eduard_shevardnadze_desc: "The foreign minister who ended the Cold War warned of a coming dictatorship and resigned. He returns as the conscience of the reformers."
 COLDWAR_SU_ps_choose_irina_khakamada: "Irina Khakamada"
 COLDWAR_SU_ps_choose_irina_khakamada_desc: "Entrepreneur, deputy and liberal, she speaks for the small businesses that the oligarchs and the bureaucrats crush between them."
 COLDWAR_SU_ps_choose_leonid_kravchuk: "Leonid Kravchuk"
 COLDWAR_SU_ps_choose_leonid_kravchuk_desc: "The former ideology secretary of Ukraine became its most skilful national politician. In a renewed Union he would speak for the second republic."
 COLDWAR_SU_ps_choose_mikhail_kasyanov: "Mikhail Kasyanov"
 COLDWAR_SU_ps_choose_mikhail_kasyanov_desc: "The finance ministry's negotiator with the foreign creditors knows every Western banker by name. He would govern like a careful accountant."
 COLDWAR_SU_ps_choose_mikhail_khodorkovsky: "Mikhail Khodorkovsky"
 COLDWAR_SU_ps_choose_mikhail_khodorkovsky_desc: "The Komsomol banker who bought Yukos for a fraction of its worth now wants to run his oil company, and perhaps the country, like a Western corporation."
 COLDWAR_SU_ps_choose_nursultan_nazarbayev: "Nursultan Nazarbayev"
 COLDWAR_SU_ps_choose_nursultan_nazarbayev_desc: "The President of Kazakhstan is the most pragmatic of the republican leaders. At Novo-Ogaryovo he was promised the premiership of the Union."
 COLDWAR_SU_ps_choose_oleg_baklanov: "Oleg Baklanov"
 COLDWAR_SU_ps_choose_oleg_baklanov_desc: "The secretary for the defence industry speaks for the missile designers and the closed cities. For him the Union is first of all its arsenal."
 COLDWAR_SU_ps_choose_ruslan_khasbulatov: "Ruslan Khasbulatov"
 COLDWAR_SU_ps_choose_ruslan_khasbulatov_desc: "The Chechen economist who chaired the Supreme Soviet led the parliament against the president. He wants a parliamentary Russia and a social market."
 COLDWAR_SU_ps_choose_sergei_baburin: "Sergei Baburin"
 COLDWAR_SU_ps_choose_sergei_baburin_desc: "The deputy who voted against the Belovezha accords has never forgiven anyone for them. He wants the Russian people reunited in one state."
 COLDWAR_SU_ps_choose_sergei_glazyev: "Sergei Glazyev"
 COLDWAR_SU_ps_choose_sergei_glazyev_desc: "The youngest minister of the first reform government resigned in protest in 1993. He wants a state that invests, protects and plans."
 COLDWAR_SU_ps_choose_sergei_kiriyenko: "Sergei Kiriyenko"
 COLDWAR_SU_ps_choose_sergei_kiriyenko_desc: "A young banker from Nizhny Novgorod, the reformers' prime minister. He is clever, energetic and thirty five years old."
 COLDWAR_SU_ps_choose_sergei_shoigu: "Sergei Shoigu"
 COLDWAR_SU_ps_choose_sergei_shoigu_desc: "The minister for emergencies has flown to every flood, earthquake and war of the new Russia. He is the most trusted official in the country and the natural face of a party of power."
 COLDWAR_SU_ps_choose_sergei_stepashin: "Sergei Stepashin"
 COLDWAR_SU_ps_choose_sergei_stepashin_desc: "A loyal policeman and a decent man, the Family's first choice as successor. Some in the Kremlin fear he is too soft for the job."
 COLDWAR_SU_ps_choose_sergey_akhromeyev: "Sergey Akhromeyev"
 COLDWAR_SU_ps_choose_sergey_akhromeyev_desc: "The former chief of the General Staff negotiated with the Americans and still believes in the Union with all his heart."
 COLDWAR_SU_ps_choose_stanislav_shatalin: "Stanislav Shatalin"
 COLDWAR_SU_ps_choose_stanislav_shatalin_desc: "The academician who wrote the Five Hundred Days believes the market can save the Union, if the Union is brave enough to try it."
 COLDWAR_SU_ps_choose_vadim_bakatin: "Vadim Bakatin"
 COLDWAR_SU_ps_choose_vadim_bakatin_desc: "The reformist interior minister was given the task of dismantling the KGB. He believes a Union without fear is still possible."
 COLDWAR_SU_ps_choose_valentin_pavlov: "Valentin Pavlov"
 COLDWAR_SU_ps_choose_valentin_pavlov_desc: "The prime minister of the Union confiscated the large banknotes and froze the prices. He believes the economy can still be commanded."
 COLDWAR_SU_ps_choose_valentin_varennikov: "Valentin Varennikov"
 COLDWAR_SU_ps_choose_valentin_varennikov_desc: "The commander of the ground forces carried the Victory Banner in 1945. He went to Kyiv to warn the Ukrainians, and he would rule with the same directness."
 COLDWAR_SU_ps_choose_vasily_starodubtsev: "Vasily Starodubtsev"
 COLDWAR_SU_ps_choose_vasily_starodubtsev_desc: "The chairman of the Peasant Union runs a model collective farm near Tula. He joined the Committee to save the kolkhozes."
 COLDWAR_SU_ps_choose_viktor_chernomyrdin: "Viktor Chernomyrdin"
 COLDWAR_SU_ps_choose_viktor_chernomyrdin_desc: "The former gas minister became prime minister as the man the directors trusted. He speaks in tangled sentences and governs with the calm of a man who has seen worse."
 COLDWAR_SU_ps_choose_vladimir_putin_dresden: "Vladimir Putin"
 COLDWAR_SU_ps_choose_vladimir_putin_dresden_desc: "A lieutenant colonel of the KGB, back from Dresden, who watched the GDR fall from the windows of his office. He has learned what happens to a state that hesitates."
 COLDWAR_SU_ps_choose_vladimir_putin_ps: "Vladimir Putin"
 COLDWAR_SU_ps_choose_vladimir_putin_ps_desc: "A former KGB officer from Leningrad, head of the security service and then prime minister. The Family believes he will guarantee their safety. Nobody yet knows what he believes."
 COLDWAR_SU_ps_choose_vladimir_putin_unity: "Vladimir Putin"
 COLDWAR_SU_ps_choose_vladimir_putin_unity_desc: "The new prime minister has become the most popular man in Russia within weeks. Unity, the party built for him, promises order, a strong state and victory in the Caucasus."
 COLDWAR_SU_ps_choose_yevgeny_primakov_ps: "Yevgeny Primakov"
 COLDWAR_SU_ps_choose_yevgeny_primakov_ps_desc: "Orientalist, spymaster and foreign minister, the old academician is respected by the communists, the generals and the governors alike."
 COLDWAR_SU_ps_choose_yury_luzhkov_ps: "Yury Luzhkov"
 COLDWAR_SU_ps_choose_yury_luzhkov_ps_desc: "The mayor of Moscow rebuilt the capital, its cathedral and his own fortune. He wants to rebuild Russia the same way."
 COLDWAR_SU_ps_dmitry_yazov_desc: "The last Marshal of the Soviet Union brought the tanks into Moscow. He is a soldier of the old school, loyal, stubborn and tired."
 COLDWAR_SU_ps_eduard_limonov_desc: "Poet, provocateur and founder of the National Bolsheviks. His followers are young, angry and convinced that only a revolution can save Russia."
 COLDWAR_SU_ps_eduard_shevardnadze_desc: "The foreign minister who ended the Cold War warned of a coming dictatorship and resigned. He returns as the conscience of the reformers."
