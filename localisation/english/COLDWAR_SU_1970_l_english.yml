 COLDWAR_SU_ref_reject_tt: "§YIf a republic boycotts:§! Union Cohesion §R-3§!"
 COLDWAR_SU_regions_30_tt: "Every region of the Peoples is set to §Y30§!"
 COLDWAR_SU_register_new_parties: "Use Post-Soviet Party Names"
 COLDWAR_SU_register_new_parties_desc: "Adopt the names and emblems of the post-Soviet party landscape."
 COLDWAR_SU_register_new_parties_tt: "Use post-Soviet party names, descriptions and emblems, including [COLDWAR_SU_GetPartyExample]."
 COLDWAR_SU_regname_1: "the Baltic"
 COLDWAR_SU_regname_2: "the Western Republics"
 COLDWAR_SU_regname_3: "the Caucasus"
 COLDWAR_SU_regname_4: "Central Asia"
 COLDWAR_SU_rename_tt: "The Soviet Union becomes the §YRussian Federation§!"
 COLDWAR_SU_republican_guards: "Republican Guards"
 COLDWAR_SU_republican_guards_desc: "Every republic gets a national guard of its own, armed from the Union stocks."
 COLDWAR_SU_resolution_number_one: "Resolution Number One"
 COLDWAR_SU_resolution_number_one_desc: "The first decree of the Committee promises lower prices and fifteen hundredths of a hectare of garden land for every family."
 COLDWAR_SU_resp_almaata_clear: "Clear the Square"
 COLDWAR_SU_resp_almaata_clear_desc: "Moscow has replaced the long serving first secretary of the republic with a Russian who has never lived there. Students gather on the main square in the frost."
 COLDWAR_SU_resp_almaata_clear_tt: "The region [COLDWAR_SU_GetRegT]: §G-6§!\nUnrest in [?COLDWAR_SU_ssr_t.GetName]: §G-3§!\n§R25% chance of a Spark§! in [?COLDWAR_SU_ssr_t.GetName]\nPressure: §R+10§!"
 COLDWAR_SU_resp_almaata_recall: "Recall the New Man"
 COLDWAR_SU_resp_almaata_recall_desc: "Moscow has replaced the long serving first secretary of the republic with a Russian who has never lived there. Students gather on the main square in the frost."
 COLDWAR_SU_resp_almaata_recall_tt: "The Elite: §G-3§!\nThe region [COLDWAR_SU_GetRegT]: §G-8§!"
 COLDWAR_SU_resp_almaata_wait: "Wait for the Frost"
 COLDWAR_SU_resp_almaata_wait_desc: "Moscow has replaced the long serving first secretary of the republic with a Russian who has never lived there. Students gather on the main square in the frost."
 COLDWAR_SU_resp_almaata_wait_tt: "The region [COLDWAR_SU_GetRegT]: §R+2§!"
 COLDWAR_SU_resp_chain_condemn: "Condemn the Chain"
 COLDWAR_SU_resp_chain_condemn_desc: "Two million people join hands from Tallinn through Riga to Vilnius, on the anniversary of the secret protocol of 1939. The whole world watches."
 COLDWAR_SU_resp_chain_condemn_tt: "The region [COLDWAR_SU_GetRegT]: §R+5§!\nPressure: §R+5§!"
 COLDWAR_SU_resp_chain_ignore: "Ignore It"
 COLDWAR_SU_resp_chain_ignore_desc: "Two million people join hands from Tallinn through Riga to Vilnius, on the anniversary of the secret protocol of 1939. The whole world watches."
 COLDWAR_SU_resp_chain_ignore_tt: "The region [COLDWAR_SU_GetRegT]: §R+3§!\nOpinion of the Western Bloc: §R-5§!"
 COLDWAR_SU_resp_chain_protocol: "Admit the Secret Protocol"
 COLDWAR_SU_resp_chain_protocol_desc: "Two million people join hands from Tallinn through Riga to Vilnius, on the anniversary of the secret protocol of 1939. The whole world watches."
 COLDWAR_SU_resp_chain_protocol_tt: "The Elite: §R+10§!\nThe region [COLDWAR_SU_GetRegT]: §G-12§!\nOpinion of the Western Bloc: §G+10§!"
 COLDWAR_SU_resp_chechnya_autonomy: "Grant Special Autonomy"
 COLDWAR_SU_resp_chechnya_autonomy_desc: "General Dudayev's National Congress of the Chechen People has stormed the Supreme Soviet in Grozny. Armed men guard the television centre, and the arsenals of the Soviet garrison are surrounded. The congress speaks of an independent Ichkeria."
 COLDWAR_SU_resp_chechnya_autonomy_tt: "The Elite: §R+8§!\nThe region [COLDWAR_SU_GetRegT]: §G-10§!"
 COLDWAR_SU_resp_chechnya_declare: "Let Them Declare"
 COLDWAR_SU_resp_chechnya_declare_desc: "General Dudayev's National Congress of the Chechen People has stormed the Supreme Soviet in Grozny. Armed men guard the television centre, and the arsenals of the Soviet garrison are surrounded. The congress speaks of an independent Ichkeria."
 COLDWAR_SU_resp_chechnya_declare_tt: "The region [COLDWAR_SU_GetRegT]: §G-8§!\n§RChechnya rises:§! the Chechen Republic of Ichkeria is released with the Soviet arsenals of Grozny and strong defence bonuses"
 COLDWAR_SU_resp_chechnya_troops: "Send the Interior Troops"
 COLDWAR_SU_resp_chechnya_troops_desc: "General Dudayev's National Congress of the Chechen People has stormed the Supreme Soviet in Grozny. Armed men guard the television centre, and the arsenals of the Soviet garrison are surrounded. The congress speaks of an independent Ichkeria."
 COLDWAR_SU_resp_chechnya_troops_tt: "The region [COLDWAR_SU_GetRegT]: §G-5§!\nPressure: §R+10§!\nIf the Caucasus is still at least §Y70§!: §RChechnya rises anyway§!"
 COLDWAR_SU_resp_fronts_ban: "Ban the Fronts"
 COLDWAR_SU_resp_fronts_ban_desc: "Writers, scientists and even party members have founded a Popular Front in support of reform. Within weeks it has more members than the party of the republic."
 COLDWAR_SU_resp_fronts_ban_tt: "The region [COLDWAR_SU_GetRegT]: §G-5§!\nPressure: §R+12§!"
 COLDWAR_SU_resp_fronts_coopt: "Co-opt Their Leaders"
 COLDWAR_SU_resp_fronts_coopt_desc: "Writers, scientists and even party members have founded a Popular Front in support of reform. Within weeks it has more members than the party of the republic."
