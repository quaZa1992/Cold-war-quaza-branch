 COLDWAR_SU_to_language_tt: "The region [COLDWAR_SU_GetRegT]: §R+6§!"
 COLDWAR_SU_to_letter_tt: "The Elite: §R+5§!"
 COLDWAR_SU_to_miners: "The Miners Rise"
 COLDWAR_SU_to_miners_desc: ""
 COLDWAR_SU_to_miners_tt: "The People: §R+10§!"
 COLDWAR_SU_to_plot_tt: "The Elite: §R+5§!\n§RThe Time of Troubles opens§!"
 COLDWAR_SU_to_refuseniks_tt: "Pressure: §R+5§!\nOpinion of the Western Bloc: §R-5§!"
 COLDWAR_SU_to_samizdat_tt: "The People: §R+4§!"
 COLDWAR_SU_to_shelves_tt: "The People: §R+5§!"
 COLDWAR_SU_to_strike: "Wildcat Strike"
 COLDWAR_SU_to_strike_desc: ""
 COLDWAR_SU_to_strike_tt: "The People: §R+6§!"
 COLDWAR_SU_to_succession_tt: "The Elite: §R+8§!"
 COLDWAR_SU_to_zinc_tt: "The People: §R+6§!"
 COLDWAR_SU_tolerate_the_markets: "Tolerate the Markets"
 COLDWAR_SU_tolerate_the_markets_desc: "The markets feed the people. We tax them quietly and let them grow."
 COLDWAR_SU_tool_amnesty: "Selective Amnesty"
 COLDWAR_SU_tool_amnesty_desc: "Some prisoners of the State of Emergency are released, the ringleaders stay in the camps."
 COLDWAR_SU_tool_amnesty_tt: "The People: §G-3§!\nPressure: §G-8§!\nOpinion of the Western Bloc: §G+5§!"
 COLDWAR_SU_tool_bonuses: "Bonuses for the Apparatus"
 COLDWAR_SU_tool_bonuses_desc: "Dachas, cars and special shops for the officials who keep the state running."
 COLDWAR_SU_tool_bonuses_tt: "The Elite: §G-10§!\nPressure: §G-3§!"
 COLDWAR_SU_tool_concessions: "National Concessions"
 COLDWAR_SU_tool_concessions_desc: "The republics may print their newspapers in their own language and appoint their own ministers of culture."
 COLDWAR_SU_tool_concessions_tt: "The Elite: §R+5§!\nEvery region of the Peoples: §G-8§!\nPressure: §G-4§!"
 COLDWAR_SU_tool_housing: "Housing Programme"
 COLDWAR_SU_tool_housing_desc: "A new flat for every family by the year 2000, starting now."
 COLDWAR_SU_tool_housing_tt: "Pressure: §G-2§! per month for §Y365§! days"
 COLDWAR_SU_tool_imports: "Import Consumer Goods"
 COLDWAR_SU_tool_imports_desc: "Western shoes, Finnish butter and Japanese tape recorders, bought with the last hard currency."
 COLDWAR_SU_tool_imports_tt: "The People: §G-5§!\nPressure: §G-10§!"
 COLDWAR_SU_tool_release: "Controlled Release"
 COLDWAR_SU_tool_release_desc: "The Committee allows a few critical films and a tolerated rock club. The steam escapes, but the people learn that they can push."
 COLDWAR_SU_tool_release_tt: "The People: §R+5§!\nPressure: §G-15§!"
 COLDWAR_SU_tools_category: "The Committee's Tools"
 COLDWAR_SU_tools_category_desc: "The Committee keeps the lid on a full kettle. Money and favours can let the steam out, a little at a time. Every use makes the next one §R50%§! more expensive."
 COLDWAR_SU_tools_tt: "Unlocks §YThe Committee's Tools§!: expensive decisions that lower Pressure. Each use makes the next one §R50%§! more expensive."
 COLDWAR_SU_tr_chosen: "§RThe Time of Troubles: a way out has been chosen§!"
 COLDWAR_SU_tr_closed: "§gThe Time of Troubles: closed§!"
 COLDWAR_SU_tr_open: "§RThe Time of Troubles is open§!"
 COLDWAR_SU_trade_with_the_south: "Trade with the South"
 COLDWAR_SU_trade_with_the_south_desc: "Tanks for Delhi, fighters for Baghdad, and hard currency for Moscow."
 COLDWAR_SU_treaty_accept_tt: "§YIf a republic signs:§! it stays in the renewed Union as a member of the treaty"
 COLDWAR_SU_treaty_reject_tt: "§YIf a republic refuses:§! it leaves the Union in peace and takes its share of the Soviet army"
 COLDWAR_SU_troubles_closed_tt: "The Time of Troubles closes. The trunk of the path can no longer be continued until the crisis returns."
 COLDWAR_SU_troubles_open_ev_tt: "The focus §YThe Time of Troubles§! is now available. It closes again if all three camps fall below §Y50§! before a way out is chosen."
 COLDWAR_SU_troubles_open_tt: "The Time of Troubles is open: two camps at §Y60§! or more, or Union Cohesion below §Y35§!"
 COLDWAR_SU_un_av_tt: "The Union has ended as a Federation"
 COLDWAR_SU_union: "The Unbreakable Union"
 COLDWAR_SU_union_state_tt: "§YBelarus§! decides whether to form a Union State with us.\nIf it accepts: both get §YThe Union State§! (Trade Opinion §G+15%§!, Consumer Goods §G-3%§! for Belarus) and §YAlexander Lukashenko§! becomes a candidate for our leadership.\nIf Belarus no longer exists or is our subject, the Union State is formed at once."
 COLDWAR_SU_unrest_p5_tt: "Unrest: §R+5§!"
 COLDWAR_SU_us_accept_tt: "Both countries form §YThe Union State§!\nAlexander Lukashenko becomes a candidate in Moscow"
 COLDWAR_SU_usa_aid_tt: "§YThe United States§! is offered a partnership: aid of §G3%§! of our GDP if it accepts"
