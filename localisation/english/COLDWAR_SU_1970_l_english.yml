 COLDWAR_SU_ROW_INFL: "Inflation and debt"
 COLDWAR_SU_ROW_INFL_TT: "Inflation above 5%: §R+0.10§!, above 15%: §R+0.30§!\nDebt above 40% of GDP: §R+0.15§!, above 70%: §R+0.30§!"
 COLDWAR_SU_ROW_MEAS: "Our measures"
 COLDWAR_SU_ROW_MEAS_TT: "Measures that work every month: Price Freeze, Consumer Goods Priority, Party Propaganda, Anti-Alcohol Campaign"
 COLDWAR_SU_ROW_OIL: "Hard currency from oil"
 COLDWAR_SU_ROW_OIL_TT: "World oil price from the oil system (now [?global.mdcw_cw_oil_ratio|2]):\nabove 2.5 §G-0.10§!, above 1.5 §G-0.05§!, below 1 §R+0.15§!"
 COLDWAR_SU_ROW_PARITY: "Guns before butter"
 COLDWAR_SU_ROW_PARITY_TT: "Defence law three or more levels above the welfare law: §R+0.10§!\nThe Burden of Parity: §R+0.05§!"
 COLDWAR_SU_ROW_RADIO: "Western broadcasters"
 COLDWAR_SU_ROW_RADIO_TT: "Every Western country that funds the broadcasters: §R+0.06§!, at most §R+0.30§!. Now §Y[?COLDWAR_SU_n_radio|0]§! countries.\nSealed §G×0.3§!, Managed §G×0.6§!, Glasnost §R×1§!. Helsinki §R×1.25§!. The Baltic feels it twice."
 COLDWAR_SU_ROW_REFORM: "Our reforms"
 COLDWAR_SU_ROW_REFORM_TT: "Glasnost §R+0.10§!, Indigenisation §R+0.05§!, Sovereign Rights in the last two years §R+0.05§!"
 COLDWAR_SU_ROW_SEC: "Security Line"
 COLDWAR_SU_ROW_SEC_TT: "Thaw lets the anger out, Normalisation and Hard Line press it into Pressure."
 COLDWAR_SU_ROW_SPIRIT: "Expectations and old habits"
 COLDWAR_SU_ROW_SPIRIT_TT: "People expect a little more every year: §R+0.05§!\nSamizdat and Dissent §R+0.05§!, The Agrarian Problem §R+0.05§!, The Second Economy §G-0.05§!, consumer and temperance focuses §G-0.03§! to §G-0.05§!"
 COLDWAR_SU_ROW_STAB: "Stability"
 COLDWAR_SU_ROW_STAB_TT: "Below 30%: §R+0.40§!, below 50%: §R+0.20§!, above 70%: §G-0.20§!"
 COLDWAR_SU_ROW_VOL: "Volunteers abroad"
 COLDWAR_SU_ROW_VOL_TT: "Every country with Soviet volunteers: §R+0.15§!, at most §R+0.45§!, the Elite §R+0.03§! each. Now §Y[?COLDWAR_SU_n_vol|0]§!.\nVolunteers of a Union republic: its region §R+0.10§! and its own Unrest §R+0.15§! per month."
 COLDWAR_SU_ROW_WAR: "War"
 COLDWAR_SU_ROW_WAR_TT: "Every offensive war from the first month: §R+0.30§!\nFrom 12 months: §R+0.20§! more, every region §R+0.05§!, the Elite §R+0.05§!\nWar Support below 30%: §R+0.25§!, the Elite §R+0.05§!\nSurrender progress above 10%: §R+0.30§!, every region §R+0.10§!, the Elite §R+0.15§!\nAt war for §Y[?COLDWAR_SU_war_months|0]§! months."
 COLDWAR_SU_ROW_YEARS: "Years in office"
 COLDWAR_SU_ROW_YEARS_TT: "A General Secretary more than 10 years in office: §R+0.05§!"
 COLDWAR_SU_SW_C: "Republic Cadres"
 COLDWAR_SU_SW_I: "Information"
 COLDWAR_SU_SW_N: "Nationalities"
 COLDWAR_SU_SW_S: "Security Line"
 COLDWAR_SU_T1: "§YTHE THREE CAMPS§!"
 COLDWAR_SU_T2: "§YTHE PEOPLES OF THE UNION§!"
 COLDWAR_SU_T2R: "§gvalue, change, republics§!"
 COLDWAR_SU_T3: "§YCOURSE OF THE STATE§!"
 COLDWAR_SU_T3R: "§gchanges lock for 180 days§!"
 COLDWAR_SU_T4: "WHY THE CAMPS CHANGE"
 COLDWAR_SU_T4R: "§gper month§!"
 COLDWAR_SU_TROUBLES_TT: "§YThe Time of Troubles§! opens when two camps reach §Y60§! or Union Cohesion falls below §Y35§!. It closes again when all camps are below §Y50§! before a way out is chosen. Two camps at §Y80§! force a decision at once."
 COLDWAR_SU_a1_av_tt: "No other way out chosen, and Union Cohesion at least §Y25§! (or A Renewed Federation or A Federal Union completed)"
 COLDWAR_SU_a2_av_tt: "At least half of the republics that answered took part in the referendum (now [?COLDWAR_SU_ref_yes|0] of [?COLDWAR_SU_ref_asked|0])"
 COLDWAR_SU_a_common_european_home: "A Common European Home"
 COLDWAR_SU_a_common_european_home_desc: "Russia gives up the bloc and asks for a place in Europe. The satellites are free, the Warsaw Pact is history."
 COLDWAR_SU_a_common_european_home_fx_tt: "Opinion of the Western Bloc: §G+15§!"
 COLDWAR_SU_a_confederal_council: "A Confederal Council"
 COLDWAR_SU_a_confederal_council_desc: "A council of the presidents of the republics decides on everything that matters."
 COLDWAR_SU_a_deal_with_the_republic_bosses: "A Deal with the Republic Bosses"
 COLDWAR_SU_a_deal_with_the_republic_bosses_desc: "The first secretaries of the republics keep their fiefdoms if they keep their republics quiet. Moscow asks no questions about cotton or caviar."
 COLDWAR_SU_a_deal_with_the_republic_bosses_fx_tt: "The Elite: §G-10§!\nEvery region of the Peoples: §G-15§!"
 COLDWAR_SU_a_democratic_russia: "A Democratic Russia"
 COLDWAR_SU_a_democratic_russia_desc: "The democrats who stood on the tanks now form the government. Sakharov's heirs and Medvedev's socialists compete for the new Russia."
 COLDWAR_SU_a_free_press: "A Free Press"
 COLDWAR_SU_a_free_press_desc: "Let them fight on the screens. A press that attacks the government is a press the voters believe."
 COLDWAR_SU_a_free_press_fx_tt: "Opinion of the Western Bloc: §G+10§!"
 COLDWAR_SU_a_great_power_again: "A Great Power Again"
 COLDWAR_SU_a_great_power_again_desc: "Primakov turns his plane around over the Atlantic. Russia will not be anybody's junior partner."
 COLDWAR_SU_a_great_power_again_fx_tt: "Army opinion: §G+10§!"
 COLDWAR_SU_a_marshal_as_leader: "A Marshal as Leader"
 COLDWAR_SU_a_marshal_as_leader_desc: "The army made the Committee, and the army will lead it."
 COLDWAR_SU_a_marshal_as_leader_fx_tt: "Army opinion: §G+15§!"
 COLDWAR_SU_a_nation_restored: "A Nation Restored"
 COLDWAR_SU_a_nation_restored_desc: "The hard years are behind us. The state stands, the currency holds, and our children will not remember the queues."
 COLDWAR_SU_a_normal_country: "A Normal Country"
 COLDWAR_SU_a_normal_country_desc: "Wages are paid on time again and the shops are full. Russia has become a normal country, with all its oligarchs."
 COLDWAR_SU_a_parliamentary_republic: "A Parliamentary Republic"
 COLDWAR_SU_a_parliamentary_republic_desc: "The Supreme Soviet wins. Russia will be governed by coalitions of its parliament."
 COLDWAR_SU_a_parliamentary_republic_fx_tt: "Opinion of the Western Bloc: §G+10§!"
 COLDWAR_SU_a_popular_president: "A Popular President"
 COLDWAR_SU_a_popular_president_desc: "The president of the Union is elected by the people, and owes nothing to the party."
 COLDWAR_SU_a_popular_president_fx_tt: "Strongest opposition party: popularity §R+10§!§Y%§!"
 COLDWAR_SU_a_renewed_federation: "A Renewed Federation"
 COLDWAR_SU_a_renewed_federation_desc: "The draft of June: Moscow keeps the army, foreign policy and the Union budget. The republics run everything else."
 COLDWAR_SU_a_renewed_federation_fx_tt: "Every region of the Peoples: §G-10§!"
 COLDWAR_SU_a_russian_russia: "A Russian Russia"
 COLDWAR_SU_a_russian_russia_desc: "Rutskoy and the Russian national movement take over. Russia will be strong again, and it will look after the Russians beyond its borders."
 COLDWAR_SU_a_second_union: "A Second Union"
 COLDWAR_SU_a_second_union_desc: "The Union has found a new form. Whether it will last another seventy years, nobody can say."
 COLDWAR_SU_a_small_national_army: "A Small National Army"
 COLDWAR_SU_a_small_national_army_desc: "A small army we can pay is better than a large army that sells its fuel on the market."
 COLDWAR_SU_a_strong_centre: "A Strong Centre"
 COLDWAR_SU_a_strong_centre_desc: "The ministries in Moscow keep their powers. The republics may advise."
 COLDWAR_SU_a_superpower_still: "A Superpower Still"
 COLDWAR_SU_a_superpower_still_desc: "The Union stands, armed and unbowed. The world must still reckon with Moscow."
 COLDWAR_SU_a_union_of_sovereign_states: "A Union of Sovereign States"
 COLDWAR_SU_a_union_of_sovereign_states_desc: "The draft of November: a confederation of sovereign states with their own foreign policy. The Union becomes a framework, not a state."
 COLDWAR_SU_a_union_of_sovereign_states_fx_tt: "The Elite: §R+10§!\nEvery region of the Peoples: §G-25§!"
 COLDWAR_SU_abolish_article_six: "Abolish Article Six"
 COLDWAR_SU_abolish_article_six_desc: "Article Six of the constitution makes the CPSU the leading and guiding force of Soviet society. Without it, the party must win its power in elections."
 COLDWAR_SU_abolish_article_six_fx_tt: "The People: §G-10§!\nThe Elite: §R+15§!\nStrongest opposition party: popularity §R+10§!§Y%§!"
 COLDWAR_SU_accept_kyivs_terms: "Accept Kyiv's Terms"
 COLDWAR_SU_accept_kyivs_terms_desc: "Ukraine gets what it asks for. It is expensive, but it keeps forty million people in the Union."
 COLDWAR_SU_adv.1.a: "Thank the comrades for their vigilance."
 COLDWAR_SU_adv.1.b: "The Committee sees enemies everywhere."
 COLDWAR_SU_adv.1.d: "Comrade General Secretary, the Committee for State Security has completed its assessment of the situation in the Union.\n\n[Root.COLDWAR_SU_GetAdvDriver][Root.COLDWAR_SU_GetAdvPressure]\n\n§YRecommendation:§! [Root.COLDWAR_SU_GetAdvRec]\n[Root.COLDWAR_SU_GetAdvRec2]\n\n§gThe People [?Root.COLDWAR_SU_people|0], the Elite [?Root.COLDWAR_SU_elite|0], the Peoples [?Root.COLDWAR_SU_peoples|0], Pressure [?Root.COLDWAR_EB_pressure|0].§!"
 COLDWAR_SU_adv.1.t: "A Report from the KGB"
 COLDWAR_SU_adv.2.a: "We will act. Immediately."
 COLDWAR_SU_adv.2.b: "Panic helps nobody."
 COLDWAR_SU_adv.2.d: "Comrade General Secretary, the Chairman of the KGB has asked for an urgent audience. He brought no papers, only a single folder marked 'Top Secret'.\n\n[Root.COLDWAR_SU_GetAdvDriver][Root.COLDWAR_SU_GetAdvPressure]\n\n§YHe recommends:§! [Root.COLDWAR_SU_GetAdvRec]\n[Root.COLDWAR_SU_GetAdvRec2]\n\n§gThe People [?Root.COLDWAR_SU_people|0], the Elite [?Root.COLDWAR_SU_elite|0], the Peoples [?Root.COLDWAR_SU_peoples|0], Pressure [?Root.COLDWAR_EB_pressure|0].§!"
 COLDWAR_SU_adv.2.t: "An Urgent Audience"
 COLDWAR_SU_adv_driver_burden: "The people feel the weight of our commitments: the arms race, the fraternal countries, the wars abroad. Every coffin that comes home and every rouble for the army is counted in the queues."
 COLDWAR_SU_adv_driver_calm: "The situation is under control. The people grumble as they always do, but there is no organised resistance anywhere in the Union."
 COLDWAR_SU_adv_driver_econ: "The economy is the problem. The shelves are empty, the queues get longer and the money in the savings books buys less every year. The workers grumble about meat and sausage, not about Marxism-Leninism. Not yet."
 COLDWAR_SU_adv_driver_elite: "The danger is at the top. Comrades in the Politburo and the ministries form factions, and some of them already ask in private who will come after you. The apparatus is restless."
 COLDWAR_SU_adv_driver_mood: "The mood is sour. The party meetings are empty, people drink and steal from the factories, and nobody believes that tomorrow will be better than today."
 COLDWAR_SU_adv_driver_peoples: "The republics are the danger. In [Root.COLDWAR_SU_GetAdvRegion] the national feeling grows: the intelligentsia demands its own language, its own history and its own budget, and the local party listens to them."
 COLDWAR_SU_adv_driver_west: "The Voice of America and Radio Liberty are heard in every kitchen. Our citizens compare their lives with what the enemy broadcasts, and they no longer believe that we will overtake America."
 COLDWAR_SU_adv_pressure_high: "\n\n§RWe must warn you: the anger has not gone, it is only held down. Pressure is building beneath the surface, and the lid will not hold forever.§!"
 COLDWAR_SU_adv_pressure_none: ""
 COLDWAR_SU_adv_region_bal: "The Baltic"
 COLDWAR_SU_adv_region_cas: "Central Asia"
 COLDWAR_SU_adv_region_cau: "The Caucasus"
 COLDWAR_SU_adv_region_wst: "The Western Republics"
 COLDWAR_SU_aid_accept_tt: "We pay §R0.5%§! of our GDP\nRussia gets §YWestern Food Aid§!"
 COLDWAR_SU_am_again_tt: "Our partner decides again on §Y1§! more year of food."
 COLDWAR_SU_am_auto_tt: "This happens on its own as the Arduous March runs its course."
 COLDWAR_SU_am_china_shadow: "In China's Shadow"
 COLDWAR_SU_am_china_shadow_desc: ""
 COLDWAR_SU_am_china_tt: "§YChina§! decides on a lifeline. If it accepts: §YChinese Rice§! for §Y1§! year (it eases the hunger, it does not end it). We may ask again every year."
 COLDWAR_SU_am_chinese_rice: "Chinese Rice"
 COLDWAR_SU_am_chinese_rice_desc: ""
 COLDWAR_SU_am_end_tt: "§GThe Arduous March ends.§!"
 COLDWAR_SU_am_final_tt: "World food aid: §YA Door Ajar§!. The Chinese lifeline: §YIn China's Shadow§!. Army First: §YThe Songun State§!."
 COLDWAR_SU_am_food_aid: "Food Aid"
 COLDWAR_SU_am_food_aid_desc: ""
 COLDWAR_SU_am_foreign_eyes: "Foreign Eyes"
 COLDWAR_SU_am_foreign_eyes_desc: ""
 COLDWAR_SU_am_g3_tt: "The Arduous March has lasted at least §Y4§! years (now [?COLDWAR_SU_am_months|0] months)"
 COLDWAR_SU_am_g4_tt: "The Arduous March has lasted at least §Y6§! years (now [?COLDWAR_SU_am_months|0] months)"
 COLDWAR_SU_am_gend_tt: "The Arduous March has lasted at least §Y8§! years, §Y10§! under Army First (now [?COLDWAR_SU_am_months|0] months)"
 COLDWAR_SU_am_open_door: "A Door Ajar"
 COLDWAR_SU_am_open_door_desc: ""
 COLDWAR_SU_am_songun_state: "The Songun State"
 COLDWAR_SU_am_songun_state_desc: ""
 COLDWAR_SU_am_songun_tt: "No foreign help. The march ends after §R10§! years instead of 8."
 COLDWAR_SU_am_stage2_tt: "§YThe Arduous March§! becomes §YThe Arduous March: Survival§!"
 COLDWAR_SU_am_stage3_tt: "§YThe Arduous March: Survival§! becomes §YThe Arduous March: Hunger Eases§!"
 COLDWAR_SU_am_stage4_tt: "§YThe Arduous March: Hunger Eases§! becomes §YThe Arduous March: The Long Recovery§!"
 COLDWAR_SU_am_start_tt: "§RThe Arduous March§! begins and lasts until our path leads out of it."
 COLDWAR_SU_am_world_tt: "§YThe United States§! decide on food aid. If they accept: §YFood Aid§! for §Y1§! year (it eases the hunger, it does not end it) and §G3%§! of our GDP. We may ask again every year."
 COLDWAR_SU_antialc_av_tt: "Completed §YThe Alcohol Problem§!, §YThe 1972 Temperance Decree§! or §YThe Anti-Alcohol Campaign§!"
 COLDWAR_SU_arduous_march_1: "The Arduous March"
 COLDWAR_SU_arduous_march_1_desc: ""
 COLDWAR_SU_arduous_march_2: "The Arduous March: Survival"
 COLDWAR_SU_arduous_march_2_desc: ""
 COLDWAR_SU_arduous_march_3: "The Arduous March: Hunger Eases"
 COLDWAR_SU_arduous_march_3_desc: ""
 COLDWAR_SU_arduous_march_4: "The Arduous March: The Long Recovery"
 COLDWAR_SU_arduous_march_4_desc: ""
 COLDWAR_SU_arms_accept_tt: "For §Y730§! days the arms race counts only half for the Soviet Union\nCold War Tension: §G-5§!"
 COLDWAR_SU_arms_reject_tt: "Soviet propaganda uses our refusal: the People of the Soviet Union §G-5§!"
 COLDWAR_SU_army_first: "Songun: Army First"
 COLDWAR_SU_army_first_desc: "The army eats first. Whatever happens in the villages, the Korean People's Army will stand."
 COLDWAR_SU_arrest_him: "Arrest Him"
 COLDWAR_SU_arrest_him_desc: "The Alpha group goes in. Whatever happens in the White House tonight, Russia will have no president tomorrow."
 COLDWAR_SU_arrest_him_fx_tt: "The People: §R+15§!\nPressure: §G-10§!"
 COLDWAR_SU_art6_tt: "The CPSU loses its guaranteed leading role: the opposition may organise openly"
 COLDWAR_SU_ask_the_world_for_food: "Ask the World for Food"
 COLDWAR_SU_ask_the_world_for_food_desc: "We let the World Food Programme into the country. Foreign inspectors will see our hunger, but the ships will bring grain."
 COLDWAR_SU_assure_offer_tt: "§YThe United States and Britain§! are asked to sign the guarantees"
 COLDWAR_SU_assure_op_tt: "Opinion of the United States, Britain and Russia: §G+25§!"
 COLDWAR_SU_asymmetric_federalism: "Asymmetric Federalism"
 COLDWAR_SU_asymmetric_federalism_desc: "Tatarstan keeps its oil and its president. In return it stays in the Federation."
 COLDWAR_SU_b1_av_tt: "No other way out chosen, and the Elite at least §Y50§! (or Iron Discipline, The Iron Union or the backed coup)"
 COLDWAR_SU_baklanovs_defence_complex: "Baklanov's Defence Complex"
 COLDWAR_SU_baklanovs_defence_complex_desc: "The secretary for the defence industry sits on the Committee. His plants get steel, power and labour first."
 COLDWAR_SU_baltics_go_tt: "§REstonia, Latvia and Lithuania leave the Union§!"
 COLDWAR_SU_barons_10_tt: "Republic Cadres: §YLocal Barons§! for §Y10§! years"
 COLDWAR_SU_beijing_partner: "The Beijing Axis"
 COLDWAR_SU_beijing_partner_desc: ""
 COLDWAR_SU_beijing_tt: "§YChina§! is offered a strategic partnership. If it refuses, the Ussuri frontier returns."
 COLDWAR_SU_belovezha: "Belovezha"
 COLDWAR_SU_belovezha_desc: "In a hunting lodge in the Belarusian forest the leaders of Russia, Ukraine and Belarus declare that the USSR has ceased to exist as a subject of international law."
 COLDWAR_SU_bloc_1_fit_tt: "Countries of any government may align with the §YRussian Sphere§!"
 COLDWAR_SU_bloc_1_tt: "The Soviet bloc becomes the §YRussian Sphere§!"
 COLDWAR_SU_bloc_2_free_tt: "Every member of the Soviet Bloc becomes Non-Aligned without cost"
 COLDWAR_SU_bloc_2_tt: "Every remaining satellite is released. The Soviet bloc dissolves."
 COLDWAR_SU_bloc_3_fit_tt: "Countries of any government may align with the §YEurasian Pole§!"
 COLDWAR_SU_bloc_3_tt: "The Soviet bloc becomes the §YEurasian Pole§!"
 COLDWAR_SU_bloc_name_0: "Soviet Bloc"
 COLDWAR_SU_bloc_name_1: "Russian Sphere"
