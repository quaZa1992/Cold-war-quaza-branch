 COLDWAR_SU_ROW_EMPIRE: "The burden of empire"
 COLDWAR_SU_ROW_EMPIRE_TT: "Every satellite under our lid with Unrest of 60 or more, Fraternal Assistance or Restore Socialist Order in the last year: §R+0.05§!, at most §R+0.25§!"
