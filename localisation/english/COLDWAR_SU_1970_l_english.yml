 COLDWAR_SU_chechnya_war: "Restore Constitutional Order in Chechnya"
 COLDWAR_SU_chechnya_war_desc: "Ichkeria holds the arsenals of Grozny and the mountains around it. The army can take it back, at a price."
 COLDWAR_SU_chechnya_war_tt: "§RWar with Chechnya§!. Its fighters defend with strong bonuses on their own soil."
 COLDWAR_SU_choice_accept_tt: "§YIf a republic declares independence:§! it leaves in peace with its share of the Soviet army"
 COLDWAR_SU_choice_reject_tt: "§YIf a republic stays:§! it remains a Union republic"
 COLDWAR_SU_cis_member: "The Commonwealth of Independent States"
