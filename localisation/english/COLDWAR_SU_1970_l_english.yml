 COLDWAR_SU_the_beijing_axis_desc: "Two communist great powers against the world. The old quarrel over the Ussuri can wait."
 COLDWAR_SU_the_chinese_lifeline: "The Chinese Lifeline"
 COLDWAR_SU_the_chinese_lifeline_desc: "Beijing has rice, oil and a long border with us. Its help will come with conditions."
 COLDWAR_SU_the_chinese_road: "The Chinese Road"
 COLDWAR_SU_the_chinese_road_desc: "Special zones on the coasts, foreign capital welcome, and the party keeps power. Deng Xiaoping shows the way."
 COLDWAR_SU_the_chinese_road_fx_tt: "Opinion of the Western Bloc: §R-5§!"
 COLDWAR_SU_the_citizenship_question: "The Citizenship Question"
 COLDWAR_SU_the_citizenship_question_desc: "Hundreds of thousands of Russians live among us. Are they citizens?"
 COLDWAR_SU_the_committee_rules: "The Committee Rules"
 COLDWAR_SU_the_committee_rules_desc: "The Committee rules, and it must now show that it can do more than forbid."
 COLDWAR_SU_the_committee_takes_power: "The Committee Takes Power"
 COLDWAR_SU_the_committee_takes_power_desc: "At six in the morning the radio plays Swan Lake. The General Secretary is held at his dacha in the Crimea, and the Committee announces that it has taken power."
 COLDWAR_SU_the_committee_takes_power_fx_tt: "The People: §G-30§!\nThe Elite: §G-30§!\nEvery region of the Peoples: §G-30§!\nPressure: §R+40§!\nCold War Tension: §R+15§!"
 COLDWAR_SU_the_committees_succession: "The Committee's Succession"
 COLDWAR_SU_the_committees_succession_desc: "The Committee cannot rule forever. Somebody must lead it."
 COLDWAR_SU_the_committees_succession_fx_tt: "The Elite: §R+10§!"
 COLDWAR_SU_the_commonwealth: "The Commonwealth"
 COLDWAR_SU_the_commonwealth_desc: "The red flag comes down over the Kremlin. What remains is a commonwealth of independent states, and Russia at its head."
 COLDWAR_SU_the_commonwealth_of_states: "The Commonwealth"
 COLDWAR_SU_the_commonwealth_of_states_desc: "We stay close to Moscow: cheap gas, open markets and Russian bases."
 COLDWAR_SU_the_congress_of_peoples_deputies: "The Congress of People's Deputies"
 COLDWAR_SU_the_congress_of_peoples_deputies_desc: "For the first time candidates compete for the seats of a Soviet parliament, and the debates are shown live on television. The whole country stops working to watch."
 COLDWAR_SU_the_congress_of_peoples_deputies_fx_tt: "The People: §G-10§!\nThe Elite: §R+10§!\nEvery region of the Peoples: §R+5§!"
 COLDWAR_SU_the_constitutional_court: "The Constitutional Court"
 COLDWAR_SU_the_constitutional_court_desc: "A court of the Union will judge the laws of the Union and of the republics. Brilliant lawyers return from abroad to serve on it."
 COLDWAR_SU_the_crisis_council: "The Crisis Council"
 COLDWAR_SU_the_crisis_council_desc: "The Party Centre admits nothing in public, but behind closed doors the leadership must decide how the country will eat."
 COLDWAR_SU_the_debt_trap: "The Debt Trap"
 COLDWAR_SU_the_debt_trap_desc: "The state pays its debts with new debts at fifty percent interest. Everybody knows the pyramid will fall."
 COLDWAR_SU_the_discipline_economy: "The Discipline Economy"
 COLDWAR_SU_the_discipline_economy_desc: "Inspectors in every plant, prison for every thief. Andropov's medicine in a double dose."
 COLDWAR_SU_the_eurasian_pole: "The Eurasian Pole"
 COLDWAR_SU_the_eurasian_pole_desc: "Neither West nor East: Russia will be a pole of its own between Europe and Asia, with its own allies and its own rules."
 COLDWAR_SU_the_familys_choice: "The Family's Choice"
 COLDWAR_SU_the_familys_choice_desc: "The President is tired and ill, and the circle around him fears what comes after. A successor must be found who will guarantee their safety."
 COLDWAR_SU_the_federation_treaty: "The Federation Treaty"
 COLDWAR_SU_the_federation_treaty_desc: "Eighty-nine regions and republics sign a treaty with Moscow. Two of them refuse."
 COLDWAR_SU_the_fertiliser_runs_out: "The Fertiliser Runs Out"
 COLDWAR_SU_the_fertiliser_runs_out_desc: "Without Soviet oil there is no fertiliser and no diesel for the tractors. The cooperative farms bring in half of last year's harvest."
 COLDWAR_SU_the_first_union_elections: "The First Union Elections"
 COLDWAR_SU_the_first_union_elections_desc: "For the first time the citizens of the Union elect its parliament in free and secret elections."
 COLDWAR_SU_the_first_union_elections_fx_tt: "Opinion of the Western Bloc: §G+10§!"
 COLDWAR_SU_the_gradual_road: "The Gradual Road"
 COLDWAR_SU_the_gradual_road_desc: "The old directors keep their plants running and the state keeps paying. No miracle, but no collapse either."
 COLDWAR_SU_the_great_floods: "The Great Floods"
 COLDWAR_SU_the_great_floods_desc: "Torrential rains wash away the terraced fields on the hillsides and flood the grain stores. The famine reaches every province."
 COLDWAR_SU_the_great_privatisation: "The Great Privatisation"
 COLDWAR_SU_the_great_privatisation_desc: "The State Property Committee must sell what seventy years of planning built. Nobody knows what it is worth."
 COLDWAR_SU_the_imf_package: "The IMF Package"
 COLDWAR_SU_the_imf_package_desc: "The Fund lends billions, on conditions. The social budget must shrink."
 COLDWAR_SU_the_imf_package_fx_tt: "Strongest opposition party: popularity §R+5§!§Y%§!"
 COLDWAR_SU_the_inter_republican_committee: "The Inter-Republican Committee"
 COLDWAR_SU_the_inter_republican_committee_desc: "A committee of the republics takes over the economic ministries of the Union. The republics pay again, because they decide again."
 COLDWAR_SU_the_iron_order: "The Iron Order"
 COLDWAR_SU_the_iron_order_desc: "Order has returned to the Union. The streets are quiet, the shops are as empty as before, and the lid sits on a full kettle."
 COLDWAR_SU_the_jangmadang: "The Jangmadang"
 COLDWAR_SU_the_jangmadang_desc: "In the ruins of the planned economy, women sell rice, shoes and Chinese batteries on the black markets. The state looks away, for now."
 COLDWAR_SU_the_krysha: "The Krysha"
 COLDWAR_SU_the_krysha_desc: "The brigades keep order on the streets, the state keeps its share. It is a roof over everyone's head."
 COLDWAR_SU_the_leading_role_stays: "The Leading Role Stays"
 COLDWAR_SU_the_leading_role_stays_desc: "The party will reform itself, but it will not share power. Ligachev and the conservatives of the Central Committee have their way."
 COLDWAR_SU_the_leading_role_stays_fx_tt: "The People: §R+10§!\nThe Elite: §G-10§!\nPressure: §R+10§!"
 COLDWAR_SU_the_long_recovery: "The Long Recovery"
 COLDWAR_SU_the_long_recovery_desc: "The worst is over. The cities have electricity for a few hours a day again, and the children in the villages grow again."
 COLDWAR_SU_the_long_winter: "The Long Winter"
 COLDWAR_SU_the_long_winter_desc: "Nothing will change for a long time. The Committee will see to it."
 COLDWAR_SU_the_march_is_over: "The March Is Over"
 COLDWAR_SU_the_march_is_over_desc: "The Party Centre declares that the Arduous March has ended in victory. Nobody says aloud how many did not live to see it."
 COLDWAR_SU_the_marshals_take_command: "The Marshals Take Command"
 COLDWAR_SU_the_marshals_take_command_desc: "The army leads. Tanks will stand at the bridges of Moscow, and the marshals will form the government."
 COLDWAR_SU_the_marshals_take_command_fx_tt: "Army opinion: §G+15§!"
 COLDWAR_SU_the_media_wars: "The Media Wars"
 COLDWAR_SU_the_media_wars_desc: "Two television channels belong to two oligarchs, and each of them decides what the country thinks about the government."
 COLDWAR_SU_the_near_abroad: "The Near Abroad"
 COLDWAR_SU_the_near_abroad_desc: "The former republics are independent, but they are not foreign. Russia keeps its bases, its pipelines and its say."
 COLDWAR_SU_the_novo_ogaryovo_bargain: "The Novo-Ogaryovo Bargain"
 COLDWAR_SU_the_novo_ogaryovo_bargain_desc: "In a dacha outside Moscow three men divide the Union: the President keeps his title, Russia keeps its power, and Kazakhstan's leader becomes premier of the Union."
 COLDWAR_SU_the_novo_ogaryovo_bargain_fx_tt: "The People: §G-5§!"
 COLDWAR_SU_the_novo_ogaryovo_process: "The Novo-Ogaryovo Process"
 COLDWAR_SU_the_novo_ogaryovo_process_desc: "At a dacha outside Moscow the General Secretary and the leaders of the republics negotiate, chapter by chapter, what will be left of the centre."
 COLDWAR_SU_the_novo_ogaryovo_process_fx_tt: "The Elite: §R+15§!\nEvery region of the Peoples: §G-15§!\nPolitburo Balance: §Y0.15§! towards the Reformers and Technocrats"
 COLDWAR_SU_the_nuclear_question: "The Nuclear Question"
 COLDWAR_SU_the_nuclear_question_desc: "Soviet missiles stand in our fields. The launch codes are in Moscow, but the warheads are here."
 COLDWAR_SU_the_party_candidate: "The Party Candidate"
 COLDWAR_SU_the_party_candidate_desc: "The congress elects the president, and the congress belongs to the party."
 COLDWAR_SU_the_party_candidate_fx_tt: "Politburo Balance: §G0.1§! towards the centre\nOpinion of the Western Bloc: §R-5§!"
 COLDWAR_SU_the_party_hardliners_act: "The Party Hardliners Act"
 COLDWAR_SU_the_party_hardliners_act_desc: "The apparatus and the KGB lead. A State Committee for the State of Emergency will rule in the name of the party."
 COLDWAR_SU_the_party_hardliners_act_fx_tt: "KGB opinion: §G+15§!"
 COLDWAR_SU_the_potato_revolution: "The Potato Revolution"
 COLDWAR_SU_the_potato_revolution_desc: "Potatoes grow where rice will not. The fields of Taehongdan are turned over to the new crop, and the double cropping of barley spreads."
 COLDWAR_SU_the_president_of_the_union: "The President of the Union"
 COLDWAR_SU_the_president_of_the_union_desc: "The Union has a president, a treaty and a future. The crisis is not over, but the state has survived it."
 COLDWAR_SU_the_president_of_the_union_fx_tt: "The People: §G-20§!\nThe Elite: §G-20§!\nEvery region of the Peoples: §G-20§!"
 COLDWAR_SU_the_presidential_constitution: "The Presidential Constitution"
 COLDWAR_SU_the_presidential_constitution_desc: "Tanks fire on the parliament building. Two months later the voters accept a constitution with a strong president."
 COLDWAR_SU_the_price_of_freedom: "The Price of Freedom"
 COLDWAR_SU_the_price_of_freedom_desc: "Freedom has come, but bread costs ten times what it cost last year. The reform cannot wait."
 COLDWAR_SU_the_rations_stop: "The Rations Stop"
 COLDWAR_SU_the_rations_stop_desc: "The Public Distribution System no longer delivers rice and maize to the cities. Workers are told to find food for themselves."
 COLDWAR_SU_the_red_directors: "The Red Directors"
 COLDWAR_SU_the_red_directors_desc: "The general directors of the great Kombinats run their plants like fiefdoms. The Committee lets them, as long as they deliver."
 COLDWAR_SU_the_referendum_on_the_union: "The Referendum on the Union"
 COLDWAR_SU_the_referendum_on_the_union_desc: "Do you consider it necessary to preserve the Union as a renewed federation of equal sovereign republics? Every republic must decide whether its citizens vote at all."
 COLDWAR_SU_the_republics_choice: "The Republics' Choice"
 COLDWAR_SU_the_republics_choice_desc: "Moscow no longer holds anyone. Every republic may go its own way, in peace."
 COLDWAR_SU_the_republics_choice_fx_tt: "Every region of the Peoples: §G-40§!"
 COLDWAR_SU_the_republics_under_the_committee: "The Republics Under the Committee"
 COLDWAR_SU_the_republics_under_the_committee_desc: "Fourteen capitals must learn who rules in Moscow now."
 COLDWAR_SU_the_ruble_zone: "The Ruble Zone"
 COLDWAR_SU_the_ruble_zone_desc: "Fifteen central banks print the same ruble. Somebody must decide who prints how much."
 COLDWAR_SU_the_russian_federation: "The Russian Federation"
 COLDWAR_SU_the_russian_federation_desc: "The tricolour flies over the Kremlin. Russia is a new state with an old army, an empty treasury and a new name."
 COLDWAR_SU_the_secession_law: "The Secession Law"
 COLDWAR_SU_the_secession_law_desc: "The law of April 1990 allows a republic to leave after a referendum and five years. The Baltic republics want to leave tomorrow."
 COLDWAR_SU_the_soviet_inheritance: "The Soviet Inheritance"
 COLDWAR_SU_the_soviet_inheritance_desc: "Thirty thousand warheads, the Black Sea Fleet and seventy billion dollars of debt. Somebody must take them over."
 COLDWAR_SU_the_soviet_oil_stops: "The Soviet Oil Stops"
 COLDWAR_SU_the_soviet_oil_stops_desc: "The tankers from Nakhodka no longer come. Moscow wants hard currency for its oil, and we have none. The power stations go dark one by one."
 COLDWAR_SU_the_thaw_from_above: "The Thaw from Above"
 COLDWAR_SU_the_thaw_from_above_desc: "The Committee itself opens the windows, carefully, one at a time."
 COLDWAR_SU_the_thaw_from_above_fx_tt: "The People: §R+10§!\nOpinion of the Western Bloc: §G+15§!"
 COLDWAR_SU_the_time_of_troubles: "The Time of Troubles"
 COLDWAR_SU_the_time_of_troubles_desc: "The shops are empty, the republics restless and the Politburo divided. For the first time since 1941 the leadership admits that the Union itself is in danger."
 COLDWAR_SU_the_time_of_troubles_fx_tt: "Pressure: §G-10§!"
 COLDWAR_SU_the_union_army: "The Union Army"
 COLDWAR_SU_the_union_army_desc: "Four million soldiers swore an oath to a state that has changed its name."
 COLDWAR_SU_the_union_economy: "The Union Economy"
 COLDWAR_SU_the_union_economy_desc: "The plan is dead, the market not yet born. The Union must choose its economy."
 COLDWAR_SU_the_union_institutions: "The Union Institutions"
 COLDWAR_SU_the_union_institutions_desc: "A Union of sovereign states needs institutions its states trust."
 COLDWAR_SU_the_union_of_sovereign_states: "The Union of Sovereign States"
 COLDWAR_SU_the_union_of_sovereign_states_desc: "The treaty is signed. The Union lives, but it is a different Union now."
 COLDWAR_SU_the_union_state: "The Union State"
 COLDWAR_SU_the_union_state_desc: "Minsk wants cheap gas and a big brother. We want a Union again, even if it is a small one."
 COLDWAR_SU_the_union_treaty_signed: "The Union Treaty Signed"
 COLDWAR_SU_the_union_treaty_signed_desc: "The treaty lies ready in the Kremlin. Every republic must sign it or leave in peace."
 COLDWAR_SU_the_yeltsin_question: "The Yeltsin Question"
 COLDWAR_SU_the_yeltsin_question_desc: "The President of Russia stood on a tank and called the Committee a junta. He is still in the White House, and Moscow is watching."
 COLDWAR_SU_the_zero_option: "The Zero Option"
 COLDWAR_SU_the_zero_option_desc: "Everyone who lives here on the day of independence is a citizen."
 COLDWAR_SU_three_ways_tt: "Shows the three ways out. §YOnly one can be taken.§!"
 COLDWAR_SU_tier_elite_0: "§GCollective Leadership§!"
 COLDWAR_SU_tier_elite_1: "§GCorridor Intrigue§!"
 COLDWAR_SU_tier_elite_2: "§YOpen Factions§!"
 COLDWAR_SU_tier_elite_3: "§RPlotting§!"
 COLDWAR_SU_tier_elite_4: "§RConspiracy§!"
 COLDWAR_SU_tier_people_0: "§GQuiet Patience§!"
 COLDWAR_SU_tier_people_1: "§GGrumbling in the Queues§!"
 COLDWAR_SU_tier_people_2: "§YKitchen-Table Anger§!"
 COLDWAR_SU_tier_people_3: "§RStrikes and Riots§!"
 COLDWAR_SU_tier_people_4: "§RRevolutionary Situation§!"
 COLDWAR_SU_tier_peoples_0: "§GFriendship of Peoples§!"
 COLDWAR_SU_tier_peoples_1: "§GQuiet Resentment§!"
 COLDWAR_SU_tier_peoples_2: "§YNational Awakening§!"
 COLDWAR_SU_tier_peoples_3: "§RPopular Fronts§!"
 COLDWAR_SU_tier_peoples_4: "§RParade of Sovereignties§!"
 COLDWAR_SU_to_almaata_tt: "The region [COLDWAR_SU_GetRegT]: §R+6§!\nUnrest in [?COLDWAR_SU_ssr_t.GetName]: §R+8§!"
 COLDWAR_SU_to_chain_tt: "The region [COLDWAR_SU_GetRegT]: §R+5§!"
 COLDWAR_SU_to_chechnya_tt: "The region [COLDWAR_SU_GetRegT]: §R+5§!\n§RChechnya rises:§! the Chechen Republic of Ichkeria is released with the Soviet arsenals of Grozny and strong defence bonuses"
 COLDWAR_SU_to_fronts_tt: "The region [COLDWAR_SU_GetRegT]: §R+8§!\nAn AI republic in the region declares its sovereignty"
