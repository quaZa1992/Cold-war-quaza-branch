 COLDWAR_SU_debt_choice_tt: "Shows the choice between default and the IMF"
 COLDWAR_SU_debt_taken_tt: "Moscow takes over the whole Soviet debt"
 COLDWAR_SU_dec_advisor: "Request a Report from the KGB"
 COLDWAR_SU_dec_advisor_desc: "The Committee for State Security sees the queues, the corridors of the ministries and the kitchens of Tbilisi and Vilnius. Its chairman can tell us where the danger comes from and what would help most right now."
 COLDWAR_SU_dec_advisor_tt: "The KGB reports which camp and which cause drive the crisis and which measure helps most right now."
 COLDWAR_SU_dec_amnesty: "Political Amnesty"
 COLDWAR_SU_dec_amnesty_desc: "Political prisoners are released from the camps of Perm and Mordovia."
 COLDWAR_SU_dec_antialc: "Anti-Alcohol Campaign"
 COLDWAR_SU_dec_antialc_desc: "Vodka prices up, shops closed, vineyards cut down. The workers are sober, but the treasury loses a large share of its income."
 COLDWAR_SU_dec_army: "Pay the Army"
 COLDWAR_SU_dec_army_desc: "New flats for officers, more money for the General Staff and its programmes."
 COLDWAR_SU_dec_congress: "Convene a Party Congress"
 COLDWAR_SU_dec_congress_desc: "The delegates of the CPSU meet in the Kremlin Palace of Congresses. The Central Committee is renewed and the line is confirmed."
 COLDWAR_SU_dec_consumer: "Consumer Goods Priority"
 COLDWAR_SU_dec_consumer_desc: "Group B before Group A: fridges, shoes and televisions before tanks and turbines."
 COLDWAR_SU_dec_discipline: "Discipline Campaign"
 COLDWAR_SU_dec_discipline_desc: "Raids in cinemas and bath houses, managers in court, ministers retired. Andropov's medicine for a lazy apparatus."
 COLDWAR_SU_dec_freeze: "Price Freeze"
 COLDWAR_SU_dec_freeze_desc: "The state keeps bread, meat and milk at the prices of 1962 and pays the difference out of the budget."
 COLDWAR_SU_dec_invest: "Union Investment: [FROM.GetName]"
 COLDWAR_SU_dec_invest_desc: "A new plant, a dam or a university for one republic, paid from the Union budget."
 COLDWAR_SU_dec_kgb: "Feed the KGB"
 COLDWAR_SU_dec_kgb_desc: "More officers, more informers and new technology for the Committee for State Security."
 COLDWAR_SU_dec_martial: "Declare Martial Law"
 COLDWAR_SU_dec_martial_desc: "Tanks on the boulevards of the big cities. The army takes over from the militia."
 COLDWAR_SU_dec_negotiate: "Negotiate with the Strikers"
 COLDWAR_SU_dec_negotiate_desc: "The government signs with the strike committees: soap, meat, housing and the right to elect their own union."
 COLDWAR_SU_dec_price: "Price Reform"
 COLDWAR_SU_dec_price_desc: "Food subsidies are cut to balance the budget, as in Novocherkassk in 1962."
 COLDWAR_SU_dec_propaganda: "Party Propaganda Campaign"
 COLDWAR_SU_dec_propaganda_desc: "Pravda, television and the factory meetings praise the achievements of developed socialism."
 COLDWAR_SU_dec_rehab: "Rehabilitate a People"
 COLDWAR_SU_dec_rehab_desc: "Crimean Tatars, Volga Germans and Meskhetian Turks may return. The declaration of the Supreme Soviet admits the injustice of the deportations."
 COLDWAR_SU_dec_rights: "Sovereign Rights: [FROM.GetName]"
 COLDWAR_SU_dec_rights_desc: "A republic gets control of its own budget, its schools and its language. Moscow keeps the army and foreign policy."
 COLDWAR_SU_dec_silence: "Silence the Dissidents"
 COLDWAR_SU_dec_silence_desc: "Psychiatric hospitals, internal exile and labour camps for the dissidents. Some of them are never seen again."
 COLDWAR_SU_dec_wages: "Raise Wages"
 COLDWAR_SU_dec_wages_desc: "Higher wages and bonuses for the workers of the large plants. The money is printed faster than the goods are made."
 COLDWAR_SU_default_on_the_bonds: "Default on the Bonds"
 COLDWAR_SU_default_on_the_bonds_desc: "On the seventeenth of August the government stops paying. The ruble loses two thirds of its value, imports collapse, and Russian factories finally have no competition."
 COLDWAR_SU_default_on_the_bonds_fx_tt: "Opinion of the Western Bloc: §R-10§!"
 COLDWAR_SU_dem_power_tt: "Power goes to the stronger of the §YCommittee for Human Rights§! and the §YUnion of Democratic Socialists§!"
 COLDWAR_SU_deter_op_tt: "Opinion of the Western Bloc and Russia: §R-40§!"
 COLDWAR_SU_disarm_aid_tt: "Disarmament aid: Treasury §G+0.5%§! of GDP every year for §Y5§! years"
 COLDWAR_SU_dual_power: "Dual Power"
 COLDWAR_SU_dual_power_desc: "The president rules by decree, the Supreme Soviet repeals his decrees. Russia has two governments and no constitution."
 COLDWAR_SU_each_decides_tt: "Every Union republic decides for itself."
 COLDWAR_SU_end_1_desc: "The Union Treaty has been signed. The Soviet Union lives on as a federation of sovereign republics with a president at its head."
 COLDWAR_SU_end_1_option: "A new Union."
 COLDWAR_SU_end_1_title: "A Renewed Union"
 COLDWAR_SU_end_2_desc: "The State Committee rules the Soviet Union. The republics have been brought back into line by force, the reforms are over and the borders are closed again."
 COLDWAR_SU_end_2_option: "The bear is awake."
 COLDWAR_SU_end_2_title: "The Iron Order in Moscow"
 COLDWAR_SU_end_3_desc: "The leaders of the republics have signed the end of the Soviet Union. A Commonwealth of Independent States takes its place, led by the new Russian Federation. The red flag has come down over the Kremlin."
 COLDWAR_SU_end_3_option: "The end of an era."
 COLDWAR_SU_end_3_title: "The Commonwealth of Independent States"
 COLDWAR_SU_end_4_desc: "The Soviet Union has ceased to exist. Its republics are independent states, its army is divided and its successor in Moscow calls itself the Russian Federation. The bloc that ruled half of Europe for forty years is gone."
 COLDWAR_SU_end_4_option: "The end of an era."
 COLDWAR_SU_end_4_title: "The Soviet Union Dissolves"
 COLDWAR_SU_end_collapse_tt: "§REnd of the Union: Collapse.§! Every remaining republic leaves, the ladder after the Union starts everywhere."
 COLDWAR_SU_end_commonwealth_tt: "§YEnd of the path: Commonwealth.§! The Soviet Union ends. Russia and every former republic go through the ladder after the Union, the economic cycle is locked for 1 year, and every fraternal country gets §RThe World Turned Upside Down§!."
 COLDWAR_SU_end_federation_tt: "§YEnd of the path: Federation.§! The Soviet Union lives on as a renewed Union. The fraternal countries get §YMoscow Turns Inward§!, the Doctrine becomes Restraint."
 COLDWAR_SU_end_junta_tt: "§YEnd of the path: Junta.§! The Committee rules. Siege Economy, the Brezhnev Doctrine, and the fraternal countries get §YThe Iron Fist Returns§!."
 COLDWAR_SU_europe_offer_tt: "§YThe United States§! decides on our request to the West"
 COLDWAR_SU_exile_the_ringleaders: "Exile the Ringleaders"
 COLDWAR_SU_exile_the_ringleaders_desc: "A few dozen leaders are put on planes to the West. The rest are warned, and most of them understand."
 COLDWAR_SU_exile_the_ringleaders_fx_tt: "Pressure: §G-5§!\nOpinion of the Western Bloc: §R-10§!"
 COLDWAR_SU_felix_comes_down: "Felix Comes Down"
 COLDWAR_SU_felix_comes_down_desc: "On the night of 22 August the crowd on Lubyanka Square watched a crane lift Iron Felix off his plinth. The Committee he founded must now be broken into pieces we can control."
 COLDWAR_SU_felix_comes_down_fx_tt: "KGB opinion: §R-15§!"
 COLDWAR_SU_fill_the_camps: "Fill the Camps"
 COLDWAR_SU_fill_the_camps_desc: "Every name on the list is arrested in one night. The camps of the Gulag are opened again."
 COLDWAR_SU_fill_the_camps_fx_tt: "The People: §R+10§!\nPressure: §G-15§!\nOpinion of the Western Bloc: §R-20§!"
 COLDWAR_SU_fleet_lease_tt: "Russia keeps the whole fleet and pays the lease"
 COLDWAR_SU_fleet_offer_tt: "§YUkraine§! is offered a share of the Black Sea Fleet"
 COLDWAR_SU_fleet_take_tt: "We receive §Y15%§! of the Soviet navy"
 COLDWAR_SU_force_accept_tt: "§YIf a republic submits:§! its Unrest §G-10§!, it stays in the Union and gets no share of the army later"
 COLDWAR_SU_force_reject_tt: "§YIf a republic resists:§! it leaves the Union with its share of the army, and Moscow decides whether to send the army"
 COLDWAR_SU_fragile_federation_ssr: "A Fragile Federation"
 COLDWAR_SU_fragile_federation_ssr_desc: ""
 COLDWAR_SU_freeze_later_tt: "After §Y2 years§! the frozen prices break: Inflation pressure §R+15%§!"
 COLDWAR_SU_fund_radio: "Fund the Broadcasters"
 COLDWAR_SU_fund_radio_desc: "Radio Liberty, Radio Free Europe and the Voice of America broadcast in Russian, Ukrainian and the Baltic languages. More transmitters, more programmes, more listeners."
 COLDWAR_SU_fund_radio_tt: "For §Y365§! days, every month:\nThe People of the Soviet Union: §Y+0.06§!, the Baltic region twice\nReduced by Soviet Information: Sealed §Y×0.3§!, Managed §Y×0.6§!, Glasnost §Y×1§!\nAll Western broadcasters together at most §Y+0.30§!"
 COLDWAR_SU_gc_freeze: "Soviet Union: Freeze The Unbreakable Union"
 COLDWAR_SU_gc_freeze_desc: "Use this when the player of the Soviet Union misses a session."
 COLDWAR_SU_gc_freeze_tt: "§YWhile frozen:§! the camps, the regions and Pressure do not change, no crisis starts and the AI takes no decisions of the system."
 COLDWAR_SU_gc_unfreeze: "Soviet Union: Unfreeze The Unbreakable Union"
 COLDWAR_SU_gc_unfreeze_desc: "The camps continue from their current values with the next monthly update. Nothing is caught up."
 COLDWAR_SU_getadvrec2_amnesty: "If that is not possible: §YPolitical Amnesty§!"
 COLDWAR_SU_getadvrec2_army: "If that is not possible: §YPay the Army§!"
 COLDWAR_SU_getadvrec2_congress: "If that is not possible: §YConvene a Party Congress§!"
 COLDWAR_SU_getadvrec2_consumer: "If that is not possible: §YConsumer Goods Priority§!"
 COLDWAR_SU_getadvrec2_discipline: "If that is not possible: §YDiscipline Campaign§!"
 COLDWAR_SU_getadvrec2_freeze: "If that is not possible: §YPrice Freeze§!"
 COLDWAR_SU_getadvrec2_invest: "If that is not possible: §YUnion Investment§!"
 COLDWAR_SU_getadvrec2_kgb: "If that is not possible: §YFeed the KGB§!"
 COLDWAR_SU_getadvrec2_martial: "If that is not possible: §YDeclare Martial Law§!"
 COLDWAR_SU_getadvrec2_negotiate: "If that is not possible: §YNegotiate with the Strikers§!"
 COLDWAR_SU_getadvrec2_none: ""
 COLDWAR_SU_getadvrec2_propaganda: "If that is not possible: §YParty Propaganda Campaign§!"
 COLDWAR_SU_getadvrec2_rehab: "If that is not possible: §YRehabilitate a People§!"
 COLDWAR_SU_getadvrec2_rights: "If that is not possible: §YSovereign Rights§!"
 COLDWAR_SU_getadvrec2_silence: "If that is not possible: §YSilence the Dissidents§!"
 COLDWAR_SU_getadvrec2_wages: "If that is not possible: §YRaise Wages§!"
 COLDWAR_SU_getadvrec_amnesty: "§YPolitical Amnesty§!: Releasing some of the prisoners lets the steam out before the boiler bursts. The West will approve."
 COLDWAR_SU_getadvrec_army: "§YPay the Army§!: The officers must be satisfied. New flats and new programmes keep the General Staff loyal."
 COLDWAR_SU_getadvrec_congress: "§YConvene a Party Congress§!: A Party Congress renews the Central Committee and confirms the line. Afterwards nobody can say that the leadership is divided."
 COLDWAR_SU_getadvrec_consumer: "§YConsumer Goods Priority§!: Fridges and televisions in the shops answer the Western broadcasts better than any speech."
 COLDWAR_SU_getadvrec_discipline: "§YDiscipline Campaign§!: A few ministers and managers in court remind the apparatus who is in charge."
 COLDWAR_SU_getadvrec_freeze: "§YPrice Freeze§!: Bread, meat and milk at the old prices take the sting out of the shortages."
 COLDWAR_SU_getadvrec_invest: "§YUnion Investment§!: A new plant or a university in the restless republics shows them that Moscow cares. Choose the republic in [Root.COLDWAR_SU_GetAdvRegion]."
 COLDWAR_SU_getadvrec_kgb: "§YFeed the KGB§!: Give us more officers and better equipment, Comrade, and we will keep the apparatus loyal."
 COLDWAR_SU_getadvrec_martial: "§YDeclare Martial Law§!: The army must take over the streets. It will cost us dearly abroad, but order comes first."
 COLDWAR_SU_getadvrec_negotiate: "§YNegotiate with the Strikers§!: Sign with the strike committees now, while they still ask for soap and meat and not for our heads."
 COLDWAR_SU_getadvrec_none: "Everything sensible is already under way. We will keep watching."
 COLDWAR_SU_getadvrec_propaganda: "§YParty Propaganda Campaign§!: The people must hear about the achievements of developed socialism again, every day, on every channel."
 COLDWAR_SU_getadvrec_rehab: "§YRehabilitate a People§!: Admitting the injustice of the deportations takes the strongest argument away from the nationalists."
 COLDWAR_SU_getadvrec_rights: "§YSovereign Rights§!: Give a restless republic control of its own budget and schools before it takes them. Choose one in [Root.COLDWAR_SU_GetAdvRegion]."
 COLDWAR_SU_getadvrec_silence: "§YSilence the Dissidents§!: The ringleaders must disappear into the camps and the psychiatric hospitals before others follow them. If it becomes known, the West will make a scandal of it."
 COLDWAR_SU_getadvrec_wages: "§YRaise Wages§!: Higher wages and bonuses for the large plants buy us time, even if they feed the hidden inflation."
 COLDWAR_SU_hold_the_republics_by_force: "Hold the Republics by Force"
 COLDWAR_SU_hold_the_republics_by_force_desc: "The Committee sends the paratroopers to Vilnius, Riga and Tbilisi. Every republic must submit or resist."
 COLDWAR_SU_hold_the_republics_by_force_fx_tt: "Every region of the Peoples: §G-30§!\nPressure: §R+20§!"
