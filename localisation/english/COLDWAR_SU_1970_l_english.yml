 COLDWAR_SU_vouchers_for_every_citizen: "Vouchers for Every Citizen"
 COLDWAR_SU_vouchers_for_every_citizen_desc: "Every citizen gets a voucher worth ten thousand rubles, enough for two Volgas, or for a bottle of vodka at the station."
 COLDWAR_SU_wages_unpaid: "Wages Unpaid"
 COLDWAR_SU_wages_unpaid_desc: "Miners in the Kuzbass have not seen a ruble since spring, teachers are paid in vodka and the officers moonlight as guards. The state must choose between the printing press and barter."
 COLDWAR_SU_west_aid: "Western Partnership"
 COLDWAR_SU_west_aid_desc: ""
 COLDWAR_SU_west_category: "The Soviet Question"
 COLDWAR_SU_west_category_desc: "Decisions that bear on the Soviet Union and its successor states."
 COLDWAR_SU_which_way: "Which Way?"
 COLDWAR_SU_which_way_desc: "East, West or alone: every successor state must find its place."
 COLDWAR_SU_which_way_out: "Which Way Out?"
 COLDWAR_SU_which_way_out_desc: "Three ways lead out of the crisis: a new treaty for the Union, a state of emergency, or a Russia that stops paying for the others. Only one can be taken."
 COLDWAR_SU_who_owns_russia: "Who Owns Russia?"
 COLDWAR_SU_who_owns_russia_desc: "Seven bankers boast that they control half of the economy. The government needs them, and they know it."
 COLDWAR_SU_winter_tt: "Pressure does not change for §Y2§! years. Afterwards: Pressure §R+30§!"
