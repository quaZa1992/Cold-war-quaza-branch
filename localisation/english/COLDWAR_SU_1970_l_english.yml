 COLDWAR_SU_nunn_lugar: "Nunn-Lugar"
 COLDWAR_SU_nunn_lugar_desc: "Our warheads sit in silos guarded by unpaid soldiers. The American senators offer money to keep them safe, and to count them."
 COLDWAR_SU_nunn_lugar_tt: "§YThe United States§! decide whether to fund the safety of our arsenal.\nIf they accept: they pay §R1%§! of their GDP, we get §G1%§! of our GDP, §YBrain Drain§! ends and the Western Bloc likes us more (§G+10§!). We get §YInspectors at the Silos§! (War Support §R-3%§! for 5 years).\nIf they refuse: nothing happens."
