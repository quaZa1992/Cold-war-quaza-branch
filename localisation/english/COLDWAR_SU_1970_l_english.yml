 COLDWAR_SU_co_opt_the_reformers: "Co-opt the Reformers"
 COLDWAR_SU_co_opt_the_reformers_desc: "The best of the reformers may work for the Committee, as long as they keep quiet about politics."
 COLDWAR_SU_co_opt_the_reformers_fx_tt: "Pressure: §R+10§!\nArmy opinion: §R-10§!"
 COLDWAR_SU_codes_tt: "The warheads stay, without the launch codes. §YBreak the Codes§! takes §Y5§! years at §R2%§! of GDP per year."
 COLDWAR_SU_conversion_of_the_defence_complex: "Conversion of the Defence Complex"
 COLDWAR_SU_conversion_of_the_defence_complex_desc: "Tank plants are to build tractors, missile works refrigerators. The generals protest, the housewives do not."
