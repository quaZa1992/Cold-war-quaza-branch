 COLDWAR_SU_offer_arms_control_desc: "We propose a treaty to the United States that slows the arms race on both sides."
 COLDWAR_SU_offer_arms_tt: "§YThe United States§! decides within §Y20§! days.\n§YIf it accepts:§! the arms race counts only half for §Y730§! days, Cold War Tension §G-5§!\n§YIf it refuses:§! our propaganda uses it, the People §G-5§!"
 COLDWAR_SU_offer_him_a_post: "Offer Him a Post"
 COLDWAR_SU_offer_him_a_post_desc: "A ministry, a dacha and a place in the Committee's government. Yeltsin is ambitious; perhaps he can be bought."
 COLDWAR_SU_offer_him_a_post_fx_tt: "The People: §G-5§!\nPressure: §R+5§!"
