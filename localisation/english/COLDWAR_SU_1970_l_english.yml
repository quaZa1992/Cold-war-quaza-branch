 COLDWAR_SU_break_codes_mission_desc: "Our engineers work on the Soviet launch locks."
 COLDWAR_SU_break_codes_tt: "Costs §R2%§! of GDP per year, paid every month, for §Y5§! years.\nAfterwards the warheads on our soil become usable nuclear weapons."
 COLDWAR_SU_break_the_oligarchs: "Break the Oligarchs"
 COLDWAR_SU_break_the_oligarchs_desc: "Tax inspectors and masked policemen visit the banks. The oligarchs may keep their money if they leave politics."
 COLDWAR_SU_break_the_oligarchs_fx_tt: "Opinion of the Western Bloc: §R-10§!"
 COLDWAR_SU_breaking_the_siege: "Breaking the Siege"
 COLDWAR_SU_breaking_the_siege_desc: "The West has closed its markets. The South has not."
 COLDWAR_SU_building_a_state: "Building a State"
 COLDWAR_SU_building_a_state_desc: "A foreign ministry in a former party school, a customs service in a railway carriage."
 COLDWAR_SU_building_an_army: "Building an Army"
 COLDWAR_SU_building_an_army_desc: "Our soldiers swore an oath to the Soviet Union. Now they must swear another one."
 COLDWAR_SU_c1_av_tt: "No other way out chosen, and the Peoples at least §Y50§! or three republics have declared sovereignty"
 COLDWAR_SU_c4_av_tt: "Ukraine and Belarus have left the Union"
