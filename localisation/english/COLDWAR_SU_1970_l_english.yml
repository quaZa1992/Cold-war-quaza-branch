 COLDWAR_SU_cr_pause: "§gCrisis pause§!"
 COLDWAR_SU_crack_down_on_the_brigades: "Crack Down on the Brigades"
 COLDWAR_SU_crack_down_on_the_brigades_desc: "Special units of the interior ministry hunt the brigades through the cities. The prisons fill, and so do the cemeteries."
 COLDWAR_SU_crack_down_on_the_markets: "Crack Down on the Markets"
 COLDWAR_SU_crack_down_on_the_markets_desc: "Private trade is anti-socialist. The security service closes the markets and the traders go to the camps."
 COLDWAR_SU_credits_from_the_seven: "Credits from the Seven"
 COLDWAR_SU_credits_from_the_seven_desc: "The President of the Union flies to the summit of the seven richest states and asks for credits to save the reform."
 COLDWAR_SU_crisis_almaata: "December in Alma-Ata"
 COLDWAR_SU_crisis_almaata_desc: "Moscow has replaced the long serving first secretary of the republic with a Russian who has never lived there. Students gather on the main square in the frost."
 COLDWAR_SU_crisis_chain: "The Human Chain"
 COLDWAR_SU_crisis_chain_desc: "Two million people join hands from Tallinn through Riga to Vilnius, on the anniversary of the secret protocol of 1939. The whole world watches."
 COLDWAR_SU_crisis_chechnya: "The Chechen Revolution"
 COLDWAR_SU_crisis_chechnya_desc: "General Dudayev's National Congress of the Chechen People has stormed the Supreme Soviet in Grozny. Armed men guard the television centre, and the arsenals of the Soviet garrison are surrounded. The congress speaks of an independent Ichkeria."
 COLDWAR_SU_crisis_fronts: "The Popular Fronts"
 COLDWAR_SU_crisis_fronts_desc: "Writers, scientists and even party members have founded a Popular Front in support of reform. Within weeks it has more members than the party of the republic."
 COLDWAR_SU_crisis_generals: "The Generals Grumble"
 COLDWAR_SU_crisis_generals_desc: "The General Staff complains in closed letters that the party starves the army. Marshals speak of the betrayal of the soldiers."
 COLDWAR_SU_crisis_karabakh: "Karabakh"
 COLDWAR_SU_crisis_karabakh_desc: "The soviet of Nagorno-Karabakh has voted to join Armenia. In Yerevan hundreds of thousands march, in Sumgait a mob attacks Armenian families. Two Union republics turn against each other."
 COLDWAR_SU_crisis_kaunas: "Spring in Kaunas"
 COLDWAR_SU_crisis_kaunas_desc: "A student has burned himself in a park in Kaunas in protest against the occupation. At his funeral thousands of young people march through the city and shout for freedom."
 COLDWAR_SU_crisis_language: "The Language Protest"
 COLDWAR_SU_crisis_language_desc: "The new constitution of the republic drops the clause that makes the national language the state language. Students fill the main avenue of the capital and refuse to leave."
 COLDWAR_SU_crisis_letter: "A Letter to the Party"
 COLDWAR_SU_crisis_letter_desc: "A teacher from Leningrad has written an open letter: I cannot give up my principles. Half of the apparatus applauds, the other half calls it a manifesto against the line."
 COLDWAR_SU_crisis_miners: "The Miners Rise"
 COLDWAR_SU_crisis_miners_desc: "The miners of the Kuzbass and the Donbass have stopped work. They have no soap, no meat and no patience left, and their strike committees now speak of politics."
 COLDWAR_SU_crisis_mission_tt: "A crisis mission starts in the decisions tab §YThe Unbreakable Union§!. Answer it before the time runs out."
 COLDWAR_SU_crisis_plot: "The Plot"
 COLDWAR_SU_crisis_plot_desc: "KGB reports speak of meetings in dachas outside Moscow: marshals, ministers and secretaries of the Central Committee. Someone is preparing to remove the General Secretary."
 COLDWAR_SU_crisis_refuseniks: "The Refuseniks"
 COLDWAR_SU_crisis_refuseniks_desc: "Thousands of Soviet Jews have applied to emigrate to Israel and been refused. They lose their jobs, hold hunger strikes and talk to Western journalists. The American Congress links trade to the right to emigrate."
 COLDWAR_SU_crisis_samizdat: "Samizdat in Circulation"
 COLDWAR_SU_crisis_samizdat_desc: "Typewritten copies of Solzhenitsyn, the Chronicle of Current Events and foreign radio transcripts pass from hand to hand in the institutes and factories. The KGB counts thousands of copies."
 COLDWAR_SU_crisis_shelves: "Empty Shelves"
 COLDWAR_SU_crisis_shelves_desc: "Meat, sugar and washing powder have vanished from the state shops. Queues form before dawn and the kolkhoz markets set the real prices."
 COLDWAR_SU_crisis_strike: "Wildcat Strike"
 COLDWAR_SU_crisis_strike_desc: "Workers of a large locomotive plant have downed tools over new work norms and higher meat prices. They march to the party building of the city. Other plants are watching."
 COLDWAR_SU_crisis_succession: "The Succession Struggle"
 COLDWAR_SU_crisis_succession_desc: "The new General Secretary sits in the chair, but not yet on the throne. Every member of the Politburo counts his votes in the Central Committee."
 COLDWAR_SU_crisis_zinc: "Zinc Coffins"
 COLDWAR_SU_crisis_zinc_desc: "Sealed zinc coffins come home from the front. The families may not open them, and the gravestones may not say where the sons died."
