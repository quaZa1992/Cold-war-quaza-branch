 COLDWAR_SU_cis_offer_tt: "Every former Union republic is offered the §YCommonwealth of Independent States§!. Each partner decides for itself."
 COLDWAR_SU_citizenship_by_descent: "Citizenship by Descent"
 COLDWAR_SU_citizenship_by_descent_desc: "Only those who were citizens before 1940, and their children, are citizens now."
 COLDWAR_SU_citizenship_by_descent_fx_tt: "Opinion of the Western Bloc: §R-5§!"
