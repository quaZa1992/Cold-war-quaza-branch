 COLDWAR_SU_cas_loyal_tt: "Central Asia stays loyal: its region is set to §Y10§!"
 COLDWAR_SU_category: "The Unbreakable Union"
 COLDWAR_SU_category_desc: "The Union rests on three pillars: the People, who want bread and quiet, the Peoples of the fifteen republics, and the Elite of party, KGB and army. When a pillar cracks, its anger rises. When the anger is held down by force instead of being solved, it turns into Pressure."
 COLDWAR_SU_channel_one_for_the_kremlin: "Channel One for the Kremlin"
 COLDWAR_SU_channel_one_for_the_kremlin_desc: "The first channel returns to the state. The news will be calm again, and the money that fled may come back."
 COLDWAR_SU_che_wait_tt: "Chechnya stays independent for now. The decision §YRestore Constitutional Order in Chechnya§! remains open."
 COLDWAR_SU_che_war_now_tt: "§RWar with Chechnya§!\nThe People: §R+5§!"
 COLDWAR_SU_che_war_tt: "If an independent §YChechnya§! exists: §Rwar to take it back§!"
