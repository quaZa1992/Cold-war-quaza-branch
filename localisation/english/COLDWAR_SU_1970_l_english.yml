 COLDWAR_SU_purge_the_reformers: "Purge the Reformers"
 COLDWAR_SU_purge_the_reformers_desc: "The editors, the economists and the people's deputies of the reform years go to prison or abroad."
 COLDWAR_SU_purge_the_reformers_fx_tt: "KGB opinion: §G+15§!\nPolitburo Balance: §Y+0.2§! towards the Orthodox and the Siloviki"
