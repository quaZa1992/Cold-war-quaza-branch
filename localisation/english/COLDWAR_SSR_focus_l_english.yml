 COLDWAR_SSR_UZB_p2_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_UZB_p2_settlement:0 "A Free Republic"
 COLDWAR_SSR_UZB_p2_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_women_s_councils_of_uzbekistan_programme:0 "Women's Councils of Uzbekistan Programme"
 COLDWAR_SSR_UZB_p3_root:0 "The Women's Councils"
 COLDWAR_SSR_UZB_p3_root_desc:0 "Women's Councils were Soviet public institutions, not a single opposition party. In this counterfactual coalition, teachers, doctors, and local organizers gain a direct hand in public investment, while the state confronts unequal access to education and health outside major cities."
 COLDWAR_SSR_UZB_p3_civic:0 "A Labour Assembly"
 COLDWAR_SSR_UZB_p3_civic_desc:0 "Trade unions, professional associations and elected representatives will review the cabinet's programme. A broader labour mandate can protect reconstruction from a narrow party machine, while making national decisions slower and more difficult to settle."
 COLDWAR_SSR_UZB_p3_executive:0 "The Social Cabinet"
 COLDWAR_SSR_UZB_p3_executive_desc:0 "A disciplined social cabinet will coordinate enterprise reconstruction and essential services. Concentrated responsibility promises quicker action, while workers and rival parties must accept that many decisions will be taken by officials and technical managers."
 COLDWAR_SSR_UZB_p3_institution:0 "Rural Health Posts"
 COLDWAR_SSR_UZB_p3_institution_desc:0 "Local health posts train nurses and midwives and bring preventive care closer to villages. Families gain access to essential services, while staffing clinics across wide rural districts places a lasting burden on the public budget."
 COLDWAR_SSR_UZB_p3_public:0 "Women's Skills College"
 COLDWAR_SSR_UZB_p3_public_desc:0 "Public colleges will train women for nursing, teaching, textile engineering, and food processing, with placements near local services. Skilled work and household income grow, while safe transport, childcare, and rural staffing require public funds."
 COLDWAR_SSR_UZB_p3_market:0 "Women’s Work Charters"
 COLDWAR_SSR_UZB_p3_market_desc:0 "Factory and farm contracts will guarantee equal pay, apprenticeships, and safe access to skilled work for women. Employers gain a wider trained workforce, but enforcement and childcare bring costs smaller firms may resist."
 COLDWAR_SSR_UZB_p3_production:0 "Women’s Trade Halls"
 COLDWAR_SSR_UZB_p3_production_desc:0 "Training halls will prepare women for electrical repair, textile maintenance, and food plant supervision. More technicians can reduce factory downtime, though recruitment depends on housing, childcare, and reliable transport."
 COLDWAR_SSR_UZB_p3_consumer:0 "Rural Health Posts"
 COLDWAR_SSR_UZB_p3_consumer_desc:0 "Clinics and maternity services will bring nurses, midwives, and preventive care closer to village households. Public health improves and women’s employment expands, while staffing dispersed districts creates recurring costs."
 COLDWAR_SSR_UZB_p3_development:0 "Women's Workshops"
 COLDWAR_SSR_UZB_p3_development_desc:0 "Technical colleges and factories open paid apprenticeships to women in textile repair, food processing, and electrical work. Skilled employment expands, while childcare and transport services must keep pace with recruitment."
 COLDWAR_SSR_UZB_p3_universal:0 "Progressive Revenue"
 COLDWAR_SSR_UZB_p3_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_UZB_p3_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_UZB_p3_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_UZB_p3_enterprise_service:0 "Enterprise Services"
