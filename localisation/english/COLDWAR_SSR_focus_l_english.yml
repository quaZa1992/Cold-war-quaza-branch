 COLDWAR_SSR_KAZ_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_KAZ_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_spirit_of_alash_programme:0 "Spirit of Alash Programme"
 COLDWAR_SSR_KAZ_p2_root:0 "The Alash Legacy"
 COLDWAR_SSR_KAZ_p2_root_desc:0 "The Alash movement was a liberal-democratic national party and autonomy project in 1917-1920, not a 1970 organization. This counterfactual league revives its emphasis on constitutional government, education, and self-rule while facing a multiethnic society and a modern industrial economy."
 COLDWAR_SSR_KAZ_p2_civic:0 "Lustration"
 COLDWAR_SSR_KAZ_p2_civic_desc:0 "Party appointments and political police networks gave the old order an influence that survived the change of flag. Opening public offices to scrutiny will break those protections, while removing experienced personnel and deepening the bitterness of the transition."
 COLDWAR_SSR_KAZ_p2_executive:0 "Retain Technical Staff"
 COLDWAR_SSR_KAZ_p2_executive_desc:0 "The republic cannot rebuild every ministry and workshop from nothing. Experienced officials and engineers will remain in service under new authority, preserving expertise at the price of continued suspicion towards people whose careers were made under Soviet rule."
 COLDWAR_SSR_KAZ_p2_institution:0 "Rural Credit Zemstvo"
 COLDWAR_SSR_KAZ_p2_institution_desc:0 "Elected district councils support farm credit, veterinary services, and grain storage across the steppe. Rural producers gain practical authority, but a wide territory makes delivery expensive and slows central projects."
 COLDWAR_SSR_KAZ_p2_archives:0 "Open Party Archives"
 COLDWAR_SSR_KAZ_p2_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_KAZ_p2_public:0 "Alash Land Trusts"
 COLDWAR_SSR_KAZ_p2_public_desc:0 "A constitutional land trust will secure grazing routes and regulate leases through elected district councils. Local property rights gain protection, while the trust reconciles family claims with collective farms and industrial concessions."
 COLDWAR_SSR_KAZ_p2_market:0 "Steppe Credit Unions"
 COLDWAR_SSR_KAZ_p2_market_desc:0 "Independent credit unions will lend to family farms, veterinary services, and small workshops under public contract law. Local savings can fund practical improvements, but dispersed lending limits capital for large national projects."
 COLDWAR_SSR_KAZ_p2_production:0 "Rural Machinery"
 COLDWAR_SSR_KAZ_p2_production_desc:0 "District workshops will repair tractors, pumps, and freight equipment close to farms and mining settlements. Reliable machinery improves harvests and transport, while many small depots cost more to staff than a central combine."
 COLDWAR_SSR_KAZ_p2_consumer:0 "Public Schools"
 COLDWAR_SSR_KAZ_p2_consumer_desc:0 "Teacher colleges and rural schools will train local officials, engineers, and health workers for a republic spread across immense distances. Civic capacity grows beyond major cities, but salaries and transport delay other investment."
 COLDWAR_SSR_KAZ_p2_development:0 "Civic Training Schools"
 COLDWAR_SSR_KAZ_p2_development_desc:0 "Teacher colleges train local officials, engineers, and judges who can administer a republic beyond its largest cities. Education strengthens self-government, but graduates take years to staff the institutions they are meant to build."
 COLDWAR_SSR_KAZ_p2_universal:0 "Low Business Levies"
 COLDWAR_SSR_KAZ_p2_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_KAZ_p2_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_KAZ_p2_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_KAZ_p2_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_KAZ_p2_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_KAZ_p2_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_KAZ_p2_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_KAZ_p2_settlement:0 "A Free Republic"
 COLDWAR_SSR_KAZ_p2_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_earth_bow_to_man_programme:0 "Earth, Bow to Man! Programme"
 COLDWAR_SSR_KAZ_p3_root:0 "Humanist Republic"
 COLDWAR_SSR_KAZ_p3_root_desc:0 "Kazakhstan’s 1960s writers, scientists, and environmental thinkers offer a humanist basis for a counterfactual government after independence. It would join public health and scientific knowledge to accountable decisions about land and industry, without claiming a later mass movement already existed."
 COLDWAR_SSR_KAZ_p3_civic:0 "A Labour Assembly"
 COLDWAR_SSR_KAZ_p3_civic_desc:0 "Trade unions, professional associations and elected representatives will review the cabinet's programme. A broader labour mandate can protect reconstruction from a narrow party machine, while making national decisions slower and more difficult to settle."
 COLDWAR_SSR_KAZ_p3_executive:0 "The Social Cabinet"
 COLDWAR_SSR_KAZ_p3_executive_desc:0 "A disciplined social cabinet will coordinate enterprise reconstruction and essential services. Concentrated responsibility promises quicker action, while workers and rival parties must accept that many decisions will be taken by officials and technical managers."
 COLDWAR_SSR_KAZ_p3_institution:0 "Health Survey Service"
 COLDWAR_SSR_KAZ_p3_institution_desc:0 "Doctors and local officials document illness, soil damage, and water safety around military and industrial sites. Better records guide clinics and future investment, while publication can expose the state to demands it cannot quickly meet."
 COLDWAR_SSR_KAZ_p3_public:0 "Clean Industry Board"
 COLDWAR_SSR_KAZ_p3_public_desc:0 "A public board will inspect mines, military sites, water, and soil before approving new industrial works. Better evidence supports safer investment and local health, but remediation and compliance raise extraction costs."
 COLDWAR_SSR_KAZ_p3_market:0 "Repair Cooperatives"
 COLDWAR_SSR_KAZ_p3_market_desc:0 "Worker and community cooperatives will repair equipment, reclaim damaged land, and serve mining settlements. Local knowledge improves practical recovery, while shared ownership complicates large-scale financing and public accountability."
 COLDWAR_SSR_KAZ_p3_production:0 "Mine Safety Teams"
 COLDWAR_SSR_KAZ_p3_production_desc:0 "Permanent teams will survey shafts, tailings, and power lines and train crews in prevention. Fewer interruptions protect skilled employment, although inspection and repairs absorb funds that could raise raw output."
 COLDWAR_SSR_KAZ_p3_consumer:0 "Rural Health Posts"
 COLDWAR_SSR_KAZ_p3_consumer_desc:0 "Clinics and mobile medical teams will serve mining settlements and distant agricultural districts. Better access protects households and workers, but operating costs recur across a very large territory."
 COLDWAR_SSR_KAZ_p3_development:0 "Clean Industry Grants"
 COLDWAR_SSR_KAZ_p3_development_desc:0 "Public grants help workshops and mines adopt safer processes and repair contaminated land. Health and productivity improve over time, but environmental safeguards raise near-term costs and slow extraction-led growth."
 COLDWAR_SSR_KAZ_p3_universal:0 "Progressive Revenue"
 COLDWAR_SSR_KAZ_p3_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_KAZ_p3_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_KAZ_p3_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_KAZ_p3_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_KAZ_p3_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_KAZ_p3_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_KAZ_p3_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_KAZ_p3_settlement:0 "A Social Republic"
 COLDWAR_SSR_KAZ_p3_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_name_kazakh_land_programme:0 "Kazakh Land Programme"
 COLDWAR_SSR_KAZ_p20_root:0 "Land and Nation"
 COLDWAR_SSR_KAZ_p20_root_desc:0 "Kazakh Land is a counterfactual rural coalition whose politics arise from land use, settlement, and local administration across a large multiethnic republic. It must defend Kazakh-language civic life without turning statehood into a contest over who belongs."
 COLDWAR_SSR_KAZ_p20_civic:0 "Independent Courts"
 COLDWAR_SSR_KAZ_p20_civic_desc:0 "Public authority must answer to law rather than another circle of personal appointments. Independent courts will protect commercial and civil rights, requiring the executive to accept scrutiny and finance institutions beyond its direct political control."
 COLDWAR_SSR_KAZ_p20_executive:0 "Professional Service"
 COLDWAR_SSR_KAZ_p20_executive_desc:0 "Experienced civil servants will carry administrative responsibility while elected leaders settle the national programme. A professional service can bring order to government, but it gives less influence to outsiders impatient for a complete political break."
 COLDWAR_SSR_KAZ_p20_institution:0 "Pasture Water Boards"
 COLDWAR_SSR_KAZ_p20_institution_desc:0 "Local boards balance grazing, irrigation, and settlement needs before land is leased for industry. Rural communities gain a voice and long-term productivity improves, while mining and large farm projects face more limits."
 COLDWAR_SSR_KAZ_p20_public:0 "Pasture Commons"
 COLDWAR_SSR_KAZ_p20_public_desc:0 "Legally protected grazing and water commons will give local communities a voice before land is committed to mines or large farms. Stewardship strengthens rural confidence, while industrial leases require more negotiation."
 COLDWAR_SSR_KAZ_p20_market:0 "Land Lease Code"
 COLDWAR_SSR_KAZ_p20_market_desc:0 "A transparent lease code will let farms and workshops invest in land and equipment without surrendering civic oversight. Clear contracts support smaller producers, but commercial access may favour well-capitalised districts."
 COLDWAR_SSR_KAZ_p20_production:0 "Steppe Repair Shops"
 COLDWAR_SSR_KAZ_p20_production_desc:0 "Regional workshops will maintain farm machinery, rail equipment, and vehicles near the communities that use them. Local employment and supply resilience increase, though dispersed production costs more than a central factory."
 COLDWAR_SSR_KAZ_p20_consumer:0 "Village Stores"
 COLDWAR_SSR_KAZ_p20_consumer_desc:0 "Cooperative storage, milling, and livestock services will bring everyday goods to rural districts. Household supply improves and producers retain more value, while concentrated heavy investment proceeds more slowly."
 COLDWAR_SSR_KAZ_p20_development:0 "Steppe Repair Works"
 COLDWAR_SSR_KAZ_p20_development_desc:0 "Regional workshops repair farm machinery, rail equipment, and vehicles closer to the communities that use them. Rural employment and supply resilience increase, though dispersed production costs more than centralized factory output."
 COLDWAR_SSR_KAZ_p20_universal:0 "Low Business Levies"
 COLDWAR_SSR_KAZ_p20_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_KAZ_p20_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_KAZ_p20_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_KAZ_p20_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_KAZ_p20_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_KAZ_p20_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_KAZ_p20_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_KAZ_p20_settlement:0 "A Free Republic"
 COLDWAR_SSR_KAZ_p20_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_UZB_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_UZB_regional_review_desc:0 "The economy of Uzbek SSR has grown around cotton specialisation, irrigation and union industrial inputs. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_UZB_regional_orders:0 "Cotton Processing"
 COLDWAR_SSR_UZB_regional_orders_desc:0 "Cotton Processing draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_UZB_regional_diversify:0 "Food and Textiles"
 COLDWAR_SSR_UZB_regional_diversify_desc:0 "Food and Textile Balance will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
 COLDWAR_SSR_UZB_regional_standards_replace_tt:0 "Replace §YCotton and Irrigation Dependence§! with §YManaged Cotton and Irrigation Dependence§!"
 COLDWAR_SSR_UZB_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_UZB_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_name_communist_party_of_uzbekistan_programme:0 "Communist Party of Uzbekistan Programme"
 COLDWAR_SSR_UZB_p4_root:0 "Workers' Republic"
 COLDWAR_SSR_UZB_p4_root_desc:0 "The Communist Party of Uzbekistan oversees cotton, irrigation, and industry supplied through Union ministries. Independence would make the costs of water use and crop specialization visible, while food supply and textile processing compete for land and investment."
 COLDWAR_SSR_UZB_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_UZB_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_UZB_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_UZB_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_UZB_p4_institution:0 "Cotton to Cloth"
 COLDWAR_SSR_UZB_p4_institution_desc:0 "Textile mills process more cotton inside the republic instead of shipping raw fibre to distant factories. Skilled employment and value added rise, but the programme preserves heavy water demand and dependence on the crop."
 COLDWAR_SSR_UZB_p4_public:0 "State Investment"
 COLDWAR_SSR_UZB_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_UZB_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_UZB_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
 COLDWAR_SSR_UZB_p4_production:0 "Strategic Workshops"
 COLDWAR_SSR_UZB_p4_production_desc:0 "A strategic workshop programme will give public armaments enterprises the facilities needed to honour national orders. Its maintenance and power needs will remain a public obligation even when demand becomes less favourable."
 COLDWAR_SSR_UZB_p4_consumer:0 "Cooperative Supply"
 COLDWAR_SSR_UZB_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_UZB_p4_development:0 "Food Crop Rotation"
 COLDWAR_SSR_UZB_p4_development_desc:0 "Agronomists and farm managers shift selected acreage toward food crops and restore irrigation channels. Household supply and soil quality improve, but export cotton receipts fall during the transition."
 COLDWAR_SSR_UZB_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_UZB_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
 COLDWAR_SSR_UZB_p4_targeted:0 "Targeted Provision"
 COLDWAR_SSR_UZB_p4_targeted_desc:0 "Support will be concentrated on households and services most exposed to hardship. A narrower commitment can improve public finances, while requiring a larger administrative effort and accepting less universal protection."
 COLDWAR_SSR_UZB_p4_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_UZB_p4_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_UZB_p4_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_UZB_p4_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_UZB_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_UZB_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_writers_union_of_uzbekistan_programme:0 "Writers' Union of Uzbekistan Programme"
 COLDWAR_SSR_UZB_p1_root:0 "Literary Council"
 COLDWAR_SSR_UZB_p1_root_desc:0 "The Writers' Union offers an institutional base for Uzbek-language literature, education, and public history. A counterfactual civic government can protect those institutions, but its legitimacy depends on a shared state for Uzbek, Tajik, Russian, and other communities."
 COLDWAR_SSR_UZB_p1_civic:0 "Independent Courts"
 COLDWAR_SSR_UZB_p1_civic_desc:0 "Public authority must answer to law rather than another circle of personal appointments. Independent courts will protect commercial and civil rights, requiring the executive to accept scrutiny and finance institutions beyond its direct political control."
 COLDWAR_SSR_UZB_p1_executive:0 "Professional Service"
 COLDWAR_SSR_UZB_p1_executive_desc:0 "Experienced civil servants will carry administrative responsibility while elected leaders settle the national programme. A professional service can bring order to government, but it gives less influence to outsiders impatient for a complete political break."
 COLDWAR_SSR_UZB_p1_institution:0 "Rural Teacher Colleges"
 COLDWAR_SSR_UZB_p1_institution_desc:0 "Teacher colleges and libraries expand Uzbek-language education while preserving instruction for regional communities. Literacy and public administration improve, though remote districts need costly staffing and transport support."
 COLDWAR_SSR_UZB_p1_public:0 "Language Schools Act"
 COLDWAR_SSR_UZB_p1_public_desc:0 "Public teacher colleges and libraries will expand Uzbek-language education while retaining technical instruction in Russian. Wider literacy strengthens civic administration, but staffing and translation across remote districts costs time and money."
 COLDWAR_SSR_UZB_p1_market:0 "Local Milling Rights"
 COLDWAR_SSR_UZB_p1_market_desc:0 "Municipal firms and farm cooperatives will gain rights to mill, store, and sell food near growing towns. Local supply becomes less dependent on distant deliveries, while small operators need credit and reliable transport."
 COLDWAR_SSR_UZB_p1_production:0 "Village Mills"
 COLDWAR_SSR_UZB_p1_production_desc:0 "Small mills, storage depots, and repair workshops will connect growers with nearby markets. Rural earnings rise and spoilage falls, but dispersed facilities cannot match cotton combines in scale or export receipts."
 COLDWAR_SSR_UZB_p1_consumer:0 "Public Reading Rooms"
 COLDWAR_SSR_UZB_p1_consumer_desc:0 "Libraries and evening courses will bring technical manuals, literature, and civic education to provincial towns. Skilled learning supports future workshops, though teachers and facilities compete with immediate food and irrigation needs."
 COLDWAR_SSR_UZB_p1_development:0 "Local Milling Network"
 COLDWAR_SSR_UZB_p1_development_desc:0 "Mills, grain stores, and food workshops connect rural growers with nearby cities. Local supply becomes less dependent on long transport routes, while lower public revenues constrain future cotton and transport investment."
 COLDWAR_SSR_UZB_p1_universal:0 "Low Business Levies"
 COLDWAR_SSR_UZB_p1_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_UZB_p1_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_UZB_p1_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
