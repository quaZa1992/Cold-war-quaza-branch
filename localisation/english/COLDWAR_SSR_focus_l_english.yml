 COLDWAR_SSR_GEO_p2_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_social_democratic_party_of_georgia_programme:0 "Social Democratic Party of Georgia Programme"
 COLDWAR_SSR_GEO_p3_root:0 "The Menshevik Republic"
 COLDWAR_SSR_GEO_p3_root_desc:0 "Georgia's Social Democratic Party draws on the Menshevik government that led the Democratic Republic before the Red Army invasion of 1921. Its exile tradition combines gradual agrarian socialism, multiparty government, and local self-rule rather than Bolshevik command or a single nationalist front."
 COLDWAR_SSR_GEO_p3_civic:0 "Local Soviets"
 COLDWAR_SSR_GEO_p3_civic_desc:0 "The Menshevik tradition restores elected local councils and a constituent assembly rather than a party monopoly. Regions gain a voice over land and services, while coalition debate slows national decisions."
 COLDWAR_SSR_GEO_p3_executive:0 "Parliamentary Cabinet"
 COLDWAR_SSR_GEO_p3_executive_desc:0 "A cabinet accountable to parliament coordinates agrarian reform, transport, and trade. Professional officials can secure continuity, but central ministries may overrule local priorities in the name of national recovery."
 COLDWAR_SSR_GEO_p3_institution:0 "Elected Rural Councils"
 COLDWAR_SSR_GEO_p3_institution_desc:0 "Village councils decide irrigation, farm roads, and cooperative storage under elected regional assemblies. Rural communities gain control over development, while cross-region projects require longer negotiation."
 COLDWAR_SSR_GEO_p3_archives:0 "Open Party Archives"
 COLDWAR_SSR_GEO_p3_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_GEO_p3_public:0 "Village Land Co-ops"
 COLDWAR_SSR_GEO_p3_public_desc:0 "Farmers combine land, machinery, and produce marketing through voluntary cooperatives rather than state collectivization. Rural output and participation improve, but the model struggles to finance large industrial projects."
 COLDWAR_SSR_GEO_p3_market:0 "Private Export Houses"
 COLDWAR_SSR_GEO_p3_market_desc:0 "Independent firms trade wine, tea, and agricultural goods through Black Sea routes under parliamentary law. Export earnings rise quickly, while private merchants can dominate small producers and regional markets."
 COLDWAR_SSR_GEO_p3_production:0 "Elected Rural Banks"
 COLDWAR_SSR_GEO_p3_production_desc:0 "Local banks lend to farms and cooperatives under elected council oversight. Producers gain credit close to home, though fragmented lending increases administrative cost and default risk."
 COLDWAR_SSR_GEO_p3_consumer:0 "Rail Repair Workshops"
 COLDWAR_SSR_GEO_p3_consumer_desc:0 "Public workshops repair rail, bridges, and freight equipment serving farms and coastal ports. Trade links recover, but maintenance draws funds from new roads and schools."
 COLDWAR_SSR_GEO_p3_development:0 "Public Rail Workshop"
 COLDWAR_SSR_GEO_p3_development_desc:0 "A public workshop restores rail parts, freight equipment, and repair skills for industry and agriculture. Reliable transport binds regions into one market, but the state carries costs before traffic and tax receipts recover."
 COLDWAR_SSR_GEO_p3_universal:0 "Progressive Revenue"
 COLDWAR_SSR_GEO_p3_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_GEO_p3_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_GEO_p3_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_GEO_p3_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_GEO_p3_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_GEO_p3_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_GEO_p3_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_GEO_p3_settlement:0 "A Social Republic"
 COLDWAR_SSR_GEO_p3_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_ARM_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_ARM_regional_review_desc:0 "The economy of Armenian SSR has grown around engineering, scientific institutions and imported inputs. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_ARM_regional_orders:0 "Engineering"
 COLDWAR_SSR_ARM_regional_orders_desc:0 "Engineering Institutes draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_ARM_regional_diversify:0 "Local Workshops"
 COLDWAR_SSR_ARM_regional_diversify_desc:0 "Local Supply Workshops will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
 COLDWAR_SSR_ARM_regional_standards_replace_tt:0 "Replace §YImported Industrial Inputs§! with §YManaged Imported Industrial Inputs§!"
 COLDWAR_SSR_ARM_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_ARM_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_name_communist_party_of_armenia_programme:0 "Communist Party of Armenia Programme"
 COLDWAR_SSR_ARM_p4_root:0 "Workers' Republic"
 COLDWAR_SSR_ARM_p4_root_desc:0 "The Communist Party of Armenia governs a republic rich in engineers and scientific institutions but dependent on imported industrial inputs. Independence would preserve those skills while making power, machinery, transport, and ties to the diaspora central economic questions."
 COLDWAR_SSR_ARM_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_ARM_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_ARM_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_ARM_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_ARM_p4_institution:0 "Engineering"
 COLDWAR_SSR_ARM_p4_institution_desc:0 "Universities and design bureaus train engineers for machine works, power stations, and industrial maintenance. Scientific capacity grows, but graduates need laboratories and equipment that compete with immediate consumer investment."
 COLDWAR_SSR_ARM_p4_public:0 "State Investment"
 COLDWAR_SSR_ARM_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_ARM_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_ARM_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
 COLDWAR_SSR_ARM_p4_production:0 "Strategic Workshops"
 COLDWAR_SSR_ARM_p4_production_desc:0 "A strategic workshop programme will give public armaments enterprises the facilities needed to honour national orders. Its maintenance and power needs will remain a public obligation even when demand becomes less favourable."
 COLDWAR_SSR_ARM_p4_consumer:0 "Cooperative Supply"
 COLDWAR_SSR_ARM_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_ARM_p4_development:0 "Local Parts Foundries"
 COLDWAR_SSR_ARM_p4_development_desc:0 "Foundries and repair shops produce components previously ordered from outside the republic. Supply interruptions ease and technical jobs expand, while smaller production runs cost more than Union-scale deliveries."
 COLDWAR_SSR_ARM_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_ARM_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
 COLDWAR_SSR_ARM_p4_targeted:0 "Targeted Provision"
 COLDWAR_SSR_ARM_p4_targeted_desc:0 "Support will be concentrated on households and services most exposed to hardship. A narrower commitment can improve public finances, while requiring a larger administrative effort and accepting less universal protection."
 COLDWAR_SSR_ARM_p4_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_ARM_p4_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_ARM_p4_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_ARM_p4_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_ARM_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_ARM_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_armenian_revolutionary_federation_programme:0 "Armenian Revolutionary Federation Programme"
 COLDWAR_SSR_ARM_p0_root:0 "The Federation Returns"
 COLDWAR_SSR_ARM_p0_root_desc:0 "The Armenian Revolutionary Federation preserved an anti-Soviet independence programme in the diaspora and remains divided from parties more accepting of Soviet Armenia. Its return would draw on international Armenian institutions, but national authority must be shared with citizens who did not live in exile."
 COLDWAR_SSR_ARM_p0_civic:0 "National Assembly"
 COLDWAR_SSR_ARM_p0_civic_desc:0 "The ARF invites rival parties, civic associations, and residents who stayed in Armenia to share constitutional authority. This broadens the party's anti-Soviet mandate, while limiting its claim to speak for the whole nation and diaspora."
 COLDWAR_SSR_ARM_p0_executive:0 "Federation Executive"
 COLDWAR_SSR_ARM_p0_executive_desc:0 "A disciplined ARF executive coordinates security, diaspora capital, and national reconstruction through trusted cadres. It can act quickly in a threatened state, but concentrated authority deepens distrust among rival parties and local institutions."
 COLDWAR_SSR_ARM_p0_institution:0 "Diaspora Industry Fund"
 COLDWAR_SSR_ARM_p0_institution_desc:0 "Armenian communities abroad pool capital for machine tools, power repairs, and technical schools at home. The fund brings expertise and export contacts, while contributors expect a voice in where scarce investment goes."
 COLDWAR_SSR_ARM_p0_archives:0 "Open Party Archives"
 COLDWAR_SSR_ARM_p0_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_ARM_p0_public:0 "Public Power Authority"
 COLDWAR_SSR_ARM_p0_public_desc:0 "The state retains power generation and engineering works as national assets, financing repair and new capacity through public accounts. Strategic control supports independence, but long payback periods burden the treasury."
 COLDWAR_SSR_ARM_p0_market:0 "Diaspora Industry Fund"
 COLDWAR_SSR_ARM_p0_market_desc:0 "Armenian communities abroad buy shares in machine works, workshops, and exporters under national law. Expertise and capital return quickly, while investors may favour profitable export firms over services in poorer districts."
 COLDWAR_SSR_ARM_p0_production:0 "Engineering"
 COLDWAR_SSR_ARM_p0_production_desc:0 "Public institutes train engineers for power, machinery, and industrial maintenance. Technical capacity strengthens self-reliance, though laboratories need imported equipment and years of investment before results appear."
 COLDWAR_SSR_ARM_p0_consumer:0 "Diaspora Trade Houses"
 COLDWAR_SSR_ARM_p0_consumer_desc:0 "Trade houses connect local firms to Armenian exporters, schools, and suppliers abroad. Commercial links broaden the economy, while outside partners can shape domestic priorities and influence credit terms."
 COLDWAR_SSR_ARM_p0_development:0 "Public Power Works"
 COLDWAR_SSR_ARM_p0_development_desc:0 "The state develops reliable electricity and engineering services before promising universal industrial expansion. Public ownership keeps strategic assets in Armenian hands, but the treasury must finance equipment with long payback periods."
 COLDWAR_SSR_ARM_p0_universal:0 "Progressive Revenue"
 COLDWAR_SSR_ARM_p0_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_ARM_p0_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_ARM_p0_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_ARM_p0_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_ARM_p0_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_ARM_p0_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_ARM_p0_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_ARM_p0_settlement:0 "A Social Republic"
 COLDWAR_SSR_ARM_p0_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_name_armenian_democratic_liberal_party_programme:0 "Armenian Democratic Liberal Party Programme"
 COLDWAR_SSR_ARM_p1_root:0 "A Liberal Republic"
 COLDWAR_SSR_ARM_p1_root_desc:0 "The Armenian Democratic Liberal Party, or Ramgavar, has generally accepted Soviet Armenia and maintained cultural ties where the Dashnaks rejected the Soviet settlement. Its counterfactual republic would preserve diaspora schools and commerce while placing public power under elected civilian law."
 COLDWAR_SSR_ARM_p1_civic:0 "Liberal Assembly"
 COLDWAR_SSR_ARM_p1_civic_desc:0 "Ramkavar liberals invite diaspora educators, merchants, and local civic groups into a pluralist assembly. Their accommodation with Soviet Armenia helps preserve social ties, while nationalist rivals challenge their right to define the republic's memory."
 COLDWAR_SSR_ARM_p1_executive:0 "Commercial Cabinet"
 COLDWAR_SSR_ARM_p1_executive_desc:0 "A cabinet of lawyers, educators, and commercial leaders restores civil administration and diaspora exchange. Expertise accelerates recovery, but reliance on wealthy sponsors can narrow representation in public decisions."
 COLDWAR_SSR_ARM_p1_institution:0 "Diaspora Chambers"
 COLDWAR_SSR_ARM_p1_institution_desc:0 "Commercial chambers connect Armenian firms abroad with local manufacturers, schools, and exporters. Contacts open markets and training, while public rules are needed to keep wealthy overseas sponsors from setting national priorities."
 COLDWAR_SSR_ARM_p1_public:0 "University Endowments"
 COLDWAR_SSR_ARM_p1_public_desc:0 "Diaspora endowments equip universities while keeping teaching and research under public charters. Scholars gain equipment and exchange, but donors can steer resources toward institutions with stronger overseas links."
 COLDWAR_SSR_ARM_p1_market:0 "Diaspora Chambers"
 COLDWAR_SSR_ARM_p1_market_desc:0 "Commercial chambers connect Armenian firms abroad with local workshops and exporters under open contracts. Capital and markets arrive quickly, while outside buyers can capture value and influence investment."
 COLDWAR_SSR_ARM_p1_production:0 "Technical Scholarships"
 COLDWAR_SSR_ARM_p1_production_desc:0 "Scholarships train engineers, teachers, and accountants for public institutions and private firms. Skills return to the republic, though students may leave again for better-funded laboratories abroad."
 COLDWAR_SSR_ARM_p1_consumer:0 "Export Credit Office"
 COLDWAR_SSR_ARM_p1_consumer_desc:0 "A public office insures small exporters against delayed payments and failed buyers. Trade grows beyond a few large firms, while the treasury carries losses when markets turn."
 COLDWAR_SSR_ARM_p1_development:0 "Open Universities"
 COLDWAR_SSR_ARM_p1_development_desc:0 "Universities regain authority to select researchers, publish findings, and exchange scholars with Armenian institutions abroad. Scientific careers become more attractive, though public accountability and access for rural students must be protected."
 COLDWAR_SSR_ARM_p1_universal:0 "Low Business Levies"
 COLDWAR_SSR_ARM_p1_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_ARM_p1_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_ARM_p1_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_ARM_p1_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_ARM_p1_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_ARM_p1_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_ARM_p1_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_ARM_p1_settlement:0 "A Free Republic"
 COLDWAR_SSR_ARM_p1_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_social_democrat_hunchakian_party_programme:0 "Social Democrat Hunchakian Party Programme"
 COLDWAR_SSR_ARM_p18_root:0 "Hunchakian Republic"
 COLDWAR_SSR_ARM_p18_root_desc:0 "The Social Democrat Hunchakian Party emerged from socialist Armenian politics and, unlike the ARF, often supported Soviet Armenia. If it governs an independent state, its challenge is to preserve social ownership and labour rights without restoring the Communist Party's monopoly."
 COLDWAR_SSR_ARM_p18_civic:0 "Workers Assembly"
 COLDWAR_SSR_ARM_p18_civic_desc:0 "Hunchakian socialists give unions, teachers, and local representatives a voice in public ownership and welfare policy. Democratic review separates social government from communist monopoly, though bargaining slows urgent decisions."
 COLDWAR_SSR_ARM_p18_executive:0 "Social Cabinet"
 COLDWAR_SSR_ARM_p18_executive_desc:0 "A Hunchakian cabinet keeps public firms and services under coordinated management while accepting electoral competition. It can preserve jobs and essential care, but officials gain influence over workers they claim to represent."
 COLDWAR_SSR_ARM_p18_institution:0 "Enterprise Boards"
 COLDWAR_SSR_ARM_p18_institution_desc:0 "Workers and technical managers jointly review investment, safety, and production goals at public firms. Skilled labour gains influence over conversion, but shared decisions take more time than orders from a single ministry."
 COLDWAR_SSR_ARM_p18_public:0 "Worker Workshops"
 COLDWAR_SSR_ARM_p18_public_desc:0 "Workers and technical managers share ownership of repair shops, machine firms, and food processors. Employees gain a claim on profits and decisions, while dispersed ownership makes large investment difficult."
 COLDWAR_SSR_ARM_p18_market:0 "Public Enterprise Act"
 COLDWAR_SSR_ARM_p18_market_desc:0 "Public firms retain essential utilities and heavy industry but must publish costs, wages, and service obligations. Social ownership survives, while poor accounts and unprofitable services remain public responsibilities."
 COLDWAR_SSR_ARM_p18_production:0 "Worker Enterprise Plan"
 COLDWAR_SSR_ARM_p18_production_desc:0 "Elected boards review safety, training, and production targets in state firms. Worker voice can protect skilled teams, but plant conversion takes longer when unions resist closures."
 COLDWAR_SSR_ARM_p18_consumer:0 "Clinics and Schools"
 COLDWAR_SSR_ARM_p18_consumer_desc:0 "Public clinics and schools retain universal access during economic reform. Families keep essential services, while construction and staffing costs reduce funds for industrial modernization and roads."
 COLDWAR_SSR_ARM_p18_development:0 "Clinics and Schools"
 COLDWAR_SSR_ARM_p18_development_desc:0 "Clinics and schools receive stable funding as the new state changes its economic system. Families keep access to essential services, while the budget must delay some factory modernization to meet those obligations."
 COLDWAR_SSR_ARM_p18_universal:0 "Progressive Revenue"
 COLDWAR_SSR_ARM_p18_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_ARM_p18_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_ARM_p18_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_ARM_p18_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_ARM_p18_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_ARM_p18_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_ARM_p18_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_ARM_p18_settlement:0 "A Social Republic"
 COLDWAR_SSR_ARM_p18_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_name_national_united_party_programme:0 "National United Party Programme"
 COLDWAR_SSR_ARM_p20_root:0 "National Unity"
 COLDWAR_SSR_ARM_p20_root_desc:0 "The National United Party grew as a clandestine Armenian independence movement, not as a diaspora parliament. Its victory would inherit the risks of underground politics and Soviet repression; public institutions and a defined civilian chain of command are needed before security becomes durable."
 COLDWAR_SSR_ARM_p20_civic:0 "Civilian Security Law"
 COLDWAR_SSR_ARM_p20_civic_desc:0 "The National United Party places underground security networks under courts, elected ministers, and public rules. Citizens gain legal protection, while former clandestine leaders surrender discretion over surveillance and appointments."
 COLDWAR_SSR_ARM_p20_executive:0 "Security Council"
 COLDWAR_SSR_ARM_p20_executive_desc:0 "A council of trusted independence veterans coordinates border protection and sensitive appointments. The new state can respond to threats quickly, but secrecy limits public oversight and civilian expertise."
 COLDWAR_SSR_ARM_p20_institution:0 "Civilian Security Law"
 COLDWAR_SSR_ARM_p20_institution_desc:0 "A public statute places security agencies under civilian review and courts. The new state gains a lawful chain of command, while former underground leaders surrender discretion over arrests and political surveillance."
 COLDWAR_SSR_ARM_p20_archives:0 "Open Party Archives"
 COLDWAR_SSR_ARM_p20_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_ARM_p20_public:0 "Strategic Machines"
 COLDWAR_SSR_ARM_p20_public_desc:0 "Public contracts expand civilian machine shops that repair power, transport, and industrial equipment locally. New workshops improve industrial services, but security priorities divert capital from consumer production and raise energy demand."
 COLDWAR_SSR_ARM_p20_market:0 "Independent Repairs"
 COLDWAR_SSR_ARM_p20_market_desc:0 "Licensed firms compete to repair vehicles, pumps, and factory parts for domestic customers. Supply improves through competition, while small operators may lack capital for strategic equipment."
 COLDWAR_SSR_ARM_p20_production:0 "Civilian Machine Works"
 COLDWAR_SSR_ARM_p20_production_desc:0 "A public plant manufactures essential electrical and mechanical components for the new state. Domestic production reduces dependence on old Union contracts, though equipment remains costly and limited in scale."
 COLDWAR_SSR_ARM_p20_consumer:0 "Security Court Service"
 COLDWAR_SSR_ARM_p20_consumer_desc:0 "Independent courts hear security cases and review detention and property claims. Civilian trust improves, while legal safeguards can slow emergency action favored by veterans and security officials."
 COLDWAR_SSR_ARM_p20_development:0 "Strategic Workshops"
 COLDWAR_SSR_ARM_p20_development_desc:0 "Public contracts expand repair shops making military radios, vehicle spares, and secure components for the armed forces. Military readiness improves, but expensive inputs and a security-first budget leave fewer goods for households."
 COLDWAR_SSR_ARM_p20_universal:0 "Low Business Levies"
 COLDWAR_SSR_ARM_p20_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
