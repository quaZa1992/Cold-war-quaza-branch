 COLDWAR_SSR_AZE_p2_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_AZE_p2_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_AZE_p2_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_AZE_p2_settlement:0 "A Free Republic"
 COLDWAR_SSR_AZE_p2_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_azerbaijan_trade_union_council_programme:0 "Azerbaijan Trade Union Council Programme"
 COLDWAR_SSR_AZE_p3_root:0 "Council Republic"
 COLDWAR_SSR_AZE_p3_root_desc:0 "The Republican Council of Trade Unions grew inside the Soviet workplace system and lacks the political character of an independent party. As a counterfactual government, it would need to replace official labour representation with elected unions that can defend workers and challenge state employers."
 COLDWAR_SSR_AZE_p3_civic:0 "Elected Union Councils"
 COLDWAR_SSR_AZE_p3_civic_desc:0 "Trade unions gain the right to elect officers, bargain over safety, and challenge management decisions before independent tribunals. Workers acquire real representation, while collective bargaining slows restructuring in oil and refinery plants."
 COLDWAR_SSR_AZE_p3_executive:0 "Workers Cabinet"
 COLDWAR_SSR_AZE_p3_executive_desc:0 "A cabinet of union leaders and technical managers coordinates public energy firms and social services. It protects employment and supply, but risks replacing party officials with another narrow industrial leadership."
 COLDWAR_SSR_AZE_p3_institution:0 "Elected Shop Councils"
 COLDWAR_SSR_AZE_p3_institution_desc:0 "Workers elect councils to inspect safety, review layoffs, and bargain over production changes. Factory decisions become more accountable, but restructuring requires more negotiation and can slow output during the transition."
 COLDWAR_SSR_AZE_p3_public:0 "Public Oil and Welfare"
 COLDWAR_SSR_AZE_p3_public_desc:0 "Public oil firms finance worker pensions, clinics, and refinery maintenance from published accounts. Resource wealth supports social security, but generous obligations leave less revenue for non-oil development."
 COLDWAR_SSR_AZE_p3_market:0 "Worker Co-op Shops"
 COLDWAR_SSR_AZE_p3_market_desc:0 "Workers form cooperatives to repair machinery and produce consumer goods outside the main oil combines. Employment and household supply improve, while member firms struggle to access large credit lines."
 COLDWAR_SSR_AZE_p3_production:0 "Oil Pension Fund"
 COLDWAR_SSR_AZE_p3_production_desc:0 "A public fund protects refinery, platform, and transport workers during dangerous work and enterprise change. Families gain security, while employer contributions raise costs in aging facilities."
 COLDWAR_SSR_AZE_p3_consumer:0 "Shopfloor Training"
 COLDWAR_SSR_AZE_p3_consumer_desc:0 "Union training halls teach repair, safety, and electrical skills for industrial workers. Productivity and safety improve, though training draws workers away from already stretched shifts."
 COLDWAR_SSR_AZE_p3_development:0 "Oil Pension Fund"
 COLDWAR_SSR_AZE_p3_development_desc:0 "A dedicated fund protects miners, refinery workers, and their families as equipment and ownership change. Industrial skills remain in the republic, though employer contributions raise operating costs in an aging sector."
 COLDWAR_SSR_AZE_p3_universal:0 "Progressive Revenue"
 COLDWAR_SSR_AZE_p3_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_AZE_p3_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_AZE_p3_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_AZE_p3_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_AZE_p3_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_AZE_p3_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_AZE_p3_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_AZE_p3_settlement:0 "A Social Republic"
 COLDWAR_SSR_AZE_p3_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_KAZ_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_KAZ_regional_review_desc:0 "The economy of Kazakh SSR has grown around mining, grain, union industry and environmental damage. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_KAZ_regional_orders:0 "Grain and Industry"
 COLDWAR_SSR_KAZ_regional_orders_desc:0 "Industrial and Grain Orders draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_KAZ_regional_diversify:0 "Regional Industry"
 COLDWAR_SSR_KAZ_regional_diversify_desc:0 "Regional Diversification will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
 COLDWAR_SSR_KAZ_regional_standards_replace_tt:0 "Replace §YIndustrial and Environmental Burdens§! with §YManaged Industrial and Environmental Burdens§!"
 COLDWAR_SSR_KAZ_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_KAZ_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_name_communist_party_of_kazakhstan_programme:0 "Communist Party of Kazakhstan Programme"
 COLDWAR_SSR_KAZ_p4_root:0 "Workers' Republic"
 COLDWAR_SSR_KAZ_p4_root_desc:0 "The Communist Party of Kazakhstan governs a vast republic of grain, mining, industrial settlements, and environmental damage from Union projects. Independence would make regional inequality and local control over land, water, and extraction impossible to ignore."
 COLDWAR_SSR_KAZ_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_KAZ_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_KAZ_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_KAZ_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_KAZ_p4_institution:0 "Industrial Settlements"
 COLDWAR_SSR_KAZ_p4_institution_desc:0 "Mining towns receive reliable housing, power, and rail connections to sustain metal and fuel production. Factory construction and skilled employment rise, but the state further concentrates people and environmental costs around extraction sites."
 COLDWAR_SSR_KAZ_p4_public:0 "State Investment"
 COLDWAR_SSR_KAZ_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_KAZ_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_KAZ_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
