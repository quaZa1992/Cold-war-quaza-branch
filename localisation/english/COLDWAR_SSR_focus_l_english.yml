 COLDWAR_SSR_ARM_p20_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_AZE_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_AZE_regional_review_desc:0 "The economy of Azerbaijan SSR has grown around oil refining, engineering and the caspian economy. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_AZE_regional_orders:0 "Refining Equipment"
 COLDWAR_SSR_AZE_regional_orders_desc:0 "Refining and Equipment draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_AZE_regional_diversify:0 "Non-Oil Industry"
 COLDWAR_SSR_AZE_regional_diversify_desc:0 "Non-Oil Industry will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
 COLDWAR_SSR_AZE_regional_standards_replace_tt:0 "Replace §YAgeing Oil-Industrial Equipment§! with §YManaged Ageing Oil-Industrial Equipment§!"
 COLDWAR_SSR_AZE_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_AZE_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_name_communist_party_of_azerbaijan_programme:0 "Communist Party of Azerbaijan Programme"
 COLDWAR_SSR_AZE_p4_root:0 "Workers' Republic"
 COLDWAR_SSR_AZE_p4_root_desc:0 "The Communist Party of Azerbaijan governs an oil-producing republic with refineries, engineering works, and Caspian ports. Independence could turn oil into public wealth or preserve dependence on a single sector; maintenance, local processing, and non-oil employment are competing priorities."
 COLDWAR_SSR_AZE_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_AZE_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_AZE_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_AZE_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_AZE_p4_institution:0 "Refinery Renewal"
 COLDWAR_SSR_AZE_p4_institution_desc:0 "Refinery maintenance and safer process equipment recover output from aging installations. Export earnings and industrial reliability improve, but oil investment can crowd out the non-oil firms needed to employ the wider workforce."
 COLDWAR_SSR_AZE_p4_public:0 "State Investment"
 COLDWAR_SSR_AZE_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_AZE_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_AZE_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
 COLDWAR_SSR_AZE_p4_production:0 "Strategic Workshops"
 COLDWAR_SSR_AZE_p4_production_desc:0 "A strategic workshop programme will give public armaments enterprises the facilities needed to honour national orders. Its maintenance and power needs will remain a public obligation even when demand becomes less favourable."
 COLDWAR_SSR_AZE_p4_consumer:0 "Cooperative Supply"
 COLDWAR_SSR_AZE_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_stat_oil_export_multiplier_modifier_tt:0 "Fossil fuel export revenue multiplier: $RIGHT|+=%2$"
 COLDWAR_SSR_AZE_p4_development:0 "Caspian Machine Shops"
 COLDWAR_SSR_AZE_p4_development_desc:0 "Engineering shops supply pumps, electrical equipment, and ship repairs to Caspian ports and inland factories. Skilled jobs broaden beyond petroleum, while the state accepts lower immediate export returns."
 COLDWAR_SSR_AZE_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_AZE_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
 COLDWAR_SSR_AZE_p4_targeted:0 "Targeted Provision"
 COLDWAR_SSR_AZE_p4_targeted_desc:0 "Support will be concentrated on households and services most exposed to hardship. A narrower commitment can improve public finances, while requiring a larger administrative effort and accepting less universal protection."
 COLDWAR_SSR_AZE_p4_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_AZE_p4_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_AZE_p4_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_AZE_p4_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_AZE_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_AZE_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_m_savat_party_programme:0 "Müsavat Party Programme"
 COLDWAR_SSR_AZE_p1_root:0 "The Musavat Republic"
 COLDWAR_SSR_AZE_p1_root_desc:0 "Musavat carries an Azerbaijani national-democratic tradition from the short-lived republic of 1918-1920 and its exile legacy. Its state must combine secular citizenship with a Muslim-majority society, while balancing Turkish cultural links against the need for independent foreign policy."
 COLDWAR_SSR_AZE_p1_civic:0 "Secular Republic"
 COLDWAR_SSR_AZE_p1_civic_desc:0 "Musavat builds a secular parliamentary republic whose citizenship does not depend on religion or language. Civic law can unite a diverse oil city and countryside, while the party must restrain both clerical influence and nationalist exclusion."
 COLDWAR_SSR_AZE_p1_executive:0 "Republican Cabinet"
 COLDWAR_SSR_AZE_p1_executive_desc:0 "A parliamentary cabinet coordinates oil revenue, trade, and public administration through experienced officials. It can protect state continuity quickly, but concentrated executive control risks weakening the pluralism Musavat claims to defend."
 COLDWAR_SSR_AZE_p1_institution:0 "Civic University Act"
 COLDWAR_SSR_AZE_p1_institution_desc:0 "Universities teach Azerbaijani history, engineering, and law under independent academic standards. A skilled civil service and research sector grows, while open scholarship challenges leaders who would use national memory as an instrument of rule."
 COLDWAR_SSR_AZE_p1_archives:0 "Open Party Archives"
 COLDWAR_SSR_AZE_p1_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_AZE_p1_public:0 "Public Oil Dividend"
 COLDWAR_SSR_AZE_p1_public_desc:0 "The republic retains oil and refining assets, publishing revenue and directing a share to education, ports, and non-oil industry. National control funds diversification, but public firms remain exposed to price and equipment shocks."
 COLDWAR_SSR_AZE_p1_market:0 "Refinery Leases"
 COLDWAR_SSR_AZE_p1_market_desc:0 "Independent firms receive transparent concessions to modernize refineries and sell oil products abroad. Investment and expertise arrive faster, while tax concessions and foreign buyers reduce the public share of the resource."
 COLDWAR_SSR_AZE_p1_production:0 "Caspian Machine Shops"
 COLDWAR_SSR_AZE_p1_production_desc:0 "Local engineering shops supply pumps, port equipment, and refinery repairs. Skilled employment grows beyond extraction, though domestic firms need imported tools and standards to compete."
 COLDWAR_SSR_AZE_p1_consumer:0 "Non-Oil Export Credit"
 COLDWAR_SSR_AZE_p1_consumer_desc:0 "Credit supports food processing, textiles, and shipping services outside the petroleum sector. Employment diversifies, while public funds earn less than they would from another oil expansion."
 COLDWAR_SSR_AZE_p1_development:0 "Non-Oil Export Credit"
 COLDWAR_SSR_AZE_p1_development_desc:0 "Oil revenue capitalizes credit for food processing, machinery, and Caspian trade services. Employment spreads beyond the wells and refineries, though the state gives up a portion of near-term petroleum income."
 COLDWAR_SSR_AZE_p1_universal:0 "Low Business Levies"
 COLDWAR_SSR_AZE_p1_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_AZE_p1_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_AZE_p1_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_AZE_p1_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_AZE_p1_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_AZE_p1_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_AZE_p1_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_AZE_p1_settlement:0 "A Free Republic"
 COLDWAR_SSR_AZE_p1_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_union_of_writers_of_azerbaijan_programme:0 "Union of Writers of Azerbaijan Programme"
 COLDWAR_SSR_AZE_p2_root:0 "The Writers' Republic"
 COLDWAR_SSR_AZE_p2_root_desc:0 "The Writers' Union is a cultural institution rather than a political party. In a counterfactual government, authors, teachers, and editors can defend Azerbaijani public life, but their coalition must represent the republic's religious, linguistic, and urban diversity."
 COLDWAR_SSR_AZE_p2_civic:0 "Writers Assembly"
 COLDWAR_SSR_AZE_p2_civic_desc:0 "The Writers' Union becomes a secular civic assembly for language, education, and public debate. Its broad cultural reach can support a plural republic, but authors and teachers must share authority with workers and commercial institutions."
 COLDWAR_SSR_AZE_p2_executive:0 "Cultural Secretariat"
 COLDWAR_SSR_AZE_p2_executive_desc:0 "Editors, teachers, and scholars coordinate national education and publishing through a professional secretariat. It can restore Azerbaijani-language institutions, while central standards risk suppressing regional and minority voices."
 COLDWAR_SSR_AZE_p2_institution:0 "Baku Publishing Houses"
 COLDWAR_SSR_AZE_p2_institution_desc:0 "Public and cooperative presses publish Azerbaijani literature, science, and schoolbooks. Readers gain access to a wider national culture, while paper, translation, and distribution compete with investment in energy equipment."
 COLDWAR_SSR_AZE_p2_public:0 "Public Publishing Fund"
 COLDWAR_SSR_AZE_p2_public_desc:0 "A public trust funds presses, bookstores, and technical publishing without requiring each title to turn a profit. Cultural access widens, but public subsidy competes with power and transport investment."
 COLDWAR_SSR_AZE_p2_market:0 "Urban Service Firms"
 COLDWAR_SSR_AZE_p2_market_desc:0 "Private firms repair housing, port equipment, and electrical systems under clear city licences. Jobs grow beyond oil, while weak inspection can let connected contractors capture municipal markets."
 COLDWAR_SSR_AZE_p2_production:0 "Technical Press"
 COLDWAR_SSR_AZE_p2_production_desc:0 "Editors translate engineering, medicine, and law into Azerbaijani for schools and workshops. Technical access improves, while production costs make wide distribution difficult outside major cities."
 COLDWAR_SSR_AZE_p2_consumer:0 "Baku Repair Market"
 COLDWAR_SSR_AZE_p2_consumer_desc:0 "Small workshops compete to repair household equipment, pumps, and port tools. Consumers find more services, though firms still depend on imported parts and oil-sector wages."
 COLDWAR_SSR_AZE_p2_development:0 "Urban Service Firms"
 COLDWAR_SSR_AZE_p2_development_desc:0 "Small firms repair housing, transport equipment, and port services under predictable city licences. Employment grows beyond the oil sector, while municipal offices must learn to regulate private contracts fairly."
 COLDWAR_SSR_AZE_p2_universal:0 "Low Business Levies"
 COLDWAR_SSR_AZE_p2_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_AZE_p2_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_AZE_p2_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
