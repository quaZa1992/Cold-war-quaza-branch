 COLDWAR_SSR_GEO_p1_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_union_of_cinematographers_of_georgia_programme:0 "Union of Cinematographers of Georgia Programme"
 COLDWAR_SSR_GEO_p2_root:0 "The Film Republic"
 COLDWAR_SSR_GEO_p2_root_desc:0 "The Union of Cinematographers of Georgia represents studios and artists whose films reach audiences across the Soviet Union. In a sovereign coalition, cultural influence can support an open public sphere, but it must coexist with rural services and economic needs beyond Tbilisi."
 COLDWAR_SSR_GEO_p2_civic:0 "Artists Assembly"
 COLDWAR_SSR_GEO_p2_civic_desc:0 "The Georgian film community invites universities, municipalities, and regional artists into a cultural assembly. Independent art can support public debate, but urban institutions must answer to citizens outside Tbilisi."
 COLDWAR_SSR_GEO_p2_executive:0 "Studio Secretariat"
 COLDWAR_SSR_GEO_p2_executive_desc:0 "A professional secretariat coordinates film, technical education, and cultural exports through common standards. It can keep studios operating, while central direction risks reducing artists to instruments of state promotion."
 COLDWAR_SSR_GEO_p2_institution:0 "Studio Equipment"
 COLDWAR_SSR_GEO_p2_institution_desc:0 "Film studios receive modern equipment, reliable power, and training for sound engineers and technicians. Georgian productions can reach wider markets, though cultural spending competes with urgent repairs to roads and utilities."
 COLDWAR_SSR_GEO_p2_public:0 "Public Film Studios"
 COLDWAR_SSR_GEO_p2_public_desc:0 "State studios retain equipment and train technicians for Georgian film and television. Domestic production and skilled work survive, though public budgets subsidize projects without secure audiences."
 COLDWAR_SSR_GEO_p2_market:0 "Independent Studios"
 COLDWAR_SSR_GEO_p2_market_desc:0 "Small producers and cinemas receive commercial rights to reach Georgian and foreign audiences. Private investment brings equipment faster, while popular projects can crowd out regional and experimental work."
 COLDWAR_SSR_GEO_p2_production:0 "Technical Film School"
 COLDWAR_SSR_GEO_p2_production_desc:0 "A film school trains sound engineers, editors, and camera crews for domestic studios and broadcasters. Technical skill grows, but graduates need jobs beyond publicly financed productions."
 COLDWAR_SSR_GEO_p2_consumer:0 "Regional Cinema Houses"
 COLDWAR_SSR_GEO_p2_consumer_desc:0 "Municipal cinemas and mobile screenings bring Georgian films to towns and mountain communities. Public culture reaches further, while upkeep costs exceed ticket revenue in smaller districts."
 COLDWAR_SSR_GEO_p2_development:0 "Mountain Service Roads"
 COLDWAR_SSR_GEO_p2_development_desc:0 "Municipal road and storage projects connect mountain farms with markets and health services. Regional access improves, while construction is expensive and the return is lower than concentrating investment in Tbilisi."
 COLDWAR_SSR_GEO_p2_universal:0 "Low Business Levies"
 COLDWAR_SSR_GEO_p2_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
