 COLDWAR_SSR_KYR_p4_production_desc:0 "A strategic workshop programme will give public armaments enterprises the facilities needed to honour national orders. Its maintenance and power needs will remain a public obligation even when demand becomes less favourable."
 COLDWAR_SSR_KYR_p4_consumer:0 "Cooperative Supply"
 COLDWAR_SSR_KYR_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_KYR_p4_development:0 "Mountain Food Plants"
 COLDWAR_SSR_KYR_p4_development_desc:0 "Small dairies, meat stores, and wool processors connect rural producers with towns through regional workshops. Local incomes rise and spoilage falls, though output cannot match the scale of Union industrial complexes."
 COLDWAR_SSR_KYR_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_KYR_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
 COLDWAR_SSR_KYR_p4_targeted:0 "Targeted Provision"
 COLDWAR_SSR_KYR_p4_targeted_desc:0 "Support will be concentrated on households and services most exposed to hardship. A narrower commitment can improve public finances, while requiring a larger administrative effort and accepting less universal protection."
 COLDWAR_SSR_KYR_p4_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_KYR_p4_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_KYR_p4_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_KYR_p4_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_KYR_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_KYR_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_defenders_of_manas_programme:0 "Defenders of Manas Programme"
 COLDWAR_SSR_KYR_p1_root:0 "The Manas Legacy"
 COLDWAR_SSR_KYR_p1_root_desc:0 "Defenders of Manas is a counterfactual cultural coalition, not a historical political party. It draws on the epic's public significance while allowing scholars and communities to disagree about its meaning, using schools and libraries to build civic life rather than a single national orthodoxy."
 COLDWAR_SSR_KYR_p1_civic:0 "Independent Courts"
 COLDWAR_SSR_KYR_p1_civic_desc:0 "Public authority must answer to law rather than another circle of personal appointments. Independent courts will protect commercial and civil rights, requiring the executive to accept scrutiny and finance institutions beyond its direct political control."
 COLDWAR_SSR_KYR_p1_executive:0 "Professional Service"
 COLDWAR_SSR_KYR_p1_executive_desc:0 "Experienced civil servants will carry administrative responsibility while elected leaders settle the national programme. A professional service can bring order to government, but it gives less influence to outsiders impatient for a complete political break."
 COLDWAR_SSR_KYR_p1_institution:0 "Oral History Archive"
 COLDWAR_SSR_KYR_p1_institution_desc:0 "Universities and local historians record oral traditions, regional languages, and family histories across the republic. Shared research broadens education, while public funding cannot decide which community's memory should dominate."
 COLDWAR_SSR_KYR_p1_public:0 "Manas Language Fund"
 COLDWAR_SSR_KYR_p1_public_desc:0 "A public cultural fund will support oral-history archives, multilingual schools, and local research under equal-citizenship rules. Shared heritage gains an institution, while grants must avoid privileging one region or community."
 COLDWAR_SSR_KYR_p1_market:0 "Cultural Workshop Act"
 COLDWAR_SSR_KYR_p1_market_desc:0 "Local publishers, repair shops, and cultural cooperatives will gain rights to sell work and train apprentices. Small enterprise creates jobs near communities, but poor roads and seasonal access limit the market."
 COLDWAR_SSR_KYR_p1_production:0 "Rural Power Workshops"
 COLDWAR_SSR_KYR_p1_production_desc:0 "Technicians will maintain small turbines, pumps, and farm machinery in remote districts. Local repair capacity makes electricity and harvests more reliable, while specialist staff remain scarce outside major towns."
 COLDWAR_SSR_KYR_p1_consumer:0 "Oral History Archive"
 COLDWAR_SSR_KYR_p1_consumer_desc:0 "Universities and local historians will record oral traditions, regional languages, and family histories across the republic. Public learning broadens, but a plural archive must represent communities on fair terms."
 COLDWAR_SSR_KYR_p1_development:0 "Rural Power Workshops"
 COLDWAR_SSR_KYR_p1_development_desc:0 "Repair shops train technicians to maintain small turbines, pumps, and farm machinery in remote districts. Electricity and agricultural supply become more dependable, while staffing remote depots consumes scarce public funds."
 COLDWAR_SSR_KYR_p1_universal:0 "Low Business Levies"
 COLDWAR_SSR_KYR_p1_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_KYR_p1_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_KYR_p1_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_KYR_p1_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_KYR_p1_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_KYR_p1_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_KYR_p1_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_KYR_p1_settlement:0 "A Free Republic"
 COLDWAR_SSR_KYR_p1_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_the_white_ship_programme:0 "The White Ship Programme"
 COLDWAR_SSR_KYR_p2_root:0 "The White Ship Circle"
 COLDWAR_SSR_KYR_p2_root_desc:0 "The White Ship evokes Chingiz Aitmatov's literature and an ethical debate about people and the natural world. This counterfactual civic circle is not a party; it uses schools, writers, and public institutions to address pollution, rural isolation, and the costs of industrial growth."
 COLDWAR_SSR_KYR_p2_civic:0 "Independent Courts"
 COLDWAR_SSR_KYR_p2_civic_desc:0 "Public authority must answer to law rather than another circle of personal appointments. Independent courts will protect commercial and civil rights, requiring the executive to accept scrutiny and finance institutions beyond its direct political control."
 COLDWAR_SSR_KYR_p2_executive:0 "Professional Service"
 COLDWAR_SSR_KYR_p2_executive_desc:0 "Experienced civil servants will carry administrative responsibility while elected leaders settle the national programme. A professional service can bring order to government, but it gives less influence to outsiders impatient for a complete political break."
 COLDWAR_SSR_KYR_p2_institution:0 "Lake and River Surveys"
 COLDWAR_SSR_KYR_p2_institution_desc:0 "Scientists and local councils measure water quality and protect fisheries, farms, and settlements around lakes and rivers. Better evidence guides investment, while environmental limits can slow industrial projects that promise quick returns."
 COLDWAR_SSR_KYR_p2_public:0 "River Protection Board"
 COLDWAR_SSR_KYR_p2_public_desc:0 "Scientists and local councils will monitor water quality, fisheries, pasture, and settlement needs before major works proceed. Better evidence protects livelihoods, but review can slow projects promising rapid industrial returns."
 COLDWAR_SSR_KYR_p2_market:0 "Village Service Rules"
 COLDWAR_SSR_KYR_p2_market_desc:0 "Small firms and cooperatives will receive contracts for repair, food storage, and visitor services in mountain districts. Local employment grows beyond state industry, but roads and power determine whether firms survive."
 COLDWAR_SSR_KYR_p2_production:0 "Lake Survey Service"
 COLDWAR_SSR_KYR_p2_production_desc:0 "Research teams will map water quality, erosion, and seasonal access around lakes and rivers. Public decisions gain a scientific basis, although surveys do not replace investment in treatment and maintenance."
 COLDWAR_SSR_KYR_p2_consumer:0 "Village Workshop Fund"
 COLDWAR_SSR_KYR_p2_consumer_desc:0 "Small grants will support repair shops, food storage, and cultural services near mountain communities. Work stays closer to rural households, while firms still need dependable roads, power, and credit."
 COLDWAR_SSR_KYR_p2_development:0 "Village Workshop Fund"
 COLDWAR_SSR_KYR_p2_development_desc:0 "Small grants support repair shops, food storage, and cultural tourism that keep work near mountain communities. Employment spreads without a megaproject, but rural firms need roads and reliable power before they can grow."
 COLDWAR_SSR_KYR_p2_universal:0 "Low Business Levies"
 COLDWAR_SSR_KYR_p2_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_KYR_p2_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_KYR_p2_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_KYR_p2_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_KYR_p2_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_KYR_p2_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_KYR_p2_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_KYR_p2_settlement:0 "A Free Republic"
 COLDWAR_SSR_KYR_p2_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_kosygin_reformers_programme:0 "Kosygin Reformers Programme"
 COLDWAR_SSR_KYR_p3_root:0 "The Reformist Republic"
 COLDWAR_SSR_KYR_p3_root_desc:0 "The Kosygin reformers are a counterfactual coalition of planners and enterprise managers who favour measured economic reform without abandoning public ownership. Their republic seeks clearer costs and greater local initiative, but industrial decentralization can strain a small tax base."
 COLDWAR_SSR_KYR_p3_civic:0 "A Labour Assembly"
 COLDWAR_SSR_KYR_p3_civic_desc:0 "Trade unions, professional associations and elected representatives will review the cabinet's programme. A broader labour mandate can protect reconstruction from a narrow party machine, while making national decisions slower and more difficult to settle."
 COLDWAR_SSR_KYR_p3_executive:0 "The Social Cabinet"
 COLDWAR_SSR_KYR_p3_executive_desc:0 "A disciplined social cabinet will coordinate enterprise reconstruction and essential services. Concentrated responsibility promises quicker action, while workers and rival parties must accept that many decisions will be taken by officials and technical managers."
 COLDWAR_SSR_KYR_p3_institution:0 "Enterprise Cost Books"
 COLDWAR_SSR_KYR_p3_institution_desc:0 "Factories record energy, freight, wages, and deliveries before managers negotiate production targets. Better accounts reveal where reform can work, but closures or price changes become harder to conceal from workers."
 COLDWAR_SSR_KYR_p3_public:0 "Factory Account Boards"
 COLDWAR_SSR_KYR_p3_public_desc:0 "Worker and regional boards will review factory costs, energy use, and deliveries before managers receive new targets. Better information makes reform practical, while shared oversight slows decisions and exposes hidden losses."
 COLDWAR_SSR_KYR_p3_market:0 "Cooperative Credit Law"
 COLDWAR_SSR_KYR_p3_market_desc:0 "Regional banks and producer cooperatives will lend to workshops, power repairs, and food processors under public accounting rules. Local credit spreads investment, but a small deposit base cannot finance rapid modernization."
 COLDWAR_SSR_KYR_p3_production:0 "Regional Credit Banks"
 COLDWAR_SSR_KYR_p3_production_desc:0 "Republican banks will direct savings toward hydro repairs, machinery, and suppliers outside the capital. Investment responds to local needs, though lending remains limited by household savings and public guarantees."
 COLDWAR_SSR_KYR_p3_consumer:0 "Farm Market Depots"
 COLDWAR_SSR_KYR_p3_consumer_desc:0 "Storage and market depots will help livestock and farm producers sell into nearby towns. Rural income and food supply improve, but local trade needs roads and public inspection to protect quality."
 COLDWAR_SSR_KYR_p3_development:0 "Regional Credit Banks"
 COLDWAR_SSR_KYR_p3_development_desc:0 "Republican banks lend to power repairs, food processing, and small industrial suppliers outside the capital. Local investment becomes more responsive, though limited deposits cap the speed of modernization."
 COLDWAR_SSR_KYR_p3_universal:0 "Progressive Revenue"
 COLDWAR_SSR_KYR_p3_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_KYR_p3_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_KYR_p3_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_KYR_p3_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_KYR_p3_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_KYR_p3_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_KYR_p3_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_KYR_p3_settlement:0 "A Social Republic"
 COLDWAR_SSR_KYR_p3_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_name_the_south_programme:0 "The South Programme"
 COLDWAR_SSR_KYR_p14_root:0 "The Southern Council"
 COLDWAR_SSR_KYR_p14_root_desc:0 "The South represents a counterfactual regional coalition, not a single ethnic, clan, or religious party. Its government must balance farming districts, urban communities, and national institutions through fair representation rather than treating regional identity as a permanent division."
 COLDWAR_SSR_KYR_p14_civic:0 "Local Representation"
 COLDWAR_SSR_KYR_p14_civic_desc:0 "Local councils and established community institutions will share responsibility for the national settlement. Their participation can give government deeper roots, while leaving the cabinet to negotiate with interests it cannot simply instruct."
 COLDWAR_SSR_KYR_p14_executive:0 "National Stewardship"
 COLDWAR_SSR_KYR_p14_executive_desc:0 "A stronger national executive will defend public order and coordinate reconstruction through experienced officials. Its supporters expect decisive government, even where that authority restricts the influence of local institutions and public critics."
 COLDWAR_SSR_KYR_p14_institution:0 "Regional Assembly Fund"
 COLDWAR_SSR_KYR_p14_institution_desc:0 "Elected regional assemblies publish budgets and choose local road, school, and clinic projects within national law. Communities gain a public voice, while national planners lose some ability to concentrate investment."
 COLDWAR_SSR_KYR_p14_public:0 "Balanced Regions Act"
 COLDWAR_SSR_KYR_p14_public_desc:0 "Regional assemblies will publish budgets for roads, schools, and clinics under common national standards. North and south receive a voice without becoming ethnic blocs, while national planners lose some investment discretion."
 COLDWAR_SSR_KYR_p14_market:0 "Valley Farm Rights"
 COLDWAR_SSR_KYR_p14_market_desc:0 "Farmers and local firms will gain rights to market crops, maintain canals, and lease equipment across provincial boundaries. Trade responds to local needs, but differences in water access can create new disputes."
 COLDWAR_SSR_KYR_p14_production:0 "Regional Road Works"
 COLDWAR_SSR_KYR_p14_production_desc:0 "Road crews will link mountain settlements, valleys, and markets with a published maintenance schedule. Access to services and workshops improves, but difficult terrain makes construction and upkeep expensive."
 COLDWAR_SSR_KYR_p14_consumer:0 "Valley Irrigation"
 COLDWAR_SSR_KYR_p14_consumer_desc:0 "Farmers and engineers will repair canals and agree seasonal allocations for crops, towns, and hydroelectric use. Harvests become more reliable, but upstream and downstream districts must accept shared limits."
 COLDWAR_SSR_KYR_p14_development:0 "Valley Irrigation"
 COLDWAR_SSR_KYR_p14_development_desc:0 "Engineers and farmers repair canals and schedule water for valley crops and towns. Harvests become more reliable, though allocations require agreement with upstream districts and seasonal power users."
 COLDWAR_SSR_KYR_p14_universal:0 "Land and Business Tax"
 COLDWAR_SSR_KYR_p14_universal_desc:0 "Property and commercial income will support the institutions that protect national life. More dependable revenue strengthens government, while farmers and local businesses resist a burden they believe distant industrial interests can more easily evade."
 COLDWAR_SSR_KYR_p14_targeted:0 "Smallholder Relief"
 COLDWAR_SSR_KYR_p14_targeted_desc:0 "Smaller farms and family firms will receive relief while the new economy settles. More resources remain in local production, but the treasury must meet public obligations from a narrower immediate base."
 COLDWAR_SSR_KYR_p14_settlement:0 "A Settled Republic"
 COLDWAR_SSR_KYR_p14_settlement_desc:0 "The republic will rest on institutions that families, producers and local communities can recognise as their own. National authority must preserve that confidence while finding the revenue and commercial capacity needed to sustain an independent state."
 COLDWAR_SSR_TAJ_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_TAJ_regional_review_desc:0 "The economy of Tajik SSR has grown around irrigated cotton, hydropower and regional inequalities. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_TAJ_regional_orders:0 "Cotton and Power"
 COLDWAR_SSR_TAJ_regional_orders_desc:0 "Cotton and Power Orders draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_TAJ_regional_diversify:0 "Food and Industry"
 COLDWAR_SSR_TAJ_regional_diversify_desc:0 "Food and Regional Industry will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
 COLDWAR_SSR_TAJ_regional_standards_replace_tt:0 "Replace §YUneven Regional Investment§! with §YManaged Uneven Regional Investment§!"
 COLDWAR_SSR_TAJ_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_TAJ_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_name_communist_party_of_tajikistan_programme:0 "Communist Party of Tajikistan Programme"
 COLDWAR_SSR_TAJ_p4_root:0 "Workers' Republic"
 COLDWAR_SSR_TAJ_p4_root_desc:0 "The Communist Party of Tajikistan governs cotton districts, hydropower projects, and remote mountain regions with unequal access to public investment. Independence would make transport, water, labour, and regional representation central economic questions."
 COLDWAR_SSR_TAJ_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_TAJ_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_TAJ_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_TAJ_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_TAJ_p4_institution:0 "Cotton Power Complex"
 COLDWAR_SSR_TAJ_p4_institution_desc:0 "Hydropower and textile plants coordinate electricity, irrigation, and cotton processing within the republic. Local value added grows, but water and energy use intensify pressure on downstream communities and food production."
 COLDWAR_SSR_TAJ_p4_public:0 "State Investment"
 COLDWAR_SSR_TAJ_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_TAJ_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_TAJ_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
 COLDWAR_SSR_TAJ_p4_production:0 "Strategic Workshops"
 COLDWAR_SSR_TAJ_p4_production_desc:0 "A strategic workshop programme will give public armaments enterprises the facilities needed to honour national orders. Its maintenance and power needs will remain a public obligation even when demand becomes less favourable."
 COLDWAR_SSR_TAJ_p4_consumer:0 "Cooperative Supply"
 COLDWAR_SSR_TAJ_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_TAJ_p4_development:0 "Mountain Food Roads"
 COLDWAR_SSR_TAJ_p4_development_desc:0 "Roads, storage, and small food plants connect mountain farms to regional markets. Household supply and rural employment improve, while less capital remains for large cotton and power projects."
 COLDWAR_SSR_TAJ_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_TAJ_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
 COLDWAR_SSR_TAJ_p4_targeted:0 "Targeted Provision"
 COLDWAR_SSR_TAJ_p4_targeted_desc:0 "Support will be concentrated on households and services most exposed to hardship. A narrower commitment can improve public finances, while requiring a larger administrative effort and accepting less universal protection."
 COLDWAR_SSR_TAJ_p4_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_TAJ_p4_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_TAJ_p4_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_TAJ_p4_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_TAJ_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_TAJ_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_samanid_heritage_programme:0 "Samanid Heritage Programme"
 COLDWAR_SSR_TAJ_p1_root:0 "The Samanid Legacy"
 COLDWAR_SSR_TAJ_p1_root_desc:0 "Samanid heritage offers a historical frame for Tajik language and statehood, not a dynastic claim to rule. A counterfactual cultural coalition must build citizenship around shared institutions and prevent national history from becoming a test of ethnic belonging."
 COLDWAR_SSR_TAJ_p1_civic:0 "Independent Courts"
 COLDWAR_SSR_TAJ_p1_civic_desc:0 "Public authority must answer to law rather than another circle of personal appointments. Independent courts will protect commercial and civil rights, requiring the executive to accept scrutiny and finance institutions beyond its direct political control."
 COLDWAR_SSR_TAJ_p1_executive:0 "Professional Service"
 COLDWAR_SSR_TAJ_p1_executive_desc:0 "Experienced civil servants will carry administrative responsibility while elected leaders settle the national programme. A professional service can bring order to government, but it gives less influence to outsiders impatient for a complete political break."
 COLDWAR_SSR_TAJ_p1_institution:0 "Tajik Research Centre"
 COLDWAR_SSR_TAJ_p1_institution_desc:0 "Researchers document Tajik language, history, and regional traditions through universities and public archives. A stronger scholarly base supports education, though long-term work offers little immediate relief to remote communities."
 COLDWAR_SSR_TAJ_p1_public:0 "Samanid Culture Trust"
 COLDWAR_SSR_TAJ_p1_public_desc:0 "A secular public trust will support Tajik-language archives, historical research, schools, and provincial cultural centres. Education gains a durable institution, while funding requires equal access and distance from political patronage."
 COLDWAR_SSR_TAJ_p1_market:0 "Tajik Publishing Rights"
 COLDWAR_SSR_TAJ_p1_market_desc:0 "Publishers, printers, and bookshops will gain rights to produce Tajik-language material and train apprentices. A wider cultural economy develops, but rural distribution and scarce paper limit reach beyond cities."
 COLDWAR_SSR_TAJ_p1_production:0 "Provincial Printing"
 COLDWAR_SSR_TAJ_p1_production_desc:0 "Regional presses will print schoolbooks, technical manuals, and public notices closer to readers. Local education and administration improve, though equipment and paper remain dependent on inter-republic deliveries."
 COLDWAR_SSR_TAJ_p1_consumer:0 "District Service Posts"
 COLDWAR_SSR_TAJ_p1_consumer_desc:0 "Teacher and medical colleges will train staff for districts far from Dushanbe. Public services reach more families, but salaries, housing, and transport make rural placements costly to sustain."
 COLDWAR_SSR_TAJ_p1_development:0 "District Service Posts"
 COLDWAR_SSR_TAJ_p1_development_desc:0 "Teacher and medical colleges train staff for districts far from Dushanbe. Public services reach more families, while salaries, housing, and transport make rural placements costly to sustain."
 COLDWAR_SSR_TAJ_p1_universal:0 "Low Business Levies"
 COLDWAR_SSR_TAJ_p1_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
