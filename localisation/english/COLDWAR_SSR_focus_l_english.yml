l_english:
# IMPERIA COLD WAR — Universal SSR focus programme.
 COLDWAR_SSR_requires_ssr_tt:0 "A recognised Soviet Union republic"
 COLDWAR_SSR_name_republican_administration:0 "Republican Administration"
 COLDWAR_SSR_stat_political_power_factor_tt:0 "Political power gain: $RIGHT|+=%2$"
 COLDWAR_SSR_secretariat:0 "Republican Mandate"
 COLDWAR_SSR_secretariat_desc:0 "Our republic stands between the ambitions of its people and the demands of a continental Union. The republican administration must turn ministries, local councils and industrial managers into a government capable of securing investment and delivering what it promises."
 COLDWAR_SSR_name_union_cadre_compact:0 "Union Cadre Compact"
 COLDWAR_SSR_stat_production_speed_buildings_factor_tt:0 "Construction speed: $RIGHT|+=%2$"
 COLDWAR_SSR_moscow_cadres:0 "Union Appointments"
 COLDWAR_SSR_moscow_cadres_desc:0 "Officials with experience in the Union ministries know where allocations are decided and which signatures open doors. Bringing them into our administration will strengthen those connections, although republican priorities may receive less generous consideration when the centre issues its instructions."
 COLDWAR_SSR_name_republican_cadre_compact:0 "Republican Cadre Compact"
 COLDWAR_SSR_stat_stability_factor_tt:0 "Stability: $RIGHT|+=%2$"
 COLDWAR_SSR_stat_research_speed_factor_tt:0 "Research speed: $RIGHT|+=%2$"
 COLDWAR_SSR_local_cadres:0 "Republican Cadres"
 COLDWAR_SSR_local_cadres_desc:0 "Administrators who know our towns, farms and factories can see difficulties that disappear in distant reports. Promoting them will give republican institutions deeper roots, while obliging us to accommodate influential local networks and their expectations."
 COLDWAR_SSR_appointment_school:0 "Cadre Schools"
 COLDWAR_SSR_appointment_school_desc:0 "An expanding administration cannot depend indefinitely on personal recommendations and hurried appointments. Schools for public officials will teach accounting, industrial management and the practical work of government, creating a professional service beneath the political leadership."
 COLDWAR_SSR_audit_staff_replace_tt:0 "Replace §YRepublican Patronage Networks§! with §YProfessional Appointments§!"
 COLDWAR_SSR_audit_staff:0 "Professional Audits"
 COLDWAR_SSR_audit_staff_desc:0 "A fulfilled target on paper is of little use when machinery stands idle and the promised deliveries never arrive. Independent teams of accountants and engineers will examine enterprise books and public appointments, challenging the protections that have sheltered poor management."
 COLDWAR_SSR_discipline_campaign_replace_tt:0 "Replace §YRepublican Patronage Networks§! with §YCadre Discipline§!"
 COLDWAR_SSR_discipline_campaign:0 "Cadre Discipline"
 COLDWAR_SSR_discipline_campaign_desc:0 "Warnings and quiet transfers have allowed too many officials to mistake their positions for private property. A concentrated disciplinary campaign will replace compromised administrators and reassert central authority, even if the upheaval briefly unsettles factories and local institutions."
 COLDWAR_SSR_complaints_office:0 "Public Petitions"
 COLDWAR_SSR_complaints_office_desc:0 "Workers and residents often know about shortages long before a ministry acknowledges them. A republican petitions office will bring those complaints into the administration and make local officials answer for abuses that have been dismissed as unavoidable difficulties."
 COLDWAR_SSR_plan_bargain:0 "Plan Negotiations"
 COLDWAR_SSR_plan_bargain_desc:0 "Every investment programme begins with a contest over scarce machinery, building materials and skilled labour. Our delegation will present a coherent republican case to the Union ministries, replacing scattered requests with priorities that the centre can recognise and fund."
 COLDWAR_SSR_name_strategic_order_book:0 "Strategic Order Book"
 COLDWAR_SSR_stat_industrial_capacity_factory_tt:0 "Military factory output: $RIGHT|+=%2$"
 COLDWAR_SSR_priority_orders:0 "Union Priorities"
 COLDWAR_SSR_priority_orders_desc:0 "The Union's strategic programmes offer large and dependable orders to enterprises willing to meet demanding specifications. Giving those contracts priority will strengthen military production, while leaving fewer resources for the goods and services consumed by our own households."
 COLDWAR_SSR_name_republican_reinvestment:0 "Republican Reinvestment"
 COLDWAR_SSR_local_retention:0 "Local Reinvestment"
 COLDWAR_SSR_local_retention_desc:0 "A republic cannot prosper solely by supplying distant customers while its own infrastructure and consumer industries wait. A larger share of investment will be directed towards republican needs, accepting a smaller role in the most prestigious military contracts."
 COLDWAR_SSR_successor_training:0 "Secretariat School"
 COLDWAR_SSR_successor_training_desc:0 "Public administration should survive the retirement of any one official. Experienced department heads will train younger administrators and share responsibility for major projects, giving the republic a second rank capable of maintaining policy through a change of leadership."
 COLDWAR_SSR_controlled_debate:0 "Controlled Debate"
 COLDWAR_SSR_controlled_debate_desc:0 "Scientists, writers and experienced managers have arguments that deserve a hearing before they become grievances. A carefully widened public debate will bring fresh expertise into republican policy, at the price of a less obedient political atmosphere."
 COLDWAR_SSR_unified_line:0 "A Unified Line"
 COLDWAR_SSR_unified_line_desc:0 "Conflicting instructions waste time and encourage officials to evade responsibility. A clear common line will bind the administration to a single programme, although experts who question its assumptions may find fewer opportunities to influence decisions."
 COLDWAR_SSR_republican_statute:0 "Republican Statute"
 COLDWAR_SSR_republican_statute_desc:0 "The responsibilities of ministries, local councils and republican departments have accumulated through custom as much as law. A revised administrative statute will clarify their powers and settle disputes before another development programme is delayed by competing claims."
 COLDWAR_SSR_union_delegate:0 "Republican Delegation"
 COLDWAR_SSR_union_delegate_desc:0 "The republic needs a delegation that can defend its interests through more than occasional appeals to personal contacts. A permanent staff will follow Union deliberations, negotiate administrative disputes and keep republican priorities before the central institutions."
 COLDWAR_SSR_name_republican_economic_programme:0 "Republican Economic Programme"
 COLDWAR_SSR_stat_tax_gain_multiplier_modifier_tt:0 "Tax revenue multiplier: $RIGHT|+=%2$"
 COLDWAR_SSR_economic_accounts:0 "Republican Accounts"
 COLDWAR_SSR_economic_accounts_desc:0 "Reports assembled to satisfy production targets do not always reveal the condition of an economy. A republican survey of deliveries, employment and enterprise accounts will expose the shortages hidden behind impressive totals and give future investment a firmer basis."
 COLDWAR_SSR_stat_energy_use_multiplier_tt:0 "Energy use: $RIGHT|-=%2$"
 COLDWAR_SSR_combine_priority:0 "Industrial Combines"
 COLDWAR_SSR_combine_priority_desc:0 "A modern industrial combine can gather workshops, skilled labour and technical services around a single productive centre. Concentrated investment promises a stronger manufacturing base, but its appetite for power, transport and imported machinery will be substantial."
 COLDWAR_SSR_consumer_priority:0 "Consumer Supply"
 COLDWAR_SSR_consumer_priority_desc:0 "Households judge economic progress by the goods they can obtain rather than the tonnage reported by heavy industry. Expanding consumer supply and distribution will answer those expectations, drawing investment away from military production and larger industrial monuments."
 COLDWAR_SSR_enterprise_accounts_replace_tt:0 "Replace §YPlan Targets and Shortages§! with §YRevised Plan Targets§!"
 COLDWAR_SSR_stat_civilian_factories_productivity_tt:0 "Civilian industry productivity: $RIGHT|+=%2$"
 COLDWAR_SSR_stat_production_factory_max_efficiency_factor_tt:0 "Production efficiency cap: $RIGHT|+=%2$"
 COLDWAR_SSR_enterprise_accounts:0 "Enterprise Accounts"
 COLDWAR_SSR_enterprise_accounts_desc:0 "Enterprises need to know what their inputs cost and whether their customers can use the goods they deliver. Revised accounting will reward usable production and expose chronic losses, while retaining the wider economic obligations of the republican plan."
 COLDWAR_SSR_name_production_incentives:0 "Production Incentives"
 COLDWAR_SSR_output_incentives:0 "Output Incentives"
 COLDWAR_SSR_output_incentives_desc:0 "Managers respond to the standards by which their factories are judged. Production incentives will reward technically demanding deliveries and sustained use of machinery, strengthening output while increasing the pressure on fuel, materials and maintenance services."
 COLDWAR_SSR_name_quality_standards:0 "Quality Standards"
 COLDWAR_SSR_quality_contracts:0 "Quality Contracts"
 COLDWAR_SSR_quality_contracts_desc:0 "A component that fails inspection can delay production far beyond the factory that made it. Contracts based on reliability and quality will encourage better tools and supervision, even where meeting those standards slows the rush to fulfil a numerical target."
 COLDWAR_SSR_rail_depots:0 "Freight Connections"
 COLDWAR_SSR_rail_depots_desc:0 "Factories cannot operate on promises when freight waits in crowded depots. Better loading facilities and a stronger republican transport corridor will move machinery, fuel and agricultural goods with fewer interruptions, tying local production more securely to its customers."
 COLDWAR_SSR_stat_agricolture_productivity_modifier_tt:0 "Agricultural productivity: $RIGHT|+=%2$"
 COLDWAR_SSR_rural_processing:0 "Food Processing"
 COLDWAR_SSR_rural_processing_desc:0 "Too much of the value of a harvest is lost between the farm and the market. Storage, processing and reliable maintenance services will turn agricultural production into food and industrial inputs that can be delivered throughout the year."
 COLDWAR_SSR_machine_tools:0 "Machine Tools"
 COLDWAR_SSR_machine_tools_desc:0 "The quality of a workshop depends on the machinery with which its workers must contend. A programme of machine-tool renewal will give our engineers the means to improve precision and introduce more demanding production methods."
 COLDWAR_SSR_service_networks:0 "Distribution Network"
 COLDWAR_SSR_service_networks_desc:0 "A productive enterprise still needs depots, wholesalers and dependable records of what has been ordered. Strengthening the distribution network will reduce the losses between producer and customer and bring more of the republic's economic activity into reliable accounts."
 COLDWAR_SSR_new_power:0 "Power Investment"
 COLDWAR_SSR_new_power_desc:0 "Industrial expansion has outgrown generating capacity in too many places. Investment in conventional power will support new workshops and more dependable public services, binding the republic to a larger fuel supply and a continuing maintenance commitment."
 COLDWAR_SSR_energy_savings:0 "Energy Discipline"
 COLDWAR_SSR_energy_savings_desc:0 "The cheapest additional power is often the power that need no longer be wasted. Metering, insulation and industrial energy audits will restrain demand, although enterprises must accept the cost and inconvenience of changing familiar production routines."
 COLDWAR_SSR_stat_supply_consumption_factor_tt:0 "Supply consumption: $RIGHT|-=%2$"
 COLDWAR_SSR_maintenance_stocks:0 "Maintenance Stocks"
 COLDWAR_SSR_maintenance_stocks_desc:0 "A missing bearing or damaged transformer can stop machinery worth far more than the spare part itself. Protected maintenance stocks and scheduled repairs will make industrial investment more dependable without another race to announce new construction."
 COLDWAR_SSR_prepared_preview_tt:0 "§YOn independence:§!"
 COLDWAR_SSR_name_fractured_supply_chains:0 "Fractured Supply Chains"
 COLDWAR_SSR_diversify_orders:0 "Diversify Orders"
 COLDWAR_SSR_diversify_orders_desc:0 "Reliance on a narrow set of Union customers leaves the republic exposed whenever priorities change. Developing alternative suppliers and a broader civilian order book will sacrifice some immediate military output in exchange for a more resilient economy."
 COLDWAR_SSR_exposure_preview_tt:0 "§YOn independence:§!"
 COLDWAR_SSR_name_unconverted_union_orders:0 "Unconverted Union Orders"
 COLDWAR_SSR_deepen_specialisation:0 "Union Supply Contracts"
 COLDWAR_SSR_deepen_specialisation_desc:0 "Concentrating on the products our Union customers need most can bring large orders and access to specialised machinery. That efficiency comes with dependence: a change in procurement or the breakdown of common supply arrangements would leave a difficult industrial inheritance."
 COLDWAR_SSR_plan_settlement_replace_tt:0 "Replace §YRevised Plan Targets§! with §YRepublican Production Standards§!"
 COLDWAR_SSR_plan_settlement:0 "Investment Settlement"
 COLDWAR_SSR_plan_settlement_desc:0 "An investment cycle is complete only when its enterprises can work reliably after the construction brigades have departed. Permanent production standards and stronger commercial accounts will turn the plan's accumulated improvements into an enduring republican asset."
 COLDWAR_SSR_name_republican_social_institutions:0 "Republican Social Institutions"
 COLDWAR_SSR_social_accounts:0 "Social Institutions"
 COLDWAR_SSR_social_accounts_desc:0 "Schools, clinics and housing offices form the daily face of government. A review of their staffing, expenditure and reach will show where republican promises can be sustained and where an overstretched service is merely concealing its failures."
 COLDWAR_SSR_technical_institutes:0 "Technical Institutes"
 COLDWAR_SSR_technical_institutes_desc:0 "Modern production requires engineers able to understand complex machinery and improve it. Strengthening the technical institutes will give the republic greater scientific capacity, while committing public funds to institutions whose benefits take years to mature."
 COLDWAR_SSR_stat_training_time_army_factor_tt:0 "Division training time: $RIGHT|-=%2$"
 COLDWAR_SSR_vocational_schools:0 "Vocational Schools"
 COLDWAR_SSR_vocational_schools_desc:0 "A skilled mechanic can keep an entire workshop in production. Vocational schools will concentrate on maintenance, machine operation and practical technical instruction, supplying the workers and specialists needed by an expanding industrial economy."
 COLDWAR_SSR_housing_repairs:0 "Housing Repairs"
 COLDWAR_SSR_housing_repairs_desc:0 "Leaking roofs, overcrowded apartments and unreliable heating undermine confidence in even the most ambitious development plan. Repairing existing housing will bring visible improvements to daily life, with costs that cannot be hidden behind the announcement of a new estate."
 COLDWAR_SSR_republican_culture:0 "Republican Culture"
 COLDWAR_SSR_republican_culture_desc:0 "Language, literature and local institutions give the republic a public life of its own. Supporting them will deepen attachment to republican government, while requiring accommodation between communities whose expectations of cultural policy do not always coincide."
 COLDWAR_SSR_union_curriculum:0 "Union Curriculum"
 COLDWAR_SSR_union_curriculum_desc:0 "Common technical standards make it easier for graduates to study, work and serve throughout the Union. A more uniform curriculum will strengthen those connections, leaving less room for the educational priorities defended by local cultural institutions."
 COLDWAR_SSR_public_health:0 "Public Health"
 COLDWAR_SSR_public_health_desc:0 "Preventive medicine and accessible clinics can answer needs that prestigious hospitals alone cannot meet. A stronger local health service will improve confidence in republican institutions, provided the budget can sustain its staff, supplies and facilities."
 COLDWAR_SSR_collective_farms:0 "Farm Machinery"
 COLDWAR_SSR_collective_farms_desc:0 "Agriculture cannot meet rising demand with worn machinery and unreliable repairs. Modern equipment and permanent service workshops will raise the capacity of the collective sector, at the cost of additional energy use and a larger investment commitment."
 COLDWAR_SSR_household_plots:0 "Household Supply"
 COLDWAR_SSR_household_plots_desc:0 "Small plots and local markets already supply goods that the larger agricultural system struggles to deliver. Giving them a wider place in food provision will improve supply, while making production and revenue more difficult for the state to supervise."
 COLDWAR_SSR_water_accounts:0 "Water and Land"
 COLDWAR_SSR_water_accounts_desc:0 "Irrigation, factories and growing towns all draw upon the same rivers and land. A republican account of water use and soil damage will reveal costs that individual enterprises have been able to pass on to their neighbours."
 COLDWAR_SSR_environmental_controls:0 "Protect Land and Water"
 COLDWAR_SSR_environmental_controls_desc:0 "An enterprise's success should not be measured by the pollution it can leave for another district to endure. Enforceable limits on industrial waste and water use will protect agriculture and settlements, even when established producers demand exemptions."
 COLDWAR_SSR_remediation_fund:0 "Remediation Fund"
 COLDWAR_SSR_remediation_fund_desc:0 "Closing every polluting enterprise would leave the republic with another economic crisis. A dedicated remediation fund will repair damaged facilities and finance cleaner processes while keeping viable plants in operation."
 COLDWAR_SSR_service_settlement_replace_tt:0 "Replace §YSoviet Social Guarantees§! with §YRepublican Social Guarantees§!"
 COLDWAR_SSR_service_settlement:0 "Service Settlement"
 COLDWAR_SSR_service_settlement_desc:0 "Public guarantees will endure only if their administration becomes more efficient. A lasting settlement will preserve essential services while reducing avoidable expenditure, replacing emergency appeals and competing departmental promises with a credible republican commitment."
 COLDWAR_SSR_name_unsettled_state_accounts:0 "Unsettled State Accounts"
 COLDWAR_SSR_civil_registers:0 "Civil Registers"
 COLDWAR_SSR_civil_registers_desc:0 "Reliable civil records make public administration possible beyond the offices of a handful of experienced officials. Modern registers and trained local staff will strengthen services, revenue collection and the authority of republican institutions."
 COLDWAR_SSR_name_union_defence_contribution:0 "Union Defence Contribution"
 COLDWAR_SSR_defence_commission:0 "Defence Commission"
 COLDWAR_SSR_defence_commission_desc:0 "The republic supplies personnel, workshops and transport to a much larger military system. A defence commission will coordinate that contribution with civilian development, ensuring that Union requirements do not arrive as contradictory demands upon local institutions."
 COLDWAR_SSR_military_components:0 "Military Components"
 COLDWAR_SSR_military_components_desc:0 "Defence orders reward factories that can maintain exacting standards over long production runs. Dedicated component workshops will give the republic a stronger place in military procurement and a correspondingly larger demand for power and specialised inputs."
 COLDWAR_SSR_dual_use_industry:0 "Dual-Use Workshops"
 COLDWAR_SSR_dual_use_industry_desc:0 "Civilian engineering and military supply share many tools and skills. Workshops able to serve both markets will broaden the republic's industrial base, accepting less concentration on dedicated arms production in return for greater flexibility."
 COLDWAR_SSR_technical_reserves:0 "Technical Reserves"
 COLDWAR_SSR_technical_reserves_desc:0 "Military equipment depends on mechanics, radio operators and technical specialists as much as frontline units. Reserve training will prepare those skills within the republican population and strengthen the personnel base available to the Union commands."
 COLDWAR_SSR_stat_army_org_factor_tt:0 "Division organisation: $RIGHT|+=%2$"
 COLDWAR_SSR_specialist_training:0 "Specialist Training"
 COLDWAR_SSR_specialist_training_desc:0 "Longer technical instruction can produce personnel capable of handling more complex equipment and responsibilities. The republic will favour competence over rapid throughput, accepting a slower training cycle in return for greater professional cohesion."
 COLDWAR_SSR_mass_training:0 "Broad Reserve Training"
 COLDWAR_SSR_mass_training_desc:0 "A broad reserve requires a training system that can reach beyond a small professional core. Shorter, standardised courses will prepare more personnel quickly, while leaving advanced instruction to later service and specialised schools."
 COLDWAR_SSR_military_repairs:0 "Repair Standards"
 COLDWAR_SSR_military_repairs_desc:0 "Different repair practices and incomplete technical records turn minor faults into lengthy absences from service. Common maintenance standards will give workshops a dependable supply of documentation and make scarce spare parts go further."
 COLDWAR_SSR_civil_shelters:0 "Civil Defence"
 COLDWAR_SSR_civil_shelters_desc:0 "Modern war would reach far beyond the barracks. Shelters, warning systems and emergency exercises will prepare the civilian administration for disruption and give the public greater confidence in the republic's ability to protect daily life."
 COLDWAR_SSR_strategic_transport:0 "Strategic Transport"
 COLDWAR_SSR_strategic_transport_desc:0 "The same bridges and freight connections serve industrial production and military mobilisation. Improving a strategic transport corridor will strengthen both, provided civilian traffic is not left waiting whenever defence requirements receive priority."
 COLDWAR_SSR_officer_education:0 "Officer Education"
 COLDWAR_SSR_officer_education_desc:0 "Technical warfare demands officers able to understand logistics, communications and the equipment under their command. Better access to military education will prepare republican personnel for responsibilities that cannot be mastered through routine service alone."
 COLDWAR_SSR_stat_army_fuel_consumption_factor_tt:0 "Army fuel consumption: $RIGHT|-=%2$"
 COLDWAR_SSR_fuel_discipline:0 "Fuel Discipline"
 COLDWAR_SSR_fuel_discipline_desc:0 "Fuel disappears quickly through poor maintenance, careless handling and unnecessary movement. A stricter service regime will reduce those losses, though units must devote more time to inspections and technical instruction."
 COLDWAR_SSR_stat_army_morale_factor_tt:0 "Division recovery rate: $RIGHT|+=%2$"
 COLDWAR_SSR_ready_stocks:0 "Readiness Stocks"
 COLDWAR_SSR_ready_stocks_desc:0 "Units recover more quickly when spare parts, instructors and maintenance personnel are available before an exercise begins. Financing that readiness will strengthen sustained training while increasing the cost of the military establishment."
 COLDWAR_SSR_name_unsettled_defence_administration:0 "Unsettled Defence Administration"
 COLDWAR_SSR_defence_records:0 "Defence Records"
 COLDWAR_SSR_defence_records_desc:0 "Personnel lists and maintenance obligations should survive a transfer of command. Complete defence records will protect the republic from competing claims and preserve the technical knowledge upon which any future military administration must depend."
 COLDWAR_SSR_combined_exercises:0 "Combined Exercises"
 COLDWAR_SSR_combined_exercises_desc:0 "Combined exercises test whether transport, technical services and trained personnel can work together under Union command. The lessons will be carried home by officers and specialists whose experience matters long after the last vehicle returns to its depot."
 COLDWAR_SSR_requires_independence_tt:0 "An independent republic"
 COLDWAR_SSR_name_state_administration:0 "State Administration"
 COLDWAR_SSR_public_authority:0 "Public Authority"
 COLDWAR_SSR_public_authority_desc:0 "Independence has placed the responsibilities of a state in republican hands. Ministries must answer to a national government, local authorities need a clear chain of responsibility, and citizens must see more than a new emblem above familiar offices."
 COLDWAR_SSR_name_civic_citizenship:0 "Civic Citizenship"
 COLDWAR_SSR_citizenship_civic:0 "Civic Citizenship"
 COLDWAR_SSR_citizenship_civic_desc:0 "The republic is home to people whose languages and memories cross its new frontiers. Equal citizenship will bind those communities to a common state, demanding an administration prepared to serve them without making ancestry the test of belonging."
 COLDWAR_SSR_name_restoration_settlement:0 "Restoration Settlement"
 COLDWAR_SSR_citizenship_restoration:0 "Legal Restoration"
 COLDWAR_SSR_citizenship_restoration_desc:0 "Independence has revived claims that Soviet law had buried beneath the authority of the Union. A restoration settlement will give the state a firmer historical foundation, while raising difficult questions for residents whose lives were built under the previous order."
 COLDWAR_SSR_rights_commission:0 "Rights Commission"
 COLDWAR_SSR_rights_commission_desc:0 "A new constitution will mean little if ordinary citizens cannot challenge an official's decision. A national rights commission will hear grievances and establish procedures capable of surviving the political passions of the independence movement."
 COLDWAR_SSR_unitary_services:0 "Unitary Services"
 COLDWAR_SSR_unitary_services_desc:0 "The new state cannot afford a separate bargain with every provincial administration. A unified public service will concentrate resources and authority, accepting the resentment of local institutions that have grown accustomed to defending their own prerogatives."
 COLDWAR_SSR_local_guarantees:0 "Local Guarantees"
 COLDWAR_SSR_local_guarantees_desc:0 "A durable republic must leave room for its regions and communities to recognise themselves within national institutions. Negotiated local guarantees will broaden consent, at the cost of a more demanding and politically divided administration."
 COLDWAR_SSR_revenue_service:0 "Revenue Service"
 COLDWAR_SSR_revenue_service_desc:0 "Old payments to Union institutions have ended before a reliable national tax service has taken their place. Trained inspectors, clear accounts and enforceable collection procedures will give the treasury the means to support an independent government."
 COLDWAR_SSR_remove_republican_patronage_networks_tt:0 "If present: Remove §YRepublican Patronage Networks§!"
 COLDWAR_SSR_court_review:0 "Judicial Review"
 COLDWAR_SSR_court_review_desc:0 "The officials of a sovereign republic must be subject to its law. Independent courts will review public appointments and administrative decisions, breaking inherited protections while limiting the executive's freedom to settle disputes by decree."
 COLDWAR_SSR_executive_service:0 "Executive Service"
 COLDWAR_SSR_executive_service_desc:0 "A fractured administration needs an executive capable of issuing instructions that will actually be carried out. Concentrating responsibility will bring greater discipline to public affairs, while narrowing the avenues through which independent institutions can challenge the cabinet."
 COLDWAR_SSR_registered_accounts:0 "Registered Accounts"
 COLDWAR_SSR_registered_accounts_desc:0 "The treasury needs a national account of what public institutions owe and what they are entitled to collect. Settling those obligations will replace uncertain claims with a fiscal system upon which ministries, enterprises and local authorities can plan."
 COLDWAR_SSR_social_compact:0 "Social Compact"
 COLDWAR_SSR_social_compact_desc:0 "Workers and pensioners should not be asked to accept independence as a promise that their livelihoods will be considered later. A national social compact will protect basic commitments while requiring the treasury and major employers to confront their true cost."
 COLDWAR_SSR_payment_register:0 "Payments Register"
 COLDWAR_SSR_payment_register_desc:0 "The disappearance of common payment arrangements has left enterprises holding invoices that their former customers cannot settle. A national register of commercial arrears will separate recoverable claims from debts that are keeping the whole economy in suspense."
 COLDWAR_SSR_weekly_expense_change_tt:0 "[THIS.GetFlag][THIS.GetAdjective] §YAdditional Expenses§! each week: $$§R[?COLDWAR_SSR_weekly_expense_change|-3]§! Billion"
 COLDWAR_SSR_gradual_conversion:0 "Gradual Transition"
 COLDWAR_SSR_gradual_conversion_desc:0 "Essential prices and public commitments will change in stages while enterprises acquire new customers and commercial accounts. The government will preserve a measure of household security, accepting slower investment and a continuing obligation to support weak producers."
 COLDWAR_SSR_rapid_conversion:0 "Shock Therapy"
 COLDWAR_SSR_rapid_conversion_desc:0 "Prices, trade and enterprise privileges will be released in a single programme. New firms and investment can respond quickly to genuine demand, but wages, savings and public revenue will bear the disruption before a new commercial order is secure."
 COLDWAR_SSR_supplier_contracts:0 "Supplier Contracts"
 COLDWAR_SSR_supplier_contracts_desc:0 "The old plan allocated components without asking each enterprise to negotiate a foreign contract. New commercial agreements must establish prices, payment and dependable delivery, rebuilding the practical connections on which production still relies."
 COLDWAR_SSR_name_economic_reconstruction:0 "Economic Reconstruction"
 COLDWAR_SSR_worker_ownership:0 "Worker Participation"
 COLDWAR_SSR_worker_ownership_desc:0 "Workers know which parts of their enterprises can be saved and which managers have been hiding failure. Giving them a voice in reconstruction will protect practical knowledge and social confidence, while making rapid changes of ownership or production more difficult."
 COLDWAR_SSR_open_tenders:0 "Open Tenders"
 COLDWAR_SSR_open_tenders_desc:0 "Public contracts and industrial restructuring should attract more than the same circle of well-connected managers. Open tenders will bring new capital and commercial standards, with little comfort for enterprises that can no longer win orders through political access."
 COLDWAR_SSR_remove_plan_targets_and_shortages_tt:0 "If present: Remove §YPlan Targets and Shortages§!"
 COLDWAR_SSR_remove_revised_plan_targets_tt:0 "If present: Remove §YRevised Plan Targets§!"
 COLDWAR_SSR_industrial_conversion:0 "Industrial Conversion"
 COLDWAR_SSR_industrial_conversion_desc:0 "The republic has inherited factories built for customers and suppliers now beyond its borders. Retooling, new standards and better commercial accounts will turn that industrial inheritance towards orders that can sustain production in an independent economy."
 COLDWAR_SSR_budget_protection:0 "Protect Public Services"
 COLDWAR_SSR_budget_protection_desc:0 "Public services carry the expectations of a population already facing economic upheaval. Protecting them will preserve confidence and household security, but the government must raise dependable revenue and postpone investments it can no longer finance at once."
 COLDWAR_SSR_budget_consolidation:0 "Fiscal Consolidation"
 COLDWAR_SSR_budget_consolidation_desc:0 "A sovereign treasury cannot meet every obligation inherited from the Union system. A concentrated fiscal adjustment will reduce administrative commitments and rebuild revenue, accepting the immediate political cost of withdrawing promises the state cannot sustain."
 COLDWAR_SSR_commercial_standards:0 "Trade Standards"
 COLDWAR_SSR_commercial_standards_desc:0 "Markets need records, enforceable contracts and banks that can distinguish a viable enterprise from a politically protected debtor. Common commercial standards will make transactions more dependable and bring economic activity back within the reach of public institutions."
 COLDWAR_SSR_remove_exposure_tt:0 "If present: Remove §YUnconverted Union Orders§!"
 COLDWAR_SSR_export_conversion:0 "Export Conversion"
 COLDWAR_SSR_export_conversion_desc:0 "Factories accustomed to a guaranteed order book must learn to satisfy customers who can buy elsewhere. Export conversion will finance new standards and product lines, opening markets while exposing established enterprises to a harsher commercial test."
 COLDWAR_SSR_domestic_chains:0 "Domestic Suppliers"
 COLDWAR_SSR_domestic_chains_desc:0 "Local suppliers can keep a factory working when foreign payments and deliveries fail. Rebuilding those connections will make the economy more resilient, although smaller production runs and duplicated facilities demand additional capital and energy."
 COLDWAR_SSR_regional_aftercare_UKR_tt:0 "If present: Replace §YHeavy-Industrial Imbalance§! with §YManaged Heavy-Industrial Imbalance§!"
 COLDWAR_SSR_regional_aftercare_BLR_tt:0 "If present: Replace §YDependence on Union Orders§! with §YManaged Dependence on Union Orders§!"
 COLDWAR_SSR_regional_aftercare_MLV_tt:0 "If present: Replace §YUneven Processing Networks§! with §YManaged Uneven Processing Networks§!"
 COLDWAR_SSR_regional_aftercare_EST_tt:0 "If present: Replace §YCosts of Oil-Shale Industry§! with §YManaged Costs of Oil-Shale Industry§!"
 COLDWAR_SSR_regional_aftercare_LAT_tt:0 "If present: Replace §YUnion Industrial Dependence§! with §YManaged Union Industrial Dependence§!"
 COLDWAR_SSR_regional_aftercare_LIT_tt:0 "If present: Replace §YCompeting Farm and Factory Needs§! with §YManaged Competing Farm and Factory Needs§!"
 COLDWAR_SSR_regional_aftercare_GEO_tt:0 "If present: Replace §YProtected Informal Networks§! with §YManaged Protected Informal Networks§!"
 COLDWAR_SSR_regional_aftercare_ARM_tt:0 "If present: Replace §YImported Industrial Inputs§! with §YManaged Imported Industrial Inputs§!"
 COLDWAR_SSR_regional_aftercare_AZE_tt:0 "If present: Replace §YAgeing Oil-Industrial Equipment§! with §YManaged Ageing Oil-Industrial Equipment§!"
 COLDWAR_SSR_regional_aftercare_KAZ_tt:0 "If present: Replace §YIndustrial and Environmental Burdens§! with §YManaged Industrial and Environmental Burdens§!"
 COLDWAR_SSR_regional_aftercare_UZB_tt:0 "If present: Replace §YCotton and Irrigation Dependence§! with §YManaged Cotton and Irrigation Dependence§!"
 COLDWAR_SSR_regional_aftercare_TRK_tt:0 "If present: Replace §YIrrigated Desert Economy§! with §YManaged Irrigated Desert Economy§!"
 COLDWAR_SSR_regional_aftercare_KYR_tt:0 "If present: Replace §YSeasonal Water and Energy Imbalance§! with §YManaged Seasonal Water and Energy Imbalance§!"
 COLDWAR_SSR_regional_aftercare_TAJ_tt:0 "If present: Replace §YUneven Regional Investment§! with §YManaged Uneven Regional Investment§!"
 COLDWAR_SSR_transition_settlement:0 "Economic Settlement"
 COLDWAR_SSR_transition_settlement_desc:0 "Reconstruction must leave behind institutions capable of preventing another cycle of arrears and emergency subsidies. A lasting economic settlement will bring public accounts, commercial law and industrial policy into a coherent national framework."
 COLDWAR_SSR_defence_authority:0 "Defence Authority"
 COLDWAR_SSR_defence_authority_desc:0 "The defence of the republic now rests with its own government. A national ministry must establish civilian responsibility, settle personnel obligations and turn inherited military offices into an administration that can support a sovereign chain of command."
 COLDWAR_SSR_name_professional_service:0 "Professional Service"
 COLDWAR_SSR_professional_force:0 "Professional Force"
 COLDWAR_SSR_professional_force_desc:0 "A smaller professional establishment can concentrate instructors, technical specialists and reliable equipment where they are most useful. Its cohesion will come at a substantial personnel cost and a slower path towards a larger army."
 COLDWAR_SSR_name_territorial_service:0 "Territorial Service"
 COLDWAR_SSR_stat_army_defence_factor_tt:0 "Division defence: $RIGHT|+=%2$"
 COLDWAR_SSR_territorial_force:0 "Territorial Service"
 COLDWAR_SSR_territorial_force_desc:0 "Territorial service ties defence to communities throughout the republic. A broad reserve will prepare local protection and mobilisation, while accepting less uniform instruction and weaker cohesion than a concentrated professional force."
 COLDWAR_SSR_maintenance_command:0 "Maintenance Command"
 COLDWAR_SSR_maintenance_command_desc:0 "A new flag does not provide spare parts, trained mechanics or a dependable pay system. A national maintenance command will bring those responsibilities together and give the armed forces a practical foundation beneath their formal independence."
 COLDWAR_SSR_local_officers:0 "Officer School"
 COLDWAR_SSR_local_officers_desc:0 "The republic needs officers whose careers and professional loyalties are rooted in its own institutions. A national officer school will train a new generation in command, technical service and the demands of maintaining a force the country can afford."
 COLDWAR_SSR_name_national_defence_administration:0 "National Defence Administration"
 COLDWAR_SSR_reserve_records:0 "Reserve Records"
 COLDWAR_SSR_reserve_records_desc:0 "Reservists cannot be mobilised effectively from incomplete lists and outdated addresses. A national reserve service will establish dependable records and training schedules, with a continuing burden on personnel and local administration."
 COLDWAR_SSR_defence_settlement:0 "Command Settlement"
 COLDWAR_SSR_defence_settlement_desc:0 "Competing claims over command, maintenance and recruitment have left too much uncertainty in military affairs. A final administrative settlement will make responsibilities clear and allow defence planning to proceed beyond the immediate disputes of separation."
 COLDWAR_SSR_mobile_defence:0 "Mobile Defence"
 COLDWAR_SSR_mobile_defence_desc:0 "A mobile force can concentrate against threats before they become a fixed front. Training for manoeuvre will improve operational cohesion, while demanding more fuel, technical instruction and maintenance from a still limited defence budget."
 COLDWAR_SSR_prepared_defence:0 "Prepared Defence"
 COLDWAR_SSR_prepared_defence_desc:0 "Prepared positions and deliberate territorial planning can make a smaller force difficult to dislodge. The army will favour sustained defence over rapid movement, accepting the logistical burden of maintaining a wider defensive system."
 COLDWAR_SSR_name_foreign_service:0 "Foreign Service"
 COLDWAR_SSR_stat_foreign_influence_modifier_tt:0 "Foreign influence gain: $RIGHT|+=%2$"
 COLDWAR_SSR_foreign_service:0 "Foreign Service"
 COLDWAR_SSR_foreign_service_desc:0 "For decades, foreign affairs were conducted through the Union's embassies and central ministries. Our republic must now speak with its own voice. A professional diplomatic service will defend our interests abroad, negotiate access to markets and establish the relationships on which lasting independence depends."
 COLDWAR_SSR_requires_offer_partner_tt:0 "An eligible independent partner is available for a new agreement"
 COLDWAR_SSR_old_market_offer:0 "Clearing Agreement"
 COLDWAR_SSR_old_market_offer_desc:0 "The frontiers have changed, but our factories still depend on familiar customers and suppliers. A clearing convention with the former Union centre could preserve essential deliveries and settle commercial accounts, placing economic continuity above the resentments of separation."
 COLDWAR_SSR_new_market_offer:0 "Technical Partnership"
 COLDWAR_SSR_new_market_offer_desc:0 "New markets demand machinery, standards and commercial knowledge that our enterprises cannot acquire overnight. A technical partnership will invite outside expertise into reconstruction, exchanging part of our economic freedom for faster access to the means of modern production."
 COLDWAR_SSR_border_offer:0 "Border Commission"
 COLDWAR_SSR_border_offer_desc:0 "A frontier must become more than a line defended by suspicious officials. A joint border commission can regulate crossings, customs and practical disputes, preserving ordinary trade without allowing unresolved questions to poison every relationship with our neighbour."
 COLDWAR_SSR_training_offer:0 "Training Convention"
 COLDWAR_SSR_training_offer_desc:0 "Our armed forces need instructors and experience suited to their new responsibilities. A training convention with a capable partner will open military schools and technical cooperation, bringing outside influence into institutions whose independence remains politically sensitive."
 COLDWAR_SSR_civil_neutrality:0 "Civil Neutrality"
 COLDWAR_SSR_civil_neutrality_desc:0 "The republic can defend its independence without placing its security in the hands of another patron. A policy of armed neutrality will favour territorial readiness and civilian diplomacy, accepting the limits of a defence establishment built largely from domestic resources."
 COLDWAR_SSR_energy_offer:0 "Energy and Transit"
 COLDWAR_SSR_energy_offer_desc:0 "Power stations, pipelines and factories were built for an interconnected economy. An energy and transit convention can keep those connections operating across new frontiers, giving both governments a practical interest in reliable deliveries and predictable charges."
 COLDWAR_SSR_river_offer:0 "Water Commission"
 COLDWAR_SSR_river_offer_desc:0 "Rivers do not end at the republic's frontier. Irrigation, reservoirs and industrial water supplies bind neighbouring states to one another. A shared commission will negotiate releases and conservation before seasonal shortages become a permanent source of political confrontation."
 COLDWAR_SSR_regional_service:0 "Regional Diplomacy"
 COLDWAR_SSR_regional_service_desc:0 "Neighbouring governments will judge the republic by its ability to honour practical agreements. Experienced diplomatic and technical staff will turn negotiations on trade, water and transport into relationships that can survive a disagreement between political leaders."
 COLDWAR_SSR_UKR_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_UKR_regional_review_desc:0 "The economy of Ukrainian SSR has grown around heavy industry, coal and union defence orders. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_name_republican_development_programme:0 "Republican Development Programme"
 COLDWAR_SSR_UKR_regional_orders:0 "Industrial Balance"
 COLDWAR_SSR_UKR_regional_orders_desc:0 "Industrial Balance draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_UKR_regional_diversify:0 "Consumer Industry"
 COLDWAR_SSR_UKR_regional_diversify_desc:0 "Consumer Diversification will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
 COLDWAR_SSR_UKR_regional_standards_replace_tt:0 "Replace §YHeavy-Industrial Imbalance§! with §YManaged Heavy-Industrial Imbalance§!"
 COLDWAR_SSR_UKR_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_UKR_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_directed_reform:0 "Directed Reconstruction"
 COLDWAR_SSR_directed_reform_desc:0 "The state will retain command of strategic enterprises and finance their reconstruction through a national investment plan. Public control can protect jobs and essential supply, but the treasury must carry risks that a private investor would refuse."
 COLDWAR_SSR_name_communist_party_of_ukraine_programme:0 "Communist Party of Ukraine Programme"
 COLDWAR_SSR_UKR_p4_root:0 "A Workers' Republic"
 COLDWAR_SSR_UKR_p4_root_desc:0 "The Communist Party of Ukraine inherits the Donbas coal basin, Dnieper industry, and a large agricultural sector. Its independent state can preserve public ownership while redirecting investment toward Ukrainian needs. The choice is whether command follows strategic orders or daily supply."
 COLDWAR_SSR_UKR_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_UKR_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_UKR_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_UKR_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_stat_production_speed_industrial_complex_factor_tt:0 "Civilian factory construction speed: $RIGHT|+=%2$"
 COLDWAR_SSR_UKR_p4_institution:0 "Dnieper Machine Works"
 COLDWAR_SSR_UKR_p4_institution_desc:0 "Dnieper plants make civilian machinery, pumps, and electrical equipment for Ukrainian farms and factories. Coordinated investment improves civilian productivity and expands workshop capacity, but power and capital demands leave less room for consumer goods and smaller suppliers."
 COLDWAR_SSR_stat_corporate_tax_income_multiplier_modifier_tt:0 "Corporate tax revenue multiplier: $RIGHT|+=%2$"
 COLDWAR_SSR_stat_consumer_goods_factor_tt:0 "Consumer goods factor: $RIGHT|-=%2$"
 COLDWAR_SSR_UKR_p4_public:0 "State Investment"
 COLDWAR_SSR_UKR_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_UKR_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_UKR_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
 COLDWAR_SSR_UKR_p4_production:0 "Strategic Workshops"
 COLDWAR_SSR_UKR_p4_production_desc:0 "A strategic workshop programme will give public armaments enterprises the facilities needed to honour national orders. Its maintenance and power needs will remain a public obligation even when demand becomes less favourable."
 COLDWAR_SSR_UKR_p4_consumer:0 "Cooperative Supply"
 COLDWAR_SSR_UKR_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_UKR_p4_development:0 "Breadbasket Stores"
 COLDWAR_SSR_UKR_p4_development_desc:0 "Grain production is valuable only when it can be stored, processed, and delivered. Republican depots and food combines reduce waste and improve household supply, while investment diverted from heavy industry limits the next expansion of military production."
 COLDWAR_SSR_UKR_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_UKR_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
 COLDWAR_SSR_UKR_p4_targeted:0 "Targeted Provision"
 COLDWAR_SSR_UKR_p4_targeted_desc:0 "Support will be concentrated on households and services most exposed to hardship. A narrower commitment can improve public finances, while requiring a larger administrative effort and accepting less universal protection."
 COLDWAR_SSR_UKR_p4_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_UKR_p4_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_UKR_p4_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_UKR_p4_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_UKR_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_UKR_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_ukrainian_supreme_liberation_council_programme:0 "Ukrainian Supreme Liberation Council Programme"
 COLDWAR_SSR_UKR_p0_root:0 "The Liberation Council"
 COLDWAR_SSR_UKR_p0_root_desc:0 "The Ukrainian Supreme Liberation Council claims the political inheritance of the wartime underground and survives through exile networks. Independence gives it authority at home, but the council must replace clandestine command with accountable civil institutions if its claim is to reach beyond veterans."
 COLDWAR_SSR_UKR_p0_civic:0 "Civilian Council"
 COLDWAR_SSR_UKR_p0_civic_desc:0 "The Liberation Council opens cabinet deliberations to elected municipal delegates, teachers, and former political prisoners. Public participation broadens its authority beyond wartime networks, while veteran commanders give up the exclusive voice they held in exile."
 COLDWAR_SSR_UKR_p0_executive:0 "Council Secretariat"
 COLDWAR_SSR_UKR_p0_executive_desc:0 "A disciplined secretariat coordinates the council's diaspora offices and the new republic's ministries. It can move quickly through a divided administration, but underground habits and concentrated appointments make civilian oversight harder to establish."
 COLDWAR_SSR_UKR_p0_institution:0 "Civilian Mandate"
 COLDWAR_SSR_UKR_p0_institution_desc:0 "The council opens its deliberations to elected municipal delegates, teachers, and representatives of political prisoners. Wider participation gives the new state a public base, though veteran commanders surrender the exclusive authority they exercised in exile."
 COLDWAR_SSR_UKR_p0_archives:0 "Open Party Archives"
 COLDWAR_SSR_UKR_p0_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_UKR_p0_public:0 "Village Cooperatives"
 COLDWAR_SSR_UKR_p0_public_desc:0 "Farm cooperatives share machinery, credit, and storage while protecting smallholders from sudden land sales. The model builds rural loyalty and food capacity, but capital-intensive industry grows more slowly than under a concentrated state investment plan."
 COLDWAR_SSR_UKR_p0_market:0 "Diaspora Industry Fund"
 COLDWAR_SSR_UKR_p0_market_desc:0 "Ukrainian exile donors finance machine shops, power repairs, and technical schools through a public fund. Investment arrives with skills and overseas contacts, but contributors gain influence over priorities that local voters may rank differently."
 COLDWAR_SSR_UKR_p0_production:0 "Farm Machinery Service"
 COLDWAR_SSR_UKR_p0_production_desc:0 "Repair depots and cooperative credit extend tractors, seed, and storage to small farms. Harvest losses fall, although public support must continue where landholdings are too small to repay equipment loans quickly."
 COLDWAR_SSR_UKR_p0_consumer:0 "Prolog Press House"
 COLDWAR_SSR_UKR_p0_consumer_desc:0 "Diaspora publishers and local editors restore Ukrainian books, technical journals, and school texts. Cultural work strengthens public life and technical learning, but printing and distribution compete with urgent factory investment."
 COLDWAR_SSR_UKR_p0_development:0 "Village Cooperatives"
 COLDWAR_SSR_UKR_p0_development_desc:0 "Cooperative credit and shared machinery help small farms regain access to land and markets. Rural output and local confidence grow, but this patient model cannot finance heavy industry as quickly as concentrated state or diaspora investment."
 COLDWAR_SSR_UKR_p0_universal:0 "Low Business Levies"
 COLDWAR_SSR_UKR_p0_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_UKR_p0_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_UKR_p0_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_UKR_p0_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_UKR_p0_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_UKR_p0_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_UKR_p0_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_UKR_p0_settlement:0 "A Free Republic"
 COLDWAR_SSR_UKR_p0_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_state_centre_of_the_ukrainian_people_s_republic_in_exile_programme:0 "State Centre of the Ukrainian People's Republic in Exile Programme"
 COLDWAR_SSR_UKR_p1_root:0 "The UPR State Centre"
 COLDWAR_SSR_UKR_p1_root_desc:0 "The State Centre of the Ukrainian People's Republic in exile preserves the legal continuity of the republic through its president and National Council. Its return brings a parliamentary claim rather than a single party's mandate, and property, citizenship, and regional representation remain contested."
 COLDWAR_SSR_UKR_p1_civic:0 "National Council"
 COLDWAR_SSR_UKR_p1_civic_desc:0 "The State Centre's National Council seats exile parties, regional representatives, and citizens who remained in Ukraine. A broad parliament can make legal continuity credible at home, but coalition bargaining slows decisions over land, language, and the former state economy."
 COLDWAR_SSR_UKR_p1_executive:0 "Presidential Mandate"
 COLDWAR_SSR_UKR_p1_executive_desc:0 "A responsible executive draws on the UPR's constitutional inheritance to settle urgent questions of citizenship and public order. Concentrated authority speeds reconstruction, while the National Council must work harder to keep political rivals inside the legal settlement."
 COLDWAR_SSR_UKR_p1_institution:0 "Land Claims Tribunal"
 COLDWAR_SSR_UKR_p1_institution_desc:0 "A public tribunal hears claims by former owners, tenants, and the families who now work the land. Legal certainty helps farms obtain credit, but complex restitution delays investment and can reopen wounds that village life has tried to close."
 COLDWAR_SSR_UKR_p1_archives:0 "Open Party Archives"
 COLDWAR_SSR_UKR_p1_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_UKR_p1_public:0 "Land Claims Tribunal"
 COLDWAR_SSR_UKR_p1_public_desc:0 "A tribunal hears former owners, tenants, and families who cultivate land today before deciding restitution or compensation. Clear titles can unlock farm credit and investment, but hearings delay transactions and can divide villages over competing claims."
 COLDWAR_SSR_UKR_p1_market:0 "Smallholder Credit"
 COLDWAR_SSR_UKR_p1_market_desc:0 "A parliamentary bank directs savings to small farms, food processors, and local workshops rather than returning every asset to its former owner. New producers gain capital, while slow public lending limits the first wave of expansion."
 COLDWAR_SSR_UKR_p1_production:0 "Farm Title Registry"
 COLDWAR_SSR_UKR_p1_production_desc:0 "A public registry records land claims and tenancy rights before credit and investment expand. Farmers gain legal certainty, but unresolved restitution cases continue to tie up property and staff."
 COLDWAR_SSR_UKR_p1_consumer:0 "Parliamentary Works"
 COLDWAR_SSR_UKR_p1_consumer_desc:0 "The National Council finances rail, housing, and power repairs through a public works bank with published accounts. Reconstruction reaches several regions, but repayment obligations limit later spending on schools and services."
 COLDWAR_SSR_UKR_p1_development:0 "National Credit Bank"
 COLDWAR_SSR_UKR_p1_development_desc:0 "A parliamentary bank directs savings toward farm machinery, food processing, and Ukrainian-owned workshops. Patient credit helps smaller producers compete, while strict lending standards make the recovery slower than a rapid sale of state assets."
 COLDWAR_SSR_UKR_p1_universal:0 "Low Business Levies"
 COLDWAR_SSR_UKR_p1_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_UKR_p1_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_UKR_p1_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_UKR_p1_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_UKR_p1_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_UKR_p1_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_UKR_p1_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_UKR_p1_settlement:0 "A Free Republic"
 COLDWAR_SSR_UKR_p1_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_the_sixtiers_programme:0 "The Sixtiers Programme"
 COLDWAR_SSR_UKR_p2_root:0 "A Republic of Rights"
 COLDWAR_SSR_UKR_p2_root_desc:0 "The Sixtiers are poets, critics, artists, and rights advocates whose public language became vulnerable after the 1965 arrests. A sovereign coalition of cultural institutions can turn constitutional guarantees into lived protections, but it begins without the machinery of a mass political party."
 COLDWAR_SSR_UKR_p2_civic:0 "Rights Charter"
 COLDWAR_SSR_UKR_p2_civic_desc:0 "The Sixtiers' rights advocates turn constitutional guarantees into enforceable protections for speech, language, and fair trials. Independent courts gain authority, while the young civic coalition must accept that legal review can delay policies popular with its own supporters."
 COLDWAR_SSR_UKR_p2_executive:0 "Civic Cabinet"
 COLDWAR_SSR_UKR_p2_executive_desc:0 "A cabinet of educators, lawyers, and local administrators coordinates the first republic-wide reforms. Skilled officials can restore public services quickly, but a narrow circle of intellectuals risks speaking over workers and rural communities."
 COLDWAR_SSR_UKR_p2_institution:0 "Open University"
 COLDWAR_SSR_UKR_p2_institution_desc:0 "Universities regain control over appointments, research, and Ukrainian-language teaching. Scientific exchange and technical training improve, but autonomy brings public scrutiny of budgets and reduces the cabinet's ability to direct every graduate into priority industries."
 COLDWAR_SSR_UKR_p2_public:0 "University Co-ops"
 COLDWAR_SSR_UKR_p2_public_desc:0 "University and student cooperatives retain public campuses while selling research, translation, and technical services to Ukrainian firms. Knowledge reaches new customers, but commercial work can draw staff away from public teaching and basic science."
 COLDWAR_SSR_UKR_p2_market:0 "Local Workshop Charter"
 COLDWAR_SSR_UKR_p2_market_desc:0 "Cities license independent repair shops and small manufacturers with open access to credit and contracts. Employment spreads beyond large combines, while fragmented supply and uneven standards limit productivity in major industrial plants."
 COLDWAR_SSR_UKR_p2_production:0 "Engineering Press"
 COLDWAR_SSR_UKR_p2_production_desc:0 "Independent technical journals and university laboratories share new methods with factories. Research reaches the productive economy, though results take time and do not immediately restore household supply."
 COLDWAR_SSR_UKR_p2_consumer:0 "Municipal Repair Shops"
 COLDWAR_SSR_UKR_p2_consumer_desc:0 "Municipal contracts support repair, furniture, and household-equipment shops in industrial cities. Everyday goods return sooner, but local firms compete for skilled workers and investment with larger state plants."
 COLDWAR_SSR_UKR_p2_development:0 "Local Workshops"
 COLDWAR_SSR_UKR_p2_development_desc:0 "Municipal contracts and cooperative loans help workshops make tools, household goods, and repair parts. Employment spreads beyond large combines, though a fragmented supplier base slows construction of new factory capacity."
 COLDWAR_SSR_UKR_p2_universal:0 "Low Business Levies"
 COLDWAR_SSR_UKR_p2_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_UKR_p2_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_UKR_p2_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_UKR_p2_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_UKR_p2_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_UKR_p2_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_UKR_p2_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_UKR_p2_settlement:0 "A Free Republic"
 COLDWAR_SSR_UKR_p2_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_ukrainian_revolutionary_democratic_party_programme:0 "Ukrainian Revolutionary Democratic Party Programme"
 COLDWAR_SSR_UKR_p3_root:0 "A Labour Republic"
 COLDWAR_SSR_UKR_p3_root_desc:0 "The Ukrainian Revolutionary Democratic Party grew among postwar émigrés and rejects both Soviet rule and authoritarian nationalism. It seeks an independent democratic Ukraine with land for those who work it, strong unions, and a social market that protects workers without restoring the command economy."
 COLDWAR_SSR_UKR_p3_civic:0 "Labour Assembly"
 COLDWAR_SSR_UKR_p3_civic_desc:0 "The URDP convenes unions, farm associations, and parliamentary parties to write the social settlement. Workers and smallholders gain a durable voice, while coalition negotiations make national production and wage agreements harder to conclude quickly."
 COLDWAR_SSR_UKR_p3_executive:0 "Social Cabinet"
 COLDWAR_SSR_UKR_p3_executive_desc:0 "A social cabinet coordinates reconstruction with elected labour and farmer representatives. It can protect employment and public services during conversion, but concentrating decisions among party officials weakens local bargaining."
 COLDWAR_SSR_UKR_p3_institution:0 "Workers' Contracts"
 COLDWAR_SSR_UKR_p3_institution_desc:0 "Independent unions bargain over wages, safety, and restructuring instead of receiving instructions from party officials. Better workplace cooperation can protect skilled production, while negotiated changes take longer and delay new civilian plant construction."
 COLDWAR_SSR_UKR_p3_archives:0 "Open Party Archives"
 COLDWAR_SSR_UKR_p3_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_UKR_p3_public:0 "Worker-Farmer Coops"
 COLDWAR_SSR_UKR_p3_public_desc:0 "Worker and farmer cooperatives own shares in processing, tools, and local distribution. Participation protects livelihoods and spreads income, but shared control makes large investment decisions slower and more difficult to finance."
 COLDWAR_SSR_UKR_p3_market:0 "Social Market Firms"
 COLDWAR_SSR_UKR_p3_market_desc:0 "Independent firms gain access to credit and contracts under labour law and public competition rules. New capital can modernize production faster, while weaker firms and workers face the pressure of market selection."
 COLDWAR_SSR_UKR_p3_production:0 "Union Credit League"
 COLDWAR_SSR_UKR_p3_production_desc:0 "Labour and farm credit leagues finance machinery and working capital for member-owned enterprises. Local employment rises, though public revenues grow more slowly than under large private employers."
 COLDWAR_SSR_UKR_p3_consumer:0 "Clinics and Housing"
 COLDWAR_SSR_UKR_p3_consumer_desc:0 "Parliament directs funds to clinics, housing repairs, and municipal services during industrial conversion. Families receive practical protection, while the treasury delays more ambitious factory modernization."
 COLDWAR_SSR_UKR_p3_development:0 "Peasant Credit"
 COLDWAR_SSR_UKR_p3_development_desc:0 "Public credit supports family farms, cooperatives, and local food processors that can serve nearby towns. Rural employment and agricultural supply improve, but the state accepts lower near-term receipts than a fast auction of land and enterprises."
 COLDWAR_SSR_UKR_p3_universal:0 "Progressive Revenue"
 COLDWAR_SSR_UKR_p3_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_UKR_p3_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_UKR_p3_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_UKR_p3_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_UKR_p3_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_UKR_p3_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_UKR_p3_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_UKR_p3_settlement:0 "A Social Republic"
 COLDWAR_SSR_UKR_p3_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_name_organization_of_ukrainian_nationalists_melnyk_programme:0 "Organization of Ukrainian Nationalists (Melnyk) Programme"
 COLDWAR_SSR_UKR_p20_root:0 "Christian Solidarity"
 COLDWAR_SSR_UKR_p20_root_desc:0 "The Melnyk wing of the OUN relies on an older exile cadre, Christian social thought, and cultural societies. Its conservative nationalist state can build authority through cooperatives and coalition institutions, distinguishing it from the revolutionary command and exclusive claims of the Bandera wing."
 COLDWAR_SSR_UKR_p20_civic:0 "Coalition Council"
 COLDWAR_SSR_UKR_p20_civic_desc:0 "OUN-M shares government with the UPR Council, civic associations, and local cooperatives. The arrangement trades direct movement control for a broader national mandate and a visible break with the exclusive authority claimed by OUN-B."
 COLDWAR_SSR_UKR_p20_executive:0 "Christian Directorate"
 COLDWAR_SSR_UKR_p20_executive_desc:0 "A Christian-national directorate gives experienced exile cadres responsibility for appointments and public service. It can coordinate reconstruction around a common social ethic, but excludes rivals from decisions and risks turning solidarity into party patronage."
 COLDWAR_SSR_UKR_p20_institution:0 "Farm Credit Unions"
 COLDWAR_SSR_UKR_p20_institution_desc:0 "Parish and village credit unions pool savings for seed, machinery, and food storage without displacing smallholders. Local producers gain security and bargaining power, but a cooperative network takes longer to assemble than a single national bank."
 COLDWAR_SSR_UKR_p20_archives:0 "Open Party Archives"
 COLDWAR_SSR_UKR_p20_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_UKR_p20_public:0 "Parish Credit Unions"
 COLDWAR_SSR_UKR_p20_public_desc:0 "Parish and village credit unions lend to family farms, dairies, and workshops under published rules. Small producers preserve their independence and gain machinery, while a dispersed cooperative network cannot match the scale of centralized industrial credit."
 COLDWAR_SSR_UKR_p20_market:0 "Guild Contracts"
 COLDWAR_SSR_UKR_p20_market_desc:0 "Independent industrial guilds bid for public orders in machinery, food processing, and transport repair. Skilled Ukrainian firms gain work and investment, while established guilds can restrict new competitors and raise contract prices."
 COLDWAR_SSR_UKR_p20_production:0 "Cooperative Storage"
 COLDWAR_SSR_UKR_p20_production_desc:0 "Shared granaries, dairies, and repair depots help village producers reach markets without selling their land. Rural incomes improve, though cooperative managers need training and public audits to prevent local favoritism."
 COLDWAR_SSR_UKR_p20_consumer:0 "Guild Apprenticeships"
 COLDWAR_SSR_UKR_p20_consumer_desc:0 "Industrial guilds train apprentices in machine repair, metalwork, and quality control. Skilled employment rises in Ukrainian firms, but training costs arrive before every workshop can secure long-term orders."
 COLDWAR_SSR_UKR_p20_development:0 "Industrial Guilds"
 COLDWAR_SSR_UKR_p20_development_desc:0 "Craft guilds and industrial associations coordinate training, standards, and contracts across Ukrainian firms. The model rewards skilled local production, while conservative bargaining among established firms can restrict entry by new competitors."
 COLDWAR_SSR_UKR_p20_universal:0 "Low Business Levies"
 COLDWAR_SSR_UKR_p20_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_UKR_p20_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_UKR_p20_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_UKR_p20_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_UKR_p20_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_UKR_p20_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_UKR_p20_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_UKR_p20_settlement:0 "National Consolidation"
 COLDWAR_SSR_UKR_p20_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_UKR_p20_civilian:0 "Civilian Settlement"
 COLDWAR_SSR_UKR_p20_civilian_desc:0 "Veteran organisations and political cadres must find a place within national law. Giving civilian institutions the final authority will broaden consent and attract independent expertise, while requiring the movement to share a power it once claimed exclusively."
 COLDWAR_SSR_UKR_p20_cadres:0 "National Directorate"
 COLDWAR_SSR_UKR_p20_cadres_desc:0 "A permanent national directorate will bind military and administrative leadership to the governing movement. It promises discipline and coordinated authority, while deepening the dependence of the state on a narrow and costly political establishment."
 COLDWAR_SSR_name_organization_of_ukrainian_nationalists_bandera_programme:0 "Organization of Ukrainian Nationalists (Bandera) Programme"
 COLDWAR_SSR_UKR_p21_root:0 "A Revolutionary State"
 COLDWAR_SSR_UKR_p21_root_desc:0 "The Bandera wing of the OUN claims a revolutionary right to lead an independent Ukraine and treats compromise with Soviet authority as betrayal. Its cadre can mobilize quickly, but an exclusive national movement faces resistance from rival parties, minorities, and citizens wary of coercive rule."
 COLDWAR_SSR_UKR_p21_civic:0 "National Assembly"
 COLDWAR_SSR_UKR_p21_civic_desc:0 "A constituent assembly gives parties, churches, unions, and regional delegates a lawful way to contest the Bandera movement's claim to rule. Consent and outside expertise broaden legitimacy, while the revolutionary cadre yields part of its command."
 COLDWAR_SSR_UKR_p21_executive:0 "Cadre Command"
 COLDWAR_SSR_UKR_p21_executive_desc:0 "A single national command binds the movement's cadres to ministries, security, and production offices. It can issue decisions quickly, but surveillance, political exclusion, and costly loyal appointments make the state feared as well as obeyed."
 COLDWAR_SSR_UKR_p21_institution:0 "National Syndicates"
 COLDWAR_SSR_UKR_p21_institution_desc:0 "Employers and workers are organized into state-supervised syndicates that prioritize rifles, vehicles, ammunition, and communications equipment for the armed forces. The system can redirect arms plants quickly, but independent unions and private competitors lose influence over wages and investment."
 COLDWAR_SSR_UKR_p21_archives:0 "Open Party Archives"
 COLDWAR_SSR_UKR_p21_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_UKR_p21_public:0 "National Syndicates"
 COLDWAR_SSR_UKR_p21_public_desc:0 "The state organizes employers and workers into syndicates that prioritize rifles, vehicles, ammunition, and communications equipment for the armed forces. Coordinated capital restores military supply, but independent unions and small competitors lose influence over wages, contracts, and investment."
 COLDWAR_SSR_UKR_p21_market:0 "Protected Workshops"
 COLDWAR_SSR_UKR_p21_market_desc:0 "Private workshops receive secure state contracts for tools, clothing, and repair parts. Consumer supply responds quickly, while political protection and favored suppliers weaken competition and raise public procurement costs."
 COLDWAR_SSR_UKR_p21_production:0 "Cadre Machine Combine"
 COLDWAR_SSR_UKR_p21_production_desc:0 "A state combine concentrates weapons, military vehicles, and metalworking around army procurement. Arms output and efficiency rise, but appointments and energy allocations remain tied to political loyalty and a large administrative apparatus."
 COLDWAR_SSR_UKR_p21_consumer:0 "National Service Shops"
 COLDWAR_SSR_UKR_p21_consumer_desc:0 "State-backed shops provide household goods and repairs in cities neglected by strategic plants. Everyday supply improves, though public contracts reinforce the same cadre networks that control heavy industry."
 COLDWAR_SSR_UKR_p21_development:0 "Cadre Procurement"
 COLDWAR_SSR_UKR_p21_development_desc:0 "A central procurement office directs contracts to workshops chosen for national production priorities. Strategic orders arrive sooner, while political patronage and limited competition risk raising costs across the civilian economy."
 COLDWAR_SSR_UKR_p21_universal:0 "Low Business Levies"
 COLDWAR_SSR_UKR_p21_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_UKR_p21_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_UKR_p21_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_UKR_p21_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_UKR_p21_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_UKR_p21_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_UKR_p21_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_UKR_p21_settlement:0 "National Consolidation"
 COLDWAR_SSR_UKR_p21_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_UKR_p21_civilian:0 "Civilian Settlement"
 COLDWAR_SSR_UKR_p21_civilian_desc:0 "Veteran organisations and political cadres must find a place within national law. Giving civilian institutions the final authority will broaden consent and attract independent expertise, while requiring the movement to share a power it once claimed exclusively."
 COLDWAR_SSR_UKR_p21_cadres:0 "National Directorate"
 COLDWAR_SSR_UKR_p21_cadres_desc:0 "A permanent national directorate will bind military and administrative leadership to the governing movement. It promises discipline and coordinated authority, while deepening the dependence of the state on a narrow and costly political establishment."
 COLDWAR_SSR_name_union_aviation_programme:0 "Union Aviation Programme"
 COLDWAR_SSR_stat_air_training_xp_gain_factor_tt:0 "Air training experience gain: $RIGHT|+=%2$"
 COLDWAR_SSR_equipment_small_plane_airframe_tt:0 "§Y$small_plane_airframe$§!"
 COLDWAR_SSR_equipment_stat_build_cost_ic_tt:0 "Production cost: $RIGHT|-=%2$"
 COLDWAR_SSR_equipment_small_plane_strike_airframe_tt:0 "§Y$small_plane_strike_airframe$§!"
 COLDWAR_SSR_equipment_small_plane_cas_airframe_tt:0 "§Y$small_plane_cas_airframe$§!"
 COLDWAR_SSR_equipment_medium_plane_fighter_airframe_tt:0 "§Y$medium_plane_fighter_airframe$§!"
 COLDWAR_SSR_equipment_medium_plane_airframe_tt:0 "§Y$medium_plane_airframe$§!"
 COLDWAR_SSR_equipment_medium_plane_cas_airframe_tt:0 "§Y$medium_plane_cas_airframe$§!"
 COLDWAR_SSR_equipment_large_plane_air_transport_airframe_tt:0 "§Y$large_plane_air_transport_airframe$§!"
 COLDWAR_SSR_independence_preview_tt:0 "§YAfter independence:§!"
 COLDWAR_SSR_name_independent_aviation_complex:0 "Independent Aviation Complex"
 COLDWAR_SSR_special_aircraft_mandate:0 "Aviation and Aircraft"
 COLDWAR_SSR_special_aircraft_mandate_desc:0 "Aircraft production links design bureaux, precision workshops and flying schools across the Union. Common tooling and component orders will lower the cost of light fighters, strike aircraft, air-superiority fighters, multirole aircraft, close-support aircraft and heavy transports. These advantages depend on customers and suppliers beyond the republic. Historical precedent: Ukraine's Antonov centers, Tbilisi's Su-25 line from 1978, and Tashkent's Il-76 plant from 1973 show distinct Soviet aircraft-production roles."
 COLDWAR_SSR_special_aircraft_works:0 "Aviation Workshops"
 COLDWAR_SSR_special_aircraft_works_desc:0 "Airframe tooling and repair facilities will gather skilled workers around a permanent aviation centre. The workshops must meet specifications issued across a much larger industrial network, with a continuing appetite for specialised materials and power. Historical precedent: Ukraine's Antonov centers, Tbilisi's Su-25 line from 1978, and Tashkent's Il-76 plant from 1973 show distinct Soviet aircraft-production roles."
 COLDWAR_SSR_special_aircraft_schools:0 "Aviation Institutes"
 COLDWAR_SSR_special_aircraft_schools_desc:0 "Designers, production engineers and flying instructors must learn to work with the same technical standards. Strengthening aviation education will give the republic a larger voice in projects whose complexity reaches far beyond a single factory. Historical precedent: Ukraine's Antonov centers, Tbilisi's Su-25 line from 1978, and Tashkent's Il-76 plant from 1973 show distinct Soviet aircraft-production roles."
 COLDWAR_SSR_special_aircraft_left:0 "Aircraft Production"
 COLDWAR_SSR_special_aircraft_left_desc:0 "Priority will go to manufacturing fighters, strike aircraft, close-support aircraft and heavy transports. Dedicated tooling will lower their production costs further, while better workshop organisation also strengthens military manufacturing. These advantages require the steady flow of materials and technical instructions supplied through the Union. Historical precedent: Ukraine's Antonov centers, Tbilisi's Su-25 line from 1978, and Tashkent's Il-76 plant from 1973 show distinct Soviet aircraft-production roles."
 COLDWAR_SSR_special_aircraft_left_follow:0 "Precision Airframes"
 COLDWAR_SSR_special_aircraft_left_follow_desc:0 "Precision workshops will concentrate on consistent components and production quality. Their machinery can support civilian engineering as well, but the investment increases dependence on imported tools and materials. Historical precedent: Ukraine's Antonov centers, Tbilisi's Su-25 line from 1978, and Tashkent's Il-76 plant from 1973 show distinct Soviet aircraft-production roles."
 COLDWAR_SSR_stat_air_fuel_consumption_factor_tt:0 "Air fuel consumption: $RIGHT|-=%2$"
 COLDWAR_SSR_special_aircraft_right:0 "Air Service Schools"
 COLDWAR_SSR_special_aircraft_right_desc:0 "Flying schools and technical service units will take priority over another expansion of aircraft assembly. Better instruction and maintenance can keep aircraft useful for longer, although the training establishment requires instructors, fuel and dependable public funding. Historical precedent: Ukraine's Antonov centers, Tbilisi's Su-25 line from 1978, and Tashkent's Il-76 plant from 1973 show distinct Soviet aircraft-production roles."
 COLDWAR_SSR_special_aircraft_right_follow:0 "Flight Instructors"
 COLDWAR_SSR_special_aircraft_right_follow_desc:0 "A permanent instructor corps will carry experience between schools and operational units. It strengthens the republic's technical contribution without allowing training standards to depend on a handful of individual officers. Historical precedent: Ukraine's Antonov centers, Tbilisi's Su-25 line from 1978, and Tashkent's Il-76 plant from 1973 show distinct Soviet aircraft-production roles."
 COLDWAR_SSR_special_aircraft_office:0 "Aviation Supply Office"
 COLDWAR_SSR_special_aircraft_office_desc:0 "An aviation supply office will coordinate spare parts, workshop schedules and technical documentation. Better administration can reduce waste, but the specialised industry will remain bound to the wider network that sustains its orders. Historical precedent: Ukraine's Antonov centers, Tbilisi's Su-25 line from 1978, and Tashkent's Il-76 plant from 1973 show distinct Soviet aircraft-production roles."
 COLDWAR_SSR_special_aircraft_priority:0 "Priority Allocations"
 COLDWAR_SSR_special_aircraft_priority_desc:0 "Priority allocations will protect the specialised programme when materials and technical staff are scarce. Other enterprises and public institutions will have to accept a smaller share of the republic's attention and investment. Historical precedent: Ukraine's Antonov centers, Tbilisi's Su-25 line from 1978, and Tashkent's Il-76 plant from 1973 show distinct Soviet aircraft-production roles."
 COLDWAR_SSR_special_aircraft_efficiency:0 "Lean Administration"
 COLDWAR_SSR_special_aircraft_efficiency_desc:0 "A smaller coordinating service will give workshops and professional institutions more room to solve their own problems. Lower administrative costs come at the price of less direct political control over the specialised programme. Historical precedent: Ukraine's Antonov centers, Tbilisi's Su-25 line from 1978, and Tashkent's Il-76 plant from 1973 show distinct Soviet aircraft-production roles."
 COLDWAR_SSR_special_aircraft_settlement:0 "Union Production Role"
 COLDWAR_SSR_special_aircraft_settlement_desc:0 "The republic has secured a distinctive role in the Union economy. Its specialised institutions now possess skills and capacity that would be difficult to assemble in isolation, together with a lasting dependence on the customers, suppliers and common standards that made their growth possible. Historical precedent: Ukraine's Antonov centers, Tbilisi's Su-25 line from 1978, and Tashkent's Il-76 plant from 1973 show distinct Soviet aircraft-production roles."
 COLDWAR_SSR_name_union_armoured_industry:0 "Union Armoured Industry"
 COLDWAR_SSR_equipment_medium_tank_chassis_tt:0 "§Y$medium_tank_chassis$§!"
 COLDWAR_SSR_name_independent_armoured_complex:0 "Independent Armoured Complex"
 COLDWAR_SSR_special_armour_mandate:0 "Armour Production"
 COLDWAR_SSR_special_armour_mandate_desc:0 "Armoured vehicle production demands metallurgy, engines, precision machinery and a dependable military customer. Union component orders will lower the cost of main battle tanks and sustain a privileged place in military procurement, provided we accept the cost of building an industrial chain that few republics possess in full. Historical precedent: Kharkiv's Malyshev plant and Morozov bureau developed and produced the T-64, a major Ukrainian SSR tank-building example."
 COLDWAR_SSR_special_armour_works:0 "Armoured Workshops"
 COLDWAR_SSR_special_armour_works_desc:0 "Dedicated machining and assembly halls will prepare the republic for armoured vehicle contracts. The new capacity must be supported by testing facilities, trained personnel and a steady supply of engines, armour and other specialised components. Historical precedent: Kharkiv's Malyshev plant and Morozov bureau developed and produced the T-64, a major Ukrainian SSR tank-building example."
 COLDWAR_SSR_special_armour_schools:0 "Vehicle Design Bureau"
 COLDWAR_SSR_special_armour_schools_desc:0 "A vehicle design bureau will connect local engineers with the Union's research and testing institutions. It will allow the republic to improve production methods and adapt established designs to the requirements of long military orders. Historical precedent: Kharkiv's Malyshev plant and Morozov bureau developed and produced the T-64, a major Ukrainian SSR tank-building example."
 COLDWAR_SSR_equipment_stat_armor_value_tt:0 "Armour: $RIGHT|+=%2$"
 COLDWAR_SSR_equipment_stat_reliability_tt:0 "Reliability: $RIGHT|+=%2$"
 COLDWAR_SSR_special_armour_left:0 "Advanced Armour"
 COLDWAR_SSR_special_armour_left_desc:0 "Our engineers will pursue demanding standards of protection and mechanical reliability. Better vehicles can justify higher production costs, while placing greater demands on metallurgy, testing and maintenance. Historical precedent: Kharkiv's Malyshev plant and Morozov bureau developed and produced the T-64, a major Ukrainian SSR tank-building example."
 COLDWAR_SSR_special_armour_left_follow:0 "Armour Test Grounds"
 COLDWAR_SSR_special_armour_left_follow_desc:0 "Permanent trials will expose mechanical weaknesses before an entire production series reaches the troops. The testing service will improve the quality of military engineering while committing skilled staff to work that produces no immediate consumer return. Historical precedent: Kharkiv's Malyshev plant and Morozov bureau developed and produced the T-64, a major Ukrainian SSR tank-building example."
 COLDWAR_SSR_special_armour_right:0 "Serial Tank Production"
 COLDWAR_SSR_special_armour_right_desc:0 "Standardised production will favour long runs of an established vehicle over continual redesign. Methods developed for the tank works will strengthen military manufacturing more broadly. Lower tank costs come at the expense of protection and more ambitious engineering. Historical precedent: Kharkiv's Malyshev plant and Morozov bureau developed and produced the T-64, a major Ukrainian SSR tank-building example."
 COLDWAR_SSR_special_armour_right_follow:0 "Common Spare Parts"
 COLDWAR_SSR_special_armour_right_follow_desc:0 "Long production runs become more useful when workshops can exchange tools, parts and repair instructions. Common components will lower the logistical burden of the republic's military contribution. Historical precedent: Kharkiv's Malyshev plant and Morozov bureau developed and produced the T-64, a major Ukrainian SSR tank-building example."
 COLDWAR_SSR_special_armour_office:0 "Military Order Book"
 COLDWAR_SSR_special_armour_office_desc:0 "A dependable military order book will allow workshops to plan beyond the next allocation. That security binds their future to decisions taken by Union procurement offices and to the suppliers needed to honour those commitments. Historical precedent: Kharkiv's Malyshev plant and Morozov bureau developed and produced the T-64, a major Ukrainian SSR tank-building example."
 COLDWAR_SSR_special_armour_priority:0 "Priority Allocations"
 COLDWAR_SSR_special_armour_priority_desc:0 "Priority allocations will protect the specialised programme when materials and technical staff are scarce. Other enterprises and public institutions will have to accept a smaller share of the republic's attention and investment. Historical precedent: Kharkiv's Malyshev plant and Morozov bureau developed and produced the T-64, a major Ukrainian SSR tank-building example."
 COLDWAR_SSR_special_armour_efficiency:0 "Lean Administration"
 COLDWAR_SSR_special_armour_efficiency_desc:0 "A smaller coordinating service will give workshops and professional institutions more room to solve their own problems. Lower administrative costs come at the price of less direct political control over the specialised programme. Historical precedent: Kharkiv's Malyshev plant and Morozov bureau developed and produced the T-64, a major Ukrainian SSR tank-building example."
 COLDWAR_SSR_special_armour_settlement:0 "Union Production Role"
 COLDWAR_SSR_special_armour_settlement_desc:0 "The republic has secured a distinctive role in the Union economy. Its specialised institutions now possess skills and capacity that would be difficult to assemble in isolation, together with a lasting dependence on the customers, suppliers and common standards that made their growth possible. Historical precedent: Kharkiv's Malyshev plant and Morozov bureau developed and produced the T-64, a major Ukrainian SSR tank-building example."
 COLDWAR_SSR_name_union_ordnance_programme:0 "Union Ordnance Programme"
 COLDWAR_SSR_equipment_artillery_equipment_tt:0 "§Y$artillery_equipment$§!"
 COLDWAR_SSR_equipment_medium_tank_artillery_chassis_tt:0 "§Y$medium_tank_artillery_chassis$§!"
 COLDWAR_SSR_equipment_medium_tank_rocket_chassis_tt:0 "§Y$medium_tank_rocket_chassis$§!"
 COLDWAR_SSR_name_independent_ordnance_complex:0 "Independent Ordnance Complex"
 COLDWAR_SSR_special_artillery_mandate:0 "Artillery and Ordnance"
 COLDWAR_SSR_special_artillery_mandate_desc:0 "Artillery requires more than an assembly hall: barrels, ammunition, sights and specialised steel must arrive to consistent standards. Union designs and supply contracts will lower the production costs of towed artillery, self-propelled guns and multiple rocket launchers, while committing substantial resources to a demanding industrial role. Historical precedent: Perm's Motovilikha works in the RSFSR produced Soviet artillery, including the Uragan launcher developed during the 1970s."
 COLDWAR_SSR_special_artillery_works:0 "Ordnance Works"
 COLDWAR_SSR_special_artillery_works_desc:0 "Dedicated workshops will manufacture and repair artillery components under Union specifications. The project will have to earn its place beside established producers by supplying dependable equipment and maintaining a trained industrial workforce. Historical precedent: Perm's Motovilikha works in the RSFSR produced Soviet artillery, including the Uragan launcher developed during the 1970s."
 COLDWAR_SSR_special_artillery_schools:0 "Ballistics Institute"
 COLDWAR_SSR_special_artillery_schools_desc:0 "A small institute for ballistics and manufacturing science will connect workshop experience with formal research. It will train specialists able to improve ordnance production rather than relying indefinitely on instructions received from elsewhere. Historical precedent: Perm's Motovilikha works in the RSFSR produced Soviet artillery, including the Uragan launcher developed during the 1970s."
 COLDWAR_SSR_equipment_stat_soft_attack_tt:0 "Soft attack: $RIGHT|+=%2$"
 COLDWAR_SSR_special_artillery_left:0 "Precision Ordnance"
 COLDWAR_SSR_special_artillery_left_desc:0 "The programme will favour accuracy, quality control and demanding specifications in guns and rocket artillery. Better weapons can make each battery more effective, but careful machining and inspection consume part of the savings secured through Union supply. Historical precedent: Perm's Motovilikha works in the RSFSR produced Soviet artillery, including the Uragan launcher developed during the 1970s."
 COLDWAR_SSR_special_artillery_left_follow:0 "Fire Control Schools"
 COLDWAR_SSR_special_artillery_left_follow_desc:0 "Technical schools will bring artillery officers and industrial specialists into contact with the same methods of observation and fire control. Their experience will improve the republic's contribution to military training. Historical precedent: Perm's Motovilikha works in the RSFSR produced Soviet artillery, including the Uragan launcher developed during the 1970s."
 COLDWAR_SSR_special_artillery_right:0 "Volume Production"
 COLDWAR_SSR_special_artillery_right_desc:0 "Standardised guns, launchers and ammunition will take priority over expensive refinements. Large contracts and production methods will benefit the wider armaments industry. Lower artillery costs leave less time for the testing and finishing that protect reliability. Historical precedent: Perm's Motovilikha works in the RSFSR produced Soviet artillery, including the Uragan launcher developed during the 1970s."
 COLDWAR_SSR_special_artillery_right_follow:0 "Ordnance Stores"
 COLDWAR_SSR_special_artillery_right_follow_desc:0 "A standardised stock of spare parts and handling equipment will support sustained military supply. Storage and inspection remain essential when a single defective batch can undermine the value of a large production run. Historical precedent: Perm's Motovilikha works in the RSFSR produced Soviet artillery, including the Uragan launcher developed during the 1970s."
 COLDWAR_SSR_special_artillery_office:0 "Artillery Directorate"
 COLDWAR_SSR_special_artillery_office_desc:0 "A permanent directorate will coordinate technical standards, production and service reports. It can reduce waste between the works and the troops, while adding another specialised establishment to the republican budget. Historical precedent: Perm's Motovilikha works in the RSFSR produced Soviet artillery, including the Uragan launcher developed during the 1970s."
 COLDWAR_SSR_special_artillery_priority:0 "Priority Allocations"
 COLDWAR_SSR_special_artillery_priority_desc:0 "Priority allocations will protect the specialised programme when materials and technical staff are scarce. Other enterprises and public institutions will have to accept a smaller share of the republic's attention and investment. Historical precedent: Perm's Motovilikha works in the RSFSR produced Soviet artillery, including the Uragan launcher developed during the 1970s."
 COLDWAR_SSR_special_artillery_efficiency:0 "Lean Administration"
 COLDWAR_SSR_special_artillery_efficiency_desc:0 "A smaller coordinating service will give workshops and professional institutions more room to solve their own problems. Lower administrative costs come at the price of less direct political control over the specialised programme. Historical precedent: Perm's Motovilikha works in the RSFSR produced Soviet artillery, including the Uragan launcher developed during the 1970s."
 COLDWAR_SSR_special_artillery_settlement:0 "Union Production Role"
 COLDWAR_SSR_special_artillery_settlement_desc:0 "The republic has secured a distinctive role in the Union economy. Its specialised institutions now possess skills and capacity that would be difficult to assemble in isolation, together with a lasting dependence on the customers, suppliers and common standards that made their growth possible. Historical precedent: Perm's Motovilikha works in the RSFSR produced Soviet artillery, including the Uragan launcher developed during the 1970s."
 COLDWAR_SSR_name_union_ground_service_programme:0 "Union Ground Service Programme"
 COLDWAR_SSR_equipment_infantry_weapons_type_tt:0 "§Y$infantry_weapons_type$§!"
 COLDWAR_SSR_equipment_util_vehicle_type_tt:0 "§Y$util_vehicle_type$§!"
 COLDWAR_SSR_name_independent_ground_service:0 "Independent Ground Service"
 COLDWAR_SSR_special_army_mandate:0 "Ground Force Service"
 COLDWAR_SSR_special_army_mandate_desc:0 "Training grounds, repair depots and transport services are as necessary to a large army as its weapons factories. Common small-arms and utility-vehicle orders will lower production costs while the republic develops experienced personnel and the logistical institutions that sustain formations in the field. Historical precedent: Tashkent's command courses trained officers in tactics, topography, engineering, and vehicle maintenance for the Union's Central Asian forces."
 COLDWAR_SSR_special_army_works:0 "Training Corridors"
 COLDWAR_SSR_special_army_works_desc:0 "A reliable transport corridor will connect training areas, depots and technical schools. It strengthens civilian communications as well, though military schedules will make substantial demands on the same facilities. Historical precedent: Tashkent's command courses trained officers in tactics, topography, engineering, and vehicle maintenance for the Union's Central Asian forces."
 COLDWAR_SSR_special_army_schools:0 "Land Service Schools"
 COLDWAR_SSR_special_army_schools_desc:0 "Military schools will train officers, mechanics and communications personnel for service in a common command system. The republic's reputation will rest on professional standards rather than the size of a parade. Historical precedent: Tashkent's command courses trained officers in tactics, topography, engineering, and vehicle maintenance for the Union's Central Asian forces."
 COLDWAR_SSR_special_army_left:0 "Professional Cadres"
 COLDWAR_SSR_special_army_left_desc:0 "Longer courses and a permanent instructor corps will favour competence and cohesion. The service will produce better prepared personnel at the price of a slower training cycle and a more expensive establishment. Historical precedent: Tashkent's command courses trained officers in tactics, topography, engineering, and vehicle maintenance for the Union's Central Asian forces."
 COLDWAR_SSR_special_army_left_follow:0 "Staff Exercises"
 COLDWAR_SSR_special_army_left_follow_desc:0 "Staff exercises will test command, communications and supply together. Officers will learn to recognise the administrative weaknesses that can defeat an otherwise capable formation before it reaches the battlefield. Historical precedent: Tashkent's command courses trained officers in tactics, topography, engineering, and vehicle maintenance for the Union's Central Asian forces."
 COLDWAR_SSR_special_army_right:0 "Mass Reserve Schools"
 COLDWAR_SSR_special_army_right_desc:0 "A larger network of reserve schools will prepare personnel throughout the republic. Rapid instruction broadens mobilisation capacity, while placing greater responsibility on later service to complete the training. Historical precedent: Tashkent's command courses trained officers in tactics, topography, engineering, and vehicle maintenance for the Union's Central Asian forces."
 COLDWAR_SSR_special_army_right_follow:0 "Reserve Transport"
 COLDWAR_SSR_special_army_right_follow_desc:0 "Local transport and mobilisation records will be organised around the reserve system. The additional reach comes with a continuing demand for equipment, staff and practical exercises. Historical precedent: Tashkent's command courses trained officers in tactics, topography, engineering, and vehicle maintenance for the Union's Central Asian forces."
 COLDWAR_SSR_special_army_office:0 "Service Depots"
 COLDWAR_SSR_special_army_office_desc:0 "Permanent repair depots will carry technical knowledge between training cycles and keep equipment from deteriorating in storage. Their work strengthens sustained readiness rather than another brief mobilisation campaign. Historical precedent: Tashkent's command courses trained officers in tactics, topography, engineering, and vehicle maintenance for the Union's Central Asian forces."
 COLDWAR_SSR_special_army_priority:0 "Priority Allocations"
 COLDWAR_SSR_special_army_priority_desc:0 "Priority allocations will protect the specialised programme when materials and technical staff are scarce. Other enterprises and public institutions will have to accept a smaller share of the republic's attention and investment. Historical precedent: Tashkent's command courses trained officers in tactics, topography, engineering, and vehicle maintenance for the Union's Central Asian forces."
 COLDWAR_SSR_special_army_efficiency:0 "Lean Administration"
 COLDWAR_SSR_special_army_efficiency_desc:0 "A smaller coordinating service will give workshops and professional institutions more room to solve their own problems. Lower administrative costs come at the price of less direct political control over the specialised programme. Historical precedent: Tashkent's command courses trained officers in tactics, topography, engineering, and vehicle maintenance for the Union's Central Asian forces."
 COLDWAR_SSR_special_army_settlement:0 "Union Production Role"
 COLDWAR_SSR_special_army_settlement_desc:0 "The republic has secured a distinctive role in the Union economy. Its specialised institutions now possess skills and capacity that would be difficult to assemble in isolation, together with a lasting dependence on the customers, suppliers and common standards that made their growth possible. Historical precedent: Tashkent's command courses trained officers in tactics, topography, engineering, and vehicle maintenance for the Union's Central Asian forces."
 COLDWAR_SSR_name_union_maritime_programme:0 "Union Maritime Programme"
 COLDWAR_SSR_stat_industrial_capacity_dockyard_tt:0 "Dockyard output: $RIGHT|+=%2$"
 COLDWAR_SSR_stat_navy_fuel_consumption_factor_tt:0 "Naval fuel consumption: $RIGHT|-=%2$"
 COLDWAR_SSR_equipment_patrol_boat_tt:0 "§Y$patrol_boat$§!"
 COLDWAR_SSR_equipment_corvette_tt:0 "§Y$corvette$§!"
 COLDWAR_SSR_equipment_frigate_tt:0 "§Y$frigate$§!"
 COLDWAR_SSR_name_independent_maritime_complex:0 "Independent Maritime Complex"
 COLDWAR_SSR_special_navy_mandate:0 "Maritime Industry"
 COLDWAR_SSR_special_navy_mandate_desc:0 "Shipyards, repair docks and maritime schools can give the republic a distinctive role in the Union's naval affairs. Common machinery and orders will lower the cost of patrol boats, corvettes and frigates. Such an industry requires a real working coast and customers able to sustain projects measured in years. Historical precedent: Ukraine's Mykolaiv built major combatants, while Klaipeda's yard handled merchant vessels; Soviet naval production followed coastline and specialized yard capacity."
 COLDWAR_SSR_special_navy_works:0 "Maritime Workshops"
 COLDWAR_SSR_special_navy_works_desc:0 "A dedicated yard will strengthen construction and repair on our coast. Its workforce must master an exacting combination of machinery, welding and marine engineering, supported by suppliers that extend far beyond the port itself. Historical precedent: Ukraine's Mykolaiv built major combatants, while Klaipeda's yard handled merchant vessels; Soviet naval production followed coastline and specialized yard capacity."
 COLDWAR_SSR_special_navy_schools:0 "Marine Engineering"
 COLDWAR_SSR_special_navy_schools_desc:0 "Maritime schools will train engineers, technicians and officers for coastal service and ship repair. Their expertise will determine whether new capacity becomes a durable industry or another yard dependent on outside specialists. Historical precedent: Ukraine's Mykolaiv built major combatants, while Klaipeda's yard handled merchant vessels; Soviet naval production followed coastline and specialized yard capacity."
 COLDWAR_SSR_special_navy_left:0 "Shipbuilding Orders"
 COLDWAR_SSR_special_navy_left_desc:0 "The yards will pursue longer patrol-boat, corvette and frigate runs under common specifications. Stable orders and specialised tooling can lower their production costs further, but the republic must carry a substantial demand for materials and power. Historical precedent: Ukraine's Mykolaiv built major combatants, while Klaipeda's yard handled merchant vessels; Soviet naval production followed coastline and specialized yard capacity."
 COLDWAR_SSR_special_navy_left_follow:0 "Marine Suppliers"
 COLDWAR_SSR_special_navy_left_follow_desc:0 "A network of marine suppliers will make the yards less vulnerable to a missing engine, pump or electrical fitting. The workshops also offer a market for civilian engineering and skilled labour. Historical precedent: Ukraine's Mykolaiv built major combatants, while Klaipeda's yard handled merchant vessels; Soviet naval production followed coastline and specialized yard capacity."
 COLDWAR_SSR_stat_navy_org_factor_tt:0 "Naval organisation: $RIGHT|+=%2$"
 COLDWAR_SSR_special_navy_right:0 "Coastal Fleet Service"
 COLDWAR_SSR_special_navy_right_desc:0 "Repair, coastal readiness and technical instruction will take priority over an ambitious construction programme. A dependable local service offers fewer industrial contracts but makes more economical use of the vessels already available. Historical precedent: Ukraine's Mykolaiv built major combatants, while Klaipeda's yard handled merchant vessels; Soviet naval production followed coastline and specialized yard capacity."
 COLDWAR_SSR_special_navy_right_follow:0 "Coastal Training"
 COLDWAR_SSR_special_navy_right_follow_desc:0 "Regular coastal exercises will bring technical services and officers into contact with the conditions in which their vessels actually operate. The programme requires persistent attention to fuel, maintenance and instruction. Historical precedent: Ukraine's Mykolaiv built major combatants, while Klaipeda's yard handled merchant vessels; Soviet naval production followed coastline and specialized yard capacity."
 COLDWAR_SSR_special_navy_office:0 "Maritime Directorate"
 COLDWAR_SSR_special_navy_office_desc:0 "A common directorate will coordinate repairs, training and the yard's order book. Better planning can strengthen the maritime economy while reducing the competition between commercial customers and military schedules. Historical precedent: Ukraine's Mykolaiv built major combatants, while Klaipeda's yard handled merchant vessels; Soviet naval production followed coastline and specialized yard capacity."
 COLDWAR_SSR_special_navy_priority:0 "Priority Allocations"
 COLDWAR_SSR_special_navy_priority_desc:0 "Priority allocations will protect the specialised programme when materials and technical staff are scarce. Other enterprises and public institutions will have to accept a smaller share of the republic's attention and investment. Historical precedent: Ukraine's Mykolaiv built major combatants, while Klaipeda's yard handled merchant vessels; Soviet naval production followed coastline and specialized yard capacity."
 COLDWAR_SSR_special_navy_efficiency:0 "Lean Administration"
 COLDWAR_SSR_special_navy_efficiency_desc:0 "A smaller coordinating service will give workshops and professional institutions more room to solve their own problems. Lower administrative costs come at the price of less direct political control over the specialised programme. Historical precedent: Ukraine's Mykolaiv built major combatants, while Klaipeda's yard handled merchant vessels; Soviet naval production followed coastline and specialized yard capacity."
 COLDWAR_SSR_stat_production_speed_naval_base_factor_tt:0 "Naval base construction speed: $RIGHT|+=%2$"
 COLDWAR_SSR_special_navy_settlement:0 "Union Production Role"
 COLDWAR_SSR_special_navy_settlement_desc:0 "The republic has secured a distinctive role in the Union economy. Its specialised institutions now possess skills and capacity that would be difficult to assemble in isolation, together with a lasting dependence on the customers, suppliers and common standards that made their growth possible. Historical precedent: Ukraine's Mykolaiv built major combatants, while Klaipeda's yard handled merchant vessels; Soviet naval production followed coastline and specialized yard capacity."
 COLDWAR_SSR_name_union_agricultural_programme:0 "Union Agricultural Programme"
 COLDWAR_SSR_stat_agriculture_district_worker_requirement_modifier_tt:0 "Agricultural district workforce requirement: $RIGHT|-=%2$"
 COLDWAR_SSR_stat_agriculture_workers_modifier_tt:0 "Subsistence agricultural workforce requirement: $RIGHT|-=%2$"
 COLDWAR_SSR_name_independent_agricultural_complex:0 "Independent Agricultural Complex"
 COLDWAR_SSR_special_agriculture_mandate:0 "Agriculture and Food"
 COLDWAR_SSR_special_agriculture_mandate_desc:0 "The Union depends on republican farms for grain, livestock, industrial crops and the food consumed in its cities. Agricultural specialisation can secure machinery, processing contracts and a wider market, while increasing dependence on fuel, fertiliser and coordinated water use. Common machinery, storage and technical services will reduce the labour required in agricultural districts and subsistence farming. Historical precedent: Kazakh grain, Uzbek cotton, and Moldovan grapes and fruit illustrate the Union's regional crop specializations."
 COLDWAR_SSR_special_agriculture_works:0 "Processing District"
 COLDWAR_SSR_special_agriculture_works_desc:0 "Processing, storage and repair facilities will keep more of the harvest useful throughout the year. The investment strengthens agriculture only if farms can also obtain the machinery, power and transport required to supply those facilities. Historical precedent: Kazakh grain, Uzbek cotton, and Moldovan grapes and fruit illustrate the Union's regional crop specializations."
 COLDWAR_SSR_special_agriculture_schools:0 "Agricultural Institutes"
 COLDWAR_SSR_special_agriculture_schools_desc:0 "Agronomists and agricultural engineers will work with producers on machinery, storage and the demands of reliable processing. Their task is to turn technical knowledge into improvements suited to local soils and water. Historical precedent: Kazakh grain, Uzbek cotton, and Moldovan grapes and fruit illustrate the Union's regional crop specializations."
 COLDWAR_SSR_special_agriculture_left:0 "Intensive Production"
 COLDWAR_SSR_special_agriculture_left_desc:0 "Larger mechanised units and concentrated water and fertiliser use will pursue the highest possible agricultural output. The harvest can grow quickly, but the strain on energy, land and neighbouring water users will grow with it. Historical precedent: Kazakh grain, Uzbek cotton, and Moldovan grapes and fruit illustrate the Union's regional crop specializations."
 COLDWAR_SSR_special_agriculture_left_follow:0 "Harvest Machinery"
 COLDWAR_SSR_special_agriculture_left_follow_desc:0 "Repair crews and machinery schedules will be organised around the most demanding stages of the harvest. Keeping equipment in the field protects output, provided the republic can maintain its fuel and spare-parts supply. Mechanised harvesting will release workers from both commercial fields and subsistence production, with the largest savings in the organised districts. Historical precedent: Kazakh grain, Uzbek cotton, and Moldovan grapes and fruit illustrate the Union's regional crop specializations."
 COLDWAR_SSR_special_agriculture_right:0 "Diverse Rural Supply"
 COLDWAR_SSR_special_agriculture_right_desc:0 "A broader mix of crops, livestock and local processing will give rural communities more than a single demanding target. The immediate agricultural gain is smaller, while a wider range of goods reaches republican consumers. Historical precedent: Kazakh grain, Uzbek cotton, and Moldovan grapes and fruit illustrate the Union's regional crop specializations."
 COLDWAR_SSR_special_agriculture_right_follow:0 "Rural Cooperatives"
 COLDWAR_SSR_special_agriculture_right_follow_desc:0 "Producer cooperatives will connect smaller farms, local markets and processing workshops. Their independence improves the use of local knowledge while making the agricultural economy less easy to direct from a single office. Shared equipment and coordinated work will reduce labour requirements in both agricultural districts and subsistence farming. Historical precedent: Kazakh grain, Uzbek cotton, and Moldovan grapes and fruit illustrate the Union's regional crop specializations."
 COLDWAR_SSR_special_agriculture_office:0 "Food Supply Contracts"
 COLDWAR_SSR_special_agriculture_office_desc:0 "Long supply contracts will connect republican producers with reliable customers across the Union. They promise a steadier market, at the price of keeping production tied to common payment and delivery arrangements. Historical precedent: Kazakh grain, Uzbek cotton, and Moldovan grapes and fruit illustrate the Union's regional crop specializations."
 COLDWAR_SSR_special_agriculture_priority:0 "Priority Allocations"
 COLDWAR_SSR_special_agriculture_priority_desc:0 "Priority allocations will protect the specialised programme when materials and technical staff are scarce. Other enterprises and public institutions will have to accept a smaller share of the republic's attention and investment. Historical precedent: Kazakh grain, Uzbek cotton, and Moldovan grapes and fruit illustrate the Union's regional crop specializations."
 COLDWAR_SSR_special_agriculture_efficiency:0 "Lean Administration"
 COLDWAR_SSR_special_agriculture_efficiency_desc:0 "A smaller coordinating service will give workshops and professional institutions more room to solve their own problems. Lower administrative costs come at the price of less direct political control over the specialised programme. Historical precedent: Kazakh grain, Uzbek cotton, and Moldovan grapes and fruit illustrate the Union's regional crop specializations."
 COLDWAR_SSR_special_agriculture_settlement:0 "Union Production Role"
 COLDWAR_SSR_special_agriculture_settlement_desc:0 "The republic has secured a distinctive role in the Union economy. Its specialised institutions now possess skills and capacity that would be difficult to assemble in isolation, together with a lasting dependence on the customers, suppliers and common standards that made their growth possible. Historical precedent: Kazakh grain, Uzbek cotton, and Moldovan grapes and fruit illustrate the Union's regional crop specializations."
 COLDWAR_SSR_name_union_civilian_industry_programme:0 "Union Civilian Industry Programme"
 COLDWAR_SSR_name_independent_industrial_complex:0 "Independent Industrial Complex"
 COLDWAR_SSR_special_industry_mandate:0 "Civilian Industry"
 COLDWAR_SSR_special_industry_mandate_desc:0 "Tractors, machinery, electrical goods and consumer products give a republic a place in everyday economic life across the Union. A civilian industrial programme can broaden skilled employment and commercial capacity, while requiring dependable energy and a large market for its output. Historical precedent: Minsk's tractor works and Chisinau's T-50B vineyard-tractor plant show civilian machinery production serving different farm economies."
 COLDWAR_SSR_special_industry_works:0 "Civilian Combine"
 COLDWAR_SSR_special_industry_works_desc:0 "A modern civilian combine will gather workshops, maintenance and technical services around a common industrial site. Its value will depend on products that customers can use rather than the prestige of the new buildings. Historical precedent: Minsk's tractor works and Chisinau's T-50B vineyard-tractor plant show civilian machinery production serving different farm economies."
 COLDWAR_SSR_special_industry_schools:0 "Industrial Engineering"
 COLDWAR_SSR_special_industry_schools_desc:0 "Industrial engineers will study production methods, machine tools and the organisation of large workshops. Better technical practice can raise productivity without requiring every enterprise to begin again with entirely new machinery. Historical precedent: Minsk's tractor works and Chisinau's T-50B vineyard-tractor plant show civilian machinery production serving different farm economies."
 COLDWAR_SSR_special_industry_left:0 "Capital Goods"
 COLDWAR_SSR_special_industry_left_desc:0 "Investment will favour machinery and the means of constructing further industry. This approach promises a larger future capacity, although households must wait longer for the goods that make development visible in daily life. Historical precedent: Minsk's tractor works and Chisinau's T-50B vineyard-tractor plant show civilian machinery production serving different farm economies."
 COLDWAR_SSR_special_industry_left_follow:0 "Machine Suppliers"
 COLDWAR_SSR_special_industry_left_follow_desc:0 "Specialised suppliers will support larger industrial projects with tools, components and maintenance. Their growth gives the republic a wider engineering base, accompanied by a greater demand for skilled workers and power. Historical precedent: Minsk's tractor works and Chisinau's T-50B vineyard-tractor plant show civilian machinery production serving different farm economies."
 COLDWAR_SSR_special_industry_right:0 "Consumer Industry"
 COLDWAR_SSR_special_industry_right_desc:0 "Household goods and civilian orders will take priority over another expansion of capital equipment. Better supply can release resources for wider economic use, while margins and public revenues remain under pressure. Historical precedent: Minsk's tractor works and Chisinau's T-50B vineyard-tractor plant show civilian machinery production serving different farm economies."
 COLDWAR_SSR_special_industry_right_follow:0 "Trade Distribution"
 COLDWAR_SSR_special_industry_right_follow_desc:0 "A dependable commercial network will bring manufactured goods to customers beyond the factory gates. It improves the value of civilian production while adding a public responsibility for standards, transport and honest accounts. Historical precedent: Minsk's tractor works and Chisinau's T-50B vineyard-tractor plant show civilian machinery production serving different farm economies."
 COLDWAR_SSR_special_industry_office:0 "Republican Order Book"
 COLDWAR_SSR_special_industry_office_desc:0 "A coherent civilian order book will connect workshops with the wider Union market. The republic will gain from dependable demand, while its prosperity becomes more sensitive to the continuity of those commercial relationships. Historical precedent: Minsk's tractor works and Chisinau's T-50B vineyard-tractor plant show civilian machinery production serving different farm economies."
 COLDWAR_SSR_special_industry_priority:0 "Priority Allocations"
 COLDWAR_SSR_special_industry_priority_desc:0 "Priority allocations will protect the specialised programme when materials and technical staff are scarce. Other enterprises and public institutions will have to accept a smaller share of the republic's attention and investment. Historical precedent: Minsk's tractor works and Chisinau's T-50B vineyard-tractor plant show civilian machinery production serving different farm economies."
 COLDWAR_SSR_special_industry_efficiency:0 "Lean Administration"
 COLDWAR_SSR_special_industry_efficiency_desc:0 "A smaller coordinating service will give workshops and professional institutions more room to solve their own problems. Lower administrative costs come at the price of less direct political control over the specialised programme. Historical precedent: Minsk's tractor works and Chisinau's T-50B vineyard-tractor plant show civilian machinery production serving different farm economies."
 COLDWAR_SSR_special_industry_settlement:0 "Union Production Role"
 COLDWAR_SSR_special_industry_settlement_desc:0 "The republic has secured a distinctive role in the Union economy. Its specialised institutions now possess skills and capacity that would be difficult to assemble in isolation, together with a lasting dependence on the customers, suppliers and common standards that made their growth possible. Historical precedent: Minsk's tractor works and Chisinau's T-50B vineyard-tractor plant show civilian machinery production serving different farm economies."
 COLDWAR_SSR_name_union_resource_programme:0 "Union Resource Programme"
 COLDWAR_SSR_stat_local_resources_oil_factor_tt:0 "Fossil fuel extraction: $RIGHT|+=%2$"
 COLDWAR_SSR_stat_local_resources_aluminium_factor_tt:0 "Light metal extraction: $RIGHT|+=%2$"
 COLDWAR_SSR_stat_local_resources_tungsten_factor_tt:0 "Technology metal extraction: $RIGHT|+=%2$"
 COLDWAR_SSR_stat_local_resources_steel_factor_tt:0 "Steel extraction: $RIGHT|+=%2$"
 COLDWAR_SSR_stat_local_resources_chromium_factor_tt:0 "Precious metal extraction: $RIGHT|+=%2$"
 COLDWAR_SSR_name_independent_resource_complex:0 "Independent Resource Complex"
 COLDWAR_SSR_special_resources_mandate:0 "Resource Processing"
 COLDWAR_SSR_special_resources_mandate_desc:0 "The republic's mineral and energy resources can support much more than the shipment of raw material. Surveying, processing and transport investment will strengthen its place in Union supply, while confronting the energy and environmental costs of a resource-led economy. Historical precedent: Azerbaijan's Baku oil, Turkmenistan's gas fields, and Kazakhstan's coal and metal deposits anchored distinct resource sectors."
 COLDWAR_SSR_special_resources_works:0 "Industrial Corridors"
 COLDWAR_SSR_special_resources_works_desc:0 "Resource production needs roads, freight facilities and dependable power before another deposit becomes useful to industry. A stronger transport corridor will serve existing works and open room for the processing economy around them. Historical precedent: Azerbaijan's Baku oil, Turkmenistan's gas fields, and Kazakhstan's coal and metal deposits anchored distinct resource sectors."
 COLDWAR_SSR_special_resources_schools:0 "Geological Service"
 COLDWAR_SSR_special_resources_schools_desc:0 "A professional geological and industrial service will improve knowledge of existing resources and the requirements of their development. Better information must be followed by investment before a surveyed deposit can contribute to production. Historical precedent: Azerbaijan's Baku oil, Turkmenistan's gas fields, and Kazakhstan's coal and metal deposits anchored distinct resource sectors."
 COLDWAR_SSR_special_resources_left:0 "Extraction Priority"
 COLDWAR_SSR_special_resources_left_desc:0 "Investment will favour greater output from resources that the republic can already exploit. Higher extraction will strengthen the Union's supply, while exposing land, water and the power system to a heavier industrial burden. Historical precedent: Azerbaijan's Baku oil, Turkmenistan's gas fields, and Kazakhstan's coal and metal deposits anchored distinct resource sectors."
 COLDWAR_SSR_special_resources_left_follow:0 "Mining Machinery"
 COLDWAR_SSR_special_resources_left_follow_desc:0 "Dependable machinery and maintenance will make existing extraction less vulnerable to breakdowns. The additional output remains useful only if freight, processing and customers can keep pace. Historical precedent: Azerbaijan's Baku oil, Turkmenistan's gas fields, and Kazakhstan's coal and metal deposits anchored distinct resource sectors."
 COLDWAR_SSR_stat_energy_gain_multiplier_tt:0 "Energy generation: $RIGHT|+=%2$"
 COLDWAR_SSR_special_resources_right:0 "Processing Priority"
 COLDWAR_SSR_special_resources_right_desc:0 "Processing and industrial services will capture more value from domestic and imported materials. This wider industrial role is less dependent on the size of local deposits, but requires substantial power and technical capacity. Historical precedent: Azerbaijan's Baku oil, Turkmenistan's gas fields, and Kazakhstan's coal and metal deposits anchored distinct resource sectors."
 COLDWAR_SSR_special_resources_right_follow:0 "Materials Laboratories"
 COLDWAR_SSR_special_resources_right_follow_desc:0 "Testing laboratories will help processors meet the standards demanded by engineering customers. Their expertise can strengthen a wider manufacturing economy, while adding another permanent technical institution to public expenditure. Historical precedent: Azerbaijan's Baku oil, Turkmenistan's gas fields, and Kazakhstan's coal and metal deposits anchored distinct resource sectors."
 COLDWAR_SSR_special_resources_office:0 "Resource Supply Office"
 COLDWAR_SSR_special_resources_office_desc:0 "A dedicated supply office will coordinate transport, processing and industrial customers. Its task is to keep the value of resource development from disappearing in bottlenecks between the mine and the final purchaser. Historical precedent: Azerbaijan's Baku oil, Turkmenistan's gas fields, and Kazakhstan's coal and metal deposits anchored distinct resource sectors."
 COLDWAR_SSR_special_resources_priority:0 "Priority Allocations"
 COLDWAR_SSR_special_resources_priority_desc:0 "Priority allocations will protect the specialised programme when materials and technical staff are scarce. Other enterprises and public institutions will have to accept a smaller share of the republic's attention and investment. Historical precedent: Azerbaijan's Baku oil, Turkmenistan's gas fields, and Kazakhstan's coal and metal deposits anchored distinct resource sectors."
 COLDWAR_SSR_special_resources_efficiency:0 "Lean Administration"
 COLDWAR_SSR_special_resources_efficiency_desc:0 "A smaller coordinating service will give workshops and professional institutions more room to solve their own problems. Lower administrative costs come at the price of less direct political control over the specialised programme. Historical precedent: Azerbaijan's Baku oil, Turkmenistan's gas fields, and Kazakhstan's coal and metal deposits anchored distinct resource sectors."
 COLDWAR_SSR_special_resources_settlement:0 "Union Production Role"
 COLDWAR_SSR_special_resources_settlement_desc:0 "The republic has secured a distinctive role in the Union economy. Its specialised institutions now possess skills and capacity that would be difficult to assemble in isolation, together with a lasting dependence on the customers, suppliers and common standards that made their growth possible. Historical precedent: Azerbaijan's Baku oil, Turkmenistan's gas fields, and Kazakhstan's coal and metal deposits anchored distinct resource sectors."
 COLDWAR_SSR_name_union_electronics_programme:0 "Union Electronics Programme"
 COLDWAR_SSR_equipment_cnc_equipment_type_tt:0 "§Y$cnc_equipment_type$§!"
 COLDWAR_SSR_name_independent_electronics_complex:0 "Independent Electronics Complex"
 COLDWAR_SSR_special_electronics_mandate:0 "Electronics Research"
 COLDWAR_SSR_special_electronics_mandate_desc:0 "Communications, computing and precision electronics connect scientific institutions with civilian industry and defence. Common radio and component orders will lower the production cost of command-and-control equipment, while the programme relies on a wide network of suppliers, testing facilities and research contracts. Historical precedent: Armenia's Yerevan Nairi computers, Lithuania's Rūta machines, and Latvia's VEF communications equipment exemplify Soviet republican electronics."
 COLDWAR_SSR_special_electronics_works:0 "Electronic Workshops"
 COLDWAR_SSR_special_electronics_works_desc:0 "Precision assembly and engineering workshops will give scientific institutes a dependable industrial partner. The new facilities must develop practical production skills rather than relying on a succession of promising prototypes. Historical precedent: Armenia's Yerevan Nairi computers, Lithuania's Rūta machines, and Latvia's VEF communications equipment exemplify Soviet republican electronics."
 COLDWAR_SSR_special_electronics_schools:0 "Computing Institutes"
 COLDWAR_SSR_special_electronics_schools_desc:0 "Computing and communications institutes will train engineers able to connect theory with the needs of factories and public institutions. Their work will depend on access to components, common standards and sustained research funding. Historical precedent: Armenia's Yerevan Nairi computers, Lithuania's Rūta machines, and Latvia's VEF communications equipment exemplify Soviet republican electronics."
 COLDWAR_SSR_special_electronics_left:0 "Defence Electronics"
 COLDWAR_SSR_special_electronics_left_desc:0 "Research will concentrate on military communications and command systems. Dedicated radio production and testing will lower the cost and improve the reliability of command-and-control equipment. Scientific prestige and a secure customer come with dependence on official procurement. Historical precedent: Armenia's Yerevan Nairi computers, Lithuania's Rūta machines, and Latvia's VEF communications equipment exemplify Soviet republican electronics."
 COLDWAR_SSR_special_electronics_left_follow:0 "Testing Laboratories"
 COLDWAR_SSR_special_electronics_left_follow_desc:0 "Permanent testing facilities will connect military customers, researchers and manufacturers. Their common standards can reduce failures and improve technical reliability, at the price of a more expensive scientific establishment. Historical precedent: Armenia's Yerevan Nairi computers, Lithuania's Rūta machines, and Latvia's VEF communications equipment exemplify Soviet republican electronics."
 COLDWAR_SSR_special_electronics_right:0 "Civilian Electronics"
 COLDWAR_SSR_special_electronics_right_desc:0 "Communications equipment and practical computing will take priority over specialised military work. A broader civilian market can strengthen commercial productivity, although competitive prices and rapid product changes will challenge established workshops. Historical precedent: Armenia's Yerevan Nairi computers, Lithuania's Rūta machines, and Latvia's VEF communications equipment exemplify Soviet republican electronics."
 COLDWAR_SSR_special_electronics_right_follow:0 "Technical Applications"
 COLDWAR_SSR_special_electronics_right_follow_desc:0 "Engineers will bring communications and computing into enterprise administration and production. The gains will depend on practical instruction and maintenance rather than the announcement of another experimental machine. Historical precedent: Armenia's Yerevan Nairi computers, Lithuania's Rūta machines, and Latvia's VEF communications equipment exemplify Soviet republican electronics."
 COLDWAR_SSR_special_electronics_office:0 "Research Contracts"
 COLDWAR_SSR_special_electronics_office_desc:0 "Long research contracts will give institutes and manufacturers time to turn specialised knowledge into dependable products. The same contracts will make them vulnerable if Union priorities, common standards or guaranteed customers disappear. Historical precedent: Armenia's Yerevan Nairi computers, Lithuania's Rūta machines, and Latvia's VEF communications equipment exemplify Soviet republican electronics."
 COLDWAR_SSR_special_electronics_priority:0 "Priority Allocations"
 COLDWAR_SSR_special_electronics_priority_desc:0 "Priority allocations will protect the specialised programme when materials and technical staff are scarce. Other enterprises and public institutions will have to accept a smaller share of the republic's attention and investment. Historical precedent: Armenia's Yerevan Nairi computers, Lithuania's Rūta machines, and Latvia's VEF communications equipment exemplify Soviet republican electronics."
 COLDWAR_SSR_special_electronics_efficiency:0 "Lean Administration"
 COLDWAR_SSR_special_electronics_efficiency_desc:0 "A smaller coordinating service will give workshops and professional institutions more room to solve their own problems. Lower administrative costs come at the price of less direct political control over the specialised programme. Historical precedent: Armenia's Yerevan Nairi computers, Lithuania's Rūta machines, and Latvia's VEF communications equipment exemplify Soviet republican electronics."
 COLDWAR_SSR_special_electronics_settlement:0 "Union Production Role"
 COLDWAR_SSR_special_electronics_settlement_desc:0 "The republic has secured a distinctive role in the Union economy. Its specialised institutions now possess skills and capacity that would be difficult to assemble in isolation, together with a lasting dependence on the customers, suppliers and common standards that made their growth possible. Historical precedent: Armenia's Yerevan Nairi computers, Lithuania's Rūta machines, and Latvia's VEF communications equipment exemplify Soviet republican electronics."
 COLDWAR_SSR_BLR_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_BLR_regional_review_desc:0 "The economy of Byelorussian SSR has grown around machine building, chemicals and integrated union markets. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_BLR_regional_orders:0 "Machine Building"
 COLDWAR_SSR_BLR_regional_orders_desc:0 "Machine-Building Complex draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_BLR_regional_diversify:0 "Food and Light Industry"
 COLDWAR_SSR_BLR_regional_diversify_desc:0 "Food and Light Industry will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
 COLDWAR_SSR_BLR_regional_standards_replace_tt:0 "Replace §YDependence on Union Orders§! with §YManaged Dependence on Union Orders§!"
 COLDWAR_SSR_BLR_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_BLR_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_name_communist_party_of_byelorussia_programme:0 "Communist Party of Byelorussia Programme"
 COLDWAR_SSR_BLR_p4_root:0 "The Belarusian Republic"
 COLDWAR_SSR_BLR_p4_root_desc:0 "The Communist Party of Byelorussia rules a republic whose industry and transport are woven into the Union economy. Independence would leave capable machine plants and a modern urban workforce, but their contracts and markets would have to be rebuilt without severing eastern supply links."
 COLDWAR_SSR_BLR_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_BLR_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_BLR_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_BLR_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_BLR_p4_institution:0 "Machine Tool Orders"
 COLDWAR_SSR_BLR_p4_institution_desc:0 "Minsk and other industrial centres build machine tools and equipment for factories across the republic. Reliable orders preserve skilled employment, but concentration in a few large plants leaves household goods and smaller suppliers behind."
 COLDWAR_SSR_BLR_p4_public:0 "State Investment"
 COLDWAR_SSR_BLR_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_BLR_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_BLR_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
 COLDWAR_SSR_BLR_p4_production:0 "Strategic Workshops"
 COLDWAR_SSR_BLR_p4_production_desc:0 "A strategic workshop programme will give public armaments enterprises the facilities needed to honour national orders. Its maintenance and power needs will remain a public obligation even when demand becomes less favourable."
 COLDWAR_SSR_BLR_p4_consumer:0 "Cooperative Supply"
 COLDWAR_SSR_BLR_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_BLR_p4_development:0 "Food and Housing"
 COLDWAR_SSR_BLR_p4_development_desc:0 "Public investment shifts toward food processing, housing repairs, and consumer workshops. Household supply improves, while new industrial construction slows as machine plants compete for the same capital."
 COLDWAR_SSR_BLR_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_BLR_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
 COLDWAR_SSR_BLR_p4_targeted:0 "Targeted Provision"
 COLDWAR_SSR_BLR_p4_targeted_desc:0 "Support will be concentrated on households and services most exposed to hardship. A narrower commitment can improve public finances, while requiring a larger administrative effort and accepting less universal protection."
 COLDWAR_SSR_BLR_p4_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_BLR_p4_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_BLR_p4_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_BLR_p4_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_BLR_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_BLR_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_rada_of_the_belarusian_democratic_republic_programme:0 "Rada of the Belarusian Democratic Republic Programme"
 COLDWAR_SSR_BLR_p1_root:0 "The BNR Council"
 COLDWAR_SSR_BLR_p1_root_desc:0 "The Rada of the Belarusian Democratic Republic has preserved a claim to statehood in exile since 1918. Its return would bring legal continuity without a domestic administration, forcing the council to earn trust through a broad coalition and a careful transition from Soviet institutions."
 COLDWAR_SSR_BLR_p1_civic:0 "Rada of the Republic"
 COLDWAR_SSR_BLR_p1_civic_desc:0 "The BNR Rada invites elected local representatives to join an exile government whose legal claim survived abroad. Broad participation can reconnect constitutional continuity to people at home, but compromises dilute the authority once exercised by the Rada's leaders."
 COLDWAR_SSR_BLR_p1_executive:0 "Continuity Cabinet"
 COLDWAR_SSR_BLR_p1_executive_desc:0 "A continuity cabinet draws on the Rada's diplomatic and legal institutions to restore state administration. Experienced exile officials can act quickly, but their distance from Soviet-era residents makes public trust difficult to win."
 COLDWAR_SSR_BLR_p1_institution:0 "Civic Language Fund"
 COLDWAR_SSR_BLR_p1_institution_desc:0 "Schools, publishing houses, and teacher colleges receive support to make Belarusian a language of public life. The work restores cultural confidence, though multilingual services and scarce teachers make the transition costly and gradual."
 COLDWAR_SSR_BLR_p1_archives:0 "Open Party Archives"
 COLDWAR_SSR_BLR_p1_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_BLR_p1_public:0 "Village Land Trusts"
 COLDWAR_SSR_BLR_p1_public_desc:0 "Land trusts lease and finance farms while protecting smallholders from immediate sale to distant owners. Rural credit returns and food processing expands, but slow claims review postpones the large capital projects sought by returning investors."
 COLDWAR_SSR_BLR_p1_market:0 "Diaspora Machine Fund"
 COLDWAR_SSR_BLR_p1_market_desc:0 "Belarusian communities abroad finance machine shops, rail repairs, and technical schools through a parliamentary fund. Capital and expertise arrive quickly, while overseas donors seek influence over contracts set in Minsk."
 COLDWAR_SSR_BLR_p1_production:0 "Rural Credit Offices"
 COLDWAR_SSR_BLR_p1_production_desc:0 "Local offices lend for seed, storage, and farm machinery under public oversight. Producers gain a route to modernize without surrendering land, though repayment depends on reliable harvests and transport."
 COLDWAR_SSR_BLR_p1_consumer:0 "Belarusian Press"
 COLDWAR_SSR_BLR_p1_consumer_desc:0 "Publishers and schools restore Belarusian-language books, technical journals, and civic education. Public culture gains reach, while print capacity and skilled editors remain scarce outside the largest cities."
 COLDWAR_SSR_BLR_p1_development:0 "Rural Credit League"
 COLDWAR_SSR_BLR_p1_development_desc:0 "Regional banks lend to farms and food processors under rules written by local councils. Producers gain access to markets without a rapid transfer of land, but dispersed lending cannot fund industrial reconstruction at machine-plant scale."
 COLDWAR_SSR_BLR_p1_universal:0 "Low Business Levies"
 COLDWAR_SSR_BLR_p1_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_BLR_p1_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_BLR_p1_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_BLR_p1_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_BLR_p1_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_BLR_p1_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_BLR_p1_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_BLR_p1_settlement:0 "A Free Republic"
 COLDWAR_SSR_BLR_p1_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_the_hrodna_circle_programme:0 "The Hrodna Circle Programme"
 COLDWAR_SSR_BLR_p2_root:0 "The Hrodna Civic Circle"
 COLDWAR_SSR_BLR_p2_root_desc:0 "The Hrodna Circle represents a counterfactual coalition of teachers, librarians, and local cultural societies rather than a historical party. Its authority comes from municipal life and Belarusian civic memory, so it must protect different languages while building institutions beyond the western districts."
 COLDWAR_SSR_BLR_p2_civic:0 "Municipal Charter"
 COLDWAR_SSR_BLR_p2_civic_desc:0 "The Hrodna Circle builds a civic coalition through elected councils, bilingual public services, and local cultural associations. Municipal knowledge can rebuild trust, but regional councils slow decisions that require common standards for the whole republic."
 COLDWAR_SSR_BLR_p2_executive:0 "Civic Secretariat"
 COLDWAR_SSR_BLR_p2_executive_desc:0 "Teachers, editors, and local administrators coordinate a professional secretariat for the new state. It can make services reliable without a party machine, but a narrow civic leadership risks ignoring workers outside Hrodna's cultural networks."
 COLDWAR_SSR_BLR_p2_institution:0 "Municipal Enterprise"
 COLDWAR_SSR_BLR_p2_institution_desc:0 "City councils issue open contracts for workshops, repair services, and local transport. Municipal employers create jobs responsive to residents, while small administrations must learn procurement and accounting quickly."
 COLDWAR_SSR_BLR_p2_public:0 "Municipal Workshops"
 COLDWAR_SSR_BLR_p2_public_desc:0 "City councils charter repair firms, furniture makers, and food processors under open procurement rules. Local employment and consumer supply improve, while municipal credit cannot fund the large machine plants that anchor the national economy."
 COLDWAR_SSR_BLR_p2_market:0 "Cross-Border Traders"
 COLDWAR_SSR_BLR_p2_market_desc:0 "Private traders and cooperatives reconnect Hrodna's markets with Poland and Lithuania under published customs rules. Goods and income return quickly, though import competition can displace local workshops without careful credit policy."
 COLDWAR_SSR_BLR_p2_production:0 "Repair Guilds"
 COLDWAR_SSR_BLR_p2_production_desc:0 "Small repair guilds train apprentices and maintain farm equipment, transport, and household machinery. Their work reaches towns quickly, but a fragmented network requires strong inspection to keep standards consistent."
 COLDWAR_SSR_BLR_p2_consumer:0 "Bilingual Schools"
 COLDWAR_SSR_BLR_p2_consumer_desc:0 "Municipal schools train teachers and provide books in Belarusian and Russian. Families gain equal civic access, while staffing and translation raise recurring costs for local governments."
 COLDWAR_SSR_BLR_p2_development:0 "Bilingual Schools"
 COLDWAR_SSR_BLR_p2_development_desc:0 "Parents and teachers shape schools that teach Belarusian and Russian without forcing families to abandon either language. Local participation strengthens trust, though curricula and teacher recruitment vary between cities and rural districts."
 COLDWAR_SSR_BLR_p2_universal:0 "Low Business Levies"
 COLDWAR_SSR_BLR_p2_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_BLR_p2_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_BLR_p2_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_BLR_p2_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_BLR_p2_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_BLR_p2_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_BLR_p2_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_BLR_p2_settlement:0 "A Free Republic"
 COLDWAR_SSR_BLR_p2_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_the_minsk_spring_programme:0 "The Minsk Spring Programme"
 COLDWAR_SSR_BLR_p3_root:0 "Minsk Literary Circle"
 COLDWAR_SSR_BLR_p3_root_desc:0 "Writers, editors, and teachers give the Minsk Spring its counterfactual political base. Their republic values cultural renewal, social protection, and public accountability, but it must translate literary authority into an economic policy that can sustain factories and ordinary households."
 COLDWAR_SSR_BLR_p3_civic:0 "Editorial Assembly"
 COLDWAR_SSR_BLR_p3_civic_desc:0 "Writers, teachers, and professional associations create a public assembly to review the cabinet and its cultural policy. Open debate gives reform socialism a broader base, but decisions take longer when workers and rural representatives contest priorities."
 COLDWAR_SSR_BLR_p3_executive:0 "Reform Secretariat"
 COLDWAR_SSR_BLR_p3_executive_desc:0 "A reform secretariat joins engineers, editors, and managers to keep enterprises operating during political change. It can preserve expertise, but central coordination gives fewer opportunities for local communities to shape investment."
 COLDWAR_SSR_BLR_p3_institution:0 "Clear Enterprise Books"
 COLDWAR_SSR_BLR_p3_institution_desc:0 "Factories publish their debts, deliveries, and public-service obligations before new contracts are negotiated. Clear accounts expose waste and help viable workshops find customers, while unprofitable plants must face a painful restructuring."
 COLDWAR_SSR_BLR_p3_public:0 "Enterprise Board"
 COLDWAR_SSR_BLR_p3_public_desc:0 "Workers and technical managers share authority over investment, safety, and production targets in public factories. Practical knowledge improves decisions, while divided control can delay major restructuring and new capital projects."
 COLDWAR_SSR_BLR_p3_market:0 "Workshop Licences"
 COLDWAR_SSR_BLR_p3_market_desc:0 "Small firms receive licences and credit to make household goods, farm parts, and repair services. Consumer supply improves sooner, while unregulated growth can pull skilled staff from the larger plants."
 COLDWAR_SSR_BLR_p3_production:0 "Factory Account Books"
 COLDWAR_SSR_BLR_p3_production_desc:0 "Enterprises publish debts, deliveries, and public-service obligations before new contracts are signed. Honest accounts expose waste and protect viable plants, but weak firms can no longer hide behind plan targets."
 COLDWAR_SSR_BLR_p3_consumer:0 "Regional Food Stores"
 COLDWAR_SSR_BLR_p3_consumer_desc:0 "Local storage and food processors reduce spoilage and keep supplies in regional towns. Households benefit from dependable goods, though investment shifts away from export-oriented machine production."
 COLDWAR_SSR_BLR_p3_development:0 "Public Library Network"
 COLDWAR_SSR_BLR_p3_development_desc:0 "Libraries, schools, and regional publishers keep Belarusian literature available beyond Minsk. The network preserves a shared public culture, but staffing and print costs compete with urgent industrial investment."
 COLDWAR_SSR_BLR_p3_universal:0 "Progressive Revenue"
 COLDWAR_SSR_BLR_p3_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_BLR_p3_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_BLR_p3_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_BLR_p3_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_BLR_p3_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_BLR_p3_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_BLR_p3_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_BLR_p3_settlement:0 "A Social Republic"
 COLDWAR_SSR_BLR_p3_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_MLV_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_MLV_regional_review_desc:0 "The economy of Moldavian SSR has grown around food processing, agriculture and cross-dniester industry. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_MLV_regional_orders:0 "Food Processing"
 COLDWAR_SSR_MLV_regional_orders_desc:0 "Agricultural Processing draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_MLV_regional_diversify:0 "Mixed Industry"
 COLDWAR_SSR_MLV_regional_diversify_desc:0 "Mixed Republican Industry will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
 COLDWAR_SSR_MLV_regional_standards_replace_tt:0 "Replace §YUneven Processing Networks§! with §YManaged Uneven Processing Networks§!"
 COLDWAR_SSR_MLV_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_MLV_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_name_communist_party_of_moldavia_programme:0 "Communist Party of Moldavia Programme"
 COLDWAR_SSR_MLV_p4_root:0 "A Workers' State"
 COLDWAR_SSR_MLV_p4_root_desc:0 "The Communist Party of Moldavia governs a predominantly agricultural republic with food processing and industrial links across the Dniester. Independence would make language, trade, and regional representation immediate questions, while vineyards and factories still depend on external buyers."
 COLDWAR_SSR_MLV_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_MLV_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_MLV_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_MLV_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_MLV_p4_institution:0 "Wine and Canning Trust"
 COLDWAR_SSR_MLV_p4_institution_desc:0 "State wineries and canneries coordinate quality, storage, and access to external markets. Processing raises the value of the harvest, but a larger export crop can leave local consumers exposed to price shifts and transport disruptions."
 COLDWAR_SSR_MLV_p4_public:0 "State Investment"
 COLDWAR_SSR_MLV_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_MLV_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_MLV_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
 COLDWAR_SSR_MLV_p4_production:0 "Strategic Workshops"
 COLDWAR_SSR_MLV_p4_production_desc:0 "A strategic workshop programme will give public armaments enterprises the facilities needed to honour national orders. Its maintenance and power needs will remain a public obligation even when demand becomes less favourable."
 COLDWAR_SSR_MLV_p4_consumer:0 "Cooperative Supply"
 COLDWAR_SSR_MLV_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_MLV_p4_development:0 "Mixed Dniester Works"
 COLDWAR_SSR_MLV_p4_development_desc:0 "Factories on both banks retain trade in machinery, electricity, and components under republican contracts. Continued production supports skilled employment, but the government must negotiate with communities whose language and political loyalties differ."
 COLDWAR_SSR_MLV_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_MLV_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
 COLDWAR_SSR_MLV_p4_targeted:0 "Targeted Provision"
 COLDWAR_SSR_MLV_p4_targeted_desc:0 "Support will be concentrated on households and services most exposed to hardship. A narrower commitment can improve public finances, while requiring a larger administrative effort and accepting less universal protection."
 COLDWAR_SSR_MLV_p4_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_MLV_p4_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_MLV_p4_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_MLV_p4_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_MLV_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_MLV_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_national_peasants_party_programme:0 "National Peasants' Party Programme"
 COLDWAR_SSR_MLV_p1_root:0 "The Peasant Republic"
 COLDWAR_SSR_MLV_p1_root_desc:0 "The National Peasants' Party invokes interwar agrarian politics and a rural electorate rather than the Soviet collective farm system. Its counterfactual return must settle land, credit, and language rights without letting restitution dispossess families who have cultivated the same fields for decades."
 COLDWAR_SSR_MLV_p1_civic:0 "Village Land Assembly"
 COLDWAR_SSR_MLV_p1_civic_desc:0 "The Peasant Party lets farm communities and municipal representatives negotiate land claims before titles are issued. A public hearing can avoid dispossessing current cultivators, but contested estates make restitution slow and politically costly."
 COLDWAR_SSR_MLV_p1_executive:0 "Agrarian Cabinet"
 COLDWAR_SSR_MLV_p1_executive_desc:0 "An agrarian cabinet settles land, rural credit, and food prices through experienced administrators. It can protect harvests quickly, but rural leadership may neglect industrial workers and towns dependent on state factories."
 COLDWAR_SSR_MLV_p1_institution:0 "Family Farm Credit"
 COLDWAR_SSR_MLV_p1_institution_desc:0 "Long-term loans finance seed, tractors, storage, and small processing plants for family farms. Rural output can improve without selling land to outside interests, but repayment will be difficult after years of state-set prices."
 COLDWAR_SSR_MLV_p1_archives:0 "Open Party Archives"
 COLDWAR_SSR_MLV_p1_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_MLV_p1_public:0 "Family Farm Titles"
 COLDWAR_SSR_MLV_p1_public_desc:0 "Secure titles and compensation rules encourage family farms to invest in orchards, vineyards, and livestock. Production can adapt to local markets, but concentrated land and unpaid claims threaten rural stability."
 COLDWAR_SSR_MLV_p1_market:0 "Cooperative Canneries"
 COLDWAR_SSR_MLV_p1_market_desc:0 "Farmers retain land while joining cooperative canneries, dairies, and wine presses. Shared processing keeps more value near villages, though cooperative borrowing makes large export expansion slower."
 COLDWAR_SSR_MLV_p1_production:0 "Rural Credit Bank"
 COLDWAR_SSR_MLV_p1_production_desc:0 "A rural bank lends for machinery and seed after resolving the most urgent tenancy claims. Small farms gain productive equipment, while the public fund bears losses when weather or prices spoil repayment."
 COLDWAR_SSR_MLV_p1_consumer:0 "Village Food Markets"
 COLDWAR_SSR_MLV_p1_consumer_desc:0 "Open markets connect growers to towns and encourage local mills, dairies, and food shops. Consumer choice grows, while price swings replace the security of guaranteed state deliveries."
 COLDWAR_SSR_MLV_p1_development:0 "Village Food Markets"
 COLDWAR_SSR_MLV_p1_development_desc:0 "Open produce markets reconnect growers with nearby towns and encourage local dairies, mills, and canneries. Consumers see more choice, while price swings and uneven inspection complicate the old system of guaranteed deliveries."
 COLDWAR_SSR_MLV_p1_universal:0 "Land and Business Tax"
 COLDWAR_SSR_MLV_p1_universal_desc:0 "Property and commercial income will support the institutions that protect national life. More dependable revenue strengthens government, while farmers and local businesses resist a burden they believe distant industrial interests can more easily evade."
 COLDWAR_SSR_MLV_p1_targeted:0 "Smallholder Relief"
 COLDWAR_SSR_MLV_p1_targeted_desc:0 "Smaller farms and family firms will receive relief while the new economy settles. More resources remain in local production, but the treasury must meet public obligations from a narrower immediate base."
 COLDWAR_SSR_MLV_p1_settlement:0 "A Settled Republic"
 COLDWAR_SSR_MLV_p1_settlement_desc:0 "The republic will rest on institutions that families, producers and local communities can recognise as their own. National authority must preserve that confidence while finding the revenue and commercial capacity needed to sustain an independent state."
 COLDWAR_SSR_name_writers_union_of_the_moldavian_ssr_programme:0 "Writers' Union of the Moldavian SSR Programme"
 COLDWAR_SSR_MLV_p2_root:0 "The Writers' Republic"
 COLDWAR_SSR_MLV_p2_root_desc:0 "The Writers' Union gave Moldavian intellectuals a rare institution for debates about language, literature, and cultural history. A counterfactual governing coalition must turn that influence into equal civic access for Romanian-speaking, Russian-speaking, Ukrainian, and Gagauz communities."
 COLDWAR_SSR_MLV_p2_civic:0 "Writers Assembly"
 COLDWAR_SSR_MLV_p2_civic_desc:0 "The Writers' Union convenes Romanian-speaking, Russian-speaking, Ukrainian, and Gagauz representatives to shape education and public language. Cultural autonomy can reduce fear of exclusion, but every school and office needs costly translation and trained staff."
 COLDWAR_SSR_MLV_p2_executive:0 "Cultural Ministry"
 COLDWAR_SSR_MLV_p2_executive_desc:0 "A professional cultural ministry protects publishing, museums, and education through common standards. It can act faster than dispersed local boards, while communities may distrust centralized choices about language and history."
 COLDWAR_SSR_MLV_p2_institution:0 "Language Institutes"
 COLDWAR_SSR_MLV_p2_institution_desc:0 "Teacher colleges prepare educators to teach the republic's languages and literature with professional standards. Cultural confidence grows across generations, while additional classrooms and textbooks compete with factory investment."
 COLDWAR_SSR_MLV_p2_public:0 "Cooperative Food Trust"
 COLDWAR_SSR_MLV_p2_public_desc:0 "Growers and processors share cold storage, bottling, and export contracts through a cooperative trust. Regional farms gain bargaining power and local jobs, while shared ownership slows decisions on new equipment."
 COLDWAR_SSR_MLV_p2_market:0 "Literary Service Firms"
 COLDWAR_SSR_MLV_p2_market_desc:0 "Independent presses, translation houses, and cultural services win contracts from schools and new private publishers. Skilled jobs diversify the economy, but public access depends on customers able to pay."
 COLDWAR_SSR_MLV_p2_production:0 "Farm Processing Lines"
 COLDWAR_SSR_MLV_p2_production_desc:0 "Cooperative bottling and canning lines give village producers a route from harvest to market. More value stays in the countryside, though seasonal crops leave the equipment underused for part of the year."
 COLDWAR_SSR_MLV_p2_consumer:0 "Multilingual Books"
 COLDWAR_SSR_MLV_p2_consumer_desc:0 "Teachers and editors produce schoolbooks that reflect the republic's languages and local histories. Students gain access and shared civic knowledge, while print runs raise public costs in a small market."
 COLDWAR_SSR_MLV_p2_development:0 "Cooperative Canneries"
 COLDWAR_SSR_MLV_p2_development_desc:0 "Growers and local processors share cold storage and bottling lines through regional cooperatives. More value stays near the farms, although cooperative decisions can be slower than a single state trust's production orders."
 COLDWAR_SSR_MLV_p2_universal:0 "Low Business Levies"
 COLDWAR_SSR_MLV_p2_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_MLV_p2_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_MLV_p2_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_MLV_p2_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_MLV_p2_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_MLV_p2_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_MLV_p2_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_MLV_p2_settlement:0 "A Free Republic"
 COLDWAR_SSR_MLV_p2_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_socialism_with_a_human_face_programme:0 "Socialism with a Human Face Programme"
 COLDWAR_SSR_MLV_p3_root:0 "A Humanist Socialism"
 COLDWAR_SSR_MLV_p3_root_desc:0 "The Prague Spring's reform language inspires a counterfactual Moldavian socialist coalition rather than a party formed at home. It seeks cultural freedom and worker influence while preserving public ownership, a path that must prove reform can improve daily supply instead of only changing slogans."
 COLDWAR_SSR_MLV_p3_civic:0 "Workers Congress"
 COLDWAR_SSR_MLV_p3_civic_desc:0 "Workers, cultural associations, and elected delegates debate the new socialist constitution. Public ownership remains legitimate only if citizens can challenge the party and influence services, which makes policy slower and more contested."
 COLDWAR_SSR_MLV_p3_executive:0 "Reform Cabinet"
 COLDWAR_SSR_MLV_p3_executive_desc:0 "A reform cabinet of engineers and managers grants enterprises more autonomy while retaining public ownership. It can improve output without immediate privatization, but workers have less influence when managers close or reorganize plants."
 COLDWAR_SSR_MLV_p3_institution:0 "Enterprise Councils"
 COLDWAR_SSR_MLV_p3_institution_desc:0 "Elected councils review production targets, safety, and investment proposals in state firms. Skilled workers gain a voice in reform, but negotiation over outdated equipment can delay output and enterprise conversion."
 COLDWAR_SSR_MLV_p3_public:0 "Public Food Combine"
 COLDWAR_SSR_MLV_p3_public_desc:0 "Public combines coordinate vineyards, canneries, and rural transport under accountable enterprise books. They can guarantee food supply and stable employment, but their costs remain a charge on the state when export orders falter."
 COLDWAR_SSR_MLV_p3_market:0 "Worker Market Co-ops"
 COLDWAR_SSR_MLV_p3_market_desc:0 "Worker cooperatives sell food, clothing, and repair services under clear market contracts. Flexible production responds to shortages, while unequal access to credit can leave rural members behind."
 COLDWAR_SSR_MLV_p3_production:0 "Enterprise Councils"
 COLDWAR_SSR_MLV_p3_production_desc:0 "Workers elect councils to review safety, investment, and public-service duties inside state firms. Participation can protect skilled teams, though negotiations slow conversion of plants with obsolete equipment."
 COLDWAR_SSR_MLV_p3_consumer:0 "Local Market Halls"
 COLDWAR_SSR_MLV_p3_consumer_desc:0 "Municipal market halls connect growers, artisans, and town consumers under published rules. Everyday goods circulate more freely, while price changes expose households with fixed wages to new uncertainty."
 COLDWAR_SSR_MLV_p3_development:0 "Consumer Food Plan"
 COLDWAR_SSR_MLV_p3_development_desc:0 "Public investment shifts toward household food processing, refrigeration, and reliable rural deliveries. Better supply strengthens the reform government, while less capital remains for heavy industrial expansion."
 COLDWAR_SSR_MLV_p3_universal:0 "Progressive Revenue"
 COLDWAR_SSR_MLV_p3_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_MLV_p3_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_MLV_p3_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_MLV_p3_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_MLV_p3_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_MLV_p3_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_MLV_p3_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_MLV_p3_settlement:0 "A Social Republic"
 COLDWAR_SSR_MLV_p3_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_name_national_patriotic_front_programme:0 "National Patriotic Front Programme"
 COLDWAR_SSR_MLV_p20_root:0 "The Patriotic Front"
 COLDWAR_SSR_MLV_p20_root_desc:0 "The National Patriotic Front was a clandestine Moldavian organization founded in 1969 and crushed by Soviet arrests in 1972. Its leaders sought independence and a Romanian national identity; an independent government must first secure lawful authority at home and avoid assuming consent for union with Romania."
 COLDWAR_SSR_MLV_p20_civic:0 "Patriotic Assembly"
 COLDWAR_SSR_MLV_p20_civic_desc:0 "The National Patriotic Front submits its programme to an elected constituent assembly and recognizes that independence requires broad Romanian-speaking and minority support. Open debate may delay national measures, but it prevents clandestine authority from becoming a new monopoly."
 COLDWAR_SSR_MLV_p20_executive:0 "National Directorate"
 COLDWAR_SSR_MLV_p20_executive_desc:0 "A national directorate coordinates the front's cadres, public offices, and language transition. Central authority can replace Soviet institutions quickly, but coercive appointments risk reviving the distrust built by clandestine rule."
 COLDWAR_SSR_MLV_p20_institution:0 "Latin Script Schools"
 COLDWAR_SSR_MLV_p20_institution_desc:0 "Schools, courts, and public offices adopt Latin-script Romanian as the language of republican administration. Education and legal access become more coherent for Romanian speakers, while transition costs and protections for other languages demand careful attention."
 COLDWAR_SSR_MLV_p20_archives:0 "Open Party Archives"
 COLDWAR_SSR_MLV_p20_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_MLV_p20_public:0 "Restitution Orchards"
 COLDWAR_SSR_MLV_p20_public_desc:0 "Former owners and current cultivators settle claims through compensation, long leases, or return of selected orchards and vineyards. Clear rights can lift investment, while unresolved claims threaten harvests and village peace."
 COLDWAR_SSR_MLV_p20_market:0 "Romanian Credit Links"
 COLDWAR_SSR_MLV_p20_market_desc:0 "Moldavian firms seek credit and machinery through Romanian commercial ties while retaining their own legal titles. New supply channels accelerate modernization, but dependency on Bucharest narrows the republic's economic room."
 COLDWAR_SSR_MLV_p20_production:0 "Latin Script Schools"
 COLDWAR_SSR_MLV_p20_production_desc:0 "Schools and courts adopt Latin-script Romanian with teacher training and translated public forms. Administration becomes more accessible to Romanian speakers, while other language communities need guarantees and costly parallel services."
 COLDWAR_SSR_MLV_p20_consumer:0 "Orchard Packing Houses"
 COLDWAR_SSR_MLV_p20_consumer_desc:0 "Small packing houses and cold stores help growers sell fruit and wine to nearby markets. Rural earnings improve, though market access depends on stable crossings and foreign buyers."
 COLDWAR_SSR_MLV_p20_development:0 "Restitution Orchards"
 COLDWAR_SSR_MLV_p20_development_desc:0 "A claims process returns selected orchards and vineyards to families or compensates those whose land cannot be restored. Owners gain reason to invest in quality, but disputes over decades of collective cultivation risk social division."
 COLDWAR_SSR_MLV_p20_universal:0 "Low Business Levies"
 COLDWAR_SSR_MLV_p20_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_MLV_p20_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_MLV_p20_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_MLV_p20_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_MLV_p20_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_MLV_p20_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_MLV_p20_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_MLV_p20_settlement:0 "A Free Republic"
 COLDWAR_SSR_MLV_p20_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_MLV_p20_romanian:0 "Romanian Convention"
 COLDWAR_SSR_MLV_p20_romanian_desc:0 "Language, family ties and a shared cultural inheritance have survived the frontier. A cultural convention with Bucharest can reconnect schools and public institutions, while leaving the two governments to confront the larger questions raised by that renewed relationship."
 COLDWAR_SSR_EST_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_EST_regional_review_desc:0 "The economy of Estonian SSR has grown around oil shale, engineering and baltic maritime connections. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_EST_regional_orders:0 "Oil-Shale Industry"
 COLDWAR_SSR_EST_regional_orders_desc:0 "Oil-Shale Modernisation draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_EST_regional_diversify:0 "Technical Industry"
 COLDWAR_SSR_EST_regional_diversify_desc:0 "Technical Diversification will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
 COLDWAR_SSR_EST_regional_standards_replace_tt:0 "Replace §YCosts of Oil-Shale Industry§! with §YManaged Costs of Oil-Shale Industry§!"
 COLDWAR_SSR_EST_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_EST_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_name_communist_party_of_estonia_programme:0 "Communist Party of Estonia Programme"
 COLDWAR_SSR_EST_p4_root:0 "Workers' Republic"
 COLDWAR_SSR_EST_p4_root_desc:0 "The Communist Party of Estonia governs an industrializing republic whose oil shale supplies energy and whose engineers serve the wider Union. Independence would leave a technically capable society but expose the environmental and export costs of a power system built around local shale."
 COLDWAR_SSR_EST_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_EST_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_EST_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_EST_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_EST_p4_institution:0 "Shale Turbine Renewal"
 COLDWAR_SSR_EST_p4_institution_desc:0 "Modern turbines and recovery systems extract more useful power from Estonia's oil-shale industry. Energy output and industrial reliability improve, but pollution and water demand remain burdens the republic must address."
 COLDWAR_SSR_EST_p4_public:0 "State Investment"
 COLDWAR_SSR_EST_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_EST_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_EST_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
 COLDWAR_SSR_EST_p4_production:0 "Strategic Workshops"
 COLDWAR_SSR_EST_p4_production_desc:0 "A strategic workshop programme will give public armaments enterprises the facilities needed to honour national orders. Its maintenance and power needs will remain a public obligation even when demand becomes less favourable."
 COLDWAR_SSR_EST_p4_consumer:0 "Cooperative Supply"
 COLDWAR_SSR_EST_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_EST_p4_development:0 "Precision Exports"
 COLDWAR_SSR_EST_p4_development_desc:0 "Engineering plants shift toward instruments, electrical equipment, and precision components for Baltic and Nordic buyers. Skilled export production grows, while dependence on outside orders leaves factories exposed to changing markets."
 COLDWAR_SSR_EST_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_EST_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
 COLDWAR_SSR_EST_p4_targeted:0 "Targeted Provision"
 COLDWAR_SSR_EST_p4_targeted_desc:0 "Support will be concentrated on households and services most exposed to hardship. A narrower commitment can improve public finances, while requiring a larger administrative effort and accepting less universal protection."
 COLDWAR_SSR_EST_p4_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_EST_p4_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_EST_p4_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_EST_p4_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_EST_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_EST_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_estonian_government_in_exile_programme:0 "Estonian Government in Exile Programme"
 COLDWAR_SSR_EST_p0_root:0 "Exile Government"
 COLDWAR_SSR_EST_p0_root_desc:0 "The Estonian Government in Exile preserves the republic's legal continuity and diplomatic representation. Its return would have to unite citizens raised under Soviet rule with refugees and their descendants, while settling property and citizenship without treating the intervening generations as guests."
 COLDWAR_SSR_EST_p0_civic:0 "Restoration Parliament"
 COLDWAR_SSR_EST_p0_civic_desc:0 "The government in exile convenes residents and returning representatives to settle citizenship, property, and constitutional continuity. A broad parliament makes restoration credible at home, but compromises with Soviet-era institutions limit the speed of legal reversal."
 COLDWAR_SSR_EST_p0_executive:0 "Continuity Cabinet"
 COLDWAR_SSR_EST_p0_executive_desc:0 "The former state administration returns through a continuity cabinet with experienced diplomatic and legal officials. It can restore public offices quickly, though distance from local communities leaves the executive short of trust and technical staff."
 COLDWAR_SSR_EST_p0_institution:0 "Citizenship Commission"
 COLDWAR_SSR_EST_p0_institution_desc:0 "A public commission reviews citizenship claims and guarantees equal civil protection to residents who built lives under Soviet rule. A broad settlement strengthens legitimacy, while the state must accept a more complex process than automatic restoration alone."
 COLDWAR_SSR_EST_p0_archives:0 "Open Party Archives"
 COLDWAR_SSR_EST_p0_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_EST_p0_public:0 "Co-op Shale Power"
 COLDWAR_SSR_EST_p0_public_desc:0 "Public utilities retain the oil-shale system while cooperatives and municipalities improve efficiency and environmental safeguards. Stable electricity supports industry, but the state inherits pollution costs and expensive equipment renewal."
 COLDWAR_SSR_EST_p0_market:0 "Baltic Engineering"
 COLDWAR_SSR_EST_p0_market_desc:0 "Private engineering workshops gain credit and port access to serve Nordic and Baltic customers. Skilled export jobs grow quickly, while small firms face strong foreign competition and volatile demand."
 COLDWAR_SSR_EST_p0_production:0 "Port Workshop Fund"
 COLDWAR_SSR_EST_p0_production_desc:0 "A public fund repairs cranes, rail equipment, and precision tools needed for trade. Export capacity returns, though port investment leaves less money for housing and rural services."
 COLDWAR_SSR_EST_p0_consumer:0 "Returnee Housing Bonds"
 COLDWAR_SSR_EST_p0_consumer_desc:0 "Parliament issues bonds for rental housing used by returning families and local residents. Skilled workers can settle near ports and factories, while debt service limits future public borrowing."
 COLDWAR_SSR_EST_p0_development:0 "Port Workshop Fund"
 COLDWAR_SSR_EST_p0_development_desc:0 "Small grants modernize Tallinn's port services and engineering workshops linked to Baltic trade. New private activity appears sooner, while limited public funds cannot rebuild every large industrial plant at once."
 COLDWAR_SSR_EST_p0_universal:0 "Low Business Levies"
 COLDWAR_SSR_EST_p0_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_EST_p0_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_EST_p0_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_EST_p0_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_EST_p0_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_EST_p0_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_EST_p0_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_EST_p0_settlement:0 "A Free Republic"
 COLDWAR_SSR_EST_p0_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_estonian_national_council_programme:0 "Estonian National Council Programme"
 COLDWAR_SSR_EST_p1_root:0 "The National Council"
 COLDWAR_SSR_EST_p1_root_desc:0 "The Estonian National Council joins exile representatives who lack the former government's direct authority but can speak for a wider community. Its coalition must bridge generational divides, sustain recognition abroad, and let residents at home shape the republic they are restoring."
 COLDWAR_SSR_EST_p1_civic:0 "Exile Council"
 COLDWAR_SSR_EST_p1_civic_desc:0 "The National Council shares authority among exile organizations, socialists, and younger advocates of restoration. Coalition government brings more voices into the state, but requires the older government-in-exile to surrender its claim to exclusive continuity."
 COLDWAR_SSR_EST_p1_executive:0 "Returnee Cabinet"
 COLDWAR_SSR_EST_p1_executive_desc:0 "A cabinet of returning lawyers, engineers, and administrators rebuilds national ministries. Experience shortens the institutional gap, but residents who carried the republic through Soviet rule may see returnees as distant decision-makers."
 COLDWAR_SSR_EST_p1_institution:0 "Returnee Housing Fund"
 COLDWAR_SSR_EST_p1_institution_desc:0 "A parliamentary fund repairs vacant homes and builds rental housing for returning families and local residents alike. Skilled workers can settle near factories and ports, but housing commitments place an early burden on the treasury."
 COLDWAR_SSR_EST_p1_archives:0 "Open Party Archives"
 COLDWAR_SSR_EST_p1_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_EST_p1_public:0 "Public Port Authority"
 COLDWAR_SSR_EST_p1_public_desc:0 "A public port authority reinvests dues in harbours, rail links, and coastal engineering. Export revenues remain accountable to parliament, though public ownership slows private upgrades and places maintenance costs on the state."
 COLDWAR_SSR_EST_p1_market:0 "Diaspora Workshops"
 COLDWAR_SSR_EST_p1_market_desc:0 "Exile communities buy shares in engineering firms, repair shops, and food exporters. Capital and expertise return quickly, but foreign shareholders can redirect production toward external buyers."
 COLDWAR_SSR_EST_p1_production:0 "Baltic Trade Standards"
 COLDWAR_SSR_EST_p1_production_desc:0 "Common technical standards help Estonian factories meet Nordic and Baltic contracts. Export quality improves and skilled jobs return, while certification expenses burden older plants and smaller suppliers."
 COLDWAR_SSR_EST_p1_consumer:0 "Returnee Housing Fund"
 COLDWAR_SSR_EST_p1_consumer_desc:0 "Public housing repairs and rental construction help skilled families return without displacing current residents. Labour supply improves, while building costs compete with industrial modernization and ports."
 COLDWAR_SSR_EST_p1_development:0 "Baltic Trade Board"
 COLDWAR_SSR_EST_p1_development_desc:0 "Exporters, port authorities, and local governments coordinate standards for timber, machinery, and food products. Foreign trade expands through common rules, though smaller producers must meet expensive quality and paperwork requirements."
 COLDWAR_SSR_EST_p1_universal:0 "Low Business Levies"
 COLDWAR_SSR_EST_p1_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_EST_p1_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_EST_p1_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_EST_p1_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_EST_p1_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_EST_p1_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_EST_p1_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_EST_p1_settlement:0 "A Free Republic"
 COLDWAR_SSR_EST_p1_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_the_cassette_generation_programme:0 "The Cassette Generation Programme"
 COLDWAR_SSR_EST_p2_root:0 "Cassette Generation"
 COLDWAR_SSR_EST_p2_root_desc:0 "The Cassette Generation is a literary movement, not a 1970 political party. In this counterfactual route, young poets, translators, and educators become a public coalition for Estonian-language culture, open universities, and local government rather than an instant restoration administration."
 COLDWAR_SSR_EST_p2_civic:0 "University Charter"
 COLDWAR_SSR_EST_p2_civic_desc:0 "The Cassette Generation's writers and students establish academic freedom and local language rights as public guarantees. Independent universities nurture skill and debate, while government gives up the ability to direct research toward immediate state needs."
 COLDWAR_SSR_EST_p2_executive:0 "Technical Cabinet"
 COLDWAR_SSR_EST_p2_executive_desc:0 "Engineers, editors, and planners form a cabinet able to restore technical services and open Baltic trade. It can build capacity quickly, though cultural activists fear that economic priorities will once again silence public debate."
 COLDWAR_SSR_EST_p2_institution:0 "Language and Science"
 COLDWAR_SSR_EST_p2_institution_desc:0 "Universities publish technical works in Estonian and establish laboratories open to students from across the republic. Scientific skills broaden, while translation and equipment costs compete with industrial renewal."
 COLDWAR_SSR_EST_p2_public:0 "University Co-ops"
 COLDWAR_SSR_EST_p2_public_desc:0 "Universities and research institutes retain public assets while selling engineering and environmental services to Baltic firms. Scientific work gains customers, but commercial contracts can displace basic research and open teaching."
 COLDWAR_SSR_EST_p2_market:0 "Clean Coast Firms"
 COLDWAR_SSR_EST_p2_market_desc:0 "Independent firms win contracts for waste treatment, marine repair, and clean industrial equipment. Coastal employment and technology grow, while compliance costs make early profits uncertain."
 COLDWAR_SSR_EST_p2_production:0 "Marine Research Fund"
 COLDWAR_SSR_EST_p2_production_desc:0 "Universities and local firms test safer methods for coastal energy and shipping. Research supports future industry, but expensive equipment gives little immediate relief to households."
 COLDWAR_SSR_EST_p2_consumer:0 "Coastal Repair Shops"
 COLDWAR_SSR_EST_p2_consumer_desc:0 "Small firms repair boats, appliances, and port equipment for coastal communities. Local service jobs grow, while fragmented ownership makes quality and safety harder to enforce."
 COLDWAR_SSR_EST_p2_development:0 "Clean Coast Industry"
 COLDWAR_SSR_EST_p2_development_desc:0 "Harbour workshops adopt standards for waste, fuel, and water use while developing repair and marine-equipment trades. Coastal communities benefit from cleaner production, but compliance slows firms using obsolete equipment."
 COLDWAR_SSR_EST_p2_universal:0 "Low Business Levies"
 COLDWAR_SSR_EST_p2_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_EST_p2_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_EST_p2_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_EST_p2_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_EST_p2_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_EST_p2_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_EST_p2_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_EST_p2_settlement:0 "A Free Republic"
 COLDWAR_SSR_EST_p2_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_estonian_socialist_party_programme:0 "Estonian Socialist Party Programme"
 COLDWAR_SSR_EST_p3_root:0 "Social Democracy"
 COLDWAR_SSR_EST_p3_root_desc:0 "The Estonian Socialist Party's Foreign Association kept social-democratic politics alive after party life was crushed at home. Its independent republic would pair parliamentary rule with organized labour, public services, and European social-democratic ties rather than replacing one monopoly with another."
 COLDWAR_SSR_EST_p3_civic:0 "Labour Parliament"
 COLDWAR_SSR_EST_p3_civic_desc:0 "The exile Social Democrats restore parliamentary bargaining among unions, employers, and municipalities. Workers gain a lawful voice in economic change, while agreement takes time and can frustrate a government facing urgent supply shortages."
 COLDWAR_SSR_EST_p3_executive:0 "Labour Cabinet"
 COLDWAR_SSR_EST_p3_executive_desc:0 "Social-democratic ministers coordinate public services and collective bargaining through a professional civil service. It can protect wages while reopening trade, but centralized negotiation limits local unions' ability to shape each factory's future."
 COLDWAR_SSR_EST_p3_institution:0 "Bargaining Law"
 COLDWAR_SSR_EST_p3_institution_desc:0 "Unions negotiate wages, safety, and conversion plans with employers under public labour law. Workers gain a stable voice as ownership changes, but new contracts make rapid plant closures and reorganization harder."
 COLDWAR_SSR_EST_p3_archives:0 "Open Party Archives"
 COLDWAR_SSR_EST_p3_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_EST_p3_public:0 "Public Utility Trust"
 COLDWAR_SSR_EST_p3_public_desc:0 "A parliamentary trust retains energy and transport assets while workers and municipalities oversee investment. Reliable services support industrial recovery, but public debt grows as shale plants and networks require modernization."
 COLDWAR_SSR_EST_p3_market:0 "Nordic Labour Firms"
 COLDWAR_SSR_EST_p3_market_desc:0 "Worker-managed firms and private exporters receive credit under common labour and safety rules. New orders can revive engineering, while higher standards and wage costs make older plants less competitive."
 COLDWAR_SSR_EST_p3_production:0 "Bargaining Law"
 COLDWAR_SSR_EST_p3_production_desc:0 "Unions negotiate plant-level wages, retraining, and closure plans before enterprise conversion. Skilled workers remain involved, but production adjustments take longer when employers and unions disagree."
 COLDWAR_SSR_EST_p3_consumer:0 "Public Health Service"
 COLDWAR_SSR_EST_p3_consumer_desc:0 "Clinics and preventive care remain available as workers change jobs and ownership shifts. Families gain security, while service costs reduce funds available for port and factory investment."
 COLDWAR_SSR_EST_p3_development:0 "Public Health Service"
 COLDWAR_SSR_EST_p3_development_desc:0 "A national health service preserves clinics and preventive care while the economy changes. Skilled families have reason to remain, though service funding competes with urgently needed port and power investment."
 COLDWAR_SSR_EST_p3_universal:0 "Progressive Revenue"
 COLDWAR_SSR_EST_p3_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_EST_p3_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_EST_p3_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_EST_p3_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_EST_p3_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_EST_p3_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_EST_p3_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_EST_p3_settlement:0 "A Social Republic"
 COLDWAR_SSR_EST_p3_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_LAT_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_LAT_regional_review_desc:0 "The economy of Latvian SSR has grown around engineering, ports and a large union industrial workforce. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_LAT_regional_orders:0 "Engineering Orders"
 COLDWAR_SSR_LAT_regional_orders_desc:0 "Engineering Orders draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_LAT_regional_diversify:0 "Port Services"
 COLDWAR_SSR_LAT_regional_diversify_desc:0 "Port and Consumer Services will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
 COLDWAR_SSR_LAT_regional_standards_replace_tt:0 "Replace §YUnion Industrial Dependence§! with §YManaged Union Industrial Dependence§!"
 COLDWAR_SSR_LAT_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_LAT_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_name_communist_party_of_latvia_programme:0 "Communist Party of Latvia Programme"
 COLDWAR_SSR_LAT_p4_root:0 "Workers' Republic"
 COLDWAR_SSR_LAT_p4_root_desc:0 "The Communist Party of Latvia governs ports, railways, engineering works, and a substantial industrial workforce. Independence could preserve this productive network, but republican priorities would have to compete with old Union orders and a population divided over language and political memory."
 COLDWAR_SSR_LAT_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_LAT_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_LAT_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_LAT_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_LAT_p4_institution:0 "Port Engineering"
 COLDWAR_SSR_LAT_p4_institution_desc:0 "Riga's port and engineering plants receive contracts for cranes, rail equipment, and ship repair. Skilled employment and export capacity rise, but large orders draw power and capital away from local consumer production."
 COLDWAR_SSR_LAT_p4_public:0 "State Investment"
 COLDWAR_SSR_LAT_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_LAT_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_LAT_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
 COLDWAR_SSR_LAT_p4_production:0 "Strategic Workshops"
 COLDWAR_SSR_LAT_p4_production_desc:0 "A strategic workshop programme will give public armaments enterprises the facilities needed to honour national orders. Its maintenance and power needs will remain a public obligation even when demand becomes less favourable."
 COLDWAR_SSR_LAT_p4_consumer:0 "Cooperative Supply"
 COLDWAR_SSR_LAT_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_LAT_p4_development:0 "Riga Consumer Works"
 COLDWAR_SSR_LAT_p4_development_desc:0 "Factories expand household appliances, furniture, and light manufacturing for Latvian cities. Consumer supply and small-firm employment improve, while heavy engineering loses some guaranteed investment. Port cities will feel that shift first."
 COLDWAR_SSR_LAT_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_LAT_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
 COLDWAR_SSR_LAT_p4_targeted:0 "Targeted Provision"
 COLDWAR_SSR_LAT_p4_targeted_desc:0 "Support will be concentrated on households and services most exposed to hardship. A narrower commitment can improve public finances, while requiring a larger administrative effort and accepting less universal protection."
 COLDWAR_SSR_LAT_p4_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_LAT_p4_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_LAT_p4_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_LAT_p4_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_LAT_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_LAT_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_latvian_diplomatic_service_programme:0 "Latvian Diplomatic Service Programme"
 COLDWAR_SSR_LAT_p0_root:0 "Diplomatic Continuity"
 COLDWAR_SSR_LAT_p0_root_desc:0 "Latvia's diplomatic service maintained representation abroad and defended the legal non-recognition of Soviet incorporation. A restored government inherits external credibility, but it must create domestic ministries and broaden citizenship before diplomatic legitimacy becomes public trust."
 COLDWAR_SSR_LAT_p0_civic:0 "Citizenship Court"
 COLDWAR_SSR_LAT_p0_civic_desc:0 "The diplomatic service's continuity claim must be joined to fair citizenship rules for residents who remained in Latvia. A court protects due process and broadens trust, while complex claims slow the return of land and property."
 COLDWAR_SSR_LAT_p0_executive:0 "Restoration Cabinet"
 COLDWAR_SSR_LAT_p0_executive_desc:0 "A cabinet of diplomats and returning officials restores ministries and the prewar legal order. It can act quickly, but residents with Soviet-era careers and Russian-language institutions may feel excluded from the new state."
 COLDWAR_SSR_LAT_p0_institution:0 "Consular Citizenship"
 COLDWAR_SSR_LAT_p0_institution_desc:0 "Consulates and local offices register citizens and residents through a clear public procedure. Families gain certainty and access to services, while the government accepts more inclusive rules than a narrow restoration of prewar status."
 COLDWAR_SSR_LAT_p0_archives:0 "Open Party Archives"
 COLDWAR_SSR_LAT_p0_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_LAT_p0_public:0 "Public Port Works"
 COLDWAR_SSR_LAT_p0_public_desc:0 "The state retains Riga's port and rail links, directing dues toward repair and industrial access. Public control protects national revenue, but scarce capital and state maintenance obligations delay new consumer businesses."
 COLDWAR_SSR_LAT_p0_market:0 "Riga Merchant Houses"
 COLDWAR_SSR_LAT_p0_market_desc:0 "Private exporters and repair firms regain access to Baltic markets under commercial law. Jobs and goods return quickly, while outside buyers gain leverage over investment and port priorities."
 COLDWAR_SSR_LAT_p0_production:0 "Rail and Harbour Fund"
 COLDWAR_SSR_LAT_p0_production_desc:0 "A public fund repairs the rail lines, cranes, and warehouses that connect Riga to regional producers. Trade recovers, though port investment leaves less immediate capital for housing."
 COLDWAR_SSR_LAT_p0_consumer:0 "Citizenship Offices"
 COLDWAR_SSR_LAT_p0_consumer_desc:0 "Local offices help residents resolve citizenship, language, and pension claims. Families gain clear access to public services, while administration remains costly during the transition years."
 COLDWAR_SSR_LAT_p0_development:0 "Riga Port Renewal"
 COLDWAR_SSR_LAT_p0_development_desc:0 "Public credit repairs harbour equipment and rail connections needed for trade with both eastern and western neighbours. Exports can recover without a sudden ownership change, but debt limits how quickly other regions receive investment."
 COLDWAR_SSR_LAT_p0_universal:0 "Low Business Levies"
 COLDWAR_SSR_LAT_p0_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_LAT_p0_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_LAT_p0_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_LAT_p0_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_LAT_p0_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_LAT_p0_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_LAT_p0_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_LAT_p0_settlement:0 "A Free Republic"
 COLDWAR_SSR_LAT_p0_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_world_federation_of_free_latvians_programme:0 "World Federation of Free Latvians Programme"
 COLDWAR_SSR_LAT_p1_root:0 "Free Latvians Abroad"
 COLDWAR_SSR_LAT_p1_root_desc:0 "The World Federation of Free Latvians links diaspora organizations that defend Latvian sovereignty and keep language and culture alive abroad. Its coalition can bring capital and expertise home, but it must share authority with residents whose experience and expectations differ from exile politics."
 COLDWAR_SSR_LAT_p1_civic:0 "Diaspora Assembly"
 COLDWAR_SSR_LAT_p1_civic_desc:0 "The World Federation of Free Latvians shares authority with residents, social democrats, and municipal representatives. A broad coalition can mobilize overseas capital without ruling from exile, but it slows decisions over property and citizenship."
 COLDWAR_SSR_LAT_p1_executive:0 "Foreign Policy Council"
 COLDWAR_SSR_LAT_p1_executive_desc:0 "Experienced exile diplomats and federation leaders coordinate recognition, trade, and the return of skilled families. Their networks bring contacts quickly, but a cabinet led abroad risks neglecting local voices."
 COLDWAR_SSR_LAT_p1_institution:0 "Diaspora Investment"
 COLDWAR_SSR_LAT_p1_institution_desc:0 "Latvian communities abroad pool capital for housing, small factories, and port services. Investment creates jobs and reconnects skilled families, while overseas contributors seek a voice in priorities set by the elected government."
 COLDWAR_SSR_LAT_p1_archives:0 "Open Party Archives"
 COLDWAR_SSR_LAT_p1_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_LAT_p1_public:0 "Diaspora Capital Fund"
 COLDWAR_SSR_LAT_p1_public_desc:0 "Latvian communities abroad subscribe capital for port repair, housing, and small manufacturers under parliamentary review. Investment returns home quickly, while donors expect influence over projects and dividend payments."
 COLDWAR_SSR_LAT_p1_market:0 "Private Port Leases"
 COLDWAR_SSR_LAT_p1_market_desc:0 "Parliament leases selected port services and warehouses to Latvian and Nordic firms. Efficiency and trade can improve, but foreign operators gain leverage over employment and national transport."
 COLDWAR_SSR_LAT_p1_production:0 "Diaspora Machine Shops"
 COLDWAR_SSR_LAT_p1_production_desc:0 "Overseas engineers help reopen workshops that make transport and factory parts. Skilled employment returns, while equipment and quality standards depend on continued foreign contacts and credit."
 COLDWAR_SSR_LAT_p1_consumer:0 "Riga Housing Bonds"
 COLDWAR_SSR_LAT_p1_consumer_desc:0 "Public bonds finance rental homes for local families and returnees near port and engineering jobs. Labour supply improves, but repayment limits later borrowing for industry."
 COLDWAR_SSR_LAT_p1_development:0 "Helsinki Legal Office"
 COLDWAR_SSR_LAT_p1_development_desc:0 "Lawyers and diplomats document treaty obligations and raise Latvian rights with European governments. International pressure strengthens the state's legal case, but the office produces no immediate factory or household supply."
 COLDWAR_SSR_LAT_p1_universal:0 "Low Business Levies"
 COLDWAR_SSR_LAT_p1_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_LAT_p1_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_LAT_p1_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_LAT_p1_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_LAT_p1_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_LAT_p1_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_LAT_p1_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_LAT_p1_settlement:0 "A Free Republic"
 COLDWAR_SSR_LAT_p1_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_LAT_p2_root:0 "The Latvian Sixtiers"
 COLDWAR_SSR_LAT_p2_root_desc:0 "The Sixtiers describe a counterfactual circle of Latvian poets, translators, and academics, not a historical party. Its political strength comes from cultural institutions and municipal trust; it must defend the Latvian language while giving Russian-speaking residents a stake in the new state."
 COLDWAR_SSR_LAT_p2_civic:0 "Language Rights Pact"
 COLDWAR_SSR_LAT_p2_civic_desc:0 "The Latvian Sixtiers turn language access and cultural autonomy into enforceable public rights. A bilingual civic settlement can include residents wary of restoration politics, while requiring sustained translation and teacher training."
 COLDWAR_SSR_LAT_p2_executive:0 "Cultural Cabinet"
 COLDWAR_SSR_LAT_p2_executive_desc:0 "A cabinet of educators and municipal officials restores Latvian-language schools and local institutions. It can act coherently, but central standards risk crowding out regional voices and independent cultural debate."
 COLDWAR_SSR_LAT_p2_institution:0 "Civic Language Schools"
 COLDWAR_SSR_LAT_p2_institution_desc:0 "Teacher training and public libraries bring Latvian-language education to every region while maintaining access to Russian-speaking families. Cultural confidence grows, but recruitment and materials raise recurring public costs."
 COLDWAR_SSR_LAT_p2_public:0 "Clean Public Utilities"
 COLDWAR_SSR_LAT_p2_public_desc:0 "Municipal utilities remain public while investing in cleaner heating, water, and industrial standards. Residents gain reliable services and cleaner cities, but public investment is slower than selling concessions to private operators."
 COLDWAR_SSR_LAT_p2_market:0 "Green Workshops"
 COLDWAR_SSR_LAT_p2_market_desc:0 "Independent firms receive licences for repair, waste handling, and efficient equipment. Local innovation can reduce pollution and create jobs, while weak early standards risk uneven environmental results."
 COLDWAR_SSR_LAT_p2_production:0 "Coastal Monitoring"
 COLDWAR_SSR_LAT_p2_production_desc:0 "Public laboratories monitor industrial discharge and port pollution, guiding permits with measured evidence. Environmental policy becomes credible, although clean-up follows only as fast as public budgets allow."
 COLDWAR_SSR_LAT_p2_consumer:0 "Local Language Presses"
 COLDWAR_SSR_LAT_p2_consumer_desc:0 "Small presses publish Latvian and Russian-language civic information and technical manuals. Residents can navigate public services and new businesses, while printing costs limit circulation outside the cities."
 COLDWAR_SSR_LAT_p2_development:0 "Clean Factory Permits"
 COLDWAR_SSR_LAT_p2_development_desc:0 "Factories renew permits only after documenting fuel use and waste treatment. Health and coastal water improve over time, though obsolete plants need costly changes before they can expand production."
 COLDWAR_SSR_LAT_p2_universal:0 "Low Business Levies"
 COLDWAR_SSR_LAT_p2_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_LAT_p2_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_LAT_p2_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_LAT_p2_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_LAT_p2_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_LAT_p2_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_LAT_p2_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_LAT_p2_settlement:0 "A Free Republic"
 COLDWAR_SSR_LAT_p2_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_latvian_social_democratic_workers_party_programme:0 "Latvian Social Democratic Workers' Party Programme"
 COLDWAR_SSR_LAT_p3_root:0 "A Labour Republic"
 COLDWAR_SSR_LAT_p3_root_desc:0 "The Latvian Social Democratic Workers' Party preserved its organization in exile and defended parliamentary legitimacy against both Soviet rule and authoritarian nostalgia. Its social-democratic republic expects workers, employers, and parliament to negotiate the distribution of reconstruction's gains."
 COLDWAR_SSR_LAT_p3_civic:0 "Workers Parliament"
 COLDWAR_SSR_LAT_p3_civic_desc:0 "The exile Social Democrats join unions, parliamentarians, and local representatives in a new legislature. Public bargaining guards against authoritarian restoration, while broader consultation slows urgent industrial conversion."
 COLDWAR_SSR_LAT_p3_executive:0 "Social Democratic Govt"
 COLDWAR_SSR_LAT_p3_executive_desc:0 "A parliamentary cabinet coordinates labour law, social insurance, and export industries through professional ministries. It can protect workers during change, but its public obligations burden a budget short of revenue."
 COLDWAR_SSR_LAT_p3_institution:0 "Workers Insurance"
 COLDWAR_SSR_LAT_p3_institution_desc:0 "Employers and workers contribute to a public fund for injury, unemployment, and retraining. Families gain protection during industrial change, but payroll costs rise as the government replaces Union-era guarantees."
 COLDWAR_SSR_LAT_p3_archives:0 "Open Party Archives"
 COLDWAR_SSR_LAT_p3_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_LAT_p3_public:0 "Public Port Authority"
 COLDWAR_SSR_LAT_p3_public_desc:0 "A public corporation retains port and rail revenue for worker protections and equipment renewal. National control preserves income, but debt and maintenance costs reduce funds for private industry."
 COLDWAR_SSR_LAT_p3_market:0 "Worker Export Firms"
 COLDWAR_SSR_LAT_p3_market_desc:0 "Private exporters and worker cooperatives compete for engineering and timber orders under union contracts. Flexible production raises output, while wage and safety standards make new contracts more expensive."
 COLDWAR_SSR_LAT_p3_production:0 "Workers Insurance Fund"
 COLDWAR_SSR_LAT_p3_production_desc:0 "Employers and unions fund retraining, injury support, and temporary unemployment benefits during factory changes. Families gain protection, while payroll costs reduce investment in older plants."
 COLDWAR_SSR_LAT_p3_consumer:0 "Export Standards"
 COLDWAR_SSR_LAT_p3_consumer_desc:0 "Engineers and workers certify machinery, timber, and port services for foreign customers. Contracts become more dependable, though compliance costs hit small firms hardest and delay expansion."
 COLDWAR_SSR_LAT_p3_development:0 "Export Standards Board"
 COLDWAR_SSR_LAT_p3_development_desc:0 "Industrial firms and trade unions agree on standards for machinery, wood products, and port services. Exports gain reliability and skilled work, while compliance costs burden older plants and smaller suppliers."
 COLDWAR_SSR_LAT_p3_universal:0 "Progressive Revenue"
 COLDWAR_SSR_LAT_p3_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_LAT_p3_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_LAT_p3_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_LAT_p3_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_LAT_p3_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_LAT_p3_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_LAT_p3_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_LAT_p3_settlement:0 "A Social Republic"
 COLDWAR_SSR_LAT_p3_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_LIT_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_LIT_regional_review_desc:0 "The economy of Lithuanian SSR has grown around manufacturing, agriculture and local cadre institutions. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_LIT_regional_orders:0 "Manufacturing"
 COLDWAR_SSR_LIT_regional_orders_desc:0 "Manufacturing Network draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_LIT_regional_diversify:0 "Modern Agriculture"
 COLDWAR_SSR_LIT_regional_diversify_desc:0 "Agricultural Modernisation will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
 COLDWAR_SSR_LIT_regional_standards_replace_tt:0 "Replace §YCompeting Farm and Factory Needs§! with §YManaged Competing Farm and Factory Needs§!"
 COLDWAR_SSR_LIT_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_LIT_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_name_communist_party_of_lithuania_programme:0 "Communist Party of Lithuania Programme"
 COLDWAR_SSR_LIT_p4_root:0 "Workers' Republic"
 COLDWAR_SSR_LIT_p4_root_desc:0 "The Communist Party of Lithuania governs a republic where manufacturing, agriculture, and local cadres coexist with a strong Catholic society. Independence would expose the tension between public ownership and local cultural institutions, while both farms and factories need investment."
 COLDWAR_SSR_LIT_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_LIT_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_LIT_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_LIT_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_LIT_p4_institution:0 "Local Machine Networks"
 COLDWAR_SSR_LIT_p4_institution_desc:0 "Lithuanian factories coordinate parts and tools with local engineering colleges rather than relying on distant plan deliveries. Production becomes more adaptable, though smaller suppliers lack the scale of Union-wide combines."
 COLDWAR_SSR_LIT_p4_public:0 "State Investment"
 COLDWAR_SSR_LIT_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_LIT_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_LIT_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
 COLDWAR_SSR_LIT_p4_production:0 "Strategic Workshops"
 COLDWAR_SSR_LIT_p4_production_desc:0 "A strategic workshop programme will give public armaments enterprises the facilities needed to honour national orders. Its maintenance and power needs will remain a public obligation even when demand becomes less favourable."
 COLDWAR_SSR_LIT_p4_consumer:0 "Cooperative Supply"
 COLDWAR_SSR_LIT_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_LIT_p4_development:0 "Farm Machinery Service"
 COLDWAR_SSR_LIT_p4_development_desc:0 "Repair stations and agricultural colleges keep tractors, harvesters, and food-processing equipment working across rural districts. Harvest losses fall, but public agencies must cover costs that individual farms cannot yet finance."
 COLDWAR_SSR_LIT_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_LIT_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
 COLDWAR_SSR_LIT_p4_targeted:0 "Targeted Provision"
 COLDWAR_SSR_LIT_p4_targeted_desc:0 "Support will be concentrated on households and services most exposed to hardship. A narrower commitment can improve public finances, while requiring a larger administrative effort and accepting less universal protection."
 COLDWAR_SSR_LIT_p4_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_LIT_p4_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_LIT_p4_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_LIT_p4_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_LIT_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_LIT_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_lithuanian_diplomatic_service_programme:0 "Lithuanian Diplomatic Service Programme"
 COLDWAR_SSR_LIT_p0_root:0 "Diplomatic Continuity"
 COLDWAR_SSR_LIT_p0_root_desc:0 "Lithuania's diplomatic service and exile institutions preserved the legal claim of the prewar republic. Independence would bring back a recognized state, but citizenship, land, and the rights of those who remained require decisions made in Vilnius, not only in exile."
 COLDWAR_SSR_LIT_p0_civic:0 "Continuity Assembly"
 COLDWAR_SSR_LIT_p0_civic_desc:0 "The Lithuanian diplomatic service brings legal continuity before a parliament of residents, exiles, and local institutions. The settlement can restore the state without erasing those who stayed, but land and citizenship claims require slow hearings."
 COLDWAR_SSR_LIT_p0_executive:0 "Restoration Cabinet"
 COLDWAR_SSR_LIT_p0_executive_desc:0 "Returning officials and legal experts rebuild ministries under the prewar constitution. Administrative experience helps restart courts and services, while residents raised under Soviet rule may distrust decisions made by returnees."
 COLDWAR_SSR_LIT_p0_institution:0 "Land and Tenancy Court"
 COLDWAR_SSR_LIT_p0_institution_desc:0 "Courts hear claims from former owners, current tenants, and families who cultivate the land. Fair rulings create a basis for investment, while slow hearings and compensation obligations weigh on public finances."
 COLDWAR_SSR_LIT_p0_archives:0 "Open Party Archives"
 COLDWAR_SSR_LIT_p0_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_LIT_p0_public:0 "Land Claims Court"
 COLDWAR_SSR_LIT_p0_public_desc:0 "A court settles claims between former owners, tenants, and families cultivating farms today. Fair rulings let credit return to the countryside, but compensation and title disputes weigh heavily on public accounts."
 COLDWAR_SSR_LIT_p0_market:0 "Baltic Export Bank"
 COLDWAR_SSR_LIT_p0_market_desc:0 "Private and cooperative firms receive credit to sell machinery, wood products, and food across the Baltic. New markets attract investment, while exposure to foreign prices makes employment less secure."
 COLDWAR_SSR_LIT_p0_production:0 "Farm Restitution Board"
 COLDWAR_SSR_LIT_p0_production_desc:0 "Local offices record land claims and protect current tenants while courts review ownership. Farmers can plan planting seasons, though unresolved cases continue to delay large investments."
 COLDWAR_SSR_LIT_p0_consumer:0 "Rail Export Warehouses"
 COLDWAR_SSR_LIT_p0_consumer_desc:0 "Warehouses and rail depots help Lithuanian producers store goods for export and domestic sale. Spoilage falls and routes improve, while construction diverts funds from housing."
 COLDWAR_SSR_LIT_p0_development:0 "Baltic Export Credit"
 COLDWAR_SSR_LIT_p0_development_desc:0 "A public bank helps Lithuanian workshops meet standards for timber products, machinery, and food exports. Small firms gain access to markets, but the state carries the risk when buyers or prices disappear."
 COLDWAR_SSR_LIT_p0_universal:0 "Low Business Levies"
 COLDWAR_SSR_LIT_p0_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_LIT_p0_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_LIT_p0_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_LIT_p0_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_LIT_p0_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_LIT_p0_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_LIT_p0_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_LIT_p0_settlement:0 "A Free Republic"
 COLDWAR_SSR_LIT_p0_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_lithuanian_christian_democratic_party_programme:0 "Lithuanian Christian Democratic Party Programme"
 COLDWAR_SSR_LIT_p1_root:0 "Christian Democracy"
 COLDWAR_SSR_LIT_p1_root_desc:0 "Lithuanian Christian Democrats preserved a political tradition in exile built around Catholic social teaching, education, and national independence. Their republic would restore public religious life while protecting civil authority from control by either the clergy or the party apparatus."
 COLDWAR_SSR_LIT_p1_civic:0 "Catholic Social Pact"
 COLDWAR_SSR_LIT_p1_civic_desc:0 "Christian Democrats write parish education and social welfare into a pluralist constitution under elected civilian law. Community institutions gain standing, while the state must guarantee equal access to citizens outside church networks."
 COLDWAR_SSR_LIT_p1_executive:0 "Stewardship Cabinet"
 COLDWAR_SSR_LIT_p1_executive_desc:0 "An experienced cabinet coordinates family farms, schools, and public services through national ministries. It can protect a social settlement quickly, but centralized appointments risk making Catholic institutions instruments of government."
 COLDWAR_SSR_LIT_p1_institution:0 "Parish Schools Compact"
 COLDWAR_SSR_LIT_p1_institution_desc:0 "Parishes and municipalities share responsibility for schools, teacher training, and cultural education. Families regain a trusted local institution, while the state must fund equal access for districts without wealthy congregations."
 COLDWAR_SSR_LIT_p1_archives:0 "Open Party Archives"
 COLDWAR_SSR_LIT_p1_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_LIT_p1_public:0 "Parish Co-op Banks"
 COLDWAR_SSR_LIT_p1_public_desc:0 "Parish and village banks lend to family farms, dairies, and small workshops with public audits. Local savings support productive work, while small deposits cannot fund major industrial expansion."
 COLDWAR_SSR_LIT_p1_market:0 "Christian Trade Houses"
 COLDWAR_SSR_LIT_p1_market_desc:0 "Independent firms link Lithuanian manufacturers to diaspora buyers and Baltic markets. Trade and small business expand, while commercial influence can outpace the social safeguards that Christian Democrats promise."
 COLDWAR_SSR_LIT_p1_production:0 "Farm Machinery Guilds"
 COLDWAR_SSR_LIT_p1_production_desc:0 "Cooperative guilds repair tractors and train mechanics for family farms. Harvest reliability improves, though a dispersed service network costs more than centralized industrial depots and reduces scale."
 COLDWAR_SSR_LIT_p1_consumer:0 "Parish School Renewal"
 COLDWAR_SSR_LIT_p1_consumer_desc:0 "Parishes and municipalities repair schools and train teachers in local districts. Education and community life recover, while construction costs limit factory investment and transport renewal."
 COLDWAR_SSR_LIT_p1_development:0 "Rural Cooperative Bank"
 COLDWAR_SSR_LIT_p1_development_desc:0 "Credit unions lend to family farms, dairies, and food processors under public rules. Rural producers keep more control over their work, though investment in large manufacturing proceeds more slowly."
 COLDWAR_SSR_LIT_p1_universal:0 "Land and Business Tax"
 COLDWAR_SSR_LIT_p1_universal_desc:0 "Property and commercial income will support the institutions that protect national life. More dependable revenue strengthens government, while farmers and local businesses resist a burden they believe distant industrial interests can more easily evade."
 COLDWAR_SSR_LIT_p1_targeted:0 "Smallholder Relief"
 COLDWAR_SSR_LIT_p1_targeted_desc:0 "Smaller farms and family firms will receive relief while the new economy settles. More resources remain in local production, but the treasury must meet public obligations from a narrower immediate base."
 COLDWAR_SSR_LIT_p1_settlement:0 "A Settled Republic"
 COLDWAR_SSR_LIT_p1_settlement_desc:0 "The republic will rest on institutions that families, producers and local communities can recognise as their own. National authority must preserve that confidence while finding the revenue and commercial capacity needed to sustain an independent state."
 COLDWAR_SSR_name_santara_viesa_federation_programme:0 "Santara-Šviesa Federation Programme"
 COLDWAR_SSR_LIT_p2_root:0 "Santara-Sviesa"
 COLDWAR_SSR_LIT_p2_root_desc:0 "Santara-Šviesa is a liberal Lithuanian diaspora federation that values education, democratic thought, and cultural exchange, including engagement with people inside Soviet Lithuania. Its counterfactual government must turn that openness into a sovereign civic order without mistaking dialogue for consent to Soviet rule."
 COLDWAR_SSR_LIT_p2_civic:0 "Open Society Charter"
 COLDWAR_SSR_LIT_p2_civic_desc:0 "Santara-Sviesa's liberal diaspora tradition protects individual rights, secular education, and civic associations. Independent courts can restrain a new executive, while open debate may slow decisions on urgent enterprise reform."
 COLDWAR_SSR_LIT_p2_executive:0 "Liberal Cabinet"
 COLDWAR_SSR_LIT_p2_executive_desc:0 "Educators, lawyers, and returning professionals coordinate reforms through a cabinet accountable to parliament. Technical expertise helps rebuild public institutions, but centralized administration can frustrate the federation's preference for open civic life."
 COLDWAR_SSR_LIT_p2_institution:0 "Open University Press"
 COLDWAR_SSR_LIT_p2_institution_desc:0 "Universities and independent publishers restore access to Lithuanian history, literature, and scientific debate. Skills and public scrutiny grow, but open institutions cannot direct every graduate toward immediate industrial needs."
 COLDWAR_SSR_LIT_p2_public:0 "University Endowments"
 COLDWAR_SSR_LIT_p2_public_desc:0 "Public universities retain their campuses while diaspora endowments support laboratories and independent research. Scientific work gains resources, but donors can influence subjects and universities must protect open access."
 COLDWAR_SSR_LIT_p2_market:0 "Small Firm Charter"
 COLDWAR_SSR_LIT_p2_market_desc:0 "Family firms and repair shops receive predictable licences, bank credit, and access to imported tools. Employment and household supply grow quickly, while small businesses strain a new tax administration."
 COLDWAR_SSR_LIT_p2_production:0 "Open University Press"
 COLDWAR_SSR_LIT_p2_production_desc:0 "Independent presses publish Lithuanian science, law, and history for universities and public libraries. Knowledge and civic debate expand, though print and translation costs limit circulation."
 COLDWAR_SSR_LIT_p2_consumer:0 "Family Workshop Loans"
 COLDWAR_SSR_LIT_p2_consumer_desc:0 "Local banks finance repair shops, furniture makers, and food processors in smaller towns. Jobs spread beyond Vilnius, while uneven credit risks favour communities with better connections."
 COLDWAR_SSR_LIT_p2_development:0 "Small Firm Charter"
 COLDWAR_SSR_LIT_p2_development_desc:0 "The law gives family workshops, repair shops, and service firms predictable licences and access to credit. New employment appears across towns, while the tax administration must learn to oversee many small businesses."
 COLDWAR_SSR_LIT_p2_universal:0 "Low Business Levies"
 COLDWAR_SSR_LIT_p2_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_LIT_p2_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_LIT_p2_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_LIT_p2_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_LIT_p2_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_LIT_p2_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_LIT_p2_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_LIT_p2_settlement:0 "A Free Republic"
 COLDWAR_SSR_LIT_p2_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_social_democratic_party_of_lithuania_programme:0 "Social Democratic Party of Lithuania Programme"
 COLDWAR_SSR_LIT_p3_root:0 "A Labour Republic"
 COLDWAR_SSR_LIT_p3_root_desc:0 "The Lithuanian Social Democratic Party carries an older parliamentary labour tradition into a republic where Catholic associations and national culture remain powerful. Its programme puts unions, elected government, and public services at the centre of economic change."
 COLDWAR_SSR_LIT_p3_civic:0 "Labour Parliament"
 COLDWAR_SSR_LIT_p3_civic_desc:0 "The Social Democrats bring unions, municipal representatives, and parliamentary parties into a negotiated settlement. Workers gain a voice in public ownership and conversion, while coalition bargaining makes policy slower."
 COLDWAR_SSR_LIT_p3_executive:0 "Labour Cabinet"
 COLDWAR_SSR_LIT_p3_executive_desc:0 "A social-democratic cabinet coordinates wages, public services, and industrial contracts through professional officials. It can keep essential plants operating, but the treasury carries heavy costs while exports recover."
 COLDWAR_SSR_LIT_p3_institution:0 "Labour Bargaining"
 COLDWAR_SSR_LIT_p3_institution_desc:0 "Workers and employers negotiate wages, safety, and conversion through independent unions. Labour gains protection from abrupt closures, while some enterprises will need longer to meet new contracts and productivity standards."
 COLDWAR_SSR_LIT_p3_archives:0 "Open Party Archives"
 COLDWAR_SSR_LIT_p3_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_LIT_p3_public:0 "Public Utility Board"
 COLDWAR_SSR_LIT_p3_public_desc:0 "Parliament retains energy and transport utilities under worker and municipal oversight. Reliable services support farms and factories, though maintenance and pensions compete for scarce public funds."
 COLDWAR_SSR_LIT_p3_market:0 "Co-op Export Firms"
 COLDWAR_SSR_LIT_p3_market_desc:0 "Worker cooperatives and private exporters bid for Baltic machinery, food, and timber contracts under labour law. Market access improves, while smaller firms face unpredictable prices and wage obligations."
 COLDWAR_SSR_LIT_p3_production:0 "Bargaining Act"
 COLDWAR_SSR_LIT_p3_production_desc:0 "Unions negotiate wages, safety, and retraining before plants change ownership or close. Workers gain protection, though agreements can keep obsolete production running longer and raise consumer prices."
 COLDWAR_SSR_LIT_p3_consumer:0 "Public Housing Repairs"
 COLDWAR_SSR_LIT_p3_consumer_desc:0 "Municipalities repair apartments, heating, and clinics before expanding new construction. Industrial families retain essential services, but fewer funds remain for modernization, new housing, and transport."
 COLDWAR_SSR_LIT_p3_development:0 "Public Housing Repairs"
 COLDWAR_SSR_LIT_p3_development_desc:0 "Municipal authorities repair apartments, heating systems, and local clinics before promising new districts. Essential services remain stable for industrial families, but private construction and large factory modernization receive less capital."
 COLDWAR_SSR_LIT_p3_universal:0 "Progressive Revenue"
 COLDWAR_SSR_LIT_p3_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_LIT_p3_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_LIT_p3_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_LIT_p3_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_LIT_p3_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_LIT_p3_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_LIT_p3_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_LIT_p3_settlement:0 "A Social Republic"
 COLDWAR_SSR_LIT_p3_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_name_lithuanian_nationalist_union_programme:0 "Lithuanian Nationalist Union Programme"
 COLDWAR_SSR_LIT_p20_root:0 "The Nationalist Union"
 COLDWAR_SSR_LIT_p20_root_desc:0 "The Lithuanian Nationalist Union draws on the authoritarian nationalist party of the interwar republic and its exile supporters. Its restored state emphasizes national continuity and a strong executive, but it must reckon with the historical cost of silencing political rivals."
 COLDWAR_SSR_LIT_p20_civic:0 "Constitutional Union"
 COLDWAR_SSR_LIT_p20_civic_desc:0 "Nationalists share authority with parliamentarians, Catholic associations, and municipal leaders under a written constitution. The coalition broadens consent beyond the interwar party tradition, while limiting the executive's ability to impose one national line."
 COLDWAR_SSR_LIT_p20_executive:0 "National Directorate"
 COLDWAR_SSR_LIT_p20_executive_desc:0 "A strong directorate coordinates language, industry, and public appointments through loyal officials. It can establish the new state quickly, but centralized authority revives memories of authoritarian interwar government."
 COLDWAR_SSR_LIT_p20_institution:0 "National Works Board"
 COLDWAR_SSR_LIT_p20_institution_desc:0 "A state board directs contracts toward Lithuanian construction firms, food processors, and engineering workshops. Domestic capacity grows faster, but political selection of contractors can reward loyalists over efficient suppliers."
 COLDWAR_SSR_LIT_p20_archives:0 "Open Party Archives"
 COLDWAR_SSR_LIT_p20_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_LIT_p20_public:0 "Family Industry Trusts"
 COLDWAR_SSR_LIT_p20_public_desc:0 "Private and cooperative trusts invest in Lithuanian machine shops, food processing, and domestic suppliers. National firms gain capital, while contract favoritism and family concentration can limit competition."
 COLDWAR_SSR_LIT_p20_market:0 "Priority Contracts"
 COLDWAR_SSR_LIT_p20_market_desc:0 "A national board directs contracts for army vehicles, radios, ammunition, and other strategic goods to favoured domestic firms. Military supply can expand quickly, while political patronage and weak competition raise costs."
 COLDWAR_SSR_LIT_p20_production:0 "National Tool Works"
 COLDWAR_SSR_LIT_p20_production_desc:0 "A state-backed tool works supplies farms and small manufacturers that cannot import machinery. Domestic capacity grows, but subsidies can preserve plants that never become efficient."
 COLDWAR_SSR_LIT_p20_consumer:0 "Rural Land Registry"
 COLDWAR_SSR_LIT_p20_consumer_desc:0 "Registries and credit offices record farm titles and support local food producers. Rural investment improves, while disputes over former estates remain politically sensitive and costly."
 COLDWAR_SSR_LIT_p20_development:0 "Family Farm Titles"
 COLDWAR_SSR_LIT_p20_development_desc:0 "The state records family holdings and provides machinery loans to farms that meet public delivery obligations. Rural investment rises, though strict national conditions limit access for tenants and communities with disputed claims."
 COLDWAR_SSR_LIT_p20_universal:0 "Low Business Levies"
 COLDWAR_SSR_LIT_p20_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_LIT_p20_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_LIT_p20_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_LIT_p20_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_LIT_p20_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_LIT_p20_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_LIT_p20_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_LIT_p20_settlement:0 "National Consolidation"
 COLDWAR_SSR_LIT_p20_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_LIT_p20_civilian:0 "Civilian Settlement"
 COLDWAR_SSR_LIT_p20_civilian_desc:0 "Veteran organisations and political cadres must find a place within national law. Giving civilian institutions the final authority will broaden consent and attract independent expertise, while requiring the movement to share a power it once claimed exclusively."
 COLDWAR_SSR_LIT_p20_cadres:0 "National Directorate"
 COLDWAR_SSR_LIT_p20_cadres_desc:0 "A permanent national directorate will bind military and administrative leadership to the governing movement. It promises discipline and coordinated authority, while deepening the dependence of the state on a narrow and costly political establishment."
 COLDWAR_SSR_GEO_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_GEO_regional_review_desc:0 "The economy of Georgian SSR has grown around subtropical agriculture, light industry and informal trade. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_GEO_regional_orders:0 "Tea Processing"
 COLDWAR_SSR_GEO_regional_orders_desc:0 "Tea and Processing draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_GEO_regional_diversify:0 "Light Industry"
 COLDWAR_SSR_GEO_regional_diversify_desc:0 "Light-Industrial Workshops will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
 COLDWAR_SSR_GEO_regional_standards_replace_tt:0 "Replace §YProtected Informal Networks§! with §YManaged Protected Informal Networks§!"
 COLDWAR_SSR_GEO_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_GEO_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_name_communist_party_of_georgia_programme:0 "Communist Party of Georgia Programme"
 COLDWAR_SSR_GEO_p4_root:0 "Workers' Republic"
 COLDWAR_SSR_GEO_p4_root_desc:0 "The Communist Party of Georgia oversees light industry, food processing, and a society with unusually strong literary and religious traditions. Independence would require a settlement between republican cultural authority, regional autonomy, and factories tied to distant Union markets."
 COLDWAR_SSR_GEO_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_GEO_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_GEO_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_GEO_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_GEO_p4_institution:0 "Tea and Wine Exports"
 COLDWAR_SSR_GEO_p4_institution_desc:0 "Processing plants improve the quality, bottling, and transport of Georgian tea and wine for external buyers. Rural incomes rise and export earnings return, but a poor harvest or closed route can quickly unsettle the budget."
 COLDWAR_SSR_GEO_p4_public:0 "State Investment"
 COLDWAR_SSR_GEO_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_GEO_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_GEO_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
 COLDWAR_SSR_GEO_p4_production:0 "Strategic Workshops"
 COLDWAR_SSR_GEO_p4_production_desc:0 "A strategic workshop programme will give public armaments enterprises the facilities needed to honour national orders. Its maintenance and power needs will remain a public obligation even when demand becomes less favourable."
 COLDWAR_SSR_GEO_p4_consumer:0 "Cooperative Supply"
 COLDWAR_SSR_GEO_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_GEO_p4_development:0 "Black Sea Workshops"
 COLDWAR_SSR_GEO_p4_development_desc:0 "Repair yards and small manufacturers around the coast produce machinery parts, tools, and port equipment. Local firms gain customers beyond agriculture, while fragmented workshops face difficulty meeting common standards."
 COLDWAR_SSR_GEO_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_GEO_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
 COLDWAR_SSR_GEO_p4_targeted:0 "Targeted Provision"
 COLDWAR_SSR_GEO_p4_targeted_desc:0 "Support will be concentrated on households and services most exposed to hardship. A narrower commitment can improve public finances, while requiring a larger administrative effort and accepting less universal protection."
 COLDWAR_SSR_GEO_p4_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_GEO_p4_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_GEO_p4_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_GEO_p4_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_GEO_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_GEO_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_writers_union_of_georgia_programme:0 "Writers' Union of Georgia Programme"
 COLDWAR_SSR_GEO_p1_root:0 "Literary Republic"
 COLDWAR_SSR_GEO_p1_root_desc:0 "The Writers' Union includes authors who shape Georgia's public language and national memory. A counterfactual literary coalition can defend education and cultural institutions, but it must not treat Georgian identity as a reason to deny Abkhaz, Ossetian, Armenian, or other communities a voice."
 COLDWAR_SSR_GEO_p1_civic:0 "Regional Language Pact"
 COLDWAR_SSR_GEO_p1_civic_desc:0 "The Writers' Union protects Georgian public culture while guaranteeing education and civic access for Abkhaz, Ossetian, Armenian, and other communities. Local consent strengthens the republic, but language services require trained teachers and durable funding."
 COLDWAR_SSR_GEO_p1_executive:0 "Cultural Ministry"
 COLDWAR_SSR_GEO_p1_executive_desc:0 "A national ministry coordinates schools, publishing, and public history across the republic. Common standards strengthen Georgian-language education, while communities outside Tbilisi fear that cultural policy will be set without them."
 COLDWAR_SSR_GEO_p1_institution:0 "Regional Schools"
 COLDWAR_SSR_GEO_p1_institution_desc:0 "Local schools expand Georgian-language study while protecting instruction and public access for regional communities. More students gain access to state institutions, but teacher shortages and political mistrust make the work slow."
 COLDWAR_SSR_GEO_p1_public:0 "Winegrower Co-ops"
 COLDWAR_SSR_GEO_p1_public_desc:0 "Village cooperatives share presses, storage, and export contracts for wine, tea, and fruit. Growers retain local control and earn more from processing, while fragmented ownership slows large investment."
 COLDWAR_SSR_GEO_p1_market:0 "Black Sea Arts Firms"
 COLDWAR_SSR_GEO_p1_market_desc:0 "Private studios, publishers, and tourism firms connect Georgian culture to Black Sea markets. Skilled jobs and visitors diversify income, while seasonal demand and outside ownership make earnings uncertain."
 COLDWAR_SSR_GEO_p1_production:0 "Regional Press Network"
 COLDWAR_SSR_GEO_p1_production_desc:0 "Local presses publish Georgian literature, technical works, and histories of the republic's regions. Education and civic participation improve, though printing costs compete with roads and agricultural investment."
 COLDWAR_SSR_GEO_p1_consumer:0 "Black Sea Repair Yards"
 COLDWAR_SSR_GEO_p1_consumer_desc:0 "Small yards repair fishing vessels, port equipment, and agricultural machinery. Coastal employment grows, but specialized parts remain expensive to import and maintain at local yards."
 COLDWAR_SSR_GEO_p1_development:0 "Local Publishing"
 COLDWAR_SSR_GEO_p1_development_desc:0 "Independent presses and bookshops publish Georgian literature, technical works, and regional histories. A wider reading public strengthens civic life, while paper shortages and limited purchasing power constrain the industry."
