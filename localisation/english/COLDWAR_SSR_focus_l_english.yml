 COLDWAR_SSR_KYR_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_KYR_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_name_communist_party_of_kirghizia_programme:0 "Communist Party of Kirghizia Programme"
 COLDWAR_SSR_KYR_p4_root:0 "Workers' Republic"
 COLDWAR_SSR_KYR_p4_root_desc:0 "The Communist Party of Kirghizia governs a mountainous republic with hydropower, livestock, small industry, and substantial budget transfers. Independence would make transport, seasonal energy, and rural employment harder to solve through a centralized Union allocation."
 COLDWAR_SSR_KYR_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_KYR_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_KYR_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_KYR_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_KYR_p4_institution:0 "Hydro Repair Service"
 COLDWAR_SSR_KYR_p4_institution_desc:0 "Engineers restore turbines, transmission lines, and seasonal storage at existing hydropower stations. Reliable electricity supports towns and workshops, but reservoirs and maintenance remain vulnerable to weather and upstream choices."
 COLDWAR_SSR_KYR_p4_public:0 "State Investment"
 COLDWAR_SSR_KYR_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_KYR_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_KYR_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
