 COLDWAR_SSR_UZB_p1_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_UZB_p1_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_UZB_p1_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_UZB_p1_settlement:0 "A Free Republic"
 COLDWAR_SSR_UZB_p1_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_new_jadids_programme:0 "New Jadids Programme"
 COLDWAR_SSR_UZB_p2_root:0 "The New Jadid Council"
 COLDWAR_SSR_UZB_p2_root_desc:0 "The Jadids were earlier Muslim modernist educators, not a political party active in 1970. A counterfactual New Jadid coalition adapts their emphasis on schools, literacy, and technical learning to a secular republic rather than claiming that a purged movement survived intact."
 COLDWAR_SSR_UZB_p2_civic:0 "Independent Courts"
 COLDWAR_SSR_UZB_p2_civic_desc:0 "Public authority must answer to law rather than another circle of personal appointments. Independent courts will protect commercial and civil rights, requiring the executive to accept scrutiny and finance institutions beyond its direct political control."
 COLDWAR_SSR_UZB_p2_executive:0 "Professional Service"
 COLDWAR_SSR_UZB_p2_executive_desc:0 "Experienced civil servants will carry administrative responsibility while elected leaders settle the national programme. A professional service can bring order to government, but it gives less influence to outsiders impatient for a complete political break."
 COLDWAR_SSR_UZB_p2_institution:0 "Technical Lyceums"
 COLDWAR_SSR_UZB_p2_institution_desc:0 "Regional lyceums teach engineering, accounting, and irrigation science alongside Uzbek and Russian. Graduates can staff workshops and public services, though the investment produces skilled capacity only after several years."
 COLDWAR_SSR_UZB_p2_public:0 "Irrigation Science"
 COLDWAR_SSR_UZB_p2_public_desc:0 "Republican institutes will measure canal losses, soil salinity, and crop needs before new water allocations. Research can improve yields without expanding acreage, but findings require investment and coordination with upstream neighbours."
 COLDWAR_SSR_UZB_p2_market:0 "Water User Contracts"
 COLDWAR_SSR_UZB_p2_market_desc:0 "Farm associations will receive enforceable water schedules and pay for measured delivery and canal maintenance. Clear rights reward careful use, but weaker districts may struggle against large farms and state combines."
 COLDWAR_SSR_UZB_p2_production:0 "Textile Engineering"
 COLDWAR_SSR_UZB_p2_production_desc:0 "Technical schools and mills will adapt machinery for repairable local production and better cloth. New skills broaden industry, but imported components and dependable power remain essential to factory output."
 COLDWAR_SSR_UZB_p2_consumer:0 "Canal Repair Crews"
 COLDWAR_SSR_UZB_p2_consumer_desc:0 "Engineers and farmers will repair drainage and canals before losses damage another harvest. Reliable local supply protects food crops and downstream communities, while maintenance funds cannot build textile capacity."
 COLDWAR_SSR_UZB_p2_development:0 "Water-Saving Farms"
 COLDWAR_SSR_UZB_p2_development_desc:0 "Farm managers adopt measured irrigation, drainage repairs, and crop plans suited to local water. The land produces more reliably and downstream communities gain security, while cotton output may fall in the first seasons."
 COLDWAR_SSR_UZB_p2_universal:0 "Low Business Levies"
 COLDWAR_SSR_UZB_p2_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
