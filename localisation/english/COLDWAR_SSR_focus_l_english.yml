 COLDWAR_SSR_TAJ_p1_settlement:0 "A Free Republic"
 COLDWAR_SSR_TAJ_p1_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_sixties_generation_programme:0 "Sixties Generation Programme"
 COLDWAR_SSR_TAJ_p2_root:0 "The Tajik Sixties"
 COLDWAR_SSR_TAJ_p2_root_desc:0 "The Sixties Generation is a counterfactual circle of poets, scholars, and teachers, not a formal 1970 party. Its programme links Tajik-language education to public history and better regional services, while avoiding the claim that one literary generation speaks for all citizens."
 COLDWAR_SSR_TAJ_p2_civic:0 "Independent Courts"
 COLDWAR_SSR_TAJ_p2_civic_desc:0 "Public authority must answer to law rather than another circle of personal appointments. Independent courts will protect commercial and civil rights, requiring the executive to accept scrutiny and finance institutions beyond its direct political control."
 COLDWAR_SSR_TAJ_p2_executive:0 "Professional Service"
 COLDWAR_SSR_TAJ_p2_executive_desc:0 "Experienced civil servants will carry administrative responsibility while elected leaders settle the national programme. A professional service can bring order to government, but it gives less influence to outsiders impatient for a complete political break."
 COLDWAR_SSR_TAJ_p2_institution:0 "Provincial Libraries"
 COLDWAR_SSR_TAJ_p2_institution_desc:0 "Libraries and schools receive books, teachers, and public meeting rooms in provincial towns. Literacy and civic exchange improve beyond the capital, but the network needs recurring funds and reliable transport."
 COLDWAR_SSR_TAJ_p2_public:0 "Provincial Institutes"
 COLDWAR_SSR_TAJ_p2_public_desc:0 "Independent universities and libraries will expand research, literature, and technical education beyond the capital. Open scholarship broadens civic life and trained capacity, but can expose disagreements officials prefer to keep private."
 COLDWAR_SSR_TAJ_p2_market:0 "Village Food Firms"
 COLDWAR_SSR_TAJ_p2_market_desc:0 "Local mills and family workshops will gain commercial rights to process fruit, grain, and dairy near mountain farms. Rural income and food supply improve, though small firms need credit and reliable roads."
 COLDWAR_SSR_TAJ_p2_production:0 "Provincial Libraries"
 COLDWAR_SSR_TAJ_p2_production_desc:0 "Libraries and schools will receive books, teachers, and meeting rooms in provincial towns. Civic exchange and technical learning reach beyond the capital, while the network needs recurring funds and reliable transport."
 COLDWAR_SSR_TAJ_p2_consumer:0 "Local Food Processing"
 COLDWAR_SSR_TAJ_p2_consumer_desc:0 "Small mills and storage facilities will help mountain growers preserve fruit, grain, and dairy near their communities. Rural earnings and supply improve, while dispersed plants cannot match one large combine."
 COLDWAR_SSR_TAJ_p2_development:0 "Local Food Processing"
 COLDWAR_SSR_TAJ_p2_development_desc:0 "Small mills and storage facilities help mountain growers preserve fruit, grain, and dairy products near their communities. Rural earnings and supply improve, while dispersed plants cannot reach the efficiency of one large combine."
 COLDWAR_SSR_TAJ_p2_universal:0 "Low Business Levies"
 COLDWAR_SSR_TAJ_p2_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_TAJ_p2_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_TAJ_p2_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_TAJ_p2_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_TAJ_p2_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_TAJ_p2_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_TAJ_p2_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_TAJ_p2_settlement:0 "A Free Republic"
 COLDWAR_SSR_TAJ_p2_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_tajik_republican_council_of_trade_unions_programme:0 "Tajik Republican Council of Trade Unions Programme"
 COLDWAR_SSR_TAJ_p3_root:0 "Workers' Council"
 COLDWAR_SSR_TAJ_p3_root_desc:0 "The republican trade-union council represents workers within the Soviet workplace system, not a democratic party. A counterfactual sovereign government must give unions independence from employers and officials while deciding how much of a weak budget can support wages and services."
 COLDWAR_SSR_TAJ_p3_civic:0 "A Labour Assembly"
 COLDWAR_SSR_TAJ_p3_civic_desc:0 "Trade unions, professional associations and elected representatives will review the cabinet's programme. A broader labour mandate can protect reconstruction from a narrow party machine, while making national decisions slower and more difficult to settle."
 COLDWAR_SSR_TAJ_p3_executive:0 "The Social Cabinet"
 COLDWAR_SSR_TAJ_p3_executive_desc:0 "A disciplined social cabinet will coordinate enterprise reconstruction and essential services. Concentrated responsibility promises quicker action, while workers and rival parties must accept that many decisions will be taken by officials and technical managers."
 COLDWAR_SSR_TAJ_p3_institution:0 "Independent Union Law"
 COLDWAR_SSR_TAJ_p3_institution_desc:0 "Workers elect union officers who can inspect safety, bargain over wages, and challenge dismissals in court. Labour gains a real voice, while enterprises face new obligations during a fragile transition."
 COLDWAR_SSR_TAJ_p3_public:0 "Worker Safety Charter"
 COLDWAR_SSR_TAJ_p3_public_desc:0 "Public enterprises will recognise elected safety representatives, bargaining procedures, and enforceable maintenance standards. Workers gain a voice in restructuring, while inspections and employment commitments pressure fragile enterprise budgets."
 COLDWAR_SSR_TAJ_p3_market:0 "Workshop Lease Law"
 COLDWAR_SSR_TAJ_p3_market_desc:0 "Workers and managers will lease selected workshops and processing lines with clear duties for wages, repairs, and accounts. Local initiative can preserve useful production, but leaseholders carry risk when inputs or customers disappear."
 COLDWAR_SSR_TAJ_p3_production:0 "Dam Safety Crews"
 COLDWAR_SSR_TAJ_p3_production_desc:0 "Engineers and workers will inspect dams, transmission lines, and emergency systems before expanding generation. Reliable electricity protects homes and workshops, while maintenance uses funds that could finance new capacity."
 COLDWAR_SSR_TAJ_p3_consumer:0 "Independent Union Law"
 COLDWAR_SSR_TAJ_p3_consumer_desc:0 "Trade unions will elect officers who can inspect safety, bargain over wages, and challenge dismissals under public law. Workers gain real protection, while enterprises face new obligations during a fragile transition."
 COLDWAR_SSR_TAJ_p3_development:0 "Dam Safety Crews"
 COLDWAR_SSR_TAJ_p3_development_desc:0 "Public crews maintain dams, power lines, and emergency systems before expanding generation. Reliable electricity supports households and workshops, but maintenance consumes funds that could finance new capacity."
 COLDWAR_SSR_TAJ_p3_universal:0 "Progressive Revenue"
 COLDWAR_SSR_TAJ_p3_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_TAJ_p3_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_TAJ_p3_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_TAJ_p3_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_TAJ_p3_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_TAJ_p3_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_TAJ_p3_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_TAJ_p3_settlement:0 "A Social Republic"
 COLDWAR_SSR_TAJ_p3_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_name_nuri_s_circle_programme:0 "Nuri's Circle Programme"
 COLDWAR_SSR_TAJ_p12_root:0 "Nuri's Religious Circle"
 COLDWAR_SSR_TAJ_p12_root_desc:0 "Said Abdullo Nuri's religious revival network emerged in the 1970s and became openly political much later. This route is a counterfactual civic religious coalition, not a registered 1970 party; it must protect lawful worship and equal citizenship without turning faith into state coercion."
 COLDWAR_SSR_TAJ_p12_civic:0 "Community Schools"
 COLDWAR_SSR_TAJ_p12_civic_desc:0 "Community schools will connect religious education with literacy and practical instruction. Their local support can extend education beyond the reach of state institutions, although the government must negotiate standards with authorities it does not directly appoint."
 COLDWAR_SSR_TAJ_p12_executive:0 "National Curriculum"
 COLDWAR_SSR_TAJ_p12_executive_desc:0 "A common national curriculum will protect technical education and a shared public qualification. Its scientific advantages come with political tension where local educators regard uniform supervision as another attempt to displace their authority."
 COLDWAR_SSR_TAJ_p12_institution:0 "Local Charity Trusts"
 COLDWAR_SSR_TAJ_p12_institution_desc:0 "Community trusts publish accounts for clinics, food assistance, and education in underserved districts. Local charities reach families overlooked by distant ministries, while public auditors protect donors and recipients from political pressure."
 COLDWAR_SSR_TAJ_p12_archives:0 "Open Party Archives"
 COLDWAR_SSR_TAJ_p12_archives_desc:0 "The party-state kept records of appointments, surveillance and the privileges through which public authority was exercised. Opening those files will expose the networks that survived independence and strengthen demands for a new political settlement, while placing a difficult responsibility on national institutions."
 COLDWAR_SSR_TAJ_p12_public:0 "Civic Education Trusts"
 COLDWAR_SSR_TAJ_p12_public_desc:0 "Civic religious associations will fund literacy, practical schooling, and clinics through audited public trusts. Local teaching and charity reach underserved districts, while the state guarantees lawful instruction and equal access for girls and minorities."
 COLDWAR_SSR_TAJ_p12_market:0 "Charity Endowments"
 COLDWAR_SSR_TAJ_p12_market_desc:0 "Independent community endowments will support food assistance, village teachers, and small workshops under transparent law. Local giving responds quickly to hardship, but services may become uneven without open and audited grants."
 COLDWAR_SSR_TAJ_p12_production:0 "Rural Skills Schools"
 COLDWAR_SSR_TAJ_p12_production_desc:0 "Schools will combine literacy, practical trades, and lawful religious instruction under public standards. Villages gain teachers and skilled workers, while equal access and professional oversight must be protected."
 COLDWAR_SSR_TAJ_p12_consumer:0 "Local Charity Clinics"
 COLDWAR_SSR_TAJ_p12_consumer_desc:0 "Community trusts will publish accounts for clinics, food aid, and education in underserved districts. Local charities reach families overlooked by distant ministries, while independent auditors protect recipients from political pressure."
 COLDWAR_SSR_TAJ_p12_development:0 "Rural Skills Schools"
 COLDWAR_SSR_TAJ_p12_development_desc:0 "Schools combine literacy, practical trades, and lawful religious instruction under public education standards. Villages gain teachers and skilled workers, while the coalition must ensure that girls and religious minorities have equal access."
 COLDWAR_SSR_TAJ_p12_universal:0 "A Social Guarantee"
 COLDWAR_SSR_TAJ_p12_universal_desc:0 "A public guarantee of essential care will join community obligations to the authority of the state. It offers protection during economic upheaval, at a substantial and continuing cost to the social budget."
 COLDWAR_SSR_TAJ_p12_targeted:0 "Local Responsibility"
 COLDWAR_SSR_TAJ_p12_targeted_desc:0 "Local funds and voluntary institutions will take a larger part in social provision. Lower central expenditure leaves greater resources for investment, while the quality of care depends more heavily on the wealth and organisation of each community."
 COLDWAR_SSR_TAJ_p12_settlement:0 "The Civic Compact"
 COLDWAR_SSR_TAJ_p12_settlement_desc:0 "A sovereign public life can make room for religious communities without abandoning national law and technical education. Its durability will depend on whether government can balance local authority, commercial change and the rights of citizens who expect the state to speak for them all."
