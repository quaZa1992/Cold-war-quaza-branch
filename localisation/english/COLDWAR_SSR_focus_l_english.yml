 COLDWAR_SSR_KAZ_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_KAZ_p4_development:0 "Regional Water Boards"
 COLDWAR_SSR_KAZ_p4_development_desc:0 "Provincial boards record water use, irrigation needs, and the cost of damaged land before approving new projects. Rural services and long-term productivity improve, while extraction expands more slowly."
 COLDWAR_SSR_KAZ_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_KAZ_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
