 COLDWAR_SSR_UZB_p3_settlement:0 "A Social Republic"
 COLDWAR_SSR_UZB_p3_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_name_mahalla_elders_programme:0 "Mahalla Elders Programme"
 COLDWAR_SSR_UZB_p14_root:0 "The Mahalla Council"
 COLDWAR_SSR_UZB_p14_root_desc:0 "Mahalla elders represent local mediation and community knowledge, not an Islamist party or a unified national bloc. A counterfactual civic government gives neighbourhood councils a lawful role in disputes, water allocation, and support for households while preserving equal citizenship."
 COLDWAR_SSR_UZB_p14_civic:0 "Local Representation"
 COLDWAR_SSR_UZB_p14_civic_desc:0 "Local councils and established community institutions will share responsibility for the national settlement. Their participation can give government deeper roots, while leaving the cabinet to negotiate with interests it cannot simply instruct."
 COLDWAR_SSR_UZB_p14_executive:0 "National Stewardship"
 COLDWAR_SSR_UZB_p14_executive_desc:0 "A stronger national executive will defend public order and coordinate reconstruction through experienced officials. Its supporters expect decisive government, even where that authority restricts the influence of local institutions and public critics."
 COLDWAR_SSR_UZB_p14_institution:0 "Local Arbitration"
 COLDWAR_SSR_UZB_p14_institution_desc:0 "Residents elect mediators who resolve small disputes and record decisions under republican law. Local trust can reduce pressure on distant courts, while appeals and equal protections must prevent community authority from excluding outsiders."
 COLDWAR_SSR_UZB_p14_public:0 "Mahalla Service Trusts"
 COLDWAR_SSR_UZB_p14_public_desc:0 "Municipal trusts will fund water repair, food assistance, and vocational classes under secular law and public audit. Neighbourhood networks can reach households quickly, while officials protect equal access for newcomers and dissenters."
 COLDWAR_SSR_UZB_p14_market:0 "Neighbourhood Credit"
 COLDWAR_SSR_UZB_p14_market_desc:0 "Community credit circles will lend to household workshops, small farms, and market traders under republican contract law. Local savings support flexible work, but borrowers need transparent appeals and protection from personal patronage."
 COLDWAR_SSR_UZB_p14_production:0 "Canal Service Guilds"
 COLDWAR_SSR_UZB_p14_production_desc:0 "Local service guilds will schedule canal repairs, pump maintenance, and farm deliveries with public engineers. Water and equipment reach users more reliably, but districts must negotiate when seasonal allocations cannot meet every demand."
 COLDWAR_SSR_UZB_p14_consumer:0 "Village Skills Rooms"
 COLDWAR_SSR_UZB_p14_consumer_desc:0 "Neighbourhood classrooms will combine literacy, bookkeeping, practical trades, and lawful civic education. Families gain useful skills near home, while instruction must remain open and consistent across districts."
 COLDWAR_SSR_UZB_p14_development:0 "Local Water Shares"
 COLDWAR_SSR_UZB_p14_development_desc:0 "Neighbourhood and farm councils publish irrigation schedules and maintain shared canals. Water reaches crops more predictably, but local bargains can be difficult when upstream and downstream districts need different supplies."
 COLDWAR_SSR_UZB_p14_universal:0 "Land and Business Tax"
 COLDWAR_SSR_UZB_p14_universal_desc:0 "Property and commercial income will support the institutions that protect national life. More dependable revenue strengthens government, while farmers and local businesses resist a burden they believe distant industrial interests can more easily evade."
 COLDWAR_SSR_UZB_p14_targeted:0 "Smallholder Relief"
 COLDWAR_SSR_UZB_p14_targeted_desc:0 "Smaller farms and family firms will receive relief while the new economy settles. More resources remain in local production, but the treasury must meet public obligations from a narrower immediate base."
 COLDWAR_SSR_UZB_p14_settlement:0 "A Settled Republic"
 COLDWAR_SSR_UZB_p14_settlement_desc:0 "The republic will rest on institutions that families, producers and local communities can recognise as their own. National authority must preserve that confidence while finding the revenue and commercial capacity needed to sustain an independent state."
 COLDWAR_SSR_TRK_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_TRK_regional_review_desc:0 "The economy of Turkmen SSR has grown around gas, irrigated cotton and long transport distances. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_TRK_regional_orders:0 "Gas and Textile Orders"
 COLDWAR_SSR_TRK_regional_orders_desc:0 "Gas and Textile Orders draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_TRK_regional_diversify:0 "Water-Saving Farms"
 COLDWAR_SSR_TRK_regional_diversify_desc:0 "Water-Saving Diversification will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
 COLDWAR_SSR_TRK_regional_standards_replace_tt:0 "Replace §YIrrigated Desert Economy§! with §YManaged Irrigated Desert Economy§!"
 COLDWAR_SSR_TRK_regional_standards:0 "Regional Standards"
 COLDWAR_SSR_TRK_regional_standards_desc:0 "Inherited industrial and agricultural problems cannot be erased by announcing another investment plan. Technical supervision, maintenance and honest public accounts will reduce their cost and leave the republic better prepared to manage the consequences of its own development."
 COLDWAR_SSR_name_communist_party_of_turkmenistan_programme:0 "Communist Party of Turkmenistan Programme"
 COLDWAR_SSR_TRK_p4_root:0 "Workers' Republic"
 COLDWAR_SSR_TRK_p4_root_desc:0 "The Communist Party of Turkmenistan governs gas production, irrigated cotton, and settlements separated by long distances. Independence would leave valuable export resources but make pipeline access, water management, and local employment central tests of public authority."
 COLDWAR_SSR_TRK_p4_civic:0 "Accountable Soviets"
 COLDWAR_SSR_TRK_p4_civic_desc:0 "Public ownership need not mean that every official is protected from public criticism. Elected workplace and local representatives will scrutinise appointments and enterprise obligations, giving socialist institutions a broader mandate while limiting the party executive."
 COLDWAR_SSR_TRK_p4_executive:0 "Party Primacy"
 COLDWAR_SSR_TRK_p4_executive_desc:0 "The party will preserve its leading position in government and coordinate the republic's reconstruction through a disciplined executive. Clear authority can settle industrial priorities quickly, at the expense of the criticism and outside expertise that independent institutions might provide."
 COLDWAR_SSR_TRK_p4_institution:0 "Gas Compressor Works"
 COLDWAR_SSR_TRK_p4_institution_desc:0 "Compressor stations and pipeline maintenance secure deliveries to existing buyers. Export income and power supply become more reliable, but the republic remains exposed to a narrow market and expensive routes."
 COLDWAR_SSR_TRK_p4_public:0 "State Investment"
 COLDWAR_SSR_TRK_p4_public_desc:0 "The state will concentrate capital in strategic enterprises, including military production, and direct their orders towards national reconstruction. Public control protects a coherent industrial policy, while leaving the treasury responsible for expensive capacity and employment commitments."
 COLDWAR_SSR_TRK_p4_market:0 "Enterprise Leases"
 COLDWAR_SSR_TRK_p4_market_desc:0 "Enterprises and cooperatives will receive wider rights to lease facilities, retain earnings and seek customers. Public assets remain a national concern, but managers gain room to respond to demand without waiting for a ministry to revise its instructions."
 COLDWAR_SSR_TRK_p4_production:0 "Strategic Workshops"
 COLDWAR_SSR_TRK_p4_production_desc:0 "A strategic workshop programme will give public armaments enterprises the facilities needed to honour national orders. Its maintenance and power needs will remain a public obligation even when demand becomes less favourable."
 COLDWAR_SSR_TRK_p4_consumer:0 "Cooperative Supply"
 COLDWAR_SSR_TRK_p4_consumer_desc:0 "Cooperatives and leased workshops will supply goods neglected by the larger public enterprises. A wider commercial economy can improve everyday supply, though collecting its revenues is more difficult than drawing payments from a few large combines."
 COLDWAR_SSR_TRK_p4_development:0 "Water-Smart Textiles"
 COLDWAR_SSR_TRK_p4_development_desc:0 "Textile plants and farms invest in water reuse, repair, and local fibre processing. Employment spreads beyond raw cotton exports, while modernization costs arrive before water savings produce a return."
 COLDWAR_SSR_TRK_p4_universal:0 "Universal Subsidies"
 COLDWAR_SSR_TRK_p4_universal_desc:0 "Broad subsidies will protect households and sustain demand during reconstruction. Their political value is considerable, but a universal promise obliges the government to support consumers who could afford to pay more."
 COLDWAR_SSR_TRK_p4_targeted:0 "Targeted Provision"
 COLDWAR_SSR_TRK_p4_targeted_desc:0 "Support will be concentrated on households and services most exposed to hardship. A narrower commitment can improve public finances, while requiring a larger administrative effort and accepting less universal protection."
 COLDWAR_SSR_TRK_p4_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_TRK_p4_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_TRK_p4_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_TRK_p4_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_TRK_p4_settlement:0 "Republican Socialism"
 COLDWAR_SSR_TRK_p4_settlement_desc:0 "A sovereign socialist republic must be judged by the work, services and institutions it can sustain. Public responsibility will remain central to national development, with economic decisions now answerable to the republic rather than a distant Union plan."
 COLDWAR_SSR_name_union_of_writers_of_the_turkmen_ssr_programme:0 "Union of Writers of the Turkmen SSR Programme"
 COLDWAR_SSR_TRK_p1_root:0 "Literary Council"
 COLDWAR_SSR_TRK_p1_root_desc:0 "The Writers' Union of the Turkmen SSR gives poets and scholars a public institution in a society without a broad tradition of independent parties. A counterfactual coalition can protect language and education, but should not mistake cultural authority for popular consent."
 COLDWAR_SSR_TRK_p1_civic:0 "Independent Courts"
 COLDWAR_SSR_TRK_p1_civic_desc:0 "Public authority must answer to law rather than another circle of personal appointments. Independent courts will protect commercial and civil rights, requiring the executive to accept scrutiny and finance institutions beyond its direct political control."
 COLDWAR_SSR_TRK_p1_executive:0 "Professional Service"
 COLDWAR_SSR_TRK_p1_executive_desc:0 "Experienced civil servants will carry administrative responsibility while elected leaders settle the national programme. A professional service can bring order to government, but it gives less influence to outsiders impatient for a complete political break."
 COLDWAR_SSR_TRK_p1_institution:0 "Teacher Network"
 COLDWAR_SSR_TRK_p1_institution_desc:0 "Teacher colleges prepare instructors for Turkmen-language schools and technical courses across remote districts. Cultural access and administrative skills improve, though long travel and staffing make delivery costly."
 COLDWAR_SSR_TRK_p1_public:0 "Turkmen Schools Act"
 COLDWAR_SSR_TRK_p1_public_desc:0 "Public colleges will train Turkmen-language teachers, engineers, and administrators for towns beyond Ashgabat. Local education strengthens civic institutions, while distance and specialist shortages slow coverage across the republic."
 COLDWAR_SSR_TRK_p1_market:0 "Local Press Licences"
 COLDWAR_SSR_TRK_p1_market_desc:0 "Independent publishers and cultural workshops will receive clear licences to print, repair equipment, and employ apprentices. Cultural work broadens skilled employment, but remote distribution and imported parts limit commercial reach."
 COLDWAR_SSR_TRK_p1_production:0 "Teacher Training Halls"
 COLDWAR_SSR_TRK_p1_production_desc:0 "Technical colleges will train instructors for gas maintenance, irrigation, transport, and vocational schools. Graduates can reduce reliance on distant specialists, but housing and placement costs make results gradual."
 COLDWAR_SSR_TRK_p1_consumer:0 "Desert Repair Depots"
 COLDWAR_SSR_TRK_p1_consumer_desc:0 "Small depots will maintain pumps, trucks, and farm equipment closer to settlements spread across the desert. Downtime falls and local jobs grow, while fuel and spare-parts delivery remains expensive."
 COLDWAR_SSR_TRK_p1_development:0 "Desert Repair Depots"
 COLDWAR_SSR_TRK_p1_development_desc:0 "Small depots maintain pumps, trucks, and agricultural equipment closer to settlements. Downtime falls across the republic's long routes, while the network is expensive to supply and difficult to supervise."
 COLDWAR_SSR_TRK_p1_universal:0 "Low Business Levies"
 COLDWAR_SSR_TRK_p1_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_TRK_p1_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_TRK_p1_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_TRK_p1_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_TRK_p1_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_TRK_p1_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_TRK_p1_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_TRK_p1_settlement:0 "A Free Republic"
 COLDWAR_SSR_TRK_p1_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_turkmenfilm_new_wave_programme:0 "Turkmenfilm New Wave Programme"
 COLDWAR_SSR_TRK_p2_root:0 "The Turkmen Film Circle"
 COLDWAR_SSR_TRK_p2_root_desc:0 "Turkmenfilm's new generation is a cultural institution rather than a political party. In a counterfactual government, filmmakers and educators can open a public debate about development, but their urban base must engage rural communities and the demands of water and employment."
 COLDWAR_SSR_TRK_p2_civic:0 "Independent Courts"
 COLDWAR_SSR_TRK_p2_civic_desc:0 "Public authority must answer to law rather than another circle of personal appointments. Independent courts will protect commercial and civil rights, requiring the executive to accept scrutiny and finance institutions beyond its direct political control."
 COLDWAR_SSR_TRK_p2_executive:0 "Professional Service"
 COLDWAR_SSR_TRK_p2_executive_desc:0 "Experienced civil servants will carry administrative responsibility while elected leaders settle the national programme. A professional service can bring order to government, but it gives less influence to outsiders impatient for a complete political break."
 COLDWAR_SSR_TRK_p2_institution:0 "Mobile Cinema Service"
 COLDWAR_SSR_TRK_p2_institution_desc:0 "Mobile screening and cultural services carry Turkmen stories, education, and public information beyond Ashgabat. The network connects remote towns, but vehicles and electricity are costly across a large desert territory."
 COLDWAR_SSR_TRK_p2_public:0 "Turkmenfilm Institute"
 COLDWAR_SSR_TRK_p2_public_desc:0 "A public film institute will preserve Turkmen-language production, train technicians, and provide educational screenings outside the capital. Cultural services reach more towns, but public funding leaves studios dependent on official priorities."
 COLDWAR_SSR_TRK_p2_market:0 "Studio Service Leases"
 COLDWAR_SSR_TRK_p2_market_desc:0 "Film and broadcast crews will lease workshops and equipment under clear contracts, keeping room for independent production. Commercial services widen technical employment, but specialist parts and reliable electricity remain scarce."
 COLDWAR_SSR_TRK_p2_production:0 "Broadcast Repair Shops"
 COLDWAR_SSR_TRK_p2_production_desc:0 "Technicians will repair cameras, sound equipment, and electrical systems for regional studios and public broadcasters. Practical skills support wider communication, though specialist components must still come from outside the republic."
 COLDWAR_SSR_TRK_p2_consumer:0 "Mobile Cinema Service"
 COLDWAR_SSR_TRK_p2_consumer_desc:0 "Mobile screenings will carry education, news, and Turkmen-language films to distant settlements. Public communication broadens, while vehicles, operators, and electricity add costs across long routes."
 COLDWAR_SSR_TRK_p2_development:0 "Film Equipment Shops"
 COLDWAR_SSR_TRK_p2_development_desc:0 "Workshops repair cameras, sound equipment, and electrical components for studios and public broadcasters. Technical employment broadens, while specialized parts remain difficult to import after the Union market changes."
 COLDWAR_SSR_TRK_p2_universal:0 "Low Business Levies"
 COLDWAR_SSR_TRK_p2_universal_desc:0 "A lighter burden on commercial activity will leave more resources with new firms and encourage further investment. The state must accept lower immediate receipts and resist using every growing enterprise to repair the public budget."
 COLDWAR_SSR_TRK_p2_targeted:0 "Revenue Before Growth"
 COLDWAR_SSR_TRK_p2_targeted_desc:0 "Profitable enterprises will contribute more firmly to national reconstruction. The additional revenue gives the government greater room to act, while the claim on business resources reduces the pace at which firms can expand."
 COLDWAR_SSR_TRK_p2_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_TRK_p2_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_TRK_p2_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_TRK_p2_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_TRK_p2_settlement:0 "A Free Republic"
 COLDWAR_SSR_TRK_p2_settlement_desc:0 "Independence will endure only if national institutions can sustain authority, productive work and a public life beyond the struggle that brought them to power. The government must turn its political claim into an economic and constitutional settlement that ordinary citizens can recognise."
 COLDWAR_SSR_name_turkmen_republican_council_of_trade_unions_programme:0 "Turkmen Republican Council of Trade Unions Programme"
 COLDWAR_SSR_TRK_p3_root:0 "Workers' Council"
 COLDWAR_SSR_TRK_p3_root_desc:0 "The Republican Council of Trade Unions operated within the Soviet state and did not function as an independent political party. A counterfactual labour government must make workplace representation real while managing gas, cotton, and public housing under a much tighter state budget."
 COLDWAR_SSR_TRK_p3_civic:0 "A Labour Assembly"
 COLDWAR_SSR_TRK_p3_civic_desc:0 "Trade unions, professional associations and elected representatives will review the cabinet's programme. A broader labour mandate can protect reconstruction from a narrow party machine, while making national decisions slower and more difficult to settle."
 COLDWAR_SSR_TRK_p3_executive:0 "The Social Cabinet"
 COLDWAR_SSR_TRK_p3_executive_desc:0 "A disciplined social cabinet will coordinate enterprise reconstruction and essential services. Concentrated responsibility promises quicker action, while workers and rival parties must accept that many decisions will be taken by officials and technical managers."
 COLDWAR_SSR_TRK_p3_institution:0 "Safe Gas Workplaces"
 COLDWAR_SSR_TRK_p3_institution_desc:0 "Workers' inspectors and engineers audit gas facilities, emergency equipment, and pipeline maintenance. Accidents and downtime can fall, while inspections require staff and repairs that raise operating costs."
 COLDWAR_SSR_TRK_p3_public:0 "Gas Workers Charter"
 COLDWAR_SSR_TRK_p3_public_desc:0 "A public workers’ charter will establish safety inspections, maintenance duties, housing standards, and representation at extraction sites. Skilled crews gain protection and reliable facilities, while repairs and employment guarantees raise costs."
 COLDWAR_SSR_TRK_p3_market:0 "Field Service Leases"
 COLDWAR_SSR_TRK_p3_market_desc:0 "Specialist teams will contract for repairs, housing, and safety work at gas fields under published labour rules. Flexible crews can restore equipment quickly, but contracts need enforcement and may weaken permanent employment."
 COLDWAR_SSR_TRK_p3_production:0 "Pipeline Safety Crews"
 COLDWAR_SSR_TRK_p3_production_desc:0 "Permanent crews will inspect compressors, pipelines, and emergency equipment before breakdowns interrupt deliveries. Reliability protects production and workers, but inspection capacity consumes money and engineers otherwise used for expansion."
 COLDWAR_SSR_TRK_p3_consumer:0 "Workers’ Housing Trust"
 COLDWAR_SSR_TRK_p3_consumer_desc:0 "A public trust will maintain water, housing, and clinics for gas and transport workers’ families. Stable communities retain skilled staff, while repairs leave less money for new fields and export facilities."
 COLDWAR_SSR_TRK_p3_development:0 "Workers' Housing Trust"
 COLDWAR_SSR_TRK_p3_development_desc:0 "A public trust repairs housing, water lines, and clinics for industrial families. Stable communities help retain skilled crews, but construction funds cannot be used for new extraction capacity."
 COLDWAR_SSR_TRK_p3_universal:0 "Progressive Revenue"
 COLDWAR_SSR_TRK_p3_universal_desc:0 "Profitable firms will carry a larger share of the public settlement. Higher receipts can protect services and relieve households, but additional claims on business resources slow the investment needed to renew production."
 COLDWAR_SSR_TRK_p3_targeted:0 "A Broader Tax Base"
 COLDWAR_SSR_TRK_p3_targeted_desc:0 "The government will bring smaller enterprises and new commercial activity into dependable public accounts. A broader base avoids relying entirely on a few large firms, at the price of stronger enforcement and a more expensive revenue service."
 COLDWAR_SSR_TRK_p3_enterprise_service:0 "Enterprise Services"
 COLDWAR_SSR_TRK_p3_enterprise_service_desc:0 "Reliable accounts, advice and technical services will help enterprises carry the government's economic settlement into daily practice. Their benefits extend beyond a few favoured firms, while imposing a continuing demand for qualified staff and public supervision."
 COLDWAR_SSR_TRK_p3_revenue_courts:0 "Revenue Appeals"
 COLDWAR_SSR_TRK_p3_revenue_courts_desc:0 "Tax disputes need a dependable procedure rather than competing political instructions. A specialised appeals service will protect enforceable public claims while requiring officials to justify their decisions before the law."
 COLDWAR_SSR_TRK_p3_settlement:0 "A Social Republic"
 COLDWAR_SSR_TRK_p3_settlement_desc:0 "National independence must include institutions through which workers and communities can defend their livelihoods. A lasting social settlement will connect productive enterprise, organised labour and public services without treating every disagreement as a threat to the state."
 COLDWAR_SSR_name_council_of_elders_programme:0 "Council of Elders Programme"
 COLDWAR_SSR_TRK_p14_root:0 "The Council of Elders"
 COLDWAR_SSR_TRK_p14_root_desc:0 "A counterfactual Council of Elders draws on local mediation and customary knowledge without claiming to represent every Turkmen community. Its authority depends on elected municipal rules, equal citizenship, and a practical settlement over water, pasture, and new industry."
 COLDWAR_SSR_TRK_p14_civic:0 "Local Representation"
 COLDWAR_SSR_TRK_p14_civic_desc:0 "Local councils and established community institutions will share responsibility for the national settlement. Their participation can give government deeper roots, while leaving the cabinet to negotiate with interests it cannot simply instruct."
 COLDWAR_SSR_TRK_p14_executive:0 "National Stewardship"
 COLDWAR_SSR_TRK_p14_executive_desc:0 "A stronger national executive will defend public order and coordinate reconstruction through experienced officials. Its supporters expect decisive government, even where that authority restricts the influence of local institutions and public critics."
 COLDWAR_SSR_TRK_p14_institution:0 "Pasture Agreements"
 COLDWAR_SSR_TRK_p14_institution_desc:0 "Village councils and herders agree on seasonal access, repair routes, and land-use records. Livestock communities gain predictable rules, but gas and transport projects face more consultation before construction."
 COLDWAR_SSR_TRK_p14_public:0 "Elders’ Land Council"
 COLDWAR_SSR_TRK_p14_public_desc:0 "Local councils will record pasture access, well maintenance, and village consent before large works begin. Negotiated land use protects established livelihoods, while consultation can delay gas and transport projects with national value."
 COLDWAR_SSR_TRK_p14_market:0 "Pasture Lease Code"
 COLDWAR_SSR_TRK_p14_market_desc:0 "A public lease code will clarify seasonal grazing, well access, and compensation for farms and transport works. Predictable rights support investment, but commercial claims can strain customary access unless appeals remain enforceable."
 COLDWAR_SSR_TRK_p14_production:0 "Shared Well Service"
 COLDWAR_SSR_TRK_p14_production_desc:0 "Village councils and public engineers will maintain wells, pumps, and local canals through published schedules. Reliable water supports livestock and crops, although repair priorities remain contentious in dry seasons."
 COLDWAR_SSR_TRK_p14_consumer:0 "Village Market Roads"
 COLDWAR_SSR_TRK_p14_consumer_desc:0 "Local roads and market depots will connect herders, growers, and towns across long distances. Household supply and rural trade improve, while the state accepts a lasting maintenance burden for lightly used routes."
 COLDWAR_SSR_TRK_p14_development:0 "Shared Wells"
 COLDWAR_SSR_TRK_p14_development_desc:0 "Local authorities maintain wells, canals, and water schedules with public engineers. Rural stability and crop reliability improve, although water infrastructure absorbs funds that could expand gas exports."
 COLDWAR_SSR_TRK_p14_universal:0 "Land and Business Tax"
 COLDWAR_SSR_TRK_p14_universal_desc:0 "Property and commercial income will support the institutions that protect national life. More dependable revenue strengthens government, while farmers and local businesses resist a burden they believe distant industrial interests can more easily evade."
 COLDWAR_SSR_TRK_p14_targeted:0 "Smallholder Relief"
 COLDWAR_SSR_TRK_p14_targeted_desc:0 "Smaller farms and family firms will receive relief while the new economy settles. More resources remain in local production, but the treasury must meet public obligations from a narrower immediate base."
 COLDWAR_SSR_TRK_p14_settlement:0 "A Settled Republic"
 COLDWAR_SSR_TRK_p14_settlement_desc:0 "The republic will rest on institutions that families, producers and local communities can recognise as their own. National authority must preserve that confidence while finding the revenue and commercial capacity needed to sustain an independent state."
 COLDWAR_SSR_KYR_regional_review:0 "Regional Priorities"
 COLDWAR_SSR_KYR_regional_review_desc:0 "The economy of Kirghiz SSR has grown around hydropower, livestock, industry and budget transfers. The next investment programme must decide whether to strengthen that established role or build a broader base beneath the republic's future prosperity."
 COLDWAR_SSR_KYR_regional_orders:0 "Power and Industry"
 COLDWAR_SSR_KYR_regional_orders_desc:0 "Hydropower and Workshops draws on facilities and skills already woven into the Union economy. Modernisation can increase their value to major customers, while leaving the republic more exposed to the supply arrangements and procurement priorities that sustain them."
 COLDWAR_SSR_KYR_regional_diversify:0 "Rural Processing"
 COLDWAR_SSR_KYR_regional_diversify_desc:0 "Rural Processing will give the republic a wider range of producers and customers. The immediate return may be less impressive than another expansion of its established specialisation, but local livelihoods will depend on fewer decisions taken elsewhere."
