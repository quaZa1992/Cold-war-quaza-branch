# IMPERIA CW — Cold War: 1970 generic focus — English localisation.
 GEN_1970_gov_shortcut:0 "Government"
 GEN_1970_pw_shortcut:0 "Western Outlook"
 GEN_1970_pe_shortcut:0 "Emerging Outlook"
 GEN_1970_ps_shortcut:0 "Salafist Outlook"
 GEN_1970_pn_shortcut:0 "Non-Aligned Outlook"
 GEN_1970_pr_shortcut:0 "Nationalist Outlook"
 GEN_1970_dip_shortcut:0 "Foreign Policy"
 GEN_1970_eco_shortcut:0 "Economic System"
 GEN_1970_dev_shortcut:0 "Development"
 GEN_1970_ind_shortcut:0 "Industry and Energy"
 GEN_1970_soc_shortcut:0 "Society and Science"
 GEN_1970_army_shortcut:0 "Army"
 GEN_1970_air_shortcut:0 "Air Force"
 GEN_1970_nav_shortcut:0 "Navy"
 GEN_1970_reform_the_government:0 "Reform the Government"
 GEN_1970_reform_the_government_desc:0 "The machinery of state has not kept pace with the times. A review of how we govern is overdue."
 GEN_1970_expand_the_security_service:0 "Expand the Security Service"
 GEN_1970_expand_the_security_service_desc:0 "Foreign agents and domestic subversives demand a stronger security service."
 GEN_1970_cabinet_of_technocrats:0 "Cabinet of Technocrats"
 GEN_1970_cabinet_of_technocrats_desc:0 "Engineers, economists and planners replace party veterans in the ministries. Results will matter more than loyalty."
 GEN_1970_corruption_chance_tt:0 "There is a §R50%§! chance that §Rcorruption increases§! by one level."
 GEN_1970_cabinet_of_loyalists:0 "Cabinet of Loyalists"
 GEN_1970_cabinet_of_loyalists_desc:0 "Only men we can trust will hold the levers of power, whatever their qualifications."
 GEN_1970_cabinet_of_national_unity:0 "Government of National Unity"
 GEN_1970_cabinet_of_national_unity_desc:0 "Every major camp receives a seat at the table. Unity has a price: endless negotiation."
 GEN_1970_build_listening_posts:0 "Build Listening Posts"
 GEN_1970_build_listening_posts_desc:0 "A network of listening posts will monitor radio traffic along our borders."
 GEN_1970_anti_corruption_commission:0 "Anti-Corruption Commission"
 GEN_1970_anti_corruption_commission_desc:0 "An independent commission will investigate the ministries, the courts and the state companies."
 GEN_1970_patronage_networks:0 "Patronage Networks"
 GEN_1970_patronage_networks_desc:0 "Offices, licences and contracts reward those who stand by the government."
 GEN_1970_administrative_reform:0 "Administrative Reform"
 GEN_1970_administrative_reform_desc:0 "Overlapping ministries are merged and the provinces are reorganised."
 GEN_1970_counter_insurgency_doctrine:0 "Counter-Insurgency Doctrine"
 GEN_1970_counter_insurgency_doctrine_desc:0 "The lessons of Algeria, Malaya and Vietnam are studied closely. Insurgents will find no safe ground."
 GEN_1970_political_police:0 "Political Police"
 GEN_1970_political_police_desc:0 "The political police watch everyone. Few dare to speak openly, scientists included."
 GEN_1970_outlook_W_p5_tt:0 "§YWestern§! outlook: the governing party (or, if it belongs to another outlook, the most popular Western party) §Ggains 5%§! popularity."
 GEN_1970_political_thaw:0 "Political Thaw"
 GEN_1970_political_thaw_desc:0 "Censorship has been relaxed. New ideas circulate freely, including foreign ones."
 GEN_1970_outlook_W_m3_tt:0 "§YWestern§! outlook: the governing party (or, if it belongs to another outlook, the most popular Western party) §Rloses 3%§! popularity."
 GEN_1970_guided_democracy:0 "Guided Democracy"
 GEN_1970_guided_democracy_desc:0 "Elections take place, but the result is never in doubt."
 GEN_1970_centralisation:0 "Centralisation"
 GEN_1970_centralisation_desc:0 "Power is concentrated in the capital. The provinces will follow its instructions."
 GEN_1970_decentralisation:0 "Decentralisation"
 GEN_1970_decentralisation_desc:0 "The regions receive real authority over their own affairs."
 GEN_1970_signals_intelligence_directorate:0 "Signals Intelligence Directorate"
 GEN_1970_signals_intelligence_directorate_desc:0 "Codebreakers and radio engineers form a directorate of their own."
 GEN_1970_professional_civil_service:0 "Professional Civil Service"
 GEN_1970_professional_civil_service_desc:0 "Entrance examinations and fixed career paths will create a modern, professional administration."
 GEN_1970_the_state_endures:0 "The State Endures"
 GEN_1970_the_state_endures_desc:0 "Our institutions have weathered the storms of the decade. The state endures."
 GEN_1970_outlook_W_p3_tt:0 "§YWestern§! outlook: the governing party (or, if it belongs to another outlook, the most popular Western party) §Ggains 3%§! popularity."
 GEN_1970_outlook_E_m5_tt:0 "§YEmerging§! outlook: the governing party (or, if it belongs to another outlook, the most popular Emerging party) §Rloses 5%§! popularity."
 GEN_1970_outlook_R_m5_tt:0 "§YNationalist§! outlook: the governing party (or, if it belongs to another outlook, the most popular Nationalist party) §Rloses 5%§! popularity."
 GEN_1970_tension_m1_tt:0 "Cold War Tension: §G-1§!"
 GEN_1970_outlook_E_p5_tt:0 "§YEmerging§! outlook: the governing party (or, if it belongs to another outlook, the most popular Emerging party) §Ggains 5%§! popularity."
 GEN_1970_outlook_E_p3_tt:0 "§YEmerging§! outlook: the governing party (or, if it belongs to another outlook, the most popular Emerging party) §Ggains 3%§! popularity."
 GEN_1970_tension_p1_tt:0 "Cold War Tension: §R+1§!"
 GEN_1970_outlook_S_p5_tt:0 "§YSalafist§! outlook: the governing party (or, if it belongs to another outlook, the most popular Salafist party) §Ggains 5%§! popularity."
 GEN_1970_outlook_S_p3_tt:0 "§YSalafist§! outlook: the governing party (or, if it belongs to another outlook, the most popular Salafist party) §Ggains 3%§! popularity."
 GEN_1970_outlook_N_p5_tt:0 "§YNon-Aligned§! outlook: the governing party (or, if it belongs to another outlook, the most popular Non-Aligned party) §Ggains 5%§! popularity."
 GEN_1970_outlook_N_p3_tt:0 "§YNon-Aligned§! outlook: the governing party (or, if it belongs to another outlook, the most popular Non-Aligned party) §Ggains 3%§! popularity."
 GEN_1970_outlook_R_p5_tt:0 "§YNationalist§! outlook: the governing party (or, if it belongs to another outlook, the most popular Nationalist party) §Ggains 5%§! popularity."
 GEN_1970_outlook_R_p3_tt:0 "§YNationalist§! outlook: the governing party (or, if it belongs to another outlook, the most popular Nationalist party) §Ggains 3%§! popularity."
 GEN_1970_foreign_policy_review:0 "Foreign Policy Review"
 GEN_1970_foreign_policy_review_desc:0 "The world is divided between two camps. We must decide where we stand."
 GEN_1970_a_modern_diplomatic_corps:0 "A Modern Diplomatic Corps"
 GEN_1970_a_modern_diplomatic_corps_desc:0 "Our embassies are understaffed and our diplomats untrained. That ends now."
 GEN_1970_trade_with_the_neighbours:0 "Trade with the Neighbours"
 GEN_1970_trade_with_the_neighbours_desc:0 "Good relations start with trade. Our neighbours are our natural partners."
 GEN_1970_the_defence_debate:0 "The Defence Debate"
 GEN_1970_the_defence_debate_desc:0 "Parliament, the press and the officer corps argue over the nation's defence."
 GEN_1970_a_station_in_the_world:0 "A Station in the World"
 GEN_1970_a_station_in_the_world_desc:0 "Every nation must find its place in the Cold War. Ours is still undecided."
 GEN_1970_peaceful_coexistence:0 "Peaceful Coexistence"
 GEN_1970_peaceful_coexistence_desc:0 "War between the blocs would destroy us all. Coexistence is the only sane policy."
 GEN_1970_forward_defence:0 "Forward Defence"
 GEN_1970_forward_defence_desc:0 "Threats must be met before they reach our borders."
 GEN_1970_lean_to_the_west:0 "Lean to the West"
 GEN_1970_lean_to_the_west_desc:0 "Washington, London and Paris offer capital, technology and protection."
 GEN_1970_friendship_with_moscow:0 "Friendship with Moscow"
 GEN_1970_friendship_with_moscow_desc:0 "Moscow supports the struggle against imperialism with weapons, credit and advisers."
 GEN_1970_the_chinese_road:0 "The Chinese Road"
 GEN_1970_the_chinese_road_desc:0 "Peking shows that a peasant nation can build socialism by its own strength."
 GEN_1970_non_alignment:0 "Non-Alignment"
 GEN_1970_non_alignment_desc:0 "We will not choose between the two blocs. The spirit of Bandung guides us."
 GEN_1970_our_own_destiny:0 "Our Own Destiny"
 GEN_1970_our_own_destiny_desc:0 "Neither Washington nor Moscow will decide our fate. The nation comes first."
 GEN_1970_build_fortifications:0 "Build Fortifications"
 GEN_1970_build_fortifications_desc:0 "Bunkers, tank traps and shelters will make any invasion costly."
 GEN_1970_militarism:0 "Militarism"
 GEN_1970_militarism_desc:0 "The army is the school of the nation."
 GEN_1970_open_to_western_capital:0 "Open to Western Capital"
 GEN_1970_open_to_western_capital_desc:0 "Western banks and companies are invited to invest, and they will expect a return."
 GEN_1970_soviet_military_advisers:0 "Soviet Military Advisers"
 GEN_1970_soviet_military_advisers_desc:0 "Soviet officers will train our army, and they will report to Moscow."
 GEN_1970_self_reliance:0 "Self-Reliance"
 GEN_1970_self_reliance_desc:0 "An economy built on our own strength is hard to blockade."
 GEN_1970_neither_east_nor_west:0 "Neither East nor West"
 GEN_1970_neither_east_nor_west_desc:0 "Our neutrality is our shield. We join no alliance and host no foreign bases."
 GEN_1970_national_mobilisation:0 "National Mobilisation"
 GEN_1970_national_mobilisation_desc:0 "The people must be ready to defend the nation at any moment."
 GEN_1970_peaceful_emergence:0 "Peaceful Emergence"
 GEN_1970_peaceful_emergence_desc:0 "Factories, not tanks, will make us strong."
 GEN_1970_revanchism:0 "Revanchism"
 GEN_1970_revanchism_desc:0 "We have not forgotten what was taken from us."
 GEN_1970_export_our_model:0 "Export Our Model"
 GEN_1970_export_our_model_desc:0 "Radio stations, scholarships and friendship societies carry our ideas abroad, at a price."
 GEN_1970_voice_at_the_united_nations:0 "Voice at the United Nations"
 GEN_1970_voice_at_the_united_nations_desc:0 "In the General Assembly every nation has one vote, and ours will be heard."
 GEN_1970_tension_m2_tt:0 "Cold War Tension: §G-2§!"
 GEN_1970_champion_of_detente:0 "Champion of Détente"
 GEN_1970_champion_of_detente_desc:0 "We will mediate between the blocs and lower the temperature of the Cold War."
 GEN_1970_tension_p2_tt:0 "Cold War Tension: §R+2§!"
 GEN_1970_brinkmanship:0 "Brinkmanship"
 GEN_1970_brinkmanship_desc:0 "Only those willing to go to the brink are taken seriously."
 GEN_1970_the_economic_question:0 "The Economic Question"
 GEN_1970_the_economic_question_desc:0 "Market, plan or something in between: the most important decision of the decade."
 GEN_1970_market_liberalisation:0 "Market Liberalisation"
 GEN_1970_market_liberalisation_desc:0 "Prices are freed, licences abolished and private enterprise encouraged."
 GEN_1970_the_mixed_economy:0 "The Mixed Economy"
 GEN_1970_the_mixed_economy_desc:0 "The state guides, private enterprise produces, and the unions have a say."
 GEN_1970_debt_restructuring:0 "Debt Restructuring"
 GEN_1970_debt_restructuring_desc:0 "Our creditors are willing to talk. Better terms now will save us later."
 GEN_1970_central_planning:0 "Central Planning"
 GEN_1970_central_planning_desc:0 "The plan builds quickly, but without competition productivity lags and foreign capital stays away."
 GEN_1970_agricultural_subsidies:0 "Agricultural Subsidies"
 GEN_1970_agricultural_subsidies_desc:0 "The countryside feeds the nation and deserves our support."
 GEN_1970_attract_foreign_investors:0 "Attract Foreign Investors"
 GEN_1970_attract_foreign_investors_desc:0 "Tax breaks and guarantees will bring foreign capital into the country."
 GEN_1970_open_the_stock_exchange:0 "Open the Stock Exchange"
 GEN_1970_open_the_stock_exchange_desc:0 "A modern stock exchange will channel savings into industry."
 GEN_1970_indicative_planning:0 "Indicative Planning"
 GEN_1970_indicative_planning_desc:0 "State and business pursue common targets."
 GEN_1970_national_champions:0 "National Champions"
 GEN_1970_national_champions_desc:0 "A few large companies will carry the flag on world markets."
 GEN_1970_nationalise_key_industries:0 "Nationalise Key Industries"
 GEN_1970_nationalise_key_industries_desc:0 "Banks, mines and heavy industry pass into the hands of the people."
 GEN_1970_state_planning_committee:0 "State Planning Committee"
 GEN_1970_state_planning_committee_desc:0 "A state planning committee will draw up the five-year plans."
 GEN_1970_land_reform:0 "Land Reform"
 GEN_1970_land_reform_desc:0 "The great estates are broken up and the land is given to those who till it."
 GEN_1970_the_green_revolution:0 "The Green Revolution"
 GEN_1970_the_green_revolution_desc:0 "New seeds, fertiliser and irrigation can double our harvests."
 GEN_1970_simplify_the_tax_code:0 "Simplify the Tax Code"
 GEN_1970_simplify_the_tax_code_desc:0 "Hundreds of exemptions are abolished. Fewer taxes, but everyone pays."
 GEN_1970_export_processing_zones:0 "Export Processing Zones"
 GEN_1970_export_processing_zones_desc:0 "Duty-free zones near our ports will attract assembly plants for the world market."
 GEN_1970_social_partnership:0 "Social Partnership"
 GEN_1970_social_partnership_desc:0 "Employers and unions negotiate wages and working conditions at one table."
 GEN_1970_collectivise_agriculture:0 "Collectivise Agriculture"
 GEN_1970_collectivise_agriculture_desc:0 "Private plots are merged into collective farms. The village will feed the factory."
 GEN_1970_peasant_cooperatives:0 "Peasant Cooperatives"
 GEN_1970_peasant_cooperatives_desc:0 "Small farmers join cooperatives to share machines, seed and credit."
 GEN_1970_commercial_agriculture:0 "Commercial Agriculture"
 GEN_1970_commercial_agriculture_desc:0 "Modern farms produce for the market."
 GEN_1970_economic_miracle:0 "Economic Miracle"
 GEN_1970_economic_miracle_desc:0 "Growth rates that astonish the world: this is our economic miracle."
 GEN_1970_pension_fund_investments:0 "Pension Fund Investments"
 GEN_1970_pension_fund_investments_desc:0 "Pension funds will invest in the country's future and secure old age."
 GEN_1970_planned_prosperity:0 "Planned Prosperity"
 GEN_1970_planned_prosperity_desc:0 "The mixed economy delivers: rising wages, full shops and social peace."
 GEN_1970_socialist_industrialisation:0 "Socialist Industrialisation"
 GEN_1970_socialist_industrialisation_desc:0 "Steel, cement and machines: the foundations of a socialist economy."
 GEN_1970_a_new_breadbasket:0 "A New Breadbasket"
 GEN_1970_a_new_breadbasket_desc:0 "Our fields will feed the nation and its neighbours."
 GEN_1970_national_development_plan:0 "National Development Plan"
 GEN_1970_national_development_plan_desc:0 "Roads, railways and power lines will tie the nation together."
 GEN_1970_railway_expansion:0 "Railway Expansion"
 GEN_1970_railway_expansion_desc:0 "The railway remains the backbone of a modern economy."
 GEN_1970_highway_programme:0 "Highway Programme"
 GEN_1970_highway_programme_desc:0 "Modern highways will connect our cities."
 GEN_1970_national_fuel_depots:0 "National Fuel Depots"
 GEN_1970_national_fuel_depots_desc:0 "An army without fuel is no army. We will build national fuel depots."
 GEN_1970_expand_the_cities:0 "Expand the Cities"
 GEN_1970_expand_the_cities_desc:0 "Millions are moving from the villages to the cities. They need homes and work."
 GEN_1970_rural_electrification:0 "Rural Electrification"
 GEN_1970_rural_electrification_desc:0 "Power lines reach the countryside."
 GEN_1970_expand_the_strategic_reserves:0 "Expand the Strategic Reserves"
 GEN_1970_expand_the_strategic_reserves_desc:0 "Larger reserves will protect us from embargoes and price shocks."
 GEN_1970_developmentalism:0 "Developmentalism"
 GEN_1970_developmentalism_desc:0 "The state will lead the economy to modernity."
 GEN_1970_economic_autonomy:0 "Economic Autonomy"
 GEN_1970_economic_autonomy_desc:0 "We must produce what we need ourselves."
 GEN_1970_increase_resource_production:0 "Increase Resource Production"
 GEN_1970_increase_resource_production_desc:0 "Our mines and wells hold untapped wealth."
 GEN_1970_autarky:0 "Autarky"
 GEN_1970_autarky_desc:0 "Domestic production replaces imports."
 GEN_1970_economic_measures:0 "Economic Measures"
 GEN_1970_economic_measures_desc:0 "Careful budget measures will put growth on a solid footing."
 GEN_1970_the_manpower_solution:0 "The Manpower Solution"
 GEN_1970_the_manpower_solution_desc:0 "More hands in more factories."
 GEN_1970_improved_worker_productivity:0 "Improved Worker Productivity"
 GEN_1970_improved_worker_productivity_desc:0 "Better tools and better training make every worker count."
 GEN_1970_emphasise_autarkic_measures:0 "Emphasise Autarkic Measures"
 GEN_1970_emphasise_autarkic_measures_desc:0 "High tariffs and import quotas protect our young industries."
 GEN_1970_reaching_to_the_global_market:0 "Reaching to the Global Market"
 GEN_1970_reaching_to_the_global_market_desc:0 "Our products will compete on the world market, and we will feel its swings."
 GEN_1970_light_industry_investments:0 "Light Industry Investments"
 GEN_1970_light_industry_investments_desc:0 "Textiles, shoes and household goods: industry begins with the consumer."
 GEN_1970_mobilise_the_working_class:0 "Mobilise the Working Class"
 GEN_1970_mobilise_the_working_class_desc:0 "The workers are the strength of the nation."
 GEN_1970_heavy_industry_investments:0 "Heavy Industry Investments"
 GEN_1970_heavy_industry_investments_desc:0 "A modern state needs steel and heavy machinery."
 GEN_1970_the_energy_question:0 "The Energy Question"
 GEN_1970_the_energy_question_desc:0 "Our industry is hungry for power. Where will it come from?"
 GEN_1970_import_foreign_automobiles:0 "Import Foreign Automobiles"
 GEN_1970_import_foreign_automobiles_desc:0 "Foreign cars will show our engineers what is possible."
 GEN_1970_refitting_the_military_industry:0 "Refitting the Military Industry"
 GEN_1970_refitting_the_military_industry_desc:0 "Old arsenals are refitted for modern weapons."
 GEN_1970_military_industry_projects:0 "Military Industry Projects"
 GEN_1970_military_industry_projects_desc:0 "State contracts will modernise the arms industry."
 GEN_1970_synthetic_refinery_expansion:0 "Synthetic Refinery Expansion"
 GEN_1970_synthetic_refinery_expansion_desc:0 "Synthetic fuel makes us less dependent on imported oil."
 GEN_1970_great_dam_projects:0 "Great Dam Projects"
 GEN_1970_great_dam_projects_desc:0 "Great dams will tame our rivers and light our cities."
 GEN_1970_coal_and_oil_power:0 "Coal and Oil Power"
 GEN_1970_coal_and_oil_power_desc:0 "Coal and oil are proven, cheap and available."
 GEN_1970_the_atomic_future:0 "The Atomic Future"
 GEN_1970_the_atomic_future_desc:0 "The atom will power our cities. Atoms for peace."
 GEN_1970_national_automotive_industry:0 "National Automotive Industry"
 GEN_1970_national_automotive_industry_desc:0 "Our own car factories will employ thousands."
 GEN_1970_combined_defence_industries:0 "Combined Defence Industries"
 GEN_1970_combined_defence_industries_desc:0 "Arms makers and shipyards are combined into one defence industry."
 GEN_1970_join_the_global_arms_trade:0 "Join the Global Arms Trade"
 GEN_1970_join_the_global_arms_trade_desc:0 "Wars around the world create demand. Our factories will supply it."
 GEN_1970_improved_energy_cycling:0 "Improved Energy Cycling"
 GEN_1970_improved_energy_cycling_desc:0 "Modern turbines get more power out of every ton of coal."
 GEN_1970_first_nuclear_power_station:0 "First Nuclear Power Station"
 GEN_1970_first_nuclear_power_station_desc:0 "Our first nuclear power station goes on line."
 GEN_1970_electronics_industry:0 "Electronics Industry"
 GEN_1970_electronics_industry_desc:0 "Transistors and computers are the industries of tomorrow."
 GEN_1970_weapon_conversion_packages:0 "Weapon Conversion Packages"
 GEN_1970_weapon_conversion_packages_desc:0 "Standard conversion kits allow factories to switch production quickly."
 GEN_1970_reinforced_electric_grid:0 "Reinforced Electric Grid"
 GEN_1970_reinforced_electric_grid_desc:0 "A robust grid keeps the lights on even under strain."
 GEN_1970_high_capacity_electric_grid:0 "High-Capacity Electric Grid"
 GEN_1970_high_capacity_electric_grid_desc:0 "High-voltage lines carry power across the country with fewer losses."
 GEN_1970_satisfy_the_middle_class:0 "Satisfy the Middle Class"
 GEN_1970_satisfy_the_middle_class_desc:0 "Shopkeepers, clerks and engineers want a share of the growing prosperity."
 GEN_1970_build_primary_schools:0 "Build Primary Schools"
 GEN_1970_build_primary_schools_desc:0 "Every child must learn to read and write."
 GEN_1970_strengthen_the_faith:0 "Strengthen the Faith"
 GEN_1970_strengthen_the_faith_desc:0 "Faith gives the people strength in uncertain times."
 GEN_1970_separation_of_church_and_state:0 "Separation of Church and State"
 GEN_1970_separation_of_church_and_state_desc:0 "The state belongs to all citizens, whatever their faith."
 GEN_1970_please_the_upper_class:0 "Please the Upper Class"
 GEN_1970_please_the_upper_class_desc:0 "The old families still hold much of the nation's wealth."
 GEN_1970_mass_literacy_campaign:0 "Mass Literacy Campaign"
 GEN_1970_mass_literacy_campaign_desc:0 "Students and teachers go to the villages to teach every adult to read."
 GEN_1970_access_to_education:0 "Access to Education"
 GEN_1970_access_to_education_desc:0 "Free schooling opens the door to advancement."
 GEN_1970_moral_order:0 "Moral Order"
 GEN_1970_moral_order_desc:0 "Traditional values are upheld."
 GEN_1970_cultural_liberalisation:0 "Cultural Liberalisation"
 GEN_1970_cultural_liberalisation_desc:0 "Art, music and science flourish in a freer climate."
 GEN_1970_assure_intellectual_freedoms:0 "Assure Intellectual Freedoms"
 GEN_1970_assure_intellectual_freedoms_desc:0 "Science flourishes where thought is free."
 GEN_1970_national_health_service:0 "National Health Service"
 GEN_1970_national_health_service_desc:0 "Free medical care for every citizen."
 GEN_1970_expand_the_universities:0 "Expand the Universities"
 GEN_1970_expand_the_universities_desc:0 "New universities will train the engineers and doctors of tomorrow."
 GEN_1970_space_research_institute:0 "Space Research Institute"
 GEN_1970_space_research_institute_desc:0 "A permanent research institute will bring mathematicians, engineers and communications specialists into one organisation. Its laboratories can investigate the instruments and launch systems on which a space programme depends. Ambition alone will not put a satellite in orbit; a dependable scientific establishment must come first."
 GEN_1970_industrial_research_task_forces:0 "Industrial Research Task Forces"
 GEN_1970_industrial_research_task_forces_desc:0 "Factory managers and university researchers too often work on different problems. Joint technical teams will take laboratory methods onto the shop floor, where they can be tested against actual materials, machinery and production schedules. Industry needs research that survives contact with an operating plant."
 GEN_1970_domestic_vehicle_research:0 "Domestic Vehicle Research"
 GEN_1970_domestic_vehicle_research_desc:0 "Imported vehicles arrive with answers to someone else's requirements. A domestic research team will examine the protection, mobility and maintenance needs of our own forces and prepare designs around them. Establishing that engineering knowledge is the first step towards a credible armoured-vehicle industry."
 GEN_1970_domestic_naval_research:0 "Domestic Naval Research"
 GEN_1970_domestic_naval_research_desc:0 "The fleet requires engineers who understand both the sea and the workshops ashore. A naval research programme will examine hulls, propulsion and weapons as parts of a single vessel. Its purpose is to develop designs that our yards and crews can realistically build, maintain and operate."
 GEN_1970_domestic_aircraft_research:0 "Domestic Aircraft Research"
 GEN_1970_domestic_aircraft_research_desc:0 "An aircraft programme needs more than a promising airframe. Engines, instruments and weapons must function together, and test pilots must be able to explain a design's shortcomings to its engineers. Bringing this work into a domestic research organisation will give our air service a more informed voice in future development."
 GEN_1970_atomic_research_programme:0 "Atomic Research Programme"
 GEN_1970_atomic_research_programme_desc:0 "Atomic research requires specialised laboratories, trained physicists and a government prepared to sustain their work beyond a single experiment. Establishing that foundation will let us investigate the technologies of the nuclear age. Research is a necessary beginning; it is not a substitute for the facilities and further development that follow."
 GEN_1970_military_emergency:0 "Military Emergency"
 GEN_1970_military_emergency_desc:0 "A worsening security situation has exposed weaknesses that routine peacetime administration could leave unanswered. Army and air-service staffs will review readiness, compare contingency plans and pass practical lessons to their commanders. The immediate task is to make the forces already available more capable of responding together."
 GEN_1970_army_reform:0 "Army Reform"
 GEN_1970_army_reform_desc:0 "The army's establishment, training commitments and budget must describe the same force. A general reform will give commanders the resources and authority to address weaknesses uncovered in service. It also obliges the government to support its military ambitions with a larger spending commitment."
 GEN_1970_mass_conscript_army:0 "Mass Conscript Army"
 GEN_1970_mass_conscript_army_desc:0 "A broad conscription system can keep formations manned without paying every soldier as a career professional. Training depots must therefore prepare successive intakes quickly and consistently. This course builds an army around the ability to mobilise large numbers, making the organisation of national service a central military responsibility."
 GEN_1970_professional_volunteer_force:0 "Professional Volunteer Force"
 GEN_1970_professional_volunteer_force_desc:0 "Long-serving volunteers allow units to retain trained personnel and develop habits of coordinated action. Recruiting and keeping those soldiers will cost more than relying on short-term conscripts, while drawing on a smaller manpower base. The government will accept that expense in exchange for a more cohesive and experienced standing force."
 GEN_1970_territorial_defence_force:0 "Territorial Defence Force"
 GEN_1970_territorial_defence_force_desc:0 "Local defence formations will prepare to fight on ground their members know. Their organisation must connect mobilisation, stores and defensive planning rather than depend on an improvised response after an invasion begins. This is a commitment to resisting an enemy at home, with the population contributing directly to national defence."
 GEN_1970_land_doctrine_innovations:0 "Land Doctrine Innovations"
 GEN_1970_land_doctrine_innovations_desc:0 "Staff officers will review how our formations move, concentrate fire and communicate under pressure. The aim is to turn practical lessons into a common method that commanders can understand and exercise. Doctrine must guide the employment of the army we possess, rather than remain a collection of borrowed manuals."
 GEN_1970_large_scale_manoeuvres:0 "Large-Scale Manoeuvres"
 GEN_1970_large_scale_manoeuvres_desc:0 "A divisional exercise reveals failures that a headquarters map cannot. Supply columns miss their timings, radio nets become congested and commanders must make decisions with incomplete reports. Large manoeuvres will expose these weaknesses before an enemy does and give the army a shared body of practical experience."
 GEN_1970_military_education_reform:0 "Military Education Reform"
 GEN_1970_military_education_reform_desc:0 "Promotion and seniority alone cannot prepare an officer to command modern formations. Military schools will place greater emphasis on staff work, combined operations and the critical study of recent exercises. Serving commanders will take part in this reform so that changes in the classroom also reach the field army."
 GEN_1970_arms_procurement_policy:0 "Arms Procurement Policy"
 GEN_1970_arms_procurement_policy_desc:0 "The armed services need a clear answer about where their next generation of equipment will come from. Overseas purchases and domestic manufacture make different demands on the treasury, industry and relations with suppliers. A settled procurement policy will give the government a basis for choosing between those commitments."
 GEN_1970_infantry_equipment_development:0 "Infantry Equipment Development"
 GEN_1970_infantry_equipment_development_desc:0 "Small arms are issued in numbers that make reliability and ease of manufacture as important as an impressive prototype. Infantry trials will bring soldiers and manufacturers together to improve the weapons they handle every day. Production preparations must accompany research if new designs are to become practical service equipment."
 GEN_1970_land_doctrine_expertise:0 "Land Doctrine Expertise"
 GEN_1970_land_doctrine_expertise_desc:0 "The first reform produces instructions; repeated application produces judgement. Experienced officers will examine the use of our weapons and formations together, identifying which methods deserve to become established practice. The resulting expertise will help the army turn its chosen doctrine into dependable performance."
 GEN_1970_artillery_experiments:0 "Artillery Experiments"
 GEN_1970_artillery_experiments_desc:0 "An artillery battery is useful only when observers, gun crews and ammunition services can work to the same plan. Trials of towed artillery will examine fire control, handling and the practical demands of keeping guns in action. Better designs must answer the needs of the crews who will serve them."
 GEN_1970_buy_abroad:0 "Buy Abroad"
 GEN_1970_buy_abroad_desc:0 "Established foreign manufacturers offer a route to equipment that our own industry cannot yet supply. A concentrated import effort will improve the terms under which the armed forces buy abroad. It commits procurement to external suppliers for this period, rather than immediately creating a domestic manufacturing base."
 GEN_1970_build_it_ourselves:0 "Build It Ourselves"
 GEN_1970_build_it_ourselves_desc:0 "Domestic arms manufacture requires workshops, skilled workers and designs that can be produced consistently. Investment in a military factory will give the research programme somewhere to put its results into practice. The initial expense buys an industrial capability that overseas deliveries cannot establish on their own."
 GEN_1970_uniform_improvements:0 "Uniform Improvements"
 GEN_1970_uniform_improvements_desc:0 "Clothing and personal protection must suit the conditions in which our soldiers actually serve. Trials of camouflage and body armour will compare protection with weight, wear and freedom of movement. Equipment that survives a demonstration but exhausts its wearer on a march is no improvement at all."
 GEN_1970_utility_vehicles:0 "Utility Vehicles"
 GEN_1970_utility_vehicles_desc:0 "An army's mobility rests on ordinary vehicles as much as on its fighting machines. Research into utility vehicles will address the movement of men, stores and specialist teams over the routes available to them. Maintenance access and dependable service matter as much as performance on a test track."
 GEN_1970_self_propelled_artillery:0 "Self-Propelled Artillery"
 GEN_1970_self_propelled_artillery_desc:0 "Fast-moving formations cannot always wait for guns to be unlimbered, brought into action and towed forward again. A programme for self-propelled artillery will investigate how to keep supporting fire close to the advance. Mobility, crew protection and ammunition handling must be developed as a complete system."
 GEN_1970_develop_armour_prototypes:0 "Develop Armour Prototypes"
 GEN_1970_develop_armour_prototypes_desc:0 "Before the army commits itself to a new armoured vehicle, engineers must prove how its protection, armament and running gear work together. Prototype trials will give designers evidence that drawings alone cannot supply. The programme will establish a stronger technical foundation for subsequent armoured development."
 GEN_1970_special_forces_training:0 "Special Forces Training"
 GEN_1970_special_forces_training_desc:0 "Special operations depend on preparation across service boundaries. Selected personnel will train for missions that require unusual equipment, careful planning and cooperation between ground, sea and air elements. Selected units will rehearse their tasks together until their commanders can rely on the preparation of the whole force."
 GEN_1970_self_propelled_anti_air:0 "Self-Propelled Anti-Air"
 GEN_1970_self_propelled_anti_air_desc:0 "The protection of advancing columns cannot depend entirely on fixed batteries far behind them. Research into mobile air-defence vehicles will examine weapons that can accompany the formations they defend. Crews need systems that combine a useful field of fire with the mobility and support arrangements of the field army."
 GEN_1970_anti_tank_guided_missiles:0 "Anti-Tank Guided Missiles"
 GEN_1970_anti_tank_guided_missiles_desc:0 "Guided anti-tank weapons offer infantry and specialist teams another means of engaging armour. Their value depends on more than the missile itself: sights, launchers and the demands placed on the operator must be considered together. Development trials will establish equipment that our troops can realistically employ."
 GEN_1970_helicopter_mobility:0 "Helicopter Mobility"
 GEN_1970_helicopter_mobility_desc:0 "Transport helicopters can connect troops with positions that roads do not readily serve. Research must address the aircraft, loading arrangements and support requirements that make such movement dependable. The army will investigate a practical transport capability, recognising that carrying men into a position is only the beginning of sustaining them there."
 GEN_1970_rangers_and_light_infantry:0 "Rangers and Light Infantry"
 GEN_1970_rangers_and_light_infantry_desc:0 "Some missions reward disciplined movement and specialist fieldcraft more than heavy equipment. Ranger and light-infantry training will prepare selected troops to operate effectively where ordinary formations struggle to concentrate. Their advantage must come from preparation and a clear tactical purpose, not from being treated as expendable infantry."
 GEN_1970_specialised_mechanised_battalions:0 "Specialised Mechanised Battalions"
 GEN_1970_specialised_mechanised_battalions_desc:0 "Mechanised infantry must exploit its vehicles without becoming dependent on remaining inside them. Specialist battalion training will concentrate on the cooperation of mounted movement, dismounted assault and supporting fire. These units will develop the skills needed to turn armoured mobility into effective offensive action."
 GEN_1970_main_battle_tank_programme:0 "Main Battle Tank Programme"
 GEN_1970_main_battle_tank_programme_desc:0 "A main battle tank will influence procurement, maintenance and training for many years. A funded research programme will examine designs that can meet our army's requirements without ignoring what industry can support. Prototype trials and industrial preparation will give procurement officers a firmer basis for choosing the next service tank."
 GEN_1970_air_cavalry_doctrine:0 "Air Cavalry Doctrine"
 GEN_1970_air_cavalry_doctrine_desc:0 "Attack helicopters require more than new aircraft. Pilots, forward controllers and ground formations must learn to operate as a single force. Dedicated training and development programmes will turn scattered experiments into a dependable battlefield capability, while placing new demands on maintenance and technical education."
 GEN_1970_air_force_reform:0 "Air Force Reform"
 GEN_1970_air_force_reform_desc:0 "Modern aircraft will achieve little if the air service cannot organise their employment. A reform of training, staff work and technical development will bring operational requirements into closer contact with research. The aim is an air force capable of learning from experience and directing the next stage of its development."
 GEN_1970_jet_fighter_programme:0 "Jet Fighter Programme"
 GEN_1970_jet_fighter_programme_desc:0 "Fighter development must reconcile speed, endurance, weapons and the ability to bring an aircraft home after a demanding sortie. Our engineers will investigate a new generation of combat aircraft around the missions the air force expects to fly. A coherent development effort offers more than isolated purchases of promising components."
 GEN_1970_air_doctrine_innovations:0 "Air Doctrine Innovations"
 GEN_1970_air_doctrine_innovations_desc:0 "Air operations need an agreed method for choosing targets, assigning aircraft and coordinating sorties. Staff exercises and operational reviews will turn competing service ideas into a doctrine that can be practised. The aircraft available to us must shape that method, rather than an imagined fleet we cannot yet field."
 GEN_1970_capital_defence_scheme:0 "Capital Defence Scheme"
 GEN_1970_capital_defence_scheme_desc:0 "The seat of government and its surrounding infrastructure present an obvious target for air attack. A capital-defence scheme will strengthen the available ground defences and guide the development of the weapons needed to protect them. Where the capital cannot accommodate another installation, the wider defensive network must carry the investment."
 GEN_1970_strategic_bomber_force:0 "Strategic Bomber Force"
 GEN_1970_strategic_bomber_force_desc:0 "Long-range bombing demands aircraft designed around a difficult combination of range, payload and survival. A funded heavy-aircraft programme will examine how such a force could serve our strategic requirements. This is a major development commitment whose eventual value depends on the support and planning built around the aircraft."
 GEN_1970_tactical_air_power:0 "Tactical Air Power"
 GEN_1970_tactical_air_power_desc:0 "Battlefield aviation must answer the ground commander's needs without losing the coordination of the air service. Research into light aircraft and air-to-ground weapons will support that relationship. The task is to develop machines and armament suited to practical attacks on the targets our forces are likely to face."
 GEN_1970_countermeasures_against_aircraft:0 "Countermeasures Against Aircraft"
 GEN_1970_countermeasures_against_aircraft_desc:0 "The threat from hostile aircraft requires an answer at more than one level. Development of anti-aircraft weapons will improve the technical foundation of our defences, while suitable installations can extend their reach. The programme will concentrate on equipment that fits the defensive systems we are able to operate."
 GEN_1970_surface_to_air_missile_belt:0 "Surface-to-Air Missile Belt"
 GEN_1970_surface_to_air_missile_belt_desc:0 "Isolated batteries leave gaps that an attacker can exploit. A wider air-defence belt will combine additional installations with the development of missile equipment for their crews. Its purpose is to protect important areas through a network of positions, rather than place all confidence in a single defended point."
 GEN_1970_air_base_expansion:0 "Air Base Expansion"
 GEN_1970_air_base_expansion_desc:0 "Flying units need more than a strip of usable ground. An air-base expansion will provide additional capacity for the aircraft and support personnel that must operate from it. The location must suit our territory and the practical demands of keeping a military airfield in service."
 GEN_1970_air_doctrine_expertise:0 "Air Doctrine Expertise"
 GEN_1970_air_doctrine_expertise_desc:0 "The air service must retain the lessons gained by its most experienced crews and staffs. Reviews of exercises and operations will turn those lessons into methods that new formations can also apply. A doctrine becomes useful when commanders can exercise judgement within it, rather than merely repeat its terminology."
 GEN_1970_integrated_air_defence:0 "Integrated Air Defence"
 GEN_1970_integrated_air_defence_desc:0 "Warning and interception must form part of the same defensive plan. Radar coverage will help identify an approaching threat, while additional ground defences give the network a means to answer it. Investing in both elements will establish a more coherent structure for the protection of our airspace."
 GEN_1970_air_base_expansion_two:0 "Air Base Expansion II"
 GEN_1970_air_base_expansion_two_desc:0 "The next stage of air-base development will be accompanied by a sustained commitment to the aircraft sector. Additional operating capacity must be matched by investment in the organisation that equips it. This programme joins physical expansion to a longer period of support for the air service's material needs."
 GEN_1970_airborne_early_warning:0 "Airborne Early Warning"
 GEN_1970_airborne_early_warning_desc:0 "Ground stations cannot provide the best warning in every direction and at every height. Research into airborne early-warning aircraft will investigate how a mobile observation platform can extend the information available to commanders. The equipment must serve an organised reporting system if its additional reach is to be useful."
 GEN_1970_paratrooper_corps:0 "Paratrooper Corps"
 GEN_1970_paratrooper_corps_desc:0 "An airborne formation must remain organised after the disruption of a landing. A dedicated paratrooper corps will establish the training and service cooperation needed to recover cohesion and act promptly on the ground. Its value depends on disciplined preparation, suitable missions and a clear understanding of the risks involved."
 GEN_1970_naval_reform:0 "Naval Reform"
 GEN_1970_naval_reform_desc:0 "The navy's ships, shore establishment and operational doctrine must develop together. A general reform will use fleet experience to guide staff work and the technical study of future vessels. Maritime industry will have a part in the programme, because a fleet cannot be sustained by decisions made at sea alone."
 GEN_1970_merchant_marine:0 "Merchant Marine"
 GEN_1970_merchant_marine_desc:0 "Commercial shipping depends on ships that can be built and replaced at an affordable cost. A merchant-marine programme will encourage more economical convoy construction and give the maritime sector a clearer industrial objective. Keeping civilian sea transport viable is a practical foundation for the nation's wider maritime interests."
 GEN_1970_naval_bases:0 "Naval Bases"
 GEN_1970_naval_bases_desc:0 "A fleet's operating area is constrained by the ports that can support it. Investment in naval-base capacity will give ships a stronger foothold along our coast. Stores, workshops and shore services will have to support the additional berthing capacity throughout its service."
 GEN_1970_naval_doctrine_innovations:0 "Naval Doctrine Innovations"
 GEN_1970_naval_doctrine_innovations_desc:0 "The fleet must decide how its ships will support one another before they meet an enemy. Exercises and staff studies will examine formations, command arrangements and the employment of available weapons. Those lessons will provide a stronger basis for the navy's chosen operational doctrine."
 GEN_1970_blue_water_navy:0 "Blue-Water Navy"
 GEN_1970_blue_water_navy_desc:0 "Operations beyond the immediate coast place demanding requirements on escorts and larger surface combatants. Research into destroyers and cruisers will investigate the vessels needed for that ambition. The aim is to develop a credible ocean-going fleet, beginning with designs that can undertake useful missions together."
 GEN_1970_coastal_defence_fleet:0 "Coastal Defence Fleet"
 GEN_1970_coastal_defence_fleet_desc:0 "Our first maritime task may be to make nearby waters difficult for an enemy to use. Development of smaller combatants and anti-ship missiles will support a fleet organised around that purpose. A coastal strategy allows limited resources to be concentrated on the approaches that matter most to national defence."
 GEN_1970_dockyards:0 "Dockyards"
 GEN_1970_dockyards_desc:0 "Naval plans cannot advance faster than the yards that build their ships. An expansion of dockyard capacity will strengthen the industrial foundation of the fleet, with the scale of construction matched to the economy. Maritime employers will gain orders, while the state accepts the expense of developing the facilities."
 GEN_1970_submarine_arm:0 "Submarine Arm"
 GEN_1970_submarine_arm_desc:0 "A submarine service requires specialised engineering and a careful understanding of the missions assigned to it. Research will examine boats that can meet those requirements within the fleet's means. Building the necessary technical knowledge is more valuable than ordering a prestigious design without knowing how it will be supported."
 GEN_1970_naval_doctrine_expertise:0 "Naval Doctrine Expertise"
 GEN_1970_naval_doctrine_expertise_desc:0 "Fleet experience should outlast the appointments of individual commanders. The naval staff will collect lessons from exercises and service, testing which methods can be relied upon across different formations. This body of expertise will help officers employ their chosen doctrine with greater confidence and consistency."
 GEN_1970_aircraft_carriers:0 "Aircraft Carriers"
 GEN_1970_aircraft_carriers_desc:0 "A carrier programme begins with difficult questions about the ship, its aircraft and the work of operating them at sea. Research into carrier design will establish the technical knowledge needed to answer those questions. Naval architects, aviators and engineers will have to agree on a design that the fleet can operate and its shore establishment can support."
 GEN_1970_helicopter_carriers:0 "Helicopter Carriers"
 GEN_1970_helicopter_carriers_desc:0 "A ship designed to operate helicopters offers the fleet a different set of possibilities from a conventional surface combatant. Development work will examine its flight arrangements, support spaces and intended naval role. The design must fit a useful mission before the government commits itself to building it."
 GEN_1970_missile_boat_squadrons:0 "Missile Boat Squadrons"
 GEN_1970_missile_boat_squadrons_desc:0 "Small missile-armed combatants need suitable weapons and an industry able to produce the boats around them. This programme will support both technical development and a period of focused yard activity. The objective is a practical squadron concept whose vessels can operate together in the waters assigned to them."
 GEN_1970_vessel_production:0 "Vessel Production"
 GEN_1970_vessel_production_desc:0 "The shipbuilding industry will receive a sustained production commitment rather than a succession of disconnected orders. Better coordination of yard schedules and suppliers will support that effort over the coming years. Stable orders will give suppliers and yard managers the confidence to organise work beyond the next individual contract."
 GEN_1970_nuclear_submarines:0 "Nuclear Submarines"
 GEN_1970_nuclear_submarines_desc:0 "A nuclear-submarine programme demands specialised research and an operational purpose that justifies the effort. Naval engineers will investigate the boats and supporting systems required for extended submerged operations. The studies must also inform the doctrine under which these vessels would eventually serve."
 GEN_1970_large_ship_drydocks:0 "Large Ship Drydocks"
 GEN_1970_large_ship_drydocks_desc:0 "Large warships require facilities able to accommodate their construction and heavy work. A further dockyard investment will strengthen that part of the maritime establishment. It gives future building plans a more credible industrial basis, while making a tangible commitment of public resources to the fleet."
 GEN_1970_sea_based_deterrent:0 "Sea-Based Deterrent"
 GEN_1970_sea_based_deterrent_desc:0 "A deterrent carried at sea depends on a boat, missile system and command arrangement that can function as one. Research into missile submarines will address the vessel component of that undertaking. The programme develops a possible means of delivery; the wider strategic capability still requires its own preparation."
 GEN_1970_establish_a_marine_corps:0 "Establish a Marine Corps"
 GEN_1970_establish_a_marine_corps_desc:0 "Landing troops from the sea calls for an organisation that trains for the operation as a whole. A marine corps will connect the assault ashore with the naval planning needed to put it there. Its formation will give amphibious operations a permanent institutional home within the armed forces."
 GEN_1970_improved_repair_facilities:0 "Improved Repair Facilities"
 GEN_1970_improved_repair_facilities_desc:0 "Damage need not remove a useful ship from service longer than its repair work requires. A focused programme for repair facilities will improve the ability to return vessels to the fleet. Workshops, scheduling and specialised support deserve attention alongside the more conspicuous business of constructing new warships."
 GEN_1970_technocratic_cabinet:0 "Cabinet of Technocrats"
 GEN_1970_technocratic_cabinet_desc:0 "Experts run the ministries. They deliver results but have no political base of their own."
 GEN_1970_coalition_talks:0 "Coalition Negotiations"
 GEN_1970_coalition_talks_desc:0 "Every decision must be negotiated between the coalition partners."
 GEN_1970_civil_service:0 "Professional Civil Service"
 GEN_1970_civil_service_desc:0 "A trained, permanent civil service runs the state efficiently."
 GEN_1970_counter_insurgency:0 "Counter-Insurgency Doctrine"
 GEN_1970_counter_insurgency_desc:0 "Our forces know how to fight guerrillas."
 GEN_1970_western_capital:0 "Open to Western Capital"
 GEN_1970_western_capital_desc:0 "Western capital flows in, and with it Western influence and the swings of the world market."
 GEN_1970_soviet_advisers:0 "Soviet Military Advisers"
 GEN_1970_soviet_advisers_desc:0 "Soviet officers train our army and report to Moscow."
 GEN_1970_liberalisation:0 "Market Liberalisation"
 GEN_1970_liberalisation_desc:0 "Free prices and private enterprise drive productivity."
 GEN_1970_mixed_economy:0 "The Mixed Economy"
 GEN_1970_mixed_economy_desc:0 "State and market work side by side."
 GEN_1970_central_planning_2:0 "Five-Year Plans"
 GEN_1970_central_planning_2_desc:0 "The state planning committee directs the whole economy."
 GEN_1970_tax_code:0 "Simplified Tax Code"
 GEN_1970_tax_code_desc:0 "Fewer exemptions, broader base, higher revenue."
 GEN_1970_export_zones:0 "Export Processing Zones"
 GEN_1970_export_zones_desc:0 "Our export industry depends on the world market."
 GEN_1970_social_spending_expansions:0 "Pension Fund Investments"
 GEN_1970_social_spending_expansions_desc:0 "Pension funds finance social programmes efficiently."
 GEN_1970_capital_flight:0 "Capital Flight"
 GEN_1970_capital_flight_desc:0 "Foreign investors fear further nationalisations."
 GEN_1970_collectivisation:0 "Collective Farms"
 GEN_1970_collectivisation_desc:0 "Collective farms free labour for industry, but the harvests suffer."
 GEN_1970_fuel_structure_building_efforts2:0 "Strategic Fuel Reserves"
 GEN_1970_fuel_structure_building_efforts2_desc:0 "Large reserves protect us from embargoes."
 GEN_1970_autarkic_measures:0 "Autarkic Measures"
 GEN_1970_autarkic_measures_desc:0 "High tariffs protect our industries but deter foreign investors."
 GEN_1970_world_market_exposure:0 "World Market Integration"
 GEN_1970_world_market_exposure_desc:0 "Our economy now moves with the world market."
 GEN_1970_atoms_for_peace:0 "Atoms for Peace"
 GEN_1970_atoms_for_peace_desc:0 "The nuclear programme serves the power grid."
 GEN_1970_great_dams:0 "Great Dams"
 GEN_1970_great_dams_desc:0 "New dams feed the grid."
 GEN_1970_arms_trade:0 "Global Arms Trade"
 GEN_1970_arms_trade_desc:0 "Our arms industry profits from the world's conflicts."
 GEN_1970_conversion_packages:0 "Weapon Conversion Packages"
 GEN_1970_conversion_packages_desc:0 "Standard conversion kits speed up production changes."
 GEN_1970_reinforced_grid:0 "Reinforced Electric Grid"
 GEN_1970_reinforced_grid_desc:0 "The grid can carry more power."
 GEN_1970_high_capacity_grid:0 "High-Capacity Electric Grid"
 GEN_1970_high_capacity_grid_desc:0 "Less power is lost in transmission."
 GEN_1970_public_health:0 "Public Health Service"
 GEN_1970_public_health_desc:0 "Free medical care raises life expectancy."
 GEN_1970_conscript_army:0 "Mass Conscript Army"
 GEN_1970_conscript_army_desc:0 "Every young man serves."
 GEN_1970_professional_army:0 "Professional Volunteer Force"
 GEN_1970_professional_army_desc:0 "Well-trained, well-paid professionals."
 GEN_1970_territorial_defence:0 "Territorial Defence Force"
 GEN_1970_territorial_defence_desc:0 "Every village defends itself."
 GEN_1970_light_infantry_special_forces:0 "Rangers and Light Infantry"
 GEN_1970_light_infantry_special_forces_desc:0 "Elite light infantry for difficult terrain."
 GEN_1970_mechanised_special_forces:0 "Specialised Mechanised Battalions"
 GEN_1970_mechanised_special_forces_desc:0 "Mechanised units for fast operations."
 GEN_1970_missile_boats:0 "Missile Boat Squadrons"
 GEN_1970_missile_boats_desc:0 "Our yards build small missile boats in series."
 GEN_1970_marine_corps:0 "Marine Corps"
 GEN_1970_marine_corps_desc:0 "Marines can land on any coast."
 GEN_1970_repair_facilities:0 "Improved Repair Facilities"
 GEN_1970_repair_facilities_desc:0 "Damaged ships return to the fleet faster."
 GEN_1970_free_press:0 "A Free Press"
 GEN_1970_free_press_desc:0 "Open debate spurs new ideas."
 GEN_1970_western_majority:0 "The Democratic Majority"
 GEN_1970_western_majority_desc:0 "The democratic order has a broad majority."
 GEN_1970_workers_press:0 "The Workers' Press"
 GEN_1970_workers_press_desc:0 "Our papers speak for the workers of the world."
 GEN_1970_emerging_majority:0 "The Toiling Masses Awaken"
 GEN_1970_emerging_majority_desc:0 "The masses stand behind the socialist camp."
 GEN_1970_salafist_majority:0 "The Faithful Majority"
 GEN_1970_salafist_majority_desc:0 "The faithful are the majority."
 GEN_1970_spirit_of_bandung:0 "The Spirit of Bandung"
 GEN_1970_spirit_of_bandung_desc:0 "Asia and Africa will not be pawns."
 GEN_1970_non_aligned_majority:0 "The Nonaligned Majority"
 GEN_1970_non_aligned_majority_desc:0 "Most of our people want no part in the Cold War."
 GEN_1970_nationalist_majority:0 "The Nation Rises"
 GEN_1970_nationalist_majority_desc:0 "The nation stands united."
 GEN_1970_export_the_revolution:0 "Export the Revolution"
 GEN_1970_export_the_revolution_desc:0 "The revolution reaches beyond our borders."
 GEN_1970_pan_islamic_solidarity:0 "Pan-Islamic Solidarity"
 GEN_1970_pan_islamic_solidarity_desc:0 "The Islamic world speaks with one voice."
 GEN_1970_balancing_act:0 "The Balancing Act"
 GEN_1970_balancing_act_desc:0 "We take help from both blocs and belong to neither."
