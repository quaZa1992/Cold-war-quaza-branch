 COLDWAR_YUG_POL.1.t:0 "A Federal Government"
 COLDWAR_YUG_POL.1.d:0 "The chamber must decide which registered organisation can form a federal government. A representative agreement is needed before a cabinet takes office."
 COLDWAR_YUG_POL.1.socialist:0 "Invite the democratic socialists."
 COLDWAR_YUG_POL.1.reform:0 "Invite the Alliance of Reform Forces."
 COLDWAR_YUG_POL.defer:0 "Continue negotiations."
 COLDWAR_YUG_POL.2.t:0 "The Emergency Request"
 COLDWAR_YUG_POL.2.d:0 "The defence leadership requests emergency authority. The civilian institutions must decide whether to grant the mandate."
 COLDWAR_YUG_POL.3.t:0 "Civilian Authority"
 COLDWAR_YUG_POL.3.d:0 "Civilian representatives are asked to take responsibility for a federal government. The transition requires their agreement."
 COLDWAR_YUG_POL.4.t:0 "A Federal Election Law"
 COLDWAR_YUG_POL.4.d:0 "The federal chamber must decide whether to enact an electoral law for the common institutions."
 COLDWAR_YUG_POL.4.enact:0 "Enact the electoral law."
 COLDWAR_YUG_POL.5.t:0 "A Challenge to the Serbian Reformers"
 COLDWAR_YUG_POL.5.d:0 "The federal reform mandate associated with Marko Nikezic and Latinka Perovic faces a challenge within the League. The federal leadership has ninety days to decide whether to protect their programme."
 COLDWAR_YUG_POL.5.a:0 "Bring the question before the League."
 COLDWAR_YUG_POL.accept:0 "Accept the proposal."
 COLDWAR_YUG_POL.refuse:0 "Refuse the proposal."
 COLDWAR_YUG_1970_reform_party:0 "Alliance of Reform Forces of Yugoslavia"
 COLDWAR_YUG_1970_reform_party_desc:0 "The Alliance of Reform Forces seeks a representative federal government, a common market and economic reform. Its programme depends on cooperation across the republics."
 COLDWAR_YUG_1970_socialist_party:0 "Democratic Socialist Organisation"
 COLDWAR_YUG_1970_socialist_party_desc:0 "Democratic socialists advocate political pluralism, independent representation and accountable social ownership. Their organisation seeks a federal mandate through lawful institutions."
