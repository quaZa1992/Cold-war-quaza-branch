# IMPERIA CW — Cold War: DDR 1970 parties — English localisation.
 # COLDWAR | German Democratic Republic 1970: party names. Generated - edit the generator (Claude outputs/COLDWAR_DDR_generator).
 COLDWAR_DDR_1970_party_0:0 "£generic_Western_Autocracy_small (KoKo) - Commercial Coordination"
 COLDWAR_DDR_1970_party_0_desc:0 "(Hard-Currency State Capitalism) - Commercial Coordination (German: Kommerzielle Koordinierung, KoKo)\n\nFounded in 1966 inside the Ministry of Foreign Trade and shielded by the Ministry for State Security, Commercial Coordination is the hidden hard-currency empire of Alexander Schalck-Golodkowski. Its front companies sell art, arms, blood plasma and even political prisoners to the West, and quietly buy the Western goods the planned economy cannot produce.\n\nIts admirers want to run the republic like a firm that sells to the West: credits from Bonn, deals with Western banks, joint ventures and a pragmatic opening that keeps the party in power while the hard Deutschmark keeps the shops stocked. Schalck-Golodkowski would govern as the GDR's chief dealmaker."
 COLDWAR_DDR_1970_party_1:0 "£generic_conservatism_small (CDU) - Christian Democratic Union of Germany"
 COLDWAR_DDR_1970_party_1_desc:0 "(Bloc Christian Democracy) - Christian Democratic Union of Germany (German: Christlich-Demokratische Union Deutschlands, CDU)\n\nFounded in the Soviet zone in 1945 and subordinated to the National Front since 1949, the East German CDU is the bloc party of believing Christians. Under its chairman Gerald Götting it loyally votes with the SED, sits in the Volkskammer and supplies ministers and deputy chairmen of the State Council.\n\nBehind the official formula of 'Christians who accept socialism' lie pastors' families, rural parishes and members who only wait. An emancipated CDU could become the voice of the churches, of conscientious objectors and of a cautious opening towards the Christian Democrats in Bonn."
 COLDWAR_DDR_1970_party_2:0 "£generic_liberalism_small (LDPD) - Liberal Democratic Party of Germany"
 COLDWAR_DDR_1970_party_2_desc:0 "(Bloc Liberalism) - Liberal Democratic Party of Germany (German: Liberal-Demokratische Partei Deutschlands, LDPD)\n\nThe Liberal Democratic Party of Germany was founded in 1945 as an independent liberal party and tamed into a bloc party of the National Front. Today it organises craftsmen, shopkeepers, the owners of semi-state firms and the remains of the old middle class.\n\nIts chairman Manfred Gerlach is outwardly loyal, but the party remembers 1945, when it stood for free elections and private property. Given room to breathe, the LDPD could defend the private sector, legal security and a more liberal reading of socialist legality."
 COLDWAR_DDR_1970_party_3:0 "£generic_socialism_small Social Democratic Networks"
 COLDWAR_DDR_1970_party_3_desc:0 "(Social Democracy) - Social Democratic Networks (German: Sozialdemokratische Netzwerke)\n\nThe Social Democrats forced into the SED in April 1946 never quite disappeared. Their traditions survive in the factories, in workers' families of Saxony and Thuringia, among purged former functionaries and in every household that listens to the SPD on Western radio.\n\nThe figurehead of this current is Friedrich Ebert Jr., son of the first president of the Weimar Republic, former mayor of East Berlin and himself a former Social Democrat in the Politburo. A revived social democracy would demand trade-union autonomy, parliamentary rights and a rapprochement with Willy Brandt's Ostpolitik."
 COLDWAR_DDR_1970_party_4:0 "£MDCW_HP_DDR_SOCIALIST_UNITY_PARTY_OF_GERMANY_SED (SED) - Socialist Unity Party of Germany"
 COLDWAR_DDR_1970_party_4_desc:0 "(Marxism-Leninism) - Socialist Unity Party of Germany (German: Sozialistische Einheitspartei Deutschlands, SED)\n\nThe Socialist Unity Party of Germany, born of the forced merger of the KPD and SPD in 1946, has been the leading party of the working class and of the state since 1949. It controls the government, the mass organisations, the economy and, through the Ministry for State Security, the population.\n\nIn 1970 the aging Walter Ulbricht still leads the party with his New Economic System and his ambition to 'overtake without catching up'. Moscow and Erich Honecker are growing impatient with his independent line towards Bonn, and a change at the top is approaching."
 COLDWAR_DDR_1970_party_5:0 "£generic_anarchist_communism_small Democratic Communism"
 COLDWAR_DDR_1970_party_5_desc:0 "(Democratic Communism) - Democratic Communism (German: Demokratischer Kommunismus)\n\nRobert Havemann, chemist, anti-fascist resistance fighter and once a model party scientist, was expelled from the SED in 1964 after his Humboldt University lectures called for intellectual freedom. Under house surveillance in Grünheide, he remains the most prominent heretic of East German communism.\n\nHis followers among students, scientists and writers such as Wolf Biermann want socialism with free speech, free elections, an independent press and no Wall. They draw inspiration from the Prague Spring and would turn the SED's monopoly into an open contest of socialist ideas."
 COLDWAR_DDR_1970_party_6:0 "£generic_Conservative_small Die Thälmann-Garde"
 COLDWAR_DDR_1970_party_6_desc:0 "(Neo-Stalinism) - The Thälmann Guard (German: Die Thälmann-Garde)\n\nThe Thälmann Guard are the hardliners of the old KPD tradition, veterans of the street battles of the Weimar years, the Spanish Civil War and the Nazi prisons. For them every reform is already one too many, and the New Economic System smells of revisionism.\n\nTheir spokesman is Alfred Neumann, Politburo member, Spanish Civil War veteran and a guardian of discipline in the party apparatus. In power, they would centralise planning again, purge the managers and technocrats, and bind the republic ever more tightly to the Soviet Union."
 COLDWAR_DDR_1970_party_7:0 "£generic_Autocracy_small Schild und Schwert der Partei"
 COLDWAR_DDR_1970_party_7_desc:0 "(State Security Authoritarianism) - Shield and Sword of the Party (German: Schild und Schwert der Partei)\n\nThe Ministry for State Security, founded in 1950, sees itself as the shield and sword of the party, and sometimes as the party itself. Its officers and a growing army of unofficial collaborators watch the churches, the factories, the universities and the border.\n\nMinister Erich Mielke, in office since 1957, commands this apparatus with paranoid thoroughness. A Stasi-led government would place surveillance above ideology, treating every citizen as a security risk and every crisis as a counter-revolutionary plot to be crushed before it begins."
 COLDWAR_DDR_1970_party_13:0 "£generic_Neutral_Autocracy_small (SPK) - State Planning Commission"
 COLDWAR_DDR_1970_party_13_desc:0 "(Socialist Technocracy) - State Planning Commission (German: Staatliche Plankommission, SPK)\n\nThe State Planning Commission is the brain of the East German command economy, drafting the five-year plans and balancing the material supply of every Kombinat. Its chairman since 1965, Gerhard Schürer, leads economists who know how bad the figures really are.\n\nThe planners stand for neither bloc nor dogma but for numbers: realistic targets, investment in industry instead of consumption on credit, and honest statistics. In power, they would govern as non-aligned technocrats, putting the solvency of the republic ahead of propaganda promises."
 COLDWAR_DDR_1970_party_14:0 "£generic_Neutral_conservatism_small Kirche im Sozialismus"
 COLDWAR_DDR_1970_party_14_desc:0 "(Protestant Civic Conservatism) - Church in Socialism (German: Kirche im Sozialismus)\n\nIn 1969 the Protestant churches of East Germany broke away from the all-German EKD and founded their own Federation of Protestant Churches in the GDR. Under Bishop Albrecht Schönherr they seek a place 'not against, not beside, but in socialism'.\n\nThis formula gives the churches a protected space for prayer, youth work, conscientious objectors and open discussion. A church-led government would rest on parishes and synods, peaceful dialogue and Christian ethics, independent of both Moscow and the West."
 COLDWAR_DDR_1970_party_15:0 "£generic_oligarchism_small Die Kombinatsdirektoren"
 COLDWAR_DDR_1970_party_15_desc:0 "(Managerial Oligarchy) - The Kombinat Directors (German: Die Kombinatsdirektoren)\n\nThe general directors of the great Kombinate run the industrial heart of the republic: optics in Jena, chemicals in Leuna and Buna, machine tools in Berlin. They control budgets, export contracts and tens of thousands of workers, and many would like to run the state as well.\n\nTheir spokesman is Wolfgang Biermann, a hard-driving industrial manager later famous at the head of Carl Zeiss Jena. A government of directors would put production, prestige projects and the privileges of the economic elite above the party's ideological campaigns."
 COLDWAR_DDR_1970_party_16:0 "£generic_Neutral_Libertarian_small Crafts and Trades"
 COLDWAR_DDR_1970_party_16_desc:0 "(Small-Business Liberalism) - Crafts and Trades (German: Handwerk und Gewerbe)\n\nIn 1970 thousands of private craft businesses, retailers and semi-state firms with state participation still survive in the GDR. They produce a large share of consumer goods and repairs, and their owners form the last independent economic class in the country.\n\nLed by a council of master craftsmen, this milieu fears the next wave of nationalisation, which historically came in 1972. Its programme is simple: freedom of trade, lower taxes, private initiative and an end to the chronic shortages of the planned economy."
 COLDWAR_DDR_1970_party_17:0 "£generic_Neutral_green_small Gilsenbach Environmental Circle"
 COLDWAR_DDR_1970_party_17_desc:0 "(Ecologism) - Environmentalists around Reimar Gilsenbach (German: Umweltschützer um Reimar Gilsenbach)\n\nWriter and conservationist Reimar Gilsenbach is among the first in the GDR to speak openly about environmental destruction. Around him, nature lovers of the Kulturbund, church ecology groups and local activists document the dying forests of the Ore Mountains and the sulphur over Bitterfeld.\n\nThe lignite-burning economy, the chemical triangle and open-cast mining poison air, water and soil. A green government would demand honest environmental data, cleaner technology and the protection of the landscape, even at the cost of industrial growth."
 COLDWAR_DDR_1970_party_18:0 "£generic_neutral_Social_small (DBD) - Democratic Farmers' Party of Germany"
 COLDWAR_DDR_1970_party_18_desc:0 "(Agrarian Socialism) - Democratic Farmers' Party of Germany (German: Demokratische Bauernpartei Deutschlands, DBD)\n\nThe Democratic Farmers' Party of Germany was founded in 1948 to win the countryside for the land reform and the SED's agrarian policy. Today it is the bloc party of the cooperative farmers of the LPGs and of the village intelligentsia.\n\nIts chairman Ernst Goldenbaum, a former KPD member, keeps the party close to the SED. Yet the DBD speaks for rural interests: fair procurement prices, investment in villages and a cooperative socialism rooted in the land rather than in the Berlin ministries."
 COLDWAR_DDR_1970_party_19:0 "£generic_Neutral_Communism_small Third Way Socialists"
 COLDWAR_DDR_1970_party_19_desc:0 "(Neutralist National Communism) - Third Way Socialists (German: Sozialisten des Dritten Weges)\n\nPhilosopher Wolfgang Harich was sentenced to ten years in prison in 1957 for his platform of a democratic, reformed socialism. Released in 1964, he still embodies the dream of a third way between Stalinism and Western capitalism.\n\nHis followers want a reunited, neutral and socialist Germany between the blocs, built on workers' councils, intellectual freedom and the withdrawal of all foreign troops. Their path would break with Moscow without surrendering to Bonn."
 COLDWAR_DDR_1970_party_20:0 "£generic_Nat_Populism_small (NDPD) - National Democratic Party of Germany"
 COLDWAR_DDR_1970_party_20_desc:0 "(National Bloc Populism) - National Democratic Party of Germany (German: National-Demokratische Partei Deutschlands, NDPD)\n\nThe National Democratic Party of Germany was founded in 1948 to integrate former Wehrmacht soldiers, NSDAP members and the national-minded middle class into the new order. Since then it has been the bloc party of the national question within the National Front.\n\nIts chairman Lothar Bolz, former foreign minister of the GDR, leads a party of officers, officials and traders. An assertive NDPD would appeal to national pride, the unity of Germany and the order-loving small man, in loud populist tones."
 COLDWAR_DDR_1970_party_21:0 "£generic_Nat_Fascism_small National Revolutionary Underground"
 COLDWAR_DDR_1970_party_21_desc:0 "(National Revolutionism) - National Revolutionary Underground (German: Nationalrevolutionärer Untergrund)\n\nHidden in the shadows of the republic are small circles of disillusioned young men, former soldiers and nationalist romantics who dream of a Germany that is neither Eastern nor Western. They hate the Soviet occupation as much as the American-led West.\n\nDirected by a secretive National Revolutionary Council, the underground preaches a militant 'national socialism of the third way': expulsion of all occupying powers, a centralised people's state and the violent restoration of German greatness. The Stasi hunts it ruthlessly."
 COLDWAR_DDR_1970_party_22:0 "£generic_Nat_Autocracy_small (NVA) - Military Council of the National People's Army"
 COLDWAR_DDR_1970_party_22_desc:0 "(Military Junta) - Military Council of the National People's Army (German: Militärrat der Nationalen Volksarmee, NVA)\n\nThe National People's Army, founded in 1956, is one of the most disciplined forces of the Warsaw Pact. Its generals at the defence ministry in Strausberg see themselves as the last guarantors of order should the party falter.\n\nAt their head stands Heinz Keßler, Chief of the Main Staff and deputy minister of defence. A military council would govern by decree, place the economy at the service of defence and keep the republic firmly inside the Warsaw Pact."
 COLDWAR_DDR_1970_party_23:0 "£generic_Monarchist_small Preußischer Kronrat"
 COLDWAR_DDR_1970_party_23_desc:0 "(Prussian Monarchism) - Prussian Crown Council (German: Preußischer Kronrat)\n\nLouis Ferdinand, Prince of Prussia, grandson of the last Kaiser and head of the House of Hohenzollern, lives in West Germany. In the East, his family's palaces were confiscated and the Berlin Palace demolished in 1950, but the memory of Prussia survives.\n\nThe Prussian Crown Council is a dream of Prussia restored: conservative officers, landed families expropriated in 1945 and nostalgic Protestants imagine a constitutional monarchy rising from the ruins of the socialist republic."
