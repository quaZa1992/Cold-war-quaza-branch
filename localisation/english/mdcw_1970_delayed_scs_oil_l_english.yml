l_english:
 south_china_sea_clash.11.d:0 "The Macclesfield Bank hold great strategic value in the South China Sea and give us access to lucrative resource-extraction opportunities. Despite the benefits of maintaining our de facto control over the Macclesfield Bank, we should consider the possibility of sharing these resources with Philippine through joint development zones or even give up control completely in order to negotiate an end to the current dispute."
