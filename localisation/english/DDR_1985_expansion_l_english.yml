l_english:
# IMPERIA CW — Cold War: Integrated DDR 1985 expansion — English localisation.
 DDR_1985_state_crisis_dynamic_modifier: "DDR State Crisis"
 DDR_1985_state_crisis_dynamic_modifier_desc: "State trust, SED control, Stasi penetration, reform pressure, West dependency, Moscow trust, emigration pressure and NVA loyalty define how brittle the republic really is."
 DDR_no_experiments: "No Experiments"
 DDR_no_experiments_desc: "The party will not gamble the republic on reforms it cannot control."
 DDR_old_guard_closes_ranks: "The Old Guard Closes Ranks"
 DDR_old_guard_closes_ranks_desc: "Honecker's loyalists bind party, police and bureaucracy together before Moscow's language infects Berlin."
 DDR_control_the_youth: "Control the Youth"
 DDR_control_the_youth_desc: "The FDJ, schools and youth programs must answer West television before the streets do."
 DDR_anti_revisionist_line: "Anti-Revisionist Line"
 DDR_anti_revisionist_line_desc: "If Moscow wavers, Berlin can still defend orthodoxy."
 DDR_party_above_the_people: "The Party Above the People"
 DDR_party_above_the_people_desc: "The SED survives by command, surveillance and certainty."
 DDR_krenz_waits_in_the_wings: "Krenz Waits in the Wings"
 DDR_krenz_waits_in_the_wings_desc: "A younger generation prepares to inherit the system before the system collapses."
 DDR_cautious_generational_change: "Cautious Generational Change"
 DDR_cautious_generational_change_desc: "Renewal begins inside the party, not against it."
 DDR_controlled_media_opening: "Controlled Media Opening"
 DDR_controlled_media_opening_desc: "A little truth can lower pressure, if the state still decides the limits."
 DDR_reformed_socialist_republic: "Reformed Socialist Republic"
 DDR_reformed_socialist_republic_desc: "The DDR attempts to remain socialist, sovereign and survivable."
 DDR_modrow_economic_commission: "Modrow's Economic Commission"
 DDR_modrow_economic_commission_desc: "Technocrats measure what the old plan preferred to hide."
 DDR_make_the_plan_measurable: "Make the Plan Measurable"
 DDR_make_the_plan_measurable_desc: "Useful statistics are politically dangerous, but the economy cannot be repaired blind."
 DDR_enterprise_autonomy_trials: "Enterprise Autonomy Trials"
 DDR_enterprise_autonomy_trials_desc: "Kombinate receive room to solve problems locally."
 DDR_plan_and_market_state: "Plan and Market State"
 DDR_plan_and_market_state_desc: "The republic experiments with market tools without abandoning socialist ownership."
 DDR_repair_supply_chains: "Repair the Supply Chains"
 DDR_repair_supply_chains_desc: "Stability begins with spare parts, soap and predictable deliveries."
 DDR_prioritize_basic_goods: "Prioritize Basic Goods"
 DDR_prioritize_basic_goods_desc: "The heavy industries must wait while the shelves are stabilized."
 DDR_price_of_stability: "The Price of Stability"
 DDR_price_of_stability_desc: "Buying quiet works until the bill becomes political."
 DDR_robotron_export_contracts: "Robotron Export Contracts"
 DDR_robotron_export_contracts_desc: "Computers can earn hard currency and prestige for the republic."
 DDR_dresden_silicon_dream: "Dresden Silicon Dream"
 DDR_dresden_silicon_dream_desc: "A socialist electronics hub rises at great cost."
 DDR_reverse_engineer_western_chips: "Reverse Engineer Western Chips"
 DDR_reverse_engineer_western_chips_desc: "If the embargo blocks technology, KoKo and the Stasi will find another route."
 DDR_robotron_republic: "Robotron Republic"
 DDR_robotron_republic_desc: "The DDR leans into a small, technical, export-capable future."
 DDR_expand_ko_ko_empire: "Expand the KoKo Empire"
 DDR_expand_ko_ko_empire_desc: "Hard currency keeps the state alive and corrupts everything it touches."
 DDR_prisoners_for_hard_currency: "Prisoners for Hard Currency"
 DDR_prisoners_for_hard_currency_desc: "Bonn pays, Berlin survives, and the public trust thins."
 DDR_embargo_bypass_networks: "Embargo Bypass Networks"
 DDR_embargo_bypass_networks_desc: "The shadow trade becomes a strategic asset."
 DDR_hidden_treasury: "The Hidden Treasury"
 DDR_hidden_treasury_desc: "Secret funds give the leadership choices normal budgets cannot."
 DDR_schalck_network: "Schalck's Network"
 DDR_schalck_network_desc: "Schalck-Golodkowski's channels bind KoKo, Bonn, procurement and the security state into one dangerous lifeline."
 DDR_files_on_everyone: "Files on Everyone"
 DDR_files_on_everyone_desc: "The Ministry for State Security turns fear into administrative knowledge."
 DDR_expand_im_network: "Expand the IM Network"
 DDR_expand_im_network_desc: "More informants, more warnings, less trust."
 DDR_churches_under_watch: "Churches Under Watch"
 DDR_churches_under_watch_desc: "The opposition's protected rooms become mapped rooms."
 DDR_stasi_state: "Stasi State"
 DDR_stasi_state_desc: "Security replaces legitimacy as the core of the republic."
 DDR_citizens_committee_pressure: "Citizens' Committee Pressure"
 DDR_citizens_committee_pressure_desc: "Civic groups demand that the files and the men who wrote them be brought under control."
 DDR_secure_the_files: "Secure the Files"
 DDR_secure_the_files_desc: "The archives can protect a transition or destroy it."
 DDR_dissolve_the_mfs: "Dissolve the MfS"
 DDR_dissolve_the_mfs_desc: "The security ministry is broken before it can break the opening."
 DDR_billion_mark_lifeline: "Billion Mark Lifeline"
 DDR_billion_mark_lifeline_desc: "Ask Bonn for hard currency and accept the political price."
 DDR_two_states_one_nation: "Two States, One Nation"
 DDR_two_states_one_nation_desc: "German identity can be acknowledged without surrendering sovereignty."
 DDR_passport_question: "The Passport Question"
 DDR_passport_question_desc: "Travel pressure must be managed before it becomes a border crisis."
 DDR_treaty_community_with_bonn: "Treaty Community with Bonn"
 DDR_treaty_community_with_bonn_desc: "A formal German community could preserve the DDR by binding the Federal Republic to restraint."
 DDR_neutral_german_confederation: "Neutral German Confederation"
 DDR_neutral_german_confederation_desc: "A confederal Germany outside direct bloc control becomes thinkable."
 DDR_the_other_germany: "The Other Germany"
 DDR_the_other_germany_desc: "The DDR claims an independent German future rather than absorption."
 DDR_request_soviet_guarantees: "Request Soviet Guarantees"
 DDR_request_soviet_guarantees_desc: "Moscow must decide whether the DDR is an ally, a burden or a problem to reform."
 DDR_forward_defense_doctrine: "Forward Defense Doctrine"
 DDR_forward_defense_doctrine_desc: "The DDR prepares as the Warsaw Pact's first line in central Europe."
 DDR_fulda_counterplan: "Fulda Counterplan"
 DDR_fulda_counterplan_desc: "The NVA studies the opening hours of a German war."
 DDR_professionalize_officer_corps: "Professionalize the Officer Corps"
 DDR_professionalize_officer_corps_desc: "A more professional army is stronger and less purely partisan."
 DDR_army_will_not_fire: "The Army Will Not Fire"
 DDR_army_will_not_fire_desc: "The NVA signals that it will not be used casually against the people."
 DDR_nva_guards_transition: "The NVA Guards the Transition"
 DDR_nva_guards_transition_desc: "The army becomes a stabilizer between party, Stasi and street."
 DDR_the_leipzig_question: "The Leipzig Question"
 DDR_the_leipzig_question_desc: "Monday demonstrations turn discontent into a national test."
 DDR_hungarian_gate: "The Hungarian Gate"
 DDR_hungarian_gate_desc: "A hole in the bloc border becomes a hole in the DDR's certainty."
 DDR_schabowski_question: "The Schabowski Question"
 DDR_schabowski_question_desc: "A sentence about travel can become the fate of the state."
 DDR_the_wall_opens: "The Wall Opens"
 DDR_the_wall_opens_desc: "The border regime breaks open, and every actor in Europe must answer."
 DDR_peaceful_revolution: "Peaceful Revolution"
 DDR_peaceful_revolution_desc: "The street defeats the old state without turning Germany into a battlefield."
 DDR_order_in_leipzig: "Order in Leipzig"
 DDR_order_in_leipzig_desc: "The regime restores control and pays the diplomatic price."
 DDR_reform_from_above: "Reform from Above"
 DDR_reform_from_above_desc: "The state survives by changing before it is overrun."
 DDR_central_plan_discipline: "Central Plan Discipline"
 DDR_central_plan_discipline_desc: "Restore deliveries through commands, audits and stricter allocation."
 DDR_kombinate_autonomy_compromise: "Kombinate Autonomy Compromise"
 DDR_kombinate_autonomy_compromise_desc: "Give major combines room to solve shortages without admitting the plan has failed."
 DDR_special_export_sector: "Special Export Sector"
 DDR_special_export_sector_desc: "Build a hard-currency export lane that trades ideology for breathing room."
 DDR_close_pressure_valves: "Close the Pressure Valves"
 DDR_close_pressure_valves_desc: "Restrict travel pressure through police control and administrative refusals."
 DDR_controlled_exit_visas: "Controlled Exit Visas"
 DDR_controlled_exit_visas_desc: "Let some pressure leave through managed exits before it breaks the border."
 DDR_travel_reform_experiment: "Travel Reform Experiment"
 DDR_travel_reform_experiment_desc: "Test limited travel concessions and hope society reads them as reform rather than weakness."
 DDR_mfs_above_party: "MfS Above the Party"
 DDR_mfs_above_party_desc: "The security ministry will preserve the state even if the party hesitates."
 DDR_party_supervises_mfs: "The Party Supervises the MfS"
 DDR_party_supervises_mfs_desc: "Bring the files and officers back under party discipline before they become a state within the state."
 DDR_chinese_model_discussed: "The Chinese Model Discussed"
 DDR_chinese_model_discussed_desc: "Market openings can serve an authoritarian party if the streets are never allowed to own politics."
 DDR_round_table_preparations: "Round Table Preparations"
 DDR_round_table_preparations_desc: "Prepare a controlled dialogue before civic groups force one on their own terms."
 DDR_shooting_order_reaffirmed: "Shooting Order Reaffirmed"
 DDR_shooting_order_reaffirmed_desc: "The border and the streets remain matters of state force."
 DDR_dialogue_with_the_streets: "Dialogue with the Streets"
 DDR_dialogue_with_the_streets_desc: "A nervous state talks before it shoots, hoping dialogue can still preserve sovereignty."
 DDR_advisers_abroad: "Advisers Abroad"
 DDR_advisers_abroad_desc: "Military and technical advisers in friendly states give the DDR influence beyond the inner German question."
 DDR_arms_for_hard_currency: "Arms for Hard Currency"
 DDR_arms_for_hard_currency_desc: "Exports of equipment and spare parts can feed KoKo accounts, even when the political smell is unpleasant."
 DDR_socialist_medical_missions: "Socialist Medical Missions"
 DDR_socialist_medical_missions_desc: "Doctors, training missions and clinics abroad turn small-state capacity into diplomatic capital."
 DDR_global_small_power: "Global Small Power"
 DDR_global_small_power_desc: "The DDR becomes a compact but active socialist actor, trading skill, discipline and discretion for relevance."
 DDR_common_german_council: "Common German Council"
 DDR_common_german_council_desc: "A permanent East-West German council can turn dangerous national sentiment into a managed diplomatic structure."
 DDR_confederal_currency_board: "Confederal Currency Board"
 DDR_confederal_currency_board_desc: "A cautious currency board ties the DDR to D-Mark stability without formally surrendering sovereignty."
 DDR_sovereignty_against_absorption: "Sovereignty Against Absorption"
 DDR_sovereignty_against_absorption_desc: "The republic accepts German contacts but rejects becoming a province of Bonn."
 DDR_follow_the_kremlin_line: "Follow the Kremlin Line"
 DDR_follow_the_kremlin_line_desc: "If Moscow changes, East Berlin can survive by being the most disciplined interpreter of the new Soviet line."
 DDR_honecker_defies_gorbachev: "Honecker Defies Gorbachev"
 DDR_honecker_defies_gorbachev_desc: "The DDR leadership refuses to let Soviet reform language decide the fate of the Wall."
 DDR_last_bastion_of_orthodoxy: "Last Bastion of Orthodoxy"
 DDR_last_bastion_of_orthodoxy_desc: "Berlin presents itself as the reliable guardian of Marxist-Leninist certainty, even if Moscow itself hesitates."
 DDR_small_warsaw_pact: "The Small Warsaw Pact"
 DDR_small_warsaw_pact_desc: "A hardline bloc of anxious socialist states can keep discipline alive when the Soviet center grows ambiguous."
 DDR_free_volkskammer_elections: "Free Volkskammer Elections"
 DDR_free_volkskammer_elections_desc: "Let the republic test whether legitimacy can survive the ballot box."
 DDR_democratic_german_republic: "Democratic German Republic"
 DDR_democratic_german_republic_desc: "A pluralist DDR attempts to remain sovereign, German and democratic without immediate absorption."
 DDR_emergency_council: "Emergency Council"
 DDR_emergency_council_desc: "Party, security and military leaders build a crisis cabinet to preserve order after Leipzig."
 DDR_modrow_transition_cabinet: "Modrow Transition Cabinet"
 DDR_modrow_transition_cabinet_desc: "A technocratic reform cabinet tries to keep the state functioning while the old party monopoly retreats."
 DDR_1985_state_crisis_category: "State Crisis of the DDR"
 DDR_1985_state_crisis_category_desc: "Manage supply, emigration, West German pressure, Stasi control, church contacts, KoKo money and NVA loyalty before the republic's contradictions become a national crisis."
 DDR_1985_emergency_consumer_imports: "Emergency Consumer Imports"
 DDR_1985_emergency_consumer_imports_desc: "Use hard currency channels to buy basic goods quickly. The shelves improve, but dependence on the West deepens."
 DDR_1985_prioritize_housing_materials: "Prioritize Housing Materials"
 DDR_1985_prioritize_housing_materials_desc: "Divert scarce construction inputs toward housing repairs and visible residential projects."
 DDR_1985_expand_intershop_supply: "Expand Intershop Supply"
 DDR_1985_expand_intershop_supply_desc: "Let Intershops pull in more hard currency. The state gains liquidity while inequality becomes harder to ignore."
 DDR_1985_stasi_preventive_detentions: "Stasi Preventive Detentions"
 DDR_1985_stasi_preventive_detentions_desc: "Remove organizers before protests harden. It lowers immediate street pressure and poisons long-term trust."
 DDR_1985_church_roundtable_contacts: "Church Roundtable Contacts"
 DDR_1985_church_roundtable_contacts_desc: "Open controlled talks with church circles to defuse opposition networks without fully legalizing them."
 DDR_1985_nva_readiness_drill: "NVA Readiness Drill"
 DDR_1985_nva_readiness_drill_desc: "Reassure Moscow and the officer corps through visible readiness exercises."
 DDR_1985_request_soviet_fuel: "Request Soviet Fuel"
 DDR_1985_request_soviet_fuel_desc: "Ask Moscow for energy and material relief, accepting another reminder of dependence."
 DDR_1985_quiet_bonn_credit: "Quiet Bonn Credit"
 DDR_1985_quiet_bonn_credit_desc: "Seek a discreet West German credit channel to stabilize supply without admitting weakness publicly."
 DDR_1985_prepare_leipzig_police_plan: "Prepare the Leipzig Police Plan"
 DDR_1985_prepare_leipzig_police_plan_desc: "Map routes, detention points and command chains before Monday demonstrations test the regime."
 DDR_1985_factory_complaint_commissions: "Factory Complaint Commissions"
 DDR_1985_factory_complaint_commissions_desc: "Send party and union commissions into factories to absorb worker anger before it becomes organized pressure."
 DDR_1985_release_selected_files: "Release Selected Files"
 DDR_1985_release_selected_files_desc: "Use controlled transparency to prove the reformers are serious while keeping the most dangerous archives sealed."
 DDR_1985_hidden_treasury_purchase: "Spend the Hidden Treasury"
 DDR_1985_hidden_treasury_purchase_desc: "Use KoKo reserves for an emergency import package that buys quiet at a high price."
 ddr_1985.1.t: "Bonn Offers a Lifeline"
 ddr_1985.1.d: "The DDR is asking for hard currency support. Bonn can stabilize East Berlin, attach reform conditions, or refuse."
 ddr_1985.1.a: "Grant the credit quietly."
 ddr_1985.1.b: "Tie it to travel concessions."
 ddr_1985.1.c: "Refuse the lifeline."
 ddr_1985.2.t: "A Treaty Community?"
 ddr_1985.2.d: "East Berlin proposes a German treaty community that would deepen contacts while slowing outright absorption."
 ddr_1985.2.a: "Accept the framework."
 ddr_1985.2.b: "No, unity cannot be delayed."
 ddr_1985.3.t: "The DDR Requests Guarantees"
 ddr_1985.3.d: "East Berlin wants stronger Soviet guarantees. We can support Honecker, demand a controlled reform, or leave the DDR to manage its own crisis."
 ddr_1985.3.a: "Guarantee the frontline state."
 ddr_1985.3.b: "Demand disciplined reform."
 ddr_1985.3.c: "Moscow has larger problems."
