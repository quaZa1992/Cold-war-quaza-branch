 COLDWAR_IRQ_decision_events.198.d:0 "The senior leadership must settle the distribution of national authority. Continuity offers familiar loyalties, while a new mandate would give another figure responsibility for the government and its programme."
 COLDWAR_IRQ_decision_baath_continuity_cabinet:0 "Appoint a Continuity Cabinet"
 COLDWAR_IRQ_decision_baath_continuity_cabinet_desc:0 "Preserve existing eligible successors including Tariq Aziz. A Tariq Aziz government retains shared Baath, economy, defence and foreign programmes; no forced Bakr/Saddam-only dead end."
 COLDWAR_IRQ_option_240:0 "Agree the mandate of Ahmed Hassan al-Bakr"
