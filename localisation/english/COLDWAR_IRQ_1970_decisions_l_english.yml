 COLDWAR_IRQ_decision_events.203.d:0 "The senior leadership must settle the distribution of national authority. Continuity offers familiar loyalties, while a new mandate would give another figure responsibility for the government and its programme."
 COLDWAR_IRQ_decision_bakr_power_settlement:0 "Negotiate the Division of Offices"
 COLDWAR_IRQ_decision_bakr_power_settlement_desc:0 "Risk a contested leadership settlement; existing leader system resolves the outcome."
