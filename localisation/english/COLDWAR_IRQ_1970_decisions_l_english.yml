l_english:
# IMPERIA CW — Cold War: iraq 1970 English localisation.
 COLDWAR_IRQ_negotiation_cost:0 "Constitutional Administration"
 COLDWAR_IRQ_negotiation_cost_desc:0 "New guarantees need offices, legal expertise and an administration capable of carrying them into effect."
 COLDWAR_IRQ_technical_exchange:0 "Funded Technical Exchange"
 COLDWAR_IRQ_technical_exchange_desc:0 "Foreign specialists and Iraqi engineers work together under a funded exchange programme."
 COLDWAR_IRQ_advisers:0 "Contracted Army Advisers"
 COLDWAR_IRQ_advisers_desc:0 "An agreed foreign mission supports Iraqi training while its upkeep remains a charge on the military budget."
 COLDWAR_IRQ_readiness_cycle:0 "Funded Readiness Cycle"
 COLDWAR_IRQ_readiness_cycle_desc:0 "Units return to training grounds for staff exercises, maintenance and rehearsals. Higher readiness depends on a temporary personnel commitment."
 COLDWAR_IRQ_autonomy_guarantee_cost:0 "Northern Constitutional Guarantees"
 COLDWAR_IRQ_autonomy_guarantee_cost_desc:0 "Local civil administration and negotiated language rights depend on a sustained public commitment to the northern settlement."
 COLDWAR_IRQ_civil_rights_cost:0 "Maintaining Political Guarantees"
 COLDWAR_IRQ_civil_rights_cost_desc:0 "Legal political activity requires enforceable safeguards and leaves the government less free to silence organized opposition."
 COLDWAR_IRQ_border_navigation:0 "Reciprocal River Navigation"
 COLDWAR_IRQ_border_navigation_desc:0 "The reciprocal river settlement supports regular navigation and requires the continuing cooperation of both governments."
 COLDWAR_IRQ_current_export_contract:0 "Current Oil Export Contract"
 COLDWAR_IRQ_current_export_contract_desc:0 "A negotiated export arrangement secures an agreed outlet for Iraqi oil while imposing its own commercial and administrative obligations."
 COLDWAR_IRQ_front_labour_charter:0 "Front Labour Charter"
 COLDWAR_IRQ_front_labour_charter_desc:0 "Independent workplace delegates help settle disputes and organize production. Their cooperation rests on funded social commitments and meaningful participation."
 COLDWAR_IRQ_party_mobilization:0 "Party Organization Drive"
 COLDWAR_IRQ_party_mobilization_desc:0 "The executive coordinates party unions and mass organizations through a common campaign, supported by additional administrative staff."
 COLDWAR_IRQ_north_revenue_sharing:0 "Northern Revenue-Sharing Settlement"
 COLDWAR_IRQ_north_revenue_sharing_desc:0 "Regional authorities receive a guaranteed share of public revenue. Baghdad relinquishes part of its central receipts in return for the broader settlement of northern administration and security."
 COLDWAR_IRQ_north_central_administration:0 "Central Administration and Local Guarantees"
 COLDWAR_IRQ_north_central_administration_desc:0 "Baghdad retains central fiscal administration while maintaining agreed local guarantees. This narrower settlement continues to require a larger security and administrative presence."
 COLDWAR_IRQ_front_contract_active_tt:0 "The Front charter and coalition guarantees are being respected"
 COLDWAR_IRQ_constitution_executive_active_tt:0 "The current constitutional settlement permits executive authority"
 COLDWAR_IRQ_constitution_representative_active_tt:0 "The current constitutional settlement permits representative authority"
 COLDWAR_IRQ_option_101:0 "Ratify executive constitutional authority."
 COLDWAR_IRQ_option_102:0 "Ratify representative constitutional authority."
 COLDWAR_IRQ_option_103:0 "Close the conference."
 COLDWAR_IRQ_decision_events.10000.t:0 "The constitutional settlement"
 COLDWAR_IRQ_decision_events.10000.d:0 "The distribution of executive authority must be agreed before incompatible programmes can operate together. A new conference can replace the settlement after a change of government."
 COLDWAR_IRQ_decision_constitutional_settlement_review:0 "Convene a Constitutional Conference"
 COLDWAR_IRQ_decision_constitutional_settlement_review_desc:0 "Choose the current constitutional settlement. Ratification costs 1% of GDP and replaces incompatible programme authority."
 COLDWAR_IRQ_option_105:0 "Adopt the programme: A Civic Compact"
 COLDWAR_IRQ_option_106:0 "Adopt the programme: Executive Authority"
 COLDWAR_IRQ_option_107:0 "Adopt the programme: Protect Judicial Review"
 COLDWAR_IRQ_option_108:0 "Adopt the programme: Fund the Security State"
 COLDWAR_IRQ_option_109:0 "Close the conference."
 COLDWAR_IRQ_decision_events.106.t:0 "The constitutional programme"
 COLDWAR_IRQ_decision_events.106.d:0 "Ministers must reconcile the current settlement of authority with the institutions they intend to strengthen. Reopening that settlement requires a funded political conference."
 COLDWAR_IRQ_decision_constitutional_revision:0 "Constitutional Revision Conference"
 COLDWAR_IRQ_decision_constitutional_revision_desc:0 "Reopen a selected institutional policy at real political and administrative cost; never replay national investments."
 COLDWAR_IRQ_option_111:0 "Adopt the programme: Liberal Republic"
 COLDWAR_IRQ_option_112:0 "Adopt the programme: Social Republic"
 COLDWAR_IRQ_option_113:0 "Adopt the programme: A Federal Constitution"
 COLDWAR_IRQ_option_114:0 "Adopt the programme: A Unitary Republic"
 COLDWAR_IRQ_option_115:0 "Close the conference."
 COLDWAR_IRQ_decision_events.112.t:0 "The cabinet programme"
 COLDWAR_IRQ_decision_events.112.d:0 "The cabinet must agree which commitments take priority in its next programme. Coalition partners expect the new allocation to be reflected in ministerial policy."
 COLDWAR_IRQ_decision_civic_policy_review:0 "Review the Cabinet Programme"
 COLDWAR_IRQ_decision_civic_policy_review_desc:0 "A later coalition can revise selected funded policy slots without replaying old rewards."
 COLDWAR_IRQ_option_117:0 "Adopt the programme: Active Non-Alignment"
 COLDWAR_IRQ_option_118:0 "Adopt the programme: Seek a Treaty Partner"
 COLDWAR_IRQ_option_119:0 "Adopt the programme: Armed Deterrence"
 COLDWAR_IRQ_option_120:0 "Adopt the programme: The Shatt al-Arab"
 COLDWAR_IRQ_option_121:0 "Close the conference."
 COLDWAR_IRQ_decision_events.118.t:0 "External commitments"
 COLDWAR_IRQ_decision_events.118.d:0 "External commitments should serve Iraq’s current interests. Revising our diplomatic priorities requires consultation and a clear division of responsibilities."
 COLDWAR_IRQ_decision_foreign_policy_review:0 "Review Active Treaty Obligations"
 COLDWAR_IRQ_decision_foreign_policy_review_desc:0 "A revision needs counterpart response where required. No reward replay or automatic diplomatic immunity."
 COLDWAR_IRQ_option_123:0 "Adopt the programme: Basic Industries First"
 COLDWAR_IRQ_option_124:0 "Adopt the programme: Consumer Expansion"
 COLDWAR_IRQ_option_125:0 "Adopt the programme: Development Credit"
 COLDWAR_IRQ_option_126:0 "Adopt the programme: Public Finance"
 COLDWAR_IRQ_option_127:0 "Close the conference."
 COLDWAR_IRQ_decision_events.124.t:0 "The next investment round"
 COLDWAR_IRQ_decision_events.124.d:0 "The next round of investment can concentrate on basic industry or on wider civilian production. The chosen priority will direct public planning and support."
 COLDWAR_IRQ_decision_industry_reallocate:0 "Reallocate the Next Investment Round"
 COLDWAR_IRQ_decision_industry_reallocate_desc:0 "Select one current future-investment policy. Existing factories remain; no second grant from repeating review."
 COLDWAR_IRQ_option_129:0 "Adopt the programme: Mass Literacy"
 COLDWAR_IRQ_option_130:0 "Adopt the programme: Train Teachers First"
 COLDWAR_IRQ_option_131:0 "Adopt the programme: Targeted Services"
 COLDWAR_IRQ_option_132:0 "Adopt the programme: Universal Services"
 COLDWAR_IRQ_option_133:0 "Close the conference."
 COLDWAR_IRQ_decision_events.130.t:0 "Social coverage and services"
 COLDWAR_IRQ_decision_events.130.d:0 "Public services must match the government’s commitments to households and neglected districts. Ministers can revise the priorities that guide social provision."
 COLDWAR_IRQ_decision_society_revision:0 "Review Social Coverage and Funding"
 COLDWAR_IRQ_decision_society_revision_desc:0 "Replace the selected coverage policy; permanent literacy and built infrastructure remain."
 COLDWAR_IRQ_option_135:0 "Adopt the programme: Presidential Guard"
 COLDWAR_IRQ_option_136:0 "Adopt the programme: The Regular Army"
 COLDWAR_IRQ_option_137:0 "Close the conference."
 COLDWAR_IRQ_decision_events.10001.t:0 "The Guard and the General Staff"
 COLDWAR_IRQ_decision_events.10001.d:0 "Modern equipment, trained officers and premium pay cannot be concentrated everywhere. The presidency must decide whether the Guard or the regular army receives priority."
 COLDWAR_IRQ_decision_army_priority_review:0 "Review the Army Priority"
 COLDWAR_IRQ_decision_army_priority_review_desc:0 "Redistribute the current military priority between the Guard and the regular army. The review costs 1% of GDP."
 COLDWAR_IRQ_option_139:0 "Adopt the programme: Farm Cooperatives"
 COLDWAR_IRQ_option_140:0 "Adopt the programme: Support Smallholders"
 COLDWAR_IRQ_option_141:0 "Close the conference."
 COLDWAR_IRQ_decision_events.10002.t:0 "Rural credit and machinery"
 COLDWAR_IRQ_decision_events.10002.d:0 "Rural lenders and machinery services must decide how to divide support between cooperative equipment pools and individual cultivators."
 COLDWAR_IRQ_decision_agriculture_priority_review:0 "Review the Rural Credit Priority"
 COLDWAR_IRQ_decision_agriculture_priority_review_desc:0 "Redistribute future rural credit between cooperative machinery and smallholder guarantees. Review costs 1% of GDP; existing farms and completed investments remain."
 COLDWAR_IRQ_option_143:0 "Adopt the programme: Beyond Oil"
 COLDWAR_IRQ_option_144:0 "Adopt the programme: An Oil Revenue State"
 COLDWAR_IRQ_option_145:0 "Close the conference."
 COLDWAR_IRQ_decision_events.10003.t:0 "The oil revenue programme"
 COLDWAR_IRQ_decision_events.10003.d:0 "The next planning round must decide how much to emphasize export receipts and how much to develop the non-oil economy. This allocation operates within the existing ownership settlement."
 COLDWAR_IRQ_decision_oil_revenue_priority_review:0 "Review the Oil Revenue Priority"
 COLDWAR_IRQ_decision_oil_revenue_priority_review_desc:0 "Reallocate the next planning round between export revenue and non-oil development. Review costs 1% of GDP; completed investment remains in place."
 COLDWAR_IRQ_option_147:0 "Accept legal rights and fund their implementation."
 COLDWAR_IRQ_option_148:0 "Reject the proposed guarantees."
 COLDWAR_IRQ_option_149:0 "End the government guarantees."
 COLDWAR_IRQ_option_150:0 "Close the conference."
 COLDWAR_IRQ_decision_events.135.t:0 "A political opening"
 COLDWAR_IRQ_decision_events.135.d:0 "Opposition parties want more than permission to meet. Legal protection needs enforceable safeguards, while the government must decide whether it will accept organized criticism of its policies."
 COLDWAR_IRQ_decision_political_opening:0 "Negotiate a Political Opening"
 COLDWAR_IRQ_decision_political_opening_desc:0 "Open a paid, reversible legal-status negotiation; no automatic transfer of power."
 COLDWAR_IRQ_option_152:0 "Release and rehabilitate detained political organizers."
 COLDWAR_IRQ_option_153:0 "Retain detention subject to judicial review."
 COLDWAR_IRQ_option_154:0 "Close the conference."
 COLDWAR_IRQ_decision_events.139.t:0 "Individual prisoner review"
 COLDWAR_IRQ_decision_events.139.d:0 "The review concerns living detainees whose cases remain unresolved. Release requires the stated funding. If no eligible case remains, the review fee is refunded and no implementation costs are charged."
 COLDWAR_IRQ_decision_prison_review:0 "Individual Prisoner Review"
 COLDWAR_IRQ_decision_prison_review_desc:0 "Review living, unresolved detainees. Protect Dawa organisers before January 1971, rehabilitate Rikabi before 28 November 1971, or release Dukhayl before January 1973. If no eligible case remains, the 30 Political Power review fee is refunded."
 COLDWAR_IRQ_option_156:0 "The delegates accept; fund the guarantees."
 COLDWAR_IRQ_option_157:0 "The delegates reject the terms."
 COLDWAR_IRQ_option_158:0 "Revoke the agreement and its guarantees."
 COLDWAR_IRQ_option_159:0 "Close the conference."
 COLDWAR_IRQ_decision_events.144.t:0 "The northern constitutional offer"
 COLDWAR_IRQ_decision_events.144.d:0 "The regional delegates choose whether to accept defined local civil administration, language rights and a negotiated budget within Iraq. No state is transferred and no country is released. Delivery costs 2% of frozen Iraqi GDP."
 COLDWAR_IRQ_decision_march_offer:0 "Offer an Autonomy Accord"
 COLDWAR_IRQ_decision_march_offer_desc:0 "Domestic KDP response and territorial definition required; no automatic March1970 success."
 COLDWAR_IRQ_decision_icp_federal_talks:0 "Open Federal Negotiations"
 COLDWAR_IRQ_decision_icp_federal_talks_desc:0 "KDP/PUK and provincial representatives respond; no free cores, territorial transfer or Kurdish loyalty variable invented."
 COLDWAR_IRQ_decision_puk_federal_convention:0 "Call a Federal Convention"
 COLDWAR_IRQ_decision_puk_federal_convention_desc:0 "Arab and Kurdish parties negotiate constitutional authority and revenue. No automatic approval."
 COLDWAR_IRQ_decision_kdp_kirkuk_talks:0 "Convene Kirkuk Status Talks"
 COLDWAR_IRQ_decision_kdp_kirkuk_talks_desc:0 "No automatic ethnic transfer, core, annexation or resource ownership. All status changes need a constitutional agreement."
 COLDWAR_IRQ_option_161:0 "Accept the proposed settlement."
 COLDWAR_IRQ_option_162:0 "Reject the proposed settlement."
 COLDWAR_IRQ_decision_events.10004.t:0 "Revenue-sharing and regional authority"
 COLDWAR_IRQ_decision_events.10004.d:0 "Baghdad proposes a new division of northern authority and public revenue. Your government may accept the terms or reject the proposal. Ratification proceeds only after every participating regional government agrees."
 COLDWAR_IRQ_option_164:0 "Accept the proposed settlement."
 COLDWAR_IRQ_option_165:0 "Reject the proposed settlement."
 COLDWAR_IRQ_decision_events.10005.t:0 "Revenue-sharing and regional authority"
 COLDWAR_IRQ_decision_events.10005.d:0 "Baghdad proposes a new division of northern authority and public revenue. Your government may accept the terms or reject the proposal. Ratification proceeds only after every participating regional government agrees."
 COLDWAR_IRQ_option_167:0 "The delegates ratify the settlement."
 COLDWAR_IRQ_option_168:0 "The delegates reject the proposal."
 COLDWAR_IRQ_option_169:0 "Close the conference."
 COLDWAR_IRQ_decision_events.10006.t:0 "Revenue-sharing and regional authority"
 COLDWAR_IRQ_decision_events.10006.d:0 "The regional delegates must agree to the proposed fiscal settlement before it can replace the existing guarantees."
 COLDWAR_IRQ_north_ratification_tt:0 "If the settlement is ratified:"
 COLDWAR_IRQ_option_171:0 "Revenue-sharing and regional authority"
 COLDWAR_IRQ_option_172:0 "Accept the proposed settlement."
 COLDWAR_IRQ_option_173:0 "Reject the proposed settlement."
 COLDWAR_IRQ_decision_events.10007.t:0 "Central administration with local guarantees"
 COLDWAR_IRQ_decision_events.10007.d:0 "Baghdad proposes a new division of northern authority and public revenue. Your government may accept the terms or reject the proposal. Ratification proceeds only after every participating regional government agrees."
 COLDWAR_IRQ_option_175:0 "Accept the proposed settlement."
 COLDWAR_IRQ_option_176:0 "Reject the proposed settlement."
 COLDWAR_IRQ_decision_events.10008.t:0 "Central administration with local guarantees"
 COLDWAR_IRQ_decision_events.10008.d:0 "Baghdad proposes a new division of northern authority and public revenue. Your government may accept the terms or reject the proposal. Ratification proceeds only after every participating regional government agrees."
 COLDWAR_IRQ_option_178:0 "The delegates ratify the settlement."
 COLDWAR_IRQ_option_179:0 "The delegates reject the proposal."
 COLDWAR_IRQ_option_180:0 "Close the conference."
 COLDWAR_IRQ_decision_events.10009.t:0 "Central administration with local guarantees"
 COLDWAR_IRQ_decision_events.10009.d:0 "The regional delegates must agree to the proposed fiscal settlement before it can replace the existing guarantees."
 COLDWAR_IRQ_option_182:0 "Central administration with local guarantees"
 COLDWAR_IRQ_option_183:0 "Close the conference."
 COLDWAR_IRQ_decision_events.149.t:0 "Northern revenue and authority"
 COLDWAR_IRQ_decision_events.149.d:0 "A broader revenue-sharing settlement gives regional administration a larger role. Central administration retains the existing local guarantees but requires a greater continuing security presence. Kirkuk must remain under Iraqi control; the agreement grants no territory."
 COLDWAR_IRQ_decision_north_fiscal_settlement:0 "Negotiate the Northern Revenue Settlement"
 COLDWAR_IRQ_decision_north_fiscal_settlement_desc:0 "Negotiate revenue-sharing or central administration with local guarantees. Ratification costs 2% of GDP; regional governments control their response."
 COLDWAR_IRQ_option_185:0 "Accept the charter and legal guarantees."
 COLDWAR_IRQ_option_186:0 "Refuse an unequal front."
 COLDWAR_IRQ_option_187:0 "Leave the existing front."
 COLDWAR_IRQ_option_188:0 "Close the conference."
 COLDWAR_IRQ_decision_events.154.t:0 "National Front terms"
 COLDWAR_IRQ_decision_events.154.d:0 "The prospective partners demand ministries, legal protections and a voice in public policy. The Baath leadership must decide whether to offer genuine cooperation or retain an arrangement in which its partners have little influence."
 COLDWAR_IRQ_decision_front_offer:0 "Negotiate a National Progressive Front"
 COLDWAR_IRQ_decision_front_offer_desc:0 "ICP may accept, refuse or seek guarantees; coalition participation does not make it governing subparty."
 COLDWAR_IRQ_decision_icp_front_terms:0 "Submit Front Conditions"
 COLDWAR_IRQ_decision_icp_front_terms_desc:0 "Negotiate legal rights and ministries; front membership does not by itself activate governing-party programmes."
 COLDWAR_IRQ_option_190:0 "Negotiate ministries and a Front charter."
 COLDWAR_IRQ_option_191:0 "Discuss legal political activity."
 COLDWAR_IRQ_option_192:0 "Organize an independent opposition."
 COLDWAR_IRQ_option_193:0 "Leave the Front but retain legal rights."
 COLDWAR_IRQ_option_194:0 "Close the conference."
 COLDWAR_IRQ_decision_events.10010.t:0 "The Communist question"
 COLDWAR_IRQ_decision_events.10010.d:0 "The Communists have a choice between participation under negotiated guarantees and an independent political organization. Baghdad must decide how much legal space it is prepared to allow."
 COLDWAR_IRQ_decision_icp_preaccession:0 "The Communist Question"
 COLDWAR_IRQ_decision_icp_preaccession_desc:0 "Determine whether the Communist Party seeks legal participation in the Front or organises an independent opposition. The incumbent government retains office."
 COLDWAR_IRQ_decision_front_labour_terms:0 "Negotiate the Front Labour Charter"
 COLDWAR_IRQ_decision_front_labour_terms_desc:0 "Independent workplace representation supports industrial cooperation while requiring funded social commitments."
 COLDWAR_IRQ_decision_party_state_mobilization:0 "Mobilize the Party Organizations"
 COLDWAR_IRQ_decision_party_state_mobilization_desc:0 "Coordinate the party organizations through the executive, with a funded administrative commitment."
 COLDWAR_IRQ_option_196:0 "End participation."
 COLDWAR_IRQ_option_197:0 "Maintain the existing terms."
 COLDWAR_IRQ_option_198:0 "Close the conference."
 COLDWAR_IRQ_decision_events.158.t:0 "Continued front participation"
 COLDWAR_IRQ_decision_events.158.d:0 "The Front has given the party a place in government, but its ministers must answer to members who question the terms of cooperation. The leadership must decide whether continued participation still serves its programme or whether the party should withdraw from the coalition."
 COLDWAR_IRQ_decision_aziz_exit_front:0 "Review Continued Front Participation"
 COLDWAR_IRQ_decision_aziz_exit_front_desc:0 "Review the Communist Party’s participation in the governing Front. Withdrawal ends the coalition agreement without transferring the presidency."
 COLDWAR_IRQ_decision_aziz_charter:0 "Offer a Minimum Democratic Charter"
 COLDWAR_IRQ_decision_aziz_charter_desc:0 "Other domestic parties accept or reject separately; no automatic all-party alliance."
 COLDWAR_IRQ_decision_officer_amnesty_offer:0 "Offer a Conditional Amnesty"
 COLDWAR_IRQ_decision_officer_amnesty_offer_desc:0 "Opposition chooses whether to accept. No automatic coup immunity or power transfer."
 COLDWAR_IRQ_option_200:0 "Ratify the transition charter."
 COLDWAR_IRQ_option_201:0 "The constitutional vote fails."
 COLDWAR_IRQ_option_202:0 "Close the conference."
 COLDWAR_IRQ_decision_events.162.t:0 "The constitutional vote"
 COLDWAR_IRQ_decision_events.162.d:0 "The transition charter would bind the officers to an electoral timetable and give civilian parties a lawful route to government. Ratification now depends on whether the leadership will accept a contest whose result it cannot dictate."
 COLDWAR_IRQ_decision_officer_transition:0 "Submit the Transition Charter"
 COLDWAR_IRQ_decision_officer_transition_desc:0 "A constitutional vote may fail; success permits civilian accession through MD politics, not arbitrary party support replacement."
 COLDWAR_IRQ_option_204:0 "Count the votes and form the elected government."
 COLDWAR_IRQ_option_205:0 "Close the conference."
 COLDWAR_IRQ_decision_events.165.t:0 "A contested parliamentary election"
 COLDWAR_IRQ_decision_events.165.d:0 "The campaign has brought competing programmes before the electorate. The count will determine which eligible party receives the mandate to govern, while parliamentary negotiations will shape the coalition that follows. Ministers must now submit their record to the voters."
 COLDWAR_IRQ_decision_civic_election:0 "Hold a Contested Parliamentary Election"
 COLDWAR_IRQ_decision_civic_election_desc:0 "Hold a parliamentary election among the legal parties. The result determines which party forms the next government."
 COLDWAR_IRQ_option_207:0 "Confirm the historical party leadership: Khair al-Din Haseeb"
 COLDWAR_IRQ_option_208:0 "Alternate national mandate: Fuad al-Rikabi"
 COLDWAR_IRQ_option_209:0 "Close the conference."
 COLDWAR_IRQ_decision_events.169.t:0 "The party leadership congress"
 COLDWAR_IRQ_decision_events.169.d:0 "Delegates must choose a leadership capable of carrying the party programme into government. Experience, regional loyalties and competing views of the republic will shape the mandate entrusted to the next executive."
 COLDWAR_IRQ_decision_arab_leadership:0 "Convene an Arab Socialist Leadership Council"
 COLDWAR_IRQ_decision_arab_leadership_desc:0 "Bring the party leadership together to nominate a living, eligible executive and settle the direction of the Arab socialist programme."
 COLDWAR_IRQ_option_211:0 "Confirm the historical party leadership: Aziz Muhammad"
 COLDWAR_IRQ_option_212:0 "Alternate national mandate: Amir Abdullah"
 COLDWAR_IRQ_option_213:0 "Alternate national mandate: Zaki Khairi"
 COLDWAR_IRQ_option_214:0 "Close the conference."
 COLDWAR_IRQ_decision_events.174.t:0 "The party leadership congress"
 COLDWAR_IRQ_decision_events.174.d:0 "Delegates must choose a leadership capable of carrying the party programme into government. Experience, regional loyalties and competing views of the republic will shape the mandate entrusted to the next executive."
 COLDWAR_IRQ_decision_icp_leadership_vote:0 "Elect the Party Secretariat"
 COLDWAR_IRQ_decision_icp_leadership_vote_desc:0 "Convene the Communist Party congress to choose an eligible secretary and settle the leadership of its political programme."
 COLDWAR_IRQ_option_216:0 "Confirm the historical party leadership: Aziz Muhammad"
 COLDWAR_IRQ_option_217:0 "Alternate national mandate: Amir Abdullah"
 COLDWAR_IRQ_option_218:0 "Alternate national mandate: Zaki Khairi"
 COLDWAR_IRQ_option_219:0 "Close the conference."
 COLDWAR_IRQ_decision_events.179.t:0 "The party leadership congress"
 COLDWAR_IRQ_decision_events.179.d:0 "Delegates must choose a leadership capable of carrying the party programme into government. Experience, regional loyalties and competing views of the republic will shape the mandate entrusted to the next executive."
 COLDWAR_IRQ_decision_aziz_renewal:0 "Hold a Leadership Renewal Vote"
 COLDWAR_IRQ_decision_aziz_renewal_desc:0 "Use the leadership registry. A departing secretary loses this active programme, while earned progress survives."
 COLDWAR_IRQ_option_221:0 "Alternate national mandate: Muhammad Hadi al-Subayti"
 COLDWAR_IRQ_option_222:0 "Alternate national mandate: Abd al-Sahib Dukhayl"
 COLDWAR_IRQ_option_223:0 "Alternate national mandate: Ibrahim al-Jaafari"
 COLDWAR_IRQ_option_224:0 "Close the conference."
 COLDWAR_IRQ_decision_events.184.t:0 "The party leadership congress"
 COLDWAR_IRQ_decision_events.184.d:0 "Delegates must choose a leadership capable of carrying the party programme into government. Experience, regional loyalties and competing views of the republic will shape the mandate entrusted to the next executive."
 COLDWAR_IRQ_decision_dawa_leadership:0 "Select a Political Executive"
 COLDWAR_IRQ_decision_dawa_leadership_desc:0 "Select an eligible political executive to direct Dawa’s organisation and government programme."
 COLDWAR_IRQ_option_226:0 "Alternate national mandate: Numan al-Samarrai"
 COLDWAR_IRQ_option_227:0 "Alternate national mandate: Ayad al-Samarrai"
 COLDWAR_IRQ_option_228:0 "Close the conference."
 COLDWAR_IRQ_decision_events.188.t:0 "The party leadership congress"
 COLDWAR_IRQ_decision_events.188.d:0 "Delegates must choose a leadership capable of carrying the party programme into government. Experience, regional loyalties and competing views of the republic will shape the mandate entrusted to the next executive."
 COLDWAR_IRQ_decision_iip_congress:0 "Reconstitute the IIP Leadership"
 COLDWAR_IRQ_decision_iip_congress_desc:0 "Convene eligible party organisers to elect a political executive and reconstitute the Islamic Party leadership."
 COLDWAR_IRQ_option_230:0 "Agree the mandate of Ahmed Hassan al-Bakr"
 COLDWAR_IRQ_option_231:0 "Agree the mandate of Saddam Hussein"
