 COLDWAR_IRQ_decision_events.208.t:0 "A leadership settlement"
 COLDWAR_IRQ_decision_events.208.d:0 "The senior leadership must settle the distribution of national authority. Continuity offers familiar loyalties, while a new mandate would give another figure responsibility for the government and its programme."
