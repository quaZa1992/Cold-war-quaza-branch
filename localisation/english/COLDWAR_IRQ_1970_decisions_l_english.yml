 COLDWAR_IRQ_decision_events.193.t:0 "A leadership settlement"
 COLDWAR_IRQ_decision_events.193.d:0 "The senior leadership must settle the distribution of national authority. Continuity offers familiar loyalties, while a new mandate would give another figure responsibility for the government and its programme."
 COLDWAR_IRQ_decision_baath_succession:0 "Regional Leadership Contest"
 COLDWAR_IRQ_decision_baath_succession_desc:0 "Convene the Regional Command to settle the presidency among eligible party leaders. The incumbent retains office until a successor is selected."
