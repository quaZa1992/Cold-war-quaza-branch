 COLDWAR_CMEA_external: "Programmes with the Council"
 COLDWAR_CMEA.1.t: "The Council Votes"
 COLDWAR_CMEA.1.d: "[COLDWAR_CMEA_ev_presidency_line] §Y[COLDWAR_CMEA_ev1_item_title]§! is now before the [COLDWAR_CMEA_GetOrgName]. Our delegation has §Y30 days§! to vote §GFor§!, §YNot interested§! or §RAgainst§! in the COMECON window (§YShift+C§!). One country, one vote; only governments led by players vote. A recommendation binds only the members that vote For and the passive members."
 COLDWAR_CMEA.2.t: "Council Decision"
 COLDWAR_CMEA_ev_res_14_e2: "§GA programme abroad starts§! for two years: [COLDWAR_CMEA_sn_ev2_target]."
 COLDWAR_CMEA.2.d: "§Y[COLDWAR_CMEA_ev2_item_title]§!\n\n[COLDWAR_CMEA_ev2_result]"
 COLDWAR_CMEA.3.t: "Ratification Required"
 COLDWAR_CMEA.3.d: "The Session has adopted §Y[COLDWAR_CMEA_ev3_item_title]§!, a change of the Charter. Every member must ratify it. Our government decides in the COMECON window: the national assembly ratifies (90 days, 25 political power) or we refuse, and the change fails. Without a choice within a year the assembly ratifies."
 COLDWAR_CMEA.4.t: "An Offer from the Council"
 COLDWAR_CMEA.4.d: "The [COLDWAR_CMEA_GetOrgName] offers us §Y[COLDWAR_CMEA_ev4_item_title]§!. We answer in the COMECON window under §YYour Desk§!. The offer waits while our government is away; it lapses after 60 days in which we are played without answering."
 COLDWAR_CMEA.5.t: "Council Business"
 COLDWAR_CMEA_ev_res_14_e5: "§GA programme abroad starts§! for two years: [COLDWAR_CMEA_sn_ev5_target]."
 COLDWAR_CMEA.5.d: "§Y[COLDWAR_CMEA_ev5_item_title]§!\n\n[COLDWAR_CMEA_ev5_result]"
 COLDWAR_CMEA.6.t: "Request Not Pursued"
 COLDWAR_CMEA_ev_res_14_e6: "§GA programme abroad starts§! for two years: [COLDWAR_CMEA_sn_ev6_target]."
 COLDWAR_CMEA.6.d: "§Y[COLDWAR_CMEA_ev6_item_title]§!\n\n[COLDWAR_CMEA_ev6_result]"
 COLDWAR_CMEA.8.t: "Council Assistance"
 COLDWAR_CMEA_ev_res_14_e8: "§GA programme abroad starts§! for two years: [COLDWAR_CMEA_sn_ev8_target]."
 COLDWAR_CMEA.8.d: "[COLDWAR_CMEA_ev8_result]"
 COLDWAR_CMEA.9.t: "Admission to the Council"
 COLDWAR_CMEA.9.d: "§Y[COLDWAR_CMEA_sn_ev9_target]§! is now a member of the [COLDWAR_CMEA_GetOrgName]. The clearing, the plan coordination and the order of the Chair change with it."
 COLDWAR_CMEA.10.t: "Chair of the Council"
 COLDWAR_CMEA.10.d: "Our delegation now chairs the [COLDWAR_CMEA_GetOrgName]. We may put one file first on the agenda and open the business of the Session[COLDWAR_CMEA_ev_pres_free]."
 COLDWAR_CMEA.11.t: "The Secretariat in Moscow"
 COLDWAR_CMEA.11.d: "The office of the Secretary of the Council is open. For 30 days every player member may stand in the COMECON window (50 political power). With two or more candidates the Executive Committee elects by plurality; a lone candidate is elected. Until then the Chair runs the Secretariat."
 COLDWAR_CMEA.13.t: "The Secretary Elected"
 COLDWAR_CMEA.13.d: "§Y[COLDWAR_CMEA_sn_ev13_target]§! provides the Secretary of the Council for the next four years."
 COLDWAR_CMEA.15.t: "Assistance Capacity Exceeded"
 COLDWAR_CMEA.15.d: "The Council programmes abroad take their share of our aid administration. Our assistance capacity is now §Y[?mdcw_cw_cap_max|0]§!, but our own programmes use §Y[?mdcw_cw_cap_used|0]§!. We have §Y7 days§! to end a programme in the Cold War window. Otherwise our newest programme ends: §Y[COLDWAR_CMEA_ev_newest]§!."
 COLDWAR_CMEA.16.t: "Programme Ended"
 COLDWAR_CMEA.16.d: "To stay within our assistance capacity our newest programme has ended: §Y[COLDWAR_CMEA_ev_ended]§!."
 COLDWAR_CMEA.17.t: "Application for Membership"
 COLDWAR_CMEA.17.a:0 "Put the admission on the agenda."
 COLDWAR_CMEA.17.d: "§Y[COLDWAR_CMEA_sn_ev17_target]§! has applied to join the [COLDWAR_CMEA_GetOrgName]. We can put the admission on the agenda right here (costs political power like any proposal). The members then vote on it at the June Session. Later it can also be tabled in the window (§YShift+C§!), tab Proposals, item D1."
 COLDWAR_CMEA.20.t: "Ballot for the Chair"
 COLDWAR_CMEA.20.d: "The annual ballot for the Chair of the [COLDWAR_CMEA_GetOrgName] is open. Every player delegation casts one sealed vote within §Y15 days§! in the COMECON window (§YShift+C§!): click the flag of a candidate. Most votes win; a tie goes to the next delegation in the Russian alphabetical order."
 COLDWAR_CMEA.21.t: "The Council Has a Chair"
 COLDWAR_CMEA.21.d: "§Y[COLDWAR_CMEA_sn_ev21_target]§! chairs the [COLDWAR_CMEA_GetOrgName] for the coming year."
 COLDWAR_CMEA.22.t: "Election of the Secretary"
 COLDWAR_CMEA.22.d: "Several delegations stand for Secretary of the Council. Every player member votes once within §Y30 days§! in the COMECON window; the vote can be changed until the election closes. Most votes win; a tie goes to the earlier candidacy."
 COLDWAR_CMEA.23.t: "Interkosmos"
 COLDWAR_CMEA.23.d: "A citizen of our country has flown into space with a Soviet crew under the Interkosmos programme of the Council."
 COLDWAR_CMEA.24.t: "A New Five-Year Plan"
 COLDWAR_CMEA.24.d: "A new five-year plan of the Council begins. The sectors filed in the register take effect for five years: specialists gain their bonus, sectors filed by three or more members are parallel production. The register for the next plan opens on 1 January of its last year (Planning tab)."
 COLDWAR_CMEA.ok: "Noted."
