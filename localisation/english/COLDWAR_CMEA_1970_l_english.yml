 COLDWAR_CMEA.41.t: "On the Agenda"
 COLDWAR_CMEA.41.d: "§Y[event_target:COLDWAR_CMEA_agenda_by.GetName]§! has put a proposal on the agenda of the [COLDWAR_CMEA_GetOrgName]. It is drafted first, then the Council votes and every member government led by a player gets a vote. Details are in the window (§YShift+C§!), tab Proposals."
 COLDWAR_CMEA.41.a: "We will look at it."
