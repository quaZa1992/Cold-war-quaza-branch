 COLDWAR_CMEA_nw_A1: "A permanent committee of the planning chiefs co-ordinates the five-year plans of the members. The planned economies of the East move closer together."
 COLDWAR_CMEA_nw_A2: "The Council becomes a subject of international law: it can sign treaties in its own name, with the West too."
 COLDWAR_CMEA_nw_A3: "A member that is not interested can no longer block the others. Those who want to integrate go ahead without it."
 COLDWAR_CMEA_nw_A4: "A supranational organ plans for the whole Council and decides by a two-thirds majority. The members give up sovereignty over their plans, and the smaller ones fear the grip of Moscow."
 COLDWAR_CMEA_nw_A5: "The party leaders of the member countries meet at the summit to set the course of their economic co-operation."
 COLDWAR_CMEA_nw_A6: "The Council is reorganised: fewer committees, more direct co-operation. Its machinery becomes leaner."
 COLDWAR_CMEA_nw_A7: "The Council becomes the Socialist Economic Community: a common market of the planned economies with common institutions."
 COLDWAR_CMEA_nw_A8: "The members dissolve the Council for Mutual Economic Assistance. The economic bloc of the East comes to an end; trade turns to world prices and hard currency."
 COLDWAR_CMEA_nw_B1: "An International Investment Bank finances joint projects of the members: pipelines, plants and mines."
 COLDWAR_CMEA_nw_B2: "Prices in the trade between the members follow the average world price of the past five years. Soviet oil grows dearer for the importers of the East year by year."
 COLDWAR_CMEA_nw_B3: "The transferable rouble becomes convertible. The clearing currency of the East can be changed into hard currency, and its trade opens to the world."
 COLDWAR_CMEA_nw_B4: "The International Investment Bank lends to [COLDWAR_CMEA_news_byname] for its investment projects, to be repaid from its exports to the other members."
 COLDWAR_CMEA_nw_B5: "The trade between the members is settled in hard currency at world prices. The end of cheap Soviet oil means an oil shock for the importers of the East."
 COLDWAR_CMEA_nw_B6: "The members raise a joint credit line on Western markets. Hard currency flows east, and with it the debts."
 COLDWAR_CMEA_nw_C1: "A programme of twenty years for socialist economic integration: joint planning, specialisation and joint projects."
 COLDWAR_CMEA_nw_C2: "The members finance joint integration projects together: pipelines, power lines and plants for the whole bloc."
 COLDWAR_CMEA_nw_C3: "Long-term programmes for energy, raw materials, machinery, food and consumer goods tie the plans of the members together until 1990."
 COLDWAR_CMEA_nw_C4: "The members build one family of compatible computers, the ES EVM: the answer of the East to IBM, without Western licences."
 COLDWAR_CMEA_nw_C5: "A common programme of scientific and technical progress to the year 2000: electronics, automation, nuclear power, new materials and biotechnology."
 COLDWAR_CMEA_nw_C6: "Enterprises of different member countries may deal with each other directly, without the ministries in between. The plan loosens."
 COLDWAR_CMEA_nw_C7: "A joint programme for more and better consumer goods. The shops of the East are to fill."
 COLDWAR_CMEA_nw_D1: "[COLDWAR_CMEA_sn_n_target] is to join the Council for Mutual Economic Assistance. The socialist bloc grows; the new member joins the clearing and the plan co-ordination."
 COLDWAR_CMEA_nw_D2: "[COLDWAR_CMEA_sn_n_target] co-operates with the Council by agreement: trade, credits and joint projects without full membership."
 COLDWAR_CMEA_nw_D3: "[COLDWAR_CMEA_sn_n_target] may attend the sessions of the Council as an observer."
 COLDWAR_CMEA_nw_D4: "Yugoslavia, so far only a partner in some fields, becomes a full member. The country of Tito moves closer to the bloc."
 COLDWAR_CMEA_nw_D5: "The Council and the European Communities recognise each other. Trade across the Iron Curtain eases."
 COLDWAR_CMEA_nw_D6: "China returns to the Council as an observer. The rift between Moscow and Peking begins to close."
