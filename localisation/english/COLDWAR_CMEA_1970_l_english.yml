 COLDWAR_CMEA_ev_res_9: "§GRatified by every member§!. The change of the Charter enters into force in 30 days."
 COLDWAR_CMEA_ev_res_10: "§RThe Secretary declined§! to table this draft."
 COLDWAR_CMEA_ev_res_11: "§GThe programme starts§!: construction begins in a programme file (service programmes: the offer works at once)."
 COLDWAR_CMEA_ev_res_12: "§GCompleted§!: the works and the effects of the programme are in place."
 COLDWAR_CMEA_ev_res_13: "§RNo place for a further programme abroad§! (three run at once)."
 COLDWAR_CMEA_ev_res_15: "The programme has ended; its offer no longer works."
 COLDWAR_CMEA_ev_res_16: "A new five-year plan begins."
 COLDWAR_CMEA_ev_res_17: "§RClosed§!: the country concerned has left the Council or no longer exists. Nothing enters into force."
 COLDWAR_CMEA_ev_res_inforce: "§GIn force§! for the bound members of the [COLDWAR_CMEA_GetOrgName]."
