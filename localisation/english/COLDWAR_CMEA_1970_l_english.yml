 COLDWAR_CMEA_chair_tt: "§HChair of the Council§!\nEvery player member stands for the Chair. Each year on 1 January the player delegations cast one sealed vote within 15 days, in SESSION, view OFFICES. The most votes win; a tie goes to the next delegation in the Russian alphabetical order. Until the first ballot the first player member in that order holds the Chair.\nThe Chair puts one file first on the agenda once per term and runs the Secretariat while no Secretary is in office. An office held by an AI government tables every requested draft at once, so the vote always takes place."
 COLDWAR_CMEA_secretary_tt: "§HSecretary of the Council§!\nWhile the candidacy is open, a player member stands in SESSION, view OFFICES, with §YStand for Secretary§! (50 political power). With two or more candidates the player members elect by plurality; a lone candidate is elected. The term is four years.\nThe Secretary tables or refuses drafts and pays half for his own requests. An office held by an AI government tables every requested draft at once, so the vote always takes place."
 COLDWAR_CMEA_session_tt: "§HSession of the Council§!\nThe Council meets once a year in June. Files on the agenda come before the Executive Committee in order."
