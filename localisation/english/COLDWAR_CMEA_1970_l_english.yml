 COLDWAR_CMEA_member: "Member of the [COLDWAR_CMEA_GetOrgName]"
 COLDWAR_CMEA_member_desc: "We trade inside the socialist division of labour, receive Soviet oil and raw materials at the prices of the Bucharest formula and coordinate our five-year plans with the other members. The plan discipline weighs on our own decisions."
 COLDWAR_CMEA_associate: "Partner of the [COLDWAR_CMEA_GetOrgName]"
 COLDWAR_CMEA_associate_desc: "An agreement with the Council lets us take part in its programmes and trade under its terms without full membership."
 COLDWAR_CMEA_observer: "Observer at the [COLDWAR_CMEA_GetOrgName]"
 COLDWAR_CMEA_observer_desc: "Our delegation follows the Sessions of the Council in Moscow and may receive its programmes."
 COLDWAR_CMEA_presidency: "Chair of the Council"
 COLDWAR_CMEA_presidency_desc: "For one year our delegation chairs the Council for Mutual Economic Assistance, elected by the player delegations."
 COLDWAR_CMEA_commission_president: "Secretary of the Council"
 COLDWAR_CMEA_commission_president_desc: "One of our officials leads the Secretariat in Moscow, the only permanent organ of the Council, for four years."
 COLDWAR_CMEA_cosmonaut: "Interkosmos Cosmonaut"
 COLDWAR_CMEA_cosmonaut_desc: "A citizen of our country has flown into space with a Soviet crew."
 COLDWAR_CMEA_t_A6: "COMECON: Restructuring of the Council"
 COLDWAR_CMEA_t_A6_desc: "A decision of the Council weighs on us for a while."
 COLDWAR_CMEA_t_B2: "COMECON: The Bucharest Formula: Annual Moving Average"
 COLDWAR_CMEA_t_B2_desc: "A decision of the Council weighs on us for a while."
 COLDWAR_CMEA_t_B5: "COMECON: Settlement in Hard Currency at World Prices"
 COLDWAR_CMEA_t_B5_desc: "A decision of the Council weighs on us for a while."
