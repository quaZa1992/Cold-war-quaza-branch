 COLDWAR_CMEA_ev_res_1: "§GAdopted§!: For [?global.cwcm_last_nf|0], Not interested [?global.cwcm_last_nn|0], Against [?global.cwcm_last_na|0] of [?global.cwcm_last_n|0] player delegations. A recommendation binds those who voted For and the passive members; a decision binds every member."
