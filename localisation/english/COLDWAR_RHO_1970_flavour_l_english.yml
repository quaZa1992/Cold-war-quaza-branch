 COLDWAR_RHO_EVT.1.t: "Proclamation of the Republic of Rhodesia"
 COLDWAR_RHO_EVT.1.d: "Following the 1969 constitutional referendum, Parliament prepares to dissolve ties to the British Crown and swear in Clifford Dupont as President of the Republic of Rhodesia."
 COLDWAR_RHO_EVT.1.a: "Proclaim the Republic under President Dupont"
 COLDWAR_RHO_EVT.1.b: "Delay the republican break to keep London channels open"
 COLDWAR_RHO_EVT.2.t: "The Pearce Commission Verdict"
 COLDWAR_RHO_EVT.2.d: "Lord Pearce's British commission reports overwhelming African opposition organized by Bishop Abel Muzorewa's ANC against the gradual tax-parity settlement."
 COLDWAR_RHO_EVT.2.a: "Stand by the 1969 Constitution"
 COLDWAR_RHO_EVT.2.b: "Reopen talks with Muzorewa and moderate African leaders"
 COLDWAR_RHO_EVT.3.t: "The Rhodesian Action Party Parliamentary Split"
 COLDWAR_RHO_EVT.3.d: "Twelve Rhodesian Front MPs led by Ted Sutton-Pryce and Des Frost break away to form the Rhodesian Action Party, stripping the government of its two-thirds majority."
 COLDWAR_RHO_EVT.3.a: "Call a snap election to crush the split"
 COLDWAR_RHO_EVT.3.b: "Concede cantonal safeguards to the right wing"
 COLDWAR_RHO_EVT.4.t: "The Internal Settlement: Zimbabwe-Rhodesia"
 COLDWAR_RHO_EVT.4.d: "Ian Smith, Bishop Abel Muzorewa, Chief Jeremiah Chirau, and Rev. Ndabaningi Sithole sign a multiracial transitional constitution establishing Zimbabwe-Rhodesia."
 COLDWAR_RHO_EVT.4.a: "Proclaim Zimbabwe-Rhodesia under Prime Minister Muzorewa"
 COLDWAR_RHO_EVT.4.b: "Keep Salisbury executive control pending an external ceasefire"
 COLDWAR_RHO_EVT.5.t: "Lancaster House and Independence of Zimbabwe"
 COLDWAR_RHO_EVT.5.d: "Following all-party talks in London, the ceasefire takes effect and the internationally recognized Republic of Zimbabwe is proclaimed with twenty reserved white parliamentary seats for seven years."
 COLDWAR_RHO_EVT.5.a: "Proclaim the Republic of Zimbabwe"
 COLDWAR_RHO_EVT.6.t: "The 1987 Unity Accord and Tekere's ZUM Challenge"
 COLDWAR_RHO_EVT.6.d: "After the expiry of the seven-year Lancaster House white-seat clause, Harare weighs a negotiated ZANU-ZAPU Unity Accord against multiparty contestation with Edgar Tekere's Zimbabwe Unity Movement."
 COLDWAR_RHO_EVT.6.a: "Sign the Unity Accord with Joshua Nkomo"
 COLDWAR_RHO_EVT.6.b: "Permit multiparty competition with Tekere's ZUM"
