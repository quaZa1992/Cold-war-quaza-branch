 COLDWAR_RHO_un_mandatory_sanctions: "UN Mandatory Sanctions & Beira Patrol"
 COLDWAR_RHO_un_mandatory_sanctions_desc: "UNSCR 221 (April 1966 Beira Patrol), UNSCR 232 (Dec 1966), UNSCR 253 (May 1968), and UNSCR 277 (March 1970) cut Rhodesia off from open trade, fuel tankers, and foreign credit. Fully lifted only via genuine diplomatic recognition (ENG Constitutional Settlement / Lancaster House). Otherwise transforms via Siege Economy into Clandestine Sanctions-Busting."
 COLDWAR_RHO_clandestine_sanctions_busting: "Clandestine Sanctions-Busting"
 COLDWAR_RHO_clandestine_sanctions_busting_desc: "Evolved structural condition from UN Mandatory Sanctions & Beira Patrol via Siege Economy (GENTA & Affretair Free-Booter Network)."
 COLDWAR_RHO_unrecognized_udi_state: "Unrecognized UDI Administration"
 COLDWAR_RHO_unrecognized_udi_state_desc: "Zero de jure international recognition forces Salisbury to rely on semi-official missions in Pretoria, Lisbon, and Washington while paying sovereign risk premiums. Swaps in March 1970 to Unrecognized Republic of Rhodesia; replaced by Transitional Constitutional Safeguards upon recognized settlement."
 COLDWAR_RHO_unrecognized_republic: "Unrecognized Republic of Rhodesia"
 COLDWAR_RHO_unrecognized_republic_desc: "Evolved structural condition from Unrecognized UDI Administration via March 2, 1970 Republic Proclamation Event."
 COLDWAR_RHO_transitional_constitutional_safeguards: "Transitional Constitutional Safeguards"
 COLDWAR_RHO_transitional_constitutional_safeguards_desc: "Evolved structural condition from Unrecognized UDI Administration via Anglo-Rhodesian Settlement / Lancaster House."
 COLDWAR_RHO_specialist_bottleneck: "Skilled Specialist Bottleneck & Emigration Drain"
 COLDWAR_RHO_specialist_bottleneck_desc: "Restricting technical, aviation, and managerial training to ~230,000 Europeans leaves industry and research exposed to call-ups and white emigration. Permanently non-curable to zero. Uses zero workforce-size penalties; transforms into Call-Up & Chicken-Run Drain or Mass Technical Training Fiscal Strain."
 COLDWAR_RHO_callup_chicken_run: "Call-Up & Chicken-Run Drain"
 COLDWAR_RHO_callup_chicken_run_desc: "Evolved structural condition from Skilled Specialist Bottleneck & Emigration Drain via Laager / Prolonged Bush War Mobilization."
 COLDWAR_RHO_mass_technical_strain: "Mass Technical Training Fiscal Strain"
 COLDWAR_RHO_mass_technical_strain_desc: "Evolved structural condition from Skilled Specialist Bottleneck & Emigration Drain via Majority / Reformist Education Expansion."
 COLDWAR_RHO_land_tenure_divide: "1969 Land Tenure Act & Overcrowded TTLs"
 COLDWAR_RHO_land_tenure_divide_desc: "The 1969 Land Tenure Act split Rhodesia into 45M European acres and 45M African acres, protecting commercial export farms while crowding rural families into fragile Tribal Trust Lands. Dual-edged: keeping it preserves white commercial farm yields at chronic insurgency risk; reforming swaps to Contested Land Settlement."
 COLDWAR_RHO_contested_land_settlement: "Contested Land Settlement"
 COLDWAR_RHO_contested_land_settlement_desc: "Evolved structural condition from 1969 Land Tenure Act & Overcrowded TTLs via Land Tenure Repeal / Willing-Buyer or Resettlement Reform."
 COLDWAR_RHO_second_chimurenga: "Second Chimurenga Escalation"
 COLDWAR_RHO_second_chimurenga_desc: "ZIPRA in Zambia and ZANLA in Mozambique wage competing insurgencies across Rhodesia's borders and rural Tribal Trust Lands. Transforms into either Garrisoned Counter-Insurgency State (Rhodesian security path) or Ex-Combatant & Dissident Integration Crisis (post-settlement)."
 COLDWAR_RHO_garrisoned_coin_state: "Garrisoned Counter-Insurgency State"
 COLDWAR_RHO_garrisoned_coin_state_desc: "Evolved structural condition from Second Chimurenga Escalation via COMOPS / RF / RAP Prolonged Security Path."
 COLDWAR_RHO_ex_combatant_integration: "Ex-Combatant & Dissident Integration Crisis"
 COLDWAR_RHO_ex_combatant_integration_desc: "Evolved structural condition from Second Chimurenga Escalation via Majority Transition / Lancaster House Settlement."
 COLDWAR_RHO_isi_siege_economy: "ACCOR/ARnI Import-Substitution Boom"
 COLDWAR_RHO_isi_siege_economy_desc: "Behind UN sanctions and ACCOR/ARnI foreign-exchange quotas, local factories boomed (+6.63% GDP in 1974), but aging capital machinery and inflation threaten stagflation. Dual-edged starting economy; evolves into Rationed Autarkic Corporatism or Structural Adjustment Exposure."
 COLDWAR_RHO_rationed_autarkic_corporatism: "Rationed Autarkic Corporatism"
 COLDWAR_RHO_rationed_autarkic_corporatism_desc: "Evolved structural condition from ACCOR/ARnI Import-Substitution Boom via Siege Economy / RF / RAP State Controls."
 COLDWAR_RHO_structural_adjustment_exposure: "Structural Adjustment Exposure"
 COLDWAR_RHO_structural_adjustment_exposure_desc: "Evolved structural condition from ACCOR/ARnI Import-Substitution Boom via Post-Sanctions Trade Opening / Liberalization."
 COLDWAR_RHO_integrated_national_army: "Integrated National Army"
 COLDWAR_RHO_integrated_national_army_desc: "Tripartite BMATT integration brings ZIPRA, ZANLA, and former Rhodesian Security Forces under one professional command."
 COLDWAR_RHO_officer_integration_friction: "Officer Integration Friction"
 COLDWAR_RHO_officer_integration_friction_desc: "Rival command traditions and mistrust between former guerrilla commanders and regular officers temporarily hamper staff cohesion."
 COLDWAR_RHO_highveld_industrial_base: "Highveld Industrial Base"
 COLDWAR_RHO_highveld_industrial_base_desc: "Diversified agro-processing, ferrochrome metallurgy, and domestic energy generation anchor southern Africa's second industrial hub."
 COLDWAR_RHO_highveld_doctrine: "Highveld Armed Forces Doctrine"
 COLDWAR_RHO_highveld_doctrine_desc: "Two decades of bush counter-insurgency and air-mobile warfare forge a hardened combined-arms defense establishment."
 COLDWAR_RHO_southern_african_hub: "Southern African Strategic Hub"
 COLDWAR_RHO_southern_african_hub_desc: "Accredited diplomatic channels, mineral exports, and regional rail corridors position Salisbury or Harare at the heart of southern Africa."
 COLDWAR_RHO_security_directorate: "Salisbury Security Directorate"
 COLDWAR_RHO_security_directorate_desc: "Permanent emergency powers coordinate Special Branch, CIO, and Internal Affairs against internal subversion at elevated policing cost."
 COLDWAR_RHO_chiefs_stipends: "Provincial Chiefs' Stipends"
 COLDWAR_RHO_chiefs_stipends_desc: "Salisbury pays regular stipends and administrative allowances to the Council of Chiefs to bolster rural compliance."
 COLDWAR_RHO_reserved_seat_safeguards: "Reserved Constitutional Roll"
 COLDWAR_RHO_reserved_seat_safeguards_desc: "Entrenched parliamentary safeguards protect commercial property and civil-service pensions while constraining executive discretion."
 COLDWAR_RHO_reserve_discipline: "Salisbury Reserve Discipline"
 COLDWAR_RHO_reserve_discipline_desc: "Tight Reserve Bank monetary discipline supports the Rhodesian Dollar and eases borrowing rates at the expense of domestic consumption."
 COLDWAR_RHO_rf_capstone_spirit: "Salisbury Bastion"
 COLDWAR_RHO_rf_capstone_spirit_desc: "The Rhodesian Front consolidates its republican state, industrial self-reliance, and security apparatus against prolonged isolation."
 COLDWAR_RHO_zimbabwe_rhodesia_charter_spirit: "Zimbabwe-Rhodesia Constitutional Compromise"
 COLDWAR_RHO_zimbabwe_rhodesia_charter_spirit_desc: "A multiracial cabinet shares power under entrenched civil-service and judicial guarantees, improving foreign goodwill while limiting executive freedom."
 COLDWAR_RHO_mod_capstone_spirit: "Constitutional Partnership"
 COLDWAR_RHO_mod_capstone_spirit_desc: "Negotiated multiracial governance restores international commercial confidence and civic compliance alongside expanded social outlays."
 COLDWAR_RHO_ranching_board: "National Ranching & Cold Storage Board"
 COLDWAR_RHO_ranching_board_desc: "Public ranching cooperatives and cold-storage abattoirs expand Matabeleland cattle output at modest weekly treasury support."
 COLDWAR_RHO_zapu_capstone_spirit: "Father Zimbabwe's Industrial Republic"
 COLDWAR_RHO_zapu_capstone_spirit_desc: "ZAPU pairs unified industrial planning, disciplined conventional forces, and broad social welfare across Mashonaland and Matabeleland."
 COLDWAR_RHO_peasant_collectives: "Chimurenga Peasant Collectives"
 COLDWAR_RHO_peasant_collectives_desc: "Rural resettlement cooperatives anchor party mobilization in the countryside while disrupting commercial farm yields."
 COLDWAR_RHO_rural_clinics_spirit: "Primary Health & Vaccination Network"
 COLDWAR_RHO_rural_clinics_spirit_desc: "Rural clinics and immunization drives raise living standards and population growth while expanding recurring healthcare spending."
 COLDWAR_RHO_executive_presidency_spirit: "Harare Executive State"
 COLDWAR_RHO_executive_presidency_spirit_desc: "Centralized presidential authority fortifies regime ideological cohesion while increasing patronage and administrative graft."
 COLDWAR_RHO_zanu_capstone_spirit: "Chimurenga Sovereignty"
 COLDWAR_RHO_zanu_capstone_spirit_desc: "ZANU entrenches mass literacy, mineral nationalism, and ideological resilience across the newly independent republic."
 COLDWAR_RHO_martial_tribunals: "Martial Law Tribunals"
 COLDWAR_RHO_martial_tribunals_desc: "Summary security courts accelerate counter-insurgency prosecutions while eroding civic stability and international trade standing."
 COLDWAR_RHO_volunteer_cadres: "Veteran Volunteer Cadres"
 COLDWAR_RHO_volunteer_cadres_desc: "Contracted southern African and overseas veterans bolster Rhodesian special forces and unit cohesion at recurring weekly payroll cost."
 COLDWAR_RHO_rap_capstone_spirit: "The Iron Laager"
 COLDWAR_RHO_rap_capstone_spirit_desc: "Hardline cantonal mobilization turns Rhodesia into an entrenched siege garrison at steep diplomatic and technological cost."
 COLDWAR_RHO_dec_raid_active_idea: "Disrupted Insurgent Sanctuaries"
 COLDWAR_RHO_dec_raid_active_idea_desc: "Cross-border COMOPS strikes have temporarily scattered external staging camps at the price of international condemnation."
 COLDWAR_RHO_dec_cordon_active_idea: "Rural Cordon Active"
 COLDWAR_RHO_dec_cordon_active_idea_desc: "Coordinated CIO and BSAP sweeps tighten rural district compliance while increasing security expenditure."
 COLDWAR_RHO_dec_bop_emergency_idea: "Renewed Emergency Powers"
 COLDWAR_RHO_dec_bop_emergency_idea_desc: "Extended detention and censorship decrees assist security operations while depressing civic stability."
 COLDWAR_RHO_dec_bop_segregation_idea: "Relaxed Municipal Segregation"
 COLDWAR_RHO_dec_bop_segregation_idea_desc: "Opening urban hotels and civic facilities improves external trade goodwill."
 COLDWAR_RHO_dec_bop_talks_idea: "All-Party Constitutional Talks"
