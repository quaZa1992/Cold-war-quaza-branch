 COLDWAR_RHO_rf_root_desc: "Clifford Dupont assumes the presidency as Salisbury severs its last formal tie to the British Crown and consolidates the 1969 republican charter."
 COLDWAR_RHO_rf_pol_wing: "Salisbury Cabinet Alignment"
 COLDWAR_RHO_rf_pol_wing_desc: "Ian Smith balances Treasury pragmatists against law-and-order hardliners inside the Rhodesian Front parliamentary caucus."
 COLDWAR_RHO_rf_econ_wing: "Administer the 1969 Charter"
 COLDWAR_RHO_rf_econ_wing_desc: "Internal Affairs and Commerce align parliamentary roll administration with the Land Tenure Act and wartime import quotas."
 COLDWAR_RHO_rf_pragmatists: "Empower Wrathall & David Smith"
 COLDWAR_RHO_rf_pragmatists_desc: "Treasury and Agriculture pragmatists prioritize currency discipline, commercial exports, and quiet diplomatic channels over ideological posturing."
 COLDWAR_RHO_rf_hardliners: "Lardner-Burke & van der Byl Line"
 COLDWAR_RHO_rf_hardliners_desc: "Justice and Information hardliners tighten emergency detention, press censorship, and uncompromising defiance against external mediators."
 COLDWAR_RHO_rf_tax_parity: "Income-Tax Parity Franchise Review"
 COLDWAR_RHO_rf_tax_parity_desc: "Salisbury accelerates the 1969 Constitution's income-tax parity threshold to signal gradualist credibility to London and moderate African taxpayers."
 COLDWAR_RHO_rf_strict_land_tenure: "Enforce the Land Tenure Partition"
 COLDWAR_RHO_rf_strict_land_tenure_desc: "Government strictly enforces the 45-million-acre commercial farming boundary, securing white estate exports while sharpening rural land grievance."
 COLDWAR_RHO_rf_wrathall_discipline: "Salisbury Export Credit Board"
 COLDWAR_RHO_rf_wrathall_discipline_desc: "The Treasury channels domestic savings into Salisbury's export manufacturers while holding inflation below regional wartime averages."
 COLDWAR_RHO_rf_emergency_powers: "Law & Order Maintenance Directorate"
 COLDWAR_RHO_rf_emergency_powers_desc: "Permanent emergency regulations expand Special Branch detention powers and centralize wartime censorship under Justice and Internal Affairs."
 COLDWAR_RHO_rf_african_purchase_credit: "African Purchase Area Credit"
 COLDWAR_RHO_rf_african_purchase_credit_desc: "Agricultural Finance Corporation loans expand small-scale commercial farms in African Purchase Areas to cultivate a moderate rural middle class."
 COLDWAR_RHO_rf_ttl_chiefs_council: "Council of Chiefs Rural Authority"
 COLDWAR_RHO_rf_ttl_chiefs_council_desc: "Internal Affairs channels rural road grants and judicial stipends through the Senate Council of Chiefs to anchor traditional authority in the TTLs."
 COLDWAR_RHO_rf_caucus_merge: "Renew the Front Mandate"
 COLDWAR_RHO_rf_caucus_merge_desc: "A unified party congress reaffirms Ian Smith's leadership ahead of intensifying regional and diplomatic shocks."
 COLDWAR_RHO_rf_domestic_merge: "Reassess the Siege Order"
 COLDWAR_RHO_rf_domestic_merge_desc: "Cabinet ministries audit fuel reserves, skilled manpower, and foreign exchange as regional decolonization reshapes Rhodesia's borders."
 COLDWAR_RHO_rf_internal_settlement_pivot: "The 1978 Internal Settlement Pivot"
 COLDWAR_RHO_rf_internal_settlement_pivot_desc: "Ian Smith opens executive negotiations with Bishop Muzorewa, Chief Chirau, and Rev. Sithole to form a moderate multiracial government while preserving white institutional safeguards."
 COLDWAR_RHO_rf_fortress_zambezi: "Fortress Zambezi Defiance"
 COLDWAR_RHO_rf_fortress_zambezi_desc: "Salisbury rejects Kissinger-style timetables, digs in along the Zambezi and eastern highlands, and mobilizes the state for indefinite siege survival."
 COLDWAR_RHO_rf_white_emigration_controls: "Emigration Currency Freeze"
 COLDWAR_RHO_rf_white_emigration_controls_desc: "Strict Reserve Bank limits on emigrating households cap capital flight at a few hundred dollars per family, slowing the skilled-specialist exodus."
 COLDWAR_RHO_rf_arni_war_corporatism: "ARnI Wartime Industrial Board"
 COLDWAR_RHO_rf_arni_war_corporatism_desc: "Commerce merges ARnI factory allocations with defense procurement, converting civilian workshops to produce armored hulls and vehicle spares."
 COLDWAR_RHO_rf_transitional_safeguards: "Entrench Reserved Seat Safeguards"
 COLDWAR_RHO_rf_transitional_safeguards_desc: "Constitutional lawyers codify reserved parliamentary representation, pension guarantees, and independent judicial commissions during transition."
 COLDWAR_RHO_rf_garrison_cantons: "Garrisoned Provincial Cantons"
 COLDWAR_RHO_rf_garrison_cantons_desc: "Provincial martial administration fortifies commercial farming corridors and key rail junctions into self-defending security zones."
 COLDWAR_RHO_rf_rhodesian_dollar_peg: "Defend the Rhodesian Dollar"
 COLDWAR_RHO_rf_rhodesian_dollar_peg_desc: "The Reserve Bank of Rhodesia anchors the decimalized Rhodesian Dollar to gold and rand trade clearings, keeping domestic credit solvent."
 COLDWAR_RHO_rf_tobacco_floor_board: "Tobacco & Grain Floor Board"
 COLDWAR_RHO_rf_tobacco_floor_board_desc: "The Tobacco Corporation and Grain Marketing Board guarantee commercial floor prices while warehousing strategic export stockpiles."
 COLDWAR_RHO_rf_constitutional_mandate: "Consolidate the Salisbury Executive"
 COLDWAR_RHO_rf_constitutional_mandate_desc: "Whether through reserved-seat power-sharing or entrenched provincial garrisons, Salisbury locks in its institutional survival framework for the 1980s."
 COLDWAR_RHO_rf_siege_treasury_anchor: "Central African Industrial Hub"
 COLDWAR_RHO_rf_siege_treasury_anchor_desc: "Bulawayo and Salisbury emerge as Southern Africa's second-largest manufacturing complex outside the Witwatersrand."
 COLDWAR_RHO_rf_capstone: "The Rhodesian Front Legacy"
 COLDWAR_RHO_rf_capstone_desc: "Salisbury completes its two-decade transformation into a hardened, self-reliant constitutional bastion commanding the Zambezi frontier."
 COLDWAR_RHO_mod_root: "Constitutional Convention of Salisbury"
 COLDWAR_RHO_mod_root_desc: "Moderate parliamentary opposition, church leaders, and the Council of Chiefs open a constitutional convention to replace unilateral minority rule with negotiated power-sharing."
 COLDWAR_RHO_mod_constitutional_track: "The Franchise & Settlement Question"
 COLDWAR_RHO_mod_constitutional_track_desc: "Constitutional drafters weigh a color-blind qualified merit franchise against a rapid universal-suffrage internal settlement with white institutional safeguards."
 COLDWAR_RHO_mod_socioeconomic_track: "Broaden the Property-Owning Base"
 COLDWAR_RHO_mod_socioeconomic_track_desc: "Salisbury reforms urban tenancy, commercial credit, and rural administration to build a multiracial stakeholder economy."
 COLDWAR_RHO_mod_bashford_savory_merit: "Bashford-Savory Merit Franchise"
 COLDWAR_RHO_mod_bashford_savory_merit_desc: "Pat Bashford and Allan Savory institute a non-racial merit franchise and repeal petty segregation to win British and Commonwealth recognition before guerrilla escalation."
 COLDWAR_RHO_mod_muzorewa_internal_settlement: "Muzorewa & Chirau Internal Settlement"
 COLDWAR_RHO_mod_muzorewa_internal_settlement_desc: "Bishop Abel Muzorewa's UANC, Chief Jeremiah Chirau's ZUPO, and Rev. Sithole sign a universal-suffrage pact guaranteeing minority civil-service continuity."
 COLDWAR_RHO_mod_african_purchase_credit: "Freehold African Farm Credit"
 COLDWAR_RHO_mod_african_purchase_credit_desc: "State agricultural banks open long-term freehold mortgages to African commercial farmers across Mashonaland and Manicaland."
 COLDWAR_RHO_mod_chiefs_devolution: "Provincial Chiefs' Development Councils"
 COLDWAR_RHO_mod_chiefs_devolution_desc: "Chief Jeremiah Chirau's ZUPO empowers provincial tribal councils to manage rural feeder roads, irrigation, and customary courts."
 COLDWAR_RHO_mod_early_land_repeal: "Repeal the 1969 Land Tenure Act"
 COLDWAR_RHO_mod_early_land_repeal_desc: "Parliament abolishes racial land partition, opening commercial farmland and urban suburbs to non-racial market purchase."
 COLDWAR_RHO_mod_zimbabwe_rhodesia_charter: "Proclaim Zimbabwe-Rhodesia"
 COLDWAR_RHO_mod_zimbabwe_rhodesia_charter_desc: "Bishop Muzorewa takes office as Prime Minister of Zimbabwe-Rhodesia under a multiracial cabinet retaining experienced judicial and security commissions."
 COLDWAR_RHO_mod_urban_middle_class: "Salisbury-Bulawayo Commercial Expansion"
 COLDWAR_RHO_mod_urban_middle_class_desc: "Lifting urban business licensing barriers draws African entrepreneurs into Salisbury and Bulawayo's commercial chambers."
 COLDWAR_RHO_mod_tribal_court_authority: "Rural Irrigation & Customary Courts"
 COLDWAR_RHO_mod_tribal_court_authority_desc: "Provincial councils direct dam construction and livestock extension across Matabeleland and Masvingo to relieve Tribal Trust Land overcrowding."
 COLDWAR_RHO_mod_multiracial_cabinet: "Multiracial Civil Service Commission"
 COLDWAR_RHO_mod_multiracial_cabinet_desc: "Accelerated African recruitment into ministries, engineering boards, and technical colleges broadens state capacity while retaining experienced civil servants."
 COLDWAR_RHO_mod_civic_consensus: "National Economic Consultative Council"
 COLDWAR_RHO_mod_civic_consensus_desc: "Business chambers, African trade unions, and commercial farmers coordinate wages, foreign exchange, and investment policy."
 COLDWAR_RHO_mod_western_recognition_drive: "London & Washington Recognition Drive"
 COLDWAR_RHO_mod_western_recognition_drive_desc: "Envoys lobby Conservative Westminster MPs and the US Senate to certify the multiracial elections and lift UN economic sanctions."
 COLDWAR_RHO_mod_pfumo_revanhu_security: "Expand Pfumo reVanhu Auxiliaries"
 COLDWAR_RHO_mod_pfumo_revanhu_security_desc: "UANC and ZANU-Sithole loyalist militias deploy across rural kraals to contest guerrilla control and protect polling stations."
 COLDWAR_RHO_mod_technical_colleges: "Polytechnic & University Expansion"
 COLDWAR_RHO_mod_technical_colleges_desc: "New engineering and agricultural faculties at the University of Rhodesia and Bulawayo Polytechnic train an integrated technical workforce."
 COLDWAR_RHO_mod_commonwealth_trade: "Sterling Area & Export Normalization"
 COLDWAR_RHO_mod_commonwealth_trade_desc: "Salisbury re-establishes London commodity clearing houses for tobacco, beef, and ferrochrome under Commonwealth preference rules."
 COLDWAR_RHO_mod_capstone: "The Multiracial Constitutional Republic"
 COLDWAR_RHO_mod_capstone_desc: "A recognized, conservative multiracial republic anchors Southern Africa as an open commercial democracy bridging minority capital and majority citizenship."
 COLDWAR_RHO_zapu_root: "Father Zimbabwe's National Mandate"
 COLDWAR_RHO_zapu_root_desc: "Joshua Nkomo and the Zimbabwe African People's Union take power in Salisbury, promising inclusive national unity across Matabeleland and Mashonaland."
 COLDWAR_RHO_zapu_state_track: "Reorganize the People's Republic"
 COLDWAR_RHO_zapu_state_track_desc: "ZAPU's National Executive debates retaining experienced white technocrats in a mixed economy versus centralizing ministries under a People's Planning Council."
 COLDWAR_RHO_zapu_labour_track: "Bulawayo Industrial & Rural Front"
 COLDWAR_RHO_zapu_labour_track_desc: "Drawing on Nkomo's railway union roots, the government channels reconstruction investment into Bulawayo's workshops and Matabeleland's rural economy."
 COLDWAR_RHO_zapu_national_reconciliation: "National Reconciliation & Technocrats"
 COLDWAR_RHO_zapu_national_reconciliation_desc: "Nkomo invites white engineers, commercial farmers, and civil servants to remain in a mixed national-reconciliation administration."
 COLDWAR_RHO_zapu_peoples_planning_council: "Vanguard People's Planning Council"
 COLDWAR_RHO_zapu_peoples_planning_council_desc: "Following Jason Moyo's socialist blueprint, central planners establish five-year industrial targets and public equity boards across key sectors."
 COLDWAR_RHO_zapu_bulawayo_rail_unions: "Bulawayo Railway & Heavy Unionism"
 COLDWAR_RHO_zapu_bulawayo_rail_unions_desc: "Unionized locomotive depots and steel workshops in Bulawayo become the backbone of national freight modernization."
 COLDWAR_RHO_zapu_agro_cooperatives: "Agro-Industrial Cooperatives"
 COLDWAR_RHO_zapu_agro_cooperatives_desc: "Demobilized ZIPRA cadres and rural smallholders pool equipment into mechanized cattle ranches and grain cooperatives."
 COLDWAR_RHO_zapu_white_technocrat_retention: "Joint Technical Retention Charter"
 COLDWAR_RHO_zapu_white_technocrat_retention_desc: "Paired apprenticeship contracts match veteran Rhodesian engineers with newly returned ZAPU university graduates across mines and utilities."
 COLDWAR_RHO_zapu_state_industrial_board: "National State Manufacturing Trust"
 COLDWAR_RHO_zapu_state_industrial_board_desc: "Public holding trusts acquire majority stakes in strategic foundries, textiles, and railway rolling-stock plants."
 COLDWAR_RHO_zapu_heavy_rail_workshops: "Bulawayo Heavy Engineering Complex"
 COLDWAR_RHO_zapu_heavy_rail_workshops_desc: "Expanded locomotive and steel fabrication plants in Bulawayo anchor Southern Africa's regional freight hub."
 COLDWAR_RHO_zapu_matabeleland_ranching: "Zambezi-Matabeleland Water & Beef"
 COLDWAR_RHO_zapu_matabeleland_ranching_desc: "State abattoirs and borehole irrigation expand beef exports from Matabeleland and Masvingo to European and regional markets."
 COLDWAR_RHO_zapu_civic_settlement: "All-Region Constitutional Accord"
 COLDWAR_RHO_zapu_civic_settlement_desc: "Balanced ministerial appointments between Matabeleland, Midlands, and Mashonaland avert post-war regional polarization."
 COLDWAR_RHO_zapu_mixed_industrial_charter: "Southern Rail & Labour Charter"
 COLDWAR_RHO_zapu_mixed_industrial_charter_desc: "Unified labour boards standardize industrial wages and freight tariffs across Rhodesia's rail corridors."
 COLDWAR_RHO_zapu_zipra_regularization: "ZIPRA Mechanized Regularization"
 COLDWAR_RHO_zapu_zipra_regularization_desc: "Lookout Masuku and Nikita Mangena's conventional staff doctrine transforms ZIPRA's motorized battalions into a disciplined regular army."
 COLDWAR_RHO_zapu_nonaligned_federalism: "Provincial Federal Assembly"
 COLDWAR_RHO_zapu_nonaligned_federalism_desc: "Constitutional devolution establishes elected provincial assemblies in Bulawayo, Salisbury, and Mutare within a non-aligned republic."
 COLDWAR_RHO_zapu_soviet_technical_cadres: "Comecon Industrial Cadre Exchange"
 COLDWAR_RHO_zapu_soviet_technical_cadres_desc: "Soviet and East German engineering instructors modernize heavy metallurgy and power generation in exchange for long-term mineral clearing agreements."
 COLDWAR_RHO_zapu_sadcc_transit_corridor: "Zambezi-Limpopo Regional Transit Hub"
 COLDWAR_RHO_zapu_sadcc_transit_corridor_desc: "Integrated rail links with Zambia, Botswana, and Mozambique position Bulawayo and Salisbury as the logistics heart of SADCC."
 COLDWAR_RHO_zapu_capstone: "The Unified People's Republic"
 COLDWAR_RHO_zapu_capstone_desc: "Under ZAPU's industrial and regional settlement, Zimbabwe unites Matabeleland and Mashonaland into a formidable non-aligned manufacturing power."
 COLDWAR_RHO_zanu_root: "The Chimurenga Victory Mandate"
 COLDWAR_RHO_zanu_root_desc: "Robert Mugabe and ZANU assume power in Harare, mobilizing the liberation movement's rural network to remake the colonial state."
 COLDWAR_RHO_zanu_revolution_track: "The Land & Lancaster Question"
 COLDWAR_RHO_zanu_revolution_track_desc: "Harare decides whether to honor Lancaster House willing-buyer property clauses to protect commercial grain exports or accelerate revolutionary land redistribution."
 COLDWAR_RHO_zanu_reconstruction_track: "Growth with Equity Programme"
 COLDWAR_RHO_zanu_reconstruction_track_desc: "ZANU's 1981 Growth with Equity blueprint balances massive rural social investment against state participation in the Great Dyke mining economy."
 COLDWAR_RHO_zanu_lancaster_continuity: "Lancaster Willing-Buyer Continuity"
 COLDWAR_RHO_zanu_lancaster_continuity_desc: "Harare honors Lancaster House property protections, keeping commercial tobacco and maize estates running while purchasing abandoned farms on the market."
 COLDWAR_RHO_zanu_chimurenga_land_seizure: "Radical Chimurenga Land Seizure"
 COLDWAR_RHO_zanu_chimurenga_land_seizure_desc: "Party committees bypass Lancaster restrictions to expropriate commercial estates immediately for war veterans and landless peasants."
 COLDWAR_RHO_zanu_mass_rural_schooling: "Mass Rural Schooling Drive"
 COLDWAR_RHO_zanu_mass_rural_schooling_desc: "Free primary schooling and hundreds of new rural secondary schools raise Zimbabwe to Africa's highest literacy rate at a heavy fiscal cost."
 COLDWAR_RHO_zanu_zmdc_parastatals: "ZMDC Parastatal Mining & Industry"
 COLDWAR_RHO_zanu_zmdc_parastatals_desc: "The Zimbabwe Mining Development Corporation and Minerals Marketing Corporation centralize chrome, gold, and nickel revenues under state oversight."
 COLDWAR_RHO_zanu_willing_buyer_fund: "British Resettlement Grant Fund"
 COLDWAR_RHO_zanu_willing_buyer_fund_desc: "Matching UK resettlement grants fund orderly smallholder resettlement alongside record commercial maize harvests."
 COLDWAR_RHO_zanu_resettlement_cooperatives: "Collective Peasant Cooperatives"
 COLDWAR_RHO_zanu_resettlement_cooperatives_desc: "Model B collective farms organize rural families and ex-ZANLA fighters into party-anchored cooperative villages."
 COLDWAR_RHO_zanu_rural_clinics_drive: "National Rural Clinics Network"
 COLDWAR_RHO_zanu_rural_clinics_drive_desc: "Hundreds of rural clinics deliver free primary healthcare and immunization to former Tribal Trust Lands, sharply cutting infant mortality."
 COLDWAR_RHO_zanu_great_dyke_state_mines: "Great Dyke State Smelters"
 COLDWAR_RHO_zanu_great_dyke_state_mines_desc: "State-backed smelters along the Great Dyke process ferrochrome, nickel, and asbestos domestically to capture export value."
 COLDWAR_RHO_zanu_peoples_mandate: "End the Reserved White Seats"
 COLDWAR_RHO_zanu_peoples_mandate_desc: "Parliament votes to abolish the twenty reserved racial seats after the seven-year constitutional entrenchment period expires."
 COLDWAR_RHO_zanu_socialist_development: "Five-Year National Development Plan"
 COLDWAR_RHO_zanu_socialist_development_desc: "Harare coordinates parastatal investment, rural electrification, and technical training into a unified five-year national plan."
 COLDWAR_RHO_zanu_1987_unity_accord: "The 1987 Unity Accord Consensus"
 COLDWAR_RHO_zanu_1987_unity_accord_desc: "Mugabe and Joshua Nkomo sign the Unity Accord merging ZANU and ZAPU, ending Matabeleland strife and bringing ZAPU leaders into the Vice Presidency."
 COLDWAR_RHO_zanu_one_party_vanguard: "One-Party Executive Vanguard"
 COLDWAR_RHO_zanu_one_party_vanguard_desc: "Harare enacts a legal one-party Politburo state, crushing Edgar Tekere's Zimbabwe Unity Movement and centralizing patronage under the presidency."
 COLDWAR_RHO_zanu_frontline_leadership: "Non-Aligned Frontline Leadership"
 COLDWAR_RHO_zanu_frontline_leadership_desc: "Harare hosts the 1986 Non-Aligned Movement Summit, leveraging diplomatic prestige to attract multilateral development loans and regional trade."
 COLDWAR_RHO_zanu_revolutionary_export: "Beira Corridor & Liberation Solidarity"
 COLDWAR_RHO_zanu_revolutionary_export_desc: "Zimbabwe deploys brigades to guard the Beira Corridor in Mozambique against RENAMO and backs regional anti-apartheid liberation movements."
 COLDWAR_RHO_zanu_executive_presidency: "Establish the Executive Presidency"
 COLDWAR_RHO_zanu_executive_presidency_desc: "Constitutional Amendment No. 7 merges head of state and head of government into an Executive Presidency seated in Harare."
 COLDWAR_RHO_zanu_harare_nonaligned_summit: "Harare Regional Industrial Pole"
 COLDWAR_RHO_zanu_harare_nonaligned_summit_desc: "Harare leverages SADCC regional integration and educated manpower to anchor Southern Africa's agro-industrial trade."
 COLDWAR_RHO_zanu_capstone: "The Sovereign Republic of Zimbabwe"
 COLDWAR_RHO_zanu_capstone_desc: "Harare seals its transformation from insurgent liberation front into a sovereign African republic commanding education, mining, and regional diplomacy."
 COLDWAR_RHO_rap_root: "No Surrender: The Right-Wing Revolt"
 COLDWAR_RHO_rap_root_desc: "Ted Sutton-Pryce, Des Frost, Len Idensohn, and Robin James oust the RF pragmatists, denouncing every diplomatic concession as national suicide."
 COLDWAR_RHO_rap_partition_track: "The Constitutional Partition Question"
 COLDWAR_RHO_rap_partition_track_desc: "Ultra-right constitutionalists debate partitioning Rhodesia into Sutton-Pryce's three-tier ethnic cantons versus Idensohn's unitary white republic."
 COLDWAR_RHO_rap_mobilization_track: "Total Siege Mobilization"
 COLDWAR_RHO_rap_mobilization_track_desc: "Salisbury places every commercial farm, factory, and border town on permanent wartime standby to hold the country by force."
 COLDWAR_RHO_rap_sutton_pryce_cantons: "Sutton-Pryce Three-Tier Cantons"
 COLDWAR_RHO_rap_sutton_pryce_cantons_desc: "Rhodesia is partitioned into autonomous Shona, Ndebele, and European cantons under a federal defense council preserving white control of the highveld core."
 COLDWAR_RHO_rap_idensohn_unitary_republic: "Idensohn Unitary White Republic"
 COLDWAR_RHO_rap_idensohn_unitary_republic_desc: "Len Idensohn and Robin James abolish the African parliamentary roll outright, establishing a centralized unitary republic under permanent martial law."
 COLDWAR_RHO_rap_total_callup_18_60: "Total Call-Up: Ages 18 to 60"
 COLDWAR_RHO_rap_total_callup_18_60_desc: "Every able-bodied European male up to age sixty is drafted into rolling territorial rotations, squeezing civilian labs and farms to keep battalions at full strength."
 COLDWAR_RHO_rap_foreign_volunteers: "Recruit Foreign Anti-Communist Volunteers"
 COLDWAR_RHO_rap_foreign_volunteers_desc: "Salisbury opens recruitment bureaus for Western Vietnam veterans, Portuguese ex-commandos, and South African volunteers to reinforce the RLI and SAS."
 COLDWAR_RHO_rap_cantonal_assemblies: "Fortified Highveld Cantonal Border"
 COLDWAR_RHO_rap_cantonal_assemblies_desc: "Minefields, sensor lines, and fortified farmstead perimeters seal off the central highveld industrial and farming heartland."
 COLDWAR_RHO_rap_emergency_tribunals: "Special Security Tribunals"
 COLDWAR_RHO_rap_emergency_tribunals_desc: "Military courts replace civilian magistrates across operational zones, imposing collective fines and curfews across rural districts."
 COLDWAR_RHO_rap_industrial_militia_roster: "Armored Workshop Conversion"
 COLDWAR_RHO_rap_industrial_militia_roster_desc: "Salisbury engineering plants convert to mass-producing mine-protected Pookie, Leopard, and Crocodile armored vehicles and small-arms ammunition."
 COLDWAR_RHO_rap_sa_volunteer_cadres: "Southern African Volunteer Brigade"
 COLDWAR_RHO_rap_sa_volunteer_cadres_desc: "Expanded forward airfields in Matabeleland host veteran volunteer pilots, helicopter technicians, and mobile strike columns."
 COLDWAR_RHO_rap_laager_constitution: "Codify the Siege Constitution"
 COLDWAR_RHO_rap_laager_constitution_desc: "A permanent security constitution binds parliament, judiciary, and provincial councils to indefinite defense of the minority state."
 COLDWAR_RHO_rap_war_economy_command: "Supreme War Economy Directorate"
 COLDWAR_RHO_rap_war_economy_command_desc: "All fuel, foreign exchange, and heavy workshops are subordinated to Combined Operations logistics under a permanent war economy."
 COLDWAR_RHO_rap_capstone: "The Iron Laager"
 COLDWAR_RHO_rap_capstone_desc: "Isolated from the world yet armed to the teeth, the Iron Laager stands defiant behind fortified highveld borders and permanent military mobilization."
 COLDWAR_RHO_econ_root: "Salisbury Siege Economy Directorate"
 COLDWAR_RHO_econ_root_desc: "Treasury and Ministry of Commerce officials coordinate foreign-exchange rationing, industrial quotas, and domestic supply chains to keep Salisbury solvent under mandatory sanctions."
 COLDWAR_RHO_econ_isi_quotas: "ACCOR & ARnI Import-Substitution Quotas"
 COLDWAR_RHO_econ_isi_quotas_desc: "Allocate scarce hard currency through ACCOR and ARnI committees to build domestic factories in Mashonaland, trading consumer choice and price stability for self-reliance."
 COLDWAR_RHO_econ_genta_network: "GENTA & Affretair Free-Booter Network"
 COLDWAR_RHO_econ_genta_network_desc: "Channel fuel and industrial spares through GENTA front companies and Jack Malloch's Affretair cargo flights, blunting UN sanctions at the cost of middleman fees and graft."
 COLDWAR_RHO_econ_forex_board: "Foreign Exchange & Industrial Allocation"
 COLDWAR_RHO_econ_forex_board_desc: "Reserve Bank exchange controls ring-fence export earnings for essential machinery, rail spares, and agricultural inputs while curbing speculative capital flight."
 COLDWAR_RHO_econ_agr_board: "Agricultural Marketing Authority"
 COLDWAR_RHO_econ_agr_board_desc: "Statutory marketing boards coordinate grain silos, cold-storage beef exports, and farmer credit across the Highveld and Lowveld estates."
 COLDWAR_RHO_econ_energy_board: "Strategic Fuel & Power Commission"
 COLDWAR_RHO_econ_energy_board_desc: "Salisbury engineers evaluate domestic alternatives to embargoed maritime crude, weighing Lowveld cane ethanol against Wankie coal gasification and thermal power."
 COLDWAR_RHO_econ_tobacco_subsidy: "Subsidize the Virginia Tobacco Stockpile"
 COLDWAR_RHO_econ_tobacco_subsidy_desc: "The Tobacco Corporation buys unsold Virginia leaf at guaranteed floor prices to keep commercial farmers solvent and loyal to the cabinet, saddling the treasury with recurring storage outlays."
 COLDWAR_RHO_econ_crop_pivot: "Commercial Pivot to Maize, Cotton & Beef"
 COLDWAR_RHO_econ_crop_pivot_desc: "Enforce tobacco quota cuts and finance rapid conversion to hybrid maize, irrigated cotton, and ranch beef, turning Rhodesia into southern Africa's breadbasket despite planter resentment."
 COLDWAR_RHO_econ_triangle_ethanol: "Triangle & Hippo Valley Sugar-Ethanol"
 COLDWAR_RHO_econ_triangle_ethanol_desc: "Construct a distillery at Triangle in the southeastern Lowveld to blend cane ethanol into motor petrol, cutting oil import vulnerability while diverting sugar acreage from export."
 COLDWAR_RHO_econ_wankie_ctl: "Wankie Coal-to-Liquids & Kariba Grid"
 COLDWAR_RHO_econ_wankie_ctl_desc: "Invest heavily in Wankie thermal power stations, electrified rail spurs, and coal-to-liquids pilot works in Matabeleland, lowering fossil-fuel dependence at steep capital cost."
 COLDWAR_RHO_econ_great_dyke_hub: "Great Dyke Mineral & Rail Corridor"
 COLDWAR_RHO_econ_great_dyke_hub_desc: "Upgrade Rhodesia Railways ore sidings connecting Shabanie asbestos, Bindura nickel, and Great Dyke chrome seams to domestic smelters and southern export lines."
 COLDWAR_RHO_econ_state_ferrochrome: "State Ferrochrome & RISCO Redcliff Steel"
 COLDWAR_RHO_econ_state_ferrochrome_desc: "Expand state-backed smelting at RISCO Redcliff and domestic ferrochrome furnaces to supply local armaments and steel fabrication, raising state exposure to export swings."
 COLDWAR_RHO_econ_mining_concessions: "Anglo American & Lonrho Concessions"
 COLDWAR_RHO_econ_mining_concessions_desc: "Grant expanded mining leases to Anglo American, Lonrho, and Rio Tinto subsidiaries to bring foreign capital and export revenue into the treasury at the price of external leverage."
 COLDWAR_RHO_econ_capstone: "Resilient Highveld Industrial Base"
 COLDWAR_RHO_econ_capstone_desc: "Consolidate diversified agro-processing, ferrochrome metallurgy, and domestic energy generation into southern Africa's second most industrialized economy outside Pretoria."
 COLDWAR_RHO_mil_root: "Combined Operations Headquarters"
 COLDWAR_RHO_mil_root_desc: "Unify army, air force, BSAP, and CIO operational planning under Combined Operations in Salisbury to coordinate counter-insurgency across all frontier operational areas."
 COLDWAR_RHO_mil_fireforce: "Fireforce Vertical Envelopment"
 COLDWAR_RHO_mil_fireforce_desc: "Build rapid-reaction Fireforce sticks combining Rhodesian Light Infantry commandos, SAS paratroopers, and Alouette III K-Car gunships, straining scarce aircraft spares and budgets."
 COLDWAR_RHO_mil_keeps_callup: "Territorial Call-Up & Protected Villages"
 COLDWAR_RHO_mil_keeps_callup_desc: "Extend territorial reserve call-ups and fortify rural Protected Villages to deny guerrillas local food and shelter, draining skilled specialists from civilian research and straining police budgets."
 COLDWAR_RHO_mil_rhaf_airlift: "RhAF Gunship & Dakota Airlift"
 COLDWAR_RHO_mil_rhaf_airlift_desc: "Expand forward airfields at New Sarum and Thornhill while retrofitting Hunter jets, Lynx light strike craft, and Dakota paratroop transports for sustained Fireforce air support."
 COLDWAR_RHO_mil_border_minefields: "Cordon Sanitaire & Mine-Protected Fleet"
 COLDWAR_RHO_mil_border_minefields_desc: "Lay anti-infiltration border barriers along Operation Hurricane and Thrasher sectors while fielding locally built Leopard and Pookie mine-protected vehicles for rural patrols."
 COLDWAR_RHO_mil_bush_doctrine: "Joint Bush War Operational Review"
 COLDWAR_RHO_mil_bush_doctrine_desc: "Codify lessons from Operations Hurricane, Thrasher, and Repulse into standardized small-unit tracking, mounted Grey's Scouts patrols, and rapid intelligence-to-strike relays."
 COLDWAR_RHO_mil_selous_scouts: "Selous Scouts & Pseudo-Operations"
 COLDWAR_RHO_mil_selous_scouts_desc: "Expand Lt. Col. Ron Reid-Daly's Selous Scouts for deep bush reconnaissance and clandestine pseudo-gang operations, risking sharp international diplomatic backlash."
 COLDWAR_RHO_mil_bsap_auxiliaries: "BSAP Special Branch & Pfumo reVanhu"
 COLDWAR_RHO_mil_bsap_auxiliaries_desc: "Recruit African Security Force Auxiliaries (Pfumo reVanhu) alongside BSAP Special Branch detachments to hold rural districts, increasing payroll costs and local discipline friction."
 COLDWAR_RHO_mil_ops_dingo_uric: "Preemptive Cross-Border Strike Doctrine"
 COLDWAR_RHO_mil_ops_dingo_uric_desc: "Institutionalize deep joint air-mobile raids against external staging camps in Mozambique and Zambia, unlocking repeatable COMOPS strike operations at diplomatic cost."
 COLDWAR_RHO_mil_cio_rural_intel: "CIO Rural Intelligence & Village Guards"
 COLDWAR_RHO_mil_cio_rural_intel_desc: "Coordinate Ken Flower's Central Intelligence Organisation with district commissioners and village guard posts, unlocking repeatable rural security sweeps."
 COLDWAR_RHO_mil_walls_total_defence: "Walls Combined Arms Total Defence"
 COLDWAR_RHO_mil_walls_total_defence_desc: "Retain a permanent high-readiness combined-arms fortress army built around regular mechanized units and territorial reserves, locking in sustained defense and call-up burdens."
 COLDWAR_RHO_mil_bmatt_integration: "BMATT Tripartite Army Integration"
 COLDWAR_RHO_mil_bmatt_integration_desc: "Invite the British Military Advisory and Training Team to amalgamate ZIPRA, ZANLA, and former Rhodesian Security Forces into a unified professional national army, mitigating ex-combatant unrest at transitional cost."
 COLDWAR_RHO_mil_fifth_brigade: "5th Brigade & Ideological Party Guard"
 COLDWAR_RHO_mil_fifth_brigade_desc: "Raise a separate party-loyal security brigade outside the regular chain of command to crush internal dissent, maximizing regime grip at the cost of severe Matabeleland alienation and condemnation."
 COLDWAR_RHO_mil_capstone: "Highveld Armed Forces Doctrine"
 COLDWAR_RHO_mil_capstone_desc: "Institutionalize two decades of counter-insurgency, air-mobile doctrine, and regional defense into a hardened modern military establishment capable of defending the Zambezi and Limpopo frontiers."
 COLDWAR_RHO_for_root: "Salisbury Accredited Missions"
 COLDWAR_RHO_for_root_desc: "Maintain accredited envoys in Pretoria and Lisbon, trade representatives in Washington, and back-channel contacts in London and Lusaka to negotiate bilateral lifelines and settlements."
 COLDWAR_RHO_for_saf_beitbridge: "Rutenga-Beitbridge Rail & GENTA Lifeline"
 COLDWAR_RHO_for_saf_beitbridge_desc: "Propose a standing rail and fuel-transit treaty with Pretoria to link Rutenga directly to Beitbridge and guarantee GENTA oil deliveries in exchange for transit fees and South African leverage."
 COLDWAR_RHO_for_por_alcora: "Exercise Alcora & Beira Corridor"
 COLDWAR_RHO_for_por_alcora_desc: "Formalize the secret Exercise Alcora intelligence pact with Lisbon to keep Beira and Lourenco Marques open for Rhodesian trade while sharing counter-insurgency intelligence."
 COLDWAR_RHO_for_usa_byrd: "Byrd Amendment Strategic Chrome Accord"
 COLDWAR_RHO_for_usa_byrd_desc: "Lobby Washington for a strategic-materials exemption covering Great Dyke ferrochrome, offering the United States a non-Soviet chrome supply in exchange for hard-currency exports."
 COLDWAR_RHO_for_zam_rail: "Southern Rail & Fertilizer Corridor"
 COLDWAR_RHO_for_zam_rail_desc: "Offer Lusaka a pragmatic reopening of the Victoria Falls rail bridge for Zambian maize fertilizer and copper exports, generating steady rail royalties for Salisbury."
 COLDWAR_RHO_for_saf_coin: "Zambezi Valley SAP & Joint Security"
 COLDWAR_RHO_for_saf_coin_desc: "Negotiate a standing South African Police and intelligence-sharing protocol along the Zambezi border to reinforce Rhodesian frontier patrols."
 COLDWAR_RHO_for_eng_settlement: "Anglo-Rhodesian Constitutional Settlement"
 COLDWAR_RHO_for_eng_settlement_desc: "Submit a formal constitutional settlement package to London to end diplomatic isolation, lift UN Mandatory Sanctions, and restore Commonwealth trade in exchange for constitutional guarantees."
 COLDWAR_RHO_for_fra_alouette: "Alouette III & Panhard Spares Pipeline"
 COLDWAR_RHO_for_fra_alouette_desc: "Approach Paris intermediaries for a standing Alouette III helicopter and Panhard armored-car spares pipeline to sustain Fireforce air mobility under arms restrictions."
 COLDWAR_RHO_for_isr_uzi: "Uzi License & Bush COIN Advisory"
 COLDWAR_RHO_for_isr_uzi_desc: "Negotiate a discreet small-arms licensing and counter-insurgency exchange with Israel to expand domestic submachine-gun output and special-forces training."
 COLDWAR_RHO_for_sov_zipra: "Lusaka ZIPRA Mechanized Armament Pact"
 COLDWAR_RHO_for_sov_zipra_desc: "Propose a conventional defense and armament accord with Moscow drawing on Soviet-ZIPRA channels to build mechanized capability and arms production in Matabeleland."
 COLDWAR_RHO_for_chi_zanla: "Great Dyke & ZANLA Doctrine Accord"
 COLDWAR_RHO_for_chi_zanla_desc: "Propose a technical-industrial and defense cooperation treaty with Beijing building on PRC-ZANLA solidarity to expand Mashonaland industry and territorial defense."
 COLDWAR_RHO_for_capstone: "Southern African Strategic Hub"
 COLDWAR_RHO_for_capstone_desc: "Anchor [Root.Capital.GetName] as the indispensable rail, mineral, and diplomatic crossroads of southern Africa, leveraging bilateral accords into durable regional influence."
