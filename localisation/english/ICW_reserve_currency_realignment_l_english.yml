l_english:
 # IMPERIA COLD WAR — Reserve realignment costs and presidential advice.
 ICW_reserve_currency_realignment_tt: "Reserve Realignment: §R10%§! of annual GDP + §R10%§! of outstanding public debt, paid once from the Treasury."
 ICW_reserve_currency_treasury_required_tt: "Treasury required for reserve realignment: §Y$$[?ICW_reserve_switch_quote|3] Billion§!"
 ICW_reserve_currency.1.t: "Treasury Briefing: [FROM.GetName] Leaves the Dollar"
 ICW_reserve_currency.1.d: "Mr. President,\n\nThe Treasury reports that [FROM.GetNameDef] has withdrawn from the dollar reserve system. Its monetary authorities have abandoned the dollar as their principal reserve anchor.\n\nThis departure weakens the dollar's international position and reduces our financial influence. I recommend that Treasury and State prepare countermeasures, beginning with consultations with [FROM.GetNameDef] and assurances to our remaining monetary partners."
 ICW_reserve_currency.1.a: "Acknowledged."
