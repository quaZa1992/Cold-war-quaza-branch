 COLDWAR_CHI_two_line_category: "The Two-Line Struggle"
 COLDWAR_CHI_two_line_category_desc: "Revolution or production: the Party's two lines fight for the Centre."
 COLDWAR_CHI_one_china_category: "One China"
 COLDWAR_CHI_one_china_category_desc: "There is only one China, and its government is in Beijing."
 COLDWAR_CHI_beijing_bloc_category: "The Beijing Bloc"
 COLDWAR_CHI_beijing_bloc_category_desc: "A third camp between the superpowers, with Beijing at its centre."
 COLDWAR_CHI_frontier_category: "The Frontiers"
 COLDWAR_CHI_frontier_category_desc: "Border incidents, island clashes and standoffs: tension without war, and an army that learns."
 COLDWAR_CHI_agreements_category: "Agreements with China"
 COLDWAR_CHI_agreements_category_desc: "Our standing agreements with the People's Republic of China."
 COLDWAR_CHI_cultural_revolution: "The Great Proletarian Cultural Revolution"
 COLDWAR_CHI_cultural_revolution_desc: "Rebel factions, purges and struggle sessions have broken the ministries. Three years after the January Storm the Party is still rebuilt only through revolutionary committees."
 COLDWAR_CHI_prepare_for_war: "Prepare for War, Prepare for Famine"
 COLDWAR_CHI_prepare_for_war_desc: "After the Zhenbao and Tielieketi clashes the whole country digs shelters and evacuates leaders from Beijing. Order Number One of October 1969 still stands."
 COLDWAR_CHI_third_front: "The Third Front"
 COLDWAR_CHI_third_front_desc: "Since 1964 half of all capital construction has gone into factories hidden in the mountains of Sichuan, Guizhou and western Hubei, built for war rather than for markets."
 COLDWAR_CHI_closed_universities: "The Universities Stand Empty"
 COLDWAR_CHI_closed_universities_desc: "No entrance examination has been held since 1966. Professors sweep courtyards in May Seventh cadre schools while laboratories gather dust."
 COLDWAR_CHI_peoples_communes: "The People's Communes"
 COLDWAR_CHI_peoples_communes_desc: "About fifty-two thousand communes feed eight hundred million people at the 1957 level per head. Work points reward attendance, not harvests, yet the commune also organises militia and rural order."
 COLDWAR_CHI_isolated_bastion: "The Isolated Bastion"
 COLDWAR_CHI_isolated_bastion_desc: "Taipei still holds China's seat at the United Nations. We quarrel with Moscow, have no relations with Washington and our ambassadors were recalled in 1967."
 COLDWAR_CHI_red_sun: "The Red Sun in Our Hearts"
 COLDWAR_CHI_red_sun_desc: "Badges, quotations and loyalty dances: the Chairman's word ends every argument. Nothing moves without him, and nobody dares to move against him."
 COLDWAR_CHI_sent_down_youth: "Up to the Mountains, Down to the Villages"
 COLDWAR_CHI_sent_down_youth_desc: "Millions of urban school leavers have been sent to farms in Yunnan, Heilongjiang and Inner Mongolia. Families are split and a generation goes untrained."
 COLDWAR_CHI_no_ranks: "An Army without Ranks"
 COLDWAR_CHI_no_ranks_desc: "Ranks and insignia were abolished in 1965. Nobody knows who commands whom in a battle, only who sits higher on the Party committee."
 COLDWAR_CHI_korean_war_arsenal: "The Korean War Arsenal"
 COLDWAR_CHI_korean_war_arsenal_desc: "Rifles, guns and jets are copies of Soviet designs from the early 1950s. Since 1960 nobody has delivered us anything newer."
 COLDWAR_CHI_three_supports: "Three Supports and Two Militaries"
 COLDWAR_CHI_three_supports_desc: "Since 1967 the army supports the left, industry and agriculture, and runs military control and training everywhere. Officers govern provinces and do not drill."
 COLDWAR_CHI_purged_officers: "The Purged Officer Corps"
 COLDWAR_CHI_purged_officers_desc: "Peng Dehuai, He Long and Luo Ruiqing fell, and thousands of officers with them. The staff colleges are empty, and the men who fought in Korea are in prison or in the fields."
 COLDWAR_CHI_bloated_army: "Six Million under Arms"
 COLDWAR_CHI_bloated_army_desc: "The army, the production corps and the railway troops feed and pay more men than any army in the world, and most of them farm."
 COLDWAR_CHI_iron_rice_bowl: "The Iron Rice Bowl"
 COLDWAR_CHI_iron_rice_bowl_desc: "Every worker has a job for life in his work unit, and every work unit carries housing, clinics, schools and pensions for its people. Factories employ three men where one would do, and the profits pay for the danwei, not the treasury. Eight hundred million people earn too little to tax."
