l_english:
 # IMPERIA COLD WAR — China 1970 localisation.
 COLDWAR_CHI_mobilise_rebels: "Mobilise the Rebel Factions"
 COLDWAR_CHI_mobilise_rebels_desc: "The rebel organisations are called out again to criticise the cadres."
 COLDWAR_CHI_work_conference: "Convene a Work Conference"
 COLDWAR_CHI_work_conference_desc: "The planners and the provinces sit down to fix the plan, not the line."
 COLDWAR_CHI_two_line_programme_ready_tt: "No other 120-day Two-Line Struggle programme is in force."
 COLDWAR_CHI_brigade_clinics_funded_tt: "The Treasury can cover a one-time payment of §Y0.10%§! of current GDP."
 COLDWAR_CHI_july_21_workers_college: "Open a July 21 Workers' College"
 COLDWAR_CHI_july_21_workers_college_desc: "Veteran machinists will teach toolmaking and production methods on the shop floor. The factories must release their best hands for the first term."
 COLDWAR_CHI_train_barefoot_doctors: "Train Barefoot Doctors for the Brigades"
 COLDWAR_CHI_train_barefoot_doctors_desc: "County hospitals will train brigade members to vaccinate children, dress wounds and visit villages beyond the reach of a clinic. The Ministry of Health will supply the first medical kits."
 COLDWAR_CHI_recall_design_engineers: "Recall Engineers to the Design Institutes"
 COLDWAR_CHI_recall_design_engineers_desc: "The State Council will recall engineers from factory assignments to finish designs left on the drawing board. Revolutionary committee cadres have challenged the recall orders."
 COLDWAR_CHI_prioritise_coal_trains: "Give Coal Trains Priority"
 COLDWAR_CHI_prioritise_coal_trains_desc: "Railway dispatchers will reserve wagon paths for coal bound for the industrial centres. Building sites must wait for deliveries of steel and cement."
 COLDWAR_CHI_leader_mao_zedong: "Mao Zedong"
 COLDWAR_CHI_leader_hua_guofeng: "Hua Guofeng"
 COLDWAR_CHI_leader_zhou_enlai: "Zhou Enlai"
 COLDWAR_CHI_leader_li_xiannian: "Li Xiannian"
 COLDWAR_CHI_leader_zhang_wentian: "Zhang Wentian"
 COLDWAR_CHI_leader_wu_xiuquan: "Wu Xiuquan"
 COLDWAR_CHI_leader_ye_jianying: "Ye Jianying"
 COLDWAR_CHI_leader_yang_shangkun: "Yang Shangkun"
 COLDWAR_CHI_leader_yang_mingxuan: "Yang Mingxuan"
 COLDWAR_CHI_leader_shi_liang: "Shi Liang"
 COLDWAR_CHI_leader_fei_xiaotong: "Fei Xiaotong"
 COLDWAR_CHI_vote_count_tt: "The General Assembly has counted: §G[?global.COLDWAR_CHI_vote_yes]§! Yes, §R[?global.COLDWAR_CHI_vote_no]§! No, [?global.COLDWAR_CHI_vote_abstain] abstentions."
 COLDWAR_CHI_important_question_tt: "The resolution needs §Ytwo thirds§! of the votes cast. Our standing with the Non-Aligned suffers."
 COLDWAR_CHI_dual_proposed_tt: "If the resolution fails, Beijing may accept §Ydual representation§!: the Security Council seat for Beijing, a General Assembly seat for Taipei."
 COLDWAR_CHI_opinion_plus_15: "Chinese Diplomacy"
 COLDWAR_CHI_start_vote_tt: "Every member of the General Assembly votes within 30 days. Players decide themselves; the AI decides by its bloc, its recognition of Beijing, our lobbying and our cosponsors."
 COLDWAR_CHI_offer_of_friendship: "Offer of Friendship"
 COLDWAR_CHI_offer_of_friendship_desc: "Loans and engineers for a capital that recognises Beijing instead of Taipei."
 COLDWAR_CHI_opinion_minus_15: "Chinese Hostility"
 COLDWAR_CHI_tension_p1_tt: "Cold War tension §R+1§!"
 COLDWAR_CHI_pressure_protest: "Lodge a Protest"
 COLDWAR_CHI_pressure_protest_desc: "A formal protest over the embassy of the Chiang clique."
 COLDWAR_CHI_pressure_recall: "Recall Our Ambassador"
 COLDWAR_CHI_pressure_recall_desc: "Our ambassador comes home until the embassy of Taipei closes."
 COLDWAR_CHI_pressure_boycott: "Trade Boycott"
 COLDWAR_CHI_pressure_boycott_desc: "Our ports and our purchasing agencies close their doors to the friends of Taipei."
 COLDWAR_CHI_lobby_tt: "If this delegation is not played by a human, it leans towards §GYes§! in the next vote on the China seat."
 COLDWAR_CHI_lobby_resolution: "Lobby for the Resolution"
 COLDWAR_CHI_lobby_resolution_desc: "Our diplomats work on one delegation before the next vote."
 COLDWAR_CHI_table_again: "Table the Resolution Again"
 COLDWAR_CHI_table_again_desc: "A lost vote is a count of who still needs persuading."
 COLDWAR_CHI_join_beijing_tt: "We join the §YBeijing bloc§! of the Cold War; China bears the switch cost."
 COLDWAR_CHI_invite_bloc: "Invite to the Beijing Bloc"
 COLDWAR_CHI_invite_bloc_desc: "Ask a government to join our camp."
 COLDWAR_CHI_invite_bloc_cheap: "Invite to the Beijing Bloc"
 COLDWAR_CHI_invite_bloc_cheap_desc: "Ask a government to join our camp. Our frontier record makes the case for us."
 COLDWAR_CHI_bloc_tier_1_tt: "The §YBeijing bloc§! reaches tier §Y1§!: the bloc spirit of every member improves permanently."
 COLDWAR_CHI_bloc_tier_2_tt: "The §YBeijing bloc§! reaches tier §Y2§!: the bloc spirit of every member improves permanently."
 COLDWAR_CHI_bloc_tier_3_tt: "The §YBeijing bloc§! reaches tier §Y3§!: the bloc spirit of every member improves permanently."
 COLDWAR_CHI_bloc_tier_4_tt: "The §YBeijing bloc§! reaches tier §Y4§!: the bloc spirit of every member improves permanently."
 COLDWAR_CHI_clash_reward_tt: "Frontier clashes +1 (milestones at §Y3, 5, 8 and 12§!: officers and arsenal improve, the Beijing bloc rises, the permanent debuffs ease). +15 army experience, one general gains a skill."
 COLDWAR_CHI_tension_p2_tt: "Cold War tension §R+2§!"
 COLDWAR_CHI_opinion_minus_10: "Chinese Hostility"
 COLDWAR_CHI_incident_ussuri: "Incident on The Ussuri"
 COLDWAR_CHI_incident_ussuri_desc: "A patrol, a shouting match and a few shots on the Ussuri."
 COLDWAR_CHI_incident_amur: "Incident on The Amur"
 COLDWAR_CHI_incident_amur_desc: "A patrol, a shouting match and a few shots on the Amur."
 COLDWAR_CHI_incident_xinjiang: "Incident on Xinjiang"
 COLDWAR_CHI_incident_xinjiang_desc: "A patrol, a shouting match and a few shots on Xinjiang."
 COLDWAR_CHI_clash_paracels: "Naval Clash at the Paracels"
 COLDWAR_CHI_clash_paracels_desc: "Our gunboats and the other side's meet among the Xisha reefs."
 COLDWAR_CHI_clash_reef: "Reef Clash in the Nansha"
 COLDWAR_CHI_clash_reef_desc: "Troops on a reef at low tide, and frigates within range."
 COLDWAR_CHI_clash_sumdorong: "Standoff in the Himalaya"
 COLDWAR_CHI_clash_sumdorong_desc: "A post, a division and a valley that both sides call their own."
 COLDWAR_CHI_clash_laoshan: "Rotate an Army Group through Laoshan"
 COLDWAR_CHI_clash_laoshan_desc: "Another army group goes to the hills of Laoshan for its turn at the front."
 COLDWAR_CHI_supply_cambodia: "Supply the Cambodian Resistance"
 COLDWAR_CHI_supply_cambodia_desc: "Rifles through Thailand for the coalition that fights Hanoi in Cambodia."
 COLDWAR_CHI_supply_afghanistan: "Supply the Afghan Resistance"
 COLDWAR_CHI_supply_afghanistan_desc: "Rifles and rockets through Pakistan for the men who fight the Soviet army."
 COLDWAR_CHI_trade_members_tt: "Every player country in world trade answers our application in its own event."
 COLDWAR_CHI_wto_ratify_tt: "Every player country in the World Trade Organization ratifies or blocks the protocol within 60 days. AI members ratify. If nobody blocks, we become §YRecently Acceded to the WTO§!, later a §YWTO Member§!."
 COLDWAR_CHI_wto_concessions: "Bilateral Concessions"
 COLDWAR_CHI_wto_concessions_desc: "Offer a member that blocks our accession what it asks for."
 COLDWAR_CHI_opinion_minus_25: "Chinese Hostility"
 COLDWAR_CHI_1970_focus: "Chinese Focus Tree"
 COLDWAR_CHI_party_centre_tree_shortcut: "Party Centre"
 COLDWAR_CHI_the_chairmans_line_tree_shortcut: "The Chairman's Line"
 COLDWAR_CHI_economy_and_science_tree_shortcut: "Economy and Science"
 COLDWAR_CHI_peoples_liberation_army_tree_shortcut: "People's Liberation Army"
 COLDWAR_CHI_one_china_tree_shortcut: "One China"
 COLDWAR_CHI_foreign_affairs_tree_shortcut: "Foreign Affairs"
 COLDWAR_CHI_the_split_and_the_southern_frontier_tree_shortcut: "The Split and the Southern Frontier"
 COLDWAR_CHI_two_line_category_unlocked_tt: "Unlocks the decisions of §YThe Two-Line Struggle§!."
 COLDWAR_CHI_ninth_congress: "The Ninth Party Congress"
 COLDWAR_CHI_ninth_congress_desc: "April 1969 closed the Cultural Revolution's storm phase and named Lin Biao the Chairman's successor. Its new Central Committee is half soldiers. The struggle between two lines goes on inside it."
 COLDWAR_CHI_struggle_criticism: "Struggle, Criticism, Transformation"
 COLDWAR_CHI_struggle_criticism_desc: "The rebel factions are disarmed and sent to study classes. Cadres are screened, purified and slowly allowed back to work."
 COLDWAR_CHI_grasp_revolution: "Grasp Revolution, Promote Production"
 COLDWAR_CHI_grasp_revolution_desc: "The Premier's slogan lets factories run while the meetings continue. Output recovers where the ministries are left alone."
 COLDWAR_CHI_central_committee: "Convene the Central Committee"
 COLDWAR_CHI_central_committee_desc: "Plenums decide the line, and the line decides who governs. Every faction prepares its documents for the next session."
 COLDWAR_CHI_rad_e: "Continuous Revolution"
 COLDWAR_CHI_rad_e_desc: "The Cultural Revolution Group was dissolved in 1969, but its Shanghai men were not. Zhang Chunqiao and Jiang Qing claim the Chairman's mantle: the revolution has no last chapter."
 COLDWAR_CHI_rad_p: "The Shanghai Model"
 COLDWAR_CHI_rad_p_desc: "The January Storm of 1967 handed Shanghai to the rebels. What worked on the Huangpu is to work in every province."
 COLDWAR_CHI_rad_q: "Restrict Bourgeois Right"
 COLDWAR_CHI_rad_q_desc: "Wage grades, piece rates and bonuses breed new bourgeois elements batch after batch. They must be restricted, even if output suffers."
 COLDWAR_CHI_rad_a1: "Permanent Revolution"
 COLDWAR_CHI_rad_a1_desc: "No rectification, no return to the ministries. The Cultural Revolution becomes the permanent condition of the state."
 COLDWAR_CHI_rad_a2: "A Truce with the Ministries"
 COLDWAR_CHI_rad_a2_desc: "Zhang Chunqiao knows that a revolution without trains is a short one. The planners keep their desks, under watch."
 COLDWAR_CHI_rad_a1f: "The Model Operas"
 COLDWAR_CHI_rad_a1f_desc: "Eight model works, from The Red Detachment of Women to Taking Tiger Mountain by Strategy, are the whole of our stage. Culture is a weapon."
 COLDWAR_CHI_rad_a2f: "Writing Groups in Every Ministry"
 COLDWAR_CHI_rad_a2f_desc: "Writing groups under pen names such as Liang Xiao and Luo Siding publish what the ministries must think. The writing groups write the line, and the ministries follow it."
 COLDWAR_CHI_rad_b1: "The Fengqing Line"
 COLDWAR_CHI_rad_b1_desc: "Our own ship, the Fengqing, sailed to Romania and back. Buying foreign hulls is national humiliation, and every contract is a confession."
 COLDWAR_CHI_rad_b2: "Selective Imports"
 COLDWAR_CHI_rad_b2_desc: "Even the purest line needs fertiliser plants. We buy what we must and denounce those who enjoy it."
 COLDWAR_CHI_rad_b1f: "Self-Reliant Shipyards"
 COLDWAR_CHI_rad_b1f_desc: "Jiangnan and Hudong build what the comprador ministries wanted to charter. Every launch is a political victory."
 COLDWAR_CHI_rad_b2f: "Fertiliser for the Communes"
 COLDWAR_CHI_rad_b2f_desc: "Imported synthetic ammonia plants feed the fields of the communes. Grain is the key link in the countryside."
 COLDWAR_CHI_rad_pm: "Seize Power from Below"
 COLDWAR_CHI_rad_pm_desc: "Power belongs to the rebel organisations that seized it, not to the cadres who lost it."
 COLDWAR_CHI_rad_em: "Work Points for Politics"
 COLDWAR_CHI_rad_em_desc: "Labour days are scored for attitude as well as for sweat. The poorest brigades are the most revolutionary, and they know it."
 COLDWAR_CHI_rad_c1: "Criticise Lin, Criticise Confucius"
 COLDWAR_CHI_rad_c1_desc: "Confucius, the Duke of Zhou and the fallen marshal share one target. The real target is the Premier and his men in the State Council."
 COLDWAR_CHI_rad_c2: "Oppose Empiricism"
 COLDWAR_CHI_rad_c2_desc: "The empiricists in the State Council call experience a guide. Experience is how capitalism returns, and their pragmatism must be exposed."
 COLDWAR_CHI_rad_c1f: "The Shanghai Militia"
 COLDWAR_CHI_rad_c1f_desc: "Armed workers drill on the Bund under Wang Hongwen's command. It is a second army, and the first army knows it."
 COLDWAR_CHI_rad_c2f: "Red Flag Editorials"
 COLDWAR_CHI_rad_c2f_desc: "Red Flag and the People's Daily speak in one voice. Every county loudspeaker repeats it before the evening meal."
 COLDWAR_CHI_rad_d1: "Support Revolutions Everywhere"
 COLDWAR_CHI_rad_d1_desc: "The world's countryside is surrounding its cities. From Cambodia to Angola, the people's war needs rifles and instructors."
 COLDWAR_CHI_rad_d2: "The Three Worlds"
 COLDWAR_CHI_rad_d2_desc: "Both superpowers are imperialist. We stand with the Third World against the two hegemons, and we owe nothing to either."
 COLDWAR_CHI_rad_d1f: "Rifles for the Liberation Movements"
 COLDWAR_CHI_rad_d1f_desc: "Type 56 rifles and grenades leave Guangzhou for every movement that will carry them. The cost is counted in yuan and in enemies."
 COLDWAR_CHI_rad_d2f: "Leader of the Third World"
 COLDWAR_CHI_rad_d2f_desc: "The non-aligned capitals hear us when the superpowers lecture them. Influence is cheaper than divisions."
 COLDWAR_CHI_rad_cm: "The Theory of the Dictatorship"
 COLDWAR_CHI_rad_cm_desc: "All-round dictatorship over the bourgeoisie is the theory of our time. Whoever opposes it reveals himself."
 COLDWAR_CHI_rad_dm: "Learn from the People's War"
 COLDWAR_CHI_rad_dm_desc: "Lin Biao wrote it, but it belongs to the masses: the countryside encircles the cities, at home and abroad."
 COLDWAR_CHI_rad_cap: "The Red Banner"
 COLDWAR_CHI_rad_cap_desc: "The Chairman's banner passes to those who never lowered it. The revolution continues, and it has found its heirs."
 COLDWAR_CHI_lin_e: "The Successor's Army"
 COLDWAR_CHI_lin_e_desc: "The Ninth Congress named Lin Biao the Chairman's close comrade-in-arms and successor. The Military Affairs Commission's administrative group now runs more than the army."
 COLDWAR_CHI_lin_p: "Restore the State Chairmanship"
 COLDWAR_CHI_lin_p_desc: "At Lushan the Vice-Chairman's allies want the post Liu Shaoqi held. Whoever is Chairman of the State is the Chairman's heir in law as well as in name."
 COLDWAR_CHI_lin_q: "Politics in Command of the Army"
 COLDWAR_CHI_lin_q_desc: "The Little Red Book is the army's first weapon. Soldiers study before they drill, and they drill a little less."
 COLDWAR_CHI_lin_a1: "The Loyal Heir"
 COLDWAR_CHI_lin_a1_desc: "Lin Biao waits. The Chairman is old, and patience is the safest road to the succession."
 COLDWAR_CHI_lin_a2: "Project 571"
 COLDWAR_CHI_lin_a2_desc: "Lin Liguo's outline calls the Chairman a modern Qin Shi Huang. If the succession will not come, the air force can bring it."
 COLDWAR_CHI_lin_a1f: "The Four Guardian Warriors"
 COLDWAR_CHI_lin_a1f_desc: "Huang Yongsheng, Wu Faxian, Li Zuopeng and Qiu Huizuo hold the general staff, the air force, the navy's political command and logistics. Loyalty runs through four men."
 COLDWAR_CHI_lin_a2f: "Rich People, Strong State"
 COLDWAR_CHI_lin_a2f_desc: "The outline condemns frozen wages and rusticated youth. A Lin government promises bread before slogans, and the people take note."
 COLDWAR_CHI_lin_b1: "War Economy against the North"
 COLDWAR_CHI_lin_b1_desc: "Order Number One is the economy's order too. Every province prepares for a Soviet strike, and arms come before shoes."
 COLDWAR_CHI_opinion_plus_25: "Chinese Diplomacy"
 COLDWAR_CHI_tension_m2_tt: "Cold War tension §G-2§!"
 COLDWAR_CHI_lin_b2: "An Understanding with Moscow"
 COLDWAR_CHI_lin_b2_desc: "Lin's men quietly sound out the Soviet embassy. Peace on the Ussuri would free the army for other tasks, and other ambitions."
 COLDWAR_CHI_lin_b1f: "The Air Force Academies"
 COLDWAR_CHI_lin_b1f_desc: "Wu Faxian's air force trains its own officers and answers to its own commissars. Lin Liguo's office sits in its headquarters."
 COLDWAR_CHI_lin_b2f: "Soviet Spare Parts"
 COLDWAR_CHI_lin_b2f_desc: "MiG and Tupolev parts flow again through Manzhouli. Factories in Shenyang and Xi'an finish what they began in the 1950s."
 COLDWAR_CHI_lin_pm: "The Vice-Chairman's Office"
 COLDWAR_CHI_lin_pm_desc: "Maojiawan, behind its guards and gardens, is the second centre of the republic. Ministers wait in its corridors."
 COLDWAR_CHI_lin_em: "Military Control of the Railways"
 COLDWAR_CHI_lin_em_desc: "Military control commissions run the trains that the rebels stopped. The timetable improves and the officers stay."
 COLDWAR_CHI_lin_c1: "Army over Party"
 COLDWAR_CHI_lin_c1_desc: "Where the Party committee and the army commander disagree, the commander decides. The provinces already work that way."
 COLDWAR_CHI_lin_c2: "Party over Army"
 COLDWAR_CHI_lin_c2_desc: "Even the successor must be seen to obey the Party. Political commissars regain their old precedence."
 COLDWAR_CHI_lin_c1f: "Garrison the Provinces"
 COLDWAR_CHI_lin_c1f_desc: "The great military regions become the real provinces. Order is kept by divisions, and the divisions keep their own counsel."
 COLDWAR_CHI_lin_c2f: "Commissars Return"
 COLDWAR_CHI_lin_c2f_desc: "The General Political Department rebuilds its networks. Soldiers hear the line from the Party again, not from their generals."
 COLDWAR_CHI_lin_d1: "Long Live the Victory of People's War"
 COLDWAR_CHI_lin_d1_desc: "Lin's 1965 essay is our doctrine: lure the enemy deep, let the countryside swallow him, and win the war of attrition."
 COLDWAR_CHI_lin_d2: "Modernise the Strike Forces"
 COLDWAR_CHI_lin_d2_desc: "Missiles and jets, not militia, deter Moscow. The Second Artillery receives what the infantry used to get."
 COLDWAR_CHI_lin_d1f: "Militia Divisions"
 COLDWAR_CHI_lin_d1f_desc: "Every county raises a militia regiment trained by the regular army. In war they are the deep defence; in peace they are the army's votes."
 COLDWAR_CHI_lin_d2f: "Rockets over Jiuquan"
 COLDWAR_CHI_lin_d2f_desc: "The Gansu test range launches what the successor's planners ordered. The rockets are ours, and so are the men who fire them."
 COLDWAR_CHI_lin_cm: "A Disciplined Republic"
 COLDWAR_CHI_lin_cm_desc: "Discipline, vigilance and obedience: the army's virtues become the nation's."
 COLDWAR_CHI_lin_dm: "The General Staff Plans"
 COLDWAR_CHI_lin_dm_desc: "Huang Yongsheng's staff writes plans for every front. The army has never been better prepared to fight the war it expects."
 COLDWAR_CHI_lin_cap: "The Marshal's Republic"
 COLDWAR_CHI_lin_cap_desc: "The successor has succeeded. The republic is commanded the way he commanded the Fourth Field Army: decisively, from the front."
 COLDWAR_CHI_intl_e: "Return to Moscow"
 COLDWAR_CHI_intl_e_desc: "The Twenty-Eight Bolsheviks' heirs never accepted the split. A China that learns from the Soviet Union again is the China the 1950 treaty promised."
 COLDWAR_CHI_intl_a1: "The 1950 Treaty Reaffirmed"
 COLDWAR_CHI_intl_a1_desc: "The Treaty of Friendship, Alliance and Mutual Assistance never lapsed in law. We honour it again, and the northern divisions can stand down."
 COLDWAR_CHI_intl_a2: "Our Own Socialist Road"
 COLDWAR_CHI_intl_a2_desc: "Friendship with Moscow, yes; obedience, no. China remains the senior partner of its own revolution."
 COLDWAR_CHI_intl_a1f: "Soviet Specialists Return"
 COLDWAR_CHI_intl_a1f_desc: "The engineers who left with their blueprints in 1960 are invited back. Factories they started are finished, under their supervision."
 COLDWAR_CHI_intl_a2f: "A Hybrid Plan"
 COLDWAR_CHI_intl_a2f_desc: "Soviet methods with Chinese priorities: heavy industry first, but the communes keep their own counsel."
 COLDWAR_CHI_intl_m: "Gosplan Methods"
 COLDWAR_CHI_intl_m_desc: "Balance sheets of material inputs replace campaigns. The economy becomes predictable and a little grey."
 COLDWAR_CHI_intl_b1: "Abolish the Personality Cult"
 COLDWAR_CHI_intl_b1_desc: "What Khrushchev did in 1956 we do now. The badges come off and the arguments begin."
 COLDWAR_CHI_intl_b2: "Mao's Merits, Mao's Errors"
 COLDWAR_CHI_intl_b2_desc: "His merits are primary and his errors secondary. The portrait stays on the gate, the policies change behind it."
 COLDWAR_CHI_intl_m2: "A Border Settled on Paper"
 COLDWAR_CHI_intl_m2_desc: "The commissions finally agree on the river channels. Zhenbao stays a quiet island and the shelters can close."
 COLDWAR_CHI_intl_cap: "The Fraternal Alliance"
 COLDWAR_CHI_intl_cap_desc: "The two great socialist powers stand together again. The world revolution has one camp and two capitals."
 COLDWAR_CHI_cpc_e: "The Chairman's Line"
 COLDWAR_CHI_cpc_e_desc: "The Ninth Congress has spoken and the Chairman's line is the Party's line. Whoever stands at his side speaks for the Centre, and the Centre balances left against right as he chooses."
 COLDWAR_CHI_cpc_p: "Mao Zedong Thought in Command"
 COLDWAR_CHI_cpc_p_desc: "Every work unit studies the quotations before the shift. Politics comes first, and doubt about the line is a question of class standpoint."
 COLDWAR_CHI_cpc_q: "The Fourth Five-Year Plan"
 COLDWAR_CHI_cpc_q_desc: "The draft plan for 1971 to 1975 sets steel at thirty-five million tonnes and asks Liaoning's old plants to carry the interior's new ones."
 COLDWAR_CHI_cpc_a1: "Rely on the Revolutionary Committees"
 COLDWAR_CHI_cpc_a1_desc: "Soldiers, cadres and rebels share every provincial seat. The committees keep order, but they keep the officers in the ministries too."
 COLDWAR_CHI_cpc_a2: "Rebuild the Party Committees"
 COLDWAR_CHI_cpc_a2_desc: "Provincial Party committees can be formed again. Old cadres return to desks they left in 1967, and the rebels resent it."
 COLDWAR_CHI_cpc_a1f: "The Triple Alliance"
 COLDWAR_CHI_cpc_a1f_desc: "Army, cadres and masses govern together. The arrangement is orderly and it is expensive, because the soldiers draw their pay twice."
 COLDWAR_CHI_cpc_a2f: "The Organisation Department Reopens"
 COLDWAR_CHI_cpc_a2f_desc: "Files are reopened and cadres are graded again. The Party apparatus breathes, and with it the paperwork."
 COLDWAR_CHI_cpc_b1: "In Agriculture, Learn from Dazhai"
 COLDWAR_CHI_cpc_b1_desc: "Chen Yonggui's brigade terraced barren hills by hand. Every commune is asked to do the same, and to measure its zeal in labour days."
 COLDWAR_CHI_cpc_b2: "The Sixty Articles"
 COLDWAR_CHI_cpc_b2_desc: "The 1962 regulations make the production team, not the commune, the basic accounting unit. Peasants work their own fields again, under a red flag."
 COLDWAR_CHI_cpc_b1f: "Terraces on Tiger Head Mountain"
 COLDWAR_CHI_cpc_b1f_desc: "Shanxi's terraces are copied across the dry north. The fields grow, and so does the militia that digs them."
 COLDWAR_CHI_cpc_b2f: "Private Plots Tolerated"
 COLDWAR_CHI_cpc_b2f_desc: "A tenth of the land is left to the household for pigs and vegetables. Rural markets reopen on the quiet."
 COLDWAR_CHI_cpc_pm: "The Party Centre"
 COLDWAR_CHI_cpc_pm_desc: "Whatever the provinces say, the documents issued by the Centre are read aloud in every brigade. The line is one, and it comes from Beijing."
 COLDWAR_CHI_cpc_em: "Basic Construction First"
 COLDWAR_CHI_cpc_em_desc: "Capital construction is the plan's backbone. Projects are announced at rallies and finished, eventually, in the provinces."
 COLDWAR_CHI_av_mao_dead_tt: "The Chairman is dead."
 COLDWAR_CHI_cpc_c1: "Whatever Chairman Mao Decided"
 COLDWAR_CHI_cpc_c1_desc: "Uphold whatever the Chairman decided, follow whatever he instructed. Continuity is legitimacy, and our authority rests on his."
 COLDWAR_CHI_cpc_c2: "Practice Is the Sole Criterion"
 COLDWAR_CHI_cpc_c2_desc: "If the Guangming Daily is right, truth is tested by results and not by quotations. Admitting it costs the Centre its certainty."
 COLDWAR_CHI_cpc_c1f: "The Mausoleum on Tiananmen Square"
 COLDWAR_CHI_cpc_c1f_desc: "A memorial hall rises in a single year with stone from every province. The Chairman lies in state and the line lies with him."
 COLDWAR_CHI_cpc_c2f: "Reverse the Unjust Verdicts"
 COLDWAR_CHI_cpc_c2f_desc: "Tens of thousands of cadres are cleared and recalled. They bring skills back, and they bring memories of who denounced them."
 COLDWAR_CHI_cpc_d1: "The Foreign Leap Forward"
 COLDWAR_CHI_cpc_d1_desc: "One hundred and twenty great projects, steel complexes and petrochemical plants bought abroad. The plan doubles, and so does what we owe."
 COLDWAR_CHI_cpc_d2: "Dig Tunnels Deep, Store Grain Everywhere"
 COLDWAR_CHI_cpc_d2_desc: "Beijing digs an underground city beneath its courtyards. Self-reliance means granaries, shelters and a country that cannot be starved out."
 COLDWAR_CHI_cpc_d1f: "Baoshan on the Yangtze"
 COLDWAR_CHI_cpc_d1f_desc: "A Japanese-designed steelworks outside Shanghai, the largest single import of the decade. Its blast furnaces will define the coast."
 COLDWAR_CHI_cpc_d2f: "Grain Reserves in Every County"
 COLDWAR_CHI_cpc_d2f_desc: "Granaries are dug into hillsides from Hebei to Hunan. A famine will not catch us twice."
 COLDWAR_CHI_cpc_cm: "Grasp the Key Link"
 COLDWAR_CHI_cpc_cm_desc: "Class struggle is the key link and everything else follows from it. The phrase settles meetings that would otherwise never end."
 COLDWAR_CHI_cpc_dm: "The Ten-Year Plan"
 COLDWAR_CHI_cpc_dm_desc: "Ten oilfields like Daqing, ten iron and steel bases, thirty power stations. On paper the century ends with China among the leading nations."
 COLDWAR_CHI_cpc_cap: "Under the Chairman's Banner"
 COLDWAR_CHI_cpc_cap_desc: "The line has outlived its doubters. The Party is whole, the plan is ours, and the Chairman's banner still leads the march."
 COLDWAR_CHI_sc_e: "The Four Modernisations"
 COLDWAR_CHI_sc_e_desc: "Premier Zhou's 1964 report named the goal: modern agriculture, industry, defence and science. The State Council governs to it and will set the century's end as the deadline."
 COLDWAR_CHI_sc_p: "Protect the Specialists"
 COLDWAR_CHI_sc_p_desc: "The Premier's lists keep engineers, scientists and old ministers out of the struggle sessions. Each name saved is a quarrel with the Cultural Revolution Group."
 COLDWAR_CHI_sc_q: "Rebuild the Planning Commission"
 COLDWAR_CHI_sc_q_desc: "Yu Qiuli's petroleum men take over the Planning Commission. Targets come from Daqing's ledgers rather than from rallies."
 COLDWAR_CHI_sc_a1: "Keep the Chairman's Trust"
 COLDWAR_CHI_sc_a1_desc: "The Premier never stands against the Chairman in public. Survival is the precondition of every reform."
 COLDWAR_CHI_sc_a2: "Recall the Veteran Cadres"
 COLDWAR_CHI_sc_a2_desc: "Deng Xiaoping writes from his tractor plant in Jiangxi asking for work. Bringing him back strengthens the government and the Premier's rivals both."
 COLDWAR_CHI_sc_a1f: "The Premier's Diplomacy"
 COLDWAR_CHI_sc_a1f_desc: "Zhou receives every visitor himself. Courtesy is policy, and China's face abroad is his."
 COLDWAR_CHI_sc_a2f: "The 1975 Rectification"
 COLDWAR_CHI_sc_a2f_desc: "The army, then the railways, then steel. Comprehensive rectification restores order sector by sector, and the rebels lose their posts."
 COLDWAR_CHI_sc_b1: "The 4-3 Programme"
 COLDWAR_CHI_sc_b1_desc: "Four point three billion dollars buy thirteen fertiliser complexes and chemical fibre plants from Japan and the West. The fields will feel it, and so will the reserves."
 COLDWAR_CHI_sc_b2: "Industry Learns from Daqing"
 COLDWAR_CHI_sc_b2_desc: "Iron Man Wang drilled through the frozen steppe with men and buckets. Daqing proves that we can do it ourselves, slowly and at great sacrifice."
 COLDWAR_CHI_sc_b1f: "Fertiliser for Eight Hundred Million"
 COLDWAR_CHI_sc_b1f_desc: "Urea from the new plants reaches the paddies of Jiangsu and Hunan. Each tonne is grain we do not have to import."
 COLDWAR_CHI_sc_b2f: "The Oil Ministry's Men"
 COLDWAR_CHI_sc_b2f_desc: "Kang Shi'en and the oilfield cadres build pipelines to Qinhuangdao. Crude becomes our first export, and our first argument abroad."
 COLDWAR_CHI_sc_pm: "The National Planning Conference"
 COLDWAR_CHI_sc_pm_desc: "For the first time since 1966 the ministries meet to fit their plans together. The economy has a ledger again."
 COLDWAR_CHI_sc_em: "Balance the Plan"
 COLDWAR_CHI_sc_em_desc: "Light industry and agriculture get their share before steel. The people notice when there is soap in the shops."
 COLDWAR_CHI_sc_c1: "Readjust and Consolidate"
 COLDWAR_CHI_sc_c1_desc: "Chen Yun's bird in a cage: the market may fly, but only inside the plan. Growth slows and the accounts balance."
 COLDWAR_CHI_sc_c2: "The High-Speed Plan"
 COLDWAR_CHI_sc_c2_desc: "Yu Qiuli promises steel and oil by the shipload. Ten years of growth in five, financed with credits we will repay later."
 COLDWAR_CHI_sc_c1f: "The Cage and the Bird"
 COLDWAR_CHI_sc_c1f_desc: "Prices are set, quotas are kept and the margin above them is sold. It is the safest reform there is, and it will never be enough."
 COLDWAR_CHI_sc_c2f: "A Hundred and Twenty Projects"
 COLDWAR_CHI_sc_c2f_desc: "Wuhan, Panzhihua and the Yangtze dams: the great projects fill the provinces with cranes."
 COLDWAR_CHI_sc_d1: "Normalise with Washington First"
 COLDWAR_CHI_sc_d1_desc: "The secret channel through Islamabad opened the door. Washington is the key to the West, to Tokyo and to the United Nations."
 COLDWAR_CHI_opinion_minus_5: "Chinese Hostility"
 COLDWAR_CHI_sc_d2: "Trade with Tokyo and Europe"
 COLDWAR_CHI_sc_d2_desc: "The Liao-Takasaki trade channel never closed. Japanese and European firms sell what Washington will not license."
 COLDWAR_CHI_sc_d1f: "Technology through Diplomacy"
 COLDWAR_CHI_sc_d1f_desc: "Diplomatic recognition opens export licences: computers, jet engines and seismographs arrive with the delegations."
 COLDWAR_CHI_sc_d2f: "Complete Plants from Japan"
 COLDWAR_CHI_sc_d2f_desc: "Turnkey steel and chemical plants come with Japanese engineers to commission them. Shanghai's skyline changes first."
 COLDWAR_CHI_sc_cm: "The State Council Governs"
 COLDWAR_CHI_sc_cm_desc: "The ministries run the country and the Party sets the direction. For a while the arrangement holds."
 COLDWAR_CHI_sc_dm: "Open Coastal Ports"
 COLDWAR_CHI_sc_dm_desc: "Dalian, Tianjin and Guangzhou are cleared for foreign ships. Trade grows, and so does exposure to the world's prices."
 COLDWAR_CHI_sc_cap: "A Modern Socialist Country"
 COLDWAR_CHI_sc_cap_desc: "Agriculture, industry, defence and science advance together. The Premier's timetable is no longer a dream."
 COLDWAR_CHI_prac_e: "Seek Truth from Facts"
 COLDWAR_CHI_prac_e_desc: "The Eighth Congress said it in 1956: the main contradiction is backward productive forces, not class struggle. The men who said so are back."
 COLDWAR_CHI_prac_p: "Emancipate the Mind"
 COLDWAR_CHI_prac_p_desc: "Practice is the sole criterion for testing truth. Every dogma must answer to results, including the Chairman's."
 COLDWAR_CHI_prac_q: "Grain Is the Key Link"
 COLDWAR_CHI_prac_q_desc: "Let the peasant eat first. Wan Li in Anhui and Zhao Ziyang in Sichuan prove that harvests follow incentives."
 COLDWAR_CHI_prac_a1: "The Four Cardinal Principles"
 COLDWAR_CHI_prac_a1_desc: "Socialism, the dictatorship of the proletariat, Party leadership and Mao Zedong Thought: reform yes, but within four walls."
 COLDWAR_CHI_prac_a2: "Separate Party and Government"
 COLDWAR_CHI_prac_a2_desc: "Factory directors, not Party secretaries, run factories. Ministries answer to the State Council. The apparatus resists every step."
 COLDWAR_CHI_prac_a1f: "Seventy Percent Right"
 COLDWAR_CHI_prac_a1f_desc: "The Chairman's merits are primary, his errors secondary. The portrait stays on Tiananmen and the campaigns stay in the past."
 COLDWAR_CHI_prac_a2f: "The Resolution on Party History"
 COLDWAR_CHI_prac_a2f_desc: "The Party declares the Cultural Revolution a catastrophe. Saying so closes a wound and opens a debate about who caused it."
 COLDWAR_CHI_prac_b1: "The Household Responsibility System"
 COLDWAR_CHI_prac_b1_desc: "Eighteen farmers in Xiaogang signed a secret contract with their thumbprints. Every household now delivers its quota and keeps the rest."
 COLDWAR_CHI_prac_b2: "Rectify the Communes"
 COLDWAR_CHI_prac_b2_desc: "Smaller work groups and fair work points: the commune survives, but it pays for effort."
 COLDWAR_CHI_prac_b1f: "Township Enterprises"
 COLDWAR_CHI_prac_b1f_desc: "Brigade workshops become village factories making bricks, fans and shoes. Wealth grows outside the plan, and so do the favours."
 COLDWAR_CHI_prac_b2f: "Grain Procurement Prices Raised"
 COLDWAR_CHI_prac_b2f_desc: "The state pays twenty percent more for quota grain. The treasury groans and the countryside smiles."
 COLDWAR_CHI_prac_pm: "Learn from the World"
 COLDWAR_CHI_prac_pm_desc: "Delegations tour Tokyo's car plants and Houston's space centre. What they saw is reported to the Politburo without embellishment, and it is humbling."
 COLDWAR_CHI_prac_em: "Let Some Get Rich First"
 COLDWAR_CHI_prac_em_desc: "Wealth will spread from the coast inland and from the able to the rest. Until then, envy is the price."
 COLDWAR_CHI_prac_c1_state: "Special Economic Zones"
 COLDWAR_CHI_prac_c1: "Special Economic Zones"
 COLDWAR_CHI_prac_c1_desc: "Shenzhen, Zhuhai, Shantou and Xiamen open to foreign capital under their own rules. Smuggling follows the investors across the Shenzhen River."
 COLDWAR_CHI_prac_c2: "Coastal Cities without Zones"
 COLDWAR_CHI_prac_c2_desc: "Fourteen ports open slowly under the old rules. Less money comes, and less trouble with it."
 COLDWAR_CHI_prac_c1f: "Shenzhen Speed"
 COLDWAR_CHI_prac_c1f_desc: "A floor every three days on the International Trade Centre. A fishing town becomes a city before the maps are redrawn."
 COLDWAR_CHI_prac_c2f: "Joint Ventures Law"
 COLDWAR_CHI_prac_c2f_desc: "Foreign partners must hold at least a quarter of a joint venture. Volkswagen comes to Shanghai, and its engineers come with it."
 COLDWAR_CHI_prac_d1: "Cut a Million Men"
 COLDWAR_CHI_prac_d1_desc: "The army sheds a million soldiers in two years. The budget breathes and the generals count their losses."
 COLDWAR_CHI_prac_d2: "Buy Back the Generals"
 COLDWAR_CHI_prac_d2_desc: "The army keeps its size and gains businesses of its own. Peace in the barracks has a price."
 COLDWAR_CHI_prac_d1f: "An Independent Foreign Policy"
 COLDWAR_CHI_prac_d1f_desc: "Neither ally of Washington nor of Moscow: China trades with all and joins no camp."
 COLDWAR_CHI_prac_d2f: "The Army Goes into Business"
 COLDWAR_CHI_prac_d2f_desc: "Army hotels, farms and arms trading companies earn what the budget no longer gives. Discipline and accounts both suffer."
 COLDWAR_CHI_prac_cm: "Socialism with Chinese Characteristics"
 COLDWAR_CHI_prac_cm_desc: "The 12th Congress gives the reform its name. Planning and markets are both tools; the Party decides which to pick up."
 COLDWAR_CHI_prac_dm: "The Price Reform Breakthrough"
 COLDWAR_CHI_prac_dm_desc: "Dual-track prices are breeding speculators. Abolish them at one stroke and accept a year of inflation."
 COLDWAR_CHI_prac_cap: "Reform and Opening"
 COLDWAR_CHI_prac_cap_desc: "Ten years after the Third Plenum the country is unrecognisable. Whether the Party can still recognise itself is another question."
 COLDWAR_CHI_dl_e: "Let a Hundred Schools Contend"
 COLDWAR_CHI_dl_e_desc: "Without democracy the other four modernisations will fail. The democratic parties, silenced since 1966, ask for the rights the 1954 Constitution promised."
 COLDWAR_CHI_dl_a1: "Restore the 1954 Constitution"
 COLDWAR_CHI_dl_a1_desc: "The founding constitution guaranteed elections, courts and a National People's Congress with powers. We read it again, article by article."
 COLDWAR_CHI_dl_a2: "A Second Chamber in the Consultative Conference"
 COLDWAR_CHI_dl_a2_desc: "The democratic parties and the Party share legislation in a reformed Political Consultative Conference. Power is divided, not surrendered."
 COLDWAR_CHI_dl_a1f: "Free Elections to the People's Congresses"
 COLDWAR_CHI_dl_a1f_desc: "Contested elections for local deputies, first tried in the universities, spread. Every county may now elect its deputies freely."
 COLDWAR_CHI_opinion_plus_10: "Chinese Diplomacy"
 COLDWAR_CHI_dl_a2f: "The United Front Reborn"
 COLDWAR_CHI_dl_a2f_desc: "The Revolutionary Kuomintang, the Zhi Gong Party and the Jiusan Society sit in government. Overseas Chinese capital listens."
 COLDWAR_CHI_dl_m: "Rehabilitate the Rightists"
 COLDWAR_CHI_dl_m_desc: "Half a million people labelled rightists in 1957 are cleared at last. Many of them are the scientists we lack."
 COLDWAR_CHI_dl_b1: "Rapid Privatisation"
 COLDWAR_CHI_dl_b1_desc: "State enterprises are sold or leased. Productivity jumps and so does unemployment."
 COLDWAR_CHI_dl_b2: "A Social Market"
 COLDWAR_CHI_dl_b2_desc: "Markets and a welfare net, as the West German social democrats taught. Slower, steadier, costlier."
 COLDWAR_CHI_dl_m2: "A Free Press"
 COLDWAR_CHI_dl_m2_desc: "Liu Binyan and Wang Ruowang publish without approval. The Party learns what the people think of it."
 COLDWAR_CHI_dl_cap: "A Democratic China"
 COLDWAR_CHI_dl_cap_desc: "The founding promise of 1949 to the democratic parties is kept at last. China governs itself through its congresses."
 COLDWAR_CHI_pla_e: "The Gun Commands"
 COLDWAR_CHI_pla_e_desc: "Political power grows out of the barrel of a gun. When the Party cannot hold the country together, the marshals do it for a while."
 COLDWAR_CHI_pla_p: "Military Commission Rule"
 COLDWAR_CHI_pla_p_desc: "Ye Jianying and the regional commanders govern collegially from the Western Hills. The Party remains, under protection."
 COLDWAR_CHI_pla_q: "Defence Industries First"
 COLDWAR_CHI_pla_q_desc: "The National Defence Science Commission sets the economy's priorities. Factories in Sichuan work double shifts."
 COLDWAR_CHI_pla_a1: "Return to the Barracks"
 COLDWAR_CHI_pla_a1_desc: "The Three Supports and Two Militaries end. Officers hand back the ministries and keep their divisions."
 COLDWAR_CHI_pla_a2: "Keep the Military Control Commissions"
 COLDWAR_CHI_pla_a2_desc: "The commissions run the railways, ports and provinces. Order is guaranteed and nothing else is."
 COLDWAR_CHI_pla_a1f: "The Party Under Protection"
 COLDWAR_CHI_pla_a1f_desc: "The marshals restore the Central Committee and sit in its front row. The Party governs again, with the army's permission."
 COLDWAR_CHI_pla_a2f: "Garrison Provinces"
 COLDWAR_CHI_pla_a2f_desc: "Every military region becomes a government. The commanders build roads, run factories and settle feuds."
 COLDWAR_CHI_pla_b1: "People's War under Modern Conditions"
 COLDWAR_CHI_pla_b1_desc: "Su Yu's lectures of 1977: depth defence, yes, but with tanks, artillery and air cover. The infantry era is ending."
 COLDWAR_CHI_pla_b2: "Militia and Depth"
 COLDWAR_CHI_pla_b2_desc: "Lure the enemy deep and drown him in the people's sea. It is cheap, and it is the war we know."
 COLDWAR_CHI_pla_b1f: "Combined Arms Exercises"
 COLDWAR_CHI_pla_b1f_desc: "The 1981 North China exercise puts a hundred thousand men on the plain with tanks and aircraft. The world takes note."
 COLDWAR_CHI_pla_b2f: "The Great Underground"
 COLDWAR_CHI_pla_b2f_desc: "Tunnels under Beijing and fortresses in the Taihang mountains: the north is a maze for any invader."
 COLDWAR_CHI_pla_pm: "The Commission's Statutes"
 COLDWAR_CHI_pla_pm_desc: "A charter defines what the Military Commission decides and what it leaves to the State Council."
 COLDWAR_CHI_pla_em: "The Arms Export Corporations"
 COLDWAR_CHI_pla_em_desc: "Army trading companies sell rifles and tanks wherever there is a buyer. The money stays mostly in the army."
 COLDWAR_CHI_pla_c1: "Teach the Neighbours a Lesson"
 COLDWAR_CHI_pla_c1_desc: "A short, sharp punitive campaign shows that China cannot be bullied on its borders. The cost is counted later."
 COLDWAR_CHI_pla_c2: "The Northern Fortress"
 COLDWAR_CHI_pla_c2_desc: "The threat is in the north and the army stays there. Fortified divisions line the Ussuri and the Amur."
 COLDWAR_CHI_pla_c1f: "Lessons from the Border War"
 COLDWAR_CHI_pla_c1f_desc: "The campaign exposed old radios, no ranks and poor logistics. The after-action reports become the reform programme."
 COLDWAR_CHI_pla_c2f: "The Frontier Regiments"
 COLDWAR_CHI_pla_c2f_desc: "Border regiments in Heilongjiang and Xinjiang farm, patrol and build roads. The frontier holds itself."
 COLDWAR_CHI_pla_d1: "Strategic Missiles First"
 COLDWAR_CHI_pla_d1_desc: "The Second Artillery's missiles are the guarantee no army can provide. The DF-5 programme receives what it asks."
 COLDWAR_CHI_pla_d2: "A Navy for the Seas"
 COLDWAR_CHI_pla_d2_desc: "Liu Huaqing, navy commander from 1982, argues for a navy that leaves the coast. The ground generals argue against it."
 COLDWAR_CHI_pla_d1f: "The Silos of Qinghai"
 COLDWAR_CHI_pla_d1f_desc: "The DF-4 goes into the caves of Qinghai and the DF-5 into silos in Central China. Moscow is in range, and so is everyone else."
 COLDWAR_CHI_pla_d2f: "The First Island Chain"
 COLDWAR_CHI_pla_d2f_desc: "Destroyers and submarines patrol from the Yellow Sea to the Paracels. The coast becomes a frontier again."
 COLDWAR_CHI_pla_cm: "A Professional Army"
 COLDWAR_CHI_pla_cm_desc: "Ranks return, academies reopen and officers are promoted for competence. The army becomes an army again."
 COLDWAR_CHI_pla_dm: "The Defence Science Commission"
 COLDWAR_CHI_pla_dm_desc: "Nie Rongzhen's commission links laboratories and factories. Weapons come off drawing boards faster than ever."
 COLDWAR_CHI_pla_cap: "The Guardians of the Republic"
 COLDWAR_CHI_pla_cap_desc: "The army saved the republic from chaos and will not let it fall again. It governs best, it believes, when it governs least."
 COLDWAR_CHI_planning_commission: "The State Planning Commission"
 COLDWAR_CHI_planning_commission_desc: "Yu Qiuli's small planning group replaces a commission that stopped meeting in 1967. Plans exist again, and with them arguments about who gets the steel."
 COLDWAR_CHI_third_front_question: "The Third Front Question"
 COLDWAR_CHI_third_front_question_desc: "Panzhihua, Shiyan and a thousand smaller sites still swallow half the capital budget. The war that justified them has not come."
 COLDWAR_CHI_energy_for_the_plan: "Energy for the Plan"
 COLDWAR_CHI_energy_for_the_plan_desc: "Coal from Datong, oil from Daqing, power from the Yellow River dams. Every plan begins with the question of fuel."
 COLDWAR_CHI_feed_the_nation: "Feed the Nation"
 COLDWAR_CHI_feed_the_nation_desc: "Grain output barely keeps pace with births. Every increase must come from the same fields worked harder or better."
 COLDWAR_CHI_complete_third_front: "Complete the Third Front"
 COLDWAR_CHI_complete_third_front_desc: "Finish what has been started: the steelworks, the rail lines, the aircraft plants in the valleys. A country that can lose its coast must keep its mountains."
 COLDWAR_CHI_wind_down_third_front: "Wind Down the Third Front"
 COLDWAR_CHI_wind_down_third_front_desc: "Investment returns to the coast and the old industrial base. The mountain plants are left half-built, and they stay a burden for decades."
 COLDWAR_CHI_panzhihua_steel: "Panzhihua Steel"
 COLDWAR_CHI_panzhihua_steel_desc: "A steel city grows where there was a village of eight households. Its vanadium-titanium ore feeds the defence plants of the southwest."
 COLDWAR_CHI_convert_mountain_plants_state: "Convert the Mountain Plants"
 COLDWAR_CHI_convert_mountain_plants: "Convert the Mountain Plants"
 COLDWAR_CHI_convert_mountain_plants_desc: "Gun factories learn to make motorcycles and refrigerators. Some move to the cities, most stay where they are."
 COLDWAR_CHI_daqing_fever: "Daqing Fever"
 COLDWAR_CHI_daqing_fever_desc: "In industry learn from Daqing. The oilfield on the frozen Songliao plain pumps twenty million tonnes, and more is promised."
 COLDWAR_CHI_gezhouba_dam: "The Gezhouba Dam"
 COLDWAR_CHI_gezhouba_dam_desc: "The Chairman's birthday gift of December 1970: a dam across the Yangtze at Yichang. It will take eighteen years, and it will light Hubei."
 COLDWAR_CHI_shengli_field: "The Shengli Oilfield"
 COLDWAR_CHI_shengli_field_desc: "Shandong's coastal field joins Daqing. Crude becomes an export, and the export becomes a foreign policy."
 COLDWAR_CHI_coal_for_the_northeast: "Coal for the Northeast"
 COLDWAR_CHI_coal_for_the_northeast_desc: "Fushun, Fuxin and Hegang open new seams. Power cuts in Shenyang become a winter story instead of a weekly one."
 COLDWAR_CHI_hybrid_rice: "Hybrid Rice"
 COLDWAR_CHI_hybrid_rice_desc: "Yuan Longping's team on Hainan finds a wild sterile rice plant. Three-line hybrid seed promises a fifth more grain from every paddy."
 COLDWAR_CHI_red_flag_canal: "The Red Flag Canal"
 COLDWAR_CHI_red_flag_canal_desc: "Linxian county cut a canal through the Taihang cliffs by hand. Irrigation is self-reliance made visible, and every province wants its own."
 COLDWAR_CHI_chemical_fertiliser: "Chemical Fertiliser Drive"
 COLDWAR_CHI_chemical_fertiliser_desc: "Small county nitrogen plants and large imported complexes together. Fertiliser is the cheapest grain there is."
 COLDWAR_CHI_railways_to_interior: "Railways to the Interior"
 COLDWAR_CHI_railways_to_interior_desc: "The line from Sichuan to Yunnan runs through 427 tunnels and is still being completed. Guizhou and Yunnan will be tied to the plan by rail."
 COLDWAR_CHI_four_big_items: "The Four Big Items"
 COLDWAR_CHI_four_big_items_desc: "A bicycle, a watch, a sewing machine and a radio: the dowry every family wants. Shanghai's light industry decides whether the plan is popular."
 COLDWAR_CHI_youth_come_home: "Let the Youth Come Home"
 COLDWAR_CHI_youth_come_home_desc: "The sent-down youth march on county offices from Yunnan to Heilongjiang. Letting them return ends the movement and fills the cities with job seekers."
 COLDWAR_CHI_xiangfan_chongqing: "The Xiangfan-Chongqing Line"
 COLDWAR_CHI_xiangfan_chongqing_desc: "A second line through the Daba mountains links the Third Front to Wuhan. The interior is no longer an island."
 COLDWAR_CHI_light_industry: "Light Industry"
 COLDWAR_CHI_light_industry_desc: "Textiles, enamel basins and thermos flasks reach the department stores. Ration coupons buy something again."
 COLDWAR_CHI_sixth_plan: "Sixth Plan"
 COLDWAR_CHI_sixth_plan_desc: "For the first time the plan is drawn up from what was actually built. Its targets are lower, and they are met."
 COLDWAR_CHI_econ_left_10_tt: "Economic organisation moves §Y10§! points towards the command economy."
 COLDWAR_CHI_self_reliance_end: "Self-Reliance to the End"
 COLDWAR_CHI_self_reliance_end_desc: "We owe nothing to anyone and we will keep it that way. The plan decides, the state owns, and no foreign bank sees our books."
 # IMPERIA COLD WAR — B9 MD standard: the Radical Line closes the Western line for five years, not for good
 COLDWAR_CHI_av_anti_west_not_tt: "§RNot:§! We chose the line Against Both Hegemons in the last five years."
 COLDWAR_CHI_econ_right_10_tt: "Economic organisation moves §Y10§! points towards laissez-faire."
 COLDWAR_CHI_open_the_door: "Open the Door"
 COLDWAR_CHI_open_the_door_desc: "Foreign capital, foreign machines and foreign advisers are tools like any other. The door opens, and the draught comes in with the money."
 COLDWAR_CHI_econ_left_5_tt: "Economic organisation moves §Y5§! points towards the command economy."
 COLDWAR_CHI_steel_key_link: "Steel Is the Key Link"
 COLDWAR_CHI_steel_key_link_desc: "Sixty million tonnes of steel by 1985. The shops will wait, the blast furnaces will not."
 COLDWAR_CHI_price_controls: "Prices Fixed for Life"
 COLDWAR_CHI_price_controls_desc: "Rice, oil and cloth cost what they cost in 1965. Nobody goes hungry, nobody gets rich, and the queues are long."
 COLDWAR_CHI_econ_right_5_tt: "Economic organisation moves §Y5§! points towards laissez-faire."
 COLDWAR_CHI_foreign_loans: "Foreign Loans and Credits"
 COLDWAR_CHI_foreign_loans_desc: "Japanese yen loans and World Bank credits pay for the ports and power plants. The interest is paid in hard currency, every year."
 COLDWAR_CHI_enterprise_contracts: "Enterprise Contracts"
 COLDWAR_CHI_enterprise_contracts_desc: "Factory directors sign for a quota and keep what they make above it. Output rises, and so do the bonuses, the layoffs and the favours."
 COLDWAR_CHI_av_self_reliance_end_done_1825_tt: "At least §Y1825§! days (about 5 years) have passed since §YSelf-Reliance to the End§!."
 COLDWAR_CHI_fortress_economy: "Fortress Economy"
 COLDWAR_CHI_fortress_economy_desc: "Embargoes cannot starve a country that never ate from the world's table. We are poorer than we could be and safer than anyone else."
 COLDWAR_CHI_av_wto_entry_done_1095_tt: "At least §Y1095§! days (about 3 years) have passed since §YApply to the WTO§!."
 COLDWAR_CHI_econ_above_15_tt: "Economic organisation above §Y15§! (command economy -100, laissez-faire +100)."
 COLDWAR_CHI_world_market: "World Market"
 COLDWAR_CHI_world_market_desc: "Our exports fill the ships at Hong Kong and Long Beach. When the world's markets catch a cold, Guangdong sneezes first."
 COLDWAR_CHI_av_open_the_door_done_1825_tt: "At least §Y1825§! days (about 5 years) have passed since §YOpen the Door§!."
 COLDWAR_CHI_econ_above_m50_tt: "Economic organisation above §Y-50§! (command economy -100, laissez-faire +100)."
 COLDWAR_CHI_gatt: "Apply to Rejoin the GATT"
 COLDWAR_CHI_gatt_desc: "The Republic of China left the GATT in 1950, and we never accepted that it spoke for China. Our application asks to resume China's seat in world trade, on terms the members will set."
 COLDWAR_CHI_av_fifteen_years_talks_done_1825_tt: "At least §Y1825§! days (about 5 years) have passed since §YFifteen Years of Talks§!."
 COLDWAR_CHI_econ_above_m15_tt: "Economic organisation above §Y-15§! (command economy -100, laissez-faire +100)."
 COLDWAR_CHI_av_seat_won_tt: "We hold the China seat at the United Nations."
 COLDWAR_CHI_wto_entry: "Apply to the WTO"
 COLDWAR_CHI_wto_entry_desc: "Fifteen years of working parties end in a protocol of nine hundred pages. Every member must ratify it, and every member has a price."
 COLDWAR_CHI_av_county_workshops_done_1095_tt: "At least §Y1095§! days (about 3 years) have passed since §YA Workshop in Every County§!."
 COLDWAR_CHI_quantity_quality: "Quantity Has a Quality of Its Own"
 COLDWAR_CHI_quantity_quality_desc: "Our rifles jam more often than Western ones, and we make five for every one they make. The army counts barrels, not tolerances."
 COLDWAR_CHI_av_quantity_quality_done_1460_tt: "At least §Y1460§! days (about 4 years) have passed since §YQuantity Has a Quality of Its Own§!."
 COLDWAR_CHI_econ_below_m60_tt: "Economic organisation below §Y-60§! (command economy -100, laissez-faire +100)."
 COLDWAR_CHI_peoples_arsenal: "Peoples Arsenal"
 COLDWAR_CHI_peoples_arsenal_desc: "Every county has its workshop, every province its arsenal. Nobody can blockade an economy that makes everything it needs, badly and in enormous numbers."
 COLDWAR_CHI_av_gatt_done_1460_tt: "At least §Y1460§! days (about 4 years) have passed since §YApply to Rejoin the GATT§!."
 COLDWAR_CHI_fifteen_years_talks: "Fifteen Years of Talks"
 COLDWAR_CHI_fifteen_years_talks_desc: "Working party after working party: tariffs, subsidies, state trading, intellectual property. Every member has a list, and every list is longer than the last."
 COLDWAR_CHI_av_fortress_economy_done_1095_tt: "At least §Y1095§! days (about 3 years) have passed since §YThe Fortress Economy§!."
 COLDWAR_CHI_county_workshops: "County Workshops"
 COLDWAR_CHI_county_workshops_desc: "Small plants in every county make tools, fertiliser and rifle parts. They are wasteful and slow to learn, but no bomber can find them all."
 COLDWAR_CHI_overfulfil_fourth_plan: "Overfulfil the Fourth Plan"
 COLDWAR_CHI_overfulfil_fourth_plan_desc: "The Fourth Five-Year Plan opens with a call to beat every target. The provinces race to report their quotas early, and for a few weeks the profits of the state enterprises reach Beijing in full."
 COLDWAR_CHI_three_breakthroughs: "The Three Breakthroughs"
 COLDWAR_CHI_three_breakthroughs_desc: "In two years the plants have hired nine million peasants and the state payroll has broken every limit of the plan. Three men stand where one would do, but the lines run day and night. The planners must find the grain to feed them."
 COLDWAR_CHI_hold_the_wage_line: "Hold the Wage Line"
 COLDWAR_CHI_hold_the_wage_line_desc: "Wages have not moved since 1963 and they will not move now. Every new worker is paid the starting grade, and what the plants earn beyond it goes to the state budget."
 COLDWAR_CHI_workers_for_state_plants: "Workers for the State Plants"
 COLDWAR_CHI_workers_for_state_plants_desc: "Every county sends its young men to the provincial plants, and the plants build new halls to hold them. The ration books and the flats follow the workers to the city."
 COLDWAR_CHI_learn_from_daqing: "In Industry, Learn from Daqing"
 COLDWAR_CHI_learn_from_daqing_desc: "Iron Man Wang Jinxi drilled through the winter with his own body as a mud mixer. Every plant in China now competes to match Daqing: red banners for the best team, criticism meetings for the worst."
 COLDWAR_CHI_patriotic_savings: "Patriotic Savings Drive"
 COLDWAR_CHI_patriotic_savings_desc: "The new workers earn more than their fathers ever saw in the fields. The street committees and the People's Bank urge them to save every spare yuan for the construction of the motherland."
 COLDWAR_CHI_four_modernisations: "The Four Modernisations"
 COLDWAR_CHI_four_modernisations_desc: "Agriculture, industry, defence, science and technology: the Premier has set the goal for the end of the century. The plants will need far more hands than they have today, and the hands are in the villages."
 COLDWAR_CHI_rural_credit_cooperatives: "Rural Credit Cooperatives"
 COLDWAR_CHI_rural_credit_cooperatives_desc: "The credit cooperatives hold the savings of every commune. Their deposits can carry a workshop in each village and a few weeks of the state's own bills."
 COLDWAR_CHI_leave_the_land: "Leave the Land, Not the Village"
 COLDWAR_CHI_leave_the_land_desc: "Not every peasant can move to Shanghai. The brigade workshops become factories, and a village of two thousand sends its young people to the plant at the edge of the fields. The land keeps the old; the plant takes everyone else."
 COLDWAR_CHI_two_bombs_one_satellite: "Two Bombs, One Satellite"
 COLDWAR_CHI_two_bombs_one_satellite_desc: "The atomic bomb of 1964 and the hydrogen bomb of 1967 were built while the country starved and quarrelled. The satellite is next."
 COLDWAR_CHI_the_east_is_red: "The East Is Red"
 COLDWAR_CHI_the_east_is_red_desc: "On 24 April 1970 a Long March 1 lifts Dong Fang Hong 1 from Jiuquan. The world hears our anthem from orbit."
 COLDWAR_CHI_ninth_academy: "The Ninth Academy"
 COLDWAR_CHI_ninth_academy_desc: "The weapons laboratory on the Qinghai plateau designs smaller warheads for the missiles. Its scientists live in tents and secrecy."
 COLDWAR_CHI_project_714: "Project 714"
 COLDWAR_CHI_project_714_desc: "Shuguang One, a crewed capsule, and astronauts selected from the air force. The prestige is immense and so is the bill."
 COLDWAR_CHI_recoverable_satellites: "Recoverable Satellites"
 COLDWAR_CHI_recoverable_satellites_desc: "Fanhui Shi Weixing capsules return film from orbit. Reconnaissance before prestige: the army wants to see the Soviet divisions."
 COLDWAR_CHI_project_09: "Project 09"
 COLDWAR_CHI_project_09_desc: "A nuclear submarine of our own design, with a reactor tested in Sichuan. The first hull is laid at Huludao."
 COLDWAR_CHI_reopen_universities: "Reopen the Universities"
 COLDWAR_CHI_reopen_universities_desc: "Peking and Tsinghua admit students recommended by their work units. They are workers, peasants and soldiers, and many cannot read the textbooks."
 COLDWAR_CHI_long_march_rockets: "The Long March Rockets"
 COLDWAR_CHI_long_march_rockets_desc: "The same engines launch satellites and carry warheads. Every rocket from Jiuquan is a message in two languages."
 COLDWAR_CHI_long_march_submarine: "The Long March One Submarine"
 COLDWAR_CHI_long_march_submarine_desc: "Our first nuclear attack submarine joins the North Sea Fleet. It is noisy, it is ours, and it can stay submerged for weeks."
 COLDWAR_CHI_restore_gaokao: "Restore the Gaokao"
 COLDWAR_CHI_restore_gaokao_desc: "Five point seven million sit the examination in the winter of 1977. Two hundred and seventy thousand enter universities that were empty for ten years."
 COLDWAR_CHI_xichang: "The Xichang Launch Centre"
 COLDWAR_CHI_xichang_desc: "A launch site in the Sichuan valleys, closer to the equator and far from any border. Geostationary orbit is within reach."
 COLDWAR_CHI_academy_of_sciences: "The Academy of Sciences Restored"
 COLDWAR_CHI_academy_of_sciences_desc: "Institutes reopen with their old directors. The 1975 outline report becomes the academy's charter."
 COLDWAR_CHI_science_productive_force: "Science Is a Productive Force"
 COLDWAR_CHI_science_productive_force_desc: "The National Science Conference of 1978 declares scientists part of the working class. Laboratories become the plan's engine."
 COLDWAR_CHI_military_commission: "The Military Affairs Commission"
 COLDWAR_CHI_military_commission_desc: "The commission at the August First Building commands four million soldiers. Most of them grow their own food and many run provinces."
 COLDWAR_CHI_northern_front: "The Northern Front"
 COLDWAR_CHI_northern_front_desc: "Fifty divisions face the Soviet armies on the Amur and in Xinjiang. Their weapons date from the Korean War."
 COLDWAR_CHI_peoples_navy: "The People's Navy"
 COLDWAR_CHI_peoples_navy_desc: "A coastal fleet of fast boats and submarines guards the approaches. Blue water is a distant ambition."
 COLDWAR_CHI_peoples_air_force: "The People's Air Force"
 COLDWAR_CHI_peoples_air_force_desc: "Thousands of J-5 and J-6 fighters, copies of Soviet designs, and pilots who fly too few hours."
 COLDWAR_CHI_second_artillery: "The Second Artillery Corps"
 COLDWAR_CHI_second_artillery_desc: "The strategic missile force answers to the Commission alone. Its brigades hide in the hills of Liaoning and Anhui."
 COLDWAR_CHI_hold_every_inch: "Hold Every Inch"
 COLDWAR_CHI_hold_every_inch_desc: "Not one more Zhenbao. Every island and every pass is garrisoned, and the border divisions are reinforced."
 COLDWAR_CHI_defence_in_depth: "Defence in Depth"
 COLDWAR_CHI_defence_in_depth_desc: "Trade space for time: lure the Soviet tanks into the plains and the hills, then cut them off. The border towns will be lost first."
 COLDWAR_CHI_luda_destroyers: "The Luda Destroyers"
 COLDWAR_CHI_luda_destroyers_desc: "Type 051, the first destroyer built in China, is launched at Dalian in 1970. Seventeen will follow."
 COLDWAR_CHI_j7_mass_production: "The J-7 in Mass Production"
 COLDWAR_CHI_j7_mass_production_desc: "Chengdu builds the MiG-21 from the drawings we kept. It is cheap and it is everywhere, and it breaks down more often than its pilots like."
 COLDWAR_CHI_j8_interceptor: "The J-8 Interceptor"
 COLDWAR_CHI_j8_interceptor_desc: "Shenyang's twin-engine interceptor meets Soviet bombers high and fast. Every airframe costs what two J-7s cost, and it is years late."
 COLDWAR_CHI_df3_brigades: "DF-3 Brigades"
 COLDWAR_CHI_df3_brigades_desc: "Liquid-fuelled missiles that reach Manila, Okinawa and the Soviet Far East. Launch sites are carved into mountains."
 COLDWAR_CHI_ussuri_garrisons: "Ussuri Garrisons"
 COLDWAR_CHI_ussuri_garrisons_desc: "Frontier regiments farm, patrol and dig. The river freezes each winter, and each winter they wait."
 COLDWAR_CHI_submarine_flotillas: "Submarine Flotillas"
 COLDWAR_CHI_submarine_flotillas_desc: "Romeo-class boats from Wuhan and Jiangnan fill three fleets. Numbers make up for silence."
 COLDWAR_CHI_q5_regiments: "Q-5 Attack Regiments"
 COLDWAR_CHI_q5_regiments_desc: "Nanchang's attack jet, designed in the Great Leap, finally equips ground support regiments."
 COLDWAR_CHI_df4_moscow: "A Missile to Reach Moscow"
 COLDWAR_CHI_df4_moscow_desc: "The DF-4 is extended until it can reach the Soviet capital from Qinghai. Deterrence is distance."
 COLDWAR_CHI_peoples_war_doctrine: "The People's War Doctrine"
 COLDWAR_CHI_peoples_war_doctrine_desc: "Doctrine follows the Chairman: the people's sea drowns any invader. Plans for the north are rewritten around it."
 COLDWAR_CHI_south_sea_fleet: "The South Sea Fleet"
 COLDWAR_CHI_south_sea_fleet_desc: "Zhanjiang's fleet watches the Paracels and the Gulf of Tonkin. The South China Sea is a frontier we can no longer ignore."
 COLDWAR_CHI_capital_air_defence: "Capital Air Defence"
 COLDWAR_CHI_capital_air_defence_desc: "Missile batteries ring Beijing. The HQ-2, our copy of the SA-2, has already downed spy planes over the mainland."
 COLDWAR_CHI_army_of_whole_people: "An Army of the Whole People"
 COLDWAR_CHI_army_of_whole_people_desc: "Regulars, militia and the production corps form one army. Any invader fights eight hundred million."
 COLDWAR_CHI_av_military_commission_done_1460_tt: "At least §Y1460§! days (about 4 years) have passed since §YThe Military Affairs Commission§!."
 COLDWAR_CHI_return_barracks: "Return to the Barracks"
 COLDWAR_CHI_return_barracks_desc: "The Three Supports and Two Militaries end. Officers hand the ministries back to the Party and go back to drill."
 COLDWAR_CHI_av_army_of_whole_people_done_730_tt: "At least §Y730§! days (about 2 years) have passed since §YAn Army of the Whole People§!."
 COLDWAR_CHI_academies: "The Military Academies Reopen"
 COLDWAR_CHI_academies_desc: "The Military Academy and the staff colleges admit officers again. The teachers are men who have just come back from labour camps."
 COLDWAR_CHI_av_army_of_whole_people_done_1460_tt: "At least §Y1460§! days (about 4 years) have passed since §YAn Army of the Whole People§!."
 COLDWAR_CHI_modernise_arsenal: "Modernise the Arsenal"
 COLDWAR_CHI_modernise_arsenal_desc: "Defence is the last of the four modernisations, and it gets the least money. What we cannot buy we copy, a generation late."
 COLDWAR_CHI_av_academies_done_2190_tt: "At least §Y2190§! days (about 6 years) have passed since §YThe Military Academies Reopen§!."
 COLDWAR_CHI_restore_ranks: "Restore Military Ranks"
 COLDWAR_CHI_restore_ranks_desc: "Twenty-three years after they were abolished, epaulettes return. Seventeen generals receive the rank of general, and the army knows who commands it."
 COLDWAR_CHI_av_modernise_arsenal_done_1825_tt: "At least §Y1825§! days (about 5 years) have passed since §YModernise the Arsenal§!."
 COLDWAR_CHI_streamline_regions: "Streamline the Military Regions"
 COLDWAR_CHI_streamline_regions_desc: "Eleven military regions become seven, and a million soldiers go home. The army that remains is smaller and still very large."
 COLDWAR_CHI_foreign_ministry: "The Foreign Ministry Reopens"
 COLDWAR_CHI_foreign_ministry_desc: "In 1970 our ambassadors return to the posts they left in 1967. The rebels who burned the British mission are gone from the ministry."
 COLDWAR_CHI_third_world_friends: "Third World Friends"
 COLDWAR_CHI_third_world_friends_desc: "Aid without conditions, engineers who live like the locals, loans without interest. Our friendship is a policy against both superpowers."
 COLDWAR_CHI_socialist_brothers: "The Socialist Brothers"
 COLDWAR_CHI_socialist_brothers_desc: "Pyongyang, Hanoi and Tirana stood with us in the split. Brotherhood is paid for in rice, rifles and steel."
 COLDWAR_CHI_tension_m1_tt: "Cold War tension §G-1§!"
 COLDWAR_CHI_ping_pong: "Ping Pong"
 COLDWAR_CHI_ping_pong_desc: "An American table tennis player boards our team's bus in Nagoya. A small ball moves the globe."
 COLDWAR_CHI_pair_rule_tt: "Paired agreements rest while the two countries are at war, embargo each other or keep one of the four Imperia sanction classes in either direction, and return without new fees when that ends."
 COLDWAR_CHI_tazara: "The Friendship Railway"
 COLDWAR_CHI_tazara_desc: "A railway from Dar es Salaam to the Zambian copperbelt, refused by the World Bank, built by fifty thousand of our workers. Nyerere and Kaunda sign; each decides for his own country."
 COLDWAR_CHI_karakoram: "The Karakoram Highway"
 COLDWAR_CHI_karakoram_desc: "A road over the Khunjerab Pass, blasted into the highest mountains on earth. Islamabad is our window on the Indian Ocean and our channel to Washington."
 COLDWAR_CHI_rubber_rice: "The Rubber-Rice Pact"
 COLDWAR_CHI_rubber_rice_desc: "Since 1952 Ceylon's rubber has bought our rice at fair prices, embargo or not. Colombo renews the pact if it wishes."
 COLDWAR_CHI_weekly_sihanouk_tt: "[ROOT.GetNameDefCap] pays §R0.6%§! of its GDP per year to the agreement, recomputed every week."
 COLDWAR_CHI_sihanouk: "Shelter the Prince"
 COLDWAR_CHI_sihanouk_desc: "Prince Sihanouk's Cambodia keeps the war at its borders and the trail open. Our aid missions build roads, factories and loyalty in Phnom Penh."
 COLDWAR_CHI_weekly_lips_and_teeth_tt: "[ROOT.GetNameDefCap] pays §R0.15%§! of its GDP per year to the agreement, recomputed every week."
 COLDWAR_CHI_lips_and_teeth: "As Close as Lips and Teeth"
 COLDWAR_CHI_lips_and_teeth_desc: "Premier Zhou's visit of April 1970 ends three cold years. The 1961 treaty binds us to Pyongyang again; Kim Il Sung decides how closely."
 COLDWAR_CHI_weekly_comrades_brothers_tt: "[ROOT.GetNameDefCap] pays §R0.9%§! of its GDP per year to the agreement, recomputed every week."
 COLDWAR_CHI_comrades_brothers: "Comrades and Brothers"
 COLDWAR_CHI_comrades_brothers_desc: "Our engineering troops build roads and anti-aircraft sites from the border to Hanoi. Hanoi accepts the help, and counts its debts."
 COLDWAR_CHI_weekly_beacon_europe_tt: "[ROOT.GetNameDefCap] pays §R0.3%§! of its GDP per year to the agreement, recomputed every week."
 COLDWAR_CHI_beacon_europe: "A Beacon in Europe"
 COLDWAR_CHI_beacon_europe_desc: "Tirana is the only European capital that stood with us. Our credits build its steelworks at Elbasan; Hoxha decides how long he wants them."
 COLDWAR_CHI_bucharest_channel: "The Bucharest Channel"
 COLDWAR_CHI_bucharest_channel_desc: "Ceausescu keeps his distance from Moscow and his door open to us. Bucharest carries messages that cannot be sent directly."
 COLDWAR_CHI_tension_m3_tt: "Cold War tension §G-3§!"
 COLDWAR_CHI_shanghai_communique: "The Shanghai Communique"
 COLDWAR_CHI_shanghai_communique_desc: "Kissinger came through Islamabad; now the President comes to Beijing. Both sides state their differences and agree to oppose hegemony, if Washington signs."
 COLDWAR_CHI_normalise_japan: "Normalise with Japan"
 COLDWAR_CHI_normalise_japan_desc: "Tanaka may come to Beijing and apologise for the war. Trade will follow the flag, and yen loans will follow trade."
 COLDWAR_CHI_peace_friendship: "Treaty of Peace and Friendship"
 COLDWAR_CHI_peace_friendship_desc: "The 1978 treaty with its clause against hegemony. Tokyo's steel and plant makers sign contracts the same year."
 COLDWAR_CHI_western_technology: "Western Technology"
 COLDWAR_CHI_western_technology_desc: "Boeing jets, Kellogg fertiliser plants and seismographs: what the communique opens, the ministries buy."
 COLDWAR_CHI_isolation_ends: "The Isolation Ends"
 COLDWAR_CHI_isolation_ends_desc: "Washington and Tokyo both deal with Beijing as China's government. The bastion becomes a capital."
 COLDWAR_CHI_frontier_regions: "The Frontier Regions"
 COLDWAR_CHI_frontier_regions_desc: "Tibet, Xinjiang and Inner Mongolia make up two fifths of our land and three in a hundred of our people. Their borders face India and the Soviet Union."
 COLDWAR_CHI_tibet_development_state: "Development of Tibet"
 COLDWAR_CHI_tibet_development: "Development of Tibet"
 COLDWAR_CHI_tibet_development_desc: "Roads to Lhasa and a power station on the Lhasa river. Development is our argument against the Dalai Lama's exiles."
 COLDWAR_CHI_production_corps: "The Production and Construction Corps"
 COLDWAR_CHI_production_corps_desc: "Two million settlers in uniform farm the oases and guard the Soviet border. Xinjiang is held by ploughs as well as rifles."
 COLDWAR_CHI_beijing_border_talks: "The Beijing Border Talks"
 COLDWAR_CHI_beijing_border_talks_desc: "Kosygin and the Premier met at Beijing airport in September 1969, and the deputy ministers have been talking ever since. A line on the map would let the shelters close."
 COLDWAR_CHI_hong_kong_macau_state: "Hong Kong and Macau Stay Open"
 COLDWAR_CHI_hong_kong_macau: "Hong Kong and Macau Stay Open"
 COLDWAR_CHI_hong_kong_macau_desc: "The colonies earn a third of our foreign currency. We leave them alone and wait for 1997."
 COLDWAR_CHI_taiwan_question: "The Taiwan Question"
 COLDWAR_CHI_taiwan_question_desc: "Chiang Kai-shek still claims to be China's president. Taiwan is the last chapter of the civil war, and the Seventh Fleet guards it."
 COLDWAR_CHI_liberate_taiwan: "Liberate Taiwan"
 COLDWAR_CHI_liberate_taiwan_desc: "The Fuzhou military region drills for a crossing. The war is a decision for the Centre; the preparation is a message to Taipei and Washington."
 COLDWAR_CHI_opinion_plus_20: "Chinese Diplomacy"
 COLDWAR_CHI_message_to_compatriots: "A Message to Compatriots in Taiwan"
 COLDWAR_CHI_message_to_compatriots_desc: "End the shelling of Kinmen, open mail and trade, and talk. Reunification by persuasion takes longer and costs less."
 COLDWAR_CHI_one_china_category_unlocked_tt: "Unlocks the decisions of §YOne China§!."
 COLDWAR_CHI_one_china: "There Is Only One China"
 COLDWAR_CHI_one_china_desc: "Taipei calls itself the Republic of China and sits in our seat. Every capital in the world must choose: there is one China, and its government is in Beijing."
 COLDWAR_CHI_recognition_drive: "Recognition Drive"
 COLDWAR_CHI_recognition_drive_desc: "Canada and Italy have just switched. Each new embassy in Beijing is one fewer in Taipei, and one more vote in New York."
 COLDWAR_CHI_friendship_offers_unlocked_tt: "Unlocks the decision §YOffer of Friendship§! (targeted)."
 COLDWAR_CHI_friendship_offers: "Friendship for Recognition"
 COLDWAR_CHI_friendship_offers_desc: "Interest-free loans, a stadium, a railway survey. Recognition opens the door to all of it, and Taipei cannot match our list."
 COLDWAR_CHI_sever_ties_unlocked_tt: "Unlocks the pressure decisions §YLodge a Protest§!, §YRecall Our Ambassador§! and §YTrade Boycott§! (targeted)."
 COLDWAR_CHI_sever_ties: "No Friends for Taipei's Friends"
 COLDWAR_CHI_sever_ties_desc: "Whoever keeps an embassy in Taipei will find our doors closed, our ships elsewhere and our friends cold."
 COLDWAR_CHI_canton_invite_tt: "Every country with a human player is invited once: accepting gives §YGuest at the Canton Fair§! for 730 days (+5% trade opinion, +5% resource export revenue)."
 COLDWAR_CHI_canton_fair: "Canton Fair"
 COLDWAR_CHI_canton_fair_desc: "Twice a year Guangzhou opens its halls to foreign buyers. This season we invite every government that wants to trade, whatever it thinks of us."
 COLDWAR_CHI_albanian_resolution_unlocked_tt: "Unlocks the decision §YLobby for the Resolution§! (targeted)."
 COLDWAR_CHI_albanian_resolution: "The Albanian Resolution"
 COLDWAR_CHI_albanian_resolution_desc: "Every autumn since 1961 Tirana tables the resolution to restore the lawful rights of the People's Republic. Every year the majority grows."
 COLDWAR_CHI_cosponsors: "Cosponsors from the Third World"
 COLDWAR_CHI_cosponsors_desc: "Albania, Algeria and Tanzania lead the list of cosponsors. Each name on it is a promise of votes from its neighbours."
 COLDWAR_CHI_table_resolution: "Table the Resolution"
 COLDWAR_CHI_table_resolution_desc: "The General Assembly will vote on whether the People's Republic is China. Washington, Taipei and every delegate in between must decide."
 COLDWAR_CHI_seat_restored: "Our Delegation Arrives"
 COLDWAR_CHI_seat_restored_desc: "Qiao Guanhua leads our delegation into the hall. The applause from the African benches lasts longer than the speeches."
 COLDWAR_CHI_av_vote_lost_tt: "The General Assembly has voted against us."
 COLDWAR_CHI_av_seat_won_not_tt: "§RNot:§! We hold the China seat at the United Nations."
 COLDWAR_CHI_try_again_unlocked_tt: "Unlocks the decision §YTable the Resolution Again§!, one year after a lost vote."
 COLDWAR_CHI_try_again: "Table It Again"
 COLDWAR_CHI_try_again_desc: "They rejected us. The count still matters: every vote that went against us has a name, a price and a ministry we can reach before next autumn."
 COLDWAR_CHI_dual_rep_tt: "We take the Security Council seat and join the General Assembly. Taiwan keeps a General Assembly seat."
 COLDWAR_CHI_dual_rep: "Accept Dual Representation"
 COLDWAR_CHI_dual_rep_desc: "They rejected us, and Washington offers a consolation: two delegations, one Security Council seat, and it is ours. The Shanghai men call it a betrayal of the principle."
 COLDWAR_CHI_no_un_bid_tt: "There will be no further vote on the China seat."
 COLDWAR_CHI_counter_un: "Leave the Halls of the Imperialists"
 COLDWAR_CHI_counter_un_desc: "They rejected us. If New York will not seat China, China will stop knocking. We build a forum where the seat is ours by right, as Sukarno proposed in 1965."
 # IMPERIA COLD WAR — B9 MD standard: the Radical Line closes the Western line for five years, not for good
 COLDWAR_CHI_anti_west_tt: "For five years closes §YThe Shanghai Communique§!, §YNormalise with Japan§! and §YWestern Technology§!."
 COLDWAR_CHI_radical_line: "Against Both Hegemons"
 COLDWAR_CHI_radical_line_desc: "They rejected us, and the vote proves what the Chairman always said: both superpowers rig the world's parliament. We stop asking for a seat and organise the world's countryside instead."
 COLDWAR_CHI_permanent_voice: "Permanent Voice"
 COLDWAR_CHI_permanent_voice_desc: "A veto at the Security Council makes us a great power in law. We use it rarely and speak for the Third World often."
 COLDWAR_CHI_weekly_conefo_tt: "[ROOT.GetNameDefCap] pays §R0.3%§! of its GDP per year to the agreement, recomputed every week."
 COLDWAR_CHI_conefo: "Conference of the New Emerging Forces"
 COLDWAR_CHI_conefo_desc: "They rejected us, so we invite the rejected. Delegations from Tirana to Phnom Penh meet in a hall we built. Membership is free; leaving it is not."
 COLDWAR_CHI_both_hegemons: "Both Hegemons"
 COLDWAR_CHI_both_hegemons_desc: "They rejected us. Imperialism and social-imperialism are two faces of one enemy, and every factory meeting and every embassy hears it."
 COLDWAR_CHI_speak_third_world: "Speak for the Third World"
 COLDWAR_CHI_speak_third_world_desc: "Deng Xiaoping's speech of April 1974 sets out the Three Worlds from the rostrum of the General Assembly. The poor countries have a permanent member."
 COLDWAR_CHI_export_revolution: "Export Revolution"
 COLDWAR_CHI_export_revolution_desc: "They rejected us, and the world's countryside will answer for us. Rifles, instructors and the Little Red Book go to every movement that fights both hegemons."
 COLDWAR_CHI_taiwan_rejected_tt: "§RThey rejected us.§! The path of force is open."
 COLDWAR_CHI_thalweg_refused_tt: "A second refusal opens §YThe Ussuri Crisis§!."
 COLDWAR_CHI_one_country_two_systems: "Nine Points for Taiwan"
 COLDWAR_CHI_one_country_two_systems_desc: "Marshal Ye's nine points: Taiwan keeps its army, its economy and its way of life as a special region. Taipei may answer, or not."
 COLDWAR_CHI_hk_rejected_tt: "§RThey rejected us.§! The path of force is open."
 COLDWAR_CHI_joint_declaration: "The Joint Declaration"
 COLDWAR_CHI_joint_declaration_desc: "Fifty years unchanged after 1997: capitalism stays in Hong Kong, the flag changes. London signs, or it negotiates with a harder Beijing."
 COLDWAR_CHI_macau_rejected_tt: "§RThey rejected us.§! The path of force is open."
 COLDWAR_CHI_transfer_macau_question_POR_tt: "State §Y[1106.GetName]§! passes to [ROOT.GetNameDef]."
 COLDWAR_CHI_macau_question: "The Macau Question"
 COLDWAR_CHI_macau_question_desc: "Macau has been Portuguese by treaty since 1887, and Lisbon wonders how long it can hold a city it cannot defend. We offer three roads: hand it back, keep it in our name until the century ends, or refuse."
 COLDWAR_CHI_av_hk_rejected_tt: "London rejected the Joint Declaration."
 COLDWAR_CHI_tension_p5_tt: "Cold War tension §R+5§!"
 COLDWAR_CHI_opinion_minus_50: "Chinese Hostility"
 COLDWAR_CHI_pearl_river: "They Chose the Lease"
 COLDWAR_CHI_pearl_river_desc: "They rejected us. London would rather keep a lease on our soil than sign our declaration. The Guangzhou military region has its orders and a hundred and eighty days."
 COLDWAR_CHI_hk_victory: "The Flag over Victoria Harbour"
 COLDWAR_CHI_hk_victory_desc: "The harbour, the banks and the docks are ours. Half the money has already left for Singapore, and the other half is waiting to see what we do."
 COLDWAR_CHI_av_macau_rejected_tt: "Lisbon refused to settle the Macau question."
 COLDWAR_CHI_tension_p3_tt: "Cold War tension §R+3§!"
 COLDWAR_CHI_opinion_minus_40: "Chinese Hostility"
 COLDWAR_CHI_take_macau: "Lisbon Said No"
 COLDWAR_CHI_take_macau_desc: "They rejected us. A city that Portugal itself offered twice is now a point of honour in Lisbon. One regiment across the Barrier Gate settles it."
 COLDWAR_CHI_macau_victory: "The Flag over Macau"
 COLDWAR_CHI_macau_victory_desc: "The casinos stay open and the flag changes. Macau is the first colony on Chinese soil to come home."
 COLDWAR_CHI_av_taiwan_rejected_tt: "Taipei rejected the Nine Points."
 COLDWAR_CHI_tension_p4_tt: "Cold War tension §R+4§!"
 COLDWAR_CHI_offshore_islands: "The Offshore Islands"
 COLDWAR_CHI_offshore_islands_desc: "They rejected us. Taipei answered nine points with silence, so the batteries of Xiamen speak again. Kinmen lies two kilometres from our coast."
 COLDWAR_CHI_kinmen_victory: "The Flag over Kinmen"
 COLDWAR_CHI_kinmen_victory_desc: "The island that held out in 1949 and 1958 has fallen. Taipei's last foothold on the mainland coast is gone, and the Strait is the front line now."
 COLDWAR_CHI_south_china_sea: "The Paracels Are Ours"
 COLDWAR_CHI_south_china_sea_desc: "Our fishermen and a small garrison hold the Xisha islands. To the south, Saigon, Manila and Kuala Lumpur divide the Nansha reefs between them."
 COLDWAR_CHI_spratly_rejected_tt: "§RThey rejected us.§! The path of force is open."
 COLDWAR_CHI_transfer_spratly_note_SVN_tt: "State §Y[801.GetName]§! passes to [ROOT.GetNameDef]."
 COLDWAR_CHI_transfer_spratly_note_PHI_tt: "State §Y[802.GetName]§! passes to [ROOT.GetNameDef]."
 COLDWAR_CHI_spratly_note: "A Note on the Nansha Islands"
 COLDWAR_CHI_spratly_note_desc: "Every reef from the Paracels to James Shoal is Chinese territory. We send the note to Saigon and Manila, with trade for those who accept it."
 COLDWAR_CHI_av_spratly_rejected_tt: "Saigon or Manila rejected our note on the Nansha Islands."
 COLDWAR_CHI_spratly_war: "They Kept Our Reefs"
 COLDWAR_CHI_spratly_war_desc: "They rejected us. The South Sea Fleet sails with marines aboard. The reefs are small, the precedent is not."
 COLDWAR_CHI_spratly_victory: "The Flag over the Nansha"
 COLDWAR_CHI_spratly_victory_desc: "Our flag flies over the reefs. The oil beneath them is a promise, and the sea lanes beside them are a lever."
 COLDWAR_CHI_not_colonies: "Not Colonies"
 COLDWAR_CHI_not_colonies_desc: "Ambassador Huang Hua writes to the decolonisation committee: Hong Kong and Macau are Chinese territory occupied under unequal treaties, and their future is a matter for China alone. The committee strikes them from its list."
 COLDWAR_CHI_great_polemic: "Great Polemic"
 COLDWAR_CHI_great_polemic_desc: "Since 1960 Beijing and Moscow have accused each other in open letters, at party congresses and on the radio. The quarrel is about Lenin, about borders and about who leads the revolution."
 COLDWAR_CHI_opinion_minus_20: "Chinese Hostility"
 COLDWAR_CHI_modern_revisionism: "Down with Modern Revisionism"
 COLDWAR_CHI_modern_revisionism_desc: "In June 1963 our Proposal Concerning the General Line told every communist party that Moscow had abandoned Lenin. The Nine Commentaries followed. Khrushchev's secret speech buried Stalin, peaceful coexistence buried the revolution, and we are the heirs who kept the banner."
 COLDWAR_CHI_unequal_treaties: "The Unequal Treaties"
 COLDWAR_CHI_unequal_treaties_desc: "Aigun in 1858 and Peking in 1860 took more than a million square kilometres north of the Amur and east of the Ussuri. The Tsars took them; the Soviets kept them."
 COLDWAR_CHI_withdrawal_1960: "The Withdrawal of 1960"
 COLDWAR_CHI_withdrawal_1960_desc: "In 1959 Moscow tore up the atomic agreement. In 1960 fourteen hundred specialists left in a month with their blueprints, and half-built plants stood idle. In the war with India Moscow stood neutral."
 COLDWAR_CHI_lop_nur_question: "The Lop Nur Question"
 COLDWAR_CHI_lop_nur_question_desc: "After Zhenbao Soviet diplomats asked Washington how it would react to a strike on our test site. After Prague the Brezhnev Doctrine claims the right to rescue socialism anywhere, including here."
 COLDWAR_CHI_nine_commentaries: "The Nine Commentaries Reprinted"
 COLDWAR_CHI_nine_commentaries_desc: "The nine open letters of 1963 and 1964 go back to the presses in every language we print. Every party in the world must read why Moscow is wrong."
 COLDWAR_CHI_world_movement_unlocked_tt: "Unlocks the decision §YInvite to the Beijing Bloc§! (targeted)."
 COLDWAR_CHI_world_movement: "Lead the World Movement"
 COLDWAR_CHI_world_movement_desc: "Every ruling party must choose between Moscow's line and ours. We invite them into our camp: rice, credits and respect instead of oil and orders."
 COLDWAR_CHI_lost_territories: "Lost Territories"
 COLDWAR_CHI_lost_territories_desc: "School atlases mark the old borders in a dotted line. Every child learns the names Hailanpao and Haishenwai, and what happened there."
 COLDWAR_CHI_never_dependent: "Never Again Dependent"
 COLDWAR_CHI_never_dependent_desc: "Everything the Soviets took away we rebuild ourselves, slower and at greater cost. Nobody can switch off our factories again."
 COLDWAR_CHI_second_strike: "A Second Strike"
 COLDWAR_CHI_second_strike_desc: "Missiles in caves and on rails, dispersed across the interior. A first strike on Lop Nur would not be the last word."
 COLDWAR_CHI_mongolia_rejected_tt: "§RThey rejected us.§! The path of force is open."
 COLDWAR_CHI_mongolia_question: "Soviet Divisions in Mongolia"
 COLDWAR_CHI_mongolia_question_desc: "Four Soviet divisions sit six hundred kilometres from Beijing. Ulaanbaatar can ask them to leave, and we will make it worth its while."
 COLDWAR_CHI_av_mongolia_rejected_tt: "Ulaanbaatar refused to send the Soviet garrison home."
 COLDWAR_CHI_tension_p6_tt: "Cold War tension §R+6§!"
 COLDWAR_CHI_outer_mongolia: "Outer Mongolia Was Ours"
 COLDWAR_CHI_outer_mongolia_desc: "They rejected us. The Bogd Khan's state was a province of the Qing until Russian rifles split it off. If Ulaanbaatar prefers Soviet tanks to Chinese friendship, it can meet ours."
 COLDWAR_CHI_mongolia_victory: "The Flag over Urga"
 COLDWAR_CHI_mongolia_victory_desc: "Ulaanbaatar is Urga again. The steppe is a buffer between Beijing and Siberia, and the herders do not forgive us quickly."
 COLDWAR_CHI_confront_bear_unlocked_tt: "Unlocks the border incidents on the §YUssuri§!, the §YAmur§! and in §YXinjiang§!."
 COLDWAR_CHI_confront_bear: "Confront the Polar Bear"
 COLDWAR_CHI_confront_bear_desc: "Patrols push onto every disputed island and sandbank. The Soviet guards push back, and the world watches the rivers freeze."
 COLDWAR_CHI_av_great_polemic_done_3285_tt: "At least §Y3285§! days (about 9 years) have passed since §YThe Great Polemic§!."
 COLDWAR_CHI_three_obstacles: "Remove the Three Obstacles"
 COLDWAR_CHI_three_obstacles_desc: "Troops on the border and in Mongolia, the war in Afghanistan, Vietnam in Cambodia. Remove the three obstacles, and we can talk as neighbours again."
 COLDWAR_CHI_thalweg_offer: "A Line on the Thalweg"
 COLDWAR_CHI_thalweg_offer_desc: "International law puts a river border in the middle of the main channel. That gives us Zhenbao and six hundred other islands, and Moscow nothing to fight over."
 COLDWAR_CHI_beijing_summit: "The Beijing Summit"
 COLDWAR_CHI_beijing_summit_desc: "The General Secretary comes to Beijing for the first summit in thirty years. The handshake is cool, and it ends the longest cold war inside the socialist camp."
 COLDWAR_CHI_av_border_rejected_twice_tt: "Moscow refused a line on the thalweg twice."
 COLDWAR_CHI_ussuri_crisis_tt: "The Soviet player answers one great border clash (no war goal, no territory)."
 COLDWAR_CHI_generals_2_tt: "Two army generals gain §G+1§! attack and §G+1§! defence. Frontier clashes §G+3§!."
 COLDWAR_CHI_ussuri_war: "The Ussuri Crisis"
 COLDWAR_CHI_ussuri_war_desc: "They rejected us twice. Not war, but the largest clash since 1969: a division on each bank, artillery on the ice, and both capitals daring the other to go further. Our officers learn more in a week than in ten years of study."
 COLDWAR_CHI_tension_p8_tt: "Cold War tension §R+8§!"
 COLDWAR_CHI_recover_lost_lands: "Recover the Lost Lands"
 COLDWAR_CHI_recover_lost_lands_desc: "They rejected us, and now they are at war with us. The lands of Aigun and Peking are within reach, and the Second Artillery stands behind the infantry."
 COLDWAR_CHI_haishenwai: "The Flag over Haishenwai"
 COLDWAR_CHI_haishenwai_desc: "Vladivostok is Haishenwai again, and the Sea of Japan is ours to sail. Hundreds of thousands of Russians wait to see what the new rulers will do."
 COLDWAR_CHI_av_bloc_share_015_tt: "The Beijing bloc holds more than §Y15%§! of the world's bloc power."
 COLDWAR_CHI_anti_hegemony_camp: "Leader of the Anti-Hegemony Camp"
 COLDWAR_CHI_anti_hegemony_camp_desc: "Tirana, Bucharest and Pyongyang now look to Beijing before they look to Moscow. A third pole exists, and we are its centre."
 COLDWAR_CHI_enemy_of_enemy: "The Enemy of My Enemy"
 COLDWAR_CHI_enemy_of_enemy_desc: "Washington and Tokyo want what we want: a Soviet Union pinned down on two fronts. They have technology and money; we have fifty divisions on the Amur."
 COLDWAR_CHI_peace_pearl: "Peace Pearl"
 COLDWAR_CHI_peace_pearl_desc: "American avionics for our interceptors, American artillery shells and radars for the northern front. The arms embargo has a hole the shape of the Soviet threat."
 COLDWAR_CHI_zhenbao_lessons: "The Lessons of Zhenbao"
 COLDWAR_CHI_zhenbao_lessons_desc: "The island fights showed the Soviet T-62 shrugging off our rockets and our officers waiting for orders that never came. The army is allowed to learn from it, years before the plan said so."
 COLDWAR_CHI_captured_t62: "The Captured T-62"
 COLDWAR_CHI_captured_t62_desc: "A Soviet tank sank through the Ussuri ice in 1969, and our engineers pulled it out piece by piece. Its gun and its fire control are in our next tank."
 COLDWAR_CHI_av_world_movement_done_3650_tt: "At least §Y3650§! days (about 10 years) have passed since §YLead the World Movement§!."
 COLDWAR_CHI_av_bloc_share_020_tt: "The Beijing bloc holds more than §Y20%§! of the world's bloc power."
 COLDWAR_CHI_beijing_consensus_unlocked_tt: "§YInvite to the Beijing Bloc§! can now also target countries of the Western bloc."
 COLDWAR_CHI_beijing_consensus: "Beijing Consensus"
 COLDWAR_CHI_beijing_consensus_desc: "Development without lectures, loans without conditions, and a seat at the table for every member. Twenty years after the split, the third camp is a model others ask to join."
 COLDWAR_CHI_centre_world_revolution: "The Centre of the World Revolution"
 COLDWAR_CHI_centre_world_revolution_desc: "The Ninth Congress names the Soviet leadership social-imperialist, and Mao Zedong Thought the Marxism-Leninism of our era. Beijing, not Moscow, is where the revolution keeps its compass."
 COLDWAR_CHI_radio_beijing: "Radio Beijing in Russian"
 COLDWAR_CHI_radio_beijing_desc: "Our transmitters speak Russian, Kazakh and Uyghur to the Soviet republics every night. Moscow must choose between a fortune for jamming and listeners in Alma-Ata who hear what the Pravda leaves out."
 COLDWAR_CHI_expel_diplomats: "Expel the Soviet Diplomats"
 COLDWAR_CHI_expel_diplomats_desc: "January 1974: Soviet diplomats are caught in a Beijing suburb handing radios to an agent. They leave on the next train, and so does Moscow's network."
 COLDWAR_CHI_av_moscow_games_tt: "Moscow hosts the next Olympic Games and the boycott window is open."
 COLDWAR_CHI_boycott_call_tt: "We call the §YBeijing bloc§! to boycott the Moscow Games (no political power cost)."
 COLDWAR_CHI_boycott_moscow: "Boycott the Moscow Games"
 COLDWAR_CHI_boycott_moscow_desc: "Our athletes stay home, and we ask our friends to do the same. A stadium with empty lanes is a message Moscow cannot jam."
 COLDWAR_CHI_afghan_channel_unlocked_tt: "Unlocks the decision §YSupply the Afghan Resistance§! (once a year while the Soviet Union fights in Afghanistan, one frontier clash)."
 COLDWAR_CHI_afghan_channel: "Afghan Channel"
 COLDWAR_CHI_afghan_channel_desc: "Mules and trucks carry our rifles and rockets over the Karakoram to Peshawar. Every Soviet helicopter brought down in the Hindu Kush is one fewer on the Amur."
 COLDWAR_CHI_vietnam_rejected_tt: "§RThey rejected us.§! The path of force is open."
 COLDWAR_CHI_hanoi_moscow: "Hanoi Leans on Moscow"
 COLDWAR_CHI_hanoi_moscow_desc: "Hanoi signs with Moscow, expels the Hoa and turns its army on Cambodia. We ask once whether the lips still remember the teeth."
 COLDWAR_CHI_the_lesson: "Teach Hanoi a Lesson"
 COLDWAR_CHI_the_lesson_desc: "They chose Moscow and marched on Phnom Penh. A short campaign across the border will show the price, and then we withdraw. The army will learn what it has forgotten since Korea."
 COLDWAR_CHI_southern_frontier: "The Southern Frontier"
 COLDWAR_CHI_southern_frontier_desc: "Yunnan and Guangxi face Vietnam, Laos and Burma; Tibet faces India; the South Sea faces everyone. Every southern border is a quarrel waiting for a reason."
 COLDWAR_CHI_av_vietnam_rejected_tt: "Hanoi rejected our friendship."
 COLDWAR_CHI_hoa_question: "The Hoa Exodus"
 COLDWAR_CHI_hoa_question_desc: "Hanoi seizes the shops of the ethnic Chinese and pushes them over the border and into the sea. Two hundred thousand arrive in Guangxi and Yunnan with nothing."
 COLDWAR_CHI_cambodia_crisis: "Hanoi Marches on Phnom Penh"
 COLDWAR_CHI_cambodia_crisis_desc: "Vietnamese divisions cross into Cambodia with Soviet trucks and Soviet guns. If Hanoi can do this to our ally, it can do it to anyone, and the world will understand when we answer."
 COLDWAR_CHI_av_lesson_started_60_tt: "At least §Y60§! days (about 0 years) have passed since §Ylesson_started§!."
 COLDWAR_CHI_generals_3_tt: "Three army generals gain §G+1§! attack and §G+1§! defence. Frontier clashes §G+3§!."
 COLDWAR_CHI_lessons_1979: "The Lessons of 1979"
 COLDWAR_CHI_lessons_1979_desc: "Whether we struck first or answered Hanoi, the campaign cost us more than it cost Vietnam. Radios failed, units without ranks lost their commanders, and the logistics broke at the border. Every report becomes a reform order."
 COLDWAR_CHI_arm_coalition_unlocked_tt: "Unlocks the decision §YSupply the Cambodian Resistance§! (once a year while Vietnam holds Phnom Penh, one frontier clash)."
 COLDWAR_CHI_arm_coalition: "Support the Coalition against Hanoi"
 COLDWAR_CHI_arm_coalition_desc: "Sihanouk's royalists, Son Sann's republicans and the Khmer guerrillas fight Vietnam together, armed through Thailand. A long war on Hanoi's flank costs us rifles and costs Hanoi divisions."
 COLDWAR_CHI_laoshan_unlocked_tt: "Unlocks the decision §YRotate an Army Group through Laoshan§! (targeted at Vietnam)."
 COLDWAR_CHI_laoshan: "Rotate through Laoshan"
 COLDWAR_CHI_laoshan_desc: "For five years every military region sends its divisions to the hills of Laoshan in turn. The front never moves, but the army that comes back is a different army."
 COLDWAR_CHI_sea_patrols: "The South Sea Patrols"
 COLDWAR_CHI_sea_patrols_desc: "Our fishing fleets and our patrol boats meet Saigon's gunboats among the Xisha reefs every season."
 COLDWAR_CHI_paracels_clash_unlocked_tt: "Unlocks the decision §YNaval Clash at the Paracels§! (targeted)."
 COLDWAR_CHI_paracels_clash: "The Battle of the Paracels"
 COLDWAR_CHI_paracels_clash_desc: "In January 1974 our minesweepers and militia drove Saigon's ships from the Crescent Group. Every clash at sea teaches our captains what manuals cannot."
 COLDWAR_CHI_johnson_reef_unlocked_tt: "Unlocks the decision §YReef Clash in the Nansha§! (targeted)."
 COLDWAR_CHI_johnson_reef: "Johnson South Reef"
 COLDWAR_CHI_johnson_reef_desc: "March 1988: our frigates open fire on Vietnamese troops standing on a reef at low tide. The South Sea Fleet has a reason to exist, and a habit of winning."
 COLDWAR_CHI_himalayan_front: "The Himalayan Frontier"
 COLDWAR_CHI_himalayan_front_desc: "Aksai Chin is ours since 1962. The McMahon Line was drawn by a British official, and New Delhi still patrols up to it."
 COLDWAR_CHI_sumdorong_unlocked_tt: "Unlocks the decision §YStandoff in the Himalaya§! (targeted at India)."
 COLDWAR_CHI_sumdorong: "The Sumdorong Chu Standoff"
 COLDWAR_CHI_sumdorong_desc: "Indian troops build a post in the Sumdorong Chu valley; we bring in a division. Neither side fires, both learn how fast they can reach the roof of the world."
 COLDWAR_CHI_opinion_minus_30: "Chinese Hostility"
 COLDWAR_CHI_small_hegemon: "The Small Hegemon"
 COLDWAR_CHI_small_hegemon_desc: "Hanoi moves border posts at the Friendship Pass, claims our islands in the Gulf of Tonkin and opens Cam Ranh Bay to the Soviet fleet. We do not wait for it to strike first: a small hegemon on our southern flank is a Soviet base with an army."
 COLDWAR_CHI_new_line_4_tt: "§YCommunist Party of China§! takes over the Party Centre: Mao Zedong, after his death Hua Guofeng."
 COLDWAR_CHI_new_line_5_tt: "§YShanghai Group§! takes over the Party Centre: Zhang Chunqiao."
 COLDWAR_CHI_leader_zhang_chunqiao: "Zhang Chunqiao"
 COLDWAR_CHI_new_line_6_tt: "§YInternationalist Faction§! takes over the Party Centre: Zhang Wentian, after his death Wu Xiuquan."
 COLDWAR_CHI_new_line_7_tt: "§YMilitary Affairs Commission Administrative Group§! takes over the Party Centre: Lin Biao, or Huang Yongsheng if Lin Biao is dead."
 COLDWAR_CHI_leader_lin_biao: "Lin Biao"
 COLDWAR_CHI_leader_huang_yongsheng: "Huang Yongsheng"
 COLDWAR_CHI_new_line_13_tt: "§YState Council§! takes over the Party Centre: Zhou Enlai, after his death Li Xiannian."
 COLDWAR_CHI_new_line_19_tt: "§YVeteran Cadres§! takes over the Party Centre: Deng Xiaoping."
 COLDWAR_CHI_leader_deng_xiaoping: "Deng Xiaoping"
 COLDWAR_CHI_new_line_2_tt: "§YChina Democratic League§! takes over the Party Centre: Yang Mingxuan, then Shi Liang, then Fei Xiaotong."
 COLDWAR_CHI_new_line_22_tt: "§YPeople's Liberation Army§! takes over the Party Centre: Marshal Ye Jianying, after his death Yang Shangkun."
 COLDWAR_CHI_end_agreements: "End Our Agreements with China"
 COLDWAR_CHI_end_agreements_desc: "We no longer want to be bound to Beijing."
 COLDWAR_CHI_end_agreements_with: "End Our Agreements"
 COLDWAR_CHI_end_agreements_with_desc: "We end every agreement with this government."
 COLDWAR_CHI.1.t: "The Chairman Is Dead"
 COLDWAR_CHI.1.d: "Mao Zedong died shortly after midnight on 9 September. Eight hundred million people stand in silence for three minutes, and every faction in Zhongnanhai counts its allies."
 COLDWAR_CHI.1.a: "The Party mourns."
 COLDWAR_CHI.2.t: "Flight 256"
 COLDWAR_CHI.2.d: "A Trident of the air force crashed in the Mongolian steppe near Öndörkhaan. Lin Biao, his wife and his son were aboard. The Chairman's successor fled, and the Party will explain it to the people."
 COLDWAR_CHI.2.a: "The Party mourns."
 COLDWAR_CHI.3.t: "The Premier Is Dead"
 COLDWAR_CHI.3.d: "Zhou Enlai died of cancer on 8 January. Wreaths pile up on the Monument to the People's Heroes, and some of the poems on them are not about him."
 COLDWAR_CHI.3.a: "The Party mourns."
 COLDWAR_CHI.4.t: "Death of Zhang Wentian"
 COLDWAR_CHI.4.d: "Zhang Wentian, General Secretary of the Long March and a voice for friendship with Moscow, has died in exile in Wuxi."
 COLDWAR_CHI.4.a: "The Party mourns."
 COLDWAR_CHI.5.t: "Death of Marshal Ye"
 COLDWAR_CHI.5.d: "Ye Jianying, the marshal who arrested the Shanghai Group and kept the army loyal, has died in Beijing."
 COLDWAR_CHI.5.a: "The Party mourns."
 COLDWAR_CHI.6.t: "Death of Yang Mingxuan"
 COLDWAR_CHI.6.d: "Yang Mingxuan, chairman of the Democratic League, has died. Shi Liang, the first Minister of Justice of the republic, leads the League."
 COLDWAR_CHI.6.a: "The Party mourns."
 COLDWAR_CHI.7.t: "Death of Shi Liang"
 COLDWAR_CHI.7.d: "Shi Liang has died. The sociologist Fei Xiaotong, rehabilitated after twenty years as a rightist, takes the chair of the League."
 COLDWAR_CHI.7.a: "The Party mourns."
 COLDWAR_CHI.8.t: "The Albanian Resolution"
 COLDWAR_CHI.8.d: "The General Assembly votes on the resolution to restore the lawful rights of the People's Republic of China and expel the representatives of Chiang Kai-shek. Our delegate must raise his card."
 COLDWAR_CHI.8.a: "Vote Yes."
 COLDWAR_CHI.8.b: "Vote No."
 COLDWAR_CHI.8.c: "Abstain."
 COLDWAR_CHI.9.t: "The Vote on Resolution 2758"
 COLDWAR_CHI.9.d: "The President of the General Assembly reads the result."
 COLDWAR_CHI.9.a: "The resolution passes."
 COLDWAR_CHI.9.b: "The resolution fails."
 COLDWAR_CHI.10.t: "China at the United Nations"
 COLDWAR_CHI.10.d: "Beijing's friends have tabled the Albanian Resolution. Our ally in Taipei asks for help, and Peking watches what we do."
 COLDWAR_CHI.10.a: "Declare it an Important Question."
 COLDWAR_CHI.10.b: "Propose dual representation."
 COLDWAR_CHI.10.c: "Let the Assembly decide."
 COLDWAR_CHI.11.t: "The Albanian Resolution"
 COLDWAR_CHI.11.d: "The Communists' friends have tabled their resolution again. This year the count is close. We can ask Washington for help, rally our friends, or prepare for the worst."
 COLDWAR_CHI.11.a: "Ask Washington for help."
 COLDWAR_CHI.11.b: "Rally our friends."
 COLDWAR_CHI.11.c: "Prepare to withdraw with dignity."
 COLDWAR_CHI.12.t: "Expelled from the United Nations"
 COLDWAR_CHI.12.d: "The General Assembly has given our seat to the Communists. Our delegation can walk out with its head high, or stay until the guards escort it."
 COLDWAR_CHI.12.a: "Withdraw with dignity."
 COLDWAR_CHI.12.b: "Stay until we are expelled."
 COLDWAR_CHI.13.t: "Two Delegations"
 COLDWAR_CHI.13.d: "Beijing takes the Security Council seat. We keep our place in the General Assembly, for now, under a compromise nobody likes."
 COLDWAR_CHI.13.a: "We remain."
 COLDWAR_CHI.14.t: "The Resolution Fails"
 COLDWAR_CHI.14.d: "The Assembly has voted the resolution down. Our seat is safe for another year, and Beijing is counting who betrayed it."
 COLDWAR_CHI.14.a: "A reprieve."
 COLDWAR_CHI.15.t: "A New Embassy in Beijing"
 COLDWAR_CHI.15.d: "[From.GetNameDefCap] recognises the People's Republic as the sole government of China."
 COLDWAR_CHI.15.a: "Our friends multiply."
 COLDWAR_CHI.16.t: "Friendship for Recognition"
 COLDWAR_CHI.16.d: "Beijing offers loans, engineers and a trade agreement if we recognise the People's Republic as the only government of China and close the embassy of Taipei."
 COLDWAR_CHI.16.a: "Recognise Beijing."
 COLDWAR_CHI.16.b: "We keep our ties with Taipei."
 COLDWAR_CHI.17.t: "They Give In"
 COLDWAR_CHI.17.d: "[From.GetNameDefCap] recognises Beijing to end our pressure."
 COLDWAR_CHI.17.a: "Good."
 COLDWAR_CHI.18.t: "China: Lodge a Protest"
 COLDWAR_CHI.18.d: "Beijing escalates over our embassy in Taipei: a formal protest over the embassy of the chiang clique."
 COLDWAR_CHI.18.a: "Recognise Beijing to end it."
 COLDWAR_CHI.18.b: "We stand by Taipei."
 COLDWAR_CHI.19.t: "They Give In"
 COLDWAR_CHI.19.d: "[From.GetNameDefCap] recognises Beijing to end our pressure."
 COLDWAR_CHI.19.a: "Good."
 COLDWAR_CHI.20.t: "China: Recall Our Ambassador"
 COLDWAR_CHI.20.d: "Beijing escalates over our embassy in Taipei: our ambassador comes home until the embassy of taipei closes."
 COLDWAR_CHI.20.a: "Recognise Beijing to end it."
 COLDWAR_CHI.20.b: "We stand by Taipei."
 COLDWAR_CHI.21.t: "They Give In"
 COLDWAR_CHI.21.d: "[From.GetNameDefCap] recognises Beijing to end our pressure."
 COLDWAR_CHI.21.a: "Good."
 COLDWAR_CHI.22.t: "China: Trade Boycott"
 COLDWAR_CHI.22.d: "Beijing escalates over our embassy in Taipei: our ports and our purchasing agencies close their doors to the friends of taipei."
 COLDWAR_CHI.22.a: "Recognise Beijing to end it."
 COLDWAR_CHI.22.b: "We stand by Taipei."
 COLDWAR_CHI.23.t: "A New Member"
 COLDWAR_CHI.23.d: "[From.GetNameDefCap] joins the Beijing bloc."
 COLDWAR_CHI.23.a: "Welcome."
 COLDWAR_CHI.24.t: "An Invitation from Beijing"
 COLDWAR_CHI.24.d: "China invites us into its camp: a third way between Washington and Moscow, with rice, credits and respect instead of orders."
 COLDWAR_CHI.24.a: "Join the Beijing bloc."
 COLDWAR_CHI.24.b: "We decline."
 COLDWAR_CHI.25.t: "They Back Down"
 COLDWAR_CHI.25.d: "[From.GetNameDefCap] chose restraint. Our men hold the ground they took."
 COLDWAR_CHI.25.a: "A victory without a war."
 COLDWAR_CHI.26.t: "They Answer in Kind"
 COLDWAR_CHI.26.d: "[From.GetNameDefCap] answered our patrol with its own. Both sides counted their wounded."
 COLDWAR_CHI.26.a: "We learned from it."
 COLDWAR_CHI.27.t: "Artillery on the Frontier"
 COLDWAR_CHI.27.d: "[From.GetNameDefCap] escalated with artillery. Neither capital wants a war, and both are closer to one."
 COLDWAR_CHI.27.a: "Hold the line."
 COLDWAR_CHI.28.t: "Incident on The Ussuri"
 COLDWAR_CHI.28.d: "Chinese border guards have pushed onto disputed ground on the Ussuri. Our frontier troops wait for orders."
 COLDWAR_CHI.28.a: "Show restraint."
 COLDWAR_CHI.28.b: "Answer in kind."
 COLDWAR_CHI.28.c: "Escalate."
 COLDWAR_CHI.29.t: "Incident on The Amur"
 COLDWAR_CHI.29.d: "Chinese border guards have pushed onto disputed ground on the Amur. Our frontier troops wait for orders."
 COLDWAR_CHI.29.a: "Show restraint."
 COLDWAR_CHI.29.b: "Answer in kind."
 COLDWAR_CHI.29.c: "Escalate."
 COLDWAR_CHI.30.t: "Incident on Xinjiang"
 COLDWAR_CHI.30.d: "Chinese border guards have pushed onto disputed ground on Xinjiang. Our frontier troops wait for orders."
 COLDWAR_CHI.30.a: "Show restraint."
 COLDWAR_CHI.30.b: "Answer in kind."
 COLDWAR_CHI.30.c: "Escalate."
 COLDWAR_CHI.31.t: "Naval Clash at the Paracels"
 COLDWAR_CHI.31.d: "China: Our gunboats and the other side's meet among the Xisha reefs."
 COLDWAR_CHI.31.a: "Show restraint."
 COLDWAR_CHI.31.b: "Answer in kind."
 COLDWAR_CHI.31.c: "Escalate."
 COLDWAR_CHI.32.t: "Reef Clash in the Nansha"
 COLDWAR_CHI.32.d: "China: Troops on a reef at low tide, and frigates within range."
 COLDWAR_CHI.32.a: "Show restraint."
 COLDWAR_CHI.32.b: "Answer in kind."
 COLDWAR_CHI.32.c: "Escalate."
 COLDWAR_CHI.33.t: "Standoff in the Himalaya"
 COLDWAR_CHI.33.d: "China: A post, a division and a valley that both sides call their own."
 COLDWAR_CHI.33.a: "Show restraint."
 COLDWAR_CHI.33.b: "Answer in kind."
 COLDWAR_CHI.33.c: "Escalate."
 COLDWAR_CHI.34.t: "Rotate an Army Group through Laoshan"
 COLDWAR_CHI.34.d: "China: Another army group goes to the hills of Laoshan for its turn at the front."
 COLDWAR_CHI.34.a: "Show restraint."
 COLDWAR_CHI.34.b: "Answer in kind."
 COLDWAR_CHI.34.c: "Escalate."
 COLDWAR_CHI.35.t: "Moscow Strikes the Supply Lines"
 COLDWAR_CHI.35.d: "[From.GetNameDefCap] bombed the camps our rifles pass through."
 COLDWAR_CHI.35.a: "Expected."
 COLDWAR_CHI.36.t: "Chinese Rifles in the Hindu Kush"
 COLDWAR_CHI.36.d: "Our troops in Afghanistan capture Chinese rifles and rockets. They come over the Karakoram through Pakistan."
 COLDWAR_CHI.36.a: "Protest to Beijing."
 COLDWAR_CHI.36.b: "Strike the supply lines."
 COLDWAR_CHI.37.t: "The Ussuri Crisis"
 COLDWAR_CHI.37.d: "A Chinese division has crossed onto the islands of the Ussuri with artillery behind it. This is not a patrol. Beijing dares us to go further, and so does our own general staff."
 COLDWAR_CHI.37.a: "Show restraint."
 COLDWAR_CHI.37.b: "Answer in kind."
 COLDWAR_CHI.37.c: "Escalate."
 COLDWAR_CHI.38.t: "Support for Our Application"
 COLDWAR_CHI.38.d: "[From.GetNameDefCap] supports China's place in world trade."
 COLDWAR_CHI.38.a: "Good."
 COLDWAR_CHI.39.t: "Concessions Demanded"
 COLDWAR_CHI.39.d: "[From.GetNameDefCap] demands concessions before it supports us."
 COLDWAR_CHI.39.a: "We pay the price."
 COLDWAR_CHI.40.t: "China Asks to Join World Trade"
 COLDWAR_CHI.40.d: "Beijing's application is before the working party. We can support it, or demand concessions on tariffs and state trading first."
 COLDWAR_CHI.40.a: "Support China."
 COLDWAR_CHI.40.b: "Demand concessions."
 COLDWAR_CHI.41.t: "Ratification Blocked"
 COLDWAR_CHI.41.d: "[From.GetNameDefCap] refuses to ratify our accession protocol."
 COLDWAR_CHI.41.a: "We will negotiate."
 COLDWAR_CHI.42.t: "China's Accession Protocol"
 COLDWAR_CHI.42.d: "The protocol for China's accession is on our parliament's table. Every member must ratify it."
 COLDWAR_CHI.42.a: "Ratify."
 COLDWAR_CHI.42.b: "Block it."
 COLDWAR_CHI.43.t: "The Accession Protocol"
 COLDWAR_CHI.43.d: "The ratification period is over."
 COLDWAR_CHI.43.a: "China joins the World Trade Organization."
 COLDWAR_CHI.43.b: "A member has blocked our accession."
 COLDWAR_CHI.44.t: "They Will Ratify"
 COLDWAR_CHI.44.d: "[From.GetNameDefCap] accepts our concessions and lifts its veto."
 COLDWAR_CHI.44.a: "Resubmit the protocol."
 COLDWAR_CHI.45.t: "Concessions from China"
 COLDWAR_CHI.45.d: "Beijing offers market access, tariff cuts and a purchase agreement if we lift our veto on its accession."
 COLDWAR_CHI.45.a: "Accept and ratify."
 COLDWAR_CHI.45.b: "Keep the veto."
 COLDWAR_CHI.46.t: "Radio Beijing in Russian"
 COLDWAR_CHI.46.d: "Chinese transmitters broadcast in Russian, Kazakh and Uyghur to our republics every night. We must jam them, whatever it costs."
 COLDWAR_CHI.46.a: "Jam the broadcasts."
 COLDWAR_CHI.47.t: "Moscow Retaliates"
 COLDWAR_CHI.47.d: "[From.GetNameDefCap] expelled our diplomats in return."
 COLDWAR_CHI.47.a: "Expected."
 COLDWAR_CHI.48.t: "Our Diplomats Expelled"
 COLDWAR_CHI.48.d: "Beijing has caught our diplomats with a spy and expelled them. Our network in China is gone."
 COLDWAR_CHI.48.a: "Expel theirs in return."
 COLDWAR_CHI.48.b: "Protest quietly."
 COLDWAR_CHI.49.t: "Social-Imperialists, Says Beijing"
 COLDWAR_CHI.49.d: "The Chinese Party Congress calls our leadership social-imperialist and claims the leadership of the world revolution."
 COLDWAR_CHI.49.a: "Answer with an open letter."
 COLDWAR_CHI.49.b: "Ignore it."
 COLDWAR_CHI.50.t: "Hong Kong Is Not a Colony, Says Beijing"
 COLDWAR_CHI.50.d: "China has had Hong Kong struck from the United Nations list of colonies. Beijing calls it Chinese territory under unequal treaties."
 COLDWAR_CHI.50.a: "Accept it quietly."
 COLDWAR_CHI.50.b: "Protest."
 COLDWAR_CHI.51.t: "Macau Is Not a Colony, Says Beijing"
 COLDWAR_CHI.51.d: "China has had Macau struck from the United Nations list of colonies. Beijing calls it Chinese territory under unequal treaties."
 COLDWAR_CHI.51.a: "Accept it quietly."
 COLDWAR_CHI.51.b: "Protest."
 COLDWAR_CHI.52.t: "Beijing Drills for a Crossing"
 COLDWAR_CHI.52.d: "The Fuzhou military region drills for a landing on Taiwan. Taipei asks whether the Seventh Fleet will be there."
 COLDWAR_CHI.52.a: "Send the Seventh Fleet into the Strait."
 COLDWAR_CHI.52.b: "Urge restraint on both sides."
 COLDWAR_CHI.53.t: "The Handover of Hong Kong"
 COLDWAR_CHI.53.d: "At midnight on 30 June 1997 the Union Flag comes down over Government House. Hong Kong returns to China under the Joint Declaration."
 COLDWAR_CHI.53.a: "The end of an era."
 COLDWAR_CHI.54.t: "The Handover of Macau"
 COLDWAR_CHI.54.d: "On 20 December 1999 Macau returns to China after more than four centuries of Portuguese administration."
 COLDWAR_CHI.54.a: "Adeus, Macau."
 COLDWAR_CHI.55.t: "Ulaanbaatar Asks Us to Leave"
 COLDWAR_CHI.55.d: "The Mongolian government has agreed with Beijing that the Soviet divisions on its soil are no longer needed. Our generals call it ingratitude; our diplomats call it the price of a quieter frontier."
 COLDWAR_CHI.55.a: "We will consider it."
 COLDWAR_CHI.56.t: "The Strategic Triangle"
 COLDWAR_CHI.56.d: "Beijing has come to an understanding with Washington and Tokyo. Every division we keep on the Amur is a division missing in Europe, and our adversaries know it."
 COLDWAR_CHI.56.a: "They will regret this alliance of convenience."
 COLDWAR_CHI.57.t: "Tanzania Accepts"
 COLDWAR_CHI.57.d: "[From.GetNameDefCap] has accepted our proposal: The Friendship Railway."
 COLDWAR_CHI.57.a: "Good."
 COLDWAR_CHI.58.t: "Tanzania Declines"
 COLDWAR_CHI.58.d: "[From.GetNameDefCap] has declined our proposal: The Friendship Railway."
 COLDWAR_CHI.58.a: "So be it."
 COLDWAR_CHI.59.t: "The Friendship Railway"
 COLDWAR_CHI.59.d: "China proposes: The Friendship Railway. A railway from Dar es Salaam to the Zambian copperbelt, refused by the World Bank, built by fifty thousand of our workers. Nyerere and Kaunda sign; each decides for his own country."
 COLDWAR_CHI.59.a: "We accept."
 COLDWAR_CHI.59.b: "We decline."
 COLDWAR_CHI.60.t: "Zambia Accepts"
 COLDWAR_CHI.60.d: "[From.GetNameDefCap] has accepted our proposal: The Friendship Railway."
 COLDWAR_CHI.60.a: "Good."
 COLDWAR_CHI.61.t: "Zambia Declines"
 COLDWAR_CHI.61.d: "[From.GetNameDefCap] has declined our proposal: The Friendship Railway."
 COLDWAR_CHI.61.a: "So be it."
 COLDWAR_CHI.62.t: "The Friendship Railway"
 COLDWAR_CHI.62.d: "China proposes: The Friendship Railway. A railway from Dar es Salaam to the Zambian copperbelt, refused by the World Bank, built by fifty thousand of our workers. Nyerere and Kaunda sign; each decides for his own country."
 COLDWAR_CHI.62.a: "We accept."
 COLDWAR_CHI.62.b: "We decline."
 COLDWAR_CHI.63.t: "Pakistan Accepts"
 COLDWAR_CHI.63.d: "[From.GetNameDefCap] has accepted our proposal: The Karakoram Highway."
 COLDWAR_CHI.63.a: "Good."
 COLDWAR_CHI.64.t: "Pakistan Declines"
 COLDWAR_CHI.64.d: "[From.GetNameDefCap] has declined our proposal: The Karakoram Highway."
 COLDWAR_CHI.64.a: "So be it."
 COLDWAR_CHI.65.t: "The Karakoram Highway"
 COLDWAR_CHI.65.d: "China proposes: The Karakoram Highway. A road over the Khunjerab Pass, blasted into the highest mountains on earth. Islamabad is our window on the Indian Ocean and our channel to Washington."
 COLDWAR_CHI.65.a: "We accept."
 COLDWAR_CHI.65.b: "We decline."
 COLDWAR_CHI.66.t: "Ceylon Accepts"
 COLDWAR_CHI.66.d: "[From.GetNameDefCap] has accepted our proposal: The Rubber-Rice Pact."
 COLDWAR_CHI.66.a: "Good."
 COLDWAR_CHI.67.t: "Ceylon Declines"
 COLDWAR_CHI.67.d: "[From.GetNameDefCap] has declined our proposal: The Rubber-Rice Pact."
 COLDWAR_CHI.67.a: "So be it."
 COLDWAR_CHI.68.t: "The Rubber-Rice Pact"
 COLDWAR_CHI.68.d: "China proposes: The Rubber-Rice Pact. Since 1952 Ceylon's rubber has bought our rice at fair prices, embargo or not. Colombo renews the pact if it wishes."
 COLDWAR_CHI.68.a: "We accept."
 COLDWAR_CHI.68.b: "We decline."
 COLDWAR_CHI.69.t: "Cambodia Accepts"
 COLDWAR_CHI.69.d: "[From.GetNameDefCap] has accepted our proposal: Shelter the Prince."
 COLDWAR_CHI.69.a: "Good."
 COLDWAR_CHI.70.t: "Cambodia Declines"
 COLDWAR_CHI.70.d: "[From.GetNameDefCap] has declined our proposal: Shelter the Prince."
 COLDWAR_CHI.70.a: "So be it."
 COLDWAR_CHI.71.t: "Shelter the Prince"
 COLDWAR_CHI.71.d: "China proposes: Shelter the Prince. Prince Sihanouk's Cambodia keeps the war at its borders and the trail open. Our aid missions build roads, factories and loyalty in Phnom Penh."
 COLDWAR_CHI.71.a: "We accept."
 COLDWAR_CHI.71.b: "We decline."
 COLDWAR_CHI.72.t: "North Korea Accepts"
 COLDWAR_CHI.72.d: "[From.GetNameDefCap] has accepted our proposal: As Close as Lips and Teeth."
 COLDWAR_CHI.72.a: "Good."
 COLDWAR_CHI.73.t: "North Korea Declines"
 COLDWAR_CHI.73.d: "[From.GetNameDefCap] has declined our proposal: As Close as Lips and Teeth."
 COLDWAR_CHI.73.a: "So be it."
 COLDWAR_CHI.74.t: "As Close as Lips and Teeth"
 COLDWAR_CHI.74.d: "China proposes: As Close as Lips and Teeth. Premier Zhou's visit of April 1970 ends three cold years. The 1961 treaty binds us to Pyongyang again; Kim Il Sung decides how closely."
 COLDWAR_CHI.74.a: "We accept."
 COLDWAR_CHI.74.b: "We decline."
 COLDWAR_CHI.75.t: "Vietnam Accepts"
 COLDWAR_CHI.75.d: "[From.GetNameDefCap] has accepted our proposal: Comrades and Brothers."
 COLDWAR_CHI.75.a: "Good."
 COLDWAR_CHI.76.t: "Vietnam Declines"
 COLDWAR_CHI.76.d: "[From.GetNameDefCap] has declined our proposal: Comrades and Brothers."
 COLDWAR_CHI.76.a: "So be it."
 COLDWAR_CHI.77.t: "Comrades and Brothers"
 COLDWAR_CHI.77.d: "China proposes: Comrades and Brothers. Our engineering troops build roads and anti-aircraft sites from the border to Hanoi. Hanoi accepts the help, and counts its debts."
 COLDWAR_CHI.77.a: "We accept."
 COLDWAR_CHI.77.b: "We decline."
 COLDWAR_CHI.78.t: "Albania Accepts"
 COLDWAR_CHI.78.d: "[From.GetNameDefCap] has accepted our proposal: A Beacon in Europe."
 COLDWAR_CHI.78.a: "Good."
 COLDWAR_CHI.79.t: "Albania Declines"
 COLDWAR_CHI.79.d: "[From.GetNameDefCap] has declined our proposal: A Beacon in Europe."
 COLDWAR_CHI.79.a: "So be it."
 COLDWAR_CHI.80.t: "A Beacon in Europe"
 COLDWAR_CHI.80.d: "China proposes: A Beacon in Europe. Tirana is the only European capital that stood with us. Our credits build its steelworks at Elbasan; Hoxha decides how long he wants them."
 COLDWAR_CHI.80.a: "We accept."
 COLDWAR_CHI.80.b: "We decline."
 COLDWAR_CHI.81.t: "Romania Accepts"
 COLDWAR_CHI.81.d: "[From.GetNameDefCap] has accepted our proposal: The Bucharest Channel."
 COLDWAR_CHI.81.a: "Good."
 COLDWAR_CHI.82.t: "Romania Declines"
 COLDWAR_CHI.82.d: "[From.GetNameDefCap] has declined our proposal: The Bucharest Channel."
 COLDWAR_CHI.82.a: "So be it."
 COLDWAR_CHI.83.t: "The Bucharest Channel"
 COLDWAR_CHI.83.d: "China proposes: The Bucharest Channel. Ceausescu keeps his distance from Moscow and his door open to us. Bucharest carries messages that cannot be sent directly."
 COLDWAR_CHI.83.a: "We accept."
 COLDWAR_CHI.83.b: "We decline."
 COLDWAR_CHI.84.t: "The United States Accepts"
 COLDWAR_CHI.84.d: "[From.GetNameDefCap] has accepted our proposal: The Shanghai Communique."
 COLDWAR_CHI.84.a: "Good."
 COLDWAR_CHI.85.t: "The United States Declines"
 COLDWAR_CHI.85.d: "[From.GetNameDefCap] has declined our proposal: The Shanghai Communique."
 COLDWAR_CHI.85.a: "So be it."
 COLDWAR_CHI.86.t: "The Shanghai Communique"
 COLDWAR_CHI.86.d: "China proposes: The Shanghai Communique. Kissinger came through Islamabad; now the President comes to Beijing. Both sides state their differences and agree to oppose hegemony, if Washington signs."
 COLDWAR_CHI.86.a: "We accept."
 COLDWAR_CHI.86.b: "We decline."
 COLDWAR_CHI.87.t: "Japan Accepts"
 COLDWAR_CHI.87.d: "[From.GetNameDefCap] has accepted our proposal: Normalise with Japan."
 COLDWAR_CHI.87.a: "Good."
 COLDWAR_CHI.88.t: "Japan Declines"
 COLDWAR_CHI.88.d: "[From.GetNameDefCap] has declined our proposal: Normalise with Japan."
 COLDWAR_CHI.88.a: "So be it."
 COLDWAR_CHI.89.t: "Normalise with Japan"
 COLDWAR_CHI.89.d: "China proposes: Normalise with Japan. Tanaka may come to Beijing and apologise for the war. Trade will follow the flag, and yen loans will follow trade."
 COLDWAR_CHI.89.a: "We accept."
 COLDWAR_CHI.89.b: "We decline."
 COLDWAR_CHI.90.t: "Japan Accepts"
 COLDWAR_CHI.90.d: "[From.GetNameDefCap] has accepted our proposal: Treaty of Peace and Friendship."
 COLDWAR_CHI.90.a: "Good."
 COLDWAR_CHI.91.t: "Japan Declines"
 COLDWAR_CHI.91.d: "[From.GetNameDefCap] has declined our proposal: Treaty of Peace and Friendship."
 COLDWAR_CHI.91.a: "So be it."
 COLDWAR_CHI.92.t: "Treaty of Peace and Friendship"
 COLDWAR_CHI.92.d: "China proposes: Treaty of Peace and Friendship. The 1978 treaty with its clause against hegemony. Tokyo's steel and plant makers sign contracts the same year."
 COLDWAR_CHI.92.a: "We accept."
 COLDWAR_CHI.92.b: "We decline."
 COLDWAR_CHI.93.t: "An Invitation to the Canton Fair"
 COLDWAR_CHI.93.d: "Guangzhou opens its halls to foreign buyers and invites our trade delegation. Contracts, samples and banquets await."
 COLDWAR_CHI.93.a: "Send a delegation."
 COLDWAR_CHI.93.b: "Decline."
 COLDWAR_CHI.94.t: "Albania Accepts"
 COLDWAR_CHI.94.d: "[From.GetNameDefCap] has accepted our proposal: Cosponsors from the Third World."
 COLDWAR_CHI.94.a: "Good."
 COLDWAR_CHI.95.t: "Albania Declines"
 COLDWAR_CHI.95.d: "[From.GetNameDefCap] has declined our proposal: Cosponsors from the Third World."
 COLDWAR_CHI.95.a: "So be it."
 COLDWAR_CHI.96.t: "Cosponsors from the Third World"
 COLDWAR_CHI.96.d: "China proposes: Cosponsors from the Third World. Albania, Algeria and Tanzania lead the list of cosponsors. Each name on it is a promise of votes from its neighbours."
 COLDWAR_CHI.96.a: "We accept."
 COLDWAR_CHI.96.b: "We decline."
 COLDWAR_CHI.97.t: "Algeria Accepts"
 COLDWAR_CHI.97.d: "[From.GetNameDefCap] has accepted our proposal: Cosponsors from the Third World."
 COLDWAR_CHI.97.a: "Good."
 COLDWAR_CHI.98.t: "Algeria Declines"
 COLDWAR_CHI.98.d: "[From.GetNameDefCap] has declined our proposal: Cosponsors from the Third World."
 COLDWAR_CHI.98.a: "So be it."
 COLDWAR_CHI.99.t: "Cosponsors from the Third World"
 COLDWAR_CHI.99.d: "China proposes: Cosponsors from the Third World. Albania, Algeria and Tanzania lead the list of cosponsors. Each name on it is a promise of votes from its neighbours."
 COLDWAR_CHI.99.a: "We accept."
 COLDWAR_CHI.99.b: "We decline."
 COLDWAR_CHI.100.t: "Tanzania Accepts"
 COLDWAR_CHI.100.d: "[From.GetNameDefCap] has accepted our proposal: Cosponsors from the Third World."
 COLDWAR_CHI.100.a: "Good."
 COLDWAR_CHI.101.t: "Tanzania Declines"
 COLDWAR_CHI.101.d: "[From.GetNameDefCap] has declined our proposal: Cosponsors from the Third World."
 COLDWAR_CHI.101.a: "So be it."
 COLDWAR_CHI.102.t: "Cosponsors from the Third World"
 COLDWAR_CHI.102.d: "China proposes: Cosponsors from the Third World. Albania, Algeria and Tanzania lead the list of cosponsors. Each name on it is a promise of votes from its neighbours."
 COLDWAR_CHI.102.a: "We accept."
 COLDWAR_CHI.102.b: "We decline."
 COLDWAR_CHI.103.t: "Albania Accepts"
 COLDWAR_CHI.103.d: "[From.GetNameDefCap] has accepted our proposal: Conference of the New Emerging Forces."
 COLDWAR_CHI.103.a: "Good."
 COLDWAR_CHI.104.t: "Albania Declines"
 COLDWAR_CHI.104.d: "[From.GetNameDefCap] has declined our proposal: Conference of the New Emerging Forces."
 COLDWAR_CHI.104.a: "So be it."
 COLDWAR_CHI.105.t: "Conference of the New Emerging Forces"
 COLDWAR_CHI.105.d: "China proposes: Conference of the New Emerging Forces. They rejected us, so we invite the rejected. Delegations from Tirana to Phnom Penh meet in a hall we built. Membership is free; leaving it is not."
 COLDWAR_CHI.105.a: "We accept."
 COLDWAR_CHI.105.b: "We decline."
 COLDWAR_CHI.106.t: "Tanzania Accepts"
 COLDWAR_CHI.106.d: "[From.GetNameDefCap] has accepted our proposal: Conference of the New Emerging Forces."
 COLDWAR_CHI.106.a: "Good."
 COLDWAR_CHI.107.t: "Tanzania Declines"
 COLDWAR_CHI.107.d: "[From.GetNameDefCap] has declined our proposal: Conference of the New Emerging Forces."
 COLDWAR_CHI.107.a: "So be it."
 COLDWAR_CHI.108.t: "Conference of the New Emerging Forces"
 COLDWAR_CHI.108.d: "China proposes: Conference of the New Emerging Forces. They rejected us, so we invite the rejected. Delegations from Tirana to Phnom Penh meet in a hall we built. Membership is free; leaving it is not."
 COLDWAR_CHI.108.a: "We accept."
 COLDWAR_CHI.108.b: "We decline."
 COLDWAR_CHI.109.t: "Pakistan Accepts"
 COLDWAR_CHI.109.d: "[From.GetNameDefCap] has accepted our proposal: Conference of the New Emerging Forces."
 COLDWAR_CHI.109.a: "Good."
 COLDWAR_CHI.110.t: "Pakistan Declines"
 COLDWAR_CHI.110.d: "[From.GetNameDefCap] has declined our proposal: Conference of the New Emerging Forces."
 COLDWAR_CHI.110.a: "So be it."
 COLDWAR_CHI.111.t: "Conference of the New Emerging Forces"
 COLDWAR_CHI.111.d: "China proposes: Conference of the New Emerging Forces. They rejected us, so we invite the rejected. Delegations from Tirana to Phnom Penh meet in a hall we built. Membership is free; leaving it is not."
 COLDWAR_CHI.111.a: "We accept."
 COLDWAR_CHI.111.b: "We decline."
 COLDWAR_CHI.112.t: "North Korea Accepts"
 COLDWAR_CHI.112.d: "[From.GetNameDefCap] has accepted our proposal: Conference of the New Emerging Forces."
 COLDWAR_CHI.112.a: "Good."
