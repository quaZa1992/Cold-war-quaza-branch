 COLDWAR_CHI_july_21_workers_college_programme: "July 21 Workers' College"
 COLDWAR_CHI_july_21_workers_college_programme_desc: "Veteran machinists will teach toolmaking and production methods on the shop floor. The factories must release their best hands for the first term."
 COLDWAR_CHI_train_barefoot_doctors_programme: "Brigade Medical Teams"
 COLDWAR_CHI_train_barefoot_doctors_programme_desc: "County hospitals will train brigade members to vaccinate children, dress wounds and visit villages beyond the reach of a clinic. The Ministry of Health will supply the first medical kits."
 COLDWAR_CHI_recall_design_engineers_programme: "Engineers at the Design Institutes"
 COLDWAR_CHI_recall_design_engineers_programme_desc: "The State Council will recall engineers from factory assignments to finish designs left on the drawing board. Revolutionary committee cadres have challenged the recall orders."
 COLDWAR_CHI_prioritise_coal_trains_programme: "Priority for Coal Freight"
 COLDWAR_CHI_prioritise_coal_trains_programme_desc: "Railway dispatchers will reserve wagon paths for coal bound for the industrial centres. Building sites must wait for deliveries of steel and cement."
