 COLDWAR_CHI.124.t: "Taiwan Accepts"
 COLDWAR_CHI.124.d: "[From.GetNameDefCap] has accepted our proposal: Nine Points for Taiwan."
 COLDWAR_CHI.124.a: "Good."
 COLDWAR_CHI.125.t: "Taiwan Declines"
 COLDWAR_CHI.125.d: "[From.GetNameDefCap] has declined our proposal: Nine Points for Taiwan."
 COLDWAR_CHI.125.a: "So be it."
 COLDWAR_CHI.126.t: "Nine Points for Taiwan"
 COLDWAR_CHI.126.d: "China proposes: Nine Points for Taiwan. Marshal Ye's nine points: Taiwan keeps its army, its economy and its way of life as a special region. Taipei may answer, or not."
 COLDWAR_CHI.126.a: "We accept."
 COLDWAR_CHI.126.b: "We decline."
 COLDWAR_CHI.127.t: "The United Kingdom Accepts"
 COLDWAR_CHI.127.d: "[From.GetNameDefCap] has accepted our proposal: The Joint Declaration."
 COLDWAR_CHI.127.a: "Good."
 COLDWAR_CHI.128.t: "The United Kingdom Declines"
 COLDWAR_CHI.128.d: "[From.GetNameDefCap] has declined our proposal: The Joint Declaration."
 COLDWAR_CHI.128.a: "So be it."
 COLDWAR_CHI.129.t: "The Joint Declaration"
 COLDWAR_CHI.129.d: "China proposes: The Joint Declaration. Fifty years unchanged after 1997: capitalism stays in Hong Kong, the flag changes. London signs, or it negotiates with a harder Beijing."
 COLDWAR_CHI.129.a: "We accept."
 COLDWAR_CHI.129.b: "We decline."
 COLDWAR_CHI.130.t: "Portugal Accepts"
 COLDWAR_CHI.130.d: "[From.GetNameDefCap] has accepted our proposal: The Macau Question."
 COLDWAR_CHI.130.a: "Good."
 COLDWAR_CHI.131.t: "Portugal Declines"
 COLDWAR_CHI.131.d: "[From.GetNameDefCap] has declined our proposal: The Macau Question."
 COLDWAR_CHI.131.a: "So be it."
 COLDWAR_CHI.132.t: "The Macau Question"
 COLDWAR_CHI.132.d: "China proposes: The Macau Question. Macau has been Portuguese by treaty since 1887, and Lisbon wonders how long it can hold a city it cannot defend. We offer three roads: hand it back, keep it in our name until the century ends, or refuse."
 COLDWAR_CHI.132.a: "Hand Macau over now."
 COLDWAR_CHI.132.b: "Chinese territory, Portuguese administration until 1999."
 COLDWAR_CHI.132.c: "Macau stays Portuguese."
 COLDWAR_CHI.133.t: "South Vietnam Accepts"
 COLDWAR_CHI.133.d: "[From.GetNameDefCap] has accepted our proposal: A Note on the Nansha Islands."
 COLDWAR_CHI.133.a: "Good."
 COLDWAR_CHI.134.t: "South Vietnam Declines"
 COLDWAR_CHI.134.d: "[From.GetNameDefCap] has declined our proposal: A Note on the Nansha Islands."
 COLDWAR_CHI.134.a: "So be it."
 COLDWAR_CHI.135.t: "A Note on the Nansha Islands"
 COLDWAR_CHI.135.d: "China proposes: A Note on the Nansha Islands. Every reef from the Paracels to James Shoal is Chinese territory. We send the note to Saigon and Manila, with trade for those who accept it."
 COLDWAR_CHI.135.a: "We accept."
 COLDWAR_CHI.135.b: "We decline."
 COLDWAR_CHI.136.t: "The Philippines Accepts"
 COLDWAR_CHI.136.d: "[From.GetNameDefCap] has accepted our proposal: A Note on the Nansha Islands."
 COLDWAR_CHI.136.a: "Good."
 COLDWAR_CHI.137.t: "The Philippines Declines"
 COLDWAR_CHI.137.d: "[From.GetNameDefCap] has declined our proposal: A Note on the Nansha Islands."
