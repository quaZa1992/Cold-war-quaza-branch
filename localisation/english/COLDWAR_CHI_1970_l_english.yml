 COLDWAR_CHI.138.t: "A Note on the Nansha Islands"
 COLDWAR_CHI.138.d: "China proposes: A Note on the Nansha Islands. Every reef from the Paracels to James Shoal is Chinese territory. We send the note to Saigon and Manila, with trade for those who accept it."
 COLDWAR_CHI.138.a: "We accept."
 COLDWAR_CHI.138.b: "We decline."
 COLDWAR_CHI.139.t: "Mongolia Accepts"
 COLDWAR_CHI.139.d: "[From.GetNameDefCap] has accepted our proposal: Soviet Divisions in Mongolia."
 COLDWAR_CHI.139.a: "Good."
 COLDWAR_CHI.140.t: "Mongolia Declines"
 COLDWAR_CHI.140.d: "[From.GetNameDefCap] has declined our proposal: Soviet Divisions in Mongolia."
 COLDWAR_CHI.140.a: "So be it."
 COLDWAR_CHI.141.t: "Soviet Divisions in Mongolia"
 COLDWAR_CHI.141.d: "China proposes: Soviet Divisions in Mongolia. Four Soviet divisions sit six hundred kilometres from Beijing. Ulaanbaatar can ask them to leave, and we will make it worth its while."
 COLDWAR_CHI.141.a: "We accept."
 COLDWAR_CHI.141.b: "We decline."
 COLDWAR_CHI.142.t: "The Soviet Union Accepts"
 COLDWAR_CHI.142.d: "[From.GetNameDefCap] has accepted our proposal: Remove the Three Obstacles."
 COLDWAR_CHI.142.a: "Good."
 COLDWAR_CHI.143.t: "The Soviet Union Declines"
 COLDWAR_CHI.143.d: "[From.GetNameDefCap] has declined our proposal: Remove the Three Obstacles."
 COLDWAR_CHI.143.a: "So be it."
 COLDWAR_CHI.144.t: "Remove the Three Obstacles"
 COLDWAR_CHI.144.d: "China proposes: Remove the Three Obstacles. Troops on the border and in Mongolia, the war in Afghanistan, Vietnam in Cambodia. Remove the three obstacles, and we can talk as neighbours again."
 COLDWAR_CHI.144.a: "We accept."
 COLDWAR_CHI.144.b: "We decline."
 COLDWAR_CHI.145.t: "The Soviet Union Accepts"
 COLDWAR_CHI.145.d: "[From.GetNameDefCap] has accepted our proposal: A Line on the Thalweg."
 COLDWAR_CHI.145.a: "Good."
 COLDWAR_CHI.146.t: "The Soviet Union Declines"
 COLDWAR_CHI.146.d: "[From.GetNameDefCap] has declined our proposal: A Line on the Thalweg."
 COLDWAR_CHI.146.a: "So be it."
 COLDWAR_CHI.147.t: "A Line on the Thalweg"
 COLDWAR_CHI.147.d: "China proposes: A Line on the Thalweg. International law puts a river border in the middle of the main channel. That gives us Zhenbao and six hundred other islands, and Moscow nothing to fight over."
 COLDWAR_CHI.147.a: "We accept."
 COLDWAR_CHI.147.b: "We decline."
 COLDWAR_CHI.148.t: "The United States Accepts"
 COLDWAR_CHI.148.d: "[From.GetNameDefCap] has accepted our proposal: The Enemy of My Enemy."
 COLDWAR_CHI.148.a: "Good."
 COLDWAR_CHI.149.t: "The United States Declines"
 COLDWAR_CHI.149.d: "[From.GetNameDefCap] has declined our proposal: The Enemy of My Enemy."
 COLDWAR_CHI.149.a: "So be it."
 COLDWAR_CHI.150.t: "The Enemy of My Enemy"
 COLDWAR_CHI.150.d: "China proposes: The Enemy of My Enemy. Washington and Tokyo want what we want: a Soviet Union pinned down on two fronts. They have technology and money; we have fifty divisions on the Amur."
 COLDWAR_CHI.150.a: "We accept."
 COLDWAR_CHI.150.b: "We decline."
 COLDWAR_CHI.151.t: "Japan Accepts"
 COLDWAR_CHI.151.d: "[From.GetNameDefCap] has accepted our proposal: The Enemy of My Enemy."
 COLDWAR_CHI.151.a: "Good."
