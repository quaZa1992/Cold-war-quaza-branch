 COLDWAR_CHI.154.t: "Vietnam Accepts"
 COLDWAR_CHI.154.d: "[From.GetNameDefCap] has accepted our proposal: Hanoi Leans on Moscow."
 COLDWAR_CHI.154.a: "Good."
 COLDWAR_CHI.155.t: "Vietnam Declines"
 COLDWAR_CHI.155.d: "[From.GetNameDefCap] has declined our proposal: Hanoi Leans on Moscow."
 COLDWAR_CHI.155.a: "So be it."
 COLDWAR_CHI.156.t: "Hanoi Leans on Moscow"
 COLDWAR_CHI.156.d: "China proposes: Hanoi Leans on Moscow. Hanoi signs with Moscow, expels the Hoa and turns its army on Cambodia. We ask once whether the lips still remember the teeth."
 COLDWAR_CHI.156.a: "We accept."
 COLDWAR_CHI.156.b: "We decline."
 COLDWAR_CHI.157.t: "An Agreement Ends"
 COLDWAR_CHI.157.d: "[From.GetNameDefCap] has ended its agreements with us."
 COLDWAR_CHI.157.a: "Noted."
 COLDWAR_CHI.158.t: "China Ends Its Agreements"
 COLDWAR_CHI.158.d: "Beijing has ended its agreements with us."
 COLDWAR_CHI.158.a: "Noted."
 COLDWAR_CHI.159.t: "Agreement Restored"
 COLDWAR_CHI.159.d: "An agreement with China is in force again."
 COLDWAR_CHI.159.a: "OK"
