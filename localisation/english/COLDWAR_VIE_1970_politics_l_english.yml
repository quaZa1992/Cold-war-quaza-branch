# IMPERIA CW — Cold War: VIE 1970 politics — English localisation.
 COLDWAR_VIE_1970_party_0:0 "£generic_Western_Autocracy_small (VNQDĐ) - Vietnamese Nationalist Party"
 COLDWAR_VIE_1970_party_0_desc:0 "(Anti-Communist Nationalism) - Vietnamese Nationalist Party (Vietnamese: Viet Nam Quoc Dan Đang, VNQDĐ)\n\nThe Vietnamese Nationalist Party was founded in 1927 on the model of the Chinese Kuomintang and led the Yen Bai uprising against the French in 1930. Crushed by the Viet Minh in 1946, it survives in the South and in exile as a fragmented anti-communist and republican tradition.\n\nA northern return would require a political rupture or negotiated repatriation. A collective Nationalist Return Committee would then govern Hanoi with American support, promising republican institutions, private property and an end to the communist one-party state."
 COLDWAR_VIE_1970_party_0_icon:0 "£generic_Western_Autocracy_small"
 COLDWAR_VIE_1970_party_2:0 "£generic_liberalism_small (DPV) - Democratic Party of Vietnam"
 COLDWAR_VIE_1970_party_2_desc:0 "(Patriotic Liberalism) - Democratic Party of Vietnam (Vietnamese: Đang Dan chu Viet Nam, DPV)\n\nThe Democratic Party of Vietnam was founded in 1944 by patriotic intellectuals, merchants and civil servants. Led by its general secretary Nghiem Xuan Yem, it has been allied with the Workers' Party within the Fatherland Front since the August Revolution.\n\nThe party represents the national bourgeoisie and the educated middle class. Given its own mandate, it could press for independent constitutional government, legal protection for private trade and liberal political competition within a reunified Vietnam."
 COLDWAR_VIE_1970_party_2_icon:0 "£generic_liberalism_small"
 COLDWAR_VIE_1970_party_3:0 "£generic_socialism_small Socialist Party of Vietnam"
 COLDWAR_VIE_1970_party_3_desc:0 "(Democratic Socialism) - Socialist Party of Vietnam (Vietnamese: Đang Xa hoi Viet Nam)\n\nThe Socialist Party of Vietnam was founded in 1946 to win over the intelligentsia for the national revolution. Led by the physician and educator Nguyen Xien, with Hoang Minh Giam as a senior colleague, it participates in the communist-led Fatherland Front.\n\nWithin the Front it speaks for teachers, doctors, scientists and engineers. An independent mandate would allow it to pursue a parliamentary and pluralist socialism, combining social welfare with intellectual freedom and genuine elections to the National Assembly."
 COLDWAR_VIE_1970_party_3_icon:0 "£generic_socialism_small"
 COLDWAR_VIE_1970_party_4:0 "£generic_Communist_State_small [COLDWAR_VIE_1970_communist_party_name]"
 COLDWAR_VIE_1970_party_4_1970_name:0 "(VWP) - Vietnam Workers' Party"
 COLDWAR_VIE_1970_party_4_1976_name:0 "(CPV) - Communist Party of Vietnam"
 COLDWAR_VIE_1970_party_4_desc:0 "(Marxism-Leninism) - Vietnam Workers' Party (Vietnamese: Đang Lao đong Viet Nam, VWP)\n\nThe Vietnam Workers' Party is the revolutionary ruling party, heir to Ho Chi Minh's Indochinese Communist Party. After Ho's death in September 1969, Le Duan leads as First Secretary, Ton Duc Thang serves as President and Pham Van Dong as Prime Minister.\n\nSocialist construction, wartime mobilisation and the reunification of the South compete for scarce resources while American bombs fall. The party balances Soviet and Chinese aid and prepares for final victory, with Truong Chinh, Nguyen Van Linh and Vo Van Kiet as future leaders."
 COLDWAR_VIE_1970_party_4_icon:0 "£generic_Communist_State_small"
 COLDWAR_VIE_1970_party_19:0 "£generic_Neutral_Communism_small Vietnamese Fatherland Front"
 COLDWAR_VIE_1970_party_19_desc:0 "(National Front Socialism) - Vietnamese Fatherland Front (Vietnamese: Mat tran To quoc Viet Nam)\n\nThe Vietnamese Fatherland Front, founded in 1955, is the communist-led umbrella organisation that unites political parties, mass organisations, ethnic minorities and Buddhist and Catholic participants behind the national struggle.\n\nAn autonomous Front Presidium governing through an independent socialist compact would give the smaller parties and religious groups a real share of power. It would pursue national unity and socialism while keeping Hanoi equidistant between Moscow and Beijing. Its long-serving chairman, Ton Duc Thang, is also President of the Republic."
 COLDWAR_VIE_1970_party_19_icon:0 "£generic_Neutral_Communism_small"
 COLDWAR_VIE_1970_party_22:0 "£generic_Nat_Autocracy_small Provisional Military Council"
 COLDWAR_VIE_1970_party_22_desc:0 "(Military Junta) - Provisional Military Council (Vietnamese: Hoi đong Quan su Lam thoi)\n\nThe People's Army of Vietnam, victor of Dien Bien Phu, has always been subordinate to the revolutionary party. A Provisional Military Council could arise only from a profound crisis of the party leadership, such as a disastrous defeat or a collapse after the war.\n\nThe council would choose between permanent emergency authority and a transition to civilian rule. Civilian nationalists, including figures from the old Dai Viet tradition, could advise it in building a disciplined, nationalist state."
 COLDWAR_VIE_1970_party_22_icon:0 "£generic_Nat_Autocracy_small"
