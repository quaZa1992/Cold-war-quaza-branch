l_english:
# IMPERIA COLD WAR — Sami: Sweden 1970 and Nordic cooperation.
 # IMPERIA CW — Cold War: concise historical reports and native option effects.
 COLDWAR_SWE_history_category:0 "Swedish Historical Policy Reports"
 COLDWAR_SWE_history_category_desc:0 "The Cabinet Secretariat keeps one current report on the desk. Its advisers offer a choice of programmes; the government can fund one, return to it later, or file it without action."
 COLDWAR_SWE_history_research_bonus:0 "Swedish Applied Research"
 COLDWAR_SWE_history_open:0 "Review: [COLDWAR_SWE_HistoryPendingTitle]"
 COLDWAR_SWE_history_open_desc:0 "The report sets out two programmes with their quoted prices. The Secretariat will hold it until the government is ready to decide."
 COLDWAR_SWE_history_review_affordable:0 "Treasury can cover the quoted programme cost."
 COLDWAR_SWE_history_close:0 "Close this report"
 COLDWAR_SWE_history_defer:0 "File the report without a new programme"
 COLDWAR_SWE_history_stale:0 "This report is no longer awaiting a decision."
 COLDWAR_SWE_history_later:0 "Decide later"
 COLDWAR_SWE_history_accounts_ready:0 "A current GDP estimate is available."
 COLDWAR_SWE_history_archive:0 "File the current report without funding"
 COLDWAR_SWE_history_archive_desc:0 "The Secretariat will file both proposals without a new appropriation."
 COLDWAR_SWE_history_mine_settlement_title:0 "After the Mine Strike"
 COLDWAR_SWE_history_mine_settlement_desc:0 "The winter strike at LKAB has brought the lives of Kiruna and Malmberget miners into the national argument. Underground work, pay and the distance between union leaders and the men on shift all need an answer. A negotiated settlement can restore working relations; safer equipment and better training offer a different place to begin.\n\nProgramme A: USD [?COLDWAR_SWE_history_mine_settlement_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_mine_settlement_b_cost_million|2] million"
 COLDWAR_SWE_history_mine_settlement_a:0 "A. Support a negotiated workplace settlement (Historical approach)"
 COLDWAR_SWE_history_mine_settlement_b:0 "B. Pay for an industrial safety and equipment study"
 COLDWAR_SWE_history_mine_settlement_b_research:0 "After the Mine Strike"
 COLDWAR_SWE_history_elm_title:0 "The Elms of Kungsträdgården"
 COLDWAR_SWE_history_elm_desc:0 "Kungsträdgården is a public park in central Stockholm, where a row of old elm trees stands in the way of a planned underground-station entrance. Protesters have gathered to stop the trees being cut down. City planners still need to move passengers through the area, but preserving a meeting place now matters as much as drawing a straight line on the plan.\n\nProgramme A: USD [?COLDWAR_SWE_history_elm_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_elm_b_cost_million|2] million"
 COLDWAR_SWE_history_elm_a:0 "A. Preserve the elms and negotiate a new plan (Historical approach)"
 COLDWAR_SWE_history_elm_b:0 "B. Commission alternative transport designs"
 COLDWAR_SWE_history_elm_b_research:0 "The Elms of Kungsträdgården"
 COLDWAR_SWE_history_flight_safety_title:0 "Aircraft Safety Review"
 COLDWAR_SWE_history_flight_safety_desc:0 "Viggen brings Sweden into a new generation of fast combat aircraft. Its early service has also brought accidents, difficult engineering questions and hard work for rescue crews. Air officers want the next effort directed either towards testing the design or preparing the people who must respond when a flight goes wrong.\n\nProgramme A: USD [?COLDWAR_SWE_history_flight_safety_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_flight_safety_b_cost_million|2] million"
 COLDWAR_SWE_history_flight_safety_a:0 "A. Fund engineering tests (Historically inspired)"
 COLDWAR_SWE_history_flight_safety_a_research:0 "Aircraft Safety Review"
 COLDWAR_SWE_history_flight_safety_b:0 "B. Fund rescue drills and base training"
 COLDWAR_SWE_history_stockholm_environment_title:0 "Stockholm and the Human Environment"
 COLDWAR_SWE_history_stockholm_environment_desc:0 "Delegates meeting in Stockholm are asking how economic growth can continue without poisoning the air, water and land on which it depends. The United Nations conference has put Sweden at the centre of that discussion. Swedish factories and local planners now want practical support to turn speeches about the human environment into changes people can see.\n\nProgramme A: USD [?COLDWAR_SWE_history_stockholm_environment_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_stockholm_environment_b_cost_million|2] million"
 COLDWAR_SWE_history_stockholm_environment_a:0 "A. Support cleaner industrial development (Historical approach)"
 COLDWAR_SWE_history_stockholm_environment_a_research:0 "Stockholm and the Human Environment"
 COLDWAR_SWE_history_stockholm_environment_b:0 "B. Fund environmental planning staff"
 COLDWAR_SWE_history_intelligence_review_title:0 "Secrecy and Public Trust"
 COLDWAR_SWE_history_intelligence_review_desc:0 "Journalists have exposed IB, a secret intelligence organisation linked to the armed forces, and its records of Swedish left-wing activists. Ministers favour scrutiny by the government and Parliament; critics want an independent inquiry. Technical work can continue, but a closed hearing will not satisfy everyone asking who watches the watchers.\n\nProgramme A: USD [?COLDWAR_SWE_history_intelligence_review_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_intelligence_review_b_cost_million|2] million"
 COLDWAR_SWE_history_intelligence_review_a:0 "A. Keep technical work under parliamentary scrutiny (Historical approach)"
 COLDWAR_SWE_history_intelligence_review_a_research:0 "Secrecy and Public Trust"
 COLDWAR_SWE_history_intelligence_review_b:0 "B. Finance an independent inquiry"
 COLDWAR_SWE_history_bank_security_title:0 "Hostage Emergency Preparedness"
 COLDWAR_SWE_history_bank_security_desc:0 "The Norrmalmstorg bank siege has shown how a city-centre crime can become a national emergency. Hostages, police negotiators, rescue workers and medical staff all depend on decisions made with incomplete information. Police planners now propose joint training or stronger emergency communications before another long night begins.\n\nProgramme A: USD [?COLDWAR_SWE_history_bank_security_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_bank_security_b_cost_million|2] million"
 COLDWAR_SWE_history_bank_security_a:0 "A. Train joint hostage-response teams (Historically inspired)"
 COLDWAR_SWE_history_bank_security_b:0 "B. Improve emergency communications research"
 COLDWAR_SWE_history_bank_security_b_research:0 "Hostage Emergency Preparedness"
 COLDWAR_SWE_history_fuel_security_title:0 "An Economy Exposed to Imported Oil"
 COLDWAR_SWE_history_fuel_security_desc:0 "Factories, road transport and many Swedish homes depend on oil arriving from abroad. A shortage can reach the workshop and the kitchen long before diplomacy has produced an answer. The energy authorities propose stronger reserves and conservation, while industry asks for help developing methods that need less fuel.\n\nProgramme A: USD [?COLDWAR_SWE_history_fuel_security_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_fuel_security_b_cost_million|2] million"
 COLDWAR_SWE_history_fuel_security_a:0 "A. Support conservation and fuel preparedness (Historical approach)"
 COLDWAR_SWE_history_fuel_security_b:0 "B. Support industrial energy research"
 COLDWAR_SWE_history_fuel_security_b_research:0 "An Economy Exposed to Imported Oil"
 COLDWAR_SWE_history_family_services_title:0 "Making Family Policy Work"
 COLDWAR_SWE_history_family_services_desc:0 "A job and a family should not require two incompatible timetables. Working parents need services they can reach, while employers need reliable staffing and councils must find trained people to provide care. Local officials propose closer coordination; an independent review could instead expose the places where families are still being left outside.\n\nProgramme A: USD [?COLDWAR_SWE_history_family_services_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_family_services_b_cost_million|2] million"
 COLDWAR_SWE_history_family_services_a:0 "A. Improve access for working parents (Historically inspired)"
 COLDWAR_SWE_history_family_services_b:0 "B. Fund a public review of service access"
 COLDWAR_SWE_history_industrial_robots_title:0 "A Robot on the Factory Floor"
 COLDWAR_SWE_history_industrial_robots_desc:0 "ASEA’s IRB 6 puts an electrically driven industrial robot within reach of Swedish workshops. It promises steady, accurate work, but buying a machine is only the start: the factory floor must change and workers need new skills. Firms want help with retooling now or with developing the next generation of equipment.\n\nProgramme A: USD [?COLDWAR_SWE_history_industrial_robots_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_industrial_robots_b_cost_million|2] million"
 COLDWAR_SWE_history_industrial_robots_a:0 "A. Support company-led retooling (Historical approach)"
 COLDWAR_SWE_history_industrial_robots_b:0 "B. Fund industrial robot research"
 COLDWAR_SWE_history_industrial_robots_b_research:0 "A Robot on the Factory Floor"
 COLDWAR_SWE_history_diplomatic_security_title:0 "Diplomatic Security Preparedness"
 COLDWAR_SWE_history_diplomatic_security_desc:0 "The attack on the West German embassy in Stockholm has exposed how quickly an overseas conflict can become a Swedish rescue emergency. Police, diplomats, medical staff and military specialists need to understand one another before a crisis begins. Security officials propose joint exercises or better protected communications.\n\nProgramme A: USD [?COLDWAR_SWE_history_diplomatic_security_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_diplomatic_security_b_cost_million|2] million"
 COLDWAR_SWE_history_diplomatic_security_a:0 "A. Improve diplomatic rescue coordination (Historically inspired)"
 COLDWAR_SWE_history_diplomatic_security_b:0 "B. Fund secure communications development"
 COLDWAR_SWE_history_diplomatic_security_b_research:0 "Diplomatic Security Preparedness"
 COLDWAR_SWE_history_axe_switch_title:0 "The AXE Switching System"
 COLDWAR_SWE_history_axe_switch_desc:0 "Ericsson and Televerket’s work on electronic telephone switching offers clearer calls, easier expansion and a new export opportunity. Installing the equipment demands skilled crews as well as new machines. The next effort can prepare people to build and maintain the network or support the engineers designing what comes after it.\n\nProgramme A: USD [?COLDWAR_SWE_history_axe_switch_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_axe_switch_b_cost_million|2] million"
 COLDWAR_SWE_history_axe_switch_a:0 "A. Support electronic switching installation and training (Historical approach)"
 COLDWAR_SWE_history_axe_switch_b:0 "B. Fund the next switching design"
 COLDWAR_SWE_history_axe_switch_b_research:0 "The AXE Switching System"
 COLDWAR_SWE_history_workplace_agreements_title:0 "Workplace Agreements in Practice"
 COLDWAR_SWE_history_workplace_agreements_desc:0 "Workers want to hear about changes before the new machinery arrives or the redundancy notices are printed. Employers need a way to negotiate without turning every production decision into a national dispute. Training workplace representatives can make agreements work in practice; better production planning offers another route to fewer surprises.\n\nProgramme A: USD [?COLDWAR_SWE_history_workplace_agreements_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_workplace_agreements_b_cost_million|2] million"
 COLDWAR_SWE_history_workplace_agreements_a:0 "A. Support workplace negotiation training (Historical approach)"
 COLDWAR_SWE_history_workplace_agreements_b:0 "B. Fund production planning research"
 COLDWAR_SWE_history_workplace_agreements_b_research:0 "Workplace Agreements in Practice"
 COLDWAR_SWE_history_shipyard_adjustment_title:0 "A Future for Shipyard Skills"
 COLDWAR_SWE_history_shipyard_adjustment_desc:0 "The shipyards of Göteborg and Malmö carry skills, suppliers and whole neighbourhoods on their order books. Falling demand for large merchant ships has made those books painfully thin. The government can help people and machinery move into new work or support better shipbuilding methods, but neither course can conjure customers out of an empty sea.\n\nProgramme A: USD [?COLDWAR_SWE_history_shipyard_adjustment_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_shipyard_adjustment_b_cost_million|2] million"
 COLDWAR_SWE_history_shipyard_adjustment_a:0 "A. Support managed shipyard restructuring (Historical approach)"
 COLDWAR_SWE_history_shipyard_adjustment_b:0 "B. Commission better shipbuilding methods"
 COLDWAR_SWE_history_shipyard_adjustment_b_research:0 "A Future for Shipyard Skills"
 COLDWAR_SWE_history_urban_services_title:0 "Services for New Housing Areas"
 COLDWAR_SWE_history_urban_services_desc:0 "The Million Programme has changed the skyline and given many families a modern home. A flat is less useful when the school, shops and a dependable journey to work are still missing. Local councils propose better coordination of public services or more careful planning of transport and access.\n\nProgramme A: USD [?COLDWAR_SWE_history_urban_services_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_urban_services_b_cost_million|2] million"
 COLDWAR_SWE_history_urban_services_a:0 "A. Improve services in new housing areas (Historical approach)"
 COLDWAR_SWE_history_urban_services_b:0 "B. Commission transport and access studies"
 COLDWAR_SWE_history_urban_services_b_research:0 "Services for New Housing Areas"
 COLDWAR_SWE_history_second_energy_review_title:0 "Prepare for Another Energy Disruption"
 COLDWAR_SWE_history_second_energy_review_desc:0 "Another period of uncertainty in the oil market has reached Swedish purchasing offices. Conservation and stored fuel can soften an immediate shortage; more efficient machinery offers a slower answer with a longer life. Energy officials want a clear priority before expensive orders are placed.\n\nProgramme A: USD [?COLDWAR_SWE_history_second_energy_review_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_second_energy_review_b_cost_million|2] million"
 COLDWAR_SWE_history_second_energy_review_a:0 "A. Continue conservation and preparedness (Historical approach)"
 COLDWAR_SWE_history_second_energy_review_b:0 "B. Fund industrial energy efficiency"
 COLDWAR_SWE_history_second_energy_review_b_research:0 "Prepare for Another Energy Disruption"
 COLDWAR_SWE_history_wage_dispute_title:0 "National Wage Negotiations"
 COLDWAR_SWE_history_wage_dispute_desc:0 "The pay round has become a test of how much strain Sweden’s organised labour market can bear. Employers warn about costs, unions point to household bills, and a breakdown would idle far more than the disputed workplaces. Ministers can support a negotiating framework or put the next effort into training and industrial conversion.\n\nProgramme A: USD [?COLDWAR_SWE_history_wage_dispute_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_wage_dispute_b_cost_million|2] million"
 COLDWAR_SWE_history_wage_dispute_a:0 "A. Support a negotiated industrial peace (Historical approach)"
 COLDWAR_SWE_history_wage_dispute_b:0 "B. Fund retraining and retooling"
 COLDWAR_SWE_history_nmt_title:0 "A Mobile Nordic Standard"
 COLDWAR_SWE_history_nmt_desc:0 "A telephone in a moving car is becoming useful equipment rather than a curiosity for the well connected. Nordic telephone administrations see the advantage of compatible networks, while Swedish firms see a market for the equipment. Communications research can prepare that common technical language; emergency services have more immediate training needs.\n\nProgramme A: USD [?COLDWAR_SWE_history_nmt_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_nmt_b_cost_million|2] million"
 COLDWAR_SWE_history_nmt_a:0 "A. Support compatible mobile communications (Historical approach)"
 COLDWAR_SWE_history_nmt_a_research:0 "A Mobile Nordic Standard"
 COLDWAR_SWE_history_nmt_b:0 "B. Support mobile emergency-service training"
 COLDWAR_SWE_history_coastal_incidents_title:0 "Coastal Surveillance and Readiness"
 COLDWAR_SWE_history_coastal_incidents_desc:0 "A submarine close to the Swedish coast can turn an uncertain sonar contact into a diplomatic crisis. Naval crews need to identify what they have found, report it clearly and avoid making a dangerous guess. Officers propose stronger identification exercises or better detection and communications equipment.\n\nProgramme A: USD [?COLDWAR_SWE_history_coastal_incidents_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_coastal_incidents_b_cost_million|2] million"
 COLDWAR_SWE_history_coastal_incidents_a:0 "A. Improve coastal identification and readiness (Historically inspired)"
 COLDWAR_SWE_history_coastal_incidents_b:0 "B. Fund detection and communications studies"
 COLDWAR_SWE_history_coastal_incidents_b_research:0 "Coastal Surveillance and Readiness"
 COLDWAR_SWE_history_aircraft_programmes_title:0 "The Cost of a National Aircraft Programme"
 COLDWAR_SWE_history_aircraft_programmes_desc:0 "Developing a combat aircraft at home keeps demanding work in Swedish hands, along with the bill when a drawing has to be changed. Saab’s engineers and the air force now need a priority for the next stage. More design work can improve the aircraft; operational training prepares the people who will find out whether it works away from the drawing board.\n\nProgramme A: USD [?COLDWAR_SWE_history_aircraft_programmes_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_aircraft_programmes_b_cost_million|2] million"
 COLDWAR_SWE_history_aircraft_programmes_a:0 "A. Continue domestic combat-aircraft development (Historical approach)"
 COLDWAR_SWE_history_aircraft_programmes_a_research:0 "The Cost of a National Aircraft Programme"
 COLDWAR_SWE_history_aircraft_programmes_b:0 "B. Fund test and operational training"
 COLDWAR_SWE_history_credit_review_title:0 "Credit Freedom and Financial Risk"
 COLDWAR_SWE_history_credit_review_desc:0 "Banks and industrial firms want more room to lend, borrow and expand. Easier credit can bring new machinery and orders forward, but a loan remains a claim on tomorrow’s income rather than proof that tomorrow will be profitable. The Treasury must choose between supporting industrial expansion and maintaining a more cautious lending climate.\n\nProgramme A: USD [?COLDWAR_SWE_history_credit_review_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_credit_review_b_cost_million|2] million"
 COLDWAR_SWE_history_credit_review_a:0 "A. Support expansion-led industrial investment (Historical approach)"
 COLDWAR_SWE_history_credit_review_b:0 "B. Strengthen credit supervision"
 COLDWAR_SWE_history_radiation_readiness_title:0 "Food and Radiation Preparedness"
 COLDWAR_SWE_history_radiation_readiness_desc:0 "Radioactive material does not stop at a frontier, and neither does public anxiety about food. Swedish laboratories need dependable tests and advice that farmers, reindeer herders and households can actually use. Health officials propose food monitoring, while civil-protection staff argue for wider exercises before an emergency overwhelms the telephone lines.\n\nProgramme A: USD [?COLDWAR_SWE_history_radiation_readiness_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_radiation_readiness_b_cost_million|2] million"
 COLDWAR_SWE_history_radiation_readiness_a:0 "A. Prepare food testing and public advice (Historical approach)"
 COLDWAR_SWE_history_radiation_readiness_b:0 "B. Fund wider civil-protection exercises"
 COLDWAR_SWE_history_export_review_title:0 "Confidence in Arms Export Controls"
 COLDWAR_SWE_history_export_review_desc:0 "An arms order can support skilled work in Sweden and still leave ministers answering uncomfortable questions about its destination. Export-control officials want records that can withstand scrutiny, and the public wants to know whether the rules mean what they say. Official inquiries and better technical record keeping offer different ways to rebuild confidence.\n\nProgramme A: USD [?COLDWAR_SWE_history_export_review_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_export_review_b_cost_million|2] million"
 COLDWAR_SWE_history_export_review_a:0 "A. Support official arms-export inquiries (Historical approach)"
 COLDWAR_SWE_history_export_review_b:0 "B. Fund technical evaluation and record keeping"
 COLDWAR_SWE_history_export_review_b_research:0 "Confidence in Arms Export Controls"
 COLDWAR_SWE_history_prototype_trials_title:0 "From Prototype to Service"
 COLDWAR_SWE_history_prototype_trials_desc:0 "A prototype in the air is a milestone, not yet an aircraft that a squadron can rely on every morning. Engineers still need test flights and time to work through faults; crews and mechanics need to learn the machine. The programme can now favour the next flight-test series or the people who must eventually put the design into service.\n\nProgramme A: USD [?COLDWAR_SWE_history_prototype_trials_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_prototype_trials_b_cost_million|2] million"
 COLDWAR_SWE_history_prototype_trials_a:0 "A. Continue the flight-test programme (Historical approach)"
 COLDWAR_SWE_history_prototype_trials_a_research:0 "From Prototype to Service"
 COLDWAR_SWE_history_prototype_trials_b:0 "B. Fund crew and maintenance training"
 COLDWAR_SWE_history_european_standards_title:0 "Preparing Industry for a Wider European Market"
 COLDWAR_SWE_history_european_standards_desc:0 "A product that meets Swedish requirements may still face a costly second set of tests across the border. The prospect of a wider European market makes common standards and reliable certification important to exporters. Industry asks for help adapting its products; officials want a careful examination of the rules Sweden would be asked to accept.\n\nProgramme A: USD [?COLDWAR_SWE_history_european_standards_a_cost_million|2] million\nProgramme B: USD [?COLDWAR_SWE_history_european_standards_b_cost_million|2] million"
 COLDWAR_SWE_history_european_standards_a:0 "A. Prepare industry for common European standards (Historical approach)"
 COLDWAR_SWE_history_european_standards_b:0 "B. Fund a public review of market rules"
 COLDWAR_SWE_history_labour_settlement:0 "A Negotiated Industrial Peace"
 COLDWAR_SWE_history_labour_settlement_desc:0 "Employers and workers have a funded route back to stable production. Keeping the agreement together leaves the government less room to pursue other political priorities."
 COLDWAR_SWE_history_public_inquiry:0 "An Open Public Inquiry"
 COLDWAR_SWE_history_public_inquiry_desc:0 "An independent review can rebuild trust and support for government work. Investigators, records and hearings place an extra burden on the civil service."
 COLDWAR_SWE_history_local_compromise:0 "A Local Planning Agreement"
 COLDWAR_SWE_history_local_compromise_desc:0 "Early agreement on access, services and land use helps industrial projects move forward. More consultation and planning staff raise administration costs."
 COLDWAR_SWE_history_energy_preparedness:0 "Fuel Reserves and Conservation"
 COLDWAR_SWE_history_energy_preparedness_desc:0 "Fuel reserves and conservation make supply disruptions easier to manage. Restrictions on industrial fuel use also hold back military factory output."
 COLDWAR_SWE_history_industrial_transition:0 "Industrial Retooling"
 COLDWAR_SWE_history_industrial_transition_desc:0 "New machinery and training improve civilian production. Firms need more workers while they learn new processes and replace old equipment."
 COLDWAR_SWE_history_civil_protection:0 "Prepared Public Services"
 COLDWAR_SWE_history_civil_protection_desc:0 "Police, rescue workers and military staff practise how to mobilise and keep units supplied with rested personnel. Keeping those arrangements ready raises police and security costs."
 COLDWAR_SWE_history_credit_safeguards:0 "Prudent Credit Supervision"
 COLDWAR_SWE_history_credit_safeguards_desc:0 "Closer scrutiny of lending supports financial confidence. More cautious credit decisions slow the construction of new civilian factories."
 COLDWAR_SWE_history_food_monitoring:0 "Food and Radiation Checks"
 COLDWAR_SWE_history_food_monitoring_desc:0 "Laboratory testing develops scientific skills and helps households trust the food supply during a radiation emergency. Monitoring raises health-service costs."
 COLDWAR_SWE_history_elm_preservation:0 "The Elms of Kungsträdgården"
 COLDWAR_SWE_history_elm_preservation_desc:0 "The elms remain in Stockholm’s central park, and the city has a negotiated way forward for access and public space. Preserving a familiar meeting place has helped residents and planners work together again. The settlement supports local development while the revised plans take shape."
