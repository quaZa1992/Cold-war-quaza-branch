l_english:
 ENG_royal_family: "The Royal Family"
 ENG_royal_family_desc: "The House of Windsor is not a government, but it is a national institution. Careful royal patronage can steady public life, strengthen Commonwealth ties and soften political shocks. Too much tabloid pressure, however, can turn ceremony into another crisis.\n\nCurrent §YFamily Stability§!: [?ENG_royal_family_stability_score|0]\nCurrent §YPublic Appeal§!: [?ENG_royal_family_public_appeal|0]\nCurrent §YPress Pressure§!: [?ENG_royal_family_press_pressure|0]\nCurrent §YCommonwealth Reach§!: [?ENG_royal_family_commonwealth_reach|0]\n\nMost royal engagements can backfire through §YNegative Press§!, §YPalace Cost Rows§!, §YMarriage Strain§! or §YPersonal Scandals§!. Click a portrait to show timed decisions for that royal."

 ENG_setup_royal_family_mechanic_tt: "Unlocks the §YRoyal Family§! decision interface."
 ENG_royal_family_modify_stability_tt: "Family Stability: [?ENG_royal_family_stability_change|=+0]"
 ENG_royal_family_modify_public_appeal_tt: "Public Appeal: [?ENG_royal_family_public_change|=+0]"
 ENG_royal_family_modify_press_pressure_tt: "Press Pressure: [?ENG_royal_family_press_change|=+0]"
 ENG_royal_family_modify_commonwealth_reach_tt: "Commonwealth Reach: [?ENG_royal_family_commonwealth_change|=+0]"
 ENG_royal_family_negative_press_tt: "A §Rnegative press cycle§! reduces §YFamily Stability§!, §YPublic Appeal§! and §YRuling Party Popularity§! for a short time."
 ENG_royal_family_palace_cost_row_tt: "A §Rpalace cost row§! raises short-term §YConsumer Goods§! pressure and weakens public appeal."
 ENG_royal_family_wales_marriage_strain_tt: "Tension around Charles and Diana becomes public, damaging §YStability§!, §YPublic Appeal§! and §YRuling Party Popularity§!."
 ENG_royal_family_andrew_scandal_tt: "A §Rpersonal controversy§! around Andrew damages §YPublic Appeal§!, §YCommonwealth prestige§! and §YRuling Party Popularity§!."

 ENG_royal_family_stability_dynamic_modifier: "Family Stability"
 ENG_royal_family_stability_dynamic_modifier_desc: "The public standing of the Royal Family remains a quiet part of Britain's constitutional order."
 ENG_royal_family_stability_dynamic_modifier_tt: "The Windsor household applies its active effects through one shared modifier. Family Stability, Public Appeal, Press Pressure and Commonwealth Reach shape §YStability§!, §YPolitical Power Gain§!, §YConsumer Goods§!, §YTrade Opinion§!, §YForeign Influence Defense§! and §YGlobalism§!. Timed royal engagements can also affect §YProductivity Growth§!, §YMigration Pull§!, §YPopulation Growth§!, §YWelfare Costs§!, §YHealth Costs§!, §YCommand Power§! and §YMilitary Experience§!."

 ENG_royal_elizabeth_portrait_tooltip: "§YQueen Elizabeth II§!\nClick to show decisions for the Queen."
 ENG_royal_philip_portrait_tooltip: "§YPrince Philip§!\nClick to show decisions for the Duke of Edinburgh."
 ENG_royal_charles_portrait_tooltip: "§YPrince Charles§!\nClick to show decisions for the Prince of Wales."
 ENG_royal_diana_portrait_tooltip: "§YPrincess Diana§!\nClick to show decisions for the Princess of Wales."
 ENG_royal_anne_portrait_tooltip: "§YPrincess Anne§!\nClick to show decisions for the Princess Royal."
 ENG_royal_andrew_portrait_tooltip: "§YPrince Andrew§!\nClick to show decisions for the Duke of York."
 ENG_royal_edward_portrait_tooltip: "§YPrince Edward§!\nClick to show decisions for Prince Edward."
 ENG_royal_margaret_portrait_tooltip: "§YPrincess Margaret§!\nClick to show decisions for Princess Margaret."

 ENG_royal_elizabeth_desc: "Elizabeth II is the central constitutional symbol of the realm. In 1985 her steadiness is a political asset, provided the Crown stays above daily party conflict."
 ENG_royal_philip_desc: "Prince Philip's public service, naval background and youth awards are useful assets, although his plain speaking can require palace management."
 ENG_royal_charles_desc: "The Prince of Wales is increasingly visible through youth work, heritage arguments and early environmental advocacy."
 ENG_royal_diana_desc: "Princess Diana commands extraordinary public sympathy. Her charitable work can humanise the state, but the press follows every movement."
 ENG_royal_anne_desc: "Princess Anne is one of the hardest working members of the family, especially through Commonwealth and charitable engagements."
 ENG_royal_andrew_desc: "Prince Andrew's Falklands service gives him a military public profile that can be used carefully in naval and trade circles."
 ENG_royal_edward_desc: "Prince Edward is still young in 1985, but arts and youth patronage can give him a useful public role."
 ENG_royal_margaret_desc: "Princess Margaret remains associated with glamour, arts circles and the difficult balance between celebrity and royal discipline."

 ENG_royal_family_keep_the_queen_above_politics: "Keep the Queen Above Politics"
 ENG_royal_family_keep_the_queen_above_politics_desc: "The Queen should be visible enough to steady the country, but distant enough to avoid being pulled into party conflict. A leaked political briefing can still create negative press."
 ENG_royal_family_commonwealth_tour_elizabeth: "Plan a Commonwealth Tour"
 ENG_royal_family_commonwealth_tour_elizabeth_desc: "A carefully staged tour can reinforce Britain's ceremonial influence across the Commonwealth. Bad optics around travel costs or protocol can turn the trip into a press argument."
 ENG_royal_family_new_year_address: "Prepare the New Year Address"
 ENG_royal_family_new_year_address_desc: "The annual address can offer continuity after a difficult political year. It can only be prepared in November or December, and a misjudged tone can still backfire."

 ENG_royal_family_duke_of_edinburgh_award: "Expand the Duke of Edinburgh Award"
 ENG_royal_family_duke_of_edinburgh_award_desc: "Youth awards are one of the safer and more useful forms of royal patronage, with useful links to discipline, service and outdoor training. A badly handled public remark can blunt the benefit."
 ENG_royal_family_military_patronage_philip: "Military Patronage"
 ENG_royal_family_military_patronage_philip_desc: "The Duke's service background can support the armed forces through visits, patronage and public recognition. Protocol mistakes can drag the palace into another headline cycle."
 ENG_royal_family_manage_philip_remarks: "Manage the Duke's Press Remarks"
 ENG_royal_family_manage_philip_remarks_desc: "A quiet palace briefing can reduce the chance that an offhand remark becomes a political problem, unless the briefing itself leaks."

 ENG_royal_family_expand_princes_trust: "Expand the Prince's Trust"
 ENG_royal_family_expand_princes_trust_desc: "The Prince's Trust can support youth enterprise and training in communities hit by economic change. Aggressive publicity can create cost criticism or expose strain in the Wales household."
 ENG_royal_family_environmental_patronage_charles: "Encourage Environmental Patronage"
 ENG_royal_family_environmental_patronage_charles_desc: "Environmental causes give Charles a modern public identity, though some newspapers may treat it as eccentric or use it to revive private-life speculation."
 ENG_royal_family_architecture_speech: "Allow an Architecture Speech"
 ENG_royal_family_architecture_speech_desc: "Charles's views on architecture and heritage can resonate, but they also invite argument and can feed wider criticism of the Prince of Wales."

 ENG_royal_family_hospital_charity_visits: "Hospital Charity Visits"
 ENG_royal_family_hospital_charity_visits_desc: "Diana's hospital visits create powerful public sympathy while raising expectations around health care. Too much attention can spark press frenzy or public speculation about the Wales marriage."
 ENG_royal_family_global_humanitarian_patronage: "Global Humanitarian Patronage"
 ENG_royal_family_global_humanitarian_patronage_desc: "Humanitarian causes strengthen Britain's soft power and make the monarchy feel humane. Politicised coverage can create backlash or sharpen tensions around Charles and Diana."
 ENG_royal_family_protect_diana_from_press: "Protect Diana from the Press"
 ENG_royal_family_protect_diana_from_press_desc: "Reducing press access costs some public visibility, but keeps the family from becoming tabloid property. If handled clumsily, the press will treat it as a cover-up."

 ENG_royal_family_save_the_children_tour: "Save the Children Tour"
 ENG_royal_family_save_the_children_tour_desc: "Princess Anne's charity work can carry British soft power without much constitutional risk, though cost-conscious coverage can still make trouble."
 ENG_royal_family_working_royal_schedule: "A Working Royal Schedule"
 ENG_royal_family_working_royal_schedule_desc: "A steady schedule of openings, visits and patronage work keeps the institution useful. Even reliable duty can be soured by a bad press day."

 ENG_royal_family_falklands_veteran_visit: "Falklands Veteran Visit"
 ENG_royal_family_falklands_veteran_visit_desc: "Prince Andrew's service can be used to honour veterans and maintain naval prestige. The wrong kind of attention can turn military visibility into personal controversy."
 ENG_royal_family_trade_envoy_preparations: "Trade Envoy Preparations"
 ENG_royal_family_trade_envoy_preparations_desc: "Royal access can help trade diplomacy, but it also exposes the family to business criticism and personal scandal."

 ENG_royal_family_arts_patronage_edward: "Arts Patronage"
 ENG_royal_family_arts_patronage_edward_desc: "A careful arts role gives Prince Edward visibility without placing him at the centre of politics. Poor press framing can make it look like indulgence."
 ENG_royal_family_youth_outreach_edward: "Youth Outreach"
 ENG_royal_family_youth_outreach_edward_desc: "Youth patronage lets Edward support public service without adding much palace risk, unless the costs become the story."

 ENG_royal_family_arts_circle_margaret: "Royal Arts Circle"
 ENG_royal_family_arts_circle_margaret_desc: "Princess Margaret's cultural links can be valuable, if they are kept disciplined. Too much glamour invites cost criticism."
 ENG_royal_family_quiet_margaret_schedule: "Quiet Margaret's Schedule"
 ENG_royal_family_quiet_margaret_schedule_desc: "A quieter schedule lowers tabloid pressure without openly humiliating the family. A briefing leak can make the palace look divided."

 eng_royal_family.1.t: "Tabloid Storm Around the Royals"
 eng_royal_family.1.d: "The press has found another royal story and turned it into a national obsession. The issue is not grave enough to threaten the constitution, but it is loud enough to chip away at the family's authority."
 eng_royal_family.1.a: "Let the palace ride it out"
 eng_royal_family.1.b: "Open the palace diary"
 eng_royal_family.1.c: "Keep them away from the cameras"

 ENG_queen_elizabeth_2: "Queen Elizabeth II"
 ENG_queen_elizabeth_2_desc: "Queen Elizabeth II, daughter of George VI, was the queen of the United Kingdom since the 1950s and has stood as a rock of national unity for her people. Even supporters of a British republic are not opposed to her, just to the institution she represents."
