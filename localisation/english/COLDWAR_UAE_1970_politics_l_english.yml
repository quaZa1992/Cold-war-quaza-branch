# IMPERIA CW — Cold War: UAE 1970 politics — English localisation.
 COLDWAR_UAE_party_0:0 "The Ruling Houses"
 COLDWAR_UAE_party_0_desc:0 "The hereditary ruling houses maintain the coast's established British and Western ties while negotiating common institutions and retaining emirate authority. The Trucial States Council precedes an actual federal presidency."
 COLDWAR_UAE_party_0_icon:0 "£generic_Western_Autocracy_small"
 COLDWAR_UAE_party_1:0 "Constitutional Conservatives"
 COLDWAR_UAE_party_1_desc:0 "An alternate constitutional coalition favouring elected institutions, gradual reform and the protection of local authority."
 COLDWAR_UAE_party_1_icon:0 "£generic_conservatism_small"
 COLDWAR_UAE_party_2:0 "Constitutional Liberals"
 COLDWAR_UAE_party_2_desc:0 "An alternate constitutional coalition favouring civil guarantees, commercial openness and accountable federal ministries."
 COLDWAR_UAE_party_2_icon:0 "£generic_liberalism_small"
 COLDWAR_UAE_party_4:0 "National Planning Movement"
 COLDWAR_UAE_party_4_desc:0 "An alternate socialist movement seeking public ownership and a national planning authority. This is not a historical governing party of the Trucial States."
 COLDWAR_UAE_party_4_icon:0 "£generic_Communist_State_small"
 COLDWAR_UAE_party_7:0 "Civic Arab Coalition"
 COLDWAR_UAE_party_7_desc:0 "An alternate Arab nationalist civilian coalition seeking a republican settlement through public administration and civic institutions."
 COLDWAR_UAE_party_7_icon:0 "£generic_Autocracy_small"
 COLDWAR_UAE_party_12:0 "Association Reform Coalition"
 COLDWAR_UAE_party_12_desc:0 "A proposed governing coalition drawn from legally recognised Sunni educational and reform associations. The association movement is not a mass party in January 1970."
 COLDWAR_UAE_party_12_icon:0 "£generic_Neutral_Muslim_Brotherhood_small"
 COLDWAR_UAE_party_18:0 "Social Reform Coalition"
 COLDWAR_UAE_party_18_desc:0 "An alternate social reform coalition seeking labour representation, public services and negotiated economic change."
 COLDWAR_UAE_party_18_icon:0 "£generic_neutral_Social_small"
 COLDWAR_UAE_party_22:0 "Federal Officers Movement"
 COLDWAR_UAE_party_22_desc:0 "An alternate Arab nationalist officers movement proposing a republican state and a unified security administration."
 COLDWAR_UAE_party_22_icon:0 "£generic_Nat_Autocracy_small"
 COLDWAR_UAE_party_23:0 "Sovereigntist Ruling Houses"
 COLDWAR_UAE_party_23_desc:0 "An alternate sovereigntist alignment of the ruling houses, preserving hereditary institutions while distancing the coast from Western patronage. This nationalist monarchist alternative is separate from the historical governing alignment."
 COLDWAR_UAE_party_23_icon:0 "£generic_Monarchist_small"
 COLDWAR_UAE_prime_minister_maktoum:0 "Prime Minister: Maktoum bin Rashid"
 COLDWAR_UAE_prime_minister_maktoum_desc:0 "Maktoum bin Rashid Al Maktoum heads the federal cabinet. The prime minister directs the cabinet and holds a separate office from the president."
 COLDWAR_UAE_prime_minister_rashid:0 "Prime Minister: Rashid bin Saeed"
 COLDWAR_UAE_prime_minister_rashid_desc:0 "The cabinet bargain places Rashid bin Saeed Al Maktoum at the head of the federal cabinet. This is a premiership, distinct from the federal presidency."
 COLDWAR_UAE_dirham_currency:0 "UAE Dirham"
 COLDWAR_UAE_dirham_currency_desc:0 "A common domestic currency administered through the national monetary institutions. Foreign reserves, exchange conditions and inflation continue through the ordinary currency system."
