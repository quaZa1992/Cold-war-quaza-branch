l_english:
# IMPERIA CW — Cold War: Imperia oil price — English localisation.
 imp_oil_price_decisions: "Global Oil Market"
 imp_oil_price_decisions_desc: "Oil powers industry, transport and households. The §Yglobal market price§! reacts to disruptions and moves gradually toward its §Yequilibrium§!. A national §YRaise or Lower Asking Price§! decision changes that equilibrium after seven days; a larger share of world net oil exports gives a country more influence. An §YOPEC conference§! is separate: its common posted-price level changes only if the members voting in favour outnumber those opposed.\n\nMarket equilibrium: §Y$$[?global.imp_oil_price_equilibrium_display|.2]§! per barrel. Current price: §Y$$[?global.imp_oil_price_display|.2]§! per barrel.\n\nNuclear and renewable power can reduce our dependence on oil, easing the harm from high prices but also reducing the benefit of cheap oil. Our oil dependence: §Y[?imp_oil_dependency|%]§!. Average global dependence: §Y[?global.tot_dep|%]§!."
 imp_oil_price_resistance: "Oil Price Protection"

 d_imp_raise_oil_price: "Lower Asking Price for Oil"
 d_imp_raise_oil_price_desc: "By significantly lowering the asking price for our own oil exports, we can flood the global market with cheaper energy. Depending on our market share, this will reduce global oil prices, at the cost of also reducing our own profit margins."
 d_imp_lower_oil_price: "Raise Asking Price for Oil"
 d_imp_lower_oil_price_desc: "After seven days, we raise the price we ask for our own crude. Our share of world net oil exports determines how strongly this lifts Imperia's global price equilibrium. Export revenue may rise, but buyers may seek alternatives and trade relations will suffer. This national policy does not require an OPEC vote."

 imp_major_oil_exporter: "Major Oil Exporter"
 imp_major_oil_exporter_desc: "This nation is a major exporter of oil. They have a market share of roughly [?imp_oil_export_p|%]."
 imp_minor_oil_exporter: "Minor Oil Exporter"
 imp_minor_oil_exporter_desc: "This nation is a minor exporter of oil. They have a market share of roughly [?imp_oil_export_p|%]."
 imp_oil_prices_high: "High Oil Prices"
 imp_oil_prices_high_desc: "The global oil market is surging, with average prices reaching $$[?global.imp_oil_price_display|.2] per barrel of crude. Oil-exporting nations are reaping massive revenues, while import-dependent economies are struggling under the burden of rising energy costs and inflation. Geopolitical tensions over energy security are on the rise."
 imp_oil_prices: "Normal Oil Prices"
 imp_oil_prices_desc: "The global oil market is stable, with an average price of $$[?global.imp_oil_price_display|.2] per barrel of crude. Economies and industries are operating without significant disruptions or windfalls, ensuring a balanced energy supply for both producers and consumers."
 imp_oil_prices_low: "Low Oil Prices"
 imp_oil_prices_low_desc: "The global oil market is in oversupply, driving the price of a barrel of crude to a measly $$[?global.imp_oil_price_display|.2]. Oil-exporting nations see revenues plummet, while oil-importing nations enjoy reduced energy costs and increased industrial efficiency."

 imp_oil_prices_ask_discounted: "Discounted Crude Strategy"
 imp_oil_prices_ask_discounted_desc: "Our oil exports are priced lower than the global average, making our crude more competitive on the world market. This strategy stimulates international demand and strengthens trade partnerships, but comes at the cost of reduced profit margins and potential strain on the national budget."
 imp_oil_prices_ask_premium: "Premium Oil Pricing"
 imp_oil_prices_ask_premium_desc: "Our oil exports are priced at a premium, reflecting our confidence in the strength and demand for our crude. This maximizes our revenue per barrel, but risks decreased global demand and may provoke retaliation from oil-importing nations."
 imp_oil_prices_ask_extreme: "Maximum Asking Price"
 imp_oil_prices_ask_extreme_desc: "We demand an exceptional price for our crude. Our market share gives this stance some influence over the global price equilibrium, but buyers will search harder for alternatives and trade relations suffer."
 
 imp_oil_internal_market_first: "Internal Market First"
 imp_oil_internal_market_first_desc: "This nation is lowering exports to satisfy their own population's oil needs first." 

 oil_price_up_tt: "§YThe global oil price has risen sharply.§!"
 oil_price_up_extra_tt: "§RThis will most likely make global oil prices go up further.§!"

 imp_oil.1.t: "Civil War in [?global.civil_war_t.GetNameDef] puts pressure on oil prices"
 imp_oil.1.d: "The outbreak of civil war in [?global.civil_war_t.GetNameDef] has led to a significant spike in global oil prices. As a key exporter in the international energy sector, production is plummeting amid widespread fighting, and key export infrastructure is now under threat of becoming non-operational."
 imp_oil.1.o1: "Just what we needed..."
 imp_oil.1.o2: "Get the Saudis on the phone."
 imp_oil.1.o3: "Whoops."

 imp_oil.2.t: "[?global.imp_defender_t.GetAdjective]-[?global.imp_attacker_t.GetAdjective] war causes rising energy prices"
 imp_oil.2.d: "With armed conflict breaking out between [?global.imp_defender_t.GetNameDef] and [?global.imp_attacker_t.GetNameDef], global energy markets are entering a period of high uncertaintity. With a major oil exporter involved in the conflict, fears of significant disruptions to energy supply chains are mounting. As a consequence, oil prices have surged in recent days."
 imp_oil.2.o1: "Just what we needed..."
 imp_oil.2.o2: "Get the Saudis on the phone."

 imp_oil.3.t: "Public Outcry Over Oil Prices"
 imp_oil.3.d: "High oil prices are causing economic strain across the nation. Households are grappling with rising fuel and energy costs, while businesses are struggling to stay afloat. Protests have erupted in major cities, with citizens demanding government action."
 imp_oil.3.o1: "Prices will come down soon."
 imp_oil.3.o2: "Compensate them."
 imp_oil.3.o3: "Redirect our exports to our internal market."

 imp_oil.4.t: "Oil Prices Pressure Regime"
 imp_oil.4.d: "Global oil prices are climbing and causing problems for our economy. The cost of fuel and basic goods is climbing, and while protests remain controlled, there is increasing discontent in the streets. Key sectors are beginning to feel the strain, and the elite are growing anxious about the potential for unrest."
 imp_oil.4.o1: "This isn't a problem."
 imp_oil.4.o2: "Compensate the people."
 imp_oil.4.o3: "Redirect our exports to our internal market."

 imp_oil.5.t: "Government Praised for Low Oil Prices"
 imp_oil.5.d: "Global oil prices have taken a steep dive, providing a welcome reprieve for the average citizen. Gasoline is cheaper, heating costs are down, and many are praising the government's handling of the situation."
 imp_oil.5.o1: "That's great to hear."

 imp_oil.6.t: "Regime Praised for Low Oil Prices"
 imp_oil.6.d: "Oil prices are low, easing the financial burden on the population. The public welcomes the drop in fuel prices, with many praising the regime for securing such relief in difficult times."
 imp_oil.6.o1: "That's great to hear."

 imp_oil.7.t: "Global Oil Crisis!"
 imp_oil.7.d: "The world is facing an unprecedented global oil crisis. A confluence of factors have caused oil prices to soar. The global economy is reeling as nations scramble to secure access to affordable crude oil. Markets are in turmoil, and political leaders are under intense pressure to mitigate the consequences. The crisis is threatening to destabilize economies and disrupt trade networks.\n\nWhile the effects of the crisis are widespread, the population is quick to blame those in power. Rising fuel costs and the strain on everyday life is sparking growing frustration, with many citizens demanding accountability from their leaders. The pressure is mounting, and leaders must decide how to manage the crisis before discontent turns to unrest."
 imp_oil.7.o1: "Oh no."
 
 imp_oil.8.t: "Oil prices surge"
 imp_oil.8.d: "Recent global developments have caused a significant impact on energy prices."
 imp_oil.8.o1: "Oh no."

 imp_oil.9.t: "Oil prices fall"
 imp_oil.9.d: "Oil prices have dropped significantly in recent days, as global factors seem to have realigned the supply and demand balance."
 imp_oil.9.o1: "That's great to hear."

 imp_oil.10.t: "Problems in the Strait of Hormuz"
 imp_oil.10.d: "There are reports of significant issues in the Strait of Hormuz, causing delays in the shipment of oil from the Persian Gulf. Oil prices have started to react to the uncertainty, and global traders are keeping a close eye on developments."
 imp_oil.10.o1: "Let's hope it doesn't get worse."

 imp_oil.11.t: "Problems in the Bab el-Mandeb"
 imp_oil.11.d: "Recent reports indicate significant issues at the Bab el-Mandeb Strait, disrupting the flow of oil from the Persian Gulf to Europe and beyond. Oil prices have started to react to the uncertainty, and global traders are keeping a close eye on developments."
 imp_oil.11.o1: "Let's hope it doesn't get worse."

 imp_oil.12.t: "Problems in the Suez Canal"
 imp_oil.12.d: "There have been reports of serious issues in the Suez Canal, disrupting oil shipments from the Middle East to Europe. Governments and corporations dependent on the route are scrambling to adjust and oil prices are up."
 imp_oil.12.o1: "Troubling."

 imp_oil.13.t: "Problems in the Strait of Malacca"
 imp_oil.13.d: "There have been significant problems in the Strait of Malacca, affecting the smooth flow of oil from the Middle East to East Asia. This development is closely watched by energy markets, especially in East Asia."
 imp_oil.13.o1: "This could be a real problem."

 imp_oil.14.t: "Problems in the Bosphorus"
 imp_oil.14.d: "Issues have arisen in the Turkish Straits, affecting the flow of oil from the Black Sea region to the Mediterranean. The situation is still evolving, with no clear resolution in sight and speculation is driving the price of crude up."
 imp_oil.14.o1: "This could be a real problem."

 imp_oil_shock: "Oil Shock!"
 imp_oil_shock_desc: "The world is facing an unprecedented global oil crisis."

 imp_oil.15.t: "Tanker sinks off the coast of [?global.imp_random_oil.GetNameDef]"
 imp_oil.15.d: "Reports have surfaced of a tanker sinking off the coast of [?global.imp_random_oil.GetNameDef], spilling oil into the sea and causing significant delays in the transportation of oil from the region. While the cause of the sinking remains unclear, authorities are scrambling to contain the spill. The resulting disruption is already impacting oil shipments in the region, and prices have risen due to the uncertainty surrounding the incident. Traders are worried about potential long-term effects on shipping routes and environmental damage."
 imp_oil.15.o1: "That's a problem."
 imp_oil.15.o2: "Let's clean it up."

 imp_oil.16.t: "Oil pipeline explosion in [?global.imp_random_oil.GetNameDef]"
 imp_oil.16.d: "A pipeline explosion in [?global.imp_random_oil.GetNameDef] has caused a disruption in the flow of oil. While the exact cause of the incident remains unknown, production and exports are temporarily halted, causing disruptions on the global energy market. Oil prices have risen sharply as traders react to the sudden interruption."
 imp_oil.16.o1: "That's a problem."
 imp_oil.16.o2: "Let's repair it."

 imp_oil.17.t: "[?global.imp_random_oil.GetAdjective] Oil reserves smaller than expected"
 imp_oil.17.d: "Recent reports from [?global.imp_random_oil.GetNameDef] have revealed that the oil reserves in a previously promising field are significantly smaller than initially projected. Experts have suggested that while there was hope for a major new source of supply, the reserves are not as accessible as once believed. This new information is causing issues as the incertaintity is making traders drive up global energy prices."
 imp_oil.17.o1: "That's not great."
 imp_oil.17.o2: "But that's one of our fields..."

 imp_oil.18.t: "Unexpected shutdown in [?global.imp_random_oil.GetAdjective] refinery"
 imp_oil.18.d: "A sudden maintenance shutdown at a major oil refinery in [?global.imp_random_oil.GetNameDef] has caused significant delays in the processing of crude oil. While the exact cause remains unclear, the shutdown is expected to affect supply for several days. The disruption is causing minor concerns about potential shortages in refined oil products, especially for energy-dependent nations and as a result global oil prices are rising."
 imp_oil.18.o1: "That's frustrating."
 imp_oil.18.o2: "I want this fixed right now."

 imp_oil.19.t: "Storm hits [?global.imp_random_oil.GetAdjective] refinery"
 imp_oil.19.d: "A storm has hit [?global.imp_random_oil.GetName], disrupting oil production and exports from one of the world's busiest oil-exporting areas. Though the storm had no long-term impacts, it has caused logistical issues and disruptions in the global oil supply. As a consequence, the price of oil has been rising."
 imp_oil.19.o1: "Blame the Saudis."
 imp_oil.19.o2: "Fix the situation."

 imp_oil.20.t: "Mild winter forecasts drive down oil price"
 imp_oil.20.d: "Analysts and meteorological agencies have begun circulating forecasts suggesting that the upcoming winter season may be milder than average across key industrialized regions. While the accuracy of these predictions remains uncertain, markets are already reacting to the possibility of lower seasonal energy demand."
 imp_oil.20.o1: "I like it."

 imp_oil.21.t: "Oversupply of oil hits markets"
 imp_oil.21.d: "Several major producers have exceeded their monthly quotas, flooding the market with more oil than expected. Global oil prices are falling as a consequence of this unexpected oversupply."
 imp_oil.21.o1: "More oil!"

 imp_oil.22.t: "Unaccounted oil enters market"
 imp_oil.22.d: "An unknown source has dumped a large quantity of oil into the global market — possibly from reserves or unsanctioned production. Prices are dropping as a result."
 imp_oil.22.o1: "Bad, but... good?"

 imp_oil.23.t: "Sudden discovery of new [?global.imp_random_oil.GetAdjective] oil reserves"
 imp_oil.23.d: "Unexpected news reports have surfaced of a significant new oil discovery in [?global.imp_random_oil.GetNameDef]. While it is unclear how quickly production will begin, it has led to a sudden drop in oil prices as markets react to the prospect of increased supply."
 imp_oil.23.o1: "Great!"
 imp_oil.23.o2: "Ka-ching!"

 imp_oil.24.t: "Sanctions on [oil_sanction_c.GetNameDef] drive oil price up"
 imp_oil.24.d: "New international sanctions imposed on [oil_sanction_c.GetNameDef] are causing fear and uncertainty in global energy markets. Traders are scrambling to adjust to the potential supply shortfall, with fears of prolonged disruptions pushing oil prices upwards."
 imp_oil.24.o1: "That'll shake up the market."

 imp_oil.25.t: "Sanctions eased on [oil_sanction_c.GetNameDef], oil price down"
 imp_oil.25.d: "Following a breakthrough in international negotiations, sanctions on [oil_sanction_c.GetNameDef] have been partially lifted — particularly those affecting its oil exports. Markets are responding swiftly to the news, pricing in the return of a significant producer to the global supply chain."
 imp_oil.25.o1: "Great news!"

 imp_oil.50.t: "[From.GetnameDef] cuts off major oil supply"
 imp_oil.50.d: "[From.GetnameDef] has implemented strict limits on oil exports, following a broad shift toward restrictive trade policy. The move has sharply reduced the availability of crude on the international market. While domestic sources report the decision as a protective measure, foreign governments have begun raising concerns about energy access and market stability."
 imp_oil.50.o1: "Damn you, [From.GetnameDef]!"
 imp_oil.50.o2: "Hey, that's us!"

 imp_oil.51.t: "[From.GetnameDef] reduces oil exports"
 imp_oil.51.d: "A recent change in the trade policies of [From.GetnameDef]’s have resulted in a significant decrease in oil exports. As a result market volatility is expected to rise in the short term."
 imp_oil.51.o1: "Damn you, [From.GetnameDef]!"
 imp_oil.51.o2: "Hey, that's us!"

 imp_oil.52.t: "[From.GetnameDef] increases exports massively"
 imp_oil.52.d: "Following a major shift in trade policy, [COUNTRY] has significantly increased the amount of oil made available for export. International markets have responded with falling prices as the supply of crude rises sharply."
 imp_oil.52.o1: "Thank you, [From.GetnameDef]!"
 imp_oil.52.o2: "Hey, that's us!"

 imp_oil.53.t: "[From.GetnameDef] increases exports"
 imp_oil.53.d: "[From.GetnameDef] has revised its trade laws to allow a notable increase in oil exports. The change hints at a clear turn toward greater market openness. Energy analysts suggest the decision may improve relations with key trading partners, though it could put downward pressure on prices if the trend continues."
 imp_oil.53.o1: "Thank you, [From.GetNameDef]!"
 imp_oil.53.o2: "Hey, that's us!"
