# IMPERIA CW — Cold War: ddr currency — English localisation.
 ddr_mark: "Mark der DDR (Ostmark)"
 ddr_mark_desc: "The Mark der Deutschen Demokratischen Republik (Mark der DDR, M) has been the official name of East Germany's currency since 1968. Divided into 100 Pfennig, it circulates within the planned economy and is not freely convertible into foreign currencies."
