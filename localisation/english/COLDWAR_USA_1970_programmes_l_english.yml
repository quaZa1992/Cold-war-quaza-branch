 COLDWAR_USA_dom_D2_s0:0 "National Service Establishment"
 COLDWAR_USA_dom_D2_s0_desc:0 "A renewed selective-service system sustains a larger reserve of trained citizens. Broader participation improves mobilisation at a continuing political cost."
 COLDWAR_USA_dom_D2_s1:0 "National Service Establishment"
 COLDWAR_USA_dom_D2_s1_desc:0 "A renewed selective-service system sustains a larger reserve of trained citizens. Broader participation improves mobilisation at a continuing political cost."
 COLDWAR_USA_dom_D3_s0:0 "Statutory Intelligence Oversight"
 COLDWAR_USA_dom_D3_s0_desc:0 "Legislative oversight can restore confidence in intelligence institutions and improve the defence against foreign penetration. Formal review slows the expansion of sensitive programmes."
 COLDWAR_USA_dom_D4_s0:0 "Executive Intelligence Direction"
 COLDWAR_USA_dom_D4_s0_desc:0 "Central executive direction gives intelligence agencies more freedom to organise overseas programmes. Wider discretion increases the political cost of secrecy at home."
 COLDWAR_USA_dom_army_mass_s0:0 "Continental Sustainment Doctrine"
 COLDWAR_USA_dom_army_mass_s0_desc:0 "A continental force needs maintenance, transport and command arrangements suited to prolonged combined-arms operations. Heavy formations remain costly to move."
 COLDWAR_USA_dom_army_mass_s1:0 "Continental Sustainment Doctrine"
 COLDWAR_USA_dom_army_mass_s1_desc:0 "A continental force needs maintenance, transport and command arrangements suited to prolonged combined-arms operations. Heavy formations remain costly to move."
 COLDWAR_USA_dom_army_precision_s0:0 "Rapid Deployment Doctrine"
 COLDWAR_USA_dom_army_precision_s0_desc:0 "Mobile formations and precision systems promise more useful force without a larger permanent overseas army. Expensive equipment and specialist support limit how widely the model can be applied."
 COLDWAR_USA_dom_sea_control_s0:0 "Carrier Readiness Programme"
 COLDWAR_USA_dom_sea_control_s0_desc:0 "Carrier readiness concentrates funds on air groups, escorts and sustained deployment. High readiness demands expensive maintenance and replacement equipment."
 COLDWAR_USA_dom_sea_denial_s0:0 "Atlantic Escort Programme"
 COLDWAR_USA_dom_sea_denial_s0_desc:0 "Escorts, maritime surveillance and undersea forces protect Atlantic communications. This priority favours dependable sea lanes over a larger visible carrier presence."
 COLDWAR_USA_dom_S1_s0:0 "Federal Civil Rights Enforcement"
 COLDWAR_USA_dom_S1_s0_desc:0 "Federal enforcement establishes a consistent national standard for civil rights. Implementing that standard spends political capital and requires institutions capable of defending it."
 COLDWAR_USA_dom_S1_s1:0 "Federal Civil Rights Enforcement"
 COLDWAR_USA_dom_S1_s1_desc:0 "Federal enforcement establishes a consistent national standard for civil rights. Implementing that standard spends political capital and requires institutions capable of defending it."
 COLDWAR_USA_dom_S2_s0:0 "State Compliance Agreements"
 COLDWAR_USA_dom_S2_s0_desc:0 "State implementation agreements combine enforceable civil-rights requirements with local investment. Negotiation takes longer and offers less immediate national political reassurance."
 COLDWAR_USA_dom_S2_s1:0 "State Compliance Agreements"
 COLDWAR_USA_dom_S2_s1_desc:0 "State implementation agreements combine enforceable civil-rights requirements with local investment. Negotiation takes longer and offers less immediate national political reassurance."
 COLDWAR_USA_dom_F1_s0:0 "Commercial Diplomacy Mandate"
 COLDWAR_USA_dom_F1_s0_desc:0 "Commercial statecraft makes export credit and civilian contracts the preferred instruments of influence. It leaves less political room for expensive security commitments."
 COLDWAR_USA_dom_F2_s0:0 "Multilateral Diplomacy Mandate"
 COLDWAR_USA_dom_F2_s0_desc:0 "Multilateral consultation gives commitments greater legitimacy and a wider institutional base. Negotiation and shared standards make those programmes more expensive."
 COLDWAR_USA_dom_F3_s0:0 "Security Assistance Mandate"
 COLDWAR_USA_dom_F3_s0_desc:0 "A more active security policy favours training missions and sustained military readiness. Maintaining that posture requires a larger foreign programme budget."
 COLDWAR_USA_dom_dem72_public_s0:0 "Public Employment Programme"
 COLDWAR_USA_dom_dem72_public_s0_desc:0 "A Democratic recovery appropriation can put federal employment and public works first. Visible local improvements carry a larger ongoing public commitment."
