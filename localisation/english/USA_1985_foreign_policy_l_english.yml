l_english:
 USA_1985_reagan_doctrine: "The Reagan Doctrine"
 USA_1985_reagan_doctrine_desc: "The Cold War will not be won by waiting for Moscow to make mistakes. The United States will contest Soviet influence through proxies, intelligence channels, arms pipelines, and regional partners willing to make communist expansion expensive."
 USA_1985_operation_cyclone: "Operation Cyclone"
 USA_1985_operation_cyclone_desc: "Afghanistan is where the Soviet Union can be made to pay. By pushing rifles, radios, and Stinger missiles through covert channels, Washington can turn every valley into a political and logistical drain on Moscow."
 USA_1985_stinger_pipeline: "The Stinger Pipeline"
 USA_1985_stinger_pipeline_desc: "Portable air-defense missiles change the psychology of the Afghan war. Soviet aircraft must fly lower, slower, and more carefully, while the Kremlin absorbs a rising stream of losses."
 USA_1985_the_contras: "The Contras"
 USA_1985_the_contras_desc: "The Sandinista government gives Cuba and Moscow a foothold in Central America. Funding the Contras will force Managua into a permanent security crisis and keep the Monroe Doctrine alive by deniable means."
 USA_1985_savimbis_war: "Savimbi's War"
 USA_1985_savimbis_war_desc: "Angola can tie down Cuban manpower, Soviet money, and MPLA attention for years. Supporting UNITA and South Africa turns southern Africa into another pressure point against the socialist bloc."
 USA_1985_the_gulf_balance: "The Gulf Balance"
 USA_1985_the_gulf_balance_desc: "Iran and Iraq must both survive, but neither should dominate the Gulf. American intelligence, spare parts, and deniable arms-market access can keep the war balanced while Washington gains leverage over both capitals."
 USA_1985_dual_containment: "Dual Containment"
 USA_1985_dual_containment_desc: "The United States will not choose a permanent favorite in the Iran-Iraq War. Instead, Washington will sell access, information, and restraint to whichever side prevents the other from becoming the new regional hegemon."
 USA_1985_preserve_the_american_century: "Preserve the American Century"
 USA_1985_preserve_the_american_century_desc: "Afghanistan, Central America, southern Africa, and the Gulf are not separate theaters. They are one contest over whether the United States or the Soviet Union decides the rules of the late Cold War."

 USA_1985_operation_cyclone_threat: "Operation Cyclone"
 USA_1985_stinger_pipeline_threat: "Stinger Pipeline"
 USA_1985_contra_threat: "Contra Funding"
 USA_1985_savimbi_threat: "Support for UNITA"

 USA_1985_cold_war_foreign_policy_category: "Cold War Foreign Policy"
 USA_1985_cold_war_foreign_policy_category_desc: "The United States can preserve its global dominance by forcing the Soviet bloc to pay for every proxy war, every exposed client, and every weak flank. These actions are tuned for multiplayer roleplay: they are powerful, visible, and costly enough to create real diplomatic consequences."

 USA_1985_send_cia_intel_to_iraq: "Send CIA Coordinates to Iraq"
 USA_1985_send_cia_intel_to_iraq_desc: "For 90 days, Iraq receives American satellite imagery, signals intercepts, and battlefield coordination. While this is active, Iran cannot receive the same channel."
 USA_1985_send_cia_intel_to_iran: "Send CIA Coordinates to Iran"
 USA_1985_send_cia_intel_to_iran_desc: "For 90 days, Iran receives quiet American intelligence intended to prevent an Iraqi breakthrough. While this is active, Iraq cannot receive the same channel."
 USA_1985_open_iraqi_market_access: "Open Iraqi Arms Market Access"
 USA_1985_open_iraqi_market_access_desc: "Authorize Iraqi access to the U.S. arms market by activating market access, opening the receiver's weapon-market rule, and pushing the AI toward American equipment purchases. This creates a durable U.S. influence hook in Baghdad."
 USA_1985_open_iranian_market_access: "Open Iranian Arms Market Access"
 USA_1985_open_iranian_market_access_desc: "Open deniable U.S. arms-market access for Iran through intermediaries by activating market access, opening the receiver's weapon-market rule, and pushing the AI toward American equipment purchases. The political cost is higher, but it gives Washington leverage if Baghdad begins winning too clearly."
 USA_1985_expand_operation_cyclone: "Expand Operation Cyclone"
 USA_1985_expand_operation_cyclone_desc: "Send another package of rifles, C2 equipment, and Stinger systems into the Afghan pipeline. The Soviets will bleed, but American stockpiles and political capital will pay for it."
 USA_1985_expand_contra_resupply: "Expand Contra Resupply"
 USA_1985_expand_contra_resupply_desc: "Move money, radios, ammunition, and trainers into the Contra network. Nicaragua is pushed back into civil war pressure and Soviet-Cuban influence takes another hit."
 USA_1985_recognize_contra_government: "Recognize a Contra Government"
 USA_1985_recognize_contra_government_desc: "If the Sandinistas lose control and Nicaragua leaves the communist camp, Washington can recognize the new government, lock in American influence, and push Soviet and Cuban leverage out of Central America."
 USA_1985_unita_air_bridge: "UNITA Air Bridge"
 USA_1985_unita_air_bridge_desc: "Keep Savimbi's forces supplied through a deniable southern route. UNITA gains equipment while Cuba pays more to sustain its overseas commitment."

 USA_1985_covert_action_budget: "Covert Action Budget"
 USA_1985_covert_action_budget_desc: "Congress, the CIA, friendly monarchies, private brokers, and quiet foreign services are being pushed into one Cold War machine. It expands American reach, but it is not free."
 USA_1985_reagan_doctrine_momentum: "Reagan Doctrine Momentum"
 USA_1985_reagan_doctrine_momentum_desc: "Washington has committed to backing anti-Soviet forces across the world. The signal is clear: Soviet influence will be contested wherever it becomes expensive."
 USA_1985_operation_cyclone_bleeding: "Operation Cyclone Bleeding"
 USA_1985_operation_cyclone_bleeding_desc: "American-supplied weapons and intelligence are making the Afghan war more expensive. Helicopters fly lower, convoys move slower, and the political cost rises every week."
 USA_1985_contra_insurgency_pressure: "Contra Insurgency Pressure"
 USA_1985_contra_insurgency_pressure_desc: "American-backed Contra networks are forcing the state to spend men, money, and legitimacy on internal security."
 USA_1985_unita_covert_supply: "UNITA Covert Supply"
 USA_1985_unita_covert_supply_desc: "American equipment and regional support are keeping UNITA in the field against the MPLA and its Cuban backers."
 USA_1985_cuban_overseas_war_costs: "Cuban Overseas War Costs"
 USA_1985_cuban_overseas_war_costs_desc: "Angola is becoming a more expensive commitment. Shipping, advisers, replacements, and diplomatic cover are draining Havana's limited resources."
 USA_1985_south_african_covert_support: "South African Covert Support"
 USA_1985_south_african_covert_support_desc: "Washington is quietly helping Pretoria sustain pressure against Soviet-backed forces in Angola."
 USA_1985_cia_battlefield_intelligence: "CIA Battlefield Intelligence"
 USA_1985_cia_battlefield_intelligence_desc: "American satellite imagery, signals intercepts, and analyst teams are being converted into battlefield advantage for a limited window."
 USA_1985_us_arms_market_access: "U.S. Arms Market Access"
 USA_1985_us_arms_market_access_desc: "American-linked arms brokers, finance channels, and spare parts networks are open. The receiving state gains better access, but Washington gains leverage."
