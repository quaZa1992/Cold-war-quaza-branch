l_english:
# IMPERIA CW — Cold War: Integrated DDR 1985 mass expansion — English localisation.
 DDR_politburo_loyalty_oaths: "Politburo Loyalty Oaths"
 DDR_politburo_loyalty_oaths_desc: "The old leadership binds ministers, district bosses and security chiefs to Honecker's line before reform language spreads further."
 DDR_state_media_counteroffensive: "State Media Counteroffensive"
 DDR_state_media_counteroffensive_desc: "Television, Neues Deutschland and the schools answer West German broadcasts with discipline, certainty and selective truth."
 DDR_cadre_rotation_purge: "Cadre Rotation Purge"
 DDR_cadre_rotation_purge_desc: "Unreliable officials are moved aside before hesitation becomes a faction."
 DDR_factory_party_secretaries: "Factory Party Secretaries"
 DDR_factory_party_secretaries_desc: "Party secretaries in the combines regain authority over output, discipline and worker conversations."
 DDR_border_regime_hardened: "Harden the Border Regime"
 DDR_border_regime_hardened_desc: "The border remains the proof that the republic can still command bodies as well as maps."
 DDR_mfs_operational_groups: "MfS Operational Groups"
 DDR_mfs_operational_groups_desc: "Mobile security groups map churches, factories, artists and border networks before they merge into open opposition."
 DDR_loyalty_before_efficiency: "Loyalty Before Efficiency"
 DDR_loyalty_before_efficiency_desc: "The economy may slow, but the state will not be repaired by people who doubt the state."
 DDR_orthodox_socialist_state: "Orthodox Socialist State"
 DDR_orthodox_socialist_state_desc: "The DDR chooses command, surveillance and ideological certainty over reform risk."
 DDR_sed_reform_commission: "SED Reform Commission"
 DDR_sed_reform_commission_desc: "A controlled reform commission gives loyal socialists room to repair the system without surrendering it."
 DDR_limited_candidacies: "Limited Candidacies"
 DDR_limited_candidacies_desc: "Carefully supervised competition can renew legitimacy while the party still writes the rules."
 DDR_press_law_revision: "Revise the Press Law"
 DDR_press_law_revision_desc: "A little legal openness can reduce the monopoly of Western broadcasts, but it also teaches society to expect answers."
 DDR_trade_union_autonomy: "Trade Union Autonomy"
 DDR_trade_union_autonomy_desc: "The FDGB is allowed to speak for workers before workers speak without it."
 DDR_municipal_dialogue: "Municipal Dialogue"
 DDR_municipal_dialogue_desc: "Local dialogues can absorb anger before every grievance becomes a national protest."
 DDR_reform_socialist_constitution: "Reform Socialist Constitution"
 DDR_reform_socialist_constitution_desc: "The constitution is rewritten to save socialism with law, participation and controlled pluralism."
 DDR_stasi_under_civilian_review: "Stasi Under Civilian Review"
 DDR_stasi_under_civilian_review_desc: "The security apparatus is brought under review before its files become the enemy of reform."
 DDR_socialist_rule_of_law: "Socialist Rule of Law"
 DDR_socialist_rule_of_law_desc: "A reformed DDR claims that socialism can survive legality rather than fear."
 DDR_contact_bonn_chancellery: "Contact the Bonn Chancellery"
 DDR_contact_bonn_chancellery_desc: "Direct talks with Bonn can stabilize the transition, but every channel increases western leverage."
 DDR_transit_accords: "Transit Accords"
 DDR_transit_accords_desc: "Regulated transit brings money, predictability and more contact with the other Germany."
 DDR_humanitarian_exit_protocol: "Humanitarian Exit Protocol"
 DDR_humanitarian_exit_protocol_desc: "Managed exits reduce pressure while proving that the border can be negotiated."
 DDR_joint_infrastructure_commission: "Joint Infrastructure Commission"
 DDR_joint_infrastructure_commission_desc: "Rail, roads and communications become the first practical language of German cooperation."
 DDR_deutsche_mark_shadow: "The Deutsche Mark Shadow"
 DDR_deutsche_mark_shadow_desc: "The D-Mark stabilizes supply and undermines the sovereignty of every plan office it enters."
 DDR_confederation_or_accession_debate: "Confederation or Accession Debate"
 DDR_confederation_or_accession_debate_desc: "The republic must decide whether it seeks a German partnership or prepares to enter the Federal Republic."
 DDR_prepare_orderly_accession: "Prepare Orderly Accession"
 DDR_prepare_orderly_accession_desc: "If accession becomes inevitable, the terms must be negotiated before the state dissolves into panic."
 DDR_confederal_sovereignty_formula: "Confederal Sovereignty Formula"
 DDR_confederal_sovereignty_formula_desc: "A confederal formula promises German unity without immediate absorption."
 DDR_negotiate_nva_status: "Negotiate NVA Status"
 DDR_negotiate_nva_status_desc: "The army's future must be settled before officers, Moscow or Bonn write it for us."
 DDR_negotiate_stasi_files: "Negotiate the Stasi Files"
 DDR_negotiate_stasi_files_desc: "The files can become evidence, blackmail or a controlled instrument of transition."
 DDR_article_23_question: "The Article 23 Question"
 DDR_article_23_question_desc: "Accession to the Federal Republic becomes a constitutional question, not only a street demand."
 DDR_third_way_socialist_state: "Third-Way Socialist State"
 DDR_third_way_socialist_state_desc: "The DDR rejects both Soviet dependency and simple absorption into Bonn."
 DDR_neutrality_note_to_superpowers: "Neutrality Note to the Superpowers"
 DDR_neutrality_note_to_superpowers_desc: "Washington and Moscow are told that the DDR seeks space for a sovereign German neutrality."
 DDR_non_aligned_german_identity: "Non-Aligned German Identity"
 DDR_non_aligned_german_identity_desc: "A new civic patriotism presents the republic as German, socialist and independent."
 DDR_independent_currency_controls: "Independent Currency Controls"
 DDR_independent_currency_controls_desc: "Currency controls defend sovereignty, though they make hard-currency scarcity harder to hide."
 DDR_balanced_trade_doctrine: "Balanced Trade Doctrine"
 DDR_balanced_trade_doctrine_desc: "The republic balances East and West trade to avoid being bought by either side."
 DDR_moscow_and_bonn_at_arms_length: "Moscow and Bonn at Arm's Length"
 DDR_moscow_and_bonn_at_arms_length_desc: "The DDR survives by refusing to become the property of either capital."
 DDR_sovereign_ddr_constitution: "Sovereign DDR Constitution"
 DDR_sovereign_ddr_constitution_desc: "A sovereign constitution gives the independent republic a legal core."
 DDR_republic_without_masters: "Republic Without Masters"
 DDR_republic_without_masters_desc: "The DDR declares that it will stand outside both absorption and subordination."
 DDR_open_economy_question: "The Opening Question"
 DDR_open_economy_question_desc: "Opening the economy can raise productivity and supply, but it lowers ideological defense and increases western pressure."
 DDR_joint_ventures_act: "Joint Ventures Act"
 DDR_joint_ventures_act_desc: "Western capital and socialist ownership are forced into the same legal room."
 DDR_western_licensing_deals: "Western Licensing Deals"
 DDR_western_licensing_deals_desc: "Licensing technology buys productivity with dependence."
 DDR_leipzig_trade_fair_opening: "Open the Leipzig Trade Fair"
 DDR_leipzig_trade_fair_opening_desc: "The Leipzig fair becomes a window for contracts, currency and political influence."
 DDR_convertible_mark_accounts: "Convertible Mark Accounts"
 DDR_convertible_mark_accounts_desc: "Convertible accounts make trade easier and inequality more visible."
 DDR_kombinate_profit_responsibility: "Kombinate Profit Responsibility"
 DDR_kombinate_profit_responsibility_desc: "Major combines are judged by usable output and hard-currency returns, not only plan ritual."
 DDR_special_economic_zone_rostock: "Rostock Special Economic Zone"
 DDR_special_economic_zone_rostock_desc: "A Baltic trade zone gives the DDR a controlled experiment in market socialism."
 DDR_private_cooperative_window: "Private Cooperative Window"
 DDR_private_cooperative_window_desc: "Cooperatives absorb shortages while creating social forces beyond the party's old language."
 DDR_technology_import_board: "Technology Import Board"
 DDR_technology_import_board_desc: "A central board decides which western technologies are worth the political risk."
 DDR_bank_channels_to_vienna: "Bank Channels to Vienna"
 DDR_bank_channels_to_vienna_desc: "Neutral banking channels provide liquidity and another route for western leverage."
 DDR_export_led_productivity_drive: "Export-Led Productivity Drive"
 DDR_export_led_productivity_drive_desc: "The open economy is justified by measurable productivity and hard-currency exports."
 DDR_open_socialist_market: "Open Socialist Market"
 DDR_open_socialist_market_desc: "The DDR accepts a high-productivity, high-exposure market socialist future."
 DDR_closed_plan_question: "The Closed Plan Question"
 DDR_closed_plan_question_desc: "Closing the economy protects ideology and reduces western pressure, but productivity suffers under command."
 DDR_ministry_target_restoration: "Restore Ministry Targets"
 DDR_ministry_target_restoration_desc: "Ministries reclaim the power to direct output, materials and factory priorities."
 DDR_material_balance_command: "Material Balance Command"
 DDR_material_balance_command_desc: "Central allocation attacks shortages with commands rather than prices."
 DDR_priority_heavy_industry: "Prioritize Heavy Industry"
 DDR_priority_heavy_industry_desc: "Heavy industry receives priority even when consumer needs become politically louder."
 DDR_cmea_substitution_program: "CMEA Substitution Program"
 DDR_cmea_substitution_program_desc: "Eastern trade substitutes for western inputs where possible."
 DDR_domestic_machine_tools: "Domestic Machine Tools"
 DDR_domestic_machine_tools_desc: "The DDR invests in its own tools to reduce exposure to embargo and credit pressure."
 DDR_consumption_by_allocation: "Consumption by Allocation"
 DDR_consumption_by_allocation_desc: "Allocation calms prices and tightens control, but reminds citizens that choice is political."
 DDR_factory_norm_campaign: "Factory Norm Campaign"
 DDR_factory_norm_campaign_desc: "Workers are asked to produce more for the republic, with pride if possible and pressure if necessary."
 DDR_price_freeze_renewed: "Renew the Price Freeze"
 DDR_price_freeze_renewed_desc: "Low prices buy calm while pushing the true cost deeper into the plan."
 DDR_collective_brigade_mobilization: "Collective Brigade Mobilization"
 DDR_collective_brigade_mobilization_desc: "Brigades and unions are mobilized to repair bottlenecks without market incentives."
 DDR_closed_economy_discipline: "Closed Economy Discipline"
 DDR_closed_economy_discipline_desc: "The closed plan is made coherent through discipline, control and reduced exposure."
 DDR_autarkic_socialist_survival: "Autarkic Socialist Survival"
 DDR_autarkic_socialist_survival_desc: "The DDR chooses ideological shelter over the productivity gains of openness."
 DDR_exit_application_registry: "Exit Application Registry"
 DDR_exit_application_registry_desc: "Every application to leave becomes a file, a warning and a political statistic."
 DDR_prague_embassy_watch: "Prague Embassy Watch"
 DDR_prague_embassy_watch_desc: "Embassy flight routes are watched before they become a public humiliation."
 DDR_hungary_route_intelligence: "Hungary Route Intelligence"
 DDR_hungary_route_intelligence_desc: "Border intelligence follows the Hungarian route before it tears open the bloc."
 DDR_family_visit_bargain: "Family Visit Bargain"
 DDR_family_visit_bargain_desc: "Limited family visits reduce pressure while increasing West German contact."
 DDR_border_troop_psychology: "Border Troop Psychology"
 DDR_border_troop_psychology_desc: "The men at the border must not break before the orders do."
 DDR_selective_amnesty_program: "Selective Amnesty Program"
 DDR_selective_amnesty_program_desc: "Selective mercy can turn emigration pressure into controlled relief."
 DDR_border_closure_protocols: "Border Closure Protocols"
 DDR_border_closure_protocols_desc: "If pressure rises, the border system must be ready to close hard and fast."
 DDR_skilled_worker_retention: "Skilled Worker Retention"
 DDR_skilled_worker_retention_desc: "Engineers, doctors and technicians must be given reasons to stay."
 DDR_youth_future_contract: "Youth Future Contract"
 DDR_youth_future_contract_desc: "Youth policy becomes a promise of housing, work and controlled horizons."
 DDR_passports_without_panic: "Passports Without Panic"
 DDR_passports_without_panic_desc: "Travel reform is designed to lower pressure without surrendering the state."
 DDR_stop_the_bleeding: "Stop the Bleeding"
 DDR_stop_the_bleeding_desc: "The republic stabilizes emigration pressure before it drains legitimacy and labor."
 DDR_land_forces_reform: "Land Forces Reform"
 DDR_land_forces_reform_desc: "The NVA's ground forces modernize command, readiness and political reliability."
 DDR_soviet_equipment_standardization: "Soviet Equipment Standardization"
 DDR_soviet_equipment_standardization_desc: "Standardized Soviet equipment makes the NVA easier to supply and integrate."
 DDR_reserve_mobilization_grid: "Reserve Mobilization Grid"
 DDR_reserve_mobilization_grid_desc: "Mobilization plans are updated for the first hours of a German crisis."
 DDR_combat_readiness_85: "Combat Readiness 85"
 DDR_combat_readiness_85_desc: "Readiness exercises prove that the NVA can still move with discipline."
 DDR_army_of_the_republic: "Army of the Republic"
 DDR_army_of_the_republic_desc: "The army becomes a pillar of the republic, not only of the party."
 DDR_volksmarine_baltic_mission: "Volksmarine Baltic Mission"
 DDR_volksmarine_baltic_mission_desc: "The Volksmarine defends the Baltic flank of a small but exposed socialist state."
 DDR_rostock_shipyards: "Rostock Shipyards"
 DDR_rostock_shipyards_desc: "Rostock's yards keep the Volksmarine useful despite limited resources."
 DDR_missile_boat_modernization: "Missile Boat Modernization"
 DDR_missile_boat_modernization_desc: "Fast missile boats fit the DDR's coastline, budget and Warsaw Pact role."
 DDR_baltic_mine_warfare: "Baltic Mine Warfare"
 DDR_baltic_mine_warfare_desc: "Mines and coastal denial give a small navy strategic weight."
 DDR_baltic_red_fleet: "Baltic Red Fleet"
 DDR_baltic_red_fleet_desc: "The Volksmarine becomes a credible Baltic partner for Soviet naval plans."
 DDR_lsk_lvv_readiness: "LSK/LV Readiness"
 DDR_lsk_lvv_readiness_desc: "The air force and air defense troops prepare for the first minutes over Germany."
 DDR_mig_23_overhaul: "MiG-23 Overhaul"
 DDR_mig_23_overhaul_desc: "Fighter readiness improves through overhaul, spares and pilot hours."
 DDR_sam_network_modernization: "SAM Network Modernization"
 DDR_sam_network_modernization_desc: "The air defense network is modernized to protect the narrow skies over Berlin."
 DDR_radar_to_warsaw_pact: "Radar to the Warsaw Pact"
 DDR_radar_to_warsaw_pact_desc: "Radar integration gives Moscow warning and the DDR relevance."
 DDR_sky_over_berlin: "Sky Over Berlin"
 DDR_sky_over_berlin_desc: "The DDR makes the airspace over Berlin a disciplined military system."
 DDR_prague_security_channel: "Prague Security Channel"
 DDR_prague_security_channel_desc: "Security contacts with Prague coordinate responses to dissidents and refugees."
 DDR_warsaw_coordination_group: "Warsaw Coordination Group"
 DDR_warsaw_coordination_group_desc: "Polish and East German planning links military and political anxieties."
 DDR_budapest_warning_note: "Budapest Warning Note"
 DDR_budapest_warning_note_desc: "Hungary is warned that border experiments can endanger the entire bloc."
 DDR_balkan_hardline_contacts: "Balkan Hardline Contacts"
 DDR_balkan_hardline_contacts_desc: "Hardline socialist governments become useful partners when Moscow grows uncertain."
 DDR_cmea_energy_bargaining: "CMEA Energy Bargaining"
 DDR_cmea_energy_bargaining_desc: "Energy and input bargaining inside the CMEA buys time for the DDR economy."
 DDR_bonn_transit_leverage: "Bonn Transit Leverage"
 DDR_bonn_transit_leverage_desc: "Transit access gives the DDR a bargaining chip with the Federal Republic."
 DDR_un_recognition_campaign: "UN Recognition Campaign"
 DDR_un_recognition_campaign_desc: "International recognition is used to reinforce sovereignty against both blocs."
 DDR_swedish_backchannel: "Swedish Backchannel"
 DDR_swedish_backchannel_desc: "Neutral backchannels offer quiet diplomacy when public alignment is too dangerous."
 DDR_vatican_church_contacts: "Vatican Church Contacts"
 DDR_vatican_church_contacts_desc: "Contacts through Catholic channels help manage church pressure without pure repression."
 DDR_european_status_quo_architecture: "European Status Quo Architecture"
 DDR_european_status_quo_architecture_desc: "The DDR tries to turn Europe's fear of instability into a guarantee of its survival."
