 COLDWAR_RAJ_1970_test_programme_category:0 "India: Missile and Space Tests"
 COLDWAR_RAJ_1970_prithvi_test:0 "Conduct the First Prithvi Flight Test"
 COLDWAR_RAJ_1970_prithvi_test_desc:0 "Costs 50 Political Power. Attempt a Prithvi test campaign at the Odisha range: 75% chance of success and 25% chance of failure. Failure imposes a six-month cooldown; only success unlocks the focus milestone."
 COLDWAR_RAJ_1970_rohini_launch:0 "Attempt the Rohini Orbital Launch"
 COLDWAR_RAJ_1970_rohini_launch_desc:0 "Costs 50 Political Power. Attempt an orbital launch from the Andhra coast: 80% chance of success and 20% chance of failure. Failure imposes a six-month cooldown; only success unlocks the focus milestone."
 COLDWAR_RAJ_1970_TEST.1.t:0 "Prithvi Test Success"
 COLDWAR_RAJ_1970_TEST.1.desc:0 "The first Prithvi flight test has succeeded. India can now pursue the corresponding milestone in its missile programme."
 COLDWAR_RAJ_1970_TEST.2.t:0 "Prithvi Test Failure"
 COLDWAR_RAJ_1970_TEST.2.desc:0 "The Prithvi flight test failed. Engineers will investigate for six months before another test can be attempted."
 COLDWAR_RAJ_1970_TEST.3.t:0 "Rohini Reaches Orbit"
 COLDWAR_RAJ_1970_TEST.3.desc:0 "The Rohini launch succeeded and the satellite reached orbit. India can now pursue the corresponding milestone in its space programme."
