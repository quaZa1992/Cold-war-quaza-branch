 COLDWAR_RAJ_1970_foreign_offer_french_aircraft:0 "French Aircraft and Training"
 COLDWAR_RAJ_1970_foreign_offer_french_aircraft_desc:0 "Any actual licence, purchase or equipment uses its own existing mechanics and both countries’ decisions."
 COLDWAR_RAJ_1970_offer_usa:0 "US Agricultural Cooperation"
 COLDWAR_RAJ_1970_offer_usa_desc:0 "The focus authorises an offer; benefits are applied only after the other player accepts."
 COLDWAR_RAJ_1970_foreign_revision_nepal_trade:0 "The 1978 Nepalese Trade Treaty"
 COLDWAR_RAJ_1970_foreign_revision_nepal_trade_desc:0 "Inspired by the 1978 trade treaty. On acceptance this replaces, rather than stacks with, the earlier generic Nepal trade spirits on both sides; no routes or ports are forced open."
 COLDWAR_RAJ_1970_foreign_revision_china_confidence:0 "Border Confidence Talks"
 COLDWAR_RAJ_1970_foreign_revision_china_confidence_desc:0 "Inspired by the 1993 agreement on peace along the line of actual control; no boundary settlement or transfer is implied."
 COLDWAR_RAJ_1970_foreign_revision_ganges:0 "Negotiate the Farakka Waters"
 COLDWAR_RAJ_1970_foreign_revision_ganges_desc:0 "Inspired by the 1977 water agreement. Both spirits expire five years after signing; renewal needs a new offer and mutual acceptance. No resources or territory are transferred."
 COLDWAR_RAJ_1970_foreign_revision_sri_relief:0 "Joint Relief and Reconstruction"
 COLDWAR_RAJ_1970_foreign_revision_sri_relief_desc:0 "A separate humanitarian offer after an accepted accord. Check its signed and active flags before sending and accepting, and suspend this agreement if the accord lapses. It creates no troops, military access, peace, or regime change."
 COLDWAR_RAJ_1970_foreign_offer_sov_rupee:0 "Rupee Clearing with Moscow"
 COLDWAR_RAJ_1970_foreign_offer_sov_rupee_desc:0 "A rupee-clearing proposal supports trade but creates bilateral dependence; no debt is erased."
 COLDWAR_RAJ_1970_foreign_nam:0 "A Non-Aligned Foreign Policy"
 COLDWAR_RAJ_1970_foreign_nam_desc:0 "The Non-Aligned Movement gives India an independent voice. Decide how that independence should guide relations with the great powers."
 COLDWAR_RAJ_1970_foreign_gulf:0 "Energy and the Gulf"
 COLDWAR_RAJ_1970_foreign_gulf_desc:0 "Reduce industry’s exposure to imported energy while opening talks with the Gulf’s producers and employers."
 COLDWAR_RAJ_1970_foreign_balanced:0 "Keep the Blocs at Arm’s Length"
 COLDWAR_RAJ_1970_foreign_balanced_desc:0 "Keep commercial and diplomatic channels open to both blocs and use those relationships to improve India’s bargaining position."
 COLDWAR_RAJ_1970_foreign_tilt:0 "Deepen the Moscow Partnership"
 COLDWAR_RAJ_1970_foreign_tilt_desc:0 "Concentrate defence liaison and planning work on the Soviet relationship. Keeping those technical missions staffed diverts resources from civilian priorities."
 COLDWAR_RAJ_1970_foreign_offer_egypt_nonalign:0 "Consult Non-Aligned Egypt"
 COLDWAR_RAJ_1970_foreign_offer_egypt_nonalign_desc:0 "Non-aligned coordination does not force a faction or war."
 COLDWAR_RAJ_1970_foreign_offer_saudi_oil:0 "Saudi Oil and Worker Contacts"
 COLDWAR_RAJ_1970_foreign_offer_saudi_oil_desc:0 "Open talks on Saudi energy supplies and conditions for Indian workers in the Gulf."
 COLDWAR_RAJ_1970_foreign_offer_iran_energy:0 "Iranian Energy Cooperation"
 COLDWAR_RAJ_1970_foreign_offer_iran_energy_desc:0 "Any post-revolution Iranian government retains full discretion."
 COLDWAR_RAJ_1970_foreign_revision_qatar_labour:0 "A Qatar Labour Agreement"
 COLDWAR_RAJ_1970_foreign_revision_qatar_labour_desc:0 "The recipient may accept labour protections and administrative cooperation; no automatic population movement or revenue is created."
 COLDWAR_RAJ_1970_foreign_nam_review:0 "Defend Strategic Autonomy"
 COLDWAR_RAJ_1970_foreign_nam_review_desc:0 "Give the foreign service the staff and authority to represent India independently in international disputes."
 COLDWAR_RAJ_1970_foreign_revision_nam_summit:0 "Invite Egypt to the Delhi Summit"
 COLDWAR_RAJ_1970_foreign_revision_nam_summit_desc:0 "A distinct 180-day summit spirit, inspired by the 1983 New Delhi NAM summit. Only Egypt receives this decision; no other country is forced to attend or gains a spirit automatically."
 COLDWAR_RAJ_1970_foreign_energy_security:0 "Diversify Fuel Supply"
 COLDWAR_RAJ_1970_foreign_energy_security_desc:0 "Invest in fuel storage and dispatch so that power stations can make better use of imported fuel. Maintaining the reserve ties up civilian resources."
 COLDWAR_RAJ_1970_pakistan_war_question:0 "The 1971 Indo-Pakistani War"
 COLDWAR_RAJ_1970_pakistan_war_question_desc:0 "The crisis in East Pakistan puts pressure on New Delhi. Prepare for relief and diplomacy while Parliament considers India’s response."
 COLDWAR_RAJ_1970_pakistan_war_refugees:0 "Receive the East Bengali Refugees"
 COLDWAR_RAJ_1970_pakistan_war_refugees_desc:0 "Organise reception camps and public health services as people cross the eastern frontier. The temporary relief administration remains in place during the crisis."
 COLDWAR_RAJ_1970_pakistan_war_political:0 "Talk to the Bengali Leadership"
 COLDWAR_RAJ_1970_pakistan_war_political_desc:0 "Consult Bengali representatives and seek talks with the parties able to negotiate. Diplomacy ties up cabinet time while the emergency lasts."
 COLDWAR_RAJ_1970_pakistan_war_border:0 "Mobilise the Eastern Command"
 COLDWAR_RAJ_1970_pakistan_war_border_desc:0 "Bring the border formations to readiness. Sustaining that deployment will increase supply demand for the duration of the crisis."
 COLDWAR_RAJ_1970_pakistan_war_mediation:0 "Seek International Mediation"
 COLDWAR_RAJ_1970_pakistan_war_mediation_desc:0 "Use diplomatic channels to discuss the crisis. Each government can decide whether to participate in the talks."
 COLDWAR_RAJ_1970_pakistan_war_actual_war:0 "Authorise Intervention"
 COLDWAR_RAJ_1970_pakistan_war_actual_war_desc:0 "Parliament authorises intervention against Pakistan. India decides when to declare war and what terms to seek."
 COLDWAR_RAJ_1970_pakistan_war_east:0 "Concentrate on the Eastern Front"
 COLDWAR_RAJ_1970_pakistan_war_east_desc:0 "Concentrate available formations in the east. The higher tempo places additional demands on the supply services during this war."
 COLDWAR_RAJ_1970_pakistan_war_west:0 "Hold the Western Frontier"
 COLDWAR_RAJ_1970_pakistan_war_west_desc:0 "Prepare the western commands for a defensive campaign and protect their lines of supply. The defensive posture slows additional planning."
 COLDWAR_RAJ_1970_pakistan_war_conquest:0 "Plan for a Decisive Victory"
 COLDWAR_RAJ_1970_pakistan_war_conquest_desc:0 "Prepare for sustained operations in the west. The outcome will depend on the fighting and the actual peace settlement."
 COLDWAR_RAJ_1970_pakistan_war_assess:0 "Review the 1971 Settlement"
 COLDWAR_RAJ_1970_pakistan_war_assess_desc:0 "Review how the war ended and the terms agreed at peace. Parliament must decide how India will handle the aftermath."
 COLDWAR_RAJ_1970_pakistan_war_defeat:0 "Defeat in the 1971 War"
 COLDWAR_RAJ_1970_pakistan_war_defeat_desc:0 "Accept the result of the peace talks and organise relief for the communities affected by the defeat."
 COLDWAR_RAJ_1970_pakistan_war_stalemate:0 "Partial Victory"
 COLDWAR_RAJ_1970_pakistan_war_stalemate_desc:0 "A limited peace calls for frontier reconstruction. If the settlement created an independent Bangladesh while leaving Pakistan’s western borders in place, India can recognise it and pursue talks at Simla."
 COLDWAR_RAJ_1970_pakistan_war_victory:0 "Total Victory"
 COLDWAR_RAJ_1970_pakistan_war_victory_desc:0 "The peace terms determine which questions remain for India to address in Pakistan and Bangladesh."
 COLDWAR_RAJ_1970_pakistan_war_loss_relief:0 "Relief for Displaced Families"
 COLDWAR_RAJ_1970_pakistan_war_loss_relief_desc:0 "Finance housing and relief for families uprooted by the fighting."
 COLDWAR_RAJ_1970_pakistan_war_historical_east:0 "Recognise Independent Bangladesh"
 COLDWAR_RAJ_1970_pakistan_war_historical_east_desc:0 "Recognise the sovereign republic that emerged from the eastern campaign and open talks on the western frontier."
 COLDWAR_RAJ_1970_pakistan_war_ceasefire_offer:0 "Post-Armistice Channels"
 COLDWAR_RAJ_1970_pakistan_war_ceasefire_offer_desc:0 "Restore routine military and diplomatic contacts after a limited armistice. Both governments decide whether to continue the arrangement."
 COLDWAR_RAJ_1970_pakistan_war_stalemate_recovery:0 "Rebuild the Frontier Districts"
 COLDWAR_RAJ_1970_pakistan_war_stalemate_recovery_desc:0 "Repair communications and roads damaged during the fighting in Indian frontier districts."
 COLDWAR_RAJ_1970_pakistan_occupation_authority:0 "The Pakistan Question"
 COLDWAR_RAJ_1970_pakistan_occupation_authority_desc:0 "Review the western terms and choose the administration appropriate to the districts and governments left by the peace."
 COLDWAR_RAJ_1970_bangladesh_settlement_future:0 "The Bangladesh Question"
 COLDWAR_RAJ_1970_bangladesh_settlement_future_desc:0 "Review the status of Bengal after the peace. The administration and diplomacy available to India depend on the new borders and government."
 COLDWAR_RAJ_1970_pakistan_war_loss_reform:0 "Reform the Frontier Commands"
 COLDWAR_RAJ_1970_pakistan_war_loss_reform_desc:0 "Apply the lessons of the defeat to command, training and supply. Repair frontier roads where the state remains in Indian hands."
 COLDWAR_RAJ_1970_offer_pak:0 "The Simla Agreement"
 COLDWAR_RAJ_1970_offer_pak_desc:0 "Seek a bilateral agreement on withdrawal and the Line of Control. Bangladesh remains independent and the agreement does not transfer any western territory."
 COLDWAR_RAJ_1970_pakistan_occupation_annexed:0 "Administer the Annexed Districts"
 COLDWAR_RAJ_1970_pakistan_occupation_annexed_desc:0 "Organise repairs and public services in the western districts acquired at peace. These districts need their own administration even if a Pakistani subject governs other territory."
 COLDWAR_RAJ_1970_pakistan_occupation_claims:0 "Organise the Pakistani Administration"
 COLDWAR_RAJ_1970_pakistan_occupation_claims_desc:0 "Prepare a provisional administration for the Pakistani government established by the peace settlement."
 COLDWAR_RAJ_1970_pakistan_war_western_terms:0 "Open Western Frontier Talks"
 COLDWAR_RAJ_1970_pakistan_war_western_terms_desc:0 "Offer frontier talks to a sovereign Pakistan. The Pakistani government decides whether to sign an accord."
 COLDWAR_RAJ_1970_pakistan_war_victory_relief:0 "Relief and Repatriation"
 COLDWAR_RAJ_1970_pakistan_war_victory_relief_desc:0 "Organise repatriation and humanitarian relief after the campaign. International arrangements remain subject to the governments involved."
 COLDWAR_RAJ_1970_bangladesh_settlement_independent:0 "A Sovereign Bangladesh"
 COLDWAR_RAJ_1970_bangladesh_settlement_independent_desc:0 "Propose a friendship treaty to the sovereign government of Bangladesh."
 COLDWAR_RAJ_1970_bangladesh_settlement_annex:0 "Administer Indian-Held Bengal"
 COLDWAR_RAJ_1970_bangladesh_settlement_annex_desc:0 "Establish a civil administration in the Bengali districts acquired at peace. Public works and local services require civilian resources."
 COLDWAR_RAJ_1970_bangladesh_settlement_protect:0 "A Bengali Protectorate"
 COLDWAR_RAJ_1970_bangladesh_settlement_protect_desc:0 "Establish a protectorate administration for the Bangladeshi subject created at peace."
 COLDWAR_RAJ_1970_bangladesh_settlement_integrate:0 "Begin the Integration Programme"
 COLDWAR_RAJ_1970_bangladesh_settlement_integrate_desc:0 "Appoint a commissioner to administer the existing Bangladeshi subject. The centralisation programme incurs political and economic costs in both countries."
 COLDWAR_RAJ_1970_pakistan_occupation_civil:0 "A Pakistani Civil Administration"
 COLDWAR_RAJ_1970_pakistan_occupation_civil_desc:0 "Establish a Pakistani civil administration under Indian oversight. The chair is chosen from the existing occupation roster."
 COLDWAR_RAJ_1970_pakistan_occupation_military:0 "An Indian Military Administration"
 COLDWAR_RAJ_1970_pakistan_occupation_military_desc:0 "Install a military government under Indian oversight. The governor is selected from the available Indian officers."
 COLDWAR_RAJ_1970_bangladesh_settlement_treaty:0 "Friendship and Reconstruction"
 COLDWAR_RAJ_1970_bangladesh_settlement_treaty_desc:0 "Prepare a reconstruction programme in India. Its benefits apply while the accepted friendship agreement with Bangladesh remains in force."
 COLDWAR_RAJ_1970_bangladesh_settlement_annex_cost:0 "Bengali Reconstruction Works"
 COLDWAR_RAJ_1970_bangladesh_settlement_annex_cost_desc:0 "Consolidate reconstruction and reduce the cost of civil administration in Indian-held Bengal."
 COLDWAR_RAJ_1970_bangladesh_settlement_protectorate_cost:0 "Fund Protectorate Reconstruction"
 COLDWAR_RAJ_1970_bangladesh_settlement_protectorate_cost_desc:0 "Commit civilian resources in both countries to rebuild infrastructure and restore public services in the protectorate."
 COLDWAR_RAJ_1970_bangladesh_settlement_integration_year_1:0 "Organise District Offices"
 COLDWAR_RAJ_1970_bangladesh_settlement_integration_year_1_desc:0 "Staff the district offices and give the commissioner the means to coordinate local services."
 COLDWAR_RAJ_1970_pakistan_occupation_council:0 "Convene a Local Council"
 COLDWAR_RAJ_1970_pakistan_occupation_council_desc:0 "A consultative arrangement does not automatically give independence or remove the occupation burden."
 COLDWAR_RAJ_1970_pakistan_occupation_military_staff:0 "Staff the Military Governorate"
 COLDWAR_RAJ_1970_pakistan_occupation_military_staff_desc:0 "Additional control has a continuing local and Indian cost."
 COLDWAR_RAJ_1970_bangladesh_settlement_integration_year_2:0 "Train the Bengali Security Service"
 COLDWAR_RAJ_1970_bangladesh_settlement_integration_year_2_desc:0 "Train a local security service to administer the settlement."
 COLDWAR_RAJ_1970_pakistan_occupation_civic_elections:0 "Supervised Local Elections"
 COLDWAR_RAJ_1970_pakistan_occupation_civic_elections_desc:0 "Local consultation does not automatically transfer sovereignty."
 COLDWAR_RAJ_1970_pakistan_occupation_central_rule:0 "Rule Through Appointed Officials"
 COLDWAR_RAJ_1970_pakistan_occupation_central_rule_desc:0 "Centralised administration is more direct and less locally legitimate."
 COLDWAR_RAJ_1970_pakistan_occupation_garrisons:0 "Permanent Garrison Network"
 COLDWAR_RAJ_1970_pakistan_occupation_garrisons_desc:0 "Operational readiness is purchased with a persistent financial and political burden."
 COLDWAR_RAJ_1970_pakistan_occupation_training:0 "Train a Local Security Service"
 COLDWAR_RAJ_1970_pakistan_occupation_training_desc:0 "Local support may reduce pressure on Indian supplies, but does not erase resistance or financial costs."
 COLDWAR_RAJ_1970_bangladesh_settlement_integration_year_3:0 "Restore Bengali Municipal Services"
 COLDWAR_RAJ_1970_bangladesh_settlement_integration_year_3_desc:0 "Restore essential municipal services to improve confidence in the administration."
 COLDWAR_RAJ_1970_pakistan_occupation_civil_review:0 "Review Civil Administration"
 COLDWAR_RAJ_1970_pakistan_occupation_civil_review_desc:0 "India gains 2 percentage points of stability when the civil administration is eligible."
 COLDWAR_RAJ_1970_pakistan_occupation_mil_review:0 "Review Military Administration"
 COLDWAR_RAJ_1970_pakistan_occupation_mil_review_desc:0 "India gains 20 army experience when the military administration is eligible."
 COLDWAR_RAJ_1970_bangladesh_settlement_integration_year_4:0 "Rebuild District Infrastructure"
 COLDWAR_RAJ_1970_bangladesh_settlement_integration_year_4_desc:0 "Create a public works programme and improve the engineering capacity of the district offices."
 COLDWAR_RAJ_1970_pakistan_occupation_future:0 "The Future of Pakistan"
 COLDWAR_RAJ_1970_pakistan_occupation_future_desc:0 "Review the western administration after the first phase of civil or military rule."
 COLDWAR_RAJ_1970_bangladesh_settlement_integration_year_5:0 "Conclude the Integration Programme"
 COLDWAR_RAJ_1970_bangladesh_settlement_integration_year_5_desc:0 "Complete the commission’s work and return routine administration to the established institutions of the subject government."
 COLDWAR_RAJ_1970_inc_governing_tt:0 "The Indian National Congress (R) is the governing party"
 COLDWAR_RAJ_1970_janata_dal_governing_tt:0 "Congress (O), Janata, or Swatantra is the governing party"
 COLDWAR_RAJ_1970_bjp_governing_tt:0 "The Jana Sangh or its successor BJP is the governing party"
 COLDWAR_RAJ_1970_cpim_governing_tt:0 "The CPI or CPI(M) is the governing party"
 COLDWAR_RAJ_1970_tdp_governing_tt:0 "BSP or the party in the Dravidian regional slot leads the government"
 COLDWAR_RAJ_1970_shiv_sena_governing_tt:0 "Shiv Sena or the Hindu Mahasabha leads the government"
