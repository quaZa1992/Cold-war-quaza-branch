# IMPERIA COLD WAR — India and South Asian agreements focus programmes
 COLDWAR_RAJ_1970_inc_aggregate_mandate:0 "Congress Governing Mandate"
 COLDWAR_RAJ_1970_janata_dal_aggregate_mandate:0 "Democratic Opposition Governing Mandate"
 COLDWAR_RAJ_1970_bjp_aggregate_mandate:0 "Jana Sangh Governing Mandate"
 COLDWAR_RAJ_1970_cpim_aggregate_mandate:0 "Parliamentary Left Governing Mandate"
 COLDWAR_RAJ_1970_tdp_aggregate_mandate:0 "Federal Coalition Governing Mandate"
 COLDWAR_RAJ_1970_shiv_sena_aggregate_mandate:0 "Radical Nationalist Governing Mandate"
 COLDWAR_RAJ_1970_jana_sangh_party_name:0 "£RAJ_Neutral_conservatism (BJS) - Bharatiya Jana Sangh"
 COLDWAR_RAJ_1970_jana_sangh_party_desc:0 "Founded in 1951, the Bharatiya Jana Sangh represents a Hindu nationalist current in Indian politics. It opposes Congress and maintains close organisational ties to the Rashtriya Swayamsevak Sangh."
 COLDWAR_RAJ_1970_bjp_party_name:0 "£RAJ_conservatism (BJP) - Bharatiya Janata Party"
 COLDWAR_RAJ_1970_bjp_party_desc:0 "(Hindu Nationalism) - Indian People's Party (Hindi: Bharatiya Janata Party, BJP)\n\nThe Bharatiya Janata Party was founded in 1980 by former members of the Bharatiya Jana Sangh after the collapse of the Janata coalition, and draws its cadre from the Rashtriya Swayamsevak Sangh. It rose on the Ram Janmabhoomi campaign of the early 1990s, and Atal Bihari Vajpayee led National Democratic Alliance governments from 1998 to 2004, ordering the Pokhran nuclear tests within weeks of taking office. It joins Hindutva cultural nationalism to pro-business economics, a hard line on Kashmir and Pakistan, and closer defence ties with the United States and Israel."
 COLDWAR_RAJ_1970_congress_o_name:0 "£RAJ_Western_Autocracy (INC-O) - Indian National Congress (Organisation)"
 COLDWAR_RAJ_1970_congress_o_icon:0 "£RAJ_Western_Autocracy"
 COLDWAR_RAJ_1970_congress_o_desc:0 "The Congress split of 1969 left the Organisation group in opposition to Indira Gandhi. Its leadership includes Morarji Desai and other Congress veterans."
 COLDWAR_RAJ_1970_congress_r_name:0 "£RAJ_socialism (INC-R) - Indian National Congress (Requisitionists)"
 COLDWAR_RAJ_1970_congress_r_icon:0 "£RAJ_socialism"
 COLDWAR_RAJ_1970_congress_r_desc:0 "Indira Gandhi leads the Congress group that emerged from the 1969 party split, combining a commitment to parliamentary democracy, public-sector development and a programme of social reform."
 COLDWAR_RAJ_1970_swatantra_name:0 "£RAJ_non_aligned_libertarian (SWA) - Swatantra Party"
 COLDWAR_RAJ_1970_swatantra_icon:0 "£RAJ_non_aligned_libertarian"
 COLDWAR_RAJ_1970_swatantra_desc:0 "Founded in 1959, Swatantra opposes central economic planning and favours a freer market, property rights and limits on state intervention."
 COLDWAR_RAJ_1970_dmk_name:0 "£RAJ_neutral_Social (DMK) - Dravida Munnetra Kazhagam"
 COLDWAR_RAJ_1970_dmk_icon:0 "£RAJ_neutral_Social"
 COLDWAR_RAJ_1970_dmk_desc:0 "The DMK is a Tamil regional party advocating state autonomy, social justice and the protection of Tamil language and culture."
 COLDWAR_RAJ_1970_cpi_name:0 "£RAJ_Communist_State (CPI) - Communist Party of India"
 COLDWAR_RAJ_1970_cpi_icon:0 "£RAJ_Communist_State"
 COLDWAR_RAJ_1970_cpi_desc:0 "The CPI is an established communist party advocating land reform, a larger public sector and close relations with the Soviet Union. It is distinct from the CPI (Marxist)."
 COLDWAR_RAJ_1970_janata_name:0 "£RAJ_Western_Autocracy (JP) - Janata Party"
 COLDWAR_RAJ_1970_janata_icon:0 "£RAJ_Western_Autocracy"
 COLDWAR_RAJ_1970_janata_desc:0 "The Janata Party unites opposition currents against Congress within a shared parliamentary programme."
 COLDWAR_RAJ_1970_aiadmk_name:0 "£RAJ_neutral_Social (AIADMK) - All India Anna Dravida Munnetra Kazhagam"
 COLDWAR_RAJ_1970_aiadmk_icon:0 "£RAJ_neutral_Social"
 COLDWAR_RAJ_1970_aiadmk_desc:0 "A Dravidian regional successor movement combining Tamil identity with a populist welfare programme."
 COLDWAR_RAJ_1970_janata_modern_name:0 "£RAJ_Western_Autocracy (JD) - Janata Dal"
 COLDWAR_RAJ_1970_janata_modern_icon:0 "£RAJ_Western_Autocracy"
 COLDWAR_RAJ_1970_janata_modern_desc:0 "(Socialist Populism) - Janata Dal (Hindi: Janata Dal, JD)\n\nJanata Dal was formed in 1988 from the merger of the Jan Morcha, the Janata Party, the Lok Dal and Congress (S) as a common opposition front against Rajiv Gandhi. Under V. P. Singh it led the National Front government from 1989 to 1990 and implemented the Mandal Commission recommendations reserving central government posts for the Other Backward Classes. Its programme joined Lohiaite socialism to an anti-corruption campaign built on the Bofors scandal. Successive splits produced the Janata Dal (United), the Janata Dal (Secular), the Rashtriya Janata Dal and the Biju Janata Dal, leaving the parent organisation a marginal force."
 COLDWAR_RAJ_1970_congress_modern_name:0 "£RAJ_socialism (INC) - Indian National Congress"
 COLDWAR_RAJ_1970_congress_modern_icon:0 "£RAJ_socialism"
 COLDWAR_RAJ_1970_congress_modern_desc:0 "(Social Democracy) - Indian National Congress (Hindi: Bharatiya Rashtriya Congress, INC)\n\nFounded in 1885, the Indian National Congress led the campaign for independence under Gandhi and Nehru and governed India for most of the period after 1947. It pairs secularism and social welfare with the market reforms opened by Narasimha Rao and Manmohan Singh in 1991. Led by the Nehru-Gandhi family for much of its modern history, it returned to office in 2004 at the head of the United Progressive Alliance and passed the rural employment guarantee and the right to information act. In foreign policy it favours non-alignment, long-standing ties with Moscow and steady engagement with Washington."
 COLDWAR_RAJ_1970_swatantra_modern_name:0 "£RAJ_non_aligned_libertarian (SWA) - Swatantra Party"
 COLDWAR_RAJ_1970_swatantra_modern_icon:0 "£RAJ_non_aligned_libertarian"
 COLDWAR_RAJ_1970_swatantra_modern_desc:0 "(Classical Liberalism) - Swatantra Party (Hindi: Swatantra Party, SWA)\n\nC. Rajagopalachari founded the Swatantra Party in 1959 against Nehru's planned economy, cooperative farming and land ceilings. It drew support from princes, landowners and business, became the largest opposition party in the Lok Sabha in 1967, and dissolved in 1974 once its leadership scattered. Free-market campaigners have periodically revived the name to argue for deregulation, lower taxation and a state confined to defence, law and infrastructure."
 COLDWAR_RAJ_1970_regional_modern_name:0 "£RAJ_neutral_Social (SP) - Samajwadi Party"
 COLDWAR_RAJ_1970_regional_modern_icon:0 "£RAJ_neutral_Social"
 COLDWAR_RAJ_1970_regional_modern_desc:0 "(Democratic Socialism) - Samajwadi Party (Hindi: Samajwadi Party, SP)\n\nMulayam Singh Yadav founded the Samajwadi Party in 1992 out of the wreckage of the Janata Dal, carrying forward the Lohiaite socialism of the northern backward-caste movement. Its Uttar Pradesh base rests on an alliance of Yadav cultivators and Muslim voters, and it has formed state governments under Mulayam and later his son Akhilesh. It campaigns for caste reservation, farm support prices and resistance to Hindu nationalist mobilisation. In the south the All India Anna Dravida Munnetra Kazhagam fills a comparable role, joining Dravidian regionalism to welfare populism."
 COLDWAR_RAJ_1970_cpi_modern_name:0 "£RAJ_Communist_State (CPI) - Communist Party of India"
 COLDWAR_RAJ_1970_cpi_modern_icon:0 "£RAJ_Communist_State"
 COLDWAR_RAJ_1970_cpi_modern_desc:0 "(Marxism-Leninism) - Communist Party of India (Hindi: Bharat ki Communist Party, CPI)\n\nFounded at Kanpur in 1925, the Communist Party of India was the country's first communist organisation and lost most of its cadre in the 1964 split over relations with Congress and with Moscow. It remained the more accommodating of the two communist parties, supporting Indira Gandhi through the Emergency before rejoining the Left Front. Its surviving strength lies in Kerala, Tamil Nadu, Bihar and Telangana, where it contests as a junior partner in left alliances. It calls for land reform, nationalised industry and a foreign policy hostile to American influence."
 COLDWAR_RAJ_1970_jana_sangh_icon:0 "£RAJ_Neutral_conservatism"
