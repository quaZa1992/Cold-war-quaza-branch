l_english:
# IMPERIA COLD WAR — Cuba 1970: history_l_english.
 COLDWAR_CUB_history.11.t:0 "The Ten Million-Ton Target"
 COLDWAR_CUB_history.11.d:0 "On 19 May, Fidel Castro publicly acknowledged that the ten-million-ton target would not be met. The campaign continues toward the 26 July review. How should the leadership frame the final weeks of the effort?"
 COLDWAR_CUB_history.11.a:0 "Continue the appeal through the final cut"
 COLDWAR_CUB_history.11.b:0 "Prepare to return workers to other sectors"
 COLDWAR_CUB_history.1.t:0 "The Ten Million-Ton Harvest"
 COLDWAR_CUB_history.1.d:0 "The 1970 harvest reached about 8.54 million metric tons: a record, but short of the target. Its demands on labour and transport left a wider economic cost. The government must now choose how to balance the final campaign with returning work to other sectors."
 COLDWAR_CUB_history.1.a:0 "Concentrate through the final cut"
 COLDWAR_CUB_history.1.b:0 "Return labour to the wider economy"
 COLDWAR_CUB_history.2.t:0 "A Gift on the Map"
 COLDWAR_CUB_history.2.d:0 "During Fidel Castro's June 1972 visit to the German Democratic Republic, he presented Erich Honecker with a Cuban map bearing the name Isla Ernesto Thälmann for Cayo Blanco del Sur. An August ceremony publicised the gesture as a transfer of sovereignty, but it did not create a recognised territorial cession. This optional commemoration has no territorial or economic effect."
 COLDWAR_CUB_history.2.a:0 "Publish the map and stage a symbolic ceremony"
 COLDWAR_CUB_history.2.b:0 "Keep the gesture diplomatic and informal"
 COLDWAR_CUB_history.3.t:0 "The Request from Luanda"
 COLDWAR_CUB_history.3.d:0 "The struggle over Angolan independence has become an international confrontation. Havana must weigh solidarity with the MPLA against the transport, training and military costs of a distant commitment. An Angolan cooperation agreement can be negotiated through our foreign policy programme."
 COLDWAR_CUB_history.3.a:0 "Offer an expeditionary force"
 COLDWAR_CUB_history.3.b:0 "Offer advisers and medical teams"
 COLDWAR_CUB_history.4.t:0 "Limited Contact with Washington"
 COLDWAR_CUB_history.4.d:0 "Havana and Washington are considering direct representation through interests sections. A permanent channel could make difficult negotiations possible without settling the disputes that divide the two governments. Our foreign policy programme determines the terms offered to Washington."
 COLDWAR_CUB_history.4.a:0 "Propose reciprocal Interests Sections"
 COLDWAR_CUB_history.4.b:0 "Defer the arrangement"
 COLDWAR_CUB_history.5.t:0 "The Ogaden War"
 COLDWAR_CUB_history.5.d:0 "The conflict in the Horn of Africa has drawn competing regional and foreign commitments into Ethiopia. A Cuban advisory mission would require an independent Ethiopian government to accept our terms and Cuba to sustain the cost of overseas service."
 COLDWAR_CUB_history.5.a:0 "Offer a combat force"
 COLDWAR_CUB_history.5.b:0 "Offer advisers and medical support"
 COLDWAR_CUB_history.5.c:0 "Decline a new deployment"
 COLDWAR_CUB_history.6.t:0 "Dialogue with Cubans Abroad"
 COLDWAR_CUB_history.6.d:0 "On 8 December 1978, government representatives and members of Cuban communities abroad signed an agreement on prisoners, family reunification and visits. The government announced pardons for 3,000 prisoners convicted in state-security or national-integrity cases and 600 convicted under emigration provisions. The settlement did not introduce a multiparty system or end restrictions on political activity. Any actual return or departure must follow registered migration arrangements."
 COLDWAR_CUB_history.6.a:0 "Implement the humanitarian agreement"
 COLDWAR_CUB_history.6.b:0 "Keep the dialogue narrowly defined"
 COLDWAR_CUB_history.7.t:0 "The Havana Non-Aligned Summit"
 COLDWAR_CUB_history.7.d:0 "Havana is hosting the Non-Aligned Movement's sixth summit. Cuba was among the Movement's founders in 1961; the conference tests its ability to chair a diverse group while preserving room for independent diplomacy."
 COLDWAR_CUB_history.7.a:0 "Build a broad conference around common interests"
 COLDWAR_CUB_history.7.b:0 "Press a forceful anti-imperialist platform"
 COLDWAR_CUB_history.8.t:0 "The Mariel Exodus"
 COLDWAR_CUB_history.8.d:0 "After an asylum crisis at the Peruvian embassy, Fidel Castro announced on 20 April that departures could proceed through the port of Mariel. The opening brought a large and politically charged exodus. Opening an organised route requires United States consent; a narrower policy can restrict departures to cases negotiated by both governments. Actual migration remains recorded separately."
 COLDWAR_CUB_history.8.a:0 "Propose an organised departure through Mariel"
 COLDWAR_CUB_history.8.b:0 "Restrict departures to negotiated cases"
 COLDWAR_CUB_history.9.t:0 "Rectification of Errors and Negative Tendencies"
 COLDWAR_CUB_history.9.d:0 "At the Third Congress of the Communist Party of Cuba, the leadership is reviewing the economic course. Rectification challenged parts of the Soviet-inspired management system and material incentives; defenders of the System of Direction and Planning of the Economy argued that enterprise accounting should continue. This is an internal policy choice under one-party rule."
 COLDWAR_CUB_history.9.a:0 "Reaffirm the rectification programme"
 COLDWAR_CUB_history.9.b:0 "Defend enterprise accounting"
 COLDWAR_CUB_history.9.c:0 "Refer unresolved questions to the economic commission"
 COLDWAR_CUB_history.10.t:0 "A Contraction in Soviet Trade and Supply"
 COLDWAR_CUB_history.10.d:0 "Soviet deliveries and trade support have materially contracted. The government must protect essential food, health and transport services or seek emergency trade while rescheduling imports. The scale of the shortage depends on actual supply conditions; hardship and political outcomes are not predetermined."
 COLDWAR_CUB_history.10.a:0 "Protect food, health and essential transport"
 COLDWAR_CUB_history.10.b:0 "Seek emergency trade and reschedule imports"
 COLDWAR_CUB_history.12.t:0 "A Proposal for Reciprocal Interests Sections"
 COLDWAR_CUB_history.12.d:0 "Havana has proposed a limited diplomatic arrangement. Accepting opens reciprocal Interests Sections, not full normalization; both governments pay the agreed administrative cost, and the statutory embargo remains in force."
 COLDWAR_CUB_history.12.a:0 "Accept the reciprocal arrangement"
 COLDWAR_CUB_history.12.b:0 "Decline the proposal"
 COLDWAR_CUB_history.13.t:0 "A Proposal to Open Mariel"
 COLDWAR_CUB_history.13.d:0 "The Cuban government proposes an organised departure through Mariel during a verified crisis. Acceptance permits the route to open; it does not determine or pre-record the number of people who migrate."
 COLDWAR_CUB_history.13.a:0 "Accept the departure arrangement"
 COLDWAR_CUB_history.13.b:0 "Decline the proposal"
 COLDWAR_CUB_history.8.a.tt:0 "This opens a 90-day proposal only. The route opens only with United States acceptance; migration is not recorded by this choice."
 COLDWAR_CUB_history.1.a.tt:0 "Agricultural productivity +8% and construction speed -5% for 180 days; stability +2 percentage points."
 COLDWAR_CUB_history.1.b.tt:0 "Civilian industry productivity +5% and agricultural productivity -3% for 180 days; stability -2 percentage points."
 COLDWAR_CUB_history.3.a.tt:0 "If Angola accepts: foreign influence +8%, weekly army personnel expenditure +8%, civilian industry productivity -3%, and stability -2 percentage points while the mission remains active."
 COLDWAR_CUB_history.3.b.tt:0 "If Angola accepts: foreign influence +4% and weekly army personnel expenditure +3% while the mission remains active; stability +1 percentage point on acceptance."
 COLDWAR_CUB_history.5.a.tt:0 "If Ethiopia accepts: foreign influence +8%, weekly army personnel expenditure +7%, and civilian industry productivity -3% while the mission remains active; stability -2 percentage points on acceptance."
 COLDWAR_CUB_history.5.b.tt:0 "If Ethiopia accepts: foreign influence +4% and weekly army personnel expenditure +2% while the mission remains active; stability +1 percentage point on acceptance."
 COLDWAR_CUB_history.5.c.tt:0 "Foreign influence -2% and weekly army personnel expenditure -1%."
 COLDWAR_CUB_history.6.a.tt:0 "Stability +3 percentage points; foreign influence defence -2%. The agreement does not itself record migration."
 COLDWAR_CUB_history.6.b.tt:0 "Stability +1 percentage point; foreign influence defence +1%."
 COLDWAR_CUB_history.7.a.tt:0 "Foreign influence +6% and weekly bureaucracy expenditure +2% for 365 days; stability +2 percentage points."
 COLDWAR_CUB_history.7.b.tt:0 "Foreign influence +10% and foreign influence defence -3% for 365 days; Soviet opinion +5."
 COLDWAR_CUB_history.8.b.tt:0 "Stability -2 percentage points; foreign influence defence +1% for 180 days. No migration is recorded by this choice."
 COLDWAR_CUB_history.10.a.tt:0 "For 365 days: agricultural productivity +4%, weekly education and healthcare expenditure +5%, and construction speed -8%; stability -3 percentage points."
 COLDWAR_CUB_history.10.b.tt:0 "For 365 days: foreign influence +4%, resource export revenue +5%, and foreign influence defence -4%; stability -1 percentage point."
 COLDWAR_CUB_history.13.a.tt:0 "Cuban stability -5 percentage points; foreign influence defence -3% for 180 days. This agreement does not pre-record migration."
 COLDWAR_CUB_hist_zafra_mobilise_180:0 "Final Harvest Mobilisation"
 COLDWAR_CUB_hist_zafra_mobilise_180_desc:0 "The final campaign sustains agricultural output but diverts capacity from construction."
 COLDWAR_CUB_hist_zafra_rebalance_180:0 "Labour Returned to Other Sectors"
 COLDWAR_CUB_hist_zafra_rebalance_180_desc:0 "Returning labour supports civilian production at the cost of agricultural output."
 COLDWAR_CUB_hist_angola_force_active:0 "Angola Expeditionary Commitment"
 COLDWAR_CUB_hist_angola_force_active_desc:0 "The accepted deployment increases Cuba's international reach and recurring military and industrial burdens."
 COLDWAR_CUB_hist_angola_advisers_active:0 "Angola Advisory Mission"
 COLDWAR_CUB_hist_angola_advisers_active_desc:0 "An accepted advisory and medical mission carries a smaller personnel burden."
 COLDWAR_CUB_hist_ethiopia_force_active:0 "Ethiopian Expeditionary Commitment"
 COLDWAR_CUB_hist_ethiopia_force_active_desc:0 "The accepted deployment increases Cuba's international reach and recurring military and industrial burdens."
 COLDWAR_CUB_hist_ethiopia_advisers_active:0 "Ethiopian Advisory Mission"
 COLDWAR_CUB_hist_ethiopia_advisers_active_desc:0 "An accepted advisory mission carries a smaller personnel burden."
 COLDWAR_CUB_hist_ethiopia_decline:0 "No New Deployment to Ethiopia"
 COLDWAR_CUB_hist_ethiopia_decline_desc:0 "Declining a new commitment reduces military expenditure while limiting Cuban influence."
