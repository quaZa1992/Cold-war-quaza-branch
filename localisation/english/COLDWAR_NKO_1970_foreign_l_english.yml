# IMPERIA CW — Cold War: North Korea 1970 bilateral agreements.
 COLDWAR_NKO_1970_foreign:0 "Bilateral Agreements"
 COLDWAR_NKO_1970_foreign_desc:0 "Negotiate reciprocal programmes with the Democratic People’s Republic of Korea. Each proposal requires the other government’s consent."
 COLDWAR_NKO_foreign_offer_conditions:0 "The partner country must exist. The recipient decides whether to accept within 90 days."
 COLDWAR_NKO_foreign_accept_conditions:0 "Both countries must exist and be at peace, with no bilateral diplomatic, financial, economic or military sanctions in either direction."
 COLDWAR_NKO_foreign_no_cost_on_decline:0 "Decline without charge. A new submission remains subject to the 180-day interval."
 COLDWAR_NKO_foreign_resubmit_desc:0 "Submit a fresh 90-day proposal using current GDP quotes. No payment is made until the recipient accepts."
 COLDWAR_NKO_foreign_resubmit_title:0 "Renew the proposal"
 COLDWAR_NKO_foreign_resubmit_sent:0 "The proposal has been resubmitted for 90 days."
 COLDWAR_NKO_foreign_invalidated:0 "The proposal is no longer available. No payment was made; the sender may submit it again."
 COLDWAR_NKO_foreign_partner_requirement:0 "The other government must exist and remain at peace with the DPRK without bilateral sanctions."
 COLDWAR_NKO_foreign_ready_tt:0 "The proposal is open, both countries are at peace and no bilateral sanctions are in force."
 COLDWAR_NKO_foreign_ready_tt_NOT:0 "A valid open proposal, peaceful relations and the absence of bilateral sanctions are required."
 COLDWAR_NKO_foreign_resend_ready_tt:0 "Both countries can reopen this proposal under the current diplomatic conditions."
 COLDWAR_NKO_foreign_resend_ready_tt_NOT:0 "The proposal cannot currently be reopened."
 COLDWAR_NKO_foreign_cooldown_tt:0 "At least §Y180 days§! have passed since the previous proposal."
 COLDWAR_NKO_foreign_cooldown_tt_NOT:0 "A new proposal must wait §Y180 days§! after the previous submission."
 COLDWAR_NKO_foreign_if_accepted_tt:0 "§YUpon acceptance:§!"
 COLDWAR_NKO_foreign_weekly_commitment_tt:0 "Weekly commitment: §R$[?COLDWAR_NKO_foreign_weekly_preview|3] billion§!."
