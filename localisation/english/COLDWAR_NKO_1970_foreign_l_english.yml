 COLDWAR_NKO_foreign_accept_soviet_fuel_contract_base_desc:0 "Negotiate a measured oil and rail-input schedule against North Korean exports. More dependable supplies ease industrial bottlenecks, while repayment, delivery targets and fuel dependence constrain policy."
 COLDWAR_NKO_foreign_decline_soviet_fuel_contract_base:0 "Decline Soviet Fuel and Transport Schedule"
 COLDWAR_NKO_foreign_decline_soviet_fuel_contract_base_desc:0 "No payment is made. The DPRK may submit a fresh proposal after refusal or expiry."
 COLDWAR_NKO_foreign_resubmit_soviet_fuel_contract_base:0 "Renew Soviet Fuel and Transport Schedule"
 COLDWAR_NKO_foreign_resubmit_soviet_fuel_contract_base_desc:0 "Negotiate a measured oil and rail-input schedule against North Korean exports. More dependable supplies ease industrial bottlenecks, while repayment, delivery targets and fuel dependence constrain policy. A new submission is possible 180 days after the previous proposal."
 COLDWAR_NKO_foreign_recipient_accept_soviet_fuel_contract_base:0 "Accept Soviet Fuel and Transport Schedule"
 COLDWAR_NKO_foreign_recipient_accept_soviet_fuel_contract_base_desc:0 "Negotiate a measured oil and rail-input schedule against North Korean exports. More dependable supplies ease industrial bottlenecks, while repayment, delivery targets and fuel dependence constrain policy."
 COLDWAR_NKO_foreign_recipient_decline_soviet_fuel_contract_base:0 "Decline Soviet Fuel and Transport Schedule"
 COLDWAR_NKO_foreign_recipient_decline_soviet_fuel_contract_base_desc:0 "Decline the proposal without charge."
 COLDWAR_NKO_1970_foreign_soviet_staff_training_base_nko:0 "Soviet Air Defence and Staff Exchange"
 COLDWAR_NKO_1970_foreign_soviet_staff_training_base_nko_desc:0 "Soviet staff instruction supports air-defence planning and logistics. Foreign standards and specialist missions bring continuing costs and influence."
 COLDWAR_NKO_1970_foreign_soviet_staff_training_base_partner:0 "Soviet Air Defence and Staff Exchange"
 COLDWAR_NKO_1970_foreign_soviet_staff_training_base_partner_desc:0 "Korean observers and reciprocal technical study support Soviet regional experience. Training and adviser access draw on personnel and facilities."
 COLDWAR_NKO_foreign_offer_soviet_staff_training_base_terms:0 "Propose §YSoviet Air Defence and Staff Exchange§! to [SOV.GetNameDef]. A reply is due within §Y90 days§!; payment follows acceptance."
 COLDWAR_NKO_foreign.96.t:0 "Soviet Air Defence and Staff Exchange"
 COLDWAR_NKO_foreign.96.d:0 "Arrange reciprocal staff courses in air defence, logistics and command procedure. Specialist access can improve readiness and coordination, while imported systems, fuel and adviser commitments increase costs."
 COLDWAR_NKO_foreign.96.option_a:0 "Review the proposal."
 COLDWAR_NKO_foreign.97.t:0 "Soviet Air Defence and Staff Exchange"
 COLDWAR_NKO_foreign.97.d:0 "Both governments have approved this programme. The agreed reciprocal commitments are now in force."
 COLDWAR_NKO_foreign.97.option_a:0 "Proceed with the agreement."
 COLDWAR_NKO_foreign.98.t:0 "Soviet Air Defence and Staff Exchange"
 COLDWAR_NKO_foreign.98.d:0 "The other government has declined this programme. No funds have been transferred."
 COLDWAR_NKO_foreign.98.option_a:0 "Keep the channels open."
 COLDWAR_NKO_foreign.99.t:0 "Soviet Air Defence and Staff Exchange"
 COLDWAR_NKO_foreign.99.d:0 "The proposal has closed without an agreement. New terms may be submitted when diplomatic conditions permit."
 COLDWAR_NKO_foreign.99.option_a:0 "Reconsider the proposal."
