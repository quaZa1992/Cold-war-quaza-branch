# IMPERIA COLD WAR — confidential assessments of enrichment and weapons development.
l_english:
 COLDWAR_NI.1.t: "Nuclear Fuel Activity in [From.GetName]"
 COLDWAR_NI.1.d: "SECRET: INTELLIGENCE ASSESSMENT\n\nIndustrial reporting indicates construction and specialised procurement consistent with an expansion of uranium enrichment capacity in [From.GetName]. The scale and purpose of the undertaking remain uncertain.\n\nAssessment confidence: Moderate.\n\nThe available evidence does not establish a nuclear weapons programme."
 COLDWAR_NI.1.existing: "SECRET: INTELLIGENCE ASSESSMENT\n\nIndustrial reporting indicates that [From.GetName] may be operating uranium enrichment facilities. Available sources cannot yet establish the extent of these activities or their intended purpose.\n\nAssessment confidence: Moderate.\n\nFurther independent reporting is required before drawing conclusions about military intentions."
 COLDWAR_NI.1.a: "Continue discreet observation."
 COLDWAR_NI.2.t: "Enrichment Activity Corroborated"
 COLDWAR_NI.2.d: "SECRET: CORROBORATED ASSESSMENT\n\nIndependent reporting corroborates the expansion of uranium enrichment capacity in [From.GetName]. Our service assesses the underlying industrial activity with high confidence.\n\nAssessment confidence: High.\n\nEnrichment can support civilian fuel production. These findings alone do not establish a decision to develop nuclear weapons."
 COLDWAR_NI.2.existing: "SECRET: CORROBORATED ASSESSMENT\n\nIndependent reporting corroborates uranium enrichment activity in [From.GetName]. Our service now assesses the existence of this industrial capability with high confidence.\n\nAssessment confidence: High.\n\nThe evidence does not establish its current output, the condition of individual installations or a military purpose."
 COLDWAR_NI.2.a: "Add the findings to the national assessment."
 COLDWAR_NI.3.t: "Possible Nuclear Weapons Programme"
 COLDWAR_NI.3.d: "SECRET: INTELLIGENCE ASSESSMENT\n\nRestricted research activity and procurement reporting indicate that [From.GetName] may have undertaken an organised effort to develop nuclear weapons. Independent corroboration remains incomplete.\n\nAssessment confidence: Moderate.\n\nWe cannot confirm possession of a usable device or establish how far the programme has progressed."
 COLDWAR_NI.3.a: "Seek independent corroboration."
 COLDWAR_NI.4.t: "Nuclear Weapons Development Corroborated"
 COLDWAR_NI.4.d: "SECRET: CORROBORATED ASSESSMENT\n\nIndependent reporting supports our earlier assessment that [From.GetName] has undertaken organised nuclear weapons development. Our service assesses the military purpose of the work with high confidence.\n\nAssessment confidence: High.\n\nThe evidence does not establish a deployable arsenal, the present operational status of the programme or a reliable date for completion."
 COLDWAR_NI.4.a: "Refer the assessment to the government."
