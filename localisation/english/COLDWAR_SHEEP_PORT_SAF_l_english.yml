# IMPERIA COLD WAR — B4 MD standard fix (24.11.2026)
 COLDWAR_SAF_FOREIGN_support_terms:0 "Unlocks support offers to the Angolan opposition.\n§YIf accepted, choose one package§!\n§YArms Shipment§! a treasury payment for §G1,000 infantry weapons§! to the recipient.\n§YAdvisory Cadre§! a treasury payment for §G15 Army Experience§! each and an advisory mission."
 COLDWAR_SAF_FOREIGN_ultimatum_terms:0 "Unlocks an ultimatum after Portuguese withdrawal.\n§YIf refused§! Spend §R50 Political Power§! to gain a §YPuppet War Goal§!.\n§R−3 Stability§!, §G+2 War Support§! and increased World Tension.\n§YIf puppeted under apartheid rule§! Installs the local republic. South Africa pays a weekly subsidy from its treasury."
 COLDWAR_SAF_PARTY_ifp_royal_indaba:0 "An Indaba with the Crown"
 COLDWAR_SAF_PARTY_ifp_royal_indaba_desc:0 "The federal settlement has left one delicate question unanswered: what constitutional place should the Zulu royal house hold? Delegates, elected officials and the royal household must seek an agreement."
 COLDWAR_SAF_PARTY_ifp_royal_provincial:0 "The Crown of KwaZulu-Natal"
 COLDWAR_SAF_PARTY_ifp_royal_provincial_desc:0 "Recognise the Zulu monarch within the provincial constitution, with a ceremonial role and protections for customary institutions. South Africa remains a federal republic with an elected national government."
 COLDWAR_SAF_PARTY_ifp_royal_national:0 "A Crown for the Union"
 COLDWAR_SAF_PARTY_ifp_royal_national_desc:0 "In a radical constitutional compromise, the Zulu monarch becomes ceremonial head of state for the whole federation. An elected Inkatha government retains executive authority; persuading the other communities to accept the settlement will be difficult."
