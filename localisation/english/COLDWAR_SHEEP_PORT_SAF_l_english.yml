 COLDWAR_SAF_FOREIGN_exiles_terms:0 "Unlocks §YBack the Rhodesian Exiles§!\nCosts §R50 Political Power§!, a one-time treasury payment and §R−2 Stability§!."
 COLDWAR_SAF_FOREIGN_exiles_outcome_tt:0 "Zimbabwe can contain the attempt for §R45 Political Power§! and §R2 Stability§!, or face a §Ycivil war with a 20% rebel side§!."
 COLDWAR_SAF_FOREIGN_sponsor_zimbabwe_exiles:0 "Back the Rhodesian Exiles"
 COLDWAR_SAF_FOREIGN_sponsor_zimbabwe_exiles_desc:0 "Fund an attempt by Rhodesian exiles to unseat the government in Harare. Zimbabwe’s leadership will choose its response."
 COLDWAR_SAF_FOREIGN.1.t:0 "A Challenge to Zimbabwean Independence"
 COLDWAR_SAF_FOREIGN.1.d:0 "South African backing has emboldened opponents of the post-independence settlement. They are openly challenging the authority of our government. We can spend political capital to hold our institutions together, or face a divided country."
 COLDWAR_SAF_FOREIGN.1.a:0 "Rally the institutions behind the government"
 COLDWAR_SAF_FOREIGN.1.b:0 "Mobilise in defence of the republic"
 COLDWAR_SAF_FOREIGN.1.c:0 "The situation has moved on"
