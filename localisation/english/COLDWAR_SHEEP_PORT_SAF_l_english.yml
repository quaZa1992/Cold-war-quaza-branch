 COLDWAR_SAF_DEFENCE_PLAN_air_4_1:0 "Maintain the Airframes"
 COLDWAR_SAF_DEFENCE_PLAN_air_4_1_desc:0 "The air force needs trained crews, serviceable aircraft and bases capable of supporting operations far from home."
 COLDWAR_SAF_DEFENCE_PLAN_air_5_0:0 "Improve the Airfields"
 COLDWAR_SAF_DEFENCE_PLAN_air_5_0_desc:0 "A better network of airfields extends the reach of the squadrons. Further expansion requires a suitable site and separate funding."
 COLDWAR_SAF_DEFENCE_PLAN_air_6_0:0 "Ready the Squadrons"
 COLDWAR_SAF_DEFENCE_PLAN_air_6_0_desc:0 "Standardise ground support and flying procedures so the squadrons can sustain their missions."
 COLDWAR_SAF_AIRSEA_navy_review:0 "Review the South African Navy"
 COLDWAR_SAF_AIRSEA_navy_review_desc:0 "The Cape sea lanes demand a fleet suited to South Africa’s strategic needs and the resources available to it."
 COLDWAR_SAF_DEFENCE_PLAN_navy_1_0:0 "Escort the Cape Sea Lanes"
 COLDWAR_SAF_DEFENCE_PLAN_navy_1_0_desc:0 "The Cape sea lanes demand a fleet suited to South Africa’s strategic needs and the resources available to it."
 COLDWAR_SAF_DEFENCE_PLAN_navy_1_1:0 "Guard the Coast"
