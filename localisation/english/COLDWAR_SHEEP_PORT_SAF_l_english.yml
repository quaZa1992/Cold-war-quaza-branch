 COLDWAR_SAF_FOREIGN_foreign_root:0 "South Africa and the World"
 COLDWAR_SAF_FOREIGN_foreign_root_desc:0 "South Africa depends on overseas markets and on the transport routes, resources and governments of its neighbours. Pretoria must decide how it will conduct itself in a changing southern Africa."
 COLDWAR_SAF_FOREIGN_gov_0:0 "Keep the Channels Open"
 COLDWAR_SAF_FOREIGN_gov_0_desc:0 "Commercial links and diplomatic contacts can keep options open even when relations with foreign governments are strained."
 COLDWAR_SAF_FOREIGN_gov_1:0 "The London Connection"
 COLDWAR_SAF_FOREIGN_gov_1_desc:0 "Britain remains a major financial and commercial partner, although its arms embargo and political criticism complicate relations. Any new arrangement requires the British government to agree."
 COLDWAR_SAF_FOREIGN_gov_2:0 "Across the Atlantic"
 COLDWAR_SAF_FOREIGN_gov_2_desc:0 "American industry and research offer opportunities, but sanctions and disagreement over southern Africa stand in the way of a closer relationship."
 COLDWAR_SAF_FOREIGN_gov_3:0 "Finance for the Cape Route"
 COLDWAR_SAF_FOREIGN_gov_3_desc:0 "The Cape route and its inland connections are only as reliable as the investment that maintains them."
 COLDWAR_SAF_FOREIGN_gov_4:0 "The Engineers’ Exchange"
 COLDWAR_SAF_FOREIGN_gov_4_desc:0 "South African engineers can learn from overseas experience while building skills and industry at home."
 COLDWAR_SAF_FOREIGN_gov_5:0 "Courting Japanese Buyers"
 COLDWAR_SAF_FOREIGN_gov_5_desc:0 "Japanese buyers have an appetite for minerals. Long-term arrangements could turn that demand into more dependable commercial ties."
 COLDWAR_SAF_FOREIGN_gov_6:0 "Open Doors to European Capital"
 COLDWAR_SAF_FOREIGN_gov_6_desc:0 "European capital and technical expertise could help modernise industry, if the partners can agree on terms."
 COLDWAR_SAF_FOREIGN_gov_7:0 "Commercial Diplomacy"
 COLDWAR_SAF_FOREIGN_gov_7_desc:0 "Pretoria can keep commercial channels open where partners are willing to deal. Diplomatic staff will concentrate on clearing disputes and financing ordinary trade."
 COLDWAR_SAF_FOREIGN_gov_8:0 "Guarantee Essential Imports"
 COLDWAR_SAF_FOREIGN_gov_8_desc:0 "Fuel, machinery and other essential imports need secure financing and reliable channels even in difficult diplomatic conditions."
 COLDWAR_SAF_FOREIGN_gov_9:0 "Expand Mineral Exports"
 COLDWAR_SAF_FOREIGN_gov_9_desc:0 "The mining houses can seek new buyers and export arrangements, although a greater dependence on overseas markets brings its own risks."
 COLDWAR_SAF_FOREIGN_gov_10:0 "The Regional Power Market"
 COLDWAR_SAF_FOREIGN_gov_10_desc:0 "The Cahora Bassa project was agreed with Portugal while Mozambique was under Portuguese rule. A later independent Mozambique must make its own decision on a successor arrangement."
 COLDWAR_SAF_FOREIGN_gov_11:0 "Talks on the Inkomati"
 COLDWAR_SAF_FOREIGN_gov_11_desc:0 "A negotiated border accord with Maputo can secure trade and reduce tensions. Its terms require Mozambique’s consent."
 COLDWAR_SAF_FOREIGN_gov_12:0 "A Place at the Negotiating Table"
 COLDWAR_SAF_FOREIGN_gov_12_desc:0 "No regional settlement can endure without channels through which governments can negotiate and manage disagreements."
 COLDWAR_SAF_FOREIGN_econ_0:0 "Hold the Southern Line"
 COLDWAR_SAF_FOREIGN_econ_0_desc:0 "A radical government sees the collapse of white minority rule to the north as a strategic threat. The commitment will carry military and economic costs."
 COLDWAR_SAF_FOREIGN_econ_1:0 "Approach Lisbon"
 COLDWAR_SAF_FOREIGN_econ_1_desc:0 "As long as Lisbon governs either colony, Pretoria can seek a commercial and transit agreement with Portugal. Lisbon will decide whether to accept."
 COLDWAR_SAF_FOREIGN_econ_2:0 "Prepare for a Portuguese Withdrawal"
 COLDWAR_SAF_FOREIGN_econ_2_desc:0 "Portuguese withdrawal would transform the northern frontier. Pretoria must consider the logistical demands of a changed regional order."
 COLDWAR_SAF_FOREIGN_econ_3:0 "The Cahora Bassa Contracts"
 COLDWAR_SAF_FOREIGN_econ_3_desc:0 "Cahora Bassa could supply South Africa with power from the Zambezi. The government that controls the project must agree to the connection before Pretoria can commission its end."
 COLDWAR_SAF_FOREIGN_econ_4:0 "Stock the Frontier Depots"
 COLDWAR_SAF_FOREIGN_econ_4_desc:0 "A frontier deployment needs ammunition, transport and reliable stores. Establishing the depots will demand men and money before they are called upon."
 COLDWAR_SAF_FOREIGN_econ_5:0 "Support Lisbon in Angola"
 COLDWAR_SAF_FOREIGN_econ_5_desc:0 "As long as Lisbon still holds territory in Angola or governs it through a dependent administration, Pretoria can offer Portugal logistics support."
 COLDWAR_SAF_FOREIGN_econ_6:0 "Build a Self-Reliant Frontier"
 COLDWAR_SAF_FOREIGN_econ_6_desc:0 "If Portugal withdraws, South Africa must maintain its own access to the frontier. Roads and supply bases can be financed at home, but will compete with civilian needs."
 COLDWAR_SAF_FOREIGN_econ_7:0 "After Angola’s Independence"
 COLDWAR_SAF_FOREIGN_econ_7_desc:0 "The Portuguese withdrawal and a sovereign government in Luanda force Pretoria to decide whether it can negotiate or will back its opponents."
 COLDWAR_SAF_FOREIGN_econ_8:0 "Negotiate with Luanda"
 COLDWAR_SAF_FOREIGN_econ_8_desc:0 "Pretoria can put a security proposal to the Angolan authorities. The government in Luanda may accept or refuse."
 COLDWAR_SAF_FOREIGN_econ_9:0 "Back an Angolan Opposition"
 COLDWAR_SAF_FOREIGN_econ_9_desc:0 "A sympathetic local force may be offered equipment or advisers. The recipient must exist and agree before South Africa commits funds."
 COLDWAR_SAF_FOREIGN_econ_10:0 "The Angolan Question"
 COLDWAR_SAF_FOREIGN_econ_10_desc:0 "The government can issue an ultimatum to an independent Angola. Refusal opens a separate decision on whether to seek a war goal."
 COLDWAR_SAF_FOREIGN_econ_11:0 "Secure the Supply Lines"
 COLDWAR_SAF_FOREIGN_econ_11_desc:0 "A column cannot operate far from home without a dependable supply line. More depots and transport capacity will place additional demands on industry."
 COLDWAR_SAF_FOREIGN_econ_12:0 "A Frontier Without Guarantees"
 COLDWAR_SAF_FOREIGN_econ_12_desc:0 "No frontier can be guaranteed by force alone. Sustained operations may teach valuable lessons, but their political cost will continue to grow."
 COLDWAR_SAF_FOREIGN_party_0:0 "Beyond the Limpopo"
 COLDWAR_SAF_FOREIGN_party_0_desc:0 "Across the Limpopo, the future of Rhodesia raises difficult questions for any government determined to defend minority rule."
 COLDWAR_SAF_FOREIGN_party_1:0 "Talks with Salisbury"
 COLDWAR_SAF_FOREIGN_party_1_desc:0 "Salisbury may welcome a supply arrangement, but its government must decide whether to accept it."
 COLDWAR_SAF_FOREIGN_party_2:0 "The Fall of Salisbury"
 COLDWAR_SAF_FOREIGN_party_2_desc:0 "Rhodesia has given way to an independent Zimbabwe. Pretoria must decide whether to back an exile challenge or seek a military settlement."
 COLDWAR_SAF_FOREIGN_party_3:0 "The Rhodesian Supply Route"
 COLDWAR_SAF_FOREIGN_party_3_desc:0 "Routes north through South Africa support the trade on which Rhodesia relies. Any construction undertaken here will be paid for and built on South African territory."
 COLDWAR_SAF_FOREIGN_party_4:0 "March on Zimbabwe"
 COLDWAR_SAF_FOREIGN_party_4_desc:0 "With Zimbabwe in control of its capital, the cabinet can authorise a campaign to install a dependent government. The war goal opens the option to declare war."
 COLDWAR_SAF_FOREIGN_party_5:0 "Back Salisbury’s Position"
 COLDWAR_SAF_FOREIGN_party_5_desc:0 "A security arrangement with Rhodesia would require a commitment by both governments and carries the costs of closer association."
 COLDWAR_SAF_FOREIGN_party_6:0 "Back the Rhodesian Exiles"
 COLDWAR_SAF_FOREIGN_party_6_desc:0 "Exiles ask Pretoria to back a challenge to the Zimbabwean cabinet. South Africa can finance the attempt. Zimbabwe's response determines whether it is contained or becomes an internal conflict."
 COLDWAR_SAF_FOREIGN_party_7:0 "Guard the Eastern Approaches"
 COLDWAR_SAF_FOREIGN_party_7_desc:0 "The eastern frontier demands roads, stores and trained troops. Guarding it more effectively means accepting the expense of keeping them there."
 COLDWAR_SAF_FOREIGN_party_8:0 "Stand with Lisbon in Mozambique"
 COLDWAR_SAF_FOREIGN_party_8_desc:0 "Pretoria can offer coastal support to Lisbon while Portugal still exercises authority in Mozambique."
 COLDWAR_SAF_FOREIGN_party_9:0 "Open Talks with Maputo"
 COLDWAR_SAF_FOREIGN_party_9_desc:0 "Following Portugal’s withdrawal, Pretoria can negotiate with an independent government in Maputo over the security of the shared frontier."
 COLDWAR_SAF_FOREIGN_party_10:0 "The Mozambican Question"
 COLDWAR_SAF_FOREIGN_party_10_desc:0 "With Portuguese authority withdrawn, Pretoria can demand a security settlement from independent Mozambique. Maputo’s refusal opens the option of a military intervention."
 COLDWAR_SAF_FOREIGN_party_11:0 "Prepare the Eastern Corridor"
 COLDWAR_SAF_FOREIGN_party_11_desc:0 "Any sustained movement toward Mozambique would depend on transport prepared in South Africa. Funding the corridor is a separate commitment."
 COLDWAR_SAF_FOREIGN_party_12:0 "The Limits of a Buffer"
 COLDWAR_SAF_FOREIGN_party_12_desc:0 "A neighbouring state cannot be turned into a reliable buffer simply by naming it one. Experience at the frontier comes with political and financial consequences."
 COLDWAR_SAF_FOREIGN_const_0:0 "A South Africa Among Africans"
 COLDWAR_SAF_FOREIGN_const_0_desc:0 "A government drawn from the liberation movements can seek relationships with the region on a basis of African cooperation and mutual consent."
 COLDWAR_SAF_FOREIGN_const_1:0 "Reach Out to Lusaka"
 COLDWAR_SAF_FOREIGN_const_1_desc:0 "Zambia’s connections to the liberation struggle make Lusaka a natural starting point for a new transport partnership."
 COLDWAR_SAF_FOREIGN_const_2:0 "Talks with Gaborone"
 COLDWAR_SAF_FOREIGN_const_2_desc:0 "Botswana and South Africa share a long border and commercial ties. A new agreement must serve both governments."
 COLDWAR_SAF_FOREIGN_const_3:0 "The Northern Rail Corridor"
 COLDWAR_SAF_FOREIGN_const_3_desc:0 "Rail connections to the north can support trade and reduce the costs of moving goods. The South African section will need domestic funding and construction."
 COLDWAR_SAF_FOREIGN_const_4:0 "Recognise Independent Zimbabwe"
 COLDWAR_SAF_FOREIGN_const_4_desc:0 "A government committed to liberation can recognise independent Zimbabwe and offer technical assistance on equal terms."
 COLDWAR_SAF_FOREIGN_const_5:0 "Recognise Angola’s Independence"
 COLDWAR_SAF_FOREIGN_const_5_desc:0 "After Portugal withdraws, Pretoria can recognise the sovereign government in Luanda and offer a reconstruction partnership."
 COLDWAR_SAF_FOREIGN_const_6:0 "The Maputo Connection"
 COLDWAR_SAF_FOREIGN_const_6_desc:0 "Mozambique must make its own decision about cross-border transport and the future of any power agreement."
 COLDWAR_SAF_FOREIGN_const_7:0 "The Freedom of Namibia"
 COLDWAR_SAF_FOREIGN_const_7_desc:0 "An independent Namibia should be able to choose whether it wants a reconstruction partnership with South Africa."
 COLDWAR_SAF_FOREIGN_const_8:0 "Return of the Exiles"
 COLDWAR_SAF_FOREIGN_const_8_desc:0 "People returning from exile bring professional skills and links to the region. Reintegrating them will require a public programme."
 COLDWAR_SAF_FOREIGN_const_9:0 "Train a New Diplomatic Service"
 COLDWAR_SAF_FOREIGN_const_9_desc:0 "Diplomats returning from exile bring knowledge of the region. A professional service can build on that experience, provided the government funds the institutions it needs."
 COLDWAR_SAF_FOREIGN_const_10:0 "Rebuild Southern Africa Together"
 COLDWAR_SAF_FOREIGN_const_10_desc:0 "Reconstruction offers South African firms and workers new opportunities at home and across the region. A factory project will still require a separate domestic investment."
 COLDWAR_SAF_FOREIGN_const_11:0 "Trade Without Coercion"
 COLDWAR_SAF_FOREIGN_const_11_desc:0 "Regional trade will be more durable when governments choose its terms freely. Managing wider commercial ties requires a capable administration."
 COLDWAR_SAF_FOREIGN_const_12:0 "A Common African Future"
 COLDWAR_SAF_FOREIGN_const_12_desc:0 "A more cooperative southern Africa will depend on the choices of its independent governments, not on guarantees made in Pretoria alone."
