 COLDWAR_SAF_DEFENCE_PLAN_navy_4_0:0 "Train for Coastal Operations"
 COLDWAR_SAF_DEFENCE_PLAN_navy_4_0_desc:0 "The Cape sea lanes demand a fleet suited to South Africa’s strategic needs and the resources available to it."
 COLDWAR_SAF_DEFENCE_PLAN_navy_4_1:0 "Coordinate the Ports"
 COLDWAR_SAF_DEFENCE_PLAN_navy_4_1_desc:0 "The Cape sea lanes demand a fleet suited to South Africa’s strategic needs and the resources available to it."
 COLDWAR_SAF_DEFENCE_PLAN_navy_5_0:0 "Repair the Fleet"
 COLDWAR_SAF_DEFENCE_PLAN_navy_5_0_desc:0 "The Cape sea lanes demand a fleet suited to South Africa’s strategic needs and the resources available to it."
 COLDWAR_SAF_DEFENCE_PLAN_navy_6_0:0 "Ready the Cape Fleet"
 COLDWAR_SAF_DEFENCE_PLAN_navy_6_0_desc:0 "Bring the ships, crews and shore establishments into a fleet that can remain organised on extended patrols."
 COLDWAR_SAF_DEFENCE_swa_policy:0 "The South West Africa Question"
 COLDWAR_SAF_DEFENCE_swa_policy_desc:0 "South West Africa presents Pretoria with a choice between a costlier administration and negotiations over the territory’s future."
 COLDWAR_SAF_DEFENCE_PLAN_nam_commit:0 "Hold the Territory"
 COLDWAR_SAF_DEFENCE_PLAN_nam_commit_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_talks:0 "Seek a Negotiated Settlement"
 COLDWAR_SAF_DEFENCE_PLAN_nam_talks_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_frontier:0 "The Northern Frontier"
 COLDWAR_SAF_DEFENCE_PLAN_nam_frontier_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_civic:0 "Government from Windhoek"
 COLDWAR_SAF_DEFENCE_PLAN_nam_civic_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_guarantee:0 "Guarantees for the Transition"
 COLDWAR_SAF_DEFENCE_PLAN_nam_guarantee_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_observers:0 "Invite International Observers"
 COLDWAR_SAF_DEFENCE_PLAN_nam_observers_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_truce:0 "Negotiate a Local Ceasefire"
 COLDWAR_SAF_DEFENCE_PLAN_nam_truce_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_local:0 "Consult Local Representatives"
 COLDWAR_SAF_DEFENCE_PLAN_nam_local_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_rail:0 "Secure the Rail Corridor"
 COLDWAR_SAF_DEFENCE_PLAN_nam_rail_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_constitution:0 "A Territorial Constitution"
 COLDWAR_SAF_DEFENCE_PLAN_nam_constitution_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_unity:0 "Advance Territorial Incorporation"
 COLDWAR_SAF_DEFENCE_PLAN_nam_unity_desc:0 "Pretoria can seek to incorporate South West Africa while it controls the territory. Namibia’s existing claims remain in place."
 COLDWAR_SAF_DEFENCE_PLAN_nam_late:0 "Return to the Negotiating Table"
 COLDWAR_SAF_DEFENCE_PLAN_nam_late_desc:0 "Years of administering the territory have reopened the question of an agreement. Returning to talks will cost the government support at home."
 COLDWAR_SAF_DEFENCE_PLAN_nam_land:0 "Safeguard Land and Property"
 COLDWAR_SAF_DEFENCE_PLAN_nam_land_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_police:0 "Prepare a Civilian Police"
 COLDWAR_SAF_DEFENCE_PLAN_nam_police_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_elections:0 "Prepare the Constituent Assembly"
 COLDWAR_SAF_DEFENCE_PLAN_nam_elections_desc:0 "A constituent assembly would allow the territory’s representatives to debate its future institutions."
 COLDWAR_SAF_DEFENCE_namibian_transition:0 "A Settlement for South West Africa"
 COLDWAR_SAF_DEFENCE_namibian_transition_desc:0 "The proposed settlement transfers both states to an independent Namibia. An existing Namibian government must agree to the terms."
 COLDWAR_SAF_DEFENCE_PLAN_nam_trade:0 "Rebuild Links with Windhoek"
 COLDWAR_SAF_DEFENCE_PLAN_nam_trade_desc:0 "Prepare engineers for cross-border reconstruction. An independent Namibia can decide whether to join the pact."
 COLDWAR_SAF_DEFENCE_PLAN_nam_dev:0 "Invest in the South West"
 COLDWAR_SAF_DEFENCE_PLAN_nam_dev_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_road:0 "Maintain the Northern Supply Line"
 COLDWAR_SAF_DEFENCE_PLAN_nam_road_desc:0 "South West Africa presents Pretoria with difficult political, security and diplomatic choices."
 COLDWAR_SAF_DEFENCE_PLAN_nam_reassess:0 "Reassess the Mandate"
 COLDWAR_SAF_DEFENCE_PLAN_nam_reassess_desc:0 "A reduced military commitment creates room to reopen negotiations over the territory’s future."
 COLDWAR_SAF_DEFENCE_safeguards:0 "The Atom at Pelindaba"
 COLDWAR_SAF_DEFENCE_safeguards_desc:0 "The nuclear programme offers new possibilities while demanding scarce expertise, resources and difficult political decisions."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_lab:0 "Invest in Nuclear Science"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_lab_desc:0 "Fund nuclear research at Pelindaba and develop the computing needed to run its laboratories."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_industry:0 "Nuclear Power for Industry"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_industry_desc:0 "The nuclear programme offers new possibilities while demanding scarce expertise, resources and difficult political decisions."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_uranium:0 "Refine Our Uranium"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_uranium_desc:0 "The programme depends on improving output from South Africa’s existing mineral deposits."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_scientists:0 "Train a Generation of Scientists"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_scientists_desc:0 "The nuclear programme offers new possibilities while demanding scarce expertise, resources and difficult political decisions."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_reactor:0 "The Reactor Programme"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_reactor_desc:0 "A research facility at Pelindaba will need its own appropriation and an eligible site."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_yplant:0 "The Y-Plant at Valindaba"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_yplant_desc:0 "Fund the pilot plant to bring the next stage of research within reach."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_medical:0 "Radioisotopes for Medicine"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_medical_desc:0 "The nuclear programme offers new possibilities while demanding scarce expertise, resources and difficult political decisions."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_grid:0 "An Atomic Contribution to the Grid"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_grid_desc:0 "Coordinate power deliveries and maintenance with the grid to reduce the cost of keeping nuclear plants in service."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_option:0 "Consider the Deterrent"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_option_desc:0 "Cabinet and the defence establishment must weigh the cost of a military programme against a commitment to international safeguards."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_bomb:0 "Design a Secret Device"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_bomb_desc:0 "Finance the design milestone and give researchers a head start on nuclear weapons technology."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_safeguards:0 "Place the Programme under Safeguards"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_safeguards_desc:0 "South Africa can improve its relations abroad by placing the programme under safeguards and paying for their administration."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_delivery:0 "Study the Delivery Problem"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_delivery_desc:0 "Bring air force planners and missile researchers together to work out how the new equipment will enter service."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_secrecy:0 "Guard the Circle"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_secrecy_desc:0 "The nuclear programme offers new possibilities while demanding scarce expertise, resources and difficult political decisions."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_inspections:0 "Open the Books to Inspectors"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_inspections_desc:0 "Allowing inspectors to review the programme makes the government’s commitments more credible."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_civilian:0 "A Civilian Atomic Future"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_civilian_desc:0 "The nuclear programme offers new possibilities while demanding scarce expertise, resources and difficult political decisions."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_first:0 "The First Device"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_first_desc:0 "With the design funded and research complete, deliver the first launch load to the stockpile. A load contains 20 units of ICBM equipment."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_doctrine:0 "A Deliberate Ambiguity"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_doctrine_desc:0 "The nuclear programme offers new possibilities while demanding scarce expertise, resources and difficult political decisions."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_contingency:0 "Prepare for Disclosure"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_contingency_desc:0 "The nuclear programme offers new possibilities while demanding scarce expertise, resources and difficult political decisions."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_arsenal:0 "A Limited Arsenal"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_arsenal_desc:0 "Commission the remaining launch loads. Each contains 20 units of ICBM equipment. The programme can issue six loads in total, including the first."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_dismantle:0 "Choose Verifiable Dismantlement"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_dismantle_desc:0 "Reassign part of Pelindaba’s budget to medical work and prepare the programme for international inspection."
 COLDWAR_SAF_DEFENCE_PLAN_reactor_root:0 "Reactor Research"
 COLDWAR_SAF_DEFENCE_PLAN_civilian_reactor:0 "Civil Nuclear Power"
 COLDWAR_SAF_DEFENCE_PLAN_bomb_design:0 "Warhead Design"
 COLDWAR_SAF_DEFENCE_PLAN_civilian_future:0 "The Civil Nuclear Programme"
 COLDWAR_SAF_DEFENCE_PLAN_direct_nuclear_delivery_tt:0 "§GCompleting this focus delivers nuclear weapons directly to your stockpile.§!"
 COLDWAR_SAF_DEFENCE_PLAN_army_spirit:0 "The South African Army"
 COLDWAR_SAF_DEFENCE_PLAN_army_spirit_desc:0 "A long frontier and limited manpower force the Army to choose where to station its men and how quickly it can move them. Investment in training, logistics and Armscor shapes the force it can field."
 COLDWAR_SAF_DEFENCE_PLAN_air_spirit:0 "The South African Air Force"
 COLDWAR_SAF_DEFENCE_PLAN_air_spirit_desc:0 "The Air Force depends on a small pool of trained crews and a network of bases and radar stations. Its ability to patrol the region rests on how well it can sustain both."
 COLDWAR_SAF_DEFENCE_PLAN_navy_spirit:0 "The Cape Fleet"
 COLDWAR_SAF_DEFENCE_PLAN_navy_spirit_desc:0 "The fleet must watch the sea lanes around the Cape with the ships, crews and dockyards South Africa can afford."
 COLDWAR_SAF_DEFENCE_PLAN_nam_spirit:0 "The South West Africa Administration"
 COLDWAR_SAF_DEFENCE_PLAN_nam_spirit_desc:0 "The South West Africa administration carries political and military responsibilities. Its effects apply while South Africa owns part of the territory."
 COLDWAR_SAF_DEFENCE_PLAN_nuc_spirit:0 "The Pelindaba Programme"
 COLDWAR_SAF_DEFENCE_PLAN_nuc_spirit_desc:0 "Pelindaba brings engineers, uranium and enrichment research together. The direction of their work depends on the resources Pretoria commits and the risks it is prepared to take."
