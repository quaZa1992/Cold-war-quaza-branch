 COLDWAR_SAF_ECONPLAN_general_spirit:0 "The South African Economy"
 COLDWAR_SAF_ECONPLAN_general_spirit_desc:0 "The state, mines and workshops compete for investment and administrative capacity."
 COLDWAR_SAF_CIVILPLAN_root:0 "The Public Service Question"
 COLDWAR_SAF_CIVILPLAN_root_desc:0 "A national programme begins with a review of the needs of South Africa and the costs of meeting them."
 COLDWAR_SAF_CIVILPLAN_health_spirit:0 "The Public Health Service"
 COLDWAR_SAF_CIVILPLAN_health_spirit_desc:0 "District clinics, hospitals and laboratories stretch a limited health budget. The shape of the service depends on where Pretoria puts its nurses and physicians."
 COLDWAR_SAF_CIVILPLAN_health_00:0 "Take Stock of the Health Service"
 COLDWAR_SAF_CIVILPLAN_health_00_desc:0 "Map the hospitals, clinics and avoidable diseases that confront the public health service."
 COLDWAR_SAF_CIVILPLAN_health_01:0 "Bring Clinics Closer to Communities"
 COLDWAR_SAF_CIVILPLAN_health_01_desc:0 "Invest in accessible primary care and the staff to operate it."
 COLDWAR_SAF_CIVILPLAN_health_02:0 "Expand the Referral Hospitals"
 COLDWAR_SAF_CIVILPLAN_health_02_desc:0 "Concentrate scarce expertise and equipment in regional referral hospitals."
 COLDWAR_SAF_CIVILPLAN_health_03:0 "Train More Nurses"
 COLDWAR_SAF_CIVILPLAN_health_03_desc:0 "Nurses give district services a sustainable professional workforce."
 COLDWAR_SAF_CIVILPLAN_health_04:0 "Retain Medical Specialists"
 COLDWAR_SAF_CIVILPLAN_health_04_desc:0 "Support advanced medical training, accepting higher running costs."
 COLDWAR_SAF_CIVILPLAN_health_05:0 "Track Preventable Disease"
 COLDWAR_SAF_CIVILPLAN_health_05_desc:0 "Coordinate laboratories and reporting across provincial boundaries."
 COLDWAR_SAF_CIVILPLAN_health_06:0 "Prioritise Prevention"
 COLDWAR_SAF_CIVILPLAN_health_06_desc:0 "Fund vaccination, sanitation advice and preventive public health."
 COLDWAR_SAF_CIVILPLAN_health_07:0 "Invest in Treatment"
 COLDWAR_SAF_CIVILPLAN_health_07_desc:0 "Increase treatment capacity for patients already in need of care."
 COLDWAR_SAF_CIVILPLAN_health_08:0 "Computerise Health Records"
 COLDWAR_SAF_CIVILPLAN_health_08_desc:0 "Improve diagnostic capacity and the exchange of reliable information."
 COLDWAR_SAF_CIVILPLAN_health_09:0 "A Service Under Pressure"
 COLDWAR_SAF_CIVILPLAN_health_09_desc:0 "Standardise purchasing across hospitals and district clinics so the national service can make more of its budget."
 COLDWAR_SAF_CIVILPLAN_education_spirit:0 "A Nation at School"
 COLDWAR_SAF_CIVILPLAN_education_spirit_desc:0 "Teacher training, libraries and university laboratories compete for funding as schools and industry look for more qualified South Africans."
 COLDWAR_SAF_CIVILPLAN_education_00:0 "Review the Schools"
 COLDWAR_SAF_CIVILPLAN_education_00_desc:0 "Identify gaps in the supply of teachers, technicians and professionals."
 COLDWAR_SAF_CIVILPLAN_education_01:0 "Train Classroom Teachers"
 COLDWAR_SAF_CIVILPLAN_education_01_desc:0 "Expand the teaching workforce and improve instructional quality."
 COLDWAR_SAF_CIVILPLAN_education_02:0 "Fund Specialist Chairs"
 COLDWAR_SAF_CIVILPLAN_education_02_desc:0 "Help students pursue advanced qualifications and technical study."
 COLDWAR_SAF_CIVILPLAN_education_03:0 "School Transport for the Districts"
 COLDWAR_SAF_CIVILPLAN_education_03_desc:0 "Give teaching institutions the materials to use their expanded workforce."
 COLDWAR_SAF_CIVILPLAN_education_04:0 "Build Research Networks"
 COLDWAR_SAF_CIVILPLAN_education_04_desc:0 "Retain experienced researchers and build centres of expertise."
 COLDWAR_SAF_CIVILPLAN_education_05:0 "Set Educational Standards"
 COLDWAR_SAF_CIVILPLAN_education_05_desc:0 "Coordinate qualifications and recognise credible professional training."
 COLDWAR_SAF_CIVILPLAN_education_06:0 "Teach Basic Skills"
 COLDWAR_SAF_CIVILPLAN_education_06_desc:0 "Give adults opportunities to improve foundational skills."
 COLDWAR_SAF_CIVILPLAN_education_07:0 "Prioritise Technical Instruction"
 COLDWAR_SAF_CIVILPLAN_education_07_desc:0 "Improve university laboratories, giving applied construction research a practical foundation."
 COLDWAR_SAF_CIVILPLAN_education_08:0 "Develop Construction Schools"
 COLDWAR_SAF_CIVILPLAN_education_08_desc:0 "Make technical knowledge and educational materials more accessible."
 COLDWAR_SAF_CIVILPLAN_education_09:0 "An Education System for the Future"
 COLDWAR_SAF_CIVILPLAN_education_09_desc:0 "Link schools, universities and technical colleges so South Africa can develop the skills its industry and research need."
 COLDWAR_SAF_CIVILPLAN_housing_spirit:0 "Homes and Services"
 COLDWAR_SAF_CIVILPLAN_housing_spirit_desc:0 "Municipalities must make room for growing towns while keeping water, transport and housing affordable. Pretoria decides how much of the burden falls on the public purse."
 COLDWAR_SAF_CIVILPLAN_housing_00:0 "Survey Housing Needs"
 COLDWAR_SAF_CIVILPLAN_housing_00_desc:0 "Surveying the shortage of housing and services lets municipalities plan roads, utilities and new districts together."
 COLDWAR_SAF_CIVILPLAN_housing_01:0 "Public Housing Schemes"
 COLDWAR_SAF_CIVILPLAN_housing_01_desc:0 "The treasury can fund the first public works while municipalities build up their capacity to meet housing demand."
 COLDWAR_SAF_CIVILPLAN_housing_02:0 "Finance Home Construction"
 COLDWAR_SAF_CIVILPLAN_housing_02_desc:0 "Use credit guarantees to encourage construction while accepting fiscal exposure."
 COLDWAR_SAF_CIVILPLAN_housing_03:0 "Train Local Building Crews"
 COLDWAR_SAF_CIVILPLAN_housing_03_desc:0 "Train the workforce needed to build and maintain homes."
 COLDWAR_SAF_CIVILPLAN_housing_04:0 "A Mortgage Finance Review"
 COLDWAR_SAF_CIVILPLAN_housing_04_desc:0 "Create an administrative framework for housing finance and risk."
 COLDWAR_SAF_CIVILPLAN_housing_05:0 "Maintain the Existing Stock"
 COLDWAR_SAF_CIVILPLAN_housing_05_desc:0 "Fund basic repairs to preserve the existing housing stock."
 COLDWAR_SAF_CIVILPLAN_housing_06:0 "Water for the Towns"
 COLDWAR_SAF_CIVILPLAN_housing_06_desc:0 "Support municipal water connections and improve an eligible infrastructure link, paid for from the treasury."
 COLDWAR_SAF_CIVILPLAN_housing_07:0 "Connect the Outer Districts"
 COLDWAR_SAF_CIVILPLAN_housing_07_desc:0 "Coordinate transport so residents can reach work and services."
 COLDWAR_SAF_CIVILPLAN_housing_08:0 "Coordinate Provincial Works"
 COLDWAR_SAF_CIVILPLAN_housing_08_desc:0 "Improve the coordination of local budgets and capital projects."
 COLDWAR_SAF_CIVILPLAN_housing_09:0 "Homes and Services"
 COLDWAR_SAF_CIVILPLAN_housing_09_desc:0 "Coordinate municipal construction and upkeep across housing districts, roads and utilities."
 COLDWAR_SAF_CIVILPLAN_agriculture_spirit:0 "Food from the Land"
 COLDWAR_SAF_CIVILPLAN_agriculture_spirit_desc:0 "Irrigation works, veterinary officers and rural depots keep farms productive and food moving to market. Their reach depends on the investment made in the countryside."
 COLDWAR_SAF_CIVILPLAN_agriculture_00:0 "Survey the Farms"
 COLDWAR_SAF_CIVILPLAN_agriculture_00_desc:0 "Assess the transport, water and processing needs of rural producers."
 COLDWAR_SAF_CIVILPLAN_agriculture_01:0 "Irrigate the Dry Districts"
 COLDWAR_SAF_CIVILPLAN_agriculture_01_desc:0 "Extend irrigation and transport infrastructure to agricultural districts, with capital costs borne by the treasury."
 COLDWAR_SAF_CIVILPLAN_agriculture_02:0 "Improve Storage and Distribution"
 COLDWAR_SAF_CIVILPLAN_agriculture_02_desc:0 "Reduce avoidable losses through more reliable storage and transport."
 COLDWAR_SAF_CIVILPLAN_agriculture_03:0 "Protect the Catchments"
 COLDWAR_SAF_CIVILPLAN_agriculture_03_desc:0 "Protect the water infrastructure on which producers depend."
 COLDWAR_SAF_CIVILPLAN_agriculture_04:0 "Improve Access to Markets"
 COLDWAR_SAF_CIVILPLAN_agriculture_04_desc:0 "Improve the handling and coordination of produce moving to market."
 COLDWAR_SAF_CIVILPLAN_agriculture_05:0 "Veterinary Field Services"
 COLDWAR_SAF_CIVILPLAN_agriculture_05_desc:0 "Support technical assistance that can protect agricultural production."
 COLDWAR_SAF_CIVILPLAN_agriculture_06:0 "Develop Local Food Processing"
 COLDWAR_SAF_CIVILPLAN_agriculture_06_desc:0 "Encourage processing capacity close to production centres."
 COLDWAR_SAF_CIVILPLAN_agriculture_07:0 "Research Better Crops"
 COLDWAR_SAF_CIVILPLAN_agriculture_07_desc:0 "Fund agricultural research and use its findings to improve infrastructure planning."
 COLDWAR_SAF_CIVILPLAN_agriculture_08:0 "Credit for Farming Equipment"
 COLDWAR_SAF_CIVILPLAN_agriculture_08_desc:0 "Improve oversight and administration of rural credit."
 COLDWAR_SAF_CIVILPLAN_agriculture_09:0 "Food from the Land"
 COLDWAR_SAF_CIVILPLAN_agriculture_09_desc:0 "Extend the gains from rural investment across South African farms."
 COLDWAR_SAF_ECONPLAN_root:0 "The South African Economy"
 COLDWAR_SAF_ECONPLAN_root_desc:0 "A national programme begins with a review of the needs of South Africa and the costs of meeting them."
 COLDWAR_SAF_ECONPLAN_minerals_spirit:0 "The Mineral Economy"
 COLDWAR_SAF_ECONPLAN_minerals_spirit_desc:0 "Gold and mineral exports bring in foreign exchange. Mines and refiners compete for rail capacity, skilled labour and investment."
 COLDWAR_SAF_ECONPLAN_minerals_00:0 "The Witwatersrand's Wealth"
 COLDWAR_SAF_ECONPLAN_minerals_00_desc:0 "The mineral economy brings wealth and employment, but ties our industrial development to demanding markets and infrastructure."
 COLDWAR_SAF_ECONPLAN_minerals_01:0 "Expand the Mining Houses"
 COLDWAR_SAF_ECONPLAN_minerals_01_desc:0 "The mineral economy brings wealth and employment, but ties our industrial development to demanding markets and infrastructure."
 COLDWAR_SAF_ECONPLAN_minerals_02:0 "Build Beyond the Mines"
 COLDWAR_SAF_ECONPLAN_minerals_02_desc:0 "The mineral economy brings wealth and employment, but ties our industrial development to demanding markets and infrastructure."
 COLDWAR_SAF_ECONPLAN_minerals_03:0 "Deep-Level Engineering"
 COLDWAR_SAF_ECONPLAN_minerals_03_desc:0 "The mineral economy brings wealth and employment, but ties our industrial development to demanding markets and infrastructure."
 COLDWAR_SAF_ECONPLAN_minerals_04:0 "Train Industrial Technicians"
 COLDWAR_SAF_ECONPLAN_minerals_04_desc:0 "The mineral economy brings wealth and employment, but ties our industrial development to demanding markets and infrastructure."
 COLDWAR_SAF_ECONPLAN_minerals_05:0 "The Railways to the Reef"
 COLDWAR_SAF_ECONPLAN_minerals_05_desc:0 "Fund a freight terminal to carry ore and industrial supplies between the mining districts and the national rail network."
 COLDWAR_SAF_ECONPLAN_minerals_06:0 "Move Ore to the Ports"
 COLDWAR_SAF_ECONPLAN_minerals_06_desc:0 "The mineral economy brings wealth and employment, but ties our industrial development to demanding markets and infrastructure."
 COLDWAR_SAF_ECONPLAN_minerals_07:0 "Connect the Inland Workshops"
 COLDWAR_SAF_ECONPLAN_minerals_07_desc:0 "The mineral economy brings wealth and employment, but ties our industrial development to demanding markets and infrastructure."
 COLDWAR_SAF_ECONPLAN_minerals_08:0 "Survey New Deposits"
 COLDWAR_SAF_ECONPLAN_minerals_08_desc:0 "The mineral economy brings wealth and employment, but ties our industrial development to demanding markets and infrastructure."
 COLDWAR_SAF_ECONPLAN_minerals_09:0 "A National Transport Network"
 COLDWAR_SAF_ECONPLAN_minerals_09_desc:0 "Bring the main freight corridors and local rail connections under a common investment and maintenance plan."
 COLDWAR_SAF_ECONPLAN_energy_spirit:0 "Coal and Fuel"
 COLDWAR_SAF_ECONPLAN_energy_spirit_desc:0 "Coalfields and strategic fuel reserves keep factories and transport running when imported supplies are uncertain."
 COLDWAR_SAF_ECONPLAN_energy_00:0 "The Coalfields of the Transvaal"
 COLDWAR_SAF_ECONPLAN_energy_00_desc:0 "Coal and domestic fuels offer security at a price. Government and industry must decide where scarce resources will go."
 COLDWAR_SAF_ECONPLAN_energy_01:0 "Expand Coal-to-Liquids"
 COLDWAR_SAF_ECONPLAN_energy_01_desc:0 "Coal and domestic fuels offer security at a price. Government and industry must decide where scarce resources will go."
 COLDWAR_SAF_ECONPLAN_energy_02:0 "Diversify the Fuel Supply"
 COLDWAR_SAF_ECONPLAN_energy_02_desc:0 "Coal and domestic fuels offer security at a price. Government and industry must decide where scarce resources will go."
 COLDWAR_SAF_ECONPLAN_energy_03:0 "Refine the Fischer-Tropsch Process"
 COLDWAR_SAF_ECONPLAN_energy_03_desc:0 "Coal and domestic fuels offer security at a price. Government and industry must decide where scarce resources will go."
 COLDWAR_SAF_ECONPLAN_energy_04:0 "Keep Fuel in Reserve"
 COLDWAR_SAF_ECONPLAN_energy_04_desc:0 "Construct a strategic depot in an eligible South African state to buffer interruptions in fuel supply."
 COLDWAR_SAF_ECONPLAN_energy_05:0 "The Engineers of Secunda"
 COLDWAR_SAF_ECONPLAN_energy_05_desc:0 "Train the engineers who will operate and maintain the new refinery equipment at Secunda."
 COLDWAR_SAF_ECONPLAN_energy_06:0 "Prioritise the Power Stations"
 COLDWAR_SAF_ECONPLAN_energy_06_desc:0 "Build a new fossil power plant to expand supply. The plant will need fuel and regular maintenance."
 COLDWAR_SAF_ECONPLAN_energy_07:0 "Export the Surplus Coal"
 COLDWAR_SAF_ECONPLAN_energy_07_desc:0 "Coal and domestic fuels offer security at a price. Government and industry must decide where scarce resources will go."
 COLDWAR_SAF_ECONPLAN_energy_08:0 "Manage Strategic Reserves"
 COLDWAR_SAF_ECONPLAN_energy_08_desc:0 "Coal and domestic fuels offer security at a price. Government and industry must decide where scarce resources will go."
 COLDWAR_SAF_ECONPLAN_energy_09:0 "An Energy System Under Pressure"
 COLDWAR_SAF_ECONPLAN_energy_09_desc:0 "Coordinate coal supply, storage and refinery output to keep reserve fuel available to the economy."
 COLDWAR_SAF_ECONPLAN_industry_spirit:0 "Industry and Trade"
 COLDWAR_SAF_ECONPLAN_industry_spirit_desc:0 "Manufacturers need export markets to grow and local buyers to sustain production. Pretoria can invest in either while deciding how much industrial capacity to build at home."
 COLDWAR_SAF_ECONPLAN_industry_00:0 "The Factories of the Rand"
 COLDWAR_SAF_ECONPLAN_industry_00_desc:0 "South Africa must decide how to balance industrial capacity, domestic demand and the foreign markets on which it depends."
 COLDWAR_SAF_ECONPLAN_industry_01:0 "Double Down on Export Markets"
 COLDWAR_SAF_ECONPLAN_industry_01_desc:0 "South Africa must decide how to balance industrial capacity, domestic demand and the foreign markets on which it depends."
 COLDWAR_SAF_ECONPLAN_industry_02:0 "Broaden the Domestic Economy"
 COLDWAR_SAF_ECONPLAN_industry_02_desc:0 "South Africa must decide how to balance industrial capacity, domestic demand and the foreign markets on which it depends."
 COLDWAR_SAF_ECONPLAN_industry_03:0 "Improve Port Handling"
 COLDWAR_SAF_ECONPLAN_industry_03_desc:0 "South Africa must decide how to balance industrial capacity, domestic demand and the foreign markets on which it depends."
 COLDWAR_SAF_ECONPLAN_industry_04:0 "Make Components at Home"
 COLDWAR_SAF_ECONPLAN_industry_04_desc:0 "South Africa must decide how to balance industrial capacity, domestic demand and the foreign markets on which it depends."
 COLDWAR_SAF_ECONPLAN_industry_05:0 "Industrial Development"
 COLDWAR_SAF_ECONPLAN_industry_05_desc:0 "The Industrial Development Corporation will finance a civilian factory and prepare its site for further investment."
 COLDWAR_SAF_ECONPLAN_industry_06:0 "Invest in Machine Tools"
 COLDWAR_SAF_ECONPLAN_industry_06_desc:0 "South Africa must decide how to balance industrial capacity, domestic demand and the foreign markets on which it depends."
 COLDWAR_SAF_ECONPLAN_industry_07:0 "Fund Technical Research"
 COLDWAR_SAF_ECONPLAN_industry_07_desc:0 "South Africa must decide how to balance industrial capacity, domestic demand and the foreign markets on which it depends."
 COLDWAR_SAF_ECONPLAN_industry_08:0 "Modernise the Freight Terminals"
 COLDWAR_SAF_ECONPLAN_industry_08_desc:0 "South Africa must decide how to balance industrial capacity, domestic demand and the foreign markets on which it depends."
 COLDWAR_SAF_ECONPLAN_industry_09:0 "A More Resilient Economy"
 COLDWAR_SAF_ECONPLAN_industry_09_desc:0 "Use the industrial base built through this programme to expand productive capacity and the construction sector."
 COLDWAR_SAF_CIVILPLAN_administration:0 "An Expanding Public Service"
 COLDWAR_SAF_CIVILPLAN_school_transport:0 "School Transport for the Districts"
 COLDWAR_SAF_CIVILPLAN_building_crews:0 "Training Local Building Crews"
 COLDWAR_SAF_CIVILPLAN_housing_plan:0 "A Funded Housing Plan"
 COLDWAR_SAF_ECONPLAN_mining_intensive:0 "Mining-Led Development"
 COLDWAR_SAF_ECONPLAN_mining_diversified:0 "A Broader Mineral Economy"
 COLDWAR_SAF_ECONPLAN_fuel_coal:0 "Coal and Synthetic Fuel"
 COLDWAR_SAF_ECONPLAN_fuel_diversified:0 "A Diversified Energy Supply"
 COLDWAR_SAF_ECONPLAN_export_intensive:0 "An Export-Led Economy"
 COLDWAR_SAF_ECONPLAN_export_diversified:0 "Industry Beyond the Mines"
 COLDWAR_SAF_PROJECT_category:0 "National Investment Projects"
 COLDWAR_SAF_PROJECT_category_desc:0 "Strategic projects require funds and a suitable site. Each project can be built once."
 COLDWAR_SAF_PROJECT_rail:0 "Modernise the Rail Network"
# IMPERIA COLD WAR — B4 MD standard fix (24.11.2026)
 COLDWAR_SAF_PROJECT_rail_desc:0 "Build one level of infrastructure and add one building slot in an eligible owned and controlled core state. The treasury cost is shown below."
 COLDWAR_SAF_PROJECT_factory:0 "Finance a Civilian Works Complex"
# IMPERIA COLD WAR — B4 MD standard fix (24.11.2026)
 COLDWAR_SAF_PROJECT_factory_desc:0 "Build one civilian factory and add one building slot in an eligible owned and controlled core state. The treasury cost is shown below."
 COLDWAR_SAF_PROJECT_fuel_silo:0 "Build a Strategic Fuel Depot"
# IMPERIA COLD WAR — B4 MD standard fix (24.11.2026)
 COLDWAR_SAF_PROJECT_fuel_silo_desc:0 "Build one fuel silo and add one building slot in an eligible owned and fully controlled core state. The treasury cost is shown below."
 COLDWAR_SAF_PROJECT_can_fund_tt:0 "The Treasury can cover the one-time payment"
 COLDWAR_SAF_DEFENCE_PROJECTS_category:0 "Defence and South West African Projects"
 COLDWAR_SAF_DEFENCE_PLAN_armscor_project:0 "Expand the Armscor Production Base"
 COLDWAR_SAF_DEFENCE_PLAN_armscor_project_desc:0 "A single national investment of $0.50 billion will establish an additional military factory in a suitable South African state."
 COLDWAR_SAF_DEFENCE_PLAN_radar_station:0 "Extend Radar Coverage"
 COLDWAR_SAF_DEFENCE_PLAN_radar_station_desc:0 "Spend $0.25 billion to add one radar station in a suitable state."
 COLDWAR_SAF_DEFENCE_PLAN_air_base:0 "Improve an Air Base"
 COLDWAR_SAF_DEFENCE_PLAN_air_base_desc:0 "Spend $0.40 billion to expand a suitable air base."
 COLDWAR_SAF_DEFENCE_PLAN_naval_base:0 "Improve Cape Town Harbour"
 COLDWAR_SAF_DEFENCE_PLAN_naval_base_desc:0 "Spend $0.50 billion to expand the naval base at Cape Town."
 COLDWAR_SAF_DEFENCE_PLAN_dockyard:0 "Expand the Dockyards"
 COLDWAR_SAF_DEFENCE_PLAN_dockyard_desc:0 "Spend $0.75 billion to add a dockyard in a suitable coastal state."
 COLDWAR_SAF_DEFENCE_PLAN_nam_rail_funding:0 "Fund the South West Rail Corridor"
 COLDWAR_SAF_DEFENCE_PLAN_nam_rail_funding_desc:0 "Spend $0.40 billion to improve infrastructure in an owned and controlled Namibian state."
 COLDWAR_SAF_DEFENCE_PLAN_nam_factory:0 "Invest in the South West"
 COLDWAR_SAF_DEFENCE_PLAN_nam_factory_desc:0 "Spend $0.60 billion for a civilian factory in an owned and controlled Namibian state with a free slot."
 COLDWAR_SAF_DEFENCE_PLAN_nam_integration:0 "Integrate South West Africa"
 COLDWAR_SAF_DEFENCE_PLAN_nam_integration_desc:0 "Spend $0.50 billion and 50 political power to add South African cores to both states while South Africa owns and controls them. Namibian cores remain."
 COLDWAR_SAF_DEFENCE_PLAN_research:0 "Fund Nuclear Research"
 COLDWAR_SAF_DEFENCE_PLAN_research_desc:0 "Spend $0.10 billion on the first programme milestone."
 COLDWAR_SAF_DEFENCE_PLAN_pilot:0 "Finance the Y-Plant"
 COLDWAR_SAF_DEFENCE_PLAN_pilot_desc:0 "After the research milestone, invest $0.30 billion in the pilot plant."
 COLDWAR_SAF_DEFENCE_PLAN_design:0 "Complete the Weapon Design"
 COLDWAR_SAF_DEFENCE_PLAN_design_desc:0 "After the pilot plant, spend $0.30 billion to complete the programme's design milestone."
 COLDWAR_SAF_DEFENCE_PLAN_facility:0 "Build the Pelindaba Research Facility"
 COLDWAR_SAF_DEFENCE_PLAN_facility_desc:0 "Spend $0.60 billion for a nuclear facility in an eligible North West state. This is separate from the $1.40 billion weapon programme and ongoing facility costs."
 COLDWAR_SAF_DEFENCE_PLAN_weapons_permitted_tt:0 "Nuclear weapons are permitted for South Africa under the game rules."
 COLDWAR_SAF_DEFENCE_PLAN_programme_active_tt:0 "The Pelindaba programme is active."
 COLDWAR_SAF_DEFENCE_PLAN_programme_funds_tt:0 "The treasury can cover the programme payment."
 COLDWAR_SAF_DEFENCE_PLAN_dismantle:0 "Dismantle the Arsenal"
 COLDWAR_SAF_DEFENCE_PLAN_dismantle_desc:0 "Return all nuclear missile wings to stockpile first. For $0.10 billion and 25 political power, suspend the programme and remove owned nuclear-missile stockpiles. Inspectors will review the remaining stockpile before recording disarmament."
 COLDWAR_SAF_DEFENCE_PLAN_rearm:0 "Restart the Nuclear Programme"
 COLDWAR_SAF_DEFENCE_PLAN_rearm_desc:0 "Pay $0.30 billion and 50 political power to resume the programme once the warhead project is complete. Outstanding focus orders may resume. Previously issued loads count towards the lifetime limit of six."
 COLDWAR_SAF_DEFENCE_PLAN_rearm_penalty:0 "Consequences of Rearmament"
 COLDWAR_SAF_DEFENCE_PLAN_verify_dismantlement:0 "Complete the Arsenal Audit"
 COLDWAR_SAF_DEFENCE_PLAN_verify_dismantlement_desc:0 "With all nuclear missile wings returned to stock, inspectors can remove remaining weapons and check the arsenal again without another programme charge."
 COLDWAR_SAF_DEFENCE_military_review:0 "A Unified Defence Review"
 COLDWAR_SAF_DEFENCE_military_review_desc:0 "The army must balance a long frontier, limited resources and the demands of an uncertain regional conflict."
 COLDWAR_SAF_DEFENCE_army_review:0 "Review the South African Army"
 COLDWAR_SAF_DEFENCE_army_review_desc:0 "The army must balance a long frontier, limited resources and the demands of an uncertain regional conflict."
 COLDWAR_SAF_DEFENCE_PLAN_army_1_0:0 "Mobile Columns"
 COLDWAR_SAF_DEFENCE_PLAN_army_1_0_desc:0 "The army must balance a long frontier, limited resources and the demands of an uncertain regional conflict."
 COLDWAR_SAF_DEFENCE_PLAN_army_1_1:0 "Hold the Frontier"
 COLDWAR_SAF_DEFENCE_PLAN_army_1_1_desc:0 "The army must balance a long frontier, limited resources and the demands of an uncertain regional conflict."
 COLDWAR_SAF_DEFENCE_PLAN_army_2_0:0 "Supply the Mobile Formations"
 COLDWAR_SAF_DEFENCE_PLAN_army_2_0_desc:0 "The army must balance a long frontier, limited resources and the demands of an uncertain regional conflict."
 COLDWAR_SAF_DEFENCE_PLAN_army_2_1:0 "A Network of Border Garrisons"
 COLDWAR_SAF_DEFENCE_PLAN_army_2_1_desc:0 "The army must balance a long frontier, limited resources and the demands of an uncertain regional conflict."
 COLDWAR_SAF_DEFENCE_PLAN_army_3_0:0 "A Domestic Arms Base"
 COLDWAR_SAF_DEFENCE_PLAN_army_3_0_desc:0 "The army must balance a long frontier, limited resources and the demands of an uncertain regional conflict."
 COLDWAR_SAF_DEFENCE_PLAN_army_4_0:0 "Prepare the Citizen Force"
 COLDWAR_SAF_DEFENCE_PLAN_army_4_0_desc:0 "The army must balance a long frontier, limited resources and the demands of an uncertain regional conflict."
 COLDWAR_SAF_DEFENCE_PLAN_army_4_1:0 "A Smaller Professional Core"
 COLDWAR_SAF_DEFENCE_PLAN_army_4_1_desc:0 "The army must balance a long frontier, limited resources and the demands of an uncertain regional conflict."
 COLDWAR_SAF_DEFENCE_PLAN_army_5_0:0 "A Regional Logistics Command"
 COLDWAR_SAF_DEFENCE_PLAN_army_5_0_desc:0 "The army must balance a long frontier, limited resources and the demands of an uncertain regional conflict."
 COLDWAR_SAF_DEFENCE_PLAN_army_6_0:0 "Ready for Regional Operations"
 COLDWAR_SAF_DEFENCE_PLAN_army_6_0_desc:0 "Bring the regional commands under a common planning process so the army can prepare and coordinate deployments."
 COLDWAR_SAF_AIRSEA_air_review:0 "Review the Air Force"
 COLDWAR_SAF_AIRSEA_air_review_desc:0 "The air force needs trained crews, serviceable aircraft and bases capable of supporting operations far from home."
