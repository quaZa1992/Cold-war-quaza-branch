 COLDWAR_SAF_DEFENCE_PLAN_navy_2_1:0 "Secure the Harbours"
 COLDWAR_SAF_DEFENCE_PLAN_navy_2_1_desc:0 "The Cape sea lanes demand a fleet suited to South Africa’s strategic needs and the resources available to it."
 COLDWAR_SAF_DEFENCE_PLAN_navy_3_0:0 "The Seamanship Schools"
