 COLDWAR_EGY_shadow_of_the_naksa:0 "Shadow of the Naksa"
 COLDWAR_EGY_shadow_of_the_naksa_desc:0 "Three years after the catastrophe of June 1967, Egypt is a nation at war without a victory to show for it. The Sinai lies under occupation, the Canal is shut, Soviet advisers fill the barracks and Nasser, weary and unwell, still carries the hopes of the Arab world. Every decision of the coming decade will be made in the shadow of the Naksa."
 COLDWAR_EGY_mobilise_the_home_front:0 "Mobilise the Home Front"
 COLDWAR_EGY_mobilise_the_home_front_desc:0 "A country that has lost a war cannot win the next one on enthusiasm alone. The Arab Socialist Union, the trade unions and the provincial committees are called upon to keep the factories running, the fellahin loyal and the sacrifice shared. Rationing is tolerated and conscripts are fed, so long as the people believe that the burden is being borne equally."
 COLDWAR_EGY_the_succession_question:0 "The Succession Question"
 COLDWAR_EGY_the_succession_question_desc:0 "Nasser's heart is failing, and everyone in Cairo knows it, though few dare say so aloud. Sadat, Sabri, Zakaria Mohieddin and the generals around Mohamed Fawzi each imagine themselves at the head of the republic. Behind the polite fiction of collective leadership, the struggle over who will inherit the Rais's authority has already begun."
 COLDWAR_EGY_doctors_from_moscow:0 "Doctors from Moscow"
 COLDWAR_EGY_doctors_from_moscow_desc:0 "Should the best cardiologists of the Soviet Union be flown to Cairo, the Rais might yet be spared. Moscow has every reason to keep the man who anchors its position on the Nile alive, and Nasser, however reluctantly, accepts treatment and rest. The succession is postponed, though not cancelled, and the republic holds its breath with every medical bulletin."
 COLDWAR_EGY_the_heir_apparent:0 "The Heir Apparent"
 COLDWAR_EGY_the_heir_apparent_desc:0 "Anwar Sadat, long dismissed as a loyal but colourless Free Officer, is named to carry the presidency after Nasser. To the generals and the party apparatus he looks like a safe transitional figure, a man to be managed rather than feared. His rivals in the Arab Socialist Union's inner circle have underestimated him, and they will come to regret it."
 COLDWAR_EGY_the_centres_of_power:0 "The Centres of Power Prevail"
 COLDWAR_EGY_the_centres_of_power_desc:0 "Should the men who built the security state refuse to be sidelined, the succession will be settled in the corridors of the Mukhabarat rather than at the ballot box. Ali Sabri and his allies move before any rival can consolidate, backed by Moscow's quiet approval. The Rais's heir is pushed aside, and the apparatus of Nasserism rules in its own name."
 COLDWAR_EGY_a_cabinet_of_experts:0 "A Cabinet of Experts"
 COLDWAR_EGY_a_cabinet_of_experts_desc:0 "With the old guard discredited and the army wary of open rule, a government of technocrats and elder statesmen is called to steady the ship. Zakaria Mohieddin, once named as Nasser's successor in the dark days of 1967, returns to office promising competence over ideology. Washington notices the change of tone, and so do the exhausted bureaucrats of Cairo."
 COLDWAR_EGY_the_army_steps_in:0 "The Army Steps In"
 COLDWAR_EGY_the_army_steps_in_desc:0 "When politicians quarrel over a dead man's legacy, the officers act. War Minister Mohamed Fawzi, backed by a General Staff that has little patience for party intrigue, assumes the leadership in the name of national survival. The republic remains, but it is now openly a state of soldiers, and the front along the Canal comes before everything else."
 COLDWAR_EGY_the_corrective_revolution:0 "The Corrective Revolution"
 COLDWAR_EGY_the_corrective_revolution_desc:0 "In May 1971 Sadat moves against those who thought he would be their puppet. Ali Sabri, Sami Sharaf, Sharawi Gomaa and their colleagues are arrested, and the heart of the Nasserist security state is dismantled almost overnight. The president calls it a corrective movement, and the burning of the intelligence tapes seems to promise a freer, if still firmly governed, Egypt."
 COLDWAR_EGY_a_president_in_his_own_right:0 "A President in His Own Right"
 COLDWAR_EGY_a_president_in_his_own_right_desc:0 "However the crisis was resolved, the question of who rules Egypt has finally been answered. The new leader no longer governs in the shadow of Nasser's portrait but under his own authority, with a plebiscite to confirm what the officers and ministers have already accepted. The state can now turn from survival to direction."
 COLDWAR_EGY_the_permanent_constitution:0 "The Permanent Constitution"
 COLDWAR_EGY_the_permanent_constitution_desc:0 "Egypt has lived under provisional constitutions since the fall of the monarchy. A permanent text is drafted to give the republic a settled legal order, defining the powers of the presidency, the role of the single party and the rights of its citizens. It is both a promise of stability and a statement of who is meant to hold the pen."
 COLDWAR_EGY_sharia_as_a_principal_source:0 "Sharia as a Principal Source"
 COLDWAR_EGY_sharia_as_a_principal_source_desc:0 "The drafters write that the principles of the Islamic sharia are a principal source of legislation. To the scholars of al-Azhar it is a vindication, to the Coptic minority a cause for unease, and to the president a useful counterweight to the left. Faith, once a matter for the mosque, is written into the foundations of the state."
 COLDWAR_EGY_the_secular_charter:0 "The Secular Charter"
 COLDWAR_EGY_the_secular_charter_desc:0 "Egypt, the charter declares, belongs to all its citizens alike, Muslim and Copt, and its laws are made by parliament rather than by scholars. The ulema of al-Azhar protest, but the engineers, lawyers and teachers of the modern state welcome a constitution that looks forward. Religion remains honoured, though it is not to be the source of law."
 COLDWAR_EGY_the_party_question:0 "The Party Question"
 COLDWAR_EGY_the_party_question_desc:0 "The Arab Socialist Union has been the only legal political organisation for over a decade, and it is showing its age. Some argue that unity requires a single party, others that pluralism must be allowed to breathe, and still others that the emergency must simply continue. The answer will define how Egyptians are permitted to argue with their government."
 COLDWAR_EGY_one_party_one_nation:0 "One Party, One Nation"
 COLDWAR_EGY_one_party_one_nation_desc:0 "The nation is at war and cannot afford the luxury of factions. A single organisation, drawing together peasants, workers, soldiers and civil servants, is declared the only legitimate vehicle of political life. Dissent is not forbidden outright but is expected to find its voice within the Union, and nowhere else."
 COLDWAR_EGY_open_the_platforms:0 "Open the Platforms (Manabir)"
 COLDWAR_EGY_open_the_platforms_desc:0 "In a bold experiment, the Arab Socialist Union is divided into platforms, or manabir, representing the left, the centre and the right. Out of these tribunes may grow genuine parties, with their own programmes and newspapers. Egypt's old liberals and leftists sense an opening, while the security services watch to see how far it will go."
 COLDWAR_EGY_the_emergency_law:0 "The Emergency Law"
 COLDWAR_EGY_the_emergency_law_desc:0 "The state of emergency, in force since 1967, is extended and given new teeth. Suspects may be held without trial, public gatherings need permission and the press learns where the lines are drawn. The government calls it the price of facing Israel, and the men of the Mukhabarat find themselves rarely idle."
 COLDWAR_EGY_egypts_place_in_the_world:0 "Egypt's Place in the World"
 COLDWAR_EGY_egypts_place_in_the_world_desc:0 "The years since Suez have taught Egypt that it has friends but no certainties. Cairo must now decide whether its future lies with the neutral states of the Third World, with Moscow, with Washington, with the faith of its people or with Egypt alone. The choice made here will shape every treaty and every alliance to come."
 COLDWAR_EGY_dir_positive_neutralism:0 "Positive Neutralism"
 COLDWAR_EGY_dir_positive_neutralism_desc:0 "Nasser's old creed of positive neutrality, forged at Bandung and Belgrade, is renewed. Egypt will take aid from whoever offers it but will serve no master, and will speak for the nations that refuse to be pawns of the great powers. It is a proud course, and a precarious one for a country at war."
 COLDWAR_EGY_dir_the_socialist_camp:0 "With the Socialist Camp"
 COLDWAR_EGY_dir_the_socialist_camp_desc:0 "The Soviet Union has rebuilt Egypt's army, financed the High Dam and stationed its crews along the Canal. It seems only natural to complete the journey and to align the republic openly with the socialist camp. Planners, advisers and ideologues arrive in growing numbers, convinced that the Nile's future lies in the East."
 COLDWAR_EGY_dir_the_american_card:0 "The American Card"
 COLDWAR_EGY_dir_the_american_card_desc:0 "Sadat's maxim is that ninety-nine percent of the cards in the Middle East are in American hands. Only Washington can compel Israel to withdraw from Sinai, and only Washington has the capital to lift the Egyptian economy. If Moscow's embrace has brought nothing but dependence, perhaps it is time to turn westward."
 COLDWAR_EGY_dir_the_believer_state:0 "The Believer State"
 COLDWAR_EGY_dir_the_believer_state_desc:0 "Defeat in 1967 discredited the secular promises of the revolution, and many Egyptians now look to the mosque for answers. The idea of a state guided by faith, rather than by slogans of socialism or nationalism, grows in the lecture halls and the poorer quarters of Cairo. The leadership must decide whether to ride this current or be swept aside by it."
 COLDWAR_EGY_dir_egypt_first:0 "Egypt First"
 COLDWAR_EGY_dir_egypt_first_desc:0 "Egypt has bled for causes that were never entirely its own, from Yemen to Palestine to the dream of Arab unity. A new voice argues that the nation must look first to its own soil, its own interests and its own five thousand years of history. The army, which has paid the highest price for pan-Arab ambitions, listens with interest."
 COLDWAR_EGY_na_voice_of_the_arabs:0 "Sawt al-Arab"
 COLDWAR_EGY_na_voice_of_the_arabs_desc:0 "From its Cairo studios, Sawt al-Arab has long carried the message of the revolution to every café and village square from the Atlantic to the Gulf. Under the new leadership the broadcasts are turned to the cause of independence and non-alignment, challenging the monarchs and rallying the street. The voice of Cairo may be hoarse, but it is still heard."
 COLDWAR_EGY_na_capital_of_liberation:0 "Cairo, Capital of Liberation"
 COLDWAR_EGY_na_capital_of_liberation_desc:0 "Algerian fighters, African nationalists and exiled movements from across the Third World have long found shelter in Cairo. By opening its offices, scholarships and training camps to them, Egypt claims a role as the capital of liberation. The cost is considerable, though the prestige repays it in friends who will remember."
 COLDWAR_EGY_na_the_brioni_spirit:0 "The Brioni Spirit"
 COLDWAR_EGY_na_the_brioni_spirit_desc:0 "At Brioni in 1956, Nasser, Tito and Nehru declared their refusal to join either bloc. That spirit is now revived in earnest, with Belgrade and New Delhi as natural partners in a world that wants to be neither red nor blue. Common projects, trade and diplomatic support give substance to what had been largely a slogan."
 COLDWAR_EGY_na_restore_the_asu:0 "Restore the Arab Socialist Union"
 COLDWAR_EGY_na_restore_the_asu_desc:0 "Should the non-aligned course be entrusted to the old movement, the Arab Socialist Union is restored as the vehicle of national life. Its committees are revived and its cadres return to the villages and factories. It is the familiar face of the revolution, comfortable and well organised, if somewhat tired."
 COLDWAR_EGY_na_strengthen_the_presidency:0 "Strengthen the Presidency"
 COLDWAR_EGY_na_strengthen_the_presidency_desc:0 "A strong presidency, above party and faction, is entrusted to a figure of experience and moderation. Zakaria Mohieddin and his circle of administrators promise efficient government without the fervour of ideology. Critics call it a technocratic monarchy, while supporters point to the order it brings."
 COLDWAR_EGY_na_legalise_the_brotherhood:0 "Legalise the Brotherhood"
 COLDWAR_EGY_na_legalise_the_brotherhood_desc:0 "After years of prison camps and executions, the Muslim Brotherhood emerges into public life. Its veteran leaders, led by the aged Umar al-Tilmisani, offer a moderate programme of piety, social welfare and constitutional rule. Secular Egyptians watch with apprehension as the movement that Nasser tried to destroy takes the reins of government."
 COLDWAR_EGY_na_the_independent_left:0 "The Independent Left"
 COLDWAR_EGY_na_the_independent_left_desc:0 "Veterans of the Free Officers who broke with the regime have kept alive a socialism that is neither Soviet nor authoritarian. Khaled Mohieddin and the National Progressive Unionist Party offer a left-wing government committed to workers' rights, civil liberties and independence from both blocs. It is a democratic experiment few thought possible."
 COLDWAR_EGY_na_the_new_class:0 "The New Class Takes Over"
 COLDWAR_EGY_na_the_new_class_desc:0 "Contractors, importers and well-connected managers have grown rich under the shelter of the state. With the opening of the economy, they now seek to govern directly rather than to buy influence. The business circle of Osman Ahmed Osman promises growth and prosperity, and the poor wonder whether they will share in it."
 COLDWAR_EGY_na_neither_east_nor_west:0 "Neither East nor West"
 COLDWAR_EGY_na_neither_east_nor_west_desc:0 "The government declares that Egypt will join no pact, host no foreign bases and bow to no capital. In the manner of Nasser's old doctrine, Cairo will seek its own path between the blocs. The words are bold, but the ministries must now find the means to make them credible."
 COLDWAR_EGY_na_lead_the_nam:0 "Lead the Non-Aligned Movement"
 COLDWAR_EGY_na_lead_the_nam_desc:0 "The Non-Aligned Movement was born in part from Egyptian initiative, and Cairo now claims its rightful place at the head of it. Summits, delegations and joint declarations carry the voice of the developing world into the councils of the great powers. A seat at the table is useful, even to a country that must still beg for spare parts."
 COLDWAR_EGY_na_arms_from_all_quarters:0 "Arms from All Quarters"
 COLDWAR_EGY_na_arms_from_all_quarters_desc:0 "Egypt's armoury has been Soviet for years, but a truly independent state cannot rely on a single supplier. Delegations travel to Paris, Belgrade, Beijing and beyond in search of aircraft, engines and ammunition. A diversified arsenal is harder to blackmail, if rather harder to maintain."
 COLDWAR_EGY_na_let_the_blocs_compete:0 "Let the Blocs Compete"
 COLDWAR_EGY_na_let_the_blocs_compete_desc:0 "Moscow and Washington are each eager to claim the Nile as their own, and Cairo has learned to turn their rivalry to advantage. Every offer of credit, wheat or weapons from one is carefully shown to the other. It is a delicate and sometimes dangerous game, played with great skill by the diplomats of the Foreign Ministry."
 COLDWAR_EGY_na_afro_asian_solidarity:0 "Afro-Asian Solidarity"
 COLDWAR_EGY_na_afro_asian_solidarity_desc:0 "From Addis Ababa to Dar es Salaam, newly independent states look to Cairo as an elder brother. Technical missions, teachers and trade agreements deepen the ties that were first sealed at Bandung. In the United Nations, a solid bloc of African and Asian votes will be there when Egypt needs them."
 COLDWAR_EGY_na_champion_of_the_third_world:0 "Champion of the Third World"
 COLDWAR_EGY_na_champion_of_the_third_world_desc:0 "Egypt has become a spokesman for all those who resent the order imposed by Washington and Moscow alike. The republic speaks for commodity producers, former colonies and small nations demanding fair treatment. Its influence now extends far beyond what its modest wealth would suggest."
 COLDWAR_EGY_na_the_notables:0 "A Government of Notables"
 COLDWAR_EGY_na_the_notables_desc:0 "The old families of the provinces, the omdas and landed notables who survived the land reforms, see their moment. A cabinet drawn from their ranks promises continuity, respect for property and a government that knows the countryside. Reformers warn that the Egypt of Nasser is being quietly unwound."
 COLDWAR_EGY_na_the_free_economy:0 "The Free Economy Takes Over"
 COLDWAR_EGY_na_the_free_economy_desc:0 "Free-market economists and importers argue that the Egyptian economy has been strangled by state control. A government committed to liberalisation promises to dismantle subsidies, open the markets and let private enterprise lead. The bazaar cheers, though the factory floors are anxious."
 COLDWAR_EGY_na_the_friends_of_the_nile:0 "The Friends of the Nile"
 COLDWAR_EGY_na_the_friends_of_the_nile_desc:0 "A new kind of politics emerges around the great river itself. Ecologists, agronomists and engineers warn of the silt held back by the High Dam, the salt creeping into the Delta and the fouling of the Nile. They ask Egypt to measure its progress not by tonnes of steel but by the health of the river that gave it life."
 COLDWAR_EGY_em_scientific_socialism:0 "Scientific Socialism"
 COLDWAR_EGY_em_scientific_socialism_desc:0 "Nasser's Arab socialism was always more instinct than doctrine. Now the ideologues of the Socialist Union argue for something firmer, a scientific socialism taught in the party schools and applied through the plan. Marxist economists, long tolerated on the margins, find themselves invited to the centre of policy."
 COLDWAR_EGY_em_advisers_in_every_ministry:0 "Advisers in Every Ministry"
 COLDWAR_EGY_em_advisers_in_every_ministry_desc:0 "Soviet specialists already train the army and run the missile batteries on the Canal. Now they are welcomed into the planning offices, the factories and the ministries themselves. Their guidance is invaluable, though some Egyptians mutter that they sit at the desk of every minister."
 COLDWAR_EGY_em_the_vanguard_organisation:0 "The Vanguard Organisation"
 COLDWAR_EGY_em_the_vanguard_organisation_desc:0 "Inside the Arab Socialist Union, a secret cadre known as the Vanguard Organisation has been quietly recruited from the most committed and trusted militants. Formalised and expanded, it becomes the disciplined core of the revolution, shaping policy from behind the scenes. Loyalty to the cause is rewarded, and doubt is noticed."
 COLDWAR_EGY_em_power_to_the_vanguard:0 "Power to the Vanguard"
 COLDWAR_EGY_em_power_to_the_vanguard_desc:0 "Ali Sabri and the Vanguard cadres take command of the state in their own name. The apparatus built over a decade, from the intelligence service to the party committees, is now unmistakably the government. Moscow nods with approval, and the more independent minds of the revolution fall silent."
 COLDWAR_EGY_em_power_to_the_communists:0 "Power to the Communists"
 COLDWAR_EGY_em_power_to_the_communists_desc:0 "The Egyptian communists dissolved their party in 1965 to join Nasser's Union, and have long worked within the system. Now their moment appears to have come, as veteran cadres emerge from the prison camps and the underground to claim the leadership. The red flag is raised over a country that has never been ruled by one."
 COLDWAR_EGY_em_power_to_the_councils:0 "All Power to the Councils"
 COLDWAR_EGY_em_power_to_the_councils_desc:0 "From the textile mills of Mahalla to the shipyards of Alexandria, workers declare that the revolution belongs to them rather than to the officials who speak for them. Councils elected on the factory floor seize the means of production and form the basis of a new government. It is a socialism from below, deeply unsettling to every established authority."
 COLDWAR_EGY_em_power_to_the_misr_party:0 "The Party of Order"
 COLDWAR_EGY_em_power_to_the_misr_party_desc:0 "Fearing the chaos of revolution, a coalition of officers, landowners and conservative bureaucrats installs a government of order. They promise to protect property, restrain the radicals and keep the Soviet advisers on a short leash. The language is still that of progress, though the spirit is one of caution."
 COLDWAR_EGY_em_power_to_the_islamic_front:0 "The Islamic Revolution"
 COLDWAR_EGY_em_power_to_the_islamic_front_desc:0 "A radical vision takes hold, in which the revolution is not socialist but Islamic, aimed at the overthrow of both the corrupt state and its foreign patrons. Inspired by events far beyond the Nile, activists and clerics rally to a new front. Their government makes the faith, rather than the plan, the engine of the revolution."
 COLDWAR_EGY_em_power_to_the_guardians:0 "The Guardians Seize Power"
 COLDWAR_EGY_em_power_to_the_guardians_desc:0 "A clerical leadership seizes the state in the name of the revolution, claiming that sovereignty belongs to the guardianship of the jurist rather than to the people or the party. The officers resist and the Azhar scholars are divided, but the new rulers are convinced that they carry a divine mandate. Egypt becomes a very different kind of republic."
 COLDWAR_EGY_em_the_progressive_front:0 "The Progressive National Front"
 COLDWAR_EGY_em_the_progressive_front_desc:0 "All the forces of the left, from Nasserist cadres to Marxist intellectuals and trade unionists, are gathered into a single Progressive National Front. Old disputes are set aside in the name of unity against reaction and imperialism. The Front is meant to be a broad coalition, though its leadership is firmly in the hands of the committed."
 COLDWAR_EGY_em_the_state_planning_committee:0 "The State Planning Committee"
 COLDWAR_EGY_em_the_state_planning_committee_desc:0 "A powerful planning committee is empowered to direct industry, agriculture and trade in accordance with the needs of the nation. Five-year plans are drafted with Soviet help, targets are set for steel, cotton and power, and the market is relegated to the margins. Efficiency is hoped for, though bureaucracy is feared."
 COLDWAR_EGY_em_comecon_partnership:0 "Comecon Partnership"
 COLDWAR_EGY_em_comecon_partnership_desc:0 "The trade of Egypt, long dominated by the purchase of cotton by the Eastern bloc, is brought into closer cooperation with the economies of Comecon. Moscow and its allies offer credits, machinery and technical expertise in exchange for lasting economic ties. The Nile valley is drawn further into a planned economic community."
 COLDWAR_EGY_em_peoples_militias:0 "People's Militias"
 COLDWAR_EGY_em_peoples_militias_desc:0 "Armed workers' and peasants' militias are raised in the factories and villages, drilled by army instructors and commanded by party loyalists. They guard the Canal towns, watch the streets and remind the regular army that the revolution has its own defenders. For many Egyptians it is the first time they have held a rifle."
 COLDWAR_EGY_em_join_the_socialist_camp:0 "Join the Socialist Camp"
 COLDWAR_EGY_em_join_the_socialist_camp_desc:0 "Egypt formally takes its place among the nations of the socialist camp. The long courtship with the East ends in an alliance, with all the obligations it carries. Cairo is now a pillar of the anti-imperialist front, rather than a wary guest."
 COLDWAR_EGY_em_red_star_over_the_nile:0 "Red Star over the Nile"
 COLDWAR_EGY_em_red_star_over_the_nile_desc:0 "The transformation is complete. From the Aswan Dam to the Delta, posters, plans and slogans proclaim a socialist Egypt, building a new society with the friendship of the socialist world. The pyramids look down on a very different kind of republic, and the Rais would hardly recognise it."
 COLDWAR_EGY_we_99_percent_of_the_cards:0 "99 Percent of the Cards"
 COLDWAR_EGY_we_99_percent_of_the_cards_desc:0 "Sadat's famous remark, that ninety-nine percent of the cards in the Middle East are held by America, becomes the guiding principle of foreign policy. Only through Washington can Egypt hope to recover Sinai peacefully and revive its economy. Cairo opens its channels to the State Department, and American diplomats begin to visit more often."
 COLDWAR_EGY_we_the_investment_law:0 "Law 43: The Investment Law"
 COLDWAR_EGY_we_the_investment_law_desc:0 "Law 43 invites foreign and Arab capital to Egypt on generous terms, with tax holidays, guarantees against nationalisation and freedom to repatriate profits. The architects of the Open Door hope for factories, hotels and banks. The trade unions, who built the public sector, fear what will become of their jobs."
 COLDWAR_EGY_we_lift_the_censorship:0 "Lift the Censorship"
 COLDWAR_EGY_we_lift_the_censorship_desc:0 "The censors who once sat in every newsroom are withdrawn, and Egyptian writers speak openly for the first time in years. Newspapers criticise ministers, satirists mock the establishment and political prisoners are quietly released. The government hopes that candour will win loyalty, though it also unleashes a flood of grievances."
 COLDWAR_EGY_we_power_to_the_ndp:0 "Found the National Democratic Party"
 COLDWAR_EGY_we_power_to_the_ndp_desc:0 "The president forms a new ruling party, drawn from the centre of the old Arab Socialist Union and open to businessmen, officials and the rural elite. Disciplined and pragmatic, it is meant to guide the Open Door without losing control of the state. It is a party of government rather than of ideas."
 COLDWAR_EGY_we_power_to_the_wafd:0 "The Wafd Returns"
 COLDWAR_EGY_we_power_to_the_wafd_desc:0 "The Wafd, the great nationalist party of Saad Zaghloul and Nahhas Pasha, returns from its long exile. Its elderly leaders, led by Fouad Serageddin, offer a government of liberal constitutionalism, free markets and respect for the law. For some it is a restoration, for others a reminder of the corrupt politics that the officers once overthrew."
 COLDWAR_EGY_we_power_to_the_liberals:0 "A Liberal Cabinet"
 COLDWAR_EGY_we_power_to_the_liberals_desc:0 "A cabinet of liberals comes to office, committed to economic freedom, the rule of law and a prudent foreign policy. Their programme is modest and their ministers experienced, with little patience for slogans. They promise an Egypt governed by reason, not by revolutionary fervour."
 COLDWAR_EGY_we_power_to_socialist_labour:0 "A Labour Government"
 COLDWAR_EGY_we_power_to_socialist_labour_desc:0 "Socialist Labour, a loyal opposition drawn from the old left of the Union, forms a government that embraces the West without abandoning the working class. It promises a welfare state, trade union rights and a social market economy. Its leaders hope to prove that openness need not mean inequality."
 COLDWAR_EGY_we_the_open_door:0 "The Open Door"
 COLDWAR_EGY_we_the_open_door_desc:0 "The Open Door, or Infitah, is proclaimed, and the economy is turned towards private enterprise and foreign capital. The sealed system of Nasserism gives way to imported goods, joint ventures and new fortunes along the Nile. Egyptians will be richer in some respects and more divided in others."
 COLDWAR_EGY_we_the_usaid_mission:0 "The USAID Mission"
 COLDWAR_EGY_we_the_usaid_mission_desc:0 "American aid officials open offices in Cairo for the first time in years. Wheat shipments, development loans and technical missions begin to flow along the diplomatic channel, proof of what friendship with Washington may bring. Egyptians ask what price will eventually be named."
 COLDWAR_EGY_we_the_imf_standby:0 "The IMF Standby Agreement"
 COLDWAR_EGY_we_the_imf_standby_desc:0 "To rescue the treasury, Egypt turns to the International Monetary Fund, which offers help on condition that the government cut its subsidies on bread, rice and cooking oil. The economists call it necessary medicine, and the poor of Cairo call it theft. The streets will deliver their own verdict."
 COLDWAR_EGY_we_step_by_step_diplomacy:0 "Step-by-Step Diplomacy"
 COLDWAR_EGY_we_step_by_step_diplomacy_desc:0 "Rather than seek a single grand settlement, Egypt entrusts itself to Henry Kissinger's patient diplomacy, in which small withdrawals build confidence for larger ones. The shuttle flights between Aswan, Jerusalem and Damascus become the pulse of regional politics. Each step is modest, but together they might lead somewhere."
 COLDWAR_EGY_we_join_the_free_world:0 "Join the Free World"
 COLDWAR_EGY_we_join_the_free_world_desc:0 "Egypt formally takes its place beside the Western democracies. Its markets, its diplomacy and its armed forces are increasingly woven into the Atlantic order, and the slogans of non-alignment give way to the language of partnership. After two decades of confrontation with the West, Cairo has chosen its side."
 COLDWAR_EGY_we_americas_partner:0 "America's Partner on the Nile"
 COLDWAR_EGY_we_americas_partner_desc:0 "Washington comes to regard Egypt as the keystone of its policy in the Middle East. Military cooperation, joint exercises and steady financial support follow, reinforced by the personal confidence between the two presidents. The most populous Arab state has become a pillar of the American order."
 COLDWAR_EGY_sa_the_gamaat_on_campus:0 "The Gama'at on Campus"
 COLDWAR_EGY_sa_the_gamaat_on_campus_desc:0 "In the universities of Cairo, Assiut and Minya, Islamic student groups are encouraged to challenge the Marxists and Nasserists who dominate campus life. Backed by the authorities, they win student elections and set new standards of dress and conduct. The movement they build will outgrow its sponsors."
 COLDWAR_EGY_sa_petrodollar_piety:0 "Petrodollar Piety"
 COLDWAR_EGY_sa_petrodollar_piety_desc:0 "Egyptian teachers, engineers and labourers travel to the Gulf, and return with money, conservative habits and a stricter piety. Saudi donors fund mosques, charities and religious schools along the Nile. Faith and finance have become inseparable partners in the shaping of public life."
 COLDWAR_EGY_sa_the_hisba:0 "Revive the Hisba"
 COLDWAR_EGY_sa_the_hisba_desc:0 "The ancient institution of the hisba, by which the community enjoins what is right and forbids what is wrong, is revived. Inspectors move through the markets and streets, watching weights, dress and public morals. Supporters see a return to virtue, while others see a licence for self-appointed guardians."
 COLDWAR_EGY_sa_power_to_the_azhar:0 "Power to the Scholars"
 COLDWAR_EGY_sa_power_to_the_azhar_desc:0 "The scholars of al-Azhar, guardians of Sunni learning for a thousand years, are called to govern. The Grand Imam Abd al-Halim Mahmud brings moderation, scholarship and the weight of tradition to the highest office of the state. The mosque and the ministry become one in a more orderly fashion than many feared."
 COLDWAR_EGY_sa_power_to_the_jamaat:0 "The Revolution of the Jama'at"
 COLDWAR_EGY_sa_power_to_the_jamaat_desc:0 "The young militants of the Jama'at, radicalised on campus and hardened in prison, decide that the existing order is beyond reform. Their uprising overthrows the old establishment and installs an Emir in the capital. The army is shaken, the streets are tense, and the revolution devours its elders."
 COLDWAR_EGY_sa_the_islamic_order:0 "The Islamic State of Egypt"
 COLDWAR_EGY_sa_the_islamic_order_desc:0 "Egypt is proclaimed an Islamic state, and the constitution, courts and schools are to be reshaped accordingly. The government presents the change as a return to the true foundations of the nation, and a repudiation of the failures of secular nationalism. A new republic begins, bound to the law of God."
 COLDWAR_EGY_sa_zakat_instead_of_taxes:0 "Zakat Instead of Taxes"
 COLDWAR_EGY_sa_zakat_instead_of_taxes_desc:0 "The religious duty of zakat is made the basis of public welfare, collected in the mosques and distributed to the poor. The state trusts charity and conscience to do what the planners of the socialist era could not. Many welcome the dignity of giving, though the treasury wonders how it will pay for roads and schools."
 COLDWAR_EGY_sa_islamic_economics:0 "Islamic Economics"
 COLDWAR_EGY_sa_islamic_economics_desc:0 "The banks of Egypt are reorganised on Islamic principles, with interest forbidden and profit shared between investor and borrower. Economists debate whether a modern economy can function in this way, while the devout watch with hope. It is an experiment on a national scale."
 COLDWAR_EGY_sa_the_pan_islamic_turn:0 "The Pan-Islamic Turn"
 COLDWAR_EGY_sa_the_pan_islamic_turn_desc:0 "The new Egypt looks beyond the Arab world to the wider community of believers. Riyadh, Islamabad and Khartoum receive delegations from Cairo, and the old rhetoric of Arab nationalism is replaced by that of Muslim brotherhood. The ummah, not the nation, becomes the horizon of Egyptian diplomacy."
 COLDWAR_EGY_sa_al_quds_first:0 "Al-Quds First"
 COLDWAR_EGY_sa_al_quds_first_desc:0 "The liberation of Jerusalem is proclaimed a duty of every Muslim, not merely of the Arabs. Sermons, camps and recruiting posters call the faithful to the defence of the third holiest city of Islam. Israel is no longer merely an enemy of the state but of the faith."
 COLDWAR_EGY_sa_dar_al_islam:0 "Dar al-Islam on the Nile"
 COLDWAR_EGY_sa_dar_al_islam_desc:0 "The transformation of Egyptian society is now far advanced. Law, education, commerce and the family are ordered by the principles of the faith, and the state sees itself as the keeper of a house of Islam on the Nile. For better or worse, the old republic is gone."
 COLDWAR_EGY_nt_faith_in_the_army:0 "Faith in the Army"
 COLDWAR_EGY_nt_faith_in_the_army_desc:0 "In the shadow of defeat, the army remains the one institution that Egyptians still believe can redeem the nation. Its officers, drawn from the villages and small towns, are held up as the embodiment of the people's will. Trust in the uniform is restored, and with it, expectations of those who wear it."
 COLDWAR_EGY_nt_pharaonic_heritage:0 "Pharaonic Heritage"
 COLDWAR_EGY_nt_pharaonic_heritage_desc:0 "Egypt is older than Islam, older than the Arabs and older than any of the nations that have lectured it on unity. Historians, artists and schoolbooks celebrate the Pharaohs as the nation's ancestors, and the monuments of Giza as its birthright. Arab brethren look on with unease at this reorientation of identity."
 COLDWAR_EGY_nt_the_officers_clubs:0 "The Officers' Clubs"
 COLDWAR_EGY_nt_the_officers_clubs_desc:0 "The officers' clubs of Cairo and Alexandria have long been places for meals, sport and conversation. Now they become the meeting places of a political class, where careers are made and plans are quietly drawn. The army is no longer merely a servant of the republic but its natural guardian."
 COLDWAR_EGY_nt_power_to_the_army:0 "The Supreme Council Takes Power"
 COLDWAR_EGY_nt_power_to_the_army_desc:0 "Field Marshals and Chiefs of Staff assume the government of Egypt in the name of the Supreme Council of the Armed Forces. Generals such as Saad el-Shazly and Mohamed Fawzi bring discipline, planning and a deep suspicion of civilian politicians. The republic is secure in their hands, though few are certain when they will give it back."
 COLDWAR_EGY_nt_power_to_young_egypt:0 "Young Egypt Rises"
 COLDWAR_EGY_nt_power_to_young_egypt_desc:0 "The old Misr al-Fatat, once the green-shirted youth movement of Egyptian nationalism, rises from obscurity. Its leaders promise discipline, honour and a rebirth of the nation under a populist banner. The Nile's youth respond to the call, and the old establishment looks on in alarm."
 COLDWAR_EGY_nt_power_to_the_rcc:0 "A New Revolutionary Command Council"
 COLDWAR_EGY_nt_power_to_the_rcc_desc:0 "Young colonels, impatient with their senior officers and with the failures of the revolution, form a new Revolutionary Command Council. They denounce corruption and compromise, and promise a harder, purer nationalism. The memory of 1952 hangs over them, for they intend to do it all again."
 COLDWAR_EGY_nt_restore_the_crown:0 "Restore the Crown"
 COLDWAR_EGY_nt_restore_the_crown_desc:0 "A surprising turn in the officers' councils brings the question of the monarchy back into the open. Fuad II, the infant king deposed in 1952, is invoked as a symbol of continuity above faction and politics. For some the throne is a relic, for others the only legitimate answer to a generation of revolutionary turmoil."
 COLDWAR_EGY_nt_the_officers_republic:0 "The Officers' Republic"
 COLDWAR_EGY_nt_the_officers_republic_desc:0 "The republic of the officers is openly declared, and the armed forces take the lead in public life. Governors, ministers and company directors are drawn from the ranks, and the logic of the barracks spreads through the state. Order and duty are the watchwords of the new Egypt."
 COLDWAR_EGY_nt_martial_law:0 "Martial Law"
 COLDWAR_EGY_nt_martial_law_desc:0 "Martial law is declared, and the military courts, patrols and curfews give the authorities the power to act without delay. Strikes are broken, demonstrations dispersed and troublemakers detained. The streets are calm, at least on the surface."
 COLDWAR_EGY_nt_the_war_economy:0 "The War Economy"
 COLDWAR_EGY_nt_the_war_economy_desc:0 "Egypt reorganises its economy for a long struggle. Factories are turned to military production, consumer goods are rationed, and civilian planning is subordinated to the needs of the army. It is a lean and austere regime, but it keeps the guns supplied."
 COLDWAR_EGY_nt_the_national_service_projects:0 "The National Service Projects Organisation"
 COLDWAR_EGY_nt_the_national_service_projects_desc:0 "The army builds its own economic empire. The National Service Projects Organisation takes on the production of everything from bottled water to pasta, using conscript labour and military engineers to supply the state. The generals have discovered that a nation's defence rests as much on its factories as on its tanks."
 COLDWAR_EGY_nt_egypt_above_all:0 "Egypt Above All"
 COLDWAR_EGY_nt_egypt_above_all_desc:0 "Egypt above all, say the posters, the speeches and the schoolbooks. Loyalty to the nation is placed before party, class and creed, and the citizen is asked to accept sacrifice for the sake of the whole. It is a stern gospel, but one that a proud and bruised country is ready to hear."
 COLDWAR_EGY_nt_a_nation_in_arms:0 "A Nation in Arms"
 COLDWAR_EGY_nt_a_nation_in_arms_desc:0 "From the schoolchild to the reservist, the whole population is drawn into the national defence. Military training, civil defence drills and the glorification of service become part of daily life. Egypt has become a nation in arms, with its army at the centre."
 COLDWAR_EGY_asu_the_arab_socialist_union:0 "The Arab Socialist Union"
 COLDWAR_EGY_asu_the_arab_socialist_union_desc:0 "Since 1962 the Arab Socialist Union has been the single political organisation of the Egyptian revolution, a pyramid of village, district and governorate committees reaching from the Delta to Aswan. Its ranks are swollen with officials, officers and ambitious local men who know that membership opens doors. If it can be made to work as more than a ceremonial machine, it may yet carry the republic through the hard years after the defeat."
 COLDWAR_EGY_asu_the_national_congress:0 "The National Congress"
 COLDWAR_EGY_asu_the_national_congress_desc:0 "The National Congress gathers delegates from the Union's committees in Cairo to approve the line of the leadership and to be seen approving it. Under Nasser such assemblies have been exercises in managed unity, yet they remain the only stage on which the regime must explain itself to its own cadres. A well-staged congress can restore confidence in the party after the shock of 1967."
 COLDWAR_EGY_asu_the_peoples_assembly:0 "Elections to the People's Assembly"
 COLDWAR_EGY_asu_the_peoples_assembly_desc:0 "Elections to the People's Assembly are held with candidates drawn from the Union's lists, half of them workers and peasants by decree. There is no party competition, but the ballot lends the regime a claim to popular consent and gives provincial notables a stake in the system. Critics call it a parliament without opposition; the government calls it democracy suited to a nation at war."
 COLDWAR_EGY_asu_the_institute_of_socialist_studies:0 "The Institute of Socialist Studies"
 COLDWAR_EGY_asu_the_institute_of_socialist_studies_desc:0 "The Institute of Socialist Studies trains the future cadres of the Union, schooling young officials in the theory of Arab socialism and in the art of mobilising villages and factories. Its lecturers argue over what the revolution actually means, and its graduates are expected to answer that question the same way. The Institute is meant to turn enthusiasm into discipline."
 COLDWAR_EGY_asu_whose_revolution:0 "Whose Revolution?"
 COLDWAR_EGY_asu_whose_revolution_desc:0 "Twenty years after the Free Officers seized power, Egyptians are asking whose revolution it has become. Is it the peasants' and workers', as the Charter claims, or that of the officers, bureaucrats and security men who run it in their name? The answer given in these years will determine whether the Union holds fast to Nasser's legacy or breaks with it."
 COLDWAR_EGY_asu_the_nasserist_line:0 "The Nasserist Line"
 COLDWAR_EGY_asu_the_nasserist_line_desc:0 "The leadership resolves to defend the Charter without apology: socialism at home, non-alignment abroad and the dignity of the fellah and the factory worker above the comfort of the new rich. Nasser's speeches become the scripture of the party, and doubters are reminded that the revolution gave Egyptians land, schools and pride. It is a path of loyalty to what has already been won."
 COLDWAR_EGY_asu_the_third_land_reform:0 "The Third Land Reform"
 COLDWAR_EGY_asu_the_third_land_reform_desc:0 "The Agrarian Reform of 1952 broke the great estates and that of 1961 cut them further, but the village still belongs to the few. A third law lowers the ceiling on private holdings once more and redistributes the surplus to landless families. The big families grumble and the harvest may suffer in the confusion, but the fellah finally sees the revolution reach his own field."
 COLDWAR_EGY_asu_the_graduate_guarantee:0 "The Graduate Guarantee"
 COLDWAR_EGY_asu_the_graduate_guarantee_desc:0 "Since the early sixties the state has promised every graduate of Egypt's universities a post in the civil service, and the promise has filled the ministries with clerks and made a generation loyal to the revolution. Renewed and extended, the guarantee keeps young men and women in the system rather than in the streets. The price is a bloated bureaucracy that grows with each graduating class."
 COLDWAR_EGY_asu_the_socialist_youth_organisation:0 "The Socialist Youth Organisation"
 COLDWAR_EGY_asu_the_socialist_youth_organisation_desc:0 "The Socialist Youth Organisation takes the revolution into the schools, universities and factories, offering camps, study circles and a path of advancement to those who join. Its founders hope to raise a generation that knows Nasser's Egypt as the only Egypt there has ever been. Its critics say it breeds careerists and informers, but few doubt that it reaches where the old party never did."
 COLDWAR_EGY_asu_guardians_of_arabism:0 "Guardians of Arabism"
 COLDWAR_EGY_asu_guardians_of_arabism_desc:0 "From Cairo's microphones the revolution has always spoken to the whole Arab world, and the Union now gives that mission an organisation. Delegations, scholarships, party contacts and broadcasts carry the message of unity to Damascus, Baghdad, Tripoli, Sanaa and Khartoum. Egypt, the argument runs, is not one country among many but the guardian of the Arab cause."
 COLDWAR_EGY_asu_the_charter_renewed:0 "The National Charter Renewed"
 COLDWAR_EGY_asu_the_charter_renewed_desc:0 "A renewed National Charter is drafted for the new decade, restating the principles of 1962 in the light of defeat, war and a changing world. It speaks more carefully about the role of the state, tolerates some pragmatism and promises that socialism and national dignity can be defended together. Many in the party see it as the revolution's second founding document."
 COLDWAR_EGY_asu_the_sadatist_turn:0 "The Sadatist Turn"
 COLDWAR_EGY_asu_the_sadatist_turn_desc:0 "The old formulas of the revolution are put quietly aside as the leadership turns toward a different course. Anwar Sadat, long dismissed as a pliant companion of Nasser, shows that he intends to govern in his own right, balancing the army, the religious establishment and the West against the Soviet-backed old guard. What began as a change of tone becomes a change of direction."
 COLDWAR_EGY_asu_release_the_prisoners:0 "Release the Political Prisoners"
 COLDWAR_EGY_asu_release_the_prisoners_desc:0 "The prison gates open for Muslim Brothers and other detainees who have languished since the Nasser years, and the newly freed carry their stories home to the villages and mosques. For the president it is a way of showing that a new era has begun, and of finding allies against the Marxists and Nasserists. For the Brotherhood it is a chance to return to public life."
 COLDWAR_EGY_asu_the_believer_president:0 "The Believer President"
 COLDWAR_EGY_asu_the_believer_president_desc:0 "Anwar Sadat presents himself as the Believer President, a man who prays before the cameras and speaks of faith and science as the foundation of the state. Al-Azhar is courted and the pulpit becomes a tool of government, while religious feeling is turned against the left. It is a powerful image, though one that may prove difficult to control."
 COLDWAR_EGY_asu_a_state_of_law:0 "A State of Law"
 COLDWAR_EGY_asu_a_state_of_law_desc:0 "The president announces that the age of the midnight knock is over and that Egypt will be a state of institutions and law. The tapes of the security services are burned on television, the powers of the sequestrators are curbed and the courts are promised independence. Whether this is genuine reform or merely the consolidation of one man's rule, the change is felt in every ministry."
 COLDWAR_EGY_asu_open_the_press:0 "Open the Press"
 COLDWAR_EGY_asu_open_the_press_desc:0 "Censorship is relaxed and the newspapers are allowed to publish criticism, argument and foreign opinion that would have been unthinkable before. The editors of al-Ahram and the provincial dailies test the limits of what may be said, and the Cairo cafes buzz with debate. The government hopes that an open press will win over the educated classes, even if some of what they read is unwelcome."
 COLDWAR_EGY_asu_dissolve_the_union:0 "Dissolve the Union"
 COLDWAR_EGY_asu_dissolve_the_union_desc:0 "After years of reform, the Arab Socialist Union has become an empty shell, and the president decides to retire it. In its place rises a centrist party of government, the National Democratic Party, more suited to a state that courts Washington and foreign capital. The old Nasserists see the end of an era; the new ruling class sees only the start of one."
 COLDWAR_EGY_asu_the_second_era:0 "The Second Era of the Revolution"
 COLDWAR_EGY_asu_the_second_era_desc:0 "The first era of the revolution, one of struggle, mobilisation and war, is drawing to its close. Egypt now looks to consolidate what it has built and to prepare for a succession that must come sooner or later. The party elders, the army and the security services all know that the choice of who leads the Union into the 1980s will decide the character of the state."
 COLDWAR_EGY_asu_the_vice_president:0 "The Vice President's Hour"
 COLDWAR_EGY_asu_the_vice_president_desc:0 "The Vice President, a former air force commander admired for his discipline and his silence, is called to lead the party into the new decade. He is no ideologue and has little taste for speeches, but the officer corps trusts him and the bureaucracy finds him predictable. With him, the regime promises stability above all else."
 COLDWAR_EGY_asu_the_party_ideologues:0 "The Party Ideologues"
 COLDWAR_EGY_asu_the_party_ideologues_desc:0 "The party's old ideologues, veterans of the Institute and the Charter drafts, move to take the reins themselves. They believe the revolution has been lost to cautious technocrats and corrupt officials and that only a purified Union can restore its mission. To the army and the businessmen this is a return to the dogmatism of the sixties; to the believers it is long overdue."
 COLDWAR_EGY_asu_the_rais_for_life:0 "The Rais for Life"
 COLDWAR_EGY_asu_the_rais_for_life_desc:0 "The constitution is amended and the limit on presidential terms falls away, making the Rais president for as long as he cares to serve. Loyal deputies hail the decision as a mark of the nation's trust, while critics warn that Egypt has acquired a new pharaoh in all but name. The state centres itself ever more firmly on a single man."
 COLDWAR_EGY_asu_the_revolution_secured:0 "The Revolution Secured"
 COLDWAR_EGY_asu_the_revolution_secured_desc:0 "Decades after the Free Officers took the Abdin Palace, the revolution seems finally to rest on firm ground. The party is led, the economy turns, the frontiers are guarded and the people have a stake in the order they live in. Egypt can tell itself that the sacrifices of the sixties were not made in vain."
 COLDWAR_EGY_asu_audit_the_public_sector:0 "Audit the Public Sector"
 COLDWAR_EGY_asu_audit_the_public_sector_desc:0 "The public sector employs hundreds of thousands, yet no one in Cairo can say precisely what it owns or what it earns. Teams of auditors descend on the mills, ports and ministries, uncovering idle workers, forgotten assets and private enrichment under cover of state ownership. The inquiry offers a first step toward restoring the discipline that the revolution is said to demand."
 COLDWAR_EGY_asu_command_of_the_public_sector:0 "Command of the Public Sector"
 COLDWAR_EGY_asu_command_of_the_public_sector_desc:0 "The leadership resolves that the commanding heights of the economy must remain in public hands. Steel, textiles, power and transport are drawn tighter under ministerial control, and the great works of Helwan are expected to lead the nation toward industrial self-reliance. For the planners the state is the only agent big enough to bring Egypt out of poverty."
 COLDWAR_EGY_asu_a_ministry_of_planning:0 "A Ministry of Planning"
 COLDWAR_EGY_asu_a_ministry_of_planning_desc:0 "A reorganised Ministry of Planning is given the authority to set targets and allocate scarce foreign exchange among competing factories, ports and ministries. Its officials draw up balance sheets that few could have imagined a decade earlier, and they insist that a poor country at war cannot afford to waste a single pound. The plan becomes the language in which the state speaks to itself."
 COLDWAR_EGY_asu_heavy_industry_first:0 "Heavy Industry First"
 COLDWAR_EGY_asu_heavy_industry_first_desc:0 "Egypt's leaders have long dreamed of a self-sufficient industrial base, and the steelworks at Helwan are the proof that the dream can be built in concrete. Resources are directed to iron, steel, engineering and chemicals before consumer goods, with Soviet technicians supervising the plant. It is a hard bargain, but it promises independence from foreign suppliers."
 COLDWAR_EGY_asu_workers_on_the_boards:0 "Workers on the Boards"
 COLDWAR_EGY_asu_workers_on_the_boards_desc:0 "Workers' representatives are given seats on the boards of public companies, and a share of profit is set aside for them. The reform is presented as proof that the revolution does belong to the working man and not just to the manager. Foremen and union men learn to read balance sheets, while managers learn to live with their new colleagues."
 COLDWAR_EGY_asu_the_second_five_year_plan:0 "The Second Five-Year Plan"
 COLDWAR_EGY_asu_the_second_five_year_plan_desc:0 "The second five-year plan is announced with great ceremony, promising new factories, higher output and better wages from the Delta to Upper Egypt. It rests on loans, Soviet machinery and the patience of a nation under arms. If it succeeds, it will show that socialism can build as well as defend; if it fails, it will be remembered as one more promise of the old regime."
 COLDWAR_EGY_asu_return_the_sequestrated:0 "Return the Sequestrated Property"
 COLDWAR_EGY_asu_return_the_sequestrated_desc:0 "After years of sequestration, many families whose property was seized in the sixties are told that their assets will be returned. Landowners, merchants and old industrial houses emerge from the shadows, and the middle class gains new confidence. For the Nasserists it is a betrayal of the revolution; for the pragmatists it is the price of renewing the economy."
 COLDWAR_EGY_asu_the_october_paper:0 "The October Paper"
 COLDWAR_EGY_asu_the_october_paper_desc:0 "After the crossing of the Canal, the president issues the October Paper, a document calling for economic opening and the revival of private investment. Its authors argue that Egypt, having won back its pride on the battlefield, must now win its prosperity in the marketplace. The word Infitah, the opening, enters the political vocabulary and will not leave it for decades."
 COLDWAR_EGY_asu_the_economic_opening_law:0 "The Economic Opening Law"
 COLDWAR_EGY_asu_the_economic_opening_law_desc:0 "A new investment law offers foreign companies guarantees against nationalisation, relief from duties and the right to repatriate their profits. Bankers and contractors arrive in Cairo; free zones are planned at the Canal and Alexandria. Supporters see capital and technology flowing in at last, while sceptics fear that Egypt is selling its economic independence."
 COLDWAR_EGY_asu_petrodollars_to_cairo:0 "Petrodollars to Cairo"
 COLDWAR_EGY_asu_petrodollars_to_cairo_desc:0 "The oil price rise has made Riyadh, Kuwait and Abu Dhabi rich beyond imagining, and Cairo sends envoys to remind them of Egypt's sacrifices for the Arab cause. In return for political friendship and sound projects, the Gulf states are invited to invest in Egyptian banks, land and industry. It is an uneasy partnership between the Arab world's largest army and its largest bank accounts."
 COLDWAR_EGY_asu_the_new_middle_class:0 "The New Middle Class"
 COLDWAR_EGY_asu_the_new_middle_class_desc:0 "A new class of engineers, importers, managers and civil servants moves into modern flats, buys imported goods and sends its children to private schools. They are the beneficiaries of the opening, and their loyalty is to the order that allowed them to prosper. The state builds for them, sometimes at the expense of those who remain in the old quarters."
 COLDWAR_EGY_asu_an_economy_of_the_people:0 "An Economy of the People"
 COLDWAR_EGY_asu_an_economy_of_the_people_desc:0 "At last an economy emerges that serves the many rather than the few, with factories, farms, cooperatives and private enterprises each finding their place. The planners claim vindication and the people see more on the market stalls. The revolution can say it has not merely survived but delivered something tangible to the Egyptian household."
 COLDWAR_EGY_asu_the_cotton_marketing_board:0 "The Cotton Marketing Board"
 COLDWAR_EGY_asu_the_cotton_marketing_board_desc:0 "Cotton has been Egypt's wealth and burden since the days of Muhammad Ali, and the state now controls its sale to the world. The Marketing Board buys from the growers at fixed prices and sells at world rates, using the difference to finance the state's other ambitions. The system provides revenue and a degree of control, but the grower often feels he is the one who pays."
 COLDWAR_EGY_asu_the_consumer_cooperatives:0 "The Consumer Cooperatives"
 COLDWAR_EGY_asu_the_consumer_cooperatives_desc:0 "Consumer cooperatives open in towns and villages, selling subsidised bread, oil, sugar and tea at prices the poor can afford. The shop with a state sign over the door becomes one of the most visible signs of the revolution in daily life. Queues form, shortages come and go, but few Egyptians would wish to see the cooperatives disappear."
 COLDWAR_EGY_asu_progressive_taxation:0 "Progressive Taxation"
 COLDWAR_EGY_asu_progressive_taxation_desc:0 "The tax system is reshaped to take more from the wealthy and less from those who work with their hands. Landowners, merchants and the new contractors face higher rates, while wage earners are spared. The measure is defended as a matter of simple justice, and the revenues are earmarked for schools, clinics and the war effort."
 COLDWAR_EGY_asu_free_healthcare_for_all:0 "Free Healthcare for All"
 COLDWAR_EGY_asu_free_healthcare_for_all_desc:0 "Clinics and hospitals are opened in provincial towns and rural districts, where a fellah once had to choose between an expensive doctor and no doctor at all. The state promises treatment without payment, a claim which is not always true in practice but which marks a real change. Bilharzia, trachoma and infant mortality are the enemies the new health service is built to fight."
 COLDWAR_EGY_asu_export_drive:0 "Export Drive"
 COLDWAR_EGY_asu_export_drive_desc:0 "Egypt must earn foreign exchange if it is to pay for wheat, machines and weapons, and the leadership launches a campaign to sell more of the country's output abroad. Cotton, textiles, rice and processed goods are pushed on Eastern and Western markets alike. Success means a stronger pound and fewer humiliating visits to creditors."
 COLDWAR_EGY_asu_the_aswan_dividend:0 "The Aswan Dividend"
 COLDWAR_EGY_asu_the_aswan_dividend_desc:0 "The High Dam, built with Soviet help against fierce Western opposition, now stands as the great monument of the revolution. Its turbines supply electricity to the Nile Valley, its reservoir regulates the river, and its power lines carry light to villages that never knew it. The dividend, long promised, begins to be paid in factories, fields and homes."
 COLDWAR_EGY_asu_the_voice_of_cairo:0 "The Voice of Cairo"
 COLDWAR_EGY_asu_the_voice_of_cairo_desc:0 "From the Sawt al-Arab transmitters, the voice of Cairo reaches coffeehouses and barracks from Morocco to the Gulf. The broadcasts carry news, song and political argument in the accents of Egyptian Arabic, and they have done more to spread the revolution than any army. The Union now seeks to make the most of this extraordinary asset."
 COLDWAR_EGY_asu_the_eastern_flank:0 "The Eastern Flank"
 COLDWAR_EGY_asu_the_eastern_flank_desc:0 "The front with Israel runs along the Canal, but Egypt's strategic gaze also turns east, to Damascus, Baghdad and Amman. Cairo works to bind Syria and Iraq to its policy, to steady Jordan and to support the Palestinian cause on the Eastern Front. A united front in the Mashriq might at last make Israel face a threat on more than one frontier."
 COLDWAR_EGY_asu_the_southern_flank:0 "The Southern Flank"
 COLDWAR_EGY_asu_the_southern_flank_desc:0 "With Libya under Colonel Gaddafi and Sudan under Nimeiry, both new regimes steeped in Nasser's example, Egypt sees a chance to secure its southern and western flanks. The Tripoli Charter of 1969 pledged the three countries to common cause. Strengthened by their friendship, Cairo can look to the Nile and the desert as allies rather than risks."
 COLDWAR_EGY_asu_the_mukhabarat_of_the_party:0 "The Party's Mukhabarat"
 COLDWAR_EGY_asu_the_mukhabarat_of_the_party_desc:0 "The security services are brought within the Union's discipline, with party men set to watch the officers and the officers to watch the party. Informers sit in factories, universities and ministries, and files on the unreliable multiply. To its defenders this is a vigilant guard against conspiracies; to its critics it is the old fear in new clothes."
 COLDWAR_EGY_asu_civilian_control_of_security:0 "Civilian Control of Security"
 COLDWAR_EGY_asu_civilian_control_of_security_desc:0 "The leadership resolves that the secret services must answer to the party and to the law, not to ambitious men in the Interior Ministry. Powers of arrest are curbed, committees oversee the files, and officers of the Mukhabarat find themselves summoned to explain their budgets. The change is a quiet one, but many in Egypt remember the long years of fear."
 COLDWAR_EGY_tp_the_technocratic_presidency:0 "The Technocratic Presidency"
 COLDWAR_EGY_tp_the_technocratic_presidency_desc:0 "With the revolutionary slogans spent and the treasury empty, Egypt turns to the engineers, economists and administrators who have long kept the state running. Zakaria Mohieddin, a Free Officer with a reputation for cool competence and little taste for rhetoric, is called to head a presidency of experts. The promise is simple: fewer speeches, more results."
 COLDWAR_EGY_tp_the_council_of_ministers:0 "The Council of Ministers"
 COLDWAR_EGY_tp_the_council_of_ministers_desc:0 "The Council of Ministers is reconstituted as a body of specialists, with portfolios allotted by competence rather than by loyalty or revolutionary seniority. Engineers run the power stations, economists the treasury, and diplomats the foreign ministry. The politicians grumble, but the president answers that a country at war has no time for amateurs."
 COLDWAR_EGY_tp_mohieddins_path:0 "Mohieddin's Path"
 COLDWAR_EGY_tp_mohieddins_path_desc:0 "Zakaria Mohieddin has never been a popular figure, yet he is respected as a man who understands how the state works and what it can afford. His course is neither a rejection of the revolution nor a defence of it, but a sober attempt to manage its consequences. The first question before him is whether Egypt needs calm or speed."
 COLDWAR_EGY_tp_stabilisation_first:0 "Stabilisation First"
 COLDWAR_EGY_tp_stabilisation_first_desc:0 "The government decides that the first task is to calm the economy: contain prices, restrain spending and rebuild confidence before attempting anything bolder. Subsidies are examined with a sceptical eye, and the Central Bank is given room to breathe. It is an unglamorous programme, but the technocrats believe that a stable pound is worth more than any grand plan."
 COLDWAR_EGY_tp_growth_first:0 "Growth First"
 COLDWAR_EGY_tp_growth_first_desc:0 "The technocrats argue that Egypt cannot save its way out of poverty and that the country must grow, even at the cost of some borrowing. Credit is directed to projects that promise returns within a few years, and ministers are told to cut through delays. The risk is a larger debt; the reward, a working economy at last."
 COLDWAR_EGY_tp_merit_in_the_civil_service:0 "Merit in the Civil Service"
 COLDWAR_EGY_tp_merit_in_the_civil_service_desc:0 "Appointments in the ministries have long depended on family, party loyalty or the right word in the right ear. A new regime of examinations and promotion boards seeks to put the ablest candidates in the right posts and to close the door on the idle and the connected. The old guard of the bureaucracy resists quietly, as it always has."
 COLDWAR_EGY_tp_administrative_reform:0 "Administrative Reform"
 COLDWAR_EGY_tp_administrative_reform_desc:0 "The government sets about the tangled administration inherited from three revolutions, merging overlapping agencies and trimming layers of paperwork that every Egyptian has cursed at some point. Directors are made answerable for results, and files that once took months now move in weeks. A leaner machine is expected to serve a better-governed country."
 COLDWAR_EGY_tp_the_governorates_reform:0 "The Governorates Reform"
 COLDWAR_EGY_tp_the_governorates_reform_desc:0 "Power is moved outward from the ministries of Cairo to the governors and local councils of the provinces. Roads, schools and water supplies are planned closer to the people they serve, and provincial officials gain some of the authority they have long sought. The experiment reveals how much of the country has been run from a single desk on the Nile."
 COLDWAR_EGY_tp_the_late_question:0 "Who Governs After Us?"
 COLDWAR_EGY_tp_the_late_question_desc:0 "As the years pass, the question that no minister likes to raise becomes difficult to avoid: what happens when this government has done its work? A state ruled by experts still needs a source of legitimacy, and the people will in time ask who has the right to govern them. The president must choose between strengthening his office and sharing authority."
 COLDWAR_EGY_tp_a_strong_presidency:0 "A Strong Presidency"
 COLDWAR_EGY_tp_a_strong_presidency_desc:0 "The president concludes that a country as fragile as Egypt cannot afford a weak executive, and his office is endowed with wide powers to appoint, dismiss and decree. Ministers answer to him alone, and the assembly is relegated to a modest advisory role. The technocrat becomes something greater than a technocrat, and the stability of the state comes to rest on one man."
 COLDWAR_EGY_tp_return_power_to_the_assembly:0 "Return Power to the Assembly"
 COLDWAR_EGY_tp_return_power_to_the_assembly_desc:0 "The president announces that the government of experts has fulfilled its purpose and that power should now return to the elected representatives of the people. Parties are allowed to organise, the assembly regains its voice, and ministers must justify their decisions before deputies. It is a risky step, but one that offers the republic a more durable foundation."
 COLDWAR_EGY_tp_budget_discipline:0 "Budget Discipline"
 COLDWAR_EGY_tp_budget_discipline_desc:0 "The treasury insists that Egypt cannot go on spending money it does not have. Ministries are required to account for every pound, the subsidy bill comes under scrutiny, and the budget is balanced on paper before it is balanced in life. The trade unions protest, but the finance minister calmly replies that discipline now is cheaper than a crisis later."
 COLDWAR_EGY_tp_negotiate_with_the_imf:0 "Negotiate with the IMF"
 COLDWAR_EGY_tp_negotiate_with_the_imf_desc:0 "Egyptian officials travel to Washington to negotiate with the International Monetary Fund, cap in hand but with a clear list of what they will and will not accept. A loan promises relief for the exchequer, but the conditions mean tighter budgets and the loss of some cherished subsidies. Whatever the outcome, the streets of Cairo will have a view on it."
 COLDWAR_EGY_tp_devalue_the_pound:0 "Devalue the Egyptian Pound"
 COLDWAR_EGY_tp_devalue_the_pound_desc:0 "The Egyptian pound has for years been held at an artificial rate that favours importers and penalises exporters. The government now allows it to fall, hoping to make cotton, textiles and other goods competitive on world markets. The shopkeeper and the housewife will feel the pinch, and the minister must explain why that pinch is necessary."
 COLDWAR_EGY_tp_the_tax_reform:0 "The Tax Reform"
 COLDWAR_EGY_tp_the_tax_reform_desc:0 "Egypt's tax system is a patchwork of exemptions, special cases and unenforced rates that bring in little and irritate many. The ministry of finance replaces it with a simpler code, with clear rates and stricter collection. Merchants who once paid little now find an inspector at the door, and the treasury sees its income grow."
 COLDWAR_EGY_tp_the_customs_reform:0 "The Customs Reform"
 COLDWAR_EGY_tp_the_customs_reform_desc:0 "Goods entering Egypt through Alexandria, Port Said and Suez have long been subject to a maze of duties, permits and informal fees. The customs service is overhauled, tariffs are simplified and smuggling is attacked in earnest. Honest traders welcome the change; those who profited from confusion do not."
 COLDWAR_EGY_tp_the_planning_institute:0 "The National Planning Institute"
 COLDWAR_EGY_tp_the_planning_institute_desc:0 "The National Planning Institute gathers economists, statisticians and engineers to study the country's resources and to suggest where each pound would do the most good. Its reports are dry but pointed, and ministers who ignore them do so at their peril. For the first time the government has a body able to say what the nation actually produces."
 COLDWAR_EGY_tp_autonomy_for_state_enterprises:0 "Autonomy for State Enterprises"
 COLDWAR_EGY_tp_autonomy_for_state_enterprises_desc:0 "State companies are given freedom to set their own prices, hire their own managers and keep part of their profits. The supervising ministries lose some of their power, and factory directors are told that they will be judged on results, not obedience. If the experiment works, the public sector may at last begin to resemble a business."
 COLDWAR_EGY_tp_energy_price_reform:0 "Energy Price Reform"
 COLDWAR_EGY_tp_energy_price_reform_desc:0 "Petrol, electricity and cooking gas have long been sold at prices that bear no relation to what they cost to produce. The government begins to raise them, gradually and with great care, freeing money for hospitals and schools. Every increase is a risk, for Egyptians remember how quickly bread and fuel have driven crowds into the streets."
 COLDWAR_EGY_tp_the_suez_economic_zone:0 "The Suez Economic Zone"
 COLDWAR_EGY_tp_the_suez_economic_zone_desc:0 "Along the shores of the closed Canal, the government plans a zone of ports, warehouses and light industry, ready for the day the waterway reopens. Foreign firms are offered favourable terms, and engineers draw up plans for new quays and offices. The idea is to turn the wound of 1967 into a gateway for the future."
 COLDWAR_EGY_tp_industrial_modernisation:0 "Industrial Modernisation Programme"
 COLDWAR_EGY_tp_industrial_modernisation_desc:0 "The factories of Helwan and Mahalla are old, worn and often poorly managed, and the technocrats bring in consultants and capital to refit them. New machinery, better training and sound accounting are promised to raise output from what already exists. Modernisation is not glamorous, but it may do more for Egypt than a dozen new projects."
 COLDWAR_EGY_tp_an_economy_that_works:0 "An Economy that Works"
 COLDWAR_EGY_tp_an_economy_that_works_desc:0 "After years of careful management, the Egyptian economy begins to function as its planners intended. Prices are more predictable, factories hum and the treasury can meet its obligations. Foreign visitors note the change, and ordinary families feel that the government finally knows what it is doing."
 COLDWAR_EGY_tp_technical_education:0 "Technical Education"
 COLDWAR_EGY_tp_technical_education_desc:0 "The government expands technical schools and polytechnics to train the machinists, electricians and draughtsmen that Egyptian industry sorely lacks. For too long the universities have produced lawyers and clerks while factories wait for skilled hands. A better-trained workforce is the surest investment the state can make."
 COLDWAR_EGY_tp_the_population_council:0 "The Population Council"
 COLDWAR_EGY_tp_the_population_council_desc:0 "Egypt's population is climbing quickly and the Nile Valley cannot support it indefinitely. A Population Council is formed to promote family planning through clinics and educational campaigns, a policy that the technocrats regard as simple arithmetic. Religious leaders view it with suspicion, and the government treads with great care."
 COLDWAR_EGY_tp_credit_from_all_sides:0 "Credit from All Sides"
 COLDWAR_EGY_tp_credit_from_all_sides_desc:0 "Egypt needs money and cannot afford to be choosy about where it comes from. Envoys visit Moscow, Washington, the European capitals and the Gulf, each time presenting the same case: the country is worth lending to. The skilful borrower, the technocrats believe, is one who owes no single creditor so much that he must obey him."
 COLDWAR_EGY_tp_balanced_diplomacy:0 "Balanced Diplomacy"
 COLDWAR_EGY_tp_balanced_diplomacy_desc:0 "Cairo declares that its policy will serve Egypt's interests rather than any bloc's. Soviet advisers remain at their posts and American diplomats are received with courtesy, while neither is allowed to dictate terms. It is a delicate balance that demands patience, discretion and a very steady hand."
 COLDWAR_EGY_tp_the_world_bank_mission:0 "The World Bank Mission"
 COLDWAR_EGY_tp_the_world_bank_mission_desc:0 "A mission from the World Bank arrives in Cairo to study the Egyptian economy and to recommend projects worthy of support. Its experts tour irrigation works, roads and ports, and leave behind a thick report and a promise of credit. For the government it is a mark of confidence, and for the Bank, a test of Egyptian seriousness."
 COLDWAR_EGY_tp_the_managerial_state:0 "The Managerial State"
 COLDWAR_EGY_tp_the_managerial_state_desc:0 "The republic has become a state run by managers: competent, cautious and more concerned with results than with slogans. The ministries function, the budgets are balanced and the president can discuss the country's affairs with experts rather than with partisans. Whether this is enough to inspire a nation remains to be seen."
 COLDWAR_EGY_mb_the_guidance_office:0 "The Guidance Office in Power"
 COLDWAR_EGY_mb_the_guidance_office_desc:0 "The Society of the Muslim Brothers, once hunted by the revolution, now holds the reins of government. The Guidance Office, which used to meet in secret, advises ministers and its Murshid is received as a statesman. For its followers this is the fulfilment of decades of patience and prayer; for its enemies it is the beginning of a new and unfamiliar order."
 COLDWAR_EGY_mb_the_murshids_council:0 "The Murshid's Council"
 COLDWAR_EGY_mb_the_murshids_council_desc:0 "The Murshid convenes his council of senior Brothers, men who spent years in the prisons of Nasser and learned to wait. Together they determine how swiftly to move, whom to trust, and how to reconcile the Society's vision with the realities of running a state. Their decisions shape the character of the new Egypt."
 COLDWAR_EGY_mb_tilmisanis_moderation:0 "Tilmisani's Moderation"
 COLDWAR_EGY_mb_tilmisanis_moderation_desc:0 "Under the leadership of Umar al-Tilmisani, the Brotherhood chooses the path of persuasion over confrontation. Violence is disavowed, the law is respected and the Society presents itself as a patient movement that will reform Egypt from within. Foreign capitals, watching nervously, begin to wonder whether this is a force they can work with."
 COLDWAR_EGY_mb_the_qutbist_vanguard:0 "Milestones: The Qutbist Vanguard"
 COLDWAR_EGY_mb_the_qutbist_vanguard_desc:0 "The writings of Sayyid Qutb, executed in 1966, are read in secret by a younger generation that has no patience for compromise. Milestones calls for a vanguard of true believers to break with a society it declares ignorant of God. Where the Society's elders counsel restraint, the Qutbists demand a revolution of faith."
 COLDWAR_EGY_mb_electoral_islam:0 "Electoral Islam"
 COLDWAR_EGY_mb_electoral_islam_desc:0 "The Brotherhood decides to contest elections, to campaign in the villages and mosques and to take its message to the ballot box. Its candidates promise honesty, charity and a government that fears God more than it fears its own security service. Whatever the results, the Society is at last in open competition with its rivals."
 COLDWAR_EGY_mb_the_professional_syndicates:0 "Win the Professional Syndicates"
 COLDWAR_EGY_mb_the_professional_syndicates_desc:0 "The syndicates of doctors, engineers, lawyers and pharmacists are the voice of the educated middle class, and the Brothers set out to win them. Their candidates are disciplined, hardworking and well organised, and they offer services as well as sermons. A syndicate lost to the Society is a stronghold gained."
 COLDWAR_EGY_mb_alliance_with_the_wafd:0 "Alliance with the Wafd"
 COLDWAR_EGY_mb_alliance_with_the_wafd_desc:0 "The Brotherhood and the revived Wafd, ancient rivals, discover that they share a common opponent in the establishment. A joint list is agreed, linking the liberal nationalism of the old parties with the religious mobilisation of the Society. It is an awkward marriage, but one that brings both an electoral advantage."
 COLDWAR_EGY_mb_al_dawa_magazine:0 "Al-Da'wa Magazine"
 COLDWAR_EGY_mb_al_dawa_magazine_desc:0 "Al-Da'wa, the Brotherhood's monthly magazine, circulates in mosques, student unions and village shops, reaching readers who trust it more than the state press. It publishes sermons, editorials, news from the Muslim world and pointed criticism of those who rule. The printed word becomes the Society's most powerful instrument of persuasion."
 COLDWAR_EGY_mb_gradual_islamisation:0 "Gradual Islamisation"
 COLDWAR_EGY_mb_gradual_islamisation_desc:0 "Egypt's laws, schools, media and public life are brought into closer harmony with Islamic principles, step by step rather than in a single stroke. The Society's leaders argue that society must be prepared first, and that rushed imposition would breed resentment. Each year brings a little more of the new order, and a little less of the old."
 COLDWAR_EGY_mb_the_secret_apparatus:0 "The Secret Apparatus"
 COLDWAR_EGY_mb_the_secret_apparatus_desc:0 "The Special Apparatus, the secret wing that once carried out the Society's operations in the 1940s, is revived in the shadows. Its members are trained, armed and sworn to obey, and they gather intelligence on the regime's enemies. Those who remember the assassinations of old Egypt see in it a warning."
 COLDWAR_EGY_mb_end_the_jahiliyya:0 "End the Jahiliyya"
 COLDWAR_EGY_mb_end_the_jahiliyya_desc:0 "Following Qutb's reasoning, the vanguard declares that the society around it is jahiliyya, a state of ignorance comparable to the age before the Prophet. Cinemas, nightclubs, alcohol and secular schools are denounced and, where power allows, shut down. The ulema watch uneasily as the movement outruns their authority."
 COLDWAR_EGY_mb_an_islamic_army:0 "An Islamic Army"
 COLDWAR_EGY_mb_an_islamic_army_desc:0 "The armed forces are to be remade as an army of believers, with chaplains in every unit, prayer in every barracks and officers selected for piety as well as skill. The old professional officers resent the purge, and many fear that discipline will suffer. The Society insists that only a faithful army can defend a faithful state."
 COLDWAR_EGY_mb_the_vanguard_of_the_faithful:0 "The Vanguard of the Faithful"
 COLDWAR_EGY_mb_the_vanguard_of_the_faithful_desc:0 "The Society's elite, now drawn from the committed, the disciplined and the zealous, becomes the true engine of the state. Its cadres sit in the ministries, in the mosques and in the army, bound by oath and by conviction. They believe they are the vanguard of a movement that will spread beyond Egypt's frontiers."
 COLDWAR_EGY_mb_codify_the_sharia:0 "Codify the Sharia"
 COLDWAR_EGY_mb_codify_the_sharia_desc:0 "A committee of jurists, scholars and ministers is charged with drafting a legal code based on the Sharia, replacing the French-inspired statutes of the last century. Al-Azhar welcomes the project, secular lawyers condemn it, and the country's Christians wait anxiously for its details. Few acts could change Egyptian life more profoundly."
 COLDWAR_EGY_mb_the_new_generation:0 "The New Generation of the Guidance"
 COLDWAR_EGY_mb_the_new_generation_desc:0 "The founding generation of the Brotherhood is ageing, its leaders tired by prison and exile, and a new generation of activists comes forward. Raised in the student movements and professional syndicates, they have ideas and ambitions of their own. The Society must decide what kind of movement it will be in the decades to come."
 COLDWAR_EGY_mb_mashhurs_organisation:0 "Mashhur's Organisation"
 COLDWAR_EGY_mb_mashhurs_organisation_desc:0 "Mustafa Mashhur, who has guided the secret organisation through years of repression, takes the helm. He values discipline, hierarchy and obedience, and he sees in the Society a body that must remain united at all costs. Under his leadership the Brotherhood is tightly run and resolute."
 COLDWAR_EGY_mb_the_wasat_reformers:0 "The Wasat Reformers"
 COLDWAR_EGY_mb_the_wasat_reformers_desc:0 "A circle of younger Brothers, headed by Abu al-Ela Madi, argues that the Society should embrace pluralism, democratic politics and a civil state with an Islamic reference. They are impatient with the old hierarchy and its secrecy. If they prevail, the Brotherhood may become a party among parties rather than a movement above them."
 COLDWAR_EGY_mb_the_islamic_order:0 "The Islamic Order"
 COLDWAR_EGY_mb_the_islamic_order_desc:0 "Egypt is proclaimed an Islamic state, its institutions, laws and daily life shaped by the Sharia and led by the Society of the Muslim Brothers. For many it is the culmination of a century of struggle against secular rule. For others it is the start of a new test, to show that an Islamic order can feed, protect and unite a nation."
 COLDWAR_EGY_mb_islamic_banking:0 "The Faisal Islamic Bank"
 COLDWAR_EGY_mb_islamic_banking_desc:0 "With the backing of Saudi Arabia's Prince Muhammad al-Faisal, an Islamic bank is founded which refuses to deal in interest and instead shares profits and losses with its clients. Pious depositors flock to it, and the Gulf states take notice. It is both a financial institution and a statement about what an Islamic economy might look like."
 COLDWAR_EGY_mb_the_zakat_fund:0 "The Zakat Fund"
 COLDWAR_EGY_mb_the_zakat_fund_desc:0 "A national zakat fund collects the alms that every Muslim owes and distributes them among the poor, the orphaned and the sick. Run through mosques and trusted committees, it reaches families that the state has never been able to help. The fund is both an act of faith and a quiet instrument of political loyalty."
 COLDWAR_EGY_mb_islamic_investment_companies:0 "Islamic Investment Companies"
 COLDWAR_EGY_mb_islamic_investment_companies_desc:0 "Islamic investment companies such as al-Rayan promise returns that no bank could match, all in the name of God and honest profit. Millions of Egyptians, including emigrants returned from the Gulf, hand over their savings. The boom is spectacular, and the shrewd note that it depends on a steady stream of new depositors."
 COLDWAR_EGY_mb_charity_hospitals:0 "Charity Hospitals"
 COLDWAR_EGY_mb_charity_hospitals_desc:0 "Hospitals and clinics run by the Society's medical syndicate treat the poor for little or nothing, staffed by doctors who see their work as both a profession and a duty. In the slums of Cairo and the villages of Upper Egypt, these hospitals are often better than the state can offer. They also win hearts and votes with every patient treated."
 COLDWAR_EGY_mb_interest_free_farm_credit:0 "Interest-Free Farm Credit"
 COLDWAR_EGY_mb_interest_free_farm_credit_desc:0 "Fellahin have long been at the mercy of moneylenders and village creditors who charge ruinous rates. The Society's banks offer them loans without interest, repaid from the harvest, and tied to cooperative purchase of seed and fertiliser. The scheme makes the Brothers friends in places where the state is distrusted."
 COLDWAR_EGY_mb_gulf_brothers_capital:0 "Gulf Brothers' Capital"
 COLDWAR_EGY_mb_gulf_brothers_capital_desc:0 "The Society's brothers in the Gulf, many of them wealthy merchants and professionals, send money home to build the Islamic economy. Funds flow into banks, land and construction, supported by networks of kinship and faith. It is capital that comes with expectations, and Cairo must take care not to be too grateful."
 COLDWAR_EGY_mb_halal_industries:0 "Halal Industries"
 COLDWAR_EGY_mb_halal_industries_desc:0 "New enterprises, financed by Islamic funds and run according to Islamic principles, produce food, clothing and household goods for the pious market at home and abroad. A halal seal becomes a mark of trust from Cairo to Kuala Lumpur. The Society's merchants find that faith and profit are not always at odds."
 COLDWAR_EGY_mb_a_moral_economy:0 "A Moral Economy"
 COLDWAR_EGY_mb_a_moral_economy_desc:0 "The Society's vision of a moral economy takes shape: no usury, honest weights, charity built into the system and wealth answerable to God. Whether it can compete with the markets of the world is a question that its architects answer with confidence and its critics with doubt. For the time being, the poor of Egypt feel a little less alone."
 COLDWAR_EGY_mb_the_dawa_networks:0 "The Da'wa Networks"
 COLDWAR_EGY_mb_the_dawa_networks_desc:0 "From the mosques and the schools, the Society's preachers and teachers reach into every neighbourhood. They run lessons, youth clubs, clinics and burial funds, building a web of services that holds communities together. Where the state is absent, the Brothers are present."
 COLDWAR_EGY_mb_an_islamic_curriculum:0 "An Islamic Curriculum"
 COLDWAR_EGY_mb_an_islamic_curriculum_desc:0 "Textbooks are rewritten, teachers retrained and Quranic study placed at the heart of the school day. The Society holds that the generation raised in this way will know both the Book and the modern sciences. Secular educators protest, but the schools of the Da'wa Networks are already full."
 COLDWAR_EGY_mb_the_coptic_compact:0 "A Compact with the Church"
 COLDWAR_EGY_mb_the_coptic_compact_desc:0 "Egypt's Christians, perhaps a tenth of the population, ask what an Islamic state will mean for them. The Society's moderates reply with a compact between mosque and Church, guaranteeing worship, property and a place in public life. The Coptic Pope is cautious but willing to listen, and the radicals murmur at the concession."
 COLDWAR_EGY_mb_the_dhimma_laws:0 "The Dhimma Laws"
 COLDWAR_EGY_mb_the_dhimma_laws_desc:0 "The Society revives the old status of the dhimma, under which Christians and other non-Muslims enjoy protection but not equality. The Copts see in it a return to a second-class citizenship that they thought history had ended. Some of the ulema applaud while many quiet Egyptians fear for the consequences."
 COLDWAR_EGY_mb_brothers_abroad:0 "Brothers Abroad"
 COLDWAR_EGY_mb_brothers_abroad_desc:0 "The Brotherhood is an international movement with branches and sympathisers across the Arab world. Contacts are renewed with the Brothers of Syria, Jordan, Sudan and Palestine, and delegations exchange letters, students and funds. Egypt, the mother of the movement, begins to see its influence extend well beyond its borders."
 COLDWAR_EGY_mb_brothers_in_syria:0 "Brothers in Syria"
 COLDWAR_EGY_mb_brothers_in_syria_desc:0 "In Syria the Brothers have been in open conflict with the Baathist regime, which they regard as godless and sectarian. Cairo's Society gives them money, shelter and a voice in the press. Damascus protests angrily and the diplomatic temperature between the two capitals falls."
 COLDWAR_EGY_mb_jihad_for_jerusalem:0 "Jihad for Jerusalem"
 COLDWAR_EGY_mb_jihad_for_jerusalem_desc:0 "The Society declares the liberation of Jerusalem a duty on every believer, not a matter for diplomats alone. Volunteers are called, sermons are preached and the army is told that the cause is holy. The proclamation stirs the street and alarms every chancery in the region."
 COLDWAR_EGY_mb_the_islamic_conference:0 "The Islamic Conference"
 COLDWAR_EGY_mb_the_islamic_conference_desc:0 "Rather than war, Cairo takes the diplomatic road and works through the Islamic Conference, bringing together the kings, presidents and emirs of the Muslim world. Riyadh, Islamabad and Tehran are courted as partners in a common cause. Egypt takes its place as the intellectual capital of a community of believers that spans continents."
 COLDWAR_EGY_tag_the_independent_left:0 "The Tagammu in Power"
 COLDWAR_EGY_tag_the_independent_left_desc:0 "The National Progressive Unionist Rally, known as the Tagammu, brings together Marxists, Nasserists and left-wing intellectuals under the banner of Khaled Mohieddin. A Free Officer who broke with Nasser's camp yet never with its ideals, he offers an independent left that will neither bow to Moscow nor submit to Washington. The experiment is bold, and its supporters are many and unruly."
 COLDWAR_EGY_tag_the_rally_congress:0 "The Rally's Congress"
 COLDWAR_EGY_tag_the_rally_congress_desc:0 "Delegates from factories, universities, villages and trade unions meet at the Rally's congress to debate the future of the country. Speeches run long, resolutions are amended again and again, and the tobacco smoke thickens. It is the first time in years that Egyptian leftists have been free to argue in public about what their revolution should be."
 COLDWAR_EGY_tag_two_souls:0 "Two Souls of the Rally"
 COLDWAR_EGY_tag_two_souls_desc:0 "Within the Rally two souls struggle for the heart of the movement. One is the Marxist tradition of class struggle and scientific socialism; the other the Nasserist legacy of national dignity and social justice. Khaled Mohieddin must decide which voice to follow, or learn to live with both."
 COLDWAR_EGY_tag_the_marxist_wing:0 "The Marxist Wing"
 COLDWAR_EGY_tag_the_marxist_wing_desc:0 "The Marxist wing prevails, and the Rally speaks the language of class, of surplus value and of the historic mission of the working class. Its theorists argue that Nasser's reforms were half-measures that stopped short of true socialism. The communists of the old underground, long forced into silence, find a platform at last."
 COLDWAR_EGY_tag_the_nasserist_wing:0 "The Nasserist Wing"
 COLDWAR_EGY_tag_the_nasserist_wing_desc:0 "The Nasserist wing holds that the greatest strength of the left lies not in doctrine but in Nasser's heritage of national pride, social reform and Arab solidarity. It speaks to the fellahin, soldiers and government clerks who still keep the late Rais's picture on their walls. Marx may be admired in the study, but Nasser is loved in the street."
 COLDWAR_EGY_tag_free_trade_unions:0 "Free Trade Unions"
 COLDWAR_EGY_tag_free_trade_unions_desc:0 "The state-controlled labour federation is loosened and workers are allowed to elect their own leaders and bargain freely. For the first time in many years, textile workers of Mahalla and steel workers of Helwan have unions that speak for them rather than for the ministry. The government loses a means of control, and gains a source of legitimacy."
 COLDWAR_EGY_tag_al_ahali:0 "Al-Ahali"
 COLDWAR_EGY_tag_al_ahali_desc:0 "Al-Ahali, the Rally's weekly newspaper, brings the left's arguments to the kiosks of Cairo and Alexandria. Its pages mix economic analysis, satire, cartoons and sharp criticism of the government. Censors keep a close eye on it, but its readers pass it from hand to hand until the print is worn."
 COLDWAR_EGY_tag_front_against_the_infitah:0 "Front against the Infitah"
 COLDWAR_EGY_tag_front_against_the_infitah_desc:0 "The left rallies against the Infitah, which it regards as a betrayal of the revolution and a gift to speculators and foreign capital. Nasserists of the Union stand alongside Marxists and trade unionists, uniting around the defence of the public sector and the poor consumer. For once, the old divisions of the left are set aside."
 COLDWAR_EGY_tag_a_peoples_democracy:0 "A People's Democracy?"
 COLDWAR_EGY_tag_a_peoples_democracy_desc:0 "The Rally's leaders ask what kind of democracy Egypt should build: one of competing parties, or one in which the people's organisations speak for the nation. The question is as old as the revolution, and neither answer comes without cost. Mohieddin's government must now decide how far to trust the people it claims to serve."
 COLDWAR_EGY_tag_open_elections:0 "Open Elections"
 COLDWAR_EGY_tag_open_elections_desc:0 "Open elections are held, with parties of the left, the right and the religious movements all free to compete. The ballot is a risk, for the Rally may find that its slogans win fewer votes than expected. Yet its leaders insist that socialism without freedom is a contradiction."
 COLDWAR_EGY_tag_the_popular_front_state:0 "The Popular Front State"
 COLDWAR_EGY_tag_the_popular_front_state_desc:0 "The Rally forms a broad popular front with the Communists and other forces of the left, setting up a state in which progressive parties govern together and opposition to the line is discouraged. Supporters see a bulwark against reaction; critics warn of the one-party model by another name. Unity is purchased at the cost of dissent."
 COLDWAR_EGY_tag_a_socialism_of_our_own:0 "A Socialism of Our Own"
 COLDWAR_EGY_tag_a_socialism_of_our_own_desc:0 "Egypt claims to have found its own road to socialism, one rooted in the Nile Valley rather than in Moscow, Beijing or Belgrade. Its factories, farms and unions are run in the interests of those who work in them, and its politics reflect the character of its people. The left can say that it has built something distinctively Egyptian."
 COLDWAR_EGY_tag_protect_the_public_sector:0 "Protect the Public Sector"
 COLDWAR_EGY_tag_protect_the_public_sector_desc:0 "The Rally declares the public sector the foundation of Egypt's independence and the guarantee of its workers' livelihoods. Privatisation is ruled out, and managers are told to improve their factories rather than seek buyers. In the mills of the Delta, workers hear the news with relief."
 COLDWAR_EGY_tag_workers_self_management:0 "Workers' Self-Management"
 COLDWAR_EGY_tag_workers_self_management_desc:0 "Following the Yugoslav example, factory workers are given a direct voice in the running of their enterprises, electing councils that share in the management. Foremen, engineers and labourers sit round the same table to plan production. It is an experiment that excites some and frightens others, but no one can call it dull."
 COLDWAR_EGY_tag_industrial_councils:0 "Industrial Democracy Councils"
 COLDWAR_EGY_tag_industrial_councils_desc:0 "Industrial democracy councils are established in the major plants of Alexandria and the Delta, bringing workers, technicians and managers together in the same decision-making bodies. The councils are charged with setting production targets and dividing the bonus. Their critics fear chaos; their supporters see a new kind of factory."
 COLDWAR_EGY_tag_a_minimum_wage:0 "A Minimum Wage"
 COLDWAR_EGY_tag_a_minimum_wage_desc:0 "A legal minimum wage is declared for workers in the public and private sectors, guaranteeing a floor beneath which no employer may fall. For the lowest paid it is the first assurance of its kind, and families in the poorer quarters of Cairo feel it immediately. Employers warn of higher costs and fewer jobs."
 COLDWAR_EGY_tag_tax_the_fat_cats:0 "Tax the Fat Cats"
 COLDWAR_EGY_tag_tax_the_fat_cats_desc:0 "The new government turns its attention to the contractors, importers and speculators who have grown rich while ordinary Egyptians tighten their belts. Taxes on large fortunes and business profits are raised, and the tax inspectors are given new powers. Whether the wealthy will pay or flee remains to be seen."
 COLDWAR_EGY_tag_cooperative_villages:0 "Cooperative Villages"
 COLDWAR_EGY_tag_cooperative_villages_desc:0 "In the countryside, fellahin pool their land, tools and labour in cooperative villages, sharing the harvest and the costs of seed, machinery and irrigation. The state offers advice and credit but lets the villagers manage their own affairs. For those who have been tenants and labourers all their lives, it is a new kind of dignity."
 COLDWAR_EGY_tag_public_housing:0 "Public Housing for Workers"
 COLDWAR_EGY_tag_public_housing_desc:0 "Great estates of public housing rise on the outskirts of Cairo, with flats for workers and their families at modest rents. They are not luxurious, but they have running water, electric light and a roof that does not leak. The left's argument that every citizen is entitled to a decent home is finally made concrete."
 COLDWAR_EGY_tag_a_fair_economy:0 "A Fair Economy"
 COLDWAR_EGY_tag_a_fair_economy_desc:0 "At last the economy begins to reflect the left's principles: wages are protected, prices are regulated and the profits of enterprise are shared more widely. The experiment has not been easy, and the shops are not always full, but few workers would want to return to the old arrangements. Fairness, the Rally claims, is also good economics."
 COLDWAR_EGY_tag_free_education_restored:0 "Free Education Restored"
 COLDWAR_EGY_tag_free_education_restored_desc:0 "Education was made free for all by the revolution, and fees later crept back at the margins. The Rally restores the principle in full, so that no child is excluded from school or university by poverty. Teachers are recruited by the thousand and classrooms built in the villages."
 COLDWAR_EGY_tag_the_womens_union:0 "The Women's Union"
 COLDWAR_EGY_tag_the_womens_union_desc:0 "The Rally sponsors a national women's union to campaign for equal pay, access to education and an end to the legal disabilities that burden Egyptian women. The traditional clergy objects strongly, while women in the factories and universities rally to its banner. A revolution that overlooks half the nation, its advocates say, is only half a revolution."
 COLDWAR_EGY_tag_the_yugoslav_model:0 "The Yugoslav Model"
 COLDWAR_EGY_tag_the_yugoslav_model_desc:0 "Khaled Mohieddin looks to Belgrade, where Tito has shown that a socialist state can stand outside both blocs and still prosper. Yugoslav advisers, engineers and economists are invited to Cairo, and delegations travel to study workers' councils and the market socialism of the Balkans. Egypt, the friendship implies, is another leader of the non-aligned."
 COLDWAR_EGY_tag_the_belgrade_credit:0 "The Belgrade Credit"
 COLDWAR_EGY_tag_the_belgrade_credit_desc:0 "Yugoslavia offers Egypt a credit to buy machinery, equipment and technical assistance. The terms are generous and the conditions are few, for Tito remembers the Non-Aligned partnership forged with Nasser. Yugoslav firms begin to build and equip Egyptian plants."
 COLDWAR_EGY_tag_anti_imperialist_front:0 "Anti-Imperialist Front"
 COLDWAR_EGY_tag_anti_imperialist_front_desc:0 "The Rally throws itself into the international struggle against imperialism, aligning Egypt with Algeria, Cuba, Vietnam and the liberation movements of Africa and Asia. Moscow welcomes the solidarity, while Washington notes with displeasure. Egypt reclaims the revolutionary voice it once held at Bandung."
 COLDWAR_EGY_fc_the_new_class:0 "The New Class"
 COLDWAR_EGY_fc_the_new_class_desc:0 "The decade of the Infitah has produced a new class of contractors, importers and middlemen who have grown rich on commissions and connections. They are not bound by the old socialist pieties, and they see no reason to hide their wealth. Now they aspire to rule rather than merely to profit."
 COLDWAR_EGY_fc_contractors_or_importers:0 "Contractors or Importers?"
 COLDWAR_EGY_fc_contractors_or_importers_desc:0 "Within the new class two interests compete: the contractors who build the new Egypt and the importers who supply it with goods from abroad. Both prosper under the opening, but their needs differ, and the government must favour one or the other. The choice will shape the character of the business republic."
 COLDWAR_EGY_fc_the_contractors:0 "The Contractors"
 COLDWAR_EGY_fc_the_contractors_desc:0 "The government favours the builders, men such as Osman Ahmed Osman whose companies have laid roads, bridges and apartment blocks across the country. Their cranes dominate the skyline, and they need no lessons on how to deal with ministers. Egypt is declared to be a building site, and the contractors its masters."
 COLDWAR_EGY_fc_the_importers:0 "The Importers"
 COLDWAR_EGY_fc_the_importers_desc:0 "The government favours the importers, who bring television sets, refrigerators, cars and cheap clothing to a public that has long done without. The shops of Cairo fill, and the customers are grateful. Local manufacturers complain that they cannot compete, but the importers answer that the people want to buy."
 COLDWAR_EGY_fc_the_contracting_boom:0 "The Contracting Boom"
 COLDWAR_EGY_fc_the_contracting_boom_desc:0 "Cranes rise in every quarter of Cairo and Alexandria as contractors compete for ministry orders. Apartment blocks, hotels and offices appear in months, financed by public funds and private speculation. The boom brings jobs, fortunes and a good deal of dust."
 COLDWAR_EGY_fc_contractors_in_the_gulf:0 "Contractors in the Gulf"
 COLDWAR_EGY_fc_contractors_in_the_gulf_desc:0 "Egyptian contractors follow the petrodollars to the Gulf, building roads, ports and palaces for the emirs and the kings. The work is profitable, and it employs thousands of Egyptian engineers and labourers who send their wages home. In Riyadh and Kuwait City, the name of Egypt is again heard with respect."
 COLDWAR_EGY_fc_the_towers_of_cairo:0 "The Towers of Cairo"
 COLDWAR_EGY_fc_the_towers_of_cairo_desc:0 "Glass and concrete towers rise on the banks of the Nile, housing banks, hotels and the offices of foreign firms. They are monuments to the new wealth, visible from every quarter of the city. Not everyone is pleased to see the horizon of Cairo given over to speculators, and the rents climb with the floors."
 COLDWAR_EGY_fc_import_licences:0 "Import Licences for Friends"
 COLDWAR_EGY_fc_import_licences_desc:0 "Import licences, once reserved for state agencies, are now distributed to friends of the government and their associates. Whoever holds the right paper can earn a fortune on a single shipment. The system rewards loyalty far more than efficiency, and everyone in the commercial quarters knows it."
 COLDWAR_EGY_fc_port_said_free_city:0 "Port Said Free City"
 COLDWAR_EGY_fc_port_said_free_city_desc:0 "Port Said, battered by the war, is declared a free city, with low duties and few restrictions on trade. Merchants, smugglers and bargain hunters throng the quays, and goods of every origin pass through its warehouses. It is the Infitah in its purest form, and a standing temptation to every Egyptian trader."
 COLDWAR_EGY_fc_exclusive_agencies:0 "Exclusive Foreign Agencies"
 COLDWAR_EGY_fc_exclusive_agencies_desc:0 "Foreign firms appoint Egyptian agents to represent their products, and the agents become the sole gatekeepers of imported goods. A single well-placed agency, whether for cars, pharmaceuticals or machinery, can make a family rich for a generation. The government is happy to oblige its friends and foreign partners alike."
 COLDWAR_EGY_fc_sell_the_public_sector:0 "Sell the Public Sector"
 COLDWAR_EGY_fc_sell_the_public_sector_desc:0 "The state, short of cash and long of enterprises, begins to sell the factories, hotels and trading companies built under the socialist years. Buyers are not hard to find, and many have excellent connections. The workers of the Delta watch with dismay as the revolution's legacy is auctioned off."
 COLDWAR_EGY_fc_tax_holidays:0 "Tax Holidays for Investors"
 COLDWAR_EGY_fc_tax_holidays_desc:0 "Investors are offered years of freedom from taxation if they will build, hire and export. Foreign firms and local entrepreneurs alike rush to take advantage, and new plants rise in the desert beyond Cairo. The treasury loses revenue today in the hope of gaining much more tomorrow."
 COLDWAR_EGY_fc_private_banks:0 "Private Banks"
 COLDWAR_EGY_fc_private_banks_desc:0 "Private banks, joint ventures and foreign institutions open their doors in Cairo and Alexandria, offering credit on terms the state banks never dared. Businessmen who once begged for ministry loans now choose among competing lenders. Behind the marble counters, a new financial power takes shape."
 COLDWAR_EGY_fc_the_stock_exchange_reborn:0 "The Stock Exchange Reborn"
 COLDWAR_EGY_fc_the_stock_exchange_reborn_desc:0 "The Cairo and Alexandria bourses, closed to speculation since the nationalisations, reopen in earnest. Brokers once more shout on the floor, and a new generation of investors watches the boards with fierce interest. The old exchange, which once rivalled the great markets of Europe, comes back to life."
 COLDWAR_EGY_fc_buy_the_press:0 "Buy the Press"
 COLDWAR_EGY_fc_buy_the_press_desc:0 "The new class discovers that newspapers can be bought, and their editors, columnists and proprietors turn out to be surprisingly cooperative. Praise for the opening fills the columns, and criticism is scarcer than before. Public opinion, it seems, is a commodity like any other."
 COLDWAR_EGY_fc_ministers_on_the_payroll:0 "Ministers on the Payroll"
 COLDWAR_EGY_fc_ministers_on_the_payroll_desc:0 "Ministers and senior officials find that their salaries are only part of their income, and that consultancies, directorships and gifts from grateful contractors come with the position. The line between public service and private enterprise blurs. Egyptians know the price of everything and the cost of every signature."
 COLDWAR_EGY_fc_private_security:0 "Private Security Firms"
 COLDWAR_EGY_fc_private_security_desc:0 "Companies of private guards, many of them retired police and army men, protect the villas, offices and shopping arcades of the wealthy. The state police, overstretched and underpaid, make no objection. The republic of the contractors is learning that those who own the property must also defend it."
 COLDWAR_EGY_fc_the_reckoning:0 "The Reckoning of the Fat Cats"
 COLDWAR_EGY_fc_the_reckoning_desc:0 "The business class has built fortunes and political power in a single decade, but the poor of Egypt have noticed. Strikes, bread riots and street anger threaten the fragile peace on which the fortunes rest. The new class must decide whether to buy off its critics or break them."
 COLDWAR_EGY_fc_buy_social_peace:0 "Buy Social Peace"
 COLDWAR_EGY_fc_buy_social_peace_desc:0 "The business leaders conclude that stability is worth a price, and a portion of their profits is directed to subsidies, wages and public works. Bread stays cheap, rents are held and the slums are quieter. It is a bargain between rich and poor, struck for the sake of a calm in which both can continue as they are."
 COLDWAR_EGY_fc_crush_the_strikes:0 "Crush the Strikes"
 COLDWAR_EGY_fc_crush_the_strikes_desc:0 "The factory gates are closed, the strike leaders arrested and the police sent into the working districts. The business class holds that order is the first condition of profit, and that wages cannot be dictated from the street. The workers learn that the republic of the contractors will not bend."
 COLDWAR_EGY_fc_a_republic_of_contractors:0 "A Republic of Contractors"
 COLDWAR_EGY_fc_a_republic_of_contractors_desc:0 "Egypt has become a republic of contractors, in which the men who build and import decide what the government does. The state is stable, the cranes still swing and the money still flows. Whether anyone beyond the business class believes in it is another matter."
 COLDWAR_EGY_nb_government_of_notables:0 "A Government of Notables"
 COLDWAR_EGY_nb_government_of_notables_desc:0 "With the revolution in retreat, Egypt turns to the old families of the provinces: the great landowners, the village headmen and the heads of the leading clans. They are conservative, local and practical, and they know the countryside as Cairo's officials never will. A government of notables promises order, continuity and a measured pace."
 COLDWAR_EGY_nb_umdas_or_elders:0 "Umdas or Elders?"
 COLDWAR_EGY_nb_umdas_or_elders_desc:0 "The notables must decide how to rule. They may work through the umdas, the village headmen who answer to the state yet speak for their neighbours, or turn to the elders and councils of the clans. Either way, they promise to bring the countryside back into the political order."
 COLDWAR_EGY_nb_rule_through_the_umdas:0 "Rule through the Umdas"
 COLDWAR_EGY_nb_rule_through_the_umdas_desc:0 "The umdas, the headmen of the villages, are given back the authority they enjoyed before the revolution: to settle disputes, to keep the peace and to speak for the people of their communities. They are reliable, influential and entirely local. The villages of the Delta and the Nile Valley return to the rhythm of their ancestors."
 COLDWAR_EGY_nb_a_council_of_elders:0 "A Council of Elders"
 COLDWAR_EGY_nb_a_council_of_elders_desc:0 "A council of elders, drawn from the oldest and most respected families, advises the government on matters of custom, land and public order. Its members are chosen for their standing rather than their ideology. It is a conservative body, but its word carries weight in the countryside."
 COLDWAR_EGY_nb_the_notables_assembly:0 "The Assembly of Notables"
 COLDWAR_EGY_nb_the_notables_assembly_desc:0 "An assembly of notables meets in Cairo, bringing together landowners, merchants, headmen and religious leaders from every province. It is not a parliament in the modern sense, but it gives the old elite a voice in national affairs. Its debates are slow, courteous and a little old-fashioned."
 COLDWAR_EGY_nb_patronage_of_the_sufi_orders:0 "Patronage of the Sufi Orders"
 COLDWAR_EGY_nb_patronage_of_the_sufi_orders_desc:0 "The Sufi orders, which count millions of followers in the villages and quarters of Egypt, are given the state's patronage. Their saints' festivals are supported, their shaykhs honoured and their members taught that loyalty to the nation is a form of devotion. In an age of fierce religious politics, Sufism offers a gentler path."
 COLDWAR_EGY_nb_family_and_faith:0 "Family and Faith"
 COLDWAR_EGY_nb_family_and_faith_desc:0 "The notables insist that society rests on the family and on religion, and the state is made to reflect it. Marriage, morality and the education of children are held to be matters for the household and the mosque. For many Egyptians, in the villages especially, it is a vision of life that feels familiar."
 COLDWAR_EGY_nb_rural_credit_banks:0 "Rural Credit Banks"
 COLDWAR_EGY_nb_rural_credit_banks_desc:0 "Rural credit banks bring cheap loans to farmers who have always depended on moneylenders and village creditors. The notables are the guarantors of local loans, and the system strengthens their own standing. The fellah finds the harvest a little less precarious."
 COLDWAR_EGY_nb_the_land_registry:0 "The Land Registry"
 COLDWAR_EGY_nb_the_land_registry_desc:0 "The land registry is renewed, so that holdings, boundaries and rights are properly recorded for the first time. Disputes that have simmered for generations can now be settled with deeds and maps. Landowners are reassured, though the tax collectors also find that they now have a means of counting."
 COLDWAR_EGY_nb_village_industries:0 "Village Industries"
 COLDWAR_EGY_nb_village_industries_desc:0 "Small workshops, mills and presses spring up in the villages, processing local produce and providing work close to home. Young men who might otherwise have left for Cairo find a trade near their fathers' fields. It is development on a human scale, and the notables are proud of it."
 COLDWAR_EGY_nb_cotton_gins_of_the_delta:0 "Cotton Gins of the Delta"
 COLDWAR_EGY_nb_cotton_gins_of_the_delta_desc:0 "The gins and mills of the Delta, which turn the harvest into cotton fibre, are modernised and expanded under the patronage of the notables. The white crop that once made Egypt famous is again processed at home rather than shipped raw. Local prosperity comes slowly, but it is solid."
 COLDWAR_EGY_nb_balanced_budgets:0 "Balanced Budgets"
 COLDWAR_EGY_nb_balanced_budgets_desc:0 "The notables hold that a household, a village and a state alike must live within their means. Spending is trimmed, subsidies are limited and the debt is brought under control. It is a cautious, thrifty policy of the kind that suits provincial minds and prudent landlords."
 COLDWAR_EGY_nb_friends_of_all:0 "Friends of All"
 COLDWAR_EGY_nb_friends_of_all_desc:0 "The government of notables prefers hospitality to heroics, and its diplomacy is one of courtesy and quiet friendship. Envoys are sent to Khartoum, Tripoli and Amman with gifts and good wishes rather than demands. Egypt asks only that her neighbours treat her as a respected elder."
 COLDWAR_EGY_nb_hajj_diplomacy:0 "Hajj Diplomacy"
 COLDWAR_EGY_nb_hajj_diplomacy_desc:0 "Each year thousands of Egyptian pilgrims travel to Mecca, and the government turns their journey into an instrument of statecraft. Delegations meet the Saudi princes, and arrangements are made on quotas, transport and trade. Pilgrimage, the notables note, is the oldest road between Cairo and Riyadh."
 COLDWAR_EGY_nb_the_ordered_society:0 "The Ordered Society"
 COLDWAR_EGY_nb_the_ordered_society_desc:0 "The country is orderly: the village is at peace, the harvest is brought in, the budget balances and the old families keep watch. The notables have not made a revolution, but they have restored something many Egyptians missed. It is a society that knows its place and is, for the most part, content with it."
 COLDWAR_EGY_fe_the_free_economy_movement:0 "The Free Economy Movement"
 COLDWAR_EGY_fe_the_free_economy_movement_desc:0 "Born in the merchant houses and customs offices of Port Said, the Free Economy Movement has long argued that Egypt's socialist experiment strangled the very traders who once made the canal cities rich. With its supporters now in government, the promise is a country open to capital and commerce, though the bureaucrats and the unions will not surrender their privileges quietly."
 COLDWAR_EGY_fe_how_fast:0 "How Fast?"
 COLDWAR_EGY_fe_how_fast_desc:0 "The movement's economists agree that the state must withdraw from the marketplace, but not on how quickly. One camp wants to cut the knot in a single stroke and let the market find its level; the other counsels patience and legal groundwork. Whichever path is chosen will shape how many Egyptians remain loyal to the new order."
 COLDWAR_EGY_fe_shock_liberalisation:0 "Shock Liberalisation"
 COLDWAR_EGY_fe_shock_liberalisation_desc:0 "Subsidies are slashed, tariffs torn down and the pound is exposed to the market almost overnight. The reformers promise that the pain will be brief and the rewards lasting, but in the bread queues of Cairo and the mill towns of the Delta, patience is in short supply and the old guard is already whispering of unrest."
 COLDWAR_EGY_fe_gradual_deregulation:0 "Gradual Deregulation"
 COLDWAR_EGY_fe_gradual_deregulation_desc:0 "Rather than risk the streets, the government dismantles controls one ministry and one commodity at a time, drafting new commercial codes and easing licensing rules as it goes. The pace frustrates the purists of the movement, but merchants and civil servants alike can adjust, and the reform is far harder to portray as an act of betrayal."
 COLDWAR_EGY_fe_abolish_price_controls:0 "Abolish Price Controls"
 COLDWAR_EGY_fe_abolish_price_controls_desc:0 "For two decades the state has decided what a loaf of bread, a kilo of sugar and a metre of cloth should cost. Now the ledgers of the supply ministries are closed and prices are left to the bazaar. Traders rejoice at the freedom to profit, while families on fixed wages count every piastre and wonder who this freedom is really for."
 COLDWAR_EGY_fe_dismantle_the_public_sector:0 "Dismantle the Public Sector"
 COLDWAR_EGY_fe_dismantle_the_public_sector_desc:0 "Nasser's great state companies, bloated with clerks and loss-making for years, are put up for sale, merged or simply closed. Investors circle the textile mills and the engineering works of Helwan. The unions denounce what they call a fire sale of the nation's inheritance, but the treasury is relieved of burdens it could no longer carry."
 COLDWAR_EGY_fe_free_zones_everywhere:0 "Free Zones Everywhere"
 COLDWAR_EGY_fe_free_zones_everywhere_desc:0 "Along the canal and the Mediterranean coast, customs barriers fall and foreign firms are invited to build, ship and trade on generous terms. Planners dream of Suez and Alexandria as great entrepots linking three continents, free of the permits and inspections that have made doing business in Egypt such a trial."
 COLDWAR_EGY_fe_a_flat_tax:0 "A Flat Tax"
 COLDWAR_EGY_fe_a_flat_tax_desc:0 "The tangled system of surtaxes and levies inherited from the socialist years is swept away in favour of a simple, low and predictable rate. Accountants and shopkeepers celebrate; the movement argues that honest reporting will follow lower rates. Critics counter that the burden has merely been lifted from the wealthy and shifted onto the poor."
 COLDWAR_EGY_fe_minimal_regulations:0 "Minimal Regulations"
 COLDWAR_EGY_fe_minimal_regulations_desc:0 "Licensing boards, inspection regimes and sprawling rulebooks are cut back to a bare minimum, on the principle that the entrepreneur knows his business better than any official. Businesses spring up in cramped Cairo workshops and Delta warehouses alike, although safety and labour standards are left to the conscience of the employer."
 COLDWAR_EGY_fe_free_trade:0 "Free Trade"
 COLDWAR_EGY_fe_free_trade_desc:0 "Egypt turns its face to the world market. Import restrictions are lifted and exporters are no longer bound to state trading agencies, while Western chambers of commerce praise the new openness. Local manufacturers, long sheltered behind tariff walls, must now learn to compete with the goods flooding in through the ports."
 COLDWAR_EGY_fe_a_free_pound:0 "A Free-Floating Pound"
 COLDWAR_EGY_fe_a_free_pound_desc:0 "The Central Bank steps back, and the Egyptian pound is left to find its own value against the dollar and the pound sterling. Exporters of cotton and raw materials welcome the change, but every importer and every household that buys foreign goods feels the swing of the exchange rate in the price of daily life."
 COLDWAR_EGY_fe_cut_the_mugamma:0 "Cut the Mugamma"
 COLDWAR_EGY_fe_cut_the_mugamma_desc:0 "The Mugamma, the vast government building overlooking Tahrir Square, has become a byword for queues, stamps and delay. The movement vows to shrink it, cutting posts, merging departments and abolishing whole layers of paperwork. For the thousands of employees whose livelihoods depend on the civil service, the cut is a declaration of war."
 COLDWAR_EGY_fe_private_schools_and_clinics:0 "Private Schools and Clinics"
 COLDWAR_EGY_fe_private_schools_and_clinics_desc:0 "Where the state has struggled to keep classrooms and wards open, the government now invites private providers to take over. Fee-paying schools and clinics appear in the better districts of Cairo and Alexandria and standards rise for those who can afford them, while the poor are left to a public system that receives ever less attention."
 COLDWAR_EGY_fe_the_backlash:0 "The Backlash"
 COLDWAR_EGY_fe_the_backlash_desc:0 "The pace of reform has produced winners and losers, and the losers are organising. Laid-off clerks, striking mill workers and an uneasy officer corps gather in the cafes and mosques. The movement's leaders must now decide whether to soften their programme or stand firm against a growing tide of resentment."
 COLDWAR_EGY_fe_a_safety_net:0 "A Minimal Safety Net"
 COLDWAR_EGY_fe_a_safety_net_desc:0 "Recognising that a market economy cannot survive on the goodwill of the comfortable alone, the government quietly builds a modest floor beneath the poorest. Basic support for the unemployed, the old and the sick takes the sharpest edge from the grievances of the street, and the movement's pragmatists claim vindication."
 COLDWAR_EGY_fe_no_compromise:0 "No Compromise"
 COLDWAR_EGY_fe_no_compromise_desc:0 "The leadership refuses to bend. Strikes are met with the police, critics are warned that reform is not a matter for negotiation, and those who object are told that the market will repay their sacrifice in time. Order is kept on the streets of Cairo, but the bitterness of those left behind runs deep."
 COLDWAR_EGY_fe_hong_kong_on_the_nile:0 "Hong Kong on the Nile"
 COLDWAR_EGY_fe_hong_kong_on_the_nile_desc:0 "The vision of the movement's founders is within reach. Glass offices rise in Cairo, ships queue at the free ports and foreign banks vie to lend. Whether Egypt becomes a trading city-state in spirit or merely a country of two nations, the old state-run economy has been replaced by something its architects scarcely dared hope for."
 COLDWAR_EGY_fn_the_friends_of_the_nile:0 "The Friends of the Nile"
 COLDWAR_EGY_fn_the_friends_of_the_nile_desc:0 "Scientists, agronomists and engineers who watched the high dam rise at Aswan have come to fear what it may cost the river that has fed Egypt since the pharaohs. Now their movement holds the reins of government, determined that the Nile be treated as a living inheritance rather than a resource to be spent."
 COLDWAR_EGY_fn_river_or_sun:0 "The River or the Sun?"
 COLDWAR_EGY_fn_river_or_sun_desc:0 "The Friends of the Nile are united in their love of the river but divided about the future. Some insist that Egypt's salvation lies in healing the damage done to the valley and the Delta; others look to the desert sun, remembering the solar engines built beside the Nile at Maadi before the Great War. The choice will define the nation."
 COLDWAR_EGY_fn_protect_the_river:0 "Protect the River"
 COLDWAR_EGY_fn_protect_the_river_desc:0 "The government turns its attention to the fields and the water that feeds them. Irrigation canals are repaired, runoff is controlled and farmers are taught to work with the river's rhythms rather than against them. It is a patient programme, with little of the glamour of heavy industry, but one that speaks to the oldest instincts of the Egyptian countryside."
 COLDWAR_EGY_fn_a_solar_egypt:0 "A Solar Egypt"
 COLDWAR_EGY_fn_a_solar_egypt_desc:0 "Half a century ago an American inventor named Frank Shuman built a solar-powered irrigation plant at Maadi, only for the Great War to cut short his dream. The Friends of the Nile resolve to finish what he began, and to make the sun that scorches the desert into the engine of a new Egypt."
 COLDWAR_EGY_fn_return_the_silt:0 "Return the Silt"
 COLDWAR_EGY_fn_return_the_silt_desc:0 "Since the dam closed the flood, the fertile silt that once enriched the valley has settled behind the walls at Aswan, and farmers have turned to costly chemical fertiliser. Engineers now draw up plans to release and carry sediment downstream, restoring a little of the natural bounty that gave Egypt its ancient name of the Black Land."
 COLDWAR_EGY_fn_save_the_delta_coast:0 "Save the Delta Coast"
 COLDWAR_EGY_fn_save_the_delta_coast_desc:0 "Without the silt to replenish it, the Delta coast is slowly retreating before the Mediterranean, and salt creeps into fields and wells. The government builds barriers and plants shorelines, determined to hold back the sea from Alexandria and the northern farmlands, whose loss would be a wound that the nation could not easily heal."
 COLDWAR_EGY_fn_lake_manzala_fisheries:0 "Lake Manzala Fisheries"
 COLDWAR_EGY_fn_lake_manzala_fisheries_desc:0 "The lagoons of the northern Delta have long supported fishing communities, now struggling with silted channels and polluted water. By cleaning the shallows, regulating catches and restoring the fish stocks, the government hopes to give thousands of fellahin and fishermen a living, and to show that conservation can feed as well as protect."
 COLDWAR_EGY_fn_shumans_legacy:0 "Shuman's Legacy"
 COLDWAR_EGY_fn_shumans_legacy_desc:0 "In the open desert west of the Nile, the first solar arrays are raised to turn sunlight into power and pumping water. Where Shuman's mirrors once stood in the sand at Maadi, a new generation of engineers breaks ground in the New Valley, convinced that Egypt's brightest resource has been waiting there all along."
 COLDWAR_EGY_fn_winds_of_zafarana:0 "The Winds of Zafarana"
 COLDWAR_EGY_fn_winds_of_zafarana_desc:0 "On the Red Sea coast, where the wind blows steadily across the barren shore, turbines begin to turn above the dunes. The scheme is bold and unfamiliar, derided by sceptics as a toy for visionaries, yet it promises power without smoke and a measure of independence from imported fuel."
 COLDWAR_EGY_fn_clean_industry:0 "Clean Industry"
 COLDWAR_EGY_fn_clean_industry_desc:0 "Smoke over Helwan, tanneries fouling the river and chemical works discharging into the canals have made the price of industrial progress painfully visible. The Friends of the Nile impose new standards on the factories, forcing owners to clean up or pay the penalty. Output may suffer, but the health of the nation's children improves."
 COLDWAR_EGY_fn_a_green_belt_for_cairo:0 "A Green Belt for Cairo"
 COLDWAR_EGY_fn_a_green_belt_for_cairo_desc:0 "The capital sprawls ever outward, swallowing the farmland that once fed it under apartment blocks and brick kilns. The government draws a line around the city and plants trees and parks within it, giving the crowded millions of Cairo some room to breathe and a reminder that their city grew from the green valley."
 COLDWAR_EGY_fn_nile_basin_water_talks:0 "Nile Basin Water Talks"
 COLDWAR_EGY_fn_nile_basin_water_talks_desc:0 "The Nile does not belong to Egypt alone. Envoys travel to Khartoum and Addis Ababa with an unfamiliar message, that the river's waters should be shared by agreement rather than guarded by threats. Whether upstream capitals trust Cairo's sudden gentleness remains to be seen."
 COLDWAR_EGY_fn_stockholm_1972:0 "Stockholm 1972"
 COLDWAR_EGY_fn_stockholm_1972_desc:0 "As the world's first great conference on the human environment convenes, Egypt arrives with a delegation that is eager to be heard. For a nation long accustomed to speaking the language of revolution and war, the language of rivers, soil and air is a new way to win friends, particularly among the Nordic democracies."
 COLDWAR_EGY_fn_the_living_nile:0 "The Living Nile"
 COLDWAR_EGY_fn_the_living_nile_desc:0 "The river that sustained the pharaohs begins to recover its health. Farmers speak of better harvests, the coast holds against the sea and the desert shimmers with new power. The Friends of the Nile have shown that Egypt can modernise without sacrificing its oldest and most precious inheritance."
 COLDWAR_EGY_cp_the_centres_of_power:0 "The Centres of Power"
 COLDWAR_EGY_cp_the_centres_of_power_desc:0 "Ali Sabri has long commanded the machinery behind the throne: the Arab Socialist Union, the security services and the loyalist wing of the army. Now the Centres of Power step into the open. Under the Vanguard, the revolution is to be defended not by charisma, but by an organised and disciplined apparatus."
 COLDWAR_EGY_cp_the_vanguard_congress:0 "The Vanguard Congress"
 COLDWAR_EGY_cp_the_vanguard_congress_desc:0 "Delegates from every governorate gather in Cairo for a congress meant to give the new order a founding charter. Speeches praise the revolution and the working masses; behind the scenes, the apparatus hammers out who will speak for the party. From this hall emerges the leadership that Egypt's socialism was lacking."
 COLDWAR_EGY_cp_party_or_police:0 "Party or Police?"
 COLDWAR_EGY_cp_party_or_police_desc:0 "Sabri's allies are not of one mind. The ideologues of the party want to rule through committees, congresses and mass organisation, while the men of the Interior Ministry and the intelligence services trust in files, informers and the knock at the door. The Vanguard must decide which will be the backbone of the state."
 COLDWAR_EGY_cp_the_party_state:0 "The Party-State"
 COLDWAR_EGY_cp_the_party_state_desc:0 "The party becomes the skeleton of the nation. Every ministry, factory, village and university has its branch and its cadres, and no appointment of consequence is made without their blessing. The model is Moscow, adapted to the Nile, and its promise is a government that listens to the people only through a single trusted channel."
 COLDWAR_EGY_cp_the_mukhabarat_state:0 "The Mukhabarat State"
 COLDWAR_EGY_cp_the_mukhabarat_state_desc:0 "Authority flows from the offices of the Interior Ministry and the intelligence services rather than from congresses. Under Sharawi Gomaa, the Mukhabarat becomes the final arbiter of who may speak, travel or be promoted. The revolution is secure, but only because every citizen suspects that someone is listening."
 COLDWAR_EGY_cp_peoples_control_committees:0 "People's Control Committees"
 COLDWAR_EGY_cp_peoples_control_committees_desc:0 "Committees of trusted workers and party members are given the right to inspect offices, factories and cooperatives, and to report on waste and dishonesty. The Vanguard presents them as the people watching over their servants. Bureaucrats see them as spies, and the line between civic duty and denunciation is often hard to find."
 COLDWAR_EGY_cp_the_arab_socialist_youth_brigades:0 "The Youth Brigades"
 COLDWAR_EGY_cp_the_arab_socialist_youth_brigades_desc:0 "Schools, colleges and youth halls fall under the banner of the Arab Socialist Youth. Teenagers are drilled in the speeches of the revolution, sent to summer camps and encouraged to watch their elders for signs of bourgeois deviation. A generation raised in the shadow of defeat is being shaped to become the Vanguard's own."
 COLDWAR_EGY_cp_the_censorship_directorate:0 "The Censorship Directorate"
 COLDWAR_EGY_cp_the_censorship_directorate_desc:0 "A single directorate now decides what Egypt reads, hears and watches. Editors submit proofs before publication, film scripts pass through the ministry and even the verses sung at village weddings are listened to. The authorities speak of protecting the revolution from imperialist propaganda, though the silence in the cafes says more."
 COLDWAR_EGY_cp_files_on_everyone:0 "Files on Everyone"
 COLDWAR_EGY_cp_files_on_everyone_desc:0 "In the basements of the Interior Ministry, cabinets fill with dossiers on ministers, officers, journalists and shopkeepers alike. Every phone call and every private grievance is potentially a matter of record. The security chiefs know that a regime that knows everything about its citizens has little need to fear them."
 COLDWAR_EGY_cp_purge_the_officer_corps:0 "Purge the Officer Corps"
 COLDWAR_EGY_cp_purge_the_officer_corps_desc:0 "After the humiliation of 1967, the Vanguard does not trust the generals, whose loyalty is to the army and to the memory of Nasser rather than to the party. Names are struck from the lists, commanders are retired or arrested and loyal officers rise. The army learns that it serves the apparatus, not the other way around."
 COLDWAR_EGY_cp_one_leader_one_party:0 "One Leader, One Party"
 COLDWAR_EGY_cp_one_leader_one_party_desc:0 "The last rivals have been silenced, the last factions absorbed, and the Vanguard speaks with a single voice. Posters bring the leader's portrait to every wall in the land. The cult of unity is complete, and the question of who will lead Egypt after him can no longer be asked aloud."
 COLDWAR_EGY_cp_the_succession_in_the_apparatus:0 "The Succession in the Apparatus"
 COLDWAR_EGY_cp_the_succession_in_the_apparatus_desc:0 "The state is more tightly organised than ever before, and the thoughts of its leaders turn to the question that haunts every system built around one centre: what comes after? Different wings of the apparatus have their candidates, and each knows that whoever inherits the Centres of Power will hold the whole country."
 COLDWAR_EGY_cp_sharawi_gomaa:0 "Sharawi Gomaa's Interior"
 COLDWAR_EGY_cp_sharawi_gomaa_desc:0 "The Interior Minister, master of the security services, takes the helm. Sharawi Gomaa has spent years collecting the secrets on which the regime depends, and he now rules as he has always worked, quietly, thoroughly and with the file always open on his desk. Egypt becomes a state in which order matters before everything else."
 COLDWAR_EGY_cp_sami_sharaf:0 "Sami Sharaf's Presidency"
 COLDWAR_EGY_cp_sami_sharaf_desc:0 "The president's trusted secretary and keeper of the intelligence portfolio, Sami Sharaf, has lived all his career in the shadow of power. Now he steps into the light, carrying the loyalty of the secret services and the confidence of Moscow. His presidency promises continuity with the past and a close embrace with the Soviet Union."
 COLDWAR_EGY_cp_a_collective_leadership:0 "A Collective Leadership"
 COLDWAR_EGY_cp_a_collective_leadership_desc:0 "Rather than hand the state to a single man, the Vanguard chooses a council of the party's senior figures, in imitation of the Soviet leadership after Stalin. The arrangement reassures the cadres that no strongman will rise above them, though the cost is slower decisions and quiet rivalries behind the closed doors of the central committee."
 COLDWAR_EGY_cp_the_vanguard_state:0 "The Vanguard State"
 COLDWAR_EGY_cp_the_vanguard_state_desc:0 "The revolution is fully institutionalised. A disciplined party, a loyal army, heavy industry along the Nile and a front of friendly states beyond the frontier have turned Ali Sabri's vision from a faction's slogan into the settled order of the nation. Egypt has become a socialist republic that its builders believe is built to last."
 COLDWAR_EGY_cp_the_soviet_template:0 "The Soviet Template"
 COLDWAR_EGY_cp_the_soviet_template_desc:0 "The Vanguard turns to the Soviet model, with its five-year plans, its production quotas and its confidence that scientific planning can overcome backwardness. Advisers from Moscow help draft targets for steel, cotton and electricity. The task is vast, but the planners believe that what Russia achieved in a generation, Egypt can achieve in one as well."
 COLDWAR_EGY_cp_socialist_industrialisation:0 "Socialist Industrialisation"
 COLDWAR_EGY_cp_socialist_industrialisation_desc:0 "Cranes rise over Cairo and the valley as the state pours resources into heavy industry. New plants for steel, machinery and chemicals are meant to carry Egypt from a cotton-exporting country to an industrial power. Workers march to the sites under banners praising the plan, though the cost of such ambitions weighs heavily on the national budget."
 COLDWAR_EGY_cp_soviet_specialists_in_helwan:0 "Soviet Specialists in Helwan"
 COLDWAR_EGY_cp_soviet_specialists_in_helwan_desc:0 "Engineers from the Soviet Union arrive at the great steelworks of Helwan, bringing blueprints, technicians and a fraternal confidence in the future. They teach Egyptian workers to run the furnaces and rolling mills, and leave behind a generation trained in the Soviet manner. Yet the presence of so many foreign experts stirs resentment in some quarters."
 COLDWAR_EGY_cp_nationalise_foreign_banks:0 "Nationalise the Foreign Banks"
 COLDWAR_EGY_cp_nationalise_foreign_banks_desc:0 "What remains of foreign finance in Egypt is brought under the control of the state. Branches of British, French and other banks are taken over in the name of the people, their reserves absorbed into the national treasury. The capitals of the West protest loudly, but the Vanguard answers that economic independence is not for sale."
 COLDWAR_EGY_cp_the_fixed_price_system:0 "The Fixed Price System"
 COLDWAR_EGY_cp_the_fixed_price_system_desc:0 "The state sets the price of bread, fuel, cloth and rent, and enforces it with inspectors and ration cards. For the poor, the system offers security against the cruelties of the market. For the economists, it hides shortages and distorts production, but the Vanguard rejects any suggestion that the people's welfare should depend on supply and demand."
 COLDWAR_EGY_cp_comecon_barter_trade:0 "Comecon Barter Trade"
 COLDWAR_EGY_cp_comecon_barter_trade_desc:0 "Egypt's cotton, rice and textiles flow east in exchange for machinery, spare parts and military supplies, settled in barter agreements rather than hard currency. The arrangement ties the economy ever closer to the socialist bloc and shields it from the whims of Western markets, even as it binds the country to the plans of its partners."
 COLDWAR_EGY_cp_socialist_industrialisation_complete:0 "Industrialisation Complete"
 COLDWAR_EGY_cp_socialist_industrialisation_complete_desc:0 "The great industrial drive reaches its goal. New factories hum across the land, a skilled workforce handles the machinery and the products of Egyptian plants appear in the shops and on the shelves. The Vanguard can point to the smokestacks as proof that the revolution has built what the old regime and the colonial powers never allowed."
 COLDWAR_EGY_cp_the_state_grain_monopoly:0 "The State Grain Monopoly"
 COLDWAR_EGY_cp_the_state_grain_monopoly_desc:0 "The state takes sole control of the purchase and distribution of grain. Village cooperatives deliver their harvest to government depots at fixed rates, ensuring cheap bread for the cities and a steady revenue for the treasury. The fellahin, who work the land, feel the pinch, but the Vanguard asks them to be patient for the sake of the revolution."
 COLDWAR_EGY_cp_mass_literacy_campaign:0 "Mass Literacy Campaign"
 COLDWAR_EGY_cp_mass_literacy_campaign_desc:0 "Teachers, students and party volunteers fan out through the villages with slates, primers and lanterns, determined to teach the millions who cannot read. Night classes fill with farmers and washerwomen learning the letters of the Quran and of the party newspapers alike. The Vanguard believes that a literate people is a people that can be led to socialism."
 COLDWAR_EGY_cp_workers_housing:0 "Workers' Housing"
 COLDWAR_EGY_cp_workers_housing_desc:0 "On the edge of the old capital rise rows of apartment blocks for factory workers and their families, with schools, clinics and cooperatives close by. The Vanguard presents them as the dawn of a new city built by and for the working class. For families leaving the tenements of Cairo, the new flats are a glimpse of something better."
 COLDWAR_EGY_cp_the_treaty_stronger_than_friendship:0 "A Treaty Stronger than Friendship"
 COLDWAR_EGY_cp_the_treaty_stronger_than_friendship_desc:0 "The friendship pact with the Soviet Union is deepened into a true alliance. Moscow pledges its weapons, advisers and political protection, and Cairo opens its military and diplomatic life to a close partner. For Egypt, it is a guarantee against Israel; for the West, a sign that the country has chosen its camp."
 COLDWAR_EGY_cp_facilities_for_the_eskadra:0 "Facilities for the Fifth Eskadra"
 COLDWAR_EGY_cp_facilities_for_the_eskadra_desc:0 "Soviet warships gain the right to use the harbours of Alexandria and Mersa Matruh, bringing the Mediterranean squadron within easy reach of the American Sixth Fleet. Sailors in grey uniforms walk the quays of the old port. The arrangement strengthens the shield over Egypt, but critics at home speak darkly of a foreign base on Arab soil."
 COLDWAR_EGY_cp_the_soviet_air_umbrella:0 "The Soviet Air Umbrella"
 COLDWAR_EGY_cp_the_soviet_air_umbrella_desc:0 "Soviet-manned missile batteries and fighters take up positions along the canal and over the Delta, closing the skies that Israeli aircraft once ruled. Pilots and crews who speak no Arabic hold the line side by side with Egyptian gunners. Cairo can breathe again, though the price is a dependence that grows with every new squadron."
 COLDWAR_EGY_cp_arm_the_liberation_movements:0 "Arm the Liberation Movements"
 COLDWAR_EGY_cp_arm_the_liberation_movements_desc:0 "Cairo throws open its arsenals and training camps to the Palestinian fedayeen and to revolutionary movements across Arabia and the Horn of Africa. The Vanguard sees a duty to fight imperialism wherever it appears. Money, weapons and advisers flow outward, and the neighbouring monarchs look nervously towards the Nile."
 COLDWAR_EGY_cp_the_front_of_steadfastness:0 "The Front of Steadfastness"
 COLDWAR_EGY_cp_the_front_of_steadfastness_desc:0 "Syria, Libya, Iraq, Algeria and the radical states of Arabia gather behind Egypt in a common front against Israel and its Western friends. Summit communiques ring with defiance, and the capitals of the Arab world are bound together by a shared enemy and Soviet arms. The Vanguard has moved Egypt from the head of one coalition to the leadership of another."
 COLDWAR_EGY_cp_mobilise_the_masses:0 "Mobilise the Masses"
 COLDWAR_EGY_cp_mobilise_the_masses_desc:0 "The Vanguard calls on the entire nation to prepare for the great struggle. Factories convert to war production, reservists are enrolled and the party's mass organisations drill in the squares of every town. The Egyptian people are told that victory belongs to those who are ready to give everything, and that the hour is near."
 COLDWAR_EGY_ecp_the_peoples_republic:0 "The People's Republic of Egypt"
 COLDWAR_EGY_ecp_the_peoples_republic_desc:0 "The communists who were jailed and driven underground under Nasser now rule from the presidential palace. The republic is renamed in the people's name, the old order is swept aside and the revolution begins again, this time in earnest. In the mosques and the bazaars, however, there are many who regard the new masters with fear."
 COLDWAR_EGY_ecp_the_central_committee:0 "The Central Committee"
 COLDWAR_EGY_ecp_the_central_committee_desc:0 "Veterans of the prisons of Abu Zaabal and the Kharga oasis take their seats in the Central Committee. Men and women who spent years debating Marx in cells now have to govern a country of thirty million. The committee's task is to turn long-nursed theory into a programme that fellahin and factory workers can recognise."
 COLDWAR_EGY_ecp_which_road:0 "Which Road to Socialism?"
 COLDWAR_EGY_ecp_which_road_desc:0 "The founders of Egyptian communism are divided. Moscow offers experience, arms and a settled model of the planned state; Peking offers a revolution built on the peasantry and the spirit of self-reliance. The party must choose which of the two great teachers to follow, knowing that the choice will shape the republic for a generation."
 COLDWAR_EGY_ecp_the_soviet_road:0 "The Soviet Road"
 COLDWAR_EGY_ecp_the_soviet_road_desc:0 "The party looks to Moscow, adopting its institutions, its planning methods and its place in the socialist bloc. Soviet advisers fill the ministries, delegations travel to Moscow for training and the Egyptian economy is reorganised on a pattern proven in Russia. The road is well-trodden, and the rewards are the friendship and the weapons of a superpower."
 COLDWAR_EGY_ecp_the_chinese_road:0 "The Chinese Road"
 COLDWAR_EGY_ecp_the_chinese_road_desc:0 "Impressed by the revolutionary energy of Mao's China, a section of the leadership turns away from Moscow. Egypt, they argue, is a land of peasants, and the revolution must be built in the villages rather than the ministries. The break with the Soviet Union is bitter, but Peking opens its arms to a new ally on the Nile."
 COLDWAR_EGY_ecp_gosplan_on_the_nile:0 "Gosplan on the Nile"
 COLDWAR_EGY_ecp_gosplan_on_the_nile_desc:0 "A State Planning Committee is established in Cairo, with Soviet economists at its elbow. Production targets are set for every mill and mine, and the traditional bazaar economy yields to quotas and plans. The planners are confident that rational direction will transform the Nile Valley, though the clerks who must meet the targets are less certain."
 COLDWAR_EGY_ecp_the_heavy_industry_ministry:0 "The Heavy Industry Ministry"
 COLDWAR_EGY_ecp_the_heavy_industry_ministry_desc:0 "A new ministry is charged with building the foundations of socialist power: steel, machinery, munitions and the factories that make them. In Cairo and the industrial belt around it, shops and furnaces expand under the supervision of party engineers. The ministry's leaders speak openly of an Egypt that makes its own tanks and guns."
 COLDWAR_EGY_ecp_comecon_membership:0 "Apply to Comecon"
 COLDWAR_EGY_ecp_comecon_membership_desc:0 "Cairo petitions Moscow for a place in the economic community of the socialist states. Membership would bring planned trade, technical aid and a guaranteed market for Egyptian cotton, but also the obligation to fit the national economy into a wider scheme set by others. The decision rests with the Soviet leadership."
 COLDWAR_EGY_ecp_peoples_communes:0 "People's Communes of the Delta"
 COLDWAR_EGY_ecp_peoples_communes_desc:0 "Following the Chinese example, the land of the Delta is organised into great communes in which farmers work, eat and study together under party guidance. Cadres praise the end of the landlord and the moneylender, but the fellahin, who have a long attachment to their own plots, look on the new arrangements with uncertainty."
 COLDWAR_EGY_ecp_self_reliance:0 "Self-Reliance"
 COLDWAR_EGY_ecp_self_reliance_desc:0 "Egypt resolves to depend on no foreign power. Spare parts are made at home, the workshops are encouraged to improvise, and sanctions and embargoes are treated as a challenge to be met rather than a danger to be avoided. The party's slogan holds that a nation which relies on its own strength can never be starved into submission."
 COLDWAR_EGY_ecp_the_mass_line:0 "The Mass Line"
 COLDWAR_EGY_ecp_the_mass_line_desc:0 "The party's cadres are sent out to live among the people, listening to their grievances and carrying them back to the centre, and then returning with policies explained in the people's own words. It is a method designed to keep the revolution from hardening into a bureaucracy, and to keep the leadership rooted in the fields."
 COLDWAR_EGY_ecp_barefoot_doctors:0 "Barefoot Doctors"
 COLDWAR_EGY_ecp_barefoot_doctors_desc:0 "Thousands of village youths are given a few months of medical training and sent home with a satchel of herbs, bandages and simple medicines. They are not true physicians, but for the first time the villages of Upper Egypt have someone to treat their fevers and deliver their babies. The programme becomes a symbol of the republic's care for the poor."
 COLDWAR_EGY_ecp_collectivise_the_cooperatives:0 "Collectivise the Cooperatives"
 COLDWAR_EGY_ecp_collectivise_the_cooperatives_desc:0 "The loose rural cooperatives of the Nasser years are merged into large collective farms under party supervision. The planners promise machinery, efficiency and an end to the fragmentation of the land. Many peasants resent the loss of control over their own fields, and the officials sent to oversee them are not always welcome."
 COLDWAR_EGY_ecp_nationalise_the_remainder:0 "Nationalise the Remainder"
 COLDWAR_EGY_ecp_nationalise_the_remainder_desc:0 "The last pockets of private enterprise, from workshops to import houses, are taken into public ownership. The party declares that the means of production now belong to the people. For the former owners, the result is ruin, and for the state, a vast inheritance that its managers must learn to run."
 COLDWAR_EGY_ecp_the_state_trade_monopoly:0 "The State Trade Monopoly"
 COLDWAR_EGY_ecp_the_state_trade_monopoly_desc:0 "All foreign commerce is placed in the hands of state trading corporations. Cotton, rice and imports pass through offices in Cairo and Alexandria under the watchful eye of the party. The monopoly shields the economy from foreign speculation and gives the planners control over every shipment, though it also stifles initiative and invites delay."
 COLDWAR_EGY_ecp_the_electrification_plan:0 "The Electrification Plan"
 COLDWAR_EGY_ecp_the_electrification_plan_desc:0 "Following Lenin's maxim that communism is soviet power plus electrification, the party launches a programme to carry power lines to every village and workshop. Pylons march down the valley and new generators rise by the river. For millions who have lived by oil lamp and the sun, the electric light is the clearest proof of the revolution."
 COLDWAR_EGY_ecp_a_planned_economy:0 "A Planned Economy"
 COLDWAR_EGY_ecp_a_planned_economy_desc:0 "From the steelworks of Helwan to the cotton fields of the Delta, the economy now runs to a single plan. Prices, wages, harvests and exports are all set in the offices of the central committee. The planners believe they have mastered the unruly rhythms of the market, and that Egypt has finally taken control of its own future."
 COLDWAR_EGY_ecp_religion_and_the_revolution:0 "Religion and the Revolution"
 COLDWAR_EGY_ecp_religion_and_the_revolution_desc:0 "A communist government in a land where five times a day the muezzin calls the faithful to prayer cannot avoid the question of religion. The party's thinkers disagree on whether the revolution should seek peace with the mosque or confront it. The answer will decide whether the republic is accepted in the villages or resisted."
 COLDWAR_EGY_ecp_accommodate_al_azhar:0 "Accommodate al-Azhar"
 COLDWAR_EGY_ecp_accommodate_al_azhar_desc:0 "The party seeks an understanding with the scholars of al-Azhar. Sheikhs are assured that their faith will be protected, while the leadership argues that Islam's call for justice and its concern for the poor are compatible with socialism. The compromise offends the purists but reassures the believers."
 COLDWAR_EGY_ecp_state_atheism:0 "Scientific Atheism"
 COLDWAR_EGY_ecp_state_atheism_desc:0 "The party declares religion a relic of feudal society. Schools teach the scientific worldview, endowments are seized and sermons are monitored. Some villages comply in silence; others see in the campaign an attack on the faith itself, and the pulpits become centres of quiet resistance. The republic has taken on a struggle it may find hard to win."
 COLDWAR_EGY_ecp_womens_liberation:0 "Women's Liberation"
 COLDWAR_EGY_ecp_womens_liberation_desc:0 "Women are called to the factory, the schoolroom and the party congress as equal partners. Laws are rewritten to end child marriage and the veil is discouraged in public offices. For many working women, it is a liberation; for traditional families and conservative clerics, it is a provocation that the revolution has not yet earned the right to make."
 COLDWAR_EGY_ecp_red_universities:0 "Red Universities"
 COLDWAR_EGY_ecp_red_universities_desc:0 "The old universities are remodelled, with admission opened to the sons and daughters of workers and peasants, and the curriculum reshaped around science, engineering and Marxist theory. Cairo University and Ain Shams are filled with a new kind of student, grateful to the republic and expected to repay it with loyal service."
 COLDWAR_EGY_ecp_political_commissars:0 "Political Commissars"
 COLDWAR_EGY_ecp_political_commissars_desc:0 "In every regiment and every ship, a party commissar stands beside the commanding officer. Orders must be countersigned; politics is taught alongside drill. The generals bristle at the new supervisors, but the party has no intention of letting the army become a state within the state, as it so often has in Egypt's past."
 COLDWAR_EGY_ecp_the_peoples_army:0 "The People's Army"
 COLDWAR_EGY_ecp_the_peoples_army_desc:0 "The army is recast as the armed people, drawing its officers from workers' families and its soldiers from the factories and the fields. Its loyalty is pledged to the republic and the party rather than to any individual commander. Cairo hopes the Egyptian soldier will fight with a conviction that the humbled conscripts of 1967 lacked."
 COLDWAR_EGY_ecp_the_second_generation:0 "The Second Generation"
 COLDWAR_EGY_ecp_the_second_generation_desc:0 "The founders are ageing and a new cohort is rising, men and women who were children when the revolution came. They have no memory of the prisons and the underground, and their questions are those of administrators. The party must decide whether to hold fast to the doctrines of its youth or to adapt them to a changed world."
 COLDWAR_EGY_ecp_socialist_reform:0 "Socialist Reform"
 COLDWAR_EGY_ecp_socialist_reform_desc:0 "Younger leaders press for a new course, with greater autonomy for managers, incentives for workers and a more open exchange of ideas. The old guard fears that reform will be the first step back towards capitalism, but the reformers insist that a system which cannot change will wither. The republic opens itself, carefully, to its own improvement."
 COLDWAR_EGY_ecp_orthodoxy:0 "Orthodoxy"
 COLDWAR_EGY_ecp_orthodoxy_desc:0 "The party closes ranks around the doctrines of its founders. Deviation is denounced, debate is discouraged and the leadership insists that the road has already been charted. Discipline holds the republic together, and the faithful take comfort in the certainty that they are following the path of history, whatever the world may say."
 COLDWAR_EGY_ecp_the_socialist_republic:0 "The Socialist Republic"
 COLDWAR_EGY_ecp_the_socialist_republic_desc:0 "After years of struggle, purge and construction, the republic stands complete. A disciplined party, a planned economy and a people schooled in the new order mark the final achievement of the Egyptian communists. Whatever its flaws, it is the fulfilment of a dream long nursed in prison cells and secret meetings."
 COLDWAR_EGY_wc_power_to_the_councils:0 "Power to the Councils"
 COLDWAR_EGY_wc_power_to_the_councils_desc:0 "From the picket lines of Helwan and Mahalla, from the bread riots that shook the cities, a new idea has spread: that those who work should rule. With the old state shattered, the councils of the workers and peasants now claim the authority that ministers and generals once held, and the people hold power in their own hands."
 COLDWAR_EGY_wc_the_federation_of_councils:0 "The Federation of Councils"
 COLDWAR_EGY_wc_the_federation_of_councils_desc:0 "Scattered councils in the mills, docks and villages are knit into a federation, with delegates chosen and recalled by those who sent them. There is no president and no politburo, only a network of assemblies. It is a fragile and unfamiliar structure, but those who built it believe it to be the purest expression of the revolution."
 COLDWAR_EGY_wc_factories_or_villages:0 "Factories or Villages?"
 COLDWAR_EGY_wc_factories_or_villages_desc:0 "The revolution has two hearts. The mill workers of the industrial towns see themselves as its vanguard, while the villagers of the Delta and the Said insist that the real wealth of Egypt lies in the soil. The federation must decide where its centre of gravity will lie, and which class will set the pace."
 COLDWAR_EGY_wc_the_factory_councils:0 "The Factory Councils"
 COLDWAR_EGY_wc_the_factory_councils_desc:0 "In Helwan, Mahalla al-Kubra and the Cairo workshops, committees elected by the shop floor take over the management of the factories. Engineers answer to workers, and the old managers are made to justify every order. The production lines stumble at first, but the workers take a pride in running their own machines."
 COLDWAR_EGY_wc_the_village_communes:0 "The Village Communes"
 COLDWAR_EGY_wc_the_village_communes_desc:0 "Village by village, the landless and smallholding fellahin take collective control of the land. Assemblies of farmers decide what to plant and how to share the harvest, and the mayors and landlords who once ruled the countryside are swept aside. It is a revolution of the soil, rooted in a deep memory of oppression."
 COLDWAR_EGY_wc_occupy_the_factories:0 "Occupy the Factories"
 COLDWAR_EGY_wc_occupy_the_factories_desc:0 "Workers seize the plants, lock out the managers and run the machines themselves. Banners hang from the gates, and the sound of music mingles with the clatter of the looms. Production falters in the turmoil, but the occupation shows the world that the factories belong to those who work in them."
 COLDWAR_EGY_wc_councils_plan_production:0 "The Councils Plan Production"
 COLDWAR_EGY_wc_councils_plan_production_desc:0 "With the factories under their command, the councils begin to coordinate their output across the industrial belt, deciding for themselves what is to be made and for whom. Delegates travel between plants with schedules and samples. The effort is clumsy, but production gradually improves as workers find that they know their trade better than any bureaucrat."
 COLDWAR_EGY_wc_communal_land:0 "Communal Land"
 COLDWAR_EGY_wc_communal_land_desc:0 "The estates of the old landowners are divided among the villagers, who farm them as a common holding. Debts are cancelled and the village assemblies decide who gets water and when. The fellahin, so long the poorest of Egypt's people, now see the land as their own, and defend it with a fierce loyalty."
 COLDWAR_EGY_wc_free_bread:0 "Free Bread"
 COLDWAR_EGY_wc_free_bread_desc:0 "Bread, the staple of every Egyptian table and the spark of so many riots, is distributed freely from council depots to all who need it. No family goes hungry while the revolution holds. The councils proclaim that a society which cannot feed its people has no right to call itself just, though the cost weighs heavily on the common stores."
 COLDWAR_EGY_wc_barter_networks:0 "Barter Networks"
 COLDWAR_EGY_wc_barter_networks_desc:0 "With the old trading and credit systems in ruins, the councils exchange goods directly: grain for tools, cloth for fuel, services for supplies. Networks of delegates link village and factory, and the pound loses its hold on daily life. It is a rough and ready system, but one that keeps the economy moving without banks or merchants."
 COLDWAR_EGY_wc_abolish_the_bureaucracy:0 "Abolish the Bureaucracy"
 COLDWAR_EGY_wc_abolish_the_bureaucracy_desc:0 "The ministries of Cairo, with their stamps, queues and thousands of clerks, are declared obsolete. Officials return to the shop floor or the field, and their functions are taken over by elected delegates who serve for a short term. The Mugamma falls silent, and many ordinary Egyptians feel relief."
 COLDWAR_EGY_wc_dissolve_the_mukhabarat:0 "Dissolve the Mukhabarat"
 COLDWAR_EGY_wc_dissolve_the_mukhabarat_desc:0 "The offices and detention centres of the security services are thrown open, and their files burned in the streets. Prisoners walk free to cheering crowds. The councils swear that no secret police will ever again stand over the people, though others fear that the protection of the revolution against its enemies has been dangerously weakened."
 COLDWAR_EGY_wc_the_red_militias:0 "The Red Militias"
 COLDWAR_EGY_wc_the_red_militias_desc:0 "With the old army and police dismantled, the councils arm their own militias. Workers drill after their shifts, and guard posts spring up at the factory gates and village crossroads. They have little training and mixed equipment, but the militias believe a people in arms is a people that cannot be enslaved."
 COLDWAR_EGY_wc_solidarity_everywhere:0 "Solidarity with Workers Everywhere"
 COLDWAR_EGY_wc_solidarity_everywhere_desc:0 "The council movement sends messages across the borders, calling on the workers of Libya, Sudan, Yemen and beyond to rise as Egypt has done. The capitals of the world, East and West alike, regard the appeal with alarm. The council republic is isolated, but its leaders insist that the revolution cannot be confined to one country."
 COLDWAR_EGY_wc_no_masters:0 "No Masters"
 COLDWAR_EGY_wc_no_masters_desc:0 "Neither Washington nor Moscow will dictate to the councils. Foreign advisers are turned away, and envoys carrying the offers of great powers meet a polite refusal. The slogan of the new order is that no master, whether native or foreign, has a place on Egyptian soil, and the people take pride in a revolution that has no patron."
 COLDWAR_EGY_wc_the_council_republic:0 "The Council Republic"
 COLDWAR_EGY_wc_the_council_republic_desc:0 "Egypt has become a federation of free producers, with no president and no ministry above the councils. Workers run the mills, farmers hold the land and the delegates are accountable to those who sent them. The experiment is unprecedented in the Arab world, and the eyes of every revolutionary and every reactionary are fixed upon it."
 COLDWAR_EGY_misr_the_party_of_order:0 "The Misr Party of Order"
 COLDWAR_EGY_misr_the_party_of_order_desc:0 "Founded in the spirit of the centre platform of Mamdouh Salem, the Misr Party of Order offers Egypt what neither the radicals nor the old guard can: stability. Its creed is that of a strong state guiding a national capital, with cautious reform, firm discipline and no patience for ideological adventures. The country, weary after years of war and upheaval, listens."
 COLDWAR_EGY_misr_the_cabinet_of_salem:0 "The Salem Cabinet"
 COLDWAR_EGY_misr_the_cabinet_of_salem_desc:0 "Mamdouh Salem, the former police chief turned administrator, forms a cabinet of technocrats, loyal officers and seasoned civil servants. They are not revolutionaries, and say so. Their promise is to make the trains run, the ministries function and the nation steady, in the belief that a well-managed state is its own justification."
 COLDWAR_EGY_misr_centre_or_capital:0 "A Strong Centre or National Capital?"
 COLDWAR_EGY_misr_centre_or_capital_desc:0 "The party's leaders agree on the need for order but disagree on who is to deliver it. One school holds that only a powerful and unified centre can rein in the provinces and the factions; the other sees the future in Egyptian businessmen and industrialists, shielded and guided by the state. The party must decide where its weight will rest."
 COLDWAR_EGY_misr_a_strong_centre:0 "A Strong Centre"
 COLDWAR_EGY_misr_a_strong_centre_desc:0 "Authority is gathered into Cairo. Governors answer to the ministries, the ministries to the cabinet, and the cabinet to the party. Provincial grandees and rival power centres find their autonomy trimmed. Supporters call it national discipline, while opponents see the quiet return of the all-powerful state they had hoped was behind them."
 COLDWAR_EGY_misr_national_capital:0 "National Capital"
 COLDWAR_EGY_misr_national_capital_desc:0 "The state turns to the businessmen of Egypt, the cotton merchants, contractors and industrialists who know the market, and gives them favoured access to contracts and credit. The aim is a native capitalist class loyal to the nation and not to foreign banks. Critics suspect that the new champions will prove more loyal to their own fortunes than to the state."
 COLDWAR_EGY_misr_managed_platforms:0 "Managed Platforms"
 COLDWAR_EGY_misr_managed_platforms_desc:0 "Political activity is permitted, but only through a handful of approved platforms, each with its own manifesto and its own place in the system. Citizens may vote, and the debates are lively, but the party that governs has the means to ensure that it will never lose. It is a controlled pluralism for a country that distrusts disorder."
 COLDWAR_EGY_misr_the_interior_ministry_state:0 "The Interior Ministry State"
 COLDWAR_EGY_misr_the_interior_ministry_state_desc:0 "The Interior Ministry gains new powers to watch, license and discipline the political platforms. Its offices keep a close eye on journalists, student groups and preachers, and the police are quietly granted a wider remit. The party tells the public that this is the price of calm, and many Egyptians, tired of unrest, are inclined to agree."
 COLDWAR_EGY_misr_patriotic_media:0 "Patriotic Media"
 COLDWAR_EGY_misr_patriotic_media_desc:0 "Newspapers, radio and the new television studios are encouraged to put the nation first. Editors receive friendly guidance on which stories to run and which to leave out, while columnists praise the steadiness of the government. Without any need for a formal censor, the public hears one consistent and reassuring voice."
 COLDWAR_EGY_misr_loyal_governors:0 "Loyal Governors"
 COLDWAR_EGY_misr_loyal_governors_desc:0 "The governors of the provinces, from Alexandria to Aswan, are carefully chosen from among the party's most trusted servants. They report faithfully to Cairo and carry its policy into every town and village. Local notables who once ruled their districts as private fiefs find that the road to advancement now runs through the capital."
 COLDWAR_EGY_misr_state_champions:0 "State Champions"
 COLDWAR_EGY_misr_state_champions_desc:0 "The government nominates a number of great enterprises as national champions, in steel, textiles, cement and engineering, giving them privileges and protection in return for service to the national plan. Managers wear suits rather than uniforms, but they take their direction from Cairo. State capitalism, the party insists, is the surest route to prosperity."
 COLDWAR_EGY_misr_arms_for_gulf_money:0 "Arms for Gulf Money"
 COLDWAR_EGY_misr_arms_for_gulf_money_desc:0 "Gulf monarchies, flush with oil revenue and nervous about their own security, are happy to finance Egyptian arms factories in return for weapons and trained men. Cairo sees an opportunity to turn its military expertise into hard currency. The arrangement is profitable and discreet, and raises few questions in the Arab world."
 COLDWAR_EGY_misr_energy_sovereignty:0 "Energy Sovereignty"
 COLDWAR_EGY_misr_energy_sovereignty_desc:0 "The party resolves that Egypt must never again depend on foreign suppliers for its fuel. Survey teams comb the Gulf of Suez and the western desert, and a national oil company takes shape. The petroleum industry, supported by the state, becomes the backbone of the new order and a source of both revenue and political influence."
 COLDWAR_EGY_misr_controlled_infitah:0 "Controlled Infitah"
 COLDWAR_EGY_misr_controlled_infitah_desc:0 "The opening of the economy, so long discussed, is carried out on the state's terms. Foreign investors are invited to Egypt, but only on conditions set in Cairo: partnerships with national firms, limits on repatriated profit and the retention of strategic industries. The party believes that it has found a middle course between Nasser's closed doors and unchecked liberalism."
 COLDWAR_EGY_misr_the_price_stabilisation_fund:0 "The Price Stabilisation Fund"
 COLDWAR_EGY_misr_the_price_stabilisation_fund_desc:0 "A national fund buys grain, sugar and cooking oil in times of plenty and releases them in times of shortage, so that no sudden surge in prices can reach the bread queues. The measure is unglamorous, yet it keeps the cities calm, and the party is keenly aware how swiftly an unruly price can turn into an uprising."
 COLDWAR_EGY_misr_friend_of_moscow_partner_of_riyadh:0 "Friend of Moscow, Partner of Riyadh"
 COLDWAR_EGY_misr_friend_of_moscow_partner_of_riyadh_desc:0 "Cairo declines to choose between its patrons. Soviet advisers stay on the Nile and the Soviet arms continue to arrive, while Saudi money and goodwill flow towards the treasury. The party's diplomats pursue a delicate balancing act, in which Egypt's usefulness to both camps is its best protection against dependence on either."
 COLDWAR_EGY_misr_order_in_the_region:0 "Order in the Region"
 COLDWAR_EGY_misr_order_in_the_region_desc:0 "The party's idea of stability does not stop at the border. Envoys travel to Khartoum and Tripoli offering friendship, advice and assistance in suppressing the unrest that threatens the neighbouring regimes. A region of orderly, cooperative governments, under Egypt's gentle guidance, is the foreign policy goal of the Party of Order."
 COLDWAR_EGY_misr_the_order_state:0 "The Order State"
 COLDWAR_EGY_misr_the_order_state_desc:0 "The party's vision is realised. Governors, ministries, industrial champions and the security services work in concert, and the unpredictable energies of Egyptian politics have been channelled into orderly forms. Critics call it stagnant; supporters insist that the nation, after decades of upheaval, has earned a long period of calm."
 COLDWAR_EGY_irf_the_islamic_revolution_of_the_nile:0 "The Islamic Revolution of the Nile"
 COLDWAR_EGY_irf_the_islamic_revolution_of_the_nile_desc:0 "Inspired by the stunning events in Iran and by the writings of Fathi Shiqaqi, a coalition of young preachers, students and urban poor has overthrown the old order. They proclaim a revolution of the oppressed against both Washington and Moscow, and a republic ruled by the law of God. Egypt, seat of al-Azhar, is to become the lighthouse of the Muslim world."
 COLDWAR_EGY_irf_the_revolutionary_council:0 "The Revolutionary Council"
 COLDWAR_EGY_irf_the_revolutionary_council_desc:0 "A council of clerics, jurists and veterans of the underground takes charge of the state. Its proclamations are issued in the name of God and the people, and its decisions are enforced by committees in every neighbourhood and village. The old ministries remain, but the Revolutionary Council now directs them."
 COLDWAR_EGY_irf_parliament_or_guardianship:0 "Parliament or Guardianship?"
 COLDWAR_EGY_irf_parliament_or_guardianship_desc:0 "The revolution is united in faith but divided about government. One camp wishes to build an elected assembly in which Muslims deliberate under the guidance of the sharia; the other, inspired by the example of Qom, insists that the rule of the learned must stand above any parliament. The republic must choose its form."
 COLDWAR_EGY_irf_an_islamic_consultative_assembly:0 "An Islamic Consultative Assembly"
 COLDWAR_EGY_irf_an_islamic_consultative_assembly_desc:0 "Elections are held, and representatives of the cities and the villages gather to deliberate in the name of the shura, or consultation. Every candidate is vetted for piety and loyalty, but within those limits the debate is genuine and sometimes sharp. The assembly gives the revolution a voice and the people a stake in the new republic."
 COLDWAR_EGY_irf_guardianship_of_the_scholars:0 "Guardianship of the Scholars"
 COLDWAR_EGY_irf_guardianship_of_the_scholars_desc:0 "Supreme authority is placed in the hands of the most learned jurist, who guards the republic against deviation. The ulema of al-Azhar, so long confined to their mosques and lecture halls, now find themselves the arbiters of state policy. For the faithful it is the realisation of an ancient ideal; for the secular minded, a cause for deep dread."
 COLDWAR_EGY_irf_revolutionary_courts:0 "Revolutionary Courts"
 COLDWAR_EGY_irf_revolutionary_courts_desc:0 "Tribunals sit in schools and mosque halls, trying the officials, police chiefs and profiteers of the fallen regime. Verdicts are swift and sentences severe. The people cheer the punishment of the corrupt, while the lawyers of Cairo watch in horror as the careful machinery of Egyptian jurisprudence is swept aside."
 COLDWAR_EGY_irf_the_foundations_of_the_oppressed:0 "Foundations of the Oppressed"
 COLDWAR_EGY_irf_the_foundations_of_the_oppressed_desc:0 "Modelled on the great charitable foundations of Iran, new religious endowments take possession of the confiscated properties of the old elite. Their funds support hospitals, schools and the families of martyrs, and give the revolution a network of loyal beneficiaries. Critics note that no one outside the clerical establishment audits their accounts."
 COLDWAR_EGY_irf_islamic_labour_councils:0 "Islamic Labour Councils"
 COLDWAR_EGY_irf_islamic_labour_councils_desc:0 "Mill hands in Mahalla and dockers in Alexandria elect councils under the guidance of religious leaders, who preach that honest labour is a form of worship and that the exploitation of the worker is a sin. The councils serve the republic rather than challenge it, and they channel working class anger into the service of the revolution."
 COLDWAR_EGY_irf_nationalise_foreign_trade:0 "Nationalise Foreign Trade"
 COLDWAR_EGY_irf_nationalise_foreign_trade_desc:0 "The import-export houses of Cairo and Alexandria, so closely linked to the old regime and foreign powers, are seized by the state. Trade in grain, cotton and consumer goods passes under revolutionary control. The republic declares that Egypt will no longer be a market for foreign goods and a source of cheap raw materials for other people's profit."
 COLDWAR_EGY_irf_an_economy_of_the_oppressed:0 "An Economy of the Oppressed"
 COLDWAR_EGY_irf_an_economy_of_the_oppressed_desc:0 "The new government proclaims an economic order grounded in the dignity of the poor. Charitable funds, zakat and state spending are brought together to provide food, shelter and work, and the profits of the wealthy are directed to the needy. The revolution declares that Islam has its own path, neither capitalist nor communist."
 COLDWAR_EGY_irf_neither_east_nor_west_islamic:0 "Neither East nor West – Islamic Republic"
 COLDWAR_EGY_irf_neither_east_nor_west_islamic_desc:0 "The slogan of the Iranian revolution is adopted on the Nile. Soviet advisers are sent home, American envoys are refused entry, and the republic proclaims that it will accept the patronage of no power but God. Cairo's isolation is the price it pays for a revolution that depends on neither bloc."
 COLDWAR_EGY_irf_jerusalem_day:0 "Jerusalem Day"
 COLDWAR_EGY_irf_jerusalem_day_desc:0 "On the last Friday of Ramadan, crowds fill the streets of Cairo to demand the liberation of Jerusalem. The republic proclaims the Palestinian cause a sacred duty of all Muslims, and a burning issue of the revolution's legitimacy. The war with Israel is no longer a question of borders, but a struggle for the holy city."
 COLDWAR_EGY_irf_the_islamic_republic:0 "The Islamic Republic of Egypt"
 COLDWAR_EGY_irf_the_islamic_republic_desc:0 "After the upheaval of revolution and the strain of construction, the Islamic Republic of Egypt has found its form. Its courts, its foundations, its principles and its banners are all in place. Whether it becomes a beacon to the Muslim world or a cautionary tale, it has changed Egypt beyond recognition."
 COLDWAR_EGY_grd_the_guardian_jurist:0 "The Guardian Jurist"
 COLDWAR_EGY_grd_the_guardian_jurist_desc:0 "At the summit of the new order stands a single jurist, whose word is final on matters of religion and state. He holds no office, commands no army, and yet every ministry and barracks looks to him for guidance. For his followers he is the guardian of the revolution, answerable to God alone."
 COLDWAR_EGY_grd_export_or_fortress:0 "Export or Fortress?"
 COLDWAR_EGY_grd_export_or_fortress_desc:0 "The Guardians are of one mind about the sanctity of the revolution but not about its destiny. Some insist that it must be carried abroad before the world's powers snuff it out; others argue that it must first be made invulnerable at home. The jurist's decision will define the republic's character for years to come."
 COLDWAR_EGY_grd_export_the_revolution:0 "Export the Revolution"
 COLDWAR_EGY_grd_export_the_revolution_desc:0 "Preachers, agents and arms leave Egypt for neighbouring lands, supporting the oppressed and the faithful against their rulers. Cairo declares that the revolution has no borders and no master. The monarchs of the Gulf follow the news with growing alarm, and the intelligence services of half the world take note."
 COLDWAR_EGY_grd_fortress_revolution:0 "Fortress Revolution"
 COLDWAR_EGY_grd_fortress_revolution_desc:0 "The revolution turns inward, bolting its doors and fortifying its frontiers. Egypt's leaders reason that a republic of the faithful is safe only if it is beyond the reach of its enemies, and they build walls of vigilance in the press, the barracks and the mosque. Foreign envoys and agitators find the Nile a far less welcoming place."
 COLDWAR_EGY_grd_pasdaran_of_the_nile:0 "Pasdaran of the Nile"
 COLDWAR_EGY_grd_pasdaran_of_the_nile_desc:0 "A corps of devout, politically reliable fighters is raised and given precedence over the army. Their loyalty is to the revolution and to the jurist, and their ranks fill with young men who find in the movement a sense of purpose. The regular officers look on with envy and apprehension as the Guardians accumulate weapons and prestige."
 COLDWAR_EGY_grd_the_basij:0 "The Basij"
 COLDWAR_EGY_grd_the_basij_desc:0 "Beyond the elite corps, the government calls on millions of volunteers: schoolboys, shopkeepers, old men with rifles. Drilled in the mosque courtyards and marched through the streets, the mobilised masses embody the revolution's claim that a faithful people cannot be defeated. Their enthusiasm is boundless and their training is limited."
 COLDWAR_EGY_grd_purge_the_universities:0 "Purge the Universities"
 COLDWAR_EGY_grd_purge_the_universities_desc:0 "The academies of Cairo and Alexandria are scoured of secular and suspect professors. Lectures are monitored, curricula revised and students investigated for loyalty. The faculties empty, the laboratories fall quiet and the Guardians declare the cleansing of the university complete, though Egyptian science suffers badly for it."
 COLDWAR_EGY_grd_the_economy_of_resistance:0 "The Economy of Resistance"
 COLDWAR_EGY_grd_the_economy_of_resistance_desc:0 "Sanctions, boycotts and the hostility of the great powers are met with defiance. Egypt is to produce what it needs and do without what it cannot make, subordinating comfort to principle. The jurist declares that a nation that refuses to bend can survive anything, and the long years of hardship begin."
 COLDWAR_EGY_grd_ration_coupons:0 "Ration Coupons"
 COLDWAR_EGY_grd_ration_coupons_desc:0 "In a time of scarcity, the state undertakes to distribute essentials directly. Every household receives coupons for bread, oil, sugar and fuel, exchangeable at the revolutionary cooperatives. The system is rigid, and endless queues form, but no family is left to starve, which wins the Guardians the loyalty of the poorest."
 COLDWAR_EGY_grd_revolutionary_foundations:0 "Revolutionary Foundations"
 COLDWAR_EGY_grd_revolutionary_foundations_desc:0 "Vast religious foundations take possession of seized estates and factories, answerable only to the jurist. They fund hospitals, mosques and the families of the fallen, but also operate as states within the state, with their own revenue, their own influence and their own opaque dealings. The wealth of the revolution is enormous and ill-accounted for."
 COLDWAR_EGY_grd_velayat_on_the_nile:0 "Velayat on the Nile"
 COLDWAR_EGY_grd_velayat_on_the_nile_desc:0 "The principle of the guardianship is firmly embedded in the structure of the state. Every institution, from the courts to the barracks to the bazaar, acknowledges the authority of the jurist. The Guardians have created something new in the long history of Egypt, a government of the learned, armed with the zeal of the revolution."
 COLDWAR_EGY_ndp_the_national_democratic_party:0 "The National Democratic Party"
 COLDWAR_EGY_ndp_the_national_democratic_party_desc:0 "With the Open Door under way, Sadat needs a political vehicle to replace the Arab Socialist Union and its Nasserist baggage. The National Democratic Party gathers technocrats, provincial notables and loyal officials under one roof, promising continuity with stability. Critics note that the line between party and state grows ever thinner, and that patronage follows the party card."
 COLDWAR_EGY_ndp_the_party_of_the_president:0 "The Party of the President"
 COLDWAR_EGY_ndp_the_party_of_the_president_desc:0 "The new party belongs, in every meaningful sense, to the man at its head. Ministers, governors and mayors are drawn to the presidential banner, and the press learns to speak of the party as the natural voice of the nation. Whoever wishes to be heard in Cairo must first be heard within its ranks."
 COLDWAR_EGY_ndp_pluralism_or_emergency:0 "Pluralism or Emergency?"
 COLDWAR_EGY_ndp_pluralism_or_emergency_desc:0 "Sadat's state of institutions stands at a crossroads. One path allows opposition parties to exist, so long as they know their place; the other keeps the nation under emergency rule in the name of order. The choice will define what kind of republic Egypt becomes once the Nasserist single party is truly gone."
 COLDWAR_EGY_ndp_controlled_pluralism:0 "Controlled Pluralism"
 COLDWAR_EGY_ndp_controlled_pluralism_desc:0 "Opposition platforms, or minbars, are permitted to speak, to publish and to contest elections, though the dominant party keeps a firm hand on the rules of the game. Cairo wins applause from Western capitals for its opening, while the regime's loyalists grumble that licence has been granted to those who would undo the revolution."
 COLDWAR_EGY_ndp_the_emergency_state:0 "The Emergency State"
 COLDWAR_EGY_ndp_the_emergency_state_desc:0 "The emergency laws are kept in force, justified by terrorism, sectarian strife and the long confrontation with Israel. Police stations multiply and the Mukhabarat grows more confident in its reach. Order is bought at the price of liberties, and few in the ministries believe the exception will ever end."
 COLDWAR_EGY_ndp_the_shura_council:0 "The Shura Council"
 COLDWAR_EGY_ndp_the_shura_council_desc:0 "A consultative upper chamber is created to lend the regime a deliberative face. Its members are appointed or elected in carefully managed contests, and include respected jurists, editors and elder statesmen. The Shura Council advises and polishes legislation, and gives the republic an air of institutional depth that critics doubt it truly possesses."
 COLDWAR_EGY_ndp_the_opposition_press:0 "The Opposition Press"
 COLDWAR_EGY_ndp_the_opposition_press_desc:0 "Newspapers affiliated with the licensed opposition are allowed to sharpen their pens, lampooning ministers and probing the excesses of the Infitah. Editors test the limits of the permissible, and the censors test them in turn. The regime hopes that a safety valve will keep anger from boiling over into the streets."
 COLDWAR_EGY_ndp_the_law_of_shame:0 "The Law of Shame"
 COLDWAR_EGY_ndp_the_law_of_shame_desc:0 "A sweeping measure against behaviour deemed damaging to the nation's values lets the state prosecute critics for disgracing the country at home or abroad. Under the banner of protecting public morals, writers, preachers and politicians alike discover that dissent may now be treated as a matter of honour, and punished accordingly."
 COLDWAR_EGY_ndp_the_september_arrests:0 "The September Arrests"
 COLDWAR_EGY_ndp_the_september_arrests_desc:0 "In a single sweep, the security services detain Islamists, leftists, Copts, journalists and old politicians by the hundreds. The president declares that he is defending the state against sectarian strife and subversion, but the cells fill with men of every persuasion, and the grudges they carry will outlast the regime that jailed them."
 COLDWAR_EGY_ndp_the_islamist_bargain:0 "The Islamist Bargain"
 COLDWAR_EGY_ndp_the_islamist_bargain_desc:0 "The regime seeks peace with the religious current it once feared. Preachers are given airtime, al-Azhar is courted, and the Brotherhood is tolerated in return for its restraint. Many in the establishment see a pragmatic accommodation; others warn that Cairo is feeding the very movement that may one day turn on it."
 COLDWAR_EGY_ndp_crush_the_gamaat:0 "Crush the Gama'at"
 COLDWAR_EGY_ndp_crush_the_gamaat_desc:0 "The militant groups of Upper Egypt and the Cairo slums are declared enemies of the state. Security units sweep through the villages of the south, while informers and interrogators work in the cellars of the capital. The government promises that the gunmen will be rooted out, whatever the cost to the rule of law."
 COLDWAR_EGY_ndp_the_succession_question:0 "After the President"
 COLDWAR_EGY_ndp_the_succession_question_desc:0 "No president rules forever, and in Cairo the question of what follows is whispered in every salon and barracks. The party, the army and the civil bureaucracy each hold a claim to the legacy. The decision, once taken, will shape the republic for a generation."
 COLDWAR_EGY_ndp_the_vice_presidents_hour:0 "The Vice President's Hour"
 COLDWAR_EGY_ndp_the_vice_presidents_hour_desc:0 "The former air force commander, loyal and cautious, steps from the shadow of the presidency into its centre. Hosni Mubarak promises continuity without adventure, and the officer corps, relieved to see one of its own in the palace, closes ranks behind him. The nation breathes out, and waits to see what manner of ruler he will prove."
 COLDWAR_EGY_ndp_the_party_machine:0 "The Party Machine"
 COLDWAR_EGY_ndp_the_party_machine_desc:0 "The apparatus that Sadat built chooses its own man. Fouad Mohieddin, secretary-general of the party and a master of committees and compromise, takes the presidency as the candidate of the organisation rather than the barracks. Governors and local bosses welcome him, though the generals watch with narrowed eyes."
 COLDWAR_EGY_ndp_a_civilian_successor:0 "A Civilian Successor"
 COLDWAR_EGY_ndp_a_civilian_successor_desc:0 "In a break with the long tradition of officers in the palace, the presidency passes to a civilian. Mustafa Khalil, the experienced prime minister and a favourite of Western governments, promises clean administration and sober diplomacy. The army grumbles at the slight, but foreign capitals are quick to offer their approval."
 COLDWAR_EGY_ndp_presidential_term_limits:0 "Lift the Term Limits"
 COLDWAR_EGY_ndp_presidential_term_limits_desc:0 "The constitution is amended so that the head of state may stand for office again and again. Loyalists describe it as a safeguard against instability in dangerous times, while opponents see only a monarchy in republican dress. The new article is passed with little real debate."
 COLDWAR_EGY_ndp_the_state_of_institutions:0 "The State of Institutions"
 COLDWAR_EGY_ndp_the_state_of_institutions_desc:0 "Egypt is at last presented as a state of institutions, with a dominant party, a managed parliament, an open economy and a settled place in the world. Whether it is a modern republic or merely an elegant façade remains a matter for the historians, but for now the machinery of government runs smoothly."
 COLDWAR_EGY_ndp_law_43_expanded:0 "Law 43 Expanded"
 COLDWAR_EGY_ndp_law_43_expanded_desc:0 "Law 43 of 1974 opened the door to foreign capital, and now the government widens it further. Tax holidays, guarantees against nationalisation and simpler licensing are offered to investors from the Gulf and the West. Cairo is betting that private money will do what the socialist state never managed."
 COLDWAR_EGY_ndp_joint_ventures_with_the_west:0 "Joint Ventures with the West"
 COLDWAR_EGY_ndp_joint_ventures_with_the_west_desc:0 "Western firms are invited to partner with Egyptian companies in factories and assembly plants along the Nile. German engineers, French manufacturers and American suppliers arrive with capital and technical expertise. The old public sector looks on warily as a new class of managers and middlemen rises beside it."
 COLDWAR_EGY_ndp_open_the_banking_sector:0 "Open the Banking Sector"
 COLDWAR_EGY_ndp_open_the_banking_sector_desc:0 "Foreign and joint-venture banks are licensed to operate in Cairo and Alexandria, financing trade, construction and imports. The bankers bring credit and new methods, along with a new set of interests at the president's table. Nasser's closed financial system is quietly left behind."
 COLDWAR_EGY_ndp_the_new_cities:0 "The New Cities"
 COLDWAR_EGY_ndp_the_new_cities_desc:0 "Out in the desert, far from the crowded Nile Valley, new towns rise from the sand: the Tenth of Ramadan, Sadat City, the Sixth of October. Planners promise factories, housing and a release for the overcrowded capital. Sceptics point to the cost, and wonder whether anyone will wish to live so far from Cairo."
 COLDWAR_EGY_ndp_export_processing_zones:0 "Export Processing Zones"
 COLDWAR_EGY_ndp_export_processing_zones_desc:0 "Special zones are set aside near Suez and Alexandria, where companies can import and export with minimal customs and bureaucratic delay. Investors are drawn by the lighter regulation and the cheap labour of the Delta. For the government, they are a showcase of what a modern, outward-looking Egypt can offer."
 COLDWAR_EGY_ndp_the_gulf_of_suez_oil_boom:0 "The Gulf of Suez Oil Boom"
 COLDWAR_EGY_ndp_the_gulf_of_suez_oil_boom_desc:0 "With the Sinai wells and the Gulf of Suez fields back in Egyptian hands, foreign drilling consortia arrive in force. Rigs crowd the waters off the coast, and crude begins to flow in earnest. Oil becomes the lifeblood of a state long starved of foreign exchange, though it also breeds a dangerous reliance on a single commodity."
 COLDWAR_EGY_ndp_an_open_economy:0 "An Open Economy"
 COLDWAR_EGY_ndp_an_open_economy_desc:0 "The Infitah has matured into a settled strategy. Imports fill the shop windows, foreign banks and hotels dominate the skyline, and a new bourgeoisie flourishes in the cities. The government declares that Egypt has rejoined the world economy, even as the fellahin ask what has changed in their villages."
 COLDWAR_EGY_ndp_the_food_security_programme:0 "The Food Security Programme"
 COLDWAR_EGY_ndp_the_food_security_programme_desc:0 "A country that cannot feed its own people cannot be master of its own destiny. Cairo turns to American grain under Public Law 480, hoping that wheat shipments and new agricultural measures will keep bread on the table. The price is a deeper dependence on the goodwill of Washington."
 COLDWAR_EGY_ndp_subsidy_reform:0 "Subsidy Reform"
 COLDWAR_EGY_ndp_subsidy_reform_desc:0 "The subsidies on bread, oil and sugar, a pillar of the Nasserist social bargain, are becoming unaffordable. International lenders demand cuts and the treasury agrees. But the poor of Cairo remember the riots of 1977, and every price rise is watched anxiously from the palace windows."
 COLDWAR_EGY_ndp_privatise_tourism:0 "Privatise Tourism"
 COLDWAR_EGY_ndp_privatise_tourism_desc:0 "The pyramids, the temples of Luxor and the beaches of the Red Sea are Egypt's most reliable assets. The state hands hotels and tourist enterprises to private operators, in the hope that profit will bring investment and visitors. Foreign currency flows in, though the benefits reach some Egyptians more than others."
 COLDWAR_EGY_ndp_expand_the_universities:0 "Expand the Universities"
 COLDWAR_EGY_ndp_expand_the_universities_desc:0 "New campuses rise in the provinces and thousands more students pass through lecture halls built for hundreds. The government promises that a degree will still guarantee a post, though the graduates already outnumber the jobs on offer. Education remains the great promise of the republic, and its greatest source of disappointment."
 COLDWAR_EGY_ndp_jehans_law:0 "Jehan's Law"
 COLDWAR_EGY_ndp_jehans_law_desc:0 "Jehan Sadat, the president's wife, champions reforms to the personal status laws, giving women greater rights in divorce, custody and the home. Liberals applaud and reformers take heart, but the ulema are scandalised, and critics mock the measures as Jehan's law, imposed by decree on a society not yet persuaded."
 COLDWAR_EGY_ndp_the_jerusalem_initiative:0 "The Jerusalem Initiative"
 COLDWAR_EGY_ndp_the_jerusalem_initiative_desc:0 "In a gesture that stuns the world, the president announces that he is ready to travel to Jerusalem itself and speak before the Knesset. It is a gamble of extraordinary daring, aimed at regaining the Sinai and ending the cycle of war. The Arab world is appalled, but in Egypt, many weary families dare to hope."
 COLDWAR_EGY_ndp_the_camp_david_dividend:0 "The Camp David Dividend"
 COLDWAR_EGY_ndp_the_camp_david_dividend_desc:0 "Peace brings rewards in its train. Washington opens its arsenals and its treasury to Egypt, and American aid flows toward the army and the economy alike. The president insists that the nation has been repaid for its courage, even as the Arab capitals denounce the bargain."
 COLDWAR_EGY_ndp_bright_star:0 "Operation Bright Star"
 COLDWAR_EGY_ndp_bright_star_desc:0 "American and Egyptian troops train side by side in the desert, in exercises that would have been unthinkable a few years before. Egyptian officers learn Western doctrine, and the hardware of the Soviet era is gradually set aside. The army becomes a partner of the United States in everything but name."
 COLDWAR_EGY_ndp_americas_shield:0 "America's Shield on the Nile"
 COLDWAR_EGY_ndp_americas_shield_desc:0 "Egypt takes its place as the cornerstone of American strategy in the region. Military advisers, aircraft and credit follow, and Cairo is expected to support American interests in return. The alliance provides security and prosperity, though many Egyptians ask who now holds the real power on the Nile."
 COLDWAR_EGY_ndp_return_to_the_arab_fold:0 "Return to the Arab Fold"
 COLDWAR_EGY_ndp_return_to_the_arab_fold_desc:0 "Years after the break over the peace with Israel, Cairo works to mend its ties with the Arab capitals. Envoys travel to Riyadh, Amman and Baghdad, and the old quarrels are softened by Egypt's size and weight. The Arab League returns to the Nile, and Egypt resumes its place at the centre of the Arab world."
 COLDWAR_EGY_ndp_mediterranean_friends:0 "Mediterranean Friends"
 COLDWAR_EGY_ndp_mediterranean_friends_desc:0 "Egypt looks northward across the sea, cultivating friendships in Paris, Rome and Athens. Trade delegations, cultural exchanges and quiet diplomacy build a web of goodwill on the Mediterranean shore. For a regime keen to balance its American ties, these ancient neighbours offer welcome partnership."
 COLDWAR_EGY_wafd_the_new_wafd:0 "The New Wafd"
 COLDWAR_EGY_wafd_the_new_wafd_desc:0 "The old party of Saad Zaghlul, banned since the revolution of 1952, returns to the political stage. Fouad Serageddin, the aged Pasha who once served the monarchy, rallies the liberals, landowners and professionals who never forgot the parliamentary years. The New Wafd promises constitutional rule, free enterprise and respect for the law."
 COLDWAR_EGY_wafd_the_wafdist_cabinet:0 "The Wafdist Cabinet"
 COLDWAR_EGY_wafd_the_wafdist_cabinet_desc:0 "With Serageddin at the helm, the Wafd forms a government drawn from the lawyers, merchants and veteran politicians of the liberal age. The ministries fill with men who remember the days of the constitution of 1923. The country watches to see whether the old guard can govern a modern republic."
 COLDWAR_EGY_wafd_old_guard_or_young_wafd:0 "Old Guard or Young Wafd?"
 COLDWAR_EGY_wafd_old_guard_or_young_wafd_desc:0 "The party faces a question about itself. Should it rely on the experienced pashas and landed families who kept the faith through the long years of exile, or give way to a new generation of lawyers and engineers eager to modernise? The answer will determine what the Wafd is to be."
 COLDWAR_EGY_wafd_the_old_guard:0 "The Old Guard"
 COLDWAR_EGY_wafd_the_old_guard_desc:0 "The veterans of the pre-revolutionary parliament take charge of the party's direction, bringing with them dignity, land and long memories. Landowners flock to the banner, expecting that the estates seized by Nasser's reforms will receive a kinder hearing. The party gains steadiness, and a reputation for looking backwards."
 COLDWAR_EGY_wafd_the_young_wafd:0 "The Young Wafd"
 COLDWAR_EGY_wafd_the_young_wafd_desc:0 "Younger lawyers, economists and engineers push the old men aside, bringing new ideas and fresh faces to the Wafd. They speak of a modern, European-minded Egypt with a free market and a free press. The pashas mutter about the loss of tradition, but the party gains the energy of a movement that expects to win."
 COLDWAR_EGY_wafd_the_spirit_of_1923:0 "The Spirit of 1923"
 COLDWAR_EGY_wafd_the_spirit_of_1923_desc:0 "The liberal constitution of 1923 is invoked as the foundation of the new order. Free elections, rights for all citizens and a government answerable to parliament are restored as the nation's guiding principles. The Wafd declares that the revolution has at last come home."
 COLDWAR_EGY_wafd_an_independent_judiciary:0 "An Independent Judiciary"
 COLDWAR_EGY_wafd_an_independent_judiciary_desc:0 "The courts are freed from the control of the executive and the judges are assured of their tenure. Corrupt officials discover that the law now reaches them, and investors, foreign and domestic, begin to trust that contracts will be honoured. Egypt's proud legal tradition is restored to its place of honour."
 COLDWAR_EGY_wafd_the_free_press_act:0 "The Free Press Act"
 COLDWAR_EGY_wafd_the_free_press_act_desc:0 "Censorship is lifted and the press is free to praise or condemn the government as it sees fit. Newspapers of every colour spring up in Cairo, and the coffee houses buzz with argument. Ministers learn the discomfort of being criticised in public, and the nation learns the habit of debate."
 COLDWAR_EGY_wafd_parliamentary_government:0 "Parliamentary Government"
 COLDWAR_EGY_wafd_parliamentary_government_desc:0 "Power rests firmly with the elected assembly and the ministers who answer to it. The president is a dignified figure above the fray, and the cabinet rises and falls by the will of the deputies. The Wafd has realised the oldest dream of Egyptian liberalism, though a restive nation must learn how to live with it."
 COLDWAR_EGY_wafd_crescent_and_cross:0 "Crescent and Cross"
 COLDWAR_EGY_wafd_crescent_and_cross_desc:0 "The Wafd was born in 1919 under the banner of the crescent embracing the cross, uniting Muslim and Copt in the cause of independence. Its heirs revive that vision of a national community open to all. The Coptic minority, long uneasy under the revolution, welcomes the pledge of equal citizenship."
 COLDWAR_EGY_wafd_secular_courts:0 "Secular Courts"
 COLDWAR_EGY_wafd_secular_courts_desc:0 "The Wafd moves to place civil law above religious jurisdiction, with a single system of national courts for all Egyptians. Lawyers hail a modern reform, but the scholars of al-Azhar protest that the faith is being pushed from public life. The government answers that justice must be the same for all."
 COLDWAR_EGY_wafd_end_the_sequestrations:0 "End the Sequestrations"
 COLDWAR_EGY_wafd_end_the_sequestrations_desc:0 "The property seized by the revolution, from estates to town houses and factories, is returned to those who lost it. Merchants and shopkeepers rejoice, and a confident middle class emerges. The landless fellahin, who benefited from the old land reforms, look on with unease at the return of the old owners."
 COLDWAR_EGY_wafd_bank_misr_reborn:0 "Bank Misr Reborn"
 COLDWAR_EGY_wafd_bank_misr_reborn_desc:0 "Talaat Harb founded Bank Misr to build an Egyptian capitalism free of foreign dominance. The Wafd revives his dream, encouraging the bank and its industries to grow once more. Factories rise in Alexandria and the Delta, and the old ideal of a prosperous national economy gains fresh life."
 COLDWAR_EGY_wafd_egyptianise_industry:0 "Egyptianise Industry"
 COLDWAR_EGY_wafd_egyptianise_industry_desc:0 "Egyptian owners and managers are encouraged to take the lead in the nation's industry, with preference given to national firms over foreign ones. Taxes are eased on domestic enterprise, and a class of native industrialists comes into its own. The Wafd insists that a free economy and a national economy need not be opposed."
 COLDWAR_EGY_wafd_reopen_the_cotton_exchange:0 "Reopen the Alexandria Cotton Exchange"
 COLDWAR_EGY_wafd_reopen_the_cotton_exchange_desc:0 "In Alexandria, the cotton exchange, shuttered during the years of state control, opens its doors once more. Brokers and growers gather in the old trading halls to bargain over the white gold of the Nile. The market returns, and with it the prosperity and cosmopolitan air of the old Mediterranean port."
 COLDWAR_EGY_wafd_alexandria_free_port:0 "Alexandria as a Free Port"
 COLDWAR_EGY_wafd_alexandria_free_port_desc:0 "Alexandria, once the most cosmopolitan city in the Mediterranean, is declared a free port. Ships unload without heavy duty, merchants of every nation set up offices, and warehouses fill along the harbour. The city of the Greeks, Italians and Levantines stirs again, and dreams of its former splendour."
 COLDWAR_EGY_wafd_modern_agriculture_societies:0 "Modern Agriculture Societies"
 COLDWAR_EGY_wafd_modern_agriculture_societies_desc:0 "Cooperative societies, backed by credit and technical advice, help the fellahin to modernise their farming. New seeds, machinery and marketing arrangements ease the burden on smallholders. The Wafd hopes to prove that a free economy can serve the peasant as well as the pasha."
 COLDWAR_EGY_wafd_a_liberal_economy:0 "A Liberal Economy"
 COLDWAR_EGY_wafd_a_liberal_economy_desc:0 "Prices, trade and enterprise are freed from the grip of the state, and the economy responds with vigour. Egyptian goods find buyers abroad, investment pours in, and the bazaars thrive. The Wafd points to prosperity as proof that liberalism and national dignity go hand in hand."
 COLDWAR_EGY_wafd_friends_in_london_and_paris:0 "Friends in London and Paris"
 COLDWAR_EGY_wafd_friends_in_london_and_paris_desc:0 "The Wafd has always looked toward Europe, and its leaders still count friends in Whitehall and the Quai d'Orsay. Old acquaintances are renewed, loans are discussed, and the memories of the bitter quarrel over Suez are set quietly aside. Egypt takes its place among the liberal powers of the Mediterranean."
 COLDWAR_EGY_wafd_sudan_brotherhood:0 "Brothers in the Sudan"
 COLDWAR_EGY_wafd_sudan_brotherhood_desc:0 "The unity of the Nile Valley was a Wafdist ideal long before the revolution, and the party now reaches out to Khartoum in a spirit of friendship. Trade, water and political partnership are on the table. The Sudanese, long wary of Egyptian domination, are cautiously receptive to a more respectful tone."
 COLDWAR_EGY_wafd_the_liberal_age_returns:0 "The Liberal Age Returns"
 COLDWAR_EGY_wafd_the_liberal_age_returns_desc:0 "The parliament sits, the courts rule, the press argues and the markets trade. A generation after the revolution closed it, Egypt's liberal age has returned in a new guise. The task now is to prove that the freedoms of the past can survive the pressures of the present."
 COLDWAR_EGY_lib_the_liberal_cabinet:0 "The Liberal Cabinet"
 COLDWAR_EGY_lib_the_liberal_cabinet_desc:0 "Mustafa Kamel Murad and his Liberal Socialist allies take office with a bold promise to dismantle the heavy hand of the state and let the market breathe. The ministers speak of competition, enterprise and sound money. After years of socialism, Cairo's business community is cautiously delighted."
 COLDWAR_EGY_lib_the_liberal_programme:0 "The Liberal Programme"
 COLDWAR_EGY_lib_the_liberal_programme_desc:0 "The cabinet unveils its programme of free markets, lean government and individual choice. Business leaders applaud, Western economists nod approval, and the trade unions grow nervous. It is a bold vision of a very different Egypt, and the government must now decide how swiftly to pursue it."
 COLDWAR_EGY_lib_shock_or_gradual:0 "Shock or Gradual?"
 COLDWAR_EGY_lib_shock_or_gradual_desc:0 "The reformers are divided on how fast to move. Some urge a sudden break with the controlled economy, cutting prices, subsidies and tariffs at a stroke; others favour a patient transition that spares the poor. The decision will shape the nation's economy and the government's fate."
 COLDWAR_EGY_lib_market_shock:0 "Market Shock"
 COLDWAR_EGY_lib_market_shock_desc:0 "Prices are freed, subsidies are slashed and the state steps back at once. The economy convulses, shops empty and fill again at higher prices, and families on fixed incomes suffer. The government insists that the pain is the price of recovery, and asks the nation to endure."
 COLDWAR_EGY_lib_gradual_liberalisation:0 "Gradual Liberalisation"
 COLDWAR_EGY_lib_gradual_liberalisation_desc:0 "Controls are lifted step by step, with warnings given and cushions provided for the vulnerable. Businesses adapt, workers adjust, and the government keeps a watchful eye on the street. Progress is slower than the zealots wish, but it is less likely to end in riots."
 COLDWAR_EGY_lib_reopen_the_stock_exchange:0 "Reopen the Stock Exchange"
 COLDWAR_EGY_lib_reopen_the_stock_exchange_desc:0 "The old exchanges of Cairo and Alexandria, among the oldest in the region, reopen their trading floors. Brokers return in dark suits, and shares in Egyptian companies change hands once more. A new generation of investors discovers that wealth can be made on paper as well as in the cotton fields."
 COLDWAR_EGY_lib_privatise_public_firms:0 "Privatise Public Firms"
 COLDWAR_EGY_lib_privatise_public_firms_desc:0 "The great state enterprises of the Nasser years, from textile mills to steelworks, are offered for sale to private buyers. Efficiency improves and revenues flow into the treasury, but workers fear for their jobs and the unions threaten to strike. The government presses ahead, convinced that the state is a poor businessman."
 COLDWAR_EGY_lib_light_regulations:0 "Light Regulations"
 COLDWAR_EGY_lib_light_regulations_desc:0 "Licences are simplified, red tape is cut and inspectors are told to give guidance rather than punishment. Businessmen find it easier to open a shop, hire workers and import goods. Critics fear for safety and fair dealing, but entrepreneurs praise a government that gets out of the way."
 COLDWAR_EGY_lib_tax_cuts_for_growth:0 "Tax Cuts for Growth"
 COLDWAR_EGY_lib_tax_cuts_for_growth_desc:0 "Taxes are lowered on households and firms alike, in the belief that money left in private hands will be put to better use than the state could manage. Shopkeepers, merchants and professionals feel the difference at once. The treasury trusts that growth will fill the gap."
 COLDWAR_EGY_lib_unify_the_exchange_rate:0 "Unify the Exchange Rate"
 COLDWAR_EGY_lib_unify_the_exchange_rate_desc:0 "The tangle of official and black-market exchange rates is swept away, and the pound is allowed to find its own level. Exporters and importers can plan with confidence, and foreign investors take note. The change is painful for those who lived off the old distortions."
 COLDWAR_EGY_lib_agricultural_price_liberalisation:0 "Free the Farm Prices"
 COLDWAR_EGY_lib_agricultural_price_liberalisation_desc:0 "The state no longer fixes the price of cotton, wheat or rice. Farmers sell to the highest bidder and decide for themselves what to plant. Some fellahin prosper, while others fall into debt, and the villages discover the rewards and risks of the market."
 COLDWAR_EGY_lib_open_egypt_to_the_world:0 "Open Egypt to the World"
 COLDWAR_EGY_lib_open_egypt_to_the_world_desc:0 "Customs barriers fall, visas are eased and foreign companies are invited to open offices in Cairo and the Nile Valley. Skyscrapers of glass and steel rise beside the old city. The nation that once shut itself behind socialist walls now presents itself as a crossroads of commerce."
 COLDWAR_EGY_lib_a_market_economy:0 "A Market Economy"
 COLDWAR_EGY_lib_a_market_economy_desc:0 "The planners and the controllers of the old regime have been replaced by prices, profits and competition. The economy hums with a vitality that surprises even its architects. Egypt has become, in outlook if not entirely in practice, a market society."
 COLDWAR_EGY_lib_civil_liberties_act:0 "The Civil Liberties Act"
 COLDWAR_EGY_lib_civil_liberties_act_desc:0 "A charter of rights guarantees free speech, free assembly and the protection of the courts. Political prisoners are released, and opposition parties emerge from the shadows. The government declares that a free economy requires a free society, and invites the nation to judge its record."
 COLDWAR_EGY_lib_decentralise_the_governorates:0 "Decentralise the Governorates"
 COLDWAR_EGY_lib_decentralise_the_governorates_desc:0 "Power is devolved from the ministries of Cairo to the governorates, which receive greater authority over their budgets and local affairs. Provincial governors, long the creatures of the capital, now answer to local councils. Reformers hail the end of the centralised state, though some fear regional rivalry."
 COLDWAR_EGY_lib_european_partnership:0 "European Partnership"
 COLDWAR_EGY_lib_european_partnership_desc:0 "Egypt turns toward the nations of the European continent, seeking trade, investment and technology. Delegations are exchanged with Paris, Bonn and Rome, and the cabinet speaks of a Mediterranean future. The relationship is built on shared commercial interest and a common wish for stability."
 COLDWAR_EGY_lib_the_eec_association:0 "The EEC Association Agreement"
 COLDWAR_EGY_lib_the_eec_association_desc:0 "Negotiators travel to Brussels to discuss a formal association with the European Economic Community. The prospect of tariff-free access to the markets of the Six excites manufacturers and growers alike. Whether Europe will accept is a question of diplomacy, but the ambition itself marks a new direction for Egypt."
 COLDWAR_EGY_lib_the_market_republic:0 "The Market Republic"
 COLDWAR_EGY_lib_the_market_republic_desc:0 "The liberal government has remade the republic in its own image, with open markets, decentralised power and close ties to Europe. Egyptians are told that they now live in a modern, competitive nation. Prosperity is uneven, but the direction of travel seems unmistakable."
 COLDWAR_EGY_slp_the_labour_government:0 "The Labour Government"
 COLDWAR_EGY_slp_the_labour_government_desc:0 "Ibrahim Shukri leads the Socialist Labour Party into government, with a promise to defend the workers and fellahin in an age of change. A former Nasserist minister turned reformer, he speaks of social justice, honest government and a fair share for the poor. The trade unions throw their weight behind him."
 COLDWAR_EGY_slp_the_labour_programme:0 "The Labour Programme"
 COLDWAR_EGY_slp_the_labour_programme_desc:0 "The new government sets out its programme of social reform, mixing the heritage of Egyptian socialism with a commitment to political freedom. Welfare, wages and public services are placed at the centre of policy. The party hopes to prove that a left-wing government can be both humane and efficient."
 COLDWAR_EGY_slp_labour_or_islamic_socialism:0 "Labour or Islamic Socialism?"
 COLDWAR_EGY_slp_labour_or_islamic_socialism_desc:0 "The party faces a question of identity. Is it a secular movement of workers and trade unionists in the tradition of European labour parties, or a movement that grounds its socialism in the moral language of Islam? The answer will decide whom it can speak for."
 COLDWAR_EGY_slp_labour_socialism:0 "Labour Socialism"
 COLDWAR_EGY_slp_labour_socialism_desc:0 "The party draws on the traditions of the European labour movement, stressing class solidarity, trade unions and the rights of working people. Factory delegates and union officials set the tone of debate. Egyptian socialism is recast as a democratic and secular cause, and Western social democrats take note."
 COLDWAR_EGY_slp_islamic_socialism:0 "Islamic Socialism"
 COLDWAR_EGY_slp_islamic_socialism_desc:0 "The party presents social justice as a duty ordained by religion, and calls for an economy guided by the Islamic ideals of charity and fairness. The alliance with the Muslim Brotherhood, once unthinkable, brings votes and moral authority. Secular comrades protest that socialism has been handed to the preachers."
 COLDWAR_EGY_slp_free_unions:0 "Free Unions"
 COLDWAR_EGY_slp_free_unions_desc:0 "The unions are freed from state control and allowed to choose their own leaders and conduct their own bargaining. Long-suppressed grievances find a voice in the factories of Helwan and Mahalla. Workers stand taller, while employers learn to negotiate with men who can no longer be ordered about."
 COLDWAR_EGY_slp_the_social_dialogue_council:0 "The Social Dialogue Council"
 COLDWAR_EGY_slp_the_social_dialogue_council_desc:0 "Employers, unions and ministers are brought together around one table to hammer out the terms of the nation's economic life. The council gives the workers a voice and the businessmen a hearing. Compromise, not command, becomes the style of policy, and industrial peace the reward."
 COLDWAR_EGY_slp_a_social_contract:0 "A Social Contract"
 COLDWAR_EGY_slp_a_social_contract_desc:0 "The government offers the people a pact: a decent wage, secure employment and basic services in exchange for loyalty and effort. It echoes the promises of the revolution, but without the coercion that came with them. The question is whether the state can afford to keep its word."
 COLDWAR_EGY_slp_workers_rights_act:0 "The Workers' Rights Act"
 COLDWAR_EGY_slp_workers_rights_act_desc:0 "A new law guarantees workers a fair contract, a safe workplace and protection against dismissal. Factory owners complain of rigidity, but the men on the shop floor see a sign that their labour is respected. The statute book finally speaks the language of the labour movement."
 COLDWAR_EGY_slp_progressive_income_tax:0 "Progressive Income Tax"
 COLDWAR_EGY_slp_progressive_income_tax_desc:0 "Those who earn more are asked to contribute more, in a tax system designed to share the burden according to ability. The wealthy of Zamalek and Maadi protest, while the treasury welcomes a reliable stream of revenue. The government calls it simple justice."
 COLDWAR_EGY_slp_pension_reform:0 "Pension Reform"
 COLDWAR_EGY_slp_pension_reform_desc:0 "Elderly workers and widows are promised a secure income in their retirement, funded by contributions and general taxation. The system is extended to farm labourers and the self-employed, who were long left out. In a country where families have always cared for their own, the state now shares the burden."
 COLDWAR_EGY_slp_healthcare_for_the_fellahin:0 "Healthcare for the Fellahin"
 COLDWAR_EGY_slp_healthcare_for_the_fellahin_desc:0 "Clinics and rural hospitals are built in the villages of the Delta and the Said, where the nearest doctor was once a day's journey away. Nurses and midwives are trained in the thousands. The government says the fellahin built the nation, and now the nation will care for them."
 COLDWAR_EGY_slp_cooperative_banks:0 "Cooperative Banks"
 COLDWAR_EGY_slp_cooperative_banks_desc:0 "Village banks owned by the farmers themselves offer loans on fair terms, breaking the grip of moneylenders and merchants. Smallholders are able to buy seed and fertiliser without falling into debt. The cooperative movement, long a hope of the left, begins to deliver."
 COLDWAR_EGY_slp_public_housing_programme:0 "The Public Housing Programme"
 COLDWAR_EGY_slp_public_housing_programme_desc:0 "New apartment blocks rise on the edge of the capital, built by the state and let at modest rents. Families long crowded into tenements or the tombs of the Cairo cemeteries receive keys to homes of their own. The programme is costly, but the government considers it a promise of the revolution at last redeemed."
 COLDWAR_EGY_slp_a_mixed_economy:0 "A Mixed Economy"
 COLDWAR_EGY_slp_a_mixed_economy_desc:0 "Neither a command economy nor a free-for-all, the new order combines public enterprise, private initiative and cooperative effort. Strategic industries remain in the hands of the state, while the market is trusted to supply the rest. The government hopes to prove that a middle way can work."
 COLDWAR_EGY_slp_the_socialist_international:0 "The Socialist International"
 COLDWAR_EGY_slp_the_socialist_international_desc:0 "Egypt's labour government is welcomed into the company of Europe's social democratic parties. Delegates exchange visits with their counterparts in Stockholm, Bonn and Vienna, bringing advice, sympathy and the hope of investment. The party finds friends who share its ideals, and a legitimacy that Moscow could never confer."
 COLDWAR_EGY_slp_mediterranean_social_democracy:0 "Mediterranean Social Democracy"
 COLDWAR_EGY_slp_mediterranean_social_democracy_desc:0 "Egypt reaches out to the socialist and social democratic governments of the northern Mediterranean, finding common cause in the defence of workers and the welfare state. Cairo, Paris, Madrid and Athens speak of a shared southern European model. The sea becomes a bridge between old labour movements."
 COLDWAR_EGY_slp_social_democracy_on_the_nile:0 "Social Democracy on the Nile"
 COLDWAR_EGY_slp_social_democracy_on_the_nile_desc:0 "After long effort, Egypt has become a social democracy on the Nile, with free unions, a mixed economy and a welfare state. The model is neither Moscow's nor Washington's, but its own. The nation looks on with pride, and the Arab world watches with interest."
 COLDWAR_EGY_azh_the_council_of_scholars:0 "The Council of Scholars"
 COLDWAR_EGY_azh_the_council_of_scholars_desc:0 "The revolution has taken a religious turn, and the highest authority in the land now sits in the great mosque. A council of scholars from al-Azhar, led by Grand Imam Abd al-Halim Mahmud, takes over the guidance of the state. The law of God is to be the law of Egypt, and the ulema its guardians."
 COLDWAR_EGY_azh_the_grand_imam_as_head_of_state:0 "The Grand Imam as Head of State"
 COLDWAR_EGY_azh_the_grand_imam_as_head_of_state_desc:0 "The Grand Imam, long the foremost religious figure of the Sunni world, assumes the highest office of the state. Egyptians who once looked to the president for guidance now look to the pulpit. It is an experiment without precedent in the modern age, watched with awe and alarm abroad."
 COLDWAR_EGY_azh_azhar_or_riyadh:0 "Al-Azhar or Riyadh?"
 COLDWAR_EGY_azh_azhar_or_riyadh_desc:0 "Two models of religious rule beckon. One is the learned, moderate tradition of al-Azhar, rooted in a thousand years of scholarship; the other is the austere pattern of the Arabian kingdom, rich in oil and in conviction. The path chosen will define the character of the Islamic state."
 COLDWAR_EGY_azh_scholarly_rule:0 "Scholarly Rule of al-Azhar"
 COLDWAR_EGY_azh_scholarly_rule_desc:0 "The scholars of the old university govern in the manner of their forebears, with deliberation, tradition and respect for the schools of law. They claim that Egypt's Islam is the Islam of moderation and learning. The state becomes a seminar, and ministers speak the language of the madrasa."
 COLDWAR_EGY_azh_the_saudi_model:0 "The Saudi Model"
 COLDWAR_EGY_azh_the_saudi_model_desc:0 "Envoys arrive from Riyadh with advice, funds and preachers of the Najdi school. The religious police patrol the markets, and the ulema are guided by teachings from the Arabian peninsula. Egypt's older, gentler traditions are thrust aside, and many scholars of al-Azhar mutter that the Nile has been made a tributary of the desert."
 COLDWAR_EGY_azh_sharia_courts:0 "Sharia Courts"
 COLDWAR_EGY_azh_sharia_courts_desc:0 "The civil codes inherited from Napoleonic France are set aside, and the courts apply the law of the Sharia. Judges are learned in religion rather than statute, and punishments follow the classical rules. Supporters say the courts are now incorruptible; critics say they are medieval."
 COLDWAR_EGY_azh_the_fatwa_council:0 "The Fatwa Council"
 COLDWAR_EGY_azh_the_fatwa_council_desc:0 "A body of senior scholars is empowered to issue binding opinions on matters of law and public policy. Ministers consult them before they act, and their rulings are read from the pulpits. The state gains moral authority, and the scholars gain a power over government that no cleric has held in generations."
 COLDWAR_EGY_azh_hisba_committees:0 "Hisba Committees"
 COLDWAR_EGY_azh_hisba_committees_desc:0 "Volunteers and officials patrol the streets, enforcing public morals in the name of commanding the good and forbidding the evil. Shopkeepers close for prayer, and cafes and cinemas are watched with suspicion. The pious applaud, while the secular and the cosmopolitan keep their heads down."
 COLDWAR_EGY_azh_the_dhimma_question:0 "The Dhimma Question"
 COLDWAR_EGY_azh_the_dhimma_question_desc:0 "The status of Egypt's Christian minority is raised anew. The traditional protections of the dhimma, with their taxes and restrictions, are debated in the councils of the faithful. The Copts, who have lived on the Nile since before Islam, view the discussion with fear and dismay."
 COLDWAR_EGY_azh_the_zakat_treasury:0 "The Zakat Treasury"
 COLDWAR_EGY_azh_the_zakat_treasury_desc:0 "The Islamic alms tax is collected by the state and distributed to the needy, the orphan and the traveller. Charity becomes a pillar of public finance, and the poor look to the mosque rather than the ministry. The government hopes that piety will succeed where bureaucracy has struggled."
 COLDWAR_EGY_azh_waqf_restoration:0 "Restore the Waqf Endowments"
 COLDWAR_EGY_azh_waqf_restoration_desc:0 "The religious endowments seized by the revolution in the 1950s are returned to the care of the scholars. Lands, shops and buildings once again support mosques, schools and hospitals. The ulema regain an independent income, and a power they have not enjoyed in a generation."
 COLDWAR_EGY_azh_islamic_banking_law:0 "The Islamic Banking Law"
 COLDWAR_EGY_azh_islamic_banking_law_desc:0 "Interest is forbidden and the banks of Egypt must operate on the principles of profit-sharing and partnership. Financiers struggle to adapt, while devout depositors welcome institutions they can trust in conscience. The experiment is watched closely in the Gulf, and with some alarm in the West."
 COLDWAR_EGY_azh_halal_trade_with_the_gulf:0 "Halal Trade with the Gulf"
 COLDWAR_EGY_azh_halal_trade_with_the_gulf_desc:0 "Merchants of Cairo and Alexandria find eager partners in the wealthy states of the Gulf, who share their faith and their preferences. Trade in food, textiles and goods certified in accordance with the law grows quickly. Egypt rediscovers its place in the commerce of the Muslim world."
 COLDWAR_EGY_azh_the_pilgrim_economy:0 "The Pilgrim Economy"
 COLDWAR_EGY_azh_the_pilgrim_economy_desc:0 "Every year, vast numbers of pilgrims pass through Egyptian ports and roads on their way to Mecca. The state improves the harbours and highways along the Red Sea and offers services to the faithful. What was once a trickle of devotion becomes a steady source of livelihood."
 COLDWAR_EGY_azh_an_economy_of_faith:0 "An Economy of Faith"
 COLDWAR_EGY_azh_an_economy_of_faith_desc:0 "Zakat, waqf and halal trade together form a distinct economic order, built on faith and fairness rather than interest and speculation. The prosperity it brings is modest but widely shared. The ulema proclaim that the blessings of heaven have come to the Nile."
 COLDWAR_EGY_azh_the_azhar_university_system:0 "The Azhar University System"
 COLDWAR_EGY_azh_the_azhar_university_system_desc:0 "Al-Azhar's colleges multiply across the land, teaching religion and modern subjects side by side. Young men and women from the villages gain access to learning they never had. The old university becomes the foundation of a national school system."
 COLDWAR_EGY_azh_a_religious_curriculum:0 "A Religious Curriculum"
 COLDWAR_EGY_azh_a_religious_curriculum_desc:0 "Schools across the republic are directed to teach the Quran, the traditions of the Prophet and the Islamic sciences at the heart of the syllabus. The young are raised in the faith of their fathers. Scientists and engineers worry that modern studies are being squeezed aside."
 COLDWAR_EGY_azh_the_riyadh_axis:0 "The Riyadh Axis"
 COLDWAR_EGY_azh_the_riyadh_axis_desc:0 "Egypt's scholars seek a pact with the kingdom of Arabia, pledging to defend the faith and the holy places together. The two great centres of Sunni Islam, one of learning and one of wealth, join in common purpose. The prospect of oil money delights the treasury and unsettles Cairo's secular elite."
 COLDWAR_EGY_azh_mission_to_africa:0 "Mission to Africa"
 COLDWAR_EGY_azh_mission_to_africa_desc:0 "Preachers and teachers trained at al-Azhar travel south along the Nile and beyond, to Sudan, Chad, Ethiopia and Nigeria. They open schools, build mosques and spread the message of the scholars. Egypt's old role as the teacher of Africa's Muslims is revived."
 COLDWAR_EGY_azh_the_state_of_al_azhar:0 "The State of al-Azhar"
 COLDWAR_EGY_azh_the_state_of_al_azhar_desc:0 "The ancient university has become a state, and the state has become a university. Law, finance, education and morals are all governed by the doctrine of the scholars. Egypt stands as the world's greatest experiment in clerical rule, admired by some and feared by many more."
 COLDWAR_EGY_ij_the_neglected_duty:0 "The Neglected Duty"
 COLDWAR_EGY_ij_the_neglected_duty_desc:0 "The pamphlet of Muhammad Abd al-Salam Faraj declares that jihad is the forgotten pillar of the faith, and that the rulers of Egypt have forfeited their right to obedience. In its wake the state is overthrown and the men of the underground inherit the republic. The era of revolutionary Islam has begun."
 COLDWAR_EGY_ij_the_emirs_shura:0 "The Emir's Shura"
 COLDWAR_EGY_ij_the_emirs_shura_desc:0 "The leaders of the movement gather in secret councils to decide the fate of the nation. They consult one another in the manner of the early Muslim community, answerable to their consciences and their guns. Zeal binds the council together, though its members trust few outside it."
 COLDWAR_EGY_ij_faraj_or_the_gamaa:0 "Faraj's Vanguard or the Gama'a?"
 COLDWAR_EGY_ij_faraj_or_the_gamaa_desc:0 "The movement is divided. The conspirators of Cairo, led by Faraj, believe in the lightning strike from within the state, while the militants of Upper Egypt trust in popular mobilisation in the villages and universities. Only one vision can prevail."
 COLDWAR_EGY_ij_farajs_vanguard:0 "Faraj's Vanguard"
 COLDWAR_EGY_ij_farajs_vanguard_desc:0 "Faraj's disciplined cells take control of the state. Small, secret and fanatical, the vanguard sees itself as the only true believers in a sea of apostasy. It governs by conviction, suspicion and the sword, and soon the army and ministries are filled with uneasy faces."
 COLDWAR_EGY_ij_the_gamaa_of_upper_egypt:0 "The Gama'a of Upper Egypt"
 COLDWAR_EGY_ij_the_gamaa_of_upper_egypt_desc:0 "The Gama'a Islamiyya, rooted in the villages of the Said and the student unions of Asyut and Minya, brings the revolution to the people. Its preachers and enforcers command a following among peasants and clerks alike. It governs through the mosque, the clan and the pulpit as much as through the ministries."
 COLDWAR_EGY_ij_purge_the_army:0 "Purge the Army"
 COLDWAR_EGY_ij_purge_the_army_desc:0 "Officers suspected of disloyalty or impiety are dismissed, arrested or worse. The barracks fill with whispers, and the cadets are taught the creed before they are taught the drill. The movement trusts only the soldiers it has remade in its own image."
 COLDWAR_EGY_ij_abolish_the_parties:0 "Abolish the Parties"
 COLDWAR_EGY_ij_abolish_the_parties_desc:0 "The parties that once crowded the political stage are declared un-Islamic divisions in the community of believers. Their offices are shuttered, their newspapers silenced and their leaders sent to prison or exile. A single movement, claiming to speak for God, now speaks for Egypt."
 COLDWAR_EGY_ij_emirate_courts:0 "Emirate Courts"
 COLDWAR_EGY_ij_emirate_courts_desc:0 "Judges answerable to the emir apply a stern and swift justice, sweeping aside the delays and bribery of the old courts. Citizens who once despaired of the law find disputes settled in days. Theft is punished harshly and corruption is stamped out, though the price in mercy is high."
 COLDWAR_EGY_ij_confiscate_the_infitah_fortunes:0 "Confiscate the Infitah Fortunes"
 COLDWAR_EGY_ij_confiscate_the_infitah_fortunes_desc:0 "The fortunes made during the Infitah by importers, contractors and middlemen are declared ill-gotten and seized by the new authority. The villas of the new rich are emptied and their bank accounts frozen. The poor cheer, while the merchant class flees or goes underground."
 COLDWAR_EGY_ij_abolish_riba:0 "Abolish Riba"
 COLDWAR_EGY_ij_abolish_riba_desc:0 "Interest is outlawed in every transaction, and the banks are dissolved or reconstituted on Islamic principles. Foreign lenders withdraw in alarm, and the financial world looks on aghast. The emirate declares that it will live by the commandments of God, even if the money markets will not."
 COLDWAR_EGY_ij_self_sufficiency:0 "Self-Sufficiency"
 COLDWAR_EGY_ij_self_sufficiency_desc:0 "Egypt withdraws from the commerce of the infidel world and resolves to rely upon its own fields and workshops. Imports are curtailed, foreign goods are forbidden and ration cards are issued. The emirate calls this purity, and the shops, increasingly empty, call it hardship."
 COLDWAR_EGY_ij_the_war_economy_of_the_emirate:0 "The War Economy of the Emirate"
 COLDWAR_EGY_ij_the_war_economy_of_the_emirate_desc:0 "The whole economy is bent to the needs of the holy struggle. Factories turn out weapons and uniforms, farms deliver grain for the fighters and every household is called upon to sacrifice. The nation is on a permanent footing of war, and the emirate demands everything from its people."
 COLDWAR_EGY_ij_export_the_revolution:0 "Export the Revolution"
 COLDWAR_EGY_ij_export_the_revolution_desc:0 "Preachers, funds and weapons flow across the borders into Sudan, Libya, Syria and Jordan. The emirate holds that the revolution cannot stop at the Nile, and that every ruler of the region is a tyrant to be overthrown. Neighbouring capitals tremble, and the great powers take note."
 COLDWAR_EGY_ij_break_with_riyadh:0 "Break with Riyadh"
 COLDWAR_EGY_ij_break_with_riyadh_desc:0 "The emirate denounces the Saudi royal house as corrupt servants of the West and unworthy guardians of the holy places. Diplomats are expelled, the pilgrimage is disrupted and the oil wealth of Arabia is cut off. The breach is bitter, for Egypt's revolutionaries claim a leadership the kingdom will not yield."
 COLDWAR_EGY_ij_war_on_the_occupier:0 "War on the Occupier"
 COLDWAR_EGY_ij_war_on_the_occupier_desc:0 "Jerusalem and the lands of Palestine remain, in the eyes of the emirate, the first duty of every believer. Fighters are drawn from across the land, and preachers call for a holy war to liberate the holy places. For Israel, the neighbour on the Sinai frontier has become an implacable enemy."
 COLDWAR_EGY_ij_the_emirate:0 "The Emirate of Egypt"
 COLDWAR_EGY_ij_the_emirate_desc:0 "The republic of Nasser and Sadat is gone, and in its place stands the Emirate of Egypt, ruled in the name of God by the men of the movement. Its achievements and its crimes alike are measured against a standard its founders set themselves. The world waits to see whether the emirate can endure."
 COLDWAR_EGY_arm_the_supreme_council:0 "The Supreme Council of the Armed Forces"
 COLDWAR_EGY_arm_the_supreme_council_desc:0 "With the civilian facade set aside, authority passes to a council of senior officers meeting behind closed doors in Cairo. The generals present it as a temporary custodianship, a war council for a nation under arms, but the men who sit around the table understand that whoever commands the divisions now commands the Republic. The programme of the army becomes the programme of the state."
 COLDWAR_EGY_arm_the_generals_cabinet:0 "The Generals' Cabinet"
 COLDWAR_EGY_arm_the_generals_cabinet_desc:0 "Portfolios once held by Nasser's political companions are handed to serving and retired generals. Ministries are run like staff sections, with memoranda, deadlines and little patience for debate. Cairo's bureaucrats grumble about barracks manners, but the officers promise that after the humiliation of 1967 only disciplined men can be trusted to deliver results."
 COLDWAR_EGY_arm_fawzi_or_shazly:0 "Fawzi or Shazly?"
 COLDWAR_EGY_arm_fawzi_or_shazly_desc:0 "The junta is not of one mind. The cautious and methodical war minister, Mohamed Fawzi, believes the nation must be harnessed in its entirety before any new test with Israel. The younger and bolder Saad el-Shazly, hero of the paratroopers, wants a lean professional army and a limited, well-prepared blow. The council must choose whose vision the Republic will follow."
 COLDWAR_EGY_arm_fawzis_total_mobilisation:0 "Fawzi: Total Mobilisation"
 COLDWAR_EGY_arm_fawzis_total_mobilisation_desc:0 "Mohamed Fawzi takes the helm and turns Egypt into a single barracks. Reservists are recalled, factories and schools are drawn into the war effort, and the radio speaks of sacrifice and endurance. It is a heavy burden for a poor country, but Fawzi insists that the road back to Sinai runs through every household on the Nile."
 COLDWAR_EGY_arm_shazlys_professional_army:0 "Shazly: A Professional Army"
 COLDWAR_EGY_arm_shazlys_professional_army_desc:0 "Saad el-Shazly argues that wars are won by trained specialists, not by crowds in uniform. Under his leadership the army shrinks its ambitions and sharpens its skills, with long drills, realistic exercises and officers promoted on merit rather than connections. Soldiers grumble at the pace, but a leaner force begins to take shape along the canal."
 COLDWAR_EGY_arm_military_courts:0 "Military Courts"
 COLDWAR_EGY_arm_military_courts_desc:0 "Civilians accused of sabotage, subversion or simply of weakening the national will now stand before officers in uniform. The trials are swift and the verdicts rarely surprising. The generals call it wartime necessity, while lawyers and old judges whisper that the courthouse has become another barracks."
 COLDWAR_EGY_arm_the_general_intelligence_directorate:0 "The General Intelligence Directorate"
 COLDWAR_EGY_arm_the_general_intelligence_directorate_desc:0 "The Mukhabarat is placed firmly in the hands of the army. Its informants fill the cafes of Cairo, its files grow thick with the names of officers, students and journalists, and no rumour is too small to be recorded. The junta sleeps more easily, though few Egyptians do."
 COLDWAR_EGY_arm_martial_order_in_upper_egypt:0 "Martial Order in Upper Egypt"
 COLDWAR_EGY_arm_martial_order_in_upper_egypt_desc:0 "Troops and police deploy through the villages of the Said, where feuds, smuggling and the angry sermons of zealous preachers have long defied Cairo. Checkpoints appear on the river roads and village elders are summoned to the garrison. The generals promise order, and the south learns once more how far the capital's arm can reach."
 COLDWAR_EGY_arm_dissolve_the_party_structures:0 "Dissolve the Party Structures"
 COLDWAR_EGY_arm_dissolve_the_party_structures_desc:0 "The Arab Socialist Union, built to give the revolution a mass voice, is stripped of its committees and its pretensions. Local party offices are shuttered or handed to garrison commanders, and the old apparatchiks are retired with polite letters. The officers insist that Egypt needs deeds, not meetings."
 COLDWAR_EGY_arm_the_barracks_question:0 "Return to the Barracks?"
 COLDWAR_EGY_arm_the_barracks_question_desc:0 "Every junta eventually faces the same question. The emergency, it is said, will end with victory or at least with peace, yet the generals have grown accustomed to the Presidential Palace and the offices that come with it. Within the council, quiet arguments begin over whether power should ever be given back."
 COLDWAR_EGY_arm_civilian_handover:0 "Return to the Barracks"
 COLDWAR_EGY_arm_civilian_handover_desc:0 "The generals announce that the army's duty is to defend the nation, not govern it. A date is set, parties are invited to draw up platforms, and officers return to their units with their medals and a measure of public goodwill. Many Egyptians doubt it will last, but for the first time in years the ballot box is more than a rumour."
 COLDWAR_EGY_arm_indefinite_military_rule:0 "Indefinite Military Rule"
 COLDWAR_EGY_arm_indefinite_military_rule_desc:0 "The council declares that the emergency has no foreseeable end. Elections are postponed again and again, and the army is proclaimed the permanent guardian of the revolution. The generals grow comfortable in their villas and ministries, and the Republic hardens into a state in which the uniform is the only reliable passport."
 COLDWAR_EGY_arm_a_field_marshal_president:0 "A Field Marshal President"
 COLDWAR_EGY_arm_a_field_marshal_president_desc:0 "Abd al-Ghani al-Gamasy, the quiet planner whose maps shaped every Egyptian operation, is elevated to the presidency and the baton of a field marshal. He rules as he planned, carefully, patiently and with an eye for detail. To the public he is a steady hand and to the council a useful figurehead, though few doubt who his real constituency is."
 COLDWAR_EGY_arm_the_shield_of_the_nation:0 "The Shield of the Nation"
 COLDWAR_EGY_arm_the_shield_of_the_nation_desc:0 "The army has become more than a service. It feeds its own men, builds the roads, trades abroad and guarantees the borders. Officers speak of a Shield of the Nation, and in schools and barracks alike children learn that the uniform stands between Egypt and its enemies. Whether the shield protects the nation or confines it is left unsaid."
 COLDWAR_EGY_arm_defense_budget_first:0 "Defence Budget First"
 COLDWAR_EGY_arm_defense_budget_first_desc:0 "The finance ministry is told bluntly that the army comes first. Bread subsidies and school budgets are trimmed to keep the rearmament on schedule, and civil servants are reminded that the nation cannot eat while the canal is held by the enemy. Few dare to object in public."
 COLDWAR_EGY_arm_military_factories_for_civilian_goods:0 "Military Factories for Civilian Goods"
 COLDWAR_EGY_arm_military_factories_for_civilian_goods_desc:0 "The armaments works of Helwan and Cairo are ordered to turn their lathes to peaceful use. Refrigerators, pressure cookers and sewing machines roll off lines built for munitions, giving the army a new trade and the public goods that Egyptian shops have long lacked. Critics say the quality is martial, but the shelves are filling."
 COLDWAR_EGY_arm_army_farms_of_the_western_desert:0 "Army Farms of the Western Desert"
 COLDWAR_EGY_arm_army_farms_of_the_western_desert_desc:0 "Conscripts with spades are sent beyond the Nile to the oases of the New Valley. Wells are drilled, fields are marked out and the army takes up farming as another form of duty. Officers boast of self-sufficiency, and the desert, for once, seems to answer to the chain of command."
 COLDWAR_EGY_arm_army_engineers_build_the_roads:0 "Army Engineers Build the Roads"
 COLDWAR_EGY_arm_army_engineers_build_the_roads_desc:0 "The army's engineers, so recently drilled in crossing obstacles, are turned loose on the desert. Ribbons of asphalt reach the oases, the mines and the quarries without a single civilian contractor. It is cheap, fast and remarkably orderly, and every kilometre is a reminder of who is building the nation."
 COLDWAR_EGY_arm_arms_exports:0 "Arms Exports to Iraq and Africa"
 COLDWAR_EGY_arm_arms_exports_desc:0 "Egyptian-made rifles, ammunition and spare parts begin to leave the warehouses for Baghdad and the capitals of newly independent Africa. The sales bring in hard currency and friends, and the generals discover that a country that once only bought weapons can also sell them. Western diplomats take careful note."
 COLDWAR_EGY_arm_military_cooperatives:0 "Military Cooperatives"
 COLDWAR_EGY_arm_military_cooperatives_desc:0 "Officers' clubs, army shops and soldiers' cooperatives spread across the garrison towns, selling food and household goods at prices no private merchant can match. Veterans and their families find a measure of security, and the army gains a loyal following. Small traders watch with mounting unease."
 COLDWAR_EGY_arm_the_army_economy:0 "The Army Economy"
 COLDWAR_EGY_arm_the_army_economy_desc:0 "Farms, factories, workshops and shops together form a state within the state. The army no longer relies on the treasury alone, and its officers sit on the boards of enterprises that employ thousands. Growth follows, but so does the sense that the economy of Egypt has become the economy of the barracks."
 COLDWAR_EGY_arm_the_arab_military_pact:0 "The Arab Military Pact"
 COLDWAR_EGY_arm_the_arab_military_pact_desc:0 "Emissaries of the junta travel to Damascus, Baghdad and Amman proposing what Nasser's diplomacy never achieved, a standing military alliance among the confrontation states. Officers speak to officers, bypassing the quarrelling politicians. If the pact holds, the Arab armies may finally act as one."
 COLDWAR_EGY_arm_arms_from_everyone:0 "Arms from Everyone"
 COLDWAR_EGY_arm_arms_from_everyone_desc:0 "Egyptian procurement officers shop wherever the price is right. Soviet tanks, French electronics and whatever else can be had are paid for with cotton, credit and favours, and no single supplier is allowed to hold the army hostage. Moscow frowns, Paris smiles, and the arsenals of Egypt fill steadily."
 COLDWAR_EGY_ye_misr_al_fatat_reborn:0 "Misr al-Fatat Reborn"
 COLDWAR_EGY_ye_misr_al_fatat_reborn_desc:0 "The old Young Egypt movement of the thirties returns from the political wilderness, its green banners dusted off and its slogans fitted to a new era. Veterans of the original movement stand beside embittered young officers, united by contempt for the pashas and a hunger for national dignity after the defeat. Egypt, they declare, shall be reborn by its own sons."
 COLDWAR_EGY_ye_the_mass_rallies:0 "The Mass Rallies"
 COLDWAR_EGY_ye_the_mass_rallies_desc:0 "Cairo's squares and Alexandria's seafront fill with columns of marching youth, torches and banners. Speakers promise that the nation will rise as one, and the crowds roar in reply. Whatever the foreign embassies make of it, the government has shown that it can summon the street at will."
 COLDWAR_EGY_ye_pharaoh_or_crescent:0 "Pharaoh or Crescent?"
 COLDWAR_EGY_ye_pharaoh_or_crescent_desc:0 "The movement has two souls. One looks to the monuments of Giza and Luxor and sees a proud Egyptian civilisation older than any creed. The other sees the minaret and the faith that has bound the Egyptians for more than a thousand years. The leadership must decide which to place at the heart of its nationalism."
 COLDWAR_EGY_ye_pharaonic_nationalism:0 "Pharaonic Nationalism"
 COLDWAR_EGY_ye_pharaonic_nationalism_desc:0 "Schoolbooks are rewritten to glorify the builders of the pyramids, and the language of the movement turns to blood and soil along the Nile. Copts and secular intellectuals take heart at being counted as heirs of a common past, while the sheikhs of al-Azhar mutter that the nation is being taught to honour idols of stone."
 COLDWAR_EGY_ye_islamic_nationalism:0 "Islamic Nationalism"
 COLDWAR_EGY_ye_islamic_nationalism_desc:0 "The movement embraces the faith as the soul of the nation. Its rallies open with prayers and its programmes speak of a virtuous Egypt, the guardian of Islam and the heart of the Arab world. Ahmed Hussein's later turn toward religion finds a ready audience in the mosques, though not everyone is comfortable with the new tone."
 COLDWAR_EGY_ye_the_green_shirts:0 "The Green Shirts"
 COLDWAR_EGY_ye_the_green_shirts_desc:0 "Young men in green shirts drill in school courtyards and on village squares, sworn to the movement and to one another. Their discipline impresses their elders and alarms their opponents. They are the movement's pride, its fist and, some fear, its future police."
 COLDWAR_EGY_ye_national_youth_service:0 "National Youth Service"
 COLDWAR_EGY_ye_national_youth_service_desc:0 "Every young Egyptian is called to serve, in the fields, in the workshops, in uniform and in the ranks of the movement. The camps teach discipline, literacy and loyalty in equal measure. Parents grumble at the interruption to schooling, but many are proud to see their sons marching with purpose."
 COLDWAR_EGY_ye_against_the_pashas:0 "Against the Pashas and the Foreigners"
 COLDWAR_EGY_ye_against_the_pashas_desc:0 "The movement turns its fury on the old landed class and the foreign firms that still prosper along the Nile. Palaces are denounced, concessions questioned and cosmopolitan Alexandria is warned that its days of easy indulgence are over. The workers and the poor cheer, while bankers and diplomats count the cost."
 COLDWAR_EGY_ye_the_piastre_plan:0 "The Piastre Plan Revived"
 COLDWAR_EGY_ye_the_piastre_plan_desc:0 "The old Qirsh appeal of 1931 is revived, asking every Egyptian to give a coin toward national industry. Pennies from shopkeepers, students and fellahin are pooled into funds for new Egyptian factories. It is a modest idea, but it gives ordinary people a stake in the nation's machines."
 COLDWAR_EGY_ye_egyptian_goods_for_egyptians:0 "Egyptian Goods for Egyptians"
 COLDWAR_EGY_ye_egyptian_goods_for_egyptians_desc:0 "Shopwindows carry placards urging patriots to buy at home, and foreign wares are taxed and scorned. Small manufacturers and craftsmen, long crushed by imports, find their workshops busy again. Importers complain, and consumers learn that national pride sometimes costs a little more."
 COLDWAR_EGY_ye_nationalise_the_trade_houses:0 "Nationalise the Foreign Trade Houses"
 COLDWAR_EGY_ye_nationalise_the_trade_houses_desc:0 "The great foreign trading houses, whose offices have handled Egypt's cotton and its commerce for generations, are taken over in the name of the nation. London and Paris protest loudly. In Cairo, crowds cheer as the last relics of the capitulations are finally swept away."
 COLDWAR_EGY_ye_a_national_economy:0 "A National Economy"
 COLDWAR_EGY_ye_a_national_economy_desc:0 "Egyptian capital, Egyptian labour and Egyptian management now run the commanding heights of the country. The plants hum, the ledgers are kept in Arabic, and the movement can point to a young economy that no longer bows to foreign creditors. Whether it can stand without them remains to be seen."
 COLDWAR_EGY_ye_the_unity_of_the_nile_valley:0 "The Unity of the Nile Valley"
 COLDWAR_EGY_ye_the_unity_of_the_nile_valley_desc:0 "Egypt and the Sudan, the movement insists, are one valley and one people, divided only by imperial map-makers. Posters show the Nile flowing unbroken from Khartoum to the sea. In Khartoum this slogan is heard with deep unease, and the Sudanese government wonders where Egyptian ambition will stop."
 COLDWAR_EGY_ye_against_foreign_bases:0 "Against Foreign Bases"
 COLDWAR_EGY_ye_against_foreign_bases_desc:0 "The movement tells both Washington and Moscow that Egypt will not be anyone's garrison. Advisers are politely but firmly asked to pack, and the nation is promised independence in fact as well as in name. Egypt's patrons are dismayed, but the street applauds."
 COLDWAR_EGY_ye_egypt_leads_africa:0 "Egypt Leads Africa"
 COLDWAR_EGY_ye_egypt_leads_africa_desc:0 "Egyptian emissaries, teachers and radio broadcasts fan out across the continent, presenting Cairo as the natural leader of a liberated Africa. In Khartoum, Addis Ababa, Chad and Libya the message finds both admirers and wary rulers. The ambition recalls Nasser's, but without the Soviet bargain behind it."
 COLDWAR_EGY_ye_a_greater_egypt:0 "A Greater Egypt"
 COLDWAR_EGY_ye_a_greater_egypt_desc:0 "The dream that began in the cafes of Cairo in the thirties is stated openly, an Egypt reaching beyond the Nile Valley to claim a leading place in the Arab and African world. Soldiers, students and workers march under the same banner, and the leaders speak of destiny. Egypt's neighbours listen with growing alarm."
 COLDWAR_EGY_rcc_the_new_council:0 "The New Council"
 COLDWAR_EGY_rcc_the_new_council_desc:0 "A new Revolutionary Command Council is sworn in, made up of younger and angrier officers who regard Nasser's heirs as tired and compromised. They speak of finishing the revolution that began in 1952 and of purging all who have grown fat on it. The old order in Cairo has reason to be afraid."
 COLDWAR_EGY_rcc_the_colonels_proclamation:0 "The Colonels' Proclamation"
 COLDWAR_EGY_rcc_the_colonels_proclamation_desc:0 "On the radio, a colonel reads out the council's proclamation. The old regime is condemned, the war will be fought without compromise, and every Egyptian is summoned to serve. The tone is blunt and the promises are large. In the barracks the junior officers cheer, and in the ministries clerks quietly clear their desks."
 COLDWAR_EGY_rcc_purity_or_technocracy:0 "Purity or Technocracy?"
 COLDWAR_EGY_rcc_purity_or_technocracy_desc:0 "The council cannot agree on what kind of revolution it is making. One faction demands ideological purity, with the faithful rewarded and the doubtful removed. Another argues that only competent engineers and planners can rebuild the nation. The choice will shape the character of the new regime."
 COLDWAR_EGY_rcc_revolutionary_purity:0 "Revolutionary Purity"
 COLDWAR_EGY_rcc_revolutionary_purity_desc:0 "Loyalty becomes the measure of every man. Committees review the record of officers, officials and teachers, and those with doubtful pasts are removed. The faithful are honoured, and the creed of the revolution is recited in every school. The council grows ever more suspicious of anyone who thinks for himself."
 COLDWAR_EGY_rcc_technocratic_militarism:0 "Technocratic Militarism"
 COLDWAR_EGY_rcc_technocratic_militarism_desc:0 "Engineers in uniform are placed in charge of ministries, factories and research institutes. The council trusts the slide rule over the slogan, and the results are measured in tonnes, kilowatts and schedules. Ideologues sulk at the sidelines while the army's technicians quietly remake the state."
 COLDWAR_EGY_rcc_revolutionary_tribunals:0 "Revolutionary Tribunals"
 COLDWAR_EGY_rcc_revolutionary_tribunals_desc:0 "Special tribunals are set up to try speculators, saboteurs and corrupt officials. Proceedings are rapid and public, and the sentences are severe. The poor cheer when a notorious profiteer is led away, and the rich begin to wonder whose turn is next."
 COLDWAR_EGY_rcc_militarise_society:0 "Militarise Society"
 COLDWAR_EGY_rcc_militarise_society_desc:0 "Every institution takes on a martial tone. Students march, workers drill and civil servants wear uniforms on state occasions. Whole neighbourhoods are organised into units with commanders, and Egypt begins to look like a country preparing for a war that is always about to begin."
 COLDWAR_EGY_rcc_the_revolutionary_economic_council:0 "The Revolutionary Economic Council"
 COLDWAR_EGY_rcc_the_revolutionary_economic_council_desc:0 "A new body of officers and planners is given authority to override ministers, banks and managers. Orders are issued in the name of the revolution, and projects that once languished in committee are suddenly begun. The economy is to be run like a campaign."
 COLDWAR_EGY_rcc_confiscate_the_new_class:0 "Confiscate the New Class"
 COLDWAR_EGY_rcc_confiscate_the_new_class_desc:0 "The council denounces a new class of contractors, importers and senior officials who have grown rich during the years of defeat. Villas are seized, bank accounts are frozen and the proceeds are poured into the national treasury. The crowds approve, while the middle class lies awake wondering about their own savings."
 COLDWAR_EGY_rcc_labour_battalions:0 "Labour Battalions"
 COLDWAR_EGY_rcc_labour_battalions_desc:0 "Workers are enrolled into disciplined battalions and sent wherever the nation needs them, to docks, building sites and canal works. They are fed, housed and paid, and they are not free to leave. Foremen are replaced by officers, and the trade unions learn to call their members comrades-in-arms."
 COLDWAR_EGY_rcc_a_command_economy:0 "A Command Economy"
 COLDWAR_EGY_rcc_a_command_economy_desc:0 "Prices, wages, quotas and investment are decided in the council's planning rooms. Directors of factories receive orders rather than advice, and the market is treated as an enemy to be starved. Output rises and shortages fall, but the clerks of the plan hold more power than the people they serve."
 COLDWAR_EGY_rcc_the_canal_bunker_line:0 "The Canal Bunker Line"
 COLDWAR_EGY_rcc_the_canal_bunker_line_desc:0 "Along the western bank of the canal, concrete casemates and sand ramparts rise under the desert sun, a chain of fortified positions meant to hold the line whatever the cost. Gunners and sappers work day and night under the eyes of enemy aircraft. The council is determined that no Israeli column will cross."
 COLDWAR_EGY_rcc_a_revolutionary_foreign_policy:0 "A Revolutionary Foreign Policy"
 COLDWAR_EGY_rcc_a_revolutionary_foreign_policy_desc:0 "Egypt declares itself the vanguard of the Arab revolution and begins to export it. Agents and broadcasts reach into Libya, the Sudan and Syria in support of like-minded officers, while Washington is denounced in every speech. Friends are few, but the council values loyalty over comfort."
 COLDWAR_EGY_rcc_the_iron_republic:0 "The Iron Republic"
 COLDWAR_EGY_rcc_the_iron_republic_desc:0 "The revolution is finished, or so its architects claim. A state of order, discipline and steel stands where the monarchy and the old parties once did. Citizens salute the flag, heed the radio and expect nothing else. For the council the Iron Republic is the proof that the sacrifices were justified."
 COLDWAR_EGY_mon_the_return_of_the_king:0 "The Return of the King"
 COLDWAR_EGY_mon_the_return_of_the_king_desc:0 "After eighteen years in exile, the former king returns to Egypt. Fuad II, who was only a child when the Free Officers sent his family away, steps onto the quay at Alexandria to the sound of cannon and cheering crowds. For some, it is a restoration of lost dignity and for others a humiliating step back in time."
 COLDWAR_EGY_mon_the_royal_council:0 "The Royal Council"
 COLDWAR_EGY_mon_the_royal_council_desc:0 "A council of elder statesmen, loyal officers and men of the old court is gathered around the throne. Surviving ministers of the monarchy, landowners and veteran diplomats advise the young king in whispers. They bring experience and nostalgia in equal measure, and the republic's critics are quick to say that the pashas are back."
 COLDWAR_EGY_mon_constitution_or_prerogative:0 "Constitution or Prerogative?"
 COLDWAR_EGY_mon_constitution_or_prerogative_desc:0 "The restored monarchy must decide what kind of king Egypt will have. One camp points to the constitution of 1923 and argues that the crown will survive only if it rules with parliament. The other holds that after the chaos of the republic, the people need a ruler with real power. The palace is divided."
 COLDWAR_EGY_mon_a_constitutional_monarchy:0 "A Constitutional Monarchy"
 COLDWAR_EGY_mon_a_constitutional_monarchy_desc:0 "The king swears to uphold the constitution, and the doors of parliament are opened once more. Parties are permitted, newspapers print freely and the crown presides above the quarrels of politicians. London and the Western capitals are delighted, though the veterans of the old palace camarilla sigh at the loss of authority."
 COLDWAR_EGY_mon_the_royal_prerogative:0 "The Royal Prerogative"
 COLDWAR_EGY_mon_the_royal_prerogative_desc:0 "The crown retains the right to appoint ministers, dissolve assemblies and decide matters of war and peace. Parliament may talk, but the king will decide. The royal court speaks of order and continuity, and the liberal press is told to remember how the last parliamentary age ended."
 COLDWAR_EGY_mon_the_parliament_of_the_kingdom:0 "The Parliament of the Kingdom"
 COLDWAR_EGY_mon_the_parliament_of_the_kingdom_desc:0 "Deputies file into the chamber for the first time in a generation. The veterans of the New Wafd appear in dark suits, proud and a little surprised to be back in the game. Whatever the limits placed on it, the Parliament of the Kingdom gives the new order a voice and an air of legitimacy."
 COLDWAR_EGY_mon_the_royal_guard:0 "The Royal Guard"
 COLDWAR_EGY_mon_the_royal_guard_desc:0 "Handpicked soldiers, resplendent in ceremonial uniforms but armed with modern weapons, are charged with defending the king and his palace. Their loyalty is to the person of the monarch rather than to any general or party. The army's officers watch with mixed feelings."
 COLDWAR_EGY_mon_abdeen_palace_restored:0 "Abdeen Palace Restored"
 COLDWAR_EGY_mon_abdeen_palace_restored_desc:0 "The great palace in the heart of Cairo, long a museum and a ministry, is cleaned, regilded and returned to the crown. Chandeliers are rehung and the old ceremonies revived. The great landowners return to court, delighted to see the world they knew restored, while the fellahin ask what it means for them."
 COLDWAR_EGY_mon_return_the_royal_estates:0 "Return the Royal Estates"
 COLDWAR_EGY_mon_return_the_royal_estates_desc:0 "Lands taken from the royal family in 1952 are returned to the crown, together with the revenues that come with them. The estates are a visible sign of the king's rehabilitation, and a pointed reminder to the peasants who farmed them of how much has changed."
 COLDWAR_EGY_mon_the_royal_cotton_company:0 "The Royal Cotton Company"
 COLDWAR_EGY_mon_the_royal_cotton_company_desc:0 "A new company under royal patronage takes up the management of Egypt's most famous export. Long-staple cotton again flows from the Delta through Alexandria's brokers to the mills of Lancashire and beyond. Buyers recall the golden days of the trade, and for the first time in years the ledgers are optimistic."
 COLDWAR_EGY_mon_the_crown_development_fund:0 "The Crown Development Fund"
 COLDWAR_EGY_mon_the_crown_development_fund_desc:0 "The king writes to his fellow monarchs of Arabia and the Gulf, inviting them to place their wealth in the rebuilding of Egypt. A fund bearing the crown's name is to channel their money into canals, ports and housing. It is a bold appeal from one throne to others, and the response will show how much loyalty the royal name still commands."
 COLDWAR_EGY_mon_an_investors_kingdom:0 "An Investor's Kingdom"
 COLDWAR_EGY_mon_an_investors_kingdom_desc:0 "Egypt is presented to the world as a stable, hospitable kingdom where capital is welcome and property is secure. Bankers from Beirut, Kuwait and London visit the offices of the new ministry, and the old arguments against foreign money are put aside. The crown's reputation is the guarantee."
 COLDWAR_EGY_mon_royal_irrigation_board:0 "The Royal Irrigation Board"
 COLDWAR_EGY_mon_royal_irrigation_board_desc:0 "A board of engineers, old hands from the days of the monarchy and young graduates, is charged with the canals, barrages and pumping stations of the Nile Valley. The king's name is attached to every new channel, and the fellahin find that water arrives more reliably than it has for years."
 COLDWAR_EGY_mon_tourism_of_kings_and_pharaohs:0 "Kings and Pharaohs"
 COLDWAR_EGY_mon_tourism_of_kings_and_pharaohs_desc:0 "The monarchy discovers an unexpected asset in its heritage. Visitors come to see the pyramids and Luxor, but also the palaces, the royal train and the old courts of Cairo. Hotels reopen, guides polish their English and French, and the restored crown helps to make Egypt fashionable again."
 COLDWAR_EGY_mon_a_royal_economy:0 "A Royal Economy"
 COLDWAR_EGY_mon_a_royal_economy_desc:0 "Cotton, tourism, Gulf investment and the improved channels of the Nile together give the kingdom something it has lacked for years, a sense of economic confidence. The treasury is healthier, merchants return and the court proudly attributes it all to the wisdom of the crown."
 COLDWAR_EGY_mon_the_brotherhood_of_crowns:0 "The Brotherhood of Crowns"
 COLDWAR_EGY_mon_the_brotherhood_of_crowns_desc:0 "Fuad II is received with honours by the kings of Arabia, Jordan, Morocco and the Shah of Iran. The old rivalries are put aside, and the monarchs pledge to stand together against revolution wherever it breaks out. For Egypt, so recently the home of the Arab revolution, the change of company is remarkable."
 COLDWAR_EGY_mon_friends_in_london:0 "Friends in London"
 COLDWAR_EGY_mon_friends_in_london_desc:0 "The old connection with Britain, once a source of resentment, is quietly revived. Ministers visit Whitehall and British firms return to the Nile. Egypt's merchants hope for easier trade and the court for the dignified friendship of a fellow crown."
 COLDWAR_EGY_mon_the_shahs_friendship:0 "The Shah's Friendship"
 COLDWAR_EGY_mon_the_shahs_friendship_desc:0 "Fuad II's family connection to the Pahlavis, linked by marriage in the previous generation, becomes the basis of a political understanding. The Shah, who wishes to see monarchy defended from Cairo to Tehran, offers the friendship of a rich and ambitious neighbour. A bond between two thrones is a new feature of Middle Eastern politics."
 COLDWAR_EGY_mon_king_of_egypt_and_the_sudan:0 "King of Egypt and the Sudan"
 COLDWAR_EGY_mon_king_of_egypt_and_the_sudan_desc:0 "The court revives the old title worn by the grandfather and speaks once more of the unity of the Nile Valley under the crown. The palace is restored, the economy is sound, friends abroad are secured and the succession is settled. Loyalists believe that the dynasty has come home for good, while Khartoum watches with trepidation."
 COLDWAR_EGY_grd_the_revolutionary_committees:0 "The Revolutionary Committees"
 COLDWAR_EGY_grd_the_revolutionary_committees_desc:0 "In every street and village, committees of the faithful keep watch on morals, loyalty and speech. They are the eyes and ears of the revolution, reporting neighbours who miss prayers or utter doubts. Order returns to the streets, but at the price of a society in which everyone suspects the person beside them."
 COLDWAR_EGY_grd_the_martyrs_foundation:0 "The Martyrs' Foundation"
 COLDWAR_EGY_grd_the_martyrs_foundation_desc:0 "The families of those who fell in the revolution and the wars are cared for by a dedicated foundation, with pensions, housing and honours. Mothers wearing black are received like queens, and their sons are praised from every pulpit. The cult of martyrdom becomes a central pillar of the republic's legitimacy."
 COLDWAR_EGY_grd_guardian_industries:0 "Guardian Industries"
 COLDWAR_EGY_grd_guardian_industries_desc:0 "The Guardians establish factories of their own, producing arms, machinery and the necessities of war economy. Run by trusted men of the movement, they are free from the interference of the old ministries, answering only to the jurist. A new industrial sector rises from the revolution, shielded from scrutiny and from rivals."
 COLDWAR_EGY_grd_smuggling_routes:0 "Smuggling Routes"
 COLDWAR_EGY_grd_smuggling_routes_desc:0 "When the legal avenues of trade are closed by sanctions, other routes open. Dhows cross the Red Sea at night, caravans move through the desert and officials in remote ports learn to look the other way. The Guardians scorn the smugglers in public, but the republic's survival increasingly depends on them."
 COLDWAR_EGY_grd_missiles_of_the_revolution:0 "Missiles of the Revolution"
 COLDWAR_EGY_grd_missiles_of_the_revolution_desc:0 "In workshops guarded by the Guardians, engineers labour to build rockets that can strike the enemy at a distance. Parades display the long, blunt shapes on trucks, accompanied by crowds chanting. The missiles become a symbol of the revolution's defiance, and a source of grave concern to Egypt's neighbours."
 COLDWAR_EGY_grd_the_axis_of_resistance:0 "The Axis of Resistance"
 COLDWAR_EGY_grd_the_axis_of_resistance_desc:0 "From Cairo to Damascus, Tripoli and the camps of Palestine, a chain of friendly forces and governments takes shape, bound together by hostility to Israel and the West. The Guardians are its patrons and arsenal. The alliance is loose and its members have little else in common, but its existence changes the strategic map of the Middle East."
 COLDWAR_EGY_grd_the_succession_of_the_jurist:0 "The Succession of the Jurist"
 COLDWAR_EGY_grd_the_succession_of_the_jurist_desc:0 "The aging jurist's health is a matter whispered in the corridors. The Guardians, who have governed in his name, must now consider who will govern after him. The pragmatists argue for flexibility and the principlists for steadfastness, and the choice between them will decide whether the revolution lasts or hardens."
 COLDWAR_EGY_grd_the_pragmatists:0 "The Pragmatists"
 COLDWAR_EGY_grd_the_pragmatists_desc:0 "The new circle of leaders grasps that a revolution, to survive, must trade, eat and make peace with some of its neighbours. The doors of commerce open a little, factories are given modest freedom and diplomats begin to speak softly. The old zealots mutter about betrayal, but ordinary Egyptians breathe a little more easily."
 COLDWAR_EGY_grd_the_principlists:0 "The Principlists"
 COLDWAR_EGY_grd_the_principlists_desc:0 "The faithful of the old guard take command, determined that the revolution shall not be diluted. Any hint of compromise is denounced, the ideals of the founding years are restated and the ranks are closed. The Guardians present themselves as the defenders of purity, and the republic marches on with a hardened sense of mission."
 COLDWAR_EGY_grd_velayat_entrenched:0 "Velayat Entrenched"
 COLDWAR_EGY_grd_velayat_entrenched_desc:0 "The succession has been settled, the industries built and the allies gathered. The rule of the jurist is no longer a revolutionary experiment but an institution, with its own habits, wealth and loyalists. Whether the Egyptian people accept it or merely endure it, the Guardians are here to stay."
 COLDWAR_EGY_irf_the_islamic_militia:0 "The Islamic Militia"
 COLDWAR_EGY_irf_the_islamic_militia_desc:0 "Volunteers in green armbands guard the mosques, patrol the markets and enforce the decisions of the revolutionary committees. They are young, devout and armed, and answer to the clerics rather than to any general. Alongside the regular army, a new force grows up whose loyalty is not to the state but to the revolution."
 COLDWAR_EGY_irf_integrate_the_army:0 "Integrate the Army"
 COLDWAR_EGY_irf_integrate_the_army_desc:0 "The government chooses to work with the soldiers it has inherited. Chaplains are posted to the regiments, officers are examined for piety, and the army is invited to see itself as the sword of Islam. Many professional soldiers, grateful to be spared a purge, accept the new orthodoxy with cautious relief."
 COLDWAR_EGY_irf_replace_the_army:0 "Replace the Army"
 COLDWAR_EGY_irf_replace_the_army_desc:0 "The old army, tainted by defeat and by service to the fallen regime, is dissolved. Its officers are dismissed or imprisoned, and in its place the revolutionary militias become the foundation of a new force. The republic's defenders are zealous, devoted and untried, and the experienced professionals who once led the army are gone."
 COLDWAR_EGY_irf_the_land_of_the_oppressed:0 "Land for the Oppressed"
 COLDWAR_EGY_irf_the_land_of_the_oppressed_desc:0 "The great estates and those of the corrupt are redistributed among the landless of the villages, with the mosque committees overseeing the process. The fellahin, who have long toiled for others, receive title to their own fields, and sermons praise the revolution that restored the land to those who work it."
 COLDWAR_EGY_irf_the_oil_of_the_revolution:0 "The Oil of the Revolution"
 COLDWAR_EGY_irf_the_oil_of_the_revolution_desc:0 "The wells of the Gulf of Suez are placed under revolutionary control, and their output is directed towards the needs of the republic. The leaders of the revolution declare that Egypt's oil belongs to its people and to the Muslim nation, and that no foreign company will profit from it again."
 COLDWAR_EGY_irf_cultural_revolution:0 "The Islamic Cultural Revolution"
 COLDWAR_EGY_irf_cultural_revolution_desc:0 "Universities, theatres, cinemas and publishing houses are scrutinised for deviation from Islamic values. Curricula are rewritten, books are withdrawn from the shelves and entertainers learn to tread carefully. The republic proclaims the dawn of an authentic culture freed from imitation of the West, though many of Cairo's artists and academics are less enthusiastic."
 COLDWAR_EGY_irf_open_to_the_south:0 "Open to the South"
 COLDWAR_EGY_irf_open_to_the_south_desc:0 "The republic's emissaries travel up the Nile and across the Red Sea, preaching the revolution to Sudan, Eritrea and Somalia. Pilgrims, students and relief workers carry the message in Egypt's name. In a region of weak states and ancient faiths, the example of the Islamic Republic carries a considerable appeal."
 COLDWAR_EGY_irf_the_republic_matures:0 "The Republic Matures"
 COLDWAR_EGY_irf_the_republic_matures_desc:0 "The first stormy years give way to a more settled routine. The army, the land, the culture and the diplomacy of the republic have all found their shape. The revolution is less turbulent than before, and its leaders speak of the long task of building a state worthy of the faith."
 COLDWAR_EGY_fn_green_assembly:0 "The Green Assembly"
 COLDWAR_EGY_fn_green_assembly_desc:0 "The Friends of the Nile open the political arena, calling an assembly in which agronomists, doctors, villagers and delegates of the river communities have a voice. It is a strange parliament, closer to a town meeting than a party congress, but it gives a government of scientists the legitimacy it needs to carry out its programme."
 COLDWAR_EGY_fn_a_people_of_the_river:0 "A People of the River"
 COLDWAR_EGY_fn_a_people_of_the_river_desc:0 "The movement turns its philosophy into a national story, one that reminds Egyptians that they are, and always have been, a people of the river. Neither East nor West, this identity belongs to the farmer, the boatman and the townsman alike, and offers a unity that no bloc or ideology has been able to provide."
 COLDWAR_EGY_fn_the_aswan_debate:0 "The Aswan Debate"
 COLDWAR_EGY_fn_the_aswan_debate_desc:0 "The high dam stands at the heart of the movement's dilemma. It has brought power and secured the harvest against drought, but it has also altered the river for ever. The Friends of the Nile must now decide whether to embrace the dam as a fact of life or to make it answer for what it has taken."
 COLDWAR_EGY_fn_work_with_the_dam:0 "Work with the Dam"
 COLDWAR_EGY_fn_work_with_the_dam_desc:0 "Pragmatists in the government argue that the dam cannot be undone and should be put to the best possible use. Turbines are refitted, reservoir management is improved and the stored water is released with care. Egypt accepts the dam, with its blessings and its burdens, as part of the modern river."
 COLDWAR_EGY_fn_fight_the_dams_damage:0 "Fight the Dam's Damage"
 COLDWAR_EGY_fn_fight_the_dams_damage_desc:0 "Others insist that the dam's consequences are too grave to ignore. Teams of scientists and engineers fan out across the valley to tackle salinity, erosion and the loss of silt, while farmers receive aid to restore their exhausted soils. The government commits itself to a long and costly campaign against the unintended harm of the great project."
 COLDWAR_EGY_fn_green_jobs:0 "Green Jobs in the Desert"
 COLDWAR_EGY_fn_green_jobs_desc:0 "The solar fields and wind farms of the desert need workers as well as engineers. Young men from overcrowded villages find work building, maintaining and guarding the new plants, and settlements spring up on the edge of the sand. The Friends of the Nile hope that clean power will bring employment as well as light."
 COLDWAR_EGY_fn_a_defence_of_the_land:0 "A Defence of the Land"
 COLDWAR_EGY_fn_a_defence_of_the_land_desc:0 "The movement is no pacifist society, and Israeli guns still shell the canal towns. Its defence policy is built around protecting the valley, the dam and the farmland, with local militias and well-prepared defences rather than costly offensive forces. Egypt will defend its soil, but it will not squander its wealth on conquest."
 COLDWAR_EGY_fn_nile_partnership:0 "Nile Partnership"
 COLDWAR_EGY_fn_nile_partnership_desc:0 "Beyond the first water talks, Cairo proposes something bolder: a joint authority with Sudan to manage the river as a shared inheritance. If Khartoum accepts, the old suspicion between upstream and downstream might give way to cooperation, and the Nile could become a bond rather than a source of quarrel."
 COLDWAR_EGY_rcc_the_national_guard:0 "The National Guard"
 COLDWAR_EGY_rcc_the_national_guard_desc:0 "A paramilitary guard is raised from the most loyal workers, students and veterans, issued with rifles and sent to patrol the factories and the streets. It stands apart from the regular army, answers only to the council and reminds the generals that they too can be watched."
 COLDWAR_EGY_rcc_the_shock_divisions:0 "The Shock Divisions"
 COLDWAR_EGY_rcc_the_shock_divisions_desc:0 "Picked soldiers are gathered into formations trained for ruthless offence, with the best armour and the youngest, hardest officers. Their motto is attack and their schedule leaves no room for doubt. The council sees in them the spearhead that will smash the enemy's line when the day arrives."
 COLDWAR_EGY_rcc_the_state_security_courts:0 "State Security Courts"
 COLDWAR_EGY_rcc_the_state_security_courts_desc:0 "A permanent system of security courts takes over from the improvised tribunals. It has its own prosecutors, its own prisons and its own rules, all in the name of protecting the revolution. The police gain confidence, and the lawyers learn how little their briefs now matter."
 COLDWAR_EGY_rcc_autarky_of_the_nile:0 "Autarky of the Nile"
 COLDWAR_EGY_rcc_autarky_of_the_nile_desc:0 "Egypt is told to rely on nothing but itself. Imports are curbed, foreign advisers are sent home and every household is urged to make do. Sanctions and embargoes hold little terror for a state that has decided to stand alone. The sacrifice is real, but so is the pride."
 COLDWAR_EGY_rcc_the_council_divides:0 "The Council Divides"
 COLDWAR_EGY_rcc_the_council_divides_desc:0 "As victory over its enemies draws near, the council turns on itself. Rival officers accumulate supporters, ministries become fiefdoms and whispers of conspiracy fill the corridors. Everyone realises that the revolution cannot have two heads for long, and that the next decision of the council will determine who survives it."
 COLDWAR_EGY_rcc_a_single_leader:0 "A Single Leader"
 COLDWAR_EGY_rcc_a_single_leader_desc:0 "One colonel emerges from the quarrels, and the others fall in behind him or fall silent. He becomes the voice of the revolution and the sole interpreter of its will. His portrait appears on every wall, and the council becomes his audience."
 COLDWAR_EGY_rcc_collective_command:0 "Collective Command"
 COLDWAR_EGY_rcc_collective_command_desc:0 "The officers agree to rule together, with decisions taken by the council and no single man placed above it. It is a fragile balance of rivals who trust each other only so far, but it spares the Republic the folly of a lone ruler. In the corridors of power, argument is kept alive."
 COLDWAR_EGY_nb_the_village_guards:0 "The Village Guards (Ghafir)"
 COLDWAR_EGY_nb_the_village_guards_desc:0 "The ghafirs, the traditional village watchmen, are put on a regular footing and armed with authority as well as a stick. They know everyone in their villages and every path between the fields. The police of the towns find that the countryside is quieter than before."
 COLDWAR_EGY_nb_tribal_peace_in_upper_egypt:0 "Tribal Peace in Upper Egypt"
 COLDWAR_EGY_nb_tribal_peace_in_upper_egypt_desc:0 "In Upper Egypt, feuds between families have lasted for generations, settled by the gun or the knife. The notables use their prestige to convene reconciliation councils where blood-money is agreed and old enmities are laid to rest. The Said, long neglected, begins to enjoy a peace that no army could have imposed."
 COLDWAR_EGY_nb_the_notables_and_the_army:0 "The Notables and the Army"
 COLDWAR_EGY_nb_the_notables_and_the_army_desc:0 "The notables seek an understanding with the army, offering recruits, loyalty and local order in return for being left to manage their own affairs. The officers, themselves sons of provincial families, find much common ground. Cairo and the countryside reach an accommodation that both can live with."
 COLDWAR_EGY_nb_the_heir_of_the_notables:0 "The Heir of the Notables"
 COLDWAR_EGY_nb_the_heir_of_the_notables_desc:0 "The older generation of notables cannot rule for ever, and the question of who will inherit their influence grows pressing. Will it pass to the sons of the great landed families, or to the educated city men who have made their fortunes in trade and the professions? The answer will define the character of the order."
 COLDWAR_EGY_nb_the_landed_heir:0 "The Landed Heir"
 COLDWAR_EGY_nb_the_landed_heir_desc:0 "The heir is a landowner of the old school, schooled in his father's fields and committed to the rural order. He understands the harvest, the irrigation channels and the ways of the villages, and he distrusts the city. Under him the notables remain what they have always been: the aristocracy of the Egyptian countryside."
 COLDWAR_EGY_nb_the_urban_notable:0 "The Urban Notable"
 COLDWAR_EGY_nb_the_urban_notable_desc:0 "The heir is a lawyer, merchant or physician of the provincial towns, educated in the city and at ease in both worlds. He carries the old families' standing into the modern economy and sees the future in commerce and the professions. With him the notables take on the manners of a new middle class."
 COLDWAR_EGY_ij_the_mujahidin_army:0 "The Mujahidin Army"
 COLDWAR_EGY_ij_the_mujahidin_army_desc:0 "Fighters hardened in the underground and the foreign wars of the faith are formed into an army of volunteers. They are inspired by faith and uninhibited by the habits of the old officer corps. Lacking organisation, the mujahidin make up for it in zeal."
 COLDWAR_EGY_ij_weapons_of_the_jihad:0 "Weapons of the Jihad"
 COLDWAR_EGY_ij_weapons_of_the_jihad_desc:0 "Workshops in Cairo and the provinces turn out rifles, rockets and explosives for the holy struggle. Engineers loyal to the movement adapt the arsenal of the old army to new purposes. The emirate will not lack the tools of war, whatever the world may think."
 COLDWAR_EGY_ij_the_emirs_succession:0 "The Emir's Succession"
 COLDWAR_EGY_ij_the_emirs_succession_desc:0 "The movement's leaders must decide who will guide it in the years ahead. Two figures stand forth: the venerable blind preacher of the south, and the cold, ambitious physician who dreams of a worldwide struggle. The choice will decide whether the revolution stays on the Nile or sets out to conquer the world."
 COLDWAR_EGY_ij_the_blind_sheikh:0 "The Blind Sheikh"
 COLDWAR_EGY_ij_the_blind_sheikh_desc:0 "Omar Abd al-Rahman, the blind scholar of Upper Egypt, takes the helm. His sermons stir the multitudes in the mosques, and his authority is rooted in learning as much as in force. The emirate becomes a theocracy of the pulpit, in which the voice of the old sheikh is the voice of the state."
 COLDWAR_EGY_ij_the_global_jihad:0 "The Global Front"
 COLDWAR_EGY_ij_the_global_jihad_desc:0 "Ayman al-Zawahiri and his comrades turn the movement outward, building networks of cells and sympathisers from Sudan to Afghanistan and Yemen. Egypt becomes the base of a worldwide jihad against the West and its clients. The emirate no longer has frontiers, only fronts."
 COLDWAR_EGY_wc_council_schools:0 "Council Schools"
 COLDWAR_EGY_wc_council_schools_desc:0 "Teaching is taken out of the hands of the ministry and entrusted to the councils. Evening classes in the factories teach reading and arithmetic alongside the history of labour, and village schools are run by committees of parents and teachers. The councils believe that education must belong to the people if it is to set them free."
 COLDWAR_EGY_wc_the_congress_of_councils:0 "The Congress of Councils"
 COLDWAR_EGY_wc_the_congress_of_councils_desc:0 "Delegates from every council in the republic assemble in a great congress. Weeks of argument follow in smoky halls, as the revolution tries to settle its own constitution. The question before them is whether the new order will be one of permanent debate and open ballots or of firm direction in the face of enemies."
 COLDWAR_EGY_wc_council_democracy:0 "Council Democracy"
 COLDWAR_EGY_wc_council_democracy_desc:0 "The congress votes to keep power in the hands of ordinary delegates, subject to recall and open debate. Elections are held in every council and decisions are argued out in the assemblies. The process is slow, noisy and sometimes chaotic, but the people feel that the revolution belongs to them and not to a handful of leaders."
 COLDWAR_EGY_wc_the_revolutionary_committee:0 "The Revolutionary Committee"
 COLDWAR_EGY_wc_the_revolutionary_committee_desc:0 "Faced with enemies at home and abroad, the congress hands extraordinary authority to a small committee of trusted revolutionaries. The assemblies continue to meet, but it is the committee that decides. Its members insist that the arrangement is temporary, as every revolutionary government always has."
 COLDWAR_EGY_ye_the_youth_army:0 "The Youth Army"
 COLDWAR_EGY_ye_the_youth_army_desc:0 "Boys barely out of school are formed into battalions under the green banner, trained by veterans who still remember the previous war. They are loud, enthusiastic and eager, and the regular officers watch with a mixture of fascination and misgiving. Their passion is plain, and their discipline is yet to be proved."
 COLDWAR_EGY_ye_the_leaders_succession:0 "The Movement's Succession"
 COLDWAR_EGY_ye_the_leaders_succession_desc:0 "The founder is ageing and the movement must face what comes next. Rival lieutenants court the youth, the officers and the old guard, each insisting that they alone carry the true flame. Behind the cheering crowds, the question of succession quietly decides everything."
 COLDWAR_EGY_ye_a_movement_state:0 "A Movement State"
 COLDWAR_EGY_ye_a_movement_state_desc:0 "The movement and the state become one. Party cells appear in every ministry, every factory and every classroom, and loyalty to the cause is the surest path to promotion. The leaders speak of national unity, and dissenters learn that there is no room for opposition within a revolution."
 COLDWAR_EGY_ye_a_national_republic:0 "A National Republic"
 COLDWAR_EGY_ye_a_national_republic_desc:0 "The movement chooses to give its nationalism a constitutional form. A republic is declared with elected institutions, a national assembly and a president who answers to the voters. The old militants are uneasy at the compromise, but the public welcomes a state that appears to belong to everyone."
 COLDWAR_EGY_misr_the_officers_of_order:0 "The Officers of Order"
 COLDWAR_EGY_misr_the_officers_of_order_desc:0 "The Party of Order has no wish to quarrel with the army. The officer corps is courted with promotions, better pay and a place at the table, with the clear understanding that the army's loyalty belongs to the state that rewards it. The generals, once a source of anxiety, become pillars of the system."
 COLDWAR_EGY_misr_modernise_the_army:0 "Modernise the Army"
 COLDWAR_EGY_misr_modernise_the_army_desc:0 "After years of defeat and improvisation, the officers are given the means to professionalise. Modern armour is procured, training schools are reformed and doctrine is rewritten for the lessons of the recent wars. The army that emerges is leaner, better equipped and trusted by the government to defend the nation without meddling in its politics."
 COLDWAR_EGY_misr_the_continuity_question:0 "The Continuity Question"
 COLDWAR_EGY_misr_the_continuity_question_desc:0 "The party has built a system, but a system needs someone to run it. As the cabinet's founders age, the question of succession can no longer be postponed. The party and the security services each have their candidate, and the future shape of the Order State will depend on who is chosen."
 COLDWAR_EGY_misr_a_party_successor:0 "A Party Successor"
 COLDWAR_EGY_misr_a_party_successor_desc:0 "The mantle passes to a career politician, a product of the party's own committees and congresses. He is a master of consensus, not a man of the barracks, and he promises to rule by the party's procedures. The institution outlasts the individual, and the Order State acquires a respectable constitutional face."
 COLDWAR_EGY_misr_a_security_successor:0 "A Security Successor"
 COLDWAR_EGY_misr_a_security_successor_desc:0 "The torch passes to a man from the security apparatus, a veteran of the ministries and the files who knows where every thread leads. He rules without fanfare, trusting the services to guard the order that the party has built. Egyptians sense a change in the atmosphere, quieter and more watchful than before."
 COLDWAR_EGY_fe_a_lean_army:0 "A Lean Army"
 COLDWAR_EGY_fe_a_lean_army_desc:0 "The movement holds that a nation of traders has no need for an army that swallows a vast share of the national income. Redundant formations are disbanded, the ranks are trimmed and the officer corps is put on notice that its privileges are no longer sacrosanct. The generals grumble, but Israel's guns remain far away from the trading floors."
 COLDWAR_EGY_fe_private_contractors_for_defence:0 "Private Defence Contractors"
 COLDWAR_EGY_fe_private_contractors_for_defence_desc:0 "Instead of running its own arms factories, Egypt turns to private firms and foreign suppliers to equip its forces. Western defence companies open offices in Cairo and tender for contracts that once belonged to state enterprises. The army is told to buy what it needs on the market, as any business would."
 COLDWAR_EGY_fe_free_trade_with_everyone:0 "Free Trade with Everyone"
 COLDWAR_EGY_fe_free_trade_with_everyone_desc:0 "Egypt abandons the politics of blocs and sells to anyone with the means to buy. Delegations from Washington, Bonn, Tokyo and even Moscow find Cairo eager to sign. For the movement, commerce is the best foreign policy, and a country that trades with all can quarrel with none."
 COLDWAR_EGY_lib_a_smaller_army:0 "A Smaller, Better Army"
 COLDWAR_EGY_lib_a_smaller_army_desc:0 "The cabinet argues that a nation at peace with the market has no need of an enormous standing army. The size of the forces is reduced and funds are directed to training and organisation. The officers resent the cuts, but the finance ministry notes with approval that the army now costs far less."
 COLDWAR_EGY_lib_western_equipment:0 "Western Equipment"
 COLDWAR_EGY_lib_western_equipment_desc:0 "Out go the ageing Soviet tanks and aircraft, and in come modern weapons from the West. The army's technicians must learn new systems, and the purchases are costly. But the generals admit that Western equipment is the equal of any arrayed against them, and the government wins friends abroad."
 COLDWAR_EGY_lib_the_liberal_succession:0 "The Liberal Succession"
 COLDWAR_EGY_lib_the_liberal_succession_desc:0 "The liberal programme has been delivered, and the government must now decide how to carry it forward. Should the party seek partners to share the burden of power, or trust its own majority? The coming choice will determine whether liberalism in Egypt is a consensus or a creed."
 COLDWAR_EGY_lib_a_grand_coalition:0 "A Grand Coalition"
 COLDWAR_EGY_lib_a_grand_coalition_desc:0 "The liberals reach out to the New Wafd, and the two parties govern together in the name of constitutional rule and a free economy. The coalition brings stability and a broad base of support, though it also demands compromise on matters the liberals might prefer to settle themselves."
 COLDWAR_EGY_lib_govern_alone:0 "Govern Alone"
 COLDWAR_EGY_lib_govern_alone_desc:0 "The liberals decline to share power, trusting in their own majority and their own vision. Decisions are made swiftly and the programme is carried forward without dilution. Critics warn that a government accountable to no partner may find itself accountable to no one."
 COLDWAR_EGY_slp_a_peoples_army:0 "A Citizens' Army"
 COLDWAR_EGY_slp_a_peoples_army_desc:0 "The armed forces are recast as an army of citizens, in which service is a duty of every man and promotion rests on merit. Officers are taught that their loyalty lies with the people and the constitution. The government hopes to build a force that defends the republic rather than rules it."
 COLDWAR_EGY_slp_veterans_of_october:0 "The Veterans of October"
 COLDWAR_EGY_slp_veterans_of_october_desc:0 "The men who crossed the canal and fought in Sinai are honoured with pensions, medals and a place in public life. The government pays tribute to their sacrifice, and the veterans in turn become a pillar of support. The memory of the fighting is cherished as the foundation of national pride."
 COLDWAR_EGY_slp_the_labour_succession:0 "The Labour Succession"
 COLDWAR_EGY_slp_the_labour_succession_desc:0 "The founding generation of labour leaders is ageing, and the party must settle the course it will follow. Should it remain the organ of the factory floor, or become a broader movement of all Egyptians who work for a living? The decision shapes its future."
 COLDWAR_EGY_slp_a_workers_party:0 "A Workers' Party"
 COLDWAR_EGY_slp_a_workers_party_desc:0 "The party sharpens its focus on the industrial workers, strengthening its ties with the trade unions and the factory committees. The movement becomes disciplined and class-conscious, and the unions have a government that is truly theirs. The middle classes look on with suspicion."
 COLDWAR_EGY_slp_a_peoples_party:0 "A People's Party"
 COLDWAR_EGY_slp_a_peoples_party_desc:0 "The party opens its doors to clerks, teachers, farmers and shopkeepers, and presents itself as the voice of the whole people. Its message is broad and its appeal wide. The unions sometimes grumble that the workers are lost in the crowd, but the ballot boxes fill."
 COLDWAR_EGY_mon_the_royal_army:0 "The Royal Army"
 COLDWAR_EGY_mon_the_royal_army_desc:0 "The army is given a royal character, with new colours, new regimental names and honorary colonels from the court. Officers who had assumed that the monarchy would fear them discover that it intends to rely on them. Their loyalty is bought with pride and with tanks."
 COLDWAR_EGY_mon_the_crown_prince:0 "The Crown Prince's Education"
 COLDWAR_EGY_mon_the_crown_prince_desc:0 "The question of who will carry the crown into the next generation turns to the education of the heir. Tutors, officers and clerics compete to shape the young prince, and the palace argues about whether he should be groomed for ceremony or for command. In a monarchy, the nursery is also a political arena."
 COLDWAR_EGY_mon_a_regency_council:0 "A Regency Council"
 COLDWAR_EGY_mon_a_regency_council_desc:0 "The king agrees to share his authority with a council of trusted advisers. The ministers, the generals and the elder statesmen of the court will govern in his name until the heir is ready. The arrangement is dignified and steady, and spares the crown from risking everything on one man."
 COLDWAR_EGY_mon_the_king_rules:0 "The King Rules"
 COLDWAR_EGY_mon_the_king_rules_desc:0 "The king takes the reins of government himself. Ministers become servants of the crown, and there is no intermediary between the throne and the people. Supporters hail a strong monarch for hard times, while the old parliamentarians recall the lessons of the previous reign with a shudder."
 COLDWAR_EGY_wafd_a_national_army:0 "A National Army"
 COLDWAR_EGY_wafd_a_national_army_desc:0 "The army is placed under civilian authority and trained as a professional national force, free from the intrigues of the officer corps. Barracks politics are discouraged and merit is rewarded. The generals accept the new order with reserve, aware that the Wafd has ended the age of the soldier-president."
 COLDWAR_EGY_wafd_the_wafd_succession:0 "After Serageddin"
 COLDWAR_EGY_wafd_the_wafd_succession_desc:0 "Serageddin is old, and the party knows that the time must come when a new leader must take his place. The Wafd has little tradition of handing on power gracefully. The choice of successor will reveal whether the party is a movement of ideas or merely the following of one man."
 COLDWAR_EGY_wafd_a_young_leader:0 "A Young Leader"
 COLDWAR_EGY_wafd_a_young_leader_desc:0 "The party turns to a younger man, a lawyer or economist untouched by the quarrels of the past. His speeches speak of the future rather than the glories of 1919, and the new generation of voters responds. The old pashas bow their heads, persuaded that the party has chosen to survive."
 COLDWAR_EGY_wafd_the_pashas_heir:0 "The Pasha's Heir"
 COLDWAR_EGY_wafd_the_pashas_heir_desc:0 "Leadership passes to a scion of the great landed families, a man whose name is known in every village of the Delta. He carries the prestige of the old Wafd and the loyalty of its notables. He is a guardian of the party's heritage, though reform may have to wait."
 COLDWAR_EGY_arm_the_air_defence_first:0 "Air Defence First"
 COLDWAR_EGY_arm_the_air_defence_first_desc:0 "The lesson of the War of Attrition is plain, that the Israeli air force rules the sky unless it is made to pay dearly. Missile batteries rise in dense belts along the canal and in the Delta, manned day and night by crews trained with Soviet advisers. The generals are certain that whoever controls the sky controls the crossing."
 COLDWAR_EGY_arm_the_armoured_fist:0 "The Armoured Fist"
 COLDWAR_EGY_arm_the_armoured_fist_desc:0 "Tank crews drill in the desert west of Cairo until the rhythm of manoeuvre becomes second nature. Fresh deliveries of armour are concentrated into formations that can strike with weight and speed once the missile umbrella is spread. The junta wants a fist that is able to hit hard when the moment comes."
 COLDWAR_EGY_arm_conscription_reform:0 "Conscription Reform"
 COLDWAR_EGY_arm_conscription_reform_desc:0 "Service obligations are rewritten so that more men are trained for longer, and exemptions once bought by the well-connected are narrowed. Fathers in the villages complain of lost labour in the fields, but the army insists that a nation which wishes to recover Sinai must be willing to train its sons."
 COLDWAR_EGY_arm_the_republican_guard_of_the_junta:0 "The Junta's Republican Guard"
 COLDWAR_EGY_arm_the_republican_guard_of_the_junta_desc:0 "A trusted corps of picked officers and men is raised to guard the council, the ministries and the broadcasting house. Its soldiers are paid well, fed well and watched closely. The generals no longer fear a coup from the street, only one from within the army itself, and this force is the answer."
 COLDWAR_EGY_arm_an_army_newspaper:0 "Al-Quwwat al-Musallaha"
 COLDWAR_EGY_arm_an_army_newspaper_desc:0 "The armed forces journal, once a dry bulletin for the barracks, becomes the voice of the government. Its columns praise the discipline of the soldier, the duty of the citizen and the wisdom of the council. Editors in the civilian press learn to read its tone, and to echo it."
 COLDWAR_EGY_ndp_the_central_security_forces:0 "The Central Security Forces"
 COLDWAR_EGY_ndp_the_central_security_forces_desc:0 "A large force of conscript policemen is raised to guard government buildings, quell demonstrations and watch the streets. They are drawn from the poorest villages and housed in cramped barracks. The state gains a loyal truncheon, but this instrument of order depends on men who have little reason to love it."
 COLDWAR_EGY_ndp_pay_the_conscripts:0 "Pay the Conscripts"
 COLDWAR_EGY_ndp_pay_the_conscripts_desc:0 "Recognising that the men of the security forces are the foundation of the regime's security, the ministry raises their wages and improves their housing. The conscripts remain loyal, and the interior ministry gains a reputation for looking after its own. The treasury grumbles, but the streets stay calm."
 COLDWAR_EGY_ndp_cheap_order:0 "Order on the Cheap"
 COLDWAR_EGY_ndp_cheap_order_desc:0 "The security conscripts are kept on a meagre wage and a poor diet, and the ministry puts its trust in discipline over generosity. The savings are welcome, but resentment festers in the barracks. Officers warn that men who are hungry and humiliated may one day turn their weapons on those who command them."
 COLDWAR_EGY_ndp_the_suez_canal_expansion:0 "The Suez Canal Expansion"
 COLDWAR_EGY_ndp_the_suez_canal_expansion_desc:0 "The canal, silent and blocked for years, is reopened and widened for the largest ships of a new age. Dredgers work day and night, and engineers plan for a waterway that will carry the commerce of three continents. Egypt's gateway between East and West becomes once more the pride of the nation and its richest asset."
 COLDWAR_EGY_ndp_the_cairo_international_fair:0 "The Cairo International Fair"
 COLDWAR_EGY_ndp_the_cairo_international_fair_desc:0 "The fairgrounds of Nasr City fill with exhibitors from across the Mediterranean, the Gulf and beyond. Merchants haggle over textiles, machinery and cotton, while diplomats and ministers hold quiet talks over coffee. For the government, the fair is a shop window displaying an Egypt open for business."
 COLDWAR_EGY_the_war_of_attrition:0 "The War of Attrition"
 COLDWAR_EGY_the_war_of_attrition_desc:0 "Since 1968 the guns along the Suez Canal have never been fully silent. Artillery duels, air raids and commando strikes bleed both sides while the Bar-Lev Line stands defiantly on the far bank. Nasser calls it a war of attrition, convinced that Egypt's greater numbers and patience will eventually wear Israel down."
 COLDWAR_EGY_the_missile_wall:0 "The Missile Wall"
 COLDWAR_EGY_the_missile_wall_desc:0 "As Israeli aircraft strike deep into the Nile Valley, the answer is a belt of surface-to-air missile batteries, rolled forward towards the Canal with Soviet crews and Egyptian sweat. Under their umbrella, the army can at last work without fear from the sky. It is the shield that makes any future crossing possible."
 COLDWAR_EGY_commandos_across_the_canal:0 "Commandos across the Canal"
 COLDWAR_EGY_commandos_across_the_canal_desc:0 "Small parties of Egyptian commandos slip across the Canal at night to ambush patrols, mine roads and strike at the outposts of the Bar-Lev Line. The raids achieve little in terms of ground, but they restore the confidence of an army that has known only retreat. Each returning boat is a small victory over the memory of 1967."
 COLDWAR_EGY_the_rogers_plan:0 "The Rogers Plan"
 COLDWAR_EGY_the_rogers_plan_desc:0 "Washington's Secretary of State proposes a ceasefire along the Canal, and a framework for talks under Ambassador Jarring. The offer is fraught with risk, for it offers a pause while Israel remains in Sinai. Egypt must weigh the relief of the cities against the dangers of letting the moment pass."
 COLDWAR_EGY_accept_the_ceasefire:0 "Accept the Ceasefire"
 COLDWAR_EGY_accept_the_ceasefire_desc:0 "Egypt accepts the proposal and the guns fall silent along the Canal. The cities of Suez and Ismailia breathe at last, and the missile batteries creep forward under the cover of calm. Hardliners call it surrender, but the president insists it is a pause for breath, not an end to the struggle."
 COLDWAR_EGY_no_peace_without_sinai:0 "No Peace Without Sinai"
 COLDWAR_EGY_no_peace_without_sinai_desc:0 "There will be no ceasefire, no negotiation and no recognition while Israeli soldiers stand on Egyptian soil. The Rogers Plan is rejected as a trap that would freeze the occupation, and the war of attrition continues. Cairo has made its choice, and the cost will be paid by its soldiers."
 COLDWAR_EGY_operation_granite_plan:0 "Plan Granite"
 COLDWAR_EGY_operation_granite_plan_desc:0 "In the offices of the General Staff, planners draw up Granite, a full-scale scheme to cross the Canal, storm the Bar-Lev Line and penetrate deep into Sinai. Ambitious and detailed, it is a plan of the kind that Egypt could not yet carry out. The work, however, builds a habit of thinking that will serve it well."
 COLDWAR_EGY_the_high_minarets:0 "The High Minarets"
 COLDWAR_EGY_the_high_minarets_desc:0 "Chief of Staff Saad el-Shazly argues that Egypt should not outreach its means. A more limited plan, called the High Minarets, would cross the Canal and seize a narrow strip on the far side, remaining under the protection of the missile umbrella. It is a prudent strategy of an army that has learned humility the hard way."
 COLDWAR_EGY_water_cannons_against_sand:0 "Water Cannons against Sand"
 COLDWAR_EGY_water_cannons_against_sand_desc:0 "The great sand rampart of the Bar-Lev Line seems to defy the engineers, until a young officer suggests that high-pressure water pumps could wash it away. The idea is tested on sandbanks along the Nile, and the results are startling. A problem measured in days of labour is solved in hours."
 COLDWAR_EGY_the_great_deception:0 "The Great Deception"
 COLDWAR_EGY_the_great_deception_desc:0 "Year after year the army stages exercises at the Canal, each of which ends in a stand-down. Israeli intelligence grows accustomed to the pattern, and the reports from the front begin to say that nothing is happening. By the time a real attack comes, nobody believes in it."
 COLDWAR_EGY_operation_badr:0 "Operation Badr"
 COLDWAR_EGY_operation_badr_desc:0 "The plans are complete, the units are in place and the men are trained to the last detail. Operation Badr, named for the Prophet's first great victory, awaits only the order. When it comes, it will be the culmination of six years of preparation and a lifetime of humiliation."
 COLDWAR_EGY_the_crossing:0 "Al-Ubur: The Crossing"
 COLDWAR_EGY_the_crossing_desc:0 "On a clear afternoon the Egyptian army surges across the Canal, bursting the Bar-Lev Line and raising the flag on the eastern bank. The shock to Israel is profound, and the pride of Egypt is restored. The defeat of 1967, which weighed upon a generation, is lifted at last."
 COLDWAR_EGY_coordinate_the_oil_weapon:0 "Coordinate the Oil Weapon"
 COLDWAR_EGY_coordinate_the_oil_weapon_desc:0 "Egypt cannot compel the oil producers to act, but it can ask. Envoys travel to Riyadh, Tripoli, Baghdad and Kuwait to urge them to use their wealth as a weapon against the states that arm Israel. The decision is theirs alone, and Cairo awaits their answer."
 COLDWAR_EGY_kilometre_101:0 "Kilometre 101"
 COLDWAR_EGY_kilometre_101_desc:0 "At a tent beside the Cairo-Suez road, Egyptian and Israeli officers meet to discuss the exchange of prisoners and the future of the front. It is the first face-to-face encounter between the two armies, and the beginning of a more serious dialogue. The road to disengagement starts at Kilometre 101."
 COLDWAR_EGY_the_sinai_agreement:0 "The Sinai Agreement"
 COLDWAR_EGY_the_sinai_agreement_desc:0 "After years of tense negotiation, Cairo and Jerusalem are asked to agree on the phased return of Sinai, in exchange for demilitarised zones and international monitors. The terms are bitter to some and generous to others, but they promise the return of every grain of Egyptian sand. Peace is no longer an abstraction."
 COLDWAR_EGY_reopen_the_suez_canal:0 "Reopen the Suez Canal"
 COLDWAR_EGY_reopen_the_suez_canal_desc:0 "Eight years of silence end when engineers and naval divers clear the wrecks and mines that choke the waterway. Ships once again pass between the Mediterranean and the Red Sea, and the revenues of the Canal return to the Egyptian treasury. The great artery of world trade flows once more through the heart of Egypt."
 COLDWAR_EGY_rebuild_the_canal_cities:0 "Rebuild the Canal Cities"
 COLDWAR_EGY_rebuild_the_canal_cities_desc:0 "Suez, Ismailia and Port Said, evacuated and shelled for years, are left in ruins. Now their inhabitants return to rebuild their homes, their harbours and their workshops. The new cities rise from the rubble with great hope, and a certain pride in having survived."
 COLDWAR_EGY_honour_regained:0 "Honour Regained"
 COLDWAR_EGY_honour_regained_desc:0 "The sixth of October becomes a national holiday, a day on which Egyptians remember the crossing and the soldiers who made it possible. The shame of the Naksa has been erased, not by the extent of victory but by the proof of courage. The army, and the nation, can hold their heads high again."
 COLDWAR_EGY_leader_of_the_arab_world:0 "Leader of the Arab World"
 COLDWAR_EGY_leader_of_the_arab_world_desc:0 "Cairo has always seen itself as the natural capital of the Arab world, and Nasser as its leader. Even after the defeat, its schools, its broadcasts and its diplomats continue to shape the Arab debate. The mantle of leadership is heavy, but Egypt is not ready to lay it down."
 COLDWAR_EGY_mediate_black_september:0 "Mediate Black September"
 COLDWAR_EGY_mediate_black_september_desc:0 "In the autumn of 1970, Jordan's army and the Palestinian fedayeen are locked in a bloody struggle. Nasser, exhausted but still the only figure trusted by both sides, convenes an emergency summit in Cairo. His last act of statesmanship is to bring King Hussein and Yasser Arafat to the same table."
 COLDWAR_EGY_the_khartoum_subsidies:0 "The Khartoum Subsidies"
 COLDWAR_EGY_the_khartoum_subsidies_desc:0 "At Khartoum in 1967, the oil-rich monarchies pledged annual aid to the Arab states that bore the brunt of the war. The money is vital to an economy strained by military spending and the loss of Canal revenue. Egypt keeps its patrons reassured that their generosity serves the common cause."
 COLDWAR_EGY_the_tripoli_charter:0 "The Tripoli Charter"
 COLDWAR_EGY_the_tripoli_charter_desc:0 "Colonel Gaddafi, young, zealous and admiring of Nasser, offers Libya's wealth and his own devotion to the cause of Arab unity. Together with Sudan's new rulers, Egypt signs a charter of cooperation at Tripoli. It is a bold gesture towards a union that many have dreamed of and none have achieved."
 COLDWAR_EGY_federation_of_arab_republics:0 "The Federation of Arab Republics"
 COLDWAR_EGY_federation_of_arab_republics_desc:0 "Egypt, Libya and Syria announce the formation of a Federation of Arab Republics, with a shared presidential council and common aspirations. The ceremony is grand, the speeches are long and the declarations are heartfelt. Whether the federation will be more than a name remains to be seen."
 COLDWAR_EGY_full_union_with_libya:0 "Full Union with Libya"
 COLDWAR_EGY_full_union_with_libya_desc:0 "Gaddafi insists that unity must be real, not merely symbolic, and calls for a full merger of Egypt and Libya. Marches of Libyan supporters head towards Cairo, and the oil wealth of the desert is dangled before the Nile. The proposal tempts some in Egypt and alarms many others."
 COLDWAR_EGY_a_loose_federation:0 "Keep the Federation Loose"
 COLDWAR_EGY_a_loose_federation_desc:0 "Egypt prefers a loose association of sovereign states, with limited powers and few obligations. The enthusiasm of Tripoli cools, and the fervour of the unionists is disappointed. For Cairo, prudence is the better part of brotherhood."
 COLDWAR_EGY_unity_of_the_nile_valley:0 "Brothers on the Nile"
 COLDWAR_EGY_unity_of_the_nile_valley_desc:0 "Egypt and Sudan are bound together by the river, by history and by blood. Talk of a joint economic union, with common markets, shared agricultural projects and the integration of the Nile valley, revives an old dream. The brothers of the Nile look to a future in which Khartoum and Cairo face the world as one."
 COLDWAR_EGY_the_uar_reborn:0 "The United Arab Republic Reborn"
 COLDWAR_EGY_the_uar_reborn_desc:0 "The dream of 1958 is born anew. Egypt, Syria and their partners proclaim the rebirth of the United Arab Republic, a union forged by the experience of failure rather than naive enthusiasm. A flag with three stars rises again, and the Arab world watches with hope and apprehension."
 COLDWAR_EGY_host_the_plo:0 "Host the PLO"
 COLDWAR_EGY_host_the_plo_desc:0 "Cairo offers a home to the Palestine Liberation Organisation, with offices, broadcasts and recognition as the sole legitimate representative of the Palestinian people. Arafat's fighters find a patron who shares their cause, if not always their methods. Israel notes the welcome and draws its own conclusions."
 COLDWAR_EGY_the_arab_league_in_cairo:0 "The Arab League in Cairo"
 COLDWAR_EGY_the_arab_league_in_cairo_desc:0 "The Arab League, whose headquarters have long been in Cairo, becomes an instrument of Egyptian diplomacy. Summits, committees and resolutions are shaped in the corridors of Tahrir. The Arab world speaks, as it often does, with a Cairene accent."
 COLDWAR_EGY_arab_industrialisation_organisation:0 "The Arab Organisation for Industrialisation"
 COLDWAR_EGY_arab_industrialisation_organisation_desc:0 "Egyptian engineering, Saudi and Emirati money and Western technology are joined in a great enterprise to build an independent Arab arms industry. Factories rise near Cairo to produce missiles, aircraft and vehicles, freeing the Arab world from the whims of foreign suppliers. The project is costly, but the prize is independence."
 COLDWAR_EGY_workers_to_the_gulf:0 "Workers to the Gulf"
 COLDWAR_EGY_workers_to_the_gulf_desc:0 "Teachers, doctors, clerks and construction workers leave the overcrowded Nile valley to seek their fortunes in the Gulf. The remittances they send home feed families, support the currency and ease unemployment. The country gains money, though it loses many of its best-trained sons."
 COLDWAR_EGY_between_moscow_and_washington:0 "Between Moscow and Washington"
 COLDWAR_EGY_between_moscow_and_washington_desc:0 "Egypt stands between two giants, dependent on one for weapons and courted by the other for peace. Every decision, from the purchase of a rifle to the drafting of a communique, is weighed against the reaction in two capitals. Cairo's diplomats must walk a narrow path between them."
 COLDWAR_EGY_operation_kavkaz:0 "Operation Kavkaz"
 COLDWAR_EGY_operation_kavkaz_desc:0 "As Israeli deep-penetration raids humiliate Egyptian air defences, Nasser flies secretly to Moscow to beg for more help. The Kremlin responds by sending Soviet missile crews and fighter pilots, a deployment of astonishing scale and secrecy. For a time, Russians guard the skies above the Nile."
 COLDWAR_EGY_the_moscow_anchor:0 "The Moscow Anchor"
 COLDWAR_EGY_the_moscow_anchor_desc:0 "Egypt anchors its security to Moscow, accepting advisers, missiles and tanks in exchange for political loyalty. The dependence is considerable, but the arsenals of the Soviet Union are formidable and its support has never wavered. The Kremlin's friendship is a refuge as well as a leash."
 COLDWAR_EGY_the_washington_channel:0 "The Washington Channel"
 COLDWAR_EGY_the_washington_channel_desc:0 "A secret line opens between Cairo and Washington, carrying messages from Hafez Ismail to Henry Kissinger. The two sides test each other's intentions and explore the possibilities of peace. Moscow, naturally, would not be pleased."
 COLDWAR_EGY_positive_neutrality:0 "Positive Neutrality"
 COLDWAR_EGY_positive_neutrality_desc:0 "Egypt declines to be the property of either power. It accepts the wheat and the weapons of both blocs while committing itself to neither, and presents itself as the champion of independent states everywhere. The balance is delicate, and a stumble might cost dearly."
 COLDWAR_EGY_treaty_of_friendship:0 "Treaty of Friendship and Cooperation"
 COLDWAR_EGY_treaty_of_friendship_desc:0 "In May 1971 Egypt and the Soviet Union sign a treaty of friendship and cooperation, binding the two states in a formal alliance. Moscow promises continued support in the face of Israeli aggression, and Cairo pledges its steadfastness to the common cause. For a decade, it will be the cornerstone of the Egyptian military posture."
 COLDWAR_EGY_scuds_and_sam_6:0 "SCUDs and SAM-6s"
 COLDWAR_EGY_scuds_and_sam_6_desc:0 "With the treaty signed, Soviet industry opens its arsenal. Mobile SAM-6 batteries with their radars, SCUD missiles with their promise of long reach and the technical missions that accompany them appear along the Nile. Egyptian crews learn their craft with unusual speed."
 COLDWAR_EGY_join_the_soviet_bloc:0 "Join the Soviet Bloc"
 COLDWAR_EGY_join_the_soviet_bloc_desc:0 "Egypt takes its place within the Soviet sphere, with all that it implies. Its armies, its industries and its diplomacy are tied to the Eastern bloc. The Kremlin welcomes a new ally, the largest in the Arab world."
 COLDWAR_EGY_expel_the_soviet_advisers:0 "Expel the Soviet Advisers"
 COLDWAR_EGY_expel_the_soviet_advisers_desc:0 "In July 1972 the Soviet advisers are given a week to leave. Sadat reasons that Moscow offers too little and demands too much, and that Egypt cannot negotiate with Washington while Russian experts fill its barracks. The protection of the missile umbrella vanishes with them, which is a bold gamble."
 COLDWAR_EGY_kissingers_shuttle:0 "Kissinger's Shuttle"
 COLDWAR_EGY_kissingers_shuttle_desc:0 "The American Secretary of State shuttles tirelessly between Cairo, Jerusalem and Damascus, carrying proposals, assurances and warnings. Each journey brings the parties a little closer. Egyptian diplomats, once strangers to Washington, find themselves leading the conversation."
 COLDWAR_EGY_join_the_western_bloc:0 "Join the Western Bloc"
 COLDWAR_EGY_join_the_western_bloc_desc:0 "Egypt completes its reorientation by joining the Western camp. Its former reliance on Moscow is replaced by cooperation with Washington and its allies. The change is sweeping, and few of the old comrades are left to mourn it."
 COLDWAR_EGY_mig_engines_from_beijing:0 "MiG Engines from Beijing"
 COLDWAR_EGY_mig_engines_from_beijing_desc:0 "With the Soviet Union estranged, the Egyptian air force faces a shortage of engines for its MiG fighters. China, which has its own quarrel with Moscow, offers replacement parts without any political demands. It is a modest but timely friendship."
 COLDWAR_EGY_mirages_from_paris:0 "Mirages from Paris"
 COLDWAR_EGY_mirages_from_paris_desc:0 "France, the one Western power that has not forgotten its older ties to the Arab world, is willing to sell fighters and electronics where others will not. Egyptian pilots look at the Mirage with interest. De Gaulle's heirs find in Cairo a customer with deep pockets."
 COLDWAR_EGY_pivot_of_the_cold_war:0 "Pivot of the Cold War"
 COLDWAR_EGY_pivot_of_the_cold_war_desc:0 "In the cold war's long contest for the Middle East, no state counts for more than Egypt. Its choice of ally has changed the balance of the region, and both camps know it. Whoever holds the Nile holds the key to the East."
 COLDWAR_EGY_the_economy_of_the_front:0 "The Economy of the Front"
 COLDWAR_EGY_the_economy_of_the_front_desc:0 "Since 1967 Egypt has lived on a war footing. The canal is closed, tourism has dried up and a large part of the national income goes to the army. Ministers speak of the economy of the front, in which every factory, field and workshop is judged by its contribution to the eventual reckoning with Israel."
 COLDWAR_EGY_austerity_for_the_front:0 "Austerity for the Front"
 COLDWAR_EGY_austerity_for_the_front_desc:0 "Egyptians are asked to tighten their belts. Imports of luxuries are curbed, bread and tea remain, and radio announcers urge patience until the day of liberation. Housewives queue and shopkeepers grumble, but most accept that a nation at war cannot expect comfort."
 COLDWAR_EGY_which_way_for_the_economy:0 "Which Way for the Economy?"
 COLDWAR_EGY_which_way_for_the_economy_desc:0 "The post-Naksa economy is at a crossroads. Years of state planning have built factories and schools but also queues and bureaucracy. Some voices demand a deeper commitment to Arab socialism, others call for opening the doors to foreign capital, and still others for an economy built on Islamic principles. The choice will define the Egypt of the coming decade."
 COLDWAR_EGY_deepen_arab_socialism:0 "Deepen Arab Socialism"
 COLDWAR_EGY_deepen_arab_socialism_desc:0 "The state remains the engine of development. Factories, banks and great estates stay in public hands, and the unions are promised a larger voice. The philosophy of Nasser is not abandoned but extended, with the conviction that Egypt's workers and fellahin will win their prosperity through planning rather than the market."
 COLDWAR_EGY_infitah:0 "Infitah: The Open Door"
 COLDWAR_EGY_infitah_desc:0 "Egypt throws open its doors. Foreign investors, Gulf financiers and importers are welcomed, and the state steps back from the markets it once commanded. New hotels and shopping arcades appear in Cairo, a few fortunes are made quickly, and workers and clerks wonder who will pay for the prosperity."
 COLDWAR_EGY_the_islamic_economy:0 "The Islamic Economy"
 COLDWAR_EGY_the_islamic_economy_desc:0 "Economic life is to be ordered according to the principles of the faith. Interest is condemned, charity is organised and trade is conducted in accordance with the law of Islam. The scholars of al-Azhar bless the project, and the economists of the ministries labour to translate old principles into modern accounts."
 COLDWAR_EGY_public_sector_holdings:0 "Public Sector Holding Companies"
 COLDWAR_EGY_public_sector_holdings_desc:0 "The state's factories, mills and trading firms are grouped into great holding companies under the guidance of the planners. Directors answer to ministers and ministers to the Presidency. The public sector is large, proud and not always efficient, but it is the foundation of the socialist order."
 COLDWAR_EGY_ration_cards_and_price_controls:0 "Ration Cards and Price Controls"
 COLDWAR_EGY_ration_cards_and_price_controls_desc:0 "Every family receives a ration card entitling it to rice, sugar, oil and bread at fixed prices. Inspectors patrol the markets to enforce the ceilings. It is a cumbersome system, but it guarantees that the poor will not starve, and it binds the people to the state that feeds them."
 COLDWAR_EGY_soviet_credit_lines:0 "Soviet Credit Lines"
 COLDWAR_EGY_soviet_credit_lines_desc:0 "Moscow extends long-term credit for machinery, weapons and development projects, to be repaid in cotton, rice and a share of Egyptian output. The arrangement keeps the economy afloat but ties it ever more closely to the Soviet Union. Egyptian officials visit Moscow's ministries as supplicants and as partners."
 COLDWAR_EGY_free_zones:0 "Free Zones in Port Said and Suez"
 COLDWAR_EGY_free_zones_desc:0 "At Port Said and Suez, customs barriers are lowered and foreign firms are invited to set up warehouses, assembly plants and banks. Cranes, container yards and bonded storage promise to turn the damaged canal cities into trading hubs. Local people hope for work, and nationalists fear for sovereignty."
 COLDWAR_EGY_the_gulf_investment_wave:0 "The Gulf Investment Wave"
 COLDWAR_EGY_the_gulf_investment_wave_desc:0 "Delegations from Kuwait, Riyadh and the Emirates arrive in Cairo with large sums and large ambitions. They are offered contracts for housing, agriculture and tourism, and they are treated as honoured guests. For the first time, the oil wealth of the Gulf flows west to the Nile."
 COLDWAR_EGY_cut_the_subsidies:0 "Cut the Subsidies"
 COLDWAR_EGY_cut_the_subsidies_desc:0 "The government reduces the subsidies on bread, fuel and basic goods, arguing that the treasury can no longer carry them. Economists applaud, but the poorest quarters of Cairo and Alexandria are filled with anger. The reform is necessary, and nobody can say whether the people will accept it quietly."
 COLDWAR_EGY_islamic_banks_and_sukuk:0 "Islamic Banks"
 COLDWAR_EGY_islamic_banks_and_sukuk_desc:0 "The first Islamic banks open their doors in Cairo, offering profit-sharing accounts and trade finance without interest. Pious savers, who had long kept their money under mattresses, bring it into the system. Bankers from the Gulf look on with approval and a little curiosity."
 COLDWAR_EGY_tourism_reopened:0 "Tourism Reopened"
 COLDWAR_EGY_tourism_reopened_desc:0 "Visitors return to Egypt's temples, tombs and beaches. Guides reappear at the pyramids, hotels repaint their lobbies and tour operators advertise the Nile once more. Tourism brings foreign currency and also work for thousands, from camel drivers to chambermaids."
 COLDWAR_EGY_central_bank_reform:0 "Central Bank Reform"
 COLDWAR_EGY_central_bank_reform_desc:0 "The central bank, long a department of the treasury, is given real authority over credit, currency and the banking system. Its economists, trained in London and Washington, bring order to the books and discipline to monetary policy. Inflation is a persistent enemy, and the new governor regards it as such."
 COLDWAR_EGY_an_egyptian_economic_model:0 "An Egyptian Economic Model"
 COLDWAR_EGY_an_egyptian_economic_model_desc:0 "After years of improvisation, Egypt arrives at an approach all its own, neither a copy of Moscow nor a transplant from the West. Economists call it the Egyptian model, adapted to the Nile and its people. Whether socialist, open or devout in character, it is homegrown, and that makes it durable."
 COLDWAR_EGY_the_high_dam_completed:0 "The High Dam Completed"
 COLDWAR_EGY_the_high_dam_completed_desc:0 "At Aswan, the great dam that Nasser staked his reputation upon is complete. Lake Nasser stretches far into Nubia, the Nile is tamed, and floods and droughts become memories. Soviet engineers and Egyptian labourers take a justified pride, and the Republic has a monument that can be seen from the stars."
 COLDWAR_EGY_electrify_the_villages:0 "Electrify the Villages"
 COLDWAR_EGY_electrify_the_villages_desc:0 "Power lines run from Aswan along the Nile and into the villages that have known only oil lamps. Electric light appears in the evenings, pumps and mills begin to turn, and a radio is soon in every coffeehouse. The fellahin begin to believe that the revolution has something for them."
 COLDWAR_EGY_lake_nasser_fisheries:0 "Lake Nasser Fisheries"
 COLDWAR_EGY_lake_nasser_fisheries_desc:0 "The vast new lake is stocked with fish, and fishing cooperatives spring up along its shores. Boats and nets appear on the water where villages once stood, and a new industry takes hold in the shadow of the dam. Fish from Nasser's lake begin to appear on dinner tables across Egypt."
 COLDWAR_EGY_silt_and_salt:0 "Silt and Salt"
 COLDWAR_EGY_silt_and_salt_desc:0 "The dam brings an unwelcome side. The annual flood that carried fertile silt to the fields is gone, farmers are forced to buy fertiliser, and salt begins to creep into the soil. The Delta coast is eroding and the water table is rising. The gift of the dam must be paid for, and Egypt must now choose how."
 COLDWAR_EGY_the_fertiliser_industry:0 "The Fertiliser Industry"
 COLDWAR_EGY_the_fertiliser_industry_desc:0 "Plants at Aswan and in the Delta turn out artificial fertiliser to replace the vanished silt. Villages that once relied on the flood now depend on sacks from the state cooperative. Yields rise, and so does the dependence of the fellah on the factories of the Republic."
 COLDWAR_EGY_tile_drainage_programme:0 "The Tile Drainage Programme"
 COLDWAR_EGY_tile_drainage_programme_desc:0 "Engineers set to work laying thousands of kilometres of clay and plastic pipe beneath the fields. The pipes carry off the salty water and keep the roots dry. It is slow, dull and expensive work, but it keeps the soil alive, and the cultivators of the Delta are grateful."
 COLDWAR_EGY_the_agricultural_cooperatives:0 "The Agricultural Cooperatives"
 COLDWAR_EGY_the_agricultural_cooperatives_desc:0 "Villages are organised into cooperatives that share seed, credit, machinery and marketing. Small farmers, once at the mercy of money-lenders and landlords, now sit on the boards of their own societies. The state takes its share, but the peasant at last has a voice, if not always a vote."
 COLDWAR_EGY_cotton_is_king:0 "Cotton is King"
 COLDWAR_EGY_cotton_is_king_desc:0 "The white gold of the Nile again takes pride of place. Fields are devoted to long-staple cotton, which earns the foreign currency needed for machinery and arms. The mills of Mahalla and the brokers of Alexandria prosper, though the cultivators ask what they will eat."
 COLDWAR_EGY_bread_before_cotton:0 "Bread before Cotton"
 COLDWAR_EGY_bread_before_cotton_desc:0 "Land is turned over from cotton to wheat, maize and beans. The government decides that a nation which cannot feed itself cannot be independent. Export earnings suffer, but the bread queues grow shorter, and the planners are content that Egypt's fields should serve Egypt's stomachs first."
 COLDWAR_EGY_reclaim_the_desert:0 "Reclaim the Desert"
 COLDWAR_EGY_reclaim_the_desert_desc:0 "Pumps and canals push the green back into the desert. New villages rise in the western oases and along the margin of the Valley, settled by young graduates and families from the crowded Delta. It is a gamble against sand and salt, but the dream of a second Egypt is hard to resist."
 COLDWAR_EGY_family_planning:0 "Family Planning"
 COLDWAR_EGY_family_planning_desc:0 "Clinics, posters and radio campaigns urge Egyptians to have fewer children. Nurses visit villages with advice and supplies, and the government speaks of quality over quantity. The sheikhs object, and many families hesitate, but the planners know that no dam can feed an endless multiplication of mouths."
 COLDWAR_EGY_the_strength_of_numbers:0 "The Strength of Numbers"
 COLDWAR_EGY_the_strength_of_numbers_desc:0 "Egypt's millions are a strength, not a burden, declares the government. Large families are honoured, and the growing population is described as the nation's wealth in labour and in soldiers. Planners worry about housing and bread, but the leadership prefers to count the future conscripts."
 COLDWAR_EGY_the_gift_of_the_nile:0 "The Gift of the Nile"
 COLDWAR_EGY_the_gift_of_the_nile_desc:0 "The ancient saying that Egypt is the gift of the Nile is made true again in the age of the dam. Water, power, fertiliser and cultivation work in concert, and the fields of the Valley and the desert alike yield harvests that earlier generations could not imagine. The Nile has been mastered, not merely endured."
 COLDWAR_EGY_industrialise_egypt:0 "Industrialise Egypt"
 COLDWAR_EGY_industrialise_egypt_desc:0 "The great promise of the revolution was that Egypt would be a land of factories as well as of fields. Even in wartime the ministries of industry return to their blueprints, believing that an economy built on cotton alone will always be at the mercy of others. The path to strength runs through the foundry and the mill."
 COLDWAR_EGY_helwan_steel:0 "Expand the Helwan Steel Works"
 COLDWAR_EGY_helwan_steel_desc:0 "At Helwan, south of Cairo, the blast furnaces and rolling mills are expanded. Soviet technicians and Egyptian engineers work shoulder to shoulder to increase the output of the iron and steel works, the backbone of a modern industrial nation. Every ingot is a small answer to those who said Egypt could never build."
 COLDWAR_EGY_nag_hammadi_aluminium:0 "The Nag Hammadi Aluminium Complex"
 COLDWAR_EGY_nag_hammadi_aluminium_desc:0 "With electricity flowing from the High Dam, Upper Egypt can at last support heavy industry. At Nag Hammadi, a smelter is raised to turn imported ore into aluminium for cables, vehicles and aircraft. The sleepy town in the Said finds itself part of the industrial age."
 COLDWAR_EGY_el_nasr_automotive:0 "El Nasr Automotive"
 COLDWAR_EGY_el_nasr_automotive_desc:0 "The El Nasr factories at Helwan assemble trucks, buses and cars under Egyptian management. Workers who once repaired imported vehicles now build their own, and though the models are modest, the symbolism is not. Cairo's streets are beginning to fill with machines made in Egypt."
 COLDWAR_EGY_mahalla_textiles:0 "The Mahalla Textile Mills"
 COLDWAR_EGY_mahalla_textiles_desc:0 "At Mahalla al-Kubra, the great textile mills spin and weave the cotton of the Delta into cloth for the nation and for export. Tens of thousands of workers have found a living there, and their strong solidarity makes them a force the government does well to heed. The mills give Egypt both its wardrobe and its working class."
 COLDWAR_EGY_oil_of_the_gulf_of_suez:0 "Oil of the Gulf of Suez"
 COLDWAR_EGY_oil_of_the_gulf_of_suez_desc:0 "Under the waters of the Gulf of Suez lies a promising treasure. Rigs rise at fields such as El Morgan and Ramadan, and foreign and Egyptian companies drill along the coast. For a country long short of foreign currency, the prospect of becoming an oil exporter is intoxicating."
 COLDWAR_EGY_the_sumed_pipeline:0 "The SUMED Pipeline"
 COLDWAR_EGY_the_sumed_pipeline_desc:0 "A pipeline from the Red Sea coast to the Mediterranean is proposed to carry Gulf crude around the closed canal. With Arab capital and Egyptian land, the project promises to turn the loss of the canal into an opportunity. Pumping stations and tank farms begin to appear along the desert route."
 COLDWAR_EGY_abu_qir_gas:0 "Abu Qir Gas"
 COLDWAR_EGY_abu_qir_gas_desc:0 "Natural gas discovered off the coast near Alexandria fuels the thermal plants of the Delta. Pipelines carry it ashore at Abu Qir, and furnaces and fertiliser works begin to burn the new fuel. Egypt's engineers are pleased to find that the sea holds more than fish."
 COLDWAR_EGY_the_el_dabaa_reactor:0 "The El-Dabaa Reactor"
 COLDWAR_EGY_the_el_dabaa_reactor_desc:0 "On the Mediterranean coast at El-Dabaa, the long-discussed nuclear power station finally rises from the sand. Egyptian scientists speak of electricity and progress. In Tel Aviv and in Western capitals, the same word is heard with suspicion. Egypt has joined the atomic age."
 COLDWAR_EGY_thermal_power_for_the_delta:0 "Thermal Power for the Delta"
 COLDWAR_EGY_thermal_power_for_the_delta_desc:0 "Conventional power stations burning oil and gas are built at Cairo and Alexandria, quick to construct and well understood. Their chimneys provide the electricity that the factories of the Delta need, without the controversy of the atom. Engineers call it sensible and nationalists call it timid."
 COLDWAR_EGY_rebuild_the_railways:0 "Rebuild the Railways"
 COLDWAR_EGY_rebuild_the_railways_desc:0 "The railways laid by British engineers have suffered from war and neglect. Track is relaid, locomotives are overhauled and stations are repainted, and the trains once again run along the Valley. For a poor country, the railway remains the surest way to move people and goods."
 COLDWAR_EGY_the_cairo_metro:0 "The Cairo Metro"
 COLDWAR_EGY_the_cairo_metro_desc:0 "Beneath the crowded streets of Cairo, tunnels are driven for an underground railway. The congested capital, long choked by trams, buses and donkey carts, will gain a modern artery. Engineers fear the groundwater and the antiquities, and the city's commuters pray for success."
 COLDWAR_EGY_the_desert_roads:0 "The Desert Road Network"
 COLDWAR_EGY_the_desert_roads_desc:0 "Asphalt roads stretch across the desert to the oases, the Red Sea and the mines of the south. Lorries now cross in hours distances that once took days by caravan. The roads bind the far corners of the Republic to the capital and bring the desert within reach of the plan."
 COLDWAR_EGY_industrial_heartland:0 "Industrial Heartland"
 COLDWAR_EGY_industrial_heartland_desc:0 "Smelters, mills, refineries and assembly lines are linked by new roads, rails and cables. Visitors from Africa and the Arab lands come to Egypt to see how an Arab nation can make steel, aluminium and cars. Cairo's planners proudly speak of the industrial heartland of the Arab world."
 COLDWAR_EGY_rebuild_the_armed_forces:0 "Rebuild the Armed Forces"
 COLDWAR_EGY_rebuild_the_armed_forces_desc:0 "The Six Day War left the Egyptian army broken, its equipment lost in the Sinai and its pride in ruins. In the years since, a new force has been quietly reassembled under Soviet instruction. Officers now speak of rebuilding from the ground up, in order to fight again, and to win."
 COLDWAR_EGY_end_the_amer_clique:0 "End the Amer Clique"
 COLDWAR_EGY_end_the_amer_clique_desc:0 "The favouritism that placed friends of Field Marshal Amer in command of divisions he never understood is rooted out. Officers are promoted on competence, not loyalty, and the chiefs of the humiliated army are replaced by younger professionals. The purge is painful, but few mourn the old order."
 COLDWAR_EGY_the_educated_conscript:0 "The Educated Conscript"
 COLDWAR_EGY_the_educated_conscript_desc:0 "Egypt's schools and universities now supply a new kind of soldier, a high-school or university graduate able to read a technical manual and operate a modern weapon. Graduates in uniform serve for long years, and the army learns to rely on brains as well as on numbers."
 COLDWAR_EGY_infantry_against_armour:0 "Infantry against Armour"
 COLDWAR_EGY_infantry_against_armour_desc:0 "Israeli armour terrified the Egyptian infantry in 1967. Now, small teams equipped with Sagger wire-guided missiles and RPG-7 launchers are trained to meet the tanks head on. The soldiers practise until the drill is automatic, and confidence slowly takes the place of dread."
 COLDWAR_EGY_the_armoured_divisions:0 "The Armoured Divisions"
 COLDWAR_EGY_the_armoured_divisions_desc:0 "The tank divisions, savaged in the Sinai, are rebuilt with fresh Soviet armour. Crews train to fight as coordinated formations rather than as scattered columns. The army's commanders have studied the lessons of the previous war closely, and they intend to apply them."
 COLDWAR_EGY_the_bridging_engineers:0 "The Bridging Engineers"
 COLDWAR_EGY_the_bridging_engineers_desc:0 "Engineers rehearse the greatest obstacle of all, the crossing of the Suez Canal and the breaching of the sand ramparts beyond it. Pontoons, bridging equipment and powerful water cannons are tested on mock canals in the desert. The success of any offensive may depend on these quiet, unglamorous men."
 COLDWAR_EGY_soviet_deep_battle:0 "Soviet Deep Battle Doctrine"
 COLDWAR_EGY_soviet_deep_battle_desc:0 "Soviet advisers push for an Egyptian army trained in the manner of the Red Army, with mass, depth and the relentless advance of successive echelons. Staff officers learn the doctrine in Moscow's academies and in Egyptian field exercises. It is powerful, orthodox and closely tied to Soviet supply."
 COLDWAR_EGY_an_egyptian_doctrine:0 "An Egyptian Doctrine"
 COLDWAR_EGY_an_egyptian_doctrine_desc:0 "Egyptian planners conclude that they cannot match Israel in the air or in manoeuvre, and decide to fight on their own terms. A limited offensive under an umbrella of missiles, seizing a strip of the east bank and holding it, will be the foundation of their plans. The doctrine is realistic, defensive and distinctly Egyptian."
 COLDWAR_EGY_western_training:0 "Western Training"
 COLDWAR_EGY_western_training_desc:0 "Egyptian officers attend courses in Western staff colleges and study the methods of NATO armies. Instructors from abroad teach flexibility, initiative and the use of combined arms. The change worries Moscow and intrigues Washington, and a few veterans mutter that it is un-Egyptian."
 COLDWAR_EGY_al_saiqa_commandos:0 "Al-Sa'iqa Commandos"
 COLDWAR_EGY_al_saiqa_commandos_desc:0 "Elite units trained for raids behind enemy lines are expanded under the name of the Sa'iqa. They cross the canal at night, ambush patrols and strike at outposts, proving that Egyptian soldiers can fight on equal terms. Their exploits are celebrated on the radio and envied in the regular ranks."
 COLDWAR_EGY_the_republican_guard:0 "The Republican Guard"
 COLDWAR_EGY_the_republican_guard_desc:0 "The guard formed to protect the President and the institutions of the Republic is built into a trusted and well-equipped corps. Its officers are chosen for loyalty as much as skill, and in a land that has seen coups before, its presence is reassuring to some and ominous to others."
 COLDWAR_EGY_the_air_defence_command:0 "The Air Defence Command"
 COLDWAR_EGY_the_air_defence_command_desc:0 "The air defence forces become a separate service, with their own command, their own academy and their own prestige. Missile batteries and radar stations are knitted into a network, and crews practise relocating, camouflaging and hiding. Israel's pilots, who once flew with impunity, begin to meet resistance."
 COLDWAR_EGY_rebuild_the_air_force:0 "Rebuild the Air Force"
 COLDWAR_EGY_rebuild_the_air_force_desc:0 "On 5 June 1967 the Egyptian air force was destroyed on the ground. Now new MiGs arrive in crates from the Soviet Union and fresh pilots are trained to fly them. The commanders vow that never again will the sky be lost in the first morning of a war."
 COLDWAR_EGY_hardened_shelters:0 "Hardened Aircraft Shelters"
 COLDWAR_EGY_hardened_shelters_desc:0 "Concrete shelters, built to withstand bombs, now cover the aircraft of the Egyptian air force. Runways have been dispersed and repair crews drilled to fix them in hours. The lesson of the first morning of June 1967 has been learnt in concrete and steel."
 COLDWAR_EGY_pilot_training_at_bilbeis:0 "Pilot Training at Bilbeis"
 COLDWAR_EGY_pilot_training_at_bilbeis_desc:0 "At Bilbeis, young cadets are put through a demanding course of instruction. Instructors, both Egyptian and Soviet, teach them to fly, navigate and fight. The programme turns out a generation of pilots who will carry the reputation of the air force into the next war."
 COLDWAR_EGY_missile_boats:0 "The Missile Boats"
 COLDWAR_EGY_missile_boats_desc:0 "In October 1967, small Egyptian missile boats sank the destroyer Eilat, the first ship in history to be sunk by missiles in this way. The navy has taken the lesson to heart. A growing flotilla of fast, heavily armed craft now guards Alexandria and Port Said, and the sailors are proud of their small ships."
 COLDWAR_EGY_blockade_bab_el_mandeb:0 "Blockade Bab el-Mandeb"
 COLDWAR_EGY_blockade_bab_el_mandeb_desc:0 "Egypt's navy looks beyond the Mediterranean and eyes the narrow strait that guards the southern Red Sea. If Israeli shipping can be stopped at Bab el-Mandeb, the enemy's access to the Indian Ocean will be cut and the strangulation of Eilat will begin. Ships, mines and submarines are readied for the task."
 COLDWAR_EGY_the_military_factories:0 "The Military Factories"
 COLDWAR_EGY_the_military_factories_desc:0 "Egypt cannot rely on foreign suppliers forever. The ordnance works of Cairo and Helwan are expanded to make ammunition, small arms and spare parts, and the army's technical corps trains a workforce in the arts of industrial production. A nation that makes its own munitions is harder to bring to its knees."
 COLDWAR_EGY_the_helwan_aircraft_works:0 "The Helwan Aircraft Works"
 COLDWAR_EGY_the_helwan_aircraft_works_desc:0 "The supersonic HA-300 project, abandoned in 1969, is brought back from the archives. German engineers are gone, but Egyptian and foreign experts pick up the work at Helwan. Nasser's old dream of a national fighter aircraft lives again, and even partial success would be a source of great pride."
 COLDWAR_EGY_the_missile_programme:0 "The Missile Programme"
 COLDWAR_EGY_the_missile_programme_desc:0 "Egyptian scientists and engineers work in secret on ballistic missiles and guided weapons. The work is slow and costly, and Western intelligence agencies watch it closely. Israel regards the programme as a direct threat, and the Egyptian leadership sees it as a necessary deterrent."
 COLDWAR_EGY_the_army_of_the_crossing:0 "The Army of the Crossing"
 COLDWAR_EGY_the_army_of_the_crossing_desc:0 "After three years of rebuilding, the Egyptian army is no longer the broken host of 1967. It has learned, trained and re-equipped, and it knows exactly what it will do on the day. The soldiers in the sand camps of the west bank wait for the order, certain that the canal will be crossed."
 COLDWAR_EGY_oct_no_war_no_peace:0 "No War, No Peace"
 COLDWAR_EGY_oct_no_war_no_peace_desc:0 "The guns along the Canal are silent, but the Sinai is still occupied and the Bar-Lev Line grows stronger every month. Neither war nor peace has returned a single kilometre of Egyptian soil. Cairo concludes that only a limited war can break the deadlock and force the superpowers to take Egypt seriously again."
 COLDWAR_EGY_oct_the_sam_umbrella:0 "The SAM Umbrella"
 COLDWAR_EGY_oct_the_sam_umbrella_desc:0 "Our pilots cannot yet beat the Israeli air force in the sky, so our missiles will deny it the sky. A dense belt of SA-2, SA-3 and mobile SA-6 batteries along the Canal will cover the crossing points and let the army advance under a roof of missiles."
 COLDWAR_EGY_oct_rebuild_the_squadrons:0 "Rebuild the Squadrons"
 COLDWAR_EGY_oct_rebuild_the_squadrons_desc:0 "In 1967 the air force was destroyed on the ground in a single morning. Never again: hardened shelters, dispersed airfields, new MiG and Sukhoi squadrons and pilots trained for low-level strikes will give the next war an Egyptian air arm that survives the first hour."
 COLDWAR_EGY_oct_saggers_and_rpgs:0 "Saggers and RPGs"
 COLDWAR_EGY_oct_saggers_and_rpgs_desc:0 "Israeli armour counter-attacks will come within hours of a crossing. The infantry that crosses first will carry its own defence: Sagger missiles and RPGs in every platoon, and long-range Scuds to deter strikes deep into Egypt."
 COLDWAR_EGY_oct_the_deception_plan:0 "Tahrir 41: The Deception Plan"
 COLDWAR_EGY_oct_the_deception_plan_desc:0 "Exercises on the Canal will become routine, reservists will be called up and sent home again, and rumours of poor Soviet maintenance will be allowed to spread. When the real attack comes, Israeli intelligence must believe it is just another exercise."
 COLDWAR_EGY_oct_the_october_coalition:0 "The October Coalition"
 COLDWAR_EGY_oct_the_october_coalition_desc:0 "Egypt will not fight alone. Damascus must open a second front on the Golan, and the Arab capitals are asked to send squadrons, brigades and money. Every partner that agrees receives its own war aims and joins the coordinated plan."
 COLDWAR_EGY_oct_the_war_council:0 "The War Council of October"
 COLDWAR_EGY_oct_the_war_council_desc:0 "The President, the war minister and the chief of staff meet behind closed doors and fix the day and the hour. The objective is limited but clear: cross the Canal, storm the Bar-Lev Line and hold the east bank under the missile umbrella until the world is forced to negotiate."
