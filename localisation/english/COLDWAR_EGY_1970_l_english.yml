 COLDWAR_EGY.1.t:0 "A Nation at War of Attrition"
 COLDWAR_EGY.1.d:0 "January 1970. Along the Suez Canal Egyptian and Israeli guns trade fire every day, and Israeli jets strike deep into the Nile Valley. Three years after the Naksa, President Gamal Abdel Nasser still commands the loyalty of the Arab street, yet his health is failing. Soviet advisers fill the ministries and the missile sites, the Canal lies closed and silent, and the Arab Socialist Union speaks of victory while the economy groans under the weight of the front. Whoever governs Egypt in the coming decade must decide what kind of country it will be."
 COLDWAR_EGY.1.a:0 "What has been taken by force can only be regained by force."
 COLDWAR_EGY.2.t:0 "Who Follows the Rais?"
 COLDWAR_EGY.2.d:0 "Behind the closed doors of the Arab Socialist Union the question no one dares ask aloud is being asked everywhere: who will follow Nasser? Vice President Anwar as-Sadat is considered a harmless placeholder. Ali Sabri commands the party apparatus and the confidence of Moscow. War Minister Mohamed Fawzi speaks for the officers, while Zakaria Mohieddin's technocrats wait in the wings. The answer will shape the Egypt of the seventies."
 COLDWAR_EGY.2.a:0 "The Revolution will choose its heir."
 COLDWAR_EGY.3.t:0 "The Trial of the Centres of Power"
 COLDWAR_EGY.3.d:0 "In May 1971 the President moved first. Ali Sabri, Sharawi Gomaa, Sami Sharaf and Mohamed Fawzi resigned in a body, hoping to bring the government down; instead they were arrested within hours. The tapes of the security service were burned in public, and the trial of the 'centres of power' has become a spectacle of a new order that promises the rule of law."
 COLDWAR_EGY.3.a:0 "The Corrective Revolution has triumphed."
 COLDWAR_EGY.4.t:0 "The Bread Intifada"
 COLDWAR_EGY.4.d:0 "The announcement that subsidies on bread, sugar and cooking oil would be cut has brought hundreds of thousands into the streets of Cairo and Alexandria. Police stations burn, the Central Security Forces are overwhelmed, and the army stands ready at the edge of the capital. The government must decide whether to restore the subsidies or to see the reform through."
 COLDWAR_EGY.4.a:0 "Restore the subsidies."
 COLDWAR_EGY.4.b:0 "The reform stands."
 COLDWAR_EGY.5.t:0 "The Rayan Scandal"
 COLDWAR_EGY.5.d:0 "For years the Islamic investment companies promised returns no bank could match, and millions of small savers entrusted them with their remittances. Now the largest of them can no longer pay. Depositors besiege its offices, and the government must decide whether it can still regulate the sector in time."
 COLDWAR_EGY.5.a:0 "Let them collapse."
 COLDWAR_EGY.5.b:0 "Regulate them at once."
 COLDWAR_EGY.6.t:0 "Unrest among the Copts"
 COLDWAR_EGY.6.d:0 "The new legal order has alarmed Egypt's Coptic Christians. Pope Shenouda has cancelled the Easter celebrations in protest, churches in Upper Egypt report attacks, and Coptic notables ask the government for guarantees. The ulema watch the response closely."
 COLDWAR_EGY.6.a:0 "Guarantee the protection of the Copts."
 COLDWAR_EGY.6.b:0 "The law will be applied without exception."
 COLDWAR_EGY.7.t:0 "Mutiny of the Central Security Forces"
 COLDWAR_EGY.7.d:0 "Rumours that their term of service would be extended by a year have driven thousands of poorly paid Central Security conscripts into revolt. Hotels near the pyramids burn and the army has to be called in to restore order. Cheap order has proven expensive."
 COLDWAR_EGY.7.a:0 "Send in the army."
 COLDWAR_EGY.8.t:0 "Suspended from the Arab League"
 COLDWAR_EGY.8.d:0 "Meeting in Baghdad, the Arab League has answered our separate peace with Israel: Egypt's membership is suspended, the League's headquarters will leave Cairo, and one Arab capital after another recalls its ambassador. Peace has been won, but the Arab world now treats us as a stranger."
 COLDWAR_EGY.8.a:0 "History will judge who was right."
 COLDWAR_EGY.9.t:0 "The Rais's Heart"
 COLDWAR_EGY.9.d:0 "The Soviet cardiologists have bought the President time, but not health. After another exhausting round of summits Nasser collapses at home, and his doctors can only advise rest he will never take."
 COLDWAR_EGY.9.a:0 "He will recover."
 COLDWAR_EGY.10.t:0 "The Eastern Flank"
 COLDWAR_EGY.10.d:0 "Cairo has asked its partners of the Arab Joint Defense Command to keep the eastern front active, so that Israel cannot concentrate its strength on the Canal. Our headquarters report that the call has been heard."
 COLDWAR_EGY.10.a:0 "Every front is our front."
 COLDWAR_EGY.11.t:0 "Rent for the Eskadra"
 COLDWAR_EGY.11.d:0 "The Soviet Mediterranean squadron has paid the annual rent for its facilities in Alexandria and Mersa Matruh."
 COLDWAR_EGY.11.a:0 "Welcome income."
 COLDWAR_EGY.12.t:0 "The United Arab Republic Is Back"
 COLDWAR_EGY.12.d:0 "From Cairo comes the proclamation that the United Arab Republic has been restored. Egypt and its partners will share one flag, one army and one foreign policy. Whether the new union will outlast its predecessor of 1958 remains to be seen."
 COLDWAR_EGY.12.a:0 "A new chapter for the Arab world."
 COLDWAR_EGY.13.t:0 "The Rais Is Dead"
 COLDWAR_EGY.13.d:0 "Hours after seeing off the last guests of the Arab summit that ended the fighting in Jordan, Gamal Abdel Nasser has died of a heart attack. Millions pour into the streets of Cairo in grief such as the Arab world has never seen. Vice President Anwar as-Sadat assumes the presidency for now, but the struggle for the succession has only begun."
 COLDWAR_EGY.13.a:0 "Egypt mourns its Rais."
 COLDWAR_EGY.120.t:0 "Egypt Accepts the Ceasefire"
 COLDWAR_EGY.120.d:0 "Cairo has accepted the American ceasefire proposal for the Suez front. The guns along the Canal would fall silent; the Sinai would remain under our control until a treaty is signed."
 COLDWAR_EGY.120.a:0 "Accept the ceasefire."
 COLDWAR_EGY.120.b:0 "The war continues."
 COLDWAR_EGY.129.t:0 "The Arab Organisation for Industrialisation"
 COLDWAR_EGY.129.d:0 "Cairo invites the Gulf states to co-finance an Arab arms industry in Egypt. Every partner that joins halves Egypt's remaining share of the cost."
 COLDWAR_EGY.129.a:0 "Co-finance the AOI."
 COLDWAR_EGY.129.b:0 "We must decline."
 COLDWAR_EGY.134.t:0 "A Joint Arab High Command"
 COLDWAR_EGY.134.d:0 "The Egyptian high command proposes to its allies a joint command structure, common exercises and coordinated war plans."
 COLDWAR_EGY.134.a:0 "Join the joint command."
 COLDWAR_EGY.134.b:0 "We must decline."
 COLDWAR_EGY.105.t:0 "Deposits for the Central Bank of Egypt"
 COLDWAR_EGY.105.d:0 "Cairo asks the oil states to place part of their reserves with the Central Bank of Egypt, to steady the pound and finance reconstruction."
 COLDWAR_EGY.105.a:0 "Deposit the funds."
 COLDWAR_EGY.105.b:0 "We must decline."
 COLDWAR_EGY.116.t:0 "An Alliance of the Scholars"
 COLDWAR_EGY.116.d:0 "The scholars of al-Azhar propose a lasting alliance with the Kingdom: shared missions, shared universities and Saudi support for the Islamic order in Egypt."
 COLDWAR_EGY.116.a:0 "Support our Egyptian brothers."
 COLDWAR_EGY.116.b:0 "We must decline."
 COLDWAR_EGY.121.t:0 "Egypt Asks for the Oil Weapon"
 COLDWAR_EGY.121.d:0 "Cairo asks the Arab oil producers to use their oil as a weapon: an embargo on the states that support Israel. The decision remains entirely ours."
 COLDWAR_EGY.121.a:0 "We will consider it."
 COLDWAR_EGY.121.b:0 "Oil and politics do not mix."
 COLDWAR_EGY.111.t:0 "Facilities for the Fifth Eskadra"
 COLDWAR_EGY.111.d:0 "Egypt offers the Soviet Mediterranean squadron permanent facilities in Alexandria and Mersa Matruh, against an annual rent."
 COLDWAR_EGY.111.a:0 "Accept the facilities."
 COLDWAR_EGY.111.b:0 "We must decline."
 COLDWAR_EGY.110.t:0 "A Treaty Stronger than Friendship"
 COLDWAR_EGY.110.d:0 "Cairo proposes to deepen the Treaty of Friendship: more advisers, more air-defence systems and a common front against imperialism in the Middle East."
 COLDWAR_EGY.110.a:0 "Deepen the treaty."
 COLDWAR_EGY.110.b:0 "We must decline."
 COLDWAR_EGY.112.t:0 "Egypt Applies to the Comecon"
 COLDWAR_EGY.112.d:0 "The People's Republic of Egypt applies for membership of the Council for Mutual Economic Assistance and offers to integrate its plan with the socialist division of labour."
 COLDWAR_EGY.112.a:0 "Welcome Egypt to the Comecon."
 COLDWAR_EGY.112.b:0 "We must decline."
 COLDWAR_EGY.101.t:0 "Egypt Seeks a Cooperation Agreement"
 COLDWAR_EGY.101.d:0 "Cairo proposes a long-term agreement on trade, credits and technical cooperation with the socialist community. Egyptian cotton would flow north, Soviet machinery south."
 COLDWAR_EGY.101.a:0 "Sign the agreement."
 COLDWAR_EGY.101.b:0 "We must decline."
 COLDWAR_EGY.126.t:0 "The Federation of Arab Republics"
 COLDWAR_EGY.126.d:0 "Cairo proposes a federation of the progressive Arab republics: a common presidency council, coordinated foreign policy and an open market, under Egyptian leadership."
 COLDWAR_EGY.126.a:0 "Join the Federation."
 COLDWAR_EGY.126.b:0 "We must decline."
 COLDWAR_EGY.109.t:0 "Talks on the Nile Waters"
 COLDWAR_EGY.109.d:0 "Cairo proposes an agreement on the use of the Nile waters, with joint monitoring and shared projects instead of rivalry over every drop."
 COLDWAR_EGY.109.a:0 "Sign the water agreement."
 COLDWAR_EGY.109.b:0 "We must decline."
 COLDWAR_EGY.119.t:0 "A Joint Nile Authority"
 COLDWAR_EGY.119.d:0 "Egypt proposes a joint authority for the Nile valley: shared irrigation planning, shared data and open trade along the river."
 COLDWAR_EGY.119.a:0 "Found the authority."
 COLDWAR_EGY.119.b:0 "We must decline."
 COLDWAR_EGY.127.t:0 "A Full Union with Egypt"
 COLDWAR_EGY.127.d:0 "Libya once proposed a complete union of the two states. Cairo now answers: one state, one army, one president. If we accept, Libya will become part of Egypt."
 COLDWAR_EGY.127.a:0 "Unite with Egypt."
 COLDWAR_EGY.127.b:0 "Libya stays Libyan."
 COLDWAR_EGY.122.t:0 "Talks at Kilometre 101"
 COLDWAR_EGY.122.d:0 "In a tent at Kilometre 101 on the Cairo-Suez road, Egyptian and Israeli officers have begun to talk directly for the first time. Cairo proposes a disengagement of forces."
 COLDWAR_EGY.122.a:0 "Agree to disengage."
 COLDWAR_EGY.122.b:0 "We must decline."
 COLDWAR_EGY.115.t:0 "An Association Agreement with Egypt"
 COLDWAR_EGY.115.d:0 "Cairo proposes an association agreement: lower tariffs for Egyptian cotton and textiles, and a market of forty million for European industry."
 COLDWAR_EGY.115.a:0 "Sign the agreement."
 COLDWAR_EGY.115.b:0 "We must decline."
 COLDWAR_EGY.107.t:0 "Investment in Egypt"
 COLDWAR_EGY.107.d:0 "Cairo invites Gulf investors to finance Egyptian housing, banking and industry, promising them a privileged place in the new economy."
 COLDWAR_EGY.107.a:0 "Invest in Egypt."
 COLDWAR_EGY.107.b:0 "We must decline."
 COLDWAR_EGY.106.t:0 "Seed Capital for Islamic Banking"
 COLDWAR_EGY.106.d:0 "The new Egyptian government asks for seed capital to found banks that operate without interest, in accordance with the sharia."
 COLDWAR_EGY.106.a:0 "Provide the capital."
 COLDWAR_EGY.106.b:0 "We must decline."
 COLDWAR_EGY.124.t:0 "The Cairo Agreement"
 COLDWAR_EGY.124.d:0 "President Nasser has summoned King Hussein and Yasser Arafat to Cairo to end the fighting in Jordan. Both sides are asked to sign an agreement that ends the bloodshed."
 COLDWAR_EGY.124.a:0 "Sign the Cairo Agreement."
 COLDWAR_EGY.124.b:0 "We must decline."
 COLDWAR_EGY.117.t:0 "The Crown Development Fund"
 COLDWAR_EGY.117.d:0 "The restored King of Egypt asks his fellow monarchs to support a development fund that will prove the crown can deliver what the republic could not."
 COLDWAR_EGY.117.a:0 "Contribute to the fund."
 COLDWAR_EGY.117.b:0 "We must decline."
 COLDWAR_EGY.118.t:0 "An Alliance of Crowns"
 COLDWAR_EGY.118.d:0 "Cairo recalls the old ties between the houses of Muhammad Ali and Pahlavi and proposes a union of crowns, backed by an oil credit."
 COLDWAR_EGY.118.a:0 "Embrace the alliance."
 COLDWAR_EGY.118.b:0 "We must decline."
 COLDWAR_EGY.104.t:0 "Egypt Proposes a Strategic Partnership"
 COLDWAR_EGY.104.d:0 "Cairo asks Washington to recognise Egypt as a strategic partner of the United States, with training programmes and preferential access to American arms."
 COLDWAR_EGY.104.a:0 "Egypt is our partner."
 COLDWAR_EGY.104.b:0 "We must decline."
 COLDWAR_EGY.113.t:0 "American Wheat for Egypt"
 COLDWAR_EGY.113.d:0 "Cairo asks for long-term deliveries of American wheat under the PL-480 programme to keep bread cheap in Egypt's cities."
 COLDWAR_EGY.113.a:0 "Ship the wheat."
 COLDWAR_EGY.113.b:0 "We must decline."
 COLDWAR_EGY.114.t:0 "The President of Egypt in Jerusalem"
 COLDWAR_EGY.114.d:0 "In a move no one thought possible, the President of Egypt has come to Jerusalem and offered a full peace treaty: recognition and normal relations, in exchange for the return of the Sinai in stages."
 COLDWAR_EGY.114.a:0 "Sign the peace treaty."
 COLDWAR_EGY.114.b:0 "We cannot accept these terms."
 COLDWAR_EGY.114.c:0 "Negotiate further."
 COLDWAR_EGY.135.t:0 "The October Coalition"
 COLDWAR_EGY.135.d:0 "Cairo has sent a secret envoy: Egypt is preparing to cross the Canal and asks us to join a coordinated war against Israel. A second front would split the Israeli army; squadrons, brigades and money from every Arab capital would decide the outcome. If we agree we will be given our own war aims and a place in the joint plan."
 COLDWAR_EGY.135.a:0 "We will fight beside Egypt."
 COLDWAR_EGY.135.b:0 "This is not our war."
 COLDWAR_EGY.130.t:0 "Operation Kavkaz"
 COLDWAR_EGY.130.d:0 "Egypt asks for Soviet crews for its missile sites and Soviet pilots for its MiGs, to stop the Israeli deep-penetration raids."
 COLDWAR_EGY.130.a:0 "Send the crews."
 COLDWAR_EGY.130.b:0 "We must decline."
 COLDWAR_EGY.108.t:0 "An Industrial Credit for Egypt"
 COLDWAR_EGY.108.d:0 "Egypt asks its old partner of the Non-Aligned Movement for an industrial credit, to be repaid in cotton and textiles."
 COLDWAR_EGY.108.a:0 "Grant the credit."
 COLDWAR_EGY.108.b:0 "We must decline."
 COLDWAR_EGY.132.t:0 "An Investment Agreement with Egypt"
 COLDWAR_EGY.132.d:0 "The Infitah has opened Egypt to foreign capital. Cairo offers Gulf investors protection, tax breaks and a share in the new Egypt."
 COLDWAR_EGY.132.a:0 "Sign the agreement."
 COLDWAR_EGY.132.b:0 "We must decline."
 COLDWAR_EGY.125.t:0 "Aid for the Front-line States"
 COLDWAR_EGY.125.d:0 "As agreed in Khartoum, Egypt asks for the annual aid owed to the states that carry the burden of the war against Israel."
 COLDWAR_EGY.125.a:0 "Pay the subsidy."
 COLDWAR_EGY.125.b:0 "We must decline."
 COLDWAR_EGY.123.t:0 "The Sinai Agreement"
 COLDWAR_EGY.123.d:0 "Cairo proposes a second agreement: the return of the Sinai in exchange for demilitarised zones, early-warning stations and free passage through the Canal."
 COLDWAR_EGY.123.a:0 "Return the Sinai."
 COLDWAR_EGY.123.b:0 "We must decline."
 COLDWAR_EGY.133.t:0 "The SUMED Pipeline"
 COLDWAR_EGY.133.d:0 "Egypt is building a pipeline from Suez to the Mediterranean that will carry Gulf crude around the closed Canal. Cairo asks for co-financing."
 COLDWAR_EGY.133.a:0 "Co-finance the pipeline."
 COLDWAR_EGY.133.b:0 "We must decline."
 COLDWAR_EGY.131.t:0 "A Treaty of Friendship and Cooperation"
 COLDWAR_EGY.131.d:0 "Cairo proposes a fifteen-year Treaty of Friendship and Cooperation between Egypt and the Soviet Union."
 COLDWAR_EGY.131.a:0 "Sign the treaty."
 COLDWAR_EGY.131.b:0 "We must decline."
 COLDWAR_EGY.128.t:0 "An Economic Union of the Nile Valley"
 COLDWAR_EGY.128.d:0 "Egypt proposes an economic union of the Nile valley: open borders for goods, coordinated agriculture and a shared development fund."
 COLDWAR_EGY.128.a:0 "Join the economic union."
 COLDWAR_EGY.128.b:0 "We must decline."
 COLDWAR_EGY.103.t:0 "Egypt Proposes a Strategic Partnership"
 COLDWAR_EGY.103.d:0 "Cairo asks Washington to recognise Egypt as a strategic partner of the United States, with training programmes and preferential access to American arms."
 COLDWAR_EGY.103.a:0 "Egypt is our partner."
 COLDWAR_EGY.103.b:0 "We must decline."
 COLDWAR_EGY.102.t:0 "Egypt Requests American Aid"
 COLDWAR_EGY.102.d:0 "The Egyptian government asks for a USAID mission to Cairo: grain, infrastructure loans and advisers for its reforms. It would be the first such programme since 1967."
 COLDWAR_EGY.102.a:0 "Open the mission."
 COLDWAR_EGY.102.b:0 "We must decline."
 COLDWAR_EGY.900.t:0 "[From.GetNameDefCap] Accepts"
 COLDWAR_EGY.900.d:0 "Our envoys report that [From.GetNameDef] has accepted our proposal. The agreed terms now take effect."
 COLDWAR_EGY.900.a:0 "Excellent."
 COLDWAR_EGY.901.t:0 "[From.GetNameDefCap] Declines"
 COLDWAR_EGY.901.d:0 "[From.GetNameDefCap] has turned down our proposal. We will have to find another way."
 COLDWAR_EGY.901.a:0 "Unfortunate."
 COLDWAR_EGY_oil_weapon_request_tt:0 "This is only a request. Whether the §YOil Weapon§! is used remains our own decision."
