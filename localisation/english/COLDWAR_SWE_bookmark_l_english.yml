# IMPERIA COLD WAR — Sami: Sweden 1970 and Nordic cooperation.
 COLDWAR_SWE_1970_BOOKMARK_DESC:0 "January 1970: Olof Palme leads a prosperous but strained Sweden. The miners' strike tests the labour settlement, new homes need local services, and export industry depends on foreign markets and imported oil. Build a lasting government, settle the energy question and choose how an armed, non-aligned Sweden deals with the Cold War. Companies, councils and the Crown have plans of their own."
 COLDWAR_SWE_preview_defence:0 "The Cost of Swedish Total Defence"
 COLDWAR_SWE_preview_defence_desc:0 "A large reserve and civil-defence system can mobilise quickly. Keeping it trained and equipped is expensive."
 COLDWAR_SWE_preview_exports:0 "Export Engineering: Strength and Exposure"
 COLDWAR_SWE_preview_exports_desc:0 "Engineering firms sell advanced products abroad. Their success supports Sweden, but leaves jobs exposed to foreign demand."
 COLDWAR_SWE_preview_housing:0 "The Million Programme Commitment"
 COLDWAR_SWE_preview_housing_desc:0 "The Million Programme is building homes on a huge scale. Transport, local services and council finances must keep up."
 COLDWAR_SWE_preview_labour:0 "Labour Peace Under Strain"
 COLDWAR_SWE_preview_labour_desc:0 "The miners at LKAB have challenged the central wage agreements. Industry needs a new bargain that workers will accept."
 COLDWAR_SWE_preview_neutrality:0 "Non-Alignment and Private Dependencies"
 COLDWAR_SWE_preview_neutrality_desc:0 "Military non-alignment protects Sweden's freedom to act. Credibility still depends on strong defence and careful foreign relationships."
 COLDWAR_SWE_preview_oil:0 "Imported Oil, Domestic Vulnerability"
 COLDWAR_SWE_preview_oil_desc:0 "Sweden depends on imported oil. Fuel-intensive power plants make a foreign supply shock costly at home."
 COLDWAR_SWE_preview_skills:0 "Skilled Labour at Full Stretch"
 COLDWAR_SWE_preview_skills_desc:0 "Export firms and public services compete for trained people. More factories alone cannot solve the shortage."
 COLDWAR_SWE_preview_social_model:0 "The Swedish Social Model"
 COLDWAR_SWE_preview_social_model_desc:0 "Strong public services and cooperation support Swedish production. Keeping that promise depends on jobs, taxes and the welfare budget."
