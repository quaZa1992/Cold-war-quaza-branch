l_english:
# IMPERIA COLD WAR — Cold War land doctrine expansion.
 GRAND_DOCTRINE_MDCW_DELIBERATE_FIREPOWER:0 "Deliberate Firepower"
 GRAND_DOCTRINE_MDCW_DELIBERATE_FIREPOWER_DESC:0 "Van Fleet's army in Korea in 1951 relied on registered fire and forward ammunition stocks. Deliberate infantry assaults gain fire superiority, but assembling fire plans slows preparation and increases supply demand."
 GRAND_DOCTRINE_MDCW_MOBILE_RAIDING_WARFARE:0 "Mobile Raiding Warfare"
 GRAND_DOCTRINE_MDCW_MOBILE_RAIDING_WARFARE_DESC:0 "South African mobile battle groups used rapid concentration and flanking attacks in the 1970s and 1980s. Forward loads support short advances; delayed resupply beyond this reserve brings greater supply penalties and weak fixed defence."
 SUBDOCTRINE_MDCW_COHESIVE_UNIT_ROTATION:0 "Cohesive Unit Rotation"
 SUBDOCTRINE_MDCW_COHESIVE_UNIT_ROTATION_DESC:0 "British unit rotation and the later American COHORT programme kept crews and companies together through training and service. Stable teams preserve experience and cohesion, but require longer training and a costlier personnel system."
 mdcw_cohesive_unit_rotation_stable_crews:0 "Stable Crews"
 mdcw_cohesive_unit_rotation_stable_crews_desc:0 "Established crews know their equipment and continue to function when casualties disrupt the formation."
 mdcw_cohesive_unit_rotation_collective_recovery:0 "Collective Recovery"
 mdcw_cohesive_unit_rotation_collective_recovery_desc:0 "Units restore their command relationships and reorganise as familiar teams after combat."
 mdcw_cohesive_unit_rotation_regimental_continuity:0 "Regimental Continuity"
 mdcw_cohesive_unit_rotation_regimental_continuity_desc:0 "Experienced soldiers remain with their formations and pass on the habits learned in the field."
 mdcw_cohesive_unit_rotation_familiar_command_teams:0 "Familiar Command Teams"
 mdcw_cohesive_unit_rotation_familiar_command_teams_desc:0 "Commanders and subordinate leaders rehearse together and understand how neighbouring units operate."
 mdcw_cohesive_unit_rotation_unit_rotation_cycle:0 "Unit Rotation Cycle"
 mdcw_cohesive_unit_rotation_unit_rotation_cycle_desc:0 "Relief and retraining are organised around coherent units rather than a continuous turnover of individuals."
 SUBDOCTRINE_MDCW_INTEGRATED_SUPPORT_COMMANDS:0 "Integrated Support Commands"
 SUBDOCTRINE_MDCW_INTEGRATED_SUPPORT_COMMANDS_DESC:0 "Logistical commands in Korea and corps support commands in the 1960s united supply, workshops, recovery and medical services. Integrated support sustains the fighting force, but needs more personnel and slows the march column."
 mdcw_integrated_support_commands_recovery_sections:0 "Recovery Sections"
 mdcw_integrated_support_commands_recovery_sections_desc:0 "Dedicated recovery sections keep damaged formations functioning through extended operations."
 mdcw_integrated_support_commands_consolidated_supply_points:0 "Consolidated Supply Points"
 mdcw_integrated_support_commands_consolidated_supply_points_desc:0 "Common distribution points reduce duplication and direct stocks towards the units that need them."
 mdcw_integrated_support_commands_forward_workshops:0 "Forward Workshops"
 mdcw_integrated_support_commands_forward_workshops_desc:0 "Combat service support companies carry workshop teams forward to maintain the equipment of their formations."
 mdcw_integrated_support_commands_medical_evacuation_chains:0 "Medical Evacuation Chains"
 mdcw_integrated_support_commands_medical_evacuation_chains_desc:0 "Coordinated evacuation and support arrangements allow exhausted units to reorganise sooner."
 mdcw_integrated_support_commands_sustained_support_groups:0 "Sustained Support Groups"
 mdcw_integrated_support_commands_sustained_support_groups_desc:0 "Permanent support groups organise replacement stocks and services for a sustained campaign."
 SUBDOCTRINE_MDCW_FOREST_ENVELOPMENT:0 "Forest Envelopment"
 SUBDOCTRINE_MDCW_FOREST_ENVELOPMENT_DESC:0 "Finnish motti operations isolated road-bound columns through forest movement, also in summer campaigns in 1941 to 1944. Foot infantry and dismounted specialists gain local mobility and surprise, with less central battle preparation."
 mdcw_forest_envelopment_local_route_reconnaissance:0 "Local Route Reconnaissance"
 mdcw_forest_envelopment_local_route_reconnaissance_desc:0 "Patrols identify tracks and covered approaches beyond the roads used by enemy columns."
 mdcw_forest_envelopment_road_column_isolation:0 "Road Column Isolation"
 mdcw_forest_envelopment_road_column_isolation_desc:0 "Foot troops establishes local blocking positions and attacks isolated road-bound detachments."
 mdcw_forest_envelopment_independent_march_groups:0 "Independent March Groups"
 mdcw_forest_envelopment_independent_march_groups_desc:0 "Small march groups preserve cohesion while moving between dispersed objectives."
 mdcw_forest_envelopment_night_flank_marches:0 "Night Flank Marches"
 mdcw_forest_envelopment_night_flank_marches_desc:0 "Night movement conceals the approach to vulnerable flanks and rear positions."
 mdcw_forest_envelopment_concentrated_local_attacks:0 "Concentrated Local Attacks"
 mdcw_forest_envelopment_concentrated_local_attacks_desc:0 "Local commanders assemble foot troops rapidly at the point chosen for a short attack."
 SUBDOCTRINE_MDCW_HELIBORNE_REACTION_FORCES:0 "Heliborne Reaction Forces"
 SUBDOCTRINE_MDCW_HELIBORNE_REACTION_FORCES_DESC:0 "Rhodesian Fireforce from 1974 linked helicopter-borne blocking groups with reconnaissance and follow-up forces. Light assault groups need considerable fuel and fare poorly in frontal attacks on prepared fortifications."
 mdcw_heliborne_reaction_forces_lift_coordination:0 "Lift Coordination"
 mdcw_heliborne_reaction_forces_lift_coordination_desc:0 "Lift serials and command arrangements keep air-assault infantry together during deployment."
 mdcw_heliborne_reaction_forces_blocking_groups:0 "Blocking Groups"
 mdcw_heliborne_reaction_forces_blocking_groups_desc:0 "Air-assault infantry practises establishing and fighting from small blocking positions."
 mdcw_heliborne_reaction_forces_landing_zone_reconnaissance:0 "Landing Zone Reconnaissance"
 mdcw_heliborne_reaction_forces_landing_zone_reconnaissance_desc:0 "Reconnaissance identifies suitable approaches and landing areas in broken and wooded terrain."
 mdcw_heliborne_reaction_forces_air_ground_control_teams:0 "Air Ground Control Teams"
 mdcw_heliborne_reaction_forces_air_ground_control_teams_desc:0 "Ground and aviation representatives share reports and coordinate the commitment of reaction forces."
 mdcw_heliborne_reaction_forces_follow_up_forces:0 "Follow Up Forces"
 mdcw_heliborne_reaction_forces_follow_up_forces_desc:0 "Follow-up formations relieve the first blocking groups and maintain contact after the initial deployment."
 SUBDOCTRINE_MDCW_ASSAULT_BREACHING:0 "Assault Breaching"
 SUBDOCTRINE_MDCW_ASSAULT_BREACHING_DESC:0 "British specialist formations in 1943 and 1944 and Egyptian engineers at Suez in 1973 demonstrated deliberate obstacle assaults. Infantry rehearses crossings and attacks on fortified positions, increasing training and supply requirements."
 mdcw_assault_breaching_obstacle_reconnaissance:0 "Obstacle Reconnaissance"
 mdcw_assault_breaching_obstacle_reconnaissance_desc:0 "Reconnaissance records obstacles, approaches and defended crossing points before the assault."
 mdcw_assault_breaching_crossing_teams:0 "Crossing Teams"
 mdcw_assault_breaching_crossing_teams_desc:0 "Assault troops rehearse their crossing sequence and the formation of a bridgehead."
 mdcw_assault_breaching_breaching_lanes:0 "Breaching Lanes"
 mdcw_assault_breaching_breaching_lanes_desc:0 "Assault groups train to advance through selected lanes against defended positions."
 mdcw_assault_breaching_assault_echelon:0 "Assault Echelon"
 mdcw_assault_breaching_assault_echelon_desc:0 "The leading infantry echelon concentrates its supporting weapons at the penetration point."
 mdcw_assault_breaching_bridgehead_coordination:0 "Bridgehead Coordination"
 mdcw_assault_breaching_bridgehead_coordination_desc:0 "Follow-up troops maintain the assault timetable and consolidate the lodgement."
 SUBDOCTRINE_MDCW_KEY_ZONE_DEFENCE:0 "Key Zone Defence"
 SUBDOCTRINE_MDCW_KEY_ZONE_DEFENCE_DESC:0 "Austria's Raumverteidigung prepared key routes for defence. Forts and river positions support local resistance, but moving these defenders disrupts their organisation. An alternative to Territorial Defence Forces."
 mdcw_key_zone_defence_prepared_blocking_positions:0 "Prepared Blocking Positions"
 mdcw_key_zone_defence_prepared_blocking_positions_desc:0 "Reconnoitred blocking positions provide a prepared base for local defence."
 mdcw_key_zone_defence_defended_passes:0 "Defended Passes"
 mdcw_key_zone_defence_defended_passes_desc:0 "Foot infantry organises the defence of hill routes and mountain passes."
 mdcw_key_zone_defence_local_observation_posts:0 "Local Observation Posts"
 mdcw_key_zone_defence_local_observation_posts_desc:0 "Concealed observation posts watch the approaches to occupied defensive positions."
 mdcw_key_zone_defence_covered_obstacles:0 "Covered Obstacles"
 mdcw_key_zone_defence_covered_obstacles_desc:0 "Foot infantry covers prepared fortifications and river obstacles with mutually supporting fire."
 mdcw_key_zone_defence_continued_local_resistance:0 "Continued Local Resistance"
 mdcw_key_zone_defence_continued_local_resistance_desc:0 "Local defence plans provide alternate positions and orders for continuing resistance under pressure."
 SUBDOCTRINE_MDCW_COASTAL_DENIAL:0 "Coastal Denial"
 SUBDOCTRINE_MDCW_COASTAL_DENIAL_DESC:0 "Swedish coastal-defence planning in the 1950s combined protected batteries, local observation and mobile reserves. Troops contest a landing before a bridgehead forms, trading offensive breakthrough for specialised coastal upkeep."
 mdcw_coastal_denial_coastal_alert_plans:0 "Coastal Alert Plans"
 mdcw_coastal_denial_coastal_alert_plans_desc:0 "Local units occupy prepared positions promptly when a landing threatens."
 mdcw_coastal_denial_protected_coastal_batteries:0 "Protected Coastal Batteries"
 mdcw_coastal_denial_protected_coastal_batteries_desc:0 "Protected battery positions sustain the fire of existing coastal fortifications."
 mdcw_coastal_denial_defended_landing_sectors:0 "Defended Landing Sectors"
 mdcw_coastal_denial_defended_landing_sectors_desc:0 "Defensive plans coordinate the troops covering likely landing sectors."
 mdcw_coastal_denial_local_counterattack_reserves:0 "Local Counterattack Reserves"
 mdcw_coastal_denial_local_counterattack_reserves_desc:0 "Ready reserves reinforce threatened sectors before the attacker consolidates ashore."
 mdcw_coastal_denial_integrated_beach_defence:0 "Integrated Beach Defence"
 mdcw_coastal_denial_integrated_beach_defence_desc:0 "Infantry and coastal defenders combine their resistance against the landing force."
 SUBDOCTRINE_MDCW_OPPOSING_FORCE_EXERCISES:0 "Opposing Force Exercises"
 SUBDOCTRINE_MDCW_OPPOSING_FORCE_EXERCISES_DESC:0 "An active opposing force and structured reviews expose weaknesses in field training. The National Training Center, operational in 1981, became a later instrumented model. Such proficiency needs more training time and personnel."
 mdcw_opposing_force_exercises_dedicated_opposing_units:0 "Dedicated Opposing Units"
 mdcw_opposing_force_exercises_dedicated_opposing_units_desc:0 "An organised opposing force challenges the coordination of the entire formation."
 mdcw_opposing_force_exercises_after_action_reviews:0 "After Action Reviews"
 mdcw_opposing_force_exercises_after_action_reviews_desc:0 "Units examine their performance and turn the experience of participants into shared practice."
 mdcw_opposing_force_exercises_continuous_field_exercises:0 "Continuous Field Exercises"
 mdcw_opposing_force_exercises_continuous_field_exercises_desc:0 "Exercises continue through darkness to expose failures hidden by daylight training."
 mdcw_opposing_force_exercises_combined_arms_evaluation:0 "Combined Arms Evaluation"
 mdcw_opposing_force_exercises_combined_arms_evaluation_desc:0 "Commanders evaluate the organisation and cooperation of their subordinate elements in the field."
 mdcw_opposing_force_exercises_corrective_training_cycles:0 "Corrective Training Cycles"
 mdcw_opposing_force_exercises_corrective_training_cycles_desc:0 "Follow-up exercises revisit the weaknesses identified during each evaluation."
 SUBDOCTRINE_MDCW_MISSION_REHEARSAL:0 "Mission Rehearsal"
 SUBDOCTRINE_MDCW_MISSION_REHEARSAL_DESC:0 "Egyptian preparations for the Suez crossing in 1973 demonstrated the value of repeated mission practice. Specialist formations rehearse routes, timings and assaults, gaining proficiency through longer and more expensive training."
 mdcw_mission_rehearsal_full_scale_rehearsals:0 "Full Scale Rehearsals"
 mdcw_mission_rehearsal_full_scale_rehearsals_desc:0 "Special forces practise complete missions with their supporting elements."
 mdcw_mission_rehearsal_detailed_assault_plans:0 "Detailed Assault Plans"
 mdcw_mission_rehearsal_detailed_assault_plans_desc:0 "The force prepares routes, timings and contingencies for the intended operation."
 mdcw_mission_rehearsal_night_rehearsals:0 "Night Rehearsals"
 mdcw_mission_rehearsal_night_rehearsals_desc:0 "Night rehearsals establish recognition, navigation and control procedures before combat."
 mdcw_mission_rehearsal_specialist_assault_drills:0 "Specialist Assault Drills"
 mdcw_mission_rehearsal_specialist_assault_drills_desc:0 "Special forces repeat the actions required at the decisive point of the assault."
 mdcw_mission_rehearsal_repeated_mission_cycles:0 "Repeated Mission Cycles"
 mdcw_mission_rehearsal_repeated_mission_cycles_desc:0 "Repeated preparation reinforces the organisation of specialist units and the work of their planners."
 SUBDOCTRINE_MDCW_INSTITUTIONAL_COMBAT_LEARNING:0 "Institutional Combat Learning"
 SUBDOCTRINE_MDCW_INSTITUTIONAL_COMBAT_LEARNING_DESC:0 "Korean and Vietnam War lessons systems preceded the permanent Center for Army Lessons Learned established in 1985. Reports and instructor exchanges spread operational experience, requiring evaluation staff and additional training."
 mdcw_institutional_combat_learning_combat_reports:0 "Combat Reports"
 mdcw_institutional_combat_learning_combat_reports_desc:0 "Structured reports preserve the experience of units returning from operations."
 mdcw_institutional_combat_learning_instructor_exchanges:0 "Instructor Exchanges"
 mdcw_institutional_combat_learning_instructor_exchanges_desc:0 "Experienced soldiers and instructors transfer practical knowledge between formations."
 mdcw_institutional_combat_learning_revised_field_manuals:0 "Revised Field Manuals"
 mdcw_institutional_combat_learning_revised_field_manuals_desc:0 "Reviewed operational experience informs the next set of field manuals and planning procedures."
 mdcw_institutional_combat_learning_reconstitution_studies:0 "Reconstitution Studies"
 mdcw_institutional_combat_learning_reconstitution_studies_desc:0 "The army studies how formations recover their organisation after sustained combat."
 mdcw_institutional_combat_learning_permanent_lessons_directorate:0 "Permanent Lessons Directorate"
 mdcw_institutional_combat_learning_permanent_lessons_directorate_desc:0 "A standing directorate collects experience and supports the development of operational methods."
 SUBDOCTRINE_MDCW_GUIDED_ANTI_ARMOUR_INTEGRATION:0 "Guided Anti Armour Integration"
 SUBDOCTRINE_MDCW_GUIDED_ANTI_ARMOUR_INTEGRATION_DESC:0 "Egyptian defence in 1973 combined infantry with prepared anti-tank positions. Guided weapons improve anti-armour fire, but specialist companies need costly upkeep and sacrifice soft-target fire and offensive breakthrough."
 mdcw_guided_anti_armour_integration_infantry_tank_hunter_teams:0 "Infantry Tank Hunter Teams"
 mdcw_guided_anti_armour_integration_infantry_tank_hunter_teams_desc:0 "Foot infantry practises finding and engaging armoured threats with its existing anti-tank weapons."
 mdcw_guided_anti_armour_integration_prepared_missile_positions:0 "Prepared Missile Positions"
 mdcw_guided_anti_armour_integration_prepared_missile_positions_desc:0 "Anti-tank companies prepare covered firing positions with clear engagement sectors."
 mdcw_guided_anti_armour_integration_coordinated_engagement_sectors:0 "Coordinated Engagement Sectors"
 mdcw_guided_anti_armour_integration_coordinated_engagement_sectors_desc:0 "Anti-tank crews coordinate their sectors to concentrate effective fire on armoured targets."
 mdcw_guided_anti_armour_integration_target_identification_teams:0 "Target Identification Teams"
 mdcw_guided_anti_armour_integration_target_identification_teams_desc:0 "Observers identify enemy vehicles and distinguish the most dangerous approaches."
 mdcw_guided_anti_armour_integration_integrated_infantry_anti_armour:0 "Integrated Infantry Anti Armour"
 mdcw_guided_anti_armour_integration_integrated_infantry_anti_armour_desc:0 "Infantry and specialist anti-tank companies practise mutually supporting engagements."
 SUBDOCTRINE_MDCW_COUNTERFIRE_COORDINATION:0 "Counterfire Coordination"
 SUBDOCTRINE_MDCW_COUNTERFIRE_COORDINATION_DESC:0 "Observers and early radars supported artillery in Vietnam; more capable networks followed later. Coordinated fire improves the guns, but needs more supply and exposes information through radar and radio emissions."
 mdcw_counterfire_coordination_target_acquisition_teams:0 "Target Acquisition Teams"
 mdcw_counterfire_coordination_target_acquisition_teams_desc:0 "Specialist teams combine observation and technical reports to locate firing positions."
 mdcw_counterfire_coordination_dispersed_gun_positions:0 "Dispersed Gun Positions"
 mdcw_counterfire_coordination_dispersed_gun_positions_desc:0 "Artillery units prepare dispersed positions and defensive arrangements for their guns."
 mdcw_counterfire_coordination_counterfire_control_centres:0 "Counterfire Control Centres"
 mdcw_counterfire_coordination_counterfire_control_centres_desc:0 "Fire-control staffs collate reports and coordinate the artillery available for the mission."
 mdcw_counterfire_coordination_surveyed_fire_networks:0 "Surveyed Fire Networks"
 mdcw_counterfire_coordination_surveyed_fire_networks_desc:0 "Surveyed positions and established reporting procedures shorten the preparation of fire plans."
 mdcw_counterfire_coordination_integrated_target_plotting:0 "Integrated Target Plotting"
 mdcw_counterfire_coordination_integrated_target_plotting_desc:0 "Common target plots link acquisition teams to the employment of the available artillery."
