 COLDWAR_KOR_pol_constitutional_dossier: "Constitutional Dossier"
 COLDWAR_KOR_pol_constitutional_dossier_desc: "Open the constitutional dossier to the cabinet, election commission and Assembly. An agreed record of current powers will give all lawful parties grounds to negotiate."
 COLDWAR_KOR_pol_rules_committee: "Charter Committee"
 COLDWAR_KOR_pol_rules_committee_desc: "Have the National Assembly designate a committee to compare the executive's current powers with proposed limitations. Shared drafting staff can reduce duplicate ministry reviews."
 COLDWAR_KOR_pol_charter_delegates: "Charter Delegates"
 COLDWAR_KOR_pol_charter_delegates_desc: "Invite the registered parliamentary parties and civic representatives to announce their terms for a revised charter. Each delegation will have to defend its demands in a negotiated text."
 COLDWAR_KOR_pol_electoral_register: "Electoral Register"
 COLDWAR_KOR_pol_electoral_register_desc: "Have the election commission reconcile district registration and publish the revised rolls ahead of the next ballot. This will reduce disputes that delay other business."
 COLDWAR_KOR_pol_campaign_finance: "Campaign Accounts"
 COLDWAR_KOR_pol_campaign_finance_desc: "Require candidates to publish a single campaign account and give the election commission authority to examine it. Accountants will need time and funding to follow donations and expenditure."
 COLDWAR_KOR_pol_direct_vote: "Presidential Ballot"
 COLDWAR_KOR_pol_direct_vote_desc: "Commit the negotiating parties to a ballot for the presidency held by the election commission. Direct election will give voters a clearer opportunity to settle the contest over executive authority."
 COLDWAR_KOR_pol_charter_vote: "Charter Referendum"
 COLDWAR_KOR_pol_charter_vote_desc: "Send the negotiated charter to the voters under the election commission's referendum procedure. The result will determine whether the parties have a basis for a new constitutional settlement."
 COLDWAR_KOR_pol_constitutional_settlement: "Ratify the Charter"
 COLDWAR_KOR_pol_constitutional_settlement_desc: "Give legal effect to the negotiated charter after an affirmative public vote. The agreed transition rules will govern the cabinet and the next election as soon as they take effect."
 COLDWAR_KOR_pol_provisional_cabinet: "Caretaker Cabinet"
 COLDWAR_KOR_pol_provisional_cabinet_desc: "Define what an interim cabinet may spend, appoint and sign while the presidency is vacant. Cabinet ministers will have a limited authority to maintain daily administration."
 COLDWAR_KOR_pol_term_limits: "Presidential Terms"
 COLDWAR_KOR_pol_term_limits_desc: "Fix the presidential term in law. The election timetable and inauguration must follow the agreed limits even when the incumbent's party would benefit from delay."
 COLDWAR_KOR_pol_handover_protocol: "Cabinet Handover"
 COLDWAR_KOR_pol_handover_protocol_desc: "Bind the outgoing cabinet to provide a complete record of orders and outstanding commitments to the incoming government. The election result will settle authority to appoint the successor."
 COLDWAR_KOR_pol_constitutional_review: "Constitutional Review"
 COLDWAR_KOR_pol_constitutional_review_desc: "Appoint the first bench for reviewing legislation and resolving constitutional disputes. Independent review gives the parties a route to settle jurisdictional disagreements."
 COLDWAR_KOR_pol_emergency_review: "Emergency Review"
 COLDWAR_KOR_pol_emergency_review_desc: "Require the cabinet to justify an emergency order to the Assembly and the courts before renewing it. A narrower emergency authority will make internal disputes less likely to erode civilian legitimacy."
 COLDWAR_KOR_pol_local_elections: "Local Elections"
 COLDWAR_KOR_pol_local_elections_desc: "Prepare elected councils to take up local administration. The national government will need to fund election staff and clarify which responsibilities move with the vote."
 COLDWAR_KOR_pol_registrar_network: "Election Offices"
 COLDWAR_KOR_pol_registrar_network_desc: "Standardize electoral forms, delivery rules and complaint deadlines among the district offices. Clear procedures will reduce the cost of training and dispatching staff for a nationwide poll."
 COLDWAR_KOR_pol_certify_election: "Certify the Election"
 COLDWAR_KOR_pol_certify_election_desc: "Publish the election commission's certification requirements for candidates and results. The established electoral calendar will determine when office passes to the winning candidate."
 COLDWAR_KOR_pol_park_mandate: "Developmental Cabinet"
 COLDWAR_KOR_pol_park_mandate_desc: "Convene the planning ministers and designate an official responsible for carrying each cabinet decision into effect. The presidency will gain an administrative staff for monitoring delivery."
 COLDWAR_KOR_pol_party_departments: "DRP Policy Secretariat"
 COLDWAR_KOR_pol_party_departments_desc: "Set up a permanent party secretariat for studying proposals and briefing the caucus. The presidency must support a larger party administration to keep the caucus informed."
 COLDWAR_KOR_pol_yushin_charter: "Yushin Charter"
 COLDWAR_KOR_pol_yushin_charter_desc: "Submit a charter that concentrates appointment and emergency powers in the presidency. The enlarged executive authority will put relations with critics and parliamentary parties under strain."
 COLDWAR_KOR_pol_emergency_decrees: "Emergency Decrees"
 COLDWAR_KOR_pol_emergency_decrees_desc: "Place emergency orders under the presidential secretariat. Its ability to coordinate agencies will strengthen the executive's hold on government while widening the dispute over civil rights."
 COLDWAR_KOR_pol_appointed_delegates: "Appointed Delegates"
 COLDWAR_KOR_pol_appointed_delegates_desc: "Reserve appointed representation for supporters of the constitutional order. This strengthens the government's floor management and gives outside observers grounds to question the Assembly's independence."
 COLDWAR_KOR_pol_managed_succession: "Managed Succession"
 COLDWAR_KOR_pol_managed_succession_desc: "Agree on the procedure for designating a successor if the president's office falls vacant. The party will have to decide who can keep the governing coalition together."
 COLDWAR_KOR_pol_presidential_secretariat: "Presidential Secretariat"
 COLDWAR_KOR_pol_presidential_secretariat_desc: "Consolidate the executive's provincial directives in a single presidential office. Shorter lines of authority will speed up appointments and require the cabinet to maintain a permanent review staff."
 COLDWAR_KOR_pol_constitutional_drp: "Constitutional DRP"
 COLDWAR_KOR_pol_constitutional_drp_desc: "Keep the Assembly in session and let it negotiate the scope of presidential powers. The DRP will remain able to govern if it secures the confidence of legislators outside its own caucus."
 COLDWAR_KOR_pol_assembly_bargain: "Assembly Bargain"
 COLDWAR_KOR_pol_assembly_bargain_desc: "Offer registered opposition groups time for amendments in return for votes on the budget. Negotiated bills will take longer to prepare and carry a broader mandate."
 COLDWAR_KOR_pol_civilian_succession: "Civilian Succession"
 COLDWAR_KOR_pol_civilian_succession_desc: "Let a caretaker ministry organize the next contest for the presidency under the electoral law. The ruling party will keep a candidate in the contest and respect the result."
 COLDWAR_KOR_pol_committee_controls: "Committee Controls"
 COLDWAR_KOR_pol_committee_controls_desc: "Require ministries to justify major instructions to standing committees. Public hearings will help the governing party defend its work and give legislators leverage over the pace of reform."
 COLDWAR_KOR_pol_planning_hearings: "Planning Hearings"
 COLDWAR_KOR_pol_planning_hearings_desc: "Ask the Economic Planning Board to explain its investment proposals at a recorded hearing. Earlier answers to budget objections will make it easier to authorize projects."
 COLDWAR_KOR_pol_performance_minutes: "Performance Minutes"
 COLDWAR_KOR_pol_performance_minutes_desc: "Record each ministry's implementation deadlines in the cabinet minutes and revise failed plans at monthly reviews. Project staff will gain earlier notice of delays."
 COLDWAR_KOR_pol_term_review: "Review the Presidency"
 COLDWAR_KOR_pol_term_review_desc: "Ask the party to assess the president's support and the risks of keeping the current constitutional timetable. A new ballot may be called when the agreed procedures allow one."
 COLDWAR_KOR_pol_premier_portfolio: "The Premier's Office"
 COLDWAR_KOR_pol_premier_portfolio_desc: "Give Kim Jong-pil's office responsibility for reconciling the ministries' legislative schedules. The prime minister can mediate disagreements before bills reach the Assembly."
 COLDWAR_KOR_pol_coalition_terms: "Coalition Terms"
 COLDWAR_KOR_pol_coalition_terms_desc: "Set out which portfolios and bills the parties will share in government. Agreeing written terms reduces the risk of a sudden collapse and limits the cabinet's freedom to change course."
 COLDWAR_KOR_pol_provincial_bargain: "Provincial Bargain"
 COLDWAR_KOR_pol_provincial_bargain_desc: "Hear provincial requests before settling the cabinet's infrastructure priorities. Publishing a list of agreed contributions will ease approval of investments outside the capital."
 COLDWAR_KOR_pol_coalition_committee: "Coalition Committee"
 COLDWAR_KOR_pol_coalition_committee_desc: "Have party representatives review cabinet bills together before they reach a vote. The prime minister will be able to avoid duplicate amendments at the cost of giving coalition partners a veto over contested business."
 COLDWAR_KOR_pol_nominate_kjp: "Nominate Kim Jong-pil"
 COLDWAR_KOR_pol_nominate_kjp_desc: "Place Kim Jong-pil's name before the party committee when a presidential contest is called. The election commission will still determine the winner under the current constitution."
 COLDWAR_KOR_pol_kjp_civil_service: "Civil Service Compact"
 COLDWAR_KOR_pol_kjp_civil_service_desc: "Separate senior administrative posts from party appointments. A president with a reliable service will have less room to reward his own organizers."
 COLDWAR_KOR_pol_kjp_assembly: "Assembly Confidence"
 COLDWAR_KOR_pol_kjp_assembly_desc: "Agree to bring the annual budget and senior appointments before the Assembly. Confidence votes will test whether a presidential administration can last without exceptional powers."
 COLDWAR_KOR_pol_kjp_security_review: "Cabinet Security Review"
 COLDWAR_KOR_pol_kjp_security_review_desc: "Move agency mandates into the cabinet's ordinary review procedure. Concentrating on a smaller number of assignments will give ministers a clearer account of the services' work."
 COLDWAR_KOR_pol_chun_cabinet: "Military Succession"
 COLDWAR_KOR_pol_chun_cabinet_desc: "Put the armed forces' request for an emergency succession before the sitting authorities. An authorization will carry conditions and draw the cabinet into the dispute over constitutional legitimacy."
 COLDWAR_KOR_pol_controlled_fifth: "Fifth Republic Charter"
 COLDWAR_KOR_pol_controlled_fifth_desc: "Secure a constitutional mandate for an indirectly elected executive. The new presidency gains a more dependable administration and inherits objections over the source of its authority."
 COLDWAR_KOR_pol_media_consolidation: "Media Consolidation"
 COLDWAR_KOR_pol_media_consolidation_desc: "Reduce the number of independent publishing and broadcasting outlets through licensing. The official message will face less competition and the exchange of new ideas will narrow."
 COLDWAR_KOR_pol_command_council: "Command Council"
 COLDWAR_KOR_pol_command_council_desc: "Give senior commanders a continuing voice in executive decisions. Their participation can strengthen cohesion within the forces while weakening confidence in civilian institutions."
 COLDWAR_KOR_pol_civilian_ministers: "Civilian Ministers"
 COLDWAR_KOR_pol_civilian_ministers_desc: "Assign trained civilians to the economic and social ministries. Their appointments give the government a stronger administrative service while requiring the armed forces to share influence."
 COLDWAR_KOR_pol_stabilization_agenda: "Price Stabilization"
 COLDWAR_KOR_pol_stabilization_agenda_desc: "Tighten official credit and review public investment to reduce inflationary pressure. A lower borrowing premium will come at the expense of immediate industrial activity."
 COLDWAR_KOR_pol_formal_talks: "Constitutional Talks"
 COLDWAR_KOR_pol_formal_talks_desc: "Invite opposition representatives to discuss a constitutional amendment in public. The cabinet must trade some latitude in governing for participation in the negotiations."
 COLDWAR_KOR_pol_command_neutrality: "Command Neutrality"
 COLDWAR_KOR_pol_command_neutrality_desc: "Make promotion and assignment rules binding on the incoming command. Officers will have less freedom to negotiate political terms with their own units."
 COLDWAR_KOR_pol_june_declaration: "June Declaration"
 COLDWAR_KOR_pol_june_declaration_desc: "Commit the government to direct presidential election and a negotiated rights settlement. The election authority will have time to prepare a competitive ballot under the new terms."
 COLDWAR_KOR_pol_nominate_roh: "Nominate Roh Tae-woo"
 COLDWAR_KOR_pol_nominate_roh_desc: "Offer Roh Tae-woo as the governing party's candidate under the direct election agreement. The party must accept the election commission's timetable and result."
 COLDWAR_KOR_pol_sixth_republic: "Sixth Republic"
 COLDWAR_KOR_pol_sixth_republic_desc: "Implement the new balance of power between the elected presidency and the Assembly. A term limited in law will give rivals more confidence that they can compete for office."
 COLDWAR_KOR_pol_northern_opening: "Northern Opening"
 COLDWAR_KOR_pol_northern_opening_desc: "Instruct diplomats to open contacts with socialist capitals and explain the policy to the established allies. Trade inquiries can now be handled alongside the government's security commitments."
 COLDWAR_KOR_pol_constitutional_officers: "Professional Officers"
 COLDWAR_KOR_pol_constitutional_officers_desc: "Publish standards for qualifications and appointments to senior command. Professional officers can work under civilian ministers and will cost more to prepare."
 COLDWAR_KOR_pol_labor_recognition: "Recognize Bargaining"
 COLDWAR_KOR_pol_labor_recognition_desc: "Recognize lawful unions and offer an institutional route to settle wage and workplace disputes. The new machinery raises expectations of government support for social insurance."
 COLDWAR_KOR_pol_party_merger: "Conservative Merger"
 COLDWAR_KOR_pol_party_merger_desc: "Ask conservative party committees to approve a joint parliamentary caucus and leadership rules. The combined group can pass bills more easily and will need to answer objections from its provincial organizers."
 COLDWAR_KOR_pol_provincial_councils: "Provincial Councils"
 COLDWAR_KOR_pol_provincial_councils_desc: "Give elected local councillors the ability to scrutinize development spending. Projects with local backing will be easier to authorize and require a wider administrative service."
 COLDWAR_KOR_pol_peninsula_channel: "Peninsula Channel"
 COLDWAR_KOR_pol_peninsula_channel_desc: "Prepare civilian officials to take part in contacts with the North when a legitimate negotiating channel opens. Government authorization can support an offer when both sides are ready."
 COLDWAR_KOR_pol_constitutional_exit: "Orderly Transfer"
 COLDWAR_KOR_pol_constitutional_exit_desc: "Publish the outgoing cabinet's timetable for handing authority to the next elected president. A clear transfer gives the armed forces and ministries time to prepare for new instructions."
 COLDWAR_KOR_pol_opposition_forum: "Opposition Forum"
 COLDWAR_KOR_pol_opposition_forum_desc: "Bring lawful opposition caucuses and civic groups together to set common constitutional demands. Registration will let local assemblies and associations participate in open debate."
 COLDWAR_KOR_pol_ndp_caucus: "NDP Caucus"
 COLDWAR_KOR_pol_ndp_caucus_desc: "Give the older opposition caucus staff to prepare questions and amendments. Parliamentary conservatives can offer an alternative without disrupting preparations for constitutional talks."
 COLDWAR_KOR_pol_ndp_committee_seats: "Committee Seats"
 COLDWAR_KOR_pol_ndp_committee_seats_desc: "Reserve committee seats for the older opposition caucus and other registered groups. Independent review will increase the credibility of legislation and require additional staff."
 COLDWAR_KOR_pol_student_forums: "Campus Forums"
 COLDWAR_KOR_pol_student_forums_desc: "Permit university assemblies to discuss proposed electoral and civil rights reforms. Regular public forums can preserve academic exchange and gather testimony outside party organizations."
 COLDWAR_KOR_pol_bar_associations: "Legal Defence Panels"
 COLDWAR_KOR_pol_bar_associations_desc: "Let lawyers collect files for a review of convictions incurred through political activity. Individuals whose proceedings were defective will have a route to seek relief under ordinary law."
 COLDWAR_KOR_pol_civic_petitions: "Civic Petition Register"
 COLDWAR_KOR_pol_civic_petitions_desc: "Establish a parliamentary register for signed petitions from civic associations. A common procedure will reduce the need for each ministry to investigate the same complaint."
 COLDWAR_KOR_pol_labour_solidarity: "Labour Solidarity"
 COLDWAR_KOR_pol_labour_solidarity_desc: "Recognize labour delegates in civic campaigns for constitutional change. Workers will gain channels to raise grievances and expect the parties to support collective bargaining in office."
 COLDWAR_KOR_pol_coalition_ballot: "Joint Candidate Talks"
 COLDWAR_KOR_pol_coalition_ballot_desc: "Open talks on a common opposition candidacy. Parties must settle endorsements and policy commitments before presenting an agreed name to voters."
 COLDWAR_KOR_pol_separate_campaigns: "Separate Campaigns"
 COLDWAR_KOR_pol_separate_campaigns_desc: "Allow the opposition parties to argue their own programmes at the polls. The electorate will have distinct choices and rival campaigns will require separate organizers."
 COLDWAR_KOR_pol_publish_rights: "Civil Rights Platform"
 COLDWAR_KOR_pol_publish_rights_desc: "Agree that competing parties can meet, campaign and circulate proposals under ordinary law. Publishing the platform will help voters judge whether a constitutional change meets those commitments."
 COLDWAR_KOR_pol_candidate_young_sam: "Kim Young-sam Ticket"
 COLDWAR_KOR_pol_candidate_young_sam_desc: "Invite Kim Young-sam to contest the presidency on a civilian reform programme if the nominating parties support him. Voters will decide whether he can form the next administration."
 COLDWAR_KOR_pol_candidate_dae_jung: "Nominate Kim Dae-jung"
 COLDWAR_KOR_pol_candidate_dae_jung_desc: "Offer Kim Dae-jung the opportunity to lead a campaign for political liberties and broader social protection. His nomination puts those proposals before the electorate."
 COLDWAR_KOR_pol_ys_civilian_cabinet: "Civilian Appointments"
 COLDWAR_KOR_pol_ys_civilian_cabinet_desc: "Apply civilian appointment rules to ministries previously dependent on command networks. The president can assemble an administration that answers directly to elected institutions."
 COLDWAR_KOR_pol_ys_retire_officers: "Retire Political Officers"
 COLDWAR_KOR_pol_ys_retire_officers_desc: "Move officers with political posts out of active line commands through scheduled retirements. Civilian authority will gain credibility while the forces adjust to a change in senior personnel."
 COLDWAR_KOR_pol_ys_asset_register: "Public Asset Register"
 COLDWAR_KOR_pol_ys_asset_register_desc: "Require senior officials to disclose property and financial interests. A permanent office must maintain the register and follow up discrepancies identified by the Assembly."
 COLDWAR_KOR_pol_ys_real_name_accounts: "Real-Name Accounts"
 COLDWAR_KOR_pol_ys_real_name_accounts_desc: "Require financial institutions to identify the beneficial account holder before accepting deposits or transfers. Compliance will improve the state's ability to trace irregular funds and raise near-term financing costs."
 COLDWAR_KOR_pol_ys_reform_tenders: "Open Public Tenders"
 COLDWAR_KOR_pol_ys_reform_tenders_desc: "Publish bids and award criteria for ministries' construction contracts. More open competition can reduce investment prices while requiring procurement officers to keep fuller records."
 COLDWAR_KOR_pol_ys_civilian_security: "Civilian Security Review"
 COLDWAR_KOR_pol_ys_civilian_security_desc: "Require civilian ministers to review classified agency mandates and report misconduct through existing procedures. Defined powers will strengthen the government's ability to resist covert political pressure."
 COLDWAR_KOR_pol_ys_local_autonomy: "Local Autonomy"
 COLDWAR_KOR_pol_ys_local_autonomy_desc: "Transfer clearly specified administrative tasks to elected local authorities. Projects with an agreed division of responsibilities can proceed without repeated approval from Seoul."
 COLDWAR_KOR_pol_ys_trial_rules: "Transition Trials"
 COLDWAR_KOR_pol_ys_trial_rules_desc: "Allow prosecutors to examine previous abuses of executive authority under normal rules of evidence. Preparing cases will consume the president's legislative time and help establish accountability."
 COLDWAR_KOR_pol_ys_civilian_norms: "Civilian Norms"
 COLDWAR_KOR_pol_ys_civilian_norms_desc: "Agree a set of civilian appointment and reporting rules to apply to subsequent governments. Successors can rotate officials without reopening the question of who controls the state."
 COLDWAR_KOR_pol_dj_coalition: "Coalition Cabinet"
 COLDWAR_KOR_pol_dj_coalition_desc: "Negotiate ministerial responsibilities with the coalition parties before the first budget. The agreement will secure votes for legislation while limiting the cabinet's ability to revise its commitments unilaterally."
 COLDWAR_KOR_pol_dj_restructuring: "Restructuring Council"
 COLDWAR_KOR_pol_dj_restructuring_desc: "Bring creditors, firms and government officials together to agree transparent rules for restructuring liabilities. Tighter standards make some projects uneconomic while lowering the premium on new public borrowing."
 COLDWAR_KOR_pol_dj_tripartite_pact: "Tripartite Pact"
 COLDWAR_KOR_pol_dj_tripartite_pact_desc: "Give labour, employers and government equal standing in consultations on restructuring. Workers' support depends on credible protection for households facing redundancy."
 COLDWAR_KOR_pol_dj_livelihood_bill: "Livelihood Protection"
 COLDWAR_KOR_pol_dj_livelihood_bill_desc: "Bring a minimum income guarantee and transparent eligibility rules before the Assembly. The Treasury will have to fund more claims when household income falls."
 COLDWAR_KOR_pol_dj_health_integration: "Health Fund Review"
 COLDWAR_KOR_pol_dj_health_integration_desc: "Compare administration costs across insurance funds and agree interoperable enrolment records. Shared records can reduce repeat administration and make people expect easier access to treatment."
 COLDWAR_KOR_pol_dj_rights_review: "Rights Review"
 COLDWAR_KOR_pol_dj_rights_review_desc: "Ask the justice ministry to review politically sensitive detentions under ordinary procedure. A documented process improves confidence in civil rights and limits the scope for external agitation."
 COLDWAR_KOR_pol_dj_engagement: "Civilian Engagement"
 COLDWAR_KOR_pol_dj_engagement_desc: "Give civilian ministries a published mandate for dialogue and humanitarian contacts with the North. Any operating arrangement will have to come through an agreed channel."
 COLDWAR_KOR_pol_dj_information_agenda: "Information Agenda"
 COLDWAR_KOR_pol_dj_information_agenda_desc: "Make education and communications ministries prepare common standards for skills and public information. Universities and agencies will need resources for the transition."
 COLDWAR_KOR_pol_dj_reconciliation: "Reconciliation"
 COLDWAR_KOR_pol_dj_reconciliation_desc: "Agree transition guarantees with opposing parties and place them before the Assembly. A government reset has greater legitimacy when former adversaries can defend their rights under the new rules."
 COLDWAR_KOR_pol_usp_registration: "Socialist Registration"
 COLDWAR_KOR_pol_usp_registration_desc: "Bring the democratic socialists' petitions for lawful registration before the election authorities. A legal campaign gives Kim Chul a platform for trade union rights and parliamentary government."
 COLDWAR_KOR_pol_usp_cabinet: "Socialist Cabinet"
 COLDWAR_KOR_pol_usp_cabinet_desc: "Form a government around parliamentary consent, social insurance and freedom of association. The cabinet will need negotiated majorities for legislation that changes employer obligations."
 COLDWAR_KOR_pol_usp_bargaining: "Bargaining Rights"
 COLDWAR_KOR_pol_usp_bargaining_desc: "Protect procedures by which industrial unions and employers can negotiate binding terms. Public mediators will need resources to assist the parties when discussions break down."
 COLDWAR_KOR_pol_usp_works_councils: "Works Councils"
 COLDWAR_KOR_pol_usp_works_councils_desc: "Require large firms to consult elected employee councils on workplace practice. Recorded consultation can improve production standards and lengthen decisions on major expansions."
 COLDWAR_KOR_pol_usp_social_credit: "Social Investment Credit"
 COLDWAR_KOR_pol_usp_social_credit_desc: "Direct a share of policy lending to cooperative firms and local service providers. The state can reduce entry costs for their investments while accepting part of the credit risk."
 COLDWAR_KOR_pol_usp_insurance_compact: "Insurance Compact"
 COLDWAR_KOR_pol_usp_insurance_compact_desc: "Negotiate an insurance framework financed through contributions and public support. Eligible households will gain more secure coverage and the state will bear more of the annual cost."
 COLDWAR_KOR_pol_usp_health_portability: "Portable Health Cover"
 COLDWAR_KOR_pol_usp_health_portability_desc: "Let workers retain enrolment when they move between employers or provinces. Portable records reduce duplicate administration and expand demand for services."
 COLDWAR_KOR_pol_usp_coop_provinces: "Cooperative Provinces"
 COLDWAR_KOR_pol_usp_coop_provinces_desc: "Give provincial cooperatives a documented procedure for applying for public investment. Local sponsorship can make approvals easier while requiring officials to audit the resulting projects."
 COLDWAR_KOR_pol_usp_international: "Socialist International"
 COLDWAR_KOR_pol_usp_international_desc: "Maintain contacts with democratic socialists through their established international organizations. Those relationships can support open discussion of labour and social legislation."
 COLDWAR_KOR_pol_usp_pluralist_charter: "Pluralist Guarantees"
 COLDWAR_KOR_pol_usp_pluralist_charter_desc: "Put political competition and judicial review into the government's reform charter. A broad agreement gives social policies a prospect of surviving changes of cabinet."
 COLDWAR_KOR_pol_workers_congress: "Workers' Congress"
 COLDWAR_KOR_pol_workers_congress_desc: "Bring together revolutionary labour representatives to debate a common programme. A clear platform can organize supporters and widen the constitutional dispute."
 COLDWAR_KOR_pol_revolutionary_mandate: "Revolutionary Mandate"
 COLDWAR_KOR_pol_revolutionary_mandate_desc: "Seek political authority for the socialist programme through the revolutionary settlement. The new mandate will put the interim administration under immediate pressure to deliver."
 COLDWAR_KOR_pol_public_commissariat: "Economic Commissariat"
 COLDWAR_KOR_pol_public_commissariat_desc: "Organize ministries around the government's new programme and require officials to keep a common budget. Coordinated administration will limit ministerial discretion."
 COLDWAR_KOR_pol_worker_management: "Workplace Councils"
 COLDWAR_KOR_pol_worker_management_desc: "Give workplace councils a say in changes to production practice. Workers can improve the use of existing facilities while spending more time on decisions about expansion."
 COLDWAR_KOR_pol_revolutionary_accounts: "Public Holdings Accounts"
 COLDWAR_KOR_pol_revolutionary_accounts_desc: "Separate enterprise accounts from public lending and publish the Treasury's share of profits. Staff will need to reconcile the liabilities and maintain the new records."
 COLDWAR_KOR_pol_independent_south: "Southern Socialism"
 COLDWAR_KOR_pol_independent_south_desc: "Declare that the southern government's institutions will answer to a domestic charter. The new administration will need to obtain credit and trading relationships on its own terms."
 COLDWAR_KOR_pol_southern_credit: "Southern Reconstruction"
 COLDWAR_KOR_pol_southern_credit_desc: "Use existing domestic lenders to finance reconstruction under southern public oversight. The government gains lower project prices by retaining more of the borrowing risk."
 COLDWAR_KOR_pol_southern_charter: "Southern Ratification"
 COLDWAR_KOR_pol_southern_charter_desc: "Submit the proposed institutional settlement to the southern electorate. A ratified charter can provide a legal basis for labour councils and future elections."
 COLDWAR_KOR_pol_northern_orientation: "Northern Orientation"
 COLDWAR_KOR_pol_northern_orientation_desc: "Declare that negotiations with Pyongyang will be the government's foreign policy priority. The shift can open commercial contacts while exposing the southern cabinet to more political pressure."
 COLDWAR_KOR_pol_request_northern_compact: "Northern Talks"
 COLDWAR_KOR_pol_request_northern_compact_desc: "Authorize delegates to negotiate the terms of political cooperation with Pyongyang. They will need to secure replies through the established diplomatic channel."
 COLDWAR_KOR_pol_northern_planning: "Northern Planning Desk"
 COLDWAR_KOR_pol_northern_planning_desc: "Give planners a desk for comparing different industrial standards, power needs and financial obligations. Preparing a common proposal will require additional administrative resources."
 COLDWAR_KOR_pol_government_priorities: "Recovery Priorities"
 COLDWAR_KOR_pol_government_priorities_desc: "Publish a list of infrastructure projects to repair before authorizing further expansion. Accelerating repairs will place additional demand on public borrowing."
 COLDWAR_KOR_pol_southern_legal_order: "Reconstruction Charter"
 COLDWAR_KOR_pol_southern_legal_order_desc: "Require budget approval and judicial review under the agreed settlement. A clear legal order gives the government more time to execute reconstruction projects."
 COLDWAR_KOR_pol_agency_mandates: "Intelligence Mandates"
 COLDWAR_KOR_pol_agency_mandates_desc: "Define which ministry authorizes external intelligence, counterintelligence and policy analysis. Clear obligations improve coordination while requiring more staff to review requests."
 COLDWAR_KOR_pol_agency_resources: "Intelligence Funding"
 COLDWAR_KOR_pol_agency_resources_desc: "Appropriate funds for a new intelligence assignment and require the service to document where those resources go. A budget review will slow approval of larger upgrades."
 COLDWAR_KOR_pol_foreign_assessments: "Foreign Assessments"
 COLDWAR_KOR_pol_foreign_assessments_desc: "Ask the agency to produce regular assessments of foreign industries and diplomatic risks for the cabinet. A shared brief will make the service more useful to civilian ministers."
 COLDWAR_KOR_pol_security_coordination: "Security Coordination"
 COLDWAR_KOR_pol_security_coordination_desc: "Put coordination of domestic security under the intelligence director. The government will spend fewer resources resolving agency disputes and face more objections to its authority."
 COLDWAR_KOR_pol_warranted_operations: "Judicial Warrants"
 COLDWAR_KOR_pol_warranted_operations_desc: "Require the intelligence service to seek warrants for assignments that affect residents' legal rights. Judicial authorization gives the service a clearer basis for protection against external interference."
 COLDWAR_KOR_pol_agency_audits: "Intelligence Accounts"
 COLDWAR_KOR_pol_agency_audits_desc: "Submit classified expenditure to a small committee with access to the supporting records. Independent review limits opportunities to misuse public funds and increases administrative work."
 COLDWAR_KOR_pol_case_archives: "Preserve Case Records"
 COLDWAR_KOR_pol_case_archives_desc: "Transfer case records to a secure archival office under instructions that preserve evidence. The review commission will need the files to reconstruct past conduct and hear appeals."
 COLDWAR_KOR_pol_independent_inquiry: "Independent Inquiry"
 COLDWAR_KOR_pol_independent_inquiry_desc: "Give an independent commission authority to examine politically sensitive cases and recommend changes to safeguards. The government will need to answer for the findings in the Assembly."
 COLDWAR_KOR_pol_media_registry: "Broadcasting Register"
 COLDWAR_KOR_pol_media_registry_desc: "Publish the conditions under which broadcasters obtain and renew licences. A common register will let municipalities and ministries apply the same rules."
 COLDWAR_KOR_pol_executive_licensing: "Executive Licensing"
 COLDWAR_KOR_pol_executive_licensing_desc: "Place sensitive broadcasting licences under executive review. Official information will be easier to coordinate and researchers and journalists will have fewer institutional channels to exchange news."
 COLDWAR_KOR_pol_public_briefings: "Public Briefings Office"
 COLDWAR_KOR_pol_public_briefings_desc: "Give ministries a common office for releasing statements and responding to questions. Clearer official schedules can speed coordination while drawing scrutiny of the government's control over distribution."
 COLDWAR_KOR_pol_independent_broadcasting: "Broadcast Commission"
 COLDWAR_KOR_pol_independent_broadcasting_desc: "Assign licensing and complaints to a board whose members have staggered terms. Editorial autonomy will require a permanent office capable of explaining its rulings."
 COLDWAR_KOR_pol_editorial_rights: "Editorial Rights"
 COLDWAR_KOR_pol_editorial_rights_desc: "Give editors clear protections for reporting on public decisions and an appeal against administrative penalties. Publication can bring new ideas and evidence into policy debate."
 COLDWAR_KOR_pol_media_appeals: "Media Appeals"
 COLDWAR_KOR_pol_media_appeals_desc: "Publish an appeals procedure for licence and access disputes. Ministers will spend more time justifying their decisions and stations will have a way to seek redress."
 COLDWAR_KOR_pol_public_service: "Public Service Rules"
 COLDWAR_KOR_pol_public_service_desc: "Publish common rules for public recruitment and promotion within the civil service. A stable appointment procedure will make it easier to retain trained administrators."
 COLDWAR_KOR_pol_professional_exams: "Civil Service Exams"
 COLDWAR_KOR_pol_professional_exams_desc: "Offer competitive examinations and a common course for successful applicants to public office. Ministries will gain transferable staff and help pay for training."
 COLDWAR_KOR_pol_procurement_register: "Procurement Register"
 COLDWAR_KOR_pol_procurement_register_desc: "Record the terms and deadlines of government purchasing in a common register. Applicants will be able to prepare compliant bids without repeated ministry consultations."
 COLDWAR_KOR_pol_competitive_tenders: "Tender Competition"
 COLDWAR_KOR_pol_competitive_tenders_desc: "Give procurement officers clear criteria for comparing bids and require publication of their decisions. Competition will put pressure on prices and add management work."
 COLDWAR_KOR_pol_conflicts_disclosure: "Conflicts of Interest"
 COLDWAR_KOR_pol_conflicts_disclosure_desc: "Require officials to declare interests before judging projects. Some decisions will take longer while substitutes are found and conflicts are documented."
 COLDWAR_KOR_pol_financial_inspection: "Financial Inspection"
 COLDWAR_KOR_pol_financial_inspection_desc: "Allow public auditors to trace irregular payments through ministry and supplier accounts. Better enforcement requires an office able to compare records and interview buying staff."
 COLDWAR_KOR_pol_assembly_audits: "Assembly Audits"
 COLDWAR_KOR_pol_assembly_audits_desc: "Present the auditor's results to the Assembly at fixed intervals. The public record will give citizens a way to see whether ministries correct recurring problems."
 COLDWAR_KOR_pol_administrative_court: "Administrative Review"
 COLDWAR_KOR_pol_administrative_court_desc: "Provide a regular venue for citizens to challenge administrative decisions. Resolving cases by rule will require judges and court staff while improving confidence in the civil service."
 COLDWAR_KOR_pol_citizen_petitions: "Public Complaints"
 COLDWAR_KOR_pol_citizen_petitions_desc: "Appoint a public office to route complaints and request documents from ministries before litigation. Earlier review can settle routine matters more cheaply."
 COLDWAR_KOR_pol_municipal_finance: "Municipal Accounts"
 COLDWAR_KOR_pol_municipal_finance_desc: "Give elected and appointed local authorities a common way to record grants and debt. Published accounts improve readiness for public projects and require a regional audit staff."
 COLDWAR_KOR_pol_records_standards: "Records Standards"
 COLDWAR_KOR_pol_records_standards_desc: "Use compatible record formats across ministries and make statistical series available for lawful analysis. Easier access reduces record keeping costs and supports public research."
 COLDWAR_KOR_pol_enforcement_review: "Enforcement Review"
 COLDWAR_KOR_pol_enforcement_review_desc: "Require ministers to respond formally to audits and court findings. A consistent review makes misuse of public resources harder to conceal and limits executive discretion."
 COLDWAR_KOR_kist_research_mandate: "KIST Research Mandate"
 COLDWAR_KOR_kist_research_mandate_desc: "Expand the Korea Institute of Science and Technology at Hongneung. Fund permanent research teams and equip the laboratories to solve production problems submitted by Korean manufacturers."
 COLDWAR_KOR_research_contracts: "Research Contracts"
 COLDWAR_KOR_research_contracts_desc: "Commission the Korea Institute of Science and Technology to test industrial equipment and adapt production processes for Korean firms. Public contracts will fund the trials needed to bring promising designs into production."
 COLDWAR_KOR_daedeok_research_park: "Daedeok Research Park"
 COLDWAR_KOR_daedeok_research_park_desc: "Build a research campus at Daedeok near Taejon. Shared laboratories and technical services will give public institutes the facilities to carry out larger research programmes."
 COLDWAR_KOR_national_rd_grants: "National R&D Grants"
 COLDWAR_KOR_national_rd_grants_desc: "Fund joint projects between universities, public institutes and manufacturers under the Ministry of Science and Technology. Give research teams the resources and time to carry complex projects through to completion."
 COLDWAR_KOR_kais_graduate_school: "KAIS Graduate School"
 COLDWAR_KOR_kais_graduate_school_desc: "Establish the Korea Advanced Institute of Science at Hongneung. Its graduate programmes will train engineers and applied scientists for Korean industry and public research institutes."
 COLDWAR_KOR_kaist_fellowships: "Graduate Fellowships"
 COLDWAR_KOR_kaist_fellowships_desc: "Award stipends to engineering students and fund supervised research appointments at KAIS. Retaining graduate talent will require a larger university budget."
 COLDWAR_KOR_kaist_faculty_return: "Returning Faculty"
 COLDWAR_KOR_kaist_faculty_return_desc: "Offer Korean researchers trained abroad laboratory appointments and the freedom to organise graduate seminars. The institute will pay for facilities and competitive research careers."
 COLDWAR_KOR_kaist_daedeok_campus: "KAIST at Daedeok"
 COLDWAR_KOR_kaist_daedeok_campus_desc: "Organise the expanded technical university around the Daedeok campus and consolidate graduate teaching and laboratory supervision. New degree programmes demand sustained staff and equipment funding."
 COLDWAR_KOR_vocational_training_centres: "Vocational Centres"
 COLDWAR_KOR_vocational_training_centres_desc: "Extend training workshops for school leavers entering machine trades. Fund instructors and provide practical courses to firms that cannot run their own schools."
 COLDWAR_KOR_technical_qualifications: "Technical Qualifications"
 COLDWAR_KOR_technical_qualifications_desc: "Standardise the examinations and occupational certificates introduced under the national technical qualifications system. Common standards let firms recognise skills across regions."
 COLDWAR_KOR_employer_training_levy: "Employer Training Levy"
 COLDWAR_KOR_employer_training_levy_desc: "Require larger employers to provide certified instruction or contribute to an industry training fund. Joint workshops spread the cost of expensive training equipment."
 COLDWAR_KOR_polytechnic_network: "Polytechnic Network"
 COLDWAR_KOR_polytechnic_network_desc: "Connect advanced trade colleges with regional firms. Modular courses will help technicians qualify for maintenance and production supervision as machinery changes."
 COLDWAR_KOR_grid_dispatch: "National Grid Dispatch"
 COLDWAR_KOR_grid_dispatch_desc: "Coordinate grid dispatch and metering between regional utilities. Better load scheduling reduces waste while maintaining a central control service."
 COLDWAR_KOR_chungcheong_substations: "Chungcheong Grid"
 COLDWAR_KOR_chungcheong_substations_desc: "Install high-voltage substations in Chungcheong to carry power from regional generators to expanding industrial districts."
 COLDWAR_KOR_regional_grid: "Regional Grid Links"
 COLDWAR_KOR_regional_grid_desc: "Open transport and maintenance access along the interregional transmission corridors. The regional network will tie agricultural and industrial loads into common dispatch."
 COLDWAR_KOR_energy_efficiency: "Energy Conservation"
 COLDWAR_KOR_energy_efficiency_desc: "Establish conservation standards for factory motors and new appliances. Shared metering and equipment inspections will reduce wasted electricity."
 COLDWAR_KOR_thermal_reserve: "Thermal Reserve"
 COLDWAR_KOR_thermal_reserve_desc: "Add a thermal generating block in Yeongnam to support industrial demand when the grid is under pressure. Its operating costs follow the native fuel market."
 COLDWAR_KOR_fuel_stockpile: "Utility Fuel Reserves"
 COLDWAR_KOR_fuel_stockpile_desc: "Provide storage and scheduling for utility fuel deliveries. Public reserve management will reduce exposure to abrupt interruptions."
 COLDWAR_KOR_efficient_boilers: "Efficient Boilers"
 COLDWAR_KOR_efficient_boilers_desc: "Retrofit coal and oil boilers with common maintenance standards. Higher engineering and maintenance spending will improve fuel economy."
 COLDWAR_KOR_civil_nuclear_office: "Civil Nuclear Office"
 COLDWAR_KOR_civil_nuclear_office_desc: "Give the civilian atomic energy office a long-term power programme and a separate licensing function. Public laboratories will prepare technical reviews of proposed stations."
 COLDWAR_KOR_reactor_operator_school: "Reactor Operator School"
 COLDWAR_KOR_reactor_operator_school_desc: "Prepare civilian plant operators and train inspectors in the same reporting standards. The utility will share resources with reactor training programmes."
 COLDWAR_KOR_civil_nuclear_suppliers: "Civil Nuclear Suppliers"
 COLDWAR_KOR_civil_nuclear_suppliers_desc: "Qualify local contractors to build and service civilian station equipment. The electricity authority will fund testing and component inspection."
 COLDWAR_KOR_kori_commissioning: "Kori Commissioning"
 COLDWAR_KOR_kori_commissioning_desc: "Commission an additional civilian power reactor at Kori once licensed operators, grid access and fuel are in place. The station will draw routine fuel and maintenance from the native system."
 COLDWAR_KOR_civil_nuclear_inspection: "Civil Nuclear Inspection"
 COLDWAR_KOR_civil_nuclear_inspection_desc: "Give inspectors access to plant operating records and maintenance reports. A permanent inspections budget supports independent review and shutdown authority."
 COLDWAR_KOR_rural_extension: "Rural Extension Service"
 COLDWAR_KOR_rural_extension_desc: "Train extension officers to advise farms on crop yields, storage and water management. Rural offices will collect harvest records for local planning."
 COLDWAR_KOR_village_works: "Village Works Fund"
 COLDWAR_KOR_village_works_desc: "Pay for village roads and shared works proposed by local councils. Rural communities will provide labour and choose projects within a published grant schedule."
 COLDWAR_KOR_saemaul_administration: "Saemaul Administration"
 COLDWAR_KOR_saemaul_administration_desc: "Assign the Ministry of Home Affairs to coordinate village improvements and compare results between districts. Concentrating grants on selected projects requires a larger administrative service."
 COLDWAR_KOR_local_cooperative_charters: "Cooperative Charters"
 COLDWAR_KOR_local_cooperative_charters_desc: "Give local cooperatives control over purchasing and marketing plans. The ministry will publish terms for members who vote on the use of village funds."
 COLDWAR_KOR_saemaul_farm_roads: "Farm Access Roads"
 COLDWAR_KOR_saemaul_farm_roads_desc: "Connect farms to main roads and produce depots. County engineers will supervise contracts while village councils organise upkeep."
 COLDWAR_KOR_cooperative_marketing: "Cooperative Marketing"
 COLDWAR_KOR_cooperative_marketing_desc: "Pool grading, cold storage and bulk shipments through cooperative warehouses. Common marketing terms help farms reach urban buyers."
 COLDWAR_KOR_honam_farm_district: "Honam Land Works"
 COLDWAR_KOR_honam_farm_district_desc: "Improve drainage and field access in Honam so farmers can use larger equipment and maintain usable fields through wet seasons."
 COLDWAR_KOR_rural_policy_review: "Rural Policy Review"
 COLDWAR_KOR_rural_policy_review_desc: "Review village accounts and give districts a way to request a different administrative model. Complete public works will remain under local care."
 COLDWAR_KOR_workplace_standards: "Workplace Standards"
 COLDWAR_KOR_workplace_standards_desc: "Fund workplace inspectors and publish standard reports on injuries and hours. Early inspections will concentrate on larger plants and export workshops."
 COLDWAR_KOR_managed_labour_councils: "Workplace Councils"
 COLDWAR_KOR_managed_labour_councils_desc: "Place dispute settlement in ministry-supervised councils. Employers gain a regular channel for wage disputes while disputes that escape the councils can undermine public confidence."
 COLDWAR_KOR_tripartite_labour_pact: "Tripartite Labour Pact"
 COLDWAR_KOR_tripartite_labour_pact_desc: "Recognise represented unions and negotiate dispute procedures with employers. Fund mediation while keeping the right to bargain on wages and conditions."
 COLDWAR_KOR_factory_injury_cover: "Industrial Injury Cover"
 COLDWAR_KOR_factory_injury_cover_desc: "Extend industrial accident coverage and require employers to report injuries. A pooled fund supports rehabilitation and steady staffing at affected plants."
 COLDWAR_KOR_minimum_wage_board: "Minimum Wage Board"
 COLDWAR_KOR_minimum_wage_board_desc: "Set a common minimum wage through a statutory board. Higher wage floors reduce the taxable margin at some factories and raise household expectations."
 COLDWAR_KOR_labour_reform_review: "Labour Reform Review"
 COLDWAR_KOR_labour_reform_review_desc: "Review workplace council and bargaining arrangements. Existing inspection and injury coverage continue through a change in the dispute settlement model."
 COLDWAR_KOR_public_health_survey: "Public Health Survey"
 COLDWAR_KOR_public_health_survey_desc: "Survey rural and urban clinics and publish common service statistics. A national register will identify shortages and improve the allocation of existing staff."
 COLDWAR_KOR_occupational_health_funds: "Occupational Funds"
 COLDWAR_KOR_occupational_health_funds_desc: "Pool contributions in occupational insurance funds and agree a common employer reporting schedule. Workers and their families can claim against their enrolled fund."
 COLDWAR_KOR_national_health_insurer: "National Health Insurer"
 COLDWAR_KOR_national_health_insurer_desc: "Create a single national purchaser with a regional network of claims offices. Central billing requires additional public administration."
 COLDWAR_KOR_rural_health_posts: "Rural Health Posts"
 COLDWAR_KOR_rural_health_posts_desc: "Establish public health posts with nurses, referral transport and scheduled visits. Rural clinics can treat routine illnesses before emergency services are needed."
 COLDWAR_KOR_standard_claims: "Uniform Claims Schedule"
 COLDWAR_KOR_standard_claims_desc: "Publish common reimbursement rates and a register of eligible services. Hospitals and patients will use the same claims forms across regions."
 COLDWAR_KOR_universal_enrollment: "Universal Enrollment"
 COLDWAR_KOR_universal_enrollment_desc: "Extend insurance to self-employed urban and rural households. A public subsidy will cover households that cannot pay contributions."
 COLDWAR_KOR_insurer_reorganisation: "Insurer Reorganisation"
 COLDWAR_KOR_insurer_reorganisation_desc: "Review the finances of the insurance administration and permit a statutory change in pooling. Enrollment records and rural clinics will support either arrangement."
 COLDWAR_KOR_pension_actuary: "Pension Accounts"
 COLDWAR_KOR_pension_actuary_desc: "Create actuarial accounts for pension contributions and liabilities. Better registration will reduce duplicate claims and give the Assembly annual forecasts."
 COLDWAR_KOR_national_pension_scheme: "National Pensions"
 COLDWAR_KOR_national_pension_scheme_desc: "Enroll employees in contributory old-age insurance. Employers and workers will make regular contributions to support future benefits."
 COLDWAR_KOR_farm_pension_enrollment: "Farm Pension Enrollment"
 COLDWAR_KOR_farm_pension_enrollment_desc: "Extend contribution registration to farmers and fishers whose incomes vary over the year. Local offices will determine contributions with a simplified income schedule."
 COLDWAR_KOR_portable_pension_records: "Portable Pensions"
 COLDWAR_KOR_portable_pension_records_desc: "Make contribution records portable across employers and districts. A shared register will protect accrued rights while reducing reconciliation work."
 COLDWAR_KOR_employment_register: "Employment Register"
 COLDWAR_KOR_employment_register_desc: "Register job openings and workers through local employment offices. Employers gain a common channel for hiring trained workers."
 COLDWAR_KOR_employment_insurance: "Employment Insurance"
 COLDWAR_KOR_employment_insurance_desc: "Introduce contribution-based unemployment insurance with work search requirements. Regional officers will handle eligibility and claims."
 COLDWAR_KOR_midcareer_training: "Midcareer Training"
 COLDWAR_KOR_midcareer_training_desc: "Offer short retraining courses for workers changing employers. Courses will be commissioned against vacancies reported by regional firms."
 COLDWAR_KOR_reemployment_service: "Reemployment Service"
 COLDWAR_KOR_reemployment_service_desc: "Assign workers receiving unemployment benefits to local advisers. Advisers will match training and vacancies before extending support."
 COLDWAR_KOR_household_needs_register: "Household Register"
 COLDWAR_KOR_household_needs_register_desc: "Record household income and the cost of essentials through local offices. Common eligibility records will let assistance reach households in urgent need."
 COLDWAR_KOR_livelihood_protection: "Livelihood Protection"
 COLDWAR_KOR_livelihood_protection_desc: "Fund minimum cash and food assistance for households on local registers. Municipal offices will check claims and explain payment rules."
 COLDWAR_KOR_crisis_relief_fund: "Crisis Relief Fund"
 COLDWAR_KOR_crisis_relief_fund_desc: "Provide temporary household relief during an economic crisis. The treasury will meet exceptional claims while employment and tax receipts recover."
 COLDWAR_KOR_basic_livelihood_guarantee: "Livelihood Guarantee"
 COLDWAR_KOR_basic_livelihood_guarantee_desc: "Set minimum support as a legal entitlement and establish an appeals process. The state will provide help with subsistence and access to employment programmes."
 COLDWAR_KOR_school_district_plans: "School District Plans"
 COLDWAR_KOR_school_district_plans_desc: "Publish classroom and enrolment plans by district. Better timetables will make fuller use of teachers and classrooms."
 COLDWAR_KOR_rural_teacher_service: "Rural Teacher Service"
 COLDWAR_KOR_rural_teacher_service_desc: "Offer teacher housing and regular placements in rural schools. Additional instructors will help districts with rapidly rising enrolment."
 COLDWAR_KOR_secondary_school_access: "Secondary School Access"
 COLDWAR_KOR_secondary_school_access_desc: "Expand access to secondary schools and ease the shortage of classrooms in growing cities. Teacher recruitment and school provision require a durable commitment."
 COLDWAR_KOR_curriculum_revision: "Curriculum Revision"
 COLDWAR_KOR_curriculum_revision_desc: "Update science and mathematics curricula and publish common laboratory standards. Schools will order new materials and train teachers to use them."
 COLDWAR_KOR_adult_learning_centres: "Adult Learning Centres"
 COLDWAR_KOR_adult_learning_centres_desc: "Establish evening classes for workers who did not complete secondary education. Local councils will provide shared classrooms and learning materials."
 COLDWAR_KOR_school_funding_formula: "School Funding Formula"
 COLDWAR_KOR_school_funding_formula_desc: "Allocate school funds by enrolment, teaching load and regional need. A separate audit service will verify returns and supervise distribution."
 COLDWAR_KOR_roads_authority: "Roads Authority"
 COLDWAR_KOR_roads_authority_desc: "Give the roads authority a national survey and a maintenance budget. The survey will align provincial works with industrial and port traffic."
 COLDWAR_KOR_gyeongbu_corridor: "Gyeongbu Corridor"
 COLDWAR_KOR_gyeongbu_corridor_desc: "Complete road connections between Seoul and the southeast industrial districts. Linked construction schedules will reduce interruptions to freight movements."
 COLDWAR_KOR_honam_access: "Honam Road Access"
 COLDWAR_KOR_honam_access_desc: "Upgrade access from farming districts to trunk roads in Honam. Local crews will maintain the completed feeder network."
 COLDWAR_KOR_gyeongbu_rail: "Gyeongbu Rail Freight"
 COLDWAR_KOR_gyeongbu_rail_desc: "Build a dispatch and transfer terminal on the Gyeongbu railway. Consolidated freight movements will relieve pressure on railway yards serving the capital."
 COLDWAR_KOR_metropolitan_interchange: "Capital Rail Interchange"
 COLDWAR_KOR_metropolitan_interchange_desc: "Reorganise station transfers and freight dispatch in the capital region. Integrated scheduling will separate commuter movements from industrial traffic."
 COLDWAR_KOR_busan_container_terminal: "Pusan Container Port"
 COLDWAR_KOR_busan_container_terminal_desc: "Extend Busan port facilities for standardised containers. Shipping companies will gain access to more reliable loading and berthing capacity."
 COLDWAR_KOR_freight_documents: "Freight Documents"
 COLDWAR_KOR_freight_documents_desc: "Standardise consignment records and traffic scheduling between carriers. Common records simplify transfers from rail to road and onward to ports."
 COLDWAR_KOR_port_rail_coordination: "Port and Rail Links"
 COLDWAR_KOR_port_rail_coordination_desc: "Coordinate public rail and private port timetables for civilian freight. Keeping regular loading windows requires scheduling and maintenance staff."
 COLDWAR_KOR_tenancy_register: "Register Urban Leases"
 COLDWAR_KOR_tenancy_register_desc: "Registration makes tenancy deposits easier to verify and obliges municipal offices to maintain searchable records."
 COLDWAR_KOR_municipal_rental_housing: "Public Rental Housing"
 COLDWAR_KOR_municipal_rental_housing_desc: "Create permanent municipal offices to administer public rental sites, leases and repairs as cities absorb new households."
 COLDWAR_KOR_bundang_new_town: "Bundang New Town"
 COLDWAR_KOR_bundang_new_town_desc: "Lay roads and services for a planned satellite town. The first construction programme takes resources from other projects."
 COLDWAR_KOR_dunsan_administration: "Dunsan Civic District"
 COLDWAR_KOR_dunsan_administration_desc: "Locate administrative offices in Daejeon so municipal services can expand outside the capital region."
 COLDWAR_KOR_district_water_networks: "District Water Networks"
 COLDWAR_KOR_district_water_networks_desc: "Give municipal services a reliable water network and set aside money for pump operation and maintenance."
 COLDWAR_KOR_rental_deposit_guarantee: "Deposit Guarantees"
 COLDWAR_KOR_rental_deposit_guarantee_desc: "Insure qualifying tenant deposits through licensed providers. The public guarantee creates a contingent liability."
 COLDWAR_KOR_development_bank_ledger: "Review KDB Lending"
 COLDWAR_KOR_development_bank_ledger_desc: "Audit Korea Development Bank disbursements so project loans follow construction and equipment milestones. Reviews add administration."
 COLDWAR_KOR_credit_guarantee_fund: "SME Credit Guarantees"
 COLDWAR_KOR_credit_guarantee_fund_desc: "Use the Credit Guarantee Fund to share the risk of lending to firms without sufficient collateral. The state underwrites some losses."
 COLDWAR_KOR_policy_credit_sunset: "Sunset Directed Credit"
 COLDWAR_KOR_policy_credit_sunset_desc: "End routine rollovers of designated policy loans. Banks carry fewer directed exposures and firms face the cost of commercial credit."
 COLDWAR_KOR_bank_examination_office: "Inspect Bank Accounts"
 COLDWAR_KOR_bank_examination_office_desc: "Require regular inspections of bank balance sheets, connected borrowers and foreign currency liabilities."
 COLDWAR_KOR_provision_bad_loans: "Provision Bad Loans"
 COLDWAR_KOR_provision_bad_loans_desc: "Force banks to recognise doubtful loans early. Compliance tightens domestic credit while capital and provisions are restored."
 COLDWAR_KOR_unify_financial_supervision: "Unify Bank Oversight"
 COLDWAR_KOR_unify_financial_supervision_desc: "Put banking, securities and insurance supervision under one authority. Cross-market reporting requires permanent examiners."
 COLDWAR_KOR_deposit_insurance_board: "Insure Bank Deposits"
 COLDWAR_KOR_deposit_insurance_board_desc: "Establish a licensed-bank deposit insurer. Coverage protects savers but makes the public sector responsible for eligible claims."
 COLDWAR_KOR_debt_resolution_corporation: "Resolve Bad Assets"
 COLDWAR_KOR_debt_resolution_corporation_desc: "Transfer audited impaired assets to a resolution corporation. Banks regain room to restructure while proceeds and public carrying costs are settled."
 COLDWAR_KOR_crisis_imf_mission: "Seek an IMF Programme"
 COLDWAR_KOR_crisis_imf_mission_desc: "Request conditional external finance under a published recovery programme. The lending institution must approve disbursement and performance conditions."
 COLDWAR_KOR_recovery_exit_audit: "Audit Crisis Exit"
 COLDWAR_KOR_recovery_exit_audit_desc: "Publish a review of public bank guarantees, residual asset holdings and expenditure commitments so emergency measures can be retired."
 COLDWAR_KOR_telecommunications_operator: "Reform Korea Telecom"
 COLDWAR_KOR_telecommunications_operator_desc: "Give Korea Telecom an operating charter and a universal service remit. The government must audit service standards and regional coverage."
 COLDWAR_KOR_domestic_digital_switches: "Digital Exchanges"
 COLDWAR_KOR_domestic_digital_switches_desc: "Use domestic digital switching in telephone exchanges. Training and certification reduce integration delays, while expanded exchanges consume more electricity."
 COLDWAR_KOR_data_registry_programme: "Link Public Registers"
 COLDWAR_KOR_data_registry_programme_desc: "Link civil registers, customs and procurement through the National Basic Information System. Data centres require continuing power and staffing."
 COLDWAR_KOR_municipal_data_centre: "Municipal Data Centre"
 COLDWAR_KOR_municipal_data_centre_desc: "Provide a shared municipal data centre so agencies can maintain records and test common software without running separate networks."
 COLDWAR_KOR_domestic_software_standards: "Software Standards"
 COLDWAR_KOR_domestic_software_standards_desc: "Publish software interoperability rules for public procurement. Testing reduces duplicated engineering work and adds tender administration."
 COLDWAR_KOR_kii_capital_backbone: "Capital Data Network"
 COLDWAR_KOR_kii_capital_backbone_desc: "Build the capital leg of the Korea Information Infrastructure project and fund maintenance for the exchange and access network."
 COLDWAR_KOR_kii_regional_access: "Regional Broadband"
 COLDWAR_KOR_kii_regional_access_desc: "Extend network access into central Korea so firms and universities outside Seoul can connect to shared services."
 COLDWAR_KOR_mobile_network_licensing: "License Mobile Networks"
 COLDWAR_KOR_mobile_network_licensing_desc: "Issue performance-based mobile licences. Frequency planning and operator obligations require a standing regulatory budget."
 COLDWAR_KOR_electronic_signatures: "Electronic Signatures"
 COLDWAR_KOR_electronic_signatures_desc: "Give certified signatures legal effect for eligible filings. Firms must procure compliant equipment and certificates."
 COLDWAR_KOR_cyber_korea_strategy: "Cyber Korea 21"
 COLDWAR_KOR_cyber_korea_strategy_desc: "Fund public access, network skills and online administrative services. Wider use increases electricity and operating costs."
 COLDWAR_KOR_motion_picture_corporation: "Film Promotion"
 COLDWAR_KOR_motion_picture_corporation_desc: "Give the film promotion corporation a budget for training, preservation and production oversight."
 COLDWAR_KOR_film_school_workshops: "Film School Workshops"
 COLDWAR_KOR_film_school_workshops_desc: "Equip film workshops for sound, editing and camera work. Training benefits audiovisual technologies and adds operating costs."
 COLDWAR_KOR_screening_cooperatives: "Regional Screenings"
 COLDWAR_KOR_screening_cooperatives_desc: "Coordinate regional exhibitors and public screening schedules. Local organisers commit private capacity to meet coverage obligations."
 COLDWAR_KOR_broadcasting_archives: "Broadcasting Archives"
 COLDWAR_KOR_broadcasting_archives_desc: "Preserve broadcast recordings and train archivists in cataloguing and digital conversion. Storage and equipment raise running costs."
 COLDWAR_KOR_artists_rights_register: "Register Artists' Rights"
 COLDWAR_KOR_artists_rights_register_desc: "Give creators a registry for contracts and rights claims. The regulator must investigate disputes and keep ownership records current."
 COLDWAR_KOR_cultural_exports_office: "Cultural Export Office"
 COLDWAR_KOR_cultural_exports_office_desc: "Support subtitling, licensing and distribution at trade fairs. Maintaining market links requires permanent representation."
 COLDWAR_KOR_cultural_industries_act: "Cultural Industries Act"
 COLDWAR_KOR_cultural_industries_act_desc: "Place cultural industry grants, market development and reporting under a single legal framework. Officials remain accountable for grant allocation."
 COLDWAR_KOR_environmental_conservation_act: "Conservation Act"
 COLDWAR_KOR_environmental_conservation_act_desc: "Set national air and water standards and give the regulator authority to inspect plants and municipal facilities."
 COLDWAR_KOR_industrial_discharge_register: "Register Discharges"
 COLDWAR_KOR_industrial_discharge_register_desc: "Require industrial wastewater disclosures and verify effluent. Pollution controls take some capacity away from industrial output."
 COLDWAR_KOR_nakdong_intake_safeguards: "Protect Nakdong Intakes"
 COLDWAR_KOR_nakdong_intake_safeguards_desc: "Protect water intakes with sampling stations and reliable service links. Pumping and monitoring increase electricity demand."
 COLDWAR_KOR_priced_waste_bags: "Waste Bag Charges"
 COLDWAR_KOR_priced_waste_bags_desc: "Require official bags for residual waste and expand separate collection. Municipal income rises while households otherwise used to flat charges pay more."
 COLDWAR_KOR_efficiency_retrofit_fund: "Cleaner Plant Retrofits"
 COLDWAR_KOR_efficiency_retrofit_fund_desc: "Co-finance steam, heat and water retrofits in older plants. Installations interrupt production while equipment is replaced."
 COLDWAR_KOR_environmental_review_board: "Environmental Review"
 COLDWAR_KOR_environmental_review_board_desc: "Require major projects to publish water, air and waste assessments. Project design must reserve time for permits and corrective work."
 COLDWAR_KOR_defence_review: "Defence Review"
 COLDWAR_KOR_defence_review_desc: "The Ministry of National Defense will inventory the forces inherited at the start of the decade. The inquiry will identify the most urgent demands on the services and produce a joint statement of procurement priorities."
 COLDWAR_KOR_df_joint_chiefs: "Joint Chiefs Secretariat"
 COLDWAR_KOR_df_joint_chiefs_desc: "Give the Joint Chiefs a permanent planning office with service representation and responsibility for written estimates. The new headquarters will require personnel of its own."
 COLDWAR_KOR_df_joint_staff_map: "Joint Staff Planning"
 COLDWAR_KOR_df_joint_staff_map_desc: "Compile common maps and readiness tables so service plans can be checked against the same objectives and transport requirements. Headquarters will schedule joint planning exercises across the commands."
 COLDWAR_KOR_df_regional_depots: "Regional Supply Depots"
 COLDWAR_KOR_df_regional_depots_desc: "Consolidate the central defence depots along the routes used by all three services. Road and storage improvements will also help provincial industry move equipment."
 COLDWAR_KOR_df_common_supply_workshops: "Supply Standards"
 COLDWAR_KOR_df_common_supply_workshops_desc: "Require the services to use compatible inventories and stock identifiers. Common standards will reduce duplicate orders, while depots take on inspection and reporting duties."
 COLDWAR_KOR_df_joint_sustainment: "Joint Sustainment Plan"
 COLDWAR_KOR_df_joint_sustainment_desc: "Combine service maintenance schedules into a national mobilisation plan. The Ministry will reserve spare capacity for joint exercises and put contract renewals under a single calendar."
 COLDWAR_KOR_df_army_readiness: "Army Readiness"
 COLDWAR_KOR_df_army_readiness_desc: "Publish common readiness standards for the field army and reserve formations. Divisional commanders will be responsible for personnel records, equipment accounting and recurring readiness inspections."
 COLDWAR_KOR_df_division_training: "Divisional Training"
 COLDWAR_KOR_df_division_training_desc: "Set aside regular training periods for divisions to practise under a consistent evaluation programme. Sustainment and staff coordination will count towards their readiness grades."
 COLDWAR_KOR_df_infantry_trials: "Infantry Trials"
 COLDWAR_KOR_df_infantry_trials_desc: "Use Agency for Defense Development trial teams to compare the reliability and maintainability of infantry equipment during service testing. The trial programme will release validated production requirements to the Army."
 COLDWAR_KOR_df_field_communications: "Field Communications"
 COLDWAR_KOR_df_field_communications_desc: "Identify the radio and command requirements that divisional staffs share. Standardising equipment and staff instruction will ease coordination between formations raised in different districts."
 COLDWAR_KOR_df_capital_fortification: "Capital Defensive Works"
 COLDWAR_KOR_df_capital_fortification_desc: "Fund permanent defensive works in the capital district. The works will absorb land and construction capacity before entering the Army's ordinary maintenance programme."
 COLDWAR_KOR_df_mobile_readiness: "Mobile Formations"
 COLDWAR_KOR_df_mobile_readiness_desc: "Make mobile formations responsible for maintaining a trained reserve of drivers, mechanics and transport specialists. Mechanised units will run recurring readiness checks at additional personnel expense."
 COLDWAR_KOR_df_army_maintenance: "Maintenance Cadres"
 COLDWAR_KOR_df_army_maintenance_desc: "Form standing maintenance cadres for the field army to manage rotating spares and repair schedules. Inspectors will compare losses from equipment failure against divisional targets."
 COLDWAR_KOR_df_reserve_stockpiles: "Reserve Stores"
 COLDWAR_KOR_df_reserve_stockpiles_desc: "Place a first tranche of locally procured infantry equipment in centrally accounted reserve stores. Reservists will train with the same basic equipment issued to regular formations."
 COLDWAR_KOR_df_mechanized_establishment: "Mechanised Forces"
 COLDWAR_KOR_df_mechanized_establishment_desc: "Introduce a common establishment for armoured personnel carriers and infantry fighting vehicles. The Army will give selected workshops the staff and tools to turn standards into serviceable equipment."
 COLDWAR_KOR_df_army_capstone: "Army Modernisation"
 COLDWAR_KOR_df_army_capstone_desc: "Give the Army a permanent board to coordinate training, mechanical support and mobilisation demands. It will review readiness reports and move resources towards divisions that can absorb them."
 COLDWAR_KOR_df_air_staff: "Air Staff Expansion"
 COLDWAR_KOR_df_air_staff_desc: "Give the Air Force staff dedicated planners for airbases, flight training and flight dispatch. The Ministry will review service demands as a single annual programme."
 COLDWAR_KOR_df_pilot_schools: "Flight Training Schools"
 COLDWAR_KOR_df_pilot_schools_desc: "Create alternating ground-school and supervised flying terms for new aircrew. The syllabus will increase the hours assigned to navigation, weather and flight safety."
 COLDWAR_KOR_df_ground_crew: "Ground Crew Training"
 COLDWAR_KOR_df_ground_crew_desc: "Establish recurring qualifications for engine servicing, inspection and aircraft turnaround. The course will give air stations a consistent standard for identifying faults before dispatch."
 COLDWAR_KOR_df_national_radar: "Capital Radar Network"
 COLDWAR_KOR_df_national_radar_desc: "Expand the capital's air surveillance capacity at a dedicated radar station. The Air Force will maintain the site and integrate its observations with the national warning staff."
 COLDWAR_KOR_df_interception_syllabus: "Air Defence Syllabus"
 COLDWAR_KOR_df_interception_syllabus_desc: "Use air surveillance and standardised flight instruction to train interception squadrons. Flight commanders will consult the same readiness and weather reports before approving training sorties."
 COLDWAR_KOR_df_aircraft_overhaul: "Aircraft Overhaul"
 COLDWAR_KOR_df_aircraft_overhaul_desc: "Fund an overhaul capability for aircraft that spend too long away from their operating bases. Shared technical records will help mechanics schedule parts and engine inspections."
 COLDWAR_KOR_df_central_airfield: "Central Airfield Works"
 COLDWAR_KOR_df_central_airfield_desc: "Expand a central airfield to handle the service's training and maintenance demand. The new capacity will be folded into ordinary Air Force basing."
 COLDWAR_KOR_df_air_rescue: "Air Rescue Service"
 COLDWAR_KOR_df_air_rescue_desc: "Create a standing rescue and air transport training service to serve several bases. Crew instruction will prioritise navigation, weather and safe recovery."
 COLDWAR_KOR_df_central_aviation_fuel: "Aviation Fuel Reserves"
 COLDWAR_KOR_df_central_aviation_fuel_desc: "Place part of the air service's fuel reserve in a central storage installation. Routine readiness checks will confirm that fuel can be drawn without interrupting flight instruction."
 COLDWAR_KOR_df_air_readiness: "Integrated Air Readiness"
 COLDWAR_KOR_df_air_readiness_desc: "Give the Air Staff authority to allocate maintenance shifts and training hours around national readiness needs. Shared reports from airfields and radar stations will guide the annual review."
 COLDWAR_KOR_df_fleet_programme: "Fleet Programme"
 COLDWAR_KOR_df_fleet_programme_desc: "A programme for home waters establishes the fleet's role in defence planning and gives naval officers a voice in the annual estimates."
 COLDWAR_KOR_df_coastal_patrols: "Coastal Patrols"
 COLDWAR_KOR_df_coastal_patrols_desc: "Small ships can sustain a coastal presence while heavy units remain in port. The Navy must budget for the additional deployments and inspections."
 COLDWAR_KOR_df_maritime_schools: "Maritime Schools"
 COLDWAR_KOR_df_maritime_schools_desc: "Technical courses give recruits a route into the fleet's specialist ratings and produce instructors for subsequent intakes."
 COLDWAR_KOR_df_pusan_base_works: "Pusan Naval Base"
 COLDWAR_KOR_df_pusan_base_works_desc: "Pusan needs more capacity to support nearby units and maintain them between deployments. The works consolidate naval access to the harbour."
 COLDWAR_KOR_df_fleet_maintenance: "Fleet Maintenance"
 COLDWAR_KOR_df_fleet_maintenance_desc: "Fleet workshops will share standards for overhaul and inspection. More reliable ships come with a permanent requirement for shore personnel."
 COLDWAR_KOR_df_frigate_standardisation: "Fleet Frigates"
 COLDWAR_KOR_df_frigate_standardisation_desc: "A common frigate requirement reduces the number of classes the coastal fleet must support and creates a stable planning basis for future orders."
 COLDWAR_KOR_df_escort_command: "Escort Command"
 COLDWAR_KOR_df_escort_command_desc: "A standing escort command gives commercial convoys a regular naval counterpart and keeps the fleet practised in sustained escort duty."
 COLDWAR_KOR_df_merchant_lift: "Merchant Sealift"
 COLDWAR_KOR_df_merchant_lift_desc: "Reserve charters give the fleet a larger merchant lift at short notice. The government must keep the charter fund available between activations."
 COLDWAR_KOR_df_submarine_training: "Submarine School"
 COLDWAR_KOR_df_submarine_training_desc: "A permanent submarine school gives crews and shore teams a common training programme without removing the demand for patrol and escort officers."
 COLDWAR_KOR_df_fleet_support: "Fleet Support Command"
 COLDWAR_KOR_df_fleet_support_desc: "A support command consolidates the administration of the coastal fleet, escort groups and shore workshops under a common readiness standard."
 COLDWAR_KOR_df_mobilisation_register: "Reserve Register"
 COLDWAR_KOR_df_mobilisation_register_desc: "District records give the government a reliable picture of trained reservists and their civilian obligations before it changes the terms of service."
 COLDWAR_KOR_df_district_cadres: "District Reserve Cadres"
 COLDWAR_KOR_df_district_cadres_desc: "Paid district cadres keep reserve administration and refresher days operating between call-ups. Moving trained personnel into posts costs the defence budget each week."
 COLDWAR_KOR_df_nco_academy: "Career NCO Academy"
 COLDWAR_KOR_df_nco_academy_desc: "A permanent academy makes long-service non-commissioned officers responsible for training and standards within units."
 COLDWAR_KOR_df_technical_specialists: "Specialist Service"
 COLDWAR_KOR_df_technical_specialists_desc: "Long-service technical billets give maintenance and communications personnel a reason to stay. Retention allowances must be financed throughout the programme."
 COLDWAR_KOR_df_service_review: "Military Service Review"
 COLDWAR_KOR_df_service_review_desc: "The National Assembly can compare service-law options with the actual strength of the reserve and the need to retain skilled personnel."
 COLDWAR_KOR_df_procurement_authority: "Procurement Board"
 COLDWAR_KOR_df_procurement_authority_desc: "The armed services will submit common estimates for imports, licensed production and domestic development. Each route remains available where it meets Korean needs."
 COLDWAR_KOR_df_aid_accounting: "Military Aid Accounts"
 COLDWAR_KOR_df_aid_accounting_desc: "A single register will record equipment received, associated upkeep and Korean obligations. The services can then compare foreign assistance with domestic orders."
 COLDWAR_KOR_df_foreign_purchase_board: "Foreign Procurement"
 COLDWAR_KOR_df_foreign_purchase_board_desc: "A cleared purchase order lets the Army obtain replacement stocks from an established supplier and pays the supplier only when the order is accepted."
 COLDWAR_KOR_df_licensed_armaments: "Licensed Armaments"
 COLDWAR_KOR_df_licensed_armaments_desc: "Korean production can adopt an approved foreign licence while leaving room for local design. Domestic factories carry the obligations of licensed work as long as the programme is active."
 COLDWAR_KOR_df_domestic_arsenal: "Yeongnam Arsenal"
 COLDWAR_KOR_df_domestic_arsenal_desc: "A new state-backed arsenal gives Korea a domestic production line. Site development adds capacity, but the first budget must pay for both construction and commissioning."
 COLDWAR_KOR_df_defence_laboratories: "Defence Laboratories"
 COLDWAR_KOR_df_defence_laboratories_desc: "The Agency for Defense Development needs a stable laboratory budget to evaluate local designs before manufacturers commit to production."
 COLDWAR_KOR_df_production_quality: "Arsenal Inspection"
 COLDWAR_KOR_df_production_quality_desc: "Independent acceptance tests reduce defective batches and give suppliers a common basis for improving production lines."
 COLDWAR_KOR_df_defence_orders: "Defence Order Book"
 COLDWAR_KOR_df_defence_orders_desc: "A formal order book lets Korea respond to a stronger arms market while keeping export prospects and domestic procurement under the same accounting rules."
 COLDWAR_KOR_df_alliance_consultations: "Alliance Consultations"
 COLDWAR_KOR_df_alliance_consultations_desc: "Cabinet consultations establish a clear Korean position on basing, joint command and the responsibilities of each government."
 COLDWAR_KOR_df_garrison_convention: "US Garrison Convention"
 COLDWAR_KOR_df_garrison_convention_desc: "Seoul can propose a formal basis for the US presence. Both governments must accept the access and support commitments before the convention takes effect."
 COLDWAR_KOR_df_combined_command: "Combined Command"
 COLDWAR_KOR_df_combined_command_desc: "The service staffs can propose a permanent combined command to organise the work of allied planners and give each capital a recognised role in decisions."
 COLDWAR_KOR_df_combined_exercises: "Combined Exercises"
 COLDWAR_KOR_df_combined_exercises_desc: "A combined exercise tests whether both staffs can support the same training schedule. Dates and expenses are agreed before either country commits its formations."
 COLDWAR_KOR_df_korean_operational_planning: "Korean Operations Staff"
 COLDWAR_KOR_df_korean_operational_planning_desc: "An independent Korean staff keeps national plans current and makes the assumptions behind combined planning easier for Seoul to assess."
 COLDWAR_KOR_df_korean_sustainment: "Korean Sustainment"
 COLDWAR_KOR_df_korean_sustainment_desc: "Domestic maintenance contracts make Korean units less dependent on overseas support. The services must keep enough of the current budget available for local contracts."
 COLDWAR_KOR_df_force_posture_talks: "Force Posture Talks"
 COLDWAR_KOR_df_force_posture_talks_desc: "A separate negotiation can reduce the US garrison and redefine responsibility for reinforcement. Existing access and support arrangements remain in effect until the governments agree."
 COLDWAR_KOR_df_national_command_arrangements: "National Command"
 COLDWAR_KOR_df_national_command_arrangements_desc: "Korean commanders can run a national chain of command alongside allied consultation. A standing headquarters takes responsibility for integrating the three services' plans."
 COLDWAR_KOR_df_civilian_defence_bureau: "Defence Secretariat"
 COLDWAR_KOR_df_civilian_defence_bureau_desc: "Civilian analysts can prepare equipment estimates and review readiness reports while the Joint Chiefs retain professional responsibility for military advice."
 COLDWAR_KOR_df_service_neutrality: "Political Neutrality"
 COLDWAR_KOR_df_service_neutrality_desc: "Rules on officers' political activity protect the services from factional appointments. Enforcing the rules requires scrutiny of promotion lists and service postings."
 COLDWAR_KOR_df_personnel_review: "Military Appointments"
 COLDWAR_KOR_df_personnel_review_desc: "A statutory board can check senior postings against professional qualifications. Reviewing appointments will slow promotion while the services adjust to the new process."
 COLDWAR_KOR_df_assembly_defence_committee: "Defence Committee"
 COLDWAR_KOR_df_assembly_defence_committee_desc: "A standing National Assembly committee can examine the defence estimates and question ministers about major contracts. Hearings take time from the budget process."
 COLDWAR_KOR_df_inspection_authority: "Inspector General"
 COLDWAR_KOR_df_inspection_authority_desc: "An inspectorate gives service personnel a channel for reporting abuses and allows the cabinet to examine how each service spends its allocation."
 COLDWAR_KOR_df_nuclear_policy_review: "Nuclear Policy Review"
 COLDWAR_KOR_df_nuclear_policy_review_desc: "Cabinet must decide whether to commit to civilian cooperation or leave a military option open. The review keeps electricity policy and defence approval under separate authority."
 COLDWAR_KOR_df_npt_accession: "Nonproliferation Treaty"
 COLDWAR_KOR_df_npt_accession_desc: "A civilian commitment makes international cooperation easier and assigns new reporting obligations to the government. Cabinet will exclude military nuclear projects under the commitment."
 COLDWAR_KOR_df_iaea_safeguards: "IAEA Safeguards"
 COLDWAR_KOR_df_iaea_safeguards_desc: "Civilian operators can place their facilities under continuing international safeguards. The programme funds inspections and gives administrators an incentive to improve regulatory standards."
 COLDWAR_KOR_df_extended_deterrence: "US Security Assurance"
 COLDWAR_KOR_df_extended_deterrence_desc: "A new assurance can accompany Korea's civilian commitment if Washington accepts the political and budget obligations of maintaining an allied consultation channel."
 COLDWAR_KOR_df_nuclear_reassessment: "Strategic Policy Option"
 COLDWAR_KOR_df_nuclear_reassessment_desc: "Cabinet can withhold a civilian pledge and retain a separately authorised military option. The decision raises regional concern before any programme begins."
 COLDWAR_KOR_df_strategic_institutions: "Strategic Oversight"
 COLDWAR_KOR_df_strategic_institutions_desc: "A statutory board will control appropriations and review whether a proposed programme is consistent with the cabinet's instructions."
 COLDWAR_KOR_df_strategic_authorisation: "Cabinet Authorisation"
 COLDWAR_KOR_df_strategic_authorisation_desc: "After a recorded vote, cabinet can authorise a military nuclear programme. Foreign scrutiny and continued financing remain consequences of the authorisation."
 COLDWAR_KOR_df_strategic_programme_freeze: "Strategic Freeze"
 COLDWAR_KOR_df_strategic_programme_freeze_desc: "Cabinet can withdraw the mandate and end its dedicated funding. The freeze leaves existing international obligations and the status of outstanding projects subject to the normal procedures."
