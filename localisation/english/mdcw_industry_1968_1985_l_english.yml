l_english:
 # IMPERIA COLD WAR: Project-specific integration; preserve existing author credits.
# COLDWAR | Industrial Technology 1953-1985
 mdcw_intermodal_containers_1968: "Intermodal Container Freight"
 mdcw_intermodal_containers_1968_desc: "Standard shipping containers move between ship, rail and road without being unpacked, so freight terminals handle far more cargo with fewer hands."
 mdcw_aramid_fibres_1971: "Aramid Fibres"
 mdcw_aramid_fibres_1971_desc: "Synthetic aramid fibres are five times stronger than steel by weight and replace steel cord in tyres, cables and protective gear."
 mdcw_composite_structures_1982: "Carbon-Fibre Composite Structures"
 mdcw_composite_structures_1982_desc: "Load-bearing parts are laid up from carbon-fibre composites instead of metal, cutting weight while keeping strength."
 mdcw_high_yield_crops_1968: "High-Yield Crop Varieties"
 mdcw_high_yield_crops_1968_desc: "Short-stemmed, high-yield wheat and rice varieties, grown with fertiliser and irrigation, double harvests on the same land."
 mdcw_integrated_pest_management_1972: "Integrated Pest Management"
 mdcw_integrated_pest_management_1972_desc: "Pests are monitored and controlled with targeted spraying, crop rotation and natural enemies instead of blanket pesticide use."
 mdcw_electric_arc_minimills_1969: "Electric Arc Mini-Mills"
 mdcw_electric_arc_minimills_1969_desc: "Small steelworks melt scrap in electric arc furnaces. They cost a fraction of a blast-furnace plant and can be built close to their markets."
 mdcw_hvdc_transmission_1979: "HVDC Transmission"
 mdcw_hvdc_transmission_1979_desc: "High-voltage direct-current lines carry bulk power over very long distances with far lower losses than alternating current."
 mdcw_pumped_storage_1984: "Pumped-Storage Hydroelectricity"
 mdcw_pumped_storage_1984_desc: "Cheap night-time power pumps water uphill. At peak demand it runs back through turbines within seconds."
 mdcw_energy_conservation_1974: "Energy Conservation Programmes"
 mdcw_energy_conservation_1974_desc: "After the oil shock the state sets insulation standards, efficiency rules for industry and campaigns to save fuel. Every barrel not burned is a barrel not imported."
 mdcw_energy_independence_1974: "Energy Independence Programme"
 mdcw_energy_independence_1974_desc: "After the oil shock the state pours money into domestic oil fields, synthetic and alternative fuels to cut its dependence on imports."
 mdcw_experimental_power_reactors_1954: "Experimental Power Reactors"
 mdcw_experimental_power_reactors_1954_desc: "Small prototype reactors are the first to put nuclear electricity into the grid. Every later power station builds on what they teach."
 mdcw_reactor_fuel_fabrication_1953: "Reactor Fuel Fabrication"
 mdcw_reactor_fuel_fabrication_1953_desc: "Uranium is pressed into pellets and sealed in zirconium-alloy tubes that survive years inside a reactor core."
 mdcw_reactor_licensing_1957: "Reactor Licensing and Radiation Protection"
 mdcw_reactor_licensing_1957_desc: "A state regulator licenses every reactor, sets radiation limits and inspects the plants. Safer, but every licence takes time and money."
 mdcw_light_water_reactors_1971: "Gigawatt-Class Light-Water Reactors"
 mdcw_light_water_reactors_1971_desc: "Light-water reactors grow to gigawatt size and run on enriched uranium. They are compact and powerful, but need an enrichment industry behind them."
 mdcw_heavy_water_reactors_1971: "Heavy-Water Reactor Programme"
 mdcw_heavy_water_reactors_1971_desc: "Heavy-water reactors burn natural uranium and are refuelled while running. No enrichment plant is needed."
 mdcw_standardised_reactors_1974: "Standardised Reactor Series"
 mdcw_standardised_reactors_1974_desc: "Instead of one-off designs, dozens of identical reactors are built in series. Every plant after the first is faster and cheaper."
 mdcw_reactor_safety_upgrades_1980: "Reactor Safety Upgrades"
 mdcw_reactor_safety_upgrades_1980_desc: "After a serious reactor accident, operators retrofit plants, train crews on simulators and standardise emergency procedures. Unplanned shutdowns fall."
