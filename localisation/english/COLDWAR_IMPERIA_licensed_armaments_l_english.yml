 # IMPERIA CW — Cold War: Licensed armaments policy.
 COLDWAR_ni_licensed_armaments_programme:0 "Licensed Armaments Programme"
 COLDWAR_ni_licensed_armaments_programme_desc:0 "Foreign designs, imported tooling and technical missions allow our factories to assemble proven weapons under licence. Procurement funds and experienced engineers are directed towards these contracts, leaving independent domestic production with fewer resources.\n\nLicensed production receives the additional speed bonus. The output penalty applies to all military factories, including their licensed production.\n\n§YCommitment:§! four years before removal."
