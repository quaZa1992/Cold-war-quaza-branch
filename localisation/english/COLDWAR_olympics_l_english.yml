l_english:
# IMPERIA COLD WAR — Olympic Movement
 COLDWAR_olympics_category: "The Olympic Movement"
 COLDWAR_olympics_category_desc: "Every four years the world measures itself in stadiums. Bids for the next Games, national sports programmes and boycotts are decided here.\n\nNext Summer Games: §Y[?global.cw_oly_next_year|0]§!"
 COLDWAR_oly_bid_summer: "Bid for the Summer Olympics"
 COLDWAR_oly_bid_summer_desc: "Submit a candidate city for the §Y[?global.cw_oly_bid_year|0]§! Summer Games. When the bidding closes, the IOC chooses one bidder by lot."
 COLDWAR_oly_bid_winter: "Bid for the Winter Olympics"
 COLDWAR_oly_bid_winter_desc: "Submit a candidate city for the §Y[?global.cw_oly_bid_year|0]§! Winter Games. When the bidding closes, the IOC chooses one bidder by lot."
 COLDWAR_oly_bid_summer_tt: "Candidate for the §Y[?global.cw_oly_bid_year|0] Summer Olympics§!: one bidder is drawn by lot"
 COLDWAR_oly_bid_winter_tt: "Candidate for the §Y[?global.cw_oly_bid_year|0] Winter Olympics§!: one bidder is drawn by lot"
 COLDWAR_oly_s0_stadium: "Build the Olympic Stadium"
 COLDWAR_oly_s0_stadium_desc: "A main stadium for the opening ceremony and athletics. Every completed project raises the host's reward after the Games."
 COLDWAR_oly_s0_village: "Build the Athletes' Village"
 COLDWAR_oly_s0_village_desc: "Housing for the national teams, later sold as apartments. Every completed project raises the host's reward after the Games."
 COLDWAR_oly_s0_transit: "Transit and Broadcasting Centre"
 COLDWAR_oly_s0_transit_desc: "New metro lines, roads and an international broadcasting centre. Every completed project raises the host's reward after the Games."
 COLDWAR_oly_w0_venues: "Build the Winter Venues"
 COLDWAR_oly_w0_venues_desc: "Ski runs, a bobsleigh track and an ice stadium. Every completed project raises the host's reward after the Games."
 COLDWAR_oly_s1_stadium: "Build the Olympic Stadium"
 COLDWAR_oly_s1_stadium_desc: "A main stadium for the opening ceremony and athletics. Every completed project raises the host's reward after the Games."
 COLDWAR_oly_s1_village: "Build the Athletes' Village"
 COLDWAR_oly_s1_village_desc: "Housing for the national teams, later sold as apartments. Every completed project raises the host's reward after the Games."
 COLDWAR_oly_s1_transit: "Transit and Broadcasting Centre"
 COLDWAR_oly_s1_transit_desc: "New metro lines, roads and an international broadcasting centre. Every completed project raises the host's reward after the Games."
 COLDWAR_oly_w1_venues: "Build the Winter Venues"
 COLDWAR_oly_w1_venues_desc: "Ski runs, a bobsleigh track and an ice stadium. Every completed project raises the host's reward after the Games."
 COLDWAR_oly_not_banned_tt: "Not excluded from the Olympic Movement after a doping scandal"
 COLDWAR_oly_build_window_tt: "The Games have not yet begun"
 COLDWAR_oly_ready_s_tt: "Olympic readiness: §G+1§! (maximum 3)"
 COLDWAR_oly_ready_w_tt: "Winter Olympic readiness: §G+1§! (maximum 1)"
 COLDWAR_oly_overrun_risk_tt: "§Y25%§! risk of a cost overrun: half of the cost again as debt"
 COLDWAR_oly_programme_1: "National Sports Programme: Youth Sports Schools"
 COLDWAR_oly_programme_1_desc: "Sports schools, coaches and training camps prepare our athletes for the coming Olympiad. The programme lasts until the Summer Games."
 COLDWAR_oly_programme_1_tt: "Olympic team performance: §G+10%§! Summer, §G+5%§! Winter\nProgramme points for the host's tax bonus: §Y1§!"
 COLDWAR_oly_programme_2: "National Sports Programme: Elite Training Centres"
 COLDWAR_oly_programme_2_desc: "Sports schools, coaches and training camps prepare our athletes for the coming Olympiad. The programme lasts until the Summer Games."
 COLDWAR_oly_programme_2_tt: "Olympic team performance: §G+20%§! Summer, §G+10%§! Winter\nProgramme points for the host's tax bonus: §Y2§!"
 COLDWAR_oly_programme_3: "National Sports Programme: State Sports System"
 COLDWAR_oly_programme_3_desc: "Sports schools, coaches and training camps prepare our athletes for the coming Olympiad. The programme lasts until the Summer Games."
 COLDWAR_oly_programme_3_tt: "Olympic team performance: §G+30%§! Summer, §G+15%§! Winter\nProgramme points for the host's tax bonus: §Y3§!"
 COLDWAR_oly_prep_window_tt: "More than 90 days before the next Summer Games"
 COLDWAR_oly_doping: "State Doping Programme"
 COLDWAR_oly_doping_desc: "A secret research programme for anabolic steroids, run by sports physicians and the security services. Other nations will not know, unless the controls find it."
 COLDWAR_oly_doping_tt: "Olympic team performance: §G+20%§! Summer\nDetection risk at the Games: §R20%§!, §R+10%§! if the host belongs to a rival bloc, §R+5%§! for every earlier case\nIf detected: all medals withdrawn, excluded from the next Summer Games, §RDoping Scandal§! for 2 years"
 COLDWAR_oly_boycott: "Boycott the Games"
 COLDWAR_oly_boycott_desc: "Our athletes stay at home. The host loses the prestige of our team and the visitors our programme would have brought."
 COLDWAR_oly_boycott_tt: "Our team does not compete at the next Summer Games\nOur programme points no longer count for the host's tax bonus"
 COLDWAR_oly_boycott_window_tt: "More than 30 days before the next Summer Games"
 COLDWAR_oly_call_boycott: "Call for a Bloc Boycott"
 COLDWAR_oly_call_boycott_desc: "Ask every country of our bloc to keep its athletes away from the rival bloc's Games. Each government decides for itself."
 COLDWAR_oly_call_boycott_tt: "Our team does not compete at the next Summer Games\nEvery member of our bloc is asked to join the boycott"
 COLDWAR_oly_tension_p1_tt: "Cold War Tension: §R+1§!"
 cw_oly_champions: "Olympic Champions"
 cw_oly_champions_desc: "Our athletes topped the medal table. The victory is proof of our system for the whole world."
 cw_oly_superpower: "Sporting Superpower"
 cw_oly_superpower_desc: "A place on the podium of the medal table carries our flag into every newspaper."
 cw_oly_medal_nation: "Medal Nation"
 cw_oly_medal_nation_desc: "A top ten finish at the Games fills the nation with pride."
 cw_oly_winter_champions: "Winter Champions"
 cw_oly_winter_champions_desc: "Our skiers and skaters led the medal table of the Winter Games."
 cw_oly_winter_fever: "Winter Games Afterglow"
 cw_oly_winter_fever_desc: "The Winter Games left a proud host behind."
 cw_oly_doping_scandal: "Doping Scandal"
 cw_oly_doping_scandal_desc: "The controls found banned substances in our athletes. The country is humiliated."
 cw_oly_white_elephant: "White Elephant"
 cw_oly_white_elephant_desc: "The Games came, the venues were never finished, and the bill remains."
 cw_oly_preparation_1: "Olympic Preparation"
 cw_oly_preparation_1_desc: "Our sports schools and coaches prepare for the coming Olympiad."
 cw_oly_preparation_2: "Olympic Preparation"
 cw_oly_preparation_2_desc: "Elite training centres prepare our athletes for the coming Olympiad."
 cw_oly_preparation_3: "Olympic Preparation"
 cw_oly_preparation_3_desc: "A complete state sports system prepares our athletes for the coming Olympiad."
 cw_oly_legacy_modifier: "Olympic Legacy"
 cw_oly_fever_modifier: "Olympic Fever"
 cw_oly_city_modifier: "Olympic City"
 cw_oly_winter_legacy_modifier: "Winter Olympic Legacy"
 cw_oly_winter_city_modifier: "Winter Olympic City"
 COLDWAR_OLY.1.t: "The IOC Invites Bids for [?global.cw_oly_bid_year|0]"
 COLDWAR_OLY.1.d: "The International Olympic Committee has opened the bidding for the §Y[?global.cw_oly_bid_year|0]§! Summer and Winter Olympics. Candidate cities can be submitted in the Olympic Movement decisions for about four months. When the bidding closes, the IOC chooses one bidder by lot for each Games."
 COLDWAR_OLY.1.a: "Who will dare to bid?"
 COLDWAR_OLY.2.t: "[COLDWAR_OLY_award_title]"
 COLDWAR_OLY_award_title_host: "[?var:cw_oly_v_host.GetNameDefCap] Will Host the [?cw_oly_v_year|0] Olympics"
 COLDWAR_OLY_award_title_plain: "The IOC Awards the [?cw_oly_v_year|0] Olympics"
 COLDWAR_OLY.2.d: "The International Olympic Committee has decided where the world will meet in §Y[?cw_oly_v_year|0]§!.\n\n[COLDWAR_OLY_award_s]\n[COLDWAR_OLY_award_w]"
 COLDWAR_OLY_award_s_lot: "Summer Games: §Y[?var:cw_oly_v_host.GetNameWithFlag]§!, drawn by lot from [?global.cw_oly_s_bid_n|0] bids."
 COLDWAR_OLY_award_s_ioc: "Summer Games: §Y[?var:cw_oly_v_host.GetNameWithFlag]§!, chosen by the IOC without a contest."
 COLDWAR_OLY_award_s_none: "Summer Games: no host was found."
 COLDWAR_OLY_award_w_lot: "Winter Games: §Y[?var:cw_oly_v_whost.GetNameWithFlag]§!, drawn by lot from [?global.cw_oly_w_bid_n|0] bids."
 COLDWAR_OLY_award_w_ioc: "Winter Games: §Y[?var:cw_oly_v_whost.GetNameWithFlag]§!, chosen by the IOC without a contest."
 COLDWAR_OLY_award_w_none: "Winter Games: no host was found."
 COLDWAR_OLY.2.a: "Noted."
 COLDWAR_OLY.4.t: "We Will Host the Olympics"
 COLDWAR_OLY.4.d: "The IOC has chosen our candidate city. Stadiums, an athletes' village and new transit must be ready before the opening ceremony. Every finished project raises our reward after the Games: a share of the visitors' spending as corporate tax, a boost to the host city's productivity, and national pride."
 COLDWAR_OLY.4.a: "Let the building begin."
 COLDWAR_OLY.5.t: "Olympic Cost Overrun"
 COLDWAR_OLY.5.d: "Strikes, rising steel prices and late design changes have driven up the cost of an Olympic project. The Treasury has to borrow to finish it on time."
 COLDWAR_OLY.5.a: "Pay, whatever it takes."
 COLDWAR_OLY.6.t: "A Call for an Olympic Boycott"
 COLDWAR_OLY.6.d: "§Y[?var:cw_oly_v_caller.GetNameDefCap]§! asks every country of our bloc to keep its athletes away from the Games in §Y[?var:cw_oly_v_next.GetNameDef]§!."
 COLDWAR_OLY.6.a: "We stand with our allies."
 COLDWAR_OLY.6.b: "Our athletes will compete."
 COLDWAR_OLY.8.t: "[?var:cw_oly_v_boy.GetNameDefCap] Boycotts the Olympics"
 COLDWAR_OLY.8.d: "§Y[?var:cw_oly_v_boy.GetNameDefCap]§! has announced that its athletes will not travel to the Games in §Y[?var:cw_oly_v_next.GetNameDef]§!."
 COLDWAR_OLY.8.a: "Politics has entered the stadium."
 COLDWAR_OLY.10.t: "[?var:cw_oly_v_r1.GetNameDefCap] Tops the Medal Table at the [?cw_oly_v_year|0] Summer Olympics"
 COLDWAR_OLY.10.d: "The Games of the §Y[?cw_oly_v_year|0]§! Olympiad have closed. [COLDWAR_OLY_host_line]\n\nMedal table:[COLDWAR_OLY_line_1][COLDWAR_OLY_line_2][COLDWAR_OLY_line_3][COLDWAR_OLY_line_4][COLDWAR_OLY_line_5][COLDWAR_OLY_line_6][COLDWAR_OLY_line_7][COLDWAR_OLY_line_8][COLDWAR_OLY_line_9][COLDWAR_OLY_line_10]\n\n[COLDWAR_OLY_boycott_line][COLDWAR_OLY_doping_line]\n[COLDWAR_OLY_own_result]"
 COLDWAR_OLY.10.a: "Until the next Olympiad."
 COLDWAR_OLY.11.t: "[?var:cw_oly_v_r1.GetNameDefCap] Leads the [?cw_oly_v_year|0] Winter Olympics"
 COLDWAR_OLY.11.d: "The Winter Games of §Y[?cw_oly_v_year|0]§! have closed. [COLDWAR_OLY_host_line]\n\nMedal table:[COLDWAR_OLY_line_1][COLDWAR_OLY_line_2][COLDWAR_OLY_line_3][COLDWAR_OLY_line_4][COLDWAR_OLY_line_5][COLDWAR_OLY_line_6][COLDWAR_OLY_line_7][COLDWAR_OLY_line_8][COLDWAR_OLY_line_9][COLDWAR_OLY_line_10]\n\n[COLDWAR_OLY_own_result]"
 COLDWAR_OLY.11.a: "Until the next Winter Games."
