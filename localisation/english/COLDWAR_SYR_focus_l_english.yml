 COLDWAR_SYR_deferred_projects:0 "Outstanding Cabinet Programmes"
 COLDWAR_SYR_deferred_projects_desc:0 "Resume agreed programmes when the government has authority and access to the worksite. Their full costs are charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_opening:0 "The Arab Socialist Ba'ath Party leads the government."
 COLDWAR_SYR_opening_entry:0 "Divided Command"
 COLDWAR_SYR_opening_entry_desc:0 "President Nureddin al-Atassi occupies the formal summit of a divided state. Salah Jadid commands the party apparatus, while Hafez al-Assad controls the Defence Ministry. Defeat abroad has sharpened their quarrel at home. Syria needs a settlement that its ministers, officers and provincial organizations will actually uphold. A cabinet coordination office improves the handling of disputed orders but needs a permanent secretariat. It does not resolve the rivalry or remove Divided Command."
 COLDWAR_SYR_opening_entry_resume:0 "Carry Out: A Divided Command"
 COLDWAR_SYR_opening_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_opening_party:0 "Party Command"
 COLDWAR_SYR_opening_party_desc:0 "The Regional Command claims the revolution's political authority. Rallying provincial secretaries and socialist cadres behind it can restrain the Defence Minister's ambitions, but tighter party supervision will burden ministries already struggling to administer land reform, public enterprises and a country still living with defeat."
 COLDWAR_SYR_opening_party_resume:0 "Carry Out: Back the Regional Command"
 COLDWAR_SYR_opening_party_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_org_factor_tt:0 "$MODIFIER_ARMY_ORG_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SYR_opening_military_political_outcome_tt:0 "Strengthens the Defence Minister's backing among senior officers."
 COLDWAR_SYR_opening_military:0 "Defence Minister"
 COLDWAR_SYR_opening_military_desc:0 "Assad argues that slogans cannot repair the army or recover the Golan. Supporting the Defence Minister means rebuilding confidence among field officers and demanding a clearer chain of command. It also strengthens an armed institution whose political ambitions the civilian leadership can no longer dismiss."
 COLDWAR_SYR_opening_military_resume:0 "Carry Out: Back the Defence Minister"
 COLDWAR_SYR_opening_military_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_research_speed_factor_tt:0 "$MODIFIER_RESEARCH_SPEED_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SYR_opening_civilian_political_outcome_tt:0 "Secures the cabinet's consent to negotiate a political settlement."
 COLDWAR_SYR_opening_civilian:0 "Civilian Arbitration"
 COLDWAR_SYR_opening_civilian_desc:0 "Atassi can attempt to mediate between revolutionary party authority and military necessity. A civilian settlement would protect the socialist project while giving competent administrators room to work. Its weakness is equally clear: compromise depends on rival officers and party leaders accepting limits they have repeatedly resisted."
 COLDWAR_SYR_opening_civilian_resume:0 "Carry Out: Civilian Party Arbitration"
 COLDWAR_SYR_opening_civilian_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_opening_corrective:0 "Corrective Movement"
 COLDWAR_SYR_opening_corrective_desc:0 "Assad's supporters promise to correct the revolution through disciplined government, military recovery and accommodation with estranged social groups. The promise must now survive a real struggle for power. Officers and ministers will decide whether the move produces an orderly transfer or another rupture in Syria's command. Coordinating the corrective officers improves military procedures while the struggle for political agreement consumes the government's attention. Preparing the movement does not itself install a new president."
 COLDWAR_SYR_opening_corrective_resume:0 "Carry Out: The Corrective Movement"
 COLDWAR_SYR_opening_corrective_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_opening_settlement_reform_tt:0 "The real officer–party settlement resolves Divided Ba’ath Command: its political power −10% and army organization −5% penalties cease. The settlement requires an accepted political outcome."
 COLDWAR_SYR_dual_command_resolved_eligibility_tt:0 "The party and officer corps have accepted a command settlement."
 COLDWAR_SYR_opening_settlement:0 "Settle the Command"
 COLDWAR_SYR_opening_settlement_desc:0 "An agreement on paper cannot end the dual command while ministries and army headquarters still answer to competing patrons. Appointments, reporting lines and cabinet authority must follow the settlement already reached. Only a transfer that holds in practice can release Syria from this paralysis."
 COLDWAR_SYR_opening_settlement_resume:0 "Carry Out: Settle the Dual Command"
 COLDWAR_SYR_opening_settlement_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_corrective_transition_eligibility_tt:0 "The Corrective Movement has secured a negotiated transfer of authority."
 COLDWAR_SYR_opening_khatib_political_outcome_tt:0 "Convenes a transitional People's Council and appoints an acting civilian head of state."
 COLDWAR_SYR_opening_khatib:0 "Transition Council"
 COLDWAR_SYR_opening_khatib_desc:0 "Ahmad al-Khatib offers a civilian face for the transition after the struggle within the Ba'ath. A provisional council can keep ministries working while the new balance of authority is settled. Its members must decide whether their stewardship prepares a presidential order or develops an independent civilian mandate."
 COLDWAR_SYR_opening_khatib_resume:0 "Carry Out: Transitional People’s Council"
 COLDWAR_SYR_opening_khatib_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_opening_khatib_civil_political_outcome_tt:0 "Entrusts authority to the Civilian Stewardship Council."
 COLDWAR_SYR_opening_khatib_civil:0 "Civilian Council"
 COLDWAR_SYR_opening_khatib_civil_desc:0 "The transitional council need not surrender its authority to a permanent presidential centre. Extending civilian stewardship would give ministers and representative institutions a larger role in governing. Such an arrangement demands constant bargaining with officers who helped determine the transition and expect their interests to remain protected."
 COLDWAR_SYR_opening_khatib_civil_resume:0 "Carry Out: Civilian Council Mandate"
 COLDWAR_SYR_opening_khatib_civil_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_opening_khatib_presidential_political_outcome_tt:0 "Hafez al-Assad assumes the presidency."
 COLDWAR_SYR_opening_khatib_presidential:0 "Presidential Vote"
 COLDWAR_SYR_opening_khatib_presidential_desc:0 "Assad seeks a public mandate to turn military and party ascendancy into a presidency. A referendum can give the transition a recognizable constitutional destination, but concentrating authority in one office changes the bargain with civilian ministers and makes the republic increasingly dependent on its president."
 COLDWAR_SYR_opening_khatib_presidential_resume:0 "Carry Out: Presidential Referendum"
 COLDWAR_SYR_opening_khatib_presidential_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_opening_khatib_accounts:0 "Publish Accounts"
 COLDWAR_SYR_opening_khatib_accounts_desc:0 "The transfer of authority has left ministries uncertain which commitments remain binding and which accounts conceal factional spending. Publishing reconciled transition accounts can restore a usable public ledger. Opening the books will also force the new government to confront obligations its supporters would prefer to leave unexamined."
 COLDWAR_SYR_opening_khatib_accounts_resume:0 "Carry Out: Publish Transition Accounts"
 COLDWAR_SYR_opening_khatib_accounts_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_baath:0 "The Arab Socialist Ba'ath Party leads the government."
 COLDWAR_SYR_baath_entry:0 "Party-State Compact"
 COLDWAR_SYR_baath_entry_desc:0 "The Syrian Ba'ath governs through an uneasy combination of revolutionary legitimacy, public administration and military support. Its next task is to define that relationship beyond personal bargains. A lasting party-state compact must reconcile socialist ambitions with ministries, provincial interests and allies who demand a voice of their own."
 COLDWAR_SYR_baath_entry_resume:0 "Carry Out: The Party-State Compact"
 COLDWAR_SYR_baath_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_baath_01:0 "Revolutionary Vanguard"
 COLDWAR_SYR_baath_01_desc:0 "A disciplined vanguard can carry decisions from the Regional Command into every district. Supporters see a defence against restoration and factional drift; critics see another barrier between public institutions and the people they serve. Strengthening ideological direction will require accepting the administrative weight of closer party supervision."
 COLDWAR_SYR_baath_01_resume:0 "Carry Out: A Revolutionary Vanguard"
 COLDWAR_SYR_baath_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_baath_02:0 "Broader National Front"
 COLDWAR_SYR_baath_02_desc:0 "Socialists, Communists and Arab nationalists share parts of the government's programme without accepting every Ba'athist claim. Bringing them into a broader front can widen the regime's social base. Cooperation will remain fragile unless smaller partners receive meaningful guarantees rather than ceremonial seats beside an unchallenged ruling party."
 COLDWAR_SYR_baath_02_resume:0 "Carry Out: A Broader National Front"
 COLDWAR_SYR_baath_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_baath_03:0 "Cadres in Every Ministry"
 COLDWAR_SYR_baath_03_desc:0 "Party cadres should ensure that ministries implement revolutionary policy instead of sheltering old interests. Embedding them throughout the administration strengthens political direction and links Damascus to local organizations. It also creates additional chains of approval, leaving officials to balance professional judgement against the demands of their party supervisors."
 COLDWAR_SYR_baath_03_resume:0 "Carry Out: Cadres in Every Ministry"
 COLDWAR_SYR_baath_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_baath_04:0 "Guarantees Junior Allies"
 COLDWAR_SYR_baath_04_desc:0 "Junior allies cannot contribute honestly if every disagreement threatens their place in government. Defined responsibilities and protected consultation would make the front more credible. The Ba'ath must consequently surrender some freedom to dictate policy, accepting slower negotiations in exchange for partners who have a stake in the settlement."
 COLDWAR_SYR_baath_04_resume:0 "Carry Out: Guarantees for Junior Allies"
 COLDWAR_SYR_baath_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_baath_05:0 "Civic Settlement"
 COLDWAR_SYR_baath_05_desc:0 "Years of coups and emergency government have blurred the boundaries between party, army and state. A constitutional settlement can give those institutions more predictable duties. Its authority will depend on whether officials follow the rules when political necessity makes another exception seem easier than restraint."
 COLDWAR_SYR_baath_05_resume:0 "Carry Out: A Constitutional Settlement"
 COLDWAR_SYR_baath_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_baath_06:0 "Civilian Service Careers"
 COLDWAR_SYR_baath_06_desc:0 "A ministry cannot retain skilled staff if every change of patron ends a career. Establishing civilian service ladders would reward expertise and preserve administrative memory. The party will have to tolerate officials whose usefulness comes from professional competence rather than their place in a faction's appointment network."
 COLDWAR_SYR_baath_06_resume:0 "Carry Out: Civilian Service Careers"
 COLDWAR_SYR_baath_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_baath_07:0 "Rural Representation"
 COLDWAR_SYR_baath_07_desc:0 "Rural Syrians helped transform the country's politics, yet decisions still accumulate in the capital. Stronger provincial representation can bring irrigation, schooling and agricultural credit into national deliberations. Giving local organizations a genuine hearing will also multiply demands on a treasury already expected to finance development and defence."
 COLDWAR_SYR_baath_07_resume:0 "Carry Out: Rural Representation"
 COLDWAR_SYR_baath_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_baath_08:0 "Accountable Sector"
 COLDWAR_SYR_baath_08_desc:0 "Public ownership was meant to serve national development rather than protect every director from scrutiny. Clear accounts and responsibility for production can strengthen that purpose. Enterprises will need administrative support and credible supervision, while ministers must resist using every review as an excuse to replace managers with loyalists."
 COLDWAR_SYR_baath_08_resume:0 "Carry Out: An Accountable State Sector"
 COLDWAR_SYR_baath_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_baath_09_political_outcome_tt:0 "Allows the cabinet to consider exceptional security operations during a domestic crisis."
 COLDWAR_SYR_baath_09:0 "Exceptional Courts"
 COLDWAR_SYR_baath_09_desc:0 "Security officials argue that conspiracies and armed opposition cannot be handled through ordinary proceedings. Exceptional courts would give the government a firmer instrument against perceived threats. Their reach also narrows the space for open criticism and makes independent inquiry more difficult wherever dissent can be described as subversion."
 COLDWAR_SYR_baath_09_resume:0 "Carry Out: Exceptional Security Courts"
 COLDWAR_SYR_baath_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_baath_10:0 "Regular Civilian Courts"
 COLDWAR_SYR_baath_10_desc:0 "Ordinary courts should hear ordinary disputes, even when the accused are politically inconvenient. Restoring regular procedures can make government less arbitrary and reassure communities accustomed to exceptional authority. Judges, clerks and police will need resources and protection if the promise is to extend beyond the wording of a decree."
 COLDWAR_SYR_baath_10_resume:0 "Carry Out: Regular Civilian Courts"
 COLDWAR_SYR_baath_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_baath_11:0 "A Syrian Social Contract"
 COLDWAR_SYR_baath_11_desc:0 "The party's claim to govern must rest on more than memories of the revolution. A Syrian social contract would tie public provision, rural advancement and national defence to recognizable obligations of government. Negotiating that balance requires acknowledging that workers, merchants, officers and provincial communities cannot all receive priority."
 COLDWAR_SYR_baath_11_resume:0 "Carry Out: A Syrian Social Contract"
 COLDWAR_SYR_baath_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_atassi:0 "Nureddin al-Atassi directs the governing programme."
 COLDWAR_SYR_atassi_entry:0 "A Civilian Presidium"
 COLDWAR_SYR_atassi_entry_desc:0 "Nureddin al-Atassi's civilian presidency can become more than the formal seal of decisions made elsewhere. A working presidium would gather administrators and party representatives around a common socialist programme. Its effectiveness depends on securing cooperation from institutions that have grown accustomed to exercising authority without civilian mediation."
 COLDWAR_SYR_atassi_entry_resume:0 "Carry Out: A Civilian Presidium"
 COLDWAR_SYR_atassi_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_atassi_01:0 "Party Supremacy"
 COLDWAR_SYR_atassi_01_desc:0 "Atassi can defend civilian socialism by insisting that the party, rather than the officer corps, determines national policy. This gives the presidency an organized political foundation. It also leaves administrative debate tied to ideological discipline, risking the suppression of useful criticism in the name of protecting the revolution."
 COLDWAR_SYR_atassi_01_resume:0 "Carry Out: Party Supremacy"
 COLDWAR_SYR_atassi_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_atassi_02:0 "Competence"
 COLDWAR_SYR_atassi_02_desc:0 "The civilian presidency needs officials who can turn a development plan into functioning schools, reliable accounts and completed works. Choosing administrative competence over factional convenience would strengthen that capacity. It requires patient investment in expertise and willingness to disappoint supporters who regard public appointments as the reward for loyalty."
 COLDWAR_SYR_atassi_02_resume:0 "Carry Out: Administrative Competence"
 COLDWAR_SYR_atassi_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_atassi_03:0 "Party Schools Provinces"
 COLDWAR_SYR_atassi_03_desc:0 "Provincial party schools can explain socialist policy and train organizers beyond the circles of Damascus. Their graduates would connect neglected districts to the government. A curriculum built too tightly around approved doctrine, however, may produce obedient intermediaries where local administration needs officials capable of independent judgement."
 COLDWAR_SYR_atassi_03_resume:0 "Carry Out: Party Schools in the Provinces"
 COLDWAR_SYR_atassi_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_atassi_04:0 "Merit in the Ministries"
 COLDWAR_SYR_atassi_04_desc:0 "Appointments based on technical ability can make civilian government credible where speeches have failed. Ministries should keep trained engineers, teachers and accountants even when factional preferences change. Establishing fair promotion requires better records and sustained educational spending, as well as political protection for officials without influential patrons."
 COLDWAR_SYR_atassi_04_resume:0 "Carry Out: Merit in the Ministries"
 COLDWAR_SYR_atassi_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_atassi_05:0 "Rural Clinics"
 COLDWAR_SYR_atassi_05_desc:0 "A physician's presidency should understand how distant the state remains from a village without a clinic. Expanding rural care would bring practical meaning to socialist inclusion. Buildings alone are insufficient: medicines, trained staff and dependable salaries create continuing obligations long after the first opening ceremony."
 COLDWAR_SYR_atassi_05_resume:0 "Carry Out: Rural Clinics"
 COLDWAR_SYR_atassi_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_atassi_06:0 "Civilian Appointments"
 COLDWAR_SYR_atassi_06_desc:0 "Civilian authority cannot endure while military patrons decide who runs the ministries. A regular appointments procedure would make ministers answerable for their own departments. The presidency must negotiate this change carefully, since officers accustomed to protecting clients will regard administrative independence as a reduction of their political influence."
 COLDWAR_SYR_atassi_06_resume:0 "Carry Out: Civilian Control of Appointments"
 COLDWAR_SYR_atassi_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_atassi_07:0 "Constitutional Socialism"
 COLDWAR_SYR_atassi_07_desc:0 "Constitutional socialism would place public ownership and social reform within institutions that can survive a dispute among leaders. Atassi's supporters must make civilian rule effective without abandoning their revolutionary commitments. A durable settlement needs educated administrators and rules strong enough to bind the people who originally wrote them."
 COLDWAR_SYR_atassi_07_resume:0 "Carry Out: Constitutional Socialism"
 COLDWAR_SYR_atassi_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_jadid:0 "Salah Jadid directs the governing programme."
 COLDWAR_SYR_jadid_entry:0 "Revolutionary Command"
 COLDWAR_SYR_jadid_entry_desc:0 "Salah Jadid's authority rests in the Regional Command and the networks that sustained the radical turn of the revolution. Preserving that authority requires a programme beyond defeating rivals. The command must show that political mobilization can deliver development while governing an army and administration weary of factional struggle."
 COLDWAR_SYR_jadid_entry_resume:0 "Carry Out: Revolutionary Regional Command"
 COLDWAR_SYR_jadid_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jadid_01:0 "Ideological Mobilization"
 COLDWAR_SYR_jadid_01_desc:0 "Revolutionary organizations can renew commitment among cadres who believe the socialist project is being diluted. Jadid would mobilize them around party discipline and a clearer ideological line. Such unity comes at the cost of a narrower public debate, making unwelcome evidence easier to dismiss as political disloyalty."
 COLDWAR_SYR_jadid_01_resume:0 "Carry Out: Ideological Mobilization"
 COLDWAR_SYR_jadid_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jadid_02:0 "Repair Compact"
 COLDWAR_SYR_jadid_02_desc:0 "The Regional Command cannot defend its programme through recurring confrontations with the officer corps. Repairing their compact means recognizing military competence and giving commanders a predictable relationship with civilian authority. The party must accept restraints on factional appointments if it expects the army to respect the settlement."
 COLDWAR_SYR_jadid_02_resume:0 "Carry Out: Repair the Officers’ Compact"
 COLDWAR_SYR_jadid_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jadid_03:0 "Party Militia Networks"
 COLDWAR_SYR_jadid_03_desc:0 "Party militia networks would give the radical leadership an organized defence outside the regular commands. They can mobilize committed supporters when the government feels threatened. Their loyalties and competing orders also risk deepening the division between political activism and professional military discipline that already troubles the state."
 COLDWAR_SYR_jadid_03_resume:0 "Carry Out: Party Militia Networks"
 COLDWAR_SYR_jadid_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jadid_04:0 "Skilled Field Commands"
 COLDWAR_SYR_jadid_04_desc:0 "Field formations require commanders chosen for their ability to prepare and lead troops. Jadid can preserve revolutionary government while giving professional standards greater weight inside the army. That bargain strengthens regular command but limits the party's ability to treat every formation as another arena for ideological mobilization."
 COLDWAR_SYR_jadid_04_resume:0 "Carry Out: Professional Field Commands"
 COLDWAR_SYR_jadid_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jadid_05:0 "Cooperatives Profits"
 COLDWAR_SYR_jadid_05_desc:0 "Cooperatives can give small cultivators access to equipment, credit and a stronger position against intermediaries. Jadid's government would place these social aims ahead of immediate commercial returns. Sustaining them requires competent local management and administrative support, particularly where collective arrangements meet suspicion or conceal the preferences of powerful patrons."
 COLDWAR_SYR_jadid_05_resume:0 "Carry Out: Cooperatives Before Profits"
 COLDWAR_SYR_jadid_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jadid_06:0 "Arab Solidarity"
 COLDWAR_SYR_jadid_06_desc:0 "Jadid's revolutionary Arabism looks beyond cautious relations between governments to movements claiming a common struggle. Civilian networks of solidarity can carry that ambition into cultural and political life. They require patient organization, and their priorities may not always coincide with the immediate diplomatic needs of the Syrian state."
 COLDWAR_SYR_jadid_06_resume:0 "Carry Out: Revolutionary Arab Solidarity"
 COLDWAR_SYR_jadid_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jadid_07:0 "Defend Republic"
 COLDWAR_SYR_jadid_07_desc:0 "A socialist republic defended only by its rhetoric will remain vulnerable to the next crisis. The Regional Command must connect public institutions, agricultural reform and national defence into a workable governing system. Its supporters will have to judge success by administration and preparedness as well as revolutionary conviction."
 COLDWAR_SYR_jadid_07_resume:0 "Carry Out: Defend the Socialist Republic"
 COLDWAR_SYR_jadid_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_hafez:0 "Hafez al-Assad directs the governing programme."
 COLDWAR_SYR_hafez_entry:0 "Consolidate Correction"
 COLDWAR_SYR_hafez_entry_desc:0 "Hafez al-Assad's accession promises order after years of ideological and military rivalry. Consolidating the correction requires a governing coalition that extends beyond the officers who made it possible. Merchants, provincial notables and civilian specialists will expect accommodation, while the presidency seeks reliable control over the institutions that brought it to power."
 COLDWAR_SYR_hafez_entry_resume:0 "Carry Out: Consolidate the Correction"
 COLDWAR_SYR_hafez_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_mdcw_cw_market_exposure_tt:0 "$mdcw_cw_market_exposure$: $RIGHT|+=%1$"
 COLDWAR_SYR_hafez_01:0 "Merchant Reconciliation"
 COLDWAR_SYR_hafez_01_desc:0 "Urban merchants retain capital, commercial connections and deep influence despite years of nationalization. Reconciliation can draw their expertise back into the economy without formally abandoning socialism. More room for private activity reduces direct fiscal control and exposes the country to commercial pressures that official planning cannot easily command."
 COLDWAR_SYR_hafez_01_resume:0 "Carry Out: Merchant Reconciliation"
 COLDWAR_SYR_hafez_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_hafez_02_political_outcome_tt:0 "Rival guard commands become a potential source of conflict during a future succession crisis."
 COLDWAR_SYR_hafez_02:0 "Security Patronage"
 COLDWAR_SYR_hafez_02_desc:0 "A presidency surrounded by rivals will seek reliable intermediaries in the security services and provincial administration. Patronage can bind those intermediaries to the new order. Its immediate reassurance carries a lasting price: loyalty becomes more valuable than criticism, and institutions grow dependent on personal access to the centre."
 COLDWAR_SYR_hafez_02_resume:0 "Carry Out: Security Patronage"
 COLDWAR_SYR_hafez_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_hafez_03:0 "License Workshops"
 COLDWAR_SYR_hafez_03_desc:0 "Small private workshops can supply everyday goods and absorb skilled labour without overturning the public sector. Licensing them offers merchants a stake in the corrected order. Officials must manage the resulting commercial opening carefully, since selective permissions can become another source of favour, uneven competition and foregone revenue."
 COLDWAR_SYR_hafez_03_resume:0 "Carry Out: License Private Workshops"
 COLDWAR_SYR_hafez_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_hafez_04:0 "Patronage Networks"
 COLDWAR_SYR_hafez_04_desc:0 "The presidency can stabilize appointments by building networks that connect provincial officials and ministries directly to Damascus. Clear access to the president may settle disputes quickly. Maintaining those relationships also expands supervision and makes public careers increasingly dependent on confidence at the centre rather than impersonal administrative rules."
 COLDWAR_SYR_hafez_04_resume:0 "Carry Out: Presidential Appointment Networks"
 COLDWAR_SYR_hafez_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_hafez_05_political_outcome_tt:0 "Establishes the presidential institutions that must settle a future incapacity or succession crisis."
 COLDWAR_SYR_hafez_05:0 "The Presidential State"
 COLDWAR_SYR_hafez_05_desc:0 "The corrected republic is taking the shape of a presidential state. Cabinet coordination and public authority can become more predictable when one office settles disputes among competing institutions. The same concentration makes ministries wait for decisions from above and ties the government's coherence closely to the president's continued authority."
 COLDWAR_SYR_hafez_05_resume:0 "Carry Out: The Presidential State"
 COLDWAR_SYR_hafez_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_hafez_06:0 "Civilian Technocrats"
 COLDWAR_SYR_hafez_06_desc:0 "Economic ministries need specialists who understand production, credit and the practical limits of public accounts. Assad can give civilian technocrats room to reconcile state planning with selective private activity. Their proposals require investment in expertise and political backing when efficient administration conflicts with the expectations of influential clients."
 COLDWAR_SYR_hafez_06_resume:0 "Carry Out: Civilian Economic Technocrats"
 COLDWAR_SYR_hafez_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_hafez_07:0 "Durable Coalition"
 COLDWAR_SYR_hafez_07_desc:0 "Officers, workers, rural notables and merchants can support the same presidency for very different reasons. A durable coalition must give each a recognizable place without allowing every demand to become an entitlement. Social guarantees help hold the bargain together, but their continuing cost cannot be hidden behind political reassurance."
 COLDWAR_SYR_hafez_07_resume:0 "Carry Out: A Durable Governing Coalition"
 COLDWAR_SYR_hafez_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_rifaat:0 "Rifaat al-Assad directs the governing programme."
 COLDWAR_SYR_succession_crisis_resolved_eligibility_tt:0 "The presidential succession crisis has been settled."
 COLDWAR_SYR_rifaat_entry:0 "A Rival Power Centre"
 COLDWAR_SYR_rifaat_entry_desc:0 "Presidential incapacity has exposed a rival centre of armed authority around Rifaat al-Assad. The issue is no longer a distant succession question: commanders must decide whose orders hold. Resolving this crisis requires dealing with the guard formations and personal loyalties that have developed alongside the regular state."
 COLDWAR_SYR_rifaat_entry_resume:0 "Carry Out: A Rival Power Centre"
 COLDWAR_SYR_rifaat_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_rifaat_01:0 "A Family Bargain"
 COLDWAR_SYR_rifaat_01_desc:0 "A negotiated family bargain could restrain the confrontation before rival formations make the capital their battlefield. Such an agreement would reassure officials who fear open conflict. It also preserves the principle that powerful relatives and their clients can bargain over state authority beyond the normal reach of public institutions."
 COLDWAR_SYR_rifaat_01_resume:0 "Carry Out: A Family Bargain"
 COLDWAR_SYR_rifaat_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_rifaat_02:0 "Military Seizure"
 COLDWAR_SYR_rifaat_02_desc:0 "Rifaat can attempt to turn the guard's presence into an immediate seizure of power. A successful move would give his supporters a clear command at the summit. It would also subordinate civilian administration to the demands of a military takeover and leave lasting uncertainty over the legitimacy of the new order."
 COLDWAR_SYR_rifaat_02_resume:0 "Carry Out: Military Seizure"
 COLDWAR_SYR_rifaat_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_rifaat_03:0 "Negotiate Commands"
 COLDWAR_SYR_rifaat_03_desc:0 "The guard commanders need guarantees about orders, appointments and their future place in the armed forces. Negotiating those terms may prevent a succession dispute from breaking the command structure apart. Concessions will complicate administration, but a settlement accepted by the actual commanders is worth more than a declaration they ignore."
 COLDWAR_SYR_rifaat_03_resume:0 "Carry Out: Negotiate the Guard Commands"
 COLDWAR_SYR_rifaat_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_rifaat_04:0 "Capital Companies"
 COLDWAR_SYR_rifaat_04_desc:0 "The Defence Companies can be concentrated around the capital as the strongest instrument of the succession. Mobilizing their supporters widens the resources available to Rifaat's camp. It also strengthens a separate military network whose recruitment and loyalties may sit uneasily beside the regular chain of command."
 COLDWAR_SYR_rifaat_04_resume:0 "Carry Out: Capital Defence Companies"
 COLDWAR_SYR_rifaat_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_rifaat_05:0 "Reorganize Guard"
 COLDWAR_SYR_rifaat_05_desc:0 "A presidential guard should protect the office rather than serve as a private claim to inherit it. Reorganization can restore clearer training and command standards after the crisis. Professional control requires narrowing the patronage and recruitment arrangements through which rival commanders assembled their extraordinary political weight."
 COLDWAR_SYR_rifaat_05_resume:0 "Carry Out: Reorganize the Presidential Guard"
 COLDWAR_SYR_rifaat_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_rifaat_06:0 "Regularize Accounts"
 COLDWAR_SYR_rifaat_06_desc:0 "Separate security accounts have allowed armed institutions to conceal obligations and cultivate their own clients. Bringing those accounts into regular review would reveal the financial shape of the succession settlement. Reliable oversight needs staff and access, particularly when the officers being questioned still possess the means to resist scrutiny."
 COLDWAR_SYR_rifaat_06_resume:0 "Carry Out: Regularize Security Accounts"
 COLDWAR_SYR_rifaat_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_rifaat_07:0 "Settle the Succession"
 COLDWAR_SYR_rifaat_07_desc:0 "A succession settlement must establish who can issue binding orders after the immediate confrontation has ended. Officials and communities need confidence that the bargain will survive its first disagreement. Securing that confidence means negotiating restraints with the very networks that made the crisis possible, rather than merely announcing a victor."
 COLDWAR_SYR_rifaat_07_resume:0 "Carry Out: Settle the Succession"
 COLDWAR_SYR_rifaat_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_communist:0 "§Y$COLDWAR_SYR_party_4$§! leads the government."
 COLDWAR_SYR_communist_entry:0 "Workers' Party Voice"
 COLDWAR_SYR_communist_entry_desc:0 "Syrian Communists draw strength from labour organization, intellectual circles and their claim to defend ordinary people against privileged interests. Governing gives those commitments a harder test. Workers need representation that can influence policy, while the party must decide how much independent debate its socialist administration can accommodate."
 COLDWAR_SYR_communist_entry_resume:0 "Carry Out: Workers’ Political Representation"
 COLDWAR_SYR_communist_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_communist_01:0 "Disciplined Party State"
 COLDWAR_SYR_communist_01_desc:0 "A disciplined party state can coordinate production and overcome obstruction from established interests. Its supporters argue that socialist transformation requires unity of direction. Concentrating authority also restricts open criticism, making it harder for workers, researchers and administrators to challenge plans that the leadership has already declared politically correct."
 COLDWAR_SYR_communist_01_resume:0 "Carry Out: A Disciplined Party State"
 COLDWAR_SYR_communist_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_communist_02:0 "Autonomous Coalition"
 COLDWAR_SYR_communist_02_desc:0 "Socialist government can rest on cooperation among parties, unions and civic organizations rather than the supremacy of a single apparatus. An independent coalition would broaden ownership of reform. It must accept disagreement and negotiation as ordinary features of government, even when that slows decisions the Communist leadership considers urgent."
 COLDWAR_SYR_communist_02_resume:0 "Carry Out: An Independent Socialist Coalition"
 COLDWAR_SYR_communist_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_communist_03:0 "Central Directives"
 COLDWAR_SYR_communist_03_desc:0 "Central directives can concentrate scarce equipment and materials on the industries considered essential to development. Enterprises would receive clearer priorities instead of competing through personal connections. The planning offices must bear the burden of collecting reliable information, and mistakes at the centre can then spread across whole sectors."
 COLDWAR_SYR_communist_03_resume:0 "Carry Out: Central Production Directives"
 COLDWAR_SYR_communist_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_communist_04:0 "Autonomous Unions"
 COLDWAR_SYR_communist_04_desc:0 "Trade unions should speak for workers even when their employer is the socialist state. Independent organization can expose unsafe conditions and impractical production targets before they become crises. Meaningful representation obliges the government to negotiate wages, protection and working conditions instead of treating every complaint as a problem of discipline."
 COLDWAR_SYR_communist_04_resume:0 "Carry Out: Independent Trade Unions"
 COLDWAR_SYR_communist_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_communist_05:0 "Socialist Growth Debate"
 COLDWAR_SYR_communist_05_desc:0 "Syria's socialist future cannot be reduced to choosing which ministry controls the next investment. The development debate must weigh productive capacity against everyday needs, rural change against urban employment, and national autonomy against outside expertise. Turning those arguments into a coherent plan demands institutions capable of sustained economic coordination."
 COLDWAR_SYR_communist_05_resume:0 "Carry Out: The Socialist Development Debate"
 COLDWAR_SYR_communist_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_communist_06:0 "Agrarian Cooperatives"
 COLDWAR_SYR_communist_06_desc:0 "Agrarian cooperatives can pool equipment and help cultivators secure inputs without surrendering their livelihoods to private intermediaries. Their success depends on local participation rather than compulsory enthusiasm. Public administrators must provide dependable support while ensuring that cooperative offices do not simply become new centres of influence over the countryside."
 COLDWAR_SYR_communist_06_resume:0 "Carry Out: Agrarian Cooperatives"
 COLDWAR_SYR_communist_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_communist_07:0 "Technical Institutes"
 COLDWAR_SYR_communist_07_desc:0 "A socialist economy needs machinists, laboratory staff and engineers as urgently as political organizers. Technical institutes can open skilled careers to families excluded from older educational advantages. The investment must continue beyond classrooms, supporting instructors and practical training if graduates are to meet the needs of real workplaces."
 COLDWAR_SYR_communist_07_resume:0 "Carry Out: Technical Institutes"
 COLDWAR_SYR_communist_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_communist_08:0 "Workers' Guarantees"
 COLDWAR_SYR_communist_08_desc:0 "Workers will judge socialist government by security in their daily lives. Social guarantees can make the factory a place of stable employment rather than permanent uncertainty. These commitments also create continuing obligations, requiring the cabinet to match its promises with productive enterprises and a budget able to sustain them."
 COLDWAR_SYR_communist_08_resume:0 "Carry Out: Workers’ Social Guarantees"
 COLDWAR_SYR_communist_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_communist_09:0 "Prioritize Industry"
 COLDWAR_SYR_communist_09_desc:0 "Heavy industry promises greater control over the machinery and materials on which development depends. Concentrating effort there can build a stronger productive foundation. The approach requires extensive coordination and patient investment, while households and lighter industries must wait for resources committed to projects whose benefits arrive slowly."
 COLDWAR_SYR_communist_09_resume:0 "Carry Out: Prioritize Heavy Industry"
 COLDWAR_SYR_communist_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_communist_10:0 "Prioritize Provision"
 COLDWAR_SYR_communist_10_desc:0 "Socialism must also appear in the availability of clothing, household goods and reliable everyday supplies. Prioritizing consumer provision can answer frustrations that grand industrial plans leave untouched. Supporting those enterprises and their workers carries a continuing social cost, and draws attention away from investments promising greater strategic independence."
 COLDWAR_SYR_communist_10_resume:0 "Carry Out: Prioritize Consumer Provision"
 COLDWAR_SYR_communist_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_communist_11:0 "Socialist Programme"
 COLDWAR_SYR_communist_11_desc:0 "A national socialist programme must bind labour representation, rural development and public ownership into more than separate demands. Its legitimacy depends on a settlement that communities can recognize in daily administration. Preserving that agreement will require political compromise as well as a conviction that the chosen economic system is just."
 COLDWAR_SYR_communist_11_resume:0 "Carry Out: A Socialist National Programme"
 COLDWAR_SYR_communist_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_bakdash:0 "Khalid Bakdash directs the governing programme."
 COLDWAR_SYR_bakdash_entry:0 "Disciplined Cadres"
 COLDWAR_SYR_bakdash_entry_desc:0 "Khalid Bakdash's authority comes from decades of Communist organization and a disciplined party accustomed to difficult alliances. His cadres can give government a coherent political network. They must decide whether loyalty and accumulated experience are sufficient guides for institutions facing new economic pressures and demands for broader participation."
 COLDWAR_SYR_bakdash_entry_resume:0 "Carry Out: Disciplined Communist Cadres"
 COLDWAR_SYR_bakdash_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_bakdash_01:0 "Partnership in the Front"
 COLDWAR_SYR_bakdash_01_desc:0 "Participation in a national front can protect Communist organization and secure a place in policymaking without an immediate struggle for supremacy. Bakdash would bargain from within the coalition. The party must constantly demonstrate that cooperation wins something substantial for its supporters rather than merely lending its prestige to stronger allies."
 COLDWAR_SYR_bakdash_01_resume:0 "Carry Out: Partnership in the Front"
 COLDWAR_SYR_bakdash_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_bakdash_02:0 "Communist Primacy"
 COLDWAR_SYR_bakdash_02_desc:0 "Bakdash can insist that a Communist government requires Communist leadership throughout the state. A clearer line would reduce ambiguity between competing socialist partners. It also strengthens ideological authority over professional and intellectual life, making the government's ability to learn depend increasingly on what the party permits its own cadres to question."
 COLDWAR_SYR_bakdash_02_resume:0 "Carry Out: Communist Primacy"
 COLDWAR_SYR_bakdash_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_bakdash_03:0 "Bargain Guarantees"
 COLDWAR_SYR_bakdash_03_desc:0 "Coalition participation should deliver enforceable protection for labour, not merely ministerial titles. Bakdash can press for workplace security and a stronger position for organized workers. These guarantees bind the government to continuing expenditure and negotiation, testing whether its partners value labour support enough to bear the accompanying obligations."
 COLDWAR_SYR_bakdash_03_resume:0 "Carry Out: Bargain for Labour Guarantees"
 COLDWAR_SYR_bakdash_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_bakdash_04:0 "Lead Socialist Coalition"
 COLDWAR_SYR_bakdash_04_desc:0 "Leading the socialist coalition would allow Bakdash to translate the party's organizational strength into a coordinated development policy. Partners must still see a reason to cooperate. A larger coordinating apparatus can deliver decisions, but also risks making every public project dependent on negotiations among committees claiming to represent the revolution."
 COLDWAR_SYR_bakdash_04_resume:0 "Carry Out: Lead the Socialist Coalition"
 COLDWAR_SYR_bakdash_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_bakdash_05:0 "Soviet Expertise"
 COLDWAR_SYR_bakdash_05_desc:0 "Soviet technical traditions offer a familiar source of expertise for Bakdash's development ambitions. Training and specialist knowledge can strengthen the skills available to public institutions. Making that knowledge useful requires investment in Syrian education and professional staff, rather than assuming political friendship can substitute for sustained domestic capacity."
 COLDWAR_SYR_bakdash_05_resume:0 "Carry Out: Soviet Technical Expertise"
 COLDWAR_SYR_bakdash_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_bakdash_06:0 "Factory Councils"
 COLDWAR_SYR_bakdash_06_desc:0 "Factory councils can give workers a recognized place in the management of public enterprises. Their deliberations should connect production plans with the knowledge of people on the shop floor. Councils also make social obligations harder to disregard, requiring directors and ministers to accommodate interests that cannot be settled by production orders alone."
 COLDWAR_SYR_bakdash_06_resume:0 "Carry Out: Factory Councils"
 COLDWAR_SYR_bakdash_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_bakdash_07:0 "Party Workers Peasants"
 COLDWAR_SYR_bakdash_07_desc:0 "A Communist party rooted only in urban organization cannot speak credibly for Syria's rural majority. Bakdash can strengthen links between workers and peasants through local organizing and agricultural support. Extending that presence demands administrative effort and sensitivity to cultivators whose interests do not always match the priorities of industrial planning."
 COLDWAR_SYR_bakdash_07_resume:0 "Carry Out: A Party of Workers and Peasants"
 COLDWAR_SYR_bakdash_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_turk:0 "Riyad al-Turk directs the governing programme."
 COLDWAR_SYR_political_bureau_formed_eligibility_tt:0 "The Communist Political Bureau has been organized."
 COLDWAR_SYR_turk_entry:0 "Autonomous Bureau"
 COLDWAR_SYR_turk_entry_desc:0 "Riyad al-Turk's Political Bureau offers a left alternative unwilling to subordinate its judgement to the established Communist leadership. Independence gives it room to question inherited alliances and state repression. Governing will test whether a movement shaped by dissent can build institutions without reproducing the restrictions it opposed."
 COLDWAR_SYR_turk_entry_resume:0 "Carry Out: An Independent Political Bureau"
 COLDWAR_SYR_turk_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_turk_01:0 "Socialist Pluralism"
 COLDWAR_SYR_turk_01_desc:0 "Socialist pluralism would allow competing organizations to argue openly about the country's future. Al-Turk can seek a left government whose authority rests on participation rather than enforced agreement. The resulting debate will make policy less predictable, requiring patience with allies and opponents who refuse to follow a common party line."
 COLDWAR_SYR_turk_01_resume:0 "Carry Out: Socialist Pluralism"
 COLDWAR_SYR_turk_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_turk_02:0 "Revolutionary Discipline"
 COLDWAR_SYR_turk_02_desc:0 "The Political Bureau can answer the difficulties of government by tightening its own discipline. A more coherent organization would carry decisions into public institutions and local branches. It would also require additional supervision, raising the familiar danger that a movement seeking independence becomes reluctant to tolerate disagreement within its own ranks."
 COLDWAR_SYR_turk_02_resume:0 "Carry Out: Revolutionary Party Discipline"
 COLDWAR_SYR_turk_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_turk_03:0 "National Coalition"
 COLDWAR_SYR_turk_03_desc:0 "A national democratic coalition can bring the independent left together with other opponents of arbitrary government. Common guarantees offer a foundation wider than any single socialist organization. Al-Turk must accept that allies have their own constituencies and priorities, making the coalition a continuing negotiation rather than an extension of party leadership."
 COLDWAR_SYR_turk_03_resume:0 "Carry Out: National Democratic Coalition"
 COLDWAR_SYR_turk_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_turk_04:0 "Democratic Centralism"
 COLDWAR_SYR_turk_04_desc:0 "Democratic centralism promises a disciplined administration after internal debate has ended. Its supporters believe coherent direction is necessary to make socialist reform effective. The machinery needed to enforce that unity can become cumbersome, and the line between settled policy and forbidden criticism will be tested whenever practical results disappoint the leadership."
 COLDWAR_SYR_turk_04_resume:0 "Carry Out: Democratic Centralism"
 COLDWAR_SYR_turk_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_turk_05:0 "Autonomous Organizing"
 COLDWAR_SYR_turk_05_desc:0 "Independent labour organization can prevent a socialist cabinet from speaking in the workers' name while refusing to hear them. Unions should bring workplace experience into economic policy and defend their members against arbitrary management. Their independence also commits the government to real bargaining over the social costs of production."
 COLDWAR_SYR_turk_05_resume:0 "Carry Out: Independent Labour Organizing"
 COLDWAR_SYR_turk_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_turk_06:0 "End Emergency"
 COLDWAR_SYR_turk_06_desc:0 "Permanent emergency has made political uncertainty an ordinary condition of Syrian life. Al-Turk's government can replace that habit with regular procedures and a clearer division of authority. Building confidence in ordinary institutions requires sustained administrative work, particularly among officials who learned to treat exceptional powers as their normal instrument."
 COLDWAR_SYR_turk_06_resume:0 "Carry Out: End Permanent Emergency"
 COLDWAR_SYR_turk_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_turk_07:0 "Democratic Republic"
 COLDWAR_SYR_turk_07_desc:0 "A democratic socialist republic needs citizens capable of questioning its institutions as well as benefiting from them. Education and public expertise can support a more participatory political life. Sustaining that ambition requires resources and tolerance for the independent thought that a genuinely educated population will bring to government."
 COLDWAR_SYR_turk_07_resume:0 "Carry Out: A Democratic Socialist Republic"
 COLDWAR_SYR_turk_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_faisal:0 "Yusuf Faisal directs the governing programme."
 COLDWAR_SYR_faisal_faction_formed_eligibility_tt:0 "Yusuf Faisal's Communist faction has been organized."
 COLDWAR_SYR_faisal_entry:0 "Open Debate"
 COLDWAR_SYR_faisal_entry_desc:0 "Yusuf Faisal's Communist leadership emerges from a dispute over how socialism should respond to changing conditions. An open debate can draw specialists and party members into examining accepted methods. The challenge is to permit useful criticism without allowing every economic disagreement to reopen the organizational divisions that brought the new leadership forward."
 COLDWAR_SYR_faisal_entry_resume:0 "Carry Out: An Open Communist Debate"
 COLDWAR_SYR_faisal_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_faisal_01:0 "Managed Reform"
 COLDWAR_SYR_faisal_01_desc:0 "Managed reform can give enterprises more room to respond to demand while retaining a socialist political framework. Faisal's supporters must define where initiative ends and public obligation begins. Commercial openings may stimulate investment, but they also weaken direct fiscal control and expose production to pressures beyond the planning apparatus."
 COLDWAR_SYR_faisal_01_resume:0 "Carry Out: Managed Economic Reform"
 COLDWAR_SYR_faisal_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_faisal_02:0 "Cadre Orthodoxy"
 COLDWAR_SYR_faisal_02_desc:0 "Experienced cadres fear that reform will dissolve the party's purpose into a series of concessions. Reaffirming orthodoxy can reassure the organization and preserve a common political language. It also expands the work of supervision and may discourage the very local experimentation needed to discover which inherited arrangements no longer serve public goals."
 COLDWAR_SYR_faisal_02_resume:0 "Carry Out: Cadre Orthodoxy"
 COLDWAR_SYR_faisal_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_faisal_03:0 "Enterprise Experiments"
 COLDWAR_SYR_faisal_03_desc:0 "Selected enterprises can test new management practices before the government commits the whole public sector. Careful experiments would give reformers evidence beyond political argument. They require close evaluation and competent oversight, since an apparent success can conceal privileged access to inputs, while a poorly supervised failure may discredit useful changes."
 COLDWAR_SYR_faisal_03_resume:0 "Carry Out: Enterprise Experiments"
 COLDWAR_SYR_faisal_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_faisal_04:0 "Retain Guarantees"
 COLDWAR_SYR_faisal_04_desc:0 "Reform need not abandon the employment and social guarantees attached to public planning. Retaining those protections can reassure workers who fear that enterprise autonomy simply means insecurity. The government must then finance its commitments honestly and accept that some commercially attractive changes will remain limited by its obligations to employees."
 COLDWAR_SYR_faisal_04_resume:0 "Carry Out: Retain Planning Guarantees"
 COLDWAR_SYR_faisal_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_faisal_05:0 "Reformed Coalition"
 COLDWAR_SYR_faisal_05_desc:0 "A reformed socialist coalition can unite supporters of change with those who want firm public guarantees. Their agreement must specify which principles are shared and which questions remain open. Holding that coalition together will take negotiation, particularly when its members interpret an economic setback as proof that their preferred course was ignored."
 COLDWAR_SYR_faisal_05_resume:0 "Carry Out: A Reformed Socialist Coalition"
 COLDWAR_SYR_faisal_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_faisal_06:0 "Technical Exchange"
 COLDWAR_SYR_faisal_06_desc:0 "Technical exchange can widen the range of ideas available to Syrian planners and specialists. Faisal's government should bring useful knowledge into domestic institutions rather than confine it to visiting delegations. That means paying for training and professional development, while allowing experts to compare familiar methods with approaches that may challenge them."
 COLDWAR_SYR_faisal_06_resume:0 "Carry Out: Technical Exchange"
 COLDWAR_SYR_faisal_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_faisal_07:0 "Sustainable Budget"
 COLDWAR_SYR_faisal_07_desc:0 "A sustainable socialist budget must distinguish a public commitment from an unexamined subsidy. Better accounts and credible revenue administration can protect essential services without disguising every enterprise loss. Building this capacity carries its own administrative cost, and the party must tolerate conclusions that may expose favoured institutions to uncomfortable scrutiny."
 COLDWAR_SYR_faisal_07_resume:0 "Carry Out: A Sustainable Socialist Budget"
 COLDWAR_SYR_faisal_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_nasserist:0 "§Y$COLDWAR_SYR_party_13$§! leads the government."
 COLDWAR_SYR_nasserist_entry:0 "Arab Socialist Institutes"
 COLDWAR_SYR_nasserist_entry_desc:0 "Nasserism joins Arab unity to social transformation, but Syria remembers how a union can diminish its own political voice. Building Arab socialist institutions at home would give the movement a firmer governing base. Its supporters must reconcile their wider regional aspiration with the daily responsibilities of administering a sovereign republic."
 COLDWAR_SYR_nasserist_entry_resume:0 "Carry Out: Arab Socialist Institutions"
 COLDWAR_SYR_nasserist_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_nasserist_01:0 "Union by Negotiation"
 COLDWAR_SYR_nasserist_01_desc:0 "A new union should be negotiated between governments that understand what they are being asked to share. Syrian representatives must establish responsibilities before enthusiasm becomes another unequal arrangement. Negotiation requires patient coordination and cannot guarantee agreement, especially when partners differ over the balance between common institutions and national authority."
 COLDWAR_SYR_nasserist_01_resume:0 "Carry Out: Union by Negotiation"
 COLDWAR_SYR_nasserist_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_nasserist_02:0 "Sovereign Socialism"
 COLDWAR_SYR_nasserist_02_desc:0 "Arab socialism can guide a sovereign Syrian republic without making immediate union its measure of success. This course gives Damascus greater freedom to set national priorities. It also asks Syria to carry more of the financial and administrative burden itself, without assuming that a broader Arab framework will ease difficult choices."
 COLDWAR_SYR_nasserist_02_resume:0 "Carry Out: Sovereign Arab Socialism"
 COLDWAR_SYR_nasserist_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_nasserist_03:0 "Federal Commission"
 COLDWAR_SYR_nasserist_03_desc:0 "A federal economic commission could prepare common investment and reconcile development priorities before political promises outrun practical cooperation. Syrian negotiators must protect their country's voice in its decisions. Easier coordination with partners also brings exposure to shared financial obligations and commitments whose consequences may extend well beyond the original agreement."
 COLDWAR_SYR_nasserist_03_resume:0 "Carry Out: A Federal Economic Commission"
 COLDWAR_SYR_nasserist_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_nasserist_04:0 "National Cabinet"
 COLDWAR_SYR_nasserist_04_desc:0 "The Arab socialist government needs a cabinet that can coordinate development rather than divide projects among competing political patrons. Clear ministerial responsibilities would make national priorities easier to execute. The coordinating apparatus must remain capable and accountable, or it will merely add another layer between a local need and an answer from Damascus."
 COLDWAR_SYR_nasserist_04_resume:0 "Carry Out: A National Development Cabinet"
 COLDWAR_SYR_nasserist_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_nasserist_05:0 "An Arab Social Charter"
 COLDWAR_SYR_nasserist_05_desc:0 "An Arab social charter should give workers recognizable protection instead of leaving social justice as an abstract regional slogan. Shared principles can guide employment and public provision at home. Their credibility depends on sustained expenditure and administration, especially when the government's diplomatic ambitions compete with its obligations to Syrian households."
 COLDWAR_SYR_nasserist_05_resume:0 "Carry Out: An Arab Social Charter"
 COLDWAR_SYR_nasserist_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_nasserist_06:0 "Civilian Mass Groups"
 COLDWAR_SYR_nasserist_06_desc:0 "Civilian organizations can bring students, workers and professional groups into Arab socialist politics without making the barracks their permanent intermediary. Their participation widens the movement's social base. It also creates independent voices whose demands the government must negotiate, accepting that mass organization cannot remain useful if every conclusion is prescribed from above."
 COLDWAR_SYR_nasserist_06_resume:0 "Carry Out: Civilian Mass Organizations"
 COLDWAR_SYR_nasserist_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_nasserist_07:0 "Public Campaign"
 COLDWAR_SYR_nasserist_07_desc:0 "A public education campaign can connect Arab cultural confidence with practical skills and wider access to learning. Provincial schools and technical instruction should reach families left behind by the old order. The promise requires trained teachers, materials and continuing support, not simply a new political vocabulary in an unchanged classroom."
 COLDWAR_SYR_nasserist_07_resume:0 "Carry Out: Public Education Campaign"
 COLDWAR_SYR_nasserist_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_nasserist_08:0 "Socialist Liaison"
 COLDWAR_SYR_nasserist_08_desc:0 "Socialist coordination should align public enterprises and development offices around achievable goals. Common priorities can reduce contradictory instructions and make scarce resources work harder. Their value depends on accurate reporting and capable administration; an enlarged planning structure that only repeats approved ambitions will leave the original bottlenecks firmly in place."
 COLDWAR_SYR_nasserist_08_resume:0 "Carry Out: Socialist Economic Coordination"
 COLDWAR_SYR_nasserist_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_nasserist_09:0 "Follow Diplomacy"
 COLDWAR_SYR_nasserist_09_desc:0 "Following Cairo's diplomatic lead would give Syria's Nasserists a clearer regional reference and a more consistent message. Coordination can reduce friction among partners who invoke the same Arab cause. It requires regular consultation, and Syrian ministers must be prepared for occasions when Cairo's priorities place an unwelcome limit on their own discretion."
 COLDWAR_SYR_nasserist_09_resume:0 "Carry Out: Follow Cairo’s Diplomacy"
 COLDWAR_SYR_nasserist_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_nasserist_10:0 "Autonomous Position"
 COLDWAR_SYR_nasserist_10_desc:0 "Damascus can defend Arab solidarity while judging each diplomatic question through Syrian interests. An independent position may strengthen the government's authority at home and preserve room for negotiation. It also leaves Syria responsible for cultivating its own sources of support, without assuming that shared ideology will automatically secure economic accommodation abroad."
 COLDWAR_SYR_nasserist_10_resume:0 "Carry Out: An Independent Arab Position"
 COLDWAR_SYR_nasserist_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_nasserist_11_reform_tt:0 "If the constitutional political pact and competitive elections are in force, abolishes the Permanent Emergency: removes stability +4%, research speed −4% and political power gain −5%. An authoritarian mandate retains the existing spirit."
 COLDWAR_SYR_nasserist_11_political_outcome_tt:0 "A constitutional pact and competitive elections allow the government to end permanent emergency rule."
 COLDWAR_SYR_nasserist_11:0 "Arab Mandate"
 COLDWAR_SYR_nasserist_11_desc:0 "An Arab republican mandate should connect regional purpose with a government answerable for conditions inside Syria. Workers, provincial communities and civilian organizations need an agreed place in that project. The settlement will be stronger for their participation, but maintaining it requires compromise rather than treating unity as an instruction that ends disagreement."
 COLDWAR_SYR_nasserist_11_resume:0 "Carry Out: An Arab Republican Mandate"
 COLDWAR_SYR_nasserist_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_jamal:0 "Jamal al-Atassi directs the governing programme."
 COLDWAR_SYR_jamal_entry:0 "Autonomous Union"
 COLDWAR_SYR_jamal_entry_desc:0 "Jamal al-Atassi's Arab Socialist Union can defend Nasserist principles without accepting a subordinate place in another party's front. Its independence makes civilian participation and genuine political consultation central questions. Governing will require turning those demands into institutions while preserving an Arab outlook that does not silence Syria's own political life."
 COLDWAR_SYR_jamal_entry_resume:0 "Carry Out: An Independent Arab Socialist Union"
 COLDWAR_SYR_jamal_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jamal_01:0 "A Federation by Consent"
 COLDWAR_SYR_jamal_01_desc:0 "Jamal al-Atassi can renew the federal ambition on the basis of consent rather than administrative absorption. Delegates must establish how Syrians will be represented before new common institutions are promised. This approach gives negotiation substance, but demands patience with partners whose understanding of Arab unity may leave little room for national safeguards."
 COLDWAR_SYR_jamal_01_resume:0 "Carry Out: A Federation by Consent"
 COLDWAR_SYR_jamal_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jamal_02:0 "Sovereign Republic"
 COLDWAR_SYR_jamal_02_desc:0 "A sovereign socialist republic allows the Arab Socialist Union to pursue reform without making another union the immediate test of its legitimacy. Syrian institutions can develop their own representative authority. The government must nevertheless sustain development through its own bargaining and resources, since political independence does not remove dependence on outside investment."
 COLDWAR_SYR_jamal_02_resume:0 "Carry Out: A Sovereign Socialist Republic"
 COLDWAR_SYR_jamal_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jamal_03:0 "Negotiate Safeguards"
 COLDWAR_SYR_jamal_03_desc:0 "Federal safeguards should protect representative institutions, ministerial responsibility and a recognizable Syrian voice in common decisions. Writing them requires more than a declaration of fraternal intentions. Durable guarantees need procedures and officials able to enforce them, accepting the administrative complexity that comes with sharing authority without surrendering it entirely."
 COLDWAR_SYR_jamal_03_resume:0 "Carry Out: Negotiate Federal Safeguards"
 COLDWAR_SYR_jamal_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jamal_04:0 "Civilian Arab Solidarity"
 COLDWAR_SYR_jamal_04_desc:0 "Arab solidarity can grow through writers, teachers and civic associations as well as negotiations between presidents. Jamal al-Atassi's movement can support those connections while keeping them in civilian hands. Such a network encourages exchange, but it also gives public intellectuals room to criticize the government's interpretation of the common cause."
 COLDWAR_SYR_jamal_04_resume:0 "Carry Out: Civilian Arab Solidarity"
 COLDWAR_SYR_jamal_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jamal_05:0 "End Emergency"
 COLDWAR_SYR_jamal_05_desc:0 "A civilian Arab republic cannot live indefinitely under rules that make ordinary political disagreement an emergency. Ending that habit would strengthen the promise of representative government. It requires an agreement broad enough to reassure a suspicious public and accept that lawful opposition will continue to challenge ministers after the reform is announced."
 COLDWAR_SYR_jamal_05_resume:0 "Carry Out: End Permanent Emergency"
 COLDWAR_SYR_jamal_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jamal_06:0 "Organize Allies"
 COLDWAR_SYR_jamal_06_desc:0 "Democratic allies can give independent Nasserism the breadth it lacks on its own. Shared commitments to civilian government offer a starting point for cooperation across party traditions. Their alliance must leave room for real differences over economics and regional policy, making consultation a permanent duty rather than a temporary price of accession."
 COLDWAR_SYR_jamal_06_resume:0 "Carry Out: Organize Democratic Allies"
 COLDWAR_SYR_jamal_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_jamal_07:0 "A Civilian Arab Republic"
 COLDWAR_SYR_jamal_07_desc:0 "A civilian Arab republic needs institutions capable of governing beyond the appeal of a charismatic movement. Education and professional competence can give representative politics a practical foundation. The Union must invest in that capacity and accept a public increasingly able to question its leaders, including those who speak in the name of Arab unity."
 COLDWAR_SYR_jamal_07_resume:0 "Carry Out: A Civilian Arab Republic"
 COLDWAR_SYR_jamal_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_safwan:0 "Safwan al-Qudsi directs the governing programme."
 COLDWAR_SYR_safwan_leadership_established_eligibility_tt:0 "Safwan al-Qudsi's leadership organization has been established."
 COLDWAR_SYR_safwan_entry:0 "Nasserism Front"
 COLDWAR_SYR_safwan_entry_desc:0 "Safwan al-Qudsi's Nasserist current seeks influence through participation in the governing front. Cooperation offers access to ministries and public institutions, but risks dissolving the party's independent identity. Its programme must show what organized Nasserist participation contributes beyond another expression of support for the existing presidency."
 COLDWAR_SYR_safwan_entry_resume:0 "Carry Out: Nasserism within the Front"
 COLDWAR_SYR_safwan_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_safwan_01:0 "Cooperate Presidency"
 COLDWAR_SYR_safwan_01_desc:0 "Cooperation with the presidency can give Nasserist ministers a dependable place within the governing order. Regular consultation may make their proposals easier to advance. They must maintain the machinery of coordination and persuade supporters that proximity to presidential authority has produced influence rather than a comfortable form of political dependence."
 COLDWAR_SYR_safwan_01_resume:0 "Carry Out: Cooperate with the Presidency"
 COLDWAR_SYR_safwan_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_safwan_02:0 "Equal Coalition Status"
 COLDWAR_SYR_safwan_02_desc:0 "The front's smaller partners can ask to be treated as political participants with responsibilities of their own. Equal coalition status would make Nasserist support more credible to members who distrust automatic endorsement. It also commits the cabinet to negotiating differences that a dominant presidency might otherwise settle by instruction."
 COLDWAR_SYR_safwan_02_resume:0 "Carry Out: Equal Coalition Status"
 COLDWAR_SYR_safwan_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_safwan_03:0 "Institutional Bargaining"
 COLDWAR_SYR_safwan_03_desc:0 "Institutional bargaining gives disagreements a recognized place inside the front instead of leaving every dispute to personal access. Defined meetings and ministerial responsibilities could make coalition participation more predictable. Maintaining these arrangements needs administrative effort, and their worth will depend on whether powerful partners honour them when negotiations become inconvenient."
 COLDWAR_SYR_safwan_03_resume:0 "Carry Out: Institutional Bargaining"
 COLDWAR_SYR_safwan_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_safwan_04:0 "Autonomous Voice"
 COLDWAR_SYR_safwan_04_desc:0 "A Nasserist minister should be able to present informed advice even when it differs from the presidency's preference. Protecting an independent ministerial voice can bring more expertise into cabinet decisions. It also makes the coalition less immediately obedient, requiring its senior partners to distinguish useful criticism from political disloyalty."
 COLDWAR_SYR_safwan_04_resume:0 "Carry Out: An Independent Ministerial Voice"
 COLDWAR_SYR_safwan_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_safwan_05:0 "Cultural Arabism"
 COLDWAR_SYR_safwan_05_desc:0 "Cultural Arabism offers the party a public role beyond negotiations over office. Writers, educators and associations can sustain an Arab civic identity within Syrian life. Supporting their work invites a wider exchange of ideas, including arguments that do not fit comfortably within the front's preferred account of its own achievements."
 COLDWAR_SYR_safwan_05_resume:0 "Carry Out: Cultural Arabism"
 COLDWAR_SYR_safwan_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_safwan_06:0 "Public Sector Liaison"
 COLDWAR_SYR_safwan_06_desc:0 "Nasserist participation can contribute practical coordination among public enterprises and development ministries. Shared schedules and responsibilities would give the party a visible administrative purpose. The work requires staff and oversight, and its results must be judged by delivery rather than the number of committees assembled under an Arab socialist banner."
 COLDWAR_SYR_safwan_06_resume:0 "Carry Out: Public Sector Coordination"
 COLDWAR_SYR_safwan_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_safwan_07:0 "Negotiated Programme"
 COLDWAR_SYR_safwan_07_desc:0 "A negotiated coalition programme should state what the Nasserists seek for workers and public institutions in return for their cooperation. Clear commitments can make the front's agreement more than ceremonial. They also create social obligations that the cabinet must sustain after the speeches celebrating political unity have ended."
 COLDWAR_SYR_safwan_07_resume:0 "Carry Out: A Negotiated Coalition Programme"
 COLDWAR_SYR_safwan_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_parliament:0 "Constitutional conservatives, civic liberals or independent socialists lead the government."
 COLDWAR_SYR_parliament_entry:0 "Restore Civilian Voice"
 COLDWAR_SYR_parliament_entry_desc:0 "Restoring civilian representation means confronting a political order repeatedly interrupted by officers, emergency powers and party monopoly. Elected institutions need procedures and administrative support if they are to govern rather than decorate the state. Their return must give competing communities confidence that losing an argument will not mean exclusion from public life."
 COLDWAR_SYR_parliament_entry_resume:0 "Carry Out: Restore Civilian Representation"
 COLDWAR_SYR_parliament_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_parliament_01:0 "Strong Civilian Cabinet"
 COLDWAR_SYR_parliament_01_desc:0 "A strong parliamentary cabinet would place daily government in ministers who must maintain a representative majority. Debate can expose weak policy and bring more knowledge into decisions. It also requires patience with coalition partners, since authority resting on parliamentary confidence cannot always move at the speed preferred by the executive."
 COLDWAR_SYR_parliament_01_resume:0 "Carry Out: A Strong Parliamentary Cabinet"
 COLDWAR_SYR_parliament_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_parliament_02:0 "Civic Presidency"
 COLDWAR_SYR_parliament_02_desc:0 "A constitutional presidency could provide continuity above changing cabinets while remaining bound by public rules. Its powers must be clear enough to prevent another struggle between competing centres of authority. Making the arrangement work requires dependable administrative procedures and a president willing to exercise restraint when political pressure invites intervention."
 COLDWAR_SYR_parliament_02_resume:0 "Carry Out: A Constitutional Presidency"
 COLDWAR_SYR_parliament_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_parliament_03:0 "Responsible Ministries"
 COLDWAR_SYR_parliament_03_desc:0 "Coalition ministries must answer for their decisions instead of serving as separate territories awarded to party patrons. Shared standards of responsibility can give parliamentary government practical credibility. Ministers will have to defend compromises before their supporters, accepting that a functioning coalition cannot satisfy every party's programme in full."
 COLDWAR_SYR_parliament_03_resume:0 "Carry Out: Responsible Coalition Ministries"
 COLDWAR_SYR_parliament_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_parliament_04:0 "Civilian Mandate"
 COLDWAR_SYR_parliament_04_desc:0 "Civilian executive authority should rest on defined responsibilities rather than the goodwill of barracks and party offices. A clear mandate can reassure officials that lawful cabinet decisions will hold. Supporting that authority requires administrative capacity and regular coordination, especially while established power networks test how much the new rules really constrain them."
 COLDWAR_SYR_parliament_04_resume:0 "Carry Out: A Civilian Executive Mandate"
 COLDWAR_SYR_parliament_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_parliament_05_reform_tt:0 "Abolishes the Permanent Emergency: removes its stability +4%, research speed −4% and political power gain −5%. Ending emergency powers also ends their stability benefit."
 COLDWAR_SYR_parliament_05_political_outcome_tt:0 "Ends the permanent state of emergency."
 COLDWAR_SYR_parliament_05:0 "End Emergency"
 COLDWAR_SYR_parliament_05_desc:0 "Permanent emergency has allowed successive rulers to treat exceptional authority as an ordinary entitlement. A parliamentary republic must establish a different expectation of government. Ending that system requires a broad political settlement, and the cabinet must accept that public confidence will depend on protecting lawful criticism when it becomes uncomfortable."
 COLDWAR_SYR_parliament_05_resume:0 "Carry Out: An End to Permanent Emergency"
 COLDWAR_SYR_parliament_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_parliament_06:0 "Independent Courts"
 COLDWAR_SYR_parliament_06_desc:0 "Independent courts can give citizens an alternative to seeking protection from a political patron. Predictable proceedings would help settle disputes without turning each one into a contest of influence. Judges need trained staff, proper records and security in office if their independence is to survive pressure from ministers and powerful local interests."
 COLDWAR_SYR_parliament_06_resume:0 "Carry Out: Independent Courts"
 COLDWAR_SYR_parliament_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_parliament_07:0 "Civilian Oversight"
 COLDWAR_SYR_parliament_07_desc:0 "Civilian oversight should make defence policy accountable while leaving operational command to qualified officers. A parliament that understands military obligations can support professionalism rather than merely obstruct expenditure. Establishing that relationship limits recruitment through private political networks and asks commanders to accept scrutiny from institutions they once expected to supervise."
 COLDWAR_SYR_parliament_07_resume:0 "Carry Out: Civilian Military Oversight"
 COLDWAR_SYR_parliament_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_parliament_08:0 "A National Civil Service"
 COLDWAR_SYR_parliament_08_desc:0 "A national civil service should preserve competence through changes of cabinet. Training and professional standards can make public administration less dependent on factional appointments. The new republic must pay for that expertise and protect impartial careers, including officials whose advice displeases a governing party that expected office to deliver obedience."
 COLDWAR_SYR_parliament_08_resume:0 "Carry Out: A National Civil Service"
 COLDWAR_SYR_parliament_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_parliament_09:0 "Property Settlement"
 COLDWAR_SYR_parliament_09_desc:0 "Property disputes left by nationalization cannot be resolved simply by declaring every previous measure either sacred or void. Compensated settlements could restore commercial confidence without dispossessing all current users. They require finance and careful adjudication, leaving the republic responsible for obligations that a sweeping political slogan might otherwise conceal."
 COLDWAR_SYR_parliament_09_resume:0 "Carry Out: Compensated Property Settlement"
 COLDWAR_SYR_parliament_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_parliament_10:0 "Defend Ownership"
 COLDWAR_SYR_parliament_10_desc:0 "Civilian government need not mean dismantling the public sector. Defending public ownership can protect livelihoods and reassure workers who fear that parliamentary restoration serves only former proprietors. The cabinet must then meet the social responsibilities attached to those enterprises and demonstrate that representative oversight can improve their performance."
 COLDWAR_SYR_parliament_10_resume:0 "Carry Out: Defend Public Ownership"
 COLDWAR_SYR_parliament_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_parliament_11:0 "Constitutional Republic"
 COLDWAR_SYR_parliament_11_desc:0 "A constitutional republic must outlast the coalition that established it. Its institutions need a shared understanding that ministers can change without overturning the political order. That confidence grows through practical guarantees and repeated compromise, including recognition that opponents remain citizens with a legitimate place in the country's public life."
 COLDWAR_SYR_parliament_11_resume:0 "Carry Out: A Constitutional Republic"
 COLDWAR_SYR_parliament_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_qudsi:0 "Nazim al-Qudsi directs the governing programme."
 COLDWAR_SYR_qudsi_entry:0 "Recall Parliament"
 COLDWAR_SYR_qudsi_entry_desc:0 "Nazim al-Qudsi's restoration recalls a parliamentary tradition interrupted by military intervention. Returning representatives to public life can recover institutional experience, but cannot erase the disputes of the earlier republic. Parliament must prove capable of representing a transformed society rather than treating restoration as permission to resume every old arrangement."
 COLDWAR_SYR_qudsi_entry_resume:0 "Carry Out: Recall the Elected Parliament"
 COLDWAR_SYR_qudsi_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_qudsi_01:0 "Reverse Confiscations"
 COLDWAR_SYR_qudsi_01_desc:0 "Former owners expect a restored parliamentary government to reverse confiscations carried out under revolutionary rule. Returning assets could encourage investment and revive private commercial initiative. It also reduces direct public control and exposes the government to difficult disputes with employees, tenants and cultivators who built their livelihoods around the new arrangements."
 COLDWAR_SYR_qudsi_01_resume:0 "Carry Out: Reverse Confiscations"
 COLDWAR_SYR_qudsi_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_qudsi_02:0 "Settlements"
 COLDWAR_SYR_qudsi_02_desc:0 "Compensated settlements offer a slower path through the conflicts created by confiscation and nationalization. Claims can be recognized without immediately uprooting every current enterprise or household. Al-Qudsi's cabinet must sustain the social obligations involved and persuade former owners that negotiated restitution is more durable than a sweeping reversal."
 COLDWAR_SYR_qudsi_02_resume:0 "Carry Out: Compensated Settlements"
 COLDWAR_SYR_qudsi_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_qudsi_03:0 "Commercial Confidence"
 COLDWAR_SYR_qudsi_03_desc:0 "Commercial confidence depends on reliable agreements and a belief that economic rules will survive the next cabinet. Al-Qudsi can rebuild channels between the state and merchant capital. Easier access to finance also brings financial obligations, requiring the government to distinguish useful investment from commitments whose eventual cost exceeds their immediate political appeal."
 COLDWAR_SYR_qudsi_03_resume:0 "Carry Out: Commercial Confidence"
 COLDWAR_SYR_qudsi_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_qudsi_04:0 "Protect Smallholders"
 COLDWAR_SYR_qudsi_04_desc:0 "A restoration associated only with former large proprietors would face deep resistance in the countryside. Protecting smallholders can preserve the security of families whose position changed under land reform. Rural assistance carries continuing social costs, but makes clear that parliamentary government does not require cultivators to surrender every gain of the intervening years."
 COLDWAR_SYR_qudsi_04_resume:0 "Carry Out: Protect Smallholders"
 COLDWAR_SYR_qudsi_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_qudsi_05:0 "Civilian Oversight"
 COLDWAR_SYR_qudsi_05_desc:0 "The restored republic must avoid repeating the failures that allowed officers to decide civilian politics. Defence oversight should support a professional army with clear public obligations. Commanders will have to accept scrutiny, while parliament must resist turning appointments and recruitment into the same factional contests it claims to have overcome."
 COLDWAR_SYR_qudsi_05_resume:0 "Carry Out: Civilian Defence Oversight"
 COLDWAR_SYR_qudsi_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_qudsi_06_political_outcome_tt:0 "Reopens the citizenship registers for a renewed appeals process."
 COLDWAR_SYR_qudsi_06:0 "Review 1962 Registers"
 COLDWAR_SYR_qudsi_06_desc:0 "Al-Qudsi's own presidency signed the decree behind the exceptional Hasakah census. A restored government must confront that legacy directly rather than present exclusion as someone else's mistake. Reviewing the registers requires evidence, appeals and administrative resources, with the credibility of parliamentary citizenship resting on what the review actually changes."
 COLDWAR_SYR_qudsi_06_resume:0 "Carry Out: Review the 1962 Registers"
 COLDWAR_SYR_qudsi_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_review_completed_eligibility_tt:0 "Citizenship appeals have been reviewed and their decisions implemented."
 COLDWAR_SYR_qudsi_07:0 "Parliament All Citizens"
 COLDWAR_SYR_qudsi_07_desc:0 "A parliament claiming to represent all citizens must be able to face the people excluded by earlier state decisions. Completed citizenship review can make that claim more credible. Al-Qudsi's government must then defend the resulting settlement against allies who prefer restoration of familiar authority to an honest reckoning with its failures."
 COLDWAR_SYR_qudsi_07_resume:0 "Carry Out: A Parliament for All Citizens"
 COLDWAR_SYR_qudsi_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_dawalibi:0 "Ma’ruf al-Dawalibi directs the governing programme."
 COLDWAR_SYR_dawalibi_entry:0 "Conservative Cabinet"
 COLDWAR_SYR_dawalibi_entry_desc:0 "Ma'ruf al-Dawalibi offers a conservative civilian cabinet grounded in constitutional government and established social networks. Returning experience to office can reassure communities unsettled by revolutionary rule. The cabinet must still govern a changed country, recognizing that respect for inherited institutions cannot substitute for competent administration or a broader political agreement."
 COLDWAR_SYR_dawalibi_entry_resume:0 "Carry Out: A Conservative Constitutional Cabinet"
 COLDWAR_SYR_dawalibi_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_dawalibi_01:0 "Social Compact"
 COLDWAR_SYR_dawalibi_01_desc:0 "A socially conservative compact can bring religious figures, merchants and local notables into a common civilian project. It offers continuity without requiring another military settlement. The government must allow debate within those networks, since a compact sustained by public trust cannot simply prescribe a single view of Syria's social future."
 COLDWAR_SYR_dawalibi_01_resume:0 "Carry Out: Social Conservative Compact"
 COLDWAR_SYR_dawalibi_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_dawalibi_02:0 "Broad Civilian Compact"
 COLDWAR_SYR_dawalibi_02_desc:0 "A broader parliamentary agreement would give al-Dawalibi's cabinet partners beyond its conservative base. Shared procedures can make cooperation possible despite deep differences over social policy. The resulting government will move through bargaining rather than automatic consensus, and its leader must accept that compromise is part of the mandate rather than evidence of weakness."
 COLDWAR_SYR_dawalibi_02_resume:0 "Carry Out: Broad Parliamentary Compact"
 COLDWAR_SYR_dawalibi_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_dawalibi_03:0 "Religious Civil Society"
 COLDWAR_SYR_dawalibi_03_desc:0 "Religious civil society can provide welfare, association and a familiar channel between households and public authority. Supporting it gives the conservative cabinet a practical social foundation. Dependable provision still needs resources, and the government must ensure that relying on trusted networks does not leave assistance entirely dependent on local patronage."
 COLDWAR_SYR_dawalibi_03_resume:0 "Carry Out: Religious Civil Society"
 COLDWAR_SYR_dawalibi_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_dawalibi_04:0 "Coalition"
 COLDWAR_SYR_dawalibi_04_desc:0 "A conservative cabinet needs the confidence of communities that do not share its religious or social outlook. A cross-community coalition can provide that assurance through participation and negotiated commitments. It also limits the freedom of the largest partners, who must treat minority concerns as part of ordinary government rather than an occasional request for indulgence."
 COLDWAR_SYR_dawalibi_04_resume:0 "Carry Out: Cross-Community Coalition"
 COLDWAR_SYR_dawalibi_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_dawalibi_05:0 "Merchant Finance"
 COLDWAR_SYR_dawalibi_05_desc:0 "Merchant finance can reconnect Syrian enterprise with experienced commercial networks and outside capital. Al-Dawalibi's cabinet would make dependable agreements the basis of that relationship. Financing still has a price, and prudent government must examine repayment obligations instead of assuming that the return of commercial confidence makes every proposed arrangement beneficial."
 COLDWAR_SYR_dawalibi_05_resume:0 "Carry Out: Merchant Finance"
 COLDWAR_SYR_dawalibi_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_dawalibi_06:0 "Neutralism Affairs"
 COLDWAR_SYR_dawalibi_06_desc:0 "Neutralism would allow a conservative Syrian cabinet to judge foreign relationships without promising exclusive loyalty to either great-power camp. It can preserve political discretion at a time of intense regional competition. That discretion leaves Damascus responsible for finding workable economic partners without relying on the preferential support that firm alignment might offer."
 COLDWAR_SYR_dawalibi_06_resume:0 "Carry Out: Neutralism in Foreign Affairs"
 COLDWAR_SYR_dawalibi_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_dawalibi_07:0 "An Accountable Cabinet"
 COLDWAR_SYR_dawalibi_07_desc:0 "An accountable cabinet should make public revenue and ministerial responsibility intelligible to parliament. Better records can reduce dependence on personal assurances from respected figures. The necessary supervision costs time and resources, but a conservative restoration will remain vulnerable if familiar names are allowed to stand in place of transparent public administration."
 COLDWAR_SYR_dawalibi_07_resume:0 "Carry Out: An Accountable Cabinet"
 COLDWAR_SYR_dawalibi_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_civic:0 "§Y$COLDWAR_SYR_party_2$§! leads the government."
 COLDWAR_SYR_civic_entry:0 "A Civic Cabinet"
 COLDWAR_SYR_civic_entry_desc:0 "A civic cabinet brings lawyers, professionals and commercial reformers into government without relying on a single old parliamentary family. Its authority must come from workable institutions and open consultation. Independent expertise can improve decisions, but it also challenges parties accustomed to treating ministries as instruments of their own political organizations."
 COLDWAR_SYR_civic_entry_resume:0 "Carry Out: A Civic Cabinet"
 COLDWAR_SYR_civic_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_civic_01:0 "Export-Led Enterprise"
 COLDWAR_SYR_civic_01_desc:0 "Export enterprise can give Syrian producers customers beyond the limits of domestic purchasing power. Commercial freedom and a more open investment climate may encourage new ventures. The cabinet must accept greater exposure to outside demand and weaker direct fiscal control, while ensuring that commercial success does not become the sole measure of national development."
 COLDWAR_SYR_civic_01_resume:0 "Carry Out: Export-Led Enterprise"
 COLDWAR_SYR_civic_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_civic_02:0 "Regulated Social Market"
 COLDWAR_SYR_civic_02_desc:0 "A regulated social market would combine room for enterprise with public obligations to workers and households. Its supporters seek a constitutional settlement between competing economic traditions. Maintaining that balance requires continuing social provision and a government capable of enforcing rules, rather than assuming either markets or ministries will correct every failure on their own."
 COLDWAR_SYR_civic_02_resume:0 "Carry Out: Regulated Social Market"
 COLDWAR_SYR_civic_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_civic_03:0 "Open Commercial Credit"
 COLDWAR_SYR_civic_03_desc:0 "Open commercial credit can bring finance to enterprises that lack the right political patron. Transparent access would widen the base of private investment. The government must still examine the obligations created by cheaper entry into commercial networks, since credit can encourage productive initiative while leaving the country more vulnerable to financial pressure."
 COLDWAR_SYR_civic_03_resume:0 "Carry Out: Open Commercial Credit"
 COLDWAR_SYR_civic_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_civic_04:0 "Worker Guarantees"
 COLDWAR_SYR_civic_04_desc:0 "Economic reform will face justified suspicion if workers are asked to bear all its uncertainty. Transition guarantees can protect households while enterprises adapt to new commercial rules. Those commitments cost money and require administration, but give the civic cabinet a more credible answer than simply promising that future growth will compensate everyone eventually."
 COLDWAR_SYR_civic_04_resume:0 "Carry Out: Worker Transition Guarantees"
 COLDWAR_SYR_civic_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_civic_05:0 "Civic Associations"
 COLDWAR_SYR_civic_05_desc:0 "Independent professional associations can bring the experience of engineers, teachers and other specialists into public debate. Their standards would support skilled careers beyond party appointment networks. The republic must invest in education and allow these bodies enough independence to criticize official decisions when professional judgement and political convenience diverge."
 COLDWAR_SYR_civic_05_resume:0 "Carry Out: Independent Professional Associations"
 COLDWAR_SYR_civic_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_civic_06:0 "Competitive Service"
 COLDWAR_SYR_civic_06_desc:0 "Competitive public recruitment can open administrative careers to capable applicants who lack established connections. Better personnel standards and financial records would strengthen the cabinet's claim to impartial government. Implementing those standards requires supervision, training and a willingness to refuse supporters who expected a change of government to deliver privileged access."
 COLDWAR_SYR_civic_06_resume:0 "Carry Out: A Competitive Civil Service"
 COLDWAR_SYR_civic_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_civic_07:0 "Open Civic Republic"
 COLDWAR_SYR_civic_07_desc:0 "An open constitutional republic should make political competition ordinary rather than a prelude to another rupture. Its durability depends on institutions that both winners and losers consider worth preserving. The civic cabinet must negotiate that shared commitment and accept that the same freedoms protecting its supporters will also protect determined opponents."
 COLDWAR_SYR_civic_07_resume:0 "Carry Out: An Open Constitutional Republic"
 COLDWAR_SYR_civic_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_ssnp:0 "§Y$COLDWAR_SYR_party_20$§! leads the government."
 COLDWAR_SYR_ssnp_entry:0 "Syrian Institutes"
 COLDWAR_SYR_ssnp_entry_desc:0 "The Syrian Social Nationalist Party proposes a national identity defined by a wider historical homeland rather than Arab unity alone. Governing requires turning that doctrine into public institutions. Its cadres must decide how an ambitious territorial vision can coexist with the practical responsibilities of administering the Syrian state they actually hold."
 COLDWAR_SYR_ssnp_entry_resume:0 "Carry Out: Syrian National Institutions"
 COLDWAR_SYR_ssnp_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_ssnp_01:0 "Association Diplomacy"
 COLDWAR_SYR_ssnp_01_desc:0 "Association through diplomacy would pursue the party's regional vision by consent and sustained contact. Agreements could build confidence without demanding immediate submission to a territorial claim. This path needs patient institutional work and accepts that neighbouring governments may cooperate economically while rejecting the SSNP's understanding of their political future."
 COLDWAR_SYR_ssnp_01_resume:0 "Carry Out: Association through Diplomacy"
 COLDWAR_SYR_ssnp_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_ssnp_02:0 "Irredentist Programme"
 COLDWAR_SYR_ssnp_02_desc:0 "An irredentist state programme would make territorial revision a central purpose of public life. Mobilizing supporters around that ambition can expand the resources devoted to national struggle. It also draws people and productive effort away from civilian industry, while making the government's legitimacy depend on objectives that neighbouring states will contest."
 COLDWAR_SYR_ssnp_02_resume:0 "Carry Out: An Irredentist State Programme"
 COLDWAR_SYR_ssnp_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_ssnp_03:0 "Regional Treaties"
 COLDWAR_SYR_ssnp_03_desc:0 "Regional economic treaties can give the national programme practical content through trade and investment. Partners may find shared commercial interests where political doctrine divides them. Negotiated access also creates financial commitments, and Damascus must respect the distinction between a voluntary economic relationship and an endorsement of the party's territorial interpretation."
 COLDWAR_SYR_ssnp_03_resume:0 "Carry Out: Regional Economic Treaties"
 COLDWAR_SYR_ssnp_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_ssnp_04:0 "Prepare Claims"
 COLDWAR_SYR_ssnp_04_desc:0 "Preparing territorial claims demands more than publishing a map of the desired homeland. Staff work and military preparation would make the government more capable of supporting its position. These preparations consume supplies and invite harder questions about priorities, especially when resources committed to distant ambitions are needed for Syria's immediate defence."
 COLDWAR_SYR_ssnp_04_resume:0 "Carry Out: Prepare Territorial Claims"
 COLDWAR_SYR_ssnp_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_ssnp_05:0 "Party Cadres"
 COLDWAR_SYR_ssnp_05_desc:0 "The SSNP's national doctrine claims a political community extending across religious divisions. Cross-community cadres must give that claim substance in everyday party organization. Their work can widen the range of voices reaching government, but requires tolerance for local experiences and disagreements that a single ideological account cannot fully contain."
 COLDWAR_SYR_ssnp_05_resume:0 "Carry Out: Cross-Community Party Cadres"
 COLDWAR_SYR_ssnp_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_ssnp_06:0 "A Secular Civil Code"
 COLDWAR_SYR_ssnp_06_desc:0 "A secular civil code would place public administration on a common legal footing rather than leaving every question to communal intermediaries. The reform could strengthen a shared civic order. It also requires trained officials and careful implementation, since confidence in common rules cannot be created merely by removing familiar institutions from the page."
 COLDWAR_SYR_ssnp_06_resume:0 "Carry Out: A Secular Civil Code"
 COLDWAR_SYR_ssnp_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_ssnp_07:0 "National Growth Boards"
 COLDWAR_SYR_ssnp_07_desc:0 "National development boards can connect the party's territorial vision to roads, services and productive investment inside Syria. Coordinated planning would give public works clearer priorities. The boards need administrative resources and scrutiny, or they risk becoming another set of offices whose patriotic claims conceal delays, overlapping responsibilities and politically convenient project selection."
 COLDWAR_SYR_ssnp_07_resume:0 "Carry Out: National Development Boards"
 COLDWAR_SYR_ssnp_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_ssnp_08:0 "Syrian Programme"
 COLDWAR_SYR_ssnp_08_desc:0 "A Syrian industrial programme would strengthen the productive base beneath the party's claims of national independence. Public coordination can help enterprises overcome shortages and fragmented direction. Success depends on capable administration, and the government must judge its plans by actual production rather than treating industrial targets as another expression of national will."
 COLDWAR_SYR_ssnp_08_resume:0 "Carry Out: A Syrian Industrial Programme"
 COLDWAR_SYR_ssnp_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_ssnp_09:0 "Cabinet Party Militias"
 COLDWAR_SYR_ssnp_09_desc:0 "The cabinet can insist that armed authority belongs to the state rather than competing party formations. Clearer command would strengthen professionalism and reduce uncertainty among officers. Integrating or restraining militant networks limits recruitment through partisan channels, and requires the leadership to confront supporters who consider their own armed organization a guarantee against exclusion."
 COLDWAR_SYR_ssnp_09_resume:0 "Carry Out: Cabinet over Party Militias"
 COLDWAR_SYR_ssnp_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_ssnp_10:0 "Militias State"
 COLDWAR_SYR_ssnp_10_desc:0 "Bringing party militias into the state can preserve a ready pool of committed supporters and make mobilization easier. Their integration will carry the habits and loyalties of partisan organization into public service. Regular commanders must then work with forces whose political relationships may remain stronger than their attachment to a common military system."
 COLDWAR_SYR_ssnp_10_resume:0 "Carry Out: Militias within the State"
 COLDWAR_SYR_ssnp_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_ssnp_11:0 "Territorial Compact"
 COLDWAR_SYR_ssnp_11_desc:0 "A territorial national compact must reconcile the SSNP's ambitions with the communities living under its government. The party needs an agreement about public obligations and political participation that extends beyond doctrinal loyalty. Maintaining it requires bargaining with citizens who may value a functioning Syrian state more urgently than any wider national destination."
 COLDWAR_SYR_ssnp_11_resume:0 "Carry Out: A Territorial National Compact"
 COLDWAR_SYR_ssnp_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_iraqi_baath:0 "Iraqi-Wing Ba’ath directs the governing programme."
 COLDWAR_SYR_iraqi_baath_entry:0 "Recall Command"
 COLDWAR_SYR_iraqi_baath_entry_desc:0 "Amin al-Hafiz and the exiled National Command return with their own claim to Ba'athist legitimacy after years of bitter division. Governing again requires more than reversing their rivals' appointments. They must rebuild institutions and define how far their relationship with Baghdad will shape the authority of the Syrian republic."
 COLDWAR_SYR_iraqi_baath_entry_resume:0 "Carry Out: Recall the Exiled National Command"
 COLDWAR_SYR_iraqi_baath_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_iraqi_baath_01:0 "Equal Arab Federation"
 COLDWAR_SYR_iraqi_baath_01_desc:0 "An equal Arab federation would promise reconciliation between divided Ba'athist governments without reducing Damascus to a subordinate office. Syrian negotiators need clear institutions and shared responsibilities. The process requires sustained coordination and a willingness to examine whether apparent ideological agreement conceals competing ambitions among the leaders expected to share power."
 COLDWAR_SYR_iraqi_baath_01_resume:0 "Carry Out: Equal Arab Federation"
 COLDWAR_SYR_iraqi_baath_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_iraqi_baath_02:0 "Baghdad's Patronage"
 COLDWAR_SYR_iraqi_baath_02_desc:0 "Baghdad's security patronage can reassure a restored leadership that fears another challenge from its domestic enemies. Reliable external backing may consolidate authority quickly. Dependence on protected networks also narrows open discussion, leaving officials and specialists uncertain whether unwelcome advice will be judged on its merits or interpreted through the demands of political security."
 COLDWAR_SYR_iraqi_baath_02_resume:0 "Carry Out: Baghdad’s Security Patronage"
 COLDWAR_SYR_iraqi_baath_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_iraqi_baath_03:0 "Negotiate Safeguards"
 COLDWAR_SYR_iraqi_baath_03_desc:0 "Federal safeguards should establish Syria's voice before common institutions acquire powers that are difficult to retrieve. Written responsibilities can reduce the risk of another unequal Arab arrangement. Enforcing them will require officials, procedures and patience, particularly when the leaders invoking party unity disagree over which capital should have the final word."
 COLDWAR_SYR_iraqi_baath_03_resume:0 "Carry Out: Negotiate Federal Safeguards"
 COLDWAR_SYR_iraqi_baath_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_iraqi_baath_04:0 "Security Networks"
 COLDWAR_SYR_iraqi_baath_04_desc:0 "Foreign-backed security networks can help the restored command connect its supporters and reinforce uncertain positions. Their usefulness comes with additional coordination and supply demands. A government relying on such channels must also confront the political reality that outside assistance gives another capital influence over the institutions meant to secure Syrian authority."
 COLDWAR_SYR_iraqi_baath_04_resume:0 "Carry Out: Foreign-Backed Security Networks"
 COLDWAR_SYR_iraqi_baath_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_iraqi_baath_05:0 "Reconcile Officer Exiles"
 COLDWAR_SYR_iraqi_baath_05_desc:0 "Returning officer exiles bring experience, grievances and expectations of restored rank. Reconciliation can strengthen the armed forces if their place is negotiated rather than imposed. The leadership must spend political authority settling old disputes and convincing serving officers that the return of former rivals will not become another wholesale reversal of fortunes."
 COLDWAR_SYR_iraqi_baath_05_resume:0 "Carry Out: Reconcile the Officer Exiles"
 COLDWAR_SYR_iraqi_baath_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_iraqi_baath_06:0 "Restore Charter"
 COLDWAR_SYR_iraqi_baath_06_desc:0 "The founders' charter offers a language of unity beyond the factions that fractured the Ba'ath. Restoring its place in political life can reopen debate about the movement's original purposes. That discussion must be allowed some independence if it is to reconcile the party, rather than simply provide a new approved vocabulary for old rivalries."
 COLDWAR_SYR_iraqi_baath_06_resume:0 "Carry Out: Restore the Founders’ Charter"
 COLDWAR_SYR_iraqi_baath_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_iraqi_baath_07:0 "Inter-Arab Commission"
 COLDWAR_SYR_iraqi_baath_07_desc:0 "An inter-Arab trade commission could turn political reconciliation into practical opportunities for Syrian enterprises. Negotiators would coordinate access, investment and commercial priorities across borders. New financial links create obligations as well as openings, so the government must distinguish agreements serving Syrian production from arrangements sustained chiefly for the appearance of fraternal unity."
 COLDWAR_SYR_iraqi_baath_07_resume:0 "Carry Out: An Inter-Arab Trade Commission"
 COLDWAR_SYR_iraqi_baath_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_iraqi_baath_08:0 "Reunify Party Institutes"
 COLDWAR_SYR_iraqi_baath_08_desc:0 "Reunifying party institutions means reconciling competing offices, membership claims and administrative habits left by the split. A coherent organization could coordinate public development more effectively. The work demands staff and oversight, and the returning leadership must avoid replacing every practical question with a contest over which faction possessed the authentic revolutionary title."
 COLDWAR_SYR_iraqi_baath_08_resume:0 "Carry Out: Reunify Party Institutions"
 COLDWAR_SYR_iraqi_baath_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_iraqi_baath_09:0 "Autonomous Command"
 COLDWAR_SYR_iraqi_baath_09_desc:0 "An independent Syrian command can preserve political cooperation with Baghdad while retaining final responsibility in Damascus. This reassures supporters wary of exchanging one faction's supremacy for another capital's influence. Greater discretion also means carrying more of the cost of securing investment and support without assuming that party kinship guarantees favourable terms."
 COLDWAR_SYR_iraqi_baath_09_resume:0 "Carry Out: An Independent Syrian Command"
 COLDWAR_SYR_iraqi_baath_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_iraqi_baath_10:0 "A Joint Ba'ath Command"
 COLDWAR_SYR_iraqi_baath_10_desc:0 "A joint Ba'ath command would bind the restored Syrian leadership more closely to its regional allies. Combined organization can widen the networks available for mobilization. It also complicates military authority, since officers must reconcile the requirements of their own state with instructions and loyalties extending through a shared party apparatus."
 COLDWAR_SYR_iraqi_baath_10_resume:0 "Carry Out: A Joint Ba’ath Command"
 COLDWAR_SYR_iraqi_baath_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_iraqi_baath_11:0 "Reconstituted State"
 COLDWAR_SYR_iraqi_baath_11_desc:0 "A reconstituted Ba'ath state must offer something more durable than the defeat of a rival faction. Its supporters need a common settlement on public authority, social obligations and Syria's regional relationships. Holding that settlement together requires negotiation with people whose confidence cannot be restored simply by recalling the movement's original leadership."
 COLDWAR_SYR_iraqi_baath_11_resume:0 "Carry Out: A Reconstituted Ba’ath State"
 COLDWAR_SYR_iraqi_baath_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_brotherhood:0 "§Y$COLDWAR_SYR_party_12$§! leads the government."
 COLDWAR_SYR_brotherhood_entry:0 "Religious Party Voice"
 COLDWAR_SYR_brotherhood_entry_desc:0 "The Muslim Brotherhood seeks a political voice for religious constituencies excluded or constrained by the secular ruling order. Governing would make the relationship between faith, citizenship and public authority unavoidable. Its leaders must decide whether religious organization will support a shared civilian republic or establish a narrower basis for political belonging."
 COLDWAR_SYR_brotherhood_entry_resume:0 "Carry Out: Religious Political Representation"
 COLDWAR_SYR_brotherhood_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_brotherhood_01:0 "Plural Covenant"
 COLDWAR_SYR_brotherhood_01_desc:0 "A plural national covenant would place the Brotherhood within an agreement that protects political participation across religious and ideological lines. Such a settlement can reassure communities suspicious of its intentions. It also obliges the movement to accept lawful disagreement, including opposition to policies that its own supporters regard as religiously necessary."
 COLDWAR_SYR_brotherhood_01_resume:0 "Carry Out: A Plural National Covenant"
 COLDWAR_SYR_brotherhood_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_brotherhood_02:0 "Constitution"
 COLDWAR_SYR_brotherhood_02_desc:0 "A confessional constitution would give religious principles a more explicit place in the structure of government. Supporters see a firmer moral foundation for public authority. Defining that role requires additional institutions and careful administration, while raising difficult questions about representation for citizens whose beliefs do not match the governing movement's interpretation."
 COLDWAR_SYR_brotherhood_02_resume:0 "Carry Out: A Confessional Constitution"
 COLDWAR_SYR_brotherhood_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_brotherhood_03:0 "Guarantees Citizenship"
 COLDWAR_SYR_brotherhood_03_desc:0 "Equal citizenship must be expressed in enforceable guarantees if the Brotherhood expects confidence beyond its own constituencies. Officials should administer public obligations without treating religious difference as grounds for exclusion. Building that trust needs records, appeals and consistent oversight, particularly where local expectations conflict with the covenant announced by national leaders."
 COLDWAR_SYR_brotherhood_03_resume:0 "Carry Out: Guarantees for Equal Citizenship"
 COLDWAR_SYR_brotherhood_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_brotherhood_04:0 "Religious Legislation"
 COLDWAR_SYR_brotherhood_04_desc:0 "Religious review of legislation would create a regular forum for examining the compatibility of public law with the government's confessional commitments. Its authority must be defined carefully. Maintaining another layer of scrutiny requires trained personnel and clear procedures, or legal certainty may give way to competing claims about who can speak conclusively for religion."
 COLDWAR_SYR_brotherhood_04_resume:0 "Carry Out: Religious Review of Legislation"
 COLDWAR_SYR_brotherhood_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_brotherhood_05:0 "Civilian Institutes"
 COLDWAR_SYR_brotherhood_05_desc:0 "Civilian Islamic institutions can channel religious commitment into education, welfare and public association rather than permanent confrontation. Their value depends on dependable service to ordinary households. Sustaining those activities brings continuing social obligations, and the government must ensure that belonging to the movement does not become the condition for receiving assistance."
 COLDWAR_SYR_brotherhood_05_resume:0 "Carry Out: Civilian Islamic Institutions"
 COLDWAR_SYR_brotherhood_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_brotherhood_06:0 "Charitable Networks"
 COLDWAR_SYR_brotherhood_06_desc:0 "Charitable health networks can reach families who distrust or rarely encounter the central administration. Bringing their work into a dependable national effort would connect religious solidarity with practical care. Clinics still need trained staff, medicines and continuing support; voluntary commitment cannot by itself carry the full burden of public health."
 COLDWAR_SYR_brotherhood_06_resume:0 "Carry Out: Charitable Health Networks"
 COLDWAR_SYR_brotherhood_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_brotherhood_07:0 "Religious Schools"
 COLDWAR_SYR_brotherhood_07_desc:0 "Religious and technical schooling can connect the movement's cultural commitments with the skills required by a modern economy. Students should gain useful knowledge alongside moral instruction. Delivering both requires qualified teachers and sustained educational investment, while allowing technical expertise enough independence to remain valuable outside the boundaries of party doctrine."
 COLDWAR_SYR_brotherhood_07_resume:0 "Carry Out: Religious and Technical Schools"
 COLDWAR_SYR_brotherhood_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_brotherhood_08:0 "Islamic Programme"
 COLDWAR_SYR_brotherhood_08_desc:0 "An Islamic social programme should address wages, household security and the obligations of employers rather than rely only on statements of moral purpose. Its promises can give workers a practical stake in the new government. They also require sustained social provision and a willingness to confront supporters whose economic interests conflict with those obligations."
 COLDWAR_SYR_brotherhood_08_resume:0 "Carry Out: An Islamic Social Programme"
 COLDWAR_SYR_brotherhood_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_brotherhood_09:0 "Civilian Activists"
 COLDWAR_SYR_brotherhood_09_desc:0 "Civilian supervision can distinguish lawful party activism from private coercion carried out in the movement's name. Leaders must establish clear responsibilities and investigate breaches rather than excuse them as zeal. This work requires administrative effort, but a religious cabinet cannot credibly promise public order while leaving its own activists beyond effective scrutiny."
 COLDWAR_SYR_brotherhood_09_resume:0 "Carry Out: Civilian Supervision of Activists"
 COLDWAR_SYR_brotherhood_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_brotherhood_10:0 "Mobilize Networks"
 COLDWAR_SYR_brotherhood_10_desc:0 "Party defence networks would mobilize committed supporters who fear exclusion or renewed repression. Their readiness can widen the movement's available manpower. Carrying armed partisan loyalties into the state also weakens a common military discipline, and commanders may find that appeals from movement leaders matter more than orders issued through regular institutions."
 COLDWAR_SYR_brotherhood_10_resume:0 "Carry Out: Mobilize Party Defence Networks"
 COLDWAR_SYR_brotherhood_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_brotherhood_11:0 "New Civic Settlement"
 COLDWAR_SYR_brotherhood_11_desc:0 "A new constitutional settlement must define how religious political authority coexists with the rights and expectations of Syria's varied society. Agreement cannot rest on the movement's supporters alone. The Brotherhood must negotiate a public order that others can accept and maintain that bargain when political competition challenges its preferred interpretation of government."
 COLDWAR_SYR_brotherhood_11_resume:0 "Carry Out: A New Constitutional Settlement"
 COLDWAR_SYR_brotherhood_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_attar:0 "Issam al-Attar directs the governing programme."
 COLDWAR_SYR_attar_entry:0 "Return from Exile"
 COLDWAR_SYR_attar_entry_desc:0 "Issam al-Attar's return from exile would bring an established religious political voice back into Syria's contested public life. His authority cannot substitute for a broader agreement on participation. Re-entry must reassure supporters and wary communities alike that civilian religious politics can operate through negotiated institutions rather than another struggle for exclusive control."
 COLDWAR_SYR_attar_entry_resume:0 "Carry Out: Return from Exile"
 COLDWAR_SYR_attar_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_attar_01:0 "Civilian Guarantees"
 COLDWAR_SYR_attar_01_desc:0 "Parliamentary guarantees can make religious political participation compatible with changes of government. Al-Attar can seek protection for his movement while recognizing the same standing for its opponents. Such an agreement requires accepting that representative debate may delay or defeat proposals strongly favoured by religious activists who helped bring him back."
 COLDWAR_SYR_attar_01_resume:0 "Carry Out: Parliamentary Guarantees"
 COLDWAR_SYR_attar_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_attar_02:0 "Confessional Agenda"
 COLDWAR_SYR_attar_02_desc:0 "Al-Attar can press for a constitution that places religious principles more explicitly within public authority. The project gives his supporters a clear governing purpose. Its success depends on institutions able to apply that purpose consistently, while addressing the concerns of communities who fear that confessional government will reduce their place in the republic."
 COLDWAR_SYR_attar_02_resume:0 "Carry Out: Confessional Constitutional Agenda"
 COLDWAR_SYR_attar_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_attar_03:0 "Equal Covenant"
 COLDWAR_SYR_attar_03_desc:0 "An equal citizenship covenant would make al-Attar's civilian approach credible beyond the circles already prepared to trust him. Public offices must apply its guarantees in ordinary disputes as well as prominent cases. That requires sustained administration and a willingness to challenge supporters when local religious loyalties conflict with the rights the government has promised."
 COLDWAR_SYR_attar_03_resume:0 "Carry Out: Equal Citizenship Covenant"
 COLDWAR_SYR_attar_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_attar_04:0 "Religious Civic Council"
 COLDWAR_SYR_attar_04_desc:0 "A religious constitutional council could give legal and religious scholars a defined role in examining legislation. Clear responsibilities would be more predictable than informal pressure on ministers. Maintaining that body requires administrative support and agreed procedures, particularly where competing interpretations risk leaving citizens uncertain which authority will finally determine the law."
 COLDWAR_SYR_attar_04_resume:0 "Carry Out: Religious Constitutional Council"
 COLDWAR_SYR_attar_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_attar_05:0 "Religious Networks"
 COLDWAR_SYR_attar_05_desc:0 "Religious civic networks can connect neighbourhood associations, charitable work and public participation without making armed activism their centre. Al-Attar can build a civilian constituency through useful service. Those networks need dependable support, and their credibility will suffer if assistance is seen as a privilege reserved for the movement's own political followers."
 COLDWAR_SYR_attar_05_resume:0 "Carry Out: Religious Civic Networks"
 COLDWAR_SYR_attar_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_attar_06:0 "Gradual Party Re-entry"
 COLDWAR_SYR_attar_06_desc:0 "Gradual political re-entry gives former exiles and established institutions time to learn how to work together. Public discussion and civic organization can rebuild trust that a sudden declaration cannot create. The process requires patience with competing views, including religious activists who believe that compromise merely prolongs an exclusion they have already endured too long."
 COLDWAR_SYR_attar_06_resume:0 "Carry Out: Gradual Political Re-entry"
 COLDWAR_SYR_attar_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_attar_07:0 "Civilian Mandate"
 COLDWAR_SYR_attar_07_desc:0 "A civilian religious mandate should be judged by the conditions it improves for ordinary families. Extending dependable care would give practical meaning to al-Attar's claim that faith can support public service. The government must finance the institutions behind that promise, since personal standing and charitable enthusiasm cannot maintain a national health commitment alone."
 COLDWAR_SYR_attar_07_resume:0 "Carry Out: A Civilian Religious Mandate"
 COLDWAR_SYR_attar_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_saadeddin:0 "Adnan Saadeddin directs the governing programme."
 COLDWAR_SYR_saadeddin_leadership_established_eligibility_tt:0 "Adnan Saadeddin's leadership organization has been established."
 COLDWAR_SYR_saadeddin_entry:0 "Unify Councils"
 COLDWAR_SYR_saadeddin_entry_desc:0 "Adnan Saadeddin's leadership must reconcile Brotherhood councils with different local experiences and expectations. A unified organization can speak more coherently in government and negotiate with greater confidence. Achieving that unity requires administrative work, and national leaders must avoid mistaking an orderly structure for genuine agreement among the movement's urban constituencies."
 COLDWAR_SYR_saadeddin_entry_resume:0 "Carry Out: Unify Brotherhood Councils"
 COLDWAR_SYR_saadeddin_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_saadeddin_01:0 "Negotiated Pact"
 COLDWAR_SYR_saadeddin_01_desc:0 "A negotiated national pact would bring Saadeddin's movement into a shared political settlement rather than leave its future dependent on confrontation. Guarantees can reassure both supporters and suspicious opponents. The pact must survive ordinary disputes, requiring the leadership to accept limits on its own action as well as demand protection against renewed exclusion."
 COLDWAR_SYR_saadeddin_01_resume:0 "Carry Out: A Negotiated National Pact"
 COLDWAR_SYR_saadeddin_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_saadeddin_02:0 "Confront Security State"
 COLDWAR_SYR_saadeddin_02_desc:0 "Confronting the security state directly would mobilize those who regard compromise as an invitation to further repression. A sharper struggle can draw committed supporters into organized service. It also diverts manpower and productive effort from civilian life, while making the movement's authority increasingly dependent on sustaining a posture of permanent confrontation."
 COLDWAR_SYR_saadeddin_02_resume:0 "Carry Out: Confront the Security State"
 COLDWAR_SYR_saadeddin_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_saadeddin_03:0 "Guarantee Competition"
 COLDWAR_SYR_saadeddin_03_desc:0 "Civilian competition needs guarantees that protect parties before they know whether they will win the next contest. Saadeddin can commit the Brotherhood to that common order. Doing so requires defending the participation of opponents and restraining supporters who believe electoral strength should entitle the movement to shape every institution without negotiation."
 COLDWAR_SYR_saadeddin_03_resume:0 "Carry Out: Guarantee Civilian Competition"
 COLDWAR_SYR_saadeddin_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_saadeddin_04:0 "Protect Urban Networks"
 COLDWAR_SYR_saadeddin_04_desc:0 "Urban networks have sustained the Brotherhood through pressure and political uncertainty. Protecting them can reassure supporters who fear being exposed again. A government built around guarded circles of trust, however, risks treating independent inquiry as a threat and excluding valuable criticism from citizens who do not belong to those familiar networks."
 COLDWAR_SYR_saadeddin_04_resume:0 "Carry Out: Protect the Urban Networks"
 COLDWAR_SYR_saadeddin_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_saadeddin_05:0 "Northern Associations"
 COLDWAR_SYR_saadeddin_05_desc:0 "Associations in the northern cities can link the movement's local roots to practical welfare and civilian participation. Saadeddin can strengthen those relationships through support that households recognize in daily life. Sustaining their work creates continuing social obligations and requires care that regional loyalties do not eclipse the government's responsibilities to the rest of Syria."
 COLDWAR_SYR_saadeddin_05_resume:0 "Carry Out: Northern Urban Associations"
 COLDWAR_SYR_saadeddin_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_saadeddin_06:0 "Separate Armed Cells"
 COLDWAR_SYR_saadeddin_06_desc:0 "Civilian members must not be treated as indistinguishable from armed cells, and armed activists must not claim immunity through the party's civilian standing. Establishing that boundary requires records, supervision and credible discipline. Saadeddin's leadership must be prepared to enforce it even when the people involved remain influential within the movement's own networks."
 COLDWAR_SYR_saadeddin_06_resume:0 "Carry Out: Separate Civilians from Armed Cells"
 COLDWAR_SYR_saadeddin_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_saadeddin_07:0 "National Coalition"
 COLDWAR_SYR_saadeddin_07_desc:0 "A national Islamic coalition would need voices beyond the Brotherhood's strongest local organizations. Scholars, civic figures and other partners can broaden debate about religious government. Maintaining that breadth requires accepting disagreement within the coalition, rather than expecting every participant to endorse the strategy and organizational habits of the movement that assembled it."
 COLDWAR_SYR_saadeddin_07_resume:0 "Carry Out: A National Islamic Coalition"
 COLDWAR_SYR_saadeddin_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_outlooks_western:0 "Civic Organizing"
 COLDWAR_SYR_outlooks_western_desc:0 "Lawyers, merchants and former parliamentary families still remember the republic that preceded military rule. Giving constitutional politics an organized voice can bring these networks into public life, but their return will depend on persuasion, legal protections and a credible settlement with the armed forces. Organized constitutional debate links professional associations and universities, supporting the exchange of technical ideas while requiring public educational support. Campaigning still selects a legal party through the existing decision."
 COLDWAR_SYR_outlooks_western_resume:0 "Carry Out: Constitutional Organizing"
 COLDWAR_SYR_outlooks_western_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_outlooks_western_coalition:0 "Civic Coalitions"
 COLDWAR_SYR_outlooks_western_coalition_desc:0 "Constitutional government needs more than agreement among Damascus notables. Conservatives and civic reformers must negotiate a common platform, settle their differences over social policy and convince potential partners that parliamentary bargaining can survive the first serious national crisis. A trained parliamentary liaison staff makes constitutional bargaining more efficient but expands the cabinet's administrative establishment. No coalition member is granted before actual negotiations."
 COLDWAR_SYR_outlooks_western_coalition_resume:0 "Carry Out: Constitutional Coalitions"
 COLDWAR_SYR_outlooks_western_coalition_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_outlooks_emerging:0 "Socialist Organizing"
 COLDWAR_SYR_outlooks_emerging_desc:0 "Socialism commands the language of government, yet Syrian socialists disagree bitterly over who should wield power. Party organizers, independent Marxists and trade unionists can build support for their own programmes without pretending that a shared outlook has erased those rivalries. Workers' organizing networks improve the circulation of workshop information while requiring union and planning clerks. The modest institutional gain does not place a socialist party in office."
 COLDWAR_SYR_outlooks_emerging_resume:0 "Carry Out: Socialist Organizing"
 COLDWAR_SYR_outlooks_emerging_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_outlooks_emerging_coalition:0 "Socialist Coalitions"
 COLDWAR_SYR_outlooks_emerging_coalition_desc:0 "A broad socialist front could bring communists and other leftists into an enduring governing arrangement. Its partners will expect influence over policy and room to organize; a coalition assembled only to applaud the dominant party will have little reason to hold together. Cooperative bargaining develops practical distribution networks useful to the state, but negotiated worker and household support increases welfare commitments. Coalition membership still requires the party's acceptance."
 COLDWAR_SYR_outlooks_emerging_coalition_resume:0 "Carry Out: Socialist Coalitions"
 COLDWAR_SYR_outlooks_emerging_coalition_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_outlooks_nonaligned:0 "Autonomous Organizing"
 COLDWAR_SYR_outlooks_nonaligned_desc:0 "Arab unity and national independence retain a powerful appeal beyond the Ba'ath organization. Building autonomous political networks gives Nasserists and other Arab currents a route to support of their own, while exposing disagreements that slogans about unity have long concealed. Provincial and community organizing brings cultivators' practical knowledge into local administration. Maintaining those rural liaison networks requires salaried staff; the focus neither legalizes a banned party nor selects a government."
 COLDWAR_SYR_outlooks_nonaligned_resume:0 "Carry Out: Independent Arab Organizing"
 COLDWAR_SYR_outlooks_nonaligned_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_outlooks_nonaligned_coalition:0 "Autonomous Coalitions"
 COLDWAR_SYR_outlooks_nonaligned_coalition_desc:0 "Independent Arab movements share an impatience with foreign tutelage, but differ over religion, economic planning and relations with Cairo. Coalition talks must turn that common instinct into negotiated commitments which the participating parties are prepared to defend before their supporters. Community mediators improve the handling of local grievances while expecting a continuing social-service commitment. This administrative capacity can support a bargain but does not substitute for an accepted coalition."
 COLDWAR_SYR_outlooks_nonaligned_coalition_resume:0 "Carry Out: Independent Arab Coalitions"
 COLDWAR_SYR_outlooks_nonaligned_coalition_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_outlooks_nationalist:0 "Nationalist Organizing"
 COLDWAR_SYR_outlooks_nationalist_desc:0 "The army, rival Ba'athists and the Syrian Social Nationalists offer sharply different answers to Syria's weakness. Allowing these currents to organize creates political openings, while requiring the state to confront their competing claims to national authority rather than treating nationalism as a single programme. Nationalist civic networks can contribute to civil-defence liaison and local preparedness, with a small standing coordination cost. They receive no troops, government office or mandate for war."
 COLDWAR_SYR_outlooks_nationalist_resume:0 "Carry Out: Nationalist Organizing"
 COLDWAR_SYR_outlooks_nationalist_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_outlooks_nationalist_coalition:0 "Nationalist Coalitions"
 COLDWAR_SYR_outlooks_nationalist_coalition_desc:0 "A nationalist coalition must reconcile officers concerned with command, party cadres demanding restoration and activists with a different vision of the nation itself. Negotiations can produce a government, but only if its members accept limits on their own ambitions as well as those of their rivals. A civilian-military liaison service clarifies the handling of cabinet defence business but requires administrative staffing. It improves a procedure rather than granting a nationalist coalition automatically."
 COLDWAR_SYR_outlooks_nationalist_coalition_resume:0 "Carry Out: Nationalist Coalitions"
 COLDWAR_SYR_outlooks_nationalist_coalition_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_entry:0 "Survey Industrial Base"
 COLDWAR_SYR_industry_entry_desc:0 "Nationalization has placed factories under public authority without resolving shortages of machinery, trained managers or dependable suppliers. Before promising another industrial leap, Damascus must establish which workshops can expand, which enterprises need repair and how much the treasury can realistically sustain. An inventory of sites and equipment reduces construction mistakes; surveyors and procurement staff require salaries."
 COLDWAR_SYR_industry_entry_resume:0 "Carry Out: Survey the Industrial Base"
 COLDWAR_SYR_industry_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_01:0 "State Rehabilitation"
 COLDWAR_SYR_industry_01_desc:0 "Public factories carry the promises of the socialist transformation, alongside worn equipment and confused chains of responsibility. Rehabilitating them can raise production without abandoning state ownership, provided ministries fund competent administration and stop treating every operational problem as a matter of political loyalty."
 COLDWAR_SYR_industry_01_resume:0 "Carry Out: State Enterprise Rehabilitation"
 COLDWAR_SYR_industry_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_02:0 "Regulated Workshops"
 COLDWAR_SYR_industry_02_desc:0 "Aleppo and Damascus retain workshop traditions that cannot be replaced by ministerial decree. Giving regulated private manufacturers room to invest can accelerate industrial construction, although tax concessions and greater contact with foreign markets leave the government with less immediate revenue and greater exposure to external conditions."
 COLDWAR_SYR_industry_02_resume:0 "Carry Out: Regulated Private Workshops"
 COLDWAR_SYR_industry_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_03:0 "Public Enterprise Audits"
 COLDWAR_SYR_industry_03_desc:0 "An enterprise can report that it has met its plan while wasting imported inputs and concealing losses. Independent scrutiny of accounts and procurement will help recover revenue, but auditors need salaries, access and protection from the officials whose comfortable arrangements they are investigating."
 COLDWAR_SYR_industry_03_resume:0 "Carry Out: Public Enterprise Audits"
 COLDWAR_SYR_industry_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_04:0 "Small Credit"
 COLDWAR_SYR_industry_04_desc:0 "Small manufacturers often possess customers and skilled workers but cannot finance new machinery. A credit programme can lower the barriers to investment, while committing public institutions to loans whose repayment will depend on demand, honest bookkeeping and the survival of businesses with little financial cushion."
 COLDWAR_SYR_industry_04_resume:0 "Carry Out: Small Manufacturer Credit"
 COLDWAR_SYR_industry_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_05:0 "Syrian Production Plan"
 COLDWAR_SYR_industry_05_desc:0 "Industrial expansion requires power, transport and suppliers to arrive together. A coordinated production plan can align these investments and reduce construction delays, though every new planning office adds staff and another opportunity for ministries to substitute paperwork for practical cooperation."
 COLDWAR_SYR_industry_05_resume:0 "Carry Out: A Syrian Production Plan"
 COLDWAR_SYR_industry_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_06:0 "Aleppo Textiles"
 COLDWAR_SYR_industry_06_desc:0 "Aleppo's textile producers connect cotton-growing districts with urban employment and export markets. Better equipment, quality control and reliable supplies can strengthen that chain, but maintaining public support for the sector also means paying administrators to resolve disputes over inputs, prices and delivery schedules."
 COLDWAR_SYR_industry_06_resume:0 "Carry Out: Aleppo Textiles"
 COLDWAR_SYR_industry_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_07:0 "Homs Engineering"
 COLDWAR_SYR_industry_07_desc:0 "Homs occupies a useful position between the capital, the coast and northern Syria. Developing engineering and maintenance skills there can reduce waste in transport and supply, provided the state supports the workshops, inspectors and purchasing arrangements needed to keep equipment working."
 COLDWAR_SYR_industry_07_resume:0 "Carry Out: Homs Engineering"
 COLDWAR_SYR_industry_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_08:0 "Pharmaceuticals"
 COLDWAR_SYR_industry_08_desc:0 "Imported medicines leave hospitals vulnerable to foreign exchange shortages and interrupted deliveries. Pharmaceutical production around Damascus can give public health a more dependable foundation, but safe manufacture requires laboratories, trained personnel and continuing expenditure well beyond the first production run."
 COLDWAR_SYR_industry_08_resume:0 "Carry Out: Damascus Pharmaceuticals"
 COLDWAR_SYR_industry_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_09:0 "Aleppo Industrial Estate"
 COLDWAR_SYR_industry_09_desc:0 "An industrial estate near Aleppo can gather manufacturers around serviced land and shared connections, turning expansion plans into productive capacity. The treasury must finance the construction, while ministries remain responsible for ensuring that its buildings have suppliers, customers and workers rather than merely impressive opening ceremonies."
 COLDWAR_SYR_industry_09_resume:0 "Carry Out: Aleppo Industrial Estate"
 COLDWAR_SYR_industry_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_10:0 "Homs Repair Works"
 COLDWAR_SYR_industry_10_desc:0 "Vehicles and military equipment accumulate around Homs faster than existing workshops can return them to service. A dedicated repair complex will expand armaments production and maintenance capacity, at the cost of construction funding and the social obligations that accompany a larger industrial workforce."
 COLDWAR_SYR_industry_10_resume:0 "Carry Out: Homs Repair Works"
 COLDWAR_SYR_industry_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_11:0 "Domestic Output"
 COLDWAR_SYR_industry_11_desc:0 "Domestic medicine production needs more than a favourable decree. A new industrial facility in the capital will give pharmaceutical manufacturing a permanent base, while the government accepts the expense of construction, inspection and public administration necessary to make the investment useful."
 COLDWAR_SYR_industry_11_resume:0 "Carry Out: Domestic Medicine Production"
 COLDWAR_SYR_industry_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_production_speed_infrastructure_factor_tt:0 "$modifier_production_speed_infrastructure_factor$: $RIGHT|+=%1$"
 COLDWAR_SYR_industry_12_reform_tt:0 "Removes 4 percentage points of the 8% bureaucracy spending penalty in State-Sector Strain. Revenue reform removes the other four independently."
 COLDWAR_SYR_industry_12:0 "Connect Networks"
 COLDWAR_SYR_industry_12_desc:0 "Factories cannot flourish as isolated ministerial possessions. Connecting suppliers, transport services and maintenance contracts will make industrial infrastructure easier to develop and reduce the friction of the state sector, although coordinating these networks requires administrators able to work across institutional boundaries."
 COLDWAR_SYR_industry_12_resume:0 "Carry Out: Connect the Supplier Networks"
 COLDWAR_SYR_industry_12_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_13:0 "Protect Manufacturers"
 COLDWAR_SYR_industry_13_desc:0 "Young Syrian manufacturers may fail before they acquire the scale to compete with established foreign suppliers. Protection can secure political backing for domestic industry, but restrictions that shelter local producers also make outside investment harder to attract and reward firms that learn to lobby instead of improve."
 COLDWAR_SYR_industry_13_resume:0 "Carry Out: Protect New Manufacturers"
 COLDWAR_SYR_industry_13_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_14:0 "Compete Markets"
 COLDWAR_SYR_industry_14_desc:0 "Export competition offers Syrian industry a larger market than domestic demand alone can provide. Opening that route requires concessions to producers and investors, reducing immediate tax returns while making future expansion more sensitive to foreign demand, commercial pressure and disturbances beyond Syria's control."
 COLDWAR_SYR_industry_14_resume:0 "Carry Out: Compete in Export Markets"
 COLDWAR_SYR_industry_14_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_industry_15:0 "Diversified Base"
 COLDWAR_SYR_industry_15_desc:0 "A stronger industrial economy will combine textiles, engineering, consumer goods and maintenance instead of relying on a few favoured enterprises. Such diversification can lift production, but the government must sustain workers and communities through the uneven expansion of sectors with very different prospects."
 COLDWAR_SYR_industry_15_resume:0 "Carry Out: A Diversified Industrial Base"
 COLDWAR_SYR_industry_15_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_entry:0 "Audit Land and Water"
 COLDWAR_SYR_agriculture_entry_desc:0 "Land reform has altered rural ownership, while rainfall and uncertain water supplies still govern much of the harvest. A serious agricultural programme must establish who cultivates each district, how irrigation will be maintained and which promises the state can honour when the rains fail. A land-and-water inventory lets extension officers address avoidable cultivation losses, while district surveys and records require continuing staff. Rainfall vulnerability and the larger irrigation reforms remain unresolved."
 COLDWAR_SYR_agriculture_entry_resume:0 "Carry Out: Audit Land and Water"
 COLDWAR_SYR_agriculture_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_01:0 "Cooperative Services"
 COLDWAR_SYR_agriculture_01_desc:0 "Cooperatives can give small farmers access to advice, inputs and shared equipment beyond their individual means. These services will improve agricultural output only if the offices supporting them answer practical needs in the villages, rather than becoming another administrative burden imposed from Damascus."
 COLDWAR_SYR_agriculture_01_resume:0 "Carry Out: Cooperative Farm Services"
 COLDWAR_SYR_agriculture_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_02:0 "Secure Tenure"
 COLDWAR_SYR_agriculture_02_desc:0 "A farmer uncertain of next year's rights has little reason to improve the soil today. Clarifying smallholder tenure can encourage productive investment, while the state assumes the cost of supporting households whose claims and livelihoods cannot be settled by a simple redistribution decree."
 COLDWAR_SYR_agriculture_02_resume:0 "Carry Out: Secure Smallholder Tenure"
 COLDWAR_SYR_agriculture_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_03:0 "Shared Machinery Pools"
 COLDWAR_SYR_agriculture_03_desc:0 "Tractors and repair facilities are scarce, expensive and unevenly distributed. Shared machinery pools can make existing equipment serve more farms and reduce logistical waste, but their success depends on funded maintenance, honest scheduling and administrators who can resist pressure from influential landholders."
 COLDWAR_SYR_agriculture_03_resume:0 "Carry Out: Shared Machinery Pools"
 COLDWAR_SYR_agriculture_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_04:0 "Rural Cooperatives"
 COLDWAR_SYR_agriculture_04_desc:0 "Seasonal borrowing can decide whether a village plants a good crop or falls deeper into dependence. Rural credit cooperatives offer an organized alternative, although easier access to investment brings financing obligations that must be met even when weather or prices turn against the harvest."
 COLDWAR_SYR_agriculture_04_resume:0 "Carry Out: Rural Credit Cooperatives"
 COLDWAR_SYR_agriculture_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_05_reform_tt:0 "Removes the agricultural productivity −5% component of State-Sector Strain. Administrative spending penalties require their own reforms."
 COLDWAR_SYR_agriculture_05:0 "Productive Settlement"
 COLDWAR_SYR_agriculture_05_desc:0 "Land reform will remain incomplete while farmers lack secure rights, workable services and dependable access to inputs. Consolidating these arrangements can relieve the strain on rural production, but a durable settlement also obliges the state to support the people asked to build it."
 COLDWAR_SYR_agriculture_05_resume:0 "Carry Out: A Productive Agrarian Settlement"
 COLDWAR_SYR_agriculture_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_06:0 "Tabqa Civil Works"
 COLDWAR_SYR_agriculture_06_desc:0 "The Euphrates works at Tabqa promise a profound change to the valley, but pouring concrete is only one part of the undertaking. Construction must be coordinated with roads, administration and the movement of affected communities, creating obligations that will outlast the building crews."
 COLDWAR_SYR_agriculture_06_resume:0 "Carry Out: Tabqa Civil Works"
 COLDWAR_SYR_agriculture_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_07:0 "Extension Seed Services"
 COLDWAR_SYR_agriculture_07_desc:0 "Improved seed achieves little when farmers receive no guidance about soil, water or planting conditions. Agricultural extension and technical education can spread useful knowledge beyond the cities, provided the government keeps paying for instructors and field staff after the first demonstration harvest."
 COLDWAR_SYR_agriculture_07_resume:0 "Carry Out: Extension and Seed Services"
 COLDWAR_SYR_agriculture_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_08:0 "Drainage Expansion"
 COLDWAR_SYR_agriculture_08_desc:0 "Water brought to new fields must also have somewhere to drain. Investing in drainage before expanding irrigation can prevent costly damage and make later infrastructure easier to build, though the less visible works require patient administration and compete with politically attractive construction projects."
 COLDWAR_SYR_agriculture_08_resume:0 "Carry Out: Drainage before Expansion"
 COLDWAR_SYR_agriculture_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_reservoir_resettlement_completed_eligibility_tt:0 "Reservoir communities have received the agreed resettlement support."
 COLDWAR_SYR_agriculture_09:0 "Euphrates Power"
 COLDWAR_SYR_agriculture_09_desc:0 "The Euphrates project should begin supplying electricity as well as reshaping the river valley. Commissioning generation at Tabqa requires a funded installation and reliable management; electricity alone will not resettle displaced families, irrigate their new fields or solve the separate problem of drainage."
 COLDWAR_SYR_agriculture_09_resume:0 "Carry Out: Commission Euphrates Generation"
 COLDWAR_SYR_agriculture_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_10:0 "Irrigation Trials"
 COLDWAR_SYR_agriculture_10_desc:0 "Ambitious irrigation targets can conceal poor drainage, uneven distribution and crops unsuitable for the available water. Trial districts will test the programme before it spreads, accepting slower expansion and the cost of field supervision in exchange for fewer expensive mistakes across the Euphrates basin."
 COLDWAR_SYR_agriculture_10_resume:0 "Carry Out: Irrigation Trial Districts"
 COLDWAR_SYR_agriculture_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_11:0 "Protect the Soil"
 COLDWAR_SYR_agriculture_11_desc:0 "Salinity can quietly ruin the fields that irrigation was intended to enrich. Protecting soil requires drainage, monitoring and assistance to cultivators changing their practices; a productive rural economy must pay these costs before the damage becomes another emergency for Damascus to explain away."
 COLDWAR_SYR_agriculture_11_resume:0 "Carry Out: Protect Soils from Salinity"
 COLDWAR_SYR_agriculture_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_12_reform_tt:0 "After three completed irrigation and drainage trials, reduces Rainfall-Sensitive Agriculture from agricultural productivity −8% to −4%."
 COLDWAR_SYR_irrigation_trials_completed_eligibility_tt:0 "Three funded irrigation and drainage trials have been completed."
 COLDWAR_SYR_agriculture_12:0 "Water to Working Fields"
 COLDWAR_SYR_agriculture_12_desc:0 "Successful trials must now become dependable water delivery to ordinary cultivators. Extending the proven arrangements can reduce Syria's vulnerability to poor rainfall, but canals, distribution schedules and local disputes will require continuing oversight long after the first fields receive water."
 COLDWAR_SYR_agriculture_12_resume:0 "Carry Out: Water to Working Fields"
 COLDWAR_SYR_agriculture_12_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_13:0 "Prioritize Exports"
 COLDWAR_SYR_agriculture_13_desc:0 "Cotton can earn foreign exchange and sustain the textile industry, giving the state a strong reason to concentrate agricultural resources on export crops. That choice brings greater productive specialization, alongside social costs when water, credit and land are drawn away from other rural needs."
 COLDWAR_SYR_agriculture_13_resume:0 "Carry Out: Prioritize Cotton Exports"
 COLDWAR_SYR_agriculture_13_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_14:0 "Prioritize Food Security"
 COLDWAR_SYR_agriculture_14_desc:0 "Feeding Syrian households is a strategic task in its own right. Prioritizing food production can strengthen the rural economy and reduce hardship, while requiring public support for growers whose contribution to national security may never match the foreign exchange earnings of cotton exports."
 COLDWAR_SYR_agriculture_14_resume:0 "Carry Out: Prioritize Food Security"
 COLDWAR_SYR_agriculture_14_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_agriculture_15_reform_tt:0 "Removes the remaining agricultural productivity −4% penalty from Rainfall-Sensitive Agriculture after the completed water-management programme."
 COLDWAR_SYR_agriculture_15:0 "Resilient Rural Economy"
 COLDWAR_SYR_agriculture_15_desc:0 "Rural resilience depends on working drainage, sound soils and livelihoods that can survive an unfavourable season. Completing these arrangements will reduce the remaining burden of unreliable rainfall, although the state must continue supporting the farming communities entrusted with Syria's food and agricultural production."
 COLDWAR_SYR_agriculture_15_resume:0 "Carry Out: A Resilient Rural Economy"
 COLDWAR_SYR_agriculture_15_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_entry:0 "National Survey"
 COLDWAR_SYR_infrastructure_entry_desc:0 "Syria's useful routes do not always connect the places its development plans favour. A national survey should identify neglected links between farms, factories, ports and towns, allowing the government to distinguish essential improvements from projects promoted mainly by well-connected provincial patrons. A national engineering survey coordinates routes and contractors, with a continuing planning establishment."
 COLDWAR_SYR_infrastructure_entry_resume:0 "Carry Out: A National Infrastructure Survey"
 COLDWAR_SYR_infrastructure_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_01:0 "Prioritize Connections"
 COLDWAR_SYR_infrastructure_01_desc:0 "Interior towns and agricultural districts need reliable connections to the country's larger markets. Concentrating engineers and investment inland can accelerate infrastructure work there, while requiring an expanded administrative effort to manage projects spread across communities far from the main coastal routes."
 COLDWAR_SYR_infrastructure_01_resume:0 "Carry Out: Prioritize Inland Connections"
 COLDWAR_SYR_infrastructure_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_02:0 "Prioritize Corridor"
 COLDWAR_SYR_infrastructure_02_desc:0 "The coast links Syria's inland economy to imported equipment and foreign customers. Giving its transport corridor priority can ease future construction and trade, although project administration and competing provincial demands will grow as investment gathers around the ports and their approaches."
 COLDWAR_SYR_infrastructure_02_resume:0 "Carry Out: Prioritize the Coastal Corridor"
 COLDWAR_SYR_infrastructure_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_03:0 "Provincial Access Roads"
 COLDWAR_SYR_infrastructure_03_desc:0 "A main highway brings limited benefit to a village that cannot reach it reliably. Provincial access roads can connect growers and small towns to larger markets, but dispersed construction requires supervisors, maintenance arrangements and a commitment to places with little influence in the capital."
 COLDWAR_SYR_infrastructure_03_resume:0 "Carry Out: Provincial Access Roads"
 COLDWAR_SYR_infrastructure_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_04:0 "Ports Export Logistics"
 COLDWAR_SYR_infrastructure_04_desc:0 "Congested cargo handling can squander the gains of factories and farms far inland. Better port services and coordinated export logistics will reduce supply waste, while imposing the continuing cost of customs administration, scheduling and cooperation among agencies accustomed to guarding their own responsibilities."
 COLDWAR_SYR_infrastructure_04_resume:0 "Carry Out: Ports and Export Logistics"
 COLDWAR_SYR_infrastructure_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_05:0 "Integrated Freight Plan"
 COLDWAR_SYR_infrastructure_05_desc:0 "Roads, warehouses and ports should form a working freight network rather than a collection of prestigious projects. An integrated plan can make construction more effective, provided the government finances the administrative capacity needed to resolve disputes over routes, priorities and responsibility."
 COLDWAR_SYR_infrastructure_05_resume:0 "Carry Out: An Integrated Freight Plan"
 COLDWAR_SYR_infrastructure_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_06:0 "Freight"
 COLDWAR_SYR_infrastructure_06_desc:0 "Aleppo and Damascus anchor much of Syria's manufacturing, commerce and administration. Improving freight coordination between them can reduce losses and delays throughout the supply chain, but reliable timetables and maintenance demand institutions capable of keeping essential transport working through periods of political pressure."
 COLDWAR_SYR_infrastructure_06_resume:0 "Carry Out: Aleppo–Damascus Freight"
 COLDWAR_SYR_infrastructure_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_07:0 "Latakia Port Services"
 COLDWAR_SYR_infrastructure_07_desc:0 "Latakia's value depends on what happens between a ship's arrival and its cargo reaching Syrian customers. Strengthening handling, repair and scheduling services can ease supply problems, while the port's larger role requires sustained spending on administration and the coordination of competing users."
 COLDWAR_SYR_infrastructure_07_resume:0 "Carry Out: Latakia Port Services"
 COLDWAR_SYR_infrastructure_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_08:0 "Electricity Distribution"
 COLDWAR_SYR_infrastructure_08_desc:0 "New generation is wasted when distribution cannot deliver it to workshops and households. Improving the network will support further infrastructure construction, but transformers, connections and maintenance schedules need a permanent administrative commitment rather than an occasional campaign to announce electrified villages."
 COLDWAR_SYR_infrastructure_08_resume:0 "Carry Out: Electricity Distribution"
 COLDWAR_SYR_infrastructure_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_09:0 "Mainline Upgrades"
 COLDWAR_SYR_infrastructure_09_desc:0 "Northern industry needs more dependable freight routes to move inputs and finished goods. Funding mainline improvements around Aleppo will strengthen the physical network, while leaving the state responsible for the construction bill and the less celebrated task of keeping the upgraded routes serviceable."
 COLDWAR_SYR_infrastructure_09_resume:0 "Carry Out: Mainline Freight Upgrades"
 COLDWAR_SYR_infrastructure_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_10:0 "Latakia Cargo Facilities"
 COLDWAR_SYR_infrastructure_10_desc:0 "Additional cargo facilities at Latakia can give Syria's maritime economy room to grow. Expanding the port requires direct investment and competent management; new quays will be useful only if inland transport, handling services and maintenance can absorb the traffic they are meant to attract."
 COLDWAR_SYR_infrastructure_10_resume:0 "Carry Out: Latakia Cargo Facilities"
 COLDWAR_SYR_infrastructure_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_11:0 "Connect Consumers"
 COLDWAR_SYR_infrastructure_11_desc:0 "Rural consumers should gain access to the same developing economy as the great cities. Extending connections in the countryside will support construction and local services, but the government must finance the network and accept the social obligations of communities drawn more closely into national markets."
 COLDWAR_SYR_infrastructure_11_resume:0 "Carry Out: Connect Rural Consumers"
 COLDWAR_SYR_infrastructure_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_12_reform_tt:0 "Removes the construction speed −5% component of Uneven Development. The research penalty requires technical education."
 COLDWAR_SYR_infrastructure_12:0 "Maintain Network"
 COLDWAR_SYR_infrastructure_12_desc:0 "A road or power connection that cannot be maintained soon becomes another barrier to development. Establishing dependable upkeep can ease the country's infrastructure constraints and reduce supply waste, provided maintenance budgets and trained administrators survive the pressure to favour new construction instead."
 COLDWAR_SYR_infrastructure_12_resume:0 "Carry Out: Maintain the Installed Network"
 COLDWAR_SYR_infrastructure_12_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_13:0 "Concentrate Investment"
 COLDWAR_SYR_infrastructure_13_desc:0 "Concentrating new investment around the strongest industrial centres can produce quicker gains in output. This strategy still requires effective public administration, and its advocates must answer provincial complaints that the national plan is allowing existing advantages to determine who receives the next round of opportunities."
 COLDWAR_SYR_infrastructure_13_resume:0 "Carry Out: Concentrate New Investment"
 COLDWAR_SYR_infrastructure_13_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_14:0 "Balance Governorates"
 COLDWAR_SYR_infrastructure_14_desc:0 "Development concentrated in a few cities risks leaving entire governorates convinced that national progress excludes them. A more balanced distribution can strengthen social confidence, although negotiating among provincial priorities reduces the central government's freedom to direct every project according to its own preferences."
 COLDWAR_SYR_infrastructure_14_resume:0 "Carry Out: Balance the Governorates"
 COLDWAR_SYR_infrastructure_14_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_infrastructure_15:0 "Connected Economy"
 COLDWAR_SYR_infrastructure_15_desc:0 "A connected economy allows agricultural districts, industrial towns and ports to reinforce one another. Completing that network will make future construction easier, but the institutions responsible for roads, utilities and freight must remain funded if physical connections are to become lasting economic relationships."
 COLDWAR_SYR_infrastructure_15_resume:0 "Carry Out: A Connected Syrian Economy"
 COLDWAR_SYR_infrastructure_15_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_entry:0 "Publish Accounts"
 COLDWAR_SYR_fiscal_entry_desc:0 "Syria cannot judge the price of its ambitions while ministries conceal obligations in incompatible accounts. Publishing a coherent national budget can improve revenue administration and expose waste, though collecting reliable figures will require staff and an unwelcome degree of scrutiny for established interests."
 COLDWAR_SYR_fiscal_entry_resume:0 "Carry Out: Publish the National Accounts"
 COLDWAR_SYR_fiscal_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_01:0 "Fund Social Expansion"
 COLDWAR_SYR_fiscal_01_desc:0 "Affordable services and relief for household budgets can give the republic a firmer social foundation. Reducing the tax burden on ordinary Syrians supports that promise, while expanded commitments to welfare leave the treasury responsible for recurring costs that political declarations cannot make disappear."
 COLDWAR_SYR_fiscal_01_resume:0 "Carry Out: Fund Social Expansion"
 COLDWAR_SYR_fiscal_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_02:0 "Stabilize the Treasury"
 COLDWAR_SYR_fiscal_02_desc:0 "Public commitments have outrun the institutions expected to finance them. A firmer approach to corporate taxation and administrative restraint can steady the treasury, but businesses and households will feel the adjustment, giving opponents an opportunity to portray financial discipline as a retreat from the republic's promises."
 COLDWAR_SYR_fiscal_02_resume:0 "Carry Out: Stabilize the Treasury"
 COLDWAR_SYR_fiscal_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_03:0 "Expand Rural Clinics"
 COLDWAR_SYR_fiscal_03_desc:0 "A village should not need a journey to Damascus for basic medical attention. Expanding rural clinics can strengthen confidence in the state, while doctors, medicines and maintenance turn a construction pledge into a continuing health commitment that the national budget must support."
 COLDWAR_SYR_fiscal_03_resume:0 "Carry Out: Expand Rural Clinics"
 COLDWAR_SYR_fiscal_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_enterprise_audits_completed_eligibility_tt:0 "Three public-enterprise contracts have been audited."
 COLDWAR_SYR_fiscal_04:0 "Audit Contracts"
 COLDWAR_SYR_fiscal_04_desc:0 "Procurement reform must reach beyond speeches against corruption. Completed enterprise investigations give auditors the evidence to challenge abusive contracts and improve revenue collection, but a serious reform requires funding, political effort and protection against the officials and intermediaries whose incomes it threatens."
 COLDWAR_SYR_fiscal_04_resume:0 "Carry Out: Audit Procurement Contracts"
 COLDWAR_SYR_fiscal_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_05:0 "Credible Budget"
 COLDWAR_SYR_fiscal_05_desc:0 "A budget becomes credible when ministries can explain both their priorities and how they will pay for them. Stronger accounting and revenue oversight can make the state's finances more dependable, at the cost of maintaining professional offices rather than relying on improvised interventions."
 COLDWAR_SYR_fiscal_05_resume:0 "Carry Out: A Credible National Budget"
 COLDWAR_SYR_fiscal_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_06:0 "Teacher Colleges"
 COLDWAR_SYR_fiscal_06_desc:0 "New classrooms will achieve little without teachers able to fill them. Training colleges can widen Syria's pool of educated personnel and improve its capacity to absorb knowledge, while committing the treasury to salaries, instruction and the long effort of building a profession."
 COLDWAR_SYR_fiscal_06_resume:0 "Carry Out: Teacher Training Colleges"
 COLDWAR_SYR_fiscal_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_07:0 "Rural Health Teams"
 COLDWAR_SYR_fiscal_07_desc:0 "Some communities remain too scattered for a permanent clinic to meet every need. Mobile rural health teams can bring preventive care and treatment closer to those households, but dependable coverage requires transport, trained staff and an operating budget that cannot end with the first visit."
 COLDWAR_SYR_fiscal_07_resume:0 "Carry Out: Rural Health Teams"
 COLDWAR_SYR_fiscal_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_08:0 "Social Insurance Offices"
 COLDWAR_SYR_fiscal_08_desc:0 "Industrial growth and urban employment create risks that a family or village cannot always absorb alone. Social insurance offices can make support more dependable, strengthening confidence in public institutions while adding claims, staff and recurring obligations to the state's already crowded accounts."
 COLDWAR_SYR_fiscal_08_resume:0 "Carry Out: Social Insurance Offices"
 COLDWAR_SYR_fiscal_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_09_reform_tt:0 "Removes the research speed −5% component of Uneven Development. The construction penalty requires provincial network maintenance."
 COLDWAR_SYR_fiscal_09:0 "Technical Expansion"
 COLDWAR_SYR_fiscal_09_desc:0 "Syria needs technicians who can operate machinery, maintain public works and turn imported knowledge into domestic skills. Expanding technical education will address a central weakness in national development, though training instructors and sustaining institutions requires years of expenditure before every promised benefit reaches the economy."
 COLDWAR_SYR_fiscal_09_resume:0 "Carry Out: Technical Education Expansion"
 COLDWAR_SYR_fiscal_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_10:0 "Primary Network"
 COLDWAR_SYR_fiscal_10_desc:0 "A primary healthcare network can connect village clinics, urban services and preventive medicine into something more dependable than isolated facilities. Better coverage will strengthen public confidence, while the state accepts responsibility for the personnel and supplies needed to make care available in practice."
 COLDWAR_SYR_fiscal_10_resume:0 "Carry Out: Primary Healthcare Network"
 COLDWAR_SYR_fiscal_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_11:0 "Targeted System"
 COLDWAR_SYR_fiscal_11_desc:0 "Support should reach households whose circumstances would otherwise turn illness, unemployment or old age into destitution. A targeted benefit system can make social protection more credible, but identifying recipients and honouring their claims creates continuing expenditure that must be defended against competing demands."
 COLDWAR_SYR_fiscal_11_resume:0 "Carry Out: A Targeted Benefit System"
 COLDWAR_SYR_fiscal_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_12_reform_tt:0 "Removes 4 percentage points of the 8% bureaucracy spending penalty in State-Sector Strain. Supplier-network reform removes the other four independently."
 COLDWAR_SYR_fiscal_12:0 "Skilled Revenue Service"
 COLDWAR_SYR_fiscal_12_desc:0 "Revenue should depend less on personal intervention and more on consistent assessment and collection. A professional service can strengthen public finances and reduce the administrative strain of the state sector, provided trained officials receive the resources and authority needed to enforce rules impartially."
 COLDWAR_SYR_fiscal_12_resume:0 "Carry Out: Professional Revenue Service"
 COLDWAR_SYR_fiscal_12_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_13:0 "Subsidize Goods"
 COLDWAR_SYR_fiscal_13_desc:0 "The price of bread and other essentials can determine whether households regard national policy as protection or punishment. Broad subsidies can preserve social confidence, but they also commit the treasury to supporting consumption across society, including beneficiaries who are not the poorest Syrians."
 COLDWAR_SYR_fiscal_13_resume:0 "Carry Out: Subsidize Essential Goods"
 COLDWAR_SYR_fiscal_13_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_14:0 "Target the Subsidies"
 COLDWAR_SYR_fiscal_14_desc:0 "Concentrating assistance where it is most needed can reduce the waste of broad subsidy programmes. The savings come with political danger: households losing familiar protection will notice immediately, while the government must persuade them that a tighter system is fair rather than merely cheaper."
 COLDWAR_SYR_fiscal_14_resume:0 "Carry Out: Target the Subsidies"
 COLDWAR_SYR_fiscal_14_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_fiscal_15:0 "State Its Bills"
 COLDWAR_SYR_fiscal_15_desc:0 "A capable state must be able to finance its obligations through ordinary administration, instead of treating each payment as a crisis. Bringing accounts, services and investment into a durable framework will support development, while preserving the professional institutions on which that reliability depends."
 COLDWAR_SYR_fiscal_15_resume:0 "Carry Out: A State That Can Pay Its Bills"
 COLDWAR_SYR_fiscal_15_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_entry:0 "Open Citizenship Files"
 COLDWAR_SYR_citizenship_entry_desc:0 "The exceptional census of 1962 left many Kurds in the northeast without recognized citizenship, with consequences for families, work and access to public institutions. Opening those files forces Damascus to confront a lasting source of grievance which administrative silence has done nothing to resolve. Opening a staffed public records inquiry provides a small measure of confidence at an administrative cost. It does not grant citizenship, resolve appeals or remove the historical census penalties before their substantive reforms."
 COLDWAR_SYR_citizenship_entry_resume:0 "Carry Out: Open the Citizenship Files"
 COLDWAR_SYR_citizenship_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_01:0 "Review the 1962 Census"
 COLDWAR_SYR_citizenship_01_desc:0 "The census registers should be examined against family records and the circumstances in which decisions were made. A review can begin repairing confidence in the state, but officials must receive the time, authority and funding to investigate contested cases rather than reproduce the original exclusions."
 COLDWAR_SYR_citizenship_01_resume:0 "Carry Out: Review the 1962 Census"
 COLDWAR_SYR_citizenship_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_02:0 "Defend Registers"
 COLDWAR_SYR_citizenship_02_desc:0 "Defenders of the existing registers argue that reopening them will invite challenges the administration cannot control. Preserving those records can reassure supporters of a strict national policy, while the exclusion of families from fuller participation continues to narrow the country's educational and civic possibilities."
 COLDWAR_SYR_citizenship_02_resume:0 "Carry Out: Defend the Existing Registers"
 COLDWAR_SYR_citizenship_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_03_reform_tt:0 "An independent appeals commission reduces the Citizenship Census stability penalty from −4% to −2%. Actual paid appeals and implementation remain necessary for full citizenship reform."
 COLDWAR_SYR_citizenship_03_political_outcome_tt:0 "Opens an independent citizenship appeals commission."
 COLDWAR_SYR_citizenship_03:0 "Appeals Commission"
 COLDWAR_SYR_citizenship_03_desc:0 "An appeal means little when the same office that rejected a family decides whether it was mistaken. An independent commission can begin reducing the damage left by the census, provided it receives the resources to hear evidence and the authority to correct decisions."
 COLDWAR_SYR_citizenship_03_resume:0 "Carry Out: An Independent Appeals Commission"
 COLDWAR_SYR_citizenship_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_04:0 "Tighten Screening"
 COLDWAR_SYR_citizenship_04_desc:0 "Tighter screening gives the central administration a firmer grip over citizenship claims and reassures those who fear an uncontrolled reopening. It also creates more files, officials and disputes; a state demanding stronger proof must bear the cost of examining that proof fairly."
 COLDWAR_SYR_citizenship_04_resume:0 "Carry Out: Tighten Citizenship Screening"
 COLDWAR_SYR_citizenship_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_05:0 "National Settlement"
 COLDWAR_SYR_citizenship_05_desc:0 "Syria needs a citizenship settlement that ordinary families can understand and public offices can administer consistently. Consolidating the chosen rules can reduce uncertainty, but the government must fund the institutions that apply them and accept responsibility for the consequences of its decision."
 COLDWAR_SYR_citizenship_05_resume:0 "Carry Out: A National Citizenship Settlement"
 COLDWAR_SYR_citizenship_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_06:0 "Arabic Public Service"
 COLDWAR_SYR_citizenship_06_desc:0 "A common language in public administration can make education and official communication more coherent across the republic. Extending Arabic services will spread knowledge, while requiring negotiation with communities whose confidence depends on assurance that common institutions will not erase their own cultural life."
 COLDWAR_SYR_citizenship_06_resume:0 "Carry Out: Arabic Public Administration"
 COLDWAR_SYR_citizenship_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_07:0 "Minority Guarantees"
 COLDWAR_SYR_citizenship_07_desc:0 "The republic contains communities whose languages and traditions do not fit a single official portrait of national life. Protecting their cultural rights can strengthen allegiance to shared institutions, but guarantees must be administered, disputes heard and reluctant local officials held to the government's commitments."
 COLDWAR_SYR_citizenship_07_resume:0 "Carry Out: Minority Cultural Guarantees"
 COLDWAR_SYR_citizenship_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_08:0 "Provincial Boards"
 COLDWAR_SYR_citizenship_08_desc:0 "Provincial boards can bring public services closer to the people who use them and improve the coordination of local construction. Giving these bodies a meaningful role also creates expectations of support, requiring Damascus to fund responsibilities it can no longer dismiss as purely local concerns."
 COLDWAR_SYR_citizenship_08_resume:0 "Carry Out: Provincial Service Boards"
 COLDWAR_SYR_citizenship_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_09:0 "End Land Seizures"
 COLDWAR_SYR_citizenship_09_desc:0 "Land policy cannot provide security while cultivators fear arbitrary seizure. Ending such practices can encourage farmers to invest in their holdings, while obliging the state to support a settlement that addresses rural hardship instead of using administrative power to silence those affected."
 COLDWAR_SYR_citizenship_09_resume:0 "Carry Out: End Arbitrary Land Seizures"
 COLDWAR_SYR_citizenship_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_10:0 "Recognize Associations"
 COLDWAR_SYR_citizenship_10_desc:0 "Cultural associations can preserve language, publish ideas and give communities a lawful public voice. Recognition will widen Syria's intellectual life, while requiring the authorities to tolerate independent organizations whose members may use that voice to criticize official policy as well as celebrate local traditions."
 COLDWAR_SYR_citizenship_10_resume:0 "Carry Out: Recognize Cultural Associations"
 COLDWAR_SYR_citizenship_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_11:0 "Equal State Services"
 COLDWAR_SYR_citizenship_11_desc:0 "A citizenship review must lead beyond revised papers to ordinary access to services. Opening health and other public institutions on equal terms can restore confidence in the republic, although the government must finance the additional responsibilities created when previously excluded households can finally make their claims."
 COLDWAR_SYR_citizenship_11_resume:0 "Carry Out: Equal Access to State Services"
 COLDWAR_SYR_citizenship_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_12:0 "Civic Communities"
 COLDWAR_SYR_citizenship_12_desc:0 "A civic compact can bind Syria's communities through shared rights and negotiated responsibilities. That agreement will strengthen social confidence only if the centre accepts that other voices have a legitimate place in national politics, even when bargaining limits the freedom of those who govern."
 COLDWAR_SYR_citizenship_12_resume:0 "Carry Out: A Civic Compact across Communities"
 COLDWAR_SYR_citizenship_12_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_13:0 "Elected Councils"
 COLDWAR_SYR_citizenship_13_desc:0 "Elected councils would give provincial communities a direct voice in the services and decisions shaping their lives. Their legitimacy can strengthen the republic, but Damascus must surrender some control over local priorities and accept representatives whose authority does not depend on central appointment."
 COLDWAR_SYR_citizenship_13_resume:0 "Carry Out: Elected Provincial Councils"
 COLDWAR_SYR_citizenship_13_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_14:0 "Appointed Councils"
 COLDWAR_SYR_citizenship_14_desc:0 "Appointed councils promise a clearer connection between provincial administration and the government's national programme. They can make central direction easier, while requiring a larger administrative effort and leaving the authorities responsible for choosing local representatives able to command trust beyond their official title."
 COLDWAR_SYR_citizenship_14_resume:0 "Carry Out: Appointed Provincial Councils"
 COLDWAR_SYR_citizenship_14_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_citizenship_15_reform_tt:0 "After citizenship appeals are implemented, removes the remaining stability −2% and political power gain −3% from the Citizenship Census."
 COLDWAR_SYR_citizenship_15:0 "Republic Equal Citizens"
 COLDWAR_SYR_citizenship_15_desc:0 "Equal citizenship must be demonstrated in registers, institutions and everyday treatment rather than proclaimed over unresolved cases. Completing the review can remove the remaining burden of the census dispute, while permanent oversight ensures that the settlement reaches families whose exclusion has endured for years."
 COLDWAR_SYR_citizenship_15_resume:0 "Carry Out: A Republic of Equal Citizens"
 COLDWAR_SYR_citizenship_15_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_darwish:0 "Abd al-Hamid Darwish participates in an accepted cabinet representation agreement."
 COLDWAR_SYR_darwish_entry:0 "A Citizenship Petition"
 COLDWAR_SYR_darwish_entry_desc:0 "Abdul Hamid Darwish's political current offers a route to negotiate Kurdish demands within Syrian public life. Hearing its citizenship petition can strengthen confidence among excluded communities, but government must be prepared to examine the cases and obligations which recognition brings into the open."
 COLDWAR_SYR_darwish_entry_resume:0 "Carry Out: A Citizenship Petition"
 COLDWAR_SYR_darwish_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_darwish_01:0 "Civilian Negotiation"
 COLDWAR_SYR_darwish_01_desc:0 "Parliamentary negotiation can turn grievances over citizenship and cultural life into proposals other parties must answer. Supporting that route gives Kurdish representatives a stake in common institutions, while requiring patient administration and a willingness to treat a negotiated concession as more than a temporary favour."
 COLDWAR_SYR_darwish_01_resume:0 "Carry Out: Parliamentary Negotiation"
 COLDWAR_SYR_darwish_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_darwish_02:0 "Local Civic Organizing"
 COLDWAR_SYR_darwish_02_desc:0 "Local civic networks can bring teachers, families and community advocates into a lawful public discussion. Their work will widen participation and the exchange of knowledge, while leaving the central authorities less able to control how those communities express their priorities or judge official promises."
 COLDWAR_SYR_darwish_02_resume:0 "Carry Out: Local Civic Organizing"
 COLDWAR_SYR_darwish_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_darwish_03:0 "Cross-Party Committee"
 COLDWAR_SYR_darwish_03_desc:0 "Citizenship should not depend on the goodwill of a single patron. A committee drawing members from several parties can give rights claims a broader political foundation, but meaningful representation requires the government to share influence with partners whose support cannot simply be commanded."
 COLDWAR_SYR_darwish_03_resume:0 "Carry Out: A Cross-Party Rights Committee"
 COLDWAR_SYR_darwish_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_darwish_04:0 "Service Associations"
 COLDWAR_SYR_darwish_04_desc:0 "Community associations can organize practical assistance where official services have failed to reach families consistently. Backing their work may rebuild trust and reduce hardship, while creating social commitments which the state must sustain if cooperation is to outlast the first public gesture."
 COLDWAR_SYR_darwish_04_resume:0 "Carry Out: Community Service Associations"
 COLDWAR_SYR_darwish_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_darwish_05:0 "Kurdish Cultural Rights"
 COLDWAR_SYR_darwish_05_desc:0 "Kurdish cultural life need not be treated as a threat to Syrian citizenship. Protecting its lawful expression can broaden education and public discussion, but the government must accept that cultural freedom gives communities an independent voice which cannot always be folded into an official narrative."
 COLDWAR_SYR_darwish_05_resume:0 "Carry Out: Kurdish Cultural Rights"
 COLDWAR_SYR_darwish_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_darwish_06:0 "Voice Coalition"
 COLDWAR_SYR_darwish_06_desc:0 "A coalition partner needs opportunities to shape policy, not merely a chair at ceremonial meetings. Giving Darwish's representatives a working role can enrich public debate and institutional knowledge, while requiring the governing majority to negotiate decisions it once expected to make alone."
 COLDWAR_SYR_darwish_06_resume:0 "Carry Out: Representation in the Coalition"
 COLDWAR_SYR_darwish_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_darwish_07:0 "Inclusive Compact"
 COLDWAR_SYR_darwish_07_desc:0 "An inclusive compact would link Kurdish rights to the security of all Syrian citizens within a common republic. Such an agreement can strengthen national confidence, provided the central government accepts lasting limits on arbitrary action and honours bargains even when its coalition arithmetic changes."
 COLDWAR_SYR_darwish_07_resume:0 "Carry Out: An Inclusive Syrian Compact"
 COLDWAR_SYR_darwish_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_badr:0 "Salah Badr al-Din participates in an accepted cabinet representation agreement."
 COLDWAR_SYR_badr_entry:0 "Organize Left"
 COLDWAR_SYR_badr_entry_desc:0 "Salah Badr al-Din's current links Kurdish demands with a wider democratic left. Bringing it into lawful coalition politics can give those networks an organized voice, while obliging the state to administer relations with a partner whose social programme and regional connections may challenge established policy."
 COLDWAR_SYR_badr_entry_resume:0 "Carry Out: Organize the Kurdish Democratic Left"
 COLDWAR_SYR_badr_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_badr_01:0 "Agrarian Redress"
 COLDWAR_SYR_badr_01_desc:0 "For many rural Kurdish families, rights are inseparable from land and the means to cultivate it. Agrarian redress can improve productive security, while requiring public support for households affected by dispossession and a government prepared to hear claims that influential interests would prefer to forget."
 COLDWAR_SYR_badr_01_resume:0 "Carry Out: Agrarian Redress"
 COLDWAR_SYR_badr_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_badr_02:0 "Cross-Border Solidarity"
 COLDWAR_SYR_badr_02_desc:0 "Kurdish political life extends across frontiers which Syrian diplomacy cannot ignore. Allowing lawful solidarity can strengthen this coalition's organizing capacity, but careful administration is needed to distinguish civil contact from commitments that could entangle Damascus in disputes it has not agreed to enter."
 COLDWAR_SYR_badr_02_resume:0 "Carry Out: Cross-Border Solidarity"
 COLDWAR_SYR_badr_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_badr_03:0 "Protect Smallholders"
 COLDWAR_SYR_badr_03_desc:0 "Smallholders who fear displacement have little reason to trust promises of equal citizenship. Protecting them through consistent procedures can strengthen confidence in the state, but inspectors, hearings and reliable records are necessary if protection is to survive pressure from local officials and competing claimants."
 COLDWAR_SYR_badr_03_resume:0 "Carry Out: Protect Dispossessed Smallholders"
 COLDWAR_SYR_badr_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_badr_04:0 "Cultural Agreements"
 COLDWAR_SYR_badr_04_desc:0 "Cultural cooperation can connect teachers, associations and publications without requiring the republic to surrender its sovereignty. Supporting such exchanges can broaden knowledge, while the government accepts an intellectual life in which local communities maintain relationships and interests beyond those selected by the centre."
 COLDWAR_SYR_badr_04_resume:0 "Carry Out: Cultural Cooperation Agreements"
 COLDWAR_SYR_badr_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_badr_05:0 "Democratic Platform"
 COLDWAR_SYR_badr_05_desc:0 "A democratic coalition needs a platform linking civil rights with economic and provincial questions. Agreeing one can strengthen public confidence across communities, but it also binds the government to compromises with partners who expect their influence to survive beyond the next cabinet announcement."
 COLDWAR_SYR_badr_05_resume:0 "Carry Out: A Democratic Coalition Platform"
 COLDWAR_SYR_badr_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_badr_06:0 "Local Self-Service"
 COLDWAR_SYR_badr_06_desc:0 "Local self-administration can give communities a practical say over services and everyday public affairs. Its success would strengthen trust in shared institutions, provided responsibilities are clear and the state funds the administrative work instead of leaving provincial bodies with authority on paper alone."
 COLDWAR_SYR_badr_06_resume:0 "Carry Out: Local Self-Administration"
 COLDWAR_SYR_badr_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_badr_07:0 "Negotiated Settlement"
 COLDWAR_SYR_badr_07_desc:0 "A negotiated provincial settlement can bring land, representation and cultural guarantees into one durable agreement. It will strengthen the republic only if Damascus accepts meaningful consultation, while local partners undertake to defend the common institutions through which their newly secured rights will be exercised."
 COLDWAR_SYR_badr_07_resume:0 "Carry Out: A Negotiated Provincial Settlement"
 COLDWAR_SYR_badr_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_entry:0 "Study Lessons 1967"
 COLDWAR_SYR_army_entry_desc:0 "The loss of the Golan in 1967 exposed failures of command, training and readiness that political slogans cannot repair. A candid examination must distinguish institutional weaknesses from convenient scapegoats, allowing Syria to rebuild an army whose plans reflect its actual resources and responsibilities. Lessons from 1967 improve unit procedures; more demanding staff exercises consume additional supplies."
 COLDWAR_SYR_army_entry_resume:0 "Carry Out: Study the Lessons of 1967"
 COLDWAR_SYR_army_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_01:0 "Skilled Force"
 COLDWAR_SYR_army_01_desc:0 "A professional combined-arms force promises more coherent formations and better cooperation under pressure. Concentrating training and command attention on such units can improve organization, although the resulting standards narrow the pool of recruits who can be absorbed without diluting that professional foundation."
 COLDWAR_SYR_army_01_resume:0 "Carry Out: Professional Combined-Arms Force"
 COLDWAR_SYR_army_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_02:0 "Larger Territorial Army"
 COLDWAR_SYR_army_02_desc:0 "A larger territorial army can broaden the manpower available to defend Syria and sustain its formations. Mobilizing more citizens also removes labour from civilian production, forcing the government to weigh numerical strength against the factories and workshops needed to support it."
 COLDWAR_SYR_army_02_resume:0 "Carry Out: A Larger Territorial Army"
 COLDWAR_SYR_army_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_03:0 "Competent College"
 COLDWAR_SYR_army_03_desc:0 "Competent staff officers must be able to read terrain, coordinate supply and challenge a plan before soldiers pay for its mistakes. Strengthening the staff college can improve Syria's technical knowledge, but serious education requires instructors and funding rather than another promotion channel for favoured officers."
 COLDWAR_SYR_army_03_resume:0 "Carry Out: A Competent Staff College"
 COLDWAR_SYR_army_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_04:0 "Reserve Districts"
 COLDWAR_SYR_army_04_desc:0 "Reserve districts can make more trained men available when Syria faces a military emergency. Expanding the system spreads equipment and instructors across a wider pool, so the gain in manpower comes with the difficulty of keeping every formation equally organized and ready."
 COLDWAR_SYR_army_04_resume:0 "Carry Out: Reserve Training Districts"
 COLDWAR_SYR_army_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_05_reform_tt:0 "Removes army organization −5% from the Defeat of 1967. Its war support +5% grievance persists while the Golan remains outside Syrian control."
 COLDWAR_SYR_army_05:0 "Sustainable Battle"
 COLDWAR_SYR_army_05_desc:0 "The army needs formations it can supply and command, rather than impressive totals disconnected from available resources. Reorganizing the order of battle around that principle can overcome part of the institutional damage revealed in 1967, while placing a continuing burden on military administration."
 COLDWAR_SYR_army_05_resume:0 "Carry Out: A Sustainable Order of Battle"
 COLDWAR_SYR_army_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_06:0 "Repair Recovery Units"
 COLDWAR_SYR_army_06_desc:0 "A recoverable vehicle should not become a permanent loss because the right workshop or tow vehicle is missing. Repair and recovery units can reduce waste throughout the supply system, provided their less glamorous work receives the funding and administrative attention usually reserved for combat formations."
 COLDWAR_SYR_army_06_resume:0 "Carry Out: Repair and Recovery Units"
 COLDWAR_SYR_army_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_07:0 "NCO Training Schools"
 COLDWAR_SYR_army_07_desc:0 "Reliable non-commissioned officers turn orders into action when officers cannot supervise every section and vehicle. Building a trained NCO corps can improve organization across the army, but higher professional standards limit how quickly inexperienced recruits can be absorbed into effective units."
 COLDWAR_SYR_army_07_resume:0 "Carry Out: NCO Training Schools"
 COLDWAR_SYR_army_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_08:0 "Operational Logistics"
 COLDWAR_SYR_army_08_desc:0 "Operational logistics requires domestic capacity as well as careful schedules. Expanding the military workshops around Homs will strengthen production and support, while construction costs and the administration of maintenance contracts remind the army that battlefield endurance begins well behind the front."
 COLDWAR_SYR_army_08_resume:0 "Carry Out: Operational Logistics"
 COLDWAR_SYR_army_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_09:0 "Mobile Reserves"
 COLDWAR_SYR_army_09_desc:0 "Mobile reserves can respond to a threatened sector or exploit an opportunity before the front settles again. Better organization makes that flexibility useful, but moving formations and keeping their vehicles ready increases the supply burden on an army already dependent on limited transport and maintenance capacity."
 COLDWAR_SYR_army_09_resume:0 "Carry Out: Mobile Operational Reserves"
 COLDWAR_SYR_army_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_10:0 "Prepared Belts"
 COLDWAR_SYR_army_10_desc:0 "Prepared defensive positions can give Syrian formations a more secure foundation against a stronger opponent. Their construction also competes with civilian works for labour, materials and attention, making every defensive belt a choice about resources that cannot be used elsewhere."
 COLDWAR_SYR_army_10_resume:0 "Carry Out: Prepared Defensive Belts"
 COLDWAR_SYR_army_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_11:0 "Army Be Sustained"
 COLDWAR_SYR_army_11_desc:0 "A sustainable army should be able to hold its positions without consuming the country that supports it. Consolidating defensive preparation can improve that balance, while the continuing demand for military works reminds the government that security and civilian development draw upon many of the same resources."
 COLDWAR_SYR_army_11_resume:0 "Carry Out: An Army That Can Be Sustained"
 COLDWAR_SYR_army_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_air_entry:0 "Audit Force Readiness"
 COLDWAR_SYR_air_entry_desc:0 "Aircraft totals conceal grounded machines, uneven pilot training and weaknesses in warning and command. An honest readiness audit will establish what Syria's air force can actually sustain, giving the government a foundation for choices more useful than another optimistic report about nominal strength. Readiness inspections improve flight safety but require maintenance and inspection personnel."
 COLDWAR_SYR_air_entry_resume:0 "Carry Out: Audit Air Force Readiness"
 COLDWAR_SYR_air_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_air_01:0 "Integrated Air Defence"
 COLDWAR_SYR_air_01_desc:0 "Air defence depends on warnings reaching the right commanders in time, as well as on weapons. Integrating reporting and intelligence can make the network more coherent, while skilled operators, liaison personnel and command posts add a continuing personnel cost to Syria's defence budget."
 COLDWAR_SYR_air_01_resume:0 "Carry Out: Integrated Air Defence"
 COLDWAR_SYR_air_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_air_02:0 "Prioritize Readiness"
 COLDWAR_SYR_air_02_desc:0 "Fighter units need regular flying time to make their aircraft a dependable military instrument. Concentrating resources on readiness can accelerate training, but every additional sortie consumes fuel and places further demands on the maintenance system that must return each aircraft to service."
 COLDWAR_SYR_air_02_resume:0 "Carry Out: Prioritize Fighter Readiness"
 COLDWAR_SYR_air_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_air_03:0 "Radar Discipline"
 COLDWAR_SYR_air_03_desc:0 "A radar contact is useful only when it is reported clearly, interpreted correctly and passed to the appropriate command. Enforcing disciplined reporting can improve air force intelligence, provided the government keeps enough trained personnel at the consoles and communications posts to sustain it."
 COLDWAR_SYR_air_03_resume:0 "Carry Out: Radar Reporting Discipline"
 COLDWAR_SYR_air_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_air_04:0 "Pilot Training"
 COLDWAR_SYR_air_04_desc:0 "Pilots and ground crews must train as parts of the same operational system. Expanding exercises can improve the pace at which Syria acquires flying experience, while the fuel spent on realistic training becomes a recurring cost rather than an exceptional allocation."
 COLDWAR_SYR_air_04_resume:0 "Carry Out: Pilot and Groundcrew Training"
 COLDWAR_SYR_air_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_air_05:0 "Defensible Doctrine"
 COLDWAR_SYR_air_05_desc:0 "Syria cannot defend its airspace through scattered reactions to each alarm. A coherent defensive doctrine can improve the survival of its aircraft under attack, while its implementation requires enough trained personnel to keep units, reporting stations and command arrangements working together."
 COLDWAR_SYR_air_05_resume:0 "Carry Out: A Defensible Airspace Doctrine"
 COLDWAR_SYR_air_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_air_06:0 "Airfield Teams"
 COLDWAR_SYR_air_06_desc:0 "Routine airfield maintenance rarely attracts political attention until an accident exposes its neglect. Dedicated teams can reduce preventable losses and keep operating surfaces dependable, but inspection schedules, spare materials and supervision must receive administrative support even when no emergency makes the headlines."
 COLDWAR_SYR_air_06_resume:0 "Carry Out: Airfield Maintenance Teams"
 COLDWAR_SYR_air_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_air_07:0 "Aircraft Overhaul Skills"
 COLDWAR_SYR_air_07_desc:0 "Overhaul skills can keep imported aircraft useful after their initial delivery and reduce accidents caused by deteriorating equipment. Building that knowledge will strengthen technical capacity, while workshops, instructors and careful inspection create administrative costs that cannot be replaced by enthusiasm alone."
 COLDWAR_SYR_air_07_resume:0 "Carry Out: Aircraft Overhaul Skills"
 COLDWAR_SYR_air_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_air_08:0 "Funded Network"
 COLDWAR_SYR_air_08_desc:0 "An air defence network needs funded operating facilities around the capital as well as trained crews. Expanding Damascus's air base capacity will provide a physical foundation for the programme, while its larger personnel establishment creates obligations beyond the original construction bill."
 COLDWAR_SYR_air_08_resume:0 "Carry Out: A Funded Air Defence Network"
 COLDWAR_SYR_air_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_air_09:0 "Dispersal Sites"
 COLDWAR_SYR_air_09_desc:0 "Concentrated aircraft are vulnerable before they leave the ground. Developing dispersed operating arrangements and protected sites can make future airfield work more effective, but keeping several locations usable requires more planning, inspection and administrative effort than maintaining a single crowded base."
 COLDWAR_SYR_air_09_resume:0 "Carry Out: Dispersal and Protected Sites"
 COLDWAR_SYR_air_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_air_10:0 "Concentrated Squadrons"
 COLDWAR_SYR_air_10_desc:0 "A concentrated alert force can keep experienced squadrons ready for the missions judged most urgent. Their greater operational activity will build experience, while increasing fuel use and making the government answer for the resources devoted to maintaining that constant readiness."
 COLDWAR_SYR_air_10_resume:0 "Carry Out: Concentrated Alert Squadrons"
 COLDWAR_SYR_air_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_air_11:0 "A Sustainable Air Force"
 COLDWAR_SYR_air_11_desc:0 "A sustainable air force must learn from training while avoiding needless fuel consumption. Consolidating sound maintenance, scheduling and instruction can improve that balance, but the administrative institutions behind such discipline need continued support after the excitement of acquiring aircraft has passed."
 COLDWAR_SYR_air_11_resume:0 "Carry Out: A Sustainable Air Force"
 COLDWAR_SYR_air_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_navy_entry:0 "Define Coastal Mission"
 COLDWAR_SYR_navy_entry_desc:0 "Syria's short coastline does not justify every ambition of a larger naval power. Defining a realistic mission around ports, coastal approaches and maritime supply will let the government build useful capabilities instead of dispersing scarce money among vessels it cannot support effectively. Coastal patrol exercises improve station keeping and coordination at the expense of fuel."
 COLDWAR_SYR_navy_entry_resume:0 "Carry Out: Define the Coastal Mission"
 COLDWAR_SYR_navy_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_navy_01:0 "Coastal Denial"
 COLDWAR_SYR_navy_01_desc:0 "A coastal denial force can exploit familiar waters and prepared positions to complicate an opponent's access. Better tactical positioning makes that mission more credible, but patrols and exercises consume fuel which a modest navy must secure from the same national resources as the army and air force."
 COLDWAR_SYR_navy_01_resume:0 "Carry Out: Coastal Denial"
 COLDWAR_SYR_navy_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_navy_02:0 "Escort Maritime Trade"
 COLDWAR_SYR_navy_02_desc:0 "Maritime trade deserves protection even when Syria cannot contest the wider sea. An escort mission can strengthen coordination around essential shipping, while demanding administrative links among naval commands, port authorities and commercial users whose schedules and priorities will not always agree."
 COLDWAR_SYR_navy_02_resume:0 "Carry Out: Escort and Maritime Trade"
 COLDWAR_SYR_navy_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_navy_03:0 "Shore-Based Liaison"
 COLDWAR_SYR_navy_03_desc:0 "Ships, shore stations and port commands must share a common picture of coastal activity. Improving their coordination can make a small force more effective, but communications procedures and joint supervision require the navy to finance institutions as well as maintain vessels."
 COLDWAR_SYR_navy_03_resume:0 "Carry Out: Shore-Based Coordination"
 COLDWAR_SYR_navy_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_naval_speed_factor_tt:0 "$MODIFIER_NAVAL_SPEED_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SYR_navy_04:0 "Merchant Drills"
 COLDWAR_SYR_navy_04_desc:0 "Merchant protection drills can teach crews to respond more promptly to threats and keep ships moving through dangerous approaches. Greater activity will improve the navy's practical mobility, while training at sea consumes fuel that remains a substantial burden for a force with limited resources."
 COLDWAR_SYR_navy_04_resume:0 "Carry Out: Merchant Protection Drills"
 COLDWAR_SYR_navy_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_navy_05:0 "Modest Plan"
 COLDWAR_SYR_navy_05_desc:0 "A modest procurement plan should match shipbuilding work to the missions Syria can sustain. Better coordination can improve dockyard output, provided the government funds the officials and technical staff needed to keep purchases, repairs and operating requirements from drifting apart."
 COLDWAR_SYR_navy_05_resume:0 "Carry Out: A Modest Naval Procurement Plan"
 COLDWAR_SYR_navy_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_navy_06:0 "Port Repair Workshops"
 COLDWAR_SYR_navy_06_desc:0 "Repair workshops can keep the coastal force serviceable without sending every technical problem abroad. Strengthening their organization will improve dockyard work, while procurement, inspection and maintenance administration add steady costs to a navy whose useful life depends on far more than acquiring hulls."
 COLDWAR_SYR_navy_06_resume:0 "Carry Out: Port Repair Workshops"
 COLDWAR_SYR_navy_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_navy_07:0 "Naval Technical Schools"
 COLDWAR_SYR_navy_07_desc:0 "Naval technical schools can train the mechanics, operators and junior leaders needed to use a small fleet well. Their work will strengthen coordination and technical knowledge, but the teaching establishment requires administrative support that must survive pressure to spend every available allocation on equipment."
 COLDWAR_SYR_navy_07_resume:0 "Carry Out: Naval Technical Schools"
 COLDWAR_SYR_navy_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_navy_08:0 "Coastal Supply Services"
 COLDWAR_SYR_navy_08_desc:0 "A coastal force needs dependable fuel, stores and harbour support at Latakia. Expanding its base facilities can make operations less wasteful, while the construction bill and the administrative effort of managing supplies become permanent considerations in Syria's maritime policy."
 COLDWAR_SYR_navy_08_resume:0 "Carry Out: Coastal Supply Services"
 COLDWAR_SYR_navy_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_navy_09:0 "Invest Patrol Readiness"
 COLDWAR_SYR_navy_09_desc:0 "Patrol readiness comes from practiced crews and reliable coordination rather than ships waiting indefinitely at the quay. More active preparation can improve the navy's response at sea, but the additional fuel consumed must be weighed against the needs of other services and civilian users."
 COLDWAR_SYR_navy_09_resume:0 "Carry Out: Invest in Patrol Readiness"
 COLDWAR_SYR_navy_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_navy_10:0 "Invest Base Protection"
 COLDWAR_SYR_navy_10_desc:0 "Protecting naval bases preserves the workshops and support on which the entire coastal force depends. Directing effort into that foundation can improve dockyard effectiveness, while exercises and supporting activity add fuel costs to a programme whose advantages are most visible when a crisis arrives."
 COLDWAR_SYR_navy_10_resume:0 "Carry Out: Invest in Base Protection"
 COLDWAR_SYR_navy_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_navy_11:0 "Secure the Syrian Coast"
 COLDWAR_SYR_navy_11_desc:0 "Securing the coast requires a force that can coordinate its work without wasting scarce fuel and supplies. Consolidating these practices will make Syria's maritime posture more durable, while the shore administration responsible for sustaining them must remain a funded part of national defence."
 COLDWAR_SYR_navy_11_resume:0 "Carry Out: Secure the Syrian Coast"
 COLDWAR_SYR_navy_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_entry:0 "Review Dependencies"
 COLDWAR_SYR_great_powers_entry_desc:0 "Syria needs equipment, credit and technical knowledge which its domestic economy cannot yet supply. Reviewing those dependencies will clarify where foreign cooperation strengthens national independence and where a supplier's terms could leave Damascus with obligations it cannot afford or refuse. Reviewing foreign contracts improves investment negotiations but requires a permanent negotiating staff."
 COLDWAR_SYR_great_powers_entry_resume:0 "Carry Out: Review Foreign Dependencies"
 COLDWAR_SYR_great_powers_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_01:0 "Soviet Partnership"
 COLDWAR_SYR_great_powers_01_desc:0 "Soviet cooperation offers Syria access to arms, specialists and a powerful diplomatic partner. Making that relationship a strategic priority can strengthen the government's position, while requiring a capable bureaucracy to negotiate agreements and defend Syrian interests within a partnership of very unequal resources."
 COLDWAR_SYR_great_powers_01_resume:0 "Carry Out: A Soviet Strategic Partnership"
 COLDWAR_SYR_great_powers_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_02:0 "Diversify Contacts"
 COLDWAR_SYR_great_powers_02_desc:0 "Dependence on one supplier leaves Syria vulnerable to another government's calculations. Diversifying foreign contacts can widen its diplomatic room for manoeuvre, but handling competing offers and incompatible expectations requires officials able to pursue a coherent national policy rather than accumulate contradictory promises."
 COLDWAR_SYR_great_powers_02_resume:0 "Carry Out: Diversify Foreign Contacts"
 COLDWAR_SYR_great_powers_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_03:0 "Negotiate Terms"
 COLDWAR_SYR_great_powers_03_desc:0 "An arms delivery becomes useful only when spare parts, instruction and maintenance follow it. Negotiating dependable service terms can reduce supply waste, while the continuing work of managing contracts and technical obligations adds to the administrative cost of sustaining Syria's forces."
 COLDWAR_SYR_great_powers_03_resume:0 "Carry Out: Negotiate Arms Service Terms"
 COLDWAR_SYR_great_powers_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_04:0 "Cultivate Partners"
 COLDWAR_SYR_great_powers_04_desc:0 "Non-Aligned partners can offer diplomatic support and practical cooperation without demanding that Syria accept every quarrel of a major bloc. Cultivating these relationships can strengthen political independence, though a less concentrated network of patrons may make development investment harder to arrange on favourable terms."
 COLDWAR_SYR_great_powers_04_resume:0 "Carry Out: Cultivate Non-Aligned Partners"
 COLDWAR_SYR_great_powers_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_05:0 "Foreign Framework"
 COLDWAR_SYR_great_powers_05_desc:0 "Foreign cooperation should follow an agreed Syrian framework rather than separate bargains made by competing ministries. Clearer responsibilities can strengthen confidence in the government's direction, while administering the resulting agreements requires staff and procedures capable of following obligations long after the delegations depart."
 COLDWAR_SYR_great_powers_05_resume:0 "Carry Out: A Foreign Cooperation Framework"
 COLDWAR_SYR_great_powers_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_06:0 "Technical Offers"
 COLDWAR_SYR_great_powers_06_desc:0 "Foreign training offers can help Syrian engineers and technicians acquire skills which local institutions cannot yet teach widely. Preparing useful placements and domestic instruction will strengthen the country's knowledge, but instructors, translation and continuing educational support must be funded if the skills are to endure."
 COLDWAR_SYR_great_powers_06_resume:0 "Carry Out: Technical Training Offers"
 COLDWAR_SYR_great_powers_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_07:0 "Negotiate Credit"
 COLDWAR_SYR_great_powers_07_desc:0 "Development credit can bring machinery and construction within reach before domestic revenues would permit it. Negotiating better access to investment also exposes Syria to financing costs, making the terms of repayment as important to independence as the project whose opening ceremony the loan will finance."
 COLDWAR_SYR_great_powers_07_resume:0 "Carry Out: Negotiate Development Credit"
 COLDWAR_SYR_great_powers_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_08:0 "Diversify Spare Parts"
 COLDWAR_SYR_great_powers_08_desc:0 "A missing component should not immobilize equipment simply because one foreign supplier has changed its policy. Diversifying spare parts arrangements can make supply more efficient, while technicians and purchasing offices must manage the added complexity of several sources and standards."
 COLDWAR_SYR_great_powers_08_resume:0 "Carry Out: Diversify Spare Parts"
 COLDWAR_SYR_great_powers_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_09:0 "Joint by Agreement"
 COLDWAR_SYR_great_powers_09_desc:0 "Joint training can improve the army's organization when Syrian commanders and their partners agree on its purpose. The emphasis on competent formations will limit rapid recruitment, and any foreign participation must follow a negotiated arrangement rather than an assumption that an ally will provide personnel on demand."
 COLDWAR_SYR_great_powers_09_resume:0 "Carry Out: Joint Training by Agreement"
 COLDWAR_SYR_great_powers_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_10:0 "Funded Agreement"
 COLDWAR_SYR_great_powers_10_desc:0 "A foreign project agreement should specify a useful undertaking, a willing partner and a source of funding. Syria can prepare its contribution and invite cooperation, but the other government must decide whether to accept the commitment before diplomatic assurances become a project either country can rely upon. A Syrian feasibility office improves specifications and contract preparation for construction, with a continuing staff cost. The foreign-funded project itself still requires the donor's accepted and funded agreement."
 COLDWAR_SYR_great_powers_10_resume:0 "Carry Out: A Funded Project Agreement"
 COLDWAR_SYR_great_powers_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_11:0 "Domestic Capacity"
 COLDWAR_SYR_great_powers_11_desc:0 "Every repair Syria can perform at home reduces the practical leverage of distant suppliers. Strengthening domestic workshops can improve industrial output and resilience, while the state must maintain the technical administration and procurement arrangements needed to keep foreign equipment serviceable with Syrian skills."
 COLDWAR_SYR_great_powers_11_resume:0 "Carry Out: Domestic Repair Capacity"
 COLDWAR_SYR_great_powers_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_12:0 "Reassess Obligations"
 COLDWAR_SYR_great_powers_12_desc:0 "Aid agreements and commercial contracts can accumulate obligations that no ministry sees in full. Reviewing those commitments can improve financial oversight and revenue discipline, while requiring administrators prepared to question arrangements whose political patrons would prefer them to remain beyond scrutiny."
 COLDWAR_SYR_great_powers_12_resume:0 "Carry Out: Reassess Foreign Obligations"
 COLDWAR_SYR_great_powers_12_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_13:0 "Friendship Proposal"
 COLDWAR_SYR_great_powers_13_desc:0 "A friendship treaty would make the strategic relationship more explicit and expose both parties' expectations to negotiation. Damascus can put forward its terms, but a lasting agreement requires the prospective partner's consent and a careful reckoning of obligations which Syrian enthusiasm alone cannot fulfil. A treaty secretariat consolidates the cabinet's diplomatic brief and costs money to maintain. Its competence belongs to Syria; a foreign friendship treaty is granted only after the recipient's consent."
 COLDWAR_SYR_great_powers_13_resume:0 "Carry Out: A Friendship Treaty Proposal"
 COLDWAR_SYR_great_powers_13_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_14:0 "Practical Neutralism"
 COLDWAR_SYR_great_powers_14_desc:0 "Practical neutralism seeks useful relations without allowing any outside patron to dictate Syria's entire foreign policy. That independence can strengthen political authority at home, although keeping potential sponsors at a distance may leave development projects with fewer convenient sources of investment."
 COLDWAR_SYR_great_powers_14_resume:0 "Carry Out: Practical Neutralism"
 COLDWAR_SYR_great_powers_14_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_great_powers_15:0 "Aid Subordination"
 COLDWAR_SYR_great_powers_15_desc:0 "Foreign aid should leave Syria more capable of making its own decisions after the advisers return home. Consolidating agreements around that principle can strengthen confidence in national policy, while a professional administration must continue examining the costs, conditions and influence attached to every offer."
 COLDWAR_SYR_great_powers_15_resume:0 "Carry Out: Aid without Automatic Subordination"
 COLDWAR_SYR_great_powers_15_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_entry:0 "Regional Review"
 COLDWAR_SYR_arab_world_entry_desc:0 "Arab solidarity remains a powerful ideal, yet Syria faces rival governments, competing leadership claims and the legacy of failed union. A diplomatic review must distinguish partners willing to undertake real cooperation from relationships sustained mainly by declarations whose practical meaning no one has agreed. Coordinating the regional diplomatic brief strengthens government policy capacity while expanding diplomatic administration."
 COLDWAR_SYR_arab_world_entry_resume:0 "Carry Out: A Regional Diplomatic Review"
 COLDWAR_SYR_arab_world_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_01:0 "Reconcile with Cairo"
 COLDWAR_SYR_arab_world_01_desc:0 "Relations with Cairo carry both the memory of union and the bitter disputes that followed its collapse. Reconciliation can strengthen Syria's regional position, but steady cooperation requires officials willing to resolve practical differences instead of expecting shared slogans to repair years of mutual suspicion."
 COLDWAR_SYR_arab_world_01_resume:0 "Carry Out: Reconcile with Cairo"
 COLDWAR_SYR_arab_world_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_02:0 "Autonomous Centre"
 COLDWAR_SYR_arab_world_02_desc:0 "Damascus can seek an independent Arab role without placing its diplomacy beneath Cairo's leadership. That course gives national policy a clearer voice, although a government determined to bargain on its own terms may find regional investment and patronage less readily available."
 COLDWAR_SYR_arab_world_02_resume:0 "Carry Out: An Independent Arab Centre"
 COLDWAR_SYR_arab_world_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_03:0 "Joint Commission"
 COLDWAR_SYR_arab_world_03_desc:0 "A joint diplomatic commission can give cooperation with Arab partners a regular working channel. Resolving differences through an institution may strengthen confidence in the relationship, while meetings, liaison staff and negotiated procedures impose administrative costs which occasional summit declarations conveniently avoid."
 COLDWAR_SYR_arab_world_03_resume:0 "Carry Out: A Joint Diplomatic Commission"
 COLDWAR_SYR_arab_world_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_04:0 "Build Partnerships"
 COLDWAR_SYR_arab_world_04_desc:0 "Bilateral relationships allow Syria to pursue useful agreements without waiting for every Arab government to accept the same programme. Building those partnerships can improve diplomatic capacity, but each relationship adds files, negotiators and obligations to a foreign service already managing sharp regional rivalries."
 COLDWAR_SYR_arab_world_04_resume:0 "Carry Out: Build Bilateral Partnerships"
 COLDWAR_SYR_arab_world_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_05:0 "Regional Agenda"
 COLDWAR_SYR_arab_world_05_desc:0 "A regional agenda should identify where cooperation can deliver something tangible in trade, development or security. Turning common interests into a sustained programme will strengthen political coordination, while requiring the administrative effort to follow negotiations after the public declarations have been made."
 COLDWAR_SYR_arab_world_05_resume:0 "Carry Out: A Regional Cooperation Agenda"
 COLDWAR_SYR_arab_world_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_06:0 "Pipeline Bargain Iraq"
 COLDWAR_SYR_arab_world_06_desc:0 "Iraqi oil moving through Syrian territory creates a practical interest that party rivalry has repeatedly endangered. A pipeline bargain must define access, payments and operating responsibilities to both governments' satisfaction; Damascus can open negotiations, but it cannot make Baghdad accept a commercially or politically unacceptable settlement. Reviewing Syrian transit accounts and customs records modestly improves domestic revenue collection while requiring auditors. Iraqi transit payments begin only under an accepted operating contract."
 COLDWAR_SYR_arab_world_06_resume:0 "Carry Out: A Pipeline Bargain with Iraq"
 COLDWAR_SYR_arab_world_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_07:0 "Gulf Growth Finance"
 COLDWAR_SYR_arab_world_07_desc:0 "Gulf finance could help Syria undertake development beyond the immediate reach of its treasury. Preparing a credible proposal gives potential partners something concrete to consider, while leaving them free to judge whether the project, its funding and the relationship justify a commitment of their own resources. Preparing credible appraisals reduces the overhead of receiving investment, but the proposal office must be maintained. No Gulf money or project is supplied before a partner approves and funds it."
 COLDWAR_SYR_arab_world_07_resume:0 "Carry Out: Gulf Development Finance"
 COLDWAR_SYR_arab_world_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_08:0 "Jordanian Border Talks"
 COLDWAR_SYR_arab_world_08_desc:0 "The Jordanian frontier brings trade, security and Palestinian politics into close contact. Opening serious border talks can improve Syria's ability to manage those issues, but patient negotiation and liaison are necessary where each government suspects that the other's local arrangements may conceal wider ambitions."
 COLDWAR_SYR_arab_world_08_resume:0 "Carry Out: Jordanian Border Talks"
 COLDWAR_SYR_arab_world_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_09:0 "Pipeline Agreement"
 COLDWAR_SYR_arab_world_09_desc:0 "A pipeline understanding must become an operating agreement before either side can depend on the route. Technical responsibilities and financial terms require continuing consent from Syria and Iraq, ensuring that infrastructure serves an accepted bargain rather than a unilateral claim upon the other's resources. Domestic routing and fuel-distribution procedures reduce avoidable supply losses while increasing technical administration. The pipeline's actual operation, foreign consent and transit revenue remain governed by the separate agreement."
 COLDWAR_SYR_arab_world_09_resume:0 "Carry Out: Pipeline Operating Agreement"
 COLDWAR_SYR_arab_world_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_10:0 "A Funded Gulf Project"
 COLDWAR_SYR_arab_world_10_desc:0 "A funded Gulf project should connect a Syrian development priority with a partner prepared to support it. Completing the agreement requires an accepted proposal and an honest account of each side's contribution, so that promised assistance becomes a commitment rather than money Damascus merely expects to receive. A domestic project-supervision office improves the handling of infrastructure works at a continuing administrative cost. Its expertise provides no foreign grant or free building before the donor contract is funded."
 COLDWAR_SYR_arab_world_10_resume:0 "Carry Out: A Funded Gulf Project"
 COLDWAR_SYR_arab_world_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_11:0 "Border Commission"
 COLDWAR_SYR_arab_world_11_desc:0 "A border liaison commission can handle incidents before they become another regional confrontation. Regular contacts may strengthen confidence and reduce uncertainty, but the arrangement needs funded officials and procedures which both sides are willing to use when political tempers are less favourable."
 COLDWAR_SYR_arab_world_11_resume:0 "Carry Out: A Border Liaison Commission"
 COLDWAR_SYR_arab_world_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_12:0 "Manage Rivalries"
 COLDWAR_SYR_arab_world_12_desc:0 "Syria cannot afford to turn every dispute among Arab governments into an unconditional test of loyalty. Managing rivalries selectively can preserve political flexibility, although partners asked to accept that independence may be less willing to offer the investment terms they reserve for closer clients."
 COLDWAR_SYR_arab_world_12_resume:0 "Carry Out: Manage Inter-Arab Rivalries"
 COLDWAR_SYR_arab_world_12_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_13:0 "Offer Federal Treaties"
 COLDWAR_SYR_arab_world_13_desc:0 "Federal cooperation promises institutions capable of carrying Arab unity beyond rhetoric. An offer must make clear what authority would be shared and what each government would retain; the project can advance only through the partners' acceptance, not a Syrian decree announcing agreement on their behalf. A joint-policy proposals unit improves Syrian interministerial coordination while adding clerical expenditure. No foreign government is bound, integrated or annexed by preparing the offer."
 COLDWAR_SYR_arab_world_13_resume:0 "Carry Out: Offer Federal Cooperation"
 COLDWAR_SYR_arab_world_13_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_14:0 "Sovereign Treaties"
 COLDWAR_SYR_arab_world_14_desc:0 "Treaties can secure practical Arab cooperation while leaving national governments responsible for their own decisions. Choosing that approach strengthens Syria's political coordination without dissolving its sovereignty, although a web of separate commitments demands persistent administrative work and offers fewer shortcuts than the language of immediate unity."
 COLDWAR_SYR_arab_world_14_resume:0 "Carry Out: Sovereign Treaty Cooperation"
 COLDWAR_SYR_arab_world_14_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_arab_world_15:0 "Arab Policy Duties"
 COLDWAR_SYR_arab_world_15_desc:0 "An Arab policy gains substance when its commitments are understood, funded and honoured. Consolidating the agreements Syria can sustain will strengthen confidence in its diplomacy, while requiring officials to manage real obligations rather than allowing regional policy to drift between incompatible promises."
 COLDWAR_SYR_arab_world_15_resume:0 "Carry Out: An Arab Policy with Commitments"
 COLDWAR_SYR_arab_world_15_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_entry:0 "The Unfinished Conflict"
 COLDWAR_SYR_levant_entry_desc:0 "The Golan remains under Israeli occupation, families displaced by war face an uncertain future and armed conflict continues to shape Syrian decisions. Reviewing the Levant's linked disputes must connect military aims with civilian obligations and the limits of what Damascus can achieve without other governments' agreement. A frontier readiness review improves defensive routines; patrols and field preparation consume additional supplies."
 COLDWAR_SYR_levant_entry_resume:0 "Carry Out: The Unfinished Conflict"
 COLDWAR_SYR_levant_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_01:0 "Negotiated Strategy"
 COLDWAR_SYR_levant_01_desc:0 "Negotiation offers a route toward recovering security on the Golan without assuming that another war will settle everything. Pursuing it can sharpen Syria's diplomatic position, but talks need a sustained administrative effort and a government prepared to defend bargaining against accusations that patience amounts to surrender."
 COLDWAR_SYR_levant_01_resume:0 "Carry Out: A Negotiated Golan Strategy"
 COLDWAR_SYR_levant_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_02:0 "Prepare a Limited War"
 COLDWAR_SYR_levant_02_desc:0 "A limited campaign aims to change the military position on the occupied Golan and strengthen Syria's bargaining hand. It requires real operational preparation and additional supplies; during the existing conflict it directs that effort, while a later return to peace leaves the question of renewed war to an explicit decision."
 COLDWAR_SYR_levant_02_resume:0 "Carry Out: Prepare a Limited War"
 COLDWAR_SYR_levant_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_03:0 "Negotiate Terms"
 COLDWAR_SYR_levant_03_desc:0 "Disengagement terms must address positions, practical security and what each side is prepared to accept. A negotiated arrangement could strengthen confidence at home, but Syria needs officials capable of sustaining difficult talks and cannot mistake a proposal from Damascus for an agreement already binding its opponents."
 COLDWAR_SYR_levant_03_resume:0 "Carry Out: Negotiate Disengagement Terms"
 COLDWAR_SYR_levant_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_04:0 "Joint by Agreement"
 COLDWAR_SYR_levant_04_desc:0 "Joint planning can make allied military action more coherent, provided the participating governments agree on the purpose and their responsibilities. Better organized Syrian formations would benefit from that work, while coordination also limits the freedom to change policy without consulting those expected to fight alongside them."
 COLDWAR_SYR_levant_04_resume:0 "Carry Out: Joint Planning by Agreement"
 COLDWAR_SYR_levant_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_05:0 "Deliberate Policy"
 COLDWAR_SYR_levant_05_desc:0 "Security policy should connect defensive preparations to political aims the country can sustain. Strengthening those defences can protect Syria against another sudden reversal, but military construction consumes resources that would otherwise serve civilian development and cannot substitute for a clear account of what force is meant to achieve."
 COLDWAR_SYR_levant_05_resume:0 "Carry Out: A Deliberate Security Policy"
 COLDWAR_SYR_levant_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_06:0 "Palestinian Institutes"
 COLDWAR_SYR_levant_06_desc:0 "Palestinian communities need schools, services and institutions as well as statements of solidarity. Supporting civilian life can strengthen social confidence, while committing Syria to welfare expenditure and a more demanding relationship with organizations whose political ambitions may extend beyond the services being provided."
 COLDWAR_SYR_levant_06_resume:0 "Carry Out: Palestinian Civil Institutions"
 COLDWAR_SYR_levant_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_07:0 "Lebanese Mediation"
 COLDWAR_SYR_levant_07_desc:0 "Lebanon's political tensions carry consequences for its neighbours, but influence does not guarantee control. Mediation can give Syria a useful diplomatic role, provided it funds patient contacts and takes Lebanese parties' interests seriously instead of assuming that a Syrian proposal settles their disagreements."
 COLDWAR_SYR_levant_07_resume:0 "Carry Out: Lebanese Mediation"
 COLDWAR_SYR_levant_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_08:0 "Care Displaced Families"
 COLDWAR_SYR_levant_08_desc:0 "Families displaced by conflict cannot build stable lives around temporary promises indefinitely. Improving services and accommodation can support reconstruction and confidence, while the treasury accepts continuing social responsibilities toward people whose return home may depend on a settlement Syria cannot deliver alone."
 COLDWAR_SYR_levant_08_resume:0 "Carry Out: Care for Displaced Families"
 COLDWAR_SYR_levant_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_09:0 "Regulate Armed Groups"
 COLDWAR_SYR_levant_09_desc:0 "Armed organizations cannot operate indefinitely beyond agreed public rules without drawing Syria into disputes it has not chosen. Regulation can strengthen confidence in the state's authority, but monitoring and enforcement require administrators capable of distinguishing lawful political activity from military action with consequences for everyone."
 COLDWAR_SYR_levant_09_resume:0 "Carry Out: Regulate Armed Organizations"
 COLDWAR_SYR_levant_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_10:0 "Lebanese Security Offer"
 COLDWAR_SYR_levant_10_desc:0 "A security offer to Lebanon must state what assistance Syria proposes and what the Lebanese authorities are willing to accept. Opening that negotiation creates a diplomatic possibility, while leaving the recipient responsible for deciding whether the terms serve its own security and sovereignty. A permanent security-liaison cadre develops logistics procedures but needs military salaries. Lebanon receives no imposed mission: deployment and temporary mission benefits still require an invitation, authorization and funding."
 COLDWAR_SYR_levant_10_resume:0 "Carry Out: A Lebanese Security Offer"
 COLDWAR_SYR_levant_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_11:0 "Rebuild Communities"
 COLDWAR_SYR_levant_11_desc:0 "Rebuilding displaced communities requires roads, services and opportunities to earn a living, alongside shelter. Coordinating that work can make reconstruction more effective, but it also creates lasting social obligations which the government must support while the political causes of displacement remain unresolved."
 COLDWAR_SYR_levant_11_resume:0 "Carry Out: Rebuild Displaced Communities"
 COLDWAR_SYR_levant_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_12:0 "Review Regional Duties"
 COLDWAR_SYR_levant_12_desc:0 "Regional commitments can draw money and personnel away from domestic needs without a clear reckoning of the return. Reviewing those obligations can improve financial discipline, while the administration must establish which arrangements serve Syria's interests and which persist mainly because influential sponsors defend them."
 COLDWAR_SYR_levant_12_resume:0 "Carry Out: Review Regional Commitments"
 COLDWAR_SYR_levant_12_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_13:0 "Conditional Involvement"
 COLDWAR_SYR_levant_13_desc:0 "Military involvement beyond Syria's borders should follow an explicit mandate and a willing counterpart, with responsibilities understood before troops become entangled. Conditional cooperation leaves room for an agreed role, while making clear that a Syrian decision alone cannot authorize intervention on another government's behalf. Training a designated liaison and planning cadre clarifies command responsibilities while raising personnel expenditure. This Syrian readiness measure creates neither foreign access nor a deployment without the recipient's consent."
 COLDWAR_SYR_levant_13_resume:0 "Carry Out: Conditional Military Involvement"
 COLDWAR_SYR_levant_13_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_14:0 "Keep outside Lebanon"
 COLDWAR_SYR_levant_14_desc:0 "Keeping Syrian forces outside Lebanon preserves freedom from military commitments whose end may be difficult to define. It can strengthen political independence, although foregoing a direct security role also means accepting less leverage and potentially less favourable access to partners seeking firmer commitments."
 COLDWAR_SYR_levant_14_resume:0 "Carry Out: Keep Forces outside Lebanon"
 COLDWAR_SYR_levant_14_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_levant_15:0 "Sustainable Policy"
 COLDWAR_SYR_levant_15_desc:0 "A sustainable Levant policy must join military security, diplomacy and responsibility toward civilians within commitments Syria can honour. Consolidating that balance can strengthen confidence in the state's direction, while its administration remains responsible for managing agreements and obligations through the next regional crisis."
 COLDWAR_SYR_levant_15_resume:0 "Carry Out: A Sustainable Levant Policy"
 COLDWAR_SYR_levant_15_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_military_council:0 "§Y$COLDWAR_SYR_party_22$§! leads the government."
 COLDWAR_SYR_military_council_entry:0 "Provisional Council"
 COLDWAR_SYR_military_council_entry_desc:0 "A provisional military council claims that the armed forces can restore order where civilian politics has failed. Its first duty is to establish a reliable chain of command without turning every ministry into another headquarters. Officers must decide whether their intervention prepares a workable civilian settlement or becomes an indefinite claim to govern."
 COLDWAR_SYR_military_council_entry_resume:0 "Carry Out: A Provisional Military Council"
 COLDWAR_SYR_military_council_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_military_council_01:0 "Announce Timetable"
 COLDWAR_SYR_military_council_01_desc:0 "A public timetable for civilian government can reassure citizens that the council's emergency authority has a defined purpose. Credibility will depend on practical preparation and agreement with prospective civilian partners. Officers must accept that the transition will reduce their freedom of action and may produce a cabinet whose decisions they dislike."
 COLDWAR_SYR_military_council_01_resume:0 "Carry Out: Announce a Civilian Timetable"
 COLDWAR_SYR_military_council_01_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_military_council_02:0 "Indefinite Mandate"
 COLDWAR_SYR_military_council_02_desc:0 "An indefinite emergency mandate would free the council from negotiating an immediate transfer of authority. The officers could pursue their priorities through a more concentrated command. Continued military supervision also narrows civilian and intellectual independence, making the state less able to hear evidence that questions the leadership's judgement or its justification for remaining in office."
 COLDWAR_SYR_military_council_02_resume:0 "Carry Out: An Indefinite Emergency Mandate"
 COLDWAR_SYR_military_council_02_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_military_council_03:0 "Return Civilians"
 COLDWAR_SYR_military_council_03_desc:0 "Civilian ministers can bring professional knowledge back into departments whose work has become entangled with military supervision. Returning responsibility to them would make the council's provisional claim more credible. Officers must allow real discretion, accepting that competent civilian administration cannot function if every difficult decision still waits for approval from the barracks."
 COLDWAR_SYR_military_council_03_resume:0 "Carry Out: Return Ministries to Civilians"
 COLDWAR_SYR_military_council_03_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_military_council_04:0 "Military Ministries"
 COLDWAR_SYR_military_council_04_desc:0 "Military supervisors in the ministries would give the council closer oversight of appointments, spending and implementation. Supporters expect firmer direction from officials accustomed to command. The arrangement requires additional administration and risks making specialist departments answer to officers whose authority exceeds their knowledge of the services they now supervise."
 COLDWAR_SYR_military_council_04_resume:0 "Carry Out: Military Supervisors in Ministries"
 COLDWAR_SYR_military_council_04_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_military_council_05:0 "Regularize Budget"
 COLDWAR_SYR_military_council_05_desc:0 "A regular defence budget should make the armed forces' obligations visible rather than leave them scattered among exceptional accounts. Better records can improve the state's grasp of revenue and commitments. Establishing oversight requires trained staff and access, including the willingness to question spending associated with influential members of the council itself."
 COLDWAR_SYR_military_council_05_resume:0 "Carry Out: Regularize the Defence Budget"
 COLDWAR_SYR_military_council_05_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_military_council_06:0 "Merit Officer Promotion"
 COLDWAR_SYR_military_council_06_desc:0 "Merit in promotion would strengthen an army whose careers have too often reflected political allegiance. Clear standards can rebuild confidence in professional command. The council must curb recruitment and advancement through personal networks, accepting that competent officers will not always belong to the circles most dependable in an internal political contest."
 COLDWAR_SYR_military_council_06_resume:0 "Carry Out: Merit in Officer Promotion"
 COLDWAR_SYR_military_council_06_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_military_council_07:0 "A Paid Reserve System"
 COLDWAR_SYR_military_council_07_desc:0 "A paid reserve system can make call-ups and sustainment more predictable without relying entirely on improvised mobilization. Reservists need clear obligations, records and an administration able to support them. The resulting burden is real, but orderly preparation is more useful than a large paper reserve whose availability is discovered only when a crisis begins."
 COLDWAR_SYR_military_council_07_resume:0 "Carry Out: A Paid Reserve System"
 COLDWAR_SYR_military_council_07_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_military_council_08:0 "Audit Procurement"
 COLDWAR_SYR_military_council_08_desc:0 "Military procurement must be examined as public expenditure rather than protected from scrutiny by claims of urgency. Reliable accounts can reveal where obligations and available funds diverge. Auditing contracts requires specialist staff and political backing, especially when suppliers or intermediaries have established relationships with officers now serving on the governing council."
 COLDWAR_SYR_military_council_08_resume:0 "Carry Out: Audit Military Procurement"
 COLDWAR_SYR_military_council_08_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_military_council_09:0 "Civic Civilian Transfer"
 COLDWAR_SYR_military_council_09_desc:0 "A constitutional transfer should specify which civilian institutions receive authority and how the armed forces will relate to them afterward. An announced departure is insufficient without workable procedures. Officers and civilians must build an administration capable of carrying the agreement, accepting restraints that make the settlement more durable than another temporary bargain."
 COLDWAR_SYR_military_council_09_resume:0 "Carry Out: Constitutional Civilian Transfer"
 COLDWAR_SYR_military_council_09_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_military_council_10:0 "Institutional Presidency"
 COLDWAR_SYR_military_council_10_desc:0 "An institutional military presidency would give the council a recognizable executive destination while retaining armed authority at the centre. It may reassure officials seeking continuity. The arrangement also leaves civilian expertise constrained by military political priorities, and makes open examination of the government's choices harder wherever criticism can be interpreted as a challenge to command."
 COLDWAR_SYR_military_council_10_resume:0 "Carry Out: Institutional Military Presidency"
 COLDWAR_SYR_military_council_10_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_military_council_11:0 "Defined Chain Authority"
 COLDWAR_SYR_military_council_11_desc:0 "A defined chain of authority must establish who directs ministers, commanders and public offices once the immediate emergency has passed. Predictability can reduce the uncertainty that invites rival interventions. Maintaining it requires an agreement among institutions and communities, since even a clear order will remain fragile if those expected to follow it reject the settlement beneath it."
 COLDWAR_SYR_military_council_11_resume:0 "Carry Out: A Defined Chain of Authority"
 COLDWAR_SYR_military_council_11_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_eligibility_limited_war:0 "The government has chosen preparations for a limited Golan campaign."
 COLDWAR_SYR_limited_war_entry:0 "Golan Operations Staff"
 COLDWAR_SYR_limited_war_entry_desc:0 "A campaign on the Golan needs a staff able to connect political aims with ground that can actually be held and supplied. Convening the war cabinet will bring operations and financing into the same discussion, leaving authorization to a deliberate government decision."
 COLDWAR_SYR_limited_war_entry_resume:0 "Carry Out: The Golan Operations Staff"
 COLDWAR_SYR_limited_war_entry_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_limited_war_staff:0 "Skilled Planning"
 COLDWAR_SYR_limited_war_staff_desc:0 "Operational plans must survive contact with uncertain reports, broken communications and a determined opponent. Developing a professional planning staff can improve the army's organization, while the concentration on competent formations imposes limits on how rapidly additional manpower can be absorbed without weakening those standards."
 COLDWAR_SYR_limited_war_staff_resume:0 "Carry Out: Professional Operational Planning"
 COLDWAR_SYR_limited_war_staff_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_limited_war_reserves:0 "Prepare Districts"
 COLDWAR_SYR_limited_war_reserves_desc:0 "Reserve districts must know which men to call, where to assemble them and how their units will be equipped. Improving those arrangements broadens the manpower available for operations, but removing workers from civilian production carries an economic cost even before the fighting intensifies."
 COLDWAR_SYR_limited_war_reserves_resume:0 "Carry Out: Prepare the Reserve Districts"
 COLDWAR_SYR_limited_war_reserves_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_limited_war_signals:0 "Secure Network"
 COLDWAR_SYR_limited_war_signals_desc:0 "A plan cannot guide the front when orders arrive late or reports disappear between headquarters. Securing the command network can improve the army's preparation, while communications staff, equipment supervision and disciplined procedures add to the permanent administrative burden of conducting a campaign."
 COLDWAR_SYR_limited_war_signals_resume:0 "Carry Out: Secure the Command Network"
 COLDWAR_SYR_limited_war_signals_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_limited_war_depots:0 "Disperse Depots"
 COLDWAR_SYR_limited_war_depots_desc:0 "Forward depots should support an advance without presenting an opponent with a few obvious targets. Dispersing stores and improving distribution can reduce supply waste, but the resulting network demands more careful administration, transport coordination and accountability than a handful of large, convenient warehouses."
 COLDWAR_SYR_limited_war_depots_resume:0 "Carry Out: Disperse the Forward Depots"
 COLDWAR_SYR_limited_war_depots_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_operations_funded_eligibility_tt:0 "The Golan operations budget has been funded and remains valid."
 COLDWAR_SYR_limited_war_appropriation:0 "Funded Mandate"
 COLDWAR_SYR_limited_war_appropriation_desc:0 "The war cabinet must decide whether the prepared campaign justifies committing the resources already appropriated for it. A funded plan makes authorization possible without treating every operational demand as an emergency, but ministers retain responsibility for choosing whether those preparations should now become an active military mandate."
 COLDWAR_SYR_limited_war_appropriation_resume:0 "Carry Out: A Funded Operational Mandate"
 COLDWAR_SYR_limited_war_appropriation_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_limited_war_artillery:0 "Reconnaissance"
 COLDWAR_SYR_limited_war_artillery_desc:0 "Artillery plans require observation accurate enough to distinguish an opportunity from a costly illusion. Closer reconnaissance and fire coordination can speed preparation, while more active batteries and the movement of their ammunition increase the supply requirements that operational enthusiasm too easily overlooks."
 COLDWAR_SYR_limited_war_artillery_resume:0 "Carry Out: Artillery and Reconnaissance"
 COLDWAR_SYR_limited_war_artillery_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_limited_war_air_liaison:0 "Army–Air Network"
 COLDWAR_SYR_limited_war_air_liaison_desc:0 "Ground commanders and air units need a shared account of the battlefield before either can support the other reliably. A liaison network can improve air intelligence, while the additional specialists and coordination posts must be paid for alongside the aircraft and formations they serve."
 COLDWAR_SYR_limited_war_air_liaison_resume:0 "Carry Out: An Army–Air Liaison Network"
 COLDWAR_SYR_limited_war_air_liaison_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_limited_war_sustainment:0 "Sustain Echelons"
 COLDWAR_SYR_limited_war_sustainment_desc:0 "Forward echelons need fuel delivered efficiently enough to remain useful after their first movement. Better servicing and distribution can reduce army fuel consumption, while the trained personnel sustaining that system create a continuing cost which must accompany any claim to greater operational endurance."
 COLDWAR_SYR_limited_war_sustainment_resume:0 "Carry Out: Sustain the Forward Echelons"
 COLDWAR_SYR_limited_war_sustainment_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_limited_war_rehearsals:0 "Rehearsals"
 COLDWAR_SYR_limited_war_rehearsals_desc:0 "Infantry, armour and supporting services must practise the operation together before its weaknesses are revealed under fire. Combined-arms rehearsals can improve organization, but concentrating resources on trained formations restricts the pace at which the army can expand without losing the competence it is trying to build."
 COLDWAR_SYR_limited_war_rehearsals_resume:0 "Carry Out: Combined-Arms Rehearsals"
 COLDWAR_SYR_limited_war_rehearsals_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_army_attack_factor_tt:0 "$MODIFIERS_ARMY_ATTACK_FACTOR$: $RIGHT|+=%1$"
 COLDWAR_SYR_limited_war_rapid:0 "Short Offensive Window"
 COLDWAR_SYR_limited_war_rapid_desc:0 "A short offensive seeks to concentrate force before surprise and favourable conditions disappear. That choice can strengthen the army's attack, while demanding more supplies and accepting the risk that a campaign designed for a brief opportunity may struggle if the opponent holds and the fighting lengthens."
 COLDWAR_SYR_limited_war_rapid_resume:0 "Carry Out: A Short Offensive Window"
 COLDWAR_SYR_limited_war_rapid_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_limited_war_pressure:0 "Sustained Pressure"
 COLDWAR_SYR_limited_war_pressure_desc:0 "Sustained pressure places greater weight on organization, defensive staying power and the ability to keep formations in the field. It avoids making everything depend on a single short opportunity, but the larger continuing personnel burden will follow the treasury for as long as the posture is maintained."
 COLDWAR_SYR_limited_war_pressure_resume:0 "Carry Out: Sustained Military Pressure"
 COLDWAR_SYR_limited_war_pressure_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_limited_war_review:0 "Review the War Aims"
 COLDWAR_SYR_limited_war_review_desc:0 "Military activity must remain answerable to the aims for which it was authorized. Reviewing the campaign lets the government consider continued operations, a negotiated pause or demobilization, while recognizing that an agreed settlement requires the other belligerents' consent as well as Syria's own willingness."
 COLDWAR_SYR_limited_war_review_resume:0 "Carry Out: Review the War Aims"
 COLDWAR_SYR_limited_war_review_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_campaign_review_completed_eligibility_tt:0 "The cabinet has completed its review of the campaign."
 COLDWAR_SYR_limited_war_lessons:0 "Lessons Golan Campaign"
 COLDWAR_SYR_limited_war_lessons_desc:0 "The campaign should leave Syria with a more capable army rather than only disputed claims of success. Examining command, logistics and training can improve organization for the future, while preserving the standards of a professional force instead of assuming that experience alone justifies indiscriminate expansion."
 COLDWAR_SYR_limited_war_lessons_resume:0 "Carry Out: Lessons of the Golan Campaign"
 COLDWAR_SYR_limited_war_lessons_resume_desc:0 "The cabinet has agreed to this programme. Carry out the work when political authority and access permit. Its full cost is charged to the national budget and may be financed through borrowing."
 COLDWAR_SYR_programme_scope_tt:0 "§YGoverning programme:§! Its benefits and expenses apply while this party, leadership or coalition holds authority. Agreed policies can resume if it returns to office."
