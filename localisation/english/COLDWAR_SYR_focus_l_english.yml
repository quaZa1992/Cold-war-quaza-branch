 COLDWAR_SYR_limited_war_programme:0 "The Golan Campaign: Programme"
 COLDWAR_SYR_limited_war_programme_desc:0 "Earned policy measures. Durable national programme."
 COLDWAR_SYR_divided_command:0 "Divided Ba’ath Command"
 COLDWAR_SYR_divided_command_desc:0 "Nureddin al-Atassi holds the presidency, Salah Jadid dominates the party apparatus and Hafez al-Assad commands the Defence Ministry. Their competing sources of authority obstruct coherent government and weaken military organization. A real settlement between civilian institutions, the party and the officer corps is needed to end the divided command."
 COLDWAR_SYR_emergency_state:0 "The Permanent Emergency"
 COLDWAR_SYR_emergency_state_desc:0 "Emergency rule has endured since the Ba'ath seized power in 1963. Exceptional powers help the authorities preserve order, but restrict public debate and leave political initiative concentrated in institutions suspicious of independent thought. Constitutional change must resolve those restrictions if the republic is to move beyond a permanent state of exception."
 COLDWAR_SYR_legacy_1967:0 "The Defeat of 1967"
 COLDWAR_SYR_legacy_1967_desc:0 "The defeat of 1967 exposed grave weaknesses in command and left the Golan under Israeli occupation. Anger sustains the determination to confront Israel, while the army carries the institutional damage of its collapse. Military reform can repair organization; recovering territory remains a separate political and military question."
 COLDWAR_SYR_uneven_services:0 "Uneven Development and Skilled-Labour Shortages"
 COLDWAR_SYR_uneven_services_desc:0 "National development has reached Syria's cities and countryside unevenly. Shortages of technical skills limit the use of new knowledge, while incomplete networks and services slow construction. Education and dependable infrastructure must each address their own part of a weakness which no single public project can remove."
 COLDWAR_SYR_state_sector_strain:0 "Agrarian Transformation and State-Sector Strain"
 COLDWAR_SYR_state_sector_strain_desc:0 "Land reform and nationalization have transformed ownership and widened the state's responsibilities. Their social promise is burdened by confused administration, weak enterprise coordination and rural institutions unable to meet every demand. Productive agrarian arrangements and professional economic administration are both needed to make the transformation sustainable."
 COLDWAR_SYR_rain_sensitive_farms:0 "Rainfall-Sensitive Agriculture"
 COLDWAR_SYR_rain_sensitive_farms_desc:0 "Much of Syrian agriculture still depends on uncertain rainfall. The unfinished Euphrates works offer the prospect of more reliable water, but a dam cannot irrigate fields by itself. Working distribution, drainage and protection against salinity must follow if rural livelihoods are to become less vulnerable to the weather."
 COLDWAR_SYR_citizenship_exclusion:0 "The Unresolved Citizenship Census"
 COLDWAR_SYR_citizenship_exclusion_desc:0 "The exceptional census of 1962 left many Kurdish families in the northeast without recognized citizenship. Exclusion from ordinary rights and public institutions has produced a lasting grievance between communities and the state. A credible appeals process and completed review are necessary to turn assurances of equal citizenship into everyday reality."
