l_english:
# IMPERIA CW — Cold War: USA 1970 policy decisions — English localisation.
 USA_1970_vietnam_policy_category:0 "The Burden of Vietnam"
 USA_1970_vietnam_policy_category_desc:0 "Strategic reviews can reshape the political conduct of the war, but the crushing military bill remains until a credible peace permits a postwar force transition."
 USA_1970_drug_policy_category:0 "Federal Drug Policy"
 USA_1970_drug_policy_category_desc:0 "Choose an enforcement, treatment, or reform doctrine and then fund the institutions needed to sustain it."
 USA_1970_economic_policy_category:0 "Industrial and Federal Programmes"
 USA_1970_economic_policy_category_desc:0 "Long implementation programmes trade growth and employment for taxes, regulation, federal spending, and factional resistance."
 USA_1970_energy_security_category:0 "American Energy Security"
 USA_1970_energy_security_category_desc:0 "Conservation, extraction, nuclear regulation, reserves, and grid policy each solve a different vulnerability at a different price."
 USA_1970_intelligence_policy_category:0 "Intelligence, Law, and Oversight"
 USA_1970_intelligence_policy_category_desc:0 "Rebuild legitimacy through oversight or preserve covert reach at the cost of trust and constitutional restraint. Nixon's campaign-intelligence choices can also create, or avoid, a later Watergate exposure."
 USA_1970_intervention_policy_category:0 "Global Posture and Intervention"
 USA_1970_intervention_policy_category_desc:0 "Set constitutional intervention rules, fund expeditionary capacity, and decide which partnerships receive American resources."
 USA_1970_vietnam_burden:0 "The Burden of Vietnam"
 USA_1970_vietnam_burden_desc:0 "A continuing war consumes political legitimacy and military effectiveness. Strategy can reshape this political-operational burden, but it cannot reduce the locked wartime military bill or automatically end the conflict."
 USA_1970_vietnam_military_overextension:0 "Vietnam-Era Military Overextension"
 USA_1970_vietnam_military_overextension_desc:0 "Vietnam has locked the United States into emergency appropriations, overseas rotations, equipment replacement, and a sprawling supply system. The spirit adds +60% general personnel cost, a further +150% Army personnel cost, +60% equipment cost, +50% supply consumption, +10% consumer-goods factories, and +15% Army training time. No wartime strategy can reduce it. Only a verified end to the Vietnam conflict opens a long, three-stage drawdown, and renewed American war restores the full burden."
 USA_1970_drug_crisis:0 "The American Drug Crisis"
 USA_1970_drug_crisis_desc:0 "Drug abuse, fragmented institutions, organized crime, and unequal enforcement impose a persistent social and fiscal burden. Every federal strategy transfers rather than erases part of the cost."
 USA_1970_decision_vietnam_operational_ceiling:0 "Impose an Operational Ceiling"
 USA_1970_decision_vietnam_operational_ceiling_desc:0 "Gain: limits escalation, restores political control, improves stability, and tightens influence defence. Cost: much lower war support, weaker combat power and reach, bureaucracy, Treasury, and defence-industry opposition; the locked wartime military bill does not fall before peace."
 USA_1970_decision_vietnam_conditional_vietnamization:0 "Conditional Vietnamization"
 USA_1970_decision_vietnam_conditional_vietnamization_desc:0 "Gain: preserves advisory influence and creates a political route toward disengagement. Cost: weaker readiness, political drag, federal administration, Treasury spending, and defence-industry resistance; the locked wartime military bill does not fall before peace."
 USA_1970_decision_vietnam_escalatory_leverage:0 "Escalatory Leverage"
 USA_1970_decision_vietnam_escalatory_leverage_desc:0 "Gain: restore war support, attack, air efficiency, decryption, and coercive influence. Cost: severe stability, PP, personnel, supply, bureaucracy, Treasury, and congressional burdens."
 USA_1970_decision_vietnam_war_powers_resolution:0 "Codify the War Powers Resolution"
 USA_1970_decision_vietnam_war_powers_resolution_desc:0 "Gain: PP generation, democratic resilience, stability, and tighter constitutional control. Cost: war support, covert reach, civilian intelligence, bureaucracy, Treasury, and hostility from the intelligence and defence establishments; it cannot cut the locked Vietnam military bill."
 USA_1970_decision_vietnam_security_assistance_model:0 "Build a Security-Assistance Model"
 USA_1970_decision_vietnam_security_assistance_model_desc:0 "Gain: influence, defence exports, and partner capacity without an automatic war ending. Cost: renewed American personnel and administrative bills, weaker influence defence, stability, and Treasury."
 USA_1970_decision_vietnam_cross_border_authority:0 "Authorize Cross-Border Pressure"
 USA_1970_decision_vietnam_cross_border_authority_desc:0 "Gain: air efficiency, coordination, intelligence, influence, and war support. Cost: heavy stability, personnel, oversight, bureaucracy, Treasury, and congressional penalties."
 USA_1970_decision_vietnam_postwar_demobilization:0 "Verify the Vietnam Settlement"
 USA_1970_decision_vietnam_postwar_demobilization_desc:0 "Gain: after an actual end to the Vietnam conflict, removes the political war burden and makes the first major cut to the locked military bill. Cost: a long verification process, veterans' spending, bureaucracy, lower war support, Treasury, Congress, and defence-industry opposition; it never creates peace by script."
 USA_1970_decision_vietnam_overseas_force_drawdown:0 "Draw Down the Overseas Force"
 USA_1970_decision_vietnam_overseas_force_drawdown_desc:0 "Gain: makes the second large reduction to personnel, equipment, supply, training, and civilian-industry costs. Cost: readiness, war support, veterans' programmes, Treasury, Congress, and a severe contraction of the defence-industrial base."
 USA_1970_decision_vietnam_close_emergency_accounts:0 "Close the Vietnam Emergency Accounts"
 USA_1970_decision_vietnam_close_emergency_accounts_desc:0 "Gain: ends the extraordinary Vietnam military-cost spirit and restores the peacetime force budget. Cost: the all-volunteer force, veterans' care, federal administration, lower war support, Treasury, Congress, and defence-industry resistance become permanent fiscal obligations."
 USA_1970_decision_drugs_public_health_framework:0 "Public Health and Decriminalization Framework"
 USA_1970_decision_drugs_public_health_framework_desc:0 "Gain: sharply lower police and health burdens, population recovery, and stability. Cost: weaker drift defence and intelligence, very high welfare and administrative costs, Treasury spending, and lower war support."
 USA_1970_decision_drugs_targeted_interdiction:0 "Targeted Federal Interdiction"
 USA_1970_decision_drugs_targeted_interdiction_desc:0 "Gain: better intelligence, decryption, and focused disruption with less demographic damage. Cost: a large police and bureaucracy bill, persistent PP and stability losses, healthcare costs, and Treasury spending."
 USA_1970_decision_drugs_federal_crackdown:0 "A Punitive Federal Crusade"
 USA_1970_decision_drugs_federal_crackdown_desc:0 "Gain: drift defence, intelligence, war support, and coercive capacity. Cost: crushing PP, population, police, healthcare, bureaucracy, stability, and Treasury penalties."
 USA_1970_decision_drugs_treatment_block_grants:0 "Federal Treatment Block Grants"
 USA_1970_decision_drugs_treatment_block_grants_desc:0 "Gain: population recovery, labour resilience, stability, and more efficient healthcare delivery. Cost: welfare, education, bureaucracy, Treasury, and congressional resistance."
 USA_1970_decision_drugs_sentencing_and_expungement:0 "Sentencing Reform and Expungement"
 USA_1970_decision_drugs_sentencing_and_expungement_desc:0 "Gain: PP, population, stability, and lower police costs. Cost: weaker drift defence and influence, welfare and administrative spending, Treasury, war support, and congressional resistance."
 USA_1970_decision_drugs_follow_the_money:0 "Follow the Money"
 USA_1970_decision_drugs_follow_the_money_desc:0 "Gain: civilian intelligence, decryption, and tax collection. Cost: PP, police and bureaucracy costs, Treasury, Wall Street hostility, and a stronger intelligence establishment."
 USA_1970_decision_drugs_hemispheric_task_forces:0 "Hemispheric Anti-Trafficking Task Forces"
 USA_1970_decision_drugs_hemispheric_task_forces_desc:0 "Gain: offensive influence, influence defence, and export-linked cooperation. Cost: personnel, bureaucracy, Treasury, stability, and congressional resistance; no foreign player is compelled to join."
 USA_1970_decision_drugs_mandatory_minimums:0 "Federal Mandatory Minimums"
 USA_1970_decision_drugs_mandatory_minimums_desc:0 "Gain: drift defence, influence defence, and lower welfare spending. Cost: PP, population, police, health, bureaucracy, stability, and congressional support."
 USA_1970_decision_drugs_militarized_interdiction:0 "Militarized Interdiction"
 USA_1970_decision_drugs_militarized_interdiction_desc:0 "Gain: decryption, influence, reconnaissance, air efficiency, war support, and defence-industry backing. Cost: influence defence, personnel, police, bureaucracy, stability, Treasury, and Congress."
 USA_1970_decision_antitrust_enforcement_drive:0 "Federal Antitrust Enforcement Drive"
 USA_1970_decision_antitrust_enforcement_drive_desc:0 "Gain: tax collection, PP, stability, and market discipline. Cost: output, investment returns, bureaucracy, Treasury, Wall Street, regulation, and major congressional resistance."
 USA_1970_decision_accelerated_depreciation_schedule:0 "Accelerated Depreciation Schedule"
 USA_1970_decision_accelerated_depreciation_schedule_desc:0 "Gain: factory output, construction, investment returns, and Wall Street support. Cost: tax revenue, consumer demand, stability, deregulation risk, and Treasury."
 USA_1970_decision_regional_development_grants:0 "Regional Development Grants"
 USA_1970_decision_regional_development_grants_desc:0 "Gain: civilian construction, extraction, workforce efficiency, employment resilience, and stability. Cost: bureaucracy, welfare, Treasury, Wall Street, and Congress."
 USA_1970_decision_revenue_sharing_industrial_project:0 "Fund an Industrial-State Project"
 USA_1970_decision_revenue_sharing_industrial_project_desc:0 "Gain: Ohio receives a civilian factory and infrastructure, while national civilian construction and employment resilience improve. Cost: Treasury, tax collection, bureaucracy, stability, and congressional resistance. Only one General Revenue Sharing project can be selected."
 USA_1970_decision_revenue_sharing_metropolitan_project:0 "Fund a Metropolitan Office Project"
 USA_1970_decision_revenue_sharing_metropolitan_project_desc:0 "Gain: New York and Illinois receive office parks, with better productivity and office-tax receipts. Cost: Treasury, administrative and education spending, labour demand, stability, and congressional resistance. Only one General Revenue Sharing project can be selected."
 USA_1970_decision_revenue_sharing_rural_project:0 "Fund a Great Plains Agricultural Project"
 USA_1970_decision_revenue_sharing_rural_project_desc:0 "Gain: Kansas and Nebraska receive agricultural districts, improving extraction, exports, and rural population growth. Cost: Treasury, tax collection, bureaucracy, welfare spending, Wall Street support, and Congress. Only one General Revenue Sharing project can be selected."
 USA_1970_decision_information_economy_tax_credits:0 "Information-Economy Tax Credits"
 USA_1970_decision_information_economy_tax_credits_desc:0 "Gain: research, productivity, office workforce efficiency, office tax receipts, and Wall Street. Cost: education, energy, corporate taxes, stability, and Treasury."
 USA_1970_decision_vietnam_defense_conversion_bonds:0 "Postwar Defence-Conversion Bonds"
 USA_1970_decision_vietnam_defense_conversion_bonds_desc:0 "Gain: after a verified end to the Vietnam conflict, civilian construction, workforce efficiency, lower personnel bills, civilian taxes, and stability. Cost: attack, output, military workforce, bureaucracy, war support, Treasury, and defence-industry anger."
 USA_1970_decision_export_import_bank_expansion:0 "Expand the Export-Import Bank"
 USA_1970_decision_export_import_bank_expansion_desc:0 "Gain: export and investment returns, influence, and Wall Street support. Cost: bureaucracy, corporate taxes, influence defence, stability, and Treasury."
 USA_1970_decision_tribal_revenue_sharing_compacts:0 "Tribal Revenue-Sharing Compacts"
 USA_1970_decision_tribal_revenue_sharing_compacts_desc:0 "Gain: extraction, population, democratic legitimacy, and stability. Cost: welfare, administration, corporate tax revenue, Treasury, Wall Street, and Congress."
 USA_1970_decision_energy_conservation_standards:0 "National Conservation Standards"
 USA_1970_decision_energy_conservation_standards_desc:0 "Gain: lower industrial and household energy use, efficiency, and stability. Cost: factory and dockyard output, bureaucracy, Treasury, Wall Street, and Congress."
 USA_1970_decision_energy_domestic_extraction_leases:0 "Domestic Extraction Leases"
 USA_1970_decision_energy_domestic_extraction_leases_desc:0 "Gain: fossil energy, resources, output, investment returns, and Wall Street. Cost: consumption, renewables, stability, administration, influence defence, Treasury, and Congress."
 USA_1970_decision_nuclear_independent_safety_commission:0 "Independent Nuclear Safety Commission"
 USA_1970_decision_nuclear_independent_safety_commission_desc:0 "Gain: research, stability, safer nuclear generation, and public confidence. Cost: slower reactor construction, lower near-term energy, bureaucracy, Treasury, Wall Street, and Congress."
 USA_1970_decision_nuclear_streamlined_licensing:0 "Streamlined Reactor Licensing"
 USA_1970_decision_nuclear_streamlined_licensing_desc:0 "Gain: nuclear output, reactor construction, total energy, and Wall Street support. Cost: stability, bureaucracy, influence defence, consumption, Treasury, and Congress."
 USA_1970_decision_fill_the_strategic_petroleum_reserve:0 "Fill the Strategic Petroleum Reserve"
 USA_1970_decision_fill_the_strategic_petroleum_reserve_desc:0 "Gain: durable energy security, influence defence, and stability. Cost: permanently lower output, greater energy demand, federal administration, Treasury, and long implementation time."
 USA_1970_decision_federal_grid_reliability_standards:0 "Federal Grid Reliability Standards"
 USA_1970_decision_federal_grid_reliability_standards_desc:0 "Gain: energy production, lower consumption, construction capacity, and influence defence. Cost: factory and dockyard output, bureaucracy, Treasury, Wall Street, and Congress."
 USA_1970_decision_church_committee_disclosures:0 "Church Committee Disclosures"
 USA_1970_decision_church_committee_disclosures_desc:0 "Gain: stability, PP, influence defence, and democratic resilience. Cost: civilian intelligence, decryption, covert reach, bureaucracy, and intelligence-community hostility."
 USA_1970_decision_fisa_warrant_framework:0 "Create a FISA Warrant Framework"
 USA_1970_decision_fisa_warrant_framework_desc:0 "Gain: encryption, influence defence, stability, and PP. Cost: civilian intelligence, covert reach, police and bureaucracy costs, Treasury, and intelligence-community resistance."
 USA_1970_decision_preserve_executive_findings:0 "Preserve Executive Findings"
 USA_1970_decision_preserve_executive_findings_desc:0 "Gain: civilian intelligence, decryption, covert influence, PP, and intelligence support. Cost: drift and influence defence, stability, bureaucracy, and congressional resistance."
 USA_1970_decision_expand_clandestine_action_fund:0 "Expand the Clandestine Action Fund"
 USA_1970_decision_expand_clandestine_action_fund_desc:0 "Gain: covert influence, intelligence, decryption, and establishment support. Cost: personnel, bureaucracy, influence defence, stability, Treasury, and Congress."
 USA_1970_decision_reject_operation_gemstone:0 "Reject Operation Gemstone"
 USA_1970_decision_reject_operation_gemstone_desc:0 "Gain: constitutional restraint, stability, democratic resilience, and congressional trust. Cost: weaker campaign intelligence, less covert reach, intelligence-community hostility, Treasury, and the loss of an immediate electoral advantage."
 USA_1970_decision_authorize_political_intelligence:0 "Authorize Political Intelligence Operations"
 USA_1970_decision_authorize_political_intelligence_desc:0 "Gain: Republican campaign support, civilian intelligence, decryption, political power, and intelligence-community backing. Cost: stability, democratic resilience, bureaucracy, Treasury, congressional hostility, and a hidden Watergate exposure that can mature into a constitutional crisis."
 USA_1970_decision_case_by_case_authorizations:0 "Case-by-Case Authorizations"
 USA_1970_decision_case_by_case_authorizations_desc:0 "Gain: PP, influence defence, lower personnel and supply burdens, and stability. Cost: offensive influence, intelligence, bureaucracy, defence-industry support, war support, and flexibility."
 USA_1970_decision_allied_burden_sharing_standard:0 "Allied Burden-Sharing Standard"
 USA_1970_decision_allied_burden_sharing_standard_desc:0 "Gain: lower personnel and supply costs, influence defence, and export returns. Cost: offensive reach, PP, bureaucracy, defence-industry support, stability, Treasury, and alliance dependence."
 USA_1970_decision_standing_presidential_authority:0 "Standing Presidential Authority"
 USA_1970_decision_standing_presidential_authority_desc:0 "Gain: PP, offensive influence, intelligence, coordination, war support, and defence-industry backing. Cost: democratic resilience, influence defence, personnel, bureaucracy, stability, and Congress."
 USA_1970_decision_limited_contingency_capacity:0 "Limited Contingency Capacity"
 USA_1970_decision_limited_contingency_capacity_desc:0 "Gain: coordination, air efficiency, and influence for small deployments. Cost: personnel, supply, bureaucracy, stability, and Treasury; it does not authorize a war by itself."
 USA_1970_decision_major_expeditionary_capacity:0 "Major Expeditionary Capacity"
 USA_1970_decision_major_expeditionary_capacity_desc:0 "Gain: coordination, air and naval readiness, influence, war support, and defence-industry backing. Cost: extreme personnel, supply, bureaucracy, influence-defence, stability, and Treasury burdens."
 USA_1970_decision_alliance_burden_sharing_appropriation:0 "Alliance Burden-Sharing Appropriation"
 USA_1970_decision_alliance_burden_sharing_appropriation_desc:0 "Gain: lower personnel and supply bills, stronger influence defence, exports, and congressional backing. Cost: bureaucracy, Treasury, offensive autonomy, and defence-industry support."
 USA_1970_decision_security_assistance_credit_line:0 "Security-Assistance Credit Line"
 USA_1970_decision_security_assistance_credit_line_desc:0 "Gain: influence, defence exports, air readiness, Wall Street, and defence-industry support. Cost: personnel, bureaucracy, influence defence, stability, Treasury, and Congress."
 USA_1970_decision_middle_east_security_primacy:0 "Security Primacy in the Middle East"
 USA_1970_decision_middle_east_security_primacy_desc:0 "Gain: security exports, investment returns, influence, Wall Street, and defence-industry backing. Cost: personnel, bureaucracy, resource-export obligations, stability, Treasury, and Congress."
 USA_1970_decision_middle_east_honest_broker_fund:0 "Fund an Honest-Broker Posture"
 USA_1970_decision_middle_east_honest_broker_fund_desc:0 "Gain: stability, influence defence, lower personnel costs, and congressional support. Cost: coercive influence, bureaucracy, export returns, Treasury, Wall Street, and defence-industry hostility."
 USA_1970_decision_middle_east_energy_partnerships:0 "Arab Energy and Trade Partnerships"
 USA_1970_decision_middle_east_energy_partnerships_desc:0 "Gain: fossil and total energy, export returns, and Wall Street support. Cost: renewables, influence defence, bureaucracy, export obligations, stability, Treasury, and defence-industry support."
 USA_1970_vietnam_operational_ceiling_profile_tt:0 "Replaces §YThe Burden of Vietnam§! with an operational-ceiling profile: stability §R-4%§!, war support §R-17%§!, PP §R-4%§!, army attack §R-5%§!, air-mission efficiency §R-3%§!. It does not reduce §YVietnam-Era Military Overextension§! before peace."
 USA_1970_vietnamization_profile_tt:0 "Replaces §YThe Burden of Vietnam§! with a Vietnamization profile: stability §R-5%§!, war support §R-10%§!, PP §R-7%§!, army attack §R-3%§!, air-mission efficiency §R-2%§!. It does not reduce §YVietnam-Era Military Overextension§! before peace."
 USA_1970_vietnam_escalatory_profile_tt:0 "Replaces §YThe Burden of Vietnam§! with an escalation profile: stability §R-14%§!, war support §G+3%§!, PP §R-13%§!, additional personnel cost §R+15%§!, additional supply use §R+15%§!, army attack §G+1%§!, air-mission efficiency §G+2%§!."
 USA_1970_drug_public_health_profile_tt:0 "Reshapes §YThe American Drug Crisis§!: stability §R-3%§!, PP §R-5%§!, population §G+1%§!, drift defence §R-6%§!, civilian intelligence §R-4%§!, police cost §R+6%§!, health cost §R+2%§!, bureaucracy cost §R+13%§!."
 USA_1970_drug_targeted_profile_tt:0 "Reshapes §YThe American Drug Crisis§!: stability §R-5%§!, PP §R-8%§!, population §R-1%§!, drift defence §R-2%§!, civilian intelligence §G+2%§!, police cost §R+20%§!, health cost §R+4%§!, bureaucracy cost §R+13%§!."
 USA_1970_drug_crackdown_profile_tt:0 "Reshapes §YThe American Drug Crisis§!: stability §R-9%§!, PP §R-14%§!, population §R-6%§!, drift defence §G+8%§!, civilian intelligence §G+8%§!, police cost §R+24%§!, health cost §R+10%§!, bureaucracy cost §R+14%§!."
 USA_1970_vietnam_burden_resolved_tt:0 "Removes the political §YBurden of Vietnam§! only after the United States is out of the war and the conflict between the Vietnamese states has actually ended through peace or the disappearance of a belligerent. A capitulation while the war continues is not enough, and this effect never creates peace by script."
 USA_1970_vietnam_settlement_profile_tt:0 "Reduces §YVietnam-Era Military Overextension§! after verified peace to: personnel cost §R+40%§!, army personnel cost §R+100%§!, equipment cost §R+45%§!, supply use §R+35%§!, consumer-goods factories §R+7%§!, and army training time §R+10%§!."
 USA_1970_vietnam_force_drawdown_profile_tt:0 "Further reduces §YVietnam-Era Military Overextension§! to: personnel cost §R+20%§!, army personnel cost §R+50%§!, equipment cost §R+25%§!, supply use §R+15%§!, consumer-goods factories §R+3%§!, and army training time §R+5%§!."
 USA_1970_vietnam_emergency_accounts_closed_tt:0 "Removes §YVietnam-Era Military Overextension§! after all three postwar stages. The permanent all-volunteer-force and veterans' costs listed by the decision remain."
