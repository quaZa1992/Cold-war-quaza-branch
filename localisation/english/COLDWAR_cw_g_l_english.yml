 COLDWAR_cw_g_market_tt: "§YMarket Confidence§! = 100\n - Cold War Tension x0.7: §R[?global.mdcw_cw_mc_tension|1]§!\n - wars between blocs x3: §R[?global.mdcw_cw_mc_wars|1]§! - other wars x1, at most 20: §R[?global.mdcw_cw_mc_other|1]§!\n - war crimes in the world news, fading each month, at most 15: §R[?global.mdcw_cw_mc_crimes|1]§!\n - trade fragmentation (§Y[?global.mdcw_cw_x_econ|0]§! economic and financial sanctions between opposing blocs x0.15, at most 10): §R[?global.mdcw_cw_mc_frag|1]§!\n - oil shock (real oil price §Yx[?global.mdcw_cw_oil_ratio|2]§! of January 1970; 12 per step above x1.2, at most 30): §R[?global.mdcw_cw_mc_oil|1]§![COLDWAR_gc_cw_market_assessment_L]\n\nEffects now at Globalism 50. Each country feels them times its market exposure (x0.25 at Globalism 0, x1 at 50, x2 at 100):\n[mdcw_cw_market_fx_L]\n\n§gMarket on us (x[?mdcw_cw_wm_exposure|2]):§! offices [?mdcw_cw_wm_office|+%0] · returns [?mdcw_cw_wm_roi|+%2] · productivity [?mdcw_cw_wm_prod_growth|+%0] · interest [?mdcw_cw_wm_interest|-2]"
 COLDWAR_cw_g_arms_tt: "§YArms Demand§! = 0.8 x Tension + 5 x wars between blocs + 0.2 per military programme + petrodollars (2 per step of the real oil price above x1.5, at most 10; now §Y[?global.mdcw_cw_arms_petro|1]§!).[COLDWAR_gc_cw_arms_assessment_L]\nIt drives the military industry tax of the §YMilitary-Industrial Complex§! (+0.4% per point above 25, less below it; from -10% to +30%). Every country also receives the military factory income modifier shown below, regardless of its interest groups.\n\nEffects now:\n[mdcw_cw_arms_fx_L]\nArms sales income applies to international arms sellers, and war metal exports apply to their exporters.\n\n§gArms & climate:§! arms sales [?mdcw_cw_wm_arms_sales|+%0] · military factory income [?mdcw_cw_wm_mil_income|+%0] · equipment upkeep [?mdcw_cw_wm_equip|-%0] · trade [?mdcw_cw_wm_trade|+%0] · war support [?mdcw_cw_wm_war_sup|+%0] · stability [?mdcw_cw_wm_stab|+%0]"
