 COLDWAR_cw_g_assist_tt: "Assistance capacity §Y[?mdcw_cw_cap_used|0] / [?mdcw_cw_cap_max|0]§! · running costs §Y[?mdcw_cw_cost_weekly|2]bn§!/week · partners §Y[?mdcw_cw_n_out|0]§! out, §Y[?mdcw_cw_n_in|0]§! in · [mdcw_cw_gpc_L]\n\nCapacity comes from our power rank (superpower 8, great power 6, large power 4, regional power 3, minor power 2, others 1). Bloc leaders gain more as their bloc grows, the national idea §YInternational Development Agency§! adds 4. A programme needs 1-3 capacity by package size, a public support campaign needs 1.\n\nWhat we receive is limited per effect; the national idea §YOpen Door Aid Policy§! raises these limits by 50% and makes incoming programmes 25% more effective."
