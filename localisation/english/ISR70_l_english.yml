 ISR70_p7_ca_desc:0 "Restore elections and commit the directorate to parliamentary government."
 ISR70_p7_ca_deepen:0 "Return to Parliamentary Government: Implementation"
 ISR70_p7_ca_deepen_desc:0 "Submit the civilian transition to an effective audit and strengthen public confidence."
