 ISR70_policy_unequal_canal_status:0 "Unequal Canal Status"
 ISR70P.410.t:0 "Local Civil Administration Talks"
 ISR70P.410.d:0 "Municipal representatives from Sinai consider a practical administrative contract. Accepting administrative duties does not recognize Israeli sovereignty or bind every resident."
 ISR70P.410.a:0 "The representatives accept a limited administrative contract."
 ISR70P.410.b:0 "The representatives decline the contract."
 ISR70_policy_decision_implement_council:0 "Implement the Accepted Council Contract"
 ISR70_policy_decision_implement_council_desc:0 "A limited administrative agreement reduces garrison duties only while it remains valid. It is not an endorsement of annexation."
 ISR70_policy_council_agreed_condition_tt:0 "Local representatives have accepted a limited administrative contract."
 ISR70_policy_decision_renew_council_talks:0 "Renew Council Talks"
 ISR70_policy_decision_renew_council_talks_desc:0 "An unsuccessful approach can be renewed after a year. No cooperation is presumed."
 ISR70P.411.t:0 "Property Claims and Return Arrangements"
 ISR70P.411.d:0 "Claimants consider whether the offered restitution and return framework meets their concrete claims. A fund alone does not settle those claims."
 ISR70P.411.a:0 "Accept and verify the agreed restitution."
 ISR70P.411.b:0 "The claims remain unresolved."
 ISR70_policy_resistance_202002_tt:0 "Resistance target from this policy: -2 percentage points."
 ISR70_policy_decision_fulfil_property_claims:0 "Fulfil the Agreed Property and Return Terms"
 ISR70_policy_decision_fulfil_property_claims_desc:0 "Resolve outstanding civilian claims before the small resistance effect is awarded. Previous forced displacement requires a further funded restitution step."
 ISR70_policy_property_claims_agreed_condition_tt:0 "The claimants have accepted the proposed property settlement."
 ISR70_policy_expulsion_damage_condition_tt:0 "Outstanding consequences of forced displacement remain."
 ISR70_policy_additional_restitution_paid_condition_tt:0 "Additional restitution paid."
 ISR70_policy_decision_additional_restitution:0 "Fund Additional Restitution after Forced Displacement"
 ISR70_policy_decision_additional_restitution_desc:0 "Pay an additional 0.7% of GDP toward the outstanding claims caused by the prior forced displacement. No people are erased from the population by this accounting step."
 ISR70_policy_decision_renew_property_talks:0 "Renew Property and Return Negotiations"
 ISR70_policy_decision_renew_property_talks_desc:0 "The claimants retain a real right to refuse the proposed terms."
 ISR70_policy_core_long_conditions_tt:0 "Sinai has ten continuous years of Israeli ownership/control, five years of equal civil rights, and two years of resistance at most 10%. Stability is at least 60%, compliance at least 70%, agreed property/return obligations are fulfilled, and no forced displacement is active."
 ISR70P.412.t:0 "The Sinai Status Consultation"
 ISR70P.412.d:0 "The district status process has reached its long-term review. Local civic representatives consider the proposed status separately from Egyptian sovereignty negotiations. Services and rights do not guarantee an affirmative result."
 ISR70P.412.a:0 "The local consultation accepts the proposed status."
 ISR70P.412.b:0 "The consultation rejects integration."
 ISR70P.413.t:0 "A Proposed Sinai Sovereignty Settlement"
 ISR70P.413.d:0 "Local assent alone does not settle Egypt's sovereign claim. The Egyptian government must separately accept or refuse the actual Sinai agreement."
 ISR70P.413.a:0 "Accept the specific sovereignty settlement."
 ISR70P.413.b:0 "Reject the permanent transfer of sovereignty."
 ISR70_policy_decision_egypt_status_proposal:0 "Negotiate the Egyptian Sovereignty Settlement"
 ISR70_policy_decision_egypt_status_proposal_desc:0 "Local acceptance is required before Egypt is asked to settle the sovereignty issue. Egypt may refuse."
 ISR70_policy_decision_renew_status_consultation:0 "Renew the Sinai Status Consultation"
 ISR70_policy_decision_renew_status_consultation_desc:0 "After an unsuccessful status process, new talks may be opened. Repeated proposals never guarantee assent."
 ISR70P.1027.t:0 "Development Project Completed"
 ISR70P.1027.d:0 "The reserved development project has reached its delivery date. If its requirements no longer hold, its original reservation is returned."
 ISR70_policy_project_occ_security_roads:0 "Security Roads and Controlled Access: Fund the Project"
 ISR70_policy_project_occ_security_roads_desc:0 "Reserve 0.8% of annual GDP at selection. Delivery after 180 days: +1 infrastructure levels in Sinai. Local policy effects: Local Supplies for Controller: +15%; Local Garrison Requirement: +5%. Loss of required control or project conditions refunds the exact reserved sum. The project can be completed only once."
 ISR70_policy_project_occ_security_roads_delivery_tt:0 "After 180 days: +1 infrastructure levels in Sinai. Local Supplies for Controller: +15%; Local Garrison Requirement: +5%"
 ISR70_policy_project_occ_security_roads_active_condition_tt:0 "Project occ security roads active."
 ISR70P.414.t:0 "Delegated Administration under Unequal Law"
 ISR70P.414.d:0 "Local administrators consider a limited administrative contract. Refusal grants Israel no administrative savings and does not require a further repressive policy."
 ISR70P.414.a:0 "Accept the limited duties."
 ISR70P.414.b:0 "Decline the contract."
 ISR70_policy_decision_fund_delegated_administration:0 "Fund the Accepted Delegated Administration"
 ISR70_policy_decision_fund_delegated_administration_desc:0 "Spend 0.2% of GDP to implement the accepted duties."
 ISR70_policy_delegated_agreed_condition_tt:0 "Local representatives have accepted the delegated administration."
 ISR70_policy_delegated_admin_active_condition_tt:0 "Delegated admin active."
 ISR70P.1028.t:0 "Development Project Completed"
 ISR70P.1028.d:0 "The reserved development project has reached its delivery date. If its requirements no longer hold, its original reservation is returned."
 ISR70_policy_project_occ_occupation_industry:0 "Industrial Enclaves under Separate Law: Fund the Project"
 ISR70_policy_project_occ_occupation_industry_desc:0 "Reserve 1% of annual GDP at selection. Delivery after 270 days: +1 building slots in Sinai; +1 civilian factories in Sinai. Local policy effects: Local Garrison Requirement: +5%. Loss of required control or project conditions refunds the exact reserved sum. The project can be completed only once."
