 ISR70_policy_permanent_statute:0 "Permanent Occupation Statute"
 ISR70_policy_permanent_statute_desc:0 "A legal-status policy with explicit continuing costs. It is replaced, not stacked, when the legal regime changes."
 ISR70_policy_rad_herut_authority_idea:0 "A National Territorial Development Authority"
 ISR70_policy_rad_herut_authority_idea_desc:0 "Budget 0.4% of GDP for a territorial authority: local infrastructure construction +10%, bureaucracy costs +2%, only under the programme government."
 ISR70_policy_rad_herut_preparation_idea:0 "Prepare to Hold the New Frontier"
 ISR70_policy_rad_herut_preparation_idea_desc:0 "Budget 0.5% of GDP and +3% personnel costs for 30 army experience and 10% local supply support in the controlled Sinai. It is preparation, not a declaration of war."
 ISR70_policy_rad_mafdal_settlers_services:0 "State Support for Settlement Communities"
 ISR70_policy_rad_mafdal_settlers_services_desc:0 "Temporary family services for a limited voluntary internal migration programme."
 ISR70_policy_rad_mafdal_review_idea:0 "Reviewable Leases and Land Registry"
 ISR70_policy_rad_mafdal_review_idea_desc:0 "Choose reviewable land leases and a registry instead of inalienability. Pay 50 political power and 0.3% of GDP; internal investment costs fall 5%, and territorial negotiations remain available."
 ISR70_policy_expulsion_damage:0 "Consequences of Forced Displacement"
 ISR70_policy_expulsion_damage_desc:0 "Civilian displacement, lost homes and unresolved property claims continue after a change of government."
 ISR70_policy_permanent_emergency:0 "Permanent Territorial Emergency"
 ISR70_policy_permanent_emergency_desc:0 "An explicitly chosen constitutional emergency suspends elections and raises enforcement and personnel costs."
 ISR70_policy_electoral_sunset:0 "Security Powers with an Electoral Sunset"
 ISR70_policy_electoral_sunset_desc:0 "Security powers last for 365 days and preserve the existing electoral framework."
 ISR70_emigration_wave:0 "An Agreed Emigration Programme"
 ISR70_emigration_wave_desc:0 "A bilateral agreement supports a limited emigration programme. Its absorption costs last for six months."
 ISR70_social_petition:0 "Unanswered Municipal Petitions"
 ISR70_social_petition_desc:0 "A temporary loss of confidence follows a decision to postpone municipal reform."
 ISR70_constitutional_emergency:0 "Constitutional Emergency"
 ISR70_constitutional_emergency_desc:0 "An exceptional transition is underway. It does not erase ordinary elections or policy progress."
 ISR70.1.t:0 "The Coalition Agreement"
 ISR70.1.d:0 "The new cabinet has secured a parliamentary arrangement. Its institutions will have to accommodate partners with different priorities."
 ISR70.1.a:0 "Take the agreement to the Knesset."
 ISR70.10.t:0 "The Rogers Initiative"
 ISR70.10.d:0 "Washington has proposed a route toward a limited ceasefire and negotiations. Accepting a discussion does not bind Egypt, and the cabinet must decide how to approach the proposal."
 ISR70.10.a:0 "Propose a monitored ceasefire."
 ISR70.10.b:0 "Insist on guarantees before talks."
 ISR70.10.c:0 "Maintain the present military policy."
 ISR70.12.t:0 "An Israeli Ceasefire Proposal"
 ISR70.12.d:0 "Israel has offered a monitored ceasefire. Egypt may accept the arrangement or continue the confrontation. Territorial questions remain separate."
 ISR70.12.a:0 "Accept a limited ceasefire."
 ISR70.12.b:0 "Decline the proposal."
 ISR70.11.t:0 "Gahal and the Ceasefire"
 ISR70.11.d:0 "A ceasefire has been accepted. Where Gahal participates in the coalition, its opposition to territorial concessions has become a question for the cabinet."
 ISR70.11.a:0 "Negotiate a security protocol."
 ISR70.11.b:0 "Accept Gahal's withdrawal."
 ISR70.11.c:0 "The cabinet can proceed."
 ISR70.20.t:0 "Voices from the Development Towns"
 ISR70.20.d:0 "Petitioners demand fairer access to housing, education and employment. Municipal representatives have brought their grievances to the cabinet and expect a practical response."
 ISR70.20.a:0 "Open a municipal hearing."
 ISR70.20.b:0 "Coordinate the existing development programmes."
 ISR70.20.c:0 "Postpone the reform."
 ISR70.30.t:0 "Leadership after Golda"
 ISR70.30.d:0 "The Alignment must decide whether to retain Golda Meir or entrust a new cabinet to Yitzhak Rabin or Shimon Peres. The choice will shape the balance between the party's political, military and industrial priorities."
 ISR70.30.a:0 "Retain Golda Meir."
 ISR70.30.b:0 "Choose Yitzhak Rabin."
 ISR70.30.c:0 "Choose Shimon Peres."
 ISR70.40.t:0 "An Israeli Delivery Proposal"
 ISR70.40.d:0 "Israel requests reliable military deliveries or economic cooperation. Washington may accept military cooperation, offer a civilian alternative or decline."
 ISR70.40.a:0 "Accept military supply cooperation."
 ISR70.40.b:0 "Offer civilian cooperation only."
 ISR70.40.c:0 "Decline the proposal."
 ISR70.45.t:0 "Reopen the Israeli Trade Channel"
 ISR70.45.d:0 "Israel proposes a renewed European commercial channel. Acceptance establishes a trade agreement without promising automatic arms deliveries."
 ISR70.45.a:0 "Accept the proposed agreement."
 ISR70.45.b:0 "Decline for now."
 ISR70.50.t:0 "Israel and the Emigration Question"
 ISR70.50.d:0 "Israel proposes diplomatic contact and a limited agreed emigration programme. Moscow may approve it or refuse."
 ISR70.50.a:0 "Accept the proposed agreement."
 ISR70.50.b:0 "Decline for now."
 ISR70.60.t:0 "Sinai and Security Guarantees"
 ISR70.60.d:0 "Israel proposes a negotiated peace and a phased return of the Sinai administration. Egyptian acceptance would allow the two governments to begin implementing the agreed security arrangements."
 ISR70.60.a:0 "Accept the proposed agreement."
 ISR70.60.b:0 "Decline for now."
 ISR70.73.t:0 "A Golan Security Proposal"
 ISR70.73.d:0 "Israel proposes practical security discussions over the Golan. Damascus must decide whether the proposed framework offers a useful basis for negotiations."
 ISR70.73.a:0 "Accept the proposed agreement."
 ISR70.73.b:0 "Decline for now."
 ISR70.76.t:0 "Israeli-Iranian Supply Cooperation"
 ISR70.76.d:0 "Israel proposes cooperation in supply and commerce. The government in Tehran must consent and remain compatible with the arrangement."
 ISR70.76.a:0 "Accept the proposed agreement."
 ISR70.76.b:0 "Decline for now."
 ISR70.77.t:0 "The Amman Backchannel"
 ISR70.77.d:0 "Israel proposes confidential talks on border security and practical arrangements. Amman must decide whether to authorize a continuing channel."
 ISR70.77.a:0 "Accept the proposed agreement."
 ISR70.77.b:0 "Decline for now."
 ISR70.70.t:0 "A Palestinian Negotiating Framework"
 ISR70.70.d:0 "Israel has invited Palestinian and municipal representatives to discuss a civil arrangement. Local autonomy and a state settlement have different practical consequences."
 ISR70.70.a:0 "Accept a municipal administrative compact."
 ISR70.70.b:0 "Accept a negotiated state settlement."
 ISR70.70.c:0 "No agreement on these terms."
 ISR70.80.t:0 "The Constitutional Convention"
 ISR70.80.d:0 "The convention can retain the Basic Law order, found a federal civic republic or accept a constitutional crown. The exceptional alternatives require a deliberate political choice."
 ISR70.80.a:0 "Continue the Basic Law order."
 ISR70.80.b:0 "Accept a federal civic constitution."
 ISR70.80.c:0 "Accept a parliamentary crown."
 ISR70.81.t:0 "The Annexation Debate"
 ISR70.81.d:0 "Parliament must distinguish an administrative policy from an irreversible territorial claim. Municipal negotiations offer another course, but the cabinet must first agree on the authority and commitments it is prepared to grant."
 ISR70.81.a:0 "Retain the present administration."
 ISR70.81.b:0 "Offer a municipal settlement."
 ISR70.81.c:0 "Adopt a territorial sovereignty claim."
 ISR70.90.t:0 "A Constitutional Emergency"
 ISR70.90.d:0 "A real war or severe loss of public confidence has opened a constitutional emergency. The government must choose whether to restore the republic, convene civilian reconstruction talks or authorize a temporary military transition."
 ISR70.90.a:0 "Restore the republican institutions."
 ISR70.90.b:0 "Convene civilian reconstruction talks."
 ISR70.90.c:0 "Authorize a military emergency cabinet."
 ISR70.100.t:0 "An Agreement Accepted"
 ISR70.100.d:0 "The other government has accepted the proposal. Ministers can now prepare the practical measures needed to implement the agreement."
 ISR70.100.a:0 "Proceed with the agreement."
 ISR70.101.t:0 "A Proposal Declined"
 ISR70.101.d:0 "The other government has declined the current terms. The proposal has not imposed an agreement or changed territorial ownership."
 ISR70.101.a:0 "Review the proposal."
