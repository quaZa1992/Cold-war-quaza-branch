 ISR70_policy_project_equal_services_desc:0 "Treasury: -0.6% of annual GDP. Completion: 180 days. +1 infrastructure levels in Haifa; +1 shared building slots. Continuing effects: Stability: +2%; Social Spending Cost: +3%. Loss of required control or project conditions refunds the reserved sum. The project can be completed only once."
