 ISR70_policy_bank_consortium_idea:0 "Domestic Banking Consortium"
 ISR70_policy_bank_consortium_idea_desc:0 "A coordinated domestic banking consortium improves office-sector productivity while increasing concentration-related costs."
 ISR70_policy_shared_services_idea:0 "Shared Back Offices"
