 ISR70_policy_resistance_202001_tt:0 "Resistance target from this policy: +4 percentage points."
 ISR70_policy_decision_reenact_permanent_statute:0 "Re-enact the Permanent Occupation Statute"
 ISR70_policy_decision_reenact_permanent_statute_desc:0 "Following a legal-status change, a permanent statute requires a new 100-political-power enactment. Its old costs and bonuses cannot stack."
 ISR70_policy_permanent_statute_active_condition_tt:0 "Permanent statute active."
 ISR70_policy_decision_reform_equal:0 "Replace the Special Statute with Equal Rights"
 ISR70_policy_decision_reform_equal_desc:0 "Pay 100 political power to repeal unequal law. If the civil-status focus has not yet been completed, it becomes available with its own cost. Otherwise the civil regime is reinstated directly. Physical projects and historic claims remain; no cooperation bonus is granted."
 ISR70_policy_decision_reform_special:0 "Replace the Civil Reform with an Unequal Statute"
 ISR70_policy_decision_reform_special_desc:0 "Pay 100 political power to revoke the civil reform. Its rights clock and gains end; prior spending is not refunded. Revocation adds 5 resistance-target points for two years."
 ISR70_policy_decision_withdraw_status_reform:0 "Withdraw the Pending Status Reform"
 ISR70_policy_decision_withdraw_status_reform_desc:0 "Withdraw the authorisation before the new law takes effect. The current regime remains; the 100-political-power authorisation cost is not refunded."
