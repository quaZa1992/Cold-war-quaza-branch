 ISR70_policy_project_preferential_allocations:0 "Preferential Land and Budget Allocation: Fund the Project"
 ISR70_policy_project_preferential_allocations_desc:0 "Reserve 0.5% of annual GDP at selection. Delivery after 180 days: +2 building slots in the Negev; +1 infrastructure levels in the Negev. Continuing effects: Stability: -2%. Loss of required control or project conditions refunds the exact reserved sum. The project can be completed only once."
