 ISR70_policy_egypt_reopen_canal_desc:0 "Reserve 0.8% of annual GDP for a 180-day reopening project. Israeli-Egyptian fighting must have ceased. Completion opens canal traffic; control of the canal shores then determines the normal revenue bonus. Loss of the project conditions refunds the original reservation."
