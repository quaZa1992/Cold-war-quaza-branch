 ISR70_policy_clerical_training_idea:0 "Trained Clerical Workforce"
 ISR70_policy_clerical_training_idea_desc:0 "Accounting and administrative training improves the labour efficiency of office buildings."
 ISR70_policy_clearing_network_idea:0 "Mechanized Clearing Network"
