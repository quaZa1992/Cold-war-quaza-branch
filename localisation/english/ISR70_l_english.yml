l_english:
 ISR70_programme_scope_tt:0 "§YGovernment programme:§! Active only while this party governs."
 ISR70_cold_war_tension_tt:0 "Cold War tension increases by §R2§! points."
 ISR70_p0_programme:0 "Mafdal - Religious Zionism: Government Programme"
 ISR70_p0_programme_desc:0 "Parliamentary religious Zionism links public institutions, national service and the religious status quo. Its programme is active only while this party governs."
 ISR70_p1_programme:0 "Gahal - Herut and the Liberals: Government Programme"
 ISR70_p1_programme_desc:0 "Begin must hold together the revisionist and liberal wings of Gahal. A later Likud foundation is a choice, not an anachronistic starting party. Its programme is active only while this party governs."
 ISR70_p2_programme:0 "Independent Liberals: Government Programme"
 ISR70_p2_programme_desc:0 "An independent liberal cabinet can promote small business, civil rights or a pragmatic security policy without importing parties from the twenty-first century. Its programme is active only while this party governs."
 ISR70_p3_programme:0 "Alignment - Golda's Israel: Government Programme"
 ISR70_p3_programme_desc:0 "The Labor Party and Mapam share the Alignment. Golda Meir governs through a broad coalition, a citizen army and the institutions of Labor Zionism. Its programme is active only while this party governs."
 ISR70_p4_programme:0 "Rakah - The Communist Course: Government Programme"
 ISR70_p4_programme_desc:0 "A Jewish-Arab communist government is an alternative electoral outcome. Parliamentary socialism and Soviet alignment remain separate decisions. Its programme is active only while this party governs."
 ISR70_p5_programme:0 "Federative Council Left: Government Programme"
 ISR70_p5_programme_desc:0 "An explicitly alternative council-socialist movement can decentralize production and negotiate a federal or common civic constitution. Its programme is active only while this party governs."
 ISR70_p6_programme:0 "Mizrahi Traditionalist Alliance: Government Programme"
 ISR70_p6_programme_desc:0 "An alternative traditionalist movement gives development towns an independent voice. Shas remains a later foundation rather than a party transplanted into 1970. Its programme is active only while this party governs."
 ISR70_p7_programme:0 "Development Directorate: Government Programme"
 ISR70_p7_programme_desc:0 "An explicitly alternative emergency directorate must choose between professional administration and patronage, and between a civilian transition and enduring presidential power. Its programme is active only while this party governs."
 ISR70_p12_programme:0 "Islamic Municipal Reform List: Government Programme"
 ISR70_p12_programme_desc:0 "A parliamentary organization of Arab municipalities can prioritize trade, charitable provision or a common civic settlement. Its programme is active only while this party governs."
 ISR70_p13_programme:0 "Agudat Israel and Poalei Agudat: Government Programme"
 ISR70_p13_programme_desc:0 "The Orthodox parties defend their communities through parliamentary bargaining, religious education and local social institutions. Its programme is active only while this party governs."
 ISR70_p14_programme:0 "State List and Pragmatic Right: Government Programme"
 ISR70_p14_programme_desc:0 "A pragmatic cabinet can professionalize public enterprises or encourage private business, while choosing between defensive pragmatism and territorial negotiations. Its programme is active only while this party governs."
 ISR70_p15_programme:0 "Development and Enterprise Bloc: Government Programme"
 ISR70_p15_programme_desc:0 "An explicitly alternative alliance of entrepreneurs and municipal notables must choose transparent investment or privileged concessions and patronage. Its programme is active only while this party governs."
 ISR70_p16_programme:0 "HaOlam HaZeh - Free Citizens: Government Programme"
 ISR70_p16_programme_desc:0 "A secular civil-rights movement can defend a free press and equal citizenship. Radical market reform is a separate alternative policy. Its programme is active only while this party governs."
 ISR70_p17_programme:0 "Landscape and Environment League: Government Programme"
 ISR70_p17_programme_desc:0 "An alternative early environmental organization addresses the real development choices of land, water, industry and public infrastructure. Its programme is active only while this party governs."
 ISR70_p18_programme:0 "Mapam and the Independent Left: Government Programme"
 ISR70_p18_programme_desc:0 "Mapam brings the cooperative movement, organized workers and a commitment to Jewish-Arab equality into the debate over Israel's future. Its programme is active only while this party governs."
 ISR70_p19_programme:0 "Maki - Independent Communism: Government Programme"
 ISR70_p19_programme_desc:0 "An independent communist cabinet chooses its own relationship between workers' institutions, parliamentary rights and economic planning. Its programme is active only while this party governs."
 ISR70_p20_programme:0 "Free Center and National Alliance: Government Programme"
 ISR70_p20_programme_desc:0 "A national opposition can remain parliamentary or seek a presidential mandate. It is not a later national-religious party transplanted into 1970. Its programme is active only while this party governs."
 ISR70_p21_programme:0 "Radical National Front: Government Programme"
 ISR70_p21_programme_desc:0 "An explicit alternative radicalization precedes this movement. Autarky, mobilization and an authoritarian security order have real economic consequences. Its programme is active only while this party governs."
 ISR70_p22_programme:0 "Military Emergency Cabinet: Government Programme"
 ISR70_p22_programme_desc:0 "A genuine constitutional emergency is required. The armed forces are not treated as an ordinary electoral party in January 1970. Its programme is active only while this party governs."
 ISR70_p23_programme:0 "Constitutional Hebrew Crown: Government Programme"
 ISR70_p23_programme_desc:0 "A freely selected constitutional founding process is required. A crown is an explicit alternative, not a reinterpretation of a modern religious party. Its programme is active only while this party governs."
