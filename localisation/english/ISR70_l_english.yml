 ISR70_january_1970:0 "Israel in January 1970"
 ISR70_january_1970_desc:0 "Set the cabinet agenda for the new decade and release political capital for the first reforms."
 ISR70_knesset:0 "The Seventh Knesset"
 ISR70_knesset_desc:0 "The Seventh Knesset brings together the parties elected in October 1969. Parliamentary committees and a working legislative agenda must give the new government a durable basis for reform."
 ISR70_unity_cabinet:0 "Negotiate a Unity Cabinet"
 ISR70_unity_cabinet_desc:0 "Replace the fragile starting coalition with a negotiated unity agreement. Its broader support improves stability and military confidence."
 ISR70_narrow_cabinet:0 "A Parliamentary Working Majority"
 ISR70_narrow_cabinet_desc:0 "A smaller working majority leaves the cabinet more political room and gives organized labor a clearer role."
 ISR70_civil_service:0 "A Professional Civil Service"
 ISR70_civil_service_desc:0 "Professional recruitment and common procurement rules reduce the recurring cost of the civil service."
 ISR70_oversight:0 "The Comptroller and Parliamentary Oversight"
 ISR70_oversight_desc:0 "The State Comptroller must be able to follow public money from the cabinet to local administrations. Independent audits will make officials answer for misuse of their offices."
 ISR70_local_councils:0 "Municipal Freedom of Action"
 ISR70_local_councils_desc:0 "Let local councils deliver roads and services faster without increasing the central bureaucracy."
 ISR70_central_planning:0 "Coordinated State Planning"
 ISR70_central_planning_desc:0 "Coordinate national tenders and engineering standards for a faster state construction programme."
 ISR70_basic_laws:0 "The Unfinished Basic Laws"
 ISR70_basic_laws_desc:0 "Strengthen the Basic Law framework and open the constitutional convention decision."
 ISR70_p0_institution:0 "Religion in the Public State"
 ISR70_p0_institution_desc:0 "Anchor religious Zionism in parliamentary institutions and strengthen its public-service organizations."
 ISR70_research_speed_factor_tt:0 "$MODIFIER_RESEARCH_SPEED_FACTOR$: $RIGHT|+=%1$"
 ISR70_p0_ea:0 "Religious Study and Vocational Education"
 ISR70_p0_ea_desc:0 "Connect religious study to vocational education and industrial qualifications."
 ISR70_p0_ea_deepen:0 "Teachers for Religious Vocational Schools"
 ISR70_p0_ea_deepen_desc:0 "Religious vocational schools need instructors who can teach industrial skills without abandoning their communities' educational commitments. Preparing those teachers will connect workshop qualifications to the institutions through which Mafdal already organises public life."
 ISR70_p0_eb:0 "Municipal Religious Welfare"
 ISR70_p0_eb_desc:0 "Expand municipal religious welfare institutions and community provision."
 ISR70_p0_eb_deepen:0 "Services for the Southern Communities"
 ISR70_p0_eb_deepen_desc:0 "Religious welfare organisations cannot serve the development towns without dependable roads and local facilities. Connecting these communities to public services will give the municipal network a practical foundation beyond charitable appeals."
 ISR70_p0_ca:0 "Bnei Akiva and National Service"
 ISR70_p0_ca_desc:0 "Link Bnei Akiva and national service to military preparation."
 ISR70_p0_ca_deepen:0 "A Trained National-Service Cadre"
 ISR70_p0_ca_deepen_desc:0 "Bnei Akiva and the service institutions must prepare young people for responsibilities that extend beyond mobilisation. Common training standards will make the religious-Zionist service framework a more dependable part of national defence."
 ISR70_p0_cb:0 "Religious Settlement Policy"
 ISR70_p0_cb_desc:0 "Religious Zionist organizations seek a lasting place in the settlement movement. Local organization and defense preparations will shape their contribution to national policy."
 ISR70_army_org_factor_tt:0 "$MODIFIER_ARMY_ORG_FACTOR$: $RIGHT|+=%1$"
 ISR70_p0_cb_deepen:0 "Supply the Border Communities"
 ISR70_p0_cb_deepen_desc:0 "Border communities need reliable connections to the forces responsible for their defence. Coordinating supplies and local preparations will turn the settlement movement's security claims into an organisation that can sustain its responsibilities."
 ISR70_p0_finish:0 "Religion and the Republic"
 ISR70_p0_finish_desc:0 "Mafdal must show that religious education, community organisation and national service can support the same state. The cabinet's chosen settlement will determine how those obligations are shared without dissolving the movement's distinctive institutions into the larger parties."
 ISR70_p1_institution:0 "Hold Herut and the Liberals Together"
 ISR70_p1_institution_desc:0 "Coordinate Herut and Liberal representatives around a durable parliamentary leadership."
 ISR70_p1_ea:0 "An Entrepreneurial Israel"
 ISR70_p1_ea_desc:0 "Make private enterprise and commercial employment the engine of development."
 ISR70_p1_ea_deepen:0 "Commerce on the Tel Aviv Model"
 ISR70_p1_ea_deepen_desc:0 "The Liberal wing of Gahal sees commercial employment as a route to prosperity beyond protected enterprises. A new office district in Tel Aviv will give that argument a concrete base of firms, services and technical work."
 ISR70_p1_eb:0 "Retain Strategic State Enterprises"
 ISR70_p1_eb_desc:0 "Retain strategic public enterprises while improving their industrial methods."
 ISR70_p1_eb_deepen:0 "Strategic Industry in Haifa"
 ISR70_p1_eb_deepen_desc:0 "Gahal's economic debate need not end with the disposal of every public enterprise. Investment in Haifa will demonstrate whether strategic state ownership can coexist with a cabinet otherwise committed to greater scope for private initiative."
 ISR70_p1_ca:0 "The Rule of Law and Opposition"
 ISR70_p1_ca_desc:0 "Defend the rule of law and subject the government to effective scrutiny."
 ISR70_p1_ca_deepen:0 "Parliamentary Scrutiny of the Executive"
 ISR70_p1_ca_deepen_desc:0 "Herut's experience in opposition gives parliamentary scrutiny a particular importance within Gahal. Stronger safeguards and a more capable civil administration will require ministers to accept procedures that constrain their own government as well as its opponents."
 ISR70_p1_cb:0 "Indivisible Security Interests"
 ISR70_p1_cb_desc:0 "Make security interests the center of the government's civic mandate."
 ISR70_p1_cb_deepen:0 "A Cohesive Security Establishment"
 ISR70_p1_cb_deepen_desc:0 "A firm security policy requires units that can remain organised and supplied in the field. Gahal will direct attention towards the daily work of sustaining the force, giving its political commitments an operational foundation."
 ISR70_p1_finish:0 "The Conservative Transfer of Power"
 ISR70_p1_finish_desc:0 "Herut and the Liberals must turn an opposition alliance into a government that can endure. Their chosen economic programme and civic settlement will shape a common record of administration, while their separate traditions continue to test the cabinet's cohesion."
 ISR70_p2_institution:0 "Liberal Government Responsibility"
 ISR70_p2_institution_desc:0 "Strengthen independent liberal institutions and build business confidence without merging into a larger bloc."
 ISR70_p2_ea:0 "Small Business over Monopolies"
 ISR70_p2_ea_desc:0 "Prioritize small businesses over protected monopolies."
 ISR70_p2_ea_deepen:0 "Room for Independent Businesses"
 ISR70_p2_ea_deepen_desc:0 "Independent shopkeepers and service firms need commercial space that is not reserved for the largest political or economic organisations. A Tel Aviv office district will support the Liberals' promise to broaden access to productive private enterprise."
 ISR70_p2_eb:0 "Capital and Export Industry"
 ISR70_p2_eb_desc:0 "Support capital formation and manufacturers that compete in export markets."
 ISR70_production_factory_max_efficiency_factor_tt:0 "$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: $RIGHT|+=%1$"
 ISR70_p2_eb_deepen:0 "Export Production in Haifa"
 ISR70_p2_eb_deepen_desc:0 "Liberal support for enterprise must also reach firms that manufacture rather than merely trade. A modern industrial investment in Haifa will connect capital formation to production methods capable of sustaining competitive export employment."
 ISR70_p2_ca:0 "Entrench Civil Rights"
 ISR70_p2_ca_desc:0 "Entrench civil rights through accountable parliamentary institutions."
 ISR70_p2_ca_deepen:0 "An Accountable Liberal Civil Service"
 ISR70_p2_ca_deepen_desc:0 "Civil rights need officials who apply public rules consistently. Auditing the administration will bring the Independent Liberals' constitutional commitments into everyday dealings with the state and reduce the burden of unnecessary bureaucracy."
 ISR70_p2_cb:0 "A Liberal Security State"
 ISR70_p2_cb_desc:0 "A liberal security policy emphasizes professional planning and trained reserves."
 ISR70_p2_cb_deepen:0 "Defensive Analysis and Secure Communications"
 ISR70_p2_cb_deepen_desc:0 "A liberal government cannot neglect national defence, but it can insist on careful assessment rather than political reflex. Technical preparation and secure communications will support a security policy grounded in professional judgement."
 ISR70_p2_finish:0 "A Liberal Republic"
 ISR70_p2_finish_desc:0 "The Independent Liberals seek a place for rights, research and productive enterprise outside the larger political blocs. Their programme must demonstrate that an independent parliamentary voice can administer the state and sustain confidence without surrendering its principles to coalition convenience."
 ISR70_p3_institution:0 "The Labor Zionist Alliance"
 ISR70_p3_institution_desc:0 "Reconcile Labor and Mapam around a cabinet programme rooted in the Histadrut and cooperative institutions."
 ISR70_p3_ea:0 "Modernize the Histadrut"
 ISR70_p3_ea_desc:0 "Modernize Histadrut enterprises through negotiated production and workplace reform."
 ISR70_p3_ea_deepen:0 "Modern Workshops for the Histadrut Economy"
 ISR70_p3_ea_deepen_desc:0 "The institutions of Labor Zionism must adapt their industrial base to a changing economy. Investment in Haifa will give workers and managers a practical test of modernisation within the enterprises around which the Alignment's social influence has grown."
 ISR70_p3_eb:0 "Kibbutzim as Development Centers"
 ISR70_p3_eb_desc:0 "Use kibbutzim as agricultural development and technical-training centers."
 ISR70_p3_eb_deepen:0 "Irrigation for Cooperative Development"
 ISR70_p3_eb_deepen_desc:0 "Cooperative settlement depends on productive land and dependable water rather than political symbolism alone. An irrigated district in the Negev will connect the Alignment's rural institutions to a renewed programme of agricultural development."
 ISR70_p3_ca:0 "Social Balance in the Cities"
 ISR70_p3_ca_desc:0 "Make urban social balance and development-town provision a cabinet priority."
 ISR70_p3_ca_deepen:0 "Public Services in the Development Towns"
 ISR70_p3_ca_deepen_desc:0 "The social compact must reach households beyond the established metropolitan centres. Better local connections and public-service provision will give the development towns a more tangible share in the prosperity promised by the Alignment."
 ISR70_p3_cb:0 "Security through Negotiating Strength"
 ISR70_p3_cb_desc:0 "Use organized military readiness as the basis for negotiations from strength."
 ISR70_p3_cb_deepen:0 "Room for Negotiating Strength"
 ISR70_p3_cb_deepen_desc:0 "A cabinet that relies on negotiating strength must retain the freedom to choose its own position. Political consolidation and greater diplomatic independence will help the Alignment conduct talks without treating every outside preference as an instruction."
 ISR70_p3_finish:0 "A Second Building of Israel"
 ISR70_p3_finish_desc:0 "Labor and Mapam must reconcile industrial modernisation, cooperative traditions and the needs of communities that feel excluded from both. The government will be judged on whether its chosen programme renews the institutions of Labor Zionism rather than merely preserving their authority."
 ISR70_p4_institution:0 "A Jewish-Arab Class Alliance"
 ISR70_p4_institution_desc:0 "Organize a Jewish-Arab class alliance through workers' organizations and public institutions."
 ISR70_p4_ea:0 "Parliamentary Communism"
 ISR70_p4_ea_desc:0 "Commit parliamentary communism to organized labor and accountable public production."
 ISR70_p4_ea_deepen:0 "Workers Trained for Public Enterprise"
 ISR70_p4_ea_deepen_desc:0 "Parliamentary communism must show that public ownership can improve work as well as change its formal direction. Technical education and stronger enterprise productivity will give the Jewish-Arab workers' alliance a practical economic record."
 ISR70_p4_eb:0 "A Central Economic Plan"
 ISR70_p4_eb_desc:0 "Coordinate industrial construction through a central economic plan."
 ISR70_p4_eb_deepen:0 "A Public Industrial Base in Haifa"
 ISR70_p4_eb_deepen_desc:0 "Central planning requires factories capable of carrying out its priorities. A public industrial investment in Haifa will place responsibility for employment and production directly on the government and the workers' organisations that support it."
 ISR70_p4_ca:0 "Equal Citizens"
 ISR70_p4_ca_desc:0 "Make equal citizenship the legal basis of the Jewish-Arab class alliance."
 ISR70_p4_ca_deepen:0 "Equal Access to Municipal Services"
 ISR70_p4_ca_deepen_desc:0 "Equal citizenship will remain an abstraction if neighbourhoods receive unequal public services. The communist cabinet will strengthen municipal provision so that cooperation between Jewish and Arab workers has an everyday institutional basis."
 ISR70_mdcw_cw_support_effectiveness_tt:0 "$mdcw_cw_support_effectiveness$: $RIGHT|+=%1$"
 ISR70_p4_cb:0 "Soviet Security Cooperation"
 ISR70_p4_cb_desc:0 "Pursue Soviet-oriented security cooperation through contemporary training and assistance capacity."
 ISR70_p4_cb_deepen:0 "Technical Preparation for Soviet Armour"
 ISR70_p4_cb_deepen_desc:0 "Closer military cooperation with Moscow requires crews and technical organisations able to understand contemporary armoured designs. Research preparation will develop that competence without assuming that a diplomatic orientation alone delivers finished equipment."
 ISR70_p4_finish:0 "A Socialist Peace Settlement"
 ISR70_p4_finish_desc:0 "Rakah's government must hold together its class programme, Jewish-Arab equality and the security choices made during its term. A socialist settlement will depend on capable public institutions and services that make cooperation more durable than a parliamentary declaration."
 ISR70_p5_institution:0 "Communes over Party Headquarters"
 ISR70_p5_institution_desc:0 "Give municipal and producers' councils a defined role in a federative political system."
 ISR70_p5_ea:0 "Autonomous Producers' Councils"
 ISR70_p5_ea_desc:0 "Give producers' councils practical control of workplace training and production."
 ISR70_p5_ea_deepen:0 "Technical Knowledge between Councils"
 ISR70_p5_ea_deepen_desc:0 "Autonomous producers' councils need ways to share expertise without surrendering every decision to a central ministry. Joint technical training and industrial research will help local workplaces learn from one another's experience."
 ISR70_p5_eb:0 "A Coordinated Cooperative Federation"
 ISR70_p5_eb_desc:0 "Coordinate the cooperative federation's agricultural and industrial investment."
 ISR70_p5_eb_deepen:0 "Cooperative Cultivation in the Negev"
 ISR70_p5_eb_deepen_desc:0 "A cooperative federation needs a rural economy alongside its municipal councils. Investment in a Negev agricultural district will give producers a common project whose operation depends on sustained coordination rather than a hierarchy of ministerial orders."
 ISR70_p5_ca:0 "Jewish-Arab Federalism"
 ISR70_p5_ca_desc:0 "Define Jewish-Arab federalism through accountable municipal powers."
 ISR70_p5_ca_deepen:0 "Local Representation within the Federation"
 ISR70_p5_ca_deepen_desc:0 "A federal settlement will endure only if communities trust the bodies that represent them. Clear local responsibilities and dependable institutions can protect the agreement against the suspicion that one centre will eventually take back the authority it has promised."
 ISR70_p5_cb:0 "A Common Civic Republic"
 ISR70_p5_cb_desc:0 "Build a common civic republic through equal public institutions."
 ISR70_p5_cb_deepen:0 "Shared Services for a Common Republic"
 ISR70_p5_cb_deepen_desc:0 "A common civic republic must provide services that residents can use regardless of community. Building that administrative capacity will give the council left's constitutional ambitions a practical test in daily public provision."
 ISR70_p5_finish:0 "A Federation of Municipalities"
 ISR70_p5_finish_desc:0 "The council left seeks a federation held together by cooperation among producers and municipalities. Its chosen economic and civic institutions must provide enough coordination to sustain development while leaving local bodies with a meaningful role in their own affairs."
 ISR70_p6_institution:0 "Represent the Periphery"
 ISR70_p6_institution_desc:0 "Build an independent political voice for traditional families and the development towns."
 ISR70_p6_ea:0 "Crafts and Family Businesses"
 ISR70_p6_ea_desc:0 "Give craftspeople and family businesses access to productive credit."
 ISR70_p6_ea_deepen:0 "Commercial Space in the Negev"
 ISR70_p6_ea_deepen_desc:0 "Family firms in the development towns need premises and business services as well as political recognition. A municipal office district will give the traditionalist alliance a concrete investment in the southern communities it claims to represent."
 ISR70_p6_eb:0 "Municipal Development Funds"
 ISR70_p6_eb_desc:0 "Direct development funds toward municipal services in the periphery."
 ISR70_production_speed_infrastructure_factor_tt:0 "$modifier_production_speed_infrastructure_factor$: $RIGHT|+=%1$"
 ISR70_p6_eb_deepen:0 "Connect the Southern Development Towns"
 ISR70_p6_eb_deepen_desc:0 "Municipal development funds must reach communities whose distance from established centres raises the cost of work and public services. Better infrastructure will make those towns a more practical base for households and local employers."
 ISR70_p6_ca:0 "Tradition and Shared Education"
 ISR70_p6_ca_desc:0 "Combine traditional institutions with shared vocational education."
 ISR70_p6_ca_deepen:0 "Teachers and Trades for the Periphery"
 ISR70_p6_ca_deepen_desc:0 "Young people in traditional communities should not have to choose between retaining their social ties and acquiring useful qualifications. Teacher preparation and vocational education will broaden their opportunities within the development towns."
 ISR70_p6_cb:0 "Traditional Social Partnership"
 ISR70_p6_cb_desc:0 "Negotiate a traditional social partnership between employers, workers and religious institutions."
 ISR70_p6_cb_deepen:0 "Community Welfare Administration"
 ISR70_p6_cb_deepen_desc:0 "Traditional social partnership needs organisations that can administer help reliably. Strengthening community welfare will allow local institutions to respond to households without making every need depend on a personal connection to a political intermediary."
 ISR70_p6_finish:0 "The Rise of the Development Towns"
 ISR70_p6_finish_desc:0 "The traditionalist alliance must turn the periphery's political voice into dependable work and services. Its programme will be judged by whether development towns gain institutions of their own, rather than another channel through which established centres distribute favours."
 ISR70_p7_institution:0 "A Limited Directorate"
 ISR70_p7_institution_desc:0 "Give the directorate a professional administrative core before choosing its economic and constitutional direction."
 ISR70_p7_ea:0 "A Technocratic Development Plan"
 ISR70_p7_ea_desc:0 "Build a technocratic development plan around transparent procurement and engineering."
 ISR70_p7_ea_deepen:0 "Industry under Professional Direction"
 ISR70_p7_ea_deepen_desc:0 "The directorate's claim to competence will be tested by the enterprises it develops. A public industrial investment in Haifa will give its planners a clear responsibility for production and employment beyond the language of emergency administration."
 ISR70_p7_eb:0 "Patronage through State Corporations"
 ISR70_p7_eb_desc:0 "Use state corporations and favored contractors for rapid construction. Patronage increases corruption-related costs."
 ISR70_p7_eb_deepen:0 "The State Corporations' Building Programme"
 ISR70_p7_eb_deepen_desc:0 "The directorate will channel industrial investment through the corporations and interests that sustain its authority. New capacity can strengthen production, but the distribution of its benefits will also expose the relationship between economic development and political patronage."
 ISR70_p7_ca:0 "Return to Parliamentary Government"
 ISR70_p7_ca_desc:0 "Restore elections and commit the directorate to parliamentary government."
 ISR70_p7_ca_deepen:0 "Audit the Civilian Transition"
 ISR70_p7_ca_deepen_desc:0 "A promised return to civilian government needs credible scrutiny of the administration that manages it. An effective audit will test the directorate's willingness to submit its record to standards that are independent of its own claims."
 ISR70_p7_cb:0 "Permanent Presidential Rule"
 ISR70_p7_cb_desc:0 "Establish permanent presidential rule and suspend ordinary elections."
 ISR70_p7_cb_deepen:0 "The Presidential Planning Office"
 ISR70_p7_cb_deepen_desc:0 "An enduring presidency will bring administration and construction planning closer to the executive. Ministers and technical staff will work through a more concentrated centre, tying the development programme to the president's continued authority."
 ISR70_p7_finish:0 "The Directorate State"
 ISR70_p7_finish_desc:0 "The directorate must now answer for the institutions built under its exceptional authority. Its economic priorities and constitutional choice will determine whether technical administration prepares a civilian settlement or becomes the foundation of a lasting presidential order."
 ISR70_p12_institution:0 "Municipal Interests in the Knesset"
 ISR70_p12_institution_desc:0 "Represent municipal interests through parliamentary negotiation and accountable local institutions."
 ISR70_p12_ea:0 "Arab Commercial Centers"
 ISR70_p12_ea_desc:0 "Build Arab commercial centers around local enterprise and parliamentary representation."
 ISR70_p12_ea_deepen:0 "Commerce for the Northern Municipalities"
 ISR70_p12_ea_deepen_desc:0 "Arab municipalities need a stronger commercial base alongside their public institutions. New office capacity in the north will support local firms and give municipal representatives a practical answer to the demand for productive employment."
 ISR70_p12_eb:0 "Social Endowments and Municipal Aid"
 ISR70_p12_eb_desc:0 "Use social endowments for municipal welfare and charitable provision."
 ISR70_p12_eb_deepen:0 "Roads between Communities and Services"
 ISR70_p12_eb_deepen_desc:0 "Municipal welfare organisations cannot compensate indefinitely for weak physical connections. Improvements to roads and service links will help local institutions reach residents and make their public responsibilities easier to sustain."
 ISR70_p12_ca:0 "Integration into the Civic Order"
 ISR70_p12_ca_desc:0 "Integrate the municipal reform movement into common civic institutions."
 ISR70_p12_ca_deepen:0 "Public Scrutiny of Civic Institutions"
 ISR70_p12_ca_deepen_desc:0 "Participation in common civic institutions must include the power to question their administration. Public scrutiny will give municipal representatives a way to insist that equal citizenship is reflected in the state's everyday conduct."
 ISR70_p12_cb:0 "Autonomous Municipal Institutions"
 ISR70_p12_cb_desc:0 "Give municipal institutions greater administrative autonomy."
 ISR70_p12_cb_deepen:0 "Capable Autonomous Municipal Services"
 ISR70_p12_cb_deepen_desc:0 "Local autonomy requires more than a legal boundary around municipal powers. Better organised services will give councils the capacity to exercise those powers and build residents' confidence in their community institutions."
 ISR70_p12_finish:0 "A Political Voice for the Municipalities"
 ISR70_p12_finish_desc:0 "The municipal reform list must translate parliamentary influence into institutions that residents can rely on. Its chosen settlement between common citizenship and local authority will define how Arab municipalities participate in the wider political order."
 ISR70_p13_institution:0 "The Orthodox Parliamentary Bloc"
 ISR70_p13_institution_desc:0 "Organize an Orthodox parliamentary bloc that negotiates education, community services and religious practice."
 ISR70_p13_ea:0 "Vocational Education and Religious Study"
 ISR70_p13_ea_desc:0 "Connect religious study and vocational qualifications without treating Orthodox representation as a dictatorship."
 ISR70_p13_ea_deepen:0 "Trades alongside Religious Learning"
 ISR70_p13_ea_deepen_desc:0 "Orthodox families need ways to acquire technical qualifications without abandoning religious study. A sustained training framework will allow community institutions to support productive work while retaining the educational commitments at the heart of the parliamentary bloc."
 ISR70_p13_eb:0 "Community Social Provision"
 ISR70_p13_eb_desc:0 "Expand community social provision and local welfare institutions."
 ISR70_p13_eb_deepen:0 "Professional Community Care"
 ISR70_p13_eb_deepen_desc:0 "Charitable provision must manage increasingly complex health and welfare needs. Better administration will help community organisations use their resources consistently and reduce dependence on improvised arrangements when households require continuing assistance."
 ISR70_p13_ca:0 "The Religious Status Quo"
 ISR70_p13_ca_desc:0 "Renew the religious status quo through parliamentary negotiation."
 ISR70_p13_ca_deepen:0 "A Parliamentary Religious Settlement"
 ISR70_p13_ca_deepen_desc:0 "The religious status quo needs a workable agreement among parties that disagree about the state's character. A durable parliamentary settlement will give Orthodox representatives a basis for defending their institutions while sustaining the government they have helped to form."
 ISR70_p13_cb:0 "Voluntary Civilian Service"
 ISR70_p13_cb_desc:0 "Develop voluntary civilian service that respects the movement's religious institutions."
 ISR70_p13_cb_deepen:0 "Civilian Service Links for Communities"
 ISR70_p13_cb_deepen_desc:0 "Voluntary service will be useful only if it connects participants to real local needs. Better links between development-town communities and their service organisations will give the Orthodox compromise a practical public purpose."
 ISR70_p13_finish:0 "A Sustainable Religious Compromise"
 ISR70_p13_finish_desc:0 "Agudat Israel and Poalei Agudat must defend their communities while meeting the responsibilities of parliamentary government. Their chosen balance of education, welfare and public service will determine whether religious accommodation can sustain confidence beyond the immediate coalition bargain."
 ISR70_p14_institution:0 "Pragmatic State Leadership"
 ISR70_p14_institution_desc:0 "Build a pragmatic state leadership around professional administration and workable parliamentary support."
 ISR70_p14_ea:0 "Professional State Enterprises"
 ISR70_p14_ea_desc:0 "Professionalize state enterprises through clear procurement and production rules."
 ISR70_p14_ea_deepen:0 "Professional Management in Haifa"
 ISR70_p14_ea_deepen_desc:0 "Public enterprises need managers able to answer for production rather than political sponsorship. Industrial investment in Haifa will give the pragmatic right an opportunity to demonstrate that the state's economic role can be administered with clear commercial responsibilities."
 ISR70_p14_eb:0 "Promote Private Enterprise"
 ISR70_p14_eb_desc:0 "Promote private enterprise and competitive investment."
 ISR70_p14_eb_deepen:0 "Commercial Initiative in Tel Aviv"
 ISR70_p14_eb_deepen_desc:0 "Private commerce offers the pragmatic cabinet another route to employment and development. A Tel Aviv office district will create room for that initiative while testing the government's ability to support enterprise without extending unnecessary administrative control."
 ISR70_p14_ca:0 "Security Pragmatism"
 ISR70_p14_ca_desc:0 "Pursue pragmatic security through trained forces and defensive planning."
 ISR70_p14_ca_deepen:0 "Sustain a Defensive Posture"
 ISR70_p14_ca_deepen_desc:0 "A restrained security policy still requires reliable supplies and a force organised for its assigned tasks. Reducing the practical burden of sustaining that posture will help the cabinet keep readiness within its economic means."
 ISR70_p14_cb:0 "Territorial Negotiations"
 ISR70_p14_cb_desc:0 "Give territorial negotiators a pragmatic cabinet mandate. This does not impose an agreement on a neighbor."
 ISR70_p14_cb_deepen:0 "Public Confidence for Negotiations"
 ISR70_p14_cb_deepen_desc:0 "Territorial negotiations require a domestic political foundation as well as diplomatic contacts. The pragmatic cabinet will build confidence in its approach so that talks can proceed without every concession becoming a crisis of authority."
 ISR70_p14_finish:0 "Pragmatism as Statecraft"
 ISR70_p14_finish_desc:0 "The State List and its partners seek a government judged by workable administration rather than a comprehensive ideological programme. Their record in enterprise management and security policy will determine whether pragmatism can command a stable parliamentary constituency."
 ISR70_p15_institution:0 "An Elite Development Alliance"
 ISR70_p15_institution_desc:0 "Create a development alliance between municipal notables and productive investment interests."
 ISR70_imp_investment_reward_tt:0 "$imp_investment_reward$: $RIGHT|+=%1$"
 ISR70_p15_ea:0 "Diaspora Capital with Oversight"
 ISR70_p15_ea_desc:0 "Channel diaspora capital through supervised and published investment contracts."
 ISR70_p15_ea_deepen:0 "Supervised Investment in Tel Aviv"
 ISR70_p15_ea_deepen_desc:0 "Diaspora investment must create productive facilities under terms the state can supervise. A new Tel Aviv office district will test whether the development alliance can attract capital while keeping public responsibilities separate from the interests of its sponsors."
 ISR70_p15_eb:0 "Privileged Concessions"
 ISR70_p15_eb_desc:0 "Accelerate investment through privileged concessions. The price is higher corruption-related expenditure."
 ISR70_p15_eb_deepen:0 "The Haifa Industrial Concession"
 ISR70_p15_eb_deepen_desc:0 "Privileged concessions will be justified by their supporters as a faster route to industrial development. Investment in Haifa will give the sponsors new productive capacity while making the political distribution of opportunity increasingly visible."
 ISR70_p15_ca:0 "Transparent Investment Contracts"
 ISR70_p15_ca_desc:0 "Require public oversight of investment contracts and concession income."
 ISR70_p15_ca_deepen:0 "A Professional Contract Administration"
 ISR70_p15_ca_deepen_desc:0 "Transparent investment contracts depend on officials who can inspect and enforce them. A more capable administration will reduce routine burdens while giving the development alliance a credible alternative to informal bargains with favoured investors."
 ISR70_p15_cb:0 "Political Patronage Networks"
 ISR70_p15_cb_desc:0 "Build patronage networks that secure political capacity at the expense of clean public spending."
 ISR70_p15_cb_deepen:0 "Construction through the Patronage Network"
 ISR70_p15_cb_deepen_desc:0 "The alliance will consolidate the network of notables and investors through which its building programme operates. This can strengthen its political organisation and delivery capacity, while tying development more closely to continued access to the governing coalition."
 ISR70_p15_finish:0 "The Investment State"
 ISR70_p15_finish_desc:0 "The development alliance must decide what its investment record says about the state it governs. Supervised capital and privileged concessions lead to different relationships between public authority and private wealth, even when both promise growth and new employment."
 ISR70_p16_institution:0 "A Free Press and Political Public Life"
 ISR70_p16_institution_desc:0 "Defend a free press and open political organization as the foundation of a secular civil-rights programme."
 ISR70_p16_ea:0 "A Civil-Rights Reform Economy"
 ISR70_p16_ea_desc:0 "Combine a civil-rights reform economy with investment access and public education."
 ISR70_p16_ea_deepen:0 "Qualifications for Civilian Electronics"
 ISR70_p16_ea_deepen_desc:0 "A civil-rights economy needs productive opportunities alongside constitutional promises. Technical qualifications and research in civilian electronics will give the Free Citizens movement a development programme that reaches beyond the defence establishment and established political enterprises."
 ISR70_p16_eb:0 "Radical Debureaucratization"
 ISR70_p16_eb_desc:0 "Cut routine bureaucracy and let private firms enter services more easily."
 ISR70_p16_eb_deepen:0 "Commercial Capacity without the Old Bureaucracy"
 ISR70_p16_eb_deepen_desc:0 "Removing administrative barriers must be followed by opportunities for firms to operate. New commercial offices in Tel Aviv will give the movement's economic alternative a practical base rather than leaving reform confined to the repeal of rules."
 ISR70_p16_ca:0 "A Secular Civic State"
 ISR70_p16_ca_desc:0 "Establish secular civic institutions and a free public sphere."
 ISR70_p16_ca_deepen:0 "Independent Scrutiny of the Secular State"
 ISR70_p16_ca_deepen_desc:0 "Secular government must be accountable in practice, including when its ministers claim to act in the name of civil freedom. An independent public audit will test the administration against standards that do not depend on loyalty to the movement."
 ISR70_p16_cb:0 "Decentralized Municipalities"
 ISR70_p16_cb_desc:0 "Decentralize public decisions to elected municipalities."
 ISR70_p16_cb_deepen:0 "Municipal Connections in the Negev"
 ISR70_p16_cb_deepen_desc:0 "Decentralisation will fail if local institutions lack the means to deliver services. Better municipal connections in the Negev will give councils practical responsibilities and resources, rather than merely transferring obligations away from the centre."
 ISR70_p16_finish:0 "A State of Free Citizens"
 ISR70_p16_finish_desc:0 "HaOlam HaZeh's programme seeks a political public life in which citizens can question the state without losing their place in it. Its chosen economic and municipal institutions must show that civil freedom can also support competent government and useful development."
 ISR70_p17_institution:0 "Development and Landscape Protection"
 ISR70_p17_institution_desc:0 "Create professional institutions for landscape protection, water policy and development planning."
 ISR70_p17_ea:0 "Water-Efficient Agriculture"
 ISR70_p17_ea_desc:0 "Use water-efficient agriculture as the basis of landscape protection."
 ISR70_p17_ea_deepen:0 "Planned Cultivation in the Negev"
 ISR70_p17_ea_deepen_desc:0 "Agricultural expansion must account for water and land constraints before new districts are laid out. A carefully planned Negev investment will test whether productive cultivation can proceed without treating the landscape as an unlimited reserve for development."
 ISR70_p17_eb:0 "Clean Industry and Research"
 ISR70_p17_eb_desc:0 "Invest in cleaner industrial methods and energy-efficiency research."
 ISR70_industry_repair_factor_tt:0 "$MODIFIER_INDUSTRY_REPAIR_FACTOR$: $RIGHT|+=%1$"
 ISR70_p17_eb_deepen:0 "Industrial Repair and Resource Efficiency"
 ISR70_p17_eb_deepen_desc:0 "An environmental programme can improve existing industry rather than simply oppose further building. Better repair and production methods will seek more useful output from the facilities already in place and strengthen the case for technically informed conservation."
 ISR70_p17_ca:0 "Municipal Conservation Planning"
 ISR70_p17_ca_desc:0 "Give municipalities professional conservation and land-use planning."
 ISR70_p17_ca_deepen:0 "Conservation in Public Works"
 ISR70_p17_ca_deepen_desc:0 "Municipal conservation plans need to influence how infrastructure is actually delivered. Applying them to public works will connect the environmental league's proposals to the decisions through which towns use land, services and building resources."
 ISR70_p17_cb:0 "Social and Environmental Infrastructure"
 ISR70_p17_cb_desc:0 "Combine environmental goals with social and public-transport provision."
 ISR70_p17_cb_deepen:0 "Healthier Services for the Development Towns"
 ISR70_p17_cb_deepen_desc:0 "The quality of local services is part of the environment in which people live. Investment in development-town infrastructure and health administration will give the league's social programme a practical connection to household needs."
 ISR70_p17_finish:0 "A Livable Development Strategy"
 ISR70_p17_finish_desc:0 "The environmental league must show that protection of land and water can guide development rather than suspend it. Its record in agriculture, industrial methods and municipal provision will determine whether conservation becomes a dependable part of public administration."
 ISR70_p18_institution:0 "An Independent Socialist Left"
 ISR70_p18_institution_desc:0 "Establish Mapam's independent political institutions after its separation from the Alignment."
 ISR70_p18_ea:0 "A Cooperative Welfare State"
 ISR70_p18_ea_desc:0 "Build a cooperative welfare economy around organized labor."
 ISR70_p18_ea_deepen:0 "Cooperative Production in the Negev"
 ISR70_p18_ea_deepen_desc:0 "Mapam's cooperative commitments require investment in the institutions that sustain rural work. A Negev agricultural district will give the independent left a concrete project through which shared ownership can be judged by practical production and local development."
 ISR70_p18_eb:0 "Municipal Development and Education"
 ISR70_p18_eb_desc:0 "Prioritize municipal development and education over expanding the cooperative production sector."
 ISR70_p18_eb_deepen:0 "Applied Education for the Development Towns"
 ISR70_p18_eb_deepen_desc:0 "Education must connect neglected communities to the skills and services needed for productive work. Applied teaching and local infrastructure will give Mapam's municipal programme a stronger foundation in the development towns."
 ISR70_p18_ca:0 "A Negotiated Peace"
 ISR70_p18_ca_desc:0 "Give negotiated peace a clear parliamentary mandate."
 ISR70_p18_ca_deepen:0 "Elected Scrutiny of a Peace Settlement"
 ISR70_p18_ca_deepen_desc:0 "A negotiated peace must rest on public institutions able to scrutinise its terms. Strengthening confidence in elected government will give the independent left a domestic basis for diplomacy without assuming that negotiations themselves guarantee agreement."
 ISR70_p18_cb:0 "A Binational Constitutional Convention"
 ISR70_p18_cb_desc:0 "A binational constitutional convention would require equal civic institutions and representatives prepared to negotiate a common political settlement."
 ISR70_p18_cb_deepen:0 "Municipal Rights in the Constitutional Convention"
 ISR70_p18_cb_deepen_desc:0 "A binational constitutional project must address who can question public officials and how communities are represented. Civil rights and municipal accountability will give the proposed settlement a practical institutional content beyond its founding declaration."
 ISR70_p18_finish:0 "Socialism and Equal Rights"
 ISR70_p18_finish_desc:0 "Mapam's independent programme links cooperative production to Jewish-Arab equality and an alternative diplomatic course. It must demonstrate that these commitments can support the same government, rather than leave social policy, citizenship and peace as separate aspirations."
 ISR70_p19_institution:0 "Independent Workers' Politics"
 ISR70_p19_institution_desc:0 "Build independent communist institutions around workers' representation and Jewish-Arab cooperation."
 ISR70_p19_ea:0 "Jewish-Arab Industrial Enterprises"
 ISR70_p19_ea_desc:0 "Support Jewish-Arab industrial enterprises through common worker training."
 ISR70_p19_ea_deepen:0 "Workers' Industry in Haifa"
 ISR70_p19_ea_deepen_desc:0 "Independent communist policy must create productive work without relying on another bloc's industrial institutions. A Haifa complex will provide a practical base for the workers' programme and expose its managers to the responsibilities of sustained production."
 ISR70_p19_eb:0 "Democratic Economic Planning"
 ISR70_p19_eb_desc:0 "Use democratic economic planning to coordinate public investment."
 ISR70_p19_eb_deepen:0 "Planning Skills for Public Enterprises"
 ISR70_p19_eb_deepen_desc:0 "Democratic planning requires information and technical judgement as well as assemblies. Improving those skills will help public enterprises coordinate production while giving workers a clearer understanding of the decisions made in their name."
 ISR70_p19_ca:0 "Parliamentary Workers' Rights"
 ISR70_p19_ca_desc:0 "Entrench parliamentary workers' rights and open elections."
 ISR70_p19_ca_deepen:0 "Accountable Workers' Representation"
 ISR70_p19_ca_deepen_desc:0 "Workers' representatives need institutions through which they can question administrators rather than merely endorse them. Auditing the state will test the independent communist commitment to parliamentary rights and the accountability of its own officeholders."
 ISR70_p19_cb:0 "Constitutionally Limited Councils"
 ISR70_p19_cb_desc:0 "Give workers' councils constitutionally limited administrative powers."
 ISR70_p19_cb_deepen:0 "Councils and the Elected Legislature"
 ISR70_p19_cb_deepen_desc:0 "Councils cannot provide a durable constitutional alternative if their authority remains undefined. A negotiated division of responsibilities with the elected legislature will give the workers' institutions a place within government while limiting rival claims to unrestricted power."
 ISR70_p19_finish:0 "An Independent Workers' Republic"
 ISR70_p19_finish_desc:0 "Maki's independent course must reconcile workers' organisation with the practical demands of governing a divided society. Its economic and constitutional choices will determine whether public enterprise and political accountability can reinforce one another without submitting to an outside model."
 ISR70_p20_institution:0 "A New National Opposition"
 ISR70_p20_institution_desc:0 "Build a national opposition with enough institutional depth to govern through its chosen constitutional route."
 ISR70_p20_ea:0 "Small Business in Development Towns"
 ISR70_p20_ea_desc:0 "Use development-town small businesses as a national economic base."
 ISR70_p20_ea_deepen:0 "Enterprise in the Development Towns"
 ISR70_p20_ea_deepen_desc:0 "The national opposition's economic promises must reach smaller firms outside established centres. A commercial office district in the Negev will give the development towns a concrete stake in the proposed national majority."
 ISR70_p20_eb:0 "A National Industrial Pact"
 ISR70_p20_eb_desc:0 "Negotiate a national industrial pact with workers and manufacturers."
 ISR70_p20_eb_deepen:0 "The Haifa Industrial Pact"
 ISR70_p20_eb_deepen_desc:0 "A national industrial pact needs productive capacity behind its political commitments. Investment in Haifa will test whether employers and public authorities can carry a common development programme beyond campaign declarations."
 ISR70_p20_ca:0 "Parliamentary National Populism"
 ISR70_p20_ca_desc:0 "Keep national populism within a parliamentary system with ordinary elections."
 ISR70_p20_ca_deepen:0 "Oversight of a National Parliamentary Cabinet"
 ISR70_p20_ca_deepen_desc:0 "A national majority can strengthen government without removing parliamentary restraints. More professional administration and oversight will require the cabinet to accept scrutiny even when it claims a broad popular mandate."
 ISR70_p20_cb:0 "A Presidential Popular Mandate"
 ISR70_p20_cb_desc:0 "Seek an elected presidential mandate while preserving elections."
 ISR70_p20_cb_deepen:0 "Institutions for the Popular Mandate"
 ISR70_p20_cb_deepen_desc:0 "A presidential popular mandate needs organisations able to sustain national mobilisation beyond an election campaign. Consolidating those institutions will strengthen the executive's political reach and bind its programme more closely to continuing popular support."
 ISR70_p20_finish:0 "A National Majority Movement"
 ISR70_p20_finish_desc:0 "The Free Center and its partners seek to turn a national opposition into a governing majority. Their chosen relationship between industry, small enterprise and executive authority will determine whether that majority remains a parliamentary coalition or becomes a presidential movement."
 ISR70_p21_institution:0 "Form a Radical Alliance"
 ISR70_p21_institution_desc:0 "Organize a radical national alliance. Its later constitutional choice determines whether it accepts legal limits or an authoritarian order."
 ISR70_imp_sanction_resistance_tt:0 "$imp_sanction_resistance$: $RIGHT|+=%1$"
 ISR70_p21_ea:0 "An Autonomous Defense Industry"
 ISR70_p21_ea_desc:0 "Build an autonomous domestic defense industry to reduce external dependence."
 ISR70_p21_ea_deepen:0 "Domestic Arms Production in Tel Aviv"
 ISR70_p21_ea_deepen_desc:0 "An autonomous defence economy requires factories as well as political resolve. A funded arms facility in Tel Aviv will give the radical alliance a concrete industrial commitment, with resources that cannot simultaneously be spent on civilian development."
 ISR70_p21_eb:0 "A National Mobilization Fund"
 ISR70_p21_eb_desc:0 "Create a mobilization fund for reserve training and military production."
 ISR70_p21_eb_deepen:0 "Training for National Mobilisation"
 ISR70_p21_eb_deepen_desc:0 "A mobilisation fund must prepare people and production to meet its demands. Practical training and support for arms construction will strengthen the radical movement's capacity to organise the country around its military priorities."
 ISR70_p21_ca:0 "Radical Politics within Legal Limits"
 ISR70_p21_ca_desc:0 "Accept legal limits on radical political organization and retain ordinary elections."
 ISR70_p21_ca_deepen:0 "Civil Authority over Radical Politics"
 ISR70_p21_ca_deepen_desc:0 "Legal limits require civilian institutions with the authority to enforce them. Strengthening those bodies will test whether the radical alliance accepts constitutional restraint when it obstructs the ambitions of its own supporters."
 ISR70_p21_cb:0 "An Authoritarian Security State"
 ISR70_p21_cb_desc:0 "Establish an authoritarian security order and suspend elections. The constitutional confrontation causes an immediate stability loss."
 ISR70_p21_cb_deepen:0 "The Security Apparatus of the Radical State"
 ISR70_p21_cb_deepen_desc:0 "An authoritarian security course will concentrate attention on the institutions that organise and protect the regime. Military coordination and the security apparatus will become a stronger foundation of political authority, binding mobilisation to the survival of the governing movement."
 ISR70_p21_finish:0 "The Radical State Order"
 ISR70_p21_finish_desc:0 "The radical alliance has chosen how far mobilisation should reshape public authority and the economy. Its final settlement must give that choice institutional form, whether through accepted legal limits or an enduring security order centred on the movement itself."
 ISR70_p22_institution:0 "The Emergency Mandate"
 ISR70_p22_institution_desc:0 "Organize an emergency cabinet around defined military responsibilities and a genuine constitutional crisis."
 ISR70_p22_ea:0 "Centralize Defense Logistics"
 ISR70_p22_ea_desc:0 "Centralize defense logistics to reduce the supply burden of the emergency force."
 ISR70_p22_ea_deepen:0 "Emergency Procurement at Home"
 ISR70_p22_ea_deepen_desc:0 "The emergency cabinet cannot rely entirely on supply decisions made abroad. A military factory in Tel Aviv will strengthen the domestic procurement base while committing resources to the priorities set by the armed forces."
 ISR70_p22_eb:0 "Bring in Civilian Technocrats"
 ISR70_p22_eb_desc:0 "Bring civilian technocrats into the emergency government and reduce administrative waste."
 ISR70_p22_eb_deepen:0 "Civilian Standards for Emergency Industry"
 ISR70_p22_eb_deepen_desc:0 "Civilian engineers bring methods that the emergency administration cannot provide through command alone. Applying their standards to industrial and construction planning will help the cabinet turn urgent orders into projects that can be reliably delivered."
 ISR70_p22_ca:0 "A Limited Emergency with Elections"
 ISR70_p22_ca_desc:0 "Limit the emergency and restore ordinary elections."
 ISR70_p22_ca_deepen:0 "Scrutinise Emergency Procurement"
 ISR70_p22_ca_deepen_desc:0 "Emergency authority must not make procurement immune to inspection. An audit of contracts and administration will help restore civilian confidence and test whether the cabinet is preparing to return exceptional powers rather than make them permanent."
 ISR70_p22_cb:0 "Permanent Military Rule"
 ISR70_p22_cb_desc:0 "Make military rule permanent and suspend ordinary elections."
 ISR70_p22_cb_deepen:0 "A Standing Military Command Structure"
 ISR70_p22_cb_deepen_desc:0 "Permanent military rule requires a command system able to govern beyond the immediate crisis. Consolidating that structure and its mobilisation programme will strengthen the armed forces' hold on responsibilities normally exercised by civilian institutions."
 ISR70_p22_finish:0 "The Future of the Emergency Cabinet"
 ISR70_p22_finish_desc:0 "The emergency cabinet must now give effect to its constitutional choice. A return to civilian rule and a permanent military order require different institutions, but neither can avoid answering for the procurement and mobilisation programme conducted under exceptional authority."
 ISR70_p23_institution:0 "A Constituent Crown Assembly"
 ISR70_p23_institution_desc:0 "Create a constituent assembly for the explicitly chosen crown settlement. Its powers remain subject to the later constitutional choice."
 ISR70_p23_ea:0 "Endowments and Public Works"
 ISR70_p23_ea_desc:0 "Use public endowments for local works rather than private royal industrial corporations."
 ISR70_p23_ea_deepen:0 "Public Works for the Southern Communities"
 ISR70_p23_ea_deepen_desc:0 "The proposed crown must establish a public purpose beyond its ceremonial foundation. Infrastructure in the Negev will give its endowments and public-works programme a concrete connection to communities whose support cannot be secured by constitutional symbolism alone."
 ISR70_p23_eb:0 "Royal Industrial Companies"
 ISR70_p23_eb_desc:0 "Create professionally run royal industrial companies under the new constitutional settlement."
 ISR70_p23_eb_deepen:0 "Royal Industry in Haifa"
 ISR70_p23_eb_deepen_desc:0 "Royal industrial companies will be expected to support the new settlement through productive investment. A Haifa complex will test whether enterprises associated with the crown can serve a national development purpose rather than merely provide another source of patronage."
 ISR70_p23_ca:0 "A Parliamentary Crown"
 ISR70_p23_ca_desc:0 "Establish a parliamentary crown with ordinary elections and a responsible cabinet."
 ISR70_p23_ca_deepen:0 "Parliamentary Scrutiny of Crown Expenditure"
 ISR70_p23_ca_deepen_desc:0 "A parliamentary crown must accept scrutiny of the money and officials attached to it. Clear oversight will make the constitutional settlement credible by applying public standards to the institutions through which royal authority is exercised."
 ISR70_p23_cb:0 "Personal Royal Government"
 ISR70_p23_cb_desc:0 "Establish personal royal government and suspend ordinary elections."
 ISR70_p23_cb_deepen:0 "The Crown's Executive Institutions"
 ISR70_p23_cb_deepen_desc:0 "Personal royal government requires an administration that answers directly to the sovereign. Consolidating executive institutions and national service will give that choice practical force, while making the crown responsible for the results of its own governing programme."
 ISR70_p23_finish:0 "The Crown and Israeli Statehood"
 ISR70_p23_finish_desc:0 "The new crown must live within the constitutional settlement chosen at its foundation. Its economic and public-service record will determine whether it becomes an institution sustained by parliamentary confidence or the centre of a more personal form of government."
 ISR70_alignment_balance:0 "Labor and Mapam in the Alliance"
 ISR70_alignment_balance_desc:0 "Negotiate a workable Labor-Mapam balance and improve union confidence inside the Alignment."
 ISR70_golda_labour:0 "Include the Unions in Modernization"
 ISR70_golda_labour_desc:0 "Modernize Histadrut enterprises through negotiated workplace standards and worker training."
 ISR70_golda_manager:0 "Professional Enterprise Management"
 ISR70_golda_manager_desc:0 "Give professional managers clearer production targets and invest in modern industrial methods."
 ISR70_golda_panthers:0 "Take the Social Protest Seriously"
 ISR70_golda_panthers_desc:0 "The development towns demand a hearing on housing, schools and access to work. The cabinet must decide how to respond to a growing protest movement."
 ISR70_golda_housing:0 "Housing for the Development Towns"
 ISR70_golda_housing_desc:0 "Fund development-town housing and local infrastructure, reducing the cost of future social provision."
 ISR70_golda_succession_outcome_tt:0 "Opens a leadership event: retain Golda Meir, choose Yitzhak Rabin, or choose Shimon Peres."
 ISR70_golda_succession:0 "Leadership after Golda"
 ISR70_golda_succession_desc:0 "Golda Meir holds the Alignment together, but Rabin and Peres offer different visions for its future. The party must settle who will lead its next cabinet."
 ISR70_rabin_chosen_condition_tt:0 "Yitzhak Rabin leads the Alignment."
 ISR70_rabin_cabinet:0 "Rabin's Reform Cabinet"
 ISR70_rabin_cabinet_desc:0 "A Rabin cabinet emphasizes professional administration and readiness, with a one-level anti-corruption reform."
 ISR70_peres_chosen_condition_tt:0 "Shimon Peres leads the Alignment."
 ISR70_peres_cabinet:0 "Peres and the Industrial Future"
 ISR70_peres_cabinet_desc:0 "A Peres cabinet emphasizes industrial modernization and domestic defense engineering."
 ISR70_gahal_identity:0 "Herut and the Liberals: The Identity Question"
 ISR70_gahal_identity_desc:0 "Settle the working relationship between Herut and the Liberal Party before choosing a broad alliance or a united party."
 ISR70_gahal_coalition:0 "Retain Gahal as a Broad Alliance"
 ISR70_gahal_coalition_desc:0 "Keep Gahal as a broad alliance with room for its constituent parties."
 ISR70_early_likud_authorized_condition_tt:0 "An early Likud foundation has been authorized."
 ISR70_likud_foundation:0 "Found a United Likud List"
 ISR70_likud_foundation_desc:0 "Form a united Likud list as an explicit political foundation, increase its support and update its displayed identity."
 ISR70_economic_plan:0 "An Economic Plan for the Seventies"
 ISR70_economic_plan_desc:0 "Industry, agriculture and public infrastructure must keep pace with a growing population. A national economic programme will coordinate investment for the coming decade."
 ISR70_water:0 "Water as a Basis for Development"
 ISR70_water_desc:0 "Improve the National Water Carrier and irrigation engineering. Agricultural research supports the next stage."
 ISR70_negev_agriculture:0 "Irrigation and Agronomy in the Negev"
 ISR70_negev_agriculture_desc:0 "Water and agricultural engineering can give southern communities a more secure livelihood. New irrigated districts will bring cultivation and employment to the Negev."
 ISR70_water_maintenance:0 "Maintain the Water Network"
 ISR70_water_maintenance_desc:0 "Fund pumps, workshops and repairs so farms and public utilities recover more quickly."
 ISR70_haifa_industry:0 "Haifa as an Industrial Center"
 ISR70_haifa_industry_desc:0 "Expand the civilian industrial base in Haifa and give the new plant a funded capital budget."
 ISR70_tel_aviv_offices:0 "Services in Tel Aviv"
 ISR70_tel_aviv_offices_desc:0 "Add a commercial office district in Tel Aviv for services, export finance and municipal employment."
 ISR70_negev_roads:0 "Roads to the Development Towns"
 ISR70_negev_roads_desc:0 "Connect southern development towns with an additional infrastructure level in the Negev."
 ISR70_power_grid:0 "A Reliable Electricity Network"
 ISR70_power_grid_desc:0 "Expand fossil electricity generation to serve the growing industrial and office sectors."
 ISR70_exports:0 "Diamonds, Tools and Export Orders"
 ISR70_exports_desc:0 "Support diamond cutting, precision tools and export finance. Local businesses gain confidence and offices expand faster."
 ISR70_import_substitution:0 "Strategic Import Substitution"
 ISR70_import_substitution_desc:0 "Foreign embargoes expose the vulnerabilities of an economy dependent on imported machinery. Domestic production must be able to sustain essential industries under pressure."
 ISR70_export_specialization:0 "Specialize for Export Markets"
 ISR70_export_specialization_desc:0 "Specialize in higher-value exports and foreign investment. Greater world-market exposure makes external market swings more consequential."
 ISR70_diaspora_bonds:0 "Diaspora Capital for Real Projects"
 ISR70_diaspora_bonds_desc:0 "Diaspora savings can support public investment through a credible bond programme. Transparent administration and durable projects will be essential to retaining investors' confidence."
 ISR70_investment_scrutiny:0 "Scrutinize Investment Contracts"
 ISR70_investment_scrutiny_desc:0 "Publish investment contracts and subject concessions to independent audits. Public confidence requires clear terms and officials who can be held accountable."
 ISR70_civil_electronics:0 "Civilian Electronics and Skilled Workers"
 ISR70_civil_electronics_desc:0 "Technical workshops and civilian electronics can become a new foundation for industrial development. Skilled engineers will connect university research with practical manufacturing."
 ISR70_technion:0 "Technion and Applied Research"
 ISR70_technion_desc:0 "Fund applied research at the Technion. Construction research and a permanent national research improvement support civilian and defense engineering."
 ISR70_sme_credit:0 "Credit for Productive Small Businesses"
 ISR70_sme_credit_desc:0 "Guarantee productive small-business credit and reduce the cost of incoming investment."
 ISR70_civil_plant:0 "Further Industrial Development"
 ISR70_civil_plant_desc:0 "Establish a civilian industrial complex in the Negev and develop its production methods."
 ISR70_fiscal_review:0 "Growth and Public Finances"
 ISR70_fiscal_review_desc:0 "Prepare a fiscal review and give the cabinet political capital for its budget choice."
 ISR70_steady_budget:0 "Gradual Fiscal Consolidation"
 ISR70_steady_budget_desc:0 "Improve sovereign credit through a credible consolidation programme. Interest rates fall without forcing new cuts into unrelated policies."
 ISR70_development_budget:0 "Development before Short-Term Consolidation"
 ISR70_development_budget_desc:0 "Commit a funded development budget to construction and industrial research."
 ISR70_social_contract:0 "A Social Development Compact"
 ISR70_social_contract_desc:0 "Agree a social compact between workers, employers and municipalities."
 ISR70_vocational:0 "Vocational Education for New Citizens"
 ISR70_vocational_desc:0 "Expand vocational schools for new immigrants and industrial workers. Training improves productivity and industrial research."
 ISR70_development_towns:0 "Connect the Development Towns"
 ISR70_development_towns_desc:0 "Connect development towns to employment and public services with funded infrastructure in the Negev."
 ISR70_absorption_reform:0 "Integrate Immigration for the Long Term"
 ISR70_absorption_reform_desc:0 "Replace the starting immigration bottleneck with integrated housing, employment and education. Population growth remains while the starting social-cost surcharge is removed."
 ISR70_religion_state:0 "Negotiate Religion and the State"
 ISR70_religion_state_desc:0 "Open negotiations over personal status, religious education and public service before choosing a settlement."
 ISR70_religious_compromise:0 "Renew the Religious Compromise"
 ISR70_religious_compromise_desc:0 "Renew the parliamentary religious compromise. Religious institutions gain confidence and a more stable settlement supports government."
 ISR70_civil_marriage:0 "Civil Personal-Status Options"
 ISR70_civil_marriage_desc:0 "Introduce civilian personal-status options and strengthen secular civic institutions. This political reform grants a distinct gain in political capacity."
 ISR70_national_service:0 "The Question of Shared Service"
 ISR70_national_service_desc:0 "Prepare a common public-service framework and strengthen the institutions that organize it."
 ISR70_volunteer_service:0 "Voluntary Municipal Civilian Service"
 ISR70_volunteer_service_desc:0 "Organize voluntary municipal civilian service. Social administration becomes cheaper and the civic settlement gains confidence."
 ISR70_service_expansion:0 "Expand Military Training"
 ISR70_service_expansion_desc:0 "Expand training facilities and improve military call-up speed, with immediate army experience."
 ISR70_universities:0 "Research between Jerusalem and Haifa"
 ISR70_universities_desc:0 "Increase university capacity in Jerusalem and Haifa, financing research staff and two electronics projects."
 ISR70_public_health:0 "Healthcare beyond the Metropolises"
 ISR70_public_health_desc:0 "Extend clinics and professional healthcare administration beyond the largest cities."
 ISR70_staff:0 "The General Staff and the Security Situation"
 ISR70_staff_desc:0 "Review the General Staff organization and turn the experience of the previous war into usable planning capacity."
 ISR70_reserve_system:0 "Keep the Reserve Ready"
 ISR70_reserve_system_desc:0 "Replace the starting citizen-army spirit with an organized reserve system. Mobilization and unit cohesion improve."
 ISR70_defensive_depth:0 "Defense in Depth"
 ISR70_defensive_depth_desc:0 "Train layered defenses and improve defensive coordination."
 ISR70_maneuver:0 "Mobile Operational Reserves"
 ISR70_maneuver_desc:0 "Build mobile operational reserves around staff exercises and rapid planning."
 ISR70_armour_programme:0 "Tal and the Domestic Tank Programme"
 ISR70_armour_programme_desc:0 "Israel Tal advocates a tank designed around the needs of Israeli crews and the lessons of recent wars. Domestic engineering and sustained trials will be necessary to carry that ambition forward."
 ISR70_survivability:0 "Crew Protection and Maintenance"
 ISR70_survivability_desc:0 "Prioritize crew protection, repairability and standardized maintenance in the armored force."
 ISR70_armour_mobility:0 "Mobility and Tactical Employment"
 ISR70_armour_mobility_desc:0 "Prioritize tactical mobility and armored coordination rather than the alternative protection package."
 ISR70_imi:0 "IMI and Domestic Manufacturing"
 ISR70_imi_desc:0 "Add an IMI military factory in Tel Aviv and support contemporary infantry-weapons development."
 ISR70_artillery:0 "Artillery and Counter-Battery Reconnaissance"
 ISR70_artillery_desc:0 "Recent fighting has demonstrated the importance of responsive fire support and counter-battery work. The artillery arm needs better training and a coherent development programme."
 ISR70_engineers:0 "Engineers and Combat Supply"
 ISR70_engineers_desc:0 "Improve field engineering, reconnaissance and combat supply rather than simply expanding the force."
 ISR70_special_forces:0 "Special Forces with Clear Missions"
 ISR70_special_forces_desc:0 "Fund specialist training and contemporary special-forces equipment research."
 ISR70_air_staff:0 "The Air Force after the Embargo"
 ISR70_air_staff_desc:0 "Reorganize the air staff around sortie generation, training and the lessons of the arms embargo."
 ISR70_us_military_agreement_condition_tt:0 "American military supply cooperation has been accepted."
 ISR70_foreign_aircraft:0 "Delivery Contracts over Domestic Development"
 ISR70_foreign_aircraft_desc:0 "A reliable American supply channel allows the air force to plan its next generation of aircraft. Conversion training and maintenance arrangements must accompany procurement."
 ISR70_local_aircraft:0 "IAI and a Domestic Aircraft Industry"
 ISR70_local_aircraft_desc:0 "Israel Aircraft Industries can reduce dependence on foreign suppliers. Domestic design teams, workshops and flight trials will require sustained government backing."
 ISR70_air_maintenance:0 "Training, Maintenance and Spare Parts"
 ISR70_air_maintenance_desc:0 "Improve training, spare parts and maintenance. A completed domestic aircraft programme removes the starting embargo penalty."
 ISR70_airfield:0 "A Resilient Airfield Network"
 ISR70_airfield_desc:0 "Expand the southern airfield network by two levels and improve its engineering."
 ISR70_air_defense:0 "Radar and Contemporary Air Defense"
 ISR70_air_defense_desc:0 "Improve contemporary ground-based air defense and military electronics."
 ISR70_naval_staff:0 "Secure the Coast and Sea Lanes"
 ISR70_naval_staff_desc:0 "Reorganize coastal operations and naval staff training."
 ISR70_missile_boats:0 "Missile Boats and Coastal Operations"
 ISR70_missile_boats_desc:0 "Develop missile-boat tactics and contemporary corvette research."
 ISR70_submarines:0 "Submarines and Covert Reconnaissance"
 ISR70_submarines_desc:0 "Train covert naval reconnaissance and support submarine development."
 ISR70_shipyards:0 "Shipbuilding Capacity in Haifa"
 ISR70_shipyards_desc:0 "Build a funded naval dockyard in Haifa and improve shipbuilding practice."
 ISR70_intelligence_outcome_tt:0 "With La Resistance, creates Mossad if Israel has no intelligence agency."
 ISR70_intelligence:0 "Mossad and Military Intelligence"
 ISR70_intelligence_desc:0 "Mossad and military intelligence need experienced analysts, secure communications and a clear division of responsibilities. Reliable assessments must inform both diplomacy and defense."
 ISR70_intelligence_analysis:0 "Analysis before Easy Certainties"
 ISR70_intelligence_analysis_desc:0 "Prioritize assessment, language training and independent analysis over operational expansion."
 ISR70_intelligence_operations:0 "Operational Intelligence Networks"
 ISR70_intelligence_operations_desc:0 "Build operational networks and secure communications. Foreign influence becomes harder to exert."
 ISR70_civil_defense:0 "Civil Defense for Border Communities"
 ISR70_civil_defense_desc:0 "Build two civilian shelter levels for northern border communities."
 ISR70_preparedness:0 "A Coordinated Readiness Plan"
 ISR70_preparedness_desc:0 "Integrate the reserve, maintenance and civil-defense programmes into one readiness plan."
 ISR70_foreign_policy:0 "The Foreign-Policy Situation of 1970"
 ISR70_foreign_policy_desc:0 "Give the foreign ministry a cabinet mandate and open the national diplomatic programme."
 ISR70_us_channel:0 "Strengthen the Washington Channel"
 ISR70_us_channel_desc:0 "Organize the Washington channel and unlock the American military or civilian cooperation proposal."
 ISR70_us_agreement_condition_tt:0 "An agreement with the United States has been accepted."
 ISR70_us_security:0 "Negotiate Security Cooperation"
 ISR70_us_security_desc:0 "An agreement with Washington gives military planners a dependable basis for cooperation. Training and procurement offices must turn diplomatic commitments into lasting working arrangements."
 ISR70_us_civil:0 "Negotiate Civilian Economic Cooperation"
 ISR70_us_civil_desc:0 "Implement an accepted civilian agreement through investment access and industrial research."
 ISR70_france_channel_outcome_tt:0 "Sends France a commercial proposal. France may accept or decline. Acceptance is required for the European trade focus."
 ISR70_france_channel:0 "Approach Paris Again"
 ISR70_france_channel_desc:0 "Ask Paris to reopen a commercial channel. The French government must accept before European cooperation can deepen."
 ISR70_europe_trade_agreement_condition_tt:0 "France has accepted renewed commercial cooperation."
 ISR70_european_trade:0 "Develop European Export Markets"
 ISR70_european_trade_desc:0 "Use the accepted European trade channel to improve investment returns and support commercial institutions."
 ISR70_soviet_channel:0 "A Cautious Opening to Moscow"
 ISR70_soviet_channel_desc:0 "Open a cautious channel to Moscow and unlock a proposal on emigration and diplomatic contacts."
 ISR70_soviet_dialogue_condition_tt:0 "The Soviet Union has accepted the dialogue and emigration framework."
 ISR70_soviet_dialogue:0 "Emigration and Diplomatic Contacts"
 ISR70_soviet_dialogue_desc:0 "An agreed emigration framework opens a new chapter in relations with Moscow. Israel must prepare housing, employment and local services for the families who arrive."
 ISR70_independent_diplomacy:0 "An Independent Diplomacy"
 ISR70_independent_diplomacy_desc:0 "Maintain independent negotiating room and protect domestic decision making against foreign influence."
 ISR70_africa_contacts:0 "Maintain African Contacts"
 ISR70_africa_contacts_desc:0 "Technical missions abroad offer cooperation in agriculture, training and public works. Lasting partnerships will depend on useful expertise and reliable commitments."
 ISR70_jordan_backchannel_outcome_tt:0 "Sends Jordan a border-talks proposal. Jordan may accept or decline; no territory changes hands."
 ISR70_jordan_backchannel:0 "Confidential Talks with Amman"
 ISR70_jordan_backchannel_desc:0 "Send a confidential border proposal to Amman. Jordan decides whether the channel becomes an agreement."
 ISR70_iran_contacts_outcome_tt:0 "Sends Iran a supply proposal. Iranian acceptance under a compatible government unlocks Oil-Supply Security."
 ISR70_iran_contacts:0 "Relations with the Shah's Iran"
 ISR70_iran_contacts_desc:0 "The relationship with the Shah's Iran offers opportunities in supply and commerce. A lasting arrangement will require agreement in Tehran as well as Jerusalem."
 ISR70_iran_supply_agreement_condition_tt:0 "Iran has accepted the supply agreement."
 ISR70_oil_security:0 "Contractual Oil-Supply Security"
 ISR70_oil_security_desc:0 "Implement the accepted Iranian supply agreement, improving resilience against sanctions and fuel vulnerability."
 ISR70_nuclear_policy:0 "Ambiguity or International Transparency"
 ISR70_nuclear_policy_desc:0 "Review the diplomatic implications of ambiguity and international transparency before choosing a policy."
 ISR70_keep_ambiguity:0 "Preserve Nuclear Ambiguity"
 ISR70_keep_ambiguity_desc:0 "Discretion preserves freedom of action in a hostile region. The cabinet will reaffirm a policy of strategic ambiguity and tightly controlled diplomatic communication."
 ISR70_nuclear_transparency:0 "Offer International Transparency"
 ISR70_nuclear_transparency_desc:0 "Civilian nuclear cooperation offers a different diplomatic course. Greater openness would place international research and peaceful technical exchanges at the center of policy."
 ISR70_suez:0 "Assess the Suez Front"
 ISR70_suez_desc:0 "Assess the Suez front and give the cabinet a concrete military and political assessment."
 ISR70_attrition_active_condition_tt:0 "The War of Attrition is ongoing."
 ISR70_limited_attrition:0 "Limit the Conflict"
 ISR70_limited_attrition_desc:0 "Limit the conflict to a defensive posture with better field coordination and manageable supply use."
 ISR70_deep_raids:0 "Increase Military Pressure"
 ISR70_deep_raids_desc:0 "Deep raids promise to disrupt the enemy's preparations beyond the front line. The cabinet must commit aircraft and trained personnel while accepting the diplomatic consequences of escalation."
 ISR70_rogers_outcome_tt:0 "Opens the Rogers Initiative event. An Egyptian acceptance unlocks the ceasefire route; a proposal alone does not end the War of Attrition."
 ISR70_rogers:0 "Respond to the Rogers Initiative"
 ISR70_rogers_desc:0 "Choose a response to the Rogers Initiative. An Egyptian reply determines whether a ceasefire can be implemented."
 ISR70_ceasefire_accepted_condition_tt:0 "Egypt has accepted a monitored ceasefire."
 ISR70_ceasefire:0 "A Controlled Ceasefire"
 ISR70_ceasefire_desc:0 "Consolidate an accepted ceasefire, remove the starting War of Attrition costs and restore public confidence."
 ISR70_armed_stalemate:0 "Maintain the Armed Stalemate"
 ISR70_armed_stalemate_desc:0 "Maintain a fortified military posture instead of the negotiated ceasefire route. The War of Attrition burden remains."
 ISR70_territorial_policy:0 "The Question of the Controlled Territories"
 ISR70_territorial_policy_desc:0 "Prepare the cabinet's territorial policy. The next choice determines which negotiated or administrative route can proceed."
 ISR70_all_on:0 "Defensible Borders: An Allon-Oriented Plan"
 ISR70_all_on_desc:0 "Adopt an Allon-oriented security plan. Defensive planning improves while negotiations remain possible."
 ISR70_palestinian_settlement_condition_tt:0 "A Palestinian negotiating settlement has been accepted."
 ISR70_territorial_maximalism:0 "Permanent Territorial Control"
 ISR70_territorial_maximalism_desc:0 "Supporters of permanent territorial control want the cabinet to commit to a lasting administrative presence. Their programme will shape relations with neighboring states and the communities under Israeli control."
 ISR70_regional_compromise:0 "Negotiate Territorial Compromises"
 ISR70_regional_compromise_desc:0 "Authorize territorial compromise and give the negotiating team political capital for the peace route."
 ISR70_sinai_negotiation:0 "Sinai and Egyptian Security Interests"
 ISR70_sinai_negotiation_desc:0 "Prepare Sinai security guarantees and unlock the Egyptian peace proposal. Egypt must agree before implementation."
 ISR70_westbank_autonomy:0 "Autonomy in the West Bank"
 ISR70_westbank_autonomy_desc:0 "Prepare a municipal autonomy proposal and unlock Palestinian negotiations. Local representatives retain the right to reject the offer."
 ISR70_golan_review_outcome_tt:0 "Sends Syria a security proposal. Syria may accept or decline; this focus grants no cores or automatic land transfer."
 ISR70_golan_review:0 "A Security Settlement for the Golan"
 ISR70_golan_review_desc:0 "Send Syria a proposal for a Golan security framework. Talks do not transfer ownership or grant cores."
 ISR70_gaza_services_outcome_tt:0 "While Israel controls Palestinian-owned Gaza, adds a local administrative compact: Local Supplies for Controller +1.5%."
 ISR70_gaza_services:0 "A Civil Administration for Gaza"
 ISR70_gaza_services_desc:0 "Civilian administration in Gaza depends on functioning local services. Work with municipal institutions to improve provision and the practical conditions of daily life."
 ISR70_egypt_peace_signed_condition_tt:0 "Egypt has accepted the peace agreement."
 ISR70_policy_greater_mandate_condition_tt:0 "A paid permanent-territory mandate is active."
 ISR70_policy_inalienable_land_condition_tt:0 "Inalienable land."
 ISR70_policy_herut_retention_condition_tt:0 "Herut retention."
 ISR70_egypt_peace:0 "A Negotiated Peace with Egypt"
 ISR70_egypt_peace_desc:0 "Implement an accepted Egyptian peace agreement, end the War of Attrition and improve the climate for civilian investment. Sinai control returns only under the agreed ownership checks."
 ISR70_regional_normalization:0 "A Regional Peace Framework"
 ISR70_regional_normalization_desc:0 "Build commercial and diplomatic institutions on the peace framework. Investment returns and office construction improve."
 ISR70_territory_administration:0 "The Costs of Permanent Administration"
 ISR70_territory_administration_desc:0 "Fund a permanent administrative apparatus. It reduces garrison losses but has an explicit recurring bureaucratic cost."
 ISR70_annexation_review_outcome_tt:0 "Opens a parliamentary event: retain administration, offer municipal talks, or adopt sovereignty claims. No automatic cores are granted."
 ISR70_annexation_review:0 "Submit Annexation to Parliament"
 ISR70_annexation_review_desc:0 "Parliament must debate the future of the territories under Israeli control. Administrative continuity, municipal negotiations and sovereignty claims present different political commitments."
 ISR70_arab_citizens:0 "Arab Citizens and the State"
 ISR70_arab_citizens_desc:0 "Set the cabinet programme for Arab citizens of Israel. Equal access and preferential discrimination are exclusive; municipal self-government remains a separate, compatible choice."
 ISR70_equal_local_services:0 "Equal Municipal Services"
 ISR70_equal_local_services_desc:0 "Fund municipal services and transport links in state 205. The stability and continuing service costs begin when the project is completed."
 ISR70_policy_project_equal_services_done_condition_tt:0 "The funded project \"Equal Municipal Services\" has actually been delivered."
 ISR70_equal_employment:0 "Open Public Employment"
 ISR70_equal_employment_desc:0 "Spend 0.3% of GDP once on training and hiring procedures. Office worker requirement falls by 2%."
 ISR70_equal_access:0 "Equal Access to Land and Credit"
 ISR70_equal_access_desc:0 "Spend 50 political power and reserve 1.2% of GDP for a one-factory credit and enterprise programme in Haifa (state 205). Reform effects begin after delivery."
 ISR70_local_autonomy:0 "Municipal Self-Government"
 ISR70_local_autonomy_desc:0 "Spend 50 political power to devolve municipal responsibilities. Bureaucracy costs fall 10%; corruption costs rise 3%."
 ISR70_municipal_pacts:0 "Municipal Infrastructure Grants"
 ISR70_municipal_pacts_desc:0 "Opens one joint 1.0% GDP grant programme for states 205 and 206. Both projects must remain deliverable; the shared social cost applies after completion."
 ISR70_policy_project_municipal_pacts_done_condition_tt:0 "The funded project \"Municipal Infrastructure Grants\" has actually been delivered."
 ISR70_municipal_representation:0 "Municipal Development Funds"
 ISR70_municipal_representation_desc:0 "Spend 0.2% of GDP to establish the funds. Infrastructure construction is 15% faster in states 205 and 206 while Israel owns and controls them; internal investment costs fall 10%."
 ISR70_preferential_allocations:0 "Preferential Land and Budget Allocation"
 ISR70_preferential_allocations_desc:0 "Reserve 0.5% of GDP to open two building slots and deliver one infrastructure level in state 206. Stability falls by 2 percentage points on completion."
 ISR70_policy_project_preferential_allocations_done_condition_tt:0 "The funded project \"Preferential Land and Budget Allocation\" has actually been delivered."
 ISR70_restricted_employment:0 "Preferential Development Contracts"
 ISR70_restricted_employment_desc:0 "Reserve 1.2% of GDP for a factory in state 206. Preferential procurement raises corruption costs by 3%; industrial conglomerates gain 10 opinion if active after delivery."
 ISR70_policy_project_restricted_employment_done_condition_tt:0 "The funded project \"Preferential Development Contracts\" has actually been delivered."
 ISR70_separate_development:0 "Separate Municipal Funding Rules"
 ISR70_separate_development_desc:0 "Choose discriminatory funding rules: social costs fall 5%, stability falls 2 percentage points, and corruption costs rise 2%."
 ISR70_land_survey:0 "Survey Land and Existing Communities"
 ISR70_land_survey_desc:0 "Survey one controlled Palestinian-owned project area. The survey costs 0.1% of GDP; it neither changes ownership nor predetermines Palestinian consent."
 ISR70_policy_target_208_condition_tt:0 "The West Bank is the selected project area."
 ISR70_policy_target_209_condition_tt:0 "Gaza is the selected project area."
 ISR70_settlement_budget:0 "A Budget for Territorial Policy"
 ISR70_settlement_budget_desc:0 "Choose the settlement project budget for the already selected area. Freeze, limited development and expansion are mutually exclusive; each has its own actual funding and Palestinian consequences."
 ISR70_freeze_new:0 "Suspend New Settlements"
 ISR70_freeze_new_desc:0 "Pay 75 political power and offer a settlement freeze. Only an accepted offer reduces the local resistance target by 5 points. Rejection changes neither control nor rights."
 ISR70_municipal_works:0 "Joint Municipal Works"
 ISR70_municipal_works_desc:0 "One selected Palestinian-owned target: the West Bank or Gaza. Reserve 1.5% of GDP for the chosen project; delivery takes 270 days. It is not a grant of ownership or a core."
 ISR70_policy_project_municipal_works_208_done_condition_tt:0 "The funded project \"Joint Municipal Works\" has actually been delivered."
 ISR70_policy_project_municipal_works_209_done_condition_tt:0 "The funded project \"Joint Municipal Works\" has actually been delivered."
 ISR70_land_compact:0 "A Local Administration Compact"
 ISR70_land_compact_desc:0 "Open a separate administrative agreement. The transfer and reductions in garrison and administrative costs require actual Palestinian acceptance and implementation."
 ISR70_designated_sites:0 "Designate Agricultural-Security Sites"
 ISR70_designated_sites_desc:0 "One selected Palestinian-owned target: the West Bank or Gaza. Reserve 0.8% of GDP for the chosen project; delivery takes 240 days. It is not a grant of ownership or a core."
 ISR70_settlement_services:0 "Roads, Water and Supply Links"
 ISR70_settlement_services_desc:0 "One selected Palestinian-owned target: the West Bank or Gaza. Reserve 0.6% of GDP for the chosen project; delivery takes 180 days. It is not a grant of ownership or a core."
 ISR70_settlement_ceiling:0 "Fortified Sites and a Binding Ceiling"
 ISR70_settlement_ceiling_desc:0 "One selected Palestinian-owned target: the West Bank or Gaza. Reserve 0.4% of GDP for the chosen project; delivery takes 180 days. It is not a grant of ownership or a core."
 ISR70_authorize_expansion:0 "Authorize Civilian Settlement Expansion"
 ISR70_authorize_expansion_desc:0 "One selected Palestinian-owned target: the West Bank or Gaza. Reserve 0.3% of GDP for the chosen project; delivery takes 90 days. It is not a grant of ownership or a core."
 ISR70_settlement_package:0 "Agricultural and Industrial Settlement Sites"
 ISR70_settlement_package_desc:0 "One selected Palestinian-owned target: the West Bank or Gaza. Reserve 2.3% of GDP for the chosen project; delivery takes 300 days. It is not a grant of ownership or a core."
 ISR70_entrench_network:0 "Roads, Supply Depots and Fortified Positions"
 ISR70_entrench_network_desc:0 "One selected Palestinian-owned target: the West Bank or Gaza. Reserve 0.9% of GDP for the chosen project; delivery takes 240 days. It is not a grant of ownership or a core."
 ISR70_policy_project_entrench_network_208_done_condition_tt:0 "The funded project \"Roads, Supply Depots and Fortified Positions\" has actually been delivered."
 ISR70_policy_project_entrench_network_209_done_condition_tt:0 "The funded project \"Roads, Supply Depots and Fortified Positions\" has actually been delivered."
 ISR70_settlement_compensation:0 "Negotiate Limits and Compensation"
 ISR70_settlement_compensation_desc:0 "Pay 75 political power to negotiate a binding expansion ceiling. PAL can reject. An accepted arrangement requires a separate 0.6% GDP transfer; then resistance target rises 3 points and garrison need rises 5%, rather than the unilateral penalties."
 ISR70_settlement_unilateral:0 "Impose the Settlement Network Unilaterally"
 ISR70_settlement_unilateral_desc:0 "Impose the network unilaterally. Pay 50 political power; local resistance target rises 10 points, garrison need 15% and garrison damage 10%. PAL receives an actual response event; war is not declared automatically."
 ISR70_finance_links:0 "Finance for National Development"
 ISR70_finance_links_desc:0 "Open the domestic, bank-led and international development-finance programmes."
 ISR70_clerical_training:0 "Train Accountants and Office Staff"
 ISR70_clerical_training_desc:0 "Spend 0.4% of GDP on accounting and office training. Office worker requirement falls 3%."
 ISR70_clearing_network:0 "Mechanized Clearing and Bookkeeping"
 ISR70_clearing_network_desc:0 "Spend 0.6% of GDP on mechanized clearing and bookkeeping. Office worker requirement falls a further 3% (6% across this finance route)."
 ISR70_development_bonds:0 "Long-Term Development Bonds"
 ISR70_development_bonds_desc:0 "Unlock a one-time decision to borrow 1% of GDP. The amount borrowed is added equally to treasury liquidity and public debt; bankruptcy blocks the draw."
 ISR70_audited_funds:0 "Audit the Development Funds"
 ISR70_audited_funds_desc:0 "Spend 50 political power on project oversight. Corruption costs fall 3%."
 ISR70_development_offices:0 "Service Centers for New Towns"
 ISR70_development_offices_desc:0 "Reserve 1.2% of GDP for an office level in state 206. On delivery, office worker requirement falls a further 2%, making the route total 8%."
 ISR70_bank_consortium:0 "A Domestic Banking Consortium"
 ISR70_bank_consortium_desc:0 "Office productivity rises 3%; concentration and privileged access raise corruption costs 3%."
 ISR70_shared_services:0 "Shared Back Offices"
 ISR70_shared_services_desc:0 "Spend 0.5% of GDP to standardize shared accounting and administration. Office worker requirement falls a further 4%, for 10% across this route."
 ISR70_industrial_credit:0 "Bank-Industry Investment Partnerships"
 ISR70_industrial_credit_desc:0 "Reserve 1.2% of GDP for an office level in Tel Aviv (204). Office construction speed rises 5%; corruption costs rise a further 2% on delivery."
 ISR70_policy_export_credit_accepted_condition_tt:0 "Export credit accepted."
 ISR70_export_credit:0 "Negotiate Export Credit Lines"
 ISR70_export_credit_desc:0 "Unlock a repeatable request costing 50 political power. The United States may accept or decline; a declined request can be renewed after 360 days. An existing military agreement does not block civilian credit."
 ISR70_equipment_finance:0 "Finance Imported Office Equipment"
 ISR70_equipment_finance_desc:0 "Spend 0.6% of GDP on imported office equipment. Office productivity rises 5%; Cold War market exposure rises 5%."
 ISR70_export_services:0 "Build an Export Services Sector"
 ISR70_export_services_desc:0 "Requires an accepted export-credit line. Reserve 1.2% of GDP for an office level in Haifa (205); office construction speed rises 10% and market exposure rises a further 5% on delivery."
 ISR70_gi_mandate:0 "A Greater Israel Mandate"
 ISR70_gi_mandate_desc:0 "Pay the shared 100-political-power territorial mandate once. A mandate already paid through Herut covers this focus; it grants neither ownership nor a declaration of war."
 ISR70_gi_frontier_review:0 "Borders and Budgets for Sinai"
 ISR70_gi_frontier_review_desc:0 "Budget 0.2% of GDP to separate Sinai civilian development, coastal projects, and the later choice of legal status."
 ISR70_gi_sinai_admin:0 "A Permanent Sinai Administration"
 ISR70_gi_sinai_admin_desc:0 "Establish permanent Sinai administration at a cost of 0.3% of GDP. Local infrastructure builds 15% faster; bureaucracy costs rise 3%. Egyptian ownership remains until an actual territorial settlement."
 ISR70_gi_sinai_housing:0 "Serviced Settlement Sites in Northern Sinai"
 ISR70_gi_sinai_housing_desc:0 "Fund the specified project through decisions. Reserve 1% of GDP; delivery takes 240 days. Lost requirements refund the original reserved budget."
 ISR70_policy_project_gi_sinai_housing_done_condition_tt:0 "The funded project \"Serviced Settlement Sites in Northern Sinai\" has actually been delivered."
 ISR70_gi_sinai_families:0 "Voluntary Settlement in the Sinai Towns"
 ISR70_gi_sinai_families_desc:0 "Fund a voluntary internal movement of at most 20,000 people over 5 years. Every target-state addition is matched by the same subtraction from Tel Aviv; it creates no national population or recruit pool."
 ISR70_gi_frontier_families:0 "Family Services on the Frontier"
 ISR70_gi_frontier_families_desc:0 "Fund 0.4% of GDP for a single five-year family-service idea: population-growth modifier +5%, healthcare costs +2%. It does not add 5% of the population each month and cannot stack with itself."
 ISR70_gi_sinai_economy:0 "Agriculture and Industry for the Sinai Towns"
 ISR70_gi_sinai_economy_desc:0 "Fund the specified project through decisions. Reserve 1.8% of GDP; delivery takes 300 days. Lost requirements refund the original reserved budget."
 ISR70_gi_sinai_status:0 "Settle Sovereignty over the Sinai"
 ISR70_gi_sinai_status_desc:0 "After an actual peace settlement has transferred Sinai, pay 150 political power for its sovereignty administration. This focus does not transfer the state or remove the Egyptian core."
 ISR70_gi_canal_claim:0 "Assert the Sinai Territorial Claim"
 ISR70_gi_canal_claim_desc:0 "Pay 150 political power for a Sinai territorial claim. Relations with Egypt fall 40 and with PAL/Jordan 15. This neither changes ownership nor declares war."
 ISR70_gi_canal_repair:0 "Develop Sinai Ports and Coastal Roads"
 ISR70_gi_canal_repair_desc:0 "Fund the specified project through decisions. Reserve 1.2% of GDP; delivery takes 240 days. Lost requirements refund the original reserved budget."
 ISR70_policy_project_gi_canal_repair_done_condition_tt:0 "The funded project \"Develop Sinai Ports and Coastal Roads\" has actually been delivered."
 ISR70_gi_canal_settlers:0 "A Sinai Coastal Settlement Programme"
 ISR70_gi_canal_settlers_desc:0 "Fund a voluntary internal movement of at most 15,000 people over 5 years. Every target-state addition is matched by the same subtraction from Tel Aviv; it creates no national population or recruit pool."
 ISR70_gi_canal_industry:0 "Coastal Industry for Sinai"
 ISR70_gi_canal_industry_desc:0 "Fund the specified project through decisions. Reserve 2% of GDP; delivery takes 360 days. Lost requirements refund the original reserved budget."
 ISR70_gi_canal_navigation:0 "Organize Sinai Coastal Logistics"
 ISR70_gi_canal_navigation_desc:0 "Fund the specified project through decisions. Reserve 0.8% of GDP; delivery takes 180 days. Lost requirements refund the original reserved budget."
 ISR70_gi_canal_province:0 "Unify Sinai District Administration"
 ISR70_gi_canal_province_desc:0 "Constitute the Sinai province only after actual Israeli ownership and control. Pay 150 political power and 0.3% of GDP; bureaucracy costs rise 3%. No core is granted."
 ISR70_gi_resident_status:0 "The Status of the Existing Residents"
 ISR70_gi_resident_status_desc:0 "Pay 50 political power to open the actual choice of equal civil status or an unequal occupation statute. Settlement projects and party affiliation do not select the legal status automatically."
 ISR70_policy_active_expulsion_condition_tt:0 "A forced-displacement policy is active."
 ISR70_policy_status_chosen_condition_tt:0 "An initial legal status has already been chosen."
 ISR70_policy_reform_equal_authorized_condition_tt:0 "The paid reform authorizes the equal-rights focus."
 ISR70_gi_equal_status:0 "Equal Civil Status in Sinai"
 ISR70_gi_equal_status_desc:0 "Equal legal rights and service entitlements cost 100 political power and +3% social spending. There is no immediate resistance, compliance, loyalty or sovereignty-consent bonus. A previously chosen unequal regime must first be repealed through the explicit reform decision."
 ISR70_policy_equal_civil_condition_tt:0 "Equal civil rights are in force in Sinai."
 ISR70_gi_canal_councils:0 "Local Councils and Common Services"
 ISR70_gi_canal_councils_desc:0 "Fund civilian services at 0.8% of GDP and +2% bureaucracy costs. A separately accepted and implemented local contract reduces garrison needs only 5%. Rejection grants no bonus and does not repeal equal rights."
 ISR70_gi_property_settlement:0 "Resolve Property Claims and Displacement"
 ISR70_gi_property_settlement_desc:0 "Reserve at least 0.7% of GDP for restitution. Only fulfilled, agreed claims can lower resistance target by 2 points. Prior expulsion creates additional obligations; there is no automatic loyalty or compliance reward."
 ISR70_gi_core_review:0 "Negotiate the Sinai Status"
 ISR70_gi_core_review_desc:0 "After ten years of real ownership and control and five years of equal rights, pay 100 political power to open a separate local status process. An affirmative result is not guaranteed; rejection leaves civil rights intact and grants no core."
 ISR70_policy_local_status_accepted_condition_tt:0 "The separate local status process has accepted integration."
 ISR70_policy_egypt_status_accepted_condition_tt:0 "Egypt has accepted the sovereignty agreement."
 ISR70_gi_canal_core:0 "Integrate the Sinai"
 ISR70_gi_canal_core_desc:0 "Pay 150 political power and 0.5% of GDP only after real local and Egyptian status agreements. The core applies solely to Sinai; ordinary core effects replace native occupation mechanics. Egyptian cores and historic claims remain."
 ISR70_policy_reform_special_authorized_condition_tt:0 "The paid reform authorizes the unequal-statute focus."
 ISR70_occ_special_status:0 "Separate Legal Status for Occupied Residents"
 ISR70_occ_special_status_desc:0 "Choose unequal occupation law. Existing local factory access rises 10 points, garrison needs rise 15%, police costs 3%, and resistance target 8 points; social spending falls 2%. The general and Kach statutes replace each other."
 ISR70_policy_occupation_special_condition_tt:0 "The general unequal occupation statute is active."
 ISR70_occ_security_roads:0 "Security Roads and Controlled Access"
 ISR70_occ_security_roads_desc:0 "Fund 0.8% of GDP for one infrastructure level after 180 days. Secured roads add 15% local supplies but also 5% garrison need under the unequal statute."
 ISR70_occ_delegated_administration:0 "Delegated Local Administration"
 ISR70_occ_delegated_administration_desc:0 "Request a limited local administrative contract. Only acceptance followed by funding grants the 3% bureaucracy saving and 3% corruption surcharge; refusal is possible."
 ISR70_occ_occupation_industry:0 "Industrial Enclaves under Separate Law"
 ISR70_occ_occupation_industry_desc:0 "Reserve 1.0% of GDP for one building slot and one factory on contractually acquired land. Delivery takes 270 days and adds 5% local garrison need. A local administrative refusal does not block this distinct project."
 ISR70_occ_permanent_statute:0 "A Permanent Occupation Statute"
 ISR70_occ_permanent_statute_desc:0 "Pay 100 political power to make the unequal statute permanent. Add 5 points of factory access, 2% police costs and 4 resistance-target points; stability falls 2 points. It remains an occupation, with no core."
 ISR70_rad_government:0 "A Radical Programme in Government"
 ISR70_rad_government_desc:0 "Pay 75 political power for a radical territorial programme only while its actual party governs. This neither wins an election nor enacts any of the later choices automatically."
 ISR70_rad_herut_mandate:0 "An Indivisible Territorial Programme"
 ISR70_rad_herut_mandate_desc:0 "Herut/Gahal adopts the shared territorial mandate after choosing Indivisible Security Interests. Pay its 100-political-power cost once, credited against the Greater Israel entry."
 ISR70_rad_herut_authority:0 "A National Territorial Development Authority"
 ISR70_rad_herut_authority_desc:0 "Budget 0.4% of GDP for a territorial authority: local infrastructure construction +10%, bureaucracy costs +2%, only under the programme government."
 ISR70_rad_herut_preparation:0 "Prepare to Hold the New Frontier"
 ISR70_rad_herut_preparation_desc:0 "Budget 0.5% of GDP and +3% personnel costs for 30 army experience and 10% local supply support in the controlled Sinai. It is preparation, not a declaration of war."
 ISR70_rad_herut_retention:0 "Reject Territorial Withdrawal"
 ISR70_rad_herut_retention_desc:0 "Reject territorial withdrawal as an explicit Herut policy. Egyptian relations fall 20, American relations 15. A later peace requires repeal; the focus does not annex a state."
 ISR70_rad_mafdal_council:0 "Religious Settlement Associations"
 ISR70_rad_mafdal_council_desc:0 "After choosing Religious Settlement Policy, pay 50 political power for the religious settlement programme. The later land and legal-binding choices remain separate decisions."
 ISR70_rad_mafdal_settlers:0 "State Support for Settlement Communities"
 ISR70_rad_mafdal_settlers_desc:0 "Fund a voluntary internal movement of at most 10,000 people over 3 years. Every target-state addition is matched by the same subtraction from Tel Aviv; it creates no national population or recruit pool."
 ISR70_rad_mafdal_land:0 "Compulsory Expropriation of Land"
 ISR70_rad_mafdal_land_desc:0 "Choose compulsory land expropriation instead of negotiated purchase: spend 0.4% of GDP for one building slot; local resistance target rises 8 points and property claims remain."
 ISR70_rad_mafdal_purchase:0 "Negotiated Land Purchases"
 ISR70_rad_mafdal_purchase_desc:0 "Seek a voluntary land purchase. Only accepted terms unlock the 1.0%-GDP, 270-day project for the same building slot. No expropriation or automatic resistance rise follows refusal."
 ISR70_policy_mafdal_expropriation_condition_tt:0 "Mafdal expropriation."
 ISR70_policy_project_mafdal_purchase_done_condition_tt:0 "Project mafdal purchase done."
 ISR70_rad_mafdal_lock:0 "Declare the Settlement Land Inalienable"
 ISR70_rad_mafdal_lock_desc:0 "Make settlement land politically inalienable. Gain 50 political power once; stability falls 3 points, and later withdrawal requires a separate repeal. The alternative is a reviewable lease system."
 ISR70_rad_mafdal_review:0 "Reviewable Leases and Land Registry"
 ISR70_rad_mafdal_review_desc:0 "Choose reviewable land leases and a registry instead of inalienability. Pay 50 political power and 0.3% of GDP; internal investment costs fall 5%, and territorial negotiations remain available."
 ISR70_rad_kach_government:0 "National Front: Radical Government Programme"
 ISR70_rad_kach_government_desc:0 "Pay 100 political power for the governing National Front/Kach programme. Before 1971 it uses the existing National Front presentation. Relations with Egypt, PAL and Jordan fall 25; taking office does not automatically expel residents."
 ISR70_rad_denial:0 "Deny Equal Civil Status"
 ISR70_rad_denial_desc:0 "Explicitly deny equal civil status in controlled, non-core Sinai: +10 points of occupied factory access, +10% garrison need and +5% police costs. This replaces the general unequal statute and blocks the civic core route while active."
 ISR70_policy_kach_special_condition_tt:0 "The radical unequal occupation statute is active."
 ISR70_rad_no_expulsion:0 "Retain Residents under Separate Administration"
 ISR70_rad_no_expulsion_desc:0 "Keep residents and their economic activity under unequal administration, with 0.5% of GDP for basic services. No seized-property slots or additional expulsion penalties are awarded; the underlying unequal legal regime remains."
 ISR70_rad_expulsion:0 "Forced Expulsion of Arab Residents"
 ISR70_rad_expulsion_desc:0 "An explicitly chosen, abstract forced-displacement policy. Pay 200 political power; at most two seized-property slots, stability -8 points, local resistance target +25 points and garrison need +20%. Refugees and property claims persist; other states receive actual embargo choices. No expulsion quota, population deletion, or core reward."
 ISR70_rad_limited_emergency:0 "Security Powers with an Electoral Sunset"
 ISR70_rad_limited_emergency_desc:0 "Pay 50 political power for 365 days of +2 occupied factory-access points and +3% police costs. Elections are preserved. Renewal requires another paid government decision; the alternative is permanent emergency."
 ISR70_rad_permanent_emergency:0 "Expansion under Permanent Emergency"
 ISR70_rad_permanent_emergency_desc:0 "Choose a permanent emergency explicitly. Suspend elections, gain 5 further points of occupied factory access, and pay +10% police and +10% personnel costs. Neither party membership nor the population-policy choice enacts this automatically."
 ISR70_municipal_agreement:0 "Municipal Administrative Compact"
 ISR70_municipal_agreement_desc:0 "An agreed civilian administrative compact improves local provision without creating cores or changing the legal owner of this state."
 ISR70_citizen_army:0 "Citizen Army and Reserve"
 ISR70_citizen_army_desc:0 "The citizen army combines a small standing force with a trained reserve. Readiness and civilian employment must be balanced."
 ISR70_histadrut:0 "Histadrut and the Building Society"
 ISR70_histadrut_desc:0 "The labor federation and cooperative institutions remain major pillars of industrial development and social provision."
 ISR70_unity:0 "The Unity Government of 1969"
 ISR70_unity_desc:0 "A broad parliamentary majority provides stability but requires sustained negotiation between distinct political partners."
 ISR70_attrition:0 "The War of Attrition"
 ISR70_attrition_desc:0 "An unresolved conflict consumes personnel resources. A mutually accepted ceasefire can remove this burden."
 ISR70_embargo:0 "Lessons of the French Embargo"
 ISR70_embargo_desc:0 "Restricted external deliveries make defense manufacturing harder until reliable contracts or a domestic production programme are established."
 ISR70_absorption:0 "Immigration and Development Gaps"
 ISR70_absorption_desc:0 "Immigration sustains population growth but requires housing, education and social provision."
 ISR70_ambiguity:0 "Nuclear Ambiguity"
 ISR70_ambiguity_desc:0 "A policy of ambiguity supports diplomatic independence without granting weapons or bypassing technology and material requirements."
 ISR70_integrated_immigration:0 "Integrated Immigration"
 ISR70_integrated_immigration_desc:0 "Education, employment and municipal development support continued immigration without the original social-cost surcharge."
 ISR70_temporary_readiness:0 "Temporary Reserve Readiness"
 ISR70_temporary_readiness_desc:0 "A temporary call-up accelerates mobilization but increases personnel expenses and diverts civilian production for sixty days."
 ISR70_unity_cabinet_idea:0 "National Unity Cabinet"
 ISR70_unity_cabinet_idea_desc:0 "Replace the fragile starting coalition with a negotiated unity agreement. Its broader support improves stability and military confidence."
 ISR70_narrow_cabinet_idea:0 "A Working Parliamentary Majority"
 ISR70_narrow_cabinet_idea_desc:0 "A smaller working majority leaves the cabinet more political room and gives organized labor a clearer role."
 ISR70_civil_service_idea:0 "A Professional Civil Service"
 ISR70_civil_service_idea_desc:0 "Professional recruitment and common procurement rules reduce the recurring cost of the civil service."
 ISR70_oversight_idea:0 "The Comptroller and Parliamentary Oversight"
 ISR70_oversight_idea_desc:0 "The State Comptroller must be able to follow public money from the cabinet to local administrations. Independent audits will make officials answer for misuse of their offices."
 ISR70_local_councils_idea:0 "Municipal Freedom of Action"
 ISR70_local_councils_idea_desc:0 "Let local councils deliver roads and services faster without increasing the central bureaucracy."
 ISR70_central_planning_idea:0 "Coordinated State Planning"
 ISR70_central_planning_idea_desc:0 "Coordinate national tenders and engineering standards for a faster state construction programme."
 ISR70_water_idea:0 "Water as a Basis for Development"
 ISR70_water_idea_desc:0 "Improve the National Water Carrier and irrigation engineering. Agricultural research supports the next stage."
 ISR70_water_maintenance_idea:0 "Maintain the Water Network"
 ISR70_water_maintenance_idea_desc:0 "Fund pumps, workshops and repairs so farms and public utilities recover more quickly."
 ISR70_exports_idea:0 "Diamonds, Tools and Export Orders"
 ISR70_exports_idea_desc:0 "Support diamond cutting, precision tools and export finance. Local businesses gain confidence and offices expand faster."
 ISR70_import_substitution_idea:0 "Strategic Import Substitution"
 ISR70_import_substitution_idea_desc:0 "Foreign embargoes expose the vulnerabilities of an economy dependent on imported machinery. Domestic production must be able to sustain essential industries under pressure."
 ISR70_export_specialization_idea:0 "Specialize for Export Markets"
 ISR70_export_specialization_idea_desc:0 "Specialize in higher-value exports and foreign investment. Greater world-market exposure makes external market swings more consequential."
 ISR70_diaspora_bonds_idea:0 "Diaspora Capital for Real Projects"
 ISR70_diaspora_bonds_idea_desc:0 "Diaspora savings can support public investment through a credible bond programme. Transparent administration and durable projects will be essential to retaining investors' confidence."
 ISR70_investment_scrutiny_idea:0 "Scrutinize Investment Contracts"
 ISR70_investment_scrutiny_idea_desc:0 "Publish investment contracts and subject concessions to independent audits. Public confidence requires clear terms and officials who can be held accountable."
 ISR70_civil_electronics_idea:0 "Civilian Electronics and Skilled Workers"
 ISR70_civil_electronics_idea_desc:0 "Technical workshops and civilian electronics can become a new foundation for industrial development. Skilled engineers will connect university research with practical manufacturing."
 ISR70_technion_idea:0 "Technion and Applied Research"
 ISR70_technion_idea_desc:0 "Fund applied research at the Technion. Construction research and a permanent national research improvement support civilian and defense engineering."
 ISR70_sme_credit_idea:0 "Credit for Productive Small Businesses"
 ISR70_sme_credit_idea_desc:0 "Guarantee productive small-business credit and reduce the cost of incoming investment."
 ISR70_steady_budget_idea:0 "Gradual Fiscal Consolidation"
 ISR70_steady_budget_idea_desc:0 "Improve sovereign credit through a credible consolidation programme. Interest rates fall without forcing new cuts into unrelated policies."
 ISR70_development_budget_idea:0 "Development before Short-Term Consolidation"
 ISR70_development_budget_idea_desc:0 "Commit a funded development budget to construction and industrial research."
 ISR70_vocational_idea:0 "Vocational Education for New Citizens"
 ISR70_vocational_idea_desc:0 "Expand vocational schools for new immigrants and industrial workers. Training improves productivity and industrial research."
 ISR70_development_towns_idea:0 "Connect the Development Towns"
 ISR70_development_towns_idea_desc:0 "Connect development towns to employment and public services with funded infrastructure in the Negev."
 ISR70_equal_local_services_idea:0 "Equal Municipal Services"
 ISR70_equal_local_services_idea_desc:0 "Fund equal municipal provision. Better administration lowers the cost of social services and improves public confidence."
 ISR70_local_autonomy_idea:0 "Strengthen Municipal Self-Government"
 ISR70_local_autonomy_idea_desc:0 "Transfer routine municipal responsibilities to elected councils and reduce central administrative costs."
 ISR70_religious_compromise_idea:0 "Renew the Religious Compromise"
 ISR70_religious_compromise_idea_desc:0 "Renew the parliamentary religious compromise. Religious institutions gain confidence and a more stable settlement supports government."
 ISR70_civil_marriage_idea:0 "Civil Personal-Status Options"
 ISR70_civil_marriage_idea_desc:0 "Introduce civilian personal-status options and strengthen secular civic institutions. This political reform grants a distinct gain in political capacity."
 ISR70_volunteer_service_idea:0 "Voluntary Municipal Civilian Service"
 ISR70_volunteer_service_idea_desc:0 "Organize voluntary municipal civilian service. Social administration becomes cheaper and the civic settlement gains confidence."
 ISR70_service_expansion_idea:0 "Expand Military Training"
 ISR70_service_expansion_idea_desc:0 "Expand training facilities and improve military call-up speed, with immediate army experience."
 ISR70_universities_idea:0 "Research between Jerusalem and Haifa"
 ISR70_universities_idea_desc:0 "Increase university capacity in Jerusalem and Haifa, financing research staff and two electronics projects."
 ISR70_public_health_idea:0 "Healthcare beyond the Metropolises"
 ISR70_public_health_idea_desc:0 "Extend clinics and professional healthcare administration beyond the largest cities."
 ISR70_reserve_system_idea:0 "Keep the Reserve Ready"
 ISR70_reserve_system_idea_desc:0 "Replace the starting citizen-army spirit with an organized reserve system. Mobilization and unit cohesion improve."
 ISR70_defensive_depth_idea:0 "Defense in Depth"
 ISR70_defensive_depth_idea_desc:0 "Train layered defenses and improve defensive coordination."
 ISR70_maneuver_idea:0 "Mobile Operational Reserves"
 ISR70_maneuver_idea_desc:0 "Build mobile operational reserves around staff exercises and rapid planning."
 ISR70_survivability_idea:0 "Crew Protection and Maintenance"
 ISR70_survivability_idea_desc:0 "Prioritize crew protection, repairability and standardized maintenance in the armored force."
 ISR70_armour_mobility_idea:0 "Mobility and Tactical Employment"
 ISR70_armour_mobility_idea_desc:0 "Prioritize tactical mobility and armored coordination rather than the alternative protection package."
 ISR70_engineers_idea:0 "Engineers and Combat Supply"
 ISR70_engineers_idea_desc:0 "Improve field engineering, reconnaissance and combat supply rather than simply expanding the force."
 ISR70_air_maintenance_idea:0 "Training, Maintenance and Spare Parts"
 ISR70_air_maintenance_idea_desc:0 "Improve training, spare parts and maintenance. A completed domestic aircraft programme removes the starting embargo penalty."
 ISR70_intelligence_analysis_idea:0 "Analysis before Easy Certainties"
 ISR70_intelligence_analysis_idea_desc:0 "Prioritize assessment, language training and independent analysis over operational expansion."
 ISR70_intelligence_operations_idea:0 "Operational Intelligence Networks"
 ISR70_intelligence_operations_idea_desc:0 "Build operational networks and secure communications. Foreign influence becomes harder to exert."
 ISR70_preparedness_idea:0 "A Coordinated Readiness Plan"
 ISR70_preparedness_idea_desc:0 "Integrate the reserve, maintenance and civil-defense programmes into one readiness plan."
 ISR70_us_security_idea:0 "Negotiate Security Cooperation"
 ISR70_us_security_idea_desc:0 "An agreement with Washington gives military planners a dependable basis for cooperation. Training and procurement offices must turn diplomatic commitments into lasting working arrangements."
 ISR70_us_civil_idea:0 "Negotiate Civilian Economic Cooperation"
 ISR70_us_civil_idea_desc:0 "Implement an accepted civilian agreement through investment access and industrial research."
 ISR70_european_trade_idea:0 "Develop European Export Markets"
 ISR70_european_trade_idea_desc:0 "Use the accepted European trade channel to improve investment returns and support commercial institutions."
 ISR70_independent_diplomacy_idea:0 "An Independent Diplomacy"
 ISR70_independent_diplomacy_idea_desc:0 "Maintain independent negotiating room and protect domestic decision making against foreign influence."
 ISR70_africa_contacts_idea:0 "Maintain African Contacts"
 ISR70_africa_contacts_idea_desc:0 "Technical missions abroad offer cooperation in agriculture, training and public works. Lasting partnerships will depend on useful expertise and reliable commitments."
 ISR70_oil_security_idea:0 "Contractual Oil-Supply Security"
 ISR70_oil_security_idea_desc:0 "Implement the accepted Iranian supply agreement, improving resilience against sanctions and fuel vulnerability."
 ISR70_keep_ambiguity_idea:0 "Preserve Nuclear Ambiguity"
 ISR70_keep_ambiguity_idea_desc:0 "Discretion preserves freedom of action in a hostile region. The cabinet will reaffirm a policy of strategic ambiguity and tightly controlled diplomatic communication."
 ISR70_nuclear_transparency_idea:0 "Offer International Transparency"
 ISR70_nuclear_transparency_idea_desc:0 "Civilian nuclear cooperation offers a different diplomatic course. Greater openness would place international research and peaceful technical exchanges at the center of policy."
 ISR70_limited_attrition_idea:0 "Limit the Conflict"
 ISR70_limited_attrition_idea_desc:0 "Limit the conflict to a defensive posture with better field coordination and manageable supply use."
 ISR70_armed_stalemate_idea:0 "Maintain the Armed Stalemate"
 ISR70_armed_stalemate_idea_desc:0 "Maintain a fortified military posture instead of the negotiated ceasefire route. The War of Attrition burden remains."
 ISR70_all_on_idea:0 "Defensible Borders: An Allon-Oriented Plan"
 ISR70_all_on_idea_desc:0 "Adopt an Allon-oriented security plan. Defensive planning improves while negotiations remain possible."
 ISR70_territorial_maximalism_idea:0 "Permanent Territorial Control"
 ISR70_territorial_maximalism_idea_desc:0 "Supporters of permanent territorial control want the cabinet to commit to a lasting administrative presence. Their programme will shape relations with neighboring states and the communities under Israeli control."
 ISR70_regional_compromise_idea:0 "Negotiate Territorial Compromises"
 ISR70_regional_compromise_idea_desc:0 "Authorize territorial compromise and give the negotiating team political capital for the peace route."
 ISR70_gaza_services_idea:0 "A Civil Administration for Gaza"
 ISR70_gaza_services_idea_desc:0 "Civilian administration in Gaza depends on functioning local services. Work with municipal institutions to improve provision and the practical conditions of daily life."
 ISR70_egypt_peace_idea:0 "A Negotiated Peace with Egypt"
 ISR70_egypt_peace_idea_desc:0 "Implement an accepted Egyptian peace agreement, end the War of Attrition and improve the climate for civilian investment. Sinai control returns only under the agreed ownership checks."
