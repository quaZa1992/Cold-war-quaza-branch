 ISR70_decision_reserve_exercise:0 "Conduct a Reserve Exercise"
 ISR70_decision_reserve_exercise_desc:0 "Bring reserve formations together for a scheduled training cycle and review their mobilization procedures."
 ISR70_decision_reserve_mobilize:0 "Temporary Reserve Readiness"
 ISR70_decision_reserve_mobilize_desc:0 "Call up additional reserves during the current war. The temporary deployment draws personnel and production away from civilian employment."
 ISR70_decision_negev_productivity:0 "A Negev Vocational Training Project"
 ISR70_decision_negev_productivity_desc:0 "Send instructors and technical advisers to southern development towns to connect vocational training with local employment."
 ISR70_decision_galilee_productivity:0 "Agricultural Advice in Galilee"
 ISR70_decision_galilee_productivity_desc:0 "Provide northern farming communities with agricultural advice and practical support for their next planting cycle."
 ISR70_decision_shelters:0 "An Additional Civilian Shelter"
 ISR70_decision_shelters_desc:0 "Fund an additional shelter project for civilian communities in the Negev."
 ISR70_decision_civil_industry:0 "A Civilian Development Project"
 ISR70_decision_civil_industry_desc:0 "Commission a civilian industrial project in Tel Aviv. The treasury reserves its budget while construction proceeds."
 ISR70_decision_office_project:0 "A Municipal Service Center"
 ISR70_decision_office_project_desc:0 "Commission a municipal service center in the Negev. The treasury reserves its budget while construction proceeds."
 ISR70_decision_armi_project:0 "Expand Defense Manufacturing"
 ISR70_decision_armi_project_desc:0 "Commission an additional defense manufacturing facility in the Negev and reserve its construction budget."
 ISR70_decision_equipment_trials:0 "Domestic Equipment Trials"
 ISR70_decision_equipment_trials_desc:0 "Run a series of field trials with the defense industry and army procurement offices."
 ISR70_decision_debt_repayment:0 "Targeted Debt Repayment"
 ISR70_decision_debt_repayment_desc:0 "Use available treasury funds to retire part of the public debt. The payment is capped at the debt still outstanding."
 ISR70_decision_export_mission:0 "Send an Export Delegation"
 ISR70_decision_export_mission_desc:0 "Send a commercial delegation abroad to establish contacts for Israeli manufacturers and exporters."
 ISR70_decision_talks_us:0 "Send a Delivery Proposal to Washington"
 ISR70_decision_talks_us_desc:0 "Ask Washington to agree to military deliveries or a civilian cooperation arrangement. The American government will decide its response."
 ISR70_decision_talks_sov:0 "Send a Dialogue Proposal to Moscow"
 ISR70_decision_talks_sov_desc:0 "Ask Moscow to discuss diplomatic contacts and an agreed emigration framework."
 ISR70_decision_talks_egypt:0 "A Round of Security Talks"
 ISR70_decision_talks_egypt_desc:0 "Present Egypt with a negotiated peace proposal and a framework for returning the Sinai administration."
 ISR70_decision_talks_pal:0 "Include Municipal Representatives and Palestine"
 ISR70_decision_talks_pal_desc:0 "Invite Palestinian representatives to discuss a municipal compact or a negotiated state settlement."
 ISR70_decision_roster_likud:0 "An Early Alternative Likud Foundation"
 ISR70_decision_roster_likud_desc:0 "Propose an early unification of Herut and the Liberals in a common Likud list."
