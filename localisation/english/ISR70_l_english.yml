 ISR70_party_0:0 "£ISR70_party_0 Mafdal - National Religious Party"
 ISR70_party_0_desc:0 "Parliamentary religious Zionism links public institutions, national service and the religious status quo."
 ISR70_party_1:0 "£ISR70_party_1 Gahal - Herut and Liberal Bloc"
 ISR70_party_1_desc:0 "Begin must hold together the revisionist and liberal wings of Gahal. A later Likud foundation is a choice, not an anachronistic starting party."
 ISR70_party_2:0 "£ISR70_party_2 Independent Liberals"
 ISR70_party_2_desc:0 "An independent liberal cabinet can promote small business, civil rights or a pragmatic security policy without importing parties from the twenty-first century."
 ISR70_party_3:0 "£ISR70_party_3 Alignment - Labor and Mapam"
 ISR70_party_3_desc:0 "The Labor Party and Mapam share the Alignment. Golda Meir governs through a broad coalition, a citizen army and the institutions of Labor Zionism."
 ISR70_party_4:0 "£ISR70_party_4 Rakah - New Communist List"
 ISR70_party_4_desc:0 "A Jewish-Arab communist government is an alternative electoral outcome. Parliamentary socialism and Soviet alignment remain separate decisions."
 ISR70_party_5:0 "£ISR70_party_5 Federative Council Left"
 ISR70_party_5_desc:0 "An explicitly alternative council-socialist movement can decentralize production and negotiate a federal or common civic constitution."
 ISR70_party_6:0 "£ISR70_party_6 Mizrahi Traditionalist Alliance"
 ISR70_party_6_desc:0 "An alternative traditionalist movement gives development towns an independent voice. Shas remains a later foundation rather than a party transplanted into 1970."
 ISR70_party_7:0 "£ISR70_party_7 Development Directorate"
 ISR70_party_7_desc:0 "An explicitly alternative emergency directorate must choose between professional administration and patronage, and between a civilian transition and enduring presidential power."
 ISR70_party_8:0 "Unavailable Political Slot"
 ISR70_party_8_desc:0 "This slot does not participate in Israel's 1970 political system."
 ISR70_party_8_icon:0 ""
 ISR70_party_9:0 "Unavailable Political Slot"
 ISR70_party_9_desc:0 "This slot does not participate in Israel's 1970 political system."
