 ISR70_policy_expulsion_garrison_desc:0 "Civilian harm and ongoing conflict are not erased by a new government."
 ISR70_policy_expulsion_condemnation:0 "Expulsion Condemnation"
 ISR70P.421.t:0 "Forced Displacement in Sinai"
 ISR70P.421.d:0 "Israel has ordered forced displacement of Arab residents. Civilian homes, property, livelihoods and return claims are affected. The government may impose a real trade embargo or issue diplomatic condemnation."
 ISR70P.421.a:0 "Impose a trade embargo."
 ISR70P.421.b:0 "Condemn the policy diplomatically."
 ISR70_policy_resistance_203001_tt:0 "Resistance target from this policy: +25 percentage points."
 ISR70_policy_emergency_access:0 "Permanent Emergency Administration"
 ISR70_policy_emergency_access_desc:0 "Additional occupied factory access during the emergency regime."
 ISR70_policy_sunset_access:0 "Temporary Security Mandate"
 ISR70_policy_sunset_access_desc:0 "Additional occupied factory access only during the temporary mandate."
 ISR70_policy_decision_renew_security_sunset:0 "Renew the Temporary Security Mandate"
 ISR70_policy_decision_renew_security_sunset_desc:0 "Renew a lapsed 365-day mandate without suspending elections."
 ISR70_policy_decision_end_expulsion:0 "End the Forced-Displacement Policy"
 ISR70_policy_decision_end_expulsion_desc:0 "End the active policy explicitly. Civilian claims, economic harm and outstanding return obligations remain; equal rights and restitution require their own reforms."
 ISR70_policy_decision_repeal_inalienable_land:0 "Repeal the Inalienable-Land Statute"
 ISR70_policy_decision_repeal_inalienable_land_desc:0 "Repeal the legal barrier before a territorial return can be implemented. Prior expropriation claims remain."
 ISR70_policy_decision_restore_emergency_elections:0 "Restore Elections after the Territorial Emergency"
 ISR70_policy_decision_restore_emergency_elections_desc:0 "End the policy-imposed suspension explicitly. This restores elections within the current governing outlook; it does not install a new party or erase civilian claims."
 ISR70_policy_policy_suspended_elections_condition_tt:0 "Policy suspended elections."
 ISR70_policy_decision_reenact_permanent_emergency:0 "Re-enact the Permanent Territorial Emergency"
 ISR70_policy_decision_reenact_permanent_emergency_desc:0 "A returning government must explicitly re-enact the territorial emergency after its earlier suspension ended."
 ISR70_policy_factory_access:0 "Occupied Factory Access"
 ISR70_policy_factory_access_desc:0 "Additional access to existing factories, limited by the remaining room below 100%. It is not factory output or newly created industry."
 ISR70_policy_decision_abandon_territorial_mandate:0 "Abandon the Permanent Territorial Mandate"
 ISR70_policy_decision_abandon_territorial_mandate_desc:0 "Pay 100 political power to abandon permanent territorial retention. Previous projects and civilian claims remain; an Egyptian agreement is still required before withdrawal."
 ISR70P.430.t:0 "An Israeli Territorial Withdrawal Proposal"
 ISR70P.430.d:0 "Israel has abandoned its permanent-retention mandate and offers an actual return of the controlled Sinai. The agreement does not erase earlier civilian property or return claims."
 ISR70P.430.a:0 "Accept the territorial return."
 ISR70P.430.b:0 "Reject these security terms."
 ISR70_policy_decision_negotiate_withdrawal:0 "Negotiate Sinai Withdrawal"
 ISR70_policy_decision_negotiate_withdrawal_desc:0 "After abandoning the mandate, negotiate an explicit return even if the original maximalist focus choice remains in the historical focus record. Egypt must accept; no other owner's territory is transferred."
 ISR70P.1160.t:0 "Suez Canal Reopening Works"
 ISR70P.1160.d:0 "The reserved canal clearance and reopening programme has reached its completion date. Continued control and ceasefire are required; a failed project returns its original budget."
