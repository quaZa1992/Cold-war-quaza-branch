 ISR70_policy_gi_sinai_admin_idea:0 "A Permanent Sinai Administration"
 ISR70_policy_gi_sinai_admin_idea_desc:0 "Establish permanent Sinai administration at a cost of 0.3% of GDP. Local infrastructure builds 15% faster; bureaucracy costs rise 3%. Egyptian ownership remains until an actual territorial settlement."
 ISR70_policy_gi_sinai_families_services:0 "Voluntary Settlement in the Sinai Towns"
 ISR70_policy_gi_sinai_families_services_desc:0 "Temporary family services for a limited voluntary internal migration programme."
 ISR70_policy_frontier_family_services:0 "Frontier Family Services"
 ISR70_policy_frontier_family_services_desc:0 "A five-year national family-service programme; monthly_population is a growth-rate modifier, not a migration count."
 ISR70_policy_gi_canal_settlers_services:0 "A Sinai Coastal Settlement Programme"
 ISR70_policy_gi_canal_settlers_services_desc:0 "Temporary family services for a limited voluntary internal migration programme."
 ISR70_policy_project_gi_canal_navigation_idea:0 "Organize Sinai Coastal Logistics"
 ISR70_policy_project_gi_canal_navigation_idea_desc:0 "An implemented, funded development programme."
 ISR70_policy_canal_province_admin:0 "Sinai Provincial Administration"
 ISR70_policy_canal_province_admin_desc:0 "An annexed province requires a permanent civil administrative apparatus."
 ISR70_policy_equal_status:0 "Equal Civil Rights"
 ISR70_policy_equal_status_desc:0 "A legal-status policy with explicit continuing costs. It is replaced, not stacked, when the legal regime changes."
 ISR70_policy_special_status:0 "Unequal Occupation Status"
 ISR70_policy_special_status_desc:0 "A legal-status policy with explicit continuing costs. It is replaced, not stacked, when the legal regime changes."
