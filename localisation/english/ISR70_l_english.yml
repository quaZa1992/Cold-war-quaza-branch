 ISR70_p5_ca_deepen:0 "Jewish-Arab Federalism: Implementation"
 ISR70_p5_ca_deepen_desc:0 "Protect local representation and the stability of the federal settlement."
 ISR70_p5_cb:0 "A Common Civic Republic"
