 ISR70_policy_project_equal_services_desc:0 "Reserve 0.6% of annual GDP at selection. Delivery after 180 days: +1 infrastructure levels in Haifa. Continuing effects: Stability: +2%; Social Spending Cost: +3%. Loss of required control or project conditions refunds the exact reserved sum. The project can be completed only once."
