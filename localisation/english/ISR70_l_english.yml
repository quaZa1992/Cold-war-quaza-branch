 ISR70_variant_herut:0 "£ISR70_variant_herut Herut"
 ISR70_variant_herut_icon:0 "£ISR70_variant_herut"
 ISR70_variant_herut_desc:0 "(Revisionist Zionism) - Freedom Movement (Hebrew: Tnuat HaHerut, Herut)\n\nHerut was founded in 1948 by Menachem Begin and the veterans of the Irgun. Heir to Ze'ev Jabotinsky's Revisionist Zionism, it calls for the Jewish people's right to the entire Land of Israel and opposes territorial concessions.\n\nFor two decades Herut was shunned by Ben-Gurion's Labor establishment. Its alliance with the Liberals in Gahal and Begin's entry into the 1967 national unity government have made it respectable, and it now speaks for Mizrahi immigrants and the urban poor against the Labor elite."
 ISR70_variant_liberal_party:0 "£ISR70_variant_liberal_party Liberal Party"
 ISR70_variant_liberal_party_icon:0 "£ISR70_variant_liberal_party"
 ISR70_variant_liberal_party_desc:0 "(Liberal Conservatism) - Liberal Party (Hebrew: HaMiflaga HaLiberalit)\n\nThe Liberal Party was founded in 1961 from the merger of the General Zionists and the Progressive Party. In 1965 its majority joined Herut to form Gahal, while the more progressive minority split away as the Independent Liberals.\n\nLed by Yosef Sapir and Simha Erlich, the Liberals represent the middle class, private business and free enterprise. They seek to curb the power of the Histadrut and state-owned firms and to give Israel a more market-oriented economy."
 ISR70_variant_labor_party:0 "£ISR70_variant_labor_party Israeli Labor Party"
 ISR70_variant_labor_party_icon:0 "£ISR70_variant_labor_party"
 ISR70_variant_labor_party_desc:0 "(Labor Zionism) - Israeli Labor Party (Hebrew: Mifleget HaAvoda HaYisraelit)\n\nThe Israeli Labor Party was founded in 1968 by the merger of Mapai, Ahdut HaAvoda and Rafi. It is the heir to the movement that built the Histadrut, the kibbutzim and the state itself, and dominates Israeli politics.\n\nIts leaders include Golda Meir, Moshe Dayan, Yigal Allon and Pinchas Sapir. Labor stands for a strong welfare state, a mixed economy under Histadrut and state ownership, a citizen army and the pursuit of security through strength and selective territorial compromise."
 ISR70_variant_agudat:0 "£ISR70_variant_agudat Agudat Yisrael"
 ISR70_variant_agudat_icon:0 "£ISR70_variant_agudat"
 ISR70_variant_agudat_desc:0 "(Haredi Judaism) - Union of Israel (Hebrew: Agudat Yisrael)\n\nAgudat Yisrael was founded in 1912 in Katowice as the political arm of Orthodox Jewry, originally opposed to Zionism. In Israel it represents the Ashkenazi ultra-Orthodox, guided by its Council of Torah Sages.\n\nLed in the Knesset by Yitzhak-Meir Levin and Menachem Porush, it defends the independent Haredi school system, exemptions from military service for yeshiva students and strict observance of religious law in public life. It cooperates with any government that protects these interests."
 ISR70_variant_poalei_agudat:0 "£ISR70_variant_poalei_agudat Poalei Agudat Yisrael"
 ISR70_variant_poalei_agudat_icon:0 "£ISR70_variant_poalei_agudat"
 ISR70_variant_poalei_agudat_desc:0 "(Religious Labour) - Workers of Agudat Yisrael (Hebrew: Poalei Agudat Yisrael)\n\nPoalei Agudat Yisrael is the workers' wing of the ultra-Orthodox movement, founded in Poland in 1922. Unlike its parent party, it took part in settlement and built its own religious kibbutzim and moshavim.\n\nLed by Kalman Kahana, it combines strict Torah observance with social concern for religious workers and a more cooperative attitude towards the Zionist state. It occasionally joins coalitions independently of Agudat Yisrael. Its moshav Komemiyut and kibbutz Hafetz Haim embody this rare blend of piety and pioneering."
 ISR70_variant_progress_development:0 "£ISR70_variant_progress_development Progress and Development"
 ISR70_variant_progress_development_icon:0 "£ISR70_variant_progress_development"
 ISR70_variant_progress_development_desc:0 "(Arab Notable Clientelism) - Progress and Development (Arabic: Al-Taqaddum wa-l-Tatawwur)\n\nProgress and Development is an Arab satellite list allied with the Labor movement, led by Seif el-Din el-Zoubi of Nazareth. It is built on the support of influential families, village heads and local notables.\n\nIn return for loyal votes in the Knesset, the list secures permits, jobs, roads and local investment for Arab communities. Critics call it a patronage machine of the ruling party, while its leaders call it the realistic path to development."
 ISR70_variant_cooperation_brotherhood:0 "£ISR70_variant_cooperation_brotherhood Cooperation and Brotherhood"
 ISR70_variant_cooperation_brotherhood_icon:0 "£ISR70_variant_cooperation_brotherhood"
 ISR70_variant_cooperation_brotherhood_desc:0 "(Arab Notable Clientelism) - Cooperation and Brotherhood (Arabic: Al-Ta'awun wa-l-Ikha)\n\nCooperation and Brotherhood is an Arab and Druze satellite list linked to the Labor Party since the early 1960s. Its leaders, including Druze notable Jabr Muadi, draw on clan networks in the villages of the Galilee and Carmel.\n\nThe list trades political loyalty for development funds, land deals and government posts. It embodies the alliance between Labor and the traditional Arab and Druze elites, whose influence is beginning to wane among a younger, more political generation."
 ISR70_variant_peace_list:0 "£ISR70_variant_peace_list Peace List"
 ISR70_variant_peace_list_icon:0 "£ISR70_variant_peace_list"
 ISR70_variant_peace_list_desc:0 "(Socialist Dovism) - Peace List (Hebrew: Reshimat HaShalom)\n\nThe Peace List is a small dovish electoral list of left-Zionist intellectuals, kibbutz members and veterans of the peace movement. It draws on those who believe that the victory of 1967 must be translated into peace rather than permanent occupation.\n\nThe list calls for negotiations with the Arab states and the Palestinians, territorial compromise and the protection of Israel's democratic and socialist character. It stands close to Mapam and campaigns for Jewish-Arab understanding."
 ISR70_variant_young_israel:0 "£ISR70_variant_young_israel Young Israel"
 ISR70_variant_young_israel_icon:0 "£ISR70_variant_young_israel"
 ISR70_variant_young_israel_desc:0 "(Religious Zionism) - Young Israel (Hebrew: Yisrael HaTzeira)\n\nYoung Israel is the rising generation within religious Zionism. Led by younger activists such as Zevulun Hammer and Yehuda Ben-Meir, they challenge the old leadership of Moshe Haim Shapira and Yosef Burg inside the National Religious Party.\n\nAfter the Six-Day War they see the conquered heartland of Judea and Samaria as a religious calling. They push the party away from its traditional alliance with Labor and towards an assertive national-religious agenda of settlement, education and Torah-based statehood."
 ISR70_variant_likud:0 "£ISR70_variant_likud (Likud) - National Liberal Movement"
 ISR70_variant_likud_icon:0 "£ISR70_variant_likud"
 ISR70_variant_likud_desc:0 "(National Liberalism) - The Consolidation – National Liberal Movement (Hebrew: HaLikud – Tenua Leumit Liberalit, Likud)\n\nThe Likud was founded in 1973 under Menachem Begin, uniting Gahal with the Free Centre, the State List and the Land of Israel Movement. Inspired by Ariel Sharon's organising efforts, it creates for the first time a credible alternative to Labor.\n\nLikud stands for the Greater Land of Israel, a liberal economy and the dignity of the Mizrahi immigrants marginalised by the Labor establishment. Its victory in 1977 would end three decades of Labor rule and transform Israeli politics."
 ISR70_variant_shinui:0 "£ISR70_variant_shinui Shinui"
 ISR70_variant_shinui_icon:0 "£ISR70_variant_shinui"
 ISR70_variant_shinui_desc:0 "(Secular Liberalism) - Change (Hebrew: Shinui)\n\nShinui grew out of the protest movements that followed the Yom Kippur War of 1973. Led by law professor Amnon Rubinstein, it gave voice to a frustrated middle class demanding accountability from the Labor establishment.\n\nThe party stands for clean government, electoral reform, a liberal economy and the separation of religion and state. It appeals to secular professionals, academics and reservists who want a modern, transparent and efficient Israel. In 1977 it would join the Democratic Movement for Change."
 ISR70_variant_hadash:0 "£ISR70_variant_hadash (Hadash) - Democratic Front for Peace and Equality"
 ISR70_variant_hadash_icon:0 "£ISR70_variant_hadash"
 ISR70_variant_hadash_desc:0 "(Marxism-Leninism) - Democratic Front for Peace and Equality (Hebrew: HaHazit HaDemokratit LeShalom u-LeShivyon, Hadash)\n\nHadash was founded in 1977 by the communist Rakah together with the Black Panthers and other left-wing groups. Led by Meir Vilner and Tawfik Toubi, it became the main political voice of Israel's Arab citizens.\n\nThe front calls for a full withdrawal from the territories occupied in 1967, a Palestinian state alongside Israel and full equality for Arab citizens. It combines Jewish-Arab cooperation with socialist economic policy and close ties to the communist movement."
 ISR70_variant_shas:0 "£ISR70_variant_shas (Shas) - Sephardi Torah Guardians"
 ISR70_variant_shas_icon:0 "£ISR70_variant_shas"
 ISR70_variant_shas_desc:0 "(Mizrahi Haredi Traditionalism) - Sephardi Torah Guardians (Hebrew: Shomrei Torah Sfaradim, Shas)\n\nShas was founded in 1984 under the spiritual leadership of Rabbi Ovadia Yosef, former Sephardi Chief Rabbi. It broke the Ashkenazi dominance of ultra-Orthodox politics and gave Mizrahi Jews their own religious party.\n\nThe party combines Torah observance with social welfare, running a large network of schools and charities in development towns and poor neighbourhoods. Its slogan of 'restoring the crown to its former glory' expresses Mizrahi pride against the secular Ashkenazi establishment."
 ISR70_variant_kach:0 "£ISR70_variant_kach Kach"
 ISR70_variant_kach_icon:0 "£ISR70_variant_kach"
 ISR70_variant_kach_desc:0 "(Kahanism) - Thus (Hebrew: Kach)\n\nKach was founded in 1971 by Rabbi Meir Kahane, founder of the Jewish Defense League in the United States, after his emigration to Israel. It entered the Knesset in 1984 and was banned in 1988 for incitement to racism.\n\nKach preaches an ultranationalist theocratic state, the expulsion of Arabs from the Land of Israel and the annexation of all territories. It glorifies Jewish strength and vigilantism and rejects democracy wherever it conflicts with its interpretation of Jewish law."
 ISR70_variant_utj:0 "£ISR70_variant_utj United Torah Judaism"
 ISR70_variant_utj_icon:0 "£ISR70_variant_utj"
 ISR70_variant_utj_desc:0 "(Haredi Judaism) - United Torah Judaism (Hebrew: Yahadut HaTorah)\n\nUnited Torah Judaism was formed in 1992 as an alliance of the Hasidic Agudat Yisrael and the Lithuanian Degel HaTorah. It represents the rapidly growing Ashkenazi ultra-Orthodox community.\n\nThe alliance defends state funding for yeshivot, exemption of Torah students from conscription, the authority of the rabbinate and the observance of the Sabbath. It acts as a kingmaker in coalition politics, trading support for communal benefits. Its rabbis, not its candidates, decide the alliance's course on every major issue."
 ISR70_variant_meretz:0 "£ISR70_variant_meretz Meretz"
 ISR70_variant_meretz_icon:0 "£ISR70_variant_meretz"
 ISR70_variant_meretz_desc:0 "(Social Democracy) - Energy (Hebrew: Meretz)\n\nMeretz was founded in 1992 as an alliance of Ratz, Mapam and Shinui under Shulamit Aloni. It became a partner in Yitzhak Rabin's government that signed the Oslo Accords.\n\nThe party stands for peace with the Palestinians through a two-state solution, human rights, the separation of religion and state, LGBT rights and social democracy. It is the main voice of the secular, dovish Zionist left. Its voters are concentrated in Tel Aviv, the kibbutzim and the academic world."
 ISR70_variant_balad:0 "£ISR70_variant_balad (Balad) - National Democratic Assembly"
 ISR70_variant_balad_icon:0 "£ISR70_variant_balad"
 ISR70_variant_balad_desc:0 "(Arab Nationalism) - National Democratic Assembly (Arabic: Al-Tajammu al-Watani al-Dimuqrati, Balad)\n\nBalad was founded in 1995 by philosopher Azmi Bishara. It speaks for Arab citizens who define themselves as part of the Palestinian people and reject the Jewish character of the state.\n\nThe party calls for Israel to become 'a state of all its citizens', with cultural autonomy for the Arab minority and full civil equality. It supports a Palestinian state on the 1967 borders and combines secular Arab nationalism with left-wing social policy."
 ISR70_variant_daam:0 "£ISR70_variant_daam (Da'am) - Workers' Party"
 ISR70_variant_daam_icon:0 "£ISR70_variant_daam"
 ISR70_variant_daam_desc:0 "(Revolutionary Socialism) - Workers' Party (Arabic: Hizb al-Da'm al-Ummali, Da'am)\n\nDa'am was founded in 1995 by Jewish and Arab activists from the radical left. Led by Asma Agbarieh-Zahalka, it organises low-wage workers, particularly Arab women, and emerged from the Workers' Advice Centre trade-union initiative.\n\nThe party rejects both Zionism and Arab nationalism and calls for a socialist transformation independent of any bloc. It campaigns for workers' rights, gender equality and Jewish-Arab class solidarity. Its candidates have never crossed the electoral threshold, but its message endures."
 ISR70_variant_taal:0 "£ISR70_variant_taal (Ta'al) - Arab Movement for Renewal"
 ISR70_variant_taal_icon:0 "£ISR70_variant_taal"
 ISR70_variant_taal_desc:0 "(Arab Civic Nationalism) - Arab Movement for Renewal (Arabic: Al-Haraka al-Arabiyya li-l-Taghyir, Ta'al)\n\nThe Arab Movement for Renewal was founded in 1996 by Ahmad Tibi, a gynaecologist and former adviser to Yasser Arafat. It has since run on joint lists with other Arab parties and become a prominent voice in the Knesset.\n\nTa'al demands full civil equality for Arab citizens, an end to the occupation and a Palestinian state alongside Israel. It combines Palestinian national identity with pragmatic parliamentary work for Arab towns and communities."
 ISR70_variant_raam:0 "£ISR70_variant_raam (Ra'am) - United Arab List"
 ISR70_variant_raam_icon:0 "£ISR70_variant_raam"
 ISR70_variant_raam_desc:0 "(Islamic Democracy) - United Arab List (Arabic: Al-Qaima al-Arabiyya al-Muwahhada, Ra'am)\n\nThe United Arab List was founded in 1996 as an alliance including the southern branch of the Islamic Movement in Israel. Under Mansour Abbas it later made history in 2021 by joining a governing coalition.\n\nRa'am combines conservative Islamic values with pragmatic politics, focusing on the everyday needs of Arab citizens: housing, crime, infrastructure and the recognition of Bedouin villages in the Negev. It prefers influence through cooperation to permanent opposition."
 ISR70_variant_yisrael_baaliyah:0 "£ISR70_variant_yisrael_baaliyah Yisrael BaAliyah"
 ISR70_variant_yisrael_baaliyah_icon:0 "£ISR70_variant_yisrael_baaliyah"
 ISR70_variant_yisrael_baaliyah_desc:0 "(Immigrant Centre-Right) - Israel on the Rise (Hebrew: Yisrael BaAliyah)\n\nYisrael BaAliyah was founded in 1996 by the former Soviet dissident Natan Sharansky. It represented the hundreds of thousands of immigrants from the former Soviet Union who arrived in Israel during the 1990s.\n\nThe party fought for the integration of the new immigrants: jobs, housing, the recognition of professional qualifications and civil marriage. It combined these demands with centre-right positions on security and joined several coalitions before merging into the Likud in 2003."
 ISR70_variant_greens:0 "£ISR70_variant_greens The Greens"
 ISR70_variant_greens_icon:0 "£ISR70_variant_greens"
 ISR70_variant_greens_desc:0 "(Ecologism) - The Greens (Hebrew: HaYerukim)\n\nThe Greens were founded in 1997 by environmental activists concerned about the rapid destruction of Israel's open spaces, the pollution of the Kishon river and the Mediterranean coast, and the country's growing water crisis.\n\nThe party calls for sustainable development, public transport, renewable energy and the protection of nature and coastline. It sought support in local councils and occasionally formed alliances with left-wing and centrist parties at national level. It remained a small, idealistic force at the margins of the Knesset."
 ISR70_variant_tkuma:0 "£ISR70_variant_tkuma Tkuma"
 ISR70_variant_tkuma_icon:0 "£ISR70_variant_tkuma"
 ISR70_variant_tkuma_desc:0 "(National Religious Populism) - Revival (Hebrew: Tkuma)\n\nTkuma was founded in 1998 by Hanan Porat and Zvi Hendel, settler leaders who left the National Religious Party in protest against the Wye River Memorandum. It later became the backbone of the Religious Zionist Party under Bezalel Smotrich.\n\nThe party opposes any territorial concession in the Land of Israel, champions the settlement movement and demands the application of Israeli sovereignty to Judea and Samaria. It speaks with a combative, populist voice for the settlers."
 ISR70_variant_center_party:0 "£ISR70_variant_center_party Centre Party"
 ISR70_variant_center_party_icon:0 "£ISR70_variant_center_party"
 ISR70_variant_center_party_desc:0 "(Centrism) - Centre Party (Hebrew: Mifleget HaMerkaz)\n\nThe Centre Party was founded in 1999 by prominent figures from the Likud and the army, among them Yitzhak Mordechai, Dan Meridor, Roni Milo and former Chief of Staff Amnon Lipkin-Shahak. It sought to replace Benjamin Netanyahu.\n\nThe party offered a moderate path between Likud and Labor: continued peace negotiations, a firm security posture and good governance. Its leadership of generals and veteran politicians promised responsible and experienced government. It won six seats in the 1999 election before fading away."
 ISR70_variant_yisrael_beiteinu:0 "£ISR70_variant_yisrael_beiteinu Yisrael Beiteinu"
 ISR70_variant_yisrael_beiteinu_icon:0 "£ISR70_variant_yisrael_beiteinu"
 ISR70_variant_yisrael_beiteinu_desc:0 "(Secular Nationalism) - Israel Our Home (Hebrew: Yisrael Beiteinu)\n\nYisrael Beiteinu was founded in 1999 by Avigdor Lieberman, former director-general of the Prime Minister's Office. Its base is the large community of Russian-speaking immigrants from the former Soviet Union.\n\nThe party combines hard-line security policy and suspicion towards Arab parties with militant secularism: civil marriage, public transport on the Sabbath and conscription of the ultra-Orthodox. It is a pragmatic power broker on the secular right. Its slogan 'No loyalty, no citizenship' sharpened its nationalist profile."
 ISR70_variant_kadima:0 "£ISR70_variant_kadima Kadima"
 ISR70_variant_kadima_icon:0 "£ISR70_variant_kadima"
 ISR70_variant_kadima_desc:0 "(Centrism) - Forward (Hebrew: Kadima)\n\nKadima was founded in 2005 by Prime Minister Ariel Sharon after he left the Likud over the disengagement from Gaza. Former Likud and Labor leaders including Ehud Olmert and Shimon Peres joined it, and it won the 2006 election.\n\nThe party combines a firm security policy with readiness for unilateral separation from the Palestinians. It presents itself as a pragmatic centre between the nationalist right and the dovish left, seeking permanent borders through disengagement and negotiation."
 ISR70_variant_yesh_atid:0 "£ISR70_variant_yesh_atid Yesh Atid"
 ISR70_variant_yesh_atid_icon:0 "£ISR70_variant_yesh_atid"
 ISR70_variant_yesh_atid_desc:0 "(Secular Centrism) - There Is a Future (Hebrew: Yesh Atid)\n\nYesh Atid was founded in 2012 by journalist Yair Lapid and became the second-largest party in the 2013 election. It speaks for the secular middle class that took to the streets in the 2011 cost-of-living protests.\n\nThe party demands an equal share of the burden, including military service for the ultra-Orthodox, lower living costs, education reform and civil marriage. In foreign policy it supports negotiations towards separation from the Palestinians while maintaining security."
 ISR70_variant_otzma:0 "£ISR70_variant_otzma Otzma Yehudit"
 ISR70_variant_otzma_icon:0 "£ISR70_variant_otzma"
 ISR70_variant_otzma_desc:0 "(Kahanism) - Jewish Power (Hebrew: Otzma Yehudit)\n\nOtzma Yehudit was founded in 2012 by Michael Ben-Ari, Aryeh Eldad and other heirs of Meir Kahane's movement. Under Itamar Ben-Gvir it rose from the fringe to become a partner in government in 2022.\n\nThe party demands Israeli sovereignty over the whole Land of Israel, the encouragement of Arab emigration, harsh measures against terrorism and a Jewish character for the state. It mobilises young voters with confrontational nationalism. Its leaders openly honour the memory of Rabbi Kahane."
 ISR70_variant_zehut:0 "£ISR70_variant_zehut Zehut"
 ISR70_variant_zehut_icon:0 "£ISR70_variant_zehut"
 ISR70_variant_zehut_desc:0 "(Libertarian Nationalism) - Identity (Hebrew: Zehut)\n\nZehut was founded in 2015 by Moshe Feiglin, a former Likud member and leader of the Jewish Leadership faction. It attracted a surprising following among young voters in 2019.\n\nThe party combines radical economic libertarianism, deregulation and the legalisation of cannabis with Jewish nationalism and sovereignty over the whole Land of Israel. It promises minimal government, individual liberty and a Jewish state free of bureaucratic paternalism. Its idiosyncratic mix defies the traditional left-right divide."
 ISR70_variant_jewish_home:0 "£ISR70_variant_jewish_home The Jewish Home"
 ISR70_variant_jewish_home_icon:0 "£ISR70_variant_jewish_home"
 ISR70_variant_jewish_home_desc:0 "(Religious Zionism) - The Jewish Home (Hebrew: HaBayit HaYehudi)\n\nThe Jewish Home was founded in 2008 as the successor to the National Religious Party, uniting religious Zionists after decades of division. Under Naftali Bennett from 2012 it presented a modern, assertive religious Zionism that appealed to secular voters as well.\n\nThe party champions settlement in Judea and Samaria, a strong Jewish identity in education and opposition to a Palestinian state. It combines national-religious values with economic liberalism and a high-tech, entrepreneurial image."
 ISR70_variant_hosen:0 "£ISR70_variant_hosen Israel Resilience"
 ISR70_variant_hosen_icon:0 "£ISR70_variant_hosen"
 ISR70_variant_hosen_desc:0 "(Centrism) - Israel Resilience (Hebrew: Hosen LeYisrael)\n\nIsrael Resilience was founded in December 2018 by former Chief of Staff Benny Gantz. It aimed to offer an alternative to the long rule of Benjamin Netanyahu built on military experience and statesmanlike moderation.\n\nThe party emphasises national unity, the rule of law and integrity in public life. It calls for a strong security policy combined with a willingness to pursue regional peace, and it soon merged with Yesh Atid and Telem to form Blue and White."
 ISR70_variant_blue_white:0 "£ISR70_variant_blue_white Blue and White"
 ISR70_variant_blue_white_icon:0 "£ISR70_variant_blue_white"
 ISR70_variant_blue_white_desc:0 "(Centrism) - Blue and White (Hebrew: Kahol Lavan)\n\nBlue and White was founded in 2019 as an alliance of Benny Gantz's Israel Resilience, Yair Lapid's Yesh Atid and Moshe Ya'alon's Telem. With three former chiefs of staff on its list, it became Likud's main rival in three successive elections.\n\nThe alliance offers state-minded centrism: security credentials, defence of the judiciary and the rule of law, and an end to political polarisation. Its slogan 'Israel before everything' reflects its claim to stand above the camps."
 ISR70_variant_noam:0 "£ISR70_variant_noam Noam"
 ISR70_variant_noam_icon:0 "£ISR70_variant_noam"
 ISR70_variant_noam_desc:0 "(Religious Social Conservatism) - Noam (Hebrew: Noam)\n\nNoam was founded in 2019 by followers of the Har Hamor yeshiva and led by Avi Maoz. It emerged from the most conservative wing of religious Zionism in reaction to the growing acceptance of LGBT rights and liberal Judaism in Israeli society.\n\nThe party defends a traditional understanding of the family and opposes Reform conversions and liberal gender policies. It runs within the broader religious Zionist camp and seeks influence over education and the Jewish character of the state."
 ISR70_variant_new_hope:0 "£ISR70_variant_new_hope New Hope"
 ISR70_variant_new_hope_icon:0 "£ISR70_variant_new_hope"
 ISR70_variant_new_hope_desc:0 "(National Liberalism) - New Hope (Hebrew: Tikva Hadasha)\n\nNew Hope was founded in December 2020 by Gideon Sa'ar after he left the Likud in opposition to Benjamin Netanyahu's leadership. It attracted right-wing politicians who rejected the cult of personality around the prime minister.\n\nThe party holds firmly right-wing positions on security and settlement but stresses the rule of law, the independence of the courts and clean government. It sees itself as the heir to the traditional national-liberal Likud of Begin."
 ISR70_variant_national_unity:0 "£ISR70_variant_national_unity National Unity"
 ISR70_variant_national_unity_icon:0 "£ISR70_variant_national_unity"
 ISR70_variant_national_unity_desc:0 "(Centrism) - National Unity (Hebrew: HaMahane HaMamlakhti)\n\nNational Unity was formed in 2022 by Benny Gantz's Blue and White and Gideon Sa'ar's New Hope, later joined by former Chief of Staff Gadi Eisenkot. It presents itself as a broad statist camp of centre and moderate right.\n\nThe party stands for 'mamlakhtiyut', a responsible statesmanship above sectoral interests: a strong army, an independent judiciary and a national consensus on security and civil society. It positions itself as a potential governing alternative across the political divide."
 ISR70_variant_democrats_labor:0 "£ISR70_variant_democrats_labor The Democrats – Labor Wing"
 ISR70_variant_democrats_labor_icon:0 "£ISR70_variant_democrats_labor"
 ISR70_variant_democrats_labor_desc:0 "(Social Democracy) - The Democrats – Labor Wing (Hebrew: HaDemokratim – agaf HaAvoda)\n\nThe Democrats were formed in 2024 by the merger of the Israeli Labor Party and Meretz under former Deputy Chief of Staff Yair Golan. The Labor wing brings the historic institutions and traditions of the party that built the state.\n\nThis wing emphasises social democracy, a strong public sector and the defence of democratic institutions. It calls for separation from the Palestinians through a political settlement and for a renewed liberal Zionism in the face of the nationalist right."
 ISR70_variant_democrats_meretz:0 "£ISR70_variant_democrats_meretz The Democrats – Meretz Wing"
 ISR70_variant_democrats_meretz_icon:0 "£ISR70_variant_democrats_meretz"
 ISR70_variant_democrats_meretz_desc:0 "(Progressive Social Democracy) - The Democrats – Meretz Wing (Hebrew: HaDemokratim – agaf Meretz)\n\nThe Democrats were formed in 2024 by the merger of Meretz and the Israeli Labor Party under Yair Golan. The Meretz wing contributes the traditions of the civil-rights and peace movements.\n\nThis wing emphasises human rights, equality for Arab citizens, the separation of religion and state and an end to the occupation through a two-state solution. It stands at the progressive edge of the united centre-left. Its activists dominate the civil-society organisations of the Israeli left."
 ISR70_party_0:0 "£ISR70_party_0 (Mafdal) - National Religious Party"
 ISR70_party_0_desc:0 "(Religious Zionism) - National Religious Party (Hebrew: HaMiflaga HaDatit Leumit, Mafdal)\n\nThe National Religious Party was founded in 1956 from the merger of Mizrachi and HaPoel HaMizrachi. Led by Interior Minister Moshe Haim Shapira, it has sat in every Labor-led government since independence and links state institutions, national service and the religious status quo.\n\nThe party controls the state religious school system and the rabbinate, and guards Sabbath and kashrut laws. After 1967 its younger generation looks to the territories, and the old pragmatic partnership with Labor is beginning to fray."
 ISR70_party_1:0 "£ISR70_party_1 (Gahal) - Herut-Liberal Bloc"
 ISR70_party_1_desc:0 "(National Liberalism) - Herut-Liberal Bloc (Hebrew: Gush Herut-Liberalim, Gahal)\n\nGahal was formed in 1965 as an alliance of Menachem Begin's Herut and the Liberal Party. In the 1969 election it won 26 seats, and it sits in Golda Meir's national unity government, which Begin joined on the eve of the Six-Day War.\n\nBegin must hold together the revisionist and liberal wings: one demands the whole Land of Israel, the other free enterprise and a weaker Histadrut. Should the government accept the Rogers Plan, Gahal is ready to leave the cabinet and build a broader right-wing union."
 ISR70_party_2:0 "£ISR70_party_2 (ILP) - Independent Liberals"
 ISR70_party_2_desc:0 "(Social Liberalism) - Independent Liberals (Hebrew: HaLiberalim HaAtzmaim, ILP)\n\nThe Independent Liberals were founded in 1965 by former Progressives who refused to join the Liberal Party's alliance with Herut. Led by Moshe Kol, Minister of Tourism and Development, they won four seats in 1969 and serve as a junior partner in Golda Meir's coalition.\n\nThe party combines support for small business and private initiative with defence of civil rights, separation of religion and state and a pragmatic, moderate security policy. It is the voice of the liberal professional middle class in a Labor-dominated state."
 ISR70_party_3:0 "£ISR70_party_3 (HaMaarakh) - Alignment"
 ISR70_party_3_desc:0 "(Labor Zionism) - Alignment (Hebrew: HaMaarakh – HaAvoda u-Mapam)\n\nThe Alignment, formed in 1969 by the Labor Party and Mapam, won 56 seats in the October 1969 election. Prime Minister Golda Meir governs through a broad national unity coalition, a citizen army and the institutions of Labor Zionism: the Histadrut, the kibbutzim and the state enterprises.\n\nHer government faces the War of Attrition along the Suez Canal, American peace initiatives and the question of the territories conquered in 1967. Inside the party, Moshe Dayan, Yigal Allon and Pinchas Sapir compete over the succession."
 ISR70_party_4:0 "£ISR70_party_4 (Rakah) - New Communist List"
 ISR70_party_4_desc:0 "(Marxism-Leninism) - New Communist List (Hebrew: Reshima Komunistit Hadasha, Rakah)\n\nRakah was founded in 1965 when the pro-Soviet and largely Arab wing of the Israeli Communist Party split from Moshe Sneh's Maki. Led by Meir Vilner and Tawfik Toubi, it won three seats in 1969 and is recognised by Moscow as Israel's communist party.\n\nRakah demands withdrawal from the occupied territories, recognition of Palestinian rights and an end to discrimination against Arab citizens. A Jewish-Arab communist government would nationalise key industries and realign Israel with the Soviet Union."
 ISR70_party_5:0 "£ISR70_party_5 Council and Kibbutz Left"
 ISR70_party_5_desc:0 "(Council Socialism) - Council and Kibbutz Left (Hebrew: Smol ha-moatzot ve-ha-kibutzim)\n\nThe Council and Kibbutz Left gathers young kibbutz members, New Left students and radical workers who see in the collective settlements a model for all of society. Influenced by 1968 and by groups such as Matzpen, they reject both the Labor bureaucracy and Soviet communism.\n\nTheir programme is radical decentralisation: production run by workers' councils, self-governing communities and a federal or common civic constitution shared by Jews and Arabs. They oppose the occupation and want Israel to break free of the Cold War blocs."
 ISR70_party_6:0 "£ISR70_party_6 Mizrahi Traditionalist Alliance"
 ISR70_party_6_desc:0 "(Mizrahi Traditionalism) - Mizrahi Traditionalist Alliance (Hebrew: Brit ha-masortiyyim ha-mizrahiyyim)\n\nThe Mizrahi Traditionalist Alliance draws on the growing anger of Jews from Morocco, Iraq and Yemen who live in the development towns and poor neighbourhoods of Israel. They feel humiliated by the Ashkenazi Labor establishment and its secular, socialist culture.\n\nThe alliance defends synagogue, family and tradition, demands social justice and resents the dominance of the old elites. Distrustful of the West and of Labor alike, it gives the periphery an independent and religiously coloured voice years before the Black Panthers and Shas."
 ISR70_party_7:0 "£ISR70_party_7 Development Directorate"
 ISR70_party_7_desc:0 "(Developmental Authoritarianism) - Development Directorate (Hebrew: Minhelet ha-pituah)\n\nThe Development Directorate is a hypothetical emergency administration of state planners, defence-industry managers and senior civil servants. Its members believe that coalition bargaining has paralysed the state while immigration, war and infrastructure demand decisive action.\n\nA directorate would govern by decree, concentrate investment in the defence industries, water projects and the periphery, and side with whichever power guarantees supplies. It must choose between professional administration and patronage, and between a civilian transition and enduring presidential power."
 ISR70_party_8:0 "£generic_Mod_Vilayat_e_Faqih_small Shia Reformists in the Diaspora"
 ISR70_party_8_desc:0 "(Shia Reformism) - Shia Reformists in the Diaspora (Arabic: Islahiyyun shi'a fi al-shatat)\n\nIsrael has almost no Shia population, but across the northern border the Shia of southern Lebanon are awakening politically. Under Imam Musa al-Sadr, who founded the Supreme Islamic Shia Council in 1969, they demand dignity and development for a long-neglected community.\n\nA small circle of reformist Shia emigrants and border villagers sympathises with this movement. They promote social justice, education and coexistence, but in Israel they remain a marginal current without parliamentary representation."
 ISR70_party_8_icon:0 "£generic_Mod_Vilayat_e_Faqih_small"
 ISR70_party_9:0 "£generic_Vilayat_e_Faqih_small Revolutionary Guardianship Current"
 ISR70_party_9_desc:0 "(Shia Revolutionary Islamism) - Revolutionary Guardianship Current (Arabic: Tayyar al-wilaya al-thawri)\n\nThe Revolutionary Guardianship Current is a hypothetical cell inspired by the teachings of Ayatollah Ruhollah Khomeini, who in exile in Najaf lectured in 1970 on the guardianship of the jurist. In Israel it has virtually no social base.\n\nIts handful of sympathisers dream of a revolutionary Islamic order that would sweep away both the Zionist state and the conservative Arab monarchies. Only a catastrophic collapse of the state could give such a current any real influence."
 ISR70_party_9_icon:0 "£generic_Vilayat_e_Faqih_small"
 ISR70_party_10:0 "£generic_Kingdom_small Royalist Salafis"
 ISR70_party_10_desc:0 "(Quietist Salafism) - Royalist Salafis (Arabic: Salafiyyu al-malakiyya)\n\nThe Royalist Salafis are a tiny conservative current among Muslim citizens and the Bedouin of the Negev who look to Saudi Arabia and its religious establishment for guidance. They reject political parties and revolution alike.\n\nTheir ideal is an Islamic order upheld by a pious monarch and scholarly authority, with strict adherence to the Quran and Sunna. In Israel they focus on mosques, religious instruction and charity, and have no realistic path to power."
 ISR70_party_10_icon:0 "£generic_Kingdom_small"
 ISR70_party_11:0 "£generic_Caliphate_small Salafi Caliphate Call"
 ISR70_party_11_desc:0 "(Salafi Jihadism) - Salafi Caliphate Call (Arabic: Da'wat al-khilafa al-salafiyya)\n\nThe Salafi Caliphate Call is a clandestine circle of radical preachers influenced by Hizb ut-Tahrir and the writings of Sayyid Qutb. They reject the Israeli state, Arab nationalism and the existing Arab regimes as illegitimate.\n\nTheir aim is a restored caliphate uniting all Muslims under Islamic law, to be achieved by preaching and, ultimately, by armed struggle. Watched closely by the Shin Bet, the circle remains on the extreme fringe of Arab society in Israel."
 ISR70_party_11_icon:0 "£generic_Caliphate_small"
 ISR70_party_12:0 "£ISR70_party_12 Municipal Islamic Current"
 ISR70_party_12_desc:0 "(Islamic Democracy) - Municipal Islamic Current (Arabic: Al-tayyar al-Islami al-baladi)\n\nThe Municipal Islamic Current is rooted in mosque committees, charities and local councils in Arab towns of the Triangle and Galilee. Its preachers, influenced by the Muslim Brotherhood, prepare the ground for the Islamic Movement that Abdullah Nimr Darwish would found in 1971.\n\nAs a parliamentary organization of Arab municipalities, it can prioritise trade, charitable provision or a common civic settlement. It offers religious revival, social services and moral renewal to communities neglected by the state and by the secular Arab parties."
 ISR70_party_13:0 "£ISR70_party_13 Agudat Yisrael and Poalei Agudat Yisrael"
 ISR70_party_13_desc:0 "(Haredi Judaism) - Agudat Yisrael and Poalei Agudat Yisrael (Hebrew: Agudat Yisrael / Poalei Agudat Yisrael)\n\nThe two ultra-Orthodox parties, the Union of Israel and its workers' wing, together won six seats in 1969. They stand outside the Zionist consensus, guided by the rabbis of the Council of Torah Sages rather than by any foreign power or bloc.\n\nThe Orthodox parties defend their communities through parliamentary bargaining, independent religious education, military exemptions for yeshiva students and local social institutions. In power they would deepen the religious character of the state."
 ISR70_party_14:0 "£ISR70_party_14 State List"
 ISR70_party_14_desc:0 "(Statist Pragmatism) - State List (Hebrew: HaReshima HaMamlakhtit)\n\nThe State List was founded in 1968 by David Ben-Gurion and those members of Rafi who refused to return to the Labor Party. It won four seats in 1969 and preserves the founding father's doctrine of mamlakhtiyut, the primacy of the state over parties and movements.\n\nIts members want electoral reform, a professional civil service and a state economy freed from Histadrut patronage. A pragmatic cabinet could professionalise public enterprises or encourage private business, choosing between defensive pragmatism and territorial negotiations."
 ISR70_party_15:0 "£ISR70_party_15 Progress and Development / Cooperation and Brotherhood"
 ISR70_party_15_desc:0 "(Arab Notable Clientelism) - Progress and Development and Cooperation and Brotherhood (Arabic: Al-Taqaddum wa-l-Tatawwur / Al-Ta'awun wa-l-Ikha)\n\nThe two Arab satellite lists of the Labor movement won four seats together in 1969. They rest on the wealth and influence of landowning families, merchants, village heads and Druze notables, who control access to state resources in their communities.\n\nThis alternative alliance of entrepreneurs and municipal notables offers stability in exchange for privileges. In power, it must choose between transparent investment in Arab towns and an economy of concessions, licences and family patronage."
 ISR70_party_16:0 "£ISR70_party_16 HaOlam HaZeh – New Force"
 ISR70_party_16_desc:0 "(Secular Radical Liberalism) - This World – New Force (Hebrew: HaOlam HaZeh – Koah Hadash)\n\nHaOlam HaZeh – New Force was founded in 1965 by Uri Avnery, editor of the irreverent news magazine HaOlam HaZeh. In 1969 it won two seats on a platform of radical secularism and civil liberties.\n\nAvnery defends a free press, equal citizenship for Arabs, separation of religion and state and peace with the Palestinians through a Palestinian state. The movement attacks the Labor establishment's corruption and paternalism and appeals to young, anti-clerical Israelis."
 ISR70_party_17:0 "£ISR70_party_17 Guardians of Landscape and Environment"
 ISR70_party_17_desc:0 "(Conservationism) - Guardians of Landscape and Environment (Hebrew: Shomrei ha-nof ve-ha-sviva)\n\nThe Guardians of Landscape and Environment grew out of Israel's early nature conservation movement, which fought in the 1960s to protect the wild flowers, the Hula wetlands and the coastline. Kibbutz members, scientists and teachers form its core.\n\nThis early environmental organisation addresses the real development choices of land, water, industry and public infrastructure. It calls for national parks, controlled urban growth, clean water and a balance between Zionist settlement and the protection of the landscape."
 ISR70_party_18:0 "£ISR70_party_18 (Mapam) - United Workers' Party"
 ISR70_party_18_desc:0 "(Socialist Zionism) - United Workers' Party (Hebrew: Mifleget HaPoalim HaMeuhedet, Mapam)\n\nMapam, the United Workers' Party, was founded in 1948 and is rooted in the Kibbutz Artzi movement and HaShomer HaTzair. Led by Meir Yaari and Ya'akov Hazan, it entered the Alignment with Labor in 1969 but keeps its own identity.\n\nMapam brings the cooperative movement, organised workers and a long commitment to Jewish-Arab equality into the debate over Israel's future. It distrusts the annexationist mood after 1967 and favours a socialist economy and negotiated peace."
 ISR70_party_19:0 "£ISR70_party_19 (Maki) - Israeli Communist Party"
 ISR70_party_19_desc:0 "(National Communism) - Israeli Communist Party (Hebrew: Miflaga Komunistit Yisraelit, Maki)\n\nMaki is the original communist party of Israel. After the 1965 split, its largely Jewish wing under Moshe Sneh and Shmuel Mikunis broke with Moscow's line, supported Israel in the Six-Day War and won one seat in 1969.\n\nAn independent communist cabinet would chart its own course between workers' institutions, parliamentary rights and economic planning, rejecting both Soviet tutelage and American influence. The party is moving towards the New Left and will soon merge into Moked."
 ISR70_party_20:0 "£ISR70_party_20 Free Centre"
 ISR70_party_20_desc:0 "(National Populism) - Free Centre (Hebrew: HaMerkaz HaHofshi)\n\nThe Free Centre was founded in 1967 by Shmuel Tamir, a prominent lawyer who rebelled against Menachem Begin's leadership of Herut. It won two seats in 1969 and positions itself as a nationalist alternative to both Labor and Gahal.\n\nTamir combines uncompromising nationalism on the territories with attacks on the corruption and bureaucracy of the old elites. This national opposition can remain parliamentary or seek a presidential mandate and a stronger executive."
 ISR70_party_21:0 "£ISR70_party_21 Radical National Front"
 ISR70_party_21_desc:0 "(Ultranationalism) - Radical National Front (Hebrew: Ha-hazit ha-leumit ha-radikalit)\n\nThe Radical National Front is a hypothetical ultranationalist movement fed by the euphoria of 1967 and the bitterness of the War of Attrition. Its members come from the fringes of Herut, the Land of Israel Movement and disaffected reservists.\n\nThe movement demands annexation of all occupied territories, permanent national mobilisation and an authoritarian security order. Autarky, mobilisation and repression would have real economic and diplomatic consequences, isolating Israel even from its American ally."
 ISR70_party_22:0 "£ISR70_party_22 Security Emergency Cabinet"
 ISR70_party_22_desc:0 "(Military Junta) - Security Emergency Cabinet (Hebrew: Kabinet herum bithoni)\n\nThe Israel Defence Forces are the most respected institution of the state, and their retired generals such as Moshe Dayan, Yigal Allon and Yitzhak Rabin dominate politics. Yet the army itself has always remained subordinate to civilian government.\n\nThe Security Emergency Cabinet would come about only in a genuine constitutional emergency. The General Staff under Chief of Staff Haim Bar-Lev would assume political control, rule through emergency regulations and subordinate the economy to the defence of the state."
 ISR70_party_23:0 "£ISR70_party_23 Davidic Kingdom Movement"
 ISR70_party_23_desc:0 "(Religious Monarchism) - Kingdom of the House of David (Hebrew: Malchut Beit David)\n\nThe Davidic Kingdom Movement is a small messianic current that sees the victory of 1967 and the return to Jerusalem's Old City as signs of redemption. Its followers yearn for the restoration of the monarchy of the House of David and the rebuilding of the Temple.\n\nThey seek a constitutional monarchy anchored in Torah law, with a Sanhedrin and a king as symbols of national unity. A crown could be founded only through a freely chosen constitutional process, making this the most exotic alternative in Israeli politics."
