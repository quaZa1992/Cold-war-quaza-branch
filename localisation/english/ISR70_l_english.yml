 ISR70_january_1970:0 "Israel in January 1970"
 ISR70_january_1970_desc:0 "Set the cabinet agenda for the new decade and release political capital for the first reforms."
 ISR70_knesset:0 "The Seventh Knesset"
 ISR70_knesset_desc:0 "The Seventh Knesset brings together the parties elected in October 1969. Parliamentary committees and a working legislative agenda must give the new government a durable basis for reform."
 ISR70_unity_cabinet:0 "A Cabinet across the Party Lines"
 ISR70_unity_cabinet_desc:0 "A broad coalition can distribute responsibility for national security across the major parties. Its members will expect a say in appointments and spending, slowing the passage of a common legislative programme."
 ISR70_narrow_cabinet:0 "A Disciplined Parliamentary Majority"
 ISR70_narrow_cabinet_desc:0 "A smaller coalition gives ministers clearer authority over the legislative agenda. Dependence on fewer parliamentary partners leaves the government more exposed to every dispute within its majority."
 ISR70_civil_service:0 "The Civil Service Commission"
 ISR70_civil_service_desc:0 "Merit examinations and common personnel standards can make a young state less dependent on party appointments. Professional administration will be cheaper to sustain, but the coalition will lose some of the patronage through which it has held together."
 ISR70_oversight:0 "The Comptroller and Parliamentary Oversight"
 ISR70_oversight_desc:0 "The State Comptroller must be able to follow public money from the cabinet to local administrations. Independent audits will make officials answer for misuse of their offices."
 ISR70_local_councils:0 "Municipal Engineering Offices"
 ISR70_local_councils_desc:0 "Local councils know which roads and service connections their communities need. Permanent engineering offices will speed municipal works while adding a modest standing administrative commitment."
 ISR70_central_planning:0 "Sapir's Development Tenders"
 ISR70_central_planning_desc:0 "Central tenders can concentrate scarce engineers and capital on projects that private investors would otherwise overlook. The same priority system gives established contractors greater protection from competition."
 ISR70_basic_laws:0 "The Unfinished Basic Laws"
 ISR70_basic_laws_desc:0 "Strengthen the Basic Law framework and open the constitutional convention decision."
 ISR70_p0_institution:0 "Religion in the Public State"
 ISR70_p0_institution_desc:0 "Anchor religious Zionism in parliamentary institutions and strengthen its public-service organizations."
 ISR70_research_speed_factor_tt:0 "$MODIFIER_RESEARCH_SPEED_FACTOR$: $RIGHT|+=%1$"
 ISR70_p0_ea:0 "Religious Workshops and Technical Schools"
 ISR70_p0_ea_desc:0 "Mafdal will connect religious study to industrial qualifications. Technical training can broaden skilled employment, while separate educational institutions require additional funding."
 ISR70_p0_ea_deepen:0 "Teachers for Religious Vocational Schools"
 ISR70_p0_ea_deepen_desc:0 "Religious vocational schools need instructors who can teach industrial skills without abandoning their communities' educational commitments. Preparing those teachers will connect workshop qualifications to the institutions through which Mafdal already organises public life."
 ISR70_p0_eb:0 "Community Welfare through Religious Councils"
 ISR70_p0_eb_desc:0 "Mafdal will use religious councils to coordinate community welfare. Social provision can become less costly, at the price of maintaining a larger local administrative network."
 ISR70_p0_eb_deepen:0 "Services for the Southern Communities"
 ISR70_p0_eb_deepen_desc:0 "Religious welfare organisations cannot serve the development towns without dependable roads and local facilities. Connecting these communities to public services will give the municipal network a practical foundation beyond charitable appeals."
 ISR70_p0_ca:0 "Bnei Akiva and Prepared National Service"
 ISR70_p0_ca_desc:0 "Religious-Zionist youth organisations can prepare recruits for national service. Quicker mobilisation gives the state trained cadres while increasing expenditure on preparation and personnel."
 ISR70_p0_ca_deepen:0 "A Trained National-Service Cadre"
 ISR70_p0_ca_deepen_desc:0 "Bnei Akiva and the service institutions must prepare young people for responsibilities that extend beyond mobilisation. Common training standards will make the religious-Zionist service framework a more dependable part of national defence."
 ISR70_p0_cb:0 "A Religious Settlement Security Network"
 ISR70_p0_cb_desc:0 "Religious Zionist organizations seek a lasting place in the settlement movement. Local organization and defense preparations will shape their contribution to national policy."
 ISR70_army_org_factor_tt:0 "$MODIFIER_ARMY_ORG_FACTOR$: $RIGHT|+=%1$"
 ISR70_p0_cb_deepen:0 "Supply the Border Communities"
 ISR70_p0_cb_deepen_desc:0 "Border communities need reliable connections to the forces responsible for their defence. Coordinating supplies and local preparations will turn the settlement movement's security claims into an organisation that can sustain its responsibilities."
 ISR70_p0_finish:0 "Religion and the Republic"
 ISR70_p0_finish_desc:0 "Mafdal must show that religious education, community organisation and national service can support the same state. The cabinet's chosen settlement will determine how those obligations are shared without dissolving the movement's distinctive institutions into the larger parties."
 ISR70_p1_institution:0 "Hold Herut and the Liberals Together"
 ISR70_p1_institution_desc:0 "Coordinate Herut and Liberal representatives around a durable parliamentary leadership."
 ISR70_mdcw_cw_market_exposure_tt:0 "$mdcw_cw_market_exposure$: $RIGHT|+=%1$"
 ISR70_p1_ea:0 "The Liberal Wing's Commercial Programme"
 ISR70_p1_ea_desc:0 "Gahal's Liberals will open more opportunities for private enterprise. Incoming investment can expand commerce, while a greater reliance on overseas capital increases exposure to external markets."
 ISR70_p1_ea_deepen:0 "Commerce on the Tel Aviv Model"
 ISR70_p1_ea_deepen_desc:0 "The Liberal wing of Gahal sees commercial employment as a route to prosperity beyond protected enterprises. A new office district in Tel Aviv will give that argument a concrete base of firms, services and technical work."
 ISR70_p1_eb:0 "Herut's Strategic Public Enterprises"
 ISR70_p1_eb_desc:0 "Herut will retain selected public enterprises as instruments of national development. Protected production can sustain industrial capacity while making competing commercial investment more difficult."
 ISR70_p1_eb_deepen:0 "Strategic Industry in Haifa"
 ISR70_p1_eb_deepen_desc:0 "Gahal's economic debate need not end with the disposal of every public enterprise. Investment in Haifa will demonstrate whether strategic state ownership can coexist with a cabinet otherwise committed to greater scope for private initiative."
 ISR70_p1_ca:0 "The Opposition's Parliamentary Safeguards"
 ISR70_p1_ca_desc:0 "Gahal can carry its opposition experience into government by defending parliamentary scrutiny. Independent scrutiny will make administration more credible while limiting the executive's immediate political freedom."
 ISR70_p1_ca_deepen:0 "Parliamentary Scrutiny of the Executive"
 ISR70_p1_ca_deepen_desc:0 "Herut's experience in opposition gives parliamentary scrutiny a particular importance within Gahal. Stronger safeguards and a more capable civil administration will require ministers to accept procedures that constrain their own government as well as its opponents."
 ISR70_p1_cb:0 "A Cabinet of Security Priorities"
 ISR70_p1_cb_desc:0 "Gahal will give military readiness a larger share of the cabinet's attention and budget. Units gain a clearer mandate, while permanent security commitments make military personnel more expensive."
 ISR70_production_factory_efficiency_gain_factor_tt:0 "$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: $RIGHT|+=%1$"
 ISR70_p1_cb_deepen:0 "A Cohesive Security Establishment"
 ISR70_p1_cb_deepen_desc:0 "A firm security policy requires units that can remain organised and supplied in the field. Gahal will direct attention towards the daily work of sustaining the force, giving its political commitments an operational foundation."
 ISR70_p1_finish:0 "The Conservative Transfer of Power"
 ISR70_p1_finish_desc:0 "Herut and the Liberals must turn an opposition alliance into a government that can endure. Their chosen economic programme and civic settlement will shape a common record of administration, while their separate traditions continue to test the cabinet's cohesion."
 ISR70_p2_institution:0 "Liberal Government Responsibility"
 ISR70_p2_institution_desc:0 "Strengthen independent liberal institutions and build business confidence without merging into a larger bloc."
 ISR70_p2_ea:0 "Independent Credit for Small Firms"
 ISR70_p2_ea_desc:0 "The Independent Liberals will favour small firms over protected concentrations of capital. Broader access to investment requires officials to supervise a larger number of borrowers and guarantees."
 ISR70_p2_ea_deepen:0 "Room for Independent Businesses"
 ISR70_p2_ea_deepen_desc:0 "Independent shopkeepers and service firms need commercial space that is not reserved for the largest political or economic organisations. A Tel Aviv office district will support the Liberals' promise to broaden access to productive private enterprise."
 ISR70_p2_eb:0 "Manufacturers in Overseas Markets"
 ISR70_p2_eb_desc:0 "Export-oriented manufacturers will receive the Liberals' support for capital formation. Better returns will connect productive firms more closely to foreign orders and international market risk."
 ISR70_production_factory_max_efficiency_factor_tt:0 "$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: $RIGHT|+=%1$"
 ISR70_p2_eb_deepen:0 "Export Production in Haifa"
 ISR70_p2_eb_deepen_desc:0 "Liberal support for enterprise must also reach firms that manufacture rather than merely trade. A modern industrial investment in Haifa will connect capital formation to production methods capable of sustaining competitive export employment."
 ISR70_p2_ca:0 "Civil Rights with Independent Review"
 ISR70_p2_ca_desc:0 "Liberal ministers will accept review of their own decisions as the price of enforceable civil rights. More accountable institutions will be harder to direct as a single partisan instrument."
 ISR70_p2_ca_deepen:0 "An Accountable Liberal Civil Service"
 ISR70_p2_ca_deepen_desc:0 "Civil rights need officials who apply public rules consistently. Auditing the administration will bring the Independent Liberals' constitutional commitments into everyday dealings with the state and reduce the burden of unnecessary bureaucracy."
 ISR70_p2_cb:0 "A Professional Liberal Defence Policy"
 ISR70_p2_cb_desc:0 "A liberal security policy will rely on trained planners and carefully assessed missions. Better staff preparation will require a small but continuing commitment to professional personnel."
 ISR70_p2_cb_deepen:0 "Defensive Analysis and Secure Communications"
 ISR70_p2_cb_deepen_desc:0 "A liberal government cannot neglect national defence, but it can insist on careful assessment rather than political reflex. Technical preparation and secure communications will support a security policy grounded in professional judgement."
 ISR70_p2_finish:0 "A Liberal Republic"
 ISR70_p2_finish_desc:0 "The Independent Liberals seek a place for rights, research and productive enterprise outside the larger political blocs. Their programme must demonstrate that an independent parliamentary voice can administer the state and sustain confidence without surrendering its principles to coalition convenience."
 ISR70_p3_institution:0 "The Labor Zionist Alliance"
 ISR70_p3_institution_desc:0 "Reconcile Labor and Mapam around a cabinet programme rooted in the Histadrut and cooperative institutions."
 ISR70_p3_ea:0 "The Histadrut Industrial Bargain"
 ISR70_p3_ea_desc:0 "The Alignment will modernise Histadrut enterprises through negotiated changes in production. Factory efficiency can improve while a stronger role for organised labour limits unilateral ministerial decisions."
 ISR70_p3_ea_deepen:0 "Modern Workshops for the Histadrut Economy"
 ISR70_p3_ea_deepen_desc:0 "The institutions of Labor Zionism must adapt their industrial base to a changing economy. Investment in Haifa will give workers and managers a practical test of modernisation within the enterprises around which the Alignment's social influence has grown."
 ISR70_p3_eb:0 "Kibbutz Workshops and Irrigation"
 ISR70_p3_eb_desc:0 "Cooperative farms can combine agricultural production with technical instruction. Faster rural investment requires maintenance, extension staff and a lasting public commitment to the cooperative network."
 ISR70_p3_eb_deepen:0 "Irrigation for Cooperative Development"
 ISR70_p3_eb_deepen_desc:0 "Cooperative settlement depends on productive land and dependable water rather than political symbolism alone. An irrigated district in the Negev will connect the Alignment's rural institutions to a renewed programme of agricultural development."
 ISR70_p3_ca:0 "Development-Town Services before Prestige Projects"
 ISR70_p3_ca_desc:0 "The Alignment will direct greater attention to municipal services in the periphery. Dependable services can ease social expenditure, while redirecting engineering capacity slows the expansion of military industry."
 ISR70_p3_ca_deepen:0 "Public Services in the Development Towns"
 ISR70_p3_ca_deepen_desc:0 "The social compact must reach households beyond the established metropolitan centres. Better local connections and public-service provision will give the development towns a more tangible share in the prosperity promised by the Alignment."
 ISR70_p3_cb:0 "Negotiations from a Prepared Reserve"
 ISR70_p3_cb_desc:0 "The Alignment will sustain military readiness as the basis for its negotiating position. Better organised units give the cabinet options, at the cost of more expensive reserve preparation."
 ISR70_p3_cb_deepen:0 "Room for Negotiating Strength"
 ISR70_p3_cb_deepen_desc:0 "A cabinet that relies on negotiating strength must retain the freedom to choose its own position. Political consolidation and greater diplomatic independence will help the Alignment conduct talks without treating every outside preference as an instruction."
 ISR70_p3_finish:0 "A Second Building of Israel"
 ISR70_p3_finish_desc:0 "Labor and Mapam must reconcile industrial modernisation, cooperative traditions and the needs of communities that feel excluded from both. The government will be judged on whether its chosen programme renews the institutions of Labor Zionism rather than merely preserving their authority."
 ISR70_p4_institution:0 "A Jewish-Arab Class Alliance"
 ISR70_p4_institution_desc:0 "Organize a Jewish-Arab class alliance through workers' organizations and public institutions."
 ISR70_p4_ea:0 "An Accountable Public-Enterprise Sector"
 ISR70_p4_ea_desc:0 "The communist parliamentary cabinet will invest in public enterprises with organised worker representation. Improved industrial routines will require ministers to negotiate rather than issue every instruction directly."
 ISR70_p4_ea_deepen:0 "Workers Trained for Public Enterprise"
 ISR70_p4_ea_deepen_desc:0 "Parliamentary communism must show that public ownership can improve work as well as change its formal direction. Technical education and stronger enterprise productivity will give the Jewish-Arab workers' alliance a practical economic record."
 ISR70_p4_eb:0 "A State Plan for Industrial Construction"
 ISR70_p4_eb_desc:0 "Central planners will concentrate engineering and credit on industrial construction. New production capacity comes ahead of the commercial services that independent firms would otherwise have expanded."
 ISR70_p4_eb_deepen:0 "A Public Industrial Base in Haifa"
 ISR70_p4_eb_deepen_desc:0 "Central planning requires factories capable of carrying out its priorities. A public industrial investment in Haifa will place responsibility for employment and production directly on the government and the workers' organisations that support it."
 ISR70_p4_ca:0 "Common Citizenship and Public Provision"
 ISR70_p4_ca_desc:0 "Equal citizenship will be supported through common public provision. Stable civic institutions require a greater educational commitment if formal equality is to become practical access."
 ISR70_p4_ca_deepen:0 "Equal Access to Municipal Services"
 ISR70_p4_ca_deepen_desc:0 "Equal citizenship will remain an abstraction if neighbourhoods receive unequal public services. The communist cabinet will strengthen municipal provision so that cooperation between Jewish and Arab workers has an everyday institutional basis."
 ISR70_mdcw_cw_support_effectiveness_tt:0 "$mdcw_cw_support_effectiveness$: $RIGHT|+=%1$"
 ISR70_imp_sanction_resistance_tt:0 "$imp_sanction_resistance$: $RIGHT|+=%1$"
 ISR70_p4_cb:0 "Training for a Soviet Supply Relationship"
 ISR70_p4_cb_desc:0 "A Soviet-oriented security programme will prepare technical personnel for foreign equipment and assistance. Improved support capacity also makes the army more dependent on the continuing foreign relationship."
 ISR70_p4_cb_deepen:0 "Technical Preparation for Soviet Armour"
 ISR70_p4_cb_deepen_desc:0 "Closer military cooperation with Moscow requires crews and technical organisations able to understand contemporary armoured designs. Research preparation will develop that competence without assuming that a diplomatic orientation alone delivers finished equipment."
 ISR70_p4_finish:0 "A Socialist Peace Settlement"
 ISR70_p4_finish_desc:0 "Rakah's government must hold together its class programme, Jewish-Arab equality and the security choices made during its term. A socialist settlement will depend on capable public institutions and services that make cooperation more durable than a parliamentary declaration."
 ISR70_p5_institution:0 "Communes over Party Headquarters"
 ISR70_p5_institution_desc:0 "Give municipal and producers' councils a defined role in a federative political system."
 ISR70_p5_ea:0 "Producers' Councils in the Workshops"
 ISR70_p5_ea_desc:0 "The council left will place workplace training in producers' hands. Sharing practical knowledge can improve industrial efficiency, while negotiating between autonomous workplaces slows central direction."
 ISR70_p5_ea_deepen:0 "Technical Knowledge between Councils"
 ISR70_p5_ea_deepen_desc:0 "Autonomous producers' councils need ways to share expertise without surrendering every decision to a central ministry. Joint technical training and industrial research will help local workplaces learn from one another's experience."
 ISR70_p5_eb:0 "A Cooperative Investment Federation"
 ISR70_p5_eb_desc:0 "The federation will pool investment for projects that individual cooperatives cannot undertake. Faster construction requires a standing organisation to settle priorities among its members."
 ISR70_p5_eb_deepen:0 "Cooperative Cultivation in the Negev"
 ISR70_p5_eb_deepen_desc:0 "A cooperative federation needs a rural economy alongside its municipal councils. Investment in a Negev agricultural district will give producers a common project whose operation depends on sustained coordination rather than a hierarchy of ministerial orders."
 ISR70_p5_ca:0 "Municipal Powers in a Federal Charter"
 ISR70_p5_ca_desc:0 "A federal charter will place defined powers in local institutions. Less routine work falls on the central administration, while national construction programmes must accept additional local negotiation."
 ISR70_p5_ca_deepen:0 "Local Representation within the Federation"
 ISR70_p5_ca_deepen_desc:0 "A federal settlement will endure only if communities trust the bodies that represent them. Clear local responsibilities and dependable institutions can protect the agreement against the suspicion that one centre will eventually take back the authority it has promised."
 ISR70_p5_cb:0 "Shared Civic Services across Communities"
 ISR70_p5_cb_desc:0 "Common civic services will give the federation a practical national role. Shared provision can reduce social costs, while coordination across autonomous councils requires more public administration."
 ISR70_p5_cb_deepen:0 "Shared Services for a Common Republic"
 ISR70_p5_cb_deepen_desc:0 "A common civic republic must provide services that residents can use regardless of community. Building that administrative capacity will give the council left's constitutional ambitions a practical test in daily public provision."
 ISR70_p5_finish:0 "A Federation of Municipalities"
 ISR70_p5_finish_desc:0 "The council left seeks a federation held together by cooperation among producers and municipalities. Its chosen economic and civic institutions must provide enough coordination to sustain development while leaving local bodies with a meaningful role in their own affairs."
 ISR70_p6_institution:0 "Represent the Periphery"
 ISR70_p6_institution_desc:0 "Build an independent political voice for traditional families and the development towns."
 ISR70_p6_ea:0 "Family Workshops in the Development Towns"
 ISR70_p6_ea_desc:0 "The traditionalist alliance will broaden credit for family businesses and craftspeople. Local enterprise gains room to grow while small-loan supervision places new demands on the municipal administration."
 ISR70_p6_ea_deepen:0 "Commercial Space in the Negev"
 ISR70_p6_ea_deepen_desc:0 "Family firms in the development towns need premises and business services as well as political recognition. A municipal office district will give the traditionalist alliance a concrete investment in the southern communities it claims to represent."
 ISR70_production_speed_infrastructure_factor_tt:0 "$modifier_production_speed_infrastructure_factor$: $RIGHT|+=%1$"
 ISR70_p6_eb:0 "Municipal Services for the Periphery"
 ISR70_p6_eb_desc:0 "Southern municipalities will receive priority for public works and services. Faster local connections will require a greater continuing commitment to social provision."
 ISR70_p6_eb_deepen:0 "Connect the Southern Development Towns"
 ISR70_p6_eb_deepen_desc:0 "Municipal development funds must reach communities whose distance from established centres raises the cost of work and public services. Better infrastructure will make those towns a more practical base for households and local employers."
 ISR70_p6_ca:0 "A Traditional Path into Skilled Work"
 ISR70_p6_ca_desc:0 "Community teachers and technical schools will offer qualifications without requiring young people to leave their social institutions. The resulting skills will require sustained expenditure on education."
 ISR70_p6_ca_deepen:0 "Teachers and Trades for the Periphery"
 ISR70_p6_ca_deepen_desc:0 "Young people in traditional communities should not have to choose between retaining their social ties and acquiring useful qualifications. Teacher preparation and vocational education will broaden their opportunities within the development towns."
 ISR70_p6_cb:0 "Community Institutions at the Bargaining Table"
 ISR70_p6_cb_desc:0 "Workers, employers and religious institutions will negotiate the social partnership together. A stable settlement gives each institution influence and leaves the cabinet less freedom to act alone."
 ISR70_p6_cb_deepen:0 "Community Welfare Administration"
 ISR70_p6_cb_deepen_desc:0 "Traditional social partnership needs organisations that can administer help reliably. Strengthening community welfare will allow local institutions to respond to households without making every need depend on a personal connection to a political intermediary."
 ISR70_p6_finish:0 "The Rise of the Development Towns"
 ISR70_p6_finish_desc:0 "The traditionalist alliance must turn the periphery's political voice into dependable work and services. Its programme will be judged by whether development towns gain institutions of their own, rather than another channel through which established centres distribute favours."
 ISR70_p7_institution:0 "A Limited Directorate"
 ISR70_p7_institution_desc:0 "Give the directorate a professional administrative core before choosing its economic and constitutional direction."
 ISR70_p7_ea:0 "Procurement under Engineering Standards"
 ISR70_p7_ea_desc:0 "The directorate will use professional engineering rules to reduce administrative waste. Transparent tendering can make the state less costly while slowing contracts that previously moved through favoured channels."
 ISR70_p7_ea_deepen:0 "Industry under Professional Direction"
 ISR70_p7_ea_deepen_desc:0 "The directorate's claim to competence will be tested by the enterprises it develops. A public industrial investment in Haifa will give its planners a clear responsibility for production and employment beyond the language of emergency administration."
 ISR70_p7_eb:0 "Corporations for Accelerated Construction"
 ISR70_p7_eb_desc:0 "The directorate will concentrate construction in state corporations and favoured contractors. Faster industrial development makes the state more dependent on politically protected suppliers."
 ISR70_p7_eb_deepen:0 "The State Corporations' Building Programme"
 ISR70_p7_eb_deepen_desc:0 "The directorate will channel industrial investment through the corporations and interests that sustain its authority. New capacity can strengthen production, but the distribution of its benefits will also expose the relationship between economic development and political patronage."
 ISR70_p7_ca:0 "Return the Budget to Parliament"
 ISR70_p7_ca_desc:0 "Restored elections will give public expenditure a broader mandate and expose it to parliamentary scrutiny. Civilian legitimacy will limit the speed with which the directorate can command new projects."
 ISR70_p7_ca_deepen:0 "Audit the Civilian Transition"
 ISR70_p7_ca_deepen_desc:0 "A promised return to civilian government needs credible scrutiny of the administration that manages it. An effective audit will test the directorate's willingness to submit its record to standards that are independent of its own claims."
 ISR70_p7_cb:0 "The Permanent Presidential Planning Office"
 ISR70_p7_cb_desc:0 "A permanent presidency can concentrate authority over appointments and planning. Clearer command will be accompanied by a larger protected administrative establishment."
 ISR70_p7_cb_deepen:0 "The Presidential Planning Office"
 ISR70_p7_cb_deepen_desc:0 "An enduring presidency will bring administration and construction planning closer to the executive. Ministers and technical staff will work through a more concentrated centre, tying the development programme to the president's continued authority. Presidential discretion also leaves more room for politically favoured contracts."
 ISR70_p7_finish:0 "The Directorate State"
 ISR70_p7_finish_desc:0 "The directorate must now answer for the institutions built under its exceptional authority. Its economic priorities and constitutional choice will determine whether technical administration prepares a civilian settlement or becomes the foundation of a lasting presidential order."
 ISR70_p12_institution:0 "Municipal Interests in the Knesset"
 ISR70_p12_institution_desc:0 "Represent municipal interests through parliamentary negotiation and accountable local institutions."
 ISR70_p12_ea:0 "Commercial Credit for Arab Municipalities"
 ISR70_p12_ea_desc:0 "Municipal representatives will connect local firms to commercial credit. More investment can support employment while requiring additional offices to supervise a wider network of borrowers."
 ISR70_p12_ea_deepen:0 "Commerce for the Northern Municipalities"
 ISR70_p12_ea_deepen_desc:0 "Arab municipalities need a stronger commercial base alongside their public institutions. New office capacity in the north will support local firms and give municipal representatives a practical answer to the demand for productive employment."
 ISR70_p12_eb:0 "Local Endowments and Welfare Boards"
 ISR70_p12_eb_desc:0 "Community endowments will help councils organise welfare services. Lower social costs will be accompanied by the administrative work of coordinating public and charitable provision."
 ISR70_p12_eb_deepen:0 "Roads between Communities and Services"
 ISR70_p12_eb_deepen_desc:0 "Municipal welfare organisations cannot compensate indefinitely for weak physical connections. Improvements to roads and service links will help local institutions reach residents and make their public responsibilities easier to sustain."
 ISR70_p12_ca:0 "A Place in Common Civic Institutions"
 ISR70_p12_ca_desc:0 "Municipal representatives will seek enforceable participation in national institutions. Civic confidence can improve, while ministers must accept a more negotiated parliamentary agenda."
 ISR70_p12_ca_deepen:0 "Public Scrutiny of Civic Institutions"
 ISR70_p12_ca_deepen_desc:0 "Participation in common civic institutions must include the power to question their administration. Public scrutiny will give municipal representatives a way to insist that equal citizenship is reflected in the state's everyday conduct."
 ISR70_p12_cb:0 "Autonomous Municipal Administration"
 ISR70_p12_cb_desc:0 "Councils will take responsibility for more routine administration. Central costs can fall while national infrastructure planning must accommodate a larger number of local decisions."
 ISR70_p12_cb_deepen:0 "Capable Autonomous Municipal Services"
 ISR70_p12_cb_deepen_desc:0 "Local autonomy requires more than a legal boundary around municipal powers. Better organised services will give councils the capacity to exercise those powers and build residents' confidence in their community institutions."
 ISR70_p12_finish:0 "A Political Voice for the Municipalities"
 ISR70_p12_finish_desc:0 "The municipal reform list must translate parliamentary influence into institutions that residents can rely on. Its chosen settlement between common citizenship and local authority will define how Arab municipalities participate in the wider political order."
 ISR70_p13_institution:0 "The Orthodox Parliamentary Bloc"
 ISR70_p13_institution_desc:0 "Organize an Orthodox parliamentary bloc that negotiates education, community services and religious practice."
 ISR70_p13_ea:0 "Trades alongside the Yeshiva"
 ISR70_p13_ea_desc:0 "Orthodox representatives will connect religious learning with practical qualifications. New skills can serve community employment, with separate training arrangements raising educational expenditure."
 ISR70_p13_ea_deepen:0 "Trades alongside Religious Learning"
 ISR70_p13_ea_deepen_desc:0 "Orthodox families need ways to acquire technical qualifications without abandoning religious study. A sustained training framework will allow community institutions to support productive work while retaining the educational commitments at the heart of the parliamentary bloc."
 ISR70_p13_eb:0 "Community Welfare and Charitable Accounts"
 ISR70_p13_eb_desc:0 "Religious welfare organisations will receive a larger role under published accounts. More efficient social provision will require officials to coordinate a more complex network of institutions."
 ISR70_p13_eb_deepen:0 "Professional Community Care"
 ISR70_p13_eb_deepen_desc:0 "Charitable provision must manage increasingly complex health and welfare needs. Better administration will help community organisations use their resources consistently and reduce dependence on improvised arrangements when households require continuing assistance."
 ISR70_p13_ca:0 "Protect the Parliamentary Status Quo"
 ISR70_p13_ca_desc:0 "The bloc will negotiate religious accommodation through parliament. A steadier coalition will require the state to sustain the separate educational institutions protected by the settlement."
 ISR70_p13_ca_deepen:0 "A Parliamentary Religious Settlement"
 ISR70_p13_ca_deepen_desc:0 "The religious status quo needs a workable agreement among parties that disagree about the state's character. A durable parliamentary settlement will give Orthodox representatives a basis for defending their institutions while sustaining the government they have helped to form."
 ISR70_p13_cb:0 "Voluntary Service through Community Institutions"
 ISR70_p13_cb_desc:0 "Community organisations will provide civilian placements and local supervision. The programme can support social services while requiring a continuing administrative commitment."
 ISR70_p13_cb_deepen:0 "Civilian Service Links for Communities"
 ISR70_p13_cb_deepen_desc:0 "Voluntary service will be useful only if it connects participants to real local needs. Better links between development-town communities and their service organisations will give the Orthodox compromise a practical public purpose."
 ISR70_p13_finish:0 "A Sustainable Religious Compromise"
 ISR70_p13_finish_desc:0 "Agudat Israel and Poalei Agudat must defend their communities while meeting the responsibilities of parliamentary government. Their chosen balance of education, welfare and public service will determine whether religious accommodation can sustain confidence beyond the immediate coalition bargain."
 ISR70_p14_institution:0 "Pragmatic State Leadership"
 ISR70_p14_institution_desc:0 "Build a pragmatic state leadership around professional administration and workable parliamentary support."
 ISR70_p14_ea:0 "Commercial Discipline in Public Enterprises"
 ISR70_p14_ea_desc:0 "The State List will ask public managers to answer for production and costs. Efficient industrial routines will come with fewer political guarantees for the workers and interests accustomed to them."
 ISR70_p14_ea_deepen:0 "Professional Management in Haifa"
 ISR70_p14_ea_deepen_desc:0 "Public enterprises need managers able to answer for production rather than political sponsorship. Industrial investment in Haifa will give the pragmatic right an opportunity to demonstrate that the state's economic role can be administered with clear commercial responsibilities."
 ISR70_p14_eb:0 "A Competitive Private Sector"
 ISR70_p14_eb_desc:0 "A pragmatic cabinet will open commercial opportunities beyond the established enterprises. Foreign investment can become more attractive while a greater part of development depends on external market conditions."
 ISR70_p14_eb_deepen:0 "Commercial Initiative in Tel Aviv"
 ISR70_p14_eb_deepen_desc:0 "Private commerce offers the pragmatic cabinet another route to employment and development. A Tel Aviv office district will create room for that initiative while testing the government's ability to support enterprise without extending unnecessary administrative control."
 ISR70_p14_ca:0 "A Sustainable Defensive Posture"
 ISR70_p14_ca_desc:0 "Professional preparation will support a defensive posture with limited objectives. Better coordination improves defence, while trained readiness continues to cost money between crises."
 ISR70_p14_ca_deepen:0 "Sustain a Defensive Posture"
 ISR70_p14_ca_deepen_desc:0 "A restrained security policy still requires reliable supplies and a force organised for its assigned tasks. Reducing the practical burden of sustaining that posture will help the cabinet keep readiness within its economic means."
 ISR70_p14_cb:0 "Cabinet Authority for Territorial Talks"
 ISR70_p14_cb_desc:0 "Negotiators will receive a clear cabinet mandate to explore territorial agreements. Diplomatic freedom will require a domestic political effort that leaves less room for unrelated legislation."
 ISR70_p14_cb_deepen:0 "Public Confidence for Negotiations"
 ISR70_p14_cb_deepen_desc:0 "Territorial negotiations require a domestic political foundation as well as diplomatic contacts. The pragmatic cabinet will build confidence in its approach so that talks can proceed without every concession becoming a crisis of authority."
 ISR70_p14_finish:0 "Pragmatism as Statecraft"
 ISR70_p14_finish_desc:0 "The State List and its partners seek a government judged by workable administration rather than a comprehensive ideological programme. Their record in enterprise management and security policy will determine whether pragmatism can command a stable parliamentary constituency."
 ISR70_p15_institution:0 "An Elite Development Alliance"
 ISR70_p15_institution_desc:0 "Create a development alliance between municipal notables and productive investment interests."
 ISR70_imp_investment_reward_tt:0 "$imp_investment_reward$: $RIGHT|+=%1$"
 ISR70_p15_ea:0 "Published Contracts for Diaspora Capital"
 ISR70_p15_ea_desc:0 "Investors will receive clear contracts and public reporting. Better use of development capital requires officials to supervise the terms instead of leaving them to personal connections."
 ISR70_p15_ea_deepen:0 "Supervised Investment in Tel Aviv"
 ISR70_p15_ea_deepen_desc:0 "Diaspora investment must create productive facilities under terms the state can supervise. A new Tel Aviv office district will test whether the development alliance can attract capital while keeping public responsibilities separate from the interests of its sponsors."
 ISR70_p15_eb:0 "Concessions for the Development Sponsors"
 ISR70_p15_eb_desc:0 "The alliance will accelerate development through favoured investors and concessions. Attractive terms will bring investment while raising the public cost of politically protected business."
 ISR70_p15_eb_deepen:0 "The Haifa Industrial Concession"
 ISR70_p15_eb_deepen_desc:0 "Privileged concessions will be justified by their supporters as a faster route to industrial development. Investment in Haifa will give the sponsors new productive capacity while making the political distribution of opportunity increasingly visible."
 ISR70_p15_ca:0 "Independent Review of Investment Contracts"
 ISR70_p15_ca_desc:0 "Independent reviewers will inspect the alliance's contracts. Lower corruption costs will require governing politicians to surrender some control over the allocation of favours."
 ISR70_p15_ca_deepen:0 "A Professional Contract Administration"
 ISR70_p15_ca_deepen_desc:0 "Transparent investment contracts depend on officials who can inspect and enforce them. A more capable administration will reduce routine burdens while giving the development alliance a credible alternative to informal bargains with favoured investors."
 ISR70_p15_cb:0 "The Notables' Investment Network"
 ISR70_p15_cb_desc:0 "The alliance will use municipal notables and investors to consolidate its governing network. Stronger political organisation will carry the cost of public spending shaped by patronage."
 ISR70_p15_cb_deepen:0 "Construction through the Patronage Network"
 ISR70_p15_cb_deepen_desc:0 "The alliance will consolidate the network of notables and investors through which its building programme operates. This can strengthen its political organisation and delivery capacity, while tying development more closely to continued access to the governing coalition. The privileged network increases the cost of patronage as its reach expands."
 ISR70_p15_finish:0 "The Investment State"
 ISR70_p15_finish_desc:0 "The development alliance must decide what its investment record says about the state it governs. Supervised capital and privileged concessions lead to different relationships between public authority and private wealth, even when both promise growth and new employment."
 ISR70_p16_institution:0 "A Free Press and Political Public Life"
 ISR70_p16_institution_desc:0 "Defend a free press and open political organization as the foundation of a secular civil-rights programme."
 ISR70_p16_ea:0 "Education for a Civilian Economy"
 ISR70_p16_ea_desc:0 "The civil-rights movement will connect investment access to public technical education. Civilian opportunity will broaden, while educational expenditure rises to support the new qualifications."
 ISR70_p16_ea_deepen:0 "Qualifications for Civilian Electronics"
 ISR70_p16_ea_deepen_desc:0 "A civil-rights economy needs productive opportunities alongside constitutional promises. Technical qualifications and research in civilian electronics will give the Free Citizens movement a development programme that reaches beyond the defence establishment and established political enterprises."
 ISR70_p16_eb:0 "Service Firms beyond Party Patronage"
 ISR70_p16_eb_desc:0 "The movement will simplify entry into services and commercial work. A cheaper central administration will leave municipalities with more responsibility for maintaining local provision."
 ISR70_p16_eb_deepen:0 "Commercial Capacity without the Old Bureaucracy"
 ISR70_p16_eb_deepen_desc:0 "Removing administrative barriers must be followed by opportunities for firms to operate. New commercial offices in Tel Aviv will give the movement's economic alternative a practical base rather than leaving reform confined to the repeal of rules."
 ISR70_p16_ca:0 "A Secular Public Sphere"
 ISR70_p16_ca_desc:0 "A free public sphere will let citizens challenge ministers and religious authorities. Greater political initiative will provoke resistance among institutions that regard the change as a threat to their established role."
 ISR70_p16_ca_deepen:0 "Independent Scrutiny of the Secular State"
 ISR70_p16_ca_deepen_desc:0 "Secular government must be accountable in practice, including when its ministers claim to act in the name of civil freedom. An independent public audit will test the administration against standards that do not depend on loyalty to the movement."
 ISR70_p16_cb:0 "Power to the Elected Municipalities"
 ISR70_p16_cb_desc:0 "Elected municipalities will receive more responsibility for local decisions. Less central administration will be offset by slower agreement on construction that crosses municipal boundaries."
 ISR70_p16_cb_deepen:0 "Municipal Connections in the Negev"
 ISR70_p16_cb_deepen_desc:0 "Decentralisation will fail if local institutions lack the means to deliver services. Better municipal connections in the Negev will give councils practical responsibilities and resources, rather than merely transferring obligations away from the centre."
 ISR70_p16_finish:0 "A State of Free Citizens"
 ISR70_p16_finish_desc:0 "HaOlam HaZeh's programme seeks a political public life in which citizens can question the state without losing their place in it. Its chosen economic and municipal institutions must show that civil freedom can also support competent government and useful development."
 ISR70_p17_institution:0 "Development and Landscape Protection"
 ISR70_p17_institution_desc:0 "Create professional institutions for landscape protection, water policy and development planning."
 ISR70_p17_ea:0 "Water Budgets for Cultivation"
 ISR70_p17_ea_desc:0 "Conservation planners will favour cultivation that can justify its water requirements. Faster agricultural investment will depend on a standing service of surveyors and extension officers."
 ISR70_p17_ea_deepen:0 "Planned Cultivation in the Negev"
 ISR70_p17_ea_deepen_desc:0 "Agricultural expansion must account for water and land constraints before new districts are laid out. A carefully planned Negev investment will test whether productive cultivation can proceed without treating the landscape as an unlimited reserve for development."
 ISR70_p17_eb:0 "Engineering for Energy Efficiency"
 ISR70_p17_eb_desc:0 "Cleaner industrial methods will become a technical research priority. Better efficiency will require dedicated laboratories and higher expenditure on scientific education."
 ISR70_industry_repair_factor_tt:0 "$MODIFIER_INDUSTRY_REPAIR_FACTOR$: $RIGHT|+=%1$"
 ISR70_p17_eb_deepen:0 "Industrial Repair and Resource Efficiency"
 ISR70_p17_eb_deepen_desc:0 "An environmental programme can improve existing industry rather than simply oppose further building. Better repair and production methods will seek more useful output from the facilities already in place and strengthen the case for technically informed conservation."
 ISR70_p17_ca:0 "Landscape Review before Construction"
 ISR70_p17_ca_desc:0 "Municipal planners will review land use before approving major works. More careful public administration can improve repair and maintenance, while slowing new construction."
 ISR70_p17_ca_deepen:0 "Conservation in Public Works"
 ISR70_p17_ca_deepen_desc:0 "Municipal conservation plans need to influence how infrastructure is actually delivered. Applying them to public works will connect the environmental league's proposals to the decisions through which towns use land, services and building resources."
 ISR70_p17_cb:0 "Public Transport and Healthy Communities"
 ISR70_p17_cb_desc:0 "The environmental alternative will connect public transport to local health and social provision. Services can become less costly when coordinated, but the network needs additional public administration."
 ISR70_p17_cb_deepen:0 "Healthier Services for the Development Towns"
 ISR70_p17_cb_deepen_desc:0 "The quality of local services is part of the environment in which people live. Investment in development-town infrastructure and health administration will give the league's social programme a practical connection to household needs."
 ISR70_p17_finish:0 "A Livable Development Strategy"
 ISR70_p17_finish_desc:0 "The environmental league must show that protection of land and water can guide development rather than suspend it. Its record in agriculture, industrial methods and municipal provision will determine whether conservation becomes a dependable part of public administration."
 ISR70_p18_institution:0 "An Independent Socialist Left"
 ISR70_p18_institution_desc:0 "Establish Mapam's independent political institutions after its separation from the Alignment."
 ISR70_p18_ea:0 "Mapam's Cooperative Social Compact"
 ISR70_p18_ea_desc:0 "An independent Mapam will defend cooperative production and a broad welfare commitment. Efficient social provision will depend on collective bargaining that limits unilateral cabinet action."
 ISR70_p18_ea_deepen:0 "Cooperative Production in the Negev"
 ISR70_p18_ea_deepen_desc:0 "Mapam's cooperative commitments require investment in the institutions that sustain rural work. A Negev agricultural district will give the independent left a concrete project through which shared ownership can be judged by practical production and local development."
 ISR70_p18_eb:0 "Schools and Services in the Periphery"
 ISR70_p18_eb_desc:0 "Mapam will favour municipal services and education over another round of prestige industrial projects. Administrative savings will accompany a greater educational commitment."
 ISR70_p18_eb_deepen:0 "Applied Education for the Development Towns"
 ISR70_p18_eb_deepen_desc:0 "Education must connect neglected communities to the skills and services needed for productive work. Applied teaching and local infrastructure will give Mapam's municipal programme a stronger foundation in the development towns."
 ISR70_p18_ca:0 "A Parliamentary Mandate for Peace"
 ISR70_p18_ca_desc:0 "The government will establish a negotiating mandate through public and parliamentary debate. Greater diplomatic independence will cost political attention before an agreement is within reach."
 ISR70_p18_ca_deepen:0 "Elected Scrutiny of a Peace Settlement"
 ISR70_p18_ca_deepen_desc:0 "A negotiated peace must rest on public institutions able to scrutinise its terms. Strengthening confidence in elected government will give the independent left a domestic basis for diplomacy without assuming that negotiations themselves guarantee agreement."
 ISR70_p18_cb:0 "Equal Institutions before a Binational Convention"
 ISR70_p18_cb_desc:0 "A binational constitutional convention would require equal civic institutions and representatives prepared to negotiate a common political settlement."
 ISR70_p18_cb_deepen:0 "Municipal Rights in the Constitutional Convention"
 ISR70_p18_cb_deepen_desc:0 "A binational constitutional project must address who can question public officials and how communities are represented. Civil rights and municipal accountability will give the proposed settlement a practical institutional content beyond its founding declaration."
 ISR70_p18_finish:0 "Socialism and Equal Rights"
 ISR70_p18_finish_desc:0 "Mapam's independent programme links cooperative production to Jewish-Arab equality and an alternative diplomatic course. It must demonstrate that these commitments can support the same government, rather than leave social policy, citizenship and peace as separate aspirations."
 ISR70_p19_institution:0 "Independent Workers' Politics"
 ISR70_p19_institution_desc:0 "Build independent communist institutions around workers' representation and Jewish-Arab cooperation."
 ISR70_p19_ea:0 "Joint Jewish-Arab Industrial Training"
 ISR70_p19_ea_desc:0 "Independent communist institutions will organise common worker training across community lines. Factory routines can improve while industrial education becomes a larger public commitment."
 ISR70_p19_ea_deepen:0 "Workers' Industry in Haifa"
 ISR70_p19_ea_deepen_desc:0 "Independent communist policy must create productive work without relying on another bloc's industrial institutions. A Haifa complex will provide a practical base for the workers' programme and expose its managers to the responsibilities of sustained production."
 ISR70_p19_eb:0 "Public Investment through an Elected Plan"
 ISR70_p19_eb_desc:0 "An elected planning process will coordinate public investment. Faster building requires additional staff to reconcile enterprise and municipal priorities."
 ISR70_p19_eb_deepen:0 "Planning Skills for Public Enterprises"
 ISR70_p19_eb_deepen_desc:0 "Democratic planning requires information and technical judgement as well as assemblies. Improving those skills will help public enterprises coordinate production while giving workers a clearer understanding of the decisions made in their name."
 ISR70_p19_ca:0 "Workers' Rights under Ordinary Elections"
 ISR70_p19_ca_desc:0 "Workers' rights will be secured through parliament and ordinary elections. Accountable government can be more stable while leaving ministers less freedom to bypass negotiated procedures."
 ISR70_p19_ca_deepen:0 "Accountable Workers' Representation"
 ISR70_p19_ca_deepen_desc:0 "Workers' representatives need institutions through which they can question administrators rather than merely endorse them. Auditing the state will test the independent communist commitment to parliamentary rights and the accountability of its own officeholders."
 ISR70_p19_cb:0 "Limited Powers for Workers' Councils"
 ISR70_p19_cb_desc:0 "Workers' councils will receive defined administrative powers alongside the elected legislature. Less central bureaucracy will be accompanied by slower coordination of national building priorities."
 ISR70_p19_cb_deepen:0 "Councils and the Elected Legislature"
 ISR70_p19_cb_deepen_desc:0 "Councils cannot provide a durable constitutional alternative if their authority remains undefined. A negotiated division of responsibilities with the elected legislature will give the workers' institutions a place within government while limiting rival claims to unrestricted power."
 ISR70_p19_finish:0 "An Independent Workers' Republic"
 ISR70_p19_finish_desc:0 "Maki's independent course must reconcile workers' organisation with the practical demands of governing a divided society. Its economic and constitutional choices will determine whether public enterprise and political accountability can reinforce one another without submitting to an outside model."
 ISR70_p20_institution:0 "A New National Opposition"
 ISR70_p20_institution_desc:0 "Build a national opposition with enough institutional depth to govern through its chosen constitutional route."
 ISR70_p20_ea:0 "Local Enterprise as a National Programme"
 ISR70_p20_ea_desc:0 "The national opposition will promote workshops and small businesses in the development towns. New investment opportunities will require a larger network of credit supervision."
 ISR70_p20_ea_deepen:0 "Enterprise in the Development Towns"
 ISR70_p20_ea_deepen_desc:0 "The national opposition's economic promises must reach smaller firms outside established centres. A commercial office district in the Negev will give the development towns a concrete stake in the proposed national majority."
 ISR70_p20_eb:0 "A National Pact for Industrial Production"
 ISR70_p20_eb_desc:0 "Workers and manufacturers will be brought into a national production pact. Better output depends on negotiated obligations that reduce the cabinet's freedom to settle industrial disputes alone."
 ISR70_p20_eb_deepen:0 "The Haifa Industrial Pact"
 ISR70_p20_eb_deepen_desc:0 "A national industrial pact needs productive capacity behind its political commitments. Investment in Haifa will test whether employers and public authorities can carry a common development programme beyond campaign declarations."
 ISR70_p20_ca:0 "A National Opposition under Parliamentary Rules"
 ISR70_p20_ca_desc:0 "National populism will accept ordinary elections and parliamentary accountability. A stable constitutional position requires ministers to share power with institutions outside the movement."
 ISR70_p20_ca_deepen:0 "Oversight of a National Parliamentary Cabinet"
 ISR70_p20_ca_deepen_desc:0 "A national majority can strengthen government without removing parliamentary restraints. More professional administration and oversight will require the cabinet to accept scrutiny even when it claims a broad popular mandate."
 ISR70_p20_cb:0 "An Elected Presidency with a Popular Mandate"
 ISR70_p20_cb_desc:0 "The movement will seek an elected president while preserving competition for office. Concentrated political authority requires a larger presidency and administrative staff."
 ISR70_p20_cb_deepen:0 "Institutions for the Popular Mandate"
 ISR70_p20_cb_deepen_desc:0 "A presidential popular mandate needs organisations able to sustain national mobilisation beyond an election campaign. Consolidating those institutions will strengthen the executive's political reach and bind its programme more closely to continuing popular support."
 ISR70_p20_finish:0 "A National Majority Movement"
 ISR70_p20_finish_desc:0 "The Free Center and its partners seek to turn a national opposition into a governing majority. Their chosen relationship between industry, small enterprise and executive authority will determine whether that majority remains a parliamentary coalition or becomes a presidential movement."
 ISR70_p21_institution:0 "Form a Radical Alliance"
 ISR70_p21_institution_desc:0 "Organize a radical national alliance. Its later constitutional choice determines whether it accepts legal limits or an authoritarian order."
 ISR70_p21_ea:0 "A Domestic Arms-Supply Network"
 ISR70_p21_ea_desc:0 "The radical national alliance will support domestic suppliers to resist external pressure. Greater resilience will protect strategic work while making foreign commercial investment less attractive."
 ISR70_p21_ea_deepen:0 "Domestic Arms Production in Tel Aviv"
 ISR70_p21_ea_deepen_desc:0 "An autonomous defence economy requires factories as well as political resolve. A funded arms facility in Tel Aviv will give the radical alliance a concrete industrial commitment, with resources that cannot simultaneously be spent on civilian development."
 ISR70_p21_eb:0 "The Reserve Mobilisation Fund"
 ISR70_p21_eb_desc:0 "The alliance will keep more of the reserve establishment ready for mobilisation. Faster call-ups require recurring expenditure on personnel and training."
 ISR70_p21_eb_deepen:0 "Training for National Mobilisation"
 ISR70_p21_eb_deepen_desc:0 "A mobilisation fund must prepare people and production to meet its demands. Practical training and support for arms construction will strengthen the radical movement's capacity to organise the country around its military priorities."
 ISR70_p21_ca:0 "Legal Limits on the National Movement"
 ISR70_p21_ca_desc:0 "The alliance will accept ordinary elections and legal limits on political organisation. Civilian confidence can improve, but its leaders will lose some freedom to act through the movement alone."
 ISR70_p21_ca_deepen:0 "Civil Authority over Radical Politics"
 ISR70_p21_ca_deepen_desc:0 "Legal limits require civilian institutions with the authority to enforce them. Strengthening those bodies will test whether the radical alliance accepts constitutional restraint when it obstructs the ambitions of its own supporters."
 ISR70_p21_cb:0 "A Permanent Security Executive"
 ISR70_p21_cb_desc:0 "An authoritarian security executive will suspend ordinary political competition. Concentrated authority will make the government more forceful while the expanded apparatus consumes public funds."
 ISR70_p21_cb_deepen:0 "The Security Apparatus of the Radical State"
 ISR70_p21_cb_deepen_desc:0 "An authoritarian security course will concentrate attention on the institutions that organise and protect the regime. Military coordination and the security apparatus will become a stronger foundation of political authority, binding mobilisation to the survival of the governing movement. Permanent exceptional powers continue to erode civilian confidence."
 ISR70_p21_finish:0 "The Radical State Order"
 ISR70_p21_finish_desc:0 "The radical alliance has chosen how far mobilisation should reshape public authority and the economy. Its final settlement must give that choice institutional form, whether through accepted legal limits or an enduring security order centred on the movement itself."
 ISR70_p22_institution:0 "The Emergency Mandate"
 ISR70_p22_institution_desc:0 "Organize an emergency cabinet around defined military responsibilities and a genuine constitutional crisis."
 ISR70_p22_ea:0 "One Emergency Logistics Command"
 ISR70_p22_ea_desc:0 "The emergency cabinet will centralise logistics and procurement. More efficient field supply will rely on a professional establishment with a larger continuing personnel bill."
 ISR70_p22_ea_deepen:0 "Emergency Procurement at Home"
 ISR70_p22_ea_deepen_desc:0 "The emergency cabinet cannot rely entirely on supply decisions made abroad. A military factory in Tel Aviv will strengthen the domestic procurement base while committing resources to the priorities set by the armed forces."
 ISR70_p22_eb:0 "Civilian Technocrats in the Emergency Cabinet"
 ISR70_p22_eb_desc:0 "Civilian specialists will take responsibility for procurement and industrial planning. A cheaper administration will come with more review before new projects are authorised."
 ISR70_p22_eb_deepen:0 "Civilian Standards for Emergency Industry"
 ISR70_p22_eb_deepen_desc:0 "Civilian engineers bring methods that the emergency administration cannot provide through command alone. Applying their standards to industrial and construction planning will help the cabinet turn urgent orders into projects that can be reliably delivered."
 ISR70_p22_ca:0 "Return the Emergency Budget to Civilian Control"
 ISR70_p22_ca_desc:0 "Ordinary elections will restore a civilian mandate for the emergency budget. Confidence can recover while officers and ministers accept limits on unilateral action."
 ISR70_p22_ca_deepen:0 "Scrutinise Emergency Procurement"
 ISR70_p22_ca_deepen_desc:0 "Emergency authority must not make procurement immune to inspection. An audit of contracts and administration will help restore civilian confidence and test whether the cabinet is preparing to return exceptional powers rather than make them permanent."
 ISR70_p22_cb:0 "Permanent Rule by the Command Council"
 ISR70_p22_cb_desc:0 "The command council will retain authority beyond the emergency. Concentrated political control will require a standing military and administrative establishment."
 ISR70_p22_cb_deepen:0 "A Standing Military Command Structure"
 ISR70_p22_cb_deepen_desc:0 "Permanent military rule requires a command system able to govern beyond the immediate crisis. Consolidating that structure and its mobilisation programme will strengthen the armed forces' hold on responsibilities normally exercised by civilian institutions. Prolonged military government continues to weaken civilian confidence."
 ISR70_p22_finish:0 "The Future of the Emergency Cabinet"
 ISR70_p22_finish_desc:0 "The emergency cabinet must now give effect to its constitutional choice. A return to civilian rule and a permanent military order require different institutions, but neither can avoid answering for the procurement and mobilisation programme conducted under exceptional authority."
 ISR70_p23_institution:0 "A Constituent Crown Assembly"
 ISR70_p23_institution_desc:0 "Create a constituent assembly for the explicitly chosen crown settlement. Its powers remain subject to the later constitutional choice."
 ISR70_p23_ea:0 "Public Endowments for Local Works"
 ISR70_p23_ea_desc:0 "Under the alternate crown settlement, public endowments will finance local works. Faster infrastructure development will bring a continuing commitment to social provision."
 ISR70_p23_ea_deepen:0 "Public Works for the Southern Communities"
 ISR70_p23_ea_deepen_desc:0 "The proposed crown must establish a public purpose beyond its ceremonial foundation. Infrastructure in the Negev will give its endowments and public-works programme a concrete connection to communities whose support cannot be secured by constitutional symbolism alone."
 ISR70_p23_eb:0 "Industrial Companies under the Crown"
 ISR70_p23_eb_desc:0 "The crown's industrial alternative will concentrate investment in public companies. Faster industrial construction will compete with private commercial development for capital."
 ISR70_p23_eb_deepen:0 "Royal Industry in Haifa"
 ISR70_p23_eb_deepen_desc:0 "Royal industrial companies will be expected to support the new settlement through productive investment. A Haifa complex will test whether enterprises associated with the crown can serve a national development purpose rather than merely provide another source of patronage."
 ISR70_p23_ca:0 "A Crown Responsible to Parliament"
 ISR70_p23_ca_desc:0 "A parliamentary crown will accept ordinary elections and a responsible cabinet. A stable constitutional settlement will limit the executive's freedom to direct public affairs alone."
 ISR70_p23_ca_deepen:0 "Parliamentary Scrutiny of Crown Expenditure"
 ISR70_p23_ca_deepen_desc:0 "A parliamentary crown must accept scrutiny of the money and officials attached to it. Clear oversight will make the constitutional settlement credible by applying public standards to the institutions through which royal authority is exercised."
 ISR70_p23_cb:0 "Personal Government from the Crown"
 ISR70_p23_cb_desc:0 "Personal royal government will suspend ordinary elections and concentrate executive power. A larger household and central administration will make that authority more costly to sustain."
 ISR70_p23_cb_deepen:0 "The Crown's Executive Institutions"
 ISR70_p23_cb_deepen_desc:0 "Personal royal government requires an administration that answers directly to the sovereign. Consolidating executive institutions and national service will give that choice practical force, while making the crown responsible for the results of its own governing programme. Personal executive authority continues to divide public opinion."
 ISR70_p23_finish:0 "The Crown and Israeli Statehood"
 ISR70_p23_finish_desc:0 "The new crown must live within the constitutional settlement chosen at its foundation. Its economic and public-service record will determine whether it becomes an institution sustained by parliamentary confidence or the centre of a more personal form of government."
 ISR70_alignment_balance:0 "Labor and Mapam in the Alliance"
 ISR70_alignment_balance_desc:0 "Negotiate a workable Labor-Mapam balance and improve union confidence inside the Alignment."
 ISR70_golda_labour:0 "Renegotiate the Histadrut Production Compact"
 ISR70_golda_labour_desc:0 "The Alignment can ask Histadrut enterprises to modernise in exchange for negotiated wages and training. More efficient production will require ministers to share decisions with organised labour rather than direct the enterprises alone."
 ISR70_golda_manager:0 "Commercial Accounts for Public Enterprises"
 ISR70_golda_manager_desc:0 "Professional managers can give public enterprises clearer responsibility for production and investment. Stronger commercial discipline will improve output while testing the cabinet's relationship with workers who expect political protection."
 ISR70_golda_panthers:0 "Hear Development-Town Representatives"
 ISR70_golda_panthers_desc:0 "Housing, education and employment grievances give municipal activists reason to approach the cabinet. A hearing can respond to those demands before frustration grows into a wider political confrontation."
 ISR70_golda_housing:0 "Housing with Municipal Services"
 ISR70_golda_housing_desc:0 "New housing must be connected to work, schools and treatment rather than standing alone at the edge of a development town. Maintaining those services will cost more, but dependable links give the next building programme a stronger base."
 ISR70_golda_succession_outcome_tt:0 "Opens a leadership event: retain Golda Meir, choose Yitzhak Rabin, or choose Shimon Peres."
 ISR70_golda_succession:0 "Choose the Alignment Leadership"
 ISR70_golda_succession_desc:0 "The governing Alignment can retain Golda Meir or seek a cabinet led by Yitzhak Rabin or Shimon Peres. Parliamentary and party support determine the choice; the government need not wait for a historical succession date."
 ISR70_rabin_chosen_condition_tt:0 "Yitzhak Rabin leads the Alignment."
 ISR70_rabin_cabinet:0 "Rabin's Professional Cabinet"
 ISR70_rabin_cabinet_desc:0 "A Rabin cabinet will place professional responsibility and reserve readiness above a wider system of political appointments. Administrative savings and faster mobilisation will come with a larger continuing personnel commitment."
 ISR70_peres_chosen_condition_tt:0 "Shimon Peres leads the Alignment."
 ISR70_peres_cabinet:0 "Peres's Industrial Cabinet"
 ISR70_peres_cabinet_desc:0 "A Peres cabinet will give domestic defence engineering a larger place in national investment. Faster military-industrial construction will require funds and contracts that might otherwise have expanded civilian commercial activity."
 ISR70_gahal_identity:0 "Herut and the Liberals: The Identity Question"
 ISR70_gahal_identity_desc:0 "Settle the working relationship between Herut and the Liberal Party before choosing a broad alliance or a united party."
 ISR70_gahal_coalition:0 "Retain Gahal as a Broad Alliance"
 ISR70_gahal_coalition_desc:0 "Keep Gahal as a broad alliance with room for its constituent parties."
 ISR70_early_likud_authorized_condition_tt:0 "An early Likud foundation has been authorized."
 ISR70_likud_foundation:0 "Found a United Likud List"
 ISR70_likud_foundation_desc:0 "Form a united Likud list as an explicit political foundation, increase its support and update its displayed identity."
 ISR70_economic_plan:0 "An Economic Plan for the Seventies"
 ISR70_economic_plan_desc:0 "Industry, agriculture and public infrastructure must keep pace with a growing population. A national economic programme will coordinate investment for the coming decade."
 ISR70_water:0 "Pumps for the National Water Carrier"
 ISR70_water_desc:0 "The National Water Carrier already links northern water sources to the south. New pumping equipment and irrigation connections can support more cultivation, provided the treasury accepts the cost of operating an increasingly complex network."
 ISR70_negev_agriculture:0 "Irrigation and Agronomy in the Negev"
 ISR70_negev_agriculture_desc:0 "Water and agricultural engineering can give southern communities a more secure livelihood. New irrigated districts will bring cultivation and employment to the Negev."
 ISR70_water_maintenance:0 "Mekorot's Workshops and Reservoirs"
 ISR70_water_maintenance_desc:0 "A water network is only as dependable as its pumps, repair crews and reserve storage. Dedicated workshops will restore damaged utilities more quickly and protect investment in irrigation, at the price of a continuing maintenance establishment."
 ISR70_haifa_industry:0 "Haifa as an Industrial Center"
 ISR70_haifa_industry_desc:0 "Expand the civilian industrial base in Haifa and give the new plant a funded capital budget."
 ISR70_tel_aviv_offices:0 "Services in Tel Aviv"
 ISR70_tel_aviv_offices_desc:0 "Commercial offices in Tel Aviv will bring export finance, technical services and accounting into a more productive urban network. The investment strengthens the service economy while competing with industrial and peripheral projects for capital."
 ISR70_negev_roads:0 "Roads to the Development Towns"
 ISR70_negev_roads_desc:0 "Connect southern development towns with an additional infrastructure level in the Negev."
 ISR70_power_grid:0 "A Reliable Electricity Network"
 ISR70_power_grid_desc:0 "Expand fossil electricity generation to serve the growing industrial and office sectors."
 ISR70_exports:0 "Diamonds, Citrus and Precision Workshops"
 ISR70_exports_desc:0 "Established exporters can introduce smaller workshops to overseas orders and commercial credit. A stronger export network will draw investment into services while making those firms more sensitive to conditions beyond Israel."
 ISR70_import_substitution:0 "Produce What the Embargo Denies"
 ISR70_import_substitution_desc:0 "Foreign embargoes expose the vulnerabilities of an economy dependent on imported machinery. Domestic production must be able to sustain essential industries under pressure."
 ISR70_export_specialization:0 "An Economy of Specialist Exporters"
 ISR70_export_specialization_desc:0 "A small domestic market cannot absorb every product of modern engineering. Specialised exporters will gain from international investment and orders, while relying more heavily on access to foreign customers."
 ISR70_diaspora_bonds:0 "Israel Bonds Development Offices"
 ISR70_diaspora_bonds_desc:0 "Diaspora savings can support public investment through a credible bond programme. Transparent administration and durable projects will be essential to retaining investors' confidence."
 ISR70_investment_scrutiny:0 "Scrutinize Investment Contracts"
 ISR70_investment_scrutiny_desc:0 "Publish investment contracts and subject concessions to independent audits. Public confidence requires clear terms and officials who can be held accountable."
 ISR70_civil_electronics:0 "ELTA's Civilian Suppliers"
 ISR70_civil_electronics_desc:0 "Technical workshops and civilian electronics can become a new foundation for industrial development. Skilled engineers will connect university research with practical manufacturing."
 ISR70_technion:0 "The Technion's New Computing Faculty"
 ISR70_technion_desc:0 "The new computer-science faculty gives Israel a place to train specialists for research and industrial work. Sustained support for laboratories and academic staff will broaden technical capability, with higher education becoming a larger public commitment."
 ISR70_sme_credit:0 "Credit beyond the Large Enterprises"
 ISR70_sme_credit_desc:0 "Small workshops and family firms need credit outside the networks of the largest public and private employers. Loan guarantees can broaden commercial opportunity, while exposing the public administration to supervision and recovery costs."
 ISR70_civil_plant:0 "Further Industrial Development"
 ISR70_civil_plant_desc:0 "Establish a civilian industrial complex in the Negev and develop its production methods."
 ISR70_fiscal_review:0 "Sapir's Budget Conference"
 ISR70_fiscal_review_desc:0 "Defence orders, immigrant housing and industrial investment all compete for the same public funds. A common budget conference will identify priorities before the cabinet chooses between credit restraint and accelerated development."
 ISR70_steady_budget:0 "Credit before New Commitments"
 ISR70_steady_budget_desc:0 "A credible budget can improve the state's borrowing terms and protect essential services. Restraining new commitments also slows public construction, making the cabinet choose which projects can wait."
 ISR70_development_budget:0 "A Treasury for Development"
 ISR70_development_budget_desc:0 "The treasury will sustain a faster programme of housing, infrastructure and industrial construction. The productive assets will take time to earn their keep, while the new commitments make public credit more expensive."
 ISR70_social_contract:0 "Wages, Prices and the Histadrut"
 ISR70_social_contract_desc:0 "Ministers, employers and the Histadrut can settle wage disputes before they interrupt production. A negotiated compact will make industrial change more predictable, while narrowing the cabinet's freedom to impose a settlement of its own. Agreed recruitment and working arrangements will also bring more adults into regular employment."
 ISR70_vocational:0 "ORT Workshops for a Changing Economy"
 ISR70_vocational_desc:0 "Practical instruction can help immigrants and development-town residents enter skilled industrial work. Teacher preparation and workshop equipment will cost more than a general promise of employment, but they give modernisation a broader social foundation. Retraining women and adults outside skilled employment will expand the available labour force."
 ISR70_development_towns:0 "Work within Reach of the Development Towns"
 ISR70_development_towns_desc:0 "Roads can connect the development towns to jobs and public services instead of leaving housing isolated from the wider economy. The cabinet must fund and maintain those links even where the immediate commercial return is modest. Bringing jobs within reach allows more residents to enter paid employment."
 ISR70_absorption_reform:0 "Ulpan, Qualifications and a First Job"
 ISR70_absorption_reform_desc:0 "Language instruction and recognition of qualifications will connect immigrants to work that uses their skills. Housing, job placement and bridging courses can turn an absorption system into a route to regular employment, while the state accepts continuing educational obligations."
 ISR70_religion_state:0 "Negotiate Religion and the State"
 ISR70_religion_state_desc:0 "Open negotiations over personal status, religious education and public service before choosing a settlement."
 ISR70_religious_compromise:0 "Renew the Status Quo Agreement"
 ISR70_religious_compromise_desc:0 "Religious parties will accept a parliamentary settlement that protects their institutions and communal services. The compromise can steady the coalition, while support for separate educational provision places a lasting claim on public funds."
 ISR70_civil_marriage:0 "A Civil Personal-Status Register"
 ISR70_civil_marriage_desc:0 "A civil register would let households settle their personal status outside religious jurisdiction. It will broaden civil choice while bringing the government into direct conflict with those who regard religious authority as part of the founding compact."
 ISR70_national_service:0 "The Question of Shared Service"
 ISR70_national_service_desc:0 "Prepare a common public-service framework and strengthen the institutions that organize it."
 ISR70_volunteer_service:0 "Municipal Volunteers and Emergency Aid"
 ISR70_volunteer_service_desc:0 "Volunteer placements can strengthen local emergency and welfare services without extending military obligation. Councils will need supervisors and dependable placements if the programme is to deliver more than a symbolic national gesture."
 ISR70_service_expansion:0 "A Wider Call-Up and Training System"
 ISR70_service_expansion_desc:0 "A broader service framework can bring trained recruits to their units more quickly. Larger training establishments and more frequent call-ups will also increase the continuing cost of military personnel."
 ISR70_universities:0 "Laboratories beyond the Defence Establishment"
 ISR70_universities_desc:0 "Universities in Jerusalem and Haifa need laboratories capable of supporting an independent civilian research agenda. Greater academic capacity will widen the country's technical choices while increasing the cost of maintaining its education system. Qualifications and specialist conversion courses will broaden access to professional work."
 ISR70_public_health:0 "Clinics and the New Medical Faculties"
 ISR70_public_health_desc:0 "More clinics and medical training can bring qualified care beyond the largest urban centres. Better administration will make treatment less costly, but training the additional professionals requires a stronger educational commitment. Dependable treatment and community care also help more adults remain in paid work."
 ISR70_staff:0 "The General Staff and the Security Situation"
 ISR70_staff_desc:0 "Review the General Staff organization and turn the experience of the previous war into usable planning capacity."
 ISR70_reserve_system:0 "Miluim: A Trained Reserve"
 ISR70_reserve_system_desc:0 "The reserve system depends on civilian specialists arriving at the right units with usable equipment and current training. Reliable mobilisation improves readiness, while employers and the defence budget must absorb more frequent periods of service."
 ISR70_defensive_depth:0 "A Fortified Screen and Local Reserves"
 ISR70_defensive_depth_desc:0 "Prepared positions and rehearsed relief plans can hold a front while reserves assemble. A force organised around that screen will dig in effectively, but its planning routines will be less suited to sudden changes of axis."
 ISR70_maneuver:0 "Operational Reserves for Mobile War"
 ISR70_maneuver_desc:0 "Mobile reserves must practise changing direction and concentrating before an opponent can react. Faster planning and armoured movement will give the staff more options, at the cost of a heavier field-supply requirement."
 ISR70_armour_programme:0 "Tal's Tank Development Directorate"
 ISR70_armour_programme_desc:0 "Israel Tal advocates a tank designed around the needs of Israeli crews and the lessons of recent wars. Domestic engineering and sustained trials will be necessary to carry that ambition forward."
 ISR70_survivability:0 "The Crew Comes First"
 ISR70_survivability_desc:0 "Armour design and field repair will prioritise keeping experienced crews alive. Additional protection can strengthen the force's staying power, with weight and servicing demands limiting its tactical speed."
 ISR70_armour_mobility:0 "Armoured Tempo and Recovery Teams"
 ISR70_armour_mobility_desc:0 "A mobile armoured force needs crews and recovery teams able to sustain rapid movement. Faster vehicles and planning give the staff a different instrument from heavier protection, while consuming more supplies on campaign."
 ISR70_imi:0 "IMI and Domestic Manufacturing"
 ISR70_imi_desc:0 "Add an IMI military factory in Tel Aviv and support contemporary infantry-weapons development."
 ISR70_artillery:0 "Artillery and Counter-Battery Reconnaissance"
 ISR70_artillery_desc:0 "Recent fighting has demonstrated the importance of responsive fire support and counter-battery work. The artillery arm needs better training and a coherent development programme."
 ISR70_engineers:0 "Bridging Columns and Field Workshops"
 ISR70_engineers_desc:0 "Bridging crews and field workshops can keep a small army moving through damaged routes and difficult terrain. Concentrating specialists on those tasks improves supply economy, while leaving fewer resources for rapid entrenchment."
 ISR70_special_forces:0 "Selection and Long-Range Patrol Schools"
 ISR70_special_forces_desc:0 "Specialist patrols need careful selection, language preparation and sustained field training. Their experience will improve the army's specialist capability, while small professional establishments carry a higher personnel cost."
 ISR70_air_staff:0 "The Air Force after the Embargo"
 ISR70_air_staff_desc:0 "Reorganize the air staff around sortie generation, training and the lessons of the arms embargo."
 ISR70_us_military_agreement_condition_tt:0 "American military supply cooperation has been accepted."
 ISR70_foreign_aircraft:0 "Conversion Schools for American Aircraft"
 ISR70_foreign_aircraft_desc:0 "A reliable American supply channel allows the air force to plan its next generation of aircraft. Conversion training and maintenance arrangements must accompany procurement."
 ISR70_local_aircraft:0 "From Bedek Workshops to Israeli Designs"
 ISR70_local_aircraft_desc:0 "Israel Aircraft Industries can reduce dependence on foreign suppliers. Domestic design teams, workshops and flight trials will require sustained government backing."
 ISR70_air_maintenance:0 "Spare Engines and Dispersed Workshops"
 ISR70_air_maintenance_desc:0 "Spare engines and dispersed workshops can turn aircraft on the inventory into aircraft ready for missions. Better servicing will improve operational availability, while the air force must maintain a larger technical establishment."
 ISR70_airfield:0 "A Resilient Airfield Network"
 ISR70_airfield_desc:0 "Expand the southern airfield network by two levels and improve its engineering."
 ISR70_air_defense:0 "Radar and Contemporary Air Defense"
 ISR70_air_defense_desc:0 "Improve contemporary ground-based air defense and military electronics."
 ISR70_naval_staff:0 "Secure the Coast and Sea Lanes"
 ISR70_naval_staff_desc:0 "Reorganize coastal operations and naval staff training."
 ISR70_missile_boats:0 "Gabriel and the Missile-Boat Flotilla"
 ISR70_missile_boats_desc:0 "Small missile boats need coordinated manoeuvre and crews able to fight in coastal waters. Concentrating the navy on this flotilla will improve its tactical organisation while requiring intensive training and specialist upkeep."
 ISR70_submarines:0 "A School for Submarine Crews"
 ISR70_submarines_desc:0 "Submarine operations demand a long apprenticeship in navigation, machinery and concealment. Dedicated instruction will support contemporary submarine research, with the navy accepting higher personnel expenditure for a small force."
 ISR70_shipyards:0 "Shipbuilding Capacity in Haifa"
 ISR70_shipyards_desc:0 "Build a funded naval dockyard in Haifa and improve shipbuilding practice."
 ISR70_intelligence_outcome_tt:0 "With La Resistance, creates Mossad if Israel has no intelligence agency."
 ISR70_intelligence:0 "Mossad and Military Intelligence"
 ISR70_intelligence_desc:0 "Mossad and military intelligence need experienced analysts, secure communications and a clear division of responsibilities. Reliable assessments must inform both diplomacy and defense."
 ISR70_intelligence_analysis:0 "An Independent Assessment Desk"
 ISR70_intelligence_analysis_desc:0 "Language specialists and competing assessments can give the cabinet a less complacent picture of its neighbours. Careful evaluation improves reconnaissance and planning, while independent review slows the immediate political use of intelligence."
 ISR70_intelligence_operations:0 "Networks beyond the Frontier"
 ISR70_intelligence_operations_desc:0 "Operational stations and secure communications can strengthen foreign networks and protect the state from outside influence. The cabinet must sustain the administrative cost and political responsibility of a larger clandestine establishment."
 ISR70_civil_defense:0 "Civil Defense for Border Communities"
 ISR70_civil_defense_desc:0 "Build two civilian shelter levels for northern border communities."
 ISR70_preparedness:0 "Readiness within the National Budget"
 ISR70_preparedness_desc:0 "The General Staff must bring reserve call-ups, servicing and civilian protection into one sustainable plan. Better coordination reduces waste in field supply, while the commitment to keep trained forces ready continues in peacetime."
 ISR70_foreign_policy:0 "The Foreign-Policy Situation of 1970"
 ISR70_foreign_policy_desc:0 "Give the foreign ministry a cabinet mandate and open the national diplomatic programme."
 ISR70_us_channel:0 "Strengthen the Washington Channel"
 ISR70_us_channel_desc:0 "Organize the Washington channel and unlock the American military or civilian cooperation proposal."
 ISR70_us_agreement_condition_tt:0 "An agreement with the United States has been accepted."
 ISR70_us_security:0 "Negotiate Security Cooperation"
 ISR70_us_security_desc:0 "An agreement with Washington gives military planners a dependable basis for cooperation. Training and procurement offices must turn diplomatic commitments into lasting working arrangements."
 ISR70_us_civil:0 "Negotiate Civilian Economic Cooperation"
 ISR70_us_civil_desc:0 "Implement an accepted civilian agreement through investment access and industrial research."
 ISR70_france_channel_outcome_tt:0 "Sends France a commercial proposal. France may accept or decline. Acceptance is required for the European trade focus."
 ISR70_france_channel:0 "Approach Paris Again"
 ISR70_france_channel_desc:0 "Ask Paris to reopen a commercial channel. The French government must accept before European cooperation can deepen."
 ISR70_europe_trade_agreement_condition_tt:0 "France has accepted renewed commercial cooperation."
 ISR70_european_trade:0 "Develop European Export Markets"
 ISR70_european_trade_desc:0 "Use the accepted European trade channel to improve investment returns and support commercial institutions."
 ISR70_soviet_channel:0 "A Cautious Opening to Moscow"
 ISR70_soviet_channel_desc:0 "Open a cautious channel to Moscow and unlock a proposal on emigration and diplomatic contacts."
 ISR70_soviet_dialogue_condition_tt:0 "The Soviet Union has accepted the dialogue and emigration framework."
 ISR70_soviet_dialogue:0 "Emigration and Diplomatic Contacts"
 ISR70_soviet_dialogue_desc:0 "An agreed emigration framework opens a new chapter in relations with Moscow. Israel must prepare housing, employment and local services for the families who arrive."
 ISR70_independent_diplomacy:0 "An Independent Diplomacy"
 ISR70_independent_diplomacy_desc:0 "Maintain independent negotiating room and protect domestic decision making against foreign influence."
 ISR70_africa_contacts:0 "Maintain African Contacts"
 ISR70_africa_contacts_desc:0 "Technical missions abroad offer cooperation in agriculture, training and public works. Lasting partnerships will depend on useful expertise and reliable commitments."
 ISR70_jordan_backchannel_outcome_tt:0 "Sends Jordan a border-talks proposal. Jordan may accept or decline; no territory changes hands."
 ISR70_jordan_backchannel:0 "Confidential Talks with Amman"
 ISR70_jordan_backchannel_desc:0 "Send a confidential border proposal to Amman. Jordan decides whether the channel becomes an agreement."
 ISR70_iran_contacts_outcome_tt:0 "Sends Iran a supply proposal. Iranian acceptance under a compatible government unlocks Oil-Supply Security."
 ISR70_iran_contacts:0 "Relations with the Shah's Iran"
 ISR70_iran_contacts_desc:0 "The relationship with the Shah's Iran offers opportunities in supply and commerce. A lasting arrangement will require agreement in Tehran as well as Jerusalem."
 ISR70_iran_supply_agreement_condition_tt:0 "Iran has accepted the supply agreement."
 ISR70_oil_security:0 "Stocks for the Iranian Supply Route"
 ISR70_oil_security_desc:0 "An accepted Iranian arrangement can support fuel stocks and more reliable supply planning. Storage and distribution reduce vulnerability to interruption, but dedicated facilities will require continuing administration."
 ISR70_nuclear_policy:0 "Ambiguity or International Transparency"
 ISR70_nuclear_policy_desc:0 "Review the diplomatic implications of ambiguity and international transparency before choosing a policy."
 ISR70_keep_ambiguity:0 "Amimut and Cabinet Discipline"
 ISR70_keep_ambiguity_desc:0 "Discretion preserves freedom of action in a hostile region. The cabinet will reaffirm a policy of strategic ambiguity and tightly controlled diplomatic communication."
 ISR70_nuclear_transparency:0 "A Civilian Research Accounting"
 ISR70_nuclear_transparency_desc:0 "Civilian nuclear cooperation offers a different diplomatic course. Greater openness would place international research and peaceful technical exchanges at the center of policy."
 ISR70_suez:0 "Assess the Suez Front"
 ISR70_suez_desc:0 "Assess the Suez front and give the cabinet a concrete military and political assessment."
 ISR70_attrition_active_condition_tt:0 "The War of Attrition is ongoing."
 ISR70_limited_attrition:0 "Limit the Conflict"
 ISR70_limited_attrition_desc:0 "Limit the conflict to a defensive posture with better field coordination and manageable supply use."
 ISR70_deep_raids:0 "Increase Military Pressure"
 ISR70_deep_raids_desc:0 "Deep raids promise to disrupt the enemy's preparations beyond the front line. The cabinet must commit aircraft and trained personnel while accepting the diplomatic consequences of escalation."
 ISR70_rogers_outcome_tt:0 "Opens a cabinet proposal for ceasefire negotiations. Egyptian acceptance is required for the agreement."
 ISR70_rogers:0 "Open Ceasefire Negotiations"
 ISR70_rogers_desc:0 "The cabinet can propose a ceasefire on terms it is willing to defend. A military posture and negotiations can proceed in parallel. Egypt decides whether to accept the proposal; broader territorial questions remain for separate talks."
 ISR70_ceasefire_accepted_condition_tt:0 "Egypt has accepted a monitored ceasefire."
 ISR70_ceasefire:0 "A Controlled Ceasefire"
 ISR70_ceasefire_desc:0 "Consolidate an accepted ceasefire, remove the starting War of Attrition costs and restore public confidence."
 ISR70_armed_stalemate:0 "Forward Defensive Readiness"
 ISR70_armed_stalemate_desc:0 "Prepared positions, supply reserves and trained headquarters can support the cabinet during a confrontation or while negotiations proceed. Maintaining the posture demands a continuing personnel commitment."
 ISR70_territorial_policy:0 "Set the Territorial Programme"
 ISR70_territorial_policy_desc:0 "The cabinet must decide how to administer the territories under its control and what it is prepared to negotiate. Civil administration, development and diplomacy can begin alongside the military policy at the Suez front."
 ISR70_all_on:0 "Defensible Frontiers and Negotiating Reserves"
 ISR70_all_on_desc:0 "Agricultural security zones and retained negotiating reserves offer one approach to territorial policy. Allon and other cabinet ministers have advanced competing proposals; the government must choose its own balance between a defensible frontier and room for agreement."
 ISR70_palestinian_settlement_condition_tt:0 "A Palestinian negotiating settlement has been accepted."
 ISR70_territorial_maximalism:0 "Permanent Territorial Control"
 ISR70_territorial_maximalism_desc:0 "Supporters of permanent territorial control want the cabinet to commit to a lasting administrative presence. Their programme will shape relations with neighboring states and the communities under Israeli control."
 ISR70_regional_compromise:0 "Negotiate Territorial Compromises"
 ISR70_regional_compromise_desc:0 "Authorize territorial compromise and give the negotiating team political capital for the peace route."
 ISR70_sinai_negotiation:0 "Sinai and Egyptian Security Interests"
 ISR70_sinai_negotiation_desc:0 "Prepare Sinai security guarantees and unlock the Egyptian peace proposal. Egypt must agree before implementation."
 ISR70_westbank_autonomy:0 "Autonomy in the West Bank"
 ISR70_westbank_autonomy_desc:0 "Prepare a municipal autonomy proposal and unlock Palestinian negotiations. Local representatives retain the right to reject the offer."
 ISR70_golan_review_outcome_tt:0 "Sends Syria a security proposal. Syria may accept or decline; this focus grants no cores or automatic land transfer."
 ISR70_golan_review:0 "A Security Settlement for the Golan"
 ISR70_golan_review_desc:0 "Send Syria a proposal for a Golan security framework. Talks do not transfer ownership or grant cores."
 ISR70_gaza_services_outcome_tt:0 "While Israel controls Palestinian-owned Gaza, adds a local administrative compact: Local Supplies for Controller +1.5%."
 ISR70_gaza_services:0 "A Civil Administration for Gaza"
 ISR70_gaza_services_desc:0 "Civilian administration in Gaza depends on functioning local services. Work with municipal institutions to improve provision and the practical conditions of daily life."
 ISR70_egypt_peace_signed_condition_tt:0 "Egypt has accepted the peace agreement."
 ISR70_policy_greater_mandate_condition_tt:0 "A paid permanent-territory mandate is active."
 ISR70_policy_inalienable_land_condition_tt:0 "Inalienable land."
 ISR70_policy_herut_retention_condition_tt:0 "Herut retention."
 ISR70_egypt_peace:0 "A Negotiated Peace with Egypt"
 ISR70_egypt_peace_desc:0 "Implement an accepted Egyptian peace agreement, end the War of Attrition and improve the climate for civilian investment. Sinai control returns only under the agreed ownership checks."
 ISR70_regional_normalization:0 "A Regional Peace Framework"
 ISR70_regional_normalization_desc:0 "Build commercial and diplomatic institutions on the peace framework. Investment returns and office construction improve."
 ISR70_territory_administration:0 "The Costs of Permanent Administration"
 ISR70_territory_administration_desc:0 "Fund a permanent administrative apparatus. It reduces garrison losses but has an explicit recurring bureaucratic cost."
 ISR70_annexation_review_outcome_tt:0 "Opens a parliamentary event: retain administration, offer municipal talks, or adopt sovereignty claims. No automatic cores are granted."
 ISR70_annexation_review:0 "Submit Annexation to Parliament"
 ISR70_annexation_review_desc:0 "Parliament must debate the future of the territories under Israeli control. Administrative continuity, municipal negotiations and sovereignty claims present different political commitments."
 ISR70_arab_citizens:0 "Arab Citizens and the State"
 ISR70_arab_citizens_desc:0 "Set the cabinet programme for Arab citizens of Israel. Equal access and preferential discrimination are exclusive; municipal self-government remains a separate, compatible choice."
 ISR70_equal_local_services:0 "Equal Municipal Services"
 ISR70_equal_local_services_desc:0 "Fund municipal services and transport links in state 205. The stability and continuing service costs begin when the project is completed."
 ISR70_policy_project_equal_services_done_condition_tt:0 "The funded project \"Equal Municipal Services\" has actually been delivered."
 ISR70_equal_employment:0 "Open Public Employment"
 ISR70_equal_employment_desc:0 "Spend 0.3% of GDP once on training and hiring procedures. Office worker requirement falls by 2%."
 ISR70_equal_access:0 "Equal Access to Land and Credit"
 ISR70_equal_access_desc:0 "Spend 50 political power and reserve 1.2% of GDP for a one-factory credit and enterprise programme in Haifa (state 205). Reform effects begin after delivery."
 ISR70_local_autonomy:0 "Municipal Self-Government"
 ISR70_local_autonomy_desc:0 "Spend 50 political power to devolve municipal responsibilities. Bureaucracy costs fall 10%; corruption costs rise 3%."
 ISR70_municipal_pacts:0 "Municipal Infrastructure Grants"
 ISR70_municipal_pacts_desc:0 "Opens one joint 1.0% GDP grant programme for states 205 and 206. Both projects must remain deliverable; the shared social cost applies after completion."
 ISR70_policy_project_municipal_pacts_done_condition_tt:0 "The funded project \"Municipal Infrastructure Grants\" has actually been delivered."
 ISR70_municipal_representation:0 "Municipal Development Funds"
 ISR70_municipal_representation_desc:0 "Spend 0.2% of GDP to establish the funds. Infrastructure construction is 15% faster in states 205 and 206 while Israel owns and controls them; internal investment costs fall 10%."
 ISR70_preferential_allocations:0 "Preferential Land and Budget Allocation"
 ISR70_preferential_allocations_desc:0 "Reserve 0.5% of GDP to open two building slots and deliver one infrastructure level in state 206. Stability falls by 2 percentage points on completion."
 ISR70_policy_project_preferential_allocations_done_condition_tt:0 "The funded project \"Preferential Land and Budget Allocation\" has actually been delivered."
 ISR70_restricted_employment:0 "Preferential Development Contracts"
 ISR70_restricted_employment_desc:0 "Reserve 1.2% of GDP for a factory in state 206. Preferential procurement raises corruption costs by 3%; industrial conglomerates gain 10 opinion if active after delivery."
 ISR70_policy_project_restricted_employment_done_condition_tt:0 "The funded project \"Preferential Development Contracts\" has actually been delivered."
 ISR70_separate_development:0 "Separate Municipal Funding Rules"
 ISR70_separate_development_desc:0 "Choose discriminatory funding rules: social costs fall 5%, stability falls 2 percentage points, and corruption costs rise 2%."
 ISR70_land_survey:0 "The Interministerial Settlement Committee"
 ISR70_land_survey_desc:0 "The cabinet must reconcile agricultural development, military plans and the claims of Palestinian landowners. A survey of the West Bank or Gaza will define the area in which the government commits its settlement budget."
 ISR70_policy_target_208_condition_tt:0 "The West Bank is the selected project area."
 ISR70_policy_target_209_condition_tt:0 "Gaza is the selected project area."
 ISR70_settlement_budget:0 "Land, Security and the Development Budget"
 ISR70_settlement_budget_desc:0 "The settlement departments compete with development towns and immigrant housing for engineers, credit and public services. Choose a negotiated freeze, a limited group of agricultural sites or a larger civilian settlement network."
 ISR70_freeze_new:0 "Offer a Settlement Freeze"
 ISR70_freeze_new_desc:0 "A halt to new settlement construction would leave more room for civilian administration and negotiations with Palestinian representatives. The cabinet must secure acceptance before it can rely on a local administrative arrangement."
 ISR70_municipal_works:0 "Municipal Works Across the Green Line"
 ISR70_municipal_works_desc:0 "Roads, workshops and civilian services can support the existing population without opening another settlement frontier. This programme ties Israeli investment to the negotiated freeze and requires continuing public expenditure."
 ISR70_policy_project_municipal_works_208_done_condition_tt:0 "The funded project \"Municipal Works Across the Green Line\" has actually been delivered."
 ISR70_policy_project_municipal_works_209_done_condition_tt:0 "The funded project \"Municipal Works Across the Green Line\" has actually been delivered."
 ISR70_land_compact:0 "Negotiate a Civil Administration Compact"
 ISR70_land_compact_desc:0 "Palestinian representatives must decide whether to cooperate with a funded municipal administration. A practical agreement can reduce the burden on Israeli ministries and garrisons, while leaving the political dispute unresolved."
 ISR70_designated_sites:0 "Nahal Agricultural Sites"
 ISR70_designated_sites_desc:0 "Nahal combines agricultural training with military service. A limited group of sites can improve irrigation practice and frontier supply, but even a geographically restrained programme requires land administration and strains relations with Palestinian institutions."
 ISR70_settlement_services:0 "Mekorot and Regional Service Roads"
 ISR70_settlement_services_desc:0 "Water connections, repair crews and reliable road access turn isolated sites into workable communities. The logistical gain is real, while the extension of the settlement footprint increases local opposition."
 ISR70_settlement_ceiling:0 "Consolidate a Limited Settlement Perimeter"
 ISR70_settlement_ceiling_desc:0 "Protect the existing sites and their workshops while ruling out another wave of expansion. A smaller perimeter is easier to maintain, although guarding civilian communities still adds to the security budget."
 ISR70_authorize_expansion:0 "A Civilian Settlement Programme"
 ISR70_authorize_expansion_desc:0 "The cabinet can place the settlement departments behind a broader civilian programme. Preparing development land and access routes will accelerate construction, while increasing administrative commitments and the dispute over the territory."
 ISR70_settlement_package:0 "Cooperative Farms and Settlement Workshops"
 ISR70_settlement_package_desc:0 "Cooperative farms, packing facilities and workshops will connect the new communities to Israeli production networks. Agricultural and manufacturing gains come with subsidised housing, public services and a larger capital commitment."
 ISR70_entrench_network:0 "Regional Roads and Protected Supply Routes"
 ISR70_entrench_network_desc:0 "A connected road network and prepared defensive positions make the settlement programme easier to supply and repair. The same network extends the area that the government must administer and protect."
 ISR70_policy_project_entrench_network_208_done_condition_tt:0 "The funded project \"Regional Roads and Protected Supply Routes\" has actually been delivered."
 ISR70_policy_project_entrench_network_209_done_condition_tt:0 "The funded project \"Regional Roads and Protected Supply Routes\" has actually been delivered."
 ISR70_settlement_compensation:0 "Negotiate a Settlement Ceiling and Compensation"
 ISR70_settlement_compensation_desc:0 "Offer an Israeli-funded property compensation programme and a binding ceiling on further settlement construction. Palestinian representatives decide whether the local terms are acceptable. The Israeli treasury funds the domestic compensation programme after acceptance. Funded compensation also eases the pressure on Palestinian administration and commerce."
 ISR70_settlement_unilateral:0 "Maintain the Unilateral Settlement Programme"
 ISR70_settlement_unilateral_desc:0 "The government can keep building without an agreed territorial settlement. Further agricultural and workshop projects remain possible, at the price of a wider garrison commitment, persistent local opposition and continuing public subsidies."
 ISR70_finance_links:0 "Finance for National Development"
 ISR70_finance_links_desc:0 "Open the domestic, bank-led and international development-finance programmes."
 ISR70_clerical_training:0 "Train Accountants and Office Staff"
 ISR70_clerical_training_desc:0 "Spend 0.4% of GDP on accounting and office training. Office worker requirement falls 3%."
 ISR70_clearing_network:0 "Mechanized Clearing and Bookkeeping"
 ISR70_clearing_network_desc:0 "Spend 0.6% of GDP on mechanized clearing and bookkeeping. Office worker requirement falls a further 3% (6% across this finance route)."
 ISR70_development_bonds:0 "Long-Term Development Bonds"
 ISR70_development_bonds_desc:0 "Unlock a one-time decision to borrow 1% of GDP. The amount borrowed is added equally to treasury liquidity and public debt; bankruptcy blocks the draw."
 ISR70_audited_funds:0 "Audit the Development Funds"
 ISR70_audited_funds_desc:0 "Spend 50 political power on project oversight. Corruption costs fall 3%."
 ISR70_development_offices:0 "Service Centers for New Towns"
 ISR70_development_offices_desc:0 "Reserve 1.2% of GDP for an office level in state 206. On delivery, office worker requirement falls a further 2%, making the route total 8%."
 ISR70_bank_consortium:0 "A Domestic Banking Consortium"
 ISR70_bank_consortium_desc:0 "Office productivity rises 3%; concentration and privileged access raise corruption costs 3%."
 ISR70_shared_services:0 "Shared Back Offices"
 ISR70_shared_services_desc:0 "Spend 0.5% of GDP to standardize shared accounting and administration. Office worker requirement falls a further 4%, for 10% across this route."
 ISR70_industrial_credit:0 "Bank-Industry Investment Partnerships"
 ISR70_industrial_credit_desc:0 "Reserve 1.2% of GDP for an office level in Tel Aviv (204). Office construction speed rises 5%; corruption costs rise a further 2% on delivery."
 ISR70_policy_export_credit_accepted_condition_tt:0 "Export credit accepted."
 ISR70_export_credit:0 "Negotiate Export Credit Lines"
 ISR70_export_credit_desc:0 "Unlock a repeatable request costing 50 political power. The United States may accept or decline; a declined request can be renewed after 360 days. An existing military agreement does not block civilian credit."
 ISR70_equipment_finance:0 "Finance Imported Office Equipment"
 ISR70_equipment_finance_desc:0 "Spend 0.6% of GDP on imported office equipment. Office productivity rises 5%; Cold War market exposure rises 5%."
 ISR70_export_services:0 "Build an Export Services Sector"
 ISR70_export_services_desc:0 "Requires an accepted export-credit line. Reserve 1.2% of GDP for an office level in Haifa (205); office construction speed rises 10% and market exposure rises a further 5% on delivery."
 ISR70_gi_mandate:0 "A Greater Israel Mandate"
 ISR70_gi_mandate_desc:0 "Pay the shared 100-political-power territorial mandate once. A mandate already paid through Herut covers this focus; it grants neither ownership nor a declaration of war."
 ISR70_gi_frontier_review:0 "Borders and Budgets for Sinai"
 ISR70_gi_frontier_review_desc:0 "Budget 0.2% of GDP to separate Sinai civilian development, coastal projects, and the later choice of legal status."
 ISR70_gi_sinai_admin:0 "A Sinai Development Authority"
 ISR70_gi_sinai_admin_desc:0 "A permanent development authority can coordinate the roads and services required by the Sinai programme. Distance and the unresolved Egyptian territorial claim make the administrative commitment expensive."
 ISR70_gi_sinai_housing:0 "Housing on the Sinai Frontier"
 ISR70_gi_sinai_housing_desc:0 "Settlement housing requires access roads and serviced land before families can move. The construction programme commits resources that could otherwise serve development towns within Israel."
 ISR70_policy_project_gi_sinai_housing_done_condition_tt:0 "The funded project \"Housing on the Sinai Frontier\" has actually been delivered."
 ISR70_gi_sinai_families:0 "Voluntary Settlement in the Sinai Towns"
 ISR70_gi_sinai_families_desc:0 "Fund a voluntary internal movement of at most 20,000 people over 5 years. Every target-state addition is matched by the same subtraction from Tel Aviv; it creates no national population or recruit pool."
 ISR70_gi_frontier_families:0 "Family Services for Frontier Communities"
 ISR70_gi_frontier_families_desc:0 "Clinics and family services can make remote communities more viable. A five-year commitment supports household growth while increasing the healthcare budget."
 ISR70_gi_sinai_economy:0 "Sinai Farms and Civilian Workshops"
 ISR70_gi_sinai_economy_desc:0 "Agricultural sites and repair workshops offer a civilian economic base for the Sinai programme. Their viability depends on reliable supply links and continued Israeli control."
 ISR70_gi_sinai_status:0 "Settle Sovereignty over the Sinai"
 ISR70_gi_sinai_status_desc:0 "After an actual peace settlement has transferred Sinai, pay 150 political power for its sovereignty administration. This focus does not transfer the state or remove the Egyptian core."
 ISR70_gi_canal_claim:0 "Assert the Sinai Territorial Claim"
 ISR70_gi_canal_claim_desc:0 "Pay 150 political power for a Sinai territorial claim. Relations with Egypt fall 40 and with PAL/Jordan 15. This neither changes ownership nor declares war."
 ISR70_gi_canal_repair:0 "Sinai Coastal Supply Stations"
 ISR70_gi_canal_repair_desc:0 "Repair the coastal road and its supply stations so civilian and military traffic can reach remote communities. Protecting those links adds another duty for the regional garrison."
 ISR70_policy_project_gi_canal_repair_done_condition_tt:0 "The funded project \"Sinai Coastal Supply Stations\" has actually been delivered."
 ISR70_gi_canal_settlers:0 "A Sinai Coastal Settlement Programme"
 ISR70_gi_canal_settlers_desc:0 "Fund a voluntary internal movement of at most 15,000 people over 5 years. Every target-state addition is matched by the same subtraction from Tel Aviv; it creates no national population or recruit pool."
 ISR70_gi_canal_industry:0 "Sinai Coastal Workshops"
 ISR70_gi_canal_industry_desc:0 "Civilian workshops and a small dockyard can maintain vehicles, vessels and coastal installations closer to where they operate. The programme requires a substantial capital budget and dependable control of the coast."
 ISR70_gi_canal_navigation:0 "Sinai Coastal Logistics"
 ISR70_gi_canal_navigation_desc:0 "Coastal handling facilities and maintenance crews can improve local supply without depending on traffic through the Suez Canal. Running the service adds to the civil administration budget."
 ISR70_gi_canal_province:0 "Unify Sinai District Administration"
 ISR70_gi_canal_province_desc:0 "Constitute the Sinai province only after actual Israeli ownership and control. Pay 150 political power and 0.3% of GDP; bureaucracy costs rise 3%. No core is granted."
 ISR70_gi_resident_status:0 "The Status of the Existing Residents"
 ISR70_gi_resident_status_desc:0 "Pay 50 political power to open the actual choice of equal civil status or an unequal occupation statute. Settlement projects and party affiliation do not select the legal status automatically."
 ISR70_policy_active_expulsion_condition_tt:0 "A forced-displacement policy is active."
 ISR70_policy_status_chosen_condition_tt:0 "An initial legal status has already been chosen."
 ISR70_policy_reform_equal_authorized_condition_tt:0 "The paid reform authorizes the equal-rights focus."
 ISR70_gi_equal_status:0 "Equal Civil Status in Sinai"
 ISR70_gi_equal_status_desc:0 "Equal legal rights and service entitlements cost 100 political power and +3% social spending. There is no immediate resistance, compliance, loyalty or sovereignty-consent bonus. A previously chosen unequal regime must first be repealed through the explicit reform decision."
 ISR70_policy_equal_civil_condition_tt:0 "Equal civil rights are in force in Sinai."
 ISR70_gi_canal_councils:0 "Local Councils and Common Services"
 ISR70_gi_canal_councils_desc:0 "Fund civilian services at 0.8% of GDP and +2% bureaucracy costs. A separately accepted and implemented local contract reduces garrison needs only 5%. Rejection grants no bonus and does not repeal equal rights."
 ISR70_gi_property_settlement:0 "Resolve Property Claims and Displacement"
 ISR70_gi_property_settlement_desc:0 "Reserve at least 0.7% of GDP for restitution. Only fulfilled, agreed claims can lower resistance target by 2 points. Prior expulsion creates additional obligations; there is no automatic loyalty or compliance reward."
 ISR70_gi_core_review:0 "Negotiate the Sinai Status"
 ISR70_gi_core_review_desc:0 "After ten years of real ownership and control and five years of equal rights, pay 100 political power to open a separate local status process. An affirmative result is not guaranteed; rejection leaves civil rights intact and grants no core."
 ISR70_policy_local_status_accepted_condition_tt:0 "The separate local status process has accepted integration."
 ISR70_policy_egypt_status_accepted_condition_tt:0 "Egypt has accepted the sovereignty agreement."
 ISR70_gi_canal_core:0 "Integrate the Sinai"
 ISR70_gi_canal_core_desc:0 "Pay 150 political power and 0.5% of GDP only after real local and Egyptian status agreements. The core applies solely to Sinai; ordinary core effects replace native occupation mechanics. Egyptian cores and historic claims remain."
 ISR70_policy_reform_special_authorized_condition_tt:0 "The paid reform authorizes the unequal-statute focus."
 ISR70_occ_special_status:0 "Separate Legal Status for Occupied Residents"
 ISR70_occ_special_status_desc:0 "Choose unequal occupation law. Existing local factory access rises 10 points, garrison needs rise 15%, police costs 3%, and resistance target 8 points; social spending falls 2%. The general and Kach statutes replace each other."
 ISR70_policy_occupation_special_condition_tt:0 "The general unequal occupation statute is active."
 ISR70_occ_security_roads:0 "Security Roads and Controlled Access"
 ISR70_occ_security_roads_desc:0 "Fund 0.8% of GDP for one infrastructure level after 180 days. Secured roads add 15% local supplies but also 5% garrison need under the unequal statute."
 ISR70_occ_delegated_administration:0 "Delegated Local Administration"
 ISR70_occ_delegated_administration_desc:0 "Request a limited local administrative contract. Only acceptance followed by funding grants the 3% bureaucracy saving and 3% corruption surcharge; refusal is possible."
 ISR70_occ_occupation_industry:0 "Industrial Enclaves under Separate Law"
 ISR70_occ_occupation_industry_desc:0 "Reserve 1.0% of GDP for one building slot and one factory on contractually acquired land. Delivery takes 270 days and adds 5% local garrison need. A local administrative refusal does not block this distinct project."
 ISR70_occ_permanent_statute:0 "A Permanent Occupation Statute"
 ISR70_occ_permanent_statute_desc:0 "Pay 100 political power to make the unequal statute permanent. Add 5 points of factory access, 2% police costs and 4 resistance-target points; stability falls 2 points. It remains an occupation, with no core."
 ISR70_rad_government:0 "A Radical Programme in Government"
 ISR70_rad_government_desc:0 "Pay 75 political power for a radical territorial programme only while its actual party governs. This neither wins an election nor enacts any of the later choices automatically."
 ISR70_rad_herut_mandate:0 "An Indivisible Territorial Programme"
 ISR70_rad_herut_mandate_desc:0 "Herut/Gahal adopts the shared territorial mandate after choosing Indivisible Security Interests. Pay its 100-political-power cost once, credited against the Greater Israel entry."
 ISR70_rad_herut_authority:0 "A National Territorial Development Authority"
 ISR70_rad_herut_authority_desc:0 "Budget 0.4% of GDP for a territorial authority: local infrastructure construction +10%, bureaucracy costs +2%, only under the programme government."
 ISR70_rad_herut_preparation:0 "Prepare to Hold the New Frontier"
 ISR70_rad_herut_preparation_desc:0 "Budget 0.5% of GDP and +3% personnel costs for 30 army experience and 10% local supply support in the controlled Sinai. It is preparation, not a declaration of war."
 ISR70_rad_herut_retention:0 "Reject Territorial Withdrawal"
 ISR70_rad_herut_retention_desc:0 "Reject territorial withdrawal as an explicit Herut policy. Egyptian relations fall 20, American relations 15. A later peace requires repeal; the focus does not annex a state."
 ISR70_rad_mafdal_council:0 "Religious Settlement Associations"
 ISR70_rad_mafdal_council_desc:0 "After choosing Religious Settlement Policy, pay 50 political power for the religious settlement programme. The later land and legal-binding choices remain separate decisions."
 ISR70_rad_mafdal_settlers:0 "State Support for Settlement Communities"
 ISR70_rad_mafdal_settlers_desc:0 "Fund a voluntary internal movement of at most 10,000 people over 3 years. Every target-state addition is matched by the same subtraction from Tel Aviv; it creates no national population or recruit pool."
 ISR70_rad_mafdal_land:0 "Compulsory Expropriation of Land"
 ISR70_rad_mafdal_land_desc:0 "Choose compulsory land expropriation instead of negotiated purchase: spend 0.4% of GDP for one building slot; local resistance target rises 8 points and property claims remain."
 ISR70_rad_mafdal_purchase:0 "Negotiated Land Purchases"
 ISR70_rad_mafdal_purchase_desc:0 "Seek a voluntary land purchase. Only accepted terms unlock the 1.0%-GDP, 270-day project for the same building slot. No expropriation or automatic resistance rise follows refusal."
 ISR70_policy_mafdal_expropriation_condition_tt:0 "Mafdal expropriation."
 ISR70_policy_project_mafdal_purchase_done_condition_tt:0 "Project mafdal purchase done."
 ISR70_rad_mafdal_lock:0 "Declare the Settlement Land Inalienable"
 ISR70_rad_mafdal_lock_desc:0 "Make settlement land politically inalienable. Gain 50 political power once; stability falls 3 points, and later withdrawal requires a separate repeal. The alternative is a reviewable lease system."
 ISR70_rad_mafdal_review:0 "Reviewable Leases and Land Registry"
 ISR70_rad_mafdal_review_desc:0 "Choose reviewable land leases and a registry instead of inalienability. Pay 50 political power and 0.3% of GDP; internal investment costs fall 5%, and territorial negotiations remain available."
 ISR70_rad_kach_government:0 "National Front: Radical Government Programme"
 ISR70_rad_kach_government_desc:0 "Pay 100 political power for the governing National Front/Kach programme. Before 1971 it uses the existing National Front presentation. Relations with Egypt, PAL and Jordan fall 25; taking office does not automatically expel residents."
 ISR70_rad_denial:0 "Deny Equal Civil Status"
 ISR70_rad_denial_desc:0 "Explicitly deny equal civil status in controlled, non-core Sinai: +10 points of occupied factory access, +10% garrison need and +5% police costs. This replaces the general unequal statute and blocks the civic core route while active."
 ISR70_policy_kach_special_condition_tt:0 "The radical unequal occupation statute is active."
 ISR70_rad_no_expulsion:0 "Retain Residents under Separate Administration"
 ISR70_rad_no_expulsion_desc:0 "Keep residents and their economic activity under unequal administration, with 0.5% of GDP for basic services. No seized-property slots or additional expulsion penalties are awarded; the underlying unequal legal regime remains."
 ISR70_rad_expulsion:0 "Forced Expulsion of Arab Residents"
 ISR70_rad_expulsion_desc:0 "An explicitly chosen, abstract forced-displacement policy. Pay 200 political power; at most two seized-property slots, stability -8 points, local resistance target +25 points and garrison need +20%. Refugees and property claims persist; other states receive actual embargo choices. No expulsion quota, population deletion, or core reward."
 ISR70_rad_limited_emergency:0 "Security Powers with an Electoral Sunset"
 ISR70_rad_limited_emergency_desc:0 "Pay 50 political power for 365 days of +2 occupied factory-access points and +3% police costs. Elections are preserved. Renewal requires another paid government decision; the alternative is permanent emergency."
 ISR70_rad_permanent_emergency:0 "Expansion under Permanent Emergency"
 ISR70_rad_permanent_emergency_desc:0 "Choose a permanent emergency explicitly. Suspend elections, gain 5 further points of occupied factory access, and pay +10% police and +10% personnel costs. Neither party membership nor the population-policy choice enacts this automatically."
 ISR70_external_associations:0 "Settlement Division Networks"
 ISR70_external_associations_desc:0 "Settlement departments, cooperative associations and private patrons can finance civilian footholds beyond Israel's military perimeter. Unilateral expansion creates competing land claims and imposes costs on the affected administration."
 ISR70_controlled_settlement_engineering:0 "Settlement Engineering Department"
 ISR70_controlled_settlement_engineering_desc:0 "Surveyors, water engineers and settlement departments can prepare funded agricultural sites and access roads in areas under Israeli control. Each project carries its own security and public-service commitment."
 ISR70_policy_presence_established_208_condition_tt:0 "Israeli settlement funding in West Bank is active."
 ISR70_policy_presence_capital_paid_208_condition_tt:0 "Presence capital paid 208."
 ISR70_presence_west_bank:0 "Establish a West Bank Settlement Foothold"
 ISR70_presence_west_bank_desc:0 "Finance Israeli settlement holdings and protected commercial links in West Bank without the consent of the government controlling the area. These illegal settlements impose land, production and administrative burdens on that government. Israel assumes the financial and security commitment."
 ISR70_policy_freeze_agreed_condition_tt:0 "Freeze agreed."
 ISR70_policy_binding_settlement_ceiling_condition_tt:0 "Binding settlement ceiling."
 ISR70_develop_west_bank:0 "Develop Settlement Sites in West Bank"
 ISR70_develop_west_bank_desc:0 "Fund an agricultural site, an access road and a protected local position in West Bank. The resulting assets remain in the state; their security perimeter adds to the burden of occupation."
 ISR70_policy_presence_established_209_condition_tt:0 "Israeli settlement funding in Gaza is active."
 ISR70_policy_presence_capital_paid_209_condition_tt:0 "Presence capital paid 209."
 ISR70_presence_gaza:0 "Establish a Gaza Settlement Foothold"
 ISR70_presence_gaza_desc:0 "Finance Israeli settlement holdings and protected commercial links in Gaza without the consent of the government controlling the area. These illegal settlements impose land, production and administrative burdens on that government. Israel assumes the financial and security commitment."
 ISR70_develop_gaza:0 "Develop Settlement Sites in Gaza"
 ISR70_develop_gaza_desc:0 "Fund an agricultural site, an access road and a protected local position in Gaza. The resulting assets remain in the state; their security perimeter adds to the burden of occupation."
 ISR70_policy_presence_established_213_condition_tt:0 "Israeli settlement funding in Sinai is active."
 ISR70_policy_presence_capital_paid_213_condition_tt:0 "Presence capital paid 213."
 ISR70_presence_sinai:0 "Establish a Sinai Settlement Foothold"
 ISR70_presence_sinai_desc:0 "Finance Israeli settlement holdings and protected commercial links in Sinai without the consent of the government controlling the area. These illegal settlements impose land, production and administrative burdens on that government. Israel assumes the financial and security commitment."
 ISR70_develop_sinai:0 "Develop Settlement Sites in Sinai"
 ISR70_develop_sinai_desc:0 "Fund an agricultural site, an access road and a protected local position in Sinai. The resulting assets remain in the state; their security perimeter adds to the burden of occupation."
 ISR70_policy_presence_established_587_condition_tt:0 "Israeli settlement funding in Golan is active."
 ISR70_policy_presence_capital_paid_587_condition_tt:0 "Presence capital paid 587."
 ISR70_presence_golan:0 "Establish a Golan Settlement Foothold"
 ISR70_presence_golan_desc:0 "Finance Israeli settlement holdings and protected commercial links in Golan without the consent of the government controlling the area. These illegal settlements impose land, production and administrative burdens on that government. Israel assumes the financial and security commitment."
 ISR70_develop_golan:0 "Develop Settlement Sites in Golan"
 ISR70_develop_golan_desc:0 "Fund an agricultural site, an access road and a protected local position in Golan. The resulting assets remain in the state; their security perimeter adds to the burden of occupation."
 ISR70_municipal_agreement:0 "Municipal Administrative Compact"
 ISR70_municipal_agreement_desc:0 "An agreed civilian administrative compact improves local provision without creating cores or changing the legal owner of this state."
 ISR70_citizen_army:0 "Citizen Army and Reserve"
 ISR70_citizen_army_desc:0 "The citizen army combines a small standing force with a trained reserve. Readiness and civilian employment must be balanced."
 ISR70_histadrut:0 "Histadrut and the Building Society"
 ISR70_histadrut_desc:0 "The labor federation and cooperative institutions remain major pillars of industrial development and social provision."
 ISR70_unity:0 "The Unity Government of 1969"
 ISR70_unity_desc:0 "A broad parliamentary majority provides stability but requires sustained negotiation between distinct political partners."
 ISR70_attrition:0 "The War of Attrition"
 ISR70_attrition_desc:0 "An unresolved conflict consumes personnel resources. A mutually accepted ceasefire can remove this burden."
 ISR70_embargo:0 "Lessons of the French Embargo"
 ISR70_embargo_desc:0 "Restricted external deliveries make defense manufacturing harder until reliable contracts or a domestic production programme are established."
 ISR70_absorption:0 "Immigration and Development Gaps"
 ISR70_absorption_desc:0 "Immigration sustains population growth but requires housing, education and social provision."
 ISR70_ambiguity:0 "Nuclear Ambiguity"
 ISR70_ambiguity_desc:0 "A policy of ambiguity supports diplomatic independence without granting weapons or bypassing technology and material requirements."
 ISR70_integrated_immigration:0 "Integrated Immigration"
 ISR70_integrated_immigration_desc:0 "Education, employment and municipal development support continued immigration without the original social-cost surcharge."
 ISR70_temporary_readiness:0 "Temporary Reserve Readiness"
 ISR70_temporary_readiness_desc:0 "A temporary call-up accelerates mobilization but increases personnel expenses and diverts civilian production for sixty days."
 ISR70_unity_cabinet_idea:0 "National Unity Cabinet"
 ISR70_unity_cabinet_idea_desc:0 "A broad coalition can distribute responsibility for national security across the major parties. Its members will expect a say in appointments and spending, slowing the passage of a common legislative programme."
 ISR70_narrow_cabinet_idea:0 "A Working Parliamentary Majority"
 ISR70_narrow_cabinet_idea_desc:0 "A smaller coalition gives ministers clearer authority over the legislative agenda. Dependence on fewer parliamentary partners leaves the government more exposed to every dispute within its majority."
 ISR70_civil_service_idea:0 "The Civil Service Commission"
 ISR70_civil_service_idea_desc:0 "Merit examinations and common personnel standards can make a young state less dependent on party appointments. Professional administration will be cheaper to sustain, but the coalition will lose some of the patronage through which it has held together."
 ISR70_oversight_idea:0 "The Comptroller and Parliamentary Oversight"
 ISR70_oversight_idea_desc:0 "The State Comptroller must be able to follow public money from the cabinet to local administrations. Independent audits will make officials answer for misuse of their offices."
 ISR70_local_councils_idea:0 "Municipal Engineering Offices"
 ISR70_local_councils_idea_desc:0 "Local councils know which roads and service connections their communities need. Permanent engineering offices will speed municipal works while adding a modest standing administrative commitment."
 ISR70_central_planning_idea:0 "Sapir's Development Tenders"
 ISR70_central_planning_idea_desc:0 "Central tenders can concentrate scarce engineers and capital on projects that private investors would otherwise overlook. The same priority system gives established contractors greater protection from competition."
 ISR70_economic_plan_idea:0 "An Economic Plan for the Seventies"
 ISR70_economic_plan_idea_desc:0 "Industry, agriculture and public infrastructure must keep pace with a growing population. A national economic programme will coordinate investment for the coming decade."
 ISR70_water_idea:0 "Pumps for the National Water Carrier"
 ISR70_water_idea_desc:0 "The National Water Carrier already links northern water sources to the south. New pumping equipment and irrigation connections can support more cultivation, provided the treasury accepts the cost of operating an increasingly complex network."
 ISR70_negev_agriculture_idea:0 "Irrigation and Agronomy in the Negev"
 ISR70_negev_agriculture_idea_desc:0 "Water and agricultural engineering can give southern communities a more secure livelihood. New irrigated districts will bring cultivation and employment to the Negev."
 ISR70_water_maintenance_idea:0 "Mekorot's Workshops and Reservoirs"
 ISR70_water_maintenance_idea_desc:0 "A water network is only as dependable as its pumps, repair crews and reserve storage. Dedicated workshops will restore damaged utilities more quickly and protect investment in irrigation, at the price of a continuing maintenance establishment."
 ISR70_haifa_industry_idea:0 "Haifa as an Industrial Center"
 ISR70_haifa_industry_idea_desc:0 "Expand the civilian industrial base in Haifa and give the new plant a funded capital budget."
 ISR70_tel_aviv_offices_idea:0 "Services in Tel Aviv"
 ISR70_tel_aviv_offices_idea_desc:0 "Commercial offices in Tel Aviv will bring export finance, technical services and accounting into a more productive urban network. The investment strengthens the service economy while competing with industrial and peripheral projects for capital."
 ISR70_exports_idea:0 "Diamonds, Citrus and Precision Workshops"
 ISR70_exports_idea_desc:0 "Established exporters can introduce smaller workshops to overseas orders and commercial credit. A stronger export network will draw investment into services while making those firms more sensitive to conditions beyond Israel."
 ISR70_import_substitution_idea:0 "Produce What the Embargo Denies"
 ISR70_import_substitution_idea_desc:0 "Foreign embargoes expose the vulnerabilities of an economy dependent on imported machinery. Domestic production must be able to sustain essential industries under pressure."
 ISR70_export_specialization_idea:0 "An Economy of Specialist Exporters"
 ISR70_export_specialization_idea_desc:0 "A small domestic market cannot absorb every product of modern engineering. Specialised exporters will gain from international investment and orders, while relying more heavily on access to foreign customers."
 ISR70_diaspora_bonds_idea:0 "Israel Bonds Development Offices"
 ISR70_diaspora_bonds_idea_desc:0 "Diaspora savings can support public investment through a credible bond programme. Transparent administration and durable projects will be essential to retaining investors' confidence."
 ISR70_investment_scrutiny_idea:0 "Scrutinize Investment Contracts"
 ISR70_investment_scrutiny_idea_desc:0 "Publish investment contracts and subject concessions to independent audits. Public confidence requires clear terms and officials who can be held accountable."
 ISR70_civil_electronics_idea:0 "ELTA's Civilian Suppliers"
 ISR70_civil_electronics_idea_desc:0 "Technical workshops and civilian electronics can become a new foundation for industrial development. Skilled engineers will connect university research with practical manufacturing."
 ISR70_technion_idea:0 "The Technion's New Computing Faculty"
 ISR70_technion_idea_desc:0 "The new computer-science faculty gives Israel a place to train specialists for research and industrial work. Sustained support for laboratories and academic staff will broaden technical capability, with higher education becoming a larger public commitment."
 ISR70_sme_credit_idea:0 "Credit beyond the Large Enterprises"
 ISR70_sme_credit_idea_desc:0 "Small workshops and family firms need credit outside the networks of the largest public and private employers. Loan guarantees can broaden commercial opportunity, while exposing the public administration to supervision and recovery costs."
 ISR70_steady_budget_idea:0 "Credit before New Commitments"
 ISR70_steady_budget_idea_desc:0 "A credible budget can improve the state's borrowing terms and protect essential services. Restraining new commitments also slows public construction, making the cabinet choose which projects can wait."
 ISR70_development_budget_idea:0 "A Treasury for Development"
 ISR70_development_budget_idea_desc:0 "The treasury will sustain a faster programme of housing, infrastructure and industrial construction. The productive assets will take time to earn their keep, while the new commitments make public credit more expensive."
 ISR70_social_contract_idea:0 "Wages, Prices and the Histadrut"
 ISR70_social_contract_idea_desc:0 "Ministers, employers and the Histadrut can settle wage disputes before they interrupt production. A negotiated compact will make industrial change more predictable, while narrowing the cabinet's freedom to impose a settlement of its own. Agreed recruitment and working arrangements will also bring more adults into regular employment."
 ISR70_vocational_idea:0 "ORT Workshops for a Changing Economy"
 ISR70_vocational_idea_desc:0 "Practical instruction can help immigrants and development-town residents enter skilled industrial work. Teacher preparation and workshop equipment will cost more than a general promise of employment, but they give modernisation a broader social foundation. Retraining women and adults outside skilled employment will expand the available labour force."
 ISR70_development_towns_idea:0 "Work within Reach of the Development Towns"
 ISR70_development_towns_idea_desc:0 "Roads can connect the development towns to jobs and public services instead of leaving housing isolated from the wider economy. The cabinet must fund and maintain those links even where the immediate commercial return is modest. Bringing jobs within reach allows more residents to enter paid employment."
 ISR70_absorption_reform_idea:0 "Ulpan, Qualifications and a First Job"
 ISR70_absorption_reform_idea_desc:0 "Language instruction and recognition of qualifications will connect immigrants to work that uses their skills. Housing, job placement and bridging courses can turn an absorption system into a route to regular employment, while the state accepts continuing educational obligations."
 ISR70_equal_local_services_idea:0 "Equal Municipal Services"
 ISR70_equal_local_services_idea_desc:0 "Fund equal municipal provision. Better administration lowers the cost of social services and improves public confidence."
 ISR70_local_autonomy_idea:0 "Strengthen Municipal Self-Government"
 ISR70_local_autonomy_idea_desc:0 "Transfer routine municipal responsibilities to elected councils and reduce central administrative costs."
 ISR70_religious_compromise_idea:0 "Renew the Status Quo Agreement"
 ISR70_religious_compromise_idea_desc:0 "Religious parties will accept a parliamentary settlement that protects their institutions and communal services. The compromise can steady the coalition, while support for separate educational provision places a lasting claim on public funds."
 ISR70_civil_marriage_idea:0 "A Civil Personal-Status Register"
 ISR70_civil_marriage_idea_desc:0 "A civil register would let households settle their personal status outside religious jurisdiction. It will broaden civil choice while bringing the government into direct conflict with those who regard religious authority as part of the founding compact."
 ISR70_volunteer_service_idea:0 "Municipal Volunteers and Emergency Aid"
 ISR70_volunteer_service_idea_desc:0 "Volunteer placements can strengthen local emergency and welfare services without extending military obligation. Councils will need supervisors and dependable placements if the programme is to deliver more than a symbolic national gesture."
 ISR70_service_expansion_idea:0 "A Wider Call-Up and Training System"
 ISR70_service_expansion_idea_desc:0 "A broader service framework can bring trained recruits to their units more quickly. Larger training establishments and more frequent call-ups will also increase the continuing cost of military personnel."
 ISR70_universities_idea:0 "Laboratories beyond the Defence Establishment"
 ISR70_universities_idea_desc:0 "Universities in Jerusalem and Haifa need laboratories capable of supporting an independent civilian research agenda. Greater academic capacity will widen the country's technical choices while increasing the cost of maintaining its education system. Qualifications and specialist conversion courses will broaden access to professional work."
 ISR70_public_health_idea:0 "Clinics and the New Medical Faculties"
 ISR70_public_health_idea_desc:0 "More clinics and medical training can bring qualified care beyond the largest urban centres. Better administration will make treatment less costly, but training the additional professionals requires a stronger educational commitment. Dependable treatment and community care also help more adults remain in paid work."
 ISR70_reserve_system_idea:0 "Miluim: A Trained Reserve"
 ISR70_reserve_system_idea_desc:0 "The reserve system depends on civilian specialists arriving at the right units with usable equipment and current training. Reliable mobilisation improves readiness, while employers and the defence budget must absorb more frequent periods of service."
 ISR70_defensive_depth_idea:0 "A Fortified Screen and Local Reserves"
 ISR70_defensive_depth_idea_desc:0 "Prepared positions and rehearsed relief plans can hold a front while reserves assemble. A force organised around that screen will dig in effectively, but its planning routines will be less suited to sudden changes of axis."
 ISR70_maneuver_idea:0 "Operational Reserves for Mobile War"
 ISR70_maneuver_idea_desc:0 "Mobile reserves must practise changing direction and concentrating before an opponent can react. Faster planning and armoured movement will give the staff more options, at the cost of a heavier field-supply requirement."
 ISR70_survivability_idea:0 "The Crew Comes First"
 ISR70_survivability_idea_desc:0 "Armour design and field repair will prioritise keeping experienced crews alive. Additional protection can strengthen the force's staying power, with weight and servicing demands limiting its tactical speed."
 ISR70_armour_mobility_idea:0 "Armoured Tempo and Recovery Teams"
 ISR70_armour_mobility_idea_desc:0 "A mobile armoured force needs crews and recovery teams able to sustain rapid movement. Faster vehicles and planning give the staff a different instrument from heavier protection, while consuming more supplies on campaign."
 ISR70_engineers_idea:0 "Bridging Columns and Field Workshops"
 ISR70_engineers_idea_desc:0 "Bridging crews and field workshops can keep a small army moving through damaged routes and difficult terrain. Concentrating specialists on those tasks improves supply economy, while leaving fewer resources for rapid entrenchment."
 ISR70_special_forces_idea:0 "Selection and Long-Range Patrol Schools"
 ISR70_special_forces_idea_desc:0 "Specialist patrols need careful selection, language preparation and sustained field training. Their experience will improve the army's specialist capability, while small professional establishments carry a higher personnel cost."
 ISR70_foreign_aircraft_idea:0 "Conversion Schools for American Aircraft"
 ISR70_foreign_aircraft_idea_desc:0 "A reliable American supply channel allows the air force to plan its next generation of aircraft. Conversion training and maintenance arrangements must accompany procurement."
 ISR70_local_aircraft_idea:0 "From Bedek Workshops to Israeli Designs"
 ISR70_local_aircraft_idea_desc:0 "Israel Aircraft Industries can reduce dependence on foreign suppliers. Domestic design teams, workshops and flight trials will require sustained government backing."
 ISR70_air_maintenance_idea:0 "Spare Engines and Dispersed Workshops"
 ISR70_air_maintenance_idea_desc:0 "Spare engines and dispersed workshops can turn aircraft on the inventory into aircraft ready for missions. Better servicing will improve operational availability, while the air force must maintain a larger technical establishment."
 ISR70_missile_boats_idea:0 "Gabriel and the Missile-Boat Flotilla"
 ISR70_missile_boats_idea_desc:0 "Small missile boats need coordinated manoeuvre and crews able to fight in coastal waters. Concentrating the navy on this flotilla will improve its tactical organisation while requiring intensive training and specialist upkeep."
 ISR70_submarines_idea:0 "A School for Submarine Crews"
 ISR70_submarines_idea_desc:0 "Submarine operations demand a long apprenticeship in navigation, machinery and concealment. Dedicated instruction will support contemporary submarine research, with the navy accepting higher personnel expenditure for a small force."
 ISR70_intelligence_analysis_idea:0 "An Independent Assessment Desk"
 ISR70_intelligence_analysis_idea_desc:0 "Language specialists and competing assessments can give the cabinet a less complacent picture of its neighbours. Careful evaluation improves reconnaissance and planning, while independent review slows the immediate political use of intelligence."
 ISR70_intelligence_operations_idea:0 "Networks beyond the Frontier"
 ISR70_intelligence_operations_idea_desc:0 "Operational stations and secure communications can strengthen foreign networks and protect the state from outside influence. The cabinet must sustain the administrative cost and political responsibility of a larger clandestine establishment."
 ISR70_preparedness_idea:0 "Readiness within the National Budget"
 ISR70_preparedness_idea_desc:0 "The General Staff must bring reserve call-ups, servicing and civilian protection into one sustainable plan. Better coordination reduces waste in field supply, while the commitment to keep trained forces ready continues in peacetime."
 ISR70_us_security_idea:0 "Negotiate Security Cooperation"
 ISR70_us_security_idea_desc:0 "An agreement with Washington gives military planners a dependable basis for cooperation. Training and procurement offices must turn diplomatic commitments into lasting working arrangements."
 ISR70_us_civil_idea:0 "Negotiate Civilian Economic Cooperation"
 ISR70_us_civil_idea_desc:0 "Implement an accepted civilian agreement through investment access and industrial research."
 ISR70_european_trade_idea:0 "Develop European Export Markets"
 ISR70_european_trade_idea_desc:0 "Use the accepted European trade channel to improve investment returns and support commercial institutions."
 ISR70_independent_diplomacy_idea:0 "An Independent Diplomacy"
 ISR70_independent_diplomacy_idea_desc:0 "Maintain independent negotiating room and protect domestic decision making against foreign influence."
 ISR70_africa_contacts_idea:0 "Maintain African Contacts"
 ISR70_africa_contacts_idea_desc:0 "Technical missions abroad offer cooperation in agriculture, training and public works. Lasting partnerships will depend on useful expertise and reliable commitments."
 ISR70_oil_security_idea:0 "Stocks for the Iranian Supply Route"
 ISR70_oil_security_idea_desc:0 "An accepted Iranian arrangement can support fuel stocks and more reliable supply planning. Storage and distribution reduce vulnerability to interruption, but dedicated facilities will require continuing administration."
 ISR70_keep_ambiguity_idea:0 "Amimut and Cabinet Discipline"
 ISR70_keep_ambiguity_idea_desc:0 "Discretion preserves freedom of action in a hostile region. The cabinet will reaffirm a policy of strategic ambiguity and tightly controlled diplomatic communication."
 ISR70_nuclear_transparency_idea:0 "A Civilian Research Accounting"
 ISR70_nuclear_transparency_idea_desc:0 "Civilian nuclear cooperation offers a different diplomatic course. Greater openness would place international research and peaceful technical exchanges at the center of policy."
 ISR70_limited_attrition_idea:0 "Limit the Conflict"
 ISR70_limited_attrition_idea_desc:0 "Limit the conflict to a defensive posture with better field coordination and manageable supply use."
 ISR70_armed_stalemate_idea:0 "Forward Defensive Readiness"
 ISR70_armed_stalemate_idea_desc:0 "Prepared positions, supply reserves and trained headquarters can support the cabinet during a confrontation or while negotiations proceed. Maintaining the posture demands a continuing personnel commitment."
 ISR70_all_on_idea:0 "Defensible Frontiers and Negotiating Reserves"
 ISR70_all_on_idea_desc:0 "Agricultural security zones and retained negotiating reserves offer one approach to territorial policy. Allon and other cabinet ministers have advanced competing proposals; the government must choose its own balance between a defensible frontier and room for agreement."
 ISR70_territorial_maximalism_idea:0 "Permanent Territorial Control"
 ISR70_territorial_maximalism_idea_desc:0 "Supporters of permanent territorial control want the cabinet to commit to a lasting administrative presence. Their programme will shape relations with neighboring states and the communities under Israeli control."
 ISR70_regional_compromise_idea:0 "Negotiate Territorial Compromises"
 ISR70_regional_compromise_idea_desc:0 "Authorize territorial compromise and give the negotiating team political capital for the peace route."
 ISR70_gaza_services_idea:0 "A Civil Administration for Gaza"
 ISR70_gaza_services_idea_desc:0 "Civilian administration in Gaza depends on functioning local services. Work with municipal institutions to improve provision and the practical conditions of daily life."
 ISR70_egypt_peace_idea:0 "A Negotiated Peace with Egypt"
 ISR70_egypt_peace_idea_desc:0 "Implement an accepted Egyptian peace agreement, end the War of Attrition and improve the climate for civilian investment. Sinai control returns only under the agreed ownership checks."
 ISR70_regional_normalization_idea:0 "A Regional Peace Framework"
 ISR70_regional_normalization_idea_desc:0 "Build commercial and diplomatic institutions on the peace framework. Investment returns and office construction improve."
 ISR70_territory_administration_idea:0 "The Costs of Permanent Administration"
 ISR70_territory_administration_idea_desc:0 "Fund a permanent administrative apparatus. It reduces garrison losses but has an explicit recurring bureaucratic cost."
 ISR70_intelligence_idea:0 "Mossad and Military Intelligence"
 ISR70_intelligence_idea_desc:0 "This older policy is superseded by the revised 1970 programme."
 ISR70_policy_project_equal_services_idea:0 "Equal Municipal Services"
 ISR70_policy_project_equal_services_idea_desc:0 "An implemented, funded development programme."
 ISR70_policy_equal_employment_idea:0 "Open Public Employment"
 ISR70_policy_equal_employment_idea_desc:0 "Public hiring and vocational access are opened more broadly."
 ISR70_policy_project_equal_access_idea:0 "Equal Access to Land and Credit"
 ISR70_policy_project_equal_access_idea_desc:0 "An implemented, funded development programme."
 ISR70_policy_municipal_autonomy_idea:0 "Municipal Self-Government"
 ISR70_policy_municipal_autonomy_idea_desc:0 "Planning, procurement and municipal duties are devolved, with fragmented oversight."
 ISR70_policy_project_municipal_pacts_idea:0 "Municipal Infrastructure Grants"
 ISR70_policy_project_municipal_pacts_idea_desc:0 "An implemented, funded development programme."
 ISR70_policy_municipal_representation_idea:0 "Municipal Development Funds"
 ISR70_policy_municipal_representation_idea_desc:0 "Internal investment costs fall through pooled municipal development funds."
 ISR70_policy_project_preferential_allocations_idea:0 "Preferential Land and Budget Allocation"
 ISR70_policy_project_preferential_allocations_idea_desc:0 "An implemented, funded development programme."
 ISR70_policy_project_restricted_employment_idea:0 "Preferential Development Contracts"
 ISR70_policy_project_restricted_employment_idea_desc:0 "An implemented, funded development programme."
 ISR70_policy_separate_development_idea:0 "Separate Municipal Funding Rules"
 ISR70_policy_separate_development_idea_desc:0 "Public services are restricted for disadvantaged municipalities, reducing expenditure while increasing political and administrative costs."
 ISR70_policy_clerical_training_idea:0 "Trained Clerical Workforce"
 ISR70_policy_clerical_training_idea_desc:0 "Accounting and administrative training improves the labour efficiency of office buildings."
 ISR70_policy_clearing_network_idea:0 "Mechanized Clearing Network"
 ISR70_policy_clearing_network_idea_desc:0 "Mechanized bookkeeping and common clearing reduce labour required per office level."
 ISR70_policy_audited_funds_idea:0 "Audited Development Funds"
 ISR70_policy_audited_funds_idea_desc:0 "Project procurement is subject to stronger audit and reporting requirements."
 ISR70_policy_project_development_offices_idea:0 "Service Centers for New Towns"
 ISR70_policy_project_development_offices_idea_desc:0 "An implemented, funded development programme."
 ISR70_policy_bank_consortium_idea:0 "Domestic Banking Consortium"
 ISR70_policy_bank_consortium_idea_desc:0 "A coordinated domestic banking consortium improves office-sector productivity while increasing concentration-related costs."
 ISR70_policy_shared_services_idea:0 "Shared Back Offices"
 ISR70_policy_shared_services_idea_desc:0 "Shared accounting and administration lower the workforce required per office level."
 ISR70_policy_project_industrial_credit_idea:0 "Bank-Industry Investment Partnerships"
 ISR70_policy_project_industrial_credit_idea_desc:0 "An implemented, funded development programme."
 ISR70_policy_export_credit_accepted:0 "Accepted Export Credit Line"
 ISR70_policy_export_credit_accepted_desc:0 "External lenders have accepted a civilian export-credit arrangement."
 ISR70_policy_equipment_finance_idea:0 "Financed Office Equipment"
 ISR70_policy_equipment_finance_idea_desc:0 "Imported office equipment raises office productivity, with greater exposure to the international market."
 ISR70_policy_project_export_services_idea:0 "Build an Export Services Sector"
 ISR70_policy_project_export_services_idea_desc:0 "An implemented, funded development programme."
 ISR70_policy_project_municipal_works_208_idea:0 "Municipal Works Across the Green Line"
 ISR70_policy_project_municipal_works_208_idea_desc:0 "Roads, workshops and civilian services can support the existing population without opening another settlement frontier. This programme ties Israeli investment to the negotiated freeze and requires continuing public expenditure."
 ISR70_policy_project_municipal_works_209_idea:0 "Municipal Works Across the Green Line"
 ISR70_policy_project_municipal_works_209_idea_desc:0 "Roads, workshops and civilian services can support the existing population without opening another settlement frontier. This programme ties Israeli investment to the negotiated freeze and requires continuing public expenditure."
 ISR70_policy_land_compact:0 "Local Administrative Compact"
 ISR70_policy_land_compact_desc:0 "A funded local administrative compact reduces central administration costs."
 ISR70_policy_project_designated_sites_208_idea:0 "Nahal Agricultural Sites"
 ISR70_policy_project_designated_sites_208_idea_desc:0 "Nahal combines agricultural training with military service. A limited group of sites can improve irrigation practice and frontier supply, but even a geographically restrained programme requires land administration and strains relations with Palestinian institutions."
 ISR70_policy_project_designated_sites_209_idea:0 "Nahal Agricultural Sites"
 ISR70_policy_project_designated_sites_209_idea_desc:0 "Nahal combines agricultural training with military service. A limited group of sites can improve irrigation practice and frontier supply, but even a geographically restrained programme requires land administration and strains relations with Palestinian institutions."
 ISR70_policy_project_settlement_ceiling_208_idea:0 "Consolidate a Limited Settlement Perimeter"
 ISR70_policy_project_settlement_ceiling_208_idea_desc:0 "Protect the existing sites and their workshops while ruling out another wave of expansion. A smaller perimeter is easier to maintain, although guarding civilian communities still adds to the security budget."
 ISR70_policy_project_settlement_ceiling_209_idea:0 "Consolidate a Limited Settlement Perimeter"
 ISR70_policy_project_settlement_ceiling_209_idea_desc:0 "Protect the existing sites and their workshops while ruling out another wave of expansion. A smaller perimeter is easier to maintain, although guarding civilian communities still adds to the security budget."
 ISR70_policy_project_authorize_expansion_208_idea:0 "A Civilian Settlement Programme"
 ISR70_policy_project_authorize_expansion_208_idea_desc:0 "The cabinet can place the settlement departments behind a broader civilian programme. Preparing development land and access routes will accelerate construction, while increasing administrative commitments and the dispute over the territory."
 ISR70_policy_project_authorize_expansion_209_idea:0 "A Civilian Settlement Programme"
 ISR70_policy_project_authorize_expansion_209_idea_desc:0 "The cabinet can place the settlement departments behind a broader civilian programme. Preparing development land and access routes will accelerate construction, while increasing administrative commitments and the dispute over the territory."
 ISR70_policy_project_settlement_package_208_idea:0 "Cooperative Farms and Settlement Workshops"
 ISR70_policy_project_settlement_package_208_idea_desc:0 "Cooperative farms, packing facilities and workshops will connect the new communities to Israeli production networks. Agricultural and manufacturing gains come with subsidised housing, public services and a larger capital commitment."
 ISR70_policy_project_settlement_package_209_idea:0 "Cooperative Farms and Settlement Workshops"
 ISR70_policy_project_settlement_package_209_idea_desc:0 "Cooperative farms, packing facilities and workshops will connect the new communities to Israeli production networks. Agricultural and manufacturing gains come with subsidised housing, public services and a larger capital commitment."
 ISR70_policy_project_entrench_network_208_idea:0 "Regional Roads and Protected Supply Routes"
 ISR70_policy_project_entrench_network_208_idea_desc:0 "A connected road network and prepared defensive positions make the settlement programme easier to supply and repair. The same network extends the area that the government must administer and protect."
 ISR70_policy_project_entrench_network_209_idea:0 "Regional Roads and Protected Supply Routes"
 ISR70_policy_project_entrench_network_209_idea_desc:0 "A connected road network and prepared defensive positions make the settlement programme easier to supply and repair. The same network extends the area that the government must administer and protect."
 ISR70_policy_gi_sinai_admin_idea:0 "A Permanent Sinai Administration"
 ISR70_policy_gi_sinai_admin_idea_desc:0 "Establish permanent Sinai administration at a cost of 0.3% of GDP. Local infrastructure builds 15% faster; bureaucracy costs rise 3%. Egyptian ownership remains until an actual territorial settlement."
 ISR70_policy_gi_sinai_families_services:0 "Voluntary Settlement in the Sinai Towns"
 ISR70_policy_gi_sinai_families_services_desc:0 "Temporary family services for a limited voluntary internal migration programme."
 ISR70_policy_frontier_family_services:0 "Frontier Family Services"
 ISR70_policy_frontier_family_services_desc:0 "A five-year national family-service programme; monthly_population is a growth-rate modifier, not a migration count."
 ISR70_policy_gi_canal_settlers_services:0 "A Sinai Coastal Settlement Programme"
 ISR70_policy_gi_canal_settlers_services_desc:0 "Temporary family services for a limited voluntary internal migration programme."
 ISR70_policy_project_gi_canal_navigation_idea:0 "Sinai Coastal Logistics"
 ISR70_policy_project_gi_canal_navigation_idea_desc:0 "Coastal handling facilities and maintenance crews can improve local supply without depending on traffic through the Suez Canal. Running the service adds to the civil administration budget."
 ISR70_policy_canal_province_admin:0 "Sinai Provincial Administration"
 ISR70_policy_canal_province_admin_desc:0 "An annexed province requires a permanent civil administrative apparatus."
 ISR70_policy_equal_status:0 "Equal Civil Rights"
 ISR70_policy_equal_status_desc:0 "A legal-status policy with explicit continuing costs. It is replaced, not stacked, when the legal regime changes."
