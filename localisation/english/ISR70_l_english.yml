 ISR70_policy_project_restricted_employment_desc:0 "Reserve 1.2% of annual GDP at selection. Delivery after 270 days: +1 civilian factories in the Negev. Continuing effects: Corruption Cost: +3%. Loss of required control or project conditions refunds the exact reserved sum. The project can be completed only once."
 ISR70_policy_project_restricted_employment_delivery_tt:0 "After 270 days: +1 civilian factories in the Negev. Corruption Cost: +3%"
 ISR70_policy_project_restricted_employment_active_condition_tt:0 "Project restricted employment active."
 ISR70_policy_decision_development_bond_draw:0 "Draw the Development Bond Facility"
