 ISR70_party_11:0 "Unavailable Political Slot"
 ISR70_party_11_desc:0 "This slot does not participate in Israel's 1970 political system."
 ISR70_party_11_icon:0 ""
 ISR70_party_12:0 "£ISR70_party_12 Islamic Municipal Reform List"
 ISR70_party_12_desc:0 "A parliamentary organization of Arab municipalities can prioritize trade, charitable provision or a common civic settlement."
 ISR70_party_13:0 "£ISR70_party_13 Agudat Israel and Poalei Agudat Israel"
 ISR70_party_13_desc:0 "The Orthodox parties defend their communities through parliamentary bargaining, religious education and local social institutions."
 ISR70_party_14:0 "£ISR70_party_14 State List"
 ISR70_party_14_desc:0 "A pragmatic cabinet can professionalize public enterprises or encourage private business, while choosing between defensive pragmatism and territorial negotiations."
 ISR70_party_15:0 "£ISR70_party_15 Progress and Development / Cooperation and Brotherhood"
 ISR70_party_15_desc:0 "An explicitly alternative alliance of entrepreneurs and municipal notables must choose transparent investment or privileged concessions and patronage."
 ISR70_party_16:0 "£ISR70_party_16 HaOlam HaZeh - New Force"
 ISR70_party_16_desc:0 "A secular civil-rights movement can defend a free press and equal citizenship. Radical market reform is a separate alternative policy."
 ISR70_party_17:0 "£ISR70_party_17 Landscape and Environment League"
 ISR70_party_17_desc:0 "An alternative early environmental organization addresses the real development choices of land, water, industry and public infrastructure."
 ISR70_party_18:0 "£ISR70_party_18 Mapam - United Workers Party"
 ISR70_party_18_desc:0 "Mapam brings the cooperative movement, organized workers and a commitment to Jewish-Arab equality into the debate over Israel's future."
 ISR70_party_19:0 "£ISR70_party_19 Maki - Israeli Communist Party"
 ISR70_party_19_desc:0 "An independent communist cabinet chooses its own relationship between workers' institutions, parliamentary rights and economic planning."
 ISR70_party_20:0 "£ISR70_party_20 Free Center"
 ISR70_party_20_desc:0 "A national opposition can remain parliamentary or seek a presidential mandate. It is not a later national-religious party transplanted into 1970."
 ISR70_party_21:0 "£ISR70_party_21 Radical National Front"
 ISR70_party_21_desc:0 "An explicit alternative radicalization precedes this movement. Autarky, mobilization and an authoritarian security order have real economic consequences."
 ISR70_party_22:0 "£ISR70_party_22 Military Emergency Cabinet"
 ISR70_party_22_desc:0 "A genuine constitutional emergency is required. The armed forces are not treated as an ordinary electoral party in January 1970."
 ISR70_party_23:0 "£ISR70_party_23 Constitutional Hebrew Crown"
 ISR70_party_23_desc:0 "A freely selected constitutional founding process is required. A crown is an explicit alternative, not a reinterpretation of a modern religious party."
