 mdcw_suez_canal_closure: "Suez Canal Closure"
 mdcw_suez_canal_closure_desc: "The Suez Canal is closed to navigation. Shipping must take longer routes around Africa, tying up merchant fleets and raising the cost of machinery, materials and overseas deliveries. Higher freight bills erode export earnings while disrupted supply chains weigh on industry and construction."
 mdcw_suez_exposure_tt: "Globalization: §Y[?mdcw_suez_globalism|0] / 100§!\nRegional route exposure index: §Y[?mdcw_suez_route|2] / 1.00§!\nCurrent burden: §R[?mdcw_suez_burden|%0]§! of the maximum effects.\n§gExposure reflects our economic integration and reliance on the Europe-Indian Ocean trade corridor. Inland economies remain affected through neighboring ports and supply chains. The burden ends when navigation through the canal resumes.§!"
