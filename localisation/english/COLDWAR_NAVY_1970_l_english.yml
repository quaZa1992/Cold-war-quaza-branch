l_english:
# IMPERIA COLD WAR — Adapted generic naval programmes.
 COLDWAR_NAVY_DDR_idea_combined_military_defense_industries:0 "Shipbuilding Suppliers"
 COLDWAR_NAVY_DDR_idea_combined_military_defense_industries_desc:0 "A coastal combatant depends on engines, radio equipment, weapons and instruments supplied by enterprises across the republic. Delays in one workshop can hold a nearly complete vessel at its berth. Closer links between naval planners, shipyards and specialist suppliers would make the shipbuilding programme easier to fulfil and support throughout its service life."
 COLDWAR_NAVY_DDR_idea_weapon_conversion_packages:0 "Military Supply Refits"
 COLDWAR_NAVY_DDR_idea_weapon_conversion_packages_desc:0 "The Volksmarine draws on enterprises that also supply the National People's Army. Common conversion packages and workshop standards can improve the reuse of military equipment and support factory production, keeping the coastal service's stores connected to the republic's wider defence industry."
 COLDWAR_NAVY_DDR_idea_convoy_and_freighter_production:0 "Baltic Merchant Routes"
 COLDWAR_NAVY_DDR_idea_convoy_and_freighter_production_desc:0 "Rostock's commercial fleet carries goods on which the republic's industry and foreign trade depend. Its work shares ports, repair services and trained seamen with the wider maritime economy. Better arrangements for freighters and coastal transport would help protect dependable supply through the Baltic while preserving the needs of commercial shipping."
 COLDWAR_NAVY_DDR_idea_improved_repair_facilities:0 "Flotilla Repair Depots"
 COLDWAR_NAVY_DDR_idea_improved_repair_facilities_desc:0 "A small fleet loses an appreciable share of its strength when several boats wait for the same technicians or components. Shore repair depots need common spares, technical records and teams familiar with the flotillas' equipment. A stronger support network would help crews maintain their vessels and return them to duty more promptly."
 COLDWAR_NAVY_DDR_idea_vessel_production:0 "Coastal Ship Series"
 COLDWAR_NAVY_DDR_idea_vessel_production_desc:0 "Standardised minesweepers, escorts and landing craft allow a small shipbuilding industry to accumulate experience with each completed vessel. Stable orders also help the flotillas prepare crews, spare parts and training. Organising coastal shipbuilding into dependable series would connect industrial work more closely to the Volksmarine's operational needs."
 COLDWAR_NAVY_DDR_idea_establish_a_marine_corps:0 "Landing Support Units"
 COLDWAR_NAVY_DDR_idea_establish_a_marine_corps_desc:0 "Landing vessels and naval support detachments can move troops, vehicles and engineering stores along the Baltic coast. Their effectiveness depends on cooperation with army units and the shore organisations receiving them. Dedicated landing-support training would give these operations a practical place in the republic's coastal defence planning."
 COLDWAR_NAVY_IRQ_idea_combined_military_defense_industries:0 "Naval Supply Workshops"
 COLDWAR_NAVY_IRQ_idea_combined_military_defense_industries_desc:0 "Naval stores compete with the army and air force for weapons, spare parts and skilled labour. Dedicated supply workshops can standardise orders and repair common equipment while retaining the wider military production needed to sustain these contracts."
 COLDWAR_NAVY_IRQ_idea_weapon_conversion_packages:0 "Refit the Naval Stores"
 COLDWAR_NAVY_IRQ_idea_weapon_conversion_packages_desc:0 "Existing military stores contain equipment that can be repaired or adapted before another purchase is ordered. Standard conversion packages and clear workshop instructions can reduce waste across the naval supply system and the wider armed forces."
 COLDWAR_NAVY_IRQ_idea_convoy_and_freighter_production:0 "Iraqi Merchant Shipping"
 COLDWAR_NAVY_IRQ_idea_convoy_and_freighter_production_desc:0 "Merchant shipping connects Iraqi production and imports to markets beyond the Gulf. Closer work between shipbuilders, port authorities and commercial operators can encourage practical freighter designs and more regular orders for the maritime industry."
 COLDWAR_NAVY_IRQ_idea_improved_repair_facilities:0 "Fleet Repair Programme"
 COLDWAR_NAVY_IRQ_idea_improved_repair_facilities_desc:0 "Machine tools alone will not keep a fleet ready. Planned maintenance periods, spare-parts records and trained repair teams can shorten avoidable delays and make better use of the navy's shore establishments."
 COLDWAR_NAVY_IRQ_idea_vessel_production:0 "Standard Coastal Hulls"
 COLDWAR_NAVY_IRQ_idea_vessel_production_desc:0 "A limited range of coastal hulls is easier to build and maintain than a collection of unrelated designs. Common fittings and production schedules can help Iraqi yards translate naval orders into consistent work."
 COLDWAR_NAVY_IRQ_idea_establish_a_marine_corps:0 "Naval Boarding School"
 COLDWAR_NAVY_IRQ_idea_establish_a_marine_corps_desc:0 "Boarding parties and shore detachments need training beyond ordinary shipboard duties. A naval school can prepare small units to secure harbour installations, inspect vessels and support limited coastal landings alongside the army."
 COLDWAR_NAVY_SOV_idea_combined_military_defense_industries:0 "Naval Industry Links"
 COLDWAR_NAVY_SOV_idea_combined_military_defense_industries_desc:0 "Naval construction depends on ministries responsible for engines, electrical equipment, weapons and precision instruments. Separate production plans can leave an expensive hull waiting for a single missing component. Closer coordination between the yards and their suppliers would make naval orders a more coherent part of the defence-industrial programme."
 COLDWAR_NAVY_SOV_idea_weapon_conversion_packages:0 "Arsenal Conversion"
 COLDWAR_NAVY_SOV_idea_weapon_conversion_packages_desc:0 "Soviet naval arsenals share weapons, tools and production resources with the wider defence industry. Standard conversion instructions and coordinated workshop orders can make better use of existing equipment while increasing military factory output during a concentrated modernisation programme."
 COLDWAR_NAVY_SOV_idea_convoy_and_freighter_production:0 "Merchant Fleet Plans"
 COLDWAR_NAVY_SOV_idea_convoy_and_freighter_production_desc:0 "The Ministry of the Merchant Marine carries the Union's foreign trade and supplies distant ports through a fleet with its own commercial obligations. Naval planners need reliable transport as overseas activity grows. Cooperation over freighters, repair schedules and reserve capacity would strengthen maritime supply while placing further demands on civilian shipping."
 COLDWAR_NAVY_SOV_idea_improved_repair_facilities:0 "Fleet Repair Depots"
 COLDWAR_NAVY_SOV_idea_improved_repair_facilities_desc:0 "Long distances between Soviet fleet bases make small machinery failures costly when specialist repair is available only at a few yards. Fleet repair depots need trained technicians, standard spares and access to technical drawings. Strengthening this network would return damaged or worn vessels to useful service more reliably."
 COLDWAR_NAVY_SOV_idea_vessel_production:0 "Series Shipbuilding"
 COLDWAR_NAVY_SOV_idea_vessel_production_desc:0 "Repeated construction of related hulls allows Soviet yards to improve their methods and prepare common stores of machinery and fittings. Frequent changes of specification can consume that advantage. A programme of organised production series would give designers and fleet representatives a firmer basis for balancing improvements against dependable delivery."
 COLDWAR_NAVY_SOV_idea_establish_a_marine_corps:0 "Naval Infantry Support"
 COLDWAR_NAVY_SOV_idea_establish_a_marine_corps_desc:0 "Soviet naval infantry provides forces for securing coastal positions and supporting operations from the sea. Its work depends on landing craft, engineers, communications and cooperation with the fleet. Developing those supporting institutions would make amphibious training a more practical part of naval planning and improve the handling of troops and stores ashore."
 COLDWAR_NAVY_UAE_idea_combined_military_defense_industries:0 "Coastal Supply Shops"
 COLDWAR_NAVY_UAE_idea_combined_military_defense_industries_desc:0 "A small coastal force still needs dependable weapons, tools and spare parts. Local supply workshops can serve patrol crews and the emirates' other security forces, giving military orders a practical base in the developing domestic economy."
 COLDWAR_NAVY_UAE_idea_weapon_conversion_packages:0 "Coastal Stores Refits"
 COLDWAR_NAVY_UAE_idea_weapon_conversion_packages_desc:0 "The coastal service and the emirates' security forces can make better use of their stores through common repair and conversion instructions. Refitting serviceable equipment gives workshops useful work while reducing avoidable replacement orders."
 COLDWAR_NAVY_UAE_idea_convoy_and_freighter_production:0 "Merchant Shipping Links"
 COLDWAR_NAVY_UAE_idea_convoy_and_freighter_production_desc:0 "The coast's commercial future depends on dependable links between local ports and overseas markets. Cooperation with merchant operators can encourage practical cargo-vessel construction and strengthen the maritime industry alongside fishing and traditional dhow trades."
 COLDWAR_NAVY_UAE_idea_improved_repair_facilities:0 "Patrol Repair Plan"
 COLDWAR_NAVY_UAE_idea_improved_repair_facilities_desc:0 "Patrol schedules are easily disrupted when tools, spare parts and technicians are scattered between establishments. A coordinated repair programme can improve maintenance routines and make existing workshops more effective."
 COLDWAR_NAVY_UAE_idea_vessel_production:0 "Standard Coastal Hulls"
 COLDWAR_NAVY_UAE_idea_vessel_production_desc:0 "Common hulls and fittings can keep a small maritime industry from being overwhelmed by unrelated orders. Standard construction practices offer a sounder basis for local work than an ambitious catalogue of specialist warships."
 COLDWAR_NAVY_UAE_idea_establish_a_marine_corps:0 "Coastal Boarding School"
 COLDWAR_NAVY_UAE_idea_establish_a_marine_corps_desc:0 "Vessel inspections, harbour security and work along the shoreline require trained small detachments. A boarding school can prepare personnel for these duties and limited coastal landings while drawing on the experience of the existing security forces."
 COLDWAR_NAVY_USA_idea_combined_military_defense_industries:0 "Naval Suppliers"
 COLDWAR_NAVY_USA_idea_combined_military_defense_industries_desc:0 "American shipbuilders depend on a broad network of machinery firms, electronics suppliers and ordnance manufacturers. Bringing their contracts into closer alignment can improve naval production and preserve skills shared with the other services, without treating every shipyard as an isolated procurement programme."
 COLDWAR_NAVY_USA_idea_weapon_conversion_packages:0 "Standardised Refit"
 COLDWAR_NAVY_USA_idea_weapon_conversion_packages_desc:0 "American naval support draws on many of the same workshops and supply chains as the other services. Standardised conversion packages and common production methods can make better use of that industrial capacity during a defined programme of modernisation."
 COLDWAR_NAVY_USA_idea_convoy_and_freighter_production:0 "Merchant Marine"
 COLDWAR_NAVY_USA_idea_convoy_and_freighter_production_desc:0 "The United States depends on merchant shipping to sustain overseas forces and move essential supplies. More efficient convoy and freighter production strengthens the transport base behind the fleet, giving military plans a firmer connection to the ships needed to carry them out."
 COLDWAR_NAVY_USA_idea_improved_repair_facilities:0 "Fleet Repair Yards"
 COLDWAR_NAVY_USA_idea_improved_repair_facilities_desc:0 "A fleet that spends too long awaiting repairs loses effective strength without losing a ship. Better scheduling, workshops and spare-parts arrangements can return American vessels to service more quickly during a concentrated period of overhaul work."
 COLDWAR_NAVY_USA_idea_vessel_production:0 "Shipbuilding Drive"
 COLDWAR_NAVY_USA_idea_vessel_production_desc:0 "Standard construction methods and a coordinated order book can help American yards turn investment into delivered ships. A concentrated production drive will favour dependable output for a limited term, while the navy and industry work through the demands of fleet renewal."
 COLDWAR_NAVY_USA_idea_establish_a_marine_corps:0 "Fleet Marine Force"
 COLDWAR_NAVY_USA_idea_establish_a_marine_corps_desc:0 "The Fleet Marine Force gives the United States an established amphibious capability. Naval training, landing procedures and supply arrangements must connect Marine formations with the ships supporting them. Closer integration will strengthen the fleet's ability to move and sustain troops ashore."
 COLDWAR_NAVY_DDR_naval_reform:0 "Volksmarine Plan"
 COLDWAR_NAVY_DDR_naval_reform_desc:0 "The Volksmarine must defend the republic's maritime approaches with the resources of a much smaller state than its Soviet partner. Naval headquarters and the Ministry of National Defence need an agreed programme for ships, crews and shore facilities. Clear priorities would give coastal operations a firmer place within the national defence plan."
 COLDWAR_NAVY_DDR_combined_military_defense_industries:0 "Shipbuilding Suppliers"
 COLDWAR_NAVY_DDR_combined_military_defense_industries_desc:0 "A coastal combatant depends on engines, radio equipment, weapons and instruments supplied by enterprises across the republic. Delays in one workshop can hold a nearly complete vessel at its berth. Closer links between naval planners, shipyards and specialist suppliers would make the shipbuilding programme easier to fulfil and support throughout its service life."
 COLDWAR_NAVY_DDR_capacity_combined_military_defense_industries_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_DDR_naval_bases:0 "Baltic Support Bases"
 COLDWAR_NAVY_DDR_naval_bases_desc:0 "Warnemünde and the facilities around Rügen support vessels whose usefulness depends on quick access to fuel, stores and repair. Naval traffic must share a narrow coast with fishing and commercial shipping. Improving these bases would give the flotillas a more dependable shore organisation and ease congestion around their operating berths."
 COLDWAR_NAVY_DDR_capacity_naval_bases_tt:0 "An owned and controlled coastal province has room for one naval-base level."
 COLDWAR_NAVY_DDR_funded_naval_bases_tt:0 "Treasury: $[?treasury|5] billion; required: $[?COLDWAR_NAVY_DDR_port_quote|5] billion."
 COLDWAR_NAVY_DDR_surface_ships:0 "Coastal Escort Forces"
 COLDWAR_NAVY_DDR_surface_ships_desc:0 "The Volksmarine needs escorts and specialist craft suited to shallow seas, coastal routes and crowded approaches. Minesweepers and antisubmarine vessels protect movements that fast attack boats alone cannot secure. Developing these forces would strengthen the practical defence of the Baltic coast and the shipping on which it relies."
 COLDWAR_NAVY_DDR_dockyards:0 "Baltic Yard Expansion"
 COLDWAR_NAVY_DDR_dockyards_desc:0 "The Peene shipyard at Wolgast and the yards around Rostock combine naval work with commercial and export orders. Extra capacity requires machinery, skilled teams and a dependable flow of materials. A coordinated Baltic yard programme would improve the republic's ability to build and maintain its coastal forces without leaving every order to compete separately."
 COLDWAR_NAVY_DDR_capacity_dockyards_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_DDR_funded_dockyards_tt:0 "Treasury: $[?treasury|5] billion; required: $[?COLDWAR_NAVY_DDR_yard_quote|5] billion."
 COLDWAR_NAVY_DDR_naval_doctrine_innovations:0 "Baltic Operations Study"
 COLDWAR_NAVY_DDR_naval_doctrine_innovations_desc:0 "Coastal operations in the Baltic depend on narrow channels, minefields, shore observation and timely support from land-based aircraft. The naval staff must bring these elements into a workable operational plan. A systematic study of exercises and local waters would give the flotillas clearer methods for defending and using the republic's sea approaches."
 COLDWAR_NAVY_DDR_large_ship_drydocks:0 "Wolgast Repair Slips"
 COLDWAR_NAVY_DDR_large_ship_drydocks_desc:0 "Wolgast's repair facilities must accommodate the hulls and machinery actually used by the Volksmarine. Suitable slips, lifting equipment and workshops would reduce the time coastal vessels spend waiting for work. Expanding this practical repair capacity would support the fleet as its newer classes place greater demands on the yards."
 COLDWAR_NAVY_DDR_capacity_large_ship_drydocks_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_DDR_funded_large_ship_drydocks_tt:0 "Treasury: $[?treasury|5] billion; required: $[?COLDWAR_NAVY_DDR_yard_quote|5] billion."
 COLDWAR_NAVY_DDR_improved_repair_facilities:0 "Flotilla Repair Depots"
 COLDWAR_NAVY_DDR_improved_repair_facilities_desc:0 "A small fleet loses an appreciable share of its strength when several boats wait for the same technicians or components. Shore repair depots need common spares, technical records and teams familiar with the flotillas' equipment. A stronger support network would help crews maintain their vessels and return them to duty more promptly."
 COLDWAR_NAVY_DDR_vessel_production:0 "Coastal Ship Series"
 COLDWAR_NAVY_DDR_vessel_production_desc:0 "Standardised minesweepers, escorts and landing craft allow a small shipbuilding industry to accumulate experience with each completed vessel. Stable orders also help the flotillas prepare crews, spare parts and training. Organising coastal shipbuilding into dependable series would connect industrial work more closely to the Volksmarine's operational needs."
 COLDWAR_NAVY_DDR_composite_industrial_expansion:0 "Hull Materials Bureau"
 COLDWAR_NAVY_DDR_composite_industrial_expansion_desc:0 "Reliable hull construction begins with steel quality, sound welding and protection against the effects of salt water. Mine countermeasures also make a vessel's magnetic characteristics a practical concern. The republic's yards and materials specialists will improve conventional construction and maintenance standards for boats expected to serve repeatedly in coastal waters."
 COLDWAR_NAVY_DDR_weapon_conversion_packages:0 "Military Supply Refits"
 COLDWAR_NAVY_DDR_weapon_conversion_packages_desc:0 "The Volksmarine draws on enterprises that also supply the National People's Army. Common conversion packages and workshop standards can improve the reuse of military equipment and support factory production, keeping the coastal service's stores connected to the republic's wider defence industry."
 COLDWAR_NAVY_DDR_naval_doctrine_expertise:0 "Flotilla Staff Schools"
 COLDWAR_NAVY_DDR_naval_doctrine_expertise_desc:0 "The fast craft at Dranske and the mixed forces at Peenemünde and Warnemünde require staffs able to coordinate very different tasks. Navigation, signals and the timing of movements matter as much as weapons practice in restricted waters. Better flotilla staff education would improve cooperation between commanders and the shore services on which they depend."
 COLDWAR_NAVY_DDR_convoy_and_freighter_production:0 "Baltic Merchant Routes"
 COLDWAR_NAVY_DDR_convoy_and_freighter_production_desc:0 "Rostock's commercial fleet carries goods on which the republic's industry and foreign trade depend. Its work shares ports, repair services and trained seamen with the wider maritime economy. Better arrangements for freighters and coastal transport would help protect dependable supply through the Baltic while preserving the needs of commercial shipping."
 COLDWAR_NAVY_DDR_establish_a_marine_corps:0 "Landing Support Units"
 COLDWAR_NAVY_DDR_establish_a_marine_corps_desc:0 "Landing vessels and naval support detachments can move troops, vehicles and engineering stores along the Baltic coast. Their effectiveness depends on cooperation with army units and the shore organisations receiving them. Dedicated landing-support training would give these operations a practical place in the republic's coastal defence planning."
 COLDWAR_NAVY_DDR_stealth_ships:0 "Coastal Sensor Network"
 COLDWAR_NAVY_DDR_stealth_ships_desc:0 "Coastal radar, radio reports and hydrographic knowledge help the Volksmarine distinguish useful contacts from the traffic of a busy sea. Sonar and communications specialists must connect that information with ships operating near the coast. Improving this sensor network would give commanders a more reliable basis for patrol, escort and antisubmarine work."
 COLDWAR_NAVY_DDR_shortcut:0 "Naval Development"
 COLDWAR_NAVY_IRQ_naval_reform:0 "Iraqi Coastal Command"
 COLDWAR_NAVY_IRQ_naval_reform_desc:0 "Iraq's narrow Gulf frontage makes competent coastal command more valuable than an impressive fleet list. The navy can build on its maintenance organisation to coordinate patrols, harbour watches and the protection of the approaches to Basrah and Umm Qasr."
 COLDWAR_NAVY_IRQ_combined_military_defense_industries:0 "Naval Supply Workshops"
 COLDWAR_NAVY_IRQ_combined_military_defense_industries_desc:0 "Naval stores compete with the army and air force for weapons, spare parts and skilled labour. Dedicated supply workshops can standardise orders and repair common equipment while retaining the wider military production needed to sustain these contracts."
 COLDWAR_NAVY_IRQ_capacity_combined_military_defense_industries_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_IRQ_naval_bases:0 "Umm Qasr Berths"
 COLDWAR_NAVY_IRQ_naval_bases_desc:0 "Umm Qasr offers Iraq a maritime outlet beyond the crowded river port at Basrah. Better berths and shore services can support a modest coastal force, provided investment remains matched to the harbour's capacity and the crews available to use it."
 COLDWAR_NAVY_IRQ_capacity_naval_bases_tt:0 "An owned and controlled coastal province has room for one naval-base level."
 COLDWAR_NAVY_IRQ_funded_naval_bases_tt:0 "Treasury: $[?treasury|5] billion; required: $[?COLDWAR_NAVY_IRQ_port_quote|5] billion."
 COLDWAR_NAVY_IRQ_surface_ships:0 "Gulf Patrol Craft"
 COLDWAR_NAVY_IRQ_surface_ships_desc:0 "Patrol craft and small surface combatants suit the distances and confined waters of the northern Gulf. Naval designers and officers should concentrate on reliable machinery, practical armament and hulls that Iraqi shore facilities can maintain."
 COLDWAR_NAVY_IRQ_dockyards:0 "Basrah Coastal Yards"
 COLDWAR_NAVY_IRQ_dockyards_desc:0 "A coastal force cannot depend entirely on distant repair schedules. Expanding yard capacity around Basrah gives the navy a domestic base for routine work and creates a foundation for more demanding construction when trained workers and orders become available."
 COLDWAR_NAVY_IRQ_capacity_dockyards_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_IRQ_funded_dockyards_tt:0 "Treasury: $[?treasury|5] billion; required: $[?COLDWAR_NAVY_IRQ_yard_quote|5] billion."
 COLDWAR_NAVY_IRQ_naval_doctrine_innovations:0 "Gulf Seamanship School"
 COLDWAR_NAVY_IRQ_naval_doctrine_innovations_desc:0 "Reliable navigation, signals and watchkeeping are the foundations of operations in restricted waters. A Gulf seamanship school can turn individual experience into common procedures for the navy's crews and junior officers."
 COLDWAR_NAVY_IRQ_large_ship_drydocks:0 "Coastal Service Yards"
 COLDWAR_NAVY_IRQ_large_ship_drydocks_desc:0 "Service yards must grow with the vessels they are expected to support. Further coastal yard investment can reduce the pressure on existing facilities and prepare workshops for heavier maintenance without committing Iraq to an oceanic fleet."
 COLDWAR_NAVY_IRQ_capacity_large_ship_drydocks_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_IRQ_funded_large_ship_drydocks_tt:0 "Treasury: $[?treasury|5] billion; required: $[?COLDWAR_NAVY_IRQ_yard_quote|5] billion."
 COLDWAR_NAVY_IRQ_improved_repair_facilities:0 "Fleet Repair Programme"
 COLDWAR_NAVY_IRQ_improved_repair_facilities_desc:0 "Machine tools alone will not keep a fleet ready. Planned maintenance periods, spare-parts records and trained repair teams can shorten avoidable delays and make better use of the navy's shore establishments."
 COLDWAR_NAVY_IRQ_vessel_production:0 "Standard Coastal Hulls"
 COLDWAR_NAVY_IRQ_vessel_production_desc:0 "A limited range of coastal hulls is easier to build and maintain than a collection of unrelated designs. Common fittings and production schedules can help Iraqi yards translate naval orders into consistent work."
 COLDWAR_NAVY_IRQ_composite_industrial_expansion:0 "Naval Materials Study"
 COLDWAR_NAVY_IRQ_composite_industrial_expansion_desc:0 "Salt water, heat and repeated maintenance place demanding conditions on naval materials. A focused research programme can study corrosion protection, marine fittings and hull construction methods suited to the capacity of Iraqi industry."
 COLDWAR_NAVY_IRQ_weapon_conversion_packages:0 "Refit the Naval Stores"
 COLDWAR_NAVY_IRQ_weapon_conversion_packages_desc:0 "Existing military stores contain equipment that can be repaired or adapted before another purchase is ordered. Standard conversion packages and clear workshop instructions can reduce waste across the naval supply system and the wider armed forces."
 COLDWAR_NAVY_IRQ_naval_doctrine_expertise:0 "Coastal Staff Exercises"
 COLDWAR_NAVY_IRQ_naval_doctrine_expertise_desc:0 "Coastal command needs officers who can coordinate patrols, air reports and harbour movements under pressure. Staff exercises can test these arrangements and turn lessons from the northern Gulf into a more coherent operating doctrine."
 COLDWAR_NAVY_IRQ_convoy_and_freighter_production:0 "Iraqi Merchant Shipping"
 COLDWAR_NAVY_IRQ_convoy_and_freighter_production_desc:0 "Merchant shipping connects Iraqi production and imports to markets beyond the Gulf. Closer work between shipbuilders, port authorities and commercial operators can encourage practical freighter designs and more regular orders for the maritime industry."
 COLDWAR_NAVY_IRQ_establish_a_marine_corps:0 "Naval Boarding School"
 COLDWAR_NAVY_IRQ_establish_a_marine_corps_desc:0 "Boarding parties and shore detachments need training beyond ordinary shipboard duties. A naval school can prepare small units to secure harbour installations, inspect vessels and support limited coastal landings alongside the army."
 COLDWAR_NAVY_IRQ_stealth_ships:0 "Gulf Sensor Trials"
 COLDWAR_NAVY_IRQ_stealth_ships_desc:0 "Radar, sonar and radio reports can give Iraq's coastal command earlier warning of movements in the northern Gulf. Technical study and practical trials should concentrate on equipment that crews and shore workshops can maintain. Better sensor procedures would help patrol craft identify contacts and coordinate their response."
 COLDWAR_NAVY_IRQ_shortcut:0 "Naval Development"
 COLDWAR_NAVY_SOV_naval_reform:0 "Naval Construction Plan"
 COLDWAR_NAVY_SOV_naval_reform_desc:0 "Gorshkov's fleet programme asks the Soviet state to support an enduring presence beyond its home seas. The Council of Ministers must reconcile naval orders with the demands of the army and the civilian plan. A coordinated construction programme would give the yards dependable priorities and the fleets a clearer basis for training and maintenance."
 COLDWAR_NAVY_SOV_combined_military_defense_industries:0 "Naval Industry Links"
 COLDWAR_NAVY_SOV_combined_military_defense_industries_desc:0 "Naval construction depends on ministries responsible for engines, electrical equipment, weapons and precision instruments. Separate production plans can leave an expensive hull waiting for a single missing component. Closer coordination between the yards and their suppliers would make naval orders a more coherent part of the defence-industrial programme."
 COLDWAR_NAVY_SOV_capacity_combined_military_defense_industries_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_SOV_naval_bases:0 "Fleet Support Bases"
 COLDWAR_NAVY_SOV_naval_bases_desc:0 "The Northern, Baltic, Black Sea and Pacific fleets operate across very different distances and climates. Quays, stores and workshops determine how long their ships can remain useful between deployments. Expanding support facilities on Soviet territory would reduce dependence on crowded main bases and improve the handling of supplies and returning vessels."
 COLDWAR_NAVY_SOV_capacity_naval_bases_tt:0 "An owned and controlled coastal province has room for one naval-base level."
 COLDWAR_NAVY_SOV_funded_naval_bases_tt:0 "Treasury: $[?treasury|5] billion; required: $[?COLDWAR_NAVY_SOV_port_quote|5] billion."
 COLDWAR_NAVY_SOV_submarines:0 "Undersea Operations"
 COLDWAR_NAVY_SOV_submarines_desc:0 "Soviet submarines serve several purposes: threatening surface forces, searching for enemy boats and carrying part of the strategic deterrent. These missions require different patrol methods and a common foundation of sound engineering and trained crews. The naval staff will organise undersea development around those operational needs rather than hull numbers alone."
 COLDWAR_NAVY_SOV_surface_ships:0 "Missile Surface Forces"
 COLDWAR_NAVY_SOV_surface_ships_desc:0 "Guided missiles give Soviet cruisers and escorts a powerful role against hostile surface formations. Their effectiveness still depends on reconnaissance, air defence and the ability to protect accompanying ships. A coordinated surface-force programme would join those functions and establish a clearer place for each vessel in the fleet's battle plan."
 COLDWAR_NAVY_SOV_dockyards:0 "Naval Yard Expansion"
 COLDWAR_NAVY_SOV_dockyards_desc:0 "Leningrad, Severodvinsk and the Pacific yards draw on skilled labour and machinery also needed elsewhere in the Soviet economy. Additional naval capacity requires more than assigning another construction order. The industrial ministries must provide workshops, reliable deliveries and the facilities needed to turn planned tonnage into serviceable ships."
 COLDWAR_NAVY_SOV_capacity_dockyards_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_SOV_funded_dockyards_tt:0 "Treasury: $[?treasury|5] billion; required: $[?COLDWAR_NAVY_SOV_yard_2_quote|5] billion."
 COLDWAR_NAVY_SOV_nuclear_submarines:0 "Nuclear Boat Building"
 COLDWAR_NAVY_SOV_nuclear_submarines_desc:0 "Nuclear propulsion has already changed the endurance and responsibilities of the Soviet submarine service. Reactor compartments, specialised machinery and qualified maintenance crews impose exacting demands on the yards. Expanding this industrial base would support further nuclear boats while committing the state to their training, safety and upkeep."
 COLDWAR_NAVY_SOV_naval_doctrine_innovations:0 "Operational Fleet Study"
 COLDWAR_NAVY_SOV_naval_doctrine_innovations_desc:0 "Operations involving four fleets require a common language between headquarters, naval aviation and ships at sea. Large exercises can reveal failures in communications and reconnaissance that individual formations seldom encounter. The General Staff and naval command will turn those lessons into practical methods for coordinating dispersed forces."
 COLDWAR_NAVY_SOV_aircraft_carriers:0 "Aircraft-Carrying Ships"
 COLDWAR_NAVY_SOV_aircraft_carriers_desc:0 "An aircraft-carrying cruiser programme would extend Soviet aviation beyond the reach of shore bases. Such ships would require suitable aircraft, deck crews and escorts as well as a major commitment from the shipbuilding industry. The naval leadership must decide how this new capability would complement its missile ships and submarines."
 COLDWAR_NAVY_SOV_light_helicopter_operators:0 "Helicopter Cruisers"
 COLDWAR_NAVY_SOV_light_helicopter_operators_desc:0 "The helicopter cruisers Moskva and Leningrad give the fleet a means of carrying antisubmarine aircraft with its surface formations. Their employment depends on flight-deck procedures, maintenance and cooperation with escorts. Further study of helicopter operations would develop that institution and clarify the tasks these ships can sustain at sea."
 COLDWAR_NAVY_SOV_large_ship_drydocks:0 "Major Refit Docks"
 COLDWAR_NAVY_SOV_large_ship_drydocks_desc:0 "Large combatants and nuclear vessels place demands on repair facilities that ordinary commercial berths cannot meet. Heavy lifting equipment, secure workshops and suitable docks must accompany the building programme. Expanding major refit capacity would help the fleets recover availability as their more complex ships enter service."
 COLDWAR_NAVY_SOV_capacity_large_ship_drydocks_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_SOV_funded_large_ship_drydocks_tt:0 "Treasury: $[?treasury|5] billion; required: $[?COLDWAR_NAVY_SOV_yard_quote|5] billion."
 COLDWAR_NAVY_SOV_improved_repair_facilities:0 "Fleet Repair Depots"
 COLDWAR_NAVY_SOV_improved_repair_facilities_desc:0 "Long distances between Soviet fleet bases make small machinery failures costly when specialist repair is available only at a few yards. Fleet repair depots need trained technicians, standard spares and access to technical drawings. Strengthening this network would return damaged or worn vessels to useful service more reliably."
 COLDWAR_NAVY_SOV_vessel_production:0 "Series Shipbuilding"
 COLDWAR_NAVY_SOV_vessel_production_desc:0 "Repeated construction of related hulls allows Soviet yards to improve their methods and prepare common stores of machinery and fittings. Frequent changes of specification can consume that advantage. A programme of organised production series would give designers and fleet representatives a firmer basis for balancing improvements against dependable delivery."
 COLDWAR_NAVY_SOV_composite_industrial_expansion:0 "Naval Materials Bureau"
 COLDWAR_NAVY_SOV_composite_industrial_expansion_desc:0 "Pressure hulls, machinery foundations and seawater systems require dependable steel, careful welding and effective protection against corrosion. The naval materials bureaux must work with mills and yards to improve those conventional processes. Better standards and inspection would support longer service and more consistent construction across the Soviet shipbuilding industry."
 COLDWAR_NAVY_SOV_weapon_conversion_packages:0 "Arsenal Conversion"
 COLDWAR_NAVY_SOV_weapon_conversion_packages_desc:0 "Soviet naval arsenals share weapons, tools and production resources with the wider defence industry. Standard conversion instructions and coordinated workshop orders can make better use of existing equipment while increasing military factory output during a concentrated modernisation programme."
 COLDWAR_NAVY_SOV_naval_doctrine_expertise:0 "Fleet Staff Training"
 COLDWAR_NAVY_SOV_naval_doctrine_expertise_desc:0 "A fleet able to disperse across several seas needs commanders who can interpret orders when contact with headquarters is uncertain. Staff education must connect reconnaissance, logistics and the employment of different ship types. Expanded command training would give the naval service a stronger professional foundation for sustained operations."
 COLDWAR_NAVY_SOV_convoy_and_freighter_production:0 "Merchant Fleet Plans"
 COLDWAR_NAVY_SOV_convoy_and_freighter_production_desc:0 "The Ministry of the Merchant Marine carries the Union's foreign trade and supplies distant ports through a fleet with its own commercial obligations. Naval planners need reliable transport as overseas activity grows. Cooperation over freighters, repair schedules and reserve capacity would strengthen maritime supply while placing further demands on civilian shipping."
 COLDWAR_NAVY_SOV_establish_a_marine_corps:0 "Naval Infantry Support"
 COLDWAR_NAVY_SOV_establish_a_marine_corps_desc:0 "Soviet naval infantry provides forces for securing coastal positions and supporting operations from the sea. Its work depends on landing craft, engineers, communications and cooperation with the fleet. Developing those supporting institutions would make amphibious training a more practical part of naval planning and improve the handling of troops and stores ashore."
 COLDWAR_NAVY_SOV_submarine_expansion_project:0 "Submarine Yard Plans"
 COLDWAR_NAVY_SOV_submarine_expansion_project_desc:0 "Submarine construction needs specialised workshops and careful sequencing of hull sections, machinery and weapons. The Northern and Pacific fleets also require shore organisations capable of receiving the completed boats. A coordinated yard plan would connect industrial expansion with the bases, technicians and crews needed to sustain a larger submarine force."
 COLDWAR_NAVY_SOV_stealth_ships:0 "Fleet Sensor Networks"
 COLDWAR_NAVY_SOV_stealth_ships_desc:0 "Finding an opponent at sea requires ships, aircraft and shore stations to turn separate observations into a useful picture. Soviet radar, sonar and radio specialists can improve this process through better equipment and common reporting procedures. A fleet sensor programme would strengthen reconnaissance and the exchange of information between formations."
 COLDWAR_NAVY_SOV_shortcut:0 "Naval Development"
 COLDWAR_NAVY_UAE_naval_reform:0 "Abu Dhabi Sea Wing"
 COLDWAR_NAVY_UAE_naval_reform_desc:0 "The Sea Wing of the Abu Dhabi Defence Force provides an existing foundation for a small coastal service. Better training and staff work can support patrols and harbour watches while the rulers determine how their separate security establishments should cooperate."
 COLDWAR_NAVY_UAE_combined_military_defense_industries:0 "Coastal Supply Shops"
 COLDWAR_NAVY_UAE_combined_military_defense_industries_desc:0 "A small coastal force still needs dependable weapons, tools and spare parts. Local supply workshops can serve patrol crews and the emirates' other security forces, giving military orders a practical base in the developing domestic economy."
 COLDWAR_NAVY_UAE_capacity_combined_military_defense_industries_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_UAE_naval_bases:0 "Coastal Patrol Berths"
 COLDWAR_NAVY_UAE_naval_bases_desc:0 "Patrol crews need berths, fuel and reliable contact with the shore. Improving a suitable coastal site can support these basic duties while the rulers balance maritime security against the needs of fishing, trade and harbour development."
 COLDWAR_NAVY_UAE_capacity_naval_bases_tt:0 "An owned and controlled coastal province has room for one naval-base level."
 COLDWAR_NAVY_UAE_surface_ships:0 "Gulf Patrol Craft"
 COLDWAR_NAVY_UAE_surface_ships_desc:0 "Small patrol vessels suit coastal watches, island communications and the inspection of local shipping. Technical study should favour dependable machinery and serviceable hulls over designs that exceed the resources of the shore establishments."
 COLDWAR_NAVY_UAE_dockyards:0 "Local Maritime Yards"
 COLDWAR_NAVY_UAE_dockyards_desc:0 "Local maritime yards can gradually take on work that would otherwise require vessels to leave the coast. Building this capacity creates opportunities for skilled employment while giving patrol and commercial operators more dependable support."
 COLDWAR_NAVY_UAE_capacity_dockyards_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_UAE_naval_doctrine_innovations:0 "Coastal Seamanship"
 COLDWAR_NAVY_UAE_naval_doctrine_innovations_desc:0 "Navigation, signals and disciplined watchkeeping matter as much to a patrol crew as its equipment. A coastal training programme can develop local officers and ratings around common seamanship standards."
 COLDWAR_NAVY_UAE_large_ship_drydocks:0 "Patrol Service Yards"
 COLDWAR_NAVY_UAE_large_ship_drydocks_desc:0 "As coastal services develop, their repair establishments must be able to handle more demanding work. Additional yard capacity can support heavier maintenance and future orders without assuming that a large battle fleet is already available."
 COLDWAR_NAVY_UAE_capacity_large_ship_drydocks_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_UAE_improved_repair_facilities:0 "Patrol Repair Plan"
 COLDWAR_NAVY_UAE_improved_repair_facilities_desc:0 "Patrol schedules are easily disrupted when tools, spare parts and technicians are scattered between establishments. A coordinated repair programme can improve maintenance routines and make existing workshops more effective."
 COLDWAR_NAVY_UAE_vessel_production:0 "Standard Coastal Hulls"
 COLDWAR_NAVY_UAE_vessel_production_desc:0 "Common hulls and fittings can keep a small maritime industry from being overwhelmed by unrelated orders. Standard construction practices offer a sounder basis for local work than an ambitious catalogue of specialist warships."
 COLDWAR_NAVY_UAE_composite_industrial_expansion:0 "Marine Materials Study"
 COLDWAR_NAVY_UAE_composite_industrial_expansion_desc:0 "Heat, salt water and frequent coastal service place heavy demands on vessels and their equipment. Applied study of marine materials, corrosion protection and construction methods can help local workshops build durable expertise."
 COLDWAR_NAVY_UAE_weapon_conversion_packages:0 "Coastal Stores Refits"
 COLDWAR_NAVY_UAE_weapon_conversion_packages_desc:0 "The coastal service and the emirates' security forces can make better use of their stores through common repair and conversion instructions. Refitting serviceable equipment gives workshops useful work while reducing avoidable replacement orders."
 COLDWAR_NAVY_UAE_naval_doctrine_expertise:0 "Coastal Staff Exercises"
 COLDWAR_NAVY_UAE_naval_doctrine_expertise_desc:0 "Coastal officers must coordinate shipping reports, patrol movements and assistance to the islands. Regular staff exercises can establish working arrangements between participating emirates without assuming that their forces have already been formally unified."
 COLDWAR_NAVY_UAE_convoy_and_freighter_production:0 "Merchant Shipping Links"
 COLDWAR_NAVY_UAE_convoy_and_freighter_production_desc:0 "The coast's commercial future depends on dependable links between local ports and overseas markets. Cooperation with merchant operators can encourage practical cargo-vessel construction and strengthen the maritime industry alongside fishing and traditional dhow trades."
 COLDWAR_NAVY_UAE_establish_a_marine_corps:0 "Coastal Boarding School"
 COLDWAR_NAVY_UAE_establish_a_marine_corps_desc:0 "Vessel inspections, harbour security and work along the shoreline require trained small detachments. A boarding school can prepare personnel for these duties and limited coastal landings while drawing on the experience of the existing security forces."
 COLDWAR_NAVY_UAE_stealth_ships:0 "Patrol Sensor Trials"
 COLDWAR_NAVY_UAE_stealth_ships_desc:0 "Coastal observation depends on reliable radar, radio contact and reports from vessels at sea. The Sea Wing can develop these skills through technical study and trials suited to a small patrol service. Better reporting and detection would help crews distinguish ordinary shipping from threats around the islands and harbour approaches."
 COLDWAR_NAVY_UAE_shortcut:0 "Naval Development"
 COLDWAR_NAVY_USA_naval_reform:0 "Fleet Modernisation"
 COLDWAR_NAVY_USA_naval_reform_desc:0 "The United States Navy must reconcile worldwide commitments with the cost of renewing its ships. A common modernisation programme can turn the chosen fleet strategy into practical standards for procurement, training and maintenance, while keeping today's deployments from consuming every resource intended for the next generation."
 COLDWAR_NAVY_USA_combined_military_defense_industries:0 "Naval Suppliers"
 COLDWAR_NAVY_USA_combined_military_defense_industries_desc:0 "American shipbuilders depend on a broad network of machinery firms, electronics suppliers and ordnance manufacturers. Bringing their contracts into closer alignment can improve naval production and preserve skills shared with the other services, without treating every shipyard as an isolated procurement programme."
 COLDWAR_NAVY_USA_capacity_combined_military_defense_industries_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_USA_naval_bases:0 "Fleet Bases"
 COLDWAR_NAVY_USA_naval_bases_desc:0 "The Atlantic and Pacific fleets need shore facilities capable of supporting sustained operations. Improving an available American naval base will strengthen the repair, supply and training network behind those deployments. Expansion must be matched to the capacity of the port and the funds Congress can provide."
 COLDWAR_NAVY_USA_capacity_naval_bases_tt:0 "An owned and controlled coastal province has room for one naval-base level."
 COLDWAR_NAVY_USA_funded_naval_bases_tt:0 "Treasury: $[?treasury|5] billion; required: $[?COLDWAR_NAVY_USA_port_quote|5] billion."
 COLDWAR_NAVY_USA_submarines:0 "Attack Submarines"
 COLDWAR_NAVY_USA_submarines_desc:0 "American attack submarines protect the fleet, watch Soviet movements and contest the approaches to the major sea lanes. Research should improve their ability to find opposing submarines and remain effective on long deployments, rather than relying on the number of hulls alone."
 COLDWAR_NAVY_USA_surface_ships:0 "Escort Ships"
 COLDWAR_NAVY_USA_surface_ships_desc:0 "Escort ships carry much of the burden of antisubmarine screening, air defence and routine overseas presence. A coherent surface-combatant programme can improve their designs and equipment while giving American yards a more dependable sequence of work."
 COLDWAR_NAVY_USA_dockyards:0 "Naval Shipyards"
 COLDWAR_NAVY_USA_dockyards_desc:0 "Fleet renewal requires skilled shipbuilding labour and a reliable flow of orders. Expanding American yard capacity will support new construction alongside overhaul work, but these facilities represent a substantial investment before another ship can enter service."
 COLDWAR_NAVY_USA_capacity_dockyards_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_USA_funded_dockyards_tt:0 "Treasury: $[?treasury|5] billion; required: $[?COLDWAR_NAVY_USA_yard_2_quote|5] billion."
 COLDWAR_NAVY_USA_nuclear_submarines:0 "Nuclear Propulsion"
 COLDWAR_NAVY_USA_nuclear_submarines_desc:0 "Nuclear propulsion gives the submarine force the endurance needed for oceanic operations. American designers and naval officers should concentrate on integrating machinery, quieting and weapons into practical combat systems, with demanding standards for crews and maintenance organisations."
 COLDWAR_NAVY_USA_naval_doctrine_innovations:0 "Fleet Doctrine"
 COLDWAR_NAVY_USA_naval_doctrine_innovations_desc:0 "Sea control and forward operations depend on more than the performance of individual ships. The fleet needs a doctrine that coordinates escorts, submarines, aircraft and supporting forces, and gives commanders a common understanding of how those elements should fight together."
 COLDWAR_NAVY_USA_aircraft_carriers:0 "Fleet Carriers"
 COLDWAR_NAVY_USA_aircraft_carriers_desc:0 "Large fleet carriers combine striking power, air defence and the ability to sustain operations far from American shores. Concentrating naval aviation development on these ships will preserve a powerful centre for the fleet, at the expense of pursuing the competing light-deck programme with equal intensity."
 COLDWAR_NAVY_USA_light_helicopter_operators:0 "Sea Control Ships"
 COLDWAR_NAVY_USA_light_helicopter_operators_desc:0 "Smaller aviation ships offer another way to provide antisubmarine coverage and limited air support across wide sea lanes. A sea-control ship programme would emphasise distributed coverage and a less elaborate flight deck, while accepting the smaller air group and capability of each vessel."
 COLDWAR_NAVY_USA_large_ship_drydocks:0 "Capital Ship Docks"
 COLDWAR_NAVY_USA_large_ship_drydocks_desc:0 "American capital ships require docks, cranes and shore services proportionate to their size. Enlarging the available industrial base for heavy naval work can relieve pressure on existing yards and make the chosen aviation-ship programme easier to sustain."
 COLDWAR_NAVY_USA_capacity_large_ship_drydocks_tt:0 "An owned and controlled state has capacity for the complete industrial project."
 COLDWAR_NAVY_USA_funded_large_ship_drydocks_tt:0 "Treasury: $[?treasury|5] billion; required: $[?COLDWAR_NAVY_USA_yard_quote|5] billion."
 COLDWAR_NAVY_USA_improved_repair_facilities:0 "Fleet Repair Yards"
 COLDWAR_NAVY_USA_improved_repair_facilities_desc:0 "A fleet that spends too long awaiting repairs loses effective strength without losing a ship. Better scheduling, workshops and spare-parts arrangements can return American vessels to service more quickly during a concentrated period of overhaul work."
 COLDWAR_NAVY_USA_vessel_production:0 "Shipbuilding Drive"
 COLDWAR_NAVY_USA_vessel_production_desc:0 "Standard construction methods and a coordinated order book can help American yards turn investment into delivered ships. A concentrated production drive will favour dependable output for a limited term, while the navy and industry work through the demands of fleet renewal."
 COLDWAR_NAVY_USA_composite_industrial_expansion:0 "Naval Materials"
 COLDWAR_NAVY_USA_composite_industrial_expansion_desc:0 "Hull construction, machinery foundations and protective structures place different demands on naval materials. A research programme linking American yards with industrial laboratories can improve fabrication, corrosion protection and marine engineering. More dependable materials and standards would help the fleet sustain its construction and refit programme."
 COLDWAR_NAVY_USA_weapon_conversion_packages:0 "Standardised Refit"
 COLDWAR_NAVY_USA_weapon_conversion_packages_desc:0 "American naval support draws on many of the same workshops and supply chains as the other services. Standardised conversion packages and common production methods can make better use of that industrial capacity during a defined programme of modernisation."
 COLDWAR_NAVY_USA_naval_doctrine_expertise:0 "Fleet Exercises"
 COLDWAR_NAVY_USA_naval_doctrine_expertise_desc:0 "Fleet exercises expose the gaps between doctrine and the conditions commanders meet at sea. Repeated practice with escorts, aviation and undersea forces can turn new tactical ideas into experience that the American fleet can use on deployment."
 COLDWAR_NAVY_USA_convoy_and_freighter_production:0 "Merchant Marine"
 COLDWAR_NAVY_USA_convoy_and_freighter_production_desc:0 "The United States depends on merchant shipping to sustain overseas forces and move essential supplies. More efficient convoy and freighter production strengthens the transport base behind the fleet, giving military plans a firmer connection to the ships needed to carry them out."
 COLDWAR_NAVY_USA_establish_a_marine_corps:0 "Fleet Marine Force"
 COLDWAR_NAVY_USA_establish_a_marine_corps_desc:0 "The Fleet Marine Force gives the United States an established amphibious capability. Naval training, landing procedures and supply arrangements must connect Marine formations with the ships supporting them. Closer integration will strengthen the fleet's ability to move and sustain troops ashore."
 COLDWAR_NAVY_USA_submarine_expansion_project:0 "Undersea Patrols"
 COLDWAR_NAVY_USA_submarine_expansion_project_desc:0 "Undersea patrols demand suitable boats, trained commanders and a shared tactical understanding. A further development programme can improve American submarine designs while refining the methods used to escort friendly forces and challenge opposing naval movements."
 COLDWAR_NAVY_USA_stealth_ships:0 "Electronic Warfare"
 COLDWAR_NAVY_USA_stealth_ships_desc:0 "Radar, sonar and electronic support increasingly shape the contest at sea. American naval laboratories and fleet specialists can improve detection, communications and the protection of ships against enemy sensors and weapons. Practical trials will help commands integrate those systems into operations and decide where further development is warranted."
 COLDWAR_NAVY_USA_shortcut:0 "Naval Development"
