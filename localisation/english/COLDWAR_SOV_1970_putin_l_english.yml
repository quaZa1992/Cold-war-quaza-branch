# IMPERIA CW — Cold War: SOV 1970 putin — English localisation.
 # COLDWAR | Soviet Union 1970: Vladimir Putin, KGB operative
 COLDWAR_SOV_putin.1.t:0 "A New Recruit in Leningrad"
 COLDWAR_SOV_putin.1.d:0 "Summer 1975. The Leningrad directorate of the Committee for State Security has finished vetting this year's graduates of the law faculty at Leningrad State University. One file stands out: §YVladimir Vladimirovich Putin§!, 22, born in Leningrad in 1952 into a family that lived through the blockade.\n\nAs a schoolboy he walked into the Big House on Liteyny Prospekt and asked how to join the service. He was told to come back with a degree and without having pushed himself forward. He did exactly that. His instructors describe a disciplined sambo and judo competitor, a good student of German, punctual, reserved and unremarkable in a crowd, which is precisely what the service values.\n\nAfter training at the 401st school in Okhta he will begin in counter-intelligence, keeping watch on foreigners in Leningrad."
 COLDWAR_SOV_putin.1.a:0 "Assign him to the Leningrad directorate."
 COLDWAR_SOV_putin_operative_tt:0 "§YVladimir Putin§! becomes available for recruitment by our intelligence agency.\nTraits: §GTough§!, §GSpy Hunter§!, §GLinguist§!\nNationalities: §YSoviet Union§!, §YGerman Democratic Republic§!"
 COLDWAR_SOV_putin_needs_agency_tt:0 "§RWe have no intelligence agency yet.§! He can only be recruited once the §YKGB§! has been established."
 COLDWAR_SOV_putin_needs_lar_tt:0 "§ROperatives require the La Résistance DLC.§!"
