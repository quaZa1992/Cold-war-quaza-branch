l_english:
# IMPERIA CW — Cold War: early at aa — English localisation.
 # MD Cold War: early AT/AA technology and equipment share their names.
 mdcw_anti_tank_1940:0 "Early Infantry Anti-Tank Weapons"
 mdcw_anti_tank_1940_short:0 "Early AT"
 mdcw_anti_tank_1940_desc:0 "Wartime portable anti-tank weapons give infantry a basic means of engaging light armour. These inexpensive weapons have limited penetration against later tanks."
 mdcw_anti_tank_1950:0 "Postwar Infantry Anti-Tank Weapons"
 mdcw_anti_tank_1950_short:0 "Postwar AT"
 mdcw_anti_tank_1950_desc:0 "Improved shoulder-fired launchers and shaped-charge ammunition increase the anti-armour capability of infantry. This equipment precedes the existing 1965 light anti-tank generation."
 mdcw_anti_air_1940:0 "Early Infantry Air Defence"
 mdcw_anti_air_1940_short:0 "Early AA"
 mdcw_anti_air_1940_desc:0 "Heavy machine guns on anti-aircraft mounts provide basic local protection against low-flying aircraft. This gun-based equipment does not require guided missiles or microchips."
 mdcw_anti_air_1950:0 "Postwar Infantry Air Defence"
 mdcw_anti_air_1950_short:0 "Postwar AA"
 mdcw_anti_air_1950_desc:0 "Improved heavy machine guns, mounts and optical sights strengthen local air defence. These conventional weapons precede the existing 1965 portable missile generation."
 mdcw_nsb_anti_air_1940:0 "$mdcw_anti_air_1940$"
 mdcw_nsb_anti_air_1940_short:0 "$mdcw_anti_air_1940_short$"
 mdcw_nsb_anti_air_1940_desc:0 "Conventional early anti-aircraft weapons, plus vehicle-mounted cannon, conventional anti-aircraft ammunition and mechanical optical guidance. Vehicle designs require separately researched chassis; this research does not grant radar or missiles."
 mdcw_nsb_anti_air_1950:0 "$mdcw_anti_air_1950$"
 mdcw_nsb_anti_air_1950_short:0 "$mdcw_anti_air_1950_short$"
 mdcw_nsb_anti_air_1950_desc:0 "Improved conventional anti-aircraft weapons and corresponding vehicle cannon and ammunition. These optically aimed systems remain less effective than native MD equipment from 1965."
