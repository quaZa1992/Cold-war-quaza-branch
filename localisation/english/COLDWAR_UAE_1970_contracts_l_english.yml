 COLDWAR_UAE_1970_contracts.1126.0:0 "Accept continued protection and replace the withdrawal schedule."
 COLDWAR_UAE_1970_contracts.1126.1:0 "Offer immediate independence with an independent friendship treaty; await the rulers' confirmation."
 COLDWAR_UAE_1970_contracts.1126.2:0 "Decline; no payment or change to the existing status."
 COLDWAR_UAE_1970_contracts.70126.t:0 "Britain's Friendship Counterproposal"
 COLDWAR_UAE_1970_contracts.70126.d:0 "Britain offers immediate handover and independent friendship instead of renewed protection. The original withdrawal timetable remains in force until the rulers accept this changed proposal."
 COLDWAR_UAE_1970_contracts.70126.0:0 "Accept immediate independence and the friendship settlement."
 COLDWAR_UAE_1970_contracts.70126.1:0 "Decline the counterproposal; keep the existing timetable."
