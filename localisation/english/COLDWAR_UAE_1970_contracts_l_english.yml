l_english:
# IMPERIA CW — Cold War: UAE 1970 contracts — English localisation.
 COLDWAR_UAE_treaty_dependence:0 "British Withdrawal Announced"
 COLDWAR_UAE_treaty_dependence_desc:0 "Britain's treaties have long placed the coast's defence and foreign relations in British hands. London's 1968 announcement that its forces will leave the Gulf by the end of 1971 has unsettled this arrangement. The seven rulers must reconcile their separate interests and prepare common institutions before the protection on which they have relied comes to an end.\n\nScheduled withdrawal: 1 December 1971."
 COLDWAR_UAE_ENG_withdrawal_announced:0 "British Withdrawal Announced"
 COLDWAR_UAE_ENG_withdrawal_announced_desc:0 "The decision announced in 1968 to withdraw British forces from the Gulf by the end of 1971 marks the approaching end of Britain's special treaty relationship with the Trucial States. Defence and diplomatic responsibilities remain during the transition, while the rulers negotiate a union capable of standing on its own. An orderly departure must balance Britain's diminishing commitments with the coast's uncertain security.\n\nScheduled withdrawal: 1 December 1971."
 COLDWAR_UAE_withdrawal_treaty:0 "Agreed British Withdrawal"
 COLDWAR_UAE_withdrawal_treaty_desc:0 "The rulers and Britain have agreed a new timetable for ending the special treaty relationship. A settled handover offers time to prepare an administration and assume responsibility for defence and foreign relations, but the approaching departure leaves little room for unresolved disputes among the emirates.\nAgreed independence: [?UAE.COLDWAR_UAE_contract_due.GetDateStringNoHourLong]."
 COLDWAR_UAE_ENG_withdrawal_treaty:0 "Agreed British Withdrawal"
 COLDWAR_UAE_ENG_withdrawal_treaty_desc:0 "Britain and the Trucial rulers have settled a revised date for the handover of defence and diplomatic responsibilities. The remaining transition must prepare the coast for independence while allowing Britain to bring its special treaty obligations to an orderly close.\nAgreed independence: [?UAE.COLDWAR_UAE_contract_due.GetDateStringNoHourLong]."
 COLDWAR_UAE_protection_compact:0 "Renewed Protection Compact"
 COLDWAR_UAE_protection_compact_desc:0 "A renewed compact preserves British responsibility for defence and foreign relations beyond the original withdrawal timetable. The rulers retain a familiar source of security and expertise, but the coast's external sovereignty remains constrained. The next review will reopen the question of how long this arrangement should endure.\nReview date: [?UAE.COLDWAR_UAE_review_due.GetDateStringNoHourLong]. Review alone does not end protection."
 COLDWAR_UAE_ENG_protection_compact:0 "Renewed Protection Compact"
 COLDWAR_UAE_ENG_protection_compact_desc:0 "A renewed compact extends Britain's protection of the Trucial coast. Continued defence and diplomatic responsibilities preserve British influence and reassure the rulers, while prolonging a commitment that the original withdrawal was intended to end.\nReview date: [?UAE.COLDWAR_UAE_review_due.GetDateStringNoHourLong]. Review alone does not end protection."
 COLDWAR_UAE_withdrawal_fulfilled:0 "Independence Agreement Fulfilled"
 COLDWAR_UAE_withdrawal_fulfilled_desc:0 "The special treaty relationship with Britain has ended. Responsibility for defence and foreign relations now rests with the coast's own authorities. Independence brings the freedom to choose new partners, alongside the burden of providing security and making cooperation among the emirates endure.\nIndependence delivered: [?UAE.COLDWAR_UAE_actual_release_date.GetDateStringNoHourLong]."
 COLDWAR_UAE_ENG_withdrawal_fulfilled:0 "Independence Agreement Fulfilled"
 COLDWAR_UAE_ENG_withdrawal_fulfilled_desc:0 "Britain's special treaty obligations on the Trucial coast have ended with the agreed handover. The withdrawal closes a long chapter of British protection in the Gulf; future cooperation must rest on agreements with independent authorities.\nIndependence delivered: [?UAE.COLDWAR_UAE_actual_release_date.GetDateStringNoHourLong]."
 COLDWAR_UAE_friendship_treaty:0 "UK–UAE Friendship Treaty"
 COLDWAR_UAE_friendship_treaty_desc:0 "An independent friendship treaty preserves useful ties with Britain after the end of protection. Consultation and technical cooperation offer continuity as local institutions develop, while defence and foreign policy remain the responsibility of the country's own government."
 COLDWAR_UAE_ENG_friendship_treaty:0 "UK–UAE Friendship Treaty"
 COLDWAR_UAE_ENG_friendship_treaty_desc:0 "A friendship treaty establishes a new basis for relations with the independent emirates. Consultation and technical cooperation maintain Britain's connections to the coast through mutual consent, after the old obligations of protection have ended."
 COLDWAR_UAE_status_federal_charter_joined:0 "A Partner in the Federal Charter"
 COLDWAR_UAE_status_federal_charter_joined_desc:0 "The government has accepted participation in the agreed representation settlement. This negotiated charter does not automatically annex its territory."
 COLDWAR_UAE_status_federal_charter_associate:0 "An Associated Charter Partner"
 COLDWAR_UAE_status_federal_charter_associate_desc:0 "The government has accepted association with the charter while retaining separate sovereignty."
 COLDWAR_UAE_contract_foreign_training:0 "The Training Agreement"
 COLDWAR_UAE_contract_foreign_training_desc:0 "The funded programme remains active for its agreed term. Government programmes require the qualifying administration."
 COLDWAR_UAE_1970_contracts.1001.t:0 "Renewing British Protection"
 COLDWAR_UAE_1970_contracts.1001.d:0 "The rulers propose replacing the announced withdrawal with continued British protection. The existing schedule remains binding until both governments agree."
 COLDWAR_UAE_1970_contracts.1001.0:0 "Accept continued protection and replace the withdrawal schedule."
 COLDWAR_UAE_1970_contracts.1001.1:0 "Offer immediate independence with an independent friendship treaty; await the rulers' confirmation."
 COLDWAR_UAE_1970_contracts.1001.2:0 "Decline; no payment or change to the existing status."
 COLDWAR_UAE_1970_contracts.70001.t:0 "Britain's Friendship Counterproposal"
 COLDWAR_UAE_1970_contracts.70001.d:0 "Britain offers immediate handover and independent friendship instead of renewed protection. The original withdrawal timetable remains in force until the rulers accept this changed proposal."
 COLDWAR_UAE_1970_contracts.70001.0:0 "Accept immediate independence and the friendship settlement."
 COLDWAR_UAE_1970_contracts.70001.1:0 "Decline the counterproposal; keep the existing timetable."
