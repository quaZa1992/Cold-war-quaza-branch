 COLDWAR_UAE_decision_reserve_deposit:0 "Deposit an Oil Reserve"
 COLDWAR_UAE_decision_reserve_deposit_desc:0 "Set aside part of the treasury as an Abu Dhabi reserve. This principal remains recorded savings until it is withdrawn or invested through a separate funded arrangement."
 COLDWAR_UAE_decision_reserve_withdraw:0 "Release the Reserve Principal"
 COLDWAR_UAE_decision_reserve_withdraw_desc:0 "Return the recorded reserve principal to the treasury. This releases existing savings once; it creates no interest or new income."
 COLDWAR_UAE_decision_oil_restraint:0 "Debate Export Restraint"
 COLDWAR_UAE_decision_oil_restraint_desc:0 "Seek an OPEC agreement on output restraint through the existing producers' vote. The agreed policy carries the oil system's existing export consequences."
 COLDWAR_UAE_1970_decisions_category:0 "Oil Policy and Reserves"
 COLDWAR_UAE_1970_decisions_category_desc:0 "Manage recorded reserve principal and participate in OPEC export policy."
