l_english:
# IMPERIA COLD WAR — Syrian bilateral treaty terms and diplomatic correspondence.
 COLDWAR_SYR_RP_foreign_office:0 "Treaty Correspondence with Damascus"
 COLDWAR_SYR_RP_foreign_office_desc:0 "The foreign ministry holds the following draft agreements for a government decision."
 COLDWAR_SYR_RP_foreign_main_tt:0 "If the original terms are accepted"
 COLDWAR_SYR_RP_foreign_counter_tt:0 "If Syria accepts the counteroffer"
 COLDWAR_SYR_RP_trade_clear_tt:0 "The signatories are at peace and have no bilateral embargoes or sanctions in force."
 COLDWAR_SYR_RP_EGY_main_SYR_spirit:0 "Cairo Staff Liaison"
 COLDWAR_SYR_RP_EGY_main_SYR_spirit_desc:0 "Syrian staff officers attend advanced courses in Cairo. Damascus maintains a permanent liaison so the two armies can coordinate planning."
 COLDWAR_SYR_RP_EGY_main_EGY_spirit:0 "Damascus Staff Liaison"
 COLDWAR_SYR_RP_EGY_main_EGY_spirit_desc:0 "Egyptian officers exchange field reports with Damascus and study Syrian exercises. Cairo assigns permanent staff to the liaison."
 COLDWAR_SYR_RP_EGY_counter_SYR_spirit:0 "Cairo Clinical Placements"
 COLDWAR_SYR_RP_EGY_counter_SYR_spirit_desc:0 "The health ministry funds places for Syrian doctors and instructors in Egyptian teaching hospitals."
 COLDWAR_SYR_RP_EGY_counter_EGY_spirit:0 "Arab Teaching Hospital Network"
 COLDWAR_SYR_RP_EGY_counter_EGY_spirit_desc:0 "Egyptian teaching hospitals pool clinical instructors and training materials with their Syrian counterparts."
 COLDWAR_SYR_RP_accept_EGY:0 "Ratify the Staff Coordination Protocol"
 COLDWAR_SYR_RP_accept_EGY_desc:0 "Cairo and Damascus exchange staff officers to align their planning cycles. The liaison requires permanent posts in each army."
 COLDWAR_SYR_RP_amend_EGY:0 "Propose the Medical Staff Exchange"
 COLDWAR_SYR_RP_amend_EGY_desc:0 "Return a draft to Damascus. Teaching hospitals accept visiting officers and physicians. Shared clinical training places a charge on the health budget."
 COLDWAR_SYR_RP_refuse_EGY:0 "Decline the Staff Coordination Protocol"
 COLDWAR_SYR_RP_refuse_EGY_desc:0 "Inform Damascus that the cabinet has declined the draft."
 COLDWAR_SYR_RP_ratify_EGY:0 "Accept the Medical Staff Exchange"
 COLDWAR_SYR_RP_ratify_EGY_desc:0 "The government of Egypt has proposed revised terms. Teaching hospitals accept visiting officers and physicians. Shared clinical training places a charge on the health budget."
 COLDWAR_SYR_RP_decline_EGY:0 "Decline the Medical Staff Exchange"
 COLDWAR_SYR_RP_decline_EGY_desc:0 "Inform Egypt that Syria declines the counteroffer."
 COLDWAR_SYR_RP_ISR_main_SYR_spirit:0 "Golan Observer Liaison"
 COLDWAR_SYR_RP_ISR_main_SYR_spirit_desc:0 "Military observers report incidents along the Golan lines. Damascus gives the liaison advance notice of changes in Syrian dispositions."
 COLDWAR_SYR_RP_ISR_main_ISR_spirit:0 "Golan Observer Liaison"
 COLDWAR_SYR_RP_ISR_main_ISR_spirit_desc:0 "Military observers report incidents along the Golan lines. Israel reduces emergency staffing while accepting restrictions on local military planning."
 COLDWAR_SYR_RP_ISR_counter_SYR_spirit:0 "Family Crossing Liaison"
 COLDWAR_SYR_RP_ISR_counter_SYR_spirit_desc:0 "Family visits let relatives deliver supplies to displaced households. The relief offices save on distribution, while civil registrars must process the permits."
 COLDWAR_SYR_RP_ISR_counter_ISR_spirit:0 "Quneitra Crossing Office"
 COLDWAR_SYR_RP_ISR_counter_ISR_spirit_desc:0 "Civilian liaison officers coordinate family visits with the Red Cross. The arrangement builds diplomatic contacts abroad and requires permanent staff at the crossing."
 COLDWAR_SYR_RP_accept_ISR:0 "Ratify the Golan Disengagement Protocol"
 COLDWAR_SYR_RP_accept_ISR_desc:0 "Observer liaison offices receive reports from the disengagement lines. Their work steadies the frontier and limits the discretion of military planners."
 COLDWAR_SYR_RP_amend_ISR:0 "Propose the Family Crossing Liaison"
 COLDWAR_SYR_RP_amend_ISR_desc:0 "Return a draft to Damascus. Civil officials verify family permits and maintain records on both sides of the crossing."
 COLDWAR_SYR_RP_refuse_ISR:0 "Decline the Golan Disengagement Protocol"
 COLDWAR_SYR_RP_refuse_ISR_desc:0 "Inform Damascus that the cabinet has declined the draft."
 COLDWAR_SYR_RP_ratify_ISR:0 "Accept the Family Crossing Liaison"
 COLDWAR_SYR_RP_ratify_ISR_desc:0 "The government of Israel has proposed revised terms. Civil officials verify family permits and maintain records on both sides of the crossing."
 COLDWAR_SYR_RP_decline_ISR:0 "Decline the Family Crossing Liaison"
 COLDWAR_SYR_RP_decline_ISR_desc:0 "Inform Israel that Syria declines the counteroffer."
 COLDWAR_SYR_RP_SOV_main_SYR_spirit:0 "Soviet Technical Mission"
 COLDWAR_SYR_RP_SOV_main_SYR_spirit_desc:0 "Soviet institutes reserve technical placements for Syrian specialists and supply training stocks. Syrian ministries pay a weekly service charge."
 COLDWAR_SYR_RP_SOV_main_SOV_spirit:0 "Syrian Technical Placements"
 COLDWAR_SYR_RP_SOV_main_SOV_spirit_desc:0 "Soviet technical institutes gain training contracts. Their engineers study the Euphrates hydroelectric project alongside Syrian counterparts."
 COLDWAR_SYR_RP_SOV_counter_SYR_spirit:0 "Civil Engineering Mission"
 COLDWAR_SYR_RP_SOV_counter_SYR_spirit_desc:0 "Visiting engineers and Soviet utility vehicles support Syrian works depots. Damascus administers the mission and pays a weekly fee."
 COLDWAR_SYR_RP_SOV_counter_SOV_spirit:0 "Euphrates Survey Detachment"
 COLDWAR_SYR_RP_SOV_counter_SOV_spirit_desc:0 "Soviet surveyors gain experience managing access roads and works depots while the export agency administers the engineering contract."
 COLDWAR_SYR_RP_accept_SOV:0 "Ratify the Technical Cooperation Treaty"
 COLDWAR_SYR_RP_accept_SOV_desc:0 "Soviet institutes reserve technical placements for Syrian specialists. Syrian ministries pay a weekly service charge for the programme."
 COLDWAR_SYR_RP_amend_SOV:0 "Propose the Civil Engineering Mission"
 COLDWAR_SYR_RP_amend_SOV_desc:0 "Return a draft to Damascus. Visiting engineers advise Syrian construction offices. Syria covers the mission fee and both governments maintain administrative staff."
 COLDWAR_SYR_RP_refuse_SOV:0 "Decline the Technical Cooperation Treaty"
 COLDWAR_SYR_RP_refuse_SOV_desc:0 "Inform Damascus that the cabinet has declined the draft."
 COLDWAR_SYR_RP_ratify_SOV:0 "Accept the Civil Engineering Mission"
 COLDWAR_SYR_RP_ratify_SOV_desc:0 "The government of the Soviet Union has proposed revised terms. Visiting engineers advise Syrian construction offices. Syria covers the mission fee and both governments maintain administrative staff."
 COLDWAR_SYR_RP_decline_SOV:0 "Decline the Civil Engineering Mission"
 COLDWAR_SYR_RP_decline_SOV_desc:0 "Inform the Soviet Union that Syria declines the counteroffer."
 COLDWAR_SYR_RP_PER_main_SYR_spirit:0 "Iranian Crude Deliveries"
 COLDWAR_SYR_RP_PER_main_SYR_spirit_desc:0 "Iran reserves crude for Syrian refineries under a weekly clearing agreement. A first delivery accompanies refinery training."
 COLDWAR_SYR_RP_PER_main_PER_spirit:0 "Syrian Oil Accounts"
 COLDWAR_SYR_RP_PER_main_PER_spirit_desc:0 "The clearing agreement secures weekly Syrian orders for Iranian crude. Export commitments divert some domestic fuel output."
 COLDWAR_SYR_RP_PER_counter_SYR_spirit:0 "Oil Barter Accounts"
 COLDWAR_SYR_RP_PER_counter_SYR_spirit_desc:0 "Damascus earmarks agricultural consignments for Iran. A first fuel delivery opens the barter account, with a smaller weekly balance payable to Iran."
 COLDWAR_SYR_RP_PER_counter_PER_spirit:0 "Levantine Produce Clearinghouse"
 COLDWAR_SYR_RP_PER_counter_PER_spirit_desc:0 "Iran receives Syrian agricultural consignments and can trial suitable crops. The oil ministry reserves part of its output for barter deliveries."
 COLDWAR_SYR_RP_accept_PER:0 "Ratify the Crude Deliveries Protocol"
 COLDWAR_SYR_RP_accept_PER_desc:0 "Iran reserves crude for Syrian refineries under a weekly clearing agreement. Iranian industry receives orders while some domestic fuel output is committed abroad."
 COLDWAR_SYR_RP_amend_PER:0 "Propose the Oil Barter Accounts"
 COLDWAR_SYR_RP_amend_PER_desc:0 "Return a draft to Damascus. The clearing offices settle part of the oil account with Syrian agricultural consignments. A smaller weekly balance remains payable to Iran."
 COLDWAR_SYR_RP_refuse_PER:0 "Decline the Crude Deliveries Protocol"
 COLDWAR_SYR_RP_refuse_PER_desc:0 "Inform Damascus that the cabinet has declined the draft."
 COLDWAR_SYR_RP_ratify_PER:0 "Accept the Oil Barter Accounts"
 COLDWAR_SYR_RP_ratify_PER_desc:0 "The government of Iran has proposed revised terms. The clearing offices settle part of the oil account with Syrian agricultural consignments. A smaller weekly balance remains payable to Iran."
 COLDWAR_SYR_RP_decline_PER:0 "Decline the Oil Barter Accounts"
 COLDWAR_SYR_RP_decline_PER_desc:0 "Inform Iran that Syria declines the counteroffer."
 COLDWAR_SYR_RP_TUR_main_SYR_spirit:0 "Euphrates Flow Commission"
 COLDWAR_SYR_RP_TUR_main_SYR_spirit_desc:0 "Joint gauges monitor releases into Syria. Syrian irrigators can plan planting against a more predictable flow."
 COLDWAR_SYR_RP_TUR_main_TUR_spirit:0 "Euphrates Water and Trade Commission"
 COLDWAR_SYR_RP_TUR_main_TUR_spirit_desc:0 "Turkey gains trade and works contracts through the river commission and accepts limits on upstream irrigation."
 COLDWAR_SYR_RP_TUR_counter_SYR_spirit:0 "Joint Drought Bulletin"
 COLDWAR_SYR_RP_TUR_counter_SYR_spirit_desc:0 "Syrian irrigation districts use Turkish hydrological readings to plan seasonal water use."
 COLDWAR_SYR_RP_TUR_counter_TUR_spirit:0 "Anatolian Basin Bulletin"
 COLDWAR_SYR_RP_TUR_counter_TUR_spirit_desc:0 "Turkish hydrologists and Syrian irrigation officials exchange seasonal readings and share field trials."
 COLDWAR_SYR_RP_accept_TUR:0 "Ratify the Euphrates Flow Protocol"
 COLDWAR_SYR_RP_accept_TUR_desc:0 "Joint gauges record releases into Syria. Syrian irrigators receive a more predictable flow while Turkey accepts limits on upstream use."
 COLDWAR_SYR_RP_amend_TUR:0 "Propose the Joint Drought Bulletin"
 COLDWAR_SYR_RP_amend_TUR_desc:0 "Return a draft to Damascus. Hydrologists exchange seasonal readings and issue a common drought bulletin for irrigation districts in both countries."
 COLDWAR_SYR_RP_refuse_TUR:0 "Decline the Euphrates Flow Protocol"
 COLDWAR_SYR_RP_refuse_TUR_desc:0 "Inform Damascus that the cabinet has declined the draft."
 COLDWAR_SYR_RP_ratify_TUR:0 "Accept the Joint Drought Bulletin"
 COLDWAR_SYR_RP_ratify_TUR_desc:0 "The government of Turkey has proposed revised terms. Hydrologists exchange seasonal readings and issue a common drought bulletin for irrigation districts in both countries."
 COLDWAR_SYR_RP_decline_TUR:0 "Decline the Joint Drought Bulletin"
 COLDWAR_SYR_RP_decline_TUR_desc:0 "Inform Turkey that Syria declines the counteroffer."
 COLDWAR_SYR_RP_cairo_staff_courses:0 "Cairo and Damascus Staff Courses"
 COLDWAR_SYR_RP_soviet_technical_placements:0 "Soviet Industrial Placements"
 COLDWAR_SYR_RP_euphrates_turbine_studies:0 "Euphrates Turbine Studies"
 COLDWAR_SYR_RP_soviet_works_depots:0 "Soviet Works Depots"
 COLDWAR_SYR_RP_euphrates_works_surveys:0 "Euphrates Works Surveys"
 COLDWAR_SYR_RP_iranian_refinery_standards:0 "Iranian Refinery Standards"
 COLDWAR_SYR_RP_levantine_crops:0 "Levantine Crop Trials"
 COLDWAR_SYR_RP_euphrates_allocation_study:0 "Euphrates Irrigation Study"
 COLDWAR_SYR_RP_euphrates_joint_survey:0 "Joint Euphrates Survey"
 COLDWAR_SYR_RP_euphrates_drought_bulletin:0 "Joint Drought Bulletin"
