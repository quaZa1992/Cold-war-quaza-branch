l_english:
 # IMPERIA COLD WAR — Turkey Security Affairs organisation.
 COLDWAR_TUR_1970_PKK_name:0 "Kurdistan Workers' Party (PKK)"
 COLDWAR_TUR_1970_PKK_case2_terms:0 "Base clearance: 30 days. Local relief: 180 days. PKK strength: -3, to a minimum of 30."
 COLDWAR_TUR_1970_PKK_funding_terms:0 "§Y$0.05bn§!: PKK aid §R+5§! for §Y180 days§!, adding §R0.5 organisation strength per month§!. Combined aid capped at §Y15§!."
 COLDWAR_TUR_1970_PKK_arms_terms:0 "§Y15 Political Power, 250 Infantry Weapons, 25 Command and Control Equipment§!: PKK organisation strength §R+3§!; aid §R+5§! for §Y180 days§!, adding §R0.5 strength per month§!. Shared aid cap: §Y15§!. Available after 15 August 1984."
 COLDWAR_TUR_1970_existing_case2_terms:0 "Intensive investigation: $0.020bn/week; organisation strength −1/month. Additional local construction −5% and workforce −2% from security restrictions. Costs 25 Political Power; 180-day commitment. Foreign support can offset progress. These are regional security cases, not military occupations."
 COLDWAR_TUR_1970_PKK_mandate_active:0 "Mandate: active"
 COLDWAR_TUR_1970_PKK_mandate_available:0 "Mandate: available"
 COLDWAR_TUR_1970_existing_case_lock:0 "Mandate: [?COLDWAR_COL_case_days|0] days remaining"
 COLDWAR_TUR_PKK.2.t:0 "The Future of the Southeast"
 COLDWAR_TUR_PKK.2.d:0 "The cabinet is considering recognition of an independent Kurdish state in Diyarbakir, Van and the Middle Euphrates. The General Staff has warned that it will not tolerate the division of the republic."
 COLDWAR_TUR_PKK.2.a:0 "Recognise independence"
 COLDWAR_TUR_PKK.2.b:0 "Keep the regions within Turkey"
 COLDWAR_TUR_PKK.3.t:0 "The Government's Response"
 COLDWAR_TUR_PKK.3.d:0 "The cabinet must settle its approach to the armed organisation and the provinces affected by the conflict."
 COLDWAR_TUR_PKK.3.a:0 "Seek regional cooperation"
 COLDWAR_TUR_PKK.3.b:0 "Authorise special operations"
 COLDWAR_TUR_PKK.3.c:0 "Pursue a political settlement"
 COLDWAR_TUR_PKK.3.x:0 "Postpone the decision"
 COLDWAR_TUR_PKK.4.t:0 "A Turkish Request for Cooperation"
 COLDWAR_TUR_PKK.4.d:0 "Ankara seeks cooperation against the PKK. Our government must decide whether to support its request."
 COLDWAR_TUR_PKK.4.a:0 "Agree to cooperate"
 COLDWAR_TUR_PKK.4.b:0 "Decline the request"
 COLDWAR_TUR_PKK.5.t:0 "The Provincial Security Briefing"
 COLDWAR_TUR_PKK.5.d:0 "The security services have presented options for the selected area. The cabinet must decide how to proceed."
 COLDWAR_TUR_PKK.5.a:0 "Use the air force"
 COLDWAR_TUR_PKK.5.b:0 "Disrupt the organisation's support"
 COLDWAR_TUR_PKK.5.c:0 "Use artillery"
 COLDWAR_TUR_PKK.5.x:0 "Take no preliminary action"
 COLDWAR_TUR_1970_PKK_assault_preview_tt:0 "Command Power: §R-35§!\nAfter 14 days: 25% each: Infantry Weapons §R-150§! and Utility Vehicles §R-25§!; §R-200§! and §R-90§!; §R-380§! and §R-135§!; or §R-460§! and §R-190§!. PKK base manpower: §G-40, -50, -60, -70, -80, -90, -100, -110, -120 or -150§! (10% each)."
 COLDWAR_TUR_1970_PKK_auto_preview_tt:0 "Command Power: §R-35§! per month. After 14 days: four independent operations, each with Infantry Weapons §R-150, -200, -380 or -460§! and Utility Vehicles §R-25, -90, -135 or -190§! (25% each). Each operation reduces PKK base manpower by §G40, 50, 60, 70, 80, 90, 100, 110, 120 or 150§! (10% each)."
 COLDWAR_TUR_1970_PKK_clear_preview_tt:0 "After 30 days: suppress the selected base for 180 days. PKK strength: -3, to a minimum of 30."
 COLDWAR_TUR_1970_PKK_independence_preview_tt:0 "On confirmation: transfer Diyarbakir (162), Van (935) and Middle Euphrates (1205) to the PKK."
 COLDWAR_TUR_PKK.8.t:0 "The General Staff Seizes Power"
 COLDWAR_TUR_PKK.8.d:0 "Armoured units have secured the ministries and communications centres. The commanders have dismissed the cabinet, suspended elections and annulled recognition of Kurdish independence. The three provinces remain within Turkey. The armed forces now govern directly."
 COLDWAR_TUR_PKK.8.a:0 "The council has assumed authority."
