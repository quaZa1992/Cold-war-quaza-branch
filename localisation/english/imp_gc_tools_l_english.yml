 d_imp_gc_tools_perf_expand: "§GShow Performance Tools§!"
 d_imp_gc_tools_perf_expand_desc: "Manual world-maintenance actions for the human Game Controller. Each action is separate and takes three days. Save the game first."
 d_imp_gc_tools_perf_collapse: "§RHide Performance Tools§!"
 d_imp_gc_perf_clear_forts: "Clear All Land and Coastal Forts"
 d_imp_gc_perf_clear_forts_desc: "In three days, set every land and coastal fort to level zero worldwide, including those of human players. Forts may be rebuilt later. This changes combat balance much more than it improves normal game speed."
 d_imp_gc_perf_trim_ai_economy: "Reduce AI Economic Buildings by 25%"
 d_imp_gc_perf_trim_ai_economy_desc: "In three days, remove approximately one quarter of each AI-controlled state's civilian factories, military factories, offices, farms and dockyards, rounded to whole levels. Player-controlled states are not touched. Repeating this action compounds the reduction and changes GDP, production and balance."
 d_imp_gc_perf_clear_ai_divisions: "Delete All AI Land Divisions"
 d_imp_gc_perf_clear_ai_divisions_desc: "In three days, delete all AI land divisions without refunding equipment. Human armies are untouched. AI countries can recruit new divisions afterwards; this is a drastic one-time performance intervention, not a permanent cap."
 d_imp_gc_perf_halve_ai_divisions: "Remove About Half of AI Land Divisions"
 d_imp_gc_perf_halve_ai_divisions_desc: "In three days, each AI land division has a 50% chance to be destroyed without refunding equipment or manpower. The exact share can vary, especially for small armies. Human divisions are untouched. AI countries may recruit replacements later."
 d_imp_gc_perf_clear_ai_equipment: "Remove All AI Equipment"
 d_imp_gc_perf_clear_ai_equipment_desc: "In three days, multiply every AI country's equipment by zero. Human countries are untouched. The engine effect does not explicitly limit this to stockpiles; it may also affect fielded equipment. AI production can replace losses over time."
 d_imp_gc_perf_halve_ai_equipment: "Reduce AI Equipment by 50%"
 d_imp_gc_perf_halve_ai_equipment_desc: "In three days, multiply every AI country's equipment by 0.5. Human countries are untouched. The engine effect does not explicitly limit this to stockpiles; it may also affect fielded equipment. Repeating this action compounds the loss."
 d_imp_gc_perf_trim_player_equipment: "Reduce Human Equipment by 25%"
 d_imp_gc_perf_trim_player_equipment_desc: "In three days, multiply every human country's equipment by 0.75, including the Game Controller if it owns equipment. The engine effect does not explicitly limit this to stockpiles; it may also affect fielded equipment. Repeating this action compounds the loss."

 d_imp_gc_tools_oil_hike_m: "Oil Price: Generic Event (+15%)"
