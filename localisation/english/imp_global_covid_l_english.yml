l_english:
 imp_global_covid_modifier: "COVID-19"
 imp_global_covid_modifier_desc: "COVID-19 is a highly contagious viral disease caused by the SARS-CoV-2 virus, primarily spreading through respiratory droplets. It leads to symptoms ranging from mild respiratory issues to severe pneumonia and organ failure, with the potential for widespread outbreaks and significant strain on healthcare systems.\nInfection Level: §R[?imp_covid_infection_level]§!"

 imp_global_covid_decisions: "COVID-19"
 imp_global_covid_decisions_desc: "A new, deadly virus has emerged, sweeping across the globe and spreading rapidly through major cities. Medical experts are working tirelessly to understand the virus, but it remains a formidable threat. Governments are struggling to contain the outbreak, while panic and fear begin to grip the population. The economy is starting to suffer as industries shut down, and supply chains are disrupted. Our nation must now decide how to respond to this global health crisis.\n\n§YThe effects of all our COVID-19 measures are combined and displayed in a single COVID-19 modifier.\n§!\nOur current infection level is at §R[?imp_covid_infection_level]§!\nOur Intensive Care units have been scaled up by §G[?imp_covid_ic_unit_expansion|%]§!.\nOur progress towards a vaccine stands at §G[?imp_covid_vaccine_progress|%]§!.\n\nWe currently have have enough vaccines to supply §Y[?imp_vaccine_storage]§! more nations and produce §G[?imp_vaccine_monthly]§! supply each month. \n\n§YOnce any nation reaches a vaccine production level of 5, COVID-19 vaccines will automatically be supplied to all nations. Even if herd immunity is achieved, access to a vaccine will still be beneficial!§!"
 
 d_imp_fund_vaccine_research: "Fund Vaccine Research"
 d_imp_fund_vaccine_research_desc: "In the face of the ongoing pandemic, our nation must allocate resources to develop a vaccine to protect the population and stop the spread of the virus. By funding vaccine research, we invest in a long-term solution that could save countless lives and stabilize our nation’s future."
 imp_cost_100: "£treasury 100"
 imp_cost_100_blocked: "§R£treasury 100§!"
 d_imp_fund_vaccine_custom_tt: "Increase our progress towards a working vaccine by 10%."
 d_imp_global_expand_vaccine_production: "Increase Vaccine Production"
 d_imp_global_expand_vaccine_production_desc: "Ramp up domestic vaccine production to meet rising demand and ensure widespread immunization."
 impcovidvaccineexpansiontt: "Increases the amount of vaccines we create every month. We can use these vaccines to supply other nations with vaccines through a diplomatic action. Once we reach a vaccine level of 5, COVID-19 will be cured globally."

 imp_COVID_vaccine_producer: "Major COVID vaccine Producer"
 imp_COVID_vaccine_producer_desc: "Our nation has become a global leader in vaccine production, supplying the world with life-saving doses and enhancing our international standing. This achievement boosts national pride and strengthens diplomatic ties, though it required significant investment in research.\n§YWill generate monthly points that can be spent on the§! §GSupply Vaccines§! §Ydiplomatic action.§!"

 IMP_DIPLOMATIC_SUPPLY_VACCINES_TITLE: "Supply Vaccines"
 IMP_DIPLOMATIC_SUPPLY_VACCINES_ACTION_DESC: "Supply a nation with COVID-19 vaccines"
 IMP_VACCINE_TRANSFER_TITLE: "Supply Vaccines"
 IMP_VACCINE_TRANSFER_ACTION_DESC: "Supply this nation with COVID-19 vaccines."
 IMP_VACCINE_TRANSFER_RECEIVE_DESC: "Are offering COVID-19 vaccines to us."
 IMP_VACCINE_TRANSFER_ACCEPT_TITLE: "Vaccine Transfer accepted"
 IMP_VACCINE_TRANSFER_ACCEPT_DESC: "They have accepted our transfer proposal."
 IMP_VACCINE_TRANSFER_REJECT_TITLE: "Vaccine Transfer Rejected"
 IMP_VACCINE_TRANSFER_REJECT_DESC: "They have rejected our transfer proposal."

 d_imp_close_borders_mini_on: "Implement Partial Travel Ban"
 d_imp_close_borders_mini_on_desc: "Restrict travel from high-risk regions to contain the spread of the virus while allowing limited movement to support essential trade and services."
 impcovidptbtt: "This will reduce infection rates but comes at the cost of economic damage and potential public discontent."
 d_imp_close_borders_maxi_on: "Implement Full Travel Ban"
 d_imp_close_borders_maxi_on_desc: "Completely close all borders to prevent the virus from entering or leaving the country, effectively isolating the nation but crippling international trade."
 impcovidftbtt: "This will drastically reduce infection rates but comes at the cost of severe economic damage and potential public discontent."
 d_imp_close_borders_off: "Lift Travel Ban"

 d_imp_gm_covid_start: "Disable COVID-19 (December 2019)"
 imp_gm_tooltip_covid_tt: "If this decision is taken, COVID-19 will NOT start in 2020."
 d_imp_gm_covid_start_on: "Enable COVID-19 (December 2019)"
 imp_gm_tooltip_covid_on_tt: "If this decision is taken, COVID-19 will start in 2020, as long as it's not yet past this date."
 d_imp_global_covid_masks_on: "Enforce Mask Mandate"
 d_imp_global_covid_masks_on_desc: "A nationwide mandate is enacted, requiring all citizens to wear masks in public spaces to reduce the spread of COVID-19. This measure aims to protect vulnerable populations and minimize airborne transmission, though it may face resistance from those opposed to the restrictions."
 d_imp_global_covid_masks_off: "Lift Mask Mandate"
 impcovidmmtt: "This will slightly reduce infection rates but comes at the cost of potential public discontent."
 
 d_imp_global_social_distancing_on: "Enforce Social Distancing"
 d_imp_global_social_distancing_on_desc: "Strict social distancing measures are put in place, limiting gatherings and requiring individuals to maintain a safe distance in public spaces to curb the spread of COVID-19. This policy aims to reduce close contact and prevent outbreaks, but it disrupts social interactions and everyday life."
 d_imp_global_social_distancing_off: "Lift Social Distancing"
 impcovidsdtt: "This will reduce infection rates but comes at the cost of economic damage and potential public discontent."

 d_imp_global_remote_work_on: "Enforce Remote Work Mandate"
 d_imp_global_remote_work_on_desc: "A nationwide mandate requires all non-essential workers to perform their jobs remotely to reduce in-person contact and slow the spread of COVID-19. While this helps limit exposure, it puts a strain on businesses that rely on physical presence and can create challenges for workers without proper home office setups."
 d_imp_global_remote_work_off: "Lift Remote Work Mandate"
 impcovidrwtt: "This will significantly reduce infection rates, but may face resistance from industries reliant on on-site work."

 d_imp_global_curfews_on: "Enforce Curfews"
 d_imp_global_curfews_on_desc: "Impose strict nighttime curfews to limit social interactions and curb the spread of the virus. While effective at reducing transmission, this measure risks public backlash and can disrupt essential nighttime activities."
 impcovidcurtt: "This will greatly reduce infection rates but may provoke public unrest and disrupt daily life."
 d_imp_global_lockdown_on: "Enforce Lockdown"
 d_imp_global_lockdown_on_desc: "Impose strict stay-at-home orders to drastically reduce the spread of the virus and protect public health. While highly effective at controlling infections, this measure will severely impact the economy and strain public morale."
 impcovidldtt: "This will massively reduce infection rates, but may provoke massive public unrest and disrupt daily life."
 d_imp_global_curfews_off: "Lift Lockdowns & Curfews"
 d_imp_global_covid_testing_on: "Implement Test & Trace Programs"
 d_imp_global_covid_testing_on_desc: "Establish widespread testing and contact tracing to quickly identify and isolate infected individuals. While crucial for controlling outbreaks, this approach requires substantial resources and may raise privacy concerns."
 d_imp_global_covid_testing_off: "Cancel Test & Trace Programs"
 impcovidtestingtt: "This will reduce infection rates, but will dramatically increase our healthcare costs."
 
 d_imp_global_covid_scale_up_ic: "Expand Intensive Care Units"
 d_imp_global_covid_scale_up_ic_desc: "Increase the number of ICU beds and medical staff to better handle a surge in severe COVID-19 cases. This will improve our ability to save lives but requires significant investment and resources that could strain other sectors."
 d_imp_global_covid_scale_down_ic: "Scale Down Intensive Care Units"
 imp_cost_10: "£treasury 10"
 imp_cost_10_blocked: "§R£treasury 10§!"
 impcovidbedstt: "Investing in IC Units will drastically reduce the amount of people die from COVID-19, but will also dramatically increase our healthcare costs."

 d_imp_global_covid_bleach: "Suggest Bleach as a Cure"
 d_imp_global_covid_bleach_desc: "What could go wrong?"

 impcovid.99.t: "Covid Spreads..."
 impcovid.100.t: "Covid Spreads..."
 impcovid.1.t: "A Scourge Awakens in Wuhan"
 impcovid.1.d: "The COVID-19 situation in Wuhan has spiraled out of control. COVID-19 cases are skyrocketing, overwhelming local hospitals and leaving authorities scrambling to respond. As infections rise throughout Hubei province, alarming reports emerge of suspected cases appearing abroad. The world watches nervously, wondering whether the virus has already begun its global march."
 impcovid.1.a: "Surely there's nothing to worry about."
 impcovid1tt: "§GThe COVID-19 Vaccine Research decision is now available in the decisions menu.§!"

 impcovid.2.t: "Markets Plunge as Fear Spreads"
 impcovid.2.d: "The first COVID-19 cases outside of China are confirmed and global markets react with panic. The realization that the virus is no longer contained is causing serious concerns for economic growth and markets have begun to retreat in response as investors are scrambling to assess the potential fallout."
 impcovid.2.a: "Oh no."

 impcovid.3.t: "Collapse in the Heartland"
 impcovid.3.d: "COVID-19 has spiraled completely out of control. Major cities are beginning to be overwhelmed with infections and our healthcare system is on the brink of collapse. The death toll is rising rapidly, and the virus shows no sign of slowing its relentless spread."
 impcovid.3.a: "That's not good"

 impcovid.4.t: "The Virus Reaches Our Shores"
 impcovid.4.d: "COVID-19 has breached our borders, with the first confirmed cases reported within our nation. Fear and uncertainty grip the population as concerns about community transmission grow. While panic sets in, businesses brace for the economic fallout. Health experts warn that this may only be the beginning, as the virus threatens to take hold and spread further."
 impcovid.4.a: "That's not good."
 impcovid4tt: "§RAdds the COVID-19 Modifier and COVID-19 protective measures are now available in the decisions menu.§!"

 impcovid.5.t: "Fear Grips the Streets"
 impcovid.5.d: "As COVID-19 spreads unchecked, fear begins to dominate daily life. Families are torn apart by illness, communities become isolated, and uncertainty hangs heavy in the air as people avoid even the simplest interactions, unsure of who might be carrying the virus. Businesses struggle to stay afloat, their doors closing as the economy falters under the weight of the crisis."
 impcovid.5.a: "This is horrible."
 impcovid5tt: "COVID-19 dilemmas will now happen regularly."

 impcovid.6.t: "The Crisis Deepens"
 impcovid.6.d: "COVID-19 has reached catastrophic levels, engulfing entire cities and leaving hospitals beyond capacity, forced to turn away the dying. Streets are eerily silent, once-bustling neighborhoods now ghost towns filled with fear and grief. Families are shattered as death becomes a daily occurrence, and entire industries collapse under the strain, leaving millions without work or hope. Society itself teeters on the brink of madness as the virus shows no sign of relenting."
 impcovid.6.a: "When will it end?"

 impcovid.7.t: "A Grim Hope"
 impcovid.7.d: "The worst of COVID-19 has passed, with the virus beginning to lose its grip on the population. Though cases still rise in some areas, a slow path to herd immunity is beginning to take shape, as many have either recovered or been exposed, but the scars left on society and the economy are deep, and the future remains uncertain."
 impcovid.7.a: "Finally."

 impcovid.8.t: "First Vaccine developed in [From.GetNameDef]"
 impcovid.8.d: "After months of global research and collaboration, the first effective COVID-19 vaccine is finally developed in [From.GetName], signalling a great victory in the fight against the pandemic. Scientists, healthcare workers, and governments unite to begin the vaccine’s distribution, offering a glimmer of hope that the virus may soon be under control. While the path to widespread immunity remains long, this breakthrough signals the potential to drastically reduce infections, ease the burden on healthcare systems, and bring society one step closer to a return to normalcy."
 impcovid.8.a: "Let us hope we get the vaccine soon."
 impcovid8tt: "Countries who control the COVID-19 vaccine may now begin distributing it to other nations through a diplomatic action."

 impcovid.9.t: "We are now a major vaccine producer"
 impcovid.9.d: "We can now use a diplomatic action to grant vaccines to other nations. We only have limited supply that is increased every month. We can increase this monthly supply through a decision."
 impcovid.9.a: "Let's get those vaccines to our friends."
 imp_has_covid_vaccine: "Already Has Vaccine"
 imp_vaccine_storage: "Amount of Vaccines"

 impcovid.10.t: "The Virus Fades Away"
 impcovid.10.d: "After years of struggle and sacrifice, we are finally reporting zero active COVID-19 cases. Streets slowly come back to life, but the joy is muted, for the scars from the pandemic remain etched into our nation's heart. Families mourn those who didn’t make it, and communities feel the weight of the years lost to fear and isolation.The government's declaration of victory feels hollow to some, as the economic aftermath and strained healthcare systems remind everyone that the fight wasn’t just against the virus but against despair itself.\n\nAs normalcy cautiously returns, the nation must decide: focus on rebuilding shattered lives and economies, or take this moment to reform healthcare and prepare for the next crisis? The virus may be gone, but the echoes of its presence linger. Moving forward will take more than just reopening doors, it will take healing a nation that has been through too much."
 impcovid.10.a: "A weary dawn breaks, and life moves on."
 impcovid.10.b: "A weary dawn breaks, and life moves on."
 impcovid.10.c: "A weary dawn breaks, and life moves on."

 impcovid.11.t: "The End of the Pandemic: A World Changed Forever"
 impcovid.11.d: "The world has finally declared itself free from COVID-19, with no active cases left anywhere. The news is met with relief, but not triumph, because much has been lost along the way. Cities slowly wake from their long sleep, yet people are cautious, as if unsure how to live normally again. The collective grief and exhaustion overshadow the celebrations.\n\nNations now face the daunting task of rebuilding lives and economies while reconciling with the memories of years filled with loss and uncertainty. One question remains: do we focus on global cooperation to ensure this never happens again, or prioritize national recovery and reflection on what went wrong?\n\nHumanity may have survived, but it has been changed. We are more cautious, perhaps wiser, but undeniably scarred. The future is uncertain, and the choices made now will determine how the world learns from one of its darkest chapters."
 impcovid.11.a: "The world sighs, and the healing begins."

 impcovid.12.t: "A Radical Cure?"
 impcovid.12.d: "During a recent press briefing, President Trump floated an unusual idea regarding the fight against COVID-19. While discussing potential treatments, he suggested that injecting disinfectant or using ultraviolet light inside the body could help eliminate the virus. Medical experts and advisors present were visibly taken aback, and the public reaction has been swift and intense.\n\nShockingly, some citizens took the President’s suggestion literally, resulting in several cases of poisoning and even fatalities. Medical professionals and disinfectant manufacturers alike have rushed to issue warnings, urging people not to attempt such dangerous methods."
 impcovid.12.a: "Someone actually listened?!"

 impcovid.13.t: "Nationwide Protests Against Lockdown Measures"
 impcovid.13.d: "Amid the ongoing pandemic, widespread frustration has boiled over into mass protests in cities across the nation. Citizens from all walks of life have taken to the streets, expressing anger over the government's handling of the crisis. Some demand the immediate lifting of lockdown measures and a return to normalcy, while others protest a lack of healthcare support, economic relief, or transparency in decision-making."
 impcovid.13.a: "Let them."
 impcovid.13.b: "Didn't we ban public gatherings?"
 impcovid.13.c: "Break it up."
 
 impcovid.14.t: "Looting in Major Cities"
 impcovid.14.d: "Chaos has erupted in major urban centers. Citizens, frustrated by government restrictions and lack of support during the pandemic, have taken to the streets. Shops are being looted, vehicles set ablaze, and law enforcement is struggling to regain control. Reports from multiple cities paint a grim picture as public order collapses in the wake of panic and desperation."
 impcovid.14.a: "There's nothing we can do."
 impcovid.14.b: "Compensate people for the damages."
 impcovid.14.c: "Let the police crack some skulls."

 impcovid.15.t: "[ROOT.GetLeader] tests positive for COVID-19"
 impcovid.15.d: "[ROOT.GetLeader] has tested positive for COVID-19. The symptoms appear mild, but the situation has raised important questions about how the government should proceed. Some advisors suggest that [ROOT.GetLeader.GetSheHe] should continue working as usual to project strength and stability. Others argue that taking a step back and quarantining would set a responsible example for the public."
 impcovid.15.a: "Quarantine right away."
 impcovid.15.b: "Keep working!"

 impcovid.16.t: "Panic Buying Sweeps the Nation"
 impcovid.16.d: "As fear and uncertainty spread, people across the country have begun panic buying essential goods. Supermarkets are being emptied within hours, and supply chains are struggling to keep up with demand. Items like toilet paper, canned food, and medical supplies are becoming scarce, leading to frustration and even occasional scuffles between desperate shoppers."
 impcovid.16.a: "Let the Market handle it."
 impcovid.16.b: "Stop people from hoarding."

 impcovid.17.t: "Conspiracy Theories Spread"
 impcovid.17.d: "As the pandemic drags on, misinformation and conspiracy theories are spreading like wildfire. Social media is flooded with claims ranging from the virus being a government hoax to bizarre theories about 5G towers causing infections. These narratives are undermining public trust in official guidelines and fueling resistance to safety measures."
 impcovid.17.a: "Ignore these people."
 impcovid.17.b: "Let's combat this disinformation."

 impcovid.18.t: "Unemployment Crisis Looms"
 impcovid.18.d: "The economic impact of the pandemic is hitting hard, and unemployment rates are skyrocketing. Businesses are shutting down, and millions of workers find themselves without a steady income. Welfare systems are struggling to keep up, and frustration is building among those who feel abandoned by the government."
 impcovid.18.a: "There's nothing we can do."
 impcovid.18.b: "Issue PPP Loans."

 impcovid.19.t: "Price Gouging on Essential Goods"
 impcovid.19.d: "With panic buying and shortages becoming more widespread, some businesses are taking advantage of the situation by dramatically raising prices on essential goods like food, medicine, and sanitizers. These price hikes are sparking outrage among the public, who feel that their struggles are being exploited by unscrupulous merchants."
 impcovid.19.a: "Let the market handle it."
 impcovid.19.b: "Start a task force and stop this."

 impcovid.20.t: "Medical Supply Shortages"
 impcovid.20.d: "As cases of COVID-19 continue to rise, we are facing a severe shortage of medical supplies, including ventilators, masks, and protective equipment for healthcare workers. Hospitals are stretched thin, and doctors are forced to make difficult decisions about resource allocation. The public is beginning to panic as they hear reports of hospitals overwhelmed by the surge in patients."
 impcovid.20.a: "There's nothing we can do."
 impcovid.20.b: "Buy supplies at any price."

 impcovid.21.t: "Economic Recession Deepens"
 impcovid.21.d: "he economy is in freefall as businesses shut down, and consumer spending drops dramatically. Unemployment is at historic levels, and the government’s attempts to stimulate the economy seem ineffective. Economic experts are warning that a prolonged recession could lead to widespread poverty and civil unrest."
 impcovid.21.a: "Oh no."

 imp_COVID_supply_chain_issues: "Supply Chain Issues"
 imp_COVID_supply_chain_issues_desc: "We are currently having Supply Chain Issues, making it harder for people to buy the things they want and need."
 imp_COVID_scars: "The Scars of COVID"
 imp_COVID_scars_desc: "The pandemic has left deep scars on the nation—economic hardship, a strained healthcare system, and widespread social unrest. The long-term effects of the crisis are still being felt across every sector of society. The road to healing will be difficult."
 d_imp_gm_covid_start_desc: "Prevents the global COVID-19 storyline from starting in December 2019."
 d_imp_gm_covid_start_on_desc: "Allows the global COVID-19 storyline to start in December 2019. It does not start immediately."
