 COLDWAR_GRE_1970_civilian_retirement_programme:0 "Negotiate Retirement and a Limited Amnesty"
 COLDWAR_GRE_1970_civilian_retirement_programme_desc:0 "The limited settlement concerns defined nonviolent or lesser participation. Torture and other serious abuses remain individually investigable; evidence, civil claims and compensation rights survive on both paths. Retirement is not innocence."
