l_english:
 COLDWAR_GRE_1970_rule_by_decree:0 "Rule by Decree"
 COLDWAR_GRE_1970_rule_by_decree_desc:0 "Suspended freedoms and decree government. Administrative coercion is not democratic legitimacy; institutional reform removes this package."
 COLDWAR_GRE_1970_security_state:0 "Censorship, Detention and Torture"
 COLDWAR_GRE_1970_security_state_desc:0 "Military courts, censorship, arbitrary detention and documented torture under the dictatorship. Victims and responsibility remain explicit; repression cannot erase the resulting grievance."
 COLDWAR_GRE_1970_politicised_officers:0 "A Politicised Officer Corps"
 COLDWAR_GRE_1970_politicised_officers_desc:0 "Personal networks, loyalty promotions and competing junta circles disrupt professional command. Not a claim that Greek soldiers are inherently ineffective."
 COLDWAR_GRE_1970_european_censure:0 "European Censure"
 COLDWAR_GRE_1970_european_censure_desc:0 "Greece left the Council of Europe on12December1969 after the Greek Case. This is not expulsion from NATO or from a nonexistent1970 EU membership."
 COLDWAR_GRE_1970_administrative_clientelism:0 "Clientelism and Fragmented Administration"
 COLDWAR_GRE_1970_administrative_clientelism_desc:0 "Fragmented administration and patronage impose costs. Audits and professional recruitment reduce these; an ethnic group never constitutes the penalty."
 COLDWAR_GRE_1970_growth_foundations:0 "Foundations of the Greek Expansion"
 COLDWAR_GRE_1970_growth_foundations_desc:0 "Industrial expansion, shipping, tourism and emigrant remittances provide real strengths in1970. Values are gameplay proposals, not measured historical growth rates."
 COLDWAR_GRE_1970_crown_in_exile:0 "A Crown in Exile"
 COLDWAR_GRE_1970_crown_in_exile_desc:0 "ConstantineII remains in exile and Zoitakis is regent inJanuary1970. A negotiated constitutional settlement or legitimate referendum can settle the issue."
 COLDWAR_GRE_1970_oil_shock:0 "Oil Import Shock"
 COLDWAR_GRE_1970_oil_shock_desc:0 "Conditional external supply/price shock, never a January1970 starting penalty. A world oil shock or actual import disruption must occur."
 COLDWAR_GRE_1970_crisis_dislocation:0 "Mobilisation and Civilian Dislocation"
 COLDWAR_GRE_1970_crisis_dislocation_desc:0 "Only actual mobilisation, fighting or displacement can activate this. Losses and humanitarian needs are recorded once, not paid for twice by overlapping systems."
 COLDWAR_GRE_1970_military_order:0 "Entrenched Military Government"
 COLDWAR_GRE_1970_military_order_desc:0 "The implemented Greek programme, subject to the current government and policy settlement."
 COLDWAR_GRE_1970_professional_compact_programme:0 "Bargain with the Service Commands"
 COLDWAR_GRE_1970_professional_compact_programme_desc:0 "Improves coordination; it does not magically remove the Politicised Officer Corps starting spirit."
 COLDWAR_GRE_1970_security_compact_programme:0 "Entrench the Security Directorate"
 COLDWAR_GRE_1970_security_compact_programme_desc:0 "This supports an Ioannidis-style internal struggle only if the domestic leadership contest actually succeeds. No extra combat bonus is attached to torture."
 COLDWAR_GRE_1970_military_development_programme:0 "Direct Credit through the Regime Banks"
 COLDWAR_GRE_1970_military_development_programme_desc:0 "The implemented Greek programme, subject to the current government and policy settlement."
 COLDWAR_GRE_1970_transition_review:0 "Negotiating the Civilian Transfer"
 COLDWAR_GRE_1970_transition_review_desc:0 "A funded, time-limited administrative and legal review. Expiry does not itself transfer power or restore rights. One active idea; restarting talks does not stack penalties."
 COLDWAR_GRE_1970_controlled_order:0 "A Supervised Civilian Cabinet"
 COLDWAR_GRE_1970_controlled_order_desc:0 "The implemented Greek programme, subject to the current government and policy settlement."
