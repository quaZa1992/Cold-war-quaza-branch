 COLDWAR_GRE_1970_pap_12:0 "Review the Investment Regime"
 COLDWAR_GRE_1970_pap_12_desc:0 "Audit the fiscal cost of the current programme. No automatic debt cancellation or free funds. Papadopoulos is the regime’s controlling figure; Markezinis can be prime minister during the 1973opening. Formal office and political control are distinct.\n\nA funded fiscal audit changes tax collection and administration; it does not delete public debt.\n\nProgramme effects:\nTax revenue: +2.5%\nEconomic project cost: -3%\n\nConditions: Nationalist military junta in office AND Papadopoulos is the actual ruling leader. Actual active regime: military_government_active OR controlled_government_active. A party label alone cannot bypass the regime path.\n\nImplementation costs 0.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions."
