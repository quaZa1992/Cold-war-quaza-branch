 COLDWAR_GRE_1970_greece_1970:0 "Greece in January 1970"
 COLDWAR_GRE_1970_greece_1970_desc:0 "Papadopoulos governs; Zoitakis is regent; Constantine II is in exile. The military regime can endure, open on its own terms, or negotiate an actual civilian transfer."
 COLDWAR_GRE_1970_state_dossier:0 "Open the State Dossier"
 COLDWAR_GRE_1970_state_dossier_desc:0 "Open the State Dossier."
 COLDWAR_GRE_1970_officer_loyalties:0 "Map the Officer Networks"
 COLDWAR_GRE_1970_officer_loyalties_desc:0 "Papadopoulos and Ioannidis represent competing circles. Mapping loyalties does not execute a coup or arrest anyone."
 COLDWAR_GRE_1970_civilian_contacts:0 "Reopen Civilian Channels"
 COLDWAR_GRE_1970_civilian_contacts_desc:0 "Sound out domestic opposition and exiles. Contact does not confer office, electoral consent or an automatic democratic mandate."
 COLDWAR_GRE_1970_economic_stocktake:0 "Take Stock of the Expansion"
 COLDWAR_GRE_1970_economic_stocktake_desc:0 "Real industrial, shipping and tourist strengths coexist with regional inequality and patronage. No fabricated starting recession."
 COLDWAR_GRE_1970_retain_junta:0 "Keep the Junta in Power"
 COLDWAR_GRE_1970_retain_junta_desc:0 "A viable alternate-history state, not a countdown to an unavoidable 1974 collapse.\n\nBenefits: Unlock a lasting military-government path and either officer compact.\n\nCosts: Retain decree rule, the coercive security apparatus and European censure."
 COLDWAR_GRE_1970_controlled_opening:0 "Open the Regime on Its Own Terms"
 COLDWAR_GRE_1970_controlled_opening_desc:0 "Papadopoulos / Markezinis is the historical reference. An earlier or successful continuation is alternate history, not an automatic 1973 event.\n\nBenefits: Negotiate selective civilian participation while preserving executive leverage.\n\nCosts: A civilian prime minister alone does not end military reserve powers or censorship."
 COLDWAR_GRE_1970_civilian_transition:0 "Hand Power to Civilian Government"
 COLDWAR_GRE_1970_civilian_transition_desc:0 "The player chooses the transition path. No Cyprus war, foreign approval, prescribed election winner or fixed 1974 collapse is required.\n\nBenefits: Open the route to free elections, accountable institutions and civilian party programmes.\n\nCosts: No military-government command package; negotiations, funded legal work and a real mandate are still required."
 COLDWAR_GRE_1970_military_compact:0 "Put the Officer Compact in Writing"
 COLDWAR_GRE_1970_military_compact_desc:0 "Put the Officer Compact in Writing.\n\nConditions: Military junta actually remains in office and the officer compact has been implemented.\n\nBenefits: Political power gain +10%; maximum planning +4% from concentrated decree authority and command preparation.\n\nCosts: Research speed -3%; police cost +5%; all four listed regime legacies remain.\n\nLasting: National regime slot: replaces every previous regime package; benefits end on civilian handover."
 COLDWAR_GRE_1970_professional_compact_programme_effects_tt:0 "Implemented programme effects:\nArmy organisation: +2%\nPolitical power gain: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_professional_compact:0 "Bargain with the Service Commands"
 COLDWAR_GRE_1970_professional_compact_desc:0 "Improves coordination; it does not magically remove the Politicised Officer Corps starting spirit.\n\nProgramme effects:\nArmy organisation: +2%\nPolitical power gain: -2%\n\nBenefits: Army organisation +2% after the shared military balance scale.\n\nCosts: Political power gain -2%; service chiefs retain bargaining power."
 COLDWAR_GRE_1970_security_compact_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +5%\nPolice cost: +6%\nStability: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_security_compact:0 "Entrench the Security Directorate"
 COLDWAR_GRE_1970_security_compact_desc:0 "This supports an Ioannidis-style internal struggle only if the domestic leadership contest actually succeeds. No extra combat bonus is attached to torture.\n\nProgramme effects:\nPolitical power gain: +5%\nPolice cost: +6%\nStability: -3%\n\nBenefits: Political power gain +5% through executive control.\n\nCosts: Police cost +6%; stability -3%; arbitrary detention and torture retain their grievance and accountability."
 COLDWAR_GRE_1970_service_procurement:0 "Fund a Joint-Service Supply Plan"
 COLDWAR_GRE_1970_service_procurement_desc:0 "Fund a Joint-Service Supply Plan.\n\nImplementation costs 0.8% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nBenefits: 15 army experience; a funded supply plan.\n\nCosts: One-time treasury payment: 0.8% of GDP."
 COLDWAR_GRE_1970_security_budget:0 "Account for the Security Budget"
 COLDWAR_GRE_1970_security_budget_desc:0 "Account for the Security Budget.\n\nImplementation costs 0.8% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nBenefits: 20 political power after implementation.\n\nCosts: One-time treasury payment: 0.8% of GDP; continued recurring police costs."
 COLDWAR_GRE_1970_lasting_junta:0 "A Military Government Built to Last"
 COLDWAR_GRE_1970_lasting_junta_desc:0 "A Military Government Built to Last.\n\nBenefits: Keep the regime package and access Papadopoulos or an actually victorious rival government.\n\nCosts: Political opposition and external censure remain; neither date nor completion supplies international legitimacy."
 COLDWAR_GRE_1970_military_development_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +1.05%\nBureaucracy cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_military_development:0 "Direct Credit through the Regime Banks"
 COLDWAR_GRE_1970_military_development_desc:0 "Direct Credit through the Regime Banks.\n\nProgramme effects:\nProduction efficiency cap: +1.05%\nBureaucracy cost: +4%\n\nImplementation costs 1% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nBenefits: Factory efficiency cap +1.05% after the shared economic balance scale.\n\nCosts: Bureaucracy cost +4%; one-time payment 1% of GDP; the programme ends when this regime ends."
 COLDWAR_GRE_1970_military_exit:0 "Negotiate an Exit for the Colonels"
 COLDWAR_GRE_1970_military_exit_desc:0 "A later exit remains available after durable junta rule, a retained tutelary veto, or an actual hardline reversal of the opening. It does not require the initially excluded military-entry focus. A genuine handover replaces old benefits rather than harvesting both regimes.\n\nConditions: Actual domestic negotiations have established a workable transfer agreement; no foreign seat can be forced to approve it.\n\nImplementation costs 0.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nBenefits: A later route to civilian institutions despite the initial choice to retain the junta.\n\nCosts: 0.5% of GDP; 365-day political power and bureaucracy penalty; relinquish the military regime and its development bonuses on actual handover."
 COLDWAR_GRE_1970_supervised_cabinet:0 "Appoint a Supervised Civilian Cabinet"
 COLDWAR_GRE_1970_supervised_cabinet_desc:0 "Appoint a Supervised Civilian Cabinet.\n\nConditions: An actual cabinet agreement and implemented limited reforms; Papadopoulos still controls the regime.\n\nImplementation costs 0.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nBenefits: Political power gain +5%; stability +2%; partial reduction of the original decree and policing penalties.\n\nCosts: Bureaucracy cost +3%; 0.5% of GDP; replacement reserve-powers and restricted-public-life spirits remain.\n\nLasting: European Censure is retained. A civilian cabinet is not a free election or an international rehabilitation."
 COLDWAR_GRE_1970_retain_veto_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +3%\nStability: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_retain_veto:0 "Keep the Military Veto"
 COLDWAR_GRE_1970_retain_veto_desc:0 "Keep the Military Veto.\n\nProgramme effects:\nPolitical power gain: +3%\nStability: -2%\n\nBenefits: Political power gain +3%; supervised government remains viable.\n\nCosts: Stability -2%; no parliamentary-mandate package; restricted political competition remains."
 COLDWAR_GRE_1970_renounce_veto:0 "Negotiate Away the Military Veto"
 COLDWAR_GRE_1970_renounce_veto_desc:0 "Negotiate Away the Military Veto.\n\nImplementation costs 0.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nBenefits: Unlock actual civilian transfer without a compulsory hardline coup.\n\nCosts: 0.5% of GDP; 365-day transition review; officer objections require a real domestic settlement."
 COLDWAR_GRE_1970_tutelary_charter:0 "Ratify a Tutelary Constitution"
 COLDWAR_GRE_1970_tutelary_charter_desc:0 "Ratify a Tutelary Constitution.\n\nConditions: A domestic charter is actually adopted; a controlled vote cannot count as a competitive parliamentary mandate.\n\nBenefits: 25 political power; lasting supervised government.\n\nCosts: The armed forces retain reserve powers; democratic legitimacy and Council of Europe restoration are not granted."
 COLDWAR_GRE_1970_opening_handover:0 "Implement the Civilian Handover"
 COLDWAR_GRE_1970_opening_handover_desc:0 "Implement the Civilian Handover.\n\nConditions: The transfer agreement is actually accepted and military executive vetoes are removed.\n\nBenefits: Enter the common constitutional transition path.\n\nCosts: Actual handover removes military and supervised-government bonuses, including their economic programmes."
 COLDWAR_GRE_1970_opening_tourism_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +1.8%\nSocial spending cost: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_opening_tourism:0 "Finance the Supervised Tourism Opening"
 COLDWAR_GRE_1970_opening_tourism_desc:0 "Finance the Supervised Tourism Opening.\n\nProgramme effects:\nConstruction speed: +1.8%\nSocial spending cost: +3%\n\nImplementation costs 1% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nBenefits: Construction speed +1.8% after the shared economic balance scale.\n\nCosts: Social spending cost +3%; one-time 1% of GDP; dependence on external visitors remains."
 COLDWAR_GRE_1970_reverse_opening:0 "Back the Hardliners against the Opening"
 COLDWAR_GRE_1970_reverse_opening_desc:0 "The struggle is player-authorised and domestic; no automatic overthrow or Cyprus coup. An unsuccessful bid pays its consequences without a successful-regime reward.\n\nConditions: An actual domestic power struggle has resolved in favour of military hardliners. Ioannidis is not installed by a date.\n\nBenefits: Return to the military command package if the domestic hardline contest actually succeeds.\n\nCosts: One-time stability -4%; restore the full decree and security-state penalties; lose the opening economy and constitution packages."
 COLDWAR_GRE_1970_transition_offer:0 "Agree the Terms of a Civilian Transfer"
 COLDWAR_GRE_1970_transition_offer_desc:0 "Agree the Terms of a Civilian Transfer.\n\nConditions: A real domestic transfer agreement; a focus proposal alone is not acceptance.\n\nImplementation costs 0.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nBenefits: A written domestic transition agreement; free elections become a possible outcome.\n\nCosts: 0.5% of GDP; political power gain -10% and bureaucracy cost +8% for 365 days."
 COLDWAR_GRE_1970_civilian_preparation:0 "Prepare a Civilian Administration"
 COLDWAR_GRE_1970_civilian_preparation_desc:0 "Prepare a Civilian Administration.\n\nImplementation costs 0.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nBenefits: 20 political power and institutional preparation.\n\nCosts: 0.5% of GDP; election results and foreign rehabilitation remain unsettled."
 COLDWAR_GRE_1970_legal_parties:0 "Restore the Freedom to Organise"
 COLDWAR_GRE_1970_legal_parties_desc:0 "Legal competition does not determine which party wins or prematurely create ND or PASOK.\n\nConditions: The transfer agreement has been implemented and actual freedom to organise is protected.\n\nBenefits: End the party ban and establish free organisation before an election.\n\nCosts: The ruler loses the ability to select a compliant winner."
 COLDWAR_GRE_1970_civilian_institutions:0 "Return Authority to Civil Institutions"
 COLDWAR_GRE_1970_civilian_institutions_desc:0 "Return Authority to Civil Institutions.\n\nConditions: An actual executive transfer has been implemented; review obligations and protected political competition are active.\n\nBenefits: Join one shared transition with the same legal and electoral obligations.\n\nCosts: Immediately replace military / controlled packages on actual transfer; prior decree advantages cannot persist."
 COLDWAR_GRE_1970_civilian_accountability_programme_effects_tt:0 "Implemented programme effects:\nStability: +3%\nBureaucracy cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_civilian_accountability:0 "Launch Independent Junta Investigations"
 COLDWAR_GRE_1970_civilian_accountability_desc:0 "Secure evidence and judicial independence before the election. Trials and verdicts can follow later; the historical major trials occurred in 1975. No completed trial is required for voting.\n\nProgramme effects:\nStability: +3%\nBureaucracy cost: +4%\n\nImplementation costs 0.8% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nBenefits: Stability +3% from credible, independent investigation safeguards.\n\nCosts: Bureaucracy cost +4% for continuing casework; 0.8% of GDP; officer resistance must be resolved."
 COLDWAR_GRE_1970_civilian_retirement_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +3%\nStability: -2%\nSocial spending cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_civilian_retirement:0 "Negotiate Retirement and a Limited Amnesty"
 COLDWAR_GRE_1970_civilian_retirement_desc:0 "The limited settlement concerns defined nonviolent or lesser participation. Torture and other serious abuses remain individually investigable; evidence, civil claims and compensation rights survive on both paths. Retirement is not innocence.\n\nProgramme effects:\nPolitical power gain: +3%\nStability: -2%\nSocial spending cost: +2%\n\nImplementation costs 0.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nBenefits: Political power gain +3% from the negotiated officer exit.\n\nCosts: Stability -2%; social cost +2%; 0.5% of GDP; victim claims and demands for accountability remain."
 COLDWAR_GRE_1970_open_courts:0 "Protect the Independent Courts"
 COLDWAR_GRE_1970_open_courts_desc:0 "Protect the Independent Courts.\n\nBenefits: 25 political power after the court safeguards are implemented.\n\nCosts: Accountability programme and victim obligations remain funded; no erasure of casework."
 COLDWAR_GRE_1970_retirement_guarantees:0 "Enforce the Officer Retirement Agreement"
 COLDWAR_GRE_1970_retirement_guarantees_desc:0 "Implementation and lengthy casework can continue after the election. Guarantees do not require every retirement or criminal trial to have concluded.\n\nBenefits: 25 political power after enforceable retirement terms and civilian-command guarantees.\n\nCosts: No simultaneous prosecution legitimacy reward; serious abuses remain investigable and victim claims survive."
 COLDWAR_GRE_1970_credible_election:0 "Hold a Free Parliamentary Election"
 COLDWAR_GRE_1970_credible_election_desc:0 "Hold a Free Parliamentary Election.\n\nConditions: Freedom to organise, genuine electoral rules and an implemented vote; actual winner follows party support / agreed multiplayer procedure.\n\nBenefits: An actual parliamentary mandate unlocks the appropriate governing-party programme.\n\nCosts: The incumbent must accept the implemented vote; no prescribed Karamanlis or Papandreou victory."
 COLDWAR_GRE_1970_constitutional_question:0 "Ratify the Civilian Constitutional Settlement"
 COLDWAR_GRE_1970_constitutional_question_desc:0 "Ratify the Civilian Constitutional Settlement.\n\nConditions: A real civilian executive, implemented civil liberties and a valid constitutional mandate. A referendum result may choose republic or a parliamentary crown.\n\nBenefits: Stability +6%; research speed +3%; retire decree rule and the active coercive-state package.\n\nCosts: Lose the junta / supervised political-power, planning and regime-development bonuses; unresolved victim claims remain.\n\nLasting: European Censure and the Politicised Officer Corps need separate real reforms. Constitutional monarchy remains possible through an actual ratified settlement."
 COLDWAR_GRE_1970_civilian_enterprise_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +1.05%\nBureaucracy cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_civilian_enterprise:0 "Rebuild Credit under Independent Courts"
 COLDWAR_GRE_1970_civilian_enterprise_desc:0 "Rebuild Credit under Independent Courts.\n\nProgramme effects:\nProduction efficiency cap: +1.05%\nBureaucracy cost: +2%\n\nImplementation costs 1% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nBenefits: Factory efficiency cap +1.05% after the shared balance scale.\n\nCosts: Bureaucracy cost +2%; one-time 1% of GDP; competing claims require transparent due process."
 COLDWAR_GRE_1970_civilian_reconstruction_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +1.8%\nSocial spending cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_civilian_reconstruction:0 "Put Regional Reconstruction First"
 COLDWAR_GRE_1970_civilian_reconstruction_desc:0 "Put Regional Reconstruction First.\n\nProgramme effects:\nConstruction speed: +1.8%\nSocial spending cost: +4%\n\nImplementation costs 1% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nBenefits: Construction speed +1.8% after the shared balance scale.\n\nCosts: Social spending cost +4%; one-time 1% of GDP; fewer resources for direct industrial credit."
 COLDWAR_GRE_1970_civilian_settlement:0 "A Government Chosen by Its Citizens"
 COLDWAR_GRE_1970_civilian_settlement_desc:0 "A Government Chosen by Its Citizens.\n\nBenefits: 25 political power after auditing the funded programme; civilian party paths remain available to the actual winner.\n\nCosts: A change of government replaces party programmes; it cannot stack seven governments or restore military perks."
 COLDWAR_GRE_1970_pap_0:0 "The Papadopoulos Cabinet"
 COLDWAR_GRE_1970_pap_0_desc:0 " Papadopoulos is the regime’s controlling figure; Markezinis can be prime minister during the 1973opening. Formal office and political control are distinct.\n\nConditions: Nationalist military junta in office AND Papadopoulos is the actual ruling leader. Actual active regime: military_government_active OR controlled_government_active. A party label alone cannot bypass the regime path."
