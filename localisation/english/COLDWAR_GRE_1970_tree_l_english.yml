 COLDWAR_GRE_1970_event_121_d:0 "Greece proposes: Negotiate a Funded Credit Line. Match lender treasury debit to Greek treasury/debt credit at actual acceptance. No minimum0.5billion helper hidden behind a2%-GDP label.\nAcceptance authorises the stated domestic Greek programme only. No territory, alliance entry or equipment transfer is granted.\nCredit line: 2% of current Greek GDP, frozen at dispatch. On implementation the lender pays that exact sum and Greek treasury and debt rise by that sum."
