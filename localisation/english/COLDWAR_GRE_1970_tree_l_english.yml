 COLDWAR_GRE_1970_greece_1970:0 "Greece in January 1970"
 COLDWAR_GRE_1970_greece_1970_desc:0 "The colonels control the government, the king remains abroad and parliamentary politics has been driven underground. Economic expansion cannot settle the question of who may govern Greece. The next settlement must reckon with the armed forces, civilian opposition and the interests sustained by military rule."
 COLDWAR_GRE_1970_state_dossier:0 "Open the State Dossier"
 COLDWAR_GRE_1970_state_dossier_desc:0 "Decrees have obscured the distinction between the state and the men who command it. A common account of ministries, public finances and provincial administration will expose the responsibilities that any enduring government must assume."
 COLDWAR_GRE_1970_officer_loyalties:0 "Map the Officer Networks"
 COLDWAR_GRE_1970_officer_loyalties_desc:0 "The officer corps is divided by service, patronage and personal allegiance. Establishing who commands genuine support is essential before either consolidating military rule or negotiating its withdrawal from politics."
 COLDWAR_GRE_1970_civilian_contacts:0 "Reopen Civilian Channels"
 COLDWAR_GRE_1970_civilian_contacts_desc:0 "Experienced politicians, lawyers and administrators have not disappeared because parliament has closed. Reopening discreet civilian channels gives the government interlocutors capable of negotiating an orderly transfer rather than another palace conspiracy."
 COLDWAR_GRE_1970_economic_stocktake:0 "Take Stock of the Expansion"
 COLDWAR_GRE_1970_economic_stocktake_desc:0 "Tourism, shipping and construction have brought visible prosperity, but credit and opportunity remain unevenly distributed. An honest review must distinguish productive expansion from projects sustained by political access."
 COLDWAR_GRE_1970_retain_junta:0 "Keep the Junta in Power"
 COLDWAR_GRE_1970_retain_junta_desc:0 "The military leadership will seek a durable governing compact rather than treat its rule as a brief emergency. Professional officers and security officials must now agree whose authority takes precedence and which interests the regime will protect."
 COLDWAR_GRE_1970_controlled_opening:0 "Open the Regime on Its Own Terms"
 COLDWAR_GRE_1970_controlled_opening_desc:0 "A supervised civilian cabinet could broaden the regime's support without immediately surrendering its foundations. The difficult question is whether soldiers will accept limits on their veto or merely lend civilians responsibility without power."
 COLDWAR_GRE_1970_civilian_transition:0 "Hand Power to Civilian Government"
 COLDWAR_GRE_1970_civilian_transition_desc:0 "A genuine civilian government requires control of ministries, courts and the chain of command. Negotiations must give civilians authority they can exercise while securing the practical cooperation needed for an orderly military withdrawal."
 COLDWAR_GRE_1970_military_compact:0 "Put the Officer Compact in Writing"
 COLDWAR_GRE_1970_military_compact_desc:0 "Personal understandings between colonels are a fragile basis for governing a country. Written responsibilities can make military rule more predictable, but will also expose disagreements over command, succession and the distribution of public money."
 COLDWAR_GRE_1970_professional_compact_programme_effects_tt:0 "Implemented programme effects:\nArmy organisation: +2%\nPolitical power gain: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_professional_compact:0 "Bargain with the Service Commands"
 COLDWAR_GRE_1970_professional_compact_desc:0 "The service commands want reliable budgets and professional influence rather than another round of personal promotions. Bargaining with them could strengthen administration while giving institutional military interests a lasting place inside government."
 COLDWAR_GRE_1970_security_compact_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +5%\nPolice cost: +6%\nStability: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_security_compact:0 "Entrench the Security Directorate"
 COLDWAR_GRE_1970_security_compact_desc:0 "The security directorate offers discipline through surveillance and control of appointments. Entrenching its authority would reassure the regime's hardliners at the cost of a narrower governing coalition and a more intrusive state."
 COLDWAR_GRE_1970_service_procurement:0 "Fund a Joint-Service Supply Plan"
 COLDWAR_GRE_1970_service_procurement_desc:0 "Separate service demands compete for the same workshops, imported components and funds. A joint supply plan can improve military production without allowing every commander to create his own procurement empire."
 COLDWAR_GRE_1970_security_budget:0 "Account for the Security Budget"
 COLDWAR_GRE_1970_security_budget_desc:0 "Security spending has acquired its own patrons and protected accounts. Bringing those commitments into a common budget makes their fiscal burden visible and forces the regime to decide which promises it can sustain."
 COLDWAR_GRE_1970_lasting_junta:0 "A Military Government Built to Last"
 COLDWAR_GRE_1970_lasting_junta_desc:0 "A permanent military government must provide more than emergency decrees. Its rulers will bind the service commands and public administration into a settlement designed to survive the departure of individual colonels."
 COLDWAR_GRE_1970_military_development_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +1.05%\nBureaucracy cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_military_development:0 "Direct Credit through the Regime Banks"
 COLDWAR_GRE_1970_military_development_desc:0 "Regime-connected banks can concentrate credit on selected industrial projects. This offers the government a powerful instrument of development while making the boundary between investment policy and political favour increasingly important."
 COLDWAR_GRE_1970_military_exit:0 "Negotiate an Exit for the Colonels"
 COLDWAR_GRE_1970_military_exit_desc:0 "The officers will not leave politics simply because civilians demand it. A negotiated exit must settle command, retirement and institutional guarantees without giving the army a permanent right to overturn the next government."
 COLDWAR_GRE_1970_supervised_cabinet:0 "Appoint a Supervised Civilian Cabinet"
 COLDWAR_GRE_1970_supervised_cabinet_desc:0 "Civilian ministers can bring expertise and a broader public face to government. Their credibility will depend on whether they are permitted to govern or remain answerable to military supervisors behind every important decision."
 COLDWAR_GRE_1970_retain_veto_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +3%\nStability: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_retain_veto:0 "Keep the Military Veto"
 COLDWAR_GRE_1970_retain_veto_desc:0 "The armed forces will retain a final say over the civilian cabinet. Such a settlement may reassure officers, but every reform will remain vulnerable to a military claim that national security takes priority."
 COLDWAR_GRE_1970_renounce_veto:0 "Negotiate Away the Military Veto"
 COLDWAR_GRE_1970_renounce_veto_desc:0 "A civilian mandate cannot coexist indefinitely with an unrestricted military veto. Negotiating its removal offers a clearer constitutional order, provided the service leadership accepts the authority it is being asked to surrender."
 COLDWAR_GRE_1970_tutelary_charter:0 "Ratify a Tutelary Constitution"
 COLDWAR_GRE_1970_tutelary_charter_desc:0 "A constitution under military tutelage would formalise the limits of civilian government. Its institutions may become more predictable, but parliamentary authority will remain conditional on the approval of unelected guardians."
 COLDWAR_GRE_1970_opening_handover:0 "Implement the Civilian Handover"
 COLDWAR_GRE_1970_opening_handover_desc:0 "The transfer must reach the working state: appointments, police instructions and ministerial authority. A public change of government means little unless civilian decisions are obeyed beyond the cabinet room."
 COLDWAR_GRE_1970_opening_tourism_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +1.8%\nSocial spending cost: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_opening_tourism:0 "Finance the Supervised Tourism Opening"
 COLDWAR_GRE_1970_opening_tourism_desc:0 "Tourism offers an opening to foreign capital and a wider civilian business community. Financing the sector can help the supervised cabinet build support, while making the coastline and public credit central to its development bargain."
 COLDWAR_GRE_1970_reverse_opening:0 "Back the Hardliners against the Opening"
 COLDWAR_GRE_1970_reverse_opening_desc:0 "Hardliners see civilianisation as the beginning of the regime's dissolution. Backing their challenge would restore tighter officer control and abandon the political expectations raised by the opening."
 COLDWAR_GRE_1970_transition_offer:0 "Agree the Terms of a Civilian Transfer"
 COLDWAR_GRE_1970_transition_offer_desc:0 "Civilian leaders and military representatives need terms they can defend to their own supporters. The transfer agreement must settle authority and guarantees clearly enough to prevent rival interpretations once the cabinet changes."
 COLDWAR_GRE_1970_civilian_preparation:0 "Prepare a Civilian Administration"
 COLDWAR_GRE_1970_civilian_preparation_desc:0 "Parliamentary government needs administrators able to work without military patrons. Preparing ministries, legal procedures and public appointments will give the incoming cabinet the means to carry out its decisions."
 COLDWAR_GRE_1970_legal_parties:0 "Restore the Freedom to Organise"
 COLDWAR_GRE_1970_legal_parties_desc:0 "Political organisation cannot remain a privilege granted to approved supporters. Restoring parties allows competing programmes to seek a public mandate, while requiring the state to protect lawful opposition as well as the governing majority."
 COLDWAR_GRE_1970_civilian_institutions:0 "Return Authority to Civil Institutions"
 COLDWAR_GRE_1970_civilian_institutions_desc:0 "Courts, ministries and elected representatives must recover responsibilities absorbed by the military government. Their independence will determine whether the transfer produces a constitutional state or merely replaces the men at its head."
 COLDWAR_GRE_1970_civilian_accountability_programme_effects_tt:0 "Implemented programme effects:\nStability: +3%\nBureaucracy cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_civilian_accountability:0 "Launch Independent Junta Investigations"
 COLDWAR_GRE_1970_civilian_accountability_desc:0 "Victims of detention and abuse expect the new government to establish responsibility. Independent investigations can restore confidence in the courts, although implicated officers and their allies will resist scrutiny."
 COLDWAR_GRE_1970_civilian_retirement_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +3%\nStability: -2%\nSocial spending cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_civilian_retirement:0 "Negotiate Retirement and a Limited Amnesty"
 COLDWAR_GRE_1970_civilian_retirement_desc:0 "A limited retirement agreement may reduce resistance to civilian rule. Its terms must distinguish an orderly withdrawal from a blanket immunity that denies victims any prospect of justice."
 COLDWAR_GRE_1970_open_courts:0 "Protect the Independent Courts"
 COLDWAR_GRE_1970_open_courts_desc:0 "Judges must be able to examine detention, abuse and the legality of state action without instructions from the executive. Protecting the courts gives the constitutional settlement an institution capable of defending it."
 COLDWAR_GRE_1970_retirement_guarantees:0 "Enforce the Officer Retirement Agreement"
 COLDWAR_GRE_1970_retirement_guarantees_desc:0 "A negotiated military withdrawal will collapse if either side treats its obligations as optional. Enforcing the retirement settlement makes the limits of political service clear while leaving genuine criminal responsibility to the agreed legal process."
 COLDWAR_GRE_1970_credible_election:0 "Hold a Free Parliamentary Election"
 COLDWAR_GRE_1970_credible_election_desc:0 "A parliamentary election must offer a real choice and a result the armed forces will respect. Legal organisation, credible administration and acceptance of the outcome are the foundations of a government chosen by its citizens."
 COLDWAR_GRE_1970_constitutional_question:0 "Ratify the Civilian Constitutional Settlement"
 COLDWAR_GRE_1970_constitutional_question_desc:0 "The end of military government leaves unresolved questions about executive power and the head of state. A ratified civilian settlement must establish who governs, how authority changes hands and which institutions can restrain it."
 COLDWAR_GRE_1970_civilian_enterprise_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +1.05%\nBureaucracy cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_civilian_enterprise:0 "Rebuild Credit under Independent Courts"
 COLDWAR_GRE_1970_civilian_enterprise_desc:0 "Businesses need courts and credit decisions they can trust without a military intermediary. Independent enforcement can reopen investment while weakening the patronage networks that prospered under discretionary rule."
 COLDWAR_GRE_1970_civilian_reconstruction_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +1.8%\nSocial spending cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_civilian_reconstruction:0 "Put Regional Reconstruction First"
 COLDWAR_GRE_1970_civilian_reconstruction_desc:0 "An elected government must be visible outside Athens. Regional reconstruction will connect political change to employment and public services in communities that have received a smaller share of the expansion."
 COLDWAR_GRE_1970_civilian_settlement:0 "A Government Chosen by Its Citizens"
 COLDWAR_GRE_1970_civilian_settlement_desc:0 "The constitutional transition becomes durable when governments can change without threatening the state itself. Civil authority, lawful opposition and professional administration must outlast the coalition that first restored them."
 COLDWAR_GRE_1970_pap_0:0 "The Papadopoulos Cabinet"
 COLDWAR_GRE_1970_pap_0_desc:0 "Papadopoulos must turn personal authority into a government capable of surviving its own promises. His cabinet faces a choice between controlled civilian participation and a more openly military settlement."
 COLDWAR_GRE_1970_pap_1:0 "Consolidate the Decree Government"
 COLDWAR_GRE_1970_pap_1_desc:0 "Decree government allows decisions to move quickly through ministries. Consolidating it will strengthen the executive while leaving fewer independent institutions able to question the direction of policy."
 COLDWAR_GRE_1970_pap_2_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +3%\nStability: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_2:0 "Controlled Liberalisation"
 COLDWAR_GRE_1970_pap_2_desc:0 "Limited liberalisation could draw professionals and business leaders into the regime's orbit. The opening must be credible enough to attract support without dissolving the military foundations on which Papadopoulos relies."
 COLDWAR_GRE_1970_pap_3_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +7%\nStability: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_3:0 "Retain Military Tutelage"
 COLDWAR_GRE_1970_pap_3_desc:0 "Military tutelage will remain the governing principle. Preserving that authority reassures the regime's officers, but restricts the cabinet's ability to present civilian participation as a genuine redistribution of power."
 COLDWAR_GRE_1970_pap_4_programme_effects_tt:0 "Implemented programme effects:\nProductivity growth: +2%\nEducation cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_4:0 "Civilian Technocrats"
 COLDWAR_GRE_1970_pap_4_desc:0 "Civilian technocrats can improve administration and offer the cabinet expertise beyond its officer networks. Their usefulness will depend on whether professional advice is allowed to challenge politically convenient decisions."
 COLDWAR_GRE_1970_pap_5_programme_effects_tt:0 "Implemented programme effects:\nDaily political power: +0.05/day\nBureaucracy cost: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_5:0 "Loyalty before Expertise"
 COLDWAR_GRE_1970_pap_5_desc:0 "Loyal appointees are easier for the leadership to trust than independent specialists. Favouring them will tighten political control while limiting the pool of expertise available to the administration."
 COLDWAR_GRE_1970_pap_6:0 "Define the Successor State"
 COLDWAR_GRE_1970_pap_6_desc:0 "The regime must decide what kind of state should succeed its founding emergency. Its constitutional and administrative choices will determine whether personal leadership gives way to institutions or another officer compact."
 COLDWAR_GRE_1970_pap_7_programme_effects_tt:0 "Implemented programme effects:\nCivilian factory construction speed: +8%\nFactory output: +5%\nBureaucracy cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_7:0 "Development through the Banks"
 COLDWAR_GRE_1970_pap_7_desc:0 "Development banks can channel investment towards the cabinet's preferred industries. The programme offers coordinated credit, but its credibility depends on productive projects rather than access to the leadership."
 COLDWAR_GRE_1970_pap_8_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +2.1%\nSocial spending cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_8:0 "Tourism Concessions"
 COLDWAR_GRE_1970_pap_8_desc:0 "Tourism concessions promise foreign earnings and visible employment. They also put valuable coastal opportunities into private hands, making the terms of public support a central political question."
 COLDWAR_GRE_1970_pap_9_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +2.1%\nBureaucracy cost: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_9:0 "Productive Export Credit"
 COLDWAR_GRE_1970_pap_9_desc:0 "Export credit can give manufacturers the means to reach new markets. Concentrating it on productive firms would broaden foreign earnings beyond the activities most closely associated with the building boom."
 COLDWAR_GRE_1970_pap_10_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nOffice income tax revenue: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_10:0 "The Coastal Hotel Programme"
 COLDWAR_GRE_1970_pap_10_desc:0 "The coastal hotel programme will turn the tourism bargain into work for contractors and suppliers. Financing must support viable destinations rather than leave communities dependent on unfinished prestige developments."
 COLDWAR_GRE_1970_pap_11_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nFactory output: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_11:0 "Industrial Credit Windows"
 COLDWAR_GRE_1970_pap_11_desc:0 "Industrial credit windows give producers a route to working capital and equipment. Clear priorities can make that support useful without allowing every favoured enterprise to expect permanent protection."
 COLDWAR_GRE_1970_pap_12_programme_effects_tt:0 "Implemented programme effects:\nTax revenue: +2.5%\nEconomic project cost: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_12:0 "Review the Investment Regime"
 COLDWAR_GRE_1970_pap_12_desc:0 "The investment regime has created obligations as well as supporters. Reviewing its terms can strengthen public revenue and expose concessions whose benefits no longer justify their cost."
 COLDWAR_GRE_1970_pap_13_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_13:0 "Selective European Opening"
 COLDWAR_GRE_1970_pap_13_desc:0 "A selective European opening seeks commercial and diplomatic gains without immediately abandoning the regime's political framework. Partners will judge whether its limited concessions are sufficient for a broader relationship."
 COLDWAR_GRE_1970_pap_14_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: -4%\nPolitical power gain: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_14:0 "Bilateral Patronage"
 COLDWAR_GRE_1970_pap_14_desc:0 "Bilateral patrons can offer support without the same collective scrutiny as European institutions. Their assistance may preserve the cabinet's room for manoeuvre while increasing dependence on individual foreign governments."
 COLDWAR_GRE_1970_pap_15:0 "Rights Benchmarks for Talks"
 COLDWAR_GRE_1970_pap_15_desc:0 "Rights benchmarks give negotiations a concrete political basis. Meeting them would require the cabinet to accept restraints that its security supporters may regard as a threat."
 COLDWAR_GRE_1970_pap_16:0 "Security Bargains with Patrons"
 COLDWAR_GRE_1970_pap_16_desc:0 "Security bargains can tie foreign assistance to cooperation the regime is willing to provide. The government must weigh practical support against the obligations patrons expect in return."
 COLDWAR_GRE_1970_pap_17:0 "A Sustainable Opening"
 COLDWAR_GRE_1970_pap_17_desc:0 "An opening that depends entirely on its founder will remain fragile. Consolidating its economic and political terms can give limited reform a better chance of surviving disputes within the regime."
 COLDWAR_GRE_1970_pap_18_programme_effects_tt:0 "Implemented programme effects:\nBureaucracy cost: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_18:0 "A Cabinet with Civilian Reach"
 COLDWAR_GRE_1970_pap_18_desc:0 "The cabinet needs channels into professions, businesses and local communities beyond the barracks. Broadening its civilian reach can improve governing capacity while raising expectations of genuine influence."
 COLDWAR_GRE_1970_pap_19_programme_effects_tt:0 "Implemented programme effects:\nResearch speed: +2.5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pap_19:0 "The Regime after the Colonels"
 COLDWAR_GRE_1970_pap_19_desc:0 "The founding colonels cannot remain the answer to every question of succession. The completed programme must leave a governing arrangement able to carry its development commitments beyond their personal rule."
 COLDWAR_GRE_1970_ioa_0:0 "The Security Directorate"
 COLDWAR_GRE_1970_ioa_0_desc:0 "The security directorate regards political opening as an invitation to the regime's enemies. Its claim to govern rests on disciplined officer networks and an insistence that security must take priority."
 COLDWAR_GRE_1970_ioa_1:0 "Control the Junta Networks"
 COLDWAR_GRE_1970_ioa_1_desc:0 "Control of the junta's networks will determine whether the directorate can command the wider state. Appointments and personal loyalties must be brought into a single political structure."
 COLDWAR_GRE_1970_ioa_2_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +8%\nStability: -4%\nPolice cost: +8%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_2:0 "A Closed Officer Circle"
 COLDWAR_GRE_1970_ioa_2_desc:0 "A closed officer circle offers secrecy and dependable loyalty. Concentrating decisions within it will narrow the regime's support and deepen its reliance on coercion and privileged access."
 COLDWAR_GRE_1970_ioa_3_programme_effects_tt:0 "Implemented programme effects:\nArmy organisation: +2%\nPolitical power gain: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_3:0 "Broaden the Officer Compact"
 COLDWAR_GRE_1970_ioa_3_desc:0 "A broader officer compact could reduce rivalry between services and factions. Sharing influence may make the regime easier to sustain, although the directorate would surrender some of its freedom to dictate policy."
 COLDWAR_GRE_1970_ioa_4_programme_effects_tt:0 "Implemented programme effects:\nDaily political power: +0.05/day\nPolice cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_4:0 "ESA Surveillance"
 COLDWAR_GRE_1970_ioa_4_desc:0 "ESA surveillance gives the security leadership a direct instrument against opponents. Expanding its reach will strengthen control while making suspicion and political screening more intrusive in public life."
 COLDWAR_GRE_1970_ioa_5_programme_effects_tt:0 "Implemented programme effects:\nSupply consumption: -2%\nBureaucracy cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_5:0 "Service-Wide Bargaining"
 COLDWAR_GRE_1970_ioa_5_desc:0 "Service-wide bargaining can replace repeated personal struggles with clearer institutional commitments. The leadership must recognise competing military interests rather than assume that security officials speak for every command."
 COLDWAR_GRE_1970_ioa_6:0 "Resolve the Command Rivalry"
 COLDWAR_GRE_1970_ioa_6_desc:0 "Rival command networks can paralyse an apparently disciplined regime. Resolving their claims is necessary before the directorate can turn its political authority into a coherent military policy."
 COLDWAR_GRE_1970_ioa_7_programme_effects_tt:0 "Implemented programme effects:\nFactory output: +6%\nCivilian factory construction speed: -3%\nBureaucracy cost: +5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_7:0 "A Siege-Economy Budget"
 COLDWAR_GRE_1970_ioa_7_desc:0 "A siege-economy budget will give security and industrial resilience priority over a broader civilian opening. Such a programme can concentrate resources, but places heavier demands on administration and ordinary economic activity."
 COLDWAR_GRE_1970_ioa_8_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +2.1%\nConstruction speed: -1.2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_8:0 "Priority Military Procurement"
 COLDWAR_GRE_1970_ioa_8_desc:0 "Priority procurement gives the armed forces a privileged claim on suppliers and funds. It can strengthen readiness while limiting the resources available to less politically protected civilian producers."
 COLDWAR_GRE_1970_ioa_9_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +1.5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_9:0 "Preserve Civilian Production"
 COLDWAR_GRE_1970_ioa_9_desc:0 "Civilian production sustains the labour and revenue on which the security state also depends. Preserving its place in the budget offers a less concentrated allocation than exclusive military priority."
 COLDWAR_GRE_1970_ioa_10_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nFactory output: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_10:0 "Army Supply Workshops"
 COLDWAR_GRE_1970_ioa_10_desc:0 "Army supply workshops can shorten repair cycles and organise dependable military orders. Their usefulness will depend on regular inputs and technical competence rather than their protected position in the budget."
 COLDWAR_GRE_1970_ioa_11_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nProduction efficiency growth: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_11:0 "Civilian Suppliers under Contract"
 COLDWAR_GRE_1970_ioa_11_desc:0 "Contracts with civilian suppliers can draw established production into the defence effort. Predictable terms will matter if firms are to invest without becoming wholly dependent on emergency orders."
 COLDWAR_GRE_1970_ioa_12_programme_effects_tt:0 "Implemented programme effects:\nEconomic project cost: -4%\nTax revenue: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_12:0 "Review Emergency Spending"
 COLDWAR_GRE_1970_ioa_12_desc:0 "Emergency commitments easily become permanent claims on public money. Reviewing them can restore some fiscal discipline while revealing how much of the economy the directorate has tied to its political survival."
 COLDWAR_GRE_1970_ioa_13_programme_effects_tt:0 "Implemented programme effects:\nArmy organisation: +1.2%\nForeign influence resistance: -8%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_13:0 "Maximum Pressure on Nicosia"
 COLDWAR_GRE_1970_ioa_13_desc:0 "Maximum pressure on Nicosia would make Cyprus a test of the security regime's authority. It risks deepening a command and sovereignty dispute that Greek pressure alone cannot resolve."
 COLDWAR_GRE_1970_ioa_14_programme_effects_tt:0 "Implemented programme effects:\nStability: +4%\nForeign influence resistance: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_14:0 "Restrain the Cyprus Plotters"
 COLDWAR_GRE_1970_ioa_14_desc:0 "Restraining the plotters preserves room for a less dangerous relationship with the Cypriot presidency. The directorate would have to control networks that may consider themselves more committed than the government to the national cause."
 COLDWAR_GRE_1970_ioa_15:0 "Authorise a Covert Proposal"
 COLDWAR_GRE_1970_ioa_15_desc:0 "A covert proposal commits the leadership to influencing events through a willing counterpart. Secrecy may conceal responsibility for a time, but cannot guarantee either acceptance or the desired political outcome."
 COLDWAR_GRE_1970_ioa_16:0 "Keep the Guard out of Politics"
 COLDWAR_GRE_1970_ioa_16_desc:0 "Keeping the National Guard out of political plots would place limits on the officer mission. An accepted arrangement could reduce immediate danger while challenging those who regard intervention as the mission's purpose."
 COLDWAR_GRE_1970_ioa_17:0 "Command without Illusions"
 COLDWAR_GRE_1970_ioa_17_desc:0 "Command must be based on capabilities the state can sustain. Recognising the limits of pressure and mobilisation can prevent the security leadership from mistaking obedience at home for control of events abroad."
 COLDWAR_GRE_1970_ioa_18_programme_effects_tt:0 "Implemented programme effects:\nBureaucracy cost: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_18:0 "Account for the Security State"
 COLDWAR_GRE_1970_ioa_18_desc:0 "The security state has accumulated expenses and responsibilities behind its claims of necessity. An account of those commitments will force the leadership to confront the economic price of its governing method."
 COLDWAR_GRE_1970_ioa_19_programme_effects_tt:0 "Implemented programme effects:\nResearch speed: +2.5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_ioa_19:0 "A Regime Facing its Costs"
 COLDWAR_GRE_1970_ioa_19_desc:0 "The directorate's completed programme must endure the costs it has imposed. Fiscal limits, civilian production and the consequences of foreign policy will shape whether its concentrated authority can remain effective."
 COLDWAR_GRE_1970_nd_0:0 "A Civilian Conservative Mandate"
 COLDWAR_GRE_1970_nd_0_desc:0 "A civilian conservative government must establish authority without reproducing the junta's methods. Its mandate joins parliamentary restoration to the promise of economic competence and a credible European course."
 COLDWAR_GRE_1970_nd_1:0 "Return the State to Parliament"
 COLDWAR_GRE_1970_nd_1_desc:0 "Returning the state to parliament requires more than reopening the chamber. Ministers and military commanders must accept that elected representatives determine the government's authority and can withdraw it."
 COLDWAR_GRE_1970_nd_2_programme_effects_tt:0 "Implemented programme effects:\nStability: +5%\nPolitical power gain: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_2:0 "Prosecute the Torturers"
 COLDWAR_GRE_1970_nd_2_desc:0 "Prosecuting torture will demonstrate that the new order recognises crimes committed in the state's name. The courts must establish individual responsibility while resisting pressure to turn justice into a factional settlement."
 COLDWAR_GRE_1970_nd_3_programme_effects_tt:0 "Implemented programme effects:\nArmy organisation: +1.6%\nStability: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_3:0 "A Limited Officer Amnesty"
 COLDWAR_GRE_1970_nd_3_desc:0 "A limited amnesty can reduce resistance from officers prepared to leave politics. Its boundaries must be explicit if reconciliation is not to extinguish the claims of those who suffered abuse."
 COLDWAR_GRE_1970_nd_4_programme_effects_tt:0 "Implemented programme effects:\nTax revenue: +2%\nBureaucracy cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_4:0 "Independent Courts"
 COLDWAR_GRE_1970_nd_4_desc:0 "Independent courts can defend the parliamentary settlement from executive convenience. Restoring their authority also gives citizens and enterprises a more dependable basis for dealing with the state."
 COLDWAR_GRE_1970_nd_5_programme_effects_tt:0 "Implemented programme effects:\nSupply consumption: -2%\nSocial spending cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_5:0 "Negotiated Military Retirement"
 COLDWAR_GRE_1970_nd_5_desc:0 "Negotiated retirement offers officers a defined route out of political command. Enforcing it will help civilians consolidate authority without leaving military withdrawal dependent on personal understandings."
 COLDWAR_GRE_1970_nd_6:0 "A Civilian Chain of Command"
 COLDWAR_GRE_1970_nd_6_desc:0 "The armed forces must receive their political direction from the constitutional government. Establishing a civilian chain of command will separate national defence from the entitlement to intervene in politics."
 COLDWAR_GRE_1970_nd_7_programme_effects_tt:0 "Implemented programme effects:\nCivilian factory construction speed: +8%\nProduction efficiency growth: +5%\nCorporate tax revenue: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_7:0 "The Social-Market Programme"
 COLDWAR_GRE_1970_nd_7_desc:0 "A social-market programme seeks productive private investment alongside dependable public institutions. The cabinet will combine industrial opportunity with rules that give competition and social stability a durable foundation."
 COLDWAR_GRE_1970_nd_8_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +2.45%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_8:0 "Competitive Export Industry"
 COLDWAR_GRE_1970_nd_8_desc:0 "Competitive exporters can broaden the productive economy and improve its access to foreign markets. Supporting them favours firms able to stand beyond a protected domestic customer base."
 COLDWAR_GRE_1970_nd_9_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +2.1%\nBureaucracy cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_9:0 "Protect Strategic Enterprises"
 COLDWAR_GRE_1970_nd_9_desc:0 "Strategic enterprises may remain important where national infrastructure or industrial capability is difficult to replace. Retaining them requires competent management and scrutiny rather than an automatic exemption from reform."
 COLDWAR_GRE_1970_nd_10_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nProduction efficiency growth: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_10:0 "SME Credit and Competition"
 COLDWAR_GRE_1970_nd_10_desc:0 "Small and medium enterprises need access to credit on terms less dependent on established connections. Competition and finance can give new producers a place in the recovery of civilian economic life."
 COLDWAR_GRE_1970_nd_11_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nProductivity growth: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_11:0 "Public Utilities with Audits"
 COLDWAR_GRE_1970_nd_11_desc:0 "Public utilities shape the costs faced by households and industry alike. Audits and professional management will make investment in those services easier to justify and harder to capture through patronage."
 COLDWAR_GRE_1970_nd_12_programme_effects_tt:0 "Implemented programme effects:\nTax revenue: +3%\nInterest rate: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_12:0 "A Credible Fiscal Settlement"
 COLDWAR_GRE_1970_nd_12_desc:0 "A credible fiscal settlement must bring revenue and public commitments into a relationship the government can maintain. Reliable collection will matter as much as announcements of restraint."
 COLDWAR_GRE_1970_nd_13_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_13:0 "Reactivate the Association Framework"
 COLDWAR_GRE_1970_nd_13_desc:0 "The European association framework offers a channel for rebuilding a relationship damaged by military rule. Reactivation requires confidence in Greece's institutions as well as an interest in trade."
 COLDWAR_GRE_1970_nd_14_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +1.2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_14:0 "First Rebuild National Capacity"
 COLDWAR_GRE_1970_nd_14_desc:0 "Domestic capacity must support the promises Greece makes abroad. Strengthening administration and productive skills first can give subsequent negotiations a firmer national foundation."
 COLDWAR_GRE_1970_nd_15:0 "An Accession Dossier"
 COLDWAR_GRE_1970_nd_15_desc:0 "An accession dossier must present a case partners can evaluate and accept. Preparing it will require sustained administrative work without treating the Greek government's ambitions as a completed European decision."
 COLDWAR_GRE_1970_nd_16:0 "Domestic Regulatory Readiness"
 COLDWAR_GRE_1970_nd_16_desc:0 "Regulatory readiness is work Greece can undertake before the final answer of its partners. Clearer domestic rules can improve the economy's ability to use opportunities when a wider agreement becomes possible."
 COLDWAR_GRE_1970_nd_17:0 "A State beyond the Junta"
 COLDWAR_GRE_1970_nd_17_desc:0 "The post-junta state must offer institutions that citizens can use without political intermediaries. Consolidating civilian authority will make parliamentary government more tangible than the memory of military rule."
 COLDWAR_GRE_1970_nd_18_programme_effects_tt:0 "Implemented programme effects:\nBureaucracy cost: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_18:0 "Balanced Regional Investment"
 COLDWAR_GRE_1970_nd_18_desc:0 "Balanced regional investment gives the conservative programme a national reach beyond its strongest centres. Provincial opportunity and infrastructure can help prevent recovery from reinforcing the same geographical divisions."
 COLDWAR_GRE_1970_nd_19_programme_effects_tt:0 "Implemented programme effects:\nResearch speed: +2.5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_nd_19:0 "A European Parliamentary Republic"
 COLDWAR_GRE_1970_nd_19_desc:0 "A European parliamentary republic must be able to sustain both its constitutional commitments and its economic programme. The settlement will be judged by ordinary government after the exceptional transition has ended."
 COLDWAR_GRE_1970_centre_0:0 "Rebuild the Liberal Centre"
 COLDWAR_GRE_1970_centre_0_desc:0 "The liberal centre must rebuild trust after years in which political organisation was restricted. Its government will seek a coalition broad enough to restore liberties without surrendering a coherent reform programme."
 COLDWAR_GRE_1970_centre_1:0 "A Coalition for Civil Liberties"
 COLDWAR_GRE_1970_centre_1_desc:0 "Civil liberties can unite groups that disagree on much else. A coalition built around their protection must give partners a real stake while preserving the capacity to govern."
 COLDWAR_GRE_1970_centre_2_programme_effects_tt:0 "Implemented programme effects:\nStability: +5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_2:0 "Independent Justice"
 COLDWAR_GRE_1970_centre_2_desc:0 "Independent justice offers a common standard for citizens divided by political allegiance. Giving courts room to examine the recent past will test whether the new majority accepts restraints on itself."
 COLDWAR_GRE_1970_centre_3_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +4%\nStability: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_3:0 "A Broad Reconciliation Pact"
 COLDWAR_GRE_1970_centre_3_desc:0 "A broad reconciliation pact could bring former adversaries into constitutional politics. Its credibility depends on acknowledging real grievances rather than demanding that victims accept silence for the convenience of government."
 COLDWAR_GRE_1970_centre_4_programme_effects_tt:0 "Implemented programme effects:\nPolice cost: -3%\nBureaucracy cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_4:0 "Civilian Police Oversight"
 COLDWAR_GRE_1970_centre_4_desc:0 "Civilian oversight of the police will put public security under rules the elected government can defend. Professional accountability can reduce abuse without leaving lawful policing hostage to partisan commands."
 COLDWAR_GRE_1970_centre_5_programme_effects_tt:0 "Implemented programme effects:\nDaily political power: +0.04/day\nSocial spending cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_5:0 "Local Reconciliation Boards"
 COLDWAR_GRE_1970_centre_5_desc:0 "Local reconciliation boards can address grievances that national agreements leave unresolved. Their work will require fair procedures and the patience to hear claims from communities accustomed to distrust."
 COLDWAR_GRE_1970_centre_6:0 "A Parliament that Can Govern"
 COLDWAR_GRE_1970_centre_6_desc:0 "Parliament needs institutions capable of converting compromise into law and administration. Strengthening its capacity can make coalition politics more than a succession of bargains over office."
 COLDWAR_GRE_1970_centre_7_programme_effects_tt:0 "Implemented programme effects:\nResearch speed: +4%\nProductivity growth: +2%\nEducation cost: +6%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_7:0 "Enterprise without Patronage"
 COLDWAR_GRE_1970_centre_7_desc:0 "Enterprise without patronage requires impartial access to finance and enforceable rules. The centre will favour productive initiative while challenging the networks that make opportunity depend on political sponsorship."
 COLDWAR_GRE_1970_centre_8_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +2.1%\nBureaucracy cost: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_8:0 "Break the Credit Cartels"
 COLDWAR_GRE_1970_centre_8_desc:0 "Concentrated credit can leave promising firms outside the investment economy. Breaking those barriers offers broader competition, but will face resistance from established lenders and their clients."
 COLDWAR_GRE_1970_centre_9_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +1.8%\nSocial spending cost: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_9:0 "A Social Credit Compact"
 COLDWAR_GRE_1970_centre_9_desc:0 "A social credit compact seeks to widen opportunity without abandoning public responsibility. Supporting local borrowers can broaden the economy while requiring safeguards against lending driven by political obligation."
 COLDWAR_GRE_1970_centre_10_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nCorporate tax revenue: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_10:0 "Open Bank Tendering"
 COLDWAR_GRE_1970_centre_10_desc:0 "Open bank tendering will make the terms of public financial business more transparent. Competitive procedures can lower the value of privileged access and give the treasury a clearer account of its commitments."
 COLDWAR_GRE_1970_centre_11_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nProductivity growth: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_11:0 "Cooperative Local Banks"
 COLDWAR_GRE_1970_centre_11_desc:0 "Cooperative local banks can draw on knowledge that distant institutions lack. Professional standards must protect members' savings if community finance is to become a dependable source of development."
 COLDWAR_GRE_1970_centre_12_programme_effects_tt:0 "Implemented programme effects:\nTax revenue: +4%\nBureaucracy cost: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_12:0 "A Tax Base beyond Athens"
 COLDWAR_GRE_1970_centre_12_desc:0 "Public revenue cannot depend on the easiest taxpayers around Athens alone. A wider tax base and more consistent administration can distribute responsibility more fairly across the national economy."
 COLDWAR_GRE_1970_centre_13_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_13:0 "Open the European Channel"
 COLDWAR_GRE_1970_centre_13_desc:0 "A European channel offers the centre a way to connect democratic reform with commercial opportunity. Partners will expect evidence that the institutions being presented abroad also function at home."
 COLDWAR_GRE_1970_centre_14_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_14:0 "Lead a Regional Mediation"
 COLDWAR_GRE_1970_centre_14_desc:0 "Regional mediation can give Greece influence through practical diplomacy. The government must offer terms its neighbours can use rather than assume that good intentions confer authority over their disputes."
 COLDWAR_GRE_1970_centre_15:0 "Association on Equal Terms"
 COLDWAR_GRE_1970_centre_15_desc:0 "Association on equal terms requires confidence in Greece's own negotiating capacity. A prepared dossier can support mutual interests while making clear which obligations the country is willing to accept."
 COLDWAR_GRE_1970_centre_16:0 "A Balkan Trade Conference"
 COLDWAR_GRE_1970_centre_16_desc:0 "A Balkan trade conference can place transport and commercial rules alongside diplomatic dialogue. Participation and agreed terms must turn regional aspirations into opportunities producers can actually use."
 COLDWAR_GRE_1970_centre_17:0 "The Centre Holds"
 COLDWAR_GRE_1970_centre_17_desc:0 "The centre will survive only if coalition government delivers more than a return to familiar names. Its reforms must give citizens confidence that liberty and competent administration belong together."
 COLDWAR_GRE_1970_centre_18_programme_effects_tt:0 "Implemented programme effects:\nBureaucracy cost: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_18:0 "Professional Public Appointments"
 COLDWAR_GRE_1970_centre_18_desc:0 "Professional public appointments can reduce the expectation that every change of cabinet brings a redistribution of jobs. Merit and continuity will strengthen administration beyond the immediate governing coalition."
 COLDWAR_GRE_1970_centre_19_programme_effects_tt:0 "Implemented programme effects:\nResearch speed: +2.5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_centre_19:0 "A Liberal Democratic Settlement"
 COLDWAR_GRE_1970_centre_19_desc:0 "A liberal democratic settlement must protect opposition and sustain an economy open to new participants. Bringing the programme together will give constitutional compromise a practical foundation in everyday government."
 COLDWAR_GRE_1970_pasok_0:0 "A Mandate for Change"
 COLDWAR_GRE_1970_pasok_0_desc:0 "A mandate for change brings together demands for democratic inclusion, social provision and national autonomy. PASOK must decide how far those ambitions can be carried through parliament and the resources of the state."
 COLDWAR_GRE_1970_pasok_1:0 "Bring the Exiles Home"
 COLDWAR_GRE_1970_pasok_1_desc:0 "Returning exiles can reconnect the country with people excluded by political conflict. Their reception will test whether democratic inclusion extends beyond the groups most convenient to the governing majority."
 COLDWAR_GRE_1970_pasok_2_programme_effects_tt:0 "Implemented programme effects:\nStability: +5%\nPolitical power gain: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_2:0 "Parliamentary Socialism"
 COLDWAR_GRE_1970_pasok_2_desc:0 "Parliamentary socialism will pursue transformation through pluralist institutions. The programme must win and retain support while accepting that opponents have the same right to organise and compete for office."
 COLDWAR_GRE_1970_pasok_3_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +7%\nBureaucracy cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_3:0 "Executive-Led Transformation"
 COLDWAR_GRE_1970_pasok_3_desc:0 "Executive-led transformation promises faster coordination of an ambitious social programme. Concentrating authority can overcome resistance, but also weakens the independent voices that helped give change its legitimacy."
 COLDWAR_GRE_1970_pasok_4_programme_effects_tt:0 "Implemented programme effects:\nProductivity growth: +2%\nSocial spending cost: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_4:0 "A Pluralist Labour Movement"
 COLDWAR_GRE_1970_pasok_4_desc:0 "A pluralist labour movement gives workers influence beyond the governing party. Independent organisations may complicate policy, yet their participation can make the social contract more durable than executive instructions alone."
 COLDWAR_GRE_1970_pasok_5_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency growth: +2.5%\nBureaucracy cost: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_5:0 "A Central Programme Office"
 COLDWAR_GRE_1970_pasok_5_desc:0 "A central programme office can bring ministries into a common plan. Its effectiveness will depend on technical competence and on whether coordination becomes a substitute for consultation."
 COLDWAR_GRE_1970_pasok_6:0 "Recognise the Civil-War Excluded"
 COLDWAR_GRE_1970_pasok_6_desc:0 "The legacy of the civil war continues to divide citizenship and opportunity. Recognising those excluded from the national settlement would broaden reconciliation while challenging interests that benefited from the old boundaries."
 COLDWAR_GRE_1970_pasok_7_programme_effects_tt:0 "Implemented programme effects:\nFactory output: +6%\nProductivity growth: +3%\nSocial spending cost: +8%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_7:0 "Social Investment on the Mainland"
 COLDWAR_GRE_1970_pasok_7_desc:0 "Social investment on the mainland can link public provision to productive employment and regional development. The commitment requires a revenue base capable of sustaining services beyond the first expansion of spending."
 COLDWAR_GRE_1970_pasok_8_programme_effects_tt:0 "Implemented programme effects:\nResearch speed: +4%\nSocial spending cost: +8%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_8:0 "Universal Public Provision"
 COLDWAR_GRE_1970_pasok_8_desc:0 "Universal provision offers common public services rather than a system organised around political or occupational privilege. Its reach will demand dependable staffing, administration and a budget that can carry the commitment."
 COLDWAR_GRE_1970_pasok_9_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +1.8%\nSocial spending cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_9:0 "Targeted Rural Transfers"
 COLDWAR_GRE_1970_pasok_9_desc:0 "Targeted rural transfers concentrate support where household security and access to services remain weakest. The programme can address immediate need while leaving the government responsible for fair selection and effective delivery."
 COLDWAR_GRE_1970_pasok_10_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nSocial spending cost: -3%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_10:0 "Build a National Health Network"
 COLDWAR_GRE_1970_pasok_10_desc:0 "A national health network must connect local access to hospitals, trained staff and dependable supplies. Building those links can improve the value of public spending and make social reform visible beyond the capital."
 COLDWAR_GRE_1970_pasok_11_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nProductivity growth: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_11:0 "Cooperative Farm Services"
 COLDWAR_GRE_1970_pasok_11_desc:0 "Cooperative farm services give rural producers access to expertise and shared facilities. Their contribution to the social programme lies in stronger livelihoods rather than dependence on repeated emergency assistance."
 COLDWAR_GRE_1970_pasok_12_programme_effects_tt:0 "Implemented programme effects:\nTax revenue: +3.5%\nCorporate tax revenue: +2.5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_12:0 "Pay for the Social Contract"
 COLDWAR_GRE_1970_pasok_12_desc:0 "The social contract must be financed through revenues the state can collect. A credible settlement will expose the cost of commitments and ask supporters to accept responsibility for maintaining them."
 COLDWAR_GRE_1970_pasok_13_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_13:0 "Negotiate the Western Relationship"
 COLDWAR_GRE_1970_pasok_13_desc:0 "Renegotiating the Western relationship offers a way to reconcile cooperation with greater national control. The government must identify which commitments serve Greek interests and which terms require a new agreement."
 COLDWAR_GRE_1970_pasok_14_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: +7%\nProduction efficiency cap: -0.7%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_14:0 "Pursue Non-Aligned Autonomy"
 COLDWAR_GRE_1970_pasok_14_desc:0 "Non-aligned autonomy seeks room to manoeuvre beyond inherited security expectations. Wider relationships may strengthen bargaining power, but cannot automatically replace the capabilities and markets supplied by established partners."
 COLDWAR_GRE_1970_pasok_15:0 "Bargain over Base Access"
 COLDWAR_GRE_1970_pasok_15_desc:0 "Base access is a tangible bargaining instrument, not merely a symbol of dependence. Negotiations must settle the cooperation Greece will provide and the terms its partner is prepared to accept."
 COLDWAR_GRE_1970_pasok_16:0 "Diversify Trade Partners"
 COLDWAR_GRE_1970_pasok_16_desc:0 "Diversifying trade partners can widen outlets for Greek production and reduce reliance on one political channel. New commercial relationships still require viable agreements and businesses able to use them."
 COLDWAR_GRE_1970_pasok_17:0 "Change that Can Be Financed"
 COLDWAR_GRE_1970_pasok_17_desc:0 "Change that cannot be financed will disappoint the groups that brought it to government. Consolidating the programme means linking social commitments to productive capacity and a dependable public revenue base."
 COLDWAR_GRE_1970_pasok_18_programme_effects_tt:0 "Implemented programme effects:\nBureaucracy cost: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_18:0 "Regional Universities and Skills"
 COLDWAR_GRE_1970_pasok_18_desc:0 "Regional universities and technical skills can spread opportunity beyond established urban centres. Education will support social mobility most effectively when it connects to local needs and productive employment."
 COLDWAR_GRE_1970_pasok_19_programme_effects_tt:0 "Implemented programme effects:\nResearch speed: +2.5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_19:0 "Democratic Social Transformation"
 COLDWAR_GRE_1970_pasok_19_desc:0 "Democratic social transformation must leave institutions that can outlast an electoral surge. The completed programme will be judged by public services, productive opportunity and the freedom of citizens to challenge their government."
 COLDWAR_GRE_1970_kke_0:0 "The KKE Enters Government"
 COLDWAR_GRE_1970_kke_0_desc:0 "A KKE government would bring demands long excluded from official power into the cabinet. Its first decisions must define how socialist ambitions relate to political pluralism and the institutions of the republic."
 COLDWAR_GRE_1970_kke_1:0 "Settle the Civil-War Legacy"
 COLDWAR_GRE_1970_kke_1_desc:0 "The civil-war legacy cannot be settled by replacing one set of exclusions with another. A new agreement must address return, recognition and political rights in terms that can endure beyond the governing party."
 COLDWAR_GRE_1970_kke_2_programme_effects_tt:0 "Implemented programme effects:\nStability: +5%\nPolitical power gain: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_2:0 "A Popular Democratic Coalition"
 COLDWAR_GRE_1970_kke_2_desc:0 "A popular democratic coalition can unite the left with other supporters of constitutional change. Shared authority will require compromise, but can give a socialist programme a wider and more resilient mandate."
 COLDWAR_GRE_1970_kke_3_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +8%\nStability: -3%\nPolice cost: +6%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_3:0 "A Single-Party Vanguard"
 COLDWAR_GRE_1970_kke_3_desc:0 "A single-party vanguard would give the KKE a more concentrated instrument of transformation. It would also close the space in which allies and independent workers' organisations could contest the leadership's decisions."
 COLDWAR_GRE_1970_kke_4_programme_effects_tt:0 "Implemented programme effects:\nProductivity growth: +2.5%\nSocial spending cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_4:0 "Independent Trade Unions"
 COLDWAR_GRE_1970_kke_4_desc:0 "Independent trade unions can represent workers even when their interests conflict with the cabinet's plan. Accepting that autonomy would distinguish social ownership from administrative control over the workplace."
 COLDWAR_GRE_1970_kke_5_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency growth: +3%\nBureaucracy cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_5:0 "Party Control of the Workplace"
 COLDWAR_GRE_1970_kke_5_desc:0 "Party control of the workplace promises consistent implementation of national priorities. It will narrow independent labour representation and make production disputes questions of political discipline."
 COLDWAR_GRE_1970_kke_6:0 "Determine the Socialist Constitution"
 COLDWAR_GRE_1970_kke_6_desc:0 "A socialist constitution must define ownership and executive authority as well as proclaim a new social order. The chosen settlement will determine how the government deals with disagreement inside the movement it claims to represent."
 COLDWAR_GRE_1970_kke_7_programme_effects_tt:0 "Implemented programme effects:\nFactory output: +8%\nCivilian factory construction speed: +6%\nBureaucracy cost: +5%\nSocial spending cost: +6%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_7:0 "A Programme of Social Ownership"
 COLDWAR_GRE_1970_kke_7_desc:0 "Social ownership must be organised around enterprises able to produce and maintain their equipment. A credible programme will confront investment and administration rather than assume that a change of ownership resolves them."
 COLDWAR_GRE_1970_kke_8_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +2.1%\nBureaucracy cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_8:0 "Worker-Managed Cooperatives"
 COLDWAR_GRE_1970_kke_8_desc:0 "Worker-managed cooperatives place more responsibility with those who organise production locally. Their autonomy can encourage initiative while making coordination and access to investment a continuing national challenge."
 COLDWAR_GRE_1970_kke_9_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +2.4%\nBureaucracy cost: +8%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_9:0 "Central Investment Planning"
 COLDWAR_GRE_1970_kke_9_desc:0 "Central investment planning can concentrate resources on national priorities. Its success depends on reliable information and managers able to respond when local conditions differ from the plan's assumptions."
 COLDWAR_GRE_1970_kke_10_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nProduction efficiency growth: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_10:0 "Elected Factory Councils"
 COLDWAR_GRE_1970_kke_10_desc:0 "Elected factory councils can give workers a direct role in production decisions. Training and clear responsibilities will help them turn democratic participation into practical industrial improvements."
 COLDWAR_GRE_1970_kke_11_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nFactory output: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_11:0 "A State Planning Commission"
 COLDWAR_GRE_1970_kke_11_desc:0 "A state planning commission needs technical staff and dependable accounts. Establishing those capabilities will make coordination more useful than a sequence of directives unsupported by information from enterprises."
 COLDWAR_GRE_1970_kke_12_programme_effects_tt:0 "Implemented programme effects:\nTax revenue: +3%\nEconomic project cost: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_12:0 "Account for the Plan"
 COLDWAR_GRE_1970_kke_12_desc:0 "The plan must account for resources consumed as well as targets announced. Financial scrutiny can reveal waste and strengthen the revenue needed to sustain social ownership."
 COLDWAR_GRE_1970_kke_13_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: +6%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_13:0 "Diversified Socialist Trade"
 COLDWAR_GRE_1970_kke_13_desc:0 "Diversified socialist trade offers alternatives to dependence on a single patron. Commercial relationships must serve the needs of Greek production and preserve room for independent national choices."
 COLDWAR_GRE_1970_kke_14_programme_effects_tt:0 "Implemented programme effects:\nArmy organisation: +1.6%\nForeign influence resistance: -8%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_14:0 "A Soviet Security Orientation"
 COLDWAR_GRE_1970_kke_14_desc:0 "A Soviet security orientation would attach Greece more closely to an external centre of power. It may offer cooperation, but also makes the terms of national autonomy a pressing question for the government."
 COLDWAR_GRE_1970_kke_15:0 "Non-Aligned Commercial Missions"
 COLDWAR_GRE_1970_kke_15_desc:0 "Commercial missions to non-aligned partners can widen the practical reach of the socialist economy. Negotiators must seek workable exchanges rather than assume ideological sympathy is a market for Greek goods."
 COLDWAR_GRE_1970_kke_16:0 "Negotiate an Eastern Accord"
 COLDWAR_GRE_1970_kke_16_desc:0 "An Eastern accord requires explicit agreement on what cooperation will mean. The government will seek terms that support its programme while accepting that the counterpart has interests of its own."
 COLDWAR_GRE_1970_kke_17:0 "A Socialist Economy that Functions"
 COLDWAR_GRE_1970_kke_17_desc:0 "A functioning socialist economy must reward competence and coordinate supply as well as direct ownership. Consolidating those institutions can make the programme less dependent on exceptional political mobilisation."
 COLDWAR_GRE_1970_kke_18_programme_effects_tt:0 "Implemented programme effects:\nBureaucracy cost: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_18:0 "Returnees, Housing and Skills"
 COLDWAR_GRE_1970_kke_18_desc:0 "Returnees need housing and routes into productive employment. Combining practical support with recognition of their rights can make reconciliation part of the economy rather than a symbolic declaration alone."
 COLDWAR_GRE_1970_kke_19_programme_effects_tt:0 "Implemented programme effects:\nResearch speed: +2.5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_kke_19:0 "The Greek Socialist Settlement"
 COLDWAR_GRE_1970_kke_19_desc:0 "The Greek socialist settlement must resolve the relationship between labour, public ownership and political authority. Its institutions will determine whether the programme can reproduce consent after the first revolutionary expectations have faded."
 COLDWAR_GRE_1970_royal_0:0 "Negotiate the King’s Return"
 COLDWAR_GRE_1970_royal_0_desc:0 "The king's return cannot simply restore the situation before the failed counter-coup. A negotiated mandate must define the crown's relationship with parliament and the armed forces before personal authority is reintroduced."
 COLDWAR_GRE_1970_royal_1:0 "A Settlement beyond the Failed Counter-Coup"
 COLDWAR_GRE_1970_royal_1_desc:0 "The counter-coup left competing claims to loyalty and legitimacy. A durable restoration must settle those divisions rather than rely on the hope that royal allegiance will overcome them."
 COLDWAR_GRE_1970_royal_2_programme_effects_tt:0 "Implemented programme effects:\nStability: +5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_2:0 "A Parliamentary Crown"
 COLDWAR_GRE_1970_royal_2_desc:0 "A parliamentary crown would place government in the hands of elected representatives. The monarchy's survival would depend on accepting constitutional limits and serving citizens who do not all share royalist convictions."
 COLDWAR_GRE_1970_royal_3_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +6%\nStability: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_3:0 "A Crown above Parliament"
 COLDWAR_GRE_1970_royal_3_desc:0 "A crown above parliament would retain a more active royal authority. Such a settlement promises direction while reopening the question of who can dismiss a government and on whose mandate."
 COLDWAR_GRE_1970_royal_4_programme_effects_tt:0 "Implemented programme effects:\nBureaucracy cost: -2%\nDaily political power: +0.025/day\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_4:0 "A Politically Neutral Palace"
 COLDWAR_GRE_1970_royal_4_desc:0 "A politically neutral palace can offer continuity without competing with the cabinet. Maintaining that position will require restraint in appointments and an acceptance that elected governments may pursue policies the king dislikes."
 COLDWAR_GRE_1970_royal_5_programme_effects_tt:0 "Implemented programme effects:\nSupply consumption: -2%\nBureaucracy cost: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_5:0 "A Royal Officer Network"
 COLDWAR_GRE_1970_royal_5_desc:0 "A royal officer network could give the palace a dependable instrument within the armed forces. It would also keep military careers entangled with political allegiance and constitutional rivalry."
 COLDWAR_GRE_1970_royal_6:0 "Ratify a Constitutional Settlement"
 COLDWAR_GRE_1970_royal_6_desc:0 "The restoration needs a ratified settlement defining the crown and the government. Public and institutional consent must give that agreement more authority than another understanding between senior politicians and officers."
 COLDWAR_GRE_1970_royal_7_programme_effects_tt:0 "Implemented programme effects:\nTax revenue: +4%\nCivilian factory construction speed: +6%\nBureaucracy cost: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_7:0 "A Royal Development Programme"
 COLDWAR_GRE_1970_royal_7_desc:0 "A royal development programme must justify itself through productive investment rather than ceremony. The cabinet will link regional opportunity and strategic projects to the fiscal responsibilities of the restored state."
 COLDWAR_GRE_1970_royal_8_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +1.8%\nBureaucracy cost: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_8:0 "Regional Enterprise Funds"
 COLDWAR_GRE_1970_royal_8_desc:0 "Regional enterprise funds can spread investment beyond established commercial circles. Professional selection will determine whether they support productive local initiative or a new system of royal patronage."
 COLDWAR_GRE_1970_royal_9_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +2.1%\nBureaucracy cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_9:0 "Palace-Directed Strategic Capital"
 COLDWAR_GRE_1970_royal_9_desc:0 "Palace-directed strategic capital offers coordinated support to selected national enterprises. Concentration can accelerate projects, but their privileged access will require scrutiny if the programme is to retain public confidence."
 COLDWAR_GRE_1970_royal_10_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nProductivity growth: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_10:0 "Rural Roads and Small Business"
 COLDWAR_GRE_1970_royal_10_desc:0 "Rural roads and small businesses can make the restoration's promises visible in provincial life. The programme will connect local enterprise to markets rather than treat support for the countryside as a courtly favour."
 COLDWAR_GRE_1970_royal_11_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nCorporate tax revenue: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_11:0 "Audited National Enterprises"
 COLDWAR_GRE_1970_royal_11_desc:0 "Audited national enterprises can preserve strategic capabilities while improving their management. Public accounts will help distinguish useful state investment from activities protected by proximity to the palace."
 COLDWAR_GRE_1970_royal_12_programme_effects_tt:0 "Implemented programme effects:\nTax revenue: +3%\nBureaucracy cost: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_12:0 "Publish the Civil List"
 COLDWAR_GRE_1970_royal_12_desc:0 "Publishing the civil list makes the cost of the monarchy a matter for constitutional government. Transparency can strengthen consent by giving citizens and parliament a clear account of obligations previously left obscure."
 COLDWAR_GRE_1970_royal_13_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_13:0 "A Parliamentary European Course"
 COLDWAR_GRE_1970_royal_13_desc:0 "A parliamentary European course would anchor the restored crown in a wider constitutional relationship. Its credibility depends on elected institutions exercising the authority promised in the national settlement."
 COLDWAR_GRE_1970_royal_14_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: +5%\nPolitical power gain: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_14:0 "An Autonomous Royal Diplomacy"
 COLDWAR_GRE_1970_royal_14_desc:0 "Autonomous royal diplomacy would give the palace a more independent international role. Its practical appeal must be weighed against the risk of presenting partners with competing centres of Greek foreign policy."
 COLDWAR_GRE_1970_royal_15:0 "A Constitutional Foreign Mandate"
 COLDWAR_GRE_1970_royal_15_desc:0 "Foreign policy requires a constitutional mandate that survives changes of cabinet. Defining that authority can make the crown's external role less dependent on personal contacts and private understandings."
 COLDWAR_GRE_1970_royal_16:0 "Negotiate Bilateral Guarantees"
 COLDWAR_GRE_1970_royal_16_desc:0 "Bilateral guarantees can support the restored state's security if their terms are explicit. Negotiators must distinguish foreign reassurance from commitments that constrain future Greek governments."
 COLDWAR_GRE_1970_royal_17:0 "A Crown with Public Consent"
 COLDWAR_GRE_1970_royal_17_desc:0 "Public consent is the foundation the restored monarchy cannot supply for itself. Consolidating the settlement must show that the crown's institutions serve the country beyond its committed supporters."
 COLDWAR_GRE_1970_royal_18_programme_effects_tt:0 "Implemented programme effects:\nBureaucracy cost: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_18:0 "A Civil Service beyond Patronage"
 COLDWAR_GRE_1970_royal_18_desc:0 "A professional civil service can give constitutional government continuity independent of palace and party appointments. Merit and clear procedure will reduce the political value of personal access."
 COLDWAR_GRE_1970_royal_19_programme_effects_tt:0 "Implemented programme effects:\nResearch speed: +2.5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_royal_19:0 "Renew the Constitutional Mandate"
 COLDWAR_GRE_1970_royal_19_desc:0 "Renewing the constitutional mandate will test whether the restoration has become a stable national settlement. The crown must remain compatible with lawful opposition, accountable finances and governments chosen through the agreed institutions."
 COLDWAR_GRE_1970_economy_0:0 "Survey the National Economy"
 COLDWAR_GRE_1970_economy_0_desc:0 "The national accounts reveal an economy shaped by shipping, tourism, construction and uneven industrial development. A serious investment strategy must begin with the productive capacity already present rather than promises every ministry hopes to finance."
 COLDWAR_GRE_1970_economy_1:0 "Map the Regional Gaps"
 COLDWAR_GRE_1970_economy_1_desc:0 "Athens has drawn in capital and skilled workers while provincial markets remain less connected. Mapping those gaps will identify where transport, training and local enterprise can turn regional development into productive investment."
 COLDWAR_GRE_1970_economy_2_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +2.45%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_economy_2:0 "Export Manufacturing"
 COLDWAR_GRE_1970_economy_2_desc:0 "Export manufacturers need consistent standards, credit and access to foreign customers. Giving them priority can broaden Greece's earnings beyond shipping and tourism, though it also exposes industrial employment to external demand."
 COLDWAR_GRE_1970_economy_3_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +1.8%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_economy_3:0 "Domestic Enterprise Networks"
 COLDWAR_GRE_1970_economy_3_desc:0 "Local suppliers and small firms form the everyday economy of towns beyond the largest industrial centres. Strengthening their networks offers a broader domestic base instead of concentrating every development opportunity in a handful of exporters."
 COLDWAR_GRE_1970_economy_4_programme_effects_tt:0 "Implemented programme effects:\nProductivity growth: +2.5%\nOne 25% research bonus: construction\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_economy_4:0 "Industrial Standards and Skills"
 COLDWAR_GRE_1970_economy_4_desc:0 "Modern equipment is only useful when workers and firms share reliable industrial standards. Technical instruction and common methods will help Greek producers improve quality and make better use of investment."
 COLDWAR_GRE_1970_economy_5_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency growth: +2.5%\nCorporate tax revenue: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_economy_5:0 "SME Credit Guarantees"
 COLDWAR_GRE_1970_economy_5_desc:0 "Small enterprises often lack the security demanded by commercial lenders. Credit guarantees can widen access to working capital, provided professional assessment prevents a useful programme from becoming another channel for favoured borrowers."
 COLDWAR_GRE_1970_economy_6:0 "A Broader Productive Base"
 COLDWAR_GRE_1970_economy_6_desc:0 "A resilient economy needs suppliers, skilled labour and firms capable of reaching more than one market. Bringing the industrial programme together will reduce the dependence of growth on a narrow set of activities."
 COLDWAR_GRE_1970_economy_7:0 "Thessaly and the Rural Economy"
 COLDWAR_GRE_1970_economy_7_desc:0 "The rural economy faces problems that urban credit programmes cannot solve. Thessaly and the agricultural districts need dependable water, veterinary services and routes connecting producers to the towns that buy their output."
 COLDWAR_GRE_1970_economy_8_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +1.5%\nSocial spending cost: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_economy_8:0 "Cooperative Farm Services"
 COLDWAR_GRE_1970_economy_8_desc:0 "Cooperative services allow smaller farms to share equipment, advice and access to markets. Their success depends on accountable management and benefits members can see beyond the annual meeting."
 COLDWAR_GRE_1970_economy_9_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +2.45%\nStability: -1.5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_economy_9:0 "Agribusiness Consolidation"
 COLDWAR_GRE_1970_economy_9_desc:0 "Larger agricultural enterprises can organise processing, transport and investment on a different scale. Consolidation may raise efficiency, but smaller producers will fear losing control of the terms on which they sell."
 COLDWAR_GRE_1970_economy_10_programme_effects_tt:0 "Implemented programme effects:\nLocal productivity growth: +4% in eligible rural states\nOne 25% research bonus: agriculture\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_economy_10:0 "Irrigation and Veterinary Access"
 COLDWAR_GRE_1970_economy_10_desc:0 "Irrigation and veterinary access address losses before crops and livestock ever reach the market. Concentrating these services in the agricultural regions gives rural development a practical foundation rather than another credit announcement."
 COLDWAR_GRE_1970_economy_11_programme_effects_tt:0 "Implemented programme effects:\nLocal construction speed: +4% in eligible rural states\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_economy_11:0 "Agricultural Logistics"
 COLDWAR_GRE_1970_economy_11_desc:0 "A good harvest is worth less if storage and transport fail. Better rural logistics will link farms to processors and towns, making local construction and subsequent investment easier to sustain."
 COLDWAR_GRE_1970_economy_12:0 "Connect the Regional Markets"
 COLDWAR_GRE_1970_economy_12_desc:0 "Regional markets need roads, dependable suppliers and information about demand. Connecting them allows provincial businesses to grow without first moving their activities to the capital."
 COLDWAR_GRE_1970_economy_13_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +1.8%\nSocial spending cost: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_economy_13:0 "Tourism at Scale"
 COLDWAR_GRE_1970_economy_13_desc:0 "Tourism can bring foreign earnings and employment to coastal communities. Expanding it at scale requires decisions about infrastructure and credit that will shape the coast long after the first visitors arrive."
 COLDWAR_GRE_1970_economy_14_programme_effects_tt:0 "Implemented programme effects:\nStability: +3%\nConstruction speed: +0.9%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_economy_14:0 "Protect the Coastline"
 COLDWAR_GRE_1970_economy_14_desc:0 "Coastal development can destroy the landscapes on which its prosperity depends. Protecting shorelines and public access will restrain the most damaging projects while encouraging an industry that can endure beyond a building boom."
 COLDWAR_GRE_1970_economy_15:0 "Regional Airports and Hotels"
 COLDWAR_GRE_1970_economy_15_desc:0 "Hotels and regional airports must serve one another rather than compete for public funds in isolation. Coordinated access can spread visitor spending to districts unable to benefit from the largest gateways alone."
 COLDWAR_GRE_1970_economy_16:0 "Heritage and Island Access"
 COLDWAR_GRE_1970_economy_16_desc:0 "Historic sites and inhabited islands offer more than another stretch of hotel frontage. Reliable access and careful stewardship can support local employment without sacrificing the character that attracts visitors."
 COLDWAR_GRE_1970_economy_17:0 "Invest Beyond the Capital"
 COLDWAR_GRE_1970_economy_17_desc:0 "Investment beyond the capital must reach places where infrastructure and productive opportunity have fallen behind. A regional programme will give provincial communities a stake in national expansion and reduce the inherited geographical imbalance."
 COLDWAR_GRE_1970_economy_18_programme_effects_tt:0 "Implemented programme effects:\nTax revenue: +4%\nReduce corruption by one level, if above the minimum\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_economy_18:0 "Professional Tax Collection"
 COLDWAR_GRE_1970_economy_18_desc:0 "Tax administration should depend on records and professional staff rather than personal connections. Better collection can widen the revenue base and reduce the influence of intermediaries who profit from unequal enforcement."
 COLDWAR_GRE_1970_economy_19_programme_effects_tt:0 "Implemented programme effects:\nFactory output: +2.5%\nProductivity growth: +1.5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_economy_19:0 "A More Resilient Expansion"
 COLDWAR_GRE_1970_economy_19_desc:0 "Export industry, rural services and regional enterprise need to support one another. A more resilient expansion will reward productive capacity and steadily improving skills rather than rely on a succession of exceptional booms."
 COLDWAR_GRE_1970_army_0:0 "Audit the Hellenic Army"
 COLDWAR_GRE_1970_army_0_desc:0 "The army's readiness cannot be measured by its place in government. An honest review must distinguish deployable formations and trained personnel from paper strength sustained by patronage and competing commands."
 COLDWAR_GRE_1970_army_1:0 "Separate Rank from Patronage"
 COLDWAR_GRE_1970_army_1_desc:0 "Promotions have become entangled with the politics of military rule. Separating professional rank from personal allegiance will give capable officers a clearer career and make the army less dependent on competing patrons."
 COLDWAR_GRE_1970_army_2_programme_effects_tt:0 "Implemented programme effects:\nArmy organisation: +2%\nPolitical power gain: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_2:0 "Civilian Defence Oversight"
 COLDWAR_GRE_1970_army_2_desc:0 "Civilian authorities must set defence policy and account for its cost. Oversight can give the army a legitimate national mission while ending the assumption that military responsibility confers a right to govern."
 COLDWAR_GRE_1970_army_3_programme_effects_tt:0 "Implemented programme effects:\nMaximum planning: +6%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_3:0 "A Professional Service Council"
 COLDWAR_GRE_1970_army_3_desc:0 "A professional service council offers an alternative to personal control by senior officers. It must coordinate doctrine and appointments without turning corporate military interests into another permanent political veto."
 COLDWAR_GRE_1970_army_4_programme_effects_tt:0 "Implemented programme effects:\nOne 20% research bonus: command and control equipment\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_4:0 "Publish the Promotion Rules"
 COLDWAR_GRE_1970_army_4_desc:0 "Published promotion rules can make merit more than a promise from headquarters. Clear qualifications and procedures will help officers plan their training and reduce the rewards available to political favour."
 COLDWAR_GRE_1970_army_5_programme_effects_tt:0 "Implemented programme effects:\nArmy experience gain: +5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_5:0 "Merit-Based Officer Boards"
 COLDWAR_GRE_1970_army_5_desc:0 "Merit boards must judge performance and preparation rather than affiliation. A credible selection process will improve the value of training and give professional officers a reason to support institutional reform."
 COLDWAR_GRE_1970_army_6_programme_effects_tt:0 "Implemented programme effects:\nArmy defence: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_6:0 "A Credible Chain of Command"
 COLDWAR_GRE_1970_army_6_desc:0 "Orders must pass through an accepted chain of command rather than rival political networks. Establishing that authority is essential before mobilisation and procurement can become parts of a coherent defence plan."
 COLDWAR_GRE_1970_army_7:0 "A Mainland Defence Review"
 COLDWAR_GRE_1970_army_7_desc:0 "The mainland army must defend ground with the formations and transport it can actually maintain. A review of routes, reserves and likely commitments will turn general security claims into practical requirements."
 COLDWAR_GRE_1970_army_8_programme_effects_tt:0 "Implemented programme effects:\nArmy organisation: +2%\nMaximum planning: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_8:0 "Mobile Reserve Forces"
 COLDWAR_GRE_1970_army_8_desc:0 "Mobile reserves can reinforce threatened sectors without distributing every unit permanently along the frontier. They require dependable transport, communications and commanders trained to concentrate force quickly."
 COLDWAR_GRE_1970_army_9_programme_effects_tt:0 "Implemented programme effects:\nMaximum planning: +8%\nArmy organisation: -0.8%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_9:0 "Prepared Defensive Sectors"
 COLDWAR_GRE_1970_army_9_desc:0 "Prepared sectors offer protection where terrain and limited mobility favour a defensive plan. Engineering and local knowledge can compensate for scarce resources, provided fixed positions do not become a substitute for operational judgment."
 COLDWAR_GRE_1970_army_10_programme_effects_tt:0 "Implemented programme effects:\nSupply consumption: -2.5%\nOne 25% research bonus: command and control equipment\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_10:0 "Modernise Signals and Transport"
 COLDWAR_GRE_1970_army_10_desc:0 "Signals equipment and transport determine whether formations can cooperate beyond their home districts. Modernising these services will make mobilisation and field operations more dependable without pretending that new vehicles alone create a modern army."
 COLDWAR_GRE_1970_army_11_programme_effects_tt:0 "Implemented programme effects:\nSupply consumption: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_11:0 "Dispersed Mobilisation Stores"
 COLDWAR_GRE_1970_army_11_desc:0 "Mobilisation stores are vulnerable when too much is held in too few locations. Dispersed stocks and clear distribution responsibilities can help reservists reach useful readiness when the transport network is under pressure."
 COLDWAR_GRE_1970_army_12:0 "A Funded Mobilisation Plan"
 COLDWAR_GRE_1970_army_12_desc:0 "A mobilisation plan needs funded stores, transport assignments and administrative preparation. Matching those obligations to the budget will make the reserve system a practical instrument rather than an impressive list of names."
 COLDWAR_GRE_1970_army_13_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +1.75%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_13:0 "Domestic Maintenance Capacity"
 COLDWAR_GRE_1970_army_13_desc:0 "Dependence on foreign equipment creates a continuing need for spare parts and skilled repair. Domestic maintenance capacity can keep more existing systems useful while reducing the disruption caused by delayed imports."
 COLDWAR_GRE_1970_army_14_programme_effects_tt:0 "Implemented programme effects:\nArmy organisation: +1.6%\nForeign influence resistance: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_14:0 "Licensed Foreign Systems"
 COLDWAR_GRE_1970_army_14_desc:0 "Foreign systems may offer capabilities that domestic industry cannot supply. Licensing and procurement must include the training and support needed to operate them, with terms the supplier is willing to honour."
 COLDWAR_GRE_1970_army_15_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency growth: +2%\nOne 25% research bonus: small arms\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_15:0 "Repair Workshops and Tooling"
 COLDWAR_GRE_1970_army_15_desc:0 "Repair workshops need machine tools and technicians as much as a formal place in the defence plan. Funding those capabilities can extend equipment life and give the army a more reliable industrial base."
 COLDWAR_GRE_1970_army_16_programme_effects_tt:0 "Implemented programme effects:\nOne 25% research bonus: artillery\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_16:0 "Submit Procurement Contracts"
 COLDWAR_GRE_1970_army_16_desc:0 "A procurement contract must settle price, support and responsibility for delivery. Submitting clear terms gives potential suppliers something they can accept or revise and helps Greece avoid commitments that exceed its means."
 COLDWAR_GRE_1970_army_17:0 "An Army Greece Can Sustain"
 COLDWAR_GRE_1970_army_17_desc:0 "The army's equipment, reserve plans and industrial support must fit the same budget. A sustainable force will preserve readiness without letting procurement promises consume the resources needed to maintain what is already in service."
 COLDWAR_GRE_1970_army_18_programme_effects_tt:0 "Implemented programme effects:\nArmy experience gain: +5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_18:0 "Mountain and Island Exercises"
 COLDWAR_GRE_1970_army_18_desc:0 "Mountain terrain and island deployments pose different demands from a parade-ground exercise. Training under those conditions will expose failures in movement, supply and coordination before a real emergency does."
 COLDWAR_GRE_1970_army_19_programme_effects_tt:0 "Implemented programme effects:\nArmy defence: +2%\nOne 25% research bonus: small arms\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_army_19:0 "A National Defence Doctrine"
 COLDWAR_GRE_1970_army_19_desc:0 "A national defence doctrine should reflect Greek geography and the force Greece can sustain. Bringing operational lessons into a common framework will make the army's separate reforms work together."
 COLDWAR_GRE_1970_navy_0:0 "An Aegean Maritime Review"
 COLDWAR_GRE_1970_navy_0_desc:0 "The Aegean combines commercial lifelines, inhabited islands and difficult waters. A maritime review must distinguish the navy's operational tasks from the broader responsibilities of ports and merchant shipping."
 COLDWAR_GRE_1970_navy_1:0 "Audit the Fleet and Dockyards"
 COLDWAR_GRE_1970_navy_1_desc:0 "Ships on the list are not necessarily ships ready for sea. Reviewing the fleet alongside its dockyards will identify repair needs and the industrial work required to keep the naval programme credible."
 COLDWAR_GRE_1970_navy_2_programme_effects_tt:0 "Implemented programme effects:\nNaval coordination: +6%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_navy_2:0 "Sea Denial in the Aegean"
 COLDWAR_GRE_1970_navy_2_desc:0 "A sea-denial strategy concentrates on making hostile operations costly in the Aegean. Submarines, local knowledge and coordinated attacks can serve that mission without attempting to match a larger navy ship for ship."
 COLDWAR_GRE_1970_navy_3_programme_effects_tt:0 "Implemented programme effects:\nNaval coordination: +4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_navy_3:0 "Escort and Sea-Lane Protection"
 COLDWAR_GRE_1970_navy_3_desc:0 "Merchant traffic and island communications require escort and reliable sea lanes. Giving protection priority will shape training and procurement around the movements Greece cannot afford to interrupt."
 COLDWAR_GRE_1970_navy_4_programme_effects_tt:0 "Implemented programme effects:\nOne 25% research bonus: submarines\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_navy_4:0 "Submarine and Torpedo Training"
 COLDWAR_GRE_1970_navy_4_desc:0 "Submarine and torpedo operations reward disciplined preparation and an intimate knowledge of local waters. Targeted training will turn specialised equipment into a more effective part of the chosen maritime mission."
 COLDWAR_GRE_1970_navy_5_programme_effects_tt:0 "Implemented programme effects:\nOne 25% research bonus: frigates\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_navy_5:0 "Convoy Escort Coordination"
 COLDWAR_GRE_1970_navy_5_desc:0 "Convoy protection depends on cooperation between escorts, merchant captains and shore commands. Common procedures can reduce confusion and make limited escort forces more useful over repeated voyages."
 COLDWAR_GRE_1970_navy_6:0 "A Fleet Mission within Means"
 COLDWAR_GRE_1970_navy_6_desc:0 "The fleet cannot pursue every mission with equal weight. Defining a task within its means will help commanders choose the training, support and procurement that matter most."
 COLDWAR_GRE_1970_navy_7:0 "Connect the Island Ports"
 COLDWAR_GRE_1970_navy_7_desc:0 "Island ports are part of the national transport system as well as potential naval support points. Connecting them more reliably can serve civilian communities while improving the practical reach of maritime administration."
 COLDWAR_GRE_1970_navy_8_programme_effects_tt:0 "Implemented programme effects:\nNaval coordination: +5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_navy_8:0 "Concentrate at Major Bases"
 COLDWAR_GRE_1970_navy_8_desc:0 "Concentrating resources at major bases offers deeper repair and more efficient support. It also makes the fleet more dependent on a smaller number of facilities whose disruption would be difficult to absorb."
 COLDWAR_GRE_1970_navy_9_programme_effects_tt:0 "Implemented programme effects:\nNaval coordination: +4%\nConstruction speed: -0.45%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_navy_9:0 "Disperse Island Support"
 COLDWAR_GRE_1970_navy_9_desc:0 "Distributed island support can keep ships operating farther from the largest bases. The arrangement offers resilience, but requires a wider network of supplies and staff to remain genuinely useful."
 COLDWAR_GRE_1970_navy_10:0 "Expand Existing Naval Facilities"
 COLDWAR_GRE_1970_navy_10_desc:0 "Existing bases already have the crews and connections on which an expansion can build. Improving those facilities will deepen naval support without scattering capital across projects the fleet cannot maintain."
 COLDWAR_GRE_1970_navy_11_programme_effects_tt:0 "Implemented programme effects:\nNaval range: +5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_navy_11:0 "Fuel and Repair across the Islands"
 COLDWAR_GRE_1970_navy_11_desc:0 "Fuel and repair services across the islands can reduce the need for repeated returns to a major base. Their value depends on reliable replenishment and technicians able to handle the work assigned to them."
 COLDWAR_GRE_1970_navy_12:0 "Sustain the Maritime Network"
 COLDWAR_GRE_1970_navy_12_desc:0 "A maritime network needs regular maintenance and clear responsibility for supplies. Bringing the separate facilities into a funded plan will help prevent the weakest link from limiting the whole fleet."
 COLDWAR_GRE_1970_navy_13_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +1.5%\nBureaucracy cost: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_navy_13:0 "Merchant Shipping Incentives"
 COLDWAR_GRE_1970_navy_13_desc:0 "Merchant shipping connects Greece to customers, finance and seaborne employment. Incentives can strengthen that industry, though public support must have a clearer purpose than rewarding owners who would invest abroad anyway."
 COLDWAR_GRE_1970_navy_14_programme_effects_tt:0 "Implemented programme effects:\nProduction efficiency cap: +1.75%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_navy_14:0 "Bind Support to Domestic Investment"
 COLDWAR_GRE_1970_navy_14_desc:0 "Public support for shipping should bring work and skills into the domestic economy. Tying assistance to training and local orders can turn commercial success into a stronger maritime industrial base."
 COLDWAR_GRE_1970_navy_15_programme_effects_tt:0 "Implemented programme effects:\nOffice income tax revenue: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_navy_15:0 "A Competitive Shipping Registry"
 COLDWAR_GRE_1970_navy_15_desc:0 "A competitive registry must offer dependable administration and commercially credible rules. Improving those services can strengthen the revenue Greece receives from an industry whose activities cross many jurisdictions."
 COLDWAR_GRE_1970_navy_16_programme_effects_tt:0 "Implemented programme effects:\nDockyard output: +4%\nOne 25% research bonus: naval engines\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_navy_16:0 "Domestic Training and Yard Orders"
 COLDWAR_GRE_1970_navy_16_desc:0 "Training and orders placed with Greek yards can spread the benefits of commercial shipping. A predictable flow of work will help local suppliers and workers develop skills useful to both civilian and naval projects."
 COLDWAR_GRE_1970_navy_17:0 "Civil-Military Maritime Planning"
 COLDWAR_GRE_1970_navy_17_desc:0 "Commercial shipping and naval support draw on many of the same skills and facilities. Their coordination belongs in the practical fleet programme rather than a separate round of ministerial ceremony."
 COLDWAR_GRE_1970_navy_18_programme_effects_tt:0 "Implemented programme effects:\nNaval organisation recovery: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_navy_18:0 "Damage Control and Rescue"
 COLDWAR_GRE_1970_navy_18_desc:0 "Damage control and rescue decide whether an incident becomes a disaster. Training crews and shore services together can improve recovery and protect the people on whom maritime operations depend."
 COLDWAR_GRE_1970_navy_19_programme_effects_tt:0 "Implemented programme effects:\nDockyard output: +4%\nOne 25% research bonus: frigates\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_navy_19:0 "A Sustainable Hellenic Fleet"
 COLDWAR_GRE_1970_navy_19_desc:0 "A sustainable Hellenic fleet must connect its ships, yards and civilian maritime partners. The programme will turn their shared industrial needs into dependable output and a manageable path for future naval construction."
 COLDWAR_GRE_1970_air_0:0 "Audit Air Readiness"
 COLDWAR_GRE_1970_air_0_desc:0 "Aircraft inventories conceal differences in crew preparation, maintenance and operational practice. A readiness audit will bring commanders and technicians together to identify weaknesses and turn their findings into lessons for the air force."
 COLDWAR_GRE_1970_air_1_radar_tt:0 "Build one radar-station level in an eligible owned and controlled state. Pay 0.25% of current GDP only when the funded project is implemented."
 COLDWAR_GRE_1970_air_1:0 "Map Airfield Vulnerabilities"
 COLDWAR_GRE_1970_air_1_desc:0 "Airfields and their approaches expose the force to different threats. Mapping those vulnerabilities must lead to practical warning coverage, giving controllers time to react instead of leaving another report in headquarters."
 COLDWAR_GRE_1970_air_2_programme_effects_tt:0 "Implemented programme effects:\nAir mission efficiency: +3.9%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_2:0 "Air Defence First"
 COLDWAR_GRE_1970_air_2_desc:0 "Air defence will take precedence in planning and training. Concentrating on interception and the protection of national airspace gives squadrons a demanding but coherent mission within the resources available."
 COLDWAR_GRE_1970_air_3_programme_effects_tt:0 "Implemented programme effects:\nAir mission efficiency: +2.6%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_3:0 "A Balanced Strike Force"
 COLDWAR_GRE_1970_air_3_desc:0 "A balanced strike force must support national defence without neglecting offensive coordination. Training and support will be organised around the tasks the same limited squadrons may have to perform in succession."
 COLDWAR_GRE_1970_air_4_programme_effects_tt:0 "Implemented programme effects:\nOne 25% research bonus: electronics\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_4:0 "Radar and Interception Drills"
 COLDWAR_GRE_1970_air_4_desc:0 "Radar operators, controllers and pilots must share a common understanding of an interception. Repeated drills will improve the link between detecting a threat and bringing aircraft into a useful position."
 COLDWAR_GRE_1970_air_5_programme_effects_tt:0 "Implemented programme effects:\nOne 25% research bonus: air to ground weapons\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_5:0 "Joint Strike Coordination"
 COLDWAR_GRE_1970_air_5_desc:0 "Strike aircraft cannot provide dependable support if ground and air commands plan separately. Joint procedures will make target information and timing part of the same operational picture."
 COLDWAR_GRE_1970_air_6:0 "A Mission for Every Squadron"
 COLDWAR_GRE_1970_air_6_desc:0 "Each squadron needs a role that its aircraft, crews and support can fulfil. Assigning those missions clearly will allow training and maintenance to serve an operational purpose instead of competing prestige projects."
 COLDWAR_GRE_1970_air_7:0 "Build a Technical Training Base"
 COLDWAR_GRE_1970_air_7_desc:0 "Technical education is a continuing requirement of an air force, not a preliminary to buying aircraft. Building that training base will give maintenance and support services a stronger foundation."
 COLDWAR_GRE_1970_air_8_programme_effects_tt:0 "Implemented programme effects:\nAir mission efficiency: +2.6%\nResearch speed: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_8:0 "Train at Home"
 COLDWAR_GRE_1970_air_8_desc:0 "Training at home can build institutional knowledge that stays with the force. Developing instructors and facilities locally will reduce reliance on courses whose availability depends on a foreign partner."
 COLDWAR_GRE_1970_air_9_programme_effects_tt:0 "Implemented programme effects:\nAir mission efficiency: +3.25%\nForeign influence resistance: -3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_9:0 "Exchange Training Abroad"
 COLDWAR_GRE_1970_air_9_desc:0 "Foreign training can expose crews to methods and equipment Greece cannot reproduce immediately. Exchange arrangements must still serve a national curriculum and leave skills behind when visiting instructors depart."
 COLDWAR_GRE_1970_air_10_programme_effects_tt:0 "Implemented programme effects:\nAir accident chance: -3%\nOne 25% research bonus: air engines\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_10:0 "Airframe and Engine Workshops"
 COLDWAR_GRE_1970_air_10_desc:0 "Airframes and engines need specialised workshops if serviceability is to improve. Investing in their staff and tooling will help the force gain more useful flying time from equipment it already owns."
 COLDWAR_GRE_1970_air_11_programme_effects_tt:0 "Implemented programme effects:\nAir accident chance: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_11:0 "Negotiate Instructor Access"
 COLDWAR_GRE_1970_air_11_desc:0 "Instructor access requires an agreement that benefits both parties. Clear terms on training and support can improve Greek practice without confusing an advisory arrangement with a delivery of aircraft."
 COLDWAR_GRE_1970_air_12:0 "Ground Crews before Prestige"
 COLDWAR_GRE_1970_air_12_desc:0 "Ground crews determine how much of the fleet can fly on an ordinary day. Giving their training priority will favour dependable availability over acquisitions whose support requirements have been neglected."
 COLDWAR_GRE_1970_air_13_programme_effects_tt:0 "Implemented programme effects:\nAir mission efficiency: +3.25%\nConstruction speed: -0.45%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_13:0 "Disperse Existing Airfields"
 COLDWAR_GRE_1970_air_13_desc:0 "Dispersing existing airfields can make the force harder to interrupt. The benefit depends on maintaining fuel, communications and crews at locations that must still operate as parts of one service."
 COLDWAR_GRE_1970_air_14_programme_effects_tt:0 "Implemented programme effects:\nAir mission efficiency: +1.95%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_14:0 "Concentrate Training Resources"
 COLDWAR_GRE_1970_air_14_desc:0 "Concentrated training resources can give instructors and technical schools the depth they lack when spread too thinly. The choice favours strong common standards over a wider but less developed network."
 COLDWAR_GRE_1970_air_15_programme_effects_tt:0 "Implemented programme effects:\nAir accident chance: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_15:0 "Shelters, Fuel and Repair"
 COLDWAR_GRE_1970_air_15_desc:0 "Shelters, fuel and repair arrangements protect the work that makes aircraft operational. Preparing those services will help squadrons continue flying when their normal routines are disrupted."
 COLDWAR_GRE_1970_air_16_programme_effects_tt:0 "Implemented programme effects:\nOne 25% research bonus: electronics\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_16:0 "A Common Training Centre"
 COLDWAR_GRE_1970_air_16_desc:0 "A common training centre can bring pilots, controllers and technicians into regular contact. Shared instruction will improve the understanding of problems that otherwise remain hidden between separate branches."
 COLDWAR_GRE_1970_air_17:0 "Measure Operational Availability"
 COLDWAR_GRE_1970_air_17_desc:0 "Operational availability must be measured against consistent standards. Recording how many aircraft and crews can actually undertake their assigned mission will give procurement and maintenance a firmer basis."
 COLDWAR_GRE_1970_air_18_programme_effects_tt:0 "Implemented programme effects:\nEconomic project cost: -2%\nOne 25% research bonus: aircraft\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_18:0 "Secure a Procurement Budget"
 COLDWAR_GRE_1970_air_18_desc:0 "Procurement needs a budget that includes support and the demands of the chosen missions. Securing that framework will make future decisions more disciplined than an intermittent contest for prestige aircraft."
 COLDWAR_GRE_1970_air_19_programme_effects_tt:0 "Implemented programme effects:\nAir accident chance: -3%\nOne 25% research bonus: air engines\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_air_19:0 "Aircraft that Can Be Maintained"
 COLDWAR_GRE_1970_air_19_desc:0 "An aircraft is useful only as long as the force can train its crews and maintain it. Consolidating the support programme will favour equipment that can deliver dependable service under Greek conditions."
 COLDWAR_GRE_1970_foreign_0:0 "Review the Treaty Commitments"
 COLDWAR_GRE_1970_foreign_0_desc:0 "Greece's commitments belong to different institutions with different obligations. A careful review will help the government distinguish defence cooperation, diplomatic standing and commercial access before negotiating changes."
 COLDWAR_GRE_1970_foreign_1:0 "Separate NATO from the Council of Europe"
 COLDWAR_GRE_1970_foreign_1_desc:0 "Military cooperation does not settle the question of civil liberties. Separating NATO's security role from the Council of Europe's political standards will clarify which disputes each relationship can address."
 COLDWAR_GRE_1970_foreign_2_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: +6%\nPolitical power gain: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_2:0 "Meet Human-Rights Benchmarks"
 COLDWAR_GRE_1970_foreign_2_desc:0 "International confidence cannot be restored by assurances alone. Meeting human-rights benchmarks will require changes that foreign observers and Greek citizens can recognise in the conduct of the state."
 COLDWAR_GRE_1970_foreign_3_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +4%\nForeign influence resistance: -4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_3:0 "Retain the Security Exceptions"
 COLDWAR_GRE_1970_foreign_3_desc:0 "The government will retain broad security exceptions in its dealings with critics. This preserves freedom of action for the security apparatus while making a wider diplomatic rehabilitation harder to secure."
 COLDWAR_GRE_1970_foreign_4_programme_effects_tt:0 "Implemented programme effects:\nBureaucracy cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_4:0 "Invite Independent Monitoring"
 COLDWAR_GRE_1970_foreign_4_desc:0 "Independent monitoring gives partners a way to judge changes for themselves. Inviting scrutiny will test the sincerity of reform and the government's willingness to accept findings it may dislike."
 COLDWAR_GRE_1970_foreign_5_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: -2%\nDaily political power: +0.025/day\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_5:0 "Account for Continued Censure"
 COLDWAR_GRE_1970_foreign_5_desc:0 "Continued censure has political and commercial consequences that ministries cannot wish away. Accounting for those costs will make the choice to retain exceptional powers an explicit national commitment."
 COLDWAR_GRE_1970_foreign_6:0 "A Credible European Dossier"
 COLDWAR_GRE_1970_foreign_6_desc:0 "A credible European dossier must rest on changes made at home and an accepted response abroad. The government will present its case for rehabilitation without treating a Greek declaration as another country's consent."
 COLDWAR_GRE_1970_foreign_7:0 "Negotiate the American Relationship"
 COLDWAR_GRE_1970_foreign_7_desc:0 "The American relationship combines security, access and unequal bargaining power. Reviewing it allows Greece to decide which forms of cooperation are worth the obligations attached to them."
 COLDWAR_GRE_1970_foreign_8_programme_effects_tt:0 "Implemented programme effects:\nArmy organisation: +1.2%\nForeign influence resistance: -4%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_8:0 "Base Access for Written Terms"
 COLDWAR_GRE_1970_foreign_8_desc:0 "Base access should rest on terms both governments can identify and defend. Written arrangements can exchange cooperation for clearer commitments, rather than leave every obligation to competing assumptions."
 COLDWAR_GRE_1970_foreign_9_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: +7%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_9:0 "Greater Operational Autonomy"
 COLDWAR_GRE_1970_foreign_9_desc:0 "Greater operational autonomy would give Greek commands more control over national forces. It also requires the government to assume responsibilities previously shared with a powerful partner."
 COLDWAR_GRE_1970_foreign_10_programme_effects_tt:0 "Implemented programme effects:\nSupply consumption: -1.5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_10:0 "A Reciprocal Access Agreement"
 COLDWAR_GRE_1970_foreign_10_desc:0 "Reciprocity gives an access agreement a firmer political foundation. The government will seek explicit American acceptance of terms that define what each side receives and what Greece is prepared to provide."
 COLDWAR_GRE_1970_foreign_11_programme_effects_tt:0 "Implemented programme effects:\nArmy defence: +1.5%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_11:0 "National Command Arrangements"
 COLDWAR_GRE_1970_foreign_11_desc:0 "National command arrangements must translate political autonomy into workable orders. Establishing those responsibilities can reduce ambiguity without pretending that every capability supplied by partners is already available domestically."
 COLDWAR_GRE_1970_foreign_12:0 "Document What Partners Accepted"
 COLDWAR_GRE_1970_foreign_12_desc:0 "Negotiated commitments are useful only when their terms are understood across government. A common diplomatic record will distinguish accepted obligations from aspirations still awaiting an answer."
 COLDWAR_GRE_1970_foreign_13_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_13:0 "Reopen the Balkan Channels"
 COLDWAR_GRE_1970_foreign_13_desc:0 "Balkan neighbours offer channels beyond Greece's most familiar Western relationships. Reopening contact can widen commercial and diplomatic options without requiring every dispute to be settled at once."
 COLDWAR_GRE_1970_foreign_14_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_14:0 "Mediterranean Commercial Diplomacy"
 COLDWAR_GRE_1970_foreign_14_desc:0 "Mediterranean commercial diplomacy should connect ports, shipping and producers to practical opportunities. Its success will depend on agreements businesses can use rather than declarations ministers can celebrate."
 COLDWAR_GRE_1970_foreign_15_programme_effects_tt:0 "Implemented programme effects:\nCorporate tax revenue: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_15:0 "Propose Trade with Yugoslavia"
 COLDWAR_GRE_1970_foreign_15_desc:0 "Trade with Yugoslavia offers a regional channel with its own political and commercial advantages. Greece will propose terms for a reciprocal relationship, leaving the counterpart free to decide what it can accept."
 COLDWAR_GRE_1970_foreign_16_programme_effects_tt:0 "Implemented programme effects:\nOffice income tax revenue: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_16:0 "Open Multi-Partner Shipping Talks"
 COLDWAR_GRE_1970_foreign_16_desc:0 "Shipping talks with several partners can reduce dependence on one diplomatic channel. The aim is a network of usable commercial relationships rather than an exclusive alignment disguised as a trade agreement."
 COLDWAR_GRE_1970_foreign_17:0 "A Foreign Policy that Can Be Delivered"
 COLDWAR_GRE_1970_foreign_17_desc:0 "Foreign policy must be measured by commitments that partners actually honour. Consolidating the diplomatic programme will help the government concentrate effort on relationships capable of producing practical results."
 COLDWAR_GRE_1970_foreign_18_programme_effects_tt:0 "Implemented programme effects:\nForeign influence resistance: +3%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_18:0 "Fund the Diplomatic Service"
 COLDWAR_GRE_1970_foreign_18_desc:0 "Diplomats and commercial officials need the resources to follow negotiations beyond the first meeting. Funding the service will give Greece the staff and expertise required to defend its interests consistently."
 COLDWAR_GRE_1970_foreign_19_programme_effects_tt:0 "Implemented programme effects:\nEconomic project cost: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_foreign_19:0 "Implement Negotiated Commitments"
 COLDWAR_GRE_1970_foreign_19_desc:0 "Implementation brings diplomatic promises into domestic administration. Ministries must provide the resources and procedures that accepted agreements require, while avoiding commitments Greece never secured from its partners."
 COLDWAR_GRE_1970_cyprus_0:0 "The Cyprus Policy Dossier"
 COLDWAR_GRE_1970_cyprus_0_desc:0 "Cyprus policy reaches into Greek command networks, relations with the guarantors and the sovereignty of another state. A common dossier will bring those responsibilities together before competing actors pursue contradictory courses."
 COLDWAR_GRE_1970_cyprus_1:0 "Review the Officer Mission"
 COLDWAR_GRE_1970_cyprus_1_desc:0 "The Greek officer mission affects both training and political authority on Cyprus. Reviewing its role must distinguish legitimate military cooperation from networks seeking to determine the island's government."
 COLDWAR_GRE_1970_cyprus_2:0 "Support Civilian Control of the Guard"
 COLDWAR_GRE_1970_cyprus_2_desc:0 "A National Guard answerable to civilian authority offers a more dependable basis for Greek cooperation. Athens will seek an agreement supporting that principle while leaving Nicosia responsible for its own decisions."
 COLDWAR_GRE_1970_cyprus_3:0 "Encourage the Coup Networks"
 COLDWAR_GRE_1970_cyprus_3_desc:0 "Encouraging coup networks would place Greek influence behind a challenge to the Cypriot presidency. The choice risks replacing a difficult diplomatic relationship with a crisis whose course Athens cannot fully control."
 COLDWAR_GRE_1970_cyprus_4:0 "A Written Non-Interference Protocol"
 COLDWAR_GRE_1970_cyprus_4_desc:0 "A written non-interference protocol can give civilian authorities a clearer basis for trust. The arrangement must define the mission's limits and receive Cypriot agreement if it is to change practice."
 COLDWAR_GRE_1970_cyprus_5:0 "Submit a Covert Sponsorship Proposal"
 COLDWAR_GRE_1970_cyprus_5_desc:0 "Covert sponsorship requires a counterpart willing to act, not merely a declaration from Athens. Submitting the proposal commits Greece to a dangerous political course without guaranteeing the outcome it seeks."
 COLDWAR_GRE_1970_cyprus_6:0 "Record the Actual Mission Outcome"
 COLDWAR_GRE_1970_cyprus_6_desc:0 "The officer mission may produce cooperation, refusal or a disputed political outcome. Greek policy must respond to what actually happened rather than describe an unanswered proposal as an accomplished agreement."
 COLDWAR_GRE_1970_cyprus_7:0 "Record the First Guarantor Response"
 COLDWAR_GRE_1970_cyprus_7_desc:0 "The first substantive guarantor response changes the diplomatic setting of the crisis. Athens must assess that action while keeping open the channels through which other governments may still intervene or negotiate."
 COLDWAR_GRE_1970_cyprus_8:0 "Offer a Guarantor Conference"
 COLDWAR_GRE_1970_cyprus_8_desc:0 "A guarantor conference could bring competing demands into a common negotiation. Its value depends on participation by the governments whose decisions shape the crisis and on terms Cyprus can address."
 COLDWAR_GRE_1970_cyprus_9:0 "Prepare a National Contingency"
 COLDWAR_GRE_1970_cyprus_9_desc:0 "National contingency planning must distinguish available forces from political wishes. Preparing a response gives Athens options while leaving the decision to use them subject to the circumstances of the crisis."
 COLDWAR_GRE_1970_cyprus_10:0 "Send the Negotiating Instructions"
 COLDWAR_GRE_1970_cyprus_10_desc:0 "Negotiators need instructions that connect Greek objectives to commitments the government can sustain. Clear limits will help prevent diplomatic language from creating obligations that military and civilian authorities understand differently."
 COLDWAR_GRE_1970_cyprus_11:0 "Verify Greek Mobilisation Capacity"
 COLDWAR_GRE_1970_cyprus_11_desc:0 "Mobilisation requires transport, supplies and command arrangements that exist in practice. Verifying those capabilities will reveal which Greek options are credible before the government relies on them in a crisis."
 COLDWAR_GRE_1970_cyprus_12:0 "A Joint Crisis Record"
 COLDWAR_GRE_1970_cyprus_12_desc:0 "A common crisis record can reduce disputes between ministries over what was proposed, accepted and done. Its purpose is to support the next decision without allowing competing narratives to replace events."
 COLDWAR_GRE_1970_cyprus_13:0 "Support an Implemented Ceasefire"
 COLDWAR_GRE_1970_cyprus_13_desc:0 "An implemented ceasefire gives Greece a basis for reducing immediate danger. Supporting it requires attention to the terms accepted by the parties and the practical arrangements that keep fighting from resuming."
 COLDWAR_GRE_1970_cyprus_14:0 "Retain an Armed Posture"
 COLDWAR_GRE_1970_cyprus_14_desc:0 "An armed posture may preserve leverage when negotiations remain uncertain. It also demands supplies and political restraint if preparation is not to become an escalation that outruns the government's intentions."
 COLDWAR_GRE_1970_cyprus_15:0 "Propose Monitored Separation"
 COLDWAR_GRE_1970_cyprus_15_desc:0 "Monitored separation offers a way to reduce contact between hostile forces. Athens must obtain agreement to the arrangement and its supervision rather than assume that proposed lines already bind the parties."
 COLDWAR_GRE_1970_cyprus_16:0 "Prepare Defensive Sustainment"
 COLDWAR_GRE_1970_cyprus_16_desc:0 "Defensive sustainment is the continuing work behind a military posture. Funding supplies, maintenance and transport will help existing commitments remain credible without treating preparation as a diplomatic settlement."
 COLDWAR_GRE_1970_cyprus_17:0 "Record the Outcome without Rewriting It"
 COLDWAR_GRE_1970_cyprus_17_desc:0 "The crisis has produced an outcome that the next government must face. Recording it honestly will preserve the distinction between a ceasefire, a political settlement and unresolved claims."
 COLDWAR_GRE_1970_cyprus_18_programme_effects_tt:0 "Implemented programme effects:\nSocial spending cost: +2%\nStability: +1%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_cyprus_18:0 "Civilian Relief and Missing Persons"
 COLDWAR_GRE_1970_cyprus_18_desc:0 "Civilian relief and the search for missing people address consequences that military planning cannot resolve. Greek assistance must support genuine humanitarian work and acknowledge the harm already established."
 COLDWAR_GRE_1970_cyprus_19_programme_effects_tt:0 "Implemented programme effects:\nBureaucracy cost: +2%\nStability: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_cyprus_19:0 "Reconstruction with Accountability"
 COLDWAR_GRE_1970_cyprus_19_desc:0 "Reconstruction should restore livelihoods while allowing responsibility for civilian harm to be examined. Assistance without accountability would leave the political foundations of another crisis intact."
 COLDWAR_GRE_1970_pasok_return_narrow_programme_effects_tt:0 "Implemented programme effects:\nSocial spending cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_return_narrow:0 "Historically Narrow Return Eligibility"
 COLDWAR_GRE_1970_pasok_return_narrow_desc:0 "A restricted return policy would admit selected exiles while leaving others outside the national settlement. It may reassure parts of the governing coalition, but will preserve grievances the democratic transition was expected to address."
 COLDWAR_GRE_1970_pasok_return_equal_programme_effects_tt:0 "Implemented programme effects:\nSocial spending cost: +4%\nProductivity growth: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_return_equal:0 "Equal Return and Restitution"
 COLDWAR_GRE_1970_pasok_return_equal_desc:0 "Equal return and restitution would judge claims through common legal standards. Extending that promise beyond politically convenient groups can broaden reconciliation while demanding serious administrative and financial preparation."
 COLDWAR_GRE_1970_energy_shock:0 "Respond to an Actual Oil Shock"
 COLDWAR_GRE_1970_energy_shock_desc:0 "An actual disruption of imported fuel has exposed the economy's dependence on external supply. The government must decide how to preserve essential activity while households and businesses bear the consequences of scarcity."
 COLDWAR_GRE_1970_energy_ration_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: -0.9%\nStability: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_energy_ration:0 "Targeted Fuel Rationing"
 COLDWAR_GRE_1970_energy_ration_desc:0 "Targeted rationing will direct limited fuel towards essential activity. It can soften the disruption, but allocation decisions will create their own administrative demands and disputes over who deserves priority."
 COLDWAR_GRE_1970_energy_diversify_programme_effects_tt:0 "Implemented programme effects:\nEconomic project cost: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_energy_diversify:0 "Finance Supply Diversification"
 COLDWAR_GRE_1970_energy_diversify_desc:0 "A broader supply network can reduce exposure to one source of imported energy. Financing alternatives takes resources now and cannot erase a shortage before the new arrangements are in place."
 COLDWAR_GRE_1970_credit_review:0 "Choose How to Fund the Gap"
 COLDWAR_GRE_1970_credit_review_desc:0 "The financing gap requires a choice between raising revenue at home and negotiating credit abroad. Each approach has a political constituency and a cost the government must be prepared to explain."
 COLDWAR_GRE_1970_credit_taxes:0 "Temporary Revenue Measures"
 COLDWAR_GRE_1970_credit_taxes_desc:0 "Temporary revenue measures ask the domestic economy to carry more of the immediate burden. A clear limit and later reversal will matter if taxpayers are to believe that an emergency increase is not becoming permanent by default."
 COLDWAR_GRE_1970_credit_loan:0 "Negotiate a Funded Credit Line"
 COLDWAR_GRE_1970_credit_loan_desc:0 "A foreign credit line can supply resources without an immediate tax increase. Its value depends on a lender accepting the terms and providing the funds, while Greece assumes the corresponding obligation to repay."
 COLDWAR_GRE_1970_energy_recovery:0 "Implement the Recovery Package"
 COLDWAR_GRE_1970_energy_recovery_desc:0 "Recovery requires evidence that the supply shock has eased. The government can then move from emergency restrictions towards a funded programme that restores normal activity and reduces future exposure."
 COLDWAR_GRE_1970_aegean_0:0 "Review the Aegean Shelf Licences"
 COLDWAR_GRE_1970_aegean_0_desc:0 "Competing shelf licences have made technical surveys a diplomatic question. Greece must assemble its legal and hydrographic position before choosing how to defend exploration rights in the Aegean."
 COLDWAR_GRE_1970_aegean_1_programme_effects_tt:0 "Implemented programme effects:\nOne 20% research bonus: electronics\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_aegean_1:0 "Fund Hydrographic and Legal Surveys"
 COLDWAR_GRE_1970_aegean_1_desc:0 "Hydrographic work and legal preparation will give negotiators a stronger factual basis. Investing in expertise can clarify the national position without assuming that a survey settles a disputed boundary."
 COLDWAR_GRE_1970_aegean_2:0 "Offer Reciprocal Survey Restraint"
 COLDWAR_GRE_1970_aegean_2_desc:0 "Reciprocal restraint could prevent exploratory activity from becoming a confrontation. Greece will offer limits that require an actual Turkish response and leave the underlying legal claims unresolved."
 COLDWAR_GRE_1970_aegean_3_programme_effects_tt:0 "Implemented programme effects:\nOne 20% research bonus: infrastructure\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_aegean_3:0 "Assert a Licensed Exploration Programme"
 COLDWAR_GRE_1970_aegean_3_desc:0 "A licensed exploration programme asserts Greece's position through planned activity. Pursuing it requires technical preparation and a willingness to face the diplomatic consequences of operating in disputed waters."
 COLDWAR_GRE_1970_aegean_4:0 "Record the Counterpart's Actual Response"
 COLDWAR_GRE_1970_aegean_4_desc:0 "The counterpart may accept restraint, reject it or propose different terms. Greek policy must take that response seriously rather than treat the dispatch of its own offer as a bilateral understanding."
 COLDWAR_GRE_1970_aegean_5:0 "Negotiate a Berne-Style Framework"
 COLDWAR_GRE_1970_aegean_5_desc:0 "A negotiated framework can keep the dispute within agreed procedures while preserving each side's legal position. Its credibility depends on reciprocal acceptance and conduct consistent with the terms."
 COLDWAR_GRE_1970_aegean_6_programme_effects_tt:0 "Implemented programme effects:\nBureaucracy cost: +1%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_aegean_6:0 "Seek a Valid Jurisdictional Basis"
 COLDWAR_GRE_1970_aegean_6_desc:0 "A legal forum needs a valid jurisdictional basis before it can hear the dispute. Greece will seek an agreement capable of supporting that process without presenting a unilateral application as compulsory settlement."
 COLDWAR_GRE_1970_aegean_7_programme_effects_tt:0 "Implemented programme effects:\nNaval coordination: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_aegean_7:0 "Fund a Durable Maritime Posture"
 COLDWAR_GRE_1970_aegean_7_desc:0 "A durable maritime posture combines technical knowledge, diplomatic preparation and resources the state can sustain. It must remain useful whether the dispute advances towards agreement or continues unresolved."
 COLDWAR_GRE_1970_tree_programmes:0 "The Greek State and Its Programmes"
 COLDWAR_GRE_1970_tree_programmes_desc:0 "Implement funded programmes and revisit unresolved domestic agreements. Parliamentary elections and foreign responses preserve the respective player choices."
