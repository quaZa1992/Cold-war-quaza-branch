 COLDWAR_GRE_1970_aegean_6_programme:0 "Seek a Valid Jurisdictional Basis"
 COLDWAR_GRE_1970_aegean_6_programme_desc:0 "Invite a special agreement or establish another valid legal basis for adjudication. Greece may file unilaterally without receiving a guaranteed merits hearing. Historical 1976 application did not produce a merits victory; ICJ found no jurisdiction in 1978. No automatic TUR consent, judgement or sovereign/resource transfer."
 COLDWAR_GRE_1970_aegean_7_programme:0 "Fund a Durable Maritime Posture"
 COLDWAR_GRE_1970_aegean_7_programme_desc:0 "If an agreement is implemented, support verification/deconfliction; otherwise sustain an explicitly unresolved defensive and rescue posture. No automatic peace or revision of claims. Maintain operating costs; no fictional free navy or deletion of Turkish agency."
