 COLDWAR_GRE_1970_pap_2_desc:0 "A controlled opening is a risky political proposal, not a completed democracy. Refusal by opposition and officer obstruction remain possible. Papadopoulos is the regime’s controlling figure; Markezinis can be prime minister during the 1973opening. Formal office and political control are distinct.\n\nProgramme effects:\nPolitical power gain: +3%\nStability: +3%\n\nConditions: Nationalist military junta in office AND Papadopoulos is the actual ruling leader. Actual active regime: military_government_active OR controlled_government_active. A party label alone cannot bypass the regime path. A controlled opening is being negotiated or implemented; a later policy change must replace the current regime package."
 COLDWAR_GRE_1970_pap_3_programme_effects_tt:0 "Implemented programme effects:\nPolitical power gain: +7%\nStability: -2%\nSubject to the stated funding, government and agreement conditions."
