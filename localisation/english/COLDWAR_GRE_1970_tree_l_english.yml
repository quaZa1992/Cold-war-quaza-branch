 COLDWAR_GRE_1970_pasok_return_narrow_programme:0 "Historically Narrow Return Eligibility"
 COLDWAR_GRE_1970_pasok_return_narrow_programme_desc:0 "The 1982return decision restricted eligibility to refugees of Greek origin; the 1985property law retained a related restriction. This is a restrictive policy with excluded refugees’ claims left unresolved. The smaller budget funds fewer actual claims, not an inherent benefit of ancestry. PACE Doc11356annexes reproduce translations; they are not authenticated original Gazette scans."
 COLDWAR_GRE_1970_pasok_return_equal_programme:0 "Equal Return and Restitution"
 COLDWAR_GRE_1970_pasok_return_equal_programme_desc:0 "An explicitly inclusive alternate policy covers otherwise excluded returnees. Requires funded processing, property verification and housing; does not claim the historical 1982law treated every exile equally. PACE Doc11356annexes reproduce translations; they are not authenticated original Gazette scans."
 COLDWAR_GRE_1970_energy_ration_programme:0 "Targeted Fuel Rationing"
 COLDWAR_GRE_1970_energy_ration_programme_desc:0 "Reduces the fuel-import burden but restricts domestic activity. Update the oil-shock package; do not stack full relief with the opposing choice."
