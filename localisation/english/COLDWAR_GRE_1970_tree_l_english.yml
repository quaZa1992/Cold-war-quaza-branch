 COLDWAR_GRE_1970_pap_3_desc:0 "Security tutelage preserves officer leverage and the documented coercive state; the rights grievance remains. Papadopoulos is the regime’s controlling figure; Markezinis can be prime minister during the 1973opening. Formal office and political control are distinct.\n\nProgramme effects:\nPolitical power gain: +7%\nStability: -2%\n\nConditions: Nationalist military junta in office AND Papadopoulos is the actual ruling leader. Actual active regime: military_government_active OR controlled_government_active. A party label alone cannot bypass the regime path. Continued military rule or a retained military veto is actually in force."
