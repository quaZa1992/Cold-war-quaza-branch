 COLDWAR_GRE_1970_aegean_7_programme_desc:0 "If an agreement is implemented, support verification/deconfliction; otherwise sustain an explicitly unresolved defensive and rescue posture. No automatic peace or revision of claims. Maintain operating costs; no fictional free navy or deletion of Turkish agency."
