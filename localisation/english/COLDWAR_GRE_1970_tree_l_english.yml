 COLDWAR_GRE_1970_pap_15:0 "Rights Benchmarks for Talks"
 COLDWAR_GRE_1970_pap_15_desc:0 "A foreign-policy dossier is submitted. A counterpart can negotiate, accept, defer or refuse; no reward is paid before implementation. Papadopoulos is the regime’s controlling figure; Markezinis can be prime minister during the 1973opening. Formal office and political control are distinct.\n\nConditions: Nationalist military junta in office AND Papadopoulos is the actual ruling leader. Actual active regime: military_government_active OR controlled_government_active. A party label alone cannot bypass the regime path.\n\nProposal to ENG: accept, revised terms, defer or refuse. Silence expires after 90 days and never counts as agreement. Domestic effects require acceptance and funding."
