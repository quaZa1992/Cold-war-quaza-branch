 COLDWAR_GRE_1970_cyprus_18_programme_effects_tt:0 "Implemented programme effects:\nSocial spending cost: +2%\nStability: +1%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_cyprus_18:0 "Civilian Relief and Missing Persons"
 COLDWAR_GRE_1970_cyprus_18_desc:0 "Relief activates only after actual civilian harm/displacement. Verify recipients and distribute funds once; never pay both Greek and Cyprus ledgers for the same invoice.\n\nDomestic relief administration improves stability but retains its ongoing social cost. It neither erases Cypriot losses nor transfers foreign territory.\n\nProgramme effects:\nSocial spending cost: +2%\nStability: +1%\n\nConditions: Actual current crisis phase and counterpart eligibility, not a July 1974 calendar gate. Early and late alternate-history crises are possible.\n\nImplementation costs 0.8% of current GDP from the treasury. Unfunded completion can be implemented later through decisions."
 COLDWAR_GRE_1970_cyprus_19_programme_effects_tt:0 "Implemented programme effects:\nBureaucracy cost: +2%\nStability: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_cyprus_19:0 "Reconstruction with Accountability"
 COLDWAR_GRE_1970_cyprus_19_desc:0 "Reconstruction/claims require an implemented settlement, local ownership/consent and recorded damage. Repression cannot remove civilian-harm penalties.\n\nReconstruction and missing-person casework require recorded harm and an accepted settlement; victim claims survive.\n\nProgramme effects:\nBureaucracy cost: +2%\nStability: +2%\n\nConditions: Actual current crisis phase and counterpart eligibility, not a July 1974 calendar gate. Early and late alternate-history crises are possible.\n\nImplementation costs 1.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions."
 COLDWAR_GRE_1970_pasok_return_narrow_programme_effects_tt:0 "Implemented programme effects:\nSocial spending cost: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_return_narrow:0 "Historically Narrow Return Eligibility"
 COLDWAR_GRE_1970_pasok_return_narrow_desc:0 "The 1982return decision restricted eligibility to refugees of Greek origin; the 1985property law retained a related restriction. This is a restrictive policy with excluded refugees’ claims left unresolved. The smaller budget funds fewer actual claims, not an inherent benefit of ancestry. PACE Doc11356annexes reproduce translations; they are not authenticated original Gazette scans.\n\nA limited return programme retains excluded refugees’ claims and has a smaller processing budget.\n\nProgramme effects:\nSocial spending cost: +2%\n\nConditions: An Andreas-led government, an actual legal mandate and a documented return/restitution caseload. Earlier adoption is an alternate-history reform. Actual active regime: civilian_transfer_implemented OR civilian_government_active. A party label alone cannot bypass the regime path.\n\nImplementation costs 0.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions."
 COLDWAR_GRE_1970_pasok_return_equal_programme_effects_tt:0 "Implemented programme effects:\nSocial spending cost: +4%\nProductivity growth: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_pasok_return_equal:0 "Equal Return and Restitution"
 COLDWAR_GRE_1970_pasok_return_equal_desc:0 "An explicitly inclusive alternate policy covers otherwise excluded returnees. Requires funded processing, property verification and housing; does not claim the historical 1982law treated every exile equally. PACE Doc11356annexes reproduce translations; they are not authenticated original Gazette scans.\n\nEqual return and property processing cost more and support broader productive reintegration.\n\nProgramme effects:\nSocial spending cost: +4%\nProductivity growth: +2%\n\nConditions: An Andreas-led government, an actual legal mandate and a documented return/restitution caseload. Earlier adoption is an alternate-history reform. Actual active regime: civilian_transfer_implemented OR civilian_government_active. A party label alone cannot bypass the regime path.\n\nImplementation costs 1.0% of current GDP from the treasury. Unfunded completion can be implemented later through decisions."
 COLDWAR_GRE_1970_energy_shock:0 "Respond to an Actual Oil Shock"
 COLDWAR_GRE_1970_energy_shock_desc:0 "Respond to an Actual Oil Shock.\n\nConditions: A world oil-price/supply shock or actual disruption is active; not a 1970starting event."
 COLDWAR_GRE_1970_energy_ration_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: -0.9%\nStability: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_energy_ration:0 "Targeted Fuel Rationing"
 COLDWAR_GRE_1970_energy_ration_desc:0 "Reduces the fuel-import burden but restricts domestic activity. Update the oil-shock package; do not stack full relief with the opposing choice.\n\nProgramme effects:\nConstruction speed: -0.9%\nStability: -2%"
 COLDWAR_GRE_1970_energy_diversify_programme_effects_tt:0 "Implemented programme effects:\nEconomic project cost: -2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_energy_diversify:0 "Finance Supply Diversification"
 COLDWAR_GRE_1970_energy_diversify_desc:0 "Finance Supply Diversification.\n\nSupplier-approved diversification funds domestic resilience; it never generates imported fuel for free.\n\nProgramme effects:\nEconomic project cost: -2%\n\nImplementation costs 1.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nProposal to ENG: accept, revised terms, defer or refuse. Silence expires after 90 days and never counts as agreement. Domestic effects require acceptance and funding."
 COLDWAR_GRE_1970_credit_review:0 "Choose How to Fund the Gap"
 COLDWAR_GRE_1970_credit_review_desc:0 "Choose How to Fund the Gap.\n\nConditions: A documented treasury/import-financing gap, not an automatically imposed recession."
 COLDWAR_GRE_1970_credit_taxes:0 "Temporary Revenue Measures"
 COLDWAR_GRE_1970_credit_taxes_desc:0 "Use the existing tax/budget system with a defined sunset. No one-off fictitious GDP increase."
 COLDWAR_GRE_1970_credit_loan:0 "Negotiate a Funded Credit Line"
 COLDWAR_GRE_1970_credit_loan_desc:0 "Negotiate a Funded Credit Line.\n\nProposal to USA: accept, revised terms, defer or refuse. Silence expires after 90 days and never counts as agreement. Domestic effects require acceptance and funding."
 COLDWAR_GRE_1970_energy_recovery:0 "Implement the Recovery Package"
 COLDWAR_GRE_1970_energy_recovery_desc:0 "Implement the Recovery Package.\n\nConditions: Actual verified supply recovery; funded domestic programme.\n\nImplementation costs 0.8% of current GDP from the treasury. Unfunded completion can be implemented later through decisions."
 COLDWAR_GRE_1970_aegean_0:0 "Review the Aegean Shelf Licences"
 COLDWAR_GRE_1970_aegean_0_desc:0 "Open a separate shelf dossier, map each party's claims and record existing survey capacity. No new oil, sea ownership, naval superiority or hostility is granted merely by opening the dossier.\n\nConditions: A real overlapping shelf-licence/survey dispute exists; historical baseline starts with 1973 licences/1974 discoveries. An earlier equivalent is explicitly alternate history."
 COLDWAR_GRE_1970_aegean_1_programme_effects_tt:0 "Implemented programme effects:\nOne 20% research bonus: electronics\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_aegean_1:0 "Fund Hydrographic and Legal Surveys"
 COLDWAR_GRE_1970_aegean_1_desc:0 "Improve the quality of domestic surveys and legal preparation; enable the strategic choice. Spend actual funding and staff time. Seismic evidence does not prove title or guarantee viable commercial reserves.\n\nFunded hydrographic and legal surveys develop research capacity; they do not establish title to the shelf.\n\nProgramme effects:\nOne 20% research bonus: electronics\n\nConditions: An owned legal/survey institution has capacity; domestic survey and legal budget funded.\n\nImplementation costs 0.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions."
 COLDWAR_GRE_1970_aegean_2:0 "Offer Reciprocal Survey Restraint"
 COLDWAR_GRE_1970_aegean_2_desc:0 "If both actually accept and implement, reduce the relevant Aegean escalation pressure and release some patrol burden. Forego the speed and potential exploration returns of unilateral survey priority; Turkish refusal remains a distinct outcome.\n\nConditions: Submit a precise GRE-to-TUR proposal with geographic scope, monitoring and duration.\n\nProposal to TUR: accept, revised terms, defer or refuse. Silence expires after 90 days and never counts as agreement. Domestic effects require acceptance and funding."
 COLDWAR_GRE_1970_aegean_3_programme_effects_tt:0 "Implemented programme effects:\nOne 20% research bonus: infrastructure\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_aegean_3:0 "Assert a Licensed Exploration Programme"
 COLDWAR_GRE_1970_aegean_3_desc:0 "Prioritize national geological knowledge and prospective development inside the actual researched system. Turkey can contest, negotiate, shadow or escalate on its own initiative. Greek licensing is not proof of uncontested rights; no automatic war or oil payout.\n\nLicensed exploration develops domestic engineering; it does not create a commercial oil deposit.\n\nProgramme effects:\nOne 20% research bonus: infrastructure\n\nConditions: Greece chooses a funded survey/licence policy; appropriate domestic permit and real vessel capacity exist.\n\nImplementation costs 0.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nProposal to TUR: accept, revised terms, defer or refuse. Silence expires after 90 days and never counts as agreement. Domestic effects require acceptance and funding."
 COLDWAR_GRE_1970_aegean_4:0 "Record the Counterpart's Actual Response"
 COLDWAR_GRE_1970_aegean_4_desc:0 "Expose the actual diplomatic/legal situation and subsequent options. No acceptance by bypass or silence; rejection must not block unrelated Greek development.\n\nConditions: OR prerequisite; an answer, explicit non-response timeout or independently observed incident is recorded."
 COLDWAR_GRE_1970_aegean_5:0 "Negotiate a Berne-Style Framework"
 COLDWAR_GRE_1970_aegean_5_desc:0 "Request good-faith delimitation talks, reciprocal restraint and agreed procedures. Grant only implemented bilateral measures. No imposed median line, island cession or final maritime delimitation. Refusal/deferment gets an honest record without treaty rewards.\n\nConditions: Actual willingness to negotiate is verified. Historical reference: November 1976 agreement; earlier equivalent marked alternate.\n\nProposal to TUR: accept, revised terms, defer or refuse. Silence expires after 90 days and never counts as agreement. Domestic effects require acceptance and funding."
 COLDWAR_GRE_1970_aegean_6_programme_effects_tt:0 "Implemented programme effects:\nBureaucracy cost: +1%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_aegean_6:0 "Seek a Valid Jurisdictional Basis"
 COLDWAR_GRE_1970_aegean_6_desc:0 "Invite a special agreement or establish another valid legal basis for adjudication. Greece may file unilaterally without receiving a guaranteed merits hearing. Historical 1976 application did not produce a merits victory; ICJ found no jurisdiction in 1978. No automatic TUR consent, judgement or sovereign/resource transfer.\n\nA legal dossier has a recurring administrative cost; jurisdiction still requires the counterpart’s valid consent.\n\nProgramme effects:\nBureaucracy cost: +1%\n\nConditions: Greek legal dossier funded; distinguish submitting an application from obtaining jurisdiction.\n\nImplementation costs 0.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions.\n\nProposal to TUR: accept, revised terms, defer or refuse. Silence expires after 90 days and never counts as agreement. Domestic effects require acceptance and funding."
 COLDWAR_GRE_1970_aegean_7_programme_effects_tt:0 "Implemented programme effects:\nNaval coordination: +2%\nSubject to the stated funding, government and agreement conditions."
 COLDWAR_GRE_1970_aegean_7:0 "Fund a Durable Maritime Posture"
 COLDWAR_GRE_1970_aegean_7_desc:0 "If an agreement is implemented, support verification/deconfliction; otherwise sustain an explicitly unresolved defensive and rescue posture. No automatic peace or revision of claims. Maintain operating costs; no fictional free navy or deletion of Turkish agency.\n\nProgramme effects:\nNaval coordination: +2%\n\nConditions: OR prerequisite, with refusal/no-jurisdiction treated as recorded outcomes; fund actual domestic patrol, rescue and communications capacity.\n\nImplementation costs 0.5% of current GDP from the treasury. Unfunded completion can be implemented later through decisions."
 COLDWAR_GRE_1970_tree_programmes:0 "The Greek State and Its Programmes"
 COLDWAR_GRE_1970_tree_programmes_desc:0 "Implement funded programmes and revisit unresolved domestic agreements. Parliamentary elections and foreign responses preserve the respective player choices."
