 COLDWAR_GRE_1970_pap_10_desc:0 "Funded implementation bonus for365days. Refreshes this slot rather than stacking an additional permanent idea. Papadopoulos is the regime’s controlling figure; Markezinis can be prime minister during the 1973opening. Formal office and political control are distinct.\n\nA 365-day implementation programme. Expiry does not recreate the programme or repeat its payment.\n\nProgramme effects:\nConstruction speed: +0.9%\nOffice income tax revenue: +4%\nProgramme duration: 365 days\n\nConditions: Nationalist military junta in office AND Papadopoulos is the actual ruling leader. Actual active regime: military_government_active OR controlled_government_active. A party label alone cannot bypass the regime path.\n\nImplementation costs 1% of current GDP from the treasury. Unfunded completion can be implemented later through decisions."
