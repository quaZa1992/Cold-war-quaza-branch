 COLDWAR_GRE_1970_pap_10_programme_effects_tt:0 "Implemented programme effects:\nConstruction speed: +0.9%\nOffice income tax revenue: +4%\nProgramme duration: 365 days\nSubject to the stated funding, government and agreement conditions."
