l_english:
# IMPERIA COLD WAR — Czechoslovak domestic projects and federal settlement.
 COLDWAR_CZE_1970_projects:0 "Domestic Projects and Federal Settlement"
 COLDWAR_CZE_1970_projects_desc:0 "State investment, civil energy development and the constitutional settlement between the Czech and Slovak republics require separate public mandates."
 COLDWAR_CZE_1970_common_state_tt:0 "The common Czech-Slovak state exists."
 COLDWAR_CZE_1970_common_state_tt_NOT:0 "The common Czech-Slovak state has been dissolved."
 COLDWAR_CZE_1970_after_nuclear_development_tt:0 "After §Y1,095 active days§!:"
 COLDWAR_CZE_1970_after_uranium_development_tt:0 "After §Y365 active days§!:"
 COLDWAR_CZE_1970_federal_projects_settled_tt:0 "Funded federal reactor, uranium and Danube construction projects have been completed."
 COLDWAR_CZE_1970_civil_nuclear_investment:0 "Fund a Licensed Civil Nuclear Project"
 COLDWAR_CZE_1970_civil_nuclear_investment_desc:0 "Fund a VVER design and fuel programme for Western Slovakia. The project requires 1,095 active days before reactor construction begins. Cost: 1.20% of current GDP."
 COLDWAR_CZE_1970_uranium_survey:0 "Fund a Uranium Deposit Survey"
 COLDWAR_CZE_1970_uranium_survey_desc:0 "Survey the known uranium deposit in Eastern Slovakia. The survey records the deposit and adds no raw uranium or mine. Cost: 0.08% of current GDP."
 COLDWAR_CZE_1970_uranium_development:0 "Develop the Surveyed Uranium Deposit"
 COLDWAR_CZE_1970_uranium_development_desc:0 "Fund one licensed uranium mine in Eastern Slovakia after the geological survey and mine licence are approved. The 365-day development period precedes normal construction. Cost: 0.70% of current GDP."
 COLDWAR_CZE_1970_defensive_position_prague:0 "Fortify Prague"
 COLDWAR_CZE_1970_defensive_position_prague_desc:0 "Construct one land fort in Prague, Bohemia. Cost: 0.25% of current GDP."
 COLDWAR_CZE_1970_defensive_position_brno:0 "Fortify Brno"
 COLDWAR_CZE_1970_defensive_position_brno_desc:0 "Construct one land fort in Brno, Moravia. Cost: 0.25% of current GDP."
 COLDWAR_CZE_1970_defensive_position_ostrava:0 "Fortify Ostrava"
 COLDWAR_CZE_1970_defensive_position_ostrava_desc:0 "Construct one land fort in Ostrava, Czech Silesia. Cost: 0.25% of current GDP."
 COLDWAR_CZE_1970_defensive_position_plzen:0 "Fortify Plzeň"
 COLDWAR_CZE_1970_defensive_position_plzen_desc:0 "Construct one land fort in Plzeň, Šumava. Cost: 0.25% of current GDP."
 COLDWAR_CZE_1970_defensive_position_bratislava:0 "Fortify Bratislava"
 COLDWAR_CZE_1970_defensive_position_bratislava_desc:0 "Construct one land fort in Bratislava, Western Slovakia. Cost: 0.25% of current GDP."
 COLDWAR_CZE_1970_defensive_position_kosice:0 "Fortify Košice"
 COLDWAR_CZE_1970_defensive_position_kosice_desc:0 "Construct one land fort in Košice, Eastern Slovakia. Cost: 0.25% of current GDP."
 COLDWAR_CZE_1970_separation_convention:0 "Convene a Republican Settlement"
 COLDWAR_CZE_1970_separation_convention_desc:0 "Open negotiations between the Czech and Slovak republics. Cost: 0.10% of current GDP."
 COLDWAR_CZE_1970_partition_ledger:0 "Approve the Common Property Ledger"
 COLDWAR_CZE_1970_partition_ledger_desc:0 "The current GDP formula assigns [?CZE.COLDWAR_CZE_1970_ledger_preview_cze_share|%] of public accounts to the Czech Republic and [?CZE.COLDWAR_CZE_1970_ledger_preview_slo_share|%] to Slovakia. These shares are fixed when the ledger is approved. Current treasury and debt are divided on the day of separation. Any change to the agreed territorial schedule requires a revised ledger before signatures."
 COLDWAR_CZE_1970_dual_ratification:0 "Ratify the Agreed Separation"
 COLDWAR_CZE_1970_dual_ratification_desc:0 "Both republican governments must ratify the same locked ledger during peace. Current treasury and debt are divided by the approved GDP shares. The agreed schedule transfers only Czech-owned and controlled Slovak states."
 COLDWAR_CZE_1970_ledger_cze_share_tt:0 "Czechoslovak Republic GDP share"
 COLDWAR_CZE_1970_ledger_slo_share_tt:0 "Slovak Republic GDP share"
