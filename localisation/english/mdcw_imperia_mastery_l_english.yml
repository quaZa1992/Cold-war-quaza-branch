# IMPERIA CW — Cold War: imperia mastery — English localisation.
 mdcw_ni_joint_training_command:0 "National Joint Training and Trials Command"
 mdcw_ni_joint_training_command_desc:0 "A permanent joint command operates staff colleges, training ranges, evaluation units and large live-fire exercises. Experienced instructors study operational lessons and train successive cohorts across the armed services. Maintaining dedicated training formations, consuming ammunition and fuel, and retaining a professional instructor corps demands an exceptional, sustained budget.\n\n§YEstablishment:§! 500 Political Power (base cost) and a treasury payment equal to §R2% of GDP§!.\n§YRecurring costs:§! §R+100%§! military personnel costs, §R+75%§! military equipment upkeep and §R+25%§! bureaucracy costs.\n§YCommitment:§! four years before removal; base removal cost: 150 Political Power."
 mdcw_joint_training_command_spending_tt:0 "Military spending is at least §Y$defence_04$§!."
 mdcw_joint_training_command_training_tt:0 "Officer training is at least §Y$officer_advanced_training$§!."
 mdcw_joint_training_command_setup_tt:0 "Pay §R2% of current GDP§! from the treasury to establish colleges, training ranges and evaluation formations. Commit to the programme for §Yfour years§!."
