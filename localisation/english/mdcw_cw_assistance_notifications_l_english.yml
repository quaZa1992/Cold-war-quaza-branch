# IMPERIA CW — Cold War: cw assistance notifications — English localisation.
 mdcw_cw_assistance_reply.1.t: "Assistance Offer Accepted"
 mdcw_cw_assistance_reply.1.d: "[event_target:mdcw_cw_assistance_recipient.GetNameDef] has accepted our assistance offer. The programme is now active for one year. Its effects and ongoing costs are shown in the Cold War Assistance overview.\n\nWe may offer other programmes to this country while our assistance capacity allows."
 mdcw_cw_assistance_reply.1.a: "Acknowledged."
 mdcw_cw_assistance_reply.2.t: "Assistance Offer Declined"
 mdcw_cw_assistance_reply.2.d: "[event_target:mdcw_cw_assistance_recipient.GetNameDef] has declined our assistance offer. No programme has been started. We may send another offer when our assistance capacity allows."
 mdcw_cw_assistance_reply.2.a: "Acknowledged."
