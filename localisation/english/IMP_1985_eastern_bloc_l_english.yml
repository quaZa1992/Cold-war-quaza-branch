 imp_1985_eb_democratic_pressure_1: "Quiet Dissent"
 imp_1985_eb_democratic_pressure_1_desc: "Opposition exists mostly in private rooms, churches, student circles and whispered factory complaints. It is not yet a mass force, but it is learning."
 imp_1985_eb_democratic_pressure_2: "Opposition Undercurrent"
 imp_1985_eb_democratic_pressure_2_desc: "Informal networks are spreading between intellectuals, clergy, workers and reform economists. The party can still contain them, but not ignore them."
 imp_1985_eb_democratic_pressure_3: "Organized Civic Opposition"
 imp_1985_eb_democratic_pressure_3_desc: "Dissent is becoming organized enough to survive arrests and dismissals. Democratic popularity, instability and lost productivity now reinforce each other."
 imp_1985_eb_democratic_pressure_4: "Open Democratic Pressure"
 imp_1985_eb_democratic_pressure_4_desc: "The demand for open politics has left private conversation and entered public life. Routine administration will no longer be enough."
 imp_1985_eb_democratic_pressure_5: "Revolutionary Democratic Pressure"
 imp_1985_eb_democratic_pressure_5_desc: "The regime faces a political society that no longer believes silence is compulsory. Strikes, demonstrations and security hesitation become much more likely."
 imp_1985_eb_economic_strain_1: "Manageable Shortages"
 imp_1985_eb_economic_strain_1_desc: "Shortages are annoying rather than explosive. The apparatus can still trade favors, rationing and promises for patience."
 imp_1985_eb_economic_strain_2: "Rationing Tension"
 imp_1985_eb_economic_strain_2_desc: "Queues and workplace frustration are becoming political facts. Economic management now costs growth, revenue and public patience."
 imp_1985_eb_economic_strain_3: "Debt and Shortages"
 imp_1985_eb_economic_strain_3_desc: "Debt, import limits and production bottlenecks are feeding each other. The economy begins to turn administrative mistakes into opposition arguments."
 imp_1985_eb_economic_strain_4: "Systemic Shortages"
 imp_1985_eb_economic_strain_4_desc: "The shortage economy is no longer a temporary inconvenience. Every factory priority creates a civilian complaint somewhere else."
 imp_1985_eb_economic_strain_5: "Economic Rupture"
 imp_1985_eb_economic_strain_5_desc: "The planned economy is visibly failing to provide routine stability. Work discipline, construction, taxation and legitimacy all suffer together."
 imp_1985_eb_regime_control_1: "Brittle Regime Control"
 imp_1985_eb_regime_control_1_desc: "Orders still exist, but obedience is uneven. Local cadres hedge, ministries delay and opposition circles sense weakness."
 imp_1985_eb_regime_control_2: "Strained Regime Control"
 imp_1985_eb_regime_control_2_desc: "The party apparatus still functions, but discipline requires constant attention. Dissent is harder to isolate."
 imp_1985_eb_regime_control_3: "Administered Regime Control"
 imp_1985_eb_regime_control_3_desc: "The state remains governable through routine party administration, bureaucratic habits and controlled public organizations."
 imp_1985_eb_regime_control_4: "Disciplined Party Apparatus"
 imp_1985_eb_regime_control_4_desc: "The party line is enforced through ministries, factories, media and mass organizations. Control is strong, but the economic burden is visible."
 imp_1985_eb_regime_control_5: "Hardline Party Grip"
 imp_1985_eb_regime_control_5_desc: "The ruling party holds society tightly through discipline and fear. It buys political security at the cost of economic dynamism."
 imp_1985_eb_security_loyalty_1: "Fragmented Security Services"
 imp_1985_eb_security_loyalty_1_desc: "Security commanders, police cadres and informant networks no longer share confidence. Crackdowns can misfire."
 imp_1985_eb_security_loyalty_2: "Wavering Security Services"
 imp_1985_eb_security_loyalty_2_desc: "The apparatus is still present, but loyalty is no longer automatic. Orders need reassurance, favors and political cover."
 imp_1985_eb_security_loyalty_3: "Institutional Security Loyalty"
 imp_1985_eb_security_loyalty_3_desc: "Security organs obey normal chains of command and can contain routine opposition activity."
 imp_1985_eb_security_loyalty_4: "Loyal Security Apparatus"
 imp_1985_eb_security_loyalty_4_desc: "Internal security, police and party watchers are disciplined and useful, though maintaining them consumes resources."
 imp_1985_eb_security_loyalty_5: "Pervasive Security State"
 imp_1985_eb_security_loyalty_5_desc: "Surveillance is deep and coercion is available. The regime suppresses dissent effectively, but pays through costs, resentment and productivity losses."
 imp_1985_eb_moscow_leverage_1: "Detached from Moscow"
 imp_1985_eb_moscow_leverage_1_desc: "Soviet influence is mostly symbolic. Local actors test how far they can move without Moscow deciding the answer."
 imp_1985_eb_moscow_leverage_2: "Weak Soviet Channels"
 imp_1985_eb_moscow_leverage_2_desc: "Moscow still has party, diplomatic and military contacts, but they no longer settle every argument."
 imp_1985_eb_moscow_leverage_3: "Treaty Routine"
 imp_1985_eb_moscow_leverage_3_desc: "Soviet influence operates through normal bloc channels: party visits, economic coordination, officers and treaty obligations."
 imp_1985_eb_moscow_leverage_4: "Integrated Soviet Command"
 imp_1985_eb_moscow_leverage_4_desc: "The state remains closely tied to Soviet military, party and economic structures. Moscow can still stabilize the regime."
 imp_1985_eb_moscow_leverage_5: "Direct Soviet Dependence"
 imp_1985_eb_moscow_leverage_5_desc: "The regime depends heavily on Soviet pressure, supplies and command confidence. Stability improves, but sovereignty and economic flexibility suffer."
 imp_1985_eb_strike_wave: "Strike Wave"
 imp_1985_eb_strike_wave_desc: "Workplace discipline has broken in key sectors. Production suffers while opposition networks gain confidence from collective action."
 imp_1985_eb_mass_demonstrations: "Mass Demonstrations"
 imp_1985_eb_mass_demonstrations_desc: "The street has become a political institution. Every concession, arrest or silence now teaches society how much power it has."
 imp_1985_eb_emergency_law: "Emergency Law"
 imp_1985_eb_emergency_law_desc: "Emergency powers restore command tempo, but they drain legitimacy and make the economy feel even more militarized."
 imp_1985_eb_moscow_advisors: "Moscow Advisors"
 imp_1985_eb_moscow_advisors_desc: "Soviet advisers help coordinate party, security and planning responses. Their presence reassures hardliners and alarms reformers."
 imp_1985_eb_reform_left_decompression: "Reform Socialist Decompression"
 imp_1985_eb_reform_left_decompression_desc: "The ruling party still speaks from the left, but it no longer treats every concession as surrender. Civic pressure and economic fatigue ease, while hardline Soviet channels lose some authority."
 imp_1985_eb_market_supply_costs: "Emergency Consumer Supply Costs"
 imp_1985_eb_market_supply_costs_desc: "The state is diverting hard currency and scarce goods into politically sensitive consumer channels. Shelves look calmer, but revenue and productivity suffer."
 imp_1985_eb_factory_priority_costs: "Factory Priority Distortions"
 imp_1985_eb_factory_priority_costs_desc: "Priority deliveries keep major plants working, but the rest of the economy pays through bottlenecks, tax losses and distorted planning."
 imp_1985_eb_party_administration_costs: "Cadre Administration Burden"
 imp_1985_eb_party_administration_costs_desc: "The party apparatus is being forced into constant inspections, reports and personnel changes. Control improves, but governing becomes slower and more expensive."
 imp_1985_eb_party_mobilization_costs: "Mass Organization Mobilization"
 imp_1985_eb_party_mobilization_costs_desc: "Youth leagues, workplace committees and official social organizations are being pushed into permanent mobilization. It crowds out civic opposition, but drains productivity."
 imp_1985_eb_security_operation_costs: "Security Operation Costs"
 imp_1985_eb_security_operation_costs_desc: "Informants, internal troops and police units are consuming command attention, weapons and budgetary room. The streets may quiet down, but the state becomes heavier."
 imp_1985_eb_soviet_advisory_costs: "Soviet Advisory Burden"
 imp_1985_eb_soviet_advisory_costs_desc: "Soviet advisers bring coordination and confidence, but their presence consumes administrative capacity and reminds society that sovereignty is conditional."
 imp_1985_eb_reform_disruption_costs: "Controlled Reform Disruption"
 imp_1985_eb_reform_disruption_costs_desc: "Limited talks and civic channels calm pressure, but they disrupt the monopoly of command and give organized society new room to breathe."
 imp_1985_eb_emergency_mobilization_costs: "Emergency Mobilization Costs"
 imp_1985_eb_emergency_mobilization_costs_desc: "Emergency rule places police, army and party logistics above normal economic needs. It may restore control, but the cost is visible everywhere."
 imp_1985_eb_external_debt_service: "External Debt Service"
 imp_1985_eb_external_debt_service_desc: "Hard-currency loans ease shortages today while future revenue is tied up in debt service. Reformers notice the dependence; Moscow notices the drift."
 imp_1985_eb_soviet_commitment: "Bloc Stabilization Commitment"
 imp_1985_eb_soviet_commitment_desc: "Moscow is spending real political attention, supplies and command capacity to hold the bloc together."

 imp_1985_eb.1.t: "Strike Wave Spreads"
 imp_1985_eb.1.d: "Shortages, workplace discipline and underground opposition have converged into coordinated strikes. The state can still contain them, but the economic cost is immediate and democratic networks gain confidence."
 imp_1985_eb.1.a: "Keep the lines moving somehow."
 imp_1985_eb.2.t: "Mass Demonstrations"
 imp_1985_eb.2.d: "Public rallies have outgrown the usual circles of dissidents. Workers, students, churches and reform-minded officials now test how far the ruling party is willing to go."
 imp_1985_eb.2.a: "Offer talks and limited concessions."
 imp_1985_eb.2.b: "Clear the streets."
 imp_1985_eb.2.c: "Request Soviet coordination."
 imp_1985_eb.3.t: "The Security Apparatus Fractures"
 imp_1985_eb.3.d: "Orders are still issued, but obedience is no longer automatic. Local commanders hesitate, party cadres hedge, and the opposition senses that the old system may no longer be able to enforce itself."
 imp_1985_eb.3.a: "Open a political settlement."
 imp_1985_eb.3.b: "Order the army to restore control."
 imp_1985_eb.3.c: "Call Moscow before the chain of command breaks."
