 IMP_1985_eastern_bloc_category: "Eastern Bloc Stability"
 IMP_1985_eastern_bloc_category_desc: "Comrade First Secretary, this is your stability board. Each value runs from §Y0 to 100§!. For §YRegime Control§!, §YSecurity Loyalty§! and §YMoscow Leverage§!, higher is safer. For §YDemocratic Pressure§! and §YEconomic Strain§!, higher is more dangerous.\n\n£GFX_imp_1985_eb_regime_control_icon  §YRegime Control: [?imp_eb_regime_control|Y0]§!\nThis is the party's ability to make ministries, factories, unions, media and local cadres obey the same line. Above §Y70§! routine administration still works. Below §Y45§! Moscow's grip starts slipping faster. Below §Y40§! demonstrations become much harder to contain. Below §Y36§! extreme public pressure can fracture the security chain.\n\n£GFX_imp_1985_eb_democratic_pressure_icon  §YDemocratic Pressure: [?imp_eb_democratic_pressure|Y0]§!\nThis is the confidence of churches, students, workers, reform economists and underground civic networks. Above §Y59§! democratic popularity begins to grow. Above §Y78§! strikes can brew. Above §Y87§! mass demonstrations can form. Above §Y91§!, weak control or weak security can become a breakdown crisis.\n\n£GFX_imp_1985_eb_economic_strain_icon  §YEconomic Strain: [?imp_eb_economic_strain|Y0]§!\nThis is the pressure from queues, hard-currency shortages, debt service, tired factories and bad deliveries. Above §Y49§! the economy starts hurting tax income, productivity and construction. Above §Y79§! strikes can brew. Above §Y84§! shortages feed demonstrations and accelerate democratic pressure.\n\n£GFX_imp_1985_eb_security_loyalty_icon  §YSecurity Loyalty: [?imp_eb_security_loyalty|Y0]§!\nThis is whether police, informants, internal troops and commanders still obey hard orders. Above §Y70§! coercive options are reliable. Below §Y50§! emergency rule becomes dangerous. Below §Y43§!, extreme public pressure can cause a security breakdown.\n\n£GFX_imp_1985_eb_moscow_leverage_icon  §YMoscow Leverage: [?imp_eb_moscow_leverage|Y0]§!\nThis is Soviet influence through party channels, officers, energy, trade and diplomatic pressure. Above §Y69§! Soviet help eases strain. Above §Y79§! Moscow slows democratic pressure. Below §Y40§! pressure accelerates because local actors test the distance from the center.\n\n§YCycle.§! Democratic pressure ticks every §Y90§! days, economic strain every §Y120§! days, and Soviet leverage slips every §Y180§! days. Costs are paid when a decision starts; the political result arrives when the mission completes. Routine decisions buy time, while focus paths can later unlock deeper reform, repression or Soviet intervention.\n\n§YPolitical boundary.§! The board remains active only while the ruling Emerging Outlook party is socialist or communist: socialism, Communist-State, anarchist_communism, neutral_Social or Neutral_Communism. Liberal, conservative, military, nationalist or other governments end the board and close these emergency channels. Reform-left governments soften the board: socialism, neutral_Social and the DDR's SED reform wing apply §YReform Socialist Decompression§!, reducing pressure, strain and state-operation debuffs while Moscow leverage slips faster.\n\n§YHow to read the board.§! Keep pressure and strain below the yellow danger band, keep control and security above §Y50§!, and ask Moscow for help before leverage collapses. Ignoring the board will eventually produce strikes, demonstrations and possibly civil conflict."
 IMP_1985_moscow_leverage_category: "Moscow Leverage"
 IMP_1985_moscow_leverage_category_desc: "The Soviet center can still hold the bloc together, but not for free. Targeted stabilization strengthens one ally's Moscow Leverage, Security Loyalty and Regime Control while reducing pressure and strain. It now mainly increases Soviet Influence through the MD influence system, with a smaller autonomy score loss to represent advisers, obligations and tighter command channels. Bloc-wide security coordination and cheap energy exports require the Warsaw Pact focus path. Tirana channels require Warsaw Pact reform. If Moscow itself is no longer ruled by a socialist or communist Emerging Outlook party, these channels close. These decisions cost PP, Treasury, Command Power and temporary consumer goods pressure."

