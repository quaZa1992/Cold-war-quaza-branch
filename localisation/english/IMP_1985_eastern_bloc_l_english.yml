 IMP_1985_eb_attempt_restoration_effect_tt: "If Security Loyalty is above 49 and Regime Control is above 39: §YTemporary shock:§! §YEmergency Law§! for 180 days. §YPermanent bloc shift:§! §G-14 Democratic Pressure§!, §G+10 Regime Control§!, §R-14 Security Loyalty§!, §R+14 Economic Strain§!, §G+4 Moscow Leverage§!, §R-7.00% Stability§!, §R+2.50% Democratic Popularity§!, and §G+1.00% Communism Popularity§!. Otherwise, democratic civil war may begin."
