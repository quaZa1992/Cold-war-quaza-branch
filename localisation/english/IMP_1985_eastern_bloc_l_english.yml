 IMP_1985_moscow_stabilize_DDR: "Reinforce the SED Apparatus"
 IMP_1985_moscow_stabilize_DDR_desc: "Send advisers, supplies and political discipline to East Berlin. §YEffect on the DDR:§! §G+12 Moscow Leverage§!, §G+6 Security Loyalty§!, §G+5 Regime Control§!, §G-6 Democratic Pressure§!, §G-4 Economic Strain§!, §YMoscow Advisors§! for 180 days, §G+4.00% Soviet Influence§!, and §R-40 Autonomy Score§!."
 IMP_1985_moscow_stabilize_POL: "Stabilize the PZPR"
 IMP_1985_moscow_stabilize_POL_desc: "Back the Polish party center before debt, church networks and workplace organization set the pace. §YEffect on Poland:§! §G+12 Moscow Leverage§!, §G+6 Security Loyalty§!, §G+5 Regime Control§!, §G-6 Democratic Pressure§!, §G-4 Economic Strain§!, §YMoscow Advisors§! for 180 days, §G+4.00% Soviet Influence§!, and §R-40 Autonomy Score§!."
 IMP_1985_moscow_stabilize_CZE: "Back the Czechoslovak Presidium"
 IMP_1985_moscow_stabilize_CZE_desc: "Reassure Prague's leadership and keep normalization cadres confident. §YEffect on Czechoslovakia:§! §G+12 Moscow Leverage§!, §G+6 Security Loyalty§!, §G+5 Regime Control§!, §G-6 Democratic Pressure§!, §G-4 Economic Strain§!, §YMoscow Advisors§! for 180 days, §G+4.00% Soviet Influence§!, and §R-40 Autonomy Score§!."
 IMP_1985_moscow_stabilize_HUN: "Support the Hungarian Party Center"
 IMP_1985_moscow_stabilize_HUN_desc: "Hold Budapest inside the bloc without forcing every reform argument into open confrontation. §YEffect on Hungary:§! §G+12 Moscow Leverage§!, §G+6 Security Loyalty§!, §G+5 Regime Control§!, §G-6 Democratic Pressure§!, §G-4 Economic Strain§!, §YMoscow Advisors§! for 180 days, §G+4.00% Soviet Influence§!, and §R-40 Autonomy Score§!."
 IMP_1985_moscow_stabilize_ROM: "Pressure Bucharest into Line"
 IMP_1985_moscow_stabilize_ROM_desc: "Bucharest resists dependence, but pressure and selective support can still bind it to the bloc. §YEffect on Romania:§! §G+12 Moscow Leverage§!, §G+6 Security Loyalty§!, §G+5 Regime Control§!, §G-6 Democratic Pressure§!, §G-4 Economic Strain§!, §YMoscow Advisors§! for 180 days, §G+4.00% Soviet Influence§!, and §R-40 Autonomy Score§!."
 IMP_1985_moscow_stabilize_BUL: "Reassure Sofia"
 IMP_1985_moscow_stabilize_BUL_desc: "Use reliable Bulgarian channels to keep the southern flank quiet. §YEffect on Bulgaria:§! §G+12 Moscow Leverage§!, §G+6 Security Loyalty§!, §G+5 Regime Control§!, §G-6 Democratic Pressure§!, §G-4 Economic Strain§!, §YMoscow Advisors§! for 180 days, §G+4.00% Soviet Influence§!, and §R-40 Autonomy Score§!."
 IMP_1985_moscow_reopen_tirana_channels: "Reopen Tirana Channels"
 IMP_1985_moscow_reopen_tirana_channels_desc: "Albania is outside normal Warsaw Pact discipline, so this is a slow diplomatic probe rather than a command. §YEffect on Albania:§! §G+10 Moscow Leverage§!, §G-3 Economic Strain§!, §R+2 Democratic Pressure§!, §G+2.00% Soviet Influence§!, and §R-15 Autonomy Score§! if applicable."
 IMP_1985_moscow_warsaw_pact_security_coordination: "Warsaw Pact Security Coordination"
 IMP_1985_moscow_warsaw_pact_security_coordination_desc: "Coordinate bloc security organs, border services and party-police channels. §YEffect on each Warsaw Pact bloc member:§! §G+5 Moscow Leverage§!, §G+5 Security Loyalty§!, §G+3 Regime Control§!, §G-3 Democratic Pressure§!, §R+2 Economic Strain§!, §YMoscow Advisors§! for 120 days, §G+2.00% Soviet Influence§!, and §R-20 Autonomy Score§!."
 IMP_1985_moscow_cheap_energy_exports: "Cheap Energy Exports"
 IMP_1985_moscow_cheap_energy_exports_desc: "Discounted energy is the quietest stabilizer Moscow still has. §YEffect on each Warsaw Pact bloc member:§! §G+4 Moscow Leverage§!, §G-8 Economic Strain§!, §G-2 Democratic Pressure§!, §G+1 Regime Control§!, §G+1.50% Soviet Influence§!, and §R-15 Autonomy Score§!."
