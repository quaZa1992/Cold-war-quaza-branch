 IMP_1985_eb_democratic_pressure_tick: "Democratic Pressure Building"
 IMP_1985_eb_democratic_pressure_tick_desc: "Opposition circles, churches, student groups and reform economists are learning how to speak to each other. Every §Y90§! days, §YDemocratic Pressure§! rises by a base of §R+2§!, with extra growth from severe shortages, distant Moscow channels, brittle regime control or overbearing control. Very high Moscow leverage or very high security loyalty can slow the rise."
 IMP_1985_eb_economic_strain_tick: "Economic Strain Building"
 IMP_1985_eb_economic_strain_tick_desc: "Debt, queues and workplace fatigue are accumulating. Every §Y120§! days, §YEconomic Strain§! rises by a base of §R+2§!, with extra growth when public pressure is already high or the apparatus keeps squeezing production. Strong Moscow leverage and Soviet advisers can reduce the rise."
 IMP_1985_eb_moscow_slippage_tick: "Moscow Leverage Slipping"
 IMP_1985_eb_moscow_slippage_tick_desc: "Soviet authority does not decay in speeches; it decays in missed deliveries, ignored phone calls and local cadres testing the distance. Every §Y180§! days, §YMoscow Leverage§! falls by a base of §R-2§!, faster when democratic pressure is high or regime control is brittle."
 IMP_1985_eb_strike_wave_mission: "Strike Wave Brewing"
 IMP_1985_eb_strike_wave_mission_desc: "If §YDemocratic Pressure§! rises above §Y78§! or §YEconomic Strain§! rises above §Y79§!, workplace discipline may crack. Completion triggers a strike event, temporary disruption and permanent pressure on the stability board."
 IMP_1985_eb_mass_demonstrations_mission: "Mass Demonstrations Brewing"
 IMP_1985_eb_mass_demonstrations_mission_desc: "If public pressure becomes too high, dissent moves from private rooms to open streets. Completion triggers a demonstration event with negotiated, coercive or Soviet-backed responses."
 IMP_1985_eb_security_breakdown_mission: "Security Apparatus Fracturing"
 IMP_1985_eb_security_breakdown_mission_desc: "If democratic pressure is extreme and the coercive apparatus loses confidence, orders may stop being automatic. Completion triggers a severe security crisis."

 IMP_1985_eb_regime_control_status: "Regime Control: [?imp_eb_regime_control|Y0]"
 IMP_1985_eb_regime_control_status_desc: "Advisor's reading: the party still rules where ministries, local cadres, unions, media and factory committees obey the same line. Low control makes strikes and demonstrations harder to contain."
 IMP_1985_eb_democratic_pressure_status: "Democratic Pressure: [?imp_eb_democratic_pressure|Y0]"
 IMP_1985_eb_democratic_pressure_status_desc: "Advisor's reading: opposition networks, churches, student circles, reform economists and independent unions are gaining confidence. High pressure feeds events and democratic popularity."
 IMP_1985_eb_economic_strain_status: "Economic Strain: [?imp_eb_economic_strain|Y0]"
 IMP_1985_eb_economic_strain_status_desc: "Advisor's reading: shortages, hard-currency stress, debt and workplace fatigue are turning administration into politics. High strain feeds strikes and accelerates democratic pressure."
 IMP_1985_eb_security_loyalty_status: "Security Loyalty: [?imp_eb_security_loyalty|Y0]"
 IMP_1985_eb_security_loyalty_status_desc: "Advisor's reading: internal security, party police, army commanders and informant networks still matter only if they obey hard orders. Low loyalty makes crackdowns risky."
 IMP_1985_eb_moscow_leverage_status: "Moscow Leverage: [?imp_eb_moscow_leverage|Y0]"
 IMP_1985_eb_moscow_leverage_status_desc: "Advisor's reading: Soviet diplomatic, military, energy and party channels still bind this state to the bloc. High leverage stabilizes the regime, but it also makes the economy feel Moscow's weight."

 IMP_1985_eb_subsidize_consumer_goods: "Subsidize Consumer Goods"
 IMP_1985_eb_subsidize_consumer_goods_desc: "Move scarce hard currency into consumer supply before queues become politics. This is a routine stabilizer, not a settlement."
 IMP_1985_eb_factory_supply_priorities: "Prioritize Factory Supply Lines"
 IMP_1985_eb_factory_supply_priorities_desc: "Direct the better deliveries to politically sensitive plants, transport hubs and heavy industry towns. Workers notice shelves before they read communiques."
 IMP_1985_eb_local_grievance_commissions: "Send Local Grievance Commissions"
 IMP_1985_eb_local_grievance_commissions_desc: "Let trusted officials hear housing, church, wage and supply complaints early. A report table is cheaper than a square full of banners, but every hearing admits that something is wrong."
 IMP_1985_eb_rotate_party_secretaries: "Rotate Tired Party Secretaries"
 IMP_1985_eb_rotate_party_secretaries_desc: "Replace local secretaries who have become too comfortable, too hated or too slow. Rotation restores obedience, though the disrupted networks complain and production loses rhythm."
 IMP_1985_eb_mass_organization_campaign: "Mobilize Mass Organizations"
 IMP_1985_eb_mass_organization_campaign_desc: "Use youth leagues, workplace committees, veterans and women's organizations to occupy civic space before opposition networks do. The campaign is modest, repeatable and useful when pressure is still manageable."
 IMP_1985_eb_workplace_cadre_visits: "Dispatch Workplace Cadres"
 IMP_1985_eb_workplace_cadre_visits_desc: "Send party cadres into factories, mines and transport depots before rumors become organization. The point is not reform; the point is to hear, warn and promise just enough to keep the shift working."
 IMP_1985_eb_expand_informal_privileges: "Expand Informal Privileges"
 IMP_1985_eb_expand_informal_privileges_desc: "Quietly widen access to better shops, travel permits, housing queues and workplace favors for key groups. It is cheaper than a real reform package and safer than a crackdown, but it admits that loyalty now has a price."
 IMP_1985_eb_church_union_surveillance: "Monitor Churches and Unions"
 IMP_1985_eb_church_union_surveillance_desc: "Put informants back into parishes, student circles, unofficial unions and workplace committees. This is targeted pressure rather than open repression, but it still consumes police capacity and feeds quiet resentment."
 IMP_1985_eb_request_soviet_party_advisors: "Request Soviet Party Advisors"
 IMP_1985_eb_request_soviet_party_advisors_desc: "Invite Soviet party, security and planning advisers to steady the local apparatus. It reassures hardliners and improves coordination, but it also reminds everyone that sovereignty is conditional."
 IMP_1985_eb_expand_state_security: "Expand State Security"
 IMP_1985_eb_expand_state_security_desc: "Fund surveillance, informants and internal troops. This restores control, but it is expensive and creates political backlash."
 IMP_1985_eb_controlled_liberalization: "Permit Managed Civic Channels"
 IMP_1985_eb_controlled_liberalization_desc: "Offer narrow legal channels for petitions, local press and economic fixes. This is only available after a focus unlock or when pressure has already become dangerous. It bleeds pressure without declaring an opening, but it teaches society how to negotiate."
 IMP_1985_eb_hard_currency_loans: "Seek Hard Currency Loans"
 IMP_1985_eb_hard_currency_loans_desc: "A loan eases the shelves and the budget, but weakens Moscow's grip and gives reformers more oxygen."
 IMP_1985_eb_emergency_law: "Authorize Emergency Law"
 IMP_1985_eb_emergency_law_desc: "Deploy the apparatus before the street owns the timetable. This is a crisis tool, not normal administration; if the security services are wavering, it can backfire."
 IMP_1985_eb_round_table_talks: "Prepare Round Table Channels"
 IMP_1985_eb_round_table_talks_desc: "Open controlled talks with opposition, churches, unions and reform economists only after a focus unlock or during a near-breakdown crisis. This can prevent collapse, but it breaks the monopoly of power and cannot be treated as routine administration."

