# IMPERIA CW — Cold War: Imperia technologies — English localisation.
 imp_burestnevik: "9M730 Burevestnik"
 imp_burestnevik_desc: "Part of Russia's Doomsday Arsenal, the  Burevestnik nuclear-powered cruise missile is powered by a Nuclear engine, capable of hovering in the air indefinitely. Reaching the speed of sound, it is capable of beating most Air-defences."
 sp_imp_9M730_burevestnik: "9M730 Burevestnik"
 sp_imp_9M730_burevestnik_desc: "The development of the 9M730 Burevestnik is not treated as a standard aerospace project; it is spoken of as the \"Conquest of the Fifth Element.\" Within the closed cities of the Russian Arctic, the project exists in a state of high-tension secrecy, where the laws of conventional physics are pushed to their absolute breaking point."
 imp_sov_burestnevik_GLCM: "9M730 Burevestnik GLCM"
 imp_sov_burestnevik_NIRBM: "9M730 Burevestnik NIRBM"
