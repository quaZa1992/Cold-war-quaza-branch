l_english:
# IMPERIA COLD WAR — Rhodesia focus programmes
 COLDWAR_RHO_crossroads:0 "The Rhodesian Question"
 COLDWAR_RHO_crossroads_desc:0 "War, sanctions and political exclusion have narrowed the choices facing this divided country."
 COLDWAR_RHO_zimbabwe:0 "An Independent Zimbabwe"
 COLDWAR_RHO_zimbabwe_desc:0 "A settlement brings majority rule and independence. Robert Mugabe and ZANU-PF take responsibility for a divided country."
 COLDWAR_RHO_rhodesia:0 "Hold to Rhodesia"
 COLDWAR_RHO_rhodesia_desc:0 "The Rhodesian Front rejects a transfer of power, continuing the existing order amid conflict and isolation."
 COLDWAR_RHO_ceasefire:0 "Silence the Guns"
 COLDWAR_RHO_ceasefire_desc:0 "Combatants and civilians must be persuaded that a ceasefire will hold."
 COLDWAR_RHO_reconcile:0 "A Government of Reconciliation"
 COLDWAR_RHO_reconcile_desc:0 "The new government must reach beyond its wartime supporters while establishing its authority."
 COLDWAR_RHO_integrate:0 "A National Army"
 COLDWAR_RHO_integrate_desc:0 "Former guerrillas and Rhodesian servicemen must be brought into one chain of command despite mistrust."
 COLDWAR_RHO_health:0 "Reopen Rural Clinics"
 COLDWAR_RHO_health_desc:0 "Restore basic care where war and displacement have interrupted ordinary life."
 COLDWAR_RHO_reconstruction:0 "The Work of Reconstruction"
 COLDWAR_RHO_reconstruction_desc:0 "Public works can reconnect markets, villages and communities."
 COLDWAR_RHO_land:0 "Land for Resettlement"
 COLDWAR_RHO_land_desc:0 "A gradual programme can return land to families, but surveying and settlement place demands on the state."
 COLDWAR_RHO_capital:0 "Bring Back Investment"
 COLDWAR_RHO_capital_desc:0 "Reassure businesses and trading partners to attract capital, accepting the cost of concessions."
 COLDWAR_RHO_future:0 "A Zimbabwean Future"
 COLDWAR_RHO_future_desc:0 "The state must turn independence into lasting livelihoods and institutions."
 COLDWAR_RHO_security:0 "Secure the Rural Districts"
 COLDWAR_RHO_security_desc:0 "Extend security operations into contested districts at a cost to confidence and the prospect of a settlement."
 COLDWAR_RHO_sanctions:0 "Circumvent the Embargo"
 COLDWAR_RHO_sanctions_desc:0 "Work around sanctions and foreign exchange shortages; the effort cannot make isolation disappear."
 COLDWAR_RHO_border:0 "Hold the Border Crossings"
 COLDWAR_RHO_border_desc:0 "Deploy scarce resources to patrol routes and coordinate against insurgent infiltration."
 COLDWAR_RHO_industry:0 "Domestic Substitutes"
 COLDWAR_RHO_industry_desc:0 "Direct local capacity toward essential goods as imports become harder to obtain."
 COLDWAR_RHO_supplies:0 "Keep Farms and Mines Working"
 COLDWAR_RHO_supplies_desc:0 "The economy depends on transport and labour to keep farms and mines operating under strain."
 COLDWAR_RHO_front:0 "Stand Firm on the Franchise"
 COLDWAR_RHO_front_desc:0 "The Front rallies supporters around the existing political order, deepening opposition to minority rule."
 COLDWAR_RHO_talks:0 "A Limited Constitutional Opening"
 COLDWAR_RHO_talks_desc:0 "Offer constrained constitutional talks without surrendering Rhodesian control."
 COLDWAR_RHO_endure:0 "A Country under Pressure"
 COLDWAR_RHO_endure_desc:0 "The state must continue to cope with war and international isolation."
 COLDWAR_RHO_independence_tt:0 "Zimbabwe becomes independent under Robert Mugabe and ZANU-PF."
 COLDWAR_RHO_rhodesia_tt:0 "The Rhodesian Front retains power under Ian Smith."
 COLDWAR_RHO_ZIMBABWE:0 "Republic of Zimbabwe"
 COLDWAR_RHO_ZIMBABWE_DEF:0 "the Republic of Zimbabwe"
 COLDWAR_RHO_ZIMBABWE_ADJ:0 "Zimbabwean"
