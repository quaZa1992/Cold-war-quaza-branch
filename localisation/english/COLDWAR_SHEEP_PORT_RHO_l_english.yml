 COLDWAR_RHO_ZIMBABWE_nationalist:0 "Republic of Zimbabwe"
 COLDWAR_RHO_ZIMBABWE_nationalist_DEF:0 "the Republic of Zimbabwe"
 COLDWAR_RHO_ZIMBABWE_nationalist_ADJ:0 "Zimbabwean"
 COLDWAR_RHO_ceasefire_spirit:0 "A Fragile Ceasefire"
 COLDWAR_RHO_ceasefire_spirit_desc:0 "Armed groups and communities remain wary."
 COLDWAR_RHO_rural_health:0 "Rural Health Effort"
 COLDWAR_RHO_rural_health_desc:0 "Reopening clinics helps communities while increasing public expenditure."
 COLDWAR_RHO_resettlement:0 "A Resettlement Programme"
 COLDWAR_RHO_resettlement_desc:0 "Land settlement requires administrative capacity and support for new farmers."
 COLDWAR_RHO_investment:0 "A Welcome for Investors"
 COLDWAR_RHO_investment_desc:0 "New investment brings capacity while outside commitments constrain spending."
 COLDWAR_RHO_security_spirit:0 "War in the Countryside"
 COLDWAR_RHO_security_spirit_desc:0 "Security forces gain experience while conflict damages public confidence."
 COLDWAR_RHO_sanctions_spirit:0 "An Economy under Embargo"
 COLDWAR_RHO_sanctions_spirit_desc:0 "Import substitution cannot replace access to export markets."
 COLDWAR_RHO_supply:0 "Farm and Mine Priorities"
 COLDWAR_RHO_supply_desc:0 "Keeping primary production moving consumes administrative resources."
 COLDWAR_RHO_franchise:0 "Defence of the Franchise"
 COLDWAR_RHO_franchise_desc:0 "Defending the restricted franchise mobilises supporters and hardens divisions."
 COLDWAR_RHO_talks_spirit:0 "A Restricted Opening"
 COLDWAR_RHO_talks_spirit_desc:0 "Talks can ease tensions, but concessions limit government freedom of action."
