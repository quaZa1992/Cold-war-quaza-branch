 # 1970 oil requests and six-month technical transfer
 LBA_1970_request_algerian_oil_assistance:0 "Request Algerian Oil Assistance"
 LBA_1970_request_algerian_oil_assistance_desc:0 "Algeria receives an oil-assistance event. If it accepts: gain the Algerian Petroleum Mission, improve relations, pay 2.5 billion, unlock Six-Month Technical Transfer, and close the other offers. If it refuses: the other offers remain available. Oil control improves only after training."
 LBA_1970_request_french_oil_engineers:0 "Invite French Oil Engineers"
 LBA_1970_request_french_oil_engineers_desc:0 "France receives an oil-engineering event. If it accepts: gain the French Petroleum Mission, improve relations, grant 2% French influence, pay 7.5 billion, unlock Six-Month Technical Transfer, and close the other offers. If it refuses: the other offers remain available. Oil control improves only after training."
 LBA_1970_six_month_technical_transfer:0 "Six-Month Technical Transfer"
 LBA_1970_six_month_technical_transfer_desc:0 "Foreign petroleum specialists will work alongside Libyan crews through a sustained training period. The National Oil Corporation must absorb their methods and prepare its own staff to supervise extraction. Practical competence, rather than the arrival of a mission alone, will make greater operational control possible."
 LBA_1970_domestic_oil_training:0 "Train Domestic Oil Crews"
 LBA_1970_domestic_oil_training_desc:0 "Without a successful foreign technical agreement, the National Oil Corporation must assemble a domestic training effort at greater expense. The programme will develop the practical knowledge needed to supervise extraction, giving Libya a slower but independent route towards control of its petroleum operations."
 LBA_1970_algerian_oil_offer_tt:0 "§YAlgeria will decide.§! If accepted: gain §YAlgerian Petroleum Mission§!, improve relations with Algeria and pay §R2.5 billion§! from the Treasury. If refused: the other partner offers remain available. No oil-control debuff is removed until the §YSix-Month Technical Transfer§! is completed."
 LBA_1970_italian_oil_offer_tt:0 "§YItaly will decide.§! If accepted: gain §YENI Technical Contract§!, improve relations with Italy, grant §Y2% Italian influence§! and pay §R7.5 billion§! from the Treasury. If refused: the other partner offers remain available. Oil control improves only after the §YSix-Month Technical Transfer§!."
 LBA_1970_french_oil_offer_tt:0 "§YFrance will decide.§! If accepted: gain §YFrench Petroleum Mission§!, improve relations with France, grant §Y2% French influence§! and pay §R7.5 billion§! from the Treasury. If refused: the other partner offers remain available. Oil control improves only after the §YSix-Month Technical Transfer§!."
 LBA_1970_soviet_oil_offer_tt:0 "§YThe Soviet Union will decide.§! If accepted: gain §YSoviet Petroleum Mission§!, improve relations with the USSR, grant §Y4% Soviet influence§! and pay §R5 billion§! from the Treasury. If refused: the other partner offers remain available. Oil control improves only after the §YSix-Month Technical Transfer§!."
 LBA_1970_oil_technical_transfer_bonus:0 "Technical Transfer to Libyan Oil Crews"
 LBA_1970_algerian_petroleum_mission:0 "Algerian Petroleum Mission"
 LBA_1970_algerian_petroleum_mission_desc:0 "Algerian specialists assist the National Oil Corporation and train local petroleum workers. This mission ends when Libyanise the Oil Sector is completed."
 LBA_1970_french_petroleum_mission:0 "French Petroleum Mission"
 LBA_1970_french_petroleum_mission_desc:0 "French engineers support extraction and exports under contract while Libyan crews train. The arrangement gives France leverage and ends when Libyanise the Oil Sector is completed."

 # 1975 RCC rupture and the single Gaddafi Jamahiriya trunk
 LBA_1970_muhayshi_seizes_the_rcc:0 "Muhayshi Seizes the RCC"
 LBA_1970_muhayshi_seizes_the_rcc_desc:0 "Muhayshi and the dissident officers will remove Gaddafi and claim the revolution for a renewed collective council. Their victory changes the leadership of the republic without resolving the work of governing it. Reorganising the armed forces and restoring authority to the ministries will be immediate tests of the new order."
 LBA_1970_restore_collective_rcc_rule:0 "Restore Collective RCC Rule"
 LBA_1970_restore_collective_rcc_rule_desc:0 "The council will reassert collective responsibility against the personal dominance that divided the officers. Agreed procedures and a clearer division of authority can stabilise the ministries. The arrangement will endure only if its members accept restraints on their own ambitions as well as those of the former chairman."
 LBA_1970_rebuild_the_ministries:0 "Rebuild the Ministries"
 LBA_1970_rebuild_the_ministries_desc:0 "Years of political intervention have left the ministries dependent on improvised instructions and personal connections. Rebuilding their offices and professional routines will give the republic a more dependable administrative centre. The council must commit resources and allow officials enough authority to carry out their responsibilities."
 LBA_1970_a_constitutional_arab_republic:0 "A Constitutional Arab Republic"
 LBA_1970_a_constitutional_arab_republic_desc:0 "The republic will replace rule by the officers' collective with a more regular constitutional framework. Defined authority and stronger public procedures can reduce arbitrary administration and corruption. The settlement asks the revolutionary elite to accept limits that must apply even when inconvenient to those who founded the state."
 LBA_1970_repair_relations_with_egypt:0 "Repair Relations with Egypt"
 LBA_1970_repair_relations_with_egypt_desc:0 "Relations with Egypt have been damaged by rival ambitions and political disputes. A renewed diplomatic effort will seek a workable relationship between neighbouring republics. Cooperation need not settle every disagreement, but both governments have reasons to prevent competition from consuming their shared interests."
 LBA_1970_rcc_crisis:0 "The RCC Divided"
 LBA_1970_rcc_crisis_desc:0 "Muhayshi's attempted coup has exposed the Revolutionary Command Council's loss of collegiality. Until the crisis is resolved, political authority and stability suffer."
 LBA_1970_collective_rcc:0 "Collective Revolutionary Council"
 LBA_1970_collective_rcc_desc:0 "The post-Gaddafi officers divide executive authority among the RCC and ministries. Administration is steadier, but bargaining slows decisions."
 LBA_1970_constitutional_republic:0 "Constitutional Arab Republic"
 LBA_1970_constitutional_republic_desc:0 "A controlled constitutional order gives the officers' republic more regular administration without immediately creating a competitive democracy."
 LBA_1970.Autocracy_muhayshi:0 "£LBA_Autocracy_small Collective Leadership Council"
 LBA_1970.Autocracy_muhayshi_desc:0 "(Arab Nationalist Military Government) - Collective Leadership Council (Arabic: Majlis al-Qiyada al-Jama'iyya)\n\nMajor Umar al-Muhayshi, a member of the Revolutionary Command Council and Minister of Planning, grows increasingly opposed to Muammar Gaddafi's personal rule and his costly foreign adventures. In this alternative, his 1975 countercoup succeeds and the Jamahiriya is never proclaimed.\n\nThe Collective Leadership Council restores collective military leadership, redirects oil revenues to national development and pursues a more pragmatic foreign policy. It remains Arab nationalist and anti-Western but rejects Gaddafi's ideological experiments."
 LBA_1970.Autocracy_muhayshi_icon:0 "£LBA_Autocracy_small"
 LBA_1970_organise_revolutionary_committees:0 "Organise Revolutionary Committees"
 LBA_1970_organise_revolutionary_committees_desc:0 "Revolutionary committees will organise loyal activists alongside the congresses and public administration. Their supporters regard them as guardians against complacency and hostile interests. Giving such organisations a permanent role also allows political supervision to reach institutions that might otherwise develop authority of their own."
 LBA_1970_the_great_green_charter:0 "The Great Green Charter"
 LBA_1970_the_great_green_charter_desc:0 "The leadership will set out a public account of rights and legitimacy within the Jamahiriya. A charter can give officials and citizens a common language for their claims, but its meaning will depend on how the revolutionary authorities reconcile those promises with their continuing political supremacy."
 LBA_1970_revolutionary_committees:0 "Revolutionary Committees"
 LBA_1970_revolutionary_committees_desc:0 "Ideological committees supervise the people's congresses and reinforce Gaddafi's informal authority. They also discourage independent technical and political debate."
 LBA_1970_green_charter:0 "Great Green Charter"
 LBA_1970_green_charter_desc:0 "The Jamahiriya's rights charter modestly improves legitimacy and procedures, though the revolutionary state retains decisive power."

 # Oil partner and crisis event text
 LBA1970Oil.1.t:0 "Libya Requests Algerian Oil Assistance"
 LBA1970Oil.1.d:0 "The Libyan National Oil Corporation asks for Algerian petroleum specialists and practical training. Cooperation would strengthen a neighbouring Arab producer, but require our own technical staff."
 LBA1970Oil.2.t:0 "Libya Approaches ENI"
 LBA1970Oil.2.d:0 "Tripoli proposes a technical contract with ENI to support Libyan operations while training local crews. The terms promise commercial access, but the new Libyan government intends to retain the final say."
 LBA1970Oil.3.t:0 "Libya Seeks French Oil Engineers"
 LBA1970Oil.3.d:0 "Libya invites French specialists to assist the National Oil Corporation with extraction and export infrastructure under a fixed-term technical agreement."
 LBA1970Oil.4.t:0 "Libya Seeks Soviet Oil Specialists"
 LBA1970Oil.4.d:0 "Tripoli proposes a Soviet petroleum mission to reduce dependence on its Western concessionaires. This would give Moscow an opening in a country that has so far kept it at arm's length."
 LBA1970Oil.accept:0 "Approve the mission"
 LBA1970Oil.decline:0 "Decline the request"
 LBA1970Oil.acknowledge:0 "Begin the six-month transfer"
 LBA1970Oil.try_another:0 "Approach another partner"
 LBA1970Oil.11.t:0 "Algeria Agrees to Assist the NOC"
 LBA1970Oil.11.d:0 "Algerian oil specialists will assist the National Oil Corporation. The temporary mission is in place; a six-month technical transfer must still be completed before Libya can expand direct control of the fields. Other partner offers are now closed."
 LBA1970Oil.12.t:0 "Italy Accepts the ENI Contract"
 LBA1970Oil.12.d:0 "ENI will provide technical staff under Libyan terms. The contract supports exports but gives Italy a limited commercial foothold. Other partner offers are now closed; the six-month transfer remains to be completed."
 LBA1970Oil.13.t:0 "France Sends Oil Engineers"
 LBA1970Oil.13.d:0 "France accepts a temporary petroleum-engineering mission. Its specialists will help train Libyan crews while receiving a limited economic opening. Other partner offers are now closed."
 LBA1970Oil.14.t:0 "The USSR Accepts Libya's Request"
 LBA1970Oil.14.d:0 "Soviet specialists will train Libyan oil crews, giving Moscow greater influence. The mission is temporary and does not immediately erase Libya's oil-sector weakness. Other partner offers are now closed."
 LBA1970Oil.21.t:0 "Algeria Declines"
 LBA1970Oil.21.d:0 "Algiers cannot commit a technical mission. Libya may now make another available offer; no mission or oil-sector bonus has been granted."
 LBA1970Oil.22.t:0 "Italy Declines"
 LBA1970Oil.22.d:0 "Rome will not approve the proposed ENI arrangement. Libya may approach another partner; no mission or oil-sector bonus has been granted."
 LBA1970Oil.23.t:0 "France Declines"
 LBA1970Oil.23.d:0 "Paris rejects the engineering request. The other available partners remain open to Libya; no mission or oil-sector bonus has been granted."
 LBA1970Oil.24.t:0 "The USSR Declines"
 LBA1970Oil.24.d:0 "Moscow refuses the proposed mission. Libya may still seek technical assistance elsewhere; no mission or oil-sector bonus has been granted."
 LBA1970RCC.1.t:0 "The Revolutionary Command Council Splits"
 LBA1970RCC.1.d:0 "Umar Muhayshi and dissident officers have moved against Gaddafi. Their failure was historical, but this crisis may now end either in Gaddafi's personal victory or in a new collective officers' republic. The RCC crisis will continue until one of those focuses is completed."
 LBA1970RCC.1.a:0 "The officers must decide Libya's future"
