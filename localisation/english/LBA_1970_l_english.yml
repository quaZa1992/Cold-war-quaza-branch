l_english:
# IMPERIA CW — Cold War: LBA 1970 — English localisation.
 LBA_1970_focus:0 "The Libyan Revolution, 1970-2000"
 LBA_1970_public_health_administration:0 "Coordinated Public Healthcare"
 LBA_1970_public_health_administration_desc:0 "A coordinated administration directs personnel and supplies towards dependable public healthcare. Better organisation reduces the cost of maintaining the republic's medical services."
 LBA_1970_focus_desc:0 "From an officers' revolution to the Jamahiriya, Libya must build the National Oil Corporation, secure technical expertise and survive the 1975 RCC crisis. Foreign assistance and African cooperation are player choices, while alternative governments have separate national programmes."

 # Dynamic 1970 party names
 LBA_1970.Autocracy_rcc:0 "£LBA_Autocracy_small Revolutionary Command Council"
 LBA_1970.Autocracy_rcc_desc:0 "(Arab Nationalist Military Government) - Revolutionary Command Council (Arabic: Majlis Qiyadat al-Thawra, RCC)\n\nThe Revolutionary Command Council is the body of Free Officers that overthrew King Idris in September 1969. Formally a collective military leadership, it is increasingly dominated by its chairman, Muammar Gaddafi, and rules while the institutions of the new republic are still being built.\n\nIn 1970 the council expels the British and American bases, including Wheelus Air Base, confiscates the property of the Italian settlers and pressures the oil companies for higher prices."
 LBA_1970.Autocracy_rcc_icon:0 "£LBA_Autocracy_small"
 LBA_1970.Autocracy_asu:0 "£LBA_Autocracy_democracy (ASU) - Arab Socialist Union"
 LBA_1970.Autocracy_asu_desc:0 "(Nasserism) - Libyan Arab Socialist Union (Arabic: Al-Ittihad al-Ishtiraki al-Arabi, ASU)\n\nModelled on Egypt's mass political organisation, the Arab Socialist Union is intended to bind workers, officers and local notables to the revolution. It remains the only legal political organisation and operates beneath the authority of Gaddafi and the Revolutionary Command Council.\n\nFounded in 1971, it organises the population into basic units, promotes Arab unity, socialism and Islam, and aims to mobilise the people while excluding independent parties. Its national congresses give Gaddafi a stage for his speeches on the revolution."
 LBA_1970.Autocracy_asu_icon:0 "£LBA_Autocracy_democracy"
 LBA_1970.Autocracy_jamahiriya:0 "£LBA_Autocracy_small General People's Congress"
 LBA_1970.Autocracy_jamahiriya_desc:0 "(Third International Theory) - Revolutionary Leadership and General People's Congress (Arabic: Al-Jamahiriyya / Mu'tamar al-Sha'b al-'Amm)\n\nThe Jamahiriya officially locates sovereignty in the Basic People's Congresses and their General People's Congress. In practice, Muammar Gaddafi's Revolutionary Leadership and the Revolutionary Committees guide the formal congress system and retain decisive authority.\n\nProclaimed in 1977 on the basis of the Green Book, it abolishes parties and conventional state structures in favour of 'direct democracy', while oil wealth funds welfare, mass housing and revolutionary movements abroad. Dissent is suppressed by the Revolutionary Committees in the name of the masses."
 LBA_1970.Autocracy_jamahiriya_icon:0 "£LBA_Autocracy_small"

 # Opening revolution and state-building
 LBA_1970_a_revolution_barely_one_year_old:0 "A Revolution Barely One Year Old"
 LBA_1970_a_revolution_barely_one_year_old_desc:0 "The officers who overthrew the monarchy have inherited a country whose oil wealth conceals weak ministries, neglected farms and an unprepared army. The Revolutionary Command Council must turn its victory into a government capable of reaching beyond the barracks and the coastal cities."
 LBA_1970_consolidate_the_rcc:0 "Consolidate the RCC"
 LBA_1970_consolidate_the_rcc_desc:0 "The council can issue proclamations more easily than it can make ministries obey them. Clear responsibilities, reliable provincial reporting and a common political direction will give the young republic a working centre, while strengthening the officers who speak in the revolution's name."
 LBA_1970_close_the_foreign_bases:0 "Close the Foreign Bases"
 LBA_1970_close_the_foreign_bases_desc:0 "Foreign airfields and military privileges are difficult to reconcile with the republic's promise of sovereignty. Bringing these arrangements to an end will place Libya's territory under its own authority, even if the departure of British and American forces damages relations with their governments."
 LBA_1970_a_sovereign_mediterranean_state:0 "A Sovereign Mediterranean State"
 LBA_1970_a_sovereign_mediterranean_state_desc:0 "Independence must extend from the palace and the barracks to the coastline. A stronger maritime establishment in Tripoli will help the republic protect its approaches and take its place among the Mediterranean states, while cooperation with neighbouring Egypt offers a regional counterweight to distant powers."
 LBA_1970_the_arab_socialist_union:0 "The Arab Socialist Union"
 LBA_1970_the_arab_socialist_union_desc:0 "The officers need an organisation that can carry their programme into workplaces and neighbourhoods. An Arab Socialist Union will mobilise supporters beneath a single revolutionary banner. Its promise of popular participation must coexist with the council's determination to keep independent parties outside the political system."
 LBA_1970_a_revolutionary_administration:0 "A Revolutionary Administration"
 LBA_1970_a_revolutionary_administration_desc:0 "A republic cannot govern through speeches alone. New offices, trained clerks and dependable communications will connect the council to the daily work of taxation and public services. Building this machinery requires substantial spending before its gains become visible to ordinary Libyans."
 LBA_1970_renegotiate_the_concessions:0 "Renegotiate the Concessions"
 LBA_1970_renegotiate_the_concessions_desc:0 "The concession agreements were written when the companies possessed the expertise and Libya had little bargaining power. Oil now gives the republic leverage. Reopening the terms can secure additional revenue without yet solving the harder problem of operating the fields with Libyan management and technicians."
 LBA_1970_invite_soviet_petroleum_specialists:0 "Request Soviet Oil Specialists"
 LBA_1970_invite_soviet_petroleum_specialists_desc:0 "The National Oil Corporation needs experienced technicians while it prepares a Libyan workforce. A Soviet mission offers an alternative to the Western concessionaires and a new relationship with Moscow. Negotiators must weigh useful expertise against the influence that accompanies dependence on an outside partner."
 LBA_1970_retain_foreign_technical_staff:0 "Negotiate an ENI Technical Contract"
 LBA_1970_retain_foreign_technical_staff_desc:0 "ENI can offer established petroleum expertise without requiring Libya to abandon its claim to national control. A negotiated technical contract would keep experienced staff at work while local crews learn their tasks. Its commercial terms and political consequences must be acceptable to both Tripoli and Rome."
 LBA_1970_libyanise_the_oil_sector:0 "Libyanise the Oil Sector"
 LBA_1970_libyanise_the_oil_sector_desc:0 "Technical assistance should prepare the National Oil Corporation to take responsibility for its own operations. Libyan managers and trained crews will gradually replace dependence on a foreign mission. The transition requires investment and discipline if greater national control is to preserve the flow of exports."
 LBA_1970_establish_the_national_oil_corporation:0 "Establish the National Oil Corporation"
 LBA_1970_establish_the_national_oil_corporation_desc:0 "A national corporation will give the republic an institution able to negotiate with concessionaires, organise technical training and build operational knowledge. Foreign specialists may still be needed, but they will deal with a Libyan counterpart whose purpose is to secure lasting control over the country's petroleum resources."
 LBA_1970_oil_revenues_for_the_people:0 "Oil Revenues for the People"
 LBA_1970_oil_revenues_for_the_people_desc:0 "Control of petroleum must be justified by more than a change of ownership. The republic will direct a greater share of the proceeds towards public education and national development. Citizens will judge the revolution by the services it provides, while ministers must reconcile those expectations with the demands of the oil industry."
 LBA_1970_a_national_literacy_campaign:0 "A National Literacy Campaign"
 LBA_1970_a_national_literacy_campaign_desc:0 "Illiteracy keeps many Libyans outside public administration, technical employment and political life. A national campaign will bring lessons into towns and rural communities, supported by a stronger education budget. Recruiting instructors and sustaining attendance will demand more than a burst of revolutionary enthusiasm."
 LBA_1970_primary_schools_and_rural_teachers:0 "Primary Schools and Rural Teachers"
 LBA_1970_primary_schools_and_rural_teachers_desc:0 "Children beyond the main coastal centres need dependable schools and teachers who can remain in their communities. Training, administration and local support must develop together. This investment will broaden the population able to work in the ministries and enterprises on which the republic increasingly depends."
 LBA_1970_create_the_ministry_of_agriculture:0 "Create the Ministry of Agriculture"
 LBA_1970_create_the_ministry_of_agriculture_desc:0 "Oil receipts cannot make water, soil or experienced cultivators appear. A dedicated ministry will organise agricultural advice and coordinate rural investment. Its first responsibility is to improve the farms that already exist, rather than promise that petroleum wealth can immediately overcome Libya's difficult growing conditions."
 LBA_1970_roads_power_and_schools:0 "Roads, Power and Schools"
 LBA_1970_roads_power_and_schools_desc:0 "Oil revenues will mean little to communities that still lack reliable roads, electricity and schools. A national public-works programme will connect provincial towns to the state and give the revolution a visible presence beyond the oilfields. Maintaining these services will also create lasting obligations for the treasury."
 LBA_1970_the_revolution_delivers:0 "The Revolution Delivers"
 LBA_1970_the_revolution_delivers_desc:0 "The republic's claim to serve ordinary Libyans must be demonstrated in clinics as well as speeches. Expanded healthcare and better organisation of its administration will turn the gains of the opening reforms into dependable public provision. A visible improvement in daily life can strengthen confidence in the revolutionary government."

 # Popular revolution and the Green Book
 LBA_1970_launch_the_popular_revolution:0 "Launch the Popular Revolution"
 LBA_1970_launch_the_popular_revolution_desc:0 "The first reforms have strengthened the state, but Gaddafi argues that the old habits of officeholders still obstruct the revolution. A new mobilisation will challenge established administrators and carry revolutionary authority into local institutions. Its supporters promise participation; its critics fear another concentration of political power."
 LBA_1970_the_cultural_revolution:0 "The Cultural Revolution"
 LBA_1970_the_cultural_revolution_desc:0 "Schools, public discussion and cultural institutions will be enlisted in a campaign to change the values of the republic. Revolutionary instruction promises to break with inherited privilege and foreign dependence. Sustaining such a campaign will also draw people and resources into political mobilisation rather than ordinary administration."
 LBA_1970_green_book_peoples_authority:0 "The Green Book: People's Authority"
 LBA_1970_green_book_peoples_authority_desc:0 "The first part of the Green Book presents representative institutions as an obstacle between the people and their own authority. The leadership will promote a different account of political participation, one in which congresses and revolutionary guidance are expected to replace conventional party competition."
 LBA_1970_green_book_workers_as_partners:0 "The Green Book: Workers as Partners"
 LBA_1970_green_book_workers_as_partners_desc:0 "The leadership argues that wage labour should give way to a partnership between producers and the enterprises in which they work. Turning that claim into workable production arrangements will require experimentation with industrial organisation, rather than relying on ownership declarations to improve the performance of factories."
 LBA_1970_green_book_social_foundations:0 "The Green Book: Social Foundations"
 LBA_1970_green_book_social_foundations_desc:0 "The revolution's social programme depends on citizens able to read its arguments and take part in public institutions. Extending education will give those ambitions a broader base, although official teaching must reconcile the leadership's prescriptions with the varied experience of Libyan households and communities."
 LBA_1970_the_1975_rcc_crisis:0 "The 1975 RCC Crisis"
 LBA_1970_the_1975_rcc_crisis_desc:0 "The unity of the officers has broken down. Muhayshi and his supporters challenge the concentration of authority around Gaddafi, turning disagreement within the council into a struggle over the direction of the republic. The ministries and armed forces cannot regain confidence until the leadership dispute is settled."
 LBA_1970_gaddafi_prevails:0 "Gaddafi Prevails"
 LBA_1970_gaddafi_prevails_desc:0 "Gaddafi's supporters will defeat the challenge within the council and reassert his authority over the revolution. The immediate crisis may end, but collective rule by the original officers will give way to a political order increasingly shaped by the chairman's personal programme and loyal organisations."
 LBA_1970_codify_the_third_international_theory:0 "Codify the Third International Theory"
 LBA_1970_codify_the_third_international_theory_desc:0 "The leadership seeks a doctrine distinct from both parliamentary capitalism and Soviet communism. The Third International Theory will give the revolution a common language for its political institutions and economic experiments. Its credibility will depend on whether those principles can guide administration and production beyond the printed page."
 LBA_1970_proclaim_the_jamahiriya:0 "Proclaim the Jamahiriya"
 LBA_1970_proclaim_the_jamahiriya_desc:0 "The state will be recast as a Jamahiriya, with formal authority located in popular congresses rather than conventional representative government. The proclamation gives the revolution a new institutional identity, while Gaddafi and his allies retain the task of directing the political order they have created."

 # Historical Jamahiriya
 LBA_1970_balance_the_dual_state:0 "Build the People's Congresses"
 LBA_1970_balance_the_dual_state_desc:0 "Popular congresses require procedures, officials and regular meetings if they are to do more than endorse decisions made elsewhere. Building this system will bind local administration to the new constitutional language. Its formal authority must coexist with the leadership and organisations that claim to guard the revolution."
 LBA_1970_gaddafi_above_the_institutions:0 "Gaddafi Above the Institutions"
 LBA_1970_gaddafi_above_the_institutions_desc:0 "Gaddafi will present himself as the guide of the revolution rather than an ordinary officeholder bound by its institutions. This position allows him to arbitrate between congresses, officials and revolutionary organisations. It also makes the political system depend increasingly on his personal authority and continuing intervention."
 LBA_1970_manage_the_security_services:0 "Manage the Security Services"
 LBA_1970_manage_the_security_services_desc:0 "The leadership needs information it can trust and institutions capable of protecting the state. More systematic intelligence work will strengthen its security apparatus and technical competence. Keeping those services effective also requires control over the rivalries and political loyalties that can distort their reporting."
 LBA_1970_the_jamahiriya_endures:0 "The Jamahiriya Endures"
 LBA_1970_the_jamahiriya_endures_desc:0 "The congress system and revolutionary leadership have survived their first tests. Their continued authority now depends on maintaining the support networks that connect public provision, local officials and loyal organisations. Endurance will mean making this political order routine without allowing its institutions to become independent of the revolution."

 # Development and economic models
 LBA_1970_libyanise_the_technical_workforce:0 "Libyanise the Technical Workforce"
 LBA_1970_libyanise_the_technical_workforce_desc:0 "Foreign expertise can operate an installation, but only a trained domestic workforce can make technical independence durable. Further education and practical instruction will prepare Libyans for skilled industrial and administrative work. The investment must build competence that survives the departure of individual advisers."
 LBA_1970_establish_the_gmmr_authority:0 "Establish the GMMR Authority"
 LBA_1970_establish_the_gmmr_authority_desc:0 "Moving water from the interior to the coastal population requires an authority able to coordinate surveys, contractors and a very large construction programme. Establishing that organisation is the first step towards turning underground reserves into dependable supply, with commitments that will outlast a single budget round."
 LBA_1970_gmmr_phase_one_sarir_to_benghazi:0 "GMMR Phase I: Sarir to Benghazi"
 LBA_1970_gmmr_phase_one_sarir_to_benghazi_desc:0 "The eastern water project will connect the Sarir interior to the communities and farms around Benghazi. Pipelines, pumping and distribution must be developed as one system. Completing the route can ease a major constraint on settlement and cultivation, but demands sustained construction spending and technical supervision."
 LBA_1970_gmmr_phase_two_hasawna_to_tripoli:0 "GMMR Phase II: Hasawna to Tripoli"
 LBA_1970_gmmr_phase_two_hasawna_to_tripoli_desc:0 "The western water route will link the Hasawna reserves to the Tripoli region. Its purpose is to support existing communities and agriculture with a more dependable supply. The scale of the works requires coordination across the interior and coast, and a continuing commitment to maintenance after construction ends."
 LBA_1970_complete_state_control:0 "Complete State Control"
 LBA_1970_complete_state_control_desc:0 "Public ownership will become the organising principle of the economy. Ministries and national enterprises will direct investment towards the leadership's priorities instead of leaving the commanding sectors to outside investors. Success will depend on administrative competence as much as on the government's ability to issue orders."
 LBA_1970_state_industrial_boards:0 "State Industrial Boards"
 LBA_1970_state_industrial_boards_desc:0 "Industrial boards will translate national priorities into factory investment and technical improvements. Concentrating expertise can help the state develop manufacturing beyond petroleum. It also places responsibility for practical results on officials who must coordinate production, employment and the demands of the treasury."
 LBA_1970_minority_foreign_partners:0 "Minority Foreign Partners"
 LBA_1970_minority_foreign_partners_desc:0 "Foreign firms can supply knowledge and commercial connections without controlling the national economy. Carefully limited partnerships will allow Libya to draw on that experience while retaining public authority over strategic decisions. The challenge is to make the partners useful without allowing dependence to reappear through their contracts."
 LBA_1970_joint_ventures_on_libyan_terms:0 "Joint Ventures on Libyan Terms"
 LBA_1970_joint_ventures_on_libyan_terms_desc:0 "Joint ventures will be negotiated around Libyan ownership and national development priorities. Commercial offices and local administration must be able to supervise the agreements, rather than leave their interpretation to foreign partners. Productive cooperation with Italy can proceed without abandoning the state's claim to final authority."

 # Armed forces and regional security
 LBA_1970_the_army_of_the_revolution:0 "The Army of the Revolution"
 LBA_1970_the_army_of_the_revolution_desc:0 "The officers' seizure of power did not create a professional army overnight. Training, staff procedures and clearer responsibilities will give the armed forces a stronger foundation. The council must decide whether military service is chiefly an instrument of revolutionary loyalty or a profession with standards of its own."
 LBA_1970_soviet_arms_contracts:0 "Soviet Arms Contracts"
 LBA_1970_soviet_arms_contracts_desc:0 "Soviet cooperation offers access to armoured expertise and a broader range of military equipment. Libya must prepare crews and technical organisations to absorb these opportunities. The relationship can improve its options for modernisation while committing resources and drawing the armed forces closer to Moscow's methods."
 LBA_1970_a_guard_centred_army:0 "A Guard-Centred Army"
 LBA_1970_a_guard_centred_army_desc:0 "The leadership will concentrate reliability and attention in formations closely tied to the revolution. Such a guard can protect the regime and provide a dependable military core. Its prominence also shapes the ambitions of officers elsewhere in the armed forces and binds military organisation more closely to politics."
 LBA_1970_the_chadian_gamble:0 "The Chadian Gamble"
 LBA_1970_the_chadian_gamble_desc:0 "The leadership will press Libya's claim to the Aouzou Strip and prepare to confront Chad over the frontier. A campaign in the south promises strategic reach and nationalist prestige. It also exposes a small army to difficult terrain, long communications and a conflict whose outcome cannot be secured by declarations alone."
 LBA_1970_lessons_of_the_toyota_war:0 "Lessons of the Toyota War"
 LBA_1970_lessons_of_the_toyota_war_desc:0 "The army must confront the failures revealed by the war in Chad. Equipment and political confidence did not compensate for weaknesses in tactics, command and readiness. Honest study of those shortcomings can improve doctrine, provided the leadership allows military judgement to challenge reassuring official accounts."
 LBA_1970_a_professional_officer_corps:0 "A Professional Officer Corps"
 LBA_1970_a_professional_officer_corps_desc:0 "Military advancement must rest on training and competence as well as loyalty. A professional officer corps will establish common standards and turn experience into doctrine that units can actually use. This reform seeks a force able to plan and learn, rather than depend on favoured commanders and improvised orders."
 LBA_1970_accept_border_arbitration:0 "Accept Border Arbitration"
 LBA_1970_accept_border_arbitration_desc:0 "The southern dispute has consumed attention that could be directed towards domestic consolidation. Accepting arbitration offers a way to reduce confrontation with Chad and restore confidence at home. It asks the leadership to exchange the prestige of an uncompromising claim for the benefits of a more stable frontier."
 LBA_1970_claim_the_gulf_of_sidra:0 "Claim the Gulf of Sidra"
 LBA_1970_claim_the_gulf_of_sidra_desc:0 "Libya will assert its interpretation of sovereignty over the Gulf of Sidra and prepare its navy to defend that position. The declaration can mobilise domestic support, but it also brings the republic into direct disagreement with the United States over access to Mediterranean waters."
 LBA_1970_harden_the_air_defences:0 "Harden the Air Defences"
 LBA_1970_harden_the_air_defences_desc:0 "Air surveillance, warning and contemporary anti-aircraft expertise must develop together. Investments around Tripoli and the eastern airfields will give the armed forces a more coherent defensive network. The system's value depends on trained operators and reliable support, as well as on the equipment that ministers purchase."

 # Arab policy and African cooperation
 LBA_1970_the_tripoli_charter:0 "The Tripoli Charter"
 LBA_1970_the_tripoli_charter_desc:0 "Libya will seek a common political understanding with Egypt, Sudan and Syria. The charter offers a language of Arab solidarity through which their governments can coordinate relations. Shared declarations will be a beginning; each partner will still judge cooperation against its own domestic and strategic priorities."
 LBA_1970_the_federation_of_arab_republics:0 "The Federation of Arab Republics"
 LBA_1970_the_federation_of_arab_republics_desc:0 "The leadership will invest diplomatic effort in closer cooperation with neighbouring Arab republics. A federation requires their governments to agree on more than a name, particularly where sovereignty and leadership are concerned. Building confidence among the prospective partners is an essential step towards that ambition."
 LBA_1970_support_liberation_movements:0 "Support Liberation Movements"
 LBA_1970_support_liberation_movements_desc:0 "The revolution will extend its influence through contacts with movements seeking to overturn existing political orders. Intelligence work and practical assistance can build those relationships. The leadership must balance its ambitions abroad against the staff, funds and attention needed to sustain each commitment."
 LBA_1970_arab_unity_frustrated:0 "Arab Unity Frustrated"
 LBA_1970_arab_unity_frustrated_desc:0 "The gap between the language of Arab unity and the priorities of its governments has become impossible to ignore. Libya's leadership will draw political strength from its own revolutionary course, while relations with partners suffer from disappointment and competing claims to leadership."
 LBA_1970_turn_toward_africa:0 "Turn Toward Africa"
 LBA_1970_turn_toward_africa_desc:0 "Libya will give greater weight to its African relationships rather than measure diplomacy solely through the prospects of Arab unity. Building confidence among the continent's governments will require sustained attention and resources. This opening offers influence through cooperation, even where political systems and priorities differ sharply."
 LBA_1970_aid_the_sahel:0 "Aid the Sahel"
 LBA_1970_aid_the_sahel_desc:0 "Clinics, wells and local infrastructure offer a practical basis for cooperation with Sahelian neighbours. Libya will propose assistance that their governments can accept on agreed terms. Sustaining these projects requires funding and reliable delivery if diplomatic promises are to earn lasting confidence."
 LBA_1970_lead_within_the_oau:0 "Lead Within the OAU"
 LBA_1970_lead_within_the_oau_desc:0 "The Organisation of African Unity provides a forum in which Libya can cultivate relationships beyond its immediate neighbours. Active diplomacy will seek support through discussion and practical cooperation. Leadership within the organisation depends on persuading other members that Libya's initiatives serve more than its own prestige."
 LBA_1970_convene_the_sirte_summit:0 "Convene the Sirte Summit"
 LBA_1970_convene_the_sirte_summit_desc:0 "A meeting at Sirte can bring African governments together around practical cooperation and political dialogue. Libya will seek bilateral commitments that partners are willing to maintain. The initiative's credibility depends on agreed terms and useful assistance, rather than a ceremonial claim to speak for the whole continent."
 LBA_1970_the_9_9_99_declaration:0 "African Development Charter"
 LBA_1970_the_9_9_99_declaration_desc:0 "Continental development requires relationships that survive the summit at which they are announced. Libya will present itself as a committed partner in African investment and cooperation. The charter gives that ambition a public framework while leaving individual governments responsible for the agreements they choose to undertake."
 LBA_1970_the_pragmatic_jamahiriya:0 "The Pragmatic Jamahiriya"
 LBA_1970_the_pragmatic_jamahiriya_desc:0 "The leadership will adapt its methods without abandoning the Jamahiriya's political identity. More pragmatic administration offers a way to reconcile revolutionary claims with the demands of running services and enterprises. Its supporters must show that practical adjustments can strengthen the system rather than surrender its purpose."
 LBA_1970_champion_an_african_union:0 "Champion an African Union"
 LBA_1970_champion_an_african_union_desc:0 "Libya will promote a closer continental organisation and seek a leading role among its supporters. The initiative requires African governments to reconcile collective ambitions with their own sovereignty. Influence will come through sustained political engagement, rather than the assumption that a declaration can bind every state to the same project."

 # Starting burdens, programmes and Jamahiriya models
 LBA_1970_fragmented_administration_1:0 "A State Without Institutions"
 LBA_1970_fragmented_administration_1_desc:0 "The new republic has dismantled the monarchy's authority faster than it can build a replacement. Ministries lack trained staff, local administration is fragmented and revolutionary decrees often stop at the edge of Tripoli."
 LBA_1970_fragmented_administration_2:0 "A Fragmented Revolutionary Administration"
 LBA_1970_fragmented_administration_2_desc:0 "The RCC has imposed a clearer chain of command, but the state still depends on improvised committees and a very small cadre of officials. Tax collection and implementation remain unreliable."
 LBA_1970_fragmented_administration_3:0 "A Consolidating Revolutionary Administration"
 LBA_1970_fragmented_administration_3_desc:0 "National ministries and trained officials are beginning to function across the country. Persistent bureaucratic weakness still limits policy, but the revolutionary state is no longer merely an officers' headquarters."
 LBA_1970_neglected_infrastructure_1:0 "Severely Neglected Infrastructure"
 LBA_1970_neglected_infrastructure_1_desc:0 "Outside a few coastal centres, roads, utilities and supply networks are profoundly inadequate. Distance and weak connections raise construction costs, isolate communities and obstruct the use of Libya's own resources."
 LBA_1970_neglected_infrastructure_2:0 "Neglected National Infrastructure"
 LBA_1970_neglected_infrastructure_2_desc:0 "Initial projects have connected parts of the coast and improved state reach, yet vast stretches of the country remain expensive to build in and difficult to supply."
 LBA_1970_neglected_infrastructure_3:0 "Uneven National Infrastructure"
 LBA_1970_neglected_infrastructure_3_desc:0 "The worst isolation has been overcome, but infrastructure remains uneven between the coastal cities and the interior. Further national projects are required to remove the remaining bottlenecks."
 LBA_1970_foreign_oil_concessions_1:0 "Foreign-Dominated Oil Concessions"
 LBA_1970_foreign_oil_concessions_1_desc:0 "Contracts inherited from the monarchy leave foreign companies with control over production, expertise and much of the value created by Libya's petroleum. The state captures only a fraction of its potential income."
 LBA_1970_foreign_oil_concessions_2:0 "Renegotiated Oil Concessions"
 LBA_1970_foreign_oil_concessions_2_desc:0 "Higher participation and tougher terms have increased Libya's share, but foreign operators still dominate technical management and export channels."
 LBA_1970_foreign_oil_concessions_3:0 "Libyanising the Oil Concessions"
 LBA_1970_foreign_oil_concessions_3_desc:0 "National participation now reaches deep into the petroleum sector. Remaining foreign control and expertise still limit complete sovereignty, but the old concession system is close to being displaced."
 LBA_1970_national_oil_corporation:0 "State-Operated Oil Fields"
 LBA_1970_national_oil_corporation_desc:0 "The National Oil Corporation was founded in 1970. It now operates a growing share of Libya's fields directly while bargaining with the remaining foreign companies."
 LBA_1970_oil_revenue_state:0 "An Oil Revenue State"
 LBA_1970_oil_revenue_state_desc:0 "The state controls the petroleum sector and directs exceptionally large export proceeds into the Treasury. This model finances rapid development, while tying public finances and employment ever more closely to oil production."
 LBA_1970_soviet_petroleum_mission:0 "Soviet Petroleum Mission"
 LBA_1970_soviet_petroleum_mission_desc:0 "Soviet geologists and petroleum engineers are expanding extraction and training Libyan personnel. Their presence reduces dependence on the old concession companies, but gives Moscow greater leverage. The mission will end when §YLibyanise the Oil Sector§! is completed."
 LBA_1970_foreign_petroleum_contractors:0 "ENI Technical Contract"
 LBA_1970_foreign_petroleum_contractors_desc:0 "Italian ENI technicians protect export continuity while training Libyan crews under a production-sharing contract. The arrangement ends when Libyanise the Oil Sector is completed."
 LBA_1970_underdeveloped_agriculture_1:0 "Subsistence and Neglected Agriculture"
 LBA_1970_underdeveloped_agriculture_1_desc:0 "Arid conditions, weak irrigation and decades of neglect leave domestic agriculture exceptionally unproductive. Food imports absorb national income while farming requires far more labour than its output justifies."
 LBA_1970_underdeveloped_agriculture_2:0 "Underdeveloped Agriculture"
 LBA_1970_underdeveloped_agriculture_2_desc:0 "Extension services and investment have begun to improve production, but water scarcity and obsolete methods still make Libya heavily dependent on imported food."
 LBA_1970_underdeveloped_agriculture_3:0 "A Modernising Agricultural Sector"
 LBA_1970_underdeveloped_agriculture_3_desc:0 "Mechanisation, administration and new water projects are raising rural productivity. The sector remains structurally weak, but its burden on the wider economy is steadily declining."
 LBA_1970_unprepared_army_1:0 "A Politicised and Unprepared Army"
 LBA_1970_unprepared_army_1_desc:0 "The armed forces are small, poorly trained and divided by the very political networks that produced the 1969 coup. Mobilisation, organisation and battlefield learning all suffer from weak institutions."
 LBA_1970_unprepared_army_2:0 "An Army in Reorganisation"
 LBA_1970_unprepared_army_2_desc:0 "New equipment and revolutionary training have improved readiness, but inconsistent standards and political interference continue to undermine the regular army."
 LBA_1970_unprepared_army_3:0 "An Uneven Revolutionary Army"
 LBA_1970_unprepared_army_3_desc:0 "The military can now deploy and sustain larger forces, although elite loyal formations and the regular officer corps remain uneven in competence and resources."
 LBA_1970_foreign_bases:0 "Foreign Base Rights"
 LBA_1970_foreign_bases_desc:0 "The United Kingdom and United States retain military access granted under the monarchy. Their presence compromises sovereignty, exposes Libya to foreign influence and discredits the revolution's anti-colonial claims."
 LBA_1970_full_sovereignty:0 "Full Sovereignty Restored"
 LBA_1970_full_sovereignty_desc:0 "British and American base rights have been terminated. Libya controls its own territory and security policy for the first time without a permanent Western military presence."
 LBA_1970_state_directed_economy:0 "A State-Directed Economy"
 LBA_1970_state_directed_economy_desc:0 "Public ownership and industrial planning channel oil wealth into construction and strategic production. The model strengthens autonomy, but brings heavier administration and less attractive conditions for foreign investment."
 LBA_1970_controlled_joint_ventures:0 "Controlled Joint Ventures"
 LBA_1970_controlled_joint_ventures_desc:0 "Minority foreign partners provide expertise, research links and capital under Libyan majority control. The arrangement accelerates productivity while accepting a measured increase in external economic exposure."
 LBA_1970_cultural_revolution_campaign:0 "The Libyan Cultural Revolution"
 LBA_1970_cultural_revolution_campaign_desc:0 "Revolutionary Committees are mobilising students and loyalists against bureaucracy and ideological opposition. The campaign strengthens political fervour for two years, but disrupts administration, revenue and social stability."
 LBA_1970_jamahiriya_declared:0 "The Jamahiriya Declared"
 LBA_1970_jamahiriya_declared_desc:0 "Libya has formally become a state of the masses governed through Basic People's Congresses and the General People's Congress. The new system promises direct authority while adding another layer to an already complex state."
 LBA_1970_jamahiriya_system_historical:0 "The Historical Dual State"
 LBA_1970_jamahiriya_system_historical_desc:0 "Formal people's institutions coexist with Gaddafi's Revolutionary Leadership, security services and informal networks. The balance produces resilience and control without fully resolving the contradiction between popular rule and personal authority."
 LBA_1970_pragmatic_jamahiriya:0 "A Pragmatic Jamahiriya"
 LBA_1970_pragmatic_jamahiriya_desc:0 "The historical dual state survives by combining Gaddafi's decisive authority with selective technical reform and fiscal discipline. The compromises improve stability, research and revenue, although the constant balancing of institutions consumes political attention."
 LBA_1970_african_union_architect:0 "Architect of African Union"
 LBA_1970_african_union_architect_desc:0 "Libya has committed its oil wealth, diplomacy and political prestige to continental integration. Its leadership improves African influence, trade contacts and export opportunities while making Tripoli a central sponsor of the emerging union."
 LBA_1970_oil_sovereignty_dynamic_modifier:0 "Sovereign Oil Revenues"
 LBA_1970_oil_sovereignty_dynamic_modifier_desc:0 "Libya's fiscal and strategic gains from petroleum scale with the share of the sector under national control. Greater nationalisation strengthens exports, resource access and Treasury income, while reducing the labour required by foreign-operated concessions."

 # Readable static effect tooltips
 LBA_1970_starting_burdens_tt:0 "§YThe 1970 Starting Position§!\nLiteracy begins at §R25%§!.\nThe United Kingdom and United States possess §RMilitary Access§!.\nLibya begins with severe burdens from §RFragmented Administration§!, §RNeglected Infrastructure§!, §RForeign Oil Concessions§!, §RUnderdeveloped Agriculture§! and an §RUnprepared Army§!. Each burden is improved only by focuses that directly address it."
 LBA_1970_arab_socialist_union_tt:0 "The ruling organisation is renamed the §YArab Socialist Union§!.\n§YAutocracy Party Popularity§!: §G+5.0%§!"
 LBA_1970_oil_state_income_tt:0 "Additional Treasury income from nationalised petroleum scales with §YLibyan Oil Nationalisation§! and the country's current oil production."

