l_english:
 ENG_1985_state_of_the_union: "State of the Union"
 ENG_1985_state_of_the_union_desc: "Britain enters 1985 with Thatcher entrenched, Labour regrouping, Hong Kong unresolved, and Northern Ireland still bleeding political authority from Westminster."
 ENG_1985_economic_crossroads: "Economic Crossroads"
 ENG_1985_economic_crossroads_desc: "The government must decide whether to deepen the market turn or concede that the social cost of restructuring is becoming too high."
 ENG_1985_thatcher_revolution: "Thatcher's Revolution"
 ENG_1985_thatcher_revolution_desc: "Press ahead with monetary discipline, privatisation, and a sharper break with the post-war consensus."
 ENG_1985_end_miners_strike: "End the Miners' Strike"
 ENG_1985_end_miners_strike_desc: "The NUM has been broken as a national threat, but the social consequences in the coalfields will not simply disappear."
 ENG_1985_privatisation_drive: "Privatisation Drive"
 ENG_1985_privatisation_drive_desc: "Prepare the sale of major state assets and make private ownership the centre of economic policy."
 ENG_1985_big_bang: "The Big Bang"
 ENG_1985_big_bang_desc: "Deregulate the City of London and turn it into the dominant financial hub of Europe."
 ENG_1985_north_sea_revenue: "North Sea Revenue"
 ENG_1985_north_sea_revenue_desc: "Oil and gas revenue gives the Treasury room to fund tax cuts, restructuring, and defence commitments."
 ENG_1985_labour_challenge: "Labour's Challenge"
 ENG_1985_labour_challenge_desc: "Neil Kinnock's Labour Party offers a different economic settlement based on jobs, public investment, and union dialogue."
 ENG_1985_restore_union_dialogue: "Restore Union Dialogue"
 ENG_1985_restore_union_dialogue_desc: "A negotiated settlement with organised labour can reduce domestic pressure, even if markets dislike the signal."
 ENG_1985_public_investment_board: "Public Investment Board"
 ENG_1985_public_investment_board_desc: "Use state direction to revive regions damaged by unemployment and deindustrialisation."
 ENG_1985_renationalisation_debate: "Renationalisation Debate"
 ENG_1985_renationalisation_debate_desc: "The Labour left pushes for public ownership while moderates warn that the markets will punish Britain."
 ENG_1985_the_troubles: "The Troubles"
 ENG_1985_the_troubles_desc: "Northern Ireland remains the hardest domestic security problem in the United Kingdom."
 ENG_1985_anglo_irish_agreement: "Anglo-Irish Agreement"
 ENG_1985_anglo_irish_agreement_desc: "Give Dublin a consultative role and use cooperation to isolate the IRA politically."
 ENG_1985_cross_border_intelligence: "Cross-Border Intelligence"
 ENG_1985_cross_border_intelligence_desc: "Coordinate with Irish authorities to disrupt safehouses, arms routes, and financing networks."
 ENG_1985_policing_reform: "Policing Reform"
 ENG_1985_policing_reform_desc: "Professional oversight and community confidence are slow tools, but they erode insurgent legitimacy."
 ENG_1985_open_backchannels: "Open Backchannels"
 ENG_1985_open_backchannels_desc: "Quiet contacts can test whether republican militancy can be split from a possible peace process."
 ENG_1985_framework_for_peace: "Framework for Peace"
 ENG_1985_framework_for_peace_desc: "A long peace process begins by reducing violence, creating political exits, and keeping Dublin involved."
 ENG_1985_security_first: "Security First"
 ENG_1985_security_first_desc: "Treat the IRA as a security target above all else and accept the diplomatic and social costs."
 ENG_1985_expand_special_branch: "Expand Special Branch"
 ENG_1985_expand_special_branch_desc: "More surveillance, informants, and targeted arrests can weaken IRA cells before attacks occur."
 ENG_1985_operation_flavius: "Operation Flavius"
 ENG_1985_operation_flavius_desc: "Prepare overseas and domestic counter-terror operations by expanding SAS and intelligence coordination."
 ENG_1985_internment_debate: "Internment Debate"
 ENG_1985_internment_debate_desc: "Internment without trial would disrupt cells, but it risks radicalising the very population Westminster needs to calm."
 ENG_1985_secure_ulster: "Secure Ulster"
 ENG_1985_secure_ulster_desc: "Fortify key positions and lock down Northern Ireland through military pressure."
 ENG_1985_border_poll_question: "Border Poll Question"
 ENG_1985_border_poll_question_desc: "Reopen the constitutional question and ask whether holding Northern Ireland is still worth the cost."
 ENG_1985_managed_withdrawal_plan: "Managed Withdrawal Plan"
 ENG_1985_managed_withdrawal_plan_desc: "A withdrawal path could end the IRA campaign against Britain, but it would tear open unionist politics."
 ENG_1985_foreign_policy_review: "Foreign Policy Review"
 ENG_1985_foreign_policy_review_desc: "Britain must choose how to balance Reagan, Europe, nuclear weapons, and the remaining imperial commitments."
 ENG_1985_special_relationship: "The Special Relationship"
 ENG_1985_special_relationship_desc: "Stand beside Washington and make Britain the most reliable Atlantic ally in Europe."
 ENG_1985_cruise_missile_commitment: "Cruise Missile Commitment"
 ENG_1985_cruise_missile_commitment_desc: "Keep American nuclear deployments on British soil despite mass protest."
 ENG_1985_support_afghan_resistance: "Support Afghan Resistance"
 ENG_1985_support_afghan_resistance_desc: "Support anti-Soviet networks in Afghanistan through intelligence cooperation and covert logistics."
 ENG_1985_trident_commitment: "Trident Commitment"
 ENG_1985_trident_commitment_desc: "Protect Britain's independent nuclear deterrent through the Trident programme."
 ENG_1985_rebuild_royal_navy: "Rebuild the Royal Navy"
 ENG_1985_rebuild_royal_navy_desc: "The Falklands proved the fleet's value; the late Cold War demands a navy that can still project power."
 ENG_1985_european_option: "The European Option"
 ENG_1985_european_option_desc: "Deepen ties with Europe and shape the Single European Act from the inside."
 ENG_1985_european_defence_pillar: "European Defence Pillar"
 ENG_1985_european_defence_pillar_desc: "A stronger European defence identity can complement NATO while reducing overdependence on Washington."
 ENG_1985_currency_debate: "Currency Debate"
 ENG_1985_currency_debate_desc: "A future monetary union is still distant, but Whitehall can begin preparing for the argument."
 ENG_1985_cnd_pressure: "CND Pressure"
 ENG_1985_cnd_pressure_desc: "The nuclear disarmament movement can become policy if Labour or a neutralist coalition prevails."
 ENG_1985_review_nato_bases: "Review NATO Bases"
 ENG_1985_review_nato_bases_desc: "Audit foreign military facilities and reconsider how much sovereignty Britain has traded for deterrence."
 ENG_1985_hong_kong_question: "The Hong Kong Question"
 ENG_1985_hong_kong_question_desc: "The 1997 deadline is no longer abstract. London must decide whether to cooperate, harden, or democratise."
 ENG_1985_joint_declaration: "Uphold the Joint Declaration"
 ENG_1985_joint_declaration_desc: "Prepare the 1997 handover under the Sino-British Joint Declaration."
 ENG_1985_prepare_1997_transition: "Prepare the 1997 Transition"
 ENG_1985_prepare_1997_transition_desc: "Strengthen administrative continuity and economic confidence before the handover."
 ENG_1985_hong_kong_financial_gateway: "Hong Kong Financial Gateway"
 ENG_1985_hong_kong_financial_gateway_desc: "Keep Hong Kong valuable to London and Beijing by preserving its financial role."
 ENG_1985_refuse_handover: "Refuse the Handover"
 ENG_1985_refuse_handover_desc: "Reject the timetable and dare Beijing to escalate the crisis."
 ENG_1985_fortress_hong_kong: "Fortress Hong Kong"
 ENG_1985_fortress_hong_kong_desc: "If Britain refuses the handover, the colony must be fortified for political and military pressure."
 ENG_1985_commonwealth_pressure_campaign: "Commonwealth Pressure Campaign"
 ENG_1985_commonwealth_pressure_campaign_desc: "Seek diplomatic backing from Commonwealth partners against Chinese pressure."
 ENG_1985_accelerated_democratisation: "Accelerated Democratisation"
 ENG_1985_accelerated_democratisation_desc: "Build democratic institutions in Hong Kong before the handover can erase them."
 ENG_1985_legco_reforms: "LegCo Reforms"
 ENG_1985_legco_reforms_desc: "Expand representative institutions and make Hong Kong's political society harder to ignore."
 ENG_1985_political_safeguards: "Political Safeguards"
 ENG_1985_political_safeguards_desc: "Embed legal and political guarantees wherever London still has leverage."
 ENG_1985_thatcherism: "Thatcherism"
 ENG_1985_thatcherism_desc: "The Thatcher government combines market reform, union confrontation, Atlanticism, and a willingness to absorb social unrest."
 ENG_1985_post_falklands_confidence: "Post-Falklands Confidence"
 ENG_1985_post_falklands_confidence_desc: "Victory in the Falklands still shapes British defence politics and public confidence."
 ENG_1985_privatisation_programme: "Privatisation Programme"
 ENG_1985_privatisation_programme_desc: "State industries are being prepared for sale to private investors."
 ENG_1985_london_financial_hub: "London Financial Hub"
 ENG_1985_london_financial_hub_desc: "Deregulation makes the City of London faster, richer, and more politically influential."
 ENG_1985_labour_alternative_strategy: "Alternative Economic Strategy"
 ENG_1985_labour_alternative_strategy_desc: "Labour proposes public investment, planning, and employment as an alternative to Thatcherism."
 ENG_1985_trade_union_compromise: "Trade Union Compromise"
 ENG_1985_trade_union_compromise_desc: "Reopening dialogue with unions calms society but limits government freedom."
 ENG_1985_public_investment_drive: "Public Investment Drive"
 ENG_1985_public_investment_drive_desc: "Public money is being directed into jobs and industrial renewal."
 ENG_1985_renationalisation_board: "Renationalisation Board"
 ENG_1985_renationalisation_board_desc: "A board prepares selected industries for renewed public ownership."
 ENG_1985_the_troubles_active: "The Troubles"
 ENG_1985_the_troubles_active_desc: "The conflict in Northern Ireland drains political capital and keeps British security forces under pressure."
 ENG_1985_cross_border_security: "Cross-Border Security"
 ENG_1985_cross_border_security_desc: "Security cooperation with Ireland is targeting IRA logistics and finance."
 ENG_1985_hardline_security_policy: "Hardline Security Policy"
 ENG_1985_hardline_security_policy_desc: "Security policy prioritises disruption and deterrence over community confidence."
 ENG_1985_ira_under_pressure: "IRA Under Pressure"
 ENG_1985_ira_under_pressure_desc: "Better intelligence and arrests are restricting IRA freedom of movement."
 ENG_1985_ni_disengagement_debate: "Northern Ireland Disengagement Debate"
 ENG_1985_ni_disengagement_debate_desc: "Westminster is openly questioning the long-term cost of holding Northern Ireland."
 ENG_1985_the_troubles_deescalated: "The Troubles De-escalated"
 ENG_1985_the_troubles_deescalated_desc: "Violence has not vanished, but political channels are beginning to reduce the conflict."
 ENG_1985_cabinet_security_shock: "Cabinet Security Shock"
 ENG_1985_cabinet_security_shock_desc: "A major IRA plot has forced emergency security measures around the government."
 ENG_1985_single_european_act_idea: "Single European Act"
 ENG_1985_single_european_act_idea_desc: "Britain is helping shape a more integrated European market."
 ENG_1985_european_defence_pillar_idea: "European Defence Pillar"
 ENG_1985_european_defence_pillar_idea_desc: "Britain is investing in European defence coordination."
 ENG_1985_unilateral_disarmament_idea: "Unilateral Disarmament"
 ENG_1985_unilateral_disarmament_idea_desc: "The government is moving toward a non-nuclear defence posture."
 ENG_1985_hong_kong_transition_idea: "Hong Kong Transition"
 ENG_1985_hong_kong_transition_idea_desc: "London is preparing Hong Kong for the 1997 handover."
 ENG_1985_fortress_hong_kong_idea: "Fortress Hong Kong"
 ENG_1985_fortress_hong_kong_idea_desc: "Britain is preparing Hong Kong for a confrontation with Beijing."
 ENG_1985_hong_kong_democratisation_idea: "Hong Kong Democratisation"
 ENG_1985_hong_kong_democratisation_idea_desc: "Political reforms are expanding democratic expectations in Hong Kong."
 ENG_ira_troubles_state_modifier: "IRA Activity"
 ENG_ira_troubles_state_modifier_desc: "IRA militancy, support, foreign funding, and loyalist tension are raising resistance, garrison requirements, and operational disruption in Northern Ireland."
 ENG_ira_troubles_state_modifier_tt: "§YDynamic§!: scales with IRA Militancy, Public Support, Foreign Funding, and Loyalist Tension. Intelligence Penetration and Peace Progress do not remove the conflict by themselves, but they push the monthly drift toward lower militancy and weaker funding routes."
 ENG_ira_static_modifier: "The Troubles - Permanent Insurgency"
 ENG_ira_static_modifier_desc: "Garrisoning Northern Ireland in 1985 means accepting a permanent low-intensity conflict. British forces operate slower, hold less ground, and pay an organisational cost regardless of political progress."
 ENG_ira_static_modifier_tt: "§RStatic§!: an always-on \"state spirit\" that mirrors the long-term cost of the Troubles. Removed only if Northern Ireland leaves British control."
 ENG_1985_security_sweep_belfast: "Security Sweep in Belfast"
 ENG_1985_security_sweep_belfast_desc: "Deploy police and army units to disrupt IRA cells in Belfast."
 ENG_1985_special_branch_operation: "Special Branch Operation"
 ENG_1985_special_branch_operation_desc: "Run an intelligence-led operation against IRA logistics and safehouses."
 ENG_1985_community_outreach: "Community Outreach"
 ENG_1985_community_outreach_desc: "Fund local political outreach to reduce IRA legitimacy."
 ENG_1985_cross_border_liaison: "Cross-Border Liaison"
 ENG_1985_cross_border_liaison_desc: "Coordinate with Dublin to disrupt smuggling and safe routes."
 ENG_1985_trace_libyan_shipments: "Trace Libyan Shipments"
 ENG_1985_trace_libyan_shipments_desc: "Investigate foreign arms routes and expose overseas support."
 ENG_1985_review_internment: "Review Internment Powers"
 ENG_1985_review_internment_desc: "Consider emergency detention powers against suspected militants."
 ENG_1985_open_backchannel_contacts: "Open Backchannel Contacts"
 ENG_1985_open_backchannel_contacts_desc: "Use discreet intermediaries to separate political republicans from continued armed action."
 ENG_1985_press_us_on_noraid: "Press the US on NORAID"
 ENG_1985_press_us_on_noraid_desc: "Ask Washington to restrict diaspora funding channels linked to republican militancy."
 LBA_1985_ship_arms_to_ira: "Ship Arms to the IRA"
 LBA_1985_ship_arms_to_ira_desc: "Provide arms and money to Irish republican militants as a blow against Britain."
 USA_1985_tighten_noraid_finance: "Tighten NORAID Finance"
 USA_1985_tighten_noraid_finance_desc: "Crack down on fundraising channels that indirectly strengthen the IRA."
 IRE_1985_border_security_cooperation: "Border Security Cooperation"
 IRE_1985_border_security_cooperation_desc: "Work with Britain to restrict cross-border IRA movement."
 SOV_1985_probe_ira_channels: "Probe IRA Channels"
 SOV_1985_probe_ira_channels_desc: "Explore deniable contacts that could pressure Britain."
 ENG_1985_anglo_irish_goodwill: "Anglo-Irish Goodwill"
 ENG_1985_security_crackdown: "Security Crackdown"
 ENG_1985_special_relationship_opinion: "Special Relationship"
 ENG_1985_afghan_resistance_support: "Support for Afghan Resistance"
 ENG_1985_european_goodwill: "European Goodwill"
 ENG_1985_nato_base_review: "NATO Base Review"
 ENG_1985_joint_declaration_opinion: "Joint Declaration"
 ENG_1985_hong_kong_refusal: "Hong Kong Refusal"
 ENG_1985_hong_kong_democratisation_tension: "Hong Kong Democratisation Tension"
 ENG_1985_ira_support_exposed: "IRA Support Exposed"
 ENG_1985_counter_ira_cooperation: "Counter-IRA Cooperation"
