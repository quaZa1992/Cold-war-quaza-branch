 icwp_tier_tt: "§Y[icwp_TierName]§!\nExperience: §Y[?icwp_xp|0]§!/100\nClients: §Y[?icwp_nclients|0]§!\nUnits in our factories: §Y[?icwp_in_u|1]§!\n\n[icwp_NextTier]\n\n§YTier bonuses§! (while we have orders):\nAssembly Workshop: productivity growth +5%, factory construction +3%\nExport Platform: +10%, +6%, research speed +1%\nManufacturing Hub: +15%, +8%, research speed +2%\nFactory of the World: +20%, +10%, research speed +3%, globalism equilibrium +5\n\nHigher tiers raise our price per unit by 15%, 30% and 50%."
 icwp_balance_tt: "§YWeekly balance§!\nIncome from foreign clients: §G[?icwp_inc_wk|3]§! billion\nPayments to our producers: §R[?icwp_pay_wk|3]§! billion\n\nPayments run through the normal weekly budget."
 icwp_host_tt: "§YOrders in our factories§!\nContracted units: §Y[?icwp_in_u|1]§!\nDelivered units: §Y[?icwp_in_d|1]§!\nCivilian factories bound to consumer goods for clients: §Y[?icwp_in_d|1]§!\nShare of our civilian factories: §Y[?icwp_share|%1]§!\n\n$country_productivity_growth_modifier$: [?icwp_h_pg|+=%1]\n$MODIFIER_STABILITY_FACTOR$ (jobs): [?icwp_h_stab|+=%1]\nCivilian factory construction: [?icwp_h_build|+=%0]\nWorld-market exposure: [?icwp_h_exp|+2]\n\nLosing a client causes an order slump in productivity growth and stability. It is larger the bigger the client was and the longer the contract ran."
 icwp_client_tt: "§YOur orders abroad§!\nContracted units: §Y[?icwp_out_u|1]§!\nDelivered units: §Y[?icwp_out_d|1]§!\nConsumer goods factories saved: §G[?icwp_relief_f|1]§! (at most 40% of our own: §Y[?icwp_own_cg_f|1]§!)\nDependence: §Y[?icwp_dep|%1]§!\n\nRust Belt, $country_productivity_growth_modifier$: [?icwp_c_pg|+=%1]\n$MODIFIER_STABILITY_FACTOR$: [?icwp_c_stab|+=%1]\nWorld-market exposure: [?icwp_c_exp|+2]\n\nIf a contract ends, the factories return to consumer goods and a temporary shortage follows. The Rust Belt fades over 24 months."

 icwp_orders_abroad: "OUR ORDERS ABROAD"
 icwp_orders_abroad_sum: "Consumer goods §G-[?icwp_relief_r|0]§! factories  ·  §R[?icwp_pay_wk|3]§! B/wk"
 icwp_orders_abroad_sum2: "Dependence §Y[?icwp_dep_pct|0]%§!  ·  Rust Belt growth [?icwp_c_pg|+=%1]  ·  Market exposure [?icwp_c_exp|+2]"
 icwp_no_orders_abroad: "§gNo production abroad. Find a producer in the Partner Market.§!"
 icwp_orders_in: "FOREIGN ORDERS IN OUR FACTORIES"
 icwp_orders_in_sum: "§Y[?icwp_in_r|0]§! factories bound  ·  §G[?icwp_inc_wk|3]§! B/wk"
 icwp_orders_in_sum2: "Productivity growth [?icwp_h_pg|+=%1]  ·  Jobs stability [?icwp_h_stab|+=%1]  ·  Market exposure [?icwp_h_exp|+2]"
 icwp_no_orders_in: "§gNo foreign orders yet. Other players can place orders here once our investment access reaches 35% or we have export processing zones.§!"
 icwp_hr_info: "[?icwp_dh_u^i|0] units  ·  delivering [?icwp_dh_d^i|1]  ·  integration [?icwp_dh_ig^i|0]%  ·  [?icwp_dh_m^i|0] mo"
 icwp_hr_info_tt: "Units: contracted volume. Delivering: units arriving now. Integration grows to 100% over 3 years and sets how hard an exit hits both sides. The last figure shows the months left in the current state."
 icwp_cr_info: "[?icwp_dc_u^i|0] units  ·  producing [?icwp_dc_d^i|1]  ·  integration [?icwp_dc_ig^i|0]%  ·  [?icwp_dc_m^i|0] mo"
 icwp_cr_info_tt: "Units: contracted volume. Producing: factories bound for this client now. Integration grows to 100% over 3 years and sets how hard an exit hits both sides."
 icwp_status_tt: "§YPreparing§!: 3 months before production starts.\n§YRamping up§!: deliveries grow over 6 months.\n§YRunning§!: full deliveries.\n§YNotice given§!: deliveries run down over 12 months, payments continue in full.\n§YSuspended§!: the producer stopped deliveries for 3 months; no payments."
 icwp_hr_pay: "§R-[?icwp_dh_pay^i|3]§! B/wk"
 icwp_hr_pay_tt: "Our weekly payment for this contract. During notice we keep paying in full."
 icwp_cr_pay: "§G+[?icwp_dc_pay^i|3]§! B/wk"
 icwp_cr_pay_tt: "Weekly income from this client."
 icwp_btn_wind: "Give Notice"
 icwp_btn_end: "End Now"
 icwp_btn_susp: "Suspend"
 icwp_wind_tt_client: "§YGive twelve months' notice§!\nDeliveries run down over 12 months while we keep paying in full. The factories return to consumer goods step by step. No settlement. When the contract ends, the shortage and the Rust Belt are halved."
 icwp_end_tt_client: "§YEnd the contract now§!\nWe pay a settlement of 26 weeks of payments times the integration. All factories return to consumer goods at once, with a full shortage. A confirmation follows."
 icwp_wind_tt_host: "§YGive twelve months' notice§!\nWe keep producing while deliveries run down over 12 months, and the client pays in full. No settlement. When the contract ends, the order slump is halved."
 icwp_end_tt_host: "§YEnd the contract now§!\nWe pay the client a settlement of 26 weeks of payments times the integration. Our factories are free at once, with a full order slump. A confirmation follows."
 icwp_susp_tt: "§YSuspend deliveries§!\nFor 3 months we deliver nothing and the client pays nothing. The client's factories have to cover its consumer goods again. Possible once every 24 months for each client."

 icwp_market_heading: "PARTNER MARKET"
 icwp_refresh: "Refresh"
 icwp_refresh_tt: "Recalculate prices and conditions for all players."
 icwp_market_columns: "§gProducer  ·  profile  ·  price per unit and week  ·  status§!"
 icwp_market_columns_tt: "§YWage§!: their GDP per capita relative to ours. Below 1 they are cheaper.\n§YJobless§!: unemployment. More jobless means more capacity and more stability from new jobs.\n§YLaws§!: labour and environmental law. Minimal regulations and strip mining are cheaper, strict laws cost more.\n§YStab§!: stability. Below 50% a risk premium of up to 15% applies.\n§YFree§!: units they can still take.\n\nEvery client of a producer lowers its price by 2% (up to 12%). Higher tiers raise it."
 icwp_market_empty: "§gNo other players take part yet.§!"
 icwp_mk_profile: "Wage [?icwp_mk_wage^i|2]  ·  Jobless [?icwp_mk_unemp^i|0]%  ·  Laws x[?icwp_mk_laws^i|2]  ·  Stab [?icwp_mk_stab^i|0]%  ·  Free [?icwp_mk_free^i|0]"
 icwp_mk_price: "§Y[?icwp_mk_pr^i|4]§! B"
 icwp_mk_save: "saves [?icwp_mk_sv^i|0]%"
 icwp_mk_row_tt: "Select this producer for an offer."
 icwp_offer_heading: "[icwp_OfferTarget]"
 icwp_offer_target_yes: "OFFER TO [?icwp_sel_c.GetNameWithFlag]"
 icwp_offer_target_no: "§gSelect a producer above.§!"
 icwp_reason_tt: "§YAvailable§!: the offer can be sent.\n§YOffer pending§!: an offer between us, or to them, is waiting for an answer.\n§YNot a player§!: only players can receive offers.\n§YWar / sanctions§!: war, embargo, economic or financial sanctions.\n§YMarket closed§!: below 35% investment access and no export processing zone.\n§YNo cost edge§!: we would save less than 15%.\n§YNo capacity§!: they cannot take the volume.\n§YNo free slot§!: 6 producers for us or 8 clients for them.\n§YContract full§!: 10 units, or the contract is not running.\n§YNo demand left§!: at most 40% of our consumer goods factories can be placed abroad.\n§YNot enough funds§!: the setup costs more than our treasury.\n§YSelect producer§!: choose a row above."
 icwp_offer_units_label: "Units (1 to 10)"
 icwp_offer_units: "§Y[?icwp_offer_u|0]§!"
 icwp_less_tt: "One unit less."
 icwp_more_tt: "One unit more."
 icwp_preview_we: "We: consumer goods §G-[?icwp_offer_u|0]§! factories once running  ·  §R[?icwp_pv_pay|3]§! B/wk"
 icwp_preview_we2: "We: setup §R[?icwp_pv_setup|3]§! B (13 weeks)  ·  dependence +[?icwp_pv_dep_pct|1]%"
 icwp_preview_they: "They: §G+[?icwp_pv_pay|3]§! B/wk  ·  [?icwp_offer_u|0] factories bound  ·  productivity growth +[?icwp_pv_pg_pct|1]%"
 icwp_preview_terms: "§gOpen end. 3 months preparation, 6 months ramp-up. 12 months notice, or a settlement for leaving at once.§!"
 icwp_send: "Send Offer"
 icwp_send_tt: "The other player receives the offer with all numbers for both sides and decides. The price follows wages, laws, stability and clients every month."

 icwp_league_heading: "WORLD LEAGUE"
 icwp_league_holder: "[icwp_HolderLine]"
 icwp_league_cand: "[icwp_CandLine]"
 icwp_holder_yes: "Factory of the World: [?global.icwp_holder.GetNameWithFlag]"
 icwp_holder_no: "Factory of the World: §gnobody yet§!"
 icwp_cand_yes: "Challenger: [?global.icwp_cand.GetNameWithFlag], §Y[?global.icwp_cand_m|0]§!/12 months at the top"
 icwp_cand_no: "§gNo challenger at the moment.§!"
 icwp_league_tt: "Share of all units delivered between players this month. The leader with at least §Y20%§! and §Y3§! clients for §Y12§! months becomes the §YFactory of the World§!."
 icwp_league_empty: "§gNo deliveries between players yet.§!"
 icwp_lg_rank: "§Y[?global.icwp_lg_rk^i|0]§!"
 icwp_lg_share: "§Y[?global.icwp_lg_s^i|%1]§! of all deliveries"
 icwp_ladder_heading: "OUR PATH"
 icwp_ladder_text: "§Y[icwp_TierName]§!  ·  experience [?icwp_xp|0]/100  ·  [?icwp_nclients|0] clients\n[icwp_NextTier]\n\nExperience grows each month with the share of our civilian factories that produce for clients, and it stays when clients leave.\n\nEvery new client makes us cheaper, more clients make us better. Rising wages and higher tiers make us more expensive: a producer that does not move up loses its cheapest orders to the next player."

 icwp.1.t: "Production Offer from [From.GetNameDef]"
 icwp.1.d: "[From.GetNameDefCap] proposes to place §Y[?icwp_ev_u|0]§! units of consumer goods production in our factories at §Y[?icwp_ev_pr|4]§! billion per unit and week.\n\n§YWe§!: income §G+[?icwp_ev_wk|3]§! billion per week, §Y[?icwp_ev_u|0]§! civilian factories bound to consumer goods while the contract runs, productivity growth about §G+[?icwp_ev_pg|%1]§!, experience toward higher tiers.\n§Y[From.GetNameDefCap]§!: setup §R[?icwp_ev_setup|3]§! billion, payments §R[?icwp_ev_wk|3]§! billion per week, consumer goods factories §G-[?icwp_ev_u|0]§!, dependence +[?icwp_ev_dep|%1].\n\nThe contract has no end date. Production starts after 3 months and ramps up over 6 months. Either side can give 12 months' notice or leave at once against a settlement."
 icwp.1.a: "Not on these terms."
 icwp.1.b: "We accept the orders."
 icwp.1.b_tt: "The contract is signed if both sides still meet the conditions: no war or sanctions, free capacity on our side, room and funds on theirs."
 icwp.2.t: "[From.GetNameDefCap] Signs the Production Contract"
 icwp.2.d: "[From.GetNameDefCap] has accepted our orders. The setup costs are paid. Production starts in 3 months and reaches full volume after another 6 months."
 icwp.2.a: "Good."
 icwp.3.t: "No Production Contract with [From.GetNameDef]"
 icwp.3.d: "[From.GetNameDefCap] did not sign. Either the offer was declined, or the conditions were no longer met when it was answered: war or sanctions, missing capacity, our room for foreign supply, or the setup costs."
 icwp.3.a: "We will look elsewhere."
 icwp.4.t: "[From.GetNameDefCap] Ends Our Production Contract"
 icwp.4.d: "[From.GetNameDefCap] has ended the production contract with us at once and paid the settlement. The factories involved are free again, and the consequences of the break are shown in International Production."
 icwp.4.a: "Noted."
 icwp.5.t: "End the Contract with [?icwp_ev_p.GetNameDef]?"
 icwp.5.d: "Leaving without notice is expensive.\n\nSettlement we pay: §R[?icwp_ev_settle|3]§! billion\nUnits affected: §Y[?icwp_ev_lost|1]§!\nIntegration: §Y[?icwp_ev_ig|0]%§!\n\nAs §Y[icwp_SuspendState]§!, we take the full consequences: a client gets a 12-month shortage and keeps the Rust Belt for 24 months, a producer gets a 12-month order slump. Giving 12 months' notice instead costs no settlement and halves the consequences."
 icwp.5.a: "Keep the contract."
 icwp.5.b: "End it now."
 icwp.5.b_tt: "The settlement is paid and the contract ends at once."
 icwp_role_host: "producer"
 icwp_role_client: "client"
 icwp.6.t: "[From.GetNameDefCap] Suspends Deliveries"
 icwp.6.d: "[From.GetNameDefCap] has stopped all deliveries to us for 3 months. We pay nothing for this time, but our own factories have to cover the missing consumer goods again."
 icwp.6.a: "We will remember this."
 icwp.7.t: "[From.GetNameDefCap] Gives Notice"
 icwp.7.d: "[From.GetNameDefCap] has given 12 months' notice on our production contract. Deliveries run down over the year while the payments continue in full."
 icwp.7.a: "Noted."
 icwp.10.t: "A New Factory of the World"
 icwp.10.d: "For twelve months no country has produced more for others than [?global.icwp_holder.GetNameDef]. Its factories now carry a fifth or more of all deliveries between the great economies, and much of the world depends on them."
 icwp.10.a: "The world economy has a new centre."
