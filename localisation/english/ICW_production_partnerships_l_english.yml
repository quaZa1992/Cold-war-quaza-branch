 icwp_calc_tt: "§YPrice per factory and week§!\nOur domestic cost (GDP per factory) times every factor below. Wages compare their GDP per capita with ours. Minimal labour protection and strip mining make them cheaper, strict laws dearer. Below 50 % stability a risk premium applies. Every client of theirs lowers the price by 2 % (up to 12 %); higher tiers raise it; pro-business policies lower it. Neighbours save 5 % transport."
 icwp_offer_units_label: "Rent"
 icwp_offer_pm_label: "Price offer"
 icwp_pm_m10: "-10 %"
 icwp_pm_list: "List"
 icwp_pm_p10: "+10 %"
 icwp_pm_p20: "+20 %"
 icwp_pm_tt: "§YPrice offer§!\nPay below or above the list price. A higher price makes the offer more attractive to the other player; it stays part of the contract while the list price follows wages and laws every month. AI producers accept -10 % only with an opinion of at least 25."
 icwp_pv0: "§gChoose a producer on the left.§!"
 icwp_pv1: "We free §G[?icwp_offer_u|0]§! factories, pay §R[?icwp_pv_pay|3] B§!/wk"
 icwp_pv2: "Setup §R[?icwp_pv_setup|2] B§!, dependence §R+[?icwp_pv_dep_pct|1] %§!"
 icwp_pv3: "They earn §G[?icwp_pv_pay|3] B§!/wk, §G+[?icwp_pv_pg_pct|1] %§! growth"
 icwp_reason_tt: "§YAvailable§!: the offer can be sent.\n§YPending§!: an offer between us, or to them, is waiting for an answer.\n§YNo player§!: only players can receive offers.\n§YWar / embargo§!: war or a trade embargo between us. Sanctions do not block production.\n§YClosed§!: below 35 % investment access and no export processing zone.\n§YNo saving§!: we would save less than 15 %.\n§YNo capacity§!: they cannot take the volume.\n§YNo slot§!: 6 producers for us, or their client limit is full (8, 15 with Special Economic Zones, 30 with Open Door Manufacturing).\n§YFull§!: the limit from the saving is reached (saving x 12, more with only one or two producers), or the contract is not running.\n§YNo demand§!: at most 40 % of our consumer goods factories can be placed abroad.\n§YNo funds§!: the setup costs more than our treasury.\n§YConcentrated§!: one of our running contracts is bigger than its limit would be with one more producer (see the tooltip of Most we can rent).\n§YSelect§!: choose a producer on the left."
