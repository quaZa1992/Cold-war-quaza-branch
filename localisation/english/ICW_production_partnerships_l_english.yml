 icwp_rw_0: "§gReward:§! productivity growth +5 % while we have orders."
 icwp_rw_1: "§gReward:§! productivity growth +10 %, research +1 %."
 icwp_rw_2: "§gReward:§! productivity growth +15 %, research +2 %, economic cycle upgrades -5 %."
 icwp_rw_3: "§gReward:§! productivity growth +20 %, research +3 %, economic cycle upgrades -10 %, globalism +5."
 icwp_rw_4: "§gBonus:§! productivity growth +20 %, research +3 %, economic cycle upgrades -10 %, globalism +5. Lost when the conditions are no longer met."
 icwp_ladder_text: "Every client brings technology: the more productive the client and the more of our factories it uses, the faster our productivity grows (up to +25 %, plus the tier). Foreign orders also speed up research, make economic cycle upgrades cheaper and give jobs.\n\nExperience grows each month with the share of our civilian factories that produce for clients and stays when clients leave. Every client makes us cheaper; rising wages and higher tiers make us dearer. A producer that does not move up loses its cheapest orders to the next country."
 icwp_tier_tt: "§Y[icwp_TierName]§!\nExperience: §Y[?icwp_xp|0]§!/100 · clients: §Y[?icwp_nclients|0]§!\n\n[icwp_NextTier]\n\n§YWhile we have orders§!\nTechnology transfer: up to +25 % productivity growth\nAssembly Workshop: +5 % productivity growth\nExport Platform: +10 %, research +1 %\nManufacturing Hub: +15 %, research +2 %, economic cycle upgrades -5 %\nFactory of the World: +20 %, research +3 %, economic cycle upgrades -10 %, globalism +5\n\nHigher tiers raise our price per factory by 15 %, 30 % and 50 %."
 icwp_client_tt: "§YOur orders abroad§!\nRented factories: §Y[?icwp_out_u|1]§!\nProducers: §Y[?icwp_nhosts|0]§! of 6, limit per producer x§Y[?icwp_cf_now|1]§! (1 producer x2, 2 producers x1.5, 3 or more x1)\nDelivering: §Y[?icwp_out_d|1]§!\nConsumer goods factories freed: §G[?icwp_relief_f|1]§! (at most 40 % of our own: [?icwp_own_cg_f|1])\n\nRust Belt, $country_productivity_growth_modifier$: [?icwp_c_pg|+=%1]\n$MODIFIER_STABILITY_FACTOR$: [?icwp_c_stab|+=%1]\nWorld-market exposure: [?icwp_c_exp|+2]\n\nIf a contract ends, the factories return to consumer goods and a shortage follows. The Rust Belt fades over 24 months."
 icwp_host_tt: "§YForeign orders in our factories§!\nContracted factories: §Y[?icwp_in_u|1]§! of §Y[?icwp_cap|0]§! possible (§Y[?icwp_cap_share|%0]§! of our civilian factories at full use)\nClients: §Y[?icwp_nclients|0]§! of §Y[?icwp_max_clients|0]§!\n§gSpecial Economic Zones and Open Door Manufacturing (Imperia policies) raise both limits.§!\nBound to consumer goods for clients: §Y[?icwp_in_d|1]§!\n\n$country_productivity_growth_modifier$: [?icwp_h_pg|+=%1] (technology transfer and tier)\nResearch speed: [?icwp_h_res|+=%1]\nEconomic cycle upgrade cost: [?icwp_h_cyc|-=%1]\n$MODIFIER_STABILITY_FACTOR$ (jobs): [?icwp_h_stab|+=%1]\nWorld-market exposure: [?icwp_h_exp|+2]\n\nLosing a client causes an order slump in productivity growth and stability."
 icwp.1.d: "[From.GetNameDefCap] proposes to place §Y[?icwp_ev_u|0]§! factories of consumer goods production in our factories at §Y[?icwp_ev_pr|4]§! billion per factory and week (price offer [?icwp_ev_pm|+=0] % on the list price).\n\n§YWe§!: income §G+[?icwp_ev_wk|3]§! billion per week, §Y[?icwp_ev_u|0]§! civilian factories bound to consumer goods while the contract runs, productivity growth about §G+[?icwp_ev_pg|%1]§! (more if they are more productive than us), experience toward higher tiers.\n§Y[From.GetNameDefCap]§!: setup §R[?icwp_ev_setup|3]§! billion, payments §R[?icwp_ev_wk|3]§! billion per week, consumer goods factories freed §G[?icwp_ev_fr|0]§!, dependence +[?icwp_ev_dep|%1].\n\nThe contract has no end date. Production starts after 3 months and ramps up over 6 months. Either side can give 12 months' notice or leave at once against a settlement."
 icwp.8.t: "[?icwp_ai_host.GetNameDefCap] Takes Our Orders"
 icwp.8.d: "[?icwp_ai_host.GetNameDefCap] has accepted our production offer. The setup costs are paid. Production starts in 3 months and reaches full volume after another 6 months."
 icwp.8.a: "Good."
 icwp.9.t: "[?icwp_ai_host.GetNameDefCap] Declines"
 icwp.9.d: "[?icwp_ai_host.GetNameDefCap] did not accept our offer. AI producers decide by fixed rules: no war or embargo, enough investment access and capacity, room and funds on our side, and an opinion of us of at least -25 (at least 25 for a price below the list price)."
 icwp.9.a: "We will look elsewhere."
