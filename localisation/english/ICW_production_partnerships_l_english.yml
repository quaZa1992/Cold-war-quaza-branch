 icwp_calc_dom_tt: "§YOur cost per factory§!\nWhat one consumer goods factory costs us per week if we keep it at home: our GDP divided by our factories, scaled to the money system.\n\nOurs: §Y[?icwp_pv_dom|4] B§! per factory and week\n\nEvery factor below is multiplied onto this value. The result is the price per factory."
 icwp_calc_wage_tt: "§YWages vs ours§!\nTheir GDP per capita divided by ours. Lower wages make production cheaper. The factor is limited to x0.02 to x3.\n\n[?icwp_sel_c.GetNameDefCap]: §Y$$[?icwp_pv_gpc_them|2] thousand§! per capita\nWe: §Y$$[?icwp_pv_gpc_us|2] thousand§! per capita\n\nFactor: §Yx[?icwp_pv_wage|2]§!"
 icwp_calc_law_tt: "§YLabour law§!\nThe weaker their labour protection, the cheaper they produce.\n\n[?icwp_sel_c.GetNameDefCap] has: §Y[icwpT_law]§!\n\nMinimal Labor Standards: x0.90\nLight Labor Oversight: x0.95\nStandard Labor Framework: x1.00\nStrong Labor Protections: x1.08\nComprehensive Labor Code: x1.15\n\nFactor: §Yx[?icwp_pv_law|2]§!"
 icwp_calc_env_tt: "§YEnvironmental law§!\nThe weaker their environmental rules, the cheaper they produce.\n\n[?icwp_sel_c.GetNameDefCap] has: §Y[icwpT_env]§!\n\nStrip Mining: x0.92\nEconomy-First Mining: x0.96\nStandard rules: x1.00\nPartial Environmental Protections: x1.04\nFull Environmental Protections: x1.08\n\nFactor: §Yx[?icwp_pv_env|2]§!"
 icwp_calc_risk_tt: "§YStability risk§!\nAn unstable producer charges a risk premium: +0.3 % for every point of stability below 50 %, at most +15 %.\n\n[?icwp_sel_c.GetNameDefCap]: §Y[?icwp_pv_stab|0] %§! stability\n\nFactor: §Yx[?icwp_pv_risk|2]§!"
 icwp_calc_clus_tt: "§YTheir clients§!\nEvery client a producer already has makes it cheaper: suppliers and trained workers are already there. -2 % per client, at most -12 %.\n\n[?icwp_sel_c.GetNameDefCap]: §Y[?icwp_pv_ncl|0]§! clients\n\nFactor: §Yx[?icwp_pv_clus|2]§!"
 icwp_calc_tier_tt: "§YTheir tier§!\nEstablished producers are more reliable and charge more.\n\n[?icwp_sel_c.GetNameDefCap]: §Y[icwpT_htier]§!\n\nClosed or Assembly Workshop: x1.00\nExport Platform: x1.15\nManufacturing Hub: x1.30\nFactory of the World: x1.50\n\nFactor: §Yx[?icwp_pv_tier|2]§!"
 icwp_calc_nb_tt: "§YNeighbour§!\n[icwpT_nb]\n\nFactor: §Yx[?icwp_pv_nb|2]§!"
 icwp_calc_pm_tt: "§YOur price offer§!\nWhat we offer on top of the list price, set with the buttons below. A higher price makes the offer more attractive; a lower one saves money. The offer stays part of the contract, while the list price follows wages and laws every month.\n\nAI producers accept -10 % only with an opinion of us of at least 25.\n\nFactor: §Yx[?icwp_pv_pmf|2]§!"
 icwp_calc_price_tt: "§YPrice per factory and week§!\nOur cost per factory multiplied by every factor above.\n\nList price: §Y[?icwp_pv_list|4] B§!\nWith our price offer: §Y[?icwp_pv_price|4] B§!"
 icwp_calc_save_tt: "§YOur saving§!\nHow much cheaper the price is than our own cost per factory. The saving decides how many factories we can rent there: saving x 12, more if we use only one or two producers (§Y[?icwp_pv_cap|0]§! here).\n\nAn offer needs a saving of at least §Y15 %§!.\n\nSaving: §G[?icwp_pv_save|0] %§!"
 icwp_offer_units_tt: "§YFactories to rent§!\nHow many of their civilian factories we rent for our consumer goods; each one frees one factory at home. At most §Y[?icwp_pv_cap|0]§! with [?icwp_sel_c.GetNameDef] (saving x 12, x2 with a single producer, x1.5 with two). Their free capacity and our room for foreign supply (40 % of our consumer goods factories) can lower it further."
 icwp_sum_total_tt: "§YWeekly total§!\nWhat this contract costs every week:\n§Y[?icwp_pv_price|4] B§! per factory x §Y[?icwp_offer_u|0]§! factories = §Y[?icwp_pv_pay|3] B§!\n\nWe pay this amount every week, and [?icwp_sel_c.GetNameDef] receives exactly the same amount as income. Each month the list price follows wages and laws; our price offer stays."
 icwp_sum_pay_tt: "§YWe pay§!\nAdded to our weekly expenses for as long as the contract runs: §R[?icwp_pv_pay|3] B§! per week."
 icwp_sum_get_tt: "§YThey receive§!\n[?icwp_sel_c.GetNameDefCap] books exactly our payment as weekly income: §G[?icwp_pv_pay|3] B§! per week."
 icwp_sum_setup_tt: "§YSetup§!\nPaid once when the contract is signed: 13 weeks of the weekly total.\n\nSetup: §R[?icwp_pv_setup|2] B§!"
 icwp_sum_freed_tt: "§YFactories freed§!\nEvery rented factory frees one consumer goods factory at home: §G[?icwp_offer_u|0]§! factories.\n\nThey are freed step by step: production starts after 3 months and reaches full volume after another 6 months."
 icwp_sum_dep_tt: "§YOur dependence§!\nShare of our consumer goods made abroad after this contract grows by §R[?icwp_pv_dep_pct|1] %§!.\n\nThe higher our dependence, the lower our productivity growth (Rust Belt), the lower our stability and the higher our market exposure. Leaving later is expensive."
 icwp_sum_pg_tt: "§YTheir growth§!\nTechnology transfer for [?icwp_sel_c.GetNameDef]: our factories there divided by their civilian factories x 40 % x how much more productive we are (§Yx[?icwp_pv_gap|1]§!, limited to 1 to 3).\n\nTheir productivity growth: §G+[?icwp_pv_pg_pct|1] %§!"
 # Update 23.11.2026: the saving sets freed factories and the rental limit
 icwp_calc_cap: "Most we can rent"
 icwp_calc_cap_tt: "§YMost we can rent§!\nA cheaper producer can take more of our orders: saving x 12 factories.\n\nThe fewer producers we use, the more each one can take:\n1 producer: x2 (up to 22)\n2 producers: x1.5 (up to 16)\n3 or more: x1 (up to 11)\n\nSaving §G[?icwp_pv_save|0] %§! x 12 x §Y[?icwp_pv_cf|1]§! = §Y[?icwp_pv_cap|0]§! factories\n\n§YConcentration check§!\n[icwpT_conc]"
 icwp_conc_block: "§RBlocked.§! With one more producer the limit of our other contracts drops. Our contract with [?icwp_cb_c.GetNameDef] has §Y[?icwp_cb_u|0]§! factories, but its limit would fall to §Y[?icwp_cb_cap|0]§!.\nGive notice or end that contract first, or stay with fewer producers."
 icwp_conc_ok: "Adding this producer is possible: all running contracts still fit their lower limits (x[?icwp_pv_cf|1] each from now on)."
 icwp_conc_same: "We already work with this producer, or it is our first one: nothing else changes."
 # Update 23.11.2026: Imperia policies for producers
 icwp_calc_pol: "Their policies"
 icwp_calc_pol_tt: "§YTheir policies§!\nImperia policies of [?icwp_sel_c.GetNameDef] that make production there cheaper:\nPro-Business Climate: x0.92\nInvestor-First Labour Regime: x0.85\n\nFactor: §Yx[?icwp_pv_pol|2]§!\n\nThey take clients: §Y[?icwp_pv_ncl|0]§! of §Y[?icwp_pv_maxcl|0]§! (8, 15 with Special Economic Zones, 30 with Open Door Manufacturing)."
 COLDWAR_ni_icwp_sez: "Special Economic Zones"
 COLDWAR_ni_icwp_sez_desc: "Coastal districts become laboratories of the world market: foreign firms build, hire and export there under their own rules, with tax holidays and fast customs. Shenzhen grew from a fishing town this way. The party calls it a window to the world; the old guard calls it a concession."
 COLDWAR_ni_icwp_open_door: "Open Door Manufacturing"
 COLDWAR_ni_icwp_open_door_desc: "The whole country opens its factories to foreign orders: export zones everywhere, foreign ownership allowed, ports and railways built for the container trade. Orders pour in, and every crisis on the world market now reaches our workers within weeks."
 COLDWAR_ni_icwp_open_door_tier_tt: "At least the tier §YExport Platform§! in International Production"
 COLDWAR_ni_icwp_pro_business: "Pro-Business Climate"
 COLDWAR_ni_icwp_pro_business_desc: "Tax holidays for new plants, permits within weeks instead of years, and ministries that answer foreign managers on the same day. Investors notice, and so does the treasury."
 COLDWAR_ni_icwp_investor_labour: "Investor-First Labour Regime"
 COLDWAR_ni_icwp_investor_labour_desc: "Wages are capped by decree, independent unions are banned in the export industries and strikes end with the police. South Korea, Taiwan and Singapore built their factories this way. Foreign orders follow the cheapest hands, and the workers remember who kept them cheap."
 COLDWAR_ni_icwp_sez_mtt: "§YInternational Production§!\nClients we can take: §G15§! (instead of 8)\nCivilian factories that can work for clients: §G50 %§! (instead of 40 %)\nInvestment access counts as at least §G50 %§!"
 COLDWAR_ni_icwp_open_door_mtt: "§YInternational Production§!\nClients we can take: §G30§! (instead of 8)\nCivilian factories that can work for clients: §G60 %§! (instead of 40 %)\nInvestment access counts as at least §G65 %§!"
 COLDWAR_ni_icwp_pro_business_mtt: "§YInternational Production§!\nOur price per factory: §G-8 %§!\nClients save more, so they can rent more factories from us and pick us first in the market."
 COLDWAR_ni_icwp_investor_labour_mtt: "§YInternational Production§!\nOur price per factory: §G-15 %§!\nClients save more, so they can rent more factories from us and pick us first in the market."
