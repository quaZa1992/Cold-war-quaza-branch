l_english:
 # IMPERIA COLD WAR — International Production
 # Update 08.11.2026: v2 rebuild. English only, MD style.
 icwp_category: "International Production"
 icwp_category_desc: "Players place §Yconsumer goods production§! in each other's factories. Open §YInternational Production§! in the §YEconomy§! tab to manage contracts and find producers."
 icwp_export_processing_zone: "Establish Export Processing Zones"
 icwp_export_processing_zone_desc: "Customs-free industrial districts open our factories to foreign orders, as in Kaohsiung (1966), Masan (1970) or Bataan (1972), while the rest of the economy stays as it is."
 icwp_req_zone_funds: "Treasury reserves of at least §Y3.000 billion§!"
 icwp_req_core_industry: "At least one civilian factory"
 icwp_zone_effect_tt: "When the zones are ready after §Y180 days§!: investment access for §YInternational Production§! is at least §G65%§!."

 icwp_overseas_supply: "Overseas Supply Network"
 icwp_overseas_supply_desc: "Part of our consumer goods comes from factories abroad. Fewer of our own civilian factories are tied to consumer goods, but the industry we placed abroad no longer grows at home."
 icwp_tier_assembly: "Assembly Workshop"
 icwp_tier_assembly_desc: "Foreign clients have placed orders in our factories. The factories are bound to these orders, and in return we earn foreign currency and learn modern production."
 icwp_tier_platform: "Export Platform"
 icwp_tier_platform_desc: "Several foreign clients rely on our factories. Suppliers, trained workers and steady orders make our industry grow faster."
 icwp_tier_hub: "Manufacturing Hub"
 icwp_tier_hub_desc: "Our country is one of the great workshops of the world economy. Its growth now depends on foreign orders as much as on our own plans."
 icwp_tier_factory_world: "Factory of the World"
 icwp_tier_factory_world_desc: "No country produces more for others. The world depends on our factories, and our factories depend on the world."
 icwp_supply_disruption: "Supply Chain Disruption"
 icwp_supply_disruption_desc: "A production contract ended. Missing supplies, idle lines and lost orders weigh on the economy until they are replaced. The effect fades over time."

 icwp_tier_0: "Closed to Foreign Orders"
 icwp_tier_1: "Assembly Workshop"
 icwp_tier_2: "Export Platform"
 icwp_tier_3: "Manufacturing Hub"
 icwp_tier_4: "Factory of the World"
 icwp_next_0: "Next: §YAssembly Workshop§! at §Y35%§! investment access or with an export processing zone."
 icwp_next_1: "Next: §YExport Platform§! at §Y25§! experience and §Y2§! clients."
 icwp_next_2: "Next: §YManufacturing Hub§! at §Y60§! experience, §Y3§! clients and §Y10§! units."
 icwp_next_3: "Next: §YFactory of the World§! with §Y20%§! of all deliveries, §Y3§! clients and §Y10§! delivered units for §Y12§! months."
 icwp_next_4: "We hold the title while we keep §Y20%§! of all deliveries and §Y3§! clients."

