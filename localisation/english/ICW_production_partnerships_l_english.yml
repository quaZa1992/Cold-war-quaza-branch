 icwp_hr_warn_tt: "Leaving without notice costs a settlement of 26 weeks of payments times the integration, and our consumer goods factories face a shortage for 12 months. Giving notice costs no settlement and halves the shortage."
 icwp_hr_info_tt: "Factories delivering now / rented factories. Every delivering factory frees one consumer goods factory at home. The bar shows integration (grows to 100 % over 3 years), the ramp-up, the notice period or the suspension."
 icwp_cr_info_tt: "Factories bound for this client now. They count as consumer goods factories while the contract runs."
 icwp_cr_warn_tt: "If this client leaves, our productivity growth and stability drop for 12 months. The drop mirrors what the client brought us, times the integration; notice halves it."
 icwp_tt_tt: "§YTechnology transfer§!\nEvery factory we run for a client teaches us its methods. The bonus is the client's share of our civilian factories x 40 % x how much more productive the client is (1x to 3x). All clients together give up to +25 % productivity growth; the tier adds +5 to +20 %."
