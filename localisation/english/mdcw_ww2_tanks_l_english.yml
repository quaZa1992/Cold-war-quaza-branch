l_english:
 mdcw_ww2_tank_chassis_1940_nsb:0 "WWII Hull I"
 mdcw_ww2_tank_chassis_1940_nsb_desc: "Early wartime tracked hulls, conventional steel armour, mechanical sights and manually loaded cannon. The same hull family includes self-propelled artillery, anti-aircraft and rocket-artillery variants; each requires its own compatible weapon and ammunition research."
 mdcw_ww2_tank_chassis_1943_nsb:0 "WWII Hull II"
 mdcw_ww2_tank_chassis_1943_nsb_desc: "Improved wartime tracked hulls with stronger armour, engines and cannon, retaining optical fire control. Artillery, anti-aircraft and rocket-artillery versions share the hull family and require their corresponding weapons and ammunition."
 mdcw_ww2_tank_ammunition_1940:0 "WWII Ammo I"
 mdcw_ww2_tank_ammunition_1940_desc: "Conventional armour-piercing and high-explosive ammunition, with mixed loads for general service."
 mdcw_ww2_tank_ammunition_1943:0 "WWII Ammo II"
 mdcw_ww2_tank_ammunition_1943_desc: "Capped armour-piercing ammunition and early shaped-charge shells provide specialised anti-armour options."
 medium_tank_chassis_mdcw_1940: "Wartime Tank Hull I"
 medium_tank_chassis_mdcw_1940_desc: "A conventional tracked tank hull intended for wartime engines, armour and armament."
 medium_tank_chassis_mdcw_1943: "Wartime Tank Hull II"
 medium_tank_chassis_mdcw_1943_desc: "An improved wartime tracked tank hull."
 mdcw_ww2_medium_tank_1940_model: "Wartime Medium Tank I"
 mdcw_ww2_medium_tank_1940_model_desc: "A tank with conventional steel armour, optical sights and a manually loaded cannon."
 mdcw_ww2_medium_tank_1943_model: "Wartime Medium Tank II"
 mdcw_ww2_medium_tank_1943_model_desc: "An improved wartime medium tank with stronger armour and anti-armour firepower."
 mdcw_tank_gun_1940: "Wartime Tank Cannon I"
 mdcw_tank_gun_1940_desc: "An early wartime tank cannon using conventional ammunition."
 mdcw_tank_gun_1943: "Wartime Tank Cannon II"
 mdcw_tank_gun_1943_desc: "An improved wartime tank cannon with greater anti-armour performance."
 mdcw_tank_engine_1940: "Wartime Tank Engine I"
 mdcw_tank_engine_1940_desc: "A conventional combustion engine with limited power and fuel economy."
 mdcw_tank_engine_1943: "Wartime Tank Engine II"
 mdcw_tank_engine_1943_desc: "An improved conventional tank engine."
 mdcw_tank_steel_armor_1940: "Wartime Steel Armour I"
 mdcw_tank_steel_armor_1940_desc: "Conventional steel armour offering limited protection against modern weapons."
 mdcw_tank_steel_armor_1943: "Wartime Steel Armour II"
 mdcw_tank_steel_armor_1943_desc: "Improved conventional steel armour."
 mdcw_tank_optical_fire_control_1940: "Wartime Optical Sights I"
 mdcw_tank_optical_fire_control_1940_desc: "Basic optical sights and manual fire control."
 mdcw_tank_optical_fire_control_1943: "Wartime Optical Sights II"
 mdcw_tank_optical_fire_control_1943_desc: "Improved optical sights and manual fire control."
 mdcw_tank_mixed_ammo_1940: "Wartime Mixed Ammunition"
 mdcw_tank_mixed_ammo_1940_desc: "A balanced load of armour-piercing and high-explosive rounds."
 mdcw_tank_ap_ammo_1940: "Wartime AP Ammunition"
 mdcw_tank_ap_ammo_1940_desc: "Conventional armour-piercing ammunition with limited effectiveness against infantry."
 mdcw_tank_he_ammo_1940: "Wartime HE Ammunition"
 mdcw_tank_he_ammo_1940_desc: "High-explosive ammunition suited to infantry and unarmoured targets."
 mdcw_tank_apcbc_ammo_1943: "Wartime APCBC Ammunition"
 mdcw_tank_apcbc_ammo_1943_desc: "Capped armour-piercing projectiles with ballistic caps for improved anti-armour performance."
 mdcw_tank_heat_ammo_1943: "Wartime HEAT Ammunition"
 mdcw_tank_heat_ammo_1943_desc: "Early shaped-charge ammunition trades general-purpose performance and reliability for armour penetration."
 mdcw_ww2_tank_chassis_1940_legacy:0 "WWII Hull I"
 mdcw_ww2_tank_chassis_1940_legacy_desc: "Early wartime tracked tank hulls, conventional steel armour, mechanical sights and manually loaded cannon."
