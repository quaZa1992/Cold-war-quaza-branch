 COLDWAR_UAE_fragmented_authority:0 "Fragmented Authority"
 COLDWAR_UAE_fragmented_authority_desc:0 "The ruling courts retain separate administrations, customs revenues and forces. The Council can encourage cooperation, but carrying out common policy still requires negotiations among rulers with different priorities."
 COLDWAR_UAE_unequal_development:0 "Unequal Development"
 COLDWAR_UAE_unequal_development_desc:0 "Abu Dhabi's developing oil industry and Dubai's trading economy give the two leading emirates resources that the northern sheikhdoms lack. Unequal access to roads, public services and finance makes the distribution of development a political question."
 COLDWAR_UAE_scarce_specialists:0 "Scarce Specialists"
 COLDWAR_UAE_scarce_specialists_desc:0 "The coast has too few trained teachers, doctors, technicians and administrators for its ambitions. Foreign expertise can relieve immediate shortages, while building a local pool of specialists requires years of education and practical training."
 COLDWAR_UAE_water_power:0 "Water and Power Constraints"
 COLDWAR_UAE_water_power_desc:0 "Expanding coastal towns depend on costly water distribution, desalination and reliable electricity. New households and businesses increase demand faster than a small technical workforce can extend and maintain these systems."
 COLDWAR_UAE_narrow_revenues:0 "A Narrow Revenue Base"
 COLDWAR_UAE_narrow_revenues_desc:0 "Valuable oil reserves lie beneath the emirates, but the operating industry remains small and expensive to expand. The wider productive and service economy supplies only a narrow revenue base, leaving public ambitions exposed to the fortunes of a few sectors."
 COLDWAR_UAE_expatriate_workforce:0 "An Expatriate Workforce"
 COLDWAR_UAE_expatriate_workforce_desc:0 "Workers from abroad allow the economy to grow beyond the limits of the small citizen population. The armed forces still rely on a small citizen cadre, making it harder to restore unit cohesion and readiness after sustained operations."
 COLDWAR_UAE_maritime_livelihoods:0 "Pearls, Fishing and Dhows"
 COLDWAR_UAE_maritime_livelihoods_desc:0 "Fishing, dhow crews and maritime merchants still support coastal households, easing their reliance on public assistance. Pearling helped build these settlements and their trading connections, but its long decline has left debts and uncertain livelihoods. Better harbours can improve these trades, while the expansion of oil draws workers and commerce away from the traditional coastal economy."
