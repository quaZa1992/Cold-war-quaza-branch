l_english:
# IMPERIA CW — Cold War: Spain 1970 national programme.
 COLDWAR_SPR_registry_reformists:0 "£generic_conservatism_small Democratic Reformists"
 COLDWAR_SPR_registry_reformists_desc:0 "Conservative reformers seek representative government through a negotiated transformation of the existing state."
 COLDWAR_SPR_registry_reformists_icon:0 "£generic_conservatism_small"
 COLDWAR_SPR_registry_ucd:0 "£generic_conservatism_small (UCD) - Union of the Democratic Centre"
 COLDWAR_SPR_registry_ucd_desc:0 "Christian democrats, liberals and moderate reformers cooperate on parliamentary government, constitutional consensus and a market economy."
 COLDWAR_SPR_registry_ucd_icon:0 "£generic_conservatism_small"
 COLDWAR_SPR_registry_ap:0 "£generic_conservatism_small (AP) - People's Alliance"
 COLDWAR_SPR_registry_ap_desc:0 "The democratic conservative right defends parliamentary institutions, private enterprise and the territorial unity of Spain."
 COLDWAR_SPR_registry_ap_icon:0 "£generic_conservatism_small"
 COLDWAR_SPR_registry_pp:0 "£generic_conservatism_small (PP) - People's Party"
 COLDWAR_SPR_registry_pp_desc:0 "The conservative party brings together the constitutional centre-right around economic liberalisation and a stronger national administration."
 COLDWAR_SPR_registry_pp_icon:0 "£generic_conservatism_small"
 COLDWAR_SPR_registry_liberal:0 "£generic_liberalism_small Liberal Democratic Opposition"
 COLDWAR_SPR_registry_liberal_desc:0 "Liberal democrats advocate civil liberties, electoral competition, enterprise and European cooperation."
 COLDWAR_SPR_registry_liberal_icon:0 "£generic_liberalism_small"
 COLDWAR_SPR_registry_cds:0 "£SPR_centro_democratico (CDS) - Democratic and Social Centre"
 COLDWAR_SPR_registry_cds_desc:0 "The liberal centre combines civil rights and social provision with a competitive market economy."
 COLDWAR_SPR_registry_cds_icon:0 "£SPR_centro_democratico"
 COLDWAR_SPR_registry_psoe:0 "£SPR_psoe (PSOE) - Spanish Socialist Workers' Party"
 COLDWAR_SPR_registry_psoe_desc:0 "The Socialists seek parliamentary democracy, labour rights and universal public services through an elected national government."
 COLDWAR_SPR_registry_psoe_icon:0 "£SPR_psoe"
 COLDWAR_SPR_registry_pce:0 "£SPR_pce (PCE) - Communist Party of Spain"
 COLDWAR_SPR_registry_pce_desc:0 "The Communist Party advocates political pluralism, organised labour and strategic public ownership through a Spanish constitutional programme."
 COLDWAR_SPR_registry_pce_icon:0 "£SPR_pce"
 COLDWAR_SPR_registry_iu:0 "£SPR_pce (IU) - United Left"
 COLDWAR_SPR_registry_iu_desc:0 "Communists and allied left-wing organisations cooperate on democratic social reform, public services and a pluralist national programme."
 COLDWAR_SPR_registry_iu_icon:0 "£SPR_pce"
 COLDWAR_SPR_registry_movimiento:0 "£SPR_falangists National Movement"
 COLDWAR_SPR_registry_movimiento_desc:0 "The regime unites Falangists, Catholics, traditionalists and state officials under the institutions established by Franco."
 COLDWAR_SPR_registry_movimiento_icon:0 "£SPR_falangists"
 COLDWAR_SPR_registry_falange:0 "£SPR_falangists (FET y de las JONS) - Spanish Phalanx"
 COLDWAR_SPR_registry_falange_desc:0 "National syndicalists seek an authoritarian state founded on vertical representation, social mobilisation and national unity."
 COLDWAR_SPR_registry_falange_icon:0 "£SPR_falangists"
 COLDWAR_SPR_registry_armed_forces:0 "£SPR_spanish_army Spanish Armed Forces"
 COLDWAR_SPR_registry_armed_forces_desc:0 "The armed forces remain an institutional pillar of the state and a decisive participant in the question of succession."
 COLDWAR_SPR_registry_armed_forces_icon:0 "£SPR_spanish_army"
 COLDWAR_SPR_registry_continuity:0 "£SPR_spanish_army Technocratic Continuity Cabinet"
 COLDWAR_SPR_registry_continuity_desc:0 "Technocrats and military authorities seek to preserve authoritarian institutions while extending industrial development."
 COLDWAR_SPR_registry_continuity_icon:0 "£SPR_spanish_army"
 COLDWAR_SPR_registry_crown:0 "£SPR_spanish_bourbons House of Bourbon"
 COLDWAR_SPR_registry_crown_desc:0 "The Crown embodies the designated succession. Its political authority depends on the constitutional settlement chosen after Franco."
 COLDWAR_SPR_registry_crown_icon:0 "£SPR_spanish_bourbons"
