l_english:
# IMPERIA CW — Cold War: Imperia 1985 middle east — English localisation.
 PER_1985_sacred_defense_mobilization: "Sacred Defense Mobilization"
 PER_1985_sacred_defense_mobilization_desc: "Iran enters 1985 with the war framed as a revolutionary defense of the homeland and the Islamic Republic. Mobilization is deep, but the strain on manpower, logistics, and society is severe."
 PER_1985_revolutionary_war_economy: "Revolutionary War Economy"
 PER_1985_revolutionary_war_economy_desc: "Sanctions, wartime centralization, disrupted oil exports, and ideological institutions weigh heavily on Iran's economy."
 IRQ_1985_baathist_total_war_state: "Ba'athist Total War State"
 IRQ_1985_baathist_total_war_state_desc: "Saddam Hussein's Iraq is built around the security services, Ba'athist loyalty, and the war against Iran. The regime can mobilize ruthlessly, but the army is under political pressure."
 IRQ_1985_war_debt_and_militarized_economy: "War Debt and Militarized Economy"
 IRQ_1985_war_debt_and_militarized_economy_desc: "The war is being paid for with oil revenue, foreign credit, and Gulf support. It keeps the front supplied, but distorts the whole economy."
 IRQ_1985_war_of_attrition: "War of Attrition"
 IRQ_1985_war_of_attrition_desc: "By 1985 the war against Iran has become a grinding contest of trenches, artillery, recruitment, and money. Iraq can hold prepared positions well, but every month at the front raises the cost of the army."
 IRQ_1985_gulf_credit_line_dynamic_modifier: "Gulf Credit Lifeline"
 IRQ_1985_gulf_credit_line_dynamic_modifier_desc: "Saudi Arabia, Kuwait, and other Gulf monarchies are keeping Iraq's debt burden manageable while they still believe Baghdad is containing revolutionary Iran."
 IRQ_1985_gulf_credit_line_dynamic_modifier_tt: "The Gulf credit line currently modifies Iraq's interest rate by [?IRQ_1985_gulf_credit_interest_modifier|=+1]. If the creditor states revoke support through decisions, this benefit shrinks and can disappear."
 IRQ_1985_gulf_credit_category: "1985 Gulf Credit Lines"
 IRQ_1985_review_gulf_credit_lines: "Review Gulf Credit Lines"
 IRQ_1985_review_gulf_credit_lines_desc: "Baghdad's wartime finances depend on political credit from Gulf monarchies. The benefit remains only while those governments keep the lines open."
 IRQ_1985_gulf_credit_status_tt: "Saudi, Kuwaiti, Emirati, Qatari, Bahraini, and Omani wartime credit is represented as a dynamic interest-rate relief for Iraq. Each sponsor can revoke its share."
 SAU_1985_revoke_iraqi_credit_line: "Revoke Saudi Credit to Iraq"
 SAU_1985_revoke_iraqi_credit_line_desc: "End Riyadh's wartime credit line to Baghdad. Iraq will lose a major part of its interest-rate relief."
 KUW_1985_revoke_iraqi_credit_line: "Revoke Kuwaiti Credit to Iraq"
 KUW_1985_revoke_iraqi_credit_line_desc: "End Kuwait City's wartime credit line to Baghdad. Iraq will lose a major part of its interest-rate relief."
 UAE_1985_revoke_iraqi_credit_line: "Revoke Emirati Credit to Iraq"
 UAE_1985_revoke_iraqi_credit_line_desc: "End Abu Dhabi's wartime credit line to Baghdad. Iraq will lose part of its interest-rate relief."
 QAT_1985_revoke_iraqi_credit_line: "Revoke Qatari Credit to Iraq"
 QAT_1985_revoke_iraqi_credit_line_desc: "End Doha's wartime credit line to Baghdad. Iraq will lose part of its interest-rate relief."
 BHR_1985_revoke_iraqi_credit_line: "Revoke Bahraini Credit to Iraq"
 BHR_1985_revoke_iraqi_credit_line_desc: "End Manama's wartime credit line to Baghdad. Iraq will lose part of its interest-rate relief."
 OMA_1985_revoke_iraqi_credit_line: "Revoke Omani Credit to Iraq"
 OMA_1985_revoke_iraqi_credit_line_desc: "End Muscat's wartime credit line to Baghdad. Iraq will lose a small part of its interest-rate relief."
 IRQ_1985_kurdish_front_category: "1985 Kurdish Northern Front"
 IRQ_1985_review_northern_front: "Review the Northern Front"
 IRQ_1985_review_northern_front_desc: "KDP and PUK Peshmerga positions in the north are tied into Iran's wider war effort. If Baghdad wins the field war, the Kurdish question will continue as an internal security crisis."
 IRQ_1985_kurdish_front_status_tt: "KDP: open war with Baghdad and direct Iranian support. PUK: the 1983 ceasefire is collapsing into renewed combat. If Iraq defeats both fronts, a northern security minigame will replace the active war."
 IRQ_1985_launch_mountain_sweeps: "Launch Mountain Sweeps"
 IRQ_1985_launch_mountain_sweeps_desc: "Commit security troops and army columns into the mountains to disrupt Peshmerga supply caches and command routes."
 IRQ_1985_secure_kirkuk_mosul_line: "Secure the Kirkuk-Mosul Line"
 IRQ_1985_secure_kirkuk_mosul_line_desc: "Fortify the Arabized oil and transport corridor that separates Baghdad's heartland from the Kurdish mountain front."
 IRQ_1985_expand_jash_border_guards: "Expand Jash Border Guards"
 IRQ_1985_expand_jash_border_guards_desc: "Use pro-government Kurdish auxiliaries and local guards to pressure insurgent cells after the front has been cleared."
 IRQ_1985_reopen_autonomy_channels: "Reopen Autonomy Channels"
 IRQ_1985_reopen_autonomy_channels_desc: "Offer limited channels to Kurdish notables and former PUK intermediaries to split the resistance from Iranian logistics."
 IRQ_1985_collective_security_sweeps: "Collective Security Sweeps"
 IRQ_1985_collective_security_sweeps_desc: "Escalate arrests, village screening, and road-control operations. Effective, but it feeds fear and resentment."
 PER_1985_arm_kdp_peshmerga: "Arm KDP Peshmerga"
 PER_1985_arm_kdp_peshmerga_desc: "The KDP's alliance with Iran gives us a northern lever against Baghdad. Weapons and guides can keep Saddam's divisions pinned."
 PER_1985_reconnect_puk_cells: "Reconnect PUK Cells"
 PER_1985_reconnect_puk_cells_desc: "The PUK ceasefire with Baghdad is collapsing. Covert contact can pull Talabani's fighters back into the anti-Ba'ath front."
 PER_1985_open_border_sanctuaries: "Open Border Sanctuaries"
 PER_1985_open_border_sanctuaries_desc: "Let Kurdish fighters use Iranian border routes for food, medical care, intelligence, and rest."
 PER_1985_support_kurdish_cells: "Support Kurdish Cells"
 PER_1985_support_kurdish_cells_desc: "If Baghdad has retaken the north, covert support can keep Kurdish networks alive and push the region back toward revolt."
 IRQ_1985_kurdish_insurgency_state_modifier: "Kurdish Underground Networks"
 IRQ_1985_kurdish_insurgency_state_modifier_desc: "The mountain war has not ended cleanly. Kurdish party cells, family networks, and Iranian border routes continue to strain Baghdad's control."
 IRQ_1985_kurdish_insurgency_state_modifier_tt: "State pressure scales with Iraq's Kurdish resistance score. High resistance increases resistance target, growth, garrison damage, garrison requirements, and slows Iraqi movement."
 IRQ_1985_kurdish_uprising_tt: "§RThe northern security crisis has become a new Kurdish uprising. KDP and PUK forces return to the field with Iranian-backed momentum.§!"
 ISR_1985_security_belt_war: "Security Belt War"
 ISR_1985_security_belt_war_desc: "Israel's withdrawal from most of Lebanon has left a contested security belt and a persistent low-intensity conflict on the northern frontier."
 LEB_1985_civil_war_fragmentation: "Civil War Fragmentation"
 LEB_1985_civil_war_fragmentation_desc: "Lebanon is fractured between militias, sectarian institutions, foreign patrons, and weakened state structures. Beirut's government exists, but it does not command the whole country."
 HEZ_1985_emerging_resistance_cells: "Emerging Resistance Cells"
 HEZ_1985_emerging_resistance_cells_desc: "Hezbollah is still young in 1985, but Iranian support, clerical networks, and the war in South Lebanon are turning it into a durable armed movement."
 GULF_1985_war_financiers: "Financiers of the Gulf War"
 GULF_1985_war_financiers_desc: "The Gulf monarchies are underwriting Iraq's war effort to contain revolutionary Iran. Oil wealth buys influence, but it also ties their security to Baghdad's fortunes."
