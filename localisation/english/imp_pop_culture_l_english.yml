l_english:
# IMPERIA CW — Cold War: Imperia pop culture — English localisation.
 imp_pop_culture.1.t: "Bitcoin breaks $1,000 barrier"
 imp_pop_culture.1.d: "A once-obscure digital currency created by the mysterious Satoshi Nakamoto has just reached a symbolic milestone: $1,000 per coin. What was once dismissed as internet play-money is now shaking the foundations of global finance. Speculators, libertarians, and tech-savvy investors alike pile in, while governments and central banks start to take notice — and in some cases, prepare to strike back. Is this the future of money, or the beginning of a digital bubble?"
 imp_pop_culture.1.o1: "Why did I trade all mine for free pizza?"

 imp_pop_culture.2.t: "“Lose Yourself“ makes Oscar history"
 imp_pop_culture.2.d: " In a historic moment few could have predicted, American rapper Eminem has taken home the Academy Award for Best Original Song at the 75th Oscars for his track “Lose Yourself” from the semi-autobiographical film 8 Mile. \nEminem, born Marshall Mathers, did not attend the ceremony, assuming the Academy wouldn't honour a gritty hip-hop anthem about personal struggle and ambition. Instead, co-writer Luis Resto accepted the statue on his behalf. \nCritics and fans alike are calling it a defining moment for hip-hop culture — once on the fringes, now recognized at the heart of mainstream global entertainment."
 imp_pop_culture.2.o1: "Well deserved."

 imp_pop_culture.3.t: "“The Fellowship of the Ring“ premieres"
 imp_pop_culture.3.d: "After years of anticipation, director Peter Jackson’s sweeping adaptation of J.R.R. Tolkien’s The Lord of the Rings: The Fellowship of the Ring has officially hit cinemas worldwide. Critics are calling it a cinematic milestone — blending breathtaking New Zealand landscapes, groundbreaking visual effects, and a faithful recreation of Tolkien’s epic world.\n\nBut the film’s cultural impact doesn’t stop there. The release has sparked a mainstream resurgence of “nerd“ culture, catapulting the fantasy genre into the spotlight. Where once Tolkien’s work and other fantasy media were seen as niche interests, now they’re global phenomena."
 imp_pop_culture.3.o1: "The Age of Men is over. The Time of New Zealand has come."
 imp_pop_culture.3.o2: "I'm rooting for Sauron."
 imp_pop_culture.3.o3: "I have to see this in cinema."

 imp_pop_culture.4.t: "Gangnam Style takes over the world!"
 imp_pop_culture.4.d: "What began as a fun, quirky music video by South Korean artist PSY has erupted into a global sensation. “Gangnam Style,” released just months ago, has officially gone viral — and now, it’s everywhere. The song’s dance moves, infectious beat, and PSY's charismatic performance have turned it into a global phenomenon, breaking the internet and pushing the boundaries of what can go viral in the age of social media. Hitting over 1 billion views on YouTube within months, it has transcended language barriers, with fans from New York to Nairobi replicating the famous dance. Cultural pundits are now calling it a turning point in the globalization of K-pop, opening doors for more Asian music to cross over into mainstream Western markets."
 imp_pop_culture.4.o1: "Oppa is Gangnam style."

 imp_pop_culture.5.t: "The King of Pop passes away"
 imp_pop_culture.5.d: "The world has lost an icon. Michael Jackson, the King of Pop, passed away at the age of 50, leaving behind a legacy that transformed the music industry and pop culture forever. The tragic news hit the the entertainment world hard, with fans, celebrities, and political leaders alike mourning the loss of the man who broke down racial barriers in music, revolutionized the music video industry, and created some of the most iconic tracks of the 20th century.\n\nFrom his groundbreaking albums like Thriller to his unparalleled contributions to music, dance, and fashion, Michael Jackson was a cultural force unlike any other. His influence spanned across generations and continents, with millions of fans across the globe still drawn to his music and performances."
 imp_pop_culture.5.o1: "Rest in Peace."

 imp_pop_culture.6.t: "Taylor Swift's 1989 breaks new ground"
 imp_pop_culture.6.d: "Taylor Swift has officially stepped into a new era of music. Her highly anticipated fifth studio album, 1989, has arrived, marking a complete departure from her country roots and fully embracing the pop music landscape. With this release, Swift has not only captured the attention of millions but also redefined her own career.\n\nThe album's success has not only cemented her place in the pop music elite, but it has also sparked a new trend in the industry — an artist who can cross genres and still dominate the charts. With 1989, Taylor Swift has become an icon, ushering in a new era of music that blends catchy pop anthems with deeply personal storytelling."
 imp_pop_culture.6.o1: "Slay Queen."

 imp_pop_culture.7.t: "The dress sparks global bebate"
 imp_pop_culture.7.d: "A simple photograph of a dress has caused an unprecedented global debate. A post on the social media platform Tumblr went viral when users couldn't agree on whether the dress in the photo was blue and black or white and gold. The internet quickly became divided, with people passionately arguing over the dress’s true color. What started as an innocent question has now escalated into a global debate, with news outlets covering the story, celebrities joining in, and even scientists getting involved. The debate has sparked questions about perception, optical illusions, and the influence of social media in shaping public opinion.\n\nAs the debate rages on, the world is united by a single question: What color is the dress?"
 imp_pop_culture.7.o1: "Blue and Black."
 imp_pop_culture.7.o2: "White and Gold."

 imp_pop_culture.8.t: "TikTok takes over the world"
 imp_pop_culture.8.d: "What started as a platform for lip-syncing videos has rapidly transformed into a global cultural powerhouse. TikTok, the social media app developed by Chinese tech company ByteDance, has exploded in popularity, attracting hundreds of millions of active users worldwide. With its short-form video format and viral algorithm, TikTok has redefined what it means to go viral, giving everyday users the ability to gain massive fame almost overnight. From dance challenges to memes, viral trends, and even political movements, TikTok has become a cultural juggernaut."
 imp_pop_culture.8.o1: "Everything is going according to plan."
 imp_pop_culture.8.o2: "What could possible go wrong?"

 imp_pop_culture.9.t: "Twilight Movie franchise dominates the box office"
 imp_pop_culture.9.d: "The world has been swept into a vampire romance frenzy as the Twilight Saga hits theaters. Based on the best-selling book series by Stephenie Meyer, the Twilight films have become a global success, attracting millions of fans worldwide. The first film, Twilight, released in November 2008, introduced audiences to the love triangle between Bella Swan, Edward Cullen, and Jacob Black. The films, combining supernatural drama with teen angst and romance, have led to a heated debate:\n\nTeam Edward or Team Jacob?"
 imp_pop_culture.9.o1: "Team Edward."
 imp_pop_culture.9.o2: "Team Jacob."

 imp_pop_culture.10.t: "YouTube revolutionizes digital media"
 imp_pop_culture.10.d: "A new platform called YouTube is changing the way the world shares and consumes video. Launched this month, YouTube has quickly become the go-to destination for watching and uploading videos, offering a new level of democratization in the entertainment and media industry. The very first video, titled “Me at the zoo”, uploaded by co-founder Jawed Karim, features a simple clip of Karim standing in front of elephants at the San Diego Zoo, saying, “All right, so here we are in front of the elephants...“ Despite its simplicity, this video has is quickly becoming an icon in the beginning of a new era in digital media."
 imp_pop_culture.10.o1: "Need. More. Cat. Videos."

 imp_pop_culture.11.t: "Twitter launches"
 imp_pop_culture.11.d: "A new platform called Twitter has launched, allowing users to post short messages — or “tweets” — in real-time, limited to just 140 characters. What began as a quirky internal service at a podcasting company has exploded into a social media force, redefining how people communicate, organize, and share information.\n\nThe first tweet ever sent — “just setting up my twttr” — by co-founder Jack Dorsey, marks the beginning of a new era in microblogging. With its simplicity and speed, Twitter is quickly becaming a tool for everything from celebrity updates and meme culture to breaking news and political revolutions."
 imp_pop_culture.11.o1: "Retweet if true."

 imp_pop_culture.12.t: "Hearts of Iron IV Released"
 imp_pop_culture.12.d: "Swedish developer Paradox Interactive has released Hearts of Iron IV, a grand strategy game letting players rewrite the outcome of World War II down to the tiniest production line and national focus.\n\nSuddenly, entire generations of gamers are asking, “What if Luxembourg joined the Axis?” and “Can I make Venezuela invade the U.S.?” With its deep mechanics, alternate history mods, and absurd AI choices, HoI4 has become a favorite among history buffs, meme lords, and people with way too much time on their hands."
 imp_pop_culture.12.o1: "I should check this out."
 imp_pop_culture.12.o2: "Hey, that's us!"

 imp_pop_culture.13.t: "Team Edward Wins!"
 imp_pop_culture.13.d: "Following heated debate, including a final deciding vote with [?global.edward] votes for Team Edward, and [?global.jakob] votes for Team Jakob, it has now been confirmed that Team Edward has emerged as the dominant force in the Twilight fandom. The vampire vs. werewolf rivalry, once the defining question of 2000s teen culture, has now been permanently resolved in favor of the brooding, marble-skinned immortal.\n\nCritics cite Edward’s tragic romanticism, protective nature, and — yes — sparkling skin as key reasons for his global appeal. Meanwhile, butthurt Team Jacob supporters maintain that muscles and loyalty were “robbed by poor writing choices.”"
 imp_pop_culture.13.o1: "Go Edward!"
 team_edward: "Cast your vote for Team Edward\n£GFX_stability_texticon  Gain Base Stability: §G+20%§!."
 team_jakob: "Cast your vote for Team Jakob\n£GFX_stability_texticon  Gain Base Stability: §R-20%§!."

 imp_pop_culture.14.t: "PlayStation 2 hits the market"
 imp_pop_culture.14.d: "Sony has released the PlayStation 2, a sleek black console that’s not just a gaming device — it's a DVD player, a media hub, and a cultural phenomenon in the making. The demand is explosive. Lines stretch around city blocks. Kids skip school. Adults call in sick. The PS2 becomes not just the most powerful console on the market — but a status symbol. With titles like Metal Gear Solid 2, Final Fantasy X, and Grand Theft Auto: San Andreas, Sony is cementing its dominance in the gaming world. The PS2 will surely to become the best-selling console of all time."
 imp_pop_culture.14.o1: "I'm going to get one right now!"
 imp_pop_culture.14.o2: "Hey, that's ours!"

 imp_pop_culture.15.t: "PlayStation 3 launches"
 imp_pop_culture.15.d: "Sony returns with the PlayStation 3, touting cutting-edge graphics, Blu-ray support, and a futuristic Cell processor that sounds like something NASA rejected for being too complex. But at a whopping $599, the launch price sparks outrage and memes. While the hardware is impressive, early sales are lagging behind the cheaper Xbox 360 and Nintendo Wii."

 imp_pop_culture.16.t: "PlayStation 4 launches"
 imp_pop_culture.16.d: "Sony has unveiled the PlayStation 4, and this time, it's not just a console — it's a connected entertainment ecosystem. Sleek, powerful, and reasonably priced at launch, the PS4 hits the ground running and immediately outpaces its rivals. With built-in streaming, social sharing, and a laser focus on gamers (unlike its competitor’s TV obsession), Sony regains the goodwill it lost during the PS3’s rocky start. By the mid-2010s, titles like Bloodborne, Horizon Zero Dawn, and Spider-Man help push PS4 into tens of millions of homes. Sony reclaims the throne as the definitive console of the generation."

 imp_pop_culture.17.t: "PlayStation 5 releases "
 imp_pop_culture.17.d: "The PlayStation 5 has officially launched, boasting next-gen graphics, lightning-fast load times, and a design that looks like a futuristic router. Reviewers praise its performance and lineup of exclusives like Demon’s Souls, Ratchet & Clank: Rift Apart, and Spider-Man: Miles Morales. The problem? Nobody can actually buy one. Amid global supply chain issues, scalpers, and bots, the PS5 becomes less a console and more a rare digital artifact, traded at absurd prices on auction sites."