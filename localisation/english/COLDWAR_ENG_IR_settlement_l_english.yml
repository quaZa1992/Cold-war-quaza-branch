l_english:
# IMPERIA COLD WAR — British industrial relations settlement.
 COLDWAR_ENG_IR_agreement:0 "Industrial Relations: Planning Agreements"
 COLDWAR_ENG_IR_agreement_desc:0 "Ministers, employers and trade unions negotiate investment and training commitments for British industry."
 COLDWAR_ENG_IR_representation:0 "Industrial Relations: Worker Directors"
 COLDWAR_ENG_IR_representation_desc:0 "Elected worker directors give organised labour a seat on company boards and a channel for settling disputes."
 COLDWAR_ENG_IR_floor:0 "Industrial Relations: National Minimum Wage"
 COLDWAR_ENG_IR_floor_desc:0 "Parliament has set a single statutory minimum. Wages inspectors respond to complaints across trades. Weekly expenditure: §R0.002%§! of current GDP."
 COLDWAR_ENG_IR_floor_bill_tt:0 "Weekly expenditure: §R0.002%§! of current GDP"
 COLDWAR_ENG_IR_councils:0 "Industrial Relations: Wages Councils"
 COLDWAR_ENG_IR_councils_desc:0 "Employers and trade unions negotiate minimum terms trade by trade. The first council settlement can cover clothing or retail. Weekly expenditure: §R0.001%§! of current GDP."
 COLDWAR_ENG_IR_councils_bill_tt:0 "Weekly expenditure: §R0.001%§! of current GDP"
 COLDWAR_ENG_IR_inspectorate:0 "Industrial Relations: National Wages Inspectorate"
 COLDWAR_ENG_IR_inspectorate_desc:0 "Regional inspectors enforce the statutory minimum and pursue arrears on behalf of low-paid workers. Weekly expenditure: §R0.003%§! of current GDP."
 COLDWAR_ENG_IR_inspectorate_bill_tt:0 "Weekly expenditure: §R0.003%§! of current GDP"
 COLDWAR_ENG_IR_boards:0 "Industrial Relations: Extended Wages Councils"
 COLDWAR_ENG_IR_boards_desc:0 "Trade representatives can extend binding pay orders to both clothing manufacture and retail. Weekly expenditure: §R0.002%§! of current GDP."
 COLDWAR_ENG_IR_boards_bill_tt:0 "Weekly expenditure: §R0.002%§! of current GDP"
 COLDWAR_ENG_IR_machine_tools:0 "Match Investment in Machine Tools"
 COLDWAR_ENG_IR_machine_tools_desc:0 "Employers will meet the public contribution with tooling, training and trials on the factory floor. The Department of Industry can take the results to other manufacturers."
 COLDWAR_ENG_IR_conciliation:0 "Convene a Joint Conciliation Panel"
 COLDWAR_ENG_IR_conciliation_desc:0 "Worker directors and employers can bring a disputed settlement to the conciliation service before industrial action begins."
 COLDWAR_ENG_IR_clothing:0 "Negotiate a Clothing Manufacture Order"
 COLDWAR_ENG_IR_clothing_desc:0 "Link the clothing pay order to paid training on modern production equipment. Employers and representatives will negotiate a single schedule for the trade."
 COLDWAR_ENG_IR_retail:0 "Negotiate a Retail Wages Order"
 COLDWAR_ENG_IR_retail_desc:0 "Bring the retail trades together to settle minimum rates and hours. A common order gives shop workers a claim they can enforce through their council."
 COLDWAR_ENG_IR_worker_voice_tt:0 "Worker representation on company boards"
 COLDWAR_ENG_IR_machine_tools_funded_tt:0 "Treasury holds at least §Y0.15%§! of current GDP"
 COLDWAR_ENG_IR_machine_tools_price_tt:0 "Treasury expenditure: §R0.15%§! of current GDP"
