 COLDWAR_SWE_UI_NATIVE_COMPANY_LEDGER_IKEA_TIP:0 "Company cash is separate from the government treasury. Share quotes use the company value shown here.\n\nMost recent store payment in your country: USD [?COLDWAR_SWE_ikea_retail_last_payment_millions|2] million.\nWeekly rates at that payment:\nRent: USD [?COLDWAR_SWE_ikea_retail_last_rent_millions|2] million.\nLocal profit tax: USD [?COLDWAR_SWE_ikea_retail_last_tax_millions|2] million.\nPayments are settled weekly. These figures record the most recent payment, not a new charge."
