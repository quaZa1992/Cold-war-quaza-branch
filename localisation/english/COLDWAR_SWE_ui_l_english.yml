 COLDWAR_SWE_UI_NATIVE_PRODUCT_8_TIP:0 "Ask for a researched gun and a support plan. You receive actual equipment only after both sides approve and funds and stock are ready."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_8_WHO:0 "The buyer chooses an eligible weapon and terms. The company, legal stock owner and Swedish export authority approve. Other licence owners decide their own rights."
