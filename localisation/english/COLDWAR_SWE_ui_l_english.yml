 COLDWAR_SWE_UI_NATIVE_COMPANY_ORDER_RETAIL_FINANCE:0 "IKEA setup: USD [?COLDWAR_SWE_order_retail_setup_millions|2] million. Your setup payment: zero.\nOpening: 12 months. Lease: 60 months after opening.\nOperating earnings: USD [?COLDWAR_SWE_order_retail_earnings_millions|2] million/week.\nRent to your treasury: USD [?COLDWAR_SWE_order_retail_rent_millions|2] million/week.\nLocal profit tax: USD [?COLDWAR_SWE_order_retail_tax_millions|2] million/week.\nIKEA keeps: USD [?COLDWAR_SWE_order_retail_retained_millions|2] million/week.\nProductivity contribution to earnings: [?COLDWAR_SWE_order_retail_productivity_bonus|%1].\nInfrastructure level [?COLDWAR_SWE_order_retail_infrastructure|0]: [?COLDWAR_SWE_order_retail_infrastructure_bonus|%1] to earnings.\nSelected region:\nOffice Sector construction speed [?COLDWAR_SWE_order_service_offices|%1].\nCivilian Industry construction speed [?COLDWAR_SWE_order_service_industry|%1].\nCash is settled weekly. Earnings and local tax are reviewed each month; rent stays fixed. An unprofitable store pauses its payments and local bonuses. One company slot remains occupied."
