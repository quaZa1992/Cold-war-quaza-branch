 COLDWAR_SWE_UI_NATIVE_PRODUCT_2_TIP:0 "Pick the regions that need buses or work vehicles. The price includes parts and training. These are civilian fleets, so no military equipment appears in your stockpile."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_2_WHO:0 "The buying public body and supplier approve. Each affected local authority accepts its own fleet and costs."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_3:0 "Merchant convoys"
 COLDWAR_SWE_UI_NATIVE_PRODUCT_3_BENEFIT:0 "Gain: Receive 10 convoy units for trade and sea transport, after the yard has built them or the legal owner releases spare ships."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_3_BURDEN:0 "Cost: Pay the full shipbuilding quote. The order uses real yard capacity and steel. Sweden keeps its agreed shipping reserve."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_3_NAME:0 "Order merchant convoys\nKockums: [?SWE.COLDWAR_SWE_company_kockums_capacity|0] open / [?SWE.COLDWAR_SWE_company_kockums_base_capacity|0] slots"
 COLDWAR_SWE_UI_NATIVE_PRODUCT_3_WHO:0 "The buyer accepts the price. The yard accepts a slot. The legal ship owner approves any existing-stock sale."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_4:0 "Factory maintenance"
 COLDWAR_SWE_UI_NATIVE_PRODUCT_4_BENEFIT:0 "Gain: Selected region: 36 months after delivery.\nCivilian factory construction: -2%.\nCivilian factory repair: +25%.\nInfrastructure repair: +15%."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_4_BURDEN:0 "Cost: Pay for the machines, visits and training. The supplier uses a support slot. Keeping the gain after three years needs renewed paid support or a funded local workshop."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_4_NAME:0 "Improve factory maintenance\nSKF: [?SWE.COLDWAR_SWE_company_skf_capacity|0] open / [?SWE.COLDWAR_SWE_company_skf_base_capacity|0] slots"
 COLDWAR_SWE_UI_NATIVE_PRODUCT_4_TIP:0 "Pick an industrial region. Better maintenance helps its normal growth for three years. It does not add a free factory."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_4_WHO:0 "The local factory owners and supplier approve the work. The host approves public spending or any special import terms."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_5:0 "Telephone networks"
 COLDWAR_SWE_UI_NATIVE_PRODUCT_5_BENEFIT:0 "Gain: Selected region: 60 months after delivery.\nInfrastructure construction: +5%.\nOffice construction: +12%."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_5_BURDEN:0 "Cost: Pay for switching equipment, installation, parts and training. The buyer keeps its network running and accepts the agreed technical standard."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_5_NAME:0 "Upgrade telephone services\nL. M. Ericsson: [?SWE.COLDWAR_SWE_company_ericsson_capacity|0] open / [?SWE.COLDWAR_SWE_company_ericsson_base_capacity|0] slots"
 COLDWAR_SWE_UI_NATIVE_PRODUCT_5_TIP:0 "Choose where to improve telephone links. The company installs a system it can actually build and trains local staff. You keep control of your own network."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_5_WHO:0 "The host telephone operator and Ericsson agree on the system. The host approves public procurement, access and any local assembly."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_6:0 "Power engineering"
 COLDWAR_SWE_UI_NATIVE_PRODUCT_6_BENEFIT:0 "Gain: Build one real fossil-fuel power plant in a chosen eligible region. It supplies power through the existing MD energy system."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_6_BURDEN:0 "Cost: Pay the full normal plant cost and the agreed engineering fee. Building takes time. The host must supply fuel, workers and running costs."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_6_NAME:0 "Build a power plant with Swedish engineering\nASEA: [?SWE.COLDWAR_SWE_company_asea_capacity|0] open / [?SWE.COLDWAR_SWE_company_asea_base_capacity|0] slots"
 COLDWAR_SWE_UI_NATIVE_PRODUCT_6_TIP:0 "Pick a suitable site and see the full price. The plant takes time to build and needs fuel afterwards. Buying engineering does not give Sweden control of the plant."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_6_WHO:0 "The host utility and companies agree the contract. The host approves the site, fuel plan and any public finance."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_7:0 "IKEA and suppliers"
 COLDWAR_SWE_UI_NATIVE_PRODUCT_7_BENEFIT:0 "Gain: Agree to a store lease, supplier support or furniture services. The selected terms show the local effects and duration. No factory or office is created."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_7_BURDEN:0 "Cost: IKEA funds a store lease. Supplier and service projects use the saved shares in their quote. Choose project terms and a region in Decisions before asking."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_7_NAME:0 "Invite IKEA and local furniture suppliers\nIKEA: [?SWE.COLDWAR_SWE_company_ikea_capacity|0] open / [?SWE.COLDWAR_SWE_company_ikea_base_capacity|0] slots"
 COLDWAR_SWE_UI_NATIVE_PRODUCT_7_TIP:0 "Ask IKEA to consider your country. Choose the land, local buying and worker rules you are willing to offer. IKEA may say no. An invitation spends nothing."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_7_WHO:0 "IKEA chooses whether to invest. The host and local authority approve the site and rules. Local firms choose whether to sign supply contracts."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_8:0 "Artillery and support"
 COLDWAR_SWE_UI_NATIVE_PRODUCT_8_BENEFIT:0 "Gain: Receive the eligible artillery in your saved quote, with its agreed support. Choose an order size below before asking."
 COLDWAR_SWE_UI_NATIVE_PRODUCT_8_BURDEN:0 "Cost: Pay for real weapons and support. Sweden gives up stock or a production slot and keeps its home reserve. Re-export needs permission where the contract requires it."
