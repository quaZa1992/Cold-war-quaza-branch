 COLDWAR_SWE_manufacturing_capacity_dockyards:0 "Company-operated Shipyards"
 COLDWAR_SWE_manufacturing_capacity_dockyards_desc:0 "A shipyard working for commercial customers carries obligations that extend far beyond launching the next hull. Skilled labour and long construction schedules tie up its berths and workshops. The government's use of that capacity depends on the agreements under which the yard operates."
