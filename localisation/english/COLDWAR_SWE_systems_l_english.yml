l_english:
# IMPERIA COLD WAR — Sami: Sweden 1970 and Nordic cooperation.
 COLDWAR_SWE_systems_enterprise:0 "Swedish Companies"
 COLDWAR_SWE_systems_enterprise_desc:0 "Review company accounts, ownership and the few orders waiting for a decision. Company cash and the Swedish treasury are separate. Provisional opening estimates are marked in each file."
 COLDWAR_SWE_systems_defence:0 "Swedish Defence Development"
 COLDWAR_SWE_systems_defence_desc:0 "Choose a practical goal, then fund five clear steps. Development improves a programme; real equipment still needs production, stock and a paid order."
 COLDWAR_SWE_systems_crown:0 "The Royal Household"
 COLDWAR_SWE_systems_crown_desc:0 "Public duties continue at a steady pace. The court cannot make laws or sign foreign agreements for the government. Optional requests wait without a deadline."
 COLDWAR_SWE_systems_local:0 "Local Authorities"
 COLDWAR_SWE_systems_local_desc:0 "Choose a county on the map, then its council or a municipality. Extra services are paid weekly; project funds are paid once. Funded autonomous councils can start their own eligible work. Already paid regional commitments still finish."
 COLDWAR_SWE_systems_ikea:0 "IKEA and Its Partners"
 COLDWAR_SWE_systems_ikea_desc:0 "IKEA chooses its company plans. Foreign stores and supplier projects need local permission and real investment. An invitation alone builds nothing."
 COLDWAR_SWE_systems_overview:0 "Swedish Public Life and Industry"
 COLDWAR_SWE_systems_overview_desc:0 "Review the main figures below, then open a section for details. Paid work continues each month; unanswered proposals can wait."
 COLDWAR_SWE_systems_inbox:0 "A Proposal from Sweden"
 COLDWAR_SWE_systems_inbox_desc:0 "Review an addressed proposal after opening Trade and services in Sweden's diplomacy screen. Agree or decline when ready. Replying spends no money and grants no access or equipment."
 COLDWAR_SWE_systems_trade:0 "Swedish Trade and Services"
 COLDWAR_SWE_systems_trade_desc:0 "Browse, ask for a price, and review only your own order. Opening this page costs nothing. Required permissions come before payment. An unanswered request simply waits."
 COLDWAR_SWE_company_volvo_source_status:0 "Provisional financial estimate"
 COLDWAR_SWE_company_volvo_value_basis:0 "Book-equity pricing proxy"
 COLDWAR_SWE_company_volvo_debt_basis:0 "Model loan principal estimate"
 COLDWAR_SWE_company_volvo_modifier:0 "Volvo"
 COLDWAR_SWE_company_volvo_modifier_desc:0 "From family cars to heavy lorries, Volvo sells the promise that Swedish machinery will get people and goods home safely. Export earnings sustain an expensive engineering and production base. A small home market leaves the company exposed when overseas buyers stop ordering."
 COLDWAR_SWE_company_volvo_borrow:0 "Offer a funded working-capital loan: Volvo"
 COLDWAR_SWE_company_volvo_borrow_desc:0 "A public advance transfers the same amount from the treasury into company cash and loan principal. The portfolio is limited to 1% of GDP, each company to 0.1%. The current weekly interest charge is shown in the accounts and settled weekly. The annual model rate is 5%; ordinary private financing remains outside this partial ledger."
 COLDWAR_SWE_company_volvo_borrow_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_company_volvo_borrow_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_company_volvo_repay:0 "Repay overdue interest and loan principal: Volvo"
 COLDWAR_SWE_company_volvo_repay_desc:0 "Company cash settles overdue interest first, then up to 0.01% GDP in principal. The treasury receives only the portion owed under its funded advances; payments to private lenders remain outside public funds."
 COLDWAR_SWE_company_volvo_repay_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_company_volvo_repay_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_company_volvo_distress_title:0 "Volvo: Liquidity Crisis"
 COLDWAR_SWE_company_volvo_distress_desc:0 "The company cannot meet its payment obligations from available cash. Parliament must decide whether to provide support, take public control with compensation, or permit an orderly closure."
 COLDWAR_SWE_company_volvo_bailout_option:0 "Provide unconditional liquidity support"
 COLDWAR_SWE_company_volvo_nationalise_option:0 "Require full public ownership and compensate the owners"
 COLDWAR_SWE_company_volvo_bankruptcy_option:0 "Permit bankruptcy and close outstanding commitments"
 COLDWAR_SWE_company_volvo_bailout_tt:0 "Company cash: +$$[?COLDWAR_SWE_company_volvo_rescue_charge|3] billion. Settle overdue interest. Ownership unchanged. Support review: 6 months."
 COLDWAR_SWE_company_volvo_nationalise_tt:0 "Company cash: +$$[?COLDWAR_SWE_company_volvo_rescue_charge|3] billion. Compensation to owners: $$[?COLDWAR_SWE_company_volvo_nationalisation_compensation|3] billion. Public ownership: 100%. Settle overdue interest; existing principal remains due. Support review: 6 months."
 COLDWAR_SWE_company_volvo_bankruptcy_tt:0 "Close the company and its unfinished commitments. Return unused customer escrow under the contract terms. Release its reserved civilian-factory use. Company strengths end; outstanding public credit is written off and retained on the closed account."
