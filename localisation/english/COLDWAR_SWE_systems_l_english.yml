 COLDWAR_SWE_systems_defence_modifier:0 "Funded Swedish Defence Programmes"
 COLDWAR_SWE_systems_defence_modifier_desc:0 "Swedish defence development begins with the conditions in which the equipment will actually serve. Designers, crews and workshops bring different knowledge to the same programme. Keeping them involved helps preserve useful strengths while exposing the demands each design places on its users."
 COLDWAR_SWE_company_volvo_stake:0 "Propose a public stake: Volvo"
 COLDWAR_SWE_company_volvo_stake_desc:0 "Offer to buy the selected percentage from existing owners, up to the unsold share. The price is that share of the stated book-equity value, not a quoted stock-market price. The treasury pays the sellers; company cash does not increase. Public enterprises require incorporation before their capital can be sold as shares."
 COLDWAR_SWE_company_volvo_stake_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_company_volvo_stake_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_company_volvo_sale:0 "Offer a public stake to private investors: Volvo"
 COLDWAR_SWE_company_volvo_sale_desc:0 "Approve the sale of the selected percentage of Sweden’s own holding to domestic private investors, up to the stake Sweden owns. The payment is the stated share of book equity, not a verified market quote. A saved offer fixes its percentage and price. The treasury receives the sale proceeds; company cash is unchanged."
 COLDWAR_SWE_company_volvo_sale_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_company_volvo_sale_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_company_volvo_coinvest:0 "Offer matching investment: Volvo"
 COLDWAR_SWE_company_volvo_coinvest_desc:0 "Each partner funds a capacity project at 1% of the stated company value. The company and treasury each pay once. Completion adds one company contract slot within the six-slot ceiling. Existing national factory and office counts do not increase."
 COLDWAR_SWE_company_volvo_coinvest_requirements:0 "A working contract product, a solvent company and room below the six-slot ceiling are required. The quoted matching amount is charged only when both partners can fund it."
 COLDWAR_SWE_company_volvo_coinvest_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_company_volvo_dividend:0 "Propose an earned dividend: Volvo"
 COLDWAR_SWE_company_volvo_dividend_desc:0 "Distribute half of positive retained profit from available company cash. Sweden receives its ownership share; the remainder goes to private owners. A private board currently funding product research retains its profits. Public owners with majority control can direct the distribution."
 COLDWAR_SWE_company_volvo_dividend_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_company_volvo_dividend_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
