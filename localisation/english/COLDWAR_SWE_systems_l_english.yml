 COLDWAR_SWE_trade_gun_quantity_96_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_trade_gun_quantity_96_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_trade_request_utility_trucks:0 "Buy military utility vehicles"
 COLDWAR_SWE_trade_request_utility_trucks_desc:0 "Choose the number of vehicles you want. Nothing is charged until you accept a price. The order waits if Sweden has no spare stock or production space.\n\nYour military stockpile receives the agreed number of real utility vehicles. They can equip units or carry supplies. There is no extra supply bonus for the same vehicles.\n\nPay the agreed price. Sweden gives up real vehicles or reserves a funded production order; home deliveries may have to wait."
 COLDWAR_SWE_trade_request_utility_trucks_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_trade_request_utility_trucks_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_trade_request_civil_fleet:0 "Equip a public vehicle fleet"
 COLDWAR_SWE_trade_request_civil_fleet_desc:0 "Pick the regions that need buses or work vehicles. The price includes parts and training. These are civilian fleets, so no military equipment appears in your stockpile.\n\nSelected region, 36 months after delivery:\nInfrastructure construction: +12%.\nOne company order slot stays committed for this term. Agreed local limits apply to overlapping contracts.\n\nPay the vehicle and support quote. The fleet needs fuel, trained staff and parts. Continuing the support needs a new paid term."
 COLDWAR_SWE_trade_request_civil_fleet_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_trade_request_civil_fleet_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_trade_request_merchant_ships:0 "Order merchant convoys"
 COLDWAR_SWE_trade_request_merchant_ships_desc:0 "These are merchant convoy units for trade and transport. Ask for a price and a delivery date. They are not escorts or other warships.\n\nYour convoy reserve gains the agreed number of ships. The seller loses the same number. You can use them for trade or sea transport; they are not warships.\n\nPay the full shipbuilding quote. The order uses real yard capacity and steel. Sweden keeps its agreed shipping reserve.\n\nMerchant convoy sales are currently unavailable: stock debit and buyer credit still need a game test."
 COLDWAR_SWE_trade_request_merchant_ships_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_trade_request_merchant_ships_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_trade_request_workshop_support:0 "Improve factory maintenance"
 COLDWAR_SWE_trade_request_workshop_support_desc:0 "Pick an industrial region. Better maintenance helps its normal growth for three years. It does not add a free factory.\n\nSelected region, 36 months after delivery:\nCivilian factory construction: -2%.\nCivilian factory repair: +25%.\nInfrastructure repair: +15%.\nOne company order slot stays committed for this term. Agreed local limits apply to overlapping contracts.\n\nPay for the machines, visits and training. The supplier uses a support slot. Keeping the gain after three years needs renewed paid support or a funded local workshop."
 COLDWAR_SWE_trade_request_workshop_support_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_trade_request_workshop_support_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_trade_request_telephone_network:0 "Upgrade telephone services"
 COLDWAR_SWE_trade_request_telephone_network_desc:0 "Choose where to improve telephone links. The company installs a system it can actually build and trains local staff. You keep control of your own network.\n\nSelected region, 60 months after delivery:\nInfrastructure construction: +5%.\nOffice construction: +12%.\nOne company order slot stays committed for this term. Agreed local limits apply to overlapping contracts.\n\nPay for switching equipment, installation, parts and training. The buyer keeps its network running and accepts the agreed technical standard."
 COLDWAR_SWE_trade_request_telephone_network_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_trade_request_telephone_network_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_trade_request_power_project:0 "Build a power plant with Swedish engineering"
 COLDWAR_SWE_trade_request_power_project_desc:0 "Pick a suitable site and see the full price. The plant takes time to build and needs fuel afterwards. Buying engineering does not give Sweden control of the plant.\n\nOne fossil-fuel power plant opens in the agreed region when construction finishes. It supplies power and uses fuel and workers through the normal energy system.\n\nPay the full normal plant cost and the agreed engineering fee. Building takes time. The host must supply fuel, workers and running costs."
 COLDWAR_SWE_trade_request_power_project_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_trade_request_power_project_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_trade_request_ikea_host:0 "Invite IKEA and local furniture suppliers"
 COLDWAR_SWE_trade_request_ikea_host_desc:0 "Ask IKEA to consider your country. Choose the land, local buying and worker rules you are willing to offer. IKEA may say no. An invitation spends nothing.\n\nChoose a store lease, a local production agreement or a smaller service project. Store and supplier terms have different benefits and burdens in the named region.\n\nIKEA pays for its store and stock. The host pays only for any land, roads or training it chooses to fund. Imports compete with local shops; local purchasing rules cost more but give suppliers a larger share."
 COLDWAR_SWE_trade_request_ikea_host_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_trade_request_ikea_host_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_trade_request_land_hardware:0 "Buy artillery and its support package"
 COLDWAR_SWE_trade_request_land_hardware_desc:0 "Ask for a researched gun and a support plan. You receive actual equipment only after both sides approve and funds and stock are ready.\n\nYour stockpile receives the agreed number of real artillery pieces. Paid training and support help you use them, but buying guns adds no extra permanent combat bonus.\n\nPay for real weapons and support. Sweden gives up stock or a production slot and keeps its home reserve. Re-export needs permission where the contract requires it."
 COLDWAR_SWE_trade_request_land_hardware_requirements:0 "The current plan, required funds and permissions must be ready. See the description for the cost and the next step."
 COLDWAR_SWE_trade_request_land_hardware_result:0 "Carry out the choice described above. The panel updates; funded work continues at the monthly review."
 COLDWAR_SWE_systems_paid_service_modifier:0 "Swedish Company Agreements"
 COLDWAR_SWE_systems_paid_service_modifier_desc:0 "Swedish company agreements bring vehicles, communications, maintenance or household goods into the local economy. They can support productive work and useful services while competing for sites, staff and customers. The relationship remains worthwhile when both the supplier and its local partners can meet their commitments."
