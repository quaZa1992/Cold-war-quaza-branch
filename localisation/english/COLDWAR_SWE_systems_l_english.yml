 COLDWAR_SWE_facility_learning_modifier:0 "Swedish Industrial Training"
 COLDWAR_SWE_facility_learning_modifier_desc:0 "An operating Swedish company brings technicians, production habits and problems that local workers can learn to solve. Daily cooperation can spread knowledge more effectively than a brief overseas visit. The connection depends on a real workplace and people willing to share their experience."
 COLDWAR_SWE_facility_local_learning_modifier:0 "Swedish Factory Partnership"
 COLDWAR_SWE_facility_local_learning_modifier_desc:0 "Local industry gains access to Swedish production experience through a working factory or shipyard. Engineers and employees learn through maintenance, training and the routine demands of delivering orders. The host also accepts the responsibilities attached to putting industrial capacity under company management."
 COLDWAR_SWE_facility_draft_terms:0 "Factory or dockyard: 1. Sale or construction price: $$[?COLDWAR_SWE_facility_quote_price|5] billion. Lease income: $$[?COLDWAR_SWE_facility_quote_weekly|5] billion/week ($$[?COLDWAR_SWE_facility_quote_annual|5] billion/year). Construction: 18 months. The building stays on the map and adds to your GDP; the company controls its production."
 COLDWAR_SWE_facility_reply_1:0 "The company accepted the saved factory proposal."
 COLDWAR_SWE_facility_reply_2:0 "The company declined: it has closed or cannot cover the purchase or construction price, or three months of lease payments."
 COLDWAR_SWE_facility_reply_3:0 "The company declined: the selected site or its available buildings changed."
 COLDWAR_SWE_facility_reply_4:0 "The company declined: all 24 company project and asset slots are occupied."
 COLDWAR_SWE_facility_reply_5:0 "The proposal closed: war, an embargo, sanctions or stability below 25% prevents this business."
 COLDWAR_SWE_facility_reply_6:0 "The Swedish government declined release of this factory proposal."
 COLDWAR_SWE_facility_lease_result:0 "Lease one existing factory or dockyard for ten years. Receive the quoted weekly rent while the company can pay. Research speed: +0.25% per operating facility, up to +1%. Selected region: positive productivity growth +2.5% per facility, up to +10%. The factory or dockyard is unavailable to your government during the lease."
 COLDWAR_SWE_facility_sale_result:0 "Sell one existing factory or dockyard to the company for the quoted price. The building stays on your map and adds to your GDP, but its production belongs to the company. Operating facilities provide the same bounded training benefits as leases. You may later repurchase it at the then-current native building price."
 COLDWAR_SWE_facility_build_result:0 "Finance one company-owned factory or dockyard. Pay its full quoted native construction price once. Construction takes 18 months. The finished building and one matching slot are added to the selected region. The company controls its production; your country keeps its GDP contribution and bounded training benefits."
 COLDWAR_SWE_facility_company_build_result:0 "Invite the company to fund one factory or dockyard. If it accepts, the company pays the quoted construction price; your treasury pays nothing. Construction takes 18 months. The finished building and one matching slot are added to the selected region. The company controls production; your country keeps its GDP contribution and technical training benefits."
 COLDWAR_SWE_facility_choose_1:0 "Offer a factory or dockyard lease"
 COLDWAR_SWE_facility_choose_1_desc:0 "Choose a region, then a company product. Review the price and weekly terms before sending the proposal. No money moves when this quote opens. $COLDWAR_SWE_facility_lease_result$"
 COLDWAR_SWE_facility_choose_1_requirements:0 "Choose an owned, controlled region and a company. Resolve or withdraw any pending site application first."
 COLDWAR_SWE_facility_choose_1_result:0 "Open the quote for review. No money is paid until the company accepts the agreed terms."
