 COLDWAR_SWE_ikea_host_private_site:0 "IKEA Store Lease"
 COLDWAR_SWE_ikea_host_private_site_desc:0 "Selected region, 60 months after delivery:\nCivilian factory construction: -2.5%.\nOffice construction: +10%.\nOne operating IKEA store lease. Local retailers face new competition; commercial land is committed to the store.\nOne company order slot stays committed for this term. Agreed local limits apply to overlapping contracts.\n\nIKEA funds the store. Setup costs 1.577% of Sweden's current GDP. Weekly rent uses 3.418% of Sweden's current GDP per year, divided by 52. Opening takes 12 months. Your existing corporate tax rate applies to local profit after rent. Productivity and infrastructure affect earnings; the quote shows both contributions. Rent and profit tax are paid weekly. Choosing these terms charges nothing."
