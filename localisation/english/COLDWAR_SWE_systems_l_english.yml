 COLDWAR_SWE_local_project_programme_local_capital_0_1:0 "Build a Local Service Office"
 COLDWAR_SWE_local_project_programme_local_capital_0_1_desc:0 "Stockholm's growing suburbs and outlying communities need more than access to the capital's central institutions. A stronger local office network will give residents and businesses a practical point of contact as the county tries to keep its services abreast of urban growth."
 COLDWAR_SWE_local_project_programme_local_capital_0_2:0 "Improve Local Transport Links"
 COLDWAR_SWE_local_project_programme_local_capital_0_2_desc:0 "In Stockholm County, a short distance on the map can still mean a difficult journey between homes, workplaces and services. Better local connections will help the expanding urban area work together while recognising the different needs of its mainland and island communities."
 COLDWAR_SWE_local_project_programme_local_capital_1_1:0 "Keep Services Close to Residents"
 COLDWAR_SWE_local_project_programme_local_capital_1_1_desc:0 "Stockholm's public services must cope with rapid growth and a population spread beyond the inner city. Better organisation will help existing offices handle that demand, so that a new address does not leave a household far from the help it needs."
 COLDWAR_SWE_local_project_programme_local_capital_1_2:0 "Build a Shared Specialist Office"
 COLDWAR_SWE_local_project_programme_local_capital_1_2_desc:0 "Stockholm's growing suburbs and outlying communities need more than access to the capital's central institutions. A stronger local office network will give residents and businesses a practical point of contact as the county tries to keep its services abreast of urban growth."
 COLDWAR_SWE_local_county_stockholm:0 "Stockholm County"
 COLDWAR_SWE_local_county_uppsala:0 "Uppsala County"
 COLDWAR_SWE_local_county_sodermanland:0 "Södermanland County"
 COLDWAR_SWE_local_project_mjardevi_support:0 "Provide Services at Mjardevi"
 COLDWAR_SWE_local_project_mjardevi_support_desc:0 "Mjärdevi is growing beside Linköping University as a place where engineers, researchers and young firms can work near one another. Shared premises and access services will help them establish that connection without making the council the manager of every business on the site."
 COLDWAR_SWE_local_project_programme_local_county_0_1:0 "Build a Local Service Office"
 COLDWAR_SWE_local_project_programme_local_county_0_1_desc:0 "Östergötland's industrial towns and growing centres of study need skilled local support alongside their workshops and classrooms. Shared offices will give those services a firmer base while helping authorities meet needs that cross municipal boundaries."
 COLDWAR_SWE_local_project_programme_local_county_0_2:0 "Improve Local Transport Links"
 COLDWAR_SWE_local_project_programme_local_county_0_2_desc:0 "Linköping, Norrköping and Östergötland's smaller towns depend on journeys that connect homes, industry and public services. Better local links will help the county's different centres work together without requiring every useful activity to gather in one place."
 COLDWAR_SWE_local_project_programme_local_county_1_1:0 "Keep Care Close to Residents"
 COLDWAR_SWE_local_project_programme_local_county_1_1_desc:0 "Reliable care and public services depend on how well Östergötland's institutions work together after the buildings have opened. Improving local organisation will help existing staff use their time and facilities more effectively while keeping residents connected to familiar services."
 COLDWAR_SWE_local_project_programme_local_county_1_2:0 "Concentrate Specialist Services"
 COLDWAR_SWE_local_project_programme_local_county_1_2_desc:0 "Östergötland's industrial towns and growing centres of study need skilled local support alongside their workshops and classrooms. Shared offices will give those services a firmer base while helping authorities meet needs that cross municipal boundaries."
 COLDWAR_SWE_local_county_ostergotland:0 "Östergötland County"
 COLDWAR_SWE_local_county_jonkoping:0 "Jönköping County"
 COLDWAR_SWE_local_county_kronoberg:0 "Kronoberg County"
 COLDWAR_SWE_local_project_berga_water:0 "Expand Berga's Water Capacity"
 COLDWAR_SWE_local_project_berga_water_desc:0 "Kalmar's growing districts need water pressure and storage that can keep pace with new homes. Expanding Berga's water capacity will support that everyday service while leaving the council responsible for the network that carries it to residents."
 COLDWAR_SWE_local_project_city_library:0 "Fit Out Kalmar's New Library"
 COLDWAR_SWE_local_project_city_library_desc:0 "A public library gives Kalmar a place to read, study and encounter ideas without needing a university appointment or a private collection. Fitting out the new premises will bring that service into daily use, with staff and upkeep needed long after the doors open."
 COLDWAR_SWE_local_project_volvo_worker_services:0 "Improve the Plant District's Services"
 COLDWAR_SWE_local_project_volvo_worker_services_desc:0 "Volvo's Kalmar plant is testing a different way of organising assembly work. The neighbourhood around it also needs ordinary access and services, so that the city's investment supports the people who work there as well as the factory's production schedule."
 COLDWAR_SWE_local_county_kalmar:0 "Kalmar County"
 COLDWAR_SWE_local_project_programme_local_island_0_1:0 "Build a Local Service Office"
 COLDWAR_SWE_local_project_programme_local_island_0_1_desc:0 "On Gotland, specialist help concentrated in Visby can be difficult to reach from smaller communities. A better-supported office network will give island residents and enterprises a firmer local point of contact while making careful use of a limited pool of trained staff."
 COLDWAR_SWE_local_project_programme_local_island_0_2:0 "Improve Local Transport Links"
 COLDWAR_SWE_local_project_programme_local_island_0_2_desc:0 "Gotland's roads connect scattered settlements with Visby, the ports and services that cannot be provided in every village. Improving those links will help the island's ordinary working life as well as the journeys and deliveries brought by the summer season."
 COLDWAR_SWE_local_project_programme_local_island_1_1:0 "Keep Services Close to Residents"
 COLDWAR_SWE_local_project_programme_local_island_1_1_desc:0 "Gotland cannot staff every public service as though it were a mainland city. Better coordination will help the island's existing offices share expertise and serve outlying communities while preserving the local knowledge that a distant central desk would struggle to replace."
 COLDWAR_SWE_local_project_programme_local_island_1_2:0 "Build a Shared Specialist Office"
 COLDWAR_SWE_local_project_programme_local_island_1_2_desc:0 "On Gotland, specialist help concentrated in Visby can be difficult to reach from smaller communities. A better-supported office network will give island residents and enterprises a firmer local point of contact while making careful use of a limited pool of trained staff."
 COLDWAR_SWE_local_county_gotland:0 "Gotland County"
 COLDWAR_SWE_local_project_separate_sewers:0 "Separate Rainwater and Sewage"
 COLDWAR_SWE_local_project_separate_sewers_desc:0 "Heavy rain can overload a network that sends stormwater and household sewage through the same pipes. Separating those flows will make local sanitation more dependable while committing the authority to maintain a more extensive underground system."
 COLDWAR_SWE_local_project_blekinge_college_support:0 "Prepare Shared Teaching Premises"
 COLDWAR_SWE_local_project_blekinge_college_support_desc:0 "Blekinge's growing higher education needs rooms, equipment and local services where students and teachers can work. Shared teaching premises will support that development while the institutions and national authorities retain responsibility for the courses themselves."
 COLDWAR_SWE_local_project_soft_center:0 "Improve Access to Soft Center"
 COLDWAR_SWE_local_project_soft_center_desc:0 "Soft Center brings software work, businesses and teaching into closer contact in Ronneby. Better local access and shared services will help that emerging centre function as a workplace, without asking the council to direct the technical work of its tenants."
 COLDWAR_SWE_local_county_blekinge:0 "Blekinge County"
 COLDWAR_SWE_local_county_kristianstad:0 "Kristianstad County"
 COLDWAR_SWE_local_project_ideon:0 "Service Ideon's First Sites"
 COLDWAR_SWE_local_project_ideon_desc:0 "Ideon is taking shape near Lund University, connecting research and young technology firms on land once used for farming. Servicing its first sites will give that partnership somewhere to work while the council and its partners discover how much the new centre can support."
 COLDWAR_SWE_local_project_programme_local_south_0_1:0 "Build a Local Service Office"
 COLDWAR_SWE_local_project_programme_local_south_0_1_desc:0 "Malmöhus brings industrial ports, university work and productive farming into a relatively small county. Well-placed offices will help residents and enterprises draw on those different strengths while giving local authorities a dependable base for their own services."
 COLDWAR_SWE_local_project_programme_local_south_0_2:0 "Improve Local Transport Links"
 COLDWAR_SWE_local_project_programme_local_south_0_2_desc:0 "Journeys between Malmöhus's towns, ports and farming districts carry both workers and the products of their work. Improving local links will make those connections more dependable without assuming that every community's future lies in the largest city."
 COLDWAR_SWE_local_project_programme_local_south_1_1:0 "Keep Services Close to Residents"
 COLDWAR_SWE_local_project_programme_local_south_1_1_desc:0 "Malmöhus's closely connected towns still have different local needs and institutions. Cooperation between their service offices will help residents find the right assistance and allow existing staff to spend more of their time on the work itself."
 COLDWAR_SWE_local_project_programme_local_south_1_2:0 "Build a Shared Specialist Office"
 COLDWAR_SWE_local_project_programme_local_south_1_2_desc:0 "Malmöhus brings industrial ports, university work and productive farming into a relatively small county. Well-placed offices will help residents and enterprises draw on those different strengths while giving local authorities a dependable base for their own services."
 COLDWAR_SWE_local_county_malmohus:0 "Malmöhus County"
 COLDWAR_SWE_local_county_halland:0 "Halland County"
 COLDWAR_SWE_local_project_programme_local_west_0_1:0 "Build a Local Service Office"
 COLDWAR_SWE_local_project_programme_local_west_0_1_desc:0 "Göteborg's industrial centre and the communities along the Bohuslän coast do not all need the same services in the same place. A shared office network will bring skilled support closer to local needs without asking every small authority to maintain a full specialist staff."
 COLDWAR_SWE_local_project_programme_local_west_0_2:0 "Improve Local Transport Links"
 COLDWAR_SWE_local_project_programme_local_west_0_2_desc:0 "Port traffic, industrial deliveries and ordinary journeys meet along a coast of narrow passages and scattered settlements. Better connections will help Göteborg and Bohuslän share their economic opportunities while keeping smaller communities linked to essential services."
 COLDWAR_SWE_local_project_programme_local_west_1_1:0 "Keep Services Close to Residents"
 COLDWAR_SWE_local_project_programme_local_west_1_1_desc:0 "Maintaining dependable services along the Bohuslän coast takes cooperation between larger centres and smaller communities. Shared working methods will help local staff make better use of the facilities already available, with less time lost between separate offices."
 COLDWAR_SWE_local_project_programme_local_west_1_2:0 "Build a Shared Specialist Office"
 COLDWAR_SWE_local_project_programme_local_west_1_2_desc:0 "Göteborg's industrial centre and the communities along the Bohuslän coast do not all need the same services in the same place. A shared office network will bring skilled support closer to local needs without asking every small authority to maintain a full specialist staff."
 COLDWAR_SWE_local_county_goteborg_bohus:0 "Göteborg and Bohus County"
 COLDWAR_SWE_local_county_alvsborg:0 "Älvsborg County"
 COLDWAR_SWE_local_county_skaraborg:0 "Skaraborg County"
 COLDWAR_SWE_local_county_varmland:0 "Värmland County"
 COLDWAR_SWE_local_county_orebro:0 "Örebro County"
 COLDWAR_SWE_local_county_vastmanland:0 "Västmanland County"
 COLDWAR_SWE_local_county_kopparberg:0 "Kopparberg County"
 COLDWAR_SWE_local_project_programme_local_north_0_1:0 "Build a Local Service Office"
 COLDWAR_SWE_local_project_programme_local_north_0_1_desc:0 "Gävleborg's industrial coast and inland communities need places where residents and employers can reach skilled help. Shared offices will give local services a dependable base, while the county must find the staff to keep them useful beyond the larger towns."
 COLDWAR_SWE_local_project_programme_local_north_0_2:0 "Improve Local Transport Links"
 COLDWAR_SWE_local_project_programme_local_north_0_2_desc:0 "Timber, manufactured goods and everyday journeys travel between Gävleborg's coastal towns and inland settlements. Improving the links between them will help people reach work and services without treating every smaller community as a distant outpost."
 COLDWAR_SWE_local_project_programme_local_north_1_1:0 "Keep Services Close to Residents"
 COLDWAR_SWE_local_project_programme_local_north_1_1_desc:0 "A service based in Gävle is not automatically within easy reach of a family elsewhere in the county. Better coordination and local working methods will help existing staff serve more residents without requiring every journey to end at a central office."
 COLDWAR_SWE_local_project_programme_local_north_1_2:0 "Build a Shared Specialist Office"
 COLDWAR_SWE_local_project_programme_local_north_1_2_desc:0 "Gävleborg's industrial coast and inland communities need places where residents and employers can reach skilled help. Shared offices will give local services a dependable base, while the county must find the staff to keep them useful beyond the larger towns."
 COLDWAR_SWE_local_county_gavleborg:0 "Gävleborg County"
 COLDWAR_SWE_local_county_vasternorrland:0 "Västernorrland County"
 COLDWAR_SWE_local_county_jamtland:0 "Jämtland County"
 COLDWAR_SWE_local_project_campus_services:0 "Improve Umea's Student Services"
 COLDWAR_SWE_local_project_campus_services_desc:0 "Umeå's university draws students, staff and specialised work into the city around its campus. Better local services will help the growing academic community find its place in ordinary urban life while leaving teaching and medical responsibilities with their own institutions."
 COLDWAR_SWE_local_county_vasterbotten:0 "Västerbotten County"
 COLDWAR_SWE_local_project_steel_expansion_services:0 "Stage the Steel Town's Service Works"
 COLDWAR_SWE_local_project_steel_expansion_services_desc:0 "Luleå's industrial ambitions also require roads, water and services for the people expected to work there. Staging those works carefully will help the town support development without committing every local resource before the wider steel programme's future is settled."
 COLDWAR_SWE_local_county_norrbotten:0 "Norrbotten County"
 COLDWAR_SWE_local_project_kulturhuset:0 "Open Kulturhuset's Public Floors"
 COLDWAR_SWE_local_project_kulturhuset_desc:0 "Kulturhuset gives central Stockholm a public home for reading, exhibitions and cultural debate. Its early life also shares space with temporary parliamentary accommodation; opening more of the public floors will bring the city closer to the cultural meeting place the building was intended to become."
 COLDWAR_SWE_local_project_blue_line_access:0 "Improve Blue Line Access"
 COLDWAR_SWE_local_project_blue_line_access_desc:0 "The Metro's Blue Line connects Stockholm's expanding outer districts to the rest of the city. Better access around its stations will help residents turn that connection into a useful everyday journey to work, education and services."
 COLDWAR_SWE_local_completed_kulturhuset:0 "Open Kulturhuset's Public Floors"
 COLDWAR_SWE_local_completed_kulturhuset_desc:0 "Kulturhuset gives central Stockholm public space for reading, exhibitions and cultural life. Bringing its public floors into full use connects the national debate about culture to a building people can enter. The city inherits the everyday work of staffing and maintaining that welcome."
 COLDWAR_SWE_local_completed_blue_line_access:0 "Improve Blue Line Access"
 COLDWAR_SWE_local_completed_blue_line_access_desc:0 "The Blue Line connects growing housing districts to a wider Stockholm. Useful stations also need workable access from the streets and neighbourhoods around them. Local improvements help turn a route on the transport map into a dependable part of daily travel."
 COLDWAR_SWE_local_municipality_stockholm:0 "Stockholm"
 COLDWAR_SWE_local_project_gottsunda_centre:0 "Fit Out Gottsunda's Local Services"
 COLDWAR_SWE_local_project_gottsunda_centre_desc:0 "Gottsunda's new homes need places where residents can shop, meet and find ordinary services nearby. Fitting out the centre will help the district acquire a civic life around its housing, with continuing work needed to keep those facilities welcoming and useful."
 COLDWAR_SWE_local_completed_gottsunda_centre:0 "Fit Out Gottsunda's Local Services"
 COLDWAR_SWE_local_completed_gottsunda_centre_desc:0 "Gottsunda's growing neighbourhoods need places to shop, meet and find ordinary local services. Fitting out the centre gives the housing expansion a more complete civic life. Keeping those facilities useful will remain a responsibility for the municipality and their operators."
 COLDWAR_SWE_local_municipality_uppsala:0 "Uppsala"
 COLDWAR_SWE_local_project_rosengard_services:0 "Open Rosengard's Public Services"
 COLDWAR_SWE_local_project_rosengard_services_desc:0 "Rosengård's rapid housing growth has left residents waiting for some of the shops and public services their new neighbourhood needs. Opening local facilities will bring more of everyday life within reach while leaving the municipality to keep them staffed and accessible."
 COLDWAR_SWE_local_completed_rosengard_services:0 "Open Rosengard's Public Services"
 COLDWAR_SWE_local_completed_rosengard_services_desc:0 "Rosengård's homes have grown faster than some of the services around them. Public facilities can help make the district a place whose daily needs are met close to home. Their value depends on accessible provision and people who remain available to run it."
 COLDWAR_SWE_local_municipality_malmo:0 "Malmö"
 COLDWAR_SWE_local_project_ryaverket:0 "Connect the Rya Sewage Works"
 COLDWAR_SWE_local_project_ryaverket_desc:0 "Göteborg's households and industries send their wastewater into a shared regional system. Connecting them properly to the Rya treatment works will make the expanding city easier to serve and reduce what its growth leaves for the surrounding waters to absorb."
 COLDWAR_SWE_local_project_angered_centre:0 "Fit Out Angered's Service Core"
 COLDWAR_SWE_local_project_angered_centre_desc:0 "Angered's centre must serve the district that is actually growing around it, even as the original expansion plans are revised. A service core that can develop in stages will give residents useful facilities now without requiring every part of the larger scheme to arrive at once."
 COLDWAR_SWE_local_completed_ryaverket:0 "Connect the Rya Sewage Works"
 COLDWAR_SWE_local_completed_ryaverket_desc:0 "The Rya works connect the growth of Göteborg's urban region to the treatment of what its households and industries send downstream. Better sewer connections make that shared responsibility more practical. The system still needs maintenance and attention as treatment demands rise."
 COLDWAR_SWE_local_completed_angered_centre:0 "Fit Out Angered's Service Core"
 COLDWAR_SWE_local_completed_angered_centre_desc:0 "Angered needs a service centre that can serve a changing district without waiting for every part of the original expansion plan. Facilities arranged for gradual development give the municipality room to respond. The centre must remain useful to residents as well as convincing on a planning drawing."
 COLDWAR_SWE_local_municipality_goteborg:0 "Göteborg"
 COLDWAR_SWE_local_project_backby_services:0 "Complete Bäckby Neighbourhood Services"
 COLDWAR_SWE_local_project_backby_services_desc:0 "Bäckby's growing neighbourhoods need more than completed homes. Shared schools, reading rooms and local services will give residents places to meet their daily needs, while the council takes on the steady work of staffing and maintaining them."
 COLDWAR_SWE_local_project_vasteras_heat_connections:0 "Extend Västerås District Heating Connections"
 COLDWAR_SWE_local_project_vasteras_heat_connections_desc:0 "New homes in Västerås need connections to the municipal district-heating system. Extending that network will give more households dependable winter heat while leaving fuel supply and maintenance as continuing duties behind the convenience of a warm flat."
 COLDWAR_SWE_local_completed_backby_services:0 "Complete Bäckby Neighbourhood Services"
 COLDWAR_SWE_local_completed_backby_services_desc:0 "Bäckby's neighbourhood services bring schools, reading and local provision within reach of its growing households. Shared facilities give the district places where daily life can meet. The council must keep them staffed and cared for after construction ends."
 COLDWAR_SWE_local_completed_vasteras_heat_connections:0 "Extend Västerås District Heating Connections"
 COLDWAR_SWE_local_completed_vasteras_heat_connections_desc:0 "Västerås's district-heating network links new homes to a shared municipal energy system. Extending the connections makes dependable winter heat available to more households. Fuel supply and maintenance remain continuing responsibilities behind the convenience of a warm flat."
 COLDWAR_SWE_local_municipality_vasteras:0 "Västerås"
 COLDWAR_SWE_local_funded_services_modifier:0 "Additional Local Services"
 COLDWAR_SWE_local_funded_services_modifier_desc:0 "County and municipal services carry much of the state's promise into everyday life. Dependable funding gives local authorities room to maintain staff, plan ahead and respond to their own communities. Local initiative works best when its responsibilities come with the means to carry them."
 COLDWAR_SWE_crown_civic_programme_modifier:0 "Fund Ceremonial and Civic Access"
 COLDWAR_SWE_crown_civic_programme_modifier_desc:0 "Royal ceremonies and public receptions give Sweden a familiar representative institution beyond the changing cabinet. Gustaf VI Adolf's parliamentary example leaves political decisions with elected ministers. Public access keeps the household visible as a national institution and gives it ordinary administrative responsibilities of its own."
 COLDWAR_SWE_crown_civic_programme:0 "Fund Ceremonial and Civic Access"
 COLDWAR_SWE_crown_civic_programme_desc:0 "Support public ceremonies, civic receptions and access to the representative household. Gustaf VI Adolf’s parliamentary example leaves elected ministers responsible for policy; the appropriation pays for public access and its administration."
 COLDWAR_SWE_crown_civic_programme_requirements:0 "Treasury ≥ 0.05% of GDP. No optional royal programme is active. This programme can be funded once per 365 days."
 COLDWAR_SWE_crown_science_programme_modifier:0 "Support Cultural and Scholarly Patronage"
 COLDWAR_SWE_crown_science_programme_modifier_desc:0 "Gustaf VI Adolf's interests in archaeology, art and scholarship give royal patronage a distinctive Swedish tradition. Supporting collections and scholarly meetings can bring institutions and visitors together. The useful work belongs to the researchers, curators and public services that sustain it."
 COLDWAR_SWE_crown_science_programme:0 "Support Cultural and Scholarly Patronage"
 COLDWAR_SWE_crown_science_programme_desc:0 "Fund scholarly meetings, collections work and public cultural access under royal patronage. Gustaf VI Adolf’s interests in archaeology and art provide a precedent for supporting institutions and exchanges, with an administrative commitment to sustain them."
 COLDWAR_SWE_crown_science_programme_requirements:0 "Treasury ≥ 0.1% of GDP. No optional royal programme is active. This programme can be funded once per 365 days."
 COLDWAR_SWE_crown_cadet_programme_modifier:0 "Support Voluntary Cadet and Veterans Associations"
 COLDWAR_SWE_crown_cadet_programme_modifier_desc:0 "Ceremonial ties to veterans and voluntary service associations connect the household to people who have served the country. Carl Gustaf's military education gives those contacts a personal foundation. The programme supports collective welfare and association life within the Crown's representative role."
 COLDWAR_SWE_crown_cadet_programme:0 "Support Voluntary Cadet and Veterans Associations"
 COLDWAR_SWE_crown_cadet_programme_desc:0 "Support voluntary associations, veterans’ gatherings and ceremonial contact with service personnel. Carl Gustaf’s naval and tri-service education was already completed before 1970. The programme funds collective support and welfare work rather than assigning a royal person another period of compulsory service."
 COLDWAR_SWE_crown_cadet_programme_requirements:0 "Treasury ≥ 0.08% of GDP. No optional royal programme is active. This programme can be funded once per 365 days."
 COLDWAR_SWE_crown_choose_visit_partner:0 "Choose a Willing Partner for the Current Royal Visit"
 COLDWAR_SWE_crown_choose_visit_partner_desc:0 "The household’s current cultural exchange or representative visit needs a host. Open the regional selector, choose one named government and request its agreement. The visit remains part of the household’s existing programme and requires the host’s own reply."
 COLDWAR_SWE_crown_choose_visit_partner_requirements:0 "The current royal programme awaits a host’s consent and an invitation slot is available."
 COLDWAR_SWE_crown_choose_visit_partner_result:0 "Open the existing partner selector for this royal programme."
 COLDWAR_SWE_manufacturing_blocked_stability:0 "Orders are unavailable: stability is below 25%."
 COLDWAR_SWE_manufacturing_blocked_embargo:0 "Orders are unavailable: Sweden has imposed an embargo or economic or financial sanctions."
 COLDWAR_SWE_manufacturing_blocked_capacity:0 "The company needs an operating factory or dockyard, a free order slot and enough capacity to finish within ten years. Reduce the quantity if its order book is too full."
 COLDWAR_SWE_manufacturing_blocked_war:0 "Orders are unavailable while at war with Sweden."
 COLDWAR_SWE_manufacturing_quantity_help:0 "Enter any whole number from 1 to 99,999. Hold Ctrl + Alt while typing the digits, or click the keypad. Review the quote before paying. Opening a quote costs nothing."
 COLDWAR_SWE_manufacturing_quote_terms:0 "Quantity: [?COLDWAR_SWE_manufacturing_quote_quantity|0]. Price: USD [?COLDWAR_SWE_manufacturing_quote_price_millions|3] million. Bulk discount: [?COLDWAR_SWE_manufacturing_quote_discount|%0]. Delivery estimate in months: [?COLDWAR_SWE_manufacturing_quote_months|0]. Production starts after payment and any required Swedish release. A changed order book requires a fresh quote."
 COLDWAR_SWE_manufacturing_order_terms:0 "Order: [?COLDWAR_SWE_manufacturing_order_quantity|0]. Paid: USD [?COLDWAR_SWE_manufacturing_order_price_millions|3] million. Estimated months remaining: [?COLDWAR_SWE_manufacturing_order_months|0]. Cancellation returns the price of work not yet done. Work already completed is paid."
 COLDWAR_SWE_manufacturing_capacity_modifier:0 "Company-operated Industry"
 COLDWAR_SWE_manufacturing_capacity_modifier_desc:0 "Company workshops and shipyards remain part of the country's industrial landscape while serving their own customers and order books. Their output supports livelihoods and national production, even where ministers cannot assign the next job directly. Ownership and lease agreements decide who can use the capacity."
 COLDWAR_SWE_manufacturing_capacity_civs:0 "Company-operated Factories"
 COLDWAR_SWE_manufacturing_capacity_civs_desc:0 "A civilian factory serving a company order book is still a workplace in the national economy. Its owners must find customers, maintain equipment and keep the staff employed. Government access to its capacity follows the ownership and lease terms rather than a general production instruction."
