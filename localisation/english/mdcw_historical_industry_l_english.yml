l_english:
 mdcw_engineering_basics_1940:0 "Civil Works"
 mdcw_engineering_basics_1940_desc:0 "Standardized engineering practice improves construction speed by 2.5% and industrial repair speed by 5%."
 mdcw_tower_cranes_1949:0 "Tower Cranes"
 mdcw_tower_cranes_1949_desc:0 "Mobile tower cranes increase global construction speed by 2.5%."
 mdcw_ready_mixed_concrete_1950:0 "Ready-Mix"
 mdcw_ready_mixed_concrete_1950_desc:0 "Batch concrete production and coordinated delivery increase global construction speed by 5%."
 mdcw_hydraulic_earthmoving_1954:0 "Earthmoving"
 mdcw_hydraulic_earthmoving_1954_desc:0 "Hydraulic earthmoving equipment increases industrial infrastructure construction speed by 5%."
 mdcw_precast_construction_1960:0 "Precast Panels"
 mdcw_precast_construction_1960_desc:0 "Factory-made structural components increase global construction speed by 5% and industrial repair speed by 5%."
 mdcw_site_planning_1970:0 "Site Planning"
 mdcw_site_planning_1970_desc:0 "Integrated site planning and construction scheduling increase global construction speed by 7.5%."
 mdcw_resource_loaded_construction_1975:0 "Work Planning"
 mdcw_resource_loaded_construction_1975_desc:0 "Computer-supported scheduling and resource coordination increase global construction speed by 5%."
 mdcw_preventive_industrial_maintenance_1975:0 "Maintenance"
 mdcw_preventive_industrial_maintenance_1975_desc:0 "Planned maintenance increases industrial repair speed by 10%."
 mdcw_precision_machine_tools_1940:0 "Precision Machine Tools"
 mdcw_precision_machine_tools_1940_desc:0 "Precision machine tools reduce worker requirements in civilian factories, military factories and dockyards by 2%. Electricity consumption in civilian and military factories rises by 1%."
 mdcw_powered_machinery_1950:0 "Powered Machine Tools and Material Handling"
 mdcw_powered_machinery_1950_desc:0 "Powered machinery reduces worker requirements in civilian factories, military factories and dockyards by 3%. Electricity consumption in civilian and military factories rises by 1.5%."
 mdcw_numerical_control_1955:0 "Numerical Control Machine Tools"
 mdcw_numerical_control_1955_desc:0 "Numerical control reduces factory and dockyard worker requirements by 4%, raises civilian and military factory electricity consumption by 2%, and increases the production efficiency cap by 5%."
 mdcw_industrial_robotics_1961:0 "Industrial Robotics"
 mdcw_industrial_robotics_1961_desc:0 "Industrial robots reduce factory and dockyard worker requirements by 4%, while raising civilian and military factory electricity consumption by 2%."
 mdcw_factory_control_1970:0 "Programmable Factory Control"
 mdcw_factory_control_1970_desc:0 "Programmable control reduces factory and dockyard worker requirements by 2%, while raising civilian and military factory electricity consumption by 1%. Industrial Robotics and the required computing technology must be researched first."
 mdcw_computer_controlled_machine_tools_1975:0 "Computer-Controlled Machine Tools"
 mdcw_computer_controlled_machine_tools_1975_desc:0 "Computer-controlled machine tools raise the production efficiency cap by 5%. Requires Numerical Control and Computing 1."
 mdcw_flexible_manufacturing_1980:0 "Flexible Manufacturing and Direct Numerical Control"
 mdcw_flexible_manufacturing_1980_desc:0 "Flexible manufacturing and direct numerical control raise the production efficiency cap by 5%. Requires Computer-Controlled Machine Tools and Microprocessors."
 mdcw_regional_grid_1955:0 "Power Grids"
 mdcw_regional_grid_1955_desc:0 "Regional grid construction methods increase energy infrastructure construction speed by 10%. This does not generate electricity or unlock a power plant."
 mdcw_grid_dispatch_1965:0 "Grid Dispatch"
 mdcw_grid_dispatch_1965_desc:0 "Interconnected grid planning increases energy infrastructure construction speed by 10%. This does not generate electricity or unlock a power plant."
 mdcw_grid_stability_1975:0 "Grid Stability"
 mdcw_grid_stability_1975_desc:0 "Long-distance grid engineering increases energy infrastructure construction speed by 10%. This does not generate electricity or unlock a power plant."
 mdcw_supercritical_steam_1957:0 "Steam Cycle"
 mdcw_supercritical_steam_1957_desc:0 "Improved steam-cycle efficiency reduces fuel consumption by existing operating fossil power plants by 5%. It grants no plant, fuel, or generation capacity."
 mdcw_large_hydro_turbines_1965:0 "Hydropower"
 mdcw_large_hydro_turbines_1965_desc:0 "Improved turbines increase output by 5% at existing hydroelectric providers. This does not grant a dam or add hydroelectric capacity."
 mdcw_combined_cycle_generation_1967:0 "CCGT Plants"
 mdcw_combined_cycle_generation_1967_desc:0 "Combined-cycle improvements reduce fuel consumed by existing operating fossil power plants by 5%. This does not unlock a new plant or add generation capacity."
