# IMPERIA CW — Cold War: selected14 GER 1985 focus — English localisation.
 GER_1985_focus: "Federal Republic of Germany 1985 Focus Tree"
 GER_1985_Economy: "Economy"
 GER_1985_Security: "Security"
 GER_1985_Politics: "Politics"
 GER_1985_Reunification: "German Question"

 GER_1985_bonn_republic: "The Bonn Republic, 1985"
 GER_1985_bonn_republic_desc: "West Germany enters 1985 as a rich, stable and divided frontline state. High living standards, unemployment, NATO missiles, Ostpolitik, protest movements and the German question all compete for the attention of the Chancellery."
 GER_1985_social_market_under_pressure: "The Social Market Under Pressure"
 GER_1985_social_market_under_pressure_desc: "The social market economy remains the foundation of the republic, but slower growth and persistent unemployment force Bonn to choose between public intervention, reform and consolidation."
 GER_1985_employment_pact: "Employment Pact"
 GER_1985_employment_pact_desc: "Bring unions, employers and the state into a managed employment pact. It costs money, but it can turn stagnation into a political project instead of a social crisis."
 GER_1985_public_works_program: "Public Works Program"
 GER_1985_public_works_program_desc: "Target infrastructure, factories and regional bottlenecks with federal investment. Every new site also buys time for the coalition."
 GER_1985_co_determination_model: "Defend Co-Determination"
 GER_1985_co_determination_model_desc: "Works councils and co-determination keep industrial peace at the heart of the West German model."
 GER_1985_high_technology_program: "High Technology Program"
 GER_1985_high_technology_program_desc: "Microelectronics, computing and advanced machine tools will decide whether the export model survives the next decade."
 GER_1985_export_machine: "The Export Machine"
 GER_1985_export_machine_desc: "The Mittelstand, the big industrial combines and the banks all want the same thing: a Germany that sells precision to the world."
 GER_1985_market_reform_cabinet: "Market Reform Cabinet"
 GER_1985_market_reform_cabinet_desc: "A leaner state, lower corporate taxes and deregulation promise growth, but they also strain the postwar social compromise."
 GER_1985_tax_simplification: "Tax Simplification"
 GER_1985_tax_simplification_desc: "Simplify the tax structure and return fiscal room to the state without abandoning the market turn."
 GER_1985_privatization_cases: "Privatization Cases"
 GER_1985_privatization_cases_desc: "Selected public assets and service sectors can be pushed into private hands, creating capital and controversy in equal measure."
 GER_1985_service_economy_shift: "Shift to a Service Economy"
 GER_1985_service_economy_shift_desc: "Finance, logistics, telecommunications and research services can carry growth beyond the old industrial base."

 GER_1985_frontline_state: "Frontline State"
 GER_1985_frontline_state_desc: "The Federal Republic is the forward edge of NATO in Europe. Its ministries, bases and parties all live under Cold War pressure."
 GER_1985_stasi_counterintelligence: "Counter Stasi Networks"
 GER_1985_stasi_counterintelligence_desc: "East German intelligence has spent decades working Bonn. The BFV and allied services must seal leaks before they become strategic failures."
 GER_1985_clean_ministries: "Clean the Ministries"
 GER_1985_clean_ministries_desc: "Security reviews inside ministries and procurement offices will be politically painful, but the alternative is another scandal."
 GER_1985_modernize_bundeswehr: "Modernize the Bundeswehr"
 GER_1985_modernize_bundeswehr_desc: "The Bundeswehr is large, conscript-heavy and built for a European land war. It needs better readiness, equipment and command structures."
 GER_1985_leopard_and_marder: "Leopard and Marder"
 GER_1985_leopard_and_marder_desc: "Armored formations remain the backbone of forward defense. Invest in the vehicles and doctrine that make them credible."
 GER_1985_luftwaffe_readiness: "Luftwaffe Readiness"
 GER_1985_luftwaffe_readiness_desc: "NATO air defense over Central Europe depends on short reaction times, trained crews and interoperable doctrine."
 GER_1985_missile_decision: "The Missile Decision"
 GER_1985_missile_decision_desc: "Pershing II and cruise missiles split parliament, streets and allies. Bonn must decide how to handle the NATO Double-Track legacy."
 GER_1985_accept_pershing: "Accept Pershing Deployment"
 GER_1985_accept_pershing_desc: "Stand with Washington and NATO deterrence, even if the peace movement fills the streets."
 GER_1985_reject_pershing: "Reject Pershing Deployment"
 GER_1985_reject_pershing_desc: "Distance Bonn from the missile deployment and make arms control the center of policy."
 GER_1985_european_defence_identity: "European Defence Identity"
 GER_1985_european_defence_identity_desc: "A European pillar inside the alliance gives Bonn room between dependence and isolation."
 GER_1985_professional_core: "Professional Core"
 GER_1985_professional_core_desc: "A smaller professional core can improve readiness and expertise, though manpower reserves will shrink."
 GER_1985_territorial_defence: "Territorial Defence"
 GER_1985_territorial_defence_desc: "Keep the territorial defence network and reserve depth that made West Germany central to NATO planning."

 GER_1985_state_of_the_parties: "State of the Parties"
 GER_1985_state_of_the_parties_desc: "CDU/CSU, FDP, SPD, Greens and nationalist currents all read the 1980s differently. The republic must choose who defines the decade."
 GER_1985_kohl_mandate: "Kohl's Mandate"
 GER_1985_kohl_mandate_desc: "The conservative-liberal government presents itself as the steward of stability, NATO loyalty and European integration."
 GER_1985_fiscal_consolidation: "Fiscal Consolidation"
 GER_1985_fiscal_consolidation_desc: "Reduce deficits, discipline spending and reassure business that the Bonn government can manage the state."
 GER_1985_reaffirm_nato: "Reaffirm NATO"
 GER_1985_reaffirm_nato_desc: "The Atlantic alliance remains the security guarantee on which West Germany rests."
 GER_1985_deepen_european_integration: "Deepen European Integration"
 GER_1985_deepen_european_integration_desc: "The European project binds German power to shared institutions and a Franco-German partnership."
 GER_1985_spd_recovery: "SPD Recovery"
 GER_1985_spd_recovery_desc: "The Social Democrats rebuild from opposition through Ostpolitik, social security and a sharper critique of austerity."
 GER_1985_ostpolitik_revival: "Revive Ostpolitik"
 GER_1985_ostpolitik_revival_desc: "Contacts with the East can reduce tension, open channels and expose the DDR to pressure it cannot easily admit."
 GER_1985_expand_welfare_state: "Expand the Welfare State"
 GER_1985_expand_welfare_state_desc: "Protect unemployment benefits, health care and social spending against the reform wave."
 GER_1985_red_green_dialogue: "Red-Green Dialogue"
 GER_1985_red_green_dialogue_desc: "The SPD and Greens are uneasy partners, but their voters increasingly meet in the peace and environmental movements."
 GER_1985_green_breakthrough: "Green Breakthrough"
 GER_1985_green_breakthrough_desc: "The Greens turn protest politics into parliamentary power, challenging nuclear energy, militarization and old party discipline."
 GER_1985_anti_nuclear_mobilization: "Anti-Nuclear Mobilization"
 GER_1985_anti_nuclear_mobilization_desc: "Wyhl, Wackersdorf and the missile protests become the backbone of a new ecological political culture."
 GER_1985_chernobyl_lessons: "Lessons of Chernobyl"
 GER_1985_chernobyl_lessons_desc: "The reactor disaster gives the anti-nuclear argument new force and pushes environmental policy into the center of government."
 GER_1985_ecological_industry: "Ecological Industry"
 GER_1985_ecological_industry_desc: "Environmental policy can become an industrial strategy instead of only a protest demand."
 GER_1985_national_conservative_current: "National Conservative Current"
 GER_1985_national_conservative_current_desc: "Revisionist and hardline nationalist forces attack the consensus of the Bonn Republic, promising sovereignty and strength at a diplomatic cost."
 GER_1985_schlussstrich_debate: "Schlussstrich Debate"
 GER_1985_schlussstrich_debate_desc: "A radical break with memory culture mobilizes nationalist voters, but it alarms Germany's neighbors and destabilizes the republic."
 GER_1985_assert_sovereignty: "Assert Sovereignty"
 GER_1985_assert_sovereignty_desc: "Demand a freer hand in foreign and security policy, even if allies see the move as dangerous."
 GER_1985_independent_deterrent: "Independent Deterrent"
 GER_1985_independent_deterrent_desc: "A German nuclear option would shatter postwar assumptions and provoke a storm abroad."

 GER_1985_bonn_channels: "Bonn Channels"
 GER_1985_bonn_channels_desc: "Credits, broadcasters, church contacts and family links give Bonn tools to shape the DDR without crossing the inner-German border."
 GER_1985_credit_leverage: "Credit Leverage"
 GER_1985_credit_leverage_desc: "Bonn's money can stabilize East Berlin or buy concessions. Use it carefully."
 GER_1985_confederal_formula: "Confederal Formula"
 GER_1985_confederal_formula_desc: "A cautious German framework can keep reunification on the table without triggering immediate crisis."
 GER_1985_managed_reunification: "Managed Reunification"
 GER_1985_managed_reunification_desc: "If the DDR can no longer hold, Bonn must be ready to absorb the East through law, money and administration."
 GER_1985_hardline_reunification_demand: "Hardline Reunification Demand"
 GER_1985_hardline_reunification_demand_desc: "Abandon patient diplomacy and threaten force over the German question."
 GER_1985_germany_in_europe: "Germany in Europe"
 GER_1985_germany_in_europe_desc: "A stronger Germany must remain anchored in Europe if it is to be trusted, stable and prosperous."

 GER_1985_social_market_consensus: "Social Market Consensus"
 GER_1985_social_market_consensus_desc: "The postwar compromise between employers, unions and the welfare state still commands broad support."
 GER_1985_active_labour_market: "Active Labour Market Policy"
 GER_1985_active_labour_market_desc: "Federal job programs and training schemes soften the unemployment crisis at a fiscal cost."
 GER_1985_co_determination_model_idea: "Co-Determination Model"
 GER_1985_co_determination_model_idea_desc: "Works councils and co-determination keep industrial conflict inside predictable institutions."
 GER_1985_high_tech_push: "High Technology Push"
 GER_1985_high_tech_push_desc: "A national push into computing, microelectronics and advanced industry supports long-term growth."
 GER_1985_market_liberalization: "Market Liberalization"
 GER_1985_market_liberalization_desc: "Deregulation and tax reform strengthen investment while weakening the old social compact."
 GER_1985_bfv_counterintelligence: "BFV Counterintelligence Drive"
 GER_1985_bfv_counterintelligence_desc: "The domestic security services focus on East German penetration and hostile influence."
 GER_1985_bundeswehr_modernization: "Bundeswehr Modernization"
 GER_1985_bundeswehr_modernization_desc: "Equipment, readiness and command improvements sharpen the army built for NATO forward defence."
 GER_1985_nato_dual_track: "NATO Dual-Track Policy"
 GER_1985_nato_dual_track_desc: "Missile deployment and arms-control pressure are held together as one alliance policy."
 GER_1985_peace_movement: "Peace Movement"
 GER_1985_peace_movement_desc: "Mass mobilization against missiles and nuclear escalation lowers appetite for confrontation."
 GER_1985_european_defence_policy: "European Defence Policy"
 GER_1985_european_defence_policy_desc: "Bonn invests in European defence coordination while remaining inside the Western alliance."
 GER_1985_professional_bundeswehr: "Professional Bundeswehr Core"
 GER_1985_professional_bundeswehr_desc: "A professional core improves military quality but raises personnel costs."
 GER_1985_territorial_defence_network: "Territorial Defence Network"
 GER_1985_territorial_defence_network_desc: "Reserve structures and territorial commands keep national defence broad and manpower-heavy."
 GER_1985_ecological_transition: "Ecological Transition"
 GER_1985_ecological_transition_desc: "Environmental policy becomes a state priority with industrial and health effects."
 GER_1985_national_revisionism: "National Revisionism"
 GER_1985_national_revisionism_desc: "Hardline nationalist rhetoric strengthens mobilization while damaging stability and trust."
 GER_1985_reunification_momentum: "Reunification Momentum"
 GER_1985_reunification_momentum_desc: "Bonn's channels into the East keep the German question alive."
