l_english:
# IMPERIA COLD WAR — Gosplan Orders v3.
 COLDWAR_GOS.1.d: ""
 COLDWAR_GOS.1.t: "Gosplan"
 COLDWAR_GOS.10.d: ""
 COLDWAR_GOS.10.t: "Gosplan"
 COLDWAR_GOS.11.d: ""
 COLDWAR_GOS.11.t: "Gosplan"
 COLDWAR_GOS.12.d: ""
 COLDWAR_GOS.12.t: "Gosplan"
 COLDWAR_GOS.13.d: ""
 COLDWAR_GOS.13.t: "Gosplan"
 COLDWAR_GOS.2.a: "Understood."
 COLDWAR_GOS.2.d: "Gosplan's order for this year is fixed: (COLDWAR_GOS_GetOrderLine) Our report is due in December. Moscow sees only that we are at work; the figures are ours until then."
 COLDWAR_GOS.2.t: "The Annual Plan"
 COLDWAR_GOS.3.a: "Understood."
 COLDWAR_GOS.3.d: "(COLDWAR_GOS_GetResultLine)"
 COLDWAR_GOS.3.t: "The Year Is Settled"
 COLDWAR_GOS.4.a: "We have been found out."
 COLDWAR_GOS.4.d: "The gap between what we reported and what was built is now larger than this year's order. No inspector was needed: the figures have betrayed themselves."
 COLDWAR_GOS.4.t: "The Books Do Not Add Up"
 COLDWAR_GOS.5.a: "Understood."
 COLDWAR_GOS.5.d: "December. Gosplan waits for our figures. (COLDWAR_GOS_GetProgressLine) The report decisions are open until the end of the year; without a report, the real figure goes to Moscow."
 COLDWAR_GOS.5.t: "The Report to Moscow"
 COLDWAR_GOS.6.a: "So be it."
 COLDWAR_GOS.6.d: "The Control Commission of the Party has gone through our books. (COLDWAR_GOS_GetInspectionLine)"
 COLDWAR_GOS.6.t: "The Control Commission"
 COLDWAR_GOS.7.a: "Understood."
 COLDWAR_GOS.7.d: "Moscow has confirmed the role we asked for in the new five-year plan."
 COLDWAR_GOS.7.t: "The Role Is Confirmed"
 COLDWAR_GOS.8.a: "Understood."
 COLDWAR_GOS.8.d: "The new First Secretary has had the books of his predecessor checked. The figures that were only on paper are struck out; the shortfall is ours, the blame is the old man's."
 COLDWAR_GOS.8.t: "The Books Are Opened"
 COLDWAR_GOS.9.a: "So be it."
 COLDWAR_GOS.9.d: "Another republic has told Moscow that our report is false, and the Control Commission has come to look. (COLDWAR_GOS_GetInspectionLine)"
 COLDWAR_GOS.9.t: "A Denunciation"
 COLDWAR_GOS_confirm_role: "Confirm the Requested Role"
 COLDWAR_GOS_confirm_role_desc: "[FROM.GetName] asks for another role in the new five-year plan: §Y[FROM.COLDWAR_GOS_GetRequestedRole]§!. Without an answer within 60 days, Gosplan keeps its own proposal."
 COLDWAR_GOS_counter_plan: "Offer a Counter-Plan"
 COLDWAR_GOS_counter_plan_desc: "We promise half as much again as Gosplan asks. Success pays §G50§! political power more."
 COLDWAR_GOS_denounce: "Denounce a False Report"
 COLDWAR_GOS_denounce_desc: "We tell Moscow that the report of [FROM.GetName] is false. The Control Commission will look. If we are right, the Union remembers our vigilance; if we are wrong, we are slanderers."
 COLDWAR_GOS_denounce_tt: "If the report of §Y[FROM.GetName]§! is false, it is found, and we gain §YRevolutionary Vigilance§!. If it is true, we become §RSlanderers§!."
 COLDWAR_GOS_failure_agri: "Plan Shortfall: Agriculture"
 COLDWAR_GOS_failure_civ: "Plan Shortfall: Civilian Factories"
 COLDWAR_GOS_failure_contrib: "Plan Shortfall: Union Contribution"
 COLDWAR_GOS_failure_dock: "Plan Shortfall: Shipyards"
 COLDWAR_GOS_failure_gdp: "Plan Shortfall: Growth"
 COLDWAR_GOS_failure_infra: "Plan Shortfall: Infrastructure"
 COLDWAR_GOS_failure_invest: "Plan Shortfall: Productivity Investment"
 COLDWAR_GOS_failure_mil: "Plan Shortfall: Military Factories"
 COLDWAR_GOS_failure_power: "Plan Shortfall: Power Stations"
 COLDWAR_GOS_failure_refinery: "Plan Shortfall: Refineries"
 COLDWAR_GOS_failure_research: "Plan Shortfall: Research"
 COLDWAR_GOS_fakeable_tt: "Moscow cannot check this figure without inspectors."
 COLDWAR_GOS_insp_clean: "Every figure checks out. Moscow sends its thanks, and the inspectors go home."
 COLDWAR_GOS_insp_found: "The figures on paper do not match the plants on the ground. The report is false."
 COLDWAR_GOS_inspect: "Send the Control Commission"
 COLDWAR_GOS_inspect_desc: "[FROM.GetName] works on its annual plan; the figures are in progress. The Party Control Commission can go through the books: a false report is found for certain; a clean republic is praised, and the Union does not like inspectors."
 COLDWAR_GOS_inspect_tt: "If the books of §Y[FROM.GetName]§! hide a false report, it is found: the republic loses its rewards, its seat and its good name. If they are clean, the republic gains §G50§! political power and Union cohesion falls by §R2§!."
 COLDWAR_GOS_level_1: "the Plan"
 COLDWAR_GOS_level_2: "a Counter-Plan"
 COLDWAR_GOS_level_3: "a Pledge"
 COLDWAR_GOS_moscow_category: "Gosplan: The Annual Plans"
 COLDWAR_GOS_moscow_category_desc: "Every republic works to an annual order of Gosplan. In the first 14 days of the year Moscow may change it; afterwards Moscow sees only that the republics are at work, and in January what they report. Whoever doubts a report sends the Control Commission. Inspections left this year: §Y[?global.COLDWAR_GOS_inspections|0]§!. Last year: §Y[?global.COLDWAR_GOS_fulfilled|0]§! of §Y[?global.COLDWAR_GOS_settled|0]§! republics reported the plan fulfilled."
 COLDWAR_GOS_new_target_tt: "Our order: §Y[?COLDWAR_GOS_target|0]§!."
 COLDWAR_GOS_no_arsenal: "No Arsenal in the Union"
 COLDWAR_GOS_no_energy: "No Power House in the Union"
 COLDWAR_GOS_no_granary: "No Granary in the Union"
 COLDWAR_GOS_no_lies_tt: "§RNot possible while Moscow has State Acceptance (Gospriyomka) in the plants.§!"
