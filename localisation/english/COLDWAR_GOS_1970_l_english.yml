 COLDWAR_GOS_pay_contrib: "Pay the Union Contribution"
 COLDWAR_GOS_pay_contrib_desc: "This year's order is a contribution to the Union fund: §Y[?COLDWAR_GOS_contrib_pct|%2]§! of our GDP. The fund pays the plants of the Union programmes."
 COLDWAR_GOS_plan_on_paper: "The Plan on Paper"
 COLDWAR_GOS_pledge: "Make a Pledge"
 COLDWAR_GOS_pledge_desc: "We promise twice what Gosplan asks. Success pays §G100§! political power more; failure costs §R2 %§! stability more."
 COLDWAR_GOS_progress_none: ""
 COLDWAR_GOS_progress_proposed: "Gosplan's proposal: Moscow can still change it, we can still raise it."
 COLDWAR_GOS_progress_reported: "Reported to Moscow: §Y[?COLDWAR_GOS_reported|0]§! of §Y[?COLDWAR_GOS_target|0]§! (real: [?COLDWAR_GOS_real|0])."
 COLDWAR_GOS_progress_running: "Done so far: §Y[?COLDWAR_GOS_real|0]§! of §Y[?COLDWAR_GOS_target|0]§!."
 COLDWAR_GOS_report_false: "Report the Plan as Fulfilled"
 COLDWAR_GOS_report_false_desc: "On paper the plan is fulfilled. The difference of §R[?COLDWAR_GOS_gap_preview|0]§! stays in our books, is added to next year's order and is found by any inspection, or by itself once it grows larger than the order."
 COLDWAR_GOS_report_true: "Report the Real Result"
 COLDWAR_GOS_report_true_desc: "We report what we have done: §Y[?COLDWAR_GOS_real|0]§! of §Y[?COLDWAR_GOS_target|0]§!."
 COLDWAR_GOS_republic_category: "Gosplan: Our Annual Plan"
 COLDWAR_GOS_republic_category_desc: "(COLDWAR_GOS_GetOrderLine) (COLDWAR_GOS_GetProgressLine) Our role in the five-year plan: §Y(COLDWAR_GOS_GetRole)§!."
 COLDWAR_GOS_request_arsenal: "Ask for the Role: The Arsenal"
 COLDWAR_GOS_request_arsenal_desc: "We ask Moscow to make us §YThe Arsenal§! in the new five-year plan. The role decides Gosplan's orders and gives its spirit."
 COLDWAR_GOS_request_cotton: "Ask for the Role: The Cotton Belt"
 COLDWAR_GOS_request_cotton_desc: "We ask Moscow to make us §YThe Cotton Belt§! in the new five-year plan. The role decides Gosplan's orders and gives its spirit."
 COLDWAR_GOS_request_energy: "Ask for the Role: The Power House"
 COLDWAR_GOS_request_energy_desc: "We ask Moscow to make us §YThe Power House§! in the new five-year plan. The role decides Gosplan's orders and gives its spirit."
 COLDWAR_GOS_request_forge: "Ask for the Role: The Forge"
 COLDWAR_GOS_request_forge_desc: "We ask Moscow to make us §YThe Forge§! in the new five-year plan. The role decides Gosplan's orders and gives its spirit."
 COLDWAR_GOS_request_granary: "Ask for the Role: The Granary"
 COLDWAR_GOS_request_granary_desc: "We ask Moscow to make us §YThe Granary§! in the new five-year plan. The role decides Gosplan's orders and gives its spirit."
 COLDWAR_GOS_request_science: "Ask for the Role: The Laboratory"
 COLDWAR_GOS_request_science_desc: "We ask Moscow to make us §YThe Laboratory§! in the new five-year plan. The role decides Gosplan's orders and gives its spirit."
 COLDWAR_GOS_request_showcase: "Ask for the Role: The Showcase"
 COLDWAR_GOS_request_showcase_desc: "We ask Moscow to make us §YThe Showcase§! in the new five-year plan. The role decides Gosplan's orders and gives its spirit."
 COLDWAR_GOS_result_fail: "The plan has not been fulfilled. Gosplan notes the shortfall; the next order will remember it."
 COLDWAR_GOS_result_ok: "Moscow has accepted our report: the plan is fulfilled. (COLDWAR_GOS_GetOrderLine)"
 COLDWAR_GOS_result_self: "We reported the truth after last year's paper figures. The plan has failed, but the books are clean again and no one is disgraced."
