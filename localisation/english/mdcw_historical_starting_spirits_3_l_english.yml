l_english:
 PAK_1985_afghan_frontline_state: "Afghan Frontline State"
 PAK_1985_afghan_frontline_state_desc: "The Soviet-Afghan War has turned Pakistan into a conduit for intelligence, refugees, weapons and foreign money. This strengthens the security state while pulling instability across the border."
 PAK_1985_atomic_pressure: "The Atomic Pressure"
 PAK_1985_atomic_pressure_desc: "India's nuclear shadow and Bhutto's old warning - eat grass if necessary, but get the bomb - still haunt Islamabad. The program is not yet an open arsenal, but it already consumes money, secrecy and political attention."
 PAK_1985_zia_martial_law: "Zia's Martial Law State"
 PAK_1985_zia_martial_law_desc: "Pakistan enters 1985 under Muhammad Zia-ul-Haq's military presidency. The regime can impose order, but political parties, civilian institutions and the press remain constrained by the army's red lines."
