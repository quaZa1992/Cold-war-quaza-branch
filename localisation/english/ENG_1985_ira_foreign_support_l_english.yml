l_english:
 # ===========================================================================
 # ENG 1985 - IRA mechanic loc, full set
 # All keys also exist in MD_focus_ENG_1985_l_english.yml as belt-and-braces;
 # whichever file the engine indexes wins. Both must agree on values.
 # ===========================================================================

 # --- Decision categories (PKK pattern) -------------------------------------
 ENG_1985_ira_mechanic: "The Troubles"
 ENG_1985_ira_mechanic_desc: "Manage the seven live pressures of the Troubles: IRA militancy, public support, foreign funding, security pressure, peace progress, intelligence penetration, and loyalist tension."
 ENG_1985_ira_foreign_support: "The Northern Irish Question"
 ENG_1985_ira_foreign_support_desc: "Support, undermine, or stay clear of the British counter-insurgency."

 # --- Tracker labels (top of the IRA decision tab) --------------------------
 ENG_ira_room_header: "IRA Situation Room"
 ENG_ira_room_desc: "Seven pressures define Northern Ireland. Militancy, support and funding drive attacks; security and intelligence suppress cells; peace progress lowers violence but can provoke loyalist anger. Dublin cooperation is now handled through Irish response events."
 ENG_ira_militancy_gui: "Militancy"
 ENG_ira_militancy_gui_tt: "Active operational tempo of the Provisional IRA. At 65+ Belfast bombings can fire. At 82+ with Support over 50 a major plot can fire. Driven UP by foreign funding, high public support, and loyalist backlash; driven DOWN by intelligence work and peace progress."
 ENG_ira_support_gui: "Public Support"
 ENG_ira_support_gui_tt: "Civilian sympathy for the Republican movement. High support shields IRA cells from Special Branch and makes recruitment easier. Internment and harsh sweeps push it UP; community outreach and dialogue push it DOWN."
 ENG_ira_funding_gui: "Foreign Funding"
 ENG_ira_funding_gui_tt: "Cash and weapons reaching IRA cells from abroad. Above 40 it pushes militancy and support upward every month. Above 55 a foreign-arms event can fire. Reduced by convoy interdictions, exposed routes, and withdrawn sponsors."
 ENG_ira_security_gui: "Security Pressure"
 ENG_ira_security_gui_tt: "Intensity of the British counter-campaign. Above 60 it suppresses militancy and improves intelligence penetration, but it also raises sympathy and loyalist tension. Cross-border safe havens cut this hard."
 ENG_ira_peace_gui: "Peace Progress"
 ENG_ira_peace_gui_tt: "Diplomatic groundwork for a settlement. Above 35 it reduces militancy and support every month; above 65 and with low militancy it can open a settlement window. Anglo-Irish dialogue and backchannels build it."
 ENG_ira_intel_gui: "Intel Penetration"
 ENG_ira_intel_gui_tt: "How deeply Special Branch, MI5, and allied services have penetrated IRA logistics. Above 50 it cuts militancy and funding each month. Above 65 it can trigger an intelligence breakthrough if IRA pressure is still active."
 ENG_ira_loyalist_gui: "Loyalist Tension"
 ENG_ira_loyalist_gui_tt: "Pressure from unionist and loyalist hardliners. High values worsen garrison strain and can trigger a backlash event. Raised by hard security shortcuts and Dublin backchannels; lowered by clean interdictions and careful de-escalation."
 ENG_ira_irish_cooperation_header: "Dublin Track"
 ENG_ira_irish_cooperation_tt: "Shows whether the Republic of Ireland is cooperating with British counter-IRA policy. UK focuses unlock approaches; Backchannel and Dialogue decisions ask Dublin through events. Irish AI accepts unless the republican/Sinn Fein path is in power. An Irish player decides manually."

 # --- Tracker dynamic-status panel (NEW) -----------------------------------
 ENG_ira_status_phase: "[?ENG_ira_threat_phase|0]"
 ENG_ira_status_panel_header: "Current Threat Picture"
 ENG_ira_status_panel_header_tt: "Live summary of the situation in Northern Ireland. Updates monthly when the IRA mission cycles."
 ENG_ira_threat_phase_label: "Threat Phase:"
 ENG_ira_threat_phase_low: "§GLOW§! - Background sectarian violence; no immediate operational threat."
 ENG_ira_threat_phase_medium: "§YELEVATED§! - Cells active, sporadic attacks expected. Belfast bombings arm at Militancy 65+."
 ENG_ira_threat_phase_high: "§RHIGH§! - Open insurgency phase. Belfast bombings are live; major plots arm at Militancy 82+ and Support 50+."
 ENG_ira_threat_phase_critical: "§RCRITICAL§! - Catastrophic risk. Major plots, bombings, and foreign-arms events may all be active."

 ENG_ira_active_sponsors_header: "Active Foreign Sponsors"
 ENG_ira_active_sponsors_none: "§GNo active foreign sponsorship cooldown.§!"
 ENG_ira_active_sponsors_some: "§RForeign sponsors are active.§! Convoy Interdiction in the British counter tab can intercept them."
 ENG_ira_next_event_header: "Next Event Window"
 ENG_ira_next_event_safe: "§GNo random IRA event armed.§! Slider thresholds are below all triggers."
 ENG_ira_next_event_grace: "§GInitial watch period.§! Random IRA incident events are held for the first 90 days so the player can read the situation."
 ENG_ira_next_event_cooldown: "§YIncident cooldown active.§! A recent IRA report blocks further random incident events for now."
 ENG_ira_next_event_belfast: "§YBelfast bombing window armed§! - Militancy is over 65. Monthly 15% roll after the initial grace period and shared incident cooldown."
 ENG_ira_next_event_major: "§RMajor IRA plot armed§! - Militancy over 82 AND Support over 50. Monthly 8% roll after cooldowns."
 ENG_ira_next_event_arms: "§RForeign arms cache event armed§! - Funding over 55. Monthly 10% roll after cooldowns."
 ENG_ira_next_event_loyalist: "§YLoyalist backlash armed§! - Loyalist Tension over 65. Monthly 12% roll after cooldowns."
 ENG_ira_next_event_intel: "§GIntelligence breakthrough possible§! - Intel Penetration over 65 while IRA pressure remains active. Monthly 15% roll after cooldowns."
 ENG_ira_next_event_settlement: "§GSettlement window possible§! - Peace Progress over 65 and Militancy below 45. Monthly 10% roll after cooldowns."

 ENG_ira_monthly_drift_header: "Monthly Drift:"
 ENG_ira_monthly_drift_contested: "§YContested tempo§!: foreign funding feeds cells while security pressure suppresses attacks. Expect mixed monthly shifts."
 ENG_ira_monthly_drift_funding: "§RFunding is driving escalation§!: foreign money adds militancy and support each month."
 ENG_ira_monthly_drift_security: "§YSecurity pressure dominates§!: militancy falls, but sympathy and loyalist anger can rise."
 ENG_ira_monthly_drift_peace: "§GPolitical channels are working§!: peace progress reduces militancy and support each month."
 ENG_ira_monthly_drift_baseline: "§WLow-level pressure§!: militancy edges upward unless intelligence, peace talks, or outreach contain it."

 ENG_ira_policy_advice_header: "Advice:"
 ENG_ira_policy_advice_major: "§RMajor plot risk§!: combine Supergrass, Diplock Courts, or security pressure with outreach; do not let support stay above 50."
 ENG_ira_policy_advice_funding: "§RForeign pipeline active§!: use Convoy Interdiction, trace arms routes, or pressure sponsors before militancy spikes."
 ENG_ira_policy_advice_loyalist: "§YLoyalist backlash risk§!: avoid hardline shortcuts and use dialogue or clean interdictions to cool sectarian tension."
 ENG_ira_policy_advice_settlement: "§GSettlement window§!: keep security measured and continue Anglo-Irish dialogue before the opportunity closes."
 ENG_ira_policy_advice_intel: "§YIntelligence weak§!: Special Branch operations or intelligence coordination are needed before funding routes disappear."
 ENG_ira_policy_advice_balanced: "§WBalanced but unstable§!: no single threshold is dominant. Decide whether to pressure, negotiate, or contain funding."
 ENG_ira_irish_cooperation_none: "§WDublin Track§!: no active Irish channel. Complete Hillsborough, Talks in Ulster, or Good Friday paths to unlock serious cooperation."
 ENG_ira_irish_cooperation_pending: "§YDublin Track§!: a British request is on the Irish cabinet table. Effects apply only after Ireland answers."
 ENG_ira_irish_cooperation_backchannels: "§GDublin Track§!: informal backchannels are open. Peace channels are active, but unionists will watch every concession."
 ENG_ira_irish_cooperation_security: "§GDublin Track§!: Garda and British security channels are coordinating border pressure and courier checks."
 ENG_ira_irish_cooperation_full: "§GDublin Track§!: full security and intelligence liaison with Dublin. Border checks and intelligence coordination are at their strongest."
 ENG_ira_irish_cooperation_refused: "§RDublin Track§!: Dublin refused recent cooperation. Negotiated solutions are harder until the political channel is repaired."
 ENG_ira_irish_cooperation_republican: "§RDublin Track§!: a republican Irish government has vetoed cooperation with Westminster."

 # --- Foreign support panel (state-context popup) --------------------------
 ENG_1985_ira_open_panel_tt: "§HOpen the Northern Irish Question§!\nForeign-influence actions on the British counter-insurgency. Click to open the action panel; click the fist again or the close button to dismiss."
 ENG_1985_ira_close_panel_tt: "Close the Northern Irish Question panel."

 ENG_ira_foreign_support_header: "The Troubles - Foreign Influence"
 ENG_ira_foreign_support_sub: "Covert, small-scale actions. Only one foreign support channel can be exploited at a time before British counter-intelligence tightens the net."
 ENG_ira_foreign_support_warning: "§YUK detection is chance-based.§! These actions are intentionally modest in multiplayer: they create pressure, not instant crisis."

 ENG_1985_ira_send_arms_shipment_short: "Arms Shipment"
 ENG_1985_ira_send_funds_short: "Funds Transfer"
 ENG_1985_ira_propaganda_short: "Propaganda"
 ENG_1985_ira_provide_safe_haven_short: "Safe Haven"
 ENG_1985_ira_intel_handoff_short: "Intel Handoff"
 ENG_1985_ira_pull_funding_short: "Pull Funding"

 # Detailed action tooltips - what is actually shipped, what it costs, what it does
 ENG_1985_ira_send_arms_shipment_tt: "§HArms Trace to the Provisional IRA§!\n§YYou ship§!: 100 rifles, 30 support equipment, and 15 anti-tank weapons from your stockpile.\n§YEffect on the United Kingdom§!: §R+3§! Foreign Funding, §R+1§! Militancy, §R-1§! Intel Penetration, §R+1§! Loyalist Tension.\n§YYou pay§!: §R-25§! Political Power, equipment losses, and §R-45§! UK opinion.\n§HDetection§!: §Y40%§! chance that Britain receives an intelligence report naming you.\n§HCooldown§!: 270 days for you, and a UK-wide foreign support cooldown of 120 days."
 ENG_1985_ira_send_arms_shipment_cooldown_tt: "§ROn cooldown.§! Either your route is still exposed, or British counter-intelligence is already tracking another foreign IRA channel."
 ENG_1985_ira_send_arms_shipment_blocked_tt: "§RBlocked - insufficient stockpile.§! You need at least 100 Infantry Equipment, 30 Support Equipment, and 15 Anti-Tank Equipment to ship."

 ENG_1985_ira_send_funds_tt: "§HFunds Transfer to Republican Networks§!\n§YYou send§!: hard currency through diaspora committees and shell companies.\n§YEffect on the United Kingdom§!: §R+2§! Foreign Funding, §R+1§! Public Support.\n§YYou pay§!: §R-15§! Political Power, §R-0.01§! stability, §R-15 Convoys§!, and §R-30§! UK opinion.\n§HDetection§!: §Y30%§! chance that Britain receives an intelligence report naming you.\n§HCooldown§!: 180 days for you, and a UK-wide foreign support cooldown of 120 days."
 ENG_1985_ira_send_funds_cooldown_tt: "§RWaiting for the next courier window.§! British financial monitoring may also be suppressing all foreign channels."

 ENG_1985_ira_propaganda_tt: "§HPropaganda Support§!\n§YYou broadcast§!: Republican-sympathetic radio, pamphlets, and foreign-press placements.\n§YEffect on the United Kingdom§!: §R+2§! Public Support, §R-1§! Peace Progress.\n§YYou pay§!: §R-10§! Political Power and §R-15§! UK opinion.\n§HDetection§!: §Y20%§! chance that Britain receives an intelligence report naming you.\n§HCooldown§!: 120 days for you, and a UK-wide foreign support cooldown of 90 days."
 ENG_1985_ira_propaganda_cooldown_tt: "§RYour broadcast schedule is exposed.§! The UK may also be suppressing all foreign channels for the moment."

 ENG_1985_ira_pull_funding_tt: "§HPull Funding§!\n§YYou order§!: cash routes closed, courier networks shuttered, pending shipments cancelled.\n§YEffect on the United Kingdom§!: §G-4§! Foreign Funding, §G-1§! Militancy, §G+1§! Intel Penetration.\n§YYou pay§!: §R-5§! Political Power. UK opinion §G+15§!.\n§HDetection§!: §Y20%§! chance that Britain receives an intelligence report noting the withdrawal.\n§HCooldown§!: 120 days. §YRequires§!: IRA foreign funding above 25."
 ENG_1985_ira_pull_funding_cooldown_tt: "§RAlready in the process of withdrawing.§!"

 ENG_1985_ira_provide_safe_haven_tt: "§HCross-Border Safe Haven§!\n§YYou allow§!: PIRA operatives to cross your border, hide in safe houses, and exfiltrate after operations.\n§YEffect on the United Kingdom§!: §R+1§! Militancy, §R-3§! Security Pressure, §R-1§! Intel Penetration, §R+2§! Loyalist Tension.\n§YYou pay§!: §R-30§! Political Power, §R-0.03§! stability, and §R-40§! UK opinion.\n§HDetection§!: §Y45%§! chance that Britain receives an intelligence report naming you.\n§HCooldown§!: 365 days for you, and a UK-wide foreign support cooldown of 150 days. §YRequires§!: Republic of Ireland, or any country with a coastal European state."
 ENG_1985_ira_provide_safe_haven_cooldown_tt: "§RYour border infrastructure is being watched.§! British counter-intelligence may also be suppressing all foreign channels."

 ENG_1985_ira_intel_handoff_tt: "§HIntelligence Handoff§!\n§YYou hand off§!: SIGINT product, forged documents, and limited training support.\n§YEffect on the United Kingdom§!: §R+2§! Foreign Funding, §R+1§! Militancy, §R-2§! Intel Penetration.\n§YYou pay§!: §R-20§! Political Power, §R-25§! Command Power, and §R-35§! UK opinion.\n§HDetection§!: §Y35%§! chance that Britain receives an intelligence report naming you.\n§HCooldown§!: 240 days for you, and a UK-wide foreign support cooldown of 120 days."
 ENG_1985_ira_intel_handoff_cooldown_tt: "§RAssets need to cool off before the next handoff.§! British counter-intelligence may also be suppressing all foreign channels."

 # --- Opinion modifier display names ---------------------------------------
 ENG_1985_ira_arms_supplier: "Arming the Provisional IRA"
 ENG_1985_ira_financier: "Funding the Provisional IRA"
 ENG_1985_ira_propaganda_sponsor: "Hosting Republican Propaganda"
 ENG_1985_ira_safe_haven: "Sheltering Republican Operatives"
 ENG_1985_ira_intel_partner: "Intelligence Cooperation with the Provisional IRA"
 ENG_1985_ira_funding_withdrawn: "Withdrew Support for the Provisional IRA"

 # --- UK counter decisions (NEW) -------------------------------------------
 ENG_1985_convoy_interdiction: "Convoy Interdiction"
 ENG_1985_convoy_interdiction_desc: "Royal Navy and intelligence forces intercept a foreign arms convoy bound for Republican networks. Recovers stockpile, exposes the supplier, slashes Foreign Funding."
 ENG_1985_convoy_interdiction_tt: "§HConvoy Interdiction§!\n§YEffect§!:\n  §G-15§! Foreign Funding\n  §G-3§! Militancy\n  §G+8§! Intel Penetration\n  §G-2§! Loyalist Tension\n  §G+50 Infantry Equipment§! recovered\n  §G+15 Anti-Tank Equipment§! recovered\n§YCost§!: §R-30§! Political Power, §R-15§! Command Power.\n§HRequires§!: an active foreign sponsor cooldown and IRA Foreign Funding > 30. §HCooldown§!: 90 days."
 ENG_1985_convoy_interdiction_cooldown_tt: "§RAlready intercepted recently.§! Crews and intel sources need to recover."
 ENG_1985_convoy_interdiction_blocked_tt: "§RNo active convoy to intercept.§! Foreign Funding must be over 30 and at least one foreign sponsor must have a recent shipment cooldown active."

 ENG_1985_supergrass_program: "Supergrass Programme"
 ENG_1985_supergrass_program_desc: "Turn a senior PIRA operative into a state witness. Decapitates a generation of leadership at huge legal and intelligence cost."
 ENG_1985_supergrass_program_tt: "§HSupergrass Programme§!\n§YEffect§!:\n  §G-18§! Militancy\n  §G-8§! Foreign Funding\n  §G-5§! Public Support\n  §G+5§! Security Pressure\n  §G+16§! Intel Penetration\n  §R+3§! Loyalist Tension\n§YCost§!: §R-50§! Political Power, §R-0.03§! stability, §R-30§! Command Power.\n§HCooldown§!: 240 days. The court process takes time and burns intelligence sources."
 ENG_1985_supergrass_program_cooldown_tt: "§RA supergrass case is already at trial.§! No further informer can be turned this year."

 ENG_1985_loyalist_paramilitary: "Tolerate Loyalist Paramilitaries"
 ENG_1985_loyalist_paramilitary_desc: "Look the other way as UDA and UVF cells run a counter-insurgency of their own. Crushes Republican support but trades international reputation and risks an even bigger spiral."
 ENG_1985_loyalist_paramilitary_tt: "§HTolerate Loyalist Paramilitaries§!\n§YEffect§!:\n  §G-12§! Public Support\n  §R+8§! Militancy\n  §R+20§! Loyalist Tension\n  §R-5§! Peace Progress\n  §R-0.04§! stability\n  §R+1.5§! World Tension\n§YCost§!: §R-25§! Political Power.\n§HCooldown§!: 180 days. Diplomatic blowback with the USA and Ireland."
 ENG_1985_loyalist_paramilitary_cooldown_tt: "§RAlready stood down to avoid escalation.§!"

 ENG_1985_diplock_courts: "Diplock Courts"
 ENG_1985_diplock_courts_desc: "Suspend jury trials for terrorism cases. Single-judge proceedings deliver convictions faster but burn democratic legitimacy."
 ENG_1985_diplock_courts_tt: "§HDiplock Courts§!\n§YEffect§!:\n  §G-10§! Militancy\n  §R+5§! Public Support\n  §G+8§! Security Pressure\n  §G+6§! Intel Penetration\n  §R-2§! Peace Progress\n§YCost§!: §R-40§! Political Power, §R-0.02§! stability.\n§HCooldown§!: 180 days."
 ENG_1985_diplock_courts_cooldown_tt: "§RDiplock framework already in extended use.§! Parliament will not sign off again this year."

 ENG_1985_loyalist_paramilitary_threat: "Loyalist Paramilitaries Active"

 ENG_1985_anglo_irish_dialogue: "Anglo-Irish Dialogue Round"
 ENG_1985_anglo_irish_dialogue_desc: "Convene a Hillsborough-style negotiation round. This now sends an event to Ireland; the gains arrive only if Dublin accepts."
 ENG_1985_anglo_irish_dialogue_tt: "§HAnglo-Irish Dialogue Round§!\n§YRequest to Ireland§!: Dublin receives a response event.\n§GIf accepted§!:\n  §G+12§! Peace Progress\n  §G-4§! Militancy\n  §G-4§! Public Support\n  §G+4§! Security Pressure\n  §G+6§! Intel Penetration\n  §R+5§! Loyalist Tension\n§RIf refused§!: Peace Progress falls and IRA support rises.\n§YCost§!: §R-40§! Political Power. §HCooldown§!: 150 days."
 ENG_1985_anglo_irish_dialogue_cooldown_tt: "§RDelegations need a recess between rounds.§!"

 ENG_1985_protect_informant_network: "Protect the Informant Network"
 ENG_1985_protect_informant_network_desc: "Move vulnerable informants, protect court witnesses, and keep Special Branch sources alive long enough to map the logistics network."
 ENG_1985_protect_informant_network_tt: "§HProtect the Informant Network§!\n§YEffect§!:\n  §G+12§! Intel Penetration\n  §G-4§! Foreign Funding\n  §G-3§! Militancy\n  §R+2§! Loyalist Tension\n§YCost§!: §R-35§! Political Power and §R-15§! Command Power.\n§HCooldown§!: 120 days."

 ENG_1985_unionist_liaison: "Unionist Liaison"
 ENG_1985_unionist_liaison_desc: "Use quiet channels with unionist leaders to keep loyalist anger from turning into a second spiral of violence."
 ENG_1985_unionist_liaison_tt: "§HUnionist Liaison§!\n§YEffect§!:\n  §G-12§! Loyalist Tension\n  §G+3§! Peace Progress\n  §R+2§! Public Support\n  §R-0.005§! Stability\n§YCost§!: §R-35§! Political Power.\n§HCooldown§!: 120 days. This calms loyalists, but republicans can portray it as a sectarian bargain."

 ENG_1985_victims_support_scheme: "Victims' Support Scheme"
 ENG_1985_victims_support_scheme_desc: "Fund victim support, community rebuilding, and local services so armed groups lose some of their political oxygen."
 ENG_1985_victims_support_scheme_tt: "§HVictims' Support Scheme§!\n§YEffect§!:\n  §G+0.01§! Stability\n  §G-6§! Public Support\n  §G+4§! Peace Progress\n  §G-2§! Militancy\n§YCost§!: §R-45§! Political Power.\n§HCooldown§!: 150 days."

 ENG_1985_ports_and_border_checks: "Ports and Border Checks"
 ENG_1985_ports_and_border_checks_desc: "Tighten port inspections, ferry checks, and border liaison to cut courier routes. Requires Irish security cooperation unless Britain has taken a hardline border-control focus."
 ENG_1985_ports_and_border_checks_tt: "§HPorts and Border Checks§!\n§YEffect§!:\n  §G-8§! Foreign Funding\n  §G+6§! Security Pressure\n  §G+4§! Intel Penetration\n  §R+3§! Public Support\n  §R-0.01§! Stability\n§YCost§!: §R-40§! Political Power.\n§YRequires§!: Foreign Funding above 25 and either Dublin security cooperation or a hardline UK border focus. §HCooldown§!: 120 days."

 # --- Troubles event text ---------------------------------------------------
 eng_troubles.1.t: "IRA Bombing in Belfast"
 eng_troubles.1.d: "A bomb has exploded in Belfast, killing civilians and forcing Westminster to confront another month of violence in Northern Ireland."
 eng_troubles.1.a: "A dark day."
 eng_troubles.2.t: "Special Branch Operation Succeeds"
 eng_troubles.2.d: "A coordinated security operation has disrupted an IRA cell and seized weapons before they could be used."
 eng_troubles.2.a: "Good work."
 eng_troubles.3.t: "Security Operation Sparks Backlash"
 eng_troubles.3.d: "An operation meant to disrupt the IRA has instead generated local anger and accusations of heavy-handed policing."
 eng_troubles.3.a: "Contain the fallout."
 eng_troubles.4.t: "IRA Plot Against the Government"
 eng_troubles.4.d: "Security services report that an IRA plot targeted senior officials. The immediate threat has shaken the cabinet and forced emergency measures."
 eng_troubles.4.a: "Increase security around Whitehall."
 eng_troubles.5.t: "Foreign Arms Reach IRA Cells"
 eng_troubles.5.d: "Intelligence reports indicate that foreign weapons and money have reached republican militants."
 eng_troubles.5.a: "Find the route."
 eng_troubles.11.t: "MI5 Report: Arms Route to the IRA"
 eng_troubles.11.d: "A Security Service brief names §Y[FROM.GetNameDef]§! as the likely source of a small arms route reaching republican militants. The shipment is not large enough to transform the campaign by itself, but it confirms that foreign actors are probing British weaknesses."
 eng_troubles.11.a: "File the report."
 eng_troubles.12.t: "MI5 Report: Republican Funding Channel"
 eng_troubles.12.d: "British financial monitoring has traced a modest hard-currency channel believed to originate in §Y[FROM.GetNameDef]§!. The sums are limited, but they may help republican networks sustain couriers, safe flats, and propaganda cells."
 eng_troubles.12.a: "Follow the money."
 eng_troubles.13.t: "MI5 Report: Foreign Propaganda Placement"
 eng_troubles.13.d: "Analysts report that §Y[FROM.GetNameDef]§! has helped place republican-friendly material through sympathetic broadcasters and press contacts. The immediate effect is small, but it complicates the public information environment."
 eng_troubles.13.a: "Monitor the channel."
 eng_troubles.14.t: "MI5 Report: Suspected Safe Haven"
 eng_troubles.14.d: "A classified report points to §Y[FROM.GetNameDef]§! as a possible safe-haven node for republican operatives. The evidence is incomplete, but even limited sanctuary can make border security and intelligence penetration harder."
 eng_troubles.14.a: "Expand surveillance."
 eng_troubles.15.t: "MI5 Report: Intelligence Handoff"
 eng_troubles.15.d: "Counter-intelligence believes that §Y[FROM.GetNameDef]§! has passed limited intelligence support, documents, or training contacts to republican intermediaries. The handoff appears narrow, but the precedent is troubling."
 eng_troubles.15.a: "Open a file."
 eng_troubles.16.t: "MI5 Report: Foreign Channel Goes Quiet"
 eng_troubles.16.d: "Signals from republican-linked couriers suggest that §Y[FROM.GetNameDef]§! is closing or freezing one of its support routes. This is useful, but the network may attempt to replace the route elsewhere."
 eng_troubles.16.a: "Keep watching."
 eng_troubles.6.t: "Arms Route Exposed"
 eng_troubles.6.d: "British intelligence has exposed part of the foreign supply route used by IRA networks."
 eng_troubles.6.a: "Exploit the discovery."
 eng_troubles.7.t: "Foreign Support Reaches the IRA"
 eng_troubles.7.d: "Foreign assistance has strengthened IRA logistics, making the Northern Ireland crisis harder to contain."
 eng_troubles.7.a: "This will have consequences."
 eng_troubles.8.t: "Loyalist Backlash in Northern Ireland"
 eng_troubles.8.d: "Loyalist groups have answered republican pressure and Anglo-Irish manoeuvring with intimidation, marches, and retaliatory violence. Westminster now faces disorder from both sides of the sectarian divide."
 eng_troubles.8.a: "Pull the situation back from the edge."
 eng_troubles.9.t: "Intelligence Breakthrough Against IRA Logistics"
 eng_troubles.9.d: "Special Branch and MI5 have pieced together enough courier routes, safe houses, and financial links to disrupt a major slice of IRA logistics. The network is not broken, but it has been forced into hiding."
 eng_troubles.9.a: "Exploit every lead."
 eng_troubles.10.t: "A Settlement Window Opens"
 eng_troubles.10.d: "Backchannels, Dublin contacts, and fatigue inside local communities have created a narrow opening for serious political progress. It will not survive a heavy-handed response or a renewed wave of bombings."
 eng_troubles.10.a: "Keep the channel alive."
