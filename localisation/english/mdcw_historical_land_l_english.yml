 mdcw_light_antiarmor_law_1962_model_desc:0 "Light disposable launchers provide an inexpensive anti-tank option. Their penetration remains below later guided weapons."
 mdcw_first_generation_manpads_1970_legacy:0 "First-Generation MANPADS 1970"
