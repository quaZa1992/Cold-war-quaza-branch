 mdcw_m101_model_1940_legacy:0 "105 mm Howitzers 1940"
 mdcw_m101_model_1940_legacy_desc:0 "The M2A1, later designated M101, provides a low-cost towed-artillery option with less firepower than later guns."
 mdcw_m101_model_1940_nsb:0 "105 mm Howitzers 1940"
 mdcw_m101_model_1940_nsb_desc:0 "The M2A1, later designated M101, provides a low-cost towed-artillery option with less firepower than later guns. Also unlocks a wartime howitzer mount and light/medium artillery ammunition for separately researched tracked chassis."
 mdcw_m101_model_1940_model:0 "105 mm Howitzers 1940"
 mdcw_m101_model_1940_model_desc:0 "The M2A1, later designated M101, provides a low-cost towed-artillery option with less firepower than later guns."
