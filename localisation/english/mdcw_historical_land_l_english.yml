# IMPERIA CW — Cold War: historical land — English localisation.
 mdcw_gpmg_support_1957:0 "General-Purpose Machine Guns"
 mdcw_gpmg_support_1957_desc:0 "Standardised general-purpose machine guns increase the soft attack of non-militia formations by 2.5%."
 mdcw_tracked_apc_1960_legacy:0 "Tracked APCs 1960"
 mdcw_tracked_apc_1960_legacy_desc:0 "A pre-designed tracked carrier provides a lower-cost armoured transport option than later vehicles. This research unlocks a fixed equipment model."
 mdcw_tracked_apc_1960_model:0 "Tracked APCs 1960"
 mdcw_tracked_apc_1960_model_desc:0 "A pre-designed tracked carrier provides a lower-cost armoured transport option than later vehicles. This research unlocks a fixed equipment model."
 mdcw_postwar_medium_tank_1955_legacy:0 "Post-War Medium Tanks 1955"
 mdcw_postwar_medium_tank_1955_legacy_desc:0 "A pre-designed medium tank offers a cheaper alternative to later main battle tanks, with weaker protection and firepower. This research unlocks a fixed equipment model."
 mdcw_postwar_medium_tank_1955_nsb:0 "Post-War Medium Tank Hull 1955"
 mdcw_postwar_medium_tank_1955_nsb_desc:0 "A shared post-war armored hull family for tanks, armored personnel carriers, infantry fighting vehicles and specialist roles. Choose a role and assemble its compatible modules in the native designer."
 mdcw_postwar_medium_tank_1955_model:0 "Post-War Medium Tanks 1955"
 mdcw_postwar_medium_tank_1955_model_desc:0 "A pre-designed medium tank offers a cheaper alternative to later main battle tanks, with weaker protection and firepower. This research unlocks a fixed equipment model."
 mdcw_m101_model_1940_legacy:0 "105 mm Howitzers 1940"
 mdcw_m101_model_1940_legacy_desc:0 "The M2A1, later designated M101, provides a low-cost towed-artillery option with less firepower than later guns."
 mdcw_m101_model_1940_nsb:0 "105 mm Howitzers 1940"
 mdcw_m101_model_1940_nsb_desc:0 "The M2A1, later designated M101, provides a low-cost towed-artillery option with less firepower than later guns. Also unlocks a wartime howitzer mount and light/medium artillery ammunition for separately researched tracked chassis."
 mdcw_m101_model_1940_model:0 "105 mm Howitzers 1940"
 mdcw_m101_model_1940_model_desc:0 "The M2A1, later designated M101, provides a low-cost towed-artillery option with less firepower than later guns."
 mdcw_m101_service_model_1955_legacy:0 "105 mm Howitzer Modernisation"
 mdcw_m101_service_model_1955_legacy_desc:0 "Post-war standardisation improves the existing M2A1/M101 family. This service upgrade retains a cheaper production option than later artillery."
 mdcw_m101_service_model_1955_nsb:0 "105 mm Howitzer Modernisation"
 mdcw_m101_service_model_1955_nsb_desc:0 "Post-war standardisation improves the existing M2A1/M101 family. This service upgrade retains a cheaper production option than later artillery."
 mdcw_m101_service_model_1955_model:0 "105 mm Howitzer Modernisation"
 mdcw_m101_service_model_1955_model_desc:0 "Post-war standardisation improves the existing M2A1/M101 family. This service upgrade retains a cheaper production option than later artillery."
 mdcw_155mm_m114_option_legacy:0 "155 mm Medium Howitzers"
 mdcw_155mm_m114_option_legacy_desc:0 "The M1/M114 family offers heavier firepower than light 105 mm guns, at greater steel, production and supply cost and lower mobility."
 mdcw_155mm_m114_option_nsb:0 "155 mm Medium Howitzers"
 mdcw_155mm_m114_option_nsb_desc:0 "The M1/M114 family offers heavier towed firepower at greater steel, production and supply cost and lower mobility. Also unlocks a heavy artillery ammunition load for compatible self-propelled guns."
 mdcw_155mm_m114_option_model:0 "155 mm Medium Howitzers"
 mdcw_155mm_m114_option_model_desc:0 "The M1/M114 family offers heavier firepower than light 105 mm guns, at greater steel, production and supply cost and lower mobility."
 mdcw_heavy_at_ss10_1958:0 "First-Generation Guided Anti-Tank Missiles"
 mdcw_heavy_at_ss10_1958_desc:0 "Early guided missiles improve anti-armour performance at greater production and supply cost than unguided launchers."
 mdcw_heavy_at_ss10_1958_model:0 "First-Generation Guided Anti-Tank Missiles"
 mdcw_heavy_at_ss10_1958_model_desc:0 "Early guided missiles improve anti-armour performance at greater production and supply cost than unguided launchers."
 medium_tank_chassis_mdcw_1955:0 "1955 Tank Hull"
 medium_tank_chassis_mdcw_1955_short:0 "1955 Tank Hull"
 medium_tank_chassis_mdcw_1955_desc:0 "A modular post-war medium-tank chassis. Design its armament, armour, engine, optics and ammunition in the tank designer; compatible early components are included."
