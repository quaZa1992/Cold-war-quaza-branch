 mdcw_m101_service_model_1955_legacy_desc:0 "Post-war standardisation improves the existing M2A1/M101 family. This service upgrade retains a cheaper production option than later artillery."
 mdcw_m101_service_model_1955_nsb:0 "Post-war artillery standardisation improves the M2A1/M101 family and introduces improved howitzer mounts and early unguided rocket-launcher modules. Tracked designs still require their own chassis research."
 mdcw_m101_service_model_1955_nsb_desc:0 "Post-war standardisation improves the existing M2A1/M101 family. This service upgrade retains a cheaper production option than later artillery."
