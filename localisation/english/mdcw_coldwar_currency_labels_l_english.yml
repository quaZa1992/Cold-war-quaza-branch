# IMPERIA CW — Cold War: currency labels — English localisation.
 mdcw_soviet_rouble_name: "Soviet Rouble"
 mdcw_russian_rouble_name: "Russian Rouble"
 mdcw_coldwar_rouble_desc: "The currency of the Soviet Union, used in its centrally planned economy. Foreign exchange is controlled by the state. Trade within Comecon relies on state agreements and the transferable rouble as an accounting unit, distinct from Soviet cash roubles."
 mdcw_coldwar_guilder_desc: "The national currency of the Netherlands, divided into 100 cents. The guilder is in regular circulation and forms part of the Netherlands' existing monetary system."
 mdcw_coldwar_yuan_desc: "The renminbi is the currency of the People's Republic of China, denominated in yuan. Foreign exchange and external payments are administered by the state, and the currency is not freely convertible. Foreign trade is conducted through state agreements and controlled settlement channels."
 mdcw_modern_yuan_desc: "The renminbi, China's national currency, is an emerging reserve asset championed by Beijing as an alternative to dollar dominance. Trade partners within China's economic orbit benefit from its growing settlement network."
