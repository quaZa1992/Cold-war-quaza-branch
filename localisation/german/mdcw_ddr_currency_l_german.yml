l_german:
 ddr_mark: "Mark der DDR (Ostmark)"
 ddr_mark_desc: "Die Mark der Deutschen Demokratischen Republik (Mark der DDR, M) ist seit 1968 der offizielle Name der Währung der DDR. Sie wird in 100 Pfennig unterteilt, dient dem Zahlungsverkehr in der Planwirtschaft und ist nicht frei in ausländische Währungen konvertierbar."
