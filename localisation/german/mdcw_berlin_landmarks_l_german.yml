l_german:
 landmark_berlin_tv_tower: "Berliner Fernsehturm"
 landmark_berlin_tv_tower_plural: "$landmark_berlin_tv_tower$"
 landmark_berlin_tv_tower_desc: "Der am 3. Oktober 1969 nahe dem Alexanderplatz in Ostberlin eröffnete Fernsehturm ist mit seiner ursprünglichen Höhe von 365 Metern ein Wahrzeichen der DDR. Auf dem schlanken Betonschaft sitzt die 32 Meter breite, stahlverkleidete Kugel mit Aussichtsplattform und Restaurant. Darüber erhebt sich die rot-weiße Sendeantenne."
 landmark_berlin_wall: "Berliner Mauer"
 landmark_berlin_wall_plural: "$landmark_berlin_wall$"
 landmark_berlin_wall_desc: "Seit dem 13. August 1961 teilt die Berliner Mauer die Stadt. Das Grenzsystem aus Mauern, Kontrollstreifen, Zäunen und Wachtürmen soll die Flucht aus der DDR in den Westen verhindern und ist zum sichtbaren Symbol der deutschen Teilung geworden.\n\nFür die DDR belastet die Mauer die Stabilität, stärkt aber die Gegenspionage und verringert die Effizienz ausländischer subversiver Aktivitäten. Diese Effekte gelten nur, solange die DDR das Wahrzeichen kontrolliert."
