l_german:
 landmark_warsaw_palace: "Kultur- und Wissenschaftspalast"
 landmark_warsaw_palace_plural: "$landmark_warsaw_palace$"
 landmark_warsaw_palace_desc: "Der im Juli 1955 im Zentrum Warschaus eröffnete Kultur- und Wissenschaftspalast beherbergt Theater, Kinos, wissenschaftliche Einrichtungen und den Kongresssaal. Seine Bildungs- und Wissenschaftseinrichtungen senken die Bildungskosten und fördern die Forschung des Landes, das das Wahrzeichen kontrolliert."
