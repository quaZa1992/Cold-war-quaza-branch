l_german:
 landmark_bucharest_scinteii: "Casa Scînteii"
 landmark_bucharest_scinteii_plural: "$landmark_bucharest_scinteii$"
 landmark_bucharest_scinteii_desc: "Die 1956 im Norden Bukarests fertiggestellte Casa Scînteii vereint Verlage, Zeitungsredaktionen und Druckereien in einem monumentalen Gebäudekomplex. Ihr zentraler Turm und die abgestuften Seitenflügel zählen zu den markantesten Wahrzeichen der Hauptstadt. Die gebündelten Verlags- und Verwaltungsbüros senken die Verwaltungskosten des Landes, das den Gebäudekomplex kontrolliert."
