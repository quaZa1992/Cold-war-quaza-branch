 COLDWAR_EGY_1970_recall_zikri:0 "Fouad Abou Zikry zurückrufen"
 COLDWAR_EGY_1970_recall_ahmad_ismail_desc:0 "Ahmad Ismail Ali wurde im September 1969 entlassen. Ab Mai 1971 kann er zurückgerufen werden."
 COLDWAR_EGY_1970_recall_zikri_desc:0 "Abou Zikry verlor das Marinekommando im September 1969. Ab Oktober 1972 kann er zurückgerufen werden."
