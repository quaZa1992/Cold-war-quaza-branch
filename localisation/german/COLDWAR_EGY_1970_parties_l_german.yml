l_german:
 COLDWAR_EGY_1970_party_0:0 "£COLDWAR_EGY_1970_party_0 Nationaldemokratische Partei"
 COLDWAR_EGY_1970_party_0_icon:0 "£COLDWAR_EGY_1970_party_0"
 COLDWAR_EGY_1970_party_0_desc:0 "Historisch 1978 gegründet. Anwar as-Sadat, im Januar 1970 Vizepräsident, ist der mögliche Gründer dieses alternativen Weges.\n\nFührung: Anwar as-Sadat"
 COLDWAR_EGY_1970_party_1:0 "£COLDWAR_EGY_1970_party_1 Konservative Partei"
 COLDWAR_EGY_1970_party_1_icon:0 "£COLDWAR_EGY_1970_party_1"
 COLDWAR_EGY_1970_party_1_desc:0 "Die spätere Konservative Partei bleibt erhalten. Der ehemalige Vizepräsident Zakaria Mohieddin ist ein alternativer Gründungskandidat für ein konservatives, westlich orientiertes Programm.\n\nFührung: Zakaria Mohieddin"
 COLDWAR_EGY_1970_party_2:0 "£COLDWAR_EGY_1970_party_2 Partei der Freien Ägypter"
 COLDWAR_EGY_1970_party_2_icon:0 "£COLDWAR_EGY_1970_party_2"
 COLDWAR_EGY_1970_party_2_desc:0 "Historisch 2011 gegründet. Unternehmer Osman Ahmed Osman steht für eine alternative frühe Gründung; dies behauptet keine historische Mitgliedschaft.\n\nFührung: Osman Ahmed Osman"
 COLDWAR_EGY_1970_party_3:0 "£COLDWAR_EGY_1970_party_3 Ägyptische Sozialdemokratische Partei"
 COLDWAR_EGY_1970_party_3_icon:0 "£COLDWAR_EGY_1970_party_3"
 COLDWAR_EGY_1970_party_3_desc:0 "Historisch 2011 gegründet. Ibrahim Shukri ist ein alternativer Kandidat von 1970 für parlamentarische Sozialreformen, nicht ihr historischer Gründer.\n\nFührung: Ibrahim Shukri"
 COLDWAR_EGY_1970_party_4:0 "£COLDWAR_EGY_1970_party_4 Ägyptische Kommunistische Partei"
 COLDWAR_EGY_1970_party_4_icon:0 "£COLDWAR_EGY_1970_party_4"
 COLDWAR_EGY_1970_party_4_desc:0 "Die kommunistischen Organisationen lösten sich 1965 selbst auf; ihre Wiedergründung ist ein alternativer Weg. Freier Offizier und ehemaliger HADITU-Weggefährte Khaled Mohieddin ist ein alternativer Führungskandidat, kein historischer ECP-Vorsitzender im Januar 1970.\n\nFührung: Khaled Mohieddin"
 COLDWAR_EGY_1970_party_5:0 "£COLDWAR_EGY_1970_party_5 Revolutionäre Sozialisten"
 COLDWAR_EGY_1970_party_5_icon:0 "£COLDWAR_EGY_1970_party_5"
 COLDWAR_EGY_1970_party_5_desc:0 "Die späteren Revolutionären Sozialisten bleiben erhalten. Exilkommunist Henri Curiel ist ein alternativer Kandidat einer unabhängigen revolutionären Linken; er führte diese spätere trotzkistische Organisation historisch nicht.\n\nFührung: Henri Curiel"
 COLDWAR_EGY_1970_party_6:0 "£COLDWAR_EGY_1970_party_6 Partei der Würde (Karama)"
 COLDWAR_EGY_1970_party_6_icon:0 "£COLDWAR_EGY_1970_party_6"
 COLDWAR_EGY_1970_party_6_desc:0 "Die spätere Karama-Partei bleibt erhalten. Freier Offizier Hussein el-Shafei vertritt eine alternative frühe nasseristische Gründung.\n\nFührung: Hussein el-Shafei"
 COLDWAR_EGY_1970_party_7:0 "£COLDWAR_EGY_1970_party_7 Arabische Demokratische Nasseristische Partei"
 COLDWAR_EGY_1970_party_7_icon:0 "£COLDWAR_EGY_1970_party_7"
 COLDWAR_EGY_1970_party_7_desc:0 "Die spätere Nasseristische Partei bleibt erhalten. Ali Sabri, 1970 führender ASU-Politiker, führt ihre alternative frühe Form.\n\nFührung: Ali Sabri"
 COLDWAR_EGY_1970_party_8:0 "£COLDWAR_EGY_1970_party_8 Schiitische Reformpartei"
 COLDWAR_EGY_1970_party_8_icon:0 "£COLDWAR_EGY_1970_party_8"
 COLDWAR_EGY_1970_party_8_desc:0 "Eine fiktive ägyptische schiitische Reformpartei. Für Januar 1970 ist keine entsprechende organisierte Partei oder persönliche Führung belegt; daher dient ein Führungsrat.\n\nFührung: Shi'a Reform Council"
 COLDWAR_EGY_1970_party_9:0 "£COLDWAR_EGY_1970_party_9 Partei der Islamischen Rechtsgelehrten"
 COLDWAR_EGY_1970_party_9_icon:0 "£COLDWAR_EGY_1970_party_9"
 COLDWAR_EGY_1970_party_9_desc:0 "Eine fiktive ägyptische Partei islamischer Rechtsgelehrter. Eine ägyptische Theokratie iranischen Typs ist eine alternative Spieloption mit einem kollektiven Führungsrat.\n\nFührung: Council of Islamic Jurists"
 COLDWAR_EGY_1970_party_10:0 "£COLDWAR_EGY_1970_party_10 Al-Nour-Partei"
 COLDWAR_EGY_1970_party_10_icon:0 "£COLDWAR_EGY_1970_party_10"
 COLDWAR_EGY_1970_party_10_desc:0 "Historisch 2011 gegründet. Der damals in Saudi-Arabien lebende ägyptische Gelehrte Abd al-Razzaq Afifi ist ein alternativer Gründungskandidat, kein historischer Al-Nour-Vorsitzender.\n\nFührung: Abd al-Razzaq Afifi"
 COLDWAR_EGY_1970_party_11:0 "£COLDWAR_EGY_1970_party_11 Ansar Bayt al-Maqdis"
 COLDWAR_EGY_1970_party_11_icon:0 "£COLDWAR_EGY_1970_party_11"
 COLDWAR_EGY_1970_party_11_desc:0 "Die spätere Organisation bleibt als alternative Fraktion erhalten. Ihre modernen Kommandeure waren 1970 keine aktiven erwachsenen Führungspersonen; daher dient ein Führungsrat.\n\nFührung: Sinai Leadership Council"
 COLDWAR_EGY_1970_party_12:0 "£COLDWAR_EGY_1970_party_12 Muslimbruderschaft"
 COLDWAR_EGY_1970_party_12_icon:0 "£COLDWAR_EGY_1970_party_12"
 COLDWAR_EGY_1970_party_12_desc:0 "Hassan al-Hudaybi war von 1951 bis 1973 Generalführer. Die Organisation ist zu Spielbeginn verboten; eine Regierungsübernahme erfordert einen alternativen politischen Weg.\n\nFührung: Hassan al-Hudaybi"
 COLDWAR_EGY_1970_party_13:0 "£COLDWAR_EGY_1970_party_13 Koptisch-Orthodoxe Kirche"
 COLDWAR_EGY_1970_party_13_icon:0 "£COLDWAR_EGY_1970_party_13"
 COLDWAR_EGY_1970_party_13_desc:0 "Papst Kyrill VI. führte die Kirche von 1959 bis 1971. Sie wird spielmechanisch als politische Fraktion geführt, nicht als historische Wahlpartei.\n\nFührung: Pope Cyril VI"
 COLDWAR_EGY_1970_party_14:0 "£COLDWAR_EGY_1970_party_14 Neue Wafd-Partei"
 COLDWAR_EGY_1970_party_14_icon:0 "£COLDWAR_EGY_1970_party_14"
 COLDWAR_EGY_1970_party_14_desc:0 "Historisch 1978 als Wiederbelebung der 1953 aufgelösten Wafd gegründet. Fouad Serageddin ist der mögliche Gründer.\n\nFührung: Fouad Serageddin"
 COLDWAR_EGY_1970_party_15:0 "£COLDWAR_EGY_1970_party_15 Republikanische Volkspartei"
 COLDWAR_EGY_1970_party_15_icon:0 "£COLDWAR_EGY_1970_party_15"
 COLDWAR_EGY_1970_party_15_desc:0 "Die spätere Partei bleibt erhalten. Unternehmer Osman Ahmed Osman ist ein alternativer Kandidat von 1970 für ihr wirtschaftsnahes Programm, nicht ihr historischer Gründer.\n\nFührung: Osman Ahmed Osman"
 COLDWAR_EGY_1970_party_16:0 "£COLDWAR_EGY_1970_party_16 Partei für Reform und Entwicklung"
 COLDWAR_EGY_1970_party_16_icon:0 "£COLDWAR_EGY_1970_party_16"
 COLDWAR_EGY_1970_party_16_desc:0 "Die spätere Partei bleibt erhalten. Finanzminister Abdel Aziz Hegazy ist ein alternativer Gründungskandidat für Wirtschafts- und Verwaltungsreformen.\n\nFührung: Abdel Aziz Hegazy"
 COLDWAR_EGY_1970_party_17:0 "£COLDWAR_EGY_1970_party_17 Ägyptische Grüne Partei"
 COLDWAR_EGY_1970_party_17_icon:0 "£COLDWAR_EGY_1970_party_17"
 COLDWAR_EGY_1970_party_17_desc:0 "Historisch 1990 gegründet. Geologe Rushdi Said, 1970 Leiter der Bergbau- und geologischen Forschungsorganisation, ist ein alternativer ökologischer Kandidat.\n\nFührung: Rushdi Said"
 COLDWAR_EGY_1970_party_18:0 "£COLDWAR_EGY_1970_party_18 Arabische Sozialistische Union"
 COLDWAR_EGY_1970_party_18_icon:0 "£COLDWAR_EGY_1970_party_18"
 COLDWAR_EGY_1970_party_18_desc:0 "Die einzige legale politische Organisation im Januar 1970. Gamal Abdel Nasser bleibt Präsident; nach seinem Tod folgt ihm standardmäßig Anwar as-Sadat.\n\nFührung: Gamal Abdel Nasser"
 COLDWAR_EGY_1970_party_19:0 "£COLDWAR_EGY_1970_party_19 Nationalprogressive Unionistische Sammlungspartei (Tagammu)"
 COLDWAR_EGY_1970_party_19_icon:0 "£COLDWAR_EGY_1970_party_19"
 COLDWAR_EGY_1970_party_19_desc:0 "Historisch 1976 gegründet. Freier Offizier Khaled Mohieddin ist der mögliche Gründer und ein unabhängiger sozialistischer Kandidat von 1970.\n\nFührung: Khaled Mohieddin"
 COLDWAR_EGY_1970_party_20:0 "£COLDWAR_EGY_1970_party_20 Partei der Verteidiger der Heimat"
 COLDWAR_EGY_1970_party_20_icon:0 "£COLDWAR_EGY_1970_party_20"
 COLDWAR_EGY_1970_party_20_desc:0 "Die spätere Partei bleibt erhalten. Freier Offizier Kamal el-Din Hussein ist ein alternativer früher nationalistischer Kandidat, nicht ihr historischer Vorsitzender.\n\nFührung: Kamal el-Din Hussein"
 COLDWAR_EGY_1970_party_21:0 "£COLDWAR_EGY_1970_party_21 Arabische Sozialistische Baath-Partei - Region Ägypten"
 COLDWAR_EGY_1970_party_21_icon:0 "£COLDWAR_EGY_1970_party_21"
 COLDWAR_EGY_1970_party_21_desc:0 "Die spätere ägyptische Baath-Organisation bleibt spielbar. Ein regionaler Führungsrat vermeidet die Zuordnung eines unbeteiligten ägyptischen Politikers zu dieser Bewegung.\n\nFührung: Egyptian Ba'ath Regional Command"
 COLDWAR_EGY_1970_party_22:0 "£COLDWAR_EGY_1970_party_22 Ägyptische Streitkräfte"
 COLDWAR_EGY_1970_party_22_icon:0 "£COLDWAR_EGY_1970_party_22"
 COLDWAR_EGY_1970_party_22_desc:0 "Kriegsminister und Oberbefehlshaber Mohamed Fawzi vertritt eine direkte Militärregierung. Im Januar 1970 dient er unter Nasser, statt eine eigene Regierungspartei zu führen.\n\nFührung: Mohamed Fawzi"
 COLDWAR_EGY_1970_party_23:0 "£COLDWAR_EGY_1970_party_23 Dynastie Muhammad Ali"
 COLDWAR_EGY_1970_party_23_icon:0 "£COLDWAR_EGY_1970_party_23"
 COLDWAR_EGY_1970_party_23_desc:0 "Fuad II. lebt im Exil und ist am 1. Januar 1970 siebzehn; am 16. Januar wird er achtzehn. Seine Restauration ist ein alternativer Weg.\n\nFührung: Fuad II"
 COLDWAR_EGY_1970_party_0_future:0 "£COLDWAR_EGY_1970_party_0_future Partei Zukunft der Nation"
 COLDWAR_EGY_1970_party_0_future_icon:0 "£COLDWAR_EGY_1970_party_0_future"
 COLDWAR_EGY_1970_party_0_future_desc:0 "Die spätere Partei bleibt als alternative Gründung von 1970 erhalten. Anwar as-Sadat ist ihr alternativer Kandidat, nicht ihr historischer Gründer."
 COLDWAR_EGY_1970_party_18_alliance:0 "£COLDWAR_EGY_1970_party_18_alliance Partei der Sozialistischen Volksallianz"
 COLDWAR_EGY_1970_party_18_alliance_icon:0 "£COLDWAR_EGY_1970_party_18_alliance"
 COLDWAR_EGY_1970_party_18_alliance_desc:0 "Die spätere Partei bleibt als alternative Nachfolgepartei der ASU erhalten. Khaled Mohieddin ist ihr alternativer Kandidat von 1970, nicht ihr historischer Gründer."
