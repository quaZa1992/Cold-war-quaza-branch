l_german:
 landmark_jerusalem_western_wall: "Klagemauer"
 landmark_jerusalem_western_wall_plural: "$landmark_jerusalem_western_wall$"
 landmark_jerusalem_western_wall_desc: "Die Westmauer in Jerusalem, auch Klagemauer genannt, ist Teil der antiken Stützmauern des Tempelbergs. Ihre mächtigen Kalksteinlagen und der Gebetsplatz bilden einen zentralen Ort des jüdischen Glaubens. Das Land, das die Landmarke kontrolliert, erhält zusätzliche Stabilität und höheres monatliches Bevölkerungswachstum."
