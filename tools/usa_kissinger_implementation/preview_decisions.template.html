<!-- IMPERIA COLD WAR — Source-composed regional decisions preview. -->
<div id="usa-decisions-ui">
  <div class="viz-controls" aria-label="Preview selection">
    <label class="form-label">Land
      <select class="form-select" id="icw-preview-country">
        <option value="irq">Iraq</option><option value="per">Iran</option><option value="tur">Turkey</option><option value="syr">Syria</option>
      </select>
    </label>
    <label class="form-label">Ansicht
      <select class="form-select" id="icw-preview-view">
        <option value="host">Betroffenes Land</option><option value="usa">United States</option><option value="events">Ereignisse</option>
      </select>
    </label>
    <label class="form-label" id="icw-scene-control">Beispielzustand
      <select class="form-select" id="icw-preview-scene">
        <option value="crisis">Krise</option><option value="peace">Befriedungsprozess</option><option value="aftermath">Repressionsfolgen</option><option value="warning">Aufstandswarnung</option>
      </select>
    </label>
    <label class="form-label" id="icw-recipient-control" hidden>Empfänger
      <select class="form-select" id="icw-preview-recipient">
        <option value="host">Regierung</option><option value="usa">United States</option><option value="local">Kurdische Regionalregierung</option><option value="world">International, Beispiel UdSSR</option>
      </select>
    </label>
  </div>
  <div class="md-game" aria-label="IMPERIA COLD WAR decision interface preview">
    <div class="md-chrome">
      <div class="md-country"><img id="icw-player-flag" alt=""><span id="icw-player-name"></span></div>
      <div class="md-resources"><span>Political Power <b>320</b></span><span>Treasury <b id="icw-treasury"></b></span></div>
    </div>
    <div class="md-workspace" id="icw-decisions-screen">
      <section class="md-window" aria-label="Country decisions">
        <div class="md-window-heading">DECISIONS</div>
        <div class="md-category">
          <img class="md-decision-icon" data-asset="decision" alt="">
          <span id="icw-category-name"></span><span aria-hidden="true">▾</span>
        </div>
        <section class="md-region" aria-label="Regional unrest status">
          <div class="md-region-title" id="icw-region-heading"></div>
          <div class="md-meter-row">
            <div class="md-meter" role="progressbar" aria-label="Regional unrest" aria-valuemin="0" aria-valuemax="100" id="icw-meter"><div id="icw-meter-fill"></div></div>
            <span id="icw-unrest"></span>
          </div>
          <div class="md-legacy" id="icw-legacy"></div>
          <div class="md-status" id="icw-region-status"></div>
        </section>
        <div class="md-decisions" id="icw-decision-list" aria-label="Available regional decisions"></div>
      </section>
      <aside class="md-inspector" id="icw-inspector" aria-live="polite" aria-label="Selected decision tooltip">
        <div class="md-tooltip-title" id="icw-tooltip-title"></div>
        <div class="md-description" id="icw-tooltip-description"></div>
        <div class="md-requirements" id="icw-tooltip-requirements"></div>
        <div class="md-effect-heading">Effect</div>
        <div class="md-effects" id="icw-tooltip-effects"></div>
      </aside>
    </div>
    <div class="md-event-stage" id="icw-event-screen" hidden>
      <section class="md-event" aria-label="Country event">
        <div class="md-event-top"><div id="icw-event-title"></div></div>
        <div class="md-event-description" id="icw-event-description"></div>
        <div class="md-event-bottom">
          <img class="md-event-photo" data-asset="photo" alt="Real archival photograph of displaced Kurdish civilians in the native MD event frame">
          <div id="icw-event-options"></div>
        </div>
      </section>
      <aside class="md-inspector md-event-effect" id="icw-event-effect" hidden aria-live="polite">
        <div class="md-effect-heading">Effect</div><div id="icw-option-effects"></div>
      </aside>
    </div>
  </div>
  <div class="text-small text-muted" id="icw-preview-caption">Beispielwerte. Entscheidungen anklicken, um Voraussetzungen und Effekte zu sehen.</div>
</div>
<style>
#usa-decisions-ui{max-width:1024px;margin-inline:auto}
#usa-decisions-ui .md-game{--md-bg:#171b19;--md-panel:#242825;--md-text:#eeeae0;--md-muted:#c6c8bd;--md-gold:#efd05f;--md-good:#82c18c;--md-bad:#e77960;--md-line:#656456;--md-event-ink:#252218;--md-event-paper:#d6d1ba;color:var(--md-text);background:var(--md-bg);font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.4;border:2px solid #484c45;box-shadow:inset 0 0 0 1px #101310;isolation:isolate;margin-top:14px}
#usa-decisions-ui .md-chrome{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:linear-gradient(#333c36,#1c241f);border-bottom:2px solid #555b4c;padding:10px 18px}
#usa-decisions-ui .md-country{display:flex;align-items:center;gap:12px;letter-spacing:1px}
#usa-decisions-ui .md-country img{width:48px;height:32px;object-fit:fill;box-shadow:0 1px 4px #000}
#usa-decisions-ui .md-resources{display:flex;gap:20px;color:var(--md-muted);font-size:12px;flex-wrap:wrap}
#usa-decisions-ui .md-resources b{font-weight:500;color:var(--md-gold);padding-left:5px;font-variant-numeric:tabular-nums}
#usa-decisions-ui .md-workspace{display:grid;grid-template-columns:minmax(0,550px) minmax(0,1fr);gap:20px;padding:13px 16px 20px;align-items:start;background:linear-gradient(120deg,#1c231d,#121812)}
#usa-decisions-ui .md-window{background:rgba(18,21,18,.95);border:1px solid #65675b;box-shadow:inset 0 0 0 2px #161a17,0 3px 9px #0b0d0b;min-width:0;padding:0 8px 12px}
#usa-decisions-ui .md-window-heading{font-family:Georgia,'Times New Roman',serif;font-size:26px;letter-spacing:5px;padding:8px 16px 10px;color:#e5e3d5;text-shadow:0 2px 2px #000;border-bottom:1px solid #484d43}
#usa-decisions-ui .md-category{height:58px;display:grid;grid-template-columns:48px 1fr 19px;align-items:center;gap:5px;background-image:var(--md-category);background-repeat:no-repeat;background-size:100% 53px;background-position:center 5px;text-align:center;padding:0 10px;font-size:16px;letter-spacing:.3px;font-weight:500}

#usa-decisions-ui .md-status{min-height:20px;color:var(--md-text)}

#usa-decisions-ui .md-decision img{width:26px;height:26px;object-fit:contain}
#usa-decisions-ui .md-decision .md-row-title{overflow-wrap:anywhere}
#usa-decisions-ui .md-decision .md-price{display:flex;align-items:center;gap:5px;justify-content:flex-end;white-space:nowrap;color:var(--md-gold);font-variant-numeric:tabular-nums}
#usa-decisions-ui .md-decision .md-price em{font-style:normal;font-size:11px;color:var(--md-muted)}
#usa-decisions-ui .md-decision.is-locked{color:#a2a89d;background-color:#202720;background-blend-mode:luminosity}

#usa-decisions-ui .md-row-status{font-size:15px;color:var(--md-good)}

#usa-decisions-ui .md-inspector{min-width:0;background:#101410;border:1px solid #a3a185;box-shadow:inset 0 0 0 2px #272e25,0 5px 15px #080b08;padding:14px 15px;color:var(--md-text);font-size:13px}
#usa-decisions-ui .md-tooltip-title{color:var(--md-gold);font-size:16px;font-weight:500;margin-bottom:13px}
#usa-decisions-ui .md-description{white-space:pre-line;margin-bottom:15px;overflow-wrap:anywhere}
#usa-decisions-ui .md-requirements{margin:12px 0 16px;display:flex;flex-direction:column;gap:7px}
#usa-decisions-ui .md-req{display:grid;grid-template-columns:15px 1fr;gap:5px}
#usa-decisions-ui .md-req-mark{color:var(--md-good);font-size:15px}
#usa-decisions-ui .md-req.is-failed .md-req-mark{color:var(--md-bad)}
#usa-decisions-ui .md-req-title{color:var(--md-gold);margin-bottom:3px}
#usa-decisions-ui .md-effect-heading{background:linear-gradient(#4b3830,#2c2420);border-top:1px solid #796052;border-bottom:1px solid #111910;text-align:center;letter-spacing:1px;padding:4px 8px;margin:13px 0 9px;color:#eee9d6}

#usa-decisions-ui .md-effect-group img{width:23px;height:15px;object-fit:fill}
#usa-decisions-ui .md-effect-line{padding:2px 0 2px 10px;overflow-wrap:anywhere}
#usa-decisions-ui .md-effect-line.is-good{color:var(--md-good)}
#usa-decisions-ui .md-effect-line.is-bad{color:var(--md-bad)}
#usa-decisions-ui .md-effect-line.is-heading{padding-left:0;color:var(--md-gold);margin-top:10px}
#usa-decisions-ui .md-event-stage{padding:20px 12px 28px;display:flex;justify-content:center;align-items:flex-start;gap:20px;flex-wrap:wrap;background:linear-gradient(120deg,#1c231d,#121812);min-height:450px}
#usa-decisions-ui .md-event{width:581px;max-width:100%;color:var(--md-event-ink);font-family:'Courier New',monospace;filter:drop-shadow(0 6px 9px #0c100c)}

#usa-decisions-ui .md-event-top>div{position:absolute;left:14px;right:14px;top:69px;text-align:center;font-size:20px;font-weight:500}
#usa-decisions-ui .md-event-description{min-height:110px;box-sizing:border-box;padding:0 31px 12px;background-image:var(--md-event-mid);background-size:100% auto;background-repeat:repeat-y;font-size:15px;white-space:pre-line}
#usa-decisions-ui .md-event-bottom{box-sizing:border-box;min-height:206px;padding:5px 28px 30px 5px;background-image:var(--md-event-bottom);background-size:100% 100%;background-repeat:no-repeat;display:grid;grid-template-columns:217px minmax(0,300px);gap:2px}
#usa-decisions-ui .md-event-photo{width:217px;height:163px;max-width:100%;object-fit:contain}
#usa-decisions-ui .md-event-option{display:block;min-height:47px;box-sizing:border-box;width:100%;background-color:transparent;background-image:var(--md-event-option);background-size:100% 100%;border:0;color:var(--md-text);font-family:inherit;font-size:14px;padding:7px 14px;text-align:center}
#usa-decisions-ui .md-event-option:hover,#usa-decisions-ui .md-event-option.is-selected{filter:brightness(.93)}
#usa-decisions-ui .md-event-effect{width:300px;max-width:100%;margin-top:24px}
#usa-decisions-ui #icw-preview-caption{margin-top:8px}
#usa-decisions-ui [hidden]{display:none!important}
@media(max-width:800px){#usa-decisions-ui .md-workspace{grid-template-columns:minmax(0,1fr);gap:14px;padding:10px}#usa-decisions-ui .md-window{max-width:550px;width:100%;box-sizing:border-box;justify-self:center}#usa-decisions-ui .md-inspector{max-width:550px;width:100%;box-sizing:border-box;justify-self:center}#usa-decisions-ui .md-event-effect{margin-top:0}#usa-decisions-ui .md-event-stage{min-height:0}}
@media(max-width:500px){#usa-decisions-ui .md-chrome{padding:10px}#usa-decisions-ui .md-resources{gap:10px}#usa-decisions-ui .md-region{margin:0;padding:8px 5px}#usa-decisions-ui .md-meter-row{gap:6px;min-height:38px}#usa-decisions-ui .md-meter{width:52%;background-size:100% 16px}#usa-decisions-ui .md-meter>div{background-size:240px 16px}#usa-decisions-ui .md-category{font-size:14px;grid-template-columns:34px 1fr 12px;padding:0 3px}#usa-decisions-ui .md-decision{grid-template-columns:24px minmax(0,1fr) 48px;padding:5px;gap:5px;min-height:45px}#usa-decisions-ui .md-decision img{width:23px;height:23px}#usa-decisions-ui .md-window-heading{font-size:23px;padding-left:9px}#usa-decisions-ui .md-event-top>div{font-size:17px;top:62px}#usa-decisions-ui .md-event-bottom{display:flex;flex-direction:column;align-items:center;padding:7px 18px 25px;gap:8px}#usa-decisions-ui .md-event-photo{width:217px;height:163px}#usa-decisions-ui #icw-event-options{width:100%}#usa-decisions-ui .md-event-description{padding:0 20px 12px;font-size:14px}}
@media(prefers-reduced-motion:reduce){#usa-decisions-ui .md-meter>div{transition:none}}
</style>
<script type="application/json" id="icw-regional-preview-data">__REGIONAL_PREVIEW_DATA__</script>
<script>
(() => {
  const root = document.getElementById('usa-decisions-ui');
  const data = JSON.parse(document.getElementById('icw-regional-preview-data').textContent);
  const find = id => root.querySelector('#' + id);
  const valid = (value, values, fallback) => values.includes(value) ? value : fallback;
  let state = { country: 'irq', view: 'host', scene: 'crisis', recipient: 'host', selected: '' };
  const saved = window.openai?.widgetState;
  const restore = value => {
    const input = value?.privateContent || value?.modelContent || value;
    if (!input || typeof input !== 'object') return;
    state = { country:valid(input.country,Object.keys(data.examples),'irq'),view:valid(input.view,['host','usa','events'],'host'),scene:valid(input.scene,['crisis','peace','aftermath','warning'],'crisis'),recipient:valid(input.recipient,['host','usa','local','world'],'host'),selected:typeof input.selected==='string'?input.selected:'' };
  };
  restore(saved);
  const game = root.querySelector('.md-game');
  const textures = {tile:'tile',row:'row',category:'category',bar:'bar','bar-bg':'bar_bg','event-top':'event_top','event-mid':'event_mid','event-bottom':'event_bottom','event-option':'event_option'};
  Object.entries(textures).forEach(([key,value]) => game.style.setProperty('--md-'+key,`url("${data.assets[value]}")`));
  root.querySelectorAll('[data-asset]').forEach(img=>img.src=data.assets[img.dataset.asset]);
  const clean = text => String(text).replace(/§[A-Za-z!]/g,'').replace(/£[a-zA-Z_0-9]+/g,'');
  function textNode(tag,text,className) { const node=document.createElement(tag);node.textContent=clean(text);if(className)node.className=className;return node; }
  function effects(container,rows){
    container.replaceChildren();let group=null;
    rows.forEach(row=>{
      if(row.country!==group && row.tone!=='heading'){
        const heading=document.createElement('div');heading.className='md-effect-group';
        if(data.assets['flag_'+row.country]){const flag=document.createElement('img');flag.src=data.assets['flag_'+row.country];flag.alt='';heading.append(flag);}
        heading.append(textNode('span',data.countries[row.country]||row.country));container.append(heading);group=row.country;
      }
      container.append(textNode('div',row.text,'md-effect-line is-'+row.tone));
    });
  }
  function inspect(item){
    find('icw-tooltip-title').textContent=item.title;
    find('icw-tooltip-description').textContent=clean(item.description);
    const conditions=find('icw-tooltip-requirements');conditions.replaceChildren();
    if(item.requirements.length)conditions.append(textNode('div','Requires all of the following:','md-req-title'));
    item.requirements.forEach(req=>{
      const row=document.createElement('div');row.className='md-req'+(req.ok?'':' is-failed');
      row.append(textNode('span',req.ok?'✓':'✕','md-req-mark'),textNode('span',req.text));conditions.append(row);
    });
    effects(find('icw-tooltip-effects'),item.effects);
    root.querySelectorAll('.md-decision').forEach(button=>{const selected=button.dataset.decision===item.id;button.classList.toggle('is-selected',selected);button.setAttribute('aria-pressed',String(selected));});
  }
  function persist(){
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{country:state.country,view:state.view,scene:state.scene,selected:state.selected,recipient:state.recipient},privateContent:state}).catch(()=>{});
  }
  function render(){
    const example=data.examples[state.country][state.scene];
    find('icw-preview-country').value=state.country;find('icw-preview-view').value=state.view;find('icw-preview-scene').value=state.scene;find('icw-preview-recipient').value=state.recipient;
    const eventView=state.view==='events';
    find('icw-decisions-screen').hidden=eventView;find('icw-event-screen').hidden=!eventView;find('icw-scene-control').hidden=eventView;find('icw-recipient-control').hidden=!eventView;
    const player=state.view==='usa'||(eventView&&state.recipient==='usa')?'USA':example.tag;
    find('icw-player-flag').src=data.assets['flag_'+player];find('icw-player-name').textContent=data.countries[player];find('icw-treasury').textContent=player==='USA'?'$60.00 Billion':'$12.00 Billion';
    if(eventView){
      const event=data.examples[state.country].aftermath.events[state.recipient];
      find('icw-event-title').textContent=event.title;find('icw-event-description').textContent=event.description;
      root.querySelector('.md-event-photo').src=data.assets[event.photo];
      if(state.recipient==='world'){find('icw-player-name').textContent=data.countries.SOV;find('icw-player-flag').src=data.assets.flag_SOV;}
      if(state.recipient==='local'){const local={irq:'KUR',per:'KPI',tur:'KPT',syr:'KPS'}[state.country];find('icw-player-name').textContent=data.countries[local];find('icw-player-flag').src=data.assets['flag_'+local];}
      find('icw-event-options').replaceChildren();find('icw-event-effect').hidden=true;
      event.options.forEach(option=>{
        const button=textNode('button',option.label,'md-event-option cursor-interaction');button.type='button';
        button.addEventListener('click',()=>{root.querySelectorAll('.md-event-option').forEach(node=>node.classList.remove('is-selected'));button.classList.add('is-selected');find('icw-event-effect').hidden=!option.effects.length;effects(find('icw-option-effects'),option.effects);state.selected=option.label;persist();});
        find('icw-event-options').append(button);
      });
      find('icw-preview-caption').textContent='Fiktives Spielbeispiel: 10.000 kurdische Zivilisten getötet. Echtes Archivfoto von 1991 im nativen MD-Rahmen.';
      return;
    }
    find('icw-category-name').textContent=example.category;find('icw-region-heading').textContent=example.heading;
    find('icw-meter').setAttribute('aria-valuenow',example.unrest);find('icw-meter-fill').style.width=example.unrest+'%';find('icw-unrest').textContent='Unrest: '+example.unrest+'/100';
    find('icw-legacy').textContent=example.legacy;find('icw-region-status').textContent=example.status;find('icw-region-status').classList.toggle('is-warning',state.scene==='warning'||state.scene==='aftermath');
    const items=example.views[state.view];const list=find('icw-decision-list');list.replaceChildren();
    let selected=items.find(item=>item.id===state.selected);
    if(!selected)selected=items.find(item=>item.id.endsWith(state.view==='usa'?(state.scene==='warning'?'_provoke':'_intensify'):state.scene==='peace'?'_reform_integration':state.scene==='aftermath'?'_repression':'_security'))||items[0];
    items.forEach(item=>{
      const button=document.createElement('button');button.type='button';button.className='md-decision cursor-interaction'+(item.available?'':' is-locked');button.dataset.decision=item.id;button.setAttribute('aria-pressed',String(selected?.id===item.id));button.setAttribute('aria-label',item.title+(item.available?', requirements met':', requirements not met'));
      const icon=document.createElement('img');icon.src=data.assets.decision;icon.alt='';button.append(icon,textNode('span',item.title,'md-row-title'));
      const price=document.createElement('span');price.className='md-price';price.append(textNode('span',item.available?'✓':'✕','md-row-status'),textNode('span',String(item.cost)),textNode('em','PP'));button.append(price);
      button.addEventListener('click',()=>{state.selected=item.id;inspect(item);persist();});list.append(button);
    });
    if(selected){state.selected=selected.id;inspect(selected);}
    find('icw-preview-caption').textContent='Beispielwerte: '+example.country+' GDP $40 Billion. US GDP $1,000 Billion. Divisionen in der Region: '+example.divisions+'.';
  }
  [['icw-preview-country','country'],['icw-preview-view','view'],['icw-preview-scene','scene'],['icw-preview-recipient','recipient']].forEach(([id,key])=>find(id).addEventListener('change',event=>{state[key]=event.target.value;state.selected='';render();persist();}));
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
  render();
})();
</script>
