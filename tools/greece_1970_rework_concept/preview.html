<!-- IMPERIA COLD WAR — Greece January 1970 approval concept. Native assets, external font and approximate connectors. -->
<div id="greece-1970-concept">
  <style>
    #greece-1970-concept{--gre-bg:#202b2b;--gre-panel:#2c3836;--gre-ink:#e6e7d9;--gre-dim:#c0c8bc;--gre-line:#7d8b7c;--gre-gold:#d4b66e;--gre-good:#8fcc98;--gre-bad:#e79e86;--gre-edge:#56665d;color:var(--gre-ink);font:14px/1.45 Georgia,serif;color-scheme:dark}
    #greece-1970-concept *{box-sizing:border-box}
    #greece-1970-concept .gre-app{background:var(--gre-bg);border:1px solid var(--gre-edge)}
    #greece-1970-concept .gre-head{padding:15px 110px 12px 16px;background:var(--gre-panel);border-bottom:1px solid var(--gre-edge)}
    #greece-1970-concept h2{font-size:21px;font-weight:500;margin:0 0 3px;color:var(--gre-gold)}
    #greece-1970-concept h3{font-size:17px;font-weight:500;margin:10px 0 6px;color:var(--gre-gold)}
    #greece-1970-concept h4{font-size:15px;font-weight:500;margin:12px 0 5px;color:var(--gre-gold)}
    #greece-1970-concept p{margin:6px 0 10px}
    #greece-1970-concept button,#greece-1970-concept select{font:14px/1.35 Georgia,serif;color:var(--gre-ink);background:var(--gre-panel);border:1px solid var(--gre-edge);border-radius:2px;padding:7px 10px;min-height:34px;max-width:100%}
    #greece-1970-concept button[aria-pressed=true],#greece-1970-concept button[aria-selected=true]{border-color:var(--gre-gold);color:var(--gre-gold);background:#38463d}
    #greece-1970-concept button:hover{border-color:var(--gre-gold)}
    #greece-1970-concept button:disabled{opacity:.5}
    #greece-1970-concept .gre-tabs{display:flex;gap:5px;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--gre-edge)}
    #greece-1970-concept .gre-small{font-size:12px;color:var(--gre-dim)}
    #greece-1970-concept .gre-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px}
    #greece-1970-concept .gre-controls select{flex:1;min-width:170px}
    #greece-1970-concept .gre-map{position:relative;overflow:hidden;height:490px;touch-action:none;background:radial-gradient(ellipse at center,#2b3935 0,#1b2525 100%);border-block:1px solid var(--gre-edge)}
    #greece-1970-concept .gre-world{position:absolute;transform-origin:0 0;width:5000px;height:2700px}
    #greece-1970-concept .gre-links{position:absolute;inset:0;overflow:visible;width:5000px;height:2700px;pointer-events:none}
    #greece-1970-concept .gre-links path{fill:none;stroke:var(--gre-line);stroke-width:2}
    #greece-1970-concept .gre-links .gre-ex{stroke:var(--gre-bad);stroke-dasharray:5 5}
    #greece-1970-concept .gre-focus{position:absolute;width:165px;height:128px;border:none;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;min-height:0}
    #greece-1970-concept .gre-focus:hover,#greece-1970-concept .gre-focus[aria-pressed=true]{background:transparent;border:none}
    #greece-1970-concept .gre-focus img{display:block;width:96px;height:70px;object-fit:contain;filter:drop-shadow(0 3px 2px #111a18)}
    #greece-1970-concept .gre-focus span{display:flex;align-items:center;justify-content:center;width:147px;min-height:43px;padding:3px 4px;color:var(--gre-ink);background:#1c2726;border:1px solid var(--gre-edge);font-size:14px;line-height:1.15;text-align:center}
    #greece-1970-concept .gre-focus[aria-pressed=true] span{border-color:var(--gre-gold);color:var(--gre-gold)}
    #greece-1970-concept .gre-world.gre-overview .gre-focus span{visibility:hidden}
    #greece-1970-concept .gre-group-title{position:absolute;white-space:nowrap;color:var(--gre-gold);font-size:19px;pointer-events:none;transform-origin:0 0}
    #greece-1970-concept .gre-caption{padding:5px 10px;color:var(--gre-dim);font-size:12px}
    #greece-1970-concept .gre-inspector{padding:13px 16px;border-top:1px solid var(--gre-edge);overflow-wrap:anywhere}
    #greece-1970-concept .gre-detail-head{display:flex;align-items:center;gap:12px}
    #greece-1970-concept .gre-detail-head img{width:65px;height:60px;object-fit:contain}
    #greece-1970-concept .gre-detail-head h3{margin:0}
    #greece-1970-concept .gre-effect-list{list-style:none;padding:0;margin:4px 0 10px}
    #greece-1970-concept .gre-effect-list li{padding:2px 0 2px 10px;border-left:2px solid var(--gre-edge)}
    #greece-1970-concept .gre-positive{color:var(--gre-good)}
    #greece-1970-concept .gre-negative{color:var(--gre-bad)}
    #greece-1970-concept .gre-list{padding:6px 16px 16px}
    #greece-1970-concept .gre-entry{padding:10px 0;border-bottom:1px solid var(--gre-edge)}
    #greece-1970-concept .gre-entry:last-child{border-bottom:0}
    #greece-1970-concept a{color:var(--gre-gold)}
    #greece-1970-concept .gre-req{color:var(--gre-dim);margin:5px 0}
    #greece-1970-concept .gre-choice-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    #greece-1970-concept .gre-road-stage{padding:10px 0;border-bottom:1px solid var(--gre-edge)}
    #greece-1970-concept .gre-road-stage button{width:100%;height:100%;text-align:left}
    #greece-1970-concept .gre-road-stage .gre-small{display:block;margin-top:4px}
    #greece-1970-concept details{margin-top:8px}
    #greece-1970-concept summary{color:var(--gre-gold)}
    #greece-1970-concept [hidden]{display:none!important}
    #greece-1970-concept .gre-metadata{display:flex;gap:5px 16px;flex-wrap:wrap;color:var(--gre-dim)}
    @media(max-width:480px){#greece-1970-concept .gre-head{padding-right:95px}#greece-1970-concept .gre-choice-row{grid-template-columns:1fr}#greece-1970-concept .gre-map{height:420px}#greece-1970-concept .gre-tabs button{flex:1 1 30%}#greece-1970-concept .gre-controls{gap:4px}#greece-1970-concept .gre-inspector{padding:12px}}
    @media(pointer:coarse){#greece-1970-concept button,#greece-1970-concept select{min-height:44px}#greece-1970-concept .gre-focus{min-height:128px}}
  </style>
  <div class="gre-app">
    <header class="gre-head"><h2>Greece: January 1970</h2><div class="gre-small">100-focus replacement concept. Awaiting approval.</div></header>
    <div class="gre-tabs" role="tablist" aria-label="Greek focus concept">
      <button type="button" role="tab" aria-selected="true" data-tab="tree">Focus tree</button>
      <button type="button" role="tab" aria-selected="false" data-tab="start">Starting spirits</button>
      <button type="button" role="tab" aria-selected="false" data-tab="war">Road to war</button>
      <button type="button" role="tab" aria-selected="false" data-tab="deals">Agreements</button>
      <button type="button" role="tab" aria-selected="false" data-tab="basis">1970 and scope</button>
    </div>
    <section data-panel="tree" role="tabpanel">
      <div class="gre-controls"><label for="gre-chapter" class="gre-small">Section</label><select id="gre-chapter" aria-label="Focus tree section"></select><button type="button" data-zoom="out" aria-label="Zoom out">−</button><button type="button" data-zoom="in" aria-label="Zoom in">+</button><button type="button" data-fit>Fit width</button><button type="button" data-whole>Whole section</button><span data-zoom-text class="gre-small"></span></div>
      <div class="gre-controls"><label for="gre-focus-nav" class="gre-small">Focus</label><select id="gre-focus-nav" aria-label="Inspect any focus in the section"></select></div>
      <div class="gre-map" aria-label="National focus tree. Drag to pan; select a focus for its complete effects."><div class="gre-world"><svg class="gre-links" aria-hidden="true"></svg><div data-nodes></div><div data-group-titles></div></div></div>
      <div class="gre-caption">Drag to pan. Native 96 × 130 grid and existing icons. Dashed red: mutually exclusive. External font and connector approximation.</div>
      <div class="gre-inspector" data-inspector aria-live="polite"></div>
    </section>
    <section data-panel="start" role="tabpanel" hidden><div class="gre-list" data-start></div></section>
    <section data-panel="war" role="tabpanel" hidden>
      <div class="gre-list" data-road></div><div class="gre-inspector" data-war-inspector aria-live="polite"></div>
    </section>
    <section data-panel="deals" role="tabpanel" hidden><div class="gre-controls"><label for="gre-deal" class="gre-small">Proposed agreement</label><select id="gre-deal"></select></div><div class="gre-list" data-deal-body aria-live="polite"></div></section>
    <section data-panel="basis" role="tabpanel" hidden><div class="gre-list" data-basis></div></section>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('greece-1970-concept');
    const d=/*__CONCEPT_DATA__*/;
    const $=s=>root.querySelector(s),$$=s=>Array.from(root.querySelectorAll(s));
    const by=Object.fromEntries(d.focuses.map(f=>[f.key,f]));
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let state={tab:'tree',chapter:'all',focus:'constitution',deal:'usa',war:'gre_network'};
    function applySaved(w){const m=w?.modelContent;if(m?.country==='GRE'&&m?.concept==='R2'){if(by[m.selectedFocus])state.focus=m.selectedFocus;if(d.offers[m.selectedAgreement])state.deal=m.selectedAgreement;}const p=w?.privateContent;if(p?.concept==='GRE_R2'){if(['tree','start','war','deals','basis'].includes(p.tab))state.tab=p.tab;if(p.chapter==='all'||d.groups.some(g=>g.key===p.chapter))state.chapter=p.chapter;}}
    applySaved(window.openai?.widgetState);
    function save(){window.openai?.setWidgetState?.({modelContent:{country:'GRE',concept:'R2',selectedFocus:state.focus,focusTitle:by[state.focus].title,selectedAgreement:state.deal},privateContent:{concept:'GRE_R2',tab:state.tab,chapter:state.chapter}})?.catch(()=>{});}
    const sign=(k,n)=>k.endsWith('_drift')?(n>=0?'+':'')+n:(n>=0?'+':'')+Number((n*100).toFixed(3))+'%';
    const valLines=v=>Object.entries(v||{}).map(([k,n])=>(d.modifier_labels[k]||k)+': '+sign(k,n));
    function lineHTML(s){let cls='';const cost=/cost|budget|training time|xp cost|expense/i.test(s);const pos=/\+\d/.test(s),neg=/-\d/.test(s);if(pos&&!neg)cls=cost?'gre-negative':'gre-positive';if(neg&&!pos)cls=cost?'gre-positive':'gre-negative';return '<li class="'+cls+'">'+esc(s)+'</li>';}
    const list=a=>'<ul class="gre-effect-list">'+a.map(lineHTML).join('')+'</ul>';
    function effect(e){switch(e.type){
      case'modifier':case'temporary':return '<h4>'+esc(e.spirit)+(e.days?' ('+e.days+' days)':'')+'</h4>'+list(valLines(e.values));
      case'building':return list([d.state_names[e.state]+': State shared building slots +'+e.shared_slots,d.state_names[e.state]+': '+d.building_names[e.building]+' +'+e.levels]);
      case'research':case'doctrine':return list([e.uses+' × '+e.bonus*100+'% '+(e.type==='research'?'research bonus':'doctrine cost reduction')+': '+d.technology_names[e.category]]);
      case'remove_spirit':{const s=d.starting_spirits.find(s=>s.name===e.name);return '<h4>Remove '+esc(e.name)+'</h4>'+list(s?valLines(Object.fromEntries(Object.entries(s.values).map(([k,v])=>[k,-v]))):[]);}
      case'experience':return list([e.service[0].toUpperCase()+e.service.slice(1)+' experience +'+e.value]);
      case'manpower':return list(['Military manpower '+(e.amount>=0?'+':'')+e.amount.toLocaleString('en-US')]);
      case'equipment':return list([e.label+' '+(e.amount>=0?'+':'')+e.amount.toLocaleString('en-US')]);
      case'units':return list(['Cyprus: +'+e.count+' divisions, '+e.template,'Per division: '+e.manpower_each.toLocaleString('en-US')+' manpower; '+e.combat_width+' combat width; six light infantry battalions','Full manpower and equipment on arrival',...Object.entries(e.equipment_each).map(([k,v])=>'In each division: '+d.equipment_labels[k]+' +'+v.toLocaleString('en-US'))]);
      case'native_action':return list([e.text]);
      case'existing_actor':return list(e.effects);
      case'offer':return agreement(e.key,true);
      case'conditional_transaction':return '<h4>'+esc(e.label)+'</h4>'+list(['Weekly expense: +'+e.weekly_gdp_percent+'% Greek GDP'])+e.effects.map(effect).join('');
      case'political_power':return list(['Political power '+(e.amount>=0?'+':'')+e.amount]);
      case'opinion':return list(['Opinion of '+d.countries[e.target]+' '+(e.amount>=0?'+':'')+e.amount+' ('+e.days+' days)']);
      case'wargoal':return list(['Greece: gain '+e.label+' war goal against Cyprus'+(e.goal_type==='take_state_focus'?': '+d.state_names[145]:'')+(e.expiry_days?' ('+e.expiry_days+' days)':'')]);
      case'annexation':return list(['Annex Cyprus',...e.states.map(s=>d.state_names[s]+': ownership to Greece'),'Transfer existing Cyprus-owned forces to Greece']);
      case'country_cession':return list(['Cyprus is annexed by Greece',...e.states.map(s=>d.state_names[s]+': ownership to Greece'),'Cypriot forces and public accounts transfer to Greece']);
      case'ledger_succession':return list(['Treasury: add current signed Cypriot treasury','National debt: add current Cypriot debt','International investments: transfer current Cypriot assets and liabilities']);
      case'union_integration':{let h='';for(const v of Object.values(e.variants)){h+='<h4>'+esc(v.label)+'</h4>'+list(['Political power -'+e.pp_cost,'Treasury: -'+v.setup_gdp_percent+'% Greek GDP','Remove '+v.remove,...valLines(Object.fromEntries(Object.entries(v.remove_values).map(([k,n])=>[k,-n]))),'Weekly expense: -'+v.stop_weekly_gdp_percent+'% Greek GDP',...v.states.map(s=>'Greek core: '+d.state_names[s])]);}return h+'<h4>'+esc(e.settlement_spirit)+'</h4>'+list(valLines(e.values).concat(['Weekly expense: +'+e.weekly_after_gdp_percent+'% Greek GDP']));}
      default:return'';
    }}
    function source(k){const s=d.sources[k];return '<a href="'+esc(s.url)+'" target="_blank" rel="noreferrer">'+esc(s.title)+'</a>';}
    function agreement(key,embedded=false){const o=d.offers[key];let h='<h3>'+(embedded?'If they accept: ':'')+esc(o.name)+'</h3>'+(embedded?'':'<p class="gre-req">'+esc(o.requirements)+'</p>');if(o.dynamic_recipients)h+='<p class="gre-small">January 1970 recipients: '+o.recipients.map(t=>esc(d.countries[t])).join(', ')+'. Each receives the terms below.</p>';
      for(const[tag,s]of Object.entries(o.sides)){const basis=s.basis==='own'?'own GDP':'Greek GDP';h+='<h4>'+esc(d.countries[tag]||'Each actual Community member')+': '+esc(s.spirit||s.label||'')+'</h4>';let a=[];if(s.setup_gdp_percent)a.push('Treasury: -'+s.setup_gdp_percent+'% of '+basis+' once');if(s.weekly_gdp_percent)a.push('Weekly expense: +'+s.weekly_gdp_percent+'% of '+basis);if(s.weekly_formula)a.push('Weekly expense: +'+s.weekly_formula.per_recipient_gdp_percent+'% Greek GDP per actual member; +'+s.weekly_formula.preview_gdp_percent+'% for six members (January 1970 preview)');if(s.income_gdp_percent)a.push('Weekly income: +'+s.income_gdp_percent+'% of '+basis);h+=list(a.concat(valLines(s.values)))+s.effects.map(effect).join('');}
      if(o.refusal)h+='<h3>If Cyprus refuses</h3>'+o.refusal.effects.map(effect).join('');
      if(o.native_membership_values)h+='<h4>Greece: native Community membership</h4>'+list(valLines(o.native_membership_values))+'<p class="gre-req">'+esc(o.replaces)+'</p><details><summary>Current Community laws</summary><p>'+esc(o.native_law_preview)+'</p><p class="gre-small">The historical concept does not assume a fixed passed-law set. Exact live law values must be shown by the native preview before this offer can be accepted.</p></details>';
      h+='<details><summary>Consent and '+(o.kind==='unit_transfer'?'delivery':o.kind==='territorial_union'?'territorial':'standing')+' terms</summary><p>'+esc(o.acceptance)+'</p><p>'+esc(o.validity)+'</p><p class="gre-small">'+esc(o.dynamic_recipients||'')+'</p>'+source(o.basis)+'</details>';
      if(o.turkish_window)h+='<details><summary>Turkish reaction: 30 days</summary><p>'+esc(o.turkish_window.options.join(' / '))+'</p><p>'+esc(o.turkish_window.military_response)+'</p><p>'+esc(o.turkish_window.resume)+'</p></details>';
      if(o.kind==='territorial_union')h+='<p class="gre-small">No immediate Greek cores. Existing British sovereign bases are outside the territory transferred. Exact current Cypriot public balances and force counts must accompany the live offer.</p>';
      if(o.refusal)h+='<details><summary>Refusal and armed escalation</summary><p>An explicit Cypriot refusal grants this war goal once. Silence, expiry or another guarantor refusal does not. Greece chooses whether to declare war.</p><p>'+esc(o.refusal.turkish_entry.when)+'</p><p>'+esc(o.refusal.turkish_entry.nato)+'</p></details>';
      return h;}
    function inspect(key,target){const f=by[key];let h='<div class="gre-detail-head"><img alt="" src="'+d.images[f.icon_theme]+'"><div><h3>'+esc(f.title)+'</h3><div class="gre-small">'+f.days+' days · Grid '+f.x+', '+f.y+'</div></div></div><p>'+esc(f.description)+'</p>';
      if(f.party_trigger)h+='<div class="gre-req">Required party: '+esc(f.required_party)+'<span class="gre-small">'+(f.party_slot===1?' (ERE in 1970; later New Democracy)':f.party_slot===3?' (PAK exile movement in 1970; later PASOK)':'')+'</span></div>';
      if(f.leader)h+='<div class="gre-req">Required leader: '+esc(f.leader)+'</div>';
      if(f.requirements)h+='<div class="gre-req">'+esc(f.requirements)+'</div>';
      h+='<div class="gre-req">Predecessors: '+(f.prerequisites.map(g=>'('+g.map(k=>esc(by[k].title)).join(' OR ')+')').join(' AND ')||'None')+'</div>';
      if(f.exclusive.length)h+='<div class="gre-req">Mutually exclusive with: '+f.exclusive.map(k=>esc(by[k].title)).join(', ')+'</div>';
      for(const e of f.effects)if(e.type==='offer')h+='<div class="gre-req">'+esc(d.offers[e.key].requirements)+'</div>';
      let money=[];if(f.setup_gdp_percent)money.push('Treasury: -'+f.setup_gdp_percent+'% Greek GDP once');if(f.weekly_gdp_percent)money.push('Weekly expense: +'+f.weekly_gdp_percent+'% Greek GDP');
      h+='<h4>Effects</h4>'+list(money)+f.effects.map(effect).join('');
      if(f.programme_ownership)h+='<details><summary>Programme conditions</summary><p>'+esc(f.programme_ownership.activation)+'</p></details>';
      if(f.weekly_lifetime)h+='<p class="gre-req">'+esc(f.weekly_lifetime)+'</p>';
      if(f.cleanup)h+='<details><summary>Preparation lifetime</summary><p>'+esc(f.cleanup)+'</p></details>';
      h+='<details><summary>Historical basis and identifier</summary>'+source(f.source)+'<p class="gre-small">'+esc(f.id)+'</p></details>';
      target.innerHTML=h;}
    const map=$('.gre-map'),world=$('.gre-world');let view={scale:.75,x:0,y:0};
    function transform(){world.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.scale+')';world.classList.toggle('gre-overview',view.scale<.55);$('[data-zoom-text]').textContent=Math.round(view.scale*100)+'%';const short={constitution:'Constitution',economy:'Economy',defence:'Defence',foreign:'Diplomacy',cyprus:'Cyprus',junta:'Junta',right:'Conservatives',centre:'Centre',socialist:'Socialists',left:'Communists',crown:'Crown'};$$('.gre-group-title').forEach((el,i)=>{el.style.transform='scale('+Math.max(1,.75/view.scale)+')';el.textContent=view.scale<.3?short[d.groups[i].key]:d.groups[i].title;el.hidden=view.scale<.12;});}
    function point(f){return{x:150+f.x*96,y:80+f.y*130};}
    function fit(){const fs=state.chapter==='all'?d.focuses:d.focuses.filter(f=>f.group===state.chapter);const xs=fs.map(f=>point(f).x),ys=fs.map(f=>point(f).y);const minX=Math.min(...xs)-90,maxX=Math.max(...xs)+90,minY=Math.min(...ys)-40,maxY=Math.max(...ys)+135;view.scale=state.chapter==='all'?Math.min(1,(map.clientWidth-28)/(maxX-minX),(map.clientHeight-26)/(maxY-minY)):Math.max(.8,Math.min(1,(map.clientWidth-28)/(maxX-minX)));view.x=(map.clientWidth-(maxX-minX)*view.scale)/2-minX*view.scale;view.y=state.chapter==='all'?(map.clientHeight-(maxY-minY)*view.scale)/2-minY*view.scale:20-minY*view.scale;transform();}
    const ns=$('[data-nodes]');ns.innerHTML=d.focuses.map(f=>{const p=point(f);return '<button type="button" class="gre-focus cursor-interaction" data-focus="'+f.key+'" style="left:'+(p.x-82.5)+'px;top:'+p.y+'px" aria-label="'+esc(f.title)+'" aria-pressed="false"><img alt="" draggable="false" src="'+d.images[f.icon_theme]+'"><span>'+esc(f.title)+'</span></button>';}).join('');
    function route(a,b){const p=point(a),q=point(b);let sx=p.x,sy=p.y+112,ex=q.x,ey=q.y-4;if(a.key==='external_room'&&['yugoslav_corridor','bulgarian_trade'].includes(b.key)){return 'M '+sx+' '+sy+' V '+(sy+4)+' H '+ex+' V '+ey;}const mid=(sy+ey)/2;return'M '+sx+' '+sy+' V '+mid+' H '+ex+' V '+ey;}
    let links='';
    for(const f of d.focuses){
      for(const g of f.prerequisites){
        if(g.length===1)links+='<path d="'+route(by[g[0]],f)+'"/>';
        else{const ps=g.map(k=>point(by[k])),q=point(f);const mid=(Math.max(...ps.map(p=>p.y+112))+q.y-4)/2;for(const p of ps)links+='<path d="M '+p.x+' '+(p.y+112)+' V '+mid+' H '+q.x+'"/>';links+='<path d="M '+q.x+' '+mid+' V '+(q.y-4)+'"/>';}
      }
      for(const k of f.exclusive){if(f.key<k){const [p,q]=[point(f),point(by[k])].sort((a,b)=>a.x-b.x);links+='<path class="gre-ex" d="M '+(p.x+70)+' '+(p.y+45)+' H '+(q.x-70)+'"/>';}}
    }
    $('.gre-links').innerHTML=links;
    $('[data-group-titles]').innerHTML=d.groups.map(g=>{const f=d.focuses.find(f=>f.group===g.key),p=point(f);return '<span class="gre-group-title" style="left:'+(p.x-100)+'px;top:'+(p.y-48)+'px">'+esc(g.title)+'</span>';}).join('');
    const chapter=$('#gre-chapter');chapter.innerHTML='<option value="all">Full overview: 100 focuses</option>'+d.groups.map(g=>'<option value="'+g.key+'">'+esc(g.title)+' ('+g.count+')</option>').join('');chapter.value=state.chapter;
    function focusNav(){const fs=state.chapter==='all'?d.focuses:d.focuses.filter(f=>f.group===state.chapter);$('#gre-focus-nav').innerHTML=fs.map(f=>'<option value="'+f.key+'">'+esc(f.title)+'</option>').join('');$('#gre-focus-nav').value=state.focus;}
    function selectFocus(key){state.focus=key;if(state.chapter!=='all'&&state.chapter!==by[key].group){state.chapter=by[key].group;chapter.value=state.chapter;}$$('[data-focus]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.focus===key)));focusNav();inspect(key,$('[data-inspector]'));}
    $('#gre-focus-nav').onchange=()=>{const k=$('#gre-focus-nav').value;selectFocus(k);const p=point(by[k]);view.x=map.clientWidth/2-p.x*view.scale;view.y=50-p.y*view.scale;transform();save();};
    $$('[data-focus]').forEach(el=>el.addEventListener('click',()=>{if(wasDragged)return;selectFocus(el.dataset.focus);save();}));
    chapter.onchange=()=>{map.style.height='';state.chapter=chapter.value;const f=d.focuses.find(f=>state.chapter==='all'?f.key===state.focus:f.group===state.chapter);if(f)selectFocus(f.key);fit();save();};
    $('[data-fit]').onclick=()=>{map.style.height='';fit();};
    $('[data-whole]').onclick=()=>{fit();if(state.chapter!=='all'){const fs=d.focuses.filter(f=>f.group===state.chapter),ys=fs.map(f=>point(f).y);map.style.height=((Math.max(...ys)-Math.min(...ys)+200)*view.scale+40)+'px';fit();}};
    $$('[data-zoom]').forEach(b=>b.onclick=()=>{const old=view.scale;view.scale=Math.max(.1,Math.min(1.5,old*(b.dataset.zoom==='in'?1.3:1/1.3)));view.x=map.clientWidth/2-(map.clientWidth/2-view.x)*view.scale/old;view.y=map.clientHeight/2-(map.clientHeight/2-view.y)*view.scale/old;transform();});
    let drag=null,wasDragged=false;map.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};wasDragged=false;});map.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>7)wasDragged=true;if(wasDragged){view.x=drag.vx+dx;view.y=drag.vy+dy;transform();}});window.addEventListener('pointerup',()=>{drag=null;setTimeout(()=>wasDragged=false,0);});map.addEventListener('pointerleave',()=>drag=null);
    function spiritPanel(){return '<h3>January 1970 national spirits</h3>'+d.starting_spirits.map(s=>'<div class="gre-entry"><h4>'+esc(s.name)+'</h4><p>'+esc(s.description)+'</p>'+list(s.effect_lines)+'<div class="gre-req">'+esc(s.remedy)+'</div></div>').join('');}
    $('[data-start]').innerHTML=spiritPanel();

    $('[data-road]').innerHTML='<h3>The Cyprus crisis</h3><div class="gre-road-stage"><h4>1. Greek influence: choose a policy</h4><div class="gre-choice-row">'+roadButton('gre_treaty','Durable cooperation. Penetration -10. Foreign influence defence +5%, stability +2%.')+roadButton('gre_network','Clandestine influence. Penetration +20; 50 PP and 0.25% Cyprus GDP; stability -2%.')+'</div></div><div class="gre-road-stage"><h4>2. Prepare, withdraw or launch</h4>'+roadButton('staff_network','Optional: +10 penetration for up to 180 days. 0.75% Greek GDP; planning +20%, office yield -5%.')+'<div class="gre-choice-row" style="margin-top:8px">'+roadButton('gre_withdraw','Withdraw -20 penetration, plus the separate -10 preparation if still active. Stability +3%.')+roadButton('gre_coup','100 PP and 0.5% Cyprus GDP. Cyprus receives a 14-day warning. No sovereignty transfer.')+'</div><p class="gre-small">Starting example: 45 penetration +20 network =65. Captured defence: 40 +25 preparedness =65. A tie defends. With staff preparation: 75 exceeds 65. A Cypriot safeguard of +25 preparedness raises defence to90 and defeats that attempt.</p></div><div class="gre-road-stage"><h4>3. Success or a negotiated settlement</h4><div class="gre-choice-row">'+roadButton('operational_initiative','After actual success: 180-day planning +25%, maximum planning +10%, invasion preparation +15%; office yield -10%, influence defence -10%; 0.003% GDP weekly.')+roadButton('guarantee_settlement','Four governments and both Cypriot communities must agree. Persistent security benefits, reciprocal restraint and no forced Enosis.')+'</div></div><div class="gre-road-stage"><h4>4. Turkey answers the constitutional rupture</h4><div class="gre-choice-row"><button type="button" data-tur="intervene">Authorize intervention<span class="gre-small">75 PP; 0.5% Turkish GDP. Actual war. 180-day naval organization +15%, invasion preparation +50%, amphibious attack +15%, planning +30%, maximum planning +20%. Weekly expense +0.005% Turkish GDP.</span></button><button type="button" data-tur="refuse">Refuse or let the deadline expire<span class="gre-small">Unresolved 30-day window: Angry General Staff for 180 days. Stability -10%, army organization -10%, political power gain -15%. Fixed pressure and coup deadlines; Turkey retains its own response.</span></button></div></div><div class="gre-road-stage"><h4>5. Greece answers the actual Turkish-Cypriot war</h4><div class="gre-choice-row">'+roadButton('gre_volunteers','Cypriot consent and real Greek formations. +2 volunteer capacity, relaxed native thresholds; 50 PP and 0.002% Greek GDP weekly.')+roadButton('gre_escalate','100 PP and 0.5% Greek GDP. Join Cyprus against Turkey. Both prior members temporarily leave NATO, then return after the relevant peace.')+'</div><p class="gre-small">Full temporary NATO withdrawal by both states is the requested alternative-history rule. Historically Greece left the integrated command in1974, retained Alliance membership and returned to the command structure in1980.</p></div>';
    $('[data-road-focus="gre_escalate"] .gre-small').textContent='Full Greek military entry. 100 PP and 0.5% GDP; both prior members leave NATO for the related war. 180-day joint command: army and naval organization +10%, planning +25%, maximum planning +15%, amphibious attack +20%, invasion preparation +30%; office yield -10% and weekly expense +0.005% Greek GDP.';
    $('[data-road]').querySelector('h3').insertAdjacentHTML('afterend','<div class="gre-road-stage"><h4>Before the landing: supply formed divisions</h4>'+roadButton('reinforce_guard','Cyprus receives two full-strength 18-width infantry divisions immediately on consent. Greece loses 2,400 manpower, 2,400 infantry weapons and 240 each light anti-tank, anti-air and command equipment. This package is independent of the later volunteer or full-war choice.')+'</div>');
    $('[data-road]').insertAdjacentHTML('beforeend','<div class="gre-road-stage"><h4>6. From the successful coup to Enosis</h4><div class="gre-choice-row">'+roadButton('enosis_full','Both Cypriot states join Greece, including existing ports, airfields and armed forces. 150 PP, 1.5% Greek GDP and substantial interim penalties. A separate Turkish response can lead to war before the union.')+roadButton('enosis_compromise','Only the south joins Greece after an actual settled partition and real CYP/TUR/ENG consent, plus NCY if applicable. 100 PP and 0.75% GDP; smaller interim penalties. The northern settlement is recognized.')+'</div><div style="margin-top:8px">'+roadButton('cypriot_settlement','After 730 days, 70 compliance and actual peace: regional representation, minority rights and Greek cores in the states actually transferred. Integration costs 100 PP plus 0.5% Greek GDP per state. Benefits retain a funded local administration.')+'</div></div>');
    $('[data-road-focus="gre_volunteers"]').closest('.gre-road-stage').querySelector('h4').textContent='5. Greece answers the war between Turkey and Cyprus';
    const roadSummary=(key,text)=>{$('[data-road-focus="'+key+'"] .gre-small').textContent=text;};

    roadSummary('staff_network','Optional preparation: +10 penetration; '+by.staff_network.setup_gdp_percent+'% Greek GDP once and '+by.staff_network.weekly_gdp_percent+'% per week only while Forward Operational Planning is active, at most 180 days. Planning +20%, office yield -5%.');
    roadSummary('operational_initiative','After actual coup success: 180-day planning +25%, maximum planning +10%, invasion preparation +15%; office yield -10%, influence defence -10%. Weekly expense '+by.operational_initiative.weekly_gdp_percent+'% Greek GDP ends with this spirit.');
    roadSummary('gre_volunteers','Cypriot consent and real formations. 50 PP; '+by.gre_volunteers.budget_binding.weekly_gdp_percent+'% Greek GDP per week only while the actual mission and deployment are active. +2 volunteer capacity.');
    roadSummary('gre_escalate','Full military entry. 100 PP and '+actorPrice('gre_escalate')+'% Greek GDP once. Expeditionary command lasts at most 180 days: organization +10%, planning +25%, maximum planning +15%, amphibious attack +20%, invasion preparation +30%; office yield -10%. Its '+expedition.weekly_gdp_percent+'% weekly expense ends with the spirit. NATO separation lasts for the actual related war.');
    const fullPrice=d.offers.enosis_full.sides.GRE,southPrice=d.offers.enosis_south.sides.GRE;
    roadSummary('enosis_full','Both Cypriot states join Greece with existing assets and forces. 150 PP, '+fullPrice.setup_gdp_percent+'% Greek GDP once and '+fullPrice.weekly_gdp_percent+'% per week while Unsettled Enosis is active. A Turkish challenge can lead to war; Cypriot refusal grants the annexation goal.');
    roadSummary('enosis_compromise','Only the south joins Greece after a real settled partition. 100 PP, '+southPrice.setup_gdp_percent+'% Greek GDP once and '+southPrice.weekly_gdp_percent+'% per week while Southern Union Administration is active. Cypriot refusal grants the southern state goal.');
