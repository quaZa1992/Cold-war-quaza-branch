 const designs=[...root.querySelectorAll('.newspaper')];
 const defaults={depth:85,texture:true,layers:true,textSize:16,photoSize:'Full width',sample:'Standard report'};
 const standardTitle='Violence around the West Bank Settlements';
 const longTitle='Violence around the West Bank Settlements Raises New Questions over Land Policy, Military Administration and the Protection of Civilians';
 const paragraphs=[
  'Violence around Israeli settlements in the West Bank has brought renewed attention to the conduct of armed civilian groups. Palestinian residents report attacks on homes and farmland, while military authorities face pressure to restore public order.',
  'The confrontation has intensified an already difficult dispute over land, security and military administration. The government\'s response may affect relations with neighbouring states and its standing among foreign governments.',
  'Officials must now weigh the demands of settlement organisations against the responsibilities of the military administration. No common position has yet been announced. The dispute continues to divide the political parties.'
 ];
 const options=['The dispute continues.','Request a briefing.','Prepare a public response.','Monitor further developments.'];
 const states=new Map(designs.map(el=>[el.dataset.design,{...defaults}]));
 const filed=new Map(designs.map(el=>[el.dataset.design,new Set()]));
 let latestDesign='World Ledger',layoutFrame=0;
 function save(){
  if(!window.openai?.setWidgetState)return;
  window.openai.setWidgetState({modelContent:{project:'IMPERIA COLD WAR',study:'Detailed newspaper concepts',last_edited_design:latestDesign,settings:{...states.get(latestDesign)}},privateContent:{preferences:Object.fromEntries(states),filed:Object.fromEntries([...filed].map(([name,entries])=>[name,[...entries]]))}}).catch(()=>{});
 }
 function restore(snapshot){
  if(snapshot?.modelContent?.study!=='Detailed newspaper concepts')return;
  const preferences=snapshot.privateContent?.preferences;
  for(const el of designs){
   const saved=preferences?.[el.dataset.design],state=states.get(el.dataset.design);
   const entries=snapshot.privateContent?.filed?.[el.dataset.design];
   if(Array.isArray(entries))filed.set(el.dataset.design,new Set(entries.filter(entry=>typeof entry==='string'&&entry.length<100).slice(0,16)));
   if(!saved)continue;
   if(Number.isFinite(saved.depth))state.depth=Math.max(0,Math.min(100,saved.depth));
   if(Number.isFinite(saved.textSize))state.textSize=Math.max(14,Math.min(18,saved.textSize));
   for(const key of ['texture','layers'])if(typeof saved[key]==='boolean')state[key]=saved[key];
   if(['Full width','Inset print'].includes(saved.photoSize))state.photoSize=saved.photoSize;
   if(['Standard report','Long headline','Long report','Four responses'].includes(saved.sample))state.sample=saved.sample;
  }
 }
 function equalize(){
  cancelAnimationFrame(layoutFrame);
  layoutFrame=requestAnimationFrame(()=>{
   let tallest=0;
   for(const el of designs){
    const stage=el.parentElement,old=stage.getAttribute('style');
    if(stage.hidden)stage.style.cssText='display:flex;visibility:hidden;position:absolute;left:0;top:0;width:100%;min-height:0;pointer-events:none';
    const style=getComputedStyle(stage);
    tallest=Math.max(tallest,el.getBoundingClientRect().height+parseFloat(style.paddingTop)+parseFloat(style.paddingBottom));
    if(old===null)stage.removeAttribute('style');else stage.setAttribute('style',old);
   }
   root.style.setProperty('--stage-height',Math.ceil(tallest)+'px');
  });
 }
 function render(el){
  const state=states.get(el.dataset.design);
  el.style.setProperty('--depth',state.depth/100);
  el.style.setProperty('--report-type',state.textSize+'px');
  el.style.setProperty('--photo-width',state.photoSize==='Inset print'?'87%':'100%');
  el.classList.toggle('clean-print',!state.texture);
  el.classList.toggle('flat-paper',!state.layers);
  el.querySelector('[data-title]').textContent=state.sample==='Long headline'?longTitle:standardTitle;
  const report=el.querySelector('[data-report]');
  const text=state.sample==='Long report'?[...paragraphs,...paragraphs,...paragraphs,'The report continues. Further developments remain dependent on the decisions of the parties concerned.']:paragraphs.slice(0,2);
  report.replaceChildren(...text.map(content=>{const p=document.createElement('p');p.textContent=content;return p;}));
  const container=el.querySelector('[data-options]');
  container.replaceChildren(...options.slice(0,state.sample==='Four responses'?4:1).map(label=>{
   const key=state.sample+':'+label,acknowledged=filed.get(el.dataset.design).has(key);
   const button=document.createElement('button');button.type='button';button.className='cursor-interaction';button.textContent=acknowledged?'Report filed.':label;
   if(acknowledged)button.dataset.filed='true';
   button.addEventListener('click',()=>{filed.get(el.dataset.design).add(key);button.textContent='Report filed.';button.dataset.filed='true';latestDesign=el.dataset.design;save();});
   return button;
  }));
  equalize();
 }
 restore(window.openai?.widgetState);
 for(const el of designs){
  el.querySelector('[data-photo]').src=media.photo;
  el.querySelector('.native-edge-shade').style.borderImageSource='url("'+media.shadow+'")';
  render(el);
  if(globalThis.Tweak){
   const state=states.get(el.dataset.design);
   const tweak=new Tweak({container:el,onChange:()=>{latestDesign=el.dataset.design;render(el);save();}});
   tweak.addSelect(state,'sample',{label:'Event sample',options:['Standard report','Long headline','Long report','Four responses']});
   tweak.addSlider(state,'depth',{label:'Paper depth',min:0,max:100,step:5,unit:'%'});
   tweak.addSlider(state,'textSize',{label:'Report type',min:14,max:18,step:1,unit:'px'});
   if(!el.classList.contains('evening')&&!el.classList.contains('photo-edition'))tweak.addSelect(state,'photoSize',{label:'Photo size',options:['Full width','Inset print']});
   tweak.addToggle(state,'texture',{label:'Print texture'});
   if(!el.classList.contains('cutting'))tweak.addToggle(state,'layers',{label:'Paper layers'});
  }
 }
 let lastWidth=0;
 new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(Math.abs(width-lastWidth)>.5){lastWidth=width;equalize();}}).observe(root);
 window.addEventListener('openai:set_globals',event=>{const snapshot=event.detail?.globals?.widgetState;if(snapshot){restore(snapshot);designs.forEach(render);}});
})();
</script>
