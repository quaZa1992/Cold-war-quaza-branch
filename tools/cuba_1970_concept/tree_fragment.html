<!-- COLDWAR_CUB — IMPERIA CW: interactive approval concept; no runtime game changes. -->
<div id="coldwar-cuba-concept">
  <div class="cub-header">
    <div><strong>CUBA</strong><span class="cub-subtitle">National Focus · January 1970</span></div>
    <span class="cub-proposal">APPROVAL CONCEPT</span>
  </div>
  <div class="cub-toolbar">
    <label>Programme <select id="cub-branch" aria-label="View programme"></select></label>
    <label>Government <select id="cub-government" aria-label="Preview governing party"></select></label>
    <div class="cub-zoom-controls"><button type="button" id="cub-minus" aria-label="Zoom out">−</button><span id="cub-zoom">100%</span><button type="button" id="cub-plus" aria-label="Zoom in">+</button><button type="button" id="cub-native">100%</button><button type="button" id="cub-fit">Fit branch</button><button type="button" id="cub-overview">Overview</button></div>
  </div>
  <div class="cub-map" id="cub-map" aria-label="Cuban national focus tree. Drag to pan; select any focus for its effects.">
    <div id="cub-world"><svg id="cub-links" aria-hidden="true"></svg><div id="cub-nodes"></div></div>
    <div id="cub-group-labels"></div>
  </div>
  <div class="cub-map-caption" id="cub-map-caption"></div>
  <div class="cub-strip">
    <button type="button" id="cub-starting">Starting spirits · 7</button>
    <button type="button" id="cub-agreements">Diplomatic agreements</button>
    <button type="button" id="cub-timeline">1970–1990</button>
    <button type="button" id="cub-rules">Integration &amp; balance</button>
    <span id="cub-count"></span>
  </div>
  <section class="cub-detail" id="cub-detail" aria-live="polite"></section>
</div>
<style>
#coldwar-cuba-concept{--cub-bg:#222c30;--cub-panel:#303a3e;--cub-edge:#101619;--cub-text:#e0ddce;--cub-muted:#b6b9ab;--cub-gold:#d2b365;--cub-good:#8cc67f;--cub-bad:#dd8a7f;--cub-link:#8c9b8b;--cub-active:#53644d;color:var(--cub-text);font:14px/1.5 Arial,sans-serif;background:var(--cub-bg);width:100%;box-sizing:border-box;isolation:isolate}
#coldwar-cuba-concept *{box-sizing:border-box}
#coldwar-cuba-concept button,#coldwar-cuba-concept select{font:inherit;color:var(--cub-text);background:#3a474b;border:1px solid #738077;border-radius:1px;padding:5px 9px;max-width:100%}
#coldwar-cuba-concept button:hover{background:#4d5c55}
#coldwar-cuba-concept select{min-width:0;max-width:250px}
#coldwar-cuba-concept button[aria-pressed=true]{background:var(--cub-active);border-color:var(--cub-gold)}
#coldwar-cuba-concept .cub-header{padding:12px 104px 11px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:linear-gradient(#465158,#303a40);border-bottom:2px solid var(--cub-edge)}
#coldwar-cuba-concept strong{font-weight:600}
#coldwar-cuba-concept .cub-header strong{font-family:Georgia,serif;letter-spacing:3px;font-size:20px;color:var(--cub-gold)}
#coldwar-cuba-concept .cub-subtitle{margin-left:14px}
#coldwar-cuba-concept .cub-proposal{font-size:11px;letter-spacing:1px;color:var(--cub-muted)}
#coldwar-cuba-concept .cub-toolbar{display:flex;align-items:end;flex-wrap:wrap;gap:10px 16px;padding:10px 12px;background:#303b40;border-bottom:1px solid #101619}
#coldwar-cuba-concept .cub-toolbar label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--cub-muted);flex:0 1 auto;min-width:0}
#coldwar-cuba-concept .cub-toolbar select{font-size:13px;color:var(--cub-text)}
#coldwar-cuba-concept .cub-zoom-controls{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
#coldwar-cuba-concept #cub-zoom{width:48px;text-align:center;font-variant-numeric:tabular-nums}
#coldwar-cuba-concept .cub-map{height:740px;overflow:hidden;position:relative;touch-action:none;background:radial-gradient(ellipse at 45% 40%,#394749,#263237 65%,#202a2e);user-select:none}
#coldwar-cuba-concept #cub-world{position:absolute;left:0;top:0;transform-origin:0 0;width:6500px;height:3500px}
#coldwar-cuba-concept #cub-links{position:absolute;inset:0;width:6500px;height:3500px;overflow:visible;pointer-events:none}
#coldwar-cuba-concept .cub-prerequisite{fill:none;stroke:var(--cub-link);stroke-width:2;opacity:.85}
#coldwar-cuba-concept .cub-mex{fill:none;stroke:#b08a6d;stroke-width:2;stroke-dasharray:5 4;opacity:.85}
#coldwar-cuba-concept .cub-node{position:absolute;width:165px;height:128px;border:0;padding:0;background:transparent;display:flex;align-items:center;justify-content:center;flex-direction:column}
#coldwar-cuba-concept .cub-node:hover{background:radial-gradient(ellipse,#6f785c66,transparent 65%)}
#coldwar-cuba-concept .cub-node.is-locked .cub-icon{filter:grayscale(.9) brightness(.62)}
#coldwar-cuba-concept .cub-node.is-selected .cub-icon{filter:drop-shadow(0 0 5px #f9d782)}
#coldwar-cuba-concept .cub-icon{position:absolute;left:50%;top:48px;transform:translate(-50%,-50%);max-width:100px;max-height:100px;width:auto;height:auto;object-fit:contain;pointer-events:none}
#coldwar-cuba-concept .cub-titlebar{position:absolute;left:9px;top:99px;width:147px;height:20px;pointer-events:none}
#coldwar-cuba-concept .cub-title-art{position:absolute;left:9px;top:99px;width:147px;height:20px;pointer-events:none}
#coldwar-cuba-concept .cub-node .cub-lock{position:absolute;top:79px;right:33px;background:#20282b;color:#b7bba9;font-size:11px;padding:0 3px;line-height:16px;border:1px solid #6b7367;pointer-events:none}
#coldwar-cuba-concept .cub-node:not(.is-locked) .cub-lock{display:none}
#coldwar-cuba-concept .cub-exclusive-marker{position:absolute;pointer-events:none;transform:translate(-50%,-50%);width:24px;height:24px;object-fit:contain}
#coldwar-cuba-concept .cub-group-label{position:absolute;width:220px;transform:translateX(-50%);padding:4px 8px;background:#303b3eee;border:0;border-bottom:1px solid #7a8066;text-align:center;color:var(--cub-gold);font-size:13px;line-height:1.3;pointer-events:auto}
#coldwar-cuba-concept .cub-group-label.is-mini{width:110px;font-size:12px;line-height:1.25;padding:3px}
#coldwar-cuba-concept #cub-group-labels{position:absolute;inset:0;pointer-events:none}
#coldwar-cuba-concept .cub-map-caption{padding:5px 12px;background:#283338;font-size:12px;color:var(--cub-muted)}
#coldwar-cuba-concept .cub-strip{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:9px 12px;background:#303b40;border-block:1px solid #141b1d}
#coldwar-cuba-concept .cub-strip button{font-size:13px}
#coldwar-cuba-concept #cub-count{margin-left:auto;color:var(--cub-muted);font-size:12px}
#coldwar-cuba-concept .cub-detail{padding:18px 20px 22px;background:linear-gradient(#354045,#2b353a);min-height:260px;overflow-wrap:anywhere}
#coldwar-cuba-concept .cub-detail h2{font:20px/1.3 Georgia,serif;font-weight:400;margin:0 0 7px;color:var(--cub-gold)}
#coldwar-cuba-concept .cub-detail h3{font:16px/1.4 Arial,sans-serif;font-weight:500;margin:17px 0 6px;color:var(--cub-gold)}
#coldwar-cuba-concept .cub-detail p{margin:7px 0 12px}
#coldwar-cuba-concept .cub-detail ul{padding-left:19px;margin:5px 0 12px}
#coldwar-cuba-concept .cub-detail li{margin:4px 0}
#coldwar-cuba-concept .cub-detail small{font-size:12px;color:var(--cub-muted)}
#coldwar-cuba-concept .cub-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 30px}
#coldwar-cuba-concept .cub-meta{color:var(--cub-muted);font-size:12px}
#coldwar-cuba-concept .cub-mods{list-style:none;padding:0!important}
#coldwar-cuba-concept .cub-mods li{display:flex;gap:15px;justify-content:space-between;border-bottom:1px solid #4b5655;padding:3px 0;margin:0}
#coldwar-cuba-concept .cub-mods b{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
#coldwar-cuba-concept .cub-good{color:var(--cub-good)}
#coldwar-cuba-concept .cub-bad{color:var(--cub-bad)}
#coldwar-cuba-concept .cub-tag{color:var(--cub-gold)}
#coldwar-cuba-concept .cub-spirit{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:15px 0;border-bottom:1px solid #54605b}
#coldwar-cuba-concept .cub-spirit img{width:64px;height:64px;object-fit:contain;align-self:start}
#coldwar-cuba-concept .cub-spirit h3{margin-top:0}
#coldwar-cuba-concept .cub-spirit .cub-mods{max-width:580px}
#coldwar-cuba-concept .cub-chip{display:inline;margin:3px 5px 3px 0;text-decoration:underline;background:transparent;border:0;color:var(--cub-gold);padding:1px}
#coldwar-cuba-concept details{margin:10px 0;color:var(--cub-muted)}
#coldwar-cuba-concept summary{color:var(--cub-text)}
#coldwar-cuba-concept pre{white-space:pre-wrap;font:12px/1.5 Consolas,monospace;color:#ced6c3;background:#222b2e;padding:12px;max-width:100%;overflow-wrap:anywhere}
#coldwar-cuba-concept code{font:12px/1.5 Consolas,monospace}
#coldwar-cuba-concept .cub-table{width:100%;border-collapse:collapse;font-size:13px}
#coldwar-cuba-concept .cub-table td,#coldwar-cuba-concept .cub-table th{text-align:left;padding:7px 5px;border-bottom:1px solid #536058}
#coldwar-cuba-concept .cub-table th{font-weight:500;color:var(--cub-gold)}
@media(max-width:600px){#coldwar-cuba-concept .cub-header{padding-left:12px;gap:4px}#coldwar-cuba-concept .cub-subtitle{display:block;margin:1px 0 0}#coldwar-cuba-concept .cub-toolbar label{flex:1 1 140px}#coldwar-cuba-concept select{width:100%;max-width:100%}#coldwar-cuba-concept .cub-columns{grid-template-columns:1fr;gap:5px}#coldwar-cuba-concept .cub-map{height:560px}#coldwar-cuba-concept .cub-detail{padding:15px 12px}#coldwar-cuba-concept #cub-count{width:100%;margin:3px 0 0}#coldwar-cuba-concept .cub-group-label{width:175px}}
@media(pointer:coarse){#coldwar-cuba-concept .cub-toolbar button,#coldwar-cuba-concept .cub-strip button,#coldwar-cuba-concept select{min-height:44px}#coldwar-cuba-concept select{font-size:16px}}
</style>
<script>
(()=>{
const DATA=__CUBA_DATA__;
const root=document.getElementById('coldwar-cuba-concept');
const $=s=>root.querySelector(s), by=new Map(DATA.nodes.map(n=>[n.id,n])), groups=new Map(DATA.groups.map(g=>[g.id,g]));
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const branch=$('#cub-branch'),government=$('#cub-government'),detail=$('#cub-detail'),map=$('#cub-map'),world=$('#cub-world'),labels=$('#cub-group-labels');
const state={branch:'pcc',government:'pcc',selected:null,zoom:1,x:0,y:0,overview:false,panel:'focus'};
let suspendPersistence=true;
DATA.groups.forEach(g=>{const o=document.createElement('option');o.value=g.id;o.textContent=g.label;branch.append(o);if(g.slot!==null){const opt=o.cloneNode(true);government.append(opt);}});
const position=n=>({x:n.xy[0]*96+100,y:n.xy[1]*130+90});
const buttons=new Map();
DATA.nodes.forEach(n=>{
 const p=position(n),b=document.createElement('button');b.type='button';b.className='cub-node cursor-interaction';b.dataset.node=n.id;b.setAttribute('aria-label',n.title);b.style.left=(p.x-82.5)+'px';b.style.top=p.y+'px';
 b.innerHTML='<img class="cub-icon" alt="" draggable="false" src="'+DATA.art[n.icon]+'"><img class="cub-titlebar" alt="" draggable="false"><img class="cub-title-art" alt="" draggable="false" src="'+n.title_art+'"><span class="cub-lock" aria-hidden="true">LOCKED</span>';
 b.addEventListener('click',e=>{if(dragged){e.preventDefault();return;}inspect(n.id);});
 $('#cub-nodes').append(b);buttons.set(n.id,b);
});
const svg=$('#cub-links');
const path=(d,cls,attrs={})=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('class',cls);Object.entries(attrs).forEach(([k,v])=>p.setAttribute(k,v));svg.append(p);};
DATA.nodes.forEach(n=>{
 const b=position(n);
 n.prerequisites.forEach((ps,index)=>ps.forEach(pid=>{const a=position(by.get(pid)),from=a.y+120,to=b.y+3;
  // Vertical trunks stay in the gap between focus columns; horizontal junctions
  // are above the destination medallions, never across a title or an icon.
  const junction=to-8;
  path(`M ${a.x} ${from} L ${a.x} ${junction} L ${b.x} ${junction} L ${b.x} ${to}`,'cub-prerequisite',{'data-from':pid,'data-to':n.id,'data-block':index});
 }));
 n.mutually_exclusive.forEach(mid=>{if(n.id<mid){const first=position(n),second=position(by.get(mid)),a=first.x<second.x?first:second,b=first.x<second.x?second:first;path(`M ${a.x+49} ${a.y+49} L ${b.x-49} ${b.y+49}`,'cub-mex',{'data-group':n.group});const marker=document.createElement('img');marker.className='cub-exclusive-marker';marker.dataset.group=n.group;marker.alt='';marker.src=DATA.exclusive_art;marker.style.left=(a.x+b.x)/2+'px';marker.style.top=a.y+49+'px';world.append(marker);}});
});
DATA.groups.forEach(g=>{const b=document.createElement('button');b.type='button';b.className='cub-group-label cursor-interaction';b.textContent=g.label;b.dataset.group=g.id;b.addEventListener('click',()=>viewGroup(g.id));labels.append(b);});
function save(){if(suspendPersistence)return;if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{government:groups.get(state.government)?.label,programme:groups.get(state.branch)?.label,selectedFocus:state.selected?by.get(state.selected)?.title:null},privateContent:{...state}}).catch(()=>{});}
function paint(){world.style.transform=`translate(${state.x}px,${state.y}px) scale(${state.zoom})`;$('#cub-zoom').textContent=Math.round(state.zoom*100)+'%';const gov=groups.get(state.government);
 buttons.forEach((b,id)=>{const n=by.get(id),locked=n.slot!==null&&n.slot!==gov.slot;b.hidden=!state.overview&&n.group!==state.branch;b.style.display=b.hidden?'none':'flex';b.classList.toggle('is-locked',locked);b.classList.toggle('is-selected',state.selected===id);b.querySelector('.cub-titlebar').src=DATA.titlebars[locked?'locked':'available'];});
 svg.querySelectorAll('.cub-prerequisite').forEach(p=>{p.style.display=state.overview||by.get(p.getAttribute('data-to')).group===state.branch?'':'none';});
 svg.querySelectorAll('.cub-mex').forEach(p=>{p.style.display=state.overview||p.dataset.group===state.branch?'':'none';});
 world.querySelectorAll('.cub-exclusive-marker').forEach(p=>{p.hidden=!state.overview&&p.dataset.group!==state.branch;});
 labels.querySelectorAll('button').forEach(b=>{const g=groups.get(b.dataset.group),nodes=g.nodes.map(id=>by.get(id)),xs=nodes.map(n=>n.xy[0]);const cx=(Math.min(...xs)+Math.max(...xs))/2*96+100;const top=g.root[1]*130+38;b.style.left=state.x+cx*state.zoom+'px';b.style.top=state.y+top*state.zoom+'px';b.classList.toggle('is-mini',state.overview);b.hidden=!state.overview&&g.id!==state.branch;});
 $('#cub-map-caption').textContent=state.overview?'Select a programme heading to open it · Solid: prerequisite · Dashed: mutually exclusive':groups.get(state.branch).historical_status+' · Drag to pan · All focuses can be inspected';
 branch.value=state.branch;government.value=state.government;
}
function bounds(nodes){const ps=nodes.map(position);return {l:Math.min(...ps.map(p=>p.x))-100,r:Math.max(...ps.map(p=>p.x))+100,t:Math.min(...ps.map(p=>p.y))-70,b:Math.max(...ps.map(p=>p.y))+145};}
function fit(nodes,overview=false){const b=bounds(nodes),w=map.clientWidth,h=map.clientHeight;state.zoom=overview?Math.min((w-45)/(b.r-b.l),(h-45)/(b.b-b.t)):Math.min(1,(w-48)/(b.r-b.l),(h-65)/(b.b-b.t));state.x=(w-(b.r+b.l)*state.zoom)/2;state.y=(h-(b.t+b.b)*state.zoom)/2;state.overview=overview;paint();}
function viewGroup(id,persist=true){state.branch=id;fit(groups.get(id).nodes.map(nid=>by.get(nid)));if(persist)save();}
function zoom(f){const old=state.zoom;state.zoom=Math.min(1.65,Math.max(.12,old*f));const cx=map.clientWidth/2,cy=map.clientHeight/2;state.x=cx-(cx-state.x)*state.zoom/old;state.y=cy-(cy-state.y)*state.zoom/old;state.overview=false;paint();save();}
function mods(rows){return '<ul class="cub-mods">'+rows.map(r=>'<li><span>'+escape(r.label)+'</span><b class="'+(r.good?'cub-good':'cub-bad')+'">'+escape(r.text)+'</b></li>').join('')+'</ul>';}
function list(rows){return '<ul>'+rows.map(r=>'<li>'+escape(r)+'</li>').join('')+'</ul>';}
function links(ids){return ids.map(id=>'<button type="button" class="cub-chip" data-inspect="'+id+'">'+escape(by.get(id).title)+'</button>').join(' OR ');}
function wireDetail(){detail.querySelectorAll('[data-inspect]').forEach(b=>b.addEventListener('click',()=>inspect(b.dataset.inspect)));detail.querySelectorAll('[data-contract]').forEach(b=>b.addEventListener('click',()=>agreements(b.dataset.contract)));}
function activePanel(id){['starting','agreements','timeline','rules'].forEach(key=>$('#cub-'+key).setAttribute('aria-pressed',String(key===id)));state.panel=id;}
function inspect(id,persist=true){const n=by.get(id);if(!n)return;state.selected=id;activePanel('focus');const g=groups.get(n.group),locked=n.slot!==null&&n.slot!==groups.get(state.government).slot;
 detail.innerHTML='<h2>'+escape(n.title)+'</h2><div class="cub-meta">'+n.days+' days · '+escape(g.label)+' · Grid '+n.xy.join(', ')+' · '+(locked?'Requires this governing current':n.slot===null?'Shared national programme':'Government eligible')+'</div><p>'+escape(n.description)+'</p><div class="cub-columns"><div><h3>Effects</h3>'+mods(n.modrows)+list(n.effect_rows)+(n.modrows.length?'<small>'+escape(n.lifetime)+'</small>':'')+'</div><div><h3>Requirements &amp; alternatives</h3><p>'+(n.prerequisites.length?n.prerequisites.map(links).join('<br>AND '):'Programme entry · no ceremonial party unlock')+'</p>'+(n.extra_gate?'<p>'+escape(n.extra_gate)+'</p>':'')+(n.slot!==null?'<p>Exact governing subparty: <span class="cub-tag">'+escape(g.label)+' · slot '+n.slot+'</span></p>':'')+(n.mutually_exclusive.length?'<p>Mutually exclusive with: '+links(n.mutually_exclusive)+'</p>':'')+'<small>'+escape(n.historical_status)+'</small></div></div>';
 n.effects.filter(e=>e.kind==='offer').forEach(e=>{detail.innerHTML+='<p><button type="button" data-contract="'+e.contract+'">View agreement: '+escape(DATA.contracts[e.contract].title)+'</button></p>';});
 detail.innerHTML+='<details><summary>Code &amp; API review</summary><p class="cub-meta">Approval excerpt. New bilateral contracts and programme refresh logic are design requirements; this is not an installed or runnable tree.</p><code>'+escape(n.id)+'</code><pre>'+escape(n.script)+'</pre></details>';
 wireDetail();paint();if(persist)save();
}
function starting(){activePanel('starting');detail.innerHTML='<h2>1 January 1970 · Starting National Spirits</h2><p>Fidel Castro · PCC · Prime Minister</p><details><summary>'+escape(DATA.setup.title)+'</summary><p>'+escape(DATA.setup.text)+'</p><small>'+escape(DATA.setup.guard)+'</small></details>'+DATA.starting_spirits.map(s=>'<article class="cub-spirit"><img alt="" src="'+DATA.art['GFX_idea_'+s.picture]+'"><div><h3>'+escape(s.title)+'</h3><p>'+escape(s.description)+'</p>'+mods(s.modrows)+'<small>'+escape(s.resolution)+'</small></div></article>').join('');save();}
function agreements(selected){activePanel('agreements');const entries=selected?[[selected,DATA.contracts[selected]]]:Object.entries(DATA.contracts);detail.innerHTML='<h2>Negotiated Agreements</h2>'+entries.map(([key,c])=>'<article><h3>'+escape(c.title)+'</h3><div class="cub-meta">Recipient: '+escape(c.recipient)+' · Refusal / expiry: no payment</div>'+list(c.terms)+'<p><small>'+escape(c.guard)+'</small></p><details><summary>Integration contract</summary><p>'+escape(c.custom)+'</p></details></article>').join('');if(selected)detail.innerHTML+='<button type="button" id="cub-all-agreements">All agreements</button>';detail.querySelector('#cub-all-agreements')?.addEventListener('click',()=>agreements());save();}
function timeline(){activePanel('timeline');detail.innerHTML='<h2>1970–1990 · Historical Event Layer</h2>'+DATA.chronology.map(ev=>'<article><h3>'+escape(ev.date)+' · '+escape(ev.title)+'</h3><p>'+escape(ev.trigger)+'</p><p class="cub-meta">'+escape(ev.duration)+'</p>'+ev.choices.map(o=>'<p class="cub-tag">'+escape(o.title)+'</p>'+list(Array.isArray(o.effects)?o.effects:[o.effects])).join('')+'<details><summary>Historical basis</summary><p>'+escape(ev.history)+'</p></details></article>').join('');save();}
function rules(){activePanel('rules');detail.innerHTML='<h2>Integration &amp; Balance Contract</h2>'+list(DATA.rules)+'<h3>'+escape(DATA.setup.title)+'</h3><p>'+escape(DATA.setup.text)+'</p>'+DATA.lifecycles.map(lc=>'<h3>'+escape(lc.title)+'</h3>'+list(lc.rules)).join('')+'<h3>Exact native layout</h3><p>96 × 130 px focus grid · 165 × 128 px card · 147 × 20 px native title · hoi_16mbs font · relative programme anchors</p><table class="cub-table"><thead><tr><th>Programme</th><th>Root</th><th>Focuses</th></tr></thead><tbody>'+DATA.groups.map(g=>'<tr><td>'+escape(g.label)+'</td><td>'+g.root.join(', ')+'</td><td>'+g.nodes.length+'</td></tr>').join('')+'</tbody></table><p>Numerical values are balance proposals. Source-backed modifiers are distinguished from new agreement and lifecycle logic. Static and browser checks do not replace engine and multiplayer acceptance tests after approval.</p>';save();}
branch.addEventListener('change',()=>viewGroup(branch.value));government.addEventListener('change',()=>{state.government=government.value;paint();if(state.panel==='focus'&&state.selected)inspect(state.selected,false);save();});
$('#cub-plus').addEventListener('click',()=>zoom(1.2));$('#cub-minus').addEventListener('click',()=>zoom(1/1.2));$('#cub-native').addEventListener('click',()=>zoom(1/state.zoom));$('#cub-fit').addEventListener('click',()=>viewGroup(state.branch));$('#cub-overview').addEventListener('click',()=>{fit(DATA.nodes,true);save();});
$('#cub-starting').addEventListener('click',starting);$('#cub-agreements').addEventListener('click',()=>agreements());$('#cub-timeline').addEventListener('click',timeline);$('#cub-rules').addEventListener('click',rules);
let drag=null,dragged=false;
map.addEventListener('pointerdown',e=>{if(e.target.closest('.cub-group-label'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,startX:state.x,startY:state.y};dragged=false;});
map.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)dragged=true;if(dragged){state.x=drag.startX+dx;state.y=drag.startY+dy;paint();}});
const stop=e=>{if(!drag)return;if(dragged){e.preventDefault();save();}drag=null;setTimeout(()=>{dragged=false},0);};
map.addEventListener('pointerup',stop);map.addEventListener('pointercancel',stop);map.addEventListener('pointerleave',e=>{if(drag&&e.buttons===0)stop(e);});
map.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1);},{passive:false});
function restore(snapshot){const s=snapshot?.privateContent;if(!s||!groups.has(s.branch)||!groups.has(s.government))return false;Object.assign(state,s);state.zoom=Math.min(1.65,Math.max(.12,Number(state.zoom)||1));return true;}
function restorePanel(){const panel=state.panel;if(panel==='starting')starting();else if(panel==='agreements')agreements();else if(panel==='timeline')timeline();else if(panel==='rules')rules();else inspect(state.selected||DATA.groups.find(g=>g.id==='pcc').nodes[0],false);}
const restored=restore(window.openai?.widgetState);if(!restored)viewGroup('pcc',false);else paint();restorePanel();suspendPersistence=false;
$('#cub-count').textContent=DATA.nodes.length+' focuses · '+DATA.groups.filter(g=>g.slot!==null).length+' governing programmes';
new ResizeObserver(()=>{if(state.overview)fit(DATA.nodes,true);else viewGroup(state.branch,false);}).observe(map);
window.addEventListener('openai:set_globals',e=>{suspendPersistence=true;if(restore(e.detail?.globals?.widgetState)){paint();restorePanel();}suspendPersistence=false;});
})();
</script>
