<!-- IMPERIA COLD WAR: foreign policy proposal, not loaded game code. -->
<div id="cuba-foreign-proposal">
  <header class="fp-header"><div><strong>CUBA</strong><span>FOREIGN POLICY</span></div><span>DESIGN PROPOSAL</span></header>
  <div class="fp-toolbar">
    <label>Ansicht <select id="fp-view" aria-label="Baumansicht"></select></label>
    <div class="fp-zoom"><button type="button" id="fp-minus" aria-label="Verkleinern">-</button><span id="fp-scale">100%</span><button type="button" id="fp-plus" aria-label="Vergrößern">+</button><button type="button" id="fp-native">100%</button><button type="button" id="fp-fit">Einpassen</button></div>
  </div>
  <div id="fp-map" aria-label="Kubanischer Fokusbaum. Ziehen verschiebt die Ansicht. Jeder Fokus lässt sich anklicken."><div id="fp-world"><svg id="fp-lines" aria-hidden="true"></svg><div id="fp-nodes"></div></div><div id="fp-labels"></div></div>
  <div class="fp-caption">25 Außenpolitik-Foki · Vorschlag mit insgesamt 120 Foki · Originale MD-Grafiken · Alle Foki anklickbar</div>
  <nav class="fp-tabs" aria-label="Konzeptinformationen"><button type="button" id="fp-focus" aria-pressed="true">Fokusdetails</button><button type="button" id="fp-contract">Vertragsregeln</button><button type="button" id="fp-budget">120-Foki-Budget</button></nav>
  <section id="fp-detail" class="fp-detail" aria-live="polite"></section>
</div>
<style>
#cuba-foreign-proposal{--fp-bg:#263136;--fp-panel:#344146;--fp-fg:#e2dfd3;--fp-muted:#bac2b8;--fp-gold:#d4bc7b;--fp-green:#99ce89;--fp-red:#e59a8d;--fp-line:#98a58f;background:var(--fp-bg);color:var(--fp-fg);font:14px/1.5 Arial,sans-serif;isolation:isolate;width:100%;box-sizing:border-box}

#cuba-foreign-proposal .fp-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 105px 14px 16px;background:linear-gradient(#47565c,#354148);border-bottom:2px solid #172126}

#cuba-foreign-proposal .fp-toolbar{display:flex;align-items:end;gap:12px 20px;flex-wrap:wrap;padding:10px 12px;background:#303d42}
#cuba-foreign-proposal .fp-toolbar label{display:flex;flex-direction:column;font-size:12px;gap:3px;max-width:100%;color:var(--fp-muted)}
#cuba-foreign-proposal select{font-size:14px;color:var(--fp-fg)}
#cuba-foreign-proposal .fp-zoom{display:flex;align-items:center;gap:5px;flex-wrap:wrap}

#cuba-foreign-proposal #fp-map{height:660px;position:relative;overflow:hidden;touch-action:none;user-select:none;background:radial-gradient(ellipse at 50% 45%,#3a4848,#263237 75%)}
#cuba-foreign-proposal #fp-world{position:absolute;left:0;top:0;width:7000px;height:4300px;transform-origin:0 0}

#cuba-foreign-proposal .fp-art{position:absolute;left:50%;top:48px;transform:translate(-50%,-50%);max-width:100px;max-height:100px;width:auto;height:auto;object-fit:contain;pointer-events:none}
#cuba-foreign-proposal .fp-bar,#cuba-foreign-proposal .fp-title{position:absolute;left:9px;top:99px;width:147px;height:20px;pointer-events:none}

#cuba-foreign-proposal .fp-caption{padding:7px 12px;font-size:12px;color:var(--fp-muted);background:#2d393e}
#cuba-foreign-proposal .fp-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:9px 12px;background:#303d42;border-top:1px solid #182227}

#cuba-foreign-proposal .fp-meta{color:var(--fp-muted);font-size:12px}
#cuba-foreign-proposal .fp-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 30px}
#cuba-foreign-proposal .fp-mods{padding:0;list-style:none;margin:7px 0 10px}
#cuba-foreign-proposal .fp-mods li{display:flex;align-items:start;justify-content:space-between;gap:12px;border-bottom:1px solid #4c5a59;padding:4px 0}
#cuba-foreign-proposal .fp-mods b{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
#cuba-foreign-proposal .fp-good{color:var(--fp-green)}
#cuba-foreign-proposal .fp-bad{color:var(--fp-red)}
#cuba-foreign-proposal .fp-named{color:var(--fp-gold)}
#cuba-foreign-proposal .fp-list{padding-left:20px;margin:7px 0 12px}
#cuba-foreign-proposal .fp-list li{margin:6px 0}
#cuba-foreign-proposal .fp-detail a{color:#d4c68f}
#cuba-foreign-proposal .fp-detail details{margin-top:14px}
#cuba-foreign-proposal .fp-detail summary{color:var(--fp-gold)}
#cuba-foreign-proposal .fp-budget-table{border-collapse:collapse;width:100%;font-size:13px}
#cuba-foreign-proposal .fp-budget-table th,#cuba-foreign-proposal .fp-budget-table td{text-align:left;padding:7px 5px;border-bottom:1px solid #54645f;vertical-align:top}
#cuba-foreign-proposal .fp-budget-table th{font-weight:500;color:var(--fp-gold)}
@media(max-width:600px){#cuba-foreign-proposal .fp-header{padding-left:12px}#cuba-foreign-proposal .fp-header div span{display:block;margin-top:3px}#cuba-foreign-proposal .fp-columns{grid-template-columns:1fr;gap:0}#cuba-foreign-proposal #fp-map{height:540px}#cuba-foreign-proposal .fp-detail{padding:16px 12px}#cuba-foreign-proposal .fp-toolbar label{width:100%}#cuba-foreign-proposal .fp-overview-title{width:88px;font-size:11px}}
@media(pointer:coarse){#cuba-foreign-proposal .fp-toolbar button,#cuba-foreign-proposal .fp-tabs button,#cuba-foreign-proposal select{min-height:44px}#cuba-foreign-proposal select{font-size:16px}}
</style>
<script>
(()=>{
const D=__DATA__;
const root=document.getElementById('cuba-foreign-proposal'),$=s=>root.querySelector(s),map=$('#fp-map'),world=$('#fp-world'),detail=$('#fp-detail');
const by=new Map(D.nodes.map(n=>[n.id,n])),views=[...D.foreign_views,{id:'context',label:'Gesamter Baum: 120 Foki',keys:D.nodes.map(n=>n.key)}];
const names={SOV:'Soviet Union',MEX:'Mexico',SPR:'Spain',CAN:'Canada',DDR:'German Democratic Republic',USA:'United States',JAM:'Jamaica',AGL:'Angola',ETH:'Ethiopia',ALG:'Algeria'};
const labels={...D.labels,send_volunteer_divisions_required:'Divisions required to send volunteers',send_volunteers_tension:'Send Volunteers tension limit',air_volunteer_cap:'Air volunteer cap'};
const inverse=new Set(['bureaucracy_cost_multiplier_modifier','education_cost_multiplier_modifier','health_cost_multiplier_modifier','army_personnel_cost_multiplier_modifier','supply_consumption_factor','army_fuel_consumption_factor','send_volunteer_divisions_required','send_volunteers_tension','training_time_army_factor']);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pos=n=>({x:n.xy[0]*96+100,y:n.xy[1]*130+90});
const state={version:2,view:'foreign',selected:'COLDWAR_CUB_foreign_expeditionary',zoom:1,x:0,y:0,panel:'focus'};
let suppressSave=true,drag=null,dragged=false;
const nodes=new Map(),edges=[],markers=[];
views.forEach(v=>{const o=document.createElement('option');o.value=v.id;o.textContent=v.label;$('#fp-view').append(o)});
D.nodes.forEach(n=>{const p=pos(n),b=document.createElement('button');b.type='button';b.className='fp-node cursor-interaction';b.dataset.node=n.id;b.setAttribute('aria-label',n.title);b.style.left=(p.x-82.5)+'px';b.style.top=p.y+'px';b.innerHTML='<img class="fp-art" alt="" draggable="false" src="'+D.art[n.icon]+'"><img class="fp-bar" alt="" draggable="false" src="'+D.titlebars.available+'"><img class="fp-title" alt="" draggable="false" src="'+n.title_art+'">';b.addEventListener('click',e=>{if(dragged){e.preventDefault();return}inspect(n.id)});$('#fp-nodes').append(b);nodes.set(n.id,b)});
function path(d,cls,a,b){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('class',cls);$('#fp-lines').append(p);edges.push({p,a,b})}
function blocked(x,y1,y2,a,b){return D.nodes.some(n=>{if(n.id===a||n.id===b)return false;const p=pos(n);return Math.abs(p.x-x)<88&&p.y<y2&&p.y+120>y1})}
D.nodes.forEach(n=>{const b=pos(n);n.prerequisites.forEach(ps=>ps.forEach(id=>{const parent=by.get(id);if(!parent)return;const a=pos(parent),from=a.y+129,to=b.y-1;let lane=a.x;if(blocked(lane,from,to,id,n.id)){const candidates=[a.x+192,a.x-192,a.x+384,a.x-384,a.x+576,a.x-576];lane=candidates.find(x=>!blocked(x,from,to,id,n.id))??(a.x+768)}path(`M ${a.x} ${from} L ${lane} ${from} L ${lane} ${to} L ${b.x} ${to} L ${b.x} ${b.y+3}`,'fp-edge',id,n.id)}));n.mutually_exclusive.forEach(id=>{if(n.id>=id||!by.has(id))return;const a=pos(by.get(id));if(a.y!==b.y)return;const left=Math.min(a.x,b.x),right=Math.max(a.x,b.x);path(`M ${left+52} ${a.y+49} L ${right-52} ${a.y+49}`,'fp-mutex',id,n.id);const m=document.createElement('img');m.className='fp-x';m.src=D.exclusive_art;m.alt='';m.style.left=(left+right)/2+'px';m.style.top=(a.y+49)+'px';world.append(m);markers.push({m,a:id,b:n.id})})});
function current(){const v=views.find(v=>v.id===state.view)||views[0];return D.nodes.filter(n=>v.keys.includes(n.key))}
function save(){if(suppressSave)return;window.openai?.setWidgetState?.({modelContent:{view:state.view,selectedFocus:by.get(state.selected)?.title,partner:by.get(state.selected)?.partner||null,concept:'Cuban focus offers with recipient consent'},privateContent:{...state}}).catch(()=>{})}
function paint(){const visible=new Set(current().map(n=>n.id));world.style.transform=`translate(${state.x}px,${state.y}px) scale(${state.zoom})`;$('#fp-scale').textContent=Math.round(state.zoom*100)+'%';$('#fp-view').value=state.view;nodes.forEach((b,id)=>{const n=by.get(id);b.hidden=!visible.has(id);b.style.display=b.hidden?'none':'flex';b.classList.toggle('is-selected',state.selected===id);b.classList.toggle('is-locked',n.slot!==null&&n.slot!==4);b.setAttribute('aria-pressed',String(state.selected===id))});edges.forEach(e=>e.p.style.display=visible.has(e.a)&&visible.has(e.b)?'':'none');markers.forEach(e=>e.m.hidden=!(visible.has(e.a)&&visible.has(e.b)));const layer=$('#fp-labels');layer.replaceChildren();if(state.zoom<.7&&state.zoom>.18&&state.view!=='context'){current().forEach(n=>{const p=pos(n),s=document.createElement('span');s.className='fp-overview-title';s.style.width=Math.min(122,Math.max(76,384*state.zoom-7))+'px';s.textContent=n.title;s.style.left=state.x+p.x*state.zoom+'px';s.style.top=state.y+(p.y+111)*state.zoom+'px';layer.append(s)})}}
function fit(){const ps=current().map(pos),l=Math.min(...ps.map(p=>p.x))-104,r=Math.max(...ps.map(p=>p.x))+104,t=Math.min(...ps.map(p=>p.y))-18,b=Math.max(...ps.map(p=>p.y))+144;state.zoom=Math.min(1,(map.clientWidth-76)/(r-l),(map.clientHeight-32)/(b-t));state.x=(map.clientWidth-(l+r)*state.zoom)/2;state.y=(map.clientHeight-(t+b)*state.zoom)/2;paint()}
function zoom(f){const old=state.zoom;state.zoom=Math.max(.12,Math.min(1.8,old*f));const x=map.clientWidth/2,y=map.clientHeight/2;state.x=x-(x-state.x)*state.zoom/old;state.y=y-(y-state.y)*state.zoom/old;paint();save()}
function list(a){return a.length?'<ul class="fp-list">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}
function mods(m){return '<ul class="fp-mods">'+Object.entries(m).filter(([,v])=>v!==0).map(([k,v])=>{const flat=k==='send_volunteer_size'||k==='air_volunteer_cap',amount=flat?Math.abs(v):Number((Math.abs(v)*100).toFixed(2)),good=inverse.has(k)?v<0:v>0;return '<li><span>'+esc(labels[k]||k)+'</span><b class="'+(good?'fp-good':'fp-bad')+'">'+(v>0?'+':'-')+amount+(flat?'':'%')+'</b></li>'}).join('')+'</ul>'}
function cash(v){return v?'<ul class="fp-mods"><li><span>Treasury</span><b class="fp-bad">-$'+v.toFixed(2)+' billion</b></li></ul>':''}
function panel(p){state.panel=p;['focus','contract','budget'].forEach(x=>$('#fp-'+x).setAttribute('aria-pressed',String(x===p)))}
function inspect(id,persist=true){const n=by.get(id);if(!n)return;state.selected=id;panel('focus');let html='<h2>'+esc(n.title)+'</h2><div class="fp-meta">'+n.days+' days · '+(n.is_existing?'Bestehender Fokus im Gesamtvorschlag':'Neuer außenpolitischer Fokus')+' · Grid '+n.xy.join(', ')+'</div><p>'+esc(n.description)+'</p>';
if(n.partner){html+='<h3>On completion</h3>'+list(['Send proposal to '+names[n.partner],...n.effect_rows])+'<div class="fp-columns"><div><h3>If accepted: Cuba</h3><div class="fp-named">'+esc(n.spirit)+'</div>'+cash(n.setup_costs[0])+mods(n.cub_modifiers)+'</div><div><h3>If accepted: '+esc(names[n.partner])+'</h3><div class="fp-named">'+esc(n.partner_spirit||n.spirit)+'</div>'+cash(n.setup_costs[1])+mods(n.partner_modifiers)+'</div></div>'+list(n.receipt)}else{html+='<h3>Effects</h3>'+mods(n.modifiers)+list(n.effect_rows||[])}
const req=[...n.prerequisites.map(ps=>ps.map(p=>by.get(p)?.title||p).join(' OR ')),...(n.requirements||[]),...(n.is_existing&&n.extra_gate?[n.extra_gate]:[])];if(n.partner)req.push('Both countries exist and are not at war with each other');html+='<div class="fp-columns"><div><h3>Requirements</h3>'+list(req.length?req:['Programme entry'])+'</div><div><h3>Mutually exclusive</h3>'+list(n.mutually_exclusive.map(x=>by.get(x)?.title||x))+'</div></div>';
if(n.partner)html+='<div class="fp-meta">Standing agreement. Both spirits pause during bilateral war, embargo or any mutual sanction, and resume when those restrictions end.</div>';
html+='<details><summary>Historischer Bezug und Konzeptprüfung</summary><p>'+esc(n.historical_status)+'</p>'+((n.sources||[]).map((url,i)=>'<p><a target="_blank" rel="noreferrer" href="'+esc(url)+'">Quelle '+(i+1)+'</a></p>').join(''))+(n.consolidated_from?'<p>Zusammengeführt mit: '+esc(n.consolidated_from.join(', '))+'</p>':'')+'<p class="fp-meta">'+esc(D.native_approximation)+'</p></details>';detail.innerHTML=html;paint();if(persist)save()}
function contract(){panel('contract');detail.innerHTML='<h2>Fokus, Angebot, Zustimmung, Vertrag</h2>'+list(D.protocol)+'<h3>Freiwillige</h3><div class="fp-columns"><div><p>Overseas Service</p>'+mods(by.get('COLDWAR_CUB_foreign_overseas').modifiers)+'</div><div><p>Advisory Missions oder Expeditionary Brigades</p><p>+1 oder +2 mögliche Freiwilligendivisionen. Das globale Minimum ist in MD bereits auf sieben Divisionen reduziert. Die neue Schwellenreduktion wirkt auf dieses Minimum. Vorhandene Truppen und die normale Empfängerzustimmung bleiben nötig.</p></div></div>';save()}
function budget(){panel('budget');detail.innerHTML='<h2>120 Foki mit erhaltenen politischen Pfaden</h2><table class="fp-budget-table"><thead><tr><th>Bereich</th><th>Bisher</th><th>Vorschlag</th></tr></thead><tbody>'+[['Economy',15,9],['Society',7,5],['Defence',8,5],['Foreign policy',13,25],['OSPAAAL',3,2],['Other political programmes',74,74],['Total',120,120]].map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table><p>Fidels 13 Foki und die übrigen politischen Alternativen bleiben erhalten. OSPAAAL behält seine zwei konkurrierenden Programme. Bei Zusammenlegungen bleiben Gebäude samt Bauplätzen, Forschung, Kosten und die gesamte Fokusdauer auf der jeweiligen Route erhalten.</p><details><summary>Vorgeschlagene Zusammenlegungen</summary>'+list(D.merges.map(m=>m.source+' → '+m.targets.join(' / ')))+'</details><p class="fp-meta">Dieser Entwurf ist nicht in den geladenen Spielbaum eingebaut. Die räumliche Vorschau enthält alle 120 vorgeschlagenen Foki. Politische Abschnitte sind für den zusätzlichen Außenpolitikplatz um zwei Rasterzeilen nach unten versetzt.</p>';save()}
$('#fp-view').addEventListener('change',()=>{state.view=$('#fp-view').value;fit();save()});$('#fp-plus').addEventListener('click',()=>zoom(1.2));$('#fp-minus').addEventListener('click',()=>zoom(1/1.2));$('#fp-native').addEventListener('click',()=>zoom(1/state.zoom));$('#fp-fit').addEventListener('click',()=>{fit();save()});$('#fp-focus').addEventListener('click',()=>inspect(state.selected));$('#fp-contract').addEventListener('click',contract);$('#fp-budget').addEventListener('click',budget);
map.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY,startX:state.x,startY:state.y};dragged=false});map.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)dragged=true;if(dragged){state.x=drag.startX+dx;state.y=drag.startY+dy;paint()}});function stop(e){if(!drag)return;if(dragged){e.preventDefault();save()}drag=null;setTimeout(()=>dragged=false,0)}map.addEventListener('pointerup',stop);map.addEventListener('pointercancel',stop);map.addEventListener('pointerleave',e=>{if(drag&&e.buttons===0)stop(e)});map.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1)},{passive:false});
function restore(s){const p=s?.privateContent;if(!p||p.version!==2||!views.some(v=>v.id===p.view)||!by.has(p.selected))return false;Object.assign(state,p);return true}
restore(window.openai?.widgetState);fit();inspect(state.selected,false);suppressSave=false;new ResizeObserver(()=>fit()).observe(map);window.addEventListener('openai:set_globals',e=>{suppressSave=true;if(restore(e.detail?.globals?.widgetState)){paint();if(state.panel==='contract')contract();else if(state.panel==='budget')budget();else inspect(state.selected,false)}suppressSave=false});
})();
</script>
