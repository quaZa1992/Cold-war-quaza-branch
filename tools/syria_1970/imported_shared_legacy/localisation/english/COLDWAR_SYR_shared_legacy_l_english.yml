 FSA_rebel_fighting_spirit_idea: "Rebel Fighting Spirit"
 FSA_rebel_fighting_spirit_idea_desc: "The Free Syrian Army has started with a fighting spirit and are ready to fight against the Al-Assad regime. They are ready to fight for the freedom of the country and for the rights of the people."
