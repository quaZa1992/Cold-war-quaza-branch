<!-- IMPERIA COLD WAR — France 1970 installed-tree preview, not a game screenshot. -->
<div id="france-runtime-preview">
  <style>
    #france-runtime-preview{--ink:#e7e2d4;--muted:#bab6aa;--panel:#252822;--ground:#161b19;--rule:#6c6d58;--gold:#baa16c;--good:#9dc6a3;--bad:#e6a19a;box-sizing:border-box;color:var(--ink);background:var(--panel);font:14px/1.5 Arial,sans-serif;color-scheme:dark}
    #france-runtime-preview *{box-sizing:border-box}
    #france-runtime-preview .fr-head{padding:14px 100px 12px 18px;border-bottom:1px solid var(--rule)}
    #france-runtime-preview h2,#france-runtime-preview h3{font-weight:500;margin:0 0 8px;line-height:1.3}
    #france-runtime-preview h2{font-size:20px}#france-runtime-preview h3{font-size:16px}
    #france-runtime-preview .fr-sub{font-size:12px;color:var(--muted)}
    #france-runtime-preview .fr-controls,#france-runtime-preview .fr-shortcuts,#france-runtime-preview .fr-offer-jumps{display:flex;gap:7px;flex-wrap:wrap;padding:9px 14px;align-items:center}
    #france-runtime-preview button,#france-runtime-preview select{font:inherit;color:var(--ink);background:#343a32;border:1px solid var(--rule);border-radius:2px;padding:6px 9px;max-width:100%}
    #france-runtime-preview button[aria-pressed="true"]{background:#60573e;border-color:var(--gold)}
    #france-runtime-preview button:focus-visible,#france-runtime-preview select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    #france-runtime-preview label{display:flex;align-items:center;gap:6px;min-width:0}
    #france-runtime-preview .fr-controls label{flex:1 1 190px}
    #france-runtime-preview select{min-width:0;flex:1}
    #france-runtime-preview .fr-map{height:720px;overflow:hidden;position:relative;touch-action:none;user-select:none;background:var(--ground);border-block:1px solid var(--rule)}
    #france-runtime-preview .fr-world{position:absolute;transform-origin:0 0;left:0;top:0;width:10400px;height:2050px}
    #france-runtime-preview .fr-lines{position:absolute;overflow:visible;left:0;top:0;pointer-events:none}
    #france-runtime-preview .fr-lines path{fill:none;stroke:#a49978;stroke-width:2}
    #france-runtime-preview .fr-lines .fr-exclusion{stroke:#c08b7e;stroke-dasharray:5 4}
    #france-runtime-preview .fr-group{position:absolute;color:#c6b88e;font-size:17px;white-space:nowrap;pointer-events:none}
    #france-runtime-preview .fr-focus{position:absolute;width:165px;height:128px;background:none;border:0;padding:0;color:#eee4ce;font:inherit;text-align:center;touch-action:manipulation;cursor:pointer}
    #france-runtime-preview .fr-focus .fr-goal{position:absolute;width:82px;height:82px;object-fit:contain;top:0;left:50%;transform:translateX(-50%);pointer-events:none}
    #france-runtime-preview .fr-focus .fr-titlebar{position:absolute;width:164px;height:50px;left:0;top:60px;pointer-events:none}
    #france-runtime-preview .fr-focus .fr-name{position:absolute;top:75px;left:9px;width:147px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:15px;line-height:20px;text-shadow:0 1px 2px #000;pointer-events:none}
    #france-runtime-preview .fr-focus.is-selected{outline:1px solid #d5c392;outline-offset:2px}
    #france-runtime-preview .fr-focus.is-locked .fr-goal{filter:saturate(.3);opacity:.8}
    #france-runtime-preview .fr-focus:focus-visible{outline:3px solid #e2c885}
    #france-runtime-preview .fr-map.is-overview .fr-name,#france-runtime-preview .fr-map.is-overview .fr-titlebar{visibility:hidden}
    #france-runtime-preview .fr-status{padding:7px 14px;font-size:12px;color:var(--muted)}
    #france-runtime-preview .fr-details{padding:16px 18px;background:#222720;border-top:1px solid var(--rule)}
    #france-runtime-preview .fr-description{max-width:950px;margin:8px 0 14px;color:var(--ink)}
    #france-runtime-preview .fr-detail-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
    #france-runtime-preview .fr-effects{list-style:none;padding:0;margin:8px 0 16px}
    #france-runtime-preview .fr-effects li{margin:4px 0;overflow-wrap:anywhere}
    #france-runtime-preview .fr-effects .fr-spirit-head{font-weight:500;margin-top:8px}
    #france-runtime-preview .fr-effects .fr-spirit-detail{padding-left:18px}
    #france-runtime-preview .fr-modifies-heading{font-size:16px;font-weight:500;margin:12px 0 4px}
    #france-runtime-preview .fr-effects .fr-good{color:var(--good)}#france-runtime-preview .fr-effects .fr-bad{color:var(--bad)}
    #france-runtime-preview .fr-requirements{padding-left:18px;margin:8px 0 16px}
    #france-runtime-preview .fr-requirements button{padding:1px 4px;background:none}
    #france-runtime-preview .fr-term{display:flex;align-items:center;gap:8px;margin-top:14px}
    #france-runtime-preview .fr-term img{width:28px;height:28px;object-fit:contain}
    #france-runtime-preview .fr-offer-jumps button{white-space:normal;text-align:left}
    #france-runtime-preview details{margin:12px 14px;font-size:12px;color:var(--muted)}
    #france-runtime-preview [hidden]{display:none!important}
    @media(max-width:650px){#france-runtime-preview .fr-detail-cols{grid-template-columns:1fr;gap:12px}#france-runtime-preview .fr-map{height:500px}#france-runtime-preview .fr-head{padding-left:12px}#france-runtime-preview .fr-controls,#france-runtime-preview .fr-shortcuts,#france-runtime-preview .fr-offer-jumps{padding-inline:10px}#france-runtime-preview .fr-details{padding:13px 12px}#france-runtime-preview label{flex-wrap:wrap}#france-runtime-preview select{width:100%}}
  </style>
  <header class="fr-head"><h2>France 1970 National Focus</h2><div id="fr-runtime-caption" class="fr-sub"></div></header>
  <section aria-label="France national focus tree">
    <div class="fr-controls">
      <label>Section <select id="fr-section" aria-label="Focus section"></select></label>
      <label>Ruling party preview <select id="fr-government" aria-label="Ruling party preview"></select></label>
      <button id="fr-less" type="button" aria-label="Zoom out">−</button><button id="fr-more" type="button" aria-label="Zoom in">+</button><button id="fr-fit" type="button">Fit section</button><button id="fr-native" type="button">Native scale</button>
    </div>
    <nav id="fr-shortcuts" class="fr-shortcuts" aria-label="Focus tree shortcuts"></nav>
    <div id="fr-map" class="fr-map" aria-label="Pan and zoom focus tree"><div id="fr-world" class="fr-world"><svg id="fr-lines" class="fr-lines" width="10400" height="2050" aria-hidden="true"></svg></div></div>
    <div id="fr-status" class="fr-status" aria-live="polite"></div>
    <div id="fr-details" class="fr-details" aria-live="polite"></div>
    <details><summary>Jump to a bilateral offer</summary><nav id="fr-offers" class="fr-offer-jumps" aria-label="Bilateral focus offers"></nav></details>
  </section>
  <script>
  (()=>{
    const D=__DESIGN__,P=__ART__,A=Object.fromEntries(Object.entries(P.sprites).map(([k,t])=>[k,P.textures[t]])),r=document.getElementById('france-runtime-preview');
    const $=s=>r.querySelector(s),N=Object.fromEntries(D.nodes.map(n=>[n.key,n])),G=Object.fromEntries(D.groups.map(g=>[g.id,g]));
    const spirits=Object.fromEntries([...(D.starting_spirits||[]),...(D.recovery_stages||[])].map(s=>[s.id,s]));
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const labels={political_power_factor:'Political Power Gain',bureaucracy_cost_multiplier_modifier:'Bureaucracy Cost Multiplier',stability_factor:'Stability',production_factory_efficiency_gain_factor:'Production Efficiency Growth',social_cost_multiplier_modifier:'Social Spending Cost Multiplier',production_speed_industrial_complex_factor:'Civilian Factory Construction Speed',production_speed_infrastructure_factor:'Infrastructure Construction Speed',energy_use_modifier_civs:'Civilian Industry Energy Use',research_speed_factor:'Research Speed',education_cost_multiplier_modifier:'Education Cost Multiplier',war_support_factor:'War Support',equipment_cost_multiplier_modifier:'Equipment Cost Multiplier',industrial_capacity_factory:'Factory Output',production_speed_buildings_factor:'Construction Speed',civilian_factories_productivity:'Civilian Factory Productivity',production_factory_max_efficiency_factor:'Production Efficiency Cap',corporate_tax_income_multiplier_modifier:'Corporate Tax Income Multiplier',foreign_influence_modifier:'Foreign Influence',tax_gain_multiplier_modifier:'Tax Income Multiplier',country_productivity_growth_modifier:'Productivity Growth Multiplier',army_personnel_cost_multiplier_modifier:'Army Personnel Cost Multiplier',army_core_defence_factor:'Division Defence on Core Territory',training_time_army_factor:'Division Training Time',energy_gain_multiplier:'Energy Generation Multiplier',agricolture_productivity_modifier:'Agricultural Productivity',army_org_factor:'Division Organisation',land_reinforce_rate:'Reinforce Rate',army_org_regain:'Division Recovery Rate',air_accidents_factor:'Air Accident Chance',air_training_xp_gain_factor:'Air Training Experience Gain',air_fuel_consumption_factor:'Air Fuel Consumption',industrial_capacity_dockyard:'Dockyard Output',navy_personnel_cost_multiplier_modifier:'Navy Personnel Cost Multiplier',naval_accidents_chance:'Naval Accident Chance',supply_consumption_factor:'Supply Consumption',airforce_personnel_cost_multiplier_modifier:'Air Force Personnel Cost Multiplier',police_cost_multiplier_modifier:'Police Cost Multiplier',land_doctrine_cost_factor:'Land Doctrine Cost',max_planning:'Maximum Planning',foreign_influence_defense_modifier:'Foreign Influence Defence',offices_productivity:'Office Sector Productivity',military_factories_productivity:'Military Industry Productivity',dockyard_productivity:'Naval Industry Productivity',health_cost_multiplier_modifier:'Health Spending Cost Multiplier',production_speed_nuclear_reactor_factor:'Nuclear Reactor Construction Speed',nuclear_energy_generation_modifier:'Nuclear Energy Generation'};
    const negative=new Set(Object.keys(labels).filter(k=>/cost|accident|consumption|energy_use|training_time/.test(k)));negative.add('health_cost_multiplier_modifier');
    const categories={CAT_industry:'Industrial Research',CAT_electronics:'Electronics Research',CAT_armor:'Armour Research',CAT_aircraft:'Aircraft Research',CAT_nuclear_reactors:'Civil Nuclear Research',CAT_naval:'Naval Research',CAT_energy:'Energy Research',CAT_infrastructure:'Rail and Infrastructure Research'};
    const stateNames={42:'Baden-Wurttemberg',54:'Hauts-de-France',55:'Normandie',56:'Ile de France',57:'Alsace-Lorraine',58:'Bourgogne',59:'Loire',60:'Aquitaine',61:'Midi Pyrenees',62:'Rhone-Alpes',63:'Provence',64:'Bretagne',65:'Corsica',265:'Romagna',386:'Algerois',652:'Moscow',661:'Tartarstan',811:'California',1080:'Hamburg'};
    const buildingNames={infrastructure:'Infrastructure',industrial_complex:'Civilian Factory',arms_factory:'Military Factory',dockyard:'Naval Dockyard',nuclear_reactor:'Nuclear Reactor',offices:'Office',agriculture_district:'Agriculture District',internet_station:'Network Infrastructure',naval_base:'Naval Base',fossil_powerplant:'Fossil Fuel Power Plant'};
    const factionNames={labour_unions:'Labour Unions',industrial_conglomerates:'Industrial Conglomerates',farmers:'Farmers'};
    const provinces={11834:'Marseille',6536:'Lorient',6449:'Normandie port'};
    const num=(v,d=5)=>Number(Math.abs(v).toFixed(d)).toString(), sign=(v,d=2)=>`${v>=0?'+':'-'}${num(v*100,d)}%`;
    const blocked=new Set(['executive','parliament','contract','statute','memory','amnesty','civic_settlement','progress','gaullist_success','liberal_state','social_market','american_challenge','socialist_refoundation','advanced_democracy','grassroots_left','environment_account','cid_tax']);
    const shortcutLabels=Object.fromEntries((D.emitted_shortcuts||[]).map(s=>[s.group,s.label]));
    function groupLabel(id){return shortcutLabels[id]||G[id]?.title||id;}
    function effectRows(effects,side='France'){
      const rows=[];
      for(const e of effects){let text='',good=null;
        if(e.kind==='modifier'){text=(labels[e.key]||e.key)+': '+sign(e.value);good=negative.has(e.key)?e.value<0:e.value>0;}
        else if(e.kind==='treasury_gdp'){text='Treasury: '+(e.percent>=0?'+':'-')+num(e.percent)+'% of current GDP';good=e.percent>0;}
        else if(e.kind==='weekly_gdp_expense'){text='Weekly Additional Expenses: -'+num(e.annual_gdp_percent/e.divisor,5)+'% of current GDP';good=false;}
        else if(e.kind==='political_power'){text='Political Power: '+(e.value>=0?'+':'')+e.value;good=e.value>0;}
        else if(e.kind==='state_slots'){const st=stateNames[e.state]||('State '+e.state);rows.push({text:side+': '+st+' +'+e.amount+' shared building slot'+(e.amount===1?'':'s'),good:true,extraSlots:e.state,amount:e.amount});continue;}
        else if(e.kind==='building'){const st=stateNames[e.state]||('State '+e.state),target=e.province?(provinces[e.province]||('Province '+e.province)):st;rows.push({text:side+': '+st+' +'+e.slots+' shared building slot'+(e.slots===1?'':'s'),good:true,slot:e.state});rows.push({text:side+': '+target+' +'+e.amount+' '+(buildingNames[e.building]||e.building),good:true,build:e.state});continue;}
        else if(e.kind==='research'){text=(categories[e.category]||e.category)+': +'+num(e.bonus*100,2)+'% bonus, '+e.uses+' use'+(e.uses===1?'':'s');good=true;}
        else if(e.kind==='experience'){text=e.service[0].toUpperCase()+e.service.slice(1)+' Experience: +'+e.amount;good=true;}
        else if(e.kind==='faction_opinion'){text=(factionNames[e.faction]||e.faction)+' Opinion: '+(e.value>=0?'+':'')+e.value;good=e.value>0;}
        else if(e.kind==='doctrine'){text=e.category.replace('_doctrine','').replace(/^./,c=>c.toUpperCase())+' Doctrine: -'+num(e.reduction*100,2)+'% cost, '+e.uses+' use'+(e.uses===1?'':'s');good=true;}
        else if(e.kind==='remove_spirit'){const s=spirits[e.spirit];rows.push({text:'Remove national spirit: '+(s?.title||e.spirit),spiritHead:true});for(const m of s?.modifiers||[])rows.push({text:(labels[m.key]||m.key)+': '+sign(m.value),spiritDetail:true});continue;}
        else if(e.kind==='transition_spirit'){const old=spirits[e.from],next=e.to?spirits[e.to]:null;rows.push({text:'Remove national spirit: '+(old?.title||e.from),spiritHead:true});for(const m of old?.modifiers||[])rows.push({text:(labels[m.key]||m.key)+': '+sign(m.value),spiritDetail:true});if(next){rows.push({text:'Add national spirit: '+next.title,spiritHead:true});for(const m of next.modifiers||[])rows.push({text:(labels[m.key]||m.key)+': '+sign(m.value),spiritDetail:true});}continue;}
        else if(e.kind==='unlock_decision'){text='Decision unlocked: '+(D.decisions.find(d=>d.id===e.id)?.title||e.label);good=true;}
        if(text)rows.push({text,good});
      }
      return '<ul class="fr-effects">'+rows.map(x=>'<li class="'+(x.good===true?'fr-good':x.good===false?'fr-bad':'')+(x.spiritHead?' fr-spirit-head':'')+(x.spiritDetail?' fr-spirit-detail':'')+'"'+(x.slot!==undefined?' data-asset-slot="'+x.slot+'"':'')+(x.build!==undefined?' data-asset-build="'+x.build+'"':'')+(x.extraSlots!==undefined?' data-extra-slots="'+x.extraSlots+'" data-extra-amount="'+x.amount+'"':'')+'>'+esc(x.text)+'</li>').join('')+'</ul>';
    }
    function spiritFor(id){for(const a of D.nodes){if(!a.offer)continue;for(const side of ['france','recipient'])if(a.offer[side].spirit===id)return {title:a.offer[side].title,country:side==='france'?'France':a.offer.partner_name};}return null;}
    function fmtCondition(c,n){
      if(c.endsWith('_are_in_power = yes')){const trigger=c.split(' = ')[0],g=D.groups.find(x=>x.trigger===trigger);return g?groupLabel(g.id)+' must lead the government.':'A required political party must lead the government.';}
      if(c==='has_idea = EU_member')return 'France has European Communities membership.';
      if(c==='has_idea = NATO_member')return 'France has NATO membership.';
      if(c==='GER = { has_idea = NATO_member }')return 'West Germany has NATO membership.';
      if(c==='ENG = { has_idea = NATO_member }')return 'Britain has NATO membership.';
      if(c==='has_tech = internet_1')return 'Network Infrastructure I is researched.';
      if(c==='GER = { has_tech = internet_1 }')return 'West Germany has researched Network Infrastructure I.';
      const m=c.match(/^(?:[A-Z]{3} = \{ )?has_idea = ([A-Za-z0-9_]+)(?: \})?$/);if(m){const found=spiritFor(m[1]);if(found)return found.country+' has active agreement: '+found.title+'.';if(m[1]==='EU_member')return 'European Communities membership is active.';if(m[1]==='NATO_member')return 'NATO membership is active.';}
      const tech=c.match(/^(?:([A-Z]{3}) = \{ )?has_tech = ([A-Za-z0-9_]+)(?: \})?$/);if(tech){const country=tech[1]==='GER'?'West Germany':tech[1]==='ENG'?'Britain':tech[1]==='SOV'?'Soviet Union':'France';return country+' has researched '+(tech[2]==='internet_1'?'Network Infrastructure I':tech[2])+'.';}
      if(c==='Bilateral peace')return 'Both countries must remain at peace with one another.';
      if(c.startsWith('No native embargo'))return 'No native embargo or mirrored diplomatic, financial, economic or military sanctions may exist between the countries.';
      if(c.startsWith('Every promised state/province is owned and fully controlled'))return 'Each promised state or province must be owned and fully controlled by the country receiving the asset, with room under the native building level limit for the granted level.';
      if(c==='The proposal and one-time transaction are still valid')return null;
      return null;
    }
    function assetRequirementRows(n){if(!n.offer)return[];const rows=[];for(const [sideKey,country,effects] of [['france','France',n.offer.france.effects],['recipient',n.offer.partner_name,n.offer.recipient.effects]])for(const e of effects)if(e.kind==='building'){const state=stateNames[e.state]||('State '+e.state),location=e.province?(provinces[e.province]||('Province '+e.province))+' in '+state:state+' (state '+e.state+')',kind=buildingNames[e.building]||e.building;rows.push(country+' must own and fully control '+location+' and have native level capacity for '+e.amount+' additional '+kind+' level'+(e.amount===1?'':'s')+'.');}return rows;}
    function visibleRequirements(n){const out=[];for(const c of n.conditions||[]){const text=fmtCondition(c,n);if(text&&!out.includes(text))out.push(text);}
      for(const text of n.asset_requirements||[])if(!out.includes(text))out.push(text);
      if(n.offer){for(const c of n.offer.activation_conditions||[]){const text=fmtCondition(c,n);if(text&&!out.includes(text))out.push(text);}for(const c of n.offer.acceptance_conditions||[]){if(c==='The proposal and one-time transaction are still valid')continue;const text=fmtCondition(c,n)||c;if(!out.includes(text))out.push(text);}for(const text of assetRequirementRows(n))if(!out.includes(text))out.push(text);}
      for(const group of n.prerequisites||[]){const titles=group.map(k=>N[k]?.title||k);out.push({or:titles,keys:group});}
      const excluded=(n.exclusions||[]).map(k=>N[k]?.title||k);if(excluded.length)out.push('Mutually exclusive with: '+excluded.join('; '));
      return out;
    }
    const world=$('#fr-world'),lines=$('#fr-lines'),map=$('#fr-map');
    const governments=D.groups.filter(g=>g.slot!==null&&!g.governing_group),exclusive=D.nodes.reduce((v,n)=>v+(n.exclusions||[]).length,0)/2,offers=D.nodes.filter(n=>n.offer);
    let government=D.navigation.initial_government||'udr',section=D.navigation.preview_section||'udr',selected=(D.navigation.initial_focus||'COLDWAR_FRA2_progress').replace('COLDWAR_FRA2_',''),z=1,tx=0,ty=0,panning=null;
    const saved=window.openai?.widgetState?.privateContent;if(saved&&N[saved.focus]&&G[saved.government]&&G[saved.section]){selected=saved.focus;government=saved.government;section=saved.section;}
    $('#fr-runtime-caption').textContent='Installed focus tree · '+D.nodes.length+' focuses · '+offers.length+' recipient-approved agreements';
    $('#fr-section').innerHTML='<option value="overview">Full tree</option>'+D.groups.map(g=>'<option value="'+g.id+'">'+esc(groupLabel(g.id))+'</option>').join('');$('#fr-section').value=section;
    $('#fr-government').innerHTML=governments.map(g=>'<option value="'+g.id+'">'+esc(groupLabel(g.id))+'</option>').join('');$('#fr-government').value=government;
    for(const s of D.emitted_shortcuts||[]){const b=document.createElement('button');b.type='button';b.textContent=s.label;b.dataset.jump=(s.target||'').replace('COLDWAR_FRA2_','');b.onclick=()=>{const n=N[b.dataset.jump];if(n){selected=n.key;section=n.group;$('#fr-section').value=section;fit(section);inspect(n.key);}};$('#fr-shortcuts').append(b);}
    for(const g of D.groups){const h=document.createElement('div');h.className='fr-group';h.dataset.group=g.id;h.textContent=groupLabel(g.id);h.style.left=(Math.min(...D.nodes.filter(n=>n.group===g.id).map(n=>n.x))*96)+'px';h.style.top=(g.y*130-36)+'px';world.append(h);}
    function icon(n){return n.key;}
    for(const n of D.nodes){const b=document.createElement('button');b.type='button';b.className='fr-focus';b.dataset.key=n.key;b.setAttribute('aria-label',n.title);b.style.left=n.x*96+'px';b.style.top=n.y*130+'px';b.innerHTML='<img class="fr-goal" alt="" src="'+A[icon(n)]+'"><img class="fr-titlebar" alt="" src="'+A.GFX_focus_unavailable+'"><span class="fr-name">'+esc(n.title)+'</span>';b.addEventListener('pointerdown',e=>e.stopPropagation());b.addEventListener('click',()=>inspect(n.key));world.append(b);}
    function renderLines(){let p='';for(const n of D.nodes){if(n._previewHidden)continue;for(const block of n.prerequisites||[])for(const key of block){const a=N[key];if(!a||a._previewHidden)continue;const x1=a.x*96+82.5,y1=a.y*130+128,x2=n.x*96+82.5,y2=n.y*130,mid=y2-1;p+='<path d="M'+x1+','+y1+' V'+mid+' H'+x2+' V'+y2+'"/>';} 
      for(const key of n.exclusions||[])if(n.key<key){const a=N[key];if(a&&!a._previewHidden&&n.y===a.y){const left=n.x<a.x?n:a,right=n.x<a.x?a:n;const middle=D.nodes.some(m=>!m._previewHidden&&m.y===n.y&&m.x>left.x&&m.x<right.x&&(n.exclusions||[]).includes(m.key)&&(a.exclusions||[]).includes(m.key));if(!middle)p+='<path class="fr-exclusion" d="M'+(left.x*96+166)+','+(left.y*130+92)+' H'+(right.x*96-2)+'"/>';}}}lines.innerHTML=p;}
    function transform(){world.style.transform='translate('+tx+'px,'+ty+'px) scale('+z+')';map.classList.toggle('is-overview',z<.32);$('#fr-status').textContent=D.nodes.length+' focuses · '+exclusive+' mutually exclusive pairs · '+offers.length+' bilateral proposals · '+Math.round(z*100)+'%';}
    function fit(group=section){const ns=group==='overview'?[...D.nodes]:D.nodes.filter(n=>n.group===group);if(G[group]?.parent_group){for(const n of [...ns])for(const k of (n.prerequisites||[]).flat())if(N[k]&&N[k].group!==group&&!ns.includes(N[k]))ns.push(N[k]);}
      const visible=new Set(ns.map(n=>n.key));for(const n of D.nodes){n._previewHidden=!visible.has(n.key);const b=world.querySelector('[data-key="'+n.key+'"]');if(b)b.hidden=n._previewHidden;}for(const h of world.querySelectorAll('.fr-group'))h.hidden=group!=='overview'&&!ns.some(n=>n.group===h.dataset.group);renderLines();
      const minX=Math.min(...ns.map(n=>n.x))*96-18,minY=Math.min(...ns.map(n=>n.y))*130-55,maxX=Math.max(...ns.map(n=>n.x))*96+185,maxY=Math.max(...ns.map(n=>n.y))*130+145,w=map.clientWidth,h=map.clientHeight;z=Math.min(1,w/(maxX-minX),h/(maxY-minY))*.94;tx=(w-(maxX-minX)*z)/2-minX*z;ty=(h-(maxY-minY)*z)/2-minY*z;transform();}
    function zoom(next,cx=map.clientWidth/2,cy=map.clientHeight/2){const nz=Math.max(.055,Math.min(1.75,next));tx=cx-(cx-tx)*nz/z;ty=cy-(cy-ty)*nz/z;z=nz;transform();}
    function shade(){for(const b of world.querySelectorAll('.fr-focus')){const n=N[b.dataset.key],locked=G[n.group].slot!==null&&G[n.group].slot!==G[government].slot;b.classList.toggle('is-locked',locked);b.classList.toggle('is-selected',n.key===selected);b.querySelector('.fr-titlebar').src=A[locked?'GFX_focus_unavailable':'GFX_focus_can_start'];}}
    function offerTerms(side,sideLabel){let title=side.title||side.spirit;title=title.replace(new RegExp('\\s*:\\s*'+sideLabel.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')+'$'),'').replace(new RegExp('\\s*\\(\\s*'+sideLabel.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')+'\\s*\\)$'),'');return '<div class="fr-term"><h3>'+esc(sideLabel)+': '+esc(title)+'</h3></div>'+effectRows(side.effects,sideLabel);}
    function inspect(key,save=true){const n=N[key];if(!n)return;selected=key;shade();const requirements=visibleRequirements(n);let req='<li>Completion time: '+n.days+' days</li>'+requirements.map(v=>typeof v==='string'?'<li>'+esc(v)+'</li>':('<li>Requires '+v.or.map((t,i)=>'<button type="button" data-jump="'+v.keys[i]+'">'+esc(t)+'</button>').join(' or ')+'</li>')).join('');
      const modifierEffects=n.effects.filter(e=>e.kind==='modifier'),ordinaryEffects=n.effects.filter(e=>e.kind!=='modifier');
      const programmeLabel=n.spirit_title||n.spirit_name||'';
      const nonOfferEffects=n.offer?effectRows(n.effects,'France'):effectRows(ordinaryEffects,'France')+(modifierEffects.length?'<h3 class="fr-modifies-heading">Modifies '+esc(programmeLabel)+'</h3>'+effectRows(modifierEffects,'France'):'');
      let body='<h2>'+esc(n.title)+'</h2><div class="fr-sub">'+esc(groupLabel(n.group))+' · '+n.days+' days</div><p class="fr-description">'+esc(n.description)+'</p><div class="fr-detail-cols"><div><h3>Requirements</h3><ul class="fr-requirements">'+req+'</ul></div><div><h3>Effects</h3>'+nonOfferEffects;
      if(n.offer)body+='<h3>If they accept</h3>'+offerTerms(n.offer.france,'France')+offerTerms(n.offer.recipient,n.offer.partner_name);
      for(const d of (n.effects||[]).filter(e=>e.kind==='unlock_decision')){const decision=D.decisions.find(x=>x.id===d.id);if(decision)body+='<h3>Decision effects: '+esc(decision.title)+'</h3>'+effectRows(decision.effects,'France');}
      body+='</div></div>';$('#fr-details').innerHTML=body;
      for(const b of $('#fr-details').querySelectorAll('[data-jump]'))b.onclick=()=>{const target=N[b.dataset.jump];if(target){section=target.group;$('#fr-section').value=section;fit(section);inspect(target.key);}};
      if(save&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{focus:n.title},privateContent:{focus:key,government,section,revision:D.revision}}).catch(()=>{});
    }
    $('#fr-section').onchange=e=>{section=e.target.value;fit(section);};$('#fr-government').onchange=e=>{government=e.target.value;shade();inspect(selected);};$('#fr-more').onclick=()=>zoom(z*1.25);$('#fr-less').onclick=()=>zoom(z/1.25);$('#fr-fit').onclick=()=>fit(section);$('#fr-native').onclick=()=>{const n=N[selected];z=1;tx=map.clientWidth/2-n.x*96-82;ty=map.clientHeight/2-n.y*130-50;transform();};
    map.addEventListener('pointerdown',e=>{if(e.target.closest('.fr-focus'))return;panning={x:e.clientX,y:e.clientY,tx,ty};map.setPointerCapture(e.pointerId);});map.addEventListener('pointermove',e=>{if(panning){tx=panning.tx+e.clientX-panning.x;ty=panning.ty+e.clientY-panning.y;transform();}});const stop=e=>{panning=null;if(map.hasPointerCapture(e.pointerId))map.releasePointerCapture(e.pointerId);};map.addEventListener('pointerup',stop);map.addEventListener('pointercancel',stop);map.addEventListener('wheel',e=>{e.preventDefault();const b=map.getBoundingClientRect();zoom(z*(e.deltaY<0?1.1:1/1.1),e.clientX-b.left,e.clientY-b.top);},{passive:false});
    $('#fr-offers').innerHTML=offers.map(n=>'<button type="button" data-offer="'+n.key+'">'+esc(n.title)+'</button>').join('');for(const b of $('#fr-offers').querySelectorAll('[data-offer]'))b.onclick=()=>{const n=N[b.dataset.offer];section=n.group;$('#fr-section').value=section;fit(section);inspect(n.key);map.scrollIntoView({block:'nearest'});};
    renderLines();shade();inspect(selected,false);requestAnimationFrame(()=>fit(section));new ResizeObserver(()=>fit(section)).observe(map);
    window.franceRuntime={data:D,inspect,fit,icon,getView:()=>({selected,government,section,z,tx,ty})};
  })();
  </script>
</div>
