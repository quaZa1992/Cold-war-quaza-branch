 COLDWAR_KOR_army_civilian_ministry:0 "A Civilian Ministry"
 COLDWAR_KOR_army_civilian_ministry_desc:0 "Put ministerial appointments under lawful civilian authority; command adaptation has a short-run cost. A civilian defense minister would set personnel and procurement policy, requiring officers to adapt to political rather than club-based appointments."
 COLDWAR_KOR_army_civilian_ministry_preview:0 "A Civilian Ministry"
 COLDWAR_KOR_army_civilian_ministry_preview_desc:0 "Put ministerial appointments under lawful civilian authority; command adaptation has a short-run cost. A civilian defense minister would set personnel and procurement policy, requiring officers to adapt to political rather than club-based appointments."
