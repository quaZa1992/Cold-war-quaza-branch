 COLDWAR_KOR_coastal_defence_desc:0 "Coastal warning and maritime readiness receive priority as the government addresses the vulnerability of a long and exposed shoreline. Investment in surveillance and naval coordination strengthens this mission, but leaves fewer resources for air-force development."
