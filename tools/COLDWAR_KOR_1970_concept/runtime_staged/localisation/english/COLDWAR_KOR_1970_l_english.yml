 COLDWAR_KOR_usfk_exercise_invite_field_decision_desc:0 "A field programme would test combat readiness and reinforcement arrangements under demanding conditions. Its benefits depend on coordination with the United States and the resources required to sustain the agreed schedule."
 COLDWAR_KOR_usfk_exercise_invite_staff_decision:0 "Propose Command-Post Exercises"
 COLDWAR_KOR_usfk_exercise_invite_staff_decision_desc:0 "A command-post programme would test communications and operational planning without the same field commitment. Both staffs must contribute personnel and resources while reconciling their national chains of command."
