 COLDWAR_KOR_wage_discipline:0 "Wage Discipline"
 COLDWAR_KOR_wage_discipline_desc:0 "Export production remains prioritized amid unresolved workplace protections."
 COLDWAR_KOR_warranted_operations:0 "Warranted Operations"
 COLDWAR_KOR_warranted_operations_desc:0 "Professional safeguards limit political operations and require oversight. Judicial warrants distinguish criminal and counterintelligence work from partisan surveillance, requiring investigators to document their grounds."
 COLDWAR_KOR_warranted_operations_preview:0 "Warranted Operations"
 COLDWAR_KOR_warranted_operations_preview_desc:0 "Professional safeguards limit political operations and require oversight. Judicial warrants distinguish criminal and counterintelligence work from partisan surveillance, requiring investigators to document their grounds."
 COLDWAR_KOR_warranted_operations_programme:0 "Warranted Operations"
 COLDWAR_KOR_warranted_operations_programme_desc:0 "Professional safeguards limit political operations and require oversight. Judicial warrants distinguish criminal and counterintelligence work from partisan surveillance, requiring investigators to document their grounds."
 COLDWAR_KOR_withdraw_charter_endorsement_army_djp:0 "Withdraw Army / DJP Charter Endorsement"
 COLDWAR_KOR_withdraw_charter_endorsement_army_djp_desc:0 "Support from the Army and DJP organization rests on the concessions made during negotiations over command continuity and the boundaries of a civilian opening. Withdrawing its endorsement before the ballot would reopen that dispute and remove its support from the agreed constitutional text."
 COLDWAR_KOR_withdraw_charter_endorsement_drp:0 "Withdraw DRP Charter Endorsement"
 COLDWAR_KOR_withdraw_charter_endorsement_drp_desc:0 "Support from the conservative governing organization rests on the concessions made during negotiations over executive continuity and the survival of its local organization. Withdrawing its endorsement before the ballot would reopen that dispute and remove its support from the agreed constitutional text."
 COLDWAR_KOR_withdraw_charter_endorsement_independent_left:0 "Withdraw Independent Left Charter Endorsement"
 COLDWAR_KOR_withdraw_charter_endorsement_independent_left_desc:0 "Support from the independent Southern left rests on the concessions made during negotiations over political independence and a voice for organized labour. Withdrawing its endorsement before the ballot would reopen that dispute and remove its support from the agreed constitutional text."
 COLDWAR_KOR_withdraw_charter_endorsement_ndp:0 "Withdraw NDP Charter Endorsement"
 COLDWAR_KOR_withdraw_charter_endorsement_ndp_desc:0 "Support from the parliamentary opposition rests on the concessions made during negotiations over competitive elections and an Assembly capable of checking the executive. Withdrawing its endorsement before the ballot would reopen that dispute and remove its support from the agreed constitutional text."
 COLDWAR_KOR_withdraw_charter_endorsement_rpr:0 "Withdraw Revolutionary Party Charter Endorsement"
 COLDWAR_KOR_withdraw_charter_endorsement_rpr_desc:0 "Support from the legalized Southern revolutionary organization rests on the concessions made during negotiations over its place in the new political settlement and the peninsula question. Withdrawing its endorsement before the ballot would reopen that dispute and remove its support from the agreed constitutional text."
 COLDWAR_KOR_withdraw_charter_endorsement_student_civic:0 "Withdraw Civic Coalition Charter Endorsement"
 COLDWAR_KOR_withdraw_charter_endorsement_student_civic_desc:0 "Support from the student civic coalition rests on the concessions made during negotiations over freedom of association and safeguards against renewed emergency rule. Withdrawing its endorsement before the ballot would reopen that dispute and remove its support from the agreed constitutional text."
 COLDWAR_KOR_withdraw_charter_endorsement_two_kim_reform:0 "Withdraw Reform Movement Charter Endorsement"
 COLDWAR_KOR_withdraw_charter_endorsement_two_kim_reform_desc:0 "Support from the organizations of the Two Kims rests on the concessions made during negotiations over civilian government and the leadership of the democratic coalition. Withdrawing its endorsement before the ballot would reopen that dispute and remove its support from the agreed constitutional text."
 COLDWAR_KOR_withdraw_charter_endorsement_usp:0 "Withdraw USP Charter Endorsement"
 COLDWAR_KOR_withdraw_charter_endorsement_usp_desc:0 "Support from the Unification Socialist Party rests on the concessions made during negotiations over lawful social-democratic participation and enforceable labour rights. Withdrawing its endorsement before the ballot would reopen that dispute and remove its support from the agreed constitutional text."
 COLDWAR_KOR_worker_management:0 "Worker Management"
 COLDWAR_KOR_worker_management_desc:0 "Give workplace councils managerial authority, accepting slower investment decisions. Worker councils would share authority over hiring and production with managers, making investment choices more representative and less centralized."
