 COLDWAR_KOR_planning_board_programme_desc:0 "The Economic Planning Board would arbitrate ministry investment requests, set export benchmarks and report progress to the cabinet. Its stronger coordinating role brings ministries under a common development schedule."
 COLDWAR_KOR_pluralist_socialism:0 "Pluralist Socialism"
 COLDWAR_KOR_pluralist_socialism_desc:0 "Accept independent socialist and civic representation rather than a monopoly party. Pluralist socialists would keep labor, civic groups and rival left organizations legally active, accepting slower coordination than a monopoly party."
