 COLDWAR_KOR_professional_trade_missions:0 "Professional Missions"
 COLDWAR_KOR_professional_trade_missions_desc:0 "Specialist trade missions give Korean exporters consistent representation beyond personal diplomacy. A professional network can support contracts and commercial understanding, while its costs fall on the state and its value depends on long-term relationships with foreign partners."
