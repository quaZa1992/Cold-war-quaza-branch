 COLDWAR_KOR_usp_sectoral_bargaining_programme:0 "Sectoral Bargaining"
 COLDWAR_KOR_usp_sectoral_bargaining_programme_desc:0 "Negotiate sector agreements that suit different industries, accepting uneven coverage and administrative complexity. Industry agreements let unions and employers set terms for different sectors, demanding state mediators able to resolve uneven coverage."
 COLDWAR_KOR_usp_sectoral_bargaining_weekly_tt:0 "Policy upkeep: §R$1 million/week§!"
 COLDWAR_KOR_vanguard_party:0 "A Vanguard Party"
 COLDWAR_KOR_vanguard_party_desc:0 "Centralize the revolution under a disciplined party-state. A disciplined vanguard would centralize authority in party committees, subordinating independent unions and civic organizations to revolutionary leadership."
 COLDWAR_KOR_vanguard_party_preview:0 "A Vanguard Party"
 COLDWAR_KOR_vanguard_party_preview_desc:0 "Centralize the revolution under a disciplined party-state. A disciplined vanguard would centralize authority in party committees, subordinating independent unions and civic organizations to revolutionary leadership."
