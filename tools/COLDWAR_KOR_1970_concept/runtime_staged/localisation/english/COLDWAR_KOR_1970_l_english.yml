 COLDWAR_KOR_usfk_exercise_category_desc:0 "Combined training tests the alliance’s plans against the demands of reinforcement, command and logistics. Every programme requires an agreed schedule and the commitment of both governments."
 COLDWAR_KOR_usfk_exercise_completion_terms_tt:0 "§YOn successful completion:§!"
 COLDWAR_KOR_usfk_exercise_field_weekly_tt:0 "Training upkeep: §R$4 million/week§! for each government."
