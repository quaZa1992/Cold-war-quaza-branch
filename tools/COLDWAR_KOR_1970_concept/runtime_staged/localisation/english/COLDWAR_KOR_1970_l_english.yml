 COLDWAR_KOR_presidential_administration:0 "A Professional Cabinet"
 COLDWAR_KOR_presidential_administration_desc:0 "A professional cabinet gives either constitutional settlement an administrative foundation. Career officials and the Economic Planning Board would translate presidential priorities into budgets and investment schedules across ministries."
