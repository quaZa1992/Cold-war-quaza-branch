 COLDWAR_KOR_form_democratic_justice_party:0 "Constitute the Democratic Justice Party"
 COLDWAR_KOR_form_democratic_justice_party_desc:0 "An Army-led administration needs an organization capable of contesting elections and negotiating within civilian institutions. Constituting the Democratic Justice Party gives its supporters an electoral vehicle. Officers and party organizers must now decide how much independence that organization will enjoy from the command structure."
 COLDWAR_KOR_freight_corridors:0 "Freight Corridors"
 COLDWAR_KOR_freight_corridors_desc:0 "Better links between Seoul and the southeast connect major industrial centres and reduce the cost of moving goods across the country. The work supports both steel-based industry and provincial exports, but it competes with other development priorities for public capital."
 COLDWAR_KOR_freight_corridors_problem_tt:0 "Reforms An Unevenly Developed Republic."
 COLDWAR_KOR_gulf_project_access_offer_tt:0 "§YProposal: Construction Market Access§!\nRequires the selected partner’s acceptance.\n§YOn ratification:§!\n  South Korean upkeep: §R$1 million/week§!\n  Duration: §Y3 years§!"
 COLDWAR_KOR_hanahoe_compact:0 "The Officer Networks"
 COLDWAR_KOR_hanahoe_compact_desc:0 "Preserve loyal command networks, accepting political interference and civic distrust. Protecting officer-club ties can steady command relationships, but makes promotions appear political and deepens civilian suspicion of military influence."
 COLDWAR_KOR_hanahoe_compact_preview:0 "The Officer Networks"
 COLDWAR_KOR_hanahoe_compact_preview_desc:0 "Preserve loyal command networks, accepting political interference and civic distrust. Protecting officer-club ties can steady command relationships, but makes promotions appear political and deepens civilian suspicion of military influence."
 COLDWAR_KOR_hanahoe_compact_programme:0 "The Officer Networks"
 COLDWAR_KOR_hanahoe_compact_programme_desc:0 "Preserve loyal command networks, accepting political interference and civic distrust. Protecting officer-club ties can steady command relationships, but makes promotions appear political and deepens civilian suspicion of military influence."
 COLDWAR_KOR_heavy_chemical_drive:0 "Heavy Industry Drive"
 COLDWAR_KOR_heavy_chemical_drive_desc:0 "The government directs capital toward steel, machinery and chemicals, following the heavy-industry ambitions that reshaped the development programme in the 1970s. Concentrating finance in a few capital-intensive sectors can raise industrial output, while higher borrowing costs leave less room for other priorities."
 COLDWAR_KOR_heavy_chemical_drive_preview:0 "Heavy Industry Drive"
 COLDWAR_KOR_heavy_chemical_drive_preview_desc:0 "The government directs capital toward steel, machinery and chemicals, following the heavy-industry ambitions that reshaped the development programme in the 1970s. Concentrating finance in a few capital-intensive sectors can raise industrial output, while higher borrowing costs leave less room for other priorities."
 COLDWAR_KOR_heavy_chemical_drive_programme:0 "Heavy Industry Drive"
 COLDWAR_KOR_heavy_chemical_drive_programme_desc:0 "The government directs capital toward steel, machinery and chemicals, following the heavy-industry ambitions that reshaped the development programme in the 1970s. Concentrating finance in a few capital-intensive sectors can raise industrial output, while higher borrowing costs leave less room for other priorities."
 COLDWAR_KOR_historical.1979.d:0 "Park Chung Hee’s death leaves the constitutional succession unresolved. The historical civilian route installs Choi Kyu-hah as caretaker; military command remains a separate contest."
 COLDWAR_KOR_historical.1979.option_a:0 "Support the Interim Civilian Government"
 COLDWAR_KOR_historical.1979.option_b:0 "Submit to an Officer Council"
 COLDWAR_KOR_historical.1979.t:0 "A Presidential Succession Crisis"
 COLDWAR_KOR_historical_claims_dialogue_offer_tt:0 "§YProposal: Historical Claims Talks§!\nRequires agreement with Japan.\n§YOn ratification:§!\n  Duration: §Y3 years§!"
 COLDWAR_KOR_impartial_election_board:0 "An Impartial Ballot"
 COLDWAR_KOR_impartial_election_board_desc:0 "Restore lawful electoral competition using the actual party and coalition system; the result may return Roh, either Kim, or another eligible government. An independent commission would administer registration, campaigning and counts, giving competing parties confidence in the ballot."
 COLDWAR_KOR_impartial_election_board_preview:0 "An Impartial Ballot"
 COLDWAR_KOR_impartial_election_board_preview_desc:0 "Restore lawful electoral competition using the actual party and coalition system; the result may return Roh, either Kim, or another eligible government. An independent commission would administer registration, campaigning and counts, giving competing parties confidence in the ballot."
 COLDWAR_KOR_impartial_election_board_programme:0 "An Impartial Ballot"
 COLDWAR_KOR_impartial_election_board_programme_desc:0 "Restore lawful electoral competition using the actual party and coalition system; the result may return Roh, either Kim, or another eligible government. An independent commission would administer registration, campaigning and counts, giving competing parties confidence in the ballot."
 COLDWAR_KOR_implement_constitutional_court:0 "Commission the Constitutional Court"
 COLDWAR_KOR_implement_constitutional_court_desc:0 "Constitutional review requires more than a place in the new charter. Judges must be appointed, staff recruited and procedures established before the court can hear a case. Funding that work will give the settlement an institution capable of reviewing the exercise of state power."
 COLDWAR_KOR_incident_hotline:0 "An Incident Hotline"
 COLDWAR_KOR_incident_hotline_desc:0 "The Republic proposes a direct channel for managing military incidents while maintaining a credible deterrent. A hotline could reduce the danger of misunderstanding, though both commands must agree on its operation and the armed forces remain on guard."
 COLDWAR_KOR_incident_hotline_preview:0 "An Incident Hotline"
 COLDWAR_KOR_incident_hotline_preview_desc:0 "The Republic proposes a direct channel for managing military incidents while maintaining a credible deterrent. A hotline could reduce the danger of misunderstanding, though both commands must agree on its operation and the armed forces remain on guard."
