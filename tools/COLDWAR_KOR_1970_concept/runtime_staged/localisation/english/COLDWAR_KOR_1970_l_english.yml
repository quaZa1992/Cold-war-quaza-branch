 COLDWAR_KOR_constitutional_question:0 "Constitutional Review"
 COLDWAR_KOR_constitutional_question_desc:0 "The constitutional review would examine how executive authority, legislative scrutiny and judicial protection should be balanced. A public dossier gives opposing parties and civic organizations a common basis for debate."
