 COLDWAR_KOR_public_credit:0 "Public Credit"
 COLDWAR_KOR_public_credit_desc:0 "Keep credit allocation accountable to public institutions rather than conglomerates. Public lending institutions would set development priorities through accountable mandates, balancing industrial expansion against the risk of political loan allocation."
 COLDWAR_KOR_public_credit_preview:0 "Public Credit"
 COLDWAR_KOR_public_credit_preview_desc:0 "Keep credit allocation accountable to public institutions rather than conglomerates. Public lending institutions would set development priorities through accountable mandates, balancing industrial expansion against the risk of political loan allocation."
