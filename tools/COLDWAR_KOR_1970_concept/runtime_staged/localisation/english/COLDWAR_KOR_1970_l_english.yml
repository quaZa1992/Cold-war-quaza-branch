 COLDWAR_KOR_contributory_welfare:0 "Contributory Welfare"
 COLDWAR_KOR_contributory_welfare_desc:0 "Build a narrower, employment-funded system with lower immediate public spending. Employment-linked contributions build benefits alongside formal payrolls, keeping public commitments narrower but excluding many informal workers at first."
