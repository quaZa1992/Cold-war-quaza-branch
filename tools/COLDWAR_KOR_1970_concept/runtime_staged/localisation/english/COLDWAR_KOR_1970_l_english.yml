 COLDWAR_KOR_export_recovery_weekly_tt:0 "Policy upkeep: §R$4 million/week§!"
 COLDWAR_KOR_export_targets:0 "Enforce Export Targets"
 COLDWAR_KOR_export_targets_desc:0 "Reward firms that meet overseas sales targets, at the cost of leverage and workplace pressure. Export quotas reward firms that earn foreign exchange, but managers may meet them through wage restraint, overtime and heavier borrowing."
 COLDWAR_KOR_export_targets_preview:0 "Enforce Export Targets"
