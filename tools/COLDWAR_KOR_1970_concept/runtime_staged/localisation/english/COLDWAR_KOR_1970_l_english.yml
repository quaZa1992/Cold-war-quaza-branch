 COLDWAR_KOR_verification_priority:0 "Verification First"
 COLDWAR_KOR_verification_priority_desc:0 "The Republic prioritises reciprocal notifications and procedures for managing border incidents. This cautious approach to coexistence places responsibility on both commands to share information and gives Seoul a practical basis for reducing the risk of miscalculation."
 COLDWAR_KOR_verification_priority_preview:0 "Verification First"
 COLDWAR_KOR_verification_priority_preview_desc:0 "The Republic prioritises reciprocal notifications and procedures for managing border incidents. This cautious approach to coexistence places responsibility on both commands to share information and gives Seoul a practical basis for reducing the risk of miscalculation."
