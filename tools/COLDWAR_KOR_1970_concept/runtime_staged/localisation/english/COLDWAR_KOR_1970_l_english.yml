 COLDWAR_KOR_armed_vigilance:0 "Armed Vigilance"
 COLDWAR_KOR_armed_vigilance_desc:0 "The government keeps political contacts limited and maintains a heightened defensive posture toward the North. Greater readiness can reassure a population facing persistent security risks, but it consumes public resources and may make diplomatic engagement more difficult."
