 COLDWAR_KOR_peaceful_coexistence:0 "A Coexistence Proposal"
 COLDWAR_KOR_peaceful_coexistence_desc:0 "Seoul offers a nonaggression agreement and reciprocal restraint as a basis for peaceful coexistence. The proposal recognises separate governments, armed forces and alliances, seeking to reduce the danger of war without resolving the deeper national question."
 COLDWAR_KOR_peninsula_liaison_office:0 "Peninsula Liaison"
 COLDWAR_KOR_peninsula_liaison_office_conditional_tt:0 "Requires an active §YPermanent Korean Liaison§! agreement."
 COLDWAR_KOR_peninsula_liaison_office_desc:0 "Permanent liaison offices would give the two governments a daily means of resolving disputes and supervising agreed work. Seoul must negotiate the offices’ authority and finance their operation, balancing more reliable communication against the influence and obligations that sustained contact brings."
