 COLDWAR_KOR_contested_command:0 "Contested Command"
 COLDWAR_KOR_contested_command_desc:0 "Military command remains disputed during the succession crisis."
 COLDWAR_KOR_contract_worker_protection:0 "Contract Labour Rights"
 COLDWAR_KOR_contract_worker_protection_conditional_tt:0 "Requires an active §YOverseas Worker Protection§! agreement."
 COLDWAR_KOR_contract_worker_protection_desc:0 "Korean workers abroad depend on agreements that reach beyond the authority of Seoul’s labour administration. A protocol with West Germany would establish common responsibilities for their treatment and supervision, requiring both governments to support the institutions that enforce those standards."
