 COLDWAR_KOR_ys_civil_coalition:0 "A Reform Coalition"
 COLDWAR_KOR_ys_civil_coalition_desc:0 "Kim Young-sam would join parliamentary opponents, civic organizers and conservative defectors in a common reform front. Each partner would retain its own organization, so keeping the coalition together requires continuing negotiation."
