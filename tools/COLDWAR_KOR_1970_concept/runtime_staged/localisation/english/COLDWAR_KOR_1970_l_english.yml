 COLDWAR_KOR_ys_consolidation:0 "Civilian Appointments"
 COLDWAR_KOR_ys_consolidation_desc:0 "Civilian appointment rules would make senior offices accountable to elected ministers and legislators. Replacing personal patronage with reviewable procedures takes time and can provoke officials who benefited from informal access."
