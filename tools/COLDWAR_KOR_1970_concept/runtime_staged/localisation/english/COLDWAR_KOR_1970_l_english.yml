 COLDWAR_KOR_negotiated_withdrawal:0 "Negotiated Withdrawal"
 COLDWAR_KOR_negotiated_withdrawal_desc:0 "Open talks with a military-led government under organized civilian pressure; no date or party popularity alone completes the handover. Military leaders would need credible guarantees and a timetable to leave executive office as civilian pressure rises."
 COLDWAR_KOR_negotiated_withdrawal_preview:0 "Negotiated Withdrawal"
 COLDWAR_KOR_negotiated_withdrawal_preview_desc:0 "Open talks with a military-led government under organized civilian pressure; no date or party popularity alone completes the handover. Military leaders would need credible guarantees and a timetable to leave executive office as civilian pressure rises."
 COLDWAR_KOR_negotiated_withdrawal_programme:0 "Negotiated Withdrawal"
 COLDWAR_KOR_negotiated_withdrawal_programme_desc:0 "Open talks with a military-led government under organized civilian pressure; no date or party popularity alone completes the handover. Military leaders would need credible guarantees and a timetable to leave executive office as civilian pressure rises."
 COLDWAR_KOR_negotiating_mandate:0 "A Negotiating Mandate"
 COLDWAR_KOR_negotiating_mandate_desc:0 "Reconcile the electoral pact and accountability terms before agreeing a constitutional model. Delegates must reconcile electoral coordination with accountability demands before asking the public to ratify a new charter."
 COLDWAR_KOR_neutral_peace:0 "Armed Neutrality"
 COLDWAR_KOR_neutral_peace_desc:0 "Negotiate international neutrality while maintaining a funded defense. Treaty withdrawal needs a separate accepted settlement. Neutrality would require credible guarantees from abroad and continued readiness at home; neither alliance obligations nor defense costs disappear by declaration."
 COLDWAR_KOR_neutral_peace_preview:0 "Armed Neutrality"
 COLDWAR_KOR_neutral_peace_preview_desc:0 "Negotiate international neutrality while maintaining a funded defense. Treaty withdrawal needs a separate accepted settlement. Neutrality would require credible guarantees from abroad and continued readiness at home; neither alliance obligations nor defense costs disappear by declaration."
 COLDWAR_KOR_neutral_peace_programme:0 "Armed Neutrality"
 COLDWAR_KOR_neutral_peace_programme_desc:0 "Negotiate international neutrality while maintaining a funded defense. Treaty withdrawal needs a separate accepted settlement. Neutrality would require credible guarantees from abroad and continued readiness at home; neither alliance obligations nor defense costs disappear by declaration."
 COLDWAR_KOR_neutrality_guarantees_offer_tt:0 "§YProposal: Negotiated Neutrality§!\nRequires agreement with the United States, North Korea, the Soviet Union, China.\n§YOn ratification:§!\n  South Korean upkeep: §R$1 million/week§!\n  Duration: §Y5 years§!"
 COLDWAR_KOR_nominate_dj:0 "Register Kim Dae-jung’s Electoral Candidacy"
 COLDWAR_KOR_nominate_dj_desc:0 "Kim Dae-jung’s organization seeks to carry the democratic challenge into national government. His candidacy brings a distinct constituency and programme to the reform movement, but also renews the question of opposition unity. The campaign must reconcile those ambitions with the coalition needed to win office."
 COLDWAR_KOR_nominate_kjp:0 "Register Kim Jong-pil for an Election"
 COLDWAR_KOR_nominate_kjp_desc:0 "Kim Jong-pil’s conservative organization seeks a mandate of its own through the electoral process. His candidacy offers experience in party organization and government, while asking voters to distinguish civilian continuity from the military presidency that shaped the developmental state."
 COLDWAR_KOR_nominate_roh:0 "Register Roh Tae-woo’s Presidential Candidacy"
 COLDWAR_KOR_nominate_roh_desc:0 "The Democratic Justice Party looks to Roh Tae-woo to carry its organization into direct electoral competition. His candidacy links a negotiated opening to the institutions of the outgoing military order. Winning civilian office will require support beyond the command networks on which that order rested."
 COLDWAR_KOR_nominate_ys:0 "Register Kim Young-sam’s Electoral Candidacy"
 COLDWAR_KOR_nominate_ys_desc:0 "Kim Young-sam offers a reform leadership rooted in parliamentary opposition and the struggle for civilian politics. Registering his candidacy places that claim before the electorate. His organization must still turn a reputation for resistance into a governing coalition capable of winning office."
 COLDWAR_KOR_nonaggression_compact_offer_tt:0 "§YProposal: Nonaggression Compact§!\nRequires agreement with North Korea.\n§YOn ratification:§!"
 COLDWAR_KOR_nordpolitik:0 "Northern Diplomacy"
 COLDWAR_KOR_nordpolitik_conditional_tt:0 "Requires an active §YNordpolitik Opening§! agreement."
 COLDWAR_KOR_nordpolitik_desc:0 "The Republic opens diplomatic contacts with socialist states as it seeks a wider international presence. The later recognition of the Soviet Union in 1990 is the historical precedent; an earlier opening, or normalisation with China before 1991, charts an alternate course."
 COLDWAR_KOR_nordpolitik_preview:0 "Northern Diplomacy"
 COLDWAR_KOR_nordpolitik_preview_desc:0 "The Republic opens diplomatic contacts with socialist states as it seeks a wider international presence. The later recognition of the Soviet Union in 1990 is the historical precedent; an earlier opening, or normalisation with China before 1991, charts an alternate course."
 COLDWAR_KOR_nordpolitik_programme:0 "Northern Diplomacy"
 COLDWAR_KOR_nordpolitik_programme_desc:0 "The Republic opens diplomatic contacts with socialist states as it seeks a wider international presence. The later recognition of the Soviet Union in 1990 is the historical precedent; an earlier opening, or normalisation with China before 1991, charts an alternate course."
 COLDWAR_KOR_nordpolitik_recognition_offer_tt:0 "§YProposal: Nordpolitik Opening§!\nRequires a separate agreement with each counterpart.\n§YOn ratification:§!\n  Duration: §Y3 years§!"
 COLDWAR_KOR_northern_alignment:0 "Align with Pyongyang"
 COLDWAR_KOR_northern_alignment_conditional_tt:0 "Requires an active §YNorthern Security Liaison§! agreement."
 COLDWAR_KOR_northern_alignment_desc:0 "Seek a Northern security compact at the cost of external access and policy autonomy. A security compact with Pyongyang would recast Southern diplomacy and defense, likely narrowing access to American and other allied support."
 COLDWAR_KOR_northern_alignment_preview:0 "Align with Pyongyang"
 COLDWAR_KOR_northern_alignment_preview_desc:0 "Seek a Northern security compact at the cost of external access and policy autonomy. A security compact with Pyongyang would recast Southern diplomacy and defense, likely narrowing access to American and other allied support."
 COLDWAR_KOR_northern_alignment_programme:0 "Align with Pyongyang"
 COLDWAR_KOR_northern_alignment_programme_desc:0 "Seek a Northern security compact at the cost of external access and policy autonomy. A security compact with Pyongyang would recast Southern diplomacy and defense, likely narrowing access to American and other allied support."
 COLDWAR_KOR_northern_consultation_category:0 "Reciprocal Korean Consultations"
 COLDWAR_KOR_northern_consultation_category_desc:0 "The two Korean governments can build institutions for consultation while retaining their own administrations. Practical cooperation depends on reciprocal commitments and the political willingness to sustain them."
 COLDWAR_KOR_northern_consultation_proposal:0 "Propose Sovereign Consultations"
 COLDWAR_KOR_northern_consultation_proposal_desc:0 "Regular contacts have made a formal invitation to Seoul possible. A sovereign consultative framework could give the two Korean governments a place to negotiate practical cooperation while retaining their separate administrations. The Southern government must first decide whether it is prepared to open those talks."
 COLDWAR_KOR_northern_security_compact_offer_tt:0 "§YProposal: Northern Security Liaison§!\nRequires agreement with North Korea.\n§YOn ratification:§!\n  South Korean upkeep: §R$1 million/week§!\n  Duration: §Y3 years§!"
 COLDWAR_KOR_officer_retirement_disruption:0 "Officer Retirement Adjustment"
 COLDWAR_KOR_officer_retirement_disruption_desc:0 "Command continuity is strained while personnel and responsibilities are reorganized."
 COLDWAR_KOR_olympic_republic:0 "International Opening"
 COLDWAR_KOR_olympic_republic_desc:0 "A more open international presence can connect the Republic with markets and diplomatic partners beyond its established security relationships. Seoul must invest in that engagement while accepting that foreign attention also brings closer scrutiny of political conditions at home."
 COLDWAR_KOR_olympic_republic_preview:0 "International Opening"
 COLDWAR_KOR_olympic_republic_preview_desc:0 "A more open international presence can connect the Republic with markets and diplomatic partners beyond its established security relationships. Seoul must invest in that engagement while accepting that foreign attention also brings closer scrutiny of political conditions at home."
 COLDWAR_KOR_olympic_republic_programme:0 "International Opening"
 COLDWAR_KOR_olympic_republic_programme_desc:0 "A more open international presence can connect the Republic with markets and diplomatic partners beyond its established security relationships. Seoul must invest in that engagement while accepting that foreign attention also brings closer scrutiny of political conditions at home."
 COLDWAR_KOR_one_term_presidency:0 "One-Term Presidency"
 COLDWAR_KOR_one_term_presidency_conditional_tt:0 "Requires the constitutional settlement to remain in force."
 COLDWAR_KOR_one_term_presidency_desc:0 "Limiting the presidency to a single term would deny any officeholder a constitutional route to indefinite rule. The administration must pursue its programme within a fixed mandate, while its party prepares a successor capable of winning support in their own right."
 COLDWAR_KOR_one_term_presidency_preview:0 "One-Term Presidency"
 COLDWAR_KOR_one_term_presidency_preview_desc:0 "Limiting the presidency to a single term would deny any officeholder a constitutional route to indefinite rule. The administration must pursue its programme within a fixed mandate, while its party prepares a successor capable of winning support in their own right."
 COLDWAR_KOR_one_term_presidency_programme:0 "One-Term Presidency"
 COLDWAR_KOR_one_term_presidency_programme_desc:0 "Limiting the presidency to a single term would deny any officeholder a constitutional route to indefinite rule. The administration must pursue its programme within a fixed mandate, while its party prepares a successor capable of winning support in their own right."
 COLDWAR_KOR_open_civic_space:0 "Open Civic Space"
 COLDWAR_KOR_open_civic_space_desc:0 "Restore lawful meetings, political organization and access to constitutional debate; no party receives free votes. Legal meetings and associations allow churches, students, unions and opposition politicians to organize without prior security permission."
 COLDWAR_KOR_open_conservative_merger:0 "Convene the Conservative Merger Talks"
 COLDWAR_KOR_open_conservative_merger_desc:0 "The participating organizations have each authorized a delegation. Their leaders can now negotiate a common party, balancing access to government, leadership claims and the survival of local networks. Kim Dae-jung’s organization remains outside this conservative bargain."
 COLDWAR_KOR_open_security_records:0 "Security Records"
 COLDWAR_KOR_open_security_records_desc:0 "Preserve records of emergency rule and state violence. If Gwangju or other repression occurred, their cases enter this process. Preserving records enables later hearings into emergency decrees, YH and Bu-Ma, and any other documented abuses."
 COLDWAR_KOR_open_security_records_preview:0 "Security Records"
 COLDWAR_KOR_open_security_records_preview_desc:0 "Preserve records of emergency rule and state violence. If Gwangju or other repression occurred, their cases enter this process. Preserving records enables later hearings into emergency decrees, YH and Bu-Ma, and any other documented abuses."
 COLDWAR_KOR_open_security_records_programme:0 "Security Records"
 COLDWAR_KOR_open_security_records_programme_desc:0 "Preserve records of emergency rule and state violence. If Gwangju or other repression occurred, their cases enter this process. Preserving records enables later hearings into emergency decrees, YH and Bu-Ma, and any other documented abuses."
 COLDWAR_KOR_open_tenders:0 "Open Public Tenders"
 COLDWAR_KOR_open_tenders_desc:0 "Transparent procurement benefits new suppliers at an administrative cost. Published bids invite provincial firms to compete for public work, though ministries must spend more effort checking qualifications and contract performance."
 COLDWAR_KOR_open_tenders_preview:0 "Open Public Tenders"
 COLDWAR_KOR_open_tenders_preview_desc:0 "Transparent procurement benefits new suppliers at an administrative cost. Published bids invite provincial firms to compete for public work, though ministries must spend more effort checking qualifications and contract performance."
 COLDWAR_KOR_open_tenders_programme:0 "Open Public Tenders"
 COLDWAR_KOR_open_tenders_programme_desc:0 "Transparent procurement benefits new suppliers at an administrative cost. Published bids invite provincial firms to compete for public work, though ministries must spend more effort checking qualifications and contract performance."
 COLDWAR_KOR_orderly_handover:0 "An Orderly Handover"
 COLDWAR_KOR_orderly_handover_desc:0 "Recognize an actual lawful election and transfer. The constitutional branch never appoints a predetermined winner. A verified election and transfer establish that office changes through lawful procedure, regardless of which eligible candidate wins."
 COLDWAR_KOR_orderly_restructuring:0 "Orderly Restructuring"
 COLDWAR_KOR_orderly_restructuring_desc:0 "An orderly process addresses overextended firms through negotiated changes to their obligations and operations. It seeks to preserve viable production without erasing debt or shifting every loss to the public, though restructuring can restrain output while businesses and creditors adjust."
 COLDWAR_KOR_orderly_restructuring_preview:0 "Orderly Restructuring"
 COLDWAR_KOR_orderly_restructuring_preview_desc:0 "An orderly process addresses overextended firms through negotiated changes to their obligations and operations. It seeks to preserve viable production without erasing debt or shifting every loss to the public, though restructuring can restrain output while businesses and creditors adjust."
 COLDWAR_KOR_orderly_restructuring_programme:0 "Orderly Restructuring"
 COLDWAR_KOR_orderly_restructuring_programme_desc:0 "An orderly process addresses overextended firms through negotiated changes to their obligations and operations. It seeks to preserve viable production without erasing debt or shifting every loss to the public, though restructuring can restrain output while businesses and creditors adjust."
 COLDWAR_KOR_overseas_commercial_service:0 "Commercial Missions"
 COLDWAR_KOR_overseas_commercial_service_desc:0 "The government establishes a professional service to support overseas contracts and communicate Korean export standards. Better representation can help firms compete abroad, but missions require capable staff and sustained administration to serve businesses across multiple markets."
 COLDWAR_KOR_overseas_commercial_service_preview:0 "Commercial Missions"
 COLDWAR_KOR_overseas_commercial_service_preview_desc:0 "The government establishes a professional service to support overseas contracts and communicate Korean export standards. Better representation can help firms compete abroad, but missions require capable staff and sustained administration to serve businesses across multiple markets."
 COLDWAR_KOR_overseas_commercial_service_programme:0 "Commercial Missions"
 COLDWAR_KOR_overseas_commercial_service_programme_desc:0 "The government establishes a professional service to support overseas contracts and communicate Korean export standards. Better representation can help firms compete abroad, but missions require capable staff and sustained administration to serve businesses across multiple markets."
 COLDWAR_KOR_overseas_workers:0 "Overseas Workers"
 COLDWAR_KOR_overseas_workers_desc:0 "Seoul extends its existing overseas employment programme through negotiated contracts for Korean workers abroad. Their earnings and remittances continue through the established system, while new placements depend on willing employers and require attention to workers' protections and conditions."
 COLDWAR_KOR_owner_programme_tt:0 "Applies while this party or leader governs."
 COLDWAR_KOR_pacific_exports:0 "Pacific Exports"
 COLDWAR_KOR_pacific_exports_conditional_tt:0 "Requires an active §YPacific Export Cooperation§! agreement."
 COLDWAR_KOR_pacific_exports_desc:0 "Korean exporters deepen access to established Pacific markets and build on existing commercial relationships. Broader trade can support industrial growth, but reliance on external demand and standards leaves the economy exposed to foreign decisions and market shifts."
 COLDWAR_KOR_pacific_exports_preview:0 "Pacific Exports"
 COLDWAR_KOR_pacific_exports_preview_desc:0 "Korean exporters deepen access to established Pacific markets and build on existing commercial relationships. Broader trade can support industrial growth, but reliance on external demand and standards leaves the economy exposed to foreign decisions and market shifts."
