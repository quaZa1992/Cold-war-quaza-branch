 COLDWAR_KOR_army_advisory_council:0 "An Advisory Council"
 COLDWAR_KOR_army_advisory_council_desc:0 "Retain formal military advice while accepting a slower and politically contested civilianization. An advisory council preserves professional military input but gives civilian ministers the final word on national policy."
