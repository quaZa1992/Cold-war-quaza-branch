 COLDWAR_KOR_yulgok_readiness_review:0 "Yulgok Readiness"
 COLDWAR_KOR_yulgok_readiness_review_desc:0 "The government reviews the Yulgok modernisation programme against the strength, costs and needs of the armed forces. A disciplined assessment can guide future priorities, though expansion still depends on funding, procurement agreements and the country's ability to support a larger force."
