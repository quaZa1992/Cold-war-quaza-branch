 COLDWAR_KOR_parliamentary_democracy:0 "Parliamentary Cabinet"
 COLDWAR_KOR_parliamentary_democracy_conditional_tt:0 "Requires the constitutional settlement to remain in force."
 COLDWAR_KOR_parliamentary_democracy_desc:0 "Make the cabinet responsible to an elected Assembly. This is an alternate settlement grounded in Korean parliamentary experience and constitutional debates. An Assembly-backed cabinet suits party bargaining and Korea's earlier parliamentary experience, while making governing coalitions vulnerable to division."
