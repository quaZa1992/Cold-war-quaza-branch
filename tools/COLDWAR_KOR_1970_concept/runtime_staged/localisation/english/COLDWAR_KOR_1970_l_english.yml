 COLDWAR_KOR_press_consolidation:0 "Consolidate the Press"
 COLDWAR_KOR_press_consolidation_desc:0 "Centralize media and political supervision at a lasting cost to credibility. Licensing, editorial pressure and security review bring broadcasters and newspapers closer to government priorities, at the expense of public credibility."
