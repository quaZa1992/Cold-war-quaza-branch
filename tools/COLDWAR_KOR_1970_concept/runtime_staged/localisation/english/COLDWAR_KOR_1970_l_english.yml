 COLDWAR_KOR_allied_procurement_contract_offer_tt:0 "§YProposal: Allied Procurement§!\nRequires agreement with the United States.\n§YOn ratification:§!\n  South Korean upkeep: §R$1 million/week§!\n  Duration: §Y3 years§!"
 COLDWAR_KOR_allied_procurement_desc:0 "The Republic seeks affordable allied equipment suited to its defence needs through a negotiated procurement arrangement. American support can ease the burden of modernisation, though reliance on foreign suppliers leaves Seoul exposed to the terms and priorities of its partners."
