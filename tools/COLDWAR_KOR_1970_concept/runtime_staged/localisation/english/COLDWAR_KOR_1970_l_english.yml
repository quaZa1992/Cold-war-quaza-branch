 COLDWAR_KOR_conditional_amnesty:0 "Conditional Amnesty"
 COLDWAR_KOR_conditional_amnesty_desc:0 "Trade limited, conditional guarantees and disclosure for officer cooperation. Credibility and accountability remain contested. Limited immunity could secure testimony and cooperation, but victims and opposition legislators may reject protection without full disclosure."
 COLDWAR_KOR_conditional_amnesty_preview:0 "Conditional Amnesty"
 COLDWAR_KOR_conditional_amnesty_preview_desc:0 "Trade limited, conditional guarantees and disclosure for officer cooperation. Credibility and accountability remain contested. Limited immunity could secure testimony and cooperation, but victims and opposition legislators may reject protection without full disclosure."
 COLDWAR_KOR_conditional_amnesty_programme:0 "Conditional Amnesty"
 COLDWAR_KOR_conditional_amnesty_programme_desc:0 "Trade limited, conditional guarantees and disclosure for officer cooperation. Credibility and accountability remain contested. Limited immunity could secure testimony and cooperation, but victims and opposition legislators may reject protection without full disclosure."
 COLDWAR_KOR_confederal_member:0 "Korean Consultative Framework"
 COLDWAR_KOR_confederal_member_desc:0 "Both Korean governments have accepted a sovereign consultative framework. Separate governments and armed forces remain; individual cooperative projects require their own agreements."
 COLDWAR_KOR_confederal_revolution:0 "A Confederal Route"
 COLDWAR_KOR_confederal_revolution_desc:0 "Offer Pyongyang a sovereign confederation. The other Korea may reject every constitutional concession. A confederal proposal leaves each Korean government sovereign and requires Pyongyang's explicit agreement on institutions and security."
 COLDWAR_KOR_confederal_revolution_preview:0 "A Confederal Route"
 COLDWAR_KOR_confederal_revolution_preview_desc:0 "Offer Pyongyang a sovereign confederation. The other Korea may reject every constitutional concession. A confederal proposal leaves each Korean government sovereign and requires Pyongyang's explicit agreement on institutions and security."
 COLDWAR_KOR_confederal_revolution_programme:0 "A Confederal Route"
 COLDWAR_KOR_confederal_revolution_programme_desc:0 "Offer Pyongyang a sovereign confederation. The other Korea may reject every constitutional concession. A confederal proposal leaves each Korean government sovereign and requires Pyongyang's explicit agreement on institutions and security."
 COLDWAR_KOR_confederal_secretariat:0 "A Joint Secretariat"
 COLDWAR_KOR_confederal_secretariat_desc:0 "After a confederal framework is accepted, Seoul proposes a modest joint secretariat to organise agreed work between the two governments. Shared administration could make regular cooperation more practical, while each state retains its own institutions and political authority."
 COLDWAR_KOR_confederal_secretariat_offer_tt:0 "§YProposal: Korean Consultative Secretariat§!\nRequires agreement with North Korea.\n§YOn ratification:§!\n  Upkeep, each government: §R$2 million/week§!\n  Duration: §Y3 years§!"
 COLDWAR_KOR_consensus_presidency:0 "Consensus Presidency"
 COLDWAR_KOR_consensus_presidency_conditional_tt:0 "Requires the constitutional settlement to remain in force."
 COLDWAR_KOR_consensus_presidency_desc:0 "Retain direct election while binding executive action to a broad cabinet and parliamentary bargain. This is an alternate compromise, not the historical 1987 constitution. Direct election continues, but cabinet consultation and legislative assent would constrain presidential power beyond the 1987 model."
 COLDWAR_KOR_consensus_presidency_preview:0 "Consensus Presidency"
 COLDWAR_KOR_consensus_presidency_preview_desc:0 "Retain direct election while binding executive action to a broad cabinet and parliamentary bargain. This is an alternate compromise, not the historical 1987 constitution. Direct election continues, but cabinet consultation and legislative assent would constrain presidential power beyond the 1987 model."
 COLDWAR_KOR_consensus_presidency_programme:0 "Consensus Presidency"
 COLDWAR_KOR_consensus_presidency_programme_desc:0 "Retain direct election while binding executive action to a broad cabinet and parliamentary bargain. This is an alternate compromise, not the historical 1987 constitution. Direct election continues, but cabinet consultation and legislative assent would constrain presidential power beyond the 1987 model."
 COLDWAR_KOR_conservative_merger:0 "A Conservative Merger"
 COLDWAR_KOR_conservative_merger_conditional_tt:0 "Requires ratification by the participating party organizations."
 COLDWAR_KOR_conservative_merger_desc:0 "Negotiate an elite conservative coalition. No opposition party or incumbent is transferred without political agreement. A merger among conservative parties could pool legislative strength, but only negotiated concessions can resolve disputes over leadership and regional bases."
 COLDWAR_KOR_conservative_merger_preview:0 "A Conservative Merger"
