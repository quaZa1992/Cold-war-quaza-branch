 COLDWAR_KOR_buma_1979.d:0 "Regional protest follows Kim Young-sam’s exclusion during the late-Yushin crisis."
 COLDWAR_KOR_buma_1979.option_a:0 "Open a Political Channel"
 COLDWAR_KOR_buma_1979.option_b:0 "Maintain Emergency Rule"
 COLDWAR_KOR_buma_1979.t:0 "The Busan–Masan Crisis"
 COLDWAR_KOR_burden_sharing:0 "Combined Command"
 COLDWAR_KOR_burden_sharing_conditional_tt:0 "Requires an active §YCombined Command Agreement§! agreement."
 COLDWAR_KOR_burden_sharing_desc:0 "A combined headquarters would turn alliance commitments into operational plans, supported by Korean facilities and reception arrangements. Shared command promises more coherent readiness, while binding national decisions more closely to an American partner and creating a lasting administrative obligation."
