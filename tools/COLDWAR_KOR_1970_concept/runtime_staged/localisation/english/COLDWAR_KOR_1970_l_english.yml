 COLDWAR_KOR_ratify_revolutionary_settlement:0 "Ratify the Revolutionary Settlement"
 COLDWAR_KOR_ratify_revolutionary_settlement_desc:0 "The revolutionary party has reached government, but its accession has not settled the organization of the Southern state. Ratifying a cabinet gives the new administration a common mandate. Replacing established authority will unsettle officials, employers and communities whose cooperation remains essential to governing."
 COLDWAR_KOR_real_name_accounts:0 "Accountable Banking"
 COLDWAR_KOR_real_name_accounts_desc:0 "Require accountable financial records and transparent corporate ownership. This is an alternate precursor, not Kim Young-sam’s 1993 real-name-finance reform. Identifiable bank records would make corporate ownership and political finance easier to trace, challenging long-standing reliance on anonymous accounts."
 COLDWAR_KOR_real_name_accounts_preview:0 "Accountable Banking"
 COLDWAR_KOR_real_name_accounts_preview_desc:0 "Require accountable financial records and transparent corporate ownership. This is an alternate precursor, not Kim Young-sam’s 1993 real-name-finance reform. Identifiable bank records would make corporate ownership and political finance easier to trace, challenging long-standing reliance on anonymous accounts."
 COLDWAR_KOR_real_name_accounts_programme:0 "Accountable Banking"
 COLDWAR_KOR_real_name_accounts_programme_desc:0 "Require accountable financial records and transparent corporate ownership. This is an alternate precursor, not Kim Young-sam’s 1993 real-name-finance reform. Identifiable bank records would make corporate ownership and political finance easier to trace, challenging long-standing reliance on anonymous accounts."
 COLDWAR_KOR_reciprocal_contacts:0 "Working Contacts"
 COLDWAR_KOR_reciprocal_contacts_desc:0 "Regular contact between officials can turn occasional exchanges into a working relationship. Both governments would fund permanent negotiating teams, accepting an administrative burden in return for steadier communication and a clearer route toward recognition and practical cooperation."
 COLDWAR_KOR_red_cross_channel:0 "A Red Cross Channel"
 COLDWAR_KOR_red_cross_channel_desc:0 "Separated families need more than public declarations of sympathy. A funded channel between the Korean Red Cross organizations would support humanitarian negotiations and provide officials able to carry them forward, while placing new obligations on each government’s welfare administration."
 COLDWAR_KOR_red_cross_channel_offer_tt:0 "§YProposal: Red Cross Liaison§!\nRequires agreement with North Korea.\n§YOn ratification:§!\n  Upkeep, each government: §R$0.5 million/week§!\n  Duration: §Y3 years§!"
 COLDWAR_KOR_reform_lawful_succession:0 "Lawful Succession"
 COLDWAR_KOR_reform_lawful_succession_desc:0 "Bind the reform government to the same rules that made its accession possible. The other reform leader may govern later. The same electoral rules must apply when today's reform leaders leave office, reassuring opponents that change will not become another personal monopoly."
 COLDWAR_KOR_reform_lawful_succession_preview:0 "Lawful Succession"
 COLDWAR_KOR_reform_lawful_succession_preview_desc:0 "Bind the reform government to the same rules that made its accession possible. The other reform leader may govern later. The same electoral rules must apply when today's reform leaders leave office, reassuring opponents that change will not become another personal monopoly."
 COLDWAR_KOR_reform_lawful_succession_programme:0 "Lawful Succession"
 COLDWAR_KOR_reform_lawful_succession_programme_desc:0 "Bind the reform government to the same rules that made its accession possible. The other reform leader may govern later. The same electoral rules must apply when today's reform leaders leave office, reassuring opponents that change will not become another personal monopoly."
 COLDWAR_KOR_reform_mandate:0 "A Reform Mandate"
 COLDWAR_KOR_reform_mandate_desc:0 "A reform government reopens civic politics and reviews political imprisonment. A reform cabinet would reopen civic association and review political detention, facing resistance from officials whose authority grew under emergency rule."
 COLDWAR_KOR_reform_mandate_preview:0 "A Reform Mandate"
 COLDWAR_KOR_reform_mandate_preview_desc:0 "A reform government reopens civic politics and reviews political imprisonment. A reform cabinet would reopen civic association and review political detention, facing resistance from officials whose authority grew under emergency rule."
 COLDWAR_KOR_reform_mandate_problem_tt:0 "Reforms A Contested Presidential Mandate."
 COLDWAR_KOR_reform_mandate_programme:0 "A Reform Mandate"
 COLDWAR_KOR_reform_mandate_programme_desc:0 "A reform government reopens civic politics and reviews political imprisonment. A reform cabinet would reopen civic association and review political detention, facing resistance from officials whose authority grew under emergency rule."
 COLDWAR_KOR_reform_nordpolitik:0 "Reform Nordpolitik"
 COLDWAR_KOR_reform_nordpolitik_desc:0 "Explore northern diplomatic openings while keeping decisions under civilian oversight. Civilian officials would test commercial and diplomatic channels with socialist states, preserving the alliance while reducing exclusive reliance on bloc politics."
 COLDWAR_KOR_reform_nordpolitik_preview:0 "Reform Nordpolitik"
 COLDWAR_KOR_reform_nordpolitik_preview_desc:0 "Explore northern diplomatic openings while keeping decisions under civilian oversight. Civilian officials would test commercial and diplomatic channels with socialist states, preserving the alliance while reducing exclusive reliance on bloc politics."
 COLDWAR_KOR_reform_nordpolitik_programme:0 "Reform Nordpolitik"
 COLDWAR_KOR_reform_nordpolitik_programme_desc:0 "Explore northern diplomatic openings while keeping decisions under civilian oversight. Civilian officials would test commercial and diplomatic channels with socialist states, preserving the alliance while reducing exclusive reliance on bloc politics."
 COLDWAR_KOR_reform_party_accounts:0 "Party Finance Rules"
 COLDWAR_KOR_reform_party_accounts_desc:0 "Make reform-party financing accountable without granting popularity or selecting the election winner. Disclosure of party accounts would make donors and expenditures visible to voters, constraining the patronage finance of every faction."
 COLDWAR_KOR_reform_party_accounts_preview:0 "Party Finance Rules"
 COLDWAR_KOR_reform_party_accounts_preview_desc:0 "Make reform-party financing accountable without granting popularity or selecting the election winner. Disclosure of party accounts would make donors and expenditures visible to voters, constraining the patronage finance of every faction."
 COLDWAR_KOR_reform_party_accounts_programme:0 "Party Finance Rules"
 COLDWAR_KOR_reform_party_accounts_programme_desc:0 "Make reform-party financing accountable without granting popularity or selecting the election winner. Disclosure of party accounts would make donors and expenditures visible to voters, constraining the patronage finance of every faction."
 COLDWAR_KOR_regional_compromise:0 "Regional Investment"
 COLDWAR_KOR_regional_compromise_desc:0 "Fund an industrial project in Honam to reduce the regional imbalance. A Honam industrial project would answer complaints that public investment and export infrastructure favored the southeast, without immediately leveling regional capacity."
 COLDWAR_KOR_regional_equalization:0 "Regional Equalization"
 COLDWAR_KOR_regional_equalization_desc:0 "Direct assistance to excluded regions, accepting administrative complexity. Transfers to poorer provinces would support services and employment outside Seoul and the southeast, though central agencies must measure need fairly."
 COLDWAR_KOR_regional_equalization_preview:0 "Regional Equalization"
 COLDWAR_KOR_regional_equalization_preview_desc:0 "Direct assistance to excluded regions, accepting administrative complexity. Transfers to poorer provinces would support services and employment outside Seoul and the southeast, though central agencies must measure need fairly."
 COLDWAR_KOR_regional_equalization_programme:0 "Regional Equalization"
 COLDWAR_KOR_regional_equalization_programme_desc:0 "Direct assistance to excluded regions, accepting administrative complexity. Transfers to poorer provinces would support services and employment outside Seoul and the southeast, though central agencies must measure need fairly."
 COLDWAR_KOR_regional_equalization_weekly_tt:0 "Policy upkeep: §R$2 million/week§!"
 COLDWAR_KOR_reopen_charter_ballot:0 "Resubmit the Constitutional Charter"
 COLDWAR_KOR_reopen_charter_ballot_desc:0 "The rejected draft has left the constitutional question unresolved. With a negotiating mandate still intact, the parties can return their chosen text to ratification. A renewed ballot will test whether concessions and political organization have produced a majority where the earlier bargain failed."
 COLDWAR_KOR_reopen_constitutional_talks:0 "Reopen Constitutional Negotiations"
 COLDWAR_KOR_reopen_constitutional_talks_desc:0 "Military reconsolidation has restored command without settling the question of political legitimacy. The opposition continues to demand constitutional revision. Renewing negotiations would give the government a route out of confrontation, but the officers must accept that a civilian settlement will place limits on their authority."
 COLDWAR_KOR_repeat_allied_procurement_contract:0 "Reopen Allied Procurement Talks"
 COLDWAR_KOR_repeat_allied_procurement_contract_desc:0 "The Republic seeks affordable allied equipment suited to its defence needs through a negotiated procurement arrangement. American support can ease the burden of modernisation, though reliance on foreign suppliers leaves Seoul exposed to the terms and priorities of its partners."
 COLDWAR_KOR_repeat_alternative_finance_contacts:0 "Reopen Alternative Foreign Finance Talks"
 COLDWAR_KOR_repeat_alternative_finance_contacts_desc:0 "The government explores finance from a broader set of sources to reduce concentration in its Japanese economic relationship. Wider options can improve diplomatic balance, but alternative capital may be more expensive and difficult to secure."
 COLDWAR_KOR_repeat_border_notice_protocol:0 "Reopen Border Notification Protocol Talks"
 COLDWAR_KOR_repeat_border_notice_protocol_desc:0 "The Republic proposes reciprocal notification procedures for military activity near the border, respecting each side's command and jurisdiction. Shared notices can reduce uncertainty and the risk of accidental escalation when both governments follow the agreed rules."
 COLDWAR_KOR_repeat_border_notifications:0 "Reopen Military Notification Talks Talks"
 COLDWAR_KOR_repeat_border_notifications_desc:0 "The Republic prioritises reciprocal notifications and procedures for managing border incidents. This cautious approach to coexistence places responsibility on both commands to share information and gives Seoul a practical basis for reducing the risk of miscalculation."
 COLDWAR_KOR_repeat_combined_readiness_board:0 "Reopen Combined Readiness Board Talks"
 COLDWAR_KOR_repeat_combined_readiness_board_desc:0 "A standing bilateral board could examine the weaknesses revealed by combined training and reinforcement plans. Its work would improve logistics and command coordination, provided both military establishments commit personnel, funding and access to the review."
 COLDWAR_KOR_repeat_confederal_secretariat:0 "Reopen Korean Consultative Secretariat Talks"
 COLDWAR_KOR_repeat_confederal_secretariat_desc:0 "After a confederal framework is accepted, Seoul proposes a modest joint secretariat to organise agreed work between the two governments. Shared administration could make regular cooperation more practical, while each state retains its own institutions and political authority."
 COLDWAR_KOR_repeat_cultural_exchanges:0 "Reopen Cultural Exchange Framework Talks"
 COLDWAR_KOR_repeat_cultural_exchanges_desc:0 "Seoul gives priority to humanitarian and cultural exchanges negotiated with Pyongyang. Greater contact can build understanding among Korean civilians, while the government must balance openness against the political and security concerns that accompany cross-border engagement."
 COLDWAR_KOR_repeat_cultural_visits:0 "Reopen Cultural Visits Talks"
 COLDWAR_KOR_repeat_cultural_visits_desc:0 "Seoul offers limited educational and cultural visits under a negotiated exchange programme. Such visits could build familiarity between separated communities, while travel arrangements and the political climate require careful coordination with the North."
 COLDWAR_KOR_repeat_family_reunions:0 "Reopen Family Reunions Talks"
 COLDWAR_KOR_repeat_family_reunions_desc:0 "Seoul offers a limited programme of family visits for people separated by the division of Korea. The proposal seeks to ease a profound human loss, but arrangements for travel, selection and supervision must be worked out with the North Korean authorities."
 COLDWAR_KOR_repeat_gulf_project_access:0 "Reopen Construction Market Access Talks"
 COLDWAR_KOR_repeat_gulf_project_access_desc:0 "Korean contractors seek a place in the Middle East’s expanding construction markets. Government negotiations can establish access and technical cooperation, but participating firms will depend on foreign authorities and must sustain the administrative and financial commitments of overseas work."
 COLDWAR_KOR_repeat_historical_claims_dialogue:0 "Reopen Historical Claims Talks Talks"
 COLDWAR_KOR_repeat_historical_claims_dialogue_desc:0 "The government gives public legitimacy and historical claims priority in its dealings with Japan. A firmer position can strengthen domestic confidence, but may complicate the economic cooperation and technical exchange sought by advocates of closer ties."
 COLDWAR_KOR_repeat_independent_left_dialogue:0 "Reopen Independent Southern Dialogue Talks"
 COLDWAR_KOR_repeat_independent_left_dialogue_desc:0 "Southern socialists would open dialogue with Pyongyang on coexistence while maintaining their own institutions. The approach asks Northern leaders to negotiate with a pluralist southern government rather than accept its terms in advance."
 COLDWAR_KOR_repeat_japan_joint_training:0 "Reopen Korean-Japanese Technical Training Talks"
 COLDWAR_KOR_repeat_japan_joint_training_desc:0 "Korean industrial development needs people able to adapt foreign methods to domestic production. A joint programme with Japanese institutions would bring engineers and workers into closer technical cooperation, while deepening dependence on an external partner and requiring resources from both sides."
 COLDWAR_KOR_repeat_japan_technology_finance:0 "Reopen Japanese Technical Cooperation Talks"
 COLDWAR_KOR_repeat_japan_technology_finance_desc:0 "Seoul pursues Japanese capital and industrial cooperation while acknowledging that the relationship remains controversial at home. A negotiated opening may support economic exchange, but the unresolved legacy of colonial rule continues to shape public opinion and political legitimacy."
 COLDWAR_KOR_repeat_korean_community_dialogue:0 "Reopen Korean Community Dialogue Talks"
 COLDWAR_KOR_repeat_korean_community_dialogue_desc:0 "The Republic proposes a dialogue around a common Korean community, drawing on the proposal advanced in 1989. An earlier initiative would mark an alternate course, while any 1991 agreement or deeper political change would require further negotiations between the two governments."
 COLDWAR_KOR_repeat_korean_final_settlement:0 "Reopen Korean Cooperation Settlement Talks"
 COLDWAR_KOR_repeat_korean_final_settlement_desc:0 "The earlier agreements have created a basis for a broader political settlement. Seoul can seek a common commitment to sustained cooperation, accepting restraints and administrative obligations in exchange for a more stable relationship across the peninsula."
 COLDWAR_KOR_repeat_limited_trade:0 "Reopen Limited Inter-Korean Trade Talks"
 COLDWAR_KOR_repeat_limited_trade_desc:0 "The Republic offers a capped trading arrangement with reciprocal duties between the two Koreas. Such exchange could create practical ties, but volumes, funding and implementation depend on agreement from both governments and fulfilment of the agreed terms."
 COLDWAR_KOR_repeat_military_hotline:0 "Reopen Military Hotline Talks"
 COLDWAR_KOR_repeat_military_hotline_desc:0 "The Republic proposes a direct channel for managing military incidents while maintaining a credible deterrent. A hotline could reduce the danger of misunderstanding, though both commands must agree on its operation and the armed forces remain on guard."
 COLDWAR_KOR_repeat_neutrality_guarantees:0 "Reopen Negotiated Neutrality Talks"
 COLDWAR_KOR_repeat_neutrality_guarantees_desc:0 "Negotiate international neutrality while maintaining a funded defense. Treaty withdrawal needs a separate accepted settlement. Neutrality would require credible guarantees from abroad and continued readiness at home; neither alliance obligations nor defense costs disappear by declaration."
 COLDWAR_KOR_repeat_nonaggression_compact:0 "Reopen Nonaggression Compact Talks"
 COLDWAR_KOR_repeat_nonaggression_compact_desc:0 "Seoul offers a nonaggression agreement and reciprocal restraint as a basis for peaceful coexistence. The proposal recognises separate governments, armed forces and alliances, seeking to reduce the danger of war without resolving the deeper national question."
 COLDWAR_KOR_repeat_nordpolitik_recognition:0 "Reopen Nordpolitik Opening Talks"
 COLDWAR_KOR_repeat_nordpolitik_recognition_desc:0 "The Republic opens diplomatic contacts with socialist states as it seeks a wider international presence. The later recognition of the Soviet Union in 1990 is the historical precedent; an earlier opening, or normalisation with China before 1991, charts an alternate course."
 COLDWAR_KOR_repeat_northern_security_compact:0 "Reopen Northern Security Liaison Talks"
 COLDWAR_KOR_repeat_northern_security_compact_desc:0 "Seek a Northern security compact at the cost of external access and policy autonomy. A security compact with Pyongyang would recast Southern diplomacy and defense, likely narrowing access to American and other allied support."
 COLDWAR_KOR_repeat_pacific_trade_contacts:0 "Reopen Pacific Export Cooperation Talks"
 COLDWAR_KOR_repeat_pacific_trade_contacts_desc:0 "Korean exporters deepen access to established Pacific markets and build on existing commercial relationships. Broader trade can support industrial growth, but reliance on external demand and standards leaves the economy exposed to foreign decisions and market shifts."
 COLDWAR_KOR_repeat_parallel_recognition:0 "Reopen Reciprocal Recognition Talks"
 COLDWAR_KOR_repeat_parallel_recognition_desc:0 "Reciprocal recognition would acknowledge that practical cooperation must proceed between two established governments. The declaration could steady the political relationship and protect each administration’s room to govern, while provoking constituencies unwilling to accept a divided national authority."
 COLDWAR_KOR_repeat_peninsula_liaison_office:0 "Reopen Permanent Korean Liaison Talks"
 COLDWAR_KOR_repeat_peninsula_liaison_office_desc:0 "Permanent liaison offices would give the two governments a daily means of resolving disputes and supervising agreed work. Seoul must negotiate the offices’ authority and finance their operation, balancing more reliable communication against the influence and obligations that sustained contact brings."
 COLDWAR_KOR_repeat_red_cross_channel:0 "Reopen Red Cross Liaison Talks"
 COLDWAR_KOR_repeat_red_cross_channel_desc:0 "Separated families need more than public declarations of sympathy. A funded channel between the Korean Red Cross organizations would support humanitarian negotiations and provide officials able to carry them forward, while placing new obligations on each government’s welfare administration."
 COLDWAR_KOR_repeat_revolutionary_recognition:0 "Reopen Revolutionary Recognition Talks"
 COLDWAR_KOR_repeat_revolutionary_recognition_desc:0 "A revolutionary government would seek recognition from states willing to engage its new authorities. Diplomatic standing would depend on each capital's assessment of the government's legitimacy, security commitments and treatment of foreign interests."
 COLDWAR_KOR_repeat_security_partner_contacts:0 "Reopen Military Staff Cooperation Talks"
 COLDWAR_KOR_repeat_security_partner_contacts_desc:0 "The government seeks limited security contacts with a wider range of partners while preserving its existing diplomatic relationships. Broader ties can reduce isolation and widen Seoul's options, though each new connection requires careful administration and management of outside influence."
 COLDWAR_KOR_repeat_sovereign_confederation:0 "Reopen Sovereign Korean Consultation Talks"
 COLDWAR_KOR_repeat_sovereign_confederation_desc:0 "Offer Pyongyang a sovereign confederation. The other Korea may reject every constitutional concession. A confederal proposal leaves each Korean government sovereign and requires Pyongyang's explicit agreement on institutions and security."
 COLDWAR_KOR_repeat_technology_licence:0 "Reopen Industrial Licensing Talks"
 COLDWAR_KOR_repeat_technology_licence_desc:0 "Seoul seeks a negotiated production licence to learn from foreign manufacturers and apply their methods at home. The agreement's terms determine how much knowledge Korean firms can absorb, while dependence on overseas expertise remains part of the industrial relationship."
 COLDWAR_KOR_repeat_us_alliance_assurance:0 "Reopen American Alliance Assurances Talks"
 COLDWAR_KOR_repeat_us_alliance_assurance_desc:0 "American assurances can steady deterrence through a period of changing troop commitments. Seoul must secure Washington’s agreement to the relationship it seeks, accepting the financial and political demands of close cooperation rather than assuming that continued support is guaranteed."
 COLDWAR_KOR_repeat_us_combined_command:0 "Reopen Combined Command Agreement Talks"
 COLDWAR_KOR_repeat_us_combined_command_desc:0 "A combined headquarters would turn alliance commitments into operational plans, supported by Korean facilities and reception arrangements. Shared command promises more coherent readiness, while binding national decisions more closely to an American partner and creating a lasting administrative obligation."
 COLDWAR_KOR_repeat_us_drawdown:0 "Reopen Negotiated American Drawdown Talks"
 COLDWAR_KOR_repeat_us_drawdown_desc:0 "A stronger Korean command structure would give the Republic greater capacity to shape its own defence. Seoul can prepare those institutions while negotiating a reduction of the resident American presence; any agreed drawdown will bring additional responsibilities as well as greater freedom of action."
 COLDWAR_KOR_repeat_us_garrison:0 "Reopen American Stationing Agreement Talks"
 COLDWAR_KOR_repeat_us_garrison_desc:0 "The American presence anchors deterrence on the peninsula, but its future rests on decisions taken in both capitals. A renewed stationing agreement would define facilities, consultation and support while preserving the Republic’s responsibility for its own defence."
 COLDWAR_KOR_repeat_verified_restraint:0 "Reopen Reciprocal Military Restraint Talks"
 COLDWAR_KOR_repeat_verified_restraint_desc:0 "Following a coexistence agreement, Seoul proposes reciprocal notification and verification arrangements with clear funding and withdrawal terms. Such measures can build confidence only through shared procedures and sustained cooperation between the two governments."
 COLDWAR_KOR_repeat_vietnam_withdrawal_settlement:0 "Reopen Vietnam Withdrawal Settlement Talks"
 COLDWAR_KOR_repeat_vietnam_withdrawal_settlement_desc:0 "The Republic seeks a negotiated end to its Vietnam commitment and a settlement for the personnel and obligations already involved. Withdrawal requires agreement with the other parties, while veterans' welfare and the political legacy of the deployment remain responsibilities at home."
 COLDWAR_KOR_repeat_worker_rights_protocol:0 "Reopen Overseas Worker Protection Talks"
 COLDWAR_KOR_repeat_worker_rights_protocol_desc:0 "Korean workers abroad depend on agreements that reach beyond the authority of Seoul’s labour administration. A protocol with West Germany would establish common responsibilities for their treatment and supervision, requiring both governments to support the institutions that enforce those standards."
 COLDWAR_KOR_repeat_working_contacts:0 "Reopen Inter-Korean Working Contacts Talks"
 COLDWAR_KOR_repeat_working_contacts_desc:0 "Regular contact between officials can turn occasional exchanges into a working relationship. Both governments would fund permanent negotiating teams, accepting an administrative burden in return for steadier communication and a clearer route toward recognition and practical cooperation."
 COLDWAR_KOR_request_charter_endorsement_army_djp:0 "Seek Army / DJP Charter Endorsement"
 COLDWAR_KOR_request_charter_endorsement_army_djp_desc:0 "The constitutional bargain must address command continuity and the boundaries of a civilian opening. Asking the Army and DJP organization to endorse the draft will establish whether it accepts the negotiated terms before the text is submitted to ratification."
 COLDWAR_KOR_request_charter_endorsement_drp:0 "Seek DRP Charter Endorsement"
 COLDWAR_KOR_request_charter_endorsement_drp_desc:0 "The constitutional bargain must address executive continuity and the survival of its local organization. Asking the conservative governing organization to endorse the draft will establish whether it accepts the negotiated terms before the text is submitted to ratification."
 COLDWAR_KOR_request_charter_endorsement_independent_left:0 "Seek Independent Left Charter Endorsement"
 COLDWAR_KOR_request_charter_endorsement_independent_left_desc:0 "The constitutional bargain must address political independence and a voice for organized labour. Asking the independent Southern left to endorse the draft will establish whether it accepts the negotiated terms before the text is submitted to ratification."
 COLDWAR_KOR_request_charter_endorsement_ndp:0 "Seek NDP Charter Endorsement"
 COLDWAR_KOR_request_charter_endorsement_ndp_desc:0 "The constitutional bargain must address competitive elections and an Assembly capable of checking the executive. Asking the parliamentary opposition to endorse the draft will establish whether it accepts the negotiated terms before the text is submitted to ratification."
 COLDWAR_KOR_request_charter_endorsement_rpr:0 "Seek Revolutionary Party Charter Endorsement"
 COLDWAR_KOR_request_charter_endorsement_rpr_desc:0 "The constitutional bargain must address its place in the new political settlement and the peninsula question. Asking the legalized Southern revolutionary organization to endorse the draft will establish whether it accepts the negotiated terms before the text is submitted to ratification."
 COLDWAR_KOR_request_charter_endorsement_student_civic:0 "Seek Civic Coalition Charter Endorsement"
 COLDWAR_KOR_request_charter_endorsement_student_civic_desc:0 "The constitutional bargain must address freedom of association and safeguards against renewed emergency rule. Asking the student civic coalition to endorse the draft will establish whether it accepts the negotiated terms before the text is submitted to ratification."
 COLDWAR_KOR_request_charter_endorsement_two_kim_reform:0 "Seek Reform Movement Charter Endorsement"
 COLDWAR_KOR_request_charter_endorsement_two_kim_reform_desc:0 "The constitutional bargain must address civilian government and the leadership of the democratic coalition. Asking the organizations of the Two Kims to endorse the draft will establish whether it accepts the negotiated terms before the text is submitted to ratification."
 COLDWAR_KOR_request_charter_endorsement_usp:0 "Seek USP Charter Endorsement"
 COLDWAR_KOR_request_charter_endorsement_usp_desc:0 "The constitutional bargain must address lawful social-democratic participation and enforceable labour rights. Asking the Unification Socialist Party to endorse the draft will establish whether it accepts the negotiated terms before the text is submitted to ratification."
