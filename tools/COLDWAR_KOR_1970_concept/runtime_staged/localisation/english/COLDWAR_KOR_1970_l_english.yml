 COLDWAR_KOR_air_defence:0 "Air Defence Priority"
 COLDWAR_KOR_air_defence_desc:0 "Air-defence coverage is prioritised to protect key areas against attack. The investment strengthens the country's ability to coordinate an air response, while the choice slows maritime modernisation and requires the continuing purchase and maintenance of suitable equipment."
 COLDWAR_KOR_air_defence_preview:0 "Air Defence Priority"
 COLDWAR_KOR_air_defence_preview_desc:0 "Air-defence coverage is prioritised to protect key areas against attack. The investment strengthens the country's ability to coordinate an air response, while the choice slows maritime modernisation and requires the continuing purchase and maintenance of suitable equipment."
