 COLDWAR_KOR_yushin:0 "Yushin Constitution"
 COLDWAR_KOR_yushin_desc:0 "Concentrate executive authority and replace direct presidential competition with controlled institutions. Under Yushin, the president would be chosen indirectly by the National Council for Unification, while presidential appointments shaped one-third of the Assembly."
