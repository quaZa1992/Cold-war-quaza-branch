 COLDWAR_KOR_professional_core:0 "A Professional Core"
 COLDWAR_KOR_professional_core_desc:0 "A smaller professional force receives greater emphasis on retention, unit cohesion and military skill. This can improve readiness among career personnel, but higher personnel costs make the model more demanding to sustain than reliance on short-term conscription alone."
 COLDWAR_KOR_professional_core_preview:0 "A Professional Core"
