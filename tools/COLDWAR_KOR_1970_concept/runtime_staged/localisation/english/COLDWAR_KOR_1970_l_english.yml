 COLDWAR_KOR_prepare_local_councils:0 "Prepare Local Councils"
 COLDWAR_KOR_prepare_local_councils_conditional_tt:0 "Requires the constitutional settlement to remain in force."
 COLDWAR_KOR_prepare_local_councils_desc:0 "Restore the legal basis and timetable for local councils. Historical council elections in 1991 and executive elections in 1995 remain outside this horizon. A legal timetable prepares elected local councils, extending municipal accountability without moving their later elections into this period."
