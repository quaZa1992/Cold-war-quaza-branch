 COLDWAR_KOR_army_constitutional_service:0 "Constitutional Service"
 COLDWAR_KOR_army_constitutional_service_desc:0 "Define the legal duties of the armed forces under the actual constitutional settlement. The constitution would define military duties and place deployment under lawful civilian authority, preserving defense readiness within political limits."
 COLDWAR_KOR_army_constitutional_service_preview:0 "Constitutional Service"
 COLDWAR_KOR_army_constitutional_service_preview_desc:0 "Define the legal duties of the armed forces under the actual constitutional settlement. The constitution would define military duties and place deployment under lawful civilian authority, preserving defense readiness within political limits."
