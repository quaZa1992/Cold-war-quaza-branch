 COLDWAR_KOR_alliance_bargain:0 "Retain US Forces"
 COLDWAR_KOR_alliance_bargain_conditional_tt:0 "Requires an active §YAmerican Alliance Assurances§! agreement."
 COLDWAR_KOR_alliance_bargain_desc:0 "American assurances can steady deterrence through a period of changing troop commitments. Seoul must secure Washington’s agreement to the relationship it seeks, accepting the financial and political demands of close cooperation rather than assuming that continued support is guaranteed."
