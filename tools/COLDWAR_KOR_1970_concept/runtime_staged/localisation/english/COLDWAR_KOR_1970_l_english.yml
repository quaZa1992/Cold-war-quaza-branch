 COLDWAR_KOR_review_korean_policy:0 "Peninsula Policy"
 COLDWAR_KOR_review_korean_policy_desc:0 "The cabinet brings diplomacy, defence planning and civilian oversight together in a review of peninsula policy. A coherent approach helps the state manage a divided Korea, balancing the possibilities of dialogue against the continuing requirements of national security."
