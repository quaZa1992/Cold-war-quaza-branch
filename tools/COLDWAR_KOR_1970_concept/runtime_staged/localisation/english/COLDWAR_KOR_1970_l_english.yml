 COLDWAR_KOR_party_cadres:0 "Cadres in Industry"
 COLDWAR_KOR_party_cadres_desc:0 "Embed cadres in workplaces while accepting coercion and managerial interference. Cadre placement gives party officials influence inside factories, but risks disrupting production and alienating skilled managers and workers."
