 COLDWAR_KOR_start_rural_intermediate_desc:0 "Rural infrastructure gaps and rapid urban migration constrain balanced development."
 COLDWAR_KOR_start_social_insurance:0 "Fragmented Social Protection"
 COLDWAR_KOR_start_social_insurance_desc:0 "Coverage remained fragmented and excluded many rural, informal and urban households; broad national coverage was a late 1980s achievement."
 COLDWAR_KOR_strategic_autonomy:0 "Korean-Led Defence"
 COLDWAR_KOR_strategic_autonomy_desc:0 "A stronger Korean command structure would give the Republic greater capacity to shape its own defence. Seoul can prepare those institutions while negotiating a reduction of the resident American presence; any agreed drawdown will bring additional responsibilities as well as greater freedom of action."
