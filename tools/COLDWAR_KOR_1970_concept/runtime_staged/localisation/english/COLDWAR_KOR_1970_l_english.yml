 COLDWAR_KOR_air_command:0 "Joint Air Command"
 COLDWAR_KOR_air_command_desc:0 "A more capable command structure coordinates air missions and improves the use of trained personnel. Better direction strengthens operational effectiveness, while a capable air arm demands sustained public funding and access to suitable aircraft."
 COLDWAR_KOR_air_command_preview:0 "Joint Air Command"
 COLDWAR_KOR_air_command_preview_desc:0 "A more capable command structure coordinates air missions and improves the use of trained personnel. Better direction strengthens operational effectiveness, while a capable air arm demands sustained public funding and access to suitable aircraft."
 COLDWAR_KOR_air_command_programme:0 "Joint Air Command"
 COLDWAR_KOR_air_command_programme_desc:0 "A more capable command structure coordinates air missions and improves the use of trained personnel. Better direction strengthens operational effectiveness, while a capable air arm demands sustained public funding and access to suitable aircraft."
 COLDWAR_KOR_air_cover_priority:0 "Air Cover Priority"
 COLDWAR_KOR_air_cover_priority_desc:0 "Air cover becomes the leading service mission, improving coordination among the Republic's air units. This choice gives greater weight to the defence of Korean skies, while leaving less room for competing naval and land priorities and raising the cost of readiness."
