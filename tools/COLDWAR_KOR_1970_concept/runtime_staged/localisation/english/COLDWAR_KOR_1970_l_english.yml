 COLDWAR_KOR_ys_civilian_contracts:0 "Public Contract Rules"
 COLDWAR_KOR_ys_civilian_contracts_desc:0 "Use competitive contracts and disclosure to constrain the old patronage networks. Competitive bids make public contracts harder to steer toward political allies, demanding competent procurement review across ministries."
