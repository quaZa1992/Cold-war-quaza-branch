 COLDWAR_KOR_roh_nordpolitik_desc:0 "An elected Roh government explores diplomatic recognition and northern trade. Roh Tae-woo's elected government would pursue trade and recognition with socialist states, expanding diplomatic options without abandoning the United States alliance."
