 COLDWAR_KOR_retirement_guarantees:0 "Retirement Guarantees"
 COLDWAR_KOR_retirement_guarantees_desc:0 "Offer funded retirement guarantees to remove officers from executive politics. The pension obligation survives an ordinary cabinet change. Pension guarantees give senior officers a material reason to leave political posts, while obliging future governments to honor the terms."
