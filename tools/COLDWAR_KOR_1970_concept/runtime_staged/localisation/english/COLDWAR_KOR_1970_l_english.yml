 COLDWAR_KOR_presidential_democracy:0 "Presidential Democracy"
 COLDWAR_KOR_presidential_democracy_conditional_tt:0 "Requires the constitutional settlement to remain in force."
 COLDWAR_KOR_presidential_democracy_desc:0 "Retain an effective directly elected presidency under binding rights, term and oversight limits. A directly elected president retains executive initiative, constrained by civil rights, term rules and legislative oversight."
