 COLDWAR_KOR_public_credit_programme_desc:0 "Keep credit allocation accountable to public institutions rather than conglomerates. Public lending institutions would set development priorities through accountable mandates, balancing industrial expansion against the risk of political loan allocation."
 COLDWAR_KOR_public_holding_fund:0 "A Public Holding Fund"
 COLDWAR_KOR_public_holding_fund_desc:0 "Concentrate capital in publicly owned industrial holdings with explicit financial exposure. A public fund would hold strategic stakes and direct reinvestment, concentrating capital under parliamentary scrutiny and carrying market risk on the public balance sheet."
 COLDWAR_KOR_public_holding_fund_preview:0 "A Public Holding Fund"
 COLDWAR_KOR_public_holding_fund_preview_desc:0 "Concentrate capital in publicly owned industrial holdings with explicit financial exposure. A public fund would hold strategic stakes and direct reinvestment, concentrating capital under parliamentary scrutiny and carrying market risk on the public balance sheet."
 COLDWAR_KOR_public_holding_fund_programme:0 "A Public Holding Fund"
 COLDWAR_KOR_public_holding_fund_programme_desc:0 "Concentrate capital in publicly owned industrial holdings with explicit financial exposure. A public fund would hold strategic stakes and direct reinvestment, concentrating capital under parliamentary scrutiny and carrying market risk on the public balance sheet."
 COLDWAR_KOR_public_treaty_process:0 "Public Treaty Rules"
 COLDWAR_KOR_public_treaty_process_desc:0 "The government publishes treaty obligations and requires major commitments to pass through lawful approval procedures. Greater transparency can strengthen external confidence and domestic oversight, but deliberation takes political effort and constrains the executive's freedom to conclude agreements privately."
 COLDWAR_KOR_public_treaty_process_preview:0 "Public Treaty Rules"
