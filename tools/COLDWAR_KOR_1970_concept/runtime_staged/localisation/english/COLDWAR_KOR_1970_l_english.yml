 COLDWAR_KOR_retire_political_officers:0 "Retire Political Officers"
 COLDWAR_KOR_retire_political_officers_desc:0 "Remove political commands, accepting temporary disruption in exchange for public trust. Retirement terms give politically active officers a route out of command, accepting vacancies and a temporary loss of experienced leadership."
