 COLDWAR_KOR_verified_restraint:0 "Verified Restraint"
 COLDWAR_KOR_verified_restraint_desc:0 "Following a coexistence agreement, Seoul proposes reciprocal notification and verification arrangements with clear funding and withdrawal terms. Such measures can build confidence only through shared procedures and sustained cooperation between the two governments."
 COLDWAR_KOR_verified_restraint_offer_tt:0 "§YProposal: Reciprocal Military Restraint§!\nRequires agreement with North Korea.\n§YOn ratification:§!\n  Upkeep, each government: §R$1 million/week§!\n  Duration: §Y3 years§!"
 COLDWAR_KOR_vietnam_commitment_tt:0 "An actual Korean commitment in Vietnam remains to be settled."
 COLDWAR_KOR_vietnam_commitment_tt_NOT:0 "No Korean commitment in Vietnam remains to be settled."
 COLDWAR_KOR_vietnam_legacy:0 "The Vietnam Legacy"
 COLDWAR_KOR_vietnam_legacy_desc:0 "The Republic seeks a negotiated end to its Vietnam commitment and a settlement for the personnel and obligations already involved. Withdrawal requires agreement with the other parties, while veterans' welfare and the political legacy of the deployment remain responsibilities at home."
 COLDWAR_KOR_vietnam_withdrawal_settlement_offer_tt:0 "§YProposal: Vietnam Withdrawal Settlement§!\nRequires agreement with South Vietnam, the United States.\n§YOn ratification:§!\n  Duration: §Y3 years§!"
 COLDWAR_KOR_village_accounts:0 "Village Elections"
 COLDWAR_KOR_village_accounts_desc:0 "Local audits improve trust while slowing central allocation. Published village accounts give residents a way to question spending and project selection, though consultation takes time from centrally scheduled works."
