 COLDWAR_KOR_start_alliance:0 "An Alliance under Adjustment"
 COLDWAR_KOR_start_alliance_desc:0 "The US commitment deters attack while the Nixon Doctrine raises uncertainty and demands local responsibility."
 COLDWAR_KOR_start_energy:0 "Imported Energy, Imported Risk"
 COLDWAR_KOR_start_energy_desc:0 "Rapid industrialization depends on imported fuel and external finance; this is exposure, not a 1973 shock in 1970."
