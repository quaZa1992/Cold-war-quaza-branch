 COLDWAR_KOR_protected_planning:0 "Protected Planning"
 COLDWAR_KOR_protected_planning_desc:0 "Guarantee strategic planning at a political and financial cost. Protected ministries can maintain long-term industrial plans through political shocks, at higher financing cost and with weaker public accountability."
