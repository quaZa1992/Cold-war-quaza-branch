 COLDWAR_KOR_professional_officers:0 "Professional Officers"
 COLDWAR_KOR_professional_officers_desc:0 "Promote professional competence while funding a better paid officer corps. Career education and predictable promotion strengthen military professionalism, accompanied by better-supported personnel and training institutions."
 COLDWAR_KOR_professional_officers_preview:0 "Professional Officers"
