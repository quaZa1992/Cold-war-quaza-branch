 COLDWAR_KOR_conservative_merger_programme:0 "A Conservative Merger"
 COLDWAR_KOR_conservative_merger_programme_desc:0 "Negotiate an elite conservative coalition. No opposition party or incumbent is transferred without political agreement. A merger among conservative parties could pool legislative strength, but only negotiated concessions can resolve disputes over leadership and regional bases."
 COLDWAR_KOR_constitution_referendum:0 "Submit the Charter"
 COLDWAR_KOR_constitution_referendum_desc:0 "Voters would decide whether to ratify the negotiated constitutional text. A public campaign gives both supporters and opponents a direct role in settling the country's institutional design."
 COLDWAR_KOR_constitutional_court:0 "An Independent Court"
 COLDWAR_KOR_constitutional_court_desc:0 "Judicial review strengthens rights while imposing an additional administrative burden. Constitutional review gives citizens and legislators a forum to contest executive acts, requiring judges and clerks independent of cabinet direction."
