 COLDWAR_KOR_korean_question:0 "The Korean Question"
 COLDWAR_KOR_korean_question_desc:0 "The divided peninsula forces the Republic to define its approach to Pyongyang while maintaining its own diplomatic and defensive responsibilities. Formal channels can create space for practical proposals, though mistrust and the unresolved conflict continue to shape both governments' choices."
 COLDWAR_KOR_korean_settlement:0 "A Korean Settlement"
 COLDWAR_KOR_korean_settlement_desc:0 "The earlier agreements have created a basis for a broader political settlement. Seoul can seek a common commitment to sustained cooperation, accepting restraints and administrative obligations in exchange for a more stable relationship across the peninsula."
 COLDWAR_KOR_labor_compact:0 "A Labour Compact"
 COLDWAR_KOR_labor_compact_desc:0 "Employers, workers and the state pursue a more cooperative settlement built on bargaining and basic labour protection. A compact can strengthen trust while preserving production, but it requires the government to accept stronger obligations toward workers and the institutions that represent them."
