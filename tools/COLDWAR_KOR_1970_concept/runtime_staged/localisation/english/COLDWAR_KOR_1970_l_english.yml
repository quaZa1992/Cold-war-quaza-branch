 COLDWAR_KOR_reserve_army:0 "The Reserve Army"
 COLDWAR_KOR_reserve_army_desc:0 "The government maintains a broad trained reserve as a means of mobilising national manpower in a crisis. A larger reserve improves the pool of available personnel, but training and civilian employment compete for the same labour and require sustained public support."
