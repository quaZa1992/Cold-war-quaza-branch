 COLDWAR_KOR_ys_civilian_authority_desc:0 "Assert civilian authority over the officer corps, accepting a difficult transition in command. Kim Young-sam's civilian leadership would challenge the political role of officers, requiring command changes that may unsettle the armed forces."
