 COLDWAR_KOR_licensed_maintenance_desc:0 "An allied procurement agreement brings a parallel effort to train Korean technicians in the upkeep of imported systems. Domestic maintenance can reduce reliance on foreign workshops, while spare parts and specialist knowledge still tie the armed forces to overseas suppliers."
