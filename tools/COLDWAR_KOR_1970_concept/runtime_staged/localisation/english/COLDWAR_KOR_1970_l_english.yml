 COLDWAR_KOR_assembly_bargain_programme_desc:0 "Accept legislative bargaining and scrutiny in return for a more durable civilian mandate. Assembly negotiation offers the ruling party a broader civilian basis, in exchange for hearings, amendments and opposition leverage over legislation."
 COLDWAR_KOR_assembly_contracts:0 "Assembly Licences"
 COLDWAR_KOR_assembly_contracts_conditional_tt:0 "Requires an active §YIndustrial Licensing§! agreement."
 COLDWAR_KOR_assembly_contracts_desc:0 "Seoul seeks a negotiated production licence to learn from foreign manufacturers and apply their methods at home. The agreement's terms determine how much knowledge Korean firms can absorb, while dependence on overseas expertise remains part of the industrial relationship."
 COLDWAR_KOR_assembly_contracts_preview:0 "Assembly Licences"
 COLDWAR_KOR_assembly_contracts_preview_desc:0 "Seoul seeks a negotiated production licence to learn from foreign manufacturers and apply their methods at home. The agreement's terms determine how much knowledge Korean firms can absorb, while dependence on overseas expertise remains part of the industrial relationship."
 COLDWAR_KOR_assembly_contracts_programme:0 "Assembly Licences"
 COLDWAR_KOR_assembly_contracts_programme_desc:0 "Seoul seeks a negotiated production licence to learn from foreign manufacturers and apply their methods at home. The agreement's terms determine how much knowledge Korean firms can absorb, while dependence on overseas expertise remains part of the industrial relationship."
 COLDWAR_KOR_authorize_djp_merger:0 "Authorize the DJP Merger Mandate"
 COLDWAR_KOR_authorize_djp_merger_desc:0 "The Democratic Justice Party must decide whether a broader conservative alignment can secure the political order beyond military rule. Authorizing its delegation opens negotiations with Kim Young-sam’s organization and Kim Jong-pil’s conservatives, whose constituencies will expect a voice in the resulting settlement."
 COLDWAR_KOR_authorize_kjp_handover:0 "Authorize the Civilian Succession to Kim Jong-pil"
 COLDWAR_KOR_authorize_kjp_handover_desc:0 "The authorized civilian succession gives Kim Jong-pil a route to executive office through the conservative organization he helped build. A negotiated handover would preserve administrative continuity while redistributing authority among party figures, ministers and the military networks accustomed to presidential direction."
 COLDWAR_KOR_authorize_military_succession:0 "Authorize a Military Cabinet"
 COLDWAR_KOR_authorize_military_succession_desc:0 "An unsettled succession has opened the presidency to an officer council. Backing Chun Doo-hwan would place the cabinet under an Army-led political settlement, with the promise of command continuity and the burden of a disputed civilian mandate. The decision will shape the terms of any later opening."
 COLDWAR_KOR_authorize_ndrp_merger:0 "Authorize the NDRP Merger Mandate"
 COLDWAR_KOR_authorize_ndrp_merger_desc:0 "Kim Jong-pil’s New Democratic Republican Party brings an established conservative network to the proposed realignment. Its delegation must decide what terms would protect that organization within a larger governing party. Authorizing talks gives it a seat at the table without settling the final agreement."
 COLDWAR_KOR_authorize_security_directorate:0 "Authorize an Exceptional Security Directorate"
 COLDWAR_KOR_authorize_security_directorate_desc:0 "A command crisis and severe instability have weakened the authority of ordinary government. An exceptional security directorate offers a coercive answer to the succession dispute, suspending electoral competition and concentrating responsibility in the security apparatus. Its initial order will carry a lasting question of legitimacy."
 COLDWAR_KOR_authorize_talks:0 "Constitutional Talks"
 COLDWAR_KOR_authorize_talks_desc:0 "Authorize talks with a real mandate and a resolved command or retirement bargain. A negotiating mandate lets civilian delegates address constitutional rules after command disputes and retirement terms are settled."
 COLDWAR_KOR_authorize_talks_preview:0 "Constitutional Talks"
 COLDWAR_KOR_authorize_talks_preview_desc:0 "Authorize talks with a real mandate and a resolved command or retirement bargain. A negotiating mandate lets civilian delegates address constitutional rules after command disputes and retirement terms are settled."
 COLDWAR_KOR_authorize_talks_programme:0 "Constitutional Talks"
 COLDWAR_KOR_authorize_talks_programme_desc:0 "Authorize talks with a real mandate and a resolved command or retirement bargain. A negotiating mandate lets civilian delegates address constitutional rules after command disputes and retirement terms are settled."
 COLDWAR_KOR_authorize_ys_merger:0 "Authorize the RDP Merger Mandate"
 COLDWAR_KOR_authorize_ys_merger_desc:0 "Kim Young-sam’s organization stands between continued opposition and a negotiated place in a broader conservative party. Its leaders must weigh access to government against the risk of dividing the democratic movement. A separate mandate is needed before its delegation can bargain with the DJP and NDRP."
 COLDWAR_KOR_balanced_development:0 "Provincial Opportunity"
 COLDWAR_KOR_balanced_development_desc:0 "Support industrial employment outside established corporate centers. Industrial incentives outside Seoul and the southeast would create new employment centers, though private firms may still favor established supply chains."
 COLDWAR_KOR_balanced_provinces:0 "Connect the Provinces"
 COLDWAR_KOR_balanced_provinces_desc:0 "Extend transport links beyond the dominant southeastern corridor. New links beyond the southeastern export corridor would help provincial producers reach ports and markets, spreading access beyond the favored industrial belt."
 COLDWAR_KOR_banking_discipline:0 "Discipline the Banks"
 COLDWAR_KOR_banking_discipline_desc:0 "The authorities restrain connected lending and make financial commitments more accountable, limiting the exposure created by opaque guarantees. A stricter banking regime can lower future financing risks, though tighter credit may slow industrial expansion in the near term."
 COLDWAR_KOR_banking_discipline_preview:0 "Discipline the Banks"
 COLDWAR_KOR_banking_discipline_preview_desc:0 "The authorities restrain connected lending and make financial commitments more accountable, limiting the exposure created by opaque guarantees. A stricter banking regime can lower future financing risks, though tighter credit may slow industrial expansion in the near term."
 COLDWAR_KOR_banking_discipline_problem_tt:0 "Reforms Concentrated Development Credit."
 COLDWAR_KOR_banking_discipline_programme:0 "Discipline the Banks"
 COLDWAR_KOR_banking_discipline_programme_desc:0 "The authorities restrain connected lending and make financial commitments more accountable, limiting the exposure created by opaque guarantees. A stricter banking regime can lower future financing risks, though tighter credit may slow industrial expansion in the near term."
 COLDWAR_KOR_bind_incumbent:0 "Bind the Incumbent"
 COLDWAR_KOR_bind_incumbent_desc:0 "Obtain a binding commitment to constitutional talks rather than a personal promise of reform. A public undertaking ties the incumbent to talks that can be tested by legislators, civic leaders and the armed forces."
 COLDWAR_KOR_bind_incumbent_preview:0 "Bind the Incumbent"
 COLDWAR_KOR_bind_incumbent_preview_desc:0 "Obtain a binding commitment to constitutional talks rather than a personal promise of reform. A public undertaking ties the incumbent to talks that can be tested by legislators, civic leaders and the armed forces."
 COLDWAR_KOR_bind_incumbent_programme:0 "Bind the Incumbent"
 COLDWAR_KOR_bind_incumbent_programme_desc:0 "Obtain a binding commitment to constitutional talks rather than a personal promise of reform. A public undertaking ties the incumbent to talks that can be tested by legislators, civic leaders and the armed forces."
 COLDWAR_KOR_border_notice_protocol:0 "Border Notice Rules"
 COLDWAR_KOR_border_notice_protocol_desc:0 "The Republic proposes reciprocal notification procedures for military activity near the border, respecting each side's command and jurisdiction. Shared notices can reduce uncertainty and the risk of accidental escalation when both governments follow the agreed rules."
 COLDWAR_KOR_border_notice_protocol_offer_tt:0 "§YProposal: Border Notification Protocol§!\nRequires agreement with North Korea.\n§YOn ratification:§!\n  Upkeep, each government: §R$1 million/week§!\n  Duration: §Y3 years§!"
 COLDWAR_KOR_border_notifications_offer_tt:0 "§YProposal: Military Notification Talks§!\nRequires agreement with North Korea.\n§YOn ratification:§!\n  Upkeep, each government: §R$0.5 million/week§!\n  Duration: §Y3 years§!"
 COLDWAR_KOR_bridge.1.d:0 "The Northern government proposes formal consultations between two sovereign governments. Seoul may authorize negotiations; a framework still requires both governments to accept its terms."
 COLDWAR_KOR_bridge.1.option_a:0 "Authorize a reciprocal proposal"
 COLDWAR_KOR_bridge.1.option_b:0 "Decline these consultations"
 COLDWAR_KOR_bridge.1.t:0 "A Northern Proposal for Consultation"
 COLDWAR_KOR_bridge_no_charge_tt:0 "No payment, membership or agreement benefit is granted."
 COLDWAR_KOR_broad_democratic_coalition:0 "A Broad Coalition"
 COLDWAR_KOR_broad_democratic_coalition_desc:0 "Bring parliamentary opposition, religious groups, students and workers into a negotiating forum without pretending they are one party. Religious networks, opposition figures, students and workers can press for common rules while retaining distinct agendas and leadership."
