 COLDWAR_KOR_broad_welfare:0 "Social Insurance"
 COLDWAR_KOR_broad_welfare_desc:0 "Build broad social protection with a substantial recurring public commitment. National insurance would pool risks across households rather than leave protection to employers, requiring a stable public contribution as enrollment expands."
