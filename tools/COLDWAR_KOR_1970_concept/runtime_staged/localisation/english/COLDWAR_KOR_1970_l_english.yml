 COLDWAR_KOR_retire_political_networks:0 "Retire Political Clubs"
 COLDWAR_KOR_retire_political_networks_conditional_tt:0 "Requires the constitutional settlement to remain in force."
 COLDWAR_KOR_retire_political_networks_desc:0 "Officers whose influence rests on political patronage can obstruct civilian authority long after a new constitution is signed. Accelerated retirement would break that continuity through a costly pension settlement, accepting a temporary disruption in command as a new generation assumes responsibility."
