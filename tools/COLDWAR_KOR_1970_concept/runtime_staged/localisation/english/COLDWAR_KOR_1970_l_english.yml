 COLDWAR_KOR_parliamentary_republic_desc:0 "Build a cabinet responsible to the Assembly; coalition bargaining constrains executive speed. A cabinet dependent on Assembly confidence gives party blocs influence over policy, trading rapid executive decisions for coalition durability."
