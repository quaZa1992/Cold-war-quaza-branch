 COLDWAR_KOR_sector_investment_review_desc:0 "The cabinet weighs competing industrial ambitions against scarce capital and skilled labour before setting the next investment priority. Electronics, machinery and shipbuilding each promise a different path to higher-value production, and the chosen course will shape how firms and ministries direct their effort."
