 COLDWAR_KOR_provincial_export_zones:0 "Provincial Exports"
 COLDWAR_KOR_provincial_export_zones_desc:0 "Export production spreads beyond the capital as provincial manufacturers join the country's industrial expansion. New factories broaden employment and connect more regions to overseas markets, while labour-intensive production and regional infrastructure require sustained public attention."
