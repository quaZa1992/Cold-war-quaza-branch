 COLDWAR_KOR_parliamentary_government:0 "Parliamentary Rule"
 COLDWAR_KOR_parliamentary_government_desc:0 "A governing New Democratic Party restores parliamentary opposition rights and independent political association. NDP leaders would restore assembly debate, opposition organization and association rights, while inheriting ministries built around presidential direction."
 COLDWAR_KOR_parliamentary_government_preview:0 "Parliamentary Rule"
 COLDWAR_KOR_parliamentary_government_preview_desc:0 "A governing New Democratic Party restores parliamentary opposition rights and independent political association. NDP leaders would restore assembly debate, opposition organization and association rights, while inheriting ministries built around presidential direction."
