 COLDWAR_KOR_restore_labour_bargaining:0 "Labour Bargaining"
 COLDWAR_KOR_restore_labour_bargaining_conditional_tt:0 "Requires the constitutional settlement to remain in force."
 COLDWAR_KOR_restore_labour_bargaining_desc:0 "Establish lawful independent representation and then use the actual MD labor-faction opinion effect. Existing faction state is never reset. Independent workplace representation gives unions a lawful voice, while employers adjust to bargaining beyond the state-linked federation."
