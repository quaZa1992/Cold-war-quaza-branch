 COLDWAR_KOR_army_constitutional_service_programme_desc:0 "Define the legal duties of the armed forces under the actual constitutional settlement. The constitution would define military duties and place deployment under lawful civilian authority, preserving defense readiness within political limits."
 COLDWAR_KOR_assembly_bargain:0 "Assembly Bargaining"
 COLDWAR_KOR_assembly_bargain_desc:0 "Accept legislative bargaining and scrutiny in return for a more durable civilian mandate. Assembly negotiation offers the ruling party a broader civilian basis, in exchange for hearings, amendments and opposition leverage over legislation."
 COLDWAR_KOR_assembly_bargain_preview:0 "Assembly Bargaining"
 COLDWAR_KOR_assembly_bargain_preview_desc:0 "Accept legislative bargaining and scrutiny in return for a more durable civilian mandate. Assembly negotiation offers the ruling party a broader civilian basis, in exchange for hearings, amendments and opposition leverage over legislation."
