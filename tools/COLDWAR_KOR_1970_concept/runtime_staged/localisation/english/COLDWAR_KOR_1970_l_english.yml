 COLDWAR_KOR_labor_discipline:0 "Wage Discipline"
 COLDWAR_KOR_labor_discipline_desc:0 "The government preserves export competitiveness through restricted bargaining and close state management of labour disputes, an approach associated with the developmental state. It can sustain industrial margins, but suppressing workers' claims carries a continuing political cost and leaves workplace grievances unresolved."
