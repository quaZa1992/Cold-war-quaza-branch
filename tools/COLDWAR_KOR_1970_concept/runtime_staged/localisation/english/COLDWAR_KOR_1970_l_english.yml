 COLDWAR_KOR_family_reunions:0 "Family Reunions"
 COLDWAR_KOR_family_reunions_desc:0 "Seoul offers a limited programme of family visits for people separated by the division of Korea. The proposal seeks to ease a profound human loss, but arrangements for travel, selection and supervision must be worked out with the North Korean authorities."
 COLDWAR_KOR_family_reunions_offer_tt:0 "§YProposal: Family Reunions§!\nRequires agreement with North Korea.\n§YOn ratification:§!\n  Upkeep, each government: §R$1 million/week§!\n  Duration: §Y3 years§!"
 COLDWAR_KOR_fifth_republic:0 "The Fifth Republic"
 COLDWAR_KOR_fifth_republic_desc:0 "Institutionalize Chun’s controlled presidency and civilian party vehicle. The 1980 constitution would preserve a strong indirect presidency and appointed representation, placing civilian parties beneath executive authority."
