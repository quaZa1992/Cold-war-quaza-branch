 COLDWAR_KOR_controlled_arbitration:0 "State Arbitration"
 COLDWAR_KOR_controlled_arbitration_desc:0 "Labour disputes are channelled through state arbitration backed by public-order authority. This offers employers a predictable process and supports production, yet security pressure weakens confidence in the settlement and requires additional policing as workers' independent demands remain constrained."
