 COLDWAR_KOR_park_jongcheol_1987.d:0 "Park Jong-cheol’s death in police custody and the attempted cover-up intensify the constitutional crisis."
 COLDWAR_KOR_park_jongcheol_1987.option_a:0 "Protect the Investigation"
 COLDWAR_KOR_park_jongcheol_1987.option_b:0 "Suppress Disclosure"
 COLDWAR_KOR_park_jongcheol_1987.t:0 "Torture, Disclosure and Accountability"
 COLDWAR_KOR_parliamentary_audits:0 "Parliamentary Audits"
 COLDWAR_KOR_parliamentary_audits_conditional_tt:0 "Requires the constitutional settlement to remain in force."
 COLDWAR_KOR_parliamentary_audits_desc:0 "Restore legislative scrutiny over public finance and state abuses, including hearings when the historical cases exist. Assembly hearings expose public spending and state abuses, providing a forum for cases that can be substantiated by records."
