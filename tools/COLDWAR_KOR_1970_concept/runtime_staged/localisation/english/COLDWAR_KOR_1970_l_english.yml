 COLDWAR_KOR_revolutionary_diplomacy:0 "Seek Recognition"
 COLDWAR_KOR_revolutionary_diplomacy_desc:0 "A revolutionary government would seek recognition from states willing to engage its new authorities. Diplomatic standing would depend on each capital's assessment of the government's legitimacy, security commitments and treatment of foreign interests."
 COLDWAR_KOR_revolutionary_recognition_offer_tt:0 "§YProposal: Revolutionary Recognition§!\nRequires agreement with the Soviet Union.\n§YOn ratification:§!\n  Duration: §Y3 years§!"
 COLDWAR_KOR_revolutionary_reconstruction:0 "Rebuild Industry"
 COLDWAR_KOR_revolutionary_reconstruction_desc:0 "Rebuild production under a public investment guarantee. A public guarantee for reconstruction would direct scarce capital toward damaged productive capacity, increasing state exposure to repayment and project failure."
