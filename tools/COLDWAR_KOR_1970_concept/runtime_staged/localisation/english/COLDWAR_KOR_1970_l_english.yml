 COLDWAR_KOR_start_energy_intermediate_desc:0 "Rapid industrialization depends on imported fuel and external finance; this is exposure, not a 1973 shock in 1970."
 COLDWAR_KOR_start_finance:0 "Concentrated Development Credit"
 COLDWAR_KOR_start_finance_desc:0 "State-directed credit mobilizes industrial capital but concentrates leverage and guarantees."
 COLDWAR_KOR_start_labour:0 "The Human Cost of Export Growth"
 COLDWAR_KOR_start_labour_desc:0 "Restricted bargaining, long hours and unsafe workplaces undermine legitimacy and skills."
 COLDWAR_KOR_start_political_command:0 "Political Officer Networks"
 COLDWAR_KOR_start_political_command_desc:0 "The army, security agencies and private officer networks sustain the developmental state while undermining neutral civilian command."
 COLDWAR_KOR_start_presidency:0 "A Contested Presidential Mandate"
 COLDWAR_KOR_start_presidency_desc:0 "1969 third-term amendment; Yushin is not yet in force."
