 COLDWAR_KOR_two_governments:0 "Parallel Recognition"
 COLDWAR_KOR_two_governments_desc:0 "Reciprocal recognition would acknowledge that practical cooperation must proceed between two established governments. The declaration could steady the political relationship and protect each administration’s room to govern, while provoking constituencies unwilling to accept a divided national authority."
 COLDWAR_KOR_uncensored_press:0 "An Uncensored Press"
 COLDWAR_KOR_uncensored_press_conditional_tt:0 "Requires the constitutional settlement to remain in force."
 COLDWAR_KOR_uncensored_press_desc:0 "Protect publication and criticism. These legal rules have enforcement and rollback conditions, not an invented press-freedom meter. Editors and broadcasters could report criticism without prior censorship, allowing voters to hear competing claims before elections."
