 COLDWAR_KOR_aircrew_training:0 "Aircrew Training"
 COLDWAR_KOR_aircrew_training_desc:0 "Training and staff work prepare aircrews for the air-cover mission. Greater proficiency supports effective operations, while experienced pilots and ground crews take time to develop and aircraft procurement adds to the continuing demands on the defence budget."
 COLDWAR_KOR_aircrew_training_preview:0 "Aircrew Training"
 COLDWAR_KOR_aircrew_training_preview_desc:0 "Training and staff work prepare aircrews for the air-cover mission. Greater proficiency supports effective operations, while experienced pilots and ground crews take time to develop and aircraft procurement adds to the continuing demands on the defence budget."
