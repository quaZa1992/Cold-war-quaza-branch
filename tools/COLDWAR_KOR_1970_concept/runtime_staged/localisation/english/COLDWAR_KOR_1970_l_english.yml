 COLDWAR_KOR_civil_administration:0 "A Civil Administration"
 COLDWAR_KOR_civil_administration_desc:0 "Put routine administration in professional civilian hands. Civilian ministries would resume ordinary budgeting and service delivery, displacing officers from roles better suited to professional administrators."
