 COLDWAR_KOR_constitutional_decisions:0 "Constitutional Settlement"
 COLDWAR_KOR_constitutional_decisions_desc:0 "The settlement of civilian authority depends on the constitution, the armed forces, the courts and the political organizations asked to accept the new rules."
 COLDWAR_KOR_constitutional_drp:0 "Civilian Conservatism"
 COLDWAR_KOR_constitutional_drp_desc:0 "Retain conservative development policy under a competitive constitutional settlement. A civilian DRP settlement would preserve electoral competition and conservative development, asking Park's administration to accept a legislature with a real bargaining role."
 COLDWAR_KOR_constitutional_drp_preview:0 "Civilian Conservatism"
