 COLDWAR_KOR_incident_hotline_weekly_tt:0 "Policy upkeep: §R$2 million/week§!"
 COLDWAR_KOR_independent_constitutional_court:0 "Constitutional Court"
 COLDWAR_KOR_independent_constitutional_court_conditional_tt:0 "Takes effect once the court is commissioned under constitutional government."
 COLDWAR_KOR_independent_constitutional_court_desc:0 "Create enforceable constitutional review of exceptional powers. The court is a national institution, not a party-specific research bonus. A constitutional court can review emergency authority and rights disputes, giving citizens a remedy beyond legislative negotiation."
