 COLDWAR_KOR_pacific_exports_programme_desc:0 "Korean exporters deepen access to established Pacific markets and build on existing commercial relationships. Broader trade can support industrial growth, but reliance on external demand and standards leaves the economy exposed to foreign decisions and market shifts."
 COLDWAR_KOR_pacific_standards:0 "Pacific Standards"
 COLDWAR_KOR_pacific_standards_desc:0 "The government directs greater attention to technology-intensive Pacific markets and the standards required to participate in them. This can deepen commercial access and technical learning, while reliance on externally set standards creates additional dependence on established partners."
 COLDWAR_KOR_pacific_standards_preview:0 "Pacific Standards"
 COLDWAR_KOR_pacific_standards_preview_desc:0 "The government directs greater attention to technology-intensive Pacific markets and the standards required to participate in them. This can deepen commercial access and technical learning, while reliance on externally set standards creates additional dependence on established partners."
