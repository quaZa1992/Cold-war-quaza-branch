 COLDWAR_KOR_combined_arms_training_desc:0 "Joint training teaches army units to coordinate manoeuvre and support across their formations. Better cooperation improves operational performance, but requires recurring exercises and greater logistical support, placing additional demands on commanders, supply officers and the troops themselves."
