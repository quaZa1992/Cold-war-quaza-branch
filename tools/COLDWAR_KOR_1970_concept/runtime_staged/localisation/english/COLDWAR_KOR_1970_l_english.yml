 COLDWAR_KOR_usfk_presence_desc:0 "The American presence anchors deterrence on the peninsula, but its future rests on decisions taken in both capitals. A renewed stationing agreement would define facilities, consultation and support while preserving the Republic’s responsibility for its own defence."
