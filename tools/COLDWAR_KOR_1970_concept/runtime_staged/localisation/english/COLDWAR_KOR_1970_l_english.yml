 COLDWAR_KOR_civil_nuclear_desc:0 "Reliance on imported fuel leads the government to advance a civilian nuclear effort as part of a more secure energy supply. Imported expertise, trained operators and rigorous safeguards shape its pace, while the construction and operation of reactors place a substantial claim on public investment."
