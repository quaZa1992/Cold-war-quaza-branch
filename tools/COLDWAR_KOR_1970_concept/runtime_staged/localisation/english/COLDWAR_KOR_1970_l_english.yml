 COLDWAR_KOR_works_councils:0 "Works Councils"
 COLDWAR_KOR_works_councils_desc:0 "Give labor representation in company decisions, exchanging speed for coordination. Elected workplace councils give employees a standing role in production decisions, slowing unilateral management changes in exchange for cooperation."
