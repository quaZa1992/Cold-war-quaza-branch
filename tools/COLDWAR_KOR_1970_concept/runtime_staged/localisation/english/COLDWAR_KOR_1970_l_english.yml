 COLDWAR_KOR_civil_defence_training:0 "Civil Defence Training"
 COLDWAR_KOR_civil_defence_training_desc:0 "Civil defence training extends readiness obligations beyond active service and prepares communities for emergencies. The broader system supports mobilisation and public preparedness, but demands time and labour from civilians as well as ongoing administrative coordination."
