 COLDWAR_KOR_command_reorganization:0 "Command Reorganization"
 COLDWAR_KOR_command_reorganization_desc:0 "Command continuity is strained while personnel and responsibilities are reorganized."
 COLDWAR_KOR_commercial_shipyards:0 "Commercial Shipyards"
 COLDWAR_KOR_commercial_shipyards_desc:0 "The government expands commercial shipyard capacity to serve a growing export industry. Larger yards strengthen industrial output and trade, while their demand for capital and skilled labour competes with other sectors; naval construction remains a separate strategic and industrial commitment."
