 COLDWAR_KOR_constitutional_security:0 "Constitutional Security"
 COLDWAR_KOR_constitutional_security_conditional_tt:0 "Requires the constitutional settlement to remain in force."
 COLDWAR_KOR_constitutional_security_desc:0 "Bind public security to constitutional law. Legal civilian control is distinct from removing every military-era political network. Security services would operate under constitutional law and civilian review, while military-era patronage networks remain a separate problem."
