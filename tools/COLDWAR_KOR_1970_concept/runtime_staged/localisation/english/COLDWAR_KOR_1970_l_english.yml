 COLDWAR_KOR_review_repression_cases:0 "Review Political Repression Cases"
 COLDWAR_KOR_review_repression_cases_desc:0 "Emergency rule has left disputed prosecutions, broken careers and families seeking answers from the state. A formal review would open the record to scrutiny and begin an accountability settlement. Its findings may restore confidence in civilian institutions while exposing officials and security networks to an uncomfortable reckoning."
 COLDWAR_KOR_revolutionary_cabinet:0 "Revolutionary Cabinet"
 COLDWAR_KOR_revolutionary_cabinet_desc:0 "An underground movement becomes a government only after a resolved revolutionary or political transition. This is a difficult alternate history. Only a successful revolutionary rupture could bring this underground current into government, leaving it to build authority amid institutional collapse."
