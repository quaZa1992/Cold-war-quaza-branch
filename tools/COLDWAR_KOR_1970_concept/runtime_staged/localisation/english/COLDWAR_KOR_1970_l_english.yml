 COLDWAR_KOR_pohang_foundry:0 "Pohang Steelworks"
 COLDWAR_KOR_pohang_foundry_desc:0 "The Pohang steel programme anchors the heavy-industry strategy in a costly domestic source of basic materials. Bringing industrial capacity on line strengthens the production base but deepens reliance on concentrated credit and the continued support of national planners."
