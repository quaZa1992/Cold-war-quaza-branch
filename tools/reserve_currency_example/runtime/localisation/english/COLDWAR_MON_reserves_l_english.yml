l_english:
 # IMPERIA COLD WAR — Treasury and central-bank reserve papers.
 COLDWAR_MON_monetary_papers: "External Monetary Arrangements"
 COLDWAR_MON_monetary_papers_desc: "The Treasury and central bank report on the reserves available for external payments. Existing obligations remain binding while ministers pursue alternative arrangements for settlement and credit."
 COLDWAR_MON_diversify_reserves: "Authorise Reserve Diversification"
 COLDWAR_MON_diversify_reserves_desc: "Cabinet may direct the central bank to place a greater share of its reserves outside the dollar network under an established clearing arrangement. The Treasury will maintain an administrative appropriation throughout the programme.\n\nDollar allocation: [?COLDWAR_MON_reserve_usd_share|%0] to §Y40%§! over §Y24 monthly reviews§!.\nStanding appropriation: §Y$[?COLDWAR_MON_prospective_weekly_cost|3]bn per week§! while active. Existing credit agreements retain their terms."
 COLDWAR_MON_clearing_required: "An alternative clearing arrangement is in force."
