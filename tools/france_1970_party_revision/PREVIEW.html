  (()=>{
    const PACK={"project":"IMPERIA COLD WAR","status":"Proposal, not installed","baseline_sha256":"ce12ec6040860d41721801cfb839c901988d408b6026bcc6d7a9cbe844b9be44","change_count":39,"changed_keys":{"participation":{"type":"revised","reason":"Profit-sharing earns labour cooperation and a paid technical-training project instead of another military efficiency increment."},"management":{"type":"revised","reason":"Professional management favours services and finite electronics expertise; it retains the labour opposition."},"debre":{"type":"revised","reason":"Industrial sovereignty retains its costly military specialisation and adds actual procurement/training experience."},"pompidou_europe":{"type":"revised","reason":"The Hague Opening becomes a reciprocal regional investment proposal, with real assets and co-financing rather than an influence-only reward."},"sound_franc":{"type":"revised","reason":"The disciplined-franc route favours financial services and receipts, with a real demand/output sacrifice."},"credit_expansion":{"type":"revised","reason":"Modernisation credit buys an industrial research window and faster civilian investment at the cost of fiscal concessions."},"atlantic_liberal":{"type":"revised","reason":"Liberal Atlantic policy exchanges licensing access for a real US engineering/marketing foothold; no broad equipment-cost discount."},"europe_liberal":{"type":"revised","reason":"The European option funds a reciprocal credit/insurance facility, distinct from the electronics licensing route."},"regional_councils":{"type":"revised","reason":"Devolution delivers a funded regional asset and a rural constituency benefit, while weakening central political control."},"mutuals":{"type":"revised","reason":"Mutual insurance adds an actual local-service facility to the insurance reform, with continuing social expenditure."},"federal_europe":{"type":"revised","reason":"Christian-democratic European policy gains a distinct civilian insurance/service programme, not a second industrial treaty."},"atlantic_security":{"type":"revised","reason":"Atlantic security funds actual reciprocal schooling and maritime safety; remove the old unrelated education/army cost rebates."},"left_radicals":{"type":"revised","reason":"Republican-left policy gains organised labour, civilian expertise and services rather than a generic stability bundle."},"secular_school":{"type":"revised","reason":"Technical schooling grants two distinct finite research awards and preserves its real education budget and starting-spirit remedy."},"europe_technology":{"type":"revised","reason":"The Radical technology route becomes a CII-Siemens-style programme, with two physical research/service centres and reciprocal obligations."},"public_banks":{"type":"revised","reason":"Public banks gain a concrete paid industrial lending programme; reduce the old generic service/bureaucracy multipliers."},"social_contract_ps":{"type":"revised","reason":"A negotiated labour compact changes real faction relationships and civilian productivity, with a payroll/social bill."},"europe_restraint":{"type":"revised","reason":"Monetary restraint offers funded bilateral financial coordination and differentiated returns; it does not adopt the euro or waive native currency rules."},"sovereign_reflation":{"type":"revised","reason":"Sovereign reflation opens a public-credit-led development alternative with Algeria, instead of an unreciprocated construction modifier."},"democratic_road":{"type":"revised","reason":"A pluralist PCF course offers domestic skills and autonomy, rather than only a stability reward."},"party_discipline":{"type":"revised","reason":"Cadre coordination provides finite planning expertise and production learning, retaining the legitimacy cost."},"planned_targets":{"type":"revised","reason":"Production planning accelerates a specific investment class and line maturity; household production still loses priority."},"independent_communism":{"type":"revised","reason":"The independent PCF course gains its own reciprocal European cooperative programme rather than merely declining Soviet benefits."},"soviet_friendship":{"type":"revised","reason":"Replace the unilateral land-doctrine reward with a real PCF-originated industrial agreement and separately paid gains for both countries."},"communist_settlement":{"type":"revised","reason":"Consolidation follows the actual selected reciprocal programme instead of bypassing the new specialisation."},"decentralised_services":{"type":"revised","reason":"Local services become a funded facility and health-efficiency reform, rather than a generic industrial research coupon."},"civilian_republic":{"type":"revised","reason":"Civilian conversion shifts the actual economic sector mix; it does not create an unexplained army payroll rebate."},"citizen_defence":{"type":"revised","reason":"Citizen defence funds training, doctrine and logistics, with a continuing personnel bill instead of another core-defence stack."},"efficiency_ecology":{"type":"revised","reason":"Conservation combines immediate lower demand with paid technical training and a finite energy research award."},"land_stewardship":{"type":"revised","reason":"Rural stewardship combines a productive asset, farmer support and a narrow agricultural gain, with rural-service costs."},"ecological_industry":{"type":"revised","reason":"Industrial conversion gains a reciprocal engineering/monitoring institution and lower energy demand; stricter production costs remain visible."},"local_sufficiency":{"type":"revised","reason":"Local sufficiency becomes a distinct municipal heating/technical programme, with a French regional asset and Austrian engineering returns."},"fn_protection":{"type":"revised","reason":"Protection buys a costly domestic industrial base; inefficient input allocation and diplomatic isolation remain real costs."},"fn_export":{"type":"revised","reason":"The counterfactual nationalist export route gains a real consenting customer and reciprocal aviation expertise, with market dependence and training costs."},"fn_defence":{"type":"revised","reason":"The armed nation gains an actual training and planning programme instead of stacking another general core-defence buff."},"pcf_energy_contract":{"type":"new","reason":"A scarce engineering-budget choice: conservation and generation expertise, not an unsupported guaranteed gas/resource transfer."},"pcf_shipping_contract":{"type":"new","reason":"A rival maritime investment package: a real French yard, Soviet commercial administration and reciprocal finite naval engineering knowledge."},"psu_cooperative_exchange":{"type":"new","reason":"A PSU-specific reciprocal self-management exchange, grounded in French and Yugoslav institutional debates rather than a Soviet-alignment copy."},"psu_union_institutes":{"type":"new","reason":"The independent-union route receives an equally useful domestic continuation instead of being a dead end beside the Yugoslav pact."}},"current":{"project":"IMPERIA COLD WAR","revision":"FRA2 runtime 1.0: condensed native MD presentation","nodes":[{"key":"public_service","group":"institutions","title":"A State Within Reach","description":"Pompidou's government inherited a central administration shaped by prefects and powerful ministries. Better local services can make that authority more useful to citizens while preserving the elected role of communes.","x":6,"y":0,"icon":"COLDWAR_FRA2_focus_french_republic","cost":5,"days":35,"prerequisites":[],"exclusions":[],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.08},{"kind":"modifier","key":"bureaucracy_cost_multiplier_modifier","value":-0.03}],"spirit":"COLDWAR_FRA2_institutions_programme","_change":"current","spirit_title":"Republic and Society Programme"},{"key":"executive","group":"institutions","title":"Executive Safeguards","description":"The Fifth Republic gives the presidency decisive authority. Clarifying the statutory limits around emergency powers can protect the mandate while leaving Parliament with fewer checks on executive action.","x":4,"y":1,"icon":"COLDWAR_FRA2_focus_french_republic","cost":7,"days":49,"prerequisites":[["public_service"]],"exclusions":["parliament"],"conditions":[],"effects":[{"kind":"remove_spirit","spirit":"COLDWAR_FRA2_presidency"},{"kind":"modifier","key":"political_power_factor","value":0.12},{"kind":"modifier","key":"stability_factor","value":-0.02},{"kind":"modifier","key":"bureaucracy_cost_multiplier_modifier","value":0.03}],"spirit":"COLDWAR_FRA2_institutions_programme","_change":"current","spirit_title":"Republic and Society Programme"},{"key":"parliament","group":"institutions","title":"Parliamentary Checks","description":"Give deputies and committees a stronger role in questioning ministers and scrutinising appointments. The aim is a more accountable Fifth Republic, not a return to the cabinet instability of the Fourth.","x":8,"y":1,"icon":"COLDWAR_FRA2_focus_liberte_egalite_solidarite","cost":7,"days":49,"prerequisites":[["public_service"]],"exclusions":["executive"],"conditions":[],"effects":[{"kind":"remove_spirit","spirit":"COLDWAR_FRA2_presidency"},{"kind":"modifier","key":"stability_factor","value":0.05},{"kind":"modifier","key":"political_power_factor","value":-0.05},{"kind":"modifier","key":"bureaucracy_cost_multiplier_modifier","value":-0.03}],"spirit":"COLDWAR_FRA2_institutions_programme","_change":"current","spirit_title":"Republic and Society Programme"},{"key":"contract","group":"institutions","title":"Social Settlement","description":"Bring employers and organised labour into regular national bargaining. Wage gains can support demand and industrial peace, but they require investment and a durable public commitment to social provision.","x":4,"y":2,"icon":"COLDWAR_FRA2_focus_french_union","cost":7,"days":49,"prerequisites":[["executive","parliament"]],"exclusions":["statute"],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.1},{"kind":"remove_spirit","spirit":"COLDWAR_FRA2_grenelle"},{"kind":"faction_opinion","faction":"labour_unions","value":10},{"kind":"faction_opinion","faction":"industrial_conglomerates","value":-5},{"kind":"modifier","key":"production_factory_efficiency_gain_factor","value":0.03},{"kind":"modifier","key":"social_cost_multiplier_modifier","value":0.08}],"spirit":"COLDWAR_FRA2_institutions_programme","_change":"current","spirit_title":"Republic and Society Programme"},{"key":"statute","group":"institutions","title":"Statutory Labour Pact","description":"Set national minimum protections and clear procedures for industrial action. Statutory rules can make disputes more predictable, although standards imposed from Paris may weaken workplace consent.","x":8,"y":2,"icon":"COLDWAR_FRA2_focus_french_union","cost":7,"days":49,"prerequisites":[["executive","parliament"]],"exclusions":["contract"],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.1},{"kind":"remove_spirit","spirit":"COLDWAR_FRA2_grenelle"},{"kind":"faction_opinion","faction":"industrial_conglomerates","value":10},{"kind":"faction_opinion","faction":"labour_unions","value":-10},{"kind":"modifier","key":"production_factory_efficiency_gain_factor","value":0.06},{"kind":"modifier","key":"police_cost_multiplier_modifier","value":0.04}],"spirit":"COLDWAR_FRA2_institutions_programme","_change":"current","spirit_title":"Republic and Society Programme"},{"key":"housing","group":"institutions","title":"Housing and Rights","description":"SONACOTRA and local authorities already house workers and families displaced by rapid urban growth. Extend serviced housing around Paris and replace precarious accommodation with lasting municipal services.","x":6,"y":3,"icon":"COLDWAR_FRA2_focus_FRA_ruralism","cost":7,"days":49,"prerequisites":[["contract","statute"]],"exclusions":[],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.3},{"kind":"building","state":56,"building":"infrastructure","amount":1,"slots":1},{"kind":"modifier","key":"stability_factor","value":0.03},{"kind":"modifier","key":"social_cost_multiplier_modifier","value":0.05}],"spirit":"COLDWAR_FRA2_institutions_programme","_change":"current","spirit_title":"Republic and Society Programme"},{"key":"memory","group":"institutions","title":"Historical Recognition","description":"Veterans, harkis, repatriates and Algerian families carry distinct experiences of the war and its aftermath. Public recognition can make room for those histories, but it must be joined to practical support.","x":4,"y":4,"icon":"COLDWAR_FRA2_focus_francafrique","cost":7,"days":49,"prerequisites":[["housing"]],"exclusions":["amnesty"],"conditions":[],"effects":[{"kind":"political_power","value":-50},{"kind":"modifier","key":"stability_factor","value":0.04},{"kind":"modifier","key":"social_cost_multiplier_modifier","value":0.03}],"spirit":"COLDWAR_FRA2_institutions_programme","_change":"current","spirit_title":"Republic and Society Programme"},{"key":"amnesty","group":"institutions","title":"Republican Amnesty","description":"Extend the late-1960s amnesties to close some domestic disputes left by the Algerian conflict. Reconciliation can reduce political division, while victims' claims and disagreements over public memory remain unresolved.","x":8,"y":4,"icon":"COLDWAR_FRA2_focus_french_republic","cost":7,"days":49,"prerequisites":[["housing"]],"exclusions":["memory"],"conditions":[],"effects":[{"kind":"political_power","value":60},{"kind":"modifier","key":"war_support_factor","value":0.03},{"kind":"modifier","key":"stability_factor","value":-0.02}],"spirit":"COLDWAR_FRA2_institutions_programme","_change":"current","spirit_title":"Republic and Society Programme"},{"key":"civic_settlement","group":"institutions","title":"Civic Settlement","description":"Build integration and public remembrance into the ordinary work of republican institutions. Citizens need not share one account of the end of empire for public services to treat them fairly.","x":6,"y":5,"icon":"COLDWAR_FRA2_focus_french_republic","cost":5,"days":35,"prerequisites":[["memory","amnesty"]],"exclusions":[],"conditions":[],"effects":[{"kind":"remove_spirit","spirit":"COLDWAR_FRA2_postcolonial"},{"kind":"modifier","key":"bureaucracy_cost_multiplier_modifier","value":-0.02}],"spirit":"COLDWAR_FRA2_institutions_programme","_change":"current","spirit_title":"Republic and Society Programme"},{"key":"progress","group":"udr","title":"Social Renewal","description":"Chaban-Delmas wants employers, unions and public enterprises to negotiate change rather than repeat the confrontations of 1968. Pompidou must decide how much authority the government is willing to share.","x":18,"y":0,"icon":"COLDWAR_FRA2_focus_french_republic","cost":5,"days":35,"prerequisites":[],"exclusions":[],"conditions":["western_conservatism_are_in_power = yes"],"effects":[{"kind":"treasury_gdp","percent":-0.1},{"kind":"modifier","key":"production_factory_efficiency_gain_factor","value":0.04},{"kind":"modifier","key":"bureaucracy_cost_multiplier_modifier","value":0.03}],"spirit":"COLDWAR_FRA2_udr_programme","_change":"current","spirit_title":"Gaullist Government Programme"},{"key":"new_society","group":"udr","title":"Chaban's New Deal","description":"Chaban-Delmas's New Society pairs administrative reform with broader workplace participation. Technical training and bargaining give the proposal material weight, while conservative Gaullists resist a lasting opening to organised labour.","x":15,"y":1,"icon":"COLDWAR_FRA2_focus_french_union","cost":7,"days":49,"prerequisites":[["progress"]],"exclusions":["presidential_industry"],"conditions":["western_conservatism_are_in_power = yes"],"effects":[{"kind":"treasury_gdp","percent":-0.2},{"kind":"research","category":"CAT_industry","bonus":0.5,"uses":1},{"kind":"faction_opinion","faction":"labour_unions","value":10},{"kind":"modifier","key":"education_cost_multiplier_modifier","value":0.06},{"kind":"modifier","key":"political_power_factor","value":-0.04}],"spirit":"COLDWAR_FRA2_udr_programme","_change":"current","spirit_title":"Gaullist Government Programme"},{"key":"presidential_industry","group":"udr","title":"Industrial Presidency","description":"Concentrate public investment in export-capable industrial groups and new productive capacity in Normandie. A stronger presidency secures scale and investment discipline while narrowing the social opening sought by organised labour.","x":21,"y":1,"icon":"COLDWAR_FRA2_focus_industry_military","cost":7,"days":49,"prerequisites":[["progress"]],"exclusions":["new_society"],"conditions":["western_conservatism_are_in_power = yes"],"effects":[{"kind":"treasury_gdp","percent":-0.4},{"kind":"building","state":55,"building":"industrial_complex","amount":1,"slots":1},{"kind":"modifier","key":"production_factory_max_efficiency_factor","value":0.04},{"kind":"faction_opinion","faction":"labour_unions","value":-5}],"spirit":"COLDWAR_FRA2_udr_programme","_change":"current","spirit_title":"Gaullist Government Programme"},{"key":"ortf","group":"udr","title":"Public Broadcasting","description":"The ORTF combines public broadcasting with close executive supervision. Give editors and broadcasters more professional room while retaining public service obligations and limiting the government's influence over the news.","x":15,"y":2,"icon":"COLDWAR_FRA2_focus_FRA_cinema","cost":7,"days":49,"prerequisites":[["new_society"]],"exclusions":[],"conditions":["western_conservatism_are_in_power = yes"],"effects":[{"kind":"modifier","key":"stability_factor","value":0.02},{"kind":"modifier","key":"political_power_factor","value":-0.04}],"spirit":"COLDWAR_FRA2_udr_programme","_change":"current","spirit_title":"Gaullist Government Programme"},{"key":"national_champions","group":"udr","title":"National Champions","description":"Use Rhone-Alpes production capacity and public contracts to strengthen French suppliers. Scale and export orders can improve industrial depth, but tax concessions reduce public revenue and reinforce established firms.","x":21,"y":2,"icon":"COLDWAR_FRA2_focus_economic_prosperity","cost":7,"days":49,"prerequisites":[["presidential_industry"]],"exclusions":[],"conditions":["western_conservatism_are_in_power = yes"],"effects":[{"kind":"treasury_gdp","percent":-0.4},{"kind":"building","state":62,"building":"industrial_complex","amount":1,"slots":1},{"kind":"modifier","key":"civilian_factories_productivity","value":0.04},{"kind":"modifier","key":"corporate_tax_income_multiplier_modifier","value":-0.04}],"spirit":"COLDWAR_FRA2_udr_programme","_change":"current","spirit_title":"Gaullist Government Programme"},{"key":"participation","group":"udr","title":"Gaullist Participation","description":"Extend the profit-sharing instruments established in 1959 and 1967, pairing employee savings with representation. Workers gain a stake in results without replacing management with collective ownership.","x":16,"y":3,"icon":"COLDWAR_FRA2_focus_french_union","cost":7,"days":49,"prerequisites":[["ortf","national_champions"]],"exclusions":["management"],"conditions":["western_conservatism_are_in_power = yes"],"effects":[{"kind":"treasury_gdp","percent":-0.1},{"kind":"faction_opinion","faction":"labour_unions","value":10},{"kind":"faction_opinion","faction":"industrial_conglomerates","value":-5},{"kind":"modifier","key":"production_factory_efficiency_gain_factor","value":0.04},{"kind":"modifier","key":"corporate_tax_income_multiplier_modifier","value":-0.04}],"spirit":"COLDWAR_FRA2_udr_programme","_change":"current","spirit_title":"Gaullist Government Programme"},{"key":"management","group":"udr","title":"Managerial Autonomy","description":"Let public enterprises set investment and staffing plans with greater commercial independence. Clearer management responsibility can improve performance, but workers lose some protection from political guarantees.","x":20,"y":3,"icon":"COLDWAR_FRA2_focus_economic_prosperity","cost":7,"days":49,"prerequisites":[["ortf","national_champions"]],"exclusions":["particip st_multiplier_modifier","value":0.07}],"spirit":"COLDWAR_FRA2_pcf_programme","_change":"current","spirit_title":"French Communist Party Programme"},{"key":"workers_control","group":"pcf","title":"Workers on the Board","description":"Give elected workplace representatives a binding role in company planning. Representation can build consent for change, though shared decisions may take longer to reach.","x":67,"y":3,"icon":"COLDWAR_FRA2_focus_french_union","cost":7,"days":49,"prerequisites":[["municipal_socialism","public_combine"]],"exclusions":["planned_targets"],"conditions":["emerging_communist_state_are_in_power = yes"],"effects":[{"kind":"faction_opinion","faction":"labour_unions","value":15},{"kind":"faction_opinion","faction":"industrial_conglomerates","value":-10},{"kind":"modifier","key":"production_factory_efficiency_gain_factor","value":0.05},{"kind":"modifier","key":"political_power_factor","value":-0.04}],"spirit":"COLDWAR_FRA2_pcf_programme","_change":"current","spirit_title":"French Communist Party Programme"},{"key":"planned_targets","group":"pcf","title":"Production Targets","description":"Direct investment toward a limited number of industrial priorities. Clear targets can concentrate effort, but compete with household supply, local needs and managers' discretion.","x":71,"y":3,"icon":"COLDWAR_FRA2_focus_industry_military","cost":7,"days":49,"prerequisites":[["municipal_socialism","public_combine"]],"exclusions":["workers_control"],"conditions":["emerging_communist_state_are_in_power = yes"],"effects":[{"kind":"modifier","key":"industrial_capacity_factory","value":0.08},{"kind":"modifier","key":"civilian_factories_productivity","value":-0.03},{"kind":"modifier","key":"stability_factor","value":-0.03}],"spirit":"COLDWAR_FRA2_pcf_programme","_change":"current","spirit_title":"French Communist Party Programme"},{"key":"independent_communism","group":"pcf","title":"Party Independence","description":"Set a French course for the PCF and keep national decis ns and Energy Programme"},{"key":"champion_model","group":"economy","title":"Industrial Champions","description":"Concentrate public capital and procurement on firms able to compete internationally. Scale supports exports, but raises fiscal exposure and sustains regional concentration.","x":27,"y":10,"icon":"COLDWAR_FRA2_focus_industry_military","cost":7,"days":49,"prerequisites":[["regional_links"]],"exclusions":["regional_industry"],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.6},{"kind":"building","state":55,"building":"industrial_complex","amount":1,"slots":1},{"kind":"modifier","key":"civilian_factories_productivity","value":0.06},{"kind":"modifier","key":"bureaucracy_cost_multiplier_modifier","value":0.04}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"regional_industry","group":"economy","title":"Regional Industry","description":"Prepare industrial sites in Hauts-de-France and expand port capacity in Provence. Regional investment supports conversion and new suppliers without granting a completed industrial complex by decree.","x":31,"y":10,"icon":"COLDWAR_FRA2_focus_economic_prosperity","cost":7,"days":49,"prerequisites":[["regional_links"]],"exclusions":["champion_model"],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.6},{"kind":"building","state":54,"building":"industrial_complex","amount":1,"slots":1},{"kind":"building","state":63,"building":"naval_base","amount":1,"slots":1,"province":11834},{"kind":"modifier","key":"civilian_factories_productivity","value":0.04},{"kind":"modifier","key":"social_cost_multiplier_modifier","value":0.04}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"territorial_balance","group":"economy","title":"Industrial Balance","description":"Tie regional transport to the chosen industrial strategy. Investment can narrow the inherited gap in access to modern production, although it cannot remove the advantages of the largest centres at once.","x":29,"y":11,"icon":"COLDWAR_FRA2_focus_FRA_ruralism","cost":5,"days":35,"prerequisites":[["champion_model","regional_industry"]],"exclusions":[],"conditions":[],"effects":[{"kind":"remove_spirit","spirit":"COLDWAR_FRA2_regions"},{"kind":"modifier","key":"production_speed_infrastructure_factor","value":0.03}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"plan_calcul","group":"economy","title":"Plan Calcul Renewal","description":"Renew the Plan Calcul through IRIA, domestic procurement and trained engineers. French computing needs a dependable market if it is to compete with established foreign suppliers.","x":34,"y":10,"icon":"COLDWAR_FRA2_focus_brain_power","cost":7,"days":49,"prerequisites":[["technical_colleges","mass_universities"]],"exclusions":[],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.3},{"kind":"research","category":"CAT_electronics","bonus":0.5,"uses":2},{"kind":"modifier","key":"education_cost_multiplier_modifier","value":0.04}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"national_computers","group":"economy","title":"Computer Industry","description":"Back the domestic computer-systems industry and Grenoble's engineering base with a funded production site. Independent supply requires public orders and continuing fiscal concessions.","x":32,"y":11,"icon":"COLDWAR_FRA2_focus_brain_power","cost":7,"days":49,"prerequisites":[["plan_calcul"]],"exclusions":["open_computers"],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.35},{"kind":"building","state":62,"building":"industrial_complex","amount":1,"slots":1},{"kind":"research","category":"CAT_electronics","bonus":0.5,"uses":1},{"kind":"modifier","key":"corporate_tax_income_multiplier_modifier","value":-0.03}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"open_computers","group":"economy","title":"Compatible Systems","description":"Adopt international standards and concentrate French engineering on competitive niches. Compatibility accelerates renewal, while making a fully independent supply chain less likely.","x":36,"y":11,"icon":"COLDWAR_FRA2_focus_brain_power","cost":7,"days":49,"prerequisites":[["plan_calcul"]],"exclusions":["national_computers"],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.15},{"kind":"research","category":"CAT_electronics","bonus":0.75,"uses":1},{"kind":"modifier","key":"production_factory_efficiency_gain_factor","value":0.06},{"kind":"modifier","key":"foreign_influence_modifier","value":-0.03}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"transport_choice","group":"economy","title":"Rail or Motorway","description":"Choose how to connect a rapidly urbanising country. High-speed rail offers concentrated capacity; motorways reach dispersed industry, and both compete for public investment.","x":40,"y":9,"icon":"COLDWAR_FRA2_focus_economic_railroads","cost":5,"days":35,"prerequisites":[["sixth_plan"]],"exclusions":[],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.06},{"kind":"research","category":"CAT_industry","bonus":0.25,"uses":1}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"tgv","group":"economy","title":"High-Speed Rail","description":"Fund SNCF engineering trials and the Lyon terminal and approaches. The 1970 study can prepare an experimental high-speed programme without claiming that commercial service already exists.","x":38,"y":10,"icon":"COLDWAR_FRA2_focus_economic_railroads","cost":7,"days":49,"prerequisites":[["transport_choice"]],"exclusions":["motorways"],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.6},{"kind":"building","state":62,"building":"infrastructure","amount":1,"slots":1},{"kind":"research","category":"CAT_infrastructure","bonus":0.75,"uses":1},{"kind":"modifier","key":"energy_use_modifier_civs","value":-0.03}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"motorways","group":"economy","title":"Regional Motorways","description":"Extend road access to industrial towns and smaller centres. Flexible routes can support regional growth, while increasing the economy's dependence on imported motor fuel.","x":42,"y":10,"icon":"COLDWAR_FRA2_focus_economic_roads_new","cost":7,"days":49,"prerequisites":[["transport_choice"]],"exclusions":["tgv"],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.6},{"kind":"building","state":60,"building":"infrastructure","amount":1,"slots":1},{"kind":"building","state":59,"building":"infrastructure","amount":1,"slots":1},{"kind":"modifier","key":"production_speed_infrastructure_factor","value":0.07},{"kind":"modifier","key":"energy_use_modifier_civs","value":0.04}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"energy_review","group":"economy","title":"Energy Choices","description":"Review fuel dependence before an external crisis forces emergency decisions. France must choose between capital-intensive generation and a broader mix of supply and demand measures.","x":41,"y":11,"icon":"COLDWAR_FRA2_focus_national_grid","cost":5,"days":35,"prerequisites":[["tgv","motorways"]],"exclusions":[],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.05},{"kind":"unlock_decision","id":"COLDWAR_FRA2_energy_audit","label":"Energy contingency planning"}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"nuclear_scale","group":"economy",  while power stations and fuel contracts remain distinct national choices.","x":41,"y":13,"icon":"COLDWAR_FRA2_focus_powerplant","cost":5,"days":35,"prerequisites":[["nuclear_scale","diverse_energy"]],"exclusions":[],"conditions":[],"effects":[{"kind":"remove_spirit","spirit":"COLDWAR_FRA2_oil"}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"farm_policy","group":"economy","title":"Farm Settlement","description":"Decide how agricultural modernisation should divide its gains between export-scale production and the survival of smaller rural communities.","x":28,"y":12,"icon":"COLDWAR_FRA2_focus_FRA_ruralism","cost":5,"days":35,"prerequisites":[["territorial_balance"]],"exclusions":[],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.05}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"export_farms","group":"economy","title":"Export Agriculture","description":"Support mechanisation and processing for European and world markets. Larger farms can raise output and exports, but intensify pressure on small holdings and farm incomes.","x":26,"y":13,"icon":"COLDWAR_FRA2_focus_mechanized_agriculture","cost":7,"days":49,"prerequisites":[["farm_policy"]],"exclusions":["rural_services"],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.3},{"kind":"building","state":60,"building":"agriculture_district","amount":1,"slots":1},{"kind":"modifier","key":"agricolture_productivity_modifier","value":0.08},{"kind":"faction_opinion","faction":"farmers","value":-5}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"rural_services","group":"economy","title":"Rural Services","description":"Sustain cooperative services and smaller farms so rural communities remain viable. The policy protects local employment, while accepting slower concentration and lower economies of scale.","x":30,"y":13,"icon":"COLDWAR_FRA2_focus_farming_sector","cost":7,"days":49,"prerequisites":[["farm_policy"]],"exclusions":["export_farms"],"conditions":[],"effects":[{"kind":"treasury_gdp","percent":-0.3},{"kind":"building","state":59,"building":"agriculture_district","amount":1,"slots":1},{"kind":"modifier","key":"agricolture_productivity_modifier","value":0.04},{"kind":"faction_opinion","faction":"farmers","value":10},{"kind":"modifier","key":"social_cost_multiplier_modifier","value":0.04}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"telecoms","group":"economy","title":"Telecom Network","description":"Modernise the PTT network through CNET research, switching equipment and long-distance links. New exchanges in Paris and Rhone-Alpes widen service, while demand still exceeds available connections.","x":34,"y":12,"icon":"COLDWAR_FRA2_focus_brain_power","cost":7,"days":49,"prerequisites":[["national_computers","open_computers"]],"exclusions":[],"conditions":["has_tech = internet_1"],"effects":[{"kind":"treasury_gdp","percent":-0.45},{"kind":"building","state":56,"building":"internet_station","amount":1,"slots":1},{"kind":"building","state":62,"building":"internet_station","amount":1,"slots":1},{"kind":"research","category":"CAT_electronics","bonus":0.5,"uses":1}],"spirit":"COLDWAR_FRA2_economy_programme","_change":"current","spirit_title":"Industry, Regions and Energy Programme"},{"key":"conversion","group":"economy","title":"Industrial Basins","description":"Prepare coal, textile and steel districts for industrial change before closures become a national emergency. New skills and production can replace some work, but adjustment brings real losses to established communities.","x":34,"y":13,"icon":"COLDWAR_FRA2_focus_industry_military","cost":7,"days":49,"prerequisites":[["telecoms"]],"exclusions":[],"conditions":[],"effects":[{"kind":"treasury_gd         else if(e.kind==='faction_opinion'){text=(factionNames[e.faction]||e.faction)+' Opinion: '+(e.value>=0?'+':'')+e.value;good=e.value>0;}
        else if(e.kind==='doctrine'){text=e.category.replace('_doctrine','').replace(/^./,c=>c.toUpperCase())+' Doctrine: -'+num(e.reduction*100,2)+'% cost, '+e.uses+' use'+(e.uses===1?'':'s');good=true;}
        else if(e.kind==='remove_spirit'){text='Remove '+(D.starting_spirits.find(s=>s.id===e.spirit)?.title||e.spirit);}
        else if(e.kind==='unlock_decision'){text='Decision unlocked: '+(D.decisions.find(d=>d.id===e.id)?.title||e.label);good=true;}
        if(text)rows.push({text,good});
      }
      return '<ul class="fr-effects">'+rows.map(x=>'<li class="'+(x.good===true?'fr-good':x.good===false?'fr-bad':'')+'"'+(x.slot!==undefined?' data-asset-slot="'+x.slot+'"':'')+(x.build!==undefined?' data-asset-build="'+x.build+'"':'')+'>'+esc(x.text)+'</li>').join('')+'</ul>';
    }
    function fmtCondition(c,n){
      if(c.endsWith('_are_in_power = yes')){const trigger=c.split(' = ')[0],g=D.groups.find(x=>x.trigger===trigger);return g?groupLabel(g.id)+' must lead the government.':'A required political party must lead the government.';}
      if(c==='has_idea = EU_member')return 'France has European Communities membership.';
      if(c==='has_idea = NATO_member')return 'France has NATO membership.';
      if(c==='GER = { has_idea = EU_member }')return 'West Germany has European Communities membership.';
      if(c==='GER = { has_idea = NATO_member }')return 'West Germany has NATO membership.';
      if(c==='ENG = { has_idea = NATO_member }')return 'Britain has NATO membership.';
      if(c==='has_tech = internet_1')return 'Network Infrastructure I is researched.';
      if(c==='GER = { has_tech = internet_1 }')return 'West Germany has researched Network Infrastructure I.';
      const m=c.match(/^(?:(\w{3}) = \{ )?has_idea = (COLDWAR_FRA2P?_[A-Za-z0-9_]+)(?: \})?$/);if(m){const tag=m[1]||'FRA',term=D.nodes.find(a=>a.offer&&(a.offer.france.spirit===m[2]||a.offer.recipient.spirit===m[2]));const side=term?.offer.france.spirit===m[2]?term?.offer.france:term?.offer.recipient;return (countryNames[tag]||tag)+' requires active agreement: '+(side?.title||m[2]);}
      return null;
    }
    function assetRequirement(effect,tag,timing){const state=stateNames[effect.state]||('State '+effect.state),building=buildingNames[effect.building]||effect.building.replaceAll('_',' '),province=effect.province?(', province '+(provinces[effect.province]||effect.province)):'';return (countryNames[tag]||tag)+' must own and fully control '+state+' (state '+effect.state+province+'); the native '+building+' level cap must allow the additional level '+timing+'.';}
    function visibleRequirements(n){const out=[];for(const c of n.conditions||[]){const text=fmtCondition(c,n);if(text&&!out.includes(text))out.push(text);}
      for(const e of n.effects||[])if(e.kind==='building'){const text=assetRequirement(e,'FRA','when the focus completes');if(!out.includes(text))out.push(text);}
      if(n.offer){for(const text of ['Both countries must exist and be at peace with one another.','No native embargo may be active in either direction.','No mirrored diplomatic, financial, economic, or military sanctions may run between the two countries in either direction.'])if(!out.includes(text))out.push(text);for(const c of n.offer.activation_conditions||[]){const text=fmtCondition(c,n);if(text&&!out.includes(text))out.push(text);}for(const e of n.offer.france.effects||[])if(e.kind==='building'){const text=assetRequirement(e,'FRA','when the agreement is accepted');if(!out.includes(text))out.push(text);}for(const e of n.offer.recipient.effects||[])if(e.kind==='building'){const text=assetRequirement(e,n.offer.partner,'when the agreement is accepted');if(!out.includes(text))out.push(text);}}
      for(const group of n.prerequisites||[]){const titles=group.map(k=>N[k]?.title||k);out.push({or:titles,keys:group});}
      const excluded=(n.exclusions||[]).map(k=>N[k]?.title||k);if(excluded.length)out.push('Mutually exclusive with: '+excluded.join('; '));
      return out;
    }
    const world=$('#fr-world'),lines=$('#fr-lines'),map=$('#fr-map');
    let government='pcf',section='pcf',selected='soviet_friendship',z=1,tx=0,ty=0,panning=null,offers=[];
    function icon(n){return n.key;}
    function rebuild(nextMode){
      mode=nextMode;
      if(mode==='proposed'){
        const overrides=Object.fromEntries(PACK.proposed.nodes.map(n=>[n.key,n]));
        D={...PACK.current,...PACK.proposed,groups:PACK.current.groups,decisions:PACK.current.decisions,starting_spirits:PACK.current.starting_spirits,emitted_shortcuts:PACK.current.emitted_shortcuts,nodes:[...PACK.current.nodes.map(n=>({...n,...(overrides[n.key]||{})})),...PACK.proposed.nodes.filter(n=>!PACK.current.nodes.some(c=>c.key===n.key))]};
      } else D=PACK.current;
      N=Object.fromEntries(D.nodes.map(n=>[n.key,n]));G=Object.fromEntries(D.groups.map(g=>[g.id,g]));
      if(!G[government])government=D.groups.find(g=>g.slot!==null&&!g.governing_group)?.id||'pcf';
      if(!G[section])section='pcf';if(!N[selected])selected='soviet_friendship';
      offers=D.nodes.filter(n=>n.offer);
      const exclusives=D.nodes.reduce((v,n)=>v+(n.exclusions||[]).length,0)/2;
      $('#fr-runtime-caption').textContent=(mode==='proposed'?'Proposed tree · not installed':'Current installed tree')+' · '+D.nodes.length+' focuses · '+offers.length+' recipient-approved offers';
      $('#fr-proposal-banner').hidden=mode!=='proposed';
      $('#fr-current').setAttribute('aria-pressed',String(mode==='current'));$('#fr-proposed').setAttribute('aria-pressed',String(mode==='proposed'));
      $('#fr-section').innerHTML='<option value="overview">Full tree</option>'+D.groups.map(g=>'<option value="'+g.id+'">'+esc(groupLabel(g.id))+'</option>').join('');$('#fr-section').value=section;
      const governments=D.groups.filter(g=>g.slot!==null&&!g.governing_group);
      $('#fr-government').innerHTML=governments.map(g=>'<option value="'+g.id+'">'+esc(groupLabel(g.id))+'</option>').join('');$('#fr-government').value=government;
      const worldNodes=[...world.children].filter(el=>el!==lines);worldNodes.forEach(el=>el.remove());
      for(const g of D.groups){const h=document.createElement('div');h.className='fr-group';h.dataset.group=g.id;h.textContent=groupLabel(g.id);h.style.left=(Math.min(...D.nodes.filter(n=>n.group===g.id).map(n=>n.x))*96)+'px';h.style.top=(g.y*130-36)+'px';world.append(h);}
      for(const n of D.nodes){const b=document.createElement('button');b.type='button';b.className='fr-focus'+(n._change==='new'?' is-new':'');b.dataset.key=n.key;b.setAttribute('aria-label',n.title);b.style.left=n.x*96+'px';b.style.top=n.y*130+'px';b.innerHTML='<img class="fr-goal" alt="" src="'+A[icon(n)]+'"><img class="fr-titlebar" alt="" src="'+A.GFX_focus_unavailable+'"><span class="fr-name">'+esc(n.title)+'</span>';b.addEventListener('pointerdown',e=>e.stopPropagation());b.addEventListener('click',()=>inspect(n.key));world.append(b);}
      $('#fr-shortcuts').innerHTML='';for(const s of D.emitted_shortcuts||[]){const b=document.createElement('button');b.type='button';b.textContent=s.label;b.dataset.jump=(s.target||'').replace('COLDWAR_FRA2_','');b.onclick=()=>{const n=N[b.dataset.jump];if(n){selected=n.key;section=n.group;$('#fr-section').value=section;fit(section);inspect(n.key);}};$('#fr-shortcuts').append(b);}
      $('#fr-offers').innerHTML=offers.map(n=>'<button type="button" data-offer="'+n.key+'">'+esc(n.title)+'</button>').join('');for(const b of $('#fr-offers').querySelectorAll('[data-offer]'))b.onclick=()=>{const n=N[b.dataset.offer];section=n.group;$('#fr-section').value=section;fit(section);inspect(n.key);map.scrollIntoView({block:'nearest'});};
      renderLines();shade();inspect(selected,false);fit(section);return exclusives;
    }
    function renderLines(){let p='';for(const n of D.nodes){if(n._previewHidden)continue;for(const block of n.prerequisites||[])for(const key of block){const a=N[key];if(!a||a._previewHidden)continue;const x1=a.x*96+82.5,y1=a.y*130+128,x2=n.x*96+82.5,y2=n.y*130,mid=y2-1;p+='<path d="M'+x1+','+y1+' V'+mid+' H'+x2+' V'+y2+'"/>';} 
      for(const key of n.exclusions||[])if(n.key<key){const a=N[key];if(a&&!a._previewHidden&&n.y===a.y){const left=n.x<a.x?n:a,right=n.x<a.x?a:n;const middle=D.nodes.some(m=>!m._previewHidden&&m.y===n.y&&m.x>left.x&&m.x<right.x&&(n.exclusions||[]).includes(m.key)&&(a.exclusions||[]).includes(m.key));if(!middle)p+='<path class="fr-exclusion" d="M'+(left.x*96+166)+','+(left.y*130+92)+' H'+(right.x*96-2)+'"/>';}}}lines.innerHTML=p;}
    function transform(){world.style.transform='translate('+tx+'px,'+ty+'px) scale('+z+')';map.classList.toggle('is-overview',z<.32);const pairCount=D.nodes.reduce((v,n)=>v+(n.exclusions||[]).length,0)/2;$('#fr-status').textContent=D.nodes.length+' focuses · '+pairCount+' mutually exclusive pairs · '+offers.length+' bilateral offers · '+Math.round(z*100)+'%';}
    function fit(group=section){const ns=group==='overview'?[...D.nodes]:D.nodes.filter(n=>n.group===group);if(G[group]?.parent_group){for(const n of [...ns])for(const k of (n.prerequisites||[]).flat())if(N[k]&&N[k].group!==group&&!ns.includes(N[k]))ns.push(N[k]);}
      const visible=new Set(ns.map(n=>n.key));for(const n of D.nodes){n._previewHidden=!visible.has(n.key);const b=world.querySelector('[data-key="'+n.key+'"]');if(b)b.hidden=n._previewHidden;}for(const h of world.querySelectorAll('.fr-group'))h.hidden=group!=='overview'&&!ns.some(n=>n.group===h.dataset.group);renderLines();
      const minX=Math.min(...ns.map(n=>n.x))*96-18,minY=Math.min(...ns.map(n=>n.y))*130-55,maxX=Math.max(...ns.map(n=>n.x))*96+185,maxY=Math.max(...ns.map(n=>n.y))*130+145,w=map.clientWidth,h=map.clientHeight;z=Math.min(1,w/(maxX-minX),h/(maxY-minY))*.94;tx=(w-(maxX-minX)*z)/2-minX*z;ty=(h-(maxY-minY)*z)/2-minY*z;transform();}
    function zoom(next,cx=map.clientWidth/2,cy=map.clientHeight/2){const nz=Math.max(.055,Math.min(1.75,next));tx=cx-(cx-tx)*nz/z;ty=cy-(cy-ty)*nz/z;z=nz;transform();}
    function shade(){for(const b of world.querySelectorAll('.fr-focus')){const n=N[b.dataset.key],locked=G[n.group].slot!==null&&G[n.group].slot!==G[government].slot;b.classList.toggle('is-locked',locked);b.classList.toggle('is-selected',n.key===selected);b.querySelector('.fr-titlebar').src=A[locked?'GFX_focus_unavailable':'GFX_focus_can_start'];}}
    function offerTerms(side,sideLabel){return '<div class="fr-term"><h3>'+esc(side.title||side.spirit)+'</h3></div>'+effectRows(side.effects,sideLabel);}
    function requirementsBlock(n){if(!n)return '<p>Focus not present in this version.</p>';const requirements=visibleRequirements(n);return '<div class="fr-sub">'+esc(groupLabel(n.group))+' · '+n.days+' days</div><ul class="fr-requirements"><li>Completion time: '+n.days+' days</li>'+requirements.map(v=>typeof v==='string'?'<li>'+esc(v)+'</li>':('<li>Requires '+v.or.map((t,i)=>'<button type="button" data-jump="'+v.keys[i]+'">'+esc(t)+'</button>').join(' or ')+'</li>')).join('')+'</ul>';}
    function effectsBlock(n){if(!n)return '<p>Focus not present in this version.</p>';let out=(n.effects||[]).some(e=>e.kind==='modifier')?'<div>'+esc(n.spirit_title||n.spirit_name||'')+'</div>':'';out+=effectRows(n.effects||[],'France');
      if(n.offer)out+='<h3>If they accept</h3>'+offerTerms(n.offer.france,'France')+offerTerms(n.offer.recipient,n.offer.partner_name);
      for(const d of (n.effects||[]).filter(e=>e.kind==='unlock_decision')){const decision=D.decisions.find(x=>x.id===d.id);if(decision)out+='<h3>Decision effects: '+esc(decision.title)+'</h3>'+effectRows(decision.effects,'France');}return out;}
    function inspect(key,save=true){const n=N[key];if(!n)return;selected=key;shade();const c=Object.fromEntries(PACK.current.nodes.map(x=>[x.key,x]))[key],p=Object.fromEntries(PACK.proposed.nodes.map(x=>[x.key,x]))[key];const currentNode=c||null,proposalNode=p||c||null;const active=mode==='current'?currentNode:proposalNode;const title=active?.title||n.title,description=active?.description||'';const changed=!!PACK.changed_keys[key];
      let body='<h2>'+esc(title)+'</h2><p class="fr-description">'+esc(description)+'</p>'+(changed&&PACK.changed_keys[key]?.reason?'<p class="fr-design-change"><strong>Design change:</strong> '+esc(PACK.changed_keys[key].reason)+'</p>':'')+'<div class="fr-detail-cols"><div><h3>Requirements</h3>';
      if(changed){body+='<h4>Current</h4>'+requirementsBlock(currentNode)+'<h4>Proposed</h4>'+requirementsBlock(proposalNode);}else body+=requirementsBlock(active);
      body+='</div><div><h3>Effects</h3>';
      if(changed){body+='<h4>Current effects</h4>'+effectsBlock(currentNode)+'<h4>Proposed effects</h4>'+effectsBlock(proposalNode);}
      else body+=effectsBlock(active);
      body+='</div></div>';$('#fr-details').innerHTML=body;
      for(const b of $('#fr-details').querySelectorAll('[data-jump]'))b.onclick=()=>{const target=N[b.dataset.jump];if(target){section=target.group;$('#fr-section').value=section;fit(section);inspect(target.key);}};
      if(save&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{focus:title},privateContent:{focus:key,government,section,revision:D.revision}}).catch(()=>{});
    }
    $('#fr-current').onclick=()=>{if(mode!=='current')rebuild('current');};$('#fr-proposed').onclick=()=>{if(mode!=='proposed')rebuild('proposed');};
    $('#fr-section').onchange=e=>{section=e.target.value;fit(section);};$('#fr-government').onchange=e=>{government=e.target.value;shade();inspect(selected);};$('#fr-more').onclick=()=>zoom(z*1.25);$('#fr-less').onclick=()=>zoom(z/1.25);$('#fr-fit').onclick=()=>fit(section);$('#fr-native').onclick=()=>{const n=N[selected];z=1;tx=map.clientWidth/2-n.x*96-82;ty=map.clientHeight/2-n.y*130-50;transform();};
    map.addEventListener('pointerdown',e=>{if(e.target.closest('.fr-focus'))return;panning={x:e.clientX,y:e.clientY,tx,ty};map.setPointerCapture(e.pointerId);});map.addEventListener('pointermove',e=>{if(panning){tx=panning.tx+e.clientX-panning.x;ty=panning.ty+e.clientY-panning.y;transform();}});const stop=e=>{panning=null;if(map.hasPointerCapture(e.pointerId))map.releasePointerCapture(e.pointerId);};map.addEventListener('pointerup',stop);map.addEventListener('pointercancel',stop);map.addEventListener('wheel',e=>{e.preventDefault();const b=map.getBoundingClientRect();zoom(z*(e.deltaY<0?1.1:1/1.1),e.clientX-b.left,e.clientY-b.top);},{passive:false});
    rebuild('proposed');new ResizeObserver(()=>fit(section)).observe(map);
    window.francePartyPreview={data:()=>D,pack:PACK,inspect,fit,icon,getView:()=>({mode,selected,government,section,z,tx,ty})};
  })();
  </script>
