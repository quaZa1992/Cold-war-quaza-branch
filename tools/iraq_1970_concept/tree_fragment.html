<div id="coldwar-iraq-concept">
  <section class="irq-window" aria-label="Iraq national focus concept">
    <header class="irq-header"><div><span>IRAQ · 1 JANUARY 1970</span><h2>National Focus</h2></div><span class="irq-status">CONCEPT · AWAITING APPROVAL</span></header>
    <div class="irq-tools">
      <label>Programme <select id="irq-branch" aria-label="Choose programme"></select></label>
      <label>Government view <select id="irq-government" aria-label="Preview current government"><option value="bakr">1970 · al-Bakr / Baath</option><option value="saddam">Saddam / Baath</option><option value="aziz">Aziz Muhammad / ICP</option><option value="civic">Civilian republic · ALT</option><option value="kurds">KDP national cabinet · ALT</option><option value="all">All branches · design view</option></select></label>
      <div class="irq-camera"><button type="button" id="irq-overview">Entire tree</button><button type="button" id="irq-native">100%</button><button type="button" id="irq-fit">Fit branch</button><button type="button" id="irq-minus" aria-label="Zoom out">−</button><span id="irq-zoom">100%</span><button type="button" id="irq-plus" aria-label="Zoom in">+</button></div>
    </div>
    <div id="irq-meta" class="irq-meta"></div>
    <div class="irq-map" id="irq-map" aria-label="Entire focus tree. Drag anywhere to move. Wheel scrolls; Shift scrolls sideways; Control and wheel zoom.">
      <div class="irq-world" id="irq-world"><svg class="irq-links" role="img" aria-label="Prerequisites and exclusive policy choices"></svg></div>
      <div class="irq-map-key">Drag anywhere · Wheel: scroll · Shift: sideways · Ctrl + wheel: zoom · Click: effects</div>
    </div>
    <div class="irq-legend"><span>Solid: prerequisite · Dashed ×: exclusive policy</span><span id="irq-total"></span></div>
    <div class="irq-navigation"><button type="button" id="irq-spirits">Starting Spirits</button><button type="button" id="irq-decisions">Branch Decisions</button><button type="button" id="irq-rules">Government &amp; Programme Rules</button></div>
    <div class="irq-inspector" id="irq-detail" aria-live="polite"></div>
  </section>
</div>
<!-- DESIGN_DATA -->
<style>
#coldwar-iraq-concept{--irq-bg:#222e34;--irq-panel:#354146;--irq-deep:#19272d;--irq-text:#e6e5d6;--irq-muted:#b9c5c7;--irq-gold:#d6c38c;--irq-line:#97aaac;--irq-red:#d9a287;color:var(--irq-text);font-family:Georgia,serif}
#coldwar-iraq-concept *{box-sizing:border-box}
#coldwar-iraq-concept .irq-window{background:var(--irq-bg);border:1px solid #647175;overflow:hidden}
#coldwar-iraq-concept .irq-header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;border-bottom:2px solid #91835a;background:linear-gradient(#485358,#303c42)}
#coldwar-iraq-concept h2{margin:2px 0 0;font-weight:500;color:var(--irq-text)}
#coldwar-iraq-concept .irq-header span{font-family:Arial,sans-serif;color:var(--irq-gold)}
#coldwar-iraq-concept .irq-status{max-width:180px;text-align:right}
#coldwar-iraq-concept .irq-tools{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:12px;background:var(--irq-deep);font-family:Arial,sans-serif}
#coldwar-iraq-concept .irq-tools label{flex:1 1 245px;min-width:0;color:var(--irq-muted)}
#coldwar-iraq-concept select{display:block;width:100%;max-width:100%;margin-top:5px;padding:8px;color:var(--irq-text);background:#35454b;border:1px solid #7f8b85;font:inherit}
#coldwar-iraq-concept button{font:inherit;color:var(--irq-text)}
#coldwar-iraq-concept .irq-camera,#coldwar-iraq-concept .irq-navigation{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:Arial,sans-serif}
#coldwar-iraq-concept .irq-camera{flex-basis:100%}
#coldwar-iraq-concept .irq-camera button,#coldwar-iraq-concept .irq-navigation button{padding:8px 10px;border:1px solid #838d7b;background:linear-gradient(#4d5754,#35433d);border-radius:2px}
#coldwar-iraq-concept .irq-camera button:hover,#coldwar-iraq-concept .irq-navigation button:hover{border-color:var(--irq-gold)}
#coldwar-iraq-concept .irq-meta{padding:10px 14px;min-height:42px;font-family:Arial,sans-serif;color:var(--irq-muted)}
#coldwar-iraq-concept .irq-map{height:590px;position:relative;overflow:hidden;touch-action:none;user-select:none;background:radial-gradient(ellipse at center,#364b53,#19292f);cursor:grab;isolation:isolate}
#coldwar-iraq-concept .irq-map.dragging{cursor:grabbing}
#coldwar-iraq-concept .irq-world{position:absolute;left:0;top:0;transform-origin:0 0}
#coldwar-iraq-concept .irq-links{position:absolute;inset:0;pointer-events:none;overflow:visible}
#coldwar-iraq-concept .irq-links .prerequisite{fill:none;stroke:var(--irq-line);stroke-width:2}
#coldwar-iraq-concept .irq-links .exclusive{fill:none;stroke:var(--irq-red);stroke-width:2;stroke-dasharray:5 4}
#coldwar-iraq-concept .irq-links .choice-cross{fill:var(--irq-red);font-size:18px;text-anchor:middle}
#coldwar-iraq-concept .irq-node{position:absolute;display:block;padding:0;width:165px;height:128px;background:none;border:0;color:var(--irq-text);font-family:Georgia,serif;cursor:inherit}
#coldwar-iraq-concept .irq-icon{position:absolute;left:87.5px;top:20px;transform:translate(-50%,-50%);pointer-events:none}
#coldwar-iraq-concept .irq-titlebar{position:absolute;left:5px;top:40px;width:164px;height:50px;pointer-events:none}
#coldwar-iraq-concept .irq-title{position:absolute;left:15px;top:58px;width:147px;height:20px;line-height:20px;white-space:nowrap;overflow:hidden;pointer-events:none;font-size:14px;color:var(--irq-text)}
#coldwar-iraq-concept .irq-title canvas{display:block;width:147px;height:20px}
#coldwar-iraq-concept .irq-node[aria-pressed="true"] .irq-icon{filter:drop-shadow(0 0 5px #e4d696)}
#coldwar-iraq-concept .irq-node[aria-pressed="true"] .irq-title{color:#fff0b0}
#coldwar-iraq-concept .irq-node.is-locked .irq-icon{filter:grayscale(.65) brightness(.65)}
#coldwar-iraq-concept .irq-group-label{position:absolute;font-weight:500;text-align:center;width:600px;color:var(--irq-gold);pointer-events:none}
#coldwar-iraq-concept .irq-world.overview .irq-title{visibility:hidden}
#coldwar-iraq-concept .irq-map-key{position:absolute;bottom:10px;left:10px;right:10px;width:fit-content;max-width:calc(100% - 20px);background:#19272deb;padding:6px 9px;font-family:Arial,sans-serif;color:var(--irq-muted);pointer-events:none}
#coldwar-iraq-concept .irq-legend{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--irq-deep);font-family:Arial,sans-serif;color:var(--irq-muted)}
#coldwar-iraq-concept .irq-navigation{padding:10px 14px;background:var(--irq-deep);border-top:1px solid #58676b}
#coldwar-iraq-concept .irq-inspector{padding:18px;background:var(--irq-panel);overflow-wrap:anywhere;font-family:Arial,sans-serif}
#coldwar-iraq-concept .irq-inspector h3{font-family:Georgia,serif;font-weight:500;color:var(--irq-gold);margin:0 0 8px}
#coldwar-iraq-concept .irq-inspector h4{font-weight:500;margin-bottom:6px}
#coldwar-iraq-concept .irq-inspector p{margin:8px 0}
#coldwar-iraq-concept .irq-inspector li{margin:5px 0}
#coldwar-iraq-concept .irq-inspector details{margin-top:12px}
#coldwar-iraq-concept pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--irq-deep);padding:12px;color:var(--irq-text)}
#coldwar-iraq-concept .irq-spirit{padding:12px 0;border-bottom:1px solid #6a7779}
#coldwar-iraq-concept .irq-branch-index{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#coldwar-iraq-concept .irq-branch-index button{border:1px solid #7d8981;background:var(--irq-deep);padding:6px 8px;font-family:Arial,sans-serif}
@media(max-width:500px){#coldwar-iraq-concept .irq-header{padding:12px;gap:10px}#coldwar-iraq-concept .irq-status{max-width:130px}#coldwar-iraq-concept .irq-map{height:510px}#coldwar-iraq-concept select{font-size:16px}#coldwar-iraq-concept .irq-camera button,#coldwar-iraq-concept .irq-navigation button{min-height:44px}#coldwar-iraq-concept .irq-inspector{padding:12px}}
</style>
<script>
(()=>{
 const root=document.getElementById('coldwar-iraq-concept');
 const data=JSON.parse(document.getElementById('irq-data').textContent);
 const map=root.querySelector('#irq-map'),world=root.querySelector('#irq-world'),svg=root.querySelector('.irq-links');
 const select=root.querySelector('#irq-branch'),government=root.querySelector('#irq-government'),detail=root.querySelector('#irq-detail'),meta=root.querySelector('#irq-meta');
 const nodes=new Map(data.nodes.map(n=>[n.id,n])),groups=new Map(data.groups.map(g=>[g.id,g]));
 for(const n of data.nodes){n.ownership=groups.get(n.group).ownership;n.active_condition??=n.available;}
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pos=n=>({x:n.xy[0]*96,y:n.xy[1]*130});
 let current='iran_war',picked='COLDWAR_IRQ_iran_arabistan_claim',mode='tree',camera={x:0,y:0,z:1},drag=null,cameraMode='native',suppressClickUntil=0,wheelSave;
 const sections=[['shared','National development'],['nationalist','Nationalist programmes'],['emerging','Emerging programmes'],['nonaligned','Non-Aligned programmes'],['western','Western programmes']];
 for(const [id,title] of sections){const optgroup=document.createElement('optgroup');optgroup.label=title;for(const g of data.groups.filter(g=>g.outlook===id)){const o=document.createElement('option');o.value=g.id;o.textContent=g.label;optgroup.append(o);}select.append(optgroup);}
 function svgEl(tag,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);return el;}
 const width=Math.max(...data.nodes.map(n=>pos(n).x))+350,height=Math.max(...data.nodes.map(n=>pos(n).y))+220;
 world.style.width=width+'px';world.style.height=height+'px';svg.setAttribute('width',width);svg.setAttribute('height',height);
 for(const n of data.nodes){const p=pos(n);for(const row of n.prerequisites)for(const id of row){const q=pos(nodes.get(id)),x1=q.x+80,y1=q.y+90,x2=p.x+80,y2=p.y-26,mid=(y1+y2)/2;const line=svgEl('path',{class:'prerequisite',d:`M${x1},${y1} V${mid} H${x2} V${y2}`});line.dataset.from=id;line.dataset.to=n.id;svg.append(line);}
  for(const id of n.mutually_exclusive){if(id<n.id)continue;const q=pos(nodes.get(id)),x1=Math.min(p.x,q.x)+139,x2=Math.max(p.x,q.x)+27,y=p.y+20;svg.append(svgEl('path',{class:'exclusive',d:`M${x1},${y} H${x2}`}));const t=svgEl('text',{class:'choice-cross',x:(x1+x2)/2,y:y-5});t.textContent='×';svg.append(t);}
  const b=document.createElement('button');b.type='button';b.className='irq-node cursor-interaction';b.dataset.node=n.id;b.setAttribute('aria-label',n.title);b.setAttribute('data-tooltip',n.title);b.setAttribute('aria-pressed','false');b.style.left=p.x+'px';b.style.top=p.y+'px';b.innerHTML=`<img class="irq-icon" src="${data.assets.icons[n.icon]}" alt=""><img class="irq-titlebar" src="${data.assets.unavailable}" alt=""><span class="irq-title">${esc(n.title)}</span>`;world.append(b);
 }
 for(const g of data.groups){const list=data.nodes.filter(n=>n.group===g.id),xs=list.map(n=>pos(n).x),ys=list.map(n=>pos(n).y);const label=document.createElement('div');label.className='irq-group-label';label.textContent=g.label;label.style.left=((Math.min(...xs)+Math.max(...xs))/2+82-300)+'px';label.style.top=(Math.min(...ys)-90)+'px';world.append(label);}
 const atlas=new Image();atlas.onload=()=>{for(const b of world.querySelectorAll('.irq-node')){const n=nodes.get(b.dataset.node),canvas=document.createElement('canvas');canvas.width=147;canvas.height=20;canvas.setAttribute('aria-hidden','true');const ctx=canvas.getContext('2d'),chars=[...n.title],glyphs=data.assets.font_glyphs,kern=data.assets.font_kernings;const total=chars.reduce((s,c,i)=>s+(glyphs[c.codePointAt(0)]||glyphs[63])[6]+(i?(kern[chars[i-1].codePointAt(0)+','+c.codePointAt(0)]||0):0),0);let x=Math.floor((147-total)/2),previous=null;for(const c of chars){const cp=c.codePointAt(0),g=glyphs[cp]||glyphs[63];x+=kern[previous+','+cp]||0;ctx.drawImage(atlas,g[0],g[1],g[2],g[3],x+g[4],2+g[5],g[2],g[3]);x+=g[6];previous=cp;}b.querySelector('.irq-title').replaceChildren(canvas);}};atlas.src=data.assets.font_atlas;
 const activeGroups={bakr:['state','baath','bakr'],saddam:['state','baath','saddam'],aziz:['state','communists','aziz'],civic:['state','civic'],kurds:['state','kurds']};
 for(const g of data.groups.filter(g=>g.outlook!=='shared'&&!['baath','communists'].includes(g.id))){if(![...government.options].some(o=>o.value===g.id)){const o=document.createElement('option');o.value=g.id;o.textContent=g.label+' · ALT government';government.append(o);}if(!activeGroups[g.id])activeGroups[g.id]=['state',g.id];}
 function available(n){return government.value==='all'||groups.get(n.group).outlook==='shared'||(activeGroups[government.value]||[]).includes(n.group);}
 function paintGovernment(){for(const b of world.querySelectorAll('.irq-node')){const n=nodes.get(b.dataset.node),ok=available(n);b.classList.toggle('is-locked',!ok);b.querySelector('.irq-titlebar').src=ok?data.assets.available:data.assets.unavailable;}root.querySelector('#irq-total').textContent=`${data.nodes.length} focuses · ${data.decisions.length} decisions · 7 starting spirits`;}
 function transform(){world.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.z})`;world.classList.toggle('overview',camera.z<.65);root.querySelector('#irq-zoom').textContent=Math.round(camera.z*100)+'%';}
 function bounds(all=false){const list=all?data.nodes:data.nodes.filter(n=>n.group===current),ps=list.map(pos);return{left:Math.min(...ps.map(p=>p.x))-25,top:Math.min(...ps.map(p=>p.y))-100,right:Math.max(...ps.map(p=>p.x))+195,bottom:Math.max(...ps.map(p=>p.y))+140};}
 function fit(all=false,native=false){cameraMode=all?'overview':native?'native':'fit';const b=bounds(all),w=map.clientWidth,h=map.clientHeight-root.querySelector('.irq-map-key').offsetHeight-18;camera.z=native?1:Math.min(1,(w-30)/(b.right-b.left),(h-30)/(b.bottom-b.top));camera.x=(w-(b.right-b.left)*camera.z)/2-b.left*camera.z;camera.y=native?45-b.top:(h-(b.bottom-b.top)*camera.z)/2-b.top*camera.z;transform();}
 function zoom(f,cx=map.clientWidth/2,cy=map.clientHeight/2){cameraMode='manual';const z=Math.max(.04,Math.min(1.6,camera.z*f));camera.x=cx-(cx-camera.x)*z/camera.z;camera.y=cy-(cy-camera.y)*z/camera.z;camera.z=z;transform();}
 function state(){return{modelContent:{country:'Iraq1970',selectedProgramme:groups.get(current)?.label,selectedFocus:nodes.get(picked)?.title,government:government.value,view:mode},privateContent:{version:5,current,picked,government:government.value,mode,camera:{...camera},cameraMode}};}
 function remember(){window.openai?.setWidgetState?.(state()).catch(()=>{});}
 function pick(n){picked=n.id;for(const b of world.querySelectorAll('.irq-node'))b.setAttribute('aria-pressed',String(b.dataset.node===picked));
  const pre=n.prerequisites.map(row=>row.map(id=>nodes.get(id).title).join(' OR ')).join(' AND ')||'Entry focus — no redundant party unlock';
  detail.innerHTML=`<h3>${esc(n.title)}</h3><p>${n.days} days · x=${n.xy[0]}, y=${n.xy[1]} · ${esc(n.historical_status)}</p><p>${esc(n.description)}</p><p>Prerequisite: ${esc(pre)}</p>${n.mutually_exclusive.length?`<p>Exclusive with: ${esc(n.mutually_exclusive.map(id=>nodes.get(id).title).join(' / '))}</p>`:''}<h4>Proposed effects and costs</h4><ul>${n.reward_summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${n.modifiers.stability_factor>0?'<p>Positive stability is a package contribution: min(total positive policy contributions, +15%) + all negative policy contributions. Starting situation penalties remain separate.</p>':''}<p>Ownership: ${esc(n.ownership)}</p><details><summary>Party, leader and delivery conditions</summary><pre>${esc(n.available)}</pre>${n.requirement_contracts.map(r=>`<p>${esc(r.meaning)}</p><pre>${esc(r.proposed_code)}</pre>`).join('')}<p>Active modifier condition:</p><pre>${esc(n.active_condition)}</pre></details><details><summary>Native effect body and proposed integration</summary><pre>${esc(n.effect_body)}</pre><p>Runs once, after current eligibility, the frozen GDP invoice and native building-capacity checks pass. Unfunded completion becomes pending. New COLDWAR_IRQ helpers and condition providers are proposed integration, not existing MD APIs.</p>${Object.keys(n.modifiers).length?`<pre>${esc(Object.entries(n.modifiers).map(([k,v])=>`${k} = ${v}`).join('\n'))}</pre>`:''}</details>`;
 }
 function branch(native=true){mode='tree';select.value=current;const g=groups.get(current),list=data.nodes.filter(n=>n.group===current);meta.textContent=`${g.label} · ${list.length} focuses · ${g.outlook==='shared'?'National programme':'Governing-party / office programme'}${available(list[0])?'':' · Unavailable in this government view'}`;pick(nodes.get(picked)?.group===current?nodes.get(picked):list[0]);fit(false,native);}
 function overview(){mode='overview';meta.textContent=`Entire tree · Two horizontal tiers · ${data.groups.length} programme areas · Native grid 96 × 130`;fit(true);detail.innerHTML='<h3>The Complete Iraqi Programme</h3><div class="irq-branch-index">'+data.groups.map(g=>`<button type="button" data-group="${g.id}">${esc(g.label)}</button>`).join('')+'</div>';}
 function showSpirits(){mode='spirits';detail.innerHTML='<h3>Starting Situation · January 1970</h3>'+data.starting_spirits.map(s=>`<article class="irq-spirit"><h4>${esc(s.label)}</h4><p>${esc(s.description)}</p><ul>${Object.entries(s.modifiers).map(([k,v])=>`<li>${esc(data.modifier_labels[k][0])}: ${v>0?'+':''}${(v*100).toFixed(0)}%</li>`).join('')}${Object.entries(s.native_consequences||{}).map(([k,v])=>`<li>${esc(k)}: ${esc(v)}</li>`).join('')}</ul>${s.native_system?`<p>${esc(s.native_system)}</p>`:''}<p>${esc(s.treatment)}</p></article>`).join('');}
 function showDecisions(){mode='decisions';const list=data.decisions.filter(d=>d.group===current);detail.innerHTML=`<h3>${esc(groups.get(current).label)} · Decisions</h3>`+list.map(d=>`<details open><summary>${esc(d.label)} · ${d.pp} PP · ${d.days} days</summary><p>${esc(d.summary)}</p><p>Unlock: ${esc(nodes.get(d.unlock)?.title||'Available from start')}</p>${d.effect_code?`<pre>${esc(d.effect_code)}</pre>`:''}</details>`).join('');}
 function rules(){mode='rules';detail.innerHTML='<h3>Government and Programme Rules</h3><ul>'+Object.values(data.programme_rules).filter(v=>typeof v==='string').map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul><p>Native source-verified: modifier keys, money/literacy effects, construction and political refresh patterns. Proposed: historical roster extensions, leadership bridges, project/contract decisions and all numeric balance. Native focus typography uses the inherited UbuntuBold16 bitmap atlas. Browser approximations remain connector routing, glows and availability. The programme selector changes the camera, never focus coordinates.</p>';}
 root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.node){const n=nodes.get(b.dataset.node);current=n.group;select.value=current;mode='tree';pick(n);}else if(b.dataset.group){current=b.dataset.group;picked='';branch();}else if(b.id==='irq-overview')overview();else if(b.id==='irq-native'){branch(true);}else if(b.id==='irq-fit'){branch(false);}else if(b.id==='irq-minus')zoom(1/1.2);else if(b.id==='irq-plus')zoom(1.2);else if(b.id==='irq-spirits')showSpirits();else if(b.id==='irq-decisions')showDecisions();else if(b.id==='irq-rules')rules();remember();});
 select.addEventListener('change',()=>{current=select.value;picked='';branch();remember();});government.addEventListener('change',()=>{paintGovernment();if(mode==='tree')branch();remember();});
 map.addEventListener('wheel',ev=>{ev.preventDefault();ev.stopPropagation();const r=map.getBoundingClientRect();if(ev.ctrlKey||ev.metaKey){if(ev.deltaY)zoom(Math.exp(-ev.deltaY*.002),ev.clientX-r.left,ev.clientY-r.top);}else{const unit=ev.deltaMode===1?16:ev.deltaMode===2?map.clientHeight:1;cameraMode='manual';camera.x-=(ev.shiftKey?ev.deltaX+ev.deltaY:ev.deltaX)*unit;camera.y-=ev.shiftKey?0:ev.deltaY*unit;transform();}clearTimeout(wheelSave);wheelSave=setTimeout(remember,180);},{passive:false});
 map.addEventListener('pointerdown',ev=>{if(!ev.isPrimary||![0,1,2].includes(ev.button))return;suppressClickUntil=0;drag={x:ev.clientX,y:ev.clientY,cx:camera.x,cy:camera.y,id:ev.pointerId,moved:false};if(ev.button!==0)ev.preventDefault();});
 map.addEventListener('pointermove',ev=>{if(!drag||ev.pointerId!==drag.id)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<5)return;if(!drag.moved){drag.moved=true;map.setPointerCapture(ev.pointerId);map.classList.add('dragging');}ev.preventDefault();cameraMode='manual';camera.x=drag.cx+dx;camera.y=drag.cy+dy;transform();});
 function stop(ev){if(!drag||ev.pointerId!==drag.id)return;const done=drag;drag=null;if(map.hasPointerCapture(done.id))map.releasePointerCapture(done.id);map.classList.remove('dragging');if(done.moved){suppressClickUntil=performance.now()+400;remember();}}
 map.addEventListener('pointerup',stop);map.addEventListener('pointercancel',stop);map.addEventListener('lostpointercapture',ev=>{if(drag?.id===ev.pointerId)stop(ev);});
 map.addEventListener('click',ev=>{if(ev.detail&&performance.now()<suppressClickUntil){ev.preventDefault();ev.stopImmediatePropagation();}},true);
 map.addEventListener('contextmenu',ev=>ev.preventDefault());map.addEventListener('dragstart',ev=>ev.preventDefault());
 root.addEventListener('keydown',ev=>{if(['SELECT','INPUT','TEXTAREA'].includes(ev.target.tagName))return;const d={ArrowLeft:[80,0],ArrowRight:[-80,0],ArrowUp:[0,80],ArrowDown:[0,-80]}[ev.key];if(d){ev.preventDefault();cameraMode='manual';camera.x+=d[0];camera.y+=d[1];transform();remember();}});
 world.addEventListener('focusin',ev=>{if(drag)return;const n=nodes.get(ev.target.dataset.node);if(!n)return;const p=pos(n),x=p.x*camera.z+camera.x,y=p.y*camera.z+camera.y;if(x<0||x+165*camera.z>map.clientWidth||y<0||y+128*camera.z>map.clientHeight){cameraMode='manual';camera.x=map.clientWidth/2-(p.x+82)*camera.z;camera.y=map.clientHeight/2-(p.y+50)*camera.z;transform();}});
 function restore(value){if(drag)return;const s=value?.privateContent;if([4,5].includes(s?.version)&&groups.has(s.current)){current=s.current;picked=nodes.has(s.picked)?s.picked:'';government.value=s.government||'saddam';paintGovernment();branch();if(s.mode==='overview')overview();else if(s.mode==='spirits')showSpirits();else if(s.mode==='decisions')showDecisions();else if(s.mode==='rules')rules();if(s.camera&&[s.camera.x,s.camera.y,s.camera.z].every(Number.isFinite)){camera={...s.camera};cameraMode=s.cameraMode||'manual';transform();}}else{government.value='saddam';paintGovernment();branch();}}
 window.addEventListener('openai:set_globals',ev=>restore(ev.detail?.globals?.widgetState));let measured=map.clientWidth;new ResizeObserver(()=>{const next=map.clientWidth;if(Math.abs(next-measured)>3){const change=next-measured;measured=next;if(cameraMode==='overview')fit(true);else if(cameraMode==='fit')fit(false);else{camera.x+=change/2;transform();}}}).observe(map);restore(window.openai?.widgetState);
})();
</script>
