<div id="isr-runtime">
  <section class="v2-window" aria-label="Israel 1970 native runtime source reconstruction">
    <header class="v2-header">
      <div><span class="v2-country">ISRAEL · JANUARY 1970</span><h2>National Focus</h2></div>
      <div class="v2-version"><span id="isr-runtime-version-number">VERSION 2.2</span><span>Runtime source reconstruction</span></div>

<style>
#isr-runtime{--v2-bg:#23353c;--v2-panel:#2d3d43;--v2-deep:#17272e;--v2-heading:#d8c689;--v2-text:#e7e7da;--v2-muted:#b6c2c4;--v2-line:#9eafb0;--v2-border:#5e7074;--v2-gain:#b7d8a9;--v2-cost:#e8ad98;--v2-selected:#4a5547;color:var(--v2-text);font:14px/1.45 Arial,sans-serif;}
#isr-runtime *{box-sizing:border-box;}
#isr-runtime .v2-window{background:var(--v2-bg);border:1px solid #788482;box-shadow:inset 0 0 0 3px #16262c;overflow:hidden;}
#isr-runtime .v2-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 110px 15px 21px;background:linear-gradient(#465659,#2b3d43);border-bottom:2px solid #998552;}
#isr-runtime .v2-country{display:block;color:var(--v2-muted);font:11px/1.5 Arial,sans-serif;letter-spacing:1.6px;}
#isr-runtime h2{margin:3px 0 0;font:500 24px/1.15 Georgia,serif;color:var(--v2-text);}
#isr-runtime .v2-version{color:var(--v2-heading);font:500 13px/1.4 Georgia,serif;text-align:right;}
#isr-runtime .v2-version span{display:block;color:var(--v2-muted);font:11px/1.5 Arial,sans-serif;}
#isr-runtime .v2-version #isr-runtime-version-number{color:var(--v2-heading);font:500 13px/1.4 Georgia,serif;}
#isr-runtime .v2-toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;padding:11px 16px;background:var(--v2-deep);border-bottom:1px solid var(--v2-border);}
#isr-runtime .v2-toolbar label{display:block;flex:1 1 240px;min-width:0;color:var(--v2-muted);font:12px/1.4 Arial,sans-serif;}
#isr-runtime select{display:block;width:100%;max-width:100%;margin-top:4px;padding:8px 29px 8px 9px;background:#35484e;color:var(--v2-text);border:1px solid #818c7e;border-radius:2px;font:14px/1.3 Arial,sans-serif;}
#isr-runtime button{font-family:inherit;}
#isr-runtime .v2-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
#isr-runtime .v2-actions button,#isr-runtime .v2-legend button{padding:8px 10px;border:1px solid #8d927b;border-radius:2px;background:linear-gradient(#4a5751,#303e39);color:var(--v2-text);font:12px/1.3 Arial,sans-serif;white-space:nowrap;}
#isr-runtime .v2-actions button:hover,#isr-runtime .v2-legend button:hover{border-color:var(--v2-heading);background:#4e5c4e;}
#isr-runtime .v2-actions button[aria-pressed="true"]{border-color:var(--v2-heading);color:var(--v2-heading);}
#isr-runtime .v2-actions .v2-zoom{min-width:32px;}
#isr-runtime output{min-width:42px;color:var(--v2-heading);text-align:center;font-variant-numeric:tabular-nums;font-size:12px;}
#isr-runtime .v2-location{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 17px 11px;min-height:67px;background:#263b43;border-bottom:1px solid #445e65;}
#isr-runtime .v2-location div{min-width:0;}
#isr-runtime .v2-location div>span{display:block;text-transform:uppercase;letter-spacing:1.2px;font-size:10px;color:var(--v2-muted);}
#isr-runtime .v2-location strong{display:block;font:500 18px/1.3 Georgia,serif;color:var(--v2-heading);}
#isr-runtime .v2-location p{margin:3px 0 0;font:12px/1.4 Arial,sans-serif;color:var(--v2-muted);}
#isr-runtime #isr-runtime-count{color:var(--v2-muted);font-size:11px;text-align:right;flex:0 0 auto;}
#isr-runtime .v2-content{display:grid;grid-template-columns:minmax(0,1fr) 315px;align-items:stretch;}
#isr-runtime .v2-map-column{min-width:0;}
#isr-runtime .v2-viewport{height:760px;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(ellipse at 42% 30%,#354e58,#20353d 70%,#1b3038);isolation:isolate;}
#isr-runtime .v2-viewport.is-dragging{cursor:grabbing;}
#isr-runtime .v2-world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
#isr-runtime .v2-connections{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
#isr-runtime .v2-edge{fill:none;stroke:var(--v2-line);stroke-width:1.6;opacity:.78;}
#isr-runtime .v2-edge.is-related{stroke:var(--v2-heading);stroke-width:2.4;opacity:1;}
#isr-runtime .v2-exclusive{fill:none;stroke:var(--v2-cost);stroke-width:1.7;stroke-dasharray:5 4;}
#isr-runtime .v2-exclusive-mark{fill:var(--v2-cost);font:500 21px/1 Georgia,serif;text-anchor:middle;}
#isr-runtime .v2-focus{position:absolute;width:165px;height:128px;display:block;padding:0;border:0;background:transparent;text-align:center;color:var(--v2-text);}

@media(max-width:850px){#isr-runtime .v2-content{grid-template-columns:minmax(0,1fr);}#isr-runtime .v2-inspector{border-left:0;border-top:1px solid #657476;min-height:0;}#isr-runtime .v2-viewport{height:760px;}#isr-runtime .v2-inspector h3{font-size:21px;}}
@media(max-width:480px){#isr-runtime .v2-header{padding:13px 97px 14px 12px;align-items:start;gap:9px;flex-direction:column;}#isr-runtime h2{font-size:23px;}#isr-runtime .v2-version{text-align:left;font-size:12px;}#isr-runtime .v2-version span{font-size:11px;}#isr-runtime .v2-toolbar{padding:10px;gap:9px;}#isr-runtime .v2-toolbar label{flex-basis:100%;}#isr-runtime select{font-size:16px;}#isr-runtime .v2-actions{gap:5px;}#isr-runtime .v2-actions button{padding:8px 8px;font-size:12px;}#isr-runtime .v2-location{padding:10px;gap:10px;}#isr-runtime .v2-location strong{font-size:17px;}#isr-runtime #isr-runtime-count{max-width:70px;font-size:11px;}#isr-runtime .v2-viewport{height:570px;}#isr-runtime #isr-runtime-map-status{display:none;}#isr-runtime .v2-inspector{padding:15px 13px 20px;}#isr-runtime .v2-overview-labels{display:none;}#isr-runtime .v2-legend{gap:10px;padding:9px 10px;}#isr-runtime .v2-legend button{margin-left:0;}}
@media(pointer:coarse){#isr-runtime .v2-actions button,#isr-runtime .v2-legend button,#isr-runtime .v2-depth-controls button,#isr-runtime .v2-overview-labels button,#isr-runtime .v2-overview-list button{min-height:44px;}#isr-runtime select{min-height:44px;}}
@media(max-width:480px){#isr-runtime #isr-runtime-map-status{display:inline;}#isr-runtime .v2-map-footer{padding:7px 10px;gap:6px 10px;}#isr-runtime .v2-depth-controls{width:100%;}}
@media(prefers-reduced-motion:no-preference){#isr-runtime .v2-focus img{transition:filter .15s;}#isr-runtime .v2-focus .v2-focus-name{transition:background .15s,border-color .15s;}}
</style>
<script>
(() => {
  const root = document.getElementById('isr-runtime');
  const data = JSON.parse(document.getElementById('isr-runtime-data').textContent);
  const select = root.querySelector('#isr-runtime-branch');
  const viewport = root.querySelector('#isr-runtime-view');

  const svg = world.querySelector('.v2-connections');

  const nodes = new Map(data.nodes.map(node => [node.id, node]));
  const groups = new Map(data.groups.map(group => [group.id, group]));
  const sources = new Map((data.sources || []).map(source => [source.id, source]));
  const positions = new Map(data.nodes.map(node => [node.id, {x:node.xy[0]*data.layout.x_unit, y:node.xy[1]*data.layout.y_unit}]));
  const minimumX = Math.min(...[...positions.values()].map(p => p.x));
  const minimumY = Math.min(...[...positions.values()].map(p => p.y));
  const shift = {x:minimumX < 50 ? 70-minimumX : 0, y:minimumY < 80 ? 100-minimumY : 0};
  for (const position of positions.values()) {position.x += shift.x; position.y += shift.y;}
  const bounds = {width:Math.max(...[...positions.values()].map(p => p.x))+230, height:Math.max(...[...positions.values()].map(p => p.y))+230};
  const groupBounds = new Map();
  const elementById = new Map();
  const version = data.version || /^(\d+\.\d+)/.exec(String(data.revision))?.[1] || '2.2';
  root.querySelector('#isr-runtime-version-number').textContent='VERSION '+version;
  const initialFocus=nodes.get(data.default_focus) || data.nodes.find(node=>node.group==='gahal') || data.nodes[0];
  let current = initialFocus.group;
  let picked = initialFocus.id;
  let mode = 'tree';
  let camera = {x:0,y:0,z:1};
  let drag = null;
  let ignoreClickUntil = 0;
  let keyboardNavigation = false;
  const instanceId = Date.now().toString(36)+Math.random().toString(36).slice(2);
  const escape = value => String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
  const nodeName = id => nodes.get(id)?.label || id;
  const svgEl = (name, attributes) => {
    const element = document.createElementNS('http://www.w3.org/2000/svg',name);

    return element;
  };
  function routeEdge(source,target) {
    const start=positions.get(source),end=positions.get(target);

    const middle=(y1+y2)/2;
    return [[x1,y1],[x1,middle],[x2,middle],[x2,y2]];
  }
  function routePath(points) {
    return points.map(([x,y],index)=>index===0?`M${x},${y}`:points[index-1][0]===x?`V${y}`:`H${x}`).join(' ');
  }
  const nationalOptions = document.createElement('optgroup');nationalOptions.label = 'National institutions and strategy';
  const partyOptions = document.createElement('optgroup');partyOptions.label = 'Political programmes';
  for (const group of data.groups) {
    const option = document.createElement('option'); option.value=group.id;option.textContent=group.label;
    (group.kind === 'party' ? partyOptions : nationalOptions).append(option);
    const list = data.nodes.filter(node => node.group === group.id).map(node => positions.get(node.id));
    if (!list.length) continue;
    groupBounds.set(group.id,{left:Math.min(...list.map(p=>p.x))-12, right:Math.max(...list.map(p=>p.x))+177, top:Math.min(...list.map(p=>p.y))-16, bottom:Math.max(...list.map(p=>p.y))+140});
  }
  if(nationalOptions.children.length)select.append(nationalOptions);
  if(partyOptions.children.length)select.append(partyOptions);
  world.style.width=bounds.width+'px';world.style.height=bounds.height+'px';
  svg.setAttribute('width',bounds.width);svg.setAttribute('height',bounds.height);
  svg.setAttribute('viewBox',`0 0 ${bounds.width} ${bounds.height}`);
  const defs=svgEl('defs',{});
  const marker=svgEl('marker',{id:'isr-runtime-arrow',viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:5,markerHeight:5,orient:'auto-start-reverse'});
  marker.append(svgEl('path',{d:'M0 1 L9 5 L0 9',fill:'none',stroke:'#9eafb0','stroke-width':1.5}));defs.append(marker);svg.append(defs);
  for (const node of data.nodes) {
    const end=positions.get(node.id);
    for (const row of node.pre || []) for (const predecessor of row) {
      const start=positions.get(predecessor);if(!start)continue;
      const points=routeEdge(predecessor,node.id);
      const edge=svgEl('path',{class:'v2-edge',d:routePath(points),'marker-end':'url(#isr-runtime-arrow)'});
      edge.dataset.from=predecessor;edge.dataset.to=node.id;edge.dataset.points=JSON.stringify(points);svg.append(edge);
    }
    for(const id of node.exclusive || []) {
      if(id < node.id)continue;
      const other=positions.get(id);if(!other || Math.abs(other.y-end.y)>.1)continue;
      const left=Math.min(end.x,other.x)+119,right=Math.max(end.x,other.x)+29,y=end.y+37;
      svg.append(svgEl('path',{class:'v2-exclusive',d:`M${left},${y} H${right}`}));
      const mark=svgEl('text',{class:'v2-exclusive-mark',x:(left+right)/2,y:y-8});mark.textContent='×';svg.append(mark);
    }
  }
  for(const group of data.groups) {
    const footprint=groupBounds.get(group.id);if(!footprint)continue;
    const frame=document.createElement('div');frame.className='v2-group-footprint';frame.dataset.group=group.id;
    frame.style.left=footprint.left+'px';frame.style.top=footprint.top+'px';frame.style.width=(footprint.right-footprint.left)+'px';frame.style.height=(footprint.bottom-footprint.top)+'px';frame.hidden=true;world.append(frame);
    const label=document.createElement('div');label.className='v2-group-label';label.textContent=group.label;
    label.style.left=((footprint.left+footprint.right)/2-220)+'px';label.style.top=(footprint.top+8)+'px';world.append(label);
  }
  for(const node of data.nodes) {
    const p=positions.get(node.id);const button=document.createElement('button');
    button.type='button';button.className='v2-focus cursor-interaction';button.dataset.node=node.id;
    button.setAttribute('aria-label',node.label);button.setAttribute('data-tooltip',node.label+' · '+node.days+' days');button.setAttribute('aria-pressed','false');
    button.style.left=p.x+'px';button.style.top=p.y+'px';
    button.innerHTML=`<img src="${escape(data.layout.icons[node.icon] || '')}" alt=""><span class="v2-focus-name">${escape(node.label)}</span>`;
    elementById.set(node.id,button);world.append(button);
  }
  function updateOverviewLabels() {
    overviewLabels.replaceChildren();
    if(mode!=='overview')return;
    const placed=[];
    for(const group of data.groups) {
      const box=groupBounds.get(group.id);if(!box)continue;
      const button=document.createElement('button');button.type='button';button.className='cursor-interaction';button.dataset.group=group.id;
      const shortLabels={institutions:'The Republic',capital:'Capital',absorption:'People and Skills',water:'Water and Negev',reserves:'The Reserve Army',arsenal:'The Arsenal',diplomacy:'Diplomacy',territories:'Territories',alignment:'Alignment',gahal:'Gahal',mafdal:'Mafdal',orthodox:'Orthodox Parties',liberals:'Ind. Liberals',haolam:'HaOlam HaZeh',rakah:'Rakah',state_list:'State List',mapam:'Mapam',maki:'Maki',free_center:'Free Center'};
      const labelOffset=0;
      button.textContent=shortLabels[group.id] || group.label;button.setAttribute('aria-label',group.label);button.setAttribute('data-tooltip',group.label);
      const width=Math.max(58,Math.min(104,(box.right-box.left)*camera.z-8));
      const x=Math.max(width/2+5,Math.min(viewport.clientWidth-width/2-5,camera.x+(box.left+box.right)*.5*camera.z));
      button.style.width=width+'px';button.style.minHeight='27px';overviewLabels.append(button);
      const height=button.offsetHeight;
      const desired=camera.y+box.top*camera.z-16;
      let y=Math.max(18,Math.min(viewport.clientHeight-mapFooter.offsetHeight-20,desired));
      for(let step=0;step<50;step++){
        const candidate=desired+(step%2===0?1:-1)*Math.ceil(step/2)*30;
        if(candidate<height/2+3 || candidate>viewport.clientHeight-mapFooter.offsetHeight-height/2-3)continue;
        if(!placed.some(p=>Math.abs(p.x-x)<(p.width+width)/2+3 && Math.abs(p.y-candidate)<(p.height+height)/2+3)){y=candidate;break;}
      }
      placed.push({x,y,width,height});button.style.width=width+'px';button.style.minHeight='27px';button.style.left=x+'px';button.style.top=y+'px';
      overviewLabels.append(button);
    }
  }
  function updateDepthNavigation() {
    if(mode!=='tree') {
      nextRowButton.hidden=true;backTopButton.hidden=true;
      root.querySelector('#isr-runtime-map-status').textContent=mode==='overview'?'Select any programme':'All programmes inspectable';
      return;
    }
    const branchNodes=data.nodes.filter(node=>node.group===current);
    for(let pass=0;pass<3;pass++) {
      const bottom=viewport.clientHeight-mapFooter.offsetHeight-2;
      const below=branchNodes.filter(node=>positions.get(node.id).y*camera.z+camera.y+128*camera.z>bottom);
      const above=branchNodes.some(node=>positions.get(node.id).y*camera.z+camera.y<10);
      const openingY=22-groupBounds.get(current).top*camera.z;
      nextRowButton.hidden=below.length===0;backTopButton.hidden=!(above || Math.abs(camera.y-openingY)>1);
      root.querySelector('#isr-runtime-map-status').textContent=below.length?`${below.length} further ${below.length===1?'focus':'focuses'} below`:above?'End of programme':'All branch rows in view';
    }
  }
  function continueDownward() {
    if(mode!=='tree')return;
    const bottom=viewport.clientHeight-mapFooter.offsetHeight-2;
    const nextNodes=data.nodes.filter(node=>node.group===current && positions.get(node.id).y*camera.z+camera.y+128*camera.z>bottom);
    if(!nextNodes.length)return;
    const nextY=Math.min(...nextNodes.map(node=>positions.get(node.id).y));
    const box=groupBounds.get(current);
    const lastBottom=Math.max(...data.nodes.filter(node=>node.group===current).map(node=>positions.get(node.id).y+128));
    const terminalY=viewport.clientHeight-mapFooter.offsetHeight-12-lastBottom*camera.z;
    camera.x=(viewport.clientWidth-(box.right-box.left)*camera.z)/2-box.left*camera.z;
    camera.y=Math.max(24-nextY*camera.z,terminalY);
    applyCamera();
  }
  function applyCamera() {
    world.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.z})`;
    world.classList.toggle('is-overview',mode==='overview');
    world.classList.toggle('is-distant',camera.z<.73);
    root.querySelector('#isr-runtime-zoom').textContent=Math.round(camera.z*100)+'%';
    updateOverviewLabels();
    updateDepthNavigation();
  }
  function remember() {
    if(!window.openai?.setWidgetState)return;
    window.openai.setWidgetState({modelContent:{version,selectedBranch:groups.get(current)?.label,selectedFocus:nodes.get(picked)?.label,mode},privateContent:{revision:data.revision,instanceId,current,picked,mode,camera:{...camera}}}).catch(()=>{});
  }
  function fit(all=false) {
    const box=all?{left:0,right:bounds.width,top:0,bottom:bounds.height}:groupBounds.get(current);
    if(!box)return;
    const availableWidth=viewport.clientWidth-36,availableHeight=viewport.clientHeight-(all?110:60);
    camera.z=Math.min(1,availableWidth/(box.right-box.left),availableHeight/(box.bottom-box.top));
    if(!all)camera.z=Math.max(.74,camera.z);
    camera.x=(viewport.clientWidth-(box.right-box.left)*camera.z)/2-box.left*camera.z;
    camera.y=all?62-box.top*camera.z:22-box.top*camera.z;
    applyCamera();
  }
  function zoom(factor,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2) {
    const next=Math.max(.025,Math.min(1.8,camera.z*factor));
    camera.x=cx-(cx-camera.x)*next/camera.z;camera.y=cy-(cy-camera.y)*next/camera.z;camera.z=next;applyCamera();
  }
  function effectRows(effects) {
    let previousScope='';
    return '<ul class="v2-effects">'+(effects || []).map(effect=>{
      if(typeof effect==='string')return `<li class="v2-effect-neutral">${escape(effect)}</li>`;
      const visibleScope=effect.country || effect.heading || (effect.scope && /[A-Z :]/.test(effect.scope)?effect.scope:'');
      const scope=visibleScope && visibleScope!==previousScope?`<span class="v2-effect-scope">${escape(visibleScope)}</span>`:'';
      previousScope=visibleScope;
      const tone=['gain','cost','neutral'].includes(effect.tone)?effect.tone:'neutral';
      return `<li class="v2-effect-${tone}">${scope}${escape(effect.label)}${effect.value!==undefined && effect.value!==''?`: <span>${escape(effect.value)}</span>`:''}</li>`;
    }).join('')+'</ul>';
  }
  function requirements(node) {
    const result=[];const group=groups.get(node.group);
    if(group?.gate)result.push(group.gate);
    for(const row of node.pre || [])result.push(row.map(nodeName).join(' OR '));
    result.push(...(node.requirements || []));
    if(node.exclusive?.length)result.push('Exclusive with: '+node.exclusive.map(nodeName).join('; '));
    return [...new Set(result)];
  }
  function selectFocus(node,panIntoView=false) {

    root.querySelector('#isr-runtime-subtitle').textContent=group.subtitle || '';
    const branchBox=groupBounds.get(current);
    const deepBranch=(branchBox.bottom-branchBox.top)*.74>viewport.clientHeight-60;
    root.querySelector('#isr-runtime-fit').textContent=deepBranch?'Branch start':'Fit branch';
    root.querySelector('#isr-runtime-fit').setAttribute('data-tooltip',deepBranch?'Show the opening rows at a readable scale':'Fit this programme at a readable scale');
    root.querySelector('#isr-runtime-count').textContent=data.nodes.filter(n=>n.group===current).length+' focuses';
    root.querySelector('#isr-runtime-map-status').textContent='All programmes inspectable';
    root.querySelector('#isr-runtime-overview').setAttribute('aria-pressed','false');
    const req=requirements(node);
    const history={...(node.history || {})};
    if(history.status==='Historical basis')history.status='';
    const historySources=(history.sources || []).map(id=>sources.get(id)).filter(Boolean);
    inspector.innerHTML=`<h3>${escape(node.label)}</h3>${node.full_label && node.full_label!==node.label?`<p class="v2-full-label">${escape(node.full_label)}</p>`:""}<div class="v2-metadata"><span>${escape(node.days)} days</span><span>${escape(group.label)}</span></div><p class="v2-description">${escape(node.description)}</p>${node.programme?`<div class="v2-programme">${escape(node.programme)}</div>`:''}<h4>Effects</h4>${effectRows(node.effects)}${req.length?`<h4>Requirements</h4><ul class="v2-requirements">${req.map(text=>`<li>${escape(text)}</li>`).join('')}</ul>`:''}${history.note||historySources.length?`<details><summary>Historical basis${history.status?' · '+escape(history.status):''}</summary>${history.note?`<p>${escape(history.note)}</p>`:''}${historySources.length?`<ul class="v2-source-list">${historySources.map(source=>`<li><a href="${escape(source.url)}" target="_blank" rel="noopener noreferrer">${escape(source.title)}</a>${source.note?`<p>${escape(source.note)}</p>`:''}</li>`).join('')}</ul>`:''}</details>`:''}`;
    inspector.dataset.selectedFocus=node.id;
    for(const [id,button] of elementById){button.setAttribute('aria-pressed',String(id===picked));button.classList.toggle('is-outside',nodes.get(id).group!==current);}
    for(const edge of svg.querySelectorAll('.v2-edge'))edge.classList.toggle('is-related',edge.dataset.from===picked||edge.dataset.to===picked);
    for(const frame of world.querySelectorAll('.v2-group-footprint'))frame.hidden=true;
    applyCamera();
    if(panIntoView){const point=positions.get(picked);camera.x=viewport.clientWidth/2-(point.x+82.5)*camera.z;camera.y=viewport.clientHeight/2-(point.y+64)*camera.z;applyCamera();}
  }
  function selectGroup(id) {
    if(!groups.has(id))return;
    current=id;const groupNodes=data.nodes.filter(node=>node.group===id);
    selectFocus(nodes.get(picked)?.group===id?nodes.get(picked):groupNodes[0]);fit();
  }
  function overview() {
    mode='overview';
    root.querySelector('#isr-runtime-family').textContent='National institutions and political programmes';
    root.querySelector('#isr-runtime-branch-name').textContent='The whole native tree';
    root.querySelector('#isr-runtime-subtitle').textContent=data.title || 'Israel, Version '+version;
    root.querySelector('#isr-runtime-count').textContent=data.nodes.length+' focuses';
    root.querySelector('#isr-runtime-map-status').textContent='Select any programme';
    root.querySelector('#isr-runtime-overview').setAttribute('aria-pressed','true');
    for(const button of elementById.values())button.classList.remove('is-outside');
    for(const frame of world.querySelectorAll('.v2-group-footprint'))frame.hidden=false;
    inspector.innerHTML=`<h3>Israel, Version 2.0</h3><div class="v2-metadata"><span>${data.nodes.length} focuses</span><span>${data.groups.length} programmes</span></div><p class="v2-overview-description">National institutions support distinct political programmes. Every branch remains inspectable.</p><h4>Programmes</h4><ul class="v2-overview-list">${data.groups.map(group=>`<li><button type="button" class="cursor-interaction" data-group="${escape(group.id)}">${escape(group.label)}</button></li>`).join('')}</ul>`;
    inspector.querySelector('h3').textContent='Israel, Version '+version;
    delete inspector.dataset.selectedFocus;fit(true);
  }
  function starting() {
    mode='starting';root.querySelector('#isr-runtime-overview').setAttribute('aria-pressed','false');applyCamera();
    inspector.innerHTML='<h3>Starting conditions</h3>'+(data.starting || []).map(spirit=>`<section class="v2-starting-entry"><h4>${escape(spirit.label)}</h4><p>${escape(spirit.description)}</p>${effectRows(spirit.effects)}</section>`).join('');
    delete inspector.dataset.selectedFocus;
  }
  function restore(state,refit=true) {
    const stored=state?.privateContent;
    if(!stored || stored.revision!==data.revision || !groups.has(stored.current))return false;
    current=stored.current;picked=nodes.has(stored.picked)?stored.picked:data.nodes.find(node=>node.group===current).id;
    selectFocus(nodes.get(picked));
    if(stored.mode==='overview')overview();else if(stored.mode==='starting')starting();
    if(stored.camera && ['x','y','z'].every(key=>Number.isFinite(stored.camera[key])) && stored.camera.z>=.025 && stored.camera.z<=1.8){camera={...stored.camera};applyCamera();}
    else if(refit)fit(mode==='overview');
    return true;
  }
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button || !root.contains(button))return;
    if(performance.now()<ignoreClickUntil)return;
    if(button.dataset.node){selectFocus(nodes.get(button.dataset.node));}
    else if(button.dataset.group){selectGroup(button.dataset.group);}
    else if(button.id==='isr-runtime-overview')overview();
    else if(button.id==='isr-runtime-fit'){mode='tree';selectFocus(nodes.get(picked));fit();}
    else if(button.id==='isr-runtime-minus')zoom(1/1.2);
    else if(button.id==='isr-runtime-plus')zoom(1.2);
    else if(button.id==='isr-runtime-starting')starting();
    else if(button.id==='isr-runtime-next-row')continueDownward();
    else if(button.id==='isr-runtime-back-top')fit();
    remember();
  });
  select.addEventListener('change',()=>{selectGroup(select.value);remember();});
  root.addEventListener('keydown',event=>{if(event.key==='Tab')keyboardNavigation=true;});
  root.addEventListener('pointerdown',()=>{keyboardNavigation=false;});
  root.addEventListener('focusin',event=>{
    if(!keyboardNavigation || !event.target.matches('.v2-focus'))return;
    const point=positions.get(event.target.dataset.node);if(!point)return;
    camera.x=viewport.clientWidth/2-(point.x+82.5)*camera.z;camera.y=viewport.clientHeight/2-(point.y+64)*camera.z;applyCamera();
  });
  viewport.addEventListener('wheel',event=>{event.preventDefault();const box=viewport.getBoundingClientRect();zoom(event.deltaY<0?1.1:1/1.1,event.clientX-box.left,event.clientY-box.top);remember();},{passive:false});
  viewport.addEventListener('pointerdown',event=>{
    if(event.button!==0 || event.target.closest('.v2-depth-controls') || mode==='overview' && event.target.closest('[data-group]'))return;
    drag={id:event.pointerId,x:event.clientX,y:event.clientY,cameraX:camera.x,cameraY:camera.y,moved:false};
  });
  viewport.addEventListener('pointermove',event=>{
    if(!drag || drag.id!==event.pointerId)return;
    const dx=event.clientX-drag.x,dy=event.clientY-drag.y;
    if(Math.hypot(dx,dy)>4){drag.moved=true;viewport.classList.add('is-dragging');viewport.setPointerCapture(event.pointerId);}
    if(drag.moved){camera.x=drag.cameraX+dx;camera.y=drag.cameraY+dy;applyCamera();}
  });
  function endDrag(event){if(!drag || drag.id!==event.pointerId)return;const moved=drag.moved;drag=null;viewport.classList.remove('is-dragging');if(viewport.hasPointerCapture(event.pointerId))viewport.releasePointerCapture(event.pointerId);if(moved){ignoreClickUntil=performance.now()+180;remember();}}
  viewport.addEventListener('pointerup',endDrag);viewport.addEventListener('pointercancel',endDrag);
  window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState;if(incoming?.privateContent?.instanceId!==instanceId)restore(incoming);});
  let lastWidth=viewport.clientWidth;
  new ResizeObserver(()=>{if(Math.abs(viewport.clientWidth-lastWidth)>1){lastWidth=viewport.clientWidth;fit(mode==='overview');}}).observe(viewport);
  if(!restore(window.openai?.widgetState)){selectFocus(nodes.get(picked));fit();}
  root.dataset.ready='true';root.dataset.nodeCount=String(data.nodes.length);
  root.israelRuntime={data,selectGroup,selectFocus:id=>selectFocus(nodes.get(id),true),centerFocus:id=>{const point=positions.get(id);if(!point)return;camera.x=viewport.clientWidth/2-(point.x+82.5)*camera.z;camera.y=viewport.clientHeight/2-(point.y+64)*camera.z;applyCamera();},overview,starting,fit:()=>fit(mode==='overview'),getState:()=>({current,picked,mode,camera:{...camera}})};
})();
</script>
