l_english:
 # IMPERIA COLD WAR — Brazil 1970 party identity localisation.
 COLDWAR_BRA_1970_party_1_1:0 "£generic_conservatism_small (ARENA) - National Renewal Alliance"
 COLDWAR_BRA_1970_party_1_1_desc:0 "(National Renewal Alliance)\n\nThe National Renewal Alliance is the civilian governing party formed under the post-1965 two-party system. Its command remains institutionally distinct from the Armed Forces."
 COLDWAR_BRA_1970_party_1_1_icon:0 "£generic_conservatism_small"
 COLDWAR_BRA_1970_party_1_2:0 "£generic_conservatism_small (PDS) - Democratic Social Party"
 COLDWAR_BRA_1970_party_1_2_desc:0 "(Democratic Social Party)\n\nThe Democratic Social Party succeeds ARENA in the reorganisation of the governing camp. It is a civilian party, not the military command."
 COLDWAR_BRA_1970_party_1_2_icon:0 "£generic_conservatism_small"
 COLDWAR_BRA_1970_party_1_3:0 "£generic_conservatism_small (PFL) - Liberal Front Party"
 COLDWAR_BRA_1970_party_1_3_desc:0 "(Liberal Front Party)\n\nThe Liberal Front forms from dissidents who leave the PDS during the democratic transition."
 COLDWAR_BRA_1970_party_1_3_icon:0 "£generic_conservatism_small"
 COLDWAR_BRA_1970_party_2_1:0 "£generic_liberalism_small (MDB) - Brazilian Democratic Movement"
 COLDWAR_BRA_1970_party_2_1_desc:0 "(Brazilian Democratic Movement)\n\nThe Brazilian Democratic Movement is the legal opposition created under the post-1965 two-party system."
 COLDWAR_BRA_1970_party_2_1_icon:0 "£generic_liberalism_small"
 COLDWAR_BRA_1970_party_2_2:0 "£generic_liberalism_small (PMDB) - Brazilian Democratic Movement Party"
 COLDWAR_BRA_1970_party_2_2_desc:0 "(Brazilian Democratic Movement Party)\n\nThe PMDB carries the MDB's legal opposition into the restored multiparty system."
 COLDWAR_BRA_1970_party_2_2_icon:0 "£generic_liberalism_small"
 COLDWAR_BRA_1970_party_2_3:0 "£generic_liberalism_small (PSDB) - Brazilian Social Democracy Party"
 COLDWAR_BRA_1970_party_2_3_desc:0 "(Brazilian Social Democracy Party)\n\nThe Brazilian Social Democracy Party forms from a democratic-social-democratic current that leaves the PMDB."
 COLDWAR_BRA_1970_party_2_3_icon:0 "£generic_liberalism_small"
 COLDWAR_BRA_1970_party_3_1:0 "£generic_socialism_small (PTB) - Brazilian Labour Party, restored pre-1965 organisation"
 COLDWAR_BRA_1970_party_3_1_desc:0 "(Brazilian Labour Party, restored pre-1965 organisation)\n\nThe original Brazilian Labour Party was dissolved in 1965. Its restoration is an alternate political outcome for the exiled pre-1965 organisation."
 COLDWAR_BRA_1970_party_3_1_icon:0 "£generic_socialism_small"
 COLDWAR_BRA_1970_party_3_2:0 "£generic_socialism_small (PTB) - Brazilian Labour Party, registered successor"
 COLDWAR_BRA_1970_party_3_2_desc:0 "(Brazilian Labour Party, registered successor)\n\nThe later Brazilian Labour Party wins separate registration during the 1979 to 1980 party reorganisation."
 COLDWAR_BRA_1970_party_3_2_icon:0 "£generic_socialism_small"
 COLDWAR_BRA_1970_party_3_3:0 "£generic_socialism_small (PDT) - Democratic Labour Party"
 COLDWAR_BRA_1970_party_3_3_desc:0 "(Democratic Labour Party)\n\nThe Democratic Labour Party forms under Leonel Brizola after the dispute over the PTB name."
 COLDWAR_BRA_1970_party_3_3_icon:0 "£generic_socialism_small"
 COLDWAR_BRA_1970_party_3_4:0 "£generic_socialism_small (PT) - Workers Party"
 COLDWAR_BRA_1970_party_3_4_desc:0 "(Workers Party)\n\nThe Workers Party grows from the new union movement and social organisations of the late dictatorship."
 COLDWAR_BRA_1970_party_3_4_icon:0 "£generic_socialism_small"
 COLDWAR_BRA_1970_party_20_1:0 "£generic_Nat_Populism_small (Lacerdists) - Lacerdist political movement"
 COLDWAR_BRA_1970_party_20_1_desc:0 "(Lacerdist political movement)\n\nA posthumous Lacerdist path can continue around Sandra Cavalcanti, a close ally from Lacerda's Guanabara administration."
 COLDWAR_BRA_1970_party_20_1_icon:0 "£generic_Nat_Populism_small"
 COLDWAR_BRA_1970_party_20_2:0 "£generic_Nat_Populism_small (PRN) - National Reconstruction Party"
 COLDWAR_BRA_1970_party_20_2_desc:0 "(National Reconstruction Party)\n\nThe National Reconstruction Party is a separate late-Cold-War organisation and does not imply an electoral victory."
 COLDWAR_BRA_1970_party_20_2_icon:0 "£generic_Nat_Populism_small"
