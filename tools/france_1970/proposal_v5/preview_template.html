<!-- IMPERIA COLD WAR — France V5 review; source-coordinate diagram, not an engine screenshot. -->
<div id="coldwar-france-v5">
 <header><strong>FRANCE · POLICY CHOICES</strong><span>PROPOSED REVISION · APPROVAL PENDING</span></header>
 <div class="cw-controls">
  <label>Party programme<select id="cw-party"></select></label>
  <label>Area<select id="cw-area"><option value="foreign">Foreign partnerships</option><option value="military">Armed forces and armaments</option><option value="economy">Economy and social policy</option><option value="politics">Political institutions</option><option value="all">Complete programme · exact grid</option></select></label>
  <label>Focus<select id="cw-focus"></select></label>
 </div>
 <div class="cw-legend"><span>— Prerequisite · OR joins share a line</span><span>× Mutually exclusive</span><span>+ Gain · − Cost / drawback</span></div>
 <div id="cw-diagram" role="region" aria-label="French focus programme with visible prerequisite and exclusion lines"><svg id="cw-lines" aria-hidden="true"></svg><div id="cw-nodes"></div></div>
 <div class="cw-camera"><button type="button" id="cw-left" aria-label="Move tree left">←</button><button type="button" id="cw-fit">Fit structure</button><button type="button" id="cw-native">Readable scale</button><button type="button" id="cw-right" aria-label="Move tree right">→</button><span id="cw-position"></span></div>
 <section id="cw-detail" aria-live="polite"></section>
 <details id="cw-all"><summary>All effects in this area</summary><div id="cw-all-effects"></div></details>
 <details><summary>Agreement conditions</summary><dl id="cw-rules"></dl></details>
 <details><summary>Historical basis and strategic choices</summary><div id="cw-history"></div></details>
 <footer id="cw-footer"></footer>
 <script type="application/json" id="cw-data">__COLDWAR_DATA__</script>
</div>
<style>
#coldwar-france-v5{--cw-bg:#171b20;--cw-bar:#262a30;--cw-text:#edeadf;--cw-dim:#c6c9c8;--cw-line:#c7d1d5;--cw-gold:#e4ce95;--cw-green:#a6dda7;--cw-red:#f0ada4;--cw-edge:#657179;color:var(--cw-text);background:var(--cw-bg);font:14px/1.4 Arial,sans-serif;width:100%;isolation:isolate}
#coldwar-france-v5 *{box-sizing:border-box}#coldwar-france-v5 [hidden]{display:none!important}
#coldwar-france-v5 header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px 14px;background:var(--cw-bar);flex-wrap:wrap}#coldwar-france-v5 strong{font-weight:500}#coldwar-france-v5 header span{font-size:11px;color:var(--cw-gold)}
#coldwar-france-v5 .cw-controls{display:flex;flex-wrap:wrap;gap:12px;padding:14px}#coldwar-france-v5 label{display:grid;gap:4px;flex:1 1 230px;min-width:0;color:var(--cw-dim);font-size:12px}#coldwar-france-v5 select,#coldwar-france-v5 .cw-camera button{font:14px Arial,sans-serif;color:var(--cw-text);background:var(--cw-bar);border:1px solid var(--cw-edge);border-radius:2px;padding:8px;max-width:100%;min-width:0}#coldwar-france-v5 select{width:100%}
#coldwar-france-v5 .cw-legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:11px;color:var(--cw-dim);padding:0 14px 12px}#coldwar-france-v5 #cw-diagram{position:relative;overflow:hidden;width:100%;border-block:1px solid var(--cw-edge);background:radial-gradient(ellipse at top,#252a2a,var(--cw-bg));min-height:160px}#coldwar-france-v5 #cw-lines,#coldwar-france-v5 #cw-nodes{position:absolute;inset:0;width:100%;height:100%}#coldwar-france-v5 #cw-lines{pointer-events:none;overflow:visible}
#coldwar-france-v5 .cw-node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:start;width:112px;min-height:112px;background:transparent;border:0;color:var(--cw-text);padding:0;font:12px/1.2 Arial,sans-serif;text-align:center;transform:translateX(-50%)}#coldwar-france-v5 .cw-node img{height:58px;width:70px;object-fit:contain;filter:drop-shadow(0 2px 2px #080a0a)}#coldwar-france-v5 .cw-title{display:block;min-height:34px;width:100%;background:var(--cw-bar);border:1px solid var(--cw-edge);border-radius:13px;padding:6px 5px;overflow-wrap:anywhere}#coldwar-france-v5 .cw-node[aria-pressed="true"] .cw-title{border-color:var(--cw-gold);color:var(--cw-gold)}#coldwar-france-v5 .cw-node.cw-context{opacity:.72}#coldwar-france-v5 .cw-new{display:block;font-size:11px;color:var(--cw-gold);margin-top:3px}#coldwar-france-v5 .cw-camera{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 14px}#coldwar-france-v5 #cw-position{font-size:11px;color:var(--cw-dim)}
#coldwar-france-v5 #cw-detail{padding:14px;background:var(--cw-bar)}#coldwar-france-v5 h3{font:500 16px/1.3 Arial,sans-serif;margin:0 0 8px;color:var(--cw-gold)}#coldwar-france-v5 h4{font:500 14px/1.3 Arial,sans-serif;margin:10px 0 6px}#coldwar-france-v5 p{margin:7px 0}#coldwar-france-v5 .cw-require{font-size:12px;color:var(--cw-dim)}#coldwar-france-v5 .cw-effects{display:grid;gap:0;margin:8px 0}#coldwar-france-v5 .cw-effect{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:5px 0;border-bottom:1px solid #4c5458}#coldwar-france-v5 .cw-effect:last-child{border-bottom:0}#coldwar-france-v5 .cw-value{font-variant-numeric:tabular-nums;white-space:nowrap}#coldwar-france-v5 .cw-good{color:var(--cw-green)}#coldwar-france-v5 .cw-bad{color:var(--cw-red)}#coldwar-france-v5 .cw-sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px}#coldwar-france-v5 .cw-neutral{color:var(--cw-text)}#coldwar-france-v5 details{padding:12px 14px;border-top:1px solid var(--cw-edge)}#coldwar-france-v5 summary{color:var(--cw-gold)}#coldwar-france-v5 .cw-item{margin:18px 0}#coldwar-france-v5 .cw-item h4{color:var(--cw-gold)}#coldwar-france-v5 a{color:#c8dee7;overflow-wrap:anywhere}#coldwar-france-v5 dl{margin:10px 0}#coldwar-france-v5 dt{color:var(--cw-gold);margin:10px 0 3px}#coldwar-france-v5 dd{margin:0;font-size:12px;color:var(--cw-dim)}#coldwar-france-v5 .cw-context-note{font-size:12px;color:var(--cw-dim)}#coldwar-france-v5 footer{padding:12px 14px;color:var(--cw-dim);font-size:11px}
@media(max-width:540px){#coldwar-france-v5 .cw-sides{grid-template-columns:1fr;gap:12px}#coldwar-france-v5 .cw-node{width:106px}#coldwar-france-v5 .cw-camera button{min-height:40px}#coldwar-france-v5 header{display:block}#coldwar-france-v5 header span{display:block;margin-top:7px}}
#coldwar-france-v5 .cw-named{grid-template-columns:1fr}#coldwar-france-v5 .cw-named .cw-value{white-space:normal;overflow-wrap:anywhere}#coldwar-france-v5 .cw-effects,#coldwar-france-v5 .cw-effect{min-width:0}#coldwar-france-v5 .cw-node img{max-width:100%}
</style>
<script>
(()=>{
 const root=document.getElementById('coldwar-france-v5'),D=JSON.parse(root.querySelector('#cw-data').textContent),q=s=>root.querySelector(s),by=Object.fromEntries(D.nodes.map(n=>[n.key,n])),offers=Object.fromEntries(D.offers.map(o=>[o.id,o])),sources=Object.fromEntries(D.sources.map(s=>[s.id,s]));
 const countries={FRA:'France',GER:'West Germany',DDR:'East Germany',ENG:'United Kingdom',USA:'United States',ITA:'Italy',GRE:'Greece',ROM:'Romania',HOL:'Netherlands',SWI:'Switzerland',SPR:'Spain',SER:'Yugoslavia',ALG:'Algeria',NRY:'Norway',BEL:'Belgium',SOV:'Soviet Union'};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 D.groups.forEach(g=>{if(g.id!=='institutions')g.title=g.party_name||g.title;});
 let party='gaullist',area='foreign',selected='',native=false,pan=0,shown=[];
 const state=window.openai?.widgetState?.privateContent;if(state&&D.groups.some(g=>g.id===state.party)){party=state.party;area=state.area||area;selected=state.selected||'';}
 function save(){window.openai?.setWidgetState?.({modelContent:{proposal:'France V5',party,area,selected},privateContent:{party,area,selected}})?.catch(()=>{});}
 q('#cw-party').innerHTML=D.groups.map(g=>`<option value="${esc(g.id)}">${esc(g.title)}</option>`).join('');q('#cw-party').value=party;q('#cw-area').value=area;
 function format(v,unit){let x=['%','percent','pp'].includes(unit)?v*100:v;const decimals=Math.abs(x)%1?2:0;return(x>0?'+':'')+x.toFixed(decimals).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'')+(unit==='pp'?' pp':unit==='pp_rate'?' pp':['%','percent'].includes(unit)?'%':'');}
 function row(label,value,good){return `<div class="cw-effect${String(value).length>25?' cw-named':''}"><span>${esc(label)}</span><span class="cw-value ${good===null?'cw-neutral':good?'cw-good':'cw-bad'}">${esc(value)}</span></div>`;}
 function modifiers(mods){return Object.entries(mods||{}).filter(([,v])=>v!==0).map(([k,v])=>{const l=D.labels[k]||[k,'%',1];return row(l[0],format(v,l[1]),v*l[2]>0)}).join('');}
 function equipment(e){return Object.entries(e||{}).filter(([,v])=>v!==0).map(([k,v])=>row(D.equipment_families[k].label,format(v,'%'),v<0)).join('');}
 function awards(list){return(list||[]).map(a=>{
   if(a.kind==='doctrine')return row(`${a.branch[0].toUpperCase()+a.branch.slice(1)} Doctrine Cost · ${a.uses} use`,format(-a.bonus,'%'),true);
   if(a.kind.endsWith('_experience'))return row(a.kind.replace('_experience','').replace(/^./,c=>c.toUpperCase())+' Experience',format(a.amount,'number'),a.amount>0);
   if(a.kind==='tech_bonus'){let name=a.target_label||({CAT_industry:'Industrial Research',CAT_construction:'Construction Research',CAT_electronics:'Electronics Research'}[a.category])||'Research';return row(name+' · '+a.uses+' use',format(a.bonus,'%'),true);}
   if(a.kind==='stability')return row('Stability',format(a.amount,'%'),a.amount>0);
   return '';
 }).join('');}
 function transitions(n){return(n.transitions||[]).map(t=>{const from=D.spirits.concat(D.residual_spirits||[]).find(s=>s.id===t.source),to=D.spirits.concat(D.residual_spirits||[]).find(s=>s.id===t.target);return row(t.target?'Replace National Spirit':'Remove National Spirit',(from?.title||t.source||'')+(t.target?' → '+(to?.title||t.target):''),true)}).join('');}
 function effects(n){let out=row('Political Power',format(n.pp,'number'),n.pp>=0)+modifiers(n.mods)+equipment(n.equipment)+awards(n.awards)+awards(n.one_time_effects)+transitions(n);const o=offers[n.offer_id];if(o)out+=row('Unlock Decision · '+countries[o.partner],'Accept / Decline: '+o.title,null);return `<div class="cw-effects">${out}</div>`;}
 function terms(t){return `<div class="cw-effects">${row('Political Power',format(t.political_power,'number'),false)}${row('Treasury','−$'+Math.abs(t.treasury_millions)+'M',false)}${modifiers(t.mods)}${equipment(t.equipment)}${awards(t.awards)}</div>`;}
 function treaty(o){return `<div class="cw-sides"><div><h4>France · ${esc(o.title)}</h4>${terms(o.france)}</div><div><h4>${esc(countries[o.partner])} · ${esc(o.title)}</h4>${terms(o.partner_terms)}</div></div>`;}
 function refs(ids){return [...new Set(ids)].map(id=>sources[id]).filter(Boolean).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.title)}</a>`).join(' · ');}
 function choose(key,remember=true){if(!by[key])return;const n=by[key],g=D.groups.find(g=>g.id===n.group),o=offers[n.offer_id];selected=key;
  root.querySelectorAll('.cw-node').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===key)));q('#cw-focus').value=key;
  q('#cw-detail').innerHTML=`<h3>${esc(n.title)}</h3><div class="cw-require">${n.days} days · Ruling party: ${esc(g.title)}${n.parents.length?' · Requires '+n.parents.map(ps=>ps.map(k=>esc(by[k].title)).join(' OR ')).join(' AND '):''}${n.exclusive.length?' · Mutually exclusive with '+n.exclusive.map(k=>esc(by[k].title)).join(' / '):''}</div>${effects(n)}${o?`<h4>If accepted · Indefinite bilateral spirits</h4>${treaty(o)}<div class="cw-require">${esc(o.family.replaceAll('_',' '))} · One active agreement per family · Acceptance: 90 days · No bilateral war or sanctions</div>`:''}<details><summary>Policy context and requirements</summary><p>${esc(n.description)}</p><p>${esc(n.history||g.history)}</p>${n.requirements?.length?'<p>'+n.requirements.map(esc).join('<br>')+'</p>':''}${n.party_gate?.date_at_least?'<p>Available from '+esc(n.party_gate.date_at_least)+'</p>':''}${n.party_gate?.date_before?'<p>Available before '+esc(n.party_gate.date_before)+'</p>':''}${o?'<p>'+refs(o.sources)+'</p>':''}<div class="cw-context-note">x = ${n.xy[0]}, y = ${n.xy[1]} · relative offset = ${n.offset.join(', ')} · ${esc(n.revision)}</div></details>`;
  if(remember)save();
 }
 function visible(){const primary=D.nodes.filter(n=>n.group===party&&(area==='all'||n.domain===area));const ks=new Set(primary.map(n=>n.key));for(const n of primary)for(const p of n.parents.flat()){ks.add(p);if(area==='foreign'&&p.startsWith('armament_'))for(const parent of by[p].parents.flat())ks.add(parent);}return D.nodes.filter(n=>ks.has(n.key));}
 function svg(tag,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);return el;}
 function draw(){shown=visible();const chart=q('#cw-diagram'),lines=q('#cw-lines'),layer=q('#cw-nodes');lines.replaceChildren();layer.replaceChildren();if(!shown.length){chart.style.height='160px';q('#cw-detail').innerHTML='No separate focuses in this area.';q('#cw-all-effects').innerHTML='';return;}
  const w=chart.clientWidth||736,xs=shown.map(n=>n.xy[0]),ys=shown.map(n=>n.xy[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const unit=native?60:Math.max(17,(w-128)/Math.max(1,maxX-minX)),uy=area==='all'?180:140,h=(maxY-minY)*uy+170;chart.style.height=h+'px';lines.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const pos=Object.fromEntries(shown.map(n=>[n.key,{x:64+(n.xy[0]-minX)*unit-pan,y:14+(n.xy[1]-minY)*uy}]));
  // Orthogonal OR buses preserve grouped logic and avoid false diagonal X paths.
  const seen=new Set();for(const n of shown){const end=pos[n.key];for(const group of n.parents){const ps=group.filter(k=>pos[k]);if(!ps.length)continue;const busY=Math.max(...ps.map(k=>pos[k].y+122));for(const pk of ps){const start=pos[pk],d=`M ${start.x} ${start.y+108} V ${busY} H ${end.x} V ${end.y+8}`;const key=pk+'>'+n.key;if(!seen.has(key)){lines.append(svg('path',{d,fill:'none',stroke:'var(--cw-line)','stroke-width':'1.5','data-edge':key}));seen.add(key);}}}}
  const exclusive=new Set();for(const n of shown){for(const k of n.exclusive){if(!pos[k])continue;const pair=[n.key,k].sort().join('|');if(exclusive.has(pair))continue;exclusive.add(pair);const a=pos[n.key],b=pos[k];const y=Math.min(a.y,b.y)+42;lines.append(svg('path',{d:`M ${a.x+35} ${y} H ${b.x-35}`,fill:'none',stroke:'var(--cw-gold)','stroke-width':'2','stroke-dasharray':'4 3','data-exclusive':pair}));const txt=svg('text',{x:(a.x+b.x)/2,y:y+4,fill:'var(--cw-gold)','text-anchor':'middle','font-size':'14'});txt.textContent='×';lines.append(txt);}}
  for(const n of shown){const p=pos[n.key],same=shown.filter(m=>m.key!==n.key&&m.xy[1]===n.xy[1]),nearest=same.length?Math.min(...same.map(m=>Math.abs(m.xy[0]-n.xy[0]))):4,b=document.createElement('button');b.type='button';b.className='cw-node'+(area!=='all'&&n.domain!==area?' cw-context':'');b.dataset.key=n.key;b.style.width=(native?112:Math.min(112,Math.max(44,unit*nearest-8)))+'px';b.style.left=p.x+'px';b.style.top=p.y+'px';b.setAttribute('aria-pressed',String(selected===n.key));b.setAttribute('aria-label',n.title);b.innerHTML=`${D.icons[n.sprite]?`<img src="${D.icons[n.sprite]}" alt="">`:''}<span class="cw-title">${esc(n.title)}</span>${n.offer_id?'<span class="cw-new">'+esc(countries[offers[n.offer_id].partner])+'</span>':''}`;b.addEventListener('click',()=>choose(n.key));layer.append(b);}
  q('#cw-position').textContent=shown.filter(n=>area==='all'||n.domain===area).length+' focuses · source coordinates';
  const primary=shown.filter(n=>area==='all'||n.domain===area);q('#cw-focus').innerHTML=shown.map(n=>`<option value="${esc(n.key)}">${esc(n.title)}</option>`).join('');q('#cw-all-effects').innerHTML=primary.map(n=>`<div class="cw-item"><h4>${esc(n.title)}</h4>${effects(n)}${offers[n.offer_id]?treaty(offers[n.offer_id]):''}</div>`).join('');
  if(!primary.some(n=>n.key===selected))selected=(primary.find(n=>n.offer_id)||primary[0]).key;choose(selected,false);
 }
 function context(){const g=D.groups.find(g=>g.id===party);q('#cw-history').innerHTML=`<h4>${esc(g.title)}</h4><p>${esc(g.history)}</p>${g.strategic_options?g.strategic_options.map((s,i)=>'<p>'+esc((i?'B · ':'A · ')+s)+'</p>').join(''):''}<p class="cw-context-note">Documented precedents and later proposals are distinguished in each country offer. All modifier amounts are balance proposals.</p>`;q('#cw-footer').textContent='260 focuses · 12 party programmes + Republican institutions · 50 named-country offers · Proposed revision · Source diagram; native rendering untested';}
 const ruleNames={dispatch:'Offer',pending_days:'Response window',setup_costs:'Acceptance',government:'Government changes',duration:'Duration',validity:'Validity',stacking:'Stacking',reissue:'Reissue',maintenance:'Performance',foreign_sovereignty:'Player choice'};
 q('#cw-rules').innerHTML=Object.entries(ruleNames).map(([k,v])=>`<dt>${v}</dt><dd>${esc(D.agreement_rules[k])}${k==='pending_days'?' days':''}</dd>`).join('');
 q('#cw-party').addEventListener('change',()=>{party=q('#cw-party').value;if(party==='institutions'){area='all';q('#cw-area').value=area;}selected='';pan=0;context();draw();save();});q('#cw-area').addEventListener('change',()=>{area=q('#cw-area').value;selected='';pan=0;draw();save();});
 q('#cw-focus').addEventListener('change',()=>{const key=q('#cw-focus').value;if(native){const xs=shown.map(n=>n.xy[0]);pan=Math.max(0,64+(by[key].xy[0]-Math.min(...xs))*60-q('#cw-diagram').clientWidth/2);selected=key;draw();}choose(key);});
 q('#cw-left').addEventListener('click',()=>{pan=Math.max(0,pan-220);draw();});q('#cw-right').addEventListener('click',()=>{pan+=220;draw();});q('#cw-fit').addEventListener('click',()=>{native=false;pan=0;draw();});q('#cw-native').addEventListener('click',()=>{native=true;pan=0;draw();});
 window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&D.groups.some(g=>g.id===s.party)){party=s.party;area=s.area||'foreign';selected=s.selected||'';q('#cw-party').value=party;q('#cw-area').value=area;context();draw();}});
 new ResizeObserver(()=>draw()).observe(q('#cw-diagram'));context();draw();root.dataset.ready='true';
})();
</script>
