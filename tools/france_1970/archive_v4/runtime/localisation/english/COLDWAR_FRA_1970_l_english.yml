 COLDWAR_FRA_public_scrutiny:0 "Public Scrutiny"
 COLDWAR_FRA_public_scrutiny_desc:0 "The authority of the Fifth Republic rests on institutions that can answer for their decisions. Strengthen parliamentary access to administrative information while accepting more demanding scrutiny of the executive."
 COLDWAR_FRA_executive_mandate:0 "Executive Mandate"
 COLDWAR_FRA_executive_mandate_desc:0 "A disciplined majority gives the government the means to carry out a coherent national programme. Preserve the presidency’s initiative, even where opponents see deliberation giving way to direction."
 COLDWAR_FRA_parliamentary_guarantees:0 "Assembly Guarantees"
 COLDWAR_FRA_parliamentary_guarantees_desc:0 "A lasting settlement requires the opposition to have a credible voice between elections. Strengthen the Assembly’s supervisory role and constitutional safeguards, accepting a slower passage for government business."
 COLDWAR_FRA_orderly_alternation:0 "Orderly Alternation"
 COLDWAR_FRA_orderly_alternation_desc:0 "Electoral defeat must change a government without placing the Republic itself in question. Affirm civilian continuity and the legitimacy of peaceful alternation across the parliamentary parties."
 COLDWAR_FRA_regional_authority:0 "Regional Authority"
 COLDWAR_FRA_regional_authority_desc:0 "Departments and regions should have room to shape their own development. Transfer practical responsibility from Paris to elected local institutions, accepting a less uniform direction of the national programme."
 COLDWAR_FRA_prefectoral_state:0 "Prefectoral State"
 COLDWAR_FRA_prefectoral_state_desc:0 "The prefect remains the Republic’s instrument for coordinating investment across the territory. Reinforce the central administration’s capacity to execute national projects, with the expenditure that a stronger administrative chain entails."
 COLDWAR_FRA_progress_contracts:0 "Progress Contracts"
 COLDWAR_FRA_progress_contracts_desc:0 "The upheaval of 1968 exposed the limits of governing industrial France through authority alone. Negotiate progress contracts in the public sector, bringing wages and modernisation into a more predictable social bargain."
 COLDWAR_FRA_new_society:0 "The New Society"
 COLDWAR_FRA_new_society_desc:0 "Chaban-Delmas seeks a less rigid society in which employers, unions and the state negotiate rather than wait for confrontation. Broaden contractual participation, accepting the recurring cost of a more generous settlement."
 COLDWAR_FRA_elysee_direction:0 "Élysée Direction"
 COLDWAR_FRA_elysee_direction_desc:0 "Pompidou intends to modernise France without surrendering the presidency’s initiative. Concentrate responsibility for the national programme at the Élysée, gaining speed at the expense of a wider social accommodation."
 COLDWAR_FRA_industrial_participation:0 "Industrial Participation"
 COLDWAR_FRA_industrial_participation_desc:0 "Participation should give employees a tangible stake in the enterprise without abolishing private management. Extend negotiated workplace arrangements, trading some speed of adaptation for a more durable productive settlement."
 COLDWAR_FRA_national_champions:0 "National Champions"
 COLDWAR_FRA_national_champions_desc:0 "Large French enterprises are expected to carry national ambition into an increasingly competitive industrial world. Concentrate state support on strategic groups, while accepting the fiscal concessions needed to sustain them."
 COLDWAR_FRA_gaullist_renewal:0 "Gaullist Renewal"
 COLDWAR_FRA_gaullist_renewal_desc:0 "The movement must outlive the personal authority of its founders. Build permanent local organisation and a disciplined parliamentary network, accepting the resources needed to maintain the machinery of government."
 COLDWAR_FRA_social_gaullism:0 "Social Gaullism"
 COLDWAR_FRA_social_gaullism_desc:0 "National independence needs an industrial society willing to sustain it. Keep social protection and worker participation at the centre of Gaullism, accepting higher obligations for the public budget."
 COLDWAR_FRA_competitive_gaullism:0 "Competitive Gaullism"
 COLDWAR_FRA_competitive_gaullism_desc:0 "A more competitive economy can finance national ambition without placing every investment under state management. Relax administrative constraints and encourage enterprise, accepting renewed friction with organised labour."
 COLDWAR_FRA_civil_majority:0 "A Civil Majority"
 COLDWAR_FRA_civil_majority_desc:0 "Giscard’s liberals seek to loosen the habits of the Gaullist state without abandoning the Republic. Broaden the government’s social base and make modernisation an undertaking of civil society as well as the administration."
 COLDWAR_FRA_liberal_society:0 "Liberal Society"
 COLDWAR_FRA_liberal_society_desc:0 "Younger voters and women increasingly expect the law to reflect a changing society. Advance civil equality and personal autonomy, accepting opposition from the conservative wing of the governing majority."
 COLDWAR_FRA_conservative_compact:0 "Conservative Compact"
 COLDWAR_FRA_conservative_compact_desc:0 "Economic liberalism will need a reliable parliamentary majority. Bind provincial notables and conservative partners into the coalition, accepting concessions that preserve established commercial interests over new entrants."
 COLDWAR_FRA_sme_credit:0 "Enterprise Credit"
 COLDWAR_FRA_sme_credit_desc:0 "Small and medium firms need access to credit alongside the great industrial groups. Encourage new investment and commercial employment through a less restrictive business environment, accepting a narrower corporate tax yield."
 COLDWAR_FRA_monetary_discipline:0 "Monetary Discipline"
 COLDWAR_FRA_monetary_discipline_desc:0 "Confidence in the franc and the financing of the state require a credible stabilisation programme. Restrain domestic demand and restore fiscal credibility, accepting the political and productive cost of adjustment."
 COLDWAR_FRA_support_activity:0 "Support Activity"
 COLDWAR_FRA_support_activity_desc:0 "Stabilisation must not leave industry and its workers without a future. Support investment and household demand through the downturn, accepting a weaker fiscal position and a higher cost of borrowing."
 COLDWAR_FRA_social_market:0 "Social Market"
 COLDWAR_FRA_social_market_desc:0 "A market economy should rest on stable communities and negotiated obligations. Establish a centrist settlement between enterprise and social protection, accepting the fiscal price of keeping both within the governing coalition."
 COLDWAR_FRA_municipal_compact:0 "Municipal Compact"
 COLDWAR_FRA_municipal_compact_desc:0 "Mayors and local associations are better placed to recognise many needs than a distant ministry. Channel development through local institutions, accepting additional coordination costs for the central administration."
 COLDWAR_FRA_national_coordination:0 "National Coordination"
 COLDWAR_FRA_national_coordination_desc:0 "A centrist government can make national planning answerable to a broad parliamentary coalition. Coordinate investment through the state, while allowing the negotiations needed for consensus to slow political initiative."
 COLDWAR_FRA_skills_partnership:0 "Skills Partnership"
 COLDWAR_FRA_skills_partnership_desc:0 "Technical education should connect the school, the enterprise and the local community. Expand vocational partnerships while funding the teaching capacity needed to make that promise credible."
 COLDWAR_FRA_family_solidarity:0 "Family Solidarity"
 COLDWAR_FRA_family_solidarity_desc:0 "Family assistance and mutual institutions can anchor a social market economy. Protect household security through a more generous social settlement, accepting a sustained claim on public expenditure."
 COLDWAR_FRA_fiscal_compact:0 "Fiscal Compact"
 COLDWAR_FRA_fiscal_compact_desc:0 "A durable social settlement requires resources that the state can reliably collect. Simplify administration and prioritise its financing, even where a more restrained settlement disappoints part of the centrist electorate."
 COLDWAR_FRA_republican_reform:0 "Republican Reform"
 COLDWAR_FRA_republican_reform_desc:0 "The old Radical networks must answer a society transformed by mass education and technological competition. Renew secular republican government through a more open administration and a stronger commitment to public knowledge."
 COLDWAR_FRA_regional_republic:0 "Regional Republic"
 COLDWAR_FRA_regional_republic_desc:0 "Power and opportunity should not depend on proximity to Paris. Give the regions greater scope to develop their own infrastructure, accepting the political work of coordinating a more dispersed Republic."
 COLDWAR_FRA_technical_republic:0 "Technical Republic"
 COLDWAR_FRA_technical_republic_desc:0 "France must close the technological gap without surrendering its republican ideals. Concentrate support on public research and technical education, accepting the expenditure of a more ambitious national effort."
 COLDWAR_FRA_small_enterprise:0 "Small Enterprise"
 COLDWAR_FRA_small_enterprise_desc:0 "A republic of citizens needs room for independent enterprise beyond the great financial and industrial groups. Support the creation of smaller businesses through targeted relief, accepting the immediate reduction in corporate tax yield."
 COLDWAR_FRA_reformist_centre:0 "Reformist Centre"
 COLDWAR_FRA_reformist_centre_desc:0 "A liberal and secular centre can seek partners on the parliamentary right without surrendering its independence. Make administrative reform and fiscal credibility the foundation of that alliance, accepting a more limited social programme."
 COLDWAR_FRA_left_republican:0 "Left Republicanism"
 COLDWAR_FRA_left_republican_desc:0 "Radical republicanism can instead join the left around public services and civil equality. Build that coalition while preserving a separate Radical voice, accepting the expenditure and negotiations required to sustain it."
 COLDWAR_FRA_social_dialogue:0 "Labour Guarantees"
 COLDWAR_FRA_social_dialogue_desc:0 "A socialist government must turn the demands of wage earners into enforceable institutions. Strengthen collective representation at work and restore confidence in negotiated reform, accepting the initial cost of a broader social settlement."
 COLDWAR_FRA_public_credit:0 "Public Credit"
 COLDWAR_FRA_public_credit_desc:0 "Control of credit can give elected government the means to redirect industrial investment. Extend public direction of banking and strategic enterprise, accepting higher administration costs and greater uncertainty among private investors."
 COLDWAR_FRA_negotiated_change:0 "Negotiated Change"
 COLDWAR_FRA_negotiated_change_desc:0 "Transformation can proceed through collective bargaining and a negotiated settlement with private enterprise. Protect investment and commercial employment, accepting that part of the socialist electorate will regard the compromise as incomplete."
 COLDWAR_FRA_social_citizenship:0 "Social Citizenship"
 COLDWAR_FRA_social_citizenship_desc:0 "The promise of alternation reaches beyond ownership to the place of citizens in public life. Strengthen rights and social provision while accepting the continuing obligations of a more inclusive state."
 COLDWAR_FRA_redistributive_mandate:0 "Redistributive Mandate"
 COLDWAR_FRA_redistributive_mandate_desc:0 "The left can defend its mandate by sustaining wages, public demand and social protection. Continue the expansionary settlement, accepting the financing pressure that accompanies an ambitious domestic programme."
 COLDWAR_FRA_stabilisation_turn:0 "Stabilisation Turn"
 COLDWAR_FRA_stabilisation_turn_desc:0 "A socialist government may judge currency stability and external confidence necessary to preserve its achievements. Restrain the expansionary programme and reinforce public finances, accepting disillusion among supporters who expected an uninterrupted break with the past."
 COLDWAR_FRA_public_research:0 "Public Research"
 COLDWAR_FRA_public_research_desc:0 "Public investment in knowledge can give social transformation a productive future. Fund research institutions and technical training instead of treating employment policy as an emergency alone."
 COLDWAR_FRA_industrial_conversion:0 "Industrial Conversion"
 COLDWAR_FRA_industrial_conversion_desc:0 "Fiscal restraint must leave a route forward for industrial communities. Support the conversion of existing enterprise and workforce skills, accepting the administrative cost of a more selective modernisation programme."
 COLDWAR_FRA_workers_mandate:0 "Workers’ Mandate"
 COLDWAR_FRA_workers_mandate_desc:0 "The party’s strength in industrial communities must become a workable governing settlement. Give organised labour a recognised place in national economic priorities, accepting greater obligations for social provision."
 COLDWAR_FRA_french_road:0 "French Road"
 COLDWAR_FRA_french_road_desc:0 "Socialism in France must answer to French political institutions and a broad democratic alliance. Widen the party’s parliamentary appeal and intellectual independence, accepting the loss of some apparatus discipline."
 COLDWAR_FRA_orthodox_centralism:0 "Orthodox Centralism"
 COLDWAR_FRA_orthodox_centralism_desc:0 "A disciplined party can direct resources toward its industrial programme without bargaining away its purpose. Preserve central authority and orthodox doctrine, accepting restricted intellectual exchange and a narrower political settlement."
 COLDWAR_FRA_municipal_services:0 "Municipal Services"
 COLDWAR_FRA_municipal_services_desc:0 "The communist municipalities have built an enduring relationship with workers through housing and local services. Extend that approach nationally while funding the welfare obligations it creates."
 COLDWAR_FRA_planned_industry:0 "Planned Industry"
 COLDWAR_FRA_planned_industry_desc:0 "A national industrial plan can concentrate capacity in sectors selected by the state. Improve coordination of production, accepting the slower adaptation that comes with tighter direction of enterprise."
 COLDWAR_FRA_popular_union:0 "Popular Union"
 COLDWAR_FRA_popular_union_desc:0 "A common programme can keep workers and the wider left within the same parliamentary majority. Accept coalition negotiation in return for a more stable settlement, while carrying the welfare promises needed to hold it together."
 COLDWAR_FRA_communist_hegemony:0 "Communist Primacy"
 COLDWAR_FRA_communist_hegemony_desc:0 "The party can insist that public ownership and communist leadership define the national programme. Concentrate the means of industrial transformation, accepting opposition from private capital and forces outside the party’s social base."
 COLDWAR_FRA_self_management:0 "Self-Management"
 COLDWAR_FRA_self_management_desc:0 "The PSU proposes to change the exercise of power inside the economy as well as the government. Encourage workplace participation and local initiative, accepting the disruption of established management routines."
 COLDWAR_FRA_workers_councils:0 "Workers’ Councils"
 COLDWAR_FRA_workers_councils_desc:0 "Employees should have a decisive voice in how their enterprises are run. Place workplace democracy at the centre of the programme, accepting slower adjustment where decisions must be negotiated collectively."
 COLDWAR_FRA_contractual_socialism:0 "Contractual Socialism"
 COLDWAR_FRA_contractual_socialism_desc:0 "Self-management needs a settlement with technical expertise and national economic coordination. Negotiate enterprise reform rather than impose a single model, accepting tension with militants who demand a fuller transfer of power."
 COLDWAR_FRA_local_experiment:0 "Local Experiment"
 COLDWAR_FRA_local_experiment_desc:0 "Public services and local associations can test new forms of social provision. Give those experiments practical resources while accepting the administrative cost of accommodating different local solutions."
 COLDWAR_FRA_shorter_work:0 "Share Working Time"
 COLDWAR_FRA_shorter_work_desc:0 "A socialist economy should distribute employment and free time more equally. Negotiate shorter working time and wider access to work, accepting slower completion of construction projects under the new working schedules."
 COLDWAR_FRA_productive_autonomy:0 "Productive Autonomy"
 COLDWAR_FRA_productive_autonomy_desc:0 "Workplace autonomy must also demonstrate that it can renew productive capacity. Put skills and technical investment ahead of a further reduction in working time, accepting the education expenditure the programme requires."
 COLDWAR_FRA_environmental_account:0 "Environmental Account"
 COLDWAR_FRA_environmental_account_desc:0 "Growth has imposed costs that public accounts have too often ignored. Establish environmental assessment as a normal duty of government, accepting the initial administrative burden of measuring what must be protected."
 COLDWAR_FRA_ecological_conversion:0 "Ecological Conversion"
 COLDWAR_FRA_ecological_conversion_desc:0 "Industry can be redirected toward cleaner processes and more efficient use of resources. Fund the technical knowledge needed for conversion, accepting slower construction while new standards take effect."
 COLDWAR_FRA_local_sufficiency:0 "Local Sufficiency"
 COLDWAR_FRA_local_sufficiency_desc:0 "Communities should be less dependent on distant decisions about development. Prioritise local networks and the quality of everyday life, accepting a slower expansion of large industrial capacity."
 COLDWAR_FRA_public_consultation:0 "Public Consultation"
 COLDWAR_FRA_public_consultation_desc:0 "Environmental decisions are more durable when communities can challenge them openly. Give consultation an effective place in project approval, accepting that consensus takes time to build."
 COLDWAR_FRA_green_reform:0 "Green Reform"
 COLDWAR_FRA_green_reform_desc:0 "Ecological government can work through a wider parliamentary coalition to make environmental reform durable. Accept the compromises of office and fund public research rather than demand an immediate break with industrial society."
 COLDWAR_FRA_growth_restraint:0 "Restrain Expansion"
 COLDWAR_FRA_growth_restraint_desc:0 "An ecological programme can place the quality of life ahead of continued industrial expansion. Rebalance public priorities toward communities, accepting a lower pace of commercial and industrial development."
 COLDWAR_FRA_small_traders:0 "Independent Commerce"
 COLDWAR_FRA_small_traders_desc:0 "The National Front’s economic appeal can include small proprietors who fear both large business and socialist state control. Direct relief toward independent commerce, accepting the reduction in corporate tax receipts."
 COLDWAR_FRA_tax_revolt:0 "Enterprise Nationalism"
 COLDWAR_FRA_tax_revolt_desc:0 "A nationalist government can seek support through private enterprise and a lighter state apparatus. Encourage commercial investment and reduce administration, accepting a lower yield from the revenue system."
 COLDWAR_FRA_national_preference:0 "National Preference"
 COLDWAR_FRA_national_preference_desc:0 "The National Front proposes to reserve public priority for a narrower definition of national belonging. Centralise the government’s political message and social priorities, accepting deeper conflict within society and higher policing expenditure."
 COLDWAR_FRA_municipal_base:0 "Municipal Base"
 COLDWAR_FRA_municipal_base_desc:0 "A protest movement that seeks to govern needs local organisation able to deliver ordinary public services. Build that capacity, accepting the expenditure required to turn political rhetoric into administration."
 COLDWAR_FRA_electoral_normalisation:0 "Electoral Strategy"
 COLDWAR_FRA_electoral_normalisation_desc:0 "The movement can seek lasting office through elections and practical local administration. Broaden its appeal and commercial programme, accepting demands for compromise from new partners."
 COLDWAR_FRA_confrontational_state:0 "Confrontational State"
 COLDWAR_FRA_confrontational_state_desc:0 "Alternatively, the movement can use executive authority to press its programme against organised opposition. Concentrate political initiative and internal-security resources, accepting a less stable public settlement."
 COLDWAR_FRA_independent_state:0 "Independent State"
 COLDWAR_FRA_independent_state_desc:0 "The Gaullist inheritance places the freedom of national decision above convenience in either bloc. Strengthen resistance to external political leverage, accepting a less expansive role for influence abroad."
 COLDWAR_FRA_executive_custody:0 "Executive Custody"
 COLDWAR_FRA_executive_custody_desc:0 "Guardians of the General’s institutions see a strong presidency as the safeguard of national continuity. Reinforce executive authority, accepting renewed opposition from those who associate central power with social exclusion."
 COLDWAR_FRA_popular_participation:0 "Popular Participation"
 COLDWAR_FRA_popular_participation_desc:0 "Gaullism can seek renewed legitimacy through participation rather than executive command alone. Make employee representation and a social settlement part of national independence, accepting a more costly welfare commitment."
 COLDWAR_FRA_national_direction:0 "National Direction"
 COLDWAR_FRA_national_direction_desc:0 "National economic direction should support the industrial base on which independence rests. Direct support toward French enterprise, accepting the fiscal concessions that accompany selective intervention."
 COLDWAR_FRA_cadre_discipline:0 "Cadre Discipline"
 COLDWAR_FRA_cadre_discipline_desc:0 "The old guard regards a disciplined communist apparatus as the indispensable instrument of social transformation. Concentrate political initiative in the party, accepting a narrower settlement with forces outside it."
 COLDWAR_FRA_central_plan:0 "Central Plan"
 COLDWAR_FRA_central_plan_desc:0 "A tightly coordinated plan can direct industrial capacity toward priorities fixed by the state. Raise the productive ceiling of established enterprise, accepting slower adaptation to new methods and demands."
 COLDWAR_FRA_industrial_mobilisation:0 "Industrial Mobilisation"
 COLDWAR_FRA_industrial_mobilisation_desc:0 "The party can instead press for a rapid renewal of industrial practice through concentrated workplace mobilisation. Favour the pace of transformation over the confidence of a broader public settlement."
 COLDWAR_FRA_public_provision:0 "Public Provision"
 COLDWAR_FRA_public_provision_desc:0 "Communist authority must offer workers material security as well as political direction. Expand public social provision, accepting its continuing fiscal obligations."
 COLDWAR_FRA_shopkeepers_voice:0 "Shopkeepers’ Voice"
 COLDWAR_FRA_shopkeepers_voice_desc:0 "Independent shopkeepers and artisans fear that a state organised around large employers and unions neglects them. Give their organisations direct access to government, accepting a more contentious relationship with the established social partners."
 COLDWAR_FRA_fiscal_concessions:0 "Fiscal Concessions"
 COLDWAR_FRA_fiscal_concessions_desc:0 "The small-trader movement can use office to secure immediate fiscal relief for independent enterprise. Encourage commercial investment, accepting a lower yield from the existing revenue system."
 COLDWAR_FRA_simplified_administration:0 "Simpler Administration"
 COLDWAR_FRA_simplified_administration_desc:0 "A less burdensome administration can answer part of the shopkeepers’ revolt without abandoning the revenue base. Reduce administrative expenditure through simplification, accepting a more limited capacity for political direction."
 COLDWAR_FRA_provincial_credit:0 "Provincial Credit"
 COLDWAR_FRA_provincial_credit_desc:0 "Small enterprise beyond Paris needs investment on terms that recognise local markets. Extend targeted relief and access to commercial credit, accepting the cost to the state’s corporate tax yield."
 COLDWAR_FRA_social_settlement:0 "Social Settlement"
 COLDWAR_FRA_social_settlement_desc:0 "The settlements of 1968 have not removed distrust between employers, unions and the state. Negotiate enforceable procedures for collective bargaining and social dialogue, making industrial peace a responsibility shared by the parties to the agreement."
 COLDWAR_FRA_public_champions:0 "Public Industrial Groups"
 COLDWAR_FRA_public_champions_desc:0 "Place credit and strategic industrial groups under a single public investment mandate. Concentrated direction can accelerate renewal, while a larger public portfolio narrows private investment and increases the cost of administration."
 COLDWAR_FRA_democratic_enterprises:0 "Enterprise Autonomy"
 COLDWAR_FRA_democratic_enterprises_desc:0 "Retain public ownership while giving national firms room to manage investment and compete. Enterprise responsibility supports productive renewal and private confidence, at the cost of direct central coordination and a more difficult political settlement."
 COLDWAR_FRA_auroux_rights:0 "Workplace Rights"
 COLDWAR_FRA_auroux_rights_desc:0 "Give workplace expression and regular bargaining practical force within a negotiated transformation. Training helps firms adapt to the new settlement, while stronger social obligations require continuing expenditure."
 COLDWAR_FRA_auroux_rights_research:0 "Workplace Rights"
 COLDWAR_FRA_industrial_reconversion_contracts:0 "Industrial Retraining"
 COLDWAR_FRA_industrial_reconversion_contracts_desc:0 "Give workers in restructuring industries the technical skills needed for new production. Retraining improves productive adaptation and industrial knowledge, while requiring a sustained education commitment."
 COLDWAR_FRA_industrial_reconversion_contracts_research_0:0 "Industrial Retraining"
 COLDWAR_FRA_price_and_wage_compact:0 "Budget Stabilisation Compact"
 COLDWAR_FRA_price_and_wage_compact_desc:0 "Reinforce the stabilisation programme through firmer collection and restrained social commitments. The state improves its finances and borrowing position, while accepting disillusion among supporters who expected a broader expansion of provision."
 COLDWAR_FRA_coalition_delivery:0 "Coalition Government"
 COLDWAR_FRA_coalition_delivery_desc:0 "Accept the compromises needed to keep a broad left government in office. Administrative cooperation and a more credible public settlement support revenue collection, while coalition negotiation limits the party’s freedom of action and sustains its social promises."
 COLDWAR_FRA_communist_autonomy:0 "Independent Communist Initiative"
 COLDWAR_FRA_communist_autonomy_desc:0 "Keep communist priorities visible through a distinct programme of industrial direction and organised labour. Independent initiative can sharpen economic coordination, but it makes coalition maintenance harder and narrows office-sector growth."
 COLDWAR_FRA_state_enterprise_command:0 "Enterprise Command"
 COLDWAR_FRA_state_enterprise_command_desc:0 "Concentrate investment decisions in public industrial groups and state planning. This can raise industrial capacity and its productive ceiling, at the cost of slower adaptation and a more contested political settlement."
 COLDWAR_FRA_municipal_industrial_compacts:0 "Municipal Compacts"
 COLDWAR_FRA_municipal_industrial_compacts_desc:0 "Let communist municipalities and local employers negotiate employment and service priorities within the national programme. Local cooperation supports stability and office activity, while giving up some central leverage over industrial investment."
 COLDWAR_FRA_planned_specialisation:0 "Planned Specialisation"
 COLDWAR_FRA_planned_specialisation_desc:0 "Use stable production targets to concentrate established factories on selected industrial priorities. The plan raises their attainable output, while fixed targets make adaptation to changing demand more difficult."
 COLDWAR_FRA_planned_specialisation_research:0 "Planned Specialisation"
 COLDWAR_FRA_workplace_campaigns:0 "Production Campaigns"
 COLDWAR_FRA_workplace_campaigns_desc:0 "Mobilise party and workplace organisations around immediate production targets. Intensive mobilisation can improve factory efficiency, but repeated campaigns disrupt public confidence and routine economic planning."
 COLDWAR_FRA_workers_cooperative_conversion:0 "Worker Cooperatives"
 COLDWAR_FRA_workers_cooperative_conversion_desc:0 "Help workers preserve productive capacity by converting threatened enterprises into worker-run cooperatives. Enterprise participation can improve adaptation, while lower output ceilings and public support obligations limit the immediate return."
 COLDWAR_FRA_workers_cooperative_conversion_research:0 "Worker Cooperatives"
 COLDWAR_FRA_regional_skill_compacts:0 "Regional Skills"
 COLDWAR_FRA_regional_skill_compacts_desc:0 "Develop regional technical institutes and public-works skills alongside workplace autonomy. Better construction planning and productive adaptation require a continuing education commitment."
 COLDWAR_FRA_regional_skill_compacts_research:0 "Regional Skills"
 COLDWAR_FRA_sectoral_bargaining:0 "Indexed Wage Settlement"
 COLDWAR_FRA_sectoral_bargaining_desc:0 "Extend sectoral wage agreements and a dependable wage floor as the price of industrial peace. More predictable labour relations support productive adaptation, while a broader social settlement raises recurring public obligations."
 COLDWAR_FRA_workplace_productivity_accord:0 "Skills and Participation"
 COLDWAR_FRA_workplace_productivity_accord_desc:0 "Put vocational skills and employee participation ahead of further wage commitments. Joint training and modernisation improve productive capability, while the education programme requires sustained public financing."
 COLDWAR_FRA_workplace_productivity_accord_research:0 "Skills and Participation"
 COLDWAR_FRA_national_investment_mandate:0 "Investment Mandate"
 COLDWAR_FRA_national_investment_mandate_desc:0 "Give strategic firms a defined modernisation mandate and judge support by their delivery of national industrial priorities. Coordination strengthens industrial investment, while adding a continuing administrative burden."
 COLDWAR_FRA_export_modernisation:0 "Export Modernisation"
 COLDWAR_FRA_export_modernisation_desc:0 "Prepare industrial groups to compete through process renewal and technical skills. Publicly supported training improves their productive potential, while placing a continuing obligation on education expenditure."
 COLDWAR_FRA_export_modernisation_research:0 "Export Modernisation"
 COLDWAR_FRA_independent_fiscal_review:0 "Fiscal Accountability"
 COLDWAR_FRA_independent_fiscal_review_desc:0 "Give the audit authorities and tax administration the resources to improve collection and publish credible public accounts. A stronger revenue base requires an administration capable of enforcing the rules."
 COLDWAR_FRA_technical_skills_compact:0 "Technical Skills"
 COLDWAR_FRA_technical_skills_compact_desc:0 "Protect technical education and workplace training through the adjustment programme, so fiscal credibility does not hollow out future industrial capacity. Research advances faster, with a higher education bill."
 COLDWAR_FRA_technical_skills_compact_research:0 "Technical Skills"
 COLDWAR_FRA_regional_investment_credit:0 "Regional Credit"
 COLDWAR_FRA_regional_investment_credit_desc:0 "Use continuing investment incentives to sustain industrial renewal in the regions. New projects become easier to undertake, while the incentives reduce the corporate tax receipts available to the state."
 COLDWAR_FRA_employment_transition_fund:0 "Employment Transition"
 COLDWAR_FRA_employment_transition_fund_desc:0 "Protect workers and industrial communities while enterprises restructure. Sustained transition assistance makes adjustment more acceptable, at the cost of a continuing social commitment."
 COLDWAR_FRA_planned_supply_allocation:0 "Planned Allocation"
 COLDWAR_FRA_planned_supply_allocation_desc:0 "Use national direction to guarantee priority inputs to strategic French industries. Output capacity becomes more reliable, though rigid allocation reduces the efficiency gained from each production line."
 COLDWAR_FRA_independent_supplier_compacts:0 "Supplier Compacts"
 COLDWAR_FRA_independent_supplier_compacts_desc:0 "Keep strategic investment under national direction while relying on independent firms to deliver it. Industrial construction advances faster, but the corporate tax base narrows and public leverage over suppliers remains limited."
 COLDWAR_FRA_patente_relief:0 "Business Tax Relief"
 COLDWAR_FRA_patente_relief_desc:0 "Answer the small-trader revolt with business investment relief. Commercial development becomes more attractive, while the state accepts a lower corporate tax yield; the relief is represented across MD’s business tax base."
 COLDWAR_FRA_local_licensing_compact:0 "Local Licences"
 COLDWAR_FRA_local_licensing_compact_desc:0 "Devolve routine commercial licensing and reduce the weight of central administration. Independent enterprise gains room to develop, while Paris gives up part of its direct political initiative."
 COLDWAR_FRA_municipal_service_compact:0 "Municipal Services"
 COLDWAR_FRA_municipal_service_compact_desc:0 "Turn an electoral strategy into dependable municipal government and local services. A broader public settlement supports commercial activity, while social provision carries a recurring fiscal cost."
 COLDWAR_FRA_executive_enforcement_network:0 "Executive Enforcement"
 COLDWAR_FRA_executive_enforcement_network_desc:0 "Extend the confrontational programme through a more coordinated internal-security administration. Political initiative grows, at the price of further policing expense and a less stable settlement."
 COLDWAR_FRA_executive_programme_office:0 "Executive Coordination"
 COLDWAR_FRA_executive_programme_office_desc:0 "A presidential majority must turn its mandate into coordinated administration. Give the government a stronger capacity to carry decisions across ministries, accepting a narrower margin for deliberation."
 COLDWAR_FRA_minority_constitutional_referral:0 "Constitutional Review"
 COLDWAR_FRA_minority_constitutional_referral_desc:0 "A parliamentary safeguard matters only if an opposition able to assemble a substantial minority can use it. Open constitutional review to sixty deputies or senators, accepting a slower route from legislation to promulgation."
 COLDWAR_FRA_mutual_insurance_compact:0 "Mutual Insurance"
 COLDWAR_FRA_mutual_insurance_compact_desc:0 "Transfer part of state-financed care to member-funded mutual coverage and grant household tax relief for contributions. The proposal lowers public health expenditure while reducing population-tax receipts. It extends the historical complementary role of mutual societies rather than claiming they replaced compulsory Social Security."
 COLDWAR_FRA_public_health_guarantee:0 "Public Health Guarantee"
 COLDWAR_FRA_public_health_guarantee_desc:0 "A social market requires common standards that do not depend on a household's access to a mutual society. Expand the public health commitment, accepting a substantially greater continuing claim on health expenditure."
 COLDWAR_FRA_public_research_contracts:0 "Research Contracts"
 COLDWAR_FRA_public_research_contracts_desc:0 "The technological transition demands skills and research that private firms may not finance alone. Direct public contracts toward applied science and technical education, accepting the cost of a stronger research base."
 COLDWAR_FRA_public_research_contracts_research:0 "Research Contracts"
 COLDWAR_FRA_small_firm_innovation_guarantee:0 "Enterprise Innovation"
 COLDWAR_FRA_small_firm_innovation_guarantee_desc:0 "Independent firms need access to modern equipment and production methods, not only easier entry into the market. Guarantee their industrial modernisation, accepting a public cost and lower corporate-tax receipts."
 COLDWAR_FRA_industrial_conversion_authority:0 "Industrial Conversion"
 COLDWAR_FRA_industrial_conversion_authority_desc:0 "Renew industrial processes and workforce skills as part of an ecological reform programme. Industrial modernisation improves productive capability, while standards slow new industrial construction and training requires public financing. The research bonus supports industry; it does not create an environmental technology category."
 COLDWAR_FRA_industrial_conversion_authority_research:0 "Industrial Conversion"
 COLDWAR_FRA_protected_landscape_code:0 "Landscape and Local Works"
 COLDWAR_FRA_protected_landscape_code_desc:0 "Combine conservation review with municipal infrastructure and local services around protected landscapes. Local works and a more settled development policy offer practical gains, while review constrains industrial expansion and requires administration. These effects do not directly simulate biodiversity."
 COLDWAR_FRA_housing_contracts:0 "Housing Contracts"
 COLDWAR_FRA_housing_contracts_desc:0 "Give the redistributive programme a practical outlet in housing and public construction. Strengthen construction planning and the capacity to carry projects through, accepting a sustained social commitment."
 COLDWAR_FRA_housing_contracts_research:0 "Housing Contracts"
 COLDWAR_FRA_gaullist_national_readiness:0 "National Readiness Programme"
 COLDWAR_FRA_gaullist_national_readiness_desc:0 "Maintain an army prepared for operations under national command. More cohesive formations require larger supply allocations during training and operations."
 COLDWAR_FRA_gaullist_reserve_modernisation:0 "Reserve and Mobilisation Readiness"
 COLDWAR_FRA_gaullist_reserve_modernisation_desc:0 "Invest in reserve instruction and repeated recovery exercises. Formations reorganise more quickly after disruption, while longer initial training delays the readiness of newly raised divisions."
 COLDWAR_FRA_orthodox_force_de_dissuasion:0 "National Command Readiness"
 COLDWAR_FRA_orthodox_force_de_dissuasion_desc:0 "Strengthen the conventional command structure supporting independent national defence. Staff coordination improves army organisation, while maintaining readiness requires more supplies. Strategic weapons remain governed by the existing national system."
 COLDWAR_FRA_orthodox_combined_arms_training:0 "Combined-Arms Field Training"
 COLDWAR_FRA_orthodox_combined_arms_training_desc:0 "Concentrate on defensive combined-arms exercises. Better coordination strengthens army defence, while a longer training cycle and disruption to industrial adaptation absorb time and resources."
 COLDWAR_FRA_liberal_professional_readiness:0 "Professional Readiness Cadre"
 COLDWAR_FRA_liberal_professional_readiness_desc:0 "Expand professional instruction and readiness support across the armed services. Army cohesion and recovery improve, while the wider professional establishment raises recurring military personnel expenditure."
 COLDWAR_FRA_liberal_citizen_reserve:0 "Citizen Reserve Standards"
 COLDWAR_FRA_liberal_citizen_reserve_desc:0 "Retain a broad citizen force through more thorough reserve and defensive instruction. Army defence improves, while newly raised formations require longer training."
 COLDWAR_FRA_centre_civil_defence_service:0 "Civil Defence and Reserve Service"
 COLDWAR_FRA_centre_civil_defence_service_desc:0 "Connect national service, civil preparation and reserve instruction. Army formations recover organisation more quickly, while newly raised formations spend longer in training."
 COLDWAR_FRA_centre_joint_service_readiness:0 "Joint-Service Readiness Council"
 COLDWAR_FRA_centre_joint_service_readiness_desc:0 "Coordinate national defence through a joint readiness council and shared exercises. Army cohesion and defence improve, while the council and its planning staff require continuing administrative expenditure."
 COLDWAR_FRA_gaullist_franco_german_consultations:0 "Strategic and Industrial Consultations"
 COLDWAR_FRA_gaullist_franco_german_consultations_desc:0 "Offer a selected partner joint staff seminars and industrial process exchanges. Each government retains national decisions and finances its own education contribution."
 COLDWAR_FRA_gaullist_east_west_consultations:0 "Détente and Scientific Dialogue"
 COLDWAR_FRA_gaullist_east_west_consultations_desc:0 "Offer a selected partner political consultation and civilian scientific exchange. A calmer diplomatic climate and shared research require a continuing education commitment."
 COLDWAR_FRA_orthodox_european_independence_offer:0 "Sovereign Industrial Cooperation"
 COLDWAR_FRA_orthodox_european_independence_offer_desc:0 "Offer a selected partner industrial cooperation between independent national programmes. Joint skills support production without delegating command or purchasing decisions."
 COLDWAR_FRA_orthodox_soviet_dialogue_offer:0 "Independent Staff Dialogue"
 COLDWAR_FRA_orthodox_soviet_dialogue_offer_desc:0 "Offer a selected partner political consultation and staff seminars under separate national command. Better cohesion and a steadier diplomatic climate require a continuing education commitment."
 COLDWAR_FRA_liberal_common_market_offer:0 "Commercial Standards Exchange"
 COLDWAR_FRA_liberal_common_market_offer_desc:0 "Offer a selected partner cooperation on commercial standards and industrial practice. Both governments retain their commercial laws and fund the technical exchange."
 COLDWAR_FRA_liberal_atlantic_science_offer:0 "Civilian Science Partnership"
 COLDWAR_FRA_liberal_atlantic_science_offer_desc:0 "Offer a selected partner a civilian scientific exchange. The participating governments retain their own research priorities and finance the programme through education expenditure."
 COLDWAR_FRA_centre_benelux_consultation_offer:0 "Administrative Cooperation Forum"
 COLDWAR_FRA_centre_benelux_consultation_offer_desc:0 "Invite a selected partner to exchange administrative practice and vocational expertise. The governments retain their laws and finance the forum through their education budgets."
 COLDWAR_FRA_centre_italian_civic_offer:0 "Civic and University Exchange"
 COLDWAR_FRA_centre_italian_civic_offer_desc:0 "Offer a selected partner exchanges among universities, municipalities and professional associations. The participating governments finance the programme while retaining their own public institutions."
 COLDWAR_FRA_socialist_citizen_reserve:0 "Territorial Reserve Service"
 COLDWAR_FRA_socialist_citizen_reserve_desc:0 "Retain conscription as a broad civic obligation and prepare reserve formations for the defence of French territory. A larger trained reserve improves defensive readiness, while a less concentrated professional cadre reduces field cohesion."
 COLDWAR_FRA_socialist_professional_cadre:0 "Professional Command Cadre"
 COLDWAR_FRA_socialist_professional_cadre_desc:0 "Concentrate instruction and staff development in a professional core supporting the conscript army. Unit cohesion improves and new formations complete training more quickly, while maintaining their readiness consumes more supplies."
 COLDWAR_FRA_socialist_reconversion_exchange:0 "Industrial Reconversion Exchange"
 COLDWAR_FRA_socialist_reconversion_exchange_desc:0 "Offer a selected partner a reciprocal technical exchange on civilian industrial conversion and employment adjustment. Each government contributes political capacity and receives one finite industrial research award after acceptance."
 COLDWAR_FRA_socialist_science_compact:0 "Public Works Methods Exchange"
 COLDWAR_FRA_socialist_science_compact_desc:0 "Offer a selected partner a reciprocal exchange in civilian construction methods and public works planning. Each government contributes political capacity and receives one finite construction research award after acceptance."
 COLDWAR_FRA_communist_workers_defence:0 "Workers’ National Defence"
 COLDWAR_FRA_communist_workers_defence_desc:0 "Build territorial readiness through reserve training, civil preparedness and cooperation with organised labour. The force is harder to dislodge in defence, though divided authority limits the cohesion of its regular formations."
 COLDWAR_FRA_communist_party_command:0 "Party Command and Staff Control"
 COLDWAR_FRA_communist_party_command_desc:0 "Place doctrine, appointments and readiness under a party-supervised chain of command. Central direction improves regular-unit cohesion and the recovery of organisation, while intrusive political oversight narrows civilian confidence."
 COLDWAR_FRA_communist_industry_exchange:0 "Industrial Standards Exchange"
 COLDWAR_FRA_communist_industry_exchange_desc:0 "Offer a reciprocal industrial research exchange to a partner chosen by the player. Each side contributes political capacity and receives one shared-category technology award only after the other government accepts."
 COLDWAR_FRA_communist_electronics_exchange:0 "Public Construction Standards Exchange"
 COLDWAR_FRA_communist_electronics_exchange_desc:0 "Offer a selected partner a reciprocal exchange in civilian construction methods. Both governments contribute political capacity and receive the same finite construction research award after acceptance."
 COLDWAR_FRA_old_guard_conscript_reserve:0 "Mass Mobilisation System"
 COLDWAR_FRA_old_guard_conscript_reserve_desc:0 "Broaden the recruitable population and shorten initial formation through standardised instruction. More recruits become available and new divisions complete training sooner, while the expanded system requires more supplies."
 COLDWAR_FRA_old_guard_professional_staff:0 "Arsenal Investment Priority"
 COLDWAR_FRA_old_guard_professional_staff_desc:0 "Give priority to public arsenals and a supporting professional command cadre. Arms factories can be built more quickly and regular formations gain cohesion, while the programme absorbs part of the government’s political capacity."
 COLDWAR_FRA_old_guard_state_industry_exchange:0 "Reciprocal State Industry Mission"
 COLDWAR_FRA_old_guard_state_industry_exchange_desc:0 "Offer a reciprocal industrial technology mission to a partner selected by the French player. The exchange reserves one shared research award for each government, but delivers neither award before acceptance."
 COLDWAR_FRA_old_guard_electronics_mission:0 "Civilian Construction Standards Mission"
 COLDWAR_FRA_old_guard_electronics_mission_desc:0 "Offer a reciprocal civilian construction and infrastructure research mission to a partner chosen by the French player. Both governments pay an equal political contribution and receive one finite award only after signing."
 COLDWAR_FRA_psu_civilian_control_force:0 "Civilian Control and Professional Cadre"
 COLDWAR_FRA_psu_civilian_control_force_desc:0 "Strengthen parliamentary oversight and concentrate readiness in a smaller professional cadre. Better army cohesion comes with a smaller recruitable population, while sustained parliamentary supervision absorbs political capacity."
 COLDWAR_FRA_psu_citizen_defence:0 "Citizen Territorial Defence"
 COLDWAR_FRA_psu_citizen_defence_desc:0 "Root national defence in accountable reserve structures, local preparedness and civic participation. Defence on French core territory and public willingness to sustain defence improve, while the wider reserve organisation requires more supplies."
 COLDWAR_FRA_psu_civilian_research_network:0 "Municipal Planning Research Network"
 COLDWAR_FRA_psu_civilian_research_network_desc:0 "Offer a selected partner a reciprocal municipal planning and construction exchange. Both governments contribute political capacity and receive a finite construction research award after acceptance."
 COLDWAR_FRA_psu_industrial_cooperation:0 "Industrial Modernisation Mission"
 COLDWAR_FRA_psu_industrial_cooperation_desc:0 "Offer a reciprocal industrial research mission to one eligible partner chosen by the French player. Both sides pay the same political cost and gain the same one-use award after acceptance."
 COLDWAR_FRA_territorial_citizen_reserve:0 "Territorial Citizen Reserve"
 COLDWAR_FRA_territorial_citizen_reserve_desc:0 "Organise a trained reserve around local defence and civil authorities. Home-territory resilience improves, while recurring training demands more time before units are ready."
 COLDWAR_FRA_technical_defence_cadre:0 "Technical Defence Cadre"
 COLDWAR_FRA_technical_defence_cadre_desc:0 "Concentrate limited resources on a smaller force of technically trained professionals. Formation is quicker and units hold together better, at the cost of reduced home-defence resilience and 4% higher weekly army personnel expenditure."
 COLDWAR_FRA_civil_protection_network:0 "Civil Protection Network"
 COLDWAR_FRA_civil_protection_network_desc:0 "Build a civilian service for evacuation, emergency supply and industrial-accident response, drawing on France’s post-1974 focus on civil protection. Public readiness and local works improve, while maintaining the network adds administrative cost."
 COLDWAR_FRA_protective_professional_force:0 "Professional Protective Force"
 COLDWAR_FRA_protective_professional_force_desc:0 "Retain a professional force for site security and emergency protection. Army cohesion and defence on French core territory improve, while the professional establishment requires a larger recurring army personnel budget."
 COLDWAR_FRA_territorial_readiness_compact:0 "Limited Standing Establishment"
 COLDWAR_FRA_territorial_readiness_compact_desc:0 "Limit the cost of the standing army and retain a modest territorial establishment. Army personnel spending falls, while the reduced establishment weakens defence on French core territory."
 COLDWAR_FRA_local_defence_contracts:0 "Reservist Industry Contracts"
 COLDWAR_FRA_local_defence_contracts_desc:0 "Link a locally recruited reserve to contracts for small suppliers. Production capability and territorial defence improve, at the price of lower corporate-tax receipts and 4% higher weekly army personnel expenditure."
 COLDWAR_FRA_national_service_reserve:0 "National Service Reserve"
 COLDWAR_FRA_national_service_reserve_desc:0 "Make territorial service the foundation of the armed forces. A larger reserve sustains homeland defence and morale, but longer training cycles and a less professional establishment limit readiness."
 COLDWAR_FRA_professional_expedition_cadre:0 "Professional Expedition Cadre"
 COLDWAR_FRA_professional_expedition_cadre_desc:0 "Prepare a professional cadre for operations overseas and sustained expeditionary training. Army cohesion improves and new formations complete training sooner, while a larger personnel budget and weaker territorial coverage impose continuing costs."
 COLDWAR_FRA_francophone_engineering_exchange:0 "Engineering and Technical Exchange"
 COLDWAR_FRA_francophone_engineering_exchange_desc:0 "Offer a selected partner a jointly financed programme of technical research and industrial process development. Both countries gain temporary research speed and production-efficiency growth."
 COLDWAR_FRA_reciprocal_professional_courses:0 "Reciprocal Staff Courses"
 COLDWAR_FRA_reciprocal_professional_courses_desc:0 "Offer a selected partner an exchange of military instructors and staff officers financed by equal national contributions. Both forces gain stronger organisation and shorter division training during the agreement."
 COLDWAR_FRA_joint_water_research:0 "Joint Water Research"
 COLDWAR_FRA_joint_water_research_desc:0 "Offer a selected partner a jointly financed programme in water treatment, pollution control and the planning of public utilities. Technical exchange improves research and infrastructure development during the agreement."
 COLDWAR_FRA_cross_border_rescue_protocol:0 "Civil Emergency Cooperation"
 COLDWAR_FRA_cross_border_rescue_protocol_desc:0 "Offer a selected partner reciprocal emergency training, engineering practice and logistics planning. Infrastructure development and the recovery of army organisation improve during the agreement."
 COLDWAR_FRA_reciprocal_small_trade:0 "Reciprocal Small-Trade Convention"
 COLDWAR_FRA_reciprocal_small_trade_desc:0 "Offer a selected partner a jointly financed commercial convention supporting independent enterprise. Both countries gain faster office development while each government pays its own setup contribution."
 COLDWAR_FRA_mutual_rural_credit:0 "Rural Infrastructure Credit"
 COLDWAR_FRA_mutual_rural_credit_desc:0 "Offer a selected partner reciprocal credit and technical coordination for rural transport, utilities and local market access. Each government pays its own setup contribution and directs its own projects."
 COLDWAR_FRA_bilateral_proprietor_contracts:0 "Bilateral Supplier Contracts"
 COLDWAR_FRA_bilateral_proprietor_contracts_desc:0 "Offer a selected partner a jointly financed exchange of supplier practices and production methods. Both countries gain faster production-efficiency growth during the agreement."
 COLDWAR_FRA_reciprocal_officer_exchange:0 "Reciprocal Officer Exchange"
 COLDWAR_FRA_reciprocal_officer_exchange_desc:0 "Offer a selected partner a conventional staff exchange financed by equal national contributions. Joint instruction strengthens army organisation while each government retains its own chain of command."
 COLDWAR_FRA_armament_gaullist_a:0 "State Arsenal Mandate"
 COLDWAR_FRA_armament_gaullist_a_desc:0 "Place the armament arsenals at the centre of the national equipment programme. Larger production runs strengthen defence manufacturing, while a more complex land equipment establishment carries higher operating costs."
 COLDWAR_FRA_armament_gaullist_a_followup:0 "Long-Term Arsenal Investment"
 COLDWAR_FRA_armament_gaullist_a_followup_desc:0 "Give the arsenals and their suppliers a dependable horizon for plant investment and standardised series. Stable programmes support expansion and a higher production ceiling, but make it harder to adapt established lines to new requirements."
 COLDWAR_FRA_armament_gaullist_b:0 "Production Participation Accords"
 COLDWAR_FRA_armament_gaullist_b_desc:0 "Extend Chaban-Delmas’s participation agenda to the arsenals, including the naval yards. Joint instruction and agreements with labour improve industrial adaptation and shipbuilding, while requiring a sustained training commitment."
 COLDWAR_FRA_armament_gaullist_b_followup:0 "Joint Production Standards"
 COLDWAR_FRA_armament_gaullist_b_followup_desc:0 "Bring arsenal management and employee representatives into common production standards and naval apprenticeship plans. Better organisation supports longer production runs and yard expansion, while naval priorities absorb part of the land-armament programme."
 COLDWAR_FRA_armament_orthodox_gaullist_a:0 "National Arsenal Authority"
 COLDWAR_FRA_armament_orthodox_gaullist_a_desc:0 "Use the ministerial armament administration to concentrate orders on nationally controlled programmes. Greater arms production and faster construction of arms facilities preserve freedom of decision, while the land equipment establishment becomes more costly to sustain."
 COLDWAR_FRA_armament_orthodox_gaullist_a_followup:0 "Sovereign Production Standards"
 COLDWAR_FRA_armament_orthodox_gaullist_a_followup_desc:0 "Give domestic technical directorates firm authority over standards and long production series. A dependable national equipment base raises the production ceiling, at the cost of slower adaptation to alternative designs."
 COLDWAR_FRA_armament_orthodox_gaullist_b:0 "Naval Arsenal Priority"
 COLDWAR_FRA_armament_orthodox_gaullist_b_desc:0 "Concentrate scarce industrial investment on the state naval arsenals and their specialist suppliers. Shipbuilding gains capacity and room to expand, while land-armament construction accepts a lower priority."
 COLDWAR_FRA_armament_orthodox_gaullist_b_followup:0 "Naval Technical Apprenticeships"
 COLDWAR_FRA_armament_orthodox_gaullist_b_followup_desc:0 "Sustain the shipwrights, technicians and production engineers needed by the naval arsenals. Specialist instruction improves shipbuilding output, while binding the state to a continuing education programme."
 COLDWAR_FRA_armament_liberal_a:0 "Competitive Defence Contracts"
 COLDWAR_FRA_armament_liberal_a_desc:0 "Give private manufacturers greater scope to compete for French equipment orders. Competition and design freedom strengthen arms production, while a more varied land equipment inventory raises the cost of support."
 COLDWAR_FRA_armament_liberal_a_followup:0 "Export-Capable Production"
 COLDWAR_FRA_armament_liberal_a_followup_desc:0 "Support the industrial capacity needed to compete for foreign orders without promising those orders in advance. Investment incentives expand the arms sector and its production ceiling, while reducing corporate-tax receipts."
 COLDWAR_FRA_armament_liberal_b:0 "Equipment Life Extension"
 COLDWAR_FRA_armament_liberal_b_desc:0 "Require procurement authorities to compare replacement with the cost of sustaining proven equipment. A smaller support bill preserves fiscal room, while longer retention of existing series limits the production ceiling."
 COLDWAR_FRA_armament_liberal_b_followup:0 "Standardised Replacement Parts"
 COLDWAR_FRA_armament_liberal_b_followup_desc:0 "Bring suppliers into common parts specifications and technical instruction for equipment already in service. Better production methods recover some industrial capacity, while the training programme requires continuing education expenditure."
 COLDWAR_FRA_armament_centre_a:0 "Arms Industry Compact"
 COLDWAR_FRA_armament_centre_a_desc:0 "Bring ministries, employers and labour into a negotiated programme for defence production. More dependable delivery strengthens output and adaptation, while vocational instruction requires a larger education commitment."
 COLDWAR_FRA_armament_centre_a_followup:0 "Regional Supplier Networks"
 COLDWAR_FRA_armament_centre_a_followup_desc:0 "Give provincial engineering firms a practical place in the national armament programme. Investment relief supports new arms facilities, while the state accepts a lower corporate-tax yield."
 COLDWAR_FRA_armament_centre_b:0 "Naval Procurement Priority"
 COLDWAR_FRA_armament_centre_b_desc:0 "Give naval construction a defined place in the allocation of defence investment. The yards gain output and expansion capacity, while land-armament production receives a smaller share of resources."
 COLDWAR_FRA_armament_centre_b_followup:0 "Standardised Fleet Components"
 COLDWAR_FRA_armament_centre_b_followup_desc:0 "Unify specifications and instruction among the naval arsenals and their component makers. A deeper common skills base strengthens shipbuilding, while technical education remains a public obligation."
 COLDWAR_FRA_armament_radical_a:0 "Parliamentary Procurement Review"
 COLDWAR_FRA_armament_radical_a_desc:0 "Give Parliament credible scrutiny over equipment selection and lifetime support obligations. More deliberate specifications improve production methods and restrain upkeep, while major arms-factory projects take longer to approve."
 COLDWAR_FRA_armament_radical_a_followup:0 "Independent Test Establishments"
 COLDWAR_FRA_armament_radical_a_followup_desc:0 "Sustain technical establishments able to test manufacturers’ claims before large orders are placed. More reliable standards improve the production ceiling, while specialist training adds to education expenditure."
 COLDWAR_FRA_armament_radical_b:0 "Executive Procurement Mandate"
 COLDWAR_FRA_armament_radical_b_desc:0 "Give the cabinet clear authority to carry approved equipment programmes through industrial expansion. Arms production gains capacity and new arms factories can be built faster, while the land equipment support establishment becomes more expensive."
 COLDWAR_FRA_armament_radical_b_followup:0 "Maintenance Cost Audits"
 COLDWAR_FRA_armament_radical_b_followup_desc:0 "Make the executive mandate answerable for the service costs of the equipment it orders. A more disciplined support bill follows, while repeated specification reviews slow the adaptation of production lines."
 COLDWAR_FRA_armament_socialist_a:0 "Public Armaments Programme"
 COLDWAR_FRA_armament_socialist_a_desc:0 "Bring strategic equipment production under stronger public direction while retaining operating responsibilities within the enterprises. Coordinated investment improves output and adaptation, while the state forgoes part of the corporate-tax yield to finance the programme."
 COLDWAR_FRA_armament_socialist_a_followup:0 "Negotiated Modernisation"
 COLDWAR_FRA_armament_socialist_a_followup_desc:0 "Negotiate plant renewal with public-enterprise management and the workforce. New facilities and longer production series strengthen the arsenals, while employment guarantees add to social obligations."
 COLDWAR_FRA_armament_socialist_b:0 "Worker Transition Guarantees"
 COLDWAR_FRA_armament_socialist_b_desc:0 "Put retraining and negotiated changes in work organisation ahead of immediate increases in armament volume. Production adapts more readily, while instruction costs more and the transition narrows the sector’s output."
 COLDWAR_FRA_armament_socialist_b_followup:0 "Lifetime Equipment Support"
 COLDWAR_FRA_armament_socialist_b_followup_desc:0 "Give maintenance and technical training a stronger place in equipment contracts. More consistent production and easier support reduce operating costs, allowing the government to sustain existing equipment for longer."
 COLDWAR_FRA_armament_communist_a:0 "National Armaments Plan"
 COLDWAR_FRA_armament_communist_a_desc:0 "Place the armament enterprises under a national production plan for territorial defence. Output and industrial expansion receive firm priorities, while central directives deepen conflict over control inside the enterprises."
 COLDWAR_FRA_armament_communist_a_followup:0 "Standardised Production Series"
 COLDWAR_FRA_armament_communist_a_followup_desc:0 "Concentrate components and machine tools on a limited range of planned equipment series. A higher production ceiling follows, while rigid allocations make changes to established lines more difficult."
 COLDWAR_FRA_armament_communist_b:0 "Autonomous Arsenal Councils"
 COLDWAR_FRA_armament_communist_b_desc:0 "Give public-enterprise councils greater discretion over delivery methods and maintenance practice. Production adapts more readily and support costs fall, while negotiated investment slows the expansion of arms facilities."
 COLDWAR_FRA_armament_communist_b_followup:0 "Regional Prototype Workshops"
 COLDWAR_FRA_armament_communist_b_followup_desc:0 "Link public arsenals to regional technical schools and experimental workshops. Better engineering strengthens output and the production ceiling, while the training network requires continuing education expenditure."
 COLDWAR_FRA_armament_old_guard_a:0 "Central Armaments Directorate"
 COLDWAR_FRA_armament_old_guard_a_desc:0 "Concentrate orders, components and capital investment under a single production authority. The army gains a larger industrial base, while maintaining the expanded land equipment establishment places a heavier burden on the budget."
 COLDWAR_FRA_armament_old_guard_a_followup:0 "Mobilisation Production Schedule"
 COLDWAR_FRA_armament_old_guard_a_followup_desc:0 "Prepare selected plants for long, standardised equipment runs. Concentration raises the production ceiling, while rigid schedules make industrial adaptation slower."
 COLDWAR_FRA_armament_old_guard_b:0 "Repair Before Replacement"
 COLDWAR_FRA_armament_old_guard_b_desc:0 "Keep proven equipment in service through a nationally coordinated repair effort. Operating costs fall and production methods improve, while new armament volume gives way to the maintenance priority."
 COLDWAR_FRA_armament_old_guard_b_followup:0 "Technical Reserve Establishments"
 COLDWAR_FRA_armament_old_guard_b_followup_desc:0 "Maintain technical schools and reserve workshops able to sustain the planned equipment base. More consistent workmanship raises the production ceiling, while instruction remains a recurring public expense."
 COLDWAR_FRA_armament_psu_a:0 "Worker-Managed Arsenal Suppliers"
 COLDWAR_FRA_armament_psu_a_desc:0 "Extend self-management to selected public arsenals and defence suppliers. Workplace experimentation improves adaptation and the production ceiling, while negotiated investment slows the creation of new arms facilities."
 COLDWAR_FRA_armament_psu_a_followup:0 "Cooperative Maintenance Network"
 COLDWAR_FRA_armament_psu_a_followup_desc:0 "Connect participating workshops through shared repair standards and technical instruction. More dependable maintenance reduces land equipment upkeep, while the common training network needs public financing."
 COLDWAR_FRA_armament_psu_b:0 "Dual-Use Industrial Conversion"
 COLDWAR_FRA_armament_psu_b_desc:0 "Redirect industrial investment toward civilian plants under local and worker supervision. Civilian factories can be built faster, while the available armament capacity contracts."
 COLDWAR_FRA_armament_psu_b_followup:0 "Regional Technical Institutes"
 COLDWAR_FRA_armament_psu_b_followup_desc:0 "Keep the engineering skills of converting regions in public institutes and cooperative laboratories. Their work supports national research, while the state accepts the continuing education commitment."
 COLDWAR_FRA_armament_ecology_a:0 "Civilian Conversion Mandate"
 COLDWAR_FRA_armament_ecology_a_desc:0 "Redirect industrial investment toward public utilities, repair and new civilian plants. Civilian factories can be built faster, while the national armament base becomes smaller."
 COLDWAR_FRA_armament_ecology_a_followup:0 "Civil Protection Workshops"
 COLDWAR_FRA_armament_ecology_a_followup_desc:0 "Use the converted engineering base for emergency infrastructure and common maintenance services. Public works become easier to carry through and land equipment support costs fall, giving the conversion programme a practical civilian purpose."
 COLDWAR_FRA_armament_ecology_b:0 "Retained Defence Workshops"
 COLDWAR_FRA_armament_ecology_b_desc:0 "Preserve a limited domestic armament base while subjecting procurement to tighter public scrutiny. Equipment production remains stronger, while sustaining the retained establishment carries higher operating costs."
 COLDWAR_FRA_armament_ecology_b_followup:0 "Service-Life Engineering"
 COLDWAR_FRA_armament_ecology_b_followup_desc:0 "Make repairability and long service life central to the equipment still ordered by the state. Better standards and cheaper support preserve useful capability, while new arms-factory expansion receives a lower priority."
 COLDWAR_FRA_armament_cid_a:0 "Local Repair Contracts"
 COLDWAR_FRA_armament_cid_a_desc:0 "Open maintenance work to the workshops and small firms represented by the CID. Support becomes less costly and production methods improve, while large-scale armament volume gives way to dispersed repair work."
 COLDWAR_FRA_armament_cid_a_followup:0 "Workshop Tooling Credit"
 COLDWAR_FRA_armament_cid_a_followup_desc:0 "Give qualifying workshops tax relief for machine tools and common production standards. Better equipment raises the production ceiling, while the Treasury accepts lower corporate-tax receipts."
 COLDWAR_FRA_armament_cid_b:0 "Small-Supplier Workshare"
 COLDWAR_FRA_armament_cid_b_desc:0 "Reserve a meaningful share of armament investment for independent French suppliers. The programme expands production and new facilities, while investment relief reduces the state’s corporate-tax yield."
 COLDWAR_FRA_armament_cid_b_followup:0 "Interchangeable Components"
 COLDWAR_FRA_armament_cid_b_followup_desc:0 "Bring independent suppliers into common parts specifications and technical instruction. Better methods and easier repairs support the equipment base, while the training programme adds to education expenditure."
 COLDWAR_FRA_armament_national_a:0 "National Sourcing Requirement"
 COLDWAR_FRA_armament_national_a_desc:0 "Direct procurement toward protected French production and long domestic equipment series. The industrial base and its production ceiling strengthen, while reduced supplier competition raises land equipment upkeep."
 COLDWAR_FRA_armament_national_a_followup:0 "Domestic Assembly Plants"
 COLDWAR_FRA_armament_national_a_followup_desc:0 "Prioritise domestic assembly and replacement-part facilities in the allocation of industrial investment. Arms facilities expand more quickly, while established national specifications make production less adaptable."
 COLDWAR_FRA_armament_national_b:0 "Dispersed Territorial Workshops"
 COLDWAR_FRA_armament_national_b_desc:0 "Give territorial defence a network of repair shops and smaller production establishments. Support costs fall and standardised runs become easier to sustain, while dispersed work limits armament volume."
 COLDWAR_FRA_armament_national_b_followup:0 "Mobilisation Depot Network"
 COLDWAR_FRA_armament_national_b_followup_desc:0 "Build procurement planning around regional depots, repair stocks and dependable distribution. Army supply consumption falls, while depot priorities slow the expansion of new arms factories."
 COLDWAR_FRA_research_gaullist_a:0 "Armoured Fleet Renewal"
 COLDWAR_FRA_research_gaullist_a_desc:0 "Give the land-armament establishments a defined programme for the next tank generation. The work continues France’s armoured engineering tradition while taking priority over a parallel fighter initiative."
 COLDWAR_FRA_research_gaullist_a_research_available_0:0 "At least one listed technology in Main Battle Tank Development remains unresearched. Completed design programme: Armoured Vehicle Design."
 COLDWAR_FRA_research_gaullist_a_research_available_1:0 "At least one listed technology in Main Battle Tank Development remains unresearched."
 COLDWAR_FRA_research_gaullist_a_award:0 "Main Battle Tank Development"
 COLDWAR_FRA_research_gaullist_b:0 "National Fighter Programme"
 COLDWAR_FRA_research_gaullist_b_desc:0 "Give the national aeronautical sector priority for the next fighter generation. Design continuity supports an independent air force, while land-armament research waits for a different budget."
 COLDWAR_FRA_research_gaullist_b_research_available_0:0 "At least one listed technology in Air-Superiority Fighter Development remains unresearched. Completed design programme: Aircraft Design."
 COLDWAR_FRA_research_gaullist_b_research_available_1:0 "At least one listed technology in Air-Superiority Fighter Development remains unresearched."
 COLDWAR_FRA_research_gaullist_b_award:0 "Air-Superiority Fighter Development"
 COLDWAR_FRA_research_orthodox_gaullist_a:0 "Submarine Design Continuity"
 COLDWAR_FRA_research_orthodox_gaullist_a_desc:0 "Protect the specialist design skills of the naval arsenals through a new attack-submarine study. The programme sustains sovereign naval engineering and claims the research priority otherwise available to land equipment."
 COLDWAR_FRA_research_orthodox_gaullist_a_research_available_0:0 "At least one listed technology in Submarine Engineering remains unresearched. Completed design programme: Naval Vessel Design."
 COLDWAR_FRA_research_orthodox_gaullist_a_award:0 "Submarine Engineering"
 COLDWAR_FRA_research_orthodox_gaullist_b:0 "National Armoured Systems"
 COLDWAR_FRA_research_orthodox_gaullist_b_desc:0 "Concentrate sovereign development funds on the next generation of French armoured equipment. National control over land-force design takes precedence over the competing submarine study."
 COLDWAR_FRA_research_orthodox_gaullist_b_research_available_0:0 "At least one listed technology in Main Battle Tank Development remains unresearched. Completed design programme: Armoured Vehicle Design."
 COLDWAR_FRA_research_orthodox_gaullist_b_research_available_1:0 "At least one listed technology in Main Battle Tank Development remains unresearched."
 COLDWAR_FRA_research_orthodox_gaullist_b_award:0 "Main Battle Tank Development"
 COLDWAR_FRA_research_liberal_a:0 "Competitive Aircraft Design"
 COLDWAR_FRA_research_liberal_a_desc:0 "Back a competitive multirole-aircraft development programme while retaining a French design base. Concentrated funding advances the selected air programme rather than a parallel microelectronics initiative."
 COLDWAR_FRA_research_liberal_a_research_available_0:0 "At least one listed technology in Multirole Aircraft Development remains unresearched. Completed design programme: Aircraft Design."
 COLDWAR_FRA_research_liberal_a_research_available_1:0 "At least one listed technology in Multirole Aircraft Development remains unresearched."
 COLDWAR_FRA_research_liberal_a_award:0 "Multirole Aircraft Development"
 COLDWAR_FRA_research_liberal_b:0 "Defence Microelectronics"
 COLDWAR_FRA_research_liberal_b_desc:0 "Give component research a larger place in the defence investment programme. Microprocessors support future equipment integration and civilian industry, while the aircraft initiative gives way to this priority."
 COLDWAR_FRA_research_liberal_b_research_available_0:0 "At least one listed technology in Microprocessor Research remains unresearched."
 COLDWAR_FRA_research_liberal_b_award:0 "Microprocessor Research"
 COLDWAR_FRA_research_centre_a:0 "Naval Escort Engineering"
 COLDWAR_FRA_research_centre_a_desc:0 "Sustain the naval arsenals and their regional suppliers through a new escort design study. The government chooses this long-term maritime programme over an immediate infantry-support research priority."
 COLDWAR_FRA_research_centre_a_research_available_0:0 "At least one listed technology in Frigate Engineering remains unresearched. Completed design programme: Naval Vessel Design."
 COLDWAR_FRA_research_centre_a_award:0 "Frigate Engineering"
 COLDWAR_FRA_research_centre_b:0 "Territorial Fire Support"
 COLDWAR_FRA_research_centre_b_desc:0 "Concentrate development on the weapons carried by territorial and conscript formations. Practical fire-support improvements receive priority over the competing naval escort study."
 COLDWAR_FRA_research_centre_b_research_available_0:0 "At least one listed technology in Infantry Support Weapons remains unresearched."
 COLDWAR_FRA_research_centre_b_award:0 "Infantry Support Weapons"
 COLDWAR_FRA_research_radical_a:0 "Engineer Equipment Trials"
 COLDWAR_FRA_research_radical_a_desc:0 "Give civilian technical authorities and the army a common programme of engineer-equipment trials. Applied field studies receive the scarce research allocation ahead of a national microelectronics initiative."
 COLDWAR_FRA_research_radical_a_research_available_0:0 "At least one listed technology in Combat Engineer Equipment remains unresearched."
 COLDWAR_FRA_research_radical_a_award:0 "Combat Engineer Equipment"
 COLDWAR_FRA_research_radical_b:0 "Defence Electronics Institutes"
 COLDWAR_FRA_research_radical_b_desc:0 "Connect public technical institutes with the engineering problems of future equipment. Microprocessor research takes priority over a separate field-engineer trial programme."
 COLDWAR_FRA_research_radical_b_research_available_0:0 "At least one listed technology in Microprocessor Research remains unresearched."
 COLDWAR_FRA_research_radical_b_award:0 "Microprocessor Research"
 COLDWAR_FRA_research_socialist_a:0 "Public Aeronautics Programme"
 COLDWAR_FRA_research_socialist_a_desc:0 "Give public direction of high-technology industry a concrete aeronautical programme. A new multirole design receives the development priority, while the competing armoured project waits."
 COLDWAR_FRA_research_socialist_a_research_available_0:0 "At least one listed technology in Multirole Aircraft Development remains unresearched. Completed design programme: Aircraft Design."
 COLDWAR_FRA_research_socialist_a_research_available_1:0 "At least one listed technology in Multirole Aircraft Development remains unresearched."
 COLDWAR_FRA_research_socialist_a_award:0 "Multirole Aircraft Development"
 COLDWAR_FRA_research_socialist_b:0 "Armoured Modernisation Study"
 COLDWAR_FRA_research_socialist_b_desc:0 "Direct the public armament programme toward the next tank generation and its industrial skills. Land-force renewal receives the development allocation instead of a parallel aeronautical project."
 COLDWAR_FRA_research_socialist_b_research_available_0:0 "At least one listed technology in Main Battle Tank Development remains unresearched. Completed design programme: Armoured Vehicle Design."
 COLDWAR_FRA_research_socialist_b_research_available_1:0 "At least one listed technology in Main Battle Tank Development remains unresearched."
 COLDWAR_FRA_research_socialist_b_award:0 "Main Battle Tank Development"
 COLDWAR_FRA_research_communist_a:0 "Territorial Weapons Research"
 COLDWAR_FRA_research_communist_a_desc:0 "Give the popular territorial-defence programme practical support through infantry-weapon development. Direct benefits for reserve formations take priority over a heavier artillery research programme."
 COLDWAR_FRA_research_communist_a_research_available_0:0 "At least one listed technology in Infantry Support Weapons remains unresearched."
 COLDWAR_FRA_research_communist_a_award:0 "Infantry Support Weapons"
 COLDWAR_FRA_research_communist_b:0 "Public Artillery Development"
 COLDWAR_FRA_research_communist_b_desc:0 "Give the public arsenals a focused programme for improving artillery and fire support. More demanding industrial development receives priority over the smaller infantry-weapon initiative."
 COLDWAR_FRA_research_communist_b_research_available_0:0 "At least one listed technology in Artillery Development remains unresearched."
 COLDWAR_FRA_research_communist_b_research_available_1:0 "At least one listed technology in Artillery Development remains unresearched."
 COLDWAR_FRA_research_communist_b_award:0 "Artillery Development"
 COLDWAR_FRA_research_old_guard_a:0 "Standardised Artillery Series"
 COLDWAR_FRA_research_old_guard_a_desc:0 "Concentrate the technical establishments on the artillery series required by the national plan. Standardised firepower receives priority over the competing tank-development allocation."
 COLDWAR_FRA_research_old_guard_a_research_available_0:0 "At least one listed technology in Artillery Development remains unresearched."
 COLDWAR_FRA_research_old_guard_a_research_available_1:0 "At least one listed technology in Artillery Development remains unresearched."
 COLDWAR_FRA_research_old_guard_a_award:0 "Artillery Development"
 COLDWAR_FRA_research_old_guard_b:0 "Armoured Production Study"
 COLDWAR_FRA_research_old_guard_b_desc:0 "Give the central armament plan a development study for the next tank generation. The government commits its research priority to armoured production rather than the parallel artillery programme."
 COLDWAR_FRA_research_old_guard_b_research_available_0:0 "At least one listed technology in Main Battle Tank Development remains unresearched. Completed design programme: Armoured Vehicle Design."
 COLDWAR_FRA_research_old_guard_b_research_available_1:0 "At least one listed technology in Main Battle Tank Development remains unresearched."
 COLDWAR_FRA_research_old_guard_b_award:0 "Main Battle Tank Development"
 COLDWAR_FRA_research_psu_a:0 "Citizen Defence Equipment"
 COLDWAR_FRA_research_psu_a_desc:0 "Give the citizen-defence programme a practical technical agenda within the existing armed forces. Infantry-support development receives priority over the civilian laboratories’ microelectronics proposal."
 COLDWAR_FRA_research_psu_a_research_available_0:0 "At least one listed technology in Infantry Support Weapons remains unresearched."
 COLDWAR_FRA_research_psu_a_award:0 "Infantry Support Weapons"
 COLDWAR_FRA_research_psu_b:0 "Civilian Technical Laboratories"
 COLDWAR_FRA_research_psu_b_desc:0 "Preserve advanced engineering skills in laboratories with civilian accountability. Microprocessor research offers wide technical uses, while the dedicated infantry-support study gives way."
 COLDWAR_FRA_research_psu_b_research_available_0:0 "At least one listed technology in Microprocessor Research remains unresearched."
 COLDWAR_FRA_research_psu_b_award:0 "Microprocessor Research"
 COLDWAR_FRA_research_ecology_a:0 "Defensive Engineer Studies"
 COLDWAR_FRA_research_ecology_a_desc:0 "Keep a limited technical research programme for the engineer formations retained in national defence. Practical engineering studies receive priority over a competing programme in electronic instrumentation."
 COLDWAR_FRA_research_ecology_a_research_available_0:0 "At least one listed technology in Combat Engineer Equipment remains unresearched."
 COLDWAR_FRA_research_ecology_a_award:0 "Combat Engineer Equipment"
 COLDWAR_FRA_research_ecology_b:0 "Electronic Instrumentation"
 COLDWAR_FRA_research_ecology_b_desc:0 "Give public laboratories a focused programme in the components used by measurement and control systems. Microprocessor research receives the allocation instead of a separate combat-engineer study."
 COLDWAR_FRA_research_ecology_b_research_available_0:0 "At least one listed technology in Microprocessor Research remains unresearched."
 COLDWAR_FRA_research_ecology_b_award:0 "Microprocessor Research"
 COLDWAR_FRA_research_cid_a:0 "Affordable Support Weapons"
 COLDWAR_FRA_research_cid_a_desc:0 "Concentrate limited defence development funds on equipment suited to the existing territorial force. The programme favours practical infantry support over an investment in advanced electronics."
 COLDWAR_FRA_research_cid_a_research_available_0:0 "At least one listed technology in Infantry Support Weapons remains unresearched."
 COLDWAR_FRA_research_cid_a_award:0 "Infantry Support Weapons"
 COLDWAR_FRA_research_cid_b:0 "Workshop Electronics"
 COLDWAR_FRA_research_cid_b_desc:0 "Give the technical schools serving smaller suppliers a focused microelectronics programme. Component expertise receives priority over the competing infantry-support allocation."
 COLDWAR_FRA_research_cid_b_research_available_0:0 "At least one listed technology in Microprocessor Research remains unresearched."
 COLDWAR_FRA_research_cid_b_award:0 "Microprocessor Research"
 COLDWAR_FRA_research_national_a:0 "Territorial Firepower Programme"
 COLDWAR_FRA_research_national_a_desc:0 "Direct national development funds toward the firepower of territorial formations. The government chooses a focused artillery programme over a competing armoured design study."
 COLDWAR_FRA_research_national_a_research_available_0:0 "At least one listed technology in Artillery Development remains unresearched."
 COLDWAR_FRA_research_national_a_research_available_1:0 "At least one listed technology in Artillery Development remains unresearched."
 COLDWAR_FRA_research_national_a_award:0 "Artillery Development"
 COLDWAR_FRA_research_national_b:0 "National Armoured Development"
 COLDWAR_FRA_research_national_b_desc:0 "Give protected domestic armament production a development programme for the next tank generation. Armoured engineering receives priority over the competing artillery allocation."
 COLDWAR_FRA_research_national_b_research_available_0:0 "At least one listed technology in Main Battle Tank Development remains unresearched. Completed design programme: Armoured Vehicle Design."
 COLDWAR_FRA_research_national_b_research_available_1:0 "At least one listed technology in Main Battle Tank Development remains unresearched."
 COLDWAR_FRA_research_national_b_award:0 "Main Battle Tank Development"
 COLDWAR_FRA_presidential_republic:0 "Presidential Republic"
 COLDWAR_FRA_presidential_republic_desc:0 "A strong presidency and a disciplined parliamentary majority give the government considerable initiative. Central direction also sustains an extensive administrative apparatus."
 COLDWAR_FRA_unsettled_social_compromise:0 "Unsettled Social Compromise"
 COLDWAR_FRA_unsettled_social_compromise_desc:0 "The upheaval of 1968 has left a contested settlement between organised labour, employers and the state. Wage concessions and electoral victory restored order, but confidence in the social bargain remains fragile."
 COLDWAR_FRA_uneven_modernisation:0 "Uneven Modernisation"
 COLDWAR_FRA_uneven_modernisation_desc:0 "Large industrial programmes have transformed France, while regional access and local development remain uneven. The state’s capacity for major industry is real, and so is the gap between the capital and the provinces."
 COLDWAR_FRA_social_mistrust:0 "Social Mistrust"
 COLDWAR_FRA_social_mistrust_desc:0 "A new social settlement has reduced the disruption of 1968, but mistrust still weighs on public confidence."
 COLDWAR_FRA_modern_industry:0 "Modern Industrial Base"
 COLDWAR_FRA_modern_industry_desc:0 "French industrial programmes retain their capacity to develop large civilian enterprises."
