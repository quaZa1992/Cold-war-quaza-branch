<script>
(()=>{
__KISSINGER_MODEL__
const root=document.getElementById('ks-statecraft');
const D=__KISSINGER_DATA__;
const ATLAS=__ICON_ATLAS__;
const byKey=Object.fromEntries(D.nodes.map(n=>[n.key,n]));
const $=s=>root.querySelector(s);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={tab:'contest',chapter:'kurds',country:'iraq',selected:'kurds',funding:2,divisions:2,policy:'security',settlement:false,delivery:'active',campaigns:{},timelines:{}};
let camera={x:0,y:0,z:1};
let dragging=null;
let savedCamera=null;
const artNames=['Henry Kissinger','The National Security Council','Balance of Power','The Kurdish Question','The Iraqi Dossier','The Iranian Dossier','The Turkish Dossier','Syrian Kurdish Contacts','Covert Communications','Material Assistance','Regional Countermeasures','Desert Storm'];
const artFocus=['doctrine','limited','expanded','kurds','irq_contacts','irn_dossier','tur_dossier','syr_contacts','covert','irq_fund','irq_settlement','gulf_desert_storm'];
function art(index,cls=''){return `<span class="ks-icon ${cls}" data-icon="${index}" aria-hidden="true"></span>`;}
function paint(){root.querySelectorAll('[data-icon]').forEach(e=>{const n=+e.dataset.icon;e.style.backgroundImage=`url("${ATLAS}")`;e.style.backgroundPosition=`${(n%4)*100/3}% ${Math.floor(n/4)*50}%`;});}
function applySaved(v){if(!v||typeof v!=='object')return;let s=v.modelContent??v;const tabs=['statecraft','kurds','contest','icons'];if(tabs.includes(s.tab))state.tab=s.tab;if(['statecraft','kurds','gulf',...Object.keys(D.countries)].includes(s.chapter))state.chapter=s.chapter;if(D.countries[s.country])state.country=s.country;if(byKey[s.selected])state.selected=s.selected;if(Number.isFinite(s.funding))state.funding=Math.max(0,Math.min(3,+s.funding));if(Number.isFinite(s.divisions))state.divisions=Math.max(0,Math.min(4,+s.divisions));if(['routine','security','investment','autonomy'].includes(s.policy))state.policy=s.policy;if(typeof s.settlement==='boolean')state.settlement=s.settlement;if(['active','unsigned','suspended'].includes(s.delivery))state.delivery=s.delivery;if(s.campaigns&&typeof s.campaigns==='object'){for(const k of Object.keys(D.countries)){const c=s.campaigns[k];if(c&&Number.isFinite(c.funding)&&Number.isFinite(c.divisions)&&['routine','security','investment','autonomy'].includes(c.policy)&&['active','unsigned','suspended'].includes(c.delivery))state.campaigns[k]={funding:Math.max(0,Math.min(3,c.funding)),divisions:Math.max(0,Math.min(4,c.divisions)),policy:c.policy,settlement:!!c.settlement,delivery:c.delivery};}}}
function restoreRuns(v){const s=v?.modelContent??v;if(!s?.timelines)return;for(const [key,c] of Object.entries(D.countries))state.timelines[key]=KSContestModel.restore(s.timelines[key],c.base);}
function stash(){state.campaigns[state.country]={funding:state.funding,divisions:state.divisions,policy:state.policy,settlement:state.settlement,delivery:state.delivery};}
function setCountry(key){stash();state.country=key;const c=state.campaigns[key]??{funding:2,divisions:2,policy:'security',settlement:false,delivery:'active'};Object.assign(state,c);}
function save(){stash();if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{...state},privateContent:null}).catch(()=>{});}
function groups(n){if(n.existing)return (n.prerequisite_groups??[]).map(g=>g.map(id=>byKey['gulf_'+id.replace('COLDWAR_USA_gulf_','')]?.title??id).join(' OR '));return(n.prerequisite_groups??[]).map(g=>g.map(k=>byKey[k]?.title??k).join(' OR '));}
function select(key,store=true){if(!byKey[key])return;state.selected=key;renderInspector();root.querySelectorAll('[data-focus]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.focus===key?'true':'false'));if(store)save();}
function renderInspector(){const n=byKey[state.selected]??byKey.irq_fund;let e='';let scope='';for(const x of n.effects){if(x.country!==scope&&x.kind!=='heading'){scope=x.country;e+=`<div class="ks-party">${escape(scope.toUpperCase())}</div>`;}if(x.kind==='heading'){e+=`<div class="ks-heading">${escape(x.label)}</div>`;continue;}e+=`<div class="ks-effect ${x.kind==='spirit'?'ks-spirit':''}"><span>${escape(x.label)}</span><b>${escape(x.value)}</b></div>`;}
 const req=[...groups(n),...n.requirements];
 $('#ks-inspector').innerHTML=`<div class="ks-inspector-head">${art(n.icon)}<div><h3>${escape(n.title)}</h3><span class="ks-tag">${escape(n.existing?'Existing Gulf chapter':n.history)}</span></div></div><p class="ks-desc">${escape(n.description)}</p><div class="ks-effect"><span>Completion time</span><b>${n.days} days</b></div>${req.length?'<div class="ks-minihead">Requirements</div><ul class="ks-req">'+req.map(r=>'<li>'+escape(r)+'</li>').join('')+'</ul>':''}${n.exclusive.length?'<div class="ks-minihead">Mutually exclusive with</div><ul class="ks-req">'+n.exclusive.map(k=>'<li>'+escape(byKey[k]?.title??k)+'</li>').join('')+'</ul>':''}${e?'<div class="ks-minihead">Effects</div>'+e:''}${n.existing&&!e?'<div class="ks-minihead">Reference-only card</div><p class="ks-desc">Existing programme terms are not reproduced in this concept inspector.</p>':''}${!n.existing?'<button type="button" class="ks-action cursor-interaction" id="ks-open-contest">Open Regional Contest</button>':'<div class="ks-minihead">Independent crisis access</div><p class="ks-desc">The Kuwait intervention does not require a Kurdish campaign. Relief, negotiated autonomy and existing Gulf programme identities are retained.</p>'}`;
 $('#ks-open-contest')?.addEventListener('click',()=>{if(D.countries[n.chapter])setCountry(n.chapter);state.tab='contest';render();save();});paint();}
function setCamera(){const c=$('#ks-canvas');c.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.z})`;}
function resetCamera(fit=false){const viewport=$('#ks-camera');const height=+( $('#ks-canvas').dataset.height??850);camera.z=fit?Math.max(.42,Math.min(1,(viewport.clientWidth-20)/720,(viewport.clientHeight-20)/height)):1;camera.x=(viewport.clientWidth-720*camera.z)/2;camera.y=fit?8:12;setCamera();}
function pathFor(a,b){let ay=a.y+112,by=b.y+4;let mid=(ay+by)/2;if(a.key==='covert'&&b.key==='political')return `M${a.x},${ay} V470 H700 V630 H${b.x} V${by}`;if(Math.abs(a.x-b.x)<1&&by-ay>180){const rail=a.x<250?a.x-98:a.x>500?a.x+98:a.x-100;return `M${a.x},${ay} V${ay+28} H${rail} V${by-24} H${b.x} V${by}`;}return `M${a.x},${ay} V${mid} H${b.x} V${by}`;}
function drawTree(){const canvas=$('#ks-canvas');let visible=state.chapter==='kurds'?[byKey.kurds]:D.nodes.filter(n=>n.chapter===state.chapter);const special=state.chapter==='kurds';if(state.chapter==='statecraft')visible.push({...byKey.kurds,x:340,y:490});const height=special?450:Math.max(...visible.map(n=>n.y))+150;canvas.dataset.height=height;canvas.style.height=height+'px';let paths='';const local=Object.fromEntries(visible.map(n=>[n.key,n]));for(const n of visible){for(const p of n.parents){if(local[p])paths+=`<path d="${pathFor(local[p],n)}"/>`;}for(const x of n.exclusive){if(local[x]&&n.key<x)paths+=`<path class="ks-xline" d="M${n.x+82},${n.y+96} H${local[x].x-82}"/>`;}}
 let more='';if(special){Object.keys(D.countries).forEach((key,i)=>{const c=D.countries[key],x=90+i*176;paths+=`<path d="M${x},184 V225"/>`;more+=`<button type="button" class="ks-countrycard cursor-interaction" data-open-country="${key}" style="left:${x}px" aria-pressed="${state.country===key}">${art(c.icon)}<strong>${c.name}</strong><small>${escape(c.status)}</small></button>`;});more+='<div class="ks-hub">FOUR DISTINCT POLITICAL ARENAS</div>';}
 canvas.innerHTML=`<svg class="ks-links" width="720" height="${height}" viewBox="0 0 720 ${height}" aria-hidden="true">${special?'<path d="M340,132 V184 H90 M340,184 H618"/>':''}${paths}</svg>`+visible.map(n=>`<button type="button" class="ks-focus cursor-interaction ${n.existing?'ks-existing':''}" data-focus="${n.key}" aria-pressed="${state.selected===n.key}" style="left:${n.x}px;top:${n.y}px" aria-label="Inspect ${escape(n.title)}">${art(n.icon)}<span class="ks-name">${escape(n.title)}</span>${n.history.startsWith('Alternate')||n.history.startsWith('Alternative')?'<span class="ks-era">ALT</span>':''}</button>`).join('')+more;
 canvas.querySelectorAll('[data-focus]').forEach(b=>b.addEventListener('click',()=>{if(!dragging?.moved){if(state.tab==='statecraft'&&b.dataset.focus==='kurds'){state.tab='kurds';state.chapter='kurds';state.selected='kurds';render();save();}else select(b.dataset.focus);}}));canvas.querySelectorAll('[data-open-country]').forEach(b=>b.addEventListener('click',()=>{if(!dragging?.moved)openCountry(b.dataset.openCountry);}));paint();requestAnimationFrame(()=>{if(savedCamera){camera=savedCamera;savedCamera=null;setCamera();}else resetCamera(false);});}
function openCountry(key){setCountry(key);state.chapter=key;state.tab='kurds';state.selected=D.countries[key].entry;render();save();}
function shortcuts(){const panel=$('#ks-shortcuts');if(state.tab==='statecraft'){panel.innerHTML='<button type="button" class="ks-country cursor-interaction" data-shortcut="kurds">THE KURDS</button><button type="button" class="ks-country cursor-interaction" data-shortcut="gulf">GULF CRISIS</button>';}else{panel.innerHTML=(state.tab!=='contest'&&state.tab!=='icons'?'<button type="button" class="ks-country cursor-interaction" data-shortcut="kurds" aria-pressed="'+(state.chapter==='kurds')+'">HUB</button>':'')+Object.entries(D.countries).map(([k,c])=>`<button type="button" class="ks-country cursor-interaction" data-country="${k}" aria-pressed="${state.country===k&&state.chapter!=='kurds'}">${c.name}</button>`).join('');}
 panel.querySelectorAll('[data-country]').forEach(b=>b.onclick=()=>{if(state.tab==='contest'){setCountry(b.dataset.country);render();save();}else openCountry(b.dataset.country);});panel.querySelectorAll('[data-shortcut]').forEach(b=>b.onclick=()=>{state.chapter=b.dataset.shortcut;state.tab='kurds';state.selected=state.chapter==='gulf'?'gulf_desert_storm':'kurds';render();save();});}
function stageQuote(){const keys={iraq:[null,'irq_contacts','irq_fund','irq_front'],iran:[null,'irn_contacts','irn_fund','irn_front'],turkey:[null,'tur_dossier','tur_networks','tur_front'],syria:[null,'syr_contacts','syr_voice','syr_front']};const n=byKey[keys[state.country][state.funding]];let quote={cash:0,equipment:0,weekly:0,pp:0};if(!n)return quote;for(const e of n.effects){if(e.country!=='USA')continue;if(e.label==='Treasury')quote.cash=Math.abs(parseFloat(e.value.replace(/[^0-9.]/g,'')))||0;if(e.label==='Infantry Equipment')quote.equipment=Math.abs(parseInt(e.value.replace(/[^0-9-]/g,'')))||0;if(e.value.includes('Billion/week'))quote.weekly=Math.abs(parseFloat((e.value.match(/-?\$?\d+(?:\.\d+)?/)??['0'])[0].replace('$','')))||0;if(e.label==='Political Power')quote.pp=Math.abs(parseInt(e.value))||0;}return quote;}
function simulate(){const key=state.country;state.timelines[key]??=KSContestModel.initial(D.countries[key].base);return KSContestModel.inspect(state.timelines[key],state);}
function weeklyCosts(){return {us:stageQuote().weekly,defender:{routine:0,security:.00050,investment:.00025,autonomy:.00020}[state.policy]};}
function advanceContest(days){simulate();state.timelines[state.country]=KSContestModel.advance(state.timelines[state.country],state,days,weeklyCosts());renderContest();save();}
function renderContest(){
 const activeControl=document.activeElement?.id,c=D.countries[state.country],r=simulate(),quote=stageQuote(),weekly=weeklyCosts();
 const fundingText=['No active support','Political contacts','Funded organisation','Arms and training'][state.funding];
 const actualFunding=state.delivery==='active'&&!r.accepted?weekly.us:0;
 $('#ks-contest').innerHTML=`
 <div class="ks-contest-top">${art(c.icon)}<div><h3>${c.name}: THE REGIONAL CONTEST</h3><div class="ks-statusline">${escape(c.status)} · Standing campaign</div></div></div>
 <div class="ks-warning">${escape(c.penalty)}</div>
 <div class="ks-inputgroup"><label>US commitment<output id="ks-funding-label">${fundingText}</output><input id="ks-funding" type="range" min="0" max="3" step="1" value="${state.funding}" aria-label="US commitment"></label><label>Defender field divisions<output id="ks-divisions-label">${state.divisions} divisions currently stationed</output><input id="ks-divisions" type="range" min="0" max="4" step="1" value="${state.divisions}" aria-label="Defender field divisions"></label></div>
 <div class="ks-inputgroup"><label>Defender response<select id="ks-policy"><option value="routine">Routine policing</option><option value="security">Standing security programme</option><option value="investment">Investment and local rights</option><option value="autonomy">Autonomy negotiations</option></select></label><div><label class="ks-check"><input type="checkbox" id="ks-settlement" ${state.settlement?'checked':''} ${state.policy!=='autonomy'?'disabled':''}>Local representatives accept the autonomy terms</label><div class="ks-statusline">Independent agreement, separate from US sponsorship.</div></div></div>
 <label>Delivery agreement<select id="ks-delivery"><option value="active">Active: transit and local partner accepted</option><option value="unsigned">Unsigned offer</option><option value="suspended">Delivery channel suspended</option></select></label>
 <div class="ks-minihead">REGIONAL UNREST · ${r.unrest>=80?'Critical':r.unrest>=50?'Rising':r.unrest>=25?'Tense':'Contained'}</div>
 <div class="ks-region ${r.unrest>=80?'hot':''}" aria-live="polite"><div class="ks-regiontop"><span>${c.name}: Kurdish regions</span><span>${Math.round(r.unrest)}/100</span></div><div class="ks-meter"><div class="ks-meterfill" style="width:${r.unrest}%"></div></div></div>
 <div class="ks-statusline">${r.pacification>=50?'Stabilisation gains remain strong, including after troop withdrawal.':r.pacification>5?'Earlier stabilisation is fading. The region can become restless again.':'No lasting stabilisation established.'}</div>
 <div class="ks-minihead">Campaign week ${Math.floor(r.day/7)}</div>
 <div class="ks-shortcuts" aria-label="Advance campaign"><button type="button" class="ks-smallbtn cursor-interaction" data-advance="28">Advance 4 weeks</button><button type="button" class="ks-smallbtn cursor-interaction" data-advance="182">Advance 26 weeks</button><button type="button" class="ks-smallbtn cursor-interaction" data-advance="364">Advance 52 weeks</button></div>
 <svg class="ks-simline" id="ks-sim-chart" role="img" aria-label="Highest regional unrest during the continuing campaign, latest fifty-two weeks"></svg>
 <div class="ks-outcome" aria-live="polite">${r.accepted?'An accepted autonomy agreement keeps armed mobilisation in check.':r.opened?'Uprising opportunity. Local consent and territorial control determine the outcome.':r.warning?'Uprising warning. Reinforcement, regional investment or an accepted settlement can still contain the crisis.':r.pacification>5?'Earlier operations still help contain unrest. Their effect fades gradually.':'Contain unrest through security operations, investment or an accepted agreement.'}</div>
 <details><summary class="ks-minihead cursor-interaction">Costs and commitments</summary>
 <div class="ks-costs"><div><strong>UNITED STATES</strong><span>Stage setup quote: $${quote.cash.toFixed(3)} Billion</span><span>Political Power: ${quote.pp?'-'+quote.pp:'0'}</span><span>Funding quote: $${weekly.us.toFixed(5)} Billion/week</span><span>Current funding: $${actualFunding.toFixed(5)} Billion/week</span><span>Arms programme: ${quote.equipment.toLocaleString('en-US')} infantry equipment</span><span>Recurring spending to date: $${r.usSpent.toFixed(5)} Billion</span></div><div><strong>${c.name}</strong><span>Security budget: $${weekly.defender.toFixed(5)} Billion/week</span><span>Army personnel cost: ${state.divisions?'+5%':'0%'}</span><span>Field commitment: ${state.divisions} divisions on operation</span><span>Recurring spending to date: $${r.defenderSpent.toFixed(5)} Billion</span></div></div></details>`;
 $('#ks-policy').value=state.policy;$('#ks-delivery').value=state.delivery;
 $('#ks-delivery').onchange=e=>{state.delivery=e.target.value;renderContest();save();};
 $('#ks-funding').oninput=e=>{state.funding=+e.target.value;$('#ks-funding-label').textContent=['No active support','Political contacts','Funded organisation','Arms and training'][state.funding];};
 $('#ks-funding').onchange=()=>{renderContest();save();};
 $('#ks-divisions').oninput=e=>{state.divisions=+e.target.value;$('#ks-divisions-label').textContent=state.divisions+' divisions currently stationed';};
 $('#ks-divisions').onchange=()=>{renderContest();save();};
 $('#ks-policy').onchange=e=>{state.policy=e.target.value;renderContest();save();};
 $('#ks-settlement').onchange=e=>{state.settlement=e.target.checked;renderContest();save();};
 root.querySelectorAll('[data-advance]').forEach(b=>b.onclick=()=>advanceContest(+b.dataset.advance));
 if(activeControl&&['ks-funding','ks-divisions','ks-policy','ks-settlement','ks-delivery'].includes(activeControl))$('#'+activeControl)?.focus({preventScroll:true});
 paint();requestAnimationFrame(()=>drawSimChart(r.history));
 $('#ks-inspector').innerHTML=`<div class="ks-inspector-head">${art(10)}<div><h3>The Regional Contest</h3><span class="ks-tag">Simple campaign proposal</span></div></div><div class="ks-minihead">Security operation</div><p class="ks-desc">Commit troops and funding for a sustained operation. It lowers unrest and leaves stabilisation gains that fade slowly after withdrawal.</p><div class="ks-minihead">Regional investment</div><p class="ks-desc">Fund local institutions and rights. Its benefits build more slowly and reduce the need for repeated security operations.</p><div class="ks-minihead">Autonomy agreement</div><p class="ks-desc">Negotiate with local representatives. An accepted settlement contains armed mobilisation while its terms are upheld.</p><div class="ks-minihead">American support</div><p class="ks-desc">Money and equipment strengthen a willing local movement. Renewed assistance can undermine an earlier period of calm.</p><button type="button" class="ks-action cursor-interaction" id="ks-return-tree">Open ${c.name} focus branch</button>`;
 $('#ks-return-tree').onclick=()=>openCountry(state.country);paint();
}
function drawSimChart(history){const svg=$('#ks-sim-chart');if(!svg)return;const w=Math.max(220,svg.clientWidth),h=155,p=28,last=history.at(-1)[0],first=Math.max(0,last-364),end=Math.max(first+28,last),points=history.filter(v=>v[0]>=first);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const x=t=>p+(t-first)/(end-first)*(w-p-12),y=v=>h-28-v/100*(h-42);svg.innerHTML=`<path class="ks-threshold" d="M${p},${y(80)} H${w-12}"/><text x="${w-12}" y="${y(80)-5}" text-anchor="end">Unrest 80</text><path d="${points.map((v,i)=>(i?'L':'M')+x(v[0])+','+y(v[1])).join(' ')}"/><circle cx="${x(last)}" cy="${y(history.at(-1)[1])}" r="3" fill="var(--ks-gold)"/><text x="${p}" y="${h-7}">Week ${Math.floor(first/7)}</text><text x="${w-12}" y="${h-7}" text-anchor="end">Week ${Math.floor(end/7)}</text><text x="${p}" y="12">Highest regional unrest</text>`;}
function renderGallery(){$('#ks-gallery').innerHTML=artNames.map((name,i)=>`<button type="button" class="ks-art cursor-interaction" data-art="${i}" aria-pressed="${artFocus[i]===state.selected}">${art(i)}<span>${name}</span></button>`).join('');$('#ks-gallery').querySelectorAll('[data-art]').forEach(b=>b.onclick=()=>{select(artFocus[+b.dataset.art]);renderGallery();});paint();}
function render(){root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===state.tab?'true':'false'));const isTree=['statecraft','kurds'].includes(state.tab);$('#ks-camera').hidden=!isTree;$('#ks-camera').style.height=state.chapter==='kurds'?'440px':(root.clientWidth<450?'650px':'710px');$('#ks-camera-tools').hidden=!isTree;$('#ks-contest').hidden=state.tab!=='contest';$('#ks-gallery').hidden=state.tab!=='icons';if(state.tab==='statecraft')state.chapter='statecraft';const names={statecraft:'KISSINGER’S STATECRAFT',kurds:'THE KURDS',gulf:'THE GULF CRISIS'};$('#ks-section-title').textContent=state.tab==='contest'?'REGIONAL CONTEST':state.tab==='icons'?'FOCUS ICON CONCEPTS':names[state.chapter]??D.countries[state.chapter]?.name??'THE KURDS';shortcuts();if(isTree)drawTree();if(state.tab==='contest')renderContest();else{renderInspector();if(state.tab==='icons')renderGallery();}$('#ks-design-note').textContent=state.tab==='contest'?'DESIGN MODEL · Proposed rates and prices · Garrison quality, borders and engine behaviour require implementation validation':'DESIGN PREVIEW · Proposed costs and effects · Approximate section layout, not an in-game screenshot';}
root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;if(state.tab==='kurds'){state.chapter='kurds';state.selected='kurds';}render();save();});
root.querySelectorAll('[data-camera]').forEach(b=>b.onclick=()=>{const a=b.dataset.camera;if(a==='fit')resetCamera(true);else if(a==='normal')resetCamera(false);else{camera.z=Math.max(.45,Math.min(1.5,camera.z+(a==='in'?.1:-.1)));setCamera();}save();});
const viewport=$('#ks-camera');viewport.addEventListener('pointerdown',e=>{dragging={x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y,moved:false};});viewport.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-dragging.x,dy=e.clientY-dragging.y;if(Math.abs(dx)+Math.abs(dy)>8){dragging.moved=true;camera.x=dragging.cx+dx;camera.y=dragging.cy+dy;setCamera();}});window.addEventListener('pointerup',()=>{if(dragging?.moved)save();const d=dragging;setTimeout(()=>{if(dragging===d)dragging=null;},0);});viewport.addEventListener('wheel',e=>{e.preventDefault();camera.y-=e.deltaY;camera.x-=e.deltaX;setCamera();},{passive:false});
$('#ks-research-toggle').onclick=()=>{const open=$('#ks-research').classList.toggle('open');$('#ks-research-toggle').setAttribute('aria-expanded',String(open));};
$('#ks-count').textContent=`${D.new_focus_count} proposed focuses · ${D.existing_visible_gulf} existing Gulf cards retained`;
$('#ks-research').innerHTML=`<p>Historical Iraq programme; alternative campaigns in Iran, Turkey and Syria. All numerical rewards and simulation rates are proposed balance. The existing Iraqi campaign is the mechanical donor: two states at 80 unrest, 30 qualifying days, then 45 warning days.</p><ul>${D.guardrails.map(g=>'<li>'+escape(g)+'</li>').join('')}</ul><p>${escape(D.evidence.mockup)} No loaded focus, decision, idea or event file is modified by this preview.</p><ul>${D.sources.map(s=>`<li><a href="${escape(s.url)}" target="_blank" rel="noreferrer">${escape(s.label)}</a></li>`).join('')}</ul>`;
applySaved(window.openai?.widgetState);restoreRuns(window.openai?.widgetState);window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState;if(next){applySaved(next);restoreRuns(next);render();}});render();
if(globalThis.Tweak){const style={iconSize:83};const tweak=new Tweak({container:root, onChange:()=>{root.querySelectorAll('.ks-focus .ks-icon').forEach(i=>{i.style.width=style.iconSize+'px';i.style.height=style.iconSize+'px';});}});tweak.addSlider(style,'iconSize',{min:72,max:90,step:1,unit:'px',label:'Focus medallion size'});}
new ResizeObserver(()=>{if(state.tab==='contest')drawSimChart(simulate().history);}).observe(root);
})();
</script>
