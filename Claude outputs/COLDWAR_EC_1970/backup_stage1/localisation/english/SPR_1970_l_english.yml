 SPR_1970_failing_health_dynamic_modifier:0 "The Generalissimo's Failing Health"
 SPR_1970_failing_health_dynamic_modifier_tt:0 "§YFranco's Health:§! [?SPR_1970_franco_health|0]/100\n§YBunker Influence:§! [?SPR_1970_bunker_influence|0]/100\n§YAperturista Influence:§! [?SPR_1970_aperturista_influence|0]/100\n\nThis spirit is active from the start of the 1970 scenario. Health decline, penalties and factional pressure are recalculated automatically every month."
 SPR_1970_transition_modifier:0 "The Democratic Settlement"
 SPR_1970_transition_modifier_desc:0 "The accumulated constitutional, administrative, diplomatic and economic consequences of Spain's negotiated transition."
 SPR_1970_falangist_modifier:0 "The National-Syndicalist Order"
 SPR_1970_falangist_modifier_desc:0 "The accumulated institutional, social, military and economic character of the restored Falangist state."
 SPR_1970_continuity_modifier:0 "Institutional Francoism"
 SPR_1970_continuity_modifier_desc:0 "The accumulated compromises through which the army, Crown, bureaucracy and security services preserve authoritarian continuity after Franco."
 SPR_1970_juan_carlos_designated_successor:0 "The Designated Successor"
 SPR_1970_juan_carlos_designated_successor_desc:0 "Prince Juan Carlos is formally positioned to inherit the headship of state, giving the regime a legal answer to succession without resolving what he will do with that authority."
 SPR_1970_carrero_blanco_government:0 "The Carrero Blanco Government"
 SPR_1970_carrero_blanco_government_desc:0 "Carrero Blanco directs daily government and protects institutional continuity while Franco remains head of state."
 SPR_1970_aperturista_networks:0 "Aperturista Networks"
 SPR_1970_aperturista_networks_desc:0 "Reformist administrators, monarchists and technocrats are coordinating around a controlled post-Franco opening."
 SPR_1970_matesa_coverup:0 "The MATESA Cover-Up"
 SPR_1970_matesa_coverup_desc:0 "The scandal has been contained politically, but the price is deeper patronage, lost revenue and another layer of protected corruption."
 SPR_1970_international_condemnation:0 "International Condemnation"
 SPR_1970_international_condemnation_desc:0 "Repression and anachronistic regime rhetoric have damaged Spain's legitimacy abroad and strengthened foreign scrutiny."
 SPR_1970_managed_opening:0 "A Managed Opening"
 SPR_1970_managed_opening_desc:0 "Restricted participation improves Spain's standing abroad and gives reformists room to organise, but every concession consumes political capital and strains the regime's fragile unity."
 SPR_1970_state_of_exception:0 "State of Exception"
 SPR_1970_state_of_exception_desc:0 "Emergency powers have restored surface order through censorship, detention and an expanded security presence."
 SPR_1970_carrero_vacuum:0 "The Carrero Vacuum"
 SPR_1970_carrero_vacuum_desc:0 "The assassination of the President of the Government has removed the regime's principal architect of continuity."
 SPR_1970_operation_ogre_foiled:0 "Operation Ogre Foiled"
 SPR_1970_operation_ogre_foiled_desc:0 "Security services disrupted ETA's plot before Carrero Blanco could be killed, strengthening the hardline continuity project."
 SPR_1970_interregnum:0 "The Regency Interregnum"
 SPR_1970_interregnum_desc:0 "The Regency Council preserves legal continuity, but divided authority paralyses policy, undermines confidence and leaves Spain vulnerable while the succession is settled."
 SPR_1970_national_mourning_idea:0 "National Mourning"
 SPR_1970_national_mourning_idea_desc:0 "Franco's death has brought public life to a pause. Shared mourning steadies the country, but government business slows and public appetite for confrontation recedes."
 SPR_1970_23f_crisis_idea:0 "The 23-F Crisis"
 SPR_1970_23f_crisis_idea_desc:0 "The seizure of the Cortes has paralysed civilian authority. National cohesion is collapsing, the chain of command is uncertain and Spain remains dangerously exposed until the Crown and high command choose a side."
 SPR_1970_monarchy_of_reform:0 "A Monarchy of Reform"
 SPR_1970_monarchy_of_reform_desc:0 "Juan Carlos combines legal succession with a cautiously expanding mandate for political reform."
 SPR_1970_falangist_command:0 "Falangist Command"
 SPR_1970_falangist_command_desc:0 "The Falange has subordinated the state to a renewed National-Syndicalist command structure."
 SPR_1970_continuity_state:0 "The Continuity State"
 SPR_1970_continuity_state_desc:0 "The late-Franco institutions have survived their founder through a security-backed authoritarian executive."
 SPR_1970_transition_government:0 "Government of Transition"
 SPR_1970_transition_government_desc:0 "The monarchy is dismantling inherited authoritarian institutions while trying to preserve administrative order and military neutrality."
 SPR_1970_constitutional_monarchy:0 "The Constitutional Monarchy"
 SPR_1970_constitutional_monarchy_desc:0 "The Crown operates within a democratic constitution, elected government and a legally protected pluralist system."
 SPR_1970_old_shirts_mobilised:0 "The Old Shirts Mobilised"
 SPR_1970_old_shirts_mobilised_desc:0 "Falangist veterans and street organisations provide recruits, intimidation and political mobilisation. Their return radicalises public life, disrupts civil order and diverts civilian resources."
 SPR_1970_armed_forces_loyalty:0 "Armed Forces Loyalty"
 SPR_1970_armed_forces_loyalty_desc:0 "The officer corps has accepted the Falangist seizure in exchange for political authority, resources and institutional privilege."
 SPR_1970_restored_falange:0 "The Restored Falange"
 SPR_1970_restored_falange_desc:0 "A centralized Falangist organization now directs state appointments, syndicates and political mobilization."
 SPR_1970_national_syndicalist_state:0 "The National-Syndicalist State"
 SPR_1970_national_syndicalist_state_desc:0 "Spain has been reorganized as a militarized one-party state built around national syndicates, political discipline and industrial mobilization."
 SPR_1970_regency_council:0 "The Regency Council"
 SPR_1970_regency_council_desc:0 "A collective succession authority shields the executive and maintains legal continuity after Franco's death."
 SPR_1970_army_guarantees_continuity:0 "The Army Guarantees Continuity"
 SPR_1970_army_guarantees_continuity_desc:0 "Senior commanders have committed the armed forces to protecting the institutions and hierarchy of late Francoism."
 SPR_1970_empowered_bunker:0 "The Empowered Bunker"
 SPR_1970_empowered_bunker_desc:0 "Hardline Francoists dominate security policy, senior appointments and the limits placed on political participation."
 SPR_1970_francoism_without_franco_idea:0 "Francoism Without Franco"
 SPR_1970_francoism_without_franco_idea_desc:0 "The personal rule of the Caudillo has become a durable authoritarian system sustained by army, police and bureaucracy."

 SPR_1970_franco_succession_category:0 "Franco's Health and Succession"
 SPR_1970_franco_succession_category_desc:0 "§YHealth:§! [?SPR_1970_franco_health|0]/100\n§YBunker:§! [?SPR_1970_bunker_influence|0]/100\n§YAperturistas:§! [?SPR_1970_aperturista_influence|0]/100\n\nMedical management can slow institutional paralysis, while audiences and delegations shape who will dominate the succession."
 SPR_1970_operation_ogre_category:0 "Operation Ogre"
 SPR_1970_operation_ogre_category_desc:0 "§YSecurity:§! [?SPR_1970_operation_ogre_security|0]/100\n§YRequired to foil the plot:§! 70\n\nSecurity measures consume political and financial resources. Preserving Carrero's public routine is immediately useful but makes the attack more likely to succeed."
 SPR_1970_succession_clock:0 "The Succession Clock"
 SPR_1970_succession_clock_desc:0 "Franco's health is managed entirely through this decision system. If declining health does not end his rule earlier, the historical deadline of 20 November 1975 will close this chapter of the regime."
 SPR_1970_convene_the_medical_council:0 "Convene the Medical Council"
 SPR_1970_convene_the_medical_council_desc:0 "Bring senior physicians to El Pardo and fund a more intensive treatment schedule."
 SPR_1970_rest_at_el_pardo:0 "Rest at El Pardo"
 SPR_1970_rest_at_el_pardo_desc:0 "Cancel public engagements and let ministers carry the visible burden of government."
 SPR_1970_stage_a_public_appearance:0 "Stage a Public Appearance"
 SPR_1970_stage_a_public_appearance_desc:0 "A carefully managed appearance reassures loyalists, but the physical strain accelerates Franco's decline."
 SPR_1970_delegate_routine_to_carrero:0 "Delegate Routine to Carrero"
 SPR_1970_delegate_routine_to_carrero_desc:0 "Let the President of the Government absorb more daily work, preserving Franco's strength while empowering continuity hardliners."
 SPR_1970_hear_the_aperturistas:0 "Hear the Aperturistas"
 SPR_1970_hear_the_aperturistas_desc:0 "Grant reformist officials a private audience and permit them to coordinate succession proposals."
 SPR_1970_receive_the_bunker_delegation:0 "Receive the Bunker Delegation"
 SPR_1970_receive_the_bunker_delegation_desc:0 "Reassure the old guard that the principles and personnel of the regime will survive their founder."
 SPR_1970_operation_ogre_countdown:0 "ETA Prepares Operation Ogre"
 SPR_1970_operation_ogre_countdown_desc:0 "ETA is preparing to assassinate Carrero Blanco. Raise Security to 70 before the operation is executed."
 SPR_1970_rotate_the_prime_ministers_route:0 "Rotate the Prime Minister's Route"
 SPR_1970_rotate_the_prime_ministers_route_desc:0 "Break Carrero's predictable travel pattern and impose last-minute route changes."
 SPR_1970_infiltrate_eta_safehouses:0 "Infiltrate ETA Safehouses"
 SPR_1970_infiltrate_eta_safehouses_desc:0 "Expand surveillance and penetrate the Madrid logistical network supporting the cell."
 SPR_1970_authorize_an_armored_convoy:0 "Authorize an Armored Convoy"
 SPR_1970_authorize_an_armored_convoy_desc:0 "Replace the discreet official car with a hardened escort package and police-controlled streets."
 SPR_1970_preserve_the_public_routine:0 "Preserve the Public Routine"
 SPR_1970_preserve_the_public_routine_desc:0 "Avoid visible alarm and keep Carrero's schedule unchanged. The regime gains confidence now at the cost of security."

 SPR_1970.1.t:0 "The Aging Generalissimo"
 SPR_1970.1.d:0 "Franco still signs decrees and arbitrates disputes, but access to him is narrowing around doctors, family and trusted ministers. Every faction presents its own policy as the Caudillo's wish. Spain's immediate challenge is no longer whether succession will come, but whether the state can control it when it does."
 SPR_1970.1.a:0 "The state must outlive the man."
 SPR_1970.2.t:0 "The MATESA Files"
 SPR_1970.2.d:0 "The machinery-export firm MATESA received vast public export credits while its sales claims collapsed under scrutiny. The scandal has become a proxy war between technocrats associated with Opus Dei and Falangist ministers eager to destroy them. Any investigation will therefore redistribute power inside the regime."
 SPR_1970.2.a:0 "Bring the files to the Council of Ministers."
 SPR_1970.3.t:0 "The Burgos Trial"
 SPR_1970.3.d:0 "A military court has imposed severe sentences on ETA defendants at Burgos, including death penalties. Foreign governments, church figures and demonstrations across Europe demand clemency, while the Bunker insists that retreat will advertise weakness."
 SPR_1970.3.a:0 "Commute the death sentences."
 SPR_1970.3.b:0 "Confirm the military court's judgment."
 SPR_1970.4.t:0 "The Old Conspiracies Return"
 SPR_1970.4.d:0 "During a prepared address, Franco returns to the regime's old anti-Masonic and antisemitic conspiracy themes, blaming hidden foreign forces for domestic dissent and Spain's isolation. Broadcasters await instructions: air the address intact and rally the old guard, or edit it into a restrained defense of national sovereignty."
 SPR_1970.4.a:0 "Broadcast the Caudillo without alteration."
 SPR_1970.4.b:0 "The Foreign Ministry will soften the address."
 SPR_1970.5.t:0 "Government by Medical Bulletin"
 SPR_1970.5.d:0 "Cabinet meetings are increasingly arranged around medical reports from El Pardo. Ministers delay contentious decisions rather than risk an audience, and rival offices circulate contradictory accounts of Franco's wishes. The appearance of unity is becoming expensive to maintain."
 SPR_1970.5.a:0 "Issue a reassuring communique."
 SPR_1970.6.t:0 "Pressure for a Temporary Transfer"
 SPR_1970.6.d:0 "Franco's physicians warn that routine state business now threatens his remaining strength. Senior officials propose a temporary delegation of daily authority. Accepting would preserve the Caudillo but empower those administering the transfer; refusal would demonstrate command at a dangerous physical cost."
 SPR_1970.6.a:0 "Delegate routine affairs."
 SPR_1970.6.b:0 "Franco remains in command."
 SPR_1970.7.t:0 "Carrero Blanco Heads the Government"
 SPR_1970.7.d:0 "Luis Carrero Blanco has been appointed President of the Government. Franco remains head of state, but the separation of offices is now real. Carrero intends to preserve the regime through disciplined administration, a restored monarchy stripped of liberal ambitions and the continued loyalty of the armed forces."
 SPR_1970.7.a:0 "Continuity now has an architect."
 SPR_1970.8.t:0 "Fragments of an ETA Plot"
 SPR_1970.8.d:0 "Security reports suggest that an ETA cell has established support in Madrid and is studying Carrero Blanco's movements. The evidence is incomplete, but his routine is dangerously predictable. Protective measures may expose the threat publicly and consume scarce political capital."
 SPR_1970.8.a:0 "Begin a discreet security review."
 SPR_1970.9.t:0 "Carrero Blanco Assassinated"
 SPR_1970.9.d:0 "A massive explosion beneath Carrero Blanco's route has destroyed his car and killed the President of the Government. ETA has struck at the central pillar of planned continuity. The Bunker demands retaliation, reformists see proof that the existing order cannot survive unchanged, and Franco has lost his most trusted political lieutenant."
 SPR_1970.9.a:0 "The succession has lost its architect."
 SPR_1970.10.t:0 "Operation Ogre Foiled"
 SPR_1970.10.d:0 "Coordinated surveillance, altered movements and hardened protection have exposed the ETA cell before it could strike Carrero Blanco. Arrests across Madrid have preserved the President of the Government and handed the continuity faction a powerful argument for tighter security rule."
 SPR_1970.10.a:0 "Carrero will carry the state forward."
 SPR_1970.11.t:0 "Franco Is Dead"
 SPR_1970.11.d:0 "Francisco Franco has died after nearly four decades at the center of Spanish power. A Regency Council has assumed temporary authority while the court, armed forces, Movement and reformists struggle to define the succession. The legal answer exists; the political answer does not."
 SPR_1970.11.a:0 "Spain enters the post-Franco era."

 # 1974-1975 end of the Franco era
 SPR_1970_the_spirit_of_february:0 "The Spirit of 12 February"
 SPR_1970_the_spirit_of_february_desc:0 "Arias Navarro's programme promises political associations and limited participation without abandoning the Fundamental Laws. Its ambiguity may briefly unite reformers and loyalists, but it cannot satisfy both."
 SPR_1970_contain_the_gironazo:0 "Contain the Gironazo"
 SPR_1970_contain_the_gironazo_desc:0 "The public campaign by Giron and the old guard threatens even the narrowest opening. Isolating its organisers will give Arias room to proceed while sharpening the Bunker's hostility."
 SPR_1970_appease_the_bunker:0 "Appease the Bunker"
 SPR_1970_appease_the_bunker_desc:0 "The Bunker can be reassured with protected offices, firm limits on political association and renewed commitments to the Movement. Reform will survive, but only within a much narrower corridor."
 SPR_1970_the_prince_at_the_helm:0 "The Prince at the Helm"
 SPR_1970_the_prince_at_the_helm_desc:0 "Franco's illness has placed Juan Carlos in temporary command of the state. The prince can use this rehearsal to learn the machinery of power and establish direct ties to ministers and commanders."
 SPR_1970_the_sahara_crisis:0 "The Sahara Crisis"
 SPR_1970_the_sahara_crisis_desc:0 "The Green March and competing Moroccan and Mauritanian claims have made Spain's hold on Western Sahara untenable without escalation. Madrid must choose between an orderly withdrawal and a costly colonial stand."

 # La Transicion
 SPR_1970_the_amnesty_law:0 "The Amnesty Law"
 SPR_1970_the_amnesty_law_desc:0 "A broad amnesty will release political prisoners and allow exiles to return, removing one of the opposition's central demands. It also asks victims and institutions of the old order to accept a difficult legal compromise."
 SPR_1970_the_moncloa_pacts:0 "The Moncloa Pacts"
 SPR_1970_the_moncloa_pacts_desc:0 "Government, trade unions, employers and democratic parties will share the burden of fighting inflation and stabilising the transition. Wage restraint and fiscal reform can buy peace, but only at real social cost."
 SPR_1970_restore_the_generalitat:0 "Restore the Generalitat"
 SPR_1970_restore_the_generalitat_desc:0 "Josep Tarradellas can return from exile to head a provisional Generalitat. Restoring Catalonia's historic institution will channel regional demands into negotiation rather than rupture."
 SPR_1970_apply_to_the_european_communities:0 "Pursue European Accession"
 SPR_1970_apply_to_the_european_communities_desc:0 "Spain applied to join the European Communities in 1977. The constitutional settlement now allows Madrid to deepen negotiations, align national institutions with European standards and make democratic consolidation part of the accession process."
 SPR_1970_the_state_of_autonomies:0 "The State of Autonomies"
 SPR_1970_the_state_of_autonomies_desc:0 "Constitutional autonomy will be extended through negotiated statutes and elected regional institutions. Decentralisation can integrate Spain's nationalities and regions, but uneven expectations will persist."
 SPR_1970_the_23f_crisis:0 "The 23-F Crisis"
 SPR_1970_the_23f_crisis_desc:0 "Lieutenant Colonel Tejero's seizure of the Cortes has exposed the transition's most dangerous fault line. The response of the Crown and high command will determine whether constitutional government survives the night."
 SPR_1970_the_king_defends_the_constitution:0 "The King Defends the Constitution"
 SPR_1970_the_king_defends_the_constitution_desc:0 "Juan Carlos will publicly order the armed forces to obey the constitutional authorities. A clear defence of legality can break the coup while binding the Crown's legitimacy to democracy."
 SPR_1970_consolidate_the_democracy:0 "Consolidate Democracy"
 SPR_1970_consolidate_the_democracy_desc:0 "Peaceful alternation in office and the acceptance of electoral defeat will prove that the constitutional order no longer depends on one government or one king. The transition can finally become ordinary democratic politics."

 # Falangist seizure
 SPR_1970_the_gironazo_triumphant:0 "The Gironazo Triumphant"
 SPR_1970_the_gironazo_triumphant_desc:0 "Giron's assault on reform has rallied the Bunker and forced Arias to retreat. The regime will present immobility as fidelity, closing the narrow opening before it can become a precedent."
 SPR_1970_utrera_takes_the_secretariat:0 "Utrera Takes the Secretariat"
 SPR_1970_utrera_takes_the_secretariat_desc:0 "Jose Utrera Molina will turn the Secretariat-General of the Movement into the directing office of the Falangist state. His appointment joins the old guard's programme to a functioning party bureaucracy."
 SPR_1970_subordinate_the_crown:0 "Subordinate the Crown"
 SPR_1970_subordinate_the_crown_desc:0 "The Bourbon succession may proceed only if the king accepts the political supremacy of the Movement. The Crown will provide continuity and ceremony without acquiring an independent mandate."
 SPR_1970_purge_the_technocrats:0 "Purge the Technocrats"
 SPR_1970_purge_the_technocrats_desc:0 "Opus Dei administrators and market-oriented officials are blamed for corruption, social dislocation and ideological drift. Removing them will place economic policy back under reliable political command."
 SPR_1970_restore_the_fuero_del_trabajo:0 "Restore the Fuero del Trabajo"
 SPR_1970_restore_the_fuero_del_trabajo_desc:0 "The 1938 labour charter will again define work as a duty regulated through the state rather than a field of free bargaining. Social guarantees will be paired with compulsory discipline."
 SPR_1970_politicise_the_youth:0 "Politicise the Youth"
 SPR_1970_politicise_the_youth_desc:0 "Schools, universities and youth organisations will be reorganised around service, hierarchy and national-syndicalist doctrine. The regime seeks a generation that inherited loyalty instead of merely submitting to it."
 SPR_1970_build_the_vertical_syndicates:0 "Build the Vertical Syndicates"
 SPR_1970_build_the_vertical_syndicates_desc:0 "Workers and employers will be incorporated into state-supervised organisations by branch of production. Class conflict is to be administered inside the regime, not represented by independent unions."
 SPR_1970_autarkic_development:0 "Autarkic Development"
 SPR_1970_autarkic_development_desc:0 "Import substitution, public investment and national control of strategic sectors will reduce exposure to foreign pressure. Independence will come at the cost of efficiency and access to capital."
 SPR_1970_a_third_position_economy:0 "A Third-Position Economy"
 SPR_1970_a_third_position_economy_desc:0 "Spain will reject both liberal capitalism and Marxist planning in favour of corporatist direction, worker participation and strategic ownership. The model promises national solidarity but depends on coercive coordination."
 SPR_1970_the_crown_as_a_facade:0 "The Crown as a Facade"
 SPR_1970_the_crown_as_a_facade_desc:0 "The monarchy will remain as a source of legal continuity and ceremonial unity, while real authority rests with the Movement. The king will reign only so long as he does not govern."
 SPR_1970_the_movimiento_state:0 "The Movimiento-State"
 SPR_1970_the_movimiento_state_desc:0 "Appointments, unions, youth organisations and the Cortes will be brought under a single Movement hierarchy. The distinction between party and state will become largely formal."

 # Francoist continuity
 SPR_1970_bind_the_crown_to_18_july:0 "Bind the Crown to 18 July"
 SPR_1970_bind_the_crown_to_18_july_desc:0 "Juan Carlos will be crowned only after an unequivocal commitment to the victory of 18 July and the Fundamental Principles of the Movement. Succession will preserve the regime rather than reinterpret it."
 SPR_1970_arias_stays:0 "Arias Stays"
 SPR_1970_arias_stays_desc:0 "Carlos Arias Navarro will remain President of the Government and guardian of Franco's institutional legacy. Continuity and a narrow administrative opening will take precedence over constitutional reform."
 SPR_1970_associations_not_parties:0 "Associations, Not Parties"
 SPR_1970_associations_not_parties_desc:0 "Limited political associations may operate inside the Movement, but independent parties will remain prohibited. Controlled competition can refresh the regime without conceding popular sovereignty."
 SPR_1970_retain_the_technocrats:0 "Retain the Technocrats"
 SPR_1970_retain_the_technocrats_desc:0 "Market-oriented administrators will remain in office to protect growth, investment and the machinery of government. Their expertise is useful so long as political authority remains beyond their reach."
 SPR_1970_an_authoritarian_crown:0 "An Authoritarian Crown"
 SPR_1970_an_authoritarian_crown_desc:0 "The monarchy will preserve Franco's Fundamental Laws, military guarantees and controlled representation rather than introduce parliamentary sovereignty. Royal authority will modernise the regime without democratising it."
 SPR_1970_an_emergency_against_eta:0 "An Emergency Against ETA"
 SPR_1970_an_emergency_against_eta_desc:0 "ETA's campaign will be met with special courts, expanded intelligence powers and reinforced deployments in the north. Security may improve, but collective pressure will deepen political estrangement."
 SPR_1970_renew_the_american_base_agreements:0 "Renew the American Base Agreements"
 SPR_1970_renew_the_american_base_agreements_desc:0 "The American base agreements will be renewed in exchange for military assistance, investment and diplomatic recognition. Strategic partnership offers the regime external legitimacy without requiring political convergence."
 SPR_1970_the_organic_cortes:0 "The Organic Cortes"
 SPR_1970_the_organic_cortes_desc:0 "The Cortes will continue to represent families, municipalities and syndicates rather than competing parties. Consultation will be permitted, but sovereignty will remain with the institutions of the regime."
 SPR_1970_an_opening_without_elections:0 "An Opening Without Elections"
 SPR_1970_an_opening_without_elections_desc:0 "Press latitude, administrative consultation and restricted associations can be offered without submitting the executive to a national vote. The opening is intended to absorb pressure, not transfer power."
 SPR_1970_a_national_salvation_directorate:0 "A National Salvation Directorate"
 SPR_1970_a_national_salvation_directorate_desc:0 "A council of senior officers and trusted civilians will assume emergency authority to prevent both revolution and uncontrolled reform. Its mandate will be temporary in law and indefinite in practice."

