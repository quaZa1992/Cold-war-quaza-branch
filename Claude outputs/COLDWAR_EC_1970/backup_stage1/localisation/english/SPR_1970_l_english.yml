l_english:
 SPR_1970_franco_government_shortcut:0 "The Twilight of Francoism"
 SPR_1970_succession_shortcut:0 "The Succession"

 # 1970 scenario party names
 SPR_1970.conservatism_reformists:0 "£generic_conservatism_small Democratic Reformists"
 SPR_1970.conservatism_reformists_desc:0 "Conservative reformists within and around the late Francoist institutions seek a controlled transition to representative government without a revolutionary break with the state."
 SPR_1970.conservatism_ucd:0 "£generic_conservatism_small Union of the Democratic Centre (UCD)"
 SPR_1970.conservatism_ucd_desc:0 "The Union of the Democratic Centre is Adolfo Suarez's broad coalition of Christian democrats, liberals, social democrats and moderate former regime officials, united behind an orderly democratic transition."
 SPR_1970.liberalism_fpdl:0 "£generic_liberalism_small Federation of Democratic and Liberal Parties (FPDL)"
 SPR_1970.liberalism_fpdl_desc:0 "The Federation of Democratic and Liberal Parties brings together the principal liberal currents of the democratic opposition around civil liberties, parliamentary government and European integration."
 SPR_1970.socialism_psoe:0 "£SPR_psoe Spanish Socialist Workers' Party (PSOE)"
 SPR_1970.socialism_psoe_desc:0 "The Spanish Socialist Workers' Party is the principal social-democratic opposition force. It operates clandestinely under Franco and becomes a major legal party during the democratic transition."
 SPR_1970.Nat_Fascism_movimiento:0 "£SPR_falangists Movimiento Nacional"
 SPR_1970.Nat_Fascism_movimiento_desc:0 "The Movimiento Nacional is the Francoist regime's sole legal political organisation, binding Falangists, traditionalists and state officials into a single authoritarian structure."
 SPR_1970.Nat_Fascism_falange:0 "£SPR_falangists FET y de las JONS"
 SPR_1970.Nat_Fascism_falange_desc:0 "The restored FET y de las JONS claims the legacy of the Falangist revolution and seeks a centralised national-syndicalist state free of royal or parliamentary constraints."
 SPR_1970.Nat_Autocracy_armed_forces:0 "£SPR_spanish_army Spanish Armed Forces"
 SPR_1970.Nat_Autocracy_armed_forces_desc:0 "The Spanish Armed Forces regard themselves as guarantors of the order established in 1939 and the final arbiter of any succession settlement."
 SPR_1970.Nat_Autocracy_continuity:0 "£SPR_spanish_army Francoist Continuity Government"
 SPR_1970.Nat_Autocracy_continuity_desc:0 "The Francoist Continuity Government preserves authoritarian institutions through military guardianship, the security apparatus and the inherited Fundamental Laws."
 SPR_1970.Nat_Autocracy_directorate:0 "£SPR_spanish_army National Salvation Directorate"
 SPR_1970.Nat_Autocracy_directorate_desc:0 "The National Salvation Directorate is an emergency council of senior officers and trusted civilians ruling in the name of order, unity and institutional survival."
 SPR_1970.Monarchist_bourbon:0 "£SPR_spanish_bourbons House of Bourbon"
 SPR_1970.Monarchist_bourbon_desc:0 "The House of Bourbon represents the dynastic restoration embodied by Juan Carlos, whose supporters range from authoritarian royalists to advocates of a constitutional monarchy."
 SPR_1970.conservatism_icon:0 "£generic_conservatism_small"
 SPR_1970.liberalism_icon:0 "£generic_liberalism_small"
 SPR_1970.socialism_icon:0 "£SPR_psoe"
 SPR_1970.Nat_Fascism_icon:0 "£SPR_falangists"
 SPR_1970.Nat_Autocracy_icon:0 "£SPR_spanish_army"
 SPR_1970.Monarchist_icon:0 "£SPR_spanish_bourbons"

 SPR_1970_the_aging_generalissimo:0 "The Aging Generalissimo"
 SPR_1970_the_aging_generalissimo_desc:0 "Spain enters the new decade under a ruler who can no longer personally supervise every ministry, faction and security organ. Franco remains the source of authority, but his declining health is turning every appointment and public appearance into part of the succession struggle."
 SPR_1970_open_the_matesa_files:0 "Open the MATESA Files"
 SPR_1970_open_the_matesa_files_desc:0 "The MATESA export-credit scandal has exposed fraud, ministerial patronage and a widening breach between technocrats and old Falangists. Reopening the files will not cleanse the regime quietly, but it will reveal who still controls the state."
 SPR_1970_rally_the_bunker:0 "Rally the Bunker"
 SPR_1970_rally_the_bunker_desc:0 "Falangist veterans, security officials and uncompromising Francoists reject any opening that could dismantle the victory of 1939. Their support offers discipline now and a dangerous claim on the succession later."
 SPR_1970_permit_a_controlled_inquiry:0 "Permit a Controlled Inquiry"
 SPR_1970_permit_a_controlled_inquiry_desc:0 "A limited investigation can sacrifice compromised officials without placing the entire regime on trial. The Aperturistas will gain room to argue that reform is the only way to preserve order."
 SPR_1970_bury_the_matesa_files:0 "Bury the MATESA Files"
 SPR_1970_bury_the_matesa_files_desc:0 "The state can close ranks, suppress the most damaging evidence and move on. Stability bought through concealment will deepen corruption and convince the Bunker that pressure always works."
 SPR_1970_the_law_of_succession:0 "Secure the Law of Succession"
 SPR_1970_the_law_of_succession_desc:0 "Juan Carlos was designated Franco's successor in 1969. We must now harden that settlement into an operative chain of authority, reassuring monarchists without allowing the prince to become an independent center of power."
 SPR_1970_restore_movement_discipline:0 "Restore Movement Discipline"
 SPR_1970_restore_movement_discipline_desc:0 "The Movimiento Nacional remains the regime's only legal political framework. Renewed appointments, patronage and ideological discipline will make it a weapon in the coming struggle rather than a ceremonial shell."
 SPR_1970_consult_the_aperturistas:0 "Consult the Aperturistas"
 SPR_1970_consult_the_aperturistas_desc:0 "Reformist officials believe limited pluralism and European integration can protect the state from revolutionary rupture. Giving them access will weaken the old guard and create expectations that cannot easily be withdrawn."
 SPR_1970_the_burgos_trial:0 "The Burgos Trial"
 SPR_1970_the_burgos_trial_desc:0 "The military trial of ETA defendants has become an international test of the regime. Confirming death sentences would satisfy the hardliners; clemency would reduce foreign pressure while revealing the limits of repression."
 SPR_1970_prepare_the_prince:0 "Prepare the Prince"
 SPR_1970_prepare_the_prince_desc:0 "Juan Carlos must learn the armed forces, the ministries and the unwritten limits of Francoist power. Whether he becomes custodian or reformer will depend on the allies he gathers before the throne is vacant."
 SPR_1970_empower_the_security_apparatus:0 "Empower the Security Apparatus"
 SPR_1970_empower_the_security_apparatus_desc:0 "Police intelligence and the political-security services will receive wider surveillance authority against ETA, clandestine parties and dissident labor networks. The state will see more, but govern through fear more openly."
 SPR_1970_a_managed_opening:0 "A Managed Opening"
 SPR_1970_a_managed_opening_desc:0 "Carefully selected associations, restrained press latitude and administrative reform can widen participation without immediately legalizing opposition parties. The opening may stabilize succession, or teach society to demand more."
 SPR_1970_the_voice_of_the_caudillo:0 "The Voice of the Caudillo"
 SPR_1970_the_voice_of_the_caudillo_desc:0 "As his physical command fades, Franco increasingly falls back on the conspiratorial anti-Masonic and antisemitic language of the regime's formative years. Broadcasting that rhetoric will mobilize loyalists at a severe diplomatic cost."
 SPR_1970_separate_the_offices:0 "Separate the Offices"
 SPR_1970_separate_the_offices_desc:0 "The Organic Law created a legal distinction between head of state and head of government. Making that separation real will allow a prime minister to manage daily rule while Franco remains the ultimate source of legitimacy."
 SPR_1970_the_state_of_exception:0 "The State of Exception"
 SPR_1970_the_state_of_exception_desc:0 "Suspended guarantees and expanded police powers can impose calm on universities, factories and the Basque provinces. This is continuity through coercion, and every month of it narrows the regime's peaceful exits."
 SPR_1970_empower_carrero_blanco:0 "Empower Carrero Blanco"
 SPR_1970_empower_carrero_blanco_desc:0 "Admiral Luis Carrero Blanco will become President of the Government, translating Franco's personal authority into institutional continuity. His appointment strengthens the Bunker while placing the entire succession project on one man."
 SPR_1970_operation_ogre:0 "Operation Ogre"
 SPR_1970_operation_ogre_desc:0 "ETA is preparing an attack on Carrero Blanco. Changing routes, penetrating safehouses and hardening his convoy may save the architect of continuity, but overt precautions are costly and politically embarrassing."
 SPR_1970_the_last_government_of_the_caudillo:0 "The Last Government of the Caudillo"
 SPR_1970_the_last_government_of_the_caudillo_desc:0 "Operation Ogre has settled the fate of Carrero Blanco, but not the regime he was meant to preserve. The final cabinet of Franco's lifetime must govern through weakening personal authority while reformists, hardliners and the designated heir prepare for the inevitable vacancy."
 SPR_1970_franco_is_dead:0 "Franco Is Dead"
 SPR_1970_franco_is_dead_desc:0 "The Generalissimo is dead. The institutions he balanced against one another must now function without the final arbiter who created them."
 SPR_1970_the_nation_mourns_its_caudillo:0 "The Nation Mourns Its Caudillo"
 SPR_1970_the_nation_mourns_its_caudillo_desc:0 "State mourning will give the armed forces, the Movement and the court a brief common ritual. Beneath the ceremony, every faction is counting loyalties."
 SPR_1970_the_question_of_succession:0 "The Question of Succession"
 SPR_1970_the_question_of_succession_desc:0 "Law names an heir, the Falange claims a revolution and the old institutions demand continuity. Spain must decide which meaning of Francoism, if any, will survive Franco."
 SPR_1970_proclaim_juan_carlos_king:0 "Proclaim Juan Carlos King"
 SPR_1970_proclaim_juan_carlos_king_desc:0 "The Bourbon restoration will proceed under Juan Carlos I. His crown can preserve legal continuity while opening a path toward political reform, provided the armed forces accept the pace of change."
 SPR_1970_the_falangists_seize_control:0 "The Falangists Seize Control"
 SPR_1970_the_falangists_seize_control_desc:0 "The old shirts will reject both Bourbon restoration and parliamentary liberalization. The Movement will claim the state in the name of the National-Syndicalist revolution."
 SPR_1970_preserve_the_francoist_state:0 "Preserve the Francoist State"
 SPR_1970_preserve_the_francoist_state_desc:0 "Neither a reforming monarchy nor a Falangist revolution will be allowed to endanger the state. A regency-backed executive will preserve the institutions, police powers and hierarchy of late Francoism."

 SPR_1970_the_king_of_all_spaniards:0 "The King of All Spaniards"
 SPR_1970_the_king_of_all_spaniards_desc:0 "Juan Carlos must rule beyond the coalition that placed him on the throne. Presenting the Crown as an institution for every Spaniard will give reformists political cover without immediately breaking legal continuity."
 SPR_1970_dismiss_the_old_guard:0 "Dismiss the Old Guard"
 SPR_1970_dismiss_the_old_guard_desc:0 "Entrenched ministers, Movement officials and security hardliners can obstruct every reform from inside the state. Removing them will weaken the Bunker, but it will also unsettle the institutions on which the new monarchy still depends."
 SPR_1970_the_political_reform_act:0 "The Political Reform Act"
 SPR_1970_the_political_reform_act_desc:0 "The old Cortes will be asked to authorize its own replacement through law and referendum. Reform from within the inherited legal order offers a peaceful bridge to representative government, though failure would expose the Crown to both opposition and reaction."
 SPR_1970_dissolve_the_movimiento_nacional:0 "Dissolve the Movimiento Nacional"
 SPR_1970_dissolve_the_movimiento_nacional_desc:0 "The Movimiento Nacional can no longer remain the compulsory political structure of the state. Its political organs will be extinguished, its public functions absorbed by the administration and its monopoly brought to an end."
 SPR_1970_legalise_political_parties:0 "Legalise Political Parties"
 SPR_1970_legalise_political_parties_desc:0 "A representative system requires genuine competitors. Conservatives, liberals, socialists and communists will be permitted to organize openly, accepting short-term polarization in exchange for a legitimate political arena."
 SPR_1970_the_first_free_elections:0 "The First Free Elections"
 SPR_1970_the_first_free_elections_desc:0 "Universal, direct and secret elections will choose new Cortes. Adolfo Suarez and the democratic center must now seek authority from the electorate rather than from the institutions of the former regime."
 SPR_1970_the_spanish_constitution:0 "The Spanish Constitution"
 SPR_1970_the_spanish_constitution_desc:0 "A parliamentary monarchy, popular sovereignty and constitutional rights will replace the Fundamental Laws of Francoism. Ratification will complete the legal transformation of Spain and bind the Crown to democratic government."

 SPR_1970_denounce_the_bourbon_restoration:0 "Denounce the Bourbon Restoration"
 SPR_1970_denounce_the_bourbon_restoration_desc:0 "The Falange will reject a dynasty that survived Francoism without creating it. Spain shall not be handed to a Bourbon court capable of bargaining away the principles of the National Movement."
 SPR_1970_mobilise_the_old_shirts:0 "Mobilise the Old Shirts"
 SPR_1970_mobilise_the_old_shirts_desc:0 "Veterans, youth organizations and provincial Falangist networks will return to public life. Their discipline can intimidate opponents and fill the streets, but their methods will deepen social tension."
 SPR_1970_secure_the_armed_forces:0 "Secure the Armed Forces"
 SPR_1970_secure_the_armed_forces_desc:0 "No National-Syndicalist restoration can survive without the officer corps. Promotions, commands and guarantees of military privilege will bind the armed forces to the new order."
 SPR_1970_restore_the_falange:0 "Restore the Falange"
 SPR_1970_restore_the_falange_desc:0 "The Movement will cease to be a broad Francoist shell and return to an explicitly Falangist organization. Syndicates, party cadres and state administration will again answer to a single revolutionary command."
 SPR_1970_neither_king_nor_republic:0 "Neither King Nor Republic"
 SPR_1970_neither_king_nor_republic_desc:0 "Spain will reject both Bourbon legitimacy and parliamentary sovereignty. Authority will derive from the national community, its syndicates and the state built by the Falange."
 SPR_1970_the_national_syndicalist_state:0 "The National-Syndicalist State"
 SPR_1970_the_national_syndicalist_state_desc:0 "Political, economic and military institutions will be subordinated to a permanent National-Syndicalist order. The Falange will claim that Franco's compromise has finally given way to its unfinished revolution."

 SPR_1970_the_regency_council_assumes_power:0 "The Regency Council Assumes Power"
 SPR_1970_the_regency_council_assumes_power_desc:0 "The Regency Council will convert temporary authority into a disciplined executive. Carrero Blanco, if he survived, or Carlos Arias Navarro will govern in the name of institutional continuity."
 SPR_1970_confirm_the_loyalty_of_the_army:0 "Confirm the Loyalty of the Army"
 SPR_1970_confirm_the_loyalty_of_the_army_desc:0 "The armed forces remain the final guarantor of the order created in 1939. Renewed command oaths and institutional privileges will ensure that no reformist coalition can bypass them."
 SPR_1970_empower_the_bunker:0 "Empower the Bunker"
 SPR_1970_empower_the_bunker_desc:0 "Hardline ministers, police officials and Movement veterans will receive a permanent place in the succession regime. Their loyalty will strengthen continuity while closing the door to meaningful liberalization."
 SPR_1970_francoism_without_franco:0 "Francoism Without Franco"
 SPR_1970_francoism_without_franco_desc:0 "The founder is gone, but his institutional order can endure through bureaucracy, security power and military guardianship. Personal dictatorship will become an impersonal authoritarian state."

