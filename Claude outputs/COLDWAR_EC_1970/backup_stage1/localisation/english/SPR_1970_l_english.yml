 # New national spirits
 SPR_1970_spirit_of_february_idea:0 "The Spirit of 12 February"
 SPR_1970_spirit_of_february_idea_desc:0 "Arias Navarro has opened a narrow channel for associations and consultation while defending the Fundamental Laws."
 SPR_1970_prince_acting_head_of_state_idea:0 "The Prince at the Helm"
 SPR_1970_prince_acting_head_of_state_idea_desc:0 "Temporary authority has given Juan Carlos practical experience and direct relationships across the state."
 SPR_1970_sahara_withdrawal_idea:0 "Withdrawal from Spanish Sahara"
 SPR_1970_sahara_withdrawal_idea_desc:0 "Spain is winding down its colonial administration while managing the military, diplomatic and domestic costs of departure."
 SPR_1970_sahara_commitment_idea:0 "Holding Spanish Sahara"
 SPR_1970_sahara_commitment_idea_desc:0 "Madrid has committed troops and resources to resisting external claims over Spanish Sahara."
 SPR_1970_amnesty_law_idea:0 "The Amnesty Settlement"
 SPR_1970_amnesty_law_idea_desc:0 "Political prisoners and exiles are returning to public life. The settlement accelerates democratisation, but administrative strain and hardline backlash temporarily weaken the government."
 SPR_1970_moncloa_pacts_idea:0 "The Moncloa Pacts"
 SPR_1970_moncloa_pacts_idea_desc:0 "Parties, unions and employers have accepted wage restraint and fiscal reform. The pact steadies the transition and improves productivity and revenue, but adjustment raises the immediate civilian burden and consumes political capital."
 SPR_1970_restored_generalitat_idea:0 "The Restored Generalitat"
 SPR_1970_restored_generalitat_idea_desc:0 "Catalonia's provisional government has returned as a recognised partner in the constitutional transition."
 SPR_1970_european_communities_application_idea:0 "The European Application"
 SPR_1970_european_communities_application_idea_desc:0 "Spain is aligning its institutions and economy with the requirements of eventual European Communities membership."
 SPR_1970_state_of_autonomies_idea:0 "The State of Autonomies"
 SPR_1970_state_of_autonomies_idea_desc:0 "Regional institutions exercise constitutionally protected authority within a decentralised Spanish state."
 SPR_1970_constitution_defended_idea:0 "The Constitution Defended"
 SPR_1970_constitution_defended_idea_desc:0 "The defeat of the coup has strengthened civilian legality and tied the Crown firmly to the constitutional order."
 SPR_1970_democracy_consolidated_idea:0 "Consolidated Democracy"
 SPR_1970_democracy_consolidated_idea_desc:0 "Electoral competition, peaceful alternation and constitutional government have become the accepted rules of Spanish politics."
 SPR_1970_gironazo_ascendant_idea:0 "The Gironazo Ascendant"
 SPR_1970_gironazo_ascendant_idea_desc:0 "The old guard has made public fidelity to the Movement the decisive test for ministers and officials."
 SPR_1970_utrera_secretariat_idea:0 "Utrera's Secretariat"
 SPR_1970_utrera_secretariat_idea_desc:0 "The Secretariat-General has become the administrative and ideological centre of a renewed Falangist Movement."
 SPR_1970_subordinate_crown_idea:0 "The Subordinate Crown"
 SPR_1970_subordinate_crown_idea_desc:0 "The monarchy supplies legal continuity and ceremony while remaining subject to the political command of the Movement."
 SPR_1970_technocrats_purged_idea:0 "Technocrats Purged"
 SPR_1970_technocrats_purged_idea_desc:0 "Economic administration has been subordinated to ideological reliability, weakening expertise while tightening political control."
 SPR_1970_fuero_del_trabajo_idea:0 "The Restored Fuero del Trabajo"
 SPR_1970_fuero_del_trabajo_idea_desc:0 "Labour rights and duties are defined through state authority and compulsory national-syndicalist institutions."
 SPR_1970_politicised_youth_idea:0 "Politicised Youth"
 SPR_1970_politicised_youth_idea_desc:0 "Education and youth organisations have been redirected toward national service, discipline and ideological mobilisation."
 SPR_1970_vertical_syndicates_idea:0 "The Vertical Syndicates"
 SPR_1970_vertical_syndicates_idea_desc:0 "Workers and employers are incorporated into state-controlled organisations divided by branch of production."
 SPR_1970_autarkic_development_idea:0 "Autarkic Development"
 SPR_1970_autarkic_development_idea_desc:0 "Strategic investment and import substitution favour national control over access to foreign capital and markets."
 SPR_1970_third_position_economy_idea:0 "The Third-Position Economy"
 SPR_1970_third_position_economy_idea_desc:0 "Corporatist direction and strategic ownership are presented as an alternative to both liberal capitalism and Marxist planning."
 SPR_1970_crown_facade_idea:0 "The Ceremonial Crown"
 SPR_1970_crown_facade_idea_desc:0 "The monarchy supplies legal continuity and public ceremony while the Movement retains effective power."
 SPR_1970_movimiento_state_idea:0 "The Movimiento-State"
 SPR_1970_movimiento_state_idea_desc:0 "Political organisation, social representation and state administration have been subordinated to one hierarchy."
 SPR_1970_crown_bound_to_18_july_idea:0 "The Crown of 18 July"
 SPR_1970_crown_bound_to_18_july_idea_desc:0 "The monarchy derives its authority from Franco's settlement and is formally bound to preserve the principles of the Movement."
 SPR_1970_arias_government_idea:0 "The Arias Government"
 SPR_1970_arias_government_idea_desc:0 "Arias Navarro balances bureaucratic continuity, security power and limited consultation without surrendering executive control."
 SPR_1970_political_associations_idea:0 "Political Associations"
 SPR_1970_political_associations_idea_desc:0 "Restricted associations channel political competition inside the official institutions while independent parties remain illegal."
 SPR_1970_retained_technocrats_idea:0 "Retained Technocrats"
 SPR_1970_retained_technocrats_idea_desc:0 "Professional administrators and economic planners preserve state capacity while remaining excluded from political direction."
 SPR_1970_authoritarian_crown_idea:0 "The Authoritarian Crown"
 SPR_1970_authoritarian_crown_idea_desc:0 "Royal authority upholds the Fundamental Laws, military guardianship and restricted participation without conceding popular sovereignty."
 SPR_1970_eta_emergency_idea:0 "The ETA Emergency"
 SPR_1970_eta_emergency_idea_desc:0 "Special courts, expanded intelligence powers and reinforced deployments are suppressing ETA. The campaign restores short-term order at the cost of civil liberties, political capital and civilian resources."
 SPR_1970_american_base_agreements_idea:0 "The American Base Agreements"
 SPR_1970_american_base_agreements_idea_desc:0 "American access to Spanish facilities brings military expertise, easier trade and technical cooperation, but leaves Madrid more exposed to American influence and domestic controversy."
 SPR_1970_organic_cortes_idea:0 "Organic Representation"
 SPR_1970_organic_cortes_idea_desc:0 "Families, municipalities and state syndicates provide representation without recognising competing political parties."
 SPR_1970_opening_without_elections_idea:0 "An Administrative Opening"
 SPR_1970_opening_without_elections_idea_desc:0 "Limited consultation and press latitude absorb public pressure while national executive authority remains unelected."
 SPR_1970_national_salvation_directorate_idea:0 "The National Salvation Directorate"
 SPR_1970_national_salvation_directorate_idea_desc:0 "Senior officers and trusted civilians exercise emergency authority in the name of order and institutional survival."


 # Post-1982 party system
 SPR_1970.conservatism_ap:0 "£generic_conservatism_small Alianza Popular (AP)"
 SPR_1970.conservatism_ap_desc:0 "Alianza Popular unites the democratic centre-right around constitutional order, administrative competence, Atlantic cooperation and European integration."
 SPR_1970.liberalism_cds:0 "£generic_liberalism_small Democratic and Social Centre (CDS)"
 SPR_1970.liberalism_cds_desc:0 "The Democratic and Social Centre preserves Adolfo Suárez's reformist liberal centre after the collapse of the UCD coalition."
 SPR_1970.Communist-State_pce:0 "£SPR_pce Communist Party of Spain (PCE)"
 SPR_1970.Communist-State_pce_desc:0 "The Communist Party of Spain follows Santiago Carrillo's Eurocommunist course, accepting parliamentary pluralism while advocating workers' power, social ownership and strategic non-alignment."

 # Post-transition focus tree
 SPR_1970_continue_the_development_plans:0 "Continue the Development Plans"
 SPR_1970_continue_the_development_plans_desc:0 "The technocrats will carry the late Franco-era development plans into a new investment cycle, expanding productive capacity without opening the political system."
 SPR_1970_continue_the_development_plans_effect_tt:0 "Treasury: §R-$2.00 billion§!\nAdd §Gone Civilian Factory§! in a controlled state.\n§YIndustrial Conglomerates§! opinion: §G+5§!"
 SPR_1970_era_of_party_government:0 "The Era of Party Government"
 SPR_1970_era_of_party_government_desc:0 "The emergency logic of the Transition has run its course. Spain will now be governed through durable parties, regular elections and competing cabinet programmes."
 SPR_1970_era_of_party_government_effect_tt:0 "If active, retire §Y$SPR_1970_transition_modifier$§!.\nGain §Y$SPR_1970_legacy_of_transition_idea$§!: $MODIFIER_STABILITY_FACTOR$ §G+4.00%§!, $MODIFIER_DRIFT_DEFENCE_FACTOR$ §G+10.00%§!, $bureaucracy_cost_multiplier_modifier$ §G-3.00%§! and $foreign_influence_defense_modifier$ §G+5.00%§!.\nActivates the post-1982 names of §YAP§!, §YCDS§! and §YPCE§!."
 SPR_1970_carrillos_eurocommunist_mandate:0 "Carrillo's Eurocommunist Mandate"
 SPR_1970_carrillos_eurocommunist_mandate_desc:0 "Santiago Carrillo will seek a parliamentary mandate for a specifically Spanish road to socialism: pluralist, constitutional and independent of Moscow."
 SPR_1970_carrillos_eurocommunist_mandate_effect_tt:0 "§Y$SPR_1970.Communist-State_pce$§! popularity: §G+5.0%§!\nUnlock and activate §Y$SPR_1970_eurocommunist_programme_1_idea$§!: $MODIFIER_POLITICAL_POWER_FACTOR$ §G+1.00%§!, $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ §G+2.00%§! and $MODIFIER_DRIFT_DEFENCE_FACTOR$ §G+3.00%§!."
 SPR_1970_commit_to_constitutional_pluralism:0 "Commit to Constitutional Pluralism"
 SPR_1970_commit_to_constitutional_pluralism_desc:0 "The PCE will bind itself openly to competitive elections, civil rights and peaceful transfers of power, closing the door on one-party rule."
 SPR_1970_commit_to_constitutional_pluralism_effect_tt:0 "Gain §Y$SPR_1970_constitutional_pluralism_idea$§!: $MODIFIER_DRIFT_DEFENCE_FACTOR$ §G+5.00%§! and $foreign_influence_defense_modifier$ §G+5.00%§!.\nGain mutual §YDiplomatic Support§! (§G+20§! opinion) with §YFrance§! and §YWest Germany§!."
 SPR_1970_a_workers_statute:0 "A Workers' Statute"
 SPR_1970_a_workers_statute_desc:0 "A new democratic labour settlement will strengthen collective bargaining and social protection while preserving the constitutional order."
 SPR_1970_a_workers_statute_effect_tt:0 "Treasury: §R-$1.50 billion§!\nIncrease §YSocial Spending§! by one level.\n§YLabour Unions§! opinion: §G+10§!\n§YIndustrial Conglomerates§! opinion: §R-5§!\nActivate §Y$SPR_1970_eurocommunist_programme_2_idea$§!: $MODIFIER_POLITICAL_POWER_FACTOR$ §G+1.00%§!, $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ §G+3.00%§!, $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$ §G+2.00%§!, $social_cost_multiplier_modifier$ §G-2.00%§! and $MODIFIER_DRIFT_DEFENCE_FACTOR$ §G+5.00%§!."
 SPR_1970_a_cooperative_economy:0 "A Cooperative Economy"
 SPR_1970_a_cooperative_economy_desc:0 "Worker participation, cooperative credit and municipal enterprise can broaden ownership without placing the entire economy under central state management."
 SPR_1970_a_cooperative_economy_effect_tt:0 "Treasury: §R-$1.50 billion§!\nAdd §Gone Civilian Factory§! in a controlled state.\nGain §Y$SPR_1970_cooperative_economy_idea$§!: $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ §G+3.00%§! and $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$ §G+3.00%§!.\n§YLabour Unions§! opinion: §G+5§!"
 SPR_1970_nationalise_strategic_industry:0 "Nationalise Strategic Industry"
 SPR_1970_nationalise_strategic_industry_desc:0 "Energy, transport and other strategic industries will be placed under public ownership to secure national productive capacity."
 SPR_1970_nationalise_strategic_industry_effect_tt:0 "Treasury: §R-$2.00 billion§!\nAdd §Gone Civilian Factory§! in a controlled state.\nGain §Y$SPR_1970_strategic_public_industry_idea$§!: $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ §G+5.00%§! and $MODIFIER_CONSUMER_GOODS_FACTOR$ §R+2.00%§!.\n§YIndustrial Conglomerates§! opinion: §R-10§!"
 SPR_1970_a_non_aligned_mediterranean:0 "A Non-Aligned Mediterranean"
 SPR_1970_a_non_aligned_mediterranean_desc:0 "Spain will pursue strategic autonomy, cooperation with its Iberian and Mediterranean neighbours and freedom from automatic bloc discipline."
 SPR_1970_a_non_aligned_mediterranean_effect_tt:0 "Decrease the §YIntervention Law§! by one level.\nGain §Y$SPR_1970_non_aligned_mediterranean_idea$§!: $foreign_influence_defense_modifier$ §G+10.00%§!.\nGain mutual §YDiplomatic Support§! (§G+20§! opinion) with §YPortugal§!, §YYugoslavia§! and §YAlgeria§!.\nIf Spain is a §YNATO member§!, hold a referendum on continued membership."
 SPR_1970_a_democratic_road_to_socialism:0 "A Democratic Road to Socialism"
