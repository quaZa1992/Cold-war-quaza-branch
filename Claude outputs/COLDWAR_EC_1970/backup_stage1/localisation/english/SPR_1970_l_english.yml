 # Democratic cabinet and structural spirits
 SPR_1970_conservative_programme_1_idea:0 "Conservative Programme I"
 SPR_1970_conservative_programme_1_idea_desc:0 "The centre-right cabinet is combining fiscal discipline with an orderly defence of Spain's constitutional institutions."
 SPR_1970_conservative_programme_2_idea:0 "Conservative Programme II"
 SPR_1970_conservative_programme_2_idea_desc:0 "Administrative reform and industrial consensus have given the conservative government a coherent programme for growth and European integration."
 SPR_1970_conservative_programme_3_idea:0 "Conservative Programme III"
 SPR_1970_conservative_programme_3_idea_desc:0 "A durable conservative majority governs through efficient administration, constitutional legitimacy and a firm European orientation."
 SPR_1970_liberal_renewal_1_idea:0 "Liberal Renewal I"
 SPR_1970_liberal_renewal_1_idea_desc:0 "The liberal centre is opening public life and the service economy while restoring a political home for Spain's reformist middle ground."
 SPR_1970_liberal_renewal_2_idea:0 "Liberal Renewal II"
 SPR_1970_liberal_renewal_2_idea_desc:0 "Foreign investment, commercial openness and a growing service sector underpin the liberal government's programme."
 SPR_1970_liberal_renewal_3_idea:0 "Liberal Renewal III"
 SPR_1970_liberal_renewal_3_idea_desc:0 "The liberal centre has become an established governing force committed to efficient administration, open markets and European cooperation."
 SPR_1970_socialist_modernisation_1_idea:0 "Socialist Modernisation I"
 SPR_1970_socialist_modernisation_1_idea_desc:0 "The socialist cabinet has begun modernising Spanish industry while preserving democratic institutions and social partnership."
 SPR_1970_socialist_modernisation_2_idea:0 "Socialist Modernisation II"
 SPR_1970_socialist_modernisation_2_idea_desc:0 "Industrial reform and an expanding welfare state define the government's programme of democratic modernisation."
 SPR_1970_socialist_modernisation_3_idea:0 "Socialist Modernisation III"
 SPR_1970_socialist_modernisation_3_idea_desc:0 "Spain has developed a modern social-democratic settlement combining productive industry, capable public services and technological progress."
 SPR_1970_eurocommunist_programme_1_idea:0 "Eurocommunist Programme I"
 SPR_1970_eurocommunist_programme_1_idea_desc:0 "The Communist Party governs through elections and constitutional pluralism rather than one-party rule."
 SPR_1970_eurocommunist_programme_2_idea:0 "Eurocommunist Programme II"
 SPR_1970_eurocommunist_programme_2_idea_desc:0 "Workers' rights, social administration and democratic economic planning form the second stage of the Eurocommunist programme."
 SPR_1970_eurocommunist_programme_3_idea:0 "Eurocommunist Programme III"
 SPR_1970_eurocommunist_programme_3_idea_desc:0 "Spain is pursuing a democratic road to socialism through parliamentary government, social ownership and institutional pluralism."
 SPR_1970_legacy_of_transition_idea:0 "Legacy of the Transition"
 SPR_1970_legacy_of_transition_idea_desc:0 "Negotiated reform, constitutional monarchy and the rejection of political violence continue to shape the Spanish state after the emergency of the Transition has passed."
 SPR_1970_constitutional_pluralism_idea:0 "Constitutional Pluralism"
 SPR_1970_constitutional_pluralism_idea_desc:0 "The constitutional order explicitly protects competitive elections, political pluralism and peaceful changes of government."
 SPR_1970_cooperative_economy_idea:0 "A Cooperative Economy"
 SPR_1970_cooperative_economy_idea_desc:0 "Cooperative credit and worker participation support productive investment without concentrating the economy entirely in the state."
 SPR_1970_strategic_public_industry_idea:0 "Strategic Public Holdings"
 SPR_1970_strategic_public_industry_idea_desc:0 "Major strategic industries are held by the state, increasing productive capacity at the cost of a larger civilian economic burden."
 SPR_1970_non_aligned_mediterranean_idea:0 "A Non-Aligned Mediterranean"
 SPR_1970_non_aligned_mediterranean_idea_desc:0 "Spain seeks strategic autonomy and cooperation across the Mediterranean without permanent dependence on either military bloc."
 SPR_1970_psoe_industrial_reconversion_idea:0 "Industrial Reconversion"
 SPR_1970_psoe_industrial_reconversion_idea_desc:0 "A three-year programme is restructuring obsolete industries and directing investment toward more competitive production."
 SPR_1970_civilian_control_idea:0 "Civilian Control of the Armed Forces"
 SPR_1970_civilian_control_idea_desc:0 "The elected government has established clear civilian authority over military appointments, planning and internal security."
 SPR_1970_neutralist_promise_idea:0 "The Neutralist Promise"
 SPR_1970_neutralist_promise_idea_desc:0 "The government favours commercial diplomacy and strategic restraint over deeper military alignment."
 SPR_1970_civil_liberties_idea:0 "Civil Liberties Guarantees"
 SPR_1970_civil_liberties_idea_desc:0 "Legal safeguards for speech, association and personal liberty now constrain the security apparatus."
 SPR_1970_free_service_economy_idea:0 "A Liberal Service Economy"
 SPR_1970_free_service_economy_idea_desc:0 "Deregulation and easier access to credit are improving productivity in Spain's expanding commercial and professional sectors."
 SPR_1970_mediterranean_common_market_idea:0 "Mediterranean Common Market"
 SPR_1970_mediterranean_common_market_idea_desc:0 "Spain is cultivating a dense network of commercial links with the democratic economies of Western Europe and the Mediterranean."
 SPR_1970_modern_tax_administration_idea:0 "Modern Tax Administration"
 SPR_1970_modern_tax_administration_idea_desc:0 "A professional revenue service and clearer accounting rules improve collection without requiring another nominal tax increase."
 SPR_1970_consolidated_autonomies_idea:0 "A Consolidated State of Autonomies"
 SPR_1970_consolidated_autonomies_idea_desc:0 "Regional self-government is firmly embedded within a common constitutional framework, although the decentralised system remains administratively expensive."
 SPR_1970_european_development_funds_idea:0 "European Development Funds"
 SPR_1970_european_development_funds_idea_desc:0 "European development assistance is accelerating infrastructure, industrial renewal and regional investment across Spain."

 # NATO referendum
 SPR_1970.229.t:0 "A Referendum on NATO Membership"
 SPR_1970.229.d:0 "The government's commitment to strategic autonomy has reopened the question of Spain's place in NATO. Withdrawal would fulfil the neutralist pledge, but remaining would preserve established defence links and reassure Spain's Atlantic partners."
 SPR_1970.229.a:0 "Withdraw from NATO."
 SPR_1970.229.b:0 "Remain within the Atlantic Alliance."


 # Sahara event
 SPR_1970.12.t:0 "The Sahara Crisis"
 SPR_1970.12.d:0 "With Franco gravely ill, Hassan II has sent the Green March toward Spanish Sahara while Mauritania presses its own claim. The army can hold the border, but Madrid faces international isolation and the risk of a wider war. Negotiators offer a transfer of administration to Morocco and Mauritania under the Madrid Accords."
 SPR_1970.12.a:0 "Sign the Madrid Accords."
 SPR_1970.12.b:0 "Retain Spanish Sahara."
