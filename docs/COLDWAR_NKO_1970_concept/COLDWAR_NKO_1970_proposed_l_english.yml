# IMPERIA CW — Cold War: North Korean 1970 CONCEPT, not installed.
l_english:
 COLDWAR_NKO_fifth_congress:0 "The Fifth Congress"
 COLDWAR_NKO_fifth_congress_desc:0 "Set the programme of the party congress after the extended Seven-Year Plan."
 COLDWAR_NKO_monolithic:0 "Monolithic Leadership"
 COLDWAR_NKO_monolithic_desc:0 "Concentrate authority in the Leader and his trusted cadre network."
 COLDWAR_NKO_collective:0 "Collective Deliberation"
 COLDWAR_NKO_collective_desc:0 "Restore policy debate within the Workers’ Party while accepting a less unified command."
 COLDWAR_NKO_loyalty:0 "Loyal Appointments"
 COLDWAR_NKO_loyalty_desc:0 "Promote politically reliable officials, narrowing the pool of technical talent."
 COLDWAR_NKO_debate:0 "Candid Reports"
 COLDWAR_NKO_debate_desc:0 "Let ministries report missed targets without treating every failure as disloyalty."
 COLDWAR_NKO_presidency:0 "The Presidential State"
 COLDWAR_NKO_presidency_desc:0 "Gather constitutional and administrative authority around Kim Il Sung."
 COLDWAR_NKO_cabinet_reports:0 "Cabinet Accountability"
 COLDWAR_NKO_cabinet_reports_desc:0 "Require ministers to defend plans and expenditure before a collective party leadership."
 COLDWAR_NKO_ten_principles:0 "The Ten Principles"
 COLDWAR_NKO_ten_principles_desc:0 "Bind institutions to a uniform ideological hierarchy."
 COLDWAR_NKO_cadre_tenure:0 "Professional Cadres"
 COLDWAR_NKO_cadre_tenure_desc:0 "Protect experienced administrators while accepting a more entrenched bureaucracy."
 COLDWAR_NKO_party_settlement:0 "The Party Settlement"
 COLDWAR_NKO_party_settlement_desc:0 "Consolidate the institutional settlement chosen by the congress."
 COLDWAR_NKO_campaigns:0 "Campaign Mobilization"
 COLDWAR_NKO_campaigns_desc:0 "Concentrate labour on visible projects at the expense of routine production and household provision."
 COLDWAR_NKO_technical_cadres:0 "Technical Cadres"
 COLDWAR_NKO_technical_cadres_desc:0 "Replace emergency campaigns with trained supervision and measured investment."
 COLDWAR_NKO_three_revolutions:0 "Three Revolutions"
 COLDWAR_NKO_three_revolutions_desc:0 "Send ideological, technical and cultural teams into workplaces."
 COLDWAR_NKO_engineer_commissions:0 "Ministry Engineers"
 COLDWAR_NKO_engineer_commissions_desc:0 "Give technical commissions the authority to revise unrealistic orders."
 COLDWAR_NKO_red_banner:0 "Red Banner Campaign"
 COLDWAR_NKO_red_banner_desc:0 "Reward accelerated production and model work teams while placing further pressure on inputs."
 COLDWAR_NKO_honest_targets:0 "Achievable Targets"
 COLDWAR_NKO_honest_targets_desc:0 "Accept less spectacular headlines in return for plans that plants can deliver."
 COLDWAR_NKO_plan_discipline:0 "Discipline in the Plan"
 COLDWAR_NKO_plan_discipline_desc:0 "Carry the chosen management settlement into the next planning period."
 COLDWAR_NKO_family_succession:0 "Cultivate the Centre"
 COLDWAR_NKO_family_succession_desc:0 "Build Kim Jong Il’s authority inside the party without displacing Kim Il Sung."
 COLDWAR_NKO_committee_succession:0 "A Collective Succession"
 COLDWAR_NKO_committee_succession_desc:0 "Prepare a committee succession instead of a hereditary transfer."
 COLDWAR_NKO_party_media:0 "The Party and the Arts"
 COLDWAR_NKO_party_media_desc:0 "Finance a cultural apparatus that presents the successor as the guardian of continuity."
 COLDWAR_NKO_secretariat:0 "Responsible Secretariat"
 COLDWAR_NKO_secretariat_desc:0 "Distribute appointments among a responsible secretariat rather than the ruling household."
 COLDWAR_NKO_sixth_congress:0 "The Sixth Congress"
 COLDWAR_NKO_sixth_congress_desc:0 "Publicly confirm the successor’s party offices while the founding Leader remains in command."
 COLDWAR_NKO_succession_rules:0 "Succession Rules"
 COLDWAR_NKO_succession_rules_desc:0 "Set procedures for a future vacancy and bind commanders to the institutional settlement."
 COLDWAR_NKO_continuity:0 "Beyond the Founder"
 COLDWAR_NKO_continuity_desc:0 "Secure continuity through the leadership settlement the country has chosen."
 COLDWAR_NKO_plan_review:0 "Extended Plan Review"
 COLDWAR_NKO_plan_review_desc:0 "Audit the gap between targets, installed capacity and available supplies."
 COLDWAR_NKO_heavy_priority:0 "Heavy Industry First"
 COLDWAR_NKO_heavy_priority_desc:0 "Prioritize metals and machinery while scarce capital is withheld from agriculture and household output."
 COLDWAR_NKO_light_priority:0 "Food and Light Industry"
 COLDWAR_NKO_light_priority_desc:0 "Direct investment toward everyday supply at a cost to the defence-industrial build-up."
 COLDWAR_NKO_balanced_priority:0 "Industrial Growth"
 COLDWAR_NKO_balanced_priority_desc:0 "Adopt a slower investment plan with more reliable input balances."
 COLDWAR_NKO_steelworks:0 "Modernize Steelworks"
 COLDWAR_NKO_steelworks_desc:0 "Refit the established steel and engineering complexes that support national industrialization."
 COLDWAR_NKO_food_district:0 "Equip the Cooperatives"
 COLDWAR_NKO_food_district_desc:0 "Equip the cooperatives with machinery and storage, and stabilize the delivery of rural inputs."
 COLDWAR_NKO_machine_tools:0 "Machine Tool Standards"
 COLDWAR_NKO_machine_tools_desc:0 "Improve interchangeability and maintenance rather than chasing gross output totals."
 COLDWAR_NKO_input_balance:0 "Balance the Inputs"
 COLDWAR_NKO_input_balance_desc:0 "Bring transport, electricity and intermediate supplies into the investment plan."
 COLDWAR_NKO_coal_power:0 "Coal-fired Expansion"
 COLDWAR_NKO_coal_power_desc:0 "Expand coal-fired generating capacity to sustain the industrial plan."
 COLDWAR_NKO_hydro_power:0 "Hydropower Plan"
 COLDWAR_NKO_hydro_power_desc:0 "Invest in inland water power to reduce dependence on imported fossil fuels."
 COLDWAR_NKO_power_grid:0 "Repair the Power Grid"
 COLDWAR_NKO_power_grid_desc:0 "Reduce transmission losses through paid grid maintenance."
 COLDWAR_NKO_rail_corridor:0 "Industrial Rail Corridor"
 COLDWAR_NKO_rail_corridor_desc:0 "Increase infrastructure along an owned industrial corridor."
 COLDWAR_NKO_housing:0 "Housing near the Plants"
 COLDWAR_NKO_housing_desc:0 "Fund housing and urban services so industrial recruitment can be sustained."
 COLDWAR_NKO_fertilizer:0 "Fertilizer and Irrigation"
 COLDWAR_NKO_fertilizer_desc:0 "Improve yields through inputs that require electricity and dependable distribution."
 COLDWAR_NKO_public_health:0 "County Clinics"
 COLDWAR_NKO_public_health_desc:0 "Expand basic healthcare at a continuing public cost."
 COLDWAR_NKO_living_standards:0 "A Sustainable Ration"
 COLDWAR_NKO_living_standards_desc:0 "Improve the reliability of food distribution after investment in rural and urban supply."
 COLDWAR_NKO_state_procurement:0 "State Procurement"
 COLDWAR_NKO_state_procurement_desc:0 "Stabilize procurement through guaranteed state purchasing and closer supervision."
 COLDWAR_NKO_household_plots:0 "Household Plots"
 COLDWAR_NKO_household_plots_desc:0 "Let households retain more produce while accepting weaker state extraction."
 COLDWAR_NKO_distribution_reform:0 "Distribution Depots"
 COLDWAR_NKO_distribution_reform_desc:0 "Build a distribution network that reduces waste and supplies the army and civilian economy."
 COLDWAR_NKO_domestic_finance:0 "Domestic Savings"
 COLDWAR_NKO_domestic_finance_desc:0 "Avoid a hard-currency borrowing surge by accepting slower investment."
 COLDWAR_NKO_western_credit:0 "Machinery on Credit"
 COLDWAR_NKO_western_credit_desc:0 "Borrow to purchase foreign plant and accept debt service and a weaker credit position."
 COLDWAR_NKO_technical_schools:0 "Industrial Schools"
 COLDWAR_NKO_technical_schools_desc:0 "Train technicians domestically instead of relying on a larger foreign-credit package."
 COLDWAR_NKO_credit_reckoning:0 "Meet the Foreign Bills"
 COLDWAR_NKO_credit_reckoning_desc:0 "Resolve the machinery account through repayment or a negotiated rescheduling."
 COLDWAR_NKO_export_quality:0 "Quality for Export"
 COLDWAR_NKO_export_quality_desc:0 "Slow production-line changes to improve the consistency of saleable output."
 COLDWAR_NKO_joint_ventures:0 "Controlled Ventures"
 COLDWAR_NKO_joint_ventures_desc:0 "Offer tightly limited partnerships and tax concessions without assuming foreign investors will provide free capital."
 COLDWAR_NKO_lessons_1969:0 "Lessons of 1969"
 COLDWAR_NKO_lessons_1969_desc:0 "Review the 1968–69 confrontation and restore professional military reporting."
 COLDWAR_NKO_fortress:0 "The Fortress State"
 COLDWAR_NKO_fortress_desc:0 "Prepare an economical territorial defence at the cost of offensive flexibility."
 COLDWAR_NKO_mobile_army:0 "A Mobile Field Army"
 COLDWAR_NKO_mobile_army_desc:0 "Build a more flexible field army that consumes more equipment and fuel."
 COLDWAR_NKO_red_guards:0 "Worker-Peasant Guards"
 COLDWAR_NKO_red_guards_desc:0 "Expand reserve training while removing civilian labour from regular production."
 COLDWAR_NKO_staff_college:0 "General Staff College"
 COLDWAR_NKO_staff_college_desc:0 "Improve staff work through a paid officer education programme."
 COLDWAR_NKO_army_reorganization:0 "Reorganize Command"
 COLDWAR_NKO_army_reorganization_desc:0 "Translate the selected doctrine into command and logistics procedures."
 COLDWAR_NKO_mass_artillery:0 "Artillery Concentration"
 COLDWAR_NKO_mass_artillery_desc:0 "Concentrate firepower while accepting greater ammunition and transport requirements."
 COLDWAR_NKO_air_defence:0 "Air Defence Commands"
 COLDWAR_NKO_air_defence_desc:0 "Improve coordination of fighter aviation, warning services and ground-based air defence."
 COLDWAR_NKO_coastal_denial:0 "Coastal Denial"
 COLDWAR_NKO_coastal_denial_desc:0 "Concentrate naval training on denying coastal access."
 COLDWAR_NKO_special_operations:0 "Special Operations"
 COLDWAR_NKO_special_operations_desc:0 "Train specialist formations at a cost to the regular army’s resources."
 COLDWAR_NKO_ammunition_standards:0 "Ammunition Standards"
 COLDWAR_NKO_ammunition_standards_desc:0 "Standardize ammunition at the expense of flexible production changes."
 COLDWAR_NKO_air_warning:0 "Air Warning Network"
 COLDWAR_NKO_air_warning_desc:0 "Extend early warning and communications coverage across the northern approaches."
 COLDWAR_NKO_naval_workshops:0 "Naval Workshops"
 COLDWAR_NKO_naval_workshops_desc:0 "Expand the coastal yards to maintain the fleet and sustain a modest naval-industrial base."
 COLDWAR_NKO_reconnaissance:0 "Reconnaissance Plan"
 COLDWAR_NKO_reconnaissance_desc:0 "Improve reconnaissance training and the quality of operational preparation."
 COLDWAR_NKO_joint_logistics:0 "Joint Logistics"
 COLDWAR_NKO_joint_logistics_desc:0 "Unify logistics across all four service programmes."
 COLDWAR_NKO_civilian_conversions:0 "Workshop Conversion"
 COLDWAR_NKO_civilian_conversions_desc:0 "Release industrial workshops for civilian production while reducing military expansion."
 COLDWAR_NKO_arsenal_priority:0 "Arsenal Priority"
 COLDWAR_NKO_arsenal_priority_desc:0 "Give defence plants priority over civilian construction and power allocation."
 COLDWAR_NKO_logistics_reserve:0 "A Maintained Reserve"
 COLDWAR_NKO_logistics_reserve_desc:0 "Maintain a sustainable reserve rather than a paper mobilization total."
 COLDWAR_NKO_military_research:0 "Military Institutes"
 COLDWAR_NKO_military_research_desc:0 "Improve domestic military engineering and testing."
 COLDWAR_NKO_readiness_inspections:0 "Readiness Inspections"
 COLDWAR_NKO_readiness_inspections_desc:0 "Make readiness reporting more demanding and allow more time for effective training."
 COLDWAR_NKO_independent_diplomacy:0 "Independent Diplomacy"
 COLDWAR_NKO_independent_diplomacy_desc:0 "Preserve freedom of action while bargaining with the larger powers."
 COLDWAR_NKO_moscow_offer:0 "Soviet Machinery Offer"
 COLDWAR_NKO_moscow_offer_desc:0 "Request a paid machinery package on terms Moscow can accept or refuse."
 COLDWAR_NKO_beijing_offer:0 "Repair Ties with Beijing"
 COLDWAR_NKO_beijing_offer_desc:0 "Propose a paid agricultural and technical cooperation agreement."
 COLDWAR_NKO_diaspora_trade:0 "Chongryon Trade"
 COLDWAR_NKO_diaspora_trade_desc:0 "Use diaspora firms to widen technical and commercial contacts without treating remittances as unlimited income."
 COLDWAR_NKO_soviet_training:0 "Soviet Placements"
 COLDWAR_NKO_soviet_training_desc:0 "Place Korean engineers in Soviet institutions after an agreement is signed."
 COLDWAR_NKO_border_trade:0 "Regularize Border Trade"
 COLDWAR_NKO_border_trade_desc:0 "Provide customs and storage facilities for regulated trade."
 COLDWAR_NKO_export_offices:0 "Commercial Offices"
 COLDWAR_NKO_export_offices_desc:0 "Fund a professional commercial service rather than relying solely on political delegations."
 COLDWAR_NKO_external_balance:0 "Keep Both Doors Open"
 COLDWAR_NKO_external_balance_desc:0 "Maintain a diversified foreign procurement policy. Moscow and Beijing remain mixable partners."
 COLDWAR_NKO_detente:0 "Inter-Korean Channel"
 COLDWAR_NKO_detente_desc:0 "Offer talks on divided families, communications and reduced tension."
 COLDWAR_NKO_coercion:0 "Armistice Pressure"
 COLDWAR_NKO_coercion_desc:0 "Use pressure and readiness as bargaining instruments while accepting a more difficult trade environment."
 COLDWAR_NKO_red_cross:0 "Divided Families"
 COLDWAR_NKO_red_cross_desc:0 "Finance contact and travel arrangements only after both governments agree."
 COLDWAR_NKO_front_broadcasting:0 "Reunification Radio"
 COLDWAR_NKO_front_broadcasting_desc:0 "Strengthen the united front’s radio services and political messaging toward the South."
 COLDWAR_NKO_confederation_offer:0 "Confederation Proposal"
 COLDWAR_NKO_confederation_offer_desc:0 "Propose a confederal consultative council based on continued sovereignty and negotiated cooperation."
 COLDWAR_NKO_armed_bargaining:0 "Armed Bargaining"
 COLDWAR_NKO_armed_bargaining_desc:0 "Maintain a stronger military negotiating position at a continuing financial cost."
 COLDWAR_NKO_recognition:0 "Non-Aligned Standing"
 COLDWAR_NKO_recognition_desc:0 "Build diplomatic representation among non-aligned states and seek wider recognition of the Republic."
 COLDWAR_NKO_civilian_export:0 "Civilian Export Missions"
 COLDWAR_NKO_civilian_export_desc:0 "Offer commercial concessions to establish dependable markets for civilian exports."
 COLDWAR_NKO_security_export:0 "Military Missions"
 COLDWAR_NKO_security_export_desc:0 "Develop bilateral military training and advisory missions with willing partners."
 COLDWAR_NKO_external_resilience:0 "Patron Resilience"
 COLDWAR_NKO_external_resilience_desc:0 "Diversify inventories and replacement sources to reduce exposure to external restrictions."
 COLDWAR_NKO_science:0 "Academy of Sciences"
 COLDWAR_NKO_science_desc:0 "Support the scientific institutions needed for a long technical programme."
 COLDWAR_NKO_reactor_training:0 "Reactor Engineering"
 COLDWAR_NKO_reactor_training_desc:0 "Train engineers in research-reactor operation, radiation science and laboratory practice."
 COLDWAR_NKO_civil_atom:0 "Civil Atomic Pact"
 COLDWAR_NKO_civil_atom_desc:0 "Seek foreign technical cooperation under verifiable limits on the atomic programme."
 COLDWAR_NKO_sovereign_atom:0 "Sovereign Atom Study"
 COLDWAR_NKO_sovereign_atom_desc:0 "Invest in a national nuclear research programme while accepting cost and external suspicion."
 COLDWAR_NKO_safeguards:0 "Reactor Safeguards"
 COLDWAR_NKO_safeguards_desc:0 "Register safeguards obligations on the research programme."
 COLDWAR_NKO_fuel_studies:0 "The Domestic Fuel Cycle"
 COLDWAR_NKO_fuel_studies_desc:0 "Develop fuel-cycle engineering through a funded national research programme."
 COLDWAR_NKO_npt_offer:0 "The NPT Bargain"
 COLDWAR_NKO_npt_offer_desc:0 "Offer non-proliferation commitments in return for civil technical cooperation."
 COLDWAR_NKO_strategic_option:0 "Strategic Study"
 COLDWAR_NKO_strategic_option_desc:0 "Direct the Academy and defence establishment to study the strategic applications of nuclear research."
 COLDWAR_NKO_kdp_charter:0 "Patriotic Charter"
 COLDWAR_NKO_kdp_charter_desc:0 "Give the party a governing charter grounded in civil administration and national reconciliation."
 COLDWAR_NKO_kdp_social:0 "A Social Republic"
 COLDWAR_NKO_kdp_social_desc:0 "Offer social protection and public investment with a larger recurrent budget."
 COLDWAR_NKO_kdp_enterprise:0 "A Republic of Enterprise"
 COLDWAR_NKO_kdp_enterprise_desc:0 "Support enterprise autonomy while accepting weaker revenue and a more unequal transition."
 COLDWAR_NKO_kdp_housing:0 "Municipal Housing"
 COLDWAR_NKO_kdp_housing_desc:0 "Delegate housing budgets to municipal boards."
 COLDWAR_NKO_kdp_licenses:0 "Legal Small Enterprise"
 COLDWAR_NKO_kdp_licenses_desc:0 "Provide legal registration and supply contracts for small enterprise."
 COLDWAR_NKO_kdp_budget:0 "A Published Budget"
 COLDWAR_NKO_kdp_budget_desc:0 "Publish state accounts and reduce arbitrary fiscal intervention."
 COLDWAR_NKO_kdp_courts:0 "Independent Civil Courts"
 COLDWAR_NKO_kdp_courts_desc:0 "Make civil contracts enforceable beyond the ruling party’s immediate wishes."
 COLDWAR_NKO_kdp_executive:0 "Elected Executive"
 COLDWAR_NKO_kdp_executive_desc:0 "Prefer a decisive civilian executive to wider institutional checks."
 COLDWAR_NKO_kdp_civic:0 "Civic Associations"
 COLDWAR_NKO_kdp_civic_desc:0 "Permit professional and civic organization with a budget for public order."
 COLDWAR_NKO_kdp_service:0 "A Merit Civil Service"
 COLDWAR_NKO_kdp_service_desc:0 "Recruit civil servants through professional standards."
 COLDWAR_NKO_kdp_social_compact:0 "Civilian Social Compact"
 COLDWAR_NKO_kdp_social_compact_desc:0 "Bind the civilian government to the public services it has promised."
 COLDWAR_NKO_kdp_reconciliation:0 "Reconciliation First"
 COLDWAR_NKO_kdp_reconciliation_desc:0 "Use the party’s civilian identity to support negotiated inter-Korean relations."
 COLDWAR_NKO_kdp_sovereignty:0 "Sovereignty First"
 COLDWAR_NKO_kdp_sovereignty_desc:0 "Insist on sovereign equality while preparing a more guarded diplomacy."
 COLDWAR_NKO_kdp_republic:0 "A Durable Civil Republic"
 COLDWAR_NKO_kdp_republic_desc:0 "Consolidate the institutions of a civilian republic."
 COLDWAR_NKO_chondo_heaven:0 "Humanity Is Heaven"
 COLDWAR_NKO_chondo_heaven_desc:0 "Build a national programme around human dignity, rural community and Korean independence."
 COLDWAR_NKO_chondo_cooperative:0 "The Cooperative Village"
 COLDWAR_NKO_chondo_cooperative_desc:0 "Retain common agricultural provision under stronger village institutions."
 COLDWAR_NKO_chondo_household:0 "The Family Holding"
 COLDWAR_NKO_chondo_household_desc:0 "Give households greater control of land use and a larger share of their harvest."
 COLDWAR_NKO_chondo_granary:0 "Village Granaries"
 COLDWAR_NKO_chondo_granary_desc:0 "Finance local storage and guaranteed village reserves."
 COLDWAR_NKO_chondo_markets:0 "Licensed Rural Markets"
 COLDWAR_NKO_chondo_markets_desc:0 "Legalize local exchange with enforceable market rules."
 COLDWAR_NKO_chondo_land:0 "A Rural Settlement"
 COLDWAR_NKO_chondo_land_desc:0 "Consolidate the chosen rural property and procurement settlement."
 COLDWAR_NKO_chondo_tolerance:0 "Freedom of Conscience"
 COLDWAR_NKO_chondo_tolerance_desc:0 "Protect believers and non-believers within a common citizenship."
 COLDWAR_NKO_chondo_morality:0 "A National Moral Order"
 COLDWAR_NKO_chondo_morality_desc:0 "Use Chondoist moral teaching to strengthen a more uniform national order."
 COLDWAR_NKO_chondo_schools:0 "County Schools"
 COLDWAR_NKO_chondo_schools_desc:0 "Expand education in neglected rural districts."
 COLDWAR_NKO_chondo_councils:0 "Councils of Community"
 COLDWAR_NKO_chondo_councils_desc:0 "Place local administration in the hands of established community networks."
 COLDWAR_NKO_chondo_nation:0 "The Donghak Inheritance"
 COLDWAR_NKO_chondo_nation_desc:0 "Present Korean independence as a shared national tradition."
 COLDWAR_NKO_chondo_reforestation:0 "Protect the Hillsides"
 COLDWAR_NKO_chondo_reforestation_desc:0 "Protect soil and catchments by limiting further cultivation of slopes."
 COLDWAR_NKO_chondo_reclamation:0 "Reclaim New Fields"
 COLDWAR_NKO_chondo_reclamation_desc:0 "Finance agricultural capacity while accepting the full construction and staffing burden."
 COLDWAR_NKO_chondo_commonwealth:0 "A Rural Commonwealth"
 COLDWAR_NKO_chondo_commonwealth_desc:0 "Secure the rural services and institutions promised by the party."
 COLDWAR_NKO_cabinet_accounts:0 "Accounts before Slogans"
 COLDWAR_NKO_cabinet_accounts_desc:0 "Make accurate accounts the basis of cabinet authority."
 COLDWAR_NKO_cabinet_plant:0 "Plant Manager Control"
 COLDWAR_NKO_cabinet_plant_desc:0 "Delegate production decisions and allow plants to retain investment funds."
 COLDWAR_NKO_cabinet_plan:0 "National Plan"
 COLDWAR_NKO_cabinet_plan_desc:0 "Coordinate supplies centrally through a better funded planning apparatus."
 COLDWAR_NKO_cabinet_contracts:0 "Supply Contracts"
 COLDWAR_NKO_cabinet_contracts_desc:0 "Require suppliers and plants to honour realistic delivery contracts."
 COLDWAR_NKO_cabinet_statistics:0 "A Statistical Service"
 COLDWAR_NKO_cabinet_statistics_desc:0 "Build professional statistical capacity throughout the ministries."
 COLDWAR_NKO_cabinet_currency:0 "A Hard-Currency Budget"
 COLDWAR_NKO_cabinet_currency_desc:0 "Tie foreign procurement to the country’s ability to meet external bills."
 COLDWAR_NKO_cabinet_austerity:0 "Investment Priority"
 COLDWAR_NKO_cabinet_austerity_desc:0 "Hold down current consumption to fund a higher investment share."
 COLDWAR_NKO_cabinet_consumption:0 "A Consumer Recovery"
 COLDWAR_NKO_cabinet_consumption_desc:0 "Use increased consumption to restore confidence while slowing capital formation."
 COLDWAR_NKO_cabinet_training:0 "Train Administrators"
 COLDWAR_NKO_cabinet_training_desc:0 "Make professional administrative training a durable cabinet priority."
 COLDWAR_NKO_cabinet_settlement:0 "A Governable Plan"
 COLDWAR_NKO_cabinet_settlement_desc:0 "Consolidate a plan that the ministries can finance and administer."
 COLDWAR_NKO_kpa_council:0 "The Emergency Council"
 COLDWAR_NKO_kpa_council_desc:0 "Place the officer corps at the centre of an emergency administration."
 COLDWAR_NKO_kpa_party:0 "Party Commissars"
 COLDWAR_NKO_kpa_party_desc:0 "Keep party control inside the forces to stabilize an uneasy military government."
 COLDWAR_NKO_kpa_professional:0 "Professional Officers"
 COLDWAR_NKO_kpa_professional_desc:0 "Reduce party interference in command while accepting a political legitimacy problem."
 COLDWAR_NKO_kpa_loyalty:0 "Command Compact"
 COLDWAR_NKO_kpa_loyalty_desc:0 "Rebuild a compact between commanders and the ruling party apparatus."
 COLDWAR_NKO_kpa_merit:0 "Promotion by Merit"
 COLDWAR_NKO_kpa_merit_desc:0 "Select officers for technical and operational competence."
 COLDWAR_NKO_kpa_rations:0 "Military Supply"
 COLDWAR_NKO_kpa_rations_desc:0 "Secure military supply while diverting productive inputs from civilian provision."
 COLDWAR_NKO_kpa_fortress:0 "An Entrenched Garrison"
 COLDWAR_NKO_kpa_fortress_desc:0 "Accept a long military administration and its continuing civilian burden."
 COLDWAR_NKO_kpa_handover:0 "Civilian Handover"
 COLDWAR_NKO_kpa_handover_desc:0 "Commit the emergency council to an orderly transition under an agreed civilian charter."
 COLDWAR_NKO_kpa_budget:0 "Costed Defence Budget"
 COLDWAR_NKO_kpa_budget_desc:0 "Bring defence procurement under a budget that the treasury can sustain."
 COLDWAR_NKO_kpa_legacy:0 "Army and Republic"
 COLDWAR_NKO_kpa_legacy_desc:0 "Settle the role of the armed forces in the chosen political order."
 COLDWAR_NKO_yanan_return:0 "Socialist Reassessment"
 COLDWAR_NKO_yanan_return_desc:0 "Begin a counterfactual reassessment of party rule after a fundamental political change."
 COLDWAR_NKO_yanan_councils:0 "Factory Councils"
 COLDWAR_NKO_yanan_councils_desc:0 "Give workers and technical staff a stronger voice in plant decisions."
 COLDWAR_NKO_yanan_discipline:0 "Party Discipline"
 COLDWAR_NKO_yanan_discipline_desc:0 "Retain centralized party command while ending the personal cult."
 COLDWAR_NKO_yanan_rehabilitation:0 "Review Sentences"
 COLDWAR_NKO_yanan_rehabilitation_desc:0 "Review political sentences and restore surviving specialists to professional life."
 COLDWAR_NKO_yanan_experts:0 "Foreign Experts"
 COLDWAR_NKO_yanan_experts_desc:0 "Accept technical assistance and the influence that accompanies it."
 COLDWAR_NKO_yanan_domestic:0 "Domestic Expertise"
 COLDWAR_NKO_yanan_domestic_desc:0 "Develop expertise at home with slower returns and higher education expenditure."
 COLDWAR_NKO_yanan_socialism:0 "Korean Reform"
 COLDWAR_NKO_yanan_socialism_desc:0 "Combine socialist institutions with a less punitive economic programme."
 COLDWAR_NKO_yanan_guarantees:0 "Anti-Cult Guarantees"
 COLDWAR_NKO_yanan_guarantees_desc:0 "Limit arbitrary appointments and personal command inside the party state."
 COLDWAR_NKO_union_compact:0 "Workers’ Compact"
 COLDWAR_NKO_union_compact_desc:0 "Base a counterfactual government on wages, rations, safety and industrial representation."
 COLDWAR_NKO_union_wages:0 "Wages and Supply"
 COLDWAR_NKO_union_wages_desc:0 "Give workers a larger share of output at a higher social cost."
 COLDWAR_NKO_union_reinvestment:0 "Workers’ Investment"
 COLDWAR_NKO_union_reinvestment_desc:0 "Direct retained earnings toward new investment instead of current consumption."
 COLDWAR_NKO_union_safety:0 "Industrial Safety"
 COLDWAR_NKO_union_safety_desc:0 "Allow inspections to slow unsafe production rather than pursuing quotas at any cost."
 COLDWAR_NKO_union_bargaining:0 "Production Bargaining"
 COLDWAR_NKO_union_bargaining_desc:0 "Negotiate achievable work norms with factory representatives."
 COLDWAR_NKO_union_mobilization:0 "New Chollima Compact"
