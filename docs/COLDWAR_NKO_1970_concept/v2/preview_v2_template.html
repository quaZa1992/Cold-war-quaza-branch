<!-- IMPERIA CW — Cold War: approval-only DPRK tree, agreements and world news. -->
<div id="coldwar-nko-v2">
 <div class="cw-window">
  <div class="cw-top"><strong>COLDWAR · DPRK</strong><span>1970–1994 · CONCEPT</span></div>
  <div class="cw-controls">
   <label>Section<select id="cw-section"><option value="all">Full tree</option></select></label>
   <label>Government<select id="cw-government"><option value="4">Workers' Party of Korea</option><option value="5">Korean Democratic Party</option><option value="7">Chondoist Chongu Party</option><option value="13">Cabinet</option><option value="22">KPA emergency council</option><option value="2">Yan'an reform programme</option><option value="3">Labour federation</option><option value="14">Christian federation</option></select></label>
   <label>Leadership<select id="cw-date"><option value="1970">January 1970 · Kim Il Sung</option><option value="1994">July 1994 · Kim Jong Il</option></select></label>
   <button id="cw-fit" type="button">Fit section</button><button id="cw-native" type="button">Native grid</button><button id="cw-spirits" type="button">Starting spirits</button><button id="cw-news" type="button">World news · 1994</button>
  </div>
  <div id="cw-caption" class="cw-caption"></div>
  <div id="cw-viewport" class="cw-viewport"><div id="cw-canvas"><svg id="cw-connectors" aria-hidden="true"></svg><div id="cw-nodes"></div><div id="cw-headings"></div></div></div>
  <div class="cw-legend">Solid: prerequisite · Red: mutually exclusive · Muted: unavailable government or leadership</div>
  <div id="cw-inspector" class="cw-inspector" aria-live="polite"></div>
 </div>
</div>
<style>
#coldwar-nko-v2{font:14px Arial,sans-serif;color:#e7e5d7;color-scheme:dark}
#coldwar-nko-v2 *{box-sizing:border-box}
#coldwar-nko-v2 .cw-window{background:#252c27;border:1px solid #596353;width:100%}
#coldwar-nko-v2 .cw-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;background:#343c31;border-bottom:1px solid #778064;color:#d5c894;letter-spacing:1px}
#coldwar-nko-v2 .cw-top span{font-size:12px;align-self:center}
#coldwar-nko-v2 .cw-controls{display:flex;align-items:end;flex-wrap:wrap;gap:8px;padding:12px}
#coldwar-nko-v2 label{display:flex;flex-direction:column;gap:4px;max-width:100%;font-size:12px}
#coldwar-nko-v2 select,#coldwar-nko-v2 button:not(.cw-focus){background:#3b4437;color:#ece9d8;border:1px solid #6a745a;border-radius:0;padding:8px;max-width:100%;font:inherit}
#coldwar-nko-v2 select{min-width:0}
#coldwar-nko-v2 .cw-caption{padding:0 12px 10px;color:#d5d2bd}
#coldwar-nko-v2 .cw-viewport{height:555px;overflow:auto;background:radial-gradient(ellipse at 40% 30%,#384136,#202721);border-top:1px solid #515e49;border-bottom:1px solid #515e49;position:relative}
#coldwar-nko-v2 #cw-canvas{position:relative;transform-origin:0 0}
#coldwar-nko-v2 #cw-connectors{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#coldwar-nko-v2 .cw-focus{position:absolute;width:165px;height:128px;background:transparent;border:0;padding:0;color:#e9e6d2;font:14px Arial,sans-serif}
#coldwar-nko-v2 .cw-focus img{position:absolute;max-width:112px;max-height:98px;left:50%;top:0;transform:translateX(-50%);object-fit:contain}
#coldwar-nko-v2 .cw-title{position:absolute;left:.5px;top:73px;width:164px;height:50px;padding:0 8px;line-height:50px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;background-size:164px 50px;font-size:13px}
#coldwar-nko-v2 .cw-focus.inactive img{filter:grayscale(.8) brightness(.65)}
#coldwar-nko-v2 .cw-focus.inactive .cw-title{color:#adb19f}
#coldwar-nko-v2 .cw-focus.selected img{filter:drop-shadow(0 0 7px #d9c774)}
#coldwar-nko-v2 .cw-group-title{position:absolute;white-space:nowrap;transform:translateX(-50%);color:#d7c58c;font-size:18px;letter-spacing:.4px}
#coldwar-nko-v2 .cw-legend{font-size:12px;color:#d1cdb8;padding:9px 12px}
#coldwar-nko-v2 .cw-inspector{padding:14px 18px;background:#202720;border-top:1px solid #6a745a;min-height:200px;overflow-wrap:anywhere}
#coldwar-nko-v2 h3{margin:0 0 8px;font-size:18px;color:#ded19f}
#coldwar-nko-v2 h4{font-size:15px;margin:14px 0 7px;color:#ded19f}
#coldwar-nko-v2 p{line-height:1.45;margin:7px 0}
#coldwar-nko-v2 ul{padding-left:20px;line-height:1.5;margin:8px 0 12px}
#coldwar-nko-v2 .cw-meta{color:#bfc4ae;font-size:12px}
#coldwar-nko-v2 .cw-spirit{padding:10px 0;border-bottom:1px solid #535c4b}
#coldwar-nko-v2 .cw-treaty{margin-top:15px;padding:12px;background:#2b342a;border:1px solid #66705a}
#coldwar-nko-v2 .cw-partners{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#coldwar-nko-v2 .cw-response{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#coldwar-nko-v2 .cw-simulation{display:flex;flex-wrap:wrap;gap:15px;padding-top:10px}
#coldwar-nko-v2 .cw-simulation label{flex-direction:row;align-items:center;font-size:13px}
#coldwar-nko-v2 .cw-status{color:#dccb94}
#coldwar-nko-v2 .cw-news-paper{max-width:528px;width:100%;aspect-ratio:528/595;position:relative;margin:0 auto;color:#25251e;background:#c2bca3;background-size:100% 100%;overflow:hidden}
#coldwar-nko-v2 .cw-news-paper h3{position:absolute;left:2.27%;top:43.7%;width:92.8%;text-align:center;color:#25251e;font-family:Georgia,serif;font-size:clamp(14px,3vw,22px);margin:0}
#coldwar-nko-v2 .cw-news-paper img{position:absolute;left:11.17%;top:15.29%;width:75.38%;height:25.55%;display:block;object-fit:cover}
#coldwar-nko-v2 .cw-news-paper p{position:absolute;left:7.38%;top:48.9%;width:85%;font-family:Georgia,serif;font-size:clamp(12px,2.2vw,16px);line-height:1.4;margin:0}
#coldwar-nko-v2 .cw-news-paper button{position:absolute;left:15%;top:85%;width:70%;margin:0}
#coldwar-nko-v2 .cw-news-credit{font-size:12px;color:#bfc4ae;margin:12px auto;max-width:528px}
@media(max-width:550px){#coldwar-nko-v2 .cw-viewport{height:450px}#coldwar-nko-v2 select{width:100%}#coldwar-nko-v2 .cw-controls>label{width:100%}#coldwar-nko-v2 .cw-controls>button{min-height:44px}#coldwar-nko-v2 .cw-partners{grid-template-columns:1fr}}
</style>
<script>
(()=>{
 const root=document.getElementById('coldwar-nko-v2'),data=__DATA__,art=__ART__;
 const $=s=>root.querySelector(s),ids=Object.fromEntries(data.nodes.map(n=>[n.id,n]));
 const section=$('#cw-section'),gov=$('#cw-government'),date=$('#cw-date'),canvas=$('#cw-canvas'),viewport=$('#cw-viewport');
 let state={section:'all',government:4,year:1970,selected:data.nodes[0].id,panel:'focus',agreements:{},conditions:{},native:false},current=[];
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pct=v=>(v*100).toFixed(2).replace(/\.?0+$/,'')+'%';
 const signed=v=>(v>=0?'+':'')+pct(v),country=k=>data.country_names[k]||k;
 const labels=m=>Object.entries(m).map(([k,v])=>`${data.stats_labels[k]||k}: ${k==='interest_rate_multiplier_modifier'?v.toFixed(2)+' percentage points':signed(v)}`);
 const list=rows=>'<ul>'+rows.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';
 function active(n){return(n.slot===null||n.slot===state.government)&&(!n.leader_bound||state.year===1994)&&(!n.availability_leader||state.year===1970)}
 function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{section:state.section,government:country('NKO')+' · '+gov.options[gov.selectedIndex].text,selectedFocus:ids[state.selected]?.title,panel:state.panel,year:state.year},privateContent:state}).catch(()=>{})}
 function restore(saved){let s=saved?.privateContent;if(!s)return;state={...state,...s};if(!['all',...data.groups.map(g=>g.id)].includes(state.section))state.section='all';if(!ids[state.selected])state.selected=data.nodes[0].id;state.agreements=state.agreements||{};state.conditions=state.conditions||{};section.value=state.section;gov.value=state.government;date.value=state.year;draw();panel()}
 for(const g of data.groups){const o=document.createElement('option');o.value=g.id;o.textContent=g.title;section.append(o)}
 function treaty(n,e){
  const a=data.agreements.find(a=>a.key===e.agreement),u=e.stage==='base'?null:a.upgrades.find(u=>u.key===e.stage),key=a.key+':'+e.stage,answer=state.agreements[key]||'pending';
  const pair=state.conditions[a.partner]||{war:false,sanctions:false},baseSigned=state.agreements[a.key+':base']==='accepted',blocked=pair.war||pair.sanctions||(u&&!baseSigned);
  const good=answer==='accepted'&&!pair.war&&!pair.sanctions,title=u?.title||a.title;
  let html=`<div class="cw-treaty"><h4>${esc(country(a.partner))} · Incoming Proposal</h4><p>${esc(a.description)}</p><p class="cw-meta">Response period: 90 days</p><h4>${esc(title)}</h4><div class="cw-partners">`;
  for(const side of ['nko','recipient']){
   const s=a[side],mod={...s.modifiers};if(u)for(const [k,v]of Object.entries(u[side]))mod[k]=(mod[k]||0)+v;
   const setup=u?u[side==='nko'?'setup_nko_gdp_share':'setup_recipient_gdp_share']:s.setup_gdp_share;
   const weekly=(s.annual_commitment_gdp_share*100/52).toFixed(5).replace(/0+$/,'').replace(/\.$/,'');
   html+=`<section><h4>${esc(side==='nko'?'North Korea':country(a.partner))}</h4><p>On acceptance: −${pct(setup)} of own quoted GDP</p><p>Weekly contribution: ${weekly}% of current GDP</p>${list(labels(mod))}</section>`;
  }
  html+='</div>';
  if(a.buildings.length&&!u)html+=list(a.buildings.map(b=>`On first acceptance: ${b.levels} Civilian Factory and ${b.slots} Building Slot in ${b.state_ids.map(id=>data.state_names[id]).join(' or ')}`));
  const status=answer==='pending'?(blocked?(u&&!baseSigned?'Acceptance requires the signed base agreement':'Acceptance blocked by war or sanctions'):'Awaiting recipient decision'):answer==='declined'?'Proposal declined · no charge':good?'Both national spirits active · no expiry':'Both national spirits suspended · no weekly contribution';
  html+=`<p class="cw-status">${status}</p><div class="cw-response"><button type="button" id="cw-accept" ${blocked||answer!=='pending'?'disabled':''}>Accept the Agreement</button><button type="button" id="cw-decline" ${answer!=='pending'?'disabled':''}>Decline the Proposal</button>${answer==='declined'?'<button type="button" id="cw-resubmit">Renew the Proposal</button>':''}</div><div class="cw-simulation"><label><input id="cw-war" type="checkbox" ${pair.war?'checked':''}>Mutual war</label><label><input id="cw-sanctions" type="checkbox" ${pair.sanctions?'checked':''}>Sanctions in either direction</label></div><p class="cw-meta">Diplomatic, financial, economic or military sanctions suspend both partners’ spirits. Signed cooperation resumes when peace and sanctions permit.</p></div>`;
  return {html,key,partner:a.partner,blocked};
 }
 function show(n){
  state.selected=n.id;state.panel='focus';root.querySelectorAll('.cw-focus').forEach(b=>b.classList.toggle('selected',b.dataset.id===n.id));
  const g=data.groups.find(g=>g.id===n.group),pre=n.prerequisites.map(pg=>pg.map(id=>ids[id].title).join(' OR ')).join(' AND '),party=n.slot===null?'National programme':g.title+' · '+(active(n)?'available':n.slot!==state.government?'not in office':'leadership requirement not met');
  let html=`<h3>${esc(n.title)}</h3><p>${esc(n.description)}</p><p class="cw-meta">${n.days} days · ${esc(party)}</p>`;
  if(pre)html+=`<p>Requires: ${esc(pre)}</p>`;
  if(n.requirements.length)html+=list(n.requirements);
  if(n.mutex.length)html+=`<p>Mutually exclusive: ${n.mutex.map(id=>esc(ids[id].title)).join(' / ')}</p>`;
  html+=list(n.effects);
  if(n.slot!==null)html+='<p class="cw-meta">Completed policy spirits apply while this government is in office and return if it regains power. Buildings and one-time rewards are retained.</p>';
  let e=n.extra.find(e=>e.kind==='agreement'),t=e?treaty(n,e):null;if(t)html+=t.html;
  $('#cw-inspector').innerHTML=html;
  if(t){$('#cw-accept').onclick=()=>{if(t.blocked||state.agreements[t.key])return;state.agreements[t.key]='accepted';show(n);save()};$('#cw-decline').onclick=()=>{if(state.agreements[t.key])return;state.agreements[t.key]='declined';show(n);save()};if($('#cw-resubmit'))$('#cw-resubmit').onclick=()=>{delete state.agreements[t.key];show(n);save()};for(const [id,k]of [['#cw-war','war'],['#cw-sanctions','sanctions']])$(id).onchange=ev=>{state.conditions[t.partner]={...(state.conditions[t.partner]||{}),[k]:ev.target.checked};show(n);save()}}
 }
 function spirits(){state.panel='spirits';$('#cw-inspector').innerHTML='<h3>January 1970 · Starting National Spirits</h3>'+data.starting_spirits.map(s=>`<article class="cw-spirit"><h4>${esc(s.title)}</h4><p>${esc(s.description)}</p>${s.slot!==null?'<p class="cw-meta">Workers’ Party policy · '+(s.slot===state.government?'active':'suspended under this government')+'</p>':''}${list(Object.entries(s.mods).map(([k,v])=>data.stats[k][1]+': '+signed(v)))}</article>`).join('')}
 function news(){state.panel='news';const d=data.news,body=state.government===4?d.description:d.alternative_description;$('#cw-inspector').innerHTML=`<div class="cw-news-paper" style="background-image:url('${art.news_background}')"><img src="${art.news_photo}" alt="Color restoration of Kim Il Sung’s July 1994 funeral procession in Pyongyang"><h3>${esc(d.title)}</h3><p>${esc(body)}</p><button type="button" id="cw-news-dismiss">${esc(d.option)}</button></div><p class="cw-news-credit">8 July 1994 · Global news<br>${esc(d.image_credit)}</p>`;$('#cw-news-dismiss').onclick=()=>{show(ids[state.selected]);save()}}
 function panel(){if(state.panel==='spirits')spirits();else if(state.panel==='news')news();else show(ids[state.selected])}
 function draw(){
  current=state.section==='all'?data.nodes:data.nodes.filter(n=>n.group===state.section);
  const minx=Math.min(...current.map(n=>n.x)),maxx=Math.max(...current.map(n=>n.x)),miny=Math.min(...current.map(n=>n.y)),maxy=Math.max(...current.map(n=>n.y));
  const w=(maxx-minx)*96+230,h=(maxy-miny)*130+210,scale=state.native?1:Math.min(1,(viewport.clientWidth-12)/w),pt=n=>({x:(n.x-minx)*96+115,y:(n.y-miny)*130+65});
  canvas.style.width=(w*scale)+'px';canvas.style.height=(h*scale)+'px';const layer=$('#cw-nodes');layer.innerHTML='';layer.style.transform=`scale(${scale})`;layer.style.transformOrigin='0 0';
  for(const n of current){const p=pt(n),b=document.createElement('button');b.type='button';b.className='cw-focus'+(active(n)?'':' inactive')+(n.id===state.selected?' selected':'');b.dataset.id=n.id;b.setAttribute('aria-label',n.title);b.style.left=(p.x-82.5)+'px';b.style.top=p.y+'px';b.innerHTML=`<img src="${art[n.icon]}" alt=""><span class="cw-title" style="background-image:url('${art[active(n)?'available':'unavailable']}')">${esc(n.title)}</span>`;b.onclick=()=>{show(n);save()};layer.append(b)}
  const visible=new Set(current.map(n=>n.id)),svg=$('#cw-connectors');svg.setAttribute('width',w*scale);svg.setAttribute('height',h*scale);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML='';
  const path=(d,color)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',color);p.setAttribute('stroke-width','2');svg.append(p)};
  for(const n of current){const p=pt(n);for(const pg of n.prerequisites)for(const id of pg){if(!visible.has(id))continue;const a=pt(ids[id]),mid=(a.y+128+p.y)/2;path(`M${a.x},${a.y+128} V${mid} H${p.x} V${p.y}`,'#8e9985')}
   for(const id of n.mutex){if(!visible.has(id)||n.id>id)continue;const a=pt(ids[id]);if(current.some(b=>b.y===n.y&&b.x>Math.min(n.x,ids[id].x)&&b.x<Math.max(n.x,ids[id].x)&&n.mutex.includes(b.id)))continue;path(`M${Math.min(a.x,p.x)+83},${p.y+114} H${Math.max(a.x,p.x)-83}`,'#b76b59')}
  }
  const heads=$('#cw-headings');heads.innerHTML='';heads.style.transform=`scale(${scale})`;heads.style.transformOrigin='0 0';for(const g of data.groups){const ns=current.filter(n=>n.group===g.id);if(!ns.length)continue;const p=pt(ns[0]),t=document.createElement('div');t.className='cw-group-title';t.style.left=p.x+'px';t.style.top=(p.y-37)+'px';t.textContent=g.title;heads.append(t)}
  $('#cw-caption').textContent=state.section==='all'?`${data.nodes.length} focuses · ${data.groups.length} sections · 6 starting spirits`:data.groups.find(g=>g.id===state.section).title;
 }
 section.onchange=()=>{state.section=section.value;state.native=false;draw();show(current[0]);viewport.scrollTo(0,0);save()};gov.onchange=()=>{state.government=Number(gov.value);draw();panel();save()};date.onchange=()=>{state.year=Number(date.value);draw();panel();save()};
 $('#cw-fit').onclick=()=>{state.native=false;draw();save()};$('#cw-native').onclick=()=>{state.native=true;draw();save()};$('#cw-spirits').onclick=()=>{spirits();save()};$('#cw-news').onclick=()=>{news();save()};new ResizeObserver(()=>draw()).observe(viewport);
 draw();panel();restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',ev=>{if(ev.detail?.globals?.widgetState)restore(ev.detail.globals.widgetState)});
})();
</script>
