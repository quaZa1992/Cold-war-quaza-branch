&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

uot;local_diff&quot;:&quot;--- supplied_MD/localisation/english/MD_auto_agency_l_english.yml\n+++ Cold_War/localisation/english/MD_auto_agency_l_english.yml\n@@ -0,0 +1,2 @@\n+l_english:\n+ # COLDWAR: MD 2.0.3 removed the auto-agency queue (replaced by the native agency-upgrade queue). File intentionally emptied; it can be deleted.\n&quot;,&quot;content&quot;:&quot;l_english:\n # COLDWAR: MD 2.0.3 removed the auto-agency queue (replaced by the native agency-upgrade queue). File intentionally emptied; it can be deleted.\n&quot;,&quot;proposal_diff&quot;:&quot;--- localisation/english/MD_auto_agency_l_english.yml\n+++ /dev/null\n@@ -1,2 +0,0 @@\n-l_english:\n- # COLDWAR: MD 2.0.3 removed the auto-agency queue (replaced by the native agency-upgrade queue). File intentionally emptied; it can be deleted.\n&quot;,&quot;impact&quot;:&quot;Das Löschen entfernt keinen aktuell ausführbaren Code. Die native Agentur-Warteschlange und unsere separate SSR-Geheimdienstsperre bleiben bestehen.&quot;,&quot;purpose&quot;:&quot;Früher: englische Beschriftungen und Tooltips der zusätzlichen Warteschlange.&quot;,&quot;group&quot;:&quot;Leere Altdateien entfernen&quot;,&quot;ours&quot;:&quot;Bereits leer: nur ein Kommentar und der Sprachkopf l_english.&quot;,&quot;md&quot;:&quot;Die Datei existiert in der neuen MD-Version nicht mehr.&quot;,&quot;proposal&quot;:&quot;Diese einzelne leere Datei entfernen.&quot;},{&quot;path&quot;:&quot;Changelog.txt&quot;,&quot;upstream_diff&quot;:&quot;--- verified_old_MD/Changelog.txt\n+++ supplied_MD/Changelog.txt\n@@ -1,66 +1,7 @@\n v2.0.2\n \n-AI:\n- - Reduced AI support and repair ship production with fleet-size and combined auxiliary limits. (Issue #5171)\n- - [KUR] Made Iraq weigh war, stability, strength, opinion and influence before refusing Kurdish independence or autonomy (Issue #5143)\n-\n-Balance:\n- - Reduced the starting inflation of BLR, EGY, CUB LAO, DRC, AGL, IND, SER so it&#x27;s more stable for the nations to recover long term\n- - Fixed inflation and currency strength feeding each other into runaway hyperinflation, and made each policy rate point cut a fixed share of inflation so the rate still works when inflation is above 20%\n- - Reduced policy rate points&#x27; debt-interest contribution from 0.5 to 0.33 points (Issue #5190)\n- - Raised the policy rate cap to 30% (Issue #5190)\n- - A higher policy rate now always helps: an excess deficit can halve its inflation cut but no longer cancels it, each rate point softens the currency&#x27;s monthly fall when inflation is far above the rate, and the AI cuts 3 points a quarter when more than 5 above neutral and no longer raises its rate above 20% (Issue #5207, #5208, #5209)\n- - Reduced the income from Venezuela&#x27;s Budding Petrostate making them an infinite money printer\n- - 32 cell launchers can now be used with cruisers and smaller naval vessels\n- - [CHI] Now starts with 14 shipyards\n- - [JAP] Now starts with 14 shipyards\n- - [KOR] Now starts with 15 shipyards\n- - [SOV] Now starts with 24 shipyards\n- - [UKR] Fix events, lowering Policy Rate leading to inflation\n-\n Bugfix:\n- - Fixed policy rate adjustments, and updated reserve-debt tracking (Issue #5190)\n- - Standardized USA and Singapore influence call layout without changing effects. (Issue #5226)\n- - Fixed faction opinion changes that did nothing or skipped the opinion limits in Myanmar, Cuba, India and UK focuses, restored the battery park from two Singapore reclamation focuses, and fixed broken influence changes in a Syrian focus and two Israeli events (Issue #5124)\n- - Restored the DEV marker on the English in-game version banner so local builds show the dev version string\n- - Fixed faction goals that track member forces, industry, and territory not showing or completing\n- - Recon Rangers are now correctly enabled\n- - Removed the duplicate clause from 30 OR blocks; the repeats that hid copy-paste errors now check ENG in the G7 AI lists, fascists in power for the Western Autocracy invite, state 715 for Russia&#x27;s Nazbol focus, communist cadres opinion in Spain, ASEAN_Member for same-organization checks, and dead as well as exiled for two Libyan leaders (Issue #5268)\n- - [CZE] Fixed omission that made Czech gasoline engines not usable for any variants\n- - [GRE] Fixed austerity tensions spirit being given twice in some circumstances.\n- - [ISR] Favor the Republican Party now gives Israel its political power and Likud popularity instead of the USA (Issue #5175)\n- - [ISR] Likud visit events now name the current Israeli and Brazilian leaders\n- - [ISR] World Populism events now boost the right-wing populists instead of the fascists, and the Hungarian event boosts Fidesz\n- - [ISR] World Populism no longer sends Brazil the Washington visit event\n- - [ISR] IAI Hunter drone now starts in its correct year 2000 configuration.\n- - [JAP] Mitsubishi Aerospace now covers medium aircraft, so Japan&#x27;s F-4EJ and F-15J fighters have a domestic MIO (Issue #5233)\n- - [LBA] Prevent the African Union Meeting event at minimum corruption to avoid a pointless political power loss (Issue #4870)\n- - [SIA] Ghosts of the Jungle now grants its Communist and Emerging Outlook support drive and the Ghosts of the CPT spirit; the path reset it runs was wiping both\n- - [SOV] Incorrect setup production for utility vehicle fixed, as well as BMD-1P parent version.\n- - [UKR] Ukraine now starts at the 30% policy rate cap, and National Bank of Ukraine rate cuts stop at 0% (Issue #5190)\n-\n-Graphics:\n- - Fixed the double farm conversion option appearing without two convertible farms in owned and controlled states below the civilian factory cap\n- - [UKR] Renamed 116 bare equipment icons to quoted GFX_ form (same frame as GFX_MT_LBU) across tank/SPART profiles and designer pools so they resolve as GFX entries; also fixed an Australia date check, the invalid collection_size trigger in internal faction event 31, and v2.0 changelog markdown formatting\n-\n-Localization:\n- - Fixed English prose typos, missing punctuation, and three Serbian disaster descriptions (Issue #5127)\n- - Replaced two placeholder descriptions, renamed Panama&#x27;s Calor-Calor cartel party, and fixed a garbled Dixie &amp; Delta Party sentence (Issue #5127)\n- - Updated the nuclear bomb logistics tooltip to properly explain how the MD nuclear system works, to remove UI confusion on the system.\n-\n-Database:\n- - AK-74 Family - tweaked which models are used across the mod, less AK-74N in pre-existing OOB&#x27;s, more AK-74M&#x27;s in focus trees.\n- - RPG-7 Family - changed all mod mentions to pull the RPG-7V model instead of base RPG-7, which uses upgrades.\n- - [HEZ] Tweaked starting small arms to better represent weapons used in 2000.\n- - [KAZ] Tweaked starting small arms to better represent stockpiles in 2000.\n- - [SOV] Ongoing work to predefine equipment for all starting SOV units.\n- - [SOV] Added small numbers of MRAP&#x27;s to SOV starting OOB.\n- - [UKR, GEO, BLR] Added small stockpiles of AS VAL&#x27;s to each.\n-\n-Performance:\n- - Reduced the number of checks per hour when evaluating whether the AI should be intervention laws for Neo-Imperialism\n- - Reduced the number of any_neighbor_country in the French decisions reducing demand when the communist decisions are active for an AI\n- - Inverted any_neighbor_country that is at war with ROOT calls to any enemy country is neighbor of to reduce the number of checks per hour on machines\n+ - Restored HOI4 1.19.4 UI controls and keyboard shortcuts, corrected research-tab tooltips, and replaced the modded agency-upgrade queue and obsolete offer filters with native controls.\n \n For more details checkout the website at:\n https://millenniumdawn.github.io/Millennium-Dawn/changelogs/v2-0-changes/\n&quot;,&quot;local_diff&quot;:&quot;--- supplied_MD/Changelog.txt\n+++ Cold_War/Changelog.txt\n@@ -1,7 +1,66 @@\n v2.0.2\n \n+AI:\n+ - Reduced AI support and repair ship production with fleet-size and combined auxiliary limits. (Issue #5171)\n+ - [KUR] Made Iraq weigh war, stability, strength, opinion and influence before refusing Kurdish independence or autonomy (Issue #5143)\n+\n+Balance:\n+ - Reduced the starting inflation of BLR, EGY, CUB LAO, DRC, AGL, IND, SER so it&#x27;s more stable for the nations to recover long term\n+ - Fixed inflation and currency strength feeding each other into runaway hyperinflation, and made each policy rate point cut a fixed share of inflation so the rate still works when inflation is above 20%\n+ - Reduced policy rate points&#x27; debt-interest contribution from 0.5 to 0.33 points (Issue #5190)\n+ - Raised the policy rate cap to 30% (Issue #5190)\n+ - A higher policy rate now always helps: an excess deficit can halve its inflation cut but no longer cancels it, each rate point softens the currency&#x27;s monthly fall when inflation is far above the rate, and the AI cuts 3 points a quarter when more than 5 above neutral and no longer raises its rate above 20% (Issue #5207, #5208, #5209)\n+ - Reduced the income from Venezuela&#x27;s Budding Petrostate making them an infinite money printer\n+ - 32 cell launchers can now be used with cruisers and smaller naval vessels\n+ - [CHI] Now starts with 14 shipyards\n+ - [JAP] Now starts with 14 shipyards\n+ - [KOR] Now starts with 15 shipyards\n+ - [SOV] Now starts with 24 shipyards\n+ - [UKR] Fix events, lowering Policy Rate leading to inflation\n+\n Bugfix:\n- - Restored HOI4 1.19.4 UI controls and keyboard shortcuts, corrected research-tab tooltips, and replaced the modded agency-upgrade queue and obsolete offer filters with native controls.\n+ - Fixed policy rate adjustments, and updated reserve-debt tracking (Issue #5190)\n+ - Standardized USA and Singapore influence call layout without changing effects. (Issue #5226)\n+ - Fixed faction opinion changes that did nothing or skipped the opinion limits in Myanmar, Cuba, India and UK focuses, restored the battery park from two Singapore reclamation focuses, and fixed broken influence changes in a Syrian focus and two Israeli events (Issue #5124)\n+ - Restored the DEV marker on the English in-game version banner so local builds show the dev version string\n+ - Fixed faction goals that track member forces, industry, and territory not showing or completing\n+ - Recon Rangers are now correctly enabled\n+ - Removed the duplicate clause from 30 OR blocks; the repeats that hid copy-paste errors now check ENG in the G7 AI lists, fascists in power for the Western Autocracy invite, state 715 for Russia&#x27;s Nazbol focus, communist cadres opinion in Spain, ASEAN_Member for same-organization checks, and dead as well as exiled for two Libyan leaders (Issue #5268)\n+ - [CZE] Fixed omission that made Czech gasoline engines not usable for any variants\n+ - [GRE] Fixed austerity tensions spirit being given twice in some circumstances.\n+ - [ISR] Favor the Republican Party now gives Israel its political power and Likud popularity instead of the USA (Issue #5175)\n+ - [ISR] Likud visit events now name the current Israeli and Brazilian leaders\n+ - [ISR] World Populism events now boost the right-wing populists instead of the fascists, and the Hungarian event boosts Fidesz\n+ - [ISR] World Populism no longer sends Brazil the Washington visit event\n+ - [ISR] IAI Hunter drone now starts in its correct year 2000 configuration.\n+ - [JAP] Mitsubishi Aerospace now covers medium aircraft, so Japan&#x27;s F-4EJ and F-15J fighters have a domestic MIO (Issue #5233)\n+ - [LBA] Prevent the African Union Meeting event at minimum corruption to avoid a pointless political power loss (Issue #4870)\n+ - [SIA] Ghosts of the Jungle now grants its Communist and Emerging Outlook support drive and the Ghosts of the CPT spirit; the path reset it runs was wiping both\n+ - [SOV] Incorrect setup production for utility vehicle fixed, as well as BMD-1P parent version.\n+ - [UKR] Ukraine now starts at the 30% policy rate cap, and National Bank of Ukraine rate cuts stop at 0% (Issue #5190)\n+\n+Graphics:\n+ - Fixed the double farm conversion option appearing without two convertible farms in owned and controlled states below the civilian factory cap\n+ - [UKR] Renamed 116 bare equipment icons to quoted GFX_ form (same frame as GFX_MT_LBU) across tank/SPART profiles and designer pools so they resolve as GFX entries; also fixed an Australia date check, the invalid collection_size trigger in internal faction event 31, and v2.0 changelog markdown formatting\n+\n+Localization:\n+ - Fixed English prose typos, missing punctuation, and three Serbian disaster descriptions (Issue #5127)\n+ - Replaced two placeholder descriptions, renamed Panama&#x27;s Calor-Calor cartel party, and fixed a garbled Dixie &amp; Delta Party sentence (Issue #5127)\n+ - Updated the nuclear bomb logistics tooltip to properly explain how the MD nuclear system works, to remove UI confusion on the system.\n+\n+Database:\n+ - AK-74 Family - tweaked which models are used across the mod, less AK-74N in pre-existing OOB&#x27;s, more AK-74M&#x27;s in focus trees.\n+ - RPG-7 Family - changed all mod mentions to pull the RPG-7V model instead of base RPG-7, which uses upgrades.\n+ - [HEZ] Tweaked starting small arms to better represent weapons used in 2000.\n+ - [KAZ] Tweaked starting small arms to better represent stockpiles in 2000.\n+ - [SOV] Ongoing work to predefine equipment for all starting SOV units.\n+ - [SOV] Added small numbers of MRAP&#x27;s to SOV starting OOB.\n+ - [UKR, GEO, BLR] Added small stockpiles of AS VAL&#x27;s to each.\n+\n+Performance:\n+ - Reduced the number of checks per hour when evaluating whether the AI should be intervention laws for Neo-Imperialism\n+ - Reduced the number of any_neighbor_country in the French decisions reducing demand when the communist decisions are active for an AI\n+ - Inverted any_neighbor_country that is at war with ROOT calls to any enemy country is neighbor of to reduce the number of checks per hour on machines\n \n For more details checkout the website at:\n https://millenniumdawn.github.io/Millennium-Dawn/changelogs/v2-0-changes/\n&quot;,&quot;content&quot;:&quot;&quot;,&quot;proposal_diff&quot;:&quot;--- aktuell/Changelog.txt\n+++ Vorschlag/Changelog.txt\n@@ -1,66 +1,7 @@\n v2.0.2\n \n-AI:\n- - Reduced AI support and repair ship production with fleet-size and combined auxiliary limits. (Issue #5171)\n- - [KUR] Made Iraq weigh war, stability, strength, opinion and influence before refusing Kurdish independence or autonomy (Issue #5143)\n-\n-Balance:\n- - Reduced the starting inflation of BLR, EGY, CUB LAO, DRC, AGL, IND, SER so it&#x27;s more stable for the nations to recover long term\n- - Fixed inflation and currency strength feeding each other into runaway hyperinflation, and made each policy rate point cut a fixed share of inflation so the rate still works when inflation is above 20%\n- - Reduced policy rate points&#x27; debt-interest contribution from 0.5 to 0.33 points (Issue #5190)\n- - Raised the policy rate cap to 30% (Issue #5190)\n- - A higher policy rate now always helps: an excess deficit can halve its inflation cut but no longer cancels it, each rate point softens the currency&#x27;s monthly fall when inflation is far above the rate, and the AI cuts 3 points a quarter when more than 5 above neutral and no longer raises its rate above 20% (Issue #5207, #5208, #5209)\n- - Reduced the income from Venezuela&#x27;s Budding Petrostate making them an infinite money printer\n- - 32 cell launchers can now be used with cruisers and smaller naval vessels\n- - [CHI] Now starts with 14 shipyards\n- - [JAP] Now starts with 14 shipyards\n- - [KOR] Now starts with 15 shipyards\n- - [SOV] Now starts with 24 shipyards\n- - [UKR] Fix events, lowering Policy Rate leading to inflation\n-\n Bugfix:\n- - Fixed policy rate adjustments, and updated reserve-debt tracking (Issue #5190)\n- - Standardized USA and Singapore influence call layout without changing effects. (I derno v2.0.2\&quot;\n+ VERSION_MD_LOADING: \&quot;Versión: v2.0.3\&quot;\n+ VERSION_MD: \&quot;Millennium Dawn: Un día moderno v2.0.3\&quot;\n  VERSION_MD_DATE: \&quot;Fecha de lanzamiento: 3 de octubre de 2026\&quot;\n  MENU_MD_WIKI: \&quot;Información útil en nuestro sitio web. Encontrarás información sobre sumas de comprobación, lanzamientos de mods, tutoriales y más.\&quot;\n  MENU_STEAMWORKSHOP: \&quot;Déjanos una calificación en el Workshop de Steam\&quot;\n&quot;,&quot;impact&quot;:&quot;Bisher keine Änderung an der aktiven Mod durch diesen Vergleich.&quot;,&quot;purpose&quot;:&quot;Vorhandene Versionsanzeige in der Oberfläche.&quot;,&quot;group&quot;:&quot;Versionen und Beschreibung&quot;,&quot;ours&quot;:&quot;Die vorhandenen Texte nennen noch v2.0.2.&quot;,&quot;md&quot;:&quot;Dieselben vorhandenen Texte nennen v2.0.3.&quot;,&quot;proposal&quot;:&quot;Nur 2.0.2 durch 2.0.3 ersetzen. Keine neuen Übersetzungen, keine Gameplay-Änderung.&quot;},{&quot;path&quot;:&quot;common/intelligence_agency_upgrades/README.md&quot;,&quot;upstream_diff&quot;:&quot;--- verified_old_MD/common/intelligence_agency_upgrades/README.md\n+++ supplied_MD/common/intelligence_agency_upgrades/README.md\n@@ -1,147 +1,21 @@\n # Intelligence Agency Upgrades\n \n-This directory holds the intelligence agency upgrade definitions used by the vanilla \&quot;Intelligence Agency\&quot; UI and by the Millennium Dawn **auto-agency** queue system.\n+`intelligence_agency_upgrades.txt` defines the agency upgrades shown in the normal Intelligence Agency window. `_documentation.info` describes the engine syntax.\n \n-`_documentation.info` describes the vanilla `upgrade = { ... }` block syntax. This README covers the MD-specific wiring that every upgrade must have so it flows through the auto-agency queue, tooltips, and icons.\n+Each upgrade needs:\n \n-## Files involved\n+- a unique `upgrade_*` ID\n+- a `picture = GFX_*` sprite defined in `interface/*.gfx`\n+- its native `available` prerequisites, if any\n+- every intended `level`, including the full `modifier` and `complete_effect`\n+- an `ai_will_do` block\n \n-Adding or renaming an agency upgrade touches seven files. All seven must stay in sync or the upgrade will be invisible, unclickable, or show as a blank icon in the queue UI.\n+References from `create_intelligence_agency` must use a defined agency logo sprite. References from `upgrade_intelligence_agency` must name an upgrade defined in this directory.\n \n-| File                                                                   | What it holds                                                                                |\n-| ---------------------------------------------------------------------- | -------------------------------------------------------------------------------------------- |\n-| `common/intelligence_agency_upgrades/intelligence_agency_upgrades.txt` | Source of truth — the `upgrade_X = { ... }` block with `picture`, `ai_will_do`, `level = {}` |\n-| `common/on_actions/MD_auto_agency_on_actions.txt`                      | Registry — assigns the upgrade to an index in four parallel global arrays                    |\n-| `localisation/english/MD_auto_agency_l_english.yml`                    | Loc triple — token id / display name / gfx sprite name                                       |\n-| `common/scripted_guis/00_MD_auto_agency_scripted_gui.txt`              | Prerequisite gating (only if the upgrade needs `has_done_agency_upgrade = ...` prereqs)      |\n-| `common/scripted_triggers/00_MD_auto_agency_scripted_triggers.txt`     | Per-index `can_select` / `slot_available` triggers and their dispatch branches               |\n-| `common/scripted_effects/00_MD_auto_agency_scripted_effects.txt`       | Per-index seed branch in `MD_auto_agency_seed_completed_cache`                               |\n-| `interface/countryintelligenceagencyview.gfx`                          | Sprite definition referenced by `picture =` and the `_gfx` loc key                           |\n-\n-## Adding a new upgrade — step by step\n-\n-Say you are adding `upgrade_deepfake_detection` as index **25** (the next free slot). The process is:\n-\n-### 1. Define the upgrade\n-\n-Add the block to `intelligence_agency_upgrades.txt` inside a branch:\n-\n-```\n-upgrade_deepfake_detection = {\n-    picture = GFX_agency_cyber_security        # must exist in a .gfx file\n-    frame = GFX_upgrade_frame_intel\n-    sound = Spy_Agency_Intel_Upgrades_Confirm\n-\n-    ai_will_do = { base = 3 ... }\n-    modifiers_during_progress = { hidden_modifier = { MD_auto_agency_in_progress_boolean = 1 } }\n-    available = { custom_trigger_tooltip = { tooltip = cannot_manually_upgrade_agency_tt MD_auto_agency_manual_upgrade_available = yes } }\n-\n-    level = { modifier = { ... } complete_effect = { ... } }\n-    level = { modifier = { ... } complete_effect = { ... } }\n-}\n-```\n-\n-The number of `level = { }` blocks is the upgrade&#x27;s **max level**. Record that — you need it in step 2.\n-\n-### 2. Register the upgrade in on_actions\n-\n-Open `common/on_actions/MD_auto_agency_on_actions.txt`. Two things must happen:\n-\n-- Bump the `size = N` on every `resize_array` from `25` to `26` (one per array):\n-\n-  ```\n-  resize_array = { array = global.agency_upgrades     value = 0 size = 26 }\n-  resize_array = { array = global.agency_names        value = 0 size = 26 }\n-  resize_array = { array = global.agency_gfx          value = 0 size = 26 }\n-  resize_array = { array = global.agency_max_upgrades value = 1 size = 26 }\n-  ```\n-\n-- Add four `set_variable` lines at the end (one per parallel array). Index, token, and suffix **must match exactly**:\n-\n-  ```\n-  set_variable = { global.agency_upgrades^25     = token:MD_auto_agency_25_upgrade_deepfake_detection }\n-  set_variable = { global.agency_names^25        = token:MD_auto_agency_25_upgrade_deepfake_detection_name }\n-  set_variable = { global.agency_gfx^25          = token:MD_auto_agency_25_upgrade_deepfake_detection_gfx }\n-  set_variable = { global.agency_max_upgrades^25 = 2 }   # number of level = {} blocks\n-  ```\n-\n-If your upgrade has only **one level**, the `agency_max_upgrades^N` line can be omitted — the `resize_array` pre-fills it with `1`.\n-\n-- The four registry arrays above are separate from `common/scripted_effects/00_MD_auto_agency_scripted_effects.txt`&#x27;s `MD_auto_agency_init_country_state`, which hardcodes its own `resize_array = { array = agency_upgrades_completed_and_queued value = 0 size = 25 }`. Bump that size alongside the four registry arrays or the new index can never be queued.\n-\n-### 3. Add localisation\n-\n-Open `localisation/english/MD_auto_agency_l_english.yml` and add the three loc keys. The pattern is fixed — prefix `MD_auto_agency_NN_` where `NN` is the zero-padded index:\n-\n-```\n- MD_auto_agency_25_upgrade_deepfake_detection: \&quot;upgrade_deepfake_detection\&quot;\n- MD_auto_agency_25_upgrade_deepfake_detection_name: \&quot;$upgrade_deepfake_detection$\&quot;\n- MD_auto_agency_25_upgrade_deepfake_detection_gfx: \&quot;GFX_agency_cyber_security\&quot;\n-```\n-\n-- The base key&#x27;s value is the literal `upgrade_X` token (used as the game&#x27;s upgrade id).\n-- `_name` must use the `$upgrade_X$` loc reference so it pulls the name the vanilla agency UI uses.\n-- `_gfx` must equal the exact `picture =` GFX sprite from step 1 — the validator enforces this so the auto-agency queue and the vanilla agency view show the same icon.\n-\n-### 4. Add prerequisites (only if the upgrade has them)\n-\n-If the upgrade has a `has_done_agency_upgrade = upgrade_X` prereq, add a corresponding `custom_trigger_tooltip` branch inside `agency_upgrade_icon_button_click_enabled` in `common/scripted_guis/00_MD_auto_agency_scripted_gui.txt`, keyed on the index&#x27;s `i` value. See the existing blocks for `i = 19` (crypto_strength_2), `i = 21-23` (cyber ops), and `i = 24` (cyber elite) as templates.\n-\n-Also add a matching `MD_auto_agency_prereq_X_tt` loc key describing the prereq text, and extend `MD_auto_agency_scripted_loc_prereqs` in `common/scripted_localisation/00_MD_auto_agency_scripted_localisation.txt` to dispatch on the index.\n-\n-### 5. Register the selection and slot triggers\n-\n-In `common/scripted_triggers/00_MD_auto_agency_scripted_triggers.txt` every new index needs:\n-\n-- a `MD_auto_agency_can_select_upgrade_N_trigger` (use `always = yes` when there are no prereqs) plus a matching `AND = { check_variable = { v = N } ... }` branch in `MD_auto_agency_v_can_select`;\n-- a `MD_auto_agency_slot_available_N_trigger` comparing `agency_upgrades_completed_and_queued^N` against `global.agency_max_upgrades^N`, plus an `AND = { ..._slot_available_N_trigger ..._can_select_upgrade_N_trigger }` branch in `MD_auto_agency_can_upgrade`.\n-\n-`MD_auto_agency_can_upgrade` is the start gate for the whole automation, so an index missing there can never be picked even when a level is free.\n-\n-### 6. Seed the completion cache\n-\n-Add a branch to `MD_auto_agency_seed_completed_cache` in `common/scripted_effects/00_MD_auto_agency_scripted_effects.txt`:\n-\n-```\n-if = {\n-    limit = { has_done_agency_upgrade = upgrade_deepfake_detection }\n-    set_variable = { agency_upgrades_completed_and_queued^25 = 1 }\n-}\n-```\n-\n-This runs once per country on first queue-tab open so levels taken through history, focuses, or the vanilla agency UI are already counted. `has_done_agency_upgrade` is per-upgrade, not per-level, so a country that took several levels before opening the tab seeds as `1` — that under-count is the engine&#x27;s limit, not something to work around here.\n-\n-### 7. Ensure the sprite exists\n-\n-Confirm `GFX_agency_cyber_security` (or whichever sprite you used) is defined in `interface/countryintelligenceagencyview.gfx` or another `.gfx` file. If you need a brand-new sprite, add a `spriteType = { name = \&quot;...\&quot; texturefile = \&quot;gfx/...\&quot; }` entry there first.\n-\n-## Validation\n-\n-Run the validator to confirm everything lines up:\n+Run the focused validator with:\n \n ```bash\n python3 tools/validation/validate_agency_upgrades.py --path .\n ```\n \n-The validator covers nine checks:\n-\n-1. **Registry coverage** — every `upgrade_X` defined in this directory is registered in all four parallel arrays, and every registry entry points to a real upgrade. Parallel arrays must use the same token at the same index (`_name` and `_gfx` suffixes enforced).\n-2. **max_upgrades vs level count** — `global.agency_max_upgrades^N` equals the number of `level = { }` blocks in the upgrade definition.\n-3. **Loc triples + GFX** — each index has `MD_auto_agency_NN_*` / `_name` / `_gfx` keys, the `_gfx` value matches the definition&#x27;s `picture =` field, and both resolve to a real sprite.\n-4. **Array size / gaps** — every `resize_array size = N` literal matches the registered index count; no missing indices between 0 and max.\n-5. **scripted_gui prereqs** — `has_done_agency_upgrade = X` references in the queue GUI resolve to real upgrade names.\n-6. **`create_intelligence_agency` icons (mod-wide)** — every country that creates an agency in focus/event/history files references a real `GFX_intelligence_agency_logo_*` sprite.\n-7. **`upgrade_intelligence_agency` calls (mod-wide)** — every `upgrade_intelligence_agency = upgrade_X` call (in focuses, events, history, faction goals, etc.) references a defined upgrade.\n-8. **can_select trigger + dispatch coverage** — every registered index has a `MD_auto_agency_can_select_upgrade_N_trigger` definition and a matching dispatch branch in `MD_auto_agency_v_can_select`, with no orphaned definitions or dispatch branches for unregistered indices.\n-9. **Completion cache coverage** — every registered index has a `MD_auto_agency_slot_available_N_trigger` reading its own array slot, an `AND` branch for it in `MD_auto_agency_can_upgrade`, and a seed branch in `MD_auto_agency_seed_completed_cache` naming the upgrade the registry has at that index. Orphans in either direction are flagged.\n-\n-## Common mistakes\n-\n-- **Index mismatch across parallel arrays** — e.g. `agency_upgrades^5 = ..._counter_terror_operations` but `agency_names^5 = ..._something_else_name`. The validator catches this.\n-- **Forgetting to bump `resize_array size =`** — the first four lines of on_actions need the new total.\n-- **Picture vs `_gfx` loc mismatch** — if `picture = GFX_A` in the def but `_gfx: \&quot;GFX_B\&quot;` in loc, the vanilla agency UI shows A while the auto-agency queue shows B.\n-- **Non-existent agency logo** — countries passing an invalid `icon = GFX_intelligence_agency_logo_xyz` to `create_intelligence_agency` silently render a blank. Use the `GFX_intelligence_agency_logo_generic_1..9` sprites when no country-specific one exists.\n-- **Prereq added to scripted_gui but not to loc** — the prereq tooltip renders as `[MD_auto_agency_prereq_X_tt]` literal text. Add the loc key and the `MD_auto_agency_scripted_loc_prereqs` dispatch entry together.\n-- **New index registered but no `v_can_select` dispatch branch** — the upgrade is never auto-selected.\n-- **New index missing from `MD_auto_agency_can_upgrade`** — the start gate goes false, and the automation stops activating missions entirely once the other indices are maxed.\n-- **`meta_trigger` in the auto-agency hot path** — the whole system is deliberately statically dispatched. `has_done_agency_upgrade` needs a literal name, so write out the per-index branch instead of interpolating one.\n+It checks duplicate upgrade IDs, required upgrade pictures and their sprites, agency creation icons, and upgrade effect references.\n&quot;,&quot;local_diff&quot;:&quot;&quot;,&quot;content&quot;:&quot;&quot;,&quot;proposal_diff&quot;:&quot;&quot;,&quot;impact&quot;:&quot;Keine erneute Übernahme der ganzen MD-Datei erforderlich.&quot;,&quot;purpose&quot;:&quot;Entwicklerdokumentation für Geheimdienst-Upgrades.&quot;,&quot;group&quot;:&quot;Bereits int   &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;md203-files&#x27;);
    const rows=JSON.parse(root.querySelector(&#x27;#md203-data&#x27;).textContent);
    const $=id=&gt;root.querySelector(&#x27;#md203-&#x27;+id);
    const select=$(&#x27;file&#x27;);
    const groups=new Map();
    for(const row of rows){
      let group=groups.get(row.group);
      if(!group){group=document.createElement(&#x27;optgroup&#x27;);group.label=row.group;select.append(group);groups.set(row.group,group);}
      const opt=document.createElement(&#x27;option&#x27;);opt.value=row.path;opt.textContent=row.path;group.append(opt);
    }
    function remember(row){
      if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{selectedFile:row.path,category:row.group,proposal:row.proposal},privateContent:{revision:1,path:row.path}}).catch(()=&gt;{});
    }
    function show(path,save=false){
      const row=rows.find(r=&gt;r.path===path)||rows[0];const index=rows.indexOf(row);select.value=row.path;
      $(&#x27;counter&#x27;).textContent=(index+1)+&#x27; / &#x27;+rows.length;
      for(const field of [&#x27;path&#x27;,&#x27;purpose&#x27;,&#x27;ours&#x27;,&#x27;md&#x27;,&#x27;proposal&#x27;,&#x27;impact&#x27;])$(field).textContent=row[field];
      for(const [field,key] of [[&#x27;content&#x27;,&#x27;content&#x27;],[&#x27;proposal-diff&#x27;,&#x27;proposal_diff&#x27;],[&#x27;up-diff&#x27;,&#x27;upstream_diff&#x27;],[&#x27;local-diff&#x27;,&#x27;local_diff&#x27;]])$(field).textContent=row[key]||&#x27;Keine Änderung.&#x27;;
      $(&#x27;current-wrap&#x27;).hidden=!row.content;
      $(&#x27;proposal-wrap&#x27;).hidden=!row.proposal_diff;
      $(&#x27;up-wrap&#x27;).hidden=!row.upstream_diff;
      $(&#x27;local-wrap&#x27;).hidden=!row.local_diff;
      $(&#x27;current-wrap&#x27;).open=row.group===&#x27;Leere Altdateien entfernen&#x27;;
      $(&#x27;proposal-wrap&#x27;).open=row.group===&#x27;Versionen und Beschreibung&#x27;;
      for(const id of [&#x27;up-wrap&#x27;,&#x27;local-wrap&#x27;])$(id).open=false;
      $(&#x27;prev&#x27;).disabled=index===0;$(&#x27;next&#x27;).disabled=index===rows.length-1;
      if(save)remember(row);
    }
    select.addEventListener(&#x27;change&#x27;,()=&gt;show(select.value,true));
    $(&#x27;prev&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;show(rows[Math.max(0,rows.findIndex(r=&gt;r.path===select.value)-1)].path,true));
    $(&#x27;next&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;show(rows[Math.min(rows.length-1,rows.findIndex(r=&gt;r.path===select.value)+1)].path,true));
    function restore(state){const saved=state?.privateContent;if(saved?.revision===1)show(saved.path);}
    window.addEventListener(&#x27;openai:set_globals&#x27;,e=&gt;{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
    show(window.openai?.widgetState?.privateContent?.path||rows[0].path);
  })();
