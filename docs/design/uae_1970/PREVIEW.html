nvasion exists: offer 3% GDP financial support, negotiated transit, or opt-in deployment. Kuwait/coalition recipients receive the funded offer. Neutral civil protection costs 1% GDP and gives +3% stability for 365 days.","effect_code":""},{"id":"COLDWAR_UAE_decision_founders","label":"The Founders’ Settlement","group":"union","unlock":"COLDWAR_UAE_charter","pp":35,"days":60,"summary":"Choose the proposed charter priority, negotiate ruler guarantees, then accept the settlement. Acceptance sets COLDWAR_UAE_founders_consented and the chosen charter term flag; only the matching institutional focus is available. A refused stronger mandate can be renegotiated as emirate guarantees. Broader Bahrain/Qatar agreement separately sets COLDWAR_UAE_broad_charter_accepted. No annexation or forced consent.","effect_code":"","sets_flags":["COLDWAR_UAE_founders_consented"],"choice_flags":{"stronger_mandate":"COLDWAR_UAE_mandate_agreed","emirate_guarantees":"COLDWAR_UAE_guarantees_agreed"},"mutually_exclusive_choice_flags":true},{"id":"COLDWAR_UAE_decision_sharjah","label":"The Sharjah Crisis","group":"monarchy","unlock":"COLDWAR_UAE_majlis","pp":25,"days":30,"summary":"Triggered only by a restoration/coup attempt, with the historical crisis context January1972. Choose negotiated surrender (2% start-date GDP, +3% stability for365 days) or federal security intervention (+10 Army experience, +5% military personnel costs for365 days). Local ruler settlement is explicit; neither option installs an invented Baath government. One resolved crisis, one reward.","effect_code":""},{"id":"COLDWAR_UAE_decision_cabinet_bargain","label":"The Federal Cabinet Bargain","group":"monarchy","unlock":"COLDWAR_UAE_rulers_compact","pp":35,"days":90,"summary":"A 1976–79 constitutional dispute may be settled by a federal cabinet led by an agreed Dubai nominee, historically Rashid in1979, with recognition of emirate authority. −3 percentage points of the Fragmented Authority bureaucracy penalty once, floor0; +3% bureaucracy spending while the negotiated cabinet is active. President and prime minister remain distinct offices.","effect_code":""},{"id":"COLDWAR_UAE_decision_training_offer","label":"Offer a Training Agreement","group":"diplomacy","unlock":"COLDWAR_UAE_security_contracts","pp":25,"days":90,"summary":"Selected eligible partner receives the offer. Accept: UAE pays exactly2% of offer-date GDP, gains15 Army experience and −5% training time for730 days. Partner grants access to instructors without an imposed treasury debit. Reject: no charge or benefit. Cooldown730 days; replacement, no stacking.","effect_code":""},{"id":"COLDWAR_UAE_decision_exchange_offer","label":"Offer a Technical Exchange","group":"diplomacy","unlock":"COLDWAR_UAE_technical_exchange","pp":25,"days":90,"summary":"Selected eligible partner receives the offer. Accept: UAE pays exactly2% of offer-date GDP, gains10 productivity points per controlled state once; partner chooses whether to provide experts and has no automatic payment. Reject: nothing charged or granted. Cooldown730 days per partner.","effect_code":""},{"id":"COLDWAR_UAE_decision_british_cofinance","label":"Request British Co-Financing","group":"british","unlock":"COLDWAR_UAE_enduring_protection","pp":25,"days":60,"summary":"Offer one agreed development grant. UK acceptance: UK treasury −$0.25bn, UAE treasury +$0.25bn, once per country programme. UK must have the money and UAE must still be its subject under the compact. Refusal/expiry moves no money; paid flag prevents repeat grants even after government changes.","effect_code":"# UK-scoped accepted option; the current-offer trigger is NEW nonce-aware integration.\nif = {\n limit = {\n  original_tag = ENG\n  country_exists = UAE\n  check_variable = { var = treasury value = 0.25 compare = greater_than_or_equals }\n  UAE = {\n   is_subject_of = ENG\n   has_country_flag = COLDWAR_UAE_protection_accepted\n   has_completed_focus = COLDWAR_UAE_enduring_protection\n   NOT = { has_country_flag = COLDWAR_UAE_british_development_grant_paid }\n  }\n  COLDWAR_UAE_british_offer_is_current = yes # NEW requestID/nonce guard\n }\n set_temp_variable = { treasury_change = -0.25 }\n modify_treasury_effect = yes\n UAE = {\n  set_temp_variable = { treasury_change = 0.25 }\n  modify_treasury_effect = yes\n  set_country_flag = COLDWAR_UAE_british_development_grant_paid\n }\n}"},{"id":"COLDWAR_UAE_decision_british_amendment","label":"Amend the Withdrawal Terms","group":"british","unlock":"COLDWAR_UAE_treaty_coast","pp":35,"days":60,"summary":"Available for the starting withdrawal schedule or an accepted replacement compact: propose a different date or change the protection/cooperation terms. Both countries must explicitly accept the same amendment. The current schedule remains in force until a valid replacement is accepted before its deadline; UK cannot silently postpone it. Replace both mirrored spirits and nonce together. Normal historical withdrawal requires no use of this decision.","effect_code":""},{"id":"COLDWAR_UAE_decision_british_withdrawal_policy","label":"The British Withdrawal Policy","group":"british","unlock":null,"pp":0,"days":0,"summary":"The withdrawal schedule and paired spirits already exist on 1 January 1970. No UK approval decision is needed for the normal historical release. UK may offer earlier release, handover cooperation or renewed protection; changing the baseline requires UAE consent. A pending or refused offer never pauses the scheduled release.","effect_code":""}],"starting_spirits":[{"id":"COLDWAR_UAE_treaty_dependence","label":"British Withdrawal Announced","description":"In January 1968 Britain announced that its forces would leave the Gulf by the end of 1971. The Trucial rulers must prepare for the end of British protection. Until that withdrawal, Britain retains its external-affairs and defence responsibilities.","modifiers":{"political_power_factor":-0.1},"active_condition":"is_subject_of = ENG","native_consequences":{"Starting withdrawal schedule":"Present from 1 January 1970 in both countries. Announced deadline: by the end of 1971. Historical scenario execution: 1 December 1971, without a new petition, focus or UK vote.","Existing British subject relation":"Native subject restrictions remain until actual release; no duplicate factory-transfer penalty.","Changing the plan":"An earlier release or continued protection needs mutual consent. Unsigned or refused talks leave the original schedule running."},"treatment":"Reuse the existing treaty_dependence ID and −10% political power contribution. Replace its visible terms after an accepted compact; deactivate on actual release. Sovereign federal formation remains a separate focus."},{"id":"COLDWAR_UAE_fragmented_authority","label":"Fragmented Authority","description":"Separate courts, administrations and forces make common action expensive and difficult.","modifiers":{"bureaucracy_cost_multiplier_modifier":0.2,"army_org_factor":-0.1},"treatment":"Constitutional bargains reduce administration costs; Union Command or Coordinated Commands treats the military penalty. No permanent extra penalty after full removal."},{"id":"COLDWAR_UAE_unequal_development","label":"Unequal Development","description":"Abu Dhabi has oil; Dubai has commerce; the northern emirates have much less fiscal room.","modifiers":{"production_speed_buildings_factor":-0.12,"stability_factor":-0.06},"treatment":"Charter bargain, accession, solidarity and crisis mediation remove explicit parts. These are national reforms and survive a change of government."},{"id":"COLDWAR_UAE_scarce_specialists","label":"Scarce Specialists","description":"Oil revenue cannot instantly supply teachers, technicians, doctors or administrators.","modifiers":{"research_speed_factor":-0.1,"total_workforce_modifier":-0.08},"treatment":"Training or specialist recruitment provides an initial remedy; Technical Institutes completes the structural remedy."},{"id":"COLDWAR_UAE_water_power","label":"Water and Power Constraints","description":"Coastal expansion depends on costly water distribution, desalination and reliable generation.","modifiers":{"energy_use_multiplier":0.15,"civilian_factories_productivity":-0.05},"treatment":"Water for the Towns removes the productivity penalty and reduces the energy penalty to +5%; its own +6% operating contribution is still explicit."},{"id":"COLDWAR_UAE_narrow_revenues","label":"A Narrow Revenue Base","description":"The emirates possess valuable reserves, but only a small operating oil industry. Producing wells and offshore systems need costly investment; the broader productive and service economy remains thin.","modifiers":{"civilian_factories_productivity":-0.1,"offices_productivity":-0.1},"native_consequences":{"Starting base oil":"4 total: Abu Dhabi3 + Dubai1 instead of inherited47, a proposed91.49% reduction in mapped operating capacity.","Oil development":"Four once-paid focuses add8 /10 /15 /10 base oil for0.75 /2.50 /5.00 /8.00 billion. Nominal capacity after all four is47 before extraction modifiers or depletion.","Oil receipts":"Native prices and actual exports determine receipts; no duplicate percentage income debuff is added."},"treatment":"Paid expansion supplies operating oil. Oil downturn preparation and Earnings beyond Oil remove the two civilian penalty steps. Commercial Courts and Earnings beyond Oil remove the office penalty steps."},{"id":"COLDWAR_UAE_expatriate_workforce","label":"An Expatriate Workforce","description":"Imported workers expand the labour force without giving the rulers an equivalent citizen military reserve.","modifiers":{"total_workforce_modifier":0.1,"conscription_factor":-0.2},"treatment":"A structural trade-off. Residency and education do not silently convert migrants into recruitable citizens; no mass citizenship decision is assumed."}],"programme_rules":{"approval":"CONCEPT ONLY. No loaded focus, history, character, idea, decision, on-action, GFX or localisation file is changed. All new proposed IDs begin COLDWAR_UAE_.","politics":"Use the existing outlook and exact subparty system. Available checks gate meaningful programmes immediately when their governing party is in office. Fixed branches remain visible and locked, following MD Russia; no redundant outlook unlock focus.","lifecycle":"Persist earned progress separately from active government programmes. Recalculate enabled dynamic modifiers after government change, succession, load and a periodic fallback. When the qualifying party returns, restore only earned ongoing contributions; never rerun buildings, productivity grants, cash or diplomacy.","exact_parties":"The two internal paths in the Arab and Left clusters have exact-party conditions as well as their shared cluster gate. Moving between those parties suspends their branch-specific programme while common earned institutional gains remain. The presidency is not assumed from the ruling-party slot alone.","stacking":"Numbers in focus details are contributions, not whole-spirit replacements. One earned contribution per focus, counted once. Political positive stability contributions have a combined +15 percentage-point cap per currently active programme, all negatives remain. Economic and military contributions otherwise add as shown; mutually exclusive alternatives never stack.","national_reforms":"Starting-spirit remedies are permanent and order independent. Recompute each component from its immutable original value plus once-earned remedy credits, strongest credit within a shared stage family, then clamp at zero. A target stage is converted to its relief against the original component, never written onto the current value. Charter and Zayed construction relief combine; army integration stages use the strongest relief, not a sum. Never replay one-time rewards or turn deletion of a penalty into an extra positive modifier. Accepted crisis settlements add their own once-earned credits; rejection adds none.","conditional_deals":"State Participation +15% oil export revenue activates only after its contract is accepted. Nine-state +1 investment capacity activates only with an accepted broad federation settlement. The focus unlocks an offer, not acceptance. Training Agreements and Across the Blocs grant only their contract decisions, never the listed contract rewards immediately.","money":"Cash values are MD billions. Costed focuses require funds at completion. Decisions freeze their GDP-based price at offer/start, show the concrete numeric debit, recheck acceptance and feasibility, and execute atomically once. No implicit debt or free money on rejection.","projects":"All promised factories, offices and fossil plants are QUEUED with ordinary native construction, staffing and energy requirements; the small cash fee funds preparation only. State179=Dubai, state180=Abu Dhabi. Port levels require verified coastal provinces and capacity; no level11 Abu Dhabi port.","diplomacy":"Foreign players retain consent over treaties, equity contracts, GCC membership, bases, federation integration and transfers. Individual northern emirates are a political ledger inside the existing two UAE states. Bahrain/Qatar integration and non-state islands need explicit negotiated representation, not guessed map changes.","time":"Most focuses take21/35 days; major settlements49 days, matching Russia. Real event context remains: withdrawal1971, Islah1974, military union1976, GCC1981, oil slump1986. Earlier institutional models are labelled alternatives; no blanket year locks or forced historical wars. A Kuwait-invasion response is available from early Gulf Diplomacy whenever the invasion exists, independent of the later Gulf Crisis focus or the islands choices.","calibration":"Balance is proposed, not engine tested. StartGDP target0.686bn;1%=0.00686bn. Check actual new-game output before implementing. The starting OOB and equipment work remains deferred. No F-16 Block60 Cold War grant.","oil_programme":"Start with4 raw oil units: AbuDhabi3/Dubai1 instead of47. First development costs0.75bn for+8; onshore2.50bn for+10; offshore5.00bn for+15; second offshore8.00bn for+10. Total16.25bn for+43 base oil. Each phase requires actual funding, ownership/control and an unpaid project flag. The main onshore and offshore expansions are compatible and follow either ownership/services settlement.","oil_economy":"Apply reduced raw resources BEFORE the existing1970 GDP snapshot calibration, then freeze the native accounting offset once. This preserves the authored0.686bn initialGDP target without restoring oil units or oil export cash. Later oil phases grow endogenousGDP. Native demand, extraction, world prices and six-month depletion continue; nominal47 after all grants is not an output guarantee or periodic refill.","british_flow":"Start BOTH countries with British Withdrawal Announced spirits and the pre-existing schedule. The historical release executes on 1 December 1971 without a focus or new UK approval. The 1968 announced deadline was the end of 1971; the precise date is a labelled historical scenario convention. Initial focus choice: seek a mutually accepted protection extension or prepare the already-planned handover and negotiate optional earlier release/terms. Only accepted replacements change the baseline. Sovereign British Withdrawal still requires actual is_subject = no plus founder consent.","british_lifecycle":"Protection programmes need British subject status and an accepted compact, and suspend on release or a new overlord. Friendship requires a separate accepted independent-state treaty. A refusal permits a180-day retry or a new protection proposal; initial focus exclusions remain intact. Preserve the Council/interim administration until real formation rather than letting a character-expiry date create a federal president.","british_maturity":"A once-only new-1970 bootstrap creates the starting schedule and mirrored spirits. Daily/load observers and a scheduled callback execute the CURRENT starting-policy schedule or mutually accepted replacement once when due, without a new UK veto or focus gate. Pending/refused offers do not pause it. Keep origin, nonce and date in both countries; never restore the baseline over an accepted renewal on load. Timed-spirit expiry alone does not free UAE. No automatic payment, army, faction or war is bundled into release."},"modifier_labels":{"political_power_factor":["Political power gain","percent"],"stability_factor":["Stability","percent"],"production_speed_buildings_factor":["Construction speed","percent"],"production_speed_infrastructure_factor":["Infrastructure construction speed","percent"],"production_speed_offices_factor":["Office construction speed","percent"],"production_speed_naval_base_factor":["Naval base construction speed","percent"],"production_speed_industrial_complex_factor":["Civilian factory construction speed","percent"],"production_speed_arms_factory_factor":["Military factory construction speed","percent"],"research_speed_factor":["Research speed","percent"],"civilian_factories_productivity":["Civilian sector productivity","percent"],"offices_productivity":["Office sector productivity","percent"],"oil_export_multiplier_modifier":["Oil export revenue multiplier","percent"],"education_cost_multiplier_modifier":["Education spending multiplier","percent"],"bureaucracy_cost_multiplier_modifier":["Bureaucracy spending multiplier","percent"],"army_personnel_cost_multiplier_modifier":["Military personnel spending multiplier","percent"],"equipment_cost_multiplier_modifier":["Military equipment spending multiplier","percent"],"health_cost_multiplier_modifier":["Health spending multiplier","percent"],"energy_use_multiplier":["Energy consumption","percent"],"fossil_pp_energy_generation_modifier":["Fossil power generation","percent"],"energy_gain_multiplier":["Energy generation","percent"],"country_productivity_growth_modifier":["Productivity growth multiplier","percent"],"productivity_growth_modifier":["Productivity growth input","flat"],"total_workforce_modifier":["Available workforce","percent"],"buildings_worker_requirement_modifier":["Building workforce requirements","percent"],"conscription_factor":["Recruitable population multiplier","percent"],"interest_rate_multiplier_modifier":["Annual interest rate","pp"],"return_on_investment_modifier":["Annual native investment return","fraction_pp"],"imp_sanction_resistance":["Imperia sanction resistance","percent"],"imp_oil_price_resistance":["Imperia consumer oil price resistance","percent"],"imp_investment_in_extra":["Additional concurrent inward investments","integer"],"army_org_factor":["Army organisation","percent"],"training_time_factor":["Training time","percent"],"supply_consumption_factor":["Supply consumption","percent"],"industrial_capacity_factory":["Military factory output","percent"]},"starting_resources":{"label":"Limited Operating Oil Capacity","existing_base":{"179":7,"180":40},"proposed_base":{"179":1,"180":3},"total_existing":47,"total_proposed":4,"reduction_percent":91.49,"source_contract":"Validate the audited raw Dubai7 / AbuDhabi40 snapshot before applying the one-off reductions. No monthly resource reset.","setup_order":"New1970 campaign only: apply low-oil deltas BEFORE the existing1970 GDP calibration freezes its accounting offset. Retain the authored0.686bn GDP snapshot, fewer actual export units and less oil export cash. Never recalibrate after investment.","one_time_flag":"COLDWAR_UAE_low_oil_start_applied","proposed_effect_body":"# NEW1970 setup integration, BEFORE frozen GDP calibration; expected raw resources verified at compile time.\nif = {\n limit = {\n  original_tag = UAE\n  IMP_is_1970_scenario = yes\n  date < 1971.1.1\n  NOT = { has_country_flag = IMP_1970_gdp_profile_applied }\n  NOT = { has_country_flag = COLDWAR_UAE_low_oil_start_applied }\n  179 = { is_owned_by = ROOT is_controlled_by = ROOT }\n  180 = { is_owned_by = ROOT is_controlled_by = ROOT }\n }\n 179 = { add_resource = { type = oil amount = -6 } }\n 180 = { add_resource = { type = oil amount = -37 } }\n set_country_flag = COLDWAR_UAE_low_oil_start_applied\n ingame_update_setup = yes\n}","scope":"Base units represent operating capacity, not geological reserves or a historical barrels/day estimate. Technology, infrastructure, native prices and depletion remain active."},"oil_development":[{"focus":"COLDWAR_UAE_oil_accounts","phase":1,"treasury_billion":0.75,"days":70,"resources":{"180":8},"cumulative_base":12},{"focus":"COLDWAR_UAE_onshore_expansion","phase":2,"treasury_billion":2.5,"days":70,"resources":{"180":10},"cumulative_base":22},{"focus":"COLDWAR_UAE_offshore_expansion","phase":3,"treasury_billion":5,"days":105,"resources":{"180":12,"179":3},"cumulative_base":37},{"focus":"COLDWAR_UAE_offshore_second_phase","phase":4,"treasury_billion":8,"days":140,"resources":{"180":7,"179":3},"cumulative_base":47}],"british_treaties":{"record_contract":"Both countries START on 1 January 1970 with British Withdrawal Announced spirits and the same existing withdrawal schedule. Its origin is the British policy announced in 1968, not a newly signed independence request. Mirror one current schedule/compact ID, origin, nonce, terms and dates. Later bilateral agreements replace that record only on mutual acceptance; an unsigned offer creates no new signed-agreement spirit.","timer_contract":"Store a relative due date with the verified native global.date convention and GetDateStringNoHourLong display. A360-day term uses the native investment pattern: copy global.date, add8.64. Historical1December1971 uses a literal date trigger and an explicit English date, avoiding an invented numeric date conversion. Timed-idea expiry alone never frees the country.","delivery_contract":"The normal historical withdrawal is scheduled from the 1970 start and needs NO focus, UAE petition or new UK acceptance. Use 1 December 1971 as the explicitly labelled historical scenario execution date; the 1968 announcement specified the end of 1971, not that precise signed date. A daily/load observer and scheduled wake-up execute the current starting schedule or accepted replacement once. Recheck both countries, origin/nonce/date and actual British subject status. An unanswered or refused offer never pauses the baseline. If already free, close without replay; another overlord or annexation invalidates stale British delivery.","changes_contract":"An EARLIER release, negotiated handover terms or continued protection needs both countries’ agreement. A mutually accepted renewed compact can replace the starting withdrawal schedule only BEFORE its due date. Recheck the current nonce, both countries, actual British subject status and the unfulfilled schedule at acceptance; a late popup cannot postpone a deadline that is already due. Process the due release first. A pending, refused or expired renewal changes nothing. Handover-only cooperation preserves the existing date unless an explicit date amendment is accepted. UK cannot unilaterally postpone the baseline; government changes and focus completion do not reset it. Refusals permit renewed talks after180 days; only one current offer at a time.","continuity_contract":"While still protected, and while independent but not yet federated, retain an appropriate collective Council/interim administration. Do not let the existing1971.12.2 character expiry create a federal presidency or end the treaty. Respect individual ruler succession; do not freeze a named ruler or blindly cycle the native leader pool.","release_effect":"# UK-scoped delivery of the starting historical schedule OR a mutually accepted replacement.\nif = {\n limit = {\n  country_exists = UAE\n  UAE = { is_subject_of = ENG has_country_flag = COLDWAR_UAE_withdrawal_schedule_active }\n  COLDWAR_UAE_release_schedule_is_current_and_due = yes # NEW origin/nonce/date guard; no focus or fresh approval gate\n }\n end_puppet = UAE\n UAE = {\n  set_country_flag = COLDWAR_UAE_withdrawal_agreed\n  clr_country_flag = COLDWAR_UAE_protection_accepted\n  clr_country_flag = COLDWAR_UAE_withdrawal_schedule_active\n  set_country_flag = COLDWAR_UAE_release_contract_fulfilled\n  COLDWAR_UAE_sync_treaty_spirits = yes # NEW: mirror fulfilled date, stop subject-only benefits\n  ingame_update_setup = yes\n }\n}","variants":[{"id":"starting","label":"British Withdrawal Announced","status":"Starting state on 1 January 1970; withdrawal was announced on 16 January 1968","date_label":"Announced withdrawal deadline","date":"By the end of 1971","independence":"Historical scenario execution: 1 December 1971, automatically unless both countries agree to replace the schedule","uk_spirit":"COLDWAR_UAE_ENG_withdrawal_announced","uae_spirit":"COLDWAR_UAE_treaty_dependence","icon":"treaty3","uae_terms":["Start with this spirit and the existing withdrawal schedule; no independence petition is needed.","Until release, Britain retains the external-affairs and defence responsibilities represented by native subject rules.","Prepare local institutions. An earlier release or continued protection requires a new mutual agreement; refusing those proposals does not cancel the historical withdrawal."],"uk_terms":["Start with this spirit recording the withdrawal policy already announced in 1968: leave the Gulf by the end of 1971.","The historical scenario delivers release on 1 December 1971 without a new vote. That precise execution date is a scenario convention based on the later historical termination, not a date already signed in January 1970.","Continue existing responsibilities until release. Retaining protection requires UAE consent to a replacement compact."]},{"id":"scheduled","label":"Agreed British Withdrawal","status":"Signed; UAE remains a British subject until the agreed date","date_label":"Contractual independence","date":"1 December 1971","independence":"1 December 1971 — automatic delivery of the already accepted settlement","uk_spirit":"COLDWAR_UAE_ENG_withdrawal_treaty","uae_spirit":"COLDWAR_UAE_withdrawal_treaty","icon":"treaty3","uae_terms":["Accept the agreed handover timetable and prepare local institutions.","Remain under British protection until the release date; no independence purchase fee.","Actual independence opens British Withdrawal; federal founding still needs the rulers’ charter."],"uk_terms":["End the special treaty/subject relationship on 1 December 1971. No new approval is required when the date arrives.","Coordinate the agreed handover. Any paid aid, equipment transfer or continuing base access needs separate explicit terms."]},{"id":"protection","label":"Renewed Protection Compact","status":"Signed alternative: continued British protection","date_label":"Review date","date":"360 days after acceptance; example 27 December 1970 if signed 1 January 1970","independence":"No fixed independence date; review does not automatically free the country","uk_spirit":"COLDWAR_UAE_ENG_protection_compact","uae_spirit":"COLDWAR_UAE_protection_compact","icon":"align_to_britain3","uae_terms":["Retain the agreed limits on external sovereignty and the existing native subject obligations.","Fund the selected local training/commercial programme; no repeated 50% factory penalty is added.","A fixed independence date can be negotiated only by a mutually accepted amendment."],"uk_terms":["Accept continued special treaty protection rather than enforce the historical withdrawal policy.","Provide the agreed advisory/security cooperation. Cash, equipment or basing commitments require explicit accepted amounts.","Review the compact after 360 days; review expiry alone changes no sovereignty."]},{"id":"fulfilled","label":"Independence Agreement Fulfilled","status":"Completed; UAE is independent","date_label":"Independence delivered","date":"1 December 1971 in this historical example","independence":"Completed — the country is already free","uk_spirit":"COLDWAR_UAE_ENG_withdrawal_fulfilled","uae_spirit":"COLDWAR_UAE_withdrawal_fulfilled","icon":"accept_treaty","uae_terms":["The agreed release has taken effect. Federal formation is a separate local decision.","Keep a 30-day completed-agreement notice; no continuing protection bonus or second release."],"uk_terms":["The special treaty relationship has ended.","Keep the same 30-day completion record; new friendship or access arrangements require a new accepted agreement."]},{"id":"friendship","label":"UK–UAE Friendship Treaty","status":"Signed cooperation between independent states","date_label":"Independence status","date":"UAE is already independent; no future independence date is required","independence":"Already independent","uk_spirit":"COLDWAR_UAE_ENG_friendship_treaty","uae_spirit":"COLDWAR_UAE_friendship_treaty","icon":"treaty2","uae_terms":["Maintain agreed consultation and technical cooperation. Active UAE programme: research +3%, office productivity +6%, education spending +5%.","This treaty creates no subject relation, automatic faction, base rights or unconditional military guarantee."],"uk_terms":["Provide the accepted consultation and technical-cooperation access.","No automatic treasury debit, unit deployment or military guarantee; any paid offer receives its own numeric option."]}],"starting_state":{"active_on":"1970.1.1","origin":"British withdrawal policy announced 1968.1.16","announced_deadline":"By the end of 1971","historical_execution_date":"1971.12.1","requires_focus":false,"requires_new_uk_acceptance":false,"starts_with_both_spirits":true,"initialisation_contract":"Initialise once inside the existing NEW 1970 scenario setup when UAE is an ENG subject. Create the canonical starting-policy record and mirror the role-specific spirits to ENG and UAE before play. Mark treaty state initialised. Save/load and government changes only resynchronise that existing record; never recreate the baseline after a valid renewal, amendment or completed release.","bootstrap_effect":"# UAE scope, inside the existing new-1970-scenario bootstrap only.\nif = {\n limit = {\n  is_subject_of = ENG\n  NOT = { has_country_flag = COLDWAR_UAE_treaty_state_initialised }\n }\n set_country_flag = COLDWAR_UAE_treaty_state_initialised\n set_country_flag = COLDWAR_UAE_withdrawal_schedule_active\n COLDWAR_UAE_register_starting_withdrawal = yes # NEW: origin=1968 policy, current nonce, due=1971.12.1\n COLDWAR_UAE_sync_treaty_spirits = yes # NEW: starting role-specific spirits in BOTH countries\n}"},"date_options":[{"id":"immediate","label":"Immediate independence","acceptance":"Release on acceptance, record the actual date in both countries, then show a30-day fulfilled-agreement notice."},{"id":"historical","label":"Keep the historical withdrawal schedule","availability":"Already active at the 1970 start; no new offer or acceptance required.","maturity_trigger":"NOT = { date < 1971.12.1 }","display":"1 December 1971 (historical scenario execution)"},{"id":"negotiated_term","label":"A360-day transition","date_code":"set_variable = { COLDWAR_UAE_contract_due = global.date }\nadd_to_variable = { COLDWAR_UAE_contract_due = 8.64 }","display":"[?COLDWAR_UAE_contract_due.GetDateStringNoHourLong]"}],"spirit_implementation":"Install the British Withdrawal Announced role-specific spirits in BOTH countries at the 1970 start, reusing UAE treaty_dependence rather than stacking a second subject penalty. Preserve its single −10% political power contribution while UAE remains an ENG subject, including an accepted protection compact: relabel the existing carrier or transfer that contribution exactly once, never drop or duplicate it. Mirror record origin, nonce, execution date and status. Distinguish the announced end-1971 deadline from the historical scenario execution on 1 December. Later signed agreements replace the starting spirits together only on mutual acceptance. Active effects read actual subject/free status and accepted programme flags. An unsigned offer adds no new signed-agreement spirit and cannot erase or pause the starting schedule."},"references":["HISTO #coldwar-uae-concept{--uae-bg:#222e34;--uae-panel:#354146;--uae-deep:#19272d;--uae-text:#e6e5d6;--uae-muted:#b9c5c7;--uae-gold:#d6c38c;--uae-line:#97aaac;--uae-red:#d9a287;color:var(--uae-text);font-family:Georgia,serif}

#coldwar-uae-concept .uae-header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;border-bottom:2px solid #91835a;background:linear-gradient(#485358,#303c42)}

#coldwar-uae-concept .uae-header span{font-family:Arial,sans-serif;color:var(--uae-gold)}
#coldwar-uae-concept .uae-status{max-width:180px;text-align:right}
#coldwar-uae-concept .uae-tools{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:12px;background:var(--uae-deep);font-family:Arial,sans-serif}
#coldwar-uae-concept .uae-tools label{flex:1 1 245px;min-width:0;color:var(--uae-muted)}
#coldwar-uae-concept select{display:block;width:100%;max-width:100%;margin-top:5px;padding:8px;color:var(--uae-text);background:#35454b;border:1px solid #7f8b85;font:inherit}

#coldwar-uae-concept .uae-camera,#coldwar-uae-concept .uae-navigation{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:Arial,sans-serif}
#coldwar-uae-concept .uae-camera{flex-basis:100%}
#coldwar-uae-concept .uae-camera button,#coldwar-uae-concept .uae-navigation button{padding:8px 10px;border:1px solid #838d7b;background:linear-gradient(#4d5754,#35433d);border-radius:2px}
#coldwar-uae-concept .uae-camera button:hover,#coldwar-uae-concept .uae-navigation button:hover{border-color:var(--uae-gold)}

#coldwar-uae-concept .uae-map-key{position:absolute;bottom:10px;left:10px;right:10px;width:fit-content;max-width:calc(100% - 20px);background:#19272deb;padding:6px 9px;font-family:Arial,sans-serif;color:var(--uae-muted);pointer-events:none}
#coldwar-uae-concept .uae-legend{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--uae-deep);font-family:Arial,sans-serif;color:var(--uae-muted)}
#coldwar-uae-concept .uae-navigation{padding:10px 14px;background:var(--uae-deep);border-top:1px solid #58676b}
#coldwar-uae-concept .uae-inspector{padding:18px;background:var(--uae-panel);overflow-wrap:anywhere;font-family:Arial,sans-serif}
#coldwar-uae-concept .uae-inspector h3{font-family:Georgia,serif;font-weight:500;color:var(--uae-gold);margin:0 0 8px}
#coldwar-uae-concept .uae-inspector h4{font-weight:500;margin-bottom:6px}
#coldwar-uae-concept .uae-inspector p{margin:8px 0}
#coldwar-uae-concept .uae-inspector li{margin:5px 0}
#coldwar-uae-concept .uae-inspector details{margin-top:12px}
#coldwar-uae-concept pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--uae-deep);padding:12px;color:var(--uae-text)}
#coldwar-uae-concept .uae-spirit{padding:12px 0;border-bottom:1px solid #6a7779}
#coldwar-uae-concept .uae-branch-index{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#coldwar-uae-concept .uae-branch-index button{border:1px solid #7d8981;background:var(--uae-deep);padding:6px 8px;font-family:Arial,sans-serif}
@media(max-width:500px){#coldwar-uae-concept .uae-header{padding:12px;gap:10px}#coldwar-uae-concept .uae-status{max-width:130px}#coldwar-uae-concept .uae-map{height:510px}#coldwar-uae-concept select{font-size:16px}#coldwar-uae-concept .uae-camera button,#coldwar-uae-concept .uae-navigation button{min-height:44px}#coldwar-uae-concept .uae-inspector{padding:12px}}
</style>
<script>
(()=>{
 const root=document.getElementById('coldwar-uae-concept');
 const data=JSON.parse(document.getElementById('uae-data').textContent);
 const map=root.querySelector('#uae-map'),world=root.querySelector('#uae-world'),svg=root.querySelector('.uae-links');
 const select=root.querySelector('#uae-branch'),government=root.querySelector('#uae-government'),detail=root.querySelector('#uae-detail'),meta=root.querySelector('#uae-meta');
 const nodes=new Map(data.nodes.map(n=>[n.id,n])),groups=new Map(data.groups.map(g=>[g.id,g]));
 for(const n of data.nodes){n.ownership=groups.get(n.group).ownership;n.active_condition??=n.available;}
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pos=n=>({x:n.xy[0]*96,y:n.xy[1]*130});
 let current='british',picked='COLDWAR_UAE_treaty_coast',mode='tree',camera={x:0,y:0,z:1},drag=null,cameraMode='native',suppressClickUntil=0,wheelSave;
 const sections=[['shared','National development'],['nationalist','Nationalist programmes'],['emerging','Emerging programmes'],['nonaligned','Non-Aligned programmes'],['western','Western programmes']];
 for(const [id,title] of sections){const optgroup=document.createElement('optgroup');optgroup.label=title;for(const g of data.groups.filter(g=>g.outlook===id)){const o=document.createElement('option');o.value=g.id;o.textContent=g.label;optgroup.append(o);}select.append(optgroup);}
 function svgEl(tag,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);return el;}
 const width=Math.max(...data.nodes.map(n=>pos(n).x))+350,height=Math.max(...data.nodes.map(n=>pos(n).y))+220;
 world.style.width=width+'px';world.style.height=height+'px';svg.setAttribute('width',width);svg.setAttribute('height',height);
 for(const n of data.nodes){const p=pos(n);for(const row of n.prerequisites)for(const id of row){const q=pos(nodes.get(id)),x1=q.x+80,y1=q.y+90,x2=p.x+80,y2=p.y-26,mid=(y1+y2)/2;const line=svgEl('path',{class:'prerequisite',d:`M${x1},${y1} V${mid} H${x2} V${y2}`});line.dataset.from=id;line.dataset.to=n.id;svg.append(line);}
  for(const id of n.mutually_exclusive){if(id<n.id)continue;const q=pos(nodes.get(id)),x1=Math.min(p.x,q.x)+139,x2=Math.max(p.x,q.x)+27,y=p.y+20;svg.append(svgEl('path',{class:'exclusive',d:`M${x1},${y} H${x2}`}));const t=svgEl('text',{class:'choice-cross',x:(x1+x2)/2,y:y-5});t.textContent='×';svg.append(t);}
  const b=document.createElement('button');b.type='button';b.className='uae-node cursor-interaction';b.dataset.node=n.id;b.setAttribute('aria-label',n.title);b.setAttribute('data-tooltip',n.title);b.setAttribute('aria-pressed','false');b.style.left=p.x+'px';b.style.top=p.y+'px';b.innerHTML=`<img class="uae-icon" src="${data.assets.icons[n.icon]}" alt=""><img class="uae-titlebar" src="${data.assets.unavailable}" alt=""><span class="uae-title">${esc(n.title)}</span>`;world.append(b);
 }
 for(const g of data.groups){const list=data.nodes.filter(n=>n.group===g.id),xs=list.map(n=>pos(n).x),ys=list.map(n=>pos(n).y);const label=document.createElement('div');label.className='uae-group-label';label.textContent=g.label;label.style.left=((Math.min(...xs)+Math.max(...xs))/2+82-300)+'px';label.style.top=(Math.min(...ys)-90)+'px';world.append(label);}
 const atlas=new Image();atlas.onload=()=>{for(const b of world.querySelectorAll('.uae-node')){const n=nodes.get(b.dataset.node),canvas=document.createElement('canvas');canvas.width=147;canvas.height=20;canvas.setAttribute('aria-hidden','true');const ctx=canvas.getContext('2d'),chars=[...n.title],glyphs=data.assets.font_glyphs,kern=data.assets.font_kernings;const total=chars.reduce((s,c,i)=>s+(glyphs[c.codePointAt(0)]||glyphs[63])[6]+(i?(kern[chars[i-1].codePointAt(0)+','+c.codePointAt(0)]||0):0),0);let x=Math.floor((147-total)/2),previous=null;for(const c of chars){const cp=c.codePointAt(0),g=glyphs[cp]||glyphs[63];x+=kern[previous+','+cp]||0;ctx.drawImage(atlas,g[0],g[1],g[2],g[3],x+g[4],2+g[5],g[2],g[3]);x+=g[6];previous=cp;}b.querySelector('.uae-title').replaceChildren(canvas);}};atlas.src=data.assets.font_atlas;
 const treatyStatus=root.querySelector('#uae-treaty-status');
 const activeGroups={monarchy:['monarchy'],constitutional:['constitutional'],arab_civil:['arab'],arab_officers:['arab'],left_communist:['left'],left_social:['left'],islah:['islah']};
 function available(n){const state=treatyStatus.value,independent=['free','friendship'].includes(state);if(n.diplomatic_state_gate==='independent'&&!independent)return false;if(n.diplomatic_state_gate==='british_subject'&&!['subject','transition','loyal'].includes(state))return false;if(n.diplomatic_state_gate==='british_or_independent'&&state==='other')return false;if(n.diplomatic_state_gate==='protection_agreed'&&state!=='loyal')return false;if(government.value==='all')return true;const g=groups.get(n.group);if(g.outlook==='shared')return true;if(!(activeGroups[government.value]||[]).includes(n.group))return false;
 const party={COLDWAR_UAE_civilian_arabism:'arab_civil',COLDWAR_UAE_officers_republic:'arab_officers',COLDWAR_UAE_social_ownership:'left_communist',COLDWAR_UAE_social_market:'left_social'};return !party[n.id]||party[n.id]===government.value;}
 function paintGovernment(){for(const b of world.querySelectorAll('.uae-node')){const n=nodes.get(b.dataset.node),ok=available(n);b.classList.toggle('is-locked',!ok);b.querySelector('.uae-titlebar').src=ok?data.assets.available:data.assets.unavailable;}root.querySelector('#uae-total').textContent=`${data.nodes.length} focuses · ${data.decisions.length} decisions · 7 starting spirits`;}
 function transform(){world.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.z})`;world.classList.toggle('overview',camera.z<.30);root.querySelector('#uae-zoom').textContent=Math.round(camera.z*100)+'%';}
 function bounds(all=false){const list=all?data.nodes:data.nodes.filter(n=>n.group===current),ps=list.map(pos);return{left:Math.min(...ps.map(p=>p.x))-25,top:Math.min(...ps.map(p=>p.y))-100,right:Math.max(...ps.map(p=>p.x))+195,bottom:Math.max(...ps.map(p=>p.y))+140};}
 function fit(all=false,native=false){cameraMode=all?'overview':native?'native':'fit';const b=bounds(all),w=map.clientWidth,h=map.clientHeight-root.querySelector('.uae-map-key').offsetHeight-18;camera.z=native?1:Math.min(1,(w-30)/(b.right-b.left),(h-30)/(b.bottom-b.top));camera.x=(w-(b.right-b.left)*camera.z)/2-b.left*camera.z;camera.y=native?45-b.top:(h-(b.bottom-b.top)*camera.z)/2-b.top*camera.z;transform();}
 function zoom(f,cx=map.clientWidth/2,cy=map.clientHeight/2){cameraMode='manual';const z=Math.max(.04,Math.min(1.6,camera.z*f));camera.x=cx-(cx-camera.x)*z/camera.z;camera.y=cy-(cy-camera.y)*z/camera.z;camera.z=z;transform();}
 function state(){return{modelContent:{country:'UAE1970',selectedProgramme:groups.get(current)?.label,selectedFocus:nodes.get(picked)?.title,government:government.value,treatyStatus:treatyStatus.value,view:mode},privateContent:{version:5,current,picked,government:government.value,treatyStatus:treatyStatus.value,mode,camera:{...camera},cameraMode}};}
 function remember(){window.openai?.setWidgetState?.(state()).catch(()=>{});}
 function pick(n){picked=n.id;for(const b of world.querySelectorAll('.uae-node'))b.setAttribute('aria-pressed',String(b.dataset.node===picked));
  const pre=n.prerequisites.map(row=>row.map(id=>nodes.get(id).title).join(' OR ')).join(' AND ')||'Entry focus — no redundant party unlock';
  detail.innerHTML=`<h3>${esc(n.title)}</h3><p>${n.days} days · x=${n.xy[0]}, y=${n.xy[1]} · ${esc(n.historical_status)}</p><p>${esc(n.description)}</p><p>Prerequisite: ${esc(pre)}</p>${n.mutually_exclusive.length?`<p>Exclusive with: ${esc(n.mutually_exclusive.map(id=>nodes.get(id).title).join(' / '))}</p>`:''}<p>Government / context: ${esc(n.available.replace(/\n/g," · "))}</p>${n.bypass?`<p>Bypass: ${esc(n.bypass)}. ${esc(n.bypass_contract)}</p>`:""}<h4>Proposed effects and costs</h4><ul>${n.reward_summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${n.modifiers.stability_factor>0&&groups.get(n.group).outlook!=='shared'?'<p>Positive stability is a package contribution: min(total positive political-programme contributions, +15 percentage points) + all negative contributions. Starting penalties and permanent national reforms remain separate.</p>':''}<p>Ownership: ${esc(n.ownership)}</p><details><summary>Party, leader and delivery conditions</summary><pre>${esc(n.available)}</pre>${n.requirement_contracts.map(r=>`<p>${esc(r.meaning)}</p><pre>${esc(r.proposed_code)}</pre>`).join('')}<p>Active modifier condition:</p><pre>${esc(n.active_condition)}</pre></details><details><summary>Native effect body and proposed integration</summary><pre>${esc(n.effect_body)}</pre><p>Proposed effect body. Verified MD leaf APIs require the described eligibility, affordability and building-capacity guards. COLDWAR_UAE helpers, flags, spirit stage changes and diplomacy wrappers are NEW design work. Modifier contributions need registered dynamic modifiers before they can work. A queued building is not a completed building.</p>${Object.keys(n.modifiers).length?`<pre>${esc(Object.entries(n.modifiers).map(([k,v])=>`${k} = ${v}`).join('\n'))}</pre>`:''}</details>`;
 }
 function branch(native=true){mode='tree';select.value=current;const g=groups.get(current),list=data.nodes.filter(n=>n.group===current);meta.textContent=`${g.label} · ${list.length} focuses${current==='oil'?' · Start:4 base oil · Full expansion:$16.25bn':''} · ${g.outlook==='shared'?'National programme':'Governing-party / office programme'}${available(list[0])?'':' · Unavailable in this government view'}`;pick(nodes.get(picked)?.group===current?nodes.get(picked):list[0]);fit(false,native);}
 function overview(){mode='overview';meta.textContent=`Entire tree · Three compact tiers · ${data.groups.length} programme areas · Native grid 96 × 130`;fit(true);detail.innerHTML='<h3>The Complete Emirati Programme</h3><div class="uae-branch-index">'+data.groups.map(g=>`<button type="button" data-group="${g.id}">${esc(g.label)}</button>`).join('')+'</div>';}
 function showSpirits(){mode='spirits';detail.innerHTML='<h3>Starting Situation · January 1970</h3>'+data.starting_spirits.map(s=>`<article class="uae-spirit"><h4>${esc(s.label)}</h4><p>${esc(s.description)}</p><ul>${Object.entries(s.modifiers).map(([k,v])=>`<li>${esc(data.modifier_labels[k][0])}: ${v>0?'+':''}${(v*100).toFixed(0)}%</li>`).join('')}${Object.entries(s.native_consequences||{}).map(([k,v])=>`<li>${esc(k)}: ${esc(v)}</li>`).join('')}</ul>${s.native_system?`<p>${esc(s.native_system)}</p>`:''}<p>${esc(s.treatment)}</p></article>`).join('');}
 function showDecisions(){mode='decisions';const list=data.decisions.filter(d=>d.group===current);detail.innerHTML=`<h3>${esc(groups.get(current).label)} · Decisions</h3>`+list.map(d=>`<details open><summary>${esc(d.label)} · ${d.pp} PP · ${d.days} days</summary><p>${esc(d.summary)}</p><p>Unlock: ${esc(nodes.get(d.unlock)?.title||'Available from start')}</p>${d.effect_code?`<pre>${esc(d.effect_code)}</pre>`:''}</details>`).join('');}
 function rules(){mode='rules';detail.innerHTML='<h3>Government and Programme Rules</h3><ul>'+Object.values(data.programme_rules).filter(v=>typeof v==='string').map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul><p>MD 2.0.2 reference: native 96 × 130 grid, actual focus icons, titlebars and Ubuntu Bold 16 atlas. Connector routing, shine and availability are browser approximations. Government view demonstrates party gates, not full prerequisite or world-state eligibility. All programme balance and COLDWAR_UAE integration are proposed. No loaded game files changed.</p>';}
 root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.node){const n=nodes.get(b.dataset.node);current=n.group;select.value=current;mode='tree';pick(n);}else if(b.dataset.group){current=b.dataset.group;picked='';branch();}else if(b.id==='uae-overview')overview();else if(b.id==='uae-native'){branch(true);}else if(b.id==='uae-fit'){branch(false);}else if(b.id==='uae-minus')zoom(1/1.2);else if(b.id==='uae-plus')zoom(1.2);else if(b.id==='uae-spirits')showSpirits();else if(b.id==='uae-decisions')showDecisions();else if(b.id==='uae-treaties')showTreaties();else if(b.id==='uae-rules')rules();remember();});
 select.addEventListener('change',()=>{current=select.value;picked='';branch();remember();});government.addEventListener('change',()=>{paintGovernment();if(mode==='tree')branch();remember();});
 map.addEventListener('wheel',ev=>{ev.preventDefault();ev.stopPropagation();const r=map.getBoundingClientRect();if(ev.ctrlKey||ev.metaKey){if(ev.deltaY)zoom(Math.exp(-ev.deltaY*.002),ev.clientX-r.left,ev.clientY-r.top);}else{const unit=ev.deltaMode===1?16:ev.deltaMode===2?map.clientHeight:1;cameraMode='manual';camera.x-=(ev.shiftKey?ev.deltaX+ev.deltaY:ev.deltaX)*unit;camera.y-=ev.shiftKey?0:ev.deltaY*unit;transform();}clearTimeout(wheelSave);wheelSave=setTimeout(remember,180);},{passive:false});
 map.addEventListener('pointerdown',ev=>{if(!ev.isPrimary||![0,1,2].includes(ev.button))return;suppressClickUntil=0;drag={x:ev.clientX,y:ev.clientY,cx:camera.x,cy:camera.y,id:ev.pointerId,moved:false};if(ev.button!==0)ev.preventDefault();});
 map.addEventListener('pointermove',ev=>{if(!drag||ev.pointerId!==drag.id)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<5)return;if(!drag.moved){drag.moved=true;map.setPointerCapture(ev.pointerId);map.classList.add('dragging');}ev.preventDefault();cameraMode='manual';camera.x=drag.cx+dx;camera.y=drag.cy+dy;transform();});
 function stop(ev){if(!drag||ev.pointerId!==drag.id)return;const done=drag;drag=null;if(map.hasPointerCapture(done.id))map.releasePointerCapture(done.id);map.classList.remove('dragging');if(done.moved){suppressClickUntil=performance.now()+400;remember();}}
 map.addEventListener('pointerup',stop);map.addEventListener('pointercancel',stop);map.addEventListener('lostpointercapture',ev=>{if(drag?.id===ev.pointerId)stop(ev);});
 map.addEventListener('click',ev=>{if(ev.detail&&performance.now()<suppressClickUntil){ev.preventDefault();ev.stopImmediatePropagation();}},true);
 map.addEventListener('contextmenu',ev=>ev.preventDefault());map.addEventListener('dragstart',ev=>ev.preventDefault());
 root.addEventListener('keydown',ev=>{if(['SELECT','INPUT','TEXTAREA'].includes(ev.target.tagName))return;const d={ArrowLeft:[80,0],ArrowRight:[-80,0],ArrowUp:[0,80],ArrowDown:[0,-80]}[ev.key];if(d){ev.preventDefault();cameraMode='manual';camera.x+=d[0];camera.y+=d[1];transform();remember();}});
 world.addEventListener('focusin',ev=>{if(drag)return;const n=nodes.get(ev.target.dataset.node);if(!n)return;const p=pos(n),x=p.x*camera.z+camera.x,y=p.y*camera.z+camera.y;if(x<0||x+165*camera.z>map.clientWidth||y<0||y+128*camera.z>map.clientHeight){cameraMode='manual';camera.x=map.clientWidth/2-(p.x+82)*camera.z;camera.y=map.clientHeight/2-(p.y+50)*camera.z;transform();}});
 function restore(value){if(drag)return;const s=value?.privateContent;if([4,5].includes(s?.version)&&groups.has(s.current)){current=s.current;picked=nodes.has(s.picked)?s.picked:'';government.value=s.government||'monarchy';treatyStatus.value=s.treatyStatus||'subject';paintGovernment();branch();if(s.mode==='overview')overview();else if(s.mode==='spirits')showSpirits();else if(s.mode==='decisions')showDecisions();else if(s.mode==='rules')rules();else if(s.mode==='treaties')showTreaties();if(s.camera&&[s.camera.x,s.camera.y,s.camera.z].every(Number.isFinite)){camera={...s.camera};cameraMode=s.cameraMode||'manual';transform();}}else{government.value='monarchy';paintGovernment();branch();}}
 window.addEventListener('openai:set_globals',ev=>restore(ev.detail?.globals?.widgetState));let measured=map.clientWidth;new ResizeObserver(()=>{const next=map.clientWidth;if(Math.abs(next-measured)>3){const change=next-measured;measured=next;if(cameraMode==='overview')fit(true);else if(cameraMode==='fit')fit(false);else{camera.x+=change/2;transform();}}}).observe(map);restore(window.openai?.widgetState);
// Inserted in the existing native focus-view closure; all interaction is local.
function showTreaties(){
 mode='treaties';
 const selection=treatyStatus.value;
 const variantId={subject:'starting',transition:'scheduled',loyal:'protection',free:'fulfilled',friendship:'friendship'}[selection];
 if(!variantId){detail.innerHTML='<h3>No active UK release agreement in this view</h3><p>The UAE is subject to another overlord. A stale British offer cannot release that relationship, and the sovereign formation focus remains locked.</p>';return;}
 const agreement=data.british_treaties.variants.find(v=>v.id===variantId);
 const cards=[['United Kingdom','uk_spirit','uk_terms'],['UAE / Trucial States','uae_spirit','uae_terms']].map(([country,spirit,terms])=>
  `<article class="uae-treaty-card"><div class="uae-treaty-heading"><img src="${data.assets.icons[agreement.icon]}" alt=""><div><h4>${esc(country)}</h4><p>${esc(agreement.label)}</p></div></div><dl><dt>Status</dt><dd>${esc(agreement.status)}</dd><dt>${esc(agreement.date_label)}</dt><dd class="uae-treaty-date">${esc(agreement.date)}</dd><dt>Independence</dt><dd>${esc(agreement.independence)}</dd></dl><ul>${agreement[terms].map(t=>'<li>'+esc(t)+'</li>').join('')}</ul><details><summary>Proposed national spirit</summary><code>${esc(agreement[spirit])}</code></details></article>`).join('');
 detail.innerHTML=`<h3>UK–UAE Agreement · Paired National Spirits</h3><div class="uae-treaty-grid">${cards}</div><details><summary>Agreement dates and execution</summary><p>${esc(data.british_treaties.timer_contract)}</p><p>${esc(data.british_treaties.delivery_contract)}</p><p>${esc(data.british_treaties.changes_contract)}</p><pre>${esc(data.british_treaties.release_effect)}</pre></details>`;
}
treatyStatus.addEventListener('change',()=>{paintGovernment();if(mode==='treaties')showTreaties();else if(mode==='tree')branch();remember();});

})();
</script>
<style>
#coldwar-uae-concept .uae-treaty-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px}
#coldwar-uae-concept .uae-treaty-heading{display:flex;align-items:center;gap:12px}
#coldwar-uae-concept .uae-treaty-heading img{width:80px;height:80px;object-fit:contain}
#coldwar-uae-concept .uae-treaty-heading h4{margin:0;color:var(--uae-gold)}
#coldwar-uae-concept .uae-treaty-card dt{color:var(--uae-muted);margin-top:12px}
#coldwar-uae-concept .uae-treaty-card dd{margin:3px 0 8px}
#coldwar-uae-concept .uae-treaty-date{color:var(--uae-gold)}
</style></main></html>
