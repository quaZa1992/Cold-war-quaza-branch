<!-- IMPERIA COLD WAR — SSR concept preview wrapper. -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:14px Arial;background:#20262a;color:#e5e2d5}</style></head><body><!-- IMPERIA COLD WAR — Universal SSR focus approval concept. -->
<div id="coldwar-ssr-concept">
  <div class="ssr-header"><div><strong>IMPERIA COLD WAR</strong><h2>Republican Focus Programme</h2></div><span>APPROVAL CONCEPT</span></div>
  <div class="ssr-controls">
    <label>Republic<select id="ssr-country" aria-label="Republic"></select></label>
    <label>Chapter<select id="ssr-chapter" aria-label="Focus chapter"></select></label>
    <label>Political status<select id="ssr-status" aria-label="Political status"><option value="ssr">Soviet republic</option><option value="independent">Independent republic</option></select></label>
    <label>Government<select id="ssr-government" aria-label="Governing organisation"></select></label>
  </div>
  <div class="ssr-heading"><strong id="ssr-context"></strong><span id="ssr-count"></span></div>
  <div class="ssr-navigation"><button type="button" id="ssr-overview">Whole tree</button><button type="button" id="ssr-fit">Fit chapter</button><button type="button" id="ssr-native">100%</button><button type="button" id="ssr-minus" aria-label="Zoom out">-</button><span id="ssr-zoom">100%</span><button type="button" id="ssr-plus" aria-label="Zoom in">+</button></div>
  <div id="ssr-map" role="region" aria-label="SSR focus tree. Drag to pan. Every focus can be selected, including locked alternatives."><div id="ssr-world"><svg id="ssr-lines" aria-hidden="true"></svg><div id="ssr-nodes"></div><div id="ssr-headings"></div><div id="ssr-continuous">Continuous Focuses</div></div></div>
  <div class="ssr-legend"><span>Solid: prerequisites</span><span>Red link: mutually exclusive</span><span>LOCKED: requirements not met</span><span>Native art and grid; conceptual connector routing</span></div>
  <div class="ssr-navigation"><button type="button" id="ssr-specialisations">Specialisations</button><button type="button" id="ssr-market">Market and privatisation</button><button type="button" id="ssr-start">Starting spirits</button><button type="button" id="ssr-transition">Independence aftermath</button><button type="button" id="ssr-politics">Political roster</button><button type="button" id="ssr-rules">Lifecycle and sources</button></div>
  <section id="ssr-detail" aria-live="polite"><p>Loading the republican programme.</p></section>
</div>
<style>
#coldwar-ssr-concept{--ssr-bg:#222b2c;--ssr-panel:#303b3b;--ssr-text:#e8e3d4;--ssr-muted:#c1c6ba;--ssr-line:#929d82;--ssr-gold:#dbc47e;--ssr-red:#ca8580;font:14px Arial,sans-serif;color:var(--ssr-text);max-width:100%;box-sizing:border-box}
#coldwar-ssr-concept *{box-sizing:border-box}
#coldwar-ssr-concept .ssr-header{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#293233;padding:16px 18px}
#coldwar-ssr-concept h2{font-size:21px;margin:6px 0 0;font-weight:500}
#coldwar-ssr-concept .ssr-header strong{color:var(--ssr-gold);font-size:12px;letter-spacing:1px}
#coldwar-ssr-concept .ssr-header>span{font-size:11px;color:var(--ssr-muted);padding-right:70px}
#coldwar-ssr-concept .ssr-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;background:var(--ssr-panel)}
#coldwar-ssr-concept label{display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:0}
#coldwar-ssr-concept select{width:100%;min-width:0;border:1px solid #77816f;padding:9px 6px;border-radius:2px;background:#202b2b;color:var(--ssr-text);font:14px Arial}
#coldwar-ssr-concept button{font:14px Arial;color:var(--ssr-text);background:#3a4642;border:1px solid #6d7969;border-radius:2px;padding:8px 10px;cursor:var(--cursor-interaction,pointer)}
#coldwar-ssr-concept button:hover{background:#4a574b}
#coldwar-ssr-concept .ssr-heading{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;background:var(--ssr-bg)}
#coldwar-ssr-concept .ssr-heading strong{font-weight:500}
#coldwar-ssr-concept .ssr-heading span{font-size:12px;color:var(--ssr-muted)}
#coldwar-ssr-concept .ssr-navigation{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:var(--ssr-bg)}
#coldwar-ssr-concept #ssr-map{height:540px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 45% 30%,#3d4741,#202828 90%);touch-action:none;cursor:grab;user-select:none}
#coldwar-ssr-concept #ssr-world{position:absolute;top:0;left:0;transform-origin:0 0;width:11500px;height:9000px}
#coldwar-ssr-concept #ssr-lines{position:absolute;inset:0;width:11500px;height:9000px;pointer-events:none;overflow:visible}
#coldwar-ssr-concept .ssr-edge{stroke:var(--ssr-line);stroke-width:2;fill:none}
#coldwar-ssr-concept .ssr-exclusive{stroke:var(--ssr-red);stroke-width:2;fill:none;stroke-dasharray:5 4}
#coldwar-ssr-concept .ssr-node{position:absolute;width:165px;height:128px;padding:0;border:0;background:transparent;display:block;cursor:var(--cursor-interaction,pointer)}
#coldwar-ssr-concept .ssr-node:hover{background:radial-gradient(ellipse,#8d956844,transparent 68%)}
#coldwar-ssr-concept .ssr-node[aria-pressed="true"] .ssr-icon{filter:drop-shadow(0 0 5px #e8cc78)}
#coldwar-ssr-concept .ssr-node.is-locked .ssr-icon{opacity:.64;filter:grayscale(.65)}
#coldwar-ssr-concept .ssr-node .ssr-icon{position:absolute;left:87.5px;top:20px;transform:translate(-50%,-50%);max-width:104px;max-height:104px;pointer-events:none}
#coldwar-ssr-concept .ssr-titlebar{position:absolute;left:5px;top:40px;width:164px;height:50px;pointer-events:none}
#coldwar-ssr-concept .ssr-title{position:absolute;left:15px;top:58px;width:147px;height:20px;pointer-events:none}
#coldwar-ssr-concept .ssr-lock{position:absolute;top:87px;right:29px;background:#25302c;color:#e1d9bd;font-size:10px;padding:1px 3px;pointer-events:none}
#coldwar-ssr-concept .ssr-node:not(.is-locked) .ssr-lock{display:none}
#coldwar-ssr-concept .ssr-chapter-label{position:absolute;width:840px;text-align:center;color:var(--ssr-gold);font-size:18px;font-weight:500;pointer-events:none}
#coldwar-ssr-concept #ssr-continuous{position:absolute;border:2px solid #697364;background:#293331;color:var(--ssr-gold);padding:18px;font-size:24px;pointer-events:none}
#coldwar-ssr-concept .ssr-legend{display:flex;flex-wrap:wrap;gap:8px 18px;background:var(--ssr-bg);padding:10px 14px;color:var(--ssr-muted);font-size:11px}
#coldwar-ssr-concept #ssr-detail{padding:18px;background:#293333;min-height:220px;overflow-wrap:anywhere}
#coldwar-ssr-concept #ssr-detail h2{margin:0 0 10px;color:var(--ssr-gold)}
#coldwar-ssr-concept #ssr-detail h3{font-size:15px;font-weight:500;color:var(--ssr-gold);margin:18px 0 8px}
#coldwar-ssr-concept #ssr-detail p{line-height:1.6;margin:8px 0 12px}
#coldwar-ssr-concept #ssr-detail ul{margin:8px 0;padding-left:21px;line-height:1.7}
#coldwar-ssr-concept .ssr-meta{color:var(--ssr-muted);font-size:12px;line-height:1.7}
#coldwar-ssr-concept .ssr-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
#coldwar-ssr-concept .ssr-detail-grid:has(.ssr-detail-grid){grid-template-columns:1fr;gap:6px}
#coldwar-ssr-concept .ssr-positive{color:#b7d89c}
#coldwar-ssr-concept .ssr-negative{color:#f0ae9e}
#coldwar-ssr-concept .ssr-neutral{color:var(--ssr-text)}
#coldwar-ssr-concept .ssr-prose{border-top:1px solid #546058;margin-top:16px;padding-top:10px}
#coldwar-ssr-concept .ssr-spirit{border-bottom:1px solid #536055;padding:4px 0 16px;margin-bottom:12px}
#coldwar-ssr-concept .ssr-lot{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin:10px 0}
#coldwar-ssr-concept a{color:#c5d5a6}
#coldwar-ssr-concept pre{white-space:pre-wrap;font-size:12px;line-height:1.6}
@media(max-width:550px){#coldwar-ssr-concept .ssr-controls{grid-template-columns:1fr}#coldwar-ssr-concept .ssr-detail-grid{grid-template-columns:1fr;gap:8px}#coldwar-ssr-concept .ssr-header>span{padding-right:0;max-width:82px}#coldwar-ssr-concept select{font-size:16px}#coldwar-ssr-concept #ssr-map{height:460px}#coldwar-ssr-concept button{min-height:40px}}
</style>

 if(!['all','ssr_all','spec_all','aftermath_all','parties_all',...groups.keys()].includes(state.chapter))state.chapter='secretariat';$('#ssr-chapter').value=state.chapter;

   for(const ps of n.prerequisites)for(const id of ps){const p=by.get(id);if(!p)continue;const sx=p.x*96+167.5,sy=p.y*130+160,dx=x+87.5,dy=y-32,mid=(sy+dy)/2;if(n.y-p.y>1){const corridor=dx+(n.x<p.x?-96:96),top=sy+4,bottom=dy-4;paths+='<path class="ssr-edge" d="M'+sx+' '+sy+' V'+top+' H'+corridor+' V'+bottom+' H'+dx+' V'+dy+'"/>';}else paths+='<path class="ssr-edge" d="M'+sx+' '+sy+' V'+mid+' H'+dx+' V'+dy+'"/>';}
   for(const id of n.exclusive||[])if(id>n.id){const ex=by.get(id);if(!ex)continue;if(n.choice_set==='union_specialisation'&&Math.abs(n.x-ex.x)>10)continue;if(n.market_course&&Math.abs(n.x-ex.x)>2)continue;const left=Math.min(n.x,ex.x)*96+80,right=Math.max(n.x,ex.x)*96+80;paths+='<path class="ssr-exclusive" d="M'+(left+145)+' '+(y+20)+' H'+(right+30)+'"/>';}

function price(share,weekly=false,income=false){

function gearRows(gears){
 return (gears||[]).map(e=>'<h3>'+esc(DATA.equipment_labels[e.target]||e.target)+'</h3><ul>'+Object.entries(e.modifiers).map(([k,v])=>'<li class="'+((v>0)!==/cost/.test(k)?'ssr-positive':'ssr-negative')+'">'+esc(DATA.gear_labels[k]||k)+' '+percent(v)+'</li>').join('')+'</ul>').join('');

function baseEffects(n){

 if(n.replace)h+='<li>Replace '+esc(n.replace)+' with '+esc(n.spirit)+'</li>';
 else if(n.remove)h+='<li>Remove '+esc(n.remove)+'</li>';
 if(Object.keys(n.modifiers).length){
  if(!n.replace)h+='<li>'+(n.effect_mode==='modify'?'Modify ':'Add ')+esc(n.spirit)+'</li>';
  h+=rows(n.display_modifiers||n.modifiers);
 }
 if(n.building){const b=n.building;h+='<li>'+esc(b.target)+': shared building slots +'+b.shared_slots+'</li><li>'+esc(b.target)+': '+esc(DATA.building_labels[b.type]||b.type)+' +'+b.level+'</li>';}
 if(n.research)h+='<li>'+n.research.uses+' x '+n.research.bonus*100+'% research bonus: '+esc(DATA.research_labels[n.research.category]||n.research.category)+'</li>';
 if(n.doctrine)h+='<li>'+n.doctrine.uses+' x '+n.doctrine.bonus*100+'% doctrine cost reduction: '+(n.doctrine.category==='land_doctrine'?'Land doctrine':esc(n.doctrine.category))+'</li>';
 for(const [key,label] of [['army_xp','Army'],['air_xp','Air'],['navy_xp','Naval']])if(n[key])h+='<li>'+label+' experience +'+n[key]+'</li>';
 if(n.stability)h+='<li>Stability '+sign(n.stability*100)+' percentage points</li>';
 if(n.decision)h+='<li>Unlock decisions: '+esc(n.decision)+'</li>';
 if(n.market_charter)h+='<li>Unlock decisions: Competitive Sale, Worker Buyout</li>';
 if(n.public_charter)h+='<li>Unlock decision: Public Retooling</li>';
 if(n.remove_exposure)h+='<li>Remove '+esc(n.remove_exposure)+'</li>';
 if(n.party_transfer){const t=n.party_transfer;h+='<li>'+esc(t.from_name)+': current party support -'+t.fraction*100+'% (relative)</li><li>'+esc(t.to_name)+': gain the transferred support</li>';}
 h+='</ul>'+gearRows(n.equipment_bonuses);
 for(const idea of n.timed_ideas||[])h+='<h3>Add '+esc(idea.name)+' ('+idea.days+' days)</h3><ul>'+rows(idea.modifiers)+'</ul>';
 for(const idea of n.persistent_ideas||[])h+='<h3>Add '+esc(idea.name)+'</h3><ul>'+rows(idea.modifiers)+'</ul>';
 if(n.specialisation){

 }
 if(n.preparation_effect)h+='<h3>On independence</h3><ul><li>Modify '+esc(n.preparation_effect.name)+'</li>'+rows(n.preparation_effect.delta)+'</ul>';
 for(const s of n.conditional_removals||[])h+='<h3>If currently has '+esc(s.name)+'</h3><ul><li>Remove '+esc(s.name)+'</li>'+rows(s.delta)+'</ul>';
 if(n.regional_aftercare){const s=n.regional_aftercare;h+='<h3>If currently has '+esc(s.old)+'</h3><ul><li>Replace '+esc(s.old)+' with '+esc(s.new)+'</li>'+rows(s.delta)+'</ul>';}
 if(n.exposure)h+='<h3>On independence</h3><ul><li>Add '+esc(n.exposure.name)+'</li>'+rows(n.exposure.modifiers)+'</ul>';

function spirits(){state.panel='start';const p=model.profile;detail.innerHTML='<h2>January 1970: '+esc(p.name)+'</h2><p>'+esc(p.context)+'.</p>'+[...DATA.starting,p.regional].map(s=>'<div class="ssr-spirit"><h3>'+esc(s.name)+'</h3><p>'+esc(s.description)+'</p><ul>'+rows(s.modifiers)+'</ul>'+(s.resolution?'<p class="ssr-meta">'+esc(s.resolution)+'</p>':'')+'</div>').join('')+'<p class="ssr-meta">These are proposed additional spirits. Existing laws, factions, autonomy and subject subsidies remain part of the economy and require a final country-by-country overlap check.</p>';}
function transition(){state.panel='transition';detail.innerHTML='<h2>Independence aftermath</h2><label>Separation settlement<select id="ssr-case">'+Object.entries(DATA.cases).map(([k,v])=>'<option value="'+k+'">'+esc(v.title)+'</option>').join('')+'</select></label><p>Existing national assets and completed institutional reforms survive. Ordinary Union programmes stop. The chosen specialisation retains 20% of each benefit, 75% of each penalty and half its weekly allocation. New liabilities are repaired through three concrete reforms for each spirit.</p><div id="ssr-transition-spirits"></div><p class="ssr-meta">Earlier separation is alternate history. The transition is modelled after documented supply, payments and administrative disruptions. War, ethnic conflict, a financial collapse and Soviet dissolution are not automatic outcomes.</p>';$('#ssr-case').value=state.case;const redraw=()=>{$('#ssr-transition-spirits').innerHTML=model.initial_transition[state.case].map(s=>'<div class="ssr-spirit"><h3>'+esc(s.name)+'</h3><p>'+esc(s.description)+'</p><ul>'+rows(s.modifiers)+'</ul></div>').join('');};$('#ssr-case').addEventListener('change',e=>{state.case=e.target.value;redraw();});redraw();}
function politics(){state.panel='politics';detail.innerHTML='<h2>Political organisations and programmes</h2><p>'+esc(model.profile.later)+' is a later historical counterpart. It is not inserted into the January 1970 roster.</p>'+model.profile.parties.map(p=>'<div class="ssr-spirit"><h3>'+esc(p.name)+'</h3><p class="ssr-meta">'+esc(p.status)+' | MD slot '+p.slot+'</p><p>'+esc(p.description.split('\n\n')[0])+'</p><button type="button" data-chapter="party_'+p.slot+'">Inspect programme</button></div>').join('');detail.querySelectorAll('[data-chapter]').forEach(b=>b.addEventListener('click',()=>{setChapter(b.dataset.chapter);inspect(model.nodes.find(n=>n.group===b.dataset.chapter).id);}));}
function rulePanel(){state.panel='rules';detail.innerHTML='<h2>Lifecycle and historical basis</h2>'+Object.entries(DATA.rules).filter(([k])=>k!=='status').map(([k,v])=>'<h3>'+esc(k.replaceAll('_',' '))+'</h3><p>'+esc(v)+'</p>').join('')+'<h3>Historical sources</h3><p><a href="https://seventeenmoments.web.illinois.edu/1936-2/stalin-constitution/stalin-constitution-texts/the-stalin-constitution/" target="_blank" rel="noreferrer">1936 Soviet Constitution</a> | <a href="https://www.elibrary.imf.org/view/book/9781557755193/ch01.xml" target="_blank" rel="noreferrer">IMF: Baltic transition</a> | <a href="https://www.elibrary.imf.org/view/IMF084/05300-9781557755186/05300-9781557755186/ch02.xml" target="_blank" rel="noreferrer">IMF: transition output decline</a></p><p class="ssr-meta">Main MD Generic and Russia supply the mechanical and spatial reference. All percentages and prices are balance proposals. Source inspection and a concept render do not establish in-game behaviour. No game content has been installed.</p>';}
$('#ssr-country').innerHTML=Object.values(DATA.models).map(m=>'<option value="'+m.profile.tag+'">'+esc(m.profile.name)+'</option>').join('');$('#ssr-country').value=state.country;$('#ssr-status').value=state.status;
$('#ssr-country').addEventListener('change',e=>{state.country=e.target.value;makeTree();persist();});$('#ssr-chapter').addEventListener('change',e=>setChapter(e.target.value));$('#ssr-status').addEventListener('change',e=>{state.status=e.target.value;renderStatus();persist();});$('#ssr-government').addEventListener('change',e=>{state.government=Number(e.target.value);renderStatus();});
$('#ssr-overview').addEventListener('click',()=>setChapter('all'));$('#ssr-fit').addEventListener('click',()=>fit());$('#ssr-native').addEventListener('click',nativeChapter);
function zoom(factor,x=map.clientWidth/2,y=map.clientHeight/2){const z=Math.max(.045,Math.min(1.8,state.z*factor)),ratio=z/state.z;state.tx=x-(x-state.tx)*ratio;state.ty=y-(y-state.ty)*ratio;state.z=z;camera();}
$('#ssr-plus').addEventListener('click',()=>zoom(1.25));$('#ssr-minus').addEventListener('click',()=>zoom(.8));
let drag=null;map.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty};map.setPointerCapture(e.pointerId);});map.addEventListener('pointermove',e=>{if(!drag)return;state.tx=drag.tx+e.clientX-drag.x;state.ty=drag.ty+e.clientY-drag.y;camera();});const release=e=>{drag=null;if(map.hasPointerCapture(e.pointerId))map.releasePointerCapture(e.pointerId);};map.addEventListener('pointerup',release);map.addEventListener('pointercancel',release);map.addEventListener('wheel',e=>{e.preventDefault();const r=map.getBoundingClientRect();zoom(e.deltaY>0?.9:1.1,e.clientX-r.left,e.clientY-r.top);},{passive:false});
$('#ssr-start').addEventListener('click',spirits);$('#ssr-transition').addEventListener('click',transition);$('#ssr-politics').addEventListener('click',politics);$('#ssr-rules').addEventListener('click',rulePanel);
$('#ssr-specialisations').addEventListener('click',()=>{setChapter('spec_all');programmePanel();});$('#ssr-market').addEventListener('click',()=>{setChapter('transition_economy');marketPanel();});
window.addEventListener('openai:set_globals',event=>{const restored=event.detail?.globals?.widgetState?.privateContent;if(!restored)return;const previous=[state.country,state.chapter,state.status].join('|');if(Object.hasOwn(DATA.models,restored.country))state.country=restored.country;if(['ssr','independent'].includes(restored.status))state.status=restored.status;if(restored.chapter)state.chapter=restored.chapter;if(restored.programme&&DATA.models[state.country].groups.some(g=>g.specialisation===restored.programme.key))state.programme=restored.programme;if(Object.hasOwn(DATA.market.courses,restored.marketCourse||''))state.marketCourse=restored.marketCourse;if(restored.restructuring&&typeof restored.restructuring==='object')state.restructuring=restored.restructuring;if(previous!==[state.country,state.chapter,state.status].join('|'))makeTree();else renderStatus();});
new ResizeObserver(()=>{if(['all','ssr_all','spec_all','aftermath_all','parties_all'].includes(state.chapter))fit();else nativeChapter();}).observe(map);makeTree();
root.ssrQA={data:DATA,state,inspect,makeTree,fit,setChapter,spirits,transition,politics,rulePanel,baseEffects,programmePanel,marketPanel};
}catch(error){detailError(error);}
function detailError(error){$('#ssr-detail').textContent='Preview could not load: '+error.message;throw error;}
})();
</script>
</body></html>
